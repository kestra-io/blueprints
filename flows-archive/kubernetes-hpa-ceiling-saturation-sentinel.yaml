id: kubernetes-hpa-ceiling-saturation-sentinel
namespace: company.sre

inputs:
  - id: kube_context
    type: STRING
    required: false
    description: Optional Kubernetes context name.
  - id: saturation_threshold
    type: INT
    defaults: 0
    description: Maximum acceptable count of HPAs operating at maxReplicas capacity ceiling.

tasks:
  - id: audit_hpa_ceilings
    type: io.kestra.plugin.scripts.shell.Commands
    containerImage: bitnami/kubectl:latest
    commands:
      - |
        CONTEXT_ARG=""
        if [ -n "{{ inputs.kube_context }}" ]; then
          CONTEXT_ARG="--context={{ inputs.kube_context }}"
        fi
        
        kubectl $CONTEXT_ARG get hpa -A -o json > /tmp/hpa_all.json
        
        SATURATED_LIST=$(jq '[.items[] | select(.status.currentReplicas >= .spec.maxReplicas and .spec.maxReplicas > 0) | {namespace: .metadata.namespace, name: .metadata.name, current_replicas: .status.currentReplicas, max_replicas: .spec.maxReplicas, target_ref: .spec.scaleTargetRef.name}]' /tmp/hpa_all.json)
        SATURATED_COUNT=$(echo "$SATURATED_LIST" | jq 'length')
        
        echo "::set-output name=saturated_count::$SATURATED_COUNT::"
        echo "::set-output name=saturated_list::$SATURATED_LIST::"

  - id: evaluate_hpa_saturation
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.audit_hpa_ceilings.vars.saturated_count | int > inputs.saturation_threshold }}"
    then:
      - id: notify_platform_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#infrastructure-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 Kubernetes Horizontal Pod Autoscaler Ceiling Saturation Alert",
                "text": "Detected *{{ outputs.audit_hpa_ceilings.vars.saturated_count }}* HPA(s) pinned at *maxReplicas* capacity ceiling. Saturated HPAs: {{ outputs.audit_hpa_ceilings.vars.saturated_list }}. Impact: Applications cannot scale out further under surging traffic, leading to 504 gateway timeouts and latency spikes.",
                "footer": "Kestra SRE Sentinel • HPA Saturation"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#infrastructure-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ HPA Saturation Sentinel Execution Error",
            "text": "The Kubernetes HPA saturation audit workflow encountered an execution error. Please check cluster RBAC permissions and API server reachability.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  metaDescription: "Audits Kubernetes HorizontalPodAutoscalers across all namespaces to detect workloads pinned at maxReplicas capacity limits."
  metaTitle: Kubernetes Horizontal Pod Autoscaler Max Replicas Ceiling Saturation Sentinel with Kestra
  title: Kubernetes Horizontal Pod Autoscaler Max Replicas Ceiling Saturation Sentinel
  shortDescription: Audits Kubernetes HorizontalPodAutoscalers across all namespaces to detect workloads pinned at maxReplicas capacity limits.
  description: |
    ## How it works
    This workflow connects to Kubernetes using `kubectl` and inspects all `HorizontalPodAutoscaler` objects cluster-wide. It compares observed `.status.currentReplicas` against declared `.spec.maxReplicas`. When an HPA is saturated at its maximum allowed replica ceiling, further workload scaling is blocked. When the count of saturated HPAs exceeds the configured threshold, an automated Slack incident alert is immediately dispatched with namespace and deployment names.

    ## What you get
    - Instant visibility into bottlenecked microservices unable to scale during traffic spikes.
    - Early warning before user-facing HTTP 504 Gateway Timeouts or thread exhaustion occur.
    - Detailed inventory of saturated target deployments and replica caps.

    ## Who it's for
    - Platform Engineers and SREs managing autoscaling policies on production Kubernetes clusters.
    - Service owners responsible for microservice scalability and high-availability capacity planning.

    ## Why orchestrate this with Kestra
    - **Reliable Automation**: Schedule continuous HPA checks without standing up separate monitoring microservices.
    - **Unified Alerting**: Route actionable alerts directly to SRE on-call channels via Slack, Microsoft Teams, or webhooks.
    - **Extensible Workflows**: Chain with automated cluster capacity audits or ticket creation.

    ## Prerequisites
    - Cluster RBAC permissions allowing `get` and `list` on `horizontalpodautoscalers.autoscaling`.
    - Secret `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import this blueprint into your Kestra instance.
    2. Add the `SLACK_WEBHOOK` secret.
    3. Run the workflow to verify autoscaling headroom across your cluster.

    ## How to extend
    - Add an automated task to inspect underlying Node pool capacity before recommending higher `maxReplicas`.
    - Correlate with ingress request rate metrics from Prometheus or Datadog.

    ## Links
    - [Kubernetes HPA Documentation](https://kubernetes.io/docs/tasks/run-application/horizontal-pod-autoscale/)
    - [Kestra Shell Plugin](https://kestra.io/plugins/plugin-scripts/commands/io.kestra.plugin.scripts.shell.commands)
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Kubernetes Operations
    - Day 2 Operations
  ee: false
  demo: false
