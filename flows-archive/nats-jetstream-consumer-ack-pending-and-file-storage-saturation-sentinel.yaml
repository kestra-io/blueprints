    - [NATS Server Monitoring Endpoint and API Reference](https://docs.nats.io/running-a-nats-service/configuration/monitoring)
    - [NATS JetStream Tuning and Consumer Failure Recovery](https://docs.nats.io/nats-concepts/jetstream/consumers)
