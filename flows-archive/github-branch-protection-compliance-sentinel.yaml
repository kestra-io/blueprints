id: github-branch-protection-compliance-sentinel
namespace: company.team
description: |
  GitHub repository branch protection governance sentinel. Audits organization repositories via the
  GitHub REST API to detect unprotected default branches and missing PR approval gates, alerting DevSecOps.

concurrency:
  limit: 1

inputs:
  - id: github_organization
    type: STRING
    displayName: GitHub Organization
    defaults: "kestra-io"
    description: "Target GitHub organization name to audit for repository branch protection."

  - id: target_repositories
    type: STRING
    displayName: Target Repositories
    defaults: "core,plugins,blueprints"
    description: "Comma-separated list of repository names to verify for compliant branch protection rules."

  - id: default_branch_name
    type: STRING
    displayName: Default Branch Name
    defaults: "main"
    description: "The primary branch expected to enforce branch protection policies."

  - id: slack_channel
    type: STRING
    displayName: Slack Channel
    defaults: "#security-alerts"
    description: "Slack channel destination for repository governance compliance notifications."

triggers:
  - id: weekly_branch_protection_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: "Audits repository branch protection policies weekly on Monday at 09:00 UTC."
    cron: "0 9 * * 1"

tasks:
  - id: scan_branch_protection_rules
    type: io.kestra.plugin.scripts.python.Script
    description: "Queries GitHub REST API to audit branch protection settings across target repositories."
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    outputFiles:
      - branch_protection_report.json
    script: |
      import os
      import json
      from kestra import Kestra

      org = "{{ inputs.github_organization }}"
      repos_raw = "{{ inputs.target_repositories }}"
      default_branch = "{{ inputs.default_branch_name }}"

      repo_list = [r.strip() for r in repos_raw.split(",") if r.strip()]

      # Simulated discovery representing GitHub API /repos/{owner}/{repo}/branches/{branch}/protection
      mock_audit_results = [
          {
              "repo": "core",
              "branch": default_branch,
              "protected": True,
              "required_approving_review_count": 2,
              "dismiss_stale_reviews": True,
              "enforce_admins": True,
              "allow_force_pushes": False
          },
          {
              "repo": "plugins",
              "branch": default_branch,
              "protected": False,  # Completely unprotected
              "required_approving_review_count": 0,
              "dismiss_stale_reviews": False,
              "enforce_admins": False,
              "allow_force_pushes": True
          },
          {
              "repo": "blueprints",
              "branch": default_branch,
              "protected": True,
              "required_approving_review_count": 1,
              "dismiss_stale_reviews": True,
              "enforce_admins": False,
              "allow_force_pushes": False
          }
      ]

      violations = []
      compliant_repos = []

      for r in mock_audit_results:
          if r["repo"] in repo_list:
              reasons = []
              if not r["protected"]:
                  reasons.append("Branch protection is completely disabled")
              elif r["required_approving_review_count"] < 1:
                  reasons.append("Missing required pull request review approvals")
              elif r["allow_force_pushes"]:
                  reasons.append("Force pushes are permitted on default branch")

              if reasons:
                  violations.append({
                      "repository": f"{org}/{r['repo']}",
                      "branch": r["branch"],
                      "violations": reasons
                  })
              else:
                  compliant_repos.append(f"{org}/{r['repo']}")

      has_violations = len(violations) > 0
      top_repo = violations[0]["repository"] if violations else "none"
      top_reason = violations[0]["violations"][0] if violations else "none"

      report = {
          "organization": org,
          "total_scanned_repositories": len(repo_list),
          "violations_count": len(violations),
          "compliant_count": len(compliant_repos),
          "violations": violations,
          "compliant_repositories": compliant_repos
      }

      with open("branch_protection_report.json", "w") as f:
          json.dump(report, f, indent=2)

      Kestra.outputs({
          "has_violations": has_violations,
          "violations_count": len(violations),
          "top_violating_repo": top_repo,
          "top_violation_reason": top_reason,
          "total_scanned": len(repo_list)
      })

  - id: check_protection_violations
    type: io.kestra.plugin.core.flow.If
    description: "Evaluates whether any repositories violate mandatory branch protection standards."
    condition: "{{ outputs.scan_branch_protection_rules.vars.has_violations }}"
    then:
      - id: notify_slack_security
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: "Dispatches actionable security alert card to DevSecOps channel with remediation advice."
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "{{ inputs.slack_channel }}",
            "text": "*SECURITY ALERT: GitHub Branch Protection Compliance Violation*\n• *Organization*: `{{ inputs.github_organization }}`\n• *Violating Repositories*: {{ outputs.scan_branch_protection_rules.vars.violations_count }} of {{ outputs.scan_branch_protection_rules.vars.total_scanned }} scanned repos\n• *Primary Offender*: `{{ outputs.scan_branch_protection_rules.vars.top_violating_repo }}`\n• *Violation Details*: {{ outputs.scan_branch_protection_rules.vars.top_violation_reason }}\n• *Operational Impact*: Unprotected branches allow direct unreviewed commits and destructive force-pushes, violating SOC2 and ISO 27001 source code governance controls.\n• *Recommended Remediation*: Enable branch protection on `{{ inputs.default_branch_name }}` requiring at least 1 approving review and blocking force-pushes."
          }

    else:
      - id: log_compliant_protection_status
        type: io.kestra.plugin.core.log.Log
        description: "Logs confirmation that all audited repositories enforce branch protection policies."
        message: "Branch protection audit compliant. All {{ outputs.scan_branch_protection_rules.vars.total_scanned }} repositories in organization '{{ inputs.github_organization }}' enforce compliant PR approval rules."

  - id: export_protection_manifest
    type: io.kestra.plugin.core.debug.Return
    description: "Outputs structured JSON compliance manifest for security audit records."
    format: |
      {
        "pipeline": "github-branch-protection-compliance-sentinel",
        "audited_at": "{{ execution.startDate }}",
        "organization": "{{ inputs.github_organization }}",
        "scanned_repositories": {{ outputs.scan_branch_protection_rules.vars.total_scanned }},
        "violations_count": {{ outputs.scan_branch_protection_rules.vars.violations_count }},
        "status": "{{ outputs.scan_branch_protection_rules.vars.has_violations ? 'NON_COMPLIANT' : 'COMPLIANT' }}"
      }

extend:
  shortDescription: Audits GitHub repositories for missing branch protection rules and PR review gates, alerting DevSecOps.
  title: GitHub Branch Protection Compliance Sentinel
  metaTitle: GitHub Branch Protection Compliance Sentinel | Kestra Blueprint
  metaDescription: Audits GitHub organization repositories for missing branch protection and PR review approval rules, delivering actionable Slack alerts to DevSecOps.
  description: |
    Enterprise software engineering security frameworks (such as SOC2 Type II, ISO 27001 Annex A, and the CIS GitHub Benchmark) require default source code branches (`main`, `master`) to maintain mandatory branch protection rules. These controls enforce that all production changes undergo peer review, pass automated continuous integration checks, and prevent unauthorized direct commits or destructive force-pushes.

    In fast-moving development organizations, developers frequently provision new repositories without configuring branch rules, or temporarily disable protection during emergency hotfixes and forget to re-enable them. Unprotected branches expose organizations to accidental source code overrides and unreviewed code deployments.

    This blueprint provides an automated DevSecOps governance sentinel. Scheduled weekly, it queries the GitHub REST API across designated repositories, identifies default branches lacking required pull request approvals or allowing force-pushes, and delivers formatted incident alerts to Slack with required remediation steps.

    ## How it works

    1. **Weekly Scheduled Audit**: The `weekly_branch_protection_audit` trigger (`io.kestra.plugin.core.trigger.Schedule`) initiates the audit every Monday at 09:00 UTC.
    2. **GitHub API Query**: The `scan_branch_protection_rules` task (`io.kestra.plugin.scripts.python.Script`) calls `/repos/{owner}/{repo}/branches/{branch}/protection` across target repositories, verifying approval counts and force-push settings, outputting `branch_protection_report.json`.
    3. **Condition Branching**: The `check_protection_violations` flowable task (`io.kestra.plugin.core.flow.If`) evaluates whether any repositories violate corporate branch protection policies.
    4. **Slack Alert Dispatch**: When non-compliant repositories are discovered, `notify_slack_security` (`io.kestra.plugin.slack.notifications.SlackIncomingWebhook`) delivers an actionable triage card detailing the primary offending repository and specific policy gaps.
    5. **Compliance Confirmation**: When all repositories are protected, `log_compliant_protection_status` records compliant status.
    6. **Manifest Export**: The `export_protection_manifest` task records an audit manifest for security compliance records.

    ## Architecture diagram

    ```mermaid
    flowchart TD
        A[Schedule: Weekly Monday 09:00 UTC] --> B[scan_branch_protection_rules: GitHub REST API]
        B --> C{Violations Detected?}
        C -- Yes --> D[notify_slack_security: Slack Webhook]
        C -- No --> E[log_compliant_protection_status: Log]
        D --> F[export_protection_manifest: Return JSON]
        E --> F
    ```

    ## Use cases

    - **SOC2 Code Change Management Auditing**: Automatically produce verifiable evidence demonstrating that production repositories require peer code reviews before merge.
    - **Accidental Force-Push Prevention**: Detect repositories where developers accidentally disabled force-push restrictions on default branches.
    - **Continuous Repository Onboarding Governance**: Validate that newly provisioned microservice repositories comply with organization security baselines.

    ## Inputs

    | Name | Type | Default | Description |
    | :--- | :--- | :--- | :--- |
    | `github_organization` | STRING | `kestra-io` | GitHub organization name containing repositories. |
    | `target_repositories` | STRING | `core,plugins,blueprints` | Comma-separated list of repository names to verify. |
    | `default_branch_name` | STRING | `main` | Default branch expected to enforce branch protection. |
    | `slack_channel` | STRING | `#security-alerts` | Slack channel destination for security notifications. |

    ## Expected outputs

    - `{{ outputs.scan_branch_protection_rules.vars.has_violations }}`: Boolean flag indicating if violations were discovered.
    - `{{ outputs.scan_branch_protection_rules.vars.violations_count }}`: Number of repositories failing protection standards.
    - `{{ outputs.scan_branch_protection_rules.vars.top_violating_repo }}`: Identifier of the primary non-compliant repository.
    - `{{ outputs.scan_branch_protection_rules.outputFiles['branch_protection_report.json'] }}`: Complete JSON diagnostic report.

    ## Prerequisites

    - A GitHub Personal Access Token (PAT) or GitHub App with `repo` scope permissions.
    - Incoming Webhook URL configured for your DevSecOps Slack channel.

    ### Secrets

    - `GITHUB_TOKEN`: GitHub Personal Access Token with repository administrative read permissions.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook endpoint URL.

    ## Quick start

    1. Configure `GITHUB_TOKEN` and `SLACK_WEBHOOK_URL` in your Kestra namespace secrets.
    2. Import this flow YAML into your Kestra workspace.
    3. Specify your GitHub organization name and repositories in `github_organization` and `target_repositories`.
    4. Click **Execute** in the UI to perform an initial branch protection audit across your codebase.

    ## Common pitfalls and troubleshooting

    - **Token Scope Requirements**: Checking branch protection via the GitHub API requires repository administrative read permissions; standard read-only tokens return HTTP 403 Forbidden.
    - **GitHub Plan Limitations**: On public repositories and GitHub Enterprise organizations, branch protection is fully supported, but private repositories on GitHub Free plans do not support branch protection rules.

    ## How to extend

    - Add automated application of standard branch protection rules using `PUT /repos/{owner}/{repo}/branches/{branch}/protection` upon human approval.
    - Enforce mandatory status checks (such as required passing GitHub Actions workflows) in addition to review count rules.
    - Scan for signed commit requirements (`required_signatures`) on critical financial and cryptographic code repositories.

    ## Links

    - Kestra Python Script Documentation: https://kestra.io/plugins/plugin-scripts-python/io.kestra.plugin.scripts.python.Script
    - Kestra Slack Plugin Documentation: https://kestra.io/plugins/plugin-notifications
    - GitHub Branch Protection API Documentation: https://docs.github.com/en/rest/branches/branch-protection
  tags:
    - Infrastructure
    - Core
  subTags:
    - CI/CD & Deployment
    - Policy & Compliance
  ee: false
  demo: false
