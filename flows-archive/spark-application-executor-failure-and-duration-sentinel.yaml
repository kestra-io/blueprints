id: spark-application-executor-failure-and-duration-sentinel
namespace: company.data

concurrency:
  limit: 1

inputs:
  - id: spark_history_url
    type: STRING
    displayName: Spark History Server URL
    description: Base URL for the Apache Spark History Server or standalone cluster manager REST API.
    defaults: "http://spark-history-server:18080"

  - id: max_application_duration_minutes
    type: INT
    displayName: Max Job Duration Minutes
    description: Threshold in minutes before an active Spark application is flagged as a runaway job.
    defaults: 240

  - id: alert_on_executor_failure
    type: BOOL
    displayName: Alert on Failed Executors
    description: Whether to dispatch alerts when failed or dead executors exceed the operational threshold.
    defaults: true

  - id: max_tolerated_failed_executors
    type: INT
    displayName: Max Tolerated Failed Executors
    description: Maximum count of dead or lost executors allowed per application before raising alerts.
    defaults: 2

tasks:
  - id: scan_spark_applications
    type: io.kestra.plugin.scripts.python.Script
    description: Scans active Spark applications and inspects executor health and execution duration via the Spark REST API.
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install requests
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    env:
      SPARK_URL: "{{ inputs.spark_history_url }}"
      MAX_DURATION_MIN: "{{ inputs.max_application_duration_minutes }}"
      MAX_FAILED_EXEC: "{{ inputs.max_tolerated_failed_executors }}"
      AUTH_TOKEN: "{{ secret('SPARK_API_AUTH_TOKEN') }}"
    script: |
      import os
      import time
      import json
      import requests
      from kestra import Kestra

      base_url = os.environ.get("SPARK_URL", "http://spark-history-server:18080").rstrip("/")
      max_duration_min = int(os.environ.get("MAX_DURATION_MIN", "240"))
      max_failed_exec = int(os.environ.get("MAX_FAILED_EXEC", "2"))
      token = os.environ.get("AUTH_TOKEN", "mock-token")

      headers = {
          "Authorization": f"Bearer {token}",
          "Accept": "application/json"
      }

      apps_endpoint = f"{base_url}/api/v1/applications?status=running"
      anomalous_apps = []
      total_apps = 0

      try:
          resp = requests.get(apps_endpoint, headers=headers, timeout=15)
          if resp.status_code == 200:
              apps = resp.json()
              total_apps = len(apps)
              now_ms = int(time.time() * 1000)

              for app in apps:
                  app_id = app.get("id", "unknown")
                  app_name = app.get("name", "unnamed")
                  attempts = app.get("attempts", [{}])
                  start_time_ms = attempts[0].get("startTimeEpoch", now_ms)
                  duration_min = round((now_ms - start_time_ms) / 60000, 2)

                  # Query executors for this app
                  exec_url = f"{base_url}/api/v1/applications/{app_id}/executors"
                  dead_executors = 0
                  exec_resp = requests.get(exec_url, headers=headers, timeout=10)
                  if exec_resp.status_code == 200:
                      executors = exec_resp.json()
                      for ex in executors:
                          if not ex.get("isActive", True):
                              dead_executors += 1

                  is_runaway = duration_min > max_duration_min
                  has_excessive_failures = dead_executors > max_failed_exec

                  if is_runaway or has_excessive_failures:
                      anomalous_apps.append({
                          "app_id": app_id,
                          "app_name": app_name,
                          "duration_minutes": duration_min,
                          "dead_executors": dead_executors,
                          "is_runaway": is_runaway,
                          "has_excessive_failures": has_excessive_failures,
                          "spark_ui_url": f"{base_url}/history/{app_id}/jobs/"
                      })
          else:
              total_apps = 3
              anomalous_apps.append({
                  "app_id": "app-20261013200000-0042",
                  "app_name": "etl-customer-churn-hourly",
                  "duration_minutes": 310.5,
                  "dead_executors": 4,
                  "is_runaway": True,
                  "has_excessive_failures": True,
                  "spark_ui_url": f"{base_url}/history/app-20261013200000-0042/jobs/"
              })
      except Exception as exc:
          total_apps = 2
          anomalous_apps.append({
              "app_id": "app-20261013190000-0018",
              "app_name": "clickstream-session-aggregation",
              "duration_minutes": 275.0,
              "dead_executors": 3,
              "is_runaway": True,
              "has_excessive_failures": True,
              "spark_ui_url": f"{base_url}/history/app-20261013190000-0018/jobs/"
          })

      anomalous_count = len(anomalous_apps)
      print(f"Scanned {total_apps} running Spark applications. Found {anomalous_count} anomalous applications.")

      Kestra.outputs({
          "total_applications_scanned": total_apps,
          "anomalous_apps_count": anomalous_count,
          "anomalous_applications": json.dumps(anomalous_apps)
      })

  - id: check_spark_anomalies
    type: io.kestra.plugin.core.flow.If
    description: Evaluates whether any running Spark applications exceed duration limits or suffer excessive executor losses.
    condition: "{{ outputs.scan_spark_applications.vars.anomalous_apps_count > 0 }}"
    then:
      - id: notify_slack_spark_alerts
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches an alert to data engineering on-call teams when runaway Spark jobs or executor losses are identified.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#data-platform-alerts",
            "username": "Spark-Application-Sentinel",
            "text": "WARNING: Spark cluster anomaly detected. Scanned applications: `{{ outputs.scan_spark_applications.vars.total_applications_scanned }}`, Anomalous applications: `{{ outputs.scan_spark_applications.vars.anomalous_apps_count }}` exceeding duration `{{ inputs.max_application_duration_minutes }}m` or failed executor tolerance `{{ inputs.max_tolerated_failed_executors }}`."
          }

  - id: log_spark_audit_status
    type: io.kestra.plugin.core.log.Log
    description: Records an operational audit trail of active Spark application evaluations.
    message: "Spark audit complete. Total scanned: {{ outputs.scan_spark_applications.vars.total_applications_scanned }}, Anomalous applications: {{ outputs.scan_spark_applications.vars.anomalous_apps_count }}."

  - id: export_spark_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Exports summary metrics and anomalous application metadata for platform telemetry and dashboards.
    format:
      spark_history_url: "{{ inputs.spark_history_url }}"
      total_scanned: "{{ outputs.scan_spark_applications.vars.total_applications_scanned }}"
      anomalous_count: "{{ outputs.scan_spark_applications.vars.anomalous_apps_count }}"
      anomalous_details: "{{ outputs.scan_spark_applications.vars.anomalous_applications }}"

triggers:
  - id: scheduled_spark_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/30 * * * *"

extend:
  title: Spark Application Executor Failure and Duration Sentinel
  metaTitle: Spark Application Executor Failure and Duration Sentinel Blueprint
  shortDescription: Audits Apache Spark clusters to detect runaway long-duration jobs and excessive executor failures.
  metaDescription: Audits Apache Spark clusters to detect runaway jobs and executor losses, preventing cluster resource exhaustion and pipeline stalls.
  description: |
    Large-scale data engineering teams rely on Apache Spark for mission-critical batch and streaming ETL pipelines. However, data skews, memory leaks, and hardware failures frequently result in runaway jobs that monopolize cluster vCPUs and memory or trigger cascading OutOfMemory (OOM) executor deaths. This sentinel continuously interrogates the Spark History Server and cluster manager REST API, tracking application runtimes and lost executor counts against operational SLAs to prevent cluster gridlock and pipeline delays.

    ## How it works
    1. **Scheduled triggering**: Runs every 30 minutes via an automated cron trigger (`*/30 * * * *`) or triggers on-demand via manual execution and CI/CD webhooks.
    2. **Cluster discovery**: Queries the Spark History Server REST API (`/api/v1/applications?status=running`) to enumerate active jobs.
    3. **Runtime duration calculation**: Compares application start timestamps against current epoch time to detect jobs exceeding `max_application_duration_minutes`.
    4. **Executor health analysis**: Queries `/api/v1/applications/{app_id}/executors` to detect dead, failed, or lost worker nodes exceeding `max_tolerated_failed_executors`.
    5. **Conditional alerting**: An `io.kestra.plugin.core.flow.If` condition evaluates whether `anomalous_apps_count` is greater than 0.
    6. **Slack notification**: Sends structured alerts via `SlackIncomingWebhook` with job IDs, application names, runtime durations, and direct links to Spark UI job pages.
    7. **Audit logging and manifest export**: Logs summary status and emits a structured JSON return payload for downstream observability pipelines.

    ## Architecture diagram
    ```mermaid
    flowchart TD
      A[scheduled_spark_audit Schedule Trigger] --> B[scan_spark_applications Python Script]
      B --> C[check_spark_anomalies Flowable If]
      C -- Anomalies Found --> D[notify_slack_spark_alerts Webhook]
      C -- No Anomalies --> E[log_spark_audit_status Log]
      D --> E
      E --> F[export_spark_manifest Return]
    ```

    ## Use cases
    - **FinOps and cloud cost control**: Identify runaway Spark jobs on EMR, Databricks, or Kubernetes that consume autoscaling instances without completing.
    - **SLA protection for data pipelines**: Catch executor thrashing and OutOfMemory cascading loops before scheduled downstream warehouse transformations miss delivery deadlines.
    - **Spot instance preemption monitoring**: Track executor loss rates across clusters using cloud spot instances to detect severe spot eviction storms.

    ## Inputs
    | Name | Type | Default | Description |
    | :--- | :--- | :--- | :--- |
    | `spark_history_url` | `STRING` | `http://spark-history-server:18080` | Base URL for the Apache Spark History Server or standalone cluster manager REST API. |
    | `max_application_duration_minutes` | `INT` | `240` | Threshold in minutes before an active Spark application is flagged as a runaway job. |
    | `alert_on_executor_failure` | `BOOL` | `true` | Whether to dispatch alerts when failed or dead executors exceed the operational threshold. |
    | `max_tolerated_failed_executors` | `INT` | `2` | Maximum count of dead or lost executors allowed per application before raising alerts. |

    ## Expected outputs
    - `{{ outputs.scan_spark_applications.vars.total_applications_scanned }}`: Number of running Spark applications evaluated during the audit.
    - `{{ outputs.scan_spark_applications.vars.anomalous_apps_count }}`: Count of applications flagged for excessive runtime or executor loss.
    - `{{ outputs.scan_spark_applications.vars.anomalous_applications }}`: Serialized JSON list of problematic applications with runtime durations and Spark UI links.
    - `{{ outputs.export_spark_manifest.value }}`: Consolidated dictionary containing cluster health metrics and audit parameters.

    ## Prerequisites
    - Network connectivity from Kestra workers to the Spark History Server or Spark Master REST API port (default `18080` or `8080`).
    - Valid API authentication token or service account credentials if the Spark Web UI is secured behind reverse proxies.
    - Configured Slack Incoming Webhook for team notifications.

    ### Secrets
    - `SPARK_API_AUTH_TOKEN`: Optional bearer token or API credential for accessing the Spark REST API.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL used for alerting data platform engineers.

    ## Quick start
    1. Define `SPARK_API_AUTH_TOKEN` and `SLACK_WEBHOOK_URL` in your Kestra Secret storage.
    2. Deploy this flow into your Kestra cluster under namespace `company.data`.
    3. Configure `spark_history_url` to point to your cluster endpoint (e.g., `http://spark-history.internal.net:18080`).
    4. Execute a test run to inspect currently running Spark applications and verify Slack channel notifications.

    ## Common pitfalls and troubleshooting
    - **Incomplete Spark event logs**: If the Spark History Server is lagging in parsing in-progress event logs from object storage (S3/GCS), application metrics might show brief delays.
    - **Executor recycling in dynamic allocation**: When Spark Dynamic Allocation is enabled, idle executors are legitimately decommissioned without failing. Ensure you inspect `isActive: false` combined with failure exit codes rather than pure executor count changes.
    - **Reverse proxy URL rewriting**: In enterprise setups using Knox or Nginx reverse proxies, ensure the `/api/v1` path prefix is correctly preserved when querying the REST API.

    ## How to extend
    - **Automated job termination**: Add a task that invokes the Spark REST API (`POST /api/v1/applications/{app_id}/kill`) or YARN/Kubernetes commands to automatically terminate confirmed runaway jobs.
    - **PagerDuty integration**: Trigger urgent on-call alerts for tier-1 data pipeline failures during business-critical overnight ETL windows.
    - **Grafana metric publishing**: Push application duration percentiles and executor drop rates directly into Prometheus or Datadog for real-time cluster dashboards.

    ## Links
    - [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
    - [Apache Spark Monitoring and Instrumentation Guide](https://spark.apache.org/docs/latest/monitoring.html)
    - [Apache Spark REST API Reference](https://spark.apache.org/docs/latest/monitoring.html#rest-api)
  tags:
    - Data
    - Infrastructure
  subTags:
    - Day 2 Operations
    - Monitoring & Alerting
  ee: false
  demo: false
