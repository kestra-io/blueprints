id: inventory-valuation-nrv-provision
namespace: company.team

description: |
  Period-end inventory valuation: post the physical count against the perpetual records and
  explain the variance, value stock at weighted average cost, write it down to net realisable
  value where selling prices have fallen, provide for slow-moving and obsolete items from their
  age and days of cover, tie the stock ledger to the general ledger, post the adjustments and
  lock the period.

inputs:
  - id: count_date
    type: STRING
    displayName: Count date
    defaults: "2026-09-30"
    validator: ^\d{4}-\d{2}-\d{2}$

  - id: scenario
    type: SELECT
    displayName: Demo scenario
    description: >
      ISSUES adds a location that was not counted, an item counted but unknown to the item
      master, and a count variance of more than 20% on a high-value item, which must block the
      valuation until they are recounted.
    values:
      - CLEAN
      - ISSUES
    defaults: CLEAN

  - id: provision_matrix
    type: JSON
    displayName: Slow-moving provision matrix
    description: Provision rate by months of cover (stock / average monthly usage over the last 12 months). No movement in 12 months is fully provided.
    defaults: |
      [{"cover_from": 0, "rate": 0}, {"cover_from": 12, "rate": 0.25}, {"cover_from": 24, "rate": 0.5}, {"cover_from": 36, "rate": 1.0}]

  - id: selling_cost_pct
    type: FLOAT
    displayName: Costs to sell (% of price)
    description: Estimated costs to complete and sell, deducted from the selling price to get net realisable value.
    defaults: 8.0

  - id: recount_threshold
    type: FLOAT
    displayName: Recount threshold
    description: A count line whose variance is above this value and above 20% of its book quantity must be recounted.
    defaults: 2500.0

  - id: approved_by
    type: STRING
    displayName: Approved by
    description: Required when the total write-down or the count variance is above 1% of inventory value.
    defaults: ""

variables:
  lock_key: inventory_valuation
  pack_dir: "inventory/{{ inputs.count_date }}"

concurrency:
  limit: 1

tasks:
  - id: period_control
    type: io.kestra.plugin.core.output.OutputValues
    values:
      last: "{{ (kv(vars.lock_key, errorOnMissing=false) ?? {'count_date': '', 'provision': 0, 'nrv': 0}) | toJson }}"

  - id: period_gate
    type: io.kestra.plugin.core.flow.If
    condition: "{{ (fromJson(outputs.period_control.values.last).count_date ?? '') != '' and inputs.count_date <= fromJson(outputs.period_control.values.last).count_date }}"
    then:
      - id: period_refused
        type: io.kestra.plugin.core.execution.Fail
        errorMessage: "Inventory is already valued up to {{ fromJson(outputs.period_control.values.last).count_date }}. Count dates move forward."

  - id: value
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: >
      One DuckDB session: item master, stock movements, the count, prices (demo generator or
      your exports), count variances, weighted average cost, NRV, slow-moving provision,
      the stock to ledger tie-out, blockers and journals.
    outputFiles:
      - valuation
      - count_variances
      - journal
      - blockers
    fetchType: FETCH_ONE
    sql: |
      SET VARIABLE count_date = DATE '{{ inputs.count_date }}';
      SET VARIABLE sell_cost = {{ inputs.selling_cost_pct }} / 100.0;

      -- =======================================================================
      -- Item master. Replace with your ERP export.
      -- =======================================================================
      CREATE TABLE items AS
      SELECT 'SKU-' || lpad(i::VARCHAR, 4, '0') AS sku,
             ['Fasteners', 'Bearings', 'Hydraulics', 'Electronics', 'Seals', 'Spare parts (legacy line)'][1 + i % 6] AS family,
             CASE WHEN i % 6 = 5 THEN 'B' ELSE ['A', 'A', 'B', 'C'][1 + i % 4] END AS location_class,
             ['WH-NORTH', 'WH-SOUTH', 'WH-EAST'][1 + i % 3] AS location,
             (2 + (i * 7919) % 480 / 10.0)::DECIMAL(12, 4) AS base_cost,
             -- Most items sell at a margin. Electronics prices fell 35% this year; the legacy line is being run down.
             CASE WHEN i % 6 = 3 THEN 0.65 WHEN i % 6 = 5 THEN 0.9 ELSE 1.45 + (i % 5) * 0.05 END AS price_factor,
             CASE WHEN i % 6 = 5 THEN 0.1 WHEN i % 11 = 0 THEN 0.25 ELSE 1 END AS demand
      FROM range(1, 301) t(i);

      -- =======================================================================
      -- Stock movements over two years: receipts at a cost that drifts, issues
      -- driven by demand. Replace with your stock ledger.
      -- =======================================================================
      CREATE TABLE movements AS
      WITH weeks AS (SELECT w, (DATE '2024-10-07' + INTERVAL (w * 7) DAY)::DATE AS d FROM range(0, 130) t(w))
      SELECT i.sku, d AS moved_on, 'RECEIPT' AS kind,
             -- Four weeks of demand, with a little safety stock. Slow lines stopped being bought after week 40.
             round(4 * (8 + (hash(i.sku) % 14)::INT) * i.demand * 1.04) * CASE WHEN i.demand < 1 AND w > 40 THEN 0 ELSE 1 END
               + CASE WHEN w < 4 THEN 30 ELSE 0 END AS qty,
             round(i.base_cost * (1 + 0.0008 * w + ((hash(i.sku || w) % 9)::INT - 4) / 200.0), 4) AS unit_cost
      FROM items i, weeks WHERE w % 4 = (hash(i.sku) % 4)::INT
      UNION ALL
      SELECT i.sku, d, 'ISSUE', -round((8 + (hash(i.sku) % 14)::INT) * i.demand * CASE WHEN i.demand < 1 AND w > 40 THEN 0.3 ELSE 1 END), NULL
      FROM items i, weeks;
      DELETE FROM movements WHERE qty = 0 OR moved_on > getvariable('count_date');

      -- Stock can never go negative: an issue larger than the stock on hand is cut.
      CREATE TABLE ledger AS
      WITH RECURSIVE ordered AS (
        SELECT *, row_number() OVER (PARTITION BY sku ORDER BY moved_on, kind DESC) AS n FROM movements
      ), run(sku, n, moved_on, kind, qty, unit_cost, on_hand, avg_cost, value) AS (
        SELECT sku, n, moved_on, kind, greatest(qty, 0), unit_cost, greatest(qty, 0)::DOUBLE,
               coalesce(unit_cost, 0)::DOUBLE, greatest(qty, 0) * coalesce(unit_cost, 0)
        FROM ordered WHERE n = 1
        UNION ALL
        SELECT o.sku, o.n, o.moved_on, o.kind,
               CASE WHEN o.qty < 0 THEN -least(-o.qty, r.on_hand) ELSE o.qty END, o.unit_cost,
               r.on_hand + CASE WHEN o.qty < 0 THEN -least(-o.qty, r.on_hand) ELSE o.qty END,
               -- Weighted average cost moves on receipts only.
               CASE WHEN o.qty > 0 THEN (r.value + o.qty * o.unit_cost) / (r.on_hand + o.qty) ELSE r.avg_cost END,
               CASE WHEN o.qty > 0 THEN r.value + o.qty * o.unit_cost ELSE (r.on_hand - least(-o.qty, r.on_hand)) * r.avg_cost END
        FROM ordered o JOIN run r ON o.sku = r.sku AND o.n = r.n + 1
      )
      SELECT * FROM run;

      CREATE TABLE book AS
      SELECT sku, arg_max(on_hand, n) AS book_qty, arg_max(avg_cost, n) AS avg_cost,
             max(moved_on) FILTER (WHERE kind = 'ISSUE' AND qty < 0) AS last_issue,
             max(moved_on) FILTER (WHERE kind = 'RECEIPT') AS last_receipt,
             -coalesce(sum(qty) FILTER (WHERE kind = 'ISSUE' AND moved_on > getvariable('count_date') - INTERVAL 12 MONTH), 0) / 12.0 AS monthly_usage
      FROM ledger GROUP BY sku;

      -- =======================================================================
      -- The count. Counters find what the records say, give or take shrinkage
      -- and the odd mis-pick. Replace with your count sheets.
      -- =======================================================================
      CREATE TABLE count_lines AS
      SELECT b.sku, i.location,
             greatest(round(b.book_qty * (1 - CASE WHEN hash(b.sku || 'c') % 9 = 0 THEN ((hash(b.sku) % 5)::INT + 1) / 100.0 ELSE 0 END)
                            + CASE WHEN hash(b.sku || 'p') % 23 = 0 THEN 6 ELSE 0 END), 0) AS counted_qty
      FROM book b JOIN items i USING (sku)
      {% if inputs.scenario == 'ISSUES' %}
      -- The seals in the south warehouse were never counted.
      WHERE NOT (i.location = 'WH-SOUTH' AND i.family = 'Seals')
      {% endif %};
      {% if inputs.scenario == 'ISSUES' %}
      INSERT INTO count_lines VALUES ('SKU-9001', 'WH-NORTH', 140);
      -- The most valuable item counted at about half its book quantity.
      UPDATE count_lines SET counted_qty = round(counted_qty * 0.55) WHERE sku = (
        SELECT b.sku FROM book b JOIN count_lines c USING (sku) ORDER BY b.book_qty * b.avg_cost DESC LIMIT 1);
      {% endif %}

      -- Selling prices from the current price list. Replace with yours.
      CREATE TABLE prices AS
      SELECT i.sku, round(b.avg_cost * i.price_factor, 2) AS selling_price FROM items i JOIN book b USING (sku);

      -- =======================================================================
      -- Count variances and blockers.
      -- =======================================================================
      CREATE TABLE count_variances AS
      SELECT b.sku, i.family, i.location, b.book_qty, c.counted_qty, c.counted_qty - b.book_qty AS variance_qty,
             round((c.counted_qty - b.book_qty) * b.avg_cost, 2) AS variance_value,
             abs(c.counted_qty - b.book_qty) > 0.2 * b.book_qty AND abs((c.counted_qty - b.book_qty) * b.avg_cost) > {{ inputs.recount_threshold }} AS recount
      FROM book b JOIN items i USING (sku) JOIN count_lines c USING (sku)
      WHERE c.counted_qty <> b.book_qty;

      CREATE TABLE blockers AS
      SELECT 'NOT_COUNTED' AS code, i.location || ' ' || i.family AS ref, count(*) || ' items with stock were not counted' AS detail
        FROM items i JOIN book b USING (sku) WHERE b.book_qty > 0 AND i.sku NOT IN (SELECT sku FROM count_lines) GROUP BY ALL
      UNION ALL SELECT 'UNKNOWN_ITEM', sku, 'Counted ' || counted_qty || ' of an item that is not in the item master' FROM count_lines WHERE sku NOT IN (SELECT sku FROM items)
      UNION ALL SELECT 'RECOUNT_REQUIRED', sku, 'Book ' || book_qty || ', counted ' || counted_qty || ', variance ' || format('{:,.2f}', variance_value) FROM count_variances WHERE recount;

      -- =======================================================================
      -- Valuation at the counted quantity.
      -- =======================================================================
      CREATE TABLE matrix AS
      SELECT (x ->> 'cover_from')::DOUBLE AS cover_from, (x ->> 'rate')::DOUBLE AS rate
      FROM (SELECT unnest(from_json('{{ inputs.provision_matrix | toJson }}', '["JSON"]')) AS x);

      CREATE TABLE valuation AS
      WITH v AS (
        SELECT b.sku, i.family, i.location, coalesce(c.counted_qty, b.book_qty) AS qty, b.avg_cost,
               round(coalesce(c.counted_qty, b.book_qty) * b.avg_cost, 2) AS cost_value,
               p.selling_price, round(p.selling_price * (1 - getvariable('sell_cost')), 4) AS nrv_unit,
               b.monthly_usage, b.last_issue,
               CASE WHEN b.monthly_usage > 0 THEN coalesce(c.counted_qty, b.book_qty) / b.monthly_usage END AS months_cover
        FROM book b JOIN items i USING (sku) LEFT JOIN count_lines c USING (sku) JOIN prices p USING (sku)
        WHERE coalesce(c.counted_qty, b.book_qty) > 0
      )
      SELECT v.*,
             -- Write down to NRV where it is below cost (IAS 2.9).
             round(greatest(v.cost_value - v.qty * v.nrv_unit, 0), 2) AS nrv_writedown,
             -- Slow-moving provision on what is left after the NRV write-down, so nothing is provided twice.
             CASE WHEN v.monthly_usage = 0 OR v.last_issue IS NULL OR v.last_issue < getvariable('count_date') - INTERVAL 12 MONTH THEN 1.0
                  ELSE (SELECT rate FROM matrix WHERE cover_from <= v.months_cover ORDER BY cover_from DESC LIMIT 1) END AS provision_rate
      FROM v;
      ALTER TABLE valuation ADD COLUMN provision DOUBLE;
      UPDATE valuation SET provision = round((cost_value - nrv_writedown) * provision_rate, 2);

      -- =======================================================================
      -- Tie-out: the perpetual stock ledger against the GL inventory account
      -- before adjustments. Replace gl_inventory with your trial balance.
      -- =======================================================================
      CREATE TABLE stock_ledger_value AS SELECT round(sum(book_qty * avg_cost), 2) AS value FROM book;
      CREATE TABLE gl_inventory AS SELECT value AS balance FROM stock_ledger_value;
      INSERT INTO blockers
      SELECT 'STOCK_LEDGER_DOES_NOT_TIE', '1200', 'Stock ledger ' || s.value || ', general ledger ' || g.balance
      FROM stock_ledger_value s, gl_inventory g WHERE s.value <> g.balance;

      CREATE TABLE totals AS
      SELECT (SELECT value FROM stock_ledger_value) AS book_value,
             coalesce((SELECT sum(variance_value) FROM count_variances), 0) AS count_variance,
             (SELECT sum(cost_value) FROM valuation) AS counted_value,
             (SELECT sum(nrv_writedown) FROM valuation) AS nrv_writedown,
             (SELECT sum(provision) FROM valuation) AS provision;

      -- Journals. The NRV and slow-moving provisions are adjusted to their new level.
      CREATE TABLE journal AS
      SELECT row_number() OVER () AS line, DATE '{{ inputs.count_date }}' AS posting_date, account, account_name,
             greatest(amount, 0)::DECIMAL(14, 2) AS debit, greatest(-amount, 0)::DECIMAL(14, 2) AS credit, memo
      FROM (
        SELECT '5100' AS account, 'Stock count differences' AS account_name, -count_variance AS amount, 'Count ' || '{{ inputs.count_date }}' AS memo FROM totals
        UNION ALL SELECT '1200', 'Inventory', count_variance, 'Count {{ inputs.count_date }}' FROM totals
        UNION ALL SELECT '5110', 'Inventory write-down to NRV', nrv_writedown - {{ fromJson(outputs.period_control.values.last).nrv }}, 'NRV write-down movement' FROM totals
        UNION ALL SELECT '1215', 'Inventory NRV provision', -(nrv_writedown - {{ fromJson(outputs.period_control.values.last).nrv }}), 'NRV write-down movement' FROM totals
        UNION ALL SELECT '5120', 'Slow-moving and obsolete stock', provision - {{ fromJson(outputs.period_control.values.last).provision }}, 'Slow-moving provision movement' FROM totals
        UNION ALL SELECT '1210', 'Inventory slow-moving provision', -(provision - {{ fromJson(outputs.period_control.values.last).provision }}), 'Slow-moving provision movement' FROM totals
      ) WHERE round(amount, 2) <> 0;

      COPY (SELECT sku, family, location, qty, round(avg_cost, 4) AS avg_cost, cost_value, selling_price, round(nrv_unit, 4) AS nrv_unit,
                   round(monthly_usage, 2) AS monthly_usage, round(months_cover, 1) AS months_cover, last_issue, nrv_writedown, provision_rate, provision,
                   round(cost_value - nrv_writedown - provision, 2) AS carrying_value
            FROM valuation ORDER BY nrv_writedown + provision DESC) TO '{{ outputFiles.valuation }}' (HEADER, DELIMITER ',');
      COPY (SELECT * FROM count_variances ORDER BY abs(variance_value) DESC) TO '{{ outputFiles.count_variances }}' (HEADER, DELIMITER ',');
      COPY journal TO '{{ outputFiles.journal }}' (HEADER, DELIMITER ',');
      COPY blockers TO '{{ outputFiles.blockers }}' (HEADER, DELIMITER ',');

      SELECT
        (SELECT count(*) FROM valuation) AS items_in_stock,
        (SELECT count(*) FROM count_variances) AS count_differences,
        format('{:,.2f}', t.book_value) AS book_value, round(t.count_variance, 2) AS count_variance,
        format('{:,.2f}', t.counted_value) AS counted_value,
        round(t.nrv_writedown, 2) AS nrv_writedown, round(t.provision, 2) AS provision,
        format('{:,.2f}', t.counted_value - t.nrv_writedown - t.provision) AS carrying_value,
        (SELECT string_agg(family || ' ' || format('{:,.0f}', w), ', ' ORDER BY w DESC) FROM (SELECT family, sum(nrv_writedown) AS w FROM valuation GROUP BY family HAVING sum(nrv_writedown) > 0)) AS nrv_by_family,
        (SELECT string_agg(family || ' ' || format('{:,.0f}', p), ', ' ORDER BY p DESC) FROM (SELECT family, sum(provision) AS p FROM valuation GROUP BY family HAVING sum(provision) > 0)) AS provision_by_family,
        (SELECT count(*) FROM valuation WHERE provision_rate = 1) AS fully_provided,
        round(100 * (abs(t.count_variance) + abs(t.nrv_writedown - {{ fromJson(outputs.period_control.values.last).nrv }}) + abs(t.provision - {{ fromJson(outputs.period_control.values.last).provision }})) / t.book_value, 2) AS adjustment_pct,
        (SELECT sum(debit) = sum(credit) FROM journal) AS journal_balances,
        (SELECT count(*) FROM blockers) AS blockers,
        (SELECT coalesce(string_agg(code || ' ' || ref || ': ' || detail, '; ' ORDER BY code, ref), '') FROM blockers) AS blocker_detail
      FROM totals t;

  - id: result
    type: io.kestra.plugin.core.output.OutputValues
    values:
      r: "{{ (outputs.value.outputs | last).row | toJson }}"

  - id: log_valuation
    type: io.kestra.plugin.core.log.Log
    message: |
      Inventory valuation at {{ inputs.count_date }} ({{ inputs.scenario }}).
      {{ outputs.result.values.r | jq('"\(.items_in_stock) items in stock. Stock ledger \(.book_value). Count: \(.count_differences) differences, net \(.count_variance)."') | first }}
      {{ outputs.result.values.r | jq('"At cost \(.counted_value). NRV write-down \(.nrv_writedown) (\(.nrv_by_family)). Slow-moving provision \(.provision) (\(.provision_by_family)), \(.fully_provided) items fully provided."') | first }}
      {{ outputs.result.values.r | jq('"Carrying value \(.carrying_value). Adjustments \(.adjustment_pct)% of inventory. Journal balances: \(.journal_balances)."') | first }}
      {{ outputs.result.values.r | jq('"Blockers: \(.blockers). \(.blocker_detail)"') | first }}

  - id: evidence
    type: io.kestra.plugin.core.namespace.UploadFiles
    namespace: "{{ flow.namespace }}"
    filesMap:
      "{{ render(vars.pack_dir) }}/valuation.csv": "{{ outputs.value.outputFiles.valuation }}"
      "{{ render(vars.pack_dir) }}/count-variances.csv": "{{ outputs.value.outputFiles.count_variances }}"
      "{{ render(vars.pack_dir) }}/journal.csv": "{{ outputs.value.outputFiles.journal }}"
      "{{ render(vars.pack_dir) }}/blockers.csv": "{{ outputs.value.outputFiles.blockers }}"

  - id: decide
    type: io.kestra.plugin.core.flow.Switch
    value: >-
      {%- set r = outputs.result.values.r -%}
      {%- if (r | jq('.blockers') | first) > 0 -%}BLOCKED
      {%- elseif not (r | jq('.journal_balances') | first) -%}OUT_OF_BALANCE
      {%- elseif (r | jq('.adjustment_pct') | first) > 1 and inputs.approved_by == '' -%}NEEDS_APPROVAL
      {%- else -%}READY{%- endif -%}
    cases:
      READY:
        - id: lock_period
          type: io.kestra.plugin.core.kv.Set
          description: The provisions become the opening provisions the next valuation adjusts from.
          key: "{{ vars.lock_key }}"
          kvType: JSON
          value: |
            {"count_date": "{{ inputs.count_date }}", "closed_at": "{{ now() }}", "execution_id": "{{ execution.id }}",
             "nrv": {{ outputs.result.values.r | jq('.nrv_writedown') | first }},
             "provision": {{ outputs.result.values.r | jq('.provision') | first }},
             "count_variance": {{ outputs.result.values.r | jq('.count_variance') | first }},
             "approved_by": "{{ inputs.approved_by }}"}

        - id: log_closed
          type: io.kestra.plugin.core.log.Log
          message: "Inventory valued at {{ inputs.count_date }}: carrying value {{ outputs.result.values.r | jq('.carrying_value') | first }}. Post {{ render(vars.pack_dir) }}/journal.csv."

      NEEDS_APPROVAL:
        - id: approval_required
          type: io.kestra.plugin.core.execution.Fail
          errorMessage: >-
            Adjustments are {{ outputs.result.values.r | jq('.adjustment_pct') | first }}% of inventory: count {{ outputs.result.values.r | jq('.count_variance') | first }},
            NRV {{ outputs.result.values.r | jq('.nrv_writedown') | first }}, slow-moving {{ outputs.result.values.r | jq('.provision') | first }}.
            Review {{ render(vars.pack_dir) }}/valuation.csv and run again with approved_by.

      OUT_OF_BALANCE:
        - id: out_of_balance
          type: io.kestra.plugin.core.execution.Fail
          errorMessage: The adjustment journal does not balance. Do not post.

    defaults:
      - id: blocked
        type: io.kestra.plugin.core.execution.Fail
        errorMessage: "Inventory at {{ inputs.count_date }} not valued: {{ outputs.result.values.r | jq('.blocker_detail') | first }}"

extend:
  title: Value inventory at period end with count variances, NRV write-downs and slow-moving provisions
  metaTitle: Inventory valuation, NRV write-down and obsolescence provision with Kestra
  shortDescription: Post the stock count, value at weighted average cost, write down to net realisable value, provide for slow-moving stock from its cover, tie the stock ledger to the GL and post the adjustments.
  metaDescription: Period-end inventory valuation in Kestra and DuckDB. Count variances, weighted average cost, NRV write-down, slow-moving provision and journals.
  description: |
    Inventory is often the largest asset on a manufacturer's or distributor's balance sheet, and the one auditors attend in person. The period end involves:
    - counting it and explaining the differences,
    - carrying it at the lower of cost and net realisable value (IAS 2),
    - providing for stock that no longer sells.

    The usual tools are count sheets, an ERP valuation report and a spreadsheet matrix that someone refreshes once a year. This flow runs the whole valuation and refuses to post it while the count is incomplete or doubtful.

    It runs with no setup and no network. DuckDB generates:
    - 300 items in six product families and three warehouses;
    - two and a half years of weekly receipts and issues, with a cost that drifts;
    - an electronics family whose selling prices fell 35% below cost;
    - a legacy spare parts line no longer bought and barely used;
    - a count with small shrinkage and the odd mis-pick.


    ## Valuation rules

    | Step | Rule |
    |---|---|
    | Cost | Weighted average cost, recomputed on every receipt over the stock ledger (a recursive query). Issues never take stock below zero |
    | Count | Counted quantities replace book quantities. The variance is booked at average cost to count differences |
    | NRV | Selling price less `selling_cost_pct`. Where it is below cost, the item is written down to NRV (IAS 2.9) |
    | Slow-moving | Months of cover = counted quantity / average monthly usage over 12 months, provided by `provision_matrix` (0% under 12 months, 25%, 50%, then 100% from 36 months). No issue in 12 months means 100% |
    | No double counting | The slow-moving provision applies to the value left after the NRV write-down |
    | Journals | Count differences, and the movement of each provision against the level the last valuation stored in KV |

    ## What blocks the valuation

    - `NOT_COUNTED`: items with stock in a location that was not counted.
    - `UNKNOWN_ITEM`: a counted item missing from the item master.
    - `RECOUNT_REQUIRED`: a variance above 20% of book quantity and above `recount_threshold`.
    - `STOCK_LEDGER_DOES_NOT_TIE`: the perpetual stock ledger differs from the GL inventory account.
    - An unbalanced journal.

    Adjustments above 1% of inventory value need `approved_by`.

    ## How it works

    1. `period_control` and `period_gate` refuse a count date on or before the last valuation.
    2. `value` (`io.kestra.plugin.jdbc.duckdb.Queries`) builds the items, movements, weighted average cost, count and prices, then computes the variances, blockers, valuation, tie-out and journal.
    3. `log_valuation` prints the result by family. `evidence` stores `valuation.csv` (one row per item with cost, NRV, cover, provision and carrying value), `count-variances.csv`, `journal.csv` and `blockers.csv`.
    4. `decide` (`io.kestra.plugin.core.flow.Switch`):
       - `READY`: stores the provisions as the next opening levels.
       - Otherwise the run fails with the reason.

    ## Tested end to end

    On Kestra 2.0.3 OSS, in this order.

    | Run | Inputs | Result |
    |---|---|---|
    | 1 | 2026-09-30 | 264 items in stock, stock ledger 824,497.94. 35 count differences, net -1,752.75. NRV write-down 47,564.46 (electronics 43,478, legacy spares 4,086). Slow-moving provision 19,669.05 on legacy spares, 36 items fully provided. Carrying value 755,511.70. Adjustments are 8.37% of inventory: stops for approval |
    | 2 | same, `approved_by` | Valued, provisions stored |
    | 3 | 2026-12-31 `ISSUES` | Blocked by the 3 issues: 45 seal items in WH-SOUTH not counted; unknown item SKU-9001; SKU-0259 counted 106 against 192 (-4,527.86), recount required |
    | 4 | 2026-12-31 | Valued. The journal books the count differences and only the 1,028.85 increase in the NRV write-down, not the full provision again |
    | 5 | 2026-06-30 | Refused: before the last valuation |

    I recomputed every item's NRV write-down and slow-moving provision independently in Python from `valuation.csv`, and all 264 rows matched (47,564.46 and 19,669.05).

    ## Problems found while testing

    - **Stock piled up and 40% was provided.** The first generator bought more than it sold, so every item had years of cover and the provision was 1.5 million on 3.7 million. Receipts now replenish four weeks of demand, which leaves only the legacy line slow.
    - **The recount scenario hit an item that was not counted.** The "most valuable item" chosen for the bad count sat in the uncounted location, so no recount was ever raised. It is now chosen among counted items.
    - **December looked exactly like September.** The movements stopped at the end of September 2026. The stock ledger now runs into 2027.

    ## Inputs

    | Input | Default | Purpose |
    |---|---|---|
    | `count_date` | `2026-09-30` | Valuation date |
    | `scenario` | `CLEAN` | Demo only |
    | `provision_matrix` | 0 / 25 / 50 / 100% | Rate by months of cover |
    | `selling_cost_pct` | `8.0` | Costs to sell, for NRV |
    | `recount_threshold` | `2500.0` | Variance value that triggers a recount |
    | `approved_by` | empty | Needed above 1% of inventory |

    ## Use it with your data

    - Replace `items`, `movements`, `count_lines` and `prices` with your item master, stock ledger, count sheets and price list.
    - Replace `gl_inventory` with your GL inventory balance. The demo uses the stock ledger itself, so the tie-out always passes.
    - Use standard cost or FIFO instead of weighted average by changing the `ledger` query.

    ## Things to know

    - NRV here is item by item from the current price list. IAS 2.29 also allows groups of similar items, and expected price changes after the period end can be relevant.
    - Work in progress and finished goods need conversion costs absorbed at normal capacity. This flow values purchased stock.
    - Reset by deleting the KV key `inventory_valuation`.

