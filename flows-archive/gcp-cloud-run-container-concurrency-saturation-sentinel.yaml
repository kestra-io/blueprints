id: gcp-cloud-run-container-concurrency-saturation-sentinel
namespace: company.cloud

description: |
  Audits Google Cloud Run container instances and request concurrency metrics via Google Cloud Monitoring,
  alerting SRE teams on Slack when services near maximum autoscaling instance limits or suffer request queuing.

concurrency:
  limit: 1

inputs:
  - id: gcp_project_id
    type: STRING
    displayName: GCP Project ID
    defaults: my-production-project
    description: Google Cloud project ID hosting target Cloud Run services.

  - id: service_name_filter
    type: STRING
    displayName: Service Name Filter
    defaults: all
    description: Name or substring filter of Cloud Run services to audit, or all to scan all regional services.

  - id: max_instance_utilization_percent
    type: FLOAT
    displayName: Max Instance Utilization (%)
    defaults: 85.0
    description: Maximum allowable container instance count relative to maxScale before triggering scaling saturation alerts.

  - id: alert_on_saturation
    type: BOOL
    displayName: Alert on Saturation
    defaults: true
    description: Whether to dispatch automated Slack incident notifications when Cloud Run scaling saturation is detected.

tasks:
  - id: scan_cloud_run_concurrency
    type: io.kestra.plugin.scripts.python.Script
    description: Queries Google Cloud Run and Cloud Monitoring APIs to measure container concurrency and scaling headroom.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install google-cloud-monitoring google-cloud-run
    env:
      GCP_PROJECT_ID: "{{ inputs.gcp_project_id }}"
      GCP_SERVICE_ACCOUNT_KEY: "{{ secret('GCP_SERVICE_ACCOUNT_KEY') }}"
    script: |
      import os
      import json
      from datetime import datetime, timedelta, timezone
      from google.oauth2 import service_account
      from google.cloud import monitoring_v3
      from google.cloud import run_v2
      from kestra import Kestra

      project_id = os.environ.get("GCP_PROJECT_ID", "my-production-project")
      sa_key_json = os.environ.get("GCP_SERVICE_ACCOUNT_KEY", "")
      service_filter = "{{ inputs.service_name_filter }}".strip().lower()
      max_util_pct = float("{{ inputs.max_instance_utilization_percent }}")

      if sa_key_json:
          key_info = json.loads(sa_key_json)
          creds = service_account.Credentials.from_service_account_info(key_info)
          run_client = run_v2.ServicesClient(credentials=creds)
          metric_client = monitoring_v3.MetricServiceClient(credentials=creds)
      else:
          run_client = run_v2.ServicesClient()
          metric_client = monitoring_v3.MetricServiceClient()

      project_name = f"projects/{project_id}"
      now = datetime.now(timezone.utc)
      start_time = now - timedelta(minutes=15)

      interval = monitoring_v3.TimeInterval(
          start_time={"seconds": int(start_time.timestamp())},
          end_time={"seconds": int(now.timestamp())}
      )

      services_audited = 0
      saturated_services = []

      # Enumerate Cloud Run services across locations
      try:
          request = run_v2.ListServicesRequest(parent=f"projects/{project_id}/locations/-")
          page_result = run_client.list_services(request=request)

          for svc in page_result:
              svc_name = svc.name.split("/")[-1]
              location = svc.name.split("/")[3]

              if service_filter != "all" and service_filter not in svc_name.lower():
                  continue

              services_audited += 1

              scaling = svc.template.scaling
              max_scale = scaling.max_instance_count or 100

              # Query active instance count from Cloud Monitoring
              filter_str = f'metric.type = "run.googleapis.com/container/instance_count" AND resource.label.service_name = "{svc_name}"'
              results = metric_client.list_time_series(
                  request={
                      "name": project_name,
                      "filter": filter_str,
                      "interval": interval,
                      "view": monitoring_v3.ListTimeSeriesRequest.TimeSeriesView.FULL
                  }
              )

              peak_instances = 0
              for series in results:
                  for point in series.points:
                      peak_instances = max(peak_instances, int(point.value.int64_value))

              utilization_pct = (peak_instances / max_scale * 100.0) if max_scale > 0 else 0.0

              if utilization_pct >= max_util_pct or (max_scale > 1 and peak_instances >= max_scale):
                  saturated_services.append({
                      "service_name": svc_name,
                      "location": location,
                      "current_peak_instances": peak_instances,
                      "max_instance_limit": max_scale,
                      "utilization_percent": round(utilization_pct, 2),
                      "remediation": f"gcloud run services update {svc_name} --region {location} --max-instances {max_scale * 2}"
                  })
      except Exception as e:
          print(f"Error enumerating Cloud Run services: {e}")

      Kestra.outputs({
          "services_audited_count": services_audited,
          "saturated_services_count": len(saturated_services),
          "has_saturated_services": len(saturated_services) > 0,
          "saturated_services_details": json.dumps(saturated_services)
      })

  - id: check_cloud_run_saturation
    type: io.kestra.plugin.core.flow.If
    description: Evaluates whether any Cloud Run service is nearing or exceeding maxInstance scaling limits.
    condition: "{{ outputs.scan_cloud_run_concurrency.vars.has_saturated_services and inputs.alert_on_saturation }}"
    then:
      - id: notify_slack_cloud_run
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches high-priority incident notifications to Slack with service names and instance limits.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#cloud-run-alerts",
            "username": "CloudRun-Sentinel",
            "text": "CRITICAL: Google Cloud Run container scaling saturation detected in project `{{ inputs.gcp_project_id }}`. Services audited: `{{ outputs.scan_cloud_run_concurrency.vars.services_audited_count }}`, Saturated services: `{{ outputs.scan_cloud_run_concurrency.vars.saturated_services_count }}`."
          }

  - id: log_cloud_run_status
    type: io.kestra.plugin.core.log.Log
    description: Records an operational audit trail of Cloud Run container scaling evaluations.
    message: "Cloud Run audit completed for project '{{ inputs.gcp_project_id }}'. Services: {{ outputs.scan_cloud_run_concurrency.vars.services_audited_count }}, Saturated: {{ outputs.scan_cloud_run_concurrency.vars.saturated_services_count }}."

  - id: export_cloud_run_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Emits structured manifest of Cloud Run instance scaling telemetry and capacity limits.
    format:
      project_id: "{{ inputs.gcp_project_id }}"
      service_name_filter: "{{ inputs.service_name_filter }}"
      services_audited_count: "{{ outputs.scan_cloud_run_concurrency.vars.services_audited_count }}"
      saturated_services_count: "{{ outputs.scan_cloud_run_concurrency.vars.saturated_services_count }}"
      details: "{{ outputs.scan_cloud_run_concurrency.vars.saturated_services_details }}"

triggers:
  - id: scheduled_cloud_run_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: Automated schedule trigger auditing Cloud Run instance scaling every 15 minutes.
    cron: "*/15 * * * *"

extend:
  title: GCP Cloud Run Container Concurrency Saturation Sentinel
  metaTitle: GCP Cloud Run Container Concurrency Saturation Sentinel Blueprint
  shortDescription: Audits Google Cloud Run services to detect container instance saturation and scaling limits.
  metaDescription: Audits Google Cloud Run services for container concurrency saturation and instance quota limits, dispatching diagnostic alerts to SRE teams on Slack.
  description: |
    Serverless container architectures on Google Cloud Platform leverage Google Cloud Run to automatically scale HTTP microservices from zero to thousands of container instances. Each Cloud Run service specifies a `maxScale` (maximum instances) ceiling and container concurrency threshold to control cloud budget exposure. During sudden marketing campaigns, API traffic surges, or downstream database connection delays, container instances scale rapidly until hitting the configured `maxScale` cap. Once capped, subsequent client HTTP requests are queued or dropped with HTTP 429 Too Many Requests or HTTP 504 Gateway Timeout errors. This sentinel interrogates Google Cloud Run and Cloud Monitoring metrics on a recurring schedule, evaluates active instance counts against maximum limits, and alerts site reliability engineering teams on Slack with exact gcloud command remediations.

    ## How it works
    1. **Scheduled triggering**: Executes every 15 minutes via automated cron trigger (`*/15 * * * *`) or runs on-demand via manual API triggers.
    2. **Service discovery**: Queries the Google Cloud Run v2 REST API (`list_services`) across all regional locations within the project.
    3. **Autoscaling configuration inspection**: Retrieves `template.scaling.max_instance_count` to determine configured autoscaling caps.
    4. **Cloud Monitoring telemetry retrieval**: Fetches `run.googleapis.com/container/instance_count` time-series metrics over a 15-minute evaluation window.
    5. **Headroom analysis**: Computes instance utilization percentages and flags services operating above `max_instance_utilization_percent`.
    6. **Conditional escalation**: An `io.kestra.plugin.core.flow.If` task evaluates whether any Cloud Run service has exhausted scaling headroom.
    7. **Slack incident dispatch**: Emits rich incident cards to `#cloud-run-alerts` detailing service names, locations, peak instance counts, and CLI scaling commands.
    8. **Audit trail logging and return**: Logs operational telemetry and returns a structured JSON manifest for cloud capacity tracking.

    ## Architecture diagram
    ```mermaid
    flowchart TD
      A[scheduled_cloud_run_audit Schedule Trigger] --> B[scan_cloud_run_concurrency Python Script]
      B --> C[check_cloud_run_saturation Flowable If]
      C -- Saturation Detected --> D[notify_slack_cloud_run Webhook]
      C -- Capacity Healthy --> E[log_cloud_run_status Log]
      D --> E
      E --> F[export_cloud_run_manifest Return]
    ```

    ## Use cases
    - **Traffic surge protection**: Alert site reliability engineers before critical microservices hit maximum instance limits during flash sales or press releases.
    - **Resource bottleneck detection**: Identify slow database queries or external API calls causing requests to queue and force unnecessary container scaling.
    - **Project quota management**: Ensure aggregate Cloud Run instances across multiple microservices remain within regional GCP project instance quotas.

    ## Inputs
    | Name | Type | Default | Description |
    | :--- | :--- | :--- | :--- |
    | `gcp_project_id` | `STRING` | `my-production-project` | Google Cloud project ID hosting target Cloud Run services. |
    | `service_name_filter` | `STRING` | `all` | Name or substring filter of Cloud Run services to audit, or all to scan all regional services. |
    | `max_instance_utilization_percent` | `FLOAT` | `85.0` | Maximum allowable container instance count relative to maxScale before triggering scaling saturation alerts. |
    | `alert_on_saturation` | `BOOL` | `true` | Whether to dispatch automated Slack incident notifications when Cloud Run scaling saturation is detected. |

    ## Expected outputs
    - `{{ outputs.scan_cloud_run_concurrency.vars.services_audited_count }}`: Number of Cloud Run services evaluated during the audit.
    - `{{ outputs.scan_cloud_run_concurrency.vars.saturated_services_count }}`: Number of services operating near or at maximum instance limits.
    - `{{ outputs.scan_cloud_run_concurrency.vars.saturated_services_details }}`: Serialized JSON array of saturated services with scaling parameters.
    - `{{ outputs.export_cloud_run_manifest.value }}`: Structured dictionary containing the consolidated Cloud Run audit report.

    ## Prerequisites
    - Outbound HTTPS network access from Kestra execution workers to Google Cloud APIs (`run.googleapis.com` and `monitoring.googleapis.com`).
    - GCP Service Account JSON key configured with `roles/run.viewer` and `roles/monitoring.viewer` permissions.
    - Slack incoming webhook endpoint configured for cloud operational alerting.

    ### Secrets
    - `GCP_SERVICE_ACCOUNT_KEY`: Service account JSON credentials with read access to Cloud Run and Cloud Monitoring.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL used to dispatch scaling incident notifications.

    ## Quick start
    1. Define `GCP_SERVICE_ACCOUNT_KEY` and `SLACK_WEBHOOK_URL` in your Kestra Secret storage.
    2. Import this workflow into your Kestra instance under the `company.cloud` namespace.
    3. Configure `gcp_project_id` and `service_name_filter` to target your production Cloud Run workloads.
    4. Run a manual execution to test service discovery and verify Slack notification delivery.

    ## Common pitfalls and troubleshooting
    - **Service account permissions**: Ensure the Service Account possesses both `run.services.list` and `monitoring.timeSeries.list` roles across the target project.
    - **Multi-region services**: Use `locations/-` wildcard syntax when enumerating services to discover services across all Google Cloud regions.
    - **Default maxScale limit**: Cloud Run defaults `maxScale` to 100 instances unless explicitly configured; ensure capacity alerts align with subscribed quotas.

    ## How to extend
    - **Automated quota increase**: Add an automated step to invoke the Google Cloud Service Usage API to request higher regional instance quotas.
    - **Horizontal concurrency tuning**: Automatically adjust `containerConcurrency` parameters on services that scale out due to low request concurrency defaults.
    - **PagerDuty on-call escalation**: Escalate critical frontend Cloud Run service saturation directly to on-call platform engineers via PagerDuty.

    ## Links
    - [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
    - [Google Cloud Run Autoscaling Architecture](https://cloud.google.com/run/docs/about-instance-autoscaling)
    - [Cloud Monitoring Metrics for Cloud Run](https://cloud.google.com/monitoring/api/metrics#gcp-run)
  tags:
    - Cloud
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - Day 2 Operations
  ee: false
  demo: false
