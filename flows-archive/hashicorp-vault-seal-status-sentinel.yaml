id: hashicorp-vault-seal-status-sentinel
namespace: company.security

inputs:
  - id: vault_address
    type: STRING
    defaults: http://vault.internal:8200
    description: Base URL of the HashiCorp Vault cluster node to inspect.

tasks:
  - id: inspect_vault_cluster_health
    type: io.kestra.plugin.scripts.shell.Commands
    runner: PROCESS
    commands:
      - |
        curl -s "{{ inputs.vault_address }}/v1/sys/health" > health.json || true
        curl -s --header "X-Vault-Token: {{ secret('VAULT_TOKEN') }}"           "{{ inputs.vault_address }}/v1/sys/leader" > leader.json || true
        python3 -c "
        import json
        with open('health.json') as f:
            try:
                h = json.load(f)
            except Exception:
                h = {'sealed': True, 'initialized': False}
        with open('leader.json') as f:
            try:
                l = json.load(f)
            except Exception:
                l = {'is_self': False}
        is_sealed = h.get('sealed', True)
        is_init = h.get('initialized', False)
        cluster_degraded = is_sealed or (not is_init)
        result = {
            'vault_addr': '{{ inputs.vault_address }}',
            'initialized': is_init,
            'sealed': is_sealed,
            'version': h.get('version', 'unknown'),
            'cluster_name': h.get('cluster_name', 'unknown'),
            'is_leader': l.get('is_self', False),
            'alert_triggered': cluster_degraded
        }
        with open('vault_health.json', 'w') as out:
            json.dump(result, out)
        print('Vault health audit:', result)
        "
    outputFiles:
      - vault_health.json

  - id: evaluate_cluster_readiness
    type: io.kestra.plugin.core.flow.If
    condition: "{{ json(read(outputs.inspect_vault_cluster_health.outputFiles['vault_health.json'])).alert_triggered }}"
    then:
      - id: alert_security_operations
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "text": ":lock: *HashiCorp Vault Critical Alert*: Vault node at {{ inputs.vault_address }} is sealed or uninitialized (Sealed: {{ json(read(outputs.inspect_vault_cluster_health.outputFiles['vault_health.json'])).sealed }}). Immediate unseal intervention required."
          }

errors:
  - id: notify_sentinel_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "text": ":warning: *Vault Sentinel Execution Failure*: Unable to reach Vault endpoint at {{ inputs.vault_address }}."
      }

triggers:
  - id: scheduled_health_pulse
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/5 * * * *"
    disabled: true

extend:
  title: HashiCorp Vault Seal Status and HA Cluster Readiness Sentinel
  shortDescription: Audits HashiCorp Vault cluster nodes to verify seal status, initialization state, and leader readiness.
  description: |
    ## How it works
    This sentinel queries the HashiCorp Vault `/v1/sys/health` and `/v1/sys/leader` API endpoints. It validates that the node is properly initialized, unsealed, and able to participate in High Availability consensus, firing emergency notifications if an unexpected seal event locks out identity operations.

    ## What you get
    - Continuous programmatic validation of secret engine readiness.
    - Rapid detection of accidental node reboot or unseal threshold lockouts.
    - Immediate incident alerting sent directly to security operations channels.

    ## Who it's for
    - Security operations (SecOps) engineers and platform administrators managing Vault infrastructure.
    - SREs responsible for central secret management availability.

    ## Why orchestrate this with Kestra
    Kestra runs reliable lightweight health probes at scheduled intervals, automating critical infrastructure verifications without external monitoring dependencies.

    ## Prerequisites
    - Network connectivity to HashiCorp Vault HTTP/HTTPS port (default 8200).
    - Secrets `VAULT_TOKEN` and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import this blueprint into Kestra.
    2. Configure `vault_address` with your internal cluster DNS or load balancer.
    3. Trigger a manual execution to confirm cluster state.

    ## How to extend
    - Integrate with cloud KMS auto-unseal mechanisms to attempt automated node recovery.
    - Monitor Raft consensus storage peer states via `/v1/sys/storage/raft/configuration`.
    - Forward health telemetry to external SIEM tools.

    ## Links
    - [HashiCorp Vault Sys Health Documentation](https://developer.hashicorp.com/vault/api-docs/system/health)
    - [Kestra Slack Notifications](https://kestra.io/plugins/plugin-slack)
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Monitoring & Alerting
    - Governance & Compliance
  ee: false
  demo: false
