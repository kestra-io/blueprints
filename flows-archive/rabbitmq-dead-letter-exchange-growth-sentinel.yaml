id: rabbitmq-dead-letter-exchange-growth-sentinel
namespace: company.streaming

inputs:
  - id: rabbitmq_host
    type: STRING
    defaults: "rabbitmq.internal"
    description: Hostname of the RabbitMQ server.
  - id: rabbitmq_port
    type: INT
    defaults: 15672
    description: Port of the RabbitMQ Management API.
  - id: max_dlq_messages
    type: INT
    defaults: 50
    description: "Maximum allowable messages in Dead Letter Queues before alerting (default 50)."

tasks:
  - id: inspect_dlq_queues
    type: io.kestra.plugin.scripts.shell.Commands
    commands:
      - |
        # Query RabbitMQ Management API for queues configured with dead-letter exchange
        curl -s -u "{{ secret('RABBITMQ_USER') }}:{{ secret('RABBITMQ_PASSWORD') }}"           "http://{{ inputs.rabbitmq_host }}:{{ inputs.rabbitmq_port }}/api/queues" > /tmp/rmq_all_queues.json

        python3 -c "
        import json
        try:
            with open('/tmp/rmq_all_queues.json') as f:
                queues = json.load(f)
            dlq_count = 0
            dlq_names = []
            for q in queues:
                args = q.get('arguments', {})
                name = q.get('name', '')
                msgs = q.get('messages', 0)
                if 'dlq' in name.lower() or 'dead' in name.lower() or args.get('x-dead-letter-exchange'):
                    if msgs > {{ inputs.max_dlq_messages }}:
                        dlq_count += 1
                        dlq_names.append(f'{name}({msgs})')
            is_breach = 1 if dlq_count > 0 else 0
            print(f'{is_breach}|{dlq_count}|{", ".join(dlq_names[:3])}')
        except Exception:
            print('0|0|')
        " > /tmp/rmq_dlq_summary.txt

        IS_BREACH=
        DLQ_COUNT=
        SAMPLES=
        
        echo "::set-output name=is_breach::0::"
        echo "::set-output name=dlq_count::::"
        echo "::set-output name=samples::::"

  - id: evaluate_dlq_health
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.inspect_dlq_queues.vars.is_breach | int == 1 }}"
    then:
      - id: notify_streaming_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#streaming-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 RabbitMQ Dead Letter Queue Accumulation Alert",
                "text": "Detected {{ outputs.inspect_dlq_queues.vars.dlq_count }} queue(s) exceeding {{ inputs.max_dlq_messages }} dead-letter messages on {{ inputs.rabbitmq_host }}. Sample DLQs: {{ outputs.inspect_dlq_queues.vars.samples }}. Consumer processing exceptions or poisonous message payloads.",
                "footer": "Kestra Messaging Sentinel • RabbitMQ"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#streaming-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ RabbitMQ Sentinel Failure",
            "text": "Failed to communicate with RabbitMQ management API on {{ inputs.rabbitmq_host }}.",
            "footer": "Kestra Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  metaDescription: "Audits RabbitMQ queues for dead-letter message pileups to detect poison pill payloads and consumer failures."
  metaTitle: RabbitMQ Dead Letter Queue Message Accumulation Sentinel with Kestra
  ee: false
  demo: false
  title: RabbitMQ Dead Letter Queue Message Accumulation Sentinel
  shortDescription: Audits RabbitMQ queues for dead-letter message pileups to detect poison pill payloads and consumer failures.
  description: |
    ## How it works
    This workflow connects to the RabbitMQ Management HTTP API () to audit message accumulations in Dead Letter Queues (DLQs). In AMQP architectures, messages rejected via  or expired due to per-message TTL are routed to an . When producer schema changes introduce malformed payloads (poison pills) or consumer business validation fails systematically, dead letters accumulate rapidly. This sentinel tracks message counts across DLQs and dispatches an alert to streaming teams before unprocessable messages exhaust broker memory.

    ## What you get
    - Real-time visibility into RabbitMQ dead letter message pileups.
    - Rapid detection of poison pill messages and systemic consumer rejections.
    - Contextual Slack alerts detailing affected DLQ names and message counts.

    ## Who it's for
    - Message Queue Administrators maintaining RabbitMQ clusters.
    - Backend Engineers debugging asynchronous worker exceptions.
    - SREs safeguarding enterprise event-driven messaging reliability.

    ## Why orchestrate this with Kestra
    - **Automated Queue Surveillance**: Routinely monitors dead-letter queues without external monitoring agents.
    - **Encrypted Credential Protection**: Safely injects RabbitMQ management credentials via Kestra secrets.
    - **Incident Orchestration**: Notifies platform engineers directly in team collaboration channels.

    ## Prerequisites
    - RabbitMQ broker with enabled Management Plugin ().
    - Management credentials stored in  and  secrets.
    - Slack incoming webhook URL configured in  secret.

    ## Quick start
    1. Import this blueprint into your Kestra workspace.
    2. Add , , and  secrets.
    3. Specify , , and .
    4. Enable the schedule trigger for continuous DLQ surveillance.

    ## How to extend
    - Trigger an automated message redelivery or purge workflow via Management API.
    - Archive dead-letter message bodies to S3 or BigQuery for root-cause analysis.
    - Route critical alerts to PagerDuty or Opsgenie.

    ## Links
    - [RabbitMQ Dead Letter Exchanges Documentation](https://www.rabbitmq.com/docs/dlx)
    - [Kestra Shell Plugin](https://kestra.io/plugins/plugin-scripts-shell)
    - [Kestra Slack Notifications](https://kestra.io/plugins/plugin-slack)
  tags:
    - Data
    - Infrastructure
  subTags:
    - ELT & Data Landing
    - Day 2 Operations
