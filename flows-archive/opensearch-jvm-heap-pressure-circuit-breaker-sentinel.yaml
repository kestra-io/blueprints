id: opensearch-jvm-heap-pressure-circuit-breaker-sentinel
namespace: company.search

inputs:
  - id: opensearch_host
    type: STRING
    defaults: "opensearch.internal"
    description: Hostname or IP of OpenSearch node.
  - id: opensearch_port
    type: INT
    defaults: 9200
    description: OpenSearch HTTP port.
  - id: heap_threshold_pct
    type: INT
    defaults: 85
    description: "Maximum allowable JVM heap used percentage before alerting (default 85%)."

tasks:
  - id: query_node_stats
    type: io.kestra.plugin.scripts.shell.Commands
    commands:
      - |
        # Query OpenSearch node stats for JVM memory metrics
        curl -s -u "{{ inputs.opensearch_user }}:{{ secret('OPENSEARCH_PASSWORD') }}"           "http://{{ inputs.opensearch_host }}:{{ inputs.opensearch_port }}/_nodes/stats/jvm" > /tmp/opensearch_telemetry.json
        
        MAX_HEAP=$(jq '[.nodes[]?.jvm.mem.heap_used_percent // 0] | max // 0' /tmp/opensearch_telemetry.json)
        echo "::set-output name=max_heap_pct::$MAX_HEAP::"

  - id: evaluate_heap_pressure
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.query_node_stats.vars.max_heap_pct | int >= inputs.heap_threshold_pct }}"
    then:
      - id: notify_search_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#search-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 OpenSearch JVM Heap Memory Pressure Alert",
                "text": "OpenSearch cluster at `{{ inputs.opensearch_host }}` reached peak JVM heap utilization of *{{ outputs.query_node_stats.vars.max_heap_pct }}%* (threshold {{ inputs.heap_threshold_pct }}%)! Prolonged concurrent garbage collection pauses and OutOfMemoryError node crashes are imminent.",
                "footer": "Kestra Search Sentinel • OpenSearch"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#search-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ OpenSearch JVM Sentinel Failure",
            "text": "Failed to query OpenSearch _nodes/stats/jvm. Verify host address and credentials.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  metaDescription: "Monitors OpenSearch cluster nodes for JVM heap memory pressure exceeding 85% to prevent out-of-memory crashes."
  metaTitle: OpenSearch Cluster JVM Heap Memory Pressure and Breaker Sentinel with Kestra
  title: OpenSearch Cluster JVM Heap Memory Pressure and Breaker Sentinel
  shortDescription: Monitors OpenSearch cluster nodes for JVM heap memory pressure exceeding 85% to prevent out-of-memory crashes.
  description: |
    ## How it works
    This workflow connects to the OpenSearch Nodes Stats API (`/_nodes/stats/jvm`) using basic authentication to evaluate `heap_used_percent` across all cluster nodes. In OpenSearch, when heap utilization exceeds 85%, the JVM experiences prolonged "Stop the World" garbage collection pauses. Nodes become unresponsive to cluster state pings, get ejected by the cluster manager as dead nodes, and trigger expensive index shard reallocations that worsen cluster overload. This workflow continuously inspects heap pressure and raises alerts before node ejections occur.

    ## What you get
    - Real-time detection of critical JVM heap memory exhaustion in OpenSearch.
    - Prevents node ejections, shard unassigned states, and query timeouts.
    - Quantitative metrics on maximum heap utilization across data nodes.

    ## Who it's for
    - OpenSearch Cluster Administrators and Search Platform Engineers.
    - SREs maintaining high-volume search and log analytics clusters.

    ## Why orchestrate this with Kestra
    - **Continuous Cluster Health Auditing**: Regularly polls node health metrics without standalone monitoring daemons.
    - **Secure Credential Injection**: Passes OpenSearch credentials safely via Kestra secrets.
    - **Instant Team Escalation**: Delivers structured notifications with heap metrics to Slack.

    ## Prerequisites
    - OpenSearch cluster with HTTP API reachable.
    - Secrets `OPENSEARCH_PASSWORD` and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import the blueprint.
    2. Input OpenSearch host, port, and user.
    3. Run the workflow to inspect node heap utilization.

    ## How to extend
    - Query fielddata and query cache memory footprint directly via `_nodes/stats/indices`.
    - Automatically clear search cache via `POST /_cache/clear` when heap approaches 90%.

    ## Links
    - [OpenSearch Node Stats API Documentation](https://opensearch.org/docs/latest/api-reference/nodes-apis/nodes-stats/)
    - [Kestra Documentation](https://kestra.io/docs)
  tags:
    - Data
    - Infrastructure
  subTags:
    - ELT & Data Landing
    - Day 2 Operations
  ee: false
  demo: false
