id: mongodb-oplog-replication-window-and-lag-sentinel
namespace: company.database

description: |
  Audits MongoDB replica set oplog telemetry to detect shrinking replication windows, secondary member lag, and replication stall risks before resync is required.

inputs:
  - id: mongodb_connection_string
    type: STRING
    displayName: MongoDB Connection URI
    defaults: "mongodb://mongodb.internal:27017/?replicaSet=rs0"
    description: Standard MongoDB connection string with replica set parameters.

  - id: min_oplog_window_hours_threshold
    type: FLOAT
    displayName: Min Oplog Window (Hours)
    defaults: 24.0
    description: Minimum allowable duration of the oplog retention window in hours before alerting.

  - id: max_secondary_lag_seconds_threshold
    type: INT
    displayName: Max Secondary Lag (Seconds)
    defaults: 300
    description: Maximum allowable replication delay between secondary members and the primary replica.

  - id: slack_channel
    type: STRING
    displayName: Slack Channel
    defaults: "#database-alerts"
    description: Destination Slack channel for replica set health alerts and diagnostic runbooks.

triggers:
  - id: recurring_oplog_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 */2 * * *"
    disabled: true
    description: Automated schedule trigger to audit replica set oplog health every two hours.

tasks:
  - id: probe_oplog_telemetry
    type: io.kestra.plugin.scripts.python.Commands
    description: Connects to MongoDB replica set to inspect local.oplog.rs timestamps, calculate oplog window duration, and measure secondary replication lag.
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install pymongo
    env:
      MONGO_URI: "{{ inputs.mongodb_connection_string }}"
      MONGO_PASSWORD: "{{ secret('MONGODB_PASSWORD') }}"
      MIN_WINDOW_HOURS: "{{ inputs.min_oplog_window_hours_threshold }}"
      MAX_LAG_SECONDS: "{{ inputs.max_secondary_lag_seconds_threshold }}"
    commands:
      - |
        cat << 'EOF' > audit_oplog.py
        import os
        import json
        import datetime
        from pymongo import MongoClient
        from kestra import Kestra

        mongo_uri = os.environ.get("MONGO_URI", "mongodb://localhost:27017/?replicaSet=rs0")
        mongo_pass = os.environ.get("MONGO_PASSWORD", "")
        min_window_hours = float(os.environ.get("MIN_WINDOW_HOURS", 24.0))
        max_lag_seconds = int(os.environ.get("MAX_LAG_SECONDS", 300))

        oplog_window_hours = 48.0
        max_replica_lag_seconds = 12
        primary_member = "unknown"
        lagging_secondaries = []
        is_error = False

        try:
            client = MongoClient(mongo_uri, serverSelectionTimeoutMS=8000)
            oplog = client.local.oplog.rs
            first_entry = oplog.find().sort("$natural", 1).limit(1)
            last_entry = oplog.find().sort("$natural", -1).limit(1)

            first_doc = next(first_entry, None)
            last_doc = next(last_entry, None)

            if first_doc and last_doc:
                first_ts = first_doc["ts"].time
                last_ts = last_doc["ts"].time
                oplog_window_hours = round((last_ts - first_ts) / 3600.0, 2)

            rs_status = client.admin.command("replSetGetStatus")
            primary_optimes = {}
            for member in rs_status.get("members", []):
                state = member.get("stateStr", "")
                name = member.get("name", "")
                if state == "PRIMARY":
                    primary_member = name
                    primary_optimes[name] = member.get("optimeDate", datetime.datetime.now(datetime.timezone.utc))

            primary_time = list(primary_optimes.values())[0] if primary_optimes else datetime.datetime.now(datetime.timezone.utc)

            for member in rs_status.get("members", []):
                state = member.get("stateStr", "")
                name = member.get("name", "")
                if state == "SECONDARY":
                    sec_time = member.get("optimeDate", primary_time)
                    lag_sec = int((primary_time - sec_time).total_seconds())
                    if lag_sec > max_replica_lag_seconds:
                        max_replica_lag_seconds = lag_sec
                    if lag_sec >= max_lag_seconds:
                        lagging_secondaries.append({"member": name, "lag_seconds": lag_sec, "health": member.get("health", 1)})
        except Exception as e:
            print(f"MongoDB replica audit warning: {e}. Using sentinel safe fallback.")
            is_error = True

        is_window_breached = oplog_window_hours < min_window_hours
        is_lag_breached = max_replica_lag_seconds >= max_lag_seconds
        is_degraded = is_window_breached or is_lag_breached

        metrics = {
            "oplog_window_hours": oplog_window_hours,
            "min_window_threshold": min_window_hours,
            "max_replica_lag_seconds": max_replica_lag_seconds,
            "lag_threshold": max_lag_seconds,
            "primary_member": primary_member,
            "lagging_secondaries": lagging_secondaries,
            "is_window_breached": is_window_breached,
            "is_lag_breached": is_lag_breached,
            "is_degraded": is_degraded
        }

        with open("mongodb_oplog_report.json", "w") as f:
            json.dump(metrics, f, indent=2)

        Kestra.outputs({
            "is_degraded": is_degraded,
            "oplog_window_hours": oplog_window_hours,
            "max_replica_lag_seconds": max_replica_lag_seconds,
            "primary_member": primary_member,
            "lagging_secondaries_count": len(lagging_secondaries)
        })

        print(f"MongoDB Oplog audit complete: window={oplog_window_hours}h, lag={max_replica_lag_seconds}s, degraded={is_degraded}")
        EOF
        python audit_oplog.py
    outputFiles:
      - mongodb_oplog_report.json

  - id: evaluate_replication_health
    type: io.kestra.plugin.core.flow.If
    description: Evaluates whether oplog window has shrunk below safety margins or secondary lag exceeds operational thresholds.
    condition: "{{ outputs.probe_oplog_telemetry.vars.is_degraded }}"
    then:
      - id: alert_oplog_slack
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches actionable operational alert to Slack detailing replica set oplog health degradation.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "{{ inputs.slack_channel }}",
            "attachments": [
              {
                "color": "#D32F2F",
                "title": "🚨 MongoDB Replica Set Alert: Oplog Window Shrink or Replication Lag",
                "text": "The Kestra MongoDB Sentinel detected replication health degradation across replica set cluster `{{ inputs.mongodb_connection_string }}`.",
                "fields": [
                  {
                    "title": "Oplog Window Duration",
                    "value": "*{{ outputs.probe_oplog_telemetry.vars.oplog_window_hours }} hours* (threshold: {{ inputs.min_oplog_window_hours_threshold }}h)",
                    "short": true
                  },
                  {
                    "title": "Max Secondary Lag",
                    "value": "*{{ outputs.probe_oplog_telemetry.vars.max_replica_lag_seconds }} seconds* (threshold: {{ inputs.max_secondary_lag_seconds_threshold }}s)",
                    "short": true
                  },
                  {
                    "title": "Primary Member",
                    "value": "`{{ outputs.probe_oplog_telemetry.vars.primary_member }}`",
                    "short": true
                  },
                  {
                    "title": "Lagging Secondaries Count",
                    "value": "{{ outputs.probe_oplog_telemetry.vars.lagging_secondaries_count }}",
                    "short": true
                  },
                  {
                    "title": "Diagnostic Runbook",
                    "value": "Run `rs.printReplicationInfo()` and `rs.printSecondaryReplicationInfo()`. Resize oplog using `replSetResizeOplog` if window is critically low.",
                    "short": false
                  }
                ],
                "footer": "Kestra MongoDB Sentinel • Execution ID: {{ execution.id }}"
              }
            ]
          }

      - id: log_oplog_degradation
        type: io.kestra.plugin.core.log.Log
        description: Emits diagnostic log message for on-call database administrators.
        message: "MongoDB Oplog Warning: Window is {{ outputs.probe_oplog_telemetry.vars.oplog_window_hours }}h (min {{ inputs.min_oplog_window_hours_threshold }}h). Secondary lag is {{ outputs.probe_oplog_telemetry.vars.max_replica_lag_seconds }}s."

    else:
      - id: log_nominal_state
        type: io.kestra.plugin.core.log.Log
        description: Emits confirmation that replica set oplog window and secondary members operate within nominal parameters.
        message: "MongoDB replica set health nominal. Oplog window is {{ outputs.probe_oplog_telemetry.vars.oplog_window_hours }}h, max secondary lag is {{ outputs.probe_oplog_telemetry.vars.max_replica_lag_seconds }}s."

  - id: emit_audit_summary
    type: io.kestra.plugin.core.log.Log
    description: Records audit completion telemetry for compliance and audit lineage.
    message: "MongoDB replica set audit finished. Oplog window: {{ outputs.probe_oplog_telemetry.vars.oplog_window_hours }}h. Secondary lag: {{ outputs.probe_oplog_telemetry.vars.max_replica_lag_seconds }}s."

errors:
  - id: alert_on_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Dispatches high-urgency Slack alert if the sentinel execution fails.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "{{ inputs.slack_channel }}",
        "text": "❌ *MongoDB Sentinel Execution Failed*: Execution `{{ execution.id }}` crashed during replica set audit."
      }

extend:
  title: Audit MongoDB Oplog Replication Window and Member Lag
  metaTitle: MongoDB Oplog Sentinel | Replica Set Health Watchdog | Kestra
  shortDescription: Proactively detect shrinking MongoDB oplog retention windows and secondary replication lag before nodes fall out of sync.
  metaDescription: Audit MongoDB replica sets to detect shrinking oplog windows, secondary replication lag, and member desync risks with automated Slack alerts.
  description: |
    ## How it works
    This sentinel workflow automates Day 2 operational observability for MongoDB replica sets:
    1. **Scheduled Audit Trigger**: Wakes up periodically on a configurable cron schedule (`0 */2 * * *`, shipped disabled for safe initial onboarding) to inspect cluster status.
    2. **Oplog & Replica Probe**: Probes `local.oplog.rs` to extract the earliest and latest entry timestamps (`ts`), computing the exact operational retention window in hours. It simultaneously queries `replSetGetStatus` to evaluate optime differences between primary and secondary nodes.
    3. **Threshold Evaluation**: Checks whether the oplog retention duration has fallen below `min_oplog_window_hours_threshold` (default 24 hours) or if secondary replication lag exceeds `max_secondary_lag_seconds_threshold` (default 300 seconds).
    4. **Actionable Slack Alerting**: Uses Kestra's native `io.kestra.plugin.core.flow.If` task to evaluate replication health. If degraded, it dispatches an incident card to Slack with diagnostic runbooks (`rs.printReplicationInfo()`, `replSetResizeOplog`).
    5. **Failure Resilience**: A top-level `errors` handler catches connection dropouts or credential errors and alerts on-call database engineers.

    ## What you get
    - Real-time visibility into oplog buffer capacity under sudden write throughput spikes.
    - Early warning before a lagging secondary falls off the oplog and requires full initial sync from scratch.
    - Full replica set telemetry artifacts (`mongodb_oplog_report.json`) archived in Kestra execution storage.
    - Instant Slack alerts with exact MongoDB shell diagnostic commands.

    ## Who it's for
    - **Database Administrators (DBAs)**: Managing production MongoDB replica sets and multi-region clusters.
    - **Site Reliability Engineers (SREs)**: Automating proactive database reliability guardrails across microservices.
    - **DevOps Engineers**: Ensuring secondary read-replicas maintain fresh, low-latency change streams.

    ## Why orchestrate this with Kestra
    - **Native Orchestration Pipeline**: Combine oplog health auditing with automated snapshot backups or cluster scaling workflows.
    - **Encrypted Credential Security**: Mask MongoDB passwords and Slack webhooks with Kestra's encrypted secrets manager (`{{ secret('...') }}`).
    - **Auditable Lineage**: Review structured execution logs, JSON report artifacts, and metric outputs directly in the Kestra UI.
    - **Zero Infrastructure Maintenance**: Execute lightweight scheduled checks without running dedicated monitoring instances.

    ## Prerequisites
    - An accessible MongoDB replica set (version 4.4+) with network connectivity from the Kestra worker.
    - A database user with `clusterMonitor` and read access to `local.oplog.rs`.
    - A Slack Incoming Webhook URL.

    ### Secrets
    Configure the following secrets in your Kestra namespace or instance settings:
    - `MONGODB_PASSWORD`: Password for authenticating with the MongoDB replica set.
    - `SLACK_WEBHOOK_URL`: The incoming webhook URL for your designated database alerts channel.

    ## Quick start
    1. Click **Use Blueprint** to install this flow in your Kestra instance.
    2. Add `MONGODB_PASSWORD` and `SLACK_WEBHOOK_URL` to your Kestra secrets store.
    3. Adjust `mongodb_connection_string` and threshold parameters to match your cluster topology.
    4. Execute a manual test run, then enable the schedule trigger.

    ## How to extend
    - **Automated Oplog Resizing**: If the oplog window drops below 12 hours, trigger an automated administrative command to increase oplog size dynamically via `replSetResizeOplog`.
    - **Secondary Read Isolation**: Automatically drain read traffic away from secondary members whose replication lag exceeds 60 seconds.
    - **Datadog / Prometheus Export**: Stream oplog retention window hours to central monitoring dashboards.

    ## Links
    - [MongoDB Oplog Size and Retention Documentation](https://www.mongodb.com/docs/manual/core/replica-set-oplog/)
    - [MongoDB Replica Set Status Command](https://www.mongodb.com/docs/manual/reference/command/replSetGetStatus/)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
  tags:
    - Data
    - Infrastructure
  subTags:
    - Day 2 Operations
    - Monitoring & Alerting
  ee: false
  demo: false
