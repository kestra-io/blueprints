id: helm-release-unhealthy-status-sentinel
namespace: company.kubernetes

inputs:
  - id: target_namespace
    type: STRING
    defaults: "default"
    description: Kubernetes namespace to audit for failed Helm releases.
  - id: kubeconfig_secret_name
    type: STRING
    defaults: "KUBECONFIG_DATA"
    description: Secret containing base64-encoded Kubeconfig credentials.

tasks:
  - id: inspect_helm_releases
    type: io.kestra.plugin.scripts.shell.Commands
    commands:
      - |
        # Configure kubeconfig credentials
        mkdir -p ~/.kube
        echo "{{ secret(inputs.kubeconfig_secret_name) }}" | base64 -d > ~/.kube/config
        
        # List Helm releases in failed, pending-install, or pending-upgrade states
        helm list -n "{{ inputs.target_namespace }}" -o json > /tmp/helm_releases.json

        python3 -c "
        import json
        try:
            with open('/tmp/helm_releases.json') as f:
                releases = json.load(f)
            failed = []
            for r in releases:
                status = r.get('status', '')
                name = r.get('name', '')
                if status in ['failed', 'pending-install', 'pending-upgrade', 'pending-rollback', 'uninstalling']:
                    failed.append(f'{name}({status})')
            is_breach = 1 if len(failed) > 0 else 0
            print(f'{is_breach}|{len(failed)}|{\", \".join(failed[:5])}')
        except Exception:
            print('0|0|')
        " > /tmp/helm_summary.txt

        IS_BREACH=$(cut -d '|' -f 1 /tmp/helm_summary.txt)
        FAILED_COUNT=$(cut -d '|' -f 2 /tmp/helm_summary.txt)
        FAILED_NAMES=$(cut -d '|' -f 3 /tmp/helm_summary.txt)
        
        echo "::set-output name=is_breach::${IS_BREACH:-0}::"
        echo "::set-output name=failed_count::${FAILED_COUNT:-0}::"
        echo "::set-output name=failed_names::$FAILED_NAMES::"

  - id: evaluate_release_health
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.inspect_helm_releases.vars.is_breach | int == 1 }}"
    then:
      - id: notify_platform_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#k8s-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 Helm Release Failure Alert",
                "text": "Detected {{ outputs.inspect_helm_releases.vars.failed_count }} unhealthy Helm release(s) in namespace {{ inputs.target_namespace }}. Affected Releases: {{ outputs.inspect_helm_releases.vars.failed_names }}.",
                "footer": "Kestra Kubernetes Sentinel • Helm"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#k8s-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ Helm Sentinel Failure",
            "text": "Failed to inspect Helm releases in namespace {{ inputs.target_namespace }}.",
            "footer": "Kestra Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  metaDescription: "Audits Kubernetes namespaces for failed, stuck, or drifted Helm chart releases."
  metaTitle: Helm Release Unhealthy Status and Upgrade Drift Sentinel with Kestra
  ee: false
  demo: false
  title: Helm Release Unhealthy Status and Upgrade Drift Sentinel
  shortDescription: Audits Kubernetes namespaces for failed, stuck, or drifted Helm chart releases.
  description: |
    ## How it works
    This workflow connects to a Kubernetes cluster using configured Kubeconfig credentials and executes `helm list -o json` to inspect the release status of all deployed charts in a designated namespace. When deployment hooks fail, manifest schemas are rejected by the API server, or readiness probes time out during rolling upgrades, Helm marks the release status as `failed`, `pending-install`, or `pending-upgrade`. In this state, subsequent Helm deployments are blocked. This sentinel audits release statuses and alerts platform teams before manual rollback windows expire.

    ## What you get
    - Real-time detection of failed and stuck Helm deployments.
    - Protection against blocked CI/CD continuous deployment queues.
    - Actionable Slack notifications detailing failing release names and status.

    ## Who it's for
    - Kubernetes Platform Engineers managing Helm-based software packaging.
    - DevOps Teams operating continuous delivery pipelines.
    - Site Reliability Engineers ensuring application rollout reliability.

    ## Why orchestrate this with Kestra
    - **Native CLI Capabilities**: Executes official `helm` commands securely within ephemeral execution runners.
    - **Automated Rollback Integration**: Can automatically execute `helm rollback` upon release failure detection.
    - **Multi-Cluster Support**: Audits multiple clusters and namespaces concurrently.

    ## Prerequisites
    - Helm CLI installed in the execution environment.
    - Base64-encoded Kubeconfig stored in secret `KUBECONFIG_DATA`.
    - Slack incoming webhook configured in `SLACK_WEBHOOK` secret.

    ## Quick start
    1. Import this blueprint into your Kestra workspace.
    2. Define `KUBECONFIG_DATA` and `SLACK_WEBHOOK` secrets.
    3. Specify the target `target_namespace`.
    4. Enable the schedule trigger to activate automated release monitoring.

    ## How to extend
    - Trigger an automatic `helm rollback <release> 0` to revert to the last stable revision.
    - Audit releases across all namespaces using `--all-namespaces`.
    - Check release revision ages to detect stale deployments that have not upgraded in months.

    ## Links
    - [Helm CLI Documentation](https://helm.sh/docs/helm/helm_list/)
    - [Kestra Shell Plugin](https://kestra.io/plugins/plugin-scripts-shell)
    - [Kestra Slack Notifications](https://kestra.io/plugins/plugin-slack)
  tags:
    - Cloud
    - Infrastructure
  subTags:
    - CI/CD & Deployment
    - Infrastructure Automation
