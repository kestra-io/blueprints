id: pulsar-subscription-backlog-sentinel
namespace: company.team
description: |
  Query a Pulsar topic's admin stats endpoint on a schedule, flag any
  subscription whose message backlog exceeds a threshold or has zero
  connected consumers, classify the result as HEALTHY, AT_RISK, or
  UNREACHABLE, log clean audits, and alert Slack the moment consumers
  are falling behind or the broker cannot be reached.

inputs:
  - id: pulsar_admin_stats_url
    type: STRING
    defaults: "http://pulsar:8080/admin/v2/persistent/public/default/orders/stats"
    displayName: "Pulsar Admin Stats URL"
    description: "Full HTTP URL to a Pulsar topic's admin REST stats endpoint, format /admin/v2/persistent/{tenant}/{namespace}/{topic}/stats."
  - id: backlog_critical_threshold
    type: INT
    defaults: 10000
    displayName: "Backlog Critical Threshold"
    description: "Message count above which a subscription's msgBacklog is classified AT_RISK."
  - id: check_idle_subscriptions
    type: SELECT
    defaults: "true"
    values:
      - "true"
      - "false"
    displayName: "Flag Zero-Consumer Subscriptions"
    description: "When true, a subscription with zero connected consumers is also classified AT_RISK, even if its backlog is currently low."

triggers:
  - id: pulsar_backlog_sentinel_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    description: "Audit subscription backlog every 15 minutes."
    cron: "*/15 * * * *"
    disabled: true
    inputs:
      pulsar_admin_stats_url: "http://pulsar:8080/admin/v2/persistent/public/default/orders/stats"
      backlog_critical_threshold: 10000
      check_idle_subscriptions: "true"

tasks:
  - id: fetch_topic_stats
    type: io.kestra.plugin.core.http.Request
    description: "Query the Pulsar broker's admin REST stats endpoint for the topic. plugin-pulsar has no dedicated admin or backlog monitoring task (only Produce, Consume, Trigger, RealtimeTrigger), so this uses the core HTTP task directly against Pulsar's own admin API."
    uri: "{{ inputs.pulsar_admin_stats_url }}"
    method: GET
    allowFailure: true

  - id: classify_backlog_status
    type: io.kestra.plugin.core.debug.Return
    description: "Classify UNREACHABLE when the stats endpoint returned no body, AT_RISK when at least one subscription breaches the backlog threshold or (when enabled) has zero consumers, otherwise HEALTHY."
    format: "{{ outputs.fetch_topic_stats.body is defined ? ((outputs.fetch_topic_stats.body | jq(inputs.check_idle_subscriptions == 'true' ? '[.subscriptions | to_entries[] | select(.value.msgBacklog > ' ~ inputs.backlog_critical_threshold ~ ' or (.value.consumers | length) == 0) | .key] | length' : '[.subscriptions | to_entries[] | select(.value.msgBacklog > ' ~ inputs.backlog_critical_threshold ~ ') | .key] | length') | first | default(0)) > 0 ? 'AT_RISK' : 'HEALTHY') : 'UNREACHABLE' }}"

  - id: route_by_backlog_status
    type: io.kestra.plugin.core.flow.Switch
    description: "Log a quiet confirmation when healthy, page Slack when a subscription is falling behind, or page Slack when the broker could not be queried."
    value: "{{ outputs.classify_backlog_status.value }}"
    cases:
      "HEALTHY":
        - id: log_healthy
          type: io.kestra.plugin.core.log.Log
          message: "No subscription on {{ inputs.pulsar_admin_stats_url }} breaches the backlog threshold of {{ inputs.backlog_critical_threshold }}."
      "AT_RISK":
        - id: alert_at_risk
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "text": "Pulsar sentinel AT_RISK: at least one subscription on {{ inputs.pulsar_admin_stats_url }} exceeds the backlog threshold of {{ inputs.backlog_critical_threshold }} or has zero consumers (check_idle_subscriptions={{ inputs.check_idle_subscriptions }}). Execution {{ execution.id }}."
            }
      "UNREACHABLE":
        - id: alert_unreachable
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "text": "Pulsar sentinel UNREACHABLE: the admin stats endpoint {{ inputs.pulsar_admin_stats_url }} did not return a body (broker down, topic not yet created, or auth failure). Execution {{ execution.id }}."
            }
    defaults:
      - id: log_unclassified
        type: io.kestra.plugin.core.log.Log
        message: "Completed Pulsar backlog audit with status: {{ outputs.classify_backlog_status.value }}"

  - id: log_audit_status
    type: io.kestra.plugin.core.log.Log
    description: "Post-audit status line recorded on every run regardless of branch, for a continuous backlog trend in the execution history."
    message: "Pulsar backlog audit: url={{ inputs.pulsar_admin_stats_url }}, threshold={{ inputs.backlog_critical_threshold }}, check_idle_subscriptions={{ inputs.check_idle_subscriptions }}, status={{ outputs.classify_backlog_status.value }}, execution={{ execution.id }}."

errors:
  - id: alert_flow_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: "Alert Slack when the sentinel flow itself fails, so a broken audit never silently stops monitoring consumer backlog."
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "Pulsar backlog sentinel flow {{ flow.id }} FAILED (execution {{ execution.id }}). Backlog status is now unknown; check the task logs and the broker manually."
      }

outputs:
  - id: status
    type: STRING
    value: "{{ outputs.classify_backlog_status.value }}"

extend:
  title: "Pulsar Subscription Backlog Sentinel"
  shortDescription: Query a Pulsar topic's admin stats endpoint on a schedule, flag any subscription breaching a backlog threshold or running with zero consumers, and alert Slack.
  metaTitle: Pulsar Subscription Backlog Sentinel for Kestra
  metaDescription: Audit Pulsar topic subscription backlog and consumer count via the admin REST API and alert Slack when consumers fall behind.
  description: |
    A Pulsar subscription with a growing backlog and no connected consumer is the messaging-layer equivalent of a stalled pipeline, and nothing surfaces it until a downstream system notices stale data. This blueprint reads a topic's admin stats on a schedule, flags any subscription above a backlog threshold or with zero consumers, and pages Slack the moment one is found or the broker cannot be reached. plugin-pulsar ships Produce, Consume, Trigger, and RealtimeTrigger, but no admin or backlog monitoring task, so this uses the core HTTP task directly against Pulsar's own admin REST API.

    ## How it works

    1. `fetch_topic_stats` (`io.kestra.plugin.core.http.Request`) issues a `GET` against `pulsar_admin_stats_url` with `allowFailure: true`, so a connection failure, a missing topic, or an auth failure still lets the flow continue instead of aborting.
    2. `classify_backlog_status` (`io.kestra.plugin.core.debug.Return`) checks whether `outputs.fetch_topic_stats.body` is defined; if not, `UNREACHABLE`. Otherwise it runs a `jq` filter over the parsed stats body that counts subscriptions whose `msgBacklog` exceeds `backlog_critical_threshold`, also counting zero-consumer subscriptions when `check_idle_subscriptions` is `true`, and returns `AT_RISK` when that count is above zero, `HEALTHY` otherwise.
    3. `route_by_backlog_status` (`io.kestra.plugin.core.flow.Switch`) branches on that string: `HEALTHY` logs a quiet confirmation, `AT_RISK` pages Slack naming the URL and threshold, `UNREACHABLE` pages Slack separately, and `defaults` logs the raw outcome.
    4. `log_audit_status` records a status line on every run regardless of branch, so the execution history is a continuous backlog trend.
    5. The `errors` block pages Slack separately if the flow itself fails outright.
    6. The `pulsar_backlog_sentinel_schedule` trigger polls every 15 minutes with explicit input overrides, shipped `disabled: true` until you point it at a real topic.

    ## What you get

    - A scheduled, admin-API-native backlog and consumer-count audit with zero custom client code.
    - A three-way `status` output (`HEALTHY` / `AT_RISK` / `UNREACHABLE`) you can chart or gate other flows on.
    - A Slack page naming the stats URL, threshold, and idle-subscription mode behind a backlog finding.
    - A separate failure channel for the audit flow itself, plus a standing audit log line per run.

    ## Who it's for

    - Platform and messaging teams running self-managed Pulsar clusters who want an orchestrator-side check that consumers are keeping up.
    - Teams migrating consumers between services, where a forgotten old subscription silently accumulates backlog with nothing attached to drain it.

    ## Why orchestrate this with Kestra

    A one-off `pulsar-admin topics stats` from the CLI proves the backlog size for one moment. This flow keeps every audit in the execution history, turns the result into a typed output other flows can depend on, and gives you a Switch branch to grow into real remediation (scaling up a consumer group, opening a ticket, unsubscribing a dead subscription) without rewriting the audit itself.

    ## Prerequisites

    - A running Pulsar broker with its admin HTTP port reachable from the Kestra Worker. For local testing: `docker run -d --name pulsar -p 6650:6650 -p 8081:8080 apachepulsar/pulsar:latest bin/pulsar standalone`, then connect it to your Kestra worker's Docker network so `pulsar_admin_stats_url` resolves: `docker network connect YOUR_KESTRA_NETWORK pulsar` (run `docker network ls` to find the real network name). The flow reaches the broker on its container-internal port 8080 over that network; host port 8081 is only for browsing the admin API from your own machine.
    - The target topic must already exist (produce or consume at least one message, or create it with `pulsar-admin topics create`) before its stats endpoint returns data; a brand-new standalone broker has no topics yet.
    - A Slack incoming webhook for the at-risk and unreachable alerts.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack incoming webhook used for the at-risk alert, the unreachable alert, and the flow-failure alert.
    - OSS note: if your Kestra instance reads secrets from environment variables instead of a secrets backend, set `SECRET_SLACK_WEBHOOK_URL` as base64, for example `echo -n "<your-webhook-url>" | base64`.

    ### Inputs

    - `pulsar_admin_stats_url` (STRING, default `http://pulsar:8080/admin/v2/persistent/public/default/orders/stats`): full URL to the topic's admin stats endpoint.
    - `backlog_critical_threshold` (INT, default `10000`): message count above which a subscription is AT_RISK.
    - `check_idle_subscriptions` (SELECT, one of `"true"`, `"false"`, default `"true"`): also flag subscriptions with zero connected consumers.

    ## Quick start

    1. Add the `SLACK_WEBHOOK_URL` secret.
    2. Create the target topic and attach at least one producer or consumer so it has stats.
    3. Set `pulsar_admin_stats_url` to that topic's stats endpoint.
    4. Run the flow once and confirm `status` reads `HEALTHY`.
    5. Enable `pulsar_backlog_sentinel_schedule`.

    ### Outputs

    - `status` (STRING): the classified outcome, `{{ outputs.classify_backlog_status.value }}`, also exposed as the flow-level output `{{ outputs.status }}`.
    - `{{ outputs.fetch_topic_stats.body }}`: the raw topic stats JSON, when the request succeeded.

    ## Pitfalls

    - A brand-new topic with no subscriptions at all audits zero entries and always reads `HEALTHY`; create a subscription (consume at least once) to exercise the `AT_RISK` branch.
    - `check_idle_subscriptions: true` means a subscription that is simply not currently consuming, by design, for example a batch job that only connects once an hour, will read `AT_RISK` between runs. Set it to `false` if idle-by-design subscriptions are expected.
    - A missing topic and a down broker both read `UNREACHABLE`; the admin API returns a non-2xx response for a topic that does not exist yet, and `allowFailure: true` discards the response body in both cases, so they are not distinguished.
    - This audit reads one topic's stats per run; it does not discover topics on its own, so a forgotten topic you never pointed the flow at stays invisible.
    - A 15-minute poll can miss a backlog spike that is produced and drained again between two runs.

    ## How to extend

    - Loop over a list of topics with a `Loop` task to monitor an entire namespace from one flow instead of one topic at a time.
    - Store the current `AT_RISK` subscription list in a KV bucket and alert only on new entries instead of every run.
    - Parse `msgRateIn` and `msgRateOut` from the same stats body to alert on a stalled producer as well as a lagging consumer.

    ## Links

    - [Apache Pulsar topic stats admin API](https://pulsar.apache.org/docs/next/admin-api-topics/#get-stats)
    - [Kestra Switch task](https://kestra.io/plugins/core/tasks/flow/io.kestra.plugin.core.flow.switch)
  tags:
    - Infrastructure
    - Data
  subTags:
    - Monitoring & Alerting
    - Day 2 Operations
  ee: false
  demo: false
