id: rabbitmq-unacknowledged-message-spike-guard
namespace: company.team
description: |
  Automated RabbitMQ queue reliability sentinel that monitors the Management HTTP API for unacknowledged
  message accumulation, identifies hung consumer worker threads, and dispatches actionable Slack alerts.

concurrency:
  limit: 1

inputs:
  - id: rabbitmq_host
    type: STRING
    displayName: RabbitMQ Host URL
    defaults: "http://rabbitmq.internal:15672"
    description: "Base endpoint URL for the RabbitMQ Management HTTP API."

  - id: rabbitmq_vhost
    type: STRING
    displayName: Virtual Host
    defaults: "%2F"
    description: "Target URL-encoded virtual host name to inspect (default %2F represents /)."

  - id: unacked_message_threshold
    type: INT
    displayName: Unacked Threshold
    defaults: 500
    description: "Maximum allowable unacknowledged messages per queue before triggering an operational alert."

  - id: slack_channel
    type: STRING
    displayName: Slack Channel
    defaults: "#ops-reliability"
    description: "Target Slack channel for queue backpressure and consumer starvation alerts."

triggers:
  - id: audit_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    description: "Executes queue inspection every 15 minutes."
    cron: "*/15 * * * *"

tasks:
  - id: fetch_queue_metrics
    type: io.kestra.plugin.core.http.Request
    description: "Queries the RabbitMQ Management API endpoint to fetch real-time queue statistics."
    uri: "{{ inputs.rabbitmq_host }}/api/queues/{{ inputs.rabbitmq_vhost }}"
    method: GET
    headers:
      Authorization: "Basic {{ secret('RABBITMQ_MANAGEMENT_BASIC_AUTH') }}"
      Accept: "application/json"

  - id: analyze_unacknowledged_spikes
    type: io.kestra.plugin.scripts.python.Script
    description: "Parses queue metrics to detect consumer acknowledgment starvation and memory bottlenecks."
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    inputFiles:
      queues.json: "{{ outputs.fetch_queue_metrics.body }}"
    outputFiles:
      - metrics_summary.json
    script: |
      import json
      from kestra import Kestra

      with open("queues.json", "r", encoding="utf-8") as f:
          queues = json.load(f)

      threshold = int("{{ inputs.unacked_message_threshold }}")
      spiked_queues = []
      total_unacked = 0

      for q in queues:
          name = q.get("name", "unknown")
          messages_unacknowledged = q.get("messages_unacknowledged", 0)
          messages_ready = q.get("messages_ready", 0)
          consumers = q.get("consumers", 0)
          memory = q.get("memory", 0)
          total_unacked += messages_unacknowledged

          if messages_unacknowledged > threshold:
              spiked_queues.append({
                  "queue": name,
                  "unacked_count": messages_unacknowledged,
                  "ready_count": messages_ready,
                  "active_consumers": consumers,
                  "memory_mb": round(memory / (1024 * 1024), 2)
              })

      spike_detected = len(spiked_queues) > 0

      summary = {
          "total_queues_scanned": len(queues),
          "total_unacknowledged_messages": total_unacked,
          "spiked_queues_count": len(spiked_queues),
          "spiked_queues": spiked_queues,
          "spike_detected": spike_detected
      }

      with open("metrics_summary.json", "w", encoding="utf-8") as f:
          json.dump(summary, f, indent=2)

      Kestra.outputs({
          "spike_detected": spike_detected,
          "spiked_count": len(spiked_queues),
          "total_unacked": total_unacked,
          "top_offender": spiked_queues[0]["queue"] if spiked_queues else "none",
          "top_offender_unacked": spiked_queues[0]["unacked_count"] if spiked_queues else 0,
          "top_offender_consumers": spiked_queues[0]["active_consumers"] if spiked_queues else 0
      })

  - id: evaluate_spike_condition
    type: io.kestra.plugin.core.flow.If
    description: "Evaluates if any queue exceeded the unacknowledged message threshold."
    condition: "{{ outputs.analyze_unacknowledged_spikes.vars.spike_detected }}"
    then:
      - id: notify_slack_unacked_spike
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: "Dispatches high-urgency message alert with diagnostic details to Slack."
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "{{ inputs.slack_channel }}",
            "text": "*RabbitMQ Consumer Starvation and Unacked Message Spike Alert*\n• *Virtual Host*: `{{ inputs.rabbitmq_vhost }}`\n• *Affected Queues Count*: `{{ outputs.analyze_unacknowledged_spikes.vars.spiked_count }}`\n• *Total Unacknowledged Messages*: `{{ outputs.analyze_unacknowledged_spikes.vars.total_unacked }}`\n• *Primary Offending Queue*: `{{ outputs.analyze_unacknowledged_spikes.vars.top_offender }}` ({{ outputs.analyze_unacknowledged_spikes.vars.top_offender_unacked }} unacked messages, {{ outputs.analyze_unacknowledged_spikes.vars.top_offender_consumers }} active consumers)\n• *Operational Impact*: Consumers holding unacked messages consume broker memory and block message delivery to healthy worker nodes.\n• *Recommended Remediation*: Inspect worker pods connected to queue `{{ outputs.analyze_unacknowledged_spikes.vars.top_offender }}` for deadlocks, slow database transactions, or missing `basic.ack` calls."
          }

    else:
      - id: log_healthy_broker_status
        type: io.kestra.plugin.core.log.Log
        description: "Logs confirmation of healthy queue states."
        message: "RabbitMQ cluster queue audit compliant. Total unacknowledged messages across cluster: {{ outputs.analyze_unacknowledged_spikes.vars.total_unacked }}."

  - id: export_broker_manifest
    type: io.kestra.plugin.core.debug.Return
    description: "Outputs structured JSON execution manifest for operational audits."
    format: |
      {
        "pipeline": "rabbitmq-unacknowledged-message-spike-guard",
        "audited_at": "{{ execution.startDate }}",
        "total_unacked": {{ outputs.analyze_unacknowledged_spikes.vars.total_unacked }},
        "spiked_count": {{ outputs.analyze_unacknowledged_spikes.vars.spiked_count }},
        "status": "{{ outputs.analyze_unacknowledged_spikes.vars.spike_detected ? 'SPIKE_DETECTED' : 'HEALTHY' }}"
      }

extend:
  shortDescription: "Monitors RabbitMQ queues for stuck unacknowledged messages and alerts on consumer starvation."
  title: "RabbitMQ Unacknowledged Message Spike Guard"
  metaTitle: "RabbitMQ Unacknowledged Message Spike Guard | Kestra Blueprint"
  metaDescription: "Audits RabbitMQ Management API for unacknowledged message spikes and alerts engineering teams to hung worker consumers via Slack."
  description: |
    In distributed asynchronous architectures, RabbitMQ serves as the core backbone for job processing and event streaming. When microservice worker pods encounter database deadlocks, slow downstream APIs, or programming errors that omit `basic.ack` calls, messages transition into an unacknowledged (`unacked`) state.

    Unlike ready messages waiting in queue, unacknowledged messages are held in broker RAM while the channel remains open. When hundreds or thousands of messages remain unacknowledged, RabbitMQ reaches its high-watermark memory threshold, blocking publishers and throttling cluster throughput across all services.

    This blueprint provides an automated sentinel that queries the RabbitMQ Management HTTP API on a 15-minute schedule, parses queue metrics across all virtual hosts, and flags queues exceeding the unacknowledged message threshold. When anomalies occur, it dispatches an actionable Slack notification detailing the offending queue, consumer count, and troubleshooting guidance.

    ## How it works

    1. **Scheduled Polling**: The `audit_schedule` trigger (`io.kestra.plugin.core.trigger.Schedule`) fires every 15 minutes.
    2. **API Metrics Query**: The `fetch_queue_metrics` task (`io.kestra.plugin.core.http.Request`) calls `/api/queues/{vhost}` with Basic Authentication.
    3. **Python Metrics Analysis**: The `analyze_unacknowledged_spikes` task (`io.kestra.plugin.scripts.python.Script`) filters queues exceeding `unacked_message_threshold`, computes cluster-wide totals, and outputs `metrics_summary.json`.
    4. **Condition Gate**: The `evaluate_spike_condition` flowable task (`io.kestra.plugin.core.flow.If`) branches based on whether unacknowledged spikes were detected.
    5. **Slack Alerting**: If anomalies exist, `notify_slack_unacked_spike` (`io.kestra.plugin.slack.notifications.SlackIncomingWebhook`) dispatches an operational triage card.
    6. **Audit Manifest**: The `export_broker_manifest` task records execution results for historical trend analysis.

    ## What you get

    - Early detection of hung consumer worker instances before broker memory exhaustion.
    - Automated cluster-wide unacknowledged message aggregation across all queues.
    - Structured Slack notifications with exact queue names, consumer counts, and remediation advice.
    - Exportable JSON diagnostic reports for post-mortem investigations.

    ## Who it is for

    - Site Reliability Engineers (SREs) managing distributed RabbitMQ broker clusters.
    - Backend Engineers debugging background worker worker starvation or memory leaks.
    - DevOps Teams operating Kubernetes consumer deployments with auto-scaling queues.

    ## Why orchestrate this with Kestra

    Building custom health-check cron daemons requires maintaining separate polling scripts, monitoring containers, and secret rotation pipelines. Kestra natively unifies HTTP ingestion, containerized Python analysis, conditional branching, and enterprise Slack alerting into a single declarative workflow with full audit logging and retry policies.

    ## Inputs

    | Name | Type | Default | Description |
    | :--- | :--- | :--- | :--- |
    | `rabbitmq_host` | STRING | `http://rabbitmq.internal:15672` | Management HTTP API base endpoint. |
    | `rabbitmq_vhost` | STRING | `%2F` | URL-encoded virtual host name (default `/`). |
    | `unacked_message_threshold` | INT | `500` | Alert threshold for unacknowledged count. |
    | `slack_channel` | STRING | `#ops-reliability` | Destination Slack channel for alerts. |

    ## Expected outputs

    - `{{ outputs.analyze_unacknowledged_spikes.vars.spike_detected }}`: Boolean flag indicating if any queue exceeded thresholds.
    - `{{ outputs.analyze_unacknowledged_spikes.vars.total_unacked }}`: Total cluster-wide count of unacknowledged messages.
    - `{{ outputs.analyze_unacknowledged_spikes.vars.top_offender }}`: Name of the queue with the highest unacknowledged count.
    - `{{ outputs.analyze_unacknowledged_spikes.outputFiles['metrics_summary.json'] }}`: Complete JSON diagnostic report.

    ## Prerequisites

    - RabbitMQ cluster with the Management plugin enabled (`rabbitmq_management`).
    - Basic Authentication credentials with read access to the target virtual host.
    - Slack Incoming Webhook configured for your operations alerting channel.

    ### Secrets

    - `RABBITMQ_MANAGEMENT_BASIC_AUTH`: Base64-encoded `username:password` string for HTTP Basic Auth.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook endpoint URL.

    ## Quick start

    1. Configure `RABBITMQ_MANAGEMENT_BASIC_AUTH` and `SLACK_WEBHOOK_URL` in your Kestra namespace secrets.
    2. Import this flow YAML into your Kestra instance.
    3. Click **Execute** in the UI to run an initial cluster health audit.
    4. Review execution outputs to inspect queue status metrics and JSON summaries.

    ## Common pitfalls and troubleshooting

    - **URL Encoding**: The default root virtual host `/` must be URL-encoded as `%2F` in the API path.
    - **User Permissions**: Ensure the RabbitMQ user has the `monitoring` or `policymaker` tag to access management endpoints.
    - **Consumer Prefetch**: High unacknowledged message counts often occur when consumers configure `basic.qos(prefetch_count=0)` (unlimited), causing workers to buffer all messages without processing them.

    ## How to extend

    - Add an automated remediation step using `io.kestra.plugin.kubernetes.PodRestart` to restart stuck consumer worker pods when unacknowledged spikes persist.
    - Integrate with PagerDuty via `io.kestra.plugin.notifications.pagerduty.PagerDutyAlert` for critical production severity.
    - Monitor consumer ack rate metrics over time to compute processing throughput trends.

    ## Links

    - Kestra HTTP Plugin Documentation: https://kestra.io/plugins/plugin-core/io.kestra.plugin.core.http.Request
    - Kestra Slack Plugin Documentation: https://kestra.io/plugins/plugin-notifications
    - RabbitMQ Management API Documentation: https://www.rabbitmq.com/docs/management
  tags:
    - Infrastructure
  subTags:
    - Realtime & Streaming
    - Monitoring & Alerting
  ee: false
  demo: false
