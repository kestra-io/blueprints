id: income-tax-provision-deferred-tax
namespace: company.team

description: |
  Year-end income tax provision for a group of entities (IAS 12 / ASC 740): taxable profit
  from book profit, permanent items and temporary differences; loss carryforwards under each
  country's minimum taxation rule; tax credits; current tax with the return-to-provision
  true-up; deferred tax on every temporary difference at the enacted rate, with the effect of
  a rate change; a recoverability test that leaves part of the deferred tax assets
  unrecognised; deferred tax through OCI; the effective tax rate reconciliation, proved to tie
  to the cent; the tax note; and a year lock.

inputs:
  - id: year
    type: INT
    displayName: Financial year
    defaults: 2026

  - id: scenario
    type: SELECT
    displayName: Demo scenario
    description: >
      BASE: the group as planned. DOWNTURN: the US forecast is cut, so most of its loss
      carryforward can no longer be recognised. ISSUES: a German asset class without a tax
      base, a new Dutch entity with no enacted rate, and a tax payable in the ledger that does
      not match the provision, which must stop the provision.
    values:
      - BASE
      - DOWNTURN
      - ISSUES
    defaults: BASE

  - id: group_rate
    type: FLOAT
    displayName: Group reference rate
    description: The rate the effective tax rate reconciliation starts from, usually the parent's statutory rate.
    defaults: 0.25

  - id: approved_by
    type: STRING
    displayName: Approved by
    description: The head of tax. Needed when the effective rate moves more than 5 points, the unrecognised deferred tax assets change by more than 100,000, or a return-to-provision adjustment exceeds 50,000.
    defaults: ""

variables:
  lock_key: tax_provision
  pack_dir: "tax-provision/{{ inputs.year }}"

concurrency:
  limit: 1

tasks:
  - id: year_control
    type: io.kestra.plugin.core.output.OutputValues
    values:
      lock: "{{ kv(vars.lock_key, errorOnMissing=false) ?? {'year': 0, 'entities': {}} | toJson }}"
      last_year: "{{ (kv(vars.lock_key, errorOnMissing=false) ?? {'year': 0}) | jq('.year') | first }}"

  - id: year_gate
    type: io.kestra.plugin.core.flow.If
    condition: "{{ (outputs.year_control.values.last_year | number) != 0 and (inputs.year <= (outputs.year_control.values.last_year | number) or inputs.year != (outputs.year_control.values.last_year | number) + 1) }}"
    then:
      - id: year_refused
        type: io.kestra.plugin.core.execution.Fail
        errorMessage: >-
          {{ inputs.year <= (outputs.year_control.values.last_year | number)
             ? 'The ' ~ inputs.year ~ ' provision is already final (last year closed: ' ~ outputs.year_control.values.last_year ~ ').'
             : 'Close ' ~ ((outputs.year_control.values.last_year | number) + 1) ~ ' before ' ~ inputs.year ~ '.' }}

  - id: provide
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: >
      One DuckDB session: entities, rates and loss rules; book profit, permanent items, credits
      and carrying amounts against tax bases for every year (demo generator or your tax
      packs); a year-by-year computation of taxable profit, losses and credits; deferred tax
      and recognition; the effective rate reconciliation; the roll-forwards and checks.
    outputFiles:
      - etr
      - deferred
      - entities
      - journal
      - blockers
    fetchType: FETCH_ONE
    sql: |
      SET VARIABLE y = {{ inputs.year }};
      SET VARIABLE g = {{ inputs.group_rate }};
      CREATE MACRO f0(x) AS format('{:,.0f}', x::DOUBLE);

      -- =======================================================================
      -- Entities and tax rules. current_rate applies to the year's profit;
      -- dt_rate is the rate enacted at the year end for when differences
      -- reverse (IAS 12.47). The UK enacted 27% from 2027 during 2026.
      -- =======================================================================
      CREATE TABLE entities (entity VARCHAR, name VARCHAR, country VARCHAR, loss_rule VARCHAR, forecast_profit_3y DOUBLE);
      INSERT INTO entities VALUES
        ('E-FR', 'Group SA (parent)', 'FR', 'FR', 1e9), ('E-DE', 'Group GmbH', 'DE', 'DE', 1e9),
        ('E-UK', 'Group Ltd', 'UK', 'UK', 1e9),
        ('E-US', 'Group Inc', 'US', 'US', 2400000);
      {% if inputs.scenario == 'ISSUES' %}
      INSERT INTO entities VALUES ('E-NL', 'Group BV (new)', 'NL', 'NL', 1e9);
      {% endif %}

      -- Taxable profit forecast for the next three years, as approved at each year end.
      -- Recognition of a net deferred tax asset is capped at the tax on it.
      CREATE TABLE forecasts AS
      SELECT entity, y AS year,
             CASE WHEN entity = 'E-US' {% if inputs.scenario == 'DOWNTURN' %}AND y >= 2026{% else %}AND false{% endif %} THEN 500000 ELSE forecast_profit_3y END AS profit_3y
      FROM entities, range(2023, 2028) t(y);

      CREATE TABLE rates AS
      SELECT country, y AS year,
             CASE country WHEN 'FR' THEN 0.25 WHEN 'DE' THEN 0.30 WHEN 'US' THEN 0.21 WHEN 'UK' THEN CASE WHEN y >= 2027 THEN 0.27 ELSE 0.25 END END AS current_rate,
             CASE country WHEN 'FR' THEN 0.25 WHEN 'DE' THEN 0.30 WHEN 'US' THEN 0.21 WHEN 'UK' THEN CASE WHEN y >= 2026 THEN 0.27 ELSE 0.25 END END AS dt_rate
      FROM (VALUES ('FR'), ('DE'), ('UK'), ('US')) c(country), range(2023, 2028) t(y);

      -- Minimum taxation: how much of this year's taxable profit opening losses can offset.
      CREATE MACRO loss_cap(rule, taxable) AS CASE rule
        WHEN 'FR' THEN least(taxable, 1000000 + 0.5 * greatest(taxable - 1000000, 0))
        WHEN 'DE' THEN least(taxable, 1000000 + 0.6 * greatest(taxable - 1000000, 0))
        WHEN 'UK' THEN least(taxable, 5000000 + 0.5 * greatest(taxable - 5000000, 0))
        WHEN 'US' THEN 0.8 * taxable END;

      -- =======================================================================
      -- Tax packs by year. Replace with each entity's tax pack: book profit,
      -- permanent differences, credits, and carrying amount against tax base
      -- by category (assets positive, liabilities negative).
      -- =======================================================================
      CREATE TABLE pbt AS
      SELECT entity, y AS year,
             CASE entity WHEN 'E-FR' THEN 8000000 * (1 + 0.06 * (y - 2024)) WHEN 'E-DE' THEN 5200000 * (1 + 0.06 * (y - 2024))
                         WHEN 'E-UK' THEN 2000000 * (1 + 0.06 * (y - 2024)) WHEN 'E-NL' THEN 300000
                         ELSE [-2600000, -2200000, -1600000, 400000][y - 2023] END AS pbt
      FROM entities, range(2024, 2028) t(y);

      CREATE TABLE permanent (entity VARCHAR, item VARCHAR, amount DOUBLE);
      INSERT INTO permanent VALUES
        ('E-FR', 'Fines and penalties', 120000), ('E-FR', 'Entertainment', 85000), ('E-FR', 'Exempt dividends from subsidiaries (95%)', -1425000),
        ('E-DE', 'Non-deductible expenses', 140000), ('E-UK', 'Client entertainment', 60000), ('E-US', 'Meals (50%)', 60000);
      CREATE TABLE credits (entity VARCHAR, item VARCHAR, amount DOUBLE);
      INSERT INTO credits VALUES ('E-FR', 'Research tax credit', 400000), ('E-US', 'Research credit', 150000);

      CREATE TABLE carrying AS
      WITH base (entity, ppe, accel, prov, rou, sbp) AS (VALUES
        ('E-FR', 22000000, 1800000, 900000, 3000000, 600000), ('E-DE', 15000000, 1100000, 600000, 2200000, 200000),
        ('E-UK', 6000000, 900000, 300000, 1400000, 100000), ('E-US', 9000000, 1200000, 500000, 1800000, 300000),
        ('E-NL', 500000, 0, 0, 0, 0))
      SELECT entity, year, category, carrying, tax_base, oci FROM (
        SELECT b.entity, y AS year, 'Property, plant and equipment' AS category, b.ppe * (1 + 0.05 * (y - 2024)) AS carrying,
               b.ppe * (1 + 0.05 * (y - 2024)) - b.accel * (1 + 0.15 * (y - 2024)) AS tax_base, false AS oci FROM base b, range(2023, 2028) t(y)
        UNION ALL SELECT b.entity, y, 'Warranty provisions', -b.prov * (1 + 0.08 * (y - 2024)), 0, false FROM base b, range(2023, 2028) t(y)
        UNION ALL SELECT b.entity, y, 'Right-of-use assets', b.rou * (1 + 0.03 * (y - 2024)), 0, false FROM base b, range(2023, 2028) t(y)
        UNION ALL SELECT b.entity, y, 'Lease liabilities', -b.rou * (1 + 0.03 * (y - 2024)) * 1.07, 0, false FROM base b, range(2023, 2028) t(y)
        UNION ALL SELECT b.entity, y, 'Share-based payments', 0, b.sbp * (1 + 0.2 * (y - 2024)), false FROM base b, range(2023, 2028) t(y)
        UNION ALL SELECT 'E-DE', y, 'Equity investment at fair value through OCI', 2000000 + 400000 * (y - 2023), 2000000, true FROM range(2023, 2028) t(y)
      ) WHERE entity IN (SELECT entity FROM entities);
      {% if inputs.scenario == 'ISSUES' %}
      UPDATE carrying SET tax_base = NULL WHERE entity = 'E-DE' AND category = 'Property, plant and equipment' AND year = {{ inputs.year }};
      {% endif %}

      -- Losses and credits carried forward at the end of 2023, from the filed returns.
      CREATE TABLE opening_attributes (entity VARCHAR, losses DOUBLE, credits DOUBLE);
      INSERT INTO opening_attributes VALUES ('E-FR', 0, 0), ('E-DE', 4000000, 0), ('E-UK', 0, 0), ('E-US', 3000000, 0), ('E-NL', 0, 0);

      -- Return to provision: the filed return of the previous year against its provision.
      CREATE TABLE return_to_provision (entity VARCHAR, year INT, adjustment DOUBLE, reason VARCHAR);
      INSERT INTO return_to_provision VALUES
        ('E-FR', 2025, 38000, 'Entertainment found non-deductible on audit of the return'), ('E-DE', 2025, -12000, 'Trade tax add-back lower than provided'),
        ('E-FR', 2026, -21000, 'Research credit higher than provided'), ('E-DE', 2026, 64000, 'Transfer pricing adjustment accepted'),
        ('E-FR', 2027, 9000, 'Minor'), ('E-UK', 2027, -4000, 'Minor');

      -- =======================================================================
      -- Temporary differences by year: carrying amount - tax base. Positive is
      -- taxable (deferred tax liability), negative deductible (asset).
      -- =======================================================================
      CREATE TABLE td AS SELECT entity, year, category, oci, carrying - tax_base AS td FROM carrying;
      CREATE TABLE td_year AS
      SELECT entity, year, sum(td) FILTER (WHERE NOT oci) AS td_pl, coalesce(sum(td) FILTER (WHERE oci), 0) AS td_oci FROM td GROUP BY ALL;

      -- =======================================================================
      -- Year by year: taxable profit, losses used under the cap, credits, current tax.
      -- =======================================================================
      CREATE TABLE year_calc AS
      WITH RECURSIVE inputs_y AS (
        SELECT e.entity, e.loss_rule, p.year, p.pbt,
               coalesce((SELECT sum(amount) FROM permanent pm WHERE pm.entity = e.entity), 0) * (1 + 0.03 * (p.year - 2024)) AS perm,
               coalesce((SELECT sum(amount) FROM credits c WHERE c.entity = e.entity), 0) AS credit_gen,
               t1.td_pl - t0.td_pl AS d_td,
               r.current_rate
        FROM entities e JOIN pbt p USING (entity)
        JOIN td_year t1 ON t1.entity = e.entity AND t1.year = p.year
        JOIN td_year t0 ON t0.entity = e.entity AND t0.year = p.year - 1
        LEFT JOIN rates r ON r.country = e.country AND r.year = p.year
      ), calc(entity, year, losses_open, credits_open, taxable_raw, loss_used, loss_created, taxable, tax_before_credits, credits_used, current_tax, losses_close, credits_close, credit_gen, perm, pbt, current_rate) AS (
        SELECT i.entity, i.year, a.losses::DOUBLE, a.credits::DOUBLE, x.raw::DOUBLE, u.used::DOUBLE, greatest(-x.raw, 0), greatest(x.raw - u.used, 0),
               0::DOUBLE, 0::DOUBLE, 0::DOUBLE, (a.losses - u.used + greatest(-x.raw, 0))::DOUBLE, 0::DOUBLE, i.credit_gen, i.perm, i.pbt, i.current_rate
        FROM inputs_y i JOIN opening_attributes a USING (entity),
             LATERAL (SELECT i.pbt + i.perm - i.d_td AS raw) x,
             LATERAL (SELECT CASE WHEN x.raw > 0 THEN least(a.losses, loss_cap(i.loss_rule, x.raw)) ELSE 0 END AS used) u
        WHERE i.year = 2024
        UNION ALL
        SELECT i.entity, i.year, c.losses_close, 0::DOUBLE, x.raw, u.used, greatest(-x.raw, 0), greatest(x.raw - u.used, 0),
               0::DOUBLE, 0::DOUBLE, 0::DOUBLE, (c.losses_close - u.used + greatest(-x.raw, 0))::DOUBLE, 0::DOUBLE, i.credit_gen, i.perm, i.pbt, i.current_rate
        FROM calc c JOIN inputs_y i ON i.entity = c.entity AND i.year = c.year + 1,
             LATERAL (SELECT i.pbt + i.perm - i.d_td AS raw) x,
             LATERAL (SELECT CASE WHEN x.raw > 0 THEN least(c.losses_close, loss_cap(i.loss_rule, x.raw)) ELSE 0 END AS used) u
      )
      SELECT * FROM calc;
      -- Taxes and closing attributes, now that taxable profit is known.
      UPDATE year_calc SET tax_before_credits = current_rate * taxable;
      UPDATE year_calc SET credits_used = least(credits_open + credit_gen, tax_before_credits);
      UPDATE year_calc SET current_tax = tax_before_credits - credits_used;
      -- Credits feed the next year's opening, so the chain is replayed year by year.
      CREATE TABLE credit_chain AS
      WITH RECURSIVE ch(entity, year, credits_open, credits_close) AS (
        SELECT y.entity, y.year, y.credits_open, y.credits_open + y.credit_gen - least(y.credits_open + y.credit_gen, y.tax_before_credits)
        FROM year_calc y WHERE y.year = 2024
        UNION ALL
        SELECT y.entity, y.year, ch.credits_close, ch.credits_close + y.credit_gen - least(ch.credits_close + y.credit_gen, y.tax_before_credits)
        FROM ch JOIN year_calc y ON y.entity = ch.entity AND y.year = ch.year + 1
      ) SELECT * FROM ch;
      UPDATE year_calc SET credits_open = c.credits_open, credits_close = c.credits_close,
                           credits_used = least(c.credits_open + year_calc.credit_gen, year_calc.tax_before_credits)
      FROM credit_chain c WHERE c.entity = year_calc.entity AND c.year = year_calc.year;
      UPDATE year_calc SET current_tax = tax_before_credits - credits_used;

      -- =======================================================================
      -- Deferred tax at each year end, and the part that cannot be recognised:
      -- a net deferred tax asset is recognised only up to the tax on forecast
      -- taxable profits of the next three years (IAS 12.24, 12.35).
      -- =======================================================================
      CREATE TABLE dt_year AS
      SELECT y.entity, y.year, r.dt_rate,
             r.dt_rate * t.td_pl AS dt_td_pl, r.dt_rate * t.td_oci AS dt_oci,
             -r.dt_rate * y.losses_close AS dt_losses, -y.credits_close AS dt_credits,
             fc.profit_3y * r.dt_rate AS recoverable
      FROM year_calc y JOIN entities e USING (entity) JOIN td_year t ON t.entity = y.entity AND t.year = y.year
      JOIN forecasts fc ON fc.entity = y.entity AND fc.year = y.year
      LEFT JOIN rates r ON r.country = e.country AND r.year = y.year
      UNION ALL
      -- End of 2023, the opening of the first computed year.
      SELECT a.entity, 2023, r.dt_rate, r.dt_rate * t.td_pl, r.dt_rate * t.td_oci, -r.dt_rate * a.losses, -a.credits, fc.profit_3y * r.dt_rate
      FROM opening_attributes a JOIN entities e USING (entity) JOIN td_year t ON t.entity = a.entity AND t.year = 2023
      JOIN forecasts fc ON fc.entity = a.entity AND fc.year = 2023
      LEFT JOIN rates r ON r.country = e.country AND r.year = 2023;
      ALTER TABLE dt_year ADD COLUMN unrecognised DOUBLE;
      UPDATE dt_year SET unrecognised = greatest(-(dt_td_pl + dt_oci + dt_losses + dt_credits) - recoverable, 0);

      -- =======================================================================
      -- The year being provided, entity by entity.
      -- =======================================================================
      CREATE TABLE ent AS
      SELECT y.entity, e.name, e.country, y.pbt, y.perm, y.credit_gen, y.taxable_raw, y.loss_used, y.loss_created, y.taxable,
             y.current_rate, y.losses_open, y.losses_close, y.credits_used, y.credits_close, y.current_tax,
             coalesce((SELECT adjustment FROM return_to_provision rp WHERE rp.entity = y.entity AND rp.year = y.year), 0) AS rtp,
             d1.dt_rate AS r1, d0.dt_rate AS r0,
             d0.dt_td_pl + d0.dt_losses + d0.dt_credits AS gross_pl_open, d1.dt_td_pl + d1.dt_losses + d1.dt_credits AS gross_pl_close,
             d0.dt_oci AS oci_open, d1.dt_oci AS oci_close, d0.unrecognised AS u_open, d1.unrecognised AS u_close,
             t1.td_pl AS td1, t0.td_pl AS td0
      FROM year_calc y JOIN entities e USING (entity)
      JOIN dt_year d1 ON d1.entity = y.entity AND d1.year = y.year JOIN dt_year d0 ON d0.entity = y.entity AND d0.year = y.year - 1
      JOIN td_year t1 ON t1.entity = y.entity AND t1.year = y.year JOIN td_year t0 ON t0.entity = y.entity AND t0.year = y.year - 1
      WHERE y.year = getvariable('y');
      ALTER TABLE ent ADD COLUMN deferred_pl DOUBLE; ALTER TABLE ent ADD COLUMN deferred_oci DOUBLE; ALTER TABLE ent ADD COLUMN total_tax DOUBLE;
      UPDATE ent SET deferred_pl = (gross_pl_close + u_close) - (gross_pl_open + u_open), deferred_oci = oci_close - oci_open;
      UPDATE ent SET total_tax = current_tax + rtp + deferred_pl;

      -- =======================================================================
      -- Effective tax rate reconciliation. Every line is computed from its own
      -- driver, never as a balancing figure; the total must equal the expense.
      -- =======================================================================
      CREATE TABLE etr AS
      SELECT * FROM (
        SELECT 1 AS ord, 'Tax at the group rate of ' || (getvariable('g') * 100) || '%' AS line, sum(pbt) * getvariable('g') AS amount FROM ent
        UNION ALL SELECT 2, 'Effect of different tax rates in other countries', sum(pbt * (current_rate - getvariable('g'))) FROM ent
        UNION ALL SELECT 3, 'Non-deductible expenses', sum(current_rate * pe.amount * (1 + 0.03 * (getvariable('y') - 2024))) FROM ent JOIN permanent pe USING (entity) WHERE pe.amount > 0
        UNION ALL SELECT 4, 'Tax-exempt income', sum(current_rate * pe.amount * (1 + 0.03 * (getvariable('y') - 2024))) FROM ent JOIN permanent pe USING (entity) WHERE pe.amount < 0
        UNION ALL SELECT 5, 'Tax credits', -sum(credit_gen) FROM ent
        UNION ALL SELECT 6, 'Effect of the enacted change in tax rates', sum((r1 - current_rate) * (td1 - losses_close) - (r0 - current_rate) * (td0 - losses_open)) FROM ent
        UNION ALL SELECT 7, 'Change in unrecognised deferred tax assets', sum(u_close - u_open) FROM ent
        UNION ALL SELECT 8, 'Adjustments to prior-year current tax', sum(rtp) FROM ent
      ) WHERE round(amount, 2) <> 0 OR ord = 1;

      -- Deferred tax by entity and category, opening to closing.
      CREATE TABLE deferred AS
      WITH cat AS (
        SELECT t.entity, t.category, t.oci,
               max(CASE WHEN t.year = getvariable('y') - 1 THEN t.td END) * max(CASE WHEN d.year = getvariable('y') - 1 THEN d.dt_rate END) AS opening,
               max(CASE WHEN t.year = getvariable('y') THEN t.td END) * max(CASE WHEN d.year = getvariable('y') THEN d.dt_rate END) AS closing
        FROM td t JOIN dt_year d ON d.entity = t.entity AND d.year = t.year
        WHERE t.year IN (getvariable('y') - 1, getvariable('y')) GROUP BY ALL
      )
      SELECT entity, category, opening, CASE WHEN oci THEN 0 ELSE closing - opening END AS to_pl, CASE WHEN oci THEN closing - opening ELSE 0 END AS to_oci, closing FROM cat
      UNION ALL SELECT entity, 'Tax loss carryforwards', -r0 * losses_open, -r1 * losses_close + r0 * losses_open, 0, -r1 * losses_close FROM ent
      UNION ALL SELECT entity, 'Tax credit carryforwards', -(credits_close - credit_gen + credits_used), -credits_close + (credits_close - credit_gen + credits_used), 0, -credits_close FROM ent
      UNION ALL SELECT entity, 'Unrecognised deferred tax assets', u_open, u_close - u_open, 0, u_close FROM ent;

      -- Tax payable: prior-year balance and installments paid during the year.
      CREATE TABLE payable AS
      SELECT e.entity, coalesce(prev.current_tax, 0) * 0.25 AS opening, e.current_tax + e.rtp AS charge,
             coalesce(prev.current_tax, 0) * 0.25 + e.rtp + 0.75 * e.current_tax AS paid, 0.25 * e.current_tax AS closing
      FROM ent e LEFT JOIN year_calc prev ON prev.entity = e.entity AND prev.year = getvariable('y') - 1;
      -- The ledger balance. Replace with your trial balance.
      CREATE TABLE gl_payable AS
      SELECT entity, closing {% if inputs.scenario == 'ISSUES' %}+ CASE WHEN entity = 'E-UK' THEN 47500 ELSE 0 END{% endif %} AS balance FROM payable;

      -- =======================================================================
      -- Checks.
      -- =======================================================================
      CREATE TABLE blockers AS
      SELECT 'MISSING_TAX_BASE' AS code, entity || ' ' || category AS ref, 'No tax base for ' || year AS detail FROM carrying WHERE tax_base IS NULL AND year = getvariable('y')
      UNION ALL SELECT 'NO_ENACTED_RATE', entity, name || ' (' || country || ') has no current or enacted rate' FROM entities e
        WHERE NOT EXISTS (SELECT 1 FROM rates r WHERE r.country = e.country AND r.year = getvariable('y'))
      UNION ALL SELECT 'ETR_RECONCILIATION_DOES_NOT_TIE', 'group', 'Reconciliation ' || round((SELECT sum(amount) FROM etr), 2) || ', tax expense ' || round(sum(total_tax), 2) FROM ent
        HAVING abs((SELECT sum(amount) FROM etr) - sum(total_tax)) >= 0.01
      UNION ALL SELECT 'DEFERRED_ROLLFORWARD_DOES_NOT_TIE', entity, 'Categories move by ' || round(sum(to_pl), 2) || ' in profit or loss, the provision by ' || round(any_value(e.deferred_pl), 2)
        FROM deferred d JOIN ent e USING (entity) GROUP BY entity HAVING abs(sum(to_pl) - any_value(e.deferred_pl)) >= 0.01
      UNION ALL SELECT 'TAX_PAYABLE_DOES_NOT_TIE', p.entity, 'Provision ' || round(p.closing, 2) || ', ledger ' || round(g.balance, 2) FROM payable p JOIN gl_payable g USING (entity) WHERE abs(p.closing - g.balance) >= 0.01;

      -- =======================================================================
      -- Outputs, journal and the note.
      -- =======================================================================
      CREATE MACRO fmt(x) AS CASE WHEN round(x) < 0 THEN '(' || f0(-x) || ')' ELSE f0(x) END;
      CREATE TABLE journal AS
      SELECT row_number() OVER (ORDER BY entity, ord) AS line, * FROM (
        SELECT entity, 1 AS ord, '8000' AS account, 'Current tax expense' AS account_name, greatest(current_tax + rtp, 0) AS debit, greatest(-(current_tax + rtp), 0) AS credit FROM ent
        UNION ALL SELECT entity, 2, '2200', 'Income tax payable', greatest(-(current_tax + rtp), 0), greatest(current_tax + rtp, 0) FROM ent
        UNION ALL SELECT entity, 3, '8010', 'Deferred tax expense', greatest(deferred_pl, 0), greatest(-deferred_pl, 0) FROM ent WHERE round(deferred_pl, 2) <> 0
        UNION ALL SELECT entity, 4, '3300', 'Deferred tax in OCI', greatest(deferred_oci, 0), greatest(-deferred_oci, 0) FROM ent WHERE round(deferred_oci, 2) <> 0
        UNION ALL SELECT entity, 5, '2700', 'Net deferred tax', greatest(-(deferred_pl + deferred_oci), 0), greatest(deferred_pl + deferred_oci, 0) FROM ent WHERE round(deferred_pl + deferred_oci, 2) <> 0
      );
      UPDATE journal SET debit = round(debit, 2), credit = round(credit, 2);

      COPY (SELECT line, round(amount, 2) AS amount, round(100 * amount / (SELECT sum(pbt) FROM ent), 2) AS pct_of_pbt FROM etr ORDER BY ord) TO '{{ outputFiles.etr }}' (HEADER, DELIMITER ',');
      COPY (SELECT entity, category, round(opening, 2) AS opening, round(to_pl, 2) AS to_profit_or_loss, round(to_oci, 2) AS to_oci, round(closing, 2) AS closing FROM deferred ORDER BY entity, category) TO '{{ outputFiles.deferred }}' (HEADER, DELIMITER ',');
      COPY (SELECT entity, name, country, round(pbt, 2) AS pbt, round(perm, 2) AS permanent, round(taxable_raw, 2) AS taxable_before_losses, round(loss_used, 2) AS loss_used, round(loss_created, 2) AS loss_created,
                   round(taxable, 2) AS taxable, current_rate, round(credits_used, 2) AS credits_used, round(current_tax, 2) AS current_tax, round(rtp, 2) AS prior_year, round(deferred_pl, 2) AS deferred,
                   round(total_tax, 2) AS total_tax, round(100 * total_tax / nullif(pbt, 0), 1) AS etr_pct, round(losses_close, 2) AS losses_carried_forward, round(u_close, 2) AS unrecognised_dta
            FROM ent ORDER BY entity) TO '{{ outputFiles.entities }}' (HEADER, DELIMITER ',');
      COPY journal TO '{{ outputFiles.journal }}' (HEADER, DELIMITER ',');
      COPY blockers TO '{{ outputFiles.blockers }}' (HEADER, DELIMITER ',');

      CREATE TABLE prior AS
      SELECT sum(y.current_tax) + coalesce(sum(rp.adjustment), 0) AS current_prev FROM year_calc y
      LEFT JOIN return_to_provision rp ON rp.entity = y.entity AND rp.year = y.year WHERE y.year = getvariable('y') - 1;
      CREATE TABLE prior_total AS
      SELECT sum(y.current_tax) + coalesce((SELECT sum(adjustment) FROM return_to_provision WHERE year = getvariable('y') - 1), 0)
             + sum((d1.dt_td_pl + d1.dt_losses + d1.dt_credits + d1.unrecognised) - (d0.dt_td_pl + d0.dt_losses + d0.dt_credits + d0.unrecognised)) AS total,
             sum(y.pbt) AS pbt
      FROM year_calc y JOIN dt_year d1 ON d1.entity = y.entity AND d1.year = y.year JOIN dt_year d0 ON d0.entity = y.entity AND d0.year = y.year - 1
      WHERE y.year = getvariable('y') - 1;


      SELECT
        (SELECT f0(sum(pbt)) FROM ent) AS pbt,
        (SELECT f0(sum(current_tax)) FROM ent) AS current_tax,
        (SELECT f0(sum(rtp)) FROM ent) AS prior_year,
        (SELECT f0(sum(deferred_pl)) FROM ent) AS deferred_tax,
        (SELECT f0(sum(deferred_oci)) FROM ent) AS deferred_oci,
        (SELECT f0(sum(total_tax)) FROM ent) AS total_tax,
        (SELECT round(100 * sum(total_tax) / sum(pbt), 2) FROM ent) AS etr,
        (SELECT round(100 * total / pbt, 2) FROM prior_total) AS etr_prev,
        (SELECT string_agg(entity || ' ' || round(100 * total_tax / nullif(pbt, 0), 1) || '%', ', ' ORDER BY entity) FROM ent) AS etr_by_entity,
        (SELECT string_agg(line || ' ' || fmt(amount), '; ' ORDER BY ord) FROM etr) AS reconciliation,
        round((SELECT sum(amount) FROM etr) - (SELECT sum(total_tax) FROM ent), 4) AS reconciliation_gap,
        (SELECT f0(sum(closing)) FROM deferred) AS net_deferred,
        (SELECT round(sum(u_close - u_open), 0) FROM ent) AS unrecognised_change,
        (SELECT f0(sum(u_close)) FROM ent) AS unrecognised,
        (SELECT string_agg(entity || ' used ' || f0(loss_used) || ', carried ' || f0(losses_close), '; ' ORDER BY entity) FROM ent WHERE losses_open + loss_created > 0) AS losses,
        (SELECT coalesce(max(abs(rtp)), 0) FROM ent) AS max_rtp,
        (SELECT coalesce(string_agg(rp.entity || ' ' || f0(rp.adjustment) || ' (' || rp.reason || ')', '; '), '') FROM return_to_provision rp WHERE rp.year = getvariable('y')) AS rtp_detail,
        (SELECT json_group_object(entity, json_object('gross_pl', round(gross_pl_close, 2), 'oci', round(oci_close, 2), 'unrecognised', round(u_close, 2), 'losses', round(losses_close, 2)))::VARCHAR FROM ent) AS lock_entities,
        (SELECT json_group_object(entity, json_object('gross_pl', round(gross_pl_open, 2), 'oci', round(oci_open, 2), 'unrecognised', round(u_open, 2), 'losses', round(losses_open, 2)))::VARCHAR FROM ent) AS opening_entities,
        (SELECT count(*) FROM blockers) AS blockers,
        (SELECT coalesce(string_agg(code || ' ' || ref || ': ' || detail, '; ' ORDER BY code, ref), '') FROM blockers) AS blocker_detail,
        '# Income taxes, ' || getvariable('y') || chr(10) || chr(10) ||
        '## Tax expense' || chr(10) || chr(10) || '| | EUR |' || chr(10) || '|---|---:|' || chr(10) ||
        '| Current tax on profits for the year | ' || fmt((SELECT sum(current_tax) FROM ent)) || ' |' || chr(10) ||
        '| Adjustments in respect of prior years | ' || fmt((SELECT sum(rtp) FROM ent)) || ' |' || chr(10) ||
        '| Deferred tax | ' || fmt((SELECT sum(deferred_pl) FROM ent)) || ' |' || chr(10) ||
        '| **Income tax expense** | **' || fmt((SELECT sum(total_tax) FROM ent)) || '** |' || chr(10) || chr(10) ||
        '## Reconciliation of the effective tax rate' || chr(10) || chr(10) || '| | EUR | % |' || chr(10) || '|---|---:|---:|' || chr(10) ||
        '| Profit before tax | ' || fmt((SELECT sum(pbt) FROM ent)) || ' | |' || chr(10) ||
        (SELECT string_agg('| ' || line || ' | ' || fmt(amount) || ' | ' || round(100 * amount / (SELECT sum(pbt) FROM ent), 1) || ' |', chr(10) ORDER BY ord) FROM etr) || chr(10) ||
        '| **Income tax expense, effective rate** | **' || fmt((SELECT sum(total_tax) FROM ent)) || '** | **' || round(100 * (SELECT sum(total_tax) FROM ent) / (SELECT sum(pbt) FROM ent), 1) || '** |' || chr(10) || chr(10) ||
        '## Deferred tax' || chr(10) || chr(10) || '| | Opening | Profit or loss | OCI | Closing |' || chr(10) || '|---|---:|---:|---:|---:|' || chr(10) ||
        (SELECT string_agg('| ' || category || ' | ' || fmt(o) || ' | ' || fmt(p) || ' | ' || fmt(c) || ' | ' || fmt(cl) || ' |', chr(10) ORDER BY category)
           FROM (SELECT category, sum(opening) AS o, sum(to_pl) AS p, sum(to_oci) AS c, sum(closing) AS cl FROM deferred GROUP BY category HAVING round(sum(abs(opening)) + sum(abs(closing))) <> 0)) || chr(10) ||
        '| **Net deferred tax liability / (asset)** | **' || fmt((SELECT sum(opening) FROM deferred)) || '** | **' || fmt((SELECT sum(to_pl) FROM deferred)) || '** | **' || fmt((SELECT sum(to_oci) FROM deferred)) || '** | **' || fmt((SELECT sum(closing) FROM deferred)) || '** |' || chr(10) || chr(10) ||
        'Presented after offsetting within each tax jurisdiction (IAS 12.74): deferred tax assets ' ||
          fmt(-(SELECT coalesce(sum(n), 0) FROM (SELECT sum(closing) AS n FROM deferred GROUP BY entity) WHERE n < 0)) ||
        ', deferred tax liabilities ' || fmt((SELECT coalesce(sum(n), 0) FROM (SELECT sum(closing) AS n FROM deferred GROUP BY entity) WHERE n > 0)) || '.' || chr(10) || chr(10) ||
        'Deferred tax assets not recognised: ' || fmt((SELECT sum(u_close) FROM ent)) || ', on tax losses of ' || fmt((SELECT sum(losses_close) FROM ent WHERE u_close > 0)) ||
        ' that are not expected to be used within three years. Tax losses carried forward in total: ' || fmt((SELECT sum(losses_close) FROM ent)) || '.' || chr(10) AS note;

  - id: result
    type: io.kestra.plugin.core.output.OutputValues
    values:
      r: "{{ (outputs.provide.outputs | last).row | toJson }}"
      # The opening balances must be what last year's provision closed with.
      restated: >-
        {{ {'locked': fromJson(outputs.year_control.values.lock).entities, 'now': fromJson((outputs.provide.outputs | last).row.opening_entities)}
           | jq('. as $r | if ($r.locked | length) == 0 then "" else
                 [$r.now | to_entries[] as $e | $e.value | to_entries[] as $f
                  | (($r.locked[$e.key][$f.key] // 0) - $f.value) as $d | select($d > 0.01 or $d < -0.01)
                  | "\($e.key) \($f.key) \($r.locked[$e.key][$f.key] // 0) -> \($f.value)"] | join("; ") end') | first }}

  - id: log_provision
    type: io.kestra.plugin.core.log.Log
    message: |
      Tax provision {{ inputs.year }} ({{ inputs.scenario }}).
      {{ outputs.result.values.r | jq('"Profit before tax \(.pbt). Current tax \(.current_tax), prior years \(.prior_year), deferred \(.deferred_tax), total \(.total_tax). Effective rate \(.etr)% (last year \(.etr_prev)%). By entity: \(.etr_by_entity)."') | first }}
      {{ outputs.result.values.r | jq('"Reconciliation: \(.reconciliation). Gap \(.reconciliation_gap)."') | first }}
      {{ outputs.result.values.r | jq('"Net deferred tax \(.net_deferred), of which OCI movement \(.deferred_oci). Unrecognised deferred tax assets \(.unrecognised) (change \(.unrecognised_change)). Losses: \(.losses)."') | first }}
      {{ outputs.result.values.r | jq('"Return to provision: \(.rtp_detail). Blockers: \(.blockers). \(.blocker_detail)"') | first }}
      Opening restated against last year's provision: {{ outputs.result.values.restated == '' ? 'no' : outputs.result.values.restated }}.

  - id: write_note
    type: io.kestra.plugin.core.storage.Write
    extension: .md
    content: "{{ outputs.result.values.r | jq('.note') | first }}"

  - id: evidence
    type: io.kestra.plugin.core.namespace.UploadFiles
    namespace: "{{ flow.namespace }}"
    filesMap:
      "{{ render(vars.pack_dir) }}/tax-note.md": "{{ outputs.write_note.uri }}"
      "{{ render(vars.pack_dir) }}/etr-reconciliation.csv": "{{ outputs.provide.outputFiles.etr }}"
      "{{ render(vars.pack_dir) }}/deferred-tax.csv": "{{ outputs.provide.outputFiles.deferred }}"
      "{{ render(vars.pack_dir) }}/entities.csv": "{{ outputs.provide.outputFiles.entities }}"
      "{{ render(vars.pack_dir) }}/journal.csv": "{{ outputs.provide.outputFiles.journal }}"
      "{{ render(vars.pack_dir) }}/blockers.csv": "{{ outputs.provide.outputFiles.blockers }}"

  - id: decide
    type: io.kestra.plugin.core.flow.Switch
    value: >-
      {%- set r = outputs.result.values.r -%}
      {%- set swing = (r | jq('.etr') | first) - (r | jq('.etr_prev') | first) -%}
      {%- if (r | jq('.blockers') | first) > 0 -%}BLOCKED
      {%- elseif outputs.result.values.restated != '' -%}RESTATED
      {%- elseif (swing > 5 or swing < -5 or (r | jq('.unrecognised_change') | first) > 100000 or (r | jq('.unrecognised_change') | first) < -100000
                  or (r | jq('.max_rtp') | first) > 50000) and inputs.approved_by == '' -%}NEEDS_APPROVAL
      {%- else -%}FINAL{%- endif -%}
    cases:
      FINAL:
        - id: lock_year
          type: io.kestra.plugin.core.kv.Set
          description: The closing deferred tax, unrecognised assets and losses by entity, which next year's opening must match.
          key: "{{ vars.lock_key }}"
          kvType: JSON
          value: >-
            {{ {'y': inputs.year, 'e': fromJson((outputs.provide.outputs | last).row.lock_entities), 'etr': (outputs.result.values.r | jq('.etr') | first), 'by': inputs.approved_by, 'id': execution.id}
               | jq('{year: .y, entities: .e, etr: .etr, approved_by: .by, execution_id: .id}') | first | toJson }}

        - id: log_final
          type: io.kestra.plugin.core.log.Log
          message: "The {{ inputs.year }} tax provision is final: expense {{ outputs.result.values.r | jq('.total_tax') | first }}, effective rate {{ outputs.result.values.r | jq('.etr') | first }}%. Note and journal in {{ render(vars.pack_dir) }}."

      NEEDS_APPROVAL:
        - id: approval_required
          type: io.kestra.plugin.core.execution.Fail
          errorMessage: >-
            Review needed: effective rate {{ outputs.result.values.r | jq('.etr') | first }}% against {{ outputs.result.values.r | jq('.etr_prev') | first }}% last year,
            change in unrecognised deferred tax assets {{ outputs.result.values.r | jq('.unrecognised_change') | first }},
            return to provision {{ outputs.result.values.r | jq('.rtp_detail') | first }}. Read {{ render(vars.pack_dir) }}/tax-note.md and run again with approved_by.

      RESTATED:
        - id: restated
          type: io.kestra.plugin.core.execution.Fail
          errorMessage: "The opening balances differ from last year's final provision: {{ outputs.result.values.restated }}. A tax pack for a closed year changed."

    defaults:
      - id: blocked
        type: io.kestra.plugin.core.execution.Fail
        errorMessage: "The {{ inputs.year }} provision cannot be finalised: {{ outputs.result.values.r | jq('.blocker_detail') | first }}"

extend:
  title: Compute the group income tax provision with deferred tax and the effective rate reconciliation
  metaTitle: Income tax provision, deferred tax and ETR reconciliation (IAS 12, ASC 740)
  shortDescription: Compute current and deferred tax for every entity, apply loss caps, credits and rate changes, test deferred tax asset recoverability, reconcile the effective rate to the cent and write the tax note.
  metaDescription: Year-end income tax provision in Kestra and DuckDB. Current and deferred tax, loss caps, rate changes, recoverability, ETR reconciliation, note.
  description: |
    The tax provision is one of the last and most scrutinised steps of the year-end close. For each entity it needs:
    - taxable profit from book profit,
    - the right loss offset under each country's rules,
    - deferred tax on every difference between book and tax values, at the rate enacted for when they reverse,
    - a judgement on whether loss-making entities will ever use their deferred tax assets.

    Then the group effective tax rate has to be reconciled line by line, and auditors expect it to tie exactly. It is usually a large workbook rebuilt every year. This flow computes it from the entities' tax packs, proves it ties, writes the note, and locks the year.

    It runs with no setup and no network. The demo group has four entities:
    - a French parent with exempt subsidiary dividends and a research credit;
    - a German subsidiary with loss carryforwards and an equity investment at fair value through OCI;
    - a UK subsidiary that faces a rate rise from 25% to 27%, enacted during 2026;
    - a US subsidiary with three loss years and a research credit it cannot use yet.

    Each entity has property, provisions, leases and share-based payments, and the years 2024 to 2027 are computed in sequence.


    ## What is computed, per entity and year

    | Step | Rule |
    |---|---|
    | Taxable profit | Profit before tax + permanent differences - the year's movement in temporary differences |
    | Loss offset | Minimum taxation by country: FR and DE allow 1M plus 50% / 60% of the excess, the UK 5M plus 50%, the US 80% of taxable income. New losses are carried forward |
    | Credits | Used against current tax, the excess carried forward |
    | Current tax | Rate × taxable profit - credits used, plus the return-to-provision true-up of the prior year |
    | Deferred tax | (Carrying amount - tax base) × the rate enacted for reversal (IAS 12.47), for each category, plus losses and credits carried forward |
    | Rate change | The UK's 27% enacted in 2026 remeasures every UK difference in 2026, though current tax stays at 25% until 2027 |
    | OCI | The deferred tax on the fair-value investment goes to OCI, not profit or loss (IAS 12.61A) |
    | Recoverability | A net deferred tax asset is recognised only up to the tax on the next three years' forecast profit (IAS 12.24, 12.35). The rest is disclosed as unrecognised |

    The years run as a recursive chain, so each year starts from the losses and credits the previous one left.

    ## The effective rate reconciliation

    Each line is computed from its own driver, never as a balancing figure:
    - tax at the group rate,
    - the effect of other countries' rates,
    - non-deductible expenses and exempt income,
    - credits,
    - the effect of the enacted rate change,
    - the change in unrecognised deferred tax assets,
    - prior-year adjustments.

    The lines must add up to the tax expense within one cent. Otherwise the provision is blocked, which caught three defects during testing.

    ## Controls

    - **Blocked:**
      - a missing tax base,
      - an entity without an enacted rate,
      - a reconciliation or deferred tax roll-forward that does not tie,
      - tax payable not matching the ledger.
    - **Restated:** the opening balances recomputed from today's tax packs (deferred tax, unrecognised assets and losses by entity) must equal what last year's final provision stored. A changed pack for a closed year stops the run.
    - **Needs approval:** an effective rate that moves more than 5 points, a change in unrecognised deferred tax assets above 100,000, or a return-to-provision adjustment above 50,000.
    - **Year order:** years are finalised once and in order.

    ## How it works

    1. `year_control` and `year_gate` enforce the order and load last year's closing balances.
    2. `provide` (`io.kestra.plugin.jdbc.duckdb.Queries`) holds the rules, the tax packs and the year chain. It then computes deferred tax and recognition, the reconciliation, the roll-forwards, the checks, the journal and the note.
    3. `result` compares the opening balances with the stored ones. `log_provision` prints the provision.
    4. `write_note` (`io.kestra.plugin.core.storage.Write`) and `evidence` store `tax-note.md`, `etr-reconciliation.csv`, `deferred-tax.csv`, `entities.csv`, `journal.csv` and `blockers.csv`.
    5. `decide` (`io.kestra.plugin.core.flow.Switch`):
       - `FINAL`: locks the year with each entity's closing balances.
       - Otherwise the run fails with the reason: `BLOCKED`, `RESTATED` or `NEEDS_APPROVAL`.

    ## Tested end to end

    On Kestra 2.0.3 OSS, in this order.

    | Run | Inputs | Result |
    |---|---|---|
    | 1 | 2025 | Profit before tax 13,912,000. Current 3,454,678, prior years 26,000, deferred 193,482, total 3,674,160: effective rate 26.41%. Reconciliation gap 0.00. DE uses its last 439,428 of losses. US losses reach 7,830,640, and 1,366,888 of deferred tax assets is not recognised. Stops for approval, then final |
    | 2 | 2026 | The UK rate change adds 11,562. Effective rate 25.54%. Approval, then final |
    | 3 | 2026 again | Refused: already final |
    | 4 | 2027 `ISSUES` | Blocked: German PPE without a tax base (which also breaks the two roll-forward checks), the new Dutch entity without an enacted rate, UK tax payable 47,500 off the ledger |
    | 5 | 2027, US opening losses changed in a closed year | `RESTATED`: US losses 9,443,260 → 9,643,260 against the 2026 provision |
    | 6 | 2027 | 22.76%, final |
    | 7 | 2026 `DOWNTURN` after 2025 | The US forecast is cut from 2.4M to 0.5M: a further 399,000 of deferred tax assets derecognised (1.9M × 21%). Effective rate 28.12%. Stops for approval |

    The tax note (`tax-note.md`) contains the expense, the rate reconciliation with percentages, the deferred tax roll-forward by category (opening, profit or loss, OCI, closing), and the unrecognised assets disclosure. It also gives the net deferred tax assets and liabilities after offsetting by jurisdiction.

    I recomputed current tax, losses and credits for 2025 to 2027 with a separate Python model written from the rules, not from the SQL. Every entity matched: group current tax of 3,454,677.60, 3,822,666.00 and 4,105,572.80, and US losses of 7,830,640, 9,443,260 and 9,131,916.

    ## Problems found while testing

    - **The recursion dropped losses.** Losses carried forward were set after the year chain ran, so each year started with zero losses. The roll-forward check failed on the German and US entities. Losses are now computed inside the chain.
    - **Integer columns rounded tax.** Placeholder zeros in the recursive query made the tax columns integers, which left a 0.40 gap in the reconciliation. Every amount is now a double, and the gap is 0.00.
    - **A downturn rewrote last year.** The forecast used for recoverability was one value per entity, so cutting it for 2026 also changed 2025, and the restatement check stopped the run. Forecasts are now held by year end.

    ## Inputs

    | Input | Default | Purpose |
    |---|---|---|
    | `year` | `2026` | The year being provided |
    | `scenario` | `BASE` | `BASE`, `DOWNTURN` or `ISSUES` |
    | `group_rate` | `0.25` | Starting rate of the reconciliation |
    | `approved_by` | empty | The head of tax |

    ## Use it with your data

    - Replace `entities`, `rates`, `pbt`, `permanent`, `credits`, `carrying`, `opening_attributes` and `return_to_provision` with your tax packs. Use one row per category for carrying amount against tax base.
    - Add `loss_cap` rules for your jurisdictions, and loss expiry if they have it.
    - `forecasts` holds the approved forecast used for recognition. Link it to your budget.

    ## Things to know

    - Uncertain tax positions (IFRIC 23, ASC 740-10), Pillar Two top-up tax, withholding taxes on dividends, and deferred tax on undistributed earnings of subsidiaries are not modelled.
    - Interim periods use an estimated annual effective rate (IAS 34). This flow computes the annual provision.
    - Reopening a year is deliberate: delete the KV key `tax_provision`.

    ## Links

    - IAS 12 Income Taxes: https://www.ifrs.org/issued-standards/list-of-standards/ias-12-income-taxes/
    - DuckDB recursive queries: https://duckdb.org/docs/sql/query_syntax/with#recursive-ctes
    - DuckDB plugin: https://kestra.io/plugins/plugin-jdbc-duckdb

    This blueprint was created by [zkasuran](https://github.com/zkasuran).
  tags:
    - Business
    - Data
  subTags:
    - Policy & Compliance
    - Approval Gates
  ee: false
  demo: false
