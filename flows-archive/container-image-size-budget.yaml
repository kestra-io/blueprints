id: container-image-size-budget
namespace: company.team
description: |
  Pull an image, measure its size, and alert Slack when it exceeds the budget -
  bloat is a regression you only see after a slow deploy.

triggers:
  - id: post_build_webhook
    type: io.kestra.plugin.core.trigger.Webhook
    description: Call from the build pipeline right after push; the budget check lands before the image ships.
    key: image-size

inputs:
  - id: image
    type: STRING
    defaults: "nginx:latest"
    description: Image reference to measure.
  - id: max_size_mb
    type: INT
    defaults: 500
    description: Size budget in megabytes.

tasks:
  - id: measure_size
    type: io.kestra.plugin.scripts.shell.Commands
    description: Inspect the image size with docker, convert to MB, and emit it via the stdout outputs protocol. Pull failure reports worst case.
    containerImage: docker:27-cli
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    commands:
      - |
        set -u
        docker pull --quiet "{{ inputs.image }}" >/dev/null 2>&1
        SIZE_BYTES=$(docker inspect -f '{{range .RootFS.DiffIDs}}{{end}}{{.Size}}' "{{ inputs.image }}" 2>/dev/null || echo 0)
        SIZE=$(docker image inspect "{{ inputs.image }}" --format '{{.Size}}' 2>/dev/null || echo 0)
        MB=$(( ${SIZE:-0} / 1048576 ))
        if [ -z "$SIZE" ] || [ "$SIZE" = "0" ]; then MB=999999; fi
        echo "{{ inputs.image }} is ${MB} MB"
        echo "::{\"outputs\": {\"size_mb\": $MB}}::"

  - id: over_budget
    type: io.kestra.plugin.core.flow.If
    description: One branch for the budget - breach alerts Slack with the real number.
    condition: "{{ outputs.measure_size.vars.size_mb > inputs.max_size_mb }}"
    then:
      - id: alert_oversize
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: State the real size and the budget so the win is clear.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": ":whale: Image size budget breach: {{ inputs.image }} is {{ outputs.measure_size.vars.size_mb }} MB (budget {{ inputs.max_size_mb }} MB). Slim the Dockerfile before rollout. Execution {{ execution.id }}."
          }
    else:
      - id: log_ok
        type: io.kestra.plugin.core.log.Log
        description: Record the passing size so the trend is visible.
        message: "{{ inputs.image }} is {{ outputs.measure_size.vars.size_mb }} MB, within the {{ inputs.max_size_mb }} MB budget."

errors:
  - id: alert_measure_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alert when the measurement fails - a missing inspect must not read as "image is tiny".
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "Image size check FAILED in flow {{ flow.id }} (execution {{ execution.id }}) for {{ inputs.image }}. Check the image reference and registry access."
      }

outputs:
  - id: image_size_mb
    type: INT
    description: 'Image size in MB, e.g. 187.'
    value: "{{ outputs.measure_size.vars.size_mb }}"

extend:
  title: Enforce a Container Image Size Budget
  shortDescription: Measure an image's size post-build and alert Slack when it exceeds the budget.
  metaTitle: Container Image Size Budget
  metaDescription: Gate image rollout on a size budget and alert Slack on bloat.
  description: |
    Image bloat is invisible until deploys slow to a crawl. This blueprint pulls the image, reads its size, and alerts Slack when it exceeds your budget. Trigger it from your build pipeline.

    ## How it works

    1. `measure_size` (`io.kestra.plugin.scripts.shell.Commands` on the docker CLI image) pulls the image and emits size in MB via the `::{"outputs": ...}::` protocol.
    2. `over_budget` (`io.kestra.plugin.core.flow.If`) branches: breach -> `alert_oversize`; pass -> `log_ok`.
    3. The `errors` block alerts on pull/inspect failure.
    4. Trigger: a `Webhook`.

    ## What you get

    - A size budget enforced post-build.
    - Real numbers in every message.
    - Failure alerts for missing images.

    ## Who it's for

    - Teams whose images grew 3x after one careless Dockerfile change.
    - Edge deployments where every MB matters.

    ## Why orchestrate this with Kestra

    docker inspect prints bytes; the flow makes it a gate with history and alerts. The next step (block the deploy, suggest a multi-stage fix, record a trend) is one task away.

    ## Prerequisites

    - Docker available on the Kestra Worker.
    - A Slack webhook.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: webhook for breach and failure alerts.

    ## Quick start

    1. Add the Slack webhook secret.
    2. Set `image` and `max_size_mb`.
    3. Run once and read `image_size_mb`.
    4. Wire the `image-size` webhook into your build pipeline.

    ## How to extend

    - Fail the execution over budget for a hard gate.
    - Compare compressed vs uncompressed size.
    - Loop over many images with a `ForEach`.

    ## Links

    - [docker image inspect](https://docs.docker.com/reference/cli/docker/image/inspect/)
    - This blueprint has been created by [yashspidey](https://github.com/yashspidey)
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Docker
    - CI/CD
  ee: false
  demo: false
