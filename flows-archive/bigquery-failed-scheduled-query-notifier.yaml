id: bigquery-failed-scheduled-query-notifier
namespace: company.dataops

description: Monitors Google Cloud BigQuery scheduled queries via Data Transfer Service API, alerting data teams on failed transformation runs.

concurrency:
  limit: 1

inputs:
  - id: gcp_project_id
    type: STRING
    defaults: my-production-data-project
    description: Google Cloud project ID hosting BigQuery scheduled queries.

  - id: lookback_hours
    type: INT
    defaults: 24
    description: Time window in hours to inspect for failed scheduled query executions.

  - id: slack_channel
    type: STRING
    defaults: "#bigquery-dataops-alerts"
    description: Slack channel destination for scheduled query failure notifications.

tasks:
  - id: audit_scheduled_query_runs
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install google-cloud-bigquery-datatransfer
    env:
      GCP_SERVICE_ACCOUNT_KEY: "{{ secret('GCP_SERVICE_ACCOUNT_KEY') }}"
      PROJECT_ID: "{{ inputs.gcp_project_id }}"
      LOOKBACK_HOURS: "{{ inputs.lookback_hours }}"
    script: |
      import os
      import json
      from datetime import datetime, timezone, timedelta
      from google.oauth2 import service_account
      from google.cloud import bigquery_datatransfer_v1
      from kestra import Kestra

      project_id = os.getenv('PROJECT_ID')
      lookback_hours = int(os.getenv('LOOKBACK_HOURS', 24))
      sa_json = os.getenv('GCP_SERVICE_ACCOUNT_KEY')

      creds_dict = json.loads(sa_json)
      credentials = service_account.Credentials.from_service_account_info(creds_dict)

      client = bigquery_datatransfer_v1.DataTransferServiceClient(credentials=credentials)
      parent = f"projects/{project_id}"

      # List transfer configs (scheduled queries are data_source_id = 'scheduled_query')
      configs = client.list_transfer_configs(parent=parent)
      
      now = datetime.now(timezone.utc)
      cutoff_time = now - timedelta(hours=lookback_hours)

      failed_runs = []
      total_configs_audited = 0

      for config in configs:
          if config.data_source_id == 'scheduled_query':
              total_configs_audited += 1
              config_name = config.name
              display_name = config.display_name

              # List recent transfer runs
              runs = client.list_transfer_runs(parent=config_name)
              for run in runs:
                  run_time = run.run_time
                  if run_time and run_time >= cutoff_time:
                      if run.state == bigquery_datatransfer_v1.TransferState.FAILED:
                          error_status = run.error_status.message if run.error_status else "Unknown error"
                          failed_runs.append({
                              'query_name': display_name,
                              'config_id': config_name.split('/')[-1],
                              'run_id': run.name.split('/')[-1],
                              'run_time': run_time.isoformat(),
                              'error_message': error_status
                          })

      total_failures = len(failed_runs)
      has_failures = total_failures > 0

      Kestra.outputs({
          'total_configs_audited': total_configs_audited,
          'failed_runs_count': total_failures,
          'has_failed_runs': has_failures,
          'failed_query_names': list(set(f['query_name'] for f in failed_runs))
      })

      report = {
          'project_id': project_id,
          'total_configs': total_configs_audited,
          'failed_count': total_failures,
          'failed_runs': failed_runs
      }

      with open('bigquery_failed_queries_report.json', 'w') as f:
          json.dump(report, f, indent=2)

    outputFiles:
      - bigquery_failed_queries_report.json

  - id: check_query_failures
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.audit_scheduled_query_runs.vars.has_failed_runs }}"
    then:
      - id: notify_slack_dataops
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "{{ inputs.slack_channel }}",
            "text": "BigQuery Scheduled Query Alert: {{ outputs.audit_scheduled_query_runs.vars.failed_runs_count }} failed scheduled query run(s) detected in project `{{ inputs.gcp_project_id }}`.\n• Failed Queries: {{ outputs.audit_scheduled_query_runs.vars.failed_query_names | join(', ') }}\n• Remediation: Inspect query error details and verify upstream table partition dependencies."
          }
    else:
      - id: log_queries_healthy
        type: io.kestra.plugin.core.log.Log
        message: "All {{ outputs.audit_scheduled_query_runs.vars.total_configs_audited }} BigQuery scheduled queries executed successfully over the past {{ inputs.lookback_hours }} hours."

  - id: export_dataops_manifest
    type: io.kestra.plugin.core.execution.Labels
    labels:
      gcp_project: "{{ inputs.gcp_project_id }}"
      failed_queries: "{{ outputs.audit_scheduled_query_runs.vars.failed_runs_count | string }}"
      execution_status: "{{ outputs.audit_scheduled_query_runs.vars.has_failed_runs ? 'FAILURES_DETECTED' : 'HEALTHY' }}"

triggers:
  - id: hourly_scheduled_query_check
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 * * * *"

extend:
  title: BigQuery Failed Scheduled Query Notifier
  metaTitle: BigQuery Failed Scheduled Query Notifier
  shortDescription: Monitors Google Cloud BigQuery scheduled queries via Data Transfer Service API and alerts on failures.
  metaDescription: Monitors Google BigQuery scheduled queries via Data Transfer Service API, alerting data teams on Slack when query runs fail.
  description: |
    This blueprint acts as an automated reliability monitor for Google Cloud BigQuery scheduled queries and Data Transfer Service pipelines. Scheduled hourly, it queries the BigQuery Data Transfer Service API to identify failed transformation runs within a configurable lookback window, extracting exact error messages and alerting data engineering teams on Slack before downstream reporting dashboards break.

    ## How it works

    1. **Hourly Scheduled Trigger**: The `hourly_scheduled_query_check` trigger (`io.kestra.plugin.core.trigger.Schedule`) fires at the top of every hour.
    2. **Transfer Service API Inspection**: The `audit_scheduled_query_runs` task (`io.kestra.plugin.scripts.python.Script`) connects to Google Cloud using service account credentials, iterates over all `scheduled_query` transfer configs, and checks recent run execution statuses.
    3. **Failure Evaluation Gate**: The `check_query_failures` flowable task (`io.kestra.plugin.core.flow.If`) branches based on whether any failed executions were identified.
    4. **Slack Alert Dispatch**: When query failures occur, `notify_slack_dataops` (`io.kestra.plugin.slack.notifications.SlackIncomingWebhook`) delivers an incident warning with query names and error status.
    5. **Nominal Confirmation**: When all queries succeed, `log_queries_healthy` records confirmed status.
    6. **Manifest Export**: The `export_dataops_manifest` task tags the execution with searchable status labels.

    ## Architecture diagram

    ```mermaid
    flowchart TD
        A[Schedule: Hourly] --> B[audit_scheduled_query_runs: BigQuery Data Transfer API]
        B --> C{Failed Queries Found?}
        C -- Yes --> D[notify_slack_dataops: Slack Webhook]
        C -- No --> E[log_queries_healthy: Log]
        D --> F[export_dataops_manifest: Execution Labels]
        E --> F
    ```

    ## Use cases

    - **Silent Transformation Failure Prevention**: Catch SQL syntax, schema changes, or quota exceeded errors in BigQuery scheduled queries before morning executive briefings.
    - **Upstream Dependency Breakage Alerts**: Quickly pinpoint partition filter mismatches or missing staging table updates.
    - **Multi-Project DataOps Monitoring**: Maintain centralized operational visibility over distributed scheduled SQL queries across corporate GCP projects.

    ## Inputs

    | Name | Type | Default | Description |
    | :--- | :--- | :--- | :--- |
    | `gcp_project_id` | STRING | `my-production-data-project` | Google Cloud project ID hosting BigQuery scheduled queries. |
    | `lookback_hours` | INT | `24` | Time window in hours to inspect for failed scheduled query executions. |
    | `slack_channel` | STRING | `#bigquery-dataops-alerts` | Slack channel destination for scheduled query failure notifications. |

    ## Expected outputs

    - `{{ outputs.audit_scheduled_query_runs.vars.total_configs_audited }}`: Number of scheduled query transfer configurations audited.
    - `{{ outputs.audit_scheduled_query_runs.vars.failed_runs_count }}`: Count of failed executions observed within lookback window.
    - `{{ outputs.audit_scheduled_query_runs.vars.has_failed_runs }}`: Boolean flag indicating failed query detection.
    - `{{ outputs.audit_scheduled_query_runs.vars.failed_query_names }}`: List of unique failed scheduled query display names.
    - `{{ outputs.audit_scheduled_query_runs.outputFiles['bigquery_failed_queries_report.json'] }}`: Full JSON failure diagnostics report.

    ## Prerequisites

    - Google Cloud Service Account credentials with `roles/bigquery.admin` or `roles/bigquerydatatransfer.viewer` on the targeted project.
    - Incoming Webhook URL configured for your data operations Slack channel.

    ### Secrets

    - `GCP_SERVICE_ACCOUNT_KEY`: Google Cloud Service Account JSON key string.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook endpoint URL.

    ## Quick start

    1. Configure `GCP_SERVICE_ACCOUNT_KEY` and `SLACK_WEBHOOK_URL` in your Kestra namespace secrets.
    2. Import this flow YAML into your Kestra workspace.
    3. Specify your Google Cloud Project ID in `gcp_project_id`.
    4. Click **Execute** in the UI to perform an initial scheduled query health scan.

    ## Common pitfalls and troubleshooting

    - **Location Scope**: In multi-region deployments, scheduled queries may belong to regional endpoints (e.g., `us`, `eu`, `us-central1`); specify the appropriate parent path if configs reside in custom regions.
    - **API Activation**: Ensure `bigquerydatatransfer.googleapis.com` is enabled in the audited GCP project.

    ## How to extend

    - Add automated manual run re-triggering via `client.start_manual_transfer_runs()` after resolving transient quota issues.
    - Parse SQL text of failing queries and pass error messages to Gemini or Claude to generate fix recommendations.
    - Escalate consecutive failures to PagerDuty for critical financial reporting models.

    ## Links

    - Kestra Python Script Documentation: https://kestra.io/plugins/plugin-scripts-python/io.kestra.plugin.scripts.python.Script
    - Kestra Slack Plugin Documentation: https://kestra.io/plugins/plugin-notifications
    - BigQuery Data Transfer Service API: https://cloud.google.com/bigquery/docs/reference/datatransfer/rest
  tags:
    - Cloud
    - Data
  subTags:
    - GCP Services
    - Monitoring & Alerting
    - Day 2 Operations
  ee: false
  demo: false
