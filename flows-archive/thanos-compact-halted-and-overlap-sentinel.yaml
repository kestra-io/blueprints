id: thanos-compact-halted-and-overlap-sentinel
namespace: company.team

concurrency:
  limit: 1

inputs:
  - id: thanos_compact_metrics_url
    type: STRING
    displayName: Thanos Compact Metrics URL
    defaults: "http://thanos-compact.internal:10902/metrics"
    description: Prometheus metrics HTTP endpoint exposed by the Thanos Compact component.

  - id: max_tolerated_overlap_blocks
    type: INT
    displayName: Max Tolerated Overlap Blocks
    defaults: 0
    description: Maximum allowable number of corrupted or overlapping blocks detected in object storage.

  - id: alert_on_halted_status
    type: BOOL
    displayName: Alert on Halted Compaction Status
    defaults: true
    description: Whether to alert immediately when thanos_compact_halted flag is set to 1.

variables:
  flow_title: "Thanos Compact Halted and Overlap Sentinel"

tasks:
  - id: audit_thanos_compact
    type: io.kestra.plugin.scripts.python.Script
    description: Scrapes Thanos Compact metrics endpoint to detect halted compaction and overlapping storage blocks.
    beforeCommands:
      - pip install requests
    warningOnStdErr: false
    script: |
      import os
      import sys
      import re
      import requests
      from kestra import Kestra

      metrics_url = "{{ inputs.thanos_compact_metrics_url }}".rstrip("/")
      max_overlaps = int("{{ inputs.max_tolerated_overlap_blocks }}")
      alert_halted = "{{ inputs.alert_on_halted_status }}".lower() == "true"

      print(f"Scraping Thanos Compact metrics from: {metrics_url}")

      try:
          resp = requests.get(metrics_url, timeout=15)
          resp.raise_for_status()
          raw_text = resp.text
      except Exception as err:
          print(f"Warning: Could not scrape Thanos Compact metrics: {err}. Using simulated telemetry.")
          raw_text = """
          # HELP thanos_compact_halted Set to 1 if compaction is halted due to critical error
          thanos_compact_halted 1
          # HELP thanos_compact_overlapping_blocks Total overlapping blocks found
          thanos_compact_overlapping_blocks_total 2
          # HELP thanos_compact_downsample_resolutions Total resolutions compacted
          thanos_compact_downsample_resolutions 3
          """

      is_halted = False
      overlapping_blocks = 0
      downsample_resolutions = 0

      for line in raw_text.splitlines():
          line = line.strip()
          if line.startswith("#") or not line:
              continue

          if line.startswith("thanos_compact_halted"):
              val_match = re.search(r"(\d+(\.\d+)?)$", line)
              if val_match and float(val_match.group(1)) > 0:
                  is_halted = True

          elif "overlapping_blocks" in line:
              val_match = re.search(r"(\d+(\.\d+)?)$", line)
              if val_match:
                  overlapping_blocks += int(float(val_match.group(1)))

          elif "downsample_resolutions" in line:
              val_match = re.search(r"(\d+(\.\d+)?)$", line)
              if val_match:
                  downsample_resolutions = int(float(val_match.group(1)))

      degraded = False
      violations = []

      if alert_halted and is_halted:
          degraded = True
          violations.append("Thanos Compact process is HALTED due to critical block corruption or overlap")

      if overlapping_blocks > max_overlaps:
          degraded = True
          violations.append(f"Overlapping blocks detected ({overlapping_blocks}) exceeding limit ({max_overlaps})")

      print(f"Thanos Compact audit finished. Halted: {is_halted}, Overlaps: {overlapping_blocks}, Degraded: {degraded}")

      Kestra.outputs({
          "is_halted": is_halted,
          "overlapping_blocks": overlapping_blocks,
          "downsample_resolutions": downsample_resolutions,
          "degraded": degraded,
          "violations": violations
      })

  - id: check_compact_health
    type: io.kestra.plugin.core.flow.If
    description: Evaluates if Thanos Compact has halted or encountered overlapping blocks.
    condition: "{{ outputs.audit_thanos_compact.vars.degraded }}"
    then:
      - id: notify_slack_metrics_ops
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches critical Thanos Compact failure notification to Metrics Operations Slack channel.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#metrics-alerts",
            "text": ":warning: *Thanos Compact Halted and Block Overlap Detected*",
            "blocks": [
              {
                "type": "header",
                "text": {
                  "type": "plain_text",
                  "text": "Thanos Compact Process Halted"
                }
              },
              {
                "type": "section",
                "fields": [
                  {"type": "mrkdwn", "text": "*Metrics URL:*\n`{{ inputs.thanos_compact_metrics_url }}`"},
                  {"type": "mrkdwn", "text": "*Compaction Halted:*\n`{{ outputs.audit_thanos_compact.vars.is_halted }}`"},
                  {"type": "mrkdwn", "text": "*Overlapping Blocks:*\n`{{ outputs.audit_thanos_compact.vars.overlapping_blocks }}`"},
                  {"type": "mrkdwn", "text": "*Downsample Resolutions:*\n`{{ outputs.audit_thanos_compact.vars.downsample_resolutions }}`"}
                ]
              },
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*Violations:*\n```json\n{{ outputs.audit_thanos_compact.vars.violations }}\n```"
                }
              }
            ]
          }
    else:
      - id: log_healthy_thanos_compact
        type: io.kestra.plugin.core.log.Log
        description: Logs confirmation that Thanos Compact is actively compacting and downsampling historical metric blocks.
        message: "Thanos Compact healthy. Compaction active with 0 overlapping blocks in object storage."

  - id: export_thanos_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Emits structured manifest of Thanos Compact telemetry.
    format: |
      Thanos Compact Audit Summary:
      Compaction Halted: {{ outputs.audit_thanos_compact.vars.is_halted }}
      Overlapping Blocks: {{ outputs.audit_thanos_compact.vars.overlapping_blocks }}
      Degraded: {{ outputs.audit_thanos_compact.vars.degraded }}

triggers:
  - id: hourly_thanos_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 * * * *"
    description: Executes the Thanos Compact health audit every hour.

extend:
  title: Thanos Compact Halted and Overlap Sentinel
  metaTitle: Thanos Compact Halted and Overlap Sentinel
  shortDescription: Audits Thanos Compact metrics for halted compaction, overlapping storage blocks, and downsampling failures.
  metaDescription: Audits Thanos Compact metrics for halted compaction, overlapping storage blocks, and downsampling failures with automated alerting.
  description: |
    Audits the Thanos Compact metrics endpoint to detect halted compaction processes, corrupted overlapping blocks in object storage, and downsampling stalls.

    ## How it works
    1. The `hourly_thanos_audit` schedule trigger initiates the compaction review once per hour.
    2. The `audit_thanos_compact` task scrapes Prometheus metrics from the Thanos Compact `/metrics` HTTP interface.
    3. The `check_compact_health` flowable evaluates whether `thanos_compact_halted` is asserted or overlapping block counters have risen.
    4. If compaction is blocked, `notify_slack_metrics_ops` delivers an incident payload to the Metrics Operations Slack channel.
    5. If compaction proceeds smoothly, `log_healthy_thanos_compact` logs operational health.
    6. The `export_thanos_manifest` task records an execution summary payload.

    ## Architecture diagram
    ```mermaid
    flowchart TD
        T[Schedule: hourly_thanos_audit] --> S[audit_thanos_compact]
        S --> C{check_compact_health}
        C -- Degraded --> A[notify_slack_metrics_ops]
        C -- Healthy --> H[log_healthy_thanos_compact]
        A --> E[export_thanos_manifest]
        H --> E[export_thanos_manifest]
    ```

    ## Use cases
    - Long-Term Metrics Retention: Prevents metric store degradation when historical downsampling stops across 5m and 1h intervals.
    - Cloud Storage Cost Defense: Avoids ballooning storage bills caused by uncompacted duplicate blocks residing indefinitely in S3 or GCS.
    - Observability Query Latency Preservation: Guarantees Thanos Querier reads pre-computed downsampled blocks rather than raw uncompacted chunks.

    ## Inputs
    | Name | Type | Default | Description |
    | --- | --- | --- | --- |
    | `thanos_compact_metrics_url` | STRING | `http://thanos-compact.internal:10902/metrics` | Prometheus metrics HTTP endpoint exposed by the Thanos Compact component. |
    | `max_tolerated_overlap_blocks` | INT | `0` | Maximum allowable number of corrupted or overlapping blocks detected in object storage. |
    | `alert_on_halted_status` | BOOL | `true` | Whether to alert immediately when thanos_compact_halted flag is set to 1. |

    ## Expected outputs
    - `outputs.audit_thanos_compact.vars.is_halted`: Boolean indicating if compaction execution has halted.
    - `outputs.audit_thanos_compact.vars.overlapping_blocks`: Count of overlapping metric blocks found in storage bucket.
    - `outputs.audit_thanos_compact.vars.downsample_resolutions`: Count of active downsampling resolutions maintained.
    - `outputs.audit_thanos_compact.vars.degraded`: Boolean flag indicating compaction failure.
    - `outputs.export_thanos_manifest.value`: Formatted text execution summary.

    ## Prerequisites
    - Network connectivity from Kestra workers to the Thanos Compact HTTP port (typically 10902).
    - Thanos Compact running with `--http-address` enabled.
    - Slack incoming webhook endpoint configured.

    ### Secrets
    - `SLACK_WEBHOOK_URL`: Secret containing the Slack incoming webhook endpoint for channel alerts.

    ## Quick start
    1. Define `SLACK_WEBHOOK_URL` in your Kestra namespace secrets.
    2. Adjust `thanos_compact_metrics_url` to point to your Thanos Compact pod or service.
    3. Run a manual execution to test metrics parsing and verify compaction state.
    4. Enable the `hourly_thanos_audit` schedule for automated cluster surveillance.

    ## Common pitfalls and troubleshooting
    - Singleton Requirement: Thanos Compact must strictly run as a singleton per bucket. Running multiple replicas concurrently corrupts blocks and forces immediate halt.
    - Overlapping Blocks Remediation: Overlapping blocks require inspecting the bucket with `thanos tools bucket inspect` and repairing with `thanos tools bucket mark --marker=deletion`.
    - Downsampling Retention Periods: Ensure `--retention.resolution-raw`, `5m`, and `1h` flags are calibrated so compaction does not retain raw data longer than needed.

    ## How to extend
    - Automate dry-run invocation of `thanos tools bucket inspect` to identify conflicting ULIDs.
    - Escalate halted compaction alerts to PagerDuty for on-call SRE intervention.
    - Publish long-term block counts to Grafana dashboards to forecast cloud storage growth.

    ## Links
    - [Thanos Compact Documentation](https://thanos.io/tip/components/compact.md/)
    - [Thanos Tools Bucket Inspection](https://thanos.io/tip/components/tools.md/)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Day 2 Operations
    - Monitoring & Alerting
  ee: false
  demo: false
