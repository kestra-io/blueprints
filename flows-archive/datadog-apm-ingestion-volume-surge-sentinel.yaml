id: datadog-apm-ingestion-volume-surge-sentinel
namespace: company.sre

inputs:
  - id: dd_site
    type: STRING
    defaults: "datadoghq.com"
    description: Datadog site hostname.
  - id: trace_volume_threshold_giga_spans
    type: FLOAT
    defaults: 10.0
    description: Warning threshold for estimated APM ingested trace spans (in billions/giga-spans) in the current billing cycle.

tasks:
  - id: audit_apm_usage
    type: io.kestra.plugin.scripts.shell.Commands
    containerImage: ghcr.io/kestra-io/tools:latest
    commands:
      - |
        START_MONTH=$(date -u +%Y-%m)
        
        curl -s -G "https://api.{{ inputs.dd_site }}/api/v1/usage/billable-summary?month=$START_MONTH"           -H "DD-API-KEY: {{ secret('DATADOG_API_KEY') }}"           -H "DD-APPLICATION-KEY: {{ secret('DATADOG_APP_KEY') }}" > /tmp/apm_usage.json
        
        APM_HOSTS=$(jq '.usage[]? | select(.usage_type == "apm_host_top99p") | .billable_ingested_events // 0' /tmp/apm_usage.json)
        USAGE_DETAILS=$(jq -c '.usage[]? | select(.usage_type | test("apm|trace")) | {type: .usage_type, units: .units, billable: .billable_ingested_events}' /tmp/apm_usage.json)
        
        echo "::set-output name=apm_hosts::$APM_HOSTS::"
        echo "::set-output name=usage_details::$USAGE_DETAILS::"

  - id: evaluate_apm_surge
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.audit_apm_usage.vars.apm_hosts | float > inputs.trace_volume_threshold_giga_spans }}"
    then:
      - id: notify_finops_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#finops-cost-alerts",
            "attachments": [
              {
                "color": "warning",
                "title": "⚠️ Datadog APM Ingestion Volume Surge Alert",
                "text": "Current month APM ingestion metric has reached *{{ outputs.audit_apm_usage.vars.apm_hosts }}*, exceeding threshold *{{ inputs.trace_volume_threshold_giga_spans }}*. Usage breakdown: {{ outputs.audit_apm_usage.vars.usage_details }}. Impact: Unbudgeted trace sampling rates in high-throughput services drive significant bill overages.",
                "footer": "Kestra FinOps Sentinel • Datadog APM"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#finops-cost-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ Datadog APM Sentinel Execution Failed",
            "text": "The Datadog APM billable usage query failed. Please verify API and Application credentials.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 10 * * *"
    disabled: true

extend:
  metaDescription: "Audits Datadog billable usage metrics to detect APM span ingestion volume surges and trace sampling cost overruns."
  metaTitle: Datadog APM Ingestion Volume and Trace Billing Surge Sentinel with Kestra
  title: Datadog APM Ingestion Volume and Trace Billing Surge Sentinel
  shortDescription: Audits Datadog billable usage metrics to detect APM span ingestion volume surges and trace sampling cost overruns.
  description: |
    ## How it works
    This workflow connects to the Datadog Usage Metering API (`/api/v1/usage/billable-summary`) to query current-month APM trace and span ingestion volumes. When high-throughput microservices deploy overly aggressive head-based or tail-based trace sampling rules, span ingestion skyrockets. If observed ingestion exceeds the monthly budget threshold, an automated alert is routed to the FinOps and SRE teams.

    ## What you get
    - Proactive trace ingestion tracking across all instrumented microservices.
    - Prevents runaway APM billing surprises at month-end.
    - Contextual breakdown of billable APM units and indexed spans.

    ## Who it's for
    - FinOps Managers and Engineering Directors managing SaaS observability spending.
    - Platform SREs configuring OpenTelemetry and Datadog tracer sampling rates.

    ## Why orchestrate this with Kestra
    - **Scheduled Daily Tracking**: Automate daily consumption verification without manual portal checks.
    - **Cross-Service Visibility**: Correlate APM spend with infrastructure footprint in a unified data workflow.
    - **Clean Extensibility**: Dispatch automated recommendations to tune tracer sampling settings.

    ## Prerequisites
    - Datadog API and Application keys with permissions to read usage metering reports.
    - Secrets `DATADOG_API_KEY`, `DATADOG_APP_KEY`, and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import this blueprint into Kestra.
    2. Configure Datadog API credentials and Slack webhook.
    3. Run the flow to audit current month billable APM usage.

    ## How to extend
    - Query individual service ingestion breakdown using the Datadog APM retention filters API.
    - Trigger automated configuration updates in Kubernetes ConfigMaps to reduce sampling percentages.

    ## Links
    - [Datadog Usage Metering API Documentation](https://docs.datadoghq.com/api/latest/usage-metering/#get-billable-summary)
    - [Kestra Workflow Components](https://kestra.io/docs/workflow-components)
  tags:
    - Cloud
    - Business
  subTags:
    - Infrastructure Automation
    - HR & Ops Automation
  ee: false
  demo: false
