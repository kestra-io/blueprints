id: postgres-logical-replication-slot-delay-sentinel
namespace: company.data

inputs:
  - id: pg_host
    type: STRING
    defaults: "postgres.internal"
    description: PostgreSQL server hostname or IP address.
  - id: pg_port
    type: INT
    defaults: 5432
    description: PostgreSQL port.
  - id: pg_user
    type: STRING
    defaults: "postgres"
    description: PostgreSQL username.
  - id: max_wal_retention_mb_threshold
    type: INT
    defaults: 10240
    description: "Maximum acceptable WAL retention in Megabytes per replication slot (default 10 GB)."

tasks:
  - id: query_replication_slots
    type: io.kestra.plugin.scripts.shell.Commands
    containerImage: postgres:15-alpine
    commands:
      - |
        export PGPASSWORD="{{ secret('POSTGRES_PASSWORD') }}"
        
        psql -h "{{ inputs.pg_host }}" -p "{{ inputs.pg_port }}" -U "{{ inputs.pg_user }}" -d postgres -t -A -F"," -c "SELECT slot_name, active, round(pg_wal_lsn_diff(pg_current_wal_lsn(), restart_lsn) / 1024 / 1024, 2) as retained_mb FROM pg_replication_slots WHERE NOT active OR pg_wal_lsn_diff(pg_current_wal_lsn(), restart_lsn) >= ({{ inputs.max_wal_retention_mb_threshold }} * 1024 * 1024) ORDER BY retained_mb DESC LIMIT 1;" > /tmp/pg_slots.csv
        
        cat /tmp/pg_slots.csv
        
        SLOT_NAME=$(awk -F',' '{print $1}' /tmp/pg_slots.csv)
        ACTIVE_STATUS=$(awk -F',' '{print $2}' /tmp/pg_slots.csv)
        RETAINED_MB=$(awk -F',' '{print $3}' /tmp/pg_slots.csv)
        RETAINED_MB=${RETAINED_MB:-0}
        
        echo "::set-output name=slot_name::$SLOT_NAME::"
        echo "::set-output name=active_status::$ACTIVE_STATUS::"
        echo "::set-output name=retained_mb::$RETAINED_MB::"

  - id: evaluate_slot_health
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.query_replication_slots.vars.slot_name != '' }}"
    then:
      - id: notify_dba_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#postgresql-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 PostgreSQL Replication Slot WAL Accumulation Alert",
                "text": "Replication slot `{{ outputs.query_replication_slots.vars.slot_name }}` on `{{ inputs.pg_host }}` is retaining *{{ outputs.query_replication_slots.vars.retained_mb }} MB* of WAL files (Active: *{{ outputs.query_replication_slots.vars.active_status }}*)! Impact: PostgreSQL cannot purge WAL logs while replication slots lag, threatening 100% disk saturation and immediate database crash.",
                "footer": "Kestra Database Sentinel • PostgreSQL"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#postgresql-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ PostgreSQL Logical Replication Slot Lag and WAL Retention Sentinel Pipeline Failure",
            "text": "Failed to query pg_replication_slots. Verify PostgreSQL connection parameters.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  metaDescription: "Audits PostgreSQL pg_replication_slots to detect inactive slots and excessive WAL file disk retention."
  metaTitle: PostgreSQL Logical Replication Slot Lag and WAL Retention Sentinel with Kestra
  title: PostgreSQL Logical Replication Slot Lag and WAL Retention Sentinel
  shortDescription: Audits PostgreSQL pg_replication_slots to detect inactive slots and excessive WAL file disk retention.
  description: |
    ## How it works
    This workflow queries `pg_replication_slots` and computes the byte lag using `pg_wal_lsn_diff(pg_current_wal_lsn(), restart_lsn)`. When CDC consumers (Debezium, Flink), logical standby replicas, or ETL jobs disconnect or lag, the primary database refuses to delete WAL segments past `restart_lsn`. As WAL files accumulate, the filesystem fills up, causing a hard crash. When lagging slots are detected, Slack is notified immediately.

    ## What you get
    - Immediate detection of inactive or severely lagging logical replication slots.
    - Prevents catastrophic disk saturation caused by unpurged WAL files.
    - Pinpoints specific slot names and retained megabyte volumes.

    ## Who it's for
    - Database Administrators (DBAs) and SREs maintaining PostgreSQL clusters with logical replication.
    - Data Engineers operating change data capture (CDC) pipelines.

    ## Why orchestrate this with Kestra
    - **Continuous WAL Safety**: Audit slot health every 15 minutes before disk alerts trigger.
    - **Native Query Execution**: Lightweight SQL check with zero database performance impact.
    - **Self-Healing Integration**: Automate `pg_drop_replication_slot()` for verified abandoned consumers.

    ## Prerequisites
    - PostgreSQL 10+ with logical replication slots configured.
    - Secrets `POSTGRES_PASSWORD` and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import the blueprint.
    2. Configure PostgreSQL host and retention threshold.
    3. Run the workflow to inspect replication slot lag.

    ## How to extend
    - Automatically drop inactive development slots older than 48 hours.
    - Correlate with underlying disk volume free space metrics.

    ## Links
    - [PostgreSQL Replication Slots Documentation](https://www.postgresql.org/docs/current/warm-standby.html#STREAMING-REPLICATION-SLOTS)
    - [Kestra Shell Plugin](https://kestra.io/plugins/plugin-scripts/commands/io.kestra.plugin.scripts.shell.commands)
  tags:
    - Data
    - Infrastructure
  subTags:
    - ELT & Data Landing
    - Day 2 Operations
  ee: false
  demo: false
