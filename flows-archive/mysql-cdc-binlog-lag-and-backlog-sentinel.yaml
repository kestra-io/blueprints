id: mysql-cdc-binlog-lag-and-backlog-sentinel
namespace: company.data

description: |
  Probe a MySQL binary log with Debezium, classify the drained change-event backlog
  HEALTHY/WARNING/CRITICAL/PROBE_FAILED against your own thresholds, and alert Slack the
  moment consumer-side lag starts accumulating, before binlogs rotate and corrupt
  replication state.

inputs:
  - id: hostname
    type: STRING
    displayName: MySQL Host
    description: Hostname or Docker container name of the target MySQL database server.
    defaults: mysql-cdc

  - id: port
    type: STRING
    displayName: MySQL Port
    description: Port number on which the MySQL server is listening.
    defaults: "3306"

  - id: username
    type: STRING
    displayName: Replication User
    description: MySQL user account with REPLICATION SLAVE and REPLICATION CLIENT privileges.
    defaults: root

  - id: server_id
    type: INT
    displayName: Debezium Server ID
    description: Unique integer server ID registered with MySQL binlog master.
    defaults: 5401

  - id: included_tables
    type: STRING
    displayName: Monitored Table Pattern
    description: Fully qualified table pattern to capture changes from, such as production.orders.
    defaults: production.orders

  - id: max_probe_records
    type: INT
    displayName: Max Probe Records
    description: Maximum number of change events to drain from the binary log during this probe cycle.
    defaults: 1000

  - id: max_wait_duration
    type: STRING
    displayName: Probe Timeout Duration
    description: ISO-8601 duration bounding the probe poll time (e.g. PT10S for 10 seconds).
    defaults: PT10S

  - id: warning_backlog_threshold
    type: INT
    displayName: Warning Backlog Threshold
    description: Number of accumulated change events triggering a WARNING operational alert.
    defaults: 200

  - id: critical_backlog_threshold
    type: INT
    displayName: Critical Backlog Threshold
    description: Number of accumulated change events triggering a CRITICAL operational escalation.
    defaults: 500

  - id: state_name
    type: STRING
    displayName: KV Checkpoint State Key
    description: Key prefix under Kestra KV store used to persist Debezium binlog offset coordinates.
    defaults: mysql-cdc-checkpoint

  - id: dry_run
    type: SELECT
    displayName: Dry Run Mode
    description: When true, audits replication lag and logs telemetry without dispatching Slack alerts.
    values:
      - "true"
      - "false"
    defaults: "true"

triggers:
  - id: cdc_lag_sentinel_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    description: Runs the CDC binlog backlog probe every 5 minutes to detect replication drift before binlogs rotate.
    cron: "*/5 * * * *"
    disabled: true

tasks:
  - id: probe_cdc_backlog
    type: io.kestra.plugin.debezium.mysql.Capture
    description: Connects to the MySQL binary log with Debezium, probes change events, and commits offsets to Kestra KV store.
    hostname: "{{ inputs.hostname }}"
    port: "{{ inputs.port }}"
    username: "{{ inputs.username }}"
    password: "{{ secret('MYSQL_PASSWORD') }}"
    serverId: "{{ inputs.server_id }}"
    snapshotMode: NEVER
    maxRecords: "{{ inputs.max_probe_records }}"
    maxWait: "{{ inputs.max_wait_duration }}"
    stateName: "{{ inputs.state_name }}"
    includedTables:
      - "{{ inputs.included_tables }}"
    allowFailure: true

  - id: classify_backlog_severity
    type: io.kestra.plugin.core.debug.Return
    description: Evaluates probe results against operational thresholds and assigns a severity classification.
    format: "{{ outputs.probe_cdc_backlog.size is not defined ? 'PROBE_FAILED' : (outputs.probe_cdc_backlog.size >= inputs.critical_backlog_threshold ? 'CRITICAL' : (outputs.probe_cdc_backlog.size >= inputs.warning_backlog_threshold ? 'WARNING' : 'HEALTHY')) }}"

  - id: route_backlog_action
    type: io.kestra.plugin.core.flow.Switch
    description: Branches workflow based on backlog severity classification to alert Slack or record audit logs.
    value: "{{ outputs.classify_backlog_severity.value }}"
    cases:
      CRITICAL:
        - id: check_critical_dry_run
          type: io.kestra.plugin.core.flow.If
          description: Verify dry run status before paging on-call engineering channel.
          condition: "{{ inputs.dry_run == 'false' }}"
          then:
            - id: alert_critical_backlog
              type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
              description: Dispatches critical page to Slack with binlog event backlog count and recovery actions.
              url: "{{ secret('SLACK_WEBHOOK_URL') }}"
              payload: |
                {
                  "channel": "#data-ops-critical",
                  "text": ":rotating_light: *CRITICAL: MySQL CDC Binlog Backlog Spike Detected* | Host: `{{ inputs.hostname }}:{{ inputs.port }}` | Table: `{{ inputs.included_tables }}` | Captured Events: `{{ outputs.probe_cdc_backlog.size }}` (Threshold: >= `{{ inputs.critical_backlog_threshold }}`) | State Checkpoint: `{{ inputs.state_name }}` | Execution ID: `{{ execution.id }}` | Action: Verify downstream consumer health and primary binlog retention."
                }
          else:
            - id: log_critical_dry_run
              type: io.kestra.plugin.core.log.Log
              description: Logs simulated critical alert when dry run mode is active.
              message: "SIMULATION [CRITICAL]: CDC binlog backlog breached threshold ({{ outputs.probe_cdc_backlog.size }} >= {{ inputs.critical_backlog_threshold }}). Slack alert suppressed by dry_run toggle."

      WARNING:
        - id: check_warning_dry_run
          type: io.kestra.plugin.core.flow.If
          description: Verify dry run status before sending warning notification.
          condition: "{{ inputs.dry_run == 'false' }}"
          then:
            - id: notify_warning_backlog
              type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
              description: Sends warning notification to Slack data operations channel.
              url: "{{ secret('SLACK_WEBHOOK_URL') }}"
              payload: |
                {
                  "channel": "#data-ops-alerts",
                  "text": ":warning: *WARNING: Elevated MySQL CDC Binlog Backlog* | Host: `{{ inputs.hostname }}:{{ inputs.port }}` | Table: `{{ inputs.included_tables }}` | Captured Events: `{{ outputs.probe_cdc_backlog.size }}` (Threshold: >= `{{ inputs.warning_backlog_threshold }}`) | Execution ID: `{{ execution.id }}` | Change event velocity rising."
                }
          else:
            - id: log_warning_dry_run
              type: io.kestra.plugin.core.log.Log
              description: Logs simulated warning when dry run mode is active.
              message: "SIMULATION [WARNING]: CDC binlog backlog exceeded warning threshold ({{ outputs.probe_cdc_backlog.size }} >= {{ inputs.warning_backlog_threshold }}). Slack alert suppressed."

      PROBE_FAILED:
        - id: alert_probe_failure
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: Alerts engineering team when Debezium cannot reach MySQL binlog or authentication fails.
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "channel": "#data-ops-critical",
              "text": ":x: *ERROR: MySQL CDC Probe Task Failed* | Host: `{{ inputs.hostname }}:{{ inputs.port }}` | Server ID: `{{ inputs.server_id }}` | Execution ID: `{{ execution.id }}` | Diagnosis: Debezium could not stream binary log. Check network, server-id collision, or replication privileges."
            }

      HEALTHY:
        - id: log_healthy_stream
          type: io.kestra.plugin.core.log.Log
          description: Confirms CDC stream is healthy and keeping pace with database transactions.
          message: "CDC Stream HEALTHY: Captured {{ outputs.probe_cdc_backlog.size ?? 0 }} change events (within nominal threshold < {{ inputs.warning_backlog_threshold }}). Offset committed to KV store key '{{ inputs.state_name }}'."

  - id: audit_sentinel_run
    type: io.kestra.plugin.core.log.Log
    description: Records standardized audit telemetry for reporting and historical trend tracking.
    message: "SENTINEL AUDIT COMPLETE | Status: {{ outputs.classify_backlog_severity.value }} | Events: {{ outputs.probe_cdc_backlog.size ?? 0 }} | ServerID: {{ inputs.server_id }} | Host: {{ inputs.hostname }}:{{ inputs.port }} | Table: {{ inputs.included_tables }}"

errors:
  - id: alert_sentinel_flow_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Ensures unhandled workflow failures notify engineering immediately so monitoring never silently fails.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "#data-ops-critical",
        "text": ":skull: *CRITICAL: MySQL CDC Sentinel Workflow Aborted Unexpectedly* | Flow ID: `{{ flow.id }}` | Execution ID: `{{ execution.id }}` | Action: Inspect Kestra execution logs immediately."
      }

outputs:
  - id: sentinel_status
    type: STRING
    value: "{{ outputs.classify_backlog_severity.value }}"
    description: Operational health classification assigned during this sentinel run.

  - id: captured_events_count
    type: INT
    value: "{{ outputs.probe_cdc_backlog.size ?? 0 }}"
    description: Total change data capture events drained and committed in this probe window.

  - id: cdc_storage_uri
    type: STRING
    value: "{{ outputs.probe_cdc_backlog.uris is defined ? (outputs.probe_cdc_backlog.uris | jq('[.[]] | first') | first) : '' }}"
    description: Internal storage URI containing the captured raw CDC transaction event batch. The task's real output field is `uris`, a map keyed by table, not a single `uri`; this takes the one entry since only one table is monitored.

extend:
  title: MySQL CDC Binlog Lag and Replication Backlog Sentinel
  metaTitle: MySQL CDC Binlog Lag and Replication Backlog Sentinel | Kestra
  shortDescription: Audit MySQL Change Data Capture replication lag with Debezium, track binlog offsets in KV store, and alert Slack on replication backlog spikes.
  metaDescription: Audit MySQL CDC replication lag with Debezium, track binlog offsets in KV store, and alert Slack on replication backlog spikes.
  description: |
    Proactively monitor MySQL Change Data Capture (CDC) replication lag and streaming backpressure using Debezium and Kestra KV store. High-throughput transactional databases continuously generate binary log events; if streaming consumers stall or downstream pipelines experience backpressure, unconsumed binlogs accumulate rapidly on the primary database, risking disk exhaustion and forced binlog truncation that permanently corrupts replication state. This production blueprint executes scheduled CDC probe cycles, evaluates captured change event volume against warning and critical thresholds, persists binlog LSN coordinates into Kestra's atomic KV store, and triggers targeted Slack alerts before replication drift breaches operational SLAs.

    ## How it works

    1. The `cdc_lag_sentinel_schedule` trigger initiates an automated audit cycle on a scheduled 5-minute interval (shipped disabled for safe initial deployment).
    2. The `probe_cdc_backlog` task (`io.kestra.plugin.debezium.mysql.Capture`) connects to the target MySQL binary log using a dedicated replica `serverId`, streams accumulated transactions for `included_tables`, records the captured batch to internal storage, and atomically updates the Debezium binlog coordinate checkpoint in Kestra KV store under `state_name`.
    3. The `classify_backlog_severity` task (`io.kestra.plugin.core.debug.Return`) evaluates the probe output: if the probe failed to read the binlog it returns `PROBE_FAILED`; if the captured event volume meets or exceeds `critical_backlog_threshold` it assigns `CRITICAL`; if it exceeds `warning_backlog_threshold` it assigns `WARNING`; otherwise it confirms `HEALTHY`.
    4. The `route_backlog_action` task (`io.kestra.plugin.core.flow.Switch`) branches on the severity classification:
       - `CRITICAL`: Verifies `dry_run` status; if false, dispatches a rich incident notification to Slack (`#data-ops-critical`) with host coordinates, event volume, and remediation steps; if true, logs a dry-run simulation message.
       - `WARNING`: Verifies `dry_run` status and posts an early-warning alert to `#data-ops-alerts` to allow engineering intervention before SLAs breach.
       - `PROBE_FAILED`: Sends an immediate diagnostic page identifying network disconnects, server-id collisions, or invalid replication privileges.
       - `HEALTHY`: Emits an operational confirmation that CDC streaming is keeping pace with transaction volume.
    5. The `audit_sentinel_run` task logs a structured telemetry event recording timestamp, status, event count, and target database metadata for compliance and performance trending.
    6. An unhandled flow failure triggers the `alert_sentinel_flow_failure` handler in the `errors` block, ensuring operational monitoring never fails silently.

    ## What you get

    - Automated detection of MySQL CDC replication lag spikes and consumer stall conditions.
    - Zero external broker dependencies: Debezium reads directly from the binary log without requiring Kafka Connect.
    - Atomic checkpoint persistence in Kestra's built-in KV store, preserving LSN coordinates across executions.
    - Tiered severity classification (`HEALTHY`, `WARNING`, `CRITICAL`, `PROBE_FAILED`) preventing alert fatigue.
    - Safe `dry_run` toggle enabling non-disruptive validation in production environments.
    - Internal storage capture of drained change events (`outputs.cdc_storage_uri`) for forensic replay and inspection.

    ## Who it's for

    - Data Platform Engineers operating real-time CDC ingestion pipelines into warehouses or lakehouses.
    - Database Administrators (DBAs) protecting MySQL primaries from binlog disk saturation.
    - SRE and Infrastructure Teams responsible for data streaming uptime, SLA compliance, and replication reliability.
    - Teams already running `debezium-postgresql-cdc-backlog-sentinel` who need the same
      governance pattern against a MySQL primary: `io.kestra.plugin.debezium.mysql.Capture`
      is a distinct task from the Postgres one (binlog position and `server_id` registration
      instead of a logical replication slot and `pluginName`), and this blueprint adds a
      two-tier WARNING/CRITICAL classification and an explicit `PROBE_FAILED` branch the
      Postgres version does not have.

    ## Why orchestrate this with Kestra

    Standalone cron scripts or external monitoring agents often check replica status via static SQL queries (`Seconds_Behind_Master`), which fail to capture consumer-side lag on custom streaming extractors and cannot persist coordinate offsets across runs. Orchestrating this sentinel within Kestra provides:
    - Native integration with `io.kestra.plugin.debezium.mysql.Capture` for true event-driven binary log extraction.
    - Atomic state management via Kestra's built-in Key-Value Store without maintaining external ZooKeeper or Kafka offset topics.
    - Declarative retry logic, error interceptors, and typed output variables ready for downstream automation.
    - Centralized audit trail with full execution history and payload storage in Kestra UI.

    ## Prerequisites

    - MySQL 5.7+ or 8.0+ server with binary logging enabled in `ROW` format (`binlog_format=ROW`, `binlog_row_image=FULL`).
    - Dedicated MySQL user account granted `REPLICATION SLAVE`, `REPLICATION CLIENT`, `SELECT`, and `RELOAD` privileges.
    - Network connectivity from the Kestra worker to the MySQL port (default `3306`).
    - Incoming Slack Webhook URL configured in Kestra secrets.

    ### Secrets

    - `MYSQL_PASSWORD`: Password for the MySQL replication user account.
    - `SLACK_WEBHOOK_URL`: HTTPS incoming webhook URL for operational notifications.

    ## Quick start

    1. Configure `MYSQL_PASSWORD` and `SLACK_WEBHOOK_URL` in your Kestra namespace secrets.
    2. Import this blueprint into your Kestra instance and verify the default connection inputs (`hostname`, `port`, `username`, `included_tables`).
    3. Click **Execute** with `dry_run: "true"` to perform a non-disruptive validation run against your MySQL server.
    4. Review execution logs and verify the `sentinel_status` output reads `HEALTHY`.
    5. Set `dry_run: "false"` and enable the `cdc_lag_sentinel_schedule` trigger to activate 24/7 automated monitoring.

    ## How to extend

    - **Automated Consumer Auto-Scaling**: Add an execution trigger downstream of `CRITICAL` that scales Kubernetes consumer worker replicas or initiates a Flink CDC task restart.
    - **Dead-Letter Storage Offloading**: Chain an `io.kestra.plugin.aws.s3.Upload` or `io.kestra.plugin.gcp.gcs.Upload` task to archive captured change batches from `outputs.cdc_storage_uri` to cold storage for auditing.
    - **Multi-Table Fanout**: Wrap the probe inside a `io.kestra.plugin.core.flow.Loop` iterating over multiple critical database tables or schemas (`ForEach` is deprecated).
    - **Dynamic Primary Binlog Truncation Guard**: Add a task that queries `SHOW BINARY LOGS` on MySQL and warns if total binlog disk usage exceeds 80% of storage quota.

    ### Outputs

    - `{{ outputs.sentinel_status }}`: `HEALTHY`, `WARNING`, `CRITICAL`, or `PROBE_FAILED`.
    - `{{ outputs.captured_events_count }}`: number of change events drained this probe cycle.
    - `{{ outputs.cdc_storage_uri }}`: internal storage URI of the captured batch, when one table produced records.

    ## Pitfalls

    - `server_id` must be unique across every consumer reading this binlog, including other
      runs of this same flow against the same MySQL server; a collision causes replication
      errors that this gate reports as `PROBE_FAILED` without distinguishing the cause.
    - `included_tables` accepts one fully qualified table pattern; monitoring several tables
      means several scheduled executions of this flow, each with its own `server_id` and
      `state_name`, not one execution with a list.
    - The underlying task's output field for the captured file is `uris`, a map keyed by
      table, not a single `uri`. This blueprint's `cdc_storage_uri` output takes the one
      entry on the assumption that `included_tables` names exactly one table.
    - `dry_run` is a SELECT of the strings `"true"`/`"false"`, not a BOOL, to keep the
      Switch/If comparisons exact string matches.

    ## Links

    - [Kestra Debezium MySQL Plugin Documentation](https://kestra.io/plugins/plugin-debezium-mysql)
    - [Debezium MySQL Connector Documentation](https://debezium.io/documentation/reference/stable/connectors/mysql.html)
    - [Kestra Key-Value Store Documentation](https://kestra.io/docs/concepts/kv-store)
    - [MySQL Binary Log Configuration Guide](https://dev.mysql.com/doc/refman/8.0/en/binary-log.html)
