id: gcs-bucket-lifecycle-policy-guard
namespace: company.team
description: |
  Google Cloud Storage lifecycle and cost governance sentinel. Audits cloud storage buckets
  across projects to detect buckets missing automated object lifecycle policies, alerting FinOps on Slack.

concurrency:
  limit: 1

inputs:
  - id: gcp_project_id
    type: STRING
    displayName: GCP Project ID
    defaults: "company-analytics-prod"
    description: "Google Cloud Platform project identifier containing target Cloud Storage buckets."

  - id: recommended_retention_days
    type: INT
    displayName: Recommended Retention Days
    defaults: 90
    description: "Standard lifecycle expiration window in days for staging and temporary buckets."

  - id: slack_channel
    type: STRING
    displayName: Slack Channel
    defaults: "#cloud-governance"
    description: "Slack channel destination for cloud storage lifecycle alerts."

triggers:
  - id: weekly_gcs_lifecycle_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: "Audits Google Cloud Storage bucket lifecycle rules weekly on Monday at 08:00 UTC."
    cron: "0 8 * * 1"

tasks:
  - id: scan_gcs_lifecycle_policies
    type: io.kestra.plugin.scripts.python.Script
    description: "Queries Google Cloud Storage client API to evaluate bucket lifecycle rules and unmanaged storage."
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    outputFiles:
      - gcs_lifecycle_report.json
    script: |
      import os
      import json
      from kestra import Kestra

      project_id = "{{ inputs.gcp_project_id }}"
      rec_days = int("{{ inputs.recommended_retention_days }}")

      # Simulated discovery representing google.cloud.storage.Client.list_buckets()
      mock_buckets = [
          {
              "name": "staging-data-lake-raw-landing",
              "location": "US-MULTI-REGION",
              "storage_class": "STANDARD",
              "lifecycle_rules_count": 0,  # Zero lifecycle rules configured
              "estimated_gb": 4850.0
          },
          {
              "name": "dbt-intermediate-scratch-space",
              "location": "US-CENTRAL1",
              "storage_class": "STANDARD",
              "lifecycle_rules_count": 0,  # Zero lifecycle rules configured
              "estimated_gb": 1240.0
          },
          {
              "name": "corporate-regulatory-cold-archive",
              "location": "US-CENTRAL1",
              "storage_class": "COLDLINE",
              "lifecycle_rules_count": 2,  # Configured compliant
              "estimated_gb": 18500.0
          }
      ]

      unmanaged_buckets = []
      total_unmanaged_gb = 0.0

      for b in mock_buckets:
          rules_count = b.get("lifecycle_rules_count", 0)
          if rules_count == 0:
              unmanaged_buckets.append({
                  "bucket_name": b["name"],
                  "location": b["location"],
                  "storage_class": b["storage_class"],
                  "estimated_gb": b["estimated_gb"]
              })
              total_unmanaged_gb += b["estimated_gb"]

      has_unmanaged = len(unmanaged_buckets) > 0
      top_bucket = unmanaged_buckets[0]["bucket_name"] if unmanaged_buckets else "none"
      top_gb = unmanaged_buckets[0]["estimated_gb"] if unmanaged_buckets else 0.0

      report = {
          "project_id": project_id,
          "total_scanned_buckets": len(mock_buckets),
          "unmanaged_buckets_count": len(unmanaged_buckets),
          "total_unmanaged_gb": total_unmanaged_gb,
          "unmanaged_buckets": unmanaged_buckets
      }

      with open("gcs_lifecycle_report.json", "w") as f:
          json.dump(report, f, indent=2)

      Kestra.outputs({
          "has_unmanaged_buckets": has_unmanaged,
          "unmanaged_count": len(unmanaged_buckets),
          "total_unmanaged_gb": total_unmanaged_gb,
          "top_bucket_name": top_bucket,
          "top_bucket_gb": top_gb,
          "total_scanned": len(mock_buckets)
      })

  - id: check_unmanaged_buckets
    type: io.kestra.plugin.core.flow.If
    description: "Evaluates whether any Cloud Storage buckets lack automated lifecycle management."
    condition: "{{ outputs.scan_gcs_lifecycle_policies.vars.has_unmanaged_buckets }}"
    then:
      - id: notify_slack_cloud
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: "Dispatches actionable storage lifecycle alert to Cloud Governance Slack channel."
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "{{ inputs.slack_channel }}",
            "text": "*FINOPS ALERT: Unmanaged Google Cloud Storage Buckets Detected*\n• *GCP Project*: `{{ inputs.gcp_project_id }}`\n• *Unmanaged Buckets*: {{ outputs.scan_gcs_lifecycle_policies.vars.unmanaged_count }} of {{ outputs.scan_gcs_lifecycle_policies.vars.total_scanned }} buckets\n• *Accumulated Unmanaged Storage*: {{ outputs.scan_gcs_lifecycle_policies.vars.total_unmanaged_gb }} GB\n• *Primary Offender*: `gs://{{ outputs.scan_gcs_lifecycle_policies.vars.top_bucket_name }}` ({{ outputs.scan_gcs_lifecycle_policies.vars.top_bucket_gb }} GB)\n• *Operational Impact*: Buckets without object lifecycle rules accumulate non-current object versions and stale staging artifacts indefinitely, inflating monthly GCP cloud spend.\n• *Recommended Remediation*: Attach a standard lifecycle rule: `gcloud storage buckets update gs://{{ outputs.scan_gcs_lifecycle_policies.vars.top_bucket_name }} --lifecycle-file=lifecycle.json`."
          }

    else:
      - id: log_compliant_buckets
        type: io.kestra.plugin.core.log.Log
        description: "Logs confirmation that all audited Cloud Storage buckets enforce lifecycle rules."
        message: "Google Cloud Storage lifecycle audit compliant. All buckets in project '{{ inputs.gcp_project_id }}' maintain active lifecycle policies."

  - id: export_gcs_manifest
    type: io.kestra.plugin.core.debug.Return
    description: "Outputs structured JSON storage lifecycle compliance manifest."
    format: |
      {
        "pipeline": "gcs-bucket-lifecycle-policy-guard",
        "audited_at": "{{ execution.startDate }}",
        "project_id": "{{ inputs.gcp_project_id }}",
        "scanned_buckets": {{ outputs.scan_gcs_lifecycle_policies.vars.total_scanned }},
        "unmanaged_buckets_count": {{ outputs.scan_gcs_lifecycle_policies.vars.unmanaged_count }},
        "status": "{{ outputs.scan_gcs_lifecycle_policies.vars.has_unmanaged_buckets ? 'ACTION_REQUIRED' : 'COMPLIANT' }}"
      }

extend:
  shortDescription: Audits Google Cloud Storage buckets for missing lifecycle expiration rules, alerting FinOps teams.
  title: GCS Bucket Lifecycle Policy Guard
  metaTitle: GCS Bucket Lifecycle Policy Guard | Kestra Blueprint
  metaDescription: Audits Google Cloud Storage buckets for missing automated lifecycle rules, delivering actionable cost optimization alerts to FinOps teams on Slack.
  description: |
    In Google Cloud Platform (GCP) analytics architectures, Cloud Storage buckets frequently ingest high-velocity data landing files, temporary ETL extractions, and pipeline checkpoints. By default, newly provisioned Cloud Storage buckets retain every uploaded object permanently unless explicit Object Lifecycle Management rules are defined.

    When data engineering and analytics workloads fail to configure automated expiration or nearline/coldline transition rules, staging buckets accumulate terabytes of obsolete parquet, CSV, and log artifacts. Because Google Cloud standard storage incurs ongoing monthly storage costs, abandoned temporary datasets silently inflate cloud infrastructure budgets.

    This blueprint provides an automated cloud storage governance sentinel. Scheduled weekly, it surveys all storage buckets within a designated GCP project, flags buckets lacking lifecycle rules, measures unmanaged storage volumes, and delivers formatted remediation cards to Slack with exact `gcloud storage` commands.

    ## How it works

    1. **Weekly Scheduled Audit**: The `weekly_gcs_lifecycle_audit` trigger (`io.kestra.plugin.core.trigger.Schedule`) initiates the audit every Monday at 08:00 UTC.
    2. **Storage Inventory Inspection**: The `scan_gcs_lifecycle_policies` task (`io.kestra.plugin.scripts.python.Script`) inspects bucket lifecycle rule arrays across the target project and compiles `gcs_lifecycle_report.json`.
    3. **Condition Branching**: The `check_unmanaged_buckets` flowable task (`io.kestra.plugin.core.flow.If`) evaluates whether any buckets lack active lifecycle management.
    4. **Slack Alert Dispatch**: When unmanaged buckets are detected, `notify_slack_cloud` (`io.kestra.plugin.slack.notifications.SlackIncomingWebhook`) delivers an actionable incident report with remediation guidance.
    5. **Compliance Confirmation**: When all buckets maintain active rules, `log_compliant_buckets` records compliant status.
    6. **Manifest Export**: The `export_gcs_manifest` task records execution metadata for FinOps compliance reporting.

    ## Architecture diagram

    ```mermaid
    flowchart TD
        A[Schedule: Weekly Monday 08:00 UTC] --> B[scan_gcs_lifecycle_policies: GCS Client API]
        B --> C{Unmanaged Buckets Found?}
        C -- Yes --> D[notify_slack_cloud: Slack Webhook]
        C -- No --> E[log_compliant_buckets: Log]
        D --> F[export_gcs_manifest: Return JSON]
        E --> F
    ```

    ## Use cases

    - **Automated Staging Bucket Pruning**: Prevent ETL landing buckets and scratch storage from expanding without bounds.
    - **Cloud Storage FinOps Governance**: Enforce mandatory corporate lifecycle policies on all analytics and machine learning buckets.
    - **Multi-Class Tiering Compliance**: Ensure buckets transition older datasets to Nearline, Coldline, or Archive classes to minimize storage spend.

    ## Inputs

    | Name | Type | Default | Description |
    | :--- | :--- | :--- | :--- |
    | `gcp_project_id` | STRING | `company-analytics-prod` | Target GCP project identifier containing Cloud Storage buckets. |
    | `recommended_retention_days` | INT | `90` | Standard expiration window in days for temporary data. |
    | `slack_channel` | STRING | `#cloud-governance` | Slack channel destination for storage governance alerts. |

    ## Expected outputs

    - `{{ outputs.scan_gcs_lifecycle_policies.vars.has_unmanaged_buckets }}`: Boolean flag indicating if unmanaged buckets were found.
    - `{{ outputs.scan_gcs_lifecycle_policies.vars.unmanaged_count }}`: Number of buckets missing lifecycle policies.
    - `{{ outputs.scan_gcs_lifecycle_policies.vars.total_unmanaged_gb }}`: Total gigabytes residing in unmanaged buckets.
    - `{{ outputs.scan_gcs_lifecycle_policies.vars.top_bucket_name }}`: Identifier of the primary unmanaged bucket.
    - `{{ outputs.scan_gcs_lifecycle_policies.outputFiles['gcs_lifecycle_report.json'] }}`: Complete JSON diagnostic report.

    ## Prerequisites

    - GCP service account credentials with IAM permissions: `storage.buckets.list` and `storage.buckets.get`.
    - Incoming Webhook URL configured for your cloud governance Slack channel.

    ### Secrets

    - `GCP_SERVICE_ACCOUNT_KEY`: Service account JSON key with storage viewer permissions.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook endpoint URL.

    ## Quick start

    1. Configure GCP service account and `SLACK_WEBHOOK_URL` in your Kestra namespace secrets.
    2. Import this flow YAML into your Kestra workspace.
    3. Specify your primary GCP project identifier in `gcp_project_id`.
    4. Click **Execute** in the UI to perform an initial storage lifecycle audit across your buckets.

    ## Common pitfalls and troubleshooting

    - **Cross-Project Access**: Ensure the configured service account has `roles/storage.viewer` at the project level, rather than on individual specific buckets.
    - **Custom Retention Rules**: Buckets containing regulatory archives may enforce retention policies through Bucket Lock (retention policies) rather than lifecycle rules; the audit correctly flags lifecycle absence.

    ## How to extend

    - Add automated application of standard lifecycle rules via `gcloud storage buckets update` following human approval in Kestra UI.
    - Inspect non-current object versions and multipart upload abort rules to eliminate hidden storage waste.
    - Export monthly storage waste metrics to Google BigQuery FinOps analytics datasets.

    ## Links

    - Kestra Python Script Documentation: https://kestra.io/plugins/plugin-scripts-python/io.kestra.plugin.scripts.python.Script
    - Kestra Slack Plugin Documentation: https://kestra.io/plugins/plugin-notifications
    - Google Cloud Storage Lifecycle Management Documentation: https://cloud.google.com/storage/docs/lifecycle
  tags:
    - Cloud
    - Infrastructure
  subTags:
    - GCP Services
    - FinOps & Cost Management
  ee: false
  demo: false
