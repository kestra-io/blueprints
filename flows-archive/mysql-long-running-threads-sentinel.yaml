id: mysql-long-running-threads-sentinel
namespace: company.database

inputs:
  - id: mysql_host
    type: STRING
    defaults: "mysql.internal"
    description: Hostname of the MySQL database server.
  - id: mysql_port
    type: INT
    defaults: 3306
    description: Port of the MySQL database server.
  - id: max_query_duration_seconds
    type: INT
    defaults: 120
    description: "Maximum allowable query execution time in seconds before alerting (default 120s)."

tasks:
  - id: inspect_running_threads
    type: io.kestra.plugin.jdbc.mysql.Query
    url: "jdbc:mysql://{{ inputs.mysql_host }}:{{ inputs.mysql_port }}/information_schema"
    username: "{{ secret('MYSQL_USER') }}"
    password: "{{ secret('MYSQL_PASSWORD') }}"
    sql: |
      SELECT ID, USER, HOST, DB, COMMAND, TIME, STATE, LEFT(INFO, 150) AS QUERY_SNIPPET
      FROM information_schema.PROCESSLIST
      WHERE COMMAND != 'Sleep'
        AND TIME > {{ inputs.max_query_duration_seconds }}
        AND USER != 'system user'
      ORDER BY TIME DESC
      LIMIT 10;
    fetchType: FETCH

  - id: evaluate_thread_backlog
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.inspect_running_threads.size > 0 }}"
    then:
      - id: notify_dba_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#dba-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 MySQL Long-Running Query Alert",
                "text": "Detected {{ outputs.inspect_running_threads.size }} query execution(s) on {{ inputs.mysql_host }} running longer than {{ inputs.max_query_duration_seconds }} seconds. Risk of row lock contention and connection pool exhaustion.",
                "footer": "Kestra Database Sentinel • MySQL"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#dba-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ MySQL Sentinel Failure",
            "text": "Failed to query processlist on MySQL instance {{ inputs.mysql_host }}.",
            "footer": "Kestra Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/5 * * * *"
    disabled: true

extend:
  metaDescription: "Audits MySQL processlist for long-running unindexed queries and blocking transactions."
  metaTitle: MySQL Long Running Active Threads and Locks Sentinel with Kestra
  ee: false
  demo: false
  title: MySQL Long Running Active Threads and Locks Sentinel
  shortDescription: Audits MySQL processlist for long-running unindexed queries and blocking transactions.
  description: |
    ## How it works
    This workflow connects directly to MySQL via JDBC (`io.kestra.plugin.jdbc.mysql.Query`) to audit active worker threads in `information_schema.PROCESSLIST`. It filters out idle sleep connections and identifies running transactions executing for longer than `max_query_duration_seconds`. Unindexed full table scans, suboptimal joins, or deadlocked transactions hold row locks and monopolize database CPU, quickly causing connection pool exhaustion (`Too many connections`). This sentinel flags runaway queries and delivers immediate notifications with query snippets to DBAs.

    ## What you get
    - Real-time detection of runaway queries and transactional locking.
    - Identification of slow queries before connection pools saturate.
    - Contextual Slack alerts detailing execution time and query text.

    ## Who it's for
    - Database Administrators overseeing mission-critical MySQL and MariaDB clusters.
    - Backend Engineers debugging query latency and transaction deadlocks.
    - Site Reliability Engineers ensuring web application database availability.

    ## Why orchestrate this with Kestra
    - **Native JDBC Integration**: Connects securely without installing third-party agent software.
    - **High-Frequency Scheduling**: Runs lightweight health checks every few minutes.
    - **Audit Trail**: Logs all execution incidents inside Kestra for post-mortem analysis.

    ## Prerequisites
    - MySQL database instance accessible over network.
    - Dedicated read-only monitoring user with `PROCESS` privilege.
    - Secrets `MYSQL_USER`, `MYSQL_PASSWORD`, and `SLACK_WEBHOOK` configured.

    ## Quick start
    1. Import this blueprint into your Kestra workspace.
    2. Configure `MYSQL_USER`, `MYSQL_PASSWORD`, and `SLACK_WEBHOOK` secrets.
    3. Specify `mysql_host` and `max_query_duration_seconds`.
    4. Enable the schedule trigger to activate automatic thread monitoring.

    ## How to extend
    - Add an automated query termination task (`KILL <thread_id>`) for queries running over 30 minutes.
    - Cross-reference with `performance_schema.data_locks` to identify blocking transaction trees.
    - Archive slow query details into cold storage for performance tuning reviews.

    ## Links
    - [MySQL PROCESSLIST Documentation](https://dev.mysql.com/doc/refman/8.0/en/information-schema-processlist-table.html)
    - [Kestra MySQL Plugin](https://kestra.io/plugins/plugin-jdbc-mysql)
    - [Kestra Slack Notifications](https://kestra.io/plugins/plugin-slack)
  tags:
    - Data
    - Infrastructure
  subTags:
    - ELT & Data Landing
    - Day 2 Operations
