id: aws-ec2-unattached-elastic-ip-auditor
namespace: company.team
description: |
  Automated AWS Cloud FinOps auditor that scans Amazon EC2 Elastic IP addresses across regions,
  detects idle unallocated public IPs incurring hourly billing charges, and alerts DevOps on Slack.

concurrency:
  limit: 1

inputs:
  - id: aws_region
    type: STRING
    displayName: AWS Region
    defaults: "us-east-1"
    description: "Target AWS Region to inspect for unattached Elastic IP addresses."

  - id: idle_eip_cost_hourly_usd
    type: FLOAT
    displayName: Hourly Cost Per Idle EIP
    defaults: 0.005
    description: "Standard AWS hourly fee for unattached or idle public IPv4 addresses."

  - id: slack_channel
    type: STRING
    displayName: Slack Channel
    defaults: "#finops-alerts"
    description: "Slack channel destination for cloud waste and FinOps advisory notifications."

triggers:
  - id: weekly_eip_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: "Executes Elastic IP audit weekly on Monday at 07:00 UTC."
    cron: "0 7 * * 1"

tasks:
  - id: scan_elastic_ips
    type: io.kestra.plugin.scripts.python.Script
    description: "Connects to AWS EC2 API via boto3 and filters Elastic IPs lacking an active instance or network interface association."
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install boto3
    env:
      AWS_ACCESS_KEY_ID: "{{ secret('AWS_ACCESS_KEY_ID') }}"
      AWS_SECRET_ACCESS_KEY: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
      AWS_DEFAULT_REGION: "{{ inputs.aws_region }}"
    outputFiles:
      - eip_audit_report.json
    script: |
      import os
      import json
      import boto3
      from kestra import Kestra

      ec2 = boto3.client("ec2")
      response = ec2.describe_addresses()

      addresses = response.get("Addresses", [])
      unattached = []
      hourly_rate = float("{{ inputs.idle_eip_cost_hourly_usd }}")

      for addr in addresses:
          allocation_id = addr.get("AllocationId", "N/A")
          public_ip = addr.get("PublicIp", "N/A")
          instance_id = addr.get("InstanceId")
          eni_id = addr.get("NetworkInterfaceId")

          # An Elastic IP is unattached if neither instance_id nor network_interface_id is set
          if not instance_id and not eni_id:
              unattached.append({
                  "allocation_id": allocation_id,
                  "public_ip": public_ip,
                  "domain": addr.get("Domain", "vpc"),
                  "monthly_wasted_usd": round(hourly_rate * 730, 2)
              })

      has_unattached = len(unattached) > 0
      total_monthly_waste = round(len(unattached) * hourly_rate * 730, 2)

      report = {
          "region": os.environ.get("AWS_DEFAULT_REGION", "us-east-1"),
          "total_eips_scanned": len(addresses),
          "unattached_count": len(unattached),
          "total_monthly_waste_usd": total_monthly_waste,
          "unattached_ips": unattached,
          "has_unattached": has_unattached
      }

      with open("eip_audit_report.json", "w", encoding="utf-8") as f:
          json.dump(report, f, indent=2)

      Kestra.outputs({
          "has_unattached": has_unattached,
          "unattached_count": len(unattached),
          "total_monthly_waste_usd": total_monthly_waste,
          "top_unattached_ip": unattached[0]["public_ip"] if unattached else "None",
          "top_allocation_id": unattached[0]["allocation_id"] if unattached else "None"
      })

  - id: evaluate_unattached_eips
    type: io.kestra.plugin.core.flow.If
    description: "Evaluates if any unallocated Elastic IP addresses were detected."
    condition: "{{ outputs.scan_elastic_ips.vars.has_unattached }}"
    then:
      - id: notify_slack_finops_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: "Dispatches actionable FinOps remediation advisory to Slack."
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "{{ inputs.slack_channel }}",
            "text": "*AWS Cloud FinOps Alert: Unattached Elastic IPs Detected*\n• *AWS Region*: `{{ inputs.aws_region }}`\n• *Unallocated Public IPs Count*: {{ outputs.scan_elastic_ips.vars.unattached_count }}\n• *Estimated Monthly Waste*: ~${{ outputs.scan_elastic_ips.vars.total_monthly_waste_usd }} USD\n• *Primary Offender*: IP `{{ outputs.scan_elastic_ips.vars.top_unattached_ip }}` (Allocation ID: `{{ outputs.scan_elastic_ips.vars.top_allocation_id }}`)\n• *Operational Impact*: AWS bills hourly charges for all allocated IPv4 addresses not associated with running EC2 instances or ENIs.\n• *Recommended Remediation*: Release unused addresses via AWS Console or run `aws ec2 release-address --allocation-id {{ outputs.scan_elastic_ips.vars.top_allocation_id }}` to eliminate recurring charges."
          }

    else:
      - id: log_clean_eip_status
        type: io.kestra.plugin.core.log.Log
        description: "Logs confirmation of fully utilized Elastic IP allocations."
        message: "AWS EC2 Elastic IP audit compliant for {{ inputs.aws_region }}. Zero unattached or idle public IP addresses detected."

  - id: export_eip_manifest
    type: io.kestra.plugin.core.debug.Return
    description: "Outputs structured JSON execution manifest for FinOps historical reporting."
    format: |
      {
        "pipeline": "aws-ec2-unattached-elastic-ip-auditor",
        "audited_at": "{{ execution.startDate }}",
        "region": "{{ inputs.aws_region }}",
        "unattached_count": {{ outputs.scan_elastic_ips.vars.unattached_count }},
        "monthly_waste_usd": {{ outputs.scan_elastic_ips.vars.total_monthly_waste_usd }},
        "status": "{{ outputs.scan_elastic_ips.vars.has_unattached ? 'IDLE_IPS_DETECTED' : 'OPTIMIZED' }}"
      }

extend:
  shortDescription: Audits Amazon EC2 Elastic IPs across regions to detect idle unattached public IPs incurring hourly billing charges, alerting Slack.
  title: AWS EC2 Unattached Elastic IP FinOps Auditor
  metaTitle: AWS EC2 Unattached Elastic IP Auditor | Kestra Blueprint
  metaDescription: Audits AWS EC2 Elastic IPs to detect idle unattached public IPv4 addresses incurring hourly charges, alerting FinOps teams on Slack.
  description: |
    In Amazon Web Services (AWS), public IPv4 addresses are scarce resources subject to hourly billing fees. While an Elastic IP (EIP) associated with a running Amazon EC2 instance is typically provided without surcharge, any allocated Elastic IP that remains unattached or associated with a stopped instance incurs a continuous hourly idle fee ($0.005 per hour per IP).

    In dynamic cloud environments where developer environments, staging clusters, or temporary NAT gateways are spun up and torn down, engineers frequently delete instances while forgetting to release the associated Elastic IP addresses. Over dozens of developer accounts and regions, hundreds of orphaned Elastic IPs silently waste thousands of dollars of annual cloud budget.

    This blueprint implements an automated Cloud FinOps auditor that scans the Amazon EC2 `describe_addresses` API on a weekly schedule. It filters for public IPs lacking active instance or network interface (ENI) attachments, calculates accumulated monthly financial waste, and delivers an actionable remediation report directly to your engineering team's Slack channel with exact `aws ec2 release-address` CLI commands.

    ## How it works

    1. **Scheduled Audit Trigger**: The `weekly_eip_audit` trigger (`io.kestra.plugin.core.trigger.Schedule`) executes every Monday morning at 07:00 UTC.
    2. **Boto3 API Inspection**: The `scan_elastic_ips` task (`io.kestra.plugin.scripts.python.Script`) calls AWS EC2 `describe_addresses`, verifies whether `InstanceId` or `NetworkInterfaceId` is present, and exports `eip_audit_report.json`.
    3. **Condition Branching**: The `evaluate_unattached_eips` flowable task (`io.kestra.plugin.core.flow.If`) evaluates whether any unattached Elastic IPs were discovered.
    4. **Slack Alert Dispatch**: When idle addresses are detected, `notify_slack_finops_team` (`io.kestra.plugin.slack.notifications.SlackIncomingWebhook`) delivers an actionable triage card detailing IP addresses, allocation IDs, and estimated monthly dollar waste.
    5. **Compliant Logging**: When all Elastic IPs are actively attached, `log_clean_eip_status` records nominal status in execution logs.
    6. **Audit Manifest**: The `export_eip_manifest` task records execution metadata for cloud cost tracking.

    ## What you get

    - Automated discovery of orphaned public IPv4 addresses across AWS regions.
    - Exact monthly dollar waste estimation calculated automatically.
    - Actionable AWS CLI commands prepared for immediate resource release.
    - Zero production disruption via non-intrusive read-only API calls.

    ## Who it is for

    - Cloud FinOps practitioners optimizing multi-account AWS spending.
    - DevOps and Cloud Engineers managing Amazon VPC networking and public subnets.
    - Site Reliability Engineers maintaining infrastructure cleanliness.

    ## Why orchestrate this with Kestra

    Building ad-hoc Lambda functions for cloud governance requires managing serverless deployments, IAM permissions, and external webhook libraries. Kestra provides declarative, observable orchestration: it securely executes containerized Python tasks, calculates financial metrics, branches conditionally, and dispatches structured alerts with full execution history.

    ## Inputs

    | Name | Type | Default | Description |
    | :--- | :--- | :--- | :--- |
    | `aws_region` | STRING | `us-east-1` | AWS region to inspect for unattached Elastic IPs. |
    | `idle_eip_cost_hourly_usd` | FLOAT | `0.005` | Standard AWS hourly fee per idle public IPv4 address. |
    | `slack_channel` | STRING | `#finops-alerts` | Slack channel destination for alerts. |

    ## Expected outputs

    - `{{ outputs.scan_elastic_ips.vars.has_unattached }}`: Boolean flag indicating if unattached IPs were detected.
    - `{{ outputs.scan_elastic_ips.vars.unattached_count }}`: Total count of idle Elastic IPs found.
    - `{{ outputs.scan_elastic_ips.vars.total_monthly_waste_usd }}`: Estimated monthly dollar waste.
    - `{{ outputs.scan_elastic_ips.outputFiles['eip_audit_report.json'] }}`: Complete JSON diagnostic report.

    ## Prerequisites

    - An AWS IAM user or role with permissions: `ec2:DescribeAddresses`.
    - AWS credentials configured in Kestra secrets.
    - Slack Incoming Webhook configured for your FinOps alerting channel.

    ### Secrets

    - `AWS_ACCESS_KEY_ID`: AWS IAM access key ID.
    - `AWS_SECRET_ACCESS_KEY`: AWS IAM secret access key.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook endpoint URL.

    ## Quick start

    1. Configure `AWS_ACCESS_KEY_ID`, `AWS_SECRET_ACCESS_KEY`, and `SLACK_WEBHOOK_URL` in your Kestra namespace secrets.
    2. Import this flow YAML into your Kestra instance.
    3. Click **Execute** in the UI to run an initial regional scan.
    4. Review execution outputs to inspect unattached public IP allocations and monthly cost estimates.

    ## Common pitfalls and troubleshooting

    - **BYOIP & Inactive ENIs**: Elastic IPs assigned to detached Elastic Network Interfaces (ENIs) still incur idle charges; verify that attached ENIs belong to running instances.
    - **Multi-Region Coverage**: Elastic IPs are regional resources; duplicate this flow or configure a multi-region loop using `io.kestra.plugin.core.flow.EachSequential` to scan all active AWS regions.
    - **Releasing EIPs**: Releasing an Elastic IP returns it to the AWS public pool; verify that unattached IPs are not hardcoded in external customer firewall allowlists before release.

    ## How to extend

    - Add `io.kestra.plugin.core.flow.EachParallel` to iterate through all active AWS regions (`us-west-2`, `eu-west-1`, etc.) in parallel.
    - Integrate automated release execution with manual approval gates using `io.kestra.plugin.core.flow.Pause`.
    - Automatically tag offending resources in AWS with `FinOps:ActionRequired`.

    ## Links

    - Kestra Python Script Documentation: https://kestra.io/plugins/plugin-scripts-python/io.kestra.plugin.scripts.python.Script
    - Kestra Slack Plugin Documentation: https://kestra.io/plugins/plugin-notifications
    - AWS EC2 Elastic IP Pricing Documentation: https://aws.amazon.com/ec2/pricing/on-demand/#Public_IPv4_Address_Pricing
  tags:
    - Cloud
    - Infrastructure
  subTags:
    - Day 2 Operations
    - FinOps & Cost Management
  ee: false
  demo: false
