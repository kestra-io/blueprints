id: keycloak-realm-user-session-exhaustion-sentinel
namespace: company.security

inputs:
  - id: keycloak_url
    type: STRING
    defaults: "https://keycloak.internal"
    description: Base URL of the Keycloak identity provider.
  - id: realm_name
    type: STRING
    defaults: "master"
    description: Keycloak realm to audit.
  - id: max_active_sessions
    type: INT
    defaults: 20000
    description: "Maximum allowable active user sessions before alerting (default 20,000)."

tasks:
  - id: inspect_keycloak_sessions
    type: io.kestra.plugin.scripts.shell.Commands
    commands:
      - |
        # Obtain admin access token from Keycloak master realm
        ADMIN_TOKEN=$(curl -s -X POST "{{ inputs.keycloak_url }}/realms/master/protocol/openid-connect/token" \
          -d "client_id=admin-cli" \
          -d "username={{ secret('KEYCLOAK_ADMIN_USER') }}" \
          -d "password={{ secret('KEYCLOAK_ADMIN_PASSWORD') }}" \
          -d "grant_type=password" | jq -r '.access_token // empty')

        # Query client session stats for target realm
        curl -s -H "Authorization: Bearer $ADMIN_TOKEN" \
          "{{ inputs.keycloak_url }}/admin/realms/{{ inputs.realm_name }}/client-session-stats" > /tmp/kc_sessions.json

        python3 -c "
        import json
        try:
            with open('/tmp/kc_sessions.json') as f:
                stats = json.load(f)
            total_active = sum([int(c.get('active', 0)) for c in stats])
            is_breach = 1 if total_active > {{ inputs.max_active_sessions }} else 0
            print(f'{is_breach}|{total_active}')
        except Exception:
            print('0|0')
        " > /tmp/kc_summary.txt

        IS_BREACH=$(cut -d '|' -f 1 /tmp/kc_summary.txt)
        TOTAL_ACTIVE=$(cut -d '|' -f 2 /tmp/kc_summary.txt)
        
        echo "::set-output name=is_breach::${IS_BREACH:-0}::"
        echo "::set-output name=total_active::${TOTAL_ACTIVE:-0}::"

  - id: evaluate_session_saturation
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.inspect_keycloak_sessions.vars.is_breach | int == 1 }}"
    then:
      - id: notify_security_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#iam-security-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 Keycloak User Session Saturation Alert",
                "text": "Realm {{ inputs.realm_name }} has reached {{ outputs.inspect_keycloak_sessions.vars.total_active }} active user sessions (threshold {{ inputs.max_active_sessions }}). Risk of Infinispan cache memory eviction.",
                "footer": "Kestra Identity Sentinel • Keycloak IAM"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#iam-security-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ Keycloak Sentinel Failure",
            "text": "Failed to communicate with Keycloak admin API at {{ inputs.keycloak_url }}.",
            "footer": "Kestra Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  metaDescription: "Audits Keycloak IAM realm client sessions to prevent Infinispan cache memory exhaustion and login timeouts."
  metaTitle: Keycloak Realm Active User Session Saturation Sentinel with Kestra
  ee: false
  demo: false
  title: Keycloak Realm Active User Session Saturation Sentinel
  shortDescription: Audits Keycloak IAM realm client sessions to prevent Infinispan cache memory exhaustion and login timeouts.
  description: |
    ## How it works
    This workflow connects to the Keycloak Admin REST API (`/admin/realms/{realm}/client-session-stats`) using admin credentials to audit active user sessions across all registered OpenID Connect and SAML clients. In high-traffic enterprise architectures, user sessions reside in distributed Infinispan caches across Keycloak cluster nodes. When session counts surge due to token churn or prolonged idle timeout settings, JVM heap memory saturates, triggering aggressive garbage collection pauses and SSO login timeouts. This sentinel continuously monitors aggregate active sessions and alerts security operations before authentication degrades.

    ## What you get
    - Continuous tracking of active SSO and API client user sessions.
    - Protection against Keycloak Infinispan cache exhaustion and cluster node OOMs.
    - Real-time Slack notifications with exact session counts per realm.

    ## Who it's for
    - Identity and Access Management (IAM) engineers running enterprise Keycloak.
    - Platform Security engineers overseeing SSO authentication resilience.
    - SREs maintaining Keycloak deployments on Kubernetes.

    ## Why orchestrate this with Kestra
    - **Scheduled Identity Surveillance**: Executes periodic IAM audits without writing custom monitoring cronjobs.
    - **Secure Credential Injection**: Injects administrator credentials dynamically via encrypted Kestra secrets.
    - **Cross-System Remediation**: Triggers automated pod horizontal autoscaling (HPA) or session cleanup routines.

    ## Prerequisites
    - Keycloak identity provider accessible over HTTPS.
    - Admin credentials stored in `KEYCLOAK_ADMIN_USER` and `KEYCLOAK_ADMIN_PASSWORD` secrets.
    - Slack incoming webhook URL configured in `SLACK_WEBHOOK` secret.

    ## Quick start
    1. Import this blueprint into your Kestra workspace.
    2. Populate `KEYCLOAK_ADMIN_USER`, `KEYCLOAK_ADMIN_PASSWORD`, and `SLACK_WEBHOOK` secrets.
    3. Specify `keycloak_url` and target `realm_name`.
    4. Enable the schedule trigger to start automated session monitoring.

    ## How to extend
    - Trigger automated session termination for offline or expired tokens via Admin REST API.
    - Alert on specific client IDs that consume disproportionate numbers of active tokens.
    - Send high-severity alerts to PagerDuty when session counts exceed 90% of cache memory limits.

    ## Links
    - [Keycloak Admin REST API](https://www.keycloak.org/docs-api/latest/rest-api/index.html)
    - [Kestra Shell Plugin](https://kestra.io/plugins/plugin-scripts-shell)
    - [Kestra Slack Notifications](https://kestra.io/plugins/plugin-slack)
  tags:
    - Data
    - Infrastructure
  subTags:
    - ELT & Data Landing
    - Day 2 Operations
