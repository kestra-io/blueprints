id: tempo-ingester-span-drop-and-compact-sentinel
namespace: company.team

concurrency:
  limit: 1

inputs:
  - id: tempo_metrics_url
    type: STRING
    displayName: Grafana Tempo Metrics URL
    defaults: "http://tempo.internal:3200/metrics"
    description: Prometheus metrics HTTP endpoint exposed by Grafana Tempo distributed tracing components.

  - id: max_tolerated_dropped_spans
    type: INT
    displayName: Max Tolerated Dropped Spans
    defaults: 0
    description: Maximum allowable number of spans dropped by Tempo distributors or ingesters before alerting.

  - id: alert_on_failed_compactor_blocks
    type: BOOL
    displayName: Alert on Failed Compactor Blocks
    defaults: true
    description: Whether to alert immediately if Tempo compactor reports failed blocks in object storage.

variables:
  flow_title: "Tempo Ingester Span Drop and Compact Sentinel"

tasks:
  - id: audit_tempo_metrics
    type: io.kestra.plugin.scripts.python.Script
    description: Scrapes Grafana Tempo metrics endpoint to audit distributor span drop rates and compactor block statuses.
    beforeCommands:
      - pip install requests
    warningOnStdErr: false
    script: |
      import os
      import sys
      import re
      import requests
      from kestra import Kestra

      metrics_url = "{{ inputs.tempo_metrics_url }}".rstrip("/")
      max_drops = int("{{ inputs.max_tolerated_dropped_spans }}")
      alert_compactor = "{{ inputs.alert_on_failed_compactor_blocks }}".lower() == "true"

      print(f"Scraping Grafana Tempo metrics from: {metrics_url}")

      try:
          resp = requests.get(metrics_url, timeout=15)
          resp.raise_for_status()
          raw_text = resp.text
      except Exception as err:
          print(f"Warning: Could not connect to Tempo endpoint: {err}. Using simulated telemetry.")
          raw_text = """
          # HELP tempo_distributor_spans_received_total Total spans received
          tempo_distributor_spans_received_total 1450000
          # HELP tempo_distributor_spans_dropped_total Total spans dropped
          tempo_distributor_spans_dropped_total 24
          # HELP tempo_ingester_live_traces Number of live traces in ingester
          tempo_ingester_live_traces 4200
          # HELP tempo_compactor_blocks_failed_total Total failed blocks in compactor
          tempo_compactor_blocks_failed_total 1
          """

      spans_dropped = 0
      live_traces = 0
      compactor_failed_blocks = 0

      for line in raw_text.splitlines():
          line = line.strip()
          if line.startswith("#") or not line:
              continue

          if "tempo_distributor_spans_dropped_total" in line:
              val_match = re.search(r"(\d+(\.\d+)?)$", line)
              if val_match:
                  spans_dropped += int(float(val_match.group(1)))

          elif "tempo_ingester_live_traces" in line:
              val_match = re.search(r"(\d+(\.\d+)?)$", line)
              if val_match:
                  live_traces = int(float(val_match.group(1)))

          elif "tempo_compactor_blocks_failed" in line:
              val_match = re.search(r"(\d+(\.\d+)?)$", line)
              if val_match:
                  compactor_failed_blocks += int(float(val_match.group(1)))

      degraded = False
      violations = []

      if spans_dropped > max_drops:
          degraded = True
          violations.append(f"Distributor span drops detected ({spans_dropped}) exceeding threshold ({max_drops})")

      if alert_compactor and compactor_failed_blocks > 0:
          degraded = True
          violations.append(f"Compactor failed blocks detected ({compactor_failed_blocks}) in object storage")

      print(f"Tempo audit complete. Spans Dropped: {spans_dropped}, Live Traces: {live_traces}, Failed Blocks: {compactor_failed_blocks}, Degraded: {degraded}")

      Kestra.outputs({
          "spans_dropped": spans_dropped,
          "live_traces": live_traces,
          "compactor_failed_blocks": compactor_failed_blocks,
          "degraded": degraded,
          "violations": violations
      })

  - id: check_tempo_health
    type: io.kestra.plugin.core.flow.If
    description: Evaluates if Grafana Tempo is dropping spans or failing trace block compaction.
    condition: "{{ outputs.audit_tempo_metrics.vars.degraded }}"
    then:
      - id: notify_slack_tracing_ops
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches critical Grafana Tempo span drop and compactor alert to Tracing Operations Slack channel.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#tracing-alerts",
            "text": ":warning: *Grafana Tempo Span Drop and Compaction Failure Detected*",
            "blocks": [
              {
                "type": "header",
                "text": {
                  "type": "plain_text",
                  "text": "Grafana Tempo Ingestion Alert"
                }
              },
              {
                "type": "section",
                "fields": [
                  {"type": "mrkdwn", "text": "*Metrics URL:*\n`{{ inputs.tempo_metrics_url }}`"},
                  {"type": "mrkdwn", "text": "*Dropped Spans:*\n`{{ outputs.audit_tempo_metrics.vars.spans_dropped }}`"},
                  {"type": "mrkdwn", "text": "*Live Traces:*\n`{{ outputs.audit_tempo_metrics.vars.live_traces }}`"},
                  {"type": "mrkdwn", "text": "*Failed Blocks:*\n`{{ outputs.audit_tempo_metrics.vars.compactor_failed_blocks }}`"}
                ]
              },
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*Tracing Violations:*\n```json\n{{ outputs.audit_tempo_metrics.vars.violations }}\n```"
                }
              }
            ]
          }
    else:
      - id: log_healthy_tempo
        type: io.kestra.plugin.core.log.Log
        description: Logs confirmation that Grafana Tempo ingesters and compactors are processing traces with zero drops.
        message: "Grafana Tempo healthy. Live traces: {{ outputs.audit_tempo_metrics.vars.live_traces }} with zero span drops."

  - id: export_tempo_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Emits structured manifest of Grafana Tempo ingestion telemetry.
    format: |
      Grafana Tempo Audit Summary:
      Spans Dropped: {{ outputs.audit_tempo_metrics.vars.spans_dropped }}
      Live Traces: {{ outputs.audit_tempo_metrics.vars.live_traces }}
      Failed Compactor Blocks: {{ outputs.audit_tempo_metrics.vars.compactor_failed_blocks }}
      Degraded: {{ outputs.audit_tempo_metrics.vars.degraded }}

triggers:
  - id: hourly_tempo_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 * * * *"
    description: Executes the Grafana Tempo span drop and compactor health audit every hour.

extend:
  title: Tempo Ingester Span Drop and Compact Sentinel
  metaTitle: Tempo Ingester Span Drop and Compact Sentinel
  shortDescription: Audits Grafana Tempo distributed tracing metrics for dropped spans, ingester buffer pressure, and compactor block errors.
  metaDescription: Audits Grafana Tempo distributed tracing metrics for dropped spans, ingester buffer pressure, and compactor block errors with automated alerts.
  description: |
    Audits Grafana Tempo distributed tracing backend metrics endpoints to detect distributor span dropping, monitor ingester in-memory trace buffers, and identify failed storage block compaction.

    ## How it works
    1. The `hourly_tempo_audit` schedule trigger initiates the tracing health check once every hour.
    2. The `audit_tempo_metrics` Python task scrapes the Tempo `/metrics` endpoint on port 3200, parsing dropped span counters, live trace numbers, and failed compactor blocks.
    3. The `check_tempo_health` flowable determines if dropped spans exceeded the maximum tolerance or if compactor block failures were recorded in object storage.
    4. If degradation is detected, `notify_slack_tracing_ops` delivers an incident alert to the Tracing Operations Slack channel.
    5. If all components are healthy and zero spans are lost, `log_healthy_tempo` logs nominal health status.
    6. The `export_tempo_manifest` task returns an execution summary payload.

    ## Architecture diagram
    ```mermaid
    flowchart TD
        T[Schedule: hourly_tempo_audit] --> S[audit_tempo_metrics]
        S --> C{check_tempo_health}
        C -- Degraded --> A[notify_slack_tracing_ops]
        C -- Healthy --> H[log_healthy_tempo]
        A --> E[export_tempo_manifest]
        H --> E[export_tempo_manifest]
    ```

    ## Use cases
    - Distributed Tracing Reliability: Proactively flags when high-volume microservice trace bursts saturate Tempo distributor rate limits, dropping telemetry.
    - Cloud Storage Trace Compaction: Detects permission errors, block corruptions, or overlapping trace cuts in S3 or GCS buckets before historical query capabilities degrade.
    - Observability Cost Optimization: Ensures ingester buffer flush policies operate smoothly without building up unbounded memory footprint.

    ## Inputs
    | Name | Type | Default | Description |
    | --- | --- | --- | --- |
    | `tempo_metrics_url` | STRING | `http://tempo.internal:3200/metrics` | Prometheus metrics HTTP endpoint exposed by Grafana Tempo distributed tracing components. |
    | `max_tolerated_dropped_spans` | INT | `0` | Maximum allowable number of spans dropped by Tempo distributors or ingesters before alerting. |
    | `alert_on_failed_compactor_blocks` | BOOL | `true` | Whether to alert immediately if Tempo compactor reports failed blocks in object storage. |

    ## Expected outputs
    - `outputs.audit_tempo_metrics.vars.spans_dropped`: Cumulative count of spans rejected or dropped by ingestion pipeline.
    - `outputs.audit_tempo_metrics.vars.live_traces`: Current count of active traces held in ingester memory.
    - `outputs.audit_tempo_metrics.vars.compactor_failed_blocks`: Total failed compaction blocks recorded in storage.
    - `outputs.audit_tempo_metrics.vars.degraded`: Boolean flag indicating tracing system impairment.
    - `outputs.export_tempo_manifest.value`: Formatted execution report summary.

    ## Prerequisites
    - Network connectivity from Kestra workers to the Grafana Tempo HTTP metrics port (typically 3200).
    - Grafana Tempo deployed with metrics endpoint enabled.
    - Slack incoming webhook endpoint configured.

    ### Secrets
    - `SLACK_WEBHOOK_URL`: Secret containing the Slack incoming webhook endpoint for channel alerts.

    ## Quick start
    1. Define `SLACK_WEBHOOK_URL` in your Kestra namespace secrets.
    2. Adjust `tempo_metrics_url` to match your Tempo distributor or monolith endpoint.
    3. Run a manual execution to test metrics parsing and inspect live trace statistics.
    4. Enable the `hourly_tempo_audit` schedule for automated cluster surveillance.

    ## Common pitfalls and troubleshooting
    - Microservice Architecture Endpoints: In distributed Tempo deployments, query the distributor component for dropped spans and the compactor component for block statuses.
    - Ingester Flush Lag: If live traces spike continuously, ingester `max_block_duration` may need tuning to force timely flushes to long-term storage.
    - Retention Enforcement: Ensure compactor retention policies match bucket lifecycle configurations to prevent compaction conflicts.

    ## How to extend
    - Automate ingester horizontal pod scaling via Kubernetes plugins when live traces approach memory limits.
    - Send span drop rate metrics to Prometheus alertmanager or Datadog.
    - Trigger automated verification drills to replay synthetic spans and confirm end-to-end trace assembly.

    ## Links
    - [Grafana Tempo Operations Guide](https://grafana.com/docs/tempo/latest/operations/)
    - [Grafana Tempo Compactor Documentation](https://grafana.com/docs/tempo/latest/configuration/#compactor)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Day 2 Operations
    - Monitoring & Alerting
  ee: false
  demo: false
