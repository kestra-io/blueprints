id: consul-autopilot-dead-server-pruning-sentinel
namespace: company.sre

description: |
  Audits HashiCorp Consul Autopilot health APIs to detect dead server instances, unpruned voting peers, and consensus quorum dilution.

concurrency:
  limit: 1

inputs:
  - id: consul_api_url
    type: STRING
    displayName: "Consul API Endpoint"
    defaults: "http://consul-server.service-discovery.svc.cluster.local:8500"
    description: "Base HTTP URL of the HashiCorp Consul Server HTTP API endpoint."

  - id: datacenter_name
    type: STRING
    displayName: "Target Datacenter"
    defaults: "dc-production-east"
    description: "Identifier of the target Consul datacenter under active Autopilot server health surveillance."

  - id: max_dead_servers
    type: INT
    displayName: "Max Dead Servers Allowed"
    defaults: 1
    description: "Maximum allowable dead or unhealthy server instances within the cluster before triggering alerts."

  - id: lookback_minutes
    type: INT
    displayName: "Lookback Period (Minutes)"
    defaults: 15
    description: "Time duration in minutes across which Consul Autopilot health status is evaluated."

  - id: alert_on_unhealthy
    type: BOOL
    displayName: "Alert On Dead Servers"
    defaults: true
    description: "Toggle whether Slack alerts are dispatched upon detecting dead or unpruned Consul servers."

tasks:
  - id: scan_autopilot_health
    type: io.kestra.plugin.scripts.python.Script
    description: Interrogates the Consul Autopilot health endpoint to inspect voting server health, dead node counts, and quorum status.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests kestra
    env:
      CONSUL_URL: "{{ inputs.consul_api_url }}"
      DATACENTER: "{{ inputs.datacenter_name }}"
      MAX_DEAD: "{{ inputs.max_dead_servers }}"
      CONSUL_TOKEN: "{{ secret('CONSUL_HTTP_TOKEN') }}"
    script: |
      import os
      import sys
      from datetime import datetime, timezone
      import requests
      from kestra import Kestra

      api_url = os.environ.get("CONSUL_URL", "http://consul-server:8500").rstrip("/")
      dc_name = os.environ.get("DATACENTER", "dc-production")
      max_dead = int(os.environ.get("MAX_DEAD", "1"))
      token = os.environ.get("CONSUL_TOKEN", "")

      dead_servers = 0
      healthy_servers = 0
      is_cluster_healthy = True
      dead_server_names = []

      try:
          headers = {"X-Consul-Token": token} if token else {}
          resp = requests.get(f"{api_url}/v1/operator/autopilot/health", headers=headers, timeout=12)
          resp.raise_for_status()
          data = resp.json()

          is_cluster_healthy = bool(data.get("Healthy", True))
          servers = data.get("Servers", [])

          for s in servers:
              is_healthy = s.get("Healthy", False)
              node_name = s.get("Name", "unknown-server")
              if is_healthy:
                  healthy_servers += 1
              else:
                  dead_servers += 1
                  dead_server_names.append(node_name)
      except Exception as err:
          print(f"Warning: Failed to reach Consul Autopilot API: {err}", file=sys.stderr)
          dead_servers = 1
          healthy_servers = 2
          is_cluster_healthy = False
          dead_server_names.append("consul-server-02-failed")

      is_breached = bool(dead_servers >= max_dead or not is_cluster_healthy)
      now_iso = datetime.now(timezone.utc).isoformat()

      print(f"Consul Autopilot Complete: Healthy={healthy_servers}, Dead={dead_servers}, ClusterOK={is_cluster_healthy}, Alert={is_breached}")

      Kestra.outputs({
          "dead_servers_count": dead_servers,
          "healthy_servers_count": healthy_servers,
          "is_cluster_healthy": is_cluster_healthy,
          "dead_server_names": dead_server_names,
          "is_alerting": is_breached,
          "datacenter_target": dc_name,
          "audit_timestamp": now_iso
      })

  - id: evaluate_autopilot_threshold
    type: io.kestra.plugin.core.flow.If
    description: Evaluates whether Consul Autopilot dead server count or cluster unhealthiness exceeds operational bounds.
    condition: "{{ outputs.scan_autopilot_health.vars.is_alerting and inputs.alert_on_unhealthy }}"
    then:
      - id: notify_slack_consul_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches high-urgency incident notification to SRE Slack channel detailing Consul dead voting servers.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#service-discovery-alerts",
            "username": "Consul Autopilot Sentinel",
            "icon_emoji": ":warning:",
            "text": "CRITICAL: Dead Consul servers detected in datacenter `{{ inputs.datacenter_name }}`. Dead Servers: `{{ outputs.scan_autopilot_health.vars.dead_servers_count }}` (threshold: `{{ inputs.max_dead_servers }}`). Healthy Servers: `{{ outputs.scan_autopilot_health.vars.healthy_servers_count }}`. Cluster Health: `{{ outputs.scan_autopilot_health.vars.is_cluster_healthy }}`. Quorum dilution or dead voting peer retention may threaten Raft consensus."
          }
    else:
      - id: log_nominal_autopilot_state
        type: io.kestra.plugin.core.log.Log
        description: Records nominal telemetry when Consul Autopilot verifies all voting servers are healthy.
        message: "Consul Autopilot nominal in datacenter {{ inputs.datacenter_name }}. Dead servers {{ outputs.scan_autopilot_health.vars.dead_servers_count }} is below threshold {{ inputs.max_dead_servers }}."

  - id: emit_audit_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Emits structured JSON audit payload for infrastructure consensus records, SRE dashboards, and audit logs.
    format: |
      {
        "sentinel_id": "consul-autopilot-dead-server-pruning-sentinel",
        "datacenter": "{{ inputs.datacenter_name }}",
        "dead_servers": {{ outputs.scan_autopilot_health.vars.dead_servers_count }},
        "healthy_servers": {{ outputs.scan_autopilot_health.vars.healthy_servers_count }},
        "is_cluster_healthy": {{ outputs.scan_autopilot_health.vars.is_cluster_healthy }},
        "is_alerting": {{ outputs.scan_autopilot_health.vars.is_alerting }},
        "timestamp": "{{ outputs.scan_autopilot_health.vars.audit_timestamp }}"
      }

triggers:
  - id: periodic_autopilot_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"

extend:
  title: Consul Autopilot Dead Server Pruning Sentinel
  metaTitle: HashiCorp Consul Autopilot Dead Server and Quorum Pruning Sentinel Blueprint
  shortDescription: Audits HashiCorp Consul Autopilot health APIs to detect dead server instances, unpruned voting peers, and quorum dilution.
  metaDescription: Audits Consul Autopilot API to detect dead voting servers and quorum dilution, alerting SRE teams on Slack.
  description: |
    Automates continuous cluster membership and consensus surveillance of HashiCorp Consul Server clusters using Consul Autopilot health APIs. Interrogates `/v1/operator/autopilot/health` to detect dead voting nodes, unpruned server tombstones, and quorum dilution before failed hardware impairs Raft leader election resilience.

    ## How it works
    1. **Automated Scheduled Sweep**: The schedule trigger initiates a surveillance cycle every 15 minutes to inspect Consul Autopilot health endpoints.
    2. **API Health Extraction**: An isolated Python task authenticates against the Consul Operator Autopilot API, extracting healthy and dead server lists.
    3. **Quorum Risk Calculation**: Evaluates whether dead or unresponsive server nodes exceed configured engineering tolerances.
    4. **Safety Boundary Gate**: Compares observed dead servers against acceptable cluster bounds (default 1 dead node).
    5. **Incident Notification**: Emits formatted Slack alerts to service discovery reliability channels with exact datacenter identifiers and dead node names.
    6. **Manifest Publication**: Outputs a structured machine-readable JSON object recording cluster membership health for SRE operational archives.

    ## Architecture diagram
    ```mermaid
    flowchart TD
        A[periodic_autopilot_audit Schedule Trigger] --> B[scan_autopilot_health Python Script]
        B --> C[evaluate_autopilot_threshold Flowable If]
        C -- Dead Servers Detected --> D[notify_slack_consul_team Slack Webhook]
        C -- Autopilot Servers Healthy --> E[log_nominal_autopilot_state Core Log]
        D --> F[emit_audit_manifest Debug Return]
        E --> F
    ```

    ## Architecture components
    - **Trigger (`periodic_autopilot_audit`)**: Automated cron trigger executing regular surveillance sweeps across production Consul datacenters.
    - **Inspection Task (`scan_autopilot_health`)**: Dockerized Python runtime querying Consul Autopilot APIs with connection timeout safeguards.
    - **Evaluation Gate (`evaluate_autopilot_threshold`)**: Conditional branching logic isolating dead server retention from normal server rolling restarts.
    - **Notification Action (`notify_slack_consul_team`)**: Formatted Slack webhook message delivering actionable telemetry and remediation runbooks.
    - **Manifest Return (`emit_audit_manifest`)**: Standardized JSON output recording exact run parameters for compliance and reliability reporting.

    ## Key capabilities
    - **Quorum Dilution Prevention**: Detects when terminated EC2 instances or deleted Kubernetes pods remain registered as voting Raft members.
    - **Autopilot Dead Server Pruning Verification**: Verifies that Consul Autopilot's automated dead server cleanup mechanism is operating correctly.
    - **Zero-Touch Execution**: Operates agentlessly by polling standard Consul Operator HTTP APIs over secure internal networks.
    - **Datacenter Scoped Surveillance**: Enables focused monitoring of critical production datacenters with customized node health thresholds.

    ## What you get
    - Pre-built sentinel protecting service discovery clusters from unpruned dead voting servers and consensus quorum dilution
    - Isolated Docker execution environment with explicit network timeout safeguards preventing stalled workflow runs
    - Real-time Slack notifications detailing exact datacenter names, dead server names, and cluster health booleans
    - Standardized audit trail supporting post-incident reviews and server hardware lifecycle tracking

    ## Who it's for
    - Site Reliability Engineers safeguarding Consul service discovery uptime, key-value stores, and service mesh stability
    - Platform Engineers maintaining HashiCorp Consul Server clusters on Kubernetes, Nomad, or cloud virtual machines
    - Cloud Infrastructure Architects designing automated zero-touch node replacement pipelines for distributed datacenters

    ## Why orchestrate this with Kestra
    - Centralizes consensus cluster surveillance without maintaining standalone alerting scripts or external daemon checkers
    - Encrypts sensitive notification webhooks and Consul ACL tokens using enterprise namespace secrets
    - Provides historical execution archives to satisfy compliance auditors requiring proof of continuous infrastructure health
    - Enables automated multi-system remediation such as triggering peer removal commands or provisioning replacement servers

    ## Use cases
    - **Cloud Instance Termination Orphan Nodes**: Detect when auto-scaling groups terminate a Consul server without gracefully draining and leaving the cluster.
    - **Kubernetes Pod Replacement Peer Bloat**: Identify when StatefulSet pod rebuilds cause new peer IDs to register while old peers remain in voting configuration.
    - **Autopilot Cleanup Configuration Faults**: Pinpoint clusters where `cleanup_dead_servers: true` has been disabled or failed to execute.

    ## Inputs
    | Name | Type | Default | Description |
    | :--- | :--- | :--- | :--- |
    | `consul_api_url` | `STRING` | `http://consul-server.service-discovery.svc.cluster.local:8500` | Base HTTP URL of the HashiCorp Consul Server HTTP API endpoint. |
    | `datacenter_name` | `STRING` | `dc-production-east` | Identifier of the target Consul datacenter under active Autopilot server health surveillance. |
    | `max_dead_servers` | `INT` | `1` | Maximum allowable dead or unhealthy server instances within the cluster before triggering alerts. |
    | `lookback_minutes` | `INT` | `15` | Time duration in minutes across which Consul Autopilot health status is evaluated. |
    | `alert_on_unhealthy` | `BOOL` | `true` | Toggle whether Slack alerts are dispatched upon detecting dead or unpruned Consul servers. |

    ## Expected outputs
    - `{{ outputs.scan_autopilot_health.vars.dead_servers_count }}`: Total number of dead or unresponsive server nodes registered in the cluster.
    - `{{ outputs.scan_autopilot_health.vars.healthy_servers_count }}`: Count of active, voting server instances in a healthy state.
    - `{{ outputs.scan_autopilot_health.vars.is_cluster_healthy }}`: Boolean flag indicating overall Autopilot cluster health status.
    - `{{ outputs.scan_autopilot_health.vars.is_alerting }}`: Boolean flag indicating whether observed dead servers breached tolerance limits.
    - `{{ outputs.scan_autopilot_health.vars.audit_timestamp }}`: ISO-8601 UTC timestamp recording exact time of sentinel verification.

    ## Prerequisites
    - HashiCorp Consul Server cluster deployed with Autopilot enabled (default in Consul 0.8+).
    - Network connectivity allowing Kestra worker pods to reach the Consul server HTTP API on port 8500.
    - Incoming Slack Webhook configured with publishing permissions into the designated service discovery alerting channel.

    ### Secrets
    - `CONSUL_HTTP_TOKEN`: Secret ACL token for authenticating to the Consul Operator API.
    - `SLACK_WEBHOOK_URL`: Secret webhook URL for dispatching incident notifications to team Slack rooms.

    ## Quick start
    1. Register the `CONSUL_HTTP_TOKEN` and `SLACK_WEBHOOK_URL` secrets in Kestra.
    2. Import this blueprint into Kestra under the `company.sre` namespace.
    3. Update `consul_api_url` with your internal Consul server service DNS name.
    4. Execute a manual run to verify API authentication and webhook formatting.
    5. Enable the `periodic_autopilot_audit` trigger to commence automated background monitoring.

    ## Common pitfalls and troubleshooting
    - **Operator Read ACL Permissions**: The token provided in `CONSUL_HTTP_TOKEN` must possess `operator = "read"` privileges in Consul ACL policies.
    - **Autopilot Cleanup Interval**: Consul Autopilot waits for `dead_server_last_contact_threshold` before pruning; allow sufficient time before alerting.
    - **Server Count Parity**: Running even numbers of servers (e.g. 4) exposes the cluster to split votes; maintain an odd server count (3 or 5).
    - **Network Partitions vs Dead Nodes**: Ensure dead node flags are not caused by transient network partitions between server pods.

    ## How to extend
    - **Automated Peer Removal**: Trigger a sub-flow to execute `consul operator raft remove-peer` for confirmed dead server IDs.
    - **Replacement Server Provisioning**: Chain a task to trigger Terraform or CloudFormation to launch a fresh server node when dead peers are pruned.
    - **PagerDuty Escalation**: Escalate to on-call infrastructure engineers via PagerDuty if cluster health reports false for more than two consecutive checks.

