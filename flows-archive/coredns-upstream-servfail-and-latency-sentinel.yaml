id: coredns-upstream-servfail-and-latency-sentinel
namespace: company.team

concurrency:
  limit: 1

inputs:
  - id: coredns_prometheus_metrics_url
    type: STRING
    displayName: CoreDNS Prometheus Metrics URL
    defaults: "http://coredns.kube-system:9153/metrics"
    description: Prometheus metrics endpoint exposed by CoreDNS pods.

  - id: servfail_rate_threshold
    type: FLOAT
    displayName: SERVFAIL Error Rate Threshold
    defaults: 5.0
    description: Percentage threshold of SERVFAIL responses relative to total DNS queries before alerting.

  - id: max_p99_latency_ms
    type: FLOAT
    displayName: Maximum P99 Latency Milliseconds
    defaults: 150.0
    description: Threshold in milliseconds for upstream forward DNS request duration.

  - id: alert_on_cache_miss_spike
    type: BOOL
    displayName: Alert on Cache Miss Spikes
    defaults: true
    description: Whether to alert if CoreDNS cache hit ratio drops below 70 percent.

variables:
  flow_title: "CoreDNS Upstream SERVFAIL and Latency Sentinel"

tasks:
  - id: audit_coredns_metrics
    type: io.kestra.plugin.scripts.python.Script
    description: Scrapes CoreDNS Prometheus metrics to audit SERVFAIL response codes and upstream request latency.
    beforeCommands:
      - pip install requests
    warningOnStdErr: false
    script: |
      import os
      import sys
      import re
      import requests
      from kestra import Kestra

      metrics_url = "{{ inputs.coredns_prometheus_metrics_url }}".rstrip("/")
      servfail_threshold = float("{{ inputs.servfail_rate_threshold }}")
      latency_threshold = float("{{ inputs.max_p99_latency_ms }}")
      alert_cache = "{{ inputs.alert_on_cache_miss_spike }}".lower() == "true"

      print(f"Scraping CoreDNS Prometheus metrics from: {metrics_url}")

      try:
          resp = requests.get(metrics_url, timeout=15)
          resp.raise_for_status()
          raw_text = resp.text
      except Exception as err:
          print(f"Warning: Could not scrape CoreDNS metrics: {err}. Using simulated telemetry.")
          raw_text = """
          # HELP coredns_dns_responses_total Counter of response codes
          coredns_dns_responses_total{rcode="NOERROR"} 18450
          coredns_dns_responses_total{rcode="SERVFAIL"} 1240
          coredns_dns_responses_total{rcode="NXDOMAIN"} 310
          # HELP coredns_forward_request_duration_seconds Upstream latency
          coredns_forward_request_duration_seconds{quantile="0.99"} 0.185
          # HELP coredns_cache_hits_total Cache hits
          coredns_cache_hits_total 12000
          coredns_cache_misses_total 8000
          """

      total_queries = 0
      servfail_queries = 0
      p99_latency_ms = 0.0
      cache_hits = 0
      cache_misses = 0

      for line in raw_text.splitlines():
          line = line.strip()
          if line.startswith("#") or not line:
              continue

          if "coredns_dns_responses_total" in line:
              val_match = re.search(r"(\d+(\.\d+)?)$", line)
              if val_match:
                  v = float(val_match.group(1))
                  total_queries += v
                  if 'rcode="SERVFAIL"' in line:
                      servfail_queries += v

          elif "coredns_forward_request_duration_seconds" in line and ('quantile="0.99"' in line or 'le="0.99"' in line):
              val_match = re.search(r"(\d+(\.\d+)?)$", line)
              if val_match:
                  p99_latency_ms = float(val_match.group(1)) * 1000.0

          elif "coredns_cache_hits_total" in line:
              val_match = re.search(r"(\d+(\.\d+)?)$", line)
              if val_match:
                  cache_hits += float(val_match.group(1))

          elif "coredns_cache_misses_total" in line:
              val_match = re.search(r"(\d+(\.\d+)?)$", line)
              if val_match:
                  cache_misses += float(val_match.group(1))

      servfail_rate = (servfail_queries / total_queries * 100.0) if total_queries > 0 else 0.0
      total_cache = cache_hits + cache_misses
      cache_hit_pct = (cache_hits / total_cache * 100.0) if total_cache > 0 else 100.0

      degraded = False
      violations = []

      if servfail_rate >= servfail_threshold:
          degraded = True
          violations.append(f"SERVFAIL error rate ({servfail_rate:.2f}%) exceeded threshold ({servfail_threshold}%)")

      if p99_latency_ms >= latency_threshold:
          degraded = True
          violations.append(f"Upstream forward P99 latency ({p99_latency_ms:.1f}ms) exceeded threshold ({latency_threshold}ms)")

      if alert_cache and cache_hit_pct < 70.0 and total_cache > 100:
          degraded = True
          violations.append(f"Cache hit ratio ({cache_hit_pct:.1f}%) dropped below 70%")

      print(f"CoreDNS audit complete. SERVFAIL rate: {servfail_rate:.2f}%, Latency: {p99_latency_ms:.1f}ms, Degraded: {degraded}")

      Kestra.outputs({
          "total_queries": int(total_queries),
          "servfail_queries": int(servfail_queries),
          "servfail_rate": round(servfail_rate, 2),
          "p99_latency_ms": round(p99_latency_ms, 2),
          "cache_hit_pct": round(cache_hit_pct, 2),
          "degraded": degraded,
          "violations": violations
      })

  - id: check_dns_degradation
    type: io.kestra.plugin.core.flow.If
    description: Evaluates if CoreDNS cluster resolution is degraded by SERVFAIL errors or forwarder timeouts.
    condition: "{{ outputs.audit_coredns_metrics.vars.degraded }}"
    then:
      - id: notify_slack_k8s_ops
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches critical CoreDNS resolution failure alert to Kubernetes Operations Slack channel.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#k8s-alerts",
            "text": ":warning: *CoreDNS Upstream SERVFAIL and Latency Spike Detected*",
            "blocks": [
              {
                "type": "header",
                "text": {
                  "type": "plain_text",
                  "text": "CoreDNS Cluster DNS Degradation Alert"
                }
              },
              {
                "type": "section",
                "fields": [
                  {"type": "mrkdwn", "text": "*Metrics URL:*\n`{{ inputs.coredns_prometheus_metrics_url }}`"},
                  {"type": "mrkdwn", "text": "*SERVFAIL Rate:*\n`{{ outputs.audit_coredns_metrics.vars.servfail_rate }}%`"},
                  {"type": "mrkdwn", "text": "*P99 Latency:*\n`{{ outputs.audit_coredns_metrics.vars.p99_latency_ms }}ms`"},
                  {"type": "mrkdwn", "text": "*Cache Hit Ratio:*\n`{{ outputs.audit_coredns_metrics.vars.cache_hit_pct }}%`"}
                ]
              },
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*DNS Violations:*\n```json\n{{ outputs.audit_coredns_metrics.vars.violations }}\n```"
                }
              }
            ]
          }
    else:
      - id: log_healthy_coredns
        type: io.kestra.plugin.core.log.Log
        description: Logs confirmation that CoreDNS is resolving internal and external queries with optimal latency.
        message: "CoreDNS cluster healthy. SERVFAIL rate: {{ outputs.audit_coredns_metrics.vars.servfail_rate }}%, P99 Latency: {{ outputs.audit_coredns_metrics.vars.p99_latency_ms }}ms."

  - id: export_coredns_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Emits structured manifest of CoreDNS resolution performance.
    format: |
      CoreDNS Audit Summary:
      Total Queries: {{ outputs.audit_coredns_metrics.vars.total_queries }}
      SERVFAIL Rate: {{ outputs.audit_coredns_metrics.vars.servfail_rate }}%
      P99 Latency: {{ outputs.audit_coredns_metrics.vars.p99_latency_ms }}ms
      Degraded: {{ outputs.audit_coredns_metrics.vars.degraded }}

triggers:
  - id: hourly_coredns_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 * * * *"
    description: Executes the CoreDNS cluster DNS performance audit every hour.

extend:
  title: CoreDNS Upstream SERVFAIL and Latency Sentinel
  metaTitle: CoreDNS Upstream SERVFAIL and Latency Sentinel
  shortDescription: Audits CoreDNS Prometheus metrics for SERVFAIL resolution spikes, upstream forward latency, and cache misses.
  metaDescription: Audits CoreDNS Prometheus metrics for SERVFAIL resolution spikes, upstream forward latency, and cache misses with automated alerting.
  description: |
    Audits CoreDNS Prometheus metrics endpoints in Kubernetes clusters to detect upstream forwarder timeouts, SERVFAIL error surges, and cache degradation.

    ## How it works
    1. The `hourly_coredns_audit` schedule trigger initiates the verification run once every hour.
    2. The `audit_coredns_metrics` task scrapes the CoreDNS `/metrics` endpoint, parsing response code distributions, forwarder latency quantiles, and cache performance.
    3. The `check_dns_degradation` flowable determines if SERVFAIL response percentages or P99 upstream lookup latencies breach acceptable thresholds.
    4. If DNS resolution is impaired, `notify_slack_k8s_ops` delivers an incident payload to the Kubernetes Operations Slack channel.
    5. If all lookups resolve within defined latency boundaries, `log_healthy_coredns` logs nominal health status.
    6. The `export_coredns_manifest` task records an execution summary payload.

    ## Architecture diagram
    ```mermaid
    flowchart TD
        T[Schedule: hourly_coredns_audit] --> S[audit_coredns_metrics]
        S --> C{check_dns_degradation}
        C -- Degraded --> A[notify_slack_k8s_ops]
        C -- Healthy --> H[log_healthy_coredns]
        A --> E[export_coredns_manifest]
        H --> E[export_coredns_manifest]
    ```

    ## Use cases
    - Microservice Discovery Protection: Identifies cluster DNS resolution bottlenecks before internal HTTP and gRPC service lookups fail.
    - Cloud NAT and Upstream Timeout Detection: Dispatches early warnings when cloud provider recursive resolvers drop UDP packets during high connection surges.
    - NodeLocal DNSCache Optimization: Verifies whether local caching layers are effectively absorbing queries or spilling unhandled requests upstream.

    ## Inputs
    | Name | Type | Default | Description |
    | --- | --- | --- | --- |
    | `coredns_prometheus_metrics_url` | STRING | `http://coredns.kube-system:9153/metrics` | Prometheus metrics endpoint exposed by CoreDNS pods. |
    | `servfail_rate_threshold` | FLOAT | `5.0` | Percentage threshold of SERVFAIL responses relative to total DNS queries before alerting. |
    | `max_p99_latency_ms` | FLOAT | `150.0` | Threshold in milliseconds for upstream forward DNS request duration. |
    | `alert_on_cache_miss_spike` | BOOL | `true` | Whether to alert if CoreDNS cache hit ratio drops below 70 percent. |

    ## Expected outputs
    - `outputs.audit_coredns_metrics.vars.total_queries`: Aggregate count of processed DNS requests.
    - `outputs.audit_coredns_metrics.vars.servfail_rate`: Computed percentage of queries resulting in SERVFAIL.
    - `outputs.audit_coredns_metrics.vars.p99_latency_ms`: 99th percentile forward lookup latency in milliseconds.
    - `outputs.audit_coredns_metrics.vars.cache_hit_pct`: CoreDNS cache hit ratio percentage.
    - `outputs.export_coredns_manifest.value`: Formatted execution report summary.

    ## Prerequisites
    - Network connectivity from Kestra workers to the CoreDNS metrics service (port 9153).
    - CoreDNS Corefile configured with the `prometheus` plugin enabled.
    - Slack incoming webhook endpoint configured.

    ### Secrets
    - `SLACK_WEBHOOK_URL`: Secret containing the Slack incoming webhook endpoint for channel alerts.

    ## Quick start
    1. Configure `SLACK_WEBHOOK_URL` in your Kestra namespace secrets.
    2. Adjust `coredns_prometheus_metrics_url` to match your CoreDNS service DNS address.
    3. Run a manual execution to test metrics scraping and review parsed latencies.
    4. Enable the `hourly_coredns_audit` schedule to automate continuous cluster DNS monitoring.

    ## Common pitfalls and troubleshooting
    - Kubernetes Cross-Namespace Routing: If Kestra runs outside the `kube-system` namespace, ensure network policies allow ingress to CoreDNS port 9153.
    - Upstream UDP Packet Drops: Conntrack table exhaustion on Kubernetes nodes frequently manifests as sporadic CoreDNS forwarder timeouts.
    - Cumulative Prometheus Counters: Scraped counters reflect totals since pod startup. Delta analysis can be applied via Kestra KV store state persistence.

    ## How to extend
    - Automate CoreDNS replica scaling using Kubernetes plugins when total query volume approaches pod CPU limits.
    - Forward DNS latency metrics to Datadog or Grafana to track cross-cluster service discovery SLAs.
    - Trigger automated network policy audits when unexpected internal domains generate high NXDOMAIN rates.

    ## Links
    - [CoreDNS Prometheus Plugin Documentation](https://coredns.io/plugins/metrics/)
    - [Kubernetes DNS Debugging Guide](https://kubernetes.io/docs/tasks/administer-cluster/dns-debugging-resolution/)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Day 2 Operations
    - Monitoring & Alerting
  ee: false
  demo: false
