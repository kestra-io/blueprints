id: razorpay-payment-failure-rate-sentinel
namespace: company.team
description: |
  On a schedule, read the last hour of payments from the Razorpay API
  (read-only: nothing is captured, refunded or changed) and classify the
  payment failure rate as HEALTHY, WARNING, CRITICAL, LOW_VOLUME or
  UNREACHABLE. Log quiet runs and page Slack when UPI, card or netbanking
  payments start failing more than usual.

inputs:
  - id: lookback_hours
    type: INT
    defaults: 1
    displayName: "Lookback Window (hours)"
    description: "How far back to read payments on each run."
  - id: warning_failure_rate
    type: FLOAT
    defaults: 15.0
    displayName: "Warning Failure Rate (%)"
    description: "At or above this share of failed payment attempts, the check is classified WARNING."
  - id: critical_failure_rate
    type: FLOAT
    defaults: 30.0
    displayName: "Critical Failure Rate (%)"
    description: "At or above this share of failed payment attempts, the check is classified CRITICAL."
  - id: min_attempts
    type: INT
    defaults: 10
    displayName: "Minimum Attempts"
    description: "Below this many payment attempts in the window, the rate is too noisy to judge and the run is classified LOW_VOLUME."

variables:
  api_base: https://api.razorpay.com/v1

triggers:
  - id: hourly_check
    type: io.kestra.plugin.core.trigger.Schedule
    description: Check the payment failure rate every hour. Shipped disabled; enable it once the Razorpay key secrets are set and a manual run has been verified.
    cron: "5 * * * *"
    disabled: true
    inputs:
      lookback_hours: 1

tasks:
  - id: list_payments
    type: io.kestra.plugin.core.http.Request
    description: Read up to 100 payments created in the lookback window from the Razorpay Payments API. This is a GET; no payment is captured, refunded or modified.
    uri: "{{ vars.api_base }}/payments?count=100&from={{ now() | dateAdd(-inputs.lookback_hours, 'HOURS') | timestamp }}&to={{ now() | timestamp }}"
    method: GET
    options:
      auth:
        type: BASIC
        username: "{{ secret('RAZORPAY_KEY_ID') }}"
        password: "{{ secret('RAZORPAY_KEY_SECRET') }}"
      allowFailed: true
      timeout:
        connectTimeout: PT10S
        readIdleTimeout: PT30S
    retry:
      type: constant
      interval: PT10S
      maxAttempts: 3
    allowFailure: true

  - id: summarize_payments
    type: io.kestra.plugin.core.debug.Return
    description: Ignore payments still in the created state (the customer never attempted them), count attempts and failures, work out the failure rate, the worst payment method and the most common failure reason, and classify the window in one jq query. A missing or non-200 response becomes UNREACHABLE instead of looking healthy.
    format: >-
      {{ (outputs.list_payments.code is not defined or outputs.list_payments.code != 200)
      ? '{"status":"UNREACHABLE","attempts":0,"failed":0,"rate":0,"worst_method":"none","top_error":"none"}'
      : (fromJson(outputs.list_payments.body) | jq('
      [.items[] | select(.status != "created")] as $a
      | ($a | length) as $n
      | ([$a[] | select(.status == "failed")] | length) as $f
      | (if $n == 0 then 0 else (($f * 1000 / $n) | floor) / 10 end) as $r
      | {attempts: $n, failed: $f, rate: $r,
      worst_method: ([$a | group_by(.method)[] | {m: .[0].method, n: length, f: ([.[] | select(.status == "failed")] | length)}] | max_by(.f / .n) | .m // "none"),
      top_error: ([$a[] | select(.status == "failed") | (.error_reason // "unknown")] | group_by(.) | map({e: .[0], c: length}) | max_by(.c) | .e // "none"),
      status: (if $n < ' ~ inputs.min_attempts ~ ' then "LOW_VOLUME"
      elif $r >= ' ~ inputs.critical_failure_rate ~ ' then "CRITICAL"
      elif $r >= ' ~ inputs.warning_failure_rate ~ ' then "WARNING"
      else "HEALTHY" end)}
      ') | first | toJson) }}

  - id: route_by_failure_rate
    type: io.kestra.plugin.core.flow.Switch
    description: Route to a quiet log when payments are healthy or volume is too low to judge, an informational Slack message when the failure rate crosses the warning line, or a Slack page when it crosses the critical line or Razorpay could not be read.
    value: "{{ fromJson(outputs.summarize_payments.value).status }}"
    cases:
      "HEALTHY":
        - id: log_healthy
          type: io.kestra.plugin.core.log.Log
          message: "Razorpay payments healthy: {{ fromJson(outputs.summarize_payments.value).failed }} of {{ fromJson(outputs.summarize_payments.value).attempts }} attempts failed ({{ fromJson(outputs.summarize_payments.value).rate }}%) in the last {{ inputs.lookback_hours }} hour(s)."
      "LOW_VOLUME":
        - id: log_low_volume
          type: io.kestra.plugin.core.log.Log
          message: "Razorpay payments: only {{ fromJson(outputs.summarize_payments.value).attempts }} attempt(s) in the last {{ inputs.lookback_hours }} hour(s), below the minimum of {{ inputs.min_attempts }}; failure rate not judged this run."
      "WARNING":
        - id: alert_warning_rate
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: Post an informational Slack message when the failure rate is at or above the warning line but below the critical line.
          url: "{{ secret('SLACK_WEBHOOK') }}"
          payload: |
            {
              "text": "Razorpay payment failure rate WARNING: {{ fromJson(outputs.summarize_payments.value).failed }} of {{ fromJson(outputs.summarize_payments.value).attempts }} attempts failed ({{ fromJson(outputs.summarize_payments.value).rate }}%) in the last {{ inputs.lookback_hours }} hour(s). Worst method: {{ fromJson(outputs.summarize_payments.value).worst_method }}. Most common reason: {{ fromJson(outputs.summarize_payments.value).top_error }}. Execution {{ execution.id }}."
            }
      "CRITICAL":
        - id: alert_critical_rate
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: Page Slack when the failure rate is at or above the critical line, which usually means a bank, UPI app or card network is down and customers cannot pay.
          url: "{{ secret('SLACK_WEBHOOK') }}"
          payload: |
            {
              "text": "Razorpay payment failure rate CRITICAL: {{ fromJson(outputs.summarize_payments.value).failed }} of {{ fromJson(outputs.summarize_payments.value).attempts }} attempts failed ({{ fromJson(outputs.summarize_payments.value).rate }}%) in the last {{ inputs.lookback_hours }} hour(s). Worst method: {{ fromJson(outputs.summarize_payments.value).worst_method }}. Most common reason: {{ fromJson(outputs.summarize_payments.value).top_error }}. Customers may be unable to pay right now. Execution {{ execution.id }}."
            }
      "UNREACHABLE":
        - id: alert_unreachable_api
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: Page Slack when the Payments API could not be read, indicating an outage, a network problem or invalid API keys.
          url: "{{ secret('SLACK_WEBHOOK') }}"
          payload: |
            {
              "text": "Razorpay payment sentinel UNREACHABLE: the Payments API did not return a usable response (HTTP {{ outputs.list_payments.code ?? 'no response' }}). Check the API keys and Razorpay status. Execution {{ execution.id }}."
            }
    defaults:
      - id: log_unclassified
        type: io.kestra.plugin.core.log.Log
        message: "Razorpay payment sentinel completed with an unexpected classification: {{ outputs.summarize_payments.value }}."

  - id: log_audit_result
    type: io.kestra.plugin.core.log.Log
    description: Record one audit line for every run, whichever branch fired, so the failure-rate history stays queryable even if Slack delivery fails.
    message: "Razorpay payment sentinel audit: lookback_hours={{ inputs.lookback_hours }} http={{ outputs.list_payments.code ?? 'n/a' }} summary={{ outputs.summarize_payments.value }} execution={{ execution.id }}."

errors:
  - id: alert_flow_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alert Slack when the sentinel flow itself fails, so a broken check is never mistaken for healthy payments.
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "text": "Razorpay payment sentinel flow {{ flow.id }} FAILED (execution {{ execution.id }}). The payment failure rate is now unknown; check the task logs and the Razorpay Dashboard."
      }

outputs:
  - id: status
    type: STRING
    value: "{{ fromJson(outputs.summarize_payments.value).status }}"
  - id: failure_rate
    type: STRING
    value: "{{ fromJson(outputs.summarize_payments.value).rate }}"

extend:
  title: "Razorpay Payment Failure Rate Sentinel"
  shortDescription: Read the last hour of Razorpay payments on a schedule and page Slack when UPI, card or netbanking failures spike.
  metaTitle: Razorpay Payment Failure Rate Sentinel for Kestra
  metaDescription: "Read recent Razorpay payments every hour, change nothing, and alert Slack when the payment failure rate crosses your warning or critical line."
  description: |
    When a bank, a UPI app or a card network has a bad hour, customers simply fail to pay. Razorpay records every failed attempt, but nothing pages the business until sales are visibly down or customers complain. This blueprint turns a scheduled, read-only call to the Razorpay Payments API into a payment health gate: `io.kestra.plugin.core.http.Request` reads the last hour of payments, one jq query works out the failure rate, the worst payment method and the most common failure reason, and the result routes to a quiet log, an informational Slack note, or a Slack page.

    ## How it works

    1. `list_payments` (`io.kestra.plugin.core.http.Request`) calls `GET /v1/payments` with `from` and `to` set to the lookback window (Unix seconds) and `count=100`, using HTTP basic auth with the Razorpay key ID and key secret. It is a read: nothing is captured, refunded or changed. Retries cover short network blips, and `allowFailed` plus `allowFailure` keep an API error from aborting the flow so it can be reported instead.
    2. `summarize_payments` (`io.kestra.plugin.core.debug.Return`) first guards for a missing or non-200 response (`UNREACHABLE`). Otherwise one jq query drops payments still in the `created` state (the customer never attempted them), counts attempts and `failed` payments, computes the failure rate to one decimal, finds the payment `method` (`upi`, `card`, `netbanking`, `wallet`) with the worst failure share and the most common `error_reason`, and classifies the window: fewer than `min_attempts` attempts is `LOW_VOLUME`, at or above `critical_failure_rate` is `CRITICAL`, at or above `warning_failure_rate` is `WARNING`, otherwise `HEALTHY`.
    3. `route_by_failure_rate` (`io.kestra.plugin.core.flow.Switch`) branches on that classification: `HEALTHY` and `LOW_VOLUME` log quietly, `WARNING` posts an informational Slack note, `CRITICAL` and `UNREACHABLE` page Slack. A `defaults` fallback logs anything unexpected.
    4. `log_audit_result` (`io.kestra.plugin.core.log.Log`) writes one audit line per run with the HTTP status and the full summary, so the check's own history survives a Slack outage.
    5. The flow-level `errors` block pages Slack if the flow itself fails, so a broken sentinel is never mistaken for healthy payments.
    6. The `hourly_check` trigger runs at five past every hour and ships `disabled: true`, with `lookback_hours` pinned to 1 so each run covers the hour since the last one.

    ## What you get

    - An hourly, read-only payment health check with no custom scripting and no extra plugin to install.
    - A `status` output (`HEALTHY` / `WARNING` / `CRITICAL` / `LOW_VOLUME` / `UNREACHABLE`) and a `failure_rate` output other flows can gate on, for example to pause a marketing campaign while payments are failing.
    - Slack messages that say which method is failing (UPI, card, netbanking) and the most common reason Razorpay gave, so the team knows where to look.
    - An audit line on every run, separate from Slack.

    ## Who it's for

    - Indian e-commerce, D2C and SaaS teams taking payments through Razorpay who find out about payment outages from customers.
    - Payments and operations teams who want an alert when UPI or a bank starts failing, not a report the next morning.
    - Teams that already run their data and alerting in Kestra and want payment health in the same execution history.

    ## Why orchestrate this with Kestra

    The Razorpay Dashboard shows failures when someone looks, and its webhooks report single payments, not a rate across a window. Kestra turns a plain, read-only API call into a scheduled, typed classification with retries, a failure path and a full execution history, with the Switch branch ready to grow into real actions (switching a checkout's default method, opening an incident) without rewriting the check.

    ## Prerequisites

    - A Razorpay account. Test mode is free and uses the same API: generate test keys (they start with `rzp_test_`) in the Dashboard under Account & Settings > API Keys.
    - A Slack incoming webhook for the WARNING, CRITICAL, UNREACHABLE and flow-failure alerts.

    ### Secrets

    - `RAZORPAY_KEY_ID`: the Razorpay API key ID.
    - `RAZORPAY_KEY_SECRET`: the matching key secret.
    - `SLACK_WEBHOOK`: Slack incoming webhook used for every alert branch and the flow-failure alert.

    In Kestra OSS, secrets are supplied as environment variables prefixed `SECRET_` and base64-encoded, for example `SECRET_RAZORPAY_KEY_ID=$(echo -n 'rzp_test_xxxxxxxx' | base64)`, and read back with `{{ secret('RAZORPAY_KEY_ID') }}`. Use the Enterprise secrets backend for encryption at rest and access control.

    ## Quick start

    1. Sign up for Razorpay and switch the Dashboard to Test Mode.
    2. Generate test API keys and add `RAZORPAY_KEY_ID`, `RAZORPAY_KEY_SECRET` and `SLACK_WEBHOOK` as secrets.
    3. Create a few test payments, including failed ones (Razorpay's test cards and test UPI IDs let you force a failure).
    4. Run the flow manually with `lookback_hours` large enough to cover them and a low `min_attempts`, and check that `status` and the Slack message match what you created.
    5. Switch to live keys and enable `hourly_check`.

    ## How to extend

    - Page through busy hours with the `skip` parameter when more than 100 payments arrive in one window.
    - Split the thresholds by method, for example a looser line for netbanking than for UPI.
    - Store the last status in a KV store and alert only when it changes, instead of on every failing run.
    - Add a second Request to the Razorpay Orders API to report how many orders were left unpaid in the same window.

    ## Inputs

    - `lookback_hours`: type INT, default `1`.
    - `warning_failure_rate`: type FLOAT, default `15.0` (percent).
    - `critical_failure_rate`: type FLOAT, default `30.0` (percent).
    - `min_attempts`: type INT, default `10`.

    ## Outputs

    - `status`: one of `HEALTHY`, `WARNING`, `CRITICAL`, `LOW_VOLUME`, `UNREACHABLE`.
    - `failure_rate`: the failed share of attempts in the window, in percent.
    - Example path: `{{ fromJson(outputs.summarize_payments.value).worst_method }}` for the worst payment method.

    ## Links

    - [Razorpay Payments API: fetch multiple payments](https://razorpay.com/docs/api/payments/fetch-all-payments/)
    - [Razorpay API authentication](https://razorpay.com/docs/api/authentication/)
    - [Kestra HTTP Request task](https://kestra.io/plugins/core/tasks/http/io.kestra.plugin.core.http.request)
    - [Kestra Slack plugin](https://kestra.io/plugins/plugin-slack)

    ## Pitfalls

    - `count` is capped at 100 per call; a merchant with more than 100 payments an hour only sees the first page unless you add paging with `skip`, which skews the rate toward that page.
    - Payments still in `created` are excluded on purpose: they are checkouts the customer never attempted, and counting them would hide real failures behind abandoned carts.
    - Test-mode keys only see test payments and live keys only see live payments; a manual run with test keys against a live window reports `LOW_VOLUME`.
    - This flow only reads; it never captures, refunds or updates a payment, so there is nothing destructive to guard with a dry run.
  tags:
    - Business
    - Data
  subTags:
    - Monitoring & Alerting
  ee: false
  demo: false
