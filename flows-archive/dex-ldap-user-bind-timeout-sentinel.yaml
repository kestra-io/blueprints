    - [Dex Telemetry and Monitoring Official Guide](https://dexidp.io/docs/telemetry/)
    - [Troubleshooting Active Directory LDAP Authentication](https://learn.microsoft.com/en-us/troubleshoot/windows-server/identity/troubleshoot-ldap-over-ssl-connection-problems)
