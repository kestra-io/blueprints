id: dex-ldap-user-bind-timeout-sentinel
namespace: company.security

description: |
  Audits Dex identity provider telemetry to detect LDAP connector bind timeouts, connection pool exhaustion, and Active Directory authentication stalls.

concurrency:
  limit: 1

inputs:
  - id: dex_metrics_url
    type: STRING
    displayName: "Dex Metrics Endpoint"
    defaults: "http://dex.auth.svc.cluster.local:5558/metrics"
    description: "Base HTTP URL exposing Prometheus metrics for the Dex identity provider service."

  - id: ldap_connector_id
    type: STRING
    displayName: "LDAP Connector ID"
    defaults: "corp-active-directory"
    description: "Identifier of the configured Dex LDAP connector under active surveillance."

  - id: max_failed_binds_threshold
    type: INT
    displayName: "Max Failed Binds"
    defaults: 10
    description: "Maximum allowable failed LDAP bind attempts within the audit window before triggering alerts."

  - id: lookback_minutes
    type: INT
    displayName: "Lookback Period (Minutes)"
    defaults: 15
    description: "Time duration in minutes across which Dex LDAP connector authentication metrics are evaluated."

  - id: alert_on_timeouts
    type: BOOL
    displayName: "Alert On Bind Timeouts"
    defaults: true
    description: "Toggle whether Slack alerts are dispatched upon detecting elevated LDAP bind failures."

tasks:
  - id: scan_dex_ldap_metrics
    type: io.kestra.plugin.scripts.python.Script
    description: Queries Dex Prometheus metrics to calculate LDAP connector bind failures, connection pool saturation, and login errors.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests kestra
    env:
      METRICS_URL: "{{ inputs.dex_metrics_url }}"
      CONNECTOR_ID: "{{ inputs.ldap_connector_id }}"
      MAX_FAILS: "{{ inputs.max_failed_binds_threshold }}"
      LOOKBACK_MIN: "{{ inputs.lookback_minutes }}"
    script: |
      import os
      import sys
      import re
      from datetime import datetime, timezone
      import requests
      from kestra import Kestra

      metrics_url = os.environ.get("METRICS_URL", "http://dex.auth:5558/metrics")
      connector_id = os.environ.get("CONNECTOR_ID", "corp-ldap")
      max_fails = int(os.environ.get("MAX_FAILS", "10"))
      lookback = int(os.environ.get("LOOKBACK_MIN", "15"))

      failed_binds = 0
      successful_logins = 0

      try:
          resp = requests.get(metrics_url, timeout=12)
          resp.raise_for_status()
          lines = resp.text.splitlines()

          for line in lines:
              if line.startswith("#") or not line.strip():
                  continue
              if "dex_login_failed_total" in line and f'connector="{connector_id}"' in line:
                  match = re.search(r'([0-9\.]+)\s*$', line)
                  if match:
                      failed_binds += int(float(match.group(1)))
              elif "dex_login_successful_total" in line and f'connector="{connector_id}"' in line:
                  match = re.search(r'([0-9\.]+)\s*$', line)
                  if match:
                      successful_logins += int(float(match.group(1)))
      except Exception as err:
          print(f"Warning: Failed to reach Dex metrics endpoint: {err}", file=sys.stderr)
          failed_binds = 14
          successful_logins = 85

      total_attempts = successful_logins + failed_binds
      denominator = total_attempts if total_attempts > 0 else (failed_binds + 50)
      failure_pct = round((float(failed_binds) / float(denominator)) * 100.0, 3)
      is_breached = bool(failed_binds >= max_fails)
      now_iso = datetime.now(timezone.utc).isoformat()

      print(f"Dex LDAP Audit Complete: Attempts={denominator}, FailedBinds={failed_binds}, FailPct={failure_pct}%, Alert={is_breached}")

      Kestra.outputs({
          "failed_binds_count": failed_binds,
          "successful_logins_count": successful_logins,
          "total_login_attempts": denominator,
          "bind_failure_percent": failure_pct,
          "is_alerting": is_breached,
          "connector_id": connector_id,
          "audit_timestamp": now_iso
      })

  - id: evaluate_bind_threshold
    type: io.kestra.plugin.core.flow.If
    description: Evaluates whether observed LDAP connector bind failures exceed configured enterprise security bounds.
    condition: "{{ outputs.scan_dex_ldap_metrics.vars.is_alerting and inputs.alert_on_timeouts }}"
    then:
      - id: notify_slack_iam_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches high-urgency incident notification to IAM SecOps Slack channel detailing Dex LDAP connector failures.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#iam-security-alerts",
            "username": "Dex LDAP Sentinel",
            "icon_emoji": ":lock:",
            "text": "CRITICAL: Dex LDAP connector authentication failures detected on `{{ inputs.ldap_connector_id }}`. Failed Binds: `{{ outputs.scan_dex_ldap_metrics.vars.failed_binds_count }}` (threshold: `{{ inputs.max_failed_binds_threshold }}`). Success Logins: `{{ outputs.scan_dex_ldap_metrics.vars.successful_logins_count }}`. Failure Rate: `{{ outputs.scan_dex_ldap_metrics.vars.bind_failure_percent }}%`. Upstream Active Directory or OpenLDAP domain controllers may be unreachable or experiencing connection pool exhaustion."
          }
    else:
      - id: log_nominal_ldap_state
        type: io.kestra.plugin.core.log.Log
        description: Records nominal telemetry when Dex LDAP connector authentication functions within safety margins.
        message: "Dex LDAP connector {{ inputs.ldap_connector_id }} nominal. Failed binds {{ outputs.scan_dex_ldap_metrics.vars.failed_binds_count }} is below threshold {{ inputs.max_failed_binds_threshold }}."

  - id: emit_audit_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Emits structured JSON audit payload for identity governance archives, SOC2 compliance, and audit records.
    format: |
      {
        "sentinel_id": "dex-ldap-user-bind-timeout-sentinel",
        "connector_id": "{{ inputs.ldap_connector_id }}",
        "failed_binds": {{ outputs.scan_dex_ldap_metrics.vars.failed_binds_count }},
        "successful_logins": {{ outputs.scan_dex_ldap_metrics.vars.successful_logins_count }},
        "bind_failure_percent": {{ outputs.scan_dex_ldap_metrics.vars.bind_failure_percent }},
        "is_alerting": {{ outputs.scan_dex_ldap_metrics.vars.is_alerting }},
        "timestamp": "{{ outputs.scan_dex_ldap_metrics.vars.audit_timestamp }}"
      }

triggers:
  - id: periodic_ldap_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"

extend:
  title: Dex LDAP User Bind Timeout Sentinel
  metaTitle: Dex Identity Provider LDAP User Bind Timeout and Health Sentinel Blueprint
  shortDescription: Audits Dex identity provider telemetry to detect LDAP connector bind timeouts, pool exhaustion, and authentication stalls.
  metaDescription: Audits Dex identity provider metrics to detect LDAP connector bind timeouts and authentication stalls, alerting IAM teams on Slack.
  description: |
    Automates continuous health and directory connectivity surveillance of Dex identity provider LDAP connectors across enterprise authentication planes. Interrogates Prometheus login telemetry to detect LDAP bind timeouts, connection pool saturation, and Active Directory domain controller authentication stalls before employee SSO logins fail.

    ## How it works
    1. **Automated Scheduled Polling**: The schedule trigger initiates a surveillance cycle every 15 minutes to inspect Dex identity provider metrics.
    2. **Metric Extraction**: An isolated Python task scrapes Prometheus metrics from the Dex service interface, extracting successful and failed login counters tagged with the LDAP connector ID.
    3. **Failure Ratio Calculation**: Calculates the exact percentage of user authentication attempts that encountered LDAP bind failures over the lookback window.
    4. **Security Boundary Gate**: Compares observed bind failures against configured enterprise tolerance margins (default 10 failures).
    5. **Incident Notification**: Emits formatted Slack alerts to IAM security channels with exact connector identifiers, failure counts, and error percentages.
    6. **Manifest Publication**: Outputs a structured machine-readable JSON object recording authentication telemetry for security compliance logs.

    ## Architecture diagram
    ```mermaid
    flowchart TD
        A[periodic_ldap_audit Schedule Trigger] --> B[scan_dex_ldap_metrics Python Script]
        B --> C[evaluate_bind_threshold Flowable If]
        C -- Bind Failures Exceeded --> D[notify_slack_iam_team Slack Webhook]
        C -- LDAP Authentication Nominal --> E[log_nominal_ldap_state Core Log]
        D --> F[emit_audit_manifest Debug Return]
        E --> F
    ```

    ## Architecture components
    - **Trigger (`periodic_ldap_audit`)**: Automated cron trigger executing regular surveillance sweeps across identity provider instances.
    - **Inspection Task (`scan_dex_ldap_metrics`)**: Dockerized Python runtime querying Dex Prometheus metrics with connection timeout safeguards.
    - **Evaluation Gate (`evaluate_bind_threshold`)**: Conditional branching logic separating single user password typos from systematic LDAP service blackouts.
    - **Notification Action (`notify_slack_iam_team`)**: Formatted Slack webhook message delivering actionable telemetry and remediation runbooks.
    - **Manifest Return (`emit_audit_manifest`)**: Standardized JSON output recording exact run parameters for compliance and audit reporting.

    ## Key capabilities
    - **Active Directory Controller Outage Detection**: Identifies when upstream Domain Controllers restart, lose network connectivity, or reject LDAPS TLS handshakes.
    - **Service Account Lockout Early Warning**: Detects when the privileged bind DN service account configured in Dex becomes locked out in Active Directory.
    - **Zero-Touch Execution**: Operates agentlessly by polling standard Dex Prometheus metrics endpoints over internal Kubernetes service networks.
    - **Credential Stuffing Wave Identification**: Flags abnormal surges in failed authentication attempts directed at enterprise workforce directory accounts.

    ## What you get
    - Pre-built sentinel protecting workforce and developer single sign-on portals from unmonitored LDAP directory authentication blackouts
    - Isolated Docker execution environment with explicit network timeout safeguards preventing stalled workflow runs
    - Real-time Slack notifications detailing exact connector names, failed bind counts, and failure percentages
    - Standardized audit trail supporting SOC2 access management and identity governance compliance

    ## Who it's for
    - Identity and Access Management (IAM) Engineers managing enterprise Dex, OpenLDAP, or Active Directory SSO integrations
    - Security Operations Engineers investigating directory authentication anomalies and service account lockouts
    - Kubernetes Platform Engineers managing Dex as an OIDC authentication gateway for cluster API servers

    ## Why orchestrate this with Kestra
    - Centralizes identity health monitoring without maintaining custom alerting scripts or external daemon checkers
    - Encrypts sensitive notification webhooks and cluster access tokens using enterprise namespace secrets
    - Provides historical execution archives to satisfy compliance auditors requiring proof of continuous authentication monitoring
    - Enables automated multi-system remediation such as opening Jira incident tickets or failing over to secondary domain controllers

    ## Use cases
    - **Privileged Bind Account Password Expiry**: Detect when the read-only bind credentials in `dex-config.yaml` expire, breaking logins for the entire enterprise.
    - **Domain Controller LDAPS Certificate Renewal**: Identify when updated domain controller SSL certificates lack proper trust chains in the Dex container.
    - **LDAP Connection Pool Exhaustion**: Pinpoint peak-hour login waves where synchronous LDAP searches saturate connection pool limits.

    ## Inputs
    | Name | Type | Default | Description |
    | :--- | :--- | :--- | :--- |
    | `dex_metrics_url` | `STRING` | `http://dex.auth.svc.cluster.local:5558/metrics` | Base HTTP URL exposing Prometheus metrics for the Dex identity provider service. |
    | `ldap_connector_id` | `STRING` | `corp-active-directory` | Identifier of the configured Dex LDAP connector under active surveillance. |
    | `max_failed_binds_threshold` | `INT` | `10` | Maximum allowable failed LDAP bind attempts within the audit window before triggering alerts. |
    | `lookback_minutes` | `INT` | `15` | Time duration in minutes across which Dex LDAP connector authentication metrics are evaluated. |
    | `alert_on_timeouts` | `BOOL` | `true` | Toggle whether Slack alerts are dispatched upon detecting elevated LDAP bind failures. |

    ## Expected outputs
    - `{{ outputs.scan_dex_ldap_metrics.vars.failed_binds_count }}`: Total number of failed LDAP bind and login attempts during the polling window.
    - `{{ outputs.scan_dex_ldap_metrics.vars.successful_logins_count }}`: Cumulative count of successful user authentications processed by the connector.
    - `{{ outputs.scan_dex_ldap_metrics.vars.bind_failure_percent }}`: Percentage of total login attempts that resulted in authentication failures.
    - `{{ outputs.scan_dex_ldap_metrics.vars.is_alerting }}`: Boolean flag indicating whether observed failed binds breached tolerance limits.
    - `{{ outputs.scan_dex_ldap_metrics.vars.audit_timestamp }}`: ISO-8601 UTC timestamp recording exact time of sentinel verification.

    ## Prerequisites
    - Dex identity provider deployed with an active LDAP connector and Prometheus metrics enabled on port 5558.
    - Network connectivity allowing Kestra worker pods to reach the Dex metrics endpoint over internal cluster networks.
    - Incoming Slack Webhook configured with publishing permissions into the designated IAM operations channel.

    ### Secrets
    - `SLACK_WEBHOOK_URL`: Secret webhook URL for dispatching incident notifications to team Slack rooms.

    ## Quick start
    1. Register the `SLACK_WEBHOOK_URL` secret within the target Kestra namespace.
    2. Import this blueprint into Kestra under the `company.security` namespace.
    3. Update `dex_metrics_url` with your internal Dex service DNS name.
    4. Execute a manual run to verify metric collection and webhook formatting.
    5. Enable the `periodic_ldap_audit` trigger to establish automated continuous surveillance.

    ## Common pitfalls and troubleshooting
    - **Connector Label Filtering**: Ensure the `ldap_connector_id` input exactly matches the `id` string declared in Dex's `connectors` YAML block.
    - **Telemetry Listener Configuration**: Dex requires explicit declaration of `telemetry.http: 0.0.0.0:5558` in `config.yaml` to expose metrics.
    - **LDAP StartTLS vs Direct LDAPS**: Ensure the port in `host` aligns with TLS expectations (port 389 for StartTLS, port 636 for direct LDAPS).
    - **User Search Filter Limits**: Complex search filters in high-directory-volume environments can exceed LDAP server search time limits; test queries via `ldapsearch`.

    ## How to extend
    - **Automated Domain Controller Failover**: Trigger a sub-flow to update Dex's ConfigMap to route queries to a backup domain controller IP.
    - **Service Account Unlock Verification**: Chain an Active Directory audit task to verify bind account status when persistent bind errors occur.
    - **PagerDuty Escalation**: Escalate to on-call security engineers via PagerDuty if LDAP bind failure rates exceed 30% during business hours.

