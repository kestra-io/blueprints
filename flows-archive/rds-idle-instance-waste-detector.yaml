id: rds-idle-instance-waste-detector
namespace: company.team
description: |
  Detect RDS instances with near-zero connections over the lookback window,
  which are typically forgotten dev instances still billing hourly, and alert
  Slack with the idle candidates.

triggers:
  - id: weekly_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: Weekly sweep catches instances idle all week. Shipped disabled; enable after a manual run verifies AWS credentials.
    cron: "0 7 * * 1"
    disabled: true

inputs:
  - id: region
    type: STRING
    defaults: "us-east-1"
    description: AWS region to audit.
  - id: max_connections
    type: INT
    defaults: 2
    description: Instances averaging at or below this many connections count as idle.

tasks:
  - id: audit_rds
    type: io.kestra.plugin.scripts.shell.Commands
    description: List RDS instances via describe-db-instances, average DatabaseConnections from CloudWatch over 7 days per instance, and emit counts plus the idle list via the stdout outputs protocol.
    containerImage: python:3.12-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    commands:
      - |
        pip install --quiet awscli 2>/dev/null
        cat > audit.py <<'PYEOF'
        import json, subprocess, datetime, os
        region = os.environ.get("AWS_REGION", "us-east-1")
        threshold = float(os.environ.get("MAX_CONNECTIONS", "2"))
        try:
            out = subprocess.run(["aws", "rds", "describe-db-instances", "--region", region, "--output", "json"], capture_output=True, text=True, timeout=120)
            instances = json.loads(out.stdout or "{}").get("DBInstances", [])
        except Exception:
            instances = []
        idle = []
        checked = len(instances)
        end = datetime.datetime.now(datetime.timezone.utc)
        start = end - datetime.timedelta(days=7)
        for inst in instances:
            name = inst.get("DBInstanceIdentifier", "unknown")
            try:
                cw = subprocess.run(["aws", "cloudwatch", "get-metric-statistics", "--region", region, "--namespace", "AWS/RDS", "--metric-name", "DatabaseConnections", "--dimensions", f"Name=DBInstanceIdentifier,Value={name}", "--start-time", start.strftime("%Y-%m-%dT%H:%M:%SZ"), "--end-time", end.strftime("%Y-%m-%dT%H:%M:%SZ"), "--period", "86400", "--statistics", "Average", "--output", "json"], capture_output=True, text=True, timeout=60)
                points = json.loads(cw.stdout or "{}").get("Datapoints", [])
                avg = sum(p.get("Average", 0) for p in points) / len(points) if points else 0
            except Exception:
                avg = 0
            if avg <= threshold:
                idle.append(f"{name}({avg:.1f})")
        print(f"checked {checked} instance(s), {len(idle)} idle at or below {threshold} avg connections")
        print("::" + json.dumps({"outputs": {"checked": checked, "idle": len(idle), "instances": ",".join(idle[:50])}}) + "::")
        PYEOF
        python3 audit.py
    env:
      AWS_REGION: "{{ inputs.region }}"
      MAX_CONNECTIONS: "{{ inputs.max_connections }}"

  - id: waste_found
    type: io.kestra.plugin.core.flow.If
    description: One branch for waste - any idle instance goes to Slack.
    condition: "{{ outputs.audit_rds.vars.idle > 0 }}"
    then:
      - id: alert_waste
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Name the idle instances so the stop/delete review starts with exact ids.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": ":money_with_wings: RDS idle waste detector ({{ inputs.region }}): {{ outputs.audit_rds.vars.idle }} of {{ outputs.audit_rds.vars.checked }} instance(s) at or below {{ inputs.max_connections }} avg connections over 7d. Idle: {{ outputs.audit_rds.vars.instances }}"
          }
    else:
      - id: log_clean
        type: io.kestra.plugin.core.log.Log
        description: Record the passing audit for the FinOps trail.
        message: "RDS audit clean: {{ outputs.audit_rds.vars.checked }} instance(s) all above the idle threshold."

errors:
  - id: alert_audit_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alert when the audit itself fails - no result must ever read as no waste.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "RDS idle waste detector FAILED in flow {{ flow.id }} (execution {{ execution.id }}). Check AWS credentials and the task logs."
      }

outputs:
  - id: audit_summary
    type: JSON
    description: 'Audit result counts, e.g. {"checked": 6, "idle": 1}'
    value: '{{ {"checked": outputs.audit_rds.vars.checked, "idle": outputs.audit_rds.vars.idle} | toJson }}'

extend:
  title: Detect Idle RDS Instances Burning Hourly Charges
  shortDescription: Weekly check of 7-day average connections per RDS instance, alerting Slack with the idle candidates.
  metaTitle: RDS Idle Instance Waste Detector
  metaDescription: Find RDS instances with near-zero connections over 7 days and alert Slack with the idle list.
  description: |
    A dev database nobody connects to still bills by the hour. This blueprint averages `DatabaseConnections` per RDS instance over 7 days and flags those at or below `max_connections` as idle waste. The schedule ships disabled so you can verify credentials first.

    ## How it works

    1. `audit_rds` (`io.kestra.plugin.scripts.shell.Commands` on the AWS CLI) runs `describe-db-instances`, then `get-metric-statistics` per instance for 7-day average connections, and emits counts plus the idle list via the `::{"outputs": ...}::` protocol.
    2. `waste_found` (`io.kestra.plugin.core.flow.If`) branches: any idle instance -> `alert_waste`; clean -> `log_clean`.
    3. The `errors` block alerts when the audit itself fails.
    4. Triggers: a disabled weekly `Schedule`.

    ## What you get

    - Named list of idle instances with their 7-day average connections.
    - A weekly FinOps sweep with history in every execution.
    - Failure alerts so a dead credential never reads as "no waste".

    ## Who it's for

    - FinOps engineers trimming RDS spend.
    - Platform teams enforcing stop-after-hours or delete-after-review policy.
    - Anyone who spun up "just a quick test db" six months ago.

    ## Why orchestrate this with Kestra

    The AWS CLI answers questions; the flow turns them into a verdict on a schedule, with an alert that names names. The next step (stop-db-instance, snapshot-then-delete, tag the owner) is one task away.

    ## Prerequisites

    - Docker available on the Kestra Worker.
    - AWS credentials with `rds:DescribeDBInstances`, `cloudwatch:GetMetricStatistics` in the environment or an instance profile.
    - A Slack webhook.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: webhook for waste and failure alerts.

    ## Quick start

    1. Add the Slack webhook secret and AWS credentials.
    2. Run once to see `audit_summary`.
    3. Enable the weekly schedule.

    ## How to extend

    - Auto-stop idle instances after a second confirmation week.
    - Snapshot before delete for a safe reclaim path.
    - Join instance class to estimate hourly savings.

    ## Links

    - [RDS DatabaseConnections metric](https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/rds-metrics.html)
    - [Stopping a DB instance](https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_StopInstance.html)

    - This blueprint has been created by [yashspidey](https://github.com/yashspidey)
  tags:
    - Cloud
    - Infrastructure
  subTags:
    - AWS Services
    - FinOps & Cost Management
  ee: false
  demo: false
