id: vat-return-preparation-reconciliation
namespace: company.team

description: |
  Prepare a periodic VAT return from the transaction ledger: assign every line to a return box
  by its tax code, self-assess reverse charge on EU and imported services, check each line's
  VAT against its rate, reconcile the return to the VAT control accounts, compare with the
  same period last year, and lock the period once the return is approved for filing.

inputs:
  - id: period
    type: STRING
    displayName: Period (YYYY-Qn)
    defaults: "2026-Q3"
    validator: ^\d{4}-Q[1-4]$

  - id: scenario
    type: SELECT
    displayName: Demo scenario
    description: >
      ISSUES adds a sale with VAT computed at the wrong rate, a purchase with a tax code the
      mapping does not know, a reverse-charge invoice where the supplier charged VAT, and a
      manual journal straight to the output VAT account. The return must not be filed.
    values:
      - CLEAN
      - ISSUES
    defaults: CLEAN

  - id: rounding_tolerance
    type: FLOAT
    displayName: Line rounding tolerance
    description: Largest difference accepted between a line's VAT and net × rate.
    defaults: 0.02

  - id: approved_by
    type: STRING
    displayName: Approved by
    description: The person who reviews the return before filing.
    defaults: ""

variables:
  lock_key: vat_returns
  pack_dir: "vat/{{ inputs.period }}"

concurrency:
  limit: 1

triggers:
  - id: after_quarter
    type: io.kestra.plugin.core.trigger.Schedule
    description: The 10th of the month after each quarter. Disabled until the ledger is wired in.
    cron: "0 8 10 1,4,7,10 *"
    disabled: true

tasks:
  - id: period_control
    type: io.kestra.plugin.core.output.OutputValues
    values:
      filed: "{{ (kv(vars.lock_key, errorOnMissing=false) ?? {'filed': []}) | jq('.filed') | first | toJson }}"
      year: "{{ inputs.period | split('-Q') | first }}"
      quarter: "{{ inputs.period | split('-Q') | last }}"

  - id: period_gate
    type: io.kestra.plugin.core.flow.If
    condition: "{{ fromJson(outputs.period_control.values.filed) contains inputs.period }}"
    then:
      - id: already_filed
        type: io.kestra.plugin.core.execution.Fail
        errorMessage: "The {{ inputs.period }} return is already filed. Corrections go into the next return or a voluntary disclosure, never into a filed one."

  - id: prepare
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: >
      One DuckDB session: tax codes and boxes, the transaction ledger (demo generator or your
      export), line checks, box totals, reverse charge, the control account reconciliation
      and the comparison with the same quarter last year.
    outputFiles:
      - return
      - lines
      - exceptions
      - reconciliation
    fetchType: FETCH_ONE
    sql: |
      SET VARIABLE q_start = make_date({{ outputs.period_control.values.year }}, ({{ outputs.period_control.values.quarter }} - 1) * 3 + 1, 1);
      SET VARIABLE q_end = (getvariable('q_start') + INTERVAL 3 MONTH - INTERVAL 1 DAY)::DATE;

      -- =======================================================================
      -- Tax codes: rate, and the boxes the net and the VAT go to. The boxes
      -- follow the structure of most EU returns: output VAT, input VAT, net
      -- sales, net purchases, EU supplies and acquisitions. Replace with your
      -- country's return and your ERP's tax codes.
      -- =======================================================================
      CREATE TABLE tax_codes (code VARCHAR, description VARCHAR, side VARCHAR, rate DOUBLE, reverse_charge BOOLEAN,
                              net_box VARCHAR, vat_box VARCHAR, self_assessed_box VARCHAR);
      INSERT INTO tax_codes VALUES
        ('S20', 'Domestic sales, standard rate', 'SALE', 0.20, false, '6', '1', NULL),
        ('S10', 'Domestic sales, reduced rate', 'SALE', 0.10, false, '6', '1', NULL),
        ('S05', 'Domestic sales, super-reduced rate', 'SALE', 0.055, false, '6', '1', NULL),
        ('SEU', 'Intra-EU supply of goods (zero rated)', 'SALE', 0, false, '8', NULL, NULL),
        ('SEX', 'Export outside the EU (zero rated)', 'SALE', 0, false, '6', NULL, NULL),
        ('P20', 'Domestic purchases, standard rate', 'PURCHASE', 0.20, false, '7', '4', NULL),
        ('P10', 'Domestic purchases, reduced rate', 'PURCHASE', 0.10, false, '7', '4', NULL),
        ('PNR', 'Purchases, VAT not recoverable (entertainment)', 'PURCHASE', 0.20, false, '7', NULL, NULL),
        ('PEG', 'Intra-EU acquisition of goods (reverse charge)', 'PURCHASE', 0.20, true, '9', NULL, '2'),
        ('PRS', 'Services from abroad (reverse charge)', 'PURCHASE', 0.20, true, '7', NULL, '1');

      CREATE TABLE boxes (box VARCHAR, label VARCHAR);
      INSERT INTO boxes VALUES ('1', 'VAT due on sales and on reverse-charge services'), ('2', 'VAT due on acquisitions from the EU'),
        ('3', 'Total VAT due (1 + 2)'), ('4', 'VAT reclaimed on purchases and acquisitions'), ('5', 'Net VAT to pay (3 - 4)'),
        ('6', 'Total sales excluding VAT'), ('7', 'Total purchases excluding VAT'), ('8', 'Supplies of goods to EU countries'),
        ('9', 'Acquisitions of goods from EU countries');

      -- =======================================================================
      -- Transaction ledger: every line with a tax code, as posted. Replace with
      -- your ERP's tax report. VAT is the amount posted to the VAT accounts.
      -- =======================================================================
      CREATE TABLE ledger AS
      WITH g AS (
        SELECT i, (DATE '2025-07-01' + ((i * 17) % 460)::INT) AS posted_on,
               ['S20', 'S20', 'S20', 'S10', 'S05', 'SEU', 'SEX', 'P20', 'P20', 'P20', 'P10', 'PNR', 'PEG', 'PRS'][1 + (i * 5 + i // 14) % 14] AS code
        FROM range(1, 4201) t(i)
      )
      SELECT 'DOC-' || lpad(i::VARCHAR, 5, '0') AS doc, posted_on, g.code,
             CASE WHEN tc.side = 'SALE' THEN 'Customer ' || (1 + i % 140) ELSE 'Supplier ' || (1 + i % 90) END AS party,
             round(200 + (i * 7919) % 18000 + ((i * 37) % 100) / 100.0, 2)::DECIMAL(14, 2) AS net,
             CASE WHEN tc.reverse_charge OR tc.rate = 0 THEN 0
                  ELSE round((200 + (i * 7919) % 18000 + ((i * 37) % 100) / 100.0) * tc.rate, 2) END::DECIMAL(14, 2) AS vat,
             'ERP' AS source
      FROM g JOIN tax_codes tc USING (code);
      {% if inputs.scenario == 'ISSUES' %}
      INSERT INTO ledger VALUES
        ('DOC-90001', getvariable('q_start') + 12, 'S20', 'Customer 7', 4800.00, 480.00, 'ERP'),
        ('DOC-90002', getvariable('q_start') + 30, 'P5X', 'Supplier 12', 1250.00, 250.00, 'ERP'),
        ('DOC-90003', getvariable('q_start') + 41, 'PRS', 'Supplier 44', 9000.00, 1800.00, 'ERP'),
        ('JNL-7731', getvariable('q_start') + 60, NULL, 'Manual journal', 0, -3500.00, 'MANUAL');
      {% endif %}

      -- VAT control accounts as the general ledger shows them, movements of the
      -- quarter. Output VAT (credit) includes the self-assessed reverse charge;
      -- input VAT (debit) includes its recovery. Replace with your trial balance.
      CREATE TABLE control_accounts AS
      SELECT '2410' AS account, 'Output VAT' AS name,
             -(sum(l.vat) FILTER (WHERE tc.side = 'SALE' OR l.source = 'MANUAL')
               + coalesce(sum(round(l.net * tc.rate, 2)) FILTER (WHERE tc.reverse_charge), 0))::DECIMAL(14, 2) AS movement
      FROM ledger l LEFT JOIN tax_codes tc USING (code) WHERE l.posted_on BETWEEN getvariable('q_start') AND getvariable('q_end')
      UNION ALL
      SELECT '1410', 'Input VAT',
             (sum(l.vat) FILTER (WHERE (tc.side = 'PURCHASE' AND tc.code <> 'PNR') OR (tc.code IS NULL AND l.source <> 'MANUAL'))
               + coalesce(sum(round(l.net * tc.rate, 2)) FILTER (WHERE tc.reverse_charge), 0))::DECIMAL(14, 2)
      FROM ledger l LEFT JOIN tax_codes tc USING (code) WHERE l.posted_on BETWEEN getvariable('q_start') AND getvariable('q_end');

      -- =======================================================================
      -- The quarter's lines with the checks on each.
      -- =======================================================================
      CREATE TABLE lines AS
      SELECT l.*, tc.side, tc.rate, tc.reverse_charge, tc.net_box, tc.vat_box, tc.self_assessed_box,
             CASE WHEN tc.reverse_charge THEN round(l.net * tc.rate, 2) ELSE 0 END::DECIMAL(14, 2) AS self_assessed,
             CASE
               WHEN l.source = 'MANUAL' THEN 'MANUAL_POSTING_TO_VAT'
               WHEN tc.code IS NULL THEN 'UNKNOWN_TAX_CODE'
               WHEN tc.reverse_charge AND l.vat <> 0 THEN 'VAT_CHARGED_ON_REVERSE_CHARGE'
               WHEN NOT tc.reverse_charge AND abs(l.vat - l.net * tc.rate) > {{ inputs.rounding_tolerance }} THEN 'VAT_DOES_NOT_MATCH_RATE'
             END AS issue
      FROM ledger l LEFT JOIN tax_codes tc USING (code)
      WHERE l.posted_on BETWEEN getvariable('q_start') AND getvariable('q_end');

      CREATE TABLE exceptions AS
      SELECT issue, doc, posted_on, code, party, net, vat,
             CASE issue
               WHEN 'MANUAL_POSTING_TO_VAT' THEN 'A journal posted ' || vat || ' straight to a VAT account without a tax code. It is not on the return. Document it or reverse it'
               WHEN 'UNKNOWN_TAX_CODE' THEN 'Tax code ' || code || ' is not mapped to a box'
               WHEN 'VAT_CHARGED_ON_REVERSE_CHARGE' THEN 'The supplier charged ' || vat || ' VAT on a reverse-charge supply. Ask for a corrected invoice; that VAT is not recoverable'
               ELSE 'VAT ' || vat || ' but ' || round(net * rate, 2) || ' at ' || (rate * 100) || '%'
             END AS detail
      FROM lines WHERE issue IS NOT NULL;

      -- =======================================================================
      -- The return.
      -- =======================================================================
      CREATE TABLE box_values AS
      SELECT box, sum(v)::DECIMAL(14, 2) AS amount FROM (
        SELECT net_box AS box, net AS v FROM lines WHERE net_box IS NOT NULL AND issue IS NULL
        UNION ALL SELECT vat_box, vat FROM lines WHERE vat_box IS NOT NULL AND issue IS NULL
        UNION ALL SELECT self_assessed_box, self_assessed FROM lines WHERE self_assessed_box IS NOT NULL AND issue IS NULL
        -- Reverse charge is recovered in full by a fully taxable business.
        UNION ALL SELECT '4', self_assessed FROM lines WHERE reverse_charge AND issue IS NULL
      ) GROUP BY box;
      INSERT INTO box_values SELECT '3', coalesce(sum(amount), 0) FROM box_values WHERE box IN ('1', '2');
      INSERT INTO box_values SELECT '5', (SELECT amount FROM box_values WHERE box = '3') - coalesce((SELECT amount FROM box_values WHERE box = '4'), 0);

      CREATE TABLE vat_return AS
      SELECT b.box, b.label, coalesce(v.amount, 0)::DECIMAL(14, 2) AS amount FROM boxes b LEFT JOIN box_values v USING (box) ORDER BY b.box::INT;

      -- =======================================================================
      -- Reconciliation: the return against the VAT control accounts. Every
      -- difference must be one of the exceptions above.
      -- =======================================================================
      CREATE TABLE reconciliation AS
      SELECT 'Output VAT' AS item,
             -(SELECT movement FROM control_accounts WHERE account = '2410') AS ledger,
             (SELECT amount FROM vat_return WHERE box = '3') AS vat_return,
             coalesce((SELECT sum(vat) FROM lines WHERE issue IS NOT NULL AND (side = 'SALE' OR source = 'MANUAL')), 0)
               + coalesce((SELECT sum(self_assessed) FROM lines WHERE issue IS NOT NULL AND reverse_charge), 0) AS explained_by_exceptions
      UNION ALL
      SELECT 'Input VAT', (SELECT movement FROM control_accounts WHERE account = '1410'),
             (SELECT amount FROM vat_return WHERE box = '4'),
             coalesce((SELECT sum(vat) FROM lines WHERE issue IS NOT NULL AND (side = 'PURCHASE' OR (side IS NULL AND source <> 'MANUAL'))), 0)
               + coalesce((SELECT sum(self_assessed) FROM lines WHERE issue IS NOT NULL AND reverse_charge), 0);
      ALTER TABLE reconciliation ADD COLUMN unexplained DECIMAL(14, 2);
      UPDATE reconciliation SET unexplained = ledger - vat_return - explained_by_exceptions;

      -- Same quarter last year, for the reviewer's sense check.
      -- Computed with the same box rules as this quarter, so the comparison is like for like.
      CREATE TABLE last_year AS
      SELECT sum(CASE WHEN tc.vat_box = '1' THEN l.vat ELSE 0 END + CASE WHEN tc.self_assessed_box = '1' THEN round(l.net * tc.rate, 2) ELSE 0 END) AS output_vat,
             sum(CASE WHEN tc.vat_box = '4' THEN l.vat ELSE 0 END + CASE WHEN tc.reverse_charge THEN round(l.net * tc.rate, 2) ELSE 0 END) AS input_vat
      FROM ledger l JOIN tax_codes tc USING (code)
      WHERE l.posted_on BETWEEN getvariable('q_start') - INTERVAL 1 YEAR AND getvariable('q_end') - INTERVAL 1 YEAR;

      COPY vat_return TO '{{ outputFiles.return }}' (HEADER, DELIMITER ',');
      COPY (SELECT doc, posted_on, code, party, net, vat, self_assessed, net_box, vat_box, self_assessed_box, issue FROM lines ORDER BY posted_on, doc) TO '{{ outputFiles.lines }}' (HEADER, DELIMITER ',');
      COPY exceptions TO '{{ outputFiles.exceptions }}' (HEADER, DELIMITER ',');
      COPY reconciliation TO '{{ outputFiles.reconciliation }}' (HEADER, DELIMITER ',');

      SELECT
        (SELECT count(*) FROM lines) AS lines,
        (SELECT string_agg('Box ' || box || ' ' || format('{:,.2f}', amount), ', ' ORDER BY box::INT) FROM vat_return) AS boxes,
        (SELECT amount FROM vat_return WHERE box = '5') AS net_vat,
        (SELECT format('{:,.2f}', sum(self_assessed)) FROM lines WHERE issue IS NULL) AS reverse_charge,
        (SELECT format('{:,.2f}', sum(vat)) FROM lines WHERE code = 'PNR') AS irrecoverable,
        (SELECT count(*) FROM exceptions) AS exceptions,
        (SELECT coalesce(string_agg(issue || ' ' || doc || ': ' || detail, '; ' ORDER BY issue, doc), '') FROM exceptions) AS exception_detail,
        (SELECT string_agg(item || ' ledger ' || ledger || ', return ' || vat_return || ', exceptions ' || explained_by_exceptions || ', unexplained ' || unexplained, '; ') FROM reconciliation) AS reconciliation,
        (SELECT count(*) FROM reconciliation WHERE unexplained <> 0) AS unexplained_items,
        coalesce(round(100.0 * ((SELECT amount FROM vat_return WHERE box = '1') / nullif((SELECT output_vat FROM last_year), 0) - 1), 1)::VARCHAR || '%', 'n/a') AS output_vat_vs_last_year_pct,
        coalesce(round(100.0 * ((SELECT amount FROM vat_return WHERE box = '4') / nullif((SELECT input_vat FROM last_year), 0) - 1), 1)::VARCHAR || '%', 'n/a') AS input_vat_vs_last_year_pct;

  - id: result
    type: io.kestra.plugin.core.output.OutputValues
    values:
      r: "{{ (outputs.prepare.outputs | last).row | toJson }}"

  - id: log_return
    type: io.kestra.plugin.core.log.Log
    message: |
      VAT return {{ inputs.period }} ({{ inputs.scenario }}), {{ outputs.result.values.r | jq('.lines') | first }} lines.
      {{ outputs.result.values.r | jq('.boxes') | first }}.
      {{ outputs.result.values.r | jq('"Reverse charge self-assessed and recovered \(.reverse_charge). Irrecoverable VAT left out of box 4: \(.irrecoverable). Against the same quarter last year: output \(.output_vat_vs_last_year_pct), input \(.input_vat_vs_last_year_pct)."') | first }}
      {{ outputs.result.values.r | jq('"Reconciliation: \(.reconciliation)."') | first }}
      {{ outputs.result.values.r | jq('"Exceptions: \(.exceptions). \(.exception_detail)"') | first }}

  - id: evidence
    type: io.kestra.plugin.core.namespace.UploadFiles
    namespace: "{{ flow.namespace }}"
    filesMap:
      "{{ render(vars.pack_dir) }}/vat-return.csv": "{{ outputs.prepare.outputFiles.return }}"
      "{{ render(vars.pack_dir) }}/lines.csv": "{{ outputs.prepare.outputFiles.lines }}"
      "{{ render(vars.pack_dir) }}/exceptions.csv": "{{ outputs.prepare.outputFiles.exceptions }}"
      "{{ render(vars.pack_dir) }}/reconciliation.csv": "{{ outputs.prepare.outputFiles.reconciliation }}"

  - id: decide
    type: io.kestra.plugin.core.flow.Switch
    value: >-
      {%- set r = outputs.result.values.r -%}
      {%- if (r | jq('.unexplained_items') | first) > 0 -%}DOES_NOT_RECONCILE
      {%- elseif (r | jq('.exceptions') | first) > 0 -%}EXCEPTIONS
      {%- elseif inputs.approved_by == '' -%}NEEDS_APPROVAL
      {%- else -%}FILE{%- endif -%}
    cases:
      FILE:
        - id: lock_period
          type: io.kestra.plugin.core.kv.Set
          key: "{{ vars.lock_key }}"
          kvType: JSON
          value: >-
            {{ {'old': (kv(vars.lock_key, errorOnMissing=false) ?? {'filed': [], 'returns': {}}), 'p': inputs.period,
                'net': (outputs.result.values.r | jq('.net_vat') | first), 'by': inputs.approved_by, 'at': now()}
               | jq('{filed: (.old.filed + [.p]), returns: (.old.returns + {(.p): {net_vat: .net, approved_by: .by, approved_at: .at}})}') | first | toJson }}

        - id: log_filed
          type: io.kestra.plugin.core.log.Log
          message: >-
            The {{ inputs.period }} return is approved by {{ inputs.approved_by }}: net VAT {{ outputs.result.values.r | jq('.net_vat') | first }}.
            Submit {{ render(vars.pack_dir) }}/vat-return.csv through your tax authority's API or portal.

      NEEDS_APPROVAL:
        - id: approval_required
          type: io.kestra.plugin.core.execution.Fail
          errorMessage: >-
            The return reconciles to the ledger with no exceptions. Net VAT {{ outputs.result.values.r | jq('.net_vat') | first }}.
            Review {{ render(vars.pack_dir) }}/vat-return.csv and run again with approved_by.

      EXCEPTIONS:
        - id: exceptions_found
          type: io.kestra.plugin.core.execution.Fail
          errorMessage: "The {{ inputs.period }} return cannot be filed: {{ outputs.result.values.r | jq('.exception_detail') | first }}"

    defaults:
      - id: does_not_reconcile
        type: io.kestra.plugin.core.execution.Fail
        errorMessage: "The return does not reconcile to the VAT accounts and no exception explains why: {{ outputs.result.values.r | jq('.reconciliation') | first }}"

extend:
  title: Prepare the VAT return from the ledger and reconcile it to the VAT accounts
  metaTitle: VAT return preparation with reverse charge and reconciliation in Kestra
  shortDescription: Map every ledger line to a VAT return box by tax code, self-assess reverse charge, check each line's VAT against its rate, reconcile to the VAT control accounts and lock filed returns.
  metaDescription: Prepare a quarterly VAT return in Kestra and DuckDB. Box mapping, reverse charge, rate checks, control account reconciliation and filing lock.
  description: |
    Every VAT-registered business files a return each quarter or month, and the tax authority treats each filed return as final. Most errors come from the ledger, not the arithmetic:
    - VAT computed at the wrong rate,
    - a new tax code nobody mapped,
    - a supplier charging VAT on a reverse-charge service,
    - a manual journal posted straight to the VAT account.

    These end up in the return, or create a difference with the ledger that someone explains later, under pressure. This flow builds the return line by line, flags those errors, and only lets a return be filed when it reconciles to the VAT accounts.

    It runs with no setup and no network. DuckDB generates 4,200 ledger lines from July 2025 over ten tax codes:
    - standard, reduced and super-reduced sales;
    - EU supplies and exports;
    - recoverable and irrecoverable purchases;
    - EU acquisitions of goods, and services from abroad under reverse charge.


    ## The return

    The nine boxes follow the structure of most EU returns:

    | Box | Content |
    |---|---|
    | 1 | VAT on sales, plus VAT self-assessed on services from abroad |
    | 2 | VAT self-assessed on EU acquisitions of goods |
    | 3 | Total VAT due (1 + 2) |
    | 4 | VAT reclaimed: recoverable purchases, plus all reverse charge for a fully taxable business |
    | 5 | Net VAT to pay (3 - 4) |
    | 6 / 7 | Net sales / purchases |
    | 8 / 9 | EU supplies / EU acquisitions of goods |

    Each tax code in `tax_codes` names its rate, whether it is reverse charge, and its boxes. Changing country means editing that table and `boxes`.

    ## Line checks

    | Issue | Meaning |
    |---|---|
    | `VAT_DOES_NOT_MATCH_RATE` | VAT differs from net × rate by more than `rounding_tolerance` |
    | `UNKNOWN_TAX_CODE` | A tax code with no box |
    | `VAT_CHARGED_ON_REVERSE_CHARGE` | The supplier charged VAT on a reverse-charge supply. That VAT is not recoverable, so ask for a corrected invoice |
    | `MANUAL_POSTING_TO_VAT` | A journal without a tax code posted to a VAT account |

    Lines with an issue are left out of the return and listed in `exceptions.csv`.

    ## Reconciliation

    The return is reconciled to the VAT control accounts: output VAT (box 3) and input VAT (box 4) against the quarter's movements on 2410 and 1410. Every difference must be explained by the exceptions. A difference left over means the ledger moved for a reason the return does not see, and the return cannot be filed. The same quarter last year, computed with the same box rules, is shown for a sense check.

    A filed quarter is locked in KV. Corrections go into the next return or a voluntary disclosure, never into a filed one.

    ## How it works

    1. `period_control` and `period_gate` refuse a quarter already filed.
    2. `prepare` (`io.kestra.plugin.jdbc.duckdb.Queries`) builds the tax codes, the ledger and the control accounts. It then checks each line and computes the boxes, the reconciliation and the comparison.
    3. `log_return` prints the return. `evidence` stores `vat-return.csv`, `lines.csv` (each line with its boxes), `exceptions.csv` and `reconciliation.csv`.
    4. `decide` (`io.kestra.plugin.core.flow.Switch`):
       - `FILE`: records the filing and the approver.
       - Otherwise it fails: `DOES_NOT_RECONCILE`, `EXCEPTIONS` or `NEEDS_APPROVAL`.

    ## Tested end to end

    On Kestra 2.0.3 OSS.

    | Run | Inputs | Result |
    |---|---|---|
    | 1 | 2026-Q3 | 838 lines. Box 1 522,857.53, box 2 114,120.81, box 4 585,486.51, net VAT to pay 51,491.83. Reverse charge 211,112.54 self-assessed and recovered, 116,747.66 irrecoverable VAT kept out of box 4. Both control accounts reconcile with 0.00 unexplained. Output -3.2% and input -3.9% against Q3 2025. Stops for approval |
    | 2 | same, `approved_by` | Filed and locked |
    | 3 | 2026-Q3 again | Refused: already filed |
    | 4 | 2026-Q2 `ISSUES` | Not filed, 4 exceptions: VAT 480.00 instead of 960.00 at 20%; tax code `P5X` not mapped; 1,800.00 VAT charged on a reverse-charge service; a manual -3,500.00 posting to output VAT. The ledger still reconciles: output -1,220.00 and input 3,850.00 are exactly the exceptions |
    | 5 | 2026-Q4, output VAT account changed by 640.00 | `DOES_NOT_RECONCILE`: 640.00 unexplained |

    I recomputed all nine boxes of run 1 independently in Python from `lines.csv`, and they matched to the cent.

    ## Problems found while testing

    - **Only two tax codes in the demo.** The generator picked codes with `(i * 7) % 14`, which only ever gives 0 or 7, so every line was a standard-rate sale or purchase and reverse charge never appeared. It now walks all ten codes.
    - **The year-on-year check compared different things.** Last year's output VAT left out the self-assessed reverse charge that this year's box 1 includes, which showed +21%. Both sides now use the same box rules.

    ## Inputs

    | Input | Default | Purpose |
    |---|---|---|
    | `period` | `2026-Q3` | `YYYY-Qn`, validated |
    | `scenario` | `CLEAN` | Demo only |
    | `rounding_tolerance` | `0.02` | Per line |
    | `approved_by` | empty | The reviewer |

    ## Use it with your data

    - Replace `ledger` with your ERP's tax report: document, date, tax code, party, net and the VAT posted.
    - Replace `control_accounts` with the quarter's movements on your VAT accounts.
    - Map your tax codes and boxes. For a monthly return, change the period input and the date range.
    - Submit `vat-return.csv` through your authority's API, for example with an HTTP task after `lock_period`.

    ## Things to know

    - Partial exemption, capital goods adjustments, bad debt relief and domestic reverse charge (construction, electronics) need extra codes and boxes.
    - EC Sales Lists and Intrastat use the same lines. Group `lines.csv` by customer VAT number for the EC Sales List.
    - This prepares the return. The filing responsibility stays with the business and its tax adviser.

    ## Links

    - EU VAT Directive, reverse charge: https://taxation-customs.ec.europa.eu/taxation/vat_en
    - DuckDB plugin: https://kestra.io/plugins/plugin-jdbc-duckdb

    This blueprint was created by [zkasuran](https://github.com/zkasuran).
  tags:
    - Business
    - Data
  subTags:
    - Policy & Compliance
    - Approval Gates
  ee: false
  demo: false
