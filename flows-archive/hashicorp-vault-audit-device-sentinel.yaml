id: hashicorp-vault-audit-device-sentinel
namespace: company.security

inputs:
  - id: vault_addr
    type: STRING
    defaults: http://vault.internal:8200
    description: Base URL of the HashiCorp Vault server.

tasks:
  - id: inspect_audit_devices
    type: io.kestra.plugin.scripts.shell.Commands
    runner: PROCESS
    commands:
      - |
        curl -s --header "X-Vault-Token: {{ secret('VAULT_TOKEN') }}"           "{{ inputs.vault_addr }}/v1/sys/audit" > audit_devices.json
        python3 -c "
        import json
        with open('audit_devices.json') as f:
            data = json.load(f)
        devices = [k for k in data.keys() if k]
        has_devices = len(devices) > 0
        result = {
            'vault_addr': '{{ inputs.vault_addr }}',
            'active_devices_count': len(devices),
            'active_devices': devices,
            'alert_triggered': not has_devices
        }
        with open('audit_summary.json', 'w') as out:
            json.dump(result, out)
        print('Vault audit devices:', result)
        "
    outputFiles:
      - audit_summary.json

  - id: evaluate_audit_posture
    type: io.kestra.plugin.core.flow.If
    condition: "{{ fromJson(read(outputs.inspect_audit_devices.outputFiles['audit_summary.json'])).alert_triggered }}"
    then:
      - id: alert_security_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "text": ":rotating_light: *HashiCorp Vault Audit Device Alert*: No active audit devices configured on {{ inputs.vault_addr }}. Critical compliance violation: all secret access requests must be logged to an audit device."
          }

errors:
  - id: notify_sentinel_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "text": ":warning: *Vault Sentinel Failure*: Failed to query audit devices on {{ inputs.vault_addr }}."
      }

triggers:
  - id: daily_audit_device_check
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 8 * * *"
    disabled: true

extend:
  metaDescription: "Audits HashiCorp Vault cluster configuration to ensure active audit devices are enabled for compliance and secret governance."
  metaTitle: HashiCorp Vault Audit Device Enabled and Blocking Sentinel with Kestra
  title: HashiCorp Vault Audit Device Enabled and Blocking Sentinel
  shortDescription: Audits HashiCorp Vault cluster configuration to ensure active audit devices are enabled for compliance and secret governance.
  description: |
    ## How it works
    This sentinel calls the HashiCorp Vault `/v1/sys/audit` API endpoint to verify that at least one audit device (file, syslog, or socket) is registered and active. It alerts SecOps teams if audit logging is accidentally disabled or dropped during configuration drift.

    ## What you get
    - Continuous validation of enterprise compliance logging mandates.
    - Early prevention of audit non-conformities under SOC 2, ISO 27001, and HIPAA.
    - Automated Slack incident delivery indicating configured audit device types.

    ## Who it's for
    - Security operations (SecOps) teams and compliance auditors.
    - Platform engineers maintaining HashiCorp Vault infrastructure.

    ## Why orchestrate this with Kestra
    Kestra automates distributed system observability, executing scheduled health checks with fine-grained error management and notification delivery.

    ## Prerequisites
    - HashiCorp Vault server access.
    - A Vault token with `sudo` or `read` permissions on `sys/audit`.
    - Secrets `VAULT_TOKEN` and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import this blueprint into Kestra.
    2. Configure `vault_addr` and credentials.
    3. Run manually to check current audit devices.

    ## How to extend
    - Verify file audit sink disk space to prevent Vault write blocking when audit logs fill the disk.
    - Enable syslog audit fallback automatically if the primary file device becomes unwriteable.
    - Forward audit device state changes to an immutable compliance archive.

    ## Links
    - [HashiCorp Vault Audit Devices API](https://developer.hashicorp.com/vault/api-docs/system/audit)
    - [Kestra Slack Notifications](https://kestra.io/plugins/plugin-slack)
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Policy & Compliance
    - Monitoring & Alerting
  ee: false
  demo: false
