id: victoriametrics-high-cardinality-and-churn-sentinel
namespace: company.observability

inputs:
  - id: victoriametrics_host
    type: STRING
    required: true
    defaults: "victoriametrics.internal.company.com"
    description: "VictoriaMetrics server hostname or service VIP"

  - id: victoriametrics_port
    type: INT
    required: true
    defaults: 8428
    description: "VictoriaMetrics HTTP API port (default: 8428)"

  - id: max_series_per_metric_threshold
    type: INT
    required: true
    defaults: 100000
    description: "Maximum allowable active time series for a single metric name before alerting"

  - id: max_values_per_label_threshold
    type: INT
    required: true
    defaults: 50000
    description: "Maximum unique values for a single label name before flagging high cardinality"

  - id: slack_channel
    type: STRING
    required: true
    defaults: "#observability-alerts"
    description: "Target Slack channel for VictoriaMetrics cardinality warnings"

triggers:
  - id: periodic_cardinality_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 */4 * * *"

tasks:
  - id: audit_tsdb_cardinality
    type: io.kestra.plugin.scripts.python.Script
    description: "Queries VictoriaMetrics TSDB status endpoint to analyze time series cardinality and label value distributions"
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install kestra
    env:
      VM_HOST: "{{ inputs.victoriametrics_host }}"
      VM_PORT: "{{ inputs.victoriametrics_port }}"
      VM_AUTH_TOKEN: "{{ secret('VICTORIAMETRICS_AUTH_TOKEN') }}"
      METRIC_LIMIT: "{{ inputs.max_series_per_metric_threshold }}"
      LABEL_LIMIT: "{{ inputs.max_values_per_label_threshold }}"
    script: |
      import os
      import sys
      import json
      import urllib.request
      import urllib.error
      from kestra import Kestra

      host = os.environ.get("VM_HOST", "localhost")
      port = int(os.environ.get("VM_PORT", 8428))
      token = os.environ.get("VM_AUTH_TOKEN", "")
      metric_limit = int(os.environ.get("METRIC_LIMIT", 100000))
      label_limit = int(os.environ.get("LABEL_LIMIT", 50000))

      url = f"http://{host}:{port}/api/v1/status/tsdb"
      headers = {"Accept": "application/json"}
      if token:
          headers["Authorization"] = f"Bearer {token}"

      req = urllib.request.Request(url, headers=headers)
      with urllib.request.urlopen(req, timeout=15) as resp:
          payload = json.loads(resp.read().decode("utf-8"))

      data = payload.get("data", {})
      total_series = int(data.get("totalSeries", 0))
      total_label_value_pairs = int(data.get("totalLabelValuePairs", 0))

      metrics_by_series = data.get("seriesCountByMetricName", [])
      labels_by_series = data.get("seriesCountByLabelName", [])

      flagged_metrics = []
      for m in metrics_by_series:
          val = int(m.get("value", 0))
          if val >= metric_limit:
              flagged_metrics.append(f"{m.get('name')}: {val:,} series")

      flagged_labels = []
      for l in labels_by_series:
          val = int(l.get("value", 0))
          if val >= label_limit:
              flagged_labels.append(f"{l.get('name')}: {val:,} values")

      top_metric = metrics_by_series[0].get("name", "none") if metrics_by_series else "none"
      top_metric_count = metrics_by_series[0].get("value", 0) if metrics_by_series else 0

      top_label = labels_by_series[0].get("name", "none") if labels_by_series else "none"
      top_label_count = labels_by_series[0].get("value", 0) if labels_by_series else 0

      is_cardinality_critical = len(flagged_metrics) > 0 or len(flagged_labels) > 0

      if is_cardinality_critical:
          status = "CRITICAL_CARDINALITY_EXPLOSION"
          runbook = (
              "Severe TSDB cardinality churn detected! "
              "1. Identify offending high-entropy tags (e.g. unaggregated user IDs, ephemeral UUIDs). "
              "2. Apply '-metricRelabelConfig' in vmagent or VictoriaMetrics to drop or hash runaway labels. "
              "3. Review application client instrumentation emitting dynamic label sets."
          )
      else:
          status = "HEALTHY"
          runbook = "Metric and label cardinality levels remain within safe TSDB operating limits."

      flagged_metrics_summary = ", ".join(flagged_metrics[:5]) if flagged_metrics else "None"
      flagged_labels_summary = ", ".join(flagged_labels[:5]) if flagged_labels else "None"

      Kestra.outputs({
          "total_series": total_series,
          "total_label_value_pairs": total_label_value_pairs,
          "flagged_metrics_count": len(flagged_metrics),
          "flagged_labels_count": len(flagged_labels),
          "flagged_metrics_summary": flagged_metrics_summary,
          "flagged_labels_summary": flagged_labels_summary,
          "top_metric": top_metric,
          "top_metric_count": top_metric_count,
          "top_label": top_label,
          "top_label_count": top_label_count,
          "is_cardinality_critical": is_cardinality_critical,
          "status": status,
          "runbook": runbook
      })

  - id: evaluate_cardinality_health
    type: io.kestra.plugin.core.flow.If
    description: "Evaluates whether any individual metric or label has breached cardinality ceilings"
    condition: "{{ outputs.audit_tsdb_cardinality.vars.is_cardinality_critical == true }}"
    then:
      - id: notify_slack_cardinality_alert
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: "Dispatches high-urgency alert to Slack with cardinality diagnostics and relabeling runbook"
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "{{ inputs.slack_channel }}",
            "text": "⚠️ *VICTORIAMETRICS HIGH-CARDINALITY ALERT*\n*Status:* `{{ outputs.audit_tsdb_cardinality.vars.status }}`\n*Target:* `{{ inputs.victoriametrics_host }}:{{ inputs.victoriametrics_port }}`\n*Total TSDB Series:* {{ outputs.audit_tsdb_cardinality.vars.total_series }}\n*Top Metric:* `{{ outputs.audit_tsdb_cardinality.vars.top_metric }}` ({{ outputs.audit_tsdb_cardinality.vars.top_metric_count }} series)\n*Top Label:* `{{ outputs.audit_tsdb_cardinality.vars.top_label }}` ({{ outputs.audit_tsdb_cardinality.vars.top_label_count }} values)\n*Flagged Runaway Metrics:* {{ outputs.audit_tsdb_cardinality.vars.flagged_metrics_summary }}\n*Flagged Runaway Labels:* {{ outputs.audit_tsdb_cardinality.vars.flagged_labels_summary }}\n*Runbook Action:* {{ outputs.audit_tsdb_cardinality.vars.runbook }}\n*Execution:* `{{ execution.id }}`"
          }

    else:
      - id: log_healthy_cardinality
        type: io.kestra.plugin.core.log.Log
        description: "Logs healthy cardinality verification when operating below configured limits"
        message: "VictoriaMetrics at {{ inputs.victoriametrics_host }}:{{ inputs.victoriametrics_port }} has healthy cardinality. Total series: {{ outputs.audit_tsdb_cardinality.vars.total_series }}. Top metric: {{ outputs.audit_tsdb_cardinality.vars.top_metric }} ({{ outputs.audit_tsdb_cardinality.vars.top_metric_count }}). Top label: {{ outputs.audit_tsdb_cardinality.vars.top_label }} ({{ outputs.audit_tsdb_cardinality.vars.top_label_count }})."

  - id: finalize_cardinality_telemetry
    type: io.kestra.plugin.core.output.OutputValues
    description: "Publishes final structured telemetry for audit history and capacity planning"
    values:
      execution_id: "{{ execution.id }}"
      endpoint: "{{ inputs.victoriametrics_host }}"
      total_series: "{{ outputs.audit_tsdb_cardinality.vars.total_series }}"
      flagged_metrics: "{{ outputs.audit_tsdb_cardinality.vars.flagged_metrics_count }}"
      flagged_labels: "{{ outputs.audit_tsdb_cardinality.vars.flagged_labels_count }}"
      status: "{{ outputs.audit_tsdb_cardinality.vars.status }}"

errors:
  - id: notify_probe_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: "Alerts SRE team if the VictoriaMetrics TSDB status endpoint is unreachable"
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "{{ inputs.slack_channel }}",
        "text": "🚨 *VICTORIAMETRICS CARDINALITY PROBE FAILED*\n*Target:* `{{ inputs.victoriametrics_host }}:{{ inputs.victoriametrics_port }}`\n*Failure:* Sentinel was unable to query `/api/v1/status/tsdb` or parse cluster cardinality metrics.\n*Execution ID:* `{{ execution.id }}`\n*Flow:* `{{ flow.id }}`"
      }

extend:
  title: VictoriaMetrics TSDB High-Cardinality and Ingestion Churn Sentinel
  metaTitle: VictoriaMetrics TSDB High-Cardinality and Ingestion Churn Sentinel
  shortDescription: Audits VictoriaMetrics TSDB status, detects runaway metric and label cardinality spikes, and alerts Slack with mitigation runbooks.
  metaDescription: Audits VictoriaMetrics TSDB status for runaway metric cardinality and label churn, routing alerts and relabeling runbooks to Slack.
  description: |
    VictoriaMetrics is a high-performance, cost-effective Prometheus long-term remote storage and monitoring solution. However, in dynamic cloud environments, application code or misconfigured instrumentation can emit unaggregated, high-entropy label values (such as customer IDs, dynamic URLs, or UUIDs). This triggers high-cardinality explosions and rapid time series churn, consuming index memory and risking Out-Of-Memory (OOM) crashes.

    This blueprint implements an automated surveillance sentinel that periodically inspects VictoriaMetrics' TSDB status endpoint (`/api/v1/status/tsdb`), measures total active series counts, isolates runaway label names and metric series, and routes contextual capacity warnings and relabeling runbooks to Slack before monitoring outages occur.

    ## How it works

    1. **Scheduled Audit**: The `periodic_cardinality_audit` trigger (`io.kestra.plugin.core.trigger.Schedule`) runs every 4 hours to assess time series growth.
    2. **TSDB Status Inspection**: The `audit_tsdb_cardinality` task (`io.kestra.plugin.scripts.python.Script` inside Docker) queries VictoriaMetrics' `/api/v1/status/tsdb` endpoint, extracting `totalSeries`, top series counts per metric name, and unique value distributions per label key.
    3. **Threshold Gate**: The `evaluate_cardinality_health` task (`io.kestra.plugin.core.flow.If`) evaluates whether any metric series count or unique label value count has breached safety ceilings:
       - **Alert Path**: Dispatches a detailed Slack incident card via `notify_slack_cardinality_alert` (`io.kestra.plugin.slack.notifications.SlackIncomingWebhook`) specifying runaway metric names, offending labels, and `-metricRelabelConfig` mitigation steps.
       - **Healthy Path**: Records healthy telemetry through `log_healthy_cardinality` (`io.kestra.plugin.core.log.Log`).
    4. **Telemetry Export**: The `finalize_cardinality_telemetry` task (`io.kestra.plugin.core.output.OutputValues`) exposes clean outputs for trend tracking and capacity dashboards.
    5. **Pipeline Resilience**: An `errors` handler (`notify_probe_failure`) ensures immediate Slack alerting if VictoriaMetrics is unreachable, network partitions occur, or authentication fails.

    ## What you get

    - Early detection of high-cardinality label leaks before TSDB cache thrashing degrades query latency.
    - Automated identification of specific high-entropy label names for targeted relabeling.
    - Direct Slack notifications enriched with runbook mitigation actions.
    - Complete execution audit trail in Kestra.

    ## Who it's for

    - Observability and Site Reliability Engineers (SREs) maintaining VictoriaMetrics or Prometheus clusters.
    - Platform teams managing Kubernetes monitoring stacks receiving metrics from microservices.
    - DevOps engineers tasked with preventing monitoring infrastructure cost spikes and memory bloat.

    ## Why orchestrate this with Kestra

    Kestra simplifies observability infrastructure governance by combining recurring schedules, isolated containerized script execution, conditional evaluation logic, and enterprise Slack webhooks into a unified execution graph. If a query fails or network connectivity drops, Kestra captures complete execution logs and executes automated fallback alerts without maintaining custom daemons.

    ## Prerequisites

    - A running VictoriaMetrics instance or cluster with HTTP API access (default port 8428).
    - A Slack Incoming Webhook URL configured with permission to post to the alert channel.
    - Docker enabled on Kestra workers to run the Python script container.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Incoming Webhook URL for the target Slack workspace.
    - `VICTORIAMETRICS_AUTH_TOKEN`: (Optional) Bearer authentication token for protected VictoriaMetrics APIs.

    ## Quick start

    1. Store your `SLACK_WEBHOOK_URL` and `VICTORIAMETRICS_AUTH_TOKEN` in your Kestra namespace secrets.
    2. Import this blueprint into your Kestra workspace under namespace `company.observability`.
    3. Trigger a manual execution with your VictoriaMetrics endpoint to verify connectivity and telemetry outputs.
    4. Enable the `periodic_cardinality_audit` trigger to start continuous 4-hour cardinality surveillance.

    ## How to extend

    - Add automated relabeling config generation: dynamically output a suggested `metricRelabelConfig` YAML snippet for `vmagent`.
    - Integrate PagerDuty for critical cardinality spikes exceeding 500,000 series per metric.
    - Chain with a memory usage check against VictoriaMetrics `/metrics` to correlate series churn with process RSS growth.

    ## Links

    - [VictoriaMetrics TSDB Status API Documentation](https://docs.victoriametrics.com/#tsdb-status)
    - [Kestra Python Script Documentation](https://kestra.io/plugins/plugin-scripts-python/io.kestra.plugin.scripts.python.script)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
    - [VictoriaMetrics Cardinality Explorer Overview](https://docs.victoriametrics.com/cardinality_explorer/)
    - This blueprint has been created by [Pranjulchaurasiya](https://github.com/Pranjulchaurasiya)
  tags:
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - CI/CD & Deployment
  ee: false
  demo: false
