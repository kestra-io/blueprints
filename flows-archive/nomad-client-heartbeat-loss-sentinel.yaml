    - [Nomad Client Heartbeat and Liveness Architecture](https://developer.hashicorp.com/nomad/docs/internals/architecture#agent-lifecycle)
    - [Troubleshooting Nomad Node Failures and Drains](https://developer.hashicorp.com/nomad/tutorials/manage-clusters/cluster-maintenance)
