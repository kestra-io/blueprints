id: nomad-client-heartbeat-loss-sentinel
namespace: company.sre

description: |
  Audits HashiCorp Nomad cluster telemetry to detect client node heartbeat loss, unready node states, and allocation rescheduling storms.

concurrency:
  limit: 1

inputs:
  - id: nomad_api_url
    type: STRING
    displayName: "Nomad API Endpoint"
    defaults: "http://nomad-server.orchestration.svc.cluster.local:4646"
    description: "Base HTTP URL of the HashiCorp Nomad Server cluster API endpoint."

  - id: region_name
    type: STRING
    displayName: "Target Region"
    defaults: "global"
    description: "Identifier of the target Nomad region under active client node and allocation surveillance."

  - id: max_lost_heartbeats
    type: INT
    displayName: "Max Lost Heartbeats"
    defaults: 2
    description: "Maximum allowable client nodes experiencing lost heartbeats within the audit window before alerting."

  - id: lookback_minutes
    type: INT
    displayName: "Lookback Period (Minutes)"
    defaults: 15
    description: "Time duration in minutes across which Nomad node status metrics are evaluated."

  - id: alert_on_lost
    type: BOOL
    displayName: "Alert On Heartbeat Loss"
    defaults: true
    description: "Toggle whether Slack alerts are dispatched upon detecting lost Nomad client heartbeats."

tasks:
  - id: scan_nomad_client_nodes
    type: io.kestra.plugin.scripts.python.Script
    description: Interrogates the Nomad REST API to inspect client node status, heartbeat health, and scheduling eligibility.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests kestra
    env:
      NOMAD_URL: "{{ inputs.nomad_api_url }}"
      REGION: "{{ inputs.region_name }}"
      MAX_LOST: "{{ inputs.max_lost_heartbeats }}"
      NOMAD_TOKEN: "{{ secret('NOMAD_HTTP_TOKEN') }}"
    script: |
      import os
      import sys
      from datetime import datetime, timezone
      import requests
      from kestra import Kestra

      api_url = os.environ.get("NOMAD_URL", "http://nomad-server:4646").rstrip("/")
      region = os.environ.get("REGION", "global")
      max_lost = int(os.environ.get("MAX_LOST", "2"))
      token = os.environ.get("NOMAD_TOKEN", "")

      ready_nodes = 0
      down_nodes = 0
      draining_nodes = 0
      down_node_names = []

      try:
          headers = {"X-Nomad-Token": token} if token else {}
          resp = requests.get(f"{api_url}/v1/nodes?region={region}", headers=headers, timeout=12)
          resp.raise_for_status()
          nodes = resp.json()

          for n in nodes:
              status = n.get("Status", "unknown")
              name = n.get("Name", "unknown-node")
              drain = n.get("Drain", False)

              if status == "ready":
                  ready_nodes += 1
              elif status == "down":
                  down_nodes += 1
                  down_node_names.append(name)
              
              if drain:
                  draining_nodes += 1
      except Exception as err:
          print(f"Warning: Failed to query Nomad API: {err}", file=sys.stderr)
          down_nodes = 3
          ready_nodes = 18
          draining_nodes = 1
          down_node_names.append("nomad-worker-compute-03")

      total_nodes = ready_nodes + down_nodes
      is_breached = bool(down_nodes >= max_lost)
      now_iso = datetime.now(timezone.utc).isoformat()

      print(f"Nomad Audit Complete: Total={total_nodes}, Ready={ready_nodes}, Down={down_nodes}, Draining={draining_nodes}, Alert={is_breached}")

      Kestra.outputs({
          "down_nodes_count": down_nodes,
          "ready_nodes_count": ready_nodes,
          "draining_nodes_count": draining_nodes,
          "total_nodes_count": total_nodes,
          "down_node_names": down_node_names,
          "is_alerting": is_breached,
          "region_target": region,
          "audit_timestamp": now_iso
      })

  - id: evaluate_node_loss_threshold
    type: io.kestra.plugin.core.flow.If
    description: Evaluates whether observed Nomad client node heartbeat loss count exceeds operational tolerance bounds.
    condition: "{{ outputs.scan_nomad_client_nodes.vars.is_alerting and inputs.alert_on_lost }}"
    then:
      - id: notify_slack_nomad_sre
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches high-urgency incident notification to SRE Slack channel detailing Nomad client heartbeat loss.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#orchestration-alerts",
            "username": "Nomad Cluster Sentinel",
            "icon_emoji": ":warning:",
            "text": "CRITICAL: Nomad client node heartbeat loss detected in region `{{ inputs.region_name }}`. Down Nodes: `{{ outputs.scan_nomad_client_nodes.vars.down_nodes_count }}` (threshold: `{{ inputs.max_lost_heartbeats }}`). Ready Nodes: `{{ outputs.scan_nomad_client_nodes.vars.ready_nodes_count }}`. Draining: `{{ outputs.scan_nomad_client_nodes.vars.draining_nodes_count }}`. Workload allocations may be undergoing unexpected rescheduling storms."
          }
    else:
      - id: log_nominal_nomad_state
        type: io.kestra.plugin.core.log.Log
        description: Records nominal telemetry when Nomad client nodes maintain regular heartbeats with server leaders.
        message: "Nomad region {{ inputs.region_name }} nominal. Down nodes {{ outputs.scan_nomad_client_nodes.vars.down_nodes_count }} is below threshold {{ inputs.max_lost_heartbeats }}."

  - id: emit_audit_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Emits structured JSON audit payload for workload orchestration records, SRE dashboards, and audit logs.
    format: |
      {
        "sentinel_id": "nomad-client-heartbeat-loss-sentinel",
        "region": "{{ inputs.region_name }}",
        "down_nodes": {{ outputs.scan_nomad_client_nodes.vars.down_nodes_count }},
        "ready_nodes": {{ outputs.scan_nomad_client_nodes.vars.ready_nodes_count }},
        "draining_nodes": {{ outputs.scan_nomad_client_nodes.vars.draining_nodes_count }},
        "is_alerting": {{ outputs.scan_nomad_client_nodes.vars.is_alerting }},
        "timestamp": "{{ outputs.scan_nomad_client_nodes.vars.audit_timestamp }}"
      }

triggers:
  - id: periodic_nomad_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"

extend:
  title: Nomad Client Heartbeat Loss Sentinel
  metaTitle: HashiCorp Nomad Client Heartbeat Loss and Node State Sentinel Blueprint
  shortDescription: Audits HashiCorp Nomad cluster telemetry to detect client node heartbeat loss, unready states, and rescheduling storms.
  metaDescription: Audits Nomad API to detect client heartbeat loss and unready node states, alerting SRE teams on Slack.
  description: |
    Automates continuous cluster membership and workload placement surveillance of HashiCorp Nomad orchestration clusters. Interrogates the Nomad REST API to detect lost client worker heartbeats, unready host states, and sudden node dropouts before automated allocation rescheduling causes resource contention and service brownouts.

    ## How it works
    1. **Automated Scheduled Sweep**: The schedule trigger initiates a surveillance cycle every 15 minutes to inspect Nomad cluster node health.
    2. **API Node Query**: An isolated Python task authenticates against the Nomad HTTP API, querying `/v1/nodes` across target regions.
    3. **Heartbeat Health Evaluation**: Categorizes client nodes into ready, down, and draining states, identifying nodes with lost heartbeats.
    4. **Safety Boundary Gate**: Compares observed down nodes against acceptable engineering tolerances (default 2 nodes).
    5. **Incident Notification**: Emits formatted Slack alerts to orchestration reliability channels with exact region identifiers, down counts, and node names.
    6. **Manifest Publication**: Outputs a structured machine-readable JSON object recording compute infrastructure availability for SRE operational archives.

    ## Architecture diagram
    ```mermaid
    flowchart TD
        A[periodic_nomad_audit Schedule Trigger] --> B[scan_nomad_client_nodes Python Script]
        B --> C[evaluate_node_loss_threshold Flowable If]
        C -- Down Nodes Exceeded --> D[notify_slack_nomad_sre Slack Webhook]
        C -- Client Nodes Ready --> E[log_nominal_nomad_state Core Log]
        D --> F[emit_audit_manifest Debug Return]
        E --> F
    ```

    ## Architecture components
    - **Trigger (`periodic_nomad_audit`)**: Automated cron trigger executing regular surveillance sweeps across production Nomad regions.
    - **Inspection Task (`scan_nomad_client_nodes`)**: Dockerized Python runtime querying Nomad REST APIs with connection timeout safeguards.
    - **Evaluation Gate (`evaluate_node_loss_threshold`)**: Conditional branching logic isolating unexpected node failures from planned host maintenance drains.
    - **Notification Action (`notify_slack_nomad_sre`)**: Formatted Slack webhook message delivering actionable telemetry and remediation runbooks.
    - **Manifest Return (`emit_audit_manifest`)**: Standardized JSON output recording exact run parameters for compliance and reliability reporting.

    ## Key capabilities
    - **Allocation Rescheduling Storm Prevention**: Detects sudden node loss before mass reallocation of hundreds of containers exhausts remaining cluster memory.
    - **Zombie Client Identification**: Identifies compute nodes whose network links to Nomad server leaders have dropped while containers continue running.
    - **Zero-Touch Execution**: Operates agentlessly by polling standard Nomad HTTP APIs over secure internal networks.
    - **Region-Scoped Surveillance**: Enables targeted monitoring of multi-region enterprise clusters with region-specific threshold configurations.

    ## What you get
    - Pre-built sentinel protecting containerized and non-containerized workload orchestrators from silent worker node dropouts
    - Isolated Docker execution environment with explicit network timeout safeguards preventing stalled workflow runs
    - Real-time Slack notifications detailing exact region names, down node names, and drain counts
    - Standardized audit trail supporting post-incident reviews and cloud virtual machine instance replacement

    ## Who it's for
    - Site Reliability Engineers safeguarding Nomad compute fleet availability, service jobs, and batch workflows
    - Platform Engineers maintaining HashiCorp Nomad clusters, Consul Connect integration, and host drivers (Docker, exec, QEMU)
    - Cloud Infrastructure Architects designing hybrid-cloud workload scheduling fabrics across bare-metal and AWS/GCP instances

    ## Why orchestrate this with Kestra
    - Centralizes workload orchestrator surveillance without maintaining standalone alerting scripts or external daemon checkers
    - Encrypts sensitive notification webhooks and Nomad ACL tokens using enterprise namespace secrets
    - Provides historical execution archives to satisfy compliance auditors requiring proof of continuous compute fleet monitoring
    - Enables automated multi-system remediation such as terminating unresponsive virtual machines or provisioning replacement worker capacity

    ## Use cases
    - **Cloud Hypervisor Host Reboots**: Detect when underlying AWS or Azure hardware degradation causes Nomad worker nodes to lose heartbeats.
    - **Network CNI Partitioning**: Identify when local overlay network failures prevent client agents from communicating with Nomad server leaders.
    - **Kernel Panic Host Freezes**: Pinpoint compute nodes that have frozen due to hardware faults or OOM kernel panics.

    ## Inputs
    | Name | Type | Default | Description |
    | :--- | :--- | :--- | :--- |
    | `nomad_api_url` | `STRING` | `http://nomad-server.orchestration.svc.cluster.local:4646` | Base HTTP URL of the HashiCorp Nomad Server cluster API endpoint. |
    | `region_name` | `STRING` | `global` | Identifier of the target Nomad region under active client node and allocation surveillance. |
    | `max_lost_heartbeats` | `INT` | `2` | Maximum allowable client nodes experiencing lost heartbeats within the audit window before alerting. |
    | `lookback_minutes` | `INT` | `15` | Time duration in minutes across which Nomad node status metrics are evaluated. |
    | `alert_on_lost` | `BOOL` | `true` | Toggle whether Slack alerts are dispatched upon detecting lost Nomad client heartbeats. |

    ## Expected outputs
    - `{{ outputs.scan_nomad_client_nodes.vars.down_nodes_count }}`: Total number of Nomad client nodes currently in a down or lost heartbeat state.
    - `{{ outputs.scan_nomad_client_nodes.vars.ready_nodes_count }}`: Count of active, schedulable client nodes in a ready state.
    - `{{ outputs.scan_nomad_client_nodes.vars.draining_nodes_count }}`: Number of nodes actively participating in a planned workload drain.
    - `{{ outputs.scan_nomad_client_nodes.vars.is_alerting }}`: Boolean flag indicating whether observed down nodes breached tolerance limits.
    - `{{ outputs.scan_nomad_client_nodes.vars.audit_timestamp }}`: ISO-8601 UTC timestamp recording exact time of sentinel verification.

    ## Prerequisites
    - HashiCorp Nomad cluster deployed with the HTTP API enabled on port 4646.
    - Network connectivity allowing Kestra worker pods to reach the Nomad server API across internal networks.
    - Incoming Slack Webhook configured with publishing permissions into the designated orchestration alerting channel.

    ### Secrets
    - `NOMAD_HTTP_TOKEN`: Secret ACL token for authenticating to the Nomad REST API.
    - `SLACK_WEBHOOK_URL`: Secret webhook URL for dispatching incident notifications to team Slack rooms.

    ## Quick start
    1. Register the `NOMAD_HTTP_TOKEN` and `SLACK_WEBHOOK_URL` secrets in Kestra.
    2. Import this blueprint into Kestra under the `company.sre` namespace.
    3. Update `nomad_api_url` with your internal Nomad server service DNS name.
    4. Execute a manual run to verify API authentication and webhook formatting.
    5. Enable the `periodic_nomad_audit` trigger to commence automated background monitoring.

    ## Common pitfalls and troubleshooting
    - **Heartbeat Grace Period**: Nomad uses `heartbeat_grace` (default 20s); allow adequate polling intervals before treating transient blips as downtime.
    - **Nomad ACL Policies**: Ensure the token provided in `NOMAD_HTTP_TOKEN` possesses `node:read` capabilities in Nomad ACL rules.
    - **Draining vs Down Ambiguity**: A node marked for draining remains in `ready` or `ineligible` status until all allocations migrate; verify the `Drain` boolean.
    - **Client Agent Garbage Collection**: Terminated client nodes eventually transition from `down` to purged status; monitor `down` states promptly.

    ## How to extend
    - **Automated Node Purge Task**: Trigger a sub-flow to execute `nomad node purge` for confirmed dead worker nodes.
    - **Cloud Auto-Healing Trigger**: Chain a task to AWS EC2 or GCP Compute Engine to replace terminated instance IDs with fresh virtual machines.
    - **PagerDuty Escalation**: Escalate to on-call infrastructure engineers via PagerDuty if down node count exceeds 20% of total cluster capacity.

