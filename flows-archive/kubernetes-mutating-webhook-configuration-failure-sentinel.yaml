    - [Kubernetes Dynamic Admission Control Documentation](https://kubernetes.io/docs/reference/access-authn-authz/extensible-admission-controllers/)
    - [Kubernetes API Server Metrics Reference](https://kubernetes.io/docs/reference/instrumentation/metrics/)
    - [Troubleshooting Kubernetes Admission Webhooks](https://kubernetes.io/docs/reference/access-authn-authz/extensible-admission-controllers/#troubleshooting-admission-webhooks)
