id: ebs-unattached-volume-waste-detector
namespace: company.team
description: |
  Detect EBS volumes in available (unattached) state that still bill for
  provisioned storage, and alert Slack with the reclaimable volume list.

triggers:
  - id: weekly_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: Weekly sweep catches volumes detached and forgotten. Shipped disabled; enable after a manual run verifies AWS credentials.
    cron: "0 8 * * 1"
    disabled: true

inputs:
  - id: region
    type: STRING
    defaults: "us-east-1"
    description: AWS region to audit.

tasks:
  - id: audit_volumes
    type: io.kestra.plugin.scripts.shell.Commands
    description: List EBS volumes via describe-volumes, filter to available state, and emit counts plus volume/size list via the stdout outputs protocol.
    containerImage: python:3.12-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    commands:
      - |
        pip install --quiet awscli 2>/dev/null
        cat > audit.py <<'PYEOF'
        import json, subprocess, os
        region = os.environ.get("AWS_REGION", "us-east-1")
        try:
            out = subprocess.run(["aws", "ec2", "describe-volumes", "--region", region, "--output", "json"], capture_output=True, text=True, timeout=120)
            volumes = json.loads(out.stdout or "{}").get("Volumes", [])
        except Exception:
            volumes = []
        checked = len(volumes)
        unattached = [f"{v.get('VolumeId', '?')}({v.get('Size', 0)}GiB)" for v in volumes if v.get("State") == "available"]
        try:
            total_gib = sum(int(v.get("Size", 0)) for v in volumes if v.get("State") == "available")
        except Exception:
            total_gib = 0
        print(f"checked {checked} volume(s), {len(unattached)} unattached totaling {total_gib}GiB")
        print("::" + json.dumps({"outputs": {"checked": checked, "unattached": len(unattached), "gib": total_gib, "volumes": ",".join(unattached[:50])}}) + "::")
        PYEOF
        python3 audit.py
    env:
      AWS_REGION: "{{ inputs.region }}"

  - id: waste_found
    type: io.kestra.plugin.core.flow.If
    description: One branch for waste - any unattached volume goes to Slack.
    condition: "{{ outputs.audit_volumes.vars.unattached > 0 }}"
    then:
      - id: alert_waste
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Name the unattached volumes so cleanup starts with exact ids.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": ":money_with_wings: EBS volume waste detector ({{ inputs.region }}): {{ outputs.audit_volumes.vars.unattached }} of {{ outputs.audit_volumes.vars.checked }} volume(s) unattached, {{ outputs.audit_volumes.vars.gib }}GiB billable. Volumes: {{ outputs.audit_volumes.vars.volumes }}"
          }
    else:
      - id: log_clean
        type: io.kestra.plugin.core.log.Log
        description: Record the passing audit for the FinOps trail.
        message: "EBS volume audit clean: {{ outputs.audit_volumes.vars.checked }} volume(s) all attached."

errors:
  - id: alert_audit_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alert when the audit itself fails - no result must ever read as no waste.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "EBS volume waste detector FAILED in flow {{ flow.id }} (execution {{ execution.id }}). Check AWS credentials and the task logs."
      }

outputs:
  - id: audit_summary
    type: JSON
    description: 'Audit result counts, e.g. {"checked": 20, "unattached": 2}'
    value: '{{ {"checked": outputs.audit_volumes.vars.checked, "unattached": outputs.audit_volumes.vars.unattached} | toJson }}'

extend:
  title: Detect Unattached EBS Volumes Billing for Nothing
  shortDescription: Weekly sweep of EBS volumes in available state, alerting Slack with the billable volume list.
  metaTitle: EBS Unattached Volume Waste Detector
  metaDescription: Find unattached EBS volumes still billing for storage and alert Slack with the reclaim list.
  description: |
    A detached volume keeps billing until it is deleted. This blueprint lists EBS volumes, flags those in `available` state, totals the billable GiB, and alerts Slack with the exact volume ids. The schedule ships disabled so you can verify credentials first.

    ## How it works

    1. `audit_volumes` (`io.kestra.plugin.scripts.shell.Commands` on the AWS CLI) runs `describe-volumes`, filters to `available` state, and emits counts, total GiB, and the volume list via the `::{"outputs": ...}::` protocol.
    2. `waste_found` (`io.kestra.plugin.core.flow.If`) branches: any unattached volume -> `alert_waste`; clean -> `log_clean`.
    3. The `errors` block alerts when the audit itself fails.
    4. Triggers: a disabled weekly `Schedule`.

    ## What you get

    - Named list of unattached volumes with sizes and total billable GiB.
    - A weekly FinOps sweep with history in every execution.
    - Failure alerts so a dead credential never reads as "no waste".

    ## Who it's for

    - FinOps engineers trimming EBS spend.
    - Platform teams enforcing detach-then-delete hygiene.
    - Anyone with a graveyard of leftover data disks.

    ## Why orchestrate this with Kestra

    The AWS CLI answers questions; the flow turns them into a verdict on a schedule, with an alert that names names. The next step (snapshot-then-delete-volume, tag the owner, open a ticket) is one task away.

    ## Prerequisites

    - Docker available on the Kestra Worker.
    - AWS credentials with `ec2:DescribeVolumes` in the environment or an instance profile.
    - A Slack webhook.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: webhook for waste and failure alerts.

    ## Quick start

    1. Add the Slack webhook secret and AWS credentials.
    2. Run once to see `audit_summary`.
    3. Enable the weekly schedule.

    ## How to extend

    - Snapshot-then-delete after a second confirmation week.
    - Join volume age via `CreateTime` to prioritize the oldest waste.
    - Multiply GiB by per-GB-month price for a dollar figure.

    ## Links

    - [describe-volumes](https://docs.aws.amazon.com/cli/latest/reference/ec2/describe-volumes.html)
    - [EBS pricing](https://aws.amazon.com/ebs/pricing/)

    - This blueprint has been created by [yashspidey](https://github.com/yashspidey)
  tags:
    - Cloud
    - Infrastructure
  subTags:
    - AWS Services
    - FinOps & Cost Management
  ee: false
  demo: false
