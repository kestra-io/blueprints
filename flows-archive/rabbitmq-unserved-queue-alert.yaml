id: rabbitmq-unserved-queue-alert
namespace: company.team
description: |
  Poll the RabbitMQ Management API to monitor queue health, detect unserved queues
  when messages accumulate with zero active consumers, identify unacknowledged message spikes,
  and dispatch actionable alerts to Slack before message broker buffers exhaust.

triggers:
  - id: scheduled_check
    type: io.kestra.plugin.core.trigger.Schedule
    description: Periodic queue health inspection. Shipped disabled by default.
    cron: "*/15 * * * *"
    disabled: true

  - id: manual_webhook
    type: io.kestra.plugin.core.trigger.Webhook
    description: Authenticated webhook trigger for on-demand triage or CI/CD testing.
    key: "{{ secret('WEBHOOK_KEY') }}"

inputs:
  - id: rabbitmq_host
    type: STRING
    displayName: RabbitMQ Host
    description: Hostname or network address of the RabbitMQ server.
    defaults: rabbitmq

  - id: management_port
    type: INT
    displayName: Management Port
    description: HTTP port of the RabbitMQ Management API.
    defaults: 15672

  - id: min_ready_messages
    type: INT
    displayName: Unserved Message Threshold
    description: Minimum number of ready messages waiting in queue before zero-consumer state triggers an alert.
    defaults: 100

  - id: max_unack_messages
    type: INT
    displayName: Unacknowledged Message Threshold
    description: Maximum in-flight unacknowledged messages allowed before flagging worker deadlock or processing stalls.
    defaults: 500

tasks:
  - id: fetch_queue_metrics
    type: io.kestra.plugin.core.http.Request
    description: Query the RabbitMQ Management API to retrieve live queue statistics across all virtual hosts.
    uri: "http://{{ inputs.rabbitmq_host }}:{{ inputs.management_port }}/api/queues"
    method: GET
    headers:
      Authorization: "Basic {{ (secret('RABBITMQ_USERNAME') ~ ':' ~ secret('RABBITMQ_PASSWORD')) | base64encode }}"
      Accept: application/json

  - id: filter_unserved_queues
    type: io.kestra.plugin.core.output.OutputValues
    description: Parse queue metrics and filter for unserved queues or unacknowledged message backlogs.
    values:
      stalled_queues: "{{ outputs.fetch_queue_metrics.body | jq('[.[] | select((((.messages_ready // .messages // 0) >= ' ~ inputs.min_ready_messages ~ ') and ((.consumers // 0) == 0)) or ((.messages_unacknowledged // 0) >= ' ~ inputs.max_unack_messages ~ ')) | {name: .name, vhost: .vhost, ready: (.messages_ready // .messages // 0), unack: (.messages_unacknowledged // 0), consumers: (.consumers // 0)}]') | first }}"
      total_queues_scanned: "{{ outputs.fetch_queue_metrics.body | jq('length') | first }}"
      audited_at: "{{ now() }}"

  - id: evaluate_unserved_queues
    type: io.kestra.plugin.core.flow.If
    description: Branch conditionally based on whether any queues breached unserved or backlog limits.
    condition: "{{ (outputs.filter_unserved_queues.values.stalled_queues | length) > 0 }}"
    then:
      - id: notify_slack_alert
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatch high-priority Slack notification detailing unserved queues and missing consumers.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        messageText: |
          :warning: *RabbitMQ Unserved Queue Alert* — Host: `{{ inputs.rabbitmq_host }}`
          *Execution:* `{{ execution.id }}`
          *Impacted Queues:* `{{ outputs.filter_unserved_queues.values.stalled_queues | length }}` queue(s) have unconsumed backlogs or zero active workers.

          *Stalled Queues:*
          {% for queue in outputs.filter_unserved_queues.values.stalled_queues %}- *`{{ queue.vhost }}/{{ queue.name }}`*: {{ queue.ready }} ready messages ({{ queue.consumers }} consumers) | {{ queue.unack }} unacknowledged in-flight
          {% endfor %}

          *Remediation:* Check worker pod health, restart crashed consumer containers, or scale consumer replica count.
    else:
      - id: log_healthy_queues
        type: io.kestra.plugin.core.log.Log
        description: Record healthy status when all queues have active workers and normal depth.
        message: "RabbitMQ health check passed: all {{ outputs.filter_unserved_queues.values.total_queues_scanned }} queues have active consumers and normal message depths."

errors:
  - id: alert_on_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alerts on-call engineers if the RabbitMQ Management API is unreachable or authentication fails.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    messageText: |
      :rotating_light: *RabbitMQ Queue Monitor FAILED*
      *Workflow:* `{{ flow.id }}` in namespace `{{ flow.namespace }}`
      *Execution:* `{{ execution.id }}`
      *Target Host:* `{{ inputs.rabbitmq_host }}:{{ inputs.management_port }}`
      Failed to connect to the RabbitMQ Management API. Please verify host accessibility and credentials.

extend:
  title: RabbitMQ Unserved Queue and Backlog Alert
  shortDescription: Monitor RabbitMQ queues for unserved backlogs and missing consumers via the Management API, alerting via Slack.
  metaTitle: RabbitMQ Unserved Queue and Backlog Alert with Kestra
  metaDescription: Monitor RabbitMQ queues for unserved backlogs and missing consumers with Kestra. Query the Management API, detect dead workers, and alert via Slack.
  description: |
    In event-driven architectures and microservice ecosystems, message queues buffer critical tasks such as payments, order processing, and email deliveries. A frequent silent outage occurs when consumer worker containers crash, hang, or hit memory limits, leaving queues completely unserved with zero active workers (`consumers == 0`). Meanwhile, upstream services continue publishing messages, causing queues to swell unnoticed until broker memory limits trigger alarms or drop messages.

    Similarly, downstream database deadlocks or slow third-party APIs can cause in-flight messages to remain unacknowledged for long periods, tying up connection channels and degrading throughput.

    This blueprint polls the RabbitMQ Management HTTP API on a schedule or via webhook. It filters all queues across virtual hosts to identify unserved queues with accumulated ready messages and zero consumers, as well as queues with abnormal unacknowledged message spikes. When thresholds are breached, it dispatches an actionable Slack notification detailing the offending queues, backlog numbers, and worker states.

    ## How it works

    1. `fetch_queue_metrics` (`io.kestra.plugin.core.http.Request`) sends an authenticated `GET` request to `/api/queues` on the RabbitMQ Management HTTP API, returning a JSON array of all active queues.
    2. `filter_unserved_queues` (`io.kestra.plugin.core.output.OutputValues`) parses the response using null-safe `jq` expressions to filter queues where `messages_ready >= inputs.min_ready_messages` and `consumers == 0` (unserved), or where `messages_unacknowledged >= inputs.max_unack_messages` (stuck workers).
    3. `evaluate_unserved_queues` (`io.kestra.plugin.core.flow.If`) evaluates whether any stalled queues were identified:
       - If true, `notify_slack_alert` (`io.kestra.plugin.slack.notifications.SlackIncomingWebhook`) sends a formatted Slack notification listing queue names, virtual hosts, ready message counts, and consumer counts.
       - If false, `log_healthy_queues` (`io.kestra.plugin.core.log.Log`) records that all queues are operating within normal limits.
    4. `alert_on_failure` in the `errors` block dispatches a Slack alert if the RabbitMQ management endpoint times out or authentication fails.

    ## What you get

    - Automated detection of dead consumer workers before message backlogs overflow broker RAM.
    - Proactive alerts for worker thread stalls and unacknowledged message deadlocks.
    - Complete execution history of queue depths across all virtual hosts.
    - Zero local agent installation—communicates directly over the standard RabbitMQ Management HTTP API.

    ## Who it's for

    - Platform Engineers and SREs overseeing event-driven distributed systems.
    - Backend Developers maintaining asynchronous worker fleets and payment/order queues.
    - DevOps teams standardizing message broker observability and alerting.

    ## Why orchestrate this with Kestra

    Monitoring queue health through custom bash cron scripts or standalone monitoring tools often creates observability silos without execution lineage, centralized secrets, or reliable failure alerting. Kestra provides native HTTP and Slack integration, declarative YAML configuration, secure credential management, and dual scheduled and webhook triggers in a single unified workflow.

    ## Prerequisites

    - A running RabbitMQ cluster with the `rabbitmq_management` plugin enabled.
    - Read access credentials for the RabbitMQ Management API.
    - Slack incoming webhook URL for notifications.

    ### Secrets

    - `RABBITMQ_USERNAME`: Username with monitoring permissions on the RabbitMQ Management API.
    - `RABBITMQ_PASSWORD`: Password for authentication.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook destination URL.
    - `WEBHOOK_KEY`: Secret authentication key for the manual webhook trigger.

    ## Quick start

    1. Configure `RABBITMQ_USERNAME`, `RABBITMQ_PASSWORD`, `SLACK_WEBHOOK_URL`, and `WEBHOOK_KEY` in your Kestra namespace secrets.
    2. Adjust `rabbitmq_host`, `management_port`, and threshold inputs to match your broker environment.
    3. Run a manual execution in the Kestra UI to verify API connectivity.
    4. Enable the `scheduled_check` trigger to run automated inspections every 15 minutes.

    ## How to extend

    - Add an automated scaling trigger (e.g. Kubernetes Deployment scale up) when unserved queues are detected.
    - Forward historical queue depth metrics to Prometheus or Elasticsearch for capacity planning.
    - Add per-queue routing keys or dedicated Slack channels for different domain teams.

    ## Links

    - [RabbitMQ Management Plugin Documentation](https://www.rabbitmq.com/docs/management)
    - [Kestra HTTP Plugin Documentation](https://kestra.io/plugins/plugin-core/tasks/http/io.kestra.plugin.core.http.request)
    - [Kestra Slack Notifications Plugin](https://kestra.io/plugins/plugin-slack)
    - This blueprint has been created by [sheikhlimon](https://github.com/sheikhlimon)
  tags:
    - Infrastructure
  subTags:
    - Realtime & Streaming
    - Monitoring & Alerting
  ee: false
  demo: false
