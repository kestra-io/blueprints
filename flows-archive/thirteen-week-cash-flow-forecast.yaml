id: thirteen-week-cash-flow-forecast
namespace: company.team

description: |
  Treasury's 13-week direct cash flow forecast, rebuilt every Monday from the receivables,
  payables and commitments on file: receipts from each customer's own payment behaviour,
  new sales collected on the historical collection curve, supplier payments on the payment-run
  calendar, payroll, taxes, debt service and capex. It shows the cash low point against the
  minimum, sizes the revolver draw needed, and measures how accurate past forecasts were, week
  by week and by horizon, against what the bank actually showed.

inputs:
  - id: week_start
    type: STRING
    displayName: Forecast week (a Monday)
    defaults: "2026-10-05"
    validator: ^\d{4}-\d{2}-\d{2}$

  - id: scenario
    type: SELECT
    displayName: Scenario
    description: >
      BASE: customers pay as they have been paying. DOWNSIDE: every customer pays 15 days later,
      the largest customer pays half of its open invoices beyond the horizon, and new sales
      fall 20%. ISSUES: the bank does not reconcile to the ledger, a supplier invoice is
      entered twice and a customer has no payment terms, which must stop the forecast.
    values:
      - BASE
      - DOWNSIDE
      - ISSUES
    defaults: BASE

  - id: min_cash
    type: FLOAT
    displayName: Minimum cash
    description: The cash floor treasury keeps at every week end.
    defaults: 2000000.0

  - id: rcf_limit
    type: FLOAT
    displayName: Revolver limit
    defaults: 15000000.0

  - id: rcf_drawn
    type: FLOAT
    displayName: Revolver drawn today
    description: The amount drawn on the revolver at the forecast date, from the bank. Planned draws approved in earlier forecasts are not added, because once drawn they show here.
    defaults: 3000000.0

  - id: approved_by
    type: STRING
    displayName: Approved by
    description: The treasurer who accepts a forecast that needs a revolver draw.
    defaults: ""

variables:
  state_key: cash_forecast
  pack_dir: "cash-forecast/{{ inputs.week_start }}"

concurrency:
  limit: 1

triggers:
  - id: every_monday
    type: io.kestra.plugin.core.trigger.Schedule
    description: Every Monday morning, after the weekend's bank statements arrive. Disabled until the data sources are wired in.
    cron: "0 7 * * 1"
    disabled: true
    inputs:
      week_start: "{{ trigger.date | date('yyyy-MM-dd') }}"

tasks:
  - id: state
    type: io.kestra.plugin.core.output.OutputValues
    description: Earlier forecasts, kept to measure accuracy, and the revolver drawn so far.
    values:
      s: "{{ kv(vars.state_key, errorOnMissing=false) ?? {'last_week': '', 'history': [], 'approvals': {}} | toJson }}"
      last_week: "{{ (kv(vars.state_key, errorOnMissing=false) ?? {'last_week': ''}) | jq('.last_week') | first }}"

  - id: order_gate
    type: io.kestra.plugin.core.flow.If
    description: A forecast can be redone for the same week, never for an earlier one.
    condition: "{{ outputs.state.values.last_week != '' and inputs.week_start < outputs.state.values.last_week }}"
    then:
      - id: out_of_order
        type: io.kestra.plugin.core.execution.Fail
        errorMessage: "The {{ inputs.week_start }} forecast is older than the last one ({{ outputs.state.values.last_week }})."

  - id: forecast
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: >
      One DuckDB session: history and open items (demo generator or your exports), customer
      payment behaviour, collection and payment curves, the 13-week forecast by category,
      the funding need, the accuracy of earlier forecasts against actual bank flows, and
      data checks.
    outputFiles:
      - weeks
      - receipts
      - at_risk
      - accuracy
      - behaviour
      - blockers
    fetchType: FETCH_ONE
    sql: |
      SET VARIABLE w0 = DATE '{{ inputs.week_start }}';
      SET VARIABLE w_end = DATE '{{ inputs.week_start }}' + 91;
      SET VARIABLE downside = {{ inputs.scenario == 'DOWNSIDE' }};

      -- =======================================================================
      -- Demo history. Every flow below has the date it really hit the bank, so
      -- the same data serves as open items (not yet paid at the forecast date)
      -- and as actuals (paid before it). Replace with your AR, AP, payroll and
      -- bank exports.
      -- =======================================================================
      CREATE TABLE customers AS
      SELECT 'C' || lpad(i::VARCHAR, 2, '0') AS customer, 'Customer ' || i AS name,
             [30, 30, 45, 60][1 + i % 4] AS terms_days,
             CASE WHEN i IN (7, 18) THEN 34 WHEN i IN (4, 13, 27) THEN 14 WHEN i % 5 = 0 THEN -3 ELSE 4 END AS true_delay,
             (9000 + (i * 7919) % 42000)::DOUBLE AS weekly_volume
      FROM range(1, 41) t(i);
      -- The largest account by volume.
      UPDATE customers SET weekly_volume = 140000 WHERE customer = 'C11';
      {% if inputs.scenario == 'ISSUES' %}
      UPDATE customers SET terms_days = NULL WHERE customer = 'C33';
      {% endif %}

      CREATE TABLE ar AS
      SELECT 'INV-' || c.customer || '-' || strftime(d, '%y%m%d') AS invoice, c.customer, d AS issued_on,
             (d + coalesce(c.terms_days, 30))::DATE AS due_on,
             round(c.weekly_volume * (0.75 + (hash(c.customer || d) % 50)::INT / 100.0) * (1 + 0.004 * date_diff('week', DATE '2025-09-01', d)), 2) AS amount,
             -- Customer C24 stopped paying in June 2026.
             CASE WHEN c.customer = 'C24' AND d >= DATE '2026-05-25' THEN NULL
                  ELSE (d + coalesce(c.terms_days, 30) + c.true_delay + (hash(c.customer || d || 'p') % 11)::INT - 5)::DATE END AS paid_on
      FROM customers c, generate_series(DATE '2025-09-01', DATE '2027-02-22', INTERVAL 1 WEEK) g(w),
           LATERAL (SELECT (w + INTERVAL ((hash(c.customer) % 5)::INT) DAY)::DATE AS d) x;

      CREATE TABLE ap AS
      SELECT 'SUP-' || s || '-' || strftime(d, '%y%m%d') AS invoice, 'S' || lpad(s::VARCHAR, 2, '0') AS supplier, d AS received_on,
             (d + [30, 45, 60][1 + s % 3])::DATE AS due_on,
             round((9000 + (s * 6007) % 40000) * (0.8 + (hash(s || d) % 40)::INT / 100.0) * (1 + 0.004 * date_diff('week', DATE '2025-09-01', d)), 2) AS amount
      FROM range(1, 26) t(s), generate_series(DATE '2025-09-01', DATE '2027-02-22', INTERVAL 1 WEEK) g(w),
           LATERAL (SELECT (w + INTERVAL ((s % 5)::INT) DAY)::DATE AS d) x;
      -- Suppliers are paid in the Friday payment run on or before the due date.
      ALTER TABLE ap ADD COLUMN paid_on DATE;
      UPDATE ap SET paid_on = (due_on - ((dayofweek(due_on) - 5 + 7) % 7)::INT)::DATE;
      {% if inputs.scenario == 'ISSUES' %}
      INSERT INTO ap SELECT invoice, supplier, received_on, due_on, amount, paid_on FROM ap
      WHERE supplier = 'S07' AND received_on BETWEEN getvariable('w0') - 20 AND getvariable('w0') - 14 LIMIT 1;
      {% endif %}

      -- Scheduled flows: payroll every other Friday, payroll taxes on the 15th, rent on the 1st,
      -- quarterly debt service, capex milestones.
      CREATE TABLE scheduled AS
      SELECT 'Payroll' AS category, d::DATE AS flow_on, -round(410000 * (1 + 0.0015 * date_diff('week', DATE '2025-09-01', d)), 2) AS amount
      FROM generate_series(DATE '2025-09-05', DATE '2027-03-31', INTERVAL 14 DAY) g(d)
      UNION ALL SELECT 'Payroll taxes', (m + INTERVAL 14 DAY)::DATE, -148000 FROM generate_series(DATE '2025-09-01', DATE '2027-03-01', INTERVAL 1 MONTH) g(m)
      UNION ALL SELECT 'Rent', m::DATE, -85000 FROM generate_series(DATE '2025-09-01', DATE '2027-03-01', INTERVAL 1 MONTH) g(m)
      UNION ALL SELECT 'Debt service', (q + INTERVAL 3 MONTH - INTERVAL 1 DAY)::DATE, -(1250000 + round(30000000 * 0.062 / 4, 2))
        FROM generate_series(DATE '2025-07-01', DATE '2027-01-01', INTERVAL 3 MONTH) g(q)
      UNION ALL SELECT 'Capex', d, a FROM (VALUES (DATE '2026-10-16', -620000.0), (DATE '2026-11-13', -1450000.0), (DATE '2026-12-18', -780000.0),
                                                  (DATE '2026-09-11', -350000.0), (DATE '2027-01-22', -900000.0)) v(d, a);

      -- VAT is paid on the 25th of the month after each quarter: 20% of the quarter's sales less purchases.
      CREATE TABLE vat AS
      SELECT 'VAT' AS category, (q + INTERVAL 3 MONTH + INTERVAL 24 DAY)::DATE AS flow_on,
             -round(0.2 * ((SELECT sum(amount) FROM ar WHERE date_trunc('quarter', issued_on) = q) - (SELECT sum(amount) FROM ap WHERE date_trunc('quarter', received_on) = q)), 2) AS amount,
             q AS quarter
      FROM generate_series(DATE '2025-07-01', DATE '2026-12-01', INTERVAL 3 MONTH) g(q);

      -- Every actual bank movement, by category. Replace with your bank statement lines, categorised.
      CREATE TABLE bank AS
      SELECT 'Customer receipts' AS category, paid_on AS flow_on, amount FROM ar WHERE paid_on IS NOT NULL
      UNION ALL SELECT 'Supplier payments', paid_on, -amount FROM ap
      UNION ALL SELECT category, flow_on, amount FROM scheduled
      UNION ALL SELECT category, flow_on, amount FROM vat;
      SET VARIABLE opening_2026 = 500000.00;
      CREATE TABLE opening_cash AS
      SELECT getvariable('opening_2026') + coalesce((SELECT sum(amount) FROM bank WHERE flow_on >= DATE '2026-01-01' AND flow_on < getvariable('w0')), 0) AS bank_balance;
      -- General ledger cash at the same date. Replace with your trial balance.
      CREATE TABLE gl_cash AS SELECT bank_balance {% if inputs.scenario == 'ISSUES' %}- 18400{% endif %} AS balance FROM opening_cash;

      -- =======================================================================
      -- Customer behaviour, learnt from the last 180 days of paid invoices:
      -- the average delay against the due date, and its spread.
      -- =======================================================================
      CREATE TABLE behaviour AS
      SELECT c.customer, c.name, c.terms_days,
             round(avg(date_diff('day', a.due_on, a.paid_on)), 1) AS avg_delay_days,
             round(coalesce(stddev_samp(date_diff('day', a.due_on, a.paid_on)), 0), 1) AS delay_spread,
             count(a.paid_on) AS paid_invoices,
             max(a.paid_on) AS last_payment
      FROM customers c LEFT JOIN ar a ON a.customer = c.customer AND a.paid_on IS NOT NULL
        AND a.paid_on < getvariable('w0') AND a.paid_on >= getvariable('w0') - 180
      GROUP BY ALL;

      -- Open receivables at the forecast date.
      CREATE TABLE open_ar AS
      SELECT a.*, b.avg_delay_days, b.last_payment,
             date_diff('day', a.due_on, getvariable('w0')) AS days_overdue
      FROM ar a JOIN behaviour b USING (customer)
      WHERE a.issued_on < getvariable('w0') AND (a.paid_on IS NULL OR a.paid_on >= getvariable('w0'));

      -- Over 90 days late, or a customer with no payment in 60 days: not forecast, listed as at risk.
      CREATE TABLE at_risk AS
      SELECT invoice, customer, issued_on, due_on, amount, days_overdue,
             CASE WHEN days_overdue > 90 THEN 'more than 90 days overdue' ELSE 'no payment from this customer in 60 days' END AS reason
      FROM open_ar
      WHERE days_overdue > 90 OR last_payment IS NULL OR last_payment < getvariable('w0') - 60;

      CREATE TABLE predicted_ar AS
      SELECT o.invoice, o.customer, o.amount,
             greatest((o.due_on + round(coalesce(o.avg_delay_days, 0))::INT + CASE WHEN getvariable('downside') THEN 15 ELSE 0 END)::DATE,
                      getvariable('w0') + 2) AS expected_on,
             CASE WHEN getvariable('downside') AND o.customer = 'C11' AND hash(o.invoice) % 2 = 0 THEN 'beyond horizon' ELSE 'forecast' END AS treatment
      FROM open_ar o WHERE o.invoice NOT IN (SELECT invoice FROM at_risk);

      -- =======================================================================
      -- New sales and purchases: the recent weekly run rate, collected and paid
      -- on the curves observed in history (share of an invoice's amount settled
      -- k weeks after it was raised).
      -- =======================================================================
      CREATE TABLE ar_curve AS
      SELECT date_diff('week', issued_on, paid_on) AS k, sum(amount) / (SELECT sum(amount) FROM ar
             WHERE issued_on BETWEEN getvariable('w0') - 280 AND getvariable('w0') - 140) AS share
      FROM ar WHERE issued_on BETWEEN getvariable('w0') - 280 AND getvariable('w0') - 140 AND paid_on IS NOT NULL GROUP BY 1;
      CREATE TABLE ap_curve AS
      SELECT date_diff('week', received_on, paid_on) AS k, sum(amount) / (SELECT sum(amount) FROM ap
             WHERE received_on BETWEEN getvariable('w0') - 280 AND getvariable('w0') - 140) AS share
      FROM ap WHERE received_on BETWEEN getvariable('w0') - 280 AND getvariable('w0') - 140 GROUP BY 1;
      CREATE TABLE run_rate AS
      SELECT (SELECT sum(amount) FROM ar WHERE issued_on >= getvariable('w0') - 56 AND issued_on < getvariable('w0')) / 8
               * CASE WHEN getvariable('downside') THEN 0.8 ELSE 1 END AS weekly_sales,
             (SELECT sum(amount) FROM ap WHERE received_on >= getvariable('w0') - 56 AND received_on < getvariable('w0')) / 8 AS weekly_purchases;

      -- =======================================================================
      -- The 13 weeks.
      -- =======================================================================
      CREATE TABLE wk AS SELECT j::INT AS week, (getvariable('w0') + (7 * (j - 1))::INT)::DATE AS week_from, (getvariable('w0') + (7 * j - 1)::INT)::DATE AS week_to FROM range(1, 14) t(j);

      CREATE TABLE lines AS
      SELECT w.week, 'Receipts: open invoices' AS category, coalesce(sum(p.amount), 0) AS amount
      FROM wk w LEFT JOIN predicted_ar p ON p.expected_on BETWEEN w.week_from AND w.week_to AND p.treatment = 'forecast' GROUP BY w.week
      UNION ALL
      SELECT w.week, 'Receipts: new sales', coalesce(sum(r.weekly_sales * c.share), 0)
      FROM wk w JOIN range(1, 14) i(issue_week) ON i.issue_week <= w.week CROSS JOIN run_rate r
      LEFT JOIN ar_curve c ON c.k = w.week - i.issue_week GROUP BY w.week
      UNION ALL
      SELECT w.week, 'Payments: open supplier invoices', -coalesce(sum(a.amount), 0)
      FROM wk w LEFT JOIN ap a ON a.paid_on BETWEEN w.week_from AND w.week_to
        AND a.received_on < getvariable('w0') AND a.paid_on >= getvariable('w0') GROUP BY w.week
      UNION ALL
      SELECT w.week, 'Payments: new purchases', -coalesce(sum(r.weekly_purchases * c.share), 0)
      FROM wk w JOIN range(1, 14) i(issue_week) ON i.issue_week <= w.week CROSS JOIN run_rate r
      LEFT JOIN ap_curve c ON c.k = w.week - i.issue_week GROUP BY w.week
      UNION ALL
      SELECT w.week, s.category, sum(s.amount) FROM wk w JOIN scheduled s ON s.flow_on BETWEEN w.week_from AND w.week_to GROUP BY ALL
      UNION ALL
      -- VAT: the quarter already closed is known; the current quarter is estimated from known and forecast invoices.
      SELECT w.week, 'VAT', sum(v.amount) FROM wk w JOIN vat v ON v.flow_on BETWEEN w.week_from AND w.week_to GROUP BY ALL;

      CREATE TABLE weeks AS
      WITH net AS (
        SELECT w.week, w.week_from, w.week_to,
               coalesce(sum(l.amount) FILTER (WHERE l.amount > 0), 0) AS receipts,
               coalesce(sum(l.amount) FILTER (WHERE l.amount < 0), 0) AS payments,
               coalesce(sum(l.amount), 0) AS net_flow
        FROM wk w LEFT JOIN lines l USING (week) GROUP BY ALL
      )
      SELECT n.*, round((SELECT bank_balance FROM opening_cash) + sum(n.net_flow) OVER (ORDER BY n.week), 2) AS closing_cash
      FROM net n ORDER BY n.week;

      -- Funding: the draw that keeps every week end at or above the minimum, made in the week the shortfall first appears.
      CREATE TABLE funding AS
      SELECT greatest({{ inputs.min_cash }} - min(closing_cash), 0) AS draw_needed,
             (SELECT min(week) FROM weeks WHERE closing_cash < {{ inputs.min_cash }}) AS draw_week,
             min(closing_cash) AS low_point,
             arg_min(week, closing_cash) AS low_week,
             {{ inputs.rcf_limit }} - {{ inputs.rcf_drawn }} AS rcf_available
      FROM weeks;

      -- =======================================================================
      -- Accuracy: earlier forecasts against what the bank showed, for every past
      -- week they covered, at each horizon (1 = forecast made the week before).
      -- =======================================================================
      CREATE TABLE history AS
      SELECT (x ->> 'made')::DATE AS made, (x ->> 'week_from')::DATE AS week_from, x ->> 'group' AS grp, (x ->> 'amount')::DOUBLE AS forecast
      FROM (SELECT unnest(from_json('{{ outputs.state.values.s | jq(".history") | first | toJson }}', '["JSON"]')) AS x);
      CREATE TABLE actual_weeks AS
      SELECT h.made, h.week_from, h.grp, h.forecast, date_diff('week', h.made, h.week_from) + 1 AS horizon,
             coalesce((SELECT sum(b.amount) FROM bank b WHERE b.flow_on BETWEEN h.week_from AND h.week_from + 6
                         AND CASE h.grp WHEN 'Receipts' THEN b.amount > 0 WHEN 'Payments' THEN b.amount < 0 ELSE true END), 0) AS actual
      FROM history h WHERE h.week_from + 6 < getvariable('w0');
      CREATE TABLE accuracy AS
      SELECT grp, horizon, count(*) AS weeks_measured, round(sum(actual), 2) AS actual, round(sum(forecast), 2) AS forecast,
             round(100 * sum(abs(actual - forecast)) / nullif(sum(abs(actual)), 0), 1) AS wape_pct,
             round(100 * (sum(forecast) - sum(actual)) / nullif(sum(abs(actual)), 0), 1) AS bias_pct
      FROM actual_weeks GROUP BY grp, horizon ORDER BY grp, horizon;

      -- What this forecast hands to the next one for accuracy tracking.
      CREATE TABLE to_history AS
      SELECT '{{ inputs.week_start }}' AS made, strftime(week_from, '%Y-%m-%d') AS week_from, grp, round(amount, 2) AS amount FROM (
        SELECT week_from, 'Receipts' AS grp, receipts AS amount FROM weeks UNION ALL
        SELECT week_from, 'Payments', payments FROM weeks UNION ALL
        SELECT week_from, 'Net', net_flow FROM weeks);

      -- =======================================================================
      -- Data checks.
      -- =======================================================================
      CREATE TABLE blockers AS
      SELECT 'CASH_DOES_NOT_RECONCILE' AS code, 'bank' AS ref, 'Bank ' || format('{:,.2f}', o.bank_balance) || ', ledger ' || format('{:,.2f}', g.balance) || '. Reconcile the bank before forecasting from it' AS detail
        FROM opening_cash o, gl_cash g WHERE round(o.bank_balance, 2) <> round(g.balance, 2)
      UNION ALL SELECT 'DUPLICATE_SUPPLIER_INVOICE', invoice, count(*) || ' copies of ' || supplier || ' ' || invoice || ', ' || format('{:,.2f}', any_value(amount)) || ' each. One would be paid twice'
        FROM ap WHERE paid_on >= getvariable('w0') GROUP BY invoice, supplier HAVING count(*) > 1
      UNION ALL SELECT 'CUSTOMER_WITHOUT_TERMS', customer, name || ' has no payment terms, so its invoices have no due date' FROM customers WHERE terms_days IS NULL
      UNION ALL SELECT 'NOT_A_MONDAY', '{{ inputs.week_start }}', 'Forecast weeks run Monday to Sunday' WHERE dayofweek(getvariable('w0')) <> 1;

      COPY weeks TO '{{ outputFiles.weeks }}' (HEADER, DELIMITER ',');
      COPY (PIVOT (SELECT category, 'W' || lpad(week::VARCHAR, 2, '0') AS w, round(amount, 0) AS amount FROM lines) ON w USING sum(amount) GROUP BY category ORDER BY category) TO '{{ outputFiles.receipts }}' (HEADER, DELIMITER ',');
      COPY at_risk TO '{{ outputFiles.at_risk }}' (HEADER, DELIMITER ',');
      COPY accuracy TO '{{ outputFiles.accuracy }}' (HEADER, DELIMITER ',');
      COPY (SELECT * FROM behaviour ORDER BY avg_delay_days DESC NULLS LAST) TO '{{ outputFiles.behaviour }}' (HEADER, DELIMITER ',');
      COPY blockers TO '{{ outputFiles.blockers }}' (HEADER, DELIMITER ',');

      SELECT
        format('{:,.0f}', (SELECT bank_balance FROM opening_cash)) AS opening_cash,
        format('{:,.0f}', (SELECT sum(receipts) FROM weeks)) AS receipts_13w,
        format('{:,.0f}', (SELECT sum(payments) FROM weeks)) AS payments_13w,
        format('{:,.0f}', (SELECT closing_cash FROM weeks WHERE week = 13)) AS closing_cash_w13,
        f.low_point, format('{:,.0f}', f.low_point) AS low_point_fmt, f.low_week,
        (SELECT strftime(week_from, '%Y-%m-%d') FROM weeks WHERE week = f.low_week) AS low_week_from,
        round(f.draw_needed, 0) AS draw_needed, format('{:,.0f}', f.draw_needed) AS draw_needed_fmt, f.draw_week,
        f.rcf_available, format('{:,.0f}', f.rcf_available) AS rcf_available_fmt,
        (SELECT string_agg('W' || week || ' ' || format('{:,.0f}', closing_cash), ', ' ORDER BY week) FROM weeks) AS closing_by_week,
        (SELECT format('{:,.0f}', coalesce(sum(amount), 0)) FROM at_risk) AS at_risk_total, (SELECT count(*) FROM at_risk) AS at_risk_invoices,
        (SELECT format('{:,.0f}', coalesce(sum(amount), 0)) FROM predicted_ar WHERE treatment = 'beyond horizon') AS pushed_beyond_horizon,
        (SELECT string_agg(name || ' +' || avg_delay_days || 'd', ', ' ORDER BY avg_delay_days DESC) FROM (SELECT * FROM behaviour WHERE avg_delay_days > 10)) AS slow_payers,
        (SELECT coalesce(string_agg(grp || ' h' || horizon || ' WAPE ' || wape_pct || '% bias ' || bias_pct || '% (' || weeks_measured || ' wk)', '; ' ORDER BY grp, horizon), 'no earlier forecast to measure yet') FROM accuracy WHERE horizon IN (1, 4)) AS accuracy_detail,
        (SELECT coalesce(json_group_array(json_object('made', made, 'week_from', week_from, 'group', grp, 'amount', amount)), '[]')::VARCHAR FROM to_history) AS history_rows,
        (SELECT count(*) FROM blockers) AS blockers,
        (SELECT coalesce(string_agg(code || ' ' || ref || ': ' || detail, '; ' ORDER BY code), '') FROM blockers) AS blocker_detail
      FROM funding f;

  - id: result
    type: io.kestra.plugin.core.output.OutputValues
    values:
      r: "{{ (outputs.forecast.outputs | last).row | toJson }}"

  - id: log_forecast
    type: io.kestra.plugin.core.log.Log
    message: |
      13-week cash forecast from {{ inputs.week_start }} ({{ inputs.scenario }}).
      {{ outputs.result.values.r | jq('"Opening cash \(.opening_cash). Receipts \(.receipts_13w), payments \(.payments_13w), week 13 closing \(.closing_cash_w13)."') | first }}
      {{ outputs.result.values.r | jq('"Low point \(.low_point_fmt) in week \(.low_week) (from \(.low_week_from))."') | first }} Minimum {{ inputs.min_cash | numberFormat('#,##0') }}. {{ outputs.result.values.r | jq('"Revolver draw needed \(.draw_needed_fmt), available \(.rcf_available_fmt)."') | first }}
      {{ outputs.result.values.r | jq('"Closing cash: \(.closing_by_week)."') | first }}
      {{ outputs.result.values.r | jq('"Not forecast, at risk: \(.at_risk_invoices) invoices, \(.at_risk_total). Pushed beyond the horizon: \(.pushed_beyond_horizon). Slow payers: \(.slow_payers)."') | first }}
      {{ outputs.result.values.r | jq('"Accuracy of earlier forecasts: \(.accuracy_detail)."') | first }}
      {{ outputs.result.values.r | jq('"Blockers: \(.blockers). \(.blocker_detail)"') | first }}

  - id: evidence
    type: io.kestra.plugin.core.namespace.UploadFiles
    namespace: "{{ flow.namespace }}"
    filesMap:
      "{{ render(vars.pack_dir) }}/weeks.csv": "{{ outputs.forecast.outputFiles.weeks }}"
      "{{ render(vars.pack_dir) }}/by-category.csv": "{{ outputs.forecast.outputFiles.receipts }}"
      "{{ render(vars.pack_dir) }}/receivables-at-risk.csv": "{{ outputs.forecast.outputFiles.at_risk }}"
      "{{ render(vars.pack_dir) }}/accuracy.csv": "{{ outputs.forecast.outputFiles.accuracy }}"
      "{{ render(vars.pack_dir) }}/customer-behaviour.csv": "{{ outputs.forecast.outputFiles.behaviour }}"
      "{{ render(vars.pack_dir) }}/blockers.csv": "{{ outputs.forecast.outputFiles.blockers }}"

  - id: decide
    type: io.kestra.plugin.core.flow.Switch
    value: >-
      {%- set r = outputs.result.values.r -%}
      {%- set draw = r | jq('.draw_needed') | first -%}
      {%- if (r | jq('.blockers') | first) > 0 -%}BLOCKED
      {%- elseif draw > (r | jq('.rcf_available') | first) -%}SHORTFALL
      {%- elseif draw > 0 and inputs.approved_by == '' -%}NEEDS_FUNDING
      {%- else -%}PUBLISH{%- endif -%}
    cases:
      PUBLISH:
        - id: save
          type: io.kestra.plugin.core.kv.Set
          description: Keeps the forecasts of the last 8 weeks for accuracy tracking, and every approved funding plan.
          key: "{{ vars.state_key }}"
          kvType: JSON
          value: >-
            {{ {'old': fromJson(outputs.state.values.s), 'r': fromJson(outputs.result.values.r), 'w': inputs.week_start, 'by': inputs.approved_by,
                'cut': inputs.week_start | date('yyyy-MM-dd') | dateAdd(-56, 'DAYS') | date('yyyy-MM-dd')}
               | jq('{last_week: .w,
                      history: ((.cut as $cut | .w as $w | .old.history | map(select(.made != $w and .made >= $cut))) + (.r.history_rows | fromjson)),
                      approvals: ((.old.approvals // {}) + (if .r.draw_needed > 0 then {(.w): {draw: .r.draw_needed, draw_week: .r.draw_week, by: .by}} else {} end))}') | first | toJson }}

        - id: log_published
          type: io.kestra.plugin.core.log.Log
          message: >-
            Forecast from {{ inputs.week_start }} published in {{ render(vars.pack_dir) }}.
            {{ (outputs.result.values.r | jq('.draw_needed') | first) > 0 ? 'Planned revolver draw of ' ~ (outputs.result.values.r | jq('.draw_needed') | first) ~ ' in week ' ~ (outputs.result.values.r | jq('.draw_week') | first) ~ ', approved by ' ~ inputs.approved_by ~ '.' : 'No funding needed.' }}

      NEEDS_FUNDING:
        - id: funding_required
          type: io.kestra.plugin.core.execution.Fail
          errorMessage: >-
            Cash falls to {{ outputs.result.values.r | jq('.low_point_fmt') | first }} in week {{ outputs.result.values.r | jq('.low_week') | first }},
            below the {{ inputs.min_cash | numberFormat('#,##0') }} minimum. Draw {{ outputs.result.values.r | jq('.draw_needed_fmt') | first }} on the revolver by week
            {{ outputs.result.values.r | jq('.draw_week') | first }} ({{ outputs.result.values.r | jq('.rcf_available_fmt') | first }} available).
            Run again with approved_by to accept the plan.

      SHORTFALL:
        - id: shortfall
          type: io.kestra.plugin.core.execution.Fail
          errorMessage: >-
            Liquidity shortfall: keeping {{ inputs.min_cash | numberFormat('#,##0') }} needs {{ outputs.result.values.r | jq('.draw_needed_fmt') | first }}, but only
            {{ outputs.result.values.r | jq('.rcf_available_fmt') | first }} is left on the revolver. Escalate to the CFO: delay payments, accelerate collections or arrange funding.

    defaults:
      - id: blocked
        type: io.kestra.plugin.core.execution.Fail
        errorMessage: "The forecast cannot be built from this data: {{ outputs.result.values.r | jq('.blocker_detail') | first }}"

extend:
  title: Build the weekly 13-week cash flow forecast and measure its accuracy
  metaTitle: 13-week cash flow forecast with funding plan and accuracy tracking in Kestra
  shortDescription: Forecast 13 weeks of receipts and payments from open items, customer payment behaviour and commitments, size the revolver draw, and score past forecasts against the bank by horizon.
  metaDescription: A 13-week direct cash flow forecast in Kestra and DuckDB. Customer behaviour, collection curves, funding need, scenarios and forecast accuracy.
  description: |
    The 13-week cash flow forecast is the treasurer's main tool: lenders ask for it in a covenant discussion, and the board asks for it when cash is tight. It is usually a spreadsheet rolled forward by hand every Monday. Receipts are guessed from due dates that customers don't respect, and nobody checks whether last month's forecast was right. This flow rebuilds it every week from the data, sizes the funding need, and measures its own accuracy.

    It runs with no setup and no network. DuckDB generates a year of history:
    - 40 customers on 30 to 60 day terms; most pay a few days late, five are 14 to 34 days late, and one stopped paying in June;
    - the largest customer accounts for 10% of sales;
    - 25 suppliers paid in a Friday payment run on the due date;
    - payroll every other Friday, payroll taxes, rent, quarterly VAT and debt service, and capex milestones.


    ## How each line is forecast

    | Line | Method |
    |---|---|
    | Receipts from open invoices | Due date + the customer's own average delay over the last 180 days. An overdue invoice is expected this week |
    | Receivables at risk | More than 90 days overdue, or no payment from the customer in 60 days. Listed, and not forecast |
    | Receipts from new sales | The last 8 weeks' sales run rate, collected on the historical collection curve (share of an invoice paid k weeks after issue) |
    | Supplier payments | Open invoices on their payment-run date. New purchases at the run rate, on the payment curve |
    | Payroll, taxes, rent, debt service, capex | From the schedule of commitments |
    | VAT | The quarterly settlement, computed from the quarter's sales and purchases |

    ## Funding and scenarios

    The flow finds the lowest week-end balance against `min_cash`:
    - **No breach:** the forecast is published.
    - **Breach the revolver can cover:** the draw needed is sized and timed to the first week that breaches. Publishing needs `approved_by`, and the approved plan is recorded.
    - **Breach the revolver cannot cover:** the run fails as a liquidity shortfall to escalate.

    `DOWNSIDE` makes every customer pay 15 days later, cuts new sales by 20%, and pushes half of the largest customer's open invoices beyond the horizon. This is the stress lenders usually ask for.

    ## Accuracy

    Every published forecast is kept in KV for 8 weeks. Each run compares the earlier forecasts of every completed week with what the bank actually showed, by line group (receipts, payments, net) and by horizon (1 = forecast made the week before). It reports:
    - **WAPE**: total absolute error as a share of actual flows,
    - **bias**: whether the forecast is systematically optimistic or pessimistic.

    This shows where the forecast is weak and how far out it can be trusted.

    ## Controls

    The forecast is not built when:
    - the bank balance does not reconcile to the ledger,
    - a supplier invoice appears twice (it would be paid twice),
    - a customer has no payment terms,
    - the forecast week does not start on a Monday.

    A forecast can be redone for the same week, but never for an earlier one.

    ## How it works

    1. `state` reads the stored forecasts and approvals. `order_gate` refuses an earlier week.
    2. `forecast` (`io.kestra.plugin.jdbc.duckdb.Queries`):
       - builds the history and open items, and learns customer behaviour and the collection and payment curves;
       - forecasts the 13 weeks by category and computes the funding need;
       - measures past accuracy against the bank and runs the data checks.
    3. `log_forecast` prints the forecast. `evidence` stores:
       - `weeks.csv`: receipts, payments and closing cash by week;
       - `by-category.csv`: a pivot of 10 categories by 13 weeks;
       - `receivables-at-risk.csv`, `accuracy.csv`, `customer-behaviour.csv` and `blockers.csv`.
    4. `decide` (`io.kestra.plugin.core.flow.Switch`):
       - `PUBLISH`: stores the forecast for accuracy tracking, and the approved funding plan.
       - Otherwise the run fails with the reason: `NEEDS_FUNDING`, `SHORTFALL` or `BLOCKED`.

    ## Tested end to end

    On Kestra 2.0.3 OSS. Nine weekly forecasts were run from 2026-08-03 to 2026-09-28, then:

    | Run | Inputs | Result |
    |---|---|---|
    | 1 | 2026-10-05 `BASE` | Opening cash 5,203,987, receipts 20,927,279, payments 20,849,080. Low point 3,747,840 in week 3. No funding needed. 19 invoices (728,031) at risk, from the customer who stopped paying. Published |
    | 2 | 2026-10-05 `DOWNSIDE` | Receipts drop to 17,726,209, and 940,324 is pushed beyond the horizon. Low point 556,357 in week 3: draw 1,443,643 by week 3. Stops for approval |
    | 3 | same, `approved_by`, run twice | Published, plan recorded once (redoing a week replaces it) |
    | 4 | same, `rcf_limit: 4000000` | `SHORTFALL`: 1,443,643 needed, 1,000,000 left on the revolver |
    | 5 | 2026-10-12 `ISSUES` | Blocked: bank 5,496,218.95 against ledger 5,477,818.95; customer C33 without terms; supplier invoice SUP-7-260923 entered twice |
    | 6 | 2026-09-21 | Refused: older than the last forecast |

    Accuracy after nine weeks:
    - **Receipts:** a WAPE of 15% at one week and 18% at four weeks.
    - **Payments:** near 0%, because the demo's supplier payments and commitments are exactly known. Real data will show more.
    - **Bias:** the one-week receipts forecast is 13% low, because overdue invoices are all placed in the first week. Spreading them by customer behaviour is the natural next improvement, and the accuracy table is how you would see it work.

    I checked every published week independently. Opening cash plus the week's net flow equals its closing balance, and the 10 category lines add up to each week's net flow.

    ## Problems found while testing

    - **Last Friday's payments were counted again.** Supplier invoices paid on the Friday before the forecast date were moved into week 1, a 62% error on one-week payments. Only invoices still unpaid at the forecast date are forecast now, and the error is 0%.
    - **A customer who stopped paying looked healthy.** It had stopped in mid-July, so in October its last payment was only 48 days old. The demo now stops it in June, and its 19 invoices are reported at risk.
    - **Approving a forecast twice drew the revolver twice.** The first version added each approved draw to the drawn balance, so rerunning a week counted the same draw again. The drawn balance is now an input taken from the bank, and approvals are recorded per week.
    - **jq has no `strptime` in Kestra.** The 8-week cut-off date is computed in Pebble and passed in.

    ## Inputs

    | Input | Default | Purpose |
    |---|---|---|
    | `week_start` | `2026-10-05` | A Monday |
    | `scenario` | `BASE` | `BASE`, `DOWNSIDE` or `ISSUES` |
    | `min_cash` | `2000000.0` | Cash floor |
    | `rcf_limit`, `rcf_drawn` | `15000000.0`, `3000000.0` | Revolver headroom |
    | `approved_by` | empty | The treasurer, needed for a funding plan |

    ## Use it with your data

    - Replace `customers`, `ar`, `ap`, `scheduled` and `vat` with your AR and AP open items and history, and your commitments.
    - Replace `bank` with categorised bank statement lines, and `gl_cash` with the ledger cash balance.
    - The schedule's `inputs.week_start` uses the trigger date. Run it on Mondays.

    ## Things to know

    - Multi-currency cash needs a rate per currency. The FX revaluation blueprint stores closing rates in KV.
    - Intercompany flows, dividends and tax installments can be added as scheduled lines.
    - Reset the history by deleting the KV key `cash_forecast`.

    ## Links

    - DuckDB plugin: https://kestra.io/plugins/plugin-jdbc-duckdb
    - KV store: https://kestra.io/docs/concepts/kv-store

    This blueprint was created by [zkasuran](https://github.com/zkasuran).
