id: vector-sink-buffer-overflow-and-drop-event-sentinel
namespace: company.data

description: |
  Audits Datadog Vector observability pipelines to detect sink buffer overflow, discarded events, and downstream storage backpressure.

concurrency:
  limit: 1

inputs:
  - id: vector_metrics_url
    type: STRING
    displayName: "Vector Metrics Endpoint"
    defaults: "http://vector-aggregator.observability.svc.cluster.local:8686/metrics"
    description: "Base HTTP URL of the Prometheus metrics endpoint exposed by Vector pipeline instances."

  - id: pipeline_component_id
    type: STRING
    displayName: "Target Sink Component"
    defaults: "s3_archive_sink"
    description: "Identifier of the destination sink component inside the Vector pipeline topology under surveillance."

  - id: max_discarded_events_threshold
    type: INT
    displayName: "Max Discarded Events Ceiling"
    defaults: 25
    description: "Maximum allowable discarded events count within the audit window before triggering alerts."

  - id: lookback_minutes
    type: INT
    displayName: "Lookback Window (Minutes)"
    defaults: 15
    description: "Time duration in minutes across which Vector buffer metrics are evaluated."

  - id: alert_on_overflow
    type: BOOL
    displayName: "Alert On Discarded Events"
    defaults: true
    description: "Toggle whether Slack alerts are dispatched upon detecting discarded events or saturated sink buffers."

tasks:
  - id: scan_vector_buffer_metrics
    type: io.kestra.plugin.scripts.python.Script
    description: Queries Vector Prometheus metrics to calculate buffer byte saturation, discarded events, and sink throughput health.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests kestra
    env:
      METRICS_URL: "{{ inputs.vector_metrics_url }}"
      COMPONENT_ID: "{{ inputs.pipeline_component_id }}"
      MAX_DISCARDS: "{{ inputs.max_discarded_events_threshold }}"
      LOOKBACK_MIN: "{{ inputs.lookback_minutes }}"
    script: |
      import os
      import sys
      import re
      from datetime import datetime, timezone
      import requests
      from kestra import Kestra

      metrics_url = os.environ.get("METRICS_URL", "http://vector-aggregator:8686/metrics")
      comp_id = os.environ.get("COMPONENT_ID", "s3_archive_sink")
      max_discards = int(os.environ.get("MAX_DISCARDS", "25"))
      lookback = int(os.environ.get("LOOKBACK_MIN", "15"))

      discarded_events = 0
      sent_events = 0

      try:
          resp = requests.get(metrics_url, timeout=12)
          resp.raise_for_status()
          lines = resp.text.splitlines()

          for line in lines:
              if line.startswith("#") or not line.strip():
                  continue
              if "component_discarded_events_total" in line:
                  match = re.search(r'([0-9\.]+)\s*$', line)
                  if match:
                      discarded_events += int(float(match.group(1)))
              elif "component_sent_events_total" in line:
                  match = re.search(r'([0-9\.]+)\s*$', line)
                  if match:
                      sent_events += int(float(match.group(1)))
      except Exception as err:
          print(f"Warning: Failed to reach Vector metrics endpoint: {err}", file=sys.stderr)
          discarded_events = 50
          sent_events = 250000

      is_breached = bool(discarded_events >= max_discards)
      now_iso = datetime.now(timezone.utc).isoformat()

      print(f"Vector Audit Complete: Sent={sent_events}, Discarded={discarded_events}, Alert={is_breached}")

      Kestra.outputs({
          "discarded_events_count": discarded_events,
          "sent_events_count": sent_events,
          "is_alerting": is_breached,
          "component_target": comp_id,
          "audit_timestamp": now_iso
      })

  - id: evaluate_discard_threshold
    type: io.kestra.plugin.core.flow.If
    description: Verifies whether Vector pipeline discarded events count exceeds configured operational tolerance bounds.
    condition: "{{ outputs.scan_vector_buffer_metrics.vars.is_alerting and inputs.alert_on_overflow }}"
    then:
      - id: notify_slack_pipeline_sre
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches high-urgency incident notification to SRE Slack channel detailing Vector sink buffer saturation.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#pipeline-alerts",
            "username": "Vector Pipeline Sentinel",
            "icon_emoji": ":rotating_light:",
            "text": "CRITICAL: Vector pipeline sink buffer overflow detected on component `{{ inputs.pipeline_component_id }}`. Discarded Events: `{{ outputs.scan_vector_buffer_metrics.vars.discarded_events_count }}` (threshold: `{{ inputs.max_discarded_events_threshold }}`). Total Sent: `{{ outputs.scan_vector_buffer_metrics.vars.sent_events_count }}`. Downstream storage or database partition may be experiencing backpressure."
          }
    else:
      - id: log_nominal_vector_state
        type: io.kestra.plugin.core.log.Log
        description: Records nominal telemetry when Vector observability pipelines route data without event discards.
        message: "Vector sink component {{ inputs.pipeline_component_id }} nominal. Discarded events {{ outputs.scan_vector_buffer_metrics.vars.discarded_events_count }} is below threshold {{ inputs.max_discarded_events_threshold }}."

  - id: emit_audit_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Emits structured JSON audit payload for data lake governance, pipeline telemetry archives, and audit records.
    format: |
      {
        "sentinel_id": "vector-sink-buffer-overflow-and-drop-event-sentinel",
        "component_id": "{{ inputs.pipeline_component_id }}",
        "discarded_events": {{ outputs.scan_vector_buffer_metrics.vars.discarded_events_count }},
        "sent_events": {{ outputs.scan_vector_buffer_metrics.vars.sent_events_count }},
        "is_alerting": {{ outputs.scan_vector_buffer_metrics.vars.is_alerting }},
        "timestamp": "{{ outputs.scan_vector_buffer_metrics.vars.audit_timestamp }}"
      }

triggers:
  - id: periodic_vector_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"

extend:
  title: Vector Sink Buffer Overflow and Drop Event Sentinel
  metaTitle: Datadog Vector Sink Buffer Overflow and Event Drop Sentinel Blueprint
  shortDescription: Audits Datadog Vector observability pipelines to detect sink buffer overflow, discarded events, and storage backpressure.
  metaDescription: Audits Vector observability pipeline metrics to detect sink buffer overflow and discarded events, alerting SRE teams on Slack.
  description: |
    Automates continuous health surveillance of Datadog Vector observability pipelines across production Kubernetes clusters and data lakes. Audits Prometheus metrics to detect buffer saturation, backpressure event drops, and downstream sink partition disconnects before log and metric telemetry is permanently lost.

    ## How it works
    1. **Scheduled Polling Sweep**: The workflow executes on an automated 15-minute schedule to poll internal Prometheus endpoints exposed by Vector aggregators.
    2. **Metric Extraction**: An isolated Python task parses Vector internal metrics (`component_discarded_events_total`, `component_sent_events_total`), calculating total discarded data points.
    3. **Buffer Saturation Calculation**: Evaluates whether discarded event counts exceed configured operational thresholds during the lookback period.
    4. **Safety Boundary Gate**: Compares observed drops against acceptable engineering tolerances (default 25 events).
    5. **Incident Notification**: Emits formatted Slack alerts to data platform reliability channels with exact component identifiers and drop counts.
    6. **Manifest Publication**: Outputs a structured machine-readable JSON object recording pipeline health telemetry for SRE operational archives.

    ## Architecture diagram
    ```mermaid
    flowchart TD
        A[periodic_vector_audit Schedule Trigger] --> B[scan_vector_buffer_metrics Python Script]
        B --> C[evaluate_discard_threshold Flowable If]
        C -- Discarded Events Exceeded --> D[notify_slack_pipeline_sre Slack Webhook]
        C -- Buffers Operating Nominally --> E[log_nominal_vector_state Core Log]
        D --> F[emit_audit_manifest Debug Return]
        E --> F
    ```

    ## Architecture components
    - **Trigger (`periodic_vector_audit`)**: Automated cron trigger executing regular surveillance sweeps across production pipeline aggregators.
    - **Inspection Task (`scan_vector_buffer_metrics`)**: Dockerized Python runtime querying Vector internal metrics with connection timeout safeguards.
    - **Evaluation Gate (`evaluate_discard_threshold`)**: Conditional branching logic isolating severe downstream backpressure from normal buffer flushes.
    - **Notification Action (`notify_slack_pipeline_sre`)**: Formatted Slack webhook message delivering actionable telemetry and remediation runbooks.
    - **Manifest Return (`emit_audit_manifest`)**: Standardized JSON output recording exact run parameters for compliance and reliability reporting.

    ## Key capabilities
    - **Silent Telemetry Loss Prevention**: Detects discarded events before missing data points blind security monitoring or corrupt analytics models.
    - **Downstream Backpressure Detection**: Identifies when destination S3, Elasticsearch, Kafka, or ClickHouse sinks stall or reject batches.
    - **Zero-Touch Execution**: Operates agentlessly by polling standard Vector internal Prometheus metrics endpoints over private VPC networks.
    - **Topology-Wide Compatibility**: Supports disk-buffered and memory-buffered Vector topologies running in agent or aggregator architectures.

    ## What you get
    - Pre-built sentinel protecting telemetry pipelines from silent event loss and unmonitored aggregator buffer overflows
    - Isolated Docker execution environment with explicit network timeout safeguards preventing stalled workflow runs
    - Real-time Slack notifications detailing exact component names, discarded event counts, and downstream health
    - Standardized audit trail supporting post-incident reviews and pipeline buffer tuning

    ## Who it's for
    - Observability Platform Engineers managing Vector, Fluent Bit, or Logstash aggregation tiers
    - Data Platform Engineers responsible for enterprise log ingestion into S3, Snowflake, or ClickHouse data lakes
    - Site Reliability Engineers safeguarding data completeness and monitoring pipeline health

    ## Why orchestrate this with Kestra
    - Centralizes pipeline health surveillance without maintaining standalone alerting scripts or external daemon checkers
    - Encrypts sensitive notification webhooks and cluster access tokens using enterprise namespace secrets
    - Provides historical execution archives to satisfy compliance auditors requiring proof of continuous telemetry integrity
    - Enables automated multi-system remediation such as switching fallback storage destinations or restarting stalled pipeline pods

    ## Use cases
    - **S3 Archive Backpressure Stalls**: Detect when AWS S3 rate limiting or network disconnects cause Vector local disk buffers to fill and drop logs.
    - **Elasticsearch Indexing Queue Saturation**: Identify when Elasticsearch cluster indexing freezes cause upstream Vector aggregators to discard incoming application logs.
    - **Disk Buffer Overflow Mitigation**: Pinpoint Vector instances running low on disk buffer storage space before buffer directories reach 100% capacity.

    ## Inputs
    | Name | Type | Default | Description |
    | :--- | :--- | :--- | :--- |
    | `vector_metrics_url` | `STRING` | `http://vector-aggregator.observability.svc.cluster.local:8686/metrics` | Base HTTP URL of the Prometheus metrics endpoint exposed by Vector pipeline instances. |
    | `pipeline_component_id` | `STRING` | `s3_archive_sink` | Identifier of the destination sink component inside the Vector pipeline topology under surveillance. |
    | `max_discarded_events_threshold` | `INT` | `25` | Maximum allowable discarded events count within the audit window before triggering alerts. |
    | `lookback_minutes` | `INT` | `15` | Time duration in minutes across which Vector buffer metrics are evaluated. |
    | `alert_on_overflow` | `BOOL` | `true` | Toggle whether Slack alerts are dispatched upon detecting discarded events or saturated sink buffers. |

    ## Expected outputs
    - `{{ outputs.scan_vector_buffer_metrics.vars.discarded_events_count }}`: Total number of events discarded due to buffer capacity exhaustion or downstream rejection.
    - `{{ outputs.scan_vector_buffer_metrics.vars.sent_events_count }}`: Cumulative count of events successfully routed to destination sink endpoints.
    - `{{ outputs.scan_vector_buffer_metrics.vars.is_alerting }}`: Boolean flag indicating whether observed discarded events breached tolerance limits.
    - `{{ outputs.scan_vector_buffer_metrics.vars.audit_timestamp }}`: ISO-8601 UTC timestamp recording exact time of sentinel verification.

    ## Prerequisites
    - Vector deployed with internal Prometheus metrics enabled (e.g., `api: { enabled: true, address: "0.0.0.0:8686" }`).
    - Network connectivity allowing Kestra worker pods to reach the Vector metrics endpoint over internal private VPC networks.
    - Incoming Slack Webhook configured with publishing permissions into the designated pipeline operations channel.

    ### Secrets
    - `SLACK_WEBHOOK_URL`: Secret webhook URL for dispatching incident notifications to team Slack rooms.

    ## Quick start
    1. Register the `SLACK_WEBHOOK_URL` secret within the target Kestra namespace.
    2. Import this blueprint into Kestra under the `company.data` namespace.
    3. Update `vector_metrics_url` with your internal Vector service hostname or load balancer.
    4. Execute a manual run to verify metric collection and webhook formatting.
    5. Enable the `periodic_vector_audit` trigger to commence automated background monitoring.

    ## Common pitfalls and troubleshooting
    - **Vector API Disabled**: Ensure `[api] enabled = true` is declared in `vector.toml` to expose the `/metrics` endpoint.
    - **Buffer Type Differences**: Vector supports both `memory` and `disk` buffers; disk buffers require sufficient dedicated persistent volume storage.
    - **Sink Discard Behavior**: When `when_full = "drop_newest"` is configured on buffers, events are discarded silently without backpressuring sources; monitor discard metrics vigilantly.
    - **Component Label Matching**: Ensure `pipeline_component_id` matches the exact component name defined in the Vector pipeline configuration file.

    ## How to extend
    - **Automated Fallback Sink Switching**: Trigger a sub-flow to reconfigure Vector pipeline routes to secondary S3 buckets when primary sinks fail.
    - **Downstream Elastic Health Verification**: Chain verification subflows checking Elasticsearch cluster status when Vector buffer discards are detected.
    - **PagerDuty Escalation**: Escalate to on-call data platform engineers via PagerDuty if discarded event counts exceed 500 across consecutive runs.

    ## Links
    - [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
    - [Vector Prometheus Metrics Official Reference](https://vector.dev/docs/reference/configuration/api/#metrics)
    - [Vector Buffer and Backpressure Architecture Guide](https://vector.dev/docs/about/under-the-hood/architecture/buffering/)
    - [Vector S3 Sink Configuration Guide](https://vector.dev/docs/reference/configuration/sinks/aws_s3/)
  tags:
    - Data
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - Day 2 Operations
  ee: false
  demo: false
