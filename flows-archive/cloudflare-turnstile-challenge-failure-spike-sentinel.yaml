    - [Cloudflare Turnstile Official Documentation](https://developers.cloudflare.com/turnstile/)
    - [Cloudflare GraphQL Analytics API Reference](https://developers.cloudflare.com/analytics/graphql-api/)
    - [Turnstile Server-side Validation Architecture](https://developers.cloudflare.com/turnstile/get-started/server-side-validation/)
