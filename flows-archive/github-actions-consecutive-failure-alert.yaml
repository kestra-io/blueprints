id: github-actions-consecutive-failure-alert
namespace: company.team
description: |
  Watch a GitHub Actions workflow's recent runs and alert Slack when it has
  failed several times in a row — a streak means something systemic, not a flake.

triggers:
  - id: hourly_check
    type: io.kestra.plugin.core.trigger.Schedule
    description: Checks the workflow's recent runs every hour; shipped disabled so it never pages before secrets are set.
    cron: "15 * * * *"
    disabled: true
  - id: deploy_webhook
    type: io.kestra.plugin.core.trigger.Webhook
    description: Call from your CI after a deploy to check whether the streak started right after it.
    key: actions-streak-check

inputs:
  - id: repository
    type: STRING
    defaults: kestra-io/kestra
    description: Owner/repo whose Actions runs to inspect.
  - id: workflow_file
    type: STRING
    defaults: main.yml
    description: Workflow file name (e.g. main.yml) as shown in .github/workflows.
  - id: streak_threshold
    type: INT
    defaults: 3
    description: Consecutive failures from the latest run backwards that trigger the alert.

tasks:
  - id: fetch_runs
    type: io.kestra.plugin.scripts.python.Script
    description: Fetch the 20 most recent runs of the workflow and pass them to Python for streak analysis.
    containerImage: python:3.11-slim
    warningOnStdErr: false
    env:
      REPOSITORY: "{{ inputs.repository }}"
      WORKFLOW: "{{ inputs.workflow_file }}"
      GITHUB_TOKEN: "{{ secret('GITHUB_TOKEN') }}"
    script: |
      import json, os, urllib.request

      url = f"https://api.github.com/repos/{os.environ['REPOSITORY']}/actions/workflows/{os.environ['WORKFLOW']}/runs?per_page=20"
      req = urllib.request.Request(url, headers={
          "Accept": "application/vnd.github+json",
          "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
          "User-Agent": "kestra-actions-streak",
      })
      with urllib.request.urlopen(req) as r:
          runs = json.loads(r.read()).get("workflow_runs", [])

      streak = 0
      for run in runs:
          if run.get("conclusion") == "failure":
              streak += 1
          elif run.get("conclusion") in ("success", "cancelled"):
              break
      latest = runs[0] if runs else {}
      print(f"failure streak: {streak} across {len(runs)} recent runs")
      print("::" + json.dumps({"outputs": {"streak": streak, "latest_url": latest.get("html_url", "")}}) + "::")

  - id: check_streak
    type: io.kestra.plugin.core.flow.If
    description: Only page when the streak meets the threshold — isolated red runs are noise.
    condition: "{{ outputs.fetch_runs.vars.streak >= inputs.streak_threshold }}"
    then:
      - id: alert_streak
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Post the streak length and the latest run link so the responder can jump straight in.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": ":rotating_light: GitHub Actions FAILURE STREAK: {{ outputs.fetch_runs.vars.streak }} consecutive failures on {{ inputs.repository }} / {{ inputs.workflow_file }} (threshold {{ inputs.streak_threshold }}). Latest run: {{ outputs.fetch_runs.vars.latest_url }}. Execution {{ execution.id }}."
          }
    else:
      - id: log_healthy
        type: io.kestra.plugin.core.log.Log
        description: Record the streak length on every run — today's zero is tomorrow's trend line.
        message: "Actions streak on {{ inputs.repository }}/{{ inputs.workflow_file }}: {{ outputs.fetch_runs.vars.streak }} (threshold {{ inputs.streak_threshold }})."

errors:
  - id: alert_fetch_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alert when the API call itself fails — no streak data must never look like a healthy pipeline.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "Actions streak check FAILED in flow {{ flow.id }} (execution {{ execution.id }}) for {{ inputs.repository }}. Check GITHUB_TOKEN scopes and the workflow_file name."
      }

outputs:
  - id: streak_summary
    type: JSON
    description: 'Failure streak and latest run URL, e.g. {"streak": 4, "latest_url": "https://github.com/..."}.'
    value: "{{ outputs.fetch_runs.vars | toJson }}"

extend:
  title: Alert on Consecutive GitHub Actions Failures
  shortDescription: Hourly check of a workflow's recent runs; Slack alert when failures form a streak.
  metaTitle: GitHub Actions Failure Streak Alerts
  metaDescription: Detect consecutive GitHub Actions failures and alert Slack — a streak means systemic, not flaky.
  description: |
    A single red run is usually a flake. Four red runs in a row is a broken main. GitHub emails you about every failure but never connects them. This blueprint looks backwards from the latest run, counts consecutive failures, and pages Slack only when the streak crosses your threshold.

    ## How it works

    1. `fetch_runs` (`io.kestra.plugin.scripts.python.Script`) pulls the 20 most recent runs of your workflow via the GitHub API, counts the consecutive `failure` conclusions from the newest run backwards, and emits `streak` and `latest_url` via the `::{"outputs": ...}::` protocol.
    2. `check_streak` (`io.kestra.plugin.core.flow.If`) compares the streak to `streak_threshold`. Over: `alert_streak` posts streak length, repo, workflow, and the latest run link. Under: `log_healthy` records the number for trend visibility.
    3. The `errors` block alerts Slack when the API call fails — missing data must never read as green.
    4. Triggers: hourly `Schedule` (disabled by default) plus a `Webhook` for post-deploy checks.

    ## What you get

    - A page only when CI is systemically broken, not on every red run.
    - The streak in your execution history as the CI health trend.
    - A `streak_summary` JSON output for dashboards or gating.

    ## Who it's for

    - Teams whose CI fails nightly for unrelated-looking reasons.
    - Maintainers who ignore per-run emails but care about broken-main streaks.
    - Platform engineers wiring CI health into an ops channel.

    ## Why orchestrate this with Kestra

    GitHub tells you about runs; the flow turns them into a streak signal. Kestra adds the schedule, the threshold branch, the alert, the failure channel, and history — and the next step (auto-rerun, open an issue, freeze merges) is one task away.

    ## Prerequisites

    - A GitHub token with `actions:read` on the repository.
    - A Slack incoming webhook.

    ### Secrets

    - `GITHUB_TOKEN`: token for the Actions runs API.
    - `SLACK_WEBHOOK_URL`: webhook for streak and failure alerts.

    ## Quick start

    1. Add both secrets.
    2. Set `repository`, `workflow_file`, and `streak_threshold`.
    3. Run once and check `streak_summary`.
    4. Enable `hourly_check`.

    ## How to extend

    - Loop over several workflow files with a `ForEach`.
    - Add a rerun task on streak breach.
    - Store the streak in KV and alert only when it grows.

    ## Links

    - [GitHub Actions runs API](https://docs.github.com/en/rest/actions/workflow-runs)
    - [Kestra Schedule trigger](https://kestra.io/plugins/triggers/schedule)
    - This blueprint has been created by [yashspidey](https://github.com/yashspidey)
  tags:
    - Infrastructure
    - Business
  subTags:
    - DevOps & CI/CD
    - Monitoring & Alerting
  ee: false
  demo: false
