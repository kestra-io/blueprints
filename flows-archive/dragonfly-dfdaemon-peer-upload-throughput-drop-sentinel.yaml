    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
    - [Dragonfly Official Documentation](https://d7y.io/docs/)
    - [Dragonfly Architecture and Dfdaemon Design Guide](https://d7y.io/docs/concepts/terminology/dfdaemon/)
    - [Dragonfly Metrics and Monitoring Reference](https://d7y.io/docs/operations/metric/)
