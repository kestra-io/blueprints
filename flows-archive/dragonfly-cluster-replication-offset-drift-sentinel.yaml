id: dragonfly-cluster-replication-offset-drift-sentinel
namespace: company.data

description: |
  Audits Dragonfly in-memory datastore cluster telemetry to detect replica offset drift, replication stream desync, and stale cache reads.

concurrency:
  limit: 1

inputs:
  - id: dragonfly_metrics_url
    type: STRING
    displayName: "Dragonfly Metrics Endpoint"
    defaults: "http://dragonfly-master.cache.svc.cluster.local:6379/metrics"
    description: "Base HTTP URL exposing Prometheus metrics for the Dragonfly in-memory datastore master node."

  - id: cluster_name
    type: STRING
    displayName: "Target Cluster"
    defaults: "dragonfly-production-cache"
    description: "Identifier of the target Dragonfly in-memory cluster under active replication surveillance."

  - id: max_offset_drift_bytes
    type: INT
    displayName: "Max Offset Drift (Bytes)"
    defaults: 1048576
    description: "Maximum allowable replication offset lag in bytes between primary and replica nodes before alerting."

  - id: lookback_minutes
    type: INT
    displayName: "Lookback Period (Minutes)"
    defaults: 15
    description: "Time duration in minutes across which Dragonfly replication metrics are evaluated."

  - id: alert_on_drift
    type: BOOL
    displayName: "Alert On Offset Drift"
    defaults: true
    description: "Toggle whether Slack alerts are dispatched upon detecting elevated replication offset drift."

tasks:
  - id: scan_dragonfly_replication_metrics
    type: io.kestra.plugin.scripts.python.Script
    description: Interrogates Dragonfly Prometheus metrics to evaluate replication stream offsets, replica connection state, and lag bytes.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests kestra
    env:
      METRICS_URL: "{{ inputs.dragonfly_metrics_url }}"
      CLUSTER_NAME: "{{ inputs.cluster_name }}"
      MAX_DRIFT: "{{ inputs.max_offset_drift_bytes }}"
      LOOKBACK_MIN: "{{ inputs.lookback_minutes }}"
    script: |
      import os
      import sys
      import re
      from datetime import datetime, timezone
      import requests
      from kestra import Kestra

      metrics_url = os.environ.get("METRICS_URL", "http://dragonfly-master:6379/metrics")
      cluster_name = os.environ.get("CLUSTER_NAME", "dragonfly-cache")
      max_drift = int(os.environ.get("MAX_DRIFT", "1048576"))
      lookback = int(os.environ.get("LOOKBACK_MIN", "15"))

      master_repl_offset = 0
      replica_repl_offset = 0
      connected_replicas = 0

      try:
          resp = requests.get(metrics_url, timeout=12)
          resp.raise_for_status()
          lines = resp.text.splitlines()

          for line in lines:
              if line.startswith("#") or not line.strip():
                  continue
              if "dragonfly_master_repl_offset" in line or "master_repl_offset" in line:
                  match = re.search(r'([0-9\.]+)\s*$', line)
                  if match:
                      master_repl_offset = int(float(match.group(1)))
              elif "dragonfly_replica_repl_offset" in line or "replica_repl_offset" in line:
                  match = re.search(r'([0-9\.]+)\s*$', line)
                  if match:
                      replica_repl_offset = int(float(match.group(1)))
              elif "dragonfly_connected_slaves" in line or "connected_slaves" in line:
                  match = re.search(r'([0-9\.]+)\s*$', line)
                  if match:
                      connected_replicas = int(float(match.group(1)))
      except Exception as err:
          print(f"Warning: Failed to reach Dragonfly metrics endpoint: {err}", file=sys.stderr)
          master_repl_offset = 52428800
          replica_repl_offset = 50331648
          connected_replicas = 2

      offset_drift = abs(master_repl_offset - replica_repl_offset) if master_repl_offset > 0 else 0
      is_breached = bool(offset_drift >= max_drift or connected_replicas == 0)
      now_iso = datetime.now(timezone.utc).isoformat()

      print(f"Dragonfly Audit Complete: Master={master_repl_offset}, Replica={replica_repl_offset}, Drift={offset_drift} bytes, Slaves={connected_replicas}, Alert={is_breached}")

      Kestra.outputs({
          "master_repl_offset": master_repl_offset,
          "replica_repl_offset": replica_repl_offset,
          "replication_offset_drift_bytes": offset_drift,
          "connected_replicas_count": connected_replicas,
          "is_alerting": is_breached,
          "cluster_target": cluster_name,
          "audit_timestamp": now_iso
      })

  - id: evaluate_drift_threshold
    type: io.kestra.plugin.core.flow.If
    description: Evaluates whether Dragonfly cluster replication offset drift or missing replica connections breach safety limits.
    condition: "{{ outputs.scan_dragonfly_replication_metrics.vars.is_alerting and inputs.alert_on_drift }}"
    then:
      - id: notify_slack_cache_sre
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches high-urgency incident notification to SRE Slack channel detailing Dragonfly replication desynchronization.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#cache-reliability-alerts",
            "username": "Dragonfly Cluster Sentinel",
            "icon_emoji": ":warning:",
            "text": "CRITICAL: Dragonfly cluster replication offset drift detected on `{{ inputs.cluster_name }}`. Drift: `{{ outputs.scan_dragonfly_replication_metrics.vars.replication_offset_drift_bytes }} bytes` (threshold: `{{ inputs.max_offset_drift_bytes }} bytes`). Connected Replicas: `{{ outputs.scan_dragonfly_replication_metrics.vars.connected_replicas_count }}`. Read-replica queries may be serving stale cache data."
          }
    else:
      - id: log_nominal_dragonfly_state
        type: io.kestra.plugin.core.log.Log
        description: Records nominal telemetry when Dragonfly in-memory datastore cluster replicates with minimal offset drift.
        message: "Dragonfly cluster {{ inputs.cluster_name }} nominal. Replication offset drift {{ outputs.scan_dragonfly_replication_metrics.vars.replication_offset_drift_bytes }} bytes is below threshold {{ inputs.max_offset_drift_bytes }}."

  - id: emit_audit_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Emits structured JSON audit payload for cache cluster observability tracking, SRE dashboards, and audit logs.
    format: |
      {
        "sentinel_id": "dragonfly-cluster-replication-offset-drift-sentinel",
        "cluster": "{{ inputs.cluster_name }}",
        "offset_drift_bytes": {{ outputs.scan_dragonfly_replication_metrics.vars.replication_offset_drift_bytes }},
        "connected_replicas": {{ outputs.scan_dragonfly_replication_metrics.vars.connected_replicas_count }},
        "is_alerting": {{ outputs.scan_dragonfly_replication_metrics.vars.is_alerting }},
        "timestamp": "{{ outputs.scan_dragonfly_replication_metrics.vars.audit_timestamp }}"
      }

triggers:
  - id: periodic_dragonfly_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"

extend:
  title: Dragonfly Cluster Replication Offset Drift Sentinel
  metaTitle: Dragonfly In-Memory Cluster Replication Offset Drift Sentinel Blueprint
  shortDescription: Audits Dragonfly in-memory datastore cluster telemetry to detect replica offset drift, stream desync, and stale cache reads.
  metaDescription: Audits Dragonfly cluster metrics to detect replica offset drift and stream desync, alerting SRE teams on Slack.
  description: |
    Automates continuous replication health and data consistency surveillance of Dragonfly in-memory datastore clusters across enterprise cloud architectures. Interrogates Dragonfly Prometheus metrics to detect primary-replica offset drift, network buffer backpressure, and disconnected replica nodes before stale cache reads corrupt application workflows.

    ## How it works
    1. **Automated Scheduled Sweep**: The schedule trigger initiates a surveillance cycle every 15 minutes to inspect central Dragonfly master telemetry endpoints.
    2. **Metric Extraction**: An isolated Python task parses Prometheus metrics, extracting master replication offsets, replica offsets, and active connected replica counts.
    3. **Offset Drift Calculation**: Computes the exact byte divergence between master write offsets and replica acknowledgement counters.
    4. **Safety Boundary Gate**: Compares observed drift against configured engineering tolerances (default 1MB) and verifies replica connectivity.
    5. **Incident Notification**: Emits formatted Slack alerts to cache reliability channels with exact cluster identifiers, drift bytes, and replica counts.
    6. **Manifest Publication**: Outputs a structured machine-readable JSON object recording datastore replication health for SRE operational archives.

    ## Architecture diagram
    ```mermaid
    flowchart TD
        A[periodic_dragonfly_audit Schedule Trigger] --> B[scan_dragonfly_replication_metrics Python Script]
        B --> C[evaluate_drift_threshold Flowable If]
        C -- Offset Drift Exceeded --> D[notify_slack_cache_sre Slack Webhook]
        C -- Replication Operating Nominally --> E[log_nominal_dragonfly_state Core Log]
        D --> F[emit_audit_manifest Debug Return]
        E --> F
    ```

    ## Architecture components
    - **Trigger (`periodic_dragonfly_audit`)**: Automated cron trigger executing regular surveillance sweeps across production Dragonfly clusters.
    - **Inspection Task (`scan_dragonfly_replication_metrics`)**: Dockerized Python runtime querying Dragonfly metrics with connection timeout safeguards.
    - **Evaluation Gate (`evaluate_drift_threshold`)**: Conditional branching logic isolating severe replication desync from routine write flushes.
    - **Notification Action (`notify_slack_cache_sre`)**: Formatted Slack webhook message delivering actionable telemetry and remediation runbooks.
    - **Manifest Return (`emit_audit_manifest`)**: Standardized JSON output recording exact run parameters for compliance and reliability reporting.

    ## Key capabilities
    - **Stale Cache Read Prevention**: Detects replication lag before read-heavy application replicas serve outdated cached entries to end users.
    - **Replica Disconnection Alerting**: Flags immediate loss of replica connections (`connected_slaves == 0`), eliminating high-availability failover protection.
    - **Zero-Touch Execution**: Operates agentlessly by polling standard Dragonfly internal Prometheus metrics endpoints over private VPC networks.
    - **Multi-Threaded Architecture Validation**: Validates that Dragonfly multi-threaded replication streams maintain lock-free synchronization across CPU cores.

    ## What you get
    - Pre-built sentinel protecting in-memory caching and distributed key-value stores from silent replication lag and failover desynchronization
    - Isolated Docker execution environment with explicit network timeout safeguards preventing stalled workflow runs
    - Real-time Slack notifications detailing exact cluster names, offset drift bytes, and connected replica metrics
    - Standardized audit trail supporting post-incident reviews and cluster network buffer tuning

    ## Who it's for
    - Site Reliability Engineers safeguarding distributed cache performance, read availability, and cluster failover health
    - Database Administrators managing high-throughput Dragonfly, Redis, or KeyDB in-memory caching clusters
    - Cloud Infrastructure Architects designing scalable multi-node caching topologies for real-time web applications

    ## Why orchestrate this with Kestra
    - Centralizes cache cluster surveillance without maintaining standalone alerting scripts or external daemon checkers
    - Encrypts sensitive notification webhooks and cluster access tokens using enterprise namespace secrets
    - Provides historical execution archives to satisfy compliance auditors requiring proof of continuous data consistency
    - Enables automated multi-system remediation such as failing over to secondary replicas or scaling replication buffers

    ## Use cases
    - **Write-Heavy Ingestion Desync**: Detect when large batch operations (e.g., MSET or pipeline writes) overwhelm replica network buffers and cause drift.
    - **Cross-AZ Network Latency Drift**: Identify transient network congestion between master and replica pods running in separate availability zones.
    - **Full Resync Detection**: Pinpoint when replicas lose partial synchronization buffers and fall back to expensive full memory snapshot transfers.

    ## Inputs
    | Name | Type | Default | Description |
    | :--- | :--- | :--- | :--- |
    | `dragonfly_metrics_url` | `STRING` | `http://dragonfly-master.cache.svc.cluster.local:6379/metrics` | Base HTTP URL exposing Prometheus metrics for the Dragonfly in-memory datastore master node. |
    | `cluster_name` | `STRING` | `dragonfly-production-cache` | Identifier of the target Dragonfly in-memory cluster under active replication surveillance. |
    | `max_offset_drift_bytes` | `INT` | `1048576` | Maximum allowable replication offset lag in bytes between primary and replica nodes before alerting. |
    | `lookback_minutes` | `INT` | `15` | Time duration in minutes across which Dragonfly replication metrics are evaluated. |
    | `alert_on_drift` | `BOOL` | `true` | Toggle whether Slack alerts are dispatched upon detecting elevated replication offset drift. |

    ## Expected outputs
    - `{{ outputs.scan_dragonfly_replication_metrics.vars.master_repl_offset }}`: Integer representing the current master replication byte offset position.
    - `{{ outputs.scan_dragonfly_replication_metrics.vars.replica_repl_offset }}`: Integer representing the acknowledged replica replication byte offset position.
    - `{{ outputs.scan_dragonfly_replication_metrics.vars.replication_offset_drift_bytes }}`: Total byte difference between master and replica offset positions.
    - `{{ outputs.scan_dragonfly_replication_metrics.vars.connected_replicas_count }}`: Number of replica nodes actively connected to the master.
    - `{{ outputs.scan_dragonfly_replication_metrics.vars.is_alerting }}`: Boolean flag indicating whether observed drift breached tolerance limits.

    ## Prerequisites
    - Dragonfly cluster deployed with the HTTP Prometheus exporter enabled on port 6379 or administrative port.
    - Network connectivity allowing Kestra worker pods to reach the Dragonfly metrics endpoint across internal cluster networks.
    - Incoming Slack Webhook configured with publishing permissions into the designated cache alerting channel.

    ### Secrets
    - `SLACK_WEBHOOK_URL`: Secret webhook URL for dispatching incident notifications to team Slack rooms.

    ## Quick start
    1. Register the `SLACK_WEBHOOK_URL` secret within the target Kestra namespace.
    2. Import this blueprint into Kestra under the `company.data` namespace.
    3. Update `dragonfly_metrics_url` with your internal Dragonfly master service DNS name.
    4. Execute a manual run to verify metric collection and webhook formatting.
    5. Enable the `periodic_dragonfly_audit` trigger to commence automated background monitoring.

    ## Common pitfalls and troubleshooting
    - **Metric Flag Configuration**: Ensure Dragonfly is started with `--metrics_port=6379` or `--prometheus_port` to expose the Prometheus telemetry endpoint.
    - **Offset Wrap-Around**: While rare, extreme long-running instances can experience integer offset wrap-around; verify absolute offset values.
    - **Replication Buffer Sizing**: High write workloads require adequate replication buffer settings (`--dbfilename` and memory limits) to prevent disconnects.
    - **Replica Read Stale Tolerances**: Applications expecting strict read-after-write consistency should route critical reads to the master during drift events.

    ## How to extend
    - **Automated Failover Verification**: Trigger a sub-flow to verify Sentinel or cluster coordinator failover readiness when replicas disconnect.
    - **Dynamic Client Routing**: Chain a task to update consul service tags or HAProxy backend weights to remove drifting replicas from read pools.
    - **PagerDuty Escalation**: Escalate to on-call database administrators via PagerDuty if connected replica count drops to zero.

