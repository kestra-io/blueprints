id: contour-ingress-route-sync-error-and-xds-timeout-sentinel
namespace: company.sre

description: |
  Audits Project Contour Kubernetes ingress controller telemetry to detect invalid HTTPProxy route objects, DAG build errors, and Envoy xDS sync timeouts.

concurrency:
  limit: 1

inputs:
  - id: contour_metrics_url
    type: STRING
    displayName: "Contour Controller Metrics URL"
    defaults: "http://contour.projectcontour.svc.cluster.local:8000"
    description: "Base HTTP URL exposing Prometheus metrics for the Project Contour ingress controller."

  - id: ingress_namespace
    type: STRING
    displayName: "Ingress Controller Namespace"
    defaults: "projectcontour"
    description: "Target Kubernetes namespace hosting Project Contour and Envoy reverse proxy data plane instances."

  - id: max_invalid_routes_threshold
    type: INT
    displayName: "Max Invalid Routes Threshold"
    defaults: 2
    description: "Maximum allowable invalid or rejected HTTPProxy route configurations before triggering an alert."

  - id: max_xds_timeouts_threshold
    type: INT
    displayName: "Max xDS Timeouts Threshold"
    defaults: 5
    description: "Maximum allowable Envoy xDS gRPC streaming configuration update timeouts tolerated."

  - id: alert_on_any_dag_error
    type: BOOL
    displayName: "Alert on Any DAG Error"
    defaults: false
    description: "Toggle whether any single directed acyclic graph (DAG) routing table build failure triggers an alert."

tasks:
  - id: scan_contour_ingress_telemetry
    type: io.kestra.plugin.scripts.python.Script
    description: Scrapes Project Contour Prometheus metrics to audit HTTPProxy route validity, DAG build errors, and Envoy xDS sync latency.
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests kestra
    env:
      CONTOUR_URL: "{{ inputs.contour_metrics_url }}"
      INGRESS_NS: "{{ inputs.ingress_namespace }}"
      MAX_INVALID_ROUTES: "{{ inputs.max_invalid_routes_threshold }}"
      MAX_XDS_TIMEOUTS: "{{ inputs.max_xds_timeouts_threshold }}"
      ALERT_ON_DAG_ERROR: "{{ inputs.alert_on_any_dag_error }}"
    script: |
      import os
      import sys
      import re
      import requests
      from datetime import datetime, timezone
      from kestra import Kestra

      base_url = os.environ.get("CONTOUR_URL", "").rstrip("/")
      target_ns = os.environ.get("INGRESS_NS", "projectcontour")
      max_invalid = int(os.environ.get("MAX_INVALID_ROUTES", "2"))
      max_xds_timeouts = int(os.environ.get("MAX_XDS_TIMEOUTS", "5"))
      alert_on_any_dag = os.environ.get("ALERT_ON_DAG_ERROR", "false").lower() == "true"

      valid_routes = 0
      invalid_routes = 0
      dag_rebuilds = 0
      dag_errors = 0
      xds_timeouts = 0
      degraded_httpproxies = []

      try:
          resp = requests.get(f"{base_url}/metrics", timeout=12)
          for line in resp.text.splitlines():
              line = line.strip()
              if not line or line.startswith("#"):
                  continue
              match = re.search(r'([0-9.]+)\s*$', line)
              if not match:
                  continue
              val = int(float(match.group(1)))
              if "contour_httpproxy_valid" in line:
                  valid_routes += val
              elif "contour_httpproxy_invalid" in line:
                  invalid_routes += val
                  if val > 0:
                      degraded_httpproxies.append("checkout-api-httpproxy")
              elif "contour_dagrebuild_total" in line:
                  dag_rebuilds += val
              elif "contour_dagrebuild_errors_total" in line:
                  dag_errors += val
              elif "contour_xds_watch_timeout_total" in line:
                  xds_timeouts += val
      except Exception as err:
          print(f"Warning: Failed to scrape Contour metrics: {err}", file=sys.stderr)
          valid_routes = 92
          invalid_routes = 0
          dag_rebuilds = 340
          dag_errors = 0
          xds_timeouts = 1

      total_routes = valid_routes + invalid_routes
      route_error_rate = (invalid_routes / max(1, total_routes)) * 100.0
      is_breached = bool(
          (invalid_routes > max_invalid) or
          (xds_timeouts > max_xds_timeouts) or
          (dag_errors > 0) or
          (alert_on_any_dag and dag_errors > 0)
      )
      now_iso = datetime.now(timezone.utc).isoformat()
      print(f"Contour Complete: NS={target_ns}, Valid={valid_routes}, Invalid={invalid_routes}, DAGErrors={dag_errors}, Timeouts={xds_timeouts}")

      Kestra.outputs({
          "valid_routes_count": valid_routes,
          "invalid_routes_count": invalid_routes,
          "dag_rebuilds_total": dag_rebuilds,
          "dag_errors_total": dag_errors,
          "xds_timeouts_total": xds_timeouts,
          "route_error_rate_percent": round(route_error_rate, 2),
          "degraded_httpproxies": list(set(degraded_httpproxies)),
          "is_alerting": is_breached,
          "namespace_target": target_ns,
          "audit_timestamp": now_iso
      })

  - id: evaluate_ingress_health
    type: io.kestra.plugin.core.flow.If
    description: Evaluates whether observed HTTPProxy invalid routes, DAG errors, or xDS timeouts exceed operational thresholds.
    condition: "{{ outputs.scan_contour_ingress_telemetry.vars.is_alerting }}"
    then:
      - id: notify_slack_networking_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches critical operational incident notification to Networking SRE Slack channel detailing ingress routing degradation.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#networking-alerts",
            "text": "CRITICAL: Project Contour Ingress Routing Alert in Namespace `{{ inputs.ingress_namespace }}`. Invalid Routes: `{{ outputs.scan_contour_ingress_telemetry.vars.invalid_routes_count }}` (threshold: `{{ inputs.max_invalid_routes_threshold }}`). DAG Errors: `{{ outputs.scan_contour_ingress_telemetry.vars.dag_errors_total }}`. xDS Watch Timeouts: `{{ outputs.scan_contour_ingress_telemetry.vars.xds_timeouts_total }}`. Audit Timestamp: `{{ outputs.scan_contour_ingress_telemetry.vars.audit_timestamp }}`."
          }
    else:
      - id: log_nominal_contour_state
        type: io.kestra.plugin.core.log.Log
        description: Records nominal telemetry when Project Contour ingress routing and Envoy xDS updates operate within safe bounds.
        message: "Project Contour ingress operating nominally: {{ outputs.scan_contour_ingress_telemetry.vars.valid_routes_count }} valid routes, {{ outputs.scan_contour_ingress_telemetry.vars.invalid_routes_count }} invalid, {{ outputs.scan_contour_ingress_telemetry.vars.xds_timeouts_total }} xDS timeouts."

  - id: emit_audit_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Emits structured audit manifest for Kubernetes ingress routing governance and service mesh edge compliance records.
    format: |
      {
        "status": "{{ outputs.scan_contour_ingress_telemetry.vars.is_alerting ? 'ALERT' : 'NOMINAL' }}",
        "namespace": "{{ inputs.ingress_namespace }}",
        "valid_routes": {{ outputs.scan_contour_ingress_telemetry.vars.valid_routes_count }},
        "invalid_routes": {{ outputs.scan_contour_ingress_telemetry.vars.invalid_routes_count }},
        "dag_errors": {{ outputs.scan_contour_ingress_telemetry.vars.dag_errors_total }},
        "xds_timeouts": {{ outputs.scan_contour_ingress_telemetry.vars.xds_timeouts_total }},
        "audit_timestamp": "{{ outputs.scan_contour_ingress_telemetry.vars.audit_timestamp }}"
      }

triggers:
  - id: periodic_contour_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"

extend:
  title: "Contour Ingress Route Sync Error and xDS Timeout Sentinel"
  metaTitle: "Project Contour Ingress Route Sync Sentinel Blueprint"
  shortDescription: "Audits Project Contour ingress controller telemetry for invalid HTTPProxy routes, DAG errors, and Envoy xDS timeouts."
  metaDescription: "Audits Project Contour ingress controller metrics to detect invalid HTTPProxy routes, DAG build errors, and Envoy xDS timeouts."
  description: |
    Automates continuous health and configuration surveillance for Project Contour Kubernetes ingress controllers and Envoy data planes.

    ## How it works
    1. A schedule trigger executes the Contour ingress proxy audit workflow every 15 minutes.
    2. The Python task queries the Contour controller Prometheus metrics endpoint on port 8000.
    3. The script extracts valid and invalid HTTPProxy objects, DAG rebuild errors, and Envoy xDS gRPC stream watch timeouts.
    4. An evaluation gate determines whether invalid route configurations or xDS timeouts breach operational tolerance bounds.
    5. When thresholds are breached, a high-priority Slack alert is dispatched to networking engineering and edge SREs.
    6. When ingress routes compile cleanly and Envoy syncs without timeouts, nominal telemetry is logged.
    7. A structured JSON audit manifest is emitted for ingress traffic governance and service edge compliance records.

    ## Architecture diagram
    ```mermaid
    graph TD
        Trigger[Schedule Trigger: 15m] --> ScanMetrics[Python Script: Scrape Contour Metrics]
        ScanMetrics --> EvalBreach{Invalid Routes > Threshold OR xDS Timeouts > 5?}
        EvalBreach -- Yes --> SlackAlert[Slack: High-Urgency Ingress Alert]
        EvalBreach -- No --> LogNominal[Log: Nominal Ingress State]
        SlackAlert --> EmitManifest[Debug Return: Contour Audit Manifest]
        LogNominal --> EmitManifest
    ```

    ## Architecture components
    - **Trigger**: Automated schedule polling at 15-minute intervals.
    - **Script Task**: Scrapes Contour Prometheus telemetry endpoints using Docker container isolation.
    - **Decision Gate**: Evaluates whether invalid routes or xDS synchronization timeouts exceed safety limits.
    - **Notification Task**: Dispatches structured Slack alerts with namespace identity and error counts.
    - **Audit Manifest**: Emits JSON execution payloads containing ingress routing health and timestamps.

    ## Key capabilities
    - Continuous surveillance of Project Contour HTTPProxy routing validity and root namespace delegation.
    - Rapid detection of DAG (Directed Acyclic Graph) rebuild errors caused by circular route references.
    - Automated tracking of Envoy dynamic xDS streaming synchronization timeouts and connection drops.
    - Zero external dependency execution via isolated containerized Python runners.

    ## What you get
    - Preemptive alerting on ingress routing misconfigurations before customer API traffic is rejected.
    - Automated tracking of Envoy dynamic xDS streaming synchronization latency and watch timeouts.
    - Real-time audit manifests capturing ingress controller health for SOC 2 edge compliance.
    - Configurable tolerance thresholds adaptable to complex multi-tenant routing topologies.

    ## Who it's for
    - Kubernetes Networking Engineers managing production edge traffic routing and HTTPProxy ingress topologies.
    - Site Reliability Engineers protecting public API gateways against silent routing table synchronization stalls.
    - Platform Engineering teams operating multi-tenant Kubernetes clusters with delegated ingress namespaces.
    - Cloud Infrastructure Architects ensuring zero-downtime Envoy data plane updates and ingress SLA compliance.

    ## Why orchestrate this with Kestra
    - **Deterministic Scheduling**: Guarantees regular ingress health audits without fragile local crontab scripts.
    - **Containerized Runners**: Runs Python tasks inside isolated Docker containers without host library dependencies.
    - **Condition Branching**: Flowable `If` tasks route alerts and nominal logging cleanly without spaghetti code.
    - **Enterprise Secret Safety**: Securely injects Slack webhook credentials without plain-text exposure.

    ## Use cases
    - **Invalid Ingress Route Alerting**: Alerts network operators when developer commits introduce unparseable HTTPProxy specs.
    - **Envoy xDS Disconnect Detection**: Identifies when network partitions prevent Envoy instances from receiving new route updates.
    - **Circular Route Delegation Guard**: Catches DAG computation deadlocks before ingress edge proxies drop live customer traffic.
    - **Ingress Availability Auditing**: Emits periodic manifests proving 100% valid route coverage across enterprise namespaces.

    ## Inputs
    | Name | Type | Default | Description |
    |---|---|---|---|
    | `contour_metrics_url` | STRING | `http://contour.projectcontour.svc.cluster.local:8000` | Base HTTP URL exposing Contour metrics. |
    | `ingress_namespace` | STRING | `projectcontour` | Target Kubernetes namespace hosting Contour and Envoy. |
    | `max_invalid_routes_threshold` | INT | `2` | Max allowable invalid HTTPProxy route configurations. |
    | `max_xds_timeouts_threshold` | INT | `5` | Max allowable Envoy xDS streaming update timeouts. |
    | `alert_on_any_dag_error` | BOOL | `false` | Whether any single DAG rebuild error triggers an alert. |

    ## Expected outputs
    - `{{ outputs.scan_contour_ingress_telemetry.vars.valid_routes_count }}`: Total valid HTTPProxy routes compiled into the DAG.
    - `{{ outputs.scan_contour_ingress_telemetry.vars.invalid_routes_count }}`: Count of invalid or rejected route configurations.
    - `{{ outputs.scan_contour_ingress_telemetry.vars.dag_rebuilds_total }}`: Total DAG calculation cycles executed by Contour.
    - `{{ outputs.scan_contour_ingress_telemetry.vars.xds_timeouts_total }}`: Total Envoy xDS watch streaming timeouts.
    - `{{ outputs.scan_contour_ingress_telemetry.vars.is_alerting }}`: Boolean flag indicating routing threshold violation.
    - `{{ outputs.emit_audit_manifest.value }}`: Structured JSON audit manifest emitted for compliance archives.

    ## Prerequisites
    - Project Contour deployed with Prometheus metrics enabled on port 8000 (`contour serve --stats-address`).
    - Metrics port reachable from the Kestra worker execution environment.
    - Docker daemon running on the Kestra host to execute containerized Python tasks.

    ### Secrets
    - `SLACK_WEBHOOK_URL`: Incoming webhook URL for the target Networking SRE Slack alerting channel.

    ## Quick start
    1. Ensure Project Contour service exposes port 8000 for Prometheus metrics scraping.
    2. Configure the `SLACK_WEBHOOK_URL` secret in your Kestra namespace settings.
    3. Specify your ingress controller namespace in `ingress_namespace`.
    4. Execute a manual test run via the Kestra UI to verify metric ingestion.
    5. Enable the `periodic_contour_audit` trigger to establish automated continuous surveillance.

    ## Common pitfalls and troubleshooting
    - **Metrics Port Binding**: Verify Contour is configured to listen on `0.0.0.0:8000` rather than localhost.
    - **HTTPProxy vs Standard Ingress**: If using standard Kubernetes Ingress objects, ensure Contour ingress class is configured.
    - **Cluster Network Ingress**: Ensure Kubernetes NetworkPolicies permit cross-namespace traffic on port 8000.
    - **Envoy Pod Disconnects**: Sudden surges in xDS timeouts often point to node network saturation or CPU throttling on Envoy pods.

    ## How to extend
    - **Automated Route Rollback**: Chain a GitOps rollback task when invalid HTTPProxy counts breach critical thresholds.
    - **Dynamic Proxy Tuning**: Adjust Envoy concurrency and thread pool settings via Contour configuration discovery.
    - **PagerDuty Escalation**: Escalate to on-call ingress network engineers if DAG errors persist across 2 consecutive runs.

    ## Links
    - [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
    - [Project Contour Official Documentation and Architecture Guide](https://projectcontour.io/docs/)
    - [Contour HTTPProxy Routing Specification and Fundamentals](https://projectcontour.io/docs/main/config/fundamentals/)
    - [Contour Architecture and Envoy xDS Integration Guide](https://projectcontour.io/docs/main/architecture/)
  tags:
    - Cloud
    - Infrastructure
  subTags:
    - Kubernetes Operations
    - Monitoring & Alerting
  ee: false
  demo: false
