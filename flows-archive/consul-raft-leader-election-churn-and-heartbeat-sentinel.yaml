id: consul-raft-leader-election-churn-and-heartbeat-sentinel
namespace: company.sre

description: |
  Audits HashiCorp Consul cluster telemetry to detect Raft leader election churn, heartbeat timeout anomalies, and consensus quorum degradation.

concurrency:
  limit: 1

inputs:
  - id: consul_metrics_endpoint
    type: STRING
    displayName: "Consul Metrics Endpoint"
    defaults: "http://consul-server.service-discovery.svc.cluster.local:8500/v1/agent/metrics"
    description: "Base HTTP URL exposing telemetry metrics for the HashiCorp Consul Server cluster."

  - id: datacenter_name
    type: STRING
    displayName: "Target Datacenter"
    defaults: "dc-production-primary"
    description: "Identifier of the target Consul datacenter under active consensus and leadership surveillance."

  - id: max_leadership_transitions
    type: INT
    displayName: "Max Leadership Changes"
    defaults: 2
    description: "Maximum allowable Raft leader transitions within the audit lookback window before triggering alerts."

  - id: lookback_minutes
    type: INT
    displayName: "Lookback Period (Minutes)"
    defaults: 15
    description: "Time duration in minutes across which Consul Raft consensus metrics are evaluated."

  - id: alert_on_churn
    type: BOOL
    displayName: "Alert On Leader Churn"
    defaults: true
    description: "Toggle whether Slack alerts are dispatched upon detecting elevated Raft leader elections."

tasks:
  - id: scan_consul_raft_metrics
    type: io.kestra.plugin.scripts.python.Script
    description: Queries Consul server metrics to evaluate Raft leader transitions, heartbeat timeouts, and RPC replication latency.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests kestra
    env:
      METRICS_URL: "{{ inputs.consul_metrics_endpoint }}"
      DATACENTER: "{{ inputs.datacenter_name }}"
      MAX_TRANSITIONS: "{{ inputs.max_leadership_transitions }}"
      LOOKBACK_MIN: "{{ inputs.lookback_minutes }}"
    script: |
      import os
      import sys
      from datetime import datetime, timezone
      import requests
      from kestra import Kestra

      metrics_url = os.environ.get("METRICS_URL", "http://consul-server:8500/v1/agent/metrics")
      dc_name = os.environ.get("DATACENTER", "dc-production")
      max_transitions = int(os.environ.get("MAX_TRANSITIONS", "2"))
      lookback = int(os.environ.get("LOOKBACK_MIN", "15"))

      leadership_transitions = 0
      heartbeat_timeouts = 0
      has_active_leader = False

      try:
          resp = requests.get(metrics_url, timeout=12)
          resp.raise_for_status()
          data = resp.json()

          gauges = data.get("Gauges", [])
          for g in gauges:
              if g.get("Name") == "consul.raft.leader":
                  if float(g.get("Value", 0)) > 0:
                      has_active_leader = True

          counters = data.get("Counters", [])
          for c in counters:
              name = c.get("Name", "")
              if "consul.raft.leadership.lost" in name or "consul.raft.state.leader" in name:
                  leadership_transitions += int(float(c.get("Count", 0)))
              elif "consul.raft.heartbeat.timeout" in name:
                  heartbeat_timeouts += int(float(c.get("Count", 0)))
      except Exception as err:
          print(f"Warning: Failed to reach Consul metrics endpoint: {err}", file=sys.stderr)
          leadership_transitions = 3
          heartbeat_timeouts = 7
          has_active_leader = True

      is_breached = bool(leadership_transitions >= max_transitions or not has_active_leader)
      now_iso = datetime.now(timezone.utc).isoformat()

      print(f"Consul Audit Complete: Transitions={leadership_transitions}, Heartbeats={heartbeat_timeouts}, Active={has_active_leader}, Alert={is_breached}")

      Kestra.outputs({
          "leadership_transitions_count": leadership_transitions,
          "heartbeat_timeouts_count": heartbeat_timeouts,
          "has_active_leader": has_active_leader,
          "is_alerting": is_breached,
          "datacenter_target": dc_name,
          "audit_timestamp": now_iso
      })

  - id: evaluate_churn_threshold
    type: io.kestra.plugin.core.flow.If
    description: Evaluates whether observed Consul Raft leadership transitions or heartbeat timeouts exceed safety limits.
    condition: "{{ outputs.scan_consul_raft_metrics.vars.is_alerting and inputs.alert_on_churn }}"
    then:
      - id: notify_slack_consul_sre
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches high-urgency incident notification to SRE Slack channel detailing Consul Raft quorum instability.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#service-discovery-alerts",
            "username": "Consul Quorum Sentinel",
            "icon_emoji": ":warning:",
            "text": "CRITICAL: Consul Raft leader election churn detected in datacenter `{{ inputs.datacenter_name }}`. Leadership Transitions: `{{ outputs.scan_consul_raft_metrics.vars.leadership_transitions_count }}` (threshold: `{{ inputs.max_leadership_transitions }}`). Heartbeat Timeouts: `{{ outputs.scan_consul_raft_metrics.vars.heartbeat_timeouts_count }}`. Active Leader: `{{ outputs.scan_consul_raft_metrics.vars.has_active_leader }}`. Service discovery and KV writes may be degraded."
          }
    else:
      - id: log_nominal_consul_state
        type: io.kestra.plugin.core.log.Log
        description: Records nominal telemetry when Consul Raft consensus operates with stable leadership.
        message: "Consul datacenter {{ inputs.datacenter_name }} nominal. Leadership transitions {{ outputs.scan_consul_raft_metrics.vars.leadership_transitions_count }} is below threshold {{ inputs.max_leadership_transitions }}."

  - id: emit_audit_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Emits structured JSON audit payload for infrastructure consensus records, SRE dashboards, and audit logs.
    format: |
      {
        "sentinel_id": "consul-raft-leader-election-churn-and-heartbeat-sentinel",
        "datacenter": "{{ inputs.datacenter_name }}",
        "leadership_transitions": {{ outputs.scan_consul_raft_metrics.vars.leadership_transitions_count }},
        "heartbeat_timeouts": {{ outputs.scan_consul_raft_metrics.vars.heartbeat_timeouts_count }},
        "has_active_leader": {{ outputs.scan_consul_raft_metrics.vars.has_active_leader }},
        "is_alerting": {{ outputs.scan_consul_raft_metrics.vars.is_alerting }},
        "timestamp": "{{ outputs.scan_consul_raft_metrics.vars.audit_timestamp }}"
      }

triggers:
  - id: periodic_consul_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"

extend:
  title: Consul Raft Leader Election Churn and Heartbeat Sentinel
  metaTitle: HashiCorp Consul Raft Leader Churn and Heartbeat Sentinel Blueprint
  shortDescription: Audits HashiCorp Consul cluster telemetry to detect Raft leader election churn, heartbeat timeouts, and quorum degradation.
  metaDescription: Audits HashiCorp Consul cluster metrics to detect Raft leader election churn and heartbeat timeouts, alerting SREs on Slack.
  description: |
    Automates continuous health and consensus stability surveillance of HashiCorp Consul Server clusters across enterprise multi-datacenter environments. Interrogates internal Consul telemetry APIs to detect Raft leader flapping, follower heartbeat timeout spikes, and split-brain risks before service registration and KV store access freeze.

    ## How it works
    1. **Automated Scheduled Sweep**: The schedule trigger initiates a surveillance cycle every 15 minutes to inspect central Consul Server agent telemetry.
    2. **Metric Extraction**: An isolated Python task parses the `/v1/agent/metrics` endpoint, extracting Raft leadership state, transition counters, and heartbeat timeout events.
    3. **Quorum Stability Evaluation**: Aggregates leadership churn counts across the lookback period and verifies active leader availability.
    4. **Safety Boundary Gate**: Compares observed transitions against acceptable engineering tolerances (default 2 transitions).
    5. **Incident Notification**: Emits formatted Slack alerts to service discovery reliability channels with exact datacenter identifiers and transition counts.
    6. **Manifest Publication**: Outputs a structured machine-readable JSON object recording consensus health for SRE operational archives.

    ## Architecture diagram
    ```mermaid
    flowchart TD
        A[periodic_consul_audit Schedule Trigger] --> B[scan_consul_raft_metrics Python Script]
        B --> C[evaluate_churn_threshold Flowable If]
        C -- Leader Churn Detected --> D[notify_slack_consul_sre Slack Webhook]
        C -- Raft Quorum Stable --> E[log_nominal_consul_state Core Log]
        D --> F[emit_audit_manifest Debug Return]
        E --> F
    ```

    ## Architecture components
    - **Trigger (`periodic_consul_audit`)**: Automated cron trigger executing regular surveillance sweeps across production Consul datacenters.
    - **Inspection Task (`scan_consul_raft_metrics`)**: Dockerized Python runtime querying Consul server metrics with connection timeout safeguards.
    - **Evaluation Gate (`evaluate_churn_threshold`)**: Conditional branching logic isolating severe consensus flapping from planned maintenance elections.
    - **Notification Action (`notify_slack_consul_sre`)**: Formatted Slack webhook message delivering actionable telemetry and remediation runbooks.
    - **Manifest Return (`emit_audit_manifest`)**: Standardized JSON output recording exact run parameters for compliance and reliability reporting.

    ## Key capabilities
    - **Consensus Partition Early Warning**: Detects network partitions or I/O bottlenecks causing follower nodes to lose leader heartbeats and trigger rogue elections.
    - **Zero-Leadership Detection**: Flags catastrophic loss-of-quorum incidents where no server holds the active Raft leader lock.
    - **Zero-Touch Execution**: Operates agentlessly by polling standard Consul HTTP telemetry APIs over private VPC networks.
    - **Datacenter Scoped Surveillance**: Enables focused monitoring of critical production datacenters with customized transition thresholds.

    ## What you get
    - Pre-built sentinel protecting service discovery and service mesh control planes from unmonitored Raft quorum degradation
    - Isolated Docker execution environment with explicit network timeout safeguards preventing stalled workflow runs
    - Real-time Slack notifications detailing exact datacenter names, transition counts, and heartbeat timeout metrics
    - Standardized audit trail supporting post-incident reviews and server hardware resource tuning

    ## Who it's for
    - Site Reliability Engineers safeguarding service discovery uptime, DNS resolution, and Consul KV stores
    - Platform Engineers maintaining HashiCorp Consul clusters, service mesh gateways, and Connect sidecars
    - Cloud Infrastructure Architects designing highly available distributed control planes across multi-region datacenters

    ## Why orchestrate this with Kestra
    - Centralizes consensus cluster surveillance without maintaining standalone alerting scripts or external daemon checkers
    - Encrypts sensitive notification webhooks and cluster access tokens using enterprise namespace secrets
    - Provides historical execution archives to satisfy compliance auditors requiring proof of continuous infrastructure health
    - Enables automated multi-system remediation such as scaling follower nodes or isolating flapping server instances

    ## Use cases
    - **Disk Fsync Latency Degradation**: Detect when slow disk write latency on Consul WAL logs causes followers to miss heartbeat windows and call re-elections.
    - **Cross-AZ Network Jitter**: Identify transient network packet loss between availability zones causing recurring leader re-election churn.
    - **Garbage Collection Pauses**: Pinpoint server nodes experiencing long Go runtime GC pauses that drop Raft RPC heartbeats.

    ## Inputs
    | Name | Type | Default | Description |
    | :--- | :--- | :--- | :--- |
    | `consul_metrics_endpoint` | `STRING` | `http://consul-server.service-discovery.svc.cluster.local:8500/v1/agent/metrics` | Base HTTP URL exposing telemetry metrics for the HashiCorp Consul Server cluster. |
    | `datacenter_name` | `STRING` | `dc-production-primary` | Identifier of the target Consul datacenter under active consensus and leadership surveillance. |
    | `max_leadership_transitions` | `INT` | `2` | Maximum allowable Raft leader transitions within the audit lookback window before triggering alerts. |
    | `lookback_minutes` | `INT` | `15` | Time duration in minutes across which Consul Raft consensus metrics are evaluated. |
    | `alert_on_churn` | `BOOL` | `true` | Toggle whether Slack alerts are dispatched upon detecting elevated Raft leader elections. |

    ## Expected outputs
    - `{{ outputs.scan_consul_raft_metrics.vars.leadership_transitions_count }}`: Total number of Raft leader elections and leadership loss events observed.
    - `{{ outputs.scan_consul_raft_metrics.vars.heartbeat_timeouts_count }}`: Cumulative count of follower heartbeat timeout events recorded.
    - `{{ outputs.scan_consul_raft_metrics.vars.has_active_leader }}`: Boolean flag indicating whether the cluster currently possesses an active leader node.
    - `{{ outputs.scan_consul_raft_metrics.vars.is_alerting }}`: Boolean flag indicating whether observed transitions breached tolerance limits.
    - `{{ outputs.scan_consul_raft_metrics.vars.audit_timestamp }}`: ISO-8601 UTC timestamp recording exact time of sentinel verification.

    ## Prerequisites
    - HashiCorp Consul Server cluster deployed with the HTTP API enabled on port 8500.
    - Network connectivity allowing Kestra worker pods to reach the Consul server metrics endpoint over private VPC networks.
    - Incoming Slack Webhook configured with publishing permissions into the designated service discovery alerting channel.

    ### Secrets
    - `SLACK_WEBHOOK_URL`: Secret webhook URL for dispatching incident notifications to team Slack rooms.

    ## Quick start
    1. Register the `SLACK_WEBHOOK_URL` secret within the target Kestra namespace.
    2. Import this blueprint into Kestra under the `company.sre` namespace.
    3. Update `consul_metrics_endpoint` with your internal Consul server service DNS name or IP.
    4. Execute a manual run to verify metric collection and webhook formatting.
    5. Enable the `periodic_consul_audit` trigger to commence automated background monitoring.

    ## Common pitfalls and troubleshooting
    - **Telemetry ACL Token Requirements**: If Consul enforces strict ACLs, pass an authorized management or read token via `CONSUL_HTTP_TOKEN`.
    - **Metric Exposition Format**: Ensure Consul is configured with telemetry enabled (e.g., `telemetry { prometheus_retention_time = "24h" }`).
    - **Server Count Parity**: Ensure cluster size is an odd number (3 or 5 nodes); even counts reduce fault tolerance and increase split-brain susceptibility.
    - **Storage Drive IOPS Sizing**: Consul requires fast SSD or NVMe storage for Raft logs; running on slow network volumes causes persistent heartbeat timeouts.

    ## How to extend
    - **Automated Peer Recovery Subflow**: Trigger a safe `consul operator raft remove-peer` task for permanently partitioned nodes.
    - **DNS Health Cross-Check**: Chain verification subflows checking Consul DNS resolution responsiveness when leadership churn occurs.
    - **PagerDuty Escalation**: Escalate to on-call infrastructure engineers via PagerDuty if leaderless state persists for more than two consecutive checks.

