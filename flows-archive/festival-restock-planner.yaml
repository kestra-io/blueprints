id: festival-restock-planner
namespace: company.team
description: |
  Plan restocking for a shop ahead of festivals: forecast daily demand per item from
  recent sales with a festival uplift per category, find items that will run out before
  a new order can arrive, and work out how much to order, rounded to the supplier's pack
  size, and the last day to place each order.

inputs:
  - id: inventory
    type: FILE
    required: false
    description: CSV of items with the columns sku, item, category, on_hand, sold_last_28_days, lead_time_days, pack_size and unit_cost. Leave empty to use the built-in sample.
  - id: festivals
    type: FILE
    required: false
    description: CSV of the festival calendar with the columns festival, starts_on, ends_on, category and uplift_pct (extra demand in percent during the festival for that category, use * for every category). Leave empty to use the built-in sample.
  - id: safety_days
    type: INT
    defaults: 3
    description: Extra days of normal demand to keep in stock after the last festival day.
  - id: order_buffer_days
    type: INT
    defaults: 2
    description: Days of margin between a delivery and the start of a festival.
  - id: as_of
    type: STRING
    required: false
    description: Date to plan from, as YYYY-MM-DD. Leave empty to use today.
  - id: notify_slack
    type: BOOL
    defaults: false
    description: Post the order list to Slack when something must be ordered. Requires the SLACK_WEBHOOK_URL secret.

triggers:
  - id: weekly_plan
    type: io.kestra.plugin.core.trigger.Schedule
    description: Plan every Monday at 08:00 IST, before the week's supplier orders. Shipped disabled; enable it once the flow reads your real stock and festival calendar.
    cron: "0 8 * * MON"
    timezone: Asia/Kolkata
    disabled: true
  - id: on_inventory_export
    type: io.kestra.plugin.core.trigger.Flow
    description: Event-based. Run as soon as the flow that exports your stock and sales succeeds, using the file it outputs. Shipped disabled; set the namespace, flow id and output name of your own export flow.
    disabled: true
    inputs:
      inventory: "{{ trigger.outputs.inventory_file }}"
    dependsOn:
      - namespace: company.team
        flowId: export-inventory
        states: [SUCCESS]

tasks:
  - id: sample_inventory
    type: io.kestra.plugin.core.storage.Write
    description: Twelve items of a neighbourhood grocery store with one example of every case the planner handles. Only used when inventory is empty.
    extension: .csv
    content: |
      sku,item,category,on_hand,sold_last_28_days,lead_time_days,pack_size,unit_cost
      SW-001,Kaju katli 500 g,sweets,18,42,3,12,420.00
      SW-002,Soan papdi 250 g,sweets,60,84,5,24,85.00
      DF-001,Almonds 250 g,dry_fruits,25,56,7,10,260.00
      DF-002,Cashews 250 g,dry_fruits,40,35,7,10,290.00
      OL-001,Groundnut oil 1 L,oil_ghee,30,140,4,12,185.00
      OL-002,Cow ghee 500 ml,oil_ghee,22,49,4,12,330.00
      PJ-001,Diyas pack of 12,puja,15,8,12,20,60.00
      PJ-002,Agarbatti 100 sticks,puja,90,70,6,50,45.00
      ST-001,Sona masoori rice 5 kg,staples,80,168,3,10,340.00
      ST-002,Toor dal 1 kg,staples,120,112,3,20,150.00
      SN-001,Aloo bhujia 400 g,snacks,4,84,2,24,95.00
      HM-001,Floor cleaner 1 L,household,35,0,5,12,120.00

  - id: sample_festivals
    type: io.kestra.plugin.core.storage.Write
    description: An example festival calendar with dates relative to today, so the sample always looks ahead. Replace it with your own calendar. Only used when festivals is empty.
    extension: .csv
    content: |
      festival,starts_on,ends_on,category,uplift_pct
      Diwali week,{{ now() | dateAdd(14, 'DAYS') | date('yyyy-MM-dd') }},{{ now() | dateAdd(20, 'DAYS') | date('yyyy-MM-dd') }},sweets,250
      Diwali week,{{ now() | dateAdd(14, 'DAYS') | date('yyyy-MM-dd') }},{{ now() | dateAdd(20, 'DAYS') | date('yyyy-MM-dd') }},dry_fruits,300
      Diwali week,{{ now() | dateAdd(14, 'DAYS') | date('yyyy-MM-dd') }},{{ now() | dateAdd(20, 'DAYS') | date('yyyy-MM-dd') }},puja,900
      Diwali week,{{ now() | dateAdd(14, 'DAYS') | date('yyyy-MM-dd') }},{{ now() | dateAdd(20, 'DAYS') | date('yyyy-MM-dd') }},oil_ghee,120
      Diwali week,{{ now() | dateAdd(14, 'DAYS') | date('yyyy-MM-dd') }},{{ now() | dateAdd(20, 'DAYS') | date('yyyy-MM-dd') }},snacks,150
      Diwali week,{{ now() | dateAdd(14, 'DAYS') | date('yyyy-MM-dd') }},{{ now() | dateAdd(20, 'DAYS') | date('yyyy-MM-dd') }},*,20

  - id: plan
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: Forecast demand day by day with the festival uplift, simulate stock until the last festival day, and compute order quantities and order-by dates in DuckDB. The per-item plan is exported to CSV and the last query returns the summary.
    inputFiles:
      inventory.csv: "{{ inputs.inventory ?? outputs.sample_inventory.uri }}"
      festivals.csv: "{{ inputs.festivals ?? outputs.sample_festivals.uri }}"
    outputFiles:
      - restock_plan.csv
    fetchType: FETCH_ONE
    sql: |
      CREATE TABLE params AS
      SELECT
        coalesce(TRY_CAST(NULLIF(trim('{{ inputs.as_of ?? '' }}'), '') AS DATE), current_date) AS as_of,
        {{ inputs.safety_days }} AS safety_days,
        {{ inputs.order_buffer_days }} AS buffer_days;

      CREATE TABLE items AS
      SELECT
        trim(sku) AS sku,
        trim(item) AS item,
        lower(trim(category)) AS category,
        coalesce(TRY_CAST(on_hand AS DOUBLE), 0) AS on_hand,
        coalesce(TRY_CAST(sold_last_28_days AS DOUBLE), 0) / 28.0 AS daily_demand,
        coalesce(TRY_CAST(lead_time_days AS INTEGER), 7) AS lead_time_days,
        greatest(coalesce(TRY_CAST(pack_size AS INTEGER), 1), 1) AS pack_size,
        coalesce(TRY_CAST(unit_cost AS DECIMAL(12, 2)), 0) AS unit_cost
      FROM read_csv('{{ workingDir }}/inventory.csv', header = true, all_varchar = true);

      CREATE TABLE festivals AS
      SELECT
        trim(festival) AS festival,
        TRY_CAST(starts_on AS DATE) AS starts_on,
        TRY_CAST(ends_on AS DATE) AS ends_on,
        lower(trim(category)) AS category,
        coalesce(TRY_CAST(uplift_pct AS DOUBLE), 0) AS uplift_pct
      FROM read_csv('{{ workingDir }}/festivals.csv', header = true, all_varchar = true)
      WHERE TRY_CAST(ends_on AS DATE) >= (SELECT as_of FROM params);

      CREATE TABLE horizon AS
      SELECT
        p.as_of,
        coalesce(max(f.ends_on), p.as_of + 14) + p.safety_days AS plan_until,
        min(f.starts_on) AS next_festival_start,
        coalesce(first(f.festival ORDER BY f.starts_on), 'none') AS next_festival
      FROM params AS p
      LEFT JOIN festivals AS f ON true
      GROUP BY p.as_of, p.safety_days;

      CREATE TABLE days AS
      SELECT CAST(d AS DATE) AS day
      FROM horizon, generate_series(horizon.as_of, horizon.plan_until - 1, INTERVAL 1 DAY) AS t(d);

      CREATE TABLE demand AS
      SELECT
        i.sku,
        d.day,
        i.daily_demand * (1 + coalesce(max(f.uplift_pct) FILTER (WHERE f.category = i.category), max(f.uplift_pct) FILTER (WHERE f.category = '*'), 0) / 100) AS qty,
        bool_or(f.festival IS NOT NULL AND (f.category = i.category OR f.category = '*')) AS festival_day
      FROM items AS i
      CROSS JOIN days AS d
      LEFT JOIN festivals AS f ON d.day BETWEEN f.starts_on AND f.ends_on
      GROUP BY i.sku, i.daily_demand, d.day;

      CREATE TABLE running AS
      SELECT
        sku,
        day,
        qty,
        sum(qty) OVER (PARTITION BY sku ORDER BY day) AS cumulative
      FROM demand;

      CREATE TABLE planned AS
      SELECT
        i.*,
        round(sum(r.qty), 1) AS demand_until_end,
        round(sum(r.qty) FILTER (WHERE r.day < h.as_of + i.lead_time_days), 1) AS demand_before_delivery,
        min(r.day) FILTER (WHERE r.cumulative > i.on_hand) AS runs_out_on,
        h.as_of,
        h.plan_until,
        h.next_festival,
        h.next_festival_start,
        h.next_festival_start - p.buffer_days - i.lead_time_days AS festival_order_by
      FROM items AS i
      JOIN running AS r USING (sku)
      CROSS JOIN horizon AS h
      CROSS JOIN params AS p
      GROUP BY ALL;

      ALTER TABLE planned ADD COLUMN order_by DATE;

      UPDATE planned SET order_by = least(festival_order_by, runs_out_on - lead_time_days);

      CREATE TABLE report AS
      SELECT
        sku,
        item,
        category,
        on_hand,
        round(daily_demand, 2) AS normal_daily_demand,
        demand_until_end,
        runs_out_on,
        lead_time_days,
        CASE WHEN demand_until_end > on_hand THEN order_by END AS order_by,
        CAST(ceil(greatest(demand_until_end - on_hand, 0) / pack_size) * pack_size AS INTEGER) AS order_qty,
        round(ceil(greatest(demand_until_end - on_hand, 0) / pack_size) * pack_size * unit_cost, 2) AS order_value,
        CASE
          WHEN daily_demand = 0 AND on_hand > 0 THEN 'NOT_SELLING'
          WHEN demand_until_end <= on_hand THEN 'ENOUGH'
          WHEN runs_out_on < as_of + lead_time_days THEN 'STOCKOUT_BEFORE_DELIVERY'
          WHEN order_by IS NOT NULL AND order_by <= as_of THEN 'ORDER_NOW'
          ELSE 'ORDER_BY_DATE'
        END AS status,
        concat_ws(' | ',
          CASE WHEN daily_demand = 0 AND on_hand > 0 THEN 'no sales in 28 days: do not reorder, consider a festival offer to clear ' || CAST(on_hand AS INTEGER) || ' units' END,
          CASE WHEN demand_until_end > on_hand AND runs_out_on IS NOT NULL THEN 'runs out on ' || runs_out_on END,
          CASE WHEN runs_out_on < as_of + lead_time_days THEN 'an order placed today arrives in ' || lead_time_days || ' days, after it runs out: find a faster supplier or a local wholesaler' END,
          CASE WHEN demand_until_end > on_hand AND order_by IS NOT NULL AND order_by <= as_of AND NOT runs_out_on < as_of + lead_time_days THEN 'order today to have it before ' || next_festival END,
          CASE WHEN demand_until_end > on_hand AND order_by > as_of THEN 'order by ' || order_by || ' for ' || next_festival END
        ) AS notes
      FROM planned;

      COPY (
        SELECT *
        FROM report
        ORDER BY CASE status WHEN 'STOCKOUT_BEFORE_DELIVERY' THEN 1 WHEN 'ORDER_NOW' THEN 2 WHEN 'ORDER_BY_DATE' THEN 3 WHEN 'NOT_SELLING' THEN 4 ELSE 5 END, order_by, sku
      ) TO '{{ outputFiles["restock_plan.csv"] }}' (HEADER, DELIMITER ',');

      SELECT
        (SELECT as_of FROM params)::VARCHAR AS as_of,
        (SELECT next_festival FROM horizon) AS next_festival,
        coalesce((SELECT next_festival_start FROM horizon)::VARCHAR, '') AS next_festival_start,
        count(*) AS items,
        count(*) FILTER (WHERE status = 'STOCKOUT_BEFORE_DELIVERY') AS stockout_count,
        count(*) FILTER (WHERE status = 'ORDER_NOW') AS order_now_count,
        count(*) FILTER (WHERE status = 'ORDER_BY_DATE') AS order_later_count,
        count(*) FILTER (WHERE order_qty > 0) AS items_to_order,
        coalesce(sum(order_value), 0) AS order_value_total,
        coalesce(string_agg(item || ': ' || order_qty || ' units (' || status || ')', ' | ' ORDER BY order_by, sku) FILTER (WHERE order_qty > 0), '') AS order_list
      FROM report;

  - id: route_plan
    type: io.kestra.plugin.core.flow.If
    description: Branch on the plan. When something must be ordered, log the order list with the budget and optionally send it to Slack; otherwise log that stock is enough.
    condition: "{{ outputs.plan.outputs[0].row.items_to_order > 0 }}"
    then:
      - id: log_orders
        type: io.kestra.plugin.core.log.Log
        level: WARN
        message: |
          Restock plan for {{ outputs.plan.outputs[0].row.next_festival }} (starts {{ outputs.plan.outputs[0].row.next_festival_start }}): {{ outputs.plan.outputs[0].row.items_to_order }} of {{ outputs.plan.outputs[0].row.items }} items to order, Rs {{ outputs.plan.outputs[0].row.order_value_total }} in total.
          Running out before a new order can arrive: {{ outputs.plan.outputs[0].row.stockout_count }}. Order today: {{ outputs.plan.outputs[0].row.order_now_count }}. Order later: {{ outputs.plan.outputs[0].row.order_later_count }}.
          {{ outputs.plan.outputs[0].row.order_list }}
      - id: slack_enabled
        type: io.kestra.plugin.core.flow.If
        condition: "{{ inputs.notify_slack }}"
        then:
          - id: notify_slack
            type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
            url: "{{ secret('SLACK_WEBHOOK_URL') }}"
            messageText: "Restock for {{ outputs.plan.outputs[0].row.next_festival }}: {{ outputs.plan.outputs[0].row.items_to_order }} items, Rs {{ outputs.plan.outputs[0].row.order_value_total }}. {{ outputs.plan.outputs[0].row.order_list }}"
    else:
      - id: log_enough
        type: io.kestra.plugin.core.log.Log
        message: "Stock is enough for {{ outputs.plan.outputs[0].row.next_festival }}: nothing to order across {{ outputs.plan.outputs[0].row.items }} items."

errors:
  - id: log_plan_failure
    type: io.kestra.plugin.core.log.Log
    level: ERROR
    description: Make a failed plan loud, so a run that planned nothing is never mistaken for enough stock.
    message: "Restock plan FAILED in {{ flow.namespace }}.{{ flow.id }} (execution {{ execution.id }}). Nothing was planned. Check the columns of inventory and festivals."

outputs:
  - id: restock_plan
    type: FILE
    description: Per-item CSV with stock on hand, normal daily demand, demand until the end of the plan, the day it runs out, lead time, order-by date, order quantity rounded to the pack size, order value, status (STOCKOUT_BEFORE_DELIVERY, ORDER_NOW, ORDER_BY_DATE, NOT_SELLING or ENOUGH) and notes.
    value: "{{ outputs.plan.outputFiles['restock_plan.csv'] }}"
  - id: plan_summary
    type: JSON
    description: 'Counts, budget and the order list, e.g. {"next_festival": "Diwali week", "items_to_order": 10, "order_value_total": 129730.00, ...}.'
    value: "{{ outputs.plan.outputs[0].row | toJson }}"

extend:
  title: Plan Festival Restocking for a Shop From Recent Sales
  shortDescription: Weekly restock plan for a grocery or retail shop ahead of festivals, with demand uplift per category, items that will run out before delivery, order quantities by pack size and the last day to order.
  metaTitle: Festival Restock Planner for Retail and Kirana Stores with Kestra
  metaDescription: Forecast festival demand per item from 28 days of sales, find stockouts before delivery and get order quantities by pack size with order-by dates.
  description: |
    For a neighbourhood grocery or gift shop, a festival week can bring a month's sales, and the stock for it has to be ordered weeks before. Order too late and the sweets, dry fruits and diyas run out on the busiest day. Order without a plan and the shop is left with stock that does not sell. Most small shops decide by memory, item by item. This blueprint turns the last 28 days of sales and a festival calendar into a restock plan: it forecasts each item's demand day by day with a festival uplift per category, simulates stock until the festival is over, and lists what to order, how much (rounded to the supplier's pack size), by when, and what it will cost. It works for any festival or season: Diwali, Eid, Christmas, Pongal, Onam, back-to-school or a wedding season. Everything runs locally in DuckDB: no paid API and no sales data leaving your Kestra instance.

    ## How it works

    1. `sample_inventory` and `sample_festivals` (`io.kestra.plugin.core.storage.Write`) write twelve items of a grocery store and a festival week starting in 14 days with an uplift per category. They are used only when the matching input is empty.
    2. `plan` (`io.kestra.plugin.jdbc.duckdb.Queries`) takes each item's normal daily demand from the last 28 days, generates every day from today until the last festival day plus `safety_days` with `generate_series`, applies the uplift of the item's category (or the `*` row for every category) on festival days, and accumulates the demand to find the day stock runs out. It then sets the order quantity (rounded up to `pack_size`), the order value, the last day to order (the earlier of the festival start minus lead time minus `order_buffer_days`, and the day stock runs out minus lead time) and a status:
       - `STOCKOUT_BEFORE_DELIVERY`: runs out before an order placed today can arrive.
       - `ORDER_NOW`: the last day to order is today or has passed.
       - `ORDER_BY_DATE`: order later, by the date shown.
       - `NOT_SELLING`: no sales in 28 days, do not reorder.
       - `ENOUGH`.
    3. `route_plan` (`io.kestra.plugin.core.flow.If`) logs the order list with the total budget, and a nested `If` posts it to Slack when `notify_slack` is `true`. When nothing needs ordering, that is logged instead.
    4. The `errors` block logs a failed plan loudly, so a run that planned nothing is never mistaken for enough stock.
    5. The `weekly_plan` `Schedule` trigger (Monday at 08:00 IST, shipped disabled) runs it before the week's supplier orders.
    6. The `on_inventory_export` `Flow` trigger (shipped disabled) is the event-based option: it starts the check as soon as the flow that exports your stock and sales (`export-inventory` in `company.team`) succeeds, and passes its `inventory_file` output in as `inventory`.

    ## What you get

    - `outputs.restock_plan`: CSV with `sku`, `item`, `category`, `on_hand`, `normal_daily_demand`, `demand_until_end`, `runs_out_on`, `lead_time_days`, `order_by`, `order_qty`, `order_value`, `status` and `notes`, most urgent first.
    - `outputs.plan_summary`: JSON with `next_festival`, `next_festival_start`, `items`, `stockout_count`, `order_now_count`, `order_later_count`, `items_to_order`, `order_value_total` and `order_list`.
    - With the sample data: a snack that runs out before any delivery, diyas whose 12-day lead time means ordering today, groundnut oil that runs out before the festival so its order date comes earlier, sweets, dry fruits and ghee to order by set dates in packs, toor dal with enough stock, and a floor cleaner that has not sold in 28 days.

    ## Who it's for

    - Kirana stores, supermarkets, sweet shops, gift and puja stores.
    - Retail chains and distributors planning festival stock per outlet.
    - Developers building tools for small retailers who want a simple, explainable plan instead of a black-box forecast.

    ## Why orchestrate this with Kestra

    A restock plan is only useful if it is redone every week with the latest stock and sales. Kestra runs it on schedule, keeps each week's plan in the execution history so you can see what was ordered and why, branches on the result, and sends the order list to the person who calls the suppliers. The inputs are plain files, so the same flow can read stock and sales from your billing software or POS database and the festival calendar from a shared sheet.

    ## Prerequisites

    - Nothing for the demo: the sample items and festival week are built in.
    - For your own data: an export of items with stock and the last 28 days of sales, and a festival calendar with uplifts for your categories.

    ### Inputs

    - `inventory` (FILE, optional): `sku`, `item`, `category`, `on_hand`, `sold_last_28_days`, `lead_time_days`, `pack_size` and `unit_cost`.
    - `festivals` (FILE, optional): `festival`, `starts_on`, `ends_on`, `category` (or `*` for every category) and `uplift_pct`.
    - `safety_days` (INT, default `3`): days of normal demand to keep after the festival.
    - `order_buffer_days` (INT, default `2`): margin between delivery and the festival.
    - `as_of` (STRING, optional): date to plan from, `YYYY-MM-DD`; defaults to today.
    - `notify_slack` (BOOL, default `false`): post the order list to Slack.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack incoming webhook URL. Only needed when `notify_slack` is `true`.

    ## Quick start

    1. Save the flow and run it with the default inputs.
    2. Open the logs of `log_orders` and download `restock_plan` from the Outputs tab.
    3. Add your festival dates and uplifts, and run it with your own stock export.
    4. Optional: add the `SLACK_WEBHOOK_URL` secret and set `notify_slack` to `true`.
    5. Point the inputs at your real sources and set `disabled: false` on `weekly_plan`.

    ## Common pitfalls

    - The uplift is the most important number. Start from last year's festival sales compared with a normal month for each category, not a guess.
    - The last 28 days already include any early festival buying. Plan a few weeks ahead so the baseline is a normal period.
    - Items that sold out during the last 28 days look slower than they are. Correct `sold_last_28_days` for days the item was out of stock.
    - Lead times stretch before big festivals. Add a few days to `lead_time_days` for busy suppliers.

    ## How to extend

    - Read stock and sales straight from your POS or billing database instead of a file.
    - Group the order list by supplier and send each supplier its own order with a `ForEach`.
    - Compare the plan with what actually sold after the festival to tune the uplift for next year.
    - Add a `Pause` approval so the owner confirms the budget before orders go out.

    ## Links

    - [DuckDB generate_series](https://duckdb.org/docs/sql/functions/list#generate_series)
    - [Kestra DuckDB plugin](https://kestra.io/plugins/plugin-jdbc/duckdb)
    - [Kestra Slack plugin](https://kestra.io/plugins/plugin-slack)

    - This blueprint has been created by [Ankith-m1006](https://github.com/Ankith-m1006)
  tags:
    - Business
    - Data
  subTags:
    - Testing & Quality
  ee: false
  demo: false
