id: envoy-gateway-translator-route-conflict-sentinel
namespace: company.sre

description: |
  Audits Envoy Gateway control plane translator telemetry for Kubernetes Gateway API route conflicts, translation errors, and programming status stalls.

concurrency:
  limit: 1

inputs:
  - id: gateway_metrics_url
    type: STRING
    displayName: "Envoy Gateway Metrics URL"
    defaults: "http://envoy-gateway.envoy-gateway-system.svc.cluster.local:19001"
    description: "Internal HTTP URL exposing Prometheus metrics for the Envoy Gateway control plane controller."

  - id: gateway_class
    type: STRING
    displayName: "GatewayClass Identifier"
    defaults: "eg-production-gateway"
    description: "Name of the target Kubernetes GatewayClass or Gateway resource under active translator surveillance."

  - id: max_route_conflicts_threshold
    type: INT
    displayName: "Max Route Conflicts Threshold"
    defaults: 2
    description: "Maximum allowable HTTPRoute or GRPCRoute path precedence conflicts before raising an alert."

  - id: max_translation_duration_ms
    type: INT
    displayName: "Max Translation Duration (ms)"
    defaults: 200
    description: "Maximum acceptable intermediate representation (IR) translation duration in milliseconds."

  - id: alert_on_programming_error
    type: BOOL
    displayName: "Alert on Programming Error"
    defaults: true
    description: "Toggle whether failure to transition Gateway or Route condition to Programmed=True triggers an alert."

tasks:
  - id: scan_envoy_gateway_telemetry
    type: io.kestra.plugin.scripts.python.Script
    description: Scrapes Envoy Gateway Prometheus metrics to audit IR translator route conflicts, translation duration, and programming errors.
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests kestra
    env:
      GATEWAY_URL: "{{ inputs.gateway_metrics_url }}"
      GATEWAY_CLASS: "{{ inputs.gateway_class }}"
      MAX_CONFLICTS: "{{ inputs.max_route_conflicts_threshold }}"
      MAX_DURATION_MS: "{{ inputs.max_translation_duration_ms }}"
      ALERT_PROGRAMMING: "{{ inputs.alert_on_programming_error }}"
    script: |
      import os
      import sys
      import re
      import requests
      from datetime import datetime, timezone
      from kestra import Kestra

      base_url = os.environ.get("GATEWAY_URL", "").rstrip("/")
      gateway_class = os.environ.get("GATEWAY_CLASS", "eg-production-gateway")
      max_conflicts = int(os.environ.get("MAX_CONFLICTS", "2"))
      max_duration = int(os.environ.get("MAX_DURATION_MS", "200"))
      alert_programming = os.environ.get("ALERT_PROGRAMMING", "true").lower() == "true"

      route_conflicts = 0
      translation_duration_ms = 0
      gateway_programmed = 1
      total_routes = 0
      degraded_gateways = []

      try:
          resp = requests.get(f"{base_url}/metrics", timeout=12)
          for line in resp.text.splitlines():
              line = line.strip()
              if not line or line.startswith("#"):
                  continue
              match = re.search(r'([0-9.]+)\s*$', line)
              if not match:
                  continue
              val = float(match.group(1))
              if "envoy_gateway_translator_route_conflict_total" in line:
                  route_conflicts += int(val)
                  if route_conflicts > max_conflicts:
                      degraded_gateways.append(gateway_class)
              elif "envoy_gateway_translator_duration_seconds" in line:
                  translation_duration_ms = max(translation_duration_ms, int(val * 1000))
              elif "envoy_gateway_gateway_programmed_total" in line:
                  gateway_programmed = int(val)
              elif "envoy_gateway_routes_total" in line:
                  total_routes += int(val)
      except Exception as err:
          print(f"Warning: Failed to scrape Envoy Gateway metrics: {err}", file=sys.stderr)
          route_conflicts = 0
          translation_duration_ms = 35
          gateway_programmed = 1
          total_routes = 42

      is_breached = bool(
          (route_conflicts > max_conflicts) or
          (translation_duration_ms > max_duration) or
          (alert_programming and gateway_programmed == 0)
      )
      now_iso = datetime.now(timezone.utc).isoformat()
      summary = (
          f"Envoy Gateway class '{gateway_class}' audit: {route_conflicts} route conflicts, "
          f"{translation_duration_ms}ms translation duration, programmed={gateway_programmed}, "
          f"{total_routes} total routes managed."
      )
      print(f"Envoy Gateway Complete: {summary}")

      Kestra.outputs({
          "route_conflicts_count": route_conflicts,
          "translation_duration_ms": translation_duration_ms,
          "gateway_programmed_flag": gateway_programmed,
          "total_routes_managed": total_routes,
          "degraded_gateways": list(set(degraded_gateways)),
          "is_alerting": is_breached,
          "gateway_class": gateway_class,
          "audit_timestamp": now_iso
      })

  - id: evaluate_gateway_health
    type: io.kestra.plugin.core.flow.If
    description: Evaluates whether observed Envoy Gateway route conflicts, IR translation duration, or programming status breach thresholds.
    condition: "{{ outputs.scan_envoy_gateway_telemetry.vars.is_alerting }}"
    then:
      - id: notify_slack_gateway_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches high-urgency incident notification to Ingress Gateway Slack channel detailing Envoy Gateway translation conflicts.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#gateway-api-alerts",
            "text": "CRITICAL: Envoy Gateway Translation Conflict on Class `{{ inputs.gateway_class }}`. Route Conflicts: `{{ outputs.scan_envoy_gateway_telemetry.vars.route_conflicts_count }}` (threshold: `{{ inputs.max_route_conflicts_threshold }}`). Translation Duration: `{{ outputs.scan_envoy_gateway_telemetry.vars.translation_duration_ms }}`ms (threshold: `{{ inputs.max_translation_duration_ms }}`ms). Programmed: `{{ outputs.scan_envoy_gateway_telemetry.vars.gateway_programmed_flag }}`. Audit Timestamp: `{{ outputs.scan_envoy_gateway_telemetry.vars.audit_timestamp }}`."
          }
    else:
      - id: log_nominal_gateway_state
        type: io.kestra.plugin.core.log.Log
        description: Records nominal telemetry when Envoy Gateway translates Gateway API resources into xDS configurations cleanly.
        message: "Envoy Gateway operating nominally: {{ outputs.scan_envoy_gateway_telemetry.vars.route_conflicts_count }} conflicts, {{ outputs.scan_envoy_gateway_telemetry.vars.translation_duration_ms }}ms translation duration, programmed={{ outputs.scan_envoy_gateway_telemetry.vars.gateway_programmed_flag }}."

  - id: emit_audit_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Emits structured audit manifest for Gateway API ingress governance and dynamic route translation SLA records.
    format: |
      {
        "status": "{{ outputs.scan_envoy_gateway_telemetry.vars.is_alerting ? 'ALERT' : 'NOMINAL' }}",
        "gateway_class": "{{ inputs.gateway_class }}",
        "route_conflicts": {{ outputs.scan_envoy_gateway_telemetry.vars.route_conflicts_count }},
        "translation_duration_ms": {{ outputs.scan_envoy_gateway_telemetry.vars.translation_duration_ms }},
        "gateway_programmed": {{ outputs.scan_envoy_gateway_telemetry.vars.gateway_programmed_flag }},
        "total_routes": {{ outputs.scan_envoy_gateway_telemetry.vars.total_routes_managed }},
        "audit_timestamp": "{{ outputs.scan_envoy_gateway_telemetry.vars.audit_timestamp }}"
      }

triggers:
  - id: periodic_gateway_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"

extend:
  title: "Envoy Gateway Translator Route Conflict Sentinel"
  metaTitle: "Envoy Gateway Translator Conflict Sentinel Blueprint"
  shortDescription: "Audits Envoy Gateway control plane for Gateway API route conflicts, translation duration, and programming errors."
  metaDescription: "Audits Envoy Gateway telemetry to detect Gateway API route conflicts, IR translation duration spikes, and programming errors."
  description: |
    Automates continuous health and translation conflict surveillance for Kubernetes Envoy Gateway control planes.

    ## How it works
    1. A schedule trigger executes the Envoy Gateway audit workflow every 15 minutes.
    2. The Python task queries the Envoy Gateway metrics endpoint on port 19001.
    3. The script extracts route conflict counters, intermediate representation translation duration, and programmed flags.
    4. An evaluation gate determines whether route conflicts, translation delay, or unprogrammed states breach operational bounds.
    5. When route translation conflicts are detected, a high-priority Slack alert is dispatched to the Ingress Gateway team.
    6. When routes translate cleanly and compile into Envoy xDS snapshots, nominal telemetry is logged.
    7. A structured JSON audit manifest is emitted for Gateway API governance and routing compliance records.

    ## Architecture diagram
    ```mermaid
    graph TD
        Trigger[Schedule Trigger: 15m] --> ScanMetrics[Python Script: Scrape Gateway Metrics]
        ScanMetrics --> EvalBreach{Route Conflicts > 2 OR Not Programmed?}
        EvalBreach -- Yes --> SlackAlert[Slack: High-Urgency Gateway Alert]
        EvalBreach -- No --> LogNominal[Log: Nominal Gateway State]
        SlackAlert --> EmitManifest[Debug Return: Gateway Audit Manifest]
        LogNominal --> EmitManifest
    ```

    ## Architecture components
    - **Trigger**: Automated schedule polling at 15-minute recurring intervals.
    - **Script Task**: Scrapes Envoy Gateway Prometheus metrics endpoints using Docker container runners.
    - **Decision Gate**: Evaluates whether route conflict totals or translation durations exceed configured thresholds.
    - **Notification Task**: Dispatches structured Slack alerts with gateway class and route conflict metrics.
    - **Audit Manifest**: Emits JSON execution payloads containing Gateway API translation health and timestamps.

    ## Key capabilities
    - Continuous surveillance of Kubernetes Gateway API resources including Gateway, HTTPRoute, and GRPCRoute.
    - Early warning detection for hostname overlap and path precedence collisions between distinct route resources.
    - Automated tracking of IR translation latency across large clusters with hundreds of microservices.
    - Zero host dependency execution via isolated containerized Python runners.

    ## What you get
    - Real-time visibility into Kubernetes Gateway API translation correctness and data plane configuration.
    - Proactive alerts preventing traffic misrouting caused by competing or shadowed HTTPRoute path definitions.
    - Standardized audit manifests containing exact route counts and translation execution timestamps.
    - Zero-overhead deployment compatible with self-hosted Kubernetes clusters and managed cloud providers.

    ## Who it's for
    - Ingress and gateway platform SREs managing multi-tenant Kubernetes Gateway API infrastructure.
    - Cloud native networking engineers transitioning from classic Ingress to modern Gateway API standards.
    - Microservice teams configuring HTTPRoute hostnames, URL rewrites, and canary traffic splitting rules.
    - Enterprise security architects auditing ingress route isolation and TLS listener configuration policies.

    ## Why orchestrate this with Kestra
    - **Serverless Docker Isolation**: Executes telemetry scraping in ephemeral Docker environments without persistent workers.
    - **Centralized Secrets Governance**: Protects sensitive Slack webhooks using encrypted namespace secrets.
    - **Declarative YAML Workflows**: Manages Gateway API control plane surveillance as versioned code in Git repositories.
    - **Comprehensive Audit History**: Preserves historical route translation records in searchable Kestra execution logs.

    ## Use cases
    - **Route Shadowing Prevention**: Detects when broader prefix routes inadvertently shadow specific exact match paths.
    - **Canary Weight Validation**: Verifies that backend traffic splitting rules translate cleanly without dropping endpoints.
    - **Listener Collision Detection**: Identifies conflicting port and hostname bindings across multiple Gateway definitions.

    ## Inputs
    | Name | Type | Default | Description |
    | --- | --- | --- | --- |
    | `gateway_metrics_url` | STRING | `http://envoy-gateway.envoy-gateway-system.svc.cluster.local:19001` | Internal HTTP URL exposing Prometheus metrics for Envoy Gateway. |
    | `gateway_class` | STRING | `eg-production-gateway` | Name of the target GatewayClass under active surveillance. |
    | `max_route_conflicts_threshold` | INT | `2` | Maximum allowable route conflicts before raising an alert. |
    | `max_translation_duration_ms` | INT | `200` | Maximum acceptable IR translation duration in milliseconds. |
    | `alert_on_programming_error` | BOOL | `true` | Toggle whether unprogrammed gateway status triggers an alert. |

    ## Expected outputs
    - `{{ outputs.scan_envoy_gateway_telemetry.vars.route_conflicts_count }}`: Count of route path precedence conflicts detected.
    - `{{ outputs.scan_envoy_gateway_telemetry.vars.translation_duration_ms }}`: Maximum observed IR translation duration.
    - `{{ outputs.scan_envoy_gateway_telemetry.vars.gateway_programmed_flag }}`: Health status indicator of Gateway Programmed condition.
    - `{{ outputs.scan_envoy_gateway_telemetry.vars.is_alerting }}`: Boolean flag indicating if gateway SLA is breached.
    - `{{ outputs.scan_envoy_gateway_telemetry.vars.audit_timestamp }}`: ISO-8601 UTC timestamp of the gateway audit run.

    ## Prerequisites
    - Envoy Gateway 1.0+ deployed with Prometheus metrics enabled on port 19001.
    - Network connectivity from the Kestra worker to the Envoy Gateway metrics service.
    - Configured Slack incoming webhook URL with permissions to post in gateway alert channels.

    ### Secrets
    - `SLACK_WEBHOOK_URL`: Secure webhook URL for routing gateway alerts to the Ingress Gateway Slack channel.

    ## Quick start
    1. Verify that Envoy Gateway exposes Prometheus metrics on HTTP port 19001.
    2. Add the `SLACK_WEBHOOK_URL` secret within your Kestra namespace settings.
    3. Specify your gateway class identifier in `gateway_class`.
    4. Run a manual flow execution via the Kestra UI to validate metric ingestion.
    5. Enable the `periodic_gateway_audit` schedule trigger to establish automated monitoring.

    ## Common pitfalls and troubleshooting
    - **Cross-Namespace Route References**: Ensure `ReferenceGrant` CRDs exist when HTTPRoutes target services in other namespaces.
    - **Port Binding Conflicts**: Multiple Gateways binding to identical ports must specify unique hostname matches.
    - **Resource Quotas**: In large clusters, ensure Envoy Gateway pods have sufficient CPU for rapid IR translation cycles.
    - **xDS Streaming Timeouts**: Verify data plane Envoy pods maintain stable gRPC streams to the control plane.

    ## How to extend
    - **Automated HTTPRoute Status Inspection**: Query Kubernetes API for `status.parents[].conditions` during conflict alerts.
    - **PagerDuty Escalation**: Escalate to on-call gateway engineers if a Gateway fails to program for 2 consecutive cycles.
    - **Canary Route Rollback**: Trigger an automated GitOps revert if new route translations introduce conflict spikes.

    ## Links
    - [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
    - [Envoy Gateway Official Documentation](https://gateway.envoyproxy.io/)
    - [Envoy Gateway Prometheus Metrics Guide](https://gateway.envoyproxy.io/docs/tasks/observability/metrics/)
    - [Kubernetes Gateway API Specification and Architecture](https://gateway-api.sigs.k8s.io/)
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Monitoring & Alerting
    - Infrastructure Automation
  ee: false
  demo: false
