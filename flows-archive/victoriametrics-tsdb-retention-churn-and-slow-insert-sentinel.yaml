    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
    - [VictoriaMetrics Official Documentation and Architecture Guide](https://docs.victoriametrics.com/)
    - [VictoriaMetrics Operational Metrics and Troubleshooting Manual](https://docs.victoriametrics.com/troubleshooting/)
    - [VictoriaMetrics TSDB Storage Engine and Part Merging Architecture](https://docs.victoriametrics.com/single-server-victoriametrics/)
