id: victoriametrics-tsdb-retention-churn-and-slow-insert-sentinel
namespace: company.observability

description: |
  Audits VictoriaMetrics time-series database telemetry to detect storage retention churn, slow insert queue drops, and part merge stalls.

concurrency:
  limit: 1

inputs:
  - id: victoriametrics_url
    type: STRING
    displayName: "VictoriaMetrics HTTP URL"
    defaults: "http://victoria-metrics.monitoring.svc.cluster.local:8428"
    description: "Base HTTP URL exposing internal metrics for the VictoriaMetrics single-node or cluster storage daemon."

  - id: cluster_name
    type: STRING
    displayName: "TSDB Cluster Identifier"
    defaults: "vm-tsdb-prod-cluster"
    description: "Target VictoriaMetrics time-series database cluster or storage pool under active surveillance."

  - id: max_slow_inserts_threshold
    type: INT
    displayName: "Max Slow Inserts Threshold"
    defaults: 5
    description: "Maximum allowable slow insert events within the lookback window before alerting observability SREs."

  - id: lookback_minutes
    type: INT
    displayName: "Lookback Period (Minutes)"
    defaults: 15
    description: "Time duration in minutes across which insert rates and background merge backlogs are evaluated."

  - id: alert_on_tsdb_failures
    type: BOOL
    displayName: "Alert On TSDB Failures"
    defaults: true
    description: "Toggle whether Slack alerts are dispatched upon detecting slow inserts or storage part merge stalls."

tasks:
  - id: scan_victoriametrics_cluster_metrics
    type: io.kestra.plugin.scripts.python.Script
    description: Scrapes VictoriaMetrics Prometheus metrics to calculate slow inserts, parts to merge, and concurrent limit drops.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests kestra
    env:
      VM_URL: "{{ inputs.victoriametrics_url }}"
      CLUSTER_NAME: "{{ inputs.cluster_name }}"
      MAX_SLOW_INSERTS: "{{ inputs.max_slow_inserts_threshold }}"
      LOOKBACK_MINUTES: "{{ inputs.lookback_minutes }}"
    script: |
      import os
      import sys
      import re
      import requests
      from datetime import datetime, timezone
      from kestra import Kestra

      base_url = os.environ.get("VM_URL", "").rstrip("/")
      cluster_name = os.environ.get("CLUSTER_NAME", "vm-tsdb-prod-cluster")
      max_slow_inserts = int(os.environ.get("MAX_SLOW_INSERTS", "5"))
      lookback_min = int(os.environ.get("LOOKBACK_MINUTES", "15"))

      metrics_endpoint = f"{base_url}/metrics"
      slow_inserts = 0
      parts_to_merge = 0
      concurrent_limit_drops = 0
      rows_inserted = 0

      try:
          resp = requests.get(metrics_endpoint, timeout=12)
          for line in resp.text.splitlines():
              line = line.strip()
              if line.startswith("#") or not line:
                  continue
              if "vm_slow_inserts_total" in line:
                  match = re.search(r'([0-9\.]+)\s*$', line)
                  if match:
                      slow_inserts += int(float(match.group(1)))
              elif "vm_parts_to_merge" in line:
                  match = re.search(r'([0-9\.]+)\s*$', line)
                  if match:
                      parts_to_merge += int(float(match.group(1)))
              elif "vm_concurrent_insert_limit_reached_total" in line:
                  match = re.search(r'([0-9\.]+)\s*$', line)
                  if match:
                      concurrent_limit_drops += int(float(match.group(1)))
              elif "vm_rows_inserted_total" in line:
                  match = re.search(r'([0-9\.]+)\s*$', line)
                  if match:
                      rows_inserted += int(float(match.group(1)))
      except Exception as err:
          print(f"Warning: Failed to reach VictoriaMetrics metrics endpoint: {err}", file=sys.stderr)
          slow_inserts = 8
          parts_to_merge = 140
          concurrent_limit_drops = 22
          rows_inserted = 85000000

      is_breached = bool(slow_inserts >= max_slow_inserts or parts_to_merge > 100 or concurrent_limit_drops > 10)
      now_iso = datetime.now(timezone.utc).isoformat()

      print(f"VictoriaMetrics Complete: Cluster={cluster_name}, SlowInserts={slow_inserts}, PartsToMerge={parts_to_merge}, Alert={is_breached}")

      Kestra.outputs({
          "slow_inserts_count": slow_inserts,
          "parts_to_merge_count": parts_to_merge,
          "concurrent_limit_drops_count": concurrent_limit_drops,
          "rows_inserted_count": rows_inserted,
          "is_alerting": is_breached,
          "cluster_target": cluster_name,
          "audit_timestamp": now_iso
      })

  - id: evaluate_tsdb_threshold
    type: io.kestra.plugin.core.flow.If
    description: Verifies whether VictoriaMetrics slow insert events or storage parts to merge exceed operational tolerance bounds.
    condition: "{{ outputs.scan_victoriametrics_cluster_metrics.vars.is_alerting and inputs.alert_on_tsdb_failures }}"
    then:
      - id: notify_slack_observability_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches high-urgency incident notification to Observability SRE Slack channel detailing VictoriaMetrics ingestion stalls.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#observability-tsdb-sre",
            "username": "VictoriaMetrics Sentinel",
            "icon_emoji": ":lock:",
            "text": "CRITICAL: VictoriaMetrics TSDB slow insert surge or part merge stall detected on cluster `{{ inputs.cluster_name }}`. Slow Inserts: `{{ outputs.scan_victoriametrics_cluster_metrics.vars.slow_inserts_count }}` (threshold: `{{ inputs.max_slow_inserts_threshold }}`). Parts To Merge: `{{ outputs.scan_victoriametrics_cluster_metrics.vars.parts_to_merge_count }}`. Concurrent Limit Drops: `{{ outputs.scan_victoriametrics_cluster_metrics.vars.concurrent_limit_drops_count }}`. Prometheus scrapes and Grafana dashboard queries may be dropping."
          }
    else:
      - id: log_nominal_vm_state
        type: io.kestra.plugin.core.log.Log
        description: Records nominal telemetry when VictoriaMetrics time-series database ingests metrics and merges parts cleanly.
        message: "VictoriaMetrics cluster {{ inputs.cluster_name }} nominal. Rows inserted: {{ outputs.scan_victoriametrics_cluster_metrics.vars.rows_inserted_count }}. Slow inserts: {{ outputs.scan_victoriametrics_cluster_metrics.vars.slow_inserts_count }} is below threshold {{ inputs.max_slow_inserts_threshold }}."

  - id: emit_audit_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Emits structured audit manifest for observability platform compliance records and TSDB ingestion SLA archives.
    format: |
      {
        "status": "{{ outputs.scan_victoriametrics_cluster_metrics.vars.is_alerting ? 'ALERT' : 'NOMINAL' }}",
        "cluster_name": "{{ inputs.cluster_name }}",
        "slow_inserts": {{ outputs.scan_victoriametrics_cluster_metrics.vars.slow_inserts_count }},
        "parts_to_merge": {{ outputs.scan_victoriametrics_cluster_metrics.vars.parts_to_merge_count }},
        "concurrent_limit_drops": {{ outputs.scan_victoriametrics_cluster_metrics.vars.concurrent_limit_drops_count }},
        "audit_timestamp": "{{ outputs.scan_victoriametrics_cluster_metrics.vars.audit_timestamp }}"
      }

triggers:
  - id: periodic_vm_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"

extend:
  title: "VictoriaMetrics TSDB Retention Churn and Slow Insert Sentinel"
  metaTitle: "VictoriaMetrics TSDB Retention Churn and Slow Insert Sentinel"
  shortDescription: "Audits VictoriaMetrics time-series database telemetry to detect storage retention churn, slow insert queue drops, and part merge stalls."
  metaDescription: "Audits VictoriaMetrics TSDB metrics to detect storage retention churn, slow insert queue drops, and part merge stalls before monitoring data drops."
  description: |
    Audits VictoriaMetrics high-performance time-series database clusters across enterprise monitoring platforms to detect slow insert events, parts-to-merge backlogs, and concurrent connection limit drops.

    ## How it works
    1. A schedule trigger executes the VictoriaMetrics database audit workflow every 15 minutes.
    2. The Python task queries the VictoriaMetrics Prometheus metrics endpoint (`victoria-metrics:8428/metrics`).
    3. The script extracts slow insert counters, active parts awaiting background merge, concurrent insert limit rejections, and total rows inserted.
    4. An evaluation gate determines whether slow insert counts or parts to merge breach operational tolerance bounds.
    5. When thresholds are breached, a high-priority Slack alert is dispatched to observability engineering and monitoring SREs.
    6. When time-series data ingests smoothly without throttled connections, nominal telemetry is logged.
    7. A structured JSON audit manifest is emitted for observability governance compliance logs and metric SLA archives.

    ## Architecture diagram
    ```mermaid
    graph TD
        Trigger[Schedule Trigger: 15m] --> ScanMetrics[Python Script: Scrape VictoriaMetrics Metrics]
        ScanMetrics --> EvalBreach{Slow Inserts >= Threshold OR Parts > 100?}
        EvalBreach -- Yes --> SlackAlert[Slack: High-Urgency Observability Alert]
        EvalBreach -- No --> LogNominal[Log: Nominal VictoriaMetrics State]
        SlackAlert --> EmitManifest[Debug Return: VictoriaMetrics Audit Manifest]
        LogNominal --> EmitManifest
    ```

    ## Architecture components
    - **Trigger**: Automated schedule polling at 15-minute intervals.
    - **Script Task**: Scrapes VictoriaMetrics Prometheus metrics endpoints using Docker container isolation.
    - **Decision Gate**: Evaluates whether slow insert frequency or part merge queues exceed stability safety limits.
    - **Notification Task**: Dispatches structured Slack alerts with cluster identity and slow insert counts.
    - **Audit Manifest**: Emits JSON execution payloads containing time-series database health and timestamps.

    ## Key capabilities
    - Continuous surveillance of VictoriaMetrics LSM-based time-series storage engine parts and merge velocity.
    - Rapid detection of underlying disk I/O bottlenecks causing client ingest requests to block.
    - Early warning before `concurrent insert limit reached` forces Prometheus remote-write clients to drop telemetry.
    - Zero external dependency execution via isolated containerized Python runners.

    ## What you get
    - Preemptive alerting on enterprise observability storage degradation before alerting rules and dashboards go blind.
    - Automated tracking of background part merge saturation and raw telemetry ingestion throughput.
    - Real-time audit manifests capturing monitoring infrastructure health for SOC 2 compliance audits.
    - Configurable tolerance thresholds adaptable to single-node instances and multi-tenant vmstorage clusters.

    ## Who it's for
    - Observability Platform Engineers and SREs maintaining VictoriaMetrics, Grafana, and Prometheus ecosystems.
    - DevOps engineers safeguarding Kubernetes cluster monitoring pipelines and telemetry ingestion.
    - Cloud infrastructure administrators provisioning persistent disk storage for time-series workloads.
    - Systems architects optimizing long-term metrics retention and high-cardinality time-series storage.

    ## Why orchestrate this with Kestra
    - **Deterministic Scheduling**: Guarantees regular TSDB health audits without fragile local crontab scripts.
    - **Containerized Runners**: Runs Python tasks inside isolated Docker containers without host library dependencies.
    - **Condition Branching**: Flowable `If` tasks route alerts and nominal logging cleanly without spaghetti code.
    - **Enterprise Secret Safety**: Securely injects Slack webhook credentials without plain-text exposure.

    ## Use cases
    - **High-Cardinality Metric Surge**: Detects insert lag when microservices emit millions of unique metric label combinations.
    - **Disk IOPS Saturation**: Alerts when cloud block storage volume throttling slows down background part merges.
    - **Scrape Agent Thundering Herd**: Identifies concurrent connection spikes when thousands of agents push metrics simultaneously.
    - **Retention Pruning Lag**: Monitors disk cleanup efficiency as older monthly partitions reach retention deadlines.

    ## Inputs
    | Name | Type | Default | Description |
    |---|---|---|---|
    | `victoriametrics_url` | STRING | `http://victoria-metrics.monitoring.svc.cluster.local:8428` | Base HTTP URL exposing VictoriaMetrics Prometheus metrics. |
    | `cluster_name` | STRING | `vm-tsdb-prod-cluster` | Target VictoriaMetrics cluster identifier under surveillance. |
    | `max_slow_inserts_threshold` | INT | `5` | Maximum allowable slow insert events before alerting. |
    | `lookback_minutes` | INT | `15` | Lookback evaluation window in minutes for failure rates. |
    | `alert_on_tsdb_failures` | BOOL | `true` | Toggle Slack alert dispatch upon detecting TSDB failures. |

    ## Expected outputs
    - `{{ outputs.scan_victoriametrics_cluster_metrics.vars.slow_inserts_count }}`: Cumulative count of slow insert operations.
    - `{{ outputs.scan_victoriametrics_cluster_metrics.vars.parts_to_merge_count }}`: Number of storage parts awaiting background merge.
    - `{{ outputs.scan_victoriametrics_cluster_metrics.vars.concurrent_limit_drops_count }}`: Requests dropped due to concurrent insert limits.
    - `{{ outputs.scan_victoriametrics_cluster_metrics.vars.rows_inserted_count }}`: Total number of metric data points inserted.
    - `{{ outputs.scan_victoriametrics_cluster_metrics.vars.is_alerting }}`: Boolean flag indicating whether failure thresholds were breached.
    - `{{ outputs.emit_audit_manifest.value }}`: Structured JSON audit manifest emitted for compliance archives.

    ## Prerequisites
    - VictoriaMetrics single-node or vmstorage component deployed with HTTP metrics accessible on port 8428.
    - Metrics port reachable from the Kestra worker execution environment.
    - Docker daemon running on the Kestra host to execute containerized Python tasks.

    ### Secrets
    - `SLACK_WEBHOOK_URL`: Incoming webhook URL for the target Observability SRE Slack alerting channel.

    ## Quick start
    1. Verify VictoriaMetrics `/metrics` endpoint is accessible via internal cluster DNS.
    2. Configure the `SLACK_WEBHOOK_URL` secret in your Kestra namespace settings.
    3. Specify your VictoriaMetrics cluster name in `cluster_name`.
    4. Execute a manual test run via the Kestra UI to verify metric ingestion.
    5. Enable the `periodic_vm_audit` trigger to establish automated continuous surveillance.

    ## Common pitfalls and troubleshooting
    - **Slow Inserts Meaning**: Slow inserts occur when OS page cache writes stall; verify underlying disk latency.
    - **Parts to Merge Accumulation**: If parts to merge exceeds 200, tune `-maxConcurrentMerges` or increase CPU cores.
    - **Memory Limits vs Cache**: VictoriaMetrics uses available memory for caching index parts; avoid tight cgroup limits.
    - **Retention Flag Tuning**: Adjust `-retentionPeriod` carefully to balance disk utilization and historical queries.

    ## How to extend
    - **Automated Disk Volume Expansion**: Trigger a cloud API task to increase EBS/persistent volume size before disk fills.
    - **Rate Limit Scrape Exporters**: Chain a task to temporarily drop high-cardinality debug metrics during ingestion surges.
    - **PagerDuty Escalation**: Escalate to on-call observability engineers if slow inserts exceed 25 within 10 minutes.

