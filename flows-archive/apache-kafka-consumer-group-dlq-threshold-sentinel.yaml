id: apache-kafka-consumer-group-dlq-threshold-sentinel
namespace: company.streaming

inputs:
  - id: kafka_bootstrap
    type: STRING
    defaults: "kafka:9092"
    description: Kafka bootstrap broker address.
  - id: consumer_group
    type: STRING
    description: Target Kafka consumer group ID to audit.
  - id: max_acceptable_lag
    type: INT
    defaults: 1000
    description: Maximum acceptable consumer group lag before triggering alerting.

tasks:
  - id: audit_consumer_lag
    type: io.kestra.plugin.scripts.shell.Commands
    containerImage: confluentinc/cp-kafka:latest
    commands:
      - |
        kafka-consumer-groups --bootstrap-server {{ inputs.kafka_bootstrap }}           --describe --group "{{ inputs.consumer_group }}" 2>/dev/null > /tmp/group_lag.txt
        
        TOTAL_LAG=$(awk 'NR>1 {sum += $6} END {print sum+0}' /tmp/group_lag.txt)
        LAG_SUMMARY=$(awk 'NR>1 && $6 > 0 {print $1 "/" $2 ":" $6}' /tmp/group_lag.txt | head -n 10 | paste -sd ", " -)
        
        echo "::set-output name=total_lag::$TOTAL_LAG::"
        echo "::set-output name=lag_summary::$LAG_SUMMARY::"

  - id: evaluate_consumer_lag
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.audit_consumer_lag.vars.total_lag | int > inputs.max_acceptable_lag }}"
    then:
      - id: notify_streaming_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#streaming-incidents",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 Apache Kafka Consumer Group Lag Spike Alert",
                "text": "Consumer group `{{ inputs.consumer_group }}` has accumulated *{{ outputs.audit_consumer_lag.vars.total_lag }}* unconsumed messages (threshold: {{ inputs.max_acceptable_lag }}). Topic partition lag: {{ outputs.audit_consumer_lag.vars.lag_summary }}. Impact: Real-time event stream processing is stalled or falling significantly behind producers, degrading end-to-end data freshness.",
                "footer": "Kestra Streaming Sentinel • Kafka Consumer Lag"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#streaming-incidents",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ Kafka Consumer Lag Sentinel Execution Failed",
            "text": "The Kafka consumer group audit workflow failed. Please verify Kafka bootstrap server address and group ID.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  metaDescription: "Audits Apache Kafka consumer group lag to detect stalled streaming microservices and message backlog accumulation."
  metaTitle: Apache Kafka Consumer Group Lag Accumulation and Processing Sentinel with Kestra
  title: Apache Kafka Consumer Group Lag Accumulation and Processing Sentinel
  shortDescription: Audits Apache Kafka consumer group lag to detect stalled streaming microservices and message backlog accumulation.
  description: |
    ## How it works
    This workflow connects to the target Apache Kafka cluster using official `kafka-consumer-groups` CLI inside a containerized runner. It evaluates consumer partition offsets against log-end offsets for designated consumer groups. When downstream consumer microservices crash, encounter poisoned messages, or suffer processing bottlenecks, lag accumulates rapidly. When lag breaches the threshold, an immediate incident notification is routed to Slack.

    ## What you get
    - Real-time detection of stalled or bottlenecked streaming microservices.
    - Prevents data processing SLA breaches in event-driven architectures.
    - Actionable diagnostics detailing specific topics, partitions, and accumulated lag values.

    ## Who it's for
    - Event Streaming Engineers and Kafka Administrators operating real-time data pipelines.
    - Backend developers operating Kafka consumer workers and microservice fleets.

    ## Why orchestrate this with Kestra
    - **Reliable Automation**: Schedule continuous consumer group audits without maintaining external monitoring daemons.
    - **Containerized CLI**: Runs official Kafka binaries inside secure containers without local dependencies.
    - **Instant Routing**: Dispatches high-severity incident notifications to Slack or PagerDuty.

    ## Prerequisites
    - Network reachability to Kafka bootstrap brokers.
    - Secret `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import this blueprint into Kestra.
    2. Configure Kafka bootstrap address, target consumer group, and Slack webhook secret.
    3. Run the workflow to inspect consumer group lag.

    ## How to extend
    - Iterate across multiple critical consumer groups dynamically using a loop task.
    - Automatically scale consumer worker pods in Kubernetes when lag surges.

    ## Links
    - [Apache Kafka Consumer Group Management](https://kafka.apache.org/documentation/#basic_ops_consumer_lag)
    - [Kestra Shell Plugin](https://kestra.io/plugins/plugin-scripts/commands/io.kestra.plugin.scripts.shell.commands)
  tags:
    - Data
    - Infrastructure
  subTags:
    - Realtime & Streaming
    - ELT & Data Landing
  ee: false
  demo: false
