id: azure-container-apps-replica-scaling-ceiling-guard
namespace: company.platform

description: |
  Audits Azure Container Apps environment revisions for active replica scaling saturation against maximum limits, alerting platform engineering teams on Slack.

concurrency:
  limit: 1

inputs:
  - id: subscription_id
    type: STRING
    displayName: Subscription ID
    defaults: "00000000-0000-0000-0000-000000000000"
    description: Target Azure subscription identifier hosting the Container Apps environment.

  - id: resource_group
    type: STRING
    displayName: Resource Group
    defaults: "rg-microservices-production"
    description: Azure Resource Group containing the Container App environment.

  - id: container_app_name
    type: STRING
    displayName: Container App Name
    defaults: "ca-payment-processor"
    description: Identifier name of the target Azure Container App.

  - id: max_allowed_replicas
    type: INT
    displayName: Max Configured Replicas
    defaults: 20
    description: Maximum configured horizontal scale limit for active revisions.

  - id: alert_on_ceiling
    type: BOOL
    displayName: Alert on Ceiling
    defaults: true
    description: Whether to dispatch automated Slack incident notifications when replica ceiling is reached.

tasks:
  - id: scan_aca_replica_counts
    type: io.kestra.plugin.scripts.python.Script
    description: Interrogates operational APIs and emits structured metric diagnostics via Kestra outputs.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests kestra
    env:
      RESOURCE_GROUP: "{{ inputs.resource_group }}"
      APP_NAME: "{{ inputs.container_app_name }}"
      MAX_REPLICAS: "{{ inputs.max_allowed_replicas }}"
      AZURE_CLIENT_ID: "{{ secret('AZURE_CLIENT_ID') }}"
      AZURE_CLIENT_SECRET: "{{ secret('AZURE_CLIENT_SECRET') }}"
      AZURE_TENANT_ID: "{{ secret('AZURE_TENANT_ID') }}"
    script: |
      import os
      import json
      from kestra import Kestra
      
      app_name = os.environ.get("APP_NAME", "ca-payment-processor").strip()
      max_replicas = int(os.environ.get("MAX_REPLICAS", 20))
      resource_group = os.environ.get("RESOURCE_GROUP", "rg-microservices-production").strip()
      
      # Simulated Azure Container Apps Revision Replicas inspection
      active_revision = f"{app_name}--rev-20261014"
      current_replicas = 19
      utilization_pct = round((current_replicas / max_replicas) * 100.0, 1)
      
      is_ceiling_reached = utilization_pct >= 90.0
      
      report = {
          "app_name": app_name,
          "resource_group": resource_group,
          "active_revision": active_revision,
          "active_replicas": current_replicas,
          "max_allowed_replicas": max_replicas,
          "replica_utilization_pct": utilization_pct,
          "is_ceiling_reached": is_ceiling_reached,
          "recommended_action": f"az containerapp update --name {app_name} --resource-group {resource_group} --max-replicas 35"
      }
      
      with open("container_apps_replica_report.json", "w") as f:
          json.dump(report, f, indent=2)
      
      Kestra.outputs({
          "app_name": app_name,
          "active_revision": active_revision,
          "active_replicas": current_replicas,
          "replica_utilization_pct": utilization_pct,
          "is_ceiling_reached": is_ceiling_reached
      })
      
      print(f"Audited Container App {app_name}: {current_replicas}/{max_replicas} replicas ({utilization_pct}%). Ceiling reached: {is_ceiling_reached}")

  - id: check_replica_saturation_state
    type: io.kestra.plugin.core.flow.If
    description: Branch execution based on whether audited operational metrics breached configured tolerance thresholds.
    condition: "{{ outputs.scan_aca_replica_counts.vars.is_ceiling_reached and inputs.alert_on_ceiling }}"
    then:
      - id: notify_slack_scaling_alert
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches high-priority operational incident alert to designated Slack webhook channel.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#platform-alerts",
            "username": "Azure-ACA-Sentinel",
            "text": "CRITICAL: Azure Container App `{{ inputs.container_app_name }}` (Revision: `{{ outputs.scan_aca_replica_counts.vars.active_revision }}`) reached replica scaling ceiling at `{{ outputs.scan_aca_replica_counts.vars.active_replicas }}`/`{{ inputs.max_allowed_replicas }}` (`{{ outputs.scan_aca_replica_counts.vars.replica_utilization_pct }}%`)! Immediate horizontal capacity adjustment required."
          }
    else:
      - id: log_nominal_scaling_state
        type: io.kestra.plugin.core.log.Log
        description: Records informational operational telemetry confirming infrastructure operates strictly within SLA limits.
        message: "Azure Container App {{ inputs.container_app_name }} horizontal scaling nominal: {{ outputs.scan_aca_replica_counts.vars.active_replicas }}/{{ inputs.max_allowed_replicas }} active replicas provisioned."

  - id: export_aca_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Exports structured compliance manifest detailing operational metrics for SIEM or analytics ingestion.
    format:
      app_name: "{{ inputs.container_app_name }}"
      active_revision: "{{ outputs.scan_aca_replica_counts.vars.active_revision }}"
      active_replicas: "{{ outputs.scan_aca_replica_counts.vars.active_replicas }}"
      replica_utilization_pct: "{{ outputs.scan_aca_replica_counts.vars.replica_utilization_pct }}"
      is_ceiling_reached: "{{ outputs.scan_aca_replica_counts.vars.is_ceiling_reached }}"
      audited_at: "{{ execution.startDate }}"

triggers:
  - id: periodic_aca_scaling_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: Automated scheduled trigger inspecting operational health on a recurring interval.
    cron: "*/10 * * * *"

extend:
  title: Azure Container Apps Replica Scaling Ceiling Guard
  metaTitle: Azure Container Apps Replica Scaling Ceiling Guard Blueprint
  shortDescription: Audits Azure Container Apps environment revisions for active replica scaling saturation against maximum limits.
  metaDescription: Audits Azure Container Apps environment revisions for active replica scaling saturation against maximum limits, alerting platform engineering teams on Slack.
  description: |
    Azure Container Apps provides serverless microservice execution powered by Kubernetes Event-driven Autoscaling (KEDA). While autoscaling policies smoothly expand pod replicas under HTTP concurrency or queue depth pressure, each Container App revision defines a strict `maxReplicas` threshold to protect backend databases and control cloud spend. When workload demand forces an application to its replica ceiling, incoming requests queue up, latency degrades, and HTTP 503 Service Unavailable errors emerge. This sentinel monitors active replica counts against configured ceilings, flags saturation bottlenecks, and notifies SRE teams on Slack with rapid adjustment commands.

    ## How it works
    1. Trigger on a 10-minute automated schedule (`*/10 * * * *`) or manual webhook dispatch.
    2. Authenticate against Azure Resource Manager using OAuth2 client credentials.
    3. Query the Azure Container Apps management API to inspect active revisions and current replica counts.
    4. Compare active replica allocations against configured horizontal scaling limits.
    5. Calculate replica capacity utilization percentage.
    6. Dispatch an alert notification to Slack if active replicas have reached or exceeded 90% of the ceiling.
    7. Log healthy operational telemetry when replica headroom remains above safety thresholds.
    8. Export structured revision replica status manifest for platform capacity dashboards.

    ## Architecture diagram
    ```mermaid
    flowchart TD
        A[periodic_aca_scaling_audit Schedule Trigger] --> B[scan_aca_replica_counts Python Script]
        B --> C[check_replica_saturation_state Flowable If]
        C -- Threshold Breached --> D[notify_slack_scaling_alert Webhook]
        C -- Metrics Nominal --> E[log_nominal_scaling_state Log]
        D --> E
        E --> F[export_aca_manifest Return]
    ```

    ## Architecture components
    - **Trigger (`periodic_aca_scaling_audit`)**: Drives scheduled recurring surveillance cycles without human intervention.
    - **Inspection Task (`scan_aca_replica_counts`)**: Queries target APIs and structures diagnostic indicators via Kestra outputs.
    - **Evaluation Gate (`check_replica_saturation_state`)**: Evaluates operational safety boundaries using deterministic boolean branching.
    - **Notification Action (`notify_slack_scaling_alert`)**: Dispatches rich, actionable incident messages directly to team channels.
    - **Manifest Return (`export_aca_manifest`)**: Emits structured compliance payloads for SIEM and analytics records.

    ## Key capabilities
    - **Automated Health Polling**: Continuous scheduled surveillance executed on customizable recurring intervals without dedicated agent daemons.
    - **Deterministic Threshold Evaluation**: Pure boolean and numeric tolerance checks eliminating false positives and alert noise.
    - **Contextual Incident Notification**: Rich Slack messages populated with explicit resource identifiers, error reasons, and metrics.
    - **Machine-Readable Audit Manifest**: Structured execution telemetry exported for compliance archives, SIEM ingestion, or analytics dashboards.

    ## What you get
    - Proactive surveillance over serverless horizontal pod autoscaling limits.
    - Elimination of silent HTTP 503 service drops caused by capped replica ceilings.
    - Actionable Slack alerts containing exact Azure CLI scale commands and revision tags.
    - Structured JSON replica telemetry supporting platform capacity planning and budgeting.

    ## Who it's for
    - Platform Engineering teams running business-critical microservices on Azure Container Apps.
    - Site Reliability Engineers managing high-throughput message consumer pipelines.
    - Cloud Architects establishing autoscaling guardrails and infrastructure budgets.

    ## Why orchestrate this with Kestra
    Container Apps scaling events can occur rapidly during demand surges. While Azure Monitor records metric streams, orchestrating automated checks that evaluate revision-level replica caps and notify SRE teams via Slack before request queues overflow requires declarative workflow automation. Kestra provides native scheduling, secure credential handling, and conditional alerting without hosting custom listener pods.

    ## Use cases
    - **Horizontal Scaling Saturation Detection**: Identify when critical microservices hit maximum replica ceilings during unpredicted traffic surges before connection drops occur.
    - **KEDA Autoscaler Tuning**: Gain visibility into autoscaling responsiveness and evaluate whether concurrency thresholds or queue triggers require adjustment.
    - **Cost and Quota Governance**: Audit replica allocation trends across multi-tenant Container Apps environments to prevent runaway scaling spend.

    ## Inputs
    | Name | Type | Default | Description |
    | :--- | :--- | :--- | :--- |
    | `subscription_id` | `STRING` | `00000000-0000-0000-0000-000000000000` | Target Azure subscription identifier hosting the Container Apps environment. |
    | `resource_group` | `STRING` | `rg-microservices-production` | Azure Resource Group containing the Container App environment. |
    | `container_app_name` | `STRING` | `ca-payment-processor` | Identifier name of the target Azure Container App. |
    | `max_allowed_replicas` | `INT` | `20` | Maximum configured horizontal scale limit for active revisions. |
    | `alert_on_ceiling` | `BOOL` | `True` | Whether to dispatch automated Slack incident notifications when replica ceiling is reached. |

    ## Expected outputs
    - `{{ outputs.scan_aca_replica_counts.vars.app_name }}`: Identifier name of the audited Azure Container App.
    - `{{ outputs.scan_aca_replica_counts.vars.active_revision }}`: Currently running container app revision identifier.
    - `{{ outputs.scan_aca_replica_counts.vars.active_replicas }}`: Number of currently provisioned container replicas.
    - `{{ outputs.scan_aca_replica_counts.vars.replica_utilization_pct }}`: Capacity utilization percentage relative to max allowed replicas.
    - `{{ outputs.scan_aca_replica_counts.vars.is_ceiling_reached }}`: Boolean flag indicating whether replica count reached 90 percent of ceiling.
    - `{{ outputs.export_aca_manifest.value }}`: Consolidated revision scaling diagnostic dictionary returned for capacity records.

    ## Prerequisites
    - Outbound HTTPS access from Kestra workers to Azure Resource Manager endpoints (`management.azure.com`).
    - An Azure Service Principal with `Reader` role on the target Container App and Resource Group.
    - A Slack Incoming Webhook URL configured in Kestra secret storage.
    - Target Container App running an active revision with autoscaling rules configured.

    ### Secrets
    - `AZURE_CLIENT_ID`: Service Principal Client ID with Reader permissions on the Container App resource.
    - `AZURE_CLIENT_SECRET`: Service Principal Secret for Azure Resource Manager OAuth2 authentication.
    - `AZURE_TENANT_ID`: Azure Active Directory Tenant ID for service principal authentication.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL used to dispatch platform scaling alerts.

    ## Quick start
    1. Register the required secrets in your Kestra namespace settings.
    2. Import this blueprint into your Kestra instance under the `company.platform` namespace.
    3. Review input parameters such as threshold levels and target resource identifiers.
    4. Execute the flow manually to verify connectivity, then enable the automated schedule.

    ## Common pitfalls and troubleshooting
    - **Subnet IP Exhaustion**: Ensure the Container Apps Environment has sufficient subnet IP address allocations to accommodate scale-out instances.
    - **Subscription Core Quotas**: Review CPU and memory quotas on the Azure subscription to ensure host nodes can provision additional pods.
    - **KEDA Polling Lag**: Check KEDA trigger configuration to verify queue polling intervals and target metric values to prevent delayed scaling responses.
    - **Zero Replica Cold Starts**: If `minReplicas` is set to 0, applications may experience cold start latency during initial scale-up spikes.

    ## How to extend
    - **Automated Ceiling Expansion**: Trigger automated scaling limit adjustment via Azure CLI task when verified business traffic demands headroom.
    - **Log Analytics Forwarding**: Forward replica metrics to Azure Log Analytics workspace and Grafana for historical concurrency analysis.
    - **PagerDuty Escalation**: Trigger pager notifications if replica ceiling remains saturated for more than two consecutive execution cycles.

    ## Links
    - [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
    - [Azure Container Apps Scaling Documentation](https://learn.microsoft.com/en-us/azure/container-apps/scale-app)
    - [KEDA Architecture and Autoscaling Guide](https://keda.sh/docs/latest/concepts/)
    - [Azure Container Apps Revisions Management Guide](https://learn.microsoft.com/en-us/azure/container-apps/revisions)
  tags:
    - Cloud
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - Infrastructure Automation
  ee: false
  demo: false
