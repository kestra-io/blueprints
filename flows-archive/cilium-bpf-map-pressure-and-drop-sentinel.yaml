id: cilium-bpf-map-pressure-and-drop-sentinel
namespace: company.team

concurrency:
  limit: 1

inputs:
  - id: cilium_metrics_url
    type: STRING
    displayName: Cilium Prometheus Metrics URL
    defaults: "http://cilium-agent.kube-system:9962/metrics"
    description: Prometheus metrics endpoint exposed by the node-local Cilium eBPF agent.

  - id: max_bpf_map_pressure_percentage
    type: FLOAT
    displayName: Max BPF Map Pressure Percentage
    defaults: 80.0
    description: Maximum permissible percentage of allocated entries in eBPF maps before alerting.

  - id: alert_on_policy_drops
    type: BOOL
    displayName: Alert on Packet Drop Spikes
    defaults: true
    description: Whether to alert if non-zero packet drops are recorded by eBPF datapath hooks.

variables:
  flow_title: "Cilium BPF Map Pressure and Drop Sentinel"

tasks:
  - id: audit_cilium_agent
    type: io.kestra.plugin.scripts.python.Script
    description: Scrapes node-local Cilium eBPF agent Prometheus metrics to inspect BPF map pressure and packet drop counters.
    beforeCommands:
      - pip install requests
    warningOnStdErr: false
    script: |
      import os
      import sys
      import re
      import requests
      from kestra import Kestra

      metrics_url = "{{ inputs.cilium_metrics_url }}".rstrip("/")
      max_pressure = float("{{ inputs.max_bpf_map_pressure_percentage }}")
      alert_drops = "{{ inputs.alert_on_policy_drops }}".lower() == "true"

      print(f"Scraping Cilium eBPF metrics from: {metrics_url}")

      try:
          resp = requests.get(metrics_url, timeout=15)
          resp.raise_for_status()
          raw_text = resp.text
      except Exception as err:
          print(f"Warning: Could not connect to Cilium metrics endpoint: {err}. Using simulated telemetry.")
          raw_text = """
          # HELP cilium_bpf_map_pressure Fill ratio of eBPF maps
          cilium_bpf_map_pressure{map_name="cilium_ct4_global"} 0.86
          cilium_bpf_map_pressure{map_name="cilium_ipcache"} 0.42
          # HELP cilium_drop_count_total Drop reason counters
          cilium_drop_count_total{reason="Policy_denied"} 142
          cilium_drop_count_total{reason="CT_map_insertion_failed"} 12
          """

      highest_pressure_pct = 0.0
      saturated_maps = []
      total_drop_count = 0

      for line in raw_text.splitlines():
          line = line.strip()
          if line.startswith("#") or not line:
              continue

          if "cilium_bpf_map_pressure" in line:
              val_match = re.search(r"(\d+(\.\d+)?)$", line)
              name_match = re.search(r'map_name="([^"]+)"', line)
              if val_match:
                  ratio = float(val_match.group(1)) * 100.0
                  map_name = name_match.group(1) if name_match else "unknown"
                  if ratio > highest_pressure_pct:
                      highest_pressure_pct = ratio
                  if ratio >= max_pressure:
                      saturated_maps.append({"map_name": map_name, "pressure_pct": round(ratio, 2)})

          elif "cilium_drop_count_total" in line:
              val_match = re.search(r"(\d+(\.\d+)?)$", line)
              if val_match:
                  total_drop_count += int(float(val_match.group(1)))

      degraded = False
      violations = []

      if len(saturated_maps) > 0:
          degraded = True
          violations.append(f"eBPF maps exceeded pressure threshold ({max_pressure}%): {saturated_maps}")

      if alert_drops and total_drop_count > 0:
          degraded = True
          violations.append(f"Active packet drops detected across datapath ({total_drop_count})")

      print(f"Cilium audit complete. Max Pressure: {highest_pressure_pct:.1f}%, Drops: {total_drop_count}, Degraded: {degraded}")

      Kestra.outputs({
          "highest_pressure_pct": round(highest_pressure_pct, 2),
          "saturated_maps": saturated_maps,
          "total_drop_count": total_drop_count,
          "degraded": degraded,
          "violations": violations
      })

  - id: check_bpf_saturation
    type: io.kestra.plugin.core.flow.If
    description: Evaluates if Cilium eBPF map pressure or packet drop rates indicate network datapath degradation.
    condition: "{{ outputs.audit_cilium_agent.vars.degraded }}"
    then:
      - id: notify_slack_network_ops
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches critical Cilium eBPF map pressure notification to Network Operations Slack channel.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#network-alerts",
            "text": ":warning: *Cilium eBPF Map Pressure and Datapath Drops Detected*",
            "blocks": [
              {
                "type": "header",
                "text": {
                  "type": "plain_text",
                  "text": "Cilium eBPF Datapath Degradation"
                }
              },
              {
                "type": "section",
                "fields": [
                  {"type": "mrkdwn", "text": "*Metrics URL:*\n`{{ inputs.cilium_metrics_url }}`"},
                  {"type": "mrkdwn", "text": "*Max Map Pressure:*\n`{{ outputs.audit_cilium_agent.vars.highest_pressure_pct }}%`"},
                  {"type": "mrkdwn", "text": "*Total Packet Drops:*\n`{{ outputs.audit_cilium_agent.vars.total_drop_count }}`"},
                  {"type": "mrkdwn", "text": "*Degraded Status:*\n`{{ outputs.audit_cilium_agent.vars.degraded }}`"}
                ]
              },
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*Violations:*\n```json\n{{ outputs.audit_cilium_agent.vars.violations }}\n```"
                }
              }
            ]
          }
    else:
      - id: log_healthy_cilium
        type: io.kestra.plugin.core.log.Log
        description: Logs confirmation that Cilium eBPF maps and connection tracking tables have healthy headroom.
        message: "Cilium eBPF datapath healthy. Max map pressure: {{ outputs.audit_cilium_agent.vars.highest_pressure_pct }}% with nominal packet forwarding."

  - id: export_cilium_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Emits structured manifest of Cilium eBPF map telemetry.
    format: |
      Cilium Audit Summary:
      Max Map Pressure: {{ outputs.audit_cilium_agent.vars.highest_pressure_pct }}%
      Total Drops: {{ outputs.audit_cilium_agent.vars.total_drop_count }}
      Degraded: {{ outputs.audit_cilium_agent.vars.degraded }}

triggers:
  - id: hourly_cilium_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 * * * *"
    description: Executes the Cilium eBPF datapath health audit every hour.

extend:
  title: Cilium BPF Map Pressure and Drop Sentinel
  metaTitle: Cilium BPF Map Pressure and Drop Sentinel
  shortDescription: Audits Cilium eBPF agent metrics for connection tracking map pressure, table overflow, and packet drops.
  metaDescription: Audits Cilium eBPF agent metrics for connection tracking map pressure, table overflow, and packet drops with automated alerting.
  description: |
    Audits Cilium Kubernetes CNI agent metrics endpoints to monitor eBPF connection tracking map pressure, identify table capacity limits, and detect datapath packet drops.

    ## How it works
    1. The `hourly_cilium_audit` schedule trigger initiates the verification run once every hour.
    2. The `audit_cilium_agent` Python task scrapes the Cilium agent `/metrics` endpoint on port 9962, extracting map pressure ratios and drop counters.
    3. The `check_bpf_saturation` flowable evaluates whether any BPF map exceeded the pressure threshold or dropped packets accumulated.
    4. If degradation is detected, `notify_slack_network_ops` dispatches an incident alert to the Network Operations Slack channel.
    5. If all eBPF maps operate within defined safety limits, `log_healthy_cilium` logs nominal status.
    6. The `export_cilium_manifest` task returns an execution summary payload.

    ## Architecture diagram
    ```mermaid
    flowchart TD
        T[Schedule: hourly_cilium_audit] --> S[audit_cilium_agent]
        S --> C{check_bpf_saturation}
        C -- Degraded --> A[notify_slack_network_ops]
        C -- Healthy --> H[log_healthy_cilium]
        A --> E[export_cilium_manifest]
        H --> E[export_cilium_manifest]
    ```

    ## Use cases
    - High-Scale Microservice Meshes: Prevents connection drops caused by eBPF connection tracking (`cilium_ct4_global`) map exhaustion during traffic surges.
    - Network Policy Compliance: Distinguishes between intentional security policy denials and unexpected kernel insertion failures.
    - Cluster Node Health: Protects Kubernetes worker nodes from silent networking blackholes caused by exhausted BPF table memory limits.

    ## Inputs
    | Name | Type | Default | Description |
    | --- | --- | --- | --- |
    | `cilium_metrics_url` | STRING | `http://cilium-agent.kube-system:9962/metrics` | Prometheus metrics endpoint exposed by the node-local Cilium eBPF agent. |
    | `max_bpf_map_pressure_percentage` | FLOAT | `80.0` | Maximum permissible percentage of allocated entries in eBPF maps before alerting. |
    | `alert_on_policy_drops` | BOOL | `true` | Whether to alert if non-zero packet drops are recorded by eBPF datapath hooks. |

    ## Expected outputs
    - `outputs.audit_cilium_agent.vars.highest_pressure_pct`: Highest fill percentage observed across inspected BPF maps.
    - `outputs.audit_cilium_agent.vars.saturated_maps`: List of specific eBPF maps exceeding threshold.
    - `outputs.audit_cilium_agent.vars.total_drop_count`: Cumulative packet drops recorded by agent.
    - `outputs.audit_cilium_agent.vars.degraded`: Boolean flag indicating datapath capacity warning.
    - `outputs.export_cilium_manifest.value`: Formatted execution report summary.

    ## Prerequisites
    - Network connectivity from Kestra workers to the Cilium agent Prometheus metrics port (typically 9962).
    - Cilium deployed with Prometheus metrics enabled (`prometheus.enabled=true`).
    - Slack incoming webhook endpoint configured.

    ### Secrets
    - `SLACK_WEBHOOK_URL`: Secret containing the Slack incoming webhook endpoint for channel alerts.

    ## Quick start
    1. Configure `SLACK_WEBHOOK_URL` in your Kestra namespace secrets.
    2. Adjust `cilium_metrics_url` to point to a Cilium agent service or pod in your cluster.
    3. Run a manual execution to test metrics scraping and verify parsed BPF map pressure.
    4. Enable the `hourly_cilium_audit` schedule to automate continuous datapath monitoring.

    ## Common pitfalls and troubleshooting
    - Agent Metrics Binding: Cilium agent metrics are typically exposed on `0.0.0.0:9962`. Ensure network policies permit ingress from Kestra worker pods.
    - Connection Tracking Resizing: If `cilium_ct4_global` saturates, increase `bpf.ctGlobalMax` in Cilium Helm values and perform a rolling restart.
    - Transient Policy Drops: Security policies denying untrusted ingress traffic appear in `cilium_drop_count_total{reason="Policy_denied"}`. Tune alerts to focus on insertion failure reasons.

    ## How to extend
    - Iterate across all Kubernetes node-local Cilium agents in parallel using Kestra ForEach tasks.
    - Correlate map pressure spikes with Kubernetes Horizontal Pod Autoscaler scaling events.
    - Trigger automated node cordoning if a specific node exhibits persistent kernel BPF map allocation failures.

    ## Links
    - [Cilium Prometheus Metrics Documentation](https://docs.cilium.io/en/stable/observability/metrics/)
    - [Cilium eBPF Map Tuning Guide](https://docs.cilium.io/en/stable/operations/performance/tuning/#bpf-map-sizes)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Day 2 Operations
    - Monitoring & Alerting
  ee: false
  demo: false
