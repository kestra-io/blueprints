id: hashicorp-vault-dynamic-db-credentials-sentinel
namespace: company.security

inputs:
  - id: vault_addr
    type: STRING
    defaults: http://vault.internal:8200
    description: Base URL of the HashiCorp Vault server.
  - id: lease_prefix
    type: STRING
    defaults: database/creds/readonly-analytics
    description: Secret lease prefix to inspect for expiring dynamic credentials.
  - id: warning_threshold_minutes
    type: INT
    defaults: 30
    description: Minimum remaining lease validity in minutes before alerting.

tasks:
  - id: query_dynamic_db_leases
    type: io.kestra.plugin.scripts.shell.Commands
    runner: PROCESS
    commands:
      - |
        curl -s --header "X-Vault-Token: {{ secret('VAULT_TOKEN') }}"           --request LIST           "{{ inputs.vault_addr }}/v1/sys/leases/lookup/{{ inputs.lease_prefix }}" > leases.json
        python3 -c "
        import json, subprocess
        with open('leases.json') as f:
            data = json.load(f).get('data', {}).get('keys', [])
        expiring = []
        for l_id in data[:10]:
            full_id = f'{{ inputs.lease_prefix }}/{l_id}'
            cmd = f'curl -s --header "X-Vault-Token: {{ secret("VAULT_TOKEN") }}" --request PUT --data "{{\"lease_id\": \"{full_id}\"}}" "{{ inputs.vault_addr }}/v1/sys/leases/lookup"'
            res = subprocess.run(cmd, shell=True, capture_output=True, text=True)
            if res.returncode == 0:
                l_info = json.loads(res.stdout).get('data', {})
                ttl = l_info.get('ttl', 0)
                if ttl > 0 and ttl <= ({{ inputs.warning_threshold_minutes }} * 60):
                    expiring.append({'lease_id': full_id, 'ttl_minutes': round(ttl / 60.0, 1)})
        result = {
            'prefix': '{{ inputs.lease_prefix }}',
            'expiring_count': len(expiring),
            'expiring_leases': expiring,
            'alert_triggered': len(expiring) > 0
        }
        with open('leases_summary.json', 'w') as out:
            json.dump(result, out)
        print('Vault dynamic DB leases audit:', result)
        "
    outputFiles:
      - leases_summary.json

  - id: evaluate_expiring_leases
    type: io.kestra.plugin.core.flow.If
    condition: "{{ fromJson(read(outputs.query_dynamic_db_leases.outputFiles['leases_summary.json'])).alert_triggered }}"
    then:
      - id: alert_security_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "text": ":warning: *Vault Dynamic Credential Expiration Alert*: Found {{ fromJson(read(outputs.query_dynamic_db_leases.outputFiles['leases_summary.json'])).expiring_count }} dynamic database leases under `{{ inputs.lease_prefix }}` expiring in less than {{ inputs.warning_threshold_minutes }} minutes. Ensure consumer services renew leases to prevent database connection dropouts."
          }

errors:
  - id: notify_sentinel_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "text": ":warning: *Vault Sentinel Failure*: Failed to lookup dynamic database leases on {{ inputs.vault_addr }}."
      }

triggers:
  - id: scheduled_lease_check
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  metaDescription: "Audits HashiCorp Vault dynamic database credential leases to detect impending expirations before application connection drops occur."
  metaTitle: HashiCorp Vault Dynamic Database Credentials Lease Expiration Sentinel with Kestra
  title: HashiCorp Vault Dynamic Database Credentials Lease Expiration Sentinel
  shortDescription: Audits HashiCorp Vault dynamic database credential leases to detect impending expirations before application connection drops occur.
  description: |
    ## How it works
    This sentinel queries the HashiCorp Vault `/v1/sys/leases/lookup` administrative endpoint for active dynamic database credential leases. It evaluates remaining time-to-live (`ttl`) and alerts operations teams when consumer services fail to renew leases, preventing sudden authentication failures against backend PostgreSQL or MySQL databases.

    ## What you get
    - Continuous validation of dynamic secret renewal lifecycles.
    - Early warning before expired dynamic credentials break long-running worker connections.
    - Automated Slack delivery tracking lease IDs and remaining TTL in minutes.

    ## Who it's for
    - Security operations (SecOps) teams and platform engineers administering HashiCorp Vault.
    - Backend application developers consuming dynamic database secrets.

    ## Why orchestrate this with Kestra
    Kestra automates distributed system observability, executing scheduled health checks with fine-grained error management and notification delivery.

    ## Prerequisites
    - HashiCorp Vault server access with database secrets engine mounted.
    - A Vault token with `sudo` or `read` permissions on `sys/leases/lookup`.
    - Secrets `VAULT_TOKEN` and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import this blueprint into Kestra.
    2. Configure `vault_addr`, `lease_prefix`, and credentials.
    3. Run manually to check current dynamic database leases.

    ## How to extend
    - Automatically renew renewable leases via `PUT /sys/leases/renew`.
    - Track lease count growth to identify client applications that abandon leases without revoking them.
    - Forward lease lifecycle events to Datadog or Prometheus.

    ## Links
    - [HashiCorp Vault Leases API](https://developer.hashicorp.com/vault/api-docs/system/leases)
    - [Kestra Slack Notifications](https://kestra.io/plugins/plugin-slack)
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Policy & Compliance
    - Monitoring & Alerting
  ee: false
  demo: false
