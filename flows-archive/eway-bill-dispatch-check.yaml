id: eway-bill-dispatch-check
namespace: company.team
description: |
  Check every consignment in a dispatch register against the e-way bill rules
  before the vehicle is stopped on the road: missing or malformed e-way bill
  numbers, bills generated after the goods left, the same bill used twice,
  deliveries after the bill expired, bills about to expire in transit, and
  missing vehicle numbers.

inputs:
  - id: dispatch_file
    type: FILE
    required: false
    description: CSV with the columns invoice_no, consignee, invoice_value, distance_km, vehicle_no, ewb_no, ewb_generated_at, dispatched_at and delivered_at (empty while the goods are in transit). Times as YYYY-MM-DD HH:MM. Leave empty to run against the built-in sample register.
  - id: threshold_inr
    type: INT
    defaults: 50000
    description: Consignment value (invoice value including tax) above which an e-way bill is required. 50000 is the general limit. Some states use a different limit for movement within the state.
  - id: timezone
    type: STRING
    defaults: Asia/Kolkata
    description: Time zone of the times in the file, used to decide which bills are about to expire.
  - id: notify_slack
    type: BOOL
    defaults: false
    description: Post the findings to Slack when at least one consignment has an error. Requires the SLACK_WEBHOOK_URL secret.

triggers:
  - id: twice_daily_dispatch_check
    type: io.kestra.plugin.core.trigger.Schedule
    description: Check the dispatch register at 09:00 and 17:00 IST, so in-transit bills can still be extended and the morning and evening dispatches are covered. Shipped disabled. Enable it once the flow reads your real dispatch export instead of the sample.
    cron: "0 9,17 * * *"
    timezone: Asia/Kolkata
    disabled: true

tasks:
  - id: sample_dispatch_register
    type: io.kestra.plugin.core.storage.Write
    description: A small dispatch register with one example of every problem the check catches. Times are computed relative to now so the in-transit cases always give the same result. The e-way bill numbers are made up. Only used when no dispatch_file is provided.
    extension: .csv
    content: |
      {% set tz = inputs.timezone -%}
      invoice_no,consignee,invoice_value,distance_km,vehicle_no,ewb_no,ewb_generated_at,dispatched_at,delivered_at
      INV-2401,Shree Balaji Traders Nagpur,120000,150,MH31AB4521,331002345671,{{ now() | dateAdd(-50, 'HOURS') | date('yyyy-MM-dd HH:mm', timeZone=tz) }},{{ now() | dateAdd(-49, 'HOURS') | date('yyyy-MM-dd HH:mm', timeZone=tz) }},{{ now() | dateAdd(-40, 'HOURS') | date('yyyy-MM-dd HH:mm', timeZone=tz) }}
      INV-2402,Kaveri Hardware Mysuru,82500,90,MH12CD7788,,,{{ now() | dateAdd(-30, 'HOURS') | date('yyyy-MM-dd HH:mm', timeZone=tz) }},{{ now() | dateAdd(-27, 'HOURS') | date('yyyy-MM-dd HH:mm', timeZone=tz) }}
      INV-2403,Laxmi Stores Pune,38000,40,MH12EF1023,,,{{ now() | dateAdd(-20, 'HOURS') | date('yyyy-MM-dd HH:mm', timeZone=tz) }},{{ now() | dateAdd(-18, 'HOURS') | date('yyyy-MM-dd HH:mm', timeZone=tz) }}
      INV-2404,Deccan Electricals Bengaluru,245000,300,KA01GH5521,18123456789,{{ now() | dateAdd(-26, 'HOURS') | date('yyyy-MM-dd HH:mm', timeZone=tz) }},{{ now() | dateAdd(-25, 'HOURS') | date('yyyy-MM-dd HH:mm', timeZone=tz) }},{{ now() | dateAdd(-10, 'HOURS') | date('yyyy-MM-dd HH:mm', timeZone=tz) }}
      INV-2405,Konkan Agro Ratnagiri,64000,120,MH14JK3310,331002345675,{{ now() | dateAdd(-12, 'HOURS') | date('yyyy-MM-dd HH:mm', timeZone=tz) }},{{ now() | dateAdd(-14, 'HOURS') | date('yyyy-MM-dd HH:mm', timeZone=tz) }},{{ now() | dateAdd(-9, 'HOURS') | date('yyyy-MM-dd HH:mm', timeZone=tz) }}
      INV-2406,Ganga Distributors Indore,310000,640,MH40LM9087,331002345676,{{ now() | dateAdd(-170, 'HOURS') | date('yyyy-MM-dd HH:mm', timeZone=tz) }},{{ now() | dateAdd(-169, 'HOURS') | date('yyyy-MM-dd HH:mm', timeZone=tz) }},{{ now() | dateAdd(-20, 'HOURS') | date('yyyy-MM-dd HH:mm', timeZone=tz) }}
      INV-2407,Sahyadri Pharma Hubballi,175000,380,MH09NP2234,331002345677,{{ now() | dateAdd(-2, 'DAYS') | date('yyyy-MM-dd', timeZone=tz) }} 10:00,{{ now() | dateAdd(-2, 'DAYS') | date('yyyy-MM-dd', timeZone=tz) }} 11:00,
      INV-2408,Nilgiri Foods Kolhapur,90000,60,,331002345678,{{ now() | dateAdd(-6, 'HOURS') | date('yyyy-MM-dd HH:mm', timeZone=tz) }},{{ now() | dateAdd(-5, 'HOURS') | date('yyyy-MM-dd HH:mm', timeZone=tz) }},{{ now() | dateAdd(-3, 'HOURS') | date('yyyy-MM-dd HH:mm', timeZone=tz) }}
      INV-2409,Vidarbha Cotton Wardha,56000,30,MH31AB4521,331002345671,{{ now() | dateAdd(-8, 'HOURS') | date('yyyy-MM-dd HH:mm', timeZone=tz) }},{{ now() | dateAdd(-7, 'HOURS') | date('yyyy-MM-dd HH:mm', timeZone=tz) }},{{ now() | dateAdd(-6, 'HOURS') | date('yyyy-MM-dd HH:mm', timeZone=tz) }}
      INV-2410,Godavari Tiles Nashik,55000,210,MH15QR6612,331002345680,{{ now() | dateAdd(-1, 'DAYS') | date('yyyy-MM-dd', timeZone=tz) }} 18:00,{{ now() | dateAdd(-1, 'DAYS') | date('yyyy-MM-dd', timeZone=tz) }} 19:00,
      INV-2411,Tapi Plastics Surat,NA,410,GJ05ST7781,331002345681,{{ now() | dateAdd(-9, 'HOURS') | date('yyyy-MM-dd HH:mm', timeZone=tz) }},{{ now() | dateAdd(-8, 'HOURS') | date('yyyy-MM-dd HH:mm', timeZone=tz) }},{{ now() | dateAdd(-1, 'HOURS') | date('yyyy-MM-dd HH:mm', timeZone=tz) }}
      INV-2412,Krishna Paper Mart Satara,"1,05,000",95,MH11UV4410,331002345682,{{ now() | dateAdd(-4, 'HOURS') | date('yyyy-MM-dd HH:mm', timeZone=tz) }},{{ now() | dateAdd(-3, 'HOURS') | date('yyyy-MM-dd HH:mm', timeZone=tz) }},{{ now() | dateAdd(-1, 'HOURS') | date('yyyy-MM-dd HH:mm', timeZone=tz) }}

  - id: check_eway_bills
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: Parse each consignment, work out the e-way bill validity from the distance (one day for every 200 km or part of it, ending at midnight of the following day), and run every check in DuckDB. The per-consignment report is exported to CSV and the last query returns the summary.
    inputFiles:
      dispatch.csv: "{{ inputs.dispatch_file ?? outputs.sample_dispatch_register.uri }}"
    outputFiles:
      - eway_bill_report.csv
    fetchType: FETCH_ONE
    sql: |
      CREATE TABLE dispatch AS
      SELECT
        trim(invoice_no) AS invoice_no,
        trim(consignee) AS consignee,
        trim(coalesce(invoice_value, '')) AS invoice_value_raw,
        try_cast(replace(trim(invoice_value), ',', '') AS DECIMAL(14, 2)) AS invoice_value,
        try_cast(trim(distance_km) AS INTEGER) AS distance_km,
        upper(regexp_replace(coalesce(vehicle_no, ''), '[\s-]', '', 'g')) AS vehicle_no,
        trim(coalesce(ewb_no, '')) AS ewb_raw,
        regexp_replace(coalesce(ewb_no, ''), '\s', '', 'g') AS ewb_no,
        try_cast(trim(ewb_generated_at) AS TIMESTAMP) AS ewb_generated_at,
        try_cast(trim(dispatched_at) AS TIMESTAMP) AS dispatched_at,
        trim(coalesce(delivered_at, '')) AS delivered_raw,
        try_cast(trim(delivered_at) AS TIMESTAMP) AS delivered_at
      FROM read_csv('{{ workingDir }}/dispatch.csv', header = true, all_varchar = true);

      CREATE TABLE enriched AS
      SELECT
        *,
        TIMESTAMP '{{ now() | date("yyyy-MM-dd HH:mm:ss", timeZone=inputs.timezone) }}' AS checked_at,
        invoice_value > {{ inputs.threshold_inr }} AS ewb_required,
        greatest(1, ceil(distance_km / 200.0))::INTEGER AS validity_days,
        (ewb_generated_at::DATE + greatest(1, ceil(distance_km / 200.0))::INTEGER + 1)::TIMESTAMP AS valid_until,
        count(*) OVER (PARTITION BY ewb_no) AS ewb_uses,
        string_agg(invoice_no, ', ') OVER (PARTITION BY ewb_no) AS ewb_invoices
      FROM dispatch;

      CREATE TABLE report AS
      SELECT
        invoice_no,
        consignee,
        invoice_value,
        distance_km,
        vehicle_no,
        ewb_no,
        ewb_generated_at,
        valid_until - INTERVAL 1 MINUTE AS valid_until,
        dispatched_at,
        delivered_at,
        CASE
          WHEN len(errors) > 0 THEN 'ERROR'
          WHEN len(warnings) > 0 THEN 'WARNING'
          ELSE 'OK'
        END AS status,
        array_to_string(list_concat(errors, warnings, notes), ', ') AS issues
      FROM (
        SELECT
          *,
          list_filter([
            CASE WHEN invoice_value IS NULL THEN 'invoice_value "' || invoice_value_raw || '" is not a number' END,
            CASE WHEN dispatched_at IS NULL THEN 'dispatched_at is missing or not a date' END,
            CASE WHEN delivered_raw <> '' AND delivered_at IS NULL THEN 'delivered_at "' || delivered_raw || '" is not a date' END,
            CASE WHEN ewb_required AND ewb_no = '' THEN 'No e-way bill for a consignment of Rs ' || invoice_value || ' (above Rs {{ inputs.threshold_inr }})' END,
            CASE WHEN ewb_no <> '' AND NOT regexp_full_match(ewb_no, '[0-9]{12}') THEN 'E-way bill number "' || ewb_raw || '" is not 12 digits' END,
            CASE WHEN ewb_no <> '' AND ewb_generated_at IS NULL THEN 'ewb_generated_at is missing or not a date' END,
            CASE WHEN ewb_generated_at > dispatched_at THEN 'E-way bill generated ' || date_diff('minute', dispatched_at, ewb_generated_at) || ' min after the goods were dispatched' END,
            CASE WHEN ewb_no <> '' AND ewb_uses > 1 THEN 'Same e-way bill used on invoices ' || ewb_invoices END,
            CASE WHEN delivered_at >= valid_until THEN 'Delivered after the e-way bill expired (valid until ' || strftime(valid_until - INTERVAL 1 MINUTE, '%Y-%m-%d %H:%M') || ')' END,
            CASE WHEN delivered_raw = '' AND ewb_no <> '' AND checked_at >= valid_until THEN 'Still in transit but the e-way bill expired at ' || strftime(valid_until - INTERVAL 1 MINUTE, '%Y-%m-%d %H:%M') END
          ], lambda x: x IS NOT NULL) AS errors,
          list_filter([
            CASE WHEN delivered_raw = '' AND ewb_no <> '' AND checked_at < valid_until AND valid_until <= checked_at + INTERVAL 24 HOUR
              THEN 'In transit, e-way bill expires at ' || strftime(valid_until - INTERVAL 1 MINUTE, '%Y-%m-%d %H:%M') || ': extend it (allowed from 8 hours before to 8 hours after expiry)' END,
            CASE WHEN ewb_no <> '' AND vehicle_no = '' THEN 'No vehicle number: update Part-B of the e-way bill before the goods move' END,
            CASE WHEN ewb_no <> '' AND distance_km IS NULL THEN 'distance_km is missing, validity could not be checked' END
          ], lambda x: x IS NOT NULL) AS warnings,
          list_filter([
            CASE WHEN invoice_value IS NOT NULL AND NOT ewb_required AND ewb_no = '' THEN 'Below Rs {{ inputs.threshold_inr }}, no e-way bill needed' END
          ], lambda x: x IS NOT NULL) AS notes
        FROM enriched
      )
      ORDER BY CASE status WHEN 'ERROR' THEN 0 WHEN 'WARNING' THEN 1 ELSE 2 END, invoice_no;

      COPY report TO '{{ outputFiles["eway_bill_report.csv"] }}' (HEADER, DELIMITER ',');

      SELECT
        count(*) AS total_consignments,
        count(*) FILTER (WHERE status = 'OK') AS ok_count,
        count(*) FILTER (WHERE status = 'WARNING') AS warning_count,
        count(*) FILTER (WHERE status = 'ERROR') AS error_count,
        coalesce(sum(invoice_value) FILTER (WHERE status = 'ERROR'), 0)::DOUBLE AS value_with_errors,
        coalesce(string_agg(invoice_no || ' ' || consignee || ': ' || issues, chr(10)) FILTER (WHERE status = 'ERROR'), '') AS error_details,
        coalesce(string_agg(invoice_no || ' ' || consignee || ': ' || issues, chr(10)) FILTER (WHERE status = 'WARNING'), '') AS warning_details
      FROM report;

  - id: route_findings
    type: io.kestra.plugin.core.flow.If
    description: Branch on the result. A consignment moving without a valid e-way bill can be detained and fined, so errors are logged and optionally sent to Slack. A clean check is logged so the execution history shows when the register was last checked.
    condition: "{{ outputs.check_eway_bills.outputs[0].row.error_count > 0 }}"
    then:
      - id: log_findings
        type: io.kestra.plugin.core.log.Log
        level: WARN
        description: Write every consignment with an error or warning to the execution logs with the exact reason.
        message: |
          E-way bill check: {{ outputs.check_eway_bills.outputs[0].row.error_count }} error(s), {{ outputs.check_eway_bills.outputs[0].row.warning_count }} warning(s), {{ outputs.check_eway_bills.outputs[0].row.ok_count }} OK out of {{ outputs.check_eway_bills.outputs[0].row.total_consignments }} consignments.
          Invoice value with errors: Rs {{ outputs.check_eway_bills.outputs[0].row.value_with_errors | numberFormat('#,##0.00') }}
          Errors:
          {{ outputs.check_eway_bills.outputs[0].row.error_details }}
          Warnings:
          {{ outputs.check_eway_bills.outputs[0].row.warning_details }}

      - id: slack_enabled
        type: io.kestra.plugin.core.flow.If
        description: Only call Slack when the notify_slack input is true, so the flow runs out of the box without any secret.
        condition: "{{ inputs.notify_slack }}"
        then:
          - id: alert_logistics_team
            type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
            description: Tell the dispatch and logistics team which consignments to fix or extend before a vehicle is stopped.
            url: "{{ secret('SLACK_WEBHOOK_URL') }}"
            messageText: |
              :truck: E-way bill check: {{ outputs.check_eway_bills.outputs[0].row.error_count }} consignment(s) with errors and {{ outputs.check_eway_bills.outputs[0].row.warning_count }} warning(s) out of {{ outputs.check_eway_bills.outputs[0].row.total_consignments }}.
              {{ outputs.check_eway_bills.outputs[0].row.error_details }}
              {{ outputs.check_eway_bills.outputs[0].row.warning_details }}
              Full report: execution {{ execution.id }} in flow {{ flow.namespace }}.{{ flow.id }}
    else:
      - id: log_clean
        type: io.kestra.plugin.core.log.Log
        description: Record a clean check, including any warnings such as bills to extend.
        message: "E-way bill check passed: {{ outputs.check_eway_bills.outputs[0].row.total_consignments }} consignments, no errors, {{ outputs.check_eway_bills.outputs[0].row.warning_count }} warning(s). {{ outputs.check_eway_bills.outputs[0].row.warning_details }}"

errors:
  - id: log_check_failure
    type: io.kestra.plugin.core.log.Log
    level: ERROR
    description: Make a failed check loud. If the file is missing or malformed, no consignment was checked, and a silent failure looks like a clean dispatch register.
    message: "E-way bill check FAILED in {{ flow.namespace }}.{{ flow.id }} (execution {{ execution.id }}). No consignments were checked. Make sure dispatch_file is a CSV with the columns invoice_no, consignee, invoice_value, distance_km, vehicle_no, ewb_no, ewb_generated_at, dispatched_at and delivered_at."

outputs:
  - id: eway_bill_report
    type: FILE
    description: Per-consignment CSV report with the e-way bill, its validity end, the status (ERROR, WARNING or OK) and the reasons.
    value: "{{ outputs.check_eway_bills.outputFiles['eway_bill_report.csv'] }}"
  - id: eway_bill_summary
    type: JSON
    description: 'Counts and details, e.g. {"total_consignments": 12, "ok_count": 3, "warning_count": 2, "error_count": 7, ...}.'
    value: "{{ outputs.check_eway_bills.outputs[0].row | toJson }}"

extend:
  title: Check E-Way Bills in Your Dispatch Register Before a Truck Is Stopped
  shortDescription: Twice-daily DuckDB check of every consignment for missing, malformed, duplicate, late or expired e-way bills, bills about to expire in transit, and missing vehicle numbers.
  metaTitle: E-Way Bill Dispatch Register Check with Kestra and DuckDB
  metaDescription: Check a dispatch register with DuckDB. Catch missing, invalid, duplicate or expired e-way bills, bills to extend in transit and missing vehicle numbers.
  description: |
    In India, goods worth more than Rs 50,000 can only move with a valid e-way bill. A missing bill, a bill created after the truck left, or a bill that expires before delivery is enough for the vehicle to be detained on the road and fined. Dispatch teams juggle dozens of consignments a day, and the problems usually show up only when a driver calls from a check post. This blueprint checks the whole dispatch register on a schedule and lists the consignments to fix, and the bills to extend while there is still time. Every check runs locally in DuckDB: no portal login, no paid API, and no invoice data leaving your Kestra instance.

    ## How it works

    1. `sample_dispatch_register` (`io.kestra.plugin.core.storage.Write`) writes a 12-consignment register that contains one example of every problem. Its times are computed relative to now, so the in-transit cases always give the same result. It is used only when the `dispatch_file` input is empty.
    2. `check_eway_bills` (`io.kestra.plugin.jdbc.duckdb.Queries`) loads the CSV through `inputFiles` and, for every consignment:
       - reads the invoice value, also in the Indian format `1,05,000`;
       - checks that a consignment above `threshold_inr` has an e-way bill, and that the number has 12 digits;
       - checks that the bill was generated before the goods were dispatched, and that the same bill is not used on two invoices;
       - works out the validity from the distance (one day for every 200 km or part of it, each day ending at midnight of the following day) and checks that the goods were delivered in time;
       - warns when a bill for goods still in transit expires within 24 hours, and when the vehicle number (Part-B) is missing.

       The full result is written to `eway_bill_report.csv` with `outputFiles`, and the final `SELECT` returns the summary row through `fetchType: FETCH_ONE`, available as `outputs.check_eway_bills.outputs[0].row`.
    3. `route_findings` (`io.kestra.plugin.core.flow.If`) logs every error and warning when at least one consignment has an error, and a nested `If` posts the findings to Slack when `notify_slack` is `true`. A clean check is logged as well, with any bills to extend.
    4. The `errors` block logs a failed check loudly, because a check that silently does not run looks the same as a clean register.
    5. The `twice_daily_dispatch_check` `Schedule` trigger (09:00 and 17:00 IST, shipped disabled) covers the morning and evening dispatches and leaves time to extend bills.

    ## What you get

    - `outputs.eway_bill_report`: CSV with `invoice_no`, `consignee`, `invoice_value`, `distance_km`, `vehicle_no`, `ewb_no`, `ewb_generated_at`, `valid_until`, `dispatched_at`, `delivered_at`, `status` (`ERROR`, `WARNING` or `OK`) and `issues`, sorted with errors first.
    - `outputs.eway_bill_summary`: JSON with `total_consignments`, `ok_count`, `warning_count`, `error_count`, `value_with_errors`, `error_details` and `warning_details`.
    - Plain-language reasons such as "No e-way bill for a consignment of Rs 82500.00 (above Rs 50000)" or "In transit, e-way bill expires at 2026-10-07 23:59: extend it (allowed from 8 hours before to 8 hours after expiry)".
    - With the sample data: 7 consignments with errors (a missing bill, an 11-digit number, a bill generated after dispatch, one bill used on two invoices, which flags both, a delivery after the bill expired, and an invoice value that is not a number), 2 warnings (a bill to extend in transit, a missing vehicle number) and 3 OK, including a consignment below the limit and a value written as `1,05,000`.

    ## Who it's for

    - Manufacturers, distributors and traders in India who dispatch goods by road every day.
    - Logistics and transport teams that maintain a dispatch register in an ERP, Tally or a spreadsheet.
    - Finance and compliance teams that want an audit trail showing e-way bills were checked.

    ## Why orchestrate this with Kestra

    The e-way bill portal tells you about one bill at a time. Kestra checks the whole register on a schedule, keeps the report from every run in the execution history, branches on the result, and alerts the people who can still fix a bill before a vehicle is stopped. Because the input is just a file, the same flow can be triggered when a new dispatch export lands in S3, SFTP or Google Drive, or run once per warehouse with a `ForEach`.

    ## Prerequisites

    - Nothing for the demo: the sample dispatch register is built in.
    - For your own data: a CSV export of the dispatch register with the columns `invoice_no`, `consignee`, `invoice_value`, `distance_km`, `vehicle_no`, `ewb_no`, `ewb_generated_at`, `dispatched_at` and `delivered_at` (empty while in transit).

    ### Inputs

    - `dispatch_file` (FILE, optional): your dispatch register CSV. When empty, the built-in sample is used.
    - `threshold_inr` (INT, default `50000`): consignment value above which an e-way bill is required.
    - `timezone` (STRING, default `Asia/Kolkata`): time zone of the times in the file.
    - `notify_slack` (BOOL, default `false`): post the findings to Slack when at least one consignment has an error.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack incoming webhook URL. Only needed when `notify_slack` is `true`.

    ## Quick start

    1. Save the flow and run it with the default inputs.
    2. Open the logs of `log_findings` and download `eway_bill_report` from the Outputs tab to see the result for the sample register.
    3. Run it again and upload your own dispatch export as `dispatch_file`.
    4. Set `threshold_inr` to your state's limit if you mostly move goods within one state.
    5. Optional: add the `SLACK_WEBHOOK_URL` secret and set `notify_slack` to `true`.
    6. Replace the input with your real source and set `disabled: false` on `twice_daily_dispatch_check`.

    ## Common pitfalls

    - These checks prove the register is consistent, not that the bill is active on the portal. A cancelled or rejected bill still passes, so verify high-value consignments on the portal or through your GST Suvidha Provider's API.
    - Some goods and movements are exempt, and over-dimensional cargo has a shorter validity per day. Exclude those rows or adjust the validity rule in the query for them.
    - Some states use a different value limit for movement within the state. Set `threshold_inr` accordingly.
    - Keep `ewb_no` as text when exporting. Spreadsheets can turn a 12-digit number into `3.31E+11`, which the check reports as not 12 digits.

    ## How to extend

    - Read the dispatch register straight from your ERP database instead of a file, and write `report` back to a table.
    - Trigger the check when a new dispatch export lands, with the S3, SFTP or Google Drive triggers.
    - Wrap the alert in a `ForEach` to message the driver or transporter of every bill that must be extended.
    - Check each bill's status on the e-way bill system through your GST Suvidha Provider's API before the goods leave.

    ## Links

    - [E-way bill system](https://ewaybillgst.gov.in/)
    - [Kestra DuckDB plugin](https://kestra.io/plugins/plugin-jdbc/duckdb)
    - [Kestra Slack plugin](https://kestra.io/plugins/plugin-slack)
    - [Kestra Pebble date functions](https://kestra.io/docs/expressions)
    - [DuckDB list functions](https://duckdb.org/docs/stable/sql/functions/list)

    - This blueprint has been created by [SanjanaG-01](https://github.com/SanjanaG-01)
  tags:
    - Business
    - Data
  subTags:
    - Policy & Compliance
    - Testing & Quality
  ee: false
  demo: false
