id: elasticsearch-indices-segments-count-growth-sentinel
namespace: company.data

inputs:
  - id: es_host
    type: STRING
    defaults: "elasticsearch.internal"
    description: Elasticsearch cluster hostname or IP address.
  - id: es_port
    type: INT
    defaults: 9200
    description: Elasticsearch HTTP port.
  - id: es_user
    type: STRING
    defaults: "elastic"
    description: Elasticsearch username.
  - id: max_segments_threshold
    type: INT
    defaults: 150
    description: Maximum acceptable Lucene segment count per index before flagging segment sprawl.

tasks:
  - id: query_segment_counts
    type: io.kestra.plugin.scripts.shell.Commands
    containerImage: ghcr.io/kestra-io/tools:latest
    commands:
      - |
        curl -s -u "{{ inputs.es_user }}:{{ secret('ES_PASSWORD') }}" \
          "http://{{ inputs.es_host }}:{{ inputs.es_port }}/_cat/indices?format=json&h=index,segments.count,segments.memory&s=segments.count:desc" > /tmp/es_segments.json
        
        SPRAWL_COUNT=$(jq '[.[] | select((.["segments.count"] | tonumber) >= {{ inputs.max_segments_threshold }})] | length' /tmp/es_segments.json)
        PEAK_SEGMENTS=$(jq '[.[]["segments.count"] | tonumber] | max // 0' /tmp/es_segments.json)
        
        echo "::set-output name=sprawl_count::$SPRAWL_COUNT::"
        echo "::set-output name=peak_segments::$PEAK_SEGMENTS::"

  - id: evaluate_segment_health
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.query_segment_counts.vars.sprawl_count | int > 0 }}"
    then:
      - id: notify_search_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#elasticsearch-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 Elasticsearch Lucene Segment Sprawl Alert",
                "text": "Elasticsearch cluster at `{{ inputs.es_host }}` recorded *{{ outputs.query_segment_counts.vars.sprawl_count }}* indices exceeding {{ inputs.max_segments_threshold }} Lucene segments (Peak: *{{ outputs.query_segment_counts.vars.peak_segments }}* segments). Impact: Search latency degrades significantly due to multi-segment disk seeking, and segment metadata consumes excessive JVM heap memory.",
                "footer": "Kestra Search Sentinel • Elasticsearch"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#elasticsearch-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ Elasticsearch Lucene Index Segments Sprawl Sentinel Pipeline Failure",
            "text": "Failed to query Elasticsearch _cat/indices. Verify cluster network connectivity and credentials.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  metaDescription: "Monitors Elasticsearch _cat/indices to detect excessive Lucene segment counts degrading search latency and heap memory."
  metaTitle: Elasticsearch Lucene Index Segments Sprawl Sentinel with Kestra
  title: Elasticsearch Lucene Index Segments Sprawl Sentinel
  shortDescription: Monitors Elasticsearch _cat/indices to detect excessive Lucene segment counts degrading search latency and heap memory.
  description: |
    ## How it works
    This workflow queries `_cat/indices` with `format=json` and extracts segment counts across all cluster indices. In Lucene-based storage, excessive segment counts happen when force-merge or background merges cannot keep pace with high indexing churn. Large numbers of segments degrade query latency and consume JVM heap for segment descriptors. When indices exceed the threshold, Slack is alerted.

    ## What you get
    - Immediate detection of unmerged Lucene segment sprawl.
    - Prevents query latency spikes and JVM heap exhaustion.
    - Pinpoints specific indices requiring `_forcemerge`.

    ## Who it's for
    - Search Platform Engineers and Elasticsearch Cluster Administrators.
    - SREs maintaining high-throughput logging (ELK) or search clusters.

    ## Why orchestrate this with Kestra
    - **Native HTTP Telemetry**: Query cluster state via REST API with zero monitoring daemons.
    - **Automated Lifecycle Integration**: Easily trigger `_forcemerge?max_num_segments=1` tasks as follow-up workflows.
    - **Customizable Thresholds**: Set precise segment thresholds suited to your ingestion scale.

    ## Prerequisites
    - Elasticsearch cluster (7.x / 8.x) accessible over HTTP/HTTPS.
    - Secrets `ES_PASSWORD` and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import this blueprint into Kestra.
    2. Configure host and segment count threshold.
    3. Run the flow to audit Lucene segment health.

    ## How to extend
    - Automatically trigger `POST /<index>/_forcemerge?max_num_segments=1` on read-only indices.
    - Export segment memory metrics to a dashboard for long-term capacity planning.

    ## Links
    - [Elasticsearch Indices Segments API](https://www.elastic.co/guide/en/elasticsearch/reference/current/indices-segments.html)
    - [Kestra Shell Plugin](https://kestra.io/plugins/plugin-scripts/commands/io.kestra.plugin.scripts.shell.commands)
  tags:
    - Data
    - Infrastructure
  subTags:
    - ELT & Data Landing
    - Day 2 Operations
  ee: false
  demo: false
