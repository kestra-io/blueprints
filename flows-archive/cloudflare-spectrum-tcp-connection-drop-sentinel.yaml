id: cloudflare-spectrum-tcp-connection-drop-sentinel
namespace: company.networking

inputs:
  - id: zone_id
    type: STRING
    description: Cloudflare Zone ID.
  - id: app_id
    type: STRING
    description: Cloudflare Spectrum Application ID.
  - id: error_count_threshold
    type: INT
    defaults: 20
    description: Maximum acceptable TCP error count over the last 15 minutes.

tasks:
  - id: query_spectrum_telemetry
    type: io.kestra.plugin.scripts.shell.Commands
    containerImage: ghcr.io/kestra-io/tools:latest
    commands:
      - |
        GRAPHQL_QUERY='{"query":"{ viewer { zones(filter: {zoneTag: \"{{ inputs.zone_id }}\"}) { spectrumNetworkAnalyticsAdaptive(filter: {datetime_geq: \"{{ now() | dateAdd(-15, '''MINUTES''') | isoDate }}\", spectrumAppId: \"{{ inputs.app_id }}\"}, limit: 100) { count errors } } } }"}'
        
        curl -s -X POST "https://api.cloudflare.com/client/v4/graphql"           -H "Authorization: Bearer {{ secret('CLOUDFLARE_API_TOKEN') }}"           -H "Content-Type: application/json"           --data-raw "$GRAPHQL_QUERY" > /tmp/spectrum_data.json
        
        ERROR_COUNT=$(jq '[.data.viewer.zones[0].spectrumNetworkAnalyticsAdaptive[]? | .errors] | add // 0' /tmp/spectrum_data.json)
        
        echo "::set-output name=error_count::$ERROR_COUNT::"

  - id: evaluate_spectrum_health
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.query_spectrum_telemetry.vars.error_count | int > inputs.error_count_threshold }}"
    then:
      - id: notify_network_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#infrastructure-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 Cloudflare Spectrum TCP Connection Drop Alert",
                "text": "Cloudflare Spectrum app `{{ inputs.app_id }}` in zone `{{ inputs.zone_id }}` recorded *{{ outputs.query_spectrum_telemetry.vars.error_count }}* TCP connection errors in the last 15 minutes (threshold: {{ inputs.error_count_threshold }}). Impact: Non-HTTP TCP/UDP applications (gaming servers, SSH bastions, MQTT IoT brokers) are experiencing connection drops at edge proxies.",
                "footer": "Kestra Network Sentinel • Cloudflare Spectrum"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#infrastructure-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ Cloudflare Spectrum Sentinel Execution Failed",
            "text": "The Cloudflare Spectrum GraphQL query workflow failed. Please verify Cloudflare API token and zone parameters.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  metaDescription: "Audits Cloudflare Spectrum analytics to detect TCP connection dropouts and proxy origin reachability failures."
  metaTitle: Cloudflare Spectrum TCP/UDP Connection Drop and Origin Reachability Sentinel with Kestra
  title: Cloudflare Spectrum TCP/UDP Connection Drop and Origin Reachability Sentinel
  shortDescription: Audits Cloudflare Spectrum analytics to detect TCP connection dropouts and proxy origin reachability failures.
  description: |
    ## How it works
    This workflow queries the Cloudflare GraphQL Analytics API (`spectrumNetworkAnalyticsAdaptive`) to evaluate the connection health of non-HTTP applications proxied through Cloudflare Spectrum (such as Minecraft/gaming servers, MQTT broker clusters, or enterprise SSH jump hosts). When origin servers crash or edge network routes degrade, TCP error counts spike. An automated incident alert is sent to Slack.

    ## What you get
    - Real-time detection of TCP/UDP transport layer degradation at edge locations.
    - Prevents prolonged connectivity blackouts for proprietary TCP protocols.
    - Immediate diagnostic telemetry detailing error volume and zone context.

    ## Who it's for
    - Network Engineers and SREs maintaining non-HTTP services exposed over Cloudflare Spectrum.
    - Game Server Administrators and IoT Infrastructure Architects managing persistent TCP socket traffic.

    ## Why orchestrate this with Kestra
    - **GraphQL Analytics Integration**: Query Cloudflare's adaptive analytics API natively with authenticated payloads.
    - **Continuous Health Polling**: Run automated 15-minute sampling without managing custom cron runners.
    - **Instant Routing**: Dispatches high-severity incident notifications to Slack or PagerDuty.

    ## Prerequisites
    - Cloudflare API token with `Analytics:Read` permissions.
    - Secrets `CLOUDFLARE_API_TOKEN` and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import this blueprint into Kestra.
    2. Configure Zone ID and Spectrum Application ID.
    3. Run the workflow to inspect TCP transport health.

    ## How to extend
    - Query egress bandwidth alongside error rates.
    - Automatically trigger origin server failover via Cloudflare Load Balancing.

    ## Links
    - [Cloudflare Spectrum Analytics Documentation](https://developers.cloudflare.com/spectrum/analytics/)
    - [Kestra Shell Plugin](https://kestra.io/plugins/plugin-scripts/commands/io.kestra.plugin.scripts.shell.commands)
  tags:
    - Cloud
    - Infrastructure
  subTags:
    - Infrastructure Automation
    - Day 2 Operations
  ee: false
  demo: false
