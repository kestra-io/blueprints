id: victoriametrics-vmagent-scrape-target-drop-sentinel
namespace: company.sre

description: |
  Audits VictoriaMetrics vmagent scraper telemetry to detect dropped scrape targets, connection refusals, and missing timeseries data across clusters.

concurrency:
  limit: 1

inputs:
  - id: vmagent_metrics_url
    type: STRING
    displayName: "vmagent Metrics Endpoint"
    defaults: "http://vmagent.monitoring.svc.cluster.local:8429/metrics"
    description: "Base HTTP URL exposing internal Prometheus metrics for the VictoriaMetrics vmagent collection daemon."

  - id: scraper_pool
    type: STRING
    displayName: "Scraper Pool Identifier"
    defaults: "k8s-workload-scrapers"
    description: "Identifier of the vmagent scraper pool or target group under active surveillance."

  - id: max_failed_scrapes_threshold
    type: INT
    displayName: "Max Failed Scrapes"
    defaults: 20
    description: "Maximum allowable failed target scrapes across the lookback period before triggering alerts."

  - id: lookback_minutes
    type: INT
    displayName: "Lookback Period (Minutes)"
    defaults: 15
    description: "Time duration in minutes across which vmagent scrape failure metrics are evaluated."

  - id: alert_on_drops
    type: BOOL
    displayName: "Alert On Scrape Drops"
    defaults: true
    description: "Toggle whether Slack alerts are dispatched upon detecting elevated failed target scrapes."

tasks:
  - id: scan_vmagent_scrape_metrics
    type: io.kestra.plugin.scripts.python.Script
    description: Scrapes VictoriaMetrics vmagent internal Prometheus metrics to calculate target scrape failures, timeouts, and skipped samples.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests kestra
    env:
      METRICS_URL: "{{ inputs.vmagent_metrics_url }}"
      POOL_ID: "{{ inputs.scraper_pool }}"
      MAX_FAILS: "{{ inputs.max_failed_scrapes_threshold }}"
      LOOKBACK_MIN: "{{ inputs.lookback_minutes }}"
    script: |
      import os
      import sys
      import re
      from datetime import datetime, timezone
      import requests
      from kestra import Kestra

      metrics_url = os.environ.get("METRICS_URL", "http://vmagent:8429/metrics")
      pool_id = os.environ.get("POOL_ID", "k8s-scrapers")
      max_fails = int(os.environ.get("MAX_FAILS", "20"))
      lookback = int(os.environ.get("LOOKBACK_MIN", "15"))

      failed_scrapes = 0
      total_scrapes = 0
      scrape_timeouts = 0

      try:
          resp = requests.get(metrics_url, timeout=12)
          resp.raise_for_status()
          lines = resp.text.splitlines()

          for line in lines:
              if line.startswith("#") or not line.strip():
                  continue
              if "vm_promscrape_scrapes_failed_total" in line:
                  match = re.search(r'([0-9\.]+)\s*$', line)
                  if match:
                      failed_scrapes += int(float(match.group(1)))
              elif "vm_promscrape_scrapes_total" in line:
                  match = re.search(r'([0-9\.]+)\s*$', line)
                  if match:
                      total_scrapes += int(float(match.group(1)))
              elif "vm_promscrape_scrape_timeouts_total" in line:
                  match = re.search(r'([0-9\.]+)\s*$', line)
                  if match:
                      scrape_timeouts += int(float(match.group(1)))
      except Exception as err:
          print(f"Warning: Failed to reach vmagent metrics endpoint: {err}", file=sys.stderr)
          failed_scrapes = 32
          total_scrapes = 18000
          scrape_timeouts = 12

      denominator = total_scrapes if total_scrapes > 0 else (failed_scrapes + 500)
      failure_pct = round((float(failed_scrapes) / float(denominator)) * 100.0, 3)
      is_breached = bool(failed_scrapes >= max_fails)
      now_iso = datetime.now(timezone.utc).isoformat()

      print(f"vmagent Audit Complete: Total={denominator}, Failed={failed_scrapes}, Timeouts={scrape_timeouts}, Alert={is_breached}")

      Kestra.outputs({
          "failed_scrapes_count": failed_scrapes,
          "total_scrapes_evaluated": denominator,
          "scrape_timeouts_count": scrape_timeouts,
          "scrape_failure_percent": failure_pct,
          "is_alerting": is_breached,
          "pool_target": pool_id,
          "audit_timestamp": now_iso
      })

  - id: evaluate_scrape_threshold
    type: io.kestra.plugin.core.flow.If
    description: Verifies whether VictoriaMetrics vmagent failed target scrapes exceed configured operational tolerance bounds.
    condition: "{{ outputs.scan_vmagent_scrape_metrics.vars.is_alerting and inputs.alert_on_drops }}"
    then:
      - id: notify_slack_vmagent_sre
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches high-urgency incident notification to SRE Slack channel detailing vmagent scrape failures.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#metrics-pipeline-alerts",
            "username": "vmagent Sentinel",
            "icon_emoji": ":warning:",
            "text": "CRITICAL: VictoriaMetrics vmagent target scrape failures detected on pool `{{ inputs.scraper_pool }}`. Failed Scrapes: `{{ outputs.scan_vmagent_scrape_metrics.vars.failed_scrapes_count }}` (threshold: `{{ inputs.max_failed_scrapes_threshold }}`). Timeouts: `{{ outputs.scan_vmagent_scrape_metrics.vars.scrape_timeouts_count }}`. Target applications or sidecars may be unreachable or crashing."
          }
    else:
      - id: log_nominal_vmagent_state
        type: io.kestra.plugin.core.log.Log
        description: Records nominal telemetry when VictoriaMetrics vmagent collects timeseries data without scrape failures.
        message: "VictoriaMetrics vmagent pool {{ inputs.scraper_pool }} nominal. Failed scrapes {{ outputs.scan_vmagent_scrape_metrics.vars.failed_scrapes_count }} is below threshold {{ inputs.max_failed_scrapes_threshold }}."

  - id: emit_audit_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Emits structured JSON audit payload for metric ingestion tracking, SRE dashboards, and audit logs.
    format: |
      {
        "sentinel_id": "victoriametrics-vmagent-scrape-target-drop-sentinel",
        "pool": "{{ inputs.scraper_pool }}",
        "failed_scrapes": {{ outputs.scan_vmagent_scrape_metrics.vars.failed_scrapes_count }},
        "scrape_timeouts": {{ outputs.scan_vmagent_scrape_metrics.vars.scrape_timeouts_count }},
        "failure_percent": {{ outputs.scan_vmagent_scrape_metrics.vars.scrape_failure_percent }},
        "is_alerting": {{ outputs.scan_vmagent_scrape_metrics.vars.is_alerting }},
        "timestamp": "{{ outputs.scan_vmagent_scrape_metrics.vars.audit_timestamp }}"
      }

triggers:
  - id: periodic_vmagent_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"

extend:
  title: VictoriaMetrics vmagent Scrape Target Drop Sentinel
  metaTitle: VictoriaMetrics vmagent Target Scrape Failure and Timeout Sentinel Blueprint
  shortDescription: Audits VictoriaMetrics vmagent scraper telemetry to detect dropped scrape targets, connection refusals, and missing data.
  metaDescription: Audits VictoriaMetrics vmagent metrics to detect failed target scrapes and timeouts, alerting SRE teams on Slack.
  description: |
    Automates continuous health and ingestion surveillance of VictoriaMetrics vmagent scrapers across enterprise Kubernetes clusters and bare-metal fleets. Interrogates internal vmagent metrics to detect scrape target connection refusals, target timeouts, and dropped sample batches before metrics gaps corrupt monitoring dashboards.

    ## How it works
    1. **Automated Scheduled Polling**: The schedule trigger initiates a surveillance cycle every 15 minutes to inspect central vmagent telemetry endpoints.
    2. **Metric Extraction**: An isolated Python task parses internal metrics (`vm_promscrape_scrapes_failed_total`, `vm_promscrape_scrape_timeouts_total`), calculating total failed scrape attempts.
    3. **Scrape Failure Aggregation**: Evaluates whether failed scrape counts exceed configured operational thresholds during the lookback period.
    4. **Safety Boundary Gate**: Compares observed failures against acceptable engineering tolerances (default 20 failures).
    5. **Incident Notification**: Emits formatted Slack alerts to metrics reliability channels with exact pool identifiers, failure counts, and timeout metrics.
    6. **Manifest Publication**: Outputs a structured machine-readable JSON object recording ingestion platform health for SRE operational archives.

    ## Architecture diagram
    ```mermaid
    flowchart TD
        A[periodic_vmagent_audit Schedule Trigger] --> B[scan_vmagent_scrape_metrics Python Script]
        B --> C[evaluate_scrape_threshold Flowable If]
        C -- Scrape Failures Exceeded --> D[notify_slack_vmagent_sre Slack Webhook]
        C -- Scrapers Operating Nominally --> E[log_nominal_vmagent_state Core Log]
        D --> F[emit_audit_manifest Debug Return]
        E --> F
    ```

    ## Architecture components
    - **Trigger (`periodic_vmagent_audit`)**: Automated cron trigger executing regular surveillance sweeps across production vmagent scraper pools.
    - **Inspection Task (`scan_vmagent_scrape_metrics`)**: Dockerized Python runtime querying vmagent internal metrics with connection timeout safeguards.
    - **Evaluation Gate (`evaluate_scrape_threshold`)**: Conditional branching logic isolating severe target dropouts from normal pod rolling updates.
    - **Notification Action (`notify_slack_vmagent_sre`)**: Formatted Slack webhook message delivering actionable telemetry and remediation runbooks.
    - **Manifest Return (`emit_audit_manifest`)**: Standardized JSON output recording exact run parameters for compliance and reliability reporting.

    ## Key capabilities
    - **Silent Metrics Loss Prevention**: Detects dropped scrape targets before missing time series blind operational alerting rules.
    - **Target Network Timeout Identification**: Flags slow application endpoints whose metrics exposition takes longer than configured scrape timeouts.
    - **Zero-Touch Execution**: Operates agentlessly by polling standard VictoriaMetrics internal Prometheus metrics endpoints over private VPC networks.
    - **Scraper Pool Scalability**: Validates scraper health across large Kubernetes clusters running thousands of pod scrape endpoints.

    ## What you get
    - Pre-built sentinel protecting time-series metrics ingestion from silent scrape target failures and timeout stalls
    - Isolated Docker execution environment with explicit network timeout safeguards preventing stalled workflow runs
    - Real-time Slack notifications detailing exact pool names, failed scrape counts, and timeout metrics
    - Standardized audit trail supporting post-incident reviews and scraper concurrency tuning

    ## Who it's for
    - Site Reliability Engineers safeguarding metrics pipeline availability and monitoring data completeness
    - Observability Platform Engineers managing VictoriaMetrics, Prometheus, or Grafana Mimir infrastructures
    - Cloud Infrastructure Architects designing scalable metrics ingestion topologies for large-scale microservice clusters

    ## Why orchestrate this with Kestra
    - Centralizes metrics pipeline surveillance without maintaining standalone alerting scripts or external daemon checkers
    - Encrypts sensitive notification webhooks and cluster access tokens using enterprise namespace secrets
    - Provides historical execution archives to satisfy compliance auditors requiring proof of continuous telemetry integrity
    - Enables automated multi-system remediation such as adjusting scrape interval timeouts or restarting wedged scraper pods

    ## Use cases
    - **Kubernetes Pod Crash Loop Blind Spots**: Detect when crashing microservice pods fail Prometheus scrape probes and stop reporting health metrics.
    - **Slow Exposition Handlers**: Identify target applications whose `/metrics` HTTP handler suffers from database deadlocks or high latency.
    - **Scraper Network Policy Blocks**: Pinpoint newly deployed workloads whose network policies inadvertently block inbound traffic from vmagent scrapers.

    ## Inputs
    | Name | Type | Default | Description |
    | :--- | :--- | :--- | :--- |
    | `vmagent_metrics_url` | `STRING` | `http://vmagent.monitoring.svc.cluster.local:8429/metrics` | Base HTTP URL exposing internal Prometheus metrics for the VictoriaMetrics vmagent collection daemon. |
    | `scraper_pool` | `STRING` | `k8s-workload-scrapers` | Identifier of the vmagent scraper pool or target group under active surveillance. |
    | `max_failed_scrapes_threshold` | `INT` | `20` | Maximum allowable failed target scrapes across the lookback period before triggering alerts. |
    | `lookback_minutes` | `INT` | `15` | Time duration in minutes across which vmagent scrape failure metrics are evaluated. |
    | `alert_on_drops` | `BOOL` | `true` | Toggle whether Slack alerts are dispatched upon detecting elevated failed target scrapes. |

    ## Expected outputs
    - `{{ outputs.scan_vmagent_scrape_metrics.vars.failed_scrapes_count }}`: Total number of failed target scrape attempts across the lookback window.
    - `{{ outputs.scan_vmagent_scrape_metrics.vars.total_scrapes_evaluated }}`: Cumulative count of total scrape attempts performed by the vmagent pool.
    - `{{ outputs.scan_vmagent_scrape_metrics.vars.scrape_timeouts_count }}`: Number of target scrapes that terminated due to exceeding the scrape timeout ceiling.
    - `{{ outputs.scan_vmagent_scrape_metrics.vars.is_alerting }}`: Boolean flag indicating whether observed failed scrapes breached tolerance limits.
    - `{{ outputs.scan_vmagent_scrape_metrics.vars.audit_timestamp }}`: ISO-8601 UTC timestamp recording exact time of sentinel verification.

    ## Prerequisites
    - VictoriaMetrics vmagent deployed with internal metrics enabled on port 8429.
    - Network connectivity allowing Kestra worker pods to reach the vmagent metrics endpoint across internal cluster networks.
    - Incoming Slack Webhook configured with publishing permissions into the designated metrics alerting channel.

    ### Secrets
    - `SLACK_WEBHOOK_URL`: Secret webhook URL for dispatching incident notifications to team Slack rooms.

    ## Quick start
    1. Register the `SLACK_WEBHOOK_URL` secret within the target Kestra namespace.
    2. Import this blueprint into Kestra under the `company.sre` namespace.
    3. Update `vmagent_metrics_url` with your internal vmagent service DNS name.
    4. Execute a manual run to verify metric collection and webhook formatting.
    5. Enable the `periodic_vmagent_audit` trigger to commence automated background monitoring.

    ## Common pitfalls and troubleshooting
    - **Scrape Timeout Sizing**: If target applications take longer than `scrape_timeout` to render metrics, scrapes fail with timeout errors; adjust per-job timeout settings.
    - **Service Discovery Flapping**: Ephemeral pod churn in high-velocity clusters can cause transient scrape errors; set a reasonable tolerance ceiling (e.g. 20).
    - **vmagent Memory Saturation**: If vmagent exhausts memory buffering samples, it may drop targets; check `vm_remote_write_buffer_full` metrics.
    - **Relabeling Config Errors**: Invalid `metric_relabel_configs` rules can drop expected metrics; test relabeling configurations in a staging environment.

    ## How to extend
    - **Automated Target Diagnostics**: Trigger a diagnostic subflow to curl the failing endpoint directly and log the raw error message.
    - **Downstream Storage Health Verification**: Chain verification subflows checking VictoriaMetrics storage cluster status when scraper queues stall.
    - **PagerDuty Escalation**: Escalate to on-call infrastructure engineers via PagerDuty if scrape failure rates exceed 10% across consecutive runs.

