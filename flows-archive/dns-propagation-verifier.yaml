id: dns-propagation-verifier
namespace: company.team
description: |
  After a DNS change, poll the changed record across independent public
  resolvers until every one answers with your expected value — or tell
  you exactly which resolvers are still stale when the timeout expires.

triggers:
  - id: propagation_webhook
    type: io.kestra.plugin.core.trigger.Webhook
    description: Call this from the deploy pipeline right after terraform apply or the console change, so propagation is verified before the next stage runs.
    key: dns-propagation-check
  - id: drift_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    description: Optional drift watch — re-verify the record every 6 hours to catch a change someone made outside your pipeline. Shipped disabled.
    cron: "15 */6 * * *"
    disabled: true

inputs:
  - id: hostname
    type: STRING
    defaults: www.example.com
    description: The record name being verified, e.g. www.example.com or api.example.com.
  - id: record_type
    type: STRING
    defaults: A
    description: DNS record type to query (A, AAAA, CNAME, TXT, ...).
  - id: expected_value
    type: STRING
    defaults: 203.0.113.10
    description: The value every resolver should return once the change has fully propagated — the target IP, CNAME, or TXT content.
  - id: resolvers
    type: STRING
    defaults: 8.8.8.8,1.1.1.1,9.9.9.9,208.67.222.222
    description: Comma-separated DNS resolvers to interrogate independently (Google, Cloudflare, Quad9, OpenDNS by default).
  - id: timeout_seconds
    type: INT
    defaults: 120
    description: Give up after this many seconds of polling and report which resolvers were still stale.
  - id: poll_interval
    type: INT
    defaults: 10
    description: Seconds to wait between rounds of resolver queries.

tasks:
  - id: check_propagation
    type: io.kestra.plugin.scripts.shell.Commands
    description: Install dig in a throwaway Alpine container, then poll every listed resolver on an interval until all of them return expected_value or the deadline passes. An answer matches when expected_value appears on any line of the response, so round-robin pools where your target shares the record with other IPs are handled correctly. Each round logs the match count, and the task publishes all_matched, matched, resolvers, attempts, and the stale list through Kestra's stdout outputs protocol. An empty resolver list fails fast instead of reporting a vacuous success.
    containerImage: alpine:3.20
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    commands:
      - |
        set -eu
        apk add --no-cache bind-tools >/dev/null 2>&1
        NAME="{{ inputs.hostname }}"
        TYPE="{{ inputs.record_type }}"
        EXPECTED="{{ inputs.expected_value }}"
        RESOLVERS="{{ inputs.resolvers }}"
        DEADLINE=$(( $(date +%s) + {{ inputs.timeout_seconds }} ))
        attempt=0
        while :; do
          attempt=$(( attempt + 1 ))
          matched=0
          total=0
          pending=""
          OLDIFS=$IFS
          IFS=','
          for r in $RESOLVERS; do
            r=$(printf '%s' "$r" | tr -d ' ')
            if [ -z "$r" ]; then
              continue
            fi
            total=$(( total + 1 ))
            ans=$(dig +short +time=3 +tries=1 "@$r" "$NAME" "$TYPE" 2>/dev/null | tr -d '"' | tr -d '\r')
            if printf '%s\n' "$ans" | grep -qxF "$EXPECTED"; then
              matched=$(( matched + 1 ))
            else
              flat=$(printf '%s' "$ans" | tr '\n' ',')
              pending="${pending}${r}=${flat:-empty}|"
            fi
          done
          IFS=$OLDIFS
          if [ "$total" -eq 0 ]; then
            echo "no resolvers configured — refusing to report success" >&2
            exit 1
          fi
          echo "attempt $attempt: $matched/$total resolvers answer $EXPECTED"
          if [ "$matched" -eq "$total" ]; then
            printf '::{"outputs":{"all_matched":true,"matched":%d,"resolvers":%d,"attempts":%d,"pending":""}}::\n' "$matched" "$total" "$attempt"
            exit 0
          fi
          if [ "$(date +%s)" -ge "$DEADLINE" ]; then
            clean=$(printf '%s' "$pending" | tr -cd 'a-zA-Z0-9.:|=,-')
            printf '::{"outputs":{"all_matched":false,"matched":%d,"resolvers":%d,"attempts":%d,"pending":"%s"}}::\n' "$matched" "$total" "$attempt" "$clean"
            exit 0
          fi
          sleep {{ inputs.poll_interval }}
        done

  - id: check_result
    type: io.kestra.plugin.core.flow.If
    description: Split on the verdict — a fully propagated record is a quiet success worth logging with the attempt count; a stale tail is worth waking someone with the exact resolver/value pairs that disagree.
    condition: "{{ outputs.check_propagation.vars.all_matched == false }}"
    then:
      - id: alert_stale_resolvers
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Name the resolvers still returning the old answer and their values, so the operator knows propagation is genuinely incomplete rather than the check being wrong.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "DNS propagation TIMEOUT: {{ inputs.hostname }} {{ inputs.record_type }}={{ inputs.expected_value }} seen by {{ outputs.check_propagation.vars.matched }}/{{ outputs.check_propagation.vars.resolvers }} resolver(s) after {{ inputs.timeout_seconds }}s ({{ outputs.check_propagation.vars.attempts }} rounds). Still stale: {{ outputs.check_propagation.vars.pending }}. Execution {{ execution.id }}."
          }
    else:
      - id: log_propagated
        type: io.kestra.plugin.core.log.Log
        description: Record the round count and resolver count so propagation speed becomes visible in the execution history.
        message: "DNS propagated: {{ inputs.hostname }} {{ inputs.record_type }}={{ inputs.expected_value }} confirmed by all {{ outputs.check_propagation.vars.resolvers }} resolver(s) in {{ outputs.check_propagation.vars.attempts }} round(s)."

errors:
  - id: alert_check_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alert when the check itself could not run — no dig, no network, bad inputs — because a verifier that crashes must never be mistaken for a verdict.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "DNS propagation check FAILED in flow {{ flow.id }} (execution {{ execution.id }}) for {{ inputs.hostname }}. No verdict was produced — verify the task container can reach the resolvers on UDP/53 and that the inputs are valid."
      }

outputs:
  - id: propagation_summary
    type: JSON
    description: 'The verdict — e.g. {"all_matched": true, "matched": 4, "resolvers": 4, "attempts": 1, "pending": ""} — ready for the deploy pipeline or a dashboard.'
    value: "{{ outputs.check_propagation.vars | toJson }}"

extend:
  title: Verify a DNS Change Across Independent Resolvers Before You Celebrate
  shortDescription: Post-deploy webhook that polls the changed record across Google, Cloudflare, Quad9, and OpenDNS until all agree — and names the stale ones when they don't.
  metaTitle: DNS Propagation Checking with Kestra
  metaDescription: Poll a changed DNS record across independent public resolvers until every answer matches your target, and alert Slack listing stale resolvers on timeout.
  description: |
    DNS changes are the rare deploy step where "it worked on my machine" is literally true — your resolver cached the new answer minutes ago, the rest of the world is still on the old one, and the rollout either hangs or quietly fails for a subset of users. This blueprint turns propagation from a question you ask a website into a verification your pipeline executes: independent public resolvers are polled on an interval until every answer matches the value you set, and on timeout the alert lists exactly which resolvers were stale and what they returned.

    ## How it works

    1. `check_propagation` (`io.kestra.plugin.scripts.shell.Commands` on the Docker task runner) installs `dig` in a throwaway `alpine:3.20` container and loops: every resolver in the `resolvers` input is queried independently (`dig @resolver name type`), answers are compared against `expected_value`, and the round's match count is logged. When all resolvers agree, it emits `all_matched: true` with the round count; when the `timeout_seconds` deadline passes first, it emits `all_matched: false` plus a sanitized `pending` list of `resolver=value` pairs still disagreeing. An empty resolver list exits with an error instead of reporting a vacuous success.
    2. `check_result` (`io.kestra.plugin.core.flow.If`) branches on `all_matched`. False: `alert_stale_resolvers` posts the matched count, rounds, and the stale resolver/value pairs to Slack. True: `log_propagated` records how many rounds full consensus took.
    3. The `errors` block alerts Slack when the verifier itself fails — no dig, no network — because a crashed check must never be read as "propagated".
    4. Triggers: a `Webhook` (`dns-propagation-check`) for the deploy pipeline to call after `terraform apply` or the console change, plus an optional disabled `Schedule` for drift watching.

    ## What you get

    - A yes/no propagation verdict your pipeline can branch on, not a browser refresh loop.
    - Independent vantage points: four different operators' resolvers, not four queries to your own cache.
    - On timeout, the exact `resolver=value` pairs that are still stale — proof propagation is incomplete rather than the check being wrong.
    - A `propagation_summary` JSON output for the next pipeline stage or a dashboard.

    ## Who it's for

    - DevOps engineers cut over domains, migrations, and blue/green endpoints and need certainty before flipping the next switch.
    - Platform teams whose CD pipelines currently sleep 30 minutes and hope.
    - Anyone who has been burned by "propagated" meaning "propagated for me".

    ## Why orchestrate this with Kestra

    The polling loop itself is trivial shell; what Kestra adds is everything around it: an event entry point the deploy pipeline can call, a branch that separates consensus from timeout, an alert that carries the evidence, self-reporting failures, and an execution history that shows how long propagation actually took each time. Turned into a flow, the same check doubles as a drift detector by enabling the schedule — one blueprint, cutover verification and ongoing truth.

    ## Prerequisites

    - Outbound UDP/53 from the Kestra Worker's Docker daemon to the resolvers you list (corporate networks sometimes block it — a good reason to list resolvers you can reach).
    - The expected value after your change: target IP for A/AAAA, target hostname for CNAME, full string for TXT.
    - A Slack incoming webhook for timeout and failure alerts.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack incoming webhook URL for stale-resolver and verifier-failure alerts.

    ## Quick start

    1. Add the Slack webhook secret to your namespace.
    2. Set `hostname`, `record_type`, and `expected_value` to the change you just made.
    3. Call the `dns-propagation-check` webhook from your pipeline — or run the flow manually — and read `propagation_summary`.
    4. Optionally enable `drift_schedule` to keep watching the record.

    ## How to extend

    - Add the record's previous value as an input and alert when some resolvers return old and some new (split-brain) instead of only on mismatches.
    - Chain a second stage after `check_result` that runs smoke tests against the new target only once propagation is confirmed.
    - Verify many records from one change by wrapping the flow as a subflow over a records input.
    - Forward the timeout alert to PagerDuty by adding a notification task beside Slack.

    ## Links

    - [How DNS propagation works](https://www.cloudflare.com/learning/dns/what-is-dns/)
    - [dig man page (bind-tools)](https://bind9.readthedocs.io/en/latest/manpages.html)
    - [Kestra Webhook trigger](https://kestra.io/plugins/triggers/webhook)
    - This blueprint has been created by [RudraMalvankar](https://github.com/RudraMalvankar)
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Networking / DNS
    - Monitoring & Alerting
  ee: false
  demo: false
