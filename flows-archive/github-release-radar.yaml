id: github-release-radar
namespace: company.team
description: |
  Watch a GitHub repository's releases, detect new versions against the last
  seen release, and alert Slack so the team never misses a rollout.

triggers:
  - id: every_6_hours
    type: io.kestra.plugin.core.trigger.Schedule
    description: Poll the Releases API four times a day.
    cron: "0 */6 * * *"

inputs:
  - id: repository
    type: STRING
    displayName: GitHub Repository
    description: Target repository in 'owner/repo' format (e.g. kestra-io/kestra).
    defaults: kestra-io/kestra
  - id: include_prereleases
    type: BOOL
    displayName: Include Prereleases
    description: Treat prereleases and drafts as new releases too. Disabled by default.
    defaults: false
  - id: notify_slack
    type: BOOL
    displayName: Notify Slack
    description: Send a Slack alert when a new release is detected.
    defaults: true

tasks:
  - id: load_seen
    type: io.kestra.plugin.core.kv.Get
    description: Load the last notified release id so only genuinely new releases alert.
    key: "github-release-radar-seen"
    errorOnMissing: false

  - id: check_release
    type: io.kestra.plugin.scripts.python.Script
    description: Fetch recent releases, pick the newest stable one, and compare with the seen id.
    containerImage: python:3.11-slim
    env:
      GITHUB_TOKEN: "{{ secret('GITHUB_TOKEN') }}"
    inputFiles:
      seen.json: "{{ outputs.load_seen.value | toJson }}"
    script: |
      import json, os, time, urllib.request
      from kestra import Kestra

      logger = Kestra.logger()
      TOKEN = os.environ.get("GITHUB_TOKEN", "")
      REPO = """{{ inputs.repository }}"""
      INCLUDE_PRE = """{{ inputs.include_prereleases }}""" == "true"

      def gh_get(url):
          headers = {"Accept": "application/vnd.github+json", "User-Agent": "Kestra-Release-Radar"}
          if TOKEN:
              headers["Authorization"] = f"Bearer {TOKEN}"
          for attempt in range(3):
              try:
                  with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=30) as r:
                      return json.loads(r.read().decode())
              except Exception as e:
                  logger.warning(f"GET attempt {attempt + 1} failed: {e}")
                  time.sleep(2 ** attempt * 2)
          return None

      try:
          seen_raw = open("seen.json").read().strip()
          parsed = json.loads(seen_raw) if seen_raw else None
          seen_id = int(parsed) if isinstance(parsed, int) else 0
      except Exception:
          seen_id = 0

      releases = gh_get(f"https://api.github.com/repos/{REPO}/releases?per_page=10") or []
      if not isinstance(releases, list):
          releases = []
      candidates = [r for r in releases if isinstance(r, dict) and (INCLUDE_PRE or (not r.get("draft") and not r.get("prerelease")))]
      latest = candidates[0] if candidates else {}
      latest_id = int(latest.get("id") or 0)
      is_new = bool(latest_id) and latest_id != seen_id
      body = (latest.get("body") or "No release notes.").replace('"', "'")
      Kestra.outputs({
          "latest_id": latest_id,
          "is_new": is_new,
          "tag": latest.get("tag_name", "none"),
          "name": (latest.get("name") or latest.get("tag_name") or "none").replace('"', "'"),
          "url": latest.get("html_url", ""),
          "published_at": latest.get("published_at", ""),
          "notes": body[:600] + ("..." if len(body) > 600 else ""),
      })

  - id: maybe_notify
    type: io.kestra.plugin.core.flow.If
    description: Alert Slack only when a new release appeared and notifications are enabled.
    condition: "{{ inputs.notify_slack and outputs.check_release.vars.is_new }}"
    then:
      - id: notify_slack
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Post the new release with tag, link, and notes excerpt.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "New release {{ outputs.check_release.vars.tag }} in {{ inputs.repository }}",
            "blocks": [
              {"type": "header", "text": {"type": "plain_text", "text": "New release: {{ outputs.check_release.vars.tag }} 🚀"}},
              {"type": "section", "text": {"type": "mrkdwn", "text": "*<{{ outputs.check_release.vars.url }}|{{ outputs.check_release.vars.name }}>*\n*Repository:* `{{ inputs.repository }}`\n*Published:* {{ outputs.check_release.vars.published_at }}"}},
              {"type": "section", "text": {"type": "mrkdwn", "text": "{{ outputs.check_release.vars.notes }}"}},
              {"type": "context", "elements": [{"type": "mrkdwn", "text": "Execution: {{ execution.id }}"}]}
            ]
          }
    else:
      - id: log_noop
        type: io.kestra.plugin.core.log.Log
        description: Log when the latest release is already known.
        message: "No new release in {{ inputs.repository }} (latest seen: {{ outputs.check_release.vars.tag }})."

  - id: save_seen
    type: io.kestra.plugin.core.kv.Set
    description: Persist the latest release id for the next comparison.
    key: "github-release-radar-seen"
    kvType: NUMBER
    value: "{{ outputs.check_release.vars.latest_id }}"

errors:
  - id: alert_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alert Slack if the release check itself fails.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "🚨 Release radar failed for {{ inputs.repository }} in execution {{ execution.id }}. Check GITHUB_TOKEN / rate limits."
      }

outputs:
  - id: latest_tag
    type: STRING
    value: "{{ outputs.check_release.vars.tag }}"
  - id: is_new
    type: STRING
    value: "{{ outputs.check_release.vars.is_new }}"

extend:
  title: GitHub Release Radar
  shortDescription: Watch a repository's releases and post a Slack alert the moment a new version drops.
  metaTitle: GitHub Release Watcher to Slack with Kestra
  description: |
    Never miss a dependency rollout again. This blueprint polls the GitHub Releases API
    every 6 hours, remembers the latest release id in the KV store, and posts a rich
    Slack alert (tag, link, notes excerpt) only when a genuinely new release appears.

    ## How it works
    1. `load_seen` reads the last notified release id from the KV store.
    2. `check_release` (Python) fetches the 10 newest releases, skips drafts/prereleases
       unless enabled, and compares the newest id with the stored one.
    3. `maybe_notify` posts to Slack only on a new release; otherwise it logs.
    4. `save_seen` persists the newest id. The `errors` branch alerts Slack on API failures.

    ## Prerequisites
    - A GitHub repository with releases (or none, the flow logs cleanly).
    - A Slack incoming webhook URL.

    ### Secrets
    - `GITHUB_TOKEN`: GitHub PAT (`public_repo` scope for public repos). Optional but raises rate limits.
    - `SLACK_WEBHOOK_URL`: Slack incoming webhook for alerts.

    ## Quick start
    1. Add the secrets to your namespace.
    2. Set `repository` to `owner/repo` and Execute once to establish the baseline (first run alerts on the current latest).
    3. Leave the `every_6_hours` schedule on.

    ## How to extend
    - Filter by tag prefix (e.g. only `v2.*`) with an extra input.
    - Fan out to Discord or email alongside Slack.
    - Open a Jira/Linear ticket per release for upgrade tracking.

    ## Links
    - [GitHub Releases API](https://docs.github.com/en/rest/releases/releases)
    - Kestra Slack plugin docs: https://kestra.io/plugins/plugin-slack

    - This blueprint has been created by [yashspidey](https://github.com/yashspidey)
  tags:
    - Business
  subTags:
    - Monitoring & Alerting
    - Scheduling
  ee: false
  demo: false
  metaDescription: Poll GitHub Releases on a schedule and alert Slack only when a new version drops.
