id: razorpay-refund-stuck-sentinel
namespace: company.team
description: |
  Every morning, read recent refunds from the Razorpay API (read-only: no
  refund is created or changed) and classify them as HEALTHY, STUCK,
  FAILED or UNREACHABLE. Log quiet runs and alert Slack when a refund to
  a customer has failed or is still pending past the normal 5-7 working
  days, before the customer raises a chargeback or a complaint.

inputs:
  - id: lookback_days
    type: INT
    defaults: 21
    displayName: "Lookback Window (days)"
    description: "How many days of refunds to read on each run."
  - id: max_pending_days
    type: INT
    defaults: 8
    displayName: "Maximum Pending Days"
    description: "A refund still pending for longer than this is classified STUCK. Razorpay quotes 5-7 working days for normal refunds."

variables:
  api_base: https://api.razorpay.com/v1

triggers:
  - id: morning_check
    type: io.kestra.plugin.core.trigger.Schedule
    description: Check refunds every morning at 10:15 IST. Shipped disabled; enable it once the Razorpay key secrets are set and a manual run has been verified.
    cron: "45 4 * * *"
    disabled: true

tasks:
  - id: list_refunds
    type: io.kestra.plugin.core.http.Request
    description: Read up to 100 refunds created in the lookback window from the Razorpay Refunds API. This is a GET; no refund is created or changed.
    uri: "{{ vars.api_base }}/refunds?count=100&from={{ now() | dateAdd(-inputs.lookback_days, 'DAYS') | timestamp }}&to={{ now() | timestamp }}"
    method: GET
    options:
      auth:
        type: BASIC
        username: "{{ secret('RAZORPAY_KEY_ID') }}"
        password: "{{ secret('RAZORPAY_KEY_SECRET') }}"
      allowFailed: true
      timeout:
        connectTimeout: PT10S
        readIdleTimeout: PT30S
    retry:
      type: constant
      interval: PT10S
      maxAttempts: 3
    allowFailure: true

  - id: summarize_refunds
    type: io.kestra.plugin.core.debug.Return
    description: Count processed, pending and failed refunds, flag pending refunds older than the allowed delay, add up the amount customers are still waiting for (paise to rupees), name the oldest stuck refund, and classify in one jq query. A missing or non-200 response becomes UNREACHABLE.
    format: >-
      {{ (outputs.list_refunds.code is not defined or outputs.list_refunds.code != 200)
      ? '{"status":"UNREACHABLE","total":0,"processed":0,"pending":0,"failed":0,"stuck":0,"waiting_rupees":0,"oldest_stuck":"none"}'
      : (fromJson(outputs.list_refunds.body) | jq('
      .items as $r
      | ([$r[] | select(.status == "failed")]) as $f
      | ([$r[] | select(.status == "pending")]) as $p
      | ([$p[] | select(.created_at < ' ~ (now() | dateAdd(-inputs.max_pending_days, 'DAYS') | timestamp) ~ ')]) as $s
      | {total: ($r | length), processed: ([$r[] | select(.status == "processed")] | length), pending: ($p | length), failed: ($f | length), stuck: ($s | length),
      waiting_rupees: ((([$s[].amount] | add // 0) + ([$f[].amount] | add // 0)) / 100),
      oldest_stuck: (if ($s | length) == 0 then "none" else ($s | sort_by(.created_at) | first | (.id + " for payment " + .payment_id)) end),
      status: (if ($f | length) > 0 then "FAILED" elif ($s | length) > 0 then "STUCK" else "HEALTHY" end)}
      ') | first | toJson) }}

  - id: route_by_refund_state
    type: io.kestra.plugin.core.flow.Switch
    description: Route to a quiet log when refunds are moving normally, a Slack message when a refund is stuck past the allowed delay, or a Slack page when a refund failed or Razorpay could not be read.
    value: "{{ fromJson(outputs.summarize_refunds.value).status }}"
    cases:
      "HEALTHY":
        - id: log_healthy
          type: io.kestra.plugin.core.log.Log
          message: "Razorpay refunds healthy: {{ fromJson(outputs.summarize_refunds.value).processed }} processed and {{ fromJson(outputs.summarize_refunds.value).pending }} pending within {{ inputs.max_pending_days }} days, out of {{ fromJson(outputs.summarize_refunds.value).total }} in the last {{ inputs.lookback_days }} day(s)."
      "STUCK":
        - id: alert_stuck_refunds
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: Post a Slack message when at least one refund has been pending for longer than the allowed delay.
          url: "{{ secret('SLACK_WEBHOOK') }}"
          payload: |
            {
              "text": "Razorpay refunds STUCK: {{ fromJson(outputs.summarize_refunds.value).stuck }} refund(s) still pending after {{ inputs.max_pending_days }}+ days, Rs {{ fromJson(outputs.summarize_refunds.value).waiting_rupees }} customers are waiting for. Oldest: {{ fromJson(outputs.summarize_refunds.value).oldest_stuck }}. Share the ARN/RRN with the customer or raise it with Razorpay support. Execution {{ execution.id }}."
            }
      "FAILED":
        - id: alert_failed_refunds
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: Page Slack when a refund failed, which means the customer has not been paid back and someone must refund them another way.
          url: "{{ secret('SLACK_WEBHOOK') }}"
          payload: |
            {
              "text": "Razorpay refunds FAILED: {{ fromJson(outputs.summarize_refunds.value).failed }} refund(s) failed in the last {{ inputs.lookback_days }} day(s) (plus {{ fromJson(outputs.summarize_refunds.value).stuck }} stuck), Rs {{ fromJson(outputs.summarize_refunds.value).waiting_rupees }} not yet returned to customers. Refund them by another method today. Execution {{ execution.id }}."
            }
      "UNREACHABLE":
        - id: alert_unreachable_api
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: Page Slack when the Refunds API could not be read, indicating an outage, a network problem or invalid API keys.
          url: "{{ secret('SLACK_WEBHOOK') }}"
          payload: |
            {
              "text": "Razorpay refund sentinel UNREACHABLE: the Refunds API did not return a usable response (HTTP {{ outputs.list_refunds.code ?? 'no response' }}). Check the API keys and Razorpay status. Execution {{ execution.id }}."
            }
    defaults:
      - id: log_unclassified
        type: io.kestra.plugin.core.log.Log
        message: "Razorpay refund sentinel completed with an unexpected classification: {{ outputs.summarize_refunds.value }}."

  - id: log_audit_result
    type: io.kestra.plugin.core.log.Log
    description: Record one audit line for every run, whichever branch fired, so refund history stays queryable even if Slack delivery fails.
    message: "Razorpay refund sentinel audit: lookback_days={{ inputs.lookback_days }} http={{ outputs.list_refunds.code ?? 'n/a' }} summary={{ outputs.summarize_refunds.value }} execution={{ execution.id }}."

errors:
  - id: alert_flow_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alert Slack when the sentinel flow itself fails, so a broken check is never mistaken for refunds moving normally.
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "text": "Razorpay refund sentinel flow {{ flow.id }} FAILED (execution {{ execution.id }}). Refund status is now unknown; check the task logs and the Razorpay Dashboard."
      }

outputs:
  - id: status
    type: STRING
    value: "{{ fromJson(outputs.summarize_refunds.value).status }}"
  - id: waiting_rupees
    type: STRING
    value: "{{ fromJson(outputs.summarize_refunds.value).waiting_rupees }}"

extend:
  title: "Razorpay Refund Stuck Sentinel"
  shortDescription: Read recent Razorpay refunds every morning and alert Slack when a refund failed or is still pending past the normal 5-7 working days.
  metaTitle: Razorpay Refund Stuck Sentinel for Kestra
  metaDescription: "Read recent Razorpay refunds every morning, change nothing, and alert Slack when a customer refund has failed or is stuck past 5-7 working days."
  description: |
    When a business refunds a customer through Razorpay, a normal refund takes 5-7 working days to reach the customer's bank. Some refunds stay `pending` for much longer and some end up `failed`, for example on payments older than six months or closed bank accounts. Nobody on the business side is told: the customer calls support, posts a complaint, or raises a chargeback. This blueprint turns a scheduled, read-only call to the Razorpay Refunds API into a refund health gate: `io.kestra.plugin.core.http.Request` reads recent refunds, one jq query finds failed and stuck refunds and the amount customers are still waiting for, and the result routes to a quiet log or a Slack alert.

    ## How it works

    1. `list_refunds` (`io.kestra.plugin.core.http.Request`) calls `GET /v1/refunds` with `from` and `to` covering the last `lookback_days` (Unix seconds) and `count=100`, using HTTP basic auth with the Razorpay key ID and key secret. It is a read: no refund is created or changed. Retries cover short network blips, and `allowFailed` plus `allowFailure` keep an API error from aborting the flow so it can be reported instead.
    2. `summarize_refunds` (`io.kestra.plugin.core.debug.Return`) first guards for a missing or non-200 response (`UNREACHABLE`). Otherwise one jq query counts refunds by `status`, flags `pending` refunds created more than `max_pending_days` ago as stuck, adds up the amount of failed and stuck refunds (paise to rupees), and names the oldest stuck refund with its payment. Any `failed` refund is `FAILED`, any stuck one is `STUCK`, otherwise `HEALTHY`.
    3. `route_by_refund_state` (`io.kestra.plugin.core.flow.Switch`) branches on that classification: `HEALTHY` logs quietly, `STUCK` posts a Slack message, `FAILED` and `UNREACHABLE` page Slack. A `defaults` fallback logs anything unexpected.
    4. `log_audit_result` (`io.kestra.plugin.core.log.Log`) writes one audit line per run with the HTTP status and the full summary.
    5. The flow-level `errors` block pages Slack if the flow itself fails, and the `morning_check` trigger runs at 10:15 IST every day, shipped `disabled: true`.

    ## What you get

    - A daily, read-only refund check with no custom scripting and no extra plugin to install.
    - A `status` output (`HEALTHY` / `STUCK` / `FAILED` / `UNREACHABLE`) and a `waiting_rupees` output other flows can use.
    - Slack messages with the amount customers are waiting for and the oldest stuck refund, so support can reach the customer before they complain.
    - An audit line on every run, separate from Slack.

    ## Who it's for

    - Indian e-commerce and D2C businesses that refund cancelled and returned orders through Razorpay.
    - Support teams who field "where is my refund?" calls and want to know about a stuck refund first.
    - Finance teams who must re-pay customers by another method when a refund fails.

    ## Why orchestrate this with Kestra

    The Razorpay Dashboard shows each refund's status when someone looks it up, usually after the customer complains. Kestra turns a plain, read-only API call into a scheduled, typed classification with retries, a failure path and an execution history, and the Switch branch is ready to grow into real actions (opening a support ticket per stuck refund, emailing the customer the bank reference) without rewriting the check.

    ## Prerequisites

    - A Razorpay account. Test mode is free and uses the same API: generate test keys (they start with `rzp_test_`) in the Dashboard under Account & Settings > API Keys.
    - A Slack incoming webhook for the STUCK, FAILED, UNREACHABLE and flow-failure alerts.

    ### Secrets

    - `RAZORPAY_KEY_ID`: the Razorpay API key ID.
    - `RAZORPAY_KEY_SECRET`: the matching key secret.
    - `SLACK_WEBHOOK`: Slack incoming webhook used for every alert branch and the flow-failure alert.

    In Kestra OSS, secrets are supplied as environment variables prefixed `SECRET_` and base64-encoded, for example `SECRET_RAZORPAY_KEY_ID=$(echo -n 'rzp_test_xxxxxxxx' | base64)`, and read back with `{{ secret('RAZORPAY_KEY_ID') }}`. Use the Enterprise secrets backend for encryption at rest and access control.

    ## Quick start

    1. Switch the Razorpay Dashboard to Test Mode, make a few test payments and refund some of them.
    2. Add `RAZORPAY_KEY_ID`, `RAZORPAY_KEY_SECRET` and `SLACK_WEBHOOK` as secrets.
    3. Run the flow manually and compare `status` and the counts with the Refunds page in the Dashboard. To see the `STUCK` path, temporarily set `max_pending_days` to 0.
    4. Switch to live keys and enable `morning_check`.

    ## How to extend

    - Page through more than 100 refunds with the `skip` parameter.
    - For each stuck refund, read `acquirer_data` (ARN, RRN or UTR) and send it to the customer, who can trace the refund with their bank.
    - Open a support ticket per failed refund with a `ForEach` over the failed list.
    - Store the last status in a KV store and alert only when it changes.

    ## Inputs

    - `lookback_days`: type INT, default `21`.
    - `max_pending_days`: type INT, default `8`.

    ## Outputs

    - `status`: one of `HEALTHY`, `STUCK`, `FAILED`, `UNREACHABLE`.
    - `waiting_rupees`: amount of failed and stuck refunds customers are still waiting for, in rupees.
    - Example path: `{{ fromJson(outputs.summarize_refunds.value).oldest_stuck }}` for the oldest stuck refund.

    ## Links

    - [Razorpay Refunds API: fetch all refunds](https://razorpay.com/docs/api/refunds/fetch-all/)
    - [Razorpay API authentication](https://razorpay.com/docs/api/authentication/)
    - [Kestra HTTP Request task](https://kestra.io/plugins/core/tasks/http/io.kestra.plugin.core.http.request)
    - [Kestra Slack plugin](https://kestra.io/plugins/plugin-slack)

    ## Pitfalls

    - `count` is capped at 100; a business issuing more than 100 refunds in `lookback_days` needs paging with `skip`.
    - `max_pending_days` counts calendar days while Razorpay quotes working days; around long weekends and bank holidays a refund can look stuck a day early.
    - Instant refunds normally complete in minutes, so a pending instant refund is already unusual; consider a lower limit if you mostly use instant refunds.
    - This flow only reads; it never creates, retries or changes a refund.
  tags:
    - Business
    - Data
  subTags:
    - Monitoring & Alerting
  ee: false
  demo: false
