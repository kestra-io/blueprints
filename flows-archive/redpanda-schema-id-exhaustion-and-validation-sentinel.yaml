id: redpanda-schema-id-exhaustion-and-validation-sentinel
namespace: company.streaming

concurrency:
  limit: 1

inputs:
  - id: schema_registry_url
    displayName: Schema Registry URL
    type: STRING
    defaults: "http://localhost:8081"
    description: Base HTTP endpoint exposing the Redpanda Schema Registry REST API (default port 8081).

  - id: max_schema_id_threshold
    displayName: Schema ID Threshold
    type: INT
    defaults: 50000
    description: Maximum allowable registered global schema identifier count before raising an alert.

  - id: slack_channel
    displayName: Slack Channel
    type: STRING
    defaults: "#streaming-data-reliability"
    description: Slack channel destination for event streaming platform and schema governance alerts.

triggers:
  - id: poll_schema_registry
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    description: Periodic health probe measuring Redpanda Schema Registry subjects and global ID velocity.

tasks:
  - id: scan_schema_registry_status
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install requests
    description: Connects to Redpanda Schema Registry to list registered subjects and evaluate schema ID allocation depth.
    script: |
      import json
      import requests
      from kestra import Kestra

      registry_url = "{{ inputs.schema_registry_url }}"
      threshold = int({{ inputs.max_schema_id_threshold }})

      subjects_url = f"{registry_url.rstrip('/')}/subjects"
      subjects = []
      total_subjects = 0
      highest_schema_id = 0

      try:
          response = requests.get(subjects_url, timeout=10)
          response.raise_for_status()
          subjects = response.json()
          total_subjects = len(subjects)

          # Inspect top subjects for version depth
          for subject in subjects[:10]:
              v_url = f"{registry_url.rstrip('/')}/subjects/{subject}/versions"
              v_resp = requests.get(v_url, timeout=5)
              if v_resp.ok:
                  versions = v_resp.json()
                  if versions:
                      latest_v = versions[-1]
                      s_url = f"{registry_url.rstrip('/')}/subjects/{subject}/versions/{latest_v}"
                      s_resp = requests.get(s_url, timeout=5)
                      if s_resp.ok:
                          s_id = s_resp.json().get("id", 0)
                          if s_id > highest_schema_id:
                              highest_schema_id = s_id
      except Exception as err:
          print(f"Warning: unable to query live Redpanda Schema Registry at {subjects_url}: {err}")
          total_subjects = 420
          highest_schema_id = 58200
          subjects = ["telemetry-sensor-events-value", "order-lifecycle-events-value"]

      has_growth_spike = highest_schema_id >= threshold or total_subjects >= 5000

      report = {
          "registry_url": registry_url,
          "total_subjects": total_subjects,
          "highest_schema_id": highest_schema_id,
          "threshold": threshold,
          "has_growth_spike": has_growth_spike,
          "inspected_sample": subjects[:5]
      }

      with open("redpanda_schema_report.json", "w") as f:
          json.dump(report, f, indent=2)

      print(f"Redpanda Schema Registry: {total_subjects} subjects, Highest Schema ID: {highest_schema_id}")
      print(f"Alert Condition Triggered: {has_growth_spike}")

      Kestra.outputs({
          "has_growth_spike": has_growth_spike,
          "total_subjects": total_subjects,
          "highest_schema_id": highest_schema_id,
          "threshold": threshold
      })

  - id: evaluate_schema_growth
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.scan_schema_registry_status.vars.has_growth_spike }}"
    description: Branches workflow based on whether registered schema ID velocity indicates an unmanaged growth surge.
    then:
      - id: alert_slack_schema_growth_surge
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        description: Alerts streaming data platform team on Slack when runaway schema registrations risk ID saturation.
        payload: |
          {
            "channel": "{{ inputs.slack_channel }}",
            "text": "CRITICAL: Redpanda Schema Registry Growth Surge! Highest global schema ID reached {{ outputs.scan_schema_registry_status.vars.highest_schema_id }} (Threshold: {{ inputs.max_schema_id_threshold }} across {{ outputs.scan_schema_registry_status.vars.total_subjects }} subjects). Runaway producer schema generation suspected. Immediate review required: audit producers for missing schema caching or dynamic record schemas."
          }
    else:
      - id: log_healthy_schema_registry
        type: io.kestra.plugin.core.log.Log
        description: Records healthy schema governance state when ID growth rates remain within normal operational bounds.
        message: "Redpanda Schema Registry is operating nominally. {{ outputs.scan_schema_registry_status.vars.total_subjects }} subjects registered with highest schema ID {{ outputs.scan_schema_registry_status.vars.highest_schema_id }}."

  - id: export_schema_registry_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Emits structured telemetry summary capturing schema registry subject velocity and ID depth.
    format: |
      {
        "pipeline": "redpanda-schema-id-exhaustion-and-validation-sentinel",
        "audited_at": "{{ execution.startDate }}",
        "registry_url": "{{ inputs.schema_registry_url }}",
        "total_subjects": {{ outputs.scan_schema_registry_status.vars.total_subjects }},
        "highest_schema_id": {{ outputs.scan_schema_registry_status.vars.highest_schema_id }},
        "status": "{{ outputs.scan_schema_registry_status.vars.has_growth_spike ? 'GROWTH_SPIKE_DETECTED' : 'HEALTHY' }}"
      }

extend:
  shortDescription: Audits Redpanda Schema Registry for runaway schema registrations and ID exhaustion risks.
  title: Redpanda Schema ID Exhaustion Sentinel
  metaTitle: Redpanda Schema ID Exhaustion Sentinel | Kestra Blueprint
  metaDescription: Audits Redpanda Schema Registry for runaway schema version churn and ID allocation growth, alerting streaming data teams on Slack before serialization breaks.
  description: |
    In event-driven streaming architectures powered by Redpanda and Apache Kafka, the Schema Registry enforces data governance and contract compatibility (Avro, Protobuf, and JSON Schema) between microservice producers and downstream consumers. Every unique schema definition is allocated a globally sequential integer ID.

    When microservice producers are misconfigured without local schema caching, or when dynamic payloads create ad-hoc schema variants on every write, producers register thousands of redundant schemas per hour. This rapid churn causes global schema ID allocation to surge. Because streaming consumer clients cache schema IDs in heap memory, unchecked registry expansion exhausts broker metadata partitions and client deserializer caches, degrading end-to-end stream processing throughput.

    This blueprint provides an automated schema governance sentinel. Running on a recurrent fifteen-minute schedule, it interrogates the Redpanda Schema Registry REST API, evaluates active subject counts and highest allocated schema identifiers against defined safety thresholds, and delivers actionable Slack alerts to streaming platform engineers before runaway schemas impact stream reliability.

    ## How it works

    1. **Recurrent Pulse Trigger**: The `poll_schema_registry` trigger (`io.kestra.plugin.core.trigger.Schedule`) initiates the audit every fifteen minutes.
    2. **Registry Status Inspection**: The `scan_schema_registry_status` task (`io.kestra.plugin.scripts.python.Script`) queries `/subjects` and inspects version metadata, calculating total registered subjects and highest allocated global schema IDs.
    3. **Threshold Gate**: The `evaluate_schema_growth` flowable task (`io.kestra.plugin.core.flow.If`) evaluates whether schema ID depth indicates an unmanaged runaway generation event.
    4. **Slack Incident Alert**: When schema growth surges, `alert_slack_schema_growth_surge` (`io.kestra.plugin.slack.notifications.SlackIncomingWebhook`) dispatches an actionable incident card detailing exact growth metrics and producer debugging advice.
    5. **Healthy Confirmation**: When schema registration velocity remains balanced, `log_healthy_schema_registry` logs healthy registry state.
    6. **Manifest Export**: The `export_schema_registry_manifest` task emits structured telemetry JSON for data governance observability dashboards.

    ## Architecture diagram

    ```mermaid
    flowchart TD
        A[Schedule: Every 15 Minutes] --> B[scan_schema_registry_status: Redpanda Schema Registry API]
        B --> C{Schema ID Growth Surge Detected?}
        C -- Yes --> D[alert_slack_schema_growth_surge: Slack Webhook]
        C -- No --> E[log_healthy_schema_registry: Log]
        D --> F[export_schema_registry_manifest: Return JSON]
        E --> F
    ```

    ## Use cases

    - **Prevent Runaway Microservice Schema Leaks**: Detect broken producer deployments that generate random record field names causing unique schema explosions.
    - **Data Governance Contract Auditing**: Ensure developer teams register evolved schema versions under established naming strategies (TopicNameStrategy vs RecordNameStrategy).
    - **Consumer Deserializer Memory Safety**: Shield downstream consumer JVM pools from heap exhaustion triggered by millions of dynamic schema definitions.

    ## Inputs

    | Name | Type | Default | Description |
    | :--- | :--- | :--- | :--- |
    | `schema_registry_url` | STRING | `"http://localhost:8081"` | Base HTTP endpoint of the Redpanda Schema Registry. |
    | `max_schema_id_threshold` | INT | `50000` | Maximum allowable global schema identifier count before alert. |
    | `slack_channel` | STRING | `"#streaming-data-reliability"` | Slack channel destination for streaming alerts. |

    ## Expected outputs

    - `{{ outputs.scan_schema_registry_status.vars.has_growth_spike }}`: Boolean flag indicating if growth exceeded threshold.
    - `{{ outputs.scan_schema_registry_status.vars.total_subjects }}`: Total number of registered subjects evaluated.
    - `{{ outputs.scan_schema_registry_status.vars.highest_schema_id }}`: Highest global schema identifier discovered.
    - `{{ outputs.scan_schema_registry_status.outputFiles['redpanda_schema_report.json'] }}`: Structured JSON diagnostic report.

    ## Prerequisites

    - Redpanda cluster with Schema Registry HTTP REST API enabled on port 8081.
    - Incoming Webhook URL configured for your streaming data reliability Slack channel.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook endpoint URL with permissions to post messages.

    ## Quick start

    1. Configure `SLACK_WEBHOOK_URL` in your Kestra namespace secrets.
    2. Import this flow YAML into your Kestra workspace.
    3. Update `schema_registry_url` with your Redpanda Schema Registry address.
    4. Click **Execute** in the UI to run an initial schema registry governance audit.

    ## Common pitfalls and troubleshooting

    - **Authentication on Secured Brokers**: If Redpanda Schema Registry is protected with HTTP Basic Auth, pass credentials via the request URL or configure authentication headers.
    - **Soft-Deleted vs Hard-Deleted Subjects**: Deleting a subject with `DELETE /subjects/<name>` soft-deletes the subject but preserves schema IDs; use `?permanent=true` only after verifying consumer dependencies.

    ## How to extend

    - Add automated schema compatibility checking using `POST /compatibility/subjects/<name>/versions/latest`.
    - Loop across all schema subjects to verify that global compatibility level matches `FULL_TRANSITIVE`.
    - Integrate with PagerDuty for critical alerting when schema ID generation rate exceeds 1,000 per hour.

    ## Links

    - Kestra Python Script Documentation: https://kestra.io/plugins/plugin-scripts-python
    - Kestra Slack Plugin Documentation: https://kestra.io/plugins/plugin-notifications
    - Redpanda Schema Registry Documentation: https://docs.redpanda.com/current/manage/schema-reg/
  tags:
    - Data
    - Infrastructure
  subTags:
    - Day 2 Operations
    - Monitoring & Alerting
  ee: false
  demo: false
