id: snowflake-stale-stage-and-pipe-execution-sentinel
namespace: company.ops

inputs:
  - id: account
    type: STRING
    description: Snowflake account identifier.
  - id: username
    type: STRING
    description: Snowflake user name.
  - id: warehouse
    type: STRING
    defaults: "COMPUTE_WH"
    description: Snowflake warehouse for executing the audit query.

tasks:
  - id: query_pipe_status
    type: io.kestra.plugin.jdbc.snowflake.Query
    url: "jdbc:snowflake://{{ inputs.account }}.snowflakecomputing.com/?warehouse={{ inputs.warehouse }}&db=SNOWFLAKE&schema=ACCOUNT_USAGE"
    username: "{{ inputs.username }}"
    password: "{{ secret('SNOWFLAKE_PASSWORD') }}"
    sql: |
      SELECT PIPE_NAME, SUM(CREDITS_USED) as total_credits, MAX(START_TIME) as last_ingest
      FROM SNOWFLAKE.ACCOUNT_USAGE.PIPE_USAGE_HISTORY
      WHERE START_TIME >= DATEADD('hour', -24, CURRENT_TIMESTAMP())
      GROUP BY PIPE_NAME
      HAVING MAX(START_TIME) <= DATEADD('hour', -6, CURRENT_TIMESTAMP())
      LIMIT 1;
    fetchOne: true

  - id: evaluate_pipe_health
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.query_pipe_status.row.PIPE_NAME is defined and outputs.query_pipe_status.row.PIPE_NAME != null }}"
    then:
      - id: notify_data_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#snowflake-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 Snowflake Snowpipe Ingestion Lag Alert",
                "text": "Snowpipe `{{ outputs.query_pipe_status.row.PIPE_NAME }}` has not processed files in over 6 hours (Last Active: *{{ outputs.query_pipe_status.row.LAST_INGEST }}*)! Impact: Continuous streaming ingestion is stalled, causing cloud stage S3/GCS files to pile up and downstream analytics tables to become critically stale.",
                "footer": "Kestra Data Pipeline Sentinel • Snowflake"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#snowflake-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ Snowflake Snowpipe Execution Stagnation and Lag Sentinel Pipeline Failure",
            "text": "Failed to query Snowflake PIPE_USAGE_HISTORY. Verify account and credentials.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  title: Snowflake Snowpipe Execution Stagnation and Lag Sentinel
  shortDescription: Audits Snowflake PIPE_USAGE_HISTORY to detect stalled continuous data ingestion pipelines and load failures.
  description: |
    ## How it works
    This workflow executes an analytical query against `SNOWFLAKE.ACCOUNT_USAGE.PIPE_USAGE_HISTORY` to detect Snowpipes that have stopped processing incoming files from cloud stages (S3, Azure Blob, or GCS). When cloud event notifications (SNS/SQS) fail, IAM trust relationships expire, or malformed file schemas cause load rejections, continuous ingestion freezes without throwing database errors. Slack is notified when pipes linger in an inactive state.

    ## What you get
    - Immediate detection of silent Snowpipe ingestion stalls.
    - Prevents downstream dashboard data staleness and SLA violations.
    - Clear visibility into last activity timestamp and pipe names.

    ## Who it's for
    - Data Engineers and Analytics Architects maintaining real-time Snowflake lakehouse ingestion.
    - SREs responsible for event-driven data streaming reliability.

    ## Why orchestrate this with Kestra
    - **Native Snowflake JDBC Query**: Direct, secure SQL execution via native Kestra tasks.
    - **Continuous Ingestion Validation**: Run hourly verification without external polling servers.
    - **Automated Incident Triage**: Direct notifications to on-call data platform engineers.

    ## Prerequisites
    - Snowflake account with Snowpipe continuous ingestion enabled.
    - Secrets `SNOWFLAKE_PASSWORD` and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import the blueprint.
    2. Set Snowflake account, username, and warehouse.
    3. Run the workflow to inspect Snowpipe ingestion activity.

    ## How to extend
    - Execute `SYSTEM$PIPE_STATUS('<pipe_name>')` for detailed channel execution diagnostics.
    - Trigger automated pipe refresh via `ALTER PIPE <name> REFRESH` upon confirmed stall.

    ## Links
    - [Snowflake Snowpipe Monitoring Documentation](https://docs.snowflake.com/en/user-guide/data-load-snowpipe-troubleshooting)
    - [Kestra Snowflake Plugin](https://kestra.io/plugins/plugin-jdbc-snowflake/io.kestra.plugin.jdbc.snowflake.query)
  tags:
    - Data
    - Cloud
  ee: false
  demo: false
