id: goodwill-impairment-test-ias36
namespace: company.team

description: |
  Annual goodwill impairment test (IAS 36 / ASC 350): value in use of each cash-generating
  unit from a five-year cash flow forecast and a terminal value, fair value less costs of
  disposal from a peer multiple, recoverable amount as the higher of the two, impairment
  allocated to goodwill first and then pro rata to the other assets, the equivalent pre-tax
  discount rate, break-even discount rate, growth and EBITDA, the reasonably-possible-change
  disclosure, a back-test of last year's budget against actuals, the IAS 36.134 note, and a
  year lock that never reverses a goodwill impairment.

inputs:
  - id: test_year
    type: INT
    displayName: Test year
    description: The test is performed at the year end, on the budget approved for the next five years.
    defaults: 2025

  - id: scenario
    type: SELECT
    displayName: Demo scenario
    description: >
      BASE: every CGU passes, Industrial with little headroom. DOWNTURN: Retail US misses its
      budget and the new budget is cut, which impairs its goodwill. ISSUES: goodwill in the
      ledger that is not allocated to any CGU, a terminal growth rate above the discount rate,
      and a CGU with a missing forecast year, which must stop the test.
    values:
      - BASE
      - DOWNTURN
      - ISSUES
    defaults: BASE

  - id: wacc_shift
    type: FLOAT
    displayName: Reasonably possible change, discount rate (points)
    defaults: 0.01

  - id: growth_shift
    type: FLOAT
    displayName: Reasonably possible change, terminal growth (points)
    defaults: 0.01

  - id: ebitda_shift
    type: FLOAT
    displayName: Reasonably possible change, EBITDA (share)
    defaults: 0.10

  - id: approved_by
    type: STRING
    displayName: Approved by
    description: Needed when a CGU is impaired, has less than 10% headroom, or missed last year's budget by more than 10%.
    defaults: ""

variables:
  lock_key: goodwill_impairment
  pack_dir: "impairment/{{ inputs.test_year }}"

concurrency:
  limit: 1

tasks:
  - id: year_control
    type: io.kestra.plugin.core.output.OutputValues
    values:
      lock: "{{ kv(vars.lock_key, errorOnMissing=false) ?? {'year': 0, 'cumulative_impairment': {}, 'budget_next_year': {}} | toJson }}"
      last_year: "{{ (kv(vars.lock_key, errorOnMissing=false) ?? {'year': 0}) | jq('.year') | first }}"

  - id: year_gate
    type: io.kestra.plugin.core.flow.If
    condition: "{{ (outputs.year_control.values.last_year | number) != 0 and inputs.test_year != (outputs.year_control.values.last_year | number) + 1 }}"
    then:
      - id: year_refused
        type: io.kestra.plugin.core.execution.Fail
        errorMessage: >-
          {{ inputs.test_year <= (outputs.year_control.values.last_year | number)
             ? 'The ' ~ inputs.test_year ~ ' test is already final (last: ' ~ outputs.year_control.values.last_year ~ ').'
             : 'Perform the ' ~ ((outputs.year_control.values.last_year | number) + 1) ~ ' test first.' }}

  - id: test
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: >
      One DuckDB session: CGUs, carrying amounts, actuals and the approved forecast (demo
      generator or your planning system), value in use on a grid of discount rates, fair
      value less costs of disposal, impairment and its allocation, pre-tax rate, break-even
      points, sensitivities, the budget back-test, checks, the note and the journal.
    outputFiles:
      - results
      - cashflows
      - sensitivity
      - journal
      - blockers
    fetchType: FETCH_ONE
    sql: |
      SET VARIABLE y = {{ inputs.test_year }};

      -- =======================================================================
      -- Cash-generating units. Replace with your CGU register, the discount
      -- rates from your valuation team and the peer multiples.
      -- =======================================================================
      CREATE TABLE cgus (cgu VARCHAR, name VARCHAR, goodwill_initial DOUBLE, wacc DOUBLE, terminal_growth DOUBLE, tax_rate DOUBLE,
                         capex_pct DOUBLE, dep_pct DOUBLE, nwc_pct DOUBLE, ev_ebitda DOUBLE, disposal_cost_pct DOUBLE, other_assets_floor_pct DOUBLE);
      INSERT INTO cgus VALUES
        ('RETAIL-EU', 'Retail Europe', 18e6, 0.085, 0.020, 0.25, 0.30, 0.28, 0.6, 7.5, 0.02, 0.60),
        ('RETAIL-US', 'Retail North America', 25e6, 0.090, 0.020, 0.21, 0.30, 0.28, 0.6, 7.0, 0.02, 0.60),
        ('INDUSTRIAL', 'Industrial Solutions', 30e6, 0.085, 0.015, 0.25, 0.22, 0.20, 0.8, 6.0, 0.02, 0.70),
        ('SOFTWARE', 'Software', 40e6, 0.110, {% if inputs.scenario == 'ISSUES' %}0.115{% else %}0.030{% endif %}, 0.25, 0.10, 0.08, 0.2, 12.0, 0.03, 0.50);

      -- Other net operating assets of each CGU at each year end (intangibles, PPE,
      -- working capital), from the fixed asset register and the balance sheet.
      CREATE TABLE other_assets (cgu VARCHAR, year INT, carrying DOUBLE);
      INSERT INTO other_assets SELECT cgu, y, base * (1 + 0.03 * (y - 2024)) FROM
        (VALUES ('RETAIL-EU', 40e6), ('RETAIL-US', 30e6), ('INDUSTRIAL', 46e6), ('SOFTWARE', 15e6)) v(cgu, base), range(2024, 2028) t(y);

      -- Goodwill in the general ledger. Replace with your trial balance.
      CREATE TABLE gl_goodwill AS SELECT {% if inputs.scenario == 'ISSUES' %}120e6{% else %}113e6{% endif %}
        - coalesce((SELECT sum(value::DOUBLE) FROM json_each('{{ outputs.year_control.values.lock | jq(".cumulative_impairment") | first | toJson }}')), 0) AS balance;

      -- Actual EBITDA by CGU and year.
      CREATE TABLE actuals (cgu VARCHAR, year INT, ebitda DOUBLE);
      INSERT INTO actuals VALUES
        ('RETAIL-EU', 2024, 8.6e6), ('RETAIL-EU', 2025, 9.0e6), ('RETAIL-EU', 2026, 9.3e6),
        ('RETAIL-US', 2024, 7.2e6), ('RETAIL-US', 2025, 7.5e6), ('RETAIL-US', 2026, {% if inputs.scenario == 'DOWNTURN' %}5.4e6{% else %}7.8e6{% endif %}),
        ('INDUSTRIAL', 2024, 9.6e6), ('INDUSTRIAL', 2025, 9.4e6), ('INDUSTRIAL', 2026, 9.7e6),
        ('SOFTWARE', 2024, 8.9e6), ('SOFTWARE', 2025, 10.0e6), ('SOFTWARE', 2026, 11.3e6),
        -- In the downturn, Retail US recovers part of the way in 2027.
        ('RETAIL-EU', 2027, 9.6e6), ('RETAIL-US', 2027, {% if inputs.scenario == 'DOWNTURN' %}6.6e6{% else %}8.1e6{% endif %}),
        ('INDUSTRIAL', 2027, 9.9e6), ('SOFTWARE', 2027, 12.6e6);

      -- The approved five-year forecast: EBITDA growth by forecast year.
      CREATE TABLE forecast_growth (cgu VARCHAR, t INT, growth DOUBLE);
      INSERT INTO forecast_growth
      SELECT cgu, t, CASE cgu
        WHEN 'RETAIL-EU' THEN 0.035 WHEN 'INDUSTRIAL' THEN 0.025
        WHEN 'RETAIL-US' THEN {% if inputs.scenario == 'DOWNTURN' %}CASE WHEN {{ inputs.test_year }} = 2026 THEN [-0.05, 0.0, 0.02, 0.02, 0.02][t] WHEN {{ inputs.test_year }} >= 2027 THEN 0.04 ELSE 0.04 END{% else %}0.04{% endif %}
        ELSE [0.12, 0.10, 0.08, 0.06, 0.05][t] END
      FROM cgus, range(1, 6) r(t);
      {% if inputs.scenario == 'ISSUES' %}
      DELETE FROM forecast_growth WHERE cgu = 'INDUSTRIAL' AND t = 4;
      {% endif %}

      -- =======================================================================
      -- Free cash flows of the forecast: EBITDA - tax on (EBITDA - tax depreciation)
      -- - capex - increase in working capital. The terminal year grows the last
      -- forecast year by g.
      -- =======================================================================
      CREATE TABLE ebitda_path AS
      WITH RECURSIVE p(cgu, t, ebitda) AS (
        SELECT cgu, 0, ebitda FROM actuals WHERE year = getvariable('y')
        UNION ALL
        SELECT p.cgu, p.t + 1, p.ebitda * (1 + coalesce(f.growth, (SELECT terminal_growth FROM cgus c WHERE c.cgu = p.cgu)))
        FROM p LEFT JOIN forecast_growth f ON f.cgu = p.cgu AND f.t = p.t + 1
        WHERE p.t < 6
      ) SELECT * FROM p;

      CREATE TABLE cashflows AS
      SELECT e.cgu, e.t, e.ebitda, c.tax_rate * (e.ebitda - c.dep_pct * e.ebitda) AS tax,
             c.capex_pct * e.ebitda AS capex, c.nwc_pct * (e.ebitda - prev.ebitda) * 0.1 AS nwc_increase,
             e.ebitda - c.tax_rate * (e.ebitda - c.dep_pct * e.ebitda) - c.capex_pct * e.ebitda - c.nwc_pct * (e.ebitda - prev.ebitda) * 0.1 AS fcf,
             e.ebitda - c.capex_pct * e.ebitda - c.nwc_pct * (e.ebitda - prev.ebitda) * 0.1 AS fcf_pre_tax,
             -- The part of the cash flow that scales with EBITDA, for the EBITDA break-even.
             e.ebitda * (1 - c.tax_rate * (1 - c.dep_pct) - c.capex_pct) - c.nwc_pct * (e.ebitda - prev.ebitda) * 0.1 AS fcf_linear
      FROM ebitda_path e JOIN ebitda_path prev ON prev.cgu = e.cgu AND prev.t = e.t - 1 JOIN cgus c ON c.cgu = e.cgu
      WHERE e.t BETWEEN 1 AND 6;

      -- Value in use for any discount rate, growth rate and EBITDA scale. Cash flows
      -- are discounted at the end of each year; t = 6 is the terminal year.
      CREATE MACRO viu(c, r, g, k) AS (
        SELECT sum(k * fcf / pow(1 + r, t)) FILTER (WHERE t <= 5)
             + max(k * fcf) FILTER (WHERE t = 6) / (1 + (SELECT terminal_growth FROM cgus WHERE cgu = c)) * (1 + g) / (r - g) / pow(1 + r, 5)
        FROM cashflows WHERE cgu = c);

      -- =======================================================================
      -- Carrying amount, recoverable amount, impairment.
      -- =======================================================================
      CREATE TABLE carrying AS
      SELECT c.cgu, c.name, c.goodwill_initial - coalesce(li.value::DOUBLE, 0) AS goodwill, oa.carrying AS other_assets,
             c.goodwill_initial - coalesce(li.value::DOUBLE, 0) + oa.carrying AS carrying, c.other_assets_floor_pct * oa.carrying AS other_assets_floor
      FROM cgus c JOIN other_assets oa ON oa.cgu = c.cgu AND oa.year = getvariable('y')
      LEFT JOIN (SELECT key, value FROM json_each('{{ outputs.year_control.values.lock | jq(".cumulative_impairment") | first | toJson }}')) li ON li.key = c.cgu;

      CREATE TABLE results AS
      SELECT k.*, c.wacc, c.terminal_growth,
             viu(c.cgu, c.wacc, c.terminal_growth, 1) AS value_in_use,
             a.ebitda * c.ev_ebitda * (1 - c.disposal_cost_pct) AS fvlcd
      FROM carrying k JOIN cgus c USING (cgu) JOIN actuals a ON a.cgu = c.cgu AND a.year = getvariable('y');
      ALTER TABLE results ADD COLUMN recoverable DOUBLE; ALTER TABLE results ADD COLUMN basis VARCHAR;
      ALTER TABLE results ADD COLUMN impairment DOUBLE; ALTER TABLE results ADD COLUMN impairment_goodwill DOUBLE;
      ALTER TABLE results ADD COLUMN impairment_other DOUBLE; ALTER TABLE results ADD COLUMN unallocated DOUBLE;
      UPDATE results SET recoverable = greatest(value_in_use, fvlcd), basis = CASE WHEN value_in_use >= fvlcd THEN 'Value in use' ELSE 'Fair value less costs of disposal' END;
      UPDATE results SET impairment = greatest(carrying - recoverable, 0);
      -- Goodwill first, then the other assets, never below their own recoverable floor (IAS 36.104-105).
      UPDATE results SET impairment_goodwill = least(impairment, goodwill);
      UPDATE results SET impairment_other = least(impairment - impairment_goodwill, other_assets - other_assets_floor);
      UPDATE results SET unallocated = impairment - impairment_goodwill - impairment_other;

      -- =======================================================================
      -- Break-even points and sensitivities. The discount rate and the growth
      -- rate are found on a 0.01% grid; value in use is linear in EBITDA scale.
      -- =======================================================================
      CREATE TABLE grid AS SELECT 0.0001 * i AS rate FROM range(1, 6001) t(i);
      CREATE TABLE breakeven AS
      SELECT r.cgu,
             (SELECT max(g.rate) FROM grid g WHERE g.rate > r.terminal_growth + 0.0005 AND viu(r.cgu, g.rate, r.terminal_growth, 1) >= r.carrying) AS breakeven_wacc,
             (SELECT min(g.rate - 0.10) FROM grid g WHERE g.rate - 0.10 < r.wacc - 0.0005 AND viu(r.cgu, r.wacc, g.rate - 0.10, 1) >= r.carrying) AS breakeven_growth,
             1 - r.carrying / viu(r.cgu, r.wacc, r.terminal_growth, 1) AS breakeven_ebitda_drop,
             viu(r.cgu, r.wacc + {{ inputs.wacc_shift }}, r.terminal_growth, 1) AS viu_wacc_up,
             viu(r.cgu, r.wacc, r.terminal_growth - {{ inputs.growth_shift }}, 1) AS viu_growth_down,
             viu(r.cgu, r.wacc, r.terminal_growth, 1 - {{ inputs.ebitda_shift }}) AS viu_ebitda_down
      FROM results r WHERE r.terminal_growth < r.wacc;

      -- Pre-tax discount rate: the rate that gives the same value in use on pre-tax
      -- cash flows (IAS 36.55, BCZ85).
      CREATE TABLE pre_tax AS
      SELECT r.cgu, (SELECT min(g.rate) FROM grid g WHERE g.rate > r.terminal_growth + 0.0005 AND
               (SELECT sum(fcf_pre_tax / pow(1 + g.rate, t)) FILTER (WHERE t <= 5)
                     + max(fcf_pre_tax) FILTER (WHERE t = 6) / (g.rate - r.terminal_growth) / pow(1 + g.rate, 5)
                FROM cashflows cf WHERE cf.cgu = r.cgu) <= r.value_in_use) AS pre_tax_rate
      FROM results r WHERE r.terminal_growth < r.wacc;

      -- =======================================================================
      -- Budget back-test (IAS 36.34): last year's first forecast year against
      -- this year's actual EBITDA.
      -- =======================================================================
      CREATE TABLE backtest AS
      SELECT a.cgu, b.value::DOUBLE AS budget, a.ebitda AS actual, a.ebitda / b.value::DOUBLE - 1 AS variance
      FROM actuals a JOIN json_each('{{ outputs.year_control.values.lock | jq(".budget_next_year") | first | toJson }}') b ON b.key = a.cgu
      WHERE a.year = getvariable('y');

      -- =======================================================================
      -- Checks.
      -- =======================================================================
      CREATE TABLE blockers AS
      SELECT 'GOODWILL_NOT_ALLOCATED' AS code, 'group' AS ref,
             'Ledger goodwill ' || format('{:,.0f}', g.balance) || ', allocated to CGUs ' || format('{:,.0f}', (SELECT sum(goodwill) FROM carrying)) AS detail
        FROM gl_goodwill g WHERE abs(g.balance - (SELECT sum(goodwill) FROM carrying)) >= 1
      UNION ALL SELECT 'GROWTH_NOT_BELOW_DISCOUNT_RATE', cgu, 'Terminal growth ' || terminal_growth || ' is not below the discount rate ' || wacc || ': the terminal value is undefined'
        FROM cgus WHERE terminal_growth >= wacc
      UNION ALL SELECT 'FORECAST_INCOMPLETE', cgu, 'Forecast years present: ' || count(*) || ' of 5' FROM forecast_growth GROUP BY cgu HAVING count(*) < 5
      UNION ALL SELECT 'MISSING_ACTUALS', cgu, 'No actual EBITDA for ' || getvariable('y') FROM cgus WHERE cgu NOT IN (SELECT cgu FROM actuals WHERE year = getvariable('y'));

      -- =======================================================================
      -- Outputs.
      -- =======================================================================
      CREATE MACRO m(x) AS format('{:,.1f}', x::DOUBLE / 1e6) || 'M';
      CREATE TABLE out AS
      SELECT r.cgu, r.name, r.goodwill, r.other_assets, r.carrying, r.value_in_use, r.fvlcd, r.recoverable, r.basis,
             r.recoverable - r.carrying AS headroom, (r.recoverable - r.carrying) / r.carrying AS headroom_pct,
             r.impairment, r.impairment_goodwill, r.impairment_other, r.unallocated, r.wacc, p.pre_tax_rate, r.terminal_growth,
             b.breakeven_wacc, b.breakeven_growth, b.breakeven_ebitda_drop,
             b.viu_wacc_up - r.carrying AS headroom_wacc_up, b.viu_growth_down - r.carrying AS headroom_growth_down, b.viu_ebitda_down - r.carrying AS headroom_ebitda_down,
             bt.budget AS last_year_budget, bt.actual AS actual_ebitda, bt.variance AS budget_variance,
             (SELECT ebitda FROM ebitda_path ep WHERE ep.cgu = r.cgu AND ep.t = 1) AS budget_next_year
      FROM results r LEFT JOIN breakeven b USING (cgu) LEFT JOIN pre_tax p USING (cgu) LEFT JOIN backtest bt USING (cgu);

      CREATE TABLE journal AS
      SELECT row_number() OVER () AS line, make_date(getvariable('y'), 12, 31) AS posting_date, * FROM (
        SELECT cgu, '6900' AS account, 'Impairment of goodwill' AS account_name, round(impairment_goodwill, 2) AS debit, 0.0 AS credit FROM out WHERE impairment_goodwill > 0
        UNION ALL SELECT cgu, '1400', 'Goodwill', 0.0, round(impairment_goodwill, 2) FROM out WHERE impairment_goodwill > 0
        UNION ALL SELECT cgu, '6901', 'Impairment of other assets', round(impairment_other, 2), 0.0 FROM out WHERE impairment_other > 0
        UNION ALL SELECT cgu, '1599', 'Accumulated impairment of other assets', 0.0, round(impairment_other, 2) FROM out WHERE impairment_other > 0
      );

      COPY (SELECT cgu, name, round(goodwill) AS goodwill, round(other_assets) AS other_assets, round(carrying) AS carrying, round(value_in_use) AS value_in_use,
                   round(fvlcd) AS fvlcd, round(recoverable) AS recoverable, basis, round(headroom) AS headroom, round(100 * headroom_pct, 1) AS headroom_pct,
                   round(impairment) AS impairment, round(impairment_goodwill) AS impairment_goodwill, round(impairment_other) AS impairment_other,
                   wacc, round(pre_tax_rate, 4) AS pre_tax_rate, terminal_growth, round(budget_next_year) AS budget_next_year FROM out ORDER BY cgu)
        TO '{{ outputFiles.results }}' (HEADER, DELIMITER ',');
      COPY (SELECT cgu, t, round(ebitda) AS ebitda, round(tax) AS tax, round(capex) AS capex, round(nwc_increase) AS nwc_increase, round(fcf) AS fcf, round(fcf_pre_tax) AS fcf_pre_tax
            FROM cashflows ORDER BY cgu, t) TO '{{ outputFiles.cashflows }}' (HEADER, DELIMITER ',');
      COPY (SELECT cgu, round(breakeven_wacc, 4) AS breakeven_wacc, round(breakeven_growth, 4) AS breakeven_growth, round(100 * breakeven_ebitda_drop, 1) AS breakeven_ebitda_drop_pct,
                   round(headroom_wacc_up) AS headroom_wacc_up, round(headroom_growth_down) AS headroom_growth_down, round(headroom_ebitda_down) AS headroom_ebitda_down,
                   round(last_year_budget) AS last_year_budget, round(actual_ebitda) AS actual_ebitda, round(100 * budget_variance, 1) AS budget_variance_pct FROM out ORDER BY cgu)
        TO '{{ outputFiles.sensitivity }}' (HEADER, DELIMITER ',');
      COPY journal TO '{{ outputFiles.journal }}' (HEADER, DELIMITER ',');
      COPY blockers TO '{{ outputFiles.blockers }}' (HEADER, DELIMITER ',');

      SELECT
        (SELECT string_agg(cgu || ' carrying ' || m(carrying) || ', recoverable ' || m(recoverable) || ' (' || CASE WHEN basis = 'Value in use' THEN 'VIU' ELSE 'FVLCD' END || '), headroom '
                           || round(100 * headroom_pct, 1) || '%', '; ' ORDER BY cgu) FROM out) AS results,
        (SELECT round(sum(impairment), 2)::DOUBLE FROM out) AS impairment,
        (SELECT m(sum(impairment)) FROM out) AS impairment_fmt,
        (SELECT coalesce(string_agg(cgu || ' ' || m(impairment) || ' (goodwill ' || m(impairment_goodwill) || ', other assets ' || m(impairment_other) || ')', '; '), '') FROM out WHERE impairment > 0) AS impairment_detail,
        (SELECT coalesce(string_agg(cgu || ': WACC ' || round(100 * wacc, 2) || '% vs break-even ' || round(100 * breakeven_wacc, 2) || '%, growth ' || round(100 * terminal_growth, 2) || '% vs '
                                    || CASE WHEN breakeven_growth < -0.0995 THEN 'below -10' ELSE round(100 * breakeven_growth, 2)::VARCHAR END || '%, EBITDA -' || round(100 * breakeven_ebitda_drop, 1) || '%', '; ' ORDER BY cgu), '') FROM out WHERE impairment = 0) AS breakevens,
        (SELECT coalesce(string_agg(cgu, ', ' ORDER BY cgu), '') FROM out WHERE impairment = 0 AND least(headroom_wacc_up, headroom_growth_down, headroom_ebitda_down) < 0) AS sensitive_cgus,
        (SELECT coalesce(string_agg(cgu || ' ' || round(100 * pre_tax_rate, 2) || '%', ', ' ORDER BY cgu), '') FROM out) AS pre_tax_rates,
        (SELECT coalesce(string_agg(cgu || ' actual ' || m(actual_ebitda) || ' vs budget ' || m(last_year_budget) || ' (' || round(100 * budget_variance, 1) || '%)', '; ' ORDER BY cgu), 'no prior-year budget')
           FROM out WHERE last_year_budget IS NOT NULL) AS backtest,
        (SELECT count(*) FROM out WHERE budget_variance < -0.10)::INT AS budget_misses,
        (SELECT count(*) FROM out WHERE impairment = 0 AND headroom_pct < 0.10)::INT AS low_headroom,
        (SELECT json_group_object(cgu, round(budget_next_year))::VARCHAR FROM out) AS budget_next_year,
        (SELECT json_group_object(cgu, round(impairment_goodwill, 2))::VARCHAR FROM out WHERE impairment_goodwill > 0) AS new_goodwill_impairment,
        (SELECT count(*) FROM blockers)::INT AS blockers,
        (SELECT coalesce(string_agg(code || ' ' || ref || ': ' || detail, '; ' ORDER BY code, ref), '') FROM blockers) AS blocker_detail,
        -- The note (IAS 36.134).
        '# Impairment test of goodwill, ' || getvariable('y') || chr(10) || chr(10) ||
        'Goodwill is tested annually at 31 December for each cash-generating unit. The recoverable amount is the higher of value in use and fair value less costs of disposal. ' ||
        'Value in use is based on the five-year forecast approved by the board, extrapolated at a terminal growth rate, and discounted at a post-tax rate; the equivalent pre-tax rate is disclosed.' || chr(10) || chr(10) ||
        '| CGU | Goodwill | Carrying amount | Recoverable amount | Basis | Post-tax rate | Pre-tax rate | Terminal growth | Headroom | Impairment |' || chr(10) ||
        '|---|---:|---:|---:|---|---:|---:|---:|---:|---:|' || chr(10) ||
        (SELECT string_agg('| ' || name || ' | ' || m(goodwill) || ' | ' || m(carrying) || ' | ' || m(recoverable) || ' | ' || basis || ' | ' || round(100 * wacc, 1) || '% | '
                           || coalesce(round(100 * pre_tax_rate, 1) || '%', 'n/a') || ' | ' || round(100 * terminal_growth, 1) || '% | ' || m(headroom) || ' | ' || m(impairment) || ' |', chr(10) ORDER BY cgu) FROM out) || chr(10) || chr(10) ||
        '## Sensitivity (IAS 36.134(f))' || chr(10) || chr(10) ||
        '| CGU | Break-even post-tax rate | Break-even terminal growth | Break-even EBITDA decline | Headroom with rate +' || round(100 * {{ inputs.wacc_shift }}, 1) || 'pt | growth -'
          || round(100 * {{ inputs.growth_shift }}, 1) || 'pt | EBITDA -' || round(100 * {{ inputs.ebitda_shift }}, 0) || '% |' || chr(10) ||
        '|---|---:|---:|---:|---:|---:|---:|' || chr(10) ||
        (SELECT string_agg('| ' || name || ' | ' || coalesce(round(100 * breakeven_wacc, 2) || '%', 'n/a') || ' | ' || coalesce(CASE WHEN breakeven_growth < -0.0995 THEN 'below -10' ELSE round(100 * breakeven_growth, 2)::VARCHAR END || '%', 'n/a') || ' | '
                           || round(100 * breakeven_ebitda_drop, 1) || '% | ' || m(headroom_wacc_up) || ' | ' || m(headroom_growth_down) || ' | ' || m(headroom_ebitda_down) || ' |', chr(10) ORDER BY cgu)
           FROM out WHERE impairment = 0) || chr(10) || chr(10) ||
        coalesce('A reasonably possible change in a key assumption would cause the carrying amount to exceed the recoverable amount for: ' ||
          (SELECT string_agg(name, ', ' ORDER BY cgu) FROM out WHERE impairment = 0 AND least(headroom_wacc_up, headroom_growth_down, headroom_ebitda_down) < 0) || '.' || chr(10), '') ||
        coalesce(chr(10) || 'Impairment recognised: ' || (SELECT string_agg(name || ' ' || m(impairment) || ', of which goodwill ' || m(impairment_goodwill), '; ') FROM out WHERE impairment > 0)
          || '. Goodwill impairment is not reversed in later periods (IAS 36.124).' || chr(10), '') AS note;

  - id: result
    type: io.kestra.plugin.core.output.OutputValues
    values:
      r: "{{ (outputs.test.outputs | last).row | toJson }}"

  - id: log_test
    type: io.kestra.plugin.core.log.Log
    message: |
      Goodwill impairment test {{ inputs.test_year }} ({{ inputs.scenario }}).
      {{ outputs.result.values.r | jq('"\(.results)."') | first }}
      {{ outputs.result.values.r | jq('"Impairment \(.impairment_fmt) \(.impairment_detail). Pre-tax rates: \(.pre_tax_rates)."') | first }}
      {{ outputs.result.values.r | jq('"Break-even: \(.breakevens). Sensitive to a reasonably possible change: \(.sensitive_cgus)."') | first }}
      {{ outputs.result.values.r | jq('"Budget back-test: \(.backtest). Blockers: \(.blockers). \(.blocker_detail)"') | first }}

  - id: write_note
    type: io.kestra.plugin.core.storage.Write
    extension: .md
    content: "{{ outputs.result.values.r | jq('.note') | first }}"

  - id: evidence
    type: io.kestra.plugin.core.namespace.UploadFiles
    namespace: "{{ flow.namespace }}"
    filesMap:
      "{{ render(vars.pack_dir) }}/impairment-note.md": "{{ outputs.write_note.uri }}"
      "{{ render(vars.pack_dir) }}/cgu-results.csv": "{{ outputs.test.outputFiles.results }}"
      "{{ render(vars.pack_dir) }}/cash-flows.csv": "{{ outputs.test.outputFiles.cashflows }}"
      "{{ render(vars.pack_dir) }}/sensitivity.csv": "{{ outputs.test.outputFiles.sensitivity }}"
      "{{ render(vars.pack_dir) }}/journal.csv": "{{ outputs.test.outputFiles.journal }}"
      "{{ render(vars.pack_dir) }}/blockers.csv": "{{ outputs.test.outputFiles.blockers }}"

  - id: decide
    type: io.kestra.plugin.core.flow.Switch
    value: >-
      {%- set r = outputs.result.values.r -%}
      {%- if (r | jq('.blockers > 0') | first) -%}BLOCKED
      {%- elseif (r | jq('.impairment > 0 or .low_headroom > 0 or .budget_misses > 0') | first) and inputs.approved_by == '' -%}NEEDS_APPROVAL
      {%- else -%}FINAL{%- endif -%}
    cases:
      FINAL:
        - id: lock_year
          type: io.kestra.plugin.core.kv.Set
          description: Cumulative goodwill impairment per CGU (never reversed) and the first forecast year, which next year's test compares with actuals.
          key: "{{ vars.lock_key }}"
          kvType: JSON
          value: >-
            {{ {'old': fromJson(outputs.year_control.values.lock), 'r': fromJson(outputs.result.values.r), 'y': inputs.test_year, 'by': inputs.approved_by}
               | jq('{year: .y, approved_by: .by,
                      cumulative_impairment: (reduce ((.r.new_goodwill_impairment // "{}") | fromjson | to_entries[]) as $e (.old.cumulative_impairment; .[$e.key] = ((.[$e.key] // 0) + $e.value))),
                      budget_next_year: (.r.budget_next_year | fromjson)}') | first | toJson }}

        - id: log_final
          type: io.kestra.plugin.core.log.Log
          message: "The {{ inputs.test_year }} impairment test is final: impairment {{ outputs.result.values.r | jq('.impairment_fmt') | first }}. Note in {{ render(vars.pack_dir) }}."

      NEEDS_APPROVAL:
        - id: approval_required
          type: io.kestra.plugin.core.execution.Fail
          errorMessage: >-
            Review needed: impairment {{ outputs.result.values.r | jq('.impairment_fmt') | first }} {{ outputs.result.values.r | jq('.impairment_detail') | first }};
            CGUs with less than 10% headroom: {{ outputs.result.values.r | jq('.low_headroom') | first }};
            budget misses above 10%: {{ outputs.result.values.r | jq('.budget_misses') | first }} ({{ outputs.result.values.r | jq('.backtest') | first }}).
            Read {{ render(vars.pack_dir) }}/impairment-note.md and run again with approved_by.

    defaults:
      - id: blocked
        type: io.kestra.plugin.core.execution.Fail
        errorMessage: "The {{ inputs.test_year }} impairment test cannot be performed: {{ outputs.result.values.r | jq('.blocker_detail') | first }}"

extend:
  title: Run the annual goodwill impairment test with value in use, break-even sensitivities and the IAS 36 note
  metaTitle: Goodwill impairment test (IAS 36, ASC 350) with DCF and sensitivities in Kestra
  shortDescription: Compute value in use and fair value less costs of disposal for each CGU, allocate any impairment, derive the pre-tax rate and break-even assumptions, back-test last year's budget and write the note.
  metaDescription: Annual goodwill impairment test in Kestra and DuckDB. DCF value in use, FVLCD, impairment allocation, pre-tax rate, break-evens and IAS 36 note.
  description: |
    Every company with goodwill tests it for impairment once a year, and auditors and regulators review the test closely. The arithmetic is a discounted cash flow. The parts that cause findings are elsewhere:
    - a pre-tax discount rate disclosed without being derived,
    - sensitivities that don't say how far an assumption can move before the goodwill is impaired,
    - budgets that have missed for years and are still used unchanged,
    - an impairment allocated to the wrong assets, or reversed later.

    This flow runs the test for every cash-generating unit (CGU), produces the disclosure, and locks the year.

    It runs with no setup and no network. The demo group has four CGUs and 113M of goodwill:
    - Retail Europe, with comfortable headroom;
    - Retail North America, which misses its budget in the `DOWNTURN` scenario;
    - Industrial, with thin headroom;
    - Software, valued higher by its peer multiple than by its cash flows.


    ## The test, per CGU

    | Step | Rule |
    |---|---|
    | Value in use | Five-year free cash flow forecast (EBITDA - tax on EBITDA less tax depreciation - capex - working capital increase), plus a terminal value growing the last year at g, discounted at the post-tax rate. The forecast starts from the year's actual EBITDA |
    | Fair value less costs of disposal | Actual EBITDA × the peer EV/EBITDA multiple - costs of disposal |
    | Recoverable amount | The higher of the two (IAS 36.18) |
    | Impairment | Carrying amount (goodwill + other net operating assets) - recoverable amount, allocated to goodwill first, then to the other assets, never below their own floor (IAS 36.104-105) |
    | No reversal | Goodwill impairments are accumulated in KV and deducted from every later year's carrying amount (IAS 36.124) |

    ## What makes the test defensible

    - **Pre-tax discount rate**: the rate that gives the same value in use on pre-tax cash flows (IAS 36.55, BCZ85). It is found on a 0.01% grid and disclosed.
    - **Break-even points**: the post-tax rate and the terminal growth rate at which headroom reaches zero (on the same grid), and the EBITDA decline that would remove it. Value in use is linear in EBITDA, so that last one is exact.
    - **Reasonably possible change** (IAS 36.134(f)): headroom recomputed with the rate +1 point, growth -1 point and EBITDA -10% (all inputs). Every CGU that would be impaired by one of these is named in the note.
    - **Budget back-test** (IAS 36.34): each year the first forecast year is stored, and next year it is compared with actual EBITDA. A miss of more than 10% needs approval, because an optimistic budget makes the whole test unreliable.

    ## Controls

    - **Blocked:**
      - goodwill in the ledger that is not allocated to CGUs,
      - terminal growth at or above the discount rate,
      - a forecast missing a year,
      - missing actuals.
    - **Needs approval:** an impairment, a CGU with less than 10% headroom, or a budget miss above 10%.
    - **Year order:** years are final once, in order.

    ## How it works

    1. `year_control` and `year_gate` enforce the year order and load the cumulative impairments and last year's budget.
    2. `test` (`io.kestra.plugin.jdbc.duckdb.Queries`):
       - builds the CGUs, the carrying amounts, the actuals and the forecast, then the free cash flows;
       - computes value in use as a macro that can be evaluated at any rate, growth and EBITDA scale;
       - derives fair value, the impairment allocation, the pre-tax rate, the break-evens, the sensitivities and the back-test;
       - writes the checks, the journal and the note.
    3. `log_test` prints the test. `write_note` (`io.kestra.plugin.core.storage.Write`) and `evidence` store `impairment-note.md`, `cgu-results.csv`, `cash-flows.csv`, `sensitivity.csv`, `journal.csv` and `blockers.csv`.
    4. `decide` (`io.kestra.plugin.core.flow.Switch`):
       - `FINAL`: accumulates the goodwill impairment and stores the next-year budget.
       - Otherwise the run fails with the reason.

    ## Tested end to end

    On Kestra 2.0.3 OSS, in this order.

    | Run | Inputs | Result |
    |---|---|---|
    | 1 | 2025 | All CGUs pass. Industrial headroom is 6.4%: break-even rate 8.94% against 8.50%, break-even growth 0.91% against 1.5%, break-even EBITDA decline 6.0%. It is named in the note as sensitive, because each reasonably possible change removes its headroom. Software is valued at fair value (116.4M against 55.5M). Stops for approval, then final |
    | 2 | 2026 `DOWNTURN` | Retail US EBITDA 5.4M against a 7.8M budget (-30.8%), and the new budget is cut. Recoverable amount 39.4M against carrying 56.8M: a 17.4M impairment, all on goodwill. Approval, then final |
    | 3 | 2026 again | Refused |
    | 4 | 2027 `DOWNTURN` | Retail US recovers (6.6M actual against a 5.1M budget): headroom 42.2%, but its goodwill stays at 7.6M. The impairment is not reversed |
    | 5 | 2027 `ISSUES` | Blocked: 7M of ledger goodwill not allocated, Software growth 11.5% above its 11% rate, Industrial forecast missing year 4 |

    For the 2027 test I recomputed value in use, the break-even discount rate and the pre-tax rate of every CGU independently in Python, finding the rates by bisection to machine precision:
    - value in use matched to the euro (83,364,316; 57,344,086; 86,721,818; 135,782,699);
    - the break-even rates matched to 0.01% (10.77%, 11.91%, 9.07%, 21.85%);
    - the pre-tax rates matched within the grid step, rounded up to the next 0.01%.

    ## Problems found while testing

    - **The first calibration impaired the base case.** Industrial's capex at 45% of EBITDA left almost no free cash flow, so the base case was a 43M impairment. The demo now uses realistic capex and asset levels, so the base case shows the useful situation: a pass with thin headroom.
    - **A break-even reported as -4.99%.** That was the floor of the search grid, not a real break-even. The grid now goes to -10%, and a break-even below it is reported as "below -10%".

    ## Inputs

    | Input | Default | Purpose |
    |---|---|---|
    | `test_year` | `2025` | Year of the test |
    | `scenario` | `BASE` | `BASE`, `DOWNTURN` or `ISSUES` |
    | `wacc_shift`, `growth_shift`, `ebitda_shift` | `0.01`, `0.01`, `0.10` | Reasonably possible changes |
    | `approved_by` | empty | The CFO or audit committee |

    ## Use it with your data

    - Replace `cgus` (rates from your valuation adviser, peer multiples), `other_assets`, `gl_goodwill`, `actuals` and `forecast_growth` with your CGU register, balance sheet, results and the board-approved plan.
    - Replace the generic free cash flow formula if your plan already gives free cash flow by year.

    ## Things to know

    - Cash flows are discounted at the end of each year. Mid-year discounting raises value in use slightly. Switch to `t - 0.5` in the macro if that is your policy.
    - Corporate assets, the allocation of goodwill to groups of CGUs, and impairment of other assets reversing later (allowed for assets other than goodwill) are not modelled.
    - Reset by deleting the KV key `goodwill_impairment`.

    ## Links

    - IAS 36 Impairment of Assets: https://www.ifrs.org/issued-standards/list-of-standards/ias-36-impairment-of-assets/
    - DuckDB macros: https://duckdb.org/docs/sql/statements/create_macro
    - DuckDB plugin: https://kestra.io/plugins/plugin-jdbc-duckdb

    This blueprint was created by [zkasuran](https://github.com/zkasuran).
  tags:
    - Business
    - Data
  subTags:
