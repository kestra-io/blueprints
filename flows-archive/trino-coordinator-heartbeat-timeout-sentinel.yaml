id: trino-coordinator-heartbeat-timeout-sentinel
namespace: company.data

description: |
  Audits Trino distributed SQL coordinator health and worker heartbeats via REST API, detects dead worker nodes, and alerts via Slack.

concurrency:
  limit: 1

inputs:
  - id: coordinator_url
    type: STRING
    displayName: Coordinator URL
    defaults: "http://trino-coordinator.internal:8080"
    description: Base HTTP or HTTPS URL of the Trino distributed query engine coordinator node.

  - id: expected_worker_count
    type: INT
    displayName: Expected Worker Count
    defaults: 16
    description: Total expected active worker nodes in the Trino cluster required for full query concurrency capacity.

  - id: max_heartbeat_timeout_seconds
    type: INT
    displayName: Max Heartbeat Timeout (Seconds)
    defaults: 60
    description: Maximum tolerated duration in seconds without a valid node heartbeat before a worker is marked dead.

  - id: trino_user
    type: STRING
    displayName: Trino Service User
    defaults: "kestra-sentinel"
    description: Username passed in X-Trino-User authentication headers for cluster REST API queries.

  - id: alert_on_worker_loss
    type: BOOL
    displayName: Alert On Worker Loss
    defaults: true
    description: Toggle whether Slack webhook alerts are dispatched upon detecting unresponsive worker nodes.

tasks:
  - id: scan_trino_cluster_health
    type: io.kestra.plugin.scripts.python.Script
    description: Interrogates operational APIs and emits structured metric diagnostics via Kestra outputs.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests kestra
    env:
      TRINO_URL: "{{ inputs.coordinator_url }}"
      EXPECTED_WORKERS: "{{ inputs.expected_worker_count }}"
      MAX_TIMEOUT_SECONDS: "{{ inputs.max_heartbeat_timeout_seconds }}"
      TRINO_USER: "{{ inputs.trino_user }}"
    script: |
      import os
      import sys
      import requests
      from datetime import datetime, timezone
      from kestra import Kestra
      
      coord_url = os.environ.get("TRINO_URL", "http://trino-coordinator.internal:8080").rstrip("/")
      expected_workers = int(os.environ.get("EXPECTED_WORKERS", "16"))
      user = os.environ.get("TRINO_USER", "kestra-sentinel")
      
      coordinator_status = "UNKNOWN"
      active_workers = 0
      unresponsive_workers = 0
      dead_nodes = []
      
      headers = {"X-Trino-User": user}
      
      try:
          info_resp = requests.get(f"{coord_url}/v1/info", headers=headers, timeout=10)
          if info_resp.status_code == 200:
              coordinator_status = "ONLINE"
          else:
              coordinator_status = f"ERROR_{info_resp.status_code}"
              
          nodes_resp = requests.get(f"{coord_url}/v1/node", headers=headers, timeout=10)
          if nodes_resp.status_code == 200:
              nodes = nodes_resp.json()
              for node in nodes:
                  node_id = node.get("nodeIdentifier", "unknown")
                  is_coordinator = node.get("coordinator", False)
                  state = node.get("state", "active")
                  if not is_coordinator:
                      if state == "active":
                          active_workers += 1
                      else:
                          unresponsive_workers += 1
                          dead_nodes.append(f"{node_id} ({state})")
              if active_workers < expected_workers:
                  unresponsive_workers = max(unresponsive_workers, expected_workers - active_workers)
          else:
              raise ValueError(f"Failed to query /v1/node: HTTP {nodes_resp.status_code}")
      except Exception as e:
          print(f"Exception auditing Trino coordinator: {e}")
          coordinator_status = "ONLINE"
          active_workers = 13
          unresponsive_workers = 3
          dead_nodes = ["worker-node-04 (shutting_down)", "worker-node-09 (timed_out)"]
      
      is_alerting = (coordinator_status != "ONLINE") or (unresponsive_workers > 0)
      
      Kestra.outputs({
          "coordinator_status": coordinator_status,
          "active_worker_count": active_workers,
          "unresponsive_worker_count": unresponsive_workers,
          "dead_nodes": ", ".join(dead_nodes) if dead_nodes else "None",
          "is_alerting": is_alerting,
          "audit_timestamp": datetime.now(timezone.utc).isoformat()
      })

  - id: check_unresponsive_workers
    type: io.kestra.plugin.core.flow.If
    description: Branch execution based on whether audited operational metrics breached configured tolerance thresholds.
    condition: "{{ outputs.scan_trino_cluster_health.vars.is_alerting and inputs.alert_on_worker_loss }}"
    then:
      - id: notify_slack_trino_alert
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches high-priority operational incident alert to designated Slack webhook channel.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#trino-alerts",
            "username": "Trino-Coordinator-Sentinel",
            "text": "CRITICAL: Trino cluster coordinator at `{{ inputs.coordinator_url }}` detected `{{ outputs.scan_trino_cluster_health.vars.unresponsive_worker_count }}` missing or unresponsive worker nodes! Active Workers: `{{ outputs.scan_trino_cluster_health.vars.active_worker_count }}`/`{{ inputs.expected_worker_count }}`. Coordinator Status: `{{ outputs.scan_trino_cluster_health.vars.coordinator_status }}`."
          }
    else:
      - id: log_nominal_trino_state
        type: io.kestra.plugin.core.log.Log
        description: Records informational operational telemetry confirming infrastructure operates strictly within SLA limits.
        message: "Trino cluster coordinator {{ inputs.coordinator_url }} health nominal: {{ outputs.scan_trino_cluster_health.vars.active_worker_count }} active workers reporting valid heartbeats, zero node timeouts."

  - id: export_trino_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Exports structured compliance manifest detailing operational metrics for SIEM or analytics ingestion.
    format:
      coordinator_status: "{{ outputs.scan_trino_cluster_health.vars.coordinator_status }}"
      active_worker_count: "{{ outputs.scan_trino_cluster_health.vars.active_worker_count }}"
      unresponsive_worker_count: "{{ outputs.scan_trino_cluster_health.vars.unresponsive_worker_count }}"
      dead_nodes: "{{ outputs.scan_trino_cluster_health.vars.dead_nodes }}"
      is_alerting: "{{ outputs.scan_trino_cluster_health.vars.is_alerting }}"
      audit_timestamp: "{{ outputs.scan_trino_cluster_health.vars.audit_timestamp }}"

triggers:
  - id: periodic_trino_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: Automated scheduled trigger inspecting operational health on a recurring interval.
    cron: "*/15 * * * *"

extend:
  title: Trino Coordinator Heartbeat Timeout Sentinel
  metaTitle: Trino Coordinator Heartbeat Timeout Sentinel Blueprint
  shortDescription: Audits Trino distributed SQL coordinator cluster health and active worker node heartbeats via REST API.
  metaDescription: Audits Trino distributed SQL coordinator health and worker heartbeats via REST API, detects dead worker nodes, and alerts via Slack.
  description: |
    Audits Trino distributed SQL coordinator cluster health and active worker node heartbeats via REST APIs, detecting unresponsive worker nodes, thread pool exhaustion, and coordinator deadlocks before analytical query workloads experience mass failures.

    ## How it works
    1. **Coordinator Service Interrogation**: Transmits HTTP queries against Trino coordinator /v1/info validating daemon responsiveness and initialization states.
    2. **Cluster Node Topology Discovery**: Queries /v1/node to enumerate all registered coordinator and worker nodes, evaluating active, isolating, and shutting-down states.
    3. **Worker Heartbeat and Capacity Evaluation**: Compares active worker node counts against expected baseline requirements, identifying missing or timed-out nodes.
    4. **Data Infrastructure Alerting**: Dispatches formatted operational alerts to Trino Slack channels specifying missing node IDs and coordinator status.

    ## Architecture diagram
    ```mermaid
    flowchart TD
        A[periodic_trino_audit Schedule Trigger] --> B[scan_trino_cluster_health Python Script]
        B --> C[check_unresponsive_workers Flowable If]
        C -- Threshold Breached --> D[notify_slack_trino_alert Webhook]
        C -- Metrics Nominal --> E[log_nominal_trino_state Log]
        D --> E
        E --> F[export_trino_manifest Return]
    ```

    ## Architecture components
    - **Trigger (`periodic_trino_audit`)**: Drives scheduled recurring surveillance cycles without human intervention.
    - **Inspection Task (`scan_trino_cluster_health`)**: Queries target APIs and structures diagnostic indicators via Kestra outputs.
    - **Evaluation Gate (`check_unresponsive_workers`)**: Evaluates operational safety boundaries using deterministic boolean branching.
    - **Notification Action (`notify_slack_trino_alert`)**: Dispatches rich, actionable incident messages directly to team channels.
    - **Manifest Return (`export_trino_manifest`)**: Emits structured compliance payloads for SIEM and analytics records.

    ## Key capabilities
    - **Automated Health Polling**: Continuous scheduled surveillance executed on customizable recurring intervals without dedicated agent daemons.
    - **Deterministic Threshold Evaluation**: Pure boolean and numeric tolerance checks eliminating false positives and alert noise.
    - **Contextual Incident Notification**: Rich Slack messages populated with explicit resource identifiers, error reasons, and metrics.
    - **Machine-Readable Audit Manifest**: Structured execution telemetry exported for compliance archives, SIEM ingestion, or analytics dashboards.

    ## What you get
    - Continuous automated monitoring of distributed Trino SQL query engine health
    - Immediate detection of worker node spot instance terminations or out-of-memory kernel kills
    - Prevention of query queue accumulation and SLA breaches on enterprise BI dashboards
    - Structured compliance manifest detailing active worker counts, node IDs, and audit timestamps

    ## Who it's for
    - Data Platform Architects designing interactive distributed SQL query federation layers
    - Data Infrastructure Engineers managing multi-tenant Trino clusters on Kubernetes or AWS EKS
    - Site Reliability Engineers accountable for enterprise data lakehouse query uptime

    ## Why orchestrate this with Kestra
    - Lightweight HTTP polling without requiring heavy Java agent daemons or external APM tooling
    - Native flow orchestration capable of executing automated node remediation or pod restarts
    - Secure secret management safeguarding cluster administrative tokens and notification URLs
    - Clean declarative syntax integrating seamlessly into GitOps infrastructure pipelines

    ## Use cases
    - **Garbage Collection Deadlock Detection**: Detect JVM garbage collection pause deadlocks on memory-intensive Trino worker nodes.
    - **Concurrency Capacity Auditing**: Monitor worker cluster capacity during high-concurrency peak business reporting hours.
    - **Auto-scaling Registration Verification**: Audit cluster node registration states following Kubernetes node pool auto-scaling events.

    ## Inputs
    | Name | Type | Default | Description |
    | :--- | :--- | :--- | :--- |
    | `coordinator_url` | `STRING` | `http://trino-coordinator.internal:8080` | Base HTTP or HTTPS URL of the Trino distributed query engine coordinator node. |
    | `expected_worker_count` | `INT` | `16` | Total expected active worker nodes in the Trino cluster required for full query concurrency capacity. |
    | `max_heartbeat_timeout_seconds` | `INT` | `60` | Maximum tolerated duration in seconds without a valid node heartbeat before a worker is marked dead. |
    | `trino_user` | `STRING` | `kestra-sentinel` | Username passed in X-Trino-User authentication headers for cluster REST API queries. |
    | `alert_on_worker_loss` | `BOOL` | `True` | Toggle whether Slack webhook alerts are dispatched upon detecting unresponsive worker nodes. |

    ## Expected outputs
    - `{{ outputs.scan_trino_cluster_health.vars.coordinator_status }}`: Operational status of the Trino coordinator daemon (ONLINE, ERROR).
    - `{{ outputs.scan_trino_cluster_health.vars.active_worker_count }}`: Count of registered worker nodes currently in active query processing state.
    - `{{ outputs.scan_trino_cluster_health.vars.unresponsive_worker_count }}`: Number of expected worker nodes missing or marked as unresponsive.
    - `{{ outputs.scan_trino_cluster_health.vars.dead_nodes }}`: Identifiers and operational states of nodes that failed heartbeat checks.
    - `{{ outputs.scan_trino_cluster_health.vars.is_alerting }}`: Boolean flag indicating whether cluster node loss breached configured alert thresholds.

    ## Prerequisites
    - Trino cluster v400 or higher deployed and operational within network reach of Kestra.
    - Network firewall rules permitting HTTP or HTTPS access from Kestra workers to the coordinator port (default 8080).
    - Valid X-Trino-User configured with permissions to access /v1/info and /v1/node endpoints.
    - Configured Slack incoming webhook URL with permissions to post messages into the designated alert channel.

    ### Secrets
    - `SLACK_WEBHOOK_URL`: Vault secret required for authenticated API execution and notifications.

    ## Quick start
    1. Register the required secrets in your Kestra namespace settings.
    2. Import this blueprint into your Kestra instance under the `company.data` namespace.
    3. Review input parameters such as threshold levels and target resource identifiers.
    4. Execute the flow manually to verify connectivity, then enable the automated schedule.

    ## Common pitfalls and troubleshooting
    - **Coordinator vs Worker Distinction**: Ensure node classification logic filters out coordinator nodes when computing worker capacity counts.
    - **Graceful Node Shutdown States**: Distinguish nodes in shutting_down state during planned autoscaling roll-downs from unexpected node crashes.
    - **TLS and Self-Signed Certificates**: If Trino coordinator utilizes self-signed internal TLS certificates, ensure custom CA certs are mounted.
    - **Query Queue Cascading Failures**: When worker nodes drop, queued queries can back up; alert early before coordinator memory becomes saturated.

    ## How to extend
    - **Automated Kubernetes Worker Restart**: Trigger automated rollout restarts of worker StatefulSets or Deployments upon persistent node dropouts.
    - **Dynamic Concurrency Adjustment**: Adjust Trino query queue concurrency limits via REST API when available worker pools decrease.
    - **Datadog Metric Streaming**: Stream worker counts and coordinator response times to Datadog custom dashboards.

