id: github-repository-missing-security-md-sentinel
namespace: company.security

inputs:
  - id: github_org
    type: STRING
    description: GitHub organization name.
  - id: github_repo
    type: STRING
    description: GitHub repository name.

tasks:
  - id: audit_security_policy
    type: io.kestra.plugin.scripts.shell.Commands
    containerImage: ghcr.io/kestra-io/tools:latest
    commands:
      - |
        HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}"           -H "Authorization: Bearer {{ secret('GITHUB_TOKEN') }}"           "https://api.github.com/repos/{{ inputs.github_org }}/{{ inputs.github_repo }}/community/profile")
        
        SECURITY_MD_EXISTS="false"
        if [ "$HTTP_STATUS" = "200" ]; then
          curl -s -H "Authorization: Bearer {{ secret('GITHUB_TOKEN') }}"             "https://api.github.com/repos/{{ inputs.github_org }}/{{ inputs.github_repo }}/community/profile" > /tmp/community.json
          
          HAS_SEC=$(jq '.files.security_advisory != null' /tmp/community.json)
          if [ "$HAS_SEC" = "true" ]; then
            SECURITY_MD_EXISTS="true"
          fi
        fi
        
        echo "::set-output name=security_md_exists::$SECURITY_MD_EXISTS::"

  - id: evaluate_security_compliance
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.audit_security_policy.vars.security_md_exists != 'true' }}"
    then:
      - id: notify_appsec_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#sec-ops-alerts",
            "attachments": [
              {
                "color": "warning",
                "title": "⚠️ GitHub Repository Missing SECURITY.md Policy Alert",
                "text": "Repository `{{ inputs.github_org }}/{{ inputs.github_repo }}` is missing a standardized `SECURITY.md` vulnerability reporting policy. Impact: External security researchers and internal auditors have no established channel or PGP key to report responsible vulnerability disclosures.",
                "footer": "Kestra Security Governance • GitHub Community Standards"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#sec-ops-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ GitHub Security MD Sentinel Failed",
            "text": "The GitHub community profile audit query failed. Please verify repository existence and GITHUB_TOKEN scope.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 10 * * 1"
    disabled: true

extend:
  metaDescription: "Audits GitHub community profiles to detect repositories missing standardized SECURITY.md vulnerability disclosure policies."
  metaTitle: GitHub Repository SECURITY.md Compliance and Responsible Disclosure Sentinel with Kestra
  title: GitHub Repository SECURITY.md Compliance and Responsible Disclosure Sentinel
  shortDescription: Audits GitHub community profiles to detect repositories missing standardized SECURITY.md vulnerability disclosure policies.
  description: |
    ## How it works
    This workflow connects to the GitHub Community Profile API (`/repos/{owner}/{repo}/community/profile`) to audit the presence of standard open-source and corporate health files, specifically `SECURITY.md`. Open repositories lacking a formal vulnerability disclosure policy leave engineers vulnerable to public issue disclosures rather than coordinated confidential triage. When a policy is missing, an alert is sent to AppSec teams.

    ## What you get
    - Proactive organization-wide compliance with software supply-chain security baselines (OpenSSF, SOC2).
    - Prevents public zero-day disclosures on GitHub public issues.
    - Ensures clear vulnerability reporting channels and contact emails exist across all projects.

    ## Who it's for
    - Application Security (AppSec) and Product Security teams.
    - Open Source Program Office (OSPO) managers establishing repository standards.

    ## Why orchestrate this with Kestra
    - **Automated Governance**: Run compliance sweeps across repositories on a weekly schedule.
    - **Multi-Repo Scalability**: Easily expand to audit all organization repositories dynamically.
    - **Automated PR Remediation**: Can be extended to automatically open a pull request adding the corporate `SECURITY.md` template.

    ## Prerequisites
    - GitHub token with `repo` or `read:org` permissions.
    - Secrets `GITHUB_TOKEN` and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import this blueprint into Kestra.
    2. Enter target organization and repository name.
    3. Run the flow to audit repository community profile standards.

    ## How to extend
    - Check for `README.md`, `LICENSE`, and `CODE_OF_CONDUCT.md` simultaneously.
    - Auto-create a standardized `.github/SECURITY.md` branch and PR.

    ## Links
    - [GitHub Community Profile API Documentation](https://docs.github.com/en/rest/metrics/community)
    - [Kestra Shell Plugin](https://kestra.io/plugins/plugin-scripts/commands/io.kestra.plugin.scripts.shell.commands)
  tags:
    - Cloud
    - Business
  subTags:
    - Policy & Compliance
    - CI/CD & Deployment
  ee: false
  demo: false
