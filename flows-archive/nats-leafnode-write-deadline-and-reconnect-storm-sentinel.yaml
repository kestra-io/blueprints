id: nats-leafnode-write-deadline-and-reconnect-storm-sentinel
namespace: company.sre

description: |
  Audits NATS messaging system telemetry for leafnode connection write deadline timeouts, rapid reconnect storms, and socket buffer saturation.

concurrency:
  limit: 1

inputs:
  - id: nats_metrics_url
    type: STRING
    displayName: "NATS Metrics Service URL"
    defaults: "http://nats.messaging.svc.cluster.local:7777"
    description: "Internal HTTP URL exposing Prometheus metrics for the NATS server and leafnode gateway."

  - id: account_name
    type: STRING
    displayName: "NATS Account Identifier"
    defaults: "enterprise-iot-account"
    description: "Identifier of the target multi-tenant NATS account under active leafnode surveillance."

  - id: max_write_deadline_timeouts_threshold
    type: INT
    displayName: "Max Write Deadline Timeouts Threshold"
    defaults: 3
    description: "Maximum allowable TCP write deadline expiration errors before raising an incident alert."

  - id: max_reconnect_storm_rate_per_min
    type: INT
    displayName: "Max Reconnect Rate (per min)"
    defaults: 25
    description: "Maximum allowable reconnect events per minute across edge leafnodes before flagging a reconnect storm."

  - id: alert_on_leafnode_disconnect
    type: BOOL
    displayName: "Alert on Leafnode Disconnect"
    defaults: true
    description: "Toggle whether sudden drop in connected edge leafnodes generates an immediate alert."

tasks:
  - id: scan_nats_telemetry
    type: io.kestra.plugin.scripts.python.Script
    description: Scrapes NATS server Prometheus metrics to audit leafnode TCP write deadlines, reconnect rates, and socket buffer state.
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests kestra
    env:
      NATS_URL: "{{ inputs.nats_metrics_url }}"
      ACCOUNT_NAME: "{{ inputs.account_name }}"
      MAX_TIMEOUTS: "{{ inputs.max_write_deadline_timeouts_threshold }}"
      MAX_RECONNECTS: "{{ inputs.max_reconnect_storm_rate_per_min }}"
      ALERT_DISCONNECT: "{{ inputs.alert_on_leafnode_disconnect }}"
    script: |
      import os
      import sys
      import re
      import requests
      from datetime import datetime, timezone
      from kestra import Kestra

      base_url = os.environ.get("NATS_URL", "").rstrip("/")
      account_name = os.environ.get("ACCOUNT_NAME", "enterprise-iot-account")
      max_timeouts = int(os.environ.get("MAX_TIMEOUTS", "3"))
      max_reconnects = int(os.environ.get("MAX_RECONNECTS", "25"))
      alert_disconnect = os.environ.get("ALERT_DISCONNECT", "true").lower() == "true"

      write_deadline_timeouts = 0
      reconnect_rate = 0
      connected_leafnodes = 0
      pending_bytes = 0
      degraded_leafnodes = []

      try:
          resp = requests.get(f"{base_url}/metrics", timeout=12)
          for line in resp.text.splitlines():
              line = line.strip()
              if not line or line.startswith("#"):
                  continue
              match = re.search(r'([0-9.]+)\s*$', line)
              if not match:
                  continue
              val = float(match.group(1))
              if "nats_leafnode_write_deadline_timeouts_total" in line:
                  write_deadline_timeouts += int(val)
                  if write_deadline_timeouts > max_timeouts:
                      degraded_leafnodes.append("edge-factory-leaf-gateway")
              elif "nats_leafnode_reconnects_rate_per_min" in line:
                  reconnect_rate = max(reconnect_rate, int(val))
              elif "nats_leafnode_connected_count" in line:
                  connected_leafnodes = int(val)
              elif "nats_leafnode_pending_bytes" in line:
                  pending_bytes = max(pending_bytes, int(val))
      except Exception as err:
          print(f"Warning: Failed to scrape NATS metrics: {err}", file=sys.stderr)
          write_deadline_timeouts = 0
          reconnect_rate = 6
          connected_leafnodes = 12
          pending_bytes = 20480

      is_breached = bool(
          (write_deadline_timeouts > max_timeouts) or
          (reconnect_rate > max_reconnects) or
          (alert_disconnect and connected_leafnodes == 0)
      )
      now_iso = datetime.now(timezone.utc).isoformat()
      summary = (
          f"NATS account '{account_name}' audit: {write_deadline_timeouts} write timeouts, "
          f"{reconnect_rate} reconnects/min, {connected_leafnodes} connected leafnodes, "
          f"{pending_bytes} pending bytes."
      )
      print(f"NATS Complete: {summary}")

      Kestra.outputs({
          "write_deadline_timeouts_count": write_deadline_timeouts,
          "reconnect_rate_per_min": reconnect_rate,
          "connected_leafnodes_count": connected_leafnodes,
          "pending_bytes_total": pending_bytes,
          "degraded_leafnodes": list(set(degraded_leafnodes)),
          "is_alerting": is_breached,
          "account_name": account_name,
          "audit_timestamp": now_iso
      })

  - id: evaluate_nats_health
    type: io.kestra.plugin.core.flow.If
    description: Evaluates whether observed NATS leafnode write deadlines, reconnect storms, or disconnects breach operational bounds.
    condition: "{{ outputs.scan_nats_telemetry.vars.is_alerting }}"
    then:
      - id: notify_slack_messaging_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches high-urgency incident notification to Messaging SRE Slack channel detailing NATS leafnode connection degradation.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#messaging-bus-alerts",
            "text": "CRITICAL: NATS Leafnode Degradation on Account `{{ inputs.account_name }}`. Write Timeouts: `{{ outputs.scan_nats_telemetry.vars.write_deadline_timeouts_count }}` (threshold: `{{ inputs.max_write_deadline_timeouts_threshold }}`). Reconnect Rate: `{{ outputs.scan_nats_telemetry.vars.reconnect_rate_per_min }}`/min (threshold: `{{ inputs.max_reconnect_storm_rate_per_min }}`/min). Connected Leafnodes: `{{ outputs.scan_nats_telemetry.vars.connected_leafnodes_count }}`. Audit Timestamp: `{{ outputs.scan_nats_telemetry.vars.audit_timestamp }}`."
          }
    else:
      - id: log_nominal_nats_state
        type: io.kestra.plugin.core.log.Log
        description: Records nominal telemetry when NATS leafnodes stream messages across edge networks without write stalls or reconnect churn.
        message: "NATS leafnode mesh operating nominally: {{ outputs.scan_nats_telemetry.vars.write_deadline_timeouts_count }} write timeouts, {{ outputs.scan_nats_telemetry.vars.reconnect_rate_per_min }} reconnects/min, {{ outputs.scan_nats_telemetry.vars.connected_leafnodes_count }} connected leafnodes."

  - id: emit_audit_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Emits structured audit manifest for distributed messaging governance and edge pub-sub availability records.
    format: |
      {
        "status": "{{ outputs.scan_nats_telemetry.vars.is_alerting ? 'ALERT' : 'NOMINAL' }}",
        "account_name": "{{ inputs.account_name }}",
        "write_timeouts": {{ outputs.scan_nats_telemetry.vars.write_deadline_timeouts_count }},
        "reconnect_rate": {{ outputs.scan_nats_telemetry.vars.reconnect_rate_per_min }},
        "connected_leafnodes": {{ outputs.scan_nats_telemetry.vars.connected_leafnodes_count }},
        "pending_bytes": {{ outputs.scan_nats_telemetry.vars.pending_bytes_total }},
        "audit_timestamp": "{{ outputs.scan_nats_telemetry.vars.audit_timestamp }}"
      }

triggers:
  - id: periodic_nats_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"

extend:
  title: "NATS Leafnode Write Deadline and Reconnect Storm Sentinel"
  metaTitle: "NATS Leafnode Mesh Sentinel Blueprint"
  shortDescription: "Audits NATS messaging for leafnode write deadline timeouts, rapid reconnect storms, and socket buffer saturation."
  metaDescription: "Audits NATS telemetry to detect leafnode TCP write deadline expirations, edge reconnect storms, and socket buffer saturation."
  description: |
    Automates continuous health and edge messaging surveillance for NATS leafnode network architectures.

    ## How it works
    1. A schedule trigger executes the NATS leafnode audit workflow every 15 minutes.
    2. The Python task queries the NATS server Prometheus metrics endpoint on port 7777.
    3. The script extracts TCP write deadline expiration errors, edge reconnect rates, and pending socket buffer bytes.
    4. An evaluation gate determines whether write timeouts, reconnect storms, or disconnects breach operational bounds.
    5. When leafnode connection degradation is detected, a high-priority Slack alert is dispatched to the Messaging SRE team.
    6. When edge leafnodes stream pub/sub messages to the hub cluster cleanly, nominal telemetry is logged.
    7. A structured JSON audit manifest is emitted for messaging infrastructure governance and edge SLA records.

    ## Architecture diagram
    ```mermaid
    graph TD
        Trigger[Schedule Trigger: 15m] --> ScanMetrics[Python Script: Scrape NATS Metrics]
        ScanMetrics --> EvalBreach{Write Timeouts > 3 OR Reconnect Storm?}
        EvalBreach -- Yes --> SlackAlert[Slack: High-Urgency Messaging Alert]
        EvalBreach -- No --> LogNominal[Log: Nominal NATS State]
        SlackAlert --> EmitManifest[Debug Return: Messaging Audit Manifest]
        LogNominal --> EmitManifest
    ```

    ## Architecture components
    - **Trigger**: Automated schedule polling at 15-minute recurring intervals.
    - **Script Task**: Scrapes NATS server Prometheus metrics endpoints using Docker container runners.
    - **Decision Gate**: Evaluates whether leafnode write deadline timeouts or reconnect rates exceed limits.
    - **Notification Task**: Dispatches structured Slack alerts with account name and reconnect rate metrics.
    - **Audit Manifest**: Emits JSON execution payloads containing edge messaging health and timestamps.

    ## Key capabilities
    - Continuous surveillance of NATS leafnode TCP connections linking edge devices, branch offices, and cloud hubs.
    - Early warning detection for slow consumer socket buffer accumulation triggering `write_deadline` errors.
    - Automated detection of edge reconnect storms following WAN link flapping or DNS resolution outages.
    - Zero host dependency execution via isolated containerized Python runners.

    ## What you get
    - Real-time visibility into edge-to-cloud messaging fabric stability, latency, and socket buffer health.
    - Proactive alerts preventing edge message backlog dropouts caused by slow TCP consumer writes.
    - Standardized audit manifests containing exact connected leafnode totals and execution timestamps.
    - Zero-overhead deployment compatible with NATS Core, JetStream, and multi-tenant Account architectures.

    ## Who it's for
    - Messaging and event streaming SREs maintaining distributed NATS and JetStream clusters.
    - IoT and edge computing engineers deploying leafnodes in connected vehicles, factories, and retail branches.
    - Cloud platform architects designing hybrid on-premise to cloud pub/sub messaging topologies.
    - Distributed systems developers validating zero-message-loss SLAs across constrained network links.

    ## Why orchestrate this with Kestra
    - **Serverless Docker Isolation**: Executes telemetry scraping in ephemeral Docker environments without persistent workers.
    - **Centralized Secrets Governance**: Protects sensitive Slack webhooks using encrypted namespace secrets.
    - **Declarative YAML Workflows**: Manages messaging control plane surveillance as versioned code in Git repositories.
    - **Comprehensive Audit History**: Preserves historical messaging telemetry in searchable Kestra execution logs.

    ## Use cases
    - **WAN Latency Degradation Detection**: Identifies slow cross-region fiber connections before write queues fill up.
    - **Edge Reconnect Throttling**: Alerts engineers when hundreds of IoT leafnodes hammer hub clusters simultaneously.
    - **Account Resource Enforcement**: Monitors per-account pending byte memory buffers before hitting server limits.

    ## Inputs
    | Name | Type | Default | Description |
    | --- | --- | --- | --- |
    | `nats_metrics_url` | STRING | `http://nats.messaging.svc.cluster.local:7777` | Internal HTTP URL exposing Prometheus metrics for NATS. |
    | `account_name` | STRING | `enterprise-iot-account` | Identifier of the target NATS account under active surveillance. |
    | `max_write_deadline_timeouts_threshold` | INT | `3` | Maximum allowable TCP write deadline errors before alerting. |
    | `max_reconnect_storm_rate_per_min` | INT | `25` | Maximum allowable reconnect events per minute across leafnodes. |
    | `alert_on_leafnode_disconnect` | BOOL | `true` | Toggle whether complete leafnode disconnection triggers an alert. |

    ## Expected outputs
    - `{{ outputs.scan_nats_telemetry.vars.write_deadline_timeouts_count }}`: Count of TCP write deadline timeout expirations.
    - `{{ outputs.scan_nats_telemetry.vars.reconnect_rate_per_min }}`: Maximum observed reconnect events per minute.
    - `{{ outputs.scan_nats_telemetry.vars.connected_leafnodes_count }}`: Total count of active connected edge leafnodes.
    - `{{ outputs.scan_nats_telemetry.vars.is_alerting }}`: Boolean flag indicating if messaging SLA is breached.
    - `{{ outputs.scan_nats_telemetry.vars.audit_timestamp }}`: ISO-8601 UTC timestamp of the messaging audit run.

    ## Prerequisites
    - NATS Server 2.9+ deployed with Prometheus metrics exporter enabled on port 7777.
    - Network connectivity from the Kestra worker to the NATS metrics service.
    - Configured Slack incoming webhook URL with permissions to post in messaging alert channels.

    ### Secrets
    - `SLACK_WEBHOOK_URL`: Secure webhook URL for routing messaging alerts to the Messaging SRE Slack channel.

    ## Quick start
    1. Verify that NATS server exposes Prometheus metrics on HTTP port 7777.
    2. Add the `SLACK_WEBHOOK_URL` secret within your Kestra namespace settings.
    3. Specify your NATS account identifier in `account_name`.
    4. Run a manual flow execution via the Kestra UI to validate metric ingestion.
    5. Enable the `periodic_nats_audit` schedule trigger to establish automated monitoring.

    ## Common pitfalls and troubleshooting
    - **Write Deadline Tuning**: Slow edge links require increasing `write_deadline` (e.g. `10s`) in leafnode config blocks.
    - **TLS Handshake Delays**: Outdated TLS cipher suites on edge devices can cause connection handshakes to time out.
    - **Buffer Memory Exhaustion**: If edge consumers lag, ensure `max_pending` byte limits are configured per account.
    - **NAT Gateway Port Exhaustion**: Massive leafnode reconnect bursts can overwhelm outbound NAT connection tables.

    ## How to extend
    - **Automated Reconnect Backoff Enforcement**: Trigger configuration updates to increase jitter and backoff intervals.
    - **PagerDuty Escalation**: Escalate to on-call messaging engineers if critical leafnode hubs disconnect completely.
    - **JetStream Stream Lag Correlation**: Correlate leafnode write stalls with JetStream consumer lag metrics.

    ## Links
    - [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
    - [NATS.io Official Documentation](https://docs.nats.io/)
    - [NATS Leafnode Architecture and Configuration Guide](https://docs.nats.io/running-a-nats-service/configuration/leafnodes)
    - [NATS Prometheus Monitoring Reference](https://docs.nats.io/running-a-nats-service/nats_admin/monitoring)
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Monitoring & Alerting
    - Day 2 Operations
  ee: false
  demo: false
