id: scylladb-schema-agreement-and-desynchronization-sentinel
namespace: company.scylla

inputs:
  - id: scylla_host
    type: STRING
    required: true
    defaults: "scylla.internal.company.com"
    description: "ScyllaDB coordinator contact point hostname or IP"

  - id: scylla_port
    type: INT
    required: true
    defaults: 9042
    description: "Native CQL port (default: 9042)"

  - id: scylla_username
    type: STRING
    required: true
    defaults: "cassandra"
    description: "CQL authentication username"

  - id: slack_channel
    type: STRING
    required: true
    defaults: "#database-alerts"
    description: "Slack channel destination for ScyllaDB schema desynchronization alerts"

triggers:
  - id: periodic_agreement_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 */2 * * *"

tasks:
  - id: check_schema_agreement
    type: io.kestra.plugin.scripts.python.Script
    description: "Connects to ScyllaDB coordinator, collects system.local and system.peers schema versions, and checks for consensus"
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install cassandra-driver kestra
    env:
      SCYLLA_HOST: "{{ inputs.scylla_host }}"
      SCYLLA_PORT: "{{ inputs.scylla_port }}"
      SCYLLA_USERNAME: "{{ inputs.scylla_username }}"
      SCYLLA_PASSWORD: "{{ secret('SCYLLA_PASSWORD') }}"
    script: |
      import os
      import sys
      from collections import defaultdict
      from cassandra.cluster import Cluster
      from cassandra.auth import PlainTextAuthProvider
      from kestra import Kestra

      host = os.environ.get("SCYLLA_HOST", "localhost")
      port = int(os.environ.get("SCYLLA_PORT", 9042))
      username = os.environ.get("SCYLLA_USERNAME", "")
      password = os.environ.get("SCYLLA_PASSWORD", "")

      auth_provider = None
      if username and password:
          auth_provider = PlainTextAuthProvider(username=username, password=password)

      cluster = Cluster(
          contact_points=[host],
          port=port,
          auth_provider=auth_provider,
          connect_timeout=15,
          control_connection_timeout=15
      )

      session = cluster.connect()

      # Query coordinator local node schema version
      local_row = session.execute(
          "SELECT cluster_name, data_center, rack, schema_version FROM system.local;"
      ).one()

      cluster_name = local_row.cluster_name if local_row else "Unknown-Cluster"
      local_dc = local_row.data_center if local_row else "datacenter1"
      local_rack = local_row.rack if local_row else "rack1"
      coordinator_version = str(local_row.schema_version) if local_row and local_row.schema_version else "unreported"

      # Query peer nodes schema versions across cluster
      peer_rows = session.execute(
          "SELECT peer, data_center, rack, schema_version FROM system.peers;"
      ).all()

      nodes_by_version = defaultdict(list)
      # Register coordinator node
      nodes_by_version[coordinator_version].append({
          "endpoint": host,
          "role": "coordinator",
          "data_center": local_dc,
          "rack": local_rack
      })

      for peer in peer_rows:
          peer_ip = str(peer.peer)
          peer_dc = peer.data_center or "unknown-dc"
          peer_rack = peer.rack or "unknown-rack"
          peer_version = str(peer.schema_version) if peer.schema_version else "unreported"
          nodes_by_version[peer_version].append({
              "endpoint": peer_ip,
              "role": "peer",
              "data_center": peer_dc,
              "rack": peer_rack
          })

      total_nodes = len(peer_rows) + 1
      unique_versions_count = len(nodes_by_version)
      is_synchronized = unique_versions_count == 1

      # Determine majority version and identify divergent nodes
      sorted_versions = sorted(nodes_by_version.items(), key=lambda kv: len(kv[1]), reverse=True)
      majority_version, majority_nodes = sorted_versions[0]

      divergent_nodes = []
      divergent_endpoints = []
      if not is_synchronized:
          for v, nodes in sorted_versions[1:]:
              for n in nodes:
                  divergent_nodes.append({
                      "endpoint": n["endpoint"],
                      "data_center": n["data_center"],
                      "rack": n["rack"],
                      "version": v
                  })
                  divergent_endpoints.append(f"{n['endpoint']} ({n['data_center']}) -> {v[:8]}...")

      if is_synchronized:
          status = "HEALTHY_UNANIMOUS_AGREEMENT"
          runbook = "All nodes report matching schema_version UUID. Cluster schema state is healthy and consistent."
      else:
          status = "CRITICAL_SCHEMA_DISAGREEMENT"
          runbook = (
              "Schema version divergence detected across cluster nodes. "
              "1. Run 'nodetool describecluster' to identify isolated gossiping partitions. "
              "2. Check inter-node network latency between datacenters. "
              "3. Execute 'nodetool resetlocalschema' or rolling restart on lagging nodes to re-sync schema mutations."
          )

      divergent_summary = ", ".join(divergent_endpoints) if divergent_endpoints else "None"

      Kestra.outputs({
          "cluster_name": cluster_name,
          "total_nodes": total_nodes,
          "unique_versions_count": unique_versions_count,
          "is_synchronized": is_synchronized,
          "majority_version": majority_version,
          "majority_nodes_count": len(majority_nodes),
          "divergent_nodes_count": len(divergent_nodes),
          "divergent_summary": divergent_summary,
          "status": status,
          "runbook": runbook
      })

  - id: evaluate_agreement
    type: io.kestra.plugin.core.flow.If
    description: "Branches execution based on whether all cluster nodes share a unanimous schema version"
    condition: "{{ outputs.check_schema_agreement.vars.is_synchronized == false }}"
    then:
      - id: notify_slack_schema_alert
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: "Dispatches critical schema desynchronization warning to database administrators"
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "{{ inputs.slack_channel }}",
            "text": "🚨 *SCYLLADB SCHEMA DESYNCHRONIZATION ALERT*\n*Cluster:* `{{ outputs.check_schema_agreement.vars.cluster_name }}`\n*Status:* `{{ outputs.check_schema_agreement.vars.status }}`\n*Total Nodes:* {{ outputs.check_schema_agreement.vars.total_nodes }}\n*Unique Schema Versions:* {{ outputs.check_schema_agreement.vars.unique_versions_count }}\n*Majority Version:* `{{ outputs.check_schema_agreement.vars.majority_version }}` ({{ outputs.check_schema_agreement.vars.majority_nodes_count }} nodes)\n*Divergent Nodes:* {{ outputs.check_schema_agreement.vars.divergent_summary }}\n*Runbook Action:* {{ outputs.check_schema_agreement.vars.runbook }}\n*Execution:* `{{ execution.id }}`"
          }

    else:
      - id: log_healthy_agreement
        type: io.kestra.plugin.core.log.Log
        description: "Logs verified unanimous schema agreement across all cluster peers"
        message: "ScyllaDB cluster '{{ outputs.check_schema_agreement.vars.cluster_name }}' is in full schema agreement. All {{ outputs.check_schema_agreement.vars.total_nodes }} nodes agree on schema version {{ outputs.check_schema_agreement.vars.majority_version }}."

  - id: finalize_schema_audit
    type: io.kestra.plugin.core.output.OutputValues
    description: "Publishes final structured telemetry for compliance auditing and SRE metrics"
    values:
      execution_id: "{{ execution.id }}"
      cluster_name: "{{ outputs.check_schema_agreement.vars.cluster_name }}"
      total_nodes: "{{ outputs.check_schema_agreement.vars.total_nodes }}"
      unique_versions: "{{ outputs.check_schema_agreement.vars.unique_versions_count }}"
      is_synchronized: "{{ outputs.check_schema_agreement.vars.is_synchronized }}"
      status: "{{ outputs.check_schema_agreement.vars.status }}"

errors:
  - id: notify_coordinator_unreachable
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: "Alerts SRE team if the ScyllaDB coordinator node is unreachable or CQL authentication fails"
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "{{ inputs.slack_channel }}",
        "text": "🚨 *SCYLLADB SENTINEL CONNECTION FAILURE*\n*Target:* `{{ inputs.scylla_host }}:{{ inputs.scylla_port }}`\n*Failure:* Sentinel was unable to establish a CQL connection to query system topology.\n*Execution ID:* `{{ execution.id }}`\n*Flow:* `{{ flow.id }}`"
      }

extend:
  title: ScyllaDB Cluster Schema Agreement and Desynchronization Sentinel
  metaTitle: ScyllaDB Cluster Schema Agreement and Desynchronization Sentinel
  shortDescription: Audits ScyllaDB cluster-wide schema versions across all nodes and alerts Slack upon schema disagreement or gossip desynchronization.
  metaDescription: Audits ScyllaDB cluster schema versions across all nodes and triggers Slack alerts upon schema disagreement or gossip desynchronization.
  description: |
    In distributed databases like ScyllaDB, Data Definition Language (DDL) operations such as creating keyspaces, altering tables, or modifying column types propagate across cluster nodes via gossip protocols. When network partitions, heavy CPU load, or silent node failures disrupt schema dissemination, nodes can drift out of synchronization, holding conflicting `schema_version` UUIDs.

    Operating a ScyllaDB cluster under schema disagreement risks silent read errors (`InvalidQueryException: unconfigured table/column`), mutation dropped records, and partition corruption. This blueprint automates continuous cluster-wide schema agreement audits, querying both the local coordinator and all peer nodes to verify unanimous schema agreement and routing actionable SRE runbook alerts to Slack whenever desynchronization is detected.

    ## How it works

    1. **Scheduled Audit**: The `periodic_agreement_audit` trigger (`io.kestra.plugin.core.trigger.Schedule`) initiates a topology schema health check every two hours.
    2. **Cluster Topology Inspection**: The `check_schema_agreement` task (`io.kestra.plugin.scripts.python.Script` inside Docker) connects to the coordinator node using native CQL, querying `system.local` for the coordinator's schema version and `system.peers` for all peer node metadata across datacenters and racks.
    3. **Consensus Evaluation**: The Python script aggregates reported `schema_version` UUIDs across all nodes, identifies the majority version, isolates any lagging or divergent nodes, and emits structured metrics to Kestra outputs.
    4. **Disagreement Branching**: The `evaluate_agreement` flowable task (`io.kestra.plugin.core.flow.If`) evaluates consensus status:
       - **Disagreement Path**: Dispatches a high-urgency Slack notification via `notify_slack_schema_alert` (`io.kestra.plugin.slack.notifications.SlackIncomingWebhook`) specifying divergent node IPs, affected datacenters, and recovery commands (`nodetool describecluster`, `nodetool resetlocalschema`).
       - **Healthy Path**: Logs unanimous agreement confirmation through `log_healthy_agreement` (`io.kestra.plugin.core.log.Log`).
    5. **Telemetry Export**: The `finalize_schema_audit` task (`io.kestra.plugin.core.output.OutputValues`) exposes clean audit metrics for historical tracking and compliance records.
    6. **Pipeline Resilience**: An `errors` handler (`notify_coordinator_unreachable`) alerts database operators immediately if the coordinator cannot be reached or CQL authentication fails.

    ## What you get

    - Early warning of schema disagreement before application queries fail with missing column or table exceptions.
    - Automated detection of isolated gossip partitions across multi-datacenter ScyllaDB deployments.
    - Specific lagging node endpoints and datacenter locations provided directly in Slack alert cards.
    - Complete execution audit trail verifying schema consensus over time.

    ## Who it's for

    - Database Administrators (DBAs) and Platform Engineers managing ScyllaDB or Apache Cassandra clusters.
    - Site Reliability Engineers (SREs) monitoring distributed storage consistency and high-availability SLAs.
    - DevOps teams executing automated database schema migrations in CI/CD pipelines.

    ## Why orchestrate this with Kestra

    Kestra coordinates recurring cron schedules, isolated containerized CQL queries, conditional consensus branching, and multi-channel alerting within an auditable execution workflow. If a network blip prevents coordinator access, Kestra captures complete execution logs and executes automated fallback alerts without requiring custom monitoring daemons.

    ## Prerequisites

    - A ScyllaDB cluster accessible over native CQL (default port 9042).
    - A Slack Incoming Webhook URL configured with permission to post to the alert channel.
    - Docker enabled on Kestra workers to run the Python driver container.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL for alerting database operations teams.
    - `SCYLLA_PASSWORD`: (Optional) Native CQL authentication password for the ScyllaDB user.

    ## Quick start

    1. Store your `SLACK_WEBHOOK_URL` and `SCYLLA_PASSWORD` in your Kestra namespace secrets.
    2. Import this blueprint into your Kestra instance under namespace `company.scylla`.
    3. Trigger a manual execution with your ScyllaDB contact point to verify connectivity and topology outputs.
    4. Enable the `periodic_agreement_audit` trigger for automated recurring schema health checks.

    ## How to extend

    - Add automated remediation: execute `nodetool resetlocalschema` via SSH or container exec tasks on confirmed lagging nodes.
    - Chain after schema migration pipelines (e.g. Liquibase or Flyway) to enforce schema consensus before releasing application workloads.
    - Integrate with PagerDuty or Opsgenie to trigger on-call escalation for persistent multi-hour schema split-brains.

    ## Links

    - [ScyllaDB Architecture & Gossip Overview](https://docs.scylladb.com/manual/stable/architecture/gossip.html)
    - [Kestra Python Script Documentation](https://kestra.io/plugins/plugin-scripts-python/io.kestra.plugin.scripts.python.script)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
    - [Apache Cassandra Driver for Python](https://cassandra.apache.org/doc/latest/cassandra/developing/drivers.html)
    - This blueprint has been created by [Pranjulchaurasiya](https://github.com/Pranjulchaurasiya)
  tags:
    - Infrastructure
  subTags:
    - Monitoring & Alerting
  ee: false
  demo: false
