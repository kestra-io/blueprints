id: share-based-compensation-expense
namespace: company.team

description: |
  Quarterly share-based compensation close (IFRS 2 / ASC 718): value every option tranche with
  Black-Scholes at grant, take RSUs at grant-date price net of dividends, take market-condition
  PSUs from the external valuation, attribute each tranche separately over its own vesting
  period (graded vesting), estimate forfeitures and true them up as people leave and tranches
  vest, re-estimate non-market performance conditions, expense the incremental fair value of
  a repricing, book exercises, roll the equity reserve forward, compute dilution, and lock
  the quarter.

inputs:
  - id: quarter_end
    type: STRING
    displayName: Quarter end
    defaults: "2026-06-30"
    validator: ^\d{4}-(03-31|06-30|09-30|12-31)$

  - id: forfeiture_rate
    type: FLOAT
    displayName: Expected annual forfeiture rate
    description: Share of unvested awards expected to lapse each year as holders leave. Applies to service and non-market conditions only.
    defaults: 0.08

  - id: psu_achievement
    type: FLOAT
    displayName: Expected PSU revenue-growth achievement
    description: Best estimate at the quarter end of the share of the non-market PSU tranche that will vest (0 to 2). Re-estimated every quarter; the expense is trued up.
    defaults: 1.0

  - id: scenario
    type: SELECT
    displayName: Demo scenario
    description: >
      ISSUES adds an option grant without a volatility, a grant to an employee not in the HR
      file, and an exercise of options that have not vested, which must stop the close.
    values:
      - CLEAN
      - ISSUES
    defaults: CLEAN

  - id: approved_by
    type: STRING
    displayName: Approved by
    description: Needed when the quarter includes a modification, a change in the PSU estimate, or a forfeiture true-up above 25,000.
    defaults: ""

variables:
  lock_key: share_based_payments
  pack_dir: "share-based-payments/{{ inputs.quarter_end }}"

concurrency:
  limit: 1

tasks:
  - id: period_control
    type: io.kestra.plugin.core.output.OutputValues
    values:
      lock: "{{ kv(vars.lock_key, errorOnMissing=false) ?? {'quarter_end': '', 'cumulative': 'NULL', 'psu_achievement': 'NULL'} | toJson }}"
      last: "{{ (kv(vars.lock_key, errorOnMissing=false) ?? {'quarter_end': ''}) | jq('.quarter_end') | first }}"
      previous_quarter: "{{ inputs.quarter_end | date('yyyy-MM-dd') | dateAdd(1, 'DAYS') | dateAdd(-3, 'MONTHS') | dateAdd(-1, 'DAYS') | date('yyyy-MM-dd') }}"

  - id: period_gate
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.period_control.values.last != '' and (inputs.quarter_end <= outputs.period_control.values.last or outputs.period_control.values.last != outputs.period_control.values.previous_quarter) }}"
    then:
      - id: period_refused
        type: io.kestra.plugin.core.execution.Fail
        errorMessage: >-
          {{ inputs.quarter_end <= outputs.period_control.values.last
             ? 'The quarter ending ' ~ inputs.quarter_end ~ ' is already closed (last: ' ~ outputs.period_control.values.last ~ ').'
             : 'Close the quarter ending ' ~ outputs.period_control.values.previous_quarter ~ ' first (last closed: ' ~ outputs.period_control.values.last ~ ').' }}

  - id: compute
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: >
      One DuckDB session: HR file, grants, tranches, valuations (Black-Scholes in SQL),
      leavers, the modification, exercises (demo generator or your equity plan system),
      cumulative expense per tranche at the start and end of the quarter, the reserve
      roll-forward, dilution, checks and journals.
    outputFiles:
      - tranches
      - valuations
      - rollforward
      - journal
      - blockers
    fetchType: FETCH_ONE
    sql: |
      SET VARIABLE q1 = DATE '{{ inputs.quarter_end }}';
      SET VARIABLE q0 = (DATE '{{ inputs.quarter_end }}' + 1 - INTERVAL 3 MONTH - INTERVAL 1 DAY)::DATE;
      SET VARIABLE fr = {{ inputs.forfeiture_rate }};
      -- The estimates the last close used. The opening is recomputed with them, so a change of
      -- estimate is a catch-up in this quarter and never looks like a restatement.
      SET VARIABLE fr_prev = {{ fromJson(outputs.period_control.values.lock).forfeiture_rate ?? inputs.forfeiture_rate }};
      SET VARIABLE ach_prev = {{ fromJson(outputs.period_control.values.lock).psu_achievement == 'NULL' ? inputs.psu_achievement : fromJson(outputs.period_control.values.lock).psu_achievement }};
      SET VARIABLE locked_cum = {{ fromJson(outputs.period_control.values.lock).cumulative }}::DOUBLE;
      CREATE MACRO f0(x) AS format('{:,.0f}', x::DOUBLE);
      CREATE MACRO f2(x) AS format('{:,.2f}', x::DOUBLE);

      -- Standard normal CDF (Abramowitz and Stegun 26.2.17, error below 7.5e-8).
      CREATE MACRO ncdf(x) AS (
        WITH t AS (SELECT 1 / (1 + 0.2316419 * abs(x)) AS k)
        SELECT CASE WHEN x >= 0 THEN 1 - d ELSE d END FROM (
          SELECT exp(-x * x / 2) / sqrt(2 * pi()) * k * (0.319381530 + k * (-0.356563782 + k * (1.781477937 + k * (-1.821255978 + k * 1.330274429)))) AS d FROM t));
      -- Black-Scholes-Merton call value with a continuous dividend yield.
      CREATE MACRO bs_call(s, k, t, v, r, q) AS
        s * exp(-q * t) * ncdf((ln(s / k) + (r - q + v * v / 2) * t) / (v * sqrt(t)))
        - k * exp(-r * t) * ncdf((ln(s / k) + (r - q + v * v / 2) * t) / (v * sqrt(t)) - v * sqrt(t));

      -- =======================================================================
      -- HR file and grants. Replace with your HR and equity plan exports.
      -- =======================================================================
      CREATE TABLE employees AS
      SELECT 'EMP-' || lpad(i::VARCHAR, 3, '0') AS employee, ['Engineering', 'Sales', 'Finance', 'Executive'][1 + i % 4] AS department,
             CASE WHEN i IN (7, 23, 41) THEN DATE '2026-05-15' WHEN i IN (12, 33) THEN DATE '2025-11-30' ELSE NULL END AS left_on
      FROM range(1, 61) t(i);

      CREATE TABLE grants AS
      -- 2024 and 2025 option programs: 4 annual tranches of 25%, 7-year life.
      SELECT 'OPT-' || e.employee || '-' || y AS grant_id, e.employee, 'OPTION' AS plan, make_date(y, 3, 15) AS grant_date,
             (2000 + (hash(e.employee || y) % 8)::INT * 500) AS units, CASE y WHEN 2024 THEN 18.40 ELSE 22.10 END AS strike,
             CASE y WHEN 2024 THEN 18.40 ELSE 22.10 END AS share_price, 0.38 AS volatility, CASE y WHEN 2024 THEN 0.041 ELSE 0.036 END AS risk_free,
             0.012 AS dividend_yield, 7 AS contractual_years, 4 AS tranches, 12 AS months_per_tranche, NULL::DOUBLE AS external_fv
      FROM employees e, (VALUES (2024), (2025)) v(y) WHERE (hash(e.employee || y) % 3) <> 0
      UNION ALL
      -- 2025 and 2026 RSUs: 3 annual tranches.
      SELECT 'RSU-' || e.employee || '-' || y, e.employee, 'RSU', make_date(y, 4, 1), (300 + (hash(e.employee || 'r' || y) % 6)::INT * 100), 0,
             CASE y WHEN 2025 THEN 23.80 ELSE 27.50 END, NULL, NULL, 0.012, NULL, 3, 12, NULL
      FROM employees e, (VALUES (2025), (2026)) v(y)
      UNION ALL
      -- 2025 executive PSUs, 3-year cliff: half on relative TSR (market condition, valued by Monte Carlo),
      -- half on revenue growth (non-market condition, re-estimated every quarter).
      SELECT 'PSU-TSR-' || e.employee, e.employee, 'PSU_MARKET', DATE '2025-04-01', 4000, 0, 23.80, NULL, NULL, 0.012, NULL, 1, 36, 15.62
      FROM employees e WHERE e.department = 'Executive'
      UNION ALL
      SELECT 'PSU-REV-' || e.employee, e.employee, 'PSU_NONMARKET', DATE '2025-04-01', 4000, 0, 23.80, NULL, NULL, 0.012, NULL, 1, 36, NULL
      FROM employees e WHERE e.department = 'Executive';
      {% if inputs.scenario == 'ISSUES' %}
      INSERT INTO grants VALUES
        ('OPT-EMP-002-2026', 'EMP-002', 'OPTION', DATE '2026-03-15', 3000, 26.00, 26.00, NULL, 0.035, 0.012, 7, 4, 12, NULL),
        ('RSU-EMP-099-2026', 'EMP-099', 'RSU', DATE '2026-04-01', 500, 0, 27.50, NULL, NULL, 0.012, NULL, 3, 12, NULL);
      {% endif %}

      -- The 2025 options went under water; on 2026-05-01 the board repriced them to 16.00.
      -- Share price that day 15.80, remaining life about 5.9 years.
      CREATE TABLE modifications (plan_year INT, modified_on DATE, new_strike DOUBLE, share_price DOUBLE, volatility DOUBLE, risk_free DOUBLE);
      INSERT INTO modifications VALUES (2025, DATE '2026-05-01', 16.00, 15.80, 0.42, 0.034);

      -- Exercises of vested options. Replace with your broker's report.
      CREATE TABLE exercises (grant_id VARCHAR, exercised_on DATE, units INT);
      INSERT INTO exercises SELECT grant_id, DATE '2026-05-20', units // 4 FROM grants WHERE plan = 'OPTION' AND year(grant_date) = 2024 AND hash(grant_id) % 4 = 0;
      {% if inputs.scenario == 'ISSUES' %}
      INSERT INTO exercises SELECT grant_id, DATE '2026-06-10', units // 2 FROM grants WHERE plan = 'OPTION' AND year(grant_date) = 2025 LIMIT 1;
      {% endif %}

      -- =======================================================================
      -- Tranches and their grant-date fair value per unit. Each option tranche
      -- has its own expected term (simplified method: midpoint of vesting and
      -- contractual expiry).
      -- =======================================================================
      CREATE TABLE tranches AS
      SELECT g.*, k AS tranche, (g.grant_date + INTERVAL (g.months_per_tranche * k) MONTH)::DATE AS vests_on,
             g.units / g.tranches + CASE WHEN k = g.tranches THEN g.units % g.tranches ELSE 0 END AS tranche_units,
             CASE WHEN g.plan = 'OPTION' THEN (g.months_per_tranche * k / 12.0 + g.contractual_years) / 2 END AS expected_term
      FROM grants g, range(1, g.tranches + 1) t(k);
      ALTER TABLE tranches ADD COLUMN fv DOUBLE;
      UPDATE tranches SET fv = CASE plan
        WHEN 'OPTION' THEN bs_call(share_price, strike, expected_term, volatility, risk_free, dividend_yield)
        WHEN 'RSU' THEN share_price * exp(-dividend_yield * months_per_tranche * tranche / 12.0)
        WHEN 'PSU_NONMARKET' THEN share_price * exp(-dividend_yield * 3)
        WHEN 'PSU_MARKET' THEN external_fv END;

      -- Incremental fair value of the repricing: value with the new terms minus value
      -- with the old terms, both at the modification date (IFRS 2.B43, ASC 718-20-35-3).
      CREATE TABLE incremental AS
      SELECT t.grant_id, t.tranche, m.modified_on,
             bs_call(m.share_price, m.new_strike, greatest(t.expected_term - date_diff('day', t.grant_date, m.modified_on) / 365.25, 0.25), m.volatility, m.risk_free, t.dividend_yield)
             - bs_call(m.share_price, t.strike, greatest(t.expected_term - date_diff('day', t.grant_date, m.modified_on) / 365.25, 0.25), m.volatility, m.risk_free, t.dividend_yield) AS incr_fv
      FROM tranches t JOIN modifications m ON t.plan = 'OPTION' AND year(t.grant_date) = m.plan_year;

      -- =======================================================================
      -- Cumulative expense of a tranche at date d. Units expected to vest:
      -- 0 if the holder left before vesting; the actual units once vested;
      -- otherwise units x (1 - forfeiture rate) ^ remaining years, and for the
      -- non-market PSU, x the expected achievement (actual at vesting).
      -- =======================================================================
      CREATE MACRO expected_units(units, plan, left_on, vests_on, d, ach, fr) AS
        CASE WHEN left_on IS NOT NULL AND left_on <= d AND left_on < vests_on THEN 0
             WHEN vests_on <= d THEN units * CASE WHEN plan = 'PSU_NONMARKET' THEN ach ELSE 1 END
             ELSE units * pow(1 - fr, date_diff('day', d, vests_on) / 365.25)
                  * CASE WHEN plan = 'PSU_NONMARKET' THEN ach ELSE 1 END END;
      -- Share of the service period rendered at d. An increment on a tranche that had already
      -- vested when it was granted is recognised at once (IFRS 2.B43(a)).
      CREATE MACRO served(start_on, vests_on, d) AS CASE WHEN d < start_on THEN 0 WHEN vests_on <= start_on THEN 1
        ELSE greatest(least(date_diff('day', start_on, d) / date_diff('day', start_on, vests_on)::DOUBLE, 1), 0) END;

      CREATE TABLE cum AS
      SELECT t.grant_id, t.employee, t.plan, t.tranche, t.grant_date, t.vests_on, t.tranche_units, t.fv, e.left_on,
             coalesce(i.incr_fv, 0) AS incr_fv, i.modified_on,
             -- Opening: at the end of the previous quarter, with the PSU estimate the last close used.
             round(expected_units(t.tranche_units, t.plan, e.left_on, t.vests_on, getvariable('q0'), getvariable('ach_prev'), getvariable('fr_prev'))
                   * (t.fv * served(t.grant_date, t.vests_on, getvariable('q0'))
                      + CASE WHEN i.modified_on <= getvariable('q0') THEN i.incr_fv * served(i.modified_on, t.vests_on, getvariable('q0')) ELSE 0 END), 2) AS cum0,
             round(expected_units(t.tranche_units, t.plan, e.left_on, t.vests_on, getvariable('q1'), {{ inputs.psu_achievement }}, getvariable('fr'))
                   * (t.fv * served(t.grant_date, t.vests_on, getvariable('q1'))
                      + CASE WHEN i.modified_on <= getvariable('q1') THEN i.incr_fv * served(i.modified_on, t.vests_on, getvariable('q1')) ELSE 0 END), 2) AS cum1,
             -- The opening restated with the new estimates: the difference is the change-of-estimate catch-up.
             round(expected_units(t.tranche_units, t.plan, e.left_on, t.vests_on, getvariable('q0'), {{ inputs.psu_achievement }}, getvariable('fr'))
                   * (t.fv * served(t.grant_date, t.vests_on, getvariable('q0'))
                      + CASE WHEN i.modified_on <= getvariable('q0') THEN i.incr_fv * served(i.modified_on, t.vests_on, getvariable('q0')) ELSE 0 END), 2) AS cum0_new_estimate
      FROM tranches t LEFT JOIN employees e USING (employee) LEFT JOIN incremental i USING (grant_id, tranche)
      WHERE t.grant_date <= getvariable('q1');
      ALTER TABLE cum ADD COLUMN expense DOUBLE;
      UPDATE cum SET expense = cum1 - cum0;

      -- =======================================================================
      -- Equity reserve: cumulative expense less what exercised options moved to
      -- share capital and premium. Exercises and lapses after vesting.
      -- =======================================================================
      CREATE TABLE exercised AS
      SELECT x.grant_id, x.exercised_on, x.units, g.strike, g.units AS granted,
             (SELECT sum(c.cum1) FROM cum c WHERE c.grant_id = x.grant_id AND c.vests_on <= x.exercised_on) AS vested_cost,
             (SELECT sum(c.tranche_units) FROM cum c WHERE c.grant_id = x.grant_id AND c.vests_on <= x.exercised_on) AS vested_units
      FROM exercises x JOIN grants g USING (grant_id);
      ALTER TABLE exercised ADD COLUMN reserve_transfer DOUBLE;
      UPDATE exercised SET reserve_transfer = round(coalesce(vested_cost, 0) * units / nullif(vested_units, 0), 2);

      -- =======================================================================
      -- Checks.
      -- =======================================================================
      CREATE TABLE blockers AS
      SELECT 'MISSING_VALUATION_INPUT' AS code, grant_id AS ref, 'Option grant without volatility, risk-free rate or price' AS detail
        FROM grants WHERE plan = 'OPTION' AND (volatility IS NULL OR risk_free IS NULL OR share_price IS NULL)
      UNION ALL SELECT 'UNKNOWN_EMPLOYEE', grant_id, employee || ' is not in the HR file' FROM grants WHERE employee NOT IN (SELECT employee FROM employees)
      UNION ALL SELECT 'EXERCISE_OF_UNVESTED', x.grant_id, x.units || ' units exercised on ' || x.exercised_on || ', vested ' || coalesce(x.vested_units, 0)
        FROM exercised x WHERE x.units > coalesce(x.vested_units, 0)
      UNION ALL SELECT 'MARKET_PSU_WITHOUT_VALUATION', grant_id, 'Market-condition award without an external fair value' FROM grants WHERE plan = 'PSU_MARKET' AND external_fv IS NULL
      UNION ALL SELECT 'ACHIEVEMENT_OUT_OF_RANGE', 'PSU', 'Expected achievement {{ inputs.psu_achievement }} is outside 0 to 2' WHERE {{ inputs.psu_achievement }} < 0 OR {{ inputs.psu_achievement }} > 2;

      -- =======================================================================
      -- Movement analysis and roll-forward.
      -- =======================================================================
      CREATE TABLE analysis AS
      SELECT
        sum(cum0) AS opening_cumulative,
        sum(CASE WHEN left_on BETWEEN getvariable('q0') + 1 AND getvariable('q1') AND left_on < vests_on THEN -cum0 ELSE 0 END) AS leavers_reversal,
        sum(CASE WHEN plan = 'PSU_NONMARKET' THEN cum0_new_estimate - cum0 ELSE 0 END) AS psu_estimate_change,
        sum(CASE WHEN plan <> 'PSU_NONMARKET' THEN cum0_new_estimate - cum0 ELSE 0 END) AS forfeiture_estimate_change,
        sum(expense) AS expense,
        sum(cum1) AS closing_cumulative
      FROM cum;

      CREATE TABLE rollforward AS
      SELECT plan,
             round(sum(cum0), 2) AS opening_cumulative, round(sum(expense), 2) AS expense, round(sum(cum1), 2) AS closing_cumulative,
             count(*) FILTER (WHERE vests_on BETWEEN getvariable('q0') + 1 AND getvariable('q1')) AS tranches_vested,
             count(*) FILTER (WHERE left_on BETWEEN getvariable('q0') + 1 AND getvariable('q1') AND left_on < vests_on) AS tranches_forfeited
      FROM cum GROUP BY plan ORDER BY plan;

      -- Options outstanding and dilution by the treasury stock method at the quarter-end price.
      SET VARIABLE price_q1 = 17.20;
      CREATE TABLE dilution AS
      WITH live AS (
        SELECT c.*, coalesce(CASE WHEN m.modified_on <= getvariable('q1') THEN m.new_strike END, g.strike) AS eff_strike
        FROM cum c JOIN grants g USING (grant_id) LEFT JOIN modifications m ON g.plan = 'OPTION' AND year(g.grant_date) = m.plan_year
        WHERE c.left_on IS NULL OR c.left_on > getvariable('q1') OR c.vests_on <= c.left_on
      )
      SELECT sum(tranche_units) FILTER (WHERE plan = 'OPTION') - coalesce((SELECT sum(units) FROM exercised WHERE exercised_on <= getvariable('q1')), 0) AS options_outstanding,
             -- Treasury stock method: in-the-money options less the shares their strike would buy back.
             coalesce(sum(tranche_units * (1 - eff_strike / getvariable('price_q1'))) FILTER (WHERE plan = 'OPTION' AND eff_strike < getvariable('price_q1')), 0) AS dilutive_shares_options,
             coalesce(sum(tranche_units) FILTER (WHERE plan <> 'OPTION' AND vests_on > getvariable('q1')), 0) AS unvested_share_awards
      FROM live;

      -- Journals: expense against the equity reserve; exercises against cash, capital and premium.
      CREATE TABLE journal AS
      SELECT row_number() OVER () AS line, DATE '{{ inputs.quarter_end }}' AS posting_date, * FROM (
        SELECT '6050' AS account, 'Share-based payment expense' AS account_name, greatest(sum(expense), 0) AS debit, greatest(-sum(expense), 0) AS credit, 'Expense for the quarter' AS memo FROM cum
        UNION ALL SELECT '3100', 'Share-based payment reserve', greatest(-sum(expense), 0), greatest(sum(expense), 0), 'Expense for the quarter' FROM cum
        UNION ALL SELECT '1000', 'Cash', sum(units * strike), 0, 'Option exercises' FROM exercised WHERE exercised_on BETWEEN getvariable('q0') + 1 AND getvariable('q1') HAVING count(*) > 0
        UNION ALL SELECT '3100', 'Share-based payment reserve', sum(reserve_transfer), 0, 'Option exercises' FROM exercised WHERE exercised_on BETWEEN getvariable('q0') + 1 AND getvariable('q1') HAVING count(*) > 0
        UNION ALL SELECT '3000', 'Share capital (nominal 0.10)', 0, sum(units * 0.10), 'Option exercises' FROM exercised WHERE exercised_on BETWEEN getvariable('q0') + 1 AND getvariable('q1') HAVING count(*) > 0
        UNION ALL SELECT '3010', 'Share premium', 0, sum(units * strike + reserve_transfer - units * 0.10), 'Option exercises' FROM exercised WHERE exercised_on BETWEEN getvariable('q0') + 1 AND getvariable('q1') HAVING count(*) > 0
      );
      UPDATE journal SET debit = round(debit, 2), credit = round(credit, 2);
      INSERT INTO blockers SELECT 'JOURNAL_OUT_OF_BALANCE', 'journal', 'debits ' || sum(debit) || ', credits ' || sum(credit) FROM journal HAVING abs(sum(debit) - sum(credit)) >= 0.01;

      COPY (SELECT grant_id, employee, plan, tranche, grant_date, vests_on, tranche_units, round(fv, 4) AS fv_per_unit, round(incr_fv, 4) AS incremental_fv, modified_on, left_on,
                   cum0 AS opening_cumulative, cum1 AS closing_cumulative, round(expense, 2) AS expense FROM cum ORDER BY grant_id, tranche) TO '{{ outputFiles.tranches }}' (HEADER, DELIMITER ',');
      COPY (SELECT plan, year(grant_date) AS program, tranche, any_value(expected_term) AS expected_term_years, round(avg(fv), 4) AS fv_per_unit, round(avg(i.incr_fv), 4) AS incremental_fv
            FROM tranches t LEFT JOIN incremental i USING (grant_id, tranche) GROUP BY ALL ORDER BY plan, program, tranche) TO '{{ outputFiles.valuations }}' (HEADER, DELIMITER ',');
      COPY rollforward TO '{{ outputFiles.rollforward }}' (HEADER, DELIMITER ',');
      COPY journal TO '{{ outputFiles.journal }}' (HEADER, DELIMITER ',');
      COPY blockers TO '{{ outputFiles.blockers }}' (HEADER, DELIMITER ',');

      SELECT
        (SELECT count(DISTINCT grant_id) FROM cum) AS grants, (SELECT count(*) FROM cum) AS tranches,
        round((SELECT expense FROM analysis), 2) AS expense,
        f2((SELECT expense FROM analysis)) AS expense_fmt,
        (SELECT string_agg(plan || ' ' || f0(expense), ', ' ORDER BY plan) FROM rollforward) AS expense_by_plan,
        round((SELECT opening_cumulative FROM analysis), 2) AS opening_cumulative, round((SELECT closing_cumulative FROM analysis), 2) AS closing_cumulative,
        round((SELECT leavers_reversal FROM analysis), 2)::DOUBLE AS leavers_reversal,
        round((SELECT psu_estimate_change FROM analysis), 2)::DOUBLE AS psu_estimate_change,
        round((SELECT forfeiture_estimate_change FROM analysis), 2)::DOUBLE AS forfeiture_estimate_change,
        (SELECT count(*) FROM (SELECT DISTINCT modified_on FROM incremental) WHERE modified_on BETWEEN getvariable('q0') + 1 AND getvariable('q1'))::INT AS modifications_in_quarter,
        (SELECT round(avg(fv), 4) FROM tranches WHERE plan = 'OPTION' AND year(grant_date) = 2025 AND tranche = 1) AS fv_2025_t1,
        (SELECT round(avg(incr_fv), 4) FROM incremental WHERE tranche = 1) AS incr_t1,
        (SELECT f0(coalesce(sum(units), 0)) FROM exercised WHERE exercised_on BETWEEN getvariable('q0') + 1 AND getvariable('q1')) AS exercised_units,
        (SELECT round(coalesce(sum(reserve_transfer), 0), 2) FROM exercised WHERE exercised_on BETWEEN getvariable('q0') + 1 AND getvariable('q1')) AS reserve_transferred,
        -- Reserve: all expense ever booked less transfers on exercise.
        round((SELECT closing_cumulative FROM analysis) - (SELECT coalesce(sum(reserve_transfer), 0) FROM exercised WHERE exercised_on <= getvariable('q1')), 2) AS reserve_closing,
        (SELECT f0(options_outstanding) FROM dilution) AS options_outstanding,
        (SELECT f0(dilutive_shares_options + unvested_share_awards) FROM dilution) AS dilutive_shares,
        -- The opening cumulative expense must be what the last close stored.
        round(coalesce((SELECT opening_cumulative FROM analysis) - getvariable('locked_cum'), 0), 2)::DOUBLE AS restatement,
        (SELECT count(*) FROM blockers) AS blockers,
        (SELECT coalesce(string_agg(code || ' ' || ref || ': ' || detail, '; ' ORDER BY code, ref), '') FROM blockers) AS blocker_detail;

  - id: result
    type: io.kestra.plugin.core.output.OutputValues
    values:
      r: "{{ (outputs.compute.outputs | last).row | toJson }}"

  - id: log_close
    type: io.kestra.plugin.core.log.Log
    message: |
      Share-based payments, quarter ending {{ inputs.quarter_end }} ({{ inputs.scenario }}). Forfeiture rate {{ inputs.forfeiture_rate }}, PSU achievement {{ inputs.psu_achievement }}.
      {{ outputs.result.values.r | jq('"\(.grants) grants, \(.tranches) tranches. Expense \(.expense_fmt): \(.expense_by_plan)."') | first }}
      {{ outputs.result.values.r | jq('"Cumulative expense \(.opening_cumulative) -> \(.closing_cumulative). Leavers reversed \(.leavers_reversal). Catch-up from changed estimates: PSU \(.psu_estimate_change), forfeiture rate \(.forfeiture_estimate_change). Modifications in the quarter: \(.modifications_in_quarter) (2025 options tranche 1: fair value \(.fv_2025_t1), incremental \(.incr_t1))."') | first }}
      {{ outputs.result.values.r | jq('"Exercised \(.exercised_units) options, reserve transferred \(.reserve_transferred). Reserve \(.reserve_closing). Options outstanding \(.options_outstanding), dilutive shares \(.dilutive_shares)."') | first }}
      {{ outputs.result.values.r | jq('"Opening restated against the last close: \(.restatement)."') | first }}
      {{ outputs.result.values.r | jq('"Blockers: \(.blockers). \(.blocker_detail)"') | first }}

  - id: evidence
    type: io.kestra.plugin.core.namespace.UploadFiles
    namespace: "{{ flow.namespace }}"
    filesMap:
      "{{ render(vars.pack_dir) }}/tranches.csv": "{{ outputs.compute.outputFiles.tranches }}"
      "{{ render(vars.pack_dir) }}/valuations.csv": "{{ outputs.compute.outputFiles.valuations }}"
      "{{ render(vars.pack_dir) }}/rollforward.csv": "{{ outputs.compute.outputFiles.rollforward }}"
      "{{ render(vars.pack_dir) }}/journal.csv": "{{ outputs.compute.outputFiles.journal }}"
      "{{ render(vars.pack_dir) }}/blockers.csv": "{{ outputs.compute.outputFiles.blockers }}"

  - id: decide
    type: io.kestra.plugin.core.flow.Switch
    value: >-
      {%- set r = outputs.result.values.r -%}
      {%- set judgement = r | jq('.modifications_in_quarter > 0 or .psu_estimate_change != 0 or .forfeiture_estimate_change != 0 or .leavers_reversal < -25000') | first -%}
      {%- if (r | jq('.blockers') | first) > 0 -%}BLOCKED
      {%- elseif r | jq('.restatement > 0.01 or .restatement < -0.01') | first -%}RESTATED
      {%- elseif judgement and inputs.approved_by == '' -%}NEEDS_APPROVAL
      {%- else -%}READY{%- endif -%}
    cases:
      READY:
        - id: lock_quarter
          type: io.kestra.plugin.core.kv.Set
          description: The closing cumulative expense and the PSU estimate become the next quarter's opening.
          key: "{{ vars.lock_key }}"
          kvType: JSON
          value: |
            {"quarter_end": "{{ inputs.quarter_end }}", "closed_at": "{{ now() }}", "execution_id": "{{ execution.id }}",
             "cumulative": {{ outputs.result.values.r | jq('.closing_cumulative') | first }},
             "reserve": {{ outputs.result.values.r | jq('.reserve_closing') | first }},
             "psu_achievement": {{ inputs.psu_achievement }},
             "forfeiture_rate": {{ inputs.forfeiture_rate }},
             "approved_by": "{{ inputs.approved_by }}"}

        - id: log_closed
          type: io.kestra.plugin.core.log.Log
          message: "Share-based payments for the quarter ending {{ inputs.quarter_end }} closed: expense {{ outputs.result.values.r | jq('.expense_fmt') | first }}. Post {{ render(vars.pack_dir) }}/journal.csv."

      NEEDS_APPROVAL:
        - id: approval_required
          type: io.kestra.plugin.core.execution.Fail
          errorMessage: >-
            Judgement items this quarter: {{ outputs.result.values.r | jq('.modifications_in_quarter') | first }} modification(s),
            PSU estimate change {{ outputs.result.values.r | jq('.psu_estimate_change') | first }}, forfeiture estimate change {{ outputs.result.values.r | jq('.forfeiture_estimate_change') | first }}, leavers reversal {{ outputs.result.values.r | jq('.leavers_reversal') | first }}.
            Review {{ render(vars.pack_dir) }}/tranches.csv and run again with approved_by.

      RESTATED:
        - id: restated
          type: io.kestra.plugin.core.execution.Fail
          errorMessage: "The opening cumulative expense differs from the last close by {{ outputs.result.values.r | jq('.restatement') | first }}. Grants, leavers or valuations of a closed quarter changed."

    defaults:
      - id: blocked
        type: io.kestra.plugin.core.execution.Fail
        errorMessage: "The quarter ending {{ inputs.quarter_end }} cannot be closed: {{ outputs.result.values.r | jq('.blocker_detail') | first }}"

extend:
  title: Close share-based compensation each quarter with Black-Scholes, graded vesting and true-ups
  metaTitle: Share-based compensation expense (IFRS 2, ASC 718) close with Kestra and DuckDB
  shortDescription: Value options, RSUs and PSUs at grant, expense each tranche over its own vesting period, true up forfeitures and performance estimates, expense a repricing and book exercises.
  metaDescription: Quarterly stock-based compensation close in Kestra and DuckDB. Black-Scholes, graded vesting, forfeitures, PSU true-up, repricing and exercises.
  description: |
    Equity awards are cheap to grant and expensive to account for. Each grant is split into tranches that vest at different dates, and options are valued with an option pricing model. Several things then move the expense every quarter:
    - people leave,
    - estimates of how many awards will vest change,
    - performance targets are re-assessed,
    - a repricing adds a fair value increment on top of the original one,
    - an exercise moves the reserve into share capital.

    Most companies rely on their equity plan vendor's report and a reconciliation spreadsheet. This flow computes the whole close and proves every number.

    It runs with no setup and no network. DuckDB generates 60 employees in four departments, and five leavers. The grants are:
    - option programs in 2024 and 2025, four annual tranches of 25% each and a 7-year life;
    - RSU programs in 2025 and 2026, with three annual tranches;
    - 2025 executive PSUs with a three-year cliff, half on relative TSR (a market condition) and half on revenue growth (a non-market condition).

    The 2025 options went under water and were repriced from 22.10 to 16.00 on 2026-05-01, and some 2024 options were exercised in May 2026.


    ## Valuation

    | Award | Grant-date fair value per unit |
    |---|---|
    | Option | Black-Scholes-Merton with dividend yield, computed in SQL. Each tranche has its own expected term (simplified method: the midpoint of its vesting date and the expiry) |
    | RSU | Share price less the present value of dividends forgone until vesting |
    | PSU, market condition (TSR) | The external Monte Carlo valuation. The market condition is in the fair value, so it is never trued up (IFRS 2.21) |
    | PSU, non-market condition (revenue) | Share price less dividends, multiplied by the expected achievement, which is re-estimated every quarter |
    | Repricing | Incremental fair value = value with new terms - value with old terms, both at the modification date (IFRS 2.B43, ASC 718-20-35-3). Expensed over each tranche's remaining vesting, or at once for tranches already vested |

    ## Attribution

    The expense is computed tranche by tranche (graded vesting, IFRS 2.IG11, the ASC 718 accelerated method). At each date:

    > cumulative expense = expected units × (fair value × service rendered + increment × service since the modification)

    Expected units depend on where the holder stands:
    - a holder who left before vesting has 0;
    - a vested tranche counts its actual units, times the actual achievement for the revenue PSU;
    - an unvested tranche counts units × (1 - forfeiture rate) ^ remaining years, times the expected achievement for the revenue PSU.

    The quarter's expense is closing minus opening cumulative expense, so every change lands in the quarter it happens, as a catch-up:
    - a leaver reverses what was recognised for their unvested tranches;
    - a new forfeiture rate or PSU estimate is a cumulative catch-up. The opening is recomputed with the last close's estimates, so a change of estimate never looks like a restatement.

    ## Equity, exercises and dilution

    - The reserve is credited with the expense.
    - On exercise, the reserve attributable to the exercised units moves out together with the cash received, into share capital at nominal value and share premium.
    - Options outstanding and dilutive shares (treasury stock method at the quarter-end price, plus unvested share awards) feed diluted EPS.

    ## Controls

    - **Blocked:**
      - an option grant without valuation inputs,
      - a grant to someone missing from the HR file,
      - an exercise of more units than have vested,
      - a market PSU without an external valuation,
      - an achievement outside 0 to 2,
      - an unbalanced journal.
    - **Restated:** the opening recomputed from today's data, with the last close's estimates, must equal the cumulative expense the last close stored. A change to a closed quarter stops the run.
    - **Needs approval:** a modification, a changed PSU or forfeiture estimate, or a leaver reversal above 25,000.

    ## How it works

    1. `period_control` and `period_gate` enforce quarter order and load the last close's cumulative expense and estimates.
    2. `compute` (`io.kestra.plugin.jdbc.duckdb.Queries`):
       - defines a normal CDF and Black-Scholes as macros, then builds grants, tranches, fair values and the repricing increment;
       - computes cumulative expense per tranche at both dates;
       - computes exercises, the roll-forward, dilution, the checks and the journal.
    3. `log_close` prints the close and the movement analysis. `evidence` stores `tranches.csv` (694 rows with fair value, increment, opening, closing and expense), `valuations.csv`, `rollforward.csv`, `journal.csv` and `blockers.csv`.
    4. `decide` (`io.kestra.plugin.core.flow.Switch`):
       - `READY`: locks the quarter with its cumulative expense, reserve and estimates.
       - Otherwise the run fails with the reason.

    ## Tested end to end

    On Kestra 2.0.3 OSS, in this order.

    | Run | Inputs | Result |
    |---|---|---|
    | 1 | Q1 2026 | 166 grants, 514 tranches. Expense 455,122.09: options 171,724, RSU 112,616, PSU TSR 69,148, PSU revenue 101,635. Closed |
    | 2 | Q2 2026, approved | 2026 RSUs granted. Three leavers in May, two of them executives: 132,941.40 reversed. 2025 options repriced: tranche 1 worth 6.96 at grant, increment 1.6693. 6,875 options exercised at 18.40: cash 126,500.00, reserve 41,856.15, capital 687.50, premium 167,668.65. Expense 347,539.50 |
    | 3 | Q3 2026, PSU achievement 1.5, forfeiture rate 6% | Catch-ups: PSU 238,777.24, forfeitures 35,716.65. Opening restated: 0.00. Stops for approval, then closes at 779,515.61 |
    | 4 | Q3 again | Refused: already closed |
    | 5 | Q4 2026 `ISSUES` | Blocked by the 3 issues: an option grant without volatility, a grant to EMP-099 (unknown), 2,750 units exercised against 1,375 vested |
    | 6 | Q4, one more leaver added in May | `RESTATED`: opening off by -16,627.78 against the Q3 close |
    | 7 | Q4 | 520,423.52, closed without approval |

    I checked the flow two ways, independently in Python:
    - **Black-Scholes:** the option values were recomputed with `math.erf`, which is exact, and every tranche value and repricing increment matched to 4 decimals (5.9225, 6.2539, 6.5592, 6.8418 for 2024; 6.9600 to 8.0263 for 2025; increments 1.6693 to 1.5585).
    - **Cumulative expense:** the Q2 cumulative expense was rebuilt for all 694 tranches from the plan terms, with the fair values recomputed in Python rather than read from the flow. No tranche differs by more than 0.01.

    ## Problems found while testing

    - **A change of estimate looked like a restatement.** The first restatement check recomputed the opening with the new forfeiture rate, so every change of estimate stopped the run as if a closed quarter had changed. The opening now uses the estimates stored by the last close, and the difference is reported as a catch-up, which is how IFRS 2 treats it.
    - **The increment on a vested tranche was never expensed.** For a tranche that vested before the repricing, the service fraction came out negative and was floored at zero. It is now recognised at once.
    - **DuckDB has no `erf`.** Black-Scholes uses the Abramowitz-Stegun CDF approximation (error below 7.5e-8). Its effect on fair values is under 1e-6 per unit.
    - **Integer sums broke the Switch.** A `count` came back as a big integer, and Pebble refused to compare it. The judgement test now runs inside `jq`, on values cast to `INT` and `DOUBLE`.

    ## Inputs

    | Input | Default | Purpose |
    |---|---|---|
    | `quarter_end` | `2026-06-30` | A quarter end, validated |
    | `forfeiture_rate` | `0.08` | Expected annual forfeiture |
    | `psu_achievement` | `1.0` | Expected vesting of the revenue PSU |
    | `scenario` | `CLEAN` | Demo only |
    | `approved_by` | empty | Needed for judgement items |

    ## Use it with your data

    - Replace `employees`, `grants`, `modifications` and `exercises` with your HR file and equity plan exports.
    - Put the volatility, risk-free rate and dividend yield used at each grant date on the grant, and the external value on market-condition awards.
    - Map the accounts (6050, 3100, 3000, 3010) to your chart, and set the nominal value of a share.

    ## Things to know

    - Cash-settled awards (SARs, phantom shares) are liabilities remeasured at every reporting date and are not modelled here.
    - Payroll taxes on awards, and the deferred tax on them (IAS 12.68A), are outside this flow. The tax provision blueprint takes share-based payments as a temporary difference.
    - Reset by deleting the KV key `share_based_payments`.

    ## Links

    - IFRS 2 Share-based Payment: https://www.ifrs.org/issued-standards/list-of-standards/ifrs-2-share-based-payment/
    - DuckDB plugin: https://kestra.io/plugins/plugin-jdbc-duckdb

    This blueprint was created by [zkasuran](https://github.com/zkasuran).
  tags:
    - Business
    - Data
  subTags:
    - Policy & Compliance
    - Approval Gates
  ee: false
  demo: false
