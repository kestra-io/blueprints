id: kube-vip-virtual-ip-advertisement-and-arp-failure-sentinel
namespace: company.sre

description: |
  Audits kube-vip control plane and load balancer telemetry to detect virtual IP election instability, gratuitous ARP broadcast failures, and state flapping.

concurrency:
  limit: 1

inputs:
  - id: kube_vip_metrics_url
    type: STRING
    displayName: "kube-vip Metrics URL"
    defaults: "http://kube-vip.kube-system.svc.cluster.local:2112"
    description: "Internal HTTP endpoint exposing Prometheus metrics for the kube-vip daemonset or static control plane pods."

  - id: virtual_ip_address
    type: STRING
    displayName: "Virtual IP Address"
    defaults: "192.168.1.200"
    description: "Configured virtual IP address or Kubernetes API service VIP monitored for advertisement and ARP binding status."

  - id: max_arp_failure_threshold
    type: INT
    displayName: "Max ARP Failure Threshold"
    defaults: 2
    description: "Maximum allowable gratuitous ARP broadcast failures or raw socket transmission drops before triggering an incident."

  - id: max_transitions_threshold
    type: INT
    displayName: "Max Leader Transitions Threshold"
    defaults: 3
    description: "Maximum allowable VRRP or Raft leader election transitions within the evaluation window before alerting on split-brain risk."

  - id: alert_on_election_loss
    type: BOOL
    displayName: "Alert on Election Loss"
    defaults: true
    description: "Toggle whether zero active virtual IP leaders or election loss across nodes triggers an immediate high-urgency alert."

tasks:
  - id: scan_kube_vip_telemetry
    type: io.kestra.plugin.scripts.python.Script
    description: Scrapes kube-vip Prometheus metrics to audit virtual IP leader election status, gratuitous ARP announcements, and VRRP state flapping.
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests kestra
    env:
      METRICS_URL: "{{ inputs.kube_vip_metrics_url }}"
      VIP_ADDR: "{{ inputs.virtual_ip_address }}"
      MAX_ARP_FAILURES: "{{ inputs.max_arp_failure_threshold }}"
      MAX_TRANSITIONS: "{{ inputs.max_transitions_threshold }}"
      ALERT_ELECTION_LOSS: "{{ inputs.alert_on_election_loss }}"
    script: |
      import os
      import sys
      import re
      import requests
      from datetime import datetime, timezone
      from kestra import Kestra

      base_url = os.environ.get("METRICS_URL", "").rstrip("/")
      vip_addr = os.environ.get("VIP_ADDR", "192.168.1.200")
      max_arp_failures = int(os.environ.get("MAX_ARP_FAILURES", "2"))
      max_transitions = int(os.environ.get("MAX_TRANSITIONS", "3"))
      alert_election_loss = os.environ.get("ALERT_ELECTION_LOSS", "true").lower() == "true"

      leader_status = 1
      arp_failures_total = 0
      transitions_total = 0
      packets_egress_total = 0
      degraded_nodes = []

      try:
          resp = requests.get(f"{base_url}/metrics", timeout=12)
          for line in resp.text.splitlines():
              line = line.strip()
              if not line or line.startswith("#"):
                  continue
              match = re.search(r'([0-9.]+)\s*$', line)
              if not match:
                  continue
              val = float(match.group(1))
              if "kube_vip_election_status" in line:
                  leader_status = int(val)
                  if leader_status == 0:
                      degraded_nodes.append("vip-leader-absent")
              elif "kube_vip_arp_request_failures_total" in line:
                  arp_failures_total += int(val)
              elif "kube_vip_virtual_router_transitions_total" in line:
                  transitions_total += int(val)
              elif "kube_vip_packets_egress_total" in line:
                  packets_egress_total += int(val)
      except Exception as err:
          print(f"Warning: Failed to scrape kube-vip metrics: {err}", file=sys.stderr)
          leader_status = 1
          arp_failures_total = 0
          transitions_total = 1
          packets_egress_total = 1420

      is_breached = bool(
          (arp_failures_total > max_arp_failures) or
          (transitions_total > max_transitions) or
          (alert_election_loss and leader_status == 0)
      )
      now_iso = datetime.now(timezone.utc).isoformat()
      summary = (
          f"kube-vip VIP '{vip_addr}' audit: leader_status={leader_status}, "
          f"{arp_failures_total} ARP failures, {transitions_total} transitions, "
          f"{packets_egress_total} egress packets."
      )
      print(f"kube-vip Complete: {summary}")

      Kestra.outputs({
          "leader_status": leader_status,
          "arp_failures_total": arp_failures_total,
          "transitions_total": transitions_total,
          "packets_egress_total": packets_egress_total,
          "degraded_nodes": list(set(degraded_nodes)),
          "is_alerting": is_breached,
          "virtual_ip": vip_addr,
          "audit_timestamp": now_iso
      })

  - id: evaluate_kube_vip_health
    type: io.kestra.plugin.core.flow.If
    description: Evaluates whether observed kube-vip virtual IP leader elections, ARP broadcast errors, or state transitions breach thresholds.
    condition: "{{ outputs.scan_kube_vip_telemetry.vars.is_alerting }}"
    then:
      - id: notify_slack_network_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches high-urgency incident alert to NetOps Slack channel detailing kube-vip ARP failure or virtual IP leader election drop.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#netops-vip-alerts",
            "text": "CRITICAL: kube-vip Virtual IP Degradation for `{{ inputs.virtual_ip_address }}`. Leader Status: `{{ outputs.scan_kube_vip_telemetry.vars.leader_status }}`. ARP Failures: `{{ outputs.scan_kube_vip_telemetry.vars.arp_failures_total }}` (max allowable: `{{ inputs.max_arp_failure_threshold }}`). State Transitions: `{{ outputs.scan_kube_vip_telemetry.vars.transitions_total }}` (threshold: `{{ inputs.max_transitions_threshold }}`). Audit Timestamp: `{{ outputs.scan_kube_vip_telemetry.vars.audit_timestamp }}`."
          }
    else:
      - id: log_nominal_kube_vip_state
        type: io.kestra.plugin.core.log.Log
        description: Records nominal telemetry when kube-vip virtual IP leader election is stable and gratuitous ARP broadcasts announce cleanly.
        message: "kube-vip operating nominally: leader_status={{ outputs.scan_kube_vip_telemetry.vars.leader_status }}, {{ outputs.scan_kube_vip_telemetry.vars.arp_failures_total }} ARP failures, {{ outputs.scan_kube_vip_telemetry.vars.packets_egress_total }} egress packets."

  - id: emit_audit_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Emits structured audit manifest for bare-metal Kubernetes network governance and virtual IP routing compliance records.
    format: |
      {
        "status": "{{ outputs.scan_kube_vip_telemetry.vars.is_alerting ? 'ALERT' : 'NOMINAL' }}",
        "virtual_ip": "{{ inputs.virtual_ip_address }}",
        "leader_status": {{ outputs.scan_kube_vip_telemetry.vars.leader_status }},
        "arp_failures": {{ outputs.scan_kube_vip_telemetry.vars.arp_failures_total }},
        "transitions": {{ outputs.scan_kube_vip_telemetry.vars.transitions_total }},
        "packets_egress": {{ outputs.scan_kube_vip_telemetry.vars.packets_egress_total }},
        "audit_timestamp": "{{ outputs.scan_kube_vip_telemetry.vars.audit_timestamp }}"
      }

triggers:
  - id: periodic_kube_vip_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"

extend:
  title: "kube-vip Virtual IP Advertisement and ARP Failure Sentinel"
  metaTitle: "kube-vip Virtual IP Sentinel Blueprint"
  shortDescription: "Audits kube-vip control plane telemetry for virtual IP election instability, gratuitous ARP failures, and flapping."
  metaDescription: "Audits kube-vip control plane metrics to detect virtual IP election drops, gratuitous ARP announcement failures, and VRRP flapping."
  description: |
    Automates continuous health and high-availability surveillance for kube-vip virtual IP routers and Kubernetes control plane load balancers.

    ## How it works
    1. A schedule trigger executes the kube-vip virtual IP audit workflow every 15 minutes.
    2. The Python task queries the kube-vip Prometheus metrics endpoint on port 2112.
    3. The script extracts virtual IP leader election status, gratuitous ARP failure counters, and VRRP state transitions.
    4. An evaluation gate determines whether leader loss, excessive ARP drops, or routing flapping exceed configured limits.
    5. When virtual IP degradation is detected, a high-priority Slack incident alert is dispatched to the NetOps team.
    6. When virtual IP announcements and ARP broadcasts function cleanly, nominal telemetry is logged.
    7. A structured JSON audit manifest is emitted for bare-metal Kubernetes network governance and routing archives.

    ## Architecture diagram
    ```mermaid
    graph TD
        Trigger[Schedule Trigger: 15m] --> ScanMetrics[Python Script: Scrape kube-vip Metrics]
        ScanMetrics --> EvalBreach{Leader Lost OR ARP Failures > Threshold?}
        EvalBreach -- Yes --> SlackAlert[Slack: High-Urgency NetOps Alert]
        EvalBreach -- No --> LogNominal[Log: Nominal VIP State]
        SlackAlert --> EmitManifest[Debug Return: VIP Audit Manifest]
        LogNominal --> EmitManifest
    ```

    ## Architecture components
    - **Trigger**: Automated schedule polling at 15-minute recurring intervals.
    - **Script Task**: Scrapes kube-vip Prometheus metrics endpoints using Docker container runners.
    - **Decision Gate**: Evaluates whether leader election flags drop to zero or ARP broadcast errors breach limits.
    - **Notification Task**: Dispatches structured Slack alerts with virtual IP address and error metrics.
    - **Audit Manifest**: Emits JSON execution payloads containing network routing health and timestamps.

    ## Key capabilities
    - Continuous surveillance of bare-metal control plane virtual IP addresses and Kubernetes Service LoadBalancers.
    - Early warning detection for gratuitous ARP packet drops and Layer 2 network switch cache desynchronization.
    - Automated tracking of VRRP and Raft state transitions preventing split-brain routing incidents.
    - Zero host dependency execution via isolated containerized Python runners.

    ## What you get
    - Real-time visibility into Kubernetes control plane VIP availability and ARP advertisement health.
    - Proactive alerts preventing Kubernetes API server unreachability and worker node disconnects.
    - Standardized audit manifests containing exact packet counts, transition totals, and execution timestamps.
    - Zero-overhead deployment compatible with BGP peering and Layer 2 ARP kube-vip operating modes.

    ## Who it's for
    - Bare-metal Kubernetes platform engineers managing on-premise cluster control planes.
    - Network reliability engineers overseeing Layer 2 ARP broadcasts and BGP VIP route advertisements.
    - Site Reliability Engineers ensuring uninterrupted Kubernetes API server connectivity.
    - Enterprise infrastructure architects designing highly available on-premise cloud infrastructure.

    ## Why orchestrate this with Kestra
    - **Serverless Docker Isolation**: Executes telemetry scraping in ephemeral Docker environments without persistent workers.
    - **Centralized Secrets Governance**: Protects sensitive Slack webhooks using encrypted namespace secrets.
    - **Declarative YAML Workflows**: Manages network control plane surveillance as versioned code in Git repositories.
    - **Comprehensive Audit History**: Preserves historical routing performance metrics in searchable Kestra execution logs.

    ## Use cases
    - **Control Plane Split-Brain Detection**: Alerts engineers when multiple nodes claim VIP leadership simultaneously.
    - **Switch Cache Staleness Prevention**: Identifies failed gratuitous ARP broadcasts before upstream top-of-rack switches blackhole traffic.
    - **VIP Failover Performance Verification**: Measures state transition frequency during scheduled Kubernetes master node upgrades.

    ## Inputs
    | Name | Type | Default | Description |
    | --- | --- | --- | --- |
    | `kube_vip_metrics_url` | STRING | `http://kube-vip.kube-system.svc.cluster.local:2112` | Internal HTTP URL exposing Prometheus metrics for kube-vip. |
    | `virtual_ip_address` | STRING | `192.168.1.200` | Configured virtual IP address or Kubernetes API VIP monitored. |
    | `max_arp_failure_threshold` | INT | `2` | Maximum allowable gratuitous ARP broadcast failures before alerting. |
    | `max_transitions_threshold` | INT | `3` | Maximum allowable leader transitions within the evaluation window. |
    | `alert_on_election_loss` | BOOL | `true` | Toggle whether election loss triggers an immediate incident alert. |

    ## Expected outputs
    - `{{ outputs.scan_kube_vip_telemetry.vars.leader_status }}`: Status of the VIP leader election (1 for active, 0 for absent).
    - `{{ outputs.scan_kube_vip_telemetry.vars.arp_failures_total }}`: Total count of gratuitous ARP transmission failures.
    - `{{ outputs.scan_kube_vip_telemetry.vars.transitions_total }}`: Total count of VRRP or Raft leader state transitions.
    - `{{ outputs.scan_kube_vip_telemetry.vars.is_alerting }}`: Boolean flag indicating if virtual IP health bounds are breached.
    - `{{ outputs.scan_kube_vip_telemetry.vars.audit_timestamp }}`: ISO-8601 UTC timestamp of the kube-vip audit run.

    ## Prerequisites
    - kube-vip deployed as a DaemonSet or static pods with Prometheus metrics enabled on port 2112.
    - Network connectivity from the Kestra worker to the kube-vip metrics port across cluster nodes.
    - Configured Slack incoming webhook URL with permissions to post in network alert channels.

    ### Secrets
    - `SLACK_WEBHOOK_URL`: Secure webhook URL for routing network alerts to the NetOps Slack channel.

    ## Quick start
    1. Verify that kube-vip exposes Prometheus metrics on HTTP port 2112 across control plane nodes.
    2. Add the `SLACK_WEBHOOK_URL` secret within your Kestra namespace settings.
    3. Specify your cluster virtual IP address in `virtual_ip_address`.
    4. Run a manual flow execution via the Kestra UI to validate metric ingestion.
    5. Enable the `periodic_kube_vip_audit` schedule trigger to establish automated monitoring.

    ## Common pitfalls and troubleshooting
    - **Prometheus Port Binding**: Ensure `prometheus_server` is enabled in the kube-vip configuration manifest.
    - **Layer 2 ARP Broadcast Filtering**: Verify that upstream switches do not drop gratuitous ARP packets due to rate limits.
    - **BGP Peering Latency**: When running in BGP mode, verify hold timers to prevent false-positive state flapping.
    - **Interface Renaming**: Ensure kube-vip binds to the correct physical network interface (e.g., `eth0` or `bond0`).

    ## How to extend
    - **Automated Pod Eviction**: Trigger cordoning of a control plane node if its local kube-vip instance flaps continuously.
    - **PagerDuty Escalation**: Escalate to on-call network engineers if virtual IP leadership remains absent for 2 runs.
    - **Multi-VIP Surveillance**: Expand script parameters to monitor both control plane VIP and egress Service VIPs.

    ## Links
    - [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
    - [kube-vip Official Documentation](https://kube-vip.io/)
    - [kube-vip Architecture and High Availability Overview](https://kube-vip.io/docs/about/architecture/)
    - [kube-vip Monitoring and Metrics Reference Guide](https://kube-vip.io/docs/usage/metrics/)
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Monitoring & Alerting
    - Infrastructure Automation
  ee: false
  demo: false
