id: aws-lambda-concurrency-throttling-and-error-sentinel
namespace: company.serverless

description: Monitors AWS Lambda functions for invocation throttling and execution errors via CloudWatch metrics, dispatching alerts to prevent serverless outages.

concurrency:
  limit: 1

inputs:
  - id: aws_region
    type: STRING
    defaults: us-east-1
    description: AWS region where serverless Lambda functions are deployed.

  - id: evaluation_period_minutes
    type: INT
    defaults: 15
    description: Lookback duration in minutes for CloudWatch metric aggregation.

  - id: throttle_threshold
    type: INT
    defaults: 1
    description: Minimum number of throttled invocations to trigger a severity alert.

  - id: error_threshold
    type: INT
    defaults: 5
    description: Minimum execution error count within the evaluation window to trigger an alert.

  - id: slack_channel
    type: STRING
    defaults: "#serverless-alerts"
    description: Slack channel destination for Lambda health notifications.

tasks:
  - id: audit_lambda_metrics
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install boto3
    env:
      AWS_ACCESS_KEY_ID: "{{ secret('AWS_ACCESS_KEY_ID') }}"
      AWS_SECRET_ACCESS_KEY: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
      AWS_DEFAULT_REGION: "{{ inputs.aws_region }}"
      PERIOD_MINUTES: "{{ inputs.evaluation_period_minutes }}"
      THROTTLE_THRESHOLD: "{{ inputs.throttle_threshold }}"
      ERROR_THRESHOLD: "{{ inputs.error_threshold }}"
    script: |
      import os
      import json
      from datetime import datetime, timezone, timedelta
      import boto3
      from kestra import Kestra

      region = os.getenv('AWS_DEFAULT_REGION', 'us-east-1')
      period_mins = int(os.getenv('PERIOD_MINUTES', 15))
      throttle_limit = int(os.getenv('THROTTLE_THRESHOLD', 1))
      error_limit = int(os.getenv('ERROR_THRESHOLD', 5))

      lambda_client = boto3.client('lambda', region_name=region)
      cw = boto3.client('cloudwatch', region_name=region)

      now = datetime.now(timezone.utc)
      start_time = now - timedelta(minutes=period_mins)

      functions = []
      paginator = lambda_client.get_paginator('list_functions')
      for page in paginator.paginate():
          functions.extend(page.get('Functions', []))

      degraded_functions = []

      for fn in functions:
          fn_name = fn['FunctionName']

          # 1. Query Throttles Metric
          throttles_resp = cw.get_metric_data(
              MetricDataQueries=[
                  {
                      'Id': 'throttles',
                      'MetricStat': {
                          'Metric': {
                              'Namespace': 'AWS/Lambda',
                              'MetricName': 'Throttles',
                              'Dimensions': [{'Name': 'FunctionName', 'Value': fn_name}]
                          },
                          'Period': period_mins * 60,
                          'Stat': 'Sum'
                      }
                  },
                  {
                      'Id': 'errors',
                      'MetricStat': {
                          'Metric': {
                              'Namespace': 'AWS/Lambda',
                              'MetricName': 'Errors',
                              'Dimensions': [{'Name': 'FunctionName', 'Value': fn_name}]
                          },
                          'Period': period_mins * 60,
                          'Stat': 'Sum'
                      }
                  }
              ],
              StartTime=start_time,
              EndTime=now
          )

          throttle_sum = 0
          error_sum = 0
          for metric in throttles_resp.get('MetricDataResults', []):
              vals = metric.get('Values', [])
              if metric['Id'] == 'throttles' and vals:
                  throttle_sum = sum(vals)
              elif metric['Id'] == 'errors' and vals:
                  error_sum = sum(vals)

          if throttle_sum >= throttle_limit or error_sum >= error_limit:
              degraded_functions.append({
                  'function_name': fn_name,
                  'runtime': fn.get('Runtime', 'custom'),
                  'throttles': int(throttle_sum),
                  'errors': int(error_sum)
              })

      total_functions = len(functions)
      degraded_count = len(degraded_functions)
      has_degradation = degraded_count > 0

      Kestra.outputs({
          'total_functions_inspected': total_functions,
          'degraded_functions_count': degraded_count,
          'has_degraded_functions': has_degradation,
          'degraded_function_names': [f['function_name'] for f in degraded_functions]
      })

      report_payload = {
          'region': region,
          'window_minutes': period_mins,
          'total_functions': total_functions,
          'degraded_count': degraded_count,
          'degraded_functions': degraded_functions
      }

      with open('lambda_reliability_report.json', 'w') as f:
          json.dump(report_payload, f, indent=2)

    outputFiles:
      - lambda_reliability_report.json

  - id: check_lambda_degradation
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.audit_lambda_metrics.vars.has_degraded_functions }}"
    then:
      - id: notify_slack_serverless
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "{{ inputs.slack_channel }}",
            "text": "AWS Lambda Degradation Alert: {{ outputs.audit_lambda_metrics.vars.degraded_functions_count }} function(s) experiencing throttles or errors in {{ inputs.aws_region }}.\nAffected Functions: {{ outputs.audit_lambda_metrics.vars.degraded_function_names | join(', ') }}\nImmediate investigation required to prevent API gateway timeouts."
          }
    else:
      - id: log_lambda_healthy
        type: io.kestra.plugin.core.log.Log
        message: "All {{ outputs.audit_lambda_metrics.vars.total_functions_inspected }} AWS Lambda function(s) in {{ inputs.aws_region }} are executing without excessive throttles or errors."

  - id: export_serverless_manifest
    type: io.kestra.plugin.core.execution.Labels
    labels:
      aws_region: "{{ inputs.aws_region }}"
      degraded_count: "{{ outputs.audit_lambda_metrics.vars.degraded_functions_count | string }}"
      health_status: "{{ outputs.audit_lambda_metrics.vars.has_degraded_functions ? 'DEGRADED' : 'HEALTHY' }}"

triggers:
  - id: periodic_lambda_probe
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"

extend:
  title: AWS Lambda Concurrency Throttling and Error Sentinel
  metaTitle: AWS Lambda Concurrency Throttling and Error Sentinel
  shortDescription: Monitors AWS Lambda functions for invocation throttling and runtime execution errors via CloudWatch.
  metaDescription: Monitors AWS Lambda functions for invocation throttling and execution errors via CloudWatch metrics, alerting serverless DevOps teams on Slack.
  description: |
    This blueprint acts as a proactive reliability sentinel across AWS serverless architectures. Scheduled every 15 minutes, it evaluates CloudWatch metric telemetry across all Lambda functions in target regions, identifying functions experiencing unreserved concurrency throttling or spiking invocation error rates before API Gateway timeouts degrade end-user experiences.

    ## How it works

    1. **Recurring 15-Minute Probe**: The `periodic_lambda_probe` trigger (`io.kestra.plugin.core.trigger.Schedule`) initiates serverless metric evaluation every 15 minutes.
    2. **CloudWatch Metrics Analysis**: The `audit_lambda_metrics` task (`io.kestra.plugin.scripts.python.Script`) lists deployed Lambda functions and queries CloudWatch `MetricDataQueries` for `Throttles` and `Errors` sums over the lookback window.
    3. **Threshold Gate**: The `check_lambda_degradation` flowable task (`io.kestra.plugin.core.flow.If`) branches based on whether any functions exceeded throttling or error tolerance limits.
    4. **Slack Serverless Dispatch**: When degraded functions are detected, `notify_slack_serverless` (`io.kestra.plugin.notifications.slack.SlackIncomingWebhook`) delivers an incident warning with function names and metrics.
    5. **Healthy Confirmation**: When all functions operate within healthy error thresholds, `log_lambda_healthy` records verified performance.
    6. **Manifest Export**: The `export_serverless_manifest` task annotates the execution with searchable status labels.

    ## Architecture diagram

    ```mermaid
    flowchart TD
        A[Schedule: Every 15 Minutes] --> B[audit_lambda_metrics: CloudWatch & Lambda API]
        B --> C{Throttles or Errors Detected?}
        C -- Yes --> D[notify_slack_serverless: Slack Webhook]
        C -- No --> E[log_lambda_healthy: Log]
        D --> F[export_serverless_manifest: Execution Labels]
        E --> F
    ```

    ## Use cases

    - **Serverless Throttling Prevention**: Identify functions exhausting account-level unreserved concurrency limits during traffic surges.
    - **Unhandled Exception Detection**: Catch unhandled runtime panics and third-party API outage failures in background asynchronous event handlers.
    - **Multi-Region Serverless Health Auditing**: Aggregate operational reliability metrics across regional Lambda deployments.

    ## Inputs

    | Name | Type | Default | Description |
    | :--- | :--- | :--- | :--- |
    | `aws_region` | STRING | `us-east-1` | AWS region where serverless Lambda functions are deployed. |
    | `evaluation_period_minutes` | INT | `15` | Lookback duration in minutes for CloudWatch metric aggregation. |
    | `throttle_threshold` | INT | `1` | Minimum number of throttled invocations to trigger a severity alert. |
    | `error_threshold` | INT | `5` | Minimum execution error count within the evaluation window to trigger an alert. |
    | `slack_channel` | STRING | `#serverless-alerts` | Slack channel destination for Lambda health notifications. |

    ## Expected outputs

    - `{{ outputs.audit_lambda_metrics.vars.total_functions_inspected }}`: Total Lambda functions analyzed.
    - `{{ outputs.audit_lambda_metrics.vars.degraded_functions_count }}`: Number of functions flagged for errors or throttles.
    - `{{ outputs.audit_lambda_metrics.vars.has_degraded_functions }}`: Boolean flag indicating serverless degradation.
    - `{{ outputs.audit_lambda_metrics.vars.degraded_function_names }}`: List of affected function names.
    - `{{ outputs.audit_lambda_metrics.outputFiles['lambda_reliability_report.json'] }}`: Full JSON metric diagnostics.

    ## Prerequisites

    - AWS IAM credentials with `lambda:ListFunctions` and `cloudwatch:GetMetricData` permissions.
    - Incoming Webhook URL configured for your serverless operations Slack channel.

    ### Secrets

    - `AWS_ACCESS_KEY_ID`: AWS IAM access key ID.
    - `AWS_SECRET_ACCESS_KEY`: AWS IAM secret access key.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook endpoint URL.

    ## Quick start

    1. Configure `AWS_ACCESS_KEY_ID`, `AWS_SECRET_ACCESS_KEY`, and `SLACK_WEBHOOK_URL` in your Kestra namespace secrets.
    2. Import this flow YAML into your Kestra workspace.
    3. Specify your target AWS region in `aws_region`.
    4. Click **Execute** in the UI to perform an initial Lambda function health probe.

    ## Common pitfalls and troubleshooting

    - **CloudWatch Metric Latency**: CloudWatch metrics can experience 1 to 2 minutes of reporting latency; keep the lookback window at 15 minutes or higher for accurate sums.
    - **Reserved Concurrency Exhaustion**: If a function with provisioned or reserved concurrency hits its limit, it throttles even if the global account limit has capacity.

    ## How to extend

    - Add automated adjustment of reserved concurrency via `lambda.put_function_concurrency()` to absorb sudden traffic bursts.
    - Fetch CloudWatch Logs Insights error stack traces for offending functions and append them directly to the Slack alert payload.
    - Dispatch high-priority incident events to Datadog or PagerDuty when error rates breach 100 per minute.

    ## Links

    - Kestra Python Script Documentation: https://kestra.io/plugins/plugin-scripts-python/io.kestra.plugin.scripts.python.Script
    - Kestra Slack Plugin Documentation: https://kestra.io/plugins/plugin-notifications
    - AWS Lambda Monitoring and CloudWatch Metrics: https://docs.aws.amazon.com/lambda/latest/dg/monitoring-metrics.html
  tags:
    - Cloud
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - Day 2 Operations
  ee: false
  demo: false
