id: hashicorp-vault-raft-storage-sentinel
namespace: company.security

inputs:
  - id: vault_addr
    type: STRING
    defaults: http://vault.internal:8200
    description: Base URL of the HashiCorp Vault server.
  - id: max_index_lag_threshold
    type: INT
    defaults: 100
    description: Maximum allowable Raft commit index lag between leader and follower peers before alerting.

tasks:
  - id: inspect_raft_autopilot
    type: io.kestra.plugin.scripts.shell.Commands
    runner: PROCESS
    commands:
      - |
        curl -s --header "X-Vault-Token: {{ secret('VAULT_TOKEN') }}"           "{{ inputs.vault_addr }}/v1/sys/storage/raft/autopilot/state" > raft_state.json
        python3 -c "
        import json
        with open('raft_state.json') as f:
            data = json.load(f).get('data', {})
        healthy = data.get('healthy', True)
        servers = data.get('servers', {})
        unhealthy_peers = []
        max_lag = 0
        for s_id, s in servers.items():
            is_node_healthy = s.get('healthy', True)
            last_index = s.get('last_index', 0)
            if not is_node_healthy:
                unhealthy_peers.append({'node': s_id, 'address': s.get('address'), 'last_index': last_index})
        alert_triggered = (not healthy) or (len(unhealthy_peers) > 0)
        result = {
            'cluster_healthy': healthy,
            'total_peers': len(servers),
            'unhealthy_peers_count': len(unhealthy_peers),
            'unhealthy_peers': unhealthy_peers,
            'alert_triggered': alert_triggered
        }
        with open('raft_summary.json', 'w') as out:
            json.dump(result, out)
        print('Vault Raft audit:', result)
        "
    outputFiles:
      - raft_summary.json

  - id: evaluate_raft_health
    type: io.kestra.plugin.core.flow.If
    condition: "{{ fromJson(read(outputs.inspect_raft_autopilot.outputFiles['raft_summary.json'])).alert_triggered }}"
    then:
      - id: alert_security_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "text": ":rotating_light: *Vault Raft Storage Alert*: Integrated storage cluster on {{ inputs.vault_addr }} is degraded (Healthy: {{ fromJson(read(outputs.inspect_raft_autopilot.outputFiles['raft_summary.json'])).cluster_healthy }}). Detected {{ fromJson(read(outputs.inspect_raft_autopilot.outputFiles['raft_summary.json'])).unhealthy_peers_count }} lagging or unhealthy Raft peer nodes."
          }

errors:
  - id: notify_sentinel_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "text": ":warning: *Vault Sentinel Failure*: Failed to query Raft autopilot state on {{ inputs.vault_addr }}."
      }

triggers:
  - id: scheduled_raft_check
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/10 * * * *"
    disabled: true

extend:
  metaDescription: "Audits HashiCorp Vault integrated Raft storage autopilot state to detect replication index lag and unhealthy consensus peers."
  metaTitle: HashiCorp Vault Raft Storage Follower Node Lag Sentinel with Kestra
  title: HashiCorp Vault Raft Storage Follower Node Lag Sentinel
  shortDescription: Audits HashiCorp Vault integrated Raft storage autopilot state to detect replication index lag and unhealthy consensus peers.
  description: |
    ## How it works
    This sentinel contacts the HashiCorp Vault `/v1/sys/storage/raft/autopilot/state` API endpoint. It inspects Raft consensus peer health, commits, and follower synchronization indexes across integrated storage nodes, alerting administrators before follower desynchronization compromises quorum.

    ## What you get
    - Real-time detection of degraded Raft consensus peers.
    - Early warning against disk I/O bottlenecks causing follower lag.
    - Automated Slack delivery tracking cluster health status and lagging peer addresses.

    ## Who it's for
    - Security operations (SecOps) teams and infrastructure engineers administering HashiCorp Vault HA clusters.
    - SREs responsible for primary identity and secret management storage availability.

    ## Why orchestrate this with Kestra
    Kestra automates distributed system observability, executing scheduled health checks with fine-grained error management and notification delivery.

    ## Prerequisites
    - HashiCorp Vault server utilizing integrated Raft storage.
    - A Vault token with `read` permissions on `sys/storage/raft/autopilot/state`.
    - Secrets `VAULT_TOKEN` and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import this blueprint into Kestra.
    2. Configure `vault_addr` and credentials.
    3. Run manually to check current Raft autopilot status.

    ## How to extend
    - Automatically remove dead peer nodes via `/v1/sys/storage/raft/remove-peer` in an emergency automation flow.
    - Inspect Raft snapshot creation frequency and size.
    - Forward Raft telemetry to Datadog or Prometheus.

    ## Links
    - [HashiCorp Vault Raft Autopilot](https://developer.hashicorp.com/vault/docs/configuration/storage/raft#autopilot)
    - [Kestra Slack Notifications](https://kestra.io/plugins/plugin-slack)
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Monitoring & Alerting
  ee: false
  demo: false
