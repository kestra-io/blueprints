id: cockroachdb-ranges-unavailable-underreplicated-sentinel
namespace: company.database

inputs:
  - id: crdb_metrics_url
    type: STRING
    defaults: "http://cockroachdb.internal:8080/_status/vars"
    description: Prometheus scrape endpoint for CockroachDB metrics.

tasks:
  - id: scrape_crdb_metrics
    type: io.kestra.plugin.scripts.shell.Commands
    commands:
      - |
        curl -s -f "{{ inputs.crdb_metrics_url }}" > /tmp/crdb_telemetry.txt
        
        # Scrape ranges_unavailable and ranges_underreplicated metrics
        UNAVAILABLE=$(grep -E "^ranges_unavailable" /tmp/crdb_telemetry.txt | awk '{print $2+0}' | head -n 1)
        UNDERREPLICATED=$(grep -E "^ranges_underreplicated" /tmp/crdb_telemetry.txt | awk '{print $2+0}' | head -n 1)
        
        echo "::set-output name=unavailable::${UNAVAILABLE:-0}::"
        echo "::set-output name=underreplicated::${UNDERREPLICATED:-0}::"

  - id: evaluate_range_health
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.scrape_crdb_metrics.vars.unavailable | int > 0 or outputs.scrape_crdb_metrics.vars.underreplicated | int > 0 }}"
    then:
      - id: notify_dba_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#dba-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 CockroachDB Quorum Degraded Alert",
                "text": "CockroachDB cluster reported *{{ outputs.scrape_crdb_metrics.vars.unavailable }} unavailable ranges* and *{{ outputs.scrape_crdb_metrics.vars.underreplicated }} under-replicated ranges*! Node failures or cross-region network splits threaten distributed consensus and query availability.",
                "footer": "Kestra Database Sentinel • CockroachDB"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#dba-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ CockroachDB Sentinel Failure",
            "text": "Failed to scrape CockroachDB _status/vars endpoint. Verify server address and port.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  metaDescription: "Audits CockroachDB cluster for unavailable and under-replicated Raft ranges to prevent distributed quorum data loss."
  metaTitle: CockroachDB Unavailable and Under-Replicated Range Sentinel with Kestra
  title: CockroachDB Unavailable and Under-Replicated Range Sentinel
  shortDescription: Audits CockroachDB cluster for unavailable and under-replicated Raft ranges to prevent distributed quorum data loss.
  description: |
    ## How it works
    This workflow connects to the CockroachDB Prometheus metrics endpoint (`/_status/vars`) to audit `ranges_unavailable` and `ranges_underreplicated`. In CockroachDB, all table data is divided into contiguous 64MB chunks called ranges, each replicated across multiple nodes via the Multi-Raft consensus protocol. When hardware failures, disk corruptions, or cross-region network partitions cause ranges to lose their majority replica quorum (`ranges_unavailable > 0`), reads and writes to affected keys completely stall. This workflow continuously validates range quorum health and triggers immediate alerts.

    ## What you get
    - Real-time detection of consensus quorum degradation in CockroachDB.
    - Prevents silent distributed query failures and partial data unavailability.
    - Quantitative metrics on unavailable and under-replicated data ranges.

    ## Who it's for
    - Distributed Database Administrators and SREs operating CockroachDB.
    - Platform Architects managing globally distributed database clusters.

    ## Why orchestrate this with Kestra
    - **Continuous High-Availability Assurance**: Automatically audits Raft consensus health.
    - **Independent Verification**: Scrapes telemetry independently of the database query path.
    - **Direct Team Alerts**: Escalates critical range failures directly to Slack.

    ## Prerequisites
    - CockroachDB cluster with `_status/vars` endpoint accessible.
    - Secret `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import the blueprint.
    2. Input CockroachDB metrics URL.
    3. Run the workflow to inspect range health.

    ## How to extend
    - Query `SHOW RANGES` to identify specific table partitions suffering quorum loss.
    - Inspect `ranges_overreplicated` to audit rebalancing efficiency.

    ## Links
    - [CockroachDB Monitoring and Alerting](https://www.cockroachlabs.com/docs/stable/monitoring-and-alerting)
    - [Kestra Documentation](https://kestra.io/docs)
  tags:
    - Data
    - Infrastructure
  subTags:
    - ELT & Data Landing
    - Day 2 Operations
  ee: false
  demo: false
