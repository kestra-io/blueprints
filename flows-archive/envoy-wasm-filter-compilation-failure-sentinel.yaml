    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
    - [Envoy Proxy WebAssembly Architecture Guide](https://www.envoyproxy.io/docs/envoy/latest/intro/arch_overview/advanced/matching/wasm)
    - [Envoy Admin Interface Statistics Reference](https://www.envoyproxy.io/docs/envoy/latest/operations/admin)
    - [Proxy-Wasm ABI Specification](https://github.com/proxy-wasm/spec)
