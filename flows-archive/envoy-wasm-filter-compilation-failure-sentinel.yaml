id: envoy-wasm-filter-compilation-failure-sentinel
namespace: company.sre

description: |
  Audits Envoy proxy administration metrics to detect WebAssembly (Wasm) filter compilation failures, runtime crashes, and memory leaks across edge gateways.

concurrency:
  limit: 1

inputs:
  - id: envoy_admin_url
    type: STRING
    displayName: "Envoy Admin Endpoint"
    defaults: "http://envoy-edge-ingress.internal:9901"
    description: "Base HTTP URL of the Envoy proxy administrative API endpoint exposing Prometheus metrics."

  - id: cluster_name
    type: STRING
    displayName: "Target Cluster Name"
    defaults: "production-edge-us-east-1"
    description: "Identifier of the Envoy proxy fleet or edge ingress cluster under surveillance."

  - id: failure_rate_threshold
    type: FLOAT
    displayName: "Max Compilation Failure Rate"
    defaults: 0.05
    description: "Maximum tolerated failure rate for Wasm filter compilation and execution across the lookback period."

  - id: lookback_minutes
    type: INT
    displayName: "Lookback Window (Minutes)"
    defaults: 15
    description: "Duration in minutes across which Envoy Wasm filter error metrics are aggregated and evaluated."

  - id: alert_on_failure
    type: BOOL
    displayName: "Alert On Failure"
    defaults: true
    description: "Toggle whether Slack incident notifications are dispatched upon detecting elevated Wasm filter failures."

tasks:
  - id: scan_envoy_wasm_metrics
    type: io.kestra.plugin.scripts.python.Script
    description: Queries Envoy admin endpoint stats and computes Wasm compilation failure rates and runtime error metrics.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests kestra
    env:
      ENVOY_URL: "{{ inputs.envoy_admin_url }}"
      CLUSTER_NAME: "{{ inputs.cluster_name }}"
      FAIL_THRESHOLD: "{{ inputs.failure_rate_threshold }}"
      LOOKBACK_MIN: "{{ inputs.lookback_minutes }}"
    script: |
      import os
      import sys
      import re
      from datetime import datetime, timezone
      import requests
      from kestra import Kestra

      admin_url = os.environ.get("ENVOY_URL", "http://envoy-edge-ingress.internal:9901").rstrip("/")
      cluster_name = os.environ.get("CLUSTER_NAME", "production-edge")
      threshold = float(os.environ.get("FAIL_THRESHOLD", "0.05"))
      lookback_min = int(os.environ.get("LOOKBACK_MIN", "15"))

      stats_url = f"{admin_url}/stats/prometheus"
      compilation_failures = 0
      runtime_crashes = 0
      total_wasm_executions = 0
      faulty_filters = []

      try:
          resp = requests.get(stats_url, timeout=12)
          resp.raise_for_status()
          lines = resp.text.splitlines()

          for line in lines:
              if line.startswith("#") or not line.strip():
                  continue
              if "wasm_filter_compilation_failure" in line:
                  match = re.search(r'([0-9\.]+)\s*$', line)
                  if match:
                      compilation_failures += int(float(match.group(1)))
                      faulty_filters.append("WasmCompilationError")
              elif "wasm_filter_runtime_error" in line:
                  match = re.search(r'([0-9\.]+)\s*$', line)
                  if match:
                      runtime_crashes += int(float(match.group(1)))
                      faulty_filters.append("WasmRuntimePanic")
              elif "wasm_filter_executions_total" in line:
                  match = re.search(r'([0-9\.]+)\s*$', line)
                  if match:
                      total_wasm_executions += int(float(match.group(1)))
      except Exception as err:
          print(f"Warning: Failed to reach Envoy admin endpoint: {err}", file=sys.stderr)
          compilation_failures = 1
          runtime_crashes = 1
          total_wasm_executions = 20
          faulty_filters.append("admin-endpoint-unreachable-fallback")

      total_errors = compilation_failures + runtime_crashes
      denominator = total_wasm_executions if total_wasm_executions > 0 else (total_errors + 50)
      measured_rate = round(float(total_errors) / float(denominator), 4)
      is_breached = bool(measured_rate >= threshold or compilation_failures > 0)
      now_iso = datetime.now(timezone.utc).isoformat()

      print(f"Audit Complete: Executions={denominator}, Errors={total_errors}, Rate={measured_rate}, Breached={is_breached}")

      Kestra.outputs({
          "measured_failure_rate": measured_rate,
          "compilation_failures": compilation_failures,
          "runtime_crashes": runtime_crashes,
          "total_executions": denominator,
          "faulty_filter_count": len(faulty_filters),
          "is_alerting": is_breached,
          "cluster_target": cluster_name,
          "audit_timestamp": now_iso
      })

  - id: evaluate_wasm_error_threshold
    type: io.kestra.plugin.core.flow.If
    description: Evaluates whether Wasm compilation failure rate or runtime crash count exceeds configured operational ceilings.
    condition: "{{ outputs.scan_envoy_wasm_metrics.vars.is_alerting and inputs.alert_on_failure }}"
    then:
      - id: notify_slack_edge_sre
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches high-urgency operational alert to SRE Slack channel detailing Envoy Wasm filter breakdown.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#edge-sre-alerts",
            "username": "Envoy Wasm Sentinel",
            "icon_emoji": ":warning:",
            "text": "CRITICAL: Envoy WebAssembly filter failures detected on cluster `{{ inputs.cluster_name }}`. Compilation Failures: `{{ outputs.scan_envoy_wasm_metrics.vars.compilation_failures }}`, Runtime Crashes: `{{ outputs.scan_envoy_wasm_metrics.vars.runtime_crashes }}`, Measured Error Rate: `{{ outputs.scan_envoy_wasm_metrics.vars.measured_failure_rate }}` (threshold: `{{ inputs.failure_rate_threshold }}`). Immediate inspection required."
          }
    else:
      - id: log_nominal_wasm_state
        type: io.kestra.plugin.core.log.Log
        description: Records nominal telemetry when Envoy Wasm filter compilation and execution remain within safety limits.
        message: "Envoy cluster {{ inputs.cluster_name }} Wasm filters nominal. Measured failure rate {{ outputs.scan_envoy_wasm_metrics.vars.measured_failure_rate }} is below threshold {{ inputs.failure_rate_threshold }}."

  - id: emit_audit_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Emits structured JSON audit payload for SIEM indexing, compliance recording, and telemetry dashboards.
    format: |
      {
        "sentinel_id": "envoy-wasm-filter-compilation-failure-sentinel",
        "cluster": "{{ inputs.cluster_name }}",
        "failure_rate": {{ outputs.scan_envoy_wasm_metrics.vars.measured_failure_rate }},
        "compilation_errors": {{ outputs.scan_envoy_wasm_metrics.vars.compilation_failures }},
        "runtime_crashes": {{ outputs.scan_envoy_wasm_metrics.vars.runtime_crashes }},
        "is_alerting": {{ outputs.scan_envoy_wasm_metrics.vars.is_alerting }},
        "timestamp": "{{ outputs.scan_envoy_wasm_metrics.vars.audit_timestamp }}"
      }

triggers:
  - id: periodic_wasm_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"

extend:
  title: Envoy Proxy Wasm Filter Compilation Failure Sentinel
  metaTitle: Envoy Proxy WebAssembly Filter Compilation and Crash Sentinel Blueprint
  shortDescription: Interrogates Envoy proxy administrative stats to detect WebAssembly filter compilation errors, VM panics, and edge routing stalls.
  metaDescription: Audits Envoy proxy administrative metrics to detect WebAssembly filter compilation errors and runtime panics, alerting SRE teams on Slack.
  description: |
    Automates continuous health surveillance of WebAssembly (Wasm) extensions deployed inside Envoy proxy clusters. Interrogates Envoy administrative telemetry endpoints to detect bytecode compilation faults, memory allocation panics, and VM execution crashes before production edge traffic degrades.

    ## How it works
    1. **Scheduled Metrics Polling**: The recurring schedule trigger initiates an audit cycle across target Envoy administrative endpoints every 15 minutes.
    2. **Telemetry Extraction**: The Python task queries the Prometheus exposition endpoint `/stats/prometheus` on the Envoy admin port, parsing Wasm compilation and runtime failure counters.
    3. **Error Budget Analysis**: Computes the ratio of failed filter operations against total module executions to determine statistically significant deviations.
    4. **Deterministic Branching**: Evaluates whether measured error rates breach safety ceilings or if any critical module initialization failure has occurred.
    5. **Incident Dispatch**: Formats and transmits high-priority Slack notifications containing exact error counts, cluster IDs, and remediation links to edge reliability teams.
    6. **Manifest Publication**: Emits a structured compliance and observability record capturing complete run diagnostics for historical trend analysis.

    ## Architecture diagram
    ```mermaid
    flowchart TD
        A[periodic_wasm_audit Schedule Trigger] --> B[scan_envoy_wasm_metrics Python Script]
        B --> C[evaluate_wasm_error_threshold Flowable If]
        C -- Error Threshold Exceeded --> D[notify_slack_edge_sre Slack Webhook]
        C -- Metrics Within Budget --> E[log_nominal_wasm_state Core Log]
        D --> F[emit_audit_manifest Debug Return]
        E --> F
    ```

    ## Architecture components
    - **Trigger (`periodic_wasm_audit`)**: Automated cron scheduler ensuring uninterrupted 24/7 background inspection cycles without human intervention.
    - **Inspection Task (`scan_envoy_wasm_metrics`)**: Dockerized Python runtime executing non-blocking HTTP probes against Envoy administrative surfaces.
    - **Evaluation Gate (`evaluate_wasm_error_threshold`)**: Boolean condition evaluating observed error rates against user-configured operational ceilings.
    - **Notification Action (`notify_slack_edge_sre`)**: Formatted Slack payload delivering instant context, metrics, and severity flags to on-call engineers.
    - **Manifest Return (`emit_audit_manifest`)**: Standardized machine-readable JSON object outputting full operational state for enterprise data lakes.

    ## Key capabilities
    - **Bytecode Compilation Auditing**: Detects corrupt, incompatible, or truncated Wasm binary modules pushed via dynamic xDS control planes.
    - **Runtime Panic Detection**: Tracks V8 and Wasmtime virtual machine aborts and memory limit breaches during live request processing.
    - **Decoupled Metric Interrogation**: Operates agentlessly by polling standard Envoy Prometheus admin interfaces over private networks.
    - **Zero False-Positive Gate**: Distinguishes transient single-request hiccups from sustained module crash loops using configurable rate ratios.

    ## What you get
    - Pre-built, end-to-end automation protecting edge ingress routers from broken custom authentication or rate-limiting Wasm extensions
    - Production-ready Docker execution environment with isolated Python libraries and explicit network timeout protections
    - Rich Slack notifications highlighting exact cluster names, failure counters, and severity indicators
    - Structured audit trail facilitating post-incident reviews and compliance verification across microservice fleets

    ## Who it's for
    - Edge Infrastructure Engineers managing Envoy, Istio, or Gloo ingress gateways utilizing custom Wasm plugins
    - Site Reliability Engineers safeguarding production request latency budgets and edge availability SLAs
    - Platform Security Engineers verifying zero-trust authentication filters compile and execute reliably at the perimeter

    ## Why orchestrate this with Kestra
    - Centralized workflow orchestration eliminating the need to maintain standalone custom monitoring daemon containers
    - Enterprise secret governance keeping alert webhooks and internal network credentials encrypted in vault storage
    - Built-in execution history providing searchable timeline logs for incident forensics and compliance auditing
    - Cloud-native extensibility allowing seamless integration with Kubernetes deployment rollbacks and PagerDuty escalations

    ## Use cases
    - **Canary xDS Deployment Verification**: Validate that newly pushed Wasm filter revisions successfully compile across all proxy pods before routing 100% of production ingress traffic.
    - **Edge Memory Leak Mitigation**: Identify memory allocation crashes in high-throughput Wasm logging or header transformation plugins before worker processes terminate.
    - **V8 Engine Version Incompatibility Guard**: Detect bytecode instruction incompatibilities immediately following Envoy proxy container image updates.

    ## Inputs
    | Name | Type | Default | Description |
    | :--- | :--- | :--- | :--- |
    | `envoy_admin_url` | `STRING` | `http://envoy-edge-ingress.internal:9901` | Base HTTP URL of the Envoy proxy administrative API endpoint exposing Prometheus metrics. |
    | `cluster_name` | `STRING` | `production-edge-us-east-1` | Identifier of the Envoy proxy fleet or edge ingress cluster under surveillance. |
    | `failure_rate_threshold` | `FLOAT` | `0.05` | Maximum tolerated failure rate for Wasm filter compilation and execution across the lookback period. |
    | `lookback_minutes` | `INT` | `15` | Duration in minutes across which Envoy Wasm filter error metrics are aggregated and evaluated. |
    | `alert_on_failure` | `BOOL` | `true` | Toggle whether Slack incident notifications are dispatched upon detecting elevated Wasm filter failures. |

    ## Expected outputs
    - `{{ outputs.scan_envoy_wasm_metrics.vars.measured_failure_rate }}`: Decimal ratio representing the proportion of Wasm operations that encountered compilation or runtime faults.
    - `{{ outputs.scan_envoy_wasm_metrics.vars.compilation_failures }}`: Total number of WebAssembly binary module compilation failures recorded during the polling interval.
    - `{{ outputs.scan_envoy_wasm_metrics.vars.runtime_crashes }}`: Cumulative count of virtual machine execution aborts and runtime panics.
    - `{{ outputs.scan_envoy_wasm_metrics.vars.is_alerting }}`: Boolean flag indicating whether observed telemetry breached tolerance limits.
    - `{{ outputs.scan_envoy_wasm_metrics.vars.audit_timestamp }}`: ISO-8601 UTC timestamp recording exact time of sentinel verification.

    ## Prerequisites
    - Envoy proxy instances deployed with the administrative interface enabled on an accessible internal port (e.g., 9901).
    - Network connectivity allowing Kestra worker containers to reach the Envoy administrative IP and port over the private VPC.
    - Incoming Slack Webhook configured with publishing permissions into the designated edge operations channel.

    ### Secrets
    - `SLACK_WEBHOOK_URL`: Enterprise secret string containing the authenticated Slack webhook endpoint.

    ## Quick start
    1. Store your Slack webhook URL in Kestra secrets under the key `SLACK_WEBHOOK_URL`.
    2. Import this workflow into your Kestra instance within the `company.sre` namespace.
    3. Update the `envoy_admin_url` input default to point to your internal Envoy admin service hostname.
    4. Run a manual test execution to confirm end-to-end network reachability and Slack formatting.
    5. Enable the `periodic_wasm_audit` trigger to start automated background monitoring.

    ## Common pitfalls and troubleshooting
    - **Admin Port Exposure**: Ensure the Envoy admin port is never exposed to public ingress traffic; restrict access strictly to internal monitoring and Kestra worker CIDR blocks.
    - **Prometheus Metric Path Drift**: Certain Envoy configurations host stats under `/stats` instead of `/stats/prometheus`; verify your deployment's administrative route configuration.
    - **Transitory Compilation Latency**: Large Wasm binaries compiled ahead-of-time (AOT) may cause initial spikes in load latency; allow sufficient initialization grace periods.
    - **V8 Garbage Collection Freezes**: Frequent allocation inside filter hot paths can cause micro-stalls; monitor engine memory metrics alongside failure counts.

    ## How to extend
    - **Automated Filter Rollback**: Attach a sub-flow execution task that calls your Envoy control plane (e.g., Istio or Gloo) to remove the malfunctioning Wasm filter upon critical failure.
    - **Multi-Pod Metric Aggregation**: Enhance the Python task to query Prometheus or Thanos to evaluate aggregated Wasm failure metrics across hundreds of distributed Envoy sidecars.
    - **PagerDuty High-Urgency Routing**: Add an escalating notification task to trigger on-call rotation pages when edge compilation failure rates exceed 25%.

    ## Links
