    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
    - [CoreDNS Prometheus Metrics Official Reference](https://coredns.io/plugins/metrics/)
    - [Kubernetes DNS for Services and Pods Documentation](https://kubernetes.io/docs/concepts/services-networking/dns-pod-service/)
    - [Troubleshooting CoreDNS Latency and NXDOMAIN Rates](https://learn.microsoft.com/en-us/troubleshoot/azure/azure-kubernetes/network/troubleshoot-coredns-issues)
