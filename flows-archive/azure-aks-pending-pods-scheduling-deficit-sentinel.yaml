id: azure-aks-pending-pods-scheduling-deficit-sentinel
namespace: company.cloud

description: |
  Audits Azure Kubernetes Service (AKS) clusters to detect unschedulable pods stuck in Pending state
  due to node pool capacity deficits and resource exhaustion before deployments stall.

concurrency:
  limit: 1

inputs:
  - id: azure_subscription_id
    type: STRING
    displayName: Azure Subscription ID
    defaults: "12345678-1234-1234-1234-123456789abc"
    description: Azure subscription identifier containing the AKS cluster.

  - id: resource_group_name
    type: STRING
    displayName: Resource Group Name
    defaults: "rg-production-compute"
    description: Name of the Azure Resource Group hosting the AKS cluster.

  - id: aks_cluster_name
    type: STRING
    displayName: AKS Cluster Name
    defaults: "aks-production-cluster-01"
    description: Target Azure Kubernetes Service managed cluster name to audit.

  - id: max_pending_pods_threshold
    type: INT
    displayName: Max Pending Pods Threshold
    defaults: 5
    description: Maximum allowable unscheduled pods stuck in Pending state before raising an incident.

  - id: alert_on_deficit
    type: BOOL
    displayName: Alert on Deficit
    defaults: true
    description: Whether to dispatch automated Slack alerts when pending pod scheduling deficits occur.

tasks:
  - id: scan_aks_pending_pods
    type: io.kestra.plugin.scripts.python.Script
    description: Queries Azure Monitor and AKS cluster metrics for unscheduled pending pod counts and node pool capacity.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install azure-identity azure-mgmt-monitor kestra
    env:
      AZURE_CLIENT_ID: "{{ secret('AZURE_CLIENT_ID') }}"
      AZURE_CLIENT_SECRET: "{{ secret('AZURE_CLIENT_SECRET') }}"
      AZURE_TENANT_ID: "{{ secret('AZURE_TENANT_ID') }}"
    script: |
      import os
      import json
      from datetime import datetime, timedelta, timezone
      from azure.identity import ClientSecretCredential
      from azure.mgmt.monitor import MonitorManagementClient
      from kestra import Kestra

      sub_id = "{{ inputs.azure_subscription_id }}".strip()
      rg = "{{ inputs.resource_group_name }}".strip()
      cluster = "{{ inputs.aks_cluster_name }}".strip()
      threshold = int("{{ inputs.max_pending_pods_threshold }}")

      client_id = os.environ.get("AZURE_CLIENT_ID", "")
      client_secret = os.environ.get("AZURE_CLIENT_SECRET", "")
      tenant_id = os.environ.get("AZURE_TENANT_ID", "")

      now = datetime.now(timezone.utc)
      start_time = now - timedelta(minutes=15)
      timespan = f"{start_time.isoformat()}/{now.isoformat()}"

      resource_id = f"/subscriptions/{sub_id}/resourceGroups/{rg}/providers/Microsoft.ContainerService/managedClusters/{cluster}"

      pending_pods_count = 0
      node_cpu_percent = 0.0
      is_deficit = False

      try:
          cred = ClientSecretCredential(
              tenant_id=tenant_id,
              client_id=client_id,
              client_secret=client_secret
          )
          client = MonitorManagementClient(credential=cred, subscription_id=sub_id)

          metrics_data = client.metrics.list(
              resource_uri=resource_id,
              timespan=timespan,
              interval="PT5M",
              metricnames="kube_pod_status_phase",
              aggregation="Average,Maximum"
          )

          # Parse pod phase metric series
          for item in metrics_data.value:
              for ts in item.timeseries:
                  for data in ts.data:
                      if data.maximum is not None and data.maximum > pending_pods_count:
                          pending_pods_count = int(data.maximum)

          if pending_pods_count >= threshold:
              is_deficit = True

          report = {
              "cluster_name": cluster,
              "resource_group": rg,
              "pending_pods_count": pending_pods_count,
              "threshold": threshold,
              "is_deficit": is_deficit,
              "remediation_advice": f"Scale out AKS node pool for cluster {cluster} or review pod resource requests (CPU/Memory limits)."
          }

          with open("aks_report.json", "w") as f:
              json.dump(report, f)

          Kestra.outputs({
              "cluster_name": cluster,
              "pending_pods_count": pending_pods_count,
              "is_deficit": is_deficit
          })

      except Exception as e:
          print(f"Error querying Azure Monitor for AKS: {e}")
          report = {
              "cluster_name": cluster,
              "error": str(e),
              "is_deficit": False
          }
          with open("aks_report.json", "w") as f:
              json.dump(report, f)
          Kestra.outputs({
              "cluster_name": cluster,
              "pending_pods_count": 0,
              "is_deficit": False
          })

  - id: check_scheduling_deficit
    type: io.kestra.plugin.core.flow.If
    description: Evaluates whether unscheduled pending pods exceed the configured threshold.
    condition: "{{ fromJson(read('aks_report.json')).is_deficit and inputs.alert_on_deficit }}"
    then:
      - id: notify_slack_aks_deficit
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches high-priority AKS pod scheduling deficit alert to Kubernetes SRE on Slack.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#kubernetes-sre-alerts",
            "username": "AKS-Sentinel",
            "text": "CRITICAL: Azure Kubernetes Service Cluster `{{ fromJson(read('aks_report.json')).cluster_name }}` has `{{ fromJson(read('aks_report.json')).pending_pods_count }}` pod(s) stuck in PENDING state (Threshold: {{ inputs.max_pending_pods_threshold }})! Cluster node pools are at capacity or resource requests cannot be satisfied. Runbook: {{ fromJson(read('aks_report.json')).remediation_advice }}"
          }

  - id: log_cluster_scheduling_state
    type: io.kestra.plugin.core.log.Log
    description: Records an operational audit trail of AKS pod scheduling and capacity metrics.
    message: "AKS audit completed for '{{ fromJson(read('aks_report.json')).cluster_name }}'. Pending pods: {{ fromJson(read('aks_report.json')).pending_pods_count }}, Scheduling Deficit: {{ fromJson(read('aks_report.json')).is_deficit }}."

  - id: export_aks_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Emits structured manifest of AKS cluster scheduling health for cluster auto-scaler telemetry.
    format: "{{ fromJson(read('aks_report.json')) }}"

triggers:
  - id: ten_minute_aks_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: Automated schedule trigger auditing AKS pod scheduling states every ten minutes.
    cron: "*/10 * * * *"

extend:
  title: Azure AKS Pending Pods Scheduling Deficit Sentinel
  metaTitle: Azure AKS Pending Pods Scheduling Deficit Sentinel Blueprint
  shortDescription: Audits Azure Kubernetes Service clusters to detect unscheduled pending pods and node pool deficits.
  metaDescription: Audits Azure Kubernetes Service (AKS) clusters to detect unscheduled pending pods and node pool capacity deficits, alerting SRE teams via Slack.
  description: |
    Modern enterprise microservices, stateful streaming processors, and distributed AI inference jobs hosted on Azure rely on Azure Kubernetes Service (AKS) for managed container orchestration. When application teams roll out new container deployments with high CPU or memory resource requests, or when node pool cluster autoscaler ceilings are reached, newly created pods enter the `Pending` lifecycle phase. Under normal conditions, the Kubernetes kube-scheduler binds pods to nodes within seconds. However, when node pools exhaust available vCPU, memory, or Azure CNI IP address allocations, pods remain stuck indefinitely in the `Pending` state with `0/N nodes available: Insufficient cpu` scheduling events. If undetected, new microservice versions fail to roll out, background worker queues stall, and blue-green releases hang. This sentinel audits Azure Monitor and AKS metrics every 10 minutes, detects unscheduled pending pod backlogs exceeding safety thresholds, and alerts Kubernetes SRE teams on Slack.

    ## How it works
    1. **Scheduled triggering**: Executes every 10 minutes via automated cron trigger (`*/10 * * * *`) or runs on-demand via manual execution.
    2. **Metric query construction**: Targets the Azure Monitor Management Client targeting the AKS managed cluster resource URI (`Microsoft.ContainerService/managedClusters`).
    3. **Pod phase telemetry retrieval**: Fetches `kube_pod_status_phase` across a 15-minute rolling lookback window to isolate pods in the Pending state.
    4. **Threshold comparison**: Verifies whether the count of unscheduled pending pods meets or exceeds `max_pending_pods_threshold`.
    5. **Conditional alerting**: An `io.kestra.plugin.core.flow.If` flowable checks if a scheduling deficit exists and dispatches an incident card to `#kubernetes-sre-alerts`.
    6. **Manifest export**: Emits a structured JSON audit payload detailing pending pod metrics and node pool expansion advice for Kubernetes SREs.

    ## Architecture diagram
    ```mermaid
    flowchart TD
      A[ten_minute_aks_audit Schedule Trigger] --> B[scan_aks_pending_pods Python Script]
      B --> C[check_scheduling_deficit Flowable If]
      C -- Pod Deficit Detected --> D[notify_slack_aks_deficit Webhook]
      C -- Scheduling Nominal --> E[log_cluster_scheduling_state Log]
      D --> E
      E --> F[export_aks_manifest Return]
    ```

    ## What you get
    - Proactive detection of stalled Kubernetes deployments and pending pod backlogs.
    - Visibility into AKS node pool capacity limits, IP address starvation, and resource ceiling bottlenecks.
    - Contextual Slack alerts containing exact pending pod counts and node pool scaling advice.
    - Structured JSON execution manifests for Kubernetes cluster capacity planning and autoscaler tuning.

    ## Who it's for
    - Kubernetes and Cloud Platform SREs maintaining production AKS clusters.
    - DevOps Teams operating automated CI/CD deployment pipelines on Kubernetes.
    - Cloud Infrastructure Architects sizing AKS system and user node pools.

    ## Why orchestrate this with Kestra
    Detecting unscheduled pod conditions across multiple AKS clusters requires continuous evaluation of Kubernetes control plane metrics. Kestra provides scheduled orchestration with container isolation, secure service principal credential handling, and direct Slack integration. Using Kestra, infrastructure teams automate Kubernetes reliability guardrails without running custom in-cluster daemon sets or complex Prometheus alert managers.

    ## Use cases
    - **Cluster Autoscaler Ceiling Warning**: Detect when the cluster autoscaler reaches max node limits and can no longer schedule pending workloads.
    - **Resource Request Misconfiguration Early Warning**: Identify deployments where developers requested excessive memory or CPU that no single node can satisfy.
    - **Azure CNI Subnet IP Exhaustion**: Spot unschedulable pods caused by Azure virtual network subnet IP exhaustion in advance.

    ## Inputs
    | Name | Type | Default | Description |
    | :--- | :--- | :--- | :--- |
    | `azure_subscription_id` | `STRING` | `12345678-1234-1234-1234-123456789abc` | Azure subscription identifier containing the AKS cluster. |
    | `resource_group_name` | `STRING` | `rg-production-compute` | Name of the Azure Resource Group hosting the AKS cluster. |
    | `aks_cluster_name` | `STRING` | `aks-production-cluster-01` | Target Azure Kubernetes Service managed cluster name to audit. |
    | `max_pending_pods_threshold` | `INT` | `5` | Maximum allowable unscheduled pods stuck in Pending state before raising an incident. |
    | `alert_on_deficit` | `BOOL` | `true` | Whether to dispatch automated Slack alerts when pending pod scheduling deficits occur. |

    ## Expected outputs
    - `{{ outputs.scan_aks_pending_pods.vars.cluster_name }}`: Name of the evaluated AKS cluster.
    - `{{ outputs.scan_aks_pending_pods.vars.pending_pods_count }}`: Count of pods stuck in the Pending lifecycle phase.
    - `{{ outputs.scan_aks_pending_pods.vars.is_deficit }}`: Boolean flag indicating whether the pending pod threshold was breached.
    - `{{ outputs.export_aks_manifest.value }}`: Structured dictionary containing the consolidated AKS cluster scheduling diagnostic manifest.

    ## Prerequisites
    - Outbound HTTPS network access from Kestra execution workers to Azure Resource Manager endpoints (`management.azure.com`).
    - An Azure Service Principal configured with `Monitoring Reader` permissions on the AKS resource group.
    - A Slack Incoming Webhook URL configured in Kestra secrets.

    ### Secrets
    - `AZURE_CLIENT_ID`: Service Principal Application (Client) ID.
    - `AZURE_CLIENT_SECRET`: Service Principal Secret.
    - `AZURE_TENANT_ID`: Azure Active Directory Directory (Tenant) ID.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL used to dispatch Kubernetes incident alerts.

    ## Quick start
    1. Register `AZURE_CLIENT_ID`, `AZURE_CLIENT_SECRET`, `AZURE_TENANT_ID`, and `SLACK_WEBHOOK_URL` in your Kestra secret storage.
    2. Import this blueprint into your Kestra instance under the `company.cloud` namespace.
    3. Update `azure_subscription_id`, `resource_group_name`, and `aks_cluster_name` with your cluster details.
    4. Run a manual execution to test Azure Monitor authentication and verify the output manifest format.

    ## Common pitfalls and troubleshooting
    - **Container Insights Dependency**: Pod phase metrics require Azure Monitor Container Insights (or Azure Managed Prometheus) to be enabled on the AKS cluster.
    - **Transient vs Stuck Pending**: Pods pulling large container images may enter Pending transiently; querying a 15-minute rolling window prevents false alarms.
    - **Service Principal Role**: Ensure the service principal has `Monitoring Reader` role on the resource group.

    ## How to extend
    - **Automated Node Pool Scale-Out**: Add an Azure CLI task to automatically increment node pool count when pending pods persist for over 20 minutes.
    - **Pod Event Inspection Drill**: Dispatch a `kubectl describe pod` command to log the exact `FailedScheduling` events into the execution log.
    - **Multi-Cluster Fleet Audit**: Wrap the evaluation in an `io.kestra.plugin.core.flow.ForEach` loop to scan all AKS clusters in the cloud estate.

    ## Links
    - [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
    - [Monitor AKS with Azure Monitor](https://learn.microsoft.com/en-us/azure/aks/monitor-aks)
    - [Troubleshoot Pending Pods in Kubernetes](https://kubernetes.io/docs/tasks/debug/debug-application/debug-pods/#my-pod-stays-pending)
  tags:
    - Cloud
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - Kubernetes Operations
  ee: false
  demo: false
