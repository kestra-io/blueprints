id: aws-transit-gateway-attachment-packet-drop-sentinel
namespace: company.network

description: |
  Audits AWS Transit Gateway (TGW) attachments to detect packet drops, blackhole route anomalies,
  and bandwidth throttling across VPC interconnections, delivering incident alerts to cloud networking teams on Slack.

concurrency:
  limit: 1

inputs:
  - id: aws_region
    type: STRING
    displayName: AWS Region
    defaults: us-east-1
    description: Target AWS region where Transit Gateway and VPC attachments reside.

  - id: tgw_name_filter
    type: STRING
    displayName: Transit Gateway Name Filter
    defaults: all
    description: Name or substring filter of Transit Gateways to audit, or all to scan all regional TGWs.

  - id: max_packet_drop_threshold
    type: INT
    displayName: Max Packet Drop Threshold
    defaults: 100
    description: Maximum allowable dropped packets within the 15-minute evaluation window before triggering alerts.

  - id: alert_on_drops
    type: BOOL
    displayName: Alert on Packet Drops
    defaults: true
    description: Whether to dispatch automated Slack incident notifications when Transit Gateway packet drops are detected.

tasks:
  - id: scan_tgw_attachment_telemetry
    type: io.kestra.plugin.scripts.python.Script
    description: Queries AWS EC2 Transit Gateway API and CloudWatch metrics to detect packet drops and attachment bottlenecks.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install boto3
    env:
      AWS_ACCESS_KEY_ID: "{{ secret('AWS_ACCESS_KEY_ID') }}"
      AWS_SECRET_ACCESS_KEY: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
      AWS_DEFAULT_REGION: "{{ inputs.aws_region }}"
    script: |
      import os
      import json
      import boto3
      from datetime import datetime, timedelta, timezone
      from kestra import Kestra

      region = os.environ.get("AWS_DEFAULT_REGION", "us-east-1")
      tgw_filter = "{{ inputs.tgw_name_filter }}".strip().lower()
      drop_threshold = int("{{ inputs.max_packet_drop_threshold }}")

      ec2 = boto3.client("ec2", region_name=region)
      cloudwatch = boto3.client("cloudwatch", region_name=region)

      end_time = datetime.now(timezone.utc)
      start_time = end_time - timedelta(minutes=15)

      tgw_audited = 0
      attachments_audited = 0
      degraded_attachments = []

      # Describe Transit Gateways
      tgws = ec2.describe_transit_gateways().get("TransitGateways", [])

      for tgw in tgws:
          tgw_id = tgw["TransitGatewayId"]
          tags = {t["Key"]: t["Value"] for t in tgw.get("Tags", [])}
          tgw_name = tags.get("Name", tgw_id)

          if tgw_filter != "all" and tgw_filter not in tgw_name.lower():
              continue

          tgw_audited += 1

          # Describe attachments for this TGW
          attachments = ec2.describe_transit_gateway_attachments(
              Filters=[{"Name": "transit-gateway-id", "Values": [tgw_id]}]
          ).get("TransitGatewayAttachments", [])

          for att in attachments:
              att_id = att["TransitGatewayAttachmentId"]
              att_type = att["ResourceType"]
              resource_id = att.get("ResourceId", "N/A")
              state = att.get("State", "unknown")

              attachments_audited += 1

              # Query PacketDropCount and BytesDropCount from CloudWatch
              try:
                  metric_resp = cloudwatch.get_metric_data(
                      MetricDataQueries=[
                          {
                              "Id": "packet_drops",
                              "MetricStat": {
                                  "Metric": {
                                      "Namespace": "AWS/TransitGateway",
                                      "MetricName": "PacketDropCount",
                                      "Dimensions": [
                                          {"Name": "TransitGateway", "Value": tgw_id},
                                          {"Name": "TransitGatewayAttachment", "Value": att_id}
                                      ]
                                  },
                                  "Period": 900,
                                  "Stat": "Sum"
                              },
                              "ReturnData": True
                          },
                          {
                              "Id": "bytes_in",
                              "MetricStat": {
                                  "Metric": {
                                      "Namespace": "AWS/TransitGateway",
                                      "MetricName": "BytesIn",
                                      "Dimensions": [
                                          {"Name": "TransitGateway", "Value": tgw_id},
                                          {"Name": "TransitGatewayAttachment", "Value": att_id}
                                      ]
                                  },
                                  "Period": 900,
                                  "Stat": "Sum"
                              },
                              "ReturnData": True
                          }
                      ],
                      StartTime=start_time,
                      EndTime=end_time
                  )

                  results = {r["Id"]: (r["Values"][0] if r["Values"] else 0.0) for r in metric_resp.get("MetricDataResults", [])}
                  packet_drops = int(results.get("packet_drops", 0))
                  bytes_in = int(results.get("bytes_in", 0))

                  if packet_drops >= drop_threshold or state not in ["available", "initiatingRequest"]:
                      degraded_attachments.append({
                          "tgw_id": tgw_id,
                          "tgw_name": tgw_name,
                          "attachment_id": att_id,
                          "resource_type": att_type,
                          "resource_id": resource_id,
                          "state": state,
                          "packet_drops_count": packet_drops,
                          "bytes_in_megabytes": round(bytes_in / (1024 * 1024), 2),
                          "remediation": f"aws ec2 get-transit-gateway-attachment-propagations --transit-gateway-attachment-id {att_id}"
                      })
              except Exception as e:
                  print(f"Error querying telemetry for attachment {att_id}: {e}")

      Kestra.outputs({
          "tgw_audited_count": tgw_audited,
          "attachments_audited_count": attachments_audited,
          "degraded_attachments_count": len(degraded_attachments),
          "has_degraded_attachments": len(degraded_attachments) > 0,
          "degraded_attachments_details": json.dumps(degraded_attachments)
      })

  - id: check_tgw_packet_drops
    type: io.kestra.plugin.core.flow.If
    description: Evaluates whether any Transit Gateway attachment experienced packet drops or state failures.
    condition: "{{ outputs.scan_tgw_attachment_telemetry.vars.has_degraded_attachments and inputs.alert_on_drops }}"
    then:
      - id: notify_slack_tgw_drops
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches high-priority incident notifications to Slack with degraded TGW attachment IDs and packet drop metrics.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#network-alerts",
            "username": "TGW-Packet-Drop-Sentinel",
            "text": "CRITICAL: AWS Transit Gateway packet drops or attachment degradation detected in region `{{ inputs.aws_region }}`. TGWs audited: `{{ outputs.scan_tgw_attachment_telemetry.vars.tgw_audited_count }}`, Degraded attachments: `{{ outputs.scan_tgw_attachment_telemetry.vars.degraded_attachments_count }}`."
          }

  - id: log_tgw_health_status
    type: io.kestra.plugin.core.log.Log
    description: Records an operational audit trail of Transit Gateway attachment evaluations.
    message: "TGW attachment audit completed for region '{{ inputs.aws_region }}'. Attachments: {{ outputs.scan_tgw_attachment_telemetry.vars.attachments_audited_count }}, Degraded: {{ outputs.scan_tgw_attachment_telemetry.vars.degraded_attachments_count }}."

  - id: export_tgw_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Emits structured manifest of Transit Gateway attachment packet drops and route table associations.
    format:
      region: "{{ inputs.aws_region }}"
      tgw_name_filter: "{{ inputs.tgw_name_filter }}"
      tgw_audited_count: "{{ outputs.scan_tgw_attachment_telemetry.vars.tgw_audited_count }}"
      attachments_audited_count: "{{ outputs.scan_tgw_attachment_telemetry.vars.attachments_audited_count }}"
      degraded_attachments_count: "{{ outputs.scan_tgw_attachment_telemetry.vars.degraded_attachments_count }}"
      details: "{{ outputs.scan_tgw_attachment_telemetry.vars.degraded_attachments_details }}"

triggers:
  - id: scheduled_tgw_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: Automated schedule trigger auditing Transit Gateway attachment drops every 15 minutes.
    cron: "*/15 * * * *"

extend:
  title: AWS Transit Gateway Attachment Packet Drop Sentinel
  metaTitle: AWS Transit Gateway Attachment Packet Drop Sentinel Blueprint
  shortDescription: Audits AWS Transit Gateway attachments to detect packet drops, blackhole routes, and attachment state degradations.
  metaDescription: Audits AWS Transit Gateway attachments for packet drops and blackhole routing errors, dispatching diagnostic incident alerts to cloud networking teams.
  description: |
    Enterprise multi-VPC networks rely on AWS Transit Gateway (TGW) as a central hub interconnecting hundreds of Virtual Private Clouds, Direct Connect gateways, and SD-WAN appliances. When routing tables contain blackhole routes, security groups misconfigure MTU sizes, or bandwidth limits exceed 50 Gbps burst allocations, Transit Gateway silently drops transit packets. This leads to inter-VPC connection timeouts, database synchronization failures, and silent data stream stalls. This sentinel interrogates AWS Transit Gateway APIs and CloudWatch metrics on a scheduled interval, detects packet drop surges across regional attachments, and delivers actionable routing diagnostic cards to cloud networking teams on Slack.

    ## How it works
    1. **Scheduled triggering**: Executes every 15 minutes via automated cron trigger (`*/15 * * * *`) or runs on-demand via manual API execution.
    2. **Transit gateway discovery**: Queries the Amazon EC2 API (`describe_transit_gateways`) to discover active regional TGWs matching the configured filter.
    3. **Attachment enumeration**: Calls `describe_transit_gateway_attachments` to list VPC, VPN, and Peering attachments across all discovered hubs.
    4. **CloudWatch metrics retrieval**: Fetches `PacketDropCount` and `BytesIn` metrics across a 15-minute evaluation window per attachment.
    5. **Threshold evaluation**: Compares observed packet drop counts against `max_packet_drop_threshold` and verifies attachment state availability.
    6. **Conditional escalation**: An `io.kestra.plugin.core.flow.If` task evaluates whether any attachment exceeds packet drop limits.
    7. **Slack incident dispatch**: Emits rich incident notifications to `#network-alerts` detailing TGW names, attachment IDs, resource types, and CLI diagnostic commands.
    8. **Audit trail logging and return**: Logs operational execution status and returns a structured JSON manifest for network post-mortems.

    ## Architecture diagram
    ```mermaid
    flowchart TD
      A[scheduled_tgw_audit Schedule Trigger] --> B[scan_tgw_attachment_telemetry Python Script]
      B --> C[check_tgw_packet_drops Flowable If]
      C -- Packet Drops Detected --> D[notify_slack_tgw_drops Webhook]
      C -- Network Healthy --> E[log_tgw_health_status Log]
      D --> E
      E --> F[export_tgw_manifest Return]
    ```

    ## Use cases
    - **Blackhole route detection**: Identify VPC attachments where routing table updates orphaned target subnets, resulting in dropped packets.
    - **Inter-VPC bandwidth throttling**: Detect high-throughput analytics pipelines saturating Transit Gateway attachment bandwidth limits.
    - **Cross-account attachment state monitoring**: Catch shared RAM attachments that transitioned to `rejected` or `failing` states.

    ## Inputs
    | Name | Type | Default | Description |
    | :--- | :--- | :--- | :--- |
    | `aws_region` | `STRING` | `us-east-1` | Target AWS region where Transit Gateway and VPC attachments reside. |
    | `tgw_name_filter` | `STRING` | `all` | Name or substring filter of Transit Gateways to audit, or all to scan all regional TGWs. |
    | `max_packet_drop_threshold` | `INT` | `100` | Maximum allowable dropped packets within the 15-minute evaluation window before triggering alerts. |
    | `alert_on_drops` | `BOOL` | `true` | Whether to dispatch automated Slack incident notifications when Transit Gateway packet drops are detected. |

    ## Expected outputs
    - `{{ outputs.scan_tgw_attachment_telemetry.vars.tgw_audited_count }}`: Number of Transit Gateways evaluated during the audit.
    - `{{ outputs.scan_tgw_attachment_telemetry.vars.attachments_audited_count }}`: Number of attachments inspected.
    - `{{ outputs.scan_tgw_attachment_telemetry.vars.degraded_attachments_count }}`: Number of attachments experiencing packet drops or failures.
    - `{{ outputs.scan_tgw_attachment_telemetry.vars.degraded_attachments_details }}`: Serialized JSON array of degraded attachments with packet drop metrics.
    - `{{ outputs.export_tgw_manifest.value }}`: Structured dictionary containing the consolidated network routing report.

    ## Prerequisites
    - Outbound HTTPS network access from Kestra execution workers to AWS EC2 and CloudWatch endpoints.
    - AWS IAM credentials configured with `ec2:DescribeTransitGateways`, `ec2:DescribeTransitGatewayAttachments`, and `cloudwatch:GetMetricData` permissions.
    - Slack incoming webhook endpoint configured for network incident alerting.

    ### Secrets
    - `AWS_ACCESS_KEY_ID`: AWS IAM access key with permissions to read Transit Gateway metadata and CloudWatch metrics.
    - `AWS_SECRET_ACCESS_KEY`: AWS IAM secret key corresponding to the access key.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL used to dispatch network incident notifications.

    ## Quick start
    1. Define `AWS_ACCESS_KEY_ID`, `AWS_SECRET_ACCESS_KEY`, and `SLACK_WEBHOOK_URL` in your Kestra Secret storage.
    2. Import this workflow into your Kestra instance under the `company.network` namespace.
    3. Configure `aws_region` and `tgw_name_filter` to target your production Transit Gateway environments.
    4. Run a manual execution to test attachment discovery and verify Slack incident reporting.

    ## Common pitfalls and troubleshooting
    - **Multi-account setups**: In AWS Organizations setups with Resource Access Manager (RAM), ensure the IAM credentials have visibility into cross-account attachments.
    - **Metric dimensions**: Transit Gateway CloudWatch metrics require both `TransitGateway` and `TransitGatewayAttachment` dimensions to isolate specific attachments.
    - **Jumbo frames MTU**: Packet drops often occur when jumbo frames (9001 MTU) traverse peerings that only support standard 1500 byte MTU.

    ## How to extend
    - **Automated route repair**: Add an automated step to inspect the associated TGW route table and flag blackhole route CIDRs.
    - **PagerDuty network escalation**: Escalate critical inter-region backbone packet drops directly to the on-call network operations engineer.
    - **VPC flow logs correlation**: Automatically trigger CloudWatch Logs Insights queries over VPC flow logs to identify specific source and destination IPs being dropped.

    ## Links
    - [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
    - [AWS Transit Gateway CloudWatch Metrics](https://docs.aws.amazon.com/vpc/latest/tgw/transit-gateway-cloudwatch-metrics.html)
    - [Boto3 EC2 Client Reference](https://boto3.amazonaws.com/v1/documentation/api/latest/reference/services/ec2.html)
  tags:
    - Cloud
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - Day 2 Operations
  ee: false
  demo: false
