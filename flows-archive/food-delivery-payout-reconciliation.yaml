id: food-delivery-payout-reconciliation
namespace: company.team
description: |
  Reconcile a restaurant's delivery orders with the food delivery platform's
  weekly payout report: find orders that were never paid, payouts for orders
  the POS doesn't know, commission above the contracted rate, wrong GST on
  fees, unexplained deductions and refunds charged to the restaurant.

inputs:
  - id: pos_orders
    type: FILE
    required: false
    description: CSV of delivery orders from the restaurant POS with the columns order_id, platform, order_time, order_value (food value incl. taxes) and status (DELIVERED or CANCELLED). Leave empty to use the built-in sample.
  - id: payout_report
    type: FILE
    required: false
    description: CSV of the platform's payout report with the columns order_id, platform, order_value, commission, gst_on_fees, other_deductions, refund_charged and net_payout. Leave empty to use the built-in sample.
  - id: commission_rates
    type: JSON
    defaults: '{"SwiftEats": 0.22, "TastyRun": 0.20}'
    description: Contracted commission rate per platform, as a share of the order value. The platform names must match the ones in both files.
  - id: gst_on_fees_rate
    type: FLOAT
    defaults: 0.18
    description: GST rate charged on the platform's commission (18% in India).
  - id: tolerance
    type: FLOAT
    defaults: 1
    description: Difference in rupees that is still treated as a match, to absorb rounding.
  - id: notify_slack
    type: BOOL
    defaults: false
    description: Post the findings to Slack when money is missing or overcharged. Requires the SLACK_WEBHOOK_URL secret.

triggers:
  - id: weekly_after_payout
    type: io.kestra.plugin.core.trigger.Schedule
    description: Run every Tuesday at 10:00 IST, after the weekly payout reports usually arrive. Shipped disabled; enable it once the flow reads your real POS export and payout reports instead of the samples.
    cron: "0 10 * * TUE"
    timezone: Asia/Kolkata
    disabled: true

tasks:
  - id: sample_pos_orders
    type: io.kestra.plugin.core.storage.Write
    description: One week of delivery orders from two platforms as recorded in the POS, with one example of every problem the reconciliation catches. The platform names are fictional. Only used when pos_orders is empty.
    extension: .csv
    content: |
      order_id,platform,order_time,order_value,status
      SE-10231,SwiftEats,2026-09-28 12:41:00,640.00,DELIVERED
      SE-10232,SwiftEats,2026-09-28 13:05:00,1180.00,DELIVERED
      SE-10233,SwiftEats,2026-09-28 20:14:00,455.00,DELIVERED
      SE-10234,SwiftEats,2026-09-29 19:52:00,890.00,DELIVERED
      SE-10235,SwiftEats,2026-09-30 21:10:00,720.00,CANCELLED
      SE-10236,SwiftEats,2026-10-01 13:22:00,1340.00,DELIVERED
      SE-10237,SwiftEats,2026-10-02 20:45:00,560.00,DELIVERED
      TR-55801,TastyRun,2026-09-28 19:30:00,780.00,DELIVERED
      TR-55802,TastyRun,2026-09-29 13:15:00,1020.00,DELIVERED
      TR-55803,TastyRun,2026-09-30 20:05:00,395.00,DELIVERED
      TR-55804,TastyRun,2026-10-01 21:40:00,860.00,DELIVERED
      TR-55805,TastyRun,2026-10-03 12:55:00,1500.00,DELIVERED

  - id: sample_payout_report
    type: io.kestra.plugin.core.storage.Write
    description: The platforms' payout reports for the same week. Only used when payout_report is empty.
    extension: .csv
    content: |
      order_id,platform,order_value,commission,gst_on_fees,other_deductions,refund_charged,net_payout
      SE-10231,SwiftEats,640.00,140.80,25.34,0,0,473.86
      SE-10232,SwiftEats,1180.00,306.80,55.22,0,0,817.98
      SE-10233,SwiftEats,455.00,100.10,18.02,0,455.00,-118.12
      SE-10234,SwiftEats,890.00,195.80,35.24,45.00,0,613.96
      SE-10236,SwiftEats,1340.00,294.80,53.06,0,0,992.14
      SE-10299,SwiftEats,510.00,112.20,20.20,0,0,377.60
      TR-55801,TastyRun,780.00,156.00,28.08,0,0,595.92
      TR-55802,TastyRun,1020.00,204.00,36.72,0,0,779.28
      TR-55803,TastyRun,359.00,71.80,12.92,0,0,274.28
      TR-55804,TastyRun,860.00,172.00,34.40,0,0,653.60
      TR-55805,TastyRun,1500.00,300.00,54.00,0,0,1100.00

  - id: reconcile
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: Match POS orders with payout lines and recompute the expected commission, GST on fees and net payout in DuckDB, without calling any platform API. The per-order report is exported to CSV and the last query returns the totals.
    inputFiles:
      pos.csv: "{{ inputs.pos_orders ?? outputs.sample_pos_orders.uri }}"
      payouts.csv: "{{ inputs.payout_report ?? outputs.sample_payout_report.uri }}"
    outputFiles:
      - payout_reconciliation.csv
    fetchType: FETCH_ONE
    sql: |
      CREATE MACRO amount(x) AS CAST(coalesce(nullif(trim(x), ''), '0') AS DECIMAL(15, 2));

      CREATE TABLE rates AS
      SELECT key AS platform, CAST(value AS DECIMAL(9, 4)) AS commission_rate
      FROM json_each('{{ inputs.commission_rates | toJson }}');

      CREATE TABLE pos AS
      SELECT
        upper(trim(order_id)) AS order_id,
        trim(platform) AS platform,
        CAST(order_time AS TIMESTAMP) AS order_time,
        amount(order_value) AS order_value,
        upper(trim(coalesce(status, 'DELIVERED'))) AS status
      FROM read_csv('{{ workingDir }}/pos.csv', header = true, all_varchar = true);

      CREATE TABLE payouts AS
      SELECT
        upper(trim(order_id)) AS order_id,
        trim(platform) AS platform,
        amount(order_value) AS order_value,
        amount(commission) AS commission,
        amount(gst_on_fees) AS gst_on_fees,
        amount(other_deductions) AS other_deductions,
        amount(refund_charged) AS refund_charged,
        amount(net_payout) AS net_payout
      FROM read_csv('{{ workingDir }}/payouts.csv', header = true, all_varchar = true);

      CREATE TABLE matched AS
      SELECT
        coalesce(o.order_id, p.order_id) AS order_id,
        coalesce(o.platform, p.platform) AS platform,
        o.order_time,
        o.status AS pos_status,
        o.order_value AS pos_value,
        p.order_value AS paid_value,
        p.commission,
        p.gst_on_fees,
        p.other_deductions,
        p.refund_charged,
        p.net_payout,
        p.order_id IS NOT NULL AS in_payout,
        o.order_id IS NOT NULL AS in_pos,
        r.commission_rate,
        round(p.order_value * r.commission_rate, 2) AS expected_commission,
        round(p.commission * {{ inputs.gst_on_fees_rate }}, 2) AS expected_gst,
        p.order_value - p.commission - p.gst_on_fees - p.other_deductions - p.refund_charged AS expected_net
      FROM pos o
      FULL OUTER JOIN payouts p ON p.order_id = o.order_id
      LEFT JOIN rates r ON r.platform = coalesce(o.platform, p.platform);

      CREATE TABLE report AS
      SELECT
        CASE WHEN len(errors) > 0 THEN 'ERROR' WHEN len(warnings) > 0 THEN 'WARNING' ELSE 'OK' END AS result,
        order_id,
        platform,
        order_time,
        pos_status,
        pos_value,
        paid_value,
        commission,
        expected_commission,
        gst_on_fees,
        other_deductions,
        refund_charged,
        net_payout,
        money_at_stake,
        array_to_string(list_concat(errors, warnings), ' | ') AS issues
      FROM (
        SELECT
          *,
          list_filter([
            CASE WHEN in_pos AND NOT in_payout AND pos_status = 'DELIVERED' THEN 'Delivered order missing from the payout report' END,
            CASE WHEN in_pos AND in_payout AND abs(pos_value - paid_value) > {{ inputs.tolerance }} THEN 'Order value is Rs ' || pos_value || ' in the POS but Rs ' || paid_value || ' in the payout report' END,
            CASE WHEN in_payout AND commission_rate IS NULL THEN 'No contracted commission rate for platform ' || platform || ' in commission_rates' END,
            CASE WHEN in_payout AND commission - expected_commission > {{ inputs.tolerance }} THEN 'Commission Rs ' || commission || ' is above the contracted ' || round(commission_rate * 100, 1) || '% (Rs ' || expected_commission || ')' END,
            CASE WHEN in_payout AND abs(gst_on_fees - expected_gst) > {{ inputs.tolerance }} THEN 'GST on fees Rs ' || gst_on_fees || ', expected Rs ' || expected_gst || ' on a commission of Rs ' || commission END,
            CASE WHEN in_payout AND abs(net_payout - expected_net) > {{ inputs.tolerance }} THEN 'Net payout Rs ' || net_payout || ' does not add up, expected Rs ' || expected_net END,
            CASE WHEN in_payout AND refund_charged > 0 AND pos_status = 'DELIVERED' THEN 'Refund of Rs ' || refund_charged || ' charged to the restaurant for an order the POS marks as delivered (dispute it if the food was correct)' END
          ], lambda x: x IS NOT NULL) AS errors,
          list_filter([
            CASE WHEN in_payout AND NOT in_pos THEN 'Paid order the POS does not know (not punched in the POS, or another outlet''s order)' END,
            CASE WHEN in_payout AND other_deductions > 0 THEN 'Unexplained deduction of Rs ' || other_deductions || ', ask the platform for the reason' END,
            CASE WHEN in_pos AND NOT in_payout AND pos_status = 'CANCELLED' THEN 'Cancelled order with no payout line, confirm the cancellation was not the platform''s fault' END
          ], lambda x: x IS NOT NULL) AS warnings,
          CASE
            WHEN in_pos AND NOT in_payout AND pos_status = 'DELIVERED' THEN pos_value
            ELSE greatest(coalesce(pos_value - paid_value, 0), 0)
              + greatest(coalesce(commission - expected_commission, 0), 0)
              + greatest(coalesce(gst_on_fees - expected_gst, 0), 0)
              + coalesce(other_deductions, 0)
              + CASE WHEN pos_status = 'DELIVERED' THEN coalesce(refund_charged, 0) ELSE 0 END
              + greatest(coalesce(expected_net - net_payout, 0), 0)
          END AS money_at_stake
        FROM matched
      )
      ORDER BY CASE result WHEN 'ERROR' THEN 0 WHEN 'WARNING' THEN 1 ELSE 2 END, platform, order_id;

      COPY report TO '{{ outputFiles["payout_reconciliation.csv"] }}' (HEADER, DELIMITER ',');

      SELECT
        count(*) FILTER (WHERE pos_status IS NOT NULL) AS pos_orders,
        count(*) FILTER (WHERE net_payout IS NOT NULL) AS paid_orders,
        coalesce(sum(net_payout), 0) AS total_payout,
        coalesce(sum(money_at_stake) FILTER (WHERE result <> 'OK'), 0) AS money_at_stake,
        count(*) FILTER (WHERE result = 'OK') AS ok_count,
        count(*) FILTER (WHERE result = 'WARNING') AS warning_count,
        count(*) FILTER (WHERE result = 'ERROR') AS error_count,
        coalesce(string_agg(platform || ' ' || order_id || ': ' || issues, chr(10)) FILTER (WHERE result = 'ERROR'), '') AS error_details,
        coalesce(string_agg(platform || ' ' || order_id || ': ' || issues, chr(10)) FILTER (WHERE result = 'WARNING'), '') AS warning_details
      FROM report;

  - id: route_findings
    type: io.kestra.plugin.core.flow.If
    description: Branch on the result. Errors mean money the restaurant should claim back, so they are logged and optionally sent to Slack; a clean week is logged so the execution history doubles as the payout audit trail.
    condition: "{{ outputs.reconcile.outputs[0].row.error_count > 0 }}"
    then:
      - id: log_errors
        type: io.kestra.plugin.core.log.Log
        level: WARN
        description: Write every order to raise with the platform and the reason to the execution logs.
        message: |
          Payout reconciliation: Rs {{ outputs.reconcile.outputs[0].row.money_at_stake | numberFormat('#,##0.00') }} to claim or explain. {{ outputs.reconcile.outputs[0].row.error_count }} error(s), {{ outputs.reconcile.outputs[0].row.warning_count }} warning(s), {{ outputs.reconcile.outputs[0].row.ok_count }} matched. Total payout Rs {{ outputs.reconcile.outputs[0].row.total_payout | numberFormat('#,##0.00') }}.
          Errors:
          {{ outputs.reconcile.outputs[0].row.error_details }}
          Warnings:
          {{ outputs.reconcile.outputs[0].row.warning_details }}

      - id: slack_enabled
        type: io.kestra.plugin.core.flow.If
        description: Only call Slack when the notify_slack input is true, so the flow runs out of the box without any secret.
        condition: "{{ inputs.notify_slack }}"
        then:
          - id: alert_restaurant_owner
            type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
            description: Tell the owner which orders to raise with each platform's support.
            url: "{{ secret('SLACK_WEBHOOK_URL') }}"
            messageText: |
              :warning: Delivery payout reconciliation: Rs {{ outputs.reconcile.outputs[0].row.money_at_stake | numberFormat('#,##0.00') }} to claim or explain across {{ outputs.reconcile.outputs[0].row.error_count }} order(s).
              {{ outputs.reconcile.outputs[0].row.error_details }}
              Full report: execution {{ execution.id }} in flow {{ flow.namespace }}.{{ flow.id }}
    else:
      - id: log_clean
        type: io.kestra.plugin.core.log.Log
        description: Record a clean week.
        message: "Payout reconciliation passed: {{ outputs.reconcile.outputs[0].row.paid_orders }} paid orders, total payout Rs {{ outputs.reconcile.outputs[0].row.total_payout | numberFormat('#,##0.00') }}, {{ outputs.reconcile.outputs[0].row.warning_count }} warning(s)."

errors:
  - id: log_reconciliation_failure
    type: io.kestra.plugin.core.log.Log
    level: ERROR
    description: Make a failed reconciliation loud. If a file is missing or malformed, nothing was matched, and a silent failure must not be mistaken for a clean week.
    message: "Payout reconciliation FAILED in {{ flow.namespace }}.{{ flow.id }} (execution {{ execution.id }}). Nothing was matched. Check the columns of pos_orders and payout_report, and the platform names in commission_rates."

outputs:
  - id: payout_reconciliation
    type: FILE
    description: One row per order with result (ERROR, WARNING or OK), POS and payout values, commission and expected commission, GST on fees, deductions, refund, net payout, money at stake and the reasons.
    value: "{{ outputs.reconcile.outputFiles['payout_reconciliation.csv'] }}"
  - id: reconciliation_summary
    type: JSON
    description: 'Totals and details, e.g. {"total_payout": 6560.5, "money_at_stake": 1192.64, "error_count": 6, ...}.'
    value: "{{ outputs.reconcile.outputs[0].row | toJson }}"

extend:
  title: Reconcile Food Delivery Platform Payouts Against Your Restaurant POS
  shortDescription: Weekly DuckDB check of delivery platform payout reports against POS orders that finds unpaid orders, commission and GST overcharges, refunds and deductions to claim back.
  metaTitle: Food Delivery Payout Reconciliation for Restaurants
  metaDescription: Match delivery platform payouts to POS orders weekly. Catch unpaid orders, commission above contract, wrong GST on fees and refunds charged to you.
  description: |
    Restaurants that sell through food delivery platforms get paid in a weekly payout report, after commission, GST on that commission, ad fees, penalties and customer refunds are taken out. Few owners check it line by line. Orders go missing from the report, commission is charged above the contracted rate, refunds are charged back for food that was delivered fine, and unexplained deductions add up week after week. This blueprint reconciles every payout line against the orders recorded in the restaurant's POS, recomputes what each line should have paid, and tells the owner exactly which orders to raise with the platform and how much money is at stake. Everything runs locally in DuckDB: no platform API, no credentials, and no sales data leaving your Kestra instance.

    ## How it works

    1. `sample_pos_orders` and `sample_payout_report` (`io.kestra.plugin.core.storage.Write`) write one week of delivery orders from two fictional platforms and their payout reports, with one example of every problem. They are used only when the matching input is empty, so the flow runs out of the box.
    2. `reconcile` (`io.kestra.plugin.jdbc.duckdb.Queries`) loads both CSV files through `inputFiles`, reads the contracted commission rates from the `commission_rates` JSON input with `json_each`, matches orders by order ID and recomputes the expected commission, GST on fees and net payout. It reports:
       - **errors**: a delivered order missing from the payout report, an order value that differs from the POS, commission above the contracted rate, GST on fees that is not `gst_on_fees_rate` of the commission, a net payout that does not add up, a refund charged for an order the POS marks as delivered, and a platform without a contracted rate;
       - **warnings**: a paid order the POS does not know, an unexplained deduction, and a cancelled order with no payout line.

       Every row also gets `money_at_stake`, the amount to claim back or have explained. The per-order report is written with `outputFiles`, and the final `SELECT` returns the totals through `fetchType: FETCH_ONE`, available as `outputs.reconcile.outputs[0].row`.
    3. `route_findings` (`io.kestra.plugin.core.flow.If`) logs every error and warning when there is at least one error, and a nested `If` posts the findings to Slack when `notify_slack` is `true`. A clean week is logged as well.
    4. The `errors` block logs a failed run loudly, because a reconciliation that silently does not run looks the same as a clean week.
    5. The `weekly_after_payout` `Schedule` trigger (Tuesday 10:00 IST, shipped disabled) runs after the weekly payout reports usually arrive.

    ## What you get

    - `outputs.payout_reconciliation`: CSV with `result` (`ERROR`, `WARNING` or `OK`), `order_id`, `platform`, `order_time`, `pos_status`, `pos_value`, `paid_value`, `commission`, `expected_commission`, `gst_on_fees`, `other_deductions`, `refund_charged`, `net_payout`, `money_at_stake` and `issues`, errors first.
    - `outputs.reconciliation_summary`: JSON with `pos_orders`, `paid_orders`, `total_payout`, `money_at_stake`, `ok_count`, `warning_count`, `error_count`, `error_details` and `warning_details`.
    - With the sample data: Rs 1,192.64 to claim or explain across 6 errors (commission charged at 26% instead of 22%, a Rs 455 refund for a delivered order, a delivered order never paid, an order paid on Rs 359 instead of Rs 395, GST on fees charged at 20%, and a net payout Rs 46 short) and 3 warnings (an unexplained Rs 45 deduction, a cancelled order, and a paid order the POS does not know). 4 orders match exactly.

    ## Who it's for

    - Restaurant owners and cloud kitchens that sell on one or more food delivery platforms.
    - Finance teams of restaurant chains reconciling payouts for many outlets.
    - POS and restaurant software teams that want to offer payout reconciliation to their customers.

    ## Why orchestrate this with Kestra

    A spreadsheet can check one week once. Kestra runs the check every week, keeps every week's report in the execution history as evidence for disputes, branches on the result and alerts the owner before the dispute window closes. Because the inputs are plain files, the same flow can be triggered when a payout report lands in email, S3, SFTP or Google Drive, or run per outlet with a `ForEach`.

    ## Prerequisites

    - Nothing for the demo: the sample files are built in.
    - For your own data: a CSV export of delivery orders from your POS and the platforms' payout reports with the columns below. Map each platform's column names to these once, for example with a small Python or SQL step before `reconcile`.

    ### Inputs

    - `pos_orders` (FILE, optional): `order_id`, `platform`, `order_time`, `order_value` and `status` (`DELIVERED` or `CANCELLED`).
    - `payout_report` (FILE, optional): `order_id`, `platform`, `order_value`, `commission`, `gst_on_fees`, `other_deductions`, `refund_charged` and `net_payout`.
    - `commission_rates` (JSON, default `{"SwiftEats": 0.22, "TastyRun": 0.20}`): contracted commission rate per platform.
    - `gst_on_fees_rate` (FLOAT, default `0.18`): GST rate on the platform's commission.
    - `tolerance` (FLOAT, default `1`): difference in rupees still treated as a match.
    - `notify_slack` (BOOL, default `false`): post the findings to Slack when there is at least one error.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack incoming webhook URL. Only needed when `notify_slack` is `true`.

    ## Quick start

    1. Save the flow and run it with the default inputs.
    2. Open the logs of `log_errors` and download `payout_reconciliation` from the Outputs tab.
    3. Run it again with your own POS export, payout report and contracted rates.
    4. Optional: add the `SLACK_WEBHOOK_URL` secret and set `notify_slack` to `true`.
    5. Point the inputs at your real sources and set `disabled: false` on `weekly_after_payout`.

    ## Common pitfalls

    - Use the same order IDs on both sides. Most POS integrations store the platform's order ID; if yours does not, match on the platform order ID stored in the order notes.
    - Commission slabs, promotions you agreed to fund, packaging charges and taxes withheld at source (TCS and TDS) differ by platform and contract. Add them as extra columns or deductions so they are not reported as unexplained.
    - Platforms raise disputes only within a short window, so run the check every week rather than at month end.

    ## How to extend

    - Read orders straight from your POS database (Postgres, MySQL) instead of a CSV export.
    - Parse the payout report attachment from email with the email trigger before reconciling.
    - Run it per outlet with a `ForEach` and write the results to a warehouse for a monthly commission dashboard.
    - Open one support ticket per error with the platform's support channel or your helpdesk.

    ## Links

    - [Kestra DuckDB plugin](https://kestra.io/plugins/plugin-jdbc/duckdb)
    - [Kestra Slack plugin](https://kestra.io/plugins/plugin-slack)
    - [DuckDB JSON functions](https://duckdb.org/docs/stable/data/json/json_functions)

    - This blueprint has been created by [Ankith-m1006](https://github.com/Ankith-m1006)
  tags:
    - Business
    - Data
  subTags:
    - Reporting & Digests
    - Testing & Quality
  ee: false
  demo: false
