id: purchase-accruals-grni-close
namespace: company.team

description: |
  Month-end purchase accruals: goods and services received but not yet invoiced (GRNI),
  recurring services whose invoice has not arrived, three-way match exceptions and stale
  receipts. Builds the accrual journal and its automatic reversal on day one of the next
  month, explains the movement against last month, and locks the period.

inputs:
  - id: period
    type: STRING
    displayName: Period (YYYY-MM)
    defaults: "2026-08"
    validator: ^\d{4}-(0[1-9]|1[0-2])$

  - id: scenario
    type: SELECT
    displayName: Demo scenario
    description: >
      CLEAN: consistent purchasing data. ISSUES: a receipt against a purchase order that does
      not exist, a vendor invoicing more than was received, and an invoice 18% above the PO
      price, which must block the close.
    values:
      - CLEAN
      - ISSUES
    defaults: CLEAN

  - id: price_tolerance_pct
    type: FLOAT
    displayName: Price tolerance (%)
    description: Invoice price differences within this tolerance are accepted. Above it, the three-way match fails.
    defaults: 2.0

  - id: stale_after_days
    type: INT
    displayName: Stale receipt after (days)
    description: An uninvoiced receipt older than this is listed for follow-up. It is often never billed and should be written back.
    defaults: 90

  - id: review_threshold
    type: FLOAT
    displayName: Review threshold
    description: A single accrual line above this, or a total that moves more than 25% against last month, needs approved_by.
    defaults: 20000.0

  - id: approved_by
    type: STRING
    displayName: Approved by
    defaults: ""

variables:
  lock_key: purchase_accrual_close
  pack_dir: "accruals/{{ inputs.period }}"

concurrency:
  limit: 1

triggers:
  - id: first_business_day
    type: io.kestra.plugin.core.trigger.Schedule
    description: The 1st of each month at 20:00, for the month that just ended. Disabled until the data sources are wired in.
    cron: "0 20 1 * *"
    disabled: true

tasks:
  - id: period_control
    type: io.kestra.plugin.core.output.OutputValues
    values:
      last_closed: "{{ (kv(vars.lock_key, errorOnMissing=false) ?? {'period': ''}) | jq('.period') | first }}"
      last_total: "{{ (kv(vars.lock_key, errorOnMissing=false) ?? {'accrual_total': 0}) | jq('.accrual_total') | first }}"
      previous_period: "{{ (inputs.period ~ '-01') | date('yyyy-MM-dd') | dateAdd(-1, 'MONTHS') | date('yyyy-MM') }}"
      period_end: "{{ (inputs.period ~ '-01') | date('yyyy-MM-dd') | dateAdd(1, 'MONTHS') | dateAdd(-1, 'DAYS') | date('yyyy-MM-dd') }}"
      reversal_date: "{{ (inputs.period ~ '-01') | date('yyyy-MM-dd') | dateAdd(1, 'MONTHS') | date('yyyy-MM-dd') }}"

  - id: period_gate
    type: io.kestra.plugin.core.flow.If
    condition: >-
      {{ outputs.period_control.values.last_closed != ''
         and (outputs.period_control.values.last_closed >= inputs.period
              or outputs.period_control.values.last_closed != outputs.period_control.values.previous_period) }}
    then:
      - id: period_refused
        type: io.kestra.plugin.core.execution.Fail
        errorMessage: >-
          {{ outputs.period_control.values.last_closed >= inputs.period
             ? 'Period ' ~ inputs.period ~ ' is already closed (last closed: ' ~ outputs.period_control.values.last_closed ~ ').'
             : 'Period ' ~ outputs.period_control.values.previous_period ~ ' must be closed before ' ~ inputs.period ~ ' (last closed: ' ~ outputs.period_control.values.last_closed ~ ').' }}

  - id: accrue
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: >
      One DuckDB session: purchasing data (demo generator or your exports), the three-way
      match per PO line at period end, recurring service accruals, blockers, the accrual
      journal, its reversal and the movement against last month.
    outputFiles:
      - grni
      - services
      - exceptions
      - accrual_journal
      - reversal_journal
      - blockers
    fetchType: FETCH_ONE
    sql: |
      SET VARIABLE p_start = DATE '{{ inputs.period }}-01';
      SET VARIABLE p_end = DATE '{{ outputs.period_control.values.period_end }}';
      SET VARIABLE tol = {{ inputs.price_tolerance_pct }} / 100.0;

      -- =======================================================================
      -- Demo data at fixed dates. Replace with your ERP exports.
      -- =======================================================================
      CREATE TABLE po_lines AS
      SELECT 'PO-' || (4100 + i // 3) AS po, 1 + i % 3 AS line,
             ['Acme Industrial', 'Northwind Supplies', 'Globex Components', 'Initech IT', 'Umbrella Logistics', 'Stark Packaging'][1 + i % 6] AS vendor,
             ['Raw materials', 'Packaging', 'IT equipment', 'Maintenance parts', 'Office supplies'][1 + (i * 7) % 5] AS category,
             DATE '2026-04-01' + ((i * 11) % 180)::INT AS ordered_on,
             (10 + (i * 37) % 190)::INT AS qty,
             (5 + (i * 7919) % 900 / 10.0)::DECIMAL(12, 2) AS unit_price
      FROM range(0, 150) t(i);

      CREATE TABLE accounts (category VARCHAR, account VARCHAR);
      INSERT INTO accounts VALUES ('Raw materials', '1400'), ('Packaging', '1410'), ('IT equipment', '6300'),
                                  ('Maintenance parts', '6410'), ('Office supplies', '6420');

      -- Most lines arrive in one delivery, one in five in two. Lead times 4 to 40 days.
      CREATE TABLE receipts AS
      SELECT 'GRN-' || row_number() OVER (ORDER BY po, line, n) AS grn, po, line, received_on, qty FROM (
        SELECT po, line, 1 AS n, ordered_on + (4 + (line * 13 + hash(po) % 37))::INT AS received_on,
               CASE WHEN hash(po || line) % 5 = 0 THEN qty // 2 ELSE qty END AS qty FROM po_lines
        UNION ALL
        SELECT po, line, 2, ordered_on + (30 + hash(po) % 25)::INT, qty - qty // 2 FROM po_lines WHERE hash(po || line) % 5 = 0
      )
      {% if inputs.scenario == 'ISSUES' %}
      UNION ALL SELECT 'GRN-X1', 'PO-9999', 1, DATE '{{ inputs.period }}-12', 40
      {% endif %};

      -- Vendors invoice 0 to 50 days after each receipt. About one receipt in fourteen is never invoiced.
      CREATE TABLE invoices AS
      SELECT 'INV-' || g.grn AS invoice, g.po, g.line, g.received_on + (hash(g.grn) % 51)::INT AS invoiced_on, g.qty,
             (p.unit_price * CASE WHEN hash(g.grn) % 9 = 0 THEN 1.01 ELSE 1 END)::DECIMAL(12, 2) AS unit_price
      FROM receipts g JOIN po_lines p USING (po, line)
      WHERE hash(g.grn) % 14 <> 0
      {% if inputs.scenario == 'ISSUES' %}
      UNION ALL SELECT 'INV-OVER', 'PO-4107', 2, DATE '{{ inputs.period }}-18', 500, (SELECT unit_price FROM po_lines WHERE po = 'PO-4107' AND line = 2)
      {% endif %};
      {% if inputs.scenario == 'ISSUES' %}
      -- The vendor billed 18% above the PO price.
      UPDATE invoices SET unit_price = (unit_price * 1.18)::DECIMAL(12, 2) WHERE po = 'PO-4120' AND line = 1;
      {% endif %}

      -- Recurring services billed monthly in arrears. Fixed fees accrue the contract amount;
      -- variable ones (utilities, freight) accrue the average of the last three invoices.
      CREATE TABLE service_contracts (contract VARCHAR, vendor VARCHAR, service VARCHAR, account VARCHAR, basis VARCHAR, monthly_fee DECIMAL(12, 2));
      INSERT INTO service_contracts VALUES
        ('SC-01', 'BrightClean', 'Office cleaning', '6510', 'FIXED', 4200.00),
        ('SC-02', 'Sentinel Security', 'Site security', '6515', 'FIXED', 9800.00),
        ('SC-03', 'CloudCo', 'Cloud hosting', '6310', 'VARIABLE', NULL),
        ('SC-04', 'City Power', 'Electricity', '6520', 'VARIABLE', NULL),
        ('SC-05', 'FastFreight', 'Outbound freight', '6610', 'VARIABLE', NULL),
        ('SC-06', 'LegalEagle LLP', 'Retained counsel', '6710', 'FIXED', 6500.00);
      CREATE TABLE service_invoices AS
      SELECT s.contract, strftime(m, '%Y-%m') AS service_month, (m + INTERVAL 1 MONTH + INTERVAL (3 + hash(s.contract || m) % 20) DAY)::DATE AS invoiced_on,
             coalesce(s.monthly_fee, round(CASE s.contract WHEN 'SC-03' THEN 11000 WHEN 'SC-04' THEN 7400 ELSE 15500 END
                                           * (0.85 + (hash(s.contract || m) % 30) / 100.0), 2))::DECIMAL(12, 2) AS amount
      FROM service_contracts s, generate_series(DATE '2026-01-01', DATE '2026-11-01', INTERVAL 1 MONTH) g(m);

      -- =======================================================================
      -- Three-way match per PO line, as known at period end.
      -- =======================================================================
      CREATE TABLE match AS
      SELECT p.po, p.line, p.vendor, p.category, a.account, p.qty AS ordered_qty, p.unit_price AS po_price,
             coalesce(r.qty, 0) AS received_qty, r.first_received, r.last_received,
             coalesce(i.qty, 0) AS invoiced_qty, i.amount AS invoiced_amount, i.avg_price
      FROM po_lines p
      LEFT JOIN accounts a USING (category)
      LEFT JOIN (SELECT po, line, sum(qty) AS qty, min(received_on) AS first_received, max(received_on) AS last_received
                 FROM receipts WHERE received_on <= getvariable('p_end') GROUP BY po, line) r USING (po, line)
      LEFT JOIN (SELECT po, line, sum(qty) AS qty, sum(qty * unit_price) AS amount, sum(qty * unit_price) / sum(qty) AS avg_price
                 FROM invoices WHERE invoiced_on <= getvariable('p_end') GROUP BY po, line) i USING (po, line);

      -- Received and not invoiced, valued at PO price. The oldest open receipt drives the age.
      CREATE TABLE grni AS
      SELECT po, line, vendor, category, account, ordered_qty, received_qty, invoiced_qty,
             received_qty - invoiced_qty AS open_qty, po_price,
             ((received_qty - invoiced_qty) * po_price)::DECIMAL(14, 2) AS accrual,
             date_diff('day', CASE WHEN invoiced_qty = 0 THEN first_received ELSE last_received END, getvariable('p_end')) AS age_days
      FROM match WHERE received_qty > invoiced_qty;

      CREATE TABLE services AS
      WITH last3 AS (
        SELECT contract, round(avg(amount), 2) AS avg3 FROM (
          SELECT contract, amount, row_number() OVER (PARTITION BY contract ORDER BY service_month DESC) AS rn
          FROM service_invoices WHERE invoiced_on <= getvariable('p_end')
        ) WHERE rn <= 3 GROUP BY contract
      )
      SELECT s.contract, s.vendor, s.service, s.account, s.basis,
             (coalesce(s.monthly_fee, l.avg3))::DECIMAL(14, 2) AS accrual,
             CASE s.basis WHEN 'FIXED' THEN 'contract fee' ELSE 'average of the last 3 invoices' END AS method
      FROM service_contracts s LEFT JOIN last3 l USING (contract)
      WHERE NOT EXISTS (SELECT 1 FROM service_invoices si WHERE si.contract = s.contract
                          AND si.service_month = strftime(getvariable('p_start'), '%Y-%m') AND si.invoiced_on <= getvariable('p_end'));

      -- =======================================================================
      -- Exceptions for purchasing and accounts payable.
      -- =======================================================================
      CREATE TABLE exceptions AS
      SELECT 'INVOICED_NOT_RECEIVED' AS code, po || '/' || line AS ref, vendor,
             'Invoiced ' || invoiced_qty || ', received ' || received_qty || '. Hold payment of ' || ((invoiced_qty - received_qty) * po_price)::DECIMAL(14, 2) AS detail,
             ((invoiced_qty - received_qty) * po_price)::DECIMAL(14, 2) AS amount
        FROM match WHERE invoiced_qty > received_qty
      UNION ALL
      SELECT 'PRICE_VARIANCE', po || '/' || line, vendor,
             'Invoiced at ' || round(avg_price, 2) || ' against PO price ' || po_price || ' (' || round((avg_price / po_price - 1) * 100, 1) || '%)',
             ((avg_price - po_price) * invoiced_qty)::DECIMAL(14, 2)
        FROM match WHERE invoiced_qty > 0 AND abs(avg_price / po_price - 1) > getvariable('tol')
      UNION ALL
      SELECT 'RECEIVED_OVER_ORDER', po || '/' || line, vendor, 'Received ' || received_qty || ' against ' || ordered_qty || ' ordered', NULL
        FROM match WHERE received_qty > ordered_qty
      UNION ALL
      SELECT 'STALE_RECEIPT', po || '/' || line, vendor,
             'Open for ' || age_days || ' days. Ask the vendor for the invoice or write the accrual back', accrual
        FROM grni WHERE age_days > {{ inputs.stale_after_days }};

      CREATE TABLE blockers AS
      SELECT 'UNKNOWN_PO' AS code, grn AS ref, 'Receipt against ' || po || '/' || line || ', which is not an open purchase order' AS detail
        FROM receipts r WHERE NOT EXISTS (SELECT 1 FROM po_lines p WHERE p.po = r.po AND p.line = r.line) AND r.received_on <= getvariable('p_end')
      UNION ALL SELECT code, ref, vendor || ': ' || detail FROM exceptions WHERE code IN ('INVOICED_NOT_RECEIVED', 'PRICE_VARIANCE')
      UNION ALL SELECT 'NO_ACCOUNT', po || '/' || line, 'Category ' || category || ' has no account' FROM grni WHERE account IS NULL;

      -- =======================================================================
      -- Accrual journal on the last day, reversal on the first day of next month.
      -- =======================================================================
      CREATE TABLE accrual_journal AS
      SELECT row_number() OVER (ORDER BY account) AS line, DATE '{{ outputs.period_control.values.period_end }}' AS posting_date, * FROM (
        SELECT account, 'GRNI ' || category AS memo, sum(accrual) AS debit, 0.00 AS credit FROM grni GROUP BY account, category
        UNION ALL SELECT account, 'Accrued ' || service || ' (' || method || ')', accrual, 0.00 FROM services
        UNION ALL SELECT '2150', 'Goods received not invoiced', 0.00, sum(accrual) FROM grni HAVING count(*) > 0
        UNION ALL SELECT '2160', 'Accrued expenses', 0.00, sum(accrual) FROM services HAVING count(*) > 0
      );
      CREATE TABLE reversal_journal AS
      SELECT line, DATE '{{ outputs.period_control.values.reversal_date }}' AS posting_date, account, 'Reversal: ' || memo AS memo, credit AS debit, debit AS credit
      FROM accrual_journal;

      COPY (SELECT * FROM grni ORDER BY accrual DESC) TO '{{ outputFiles.grni }}' (HEADER, DELIMITER ',');
      COPY services TO '{{ outputFiles.services }}' (HEADER, DELIMITER ',');
      COPY (SELECT * FROM exceptions ORDER BY code, amount DESC NULLS LAST) TO '{{ outputFiles.exceptions }}' (HEADER, DELIMITER ',');
      COPY accrual_journal TO '{{ outputFiles.accrual_journal }}' (HEADER, DELIMITER ',');
      COPY reversal_journal TO '{{ outputFiles.reversal_journal }}' (HEADER, DELIMITER ',');
      COPY blockers TO '{{ outputFiles.blockers }}' (HEADER, DELIMITER ',');

      SELECT
        (SELECT count(*) FROM match WHERE received_qty > 0) AS lines_received,
        (SELECT count(*) FROM match WHERE received_qty > 0 AND received_qty = invoiced_qty) AS lines_fully_matched,
        (SELECT count(*) FROM grni) AS grni_lines,
        (SELECT coalesce(sum(accrual), 0) FROM grni) AS grni_total,
        (SELECT count(*) FROM services) AS service_accruals,
        (SELECT coalesce(sum(accrual), 0) FROM services) AS services_total,
        (SELECT coalesce(string_agg(service || ' ' || accrual, ', ' ORDER BY contract), '') FROM services) AS services_detail,
        (SELECT coalesce(sum(accrual), 0) FROM grni) + (SELECT coalesce(sum(accrual), 0) FROM services) AS accrual_total,
        (SELECT coalesce(max(accrual), 0) FROM (SELECT accrual FROM grni UNION ALL SELECT accrual FROM services)) AS largest_line,
        (SELECT count(*) FROM exceptions WHERE code = 'STALE_RECEIPT') AS stale_receipts,
        (SELECT coalesce(sum(amount), 0) FROM exceptions WHERE code = 'STALE_RECEIPT') AS stale_total,
        (SELECT count(*) FROM exceptions WHERE code = 'PRICE_VARIANCE') + (SELECT count(*) FROM exceptions WHERE code = 'INVOICED_NOT_RECEIVED') AS match_failures,
        (SELECT sum(debit) FROM accrual_journal) = (SELECT sum(credit) FROM accrual_journal)
          AND (SELECT sum(debit) FROM reversal_journal) = (SELECT sum(credit) FROM reversal_journal)
          AND (SELECT sum(debit) FROM accrual_journal) = (SELECT sum(credit) FROM reversal_journal) AS journals_balance,
        (SELECT count(*) FROM blockers) AS blockers,
        (SELECT coalesce(string_agg(code || ' ' || ref || ': ' || detail, '; ' ORDER BY code, ref), '') FROM blockers) AS blocker_detail;

  - id: result
    type: io.kestra.plugin.core.output.OutputValues
    values:
      r: "{{ (outputs.accrue.outputs | last).row | toJson }}"
      # Movement against last month's accrual, which reverses on day one of this month.
      swing_pct: >-
        {{ (outputs.period_control.values.last_total | number) == 0 ? 0
           : (((outputs.accrue.outputs | last).row.accrual_total - (outputs.period_control.values.last_total | number)) * 100.0 / (outputs.period_control.values.last_total | number)) | numberFormat('0.0') }}

  - id: log_close
    type: io.kestra.plugin.core.log.Log
    message: |
      Purchase accruals {{ inputs.period }} ({{ inputs.scenario }}).
      {{ outputs.result.values.r | jq('"\(.lines_received) PO lines received, \(.lines_fully_matched) fully invoiced. GRNI: \(.grni_lines) lines, \(.grni_total)."') | first }}
      {{ outputs.result.values.r | jq('"Services not yet invoiced: \(.service_accruals), \(.services_total) (\(.services_detail))."') | first }}
      {{ outputs.result.values.r | jq('"Total accrual \(.accrual_total), largest line \(.largest_line)."') | first }} Last month {{ outputs.period_control.values.last_total }}, movement {{ outputs.result.values.swing_pct }}%.
      {{ outputs.result.values.r | jq('"Stale receipts: \(.stale_receipts) worth \(.stale_total). Three-way match failures: \(.match_failures). Journals balance: \(.journals_balance)."') | first }}
      {{ outputs.result.values.r | jq('"Blockers: \(.blockers). \(.blocker_detail)"') | first }}

  - id: evidence
    type: io.kestra.plugin.core.namespace.UploadFiles
    namespace: "{{ flow.namespace }}"
    filesMap:
      "{{ render(vars.pack_dir) }}/grni.csv": "{{ outputs.accrue.outputFiles.grni }}"
      "{{ render(vars.pack_dir) }}/service-accruals.csv": "{{ outputs.accrue.outputFiles.services }}"
      "{{ render(vars.pack_dir) }}/exceptions.csv": "{{ outputs.accrue.outputFiles.exceptions }}"
      "{{ render(vars.pack_dir) }}/accrual-journal.csv": "{{ outputs.accrue.outputFiles.accrual_journal }}"
      "{{ render(vars.pack_dir) }}/reversal-journal.csv": "{{ outputs.accrue.outputFiles.reversal_journal }}"
      "{{ render(vars.pack_dir) }}/blockers.csv": "{{ outputs.accrue.outputFiles.blockers }}"

  - id: verdict
    type: io.kestra.plugin.core.output.OutputValues
    values:
      state: >-
        {%- set r = outputs.result.values.r -%}
        {%- set swing = outputs.result.values.swing_pct | number -%}
        {%- if (r | jq('.blockers') | first) > 0 -%}BLOCKED
        {%- elseif not (r | jq('.journals_balance') | first) -%}OUT_OF_BALANCE
        {%- elseif ((r | jq('.largest_line') | first) > inputs.review_threshold or swing > 25 or swing < -25) and inputs.approved_by == '' -%}NEEDS_APPROVAL
        {%- else -%}READY{%- endif -%}

  - id: decide
    type: io.kestra.plugin.core.flow.Switch
    value: "{{ outputs.verdict.values.state }}"
    cases:
      READY:
        - id: lock_period
          type: io.kestra.plugin.core.kv.Set
          key: "{{ vars.lock_key }}"
          kvType: JSON
          value: |
            {"period": "{{ inputs.period }}", "closed_at": "{{ now() }}", "execution_id": "{{ execution.id }}",
             "accrual_total": {{ outputs.result.values.r | jq('.accrual_total') | first }},
             "grni_total": {{ outputs.result.values.r | jq('.grni_total') | first }},
             "services_total": {{ outputs.result.values.r | jq('.services_total') | first }},
             "reversal_date": "{{ outputs.period_control.values.reversal_date }}",
             "approved_by": "{{ inputs.approved_by }}"}

        - id: log_closed
          type: io.kestra.plugin.core.log.Log
          message: >-
            Accruals for {{ inputs.period }} closed: {{ outputs.result.values.r | jq('.accrual_total') | first }}, reversing on
            {{ outputs.period_control.values.reversal_date }}. Post accrual-journal.csv and reversal-journal.csv from {{ render(vars.pack_dir) }}.

      NEEDS_APPROVAL:
        - id: approval_required
          type: io.kestra.plugin.core.execution.Fail
          errorMessage: >-
            Accruals total {{ outputs.result.values.r | jq('.accrual_total') | first }} (movement {{ outputs.result.values.swing_pct }}% against
            {{ outputs.period_control.values.last_total }}), largest line {{ outputs.result.values.r | jq('.largest_line') | first }}
            against a review threshold of {{ inputs.review_threshold }}. Review {{ render(vars.pack_dir) }}/grni.csv and run again with approved_by.

      OUT_OF_BALANCE:
        - id: out_of_balance
          type: io.kestra.plugin.core.execution.Fail
          errorMessage: The accrual or reversal journal does not balance. Do not post.

    defaults:
      - id: blocked
        type: io.kestra.plugin.core.execution.Fail
        errorMessage: "Accruals for {{ inputs.period }} not closed: {{ outputs.result.values.r | jq('.blocker_detail') | first }}"

extend:
  title: Book month-end purchase accruals (GRNI) with automatic reversal and three-way match checks
  metaTitle: GRNI and expense accruals month-end close with Kestra and DuckDB
  shortDescription: Accrue goods received not invoiced and recurring services not yet billed, catch three-way match failures and stale receipts, and produce the accrual and reversal journals.
  metaDescription: Month-end GRNI and expense accruals in Kestra and DuckDB. Three-way match, stale receipts, service accruals, auto-reversal and a period lock.
  description: |
    At month end, goods have arrived and services have been delivered, but the invoices are still on their way. Without an accrual, the expense lands in the wrong month and the balance sheet understates what the company owes. The usual process is a spreadsheet built from the goods-received report, plus a list of "usual" monthly bills someone remembers to accrue. This flow builds the accrual from the purchasing data, explains it and books its reversal.

    It runs with no setup and no network. DuckDB generates 150 purchase order lines from six vendors with partial deliveries, vendors invoicing 0 to 50 days after receipt, some receipts never invoiced, small price differences, and six recurring service contracts.


    ## What gets accrued

    | Accrual | Rule |
    |---|---|
    | Goods received not invoiced | Per PO line at period end: (received - invoiced) quantity at the PO price, to the line's account |
    | Fixed-fee services | Contract fee, when the month's invoice has not arrived |
    | Variable services | Average of the last three invoices (utilities, cloud, freight) |

    The accrual journal is dated the last day of the month and credits 2150 (GRNI) and 2160 (accrued expenses). The **reversal journal** is dated day one of the next month and mirrors it, so the real invoice books against a cleared accrual. The flow checks that the two journals balance and mirror each other.

    ## What gets flagged

    | Exception | Effect |
    |---|---|
    | `INVOICED_NOT_RECEIVED`: billed for more than arrived | Blocks the close, with the amount to hold from payment |
    | `PRICE_VARIANCE` above `price_tolerance_pct` | Blocks the close |
    | `UNKNOWN_PO`: a receipt without an open purchase order | Blocks the close |
    | `RECEIVED_OVER_ORDER` | Listed |
    | `STALE_RECEIPT`: open longer than `stale_after_days` | Listed with the amount. Usually never billed: ask the vendor, or write it back |

    A single accrual line above `review_threshold`, or a total that moves more than 25% against last month, needs `approved_by`.

    ## How it works

    1. `period_control` and `period_gate` refuse a closed period or one whose previous period is open, and read last month's total.
    2. `accrue` (`io.kestra.plugin.jdbc.duckdb.Queries`) runs in one session:
       - it builds the purchasing data,
       - it runs the three-way match per PO line at period end,
       - it computes GRNI, the service accruals, the exceptions and the blockers,
       - it writes the accrual and reversal journals.
    3. `result` computes the movement against last month. `log_close` prints the close, and `evidence` stores `grni.csv`, `service-accruals.csv`, `exceptions.csv`, `accrual-journal.csv`, `reversal-journal.csv` and `blockers.csv`.
    4. `decide` (`io.kestra.plugin.core.flow.Switch`):
       - `READY`: `lock_period` stores the totals and the reversal date.
       - Every other verdict fails with the reason.

    ## Tested end to end

    On Kestra 2.0.3 OSS, in this order.

    | Run | Inputs | Result |
    |---|---|---|
    | 1 | 2026-08 `CLEAN` | 91 lines received, 57 fully invoiced. GRNI 148,704.30 on 34 lines, services 53,217.00 on 6 contracts (cloud hosting 10,926.67 from its last three invoices). Total 201,921.30. One stale receipt (94 days, 3,614.30). Invoices 1% off PO price stay inside the 2% tolerance. Closed, reversal on 2026-09-01 |
    | 2 | 2026-09, `review_threshold: 15000` | Total 244,055.93, +20.9% against August. Largest line 17,860.00 is above the threshold: stops for approval |
    | 3 | same, `approved_by` | Closed |
    | 4 | 2026-09 again | Refused: already closed |
    | 5 | 2026-11 | Refused: 2026-10 must be closed first |
    | 6 | 2026-10 `ISSUES` | Blocked by 3 items: PO-4107/2 invoiced 564 against 64 received (hold 28,400.00), PO-4120/1 invoiced at 105.02 against 89.00 (18.0%), receipt GRN-X1 against unknown PO-9999 |
    | 7 | 2026-10 `CLEAN` | Total 202,165.26, -17.2%. 9 stale receipts worth 35,533.90. Closed |

    ## Problems found while testing

    - **A first close divided by zero.** With no previous close, the movement against last month rendered as `∞%`, and the verdict failed to parse it. KV values come back as strings, so `0 == '0'` was false. The previous total is now converted to a number, and a first close reports 0%.
    - **One injected problem raised two blockers.** The price variance was first injected as an extra invoice, which also over-invoiced the line. It now changes the price of the existing invoice, so each scenario item raises exactly one blocker.

    ## Inputs

    | Input | Default | Purpose |
    |---|---|---|
    | `period` | `2026-08` | `YYYY-MM`, validated |
    | `scenario` | `CLEAN` | Demo only |
    | `price_tolerance_pct` | `2.0` | Three-way match price tolerance |
    | `stale_after_days` | `90` | Age at which a receipt is listed for follow-up |
    | `review_threshold` | `20000.0` | Line size that needs approval |
    | `approved_by` | empty | The reviewer |

    ## Use it with your data

    - Replace the generators with your ERP exports:
      - `po_lines`: PO, line, vendor, category, quantity, price;
      - `receipts`: GRN, PO, line, date, quantity;
      - `invoices`: invoice, PO, line, date, quantity, price;
      - `service_contracts` and `service_invoices`.
    - Map `accounts` to your chart of accounts.
    - Post the two journal files to the ERP, for example with an HTTP task after `lock_period`.

    ## Things to know

    - GRNI is valued at the PO price. If your ERP values receipts at standard cost, use that price instead.
    - Non-PO spend (expenses, card spend) is out of scope. Add it as another service-style source.
    - Reopening a period is deliberate: delete the KV key `purchase_accrual_close`.

