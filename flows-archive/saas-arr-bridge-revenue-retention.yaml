id: saas-arr-bridge-revenue-retention
namespace: company.team

description: |
  Monthly SaaS metrics close: build the ARR bridge from the subscription ledger (opening, new,
  expansion, contraction, churn, reactivation, FX, closing), net and gross revenue retention
  and logo churn on trailing-twelve-month cohorts, ARR concentration, reconcile ARR to
  recognised subscription revenue, block on bad subscription data, and lock the month so the
  board pack never changes after it is sent.

inputs:
  - id: month
    type: STRING
    displayName: Month (YYYY-MM)
    defaults: "2026-09"
    validator: ^\d{4}-(0[1-9]|1[0-2])$

  - id: scenario
    type: SELECT
    displayName: Demo scenario
    description: >
      ISSUES adds a subscription with a negative price, two overlapping subscriptions for the
      same customer and product, and a booking in a currency with no rate, which must stop the
      close.
    values:
      - CLEAN
      - ISSUES
    defaults: CLEAN

  - id: revenue_tolerance_pct
    type: FLOAT
    displayName: ARR to revenue tolerance (%)
    description: Recognised subscription revenue × 12 may differ from average ARR by this much (mid-month starts and ends, credits).
    defaults: 3.0

  - id: approved_by
    type: STRING
    displayName: Approved by
    description: Needed when net revenue retention falls below 100% or one customer is more than 10% of ARR.
    defaults: ""

variables:
  lock_key: arr_close
  pack_dir: "arr/{{ inputs.month }}"

concurrency:
  limit: 1

tasks:
  - id: period_control
    type: io.kestra.plugin.core.output.OutputValues
    values:
      last: "{{ (kv(vars.lock_key, errorOnMissing=false) ?? {'month': ''}) | jq('.month') | first }}"
      locked_arr: "{{ (kv(vars.lock_key, errorOnMissing=false) ?? {'closing_arr': 'NULL'}) | jq('.closing_arr') | first }}"
      previous: "{{ (inputs.month ~ '-01') | date('yyyy-MM-dd') | dateAdd(-1, 'MONTHS') | date('yyyy-MM') }}"

  - id: period_gate
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.period_control.values.last != '' and (inputs.month <= outputs.period_control.values.last or outputs.period_control.values.last != outputs.period_control.values.previous) }}"
    then:
      - id: period_refused
        type: io.kestra.plugin.core.execution.Fail
        errorMessage: >-
          {{ inputs.month <= outputs.period_control.values.last
             ? inputs.month ~ ' is already closed (last: ' ~ outputs.period_control.values.last ~ ').'
             : 'Close ' ~ outputs.period_control.values.previous ~ ' first (last closed: ' ~ outputs.period_control.values.last ~ ').' }}

  - id: metrics
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: >
      One DuckDB session: customers, subscriptions and FX (demo generator or your billing
      system), MRR per customer at every month end at constant and current rates, the bridge,
      retention cohorts, concentration, the revenue reconciliation and the checks.
    outputFiles:
      - bridge
      - customers
      - cohorts
      - blockers
    fetchType: FETCH_ONE
    sql: |
      SET VARIABLE m1 = (DATE '{{ inputs.month }}-01' + INTERVAL 1 MONTH - INTERVAL 1 DAY)::DATE;
      SET VARIABLE m0 = (DATE '{{ inputs.month }}-01' - INTERVAL 1 DAY)::DATE;
      SET VARIABLE m12 = (DATE '{{ inputs.month }}-01' - INTERVAL 11 MONTH - INTERVAL 1 DAY)::DATE;
      SET VARIABLE locked_arr = {{ outputs.period_control.values.locked_arr }}::DOUBLE;

      -- =======================================================================
      -- Demo data. Replace with your billing system: one row per subscription
      -- line with its monthly recurring price, start and end.
      -- =======================================================================
      CREATE TABLE customers AS
      SELECT 'CUS-' || lpad(i::VARCHAR, 3, '0') AS customer, ['EUR', 'USD', 'GBP'][1 + i % 3] AS currency,
             (DATE '2024-01-01' + INTERVAL ((i * 7) % 36) MONTH + INTERVAL ((i * 11) % 27) DAY)::DATE AS signed_on,
             ['SMB', 'SMB', 'MID', 'ENT'][1 + i % 4] AS segment
      FROM range(1, 221) t(i);

      CREATE TABLE fx (currency VARCHAR, month DATE, eur_per_unit DOUBLE);
      INSERT INTO fx SELECT c, (m + INTERVAL 1 MONTH - INTERVAL 1 DAY)::DATE,
             CASE c WHEN 'EUR' THEN 1 WHEN 'USD' THEN 0.92 - 0.04 * sin(date_diff('month', DATE '2024-01-01', m) / 6.0) ELSE 1.16 + 0.02 * cos(date_diff('month', DATE '2024-01-01', m) / 5.0) END
      FROM (VALUES ('EUR'), ('USD'), ('GBP')) v(c), generate_series(DATE '2023-12-01', DATE '2027-12-01', INTERVAL 1 MONTH) g(m);

      -- Each customer's plan history: a first subscription, then upgrades, seat changes,
      -- downgrades, cancellations and some win-backs, on fixed dates.
      CREATE TABLE subscriptions AS
      WITH plan AS (
        SELECT c.*, CASE segment WHEN 'SMB' THEN 300 WHEN 'MID' THEN 2200 ELSE 9500 END * (0.7 + (hash(customer) % 60)::INT / 100.0) AS base_mrr,
               (hash(customer || 'x') % 100)::INT AS r
        FROM customers c
      )
      SELECT customer || '-1' AS sub_id, customer, 'CORE' AS product, currency, signed_on AS starts_on,
             CASE WHEN r < 14 THEN (signed_on + INTERVAL (8 + r) MONTH - INTERVAL 1 DAY)::DATE END AS ends_on, round(base_mrr, 2) AS mrr
      FROM plan
      UNION ALL
      -- Add-on bought later by four customers in ten (expansion).
      SELECT customer || '-2', customer, 'ANALYTICS', currency, (signed_on + INTERVAL (6 + r % 9) MONTH)::DATE,
             CASE WHEN r % 17 = 0 THEN (signed_on + INTERVAL (20 + r % 7) MONTH - INTERVAL 1 DAY)::DATE END, round(base_mrr * 0.35, 2)
      FROM plan WHERE r BETWEEN 14 AND 68
      UNION ALL
      -- Win-backs: a few churned customers come back on a smaller plan.
      SELECT customer || '-3', customer, 'CORE', currency, (signed_on + INTERVAL (8 + r + 6) MONTH)::DATE, NULL, round(base_mrr * 0.6, 2)
      FROM plan WHERE r < 14 AND r % 3 = 0;
      -- Seat reductions: one customer in eight cuts the core plan by 30% after 14 months (contraction).
      CREATE TABLE price_changes AS
      SELECT sub_id, (starts_on + INTERVAL 14 MONTH)::DATE AS from_date, round(mrr * 0.7, 2) AS mrr
      FROM subscriptions WHERE product = 'CORE' AND hash(sub_id) % 8 = 0 AND ends_on IS NULL;
      {% if inputs.scenario == 'ISSUES' %}
      INSERT INTO subscriptions VALUES
        ('CUS-011-9', 'CUS-011', 'ANALYTICS', 'USD', DATE '{{ inputs.month }}-03', NULL, -450.00),
        ('CUS-020-9', 'CUS-020', 'CORE', 'EUR', DATE '2026-06-01', NULL, 900.00),
        ('CUS-500-1', 'CUS-500', 'CORE', 'CHF', DATE '{{ inputs.month }}-10', NULL, 1200.00);
      INSERT INTO customers VALUES ('CUS-500', 'CHF', DATE '{{ inputs.month }}-10', 'MID');
      {% endif %}

      -- =======================================================================
      -- MRR per customer at a month end, in EUR at that month's rate (current)
      -- and at the opening month's rate (constant currency, for the FX line).
      -- =======================================================================
      CREATE MACRO mrr_at(d) AS TABLE
      SELECT s.customer, s.currency,
             sum(coalesce((SELECT p.mrr FROM price_changes p WHERE p.sub_id = s.sub_id AND p.from_date <= d), s.mrr)) AS mrr_local
      FROM subscriptions s
      WHERE s.starts_on <= d AND (s.ends_on IS NULL OR s.ends_on >= d)
      GROUP BY s.customer, s.currency;

      CREATE TABLE positions AS
      SELECT coalesce(a.customer, b.customer) AS customer, coalesce(a.currency, b.currency) AS currency,
             coalesce(a.mrr_local, 0) AS mrr0_local, coalesce(b.mrr_local, 0) AS mrr1_local
      FROM mrr_at(getvariable('m0')) a FULL JOIN mrr_at(getvariable('m1')) b USING (customer, currency);
      CREATE TABLE rated AS
      SELECT p.*, f0.eur_per_unit AS rate0, f1.eur_per_unit AS rate1,
             12 * p.mrr0_local * f0.eur_per_unit AS arr0, 12 * p.mrr1_local * f1.eur_per_unit AS arr1,
             12 * p.mrr1_local * f0.eur_per_unit AS arr1_constant,
             (SELECT count(*) > 0 FROM subscriptions s WHERE s.customer = p.customer AND s.starts_on <= getvariable('m0')) AS had_before
      FROM positions p LEFT JOIN fx f0 ON f0.currency = p.currency AND f0.month = getvariable('m0')
      LEFT JOIN fx f1 ON f1.currency = p.currency AND f1.month = getvariable('m1');

      -- Movement class per customer, at constant currency.
      CREATE TABLE movements AS
      SELECT *, CASE
          WHEN arr0 = 0 AND arr1_constant > 0 AND NOT had_before THEN 'NEW'
          WHEN arr0 = 0 AND arr1_constant > 0 THEN 'REACTIVATION'
          WHEN arr0 > 0 AND arr1_constant = 0 THEN 'CHURN'
          WHEN arr1_constant > arr0 THEN 'EXPANSION'
          WHEN arr1_constant < arr0 THEN 'CONTRACTION'
          ELSE 'FLAT' END AS movement
      FROM rated;

      CREATE TABLE bridge AS
      SELECT * FROM (
        SELECT 1 AS ord, 'Opening ARR' AS line, sum(arr0) AS arr, count(*) FILTER (WHERE arr0 > 0) AS customers FROM movements
        UNION ALL SELECT 2, 'New', sum(arr1_constant - arr0), count(*) FROM movements WHERE movement = 'NEW'
        UNION ALL SELECT 3, 'Expansion', sum(arr1_constant - arr0), count(*) FROM movements WHERE movement = 'EXPANSION'
        UNION ALL SELECT 4, 'Reactivation', sum(arr1_constant - arr0), count(*) FROM movements WHERE movement = 'REACTIVATION'
        UNION ALL SELECT 5, 'Contraction', sum(arr1_constant - arr0), count(*) FROM movements WHERE movement = 'CONTRACTION'
        UNION ALL SELECT 6, 'Churn', sum(arr1_constant - arr0), count(*) FROM movements WHERE movement = 'CHURN'
        UNION ALL SELECT 7, 'Currency', sum(arr1 - arr1_constant), NULL FROM movements
        UNION ALL SELECT 8, 'Closing ARR', sum(arr1), count(*) FILTER (WHERE arr1 > 0) FROM movements
      );
      UPDATE bridge SET arr = coalesce(arr, 0), customers = coalesce(customers, 0) WHERE ord BETWEEN 2 AND 6;

      -- =======================================================================
      -- Retention on the cohort of customers active twelve months ago, at
      -- today's constant rate so currency does not move it.
      -- =======================================================================
      CREATE TABLE cohort AS
      SELECT c.customer, c.currency, c.mrr_local AS mrr_then, coalesce(n.mrr_local, 0) AS mrr_now, f.eur_per_unit AS rate
      FROM mrr_at(getvariable('m12')) c LEFT JOIN mrr_at(getvariable('m1')) n USING (customer, currency)
      JOIN fx f ON f.currency = c.currency AND f.month = getvariable('m1');
      CREATE TABLE retention AS
      SELECT sum(12 * mrr_now * rate) / sum(12 * mrr_then * rate) AS nrr,
             sum(12 * least(mrr_now, mrr_then) * rate) / sum(12 * mrr_then * rate) AS grr,
             count(*) FILTER (WHERE mrr_now = 0)::DOUBLE / count(*) AS logo_churn,
             count(*) AS cohort_customers
      FROM cohort;
      CREATE TABLE cohorts AS
      SELECT cu.segment, count(*) AS customers, round(sum(12 * mrr_then * rate)) AS arr_12m_ago, round(sum(12 * mrr_now * rate)) AS arr_now,
             round(100 * sum(mrr_now * rate) / sum(mrr_then * rate), 1) AS nrr_pct,
             round(100 * sum(least(mrr_now, mrr_then) * rate) / sum(mrr_then * rate), 1) AS grr_pct,
             round(100 * count(*) FILTER (WHERE mrr_now = 0)::DOUBLE / count(*), 1) AS logo_churn_pct
      FROM cohort JOIN customers cu USING (customer) GROUP BY ROLLUP (cu.segment) ORDER BY cu.segment NULLS LAST;

      -- =======================================================================
      -- ARR against recognised subscription revenue for the month (daily
      -- proration of every subscription active in the month).
      -- =======================================================================
      CREATE TABLE revenue AS
      SELECT sum(coalesce((SELECT p.mrr FROM price_changes p WHERE p.sub_id = s.sub_id AND p.from_date <= getvariable('m1')), s.mrr)
                 * (date_diff('day', greatest(s.starts_on, DATE '{{ inputs.month }}-01'), least(coalesce(s.ends_on, getvariable('m1')), getvariable('m1'))) + 1)
                 / day(getvariable('m1')) * f.eur_per_unit) AS recognised
      FROM subscriptions s JOIN fx f ON f.currency = s.currency AND f.month = getvariable('m1')
      WHERE s.starts_on <= getvariable('m1') AND (s.ends_on IS NULL OR s.ends_on >= DATE '{{ inputs.month }}-01') AND s.mrr > 0;

      -- =======================================================================
      -- Checks.
      -- =======================================================================
      CREATE TABLE blockers AS
      SELECT 'NEGATIVE_PRICE' AS code, sub_id AS ref, 'Monthly price ' || mrr || ' ' || currency AS detail FROM subscriptions WHERE mrr <= 0
      UNION ALL SELECT 'OVERLAPPING_SUBSCRIPTIONS', a.customer || ' ' || a.product, a.sub_id || ' and ' || b.sub_id || ' are active at the same time'
        FROM subscriptions a JOIN subscriptions b ON a.customer = b.customer AND a.product = b.product AND a.sub_id < b.sub_id
        AND a.starts_on <= coalesce(b.ends_on, DATE '9999-12-31') AND b.starts_on <= coalesce(a.ends_on, DATE '9999-12-31')
      UNION ALL SELECT 'MISSING_FX_RATE', customer, 'No ' || currency || ' rate at ' || getvariable('m1') FROM rated WHERE rate1 IS NULL OR (mrr0_local > 0 AND rate0 IS NULL)
      UNION ALL SELECT 'BRIDGE_DOES_NOT_TIE', 'bridge', 'Movements explain ' || round((SELECT sum(arr) FROM bridge WHERE ord < 8), 2) || ', closing ' || round((SELECT arr FROM bridge WHERE ord = 8), 2)
        WHERE abs((SELECT sum(arr) FROM bridge WHERE ord < 8) - (SELECT arr FROM bridge WHERE ord = 8)) >= 0.01
      UNION ALL SELECT 'OPENING_RESTATED', 'ARR', 'Opening ' || round((SELECT arr FROM bridge WHERE ord = 1), 2) || ' against the last close ' || round(getvariable('locked_arr'), 2)
        WHERE getvariable('locked_arr') IS NOT NULL AND abs((SELECT arr FROM bridge WHERE ord = 1) - getvariable('locked_arr')) >= 0.01
      UNION ALL SELECT 'ARR_DOES_NOT_MATCH_REVENUE', 'revenue', 'Revenue × 12 = ' || round(12 * r.recognised) || ', average ARR ' || round(((SELECT arr FROM bridge WHERE ord = 1) + (SELECT arr FROM bridge WHERE ord = 8)) / 2)
        FROM revenue r WHERE abs(12 * r.recognised / (((SELECT arr FROM bridge WHERE ord = 1) + (SELECT arr FROM bridge WHERE ord = 8)) / 2) - 1) > {{ inputs.revenue_tolerance_pct }} / 100;

      COPY (SELECT line, round(arr, 2) AS arr, customers FROM bridge ORDER BY ord) TO '{{ outputFiles.bridge }}' (HEADER, DELIMITER ',');
      COPY (SELECT customer, currency, movement, round(arr0, 2) AS opening_arr, round(arr1_constant - arr0, 2) AS movement_constant, round(arr1 - arr1_constant, 2) AS currency_effect,
                   round(arr1, 2) AS closing_arr, round(100 * arr1 / (SELECT arr FROM bridge WHERE ord = 8), 2) AS share_pct
            FROM movements WHERE arr0 > 0 OR arr1 > 0 ORDER BY arr1 DESC) TO '{{ outputFiles.customers }}' (HEADER, DELIMITER ',');
      COPY cohorts TO '{{ outputFiles.cohorts }}' (HEADER, DELIMITER ',');
      COPY blockers TO '{{ outputFiles.blockers }}' (HEADER, DELIMITER ',');

      SELECT
        (SELECT string_agg(line || ' ' || format('{:,.0f}', arr::DOUBLE) || CASE WHEN ord BETWEEN 2 AND 6 THEN ' (' || customers || ')' ELSE '' END, ', ' ORDER BY ord) FROM bridge) AS bridge,
        (SELECT round(arr, 2)::DOUBLE FROM bridge WHERE ord = 8) AS closing_arr,
        (SELECT customers FROM bridge WHERE ord = 8)::INT AS customers,
        round(100 * nrr, 1)::DOUBLE AS nrr, round(100 * grr, 1)::DOUBLE AS grr, round(100 * logo_churn, 1)::DOUBLE AS logo_churn, cohort_customers::INT AS cohort_customers,
        (SELECT round(100 * max(arr1) / sum(arr1), 1)::DOUBLE FROM movements) AS top_customer_pct,
        (SELECT round(100 * sum(a) / (SELECT sum(arr1) FROM movements), 1)::DOUBLE FROM (SELECT arr1 AS a FROM movements ORDER BY arr1 DESC LIMIT 10)) AS top10_pct,
        (SELECT round(12 * recognised, 0)::DOUBLE FROM revenue) AS revenue_run_rate,
        (SELECT round(100 * (12 * r.recognised / (((SELECT arr FROM bridge WHERE ord = 1) + (SELECT arr FROM bridge WHERE ord = 8)) / 2) - 1), 2)::DOUBLE FROM revenue r) AS revenue_gap_pct,
        (SELECT count(*) FROM blockers)::INT AS blockers,
        (SELECT coalesce(string_agg(code || ' ' || ref || ': ' || detail, '; ' ORDER BY code, ref), '') FROM blockers) AS blocker_detail
      FROM retention;

  - id: result
    type: io.kestra.plugin.core.output.OutputValues
    values:
      r: "{{ (outputs.metrics.outputs | last).row | toJson }}"

  - id: log_close
    type: io.kestra.plugin.core.log.Log
    message: |
      ARR close {{ inputs.month }} ({{ inputs.scenario }}).
      {{ outputs.result.values.r | jq('"\(.bridge). \(.customers) customers."') | first }}
      {{ outputs.result.values.r | jq('"Trailing 12 months on \(.cohort_customers) customers: NRR \(.nrr)%, GRR \(.grr)%, logo churn \(.logo_churn)%. Largest customer \(.top_customer_pct)% of ARR, top 10 \(.top10_pct)%."') | first }}
      {{ outputs.result.values.r | jq('"Recognised revenue × 12 = \(.revenue_run_rate), \(.revenue_gap_pct)% from average ARR. Blockers: \(.blockers). \(.blocker_detail)"') | first }}

  - id: evidence
    type: io.kestra.plugin.core.namespace.UploadFiles
    namespace: "{{ flow.namespace }}"
    filesMap:
      "{{ render(vars.pack_dir) }}/arr-bridge.csv": "{{ outputs.metrics.outputFiles.bridge }}"
      "{{ render(vars.pack_dir) }}/customers.csv": "{{ outputs.metrics.outputFiles.customers }}"
      "{{ render(vars.pack_dir) }}/retention-by-segment.csv": "{{ outputs.metrics.outputFiles.cohorts }}"
      "{{ render(vars.pack_dir) }}/blockers.csv": "{{ outputs.metrics.outputFiles.blockers }}"

  - id: decide
    type: io.kestra.plugin.core.flow.Switch
    value: >-
      {%- set r = outputs.result.values.r -%}
      {%- if (r | jq('.blockers > 0') | first) -%}BLOCKED
      {%- elseif (r | jq('.nrr < 100 or .top_customer_pct > 10') | first) and inputs.approved_by == '' -%}NEEDS_APPROVAL
      {%- else -%}READY{%- endif -%}
    cases:
      READY:
        - id: lock_month
          type: io.kestra.plugin.core.kv.Set
          key: "{{ vars.lock_key }}"
          kvType: JSON
          value: |
            {"month": "{{ inputs.month }}", "closed_at": "{{ now() }}", "execution_id": "{{ execution.id }}",
             "closing_arr": {{ outputs.result.values.r | jq('.closing_arr') | first }},
             "nrr": {{ outputs.result.values.r | jq('.nrr') | first }}, "grr": {{ outputs.result.values.r | jq('.grr') | first }},
             "approved_by": "{{ inputs.approved_by }}"}

        - id: log_closed
          type: io.kestra.plugin.core.log.Log
          message: "ARR for {{ inputs.month }} closed at {{ outputs.result.values.r | jq('.closing_arr') | first }}. Board pack in {{ render(vars.pack_dir) }}."

      NEEDS_APPROVAL:
        - id: approval_required
          type: io.kestra.plugin.core.execution.Fail
          errorMessage: >-
            Review before the board pack goes out: NRR {{ outputs.result.values.r | jq('.nrr') | first }}%,
            largest customer {{ outputs.result.values.r | jq('.top_customer_pct') | first }}% of ARR. Run again with approved_by.

    defaults:
      - id: blocked
        type: io.kestra.plugin.core.execution.Fail
        errorMessage: "ARR for {{ inputs.month }} cannot be closed: {{ outputs.result.values.r | jq('.blocker_detail') | first }}"

extend:
  title: Close SaaS ARR each month with the ARR bridge, net revenue retention and a revenue check
  metaTitle: SaaS ARR bridge, NRR and GRR monthly close with Kestra and DuckDB
  shortDescription: Build the ARR bridge from the subscription ledger, compute NRR, GRR and logo churn on trailing cohorts, check concentration, reconcile ARR to recognised revenue and lock the month.
  metaDescription: Monthly SaaS ARR close in Kestra and DuckDB. ARR bridge with FX, NRR, GRR, logo churn, concentration, revenue reconciliation and a lock.
  description: |
    ARR and net revenue retention are the numbers a SaaS board, investors and lenders look at first, and they are often computed in a spreadsheet nobody can reproduce. Typical errors:
    - opening ARR that doesn't match last month's closing ARR,
    - currency moves counted as expansion or churn,
    - a backdated subscription that silently restates a closed month,
    - ARR that has drifted away from the revenue in the ledger.

    This flow builds the metrics from the subscription ledger, proves the bridge, and locks each month once the board pack is sent.

    It runs with no setup and no network. DuckDB generates 220 customers in EUR, USD and GBP across SMB, mid-market and enterprise. Their history includes:
    - core subscriptions and analytics add-ons,
    - seat reductions after 14 months,
    - cancellations, and a few win-backs on smaller plans.


    ## The ARR bridge

    MRR is taken per customer at both month ends, then classified at the **opening month's exchange rate**, so currency never hides in the operational lines:

    | Line | Rule |
    |---|---|
    | New | No ARR at the opening and never a customer before |
    | Reactivation | No ARR at the opening, but a customer before |
    | Expansion / Contraction | ARR up / down for a continuing customer |
    | Churn | ARR at the opening, none at the closing |
    | Currency | Closing ARR at the closing rate - closing ARR at the opening rate |

    The bridge must tie exactly: opening + movements + currency = closing. The opening must also equal the closing ARR stored by the last close. A subscription backdated into a closed month fails that check instead of silently restating the board pack.

    ## Retention

    These are computed on the cohort of customers active twelve months ago, at today's rate, so currency does not move them:
    - **NRR**: the cohort's ARR now / its ARR then, including expansion;
    - **GRR**: each customer is capped at its ARR then, so expansion is excluded;
    - **Logo churn**: the share of the cohort with no ARR now.

    All three are reported in total and by segment. Concentration is reported too: the largest customer's share of ARR and the top ten's.

    ## ARR against revenue

    Subscription revenue for the month is recognised daily, pro rata to each subscription active in the month. Twelve times the month's revenue must be within `revenue_tolerance_pct` of the average of opening and closing ARR. Otherwise the subscription ledger and the revenue ledger have diverged: unbilled subscriptions, credits, or revenue for something that isn't recurring.

    ## Controls

    - **Blocked:**
      - a non-positive price,
      - two overlapping subscriptions for the same customer and product (which double ARR),
      - a currency without a rate,
      - a bridge that does not tie,
      - an opening that differs from the last close,
      - ARR out of line with revenue.
    - **Needs approval:** NRR below 100%, or one customer above 10% of ARR.
    - **Order:** months close once, in order.

    ## How it works

    1. `period_control` and `period_gate` enforce the order and load last month's closing ARR.
    2. `metrics` (`io.kestra.plugin.jdbc.duckdb.Queries`) builds customers, subscriptions, price changes and rates. It defines MRR at any date as a table macro, then computes the positions, the movements, the bridge, the cohort, the revenue and the checks.
    3. `log_close` prints the bridge and the metrics. `evidence` stores `arr-bridge.csv`, `customers.csv` (each customer's movement, currency effect and share), `retention-by-segment.csv` and `blockers.csv`.
    4. `decide` (`io.kestra.plugin.core.flow.Switch`):
       - `READY`: locks the month with closing ARR, NRR and GRR.
       - Otherwise the run fails with the reason.

    ## Tested end to end

    On Kestra 2.0.3 OSS, in this order.

    | Run | Inputs | Result |
    |---|---|---|
    | 1 | 2026-08, approved | Opening 7,979,221. New 19,458 (6 customers), expansion 8,971, reactivation 4,101 (2 win-backs), contraction -8,131, currency -3,509. Closing 8,000,111. NRR 99.5%, GRR 93.2%. Revenue run-rate -0.02% from average ARR |
    | 2 | 2026-09, approved | Opening 8,000,111.02, exactly August's closing. Churn -159,948 (4 customers), currency -8,129, closing 7,885,196. NRR 98.2%: below 100%, so it needs approval. By segment: SMB 102.2%, enterprise 98.9%, mid-market 94.5% |
    | 3 | 2026-09 again / 2026-11 | Refused |
    | 4 | 2026-10 `ISSUES` | Blocked by 5 items. A -450.00 price, a CHF customer without a rate, two overlapping subscriptions, and an opening restated by 10,800 because one of the overlaps was backdated to June |
    | 5 | 2026-10 | New 652,080 (6 customers, including enterprise accounts), NRR 100.6%. Closed without approval |

    I checked the September bridge independently against `customers.csv`:
    - each movement line equals the sum of its customers to the cent;
    - opening, closing and the currency line match within the few cents of per-row rounding in the file.

    ## Problems found while testing

    - **No new logos after mid-2026.** The demo spread sign-ups over 30 months from January 2024, so the 2026 closes never had a new customer. Sign-ups now run to the end of 2026, with days spread across each month.

    ## Inputs

    | Input | Default | Purpose |
    |---|---|---|
    | `month` | `2026-09` | `YYYY-MM`, validated |
    | `scenario` | `CLEAN` | Demo only |
    | `revenue_tolerance_pct` | `3.0` | ARR to revenue tolerance |
    | `approved_by` | empty | The CFO, for low NRR or concentration |

    ## Use it with your data

    - Replace `customers`, `subscriptions` and `price_changes` with your billing system's subscription lines, and `fx` with your rates. The FX revaluation blueprint stores closing rates in KV.
    - If your board defines ARR on contracted rather than live subscriptions, start `mrr_at` from signed contracts.

    ## Things to know

    - Usage-based revenue is not recurring and stays out of ARR, but it is in revenue. Exclude it from the revenue check or widen the tolerance.
    - Discounts and free months reduce MRR only if they are on the subscription line.
    - Reset by deleting the KV key `arr_close`.

    ## Links

