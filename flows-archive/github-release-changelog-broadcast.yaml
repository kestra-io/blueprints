id: github-release-changelog-broadcast
namespace: company.devops
description: Automated GitHub Release Changelog Generator and Slack Broadcast

inputs:
  - id: repository
    type: STRING
    displayName: GitHub Repository (owner/repo)
    defaults: my-org/web-service

  - id: release_tag
    type: STRING
    displayName: Release Tag Version
    defaults: v1.4.0

  - id: target_branch
    type: STRING
    displayName: Target Branch
    defaults: main

  - id: changelog_markdown
    type: STRING
    displayName: Raw Release Notes or Commit Log
    defaults: |
      feat: add real-time webhook ingestion engine
      fix: prevent memory leak in background worker pool
      feat: support token authentication for public API endpoints
      perf: reduce database connection latency by 35%

tasks:
  - id: categorize_changelog
    type: io.kestra.plugin.scripts.python.Script
    description: Parse commit lines and partition changes into categorized release buckets
    containerImage: python:3.11-slim
    script: |
      import json
      import sys

      raw_text = """{{ inputs.changelog_markdown }}"""
      lines = [line.strip() for line in raw_text.strip().splitlines() if line.strip()]

      features = []
      fixes = []
      improvements = []
      breaking = []

      for entry in lines:
          lower = entry.lower()
          if "break" in lower or "breaking change" in lower:
              breaking.append(entry)
          elif lower.startswith("feat"):
              features.append(entry)
          elif lower.startswith("fix"):
              fixes.append(entry)
          else:
              improvements.append(entry)

      is_major = len(breaking) > 0 or "{{ inputs.release_tag }}".endswith(".0.0")

      formatted_md = f"### Release Notes for {{ inputs.release_tag }}\n\n"
      if breaking:
          formatted_md += "**Breaking Changes:**\n" + "\n".join(f"- {item}" for item in breaking) + "\n\n"
      if features:
          formatted_md += "**Features:**\n" + "\n".join(f"- {item}" for item in features) + "\n\n"
      if fixes:
          formatted_md += "**Bug Fixes:**\n" + "\n".join(f"- {item}" for item in fixes) + "\n\n"
      if improvements:
          formatted_md += "**Other Improvements:**\n" + "\n".join(f"- {item}" for item in improvements) + "\n\n"

      with open("summary.md", "w", encoding="utf-8") as f:
          f.write(formatted_md)

      from kestra import Kestra
      Kestra.outputs({
          "is_major": is_major,
          "features_count": len(features),
          "fixes_count": len(fixes),
          "total_items": len(lines),
          "markdown": formatted_md
      })

  - id: check_release_type
    type: io.kestra.plugin.core.flow.If
    description: Route notification channel and urgency based on release scope
    condition: "{{ outputs.categorize_changelog.vars.is_major == true }}"
    then:
      - id: notify_urgent_slack
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatch high-priority release alert to general engineering
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "text": "*Major Release Deployed*: `{{ inputs.repository }}` - `{{ inputs.release_tag }}`\n\n{{ outputs.categorize_changelog.vars.markdown }}"
          }
    else:
      - id: notify_standard_slack
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Post standard changelog update to developer release channel
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "text": "*New Release*: `{{ inputs.repository }}` - `{{ inputs.release_tag }}`\n\n{{ outputs.categorize_changelog.vars.markdown }}"
          }

  - id: execution_summary
    type: io.kestra.plugin.core.debug.Return
    description: Return execution metadata and parsed metrics
    format: "Broadcast complete for {{ inputs.repository }} ({{ inputs.release_tag }}). Processed {{ outputs.categorize_changelog.vars.total_items }} changelog entries."

triggers:
  - id: webhook_trigger
    type: io.kestra.plugin.core.trigger.Webhook
    description: Webhook endpoint called by GitHub Actions upon tag creation
    key: "{{ secret('RELEASE_WEBHOOK_KEY') }}"

  - id: scheduled_check
    type: io.kestra.plugin.core.trigger.Schedule
    description: Optional weekly reconciliation run
    cron: "0 10 * * 1"
    disabled: true

errors:
  - id: on_failure_slack
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Notify on-call team if changelog generation fails
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "text": ":warning: *Release Automation Failed* for repository `{{ inputs.repository }}` (Tag: `{{ inputs.release_tag }}`). Check Kestra execution logs."
      }

outputs:
  - id: is_major
    type: BOOL
    value: "{{ outputs.categorize_changelog.vars.is_major }}"
  - id: total_items
    type: INT
    value: "{{ outputs.categorize_changelog.vars.total_items }}"
  - id: summary
    type: STRING
    value: "{{ outputs.execution_summary.value }}"

extend:
  title: GitHub Release Changelog Generator and Slack Broadcast
  shortDescription: Parse raw release commits into categorized changelogs and broadcast to Slack via webhook.
  metaTitle: GitHub Release Changelog Generator and Slack Broadcast for Kestra
  metaDescription: Automatically parse GitHub release commits into categorized release notes and broadcast updates to Slack channels using Kestra.
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Monitoring & Alerting
    - Reporting & Digests
  ee: false
  demo: false
  description: |
    Software release announcements keep engineering teams, product managers, and users informed, but manually drafting release notes and copy-pasting them into Slack channels is repetitive and prone to inconsistency. This blueprint automates release notifications directly from CI/CD webhooks or scheduled triggers: a Python task categorizes commit messages into conventional release buckets (breaking changes, features, bug fixes, and improvements), an `If` condition determines notification priority, and Slack webhooks broadcast formatted release notes to the appropriate channel.

    ## How it works

    1. `categorize_changelog` (`io.kestra.plugin.scripts.python.Script`) accepts `changelog_markdown`, parses each line, and categorizes commits into breaking changes, features, bug fixes, and maintenance improvements. It detects major releases when breaking keywords are present or when `release_tag` ends in `.0.0`. It outputs parsed counts, a boolean `is_major` flag, and a formatted Markdown string (`markdown`).
    2. `check_release_type` (`io.kestra.plugin.core.flow.If`) evaluates `{{ outputs.categorize_changelog.vars.is_major == true }}` to route notification urgency:
       - If true, `notify_urgent_slack` (`io.kestra.plugin.slack.notifications.SlackIncomingWebhook`) dispatches a high-priority alert for major releases.
       - If false, `notify_standard_slack` (`io.kestra.plugin.slack.notifications.SlackIncomingWebhook`) posts a standard release update.
    3. `execution_summary` (`io.kestra.plugin.core.debug.Return`) generates an execution summary string containing the repository name, release tag, and the total number of processed changelog lines.
    4. `webhook_trigger` (`io.kestra.plugin.core.trigger.Webhook`) allows external CI/CD pipelines (such as GitHub Actions) to trigger this flow upon publishing a new release tag.
    5. `scheduled_check` (`io.kestra.plugin.core.trigger.Schedule`) provides an optional scheduled run (disabled by default) for periodic release reconciliation.
    6. `on_failure_slack` (flow-level `errors` handler) sends an immediate failure alert to Slack if script execution or notification dispatch fails.

    ## What you get

    - Automated categorization of raw commit messages without external release drafting tools.
    - Conditional routing between high-priority and standard Slack channels based on semantic release impact.
    - Standardized Markdown release note formatting across repositories and deployment pipelines.
    - Dedicated failure handling that alerts the on-call team if release broadcasting fails.

    ## Who it's for

    - DevOps and Platform engineers standardizing release announcements across microservices.
    - Engineering teams using GitHub Actions or CI/CD pipelines who want hands-off release notes in Slack.
    - Product and engineering leads wanting prompt visibility into major releases and breaking changes.

    ## Why orchestrate this with Kestra

    Embedding release notification scripts inside individual CI/CD pipelines spreads webhook secrets across repositories and couples notification logic to specific runners. Handling notifications inside Kestra centralizes webhook authentication, provides a single audit log for all release events, enables retries if Slack experiences an outage, and allows teams to extend notifications to other systems (such as Microsoft Teams or Jira) without modifying CI/CD workflows in every repository.

    ## Prerequisites

    - A Kestra instance with network access to Slack's webhook endpoints.
    - An incoming webhook configured in your Slack workspace.
    - A CI/CD workflow (such as GitHub Actions) or webhook caller able to send an HTTP POST request to Kestra.

    ### Secrets

    - `SLACK_WEBHOOK`: Incoming Slack webhook URL used by the notification tasks and the error handler.
    - `RELEASE_WEBHOOK_KEY`: Secret key used to authenticate requests to the Kestra webhook trigger.

    In Kestra OSS (without an Enterprise secrets backend), secrets are supplied as environment variables prefixed with `SECRET_`, base64-encoded, and read using `{{ secret('NAME') }}`. For example:
    ```bash
    export SECRET_SLACK_WEBHOOK=$(echo -n '<your-slack-incoming-webhook-url>' | base64)
    export SECRET_RELEASE_WEBHOOK_KEY=$(echo -n '<your-secret-webhook-key>' | base64)
    ```
    This keeps tokens out of plain text in flow definitions. In production or Enterprise environments, use the built-in secret manager backend for fine-grained access control and encryption at rest.

    ## Quick start

    1. Configure the `SLACK_WEBHOOK` and `RELEASE_WEBHOOK_KEY` environment variables on your Kestra host or worker.
    2. Add this flow to Kestra in the `company.devops` namespace.
    3. Run the flow manually from the Kestra UI to test with the default sample inputs and verify that the formatted message posts to Slack.
    4. Call the Kestra webhook endpoint from your GitHub Actions release workflow:
       ```bash
       curl -X POST "https://<kestra-host>/api/v1/executions/webhook/company.devops/github-release-changelog-broadcast/${{ secrets.RELEASE_WEBHOOK_KEY }}" \
         -H "Content-Type: application/json" \
         -d '{
           "repository": "${{ github.repository }}",
           "release_tag": "${{ github.ref_name }}",
           "changelog_markdown": "${{ steps.changelog.outputs.notes }}"
         }'
       ```

    ## How to extend

    - Add an additional branch in `check_release_type` to notify customer-facing channels or incident response channels for security patches.
    - Connect `io.kestra.plugin.github.releases.Create` to publish the generated Markdown notes directly to the GitHub release page.
    - Query the GitHub REST API (`io.kestra.plugin.github`) directly in the flow to fetch commits dynamically between tags rather than passing raw changelog text as an input.
    - Add multi-platform broadcasts to email, Discord, or Microsoft Teams in parallel using `io.kestra.plugin.core.flow.Parallel`.

    ## Inputs

    - `repository`: GitHub repository in `owner/repo` format (default: `my-org/web-service`).
    - `release_tag`: Version tag being released (default: `v1.4.0`).
    - `target_branch`: Target deployment branch (default: `main`).
    - `changelog_markdown`: Raw commit titles or release lines to categorize.

    ## Outputs

    - `is_major`: Boolean indicating if breaking changes were detected.
    - `total_items`: Total changelog entries processed.
    - `summary`: High-level execution summary string.
    - `outputs.categorize_changelog.vars.markdown`: Categorized release notes formatted in Markdown.

    ## Links

    - [Kestra Slack Plugin](https://kestra.io/plugins/plugin-slack)
    - [Kestra Script Plugin (Python)](https://kestra.io/plugins/plugin-scripts)
    - [Kestra Webhook Triggers](https://kestra.io/docs/workflow-components/triggers/webhook-trigger)
    - [Kestra If Condition Task](https://kestra.io/plugins/core/tasks/flow/io.kestra.plugin.core.flow.if)
