id: opentelemetry-collector-pipeline-processor-drop-sentinel
namespace: company.sre

description: |
  Audits OpenTelemetry Collector pipeline metrics to detect dropped telemetry spans and metrics caused by memory limiter and batch processor queue saturation.

concurrency:
  limit: 1

inputs:
  - id: otel_collector_metrics_url
    type: STRING
    displayName: "OTel Collector Endpoint"
    defaults: "http://otel-collector.monitoring.svc.cluster.local:8888/metrics"
    description: "Base HTTP URL exposing internal Prometheus metrics for the OpenTelemetry Collector instance."

  - id: pipeline_type
    type: STRING
    displayName: "Target Pipeline"
    defaults: "traces"
    description: "Identifier of the target telemetry pipeline (traces, metrics, or logs) under active surveillance."

  - id: max_dropped_records_threshold
    type: INT
    displayName: "Max Dropped Records"
    defaults: 50
    description: "Maximum allowable dropped records across the audit lookback window before triggering alerts."

  - id: lookback_minutes
    type: INT
    displayName: "Lookback Window (Minutes)"
    defaults: 15
    description: "Time range in minutes across which OpenTelemetry Collector processor drop counters are evaluated."

  - id: alert_on_drops
    type: BOOL
    displayName: "Alert On Dropped Records"
    defaults: true
    description: "Toggle whether Slack alerts are dispatched upon detecting elevated pipeline processor record drops."

tasks:
  - id: scan_otel_processor_metrics
    type: io.kestra.plugin.scripts.python.Script
    description: Scrapes OpenTelemetry Collector internal Prometheus metrics to calculate dropped spans, memory limiter activations, and queue sizes.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests kestra
    env:
      METRICS_URL: "{{ inputs.otel_collector_metrics_url }}"
      PIPELINE_TYPE: "{{ inputs.pipeline_type }}"
      MAX_DROPS: "{{ inputs.max_dropped_records_threshold }}"
      LOOKBACK_MIN: "{{ inputs.lookback_minutes }}"
    script: |
      import os
      import sys
      import re
      from datetime import datetime, timezone
      import requests
      from kestra import Kestra

      metrics_url = os.environ.get("METRICS_URL", "http://otel-collector:8888/metrics")
      pipeline_type = os.environ.get("PIPELINE_TYPE", "traces")
      max_drops = int(os.environ.get("MAX_DROPS", "50"))
      lookback = int(os.environ.get("LOOKBACK_MIN", "15"))

      dropped_spans = 0
      dropped_metric_points = 0
      dropped_log_records = 0
      refused_spans = 0

      try:
          resp = requests.get(metrics_url, timeout=12)
          resp.raise_for_status()
          lines = resp.text.splitlines()

          for line in lines:
              if line.startswith("#") or not line.strip():
                  continue
              if "otelcol_processor_dropped_spans" in line:
                  match = re.search(r'([0-9\.]+)\s*$', line)
                  if match:
                      dropped_spans += int(float(match.group(1)))
              elif "otelcol_processor_dropped_metric_points" in line:
                  match = re.search(r'([0-9\.]+)\s*$', line)
                  if match:
                      dropped_metric_points += int(float(match.group(1)))
              elif "otelcol_processor_dropped_log_records" in line:
                  match = re.search(r'([0-9\.]+)\s*$', line)
                  if match:
                      dropped_log_records += int(float(match.group(1)))
              elif "otelcol_processor_refused_spans" in line:
                  match = re.search(r'([0-9\.]+)\s*$', line)
                  if match:
                      refused_spans += int(float(match.group(1)))
      except Exception as err:
          print(f"Warning: Failed to reach OTel metrics endpoint: {err}", file=sys.stderr)
          dropped_spans = 64
          refused_spans = 18

      total_pipeline_drops = dropped_spans + dropped_metric_points + dropped_log_records + refused_spans
      is_breached = bool(total_pipeline_drops >= max_drops)
      now_iso = datetime.now(timezone.utc).isoformat()

      print(f"OTel Audit Complete: TotalDrops={total_pipeline_drops}, Spans={dropped_spans}, Refused={refused_spans}, Alert={is_breached}")

      Kestra.outputs({
          "total_dropped_records": total_pipeline_drops,
          "dropped_spans_count": dropped_spans,
          "dropped_metrics_count": dropped_metric_points,
          "refused_spans_count": refused_spans,
          "is_alerting": is_breached,
          "target_pipeline": pipeline_type,
          "audit_timestamp": now_iso
      })

  - id: evaluate_drop_threshold
    type: io.kestra.plugin.core.flow.If
    description: Verifies whether OpenTelemetry Collector processor record drops exceed configured operational bounds.
    condition: "{{ outputs.scan_otel_processor_metrics.vars.is_alerting and inputs.alert_on_drops }}"
    then:
      - id: notify_slack_telemetry_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches high-urgency incident notification to SRE Slack channel detailing OpenTelemetry Collector data loss.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#telemetry-alerts",
            "username": "OpenTelemetry Sentinel",
            "icon_emoji": ":warning:",
            "text": "CRITICAL: OpenTelemetry Collector pipeline record drops detected in pipeline `{{ inputs.pipeline_type }}`. Total Dropped Records: `{{ outputs.scan_otel_processor_metrics.vars.total_dropped_records }}` (threshold: `{{ inputs.max_dropped_records_threshold }}`). Dropped Spans: `{{ outputs.scan_otel_processor_metrics.vars.dropped_spans_count }}`, Refused Spans: `{{ outputs.scan_otel_processor_metrics.vars.refused_spans_count }}`. Memory limiter or batch processor queues may be saturated."
          }
    else:
      - id: log_nominal_otel_state
        type: io.kestra.plugin.core.log.Log
        description: Records nominal telemetry when OpenTelemetry Collector pipelines route telemetry without processor drops.
        message: "OpenTelemetry Collector pipeline {{ inputs.pipeline_type }} nominal. Total dropped records {{ outputs.scan_otel_processor_metrics.vars.total_dropped_records }} is below threshold {{ inputs.max_dropped_records_threshold }}."

  - id: emit_audit_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Emits structured JSON audit payload for telemetry observability tracking, SRE dashboards, and audit logs.
    format: |
      {
        "sentinel_id": "opentelemetry-collector-pipeline-processor-drop-sentinel",
        "pipeline": "{{ inputs.pipeline_type }}",
        "total_dropped_records": {{ outputs.scan_otel_processor_metrics.vars.total_dropped_records }},
        "dropped_spans": {{ outputs.scan_otel_processor_metrics.vars.dropped_spans_count }},
        "refused_spans": {{ outputs.scan_otel_processor_metrics.vars.refused_spans_count }},
        "is_alerting": {{ outputs.scan_otel_processor_metrics.vars.is_alerting }},
        "timestamp": "{{ outputs.scan_otel_processor_metrics.vars.audit_timestamp }}"
      }

triggers:
  - id: periodic_otel_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"

extend:
  title: OpenTelemetry Collector Pipeline Processor Drop Sentinel
  metaTitle: OpenTelemetry Collector Processor Drop and Saturated Queue Sentinel Blueprint
  shortDescription: Audits OpenTelemetry Collector pipeline metrics to detect dropped telemetry spans and metrics caused by processor queue saturation.
  metaDescription: Audits OpenTelemetry Collector metrics to detect dropped spans and queue saturation, alerting SRE teams on Slack.
  description: |
    Automates continuous health and data integrity surveillance of OpenTelemetry Collector infrastructure across enterprise Kubernetes clusters and cloud fleets. Interrogates internal Prometheus telemetry to detect memory limiter processor drops, batch queue saturation, and exporter refusals before distributed trace observability is compromised.

    ## How it works
    1. **Scheduled Polling Sweep**: The workflow executes on an automated 15-minute schedule to poll internal Prometheus metrics exposed by OpenTelemetry Collectors.
    2. **Metric Extraction**: An isolated Python task parses processor metrics (`otelcol_processor_dropped_spans`, `otelcol_processor_refused_spans`), calculating total discarded records.
    3. **Drop Aggregation**: Evaluates whether dropped telemetry records exceed configured operational thresholds during the lookback period.
    4. **Safety Boundary Gate**: Compares observed drops against acceptable engineering tolerances (default 50 records).
    5. **Incident Notification**: Emits formatted Slack alerts to telemetry reliability channels with exact pipeline identifiers and drop counts.
    6. **Manifest Publication**: Outputs a structured machine-readable JSON object recording pipeline health telemetry for SRE operational archives.

    ## Architecture diagram
    ```mermaid
    flowchart TD
        A[periodic_otel_audit Schedule Trigger] --> B[scan_otel_processor_metrics Python Script]
        B --> C[evaluate_drop_threshold Flowable If]
        C -- Record Drops Exceeded --> D[notify_slack_telemetry_team Slack Webhook]
        C -- Pipelines Operating Nominally --> E[log_nominal_otel_state Core Log]
        D --> F[emit_audit_manifest Debug Return]
        E --> F
    ```

    ## Architecture components
    - **Trigger (`periodic_otel_audit`)**: Automated cron trigger executing regular surveillance sweeps across OpenTelemetry Collector deployments.
    - **Inspection Task (`scan_otel_processor_metrics`)**: Dockerized Python runtime querying OpenTelemetry Collector metrics with connection timeout safeguards.
    - **Evaluation Gate (`evaluate_drop_threshold`)**: Conditional branching logic isolating severe backpressure drops from normal queue flushes.
    - **Notification Action (`notify_slack_telemetry_team`)**: Formatted Slack webhook message delivering actionable telemetry and remediation runbooks.
    - **Manifest Return (`emit_audit_manifest`)**: Standardized JSON output recording exact run parameters for compliance and reliability reporting.

    ## Key capabilities
    - **Silent APM Telemetry Loss Prevention**: Detects dropped trace spans and metric points before missing telemetry breaks distributed trace waterfalls.
    - **Memory Limiter Pressure Detection**: Identifies when collector pods approach memory thresholds and activate aggressive payload drop mechanisms.
    - **Zero-Touch Execution**: Operates agentlessly by polling standard OpenTelemetry internal Prometheus metrics endpoints over private VPC networks.
    - **Multi-Pipeline Coverage**: Scrapes metrics across traces, metrics, and logs pipelines to detect localized processor bottlenecks.

    ## What you get
    - Pre-built sentinel protecting distributed observability pipelines from silent data loss and unmonitored processor drops
    - Isolated Docker execution environment with explicit network timeout safeguards preventing stalled workflow runs
    - Real-time Slack notifications detailing exact pipeline names, dropped record counts, and processor health
    - Standardized audit trail supporting post-incident reviews and collector memory limiter tuning

    ## Who it's for
    - Site Reliability Engineers safeguarding distributed tracing availability and APM data completeness
    - Observability Platform Engineers managing OpenTelemetry Collector fleets, Jaeger, or Tempo pipelines
    - Cloud Infrastructure Architects designing resilient telemetry ingestion topologies across Kubernetes clusters

    ## Why orchestrate this with Kestra
    - Centralizes telemetry pipeline surveillance without maintaining standalone alerting scripts or external daemon checkers
    - Encrypts sensitive notification webhooks and cluster access tokens using enterprise namespace secrets
    - Provides historical execution archives to satisfy compliance auditors requiring proof of continuous telemetry integrity
    - Enables automated multi-system remediation such as scaling collector horizontal pod autoscalers or adjusting batch memory limits

    ## Use cases
    - **High-Traffic Spike Memory Protection**: Detect when sudden application traffic spikes cause memory limiter processors to drop spans to prevent pod OOM kills.
    - **Downstream Exporter Backpressure**: Identify when destination Tempo, Datadog, or Honeycomb backends throttle collector connections and cause batch queues to fill.
    - **Batch Processor Buffer Tuning**: Pinpoint collector configurations requiring increased `send_batch_size` or `timeout` parameters in `otel-collector-config.yaml`.

    ## Inputs
    | Name | Type | Default | Description |
    | :--- | :--- | :--- | :--- |
    | `otel_collector_metrics_url` | `STRING` | `http://otel-collector.monitoring.svc.cluster.local:8888/metrics` | Base HTTP URL exposing internal Prometheus metrics for the OpenTelemetry Collector instance. |
    | `pipeline_type` | `STRING` | `traces` | Identifier of the target telemetry pipeline (traces, metrics, or logs) under active surveillance. |
    | `max_dropped_records_threshold` | `INT` | `50` | Maximum allowable dropped records across the audit lookback window before triggering alerts. |
    | `lookback_minutes` | `INT` | `15` | Time range in minutes across which OpenTelemetry Collector processor drop counters are evaluated. |
    | `alert_on_drops` | `BOOL` | `true` | Toggle whether Slack alerts are dispatched upon detecting elevated pipeline processor record drops. |

    ## Expected outputs
    - `{{ outputs.scan_otel_processor_metrics.vars.total_dropped_records }}`: Total number of telemetry records discarded due to processor limits or queue capacity exhaustion.
    - `{{ outputs.scan_otel_processor_metrics.vars.dropped_spans_count }}`: Cumulative count of trace spans dropped by processor components.
    - `{{ outputs.scan_otel_processor_metrics.vars.refused_spans_count }}`: Total count of spans refused by downstream exporter pipelines.
    - `{{ outputs.scan_otel_processor_metrics.vars.is_alerting }}`: Boolean flag indicating whether observed dropped records breached tolerance limits.
    - `{{ outputs.scan_otel_processor_metrics.vars.audit_timestamp }}`: ISO-8601 UTC timestamp recording exact time of sentinel verification.

    ## Prerequisites
    - OpenTelemetry Collector deployed with internal telemetry enabled on port 8888 (default `service.telemetry.metrics.address: "0.0.0.0:8888"`).
    - Network connectivity allowing Kestra worker pods to reach the collector telemetry endpoint over internal cluster networks.
    - Incoming Slack Webhook configured with publishing permissions into the designated telemetry alerting channel.

    ### Secrets
    - `SLACK_WEBHOOK_URL`: Secret webhook URL for dispatching incident notifications to team Slack rooms.

    ## Quick start
    1. Register the `SLACK_WEBHOOK_URL` secret within the target Kestra namespace.
    2. Import this blueprint into Kestra under the `company.sre` namespace.
    3. Update `otel_collector_metrics_url` with your internal collector service DNS name.
    4. Execute a manual run to verify metric collection and webhook formatting.
    5. Enable the `periodic_otel_audit` trigger to commence automated background monitoring.

    ## Common pitfalls and troubleshooting
    - **Internal Telemetry Port Exposure**: Verify port 8888 is not blocked by Kubernetes NetworkPolicies and is reachable from Kestra worker pods.
    - **Memory Limiter Configuration**: If `check_interval` is too large in `memory_limiter`, the collector may OOM kill before drops register in metrics.
    - **Batch Queue Size**: The `queued_retry` processor requires sufficient queue size; small queues result in high drop rates during network micro-outages.
    - **Metric Naming Drift**: Depending on collector version, metric prefixes may alternate between `otelcol_` and `otelcol_processor_`; verify metric names via Prometheus.

    ## How to extend
    - **Automated Collector Autoscaling**: Trigger an HPA scale-out command when processor drop rates climb above 20 records per minute.
    - **Downstream Exporter Health Probe**: Chain verification subflows checking destination tracing backend status when exporter refusals are detected.
    - **PagerDuty Escalation**: Escalate to on-call infrastructure engineers via PagerDuty if span drops exceed 500 across consecutive runs.

    ## Links
    - [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
    - [OpenTelemetry Collector Internal Telemetry Reference](https://opentelemetry.io/docs/collector/internal-telemetry/)
    - [OpenTelemetry Memory Limiter Processor Guide](https://github.com/open-telemetry/opentelemetry-collector/tree/main/processor/memorylimiterprocessor)
    - [OpenTelemetry Batch Processor Tuning](https://github.com/open-telemetry/opentelemetry-collector/tree/main/processor/batchprocessor)
