id: postgres-toast-table-bloat-sentinel
namespace: company.database

inputs:
  - id: db_host
    type: STRING
    defaults: "postgres.internal"
    description: PostgreSQL database server hostname or IP.
  - id: db_port
    type: INT
    defaults: 5432
    description: PostgreSQL server port.
  - id: db_name
    type: STRING
    defaults: "postgres"
    description: PostgreSQL database name.
  - id: db_user
    type: STRING
    defaults: "postgres"
    description: PostgreSQL administrative user.
  - id: min_toast_bytes
    type: INT
    defaults: 1073741824
    description: Minimum TOAST table size in bytes before evaluating bloat (default 1GB).

tasks:
  - id: query_toast_bloat
    type: io.kestra.plugin.jdbc.postgresql.Query
    url: "jdbc:postgresql://{{ inputs.db_host }}:{{ inputs.db_port }}/{{ inputs.db_name }}"
    username: "{{ inputs.db_user }}"
    password: "{{ secret('POSTGRES_PASSWORD') }}"
    sql: |
      SELECT 
          c.relname AS table_name,
          pg_size_pretty(pg_total_relation_size(c.oid)) AS total_table_size,
          pg_size_pretty(pg_total_relation_size(c.reltoastrelid)) AS toast_size,
          pg_total_relation_size(c.reltoastrelid) AS toast_bytes
      FROM pg_class c
      JOIN pg_namespace n ON n.oid = c.relnamespace
      WHERE c.relkind = 'r'
        AND c.reltoastrelid != 0
        AND n.nspname = 'public'
        AND pg_total_relation_size(c.reltoastrelid) > {{ inputs.min_toast_bytes }}
      ORDER BY pg_total_relation_size(c.reltoastrelid) DESC
      LIMIT 10;
    fetchType: FETCH

  - id: evaluate_toast_bloat
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.query_toast_bloat.rows | length > 0 }}"
    then:
      - id: notify_dba_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#dba-alerts",
            "attachments": [
              {
                "color": "warning",
                "title": "⚠️ PostgreSQL Large TOAST Table Storage Bloat Alert",
                "text": "Detected *{{ outputs.query_toast_bloat.rows | length }}* table(s) with large TOAST storage (>={{ inputs.min_toast_bytes }} bytes). Offending tables: {{ outputs.query_toast_bloat.rows }}. Impact: Out-of-line storage (JSONB, BYTEA, TEXT) accumulates large dead tuple bloat, driving unnecessary disk space consumption and slow sequential table scans.",
                "footer": "Kestra Database Sentinel • Postgres TOAST Bloat"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#dba-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ Postgres TOAST Bloat Sentinel Execution Failed",
            "text": "The PostgreSQL TOAST table bloat query failed. Please verify database connectivity and credentials.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 10 * * 1"
    disabled: true

extend:
  metaDescription: "Audits PostgreSQL pg_class metadata to detect bloated TOAST tables storing large JSONB and TEXT columns out-of-line."
  metaTitle: PostgreSQL TOAST Table Storage Bloat and Tuple Churn Sentinel with Kestra
  title: PostgreSQL TOAST Table Storage Bloat and Tuple Churn Sentinel
  shortDescription: Audits PostgreSQL pg_class metadata to detect bloated TOAST tables storing large JSONB and TEXT columns out-of-line.
  description: |
    ## How it works
    This workflow uses the native Kestra PostgreSQL JDBC plugin to query `pg_class` and measure the disk footprint of associated `reltoastrelid` tables. When relational tables store large text, bytea, or JSONB documents, values exceeding 2KB are compressed and stored out-of-line in separate TOAST tables. Frequent updates to these columns generate heavy dead tuple churn in TOAST storage. When TOAST tables exceed the threshold, an automated FinOps and DBA notification is sent to Slack.

    ## What you get
    - Proactive discovery of hidden storage consumption in large out-of-line attributes.
    - Prevents runaway cloud database storage auto-scaling charges.
    - Actionable recommendations to run targeted `VACUUM FULL` or tune storage compression.

    ## Who it's for
    - Database Administrators (DBAs) and SREs optimizing PostgreSQL storage efficiency.
    - Backend developers designing schemas with heavy JSONB or document storage patterns.

    ## Why orchestrate this with Kestra
    - **Native Database Driver**: Direct SQL execution using `io.kestra.plugin.jdbc.postgresql.Query`.
    - **Scheduled Hygiene**: Perform weekly or monthly storage hygiene sweeps automatically.
    - **Clear Visibility**: Contextual Slack notifications list top bloated tables with human-readable sizes.

    ## Prerequisites
    - PostgreSQL database credentials with access to `pg_class` and `pg_namespace`.
    - Secrets `POSTGRES_PASSWORD` and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import this blueprint into Kestra.
    2. Configure database connection parameters and secrets.
    3. Run the workflow to inspect TOAST storage across your tables.

    ## How to extend
    - Correlate with `pg_stat_all_tables` dead tuple metrics (`n_dead_tup`).
    - Schedule off-hours `pg_repack` jobs to compact bloated tables without exclusive locks.

    ## Links
    - [PostgreSQL TOAST Storage Documentation](https://www.postgresql.org/docs/current/storage-toast.html)
    - [Kestra PostgreSQL Plugin](https://kestra.io/plugins/plugin-jdbc-postgres)
  tags:
    - Data
    - Infrastructure
  subTags:
    - ELT & Data Landing
    - Day 2 Operations
  ee: false
  demo: false
