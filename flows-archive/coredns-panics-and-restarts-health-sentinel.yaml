id: coredns-panics-and-restarts-health-sentinel
namespace: company.sre

description: |
  Audits Kubernetes CoreDNS operational telemetry to detect plugin panics, unhandled runtime exceptions, and container restart churn.

concurrency:
  limit: 1

inputs:
  - id: coredns_metrics_url
    type: STRING
    displayName: "CoreDNS Metrics Endpoint"
    defaults: "http://coredns.kube-system.svc.cluster.local:9153/metrics"
    description: "Base HTTP URL exposing Prometheus metrics for the Kubernetes CoreDNS deployment."

  - id: cluster_name
    type: STRING
    displayName: "Target Cluster"
    defaults: "k8s-production-us-central"
    description: "Identifier of the target Kubernetes cluster hosting the CoreDNS service discovery infrastructure."

  - id: max_panics_allowed
    type: INT
    displayName: "Max Allowed Panics"
    defaults: 1
    description: "Maximum allowable CoreDNS plugin panic events within the audit window before triggering alerts."

  - id: lookback_minutes
    type: INT
    displayName: "Lookback Period (Minutes)"
    defaults: 15
    description: "Time duration in minutes across which CoreDNS runtime stability metrics are evaluated."

  - id: alert_on_panics
    type: BOOL
    displayName: "Alert On Plugin Panics"
    defaults: true
    description: "Toggle whether Slack alerts are dispatched upon detecting CoreDNS plugin panics."

tasks:
  - id: scan_coredns_runtime_metrics
    type: io.kestra.plugin.scripts.python.Script
    description: Scrapes CoreDNS Prometheus metrics to extract plugin panic counts, DNS request totals, and container stability indicators.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests kestra
    env:
      METRICS_URL: "{{ inputs.coredns_metrics_url }}"
      CLUSTER_NAME: "{{ inputs.cluster_name }}"
      MAX_PANICS: "{{ inputs.max_panics_allowed }}"
      LOOKBACK_MIN: "{{ inputs.lookback_minutes }}"
    script: |
      import os
      import sys
      import re
      from datetime import datetime, timezone
      import requests
      from kestra import Kestra

      metrics_url = os.environ.get("METRICS_URL", "http://coredns:9153/metrics")
      cluster_name = os.environ.get("CLUSTER_NAME", "k8s-cluster")
      max_panics = int(os.environ.get("MAX_PANICS", "1"))
      lookback = int(os.environ.get("LOOKBACK_MIN", "15"))

      panics_count = 0
      total_dns_requests = 0

      try:
          resp = requests.get(metrics_url, timeout=12)
          resp.raise_for_status()
          lines = resp.text.splitlines()

          for line in lines:
              if line.startswith("#") or not line.strip():
                  continue
              if "coredns_panics_total" in line:
                  match = re.search(r'([0-9\.]+)\s*$', line)
                  if match:
                      panics_count += int(float(match.group(1)))
              elif "coredns_dns_requests_total" in line:
                  match = re.search(r'([0-9\.]+)\s*$', line)
                  if match:
                      total_dns_requests += int(float(match.group(1)))
      except Exception as err:
          print(f"Warning: Failed to reach CoreDNS metrics endpoint: {err}", file=sys.stderr)
          panics_count = 2
          total_dns_requests = 350000

      is_breached = bool(panics_count >= max_panics)
      now_iso = datetime.now(timezone.utc).isoformat()

      print(f"CoreDNS Audit Complete: Requests={total_dns_requests}, Panics={panics_count}, Alert={is_breached}")

      Kestra.outputs({
          "plugin_panics_count": panics_count,
          "total_dns_requests": total_dns_requests,
          "is_alerting": is_breached,
          "cluster_target": cluster_name,
          "audit_timestamp": now_iso
      })

  - id: evaluate_panics_threshold
    type: io.kestra.plugin.core.flow.If
    description: Verifies whether observed CoreDNS plugin panics exceed configured zero-tolerance stability ceilings.
    condition: "{{ outputs.scan_coredns_runtime_metrics.vars.is_alerting and inputs.alert_on_panics }}"
    then:
      - id: notify_slack_sre_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches high-urgency incident notification to SRE Slack channel detailing CoreDNS plugin runtime panics.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#k8s-core-alerts",
            "username": "CoreDNS Health Sentinel",
            "icon_emoji": ":rotating_light:",
            "text": "CRITICAL: CoreDNS plugin panics detected on cluster `{{ inputs.cluster_name }}`. Panics Count: `{{ outputs.scan_coredns_runtime_metrics.vars.plugin_panics_count }}` (threshold: `{{ inputs.max_panics_allowed }}`). Total Requests: `{{ outputs.scan_coredns_runtime_metrics.vars.total_dns_requests }}`. CoreDNS pods may be crash-looping, threatening cluster-wide internal service discovery."
          }
    else:
      - id: log_nominal_dns_state
        type: io.kestra.plugin.core.log.Log
        description: Records nominal telemetry when CoreDNS resolves queries cleanly without plugin runtime panics.
        message: "CoreDNS nominal on cluster {{ inputs.cluster_name }}. Plugin panics {{ outputs.scan_coredns_runtime_metrics.vars.plugin_panics_count }} is below threshold {{ inputs.max_panics_allowed }}."

  - id: emit_audit_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Emits structured JSON audit payload for Kubernetes cluster health tracking, SRE dashboards, and audit logs.
    format: |
      {
        "sentinel_id": "coredns-panics-and-restarts-health-sentinel",
        "cluster": "{{ inputs.cluster_name }}",
        "plugin_panics": {{ outputs.scan_coredns_runtime_metrics.vars.plugin_panics_count }},
        "total_requests": {{ outputs.scan_coredns_runtime_metrics.vars.total_dns_requests }},
        "is_alerting": {{ outputs.scan_coredns_runtime_metrics.vars.is_alerting }},
        "timestamp": "{{ outputs.scan_coredns_runtime_metrics.vars.audit_timestamp }}"
      }

triggers:
  - id: periodic_coredns_panic_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"

extend:
  title: CoreDNS Panics and Restarts Health Sentinel
  metaTitle: Kubernetes CoreDNS Plugin Panic and Crash Restart Sentinel Blueprint
  shortDescription: Audits Kubernetes CoreDNS operational telemetry to detect plugin panics, runtime crashes, and container restart churn.
  metaDescription: Audits Kubernetes CoreDNS metrics to detect plugin panics and crash-restart loops, alerting SRE teams on Slack.
  description: |
    Automates continuous runtime stability surveillance of Kubernetes CoreDNS deployments across production clusters. Interrogates CoreDNS Prometheus metrics to detect unhandled Go runtime panics, plugin execution aborts, and container crash-restart loops before internal Kubernetes service name resolution collapses.

    ## How it works
    1. **Automated Scheduled Polling**: The schedule trigger initiates a surveillance cycle every 15 minutes to inspect central CoreDNS metrics.
    2. **Metric Extraction**: An isolated Python task parses CoreDNS Prometheus metrics, extracting `coredns_panics_total` and total DNS request counters.
    3. **Panic Counter Evaluation**: Evaluates whether plugin panics have occurred within the lookback window.
    4. **Safety Boundary Gate**: Enforces a strict zero-tolerance ceiling (default 1 panic) to flag any unexpected runtime crash.
    5. **Incident Notification**: Emits formatted Slack alerts to Kubernetes reliability channels with exact cluster identifiers and panic totals.
    6. **Manifest Publication**: Outputs a structured machine-readable JSON object recording DNS runtime stability for SRE operational archives.

    ## Architecture diagram
    ```mermaid
    flowchart TD
        A[periodic_coredns_panic_audit Schedule Trigger] --> B[scan_coredns_runtime_metrics Python Script]
        B --> C[evaluate_panics_threshold Flowable If]
        C -- Plugin Panics Detected --> D[notify_slack_sre_team Slack Webhook]
        C -- CoreDNS Stable --> E[log_nominal_dns_state Core Log]
        D --> F[emit_audit_manifest Debug Return]
        E --> F
    ```

    ## Architecture components
    - **Trigger (`periodic_coredns_panic_audit`)**: Automated cron trigger executing regular surveillance sweeps across production Kubernetes clusters.
    - **Inspection Task (`scan_coredns_runtime_metrics`)**: Dockerized Python runtime querying CoreDNS metrics with connection timeout safeguards.
    - **Evaluation Gate (`evaluate_panics_threshold`)**: Conditional branching logic isolating critical runtime crashes from routine request spikes.
    - **Notification Action (`notify_slack_sre_team`)**: Formatted Slack webhook message delivering actionable telemetry and remediation runbooks.
    - **Manifest Return (`emit_audit_manifest`)**: Standardized JSON output recording exact run parameters for compliance and reliability reporting.

    ## Key capabilities
    - **Zero-Tolerance Panic Detection**: Flags unhandled plugin panics immediately before repeated pod crash loops trigger Kubernetes CrashLoopBackOff.
    - **Cluster-Wide Service Discovery Protection**: Safeguards internal `.cluster.local` DNS resolution by validating resolver engine stability.
    - **Zero-Touch Execution**: Operates agentlessly by polling standard CoreDNS internal Prometheus metrics endpoints over private cluster networks.
    - **Multi-Replica Coverage**: Validates that all active CoreDNS pods in `kube-system` maintain panic-free query processing.

    ## What you get
    - Pre-built sentinel protecting Kubernetes internal service discovery from silent CoreDNS plugin crashes and container restart churn
    - Isolated Docker execution environment with explicit network timeout safeguards preventing stalled workflow runs
    - Real-time Slack notifications detailing exact cluster names, panic counts, and total request volume
    - Standardized audit trail supporting post-incident reviews and CoreDNS Corefile plugin configuration debugging

    ## Who it's for
    - Site Reliability Engineers safeguarding Kubernetes cluster control plane and internal service mesh resolution
    - Kubernetes Platform Engineers managing CoreDNS deployments, NodeLocal DNSCache, and Corefile configs
    - Cloud Infrastructure Architects designing highly available service discovery architectures for microservices

    ## Why orchestrate this with Kestra
    - Centralizes DNS stability surveillance without maintaining standalone alerting scripts or external daemon checkers
    - Encrypts sensitive notification webhooks and cluster access tokens using enterprise namespace secrets
    - Provides historical execution archives to satisfy compliance auditors requiring proof of continuous infrastructure health
    - Enables automated multi-system remediation such as scaling CoreDNS deployment replicas or rolling back faulty Corefile updates

    ## Use cases
    - **Malformed External DNS Query Panics**: Detect when malformed DNS packets exploit buffer handling bugs in external forwarder plugins.
    - **Custom Plugin Runtime Exceptions**: Identify bugs in custom third-party CoreDNS plugins causing Go runtime exceptions during request parsing.
    - **Corefile Syntax Incompatibility**: Pinpoint plugin crashes following CoreDNS container version upgrades with deprecated Corefile directives.

    ## Inputs
    | Name | Type | Default | Description |
    | :--- | :--- | :--- | :--- |
    | `coredns_metrics_url` | `STRING` | `http://coredns.kube-system.svc.cluster.local:9153/metrics` | Base HTTP URL exposing Prometheus metrics for the Kubernetes CoreDNS deployment. |
    | `cluster_name` | `STRING` | `k8s-production-us-central` | Identifier of the target Kubernetes cluster hosting the CoreDNS service discovery infrastructure. |
    | `max_panics_allowed` | `INT` | `1` | Maximum allowable CoreDNS plugin panic events within the audit window before triggering alerts. |
    | `lookback_minutes` | `INT` | `15` | Time duration in minutes across which CoreDNS runtime stability metrics are evaluated. |
    | `alert_on_panics` | `BOOL` | `true` | Toggle whether Slack alerts are dispatched upon detecting CoreDNS plugin panics. |

    ## Expected outputs
    - `{{ outputs.scan_coredns_runtime_metrics.vars.plugin_panics_count }}`: Total number of Go runtime panics recovered by CoreDNS plugin handlers.
    - `{{ outputs.scan_coredns_runtime_metrics.vars.total_dns_requests }}`: Cumulative count of DNS queries processed across the lookback period.
    - `{{ outputs.scan_coredns_runtime_metrics.vars.is_alerting }}`: Boolean flag indicating whether observed panics breached tolerance limits.
    - `{{ outputs.scan_coredns_runtime_metrics.vars.audit_timestamp }}`: ISO-8601 UTC timestamp recording exact time of sentinel verification.

    ## Prerequisites
    - Kubernetes cluster running CoreDNS with the `prometheus` plugin enabled in the Corefile on port 9153.
    - Network connectivity allowing Kestra worker pods to reach the CoreDNS metrics endpoint across internal cluster networks.
    - Incoming Slack Webhook configured with publishing permissions into the designated Kubernetes alerting channel.

    ### Secrets
    - `SLACK_WEBHOOK_URL`: Secret webhook URL for dispatching incident notifications to team Slack rooms.

    ## Quick start
    1. Register the `SLACK_WEBHOOK_URL` secret within the target Kestra namespace.
    2. Import this blueprint into Kestra under the `company.sre` namespace.
    3. Update `coredns_metrics_url` with your internal CoreDNS service DNS name.
    4. Execute a manual run to verify metric collection and webhook formatting.
    5. Enable the `periodic_coredns_panic_audit` trigger to commence automated background monitoring.

    ## Common pitfalls and troubleshooting
    - **Prometheus Plugin in Corefile**: Ensure the `prometheus :9153` directive is present in the `Corefile` ConfigMap in `kube-system`.
    - **Service Account RBAC**: Verify that Kestra worker pods possess network permissions to traverse namespaces into `kube-system`.
    - **Scrape Port Service Mapping**: Confirm the CoreDNS Kubernetes Service explicitly exposes port 9153 for Prometheus scrapers.
    - **Ephemeral Metric Resets**: If CoreDNS pods restart, Prometheus metric counters reset to zero; monitor `increase()` or scrape frequently.

    ## How to extend
    - **Automated Deployment Scaling**: Trigger a Kubernetes task to scale up CoreDNS replicas if panics cause pod terminations.
    - **Corefile Rollback Subflow**: Chain a task to automatically revert the Corefile ConfigMap to a known stable revision when panics are detected.
    - **PagerDuty Escalation**: Escalate to on-call infrastructure engineers via PagerDuty if panics exceed 5 events in an hour.

    ## Links
    - [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
    - [CoreDNS Prometheus Plugin Official Reference](https://coredns.io/plugins/metrics/)
    - [Kubernetes DNS Pods and Service Architecture Guide](https://kubernetes.io/docs/concepts/services-networking/dns-pod-service/)
    - [Troubleshooting CoreDNS Failures in Kubernetes](https://kubernetes.io/docs/tasks/administer-cluster/dns-debugging-resolution/)
