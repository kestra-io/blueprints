id: kubernetes-node-notready-condition-sentinel
namespace: company.sre
description: |
  Continuously monitors Kubernetes cluster nodes for NotReady status conditions or DiskPressure,
  identifies impaired nodes, and dispatches an actionable alert to Slack.
inputs:
  - id: cluster_context
    type: STRING
    displayName: Kubernetes Cluster Context
    defaults: production-cluster
  - id: alert_channel
    type: STRING
    displayName: Slack Alert Channel
    defaults: sre-alerts

triggers:
  - id: periodic_node_health_check
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/10 * * * *"
    disabled: true

tasks:
  - id: inspect_node_conditions
    type: io.kestra.plugin.scripts.shell.Commands
    description: Queries Kubernetes API via kubectl to inspect node readiness conditions
    runner: PROCESS
    commands:
      - |
        kubectl get nodes -o json | jq '[.items[] | {
          name: .metadata.name,
          ready: ([.status.conditions[] | select(.type=="Ready" and .status=="True")] | length > 0),
          disk_pressure: ([.status.conditions[] | select(.type=="DiskPressure" and .status=="True")] | length > 0),
          memory_pressure: ([.status.conditions[] | select(.type=="MemoryPressure" and .status=="True")] | length > 0)
        } | select(.ready == false or .disk_pressure == true or .memory_pressure == true)]' > impaired_nodes.json
        
        COUNT=$(jq 'length' impaired_nodes.json)
        echo "::{\"outputs\":{\"impaired_count\": $COUNT}}::"
    outputFiles:
      - impaired_nodes.json

  - id: evaluate_node_health
    type: io.kestra.plugin.core.flow.If
    description: Dispatches high-priority incident notification if any node is impaired
    condition: "{{ outputs.inspect_node_conditions.vars.impaired_count > 0 }}"
    then:
      - id: alert_sre_slack
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Alerts SRE team on Slack with affected node list
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "text": "🚨 *Kubernetes Node Impairment Detected*\n*Cluster:* `{{ inputs.cluster_context }}`\n*Impaired Nodes Count:* *{{ outputs.inspect_node_conditions.vars.impaired_count }}*\n\nReview node conditions and pod evictions immediately."
          }
    else:
      - id: log_nodes_healthy
        type: io.kestra.plugin.core.log.Log
        message: "All Kubernetes cluster nodes in {{ inputs.cluster_context }} report Ready with zero pressure conditions."

errors:
  - id: alert_flow_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alerts Slack if node inspection execution fails
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "text": "⚠️ *Kubernetes Node Sentinel Execution Failed* for cluster `{{ inputs.cluster_context }}` in execution `{{ execution.id }}`."
      }

extend:
  title: Kubernetes Node NotReady Condition and Resource Pressure Sentinel
  shortDescription: Continuously monitor Kubernetes cluster nodes for NotReady states, DiskPressure, and MemoryPressure, alerting SRE teams via Slack.
  metaTitle: Kubernetes Node Health Sentinel with Kestra
  metaDescription: Automated Kubernetes node readiness monitoring with Kestra. Detect NotReady or pressure conditions and alert Slack.
  description: |
    Production Kubernetes clusters require all worker nodes to remain healthy and responsive. When nodes encounter kubelet crashes, container runtime failures, or disk saturation, Kubernetes flags them with `NotReady`, `DiskPressure`, or `MemoryPressure`. If unnoticed, workloads can become unschedulable or suffer sudden evictions.

    This blueprint regularly queries the Kubernetes API for node status conditions, extracts impaired nodes, and immediately notifies the SRE team via Slack with cluster diagnostic context.

    ## How it works

    1. `periodic_node_health_check` triggers on a 10-minute schedule.
    2. `inspect_node_conditions` uses `kubectl` to inspect all nodes, filtering for any node where `Ready != True` or pressure flags are active.
    3. `evaluate_node_health` checks if any nodes are impaired.
    4. If impaired nodes are found, `alert_sre_slack` sends a detailed alert to Slack.
    5. If all nodes are healthy, `log_nodes_healthy` logs a green status.
    6. `errors` block catches execution failures and notifies Slack.

    ## What you get

    - Automated detection of unready worker nodes before cascading pod evictions.
    - Zero external monitoring server dependencies.
    - Rich Slack notifications with cluster context.

    ## Who it's for

    - Site Reliability Engineers (SREs) managing Kubernetes infrastructure.
    - Platform Engineering teams maintaining multi-tenant clusters.
    - DevOps engineers tracking cluster stability.

    ## Why orchestrate this with Kestra

    Kestra provides a lightweight, auditable, and automated orchestration engine that integrates directly with Kubernetes CLI/APIs and incident chat channels without running dedicated daemons.

    ## Prerequisites

    - A running Kubernetes cluster.
    - A valid `kubeconfig` configured on the Kestra worker or runner environment.
    - A Slack incoming webhook URL.

    ### Secrets

    - `SLACK_WEBHOOK`: Incoming Webhook URL for Slack alerts.

    ## Inputs

    - `cluster_context`: Target Kubernetes cluster context name.
    - `alert_channel`: Slack channel for notification dispatch.

    ## Quick start

    1. Import this blueprint into your Kestra instance.
    2. Ensure Kestra has access to your Kubernetes cluster.
    3. Configure the `SLACK_WEBHOOK` secret.
    4. Run manually to verify cluster node status.
    5. Enable the schedule trigger for continuous monitoring.

    ## How to extend

    - Add automated node cordoning or drain commands for degraded nodes.
    - Route critical alerts to PagerDuty or OpsGenie.

    ## Links

    - [Kubernetes Node Conditions Documentation](https://kubernetes.io/docs/concepts/architecture/nodes/#condition)
    - [Kestra Documentation](https://kestra.io/docs)
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Monitoring & Alerting
  ee: false
  demo: false
