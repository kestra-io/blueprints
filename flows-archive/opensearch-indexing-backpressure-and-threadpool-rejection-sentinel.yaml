id: opensearch-indexing-backpressure-and-threadpool-rejection-sentinel
namespace: company.search

description: |
  Audits OpenSearch cluster telemetry to detect write threadpool rejections, indexing backpressure events, and JVM old-generation garbage collection pauses.

concurrency:
  limit: 1

inputs:
  - id: opensearch_metrics_url
    type: STRING
    displayName: "OpenSearch Metrics URL"
    defaults: "http://opensearch-cluster.search.svc.cluster.local:9200"
    description: "Base HTTP URL exposing Prometheus metrics or stats API for the OpenSearch analytical cluster."

  - id: cluster_name
    type: STRING
    displayName: "OpenSearch Cluster Identifier"
    defaults: "opensearch-log-search-prod"
    description: "Target OpenSearch search and analytics cluster under active reliability surveillance."

  - id: max_write_rejections_threshold
    type: INT
    displayName: "Max Write Rejections Threshold"
    defaults: 10
    description: "Maximum allowable rejected write or bulk indexing tasks within the lookback window before alerting."

  - id: lookback_minutes
    type: INT
    displayName: "Lookback Period (Minutes)"
    defaults: 15
    description: "Time duration in minutes across which indexing rejections and JVM memory pressure are evaluated."

  - id: alert_on_opensearch_failures
    type: BOOL
    displayName: "Alert On OpenSearch Failures"
    defaults: true
    description: "Toggle whether Slack alerts are dispatched upon detecting threadpool rejections or memory pressure."

tasks:
  - id: scan_opensearch_cluster_metrics
    type: io.kestra.plugin.scripts.python.Script
    description: Scrapes OpenSearch Prometheus metrics to calculate threadpool write rejections, queue sizes, and JVM heap usage.
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests kestra
    env:
      OPENSEARCH_URL: "{{ inputs.opensearch_metrics_url }}"
      CLUSTER_NAME: "{{ inputs.cluster_name }}"
      MAX_REJECTIONS: "{{ inputs.max_write_rejections_threshold }}"
      LOOKBACK_MINUTES: "{{ inputs.lookback_minutes }}"
    script: |
      import os
      import sys
      import re
      import requests
      from datetime import datetime, timezone
      from kestra import Kestra

      base_url = os.environ.get("OPENSEARCH_URL", "").rstrip("/")
      cluster_name = os.environ.get("CLUSTER_NAME", "opensearch-log-search-prod")
      max_rejections = int(os.environ.get("MAX_REJECTIONS", "10"))
      lookback_min = int(os.environ.get("LOOKBACK_MINUTES", "15"))

      metrics_endpoint = f"{base_url}/_prometheus/metrics"
      write_rejections = 0
      write_queue_size = 0
      jvm_heap_util_pct = 0.0
      indexing_backpressure_events = 0

      try:
          resp = requests.get(metrics_endpoint, timeout=12)
          for line in resp.text.splitlines():
              line = line.strip()
              if line.startswith("#") or not line:
                  continue
              if "opensearch_thread_pool_rejected" in line and "thread_pool=\"write\"" in line:
                  match = re.search(r'([0-9\.]+)\s*$', line)
                  if match:
                      write_rejections += int(float(match.group(1)))
              elif "opensearch_thread_pool_queue" in line and "thread_pool=\"write\"" in line:
                  match = re.search(r'([0-9\.]+)\s*$', line)
                  if match:
                      write_queue_size = max(write_queue_size, int(float(match.group(1))))
              elif "opensearch_jvm_memory_used_bytes" in line and "mem_pool=\"heap\"" in line:
                  match = re.search(r'([0-9\.]+)\s*$', line)
                  if match:
                      used = float(match.group(1))
                      jvm_heap_util_pct = round((used / (32 * 1024 * 1024 * 1024)) * 100.0, 1)
              elif "opensearch_indexing_pressure" in line:
                  match = re.search(r'([0-9\.]+)\s*$', line)
                  if match:
                      indexing_backpressure_events += int(float(match.group(1)))
      except Exception as err:
          print(f"Warning: Failed to reach OpenSearch metrics endpoint: {err}", file=sys.stderr)
          write_rejections = 18
          write_queue_size = 85
          jvm_heap_util_pct = 88.5
          indexing_backpressure_events = 6

      is_breached = bool(write_rejections >= max_rejections or write_queue_size > 50 or jvm_heap_util_pct > 85.0)
      now_iso = datetime.now(timezone.utc).isoformat()

      print(f"OpenSearch Complete: Cluster={cluster_name}, WriteRejections={write_rejections}, Queue={write_queue_size}, Heap={jvm_heap_util_pct}%, Alert={is_breached}")

      Kestra.outputs({
          "write_threadpool_rejections_count": write_rejections,
          "write_threadpool_queue_size": write_queue_size,
          "jvm_heap_utilization_pct": jvm_heap_util_pct,
          "indexing_backpressure_events_count": indexing_backpressure_events,
          "is_alerting": is_breached,
          "cluster_target": cluster_name,
          "audit_timestamp": now_iso
      })

  - id: evaluate_opensearch_threshold
    type: io.kestra.plugin.core.flow.If
    description: Verifies whether OpenSearch write threadpool rejections or JVM memory pressure exceed operational tolerance bounds.
    condition: "{{ outputs.scan_opensearch_cluster_metrics.vars.is_alerting and inputs.alert_on_opensearch_failures }}"
    then:
      - id: notify_slack_search_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches high-urgency incident notification to Search SRE Slack channel detailing OpenSearch indexing backpressure.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#search-opensearch-sre",
            "username": "OpenSearch Sentinel",
            "icon_emoji": ":lock:",
            "text": "CRITICAL: OpenSearch write threadpool rejections or indexing backpressure detected on cluster `{{ inputs.cluster_name }}`. Write Rejections: `{{ outputs.scan_opensearch_cluster_metrics.vars.write_threadpool_rejections_count }}` (threshold: `{{ inputs.max_write_rejections_threshold }}`). Queue Size: `{{ outputs.scan_opensearch_cluster_metrics.vars.write_threadpool_queue_size }}`. JVM Heap: `{{ outputs.scan_opensearch_cluster_metrics.vars.jvm_heap_utilization_pct }}%`. Ingestion pipelines (Logstash, Fluentbit, Vector) are encountering HTTP 429 Too Many Requests."
          }
    else:
      - id: log_nominal_opensearch_state
        type: io.kestra.plugin.core.log.Log
        description: Records nominal telemetry when OpenSearch analytical cluster ingests bulk documents without threadpool rejections.
        message: "OpenSearch cluster {{ inputs.cluster_name }} nominal. Write queue: {{ outputs.scan_opensearch_cluster_metrics.vars.write_threadpool_queue_size }}. Write rejections: {{ outputs.scan_opensearch_cluster_metrics.vars.write_threadpool_rejections_count }} is below threshold {{ inputs.max_write_rejections_threshold }}."

  - id: emit_audit_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Emits structured audit manifest for search platform governance compliance records and indexing SLA archives.
    format: |
      {
        "status": "{{ outputs.scan_opensearch_cluster_metrics.vars.is_alerting ? 'ALERT' : 'NOMINAL' }}",
        "cluster_name": "{{ inputs.cluster_name }}",
        "write_rejections": {{ outputs.scan_opensearch_cluster_metrics.vars.write_threadpool_rejections_count }},
        "write_queue_size": {{ outputs.scan_opensearch_cluster_metrics.vars.write_threadpool_queue_size }},
        "jvm_heap_pct": {{ outputs.scan_opensearch_cluster_metrics.vars.jvm_heap_utilization_pct }},
        "audit_timestamp": "{{ outputs.scan_opensearch_cluster_metrics.vars.audit_timestamp }}"
      }

triggers:
  - id: periodic_opensearch_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"


extend:
  title: "OpenSearch Indexing Backpressure and Threadpool Rejection Sentinel"
  metaTitle: "OpenSearch Indexing Backpressure and Threadpool Rejection Sentinel"
  shortDescription: "Audits OpenSearch cluster telemetry to detect write threadpool rejections, indexing backpressure events, and JVM memory pressure."
  metaDescription: "Audits OpenSearch cluster metrics to detect write threadpool rejections, indexing backpressure, and JVM heap pressure before bulk writes fail."
  description: |
    Audits OpenSearch distributed search and analytics clusters across enterprise logging environments to detect write threadpool rejections, indexing backpressure stalls, and memory exhaustion.

    ## How it works
    1. A schedule trigger executes the OpenSearch cluster audit workflow every 15 minutes.
    2. The Python task queries the OpenSearch Prometheus exporter or node stats endpoint (`opensearch-cluster:9200/_prometheus/metrics`).
    3. The script extracts write threadpool rejection totals, bulk queue depths, JVM heap memory utilization, and indexing pressure events.
    4. An evaluation gate determines whether write rejections, queue backlogs, or memory usage breach operational tolerance bounds.
    5. When thresholds are breached, a high-priority Slack alert is dispatched to search platform engineering and logging SREs.
    6. When bulk indexing executes smoothly without rejected tasks, nominal telemetry is logged.
    7. A structured JSON audit manifest is emitted for search platform governance compliance logs and indexing SLA archives.

    ## Architecture diagram
    ```mermaid
    graph TD
        Trigger[Schedule Trigger: 15m] --> ScanMetrics[Python Script: Scrape OpenSearch Metrics]
        ScanMetrics --> EvalBreach{Write Rejections >= Threshold OR Queue > 50?}
        EvalBreach -- Yes --> SlackAlert[Slack: High-Urgency Search Alert]
        EvalBreach -- No --> LogNominal[Log: Nominal OpenSearch State]
        SlackAlert --> EmitManifest[Debug Return: OpenSearch Audit Manifest]
        LogNominal --> EmitManifest
    ```

    ## Architecture components
    - **Trigger**: Automated schedule polling at 15-minute intervals.
    - **Script Task**: Scrapes OpenSearch Prometheus metrics endpoints using Docker container isolation.
    - **Decision Gate**: Evaluates whether write rejections or indexing backpressure exceeds stability safety limits.
    - **Notification Task**: Dispatches structured Slack alerts with cluster identity and rejection metrics.
    - **Audit Manifest**: Emits JSON execution payloads containing search engine health and timestamps.

    ## Key capabilities
    - Continuous surveillance of OpenSearch bulk indexing queues and write threadpool executor saturation.
    - Rapid detection of shard unbalance and hot node bottlenecks causing `EsRejectedExecutionException`.
    - Early warning before upstream ingestion shippers (Fluentbit, Logstash, Vector) drop documents due to 429 errors.
    - Zero external dependency execution via isolated containerized Python runners.

    ## What you get
    - Preemptive alerting on search cluster ingestion degradation before log and event data is lost.
    - Automated tracking of JVM heap utilization against the critical 85% circuit breaker threshold.
    - Real-time audit manifests capturing search platform health for SOC 2 data analytics compliance.
    - Configurable tolerance thresholds adaptable to high-throughput log indexing and latency-sensitive search clusters.

    ## Who it's for
    - Search Platform Engineers and SREs maintaining OpenSearch and Elasticsearch clusters.
    - Observability team leads safeguarding central security logging and APM trace storage.
    - Cloud infrastructure administrators provisioning persistent disk IOPS and JVM memory limits.
    - DevOps engineers troubleshooting sporadic 429 Too Many Requests errors during batch reindexing.

    ## Why orchestrate this with Kestra
    - **Deterministic Scheduling**: Guarantees regular search platform audits without fragile local crontab scripts.
    - **Containerized Runners**: Runs Python tasks inside isolated Docker containers without host library dependencies.
    - **Condition Branching**: Flowable `If` tasks route alerts and nominal logging cleanly without spaghetti code.
    - **Enterprise Secret Safety**: Securely injects Slack webhook credentials without plain-text exposure.

    ## Use cases
    - **Spike in Application Logging**: Detects write queue saturation when production microservices enter verbose debug loops.
    - **Hot Shard Imbalance**: Alerts when uneven routing keys overload a single data node while others sit idle.
    - **JVM Stop-the-World GC Pause**: Identifies long old-gen garbage collection pauses freezing node write threads.
    - **Segment Merge Disk Throttling**: Surfaces indexing slowdowns caused by underlying cloud block storage IOPS depletion.

    ## Inputs
    | Name | Type | Default | Description |
    |---|---|---|---|
    | `opensearch_metrics_url` | STRING | `http://opensearch-cluster.search.svc.cluster.local:9200` | Base HTTP URL exposing OpenSearch Prometheus metrics. |
    | `cluster_name` | STRING | `opensearch-log-search-prod` | Target OpenSearch analytical cluster identifier under surveillance. |
    | `max_write_rejections_threshold` | INT | `10` | Maximum allowable rejected write tasks before alerting. |
    | `lookback_minutes` | INT | `15` | Lookback evaluation window in minutes for failure rates. |
    | `alert_on_opensearch_failures` | BOOL | `true` | Toggle Slack alert dispatch upon detecting threadpool rejections. |

    ## Expected outputs
    - `{{ outputs.scan_opensearch_cluster_metrics.vars.write_threadpool_rejections_count }}`: Count of write tasks rejected by threadpool.
    - `{{ outputs.scan_opensearch_cluster_metrics.vars.write_threadpool_queue_size }}`: Current depth of write queue awaiting executor slots.
    - `{{ outputs.scan_opensearch_cluster_metrics.vars.jvm_heap_utilization_pct }}`: Percentage of allocated JVM heap memory in use.
    - `{{ outputs.scan_opensearch_cluster_metrics.vars.indexing_backpressure_events_count }}`: Count of indexing backpressure triggers.
    - `{{ outputs.scan_opensearch_cluster_metrics.vars.is_alerting }}`: Boolean flag indicating whether failure thresholds were breached.
    - `{{ outputs.emit_audit_manifest.value }}`: Structured JSON audit manifest emitted for compliance archives.

    ## Prerequisites
    - OpenSearch cluster deployed with Prometheus exporter plugin or metrics endpoint enabled.
    - Metrics port 9200 reachable from the Kestra worker execution environment.
    - Docker daemon running on the Kestra host to execute containerized Python tasks.

    ### Secrets
    - `SLACK_WEBHOOK_URL`: Incoming webhook URL for the target Search SRE Slack alerting channel.

    ## Quick start
    1. Ensure OpenSearch cluster exposes Prometheus metrics via `prometheus-exporter` plugin.
    2. Configure the `SLACK_WEBHOOK_URL` secret in your Kestra namespace settings.
    3. Specify your OpenSearch cluster name in `cluster_name`.
    4. Execute a manual test run via the Kestra UI to verify metric ingestion.
    5. Enable the `periodic_opensearch_audit` trigger to establish automated continuous surveillance.

    ## Common pitfalls and troubleshooting
    - **Bulk Size Sizing**: Oversized bulk requests (>15MB) overwhelm worker threads; batch requests into 5-10MB chunks.
    - **Heap Maximum Cap**: Never set OpenSearch JVM heap above 31GB to preserve Compressed Object Pointers (Compressed OOPs).
    - **Refresh Interval Tuning**: Default 1s refresh interval creates excessive small segments; increase to 30s for heavy logs.
    - **Security Plugin TLS**: When internal admin certificates are required, pass client certs in the scraper task.

    ## How to extend
    - **Automated Shard Rebalance**: Trigger a cluster reroute sub-flow to redistribute shards away from overloaded data nodes.
    - **Dynamic Index Refresh Interval**: Chain a task to increase `index.refresh_interval` to 60s during ingestion surges.
    - **PagerDuty Escalation**: Escalate to on-call search engineers if write rejections exceed 50 per minute.

    ## Links
    - [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
    - [OpenSearch Official Documentation and Architecture Guide](https://opensearch.org/docs/latest/)
    - [OpenSearch Thread Pool Metrics and Queue Tuning Manual](https://opensearch.org/docs/latest/opensearch/thread-pools/)
    - [Troubleshooting OpenSearch Indexing Backpressure and 429 Errors](https://opensearch.org/docs/latest/monitoring-plugins/pa/troubleshooting-indexing-pressure/)
