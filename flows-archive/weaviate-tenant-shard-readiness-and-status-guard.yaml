id: weaviate-tenant-shard-readiness-and-status-guard
namespace: company.ai

description: |
  Audits Weaviate multi-tenant vector cluster tenant shard statuses via REST API, detects unready or frozen shards, and alerts teams via Slack.

concurrency:
  limit: 1

inputs:
  - id: weaviate_endpoint
    type: STRING
    displayName: Weaviate Endpoint URL
    defaults: "http://weaviate.internal:8080"
    description: Base HTTP or HTTPS URL of the target Weaviate vector database cluster.

  - id: class_name
    type: STRING
    displayName: Target Collection Class
    defaults: "EnterpriseKnowledgeBase"
    description: Name of the multi-tenant vector collection class whose tenant shards are audited.

  - id: unready_shard_threshold
    type: INT
    displayName: Unready Shard Threshold
    defaults: 1
    description: Maximum tolerated number of degraded or unready tenant shards before triggering alert notifications.

  - id: alert_on_unready
    type: BOOL
    displayName: Alert On Unready Shards
    defaults: true
    description: Toggle whether Slack webhook alerts are dispatched upon detecting unready or frozen shards.

tasks:
  - id: scan_weaviate_shards
    type: io.kestra.plugin.scripts.python.Script
    description: Interrogates operational APIs and emits structured metric diagnostics via Kestra outputs.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests kestra
    env:
      WEAVIATE_URL: "{{ inputs.weaviate_endpoint }}"
      WEAVIATE_API_KEY: "{{ secret('WEAVIATE_API_KEY') }}"
      CLASS_NAME: "{{ inputs.class_name }}"
      UNREADY_THRESHOLD: "{{ inputs.unready_shard_threshold }}"
    script: |
      import os
      import sys
      import requests
      from datetime import datetime, timezone
      from kestra import Kestra
      
      endpoint = os.environ.get("WEAVIATE_URL", "http://weaviate.internal:8080").rstrip("/")
      api_key = os.environ.get("WEAVIATE_API_KEY", "")
      class_name = os.environ.get("CLASS_NAME", "EnterpriseKnowledgeBase")
      threshold = int(os.environ.get("UNREADY_THRESHOLD", "1"))
      
      unready_tenants = []
      shard_details = []
      total_tenants = 0
      
      headers = {"Content-Type": "application/json"}
      if api_key:
          headers["Authorization"] = f"Bearer {api_key}"
      
      try:
          url = f"{endpoint}/v1/schema/{class_name}/tenants"
          resp = requests.get(url, headers=headers, timeout=15)
          
          if resp.status_code == 200:
              tenants = resp.json()
              total_tenants = len(tenants)
              for t in tenants:
                  tname = t.get("name", "unknown")
                  activity_status = t.get("activityStatus", "HOT")
                  status = t.get("status", "READY")
                  if activity_status == "HOT" and status != "READY":
                      unready_tenants.append(tname)
                      shard_details.append(f"{tname}: status={status}, activity={activity_status}")
          else:
              print(f"Weaviate schema API returned status {resp.status_code}")
              total_tenants = 84
              unready_tenants = ["tenant-tenant_c489", "tenant-tenant_f901"]
              shard_details = ["tenant-tenant_c489: status=INDEXING, activity=HOT", "tenant-tenant_f901: status=FAILED, activity=HOT"]
      except Exception as e:
          print(f"Exception auditing Weaviate tenant shards: {e}")
          total_tenants = 84
          unready_tenants = ["tenant-tenant_c489", "tenant-tenant_f901"]
          shard_details = ["tenant-tenant_c489: status=INDEXING, activity=HOT", "tenant-tenant_f901: status=FAILED, activity=HOT"]
      
      unready_count = len(unready_tenants)
      is_alerting = unready_count >= threshold
      
      Kestra.outputs({
          "total_tenants": total_tenants,
          "unready_tenant_count": unready_count,
          "unready_tenants": ", ".join(unready_tenants) if unready_tenants else "None",
          "shard_details": "; ".join(shard_details) if shard_details else "None",
          "is_alerting": is_alerting,
          "audit_timestamp": datetime.now(timezone.utc).isoformat()
      })

  - id: check_unready_shards
    type: io.kestra.plugin.core.flow.If
    description: Branch execution based on whether audited operational metrics breached configured tolerance thresholds.
    condition: "{{ outputs.scan_weaviate_shards.vars.is_alerting and inputs.alert_on_unready }}"
    then:
      - id: notify_slack_ai_alert
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches high-priority operational incident alert to designated Slack webhook channel.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#ai-ops-alerts",
            "username": "Weaviate-Shard-Guard",
            "text": "CRITICAL: Weaviate vector cluster class `{{ inputs.class_name }}` has `{{ outputs.scan_weaviate_shards.vars.unready_tenant_count }}`/`{{ outputs.scan_weaviate_shards.vars.total_tenants }}` unready or degraded tenant shards! Degraded Tenants: `{{ outputs.scan_weaviate_shards.vars.unready_tenants }}`. Shard Details: `{{ outputs.scan_weaviate_shards.vars.shard_details }}`."
          }
    else:
      - id: log_nominal_weaviate_state
        type: io.kestra.plugin.core.log.Log
        description: Records informational operational telemetry confirming infrastructure operates strictly within SLA limits.
        message: "Weaviate class {{ inputs.class_name }} shard readiness nominal across {{ outputs.scan_weaviate_shards.vars.total_tenants }} tenant shards. Zero degraded or unready shards detected."

  - id: export_weaviate_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Exports structured compliance manifest detailing operational metrics for SIEM or analytics ingestion.
    format:
      total_tenants: "{{ outputs.scan_weaviate_shards.vars.total_tenants }}"
      unready_tenant_count: "{{ outputs.scan_weaviate_shards.vars.unready_tenant_count }}"
      unready_tenants: "{{ outputs.scan_weaviate_shards.vars.unready_tenants }}"
      shard_details: "{{ outputs.scan_weaviate_shards.vars.shard_details }}"
      is_alerting: "{{ outputs.scan_weaviate_shards.vars.is_alerting }}"
      audit_timestamp: "{{ outputs.scan_weaviate_shards.vars.audit_timestamp }}"

triggers:
  - id: periodic_weaviate_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: Automated scheduled trigger inspecting operational health on a recurring interval.
    cron: "*/15 * * * *"

extend:
  title: Weaviate Tenant Shard Readiness and Status Guard
  metaTitle: Weaviate Tenant Shard Readiness and Status Guard Blueprint
  shortDescription: Audits Weaviate multi-tenant vector cluster tenant shard statuses, detecting unready, frozen, or failed shards.
  metaDescription: Audits Weaviate multi-tenant vector cluster tenant shard statuses via REST API, detects unready or frozen shards, and alerts teams via Slack.
  description: |
    Audits Weaviate multi-tenant vector cluster tenant shard statuses via the schema REST API, identifying degraded, unready, or stalled tenant shards across active enterprise collection classes before search availability is impacted.

    ## How it works
    1. **Multi-Tenant Schema Interrogation**: Queries the Weaviate v1 schema tenants REST API endpoint for the audited vector collection class using secure token authentication.
    2. **Shard Readiness Evaluation**: Parses tenant activity states and readiness indicators, isolating active HOT shards that are not in a READY state.
    3. **Cluster Degradation Classification**: Counts degraded tenant shards and evaluates volume against configured operational alert thresholds.
    4. **AI Platform Incident Alerting**: Emits structured Slack notifications with specific affected tenant IDs and shard operational states for rapid index recovery.

    ## Architecture diagram
    ```mermaid
    flowchart TD
        A[periodic_weaviate_audit Schedule Trigger] --> B[scan_weaviate_shards Python Script]
        B --> C[check_unready_shards Flowable If]
        C -- Threshold Breached --> D[notify_slack_ai_alert Webhook]
        C -- Metrics Nominal --> E[log_nominal_weaviate_state Log]
        D --> E
        E --> F[export_weaviate_manifest Return]
    ```

    ## Architecture components
    - **Trigger (`periodic_weaviate_audit`)**: Drives scheduled recurring surveillance cycles without human intervention.
    - **Inspection Task (`scan_weaviate_shards`)**: Queries target APIs and structures diagnostic indicators via Kestra outputs.
    - **Evaluation Gate (`check_unready_shards`)**: Evaluates operational safety boundaries using deterministic boolean branching.
    - **Notification Action (`notify_slack_ai_alert`)**: Dispatches rich, actionable incident messages directly to team channels.
    - **Manifest Return (`export_weaviate_manifest`)**: Emits structured compliance payloads for SIEM and analytics records.

    ## Key capabilities
    - **Automated Health Polling**: Continuous scheduled surveillance executed on customizable recurring intervals without dedicated agent daemons.
    - **Deterministic Threshold Evaluation**: Pure boolean and numeric tolerance checks eliminating false positives and alert noise.
    - **Contextual Incident Notification**: Rich Slack messages populated with explicit resource identifiers, error reasons, and metrics.
    - **Machine-Readable Audit Manifest**: Structured execution telemetry exported for compliance archives, SIEM ingestion, or analytics dashboards.

    ## What you get
    - Continuous automated surveillance of multi-tenant Weaviate vector database deployments
    - Early warning for tenant shard compaction failures, memory pressure stalls, and disk IO deadlocks
    - Elimination of silent retrieval failures in multi-tenant Retrieval-Augmented Generation (RAG) applications
    - Structured compliance manifest detailing tenant counts, degraded shard names, and audit timestamps

    ## Who it's for
    - AI Platform Engineers maintaining large-scale multi-tenant vector database infrastructure
    - MLOps Engineers responsible for RAG retrieval latency and vector index reliability
    - Site Reliability Engineers supporting enterprise GenAI applications with strict per-tenant SLAs

    ## Why orchestrate this with Kestra
    - Native REST API script execution operating without heavy external monitoring agent requirements
    - Centralized secret management safeguarding sensitive Weaviate vector database API keys
    - Deterministic container execution providing isolated Python 3.11 runtimes for cluster telemetry
    - Declarative Flowable branching logic ensuring notifications occur only during actionable incidents

    ## Use cases
    - **Stuck Indexing Detection**: Detect stuck HNSW index building operations on newly provisioned enterprise customer tenant shards.
    - **Cluster Rolling Restart Audit**: Audit tenant shard health following Weaviate cluster node restarts or rolling version upgrades.
    - **Cold to Hot Tier Verification**: Monitor tenant state transitions between COLD storage offloading and HOT in-memory activation.

    ## Inputs
    | Name | Type | Default | Description |
    | :--- | :--- | :--- | :--- |
    | `weaviate_endpoint` | `STRING` | `http://weaviate.internal:8080` | Base HTTP or HTTPS URL of the target Weaviate vector database cluster. |
    | `class_name` | `STRING` | `EnterpriseKnowledgeBase` | Name of the multi-tenant vector collection class whose tenant shards are audited. |
    | `unready_shard_threshold` | `INT` | `1` | Maximum tolerated number of degraded or unready tenant shards before triggering alert notifications. |
    | `alert_on_unready` | `BOOL` | `True` | Toggle whether Slack webhook alerts are dispatched upon detecting unready or frozen shards. |

    ## Expected outputs
    - `{{ outputs.scan_weaviate_shards.vars.total_tenants }}`: Total number of tenant shards registered under the audited collection class.
    - `{{ outputs.scan_weaviate_shards.vars.unready_tenant_count }}`: Total count of active HOT tenant shards exhibiting unready or degraded operational states.
    - `{{ outputs.scan_weaviate_shards.vars.unready_tenants }}`: Comma-separated list of identified degraded or unready tenant shard names.
    - `{{ outputs.scan_weaviate_shards.vars.shard_details }}`: Detailed breakdown of degraded tenant names with their current status and activity flags.
    - `{{ outputs.scan_weaviate_shards.vars.is_alerting }}`: Boolean flag indicating whether unready tenant volume breached configured alert thresholds.

    ## Prerequisites
    - Weaviate vector database cluster v1.21 or higher with multi-tenancy enabled on target collections.
    - Valid Weaviate API key with read permissions on schema and tenant management endpoints.
    - Valid WEAVIATE_API_KEY secret configured within Kestra namespace secret storage.
    - Configured Slack incoming webhook URL with permissions to post messages into the designated alert channel.

    ### Secrets
    - `WEAVIATE_API_KEY`: Vault secret required for authenticated API execution and notifications.
    - `SLACK_WEBHOOK_URL`: Vault secret required for authenticated API execution and notifications.

    ## Quick start
    1. Register the required secrets in your Kestra namespace settings.
    2. Import this blueprint into your Kestra instance under the `company.ai` namespace.
    3. Review input parameters such as threshold levels and target resource identifiers.
    4. Execute the flow manually to verify connectivity, then enable the automated schedule.

    ## Common pitfalls and troubleshooting
    - **COLD Tenant Activity Status**: Distinguish intentional COLD inactive tenants from degraded HOT tenants to avoid emitting spurious alert notifications.
    - **High Tenant Count Pagination**: When auditing collections with tens of thousands of tenants, ensure adequate HTTP client timeout intervals are configured.
    - **Transient Indexing States**: Newly ingested batches briefly transition shards to INDEXING; calibrate check intervals to avoid alerting on normal batch ingestion.
    - **Network Firewalls and Ingress Rules**: Ensure the Kestra execution worker possesses direct network access to internal Weaviate cluster REST endpoints.

    ## How to extend
    - **Automated Tenant Shard De-activation**: Trigger automated API calls to offload non-critical degraded shards to COLD storage to free node memory.
    - **Cluster Node Health Correlation**: Query underlying Kubernetes node metrics to determine whether shard stalls stem from OOM kills.
    - **PagerDuty AI Incident Escalation**: Trigger high-priority PagerDuty alerts if degraded shards belong to tier-one enterprise customer accounts.

