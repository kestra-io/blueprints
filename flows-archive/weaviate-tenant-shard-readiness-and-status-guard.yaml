    - [Weaviate Multi-Tenancy Architecture Guide](https://weaviate.io/developers/weaviate/manage-data/multi-tenancy)
    - [Weaviate REST API Reference](https://weaviate.io/developers/weaviate/api/rest)
    - [Weaviate Vector Index Troubleshooting](https://weaviate.io/developers/weaviate/concepts/vector-index)
