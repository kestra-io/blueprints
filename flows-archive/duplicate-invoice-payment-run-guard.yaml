id: duplicate-invoice-payment-run-guard
namespace: company.team

inputs:
  - id: payment_run_date
    type: DATE
    displayName: Payment run date
    defaults: 2026-10-07

  - id: window_days
    type: INT
    displayName: Look-back window (days)
    description: Invoices paid in this window are compared with the new batch too, because the most expensive duplicate is one that was already paid last week.
    defaults: 90

  - id: name_similarity
    type: FLOAT
    displayName: Vendor name similarity
    description: Jaro-Winkler similarity above which two vendor names are treated as the same vendor, for example "Acme Supplies Ltd" and "ACME Supplies Limited".
    defaults: 0.9

  - id: require_approval
    type: BOOL
    displayName: Require approval for held invoices
    description: Pause the run so finance can release or keep the held invoices. Leave false to hold them automatically.
    defaults: false

variables:
  run_dir: "payments/{{ inputs.payment_run_date }}"

tasks:
  - id: screen
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: >
      Compare every invoice in the new batch with the other new invoices and with invoices
      paid in the look-back window. A pair is a suspected duplicate on the same normalized
      invoice number for the same vendor, or the same amount for a similar vendor name within
      14 days. Suspects are held. The rest form the payment file.
    outputFiles:
      - payable
      - held
    fetchType: FETCH
    sql: |
      -- Demo data. Replace with ATTACH to your ERP or a read_csv of the AP export.
      CREATE TABLE paid AS SELECT * FROM (VALUES
        ('P-1001', 'V-17', 'Acme Supplies Ltd',        'INV-00412',  4180.00, DATE '2026-09-12'),
        ('P-1002', 'V-22', 'Northwind Logistics',      'NW/2026/88', 12650.50, DATE '2026-09-20'),
        ('P-1003', 'V-31', 'Blue Harbor Consulting',   'BH-7781',     2400.00, DATE '2026-09-28')
      ) t(payment_id, vendor_id, vendor_name, invoice_no, amount, invoice_date);

      CREATE TABLE batch AS SELECT * FROM (VALUES
        ('B-01', 'V-17', 'Acme Supplies Ltd',         'INV-00431',   990.00, DATE '2026-10-01'),
        ('B-02', 'V-40', 'ACME Supplies Limited',     'INV 412',     4180.00, DATE '2026-09-12'),
        ('B-03', 'V-22', 'Northwind Logistics',       'NW-2026-88', 12650.50, DATE '2026-09-20'),
        ('B-04', 'V-55', 'Greenfield Office Supply',  'GF-1102',      310.75, DATE '2026-10-02'),
        ('B-05', 'V-55', 'Greenfield Office Supply',  'GF-1102',      310.75, DATE '2026-10-02'),
        ('B-06', 'V-31', 'Blue Harbor Consulting',    'BH-7790',     2400.00, DATE '2026-10-03'),
        ('B-07', 'V-60', 'Orbit Cloud Services',      'OC-55102',    8800.00, DATE '2026-10-04'),
        ('B-08', 'V-61', 'Pinecrest Facilities',      'PF-2210',     1525.00, DATE '2026-10-04')
      ) t(batch_id, vendor_id, vendor_name, invoice_no, amount, invoice_date);

      -- Normalize what people retype differently: case, punctuation, legal suffixes, letter prefixes, leading zeros.
      CREATE MACRO norm_vendor(n) AS trim(regexp_replace(regexp_replace(lower(n), '[^a-z0-9 ]', ' ', 'g'), '\b(ltd|limited|inc|llc|gmbh|co|corp)\b', '', 'g'));
      CREATE MACRO norm_invoice(i) AS ltrim(regexp_replace(regexp_replace(upper(i), '[^A-Z0-9]', '', 'g'), '^[A-Z]+', ''), '0');

      CREATE TABLE candidates AS
      SELECT batch_id AS id, 'NEW' AS origin, vendor_id, vendor_name, invoice_no, amount, invoice_date FROM batch
      UNION ALL
      SELECT payment_id, 'PAID', vendor_id, vendor_name, invoice_no, amount, invoice_date FROM paid
      WHERE invoice_date >= DATE '{{ inputs.payment_run_date }}' - {{ inputs.window_days }};

      CREATE TABLE matches AS
      SELECT b.batch_id, c.id AS matches_id, c.origin,
             CASE
               WHEN norm_invoice(b.invoice_no) = norm_invoice(c.invoice_no)
                    AND (b.vendor_id = c.vendor_id OR jaro_winkler_similarity(norm_vendor(b.vendor_name), norm_vendor(c.vendor_name)) >= {{ inputs.name_similarity }})
                 THEN 'same invoice number'
               ELSE 'same amount, similar vendor, ' || abs(b.invoice_date - c.invoice_date) || ' days apart'
             END AS reason,
             round(jaro_winkler_similarity(norm_vendor(b.vendor_name), norm_vendor(c.vendor_name)), 3) AS name_sim
      FROM batch b
      JOIN candidates c ON c.id <> b.batch_id
      WHERE (
              norm_invoice(b.invoice_no) = norm_invoice(c.invoice_no)
              AND (b.vendor_id = c.vendor_id OR jaro_winkler_similarity(norm_vendor(b.vendor_name), norm_vendor(c.vendor_name)) >= {{ inputs.name_similarity }})
            )
         OR (
              b.amount = c.amount
              AND jaro_winkler_similarity(norm_vendor(b.vendor_name), norm_vendor(c.vendor_name)) >= {{ inputs.name_similarity }}
              AND abs(b.invoice_date - c.invoice_date) <= 14
            );

      -- Within the batch, keep the first of each duplicate pair payable and hold the later one.
      CREATE TABLE held AS
      SELECT b.*, string_agg(m.reason || ' as ' || m.matches_id || ' (' || lower(m.origin) || ')', '; ') AS why
      FROM batch b JOIN matches m USING (batch_id)
      WHERE m.origin = 'PAID' OR m.matches_id < b.batch_id
      GROUP BY ALL;
      CREATE TABLE payable AS SELECT * FROM batch WHERE batch_id NOT IN (SELECT batch_id FROM held);

      COPY payable TO '{{ outputFiles.payable }}' (HEADER, DELIMITER ',');
      COPY held TO '{{ outputFiles.held }}' (HEADER, DELIMITER ',');

      SELECT (SELECT count(*) FROM batch) AS invoices,
             (SELECT count(*) FROM payable) AS payable_count,
             (SELECT round(sum(amount), 2) FROM payable) AS payable_amount,
             (SELECT count(*) FROM held) AS held_count,
             (SELECT coalesce(round(sum(amount), 2), 0) FROM held) AS held_amount,
             (SELECT coalesce(string_agg(batch_id || ' ' || vendor_name || ' ' || invoice_no || ' ' || amount || ': ' || why, ' | '), '') FROM held) AS held_detail;

  - id: totals
    type: io.kestra.plugin.core.output.OutputValues
    values:
      row: "{{ (outputs.screen.outputs | last).rows | first | toJson }}"

  - id: log_screen
    type: io.kestra.plugin.core.log.Log
    message: >-
      Payment run {{ inputs.payment_run_date }}: {{ outputs.totals.values.row | jq('.invoices') | first }} invoices,
      {{ outputs.totals.values.row | jq('.payable_count') | first }} payable ({{ outputs.totals.values.row | jq('.payable_amount') | first }}),
      {{ outputs.totals.values.row | jq('.held_count') | first }} held ({{ outputs.totals.values.row | jq('.held_amount') | first }}).
      Held: {{ outputs.totals.values.row | jq('.held_detail') | first }}

  - id: review
    type: io.kestra.plugin.core.flow.If
    description: Optional human review of the held invoices before the payment file is released.
    condition: "{{ inputs.require_approval and (outputs.totals.values.row | jq('.held_count') | first) > 0 }}"
    then:
      - id: finance_review
        type: io.kestra.plugin.core.flow.Pause
        description: Finance checks the held invoices and resumes the run. Released invoices are listed by id, the others stay held.
        onResume:
          - id: release_ids
            type: STRING
            description: Comma-separated batch ids to release despite the warning, for example B-06. Leave empty to keep all held.
            defaults: ""

  - id: apply_review
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: Move the invoices finance released back into the payment file. With no review, nothing moves.
    inputFiles:
      payable.csv: "{{ outputs.screen.outputFiles.payable }}"
      held.csv: "{{ outputs.screen.outputFiles.held }}"
    outputFiles:
      - final_payable
      - final_held
    fetchType: FETCH_ONE
    sql: |
      CREATE TABLE released AS SELECT trim(unnest(string_split('{{ outputs.finance_review.onResume.release_ids ?? '' }}', ','))) AS batch_id;
      CREATE TABLE held AS SELECT * FROM read_csv('held.csv', all_varchar = true);
      CREATE TABLE payable AS
        SELECT batch_id, vendor_id, vendor_name, invoice_no, amount, invoice_date FROM read_csv('payable.csv', all_varchar = true)
        UNION ALL
        SELECT batch_id, vendor_id, vendor_name, invoice_no, amount, invoice_date FROM held WHERE batch_id IN (SELECT batch_id FROM released);
      COPY payable TO '{{ outputFiles.final_payable }}' (HEADER, DELIMITER ',');
      COPY (SELECT * FROM held WHERE batch_id NOT IN (SELECT batch_id FROM released)) TO '{{ outputFiles.final_held }}' (HEADER, DELIMITER ',');
      SELECT (SELECT count(*) FROM payable) AS payable_count,
             (SELECT count(*) FROM held WHERE batch_id NOT IN (SELECT batch_id FROM released)) AS held_count,
             (SELECT count(*) FROM held WHERE batch_id IN (SELECT batch_id FROM released)) AS released_count;

  - id: publish_payment_files
    type: io.kestra.plugin.core.namespace.UploadFiles
    description: The payment file for the bank upload, and the held list for the AP team.
    namespace: "{{ flow.namespace }}"
    filesMap:
      "{{ render(vars.run_dir) }}/payable.csv": "{{ outputs.apply_review.outputFiles.final_payable }}"
      "{{ render(vars.run_dir) }}/held.csv": "{{ outputs.apply_review.outputFiles.final_held }}"

  - id: record_run
    type: io.kestra.plugin.core.kv.Set
    key: "payment_run_{{ inputs.payment_run_date | replace({'-': '_'}) }}"
    kvType: JSON
    value: |
      {"payable": {{ (outputs.apply_review.outputs | last).row.payable_count }}, "held": {{ (outputs.apply_review.outputs | last).row.held_count }},
       "released": {{ (outputs.apply_review.outputs | last).row.released_count }},
       "held_amount_before_review": {{ outputs.totals.values.row | jq('.held_amount') | first }},
       "released_ids": "{{ outputs.finance_review.onResume.release_ids ?? '' }}", "execution_id": "{{ execution.id }}"}

triggers:
  - id: before_payment_run
    type: io.kestra.plugin.core.trigger.Schedule
    description: Tuesday and Friday mornings, before the payment file goes to the bank.
    cron: "0 7 * * 2,5"

extend:
  title: Stop duplicate invoices before the payment run goes to the bank
  metaTitle: Duplicate invoice check before a payment run with Kestra and DuckDB
  shortDescription: Compare each invoice in a payment batch with the batch and with recently paid invoices, hold likely duplicates, let finance release them, then publish the payment file.
  metaDescription: Catch duplicate invoices before a payment run in Kestra. Fuzzy vendor and invoice matching in DuckDB, hold suspects, optional finance approval.
  description: |
    Duplicate payments rarely come from the same invoice entered twice with the same values. They come from `INV-00412` and `INV 412`, from `Acme Supplies Ltd` created again as vendor `ACME Supplies Limited`, from an invoice paid last week and resubmitted with a new number. This flow screens a payment batch before it leaves:
    - **Same invoice number** after normalization (case, punctuation, letter prefix, leading zeros), for the same vendor id or a vendor name with Jaro-Winkler similarity of at least `name_similarity`.
    - **Same amount** for a similar vendor name, within 14 days.

    Each new invoice is compared with the rest of the batch and with invoices paid in the last `window_days`. Suspects are held with the reason and the invoice they match. With `require_approval`, the run pauses so finance can release some of them.

    It runs with no setup and no network. The demo batch has 8 invoices against 3 recent payments.


    ## How it works

    1. `screen` (`io.kestra.plugin.jdbc.duckdb.Queries`) normalizes vendor names and invoice numbers with macros, matches every batch invoice against the batch and the paid window, and splits the batch into `payable` and `held`. Within the batch the first invoice of a duplicate pair stays payable.
    2. `totals` and `log_screen` report counts, amounts and every held invoice with its reason.
    3. `review` (`io.kestra.plugin.core.flow.If`) pauses with `io.kestra.plugin.core.flow.Pause` when `require_approval` is on and something is held. Finance resumes with `release_ids`.
    4. `apply_review` (`io.kestra.plugin.jdbc.duckdb.Queries`) moves the released invoices into the payment file.
    5. `publish_payment_files` (`io.kestra.plugin.core.namespace.UploadFiles`) writes `payments/<date>/payable.csv` and `held.csv`. `record_run` (`io.kestra.plugin.core.kv.Set`) stores the totals and what was released.
    6. `before_payment_run` (`io.kestra.plugin.core.trigger.Schedule`), Tuesday and Friday mornings.

    ## Quick start

    | Run | Input | Result |
    |---|---|---|
    | 1 | defaults | 4 payable (11,625.75), 4 held (19,541.25): B-05 same number as B-04 in the batch, B-02 `INV 412` from `ACME Supplies Limited` = paid `INV-00412` from `Acme Supplies Ltd`, B-03 `NW-2026-88` = paid `NW/2026/88`, B-06 same amount as a Blue Harbor invoice paid 5 days earlier |
    | 2 | `require_approval: true`, resumed with `release_ids: B-06` | Paused, then 5 payable and 3 held. KV records `released_ids: B-06` |
    | 3 | `window_days: 10` | 2 held. The older payments fall outside the window |

    Resume a paused run from the execution page in the UI, or with `POST /api/v1/main/executions/<id>/actions/resume` and the `release_ids` form field.

    ## Inputs

    - `payment_run_date` (DATE), `window_days` (INT, default `90`), `name_similarity` (FLOAT, default `0.9`), `require_approval` (BOOL, default `false`).

    ## Using it with your ERP

    - Replace the two `VALUES` tables with `ATTACH` to the ERP database, or `read_csv` on the AP export and the payment history.
    - Send `payable.csv` to the bank only from this flow, so nothing skips the screen.

    ## Expected outputs

    - `outputs.totals.values.row`: `invoices`, `payable_count`, `payable_amount`, `held_count`, `held_amount`, `held_detail`.
    - Namespace files `payments/<date>/payable.csv` and `payments/<date>/held.csv`.
    - KV `payment_run_<date>`.

    ## Links

    - DuckDB text similarity functions: https://duckdb.org/docs/sql/functions/char#text-similarity-functions
    - Pause task: https://kestra.io/plugins/core/tasks/flow/io.kestra.plugin.core.flow.pause
    - DuckDB plugin: https://kestra.io/plugins/plugin-jdbc-duckdb

    This blueprint was created by [zkasuran](https://github.com/zkasuran).
  tags:
    - Business
    - Data
  subTags:
    - Testing & Quality
    - Policy & Compliance
  ee: false
  demo: false
