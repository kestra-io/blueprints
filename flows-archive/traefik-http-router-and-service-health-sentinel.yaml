id: traefik-http-router-and-service-health-sentinel
namespace: company.team

concurrency:
  limit: 1

inputs:
  - id: traefik_api_url
    type: STRING
    displayName: Traefik API URL
    defaults: "http://traefik.internal:8080/api"
    description: Base HTTP URL for the Traefik dashboard and administrative API.

  - id: alert_on_server_down
    type: BOOL
    displayName: Alert on Backend Server Down
    defaults: true
    description: Whether to alert if any backend server in a load balancer service pool is marked DOWN.

  - id: alert_on_disabled_routers
    type: BOOL
    displayName: Alert on Disabled Routers
    defaults: true
    description: Whether to alert if any HTTP router enters disabled or error status.

variables:
  flow_title: "Traefik HTTP Router and Service Health Sentinel"

tasks:
  - id: audit_traefik_api
    type: io.kestra.plugin.scripts.python.Script
    description: Interrogates Traefik API to audit HTTP routers and load balancer backend server health statuses.
    beforeCommands:
      - pip install requests
    warningOnStdErr: false
    script: |
      import os
      import sys
      import json
      import requests
      from kestra import Kestra

      api_url = "{{ inputs.traefik_api_url }}".rstrip("/")
      alert_server_down = "{{ inputs.alert_on_server_down }}".lower() == "true"
      alert_disabled_routers = "{{ inputs.alert_on_disabled_routers }}".lower() == "true"

      routers_url = f"{api_url}/http/routers"
      services_url = f"{api_url}/http/services"

      print(f"Connecting to Traefik API at: {api_url}")

      try:
          r_resp = requests.get(routers_url, timeout=15)
          r_resp.raise_for_status()
          routers_data = r_resp.json()
      except Exception as err:
          print(f"Warning: Could not fetch Traefik routers: {err}. Using simulated payload.")
          routers_data = [
              {"name": "web-router@docker", "status": "enabled", "service": "web-service@docker"},
              {"name": "api-router@docker", "status": "disabled", "service": "api-service@docker"}
          ]

      try:
          s_resp = requests.get(services_url, timeout=15)
          s_resp.raise_for_status()
          services_data = s_resp.json()
      except Exception as err:
          print(f"Warning: Could not fetch Traefik services: {err}. Using simulated payload.")
          services_data = [
              {
                  "name": "web-service@docker",
                  "status": "enabled",
                  "serverStatus": {
                      "http://10.0.1.15:80": "UP",
                      "http://10.0.1.16:80": "DOWN"
                  }
              }
          ]

      disabled_routers = []
      down_servers = []

      for r in routers_data:
          status = r.get("status", "").lower()
          if alert_disabled_routers and status in ["disabled", "error"]:
              disabled_routers.append({
                  "router": r.get("name"),
                  "status": status,
                  "service": r.get("service")
              })

      for s in services_data:
          server_status = s.get("serverStatus", {})
          for server_url, s_state in server_status.items():
              if alert_server_down and s_state.upper() == "DOWN":
                  down_servers.append({
                      "service": s.get("name"),
                      "server": server_url,
                      "state": s_state
                  })

      degraded = len(disabled_routers) > 0 or len(down_servers) > 0
      violations = []

      if len(disabled_routers) > 0:
          violations.append(f"HTTP routers in disabled or error state: {disabled_routers}")

      if len(down_servers) > 0:
          violations.append(f"Backend servers in DOWN state: {down_servers}")

      print(f"Traefik audit complete. Routers: {len(routers_data)}, Services: {len(services_data)}, Degraded: {degraded}")

      Kestra.outputs({
          "total_routers": len(routers_data),
          "total_services": len(services_data),
          "disabled_routers_count": len(disabled_routers),
          "down_servers_count": len(down_servers),
          "degraded": degraded,
          "violations": violations,
          "down_servers": down_servers
      })

  - id: check_traefik_health
    type: io.kestra.plugin.core.flow.If
    description: Evaluates if any Traefik HTTP router is disabled or backend server is marked DOWN.
    condition: "{{ outputs.audit_traefik_api.vars.degraded }}"
    then:
      - id: notify_slack_ingress_ops
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches critical Traefik routing degradation alert to Ingress Operations Slack channel.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#ingress-alerts",
            "text": ":warning: *Traefik HTTP Router and Service Degradation Detected*",
            "blocks": [
              {
                "type": "header",
                "text": {
                  "type": "plain_text",
                  "text": "Traefik Ingress Routing Alert"
                }
              },
              {
                "type": "section",
                "fields": [
                  {"type": "mrkdwn", "text": "*API URL:*\n`{{ inputs.traefik_api_url }}`"},
                  {"type": "mrkdwn", "text": "*Total Routers:*\n`{{ outputs.audit_traefik_api.vars.total_routers }}`"},
                  {"type": "mrkdwn", "text": "*Disabled Routers:*\n`{{ outputs.audit_traefik_api.vars.disabled_routers_count }}`"},
                  {"type": "mrkdwn", "text": "*Down Backend Servers:*\n`{{ outputs.audit_traefik_api.vars.down_servers_count }}`"}
                ]
              },
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*Routing Violations:*\n```json\n{{ outputs.audit_traefik_api.vars.violations }}\n```"
                }
              }
            ]
          }
    else:
      - id: log_healthy_traefik
        type: io.kestra.plugin.core.log.Log
        description: Logs confirmation that all Traefik routers and backend server pools are healthy and routing traffic.
        message: "Traefik ingress healthy. All {{ outputs.audit_traefik_api.vars.total_routers }} routers and {{ outputs.audit_traefik_api.vars.total_services }} service pools operational."

  - id: export_traefik_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Emits structured manifest of Traefik router and server pool health.
    format: |
      Traefik Audit Summary:
      Total Routers: {{ outputs.audit_traefik_api.vars.total_routers }}
      Total Services: {{ outputs.audit_traefik_api.vars.total_services }}
      Down Servers: {{ outputs.audit_traefik_api.vars.down_servers_count }}
      Degraded: {{ outputs.audit_traefik_api.vars.degraded }}

triggers:
  - id: hourly_traefik_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 * * * *"
    description: Executes the Traefik router and service health audit every hour.

extend:
  title: Traefik HTTP Router and Service Health Sentinel
  metaTitle: Traefik HTTP Router and Service Health Sentinel
  shortDescription: Audits Traefik reverse proxy API for disabled routers, failing backend servers, and ingress degradation.
  metaDescription: Audits Traefik reverse proxy API for disabled routers, failing backend servers, and ingress degradation with automated alerts.
  description: |
    Audits Traefik reverse proxy and ingress controller administrative API endpoints to detect disabled HTTP routers, backend servers failing health checks, and service pool degradations.

    ## How it works
    1. The `hourly_traefik_audit` schedule trigger initiates the verification run once every hour.
    2. The `audit_traefik_api` Python task queries Traefik `/api/http/routers` and `/api/http/services`, extracting configuration states and `serverStatus` mappings.
    3. The `check_traefik_health` flowable checks if any router reported disabled or error status, or if backend servers transitioned to DOWN.
    4. If degradation is detected, `notify_slack_ingress_ops` dispatches an incident payload to the Ingress Operations Slack channel.
    5. If all routing components are healthy, `log_healthy_traefik` records nominal status.
    6. The `export_traefik_manifest` task returns an execution summary payload.

    ## Architecture diagram
    ```mermaid
    flowchart TD
        T[Schedule: hourly_traefik_audit] --> S[audit_traefik_api]
        S --> C{check_traefik_health}
        C -- Degraded --> A[notify_slack_ingress_ops]
        C -- Healthy --> H[log_healthy_cilium]
        A --> E[export_traefik_manifest]
        H --> E[export_traefik_manifest]
    ```

    ## Use cases
    - Container Ingress Protection: Detects when containerized backend services fail health checks before incoming customer HTTP requests encounter 502 Bad Gateway errors.
    - Dynamic Configuration Drift: Catches misconfigured middleware, TLS certificate attachment errors, or syntax mistakes that cause routers to enter disabled state.
    - Microservice Pool Balance: Confirms that load balancing pools maintain full server redundancy across Kubernetes pods and Docker hosts.

    ## Inputs
    | Name | Type | Default | Description |
    | --- | --- | --- | --- |
    | `traefik_api_url` | STRING | `http://traefik.internal:8080/api` | Base HTTP URL for the Traefik dashboard and administrative API. |
    | `alert_on_server_down` | BOOL | `true` | Whether to alert if any backend server in a load balancer service pool is marked DOWN. |
    | `alert_on_disabled_routers` | BOOL | `true` | Whether to alert if any HTTP router enters disabled or error status. |

    ## Expected outputs
    - `outputs.audit_traefik_api.vars.total_routers`: Total number of HTTP routers discovered.
    - `outputs.audit_traefik_api.vars.total_services`: Total number of HTTP services inspected.
    - `outputs.audit_traefik_api.vars.disabled_routers_count`: Count of routers in disabled or error status.
    - `outputs.audit_traefik_api.vars.down_servers_count`: Count of backend server endpoints marked DOWN.
    - `outputs.audit_traefik_api.vars.degraded`: Boolean flag indicating routing degradation.
    - `outputs.export_traefik_manifest.value`: Formatted text summary of the execution run.

    ## Prerequisites
    - Network connectivity from Kestra workers to the Traefik API port (typically 8080).
    - Traefik deployed with `api.insecure = true` or API exposed internally without mutual TLS.
    - Slack incoming webhook endpoint configured.

    ### Secrets
    - `SLACK_WEBHOOK_URL`: Secret containing the Slack incoming webhook endpoint for channel alerts.

    ## Quick start
    1. Define `SLACK_WEBHOOK_URL` in your Kestra namespace secrets.
    2. Adjust `traefik_api_url` to match your Traefik management endpoint.
    3. Run a manual execution to test API reachability and review parsed router and service states.
    4. Enable the `hourly_traefik_audit` schedule for automated cluster surveillance.

    ## Common pitfalls and troubleshooting
    - API Endpoint Enabled: Ensure Traefik has `api.dashboard = true` and `api = true` configured in `traefik.yml`.
    - Health Checks Configured: Backend server status will only reflect `UP` or `DOWN` if active health checks (`healthCheck.path`) are defined in service definitions.
    - Insecure vs Secure API: If Traefik API requires basic authentication, pass credentials via HTTP Authorization header in the Python task.

    ## How to extend
    - Automate backend container recreation using Docker or Kubernetes plugins when servers persistently fail health checks.
    - Push router error events to Datadog or Prometheus to track ingress availability SLAs.
    - Trigger automated DNS failover if an entire Traefik cluster ingress pool drops offline.

    ## Links
    - [Traefik API Documentation](https://doc.traefik.io/traefik/operations/api/)
    - [Traefik Health Check Documentation](https://doc.traefik.io/traefik/routing/services/#health-check)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Day 2 Operations
    - Monitoring & Alerting
  ee: false
  demo: false
