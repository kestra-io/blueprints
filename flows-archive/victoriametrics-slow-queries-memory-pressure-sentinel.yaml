id: victoriametrics-slow-queries-memory-pressure-sentinel
namespace: company.observability

inputs:
  - id: vm_metrics_url
    type: STRING
    defaults: "http://victoriametrics.observability:8428/metrics"
    description: Prometheus metrics endpoint for VictoriaMetrics instance or vmselect service.
  - id: slow_queries_threshold
    type: INT
    defaults: 5
    description: "Maximum allowable slow queries in sampling interval (default 5)."

tasks:
  - id: query_vm_metrics
    type: io.kestra.plugin.scripts.shell.Commands
    commands:
      - |
        curl -s -f "{{ inputs.vm_metrics_url }}" > /tmp/vm_metrics.txt
        
        # Scrape vm_slow_queries_total counter
        SLOW_QUERIES=$(grep -E "^vm_slow_queries_total" /tmp/vm_metrics.txt | awk '{sum+=$2} END {print sum+0}')
        echo "::set-output name=slow_queries::$SLOW_QUERIES::"

  - id: evaluate_slow_queries
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.query_vm_metrics.vars.slow_queries | int > inputs.slow_queries_threshold }}"
    then:
      - id: notify_platform_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#observability-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 VictoriaMetrics Slow Queries Spike Alert",
                "text": "VictoriaMetrics at `{{ inputs.vm_metrics_url }}` recorded *{{ outputs.query_vm_metrics.vars.slow_queries }} slow query executions*! Heavy PromQL queries or high series churn are degrading time-series engine throughput.",
                "footer": "Kestra Observability Sentinel • VictoriaMetrics"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#observability-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ VictoriaMetrics Sentinel Failure",
            "text": "Failed to scrape VictoriaMetrics endpoint. Verify service address and network health.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  metaDescription: "Monitors VictoriaMetrics for slow query spikes and memory pressure to prevent database crashes and dashboard timeouts."
  metaTitle: VictoriaMetrics Slow Query Execution and Resource Saturation Sentinel with Kestra
  title: VictoriaMetrics Slow Query Execution and Resource Saturation Sentinel
  shortDescription: Monitors VictoriaMetrics for slow query spikes and memory pressure to prevent database crashes and dashboard timeouts.
  description: |
    ## How it works
    This workflow scrapes the internal `/metrics` endpoint of VictoriaMetrics (single-node or `vmselect` cluster component) to audit `vm_slow_queries_total`. VictoriaMetrics classifies queries as slow when execution time exceeds `-search.logSlowQueryDuration`. Unoptimized PromQL queries requesting long historical windows with high cardinality labels exhaust CPU cores and cache memory, risking out-of-memory (OOM) termination. This workflow continuously evaluates slow query counts and dispatches alerts before system degradation affects alerting and dashboarding.

    ## What you get
    - Real-time notification of degraded PromQL query performance in VictoriaMetrics.
    - Prevents Grafana dashboard timeouts and Prometheus alerting evaluation delays.
    - Actionable visibility into time-series database load and capacity bottlenecks.

    ## Who it's for
    - Observability and Platform Engineers managing VictoriaMetrics TSDB infrastructure.
    - DevOps Teams operating large-scale Prometheus long-term storage clusters.

    ## Why orchestrate this with Kestra
    - **Reliable Automation**: Executes periodic scrapes without manual interventions.
    - **Proactive Incident Prevention**: Early detection of bad query patterns before node OOM crashes.
    - **Standardized Notification**: Integrates directly with Slack for rapid triage.

    ## Prerequisites
    - VictoriaMetrics service with `/metrics` endpoint reachable.
    - Secret `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import the blueprint.
    2. Provide your VictoriaMetrics metrics URL.
    3. Run the workflow to inspect current slow query counters.

    ## How to extend
    - Query `/api/v1/status/top_queries` to identify the specific expensive PromQL expressions causing latency.
    - Apply automatic query memory limits dynamically via VictoriaMetrics configuration flags.

    ## Links
    - [VictoriaMetrics Monitoring and Troubleshooting](https://docs.victoriametrics.com/troubleshooting/)
    - [Kestra Documentation](https://kestra.io/docs)
  tags:
    - Infrastructure
    - Data
  subTags:
    - Day 2 Operations
    - ELT & Data Landing
  ee: false
  demo: false
