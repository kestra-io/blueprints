id: elasticsearch-snapshot-repository-verification-sentinel
namespace: company.data

inputs:
  - id: es_host
    type: STRING
    defaults: "elasticsearch.internal"
    description: Elasticsearch cluster hostname or IP address.
  - id: es_port
    type: INT
    defaults: 9200
    description: Elasticsearch HTTP port.
  - id: es_user
    type: STRING
    defaults: "elastic"
    description: Elasticsearch username.
  - id: repository_name
    type: STRING
    defaults: "daily_backups"
    description: Elasticsearch snapshot repository name to verify.

tasks:
  - id: verify_snapshot_repository
    type: io.kestra.plugin.scripts.shell.Commands
    containerImage: ghcr.io/kestra-io/tools:latest
    commands:
      - |
        HTTP_CODE=$(curl -s -o /tmp/es_repo_verify.json -w "%{http_code}" -X POST \
          -u "{{ inputs.es_user }}:{{ secret('ES_PASSWORD') }}" \
          "http://{{ inputs.es_host }}:{{ inputs.es_port }}/_snapshot/{{ inputs.repository_name }}/_verify")
        
        cat /tmp/es_repo_verify.json
        
        NODES_COUNT=$(jq '.nodes | length // 0' /tmp/es_repo_verify.json 2>/dev/null || echo 0)
        
        echo "::set-output name=http_code::$HTTP_CODE::"
        echo "::set-output name=verified_nodes::$NODES_COUNT::"

  - id: evaluate_repository_health
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.verify_snapshot_repository.vars.http_code | int != 200 or outputs.verify_snapshot_repository.vars.verified_nodes | int == 0 }}"
    then:
      - id: notify_backup_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#elasticsearch-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 Elasticsearch Snapshot Repository Verification Failed",
                "text": "Elasticsearch repository `{{ inputs.repository_name }}` verification failed on `{{ inputs.es_host }}` (HTTP Status: *{{ outputs.verify_snapshot_repository.vars.http_code }}*, Verified Nodes: *{{ outputs.verify_snapshot_repository.vars.verified_nodes }}*). Impact: S3/GCS blob storage authentication or write permissions have lapsed, rendering scheduled backups impossible.",
                "footer": "Kestra Disaster Recovery Sentinel • Elasticsearch"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#elasticsearch-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ Elasticsearch Snapshot Repository Verification and Health Sentinel Pipeline Failure",
            "text": "Failed to connect to Elasticsearch to verify snapshot repository. Verify cluster availability.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  metaDescription: "Audits Elasticsearch snapshot repository connectivity and permissions to prevent backup failures."
  metaTitle: Elasticsearch Snapshot Repository Verification and Health Sentinel with Kestra
  title: Elasticsearch Snapshot Repository Verification and Health Sentinel
  shortDescription: Audits Elasticsearch snapshot repository connectivity and permissions to prevent backup failures.
  description: |
    ## How it works
    This workflow issues a `POST /_snapshot/<repository>/_verify` call to the Elasticsearch cluster. Elasticsearch executes verification across all master and data nodes by writing and reading small test blobs in the underlying cloud storage (S3, GCS, Azure Blob, or NFS). If any node encounters IAM permission expiration, bucket policy drift, or network timeouts, verification fails and triggers a Slack alert.

    ## What you get
    - Proactive verification of backup repository integrity before scheduled snapshot windows.
    - Prevents silent backup failures that compromise disaster recovery readiness.
    - Detailed validation of node connectivity across the entire cluster.

    ## Who it's for
    - SREs and Infrastructure Engineers responsible for enterprise disaster recovery and backup compliance.
    - Database Administrators operating cloud-native Elasticsearch clusters.

    ## Why orchestrate this with Kestra
    - **Continuous DR Assurance**: Schedule hourly or daily repository verification.
    - **Cross-Node Validation**: Ensures all nodes can access shared cloud storage without manual spot-checks.
    - **Actionable Alerting**: Direct notifications prevent recovery gaps.

    ## Prerequisites
    - Elasticsearch snapshot repository configured (e.g. S3 plugin repository).
    - Secrets `ES_PASSWORD` and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import the blueprint.
    2. Provide `repository_name` and cluster coordinates.
    3. Run the workflow to verify repository health.

    ## How to extend
    - Chain directly into an automated `POST /_snapshot/<repository>/<snapshot>` backup workflow.
    - Verify multiple repositories in parallel using EachParallel.

    ## Links
    - [Elasticsearch Verify Snapshot Repository API](https://www.elastic.co/guide/en/elasticsearch/reference/current/snapshots-verify-repo.html)
    - [Kestra Shell Plugin](https://kestra.io/plugins/plugin-scripts/commands/io.kestra.plugin.scripts.shell.commands)
  tags:
    - Data
    - Infrastructure
  subTags:
    - ELT & Data Landing
    - Day 2 Operations
  ee: false
  demo: false
