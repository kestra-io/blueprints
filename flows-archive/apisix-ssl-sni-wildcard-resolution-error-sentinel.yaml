    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
    - [Apache APISIX Official Documentation](https://apisix.apache.org/)
    - [Apache APISIX Dynamic SSL and SNI Configuration Guide](https://apisix.apache.org/docs/apisix/terminology/ssl/)
    - [Apache APISIX Prometheus Plugin and Observability Reference](https://apisix.apache.org/docs/apisix/plugins/prometheus/)
