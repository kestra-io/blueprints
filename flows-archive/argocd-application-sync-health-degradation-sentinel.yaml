id: argocd-application-sync-health-degradation-sentinel
namespace: company.gitops

inputs:
  - id: argocd_server_url
    type: STRING
    defaults: "https://argocd.internal"
    description: Base URL of the Argo CD server API.
  - id: target_project
    type: STRING
    defaults: "default"
    description: Argo CD project to audit.

tasks:
  - id: inspect_argocd_apps
    type: io.kestra.plugin.scripts.shell.Commands
    commands:
      - |
        # Query Argo CD REST API for applications list
        curl -s -k -H "Authorization: Bearer {{ secret('ARGOCD_AUTH_TOKEN') }}" \
          "{{ inputs.argocd_server_url }}/api/v1/applications?project={{ inputs.target_project }}" > /tmp/argocd_apps.json

        python3 -c "
        import json
        try:
            with open('/tmp/argocd_apps.json') as f:
                data = json.load(f)
            items = data.get('items', [])
            degraded_apps = []
            outofsync_apps = []
            for app in items:
                name = app.get('metadata', {}).get('name', 'unknown')
                sync_status = app.get('status', {}).get('sync', {}).get('status', 'Unknown')
                health_status = app.get('status', {}).get('health', {}).get('status', 'Unknown')
                if health_status in ['Degraded', 'Missing']:
                    degraded_apps.append(f'{name}({health_status})')
                if sync_status == 'OutOfSync':
                    outofsync_apps.append(name)
            is_breach = 1 if (degraded_apps or outofsync_apps) else 0
            print(f'{is_breach}|{len(degraded_apps)}|{\", \".join(degraded_apps[:5])}|{len(outofsync_apps)}')
        except Exception:
            print('0|0||0')
        " > /tmp/argocd_summary.txt

        IS_BREACH=$(cut -d '|' -f 1 /tmp/argocd_summary.txt)
        DEGRADED_COUNT=$(cut -d '|' -f 2 /tmp/argocd_summary.txt)
        DEGRADED_SAMPLES=$(cut -d '|' -f 3 /tmp/argocd_summary.txt)
        OUTOFSYNC_COUNT=$(cut -d '|' -f 4 /tmp/argocd_summary.txt)
        
        echo "::set-output name=is_breach::${IS_BREACH:-0}::"
        echo "::set-output name=degraded_count::${DEGRADED_COUNT:-0}::"
        echo "::set-output name=degraded_samples::$DEGRADED_SAMPLES::"
        echo "::set-output name=outofsync_count::${OUTOFSYNC_COUNT:-0}::"

  - id: evaluate_gitops_health
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.inspect_argocd_apps.vars.is_breach | int == 1 }}"
    then:
      - id: notify_gitops_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#gitops-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 Argo CD Application Health & Sync Alert",
                "text": "Detected GitOps synchronization or health degradation in project {{ inputs.target_project }}. Degraded: {{ outputs.inspect_argocd_apps.vars.degraded_count }}, OutOfSync: {{ outputs.inspect_argocd_apps.vars.outofsync_count }}.",
                "footer": "Kestra GitOps Sentinel • Argo CD"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#gitops-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ Argo CD Sentinel Failure",
            "text": "Failed to communicate with Argo CD server at {{ inputs.argocd_server_url }}.",
            "footer": "Kestra Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  metaDescription: "Audits Argo CD applications for out-of-sync states and degraded resource health across GitOps clusters."
  metaTitle: Argo CD Application GitOps Sync and Health Degradation Sentinel with Kestra
  ee: false
  demo: false
  title: Argo CD Application GitOps Sync and Health Degradation Sentinel
  shortDescription: Audits Argo CD applications for out-of-sync states and degraded resource health across GitOps clusters.
  description: |
    ## How it works
    This workflow connects to the Argo CD API server (`/api/v1/applications`) with an administrative bearer token to audit applications belonging to a specific GitOps project. It inspects both the `sync.status` (e.g., `Synced`, `OutOfSync`) and `health.status` (e.g., `Healthy`, `Degraded`, `Missing`). When pull requests introduce broken Kubernetes specs, image tags fail to pull, or deployments fail readiness probes, applications drop out of healthy state. This sentinel flags degraded applications and alerts the platform engineering team.

    ## What you get
    - Real-time GitOps deployment synchronization monitoring.
    - Instant visibility into degraded Kubernetes workloads across clusters.
    - Automated Slack incident notifications listing affected application names.

    ## Who it's for
    - Platform Engineers and DevOps teams managing fleet-wide GitOps delivery.
    - Site Reliability Engineers ensuring continuous application availability.
    - Kubernetes cluster administrators maintaining multi-tenant clusters.

    ## Why orchestrate this with Kestra
    - **Multi-Cluster Supervision**: Audits distributed Argo CD instances across staging and production.
    - **Automated Rollback & Remediation**: Triggers automated Git revert flows or re-sync requests upon failure.
    - **Security & Secret Compliance**: Stores Argo CD API tokens safely inside Kestra's encrypted secret engine.

    ## Prerequisites
    - Running Argo CD instance with accessible REST API.
    - Service account token configured in `ARGOCD_AUTH_TOKEN` secret.
    - Slack incoming webhook configured in `SLACK_WEBHOOK` secret.

    ## Quick start
    1. Import this blueprint into your Kestra instance.
    2. Add `ARGOCD_AUTH_TOKEN` and `SLACK_WEBHOOK` secrets.
    3. Configure `argocd_server_url` and target `target_project`.
    4. Enable the schedule trigger for continuous GitOps health auditing.

    ## How to extend
    - Trigger an automated hard-refresh or re-sync via `POST /api/v1/applications/{name}/sync`.
    - Filter for specific application labels or destination clusters.
    - Integrate with GitHub to post status comments on corresponding deployment PRs.

    ## Links
    - [Argo CD REST API](https://argo-cd.readthedocs.io/en/stable/developer-guide/api-docs/)
    - [Kestra Shell Plugin](https://kestra.io/plugins/plugin-scripts-shell)
    - [Kestra Slack Notifications](https://kestra.io/plugins/plugin-slack)
  tags:
    - Data
    - Infrastructure
  subTags:
    - ELT & Data Landing
    - Day 2 Operations
