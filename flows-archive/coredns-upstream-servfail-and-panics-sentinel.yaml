    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
    - [CoreDNS Official Documentation and Manual](https://coredns.io/manual/toc/)
    - [Kubernetes CoreDNS Service Discovery and Configuration Guide](https://kubernetes.io/docs/tasks/administer-cluster/dns-custom-nameservers/)
    - [CoreDNS Prometheus Metrics Reference and Plugins](https://coredns.io/plugins/metrics/)
