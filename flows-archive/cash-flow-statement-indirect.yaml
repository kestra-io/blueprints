id: cash-flow-statement-indirect
namespace: company.team

description: |
  Build the statement of cash flows with the indirect method from two trial balances and the
  fixed asset and lease registers: profit, non-cash adjustments, working capital, investing
  and financing, interest and tax reclassified by policy, the effect of exchange rates on
  cash, and a proof that the statement explains the change in cash to the cent.

inputs:
  - id: period_end
    type: STRING
    displayName: Period end
    description: The statement covers the year to date, from the previous year end.
    defaults: "2026-09-30"
    validator: ^\d{4}-\d{2}-\d{2}$

  - id: interest_paid_in
    type: SELECT
    displayName: Interest paid presented in
    description: IAS 7.33 lets an entity choose. US GAAP requires operating.
    values:
      - FINANCING
      - OPERATING
    defaults: FINANCING

  - id: scenario
    type: SELECT
    displayName: Demo scenario
    description: >
      ISSUES adds a landlord deposit booked to an account the mapping does not know, and a
      fixed asset register whose additions disagree with the ledger. The statement must not
      be published.
    values:
      - CLEAN
      - ISSUES
    defaults: CLEAN

variables:
  pack_dir: "cash-flow/{{ inputs.period_end }}"

tasks:
  - id: build
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: >
      One DuckDB session: opening and closing trial balances (the demo derives the closing one
      from the year's journals), the account mapping, the registers, every statement line,
      the reconciliations and the proof.
    outputFiles:
      - statement
      - mapping
      - checks
    fetchType: FETCH_ONE
    sql: |
      -- =======================================================================
      -- Chart of accounts and how each account reaches the statement. Every
      -- balance sheet account must have a role. Replace with your mapping.
      -- =======================================================================
      CREATE TABLE accounts (account VARCHAR, name VARCHAR, kind VARCHAR, role VARCHAR);
      INSERT INTO accounts VALUES
        ('1000', 'Cash at bank (EUR)', 'BS', 'CASH'), ('1010', 'Cash at bank (USD)', 'BS', 'CASH'),
        ('1100', 'Trade receivables', 'BS', 'WC_RECEIVABLES'), ('1110', 'Allowance for doubtful debts', 'BS', 'WC_RECEIVABLES'),
        ('1200', 'Inventory', 'BS', 'WC_INVENTORY'), ('1210', 'Inventory provision', 'BS', 'WC_INVENTORY'),
        ('1300', 'Prepayments', 'BS', 'WC_PREPAYMENTS'),
        ('1500', 'Property, plant and equipment, cost', 'BS', 'PPE'), ('1510', 'PPE accumulated depreciation', 'BS', 'PPE'),
        ('1550', 'Intangible assets', 'BS', 'INTANGIBLES'), ('1600', 'Right-of-use assets', 'BS', 'ROU'),
        ('2000', 'Trade payables', 'BS', 'WC_PAYABLES'), ('2100', 'Accruals', 'BS', 'WC_ACCRUALS'),
        ('2150', 'Interest accrued', 'BS', 'INTEREST_ACCRUED'), ('2200', 'Income tax payable', 'BS', 'TAX_PAYABLE'),
        ('2300', 'Dividends payable', 'BS', 'DIVIDENDS_PAYABLE'), ('2500', 'Borrowings', 'BS', 'BORROWINGS'),
        ('2600', 'Lease liabilities', 'BS', 'LEASES'), ('3000', 'Share capital', 'BS', 'SHARE_CAPITAL'),
        ('3100', 'Share-based payment reserve', 'BS', 'SBP_RESERVE'), ('3200', 'Retained earnings', 'BS', 'RETAINED_EARNINGS'),
        ('4000', 'Revenue', 'PL', 'PROFIT'), ('5000', 'Cost of sales', 'PL', 'PROFIT'), ('6000', 'Operating expenses', 'PL', 'PROFIT'),
        ('6050', 'Share-based payment expense', 'PL', 'PROFIT'), ('6100', 'Bad debt expense', 'PL', 'PROFIT'),
        ('6800', 'Depreciation of PPE', 'PL', 'DEPRECIATION'), ('6810', 'Depreciation of right-of-use assets', 'PL', 'ROU_DEPRECIATION'),
        ('6820', 'Amortisation of intangibles', 'PL', 'AMORTISATION'), ('7000', 'Gain on disposal of PPE', 'PL', 'DISPOSAL_GAIN'),
        ('7100', 'Interest on borrowings', 'PL', 'INTEREST_EXPENSE'), ('7110', 'Interest on lease liabilities', 'PL', 'INTEREST_EXPENSE'),
        ('7200', 'Interest income', 'PL', 'INTEREST_INCOME'), ('7300', 'Foreign exchange gain on cash', 'PL', 'FX_ON_CASH'),
        ('8000', 'Income tax expense', 'PL', 'TAX_EXPENSE');

      -- =======================================================================
      -- Opening balances at the previous year end, and the year's journals,
      -- summarised. Replace both with your opening and closing trial balances.
      -- =======================================================================
      CREATE TABLE opening (account VARCHAR, balance DECIMAL(16, 2));
      INSERT INTO opening VALUES
        ('1000', 5800000), ('1010', 400000), ('1100', 7800000), ('1110', -250000), ('1200', 5600000), ('1210', -180000),
        ('1300', 300000), ('1500', 18000000), ('1510', -7500000), ('1550', 2100000), ('1600', 3900000),
        ('2000', -4300000), ('2100', -1200000), ('2150', -90000), ('2200', -650000), ('2300', 0), ('2500', -12000000),
        ('2600', -4100000), ('3000', -5000000), ('3100', -400000);
      INSERT INTO opening SELECT '3200', -sum(balance) FROM opening;

      CREATE TABLE journals (entry INT, description VARCHAR, account VARCHAR, amount DECIMAL(16, 2));
      INSERT INTO journals VALUES
        (1, 'Sales on credit', '1100', 48000000), (1, 'Sales on credit', '4000', -48000000),
        (2, 'Cash collected', '1000', 46500000), (2, 'Cash collected', '1100', -46500000),
        (3, 'Bad debt provision', '6100', 200000), (3, 'Bad debt provision', '1110', -200000),
        (4, 'Inventory purchased', '1200', 26000000), (4, 'Inventory purchased', '2000', -26000000),
        (5, 'Cost of goods sold', '5000', 25000000), (5, 'Cost of goods sold', '1200', -25000000),
        (6, 'Inventory write-down', '5000', 300000), (6, 'Inventory write-down', '1210', -300000),
        (7, 'Suppliers paid', '2000', 25200000), (7, 'Suppliers paid', '1000', -25200000),
        (8, 'Operating costs accrued', '6000', 9000000), (8, 'Operating costs accrued', '2100', -9000000),
        (9, 'Accruals paid', '2100', 8600000), (9, 'Accruals paid', '1000', -8600000),
        (10, 'Prepayments paid', '1300', 800000), (10, 'Prepayments paid', '1000', -800000),
        (11, 'Prepayments expensed', '6000', 600000), (11, 'Prepayments expensed', '1300', -600000),
        (12, 'Payroll', '6000', 6000000), (12, 'Payroll', '1000', -6000000),
        (13, 'Depreciation', '6800', 2100000), (13, 'Depreciation', '1510', -2100000),
        (14, 'Amortisation', '6820', 400000), (14, 'Amortisation', '1550', -400000),
        (15, 'Capital expenditure', '1500', 3400000), (15, 'Capital expenditure', '1000', -3400000),
        (16, 'Development costs capitalised', '1550', 900000), (16, 'Development costs capitalised', '1000', -900000),
        (17, 'Disposal of a line', '1000', 350000), (17, 'Disposal of a line', '1510', 700000), (17, 'Disposal of a line', '1500', -900000), (17, 'Disposal of a line', '7000', -150000),
        (18, 'New warehouse lease', '1600', 2400000), (18, 'New warehouse lease', '2600', -2400000),
        (19, 'Lease payments', '7110', 120000), (19, 'Lease payments', '2600', 780000), (19, 'Lease payments', '1000', -900000),
        (20, 'Right-of-use depreciation', '6810', 500000), (20, 'Right-of-use depreciation', '1600', -500000),
        (21, 'Revolver drawn', '1000', 4000000), (21, 'Revolver drawn', '2500', -4000000),
        (22, 'Term loan repaid', '2500', 6000000), (22, 'Term loan repaid', '1000', -6000000),
        (23, 'Interest accrued', '7100', 1100000), (23, 'Interest accrued', '2150', -1100000),
        (24, 'Interest paid', '2150', 1050000), (24, 'Interest paid', '1000', -1050000),
        (25, 'Interest received', '1000', 60000), (25, 'Interest received', '7200', -60000),
        (26, 'Income tax expense', '8000', 1400000), (26, 'Income tax expense', '2200', -1400000),
        (27, 'Income tax paid', '2200', 1600000), (27, 'Income tax paid', '1000', -1600000),
        (28, 'Dividend declared', '3200', 2000000), (28, 'Dividend declared', '2300', -2000000),
        (29, 'Dividend paid', '2300', 1500000), (29, 'Dividend paid', '1000', -1500000),
        (30, 'Shares issued', '1000', 1000000), (30, 'Shares issued', '3000', -1000000),
        (31, 'Share-based payment', '6050', 300000), (31, 'Share-based payment', '3100', -300000),
        (32, 'USD cash revalued', '1010', 80000), (32, 'USD cash revalued', '7300', -80000);
      {% if inputs.scenario == 'ISSUES' %}
      INSERT INTO journals VALUES (33, 'Deposit paid to landlord', '1790', 250000), (33, 'Deposit paid to landlord', '1000', -250000);
      {% endif %}

      -- Registers the statement needs for non-cash movements. Replace with your
      -- fixed asset and lease subledgers.
      CREATE TABLE fixed_asset_register (additions DECIMAL(16, 2), disposals_cost DECIMAL(16, 2), disposals_accumulated_depreciation DECIMAL(16, 2));
      INSERT INTO fixed_asset_register VALUES ({% if inputs.scenario == 'ISSUES' %}3150000{% else %}3400000{% endif %}, 900000, 700000);
      CREATE TABLE lease_register (new_leases DECIMAL(16, 2));
      INSERT INTO lease_register VALUES (2400000);

      -- =======================================================================
      -- Balances. P&L accounts start the year at zero.
      -- =======================================================================
      CREATE TABLE tb AS
      SELECT coalesce(o.account, j.account) AS account, coalesce(o.balance, 0) AS opening,
             coalesce(o.balance, 0) + coalesce(j.movement, 0) AS closing, coalesce(j.movement, 0) AS movement
      FROM opening o FULL JOIN (SELECT account, sum(amount) AS movement FROM journals GROUP BY account) j USING (account);
      CREATE TABLE b AS SELECT t.*, a.name, a.kind, a.role FROM tb t LEFT JOIN accounts a USING (account);

      -- Sums by role: the balance sheet movement, or the P&L amount, signed as booked.
      CREATE MACRO mv(r) AS (SELECT coalesce(sum(movement), 0) FROM b WHERE role = r);

      -- =======================================================================
      -- The statement. For a balance sheet account, the cash effect of its
      -- movement is the movement with the opposite sign.
      -- =======================================================================
      CREATE TABLE lines (section VARCHAR, ord INT, line VARCHAR, amount DECIMAL(16, 2));
      INSERT INTO lines
      WITH p AS (
        SELECT -(SELECT sum(movement) FROM b WHERE kind = 'PL') AS profit_after_tax,
               mv('TAX_EXPENSE') AS tax_expense,
               mv('INTEREST_EXPENSE') AS interest_expense, mv('INTEREST_INCOME') AS interest_income,
               (SELECT additions FROM fixed_asset_register) AS capex,
               (SELECT disposals_cost - disposals_accumulated_depreciation FROM fixed_asset_register) AS disposal_nbv,
               (SELECT new_leases FROM lease_register) AS new_leases
        FROM (SELECT 1)
      )
      SELECT * FROM (
        SELECT 'OPERATING', 10, 'Profit before tax', profit_after_tax + tax_expense FROM p
        UNION ALL SELECT 'OPERATING', 20, 'Depreciation of property, plant and equipment', mv('DEPRECIATION')
        UNION ALL SELECT 'OPERATING', 21, 'Depreciation of right-of-use assets', mv('ROU_DEPRECIATION')
        UNION ALL SELECT 'OPERATING', 22, 'Amortisation of intangible assets', mv('AMORTISATION')
        UNION ALL SELECT 'OPERATING', 23, 'Share-based payment expense', -mv('SBP_RESERVE')
        UNION ALL SELECT 'OPERATING', 24, 'Gain on disposal of property, plant and equipment', mv('DISPOSAL_GAIN')
        UNION ALL SELECT 'OPERATING', 25, 'Net finance costs', interest_expense + interest_income FROM p
        UNION ALL SELECT 'OPERATING', 26, 'Foreign exchange gain on cash', mv('FX_ON_CASH')
        UNION ALL SELECT 'OPERATING', 30, 'Change in trade receivables', -mv('WC_RECEIVABLES')
        UNION ALL SELECT 'OPERATING', 31, 'Change in inventories', -mv('WC_INVENTORY')
        UNION ALL SELECT 'OPERATING', 32, 'Change in prepayments', -mv('WC_PREPAYMENTS')
        UNION ALL SELECT 'OPERATING', 33, 'Change in trade payables', -mv('WC_PAYABLES')
        UNION ALL SELECT 'OPERATING', 34, 'Change in accruals', -mv('WC_ACCRUALS')
        UNION ALL SELECT 'OPERATING', 40, 'Income tax paid', -tax_expense - mv('TAX_PAYABLE') FROM p
        UNION ALL SELECT '{{ inputs.interest_paid_in }}', 45, 'Interest paid', -interest_expense - mv('INTEREST_ACCRUED') FROM p
        UNION ALL SELECT 'INVESTING', 50, 'Purchase of property, plant and equipment', -capex FROM p
        UNION ALL SELECT 'INVESTING', 51, 'Proceeds from disposal of property, plant and equipment', disposal_nbv - mv('DISPOSAL_GAIN') FROM p
        UNION ALL SELECT 'INVESTING', 52, 'Capitalised development costs', -(mv('INTANGIBLES') + mv('AMORTISATION'))
        UNION ALL SELECT 'INVESTING', 53, 'Interest received', -interest_income FROM p
        UNION ALL SELECT 'FINANCING', 60, 'Proceeds from issue of shares', -mv('SHARE_CAPITAL')
        -- Gross, as IAS 7.21 asks: drawings and repayments from the journal lines on the borrowing accounts.
        UNION ALL SELECT 'FINANCING', 61, 'Proceeds from borrowings', (SELECT coalesce(-sum(j.amount), 0) FROM journals j JOIN accounts a USING (account) WHERE a.role = 'BORROWINGS' AND j.amount < 0)
        UNION ALL SELECT 'FINANCING', 62, 'Repayment of borrowings', (SELECT coalesce(-sum(j.amount), 0) FROM journals j JOIN accounts a USING (account) WHERE a.role = 'BORROWINGS' AND j.amount > 0)
        UNION ALL SELECT 'FINANCING', 63, 'Principal elements of lease payments', -mv('LEASES') - new_leases FROM p
        UNION ALL SELECT 'FINANCING', 64, 'Dividends paid', -mv('RETAINED_EARNINGS') - mv('DIVIDENDS_PAYABLE')
      );

      -- =======================================================================
      -- Checks. The register-based lines must agree with the ledger movements
      -- they assume; every balance sheet account must be mapped.
      -- =======================================================================
      CREATE TABLE checks AS
      SELECT 'UNMAPPED_ACCOUNT' AS code, account AS ref, 'Account moved by ' || movement || ' and has no cash flow role. Map it' AS detail, movement AS amount
        FROM b WHERE role IS NULL AND movement <> 0
      UNION ALL
      SELECT 'PPE_DOES_NOT_RECONCILE', 'PPE', 'Ledger PPE moved ' || mv('PPE') || ', register explains ' || (capex - disposal_nbv - mv('DEPRECIATION')),
             mv('PPE') - (capex - disposal_nbv - mv('DEPRECIATION'))
        FROM (SELECT (SELECT additions FROM fixed_asset_register) AS capex,
                     (SELECT disposals_cost - disposals_accumulated_depreciation FROM fixed_asset_register) AS disposal_nbv)
        WHERE mv('PPE') <> capex - disposal_nbv - mv('DEPRECIATION')
      UNION ALL
      SELECT 'ROU_DOES_NOT_RECONCILE', 'ROU', 'Right-of-use assets moved ' || mv('ROU') || ', register explains ' || ((SELECT new_leases FROM lease_register) - mv('ROU_DEPRECIATION')),
             mv('ROU') - ((SELECT new_leases FROM lease_register) - mv('ROU_DEPRECIATION'))
        WHERE mv('ROU') <> (SELECT new_leases FROM lease_register) - mv('ROU_DEPRECIATION')
      UNION ALL
      SELECT 'TB_DOES_NOT_BALANCE', 'closing', 'Closing trial balance off by ' || sum(closing), sum(closing) FROM b HAVING sum(closing) <> 0;

      -- =======================================================================
      -- Independent proof: the direct method. Every journal entry that touches
      -- cash is classified by the accounts on the other side, so the section
      -- totals are rebuilt from the cash lines without any of the logic above.
      -- =======================================================================
      CREATE TABLE direct AS
      WITH cash_entries AS (SELECT DISTINCT entry FROM journals j JOIN accounts a USING (account) WHERE a.role = 'CASH')
      SELECT CASE
               WHEN a.role IN ('INTEREST_EXPENSE', 'INTEREST_ACCRUED') THEN '{{ inputs.interest_paid_in }}'
               WHEN a.role IN ('INTEREST_INCOME', 'PPE', 'INTANGIBLES', 'DISPOSAL_GAIN') THEN 'INVESTING'
               WHEN a.role IN ('BORROWINGS', 'LEASES', 'SHARE_CAPITAL', 'DIVIDENDS_PAYABLE', 'RETAINED_EARNINGS') THEN 'FINANCING'
               WHEN a.role = 'FX_ON_CASH' THEN 'FX'
               WHEN a.role IS NULL THEN 'UNMAPPED'
               ELSE 'OPERATING' END AS section,
             j.description, -j.amount AS amount
      FROM journals j LEFT JOIN accounts a USING (account)
      WHERE j.entry IN (SELECT entry FROM cash_entries) AND coalesce(a.role, '') <> 'CASH';

      INSERT INTO checks
      SELECT 'DIRECT_METHOD_DISAGREES', d.section, 'Direct method ' || d.amount || ', indirect method ' || coalesce(i.amount, 0), d.amount - coalesce(i.amount, 0)
      FROM (SELECT section, sum(amount) AS amount FROM direct WHERE section IN ('OPERATING', 'INVESTING', 'FINANCING') GROUP BY section) d
      LEFT JOIN (SELECT section, sum(amount) AS amount FROM lines GROUP BY section) i USING (section)
      WHERE d.amount <> coalesce(i.amount, 0);

      -- IAS 7.44A: changes in liabilities arising from financing activities.
      CREATE TABLE financing_liabilities AS
      SELECT a.role AS liability, -sum(b.opening) AS opening,
             -CASE a.role WHEN 'BORROWINGS' THEN (SELECT sum(amount) FROM lines WHERE line IN ('Proceeds from borrowings', 'Repayment of borrowings'))
                          ELSE (SELECT sum(amount) FROM lines WHERE line = 'Principal elements of lease payments') END * -1 AS cash_flows,
             CASE WHEN a.role = 'LEASES' THEN (SELECT new_leases FROM lease_register) ELSE 0 END AS new_leases,
             -sum(b.closing) AS closing
      FROM b JOIN accounts a USING (account) WHERE a.role IN ('BORROWINGS', 'LEASES') GROUP BY a.role;
      INSERT INTO checks
      SELECT 'FINANCING_LIABILITIES_DO_NOT_RECONCILE', liability, opening || ' + ' || cash_flows || ' + ' || new_leases || ' <> ' || closing, closing - opening - cash_flows - new_leases
      FROM financing_liabilities WHERE opening + coalesce(cash_flows, 0) + new_leases <> closing;

      CREATE TABLE totals AS
      SELECT (SELECT sum(amount) FROM lines WHERE section = 'OPERATING') AS operating,
             (SELECT sum(amount) FROM lines WHERE section = 'INVESTING') AS investing,
             (SELECT sum(amount) FROM lines WHERE section = 'FINANCING') AS financing,
             -mv('FX_ON_CASH') AS fx_effect,
             (SELECT sum(opening) FROM b WHERE role = 'CASH') AS opening_cash,
             (SELECT sum(closing) FROM b WHERE role = 'CASH') AS closing_cash;
      INSERT INTO checks
      SELECT 'STATEMENT_DOES_NOT_TIE', 'cash', 'Statement explains ' || (operating + investing + financing + fx_effect) || ', cash moved ' || (closing_cash - opening_cash),
             closing_cash - opening_cash - (operating + investing + financing + fx_effect)
      FROM totals WHERE operating + investing + financing + fx_effect <> closing_cash - opening_cash;

      -- =======================================================================
      -- Presentation.
      -- =======================================================================
      CREATE MACRO fmt(x) AS CASE WHEN x < 0 THEN '(' || format('{:,.0f}', -x) || ')' ELSE format('{:,.0f}', x) END;
      CREATE TABLE statement AS
      WITH s(section, title, ord) AS (VALUES ('OPERATING', 'Cash flows from operating activities', 1), ('INVESTING', 'Cash flows from investing activities', 2), ('FINANCING', 'Cash flows from financing activities', 3))
      SELECT * FROM (
        SELECT s.ord * 100 AS k, '**' || s.title || '**' AS line, '' AS amount FROM s
        UNION ALL SELECT s.ord * 100 + l.ord, l.line, fmt(l.amount) FROM lines l JOIN s USING (section) WHERE l.amount <> 0
        UNION ALL SELECT s.ord * 100 + 99, '**Net cash from ' || lower(s.section) || ' activities**', '**' || fmt((SELECT sum(amount) FROM lines l WHERE l.section = s.section)) || '**' FROM s
        UNION ALL SELECT 400, '**Net change in cash**', '**' || fmt(operating + investing + financing) || '**' FROM totals
        UNION ALL SELECT 401, 'Cash at the beginning of the year', fmt(opening_cash) FROM totals
        UNION ALL SELECT 402, 'Effect of exchange rate changes on cash', fmt(fx_effect) FROM totals
        UNION ALL SELECT 403, '**Cash at the end of the period**', '**' || fmt(opening_cash + operating + investing + financing + fx_effect) || '**' FROM totals
      ) ORDER BY k;

      COPY (SELECT line, amount FROM statement) TO '{{ outputFiles.statement }}' (HEADER, DELIMITER ',');
      COPY (SELECT account, name, kind, coalesce(role, 'UNMAPPED') AS role, opening, movement, closing FROM b ORDER BY account) TO '{{ outputFiles.mapping }}' (HEADER, DELIMITER ',');
      COPY checks TO '{{ outputFiles.checks }}' (HEADER, DELIMITER ',');

      SELECT t.operating, t.investing, t.financing, t.fx_effect, t.opening_cash, t.closing_cash,
             t.operating + t.investing + t.financing + t.fx_effect AS explained, t.closing_cash - t.opening_cash AS cash_movement,
             (SELECT amount FROM lines WHERE ord = 45) AS interest_paid,
             (SELECT amount FROM lines WHERE ord = 10) AS profit_before_tax,
             (SELECT format('{:,.0f}', new_leases) FROM lease_register) AS non_cash_new_leases,
             (SELECT string_agg(section || ' ' || amount, ', ' ORDER BY section) FROM (SELECT section, sum(amount) AS amount FROM direct GROUP BY section)) AS direct_totals,
             (SELECT count(*) FROM checks) AS issues,
             (SELECT coalesce(string_agg(code || ' ' || ref || ': ' || detail, '; ' ORDER BY code), '') FROM checks) AS issue_detail,
             '# Statement of cash flows' || chr(10) || chr(10) ||
             'Year to date to {{ inputs.period_end }}, EUR. Indirect method (IAS 7.18(b)). Interest paid in {{ inputs.interest_paid_in | lower }} activities, interest received in investing activities.' || chr(10) || chr(10) ||
             '| | EUR |' || chr(10) || '|---|---:|' || chr(10) ||
             (SELECT string_agg('| ' || line || ' | ' || amount || ' |', chr(10) ORDER BY k) FROM statement) || chr(10) || chr(10) ||
             'Non-cash transaction (IAS 7.43): right-of-use assets of EUR ' || (SELECT format('{:,.0f}', new_leases) FROM lease_register) ||
             ' acquired under new leases, not shown above.' || chr(10) || chr(10) ||
             '## Changes in liabilities arising from financing activities (IAS 7.44A)' || chr(10) || chr(10) ||
             '| | Opening | Cash flows | New leases | Closing |' || chr(10) || '|---|---:|---:|---:|---:|' || chr(10) ||
             (SELECT string_agg('| ' || CASE liability WHEN 'BORROWINGS' THEN 'Borrowings' ELSE 'Lease liabilities' END || ' | ' || fmt(opening) || ' | ' || fmt(cash_flows) || ' | ' || fmt(new_leases) || ' | ' || fmt(closing) || ' |', chr(10) ORDER BY liability)
                FROM financing_liabilities) || chr(10) || chr(10) ||
             '## Cash receipts and payments (direct method, for reference)' || chr(10) || chr(10) ||
             '| | Section | EUR |' || chr(10) || '|---|---|---:|' || chr(10) ||
             (SELECT string_agg('| ' || description || ' | ' || lower(section) || ' | ' || fmt(amount) || ' |', chr(10) ORDER BY section, description)
                FROM (SELECT description, section, sum(amount) AS amount FROM direct GROUP BY ALL)) || chr(10) AS markdown
      FROM totals t;

  - id: result
    type: io.kestra.plugin.core.output.OutputValues
    values:
      r: "{{ (outputs.build.outputs | last).row | toJson }}"

  - id: log_statement
    type: io.kestra.plugin.core.log.Log
    message: |
      Cash flow statement to {{ inputs.period_end }} ({{ inputs.scenario }}, interest paid in {{ inputs.interest_paid_in | lower }}).
      {{ outputs.result.values.r | jq('"Operating \(.operating), investing \(.investing), financing \(.financing), FX on cash \(.fx_effect). Profit before tax \(.profit_before_tax), interest paid \(.interest_paid)."') | first }}
      {{ outputs.result.values.r | jq('"Cash \(.opening_cash) -> \(.closing_cash): moved \(.cash_movement), explained \(.explained)."') | first }}
      {{ outputs.result.values.r | jq('"Direct method: \(.direct_totals). Issues: \(.issues). \(.issue_detail)"') | first }}

  - id: gate
    type: io.kestra.plugin.core.flow.If
    condition: "{{ (outputs.result.values.r | jq('.issues') | first) > 0 }}"
    then:
      - id: not_published
        type: io.kestra.plugin.core.execution.Fail
        errorMessage: "The statement is not published: {{ outputs.result.values.r | jq('.issue_detail') | first }}"

  - id: write_statement
    type: io.kestra.plugin.core.storage.Write
    extension: .md
    content: "{{ outputs.result.values.r | jq('.markdown') | first }}"

  - id: publish
    type: io.kestra.plugin.core.namespace.UploadFiles
    namespace: "{{ flow.namespace }}"
    filesMap:
      "{{ render(vars.pack_dir) }}/statement-of-cash-flows.md": "{{ outputs.write_statement.uri }}"
      "{{ render(vars.pack_dir) }}/statement.csv": "{{ outputs.build.outputFiles.statement }}"
      "{{ render(vars.pack_dir) }}/account-mapping.csv": "{{ outputs.build.outputFiles.mapping }}"
      "{{ render(vars.pack_dir) }}/checks.csv": "{{ outputs.build.outputFiles.checks }}"

  - id: log_published
    type: io.kestra.plugin.core.log.Log
    message: "Published {{ render(vars.pack_dir) }}/statement-of-cash-flows.md. The statement explains the change in cash to the cent."

extend:
  title: Build the statement of cash flows with the indirect method and prove it ties
  metaTitle: Statement of cash flows, indirect method, from the trial balance with Kestra
  shortDescription: Derive the IAS 7 cash flow statement from opening and closing balances, reconcile it to cash, cross-check it with the direct method and publish it with the financing liabilities note.
  metaDescription: Build an IAS 7 statement of cash flows with Kestra and DuckDB. Indirect method, direct method cross-check, financing liabilities and a tie-out.
  description: |
    The cash flow statement is usually the last statement prepared and the first one an auditor tests, because it has to explain the change in cash exactly. Built in a spreadsheet from balance sheet movements, it breaks easily:
    - a new account nobody mapped,
    - a non-cash addition counted as capex,
    - a lease taken on counted as a cash outflow,
    - a dividend declared but not paid.

    This flow builds the statement with the indirect method from the trial balances and the registers, and proves it two ways before publishing it.

    It runs with no setup and no network. DuckDB holds an opening trial balance and a year of summarised journals:
    - credit sales and collections, bad debts, inventory and a write-down;
    - accruals, prepayments, payroll, capex and a disposal at a gain, capitalised development costs;
    - a new lease, a revolver drawn and a term loan repaid;
    - accrued interest, tax, a dividend declared and partly paid, shares issued, share-based payments, and USD cash revalued.


    ## How the statement is built

    Every account in the chart has a role (`CASH`, `WC_RECEIVABLES`, `PPE`, `BORROWINGS`...). Each line is computed from role movements. For a balance sheet account, the cash effect is the movement with the opposite sign.

    | Section | Lines |
    |---|---|
    | Operating | Profit before tax; depreciation, right-of-use depreciation, amortisation; share-based payments; gain on disposal; net finance costs; FX on cash; change in receivables, inventories, prepayments, payables, accruals; income tax paid (expense + change in tax payable) |
    | Investing | Capex (from the fixed asset register), disposal proceeds (net book value + gain), capitalised development costs, interest received |
    | Financing | Interest paid (or operating, by policy: IAS 7.33), share issue, proceeds and repayments of borrowings shown gross (IAS 7.21), principal elements of lease payments (excluding new leases, a non-cash addition), dividends paid (declared - change in dividends payable) |

    It also writes the IAS 7.43 non-cash transactions disclosure and the IAS 7.44A table of changes in liabilities arising from financing activities.

    ## Two proofs before publishing

    1. **Tie-out**: operating + investing + financing + the effect of exchange rates must equal the change in cash, to the cent.
    2. **Direct method**: every journal entry that touches cash is classified by the account on the other side, which rebuilds the section totals from the cash lines without any of the indirect logic. Each section must agree.

    The statement is also blocked when:
    - a balance sheet account moved but has no role,
    - the fixed asset register does not explain the PPE movement,
    - the lease register does not explain the right-of-use assets,
    - the trial balance does not balance,
    - the financing liabilities do not reconcile.

    ## How it works

    1. `build` (`io.kestra.plugin.jdbc.duckdb.Queries`) builds the balances, the lines, the checks, the direct method and the notes, and renders the statement as Markdown.
    2. `log_statement` prints the totals and both proofs.
    3. `gate` (`io.kestra.plugin.core.flow.If`) fails on any issue.
    4. `write_statement` (`io.kestra.plugin.core.storage.Write`) and `publish` store `statement-of-cash-flows.md`, `statement.csv`, `account-mapping.csv` and `checks.csv`.

    ## Tested end to end

    On Kestra 2.0.3 OSS.

    | Run | Inputs | Result |
    |---|---|---|
    | 1 | defaults | Operating 4,300,000, investing (3,890,000), financing (4,450,000), FX 80,000. Cash 6,200,000 to 2,240,000: moved (3,960,000), explained (3,960,000). The direct method agrees on every section. Borrowings 12,000,000 + (2,000,000) = 10,000,000, leases 4,100,000 + (780,000) + 2,400,000 = 5,720,000. Published |
    | 2 | `interest_paid_in: OPERATING` | Operating 3,130,000, financing (3,280,000): 1,170,000 of interest moves between sections, the totals still tie and the direct method agrees |
    | 3 | `ISSUES` | Not published, 4 issues: account 1790 (landlord deposit, 250,000) unmapped; PPE moved 1,100,000 but the register explains 850,000; the statement explains (3,710,000) against (4,210,000); the direct method disagrees on investing |

    The interest paid line (1,170,000) combines the 1,050,000 paid on borrowings and the 120,000 interest part of the lease payments, as IAS 7 requires for leases.

    ## Problems found while testing

    - **One NULL hid the reason.** The financing liabilities reconciliation returned NULL for the lease line, because a correlated subquery returned nothing for it. The check fired with an empty message, so the run failed without saying why. Every part is now computed per liability.
    - **Net borrowings hid the real movements.** The first version showed one net line of (2,000,000). IAS 7.21 wants gross proceeds and repayments, so the 4,000,000 drawn and the 6,000,000 repaid now come from the journal lines on the borrowing accounts.

    ## Inputs

    | Input | Default | Purpose |
    |---|---|---|
    | `period_end` | `2026-09-30` | Label of the period |
    | `interest_paid_in` | `FINANCING` | Or `OPERATING`, the US GAAP choice |
    | `scenario` | `CLEAN` | Demo only |

    ## Use it with your data

    - Replace `opening` and `journals` with your opening and closing trial balances. Without journals, load the closing balances directly into `tb`. The direct method cross-check then needs the cash book lines.
    - Edit `accounts` to give every balance sheet account a role. An unmapped account that moves stops the run.
    - Replace the two registers with your fixed asset and lease subledgers (the depreciation and IFRS 16 blueprints produce these figures).

    ## Things to know

    - Acquisitions and disposals of subsidiaries, foreign operations with a different functional currency, and bank overdrafts treated as cash need extra lines.
    - Working capital movements of foreign subsidiaries need translation at average rates before they come in here.

