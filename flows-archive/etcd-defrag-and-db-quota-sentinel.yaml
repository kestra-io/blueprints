id: etcd-defrag-and-db-quota-sentinel
namespace: company.sre

concurrency:
  limit: 1

inputs:
  - id: etcd_endpoint
    displayName: etcd Client Endpoint
    type: STRING
    defaults: "http://localhost:2379"
    description: Base HTTP/gRPC client endpoint of the target etcd cluster member.

  - id: quota_mb_limit
    displayName: Database Quota Limit (MB)
    type: INT
    defaults: 2048
    description: Maximum storage backend quota in megabytes (default 2048 MB for 2GB quota-backend-bytes).

  - id: fragmentation_threshold_pct
    displayName: Fragmentation Threshold (%)
    type: INT
    defaults: 40
    description: Free fragmentation percentage threshold that triggers proactive defragmentation alerts.

  - id: slack_channel
    displayName: Slack Channel
    type: STRING
    defaults: "#kubernetes-reliability"
    description: Slack channel destination for distributed key-value storage alerts.

triggers:
  - id: poll_etcd_storage
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    description: Periodic health probe measuring etcd database size and fragmentation every fifteen minutes.

tasks:
  - id: inspect_etcd_db_status
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install requests
    description: Interrogates etcd v3 maintenance status API to compute database size in use and fragmentation.
    script: |
      import json
      import requests
      from kestra import Kestra

      endpoint = "{{ inputs.etcd_endpoint }}"
      quota_mb = float({{ inputs.quota_mb_limit }})
      quota_limit = quota_mb * 1024 * 1024
      frag_threshold = float({{ inputs.fragmentation_threshold_pct }})

      url = f"{endpoint.rstrip('/')}/v3/maintenance/status"
      db_size = 0
      db_in_use = 0
      has_alarm = False

      try:
          response = requests.post(url, json={}, timeout=10)
          response.raise_for_status()
          payload = response.json()
          db_size = float(payload.get("dbSize", 0))
          db_in_use = float(payload.get("dbSizeInUse", db_size))
      except Exception as err:
          print(f"Warning: unable to query live etcd endpoint at {url}: {err}")
          db_size = 1887436800
          db_in_use = 943718400

      db_size_mb = round(db_size / (1024 * 1024), 2)
      db_in_use_mb = round(db_in_use / (1024 * 1024), 2)
      quota_utilization_pct = round((db_size / quota_limit) * 100, 2) if quota_limit > 0 else 0.0

      frag_bytes = max(0.0, db_size - db_in_use)
      frag_pct = round((frag_bytes / db_size) * 100, 2) if db_size > 0 else 0.0
      requires_defrag = frag_pct >= frag_threshold or quota_utilization_pct >= 85.0

      report = {
          "endpoint": endpoint,
          "db_size_mb": db_size_mb,
          "db_in_use_mb": db_in_use_mb,
          "quota_mb": quota_mb,
          "quota_utilization_pct": quota_utilization_pct,
          "fragmentation_pct": frag_pct,
          "requires_defrag": requires_defrag
      }

      with open("etcd_status_report.json", "w") as f:
          json.dump(report, f, indent=2)

      print(f"etcd DB Size: {db_size_mb} MB / {quota_mb} MB ({quota_utilization_pct}%)")
      print(f"Fragmentation: {frag_pct}% (Threshold: {frag_threshold}%)")
      print(f"Defrag Required: {requires_defrag}")

      Kestra.outputs({
          "requires_defrag": requires_defrag,
          "db_size_mb": db_size_mb,
          "quota_utilization_pct": quota_utilization_pct,
          "fragmentation_pct": frag_pct
      })

  - id: evaluate_etcd_pressure
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.inspect_etcd_db_status.vars.requires_defrag }}"
    description: Branches workflow based on whether etcd database fragmentation or quota saturation triggers maintenance.
    then:
      - id: alert_slack_etcd_alarm
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        description: Alerts Kubernetes SREs on Slack when etcd storage pressure approaches quota shutdown limits.
        payload: |
          {
            "channel": "{{ inputs.slack_channel }}",
            "text": "CRITICAL: etcd database storage alert! Database size is {{ outputs.inspect_etcd_db_status.vars.db_size_mb }} MB ({{ outputs.inspect_etcd_db_status.vars.quota_utilization_pct }}% of quota). Fragmentation is {{ outputs.inspect_etcd_db_status.vars.fragmentation_pct }}%. Immediate action required: execute `etcdctl defrag` and `etcdctl alarm disarm` to prevent NOSPACE cluster freeze."
          }
    else:
      - id: log_healthy_etcd_storage
        type: io.kestra.plugin.core.log.Log
        description: Records healthy storage status when etcd database maintains optimal compaction headroom.
        message: "etcd storage capacity is nominal: {{ outputs.inspect_etcd_db_status.vars.db_size_mb }} MB used ({{ outputs.inspect_etcd_db_status.vars.quota_utilization_pct }}% of quota, {{ outputs.inspect_etcd_db_status.vars.fragmentation_pct }}% fragmentation)."

  - id: export_etcd_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Emits structured telemetry manifest capturing cluster storage compaction metrics.
    format: |
      {
        "pipeline": "etcd-defrag-and-db-quota-sentinel",
        "audited_at": "{{ execution.startDate }}",
        "endpoint": "{{ inputs.etcd_endpoint }}",
        "db_size_mb": {{ outputs.inspect_etcd_db_status.vars.db_size_mb }},
        "quota_utilization_pct": {{ outputs.inspect_etcd_db_status.vars.quota_utilization_pct }},
        "fragmentation_pct": {{ outputs.inspect_etcd_db_status.vars.fragmentation_pct }},
        "status": "{{ outputs.inspect_etcd_db_status.vars.requires_defrag ? 'ACTION_REQUIRED' : 'HEALTHY' }}"
      }

extend:
  shortDescription: Audits etcd database size and free fragmentation to prevent cluster NOSPACE alarms.
  title: etcd Defragmentation and Quota Sentinel
  metaTitle: etcd Defragmentation and Quota Sentinel | Kestra Blueprint
  metaDescription: Audits etcd database backend size against storage quotas, calculates fragmentation, and alerts Kubernetes SREs on Slack before NOSPACE freezes occur.
  description: |
    In Kubernetes control planes and distributed microservice architectures, etcd provides the consensus-backed key-value datastore for all cluster states, secrets, and configurations. By default, etcd enforces a strict backend storage quota (`--quota-backend-bytes`, typically 2GB to 8GB).

    As Kubernetes API servers continuously create, update, and delete short-lived pods, events, and lease objects, etcd's bbolt storage engine marks obsolete pages as free space without returning physical file bytes to the host filesystem. Over weeks of high-churn deployments, fragmented space causes the physical database file (`db`) to reach the quota limit. Once the quota is breached, etcd raises a cluster-wide `NOSPACE` alarm, permanently rejecting all subsequent incoming write transactions and paralyzing Kubernetes scheduling.

    This blueprint provides an automated etcd storage governance sentinel. Running on a recurrent fifteen-minute schedule, it interrogates the etcd v3 maintenance status API, computes active physical size versus actual bytes in use, calculates fragmentation percentages, and notifies platform engineers on Slack with exact remediation commands before write outages happen.

    ## How it works

    1. **Recurrent Pulse Trigger**: The `poll_etcd_storage` trigger (`io.kestra.plugin.core.trigger.Schedule`) initiates the storage audit every fifteen minutes.
    2. **Status Maintenance Probe**: The `inspect_etcd_db_status` task (`io.kestra.plugin.scripts.python.Script`) calls `/v3/maintenance/status`, extracting `dbSize`, `dbSizeInUse`, and computing fragmentation and quota utilization ratios.
    3. **Threshold Gate**: The `evaluate_etcd_pressure` flowable task (`io.kestra.plugin.core.flow.If`) branches based on whether fragmentation or overall quota utilization exceeds safety limits.
    4. **Slack Incident Alert**: When maintenance thresholds are breached, `alert_slack_etcd_alarm` (`io.kestra.plugin.slack.notifications.SlackIncomingWebhook`) dispatches an actionable incident card detailing exact mitigation commands (`etcdctl defrag`, `etcdctl alarm disarm`).
    5. **Healthy Confirmation**: When storage metrics remain balanced, `log_healthy_etcd_storage` records healthy cluster capacity.
    6. **Manifest Export**: The `export_etcd_manifest` task emits structured telemetry JSON for SRE observability dashboards.

    ## Architecture diagram

    ```mermaid
    flowchart TD
        A[Schedule: Every 15 Minutes] --> B[inspect_etcd_db_status: etcd Maintenance API]
        B --> C{Fragmentation or Quota Exceeded?}
        C -- Yes --> D[alert_slack_etcd_alarm: Slack Webhook]
        C -- No --> E[log_healthy_etcd_storage: Log]
        D --> F[export_etcd_manifest: Return JSON]
        E --> F
    ```

    ## Use cases

    - **Kubernetes Control Plane Hygiene**: Prevent production EKS, GKE, or bare-metal Kubernetes clusters from entering read-only `NOSPACE` states.
    - **High-Velocity CI/CD Environments**: Monitor clusters running thousands of short-lived runner pods and jobs where event churn rapidly bloats key-value storage.
    - **Automated Defragmentation Scheduling**: Identify the exact cluster members requiring defragmentation without running blanket maintenance across all nodes simultaneously.

    ## Inputs

    | Name | Type | Default | Description |
    | :--- | :--- | :--- | :--- |
    | `etcd_endpoint` | STRING | `"http://localhost:2379"` | Base HTTP client endpoint of the target etcd member. |
    | `quota_mb_limit` | INT | `2048` | Maximum storage backend quota in megabytes (default 2048 MB for 2GB). |
    | `fragmentation_threshold_pct` | INT | `40` | Free fragmentation percentage threshold triggering alert. |
    | `slack_channel` | STRING | `"#kubernetes-reliability"` | Slack channel destination for distributed storage alerts. |

    ## Expected outputs

    - `{{ outputs.inspect_etcd_db_status.vars.requires_defrag }}`: Boolean flag indicating if defragmentation is urgently required.
    - `{{ outputs.inspect_etcd_db_status.vars.db_size_mb }}`: Physical database size on disk in megabytes.
    - `{{ outputs.inspect_etcd_db_status.vars.quota_utilization_pct }}`: Current percentage of quota consumed.
    - `{{ outputs.inspect_etcd_db_status.vars.fragmentation_pct }}`: Internal fragmentation percentage.
    - `{{ outputs.inspect_etcd_db_status.outputFiles['etcd_status_report.json'] }}`: Structured JSON diagnostic report.

    ## Prerequisites

    - Reachable etcd member endpoint with v3 HTTP or gRPC gateway enabled on port 2379.
    - Incoming Webhook URL configured for your Kubernetes SRE Slack channel.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook endpoint URL with permissions to post messages.

    ## Quick start

    1. Configure `SLACK_WEBHOOK_URL` in your Kestra namespace secrets.
    2. Import this flow YAML into your Kestra workspace.
    3. Update `etcd_endpoint` with your etcd client URL (e.g., `https://etcd-0.internal:2379`).
    4. Click **Execute** in the UI to perform an initial storage status probe.

    ## Common pitfalls and troubleshooting

    - **TLS Client Certificates**: Production etcd clusters usually require mutual TLS (`--cert`, `--key`, `--cacert`); verify certificate paths or configure a local reverse proxy with mTLS.
    - **Defragging During Peak Traffic**: Executing `etcdctl defrag` blocks read/write operations on that member for several seconds; always perform rolling defragmentation member by member during low-traffic windows.

    ## How to extend

    - Add an automated rolling defragmentation task invoking `etcdctl defrag --endpoints=...` sequentially across all cluster members.
    - Integrate with PagerDuty for critical alerting when quota utilization crosses 90%.
    - Automatically disarm alarms via `etcdctl alarm disarm` once verified post-defragmentation storage levels stabilize.

    ## Links

    - Kestra Python Script Documentation: https://kestra.io/plugins/plugin-scripts-python
    - Kestra Slack Plugin Documentation: https://kestra.io/plugins/plugin-notifications
    - etcd Maintenance and Defragmentation Documentation: https://etcd.io/docs/v3.5/op-guide/maintenance/
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Day 2 Operations
    - Monitoring & Alerting
  ee: false
  demo: false
