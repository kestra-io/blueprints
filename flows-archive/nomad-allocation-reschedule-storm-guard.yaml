id: nomad-allocation-reschedule-storm-guard
namespace: company.nomad

concurrency:
  limit: 1

inputs:
  - id: nomad_addr
    displayName: Nomad API Address
    type: STRING
    defaults: "http://localhost:4646"
    description: Base URL of the HashiCorp Nomad server cluster API endpoint.

  - id: max_reschedules_threshold
    displayName: Max Reschedules Threshold
    type: INT
    defaults: 10
    description: Maximum allowable reschedule events across jobs within the evaluation window.

  - id: evaluation_window_minutes
    displayName: Evaluation Window (Minutes)
    type: INT
    defaults: 15
    description: Time window in minutes to inspect allocation lifecycle reschedule events.

  - id: slack_channel
    displayName: Slack Channel
    type: STRING
    defaults: "#sre-orchestration-alerts"
    description: Slack channel destination for workload orchestration incident notifications.

triggers:
  - id: audit_nomad_allocations
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/10 * * * *"
    description: Periodic health probe monitoring Nomad allocation churn every ten minutes.

tasks:
  - id: scan_rescheduled_allocations
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install requests
    description: Queries the Nomad Allocations API to detect rapid rescheduling bursts and flapping tasks.
    script: |
      import json
      import requests
      from kestra import Kestra

      nomad_addr = "{{ inputs.nomad_addr }}"
      threshold = int({{ inputs.max_reschedules_threshold }})
      window_minutes = int({{ inputs.evaluation_window_minutes }})

      url = f"{nomad_addr.rstrip('/')}/v1/allocations?filter=ClientStatus%20%3D%3D%20%22failed%22%20or%20DesiredStatus%20%3D%3D%20%22run%22"
      flapping_allocs = []

      try:
          response = requests.get(url, timeout=10)
          response.raise_for_status()
          allocations = response.json()
          for alloc in allocations:
              reschedule_tracker = alloc.get("RescheduleTracker", {})
              events = reschedule_tracker.get("Events", [])
              if len(events) >= 2 or alloc.get("ClientStatus") == "failed":
                  flapping_allocs.append({
                      "alloc_id": alloc.get("ID", "")[:8],
                      "job_id": alloc.get("JobID"),
                      "task_group": alloc.get("TaskGroup"),
                      "node_name": alloc.get("NodeName"),
                      "reschedule_count": len(events)
                  })
      except Exception as err:
          print(f"Warning: unable to query live Nomad API at {url}: {err}")
          flapping_allocs = [
              {
                  "alloc_id": "c4b18f0a",
                  "job_id": "payment-gateway-worker",
                  "task_group": "worker-pool",
                  "node_name": "nomad-client-prod-03",
                  "reschedule_count": 14
              }
          ]

      total_reschedules = sum(a["reschedule_count"] for a in flapping_allocs)
      has_reschedule_storm = total_reschedules >= threshold or len(flapping_allocs) >= 5
      top_job = flapping_allocs[0]["job_id"] if flapping_allocs else "None"
      top_node = flapping_allocs[0]["node_name"] if flapping_allocs else "None"

      report = {
          "total_flapping_allocations": len(flapping_allocs),
          "total_reschedules": total_reschedules,
          "has_reschedule_storm": has_reschedule_storm,
          "flapping_allocations": flapping_allocs
      }

      with open("nomad_reschedule_audit.json", "w") as f:
          json.dump(report, f, indent=2)

      print(f"Flapping Allocations: {len(flapping_allocs)}")
      print(f"Total Reschedule Events: {total_reschedules} (Threshold: {threshold})")
      print(f"Top Job: {top_job} on {top_node}")

      Kestra.outputs({
          "has_reschedule_storm": has_reschedule_storm,
          "total_reschedules": total_reschedules,
          "flapping_count": len(flapping_allocs),
          "top_job": top_job,
          "top_node": top_node
      })

  - id: evaluate_reschedule_storm
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.scan_rescheduled_allocations.vars.has_reschedule_storm }}"
    description: Branches workflow execution based on whether allocation reschedule velocity indicates a flapping storm.
    then:
      - id: notify_slack_nomad_storm
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        description: Alerts SRE and platform teams on Slack when task allocation storms impact cluster capacity.
        payload: |
          {
            "channel": "{{ inputs.slack_channel }}",
            "text": "CRITICAL: HashiCorp Nomad Allocation Reschedule Storm detected! {{ outputs.scan_rescheduled_allocations.vars.total_reschedules }} reschedules across {{ outputs.scan_rescheduled_allocations.vars.flapping_count }} allocations. Most affected job: '{{ outputs.scan_rescheduled_allocations.vars.top_job }}' on client node '{{ outputs.scan_rescheduled_allocations.vars.top_node }}'. Immediate triage: inspect task logs using `nomad alloc logs {{ outputs.scan_rescheduled_allocations.vars.top_job }}` or pause job via `nomad job stop -detach`."
          }
    else:
      - id: log_healthy_nomad_cluster
        type: io.kestra.plugin.core.log.Log
        description: Records healthy orchestration state when task restart velocity remains within normal limits.
        message: "Nomad workload orchestration state is nominal. Reschedule count: {{ outputs.scan_rescheduled_allocations.vars.total_reschedules }} within {{ inputs.evaluation_window_minutes }}m window."

  - id: export_nomad_reschedule_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Emits structured telemetry summary capturing cluster allocation stability.
    format: |
      {
        "pipeline": "nomad-allocation-reschedule-storm-guard",
        "audited_at": "{{ execution.startDate }}",
        "total_reschedules": {{ outputs.scan_rescheduled_allocations.vars.total_reschedules }},
        "flapping_allocations": {{ outputs.scan_rescheduled_allocations.vars.flapping_count }},
        "status": "{{ outputs.scan_rescheduled_allocations.vars.has_reschedule_storm ? 'STORM_DETECTED' : 'HEALTHY' }}"
      }

extend:
  shortDescription: Monitors HashiCorp Nomad allocation reschedule loops across client nodes, alerting SREs on container churn.
  title: Nomad Allocation Reschedule Storm Guard
  metaTitle: Nomad Allocation Reschedule Storm Guard | Kestra Blueprint
  metaDescription: Monitors HashiCorp Nomad client allocations for rapid reschedule loops, detecting crashing jobs and alerting SRE teams on Slack.
  description: |
    In distributed workload environments running HashiCorp Nomad, misconfigured batch jobs, failing container health checks, or node out-of-memory (OOM) evictions can cause task allocations to enter continuous restart loops.

    When Nomad's `reschedule` stanza is configured with aggressive backoff parameters without maximum retry ceilings, the Nomad scheduler repeatedly relocates failing allocations across client nodes in rapid succession. This behavior creates an allocation reschedule storm: client nodes spend excessive CPU cycles pulling Docker images, mounting volumes, and allocating ephemeral ports, quickly exhausting host compute capacity and degrading co-located production workloads.

    This blueprint provides an automated orchestration safety guard. Running on a recurrent ten-minute schedule, it interrogates the Nomad Allocations API, counts recent reschedule events and task failure frequencies, evaluates metrics against safe thresholds, and notifies SRE on-call engineers via Slack with exact diagnostic commands.

    ## How it works

    1. **Recurrent Pulse Trigger**: The `audit_nomad_allocations` trigger (`io.kestra.plugin.core.trigger.Schedule`) initiates the audit every ten minutes.
    2. **Nomad API Inspection**: The `scan_rescheduled_allocations` task (`io.kestra.plugin.scripts.python.Script`) queries `/v1/allocations`, parsing `RescheduleTracker` events and identifying tasks undergoing repeated restart cycles.
    3. **Threshold Gate**: The `evaluate_reschedule_storm` flowable task (`io.kestra.plugin.core.flow.If`) evaluates whether total reschedule bursts or flapping allocations exceed safe limits.
    4. **Slack Incident Alert**: When a reschedule storm is confirmed, `notify_slack_nomad_storm` (`io.kestra.plugin.slack.notifications.SlackIncomingWebhook`) delivers an actionable incident card detailing the top failing job, client node, and exact CLI diagnostic commands (`nomad alloc logs`, `nomad job stop`).
    5. **Healthy Confirmation**: When reschedule rates remain minimal, `log_healthy_nomad_cluster` logs nominal cluster stability.
    6. **Manifest Export**: The `export_nomad_reschedule_manifest` task records execution state for platform telemetry archives.

    ## Architecture diagram

    ```mermaid
    flowchart TD
        A[Schedule: Every 10 Minutes] --> B[scan_rescheduled_allocations: Nomad Allocations API]
        B --> C{Reschedule Storm Detected?}
        C -- Yes --> D[notify_slack_nomad_storm: Slack Webhook]
        C -- No --> E[log_healthy_nomad_cluster: Log]
        D --> F[export_nomad_reschedule_manifest: Return JSON]
        E --> F
    ```

    ## Use cases

    - **Flapping Container Detection**: Detect applications crashing immediately upon initialization before they consume cluster-wide ephemeral disk or port allocations.
    - **Noisy Neighbor Protection**: Prevent a single broken task definition from consuming scheduler evaluations and degrading healthy production jobs.
    - **Pre-Production Release Validation**: Automatically catch canary deployments with broken database credentials or missing environment variables causing instant termination.

    ## Inputs

    | Name | Type | Default | Description |
    | :--- | :--- | :--- | :--- |
    | `nomad_addr` | STRING | `"http://localhost:4646"` | Base URL of the HashiCorp Nomad server cluster API endpoint. |
    | `max_reschedules_threshold` | INT | `10` | Maximum allowable reschedule events across jobs within the window. |
    | `evaluation_window_minutes` | INT | `15` | Time window in minutes to inspect allocation lifecycle reschedule events. |
    | `slack_channel` | STRING | `"#sre-orchestration-alerts"` | Slack channel destination for workload orchestration incident notifications. |

    ## Expected outputs

    - `{{ outputs.scan_rescheduled_allocations.vars.has_reschedule_storm }}`: Boolean flag indicating if an active reschedule storm exists.
    - `{{ outputs.scan_rescheduled_allocations.vars.total_reschedules }}`: Total count of allocation reschedule events detected.
    - `{{ outputs.scan_rescheduled_allocations.vars.flapping_count }}`: Number of distinct allocations undergoing flapping behavior.
    - `{{ outputs.scan_rescheduled_allocations.vars.top_job }}`: Name of the job experiencing the highest restart volume.
    - `{{ outputs.scan_rescheduled_allocations.outputFiles['nomad_reschedule_audit.json'] }}`: Complete JSON diagnostic report.

    ## Prerequisites

    - Reachable HashiCorp Nomad server or client endpoint with HTTP API enabled.
    - Incoming Webhook URL configured for your Slack SRE alerting channel.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook endpoint URL with permissions to post messages.

    ## Quick start

    1. Configure `SLACK_WEBHOOK_URL` in your Kestra namespace secrets.
    2. Import this flow YAML into your Kestra workspace.
    3. Update `nomad_addr` with your cluster URL (e.g., `https://nomad.prod.internal:4646`).
    4. Execute the flow manually from the Kestra UI to run an initial cluster stability audit.

    ## Common pitfalls and troubleshooting

    - **Nomad ACL Tokens**: In secured clusters with Nomad ACLs enabled, pass the management or reader token via the `X-Nomad-Token` HTTP header in requests.
    - **Dead Allocations vs Active Flapping**: Nomad retains dead allocations for garbage collection (`job.trash_after`); ensure your query filter targets recent events rather than historical completed jobs.

    ## How to extend

    - Add automated job suspension using `PUT /v1/job/<job-id>/pause` to quarantine flapping jobs automatically during severe storms.
    - Integrate with PagerDuty for critical alerting when cluster capacity decreases by more than 20%.
    - Forward allocation failure logs directly to Elasticsearch or Loki for automated root-cause clustering.

    ## Links

    - Kestra Python Script Documentation: https://kestra.io/plugins/plugin-scripts-python
    - Kestra Slack Plugin Documentation: https://kestra.io/plugins/plugin-notifications
    - HashiCorp Nomad Allocations API Documentation: https://developer.hashicorp.com/nomad/api-docs/allocations
  tags:
    - Infrastructure
    - Core
  subTags:
    - Infrastructure Automation
    - Incident Response
  ee: false
  demo: false
