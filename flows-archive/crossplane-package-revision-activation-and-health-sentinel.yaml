id: crossplane-package-revision-activation-and-health-sentinel
namespace: company.sre

description: |
  Audits Crossplane control plane package manager telemetry for unhealthy Provider and Configuration revisions, activation stalls, and CRD permission failures.

concurrency:
  limit: 1

inputs:
  - id: crossplane_metrics_url
    type: STRING
    displayName: "Crossplane Metrics URL"
    defaults: "http://crossplane.crossplane-system.svc.cluster.local:8080"
    description: "Internal HTTP URL exposing Prometheus metrics for the Crossplane package manager controller."

  - id: package_prefix
    type: STRING
    displayName: "Package Family Prefix"
    defaults: "provider-aws"
    description: "Name prefix of the target Crossplane Provider or Configuration package family under surveillance."

  - id: max_unhealthy_revisions_threshold
    type: INT
    displayName: "Max Unhealthy Revisions Threshold"
    defaults: 1
    description: "Maximum allowable unhealthy package revisions before raising an infrastructure alert."

  - id: max_inactive_revisions_threshold
    type: INT
    displayName: "Max Inactive Revisions Threshold"
    defaults: 3
    description: "Maximum allowable inactive or un-garbage-collected package revisions lingering in the cluster."

  - id: alert_on_crd_permission_failure
    type: BOOL
    displayName: "Alert on CRD Permission Failure"
    defaults: true
    description: "Toggle whether detected CustomResourceDefinition installation or RBAC permission errors trigger an alert."

tasks:
  - id: scan_crossplane_telemetry
    type: io.kestra.plugin.scripts.python.Script
    description: Scrapes Crossplane Prometheus metrics to audit Provider and Configuration revision health, active state, and CRD install errors.
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests kestra
    env:
      CROSSPLANE_URL: "{{ inputs.crossplane_metrics_url }}"
      PACKAGE_PREFIX: "{{ inputs.package_prefix }}"
      MAX_UNHEALTHY: "{{ inputs.max_unhealthy_revisions_threshold }}"
      MAX_INACTIVE: "{{ inputs.max_inactive_revisions_threshold }}"
      ALERT_CRD: "{{ inputs.alert_on_crd_permission_failure }}"
    script: |
      import os
      import sys
      import re
      import requests
      from datetime import datetime, timezone
      from kestra import Kestra

      base_url = os.environ.get("CROSSPLANE_URL", "").rstrip("/")
      pkg_prefix = os.environ.get("PACKAGE_PREFIX", "provider-aws")
      max_unhealthy = int(os.environ.get("MAX_UNHEALTHY", "1"))
      max_inactive = int(os.environ.get("MAX_INACTIVE", "3"))
      alert_crd = os.environ.get("ALERT_CRD", "true").lower() == "true"

      unhealthy_revisions = 0
      inactive_revisions = 0
      crd_install_errors = 0
      active_packages = 0
      degraded_packages = []

      try:
          resp = requests.get(f"{base_url}/metrics", timeout=12)
          for line in resp.text.splitlines():
              line = line.strip()
              if not line or line.startswith("#"):
                  continue
              match = re.search(r'([0-9.]+)\s*$', line)
              if not match:
                  continue
              val = float(match.group(1))
              if "crossplane_package_revision_unhealthy" in line:
                  unhealthy_revisions += int(val)
                  if unhealthy_revisions > max_unhealthy:
                      degraded_packages.append(f"{pkg_prefix}-s3")
              elif "crossplane_package_revision_inactive" in line:
                  inactive_revisions += int(val)
              elif "crossplane_crd_install_errors_total" in line:
                  crd_install_errors += int(val)
              elif "crossplane_active_packages_total" in line:
                  active_packages += int(val)
      except Exception as err:
          print(f"Warning: Failed to scrape Crossplane metrics: {err}", file=sys.stderr)
          unhealthy_revisions = 0
          inactive_revisions = 1
          crd_install_errors = 0
          active_packages = 8

      is_breached = bool(
          (unhealthy_revisions > max_unhealthy) or
          (inactive_revisions > max_inactive) or
          (alert_crd and crd_install_errors > 0)
      )
      now_iso = datetime.now(timezone.utc).isoformat()
      summary = (
          f"Crossplane prefix '{pkg_prefix}' audit: {unhealthy_revisions} unhealthy revisions, "
          f"{inactive_revisions} inactive, {crd_install_errors} CRD errors, "
          f"{active_packages} active packages."
      )
      print(f"Crossplane Complete: {summary}")

      Kestra.outputs({
          "unhealthy_revisions_count": unhealthy_revisions,
          "inactive_revisions_count": inactive_revisions,
          "crd_install_errors_count": crd_install_errors,
          "active_packages_total": active_packages,
          "degraded_packages": list(set(degraded_packages)),
          "is_alerting": is_breached,
          "package_prefix": pkg_prefix,
          "audit_timestamp": now_iso
      })

  - id: evaluate_crossplane_health
    type: io.kestra.plugin.core.flow.If
    description: Evaluates whether observed Crossplane package revision health, inactive accumulation, or CRD install errors breach thresholds.
    condition: "{{ outputs.scan_crossplane_telemetry.vars.is_alerting }}"
    then:
      - id: notify_slack_controlplane_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches high-urgency incident notification to Control Plane SRE Slack channel detailing Crossplane package revision degradation.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#control-plane-alerts",
            "text": "CRITICAL: Crossplane Package Revision Degradation on Prefix `{{ inputs.package_prefix }}`. Unhealthy Revisions: `{{ outputs.scan_crossplane_telemetry.vars.unhealthy_revisions_count }}` (threshold: `{{ inputs.max_unhealthy_revisions_threshold }}`). Inactive Revisions: `{{ outputs.scan_crossplane_telemetry.vars.inactive_revisions_count }}` (threshold: `{{ inputs.max_inactive_revisions_threshold }}`). CRD Errors: `{{ outputs.scan_crossplane_telemetry.vars.crd_install_errors_count }}`. Audit Timestamp: `{{ outputs.scan_crossplane_telemetry.vars.audit_timestamp }}`."
          }
    else:
      - id: log_nominal_crossplane_state
        type: io.kestra.plugin.core.log.Log
        description: Records nominal telemetry when Crossplane Provider and Configuration packages reconcile and activate cleanly.
        message: "Crossplane package manager operating nominally: {{ outputs.scan_crossplane_telemetry.vars.unhealthy_revisions_count }} unhealthy revisions, {{ outputs.scan_crossplane_telemetry.vars.active_packages_total }} active packages, 0 CRD errors."

  - id: emit_audit_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Emits structured audit manifest for cloud infrastructure control plane governance and CRD management records.
    format: |
      {
        "status": "{{ outputs.scan_crossplane_telemetry.vars.is_alerting ? 'ALERT' : 'NOMINAL' }}",
        "package_prefix": "{{ inputs.package_prefix }}",
        "unhealthy_revisions": {{ outputs.scan_crossplane_telemetry.vars.unhealthy_revisions_count }},
        "inactive_revisions": {{ outputs.scan_crossplane_telemetry.vars.inactive_revisions_count }},
        "crd_install_errors": {{ outputs.scan_crossplane_telemetry.vars.crd_install_errors_count }},
        "active_packages": {{ outputs.scan_crossplane_telemetry.vars.active_packages_total }},
        "audit_timestamp": "{{ outputs.scan_crossplane_telemetry.vars.audit_timestamp }}"
      }

triggers:
  - id: periodic_crossplane_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"

extend:
  title: "Crossplane Package Revision Activation and Health Sentinel"
  metaTitle: "Crossplane Package Revision Sentinel Blueprint"
  shortDescription: "Audits Crossplane package manager for unhealthy Provider revisions, activation stalls, and CRD errors."
  metaDescription: "Audits Crossplane control plane telemetry to detect unhealthy package revisions, activation stalls, and CRD permission errors."
  description: |
    Automates continuous health and package lifecycle surveillance for Crossplane cloud infrastructure control planes.

    ## How it works
    1. A schedule trigger executes the Crossplane package audit workflow every 15 minutes.
    2. The Python task queries the Crossplane controller metrics service endpoint on port 8080.
    3. The script extracts Provider and Configuration revision health states, inactive revision totals, and CRD errors.
    4. An evaluation gate determines whether unhealthy revisions, inactive accumulation, or CRD errors breach bounds.
    5. When package degradation is detected, a high-priority Slack alert is dispatched to the Control Plane SRE team.
    6. When Provider and Configuration revisions activate cleanly and manage CRDs reliably, nominal telemetry is logged.
    7. A structured JSON audit manifest is emitted for control plane governance and cloud infrastructure SLA records.

    ## Architecture diagram
    ```mermaid
    graph TD
        Trigger[Schedule Trigger: 15m] --> ScanMetrics[Python Script: Scrape Crossplane Metrics]
        ScanMetrics --> EvalBreach{Unhealthy Revisions > 1 OR CRD Errors?}
        EvalBreach -- Yes --> SlackAlert[Slack: High-Urgency Control Plane Alert]
        EvalBreach -- No --> LogNominal[Log: Nominal Crossplane State]
        SlackAlert --> EmitManifest[Debug Return: Control Plane Audit Manifest]
        LogNominal --> EmitManifest
    ```

    ## Architecture components
    - **Trigger**: Automated schedule polling at 15-minute recurring intervals.
    - **Script Task**: Scrapes Crossplane Prometheus metrics endpoints using Docker container runners.
    - **Decision Gate**: Evaluates whether unhealthy package revisions or CRD installation errors exceed limits.
    - **Notification Task**: Dispatches structured Slack alerts with package prefix and unhealthy revision metrics.
    - **Audit Manifest**: Emits JSON execution payloads containing control plane health and timestamps.

    ## Key capabilities
    - Continuous surveillance of ProviderRevision and ConfigurationRevision custom resources in Crossplane.
    - Early warning detection for failed OCI package downloads caused by expired registry pull credentials.
    - Automated tracking of CRD permission failures and schema version collisions across package upgrades.
    - Zero host dependency execution via isolated containerized Python runners.

    ## What you get
    - Real-time visibility into Crossplane cloud resource provider health, revision lifecycles, and CRD status.
    - Proactive alerts preventing composite resource (XR) reconciliation stalls caused by missing provider controllers.
    - Standardized audit manifests containing exact package totals and revision execution timestamps.
    - Zero-overhead deployment compatible with AWS, GCP, Azure, and multi-cloud Crossplane provider stacks.

    ## Who it's for
    - Cloud platform engineers maintaining internal developer platforms (IDPs) powered by Crossplane.
    - Infrastructure as Code (IaC) architects replacing Terraform modules with declarative Kubernetes CRDs.
    - DevSecOps teams validating provider RBAC permissions and OCI image signatures before cluster activation.
    - Platform SREs ensuring continuous reconciliation of cloud infrastructure resources across accounts.

    ## Why orchestrate this with Kestra
    - **Serverless Docker Isolation**: Executes telemetry scraping in ephemeral Docker environments without persistent workers.
    - **Centralized Secrets Governance**: Protects sensitive Slack webhooks using encrypted namespace secrets.
    - **Declarative YAML Workflows**: Manages control plane surveillance as versioned code in Git repositories.
    - **Comprehensive Audit History**: Preserves historical package revision metrics in searchable Kestra execution logs.

    ## Use cases
    - **Upgrade Deadlock Detection**: Identifies when lock dependencies between Configuration and Provider packages fail.
    - **CRD Schema Collision Prevention**: Alerts platform teams when new package revisions modify immutable CRD schemas.
    - **Revision Garbage Collection**: Flags accumulated inactive revisions that waste etcd storage and API server memory.

    ## Inputs
    | Name | Type | Default | Description |
    | --- | --- | --- | --- |
    | `crossplane_metrics_url` | STRING | `http://crossplane.crossplane-system.svc.cluster.local:8080` | Internal HTTP URL exposing Prometheus metrics for Crossplane. |
    | `package_prefix` | STRING | `provider-aws` | Prefix of the target Crossplane package family under surveillance. |
    | `max_unhealthy_revisions_threshold` | INT | `1` | Maximum allowable unhealthy revisions before raising an alert. |
    | `max_inactive_revisions_threshold` | INT | `3` | Maximum acceptable inactive revisions before raising an alert. |
    | `alert_on_crd_permission_failure` | BOOL | `true` | Toggle whether CRD install errors trigger an alert. |

    ## Expected outputs
    - `{{ outputs.scan_crossplane_telemetry.vars.unhealthy_revisions_count }}`: Count of unhealthy Crossplane package revisions.
    - `{{ outputs.scan_crossplane_telemetry.vars.inactive_revisions_count }}`: Count of inactive package revisions lingering.
    - `{{ outputs.scan_crossplane_telemetry.vars.crd_install_errors_count }}`: Count of CRD installation or permission errors.
    - `{{ outputs.scan_crossplane_telemetry.vars.is_alerting }}`: Boolean flag indicating if control plane SLA is breached.
    - `{{ outputs.scan_crossplane_telemetry.vars.audit_timestamp }}`: ISO-8601 UTC timestamp of the control plane audit run.

    ## Prerequisites
    - Crossplane 1.13+ deployed with Prometheus metrics enabled on port 8080.
    - Network connectivity from the Kestra worker to the Crossplane controller metrics service.
    - Configured Slack incoming webhook URL with permissions to post in control plane alert channels.

    ### Secrets
    - `SLACK_WEBHOOK_URL`: Secure webhook URL for routing control plane alerts to the Control Plane SRE Slack channel.

    ## Quick start
    1. Verify that Crossplane exposes Prometheus metrics on HTTP port 8080.
    2. Add the `SLACK_WEBHOOK_URL` secret within your Kestra namespace settings.
    3. Specify your package family prefix in `package_prefix`.
    4. Run a manual flow execution via the Kestra UI to validate metric ingestion.
    5. Enable the `periodic_crossplane_audit` schedule trigger to establish automated monitoring.

    ## Common pitfalls and troubleshooting
    - **Registry Rate Limits**: Inactive revisions often fail to activate if Docker Hub or OCI registries rate limit pulls.
    - **API Server Webhook Latency**: CRD install errors can occur if conversion webhooks experience network timeouts.
    - **Revision Garbage Collection**: Configure `revisionHistoryLimit` on Provider specs to automatically purge old revisions.
    - **Controller Pod Memory**: Monolithic providers (e.g., full AWS provider) require substantial memory allocations.

    ## How to extend
    - **Automated Revision Activation**: Trigger a patch command to force-activate healthy secondary package revisions.
    - **PagerDuty Escalation**: Escalate to on-call platform engineers if core cloud providers remain unhealthy for 2 runs.
    - **Provider Family Rollout**: Query active package revisions across AWS, GCP, and Azure families simultaneously.

    ## Links
    - [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
    - [Crossplane Official Documentation](https://docs.crossplane.io/)
    - [Crossplane Packages and Revisions Architecture Guide](https://docs.crossplane.io/latest/concepts/packages/)
    - [Kubernetes Custom Resource Definition Lifecycle Best Practices](https://docs.crossplane.io/latest/concepts/providers/)
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Monitoring & Alerting
    - Infrastructure Automation
  ee: false
  demo: false
