id: aws-ebs-unattached-volume-snapshot-and-prune
namespace: company.team
description: |
  Automated Amazon EBS storage FinOps auditor. Scans AWS EC2 volumes in available (unattached) status
  exceeding retention thresholds, computes monthly storage waste, and prepares snapshot-and-prune advisories.

concurrency:
  limit: 1

inputs:
  - id: aws_region
    type: STRING
    displayName: AWS Region
    defaults: "us-east-1"
    description: "Target AWS Region to inspect for detached EBS storage volumes."

  - id: unattached_days_threshold
    type: INT
    displayName: Detached Days Threshold
    defaults: 14
    description: "Minimum days an EBS volume must be in available status before triggering an advisory alert."

  - id: ebs_gp3_price_per_gb_month
    type: FLOAT
    displayName: EBS Price Per GB Month
    defaults: 0.08
    description: "Estimated monthly dollar cost per gigabyte for Amazon EBS gp3 storage."

  - id: slack_channel
    type: STRING
    displayName: Slack Channel
    defaults: "#finops-alerts"
    description: "Slack channel destination for storage cost reclamation alerts."

triggers:
  - id: weekly_ebs_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: "Executes unattached EBS volume audit weekly on Monday at 08:00 UTC."
    cron: "0 8 * * 1"

tasks:
  - id: scan_unattached_volumes
    type: io.kestra.plugin.scripts.python.Script
    description: "Queries AWS EC2 describe_volumes API to identify detached available volumes and calculate wasted storage."
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install boto3
    env:
      AWS_ACCESS_KEY_ID: "{{ secret('AWS_ACCESS_KEY_ID') }}"
      AWS_SECRET_ACCESS_KEY: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
      AWS_DEFAULT_REGION: "{{ inputs.aws_region }}"
    outputFiles:
      - ebs_audit_report.json
    script: |
      import os
      import json
      from datetime import datetime, timezone
      import boto3
      from kestra import Kestra

      ec2 = boto3.client("ec2")
      # Query for volumes in available (unattached) status
      response = ec2.describe_volumes(
          Filters=[{"Name": "status", "Values": ["available"]}]
      )

      volumes = response.get("Volumes", [])
      unattached_candidates = []
      now = datetime.now(timezone.utc)
      days_threshold = int("{{ inputs.unattached_days_threshold }}")
      price_per_gb = float("{{ inputs.ebs_gp3_price_per_gb_month }}")
      total_wasted_gb = 0

      for v in volumes:
          vol_id = v.get("VolumeId", "unknown")
          size_gb = v.get("Size", 0)
          vol_type = v.get("VolumeType", "gp3")
          create_time = v.get("CreateTime")

          age_days = (now - create_time).days if create_time else 0

          if age_days >= days_threshold:
              monthly_cost = round(size_gb * price_per_gb, 2)
              unattached_candidates.append({
                  "volume_id": vol_id,
                  "size_gb": size_gb,
                  "volume_type": vol_type,
                  "age_days": age_days,
                  "monthly_cost_usd": monthly_cost
              })
              total_wasted_gb += size_gb

      has_unattached = len(unattached_candidates) > 0
      total_monthly_waste = round(total_wasted_gb * price_per_gb, 2)

      report = {
          "region": os.environ.get("AWS_DEFAULT_REGION", "us-east-1"),
          "total_available_volumes": len(volumes),
          "flagged_volumes_count": len(unattached_candidates),
          "total_wasted_gb": total_wasted_gb,
          "total_monthly_waste_usd": total_monthly_waste,
          "volumes": unattached_candidates,
          "has_unattached": has_unattached
      }

      with open("ebs_audit_report.json", "w", encoding="utf-8") as f:
          json.dump(report, f, indent=2)

      Kestra.outputs({
          "has_unattached": has_unattached,
          "flagged_count": len(unattached_candidates),
          "total_wasted_gb": total_wasted_gb,
          "total_monthly_waste_usd": total_monthly_waste,
          "top_volume_id": unattached_candidates[0]["volume_id"] if unattached_candidates else "None",
          "top_volume_size": unattached_candidates[0]["size_gb"] if unattached_candidates else 0
      })

  - id: evaluate_unattached_volumes
    type: io.kestra.plugin.core.flow.If
    description: "Evaluates if any detached EBS volumes exceeded the age threshold."
    condition: "{{ outputs.scan_unattached_volumes.vars.has_unattached }}"
    then:
      - id: notify_slack_storage_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: "Dispatches actionable storage cleanup advisory to Slack."
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "{{ inputs.slack_channel }}",
            "text": "*AWS Cloud FinOps Alert: Unattached EBS Volumes Detected*\n• *AWS Region*: `{{ inputs.aws_region }}`\n• *Detached Volumes Count*: {{ outputs.scan_unattached_volumes.vars.flagged_count }} (Detached > {{ inputs.unattached_days_threshold }} days)\n• *Total Orphaned Storage*: {{ outputs.scan_unattached_volumes.vars.total_wasted_gb }} GB (~${{ outputs.scan_unattached_volumes.vars.total_monthly_waste_usd }} USD/month)\n• *Top Waste Candidate*: Volume `{{ outputs.scan_unattached_volumes.vars.top_volume_id }}` ({{ outputs.scan_unattached_volumes.vars.top_volume_size }} GB)\n• *Operational Impact*: AWS charges full provisioned EBS gigabyte rates regardless of whether volumes are attached to running EC2 instances.\n• *Recommended Remediation*: Take a final safety snapshot via `aws ec2 create-snapshot --volume-id {{ outputs.scan_unattached_volumes.vars.top_volume_id }}` and delete the unattached volume to eliminate recurring storage fees."
          }

    else:
      - id: log_clean_ebs_status
        type: io.kestra.plugin.core.log.Log
        description: "Logs confirmation of zero orphaned EBS storage volumes."
        message: "AWS EBS storage audit compliant for {{ inputs.aws_region }}. Zero detached volumes found exceeding {{ inputs.unattached_days_threshold }} days."

  - id: export_ebs_manifest
    type: io.kestra.plugin.core.debug.Return
    description: "Outputs structured JSON execution manifest for FinOps historical reporting."
    format: |
      {
        "pipeline": "aws-ebs-unattached-volume-snapshot-and-prune",
        "audited_at": "{{ execution.startDate }}",
        "region": "{{ inputs.aws_region }}",
        "volumes_flagged": {{ outputs.scan_unattached_volumes.vars.flagged_count }},
        "wasted_gb": {{ outputs.scan_unattached_volumes.vars.total_wasted_gb }},
        "monthly_waste_usd": {{ outputs.scan_unattached_volumes.vars.total_monthly_waste_usd }},
        "status": "{{ outputs.scan_unattached_volumes.vars.has_unattached ? 'ORPHANED_STORAGE_DETECTED' : 'OPTIMIZED' }}"
      }

extend:
  shortDescription: Scans AWS EC2 EBS volumes in available unattached status exceeding retention thresholds, alerting Slack with cleanup advisories.
  title: AWS EBS Unattached Volume FinOps Auditor
  metaTitle: AWS EBS Unattached Volume Auditor | Kestra Blueprint
  metaDescription: Scans AWS EC2 EBS volumes in unattached status exceeding retention thresholds, calculating monthly cost waste and alerting FinOps on Slack.
  description: |
    When Amazon EC2 instances are terminated or recreated, root block devices and secondary EBS data volumes are frequently left behind in the `available` (unattached) state unless explicitly configured with `DeleteOnTermination=true`. 

    Because Amazon EBS bills based on provisioned gigabytes per month (regardless of whether the volume is mounted to a running compute instance), orphaned volumes silently accumulate in cloud accounts. Over months of developer deployments and auto-scaling events, hundreds of detached volumes generate substantial monthly storage fees with zero operational utility.

    This blueprint implements an automated Cloud FinOps sentinel that connects to the AWS EC2 API, discovers all EBS volumes in the `available` status older than your retention threshold (default: 14 days), aggregates wasted gigabytes and monthly dollar costs, and dispatches an actionable advisory to your Slack channel with exact `create-snapshot` and `delete-volume` remediation instructions.

    ## How it works

    1. **Weekly Scheduled Scan**: The `weekly_ebs_audit` trigger (`io.kestra.plugin.core.trigger.Schedule`) executes every Monday morning at 08:00 UTC.
    2. **Boto3 Volume Query**: The `scan_unattached_volumes` task (`io.kestra.plugin.scripts.python.Script`) calls AWS EC2 `describe_volumes` with a status filter of `available`, calculates volume ages in days, and outputs `ebs_audit_report.json`.
    3. **Condition Branching**: The `evaluate_unattached_volumes` flowable task (`io.kestra.plugin.core.flow.If`) branches based on whether any volumes breached the detached age threshold.
    4. **Slack Alert Dispatch**: When detached volumes are found, `notify_slack_storage_team` (`io.kestra.plugin.slack.notifications.SlackIncomingWebhook`) delivers an actionable triage card detailing volume IDs, gigabytes, and estimated monthly cost waste.
    5. **Compliant Logging**: When all storage volumes are actively attached, `log_clean_ebs_status` records nominal status in execution logs.
    6. **Audit Manifest**: The `export_ebs_manifest` task records execution metadata for cloud budget accounting.

    ## What you get

    - Automated discovery of orphaned Amazon EBS volumes across regions.
    - Exact calculation of reclaimable storage gigabytes and monthly cost estimates.
    - Safety-first remediation guidance recommending snapshots before deletion.
    - Non-intrusive read-only execution preventing accidental data deletion.

    ## Who it is for

    - Cloud FinOps practitioners optimizing multi-account AWS spending.
    - DevOps Engineers managing EC2 instances and auto-scaling groups.
    - Storage Administrators maintaining cloud data retention policies.

    ## Why orchestrate this with Kestra

    Building ad-hoc Lambda functions for cloud governance requires managing serverless deployments, IAM permissions, and external webhook libraries. Kestra provides declarative, observable orchestration: it securely executes containerized Python tasks, calculates financial metrics, branches conditionally, and dispatches structured alerts with full execution history.

    ## Inputs

    | Name | Type | Default | Description |
    | :--- | :--- | :--- | :--- |
    | `aws_region` | STRING | `us-east-1` | AWS region to inspect for detached EBS storage volumes. |
    | `unattached_days_threshold` | INT | `14` | Minimum days detached before triggering an advisory alert. |
    | `ebs_gp3_price_per_gb_month` | FLOAT | `0.08` | Estimated monthly dollar cost per gigabyte for EBS gp3. |
    | `slack_channel` | STRING | `#finops-alerts` | Slack channel destination for alerts. |

    ## Expected outputs

    - `{{ outputs.scan_unattached_volumes.vars.has_unattached }}`: Boolean flag indicating if unattached volumes were detected.
    - `{{ outputs.scan_unattached_volumes.vars.flagged_count }}`: Number of detached volumes breaching threshold.
    - `{{ outputs.scan_unattached_volumes.vars.total_wasted_gb }}`: Total gigabytes of unattached storage capacity.
    - `{{ outputs.scan_unattached_volumes.outputFiles['ebs_audit_report.json'] }}`: Complete JSON diagnostic report.

    ## Prerequisites

    - An AWS IAM user or role with permissions: `ec2:DescribeVolumes`.
    - AWS credentials configured in Kestra secrets.
    - Slack Incoming Webhook configured for your FinOps alerting channel.

    ### Secrets

    - `AWS_ACCESS_KEY_ID`: AWS IAM access key ID.
    - `AWS_SECRET_ACCESS_KEY`: AWS IAM secret access key.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook endpoint URL.

    ## Quick start

    1. Configure `AWS_ACCESS_KEY_ID`, `AWS_SECRET_ACCESS_KEY`, and `SLACK_WEBHOOK_URL` in your Kestra namespace secrets.
    2. Import this flow YAML into your Kestra instance.
    3. Click **Execute** in the UI to run an initial regional scan.
    4. Review execution outputs to inspect unattached EBS volumes and monthly cost estimates.

    ## Common pitfalls and troubleshooting

    - **Snapshot Precedence**: Always ensure a final safety snapshot is created before calling `delete_volume` on orphaned volumes to protect against accidental data loss.
    - **Encrypted Volumes with KMS**: When auditing encrypted EBS volumes, verify that the caller role possesses appropriate `kms:DescribeKey` permissions if inspecting encryption keys.
    - **Multi-Region Coverage**: EBS volumes are bound to specific Availability Zones; duplicate or parameterize this flow to audit all active AWS regions.

    ## How to extend

    - Add an automated remediation task using `boto3` to automatically create snapshots and delete volumes if tagged with `AutoCleanup:True`.
    - Scan across multiple AWS accounts using AWS Organizations cross-account IAM assume-role policies.
    - Correlate unattached volumes with historical CloudTrail events to identify the engineer who originally detached the volume.

    ## Links

    - Kestra Python Script Documentation: https://kestra.io/plugins/plugin-scripts-python/io.kestra.plugin.scripts.python.Script
    - Kestra Slack Plugin Documentation: https://kestra.io/plugins/plugin-notifications
    - AWS EBS Pricing Documentation: https://aws.amazon.com/ebs/pricing/
  tags:
    - Cloud
    - Infrastructure
  subTags:
    - Day 2 Operations
    - FinOps & Cost Management
  ee: false
  demo: false
