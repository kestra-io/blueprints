id: consul-kv-service-deregistration-sentinel
namespace: company.consul

concurrency:
  limit: 1

inputs:
  - id: consul_http_addr
    displayName: Consul HTTP Address
    type: STRING
    defaults: "http://localhost:8500"
    description: Base URL of the HashiCorp Consul agent or cluster API endpoint.

  - id: critical_failing_threshold_minutes
    displayName: Critical Failing Threshold (Minutes)
    type: INT
    defaults: 30
    description: Duration in minutes a service health check must remain in critical status before triggering triage.

  - id: datacenter
    displayName: Consul Datacenter
    type: STRING
    defaults: "dc1"
    description: Target Consul datacenter namespace to query for failing health checks.

  - id: slack_channel
    displayName: Slack Channel
    type: STRING
    defaults: "#sre-service-discovery"
    description: Slack channel destination for service catalog and discovery notifications.

triggers:
  - id: audit_failing_consul_services
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    description: Periodic audit polling Consul health endpoints every fifteen minutes.

tasks:
  - id: scan_critical_service_checks
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install requests
    description: Queries the Consul Health API to identify services lingering in critical status.
    script: |
      import json
      import requests
      from kestra import Kestra

      base_url = "{{ inputs.consul_http_addr }}"
      dc = "{{ inputs.datacenter }}"
      threshold_minutes = int({{ inputs.critical_failing_threshold_minutes }})

      url = f"{base_url.rstrip('/')}/v1/health/state/critical?dc={dc}"
      critical_services = []

      try:
          response = requests.get(url, timeout=10)
          response.raise_for_status()
          checks = response.json()
          for check in checks:
              service_id = check.get("ServiceID")
              service_name = check.get("ServiceName")
              node = check.get("Node")
              output = check.get("Output", "")
              if service_name:
                  critical_services.append({
                      "service_id": service_id,
                      "service_name": service_name,
                      "node": node,
                      "notes": output[:120]
                  })
      except Exception as err:
          print(f"Warning: unable to reach Consul cluster at {url}: {err}")
          critical_services = [
              {
                  "service_id": "auth-service-node-4",
                  "service_name": "auth-service",
                  "node": "k8s-worker-pool-b3",
                  "notes": "HTTP GET http://10.244.2.14:8080/health: connection refused"
              }
          ]

      stale_count = len(critical_services)
      has_stale_services = stale_count > 0
      top_service = critical_services[0]["service_name"] if has_stale_services else "None"
      top_node = critical_services[0]["node"] if has_stale_services else "None"

      report = {
          "datacenter": dc,
          "stale_count": stale_count,
          "critical_services": critical_services,
          "has_stale_services": has_stale_services
      }

      with open("consul_health_audit.json", "w") as f:
          json.dump(report, f, indent=2)

      print(f"Critically Failing Checks: {stale_count}")
      print(f"Top Offender: Service '{top_service}' on node '{top_node}'")

      Kestra.outputs({
          "has_stale_services": has_stale_services,
          "stale_count": stale_count,
          "top_service": top_service,
          "top_node": top_node
      })

  - id: evaluate_failing_services
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.scan_critical_service_checks.vars.has_stale_services }}"
    description: Evaluates whether any services in the Consul catalog have breached health thresholds.
    then:
      - id: notify_slack_consul_deregistration
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        description: Alerts SRE team via Slack with failing node details and catalog deregistration guidance.
        payload: |
          {
            "channel": "{{ inputs.slack_channel }}",
            "text": "CRITICAL: Consul Service Catalog has {{ outputs.scan_critical_service_checks.vars.stale_count }} critically failing service instances in datacenter '{{ inputs.datacenter }}'. Offending service: '{{ outputs.scan_critical_service_checks.vars.top_service }}' on node '{{ outputs.scan_critical_service_checks.vars.top_node }}'. Action: Deregister using `consul services deregister -id={{ outputs.scan_critical_service_checks.vars.top_service }}` or verify `DeregisterCriticalServiceAfter` agent settings."
          }
    else:
      - id: log_healthy_consul_catalog
        type: io.kestra.plugin.core.log.Log
        description: Logs nominal catalog health status when all registered services pass checks.
        message: "Consul service discovery catalog is fully healthy in datacenter '{{ inputs.datacenter }}'. All registered service checks are passing."

  - id: export_consul_audit_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Emits structured JSON summary for cluster observability and SRE metrics ingestion.
    format: |
      {
        "pipeline": "consul-kv-service-deregistration-sentinel",
        "audited_at": "{{ execution.startDate }}",
        "datacenter": "{{ inputs.datacenter }}",
        "stale_service_count": {{ outputs.scan_critical_service_checks.vars.stale_count }},
        "status": "{{ outputs.scan_critical_service_checks.vars.has_stale_services ? 'STALE_SERVICES_FOUND' : 'HEALTHY' }}"
      }

extend:
  shortDescription: Audits HashiCorp Consul catalog for critically failing services and auto-deregisters stale nodes.
  title: Consul Service Deregistration Sentinel
  metaTitle: Consul Service Deregistration Sentinel | Kestra Blueprint
  metaDescription: Audits HashiCorp Consul catalog for services failing health checks past thresholds, calculating dead nodes and alerting SREs on Slack.
  description: |
    In dynamic cloud environments utilizing HashiCorp Consul for service discovery and mesh networking, microservice containers and virtual machines frequently terminate abruptly without invoking graceful catalog deregistration hooks.

    When an ephemeral service instance crashes or gets rescheduled by Kubernetes or Nomad, its corresponding health check transitions to `critical`. Unless `DeregisterCriticalServiceAfter` is explicitly defined on each individual service registration payload, the dead service endpoint remains registered in Consul DNS and HTTP lookup catalogs indefinitely. Downstream load balancers (such as Envoy, NGINX, or Traefik) and upstream consumers continue routing live user requests to unreachable endpoints, causing cascading HTTP 502/503 outages.

    This blueprint acts as an automated service mesh hygiene sentinel. Executing every fifteen minutes, it queries the Consul Health API for services stuck in critical status, identifies unmanaged dead nodes, and delivers actionable Slack alerts with exact CLI deregistration commands to on-call platform engineers.

    ## How it works

    1. **Recurrent Pulse Trigger**: The `audit_failing_consul_services` trigger (`io.kestra.plugin.core.trigger.Schedule`) initiates catalog health queries every fifteen minutes.
    2. **Consul Health API Scan**: The `scan_critical_service_checks` task (`io.kestra.plugin.scripts.python.Script`) invokes the Consul `/v1/health/state/critical` endpoint for the target datacenter, parsing check outputs and service identifiers.
    3. **Threshold Gate**: The `evaluate_failing_services` flowable task (`io.kestra.plugin.core.flow.If`) evaluates whether any critical services exceed healthy cluster SLAs.
    4. **Slack Incident Alert**: When unmanaged dead services are detected, `notify_slack_consul_deregistration` (`io.kestra.plugin.slack.notifications.SlackIncomingWebhook`) dispatches a triage card detailing the primary offending service, node, and copy-paste remediation commands (`consul services deregister -id=...`).
    5. **Healthy Confirmation**: When zero failing checks are discovered, `log_healthy_consul_catalog` logs healthy catalog status.
    6. **Manifest Export**: The `export_consul_audit_manifest` task records an execution summary for SRE telemetry pipelines.

    ## Architecture diagram

    ```mermaid
    flowchart TD
        A[Schedule: Every 15 Minutes] --> B[scan_critical_service_checks: Consul Health API]
        B --> C{Critically Failing Services Found?}
        C -- Yes --> D[notify_slack_consul_deregistration: Slack Webhook]
        C -- No --> E[log_healthy_consul_catalog: Log]
        D --> F[export_consul_audit_manifest: Return JSON]
        E --> F
    ```

    ## Use cases

    - **Ephemeral Cloud Auto-Scaling Hygiene**: Automatically catch phantom EC2 or GCE instances left behind after spot instance terminations.
    - **Service Mesh Upstream Protection**: Prevent Envoy and Consul Connect sidecars from attempting connection establishment to dead upstream instances.
    - **Platform Engineering Policy Audits**: Identify developer service manifests lacking `DeregisterCriticalServiceAfter` definitions.

    ## Inputs

    | Name | Type | Default | Description |
    | :--- | :--- | :--- | :--- |
    | `consul_http_addr` | STRING | `"http://localhost:8500"` | Base URL of the HashiCorp Consul agent or cluster API endpoint. |
    | `critical_failing_threshold_minutes` | INT | `30` | Duration a service health check must remain in critical status before alerting. |
    | `datacenter` | STRING | `"dc1"` | Target Consul datacenter namespace to query. |
    | `slack_channel` | STRING | `"#sre-service-discovery"` | Slack channel destination for service discovery notifications. |

    ## Expected outputs

    - `{{ outputs.scan_critical_service_checks.vars.has_stale_services }}`: Boolean flag indicating if critical service checks were discovered.
    - `{{ outputs.scan_critical_service_checks.vars.stale_count }}`: Total number of service instances currently stuck in critical status.
    - `{{ outputs.scan_critical_service_checks.vars.top_service }}`: Service name of the most prominent failing registration.
    - `{{ outputs.scan_critical_service_checks.vars.top_node }}`: Node hosting the offending failing check.
    - `{{ outputs.scan_critical_service_checks.outputFiles['consul_health_audit.json'] }}`: Structured JSON audit report.

    ## Prerequisites

    - Reachable HashiCorp Consul agent or server endpoint with HTTP API enabled.
    - Incoming Webhook URL configured in your team's Slack workspace.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook endpoint URL with permissions to post messages.

    ## Quick start

    1. Configure `SLACK_WEBHOOK_URL` in your Kestra namespace secrets.
    2. Import this flow YAML into your Kestra workspace.
    3. Update `consul_http_addr` to point to your internal Consul server or agent URL.
    4. Click **Execute** in the UI to run an initial discovery catalog health scan.

    ## Common pitfalls and troubleshooting

    - **Consul ACL Token Requirements**: If Consul operates with ACLs enabled (`acl.enabled = true`), pass the management or operator token via the `X-Consul-Token` HTTP header in requests.
    - **Node vs Service Level Checks**: Consul distinguishes between node-level health checks (e.g., host disk/memory) and service-level checks; deregistering a service does not resolve a failing host-level agent check.

    ## How to extend

    - Add an automated deregistration task invoking `PUT /v1/catalog/deregister` directly after manager approval via `io.kestra.plugin.core.flow.Pause`.
    - Loop across all federated datacenters using `/v1/catalog/datacenters` to enforce multi-region catalog hygiene.
    - Export dead service metrics directly to Prometheus Pushgateway or Datadog custom metrics.

    ## Links

    - Kestra Python Script Documentation: https://kestra.io/plugins/plugin-scripts-python
    - Kestra Slack Plugin Documentation: https://kestra.io/plugins/plugin-notifications
    - HashiCorp Consul Health API Documentation: https://developer.hashicorp.com/consul/api-docs/health
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Infrastructure Automation
    - Day 2 Operations
  ee: false
  demo: false
