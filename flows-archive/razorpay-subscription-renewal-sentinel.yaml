id: razorpay-subscription-renewal-sentinel
namespace: company.team
description: |
  Every morning, read recent subscriptions from the Razorpay API (read-only:
  no subscription is paused, cancelled or charged) and classify recurring
  billing as HEALTHY, PENDING, HALTED or UNREACHABLE. Log quiet runs and
  alert Slack when a renewal charge has failed and Razorpay is retrying,
  and page when retries are exhausted and the subscription has halted, so
  recurring revenue is not lost silently.

inputs:
  - id: subscription_limit
    type: INT
    defaults: 100
    displayName: "Subscription Fetch Limit"
    description: "How many of the most recent subscriptions to read (Razorpay allows up to 100 per call)."

variables:
  api_base: https://api.razorpay.com/v1

triggers:
  - id: morning_check
    type: io.kestra.plugin.core.trigger.Schedule
    description: Check subscriptions every morning at 09:45 IST. Shipped disabled; enable it once the Razorpay key secrets are set and a manual run has been verified.
    cron: "15 4 * * *"
    disabled: true

tasks:
  - id: list_subscriptions
    type: io.kestra.plugin.core.http.Request
    description: Read the most recent subscriptions from the Razorpay Subscriptions API. This is a GET; no subscription is changed or charged.
    uri: "{{ vars.api_base }}/subscriptions?count={{ inputs.subscription_limit }}"
    method: GET
    options:
      auth:
        type: BASIC
        username: "{{ secret('RAZORPAY_KEY_ID') }}"
        password: "{{ secret('RAZORPAY_KEY_SECRET') }}"
      allowFailed: true
      timeout:
        connectTimeout: PT10S
        readIdleTimeout: PT30S
    retry:
      type: constant
      interval: PT10S
      maxAttempts: 3
    allowFailure: true

  - id: summarize_subscriptions
    type: io.kestra.plugin.core.debug.Return
    description: Count subscriptions by status, list the halted and pending ones with their customer and plan, and classify in one jq query. A missing or non-200 response becomes UNREACHABLE instead of looking healthy.
    format: >-
      {{ (outputs.list_subscriptions.code is not defined or outputs.list_subscriptions.code != 200)
      ? '{"status":"UNREACHABLE","total":0,"active":0,"pending":0,"halted":0,"halted_list":"none","pending_list":"none"}'
      : (fromJson(outputs.list_subscriptions.body) | jq('
      (.items // []) as $s
      | [$s[] | select(.status == "halted")] as $h
      | [$s[] | select(.status == "pending")] as $p
      | {total: ($s | length), active: ([$s[] | select(.status == "active")] | length), pending: ($p | length), halted: ($h | length),
      halted_list: (if ($h | length) == 0 then "none" else ([$h[:5][] | (.id + " (customer " + (.customer_id // "?") + ", plan " + (.plan_id // "?") + ")")] | join(", ")) end),
      pending_list: (if ($p | length) == 0 then "none" else ([$p[:5][] | (.id + " (customer " + (.customer_id // "?") + ")")] | join(", ")) end),
      status: (if ($h | length) > 0 then "HALTED" elif ($p | length) > 0 then "PENDING" else "HEALTHY" end)}
      ') | first | toJson) }}

  - id: route_by_subscription_state
    type: io.kestra.plugin.core.flow.Switch
    description: Route to a quiet log when every subscription is renewing, a Slack message when a renewal failed and is being retried, or a Slack page when a subscription has halted or Razorpay could not be read.
    value: "{{ fromJson(outputs.summarize_subscriptions.value).status }}"
    cases:
      "HEALTHY":
        - id: log_healthy
          type: io.kestra.plugin.core.log.Log
          message: "Razorpay subscriptions healthy: {{ fromJson(outputs.summarize_subscriptions.value).active }} active out of {{ fromJson(outputs.summarize_subscriptions.value).total }} checked, none pending or halted."
      "PENDING":
        - id: alert_pending_subscriptions
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: Post a Slack message when at least one subscription is pending, meaning a renewal charge failed and Razorpay is retrying it.
          url: "{{ secret('SLACK_WEBHOOK') }}"
          payload: |
            {
              "text": "Razorpay subscriptions PENDING: {{ fromJson(outputs.summarize_subscriptions.value).pending }} subscription(s) had a failed renewal charge and Razorpay is retrying: {{ fromJson(outputs.summarize_subscriptions.value).pending_list }}. Ask these customers to update their card or UPI mandate before retries run out. Execution {{ execution.id }}."
            }
      "HALTED":
        - id: alert_halted_subscriptions
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: Page Slack when at least one subscription has halted, meaning every retry failed and renewals have stopped.
          url: "{{ secret('SLACK_WEBHOOK') }}"
          payload: |
            {
              "text": "Razorpay subscriptions HALTED: {{ fromJson(outputs.summarize_subscriptions.value).halted }} subscription(s) stopped renewing after all retries failed: {{ fromJson(outputs.summarize_subscriptions.value).halted_list }}. These customers are no longer being charged; contact them today. ({{ fromJson(outputs.summarize_subscriptions.value).pending }} more pending.) Execution {{ execution.id }}."
            }
      "UNREACHABLE":
        - id: alert_unreachable_api
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: Page Slack when the Subscriptions API could not be read, indicating an outage, a network problem or invalid API keys.
          url: "{{ secret('SLACK_WEBHOOK') }}"
          payload: |
            {
              "text": "Razorpay subscription sentinel UNREACHABLE: the Subscriptions API did not return a usable response (HTTP {{ outputs.list_subscriptions.code ?? 'no response' }}). Check the API keys and Razorpay status. Execution {{ execution.id }}."
            }
    defaults:
      - id: log_unclassified
        type: io.kestra.plugin.core.log.Log
        message: "Razorpay subscription sentinel completed with an unexpected classification: {{ outputs.summarize_subscriptions.value }}."

  - id: log_audit_result
    type: io.kestra.plugin.core.log.Log
    description: Record one audit line for every run, whichever branch fired, so the subscription history stays queryable even if Slack delivery fails.
    message: "Razorpay subscription sentinel audit: http={{ outputs.list_subscriptions.code ?? 'n/a' }} summary={{ outputs.summarize_subscriptions.value }} execution={{ execution.id }}."

errors:
  - id: alert_flow_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alert Slack when the sentinel flow itself fails, so a broken check is never mistaken for subscriptions renewing normally.
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "text": "Razorpay subscription sentinel flow {{ flow.id }} FAILED (execution {{ execution.id }}). Subscription renewal status is now unknown; check the task logs and the Razorpay Dashboard."
      }

outputs:
  - id: status
    type: STRING
    value: "{{ fromJson(outputs.summarize_subscriptions.value).status }}"

extend:
  title: "Razorpay Subscription Renewal Sentinel"
  shortDescription: Read recent Razorpay subscriptions every morning and alert Slack when renewal charges fail or a subscription halts after its retries run out.
  metaTitle: Razorpay Subscription Renewal Sentinel for Kestra
  metaDescription: "Read Razorpay subscriptions every morning, change nothing, and alert Slack when renewals fail or a subscription halts after its retries."
  description: |
    Subscription businesses on Razorpay (SaaS plans, memberships, meal plans, coaching) earn every month only if each renewal charge goes through. When a card expires or a UPI mandate is revoked, the charge fails, Razorpay moves the subscription to `pending` and retries, and if every retry fails the subscription becomes `halted` and stops charging. The customer often does not notice and the business finds out at month-end. This blueprint turns a scheduled, read-only call to the Razorpay Subscriptions API into a recurring-revenue gate: `io.kestra.plugin.core.http.Request` reads recent subscriptions, one jq query lists the pending and halted ones, and the result routes to a quiet log or a Slack alert.

    ## How it works

    1. `list_subscriptions` (`io.kestra.plugin.core.http.Request`) calls `GET /v1/subscriptions?count=N` with HTTP basic auth (key ID and key secret). It is a read: nothing is paused, cancelled or charged. Retries cover short network blips, and `allowFailed` plus `allowFailure` keep an API error from aborting the flow so it can be reported instead.
    2. `summarize_subscriptions` (`io.kestra.plugin.core.debug.Return`) first guards for a missing or non-200 response (`UNREACHABLE`). Otherwise one jq query counts subscriptions by `status`, lists up to five `halted` and five `pending` ones with their `customer_id` and `plan_id`, and classifies: any `halted` subscription is `HALTED`, any `pending` one is `PENDING`, otherwise `HEALTHY`.
    3. `route_by_subscription_state` (`io.kestra.plugin.core.flow.Switch`) branches on that classification: `HEALTHY` logs quietly, `PENDING` posts a Slack message, `HALTED` and `UNREACHABLE` page Slack. A `defaults` fallback logs anything unexpected.
    4. `log_audit_result` (`io.kestra.plugin.core.log.Log`) writes one audit line per run with the HTTP status and the full summary.
    5. The flow-level `errors` block pages Slack if the flow itself fails, and the `morning_check` trigger runs at 09:45 IST every day, shipped `disabled: true`.

    ## What you get

    - A daily, read-only recurring-billing check with no custom scripting and no extra plugin to install.
    - A `status` output (`HEALTHY` / `PENDING` / `HALTED` / `UNREACHABLE`) other flows can gate on, for example to send the customer a "please update your payment method" message.
    - Slack messages that list the affected subscriptions and customers, so someone can reach them the same day.
    - An audit line on every run, separate from Slack.

    ## Who it's for

    - Indian SaaS, membership, subscription-box and coaching businesses billing through Razorpay Subscriptions.
    - Finance and customer-success teams who want to save a failing renewal before it becomes churn.
    - Teams that already run their billing data and alerting in Kestra.

    ## Why orchestrate this with Kestra

    Razorpay's webhooks fire per event and its Dashboard shows the list when someone looks. Kestra turns a plain, read-only API call into a scheduled, typed classification with retries, a failure path and an execution history, and the Switch branch is ready to grow into real actions (sending the customer an update link, opening a CRM task) without rewriting the check.

    ## Prerequisites

    - A Razorpay account with Subscriptions enabled. Test mode is free and uses the same API: generate test keys (they start with `rzp_test_`) in the Dashboard under Account & Settings > API Keys.
    - A Slack incoming webhook for the PENDING, HALTED, UNREACHABLE and flow-failure alerts.

    ### Secrets

    - `RAZORPAY_KEY_ID`: the Razorpay API key ID.
    - `RAZORPAY_KEY_SECRET`: the matching key secret.
    - `SLACK_WEBHOOK`: Slack incoming webhook used for every alert branch and the flow-failure alert.

    In Kestra OSS, secrets are supplied as environment variables prefixed `SECRET_` and base64-encoded, for example `SECRET_RAZORPAY_KEY_ID=$(echo -n 'rzp_test_xxxxxxxx' | base64)`, and read back with `{{ secret('RAZORPAY_KEY_ID') }}`. Use the Enterprise secrets backend for encryption at rest and access control.

    ## Quick start

    1. In Razorpay Test Mode, create a plan and a test subscription.
    2. Add `RAZORPAY_KEY_ID`, `RAZORPAY_KEY_SECRET` and `SLACK_WEBHOOK` as secrets.
    3. Run the flow manually and compare the counts in the logs with the Subscriptions page in the Dashboard.
    4. Switch to live keys and enable `morning_check`.

    ## How to extend

    - Page through more than 100 subscriptions with the `skip` parameter.
    - For each halted subscription, fetch the customer with `GET /v1/customers/{id}` and send a payment-update link through your messaging flow.
    - Filter by `plan_id` to watch one product line at a time.
    - Store the halted IDs in a KV store and alert only on newly halted subscriptions.

    ## Inputs

    - `subscription_limit`: type INT, default `100` (Razorpay's maximum per call).

    ## Outputs

    - `status`: one of `HEALTHY`, `PENDING`, `HALTED`, `UNREACHABLE`.
    - Example path: `{{ fromJson(outputs.summarize_subscriptions.value).halted_list }}` for the halted subscriptions.

    ## Links

    - [Razorpay Subscriptions API: fetch all subscriptions](https://razorpay.com/docs/api/payments/subscriptions/fetch-subscriptions)
    - [Razorpay API authentication](https://razorpay.com/docs/api/authentication/)
    - [Kestra HTTP Request task](https://kestra.io/plugins/core/tasks/http/io.kestra.plugin.core.http.request)
    - [Kestra Slack plugin](https://kestra.io/plugins/plugin-slack)

    ## Pitfalls

    - Only the most recent `subscription_limit` subscriptions are read; a business with more than 100 needs paging with `skip`, or older halted ones are missed.
    - A halted subscription stays halted until it is resumed or cancelled, so it is reported on every run; use a KV store to alert only on new ones if that is too noisy.
    - Amounts are not on the subscription itself (they live on the plan), so the alert lists IDs rather than rupees; join with `GET /v1/plans/{id}` to add amounts.
    - This flow only reads; it never pauses, resumes, cancels or charges a subscription.
  tags:
    - Business
    - Data
  subTags:
    - Monitoring & Alerting
  ee: false
  demo: false
