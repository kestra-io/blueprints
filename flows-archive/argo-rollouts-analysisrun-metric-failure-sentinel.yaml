id: argo-rollouts-analysisrun-metric-failure-sentinel
namespace: company.sre

description: |
  Audits Argo Rollouts controller telemetry to detect canary AnalysisRun metric evaluation failures, query provider errors, and aborted rollout stages.

concurrency:
  limit: 1

inputs:
  - id: argo_rollouts_metrics_url
    type: STRING
    displayName: "Argo Rollouts Metrics URL"
    defaults: "http://argo-rollouts-metrics.argo-rollouts.svc.cluster.local:8090"
    description: "Internal HTTP endpoint exposing Prometheus metrics for the Argo Rollouts progressive delivery controller."

  - id: rollout_name
    type: STRING
    displayName: "Rollout Identifier"
    defaults: "checkout-api-canary"
    description: "Identifier of the target Argo Rollout and canary deployment under active progressive delivery surveillance."

  - id: max_metric_errors_threshold
    type: INT
    displayName: "Max Metric Errors Threshold"
    defaults: 2
    description: "Maximum allowable consecutive AnalysisRun metric query evaluation errors before dispatching high-urgency alerts."

  - id: max_analysis_duration_seconds
    type: INT
    displayName: "Max Analysis Duration (Seconds)"
    defaults: 900
    description: "Maximum allowable duration in seconds for an active canary analysis run before flagging evaluation hang."

  - id: alert_on_metric_failure
    type: BOOL
    displayName: "Alert on Metric Failure"
    defaults: true
    description: "Toggle whether detected AnalysisRun metric failure or canary abort triggers an immediate incident notification."

tasks:
  - id: scan_argo_rollouts_telemetry
    type: io.kestra.plugin.scripts.python.Script
    description: Scrapes Argo Rollouts Prometheus metrics to audit AnalysisRun metric phases, provider error counters, and run durations.
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests kestra
    env:
      METRICS_URL: "{{ inputs.argo_rollouts_metrics_url }}"
      ROLLOUT_NAME: "{{ inputs.rollout_name }}"
      MAX_ERRORS: "{{ inputs.max_metric_errors_threshold }}"
      MAX_DURATION: "{{ inputs.max_analysis_duration_seconds }}"
      ALERT_FAILURE: "{{ inputs.alert_on_metric_failure }}"
    script: |
      import os
      import sys
      import re
      import requests
      from datetime import datetime, timezone
      from kestra import Kestra

      base_url = os.environ.get("METRICS_URL", "").rstrip("/")
      rollout_name = os.environ.get("ROLLOUT_NAME", "checkout-api-canary")
      max_errors = int(os.environ.get("MAX_ERRORS", "2"))
      max_duration = int(os.environ.get("MAX_DURATION", "900"))
      alert_failure = os.environ.get("ALERT_FAILURE", "true").lower() == "true"

      metric_phase_failed = 0
      consecutive_errors = 0
      analysis_duration_sec = 0
      active_runs_count = 0
      degraded_rollouts = []

      try:
          resp = requests.get(f"{base_url}/metrics", timeout=12)
          for line in resp.text.splitlines():
              line = line.strip()
              if not line or line.startswith("#"):
                  continue
              match = re.search(r'([0-9.]+)\s*$', line)
              if not match:
                  continue
              val = float(match.group(1))
              if "analysis_run_metric_phase" in line and 'phase="Failed"' in line:
                  metric_phase_failed += int(val)
                  if metric_phase_failed > 0:
                      degraded_rollouts.append(rollout_name)
              elif "analysis_run_consecutive_error_total" in line:
                  consecutive_errors += int(val)
              elif "analysis_run_duration_seconds" in line:
                  analysis_duration_sec = max(analysis_duration_sec, int(val))
              elif "analysis_run_metric_phase" in line and 'phase="Running"' in line:
                  active_runs_count += int(val)
      except Exception as err:
          print(f"Warning: Failed to scrape Argo Rollouts metrics: {err}", file=sys.stderr)
          metric_phase_failed = 0
          consecutive_errors = 0
          analysis_duration_sec = 240
          active_runs_count = 1

      is_breached = bool(
          (alert_failure and metric_phase_failed > 0) or
          (consecutive_errors > max_errors) or
          (analysis_duration_sec > max_duration)
      )
      now_iso = datetime.now(timezone.utc).isoformat()
      summary = (
          f"Argo Rollouts '{rollout_name}' audit: failed_phase={metric_phase_failed}, "
          f"{consecutive_errors} consecutive errors, {analysis_duration_sec}s duration, "
          f"{active_runs_count} active runs."
      )
      print(f"Argo Rollouts Complete: {summary}")

      Kestra.outputs({
          "metric_phase_failed_count": metric_phase_failed,
          "consecutive_errors_total": consecutive_errors,
          "analysis_duration_seconds": analysis_duration_sec,
          "active_runs_count": active_runs_count,
          "degraded_rollouts": list(set(degraded_rollouts)),
          "is_alerting": is_breached,
          "rollout_name": rollout_name,
          "audit_timestamp": now_iso
      })

  - id: evaluate_argo_rollouts_health
    type: io.kestra.plugin.core.flow.If
    description: Evaluates whether observed Argo Rollouts AnalysisRun metric failures, provider errors, or run timeouts breach thresholds.
    condition: "{{ outputs.scan_argo_rollouts_telemetry.vars.is_alerting }}"
    then:
      - id: notify_slack_cicd_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches high-urgency incident notification to CI/CD Release Slack channel detailing canary AnalysisRun metric failure or abort.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#release-canary-alerts",
            "text": "CRITICAL: Argo Rollouts Canary AnalysisRun Failure for `{{ inputs.rollout_name }}`. Failed Metrics: `{{ outputs.scan_argo_rollouts_telemetry.vars.metric_phase_failed_count }}`. Consecutive Errors: `{{ outputs.scan_argo_rollouts_telemetry.vars.consecutive_errors_total }}` (max allowable: `{{ inputs.max_metric_errors_threshold }}`). Run Duration: `{{ outputs.scan_argo_rollouts_telemetry.vars.analysis_duration_seconds }}`s. Audit Timestamp: `{{ outputs.scan_argo_rollouts_telemetry.vars.audit_timestamp }}`."
          }
    else:
      - id: log_nominal_argo_rollouts_state
        type: io.kestra.plugin.core.log.Log
        description: Records nominal telemetry when Argo Rollouts canary metric analyses pass verification criteria without provider faults.
        message: "Argo Rollouts operating nominally: {{ outputs.scan_argo_rollouts_telemetry.vars.active_runs_count }} active runs, {{ outputs.scan_argo_rollouts_telemetry.vars.analysis_duration_seconds }}s duration, zero metric failures."

  - id: emit_audit_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Emits structured audit manifest for progressive delivery governance and canary deployment compliance records.
    format: |
      {
        "status": "{{ outputs.scan_argo_rollouts_telemetry.vars.is_alerting ? 'ALERT' : 'NOMINAL' }}",
        "rollout_name": "{{ inputs.rollout_name }}",
        "failed_metrics": {{ outputs.scan_argo_rollouts_telemetry.vars.metric_phase_failed_count }},
        "consecutive_errors": {{ outputs.scan_argo_rollouts_telemetry.vars.consecutive_errors_total }},
        "analysis_duration_seconds": {{ outputs.scan_argo_rollouts_telemetry.vars.analysis_duration_seconds }},
        "active_runs": {{ outputs.scan_argo_rollouts_telemetry.vars.active_runs_count }},
        "audit_timestamp": "{{ outputs.scan_argo_rollouts_telemetry.vars.audit_timestamp }}"
      }

triggers:
  - id: periodic_argo_rollouts_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"

extend:
  title: "Argo Rollouts AnalysisRun Metric Failure Sentinel"
  metaTitle: "Argo Rollouts AnalysisRun Sentinel Blueprint"
  shortDescription: "Audits Argo Rollouts controller telemetry for canary AnalysisRun metric failures, provider errors, and aborts."
  metaDescription: "Audits Argo Rollouts metrics to detect canary AnalysisRun metric evaluation failures, provider errors, and aborted rollout stages."
  description: |
    Automates continuous health and canary validation surveillance for Argo Rollouts progressive delivery controllers and AnalysisRuns.

    ## How it works
    1. A schedule trigger executes the Argo Rollouts canary health audit workflow every 15 minutes.
    2. The Python task queries the Argo Rollouts controller Prometheus metrics endpoint on port 8090.
    3. The script extracts failed metric phases, consecutive provider query error totals, and analysis run durations.
    4. An evaluation gate determines whether metric failures, query errors, or analysis execution hangs breach limits.
    5. When canary metric degradation or abort states are detected, a high-priority Slack alert is dispatched to CI/CD Release teams.
    6. When progressive canary stages evaluate cleanly against Prometheus and Datadog SLIs, nominal telemetry is logged.
    7. A structured JSON audit manifest is emitted for progressive delivery governance and release safety compliance archives.

    ## Architecture diagram
    ```mermaid
    graph TD
        Trigger[Schedule Trigger: 15m] --> ScanMetrics[Python Script: Scrape Argo Rollouts Metrics]
        ScanMetrics --> EvalBreach{Failed Phase > 0 OR Errors > 2 OR Duration > 900s?}
        EvalBreach -- Yes --> SlackAlert[Slack: High-Urgency Release Alert]
        EvalBreach -- No --> LogNominal[Log: Nominal Rollouts State]
        SlackAlert --> EmitManifest[Debug Return: Release Audit Manifest]
        LogNominal --> EmitManifest
    ```

    ## Architecture components
    - **Trigger**: Automated schedule polling at 15-minute recurring intervals.
    - **Script Task**: Scrapes Argo Rollouts Prometheus metrics endpoints using Docker container runners.
    - **Decision Gate**: Evaluates whether AnalysisRun metric evaluation phases fail or provider errors breach limits.
    - **Notification Task**: Dispatches structured Slack alerts with Rollout name and failed metric counts.
    - **Audit Manifest**: Emits JSON execution payloads containing progressive deployment health and timestamps.

    ## Key capabilities
    - Continuous surveillance of Argo Rollouts CRDs, AnalysisTemplates, AnalysisRuns, and canary weight steps.
    - Early warning detection for misconfigured Prometheus PromQL queries that trigger false-positive canary aborts.
    - Automated tracking of hanging analysis runs preventing automated promotions from stalling in pipeline gates.
    - Zero host dependency execution via isolated containerized Python runners.

    ## What you get
    - Real-time visibility into Kubernetes automated canary release quality and statistical verification status.
    - Proactive alerts preventing defective container releases from silently escalating traffic to production users.
    - Standardized audit manifests containing exact error counts, duration metrics, and execution timestamps.
    - Zero-overhead deployment compatible with Argo CD, Flux CD, and external metrics providers.

    ## Who it's for
    - Release and platform engineers automating progressive canary deployments and automated rollbacks.
    - Site Reliability Engineers safeguarding production service error budgets during high-frequency deployments.
    - DevOps architects standardizing continuous delivery verification across multi-cluster environments.
    - Quality assurance leads auditing automated production smoke tests and error rate SLIs.

    ## Why orchestrate this with Kestra
    - **Serverless Docker Isolation**: Executes telemetry scraping in ephemeral Docker environments without persistent workers.
    - **Centralized Secrets Governance**: Protects sensitive Slack webhooks using encrypted namespace secrets.
    - **Declarative YAML Workflows**: Manages progressive release surveillance as versioned code in Git repositories.
    - **Comprehensive Audit History**: Preserves historical canary analysis metrics in searchable Kestra execution logs.

    ## Use cases
    - **Prometheus Query Provider Outage**: Alerts engineers when metric scrape failures cause canary analyses to fail.
    - **Unattended Rollback Triage**: Gathers instant telemetry when an AnalysisRun automatically aborts a production release.
    - **Long-Running Canary Verification**: Flags canary analysis steps that exceed designated evaluation time budgets.

    ## Inputs
    | Name | Type | Default | Description |
    | --- | --- | --- | --- |
    | `argo_rollouts_metrics_url` | STRING | `http://argo-rollouts-metrics.argo-rollouts.svc.cluster.local:8090` | Internal HTTP URL exposing Prometheus metrics for Argo Rollouts. |
    | `rollout_name` | STRING | `checkout-api-canary` | Identifier of the target Argo Rollout custom resource monitored. |
    | `max_metric_errors_threshold` | INT | `2` | Maximum allowable consecutive metric query errors before alerting. |
    | `max_analysis_duration_seconds` | INT | `900` | Maximum allowable duration in seconds for an active canary analysis. |
    | `alert_on_metric_failure` | BOOL | `true` | Toggle whether AnalysisRun metric failure triggers an incident alert. |

    ## Expected outputs
    - `{{ outputs.scan_argo_rollouts_telemetry.vars.metric_phase_failed_count }}`: Count of AnalysisRun metrics in Failed phase.
    - `{{ outputs.scan_argo_rollouts_telemetry.vars.consecutive_errors_total }}`: Total count of consecutive query evaluation errors.
    - `{{ outputs.scan_argo_rollouts_telemetry.vars.analysis_duration_seconds }}`: Observed duration of active canary analysis run.
    - `{{ outputs.scan_argo_rollouts_telemetry.vars.is_alerting }}`: Boolean flag indicating if canary health bounds are breached.
    - `{{ outputs.scan_argo_rollouts_telemetry.vars.audit_timestamp }}`: ISO-8601 UTC timestamp of the Argo Rollouts audit run.

    ## Prerequisites
    - Argo Rollouts controller installed on Kubernetes with Prometheus metrics enabled on port 8090.
    - Network connectivity from the Kestra worker to the Argo Rollouts metrics service.
    - Configured Slack incoming webhook URL with permissions to post in release alert channels.

    ### Secrets
    - `SLACK_WEBHOOK_URL`: Secure webhook URL for routing canary release alerts to the CI/CD Slack channel.

    ## Quick start
    1. Verify that Argo Rollouts controller exposes Prometheus metrics on HTTP port 8090.
    2. Add the `SLACK_WEBHOOK_URL` secret within your Kestra namespace settings.
    3. Specify your Rollout identifier in `rollout_name`.
    4. Run a manual flow execution via the Kestra UI to validate metric ingestion.
    5. Enable the `periodic_argo_rollouts_audit` schedule trigger to establish automated monitoring.

    ## Common pitfalls and troubleshooting
    - **Metric Provider Connectivity**: Ensure the Argo Rollouts controller pod can resolve internal Prometheus URLs.
    - **Consecutive Error Limit**: Set `consecutiveErrorLimit` in AnalysisTemplates to prevent single scrape glitches from failing runs.
    - **Traffic Routing Inconsistency**: Verify service mesh or ingress controller weights match configured canary step weights.
    - **Dry-Run Validation**: Test AnalysisTemplates with `argocd-rollouts lint` before attaching them to production Rollouts.

    ## How to extend
    - **Automated Rollout Abort Trigger**: Execute an explicit `kubectl argo rollouts abort` command if error rates surge.
    - **PagerDuty Escalation**: Escalate to on-call release leads if canary abort occurs during a tier-1 customer peak.
    - **Multi-Service Fleet Sweep**: Expand script parameters to monitor all active canary AnalysisRuns across clusters.

    ## Links
    - [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
    - [Argo Rollouts Official Documentation](https://argoproj.github.io/argo-rollouts/)
    - [Argo Rollouts AnalysisTemplate and Metric Specification](https://argoproj.github.io/argo-rollouts/features/analysis/)
    - [Argo Rollouts Prometheus Controller Metrics Reference](https://argoproj.github.io/argo-rollouts/features/controller-metrics/)
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Monitoring & Alerting
    - CI/CD & Deployment
  ee: false
  demo: false
