id: redis-slowlog-commands-surge-sentinel
namespace: company.database

inputs:
  - id: redis_host
    type: STRING
    defaults: "redis.internal"
    description: Hostname of Redis instance.
  - id: redis_port
    type: INT
    defaults: 6379
    description: Redis port.
  - id: slowlog_len_threshold
    type: INT
    defaults: 10
    description: "Maximum allowable slowlog entries in recent window before alerting (default 10)."

tasks:
  - id: query_slowlog
    type: io.kestra.plugin.scripts.shell.Commands
    commands:
      - |
        # Run SLOWLOG LEN to check count of logged slow operations
        SLOW_COUNT=$(redis-cli -h "{{ inputs.redis_host }}" -p {{ inputs.redis_port }} -a "{{ secret('REDIS_PASSWORD') }}" SLOWLOG LEN | tr -d '[:space:]')
        
        echo "::set-output name=slow_count::${SLOW_COUNT:-0}::"

  - id: evaluate_slow_commands
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.query_slowlog.vars.slow_count | int > inputs.slowlog_len_threshold }}"
    then:
      - id: notify_cache_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#cache-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 Redis Slowlog Blocking Command Alert",
                "text": "Redis instance at `{{ inputs.redis_host }}` recorded *{{ outputs.query_slowlog.vars.slow_count }} slow commands* in its SLOWLOG! Operations exceeding `slowlog-log-slower-than` (e.g. KEYS, HGETALL, large SMEMBERS) are blocking the single-threaded event loop.",
                "footer": "Kestra Database Sentinel • Redis"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#cache-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ Redis Slowlog Sentinel Failure",
            "text": "Failed to execute SLOWLOG on Redis instance. Verify password authentication.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  metaDescription: "Audits Redis SLOWLOG for slow command executions exceeding microsecond latency thresholds to prevent single-threaded event loop blocking."
  metaTitle: Redis Slowlog Long-Running Command Surge Sentinel with Kestra
  title: Redis Slowlog Long-Running Command Surge Sentinel
  shortDescription: Audits Redis SLOWLOG for slow command executions exceeding microsecond latency thresholds to prevent single-threaded event loop blocking.
  description: |
    ## How it works
    This workflow connects to Redis via `redis-cli` and queries the internal `SLOWLOG LEN` buffer. Because Redis executes client commands in a single-threaded event loop, long-running $O(N)$ operations (such as `KEYS *`, `HGETALL` on massive hashes, or `SMEMBERS` on sets with millions of members) completely block all other concurrent client connections. This workflow audits the length of the slow command backlog and dispatches alerts before event loop stalls cascade into widespread application HTTP 504 timeouts.

    ## What you get
    - Real-time detection of blocking queries in Redis single-threaded event loops.
    - Prevents cascading API timeouts and client connection drops.
    - Clear quantitative tracking of slowlog entry counts.

    ## Who it's for
    - Redis Cache Administrators and Backend Software Engineers.
    - SREs maintaining high-throughput caching and in-memory session layers.

    ## Why orchestrate this with Kestra
    - **Continuous Event Loop Auditing**: Checks Redis internal slow logs on an automated cadence.
    - **Secure Authentication**: Uses Kestra secrets for Redis password credentials.
    - **Fast Remediation Dispatch**: Delivers diagnostic notifications directly to on-call cache channels.

    ## Prerequisites
    - Redis instance with `slowlog-log-slower-than` configured (e.g. 10000 microseconds = 10ms).
    - Secrets `REDIS_PASSWORD` and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import the blueprint.
    2. Input Redis host, port, and slowlog threshold.
    3. Run the workflow to inspect current slowlog counts.

    ## How to extend
    - Fetch the latest 5 offending command signatures via `SLOWLOG GET 5` and include them in the Slack alert.
    - Reset the slowlog buffer via `SLOWLOG RESET` once audited.

    ## Links
    - [Redis SLOWLOG Command Reference](https://redis.io/docs/latest/commands/slowlog/)
    - [Kestra Documentation](https://kestra.io/docs)
  tags:
    - Data
    - Infrastructure
  subTags:
    - ELT & Data Landing
    - Day 2 Operations
  ee: false
  demo: false
