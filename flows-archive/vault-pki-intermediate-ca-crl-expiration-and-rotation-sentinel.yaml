    - [Vault PKI API Reference and CRL Configuration Guidelines](https://developer.hashicorp.com/vault/api-docs/secret/pki)
    - [Best Practices for Managing Intermediate CAs and Certificate Revocation Lists](https://developer.hashicorp.com/vault/tutorials/secrets-management/pki-engine)
