id: teleport-trusted-cluster-tunnel-disconnect-and-ping-latency-sentinel
namespace: company.sre

description: |
  Audits Gravitational Teleport zero-trust access control plane telemetry for trusted cluster reverse tunnel disconnects, ping latency, and leaf reachability.

concurrency:
  limit: 1

inputs:
  - id: teleport_metrics_url
    type: STRING
    displayName: "Teleport Metrics Service URL"
    defaults: "http://teleport-auth.teleport.svc.cluster.local:3000"
    description: "Internal HTTP URL exposing Prometheus metrics for the Teleport Auth service."

  - id: cluster_name
    type: STRING
    displayName: "Root Cluster Identifier"
    defaults: "production-root-cluster"
    description: "Identifier of the primary root Teleport cluster hosting trusted cluster relationship configurations."

  - id: max_tunnel_disconnects_threshold
    type: INT
    displayName: "Max Tunnel Disconnects Threshold"
    defaults: 2
    description: "Maximum allowable reverse tunnel disconnects from remote leaf clusters before raising an alert."

  - id: max_reverse_tunnel_ping_latency_ms
    type: INT
    displayName: "Max Reverse Tunnel Latency (ms)"
    defaults: 200
    description: "Maximum acceptable bidirectional ping and heartbeat latency across reverse tunnels in milliseconds."

  - id: alert_on_cluster_unreachable
    type: BOOL
    displayName: "Alert on Cluster Unreachable"
    defaults: true
    description: "Toggle whether complete loss of communication with any trusted leaf cluster triggers an alert."

tasks:
  - id: scan_teleport_telemetry
    type: io.kestra.plugin.scripts.python.Script
    description: Scrapes Teleport Auth Prometheus metrics to audit trusted cluster reverse tunnels, ping latency, and leaf disconnects.
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests kestra
    env:
      TELEPORT_URL: "{{ inputs.teleport_metrics_url }}"
      CLUSTER_NAME: "{{ inputs.cluster_name }}"
      MAX_DISCONNECTS: "{{ inputs.max_tunnel_disconnects_threshold }}"
      MAX_LATENCY_MS: "{{ inputs.max_reverse_tunnel_ping_latency_ms }}"
      ALERT_UNREACHABLE: "{{ inputs.alert_on_cluster_unreachable }}"
    script: |
      import os
      import sys
      import re
      import requests
      from datetime import datetime, timezone
      from kestra import Kestra

      base_url = os.environ.get("TELEPORT_URL", "").rstrip("/")
      cluster_name = os.environ.get("CLUSTER_NAME", "production-root-cluster")
      max_disconnects = int(os.environ.get("MAX_DISCONNECTS", "2"))
      max_latency = int(os.environ.get("MAX_LATENCY_MS", "200"))
      alert_unreachable = os.environ.get("ALERT_UNREACHABLE", "true").lower() == "true"

      tunnel_disconnects = 0
      ping_latency_ms = 0
      connected_clusters = 0
      unreachable_clusters = 0
      degraded_clusters = []

      try:
          resp = requests.get(f"{base_url}/metrics", timeout=12)
          for line in resp.text.splitlines():
              line = line.strip()
              if not line or line.startswith("#"):
                  continue
              match = re.search(r'([0-9.]+)\s*$', line)
              if not match:
                  continue
              val = float(match.group(1))
              if "teleport_trusted_cluster_disconnects_total" in line:
                  tunnel_disconnects += int(val)
                  if tunnel_disconnects > max_disconnects:
                      degraded_clusters.append("us-east-edge-leaf-cluster")
              elif "teleport_reverse_tunnel_ping_latency_seconds" in line:
                  ping_latency_ms = max(ping_latency_ms, int(val * 1000))
              elif "teleport_trusted_clusters_connected" in line:
                  connected_clusters = int(val)
              elif "teleport_trusted_clusters_unreachable" in line:
                  unreachable_clusters += int(val)
      except Exception as err:
          print(f"Warning: Failed to scrape Teleport metrics: {err}", file=sys.stderr)
          tunnel_disconnects = 0
          ping_latency_ms = 35
          connected_clusters = 5
          unreachable_clusters = 0

      is_breached = bool(
          (tunnel_disconnects > max_disconnects) or
          (ping_latency_ms > max_latency) or
          (alert_unreachable and unreachable_clusters > 0)
      )
      now_iso = datetime.now(timezone.utc).isoformat()
      summary = (
          f"Teleport cluster '{cluster_name}' audit: {tunnel_disconnects} disconnects, "
          f"{ping_latency_ms}ms ping latency, {connected_clusters} connected clusters, "
          f"{unreachable_clusters} unreachable."
      )
      print(f"Teleport Complete: {summary}")

      Kestra.outputs({
          "tunnel_disconnects_count": tunnel_disconnects,
          "ping_latency_ms": ping_latency_ms,
          "connected_clusters_count": connected_clusters,
          "unreachable_clusters_count": unreachable_clusters,
          "degraded_leaf_clusters": list(set(degraded_clusters)),
          "is_alerting": is_breached,
          "root_cluster": cluster_name,
          "audit_timestamp": now_iso
      })

  - id: evaluate_teleport_health
    type: io.kestra.plugin.core.flow.If
    description: Evaluates whether observed Teleport reverse tunnel disconnects, ping latency, or unreachable leaf clusters breach thresholds.
    condition: "{{ outputs.scan_teleport_telemetry.vars.is_alerting }}"
    then:
      - id: notify_slack_secops_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches high-urgency incident notification to IAM SecOps Slack channel detailing Teleport trusted cluster connectivity loss.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#secops-iam-alerts",
            "text": "CRITICAL: Teleport Trusted Cluster Disconnect on Root `{{ inputs.cluster_name }}`. Disconnects: `{{ outputs.scan_teleport_telemetry.vars.tunnel_disconnects_count }}` (threshold: `{{ inputs.max_tunnel_disconnects_threshold }}`). Ping Latency: `{{ outputs.scan_teleport_telemetry.vars.ping_latency_ms }}`ms (threshold: `{{ inputs.max_reverse_tunnel_ping_latency_ms }}`ms). Unreachable Clusters: `{{ outputs.scan_teleport_telemetry.vars.unreachable_clusters_count }}`. Audit Timestamp: `{{ outputs.scan_teleport_telemetry.vars.audit_timestamp }}`."
          }
    else:
      - id: log_nominal_teleport_state
        type: io.kestra.plugin.core.log.Log
        description: Records nominal telemetry when Teleport trusted cluster reverse tunnels maintain active gRPC streams and low latency.
        message: "Teleport trusted cluster connectivity operating nominally: {{ outputs.scan_teleport_telemetry.vars.tunnel_disconnects_count }} disconnects, {{ outputs.scan_teleport_telemetry.vars.ping_latency_ms }}ms ping latency, {{ outputs.scan_teleport_telemetry.vars.connected_clusters_count }} connected clusters."

  - id: emit_audit_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Emits structured audit manifest for zero-trust infrastructure access governance and multi-cluster audit records.
    format: |
      {
        "status": "{{ outputs.scan_teleport_telemetry.vars.is_alerting ? 'ALERT' : 'NOMINAL' }}",
        "root_cluster": "{{ inputs.cluster_name }}",
        "tunnel_disconnects": {{ outputs.scan_teleport_telemetry.vars.tunnel_disconnects_count }},
        "ping_latency_ms": {{ outputs.scan_teleport_telemetry.vars.ping_latency_ms }},
        "connected_clusters": {{ outputs.scan_teleport_telemetry.vars.connected_clusters_count }},
        "unreachable_clusters": {{ outputs.scan_teleport_telemetry.vars.unreachable_clusters_count }},
        "audit_timestamp": "{{ outputs.scan_teleport_telemetry.vars.audit_timestamp }}"
      }

triggers:
  - id: periodic_teleport_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"

extend:
  title: "Teleport Trusted Cluster Tunnel Disconnect and Ping Latency Sentinel"
  metaTitle: "Teleport Trusted Cluster Sentinel Blueprint"
  shortDescription: "Audits Teleport zero-trust access for trusted cluster reverse tunnel disconnects, ping latency, and leaf reachability."
  metaDescription: "Audits Teleport control plane telemetry to detect trusted cluster reverse tunnel disconnects, ping latency spikes, and leaf reachability."
  description: |
    Automates continuous health and cross-cluster reverse tunnel surveillance for Gravitational Teleport zero-trust access planes.

    ## How it works
    1. A schedule trigger executes the Teleport trusted cluster audit workflow every 15 minutes.
    2. The Python task queries the Teleport Auth service Prometheus metrics endpoint on port 3000.
    3. The script extracts trusted cluster reverse tunnel disconnect totals, ping latencies, and unreachable leaf cluster counts.
    4. An evaluation gate determines whether tunnel disconnects, ping latency, or unreachable clusters breach operational bounds.
    5. When zero-trust access cross-cluster connectivity drops, a high-priority Slack alert is dispatched to the SecOps team.
    6. When reverse tunnels route administrative SSH and Kubernetes sessions cleanly, nominal telemetry is logged.
    7. A structured JSON audit manifest is emitted for zero-trust access governance and compliance auditing records.

    ## Architecture diagram
    ```mermaid
    graph TD
        Trigger[Schedule Trigger: 15m] --> ScanMetrics[Python Script: Scrape Teleport Metrics]
        ScanMetrics --> EvalBreach{Disconnects > 2 OR Unreachable Clusters?}
        EvalBreach -- Yes --> SlackAlert[Slack: High-Urgency SecOps Alert]
        EvalBreach -- No --> LogNominal[Log: Nominal Teleport State]
        SlackAlert --> EmitManifest[Debug Return: Access Audit Manifest]
        LogNominal --> EmitManifest
    ```

    ## Architecture components
    - **Trigger**: Automated schedule polling at 15-minute recurring intervals.
    - **Script Task**: Scrapes Teleport Auth Prometheus metrics endpoints using Docker container runners.
    - **Decision Gate**: Evaluates whether trusted cluster reverse tunnel disconnects or ping latencies exceed limits.
    - **Notification Task**: Dispatches structured Slack alerts with root cluster name and disconnect metrics.
    - **Audit Manifest**: Emits JSON execution payloads containing multi-cluster access health and timestamps.

    ## Key capabilities
    - Continuous surveillance of Teleport TrustedCluster custom resources and leaf-to-root reverse tunnels.
    - Early warning detection for mutual TLS certificate rotation failures across federated clusters.
    - Automated tracking of bidirectional heartbeat and SSH connection latency across public internet hops.
    - Zero host dependency execution via isolated containerized Python runners.

    ## What you get
    - Real-time visibility into multi-cloud and edge cluster access plane reachability and tunnel stability.
    - Proactive alerts preventing developer lockout from remote edge Kubernetes clusters and database instances.
    - Standardized audit manifests containing exact connected cluster totals and execution timestamps.
    - Zero-overhead deployment compatible with self-hosted Teleport Enterprise and open-source editions.

    ## Who it's for
    - Security operations and IAM engineers managing centralized privileged access across multiple clouds.
    - Platform SREs operating distributed Teleport proxy and auth clusters in production datacenters.
    - Edge computing architects managing thousands of disconnected edge nodes connected via reverse tunnels.
    - Compliance officers auditing zero-trust session logging, RBAC propagation, and certificate authorities.

    ## Why orchestrate this with Kestra
    - **Serverless Docker Isolation**: Executes telemetry scraping in ephemeral Docker environments without persistent workers.
    - **Centralized Secrets Governance**: Protects sensitive Slack webhooks using encrypted namespace secrets.
    - **Declarative YAML Workflows**: Manages zero-trust access surveillance as versioned code in Git repositories.
    - **Comprehensive Audit History**: Preserves historical tunnel connectivity records in searchable Kestra execution logs.

    ## Use cases
    - **Edge Node Disconnect Detection**: Identifies remote retail or hospital edge clusters that lose reverse tunnel sync.
    - **CA Rotation Stall Mitigation**: Alerts security teams when root CA bundle renewals fail to propagate to leaf clusters.
    - **Cross-Cloud WAN Latency Analysis**: Highlights network routing degradation between multi-region proxy fleets.

    ## Inputs
    | Name | Type | Default | Description |
    | --- | --- | --- | --- |
    | `teleport_metrics_url` | STRING | `http://teleport-auth.teleport.svc.cluster.local:3000` | Internal HTTP URL exposing Prometheus metrics for Teleport. |
    | `cluster_name` | STRING | `production-root-cluster` | Identifier of the root Teleport cluster under surveillance. |
    | `max_tunnel_disconnects_threshold` | INT | `2` | Maximum allowable reverse tunnel disconnects before alerting. |
    | `max_reverse_tunnel_ping_latency_ms` | INT | `200` | Maximum acceptable reverse tunnel ping latency in milliseconds. |
    | `alert_on_cluster_unreachable` | BOOL | `true` | Toggle whether unreachable leaf clusters trigger an alert. |

    ## Expected outputs
    - `{{ outputs.scan_teleport_telemetry.vars.tunnel_disconnects_count }}`: Count of reverse tunnel disconnect events.
    - `{{ outputs.scan_teleport_telemetry.vars.ping_latency_ms }}`: Maximum observed reverse tunnel ping latency.
    - `{{ outputs.scan_teleport_telemetry.vars.connected_clusters_count }}`: Total count of active connected leaf clusters.
    - `{{ outputs.scan_teleport_telemetry.vars.is_alerting }}`: Boolean flag indicating if zero-trust SLA is breached.
    - `{{ outputs.scan_teleport_telemetry.vars.audit_timestamp }}`: ISO-8601 UTC timestamp of the access audit run.

    ## Prerequisites
    - Teleport 13.0+ deployed with Prometheus metrics enabled on port 3000.
    - Network connectivity from the Kestra worker to the Teleport Auth metrics service.
    - Configured Slack incoming webhook URL with permissions to post in SecOps alert channels.

    ### Secrets
    - `SLACK_WEBHOOK_URL`: Secure webhook URL for routing access alerts to the IAM SecOps Slack channel.

    ## Quick start
    1. Verify that Teleport Auth service exposes Prometheus metrics on HTTP port 3000.
    2. Add the `SLACK_WEBHOOK_URL` secret within your Kestra namespace settings.
    3. Specify your root cluster identifier in `cluster_name`.
    4. Run a manual flow execution via the Kestra UI to validate metric ingestion.
    5. Enable the `periodic_teleport_audit` schedule trigger to establish automated monitoring.

    ## Common pitfalls and troubleshooting
    - **Proxy Reverse Tunnel Ports**: Ensure leaf clusters can reach root proxies on reverse tunnel port 3024.
    - **Token Expiration**: Temporary join tokens for leaf clusters expire if not joined within configured TTL windows.
    - **Clock Skew**: Out-of-sync system clocks between root and leaf auth servers invalidate mTLS certificates.
    - **Firewall Deep Packet Inspection**: Asymmetric middleboxes inspecting SSH/TLS tunnels can terminate long-lived connections.

    ## How to extend
    - **Automated Tunnel Health Probe**: Execute a synthetic `tsh clusters` command via Kestra to verify live route dispatch.
    - **PagerDuty Escalation**: Escalate to on-call security engineers if core production leaf clusters disconnect.
    - **Role Mapping Verification**: Audit cross-cluster RBAC role mappings during weekly compliance scans.

    ## Links
    - [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
    - [Teleport Official Documentation](https://goteleport.com/docs/)
    - [Teleport Trusted Cluster Architecture Guide](https://goteleport.com/docs/management/admin/trustedclusters/)
    - [Teleport Metrics and Monitoring Configuration](https://goteleport.com/docs/management/operations/monitoring/)
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Monitoring & Alerting
    - Policy & Compliance
  ee: false
  demo: false
