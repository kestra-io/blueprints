id: temporal-workflow-stuck-running-timeout-sentinel
namespace: company.orchestration

inputs:
  - id: temporal_address
    type: STRING
    defaults: "temporal.internal:7233"
    description: Host and gRPC frontend port of the Temporal cluster.
  - id: temporal_namespace
    type: STRING
    defaults: "default"
    description: Temporal namespace to audit.
  - id: max_execution_hours
    type: INT
    defaults: 24
    description: "Maximum allowable workflow runtime in hours before triggering alert (default 24)."

tasks:
  - id: query_stuck_workflows
    type: io.kestra.plugin.scripts.shell.Commands
    commands:
      - |
        # Calculate cutoff timestamp in ISO-8601 UTC format
        CUTOFF_TIME=$(python3 -c "from datetime import datetime, timezone, timedelta; print((datetime.now(timezone.utc) - timedelta(hours={{ inputs.max_execution_hours }})).strftime('%Y-%m-%dT%H:%M:%SZ'))")
        
        # Query Temporal CLI for running executions started before cutoff
        temporal workflow list \
          --address "{{ inputs.temporal_address }}" \
          --namespace "{{ inputs.temporal_namespace }}" \
          --query "ExecutionStatus = 'Running' AND StartTime < '$CUTOFF_TIME'" \
          --output json > /tmp/stuck_workflows.json 2>/dev/null || echo "[]" > /tmp/stuck_workflows.json

        python3 -c "
        import json
        try:
            with open('/tmp/stuck_workflows.json') as f:
                data = json.load(f)
            count = len(data) if isinstance(data, list) else 0
            types = ', '.join([item.get('execution', {}).get('workflowId', 'unknown') for item in (data[:5] if isinstance(data, list) else [])])
            print(f'{count}|{types}')
        except Exception:
            print('0|')
        " > /tmp/summary.txt

        STUCK_COUNT=$(cut -d '|' -f 1 /tmp/summary.txt)
        WORKFLOW_SAMPLES=$(cut -d '|' -f 2 /tmp/summary.txt)
        
        echo "::set-output name=stuck_count::${STUCK_COUNT:-0}::"
        echo "::set-output name=workflow_samples::$WORKFLOW_SAMPLES::"

  - id: evaluate_temporal_lag
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.query_stuck_workflows.vars.stuck_count | int > 0 }}"
    then:
      - id: notify_platform_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#orchestration-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 Temporal Long-Running Stuck Workflow Alert",
                "text": "Detected {{ outputs.query_stuck_workflows.vars.stuck_count }} workflow execution(s) in namespace {{ inputs.temporal_namespace }} running longer than {{ inputs.max_execution_hours }} hours. Sample IDs: {{ outputs.query_stuck_workflows.vars.workflow_samples }}",
                "footer": "Kestra Workflow Engine Sentinel • Temporal"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#orchestration-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ Temporal Sentinel Execution Failure",
            "text": "Failed to communicate with Temporal frontend service at {{ inputs.temporal_address }}.",
            "footer": "Kestra Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  metaDescription: "Audits Temporal server namespaces for stalled and stuck workflow executions exceeding runtime thresholds."
  metaTitle: Temporal Long Running Stuck Workflow Execution Timeout Sentinel with Kestra
  ee: false
  demo: false
  title: Temporal Long Running Stuck Workflow Execution Timeout Sentinel
  shortDescription: Audits Temporal server namespaces for stalled and stuck workflow executions exceeding runtime thresholds.
  description: |
    ## How it works
    This workflow connects to a Temporal cluster gRPC frontend (`temporal.internal:7233`) using the native Temporal CLI and executes an Advanced Visibility SQL query: `ExecutionStatus = 'Running' AND StartTime < '<cutoff>'`. When workflows hang due to lost activity worker heartbeats, unhandled activity failures with infinite retry policies, or deadlocks in workflow definition code, they remain in a `Running` state indefinitely. This sentinel detects hung executions and alerts reliability engineers with target workflow IDs before cluster visibility indexes degrade.

    ## What you get
    - Continuous surveillance of Temporal workflow execution runtimes.
    - Identification of zombie executions and activity retry loop deadlocks.
    - Automated Slack incident notifications with sample workflow execution IDs.

    ## Who it's for
    - Distributed systems engineers managing microservice state machines on Temporal.
    - Site Reliability Engineers ensuring task queue worker health.
    - DevOps teams maintaining Temporal frontend and history services.

    ## Why orchestrate this with Kestra
    - **Native Enterprise Scheduling**: Executes periodic scans across production and staging namespaces automatically.
    - **Standardized Visibility**: Consolidates Temporal orchestration health alongside Kafka, database, and Kubernetes sentinels.
    - **Automated Incident Response**: Triggers corrective actions such as workflow termination or worker pool restarts.

    ## Prerequisites
    - Temporal CLI installed or accessible in the execution environment.
    - Network connectivity to Temporal frontend service (`7233`).
    - Incoming Slack Webhook stored as `SLACK_WEBHOOK` secret.

    ## Quick start
    1. Import this blueprint into your Kestra instance.
    2. Define the `SLACK_WEBHOOK` secret in your namespace.
    3. Configure `temporal_address` and target `temporal_namespace`.
    4. Enable the schedule trigger to establish automated temporal visibility monitoring.

    ## How to extend
    - Extend the `If` block with an automated workflow termination task (`temporal workflow terminate`).
    - Audit specific task queues by appending `AND TaskQueue = '...'` to the visibility filter.
    - Send notifications to PagerDuty or Opsgenie for high-priority transaction workflows.

    ## Links
    - [Temporal Advanced Visibility](https://docs.temporal.io/visibility)
    - [Kestra Shell Plugin](https://kestra.io/plugins/plugin-scripts-shell)
    - [Kestra Slack Notifications](https://kestra.io/plugins/plugin-slack)
  tags:
    - Data
    - Infrastructure
  subTags:
    - ELT & Data Landing
    - Day 2 Operations
