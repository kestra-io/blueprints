id: hashicorp-vault-token-accessor-leak-sentinel
namespace: company.security

inputs:
  - id: vault_addr
    type: STRING
    defaults: "http://vault.internal:8200"
    description: Vault server address.
  - id: max_token_count
    type: INT
    defaults: 500
    description: Maximum acceptable count of active token accessors before triggering leak warning.

tasks:
  - id: audit_token_accessors
    type: io.kestra.plugin.scripts.shell.Commands
    containerImage: ghcr.io/kestra-io/tools:latest
    commands:
      - |
        curl -s --header "X-Vault-Token: {{ secret('VAULT_TOKEN') }}"           -X LIST "{{ inputs.vault_addr }}/v1/auth/token/accessors" > /tmp/accessors.json
        
        TOKEN_COUNT=$(jq '.data.keys | length // 0' /tmp/accessors.json)
        
        echo "::set-output name=token_count::$TOKEN_COUNT::"

  - id: evaluate_token_sprawl
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.audit_token_accessors.vars.token_count | int > inputs.max_token_count }}"
    then:
      - id: notify_security_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#sec-ops-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 HashiCorp Vault Orphaned Token Sprawl and Leak Alert",
                "text": "Vault cluster at `{{ inputs.vault_addr }}` has accumulated *{{ outputs.audit_token_accessors.vars.token_count }}* active token accessors (threshold: {{ inputs.max_token_count }}). Impact: CI/CD jobs or application microservices are generating orphaned service tokens without explicit TTLs or revocations, causing storage backend bloat and credential exposure risks.",
                "footer": "Kestra Security Sentinel • Vault Tokens"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#sec-ops-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ Vault Token Sentinel Execution Failed",
            "text": "The Vault token accessor audit query failed. Please verify Vault address, token permissions, and network reachability.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 * * * *"
    disabled: true

extend:
  metaDescription: "Audits HashiCorp Vault token accessors to detect unrevoked orphaned tokens and secret storage backend bloat."
  metaTitle: HashiCorp Vault Token Accessor Sprawl and Storage Leak Sentinel with Kestra
  title: HashiCorp Vault Token Accessor Sprawl and Storage Leak Sentinel
  shortDescription: Audits HashiCorp Vault token accessors to detect unrevoked orphaned tokens and secret storage backend bloat.
  description: |
    ## How it works
    This workflow connects to the HashiCorp Vault HTTP API endpoint `/v1/auth/token/accessors` to audit the total number of active token accessors across the cluster. When automated CI/CD runners, Terraform plans, or applications request Vault tokens without child-token revocation hierarchies or short TTLs, token counts multiply indefinitely. When active accessors exceed the safety threshold, an automated security incident alert is dispatched to Slack.

    ## What you get
    - Proactive detection of leaked or unrevoked authentication tokens.
    - Prevents Consul / Raft storage backend bloat caused by hundreds of thousands of orphaned token entries.
    - Promotes least-privilege security posture and timely token lifecycle expiration.

    ## Who it's for
    - Security Engineers and DevSecOps practitioners managing HashiCorp Vault infrastructure.
    - Platform Engineers responsible for CI/CD pipeline credential hygiene.

    ## Why orchestrate this with Kestra
    - **Automated Cadence**: Audit token counts hourly without maintaining external cron jobs.
    - **Secure Credential Injection**: Protect administrative Vault tokens using Kestra encrypted secrets.
    - **Customizable Thresholds**: Easily configure alert tolerances per Vault cluster tier.

    ## Prerequisites
    - HashiCorp Vault cluster with an administrative token granting `list` on `auth/token/accessors`.
    - Secrets `VAULT_TOKEN` and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import this blueprint into Kestra.
    2. Configure the Vault address and secrets.
    3. Run the workflow to inspect current active token accessors.

    ## How to extend
    - Iterate through token accessors to sample `lookup-accessor` details (e.g. creation time, display name).
    - Automatically revoke expired or orphaned service tokens.

    ## Links
    - [HashiCorp Vault Token API Documentation](https://developer.hashicorp.com/vault/api-docs/auth/token#list-accessors)
    - [Kestra Shell Plugin](https://kestra.io/plugins/plugin-scripts/commands/io.kestra.plugin.scripts.shell.commands)
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Day 2 Operations
    - Infrastructure Automation
  ee: false
  demo: false
