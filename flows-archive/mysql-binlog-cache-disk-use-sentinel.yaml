id: mysql-binlog-cache-disk-use-sentinel
namespace: company.ops

inputs:
  - id: mysql_host
    type: STRING
    defaults: "mysql.internal"
    description: MySQL database hostname or IP address.
  - id: mysql_port
    type: INT
    defaults: 3306
    description: MySQL port.
  - id: mysql_user
    type: STRING
    defaults: "root"
    description: MySQL username.
  - id: max_disk_spills_threshold
    type: INT
    defaults: 10
    description: Maximum acceptable count of binlog transactions written to temporary disk files.

tasks:
  - id: query_binlog_cache_metrics
    type: io.kestra.plugin.scripts.shell.Commands
    containerImage: mysql:8-oracle
    commands:
      - |
        export MYSQL_PWD="{{ secret('MYSQL_PASSWORD') }}"
        
        mysql -h "{{ inputs.mysql_host }}" -P "{{ inputs.mysql_port }}" -u "{{ inputs.mysql_user }}" -N -B -e "SHOW GLOBAL STATUS LIKE 'Binlog_cache_disk_use';" > /tmp/mysql_binlog.txt
        
        cat /tmp/mysql_binlog.txt
        
        DISK_SPILLS=$(awk '{print $2}' /tmp/mysql_binlog.txt)
        DISK_SPILLS=${DISK_SPILLS:-0}
        
        echo "::set-output name=disk_spills::$DISK_SPILLS::"

  - id: evaluate_binlog_spills
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.query_binlog_cache_metrics.vars.disk_spills | int >= inputs.max_disk_spills_threshold }}"
    then:
      - id: notify_dba_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#mysql-alerts",
            "attachments": [
              {
                "color": "warning",
                "title": "⚠️ MySQL Binlog Cache Disk Spill Alert",
                "text": "MySQL server `{{ inputs.mysql_host }}` recorded *{{ outputs.query_binlog_cache_metrics.vars.disk_spills }}* transactions spilling from memory buffer to disk (`Binlog_cache_disk_use`)! Impact: Large multi-row transactions exceed `binlog_cache_size`, creating temporary disk files that degrade commit latency and increase storage wear.",
                "footer": "Kestra Database Sentinel • MySQL"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#mysql-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ MySQL Binary Log Cache Disk Spill Sentinel Pipeline Failure",
            "text": "Failed to query MySQL global status. Check host connection and credentials.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  metaDescription: "Monitors MySQL binlog_cache_disk_use status to detect transaction memory buffer spills to disk."
  metaTitle: MySQL Binary Log Cache Disk Spill Sentinel with Kestra
  title: MySQL Binary Log Cache Disk Spill Sentinel
  shortDescription: Monitors MySQL binlog_cache_disk_use status to detect transaction memory buffer spills to disk.
  description: |
    ## How it works
    This workflow executes `SHOW GLOBAL STATUS LIKE 'Binlog_cache_disk_use'` against the MySQL database. While transactions are in progress, changes are buffered in memory (`binlog_cache_size`). If a large bulk INSERT, UPDATE, or DELETE exceeds this buffer, MySQL must write transaction statements to a temporary disk file. Frequent disk spills degrade commit throughput and increase I/O wait times. Slack is alerted when disk spills exceed the threshold.

    ## What you get
    - Real-time detection of transactions spilling binlog memory buffers to disk.
    - Prevents commit latency spikes and disk I/O bottlenecks on transaction-heavy workloads.
    - Identifies when `binlog_cache_size` tuning is required.

    ## Who it's for
    - Database Administrators (DBAs) tuning MySQL memory and transactional performance.
    - SREs maintaining high-throughput OLTP databases.

    ## Why orchestrate this with Kestra
    - **Native CLI Querying**: Uses official MySQL client in a lightweight container.
    - **Continuous Parameter Auditing**: Provides quantitative evidence for memory buffer optimization.
    - **Direct Alerting**: Immediate Slack notifications keep on-call DBAs informed.

    ## Prerequisites
    - MySQL 5.7 / 8.0 server with binary logging enabled.
    - Secrets `MYSQL_PASSWORD` and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import the blueprint.
    2. Configure MySQL host and credentials.
    3. Run the workflow to inspect binary log cache disk usage.

    ## How to extend
    - Compare with `Binlog_cache_use` to calculate exact disk-spill percentage.
    - Automatically generate recommendations to increase `binlog_cache_size`.

    ## Links
    - [MySQL Binary Log Cache Documentation](https://dev.mysql.com/doc/refman/8.0/en/replication-options-binary-log.html#sysvar_binlog_cache_size)
    - [Kestra Shell Plugin](https://kestra.io/plugins/plugin-scripts/commands/io.kestra.plugin.scripts.shell.commands)
  tags:
    - Data
    - Infrastructure
  subTags:
    - ELT & Data Landing
    - Day 2 Operations
  ee: false
  demo: false
