id: price-volume-mix-variance-analysis
namespace: company.team

description: |
  Monthly budget-versus-actual analysis of revenue and gross margin: decompose the variance into
  volume, mix, price, cost and currency effects by product and region, prove that the effects
  add up exactly to the total variance, rank the drivers, require a written explanation for
  every variance above the flux threshold, and lock the month with the commentary.

inputs:
  - id: month
    type: STRING
    displayName: Month (YYYY-MM)
    defaults: "2026-09"
    validator: ^\d{4}-(0[1-9]|1[0-2])$

  - id: scenario
    type: SELECT
    displayName: Demo scenario
    description: >
      ISSUES adds actual sales of a product with no budget line, a budget line with zero
      volume but revenue, and actuals for a region in a currency without a budget rate, which
      must stop the analysis.
    values:
      - CLEAN
      - ISSUES
    defaults: CLEAN

  - id: flux_threshold
    type: FLOAT
    displayName: Flux threshold (absolute)
    description: Any driver line above this amount needs an explanation in explanations.
    defaults: 15000.0

  - id: flux_threshold_pct
    type: FLOAT
    displayName: Flux threshold (% of budget line)
    defaults: 10.0

  - id: explanations
    type: JSON
    displayName: Explanations
    description: >-
      Commentary for the variances that need one, keyed by product/region/effect,
      for example {"PUMP-X/US/price": "List price increase effective 1 Sept"}.
    defaults: "{}"

variables:
  lock_key: pvm_close
  pack_dir: "variance/{{ inputs.month }}"

concurrency:
  limit: 1

tasks:
  - id: period_control
    type: io.kestra.plugin.core.output.OutputValues
    values:
      closed: "{{ (kv(vars.lock_key, errorOnMissing=false) ?? {'closed': []}) | jq('.closed') | first | toJson }}"

  - id: period_gate
    type: io.kestra.plugin.core.flow.If
    condition: "{{ fromJson(outputs.period_control.values.closed) contains inputs.month }}"
    then:
      - id: period_refused
        type: io.kestra.plugin.core.execution.Fail
        errorMessage: "The {{ inputs.month }} variance analysis is already closed and sent."

  - id: analyse
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: >
      One DuckDB session: budget and actuals by product and region (demo generator or your
      planning and ERP exports), the five effects per line, the proof that they add up, the
      ranking, the flux list against the explanations given, and the commentary.
    outputFiles:
      - lines
      - bridge
      - flux
      - blockers
    fetchType: FETCH_ONE
    sql: |
      SET VARIABLE m = '{{ inputs.month }}';

      -- =======================================================================
      -- Budget: units, price and standard cost per unit in local currency, and
      -- the budget exchange rate. Actuals: the same at the actual rate. Replace
      -- with your plan and your ERP sales and cost of sales by product and region.
      -- =======================================================================
      CREATE TABLE products (product VARCHAR, family VARCHAR, base_price DOUBLE, base_cost DOUBLE);
      INSERT INTO products VALUES
        ('PUMP-X', 'Pumps', 1250, 690), ('PUMP-S', 'Pumps', 640, 410), ('VALVE-H', 'Valves', 310, 150),
        ('VALVE-L', 'Valves', 120, 74), ('SENSOR', 'Controls', 95, 31), ('SERVICE', 'Services', 180, 95);
      CREATE TABLE regions (region VARCHAR, currency VARCHAR, budget_rate DOUBLE, actual_rate DOUBLE);
      INSERT INTO regions VALUES ('EU', 'EUR', 1.0, 1.0), ('US', 'USD', 0.91, 0.8825), ('UK', 'GBP', 1.16, 1.1712);
      {% if inputs.scenario == 'ISSUES' %}
      INSERT INTO regions VALUES ('CH', 'CHF', NULL, 1.06);
      {% endif %}

      CREATE TABLE budget AS
      SELECT p.product, r.region, round(units) AS units, p.base_price * pf AS price, p.base_cost * cf AS cost
      FROM products p, regions r,
           LATERAL (SELECT (80 + (hash(p.product || r.region) % 400)::INT) * CASE r.region WHEN 'EU' THEN 1.6 WHEN 'US' THEN 1.2 ELSE 0.6 END AS units,
                           CASE r.region WHEN 'EU' THEN 1 WHEN 'US' THEN 1.05 ELSE 0.95 END AS pf, CASE r.region WHEN 'EU' THEN 1 ELSE 1.02 END AS cf) x
      WHERE r.budget_rate IS NOT NULL;
      {% if inputs.scenario == 'ISSUES' %}
      UPDATE budget SET units = 0 WHERE product = 'SERVICE' AND region = 'UK';
      {% endif %}

      -- What happened: US pump volumes up, a mix shift from the high-margin valve to the
      -- low one, a price increase on PUMP-X in the US, a steel cost rise on pumps, and
      -- a weaker dollar.
      CREATE TABLE actual AS
      SELECT b.product, b.region,
             round(b.units * CASE WHEN b.product LIKE 'PUMP%' AND b.region = 'US' THEN 1.18 WHEN b.product = 'VALVE-H' THEN 0.78 WHEN b.product = 'VALVE-L' THEN 1.35
                                  ELSE 0.97 + (hash(b.product || b.region || 'a') % 7)::INT / 100.0 END) AS units,
             b.price * CASE WHEN b.product = 'PUMP-X' AND b.region = 'US' THEN 1.06 WHEN b.product = 'SENSOR' THEN 0.95 ELSE 1 END AS price,
             b.cost * CASE WHEN b.product LIKE 'PUMP%' THEN 1.08 ELSE 1 END AS cost
      FROM budget b
      {% if inputs.scenario == 'ISSUES' %}
      UNION ALL SELECT 'PUMP-Z', 'EU', 40, 1900, 1100
      UNION ALL SELECT 'PUMP-X', 'CH', 30, 1300, 720
      {% endif %};

      -- =======================================================================
      -- Lines in group currency (EUR). The line's unit change is valued at budget
      -- price, margin and rate; price and cost changes on actual units at budget
      -- rate; the currency effect on actual local amounts. The unit change is then
      -- split into volume (every line growing at the total unit growth rate) and
      -- mix (the rest), so volume + mix is exactly the line's unit effect.
      -- =======================================================================
      CREATE TABLE l AS
      SELECT coalesce(a.product, b.product) AS product, coalesce(a.region, b.region) AS region,
             coalesce(b.units, 0) AS bu, b.price AS bp, b.cost AS bc, coalesce(a.units, 0) AS au, a.price AS ap, a.cost AS ac,
             r.budget_rate AS br, r.actual_rate AS ar
      FROM actual a FULL JOIN budget b USING (product, region) LEFT JOIN regions r ON r.region = coalesce(a.region, b.region);

      CREATE TABLE blockers AS
      SELECT 'NO_BUDGET_LINE' AS code, product || '/' || region AS ref, 'Actual sales of ' || au || ' units with no budget' AS detail FROM l WHERE bp IS NULL AND au > 0 AND br IS NOT NULL
      UNION ALL SELECT 'NO_BUDGET_RATE', product || '/' || region, 'No budget rate for the region currency' FROM l WHERE br IS NULL
      UNION ALL SELECT 'BUDGET_WITHOUT_VOLUME', product || '/' || region, 'Budget line with zero units' FROM l WHERE bu = 0 AND bp IS NOT NULL;

      CREATE TABLE ok AS SELECT * FROM l WHERE bp IS NOT NULL AND br IS NOT NULL AND bu > 0;
      CREATE TABLE avg_budget AS SELECT sum(bu * bp * br) / sum(bu) AS avg_price, sum(bu * (bp - bc) * br) / sum(bu) AS avg_margin,
                                        sum(bu) AS total_bu, (SELECT sum(au) FROM ok) AS total_au FROM ok;

      CREATE TABLE lines AS
      SELECT o.product, p.family, o.region, o.bu, o.au,
             o.bu * o.bp * o.br AS budget_revenue, o.au * o.ap * o.ar AS actual_revenue,
             o.bu * (o.bp - o.bc) * o.br AS budget_margin, o.au * (o.ap - o.ac) * o.ar AS actual_margin,
             -- Revenue effects.
             (o.au - o.bu) * o.bp * o.br AS rev_volume_mix,
             o.au * (o.ap - o.bp) * o.br AS rev_price,
             o.au * o.ap * (o.ar - o.br) AS rev_currency,
             -- Margin effects: volume and mix at budget unit margin, price, cost, currency.
             o.au * (o.bp - o.bc) * o.br - o.bu * (o.bp - o.bc) * o.br AS gm_volume_mix_line,
             o.au * (o.ap - o.bp) * o.br AS gm_price,
             -o.au * (o.ac - o.bc) * o.br AS gm_cost,
             o.au * (o.ap - o.ac) * (o.ar - o.br) AS gm_currency
      FROM ok o JOIN products p USING (product);
      -- Split the line volume effect into its volume part (the line's budget share of
      -- the total unit change at budget average values) and its mix part (the rest).
      ALTER TABLE lines ADD COLUMN rev_volume DOUBLE; ALTER TABLE lines ADD COLUMN rev_mix DOUBLE;
      ALTER TABLE lines ADD COLUMN gm_volume DOUBLE; ALTER TABLE lines ADD COLUMN gm_mix DOUBLE;
      UPDATE lines SET rev_volume = bu * ((SELECT total_au FROM avg_budget) / (SELECT total_bu FROM avg_budget) - 1) * budget_revenue / bu,
                       gm_volume = bu * ((SELECT total_au FROM avg_budget) / (SELECT total_bu FROM avg_budget) - 1) * budget_margin / bu;
      UPDATE lines SET rev_mix = rev_volume_mix - rev_volume, gm_mix = gm_volume_mix_line - gm_volume;

      -- =======================================================================
      -- The bridge, and the proof that the effects add up to the variance.
      -- =======================================================================
      CREATE TABLE bridge AS
      SELECT 'Revenue' AS measure, sum(budget_revenue) AS budget, sum(rev_volume) AS volume, sum(rev_mix) AS mix, sum(rev_price) AS price,
             0.0 AS cost, sum(rev_currency) AS currency, sum(actual_revenue) AS actual FROM lines
      UNION ALL
      SELECT 'Gross margin', sum(budget_margin), sum(gm_volume), sum(gm_mix), sum(gm_price), sum(gm_cost), sum(gm_currency), sum(actual_margin) FROM lines;
      INSERT INTO blockers
      SELECT 'EFFECTS_DO_NOT_ADD_UP', measure, 'Budget + effects = ' || round(budget + volume + mix + price + cost + currency, 2) || ', actual ' || round(actual, 2)
      FROM bridge WHERE abs(budget + volume + mix + price + cost + currency - actual) >= 0.01;

      -- =======================================================================
      -- Flux: every product/region effect above both thresholds needs an
      -- explanation. Margin effects are the ones explained, revenue follows.
      -- =======================================================================
      CREATE TABLE effects AS
      SELECT product, region, family, effect, amount, budget_margin FROM lines,
        LATERAL (VALUES ('volume', gm_volume), ('mix', gm_mix), ('price', gm_price), ('cost', gm_cost), ('currency', gm_currency)) e(effect, amount);
      CREATE TABLE given AS SELECT key, value::VARCHAR AS text FROM json_each('{{ inputs.explanations | toJson }}');
      CREATE TABLE flux AS
      SELECT e.product || '/' || e.region || '/' || e.effect AS key, e.family, round(e.amount, 2) AS amount,
             round(100 * e.amount / nullif(e.budget_margin, 0), 1) AS pct_of_budget_margin,
             trim(g.text, '"') AS explanation
      FROM effects e LEFT JOIN given g ON g.key = e.product || '/' || e.region || '/' || e.effect
      WHERE abs(e.amount) >= {{ inputs.flux_threshold }} AND abs(e.amount) >= {{ inputs.flux_threshold_pct }} / 100 * abs(e.budget_margin)
      ORDER BY abs(e.amount) DESC;

      COPY (SELECT product, family, region, bu AS budget_units, au AS actual_units, round(budget_revenue, 2) AS budget_revenue, round(actual_revenue, 2) AS actual_revenue,
                   round(rev_volume, 2) AS rev_volume, round(rev_mix, 2) AS rev_mix, round(rev_price, 2) AS rev_price, round(rev_currency, 2) AS rev_currency,
                   round(budget_margin, 2) AS budget_margin, round(actual_margin, 2) AS actual_margin, round(gm_volume, 2) AS gm_volume, round(gm_mix, 2) AS gm_mix,
                   round(gm_price, 2) AS gm_price, round(gm_cost, 2) AS gm_cost, round(gm_currency, 2) AS gm_currency
            FROM lines ORDER BY product, region) TO '{{ outputFiles.lines }}' (HEADER, DELIMITER ',');
      COPY (SELECT measure, round(budget, 2) AS budget, round(volume, 2) AS volume, round(mix, 2) AS mix, round(price, 2) AS price, round(cost, 2) AS cost,
                   round(currency, 2) AS currency, round(actual, 2) AS actual FROM bridge) TO '{{ outputFiles.bridge }}' (HEADER, DELIMITER ',');
      COPY flux TO '{{ outputFiles.flux }}' (HEADER, DELIMITER ',');
      COPY blockers TO '{{ outputFiles.blockers }}' (HEADER, DELIMITER ',');

      CREATE MACRO k(x) AS CASE WHEN x < 0 THEN '-' ELSE '+' END || format('{:,.0f}', abs(x)::DOUBLE / 1000) || 'k';
      SELECT
        (SELECT measure || ': budget ' || k(budget) || ', volume ' || k(volume) || ', mix ' || k(mix) || ', price ' || k(price)
                || CASE WHEN measure = 'Gross margin' THEN ', cost ' || k(cost) ELSE '' END || ', currency ' || k(currency) || ', actual ' || k(actual)
           FROM bridge WHERE measure = 'Revenue') AS revenue_bridge,
        (SELECT measure || ': budget ' || k(budget) || ', volume ' || k(volume) || ', mix ' || k(mix) || ', price ' || k(price) || ', cost ' || k(cost) || ', currency ' || k(currency) || ', actual ' || k(actual)
           FROM bridge WHERE measure = 'Gross margin') AS margin_bridge,
        (SELECT round(100 * actual / (SELECT actual FROM bridge WHERE measure = 'Revenue'), 1) || '% against ' || round(100 * budget / (SELECT budget FROM bridge WHERE measure = 'Revenue'), 1) || '% budgeted'
           FROM bridge WHERE measure = 'Gross margin') AS margin_rate,
        (SELECT string_agg(key || ' ' || k(amount), ', ' ORDER BY abs(amount) DESC) FROM (SELECT * FROM flux LIMIT 5)) AS top_drivers,
        (SELECT count(*) FROM flux)::INT AS flux_items,
        (SELECT count(*) FROM flux WHERE explanation IS NULL)::INT AS unexplained,
        (SELECT coalesce(string_agg(key || ' (' || k(amount) || ')', ', ' ORDER BY abs(amount) DESC), '') FROM flux WHERE explanation IS NULL) AS unexplained_detail,
        (SELECT count(*) FROM blockers)::INT AS blockers,
        (SELECT coalesce(string_agg(code || ' ' || ref || ': ' || detail, '; ' ORDER BY code, ref), '') FROM blockers) AS blocker_detail,
        '# Gross margin variance, ' || getvariable('m') || chr(10) || chr(10) ||
        '| | Revenue | Gross margin |' || chr(10) || '|---|---:|---:|' || chr(10) ||
        (SELECT string_agg('| ' || label || ' | ' || format('{:,.0f}', r::DOUBLE) || ' | ' || format('{:,.0f}', g::DOUBLE) || ' |', chr(10) ORDER BY ord) FROM (
          SELECT 1 AS ord, 'Budget' AS label, (SELECT budget FROM bridge WHERE measure = 'Revenue') AS r, (SELECT budget FROM bridge WHERE measure = 'Gross margin') AS g
          UNION ALL SELECT 2, 'Volume', (SELECT volume FROM bridge WHERE measure = 'Revenue'), (SELECT volume FROM bridge WHERE measure = 'Gross margin')
          UNION ALL SELECT 3, 'Mix', (SELECT mix FROM bridge WHERE measure = 'Revenue'), (SELECT mix FROM bridge WHERE measure = 'Gross margin')
          UNION ALL SELECT 4, 'Price', (SELECT price FROM bridge WHERE measure = 'Revenue'), (SELECT price FROM bridge WHERE measure = 'Gross margin')
          UNION ALL SELECT 5, 'Cost', 0, (SELECT cost FROM bridge WHERE measure = 'Gross margin')
          UNION ALL SELECT 6, 'Currency', (SELECT currency FROM bridge WHERE measure = 'Revenue'), (SELECT currency FROM bridge WHERE measure = 'Gross margin')
          UNION ALL SELECT 7, '**Actual**', (SELECT actual FROM bridge WHERE measure = 'Revenue'), (SELECT actual FROM bridge WHERE measure = 'Gross margin'))) || chr(10) || chr(10) ||
        '## Main drivers' || chr(10) || chr(10) ||
        coalesce((SELECT string_agg('- **' || key || '** ' || k(amount) || ' (' || coalesce(pct_of_budget_margin || '% of the line''s budget margin', 'new line') || '): ' || coalesce(explanation, '_explanation missing_'), chr(10) ORDER BY abs(amount) DESC) FROM flux), '- No variance above the thresholds.') || chr(10) AS commentary;

  - id: result
    type: io.kestra.plugin.core.output.OutputValues
    values:
      r: "{{ (outputs.analyse.outputs | last).row | toJson }}"

  - id: log_analysis
    type: io.kestra.plugin.core.log.Log
    message: |
      Variance analysis {{ inputs.month }} ({{ inputs.scenario }}).
      {{ outputs.result.values.r | jq('"\(.revenue_bridge)."') | first }}
      {{ outputs.result.values.r | jq('"\(.margin_bridge). Margin rate \(.margin_rate)."') | first }}
      {{ outputs.result.values.r | jq('"Top drivers: \(.top_drivers). Above the flux thresholds: \(.flux_items), unexplained \(.unexplained) \(.unexplained_detail)."') | first }}
      {{ outputs.result.values.r | jq('"Blockers: \(.blockers). \(.blocker_detail)"') | first }}

  - id: write_commentary
    type: io.kestra.plugin.core.storage.Write
    extension: .md
    content: "{{ outputs.result.values.r | jq('.commentary') | first }}"

  - id: evidence
    type: io.kestra.plugin.core.namespace.UploadFiles
    namespace: "{{ flow.namespace }}"
    filesMap:
      "{{ render(vars.pack_dir) }}/commentary.md": "{{ outputs.write_commentary.uri }}"
      "{{ render(vars.pack_dir) }}/bridge.csv": "{{ outputs.analyse.outputFiles.bridge }}"
      "{{ render(vars.pack_dir) }}/lines.csv": "{{ outputs.analyse.outputFiles.lines }}"
      "{{ render(vars.pack_dir) }}/flux.csv": "{{ outputs.analyse.outputFiles.flux }}"
      "{{ render(vars.pack_dir) }}/blockers.csv": "{{ outputs.analyse.outputFiles.blockers }}"

  - id: decide
    type: io.kestra.plugin.core.flow.Switch
    value: >-
      {%- set r = outputs.result.values.r -%}
      {%- if (r | jq('.blockers > 0') | first) -%}BLOCKED
      {%- elseif (r | jq('.unexplained > 0') | first) -%}NEEDS_EXPLANATIONS
      {%- else -%}CLOSE{%- endif -%}
    cases:
      CLOSE:
        - id: lock_month
          type: io.kestra.plugin.core.kv.Set
          key: "{{ vars.lock_key }}"
          kvType: JSON
          value: >-
            {{ {'old': (kv(vars.lock_key, errorOnMissing=false) ?? {'closed': [], 'months': {}}), 'm': inputs.month, 'r': fromJson(outputs.result.values.r), 'e': inputs.explanations}
               | jq('{closed: (.old.closed + [.m]), months: (.old.months + {(.m): {margin_bridge: .r.margin_bridge, explanations: .e}})}') | first | toJson }}

        - id: log_closed
          type: io.kestra.plugin.core.log.Log
          message: "Variance analysis for {{ inputs.month }} closed. Commentary in {{ render(vars.pack_dir) }}/commentary.md."

      NEEDS_EXPLANATIONS:
        - id: explanations_required
          type: io.kestra.plugin.core.execution.Fail
          errorMessage: >-
            {{ outputs.result.values.r | jq('.unexplained') | first }} variance(s) above the thresholds have no explanation:
            {{ outputs.result.values.r | jq('.unexplained_detail') | first }}. Add them to the explanations input and run again.

    defaults:
      - id: blocked
        type: io.kestra.plugin.core.execution.Fail
        errorMessage: "The {{ inputs.month }} analysis cannot be produced: {{ outputs.result.values.r | jq('.blocker_detail') | first }}"

extend:
  title: Explain budget against actual margin with a price, volume, mix, cost and currency bridge
  metaTitle: Price-volume-mix variance analysis of revenue and margin with Kestra and DuckDB
  shortDescription: Decompose revenue and gross margin variances into volume, mix, price, cost and currency by product and region, prove they add up, require explanations above a threshold and lock the month.
  metaDescription: Price-volume-mix variance analysis in Kestra and DuckDB. Revenue and margin bridge, exact decomposition, flux thresholds and explained commentary.
  description: |
    Every month, FP&A has to explain why margin differs from budget: selling more or less, selling a different mix, charging different prices, paying more for materials, or exchange rates. The analysis usually lives in a spreadsheet whose effects never quite add up. The leftover gets a line called "other", and the commentary is written from memory. This flow decomposes the variance exactly, line by line. It names the drivers and refuses to close the month until each material driver has a written explanation.

    It runs with no setup and no network. The demo has six products in four families, sold in three regions (EUR, USD, GBP), with a budget and an actual month that contains several stories:
    - US pump volumes up 18%,
    - customers moving from the high-margin valve to the cheaper one,
    - a 6% price increase on one pump in the US and a price cut on sensors,
    - an 8% steel surcharge on pump castings,
    - a weaker dollar than budgeted.


    ## The decomposition, per product and region

    | Effect | Revenue | Gross margin |
    |---|---|---|
    | Units (volume + mix) | (actual units - budget units) × budget price × budget rate | Same at budget unit margin |
    | Volume | Budget amount × total unit growth of the business | Same on budget margin |
    | Mix | Unit effect - volume: what the line gained or lost against the average growth | Same |
    | Price | Actual units × (actual price - budget price) × budget rate | Same |
    | Cost | | -Actual units × (actual cost - budget cost) × budget rate |
    | Currency | Actual local amount × (actual rate - budget rate) | Same on margin |

    Budget plus the effects equals actual **exactly** for every line, with no "other" line. The flow proves it, and stops if the effects don't add up for revenue or margin.

    ## Flux and commentary

    Any margin effect on a product/region line that is above both `flux_threshold` and `flux_threshold_pct` of that line's budget margin needs an explanation, passed in the `explanations` input keyed as `product/region/effect`. The month cannot close while one is missing. The flow then writes `commentary.md`:
    - the revenue and margin bridge,
    - each driver with its amount, its share of the line's budget margin and the explanation given.

    Once closed, the month is locked with its bridge and its explanations.

    ## Controls

    - **Blocked:** actual sales of a product with no budget line, a budget line with no units, a region without a budget rate, effects that don't add up.
    - **Needs explanations:** any driver above the thresholds without one.
    - **Lock:** a closed month cannot be rerun.

    ## How it works

    1. `period_control` and `period_gate` refuse a month already closed.
    2. `analyse` (`io.kestra.plugin.jdbc.duckdb.Queries`) builds products, regions, budget and actuals, then computes the line effects, the volume/mix split, the bridge and its proof, the flux list against the explanations, and the commentary.
    3. `log_analysis` prints the bridges and the drivers. `write_commentary` (`io.kestra.plugin.core.storage.Write`) and `evidence` store `commentary.md`, `bridge.csv`, `lines.csv` (every effect for every line), `flux.csv` and `blockers.csv`.
    4. `decide` (`io.kestra.plugin.core.flow.Switch`):
       - `CLOSE`: locks the month.
       - Otherwise the run fails with what is missing.

    ## Tested end to end

    On Kestra 2.0.3 OSS.

    | Run | Inputs | Result |
    |---|---|---|
    | 1 | 2026-09, no explanations | Margin budget 1,076,338, then volume +58,451, mix -7,661, price +43,150, cost -93,001, currency -14,809 = actual 1,062,469. Margin rate 40.5% against 43.3% budgeted. 5 drivers above the thresholds, all unexplained: stops |
    | 2 | four explanations | Stops: `VALVE-H/EU/mix` (-19,555, -27.4% of the line's margin) is still unexplained |
    | 3 | all five | Closed. The commentary lists each driver with its explanation |
    | 4 | 2026-09 again | Refused |
    | 5 | 2026-10 `ISSUES` | Blocked by the 3 issues: a product sold without a budget line, a budget line with zero units, a Swiss region with no budget rate |

    I checked all 18 lines of `lines.csv` independently in Python:
    - for revenue and margin, the effects add up to the line's variance within rounding;
    - each line's volume effect is exactly its budget margin × the total unit growth of 5.43%;
    - the mix effects sum to the unit effect less volume (-7,660.85).

    ## Problems found while testing

    - **No driver was material.** The first default threshold of 50,000 left the month with nothing to explain, so it closed silently. The default is now 15,000 and 10% of the line's budget margin, which flags the five real stories in the demo and leaves the noise alone.
    - **The example in the input description broke the YAML.** A JSON example containing a colon inside a plain scalar did not parse. The description is now a folded block.

    ## Inputs

    | Input | Default | Purpose |
    |---|---|---|
    | `month` | `2026-09` | `YYYY-MM`, validated |
    | `scenario` | `CLEAN` | Demo only |
    | `flux_threshold`, `flux_threshold_pct` | `15000.0`, `10.0` | Materiality of a driver |
    | `explanations` | `{}` | Commentary keyed `product/region/effect` |

    ## Use it with your data

    - Replace `products`, `regions`, `budget` and `actual` with your plan and your ERP sales and cost of sales by product and region. Units, local price and local unit cost are enough.
    - Use the rate your plan was built on as `budget_rate`, and the month's average rate as `actual_rate`.
    - The demo uses the same budget for every month. Load the month's own plan.

    ## Things to know

    - Mix is measured across all products and regions together. For mix within a family, run the flow per family, or split volume by family before splitting mix.
    - Freight, rebates and other costs below gross margin need their own effect line.

    ## Links

    - DuckDB LATERAL joins: https://duckdb.org/docs/sql/query_syntax/from#lateral-joins
    - DuckDB plugin: https://kestra.io/plugins/plugin-jdbc-duckdb

    This blueprint was created by [zkasuran](https://github.com/zkasuran).
  tags:
    - Business
    - Data
  subTags:
    - Reporting & Digests
    - Approval Gates
  ee: false
  demo: false
