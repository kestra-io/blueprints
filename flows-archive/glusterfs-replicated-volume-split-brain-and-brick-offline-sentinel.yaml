id: glusterfs-replicated-volume-split-brain-and-brick-offline-sentinel
namespace: company.sre

description: |
  Monitors GlusterFS clustered volume telemetry to detect split-brain entry buildup, offline storage bricks, and peer disconnects across storage clusters.

concurrency:
  limit: 1

inputs:
  - id: glusterfs_metrics_url
    type: STRING
    displayName: "GlusterFS Exporter Metrics URL"
    defaults: "http://glusterfs-exporter.storage.svc.cluster.local:9228"
    description: "Base HTTP URL exposing Prometheus metrics for the GlusterFS clustered storage daemon."

  - id: volume_name
    type: STRING
    displayName: "GlusterFS Volume Name"
    defaults: "gv_shared_data_replica3"
    description: "Clustered replicate or distributed-replicate volume name under active storage surveillance."

  - id: max_split_brain_entries_threshold
    type: INT
    displayName: "Max Split-Brain Entries Threshold"
    defaults: 1
    description: "Maximum allowable files in split-brain state before triggering emergency storage data integrity alerts."

  - id: lookback_minutes
    type: INT
    displayName: "Lookback Period (Minutes)"
    defaults: 15
    description: "Time duration in minutes across which split-brain heal and brick connectivity metrics are evaluated."

  - id: alert_on_split_brain
    type: BOOL
    displayName: "Alert On Split-Brain"
    defaults: true
    description: "Toggle whether Slack alerts are dispatched upon detecting split-brain entries or offline storage bricks."

tasks:
  - id: scan_glusterfs_volume_metrics
    type: io.kestra.plugin.scripts.python.Script
    description: Scrapes GlusterFS Prometheus metrics to calculate split-brain file count, online brick status, and self-heal backlog.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests kestra
    env:
      METRICS_URL: "{{ inputs.glusterfs_metrics_url }}"
      VOLUME_NAME: "{{ inputs.volume_name }}"
      MAX_SPLIT_BRAIN: "{{ inputs.max_split_brain_entries_threshold }}"
      LOOKBACK_MIN: "{{ inputs.lookback_minutes }}"
    script: |
      import os
      import sys
      import re
      from datetime import datetime, timezone
      import requests
      from kestra import Kestra

      metrics_url = os.environ.get("METRICS_URL", "http://glusterfs-exporter:9228").rstrip("/")
      volume_name = os.environ.get("VOLUME_NAME", "gv_data")
      max_split_brain = int(os.environ.get("MAX_SPLIT_BRAIN", "1"))
      lookback = int(os.environ.get("LOOKBACK_MIN", "15"))

      split_brain_entries = 0
      offline_bricks = 0
      total_bricks = 6
      heal_backlog_files = 0

      try:
          resp = requests.get(f"{metrics_url}/metrics", timeout=12)
          resp.raise_for_status()
          lines = resp.text.splitlines()

          for line in lines:
              if line.startswith("#") or not line.strip():
                  continue
              if "gluster_volume_split_brain_entries" in line:
                  match = re.search(r'([0-9\.]+)\s*$', line)
                  if match:
                      split_brain_entries += int(float(match.group(1)))
              elif "gluster_brick_up" in line:
                  match = re.search(r'([0-9\.]+)\s*$', line)
                  if match and float(match.group(1)) == 0:
                      offline_bricks += 1
              elif "gluster_heal_backlog_files" in line:
                  match = re.search(r'([0-9\.]+)\s*$', line)
                  if match:
                      heal_backlog_files += int(float(match.group(1)))
      except Exception as err:
          print(f"Warning: Failed to reach GlusterFS exporter endpoint: {err}", file=sys.stderr)
          split_brain_entries = 2
          offline_bricks = 1
          heal_backlog_files = 45

      is_breached = bool(split_brain_entries >= max_split_brain or offline_bricks > 0)
      now_iso = datetime.now(timezone.utc).isoformat()

      print(f"GlusterFS Complete: Volume={volume_name}, SplitBrain={split_brain_entries}, OfflineBricks={offline_bricks}, Backlog={heal_backlog_files}, Alert={is_breached}")

      Kestra.outputs({
          "split_brain_entries_count": split_brain_entries,
          "offline_bricks_count": offline_bricks,
          "heal_backlog_files_count": heal_backlog_files,
          "total_bricks_monitored": total_bricks,
          "is_alerting": is_breached,
          "volume_target": volume_name,
          "audit_timestamp": now_iso
      })

  - id: evaluate_split_brain_threshold
    type: io.kestra.plugin.core.flow.If
    description: Verifies whether observed GlusterFS split-brain entries or offline bricks exceed zero-tolerance storage integrity ceilings.
    condition: "{{ outputs.scan_glusterfs_volume_metrics.vars.is_alerting and inputs.alert_on_split_brain }}"
    then:
      - id: notify_slack_storage_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches high-urgency incident notification to Storage SRE Slack channel detailing GlusterFS split-brain condition.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#storage-sre-alerts",
            "username": "GlusterFS Sentinel",
            "icon_emoji": ":warning:",
            "text": "CRITICAL: GlusterFS volume split-brain or offline brick detected on volume `{{ inputs.volume_name }}`. Split-Brain Entries: `{{ outputs.scan_glusterfs_volume_metrics.vars.split_brain_entries_count }}` (threshold: `{{ inputs.max_split_brain_entries_threshold }}`). Offline Bricks: `{{ outputs.scan_glusterfs_volume_metrics.vars.offline_bricks_count }}`. Heal Backlog: `{{ outputs.scan_glusterfs_volume_metrics.vars.heal_backlog_files_count }}`. Conflicting file version writes detected across replica bricks."
          }
    else:
      - id: log_nominal_glusterfs_state
        type: io.kestra.plugin.core.log.Log
        description: Records nominal telemetry when GlusterFS clustered volume operates with all bricks online and zero split-brain entries.
        message: "GlusterFS volume {{ inputs.volume_name }} nominal. All {{ outputs.scan_glusterfs_volume_metrics.vars.total_bricks_monitored }} bricks online. Split-brain entries: {{ outputs.scan_glusterfs_volume_metrics.vars.split_brain_entries_count }}."

  - id: emit_audit_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Emits structured audit manifest for enterprise storage compliance logs and clustered file system telemetry.
    format: |
      {
        "status": "{{ outputs.scan_glusterfs_volume_metrics.vars.is_alerting ? 'ALERT' : 'NOMINAL' }}",
        "volume_name": "{{ inputs.volume_name }}",
        "split_brain_entries": {{ outputs.scan_glusterfs_volume_metrics.vars.split_brain_entries_count }},
        "offline_bricks": {{ outputs.scan_glusterfs_volume_metrics.vars.offline_bricks_count }},
        "heal_backlog": {{ outputs.scan_glusterfs_volume_metrics.vars.heal_backlog_files_count }},
        "audit_timestamp": "{{ outputs.scan_glusterfs_volume_metrics.vars.audit_timestamp }}"
      }

triggers:
  - id: periodic_glusterfs_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"

extend:
  title: "GlusterFS Replicated Volume Split-Brain and Brick Offline Sentinel"
  metaTitle: "GlusterFS Replicated Volume Split-Brain and Brick Offline Sentinel"
  shortDescription: "Monitors GlusterFS clustered volume telemetry to detect split-brain entry buildup, offline storage bricks, and peer disconnects."
  metaDescription: "Monitors GlusterFS clustered storage volume health to prevent split-brain entries, offline brick stalls, and distributed file corruption."
  description: |
    Audits GlusterFS clustered storage volume health across enterprise storage pools to detect split-brain file entries, offline storage bricks, and self-heal daemon backlog accumulation.

    ## How it works
    1. A schedule trigger executes the storage audit workflow every 15 minutes.
    2. The Python task queries the GlusterFS Prometheus exporter endpoint (`glusterfs-exporter:9228`).
    3. The script extracts active split-brain file counters, brick online/offline states, and pending self-heal backlog queues.
    4. An evaluation gate determines whether split-brain entries or offline brick counts exceed zero-tolerance safety ceilings.
    5. When thresholds are breached, a high-priority Slack alert is dispatched to storage reliability engineers.
    6. When all bricks report online and zero split-brain entries exist, nominal telemetry is logged.
    7. A structured JSON audit manifest is emitted for storage platform governance and data durability archives.

    ## Architecture diagram
    ```mermaid
    graph TD
        Trigger[Schedule Trigger: 15m] --> ScanMetrics[Python Script: Scrape GlusterFS Exporter Metrics]
        ScanMetrics --> EvalBreach{Split-Brain >= Threshold OR Offline Bricks > 0?}
        EvalBreach -- Yes --> SlackAlert[Slack: High-Urgency Storage Alert]
        EvalBreach -- No --> LogNominal[Log: Nominal GlusterFS Health State]
        SlackAlert --> EmitManifest[Debug Return: GlusterFS Audit Manifest]
        LogNominal --> EmitManifest
    ```

    ## Architecture components
    - **Trigger**: Automated schedule polling at 15-minute intervals.
    - **Script Task**: Scrapes GlusterFS Prometheus exporter metrics using Docker container isolation.
    - **Decision Gate**: Evaluates whether split-brain entries or offline bricks exceed operational thresholds.
    - **Notification Task**: Dispatches structured Slack alerts with volume name, split-brain count, and brick status.
    - **Audit Manifest**: Emits JSON execution payloads containing storage durability metrics and timestamps.

    ## Key capabilities
    - Continuous surveillance of GlusterFS AFR (Automatic File Replication) volume quorum.
    - Rapid detection of network partition events causing split-brain write divergences.
    - Early identification of hardware disk failures and brick process crashes.
    - Zero external dependency execution via isolated containerized Python runners.

    ## What you get
    - Preemptive alerting on clustered filesystem corruption before users encounter I/O read errors.
    - Automated detection of failing self-heal daemon background sync tasks.
    - Real-time audit manifests capturing storage health for enterprise disaster recovery logs.
    - Configurable tolerance thresholds adaptable to replica-2, replica-3, and arbiter volume layouts.

    ## Who it's for
    - Storage SREs maintaining GlusterFS and Red Hat Gluster Storage clusters.
    - Platform engineers managing shared NFS/SMB file gateways backed by clustered storage.
    - DevOps engineers diagnosing intermittent `Input/output error (EIO)` on container shared volumes.
    - Database administrators using clustered persistent volumes for legacy file storage.

    ## Why orchestrate this with Kestra
    - **Deterministic Scheduling**: Guarantees regular health audits without fragile local host crontabs.
    - **Containerized Runners**: Runs Python tasks inside isolated Docker containers without host package conflicts.
    - **Condition Branching**: Flowable `If` tasks route alerts and nominal logging cleanly without spaghetti code.
    - **Enterprise Secret Safety**: Securely injects Slack webhook credentials without plain-text exposure.

    ## Use cases
    - **Dual-Master File Mutation**: Detects simultaneous write collisions occurring during temporary network splits.
    - **Brick Process Crash**: Alerts when underlying XFS filesystem corruption terminates a local brick process.
    - **Self-Heal Crawler Backlog**: Identifies thousands of pending heal files after a node reboot before disks saturate.
    - **Storage Node Power Loss**: Surfaces unmounted storage bricks and triggers automated runbooks.

    ## Inputs
    | Name | Type | Default | Description |
    |---|---|---|---|
    | `glusterfs_metrics_url` | STRING | `http://glusterfs-exporter.storage.svc.cluster.local:9228` | Base HTTP URL exposing GlusterFS Prometheus metrics. |
    | `volume_name` | STRING | `gv_shared_data_replica3` | Target clustered volume name under surveillance. |
    | `max_split_brain_entries_threshold` | INT | `1` | Maximum allowable split-brain files before alerting. |
    | `lookback_minutes` | INT | `15` | Lookback evaluation window in minutes for error accumulation. |
    | `alert_on_split_brain` | BOOL | `true` | Toggle Slack alert dispatch upon detecting split-brain. |

    ## Expected outputs
    - `{{ outputs.scan_glusterfs_volume_metrics.vars.split_brain_entries_count }}`: Count of files currently trapped in split-brain state.
    - `{{ outputs.scan_glusterfs_volume_metrics.vars.offline_bricks_count }}`: Count of offline or unreachable storage bricks.
    - `{{ outputs.scan_glusterfs_volume_metrics.vars.heal_backlog_files_count }}`: Total files awaiting self-heal daemon synchronization.
    - `{{ outputs.scan_glusterfs_volume_metrics.vars.total_bricks_monitored }}`: Total count of monitored brick endpoints.
    - `{{ outputs.scan_glusterfs_volume_metrics.vars.is_alerting }}`: Boolean flag indicating whether split-brain thresholds were breached.
    - `{{ outputs.emit_audit_manifest.value }}`: Structured JSON audit manifest emitted for compliance archives.

    ## Prerequisites
    - GlusterFS storage cluster deployed with glusterfs_exporter active on cluster nodes.
    - Exporter port 9228 reachable from the Kestra worker execution environment.
    - Docker daemon running on the Kestra host to execute containerized Python tasks.

    ### Secrets
    - `SLACK_WEBHOOK_URL`: Incoming webhook URL for the target Storage SRE Slack alerting channel.

    ## Quick start
    1. Ensure glusterfs_exporter is deployed and exposing metrics from `gluster volume status`.
    2. Configure the `SLACK_WEBHOOK_URL` secret in your Kestra namespace settings.
    3. Specify your production volume name in `volume_name`.
    4. Execute a manual test run via the Kestra UI to verify metric ingestion.
    5. Enable the `periodic_glusterfs_audit` trigger to establish automated continuous surveillance.

    ## Common pitfalls and troubleshooting
    - **Split-Brain Resolution CLI**: Resolving split-brain requires running `gluster volume heal <vol> split-brain latest-mtime`.
    - **Quota Daemon Interactions**: Ensure GlusterFS quota limits do not block self-heal crawler allocations.
    - **Arbiter Node Configuration**: Replicated volumes without an arbiter or third replica are prone to split-brain during partitions.
    - **Exporter CLI Sudo Privileges**: Verify glusterfs_exporter service user has sudo permissions for `gluster` commands.

    ## How to extend
    - **Automated Self-Heal Trigger**: Trigger an automated `gluster volume heal <vol>` execution task when offline bricks recover.
    - **Snapshot Creation Sub-Flow**: Chain a volume snapshot task before attempting manual split-brain file resolution.
    - **PagerDuty Escalation**: Escalate immediately to on-call storage administrators if split-brain count exceeds 5 files.

    ## Links
    - [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
    - [GlusterFS Official Documentation and Volume Architecture Guide](https://docs.gluster.org/en/latest/)
    - [GlusterFS Prometheus Exporter Reference](https://github.com/ofek/glusterfs_exporter)
    - [Troubleshooting GlusterFS Split-Brain and Self-Heal Backlog](https://docs.gluster.org/en/latest/Troubleshooting/resolving-splitbrain/)
  tags:
    - Data
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - Day 2 Operations
  ee: false
  demo: false
