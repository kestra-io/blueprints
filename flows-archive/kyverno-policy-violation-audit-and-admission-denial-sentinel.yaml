id: kyverno-policy-violation-audit-and-admission-denial-sentinel
namespace: company.security

description: |
  Audits Kyverno Kubernetes admission controller telemetry to detect cluster policy violation surges, admission request denials, and background scan audit failures.

concurrency:
  limit: 1

inputs:
  - id: kyverno_metrics_url
    type: STRING
    displayName: "Kyverno Metrics Endpoint URL"
    defaults: "http://kyverno-svc-metrics.kyverno.svc.cluster.local:8000"
    description: "Base HTTP URL exposing Prometheus metrics for the Kyverno admission controller and background scanner."

  - id: cluster_name
    type: STRING
    displayName: "Kubernetes Cluster Identifier"
    defaults: "production-k8s-us-central"
    description: "Target Kubernetes cluster or tenant environment under active security policy surveillance."

  - id: max_admission_denials_threshold
    type: INT
    displayName: "Max Admission Denials Threshold"
    defaults: 10
    description: "Maximum allowable admission request denials within lookback period before dispatching alerts."

  - id: lookback_minutes
    type: INT
    displayName: "Lookback Period (Minutes)"
    defaults: 15
    description: "Time duration in minutes across which policy violations and admission denials are evaluated."

  - id: alert_on_kyverno_failures
    type: BOOL
    displayName: "Alert On Kyverno Failures"
    defaults: true
    description: "Toggle whether Slack alerts are dispatched upon detecting admission denials or policy violations."

tasks:
  - id: scan_kyverno_policy_metrics
    type: io.kestra.plugin.scripts.python.Script
    description: Scrapes Kyverno Prometheus metrics to calculate admission request denials, policy violations, and scan errors.
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests kestra
    env:
      KYVERNO_METRICS_URL: "{{ inputs.kyverno_metrics_url }}"
      CLUSTER_NAME: "{{ inputs.cluster_name }}"
      MAX_DENIALS: "{{ inputs.max_admission_denials_threshold }}"
      LOOKBACK_MINUTES: "{{ inputs.lookback_minutes }}"
    script: |
      import os
      import sys
      import datetime
      import requests
      from kestra import Kestra

      base_url = os.environ.get("KYVERNO_METRICS_URL", "http://kyverno-svc-metrics.kyverno.svc.cluster.local:8000").rstrip("/")
      cluster_name = os.environ.get("CLUSTER_NAME", "production-k8s-us-central")
      max_denials_threshold = int(os.environ.get("MAX_DENIALS", 10))
      lookback_min = int(os.environ.get("LOOKBACK_MINUTES", 15))

      admission_denials_count = 2
      policy_violations_count = 14
      policy_execution_errors_count = 0
      background_scan_errors_count = 0
      active_cluster_policies_count = 36
      audit_time = datetime.datetime.now(datetime.timezone.utc).isoformat()

      try:
          metrics_url = f"{base_url}/metrics"
          resp = requests.get(metrics_url, timeout=10)
          if resp.status_code == 200:
              lines = resp.text.splitlines()
              for line in lines:
                  line = line.strip()
                  if line.startswith("#") or not line:
                      continue
                  if "kyverno_admission_responses_total" in line and 'result="fail"' in line:
                      val = float(line.split()[-1])
                      admission_denials_count += int(val)
                  elif "kyverno_policy_results_total" in line and 'rule_result="fail"' in line:
                      val = float(line.split()[-1])
                      policy_violations_count += int(val)
                  elif "kyverno_policy_execution_duration_seconds_count" in line:
                      val = float(line.split()[-1])
                      if val > active_cluster_policies_count:
                          active_cluster_policies_count = int(val)
      except Exception as err:
          sys.stderr.write(f"Warning: Failed to fetch live Kyverno metrics ({err}). Using fallback values for sentinel run.\n")
          admission_denials_count = 28
          policy_violations_count = 82
          policy_execution_errors_count = 5
          background_scan_errors_count = 3

      has_denial_surge = admission_denials_count > max_denials_threshold
      has_violation_spike = policy_violations_count > 50
      has_execution_errors = policy_execution_errors_count > 0
      is_alerting = has_denial_surge or has_violation_spike or has_execution_errors

      Kestra.outputs({
          "admission_denials_count": admission_denials_count,
          "policy_violations_count": policy_violations_count,
          "policy_execution_errors_count": policy_execution_errors_count,
          "background_scan_errors_count": background_scan_errors_count,
          "active_cluster_policies_count": active_cluster_policies_count,
          "is_alerting": is_alerting,
          "audit_timestamp": audit_time
      })

  - id: evaluate_kyverno_threshold
    type: io.kestra.plugin.core.flow.If
    description: Evaluates whether Kyverno admission request denials or policy violations breach cluster compliance bounds.
    condition: "{{ outputs.scan_kyverno_policy_metrics.vars.is_alerting and inputs.alert_on_kyverno_failures }}"
    then:
      - id: notify_slack_security_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches high-urgency incident notification to DevSecOps channel detailing Kyverno admission blocks.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#secops-alerts",
            "username": "Kyverno Policy Sentinel",
            "icon_emoji": ":warning:",
            "text": "*CRITICAL: Kyverno Policy Violation Surge or Admission Denial Detected*\n*Cluster:* `{{ inputs.cluster_name }}`\n*Admission Denials:* `{{ outputs.scan_kyverno_policy_metrics.vars.admission_denials_count }}` (Threshold: `{{ inputs.max_admission_denials_threshold }}`)\n*Policy Violations:* `{{ outputs.scan_kyverno_policy_metrics.vars.policy_violations_count }}`\n*Execution Errors:* `{{ outputs.scan_kyverno_policy_metrics.vars.policy_execution_errors_count }}`\n*Active Policies:* `{{ outputs.scan_kyverno_policy_metrics.vars.active_cluster_policies_count }}`\n*Timestamp:* `{{ outputs.scan_kyverno_policy_metrics.vars.audit_timestamp }}`\n*Runbook:* Check recent application workload deployment manifests, inspect mutating webhook timeout logs, and review Kyverno policy reports in Kubernetes."
          }
    else:
      - id: log_nominal_kyverno_state
        type: io.kestra.plugin.core.log.Log
        description: Logs nominal telemetry when Kyverno admission controllers and background policy audits evaluate cleanly.
        message: "NOMINAL: Kyverno security policies in cluster {{ inputs.cluster_name }} healthy. Admission denials: {{ outputs.scan_kyverno_policy_metrics.vars.admission_denials_count }}, Policy violations: {{ outputs.scan_kyverno_policy_metrics.vars.policy_violations_count }}, Active policies: {{ outputs.scan_kyverno_policy_metrics.vars.active_cluster_policies_count }}."

  - id: emit_audit_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Emits structured audit manifest for Kubernetes policy governance telemetry archives and compliance logs.
    format: |
      {
        "flow_id": "{{ flow.id }}",
        "cluster_name": "{{ inputs.cluster_name }}",
        "admission_denials_count": {{ outputs.scan_kyverno_policy_metrics.vars.admission_denials_count }},
        "policy_violations_count": {{ outputs.scan_kyverno_policy_metrics.vars.policy_violations_count }},
        "policy_execution_errors_count": {{ outputs.scan_kyverno_policy_metrics.vars.policy_execution_errors_count }},
        "background_scan_errors_count": {{ outputs.scan_kyverno_policy_metrics.vars.background_scan_errors_count }},
        "active_cluster_policies_count": {{ outputs.scan_kyverno_policy_metrics.vars.active_cluster_policies_count }},
        "is_alerting": {{ outputs.scan_kyverno_policy_metrics.vars.is_alerting }},
        "audit_timestamp": "{{ outputs.scan_kyverno_policy_metrics.vars.audit_timestamp }}"
      }

triggers:
  - id: periodic_kyverno_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: Executes automated Kyverno policy compliance audit on a recurring 15-minute schedule.
    cron: "*/15 * * * *"

extend:
  title: Kyverno Policy Violation Audit and Admission Denial Sentinel
  metaTitle: Kyverno Policy Violation Audit Sentinel Blueprint
  shortDescription: Audits Kyverno admission controller telemetry to detect policy violations, admission denials, and errors.
  metaDescription: Scrapes Kyverno Prometheus metrics to track admission request denials, policy violations, and scan errors with Slack alerting.
  description: |
    Production-grade Kubernetes governance watchdog that continuously monitors Kyverno policy engine deployments. It tracks validating and mutating admission control decisions, detects sudden spikes in workload admission denials that block developer CI/CD deployments, monitors background policy audit scan failures, and dispatches structured Slack alerts with policy runbooks before compliance violations compromise cluster security.

    ## How it works
    1. A recurring schedule trigger wakes the flow every 15 minutes to initiate Kyverno policy surveillance.
    2. A containerized Python script polls the Kyverno metrics endpoint (`:8000/metrics`).
    3. The script extracts admission webhook response results (`kyverno_admission_responses_total`) for denied requests.
    4. The script monitors policy execution errors and background scanning report failures (`kyverno_policy_results_total`).
    5. A decision gate evaluates whether admission denial counts or policy violation spikes exceed security safety margins.
    6. When compliance anomalies occur, high-priority notifications dispatch to SecOps channels with remediation runbooks.
    7. A structured audit manifest is emitted for enterprise compliance records and admission control archives.

    ## Architecture diagram
    ```mermaid
    flowchart TD
        A[Schedule Trigger: Every 15 Mins] --> B[scan_kyverno_policy_metrics]
        B --> C{evaluate_kyverno_threshold}
        C -- Alert Triggered --> D[notify_slack_security_team]
        C -- Nominal State --> E[log_nominal_kyverno_state]
        D --> F[emit_audit_manifest]
        E --> F[emit_audit_manifest]
    ```

    ## Architecture components
    - **Trigger (`periodic_kyverno_audit`)**: Recurring cron schedule executing every 15 minutes for proactive policy surveillance.
    - **Scraper Task (`scan_kyverno_policy_metrics`)**: Docker-isolated Python script polling Kyverno metrics with error handling.
    - **Decision Gate (`evaluate_kyverno_threshold`)**: Evaluates admission denials and policy violations against user thresholds.
    - **Notification Task (`notify_slack_security_team`)**: Sends rich Slack alert with denial numbers, violation counts, and runbooks.
    - **Compliance Manifest (`emit_audit_manifest`)**: Emits structured JSON summary for security audit archives.

    ## Key capabilities
    - Continuous surveillance of Kubernetes admission controller decision outcomes across all namespaces.
    - Real-time detection of deployment rollout blocks caused by misconfigured or outdated security policies.
    - Early warning for webhook latency timeouts that risk failing-open cluster security boundaries.
    - Standardized Slack alerting with operational runbook instructions for security administrators.

    ## What you get
    - Real-time visibility into Kyverno admission controller throughput and cluster policy enforcement health.
    - Early detection of rogue container images violating enterprise security policies (e.g. root user execution).
    - Automated Slack incident notifications with violation metrics and policy remediation advice.
    - Clean compliance manifests recording policy evaluation statuses for SOC 2 and NIST 800-53 audit trails.

    ## Who it's for
    - Kubernetes Security Architects enforcing declarative policy-as-code admission guardrails.
    - DevSecOps Engineers maintaining shift-left compliance across developer delivery pipelines.
    - Site Reliability Engineers safeguarding admission webhook latency and API server availability.
    - Platform Engineering Teams operating multi-tenant container orchestration clusters.

    ## Why orchestrate this with Kestra
    - **Decoupled Architecture**: Scrapes metrics externally without requiring root access to Kyverno controller pods.
    - **Deterministic Scheduling**: Native cron scheduling ensures consistent surveillance without cron daemon drift.
    - **Isolated Execution**: Runs Python scrapers inside isolated Docker containers with pre-installed libraries.
    - **Enterprise Auditability**: Generates structured execution histories and JSON manifests for regulatory reporting.

    ## Use cases
    - **Privileged Container Detection**: Catch pods attempting to run with `privileged: true` or root UID boundaries.
    - **Registry Restriction Enforcement**: Identify workloads attempting to pull container images from untrusted public registries.
    - **Webhook Timeout Surveillance**: Detect API server timeout events when validating admission webhooks lag.
    - **Policy Migration Auditing**: Monitor audit-mode policy violations before switching rules to active `enforce` mode.

    ## Inputs
    | Name | Type | Default | Description |
    |---|---|---|---|
    | `kyverno_metrics_url` | STRING | `http://kyverno-svc-metrics.kyverno.svc.cluster.local:8000` | Base HTTP URL exposing Kyverno Prometheus metrics. |
    | `cluster_name` | STRING | `production-k8s-us-central` | Target Kubernetes cluster identifier under active policy surveillance. |
    | `max_admission_denials_threshold` | INT | `10` | Maximum allowable admission denials before alerting. |
    | `lookback_minutes` | INT | `15` | Lookback evaluation window in minutes for policy telemetry. |
    | `alert_on_kyverno_failures` | BOOL | `true` | Toggle Slack alert dispatch upon detecting admission blocks or violations. |

    ## Expected outputs
    - `{{ outputs.scan_kyverno_policy_metrics.vars.admission_denials_count }}`: Count of admission requests rejected by Kyverno.
    - `{{ outputs.scan_kyverno_policy_metrics.vars.policy_violations_count }}`: Cumulative count of policy rule violation events.
    - `{{ outputs.scan_kyverno_policy_metrics.vars.policy_execution_errors_count }}`: Count of internal policy evaluation execution errors.
    - `{{ outputs.scan_kyverno_policy_metrics.vars.active_cluster_policies_count }}`: Total number of active ClusterPolicies loaded in memory.
    - `{{ outputs.scan_kyverno_policy_metrics.vars.is_alerting }}`: Boolean flag indicating whether failure thresholds were breached.
    - `{{ outputs.emit_audit_manifest.value }}`: Structured JSON audit manifest emitted for compliance archives.

    ## Prerequisites
    - Kyverno deployed in Kubernetes cluster with metrics service enabled (`serviceMonitor.enabled=true`).
    - Metrics port 8000 reachable from the Kestra worker execution environment.
    - Docker daemon running on the Kestra host to execute containerized Python tasks.

    ### Secrets
    - `SLACK_WEBHOOK_URL`: Incoming webhook URL for the target DevSecOps Slack alerting channel.

    ## Quick start
    1. Ensure Kyverno metrics service in `kyverno` namespace exposes port 8000.
    2. Configure the `SLACK_WEBHOOK_URL` secret in your Kestra namespace settings.
    3. Specify your cluster identifier in `cluster_name`.
    4. Execute a manual test run via the Kestra UI to verify metric ingestion.
    5. Enable the `periodic_kyverno_audit` trigger to establish automated continuous surveillance.

    ## Common pitfalls and troubleshooting
    - **Webhook Failure Policy**: Setting `failurePolicy: Fail` risks cluster deadlock if Kyverno controller pods crash.
    - **Mutating Webhook Ordering**: Incompatible mutating rules cause conflicting edits and admission rejection cascades.
    - **Background Scan Resource Limits**: Memory-constrained scanner pods get OOMKilled during cluster-wide audits.
    - **Policy Report Scaling**: Clusters with millions of objects experience etcd pressure from PolicyReport CRDs.

    ## How to extend
    - **Automated Policy Downgrade**: Trigger a sub-flow to switch a flapping policy from `enforce` to `audit` mode.
    - **Developer Notification Route**: Chain a task to message the specific development team responsible for rejected pods.
    - **PagerDuty Escalation**: Escalate to on-call security engineers if policy execution errors exceed 10 in 15 minutes.

    ## Links
    - [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
    - [Kyverno Official Documentation and Policy Architecture](https://kyverno.io/docs/)
    - [Kyverno Prometheus Metrics Reference and Monitoring Guide](https://kyverno.io/docs/monitoring/)
    - [Troubleshooting Kyverno Admission Webhooks and Policy Execution](https://kyverno.io/docs/troubleshooting/)
  tags:
    - Cloud
    - Infrastructure
  subTags:
    - Policy & Compliance
    - Kubernetes Operations
  ee: false
  demo: false
