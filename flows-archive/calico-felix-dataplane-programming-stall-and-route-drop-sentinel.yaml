id: calico-felix-dataplane-programming-stall-and-route-drop-sentinel
namespace: company.sre

description: |
  Audits Project Calico Felix daemon telemetry to detect dataplane iptables programming stalls, route synchronization errors, and kernel packet drop events across Kubernetes clusters.

concurrency:
  limit: 1

inputs:
  - id: calico_metrics_url
    type: STRING
    displayName: "Calico Node Metrics URL"
    defaults: "http://calico-node.kube-system.svc.cluster.local:9091"
    description: "Base HTTP URL exposing Prometheus metrics for the Calico Felix agent daemon."

  - id: cluster_name
    type: STRING
    displayName: "Kubernetes Cluster Identifier"
    defaults: "k8s-prod-us-east-01"
    description: "Target Kubernetes cluster or data center fabric under active Felix dataplane surveillance."

  - id: max_programming_errors_threshold
    type: INT
    displayName: "Max Dataplane Errors Threshold"
    defaults: 2
    description: "Maximum allowable Felix dataplane programming and route sync errors before triggering high-urgency alerts."

  - id: lookback_minutes
    type: INT
    displayName: "Lookback Period (Minutes)"
    defaults: 15
    description: "Time duration in minutes across which Felix dataplane error metrics are evaluated."

  - id: alert_on_dataplane_stall
    type: BOOL
    displayName: "Alert On Dataplane Stall"
    defaults: true
    description: "Toggle whether Slack alerts are dispatched upon detecting Felix dataplane programming stalls."

tasks:
  - id: scan_calico_felix_metrics
    type: io.kestra.plugin.scripts.python.Script
    description: Scrapes Calico Felix Prometheus metrics to extract iptables programming latency, route sync errors, and rule updates.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests kestra
    env:
      METRICS_URL: "{{ inputs.calico_metrics_url }}"
      CLUSTER_NAME: "{{ inputs.cluster_name }}"
      MAX_ERRORS: "{{ inputs.max_programming_errors_threshold }}"
      LOOKBACK_MIN: "{{ inputs.lookback_minutes }}"
    script: |
      import os
      import sys
      import re
      from datetime import datetime, timezone
      import requests
      from kestra import Kestra

      metrics_url = os.environ.get("METRICS_URL", "http://calico-node:9091").rstrip("/")
      cluster_name = os.environ.get("CLUSTER_NAME", "k8s-prod-cluster")
      max_errors = int(os.environ.get("MAX_ERRORS", "2"))
      lookback = int(os.environ.get("LOOKBACK_MIN", "15"))

      dataplane_errors = 0
      route_sync_errors = 0
      iptables_restore_calls = 0

      try:
          resp = requests.get(f"{metrics_url}/metrics", timeout=12)
          resp.raise_for_status()
          lines = resp.text.splitlines()

          for line in lines:
              if line.startswith("#") or not line.strip():
                  continue
              if "calico_felix_dataplane_apply_errors" in line:
                  match = re.search(r'([0-9\.]+)\s*$', line)
                  if match:
                      dataplane_errors += int(float(match.group(1)))
              elif "calico_felix_route_sync_errors" in line:
                  match = re.search(r'([0-9\.]+)\s*$', line)
                  if match:
                      route_sync_errors += int(float(match.group(1)))
              elif "calico_felix_iptables_restore_calls" in line:
                  match = re.search(r'([0-9\.]+)\s*$', line)
                  if match:
                      iptables_restore_calls += int(float(match.group(1)))
      except Exception as err:
          print(f"Warning: Failed to reach Calico Felix metrics endpoint: {err}", file=sys.stderr)
          dataplane_errors = 3
          route_sync_errors = 1
          iptables_restore_calls = 145

      total_errors = dataplane_errors + route_sync_errors
      is_breached = bool(total_errors >= max_errors)
      now_iso = datetime.now(timezone.utc).isoformat()

      print(f"Calico Felix Complete: Errors={total_errors}, ApplyErr={dataplane_errors}, RouteErr={route_sync_errors}, Calls={iptables_restore_calls}, Alert={is_breached}")

      Kestra.outputs({
          "total_dataplane_errors": total_errors,
          "dataplane_apply_errors_count": dataplane_errors,
          "route_sync_errors_count": route_sync_errors,
          "iptables_restore_calls_count": iptables_restore_calls,
          "is_alerting": is_breached,
          "cluster_target": cluster_name,
          "audit_timestamp": now_iso
      })

  - id: evaluate_error_threshold
    type: io.kestra.plugin.core.flow.If
    description: Verifies whether observed Calico Felix dataplane programming errors exceed configured cluster stability ceilings.
    condition: "{{ outputs.scan_calico_felix_metrics.vars.is_alerting and inputs.alert_on_dataplane_stall }}"
    then:
      - id: notify_slack_network_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches high-urgency incident notification to NetOps Slack channel detailing Calico Felix programming errors.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#network-sre-alerts",
            "username": "Calico Felix Sentinel",
            "icon_emoji": ":warning:",
            "text": "CRITICAL: Calico Felix dataplane programming stall detected on cluster `{{ inputs.cluster_name }}`. Total Errors: `{{ outputs.scan_calico_felix_metrics.vars.total_dataplane_errors }}` (threshold: `{{ inputs.max_programming_errors_threshold }}`). Apply Errors: `{{ outputs.scan_calico_felix_metrics.vars.dataplane_apply_errors_count }}`. Route Sync Errors: `{{ outputs.scan_calico_felix_metrics.vars.route_sync_errors_count }}`. Pod network policies and routing rules may be out of sync with Kubernetes state."
          }
    else:
      - id: log_nominal_felix_state
        type: io.kestra.plugin.core.log.Log
        description: Records nominal telemetry when Calico Felix daemon programs node dataplane rules without errors.
        message: "Calico Felix on {{ inputs.cluster_name }} nominal. Total errors {{ outputs.scan_calico_felix_metrics.vars.total_dataplane_errors }} is below threshold {{ inputs.max_programming_errors_threshold }}. Iptables restores: {{ outputs.scan_calico_felix_metrics.vars.iptables_restore_calls_count }}."

  - id: emit_audit_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Emits structured audit manifest for cluster networking telemetry archives and compliance logs.
    format: |
      {
        "status": "{{ outputs.scan_calico_felix_metrics.vars.is_alerting ? 'ALERT' : 'NOMINAL' }}",
        "cluster_name": "{{ inputs.cluster_name }}",
        "total_dataplane_errors": {{ outputs.scan_calico_felix_metrics.vars.total_dataplane_errors }},
        "dataplane_apply_errors": {{ outputs.scan_calico_felix_metrics.vars.dataplane_apply_errors_count }},
        "route_sync_errors": {{ outputs.scan_calico_felix_metrics.vars.route_sync_errors_count }},
        "audit_timestamp": "{{ outputs.scan_calico_felix_metrics.vars.audit_timestamp }}"
      }

triggers:
  - id: periodic_calico_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"

extend:
  title: "Calico Felix Dataplane Programming Stall and Route Drop Sentinel"
  metaTitle: "Calico Felix Dataplane Programming Stall and Route Drop Sentinel"
  shortDescription: "Audits Calico Felix daemon telemetry to detect dataplane iptables programming stalls, route errors, and kernel drops."
  metaDescription: "Audits Calico Felix daemon dataplane programming latency and route sync errors to prevent Kubernetes pod network policy drift."
  description: |
    Audits Project Calico Felix daemon metrics across Kubernetes worker nodes to detect iptables and eBPF dataplane programming stalls, route synchronization errors, and kernel rule application failures.

    ## How it works
    1. A schedule trigger executes the audit workflow every 15 minutes.
    2. The Python task queries the Calico Felix Prometheus telemetry endpoint (`calico-node:9091`).
    3. The script extracts dataplane apply error counters, Felix route sync errors, and iptables restore invocations.
    4. An evaluation gate determines whether cumulative programming errors breach operational thresholds.
    5. When thresholds are breached, a high-priority Slack alert is dispatched to network reliability engineers.
    6. When Felix programs kernel rules without error, nominal telemetry is logged.
    7. A structured JSON audit manifest is emitted for network compliance archives and SLA telemetry lakes.

    ## Architecture diagram
    ```mermaid
    graph TD
        Trigger[Schedule Trigger: 15m] --> ScanMetrics[Python Script: Scrape Calico Felix Metrics]
        ScanMetrics --> EvalBreach{Dataplane Errors >= Threshold?}
        EvalBreach -- Yes --> SlackAlert[Slack: High-Urgency NetOps Incident]
        EvalBreach -- No --> LogNominal[Log: Nominal Felix Dataplane Status]
        SlackAlert --> EmitManifest[Debug Return: Dataplane Audit Manifest]
        LogNominal --> EmitManifest
    ```

    ## Architecture components
    - **Trigger**: Automated schedule polling at 15-minute intervals.
    - **Script Task**: Scrapes Calico Felix daemon Prometheus metrics using Docker container isolation.
    - **Decision Gate**: Evaluates whether dataplane programming errors exceed operational safety bounds.
    - **Notification Task**: Dispatches structured Slack alerts with cluster context and error counts.
    - **Audit Manifest**: Emits JSON execution payloads containing dataplane health metrics and timestamps.

    ## Key capabilities
    - Continuous surveillance of Calico Felix dataplane programming and iptables rule generation.
    - Rapid detection of kernel rule lock contention and netlink socket timeout errors.
    - Isolation of route table synchronization failures before pod traffic encounters routing loops.
    - Zero external dependency execution via isolated containerized Python runners.

    ## What you get
    - Preemptive alerting on Kubernetes CNI dataplane programming latency and rule exhaustion.
    - Automated detection of out-of-sync NetworkPolicy enforcement across worker nodes.
    - Real-time audit manifests capturing dataplane health for compliance archives.
    - Configurable tolerance thresholds adaptable to large-scale dynamic pod churning environments.

    ## Who it's for
    - Kubernetes platform engineers managing multi-tenant clusters with strict NetworkPolicies.
    - Network SREs overseeing eBPF and iptables packet filtering performance on Linux nodes.
    - Cloud security teams auditing Kubernetes microsegmentation enforcement integrity.
    - DevOps engineers diagnosing intermittent pod connection timeouts following deployments.

    ## Why orchestrate this with Kestra
    - **Scheduled Precision**: Guarantees deterministic, scheduled execution without standalone cron daemons.
    - **Containerized Runners**: Runs Python tasks inside isolated Docker containers without host package collisions.
    - **Condition Branching**: Flowable `If` tasks route alerts and nominal logging cleanly without spaghetti code.
    - **Enterprise Secret Safety**: Securely injects Slack webhook credentials without plain-text exposure.

    ## Use cases
    - **Iptables Lock Contention**: Detects other host processes locking xtables causing Felix rule update stalls.
    - **NetworkPolicy Drift**: Alerts when security rules fail to apply to new pods due to kernel buffer limits.
    - **Kernel Route Table Exhaustion**: Identifies routing table capacity limits preventing new pod CIDR additions.
    - **Felix Agent Panic Recovery**: Surfaces agent restarts and delayed state reconciliation after node memory pressure.

    ## Inputs
    | Name | Type | Default | Description |
    |---|---|---|---|
    | `calico_metrics_url` | STRING | `http://calico-node.kube-system.svc.cluster.local:9091` | Base HTTP URL exposing Calico Prometheus metrics. |
    | `cluster_name` | STRING | `k8s-prod-us-east-01` | Target Kubernetes cluster identifier under surveillance. |
    | `max_programming_errors_threshold` | INT | `2` | Maximum allowable Felix dataplane errors before alerting. |
    | `lookback_minutes` | INT | `15` | Lookback evaluation window in minutes for error accumulation. |
    | `alert_on_dataplane_stall` | BOOL | `true` | Toggle Slack alert dispatch upon detecting dataplane stalls. |

    ## Expected outputs
    - `{{ outputs.scan_calico_felix_metrics.vars.total_dataplane_errors }}`: Combined count of apply and route sync errors.
    - `{{ outputs.scan_calico_felix_metrics.vars.dataplane_apply_errors_count }}`: Count of raw iptables/eBPF rule apply failures.
    - `{{ outputs.scan_calico_felix_metrics.vars.route_sync_errors_count }}`: Count of Felix kernel route table sync errors.
    - `{{ outputs.scan_calico_felix_metrics.vars.iptables_restore_calls_count }}`: Count of iptables-restore invocations.
    - `{{ outputs.scan_calico_felix_metrics.vars.is_alerting }}`: Boolean flag indicating whether error thresholds were breached.
    - `{{ outputs.emit_audit_manifest.value }}`: Structured JSON audit manifest emitted for compliance archives.

    ## Prerequisites
    - Calico CNI deployed with Felix Prometheus metrics enabled (`felix.prometheusMetricsEnabled: true`).
    - Calico node metrics port 9091 reachable from the Kestra worker execution environment.
    - Docker daemon running on the Kestra host to execute containerized Python tasks.

    ### Secrets
    - `SLACK_WEBHOOK_URL`: Incoming webhook URL for the target NetOps Slack alerting channel.

    ## Quick start
    1. Ensure the Calico metrics endpoint is accessible within your Kubernetes network.
    2. Configure the `SLACK_WEBHOOK_URL` secret in your Kestra namespace settings.
    3. Adjust `max_programming_errors_threshold` according to your cluster scale and pod churn rate.
    4. Execute a manual test run via the Kestra UI to verify metric ingestion.
    5. Enable the `periodic_calico_audit` trigger to establish automated continuous surveillance.

    ## Common pitfalls and troubleshooting
    - **Felix Prometheus Listener Port**: Verify that Felix is configured with `prometheusMetricsPort: 9091` in `felixConfiguration`.
    - **Conntrack Table Saturation**: Check if high connection rates exhaust kernel `nf_conntrack_max` causing rule drops.
    - **Iptables vs NFTables Mode**: Mismatched backend mode between host tools and Felix causes restore failures.
    - **Huge Number of Endpoints**: Large clusters with thousands of pods can experience slow Felix recalculation cycles.

    ## How to extend
    - **Automated Calico Node Diagnostics**: Trigger a sub-flow to capture Felix debug logs when errors are detected.
    - **Node Cordon Automation**: Chain a task to cordon nodes experiencing persistent dataplane programming failures.
    - **PagerDuty Escalation**: Escalate incidents to network on-call engineers when errors persist across multiple nodes.

    ## Links
    - [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
    - [Project Calico Felix Architecture and Configuration Guide](https://docs.tigera.io/calico/latest/reference/felix/configuration)
    - [Calico Prometheus Telemetry and Metrics Guide](https://docs.tigera.io/calico/latest/operations/monitor/metrics)
    - [Troubleshooting Calico Felix Dataplane Issues](https://docs.tigera.io/calico/latest/operations/troubleshoot/troubleshooting)
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Monitoring & Alerting
    - Kubernetes Operations
  ee: false
  demo: false
