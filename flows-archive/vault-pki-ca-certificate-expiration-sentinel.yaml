id: vault-pki-ca-certificate-expiration-sentinel
namespace: company.security

inputs:
  - id: vault_addr
    type: STRING
    defaults: "http://vault.internal:8200"
    description: Host and port of the HashiCorp Vault server.
  - id: pki_mount
    type: STRING
    defaults: "pki"
    description: PKI secrets engine mount path.
  - id: min_days_remaining
    type: INT
    defaults: 30
    description: "Minimum allowable days before CA certificate expiration (default 30 days)."

tasks:
  - id: inspect_ca_expiration
    type: io.kestra.plugin.scripts.shell.Commands
    commands:
      - |
        # Query HashiCorp Vault PKI CA certificate
        curl -s "{{ inputs.vault_addr }}/v1/{{ inputs.pki_mount }}/ca/pem" > /tmp/vault_ca.pem

        python3 -c "
        import subprocess, time
        from datetime import datetime, timezone
        try:
            res = subprocess.check_output(['openssl', 'x509', '-enddate', '-noout', '-in', '/tmp/vault_ca.pem'], text=True)
            end_date_str = res.strip().replace('notAfter=', '')
            exp_dt = datetime.strptime(end_date_str, '%b %d %H:%M:%S %Y %Z').replace(tzinfo=timezone.utc)
            days_left = (exp_dt - datetime.now(timezone.utc)).total_seconds() / 86400.0
            is_breach = 1 if days_left <= {{ inputs.min_days_remaining }} else 0
            print(f'{is_breach}|{days_left:.1f}|{end_date_str}')
        except Exception:
            print('0|999|unknown')
        " > /tmp/vault_summary.txt

        IS_BREACH=$(cut -d '|' -f 1 /tmp/vault_summary.txt)
        DAYS_LEFT=$(cut -d '|' -f 2 /tmp/vault_summary.txt)
        EXP_DATE=$(cut -d '|' -f 3 /tmp/vault_summary.txt)
        
        echo "::set-output name=is_breach::${IS_BREACH:-0}::"
        echo "::set-output name=days_left::$DAYS_LEFT::"
        echo "::set-output name=exp_date::$EXP_DATE::"

  - id: evaluate_ca_validity
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.inspect_ca_expiration.vars.is_breach | int == 1 }}"
    then:
      - id: notify_security_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#security-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 HashiCorp Vault PKI Root/Intermediate CA Expiration Warning",
                "text": "Vault PKI mount {{ inputs.pki_mount }} at {{ inputs.vault_addr }} expires in {{ outputs.inspect_ca_expiration.vars.days_left }} days (Expiration Date: {{ outputs.inspect_ca_expiration.vars.exp_date }}). When the CA expires, all issued TLS certificates become invalid.",
                "footer": "Kestra Security Sentinel • HashiCorp Vault"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#security-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ Vault Sentinel Failure",
            "text": "Failed to fetch CA certificate from Vault PKI mount {{ inputs.pki_mount }} at {{ inputs.vault_addr }}.",
            "footer": "Kestra Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 0 * * *"
    disabled: true

extend:
  metaDescription: "Audits HashiCorp Vault PKI secrets engine to detect expiring root and intermediate CA certificates."
  metaTitle: HashiCorp Vault PKI CA Certificate Expiration Sentinel with Kestra
  ee: false
  demo: false
  title: HashiCorp Vault PKI CA Certificate Expiration Sentinel
  shortDescription: Audits HashiCorp Vault PKI secrets engine to detect expiring root and intermediate CA certificates.
  description: |
    ## How it works
    This workflow queries the public CA certificate endpoint (`/v1/{mount}/ca/pem`) of a HashiCorp Vault PKI secrets engine and parses the X.509 `notAfter` validity timestamp using OpenSSL. In enterprise infrastructure, Vault PKI issues internal microservice TLS certificates and mTLS service mesh identities. If the underlying intermediate or root Certificate Authority (CA) expires, all downstream leaf certificates become invalid immediately, triggering widespread mTLS handshake failures. This sentinel audits CA validity and alerts security teams weeks before certificate rotation deadlines.

    ## What you get
    - Continuous surveillance of HashiCorp Vault PKI CA certificate validity.
    - Protection against enterprise-wide TLS/mTLS outages.
    - Automated Slack incident notifications with exact days remaining until expiration.

    ## Who it's for
    - Security Engineers managing internal PKI certificate authorities.
    - Platform Engineers maintaining Istio, Linkerd, or Envoy mTLS meshes.
    - SREs safeguarding zero-trust network encryption.

    ## Why orchestrate this with Kestra
    - **Scheduled Daily Surveillance**: Automatically audits CA certificates on a daily schedule.
    - **Native API Capabilities**: Interacts directly with standard unauthenticated CA PEM endpoints.
    - **Security Governance**: Provides historical logs of PKI validity audits.

    ## Prerequisites
    - HashiCorp Vault server with PKI secrets engine enabled.
    - OpenSSL utility installed in the runner container.
    - Slack incoming webhook URL configured in `SLACK_WEBHOOK` secret.

    ## Quick start
    1. Import this blueprint into your Kestra workspace.
    2. Add `SLACK_WEBHOOK` secret to your namespace.
    3. Specify `vault_addr`, `pki_mount`, and `min_days_remaining`.
    4. Enable the schedule trigger for daily certificate surveillance.

    ## How to extend
    - Trigger an automated intermediate CA rotation workflow via Vault API.
    - Audit multiple PKI mounts in parallel across multiple environments.
    - Route critical alerts to PagerDuty or Opsgenie.

    ## Links
    - [HashiCorp Vault PKI Secrets Engine API](https://developer.hashicorp.com/vault/api-docs/secret/pki)
    - [Kestra Shell Plugin](https://kestra.io/plugins/plugin-scripts-shell)
    - [Kestra Slack Notifications](https://kestra.io/plugins/plugin-slack)
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Day 2 Operations
    - Infrastructure Automation
