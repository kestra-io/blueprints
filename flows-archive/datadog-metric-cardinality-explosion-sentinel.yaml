id: datadog-metric-cardinality-explosion-sentinel
namespace: company.sre

inputs:
  - id: dd_site
    type: STRING
    defaults: "datadoghq.com"
    description: Datadog site hostname (e.g., datadoghq.com, datadoghq.eu, us3.datadoghq.com).
  - id: target_metric
    type: STRING
    defaults: "http.requests"
    description: Key custom metric name to evaluate for tag cardinality explosion.
  - id: tag_cardinality_threshold
    type: INT
    defaults: 500
    description: Maximum acceptable count of distinct tag combinations for the metric.

tasks:
  - id: audit_tag_cardinality
    type: io.kestra.plugin.scripts.shell.Commands
    containerImage: ghcr.io/kestra-io/tools:latest
    commands:
      - |
        curl -s -G "https://api.{{ inputs.dd_site }}/api/v2/metrics/{{ inputs.target_metric }}/all-tags"           -H "DD-API-KEY: {{ secret('DATADOG_API_KEY') }}"           -H "DD-APPLICATION-KEY: {{ secret('DATADOG_APP_KEY') }}" > /tmp/metric_tags.json
        
        TAG_COUNT=$(jq '.data.attributes.tags | length // 0' /tmp/metric_tags.json)
        SAMPLE_TAGS=$(jq -c '.data.attributes.tags[0:10] // []' /tmp/metric_tags.json)
        
        echo "::set-output name=tag_count::$TAG_COUNT::"
        echo "::set-output name=sample_tags::$SAMPLE_TAGS::"

  - id: evaluate_cardinality_limit
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.audit_tag_cardinality.vars.tag_count | int > inputs.tag_cardinality_threshold }}"
    then:
      - id: notify_platform_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#observability-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 Datadog Metric Tag Cardinality Explosion Alert",
                "text": "Metric `{{ inputs.target_metric }}` has reached *{{ outputs.audit_tag_cardinality.vars.tag_count }}* distinct tag combinations, exceeding threshold *{{ inputs.tag_cardinality_threshold }}*. Sample tags: {{ outputs.audit_tag_cardinality.vars.sample_tags }}. Impact: Unbound cardinality incurs exponential custom metric billing and impairs dashboard render latency.",
                "footer": "Kestra Observability Sentinel • Datadog Cardinality"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#observability-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ Datadog Cardinality Sentinel Execution Error",
            "text": "The Datadog metric tag cardinality audit workflow encountered an execution error. Please verify API and Application keys.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 * * * *"
    disabled: true

extend:
  metaDescription: "Audits Datadog custom metric tag configurations to detect high-cardinality explosions and custom metric bill surges."
  metaTitle: Datadog Custom Metric High Tag Cardinality Explosion Sentinel with Kestra
  title: Datadog Custom Metric High Tag Cardinality Explosion Sentinel
  shortDescription: Audits Datadog custom metric tag configurations to detect high-cardinality explosions and custom metric bill surges.
  description: |
    ## How it works
    This workflow connects to the Datadog API v2 endpoint `/api/v2/metrics/{metric_name}/all-tags` to evaluate the active tag dimensionality of critical application metrics. When developers accidentally attach high-cardinality identifiers (such as user IDs, UUIDs, or timestamps) as tags, cardinality multiplies exponentially. If the total number of distinct tag values exceeds the threshold, an immediate incident alert is triggered to Slack.

    ## What you get
    - Immediate detection of accidental UUID or user-id tag contamination.
    - Prevents surprise 5-figure custom metric invoices from observability vendors.
    - Actionable feedback identifying specific problematic metric tags.

    ## Who it's for
    - SREs and Observability Engineers governing Datadog metric quotas and cost budgets.
    - Platform teams guiding developers on telemetry best practices.

    ## Why orchestrate this with Kestra
    - **Automated Hygiene**: Run continuous cardinality audits across key business and technical metrics.
    - **Multi-Cloud Ready**: Easily monitor across multiple Datadog orgs and geographical sites.
    - **Extensible Governance**: Automatically post alerts to internal developer channels or mute runaway metrics.

    ## Prerequisites
    - Datadog API Key and Application Key with permissions to read metric metadata.
    - Secrets `DATADOG_API_KEY`, `DATADOG_APP_KEY`, and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import this blueprint into Kestra.
    2. Configure Datadog API keys and Slack webhook secret.
    3. Run the workflow with your target metric name to inspect its tag dimensionality.

    ## How to extend
    - Iterate through an array of key business metrics dynamically using a loop task.
    - Call the Datadog API to configure tag configuration exclusions automatically.

    ## Links
    - [Datadog Metrics API v2 Documentation](https://docs.datadoghq.com/api/latest/metrics/#view-tags-and-facets-for-a-metric)
    - [Kestra Shell Plugin](https://kestra.io/plugins/plugin-scripts/commands/io.kestra.plugin.scripts.shell.commands)
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Day 2 Operations
    - Infrastructure Automation
  ee: false
  demo: false
