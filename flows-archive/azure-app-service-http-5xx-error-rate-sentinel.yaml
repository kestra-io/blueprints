id: azure-app-service-http-5xx-error-rate-sentinel
namespace: company.cloud

inputs:
  - id: subscription_id
    type: STRING
    description: Azure Subscription ID.
  - id: resource_group
    type: STRING
    description: Azure Resource Group name.
  - id: app_name
    type: STRING
    description: Azure App Service Web App name.
  - id: error_threshold
    type: INT
    defaults: 20
    description: "Maximum allowable HTTP 5xx server errors in 5-minute sampling interval (default 20)."

tasks:
  - id: check_http_5xx_metrics
    type: io.kestra.plugin.scripts.shell.Commands
    containerImage: mcr.microsoft.com/azure-cli:latest
    commands:
      - |
        az login --service-principal -u "{{ secret('AZURE_CLIENT_ID') }}" -p "{{ secret('AZURE_CLIENT_SECRET') }}" --tenant "{{ secret('AZURE_TENANT_ID') }}" --output none
        az account set --subscription "{{ inputs.subscription_id }}"
        
        RESOURCE_ID="/subscriptions/{{ inputs.subscription_id }}/resourceGroups/{{ inputs.resource_group }}/providers/Microsoft.Web/sites/{{ inputs.app_name }}"
        
        az monitor metrics list           --resource "$RESOURCE_ID"           --metric "Http5xx"           --interval PT5M           --output json > /tmp/app_telemetry.json
        
        ERRORS_5XX=$(jq '[.value[]?.timeseries[]?.data[]?.total // 0] | add // 0' /tmp/app_telemetry.json)
        echo "::set-output name=http_5xx_count::$ERRORS_5XX::"

  - id: evaluate_5xx_errors
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.check_http_5xx_metrics.vars.http_5xx_count | int > inputs.error_threshold }}"
    then:
      - id: notify_devops_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#cloud-ops",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 Azure App Service HTTP 5xx Outage Alert",
                "text": "Web App `{{ inputs.app_name }}` emitted *{{ outputs.check_http_5xx_metrics.vars.http_5xx_count }} HTTP 5xx errors* over the last 5 minutes (threshold {{ inputs.error_threshold }}). Immediate investigation of application logs is recommended.",
                "footer": "Kestra Cloud Sentinel • Microsoft Azure"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#cloud-ops",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ Azure App Service Sentinel Failure",
            "text": "Failed to query Azure Monitor metrics for App Service. Verify web app name and resource group.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  metaDescription: "Detects elevated HTTP 5xx server error anomalies on Azure App Service web applications to prevent customer-facing service outages."
  metaTitle: Microsoft Azure App Service HTTP 5xx Server Error Anomaly Sentinel with Kestra
  title: Microsoft Azure App Service HTTP 5xx Server Error Anomaly Sentinel
  shortDescription: Detects elevated HTTP 5xx server error anomalies on Azure App Service web applications to prevent customer-facing service outages.
  description: |
    ## How it works
    This workflow connects to Azure Monitor via the Azure CLI container to poll the `Http5xx` metric on target Azure App Service web applications. HTTP 5xx status codes indicate unhandled backend application crashes, fatal framework runtime errors, database connection dropouts, or container initialization failures. When the aggregated 5xx error volume exceeds defined thresholds, the flow captures the error telemetry and immediately triggers a high-priority incident alert to Slack.

    ## What you get
    - Real-time detection of user-facing production application failures.
    - Protects customer experience and SLA commitments against silent failures.
    - Quantitative error count reporting over rolling intervals.

    ## Who it's for
    - DevOps Engineers and Site Reliability Engineers managing web applications on Azure.
    - Application support teams responsible for uptime and incident resolution.

    ## Why orchestrate this with Kestra
    - **Continuous Health Verification**: Automated interval execution catches application regressions immediately post-deployment.
    - **Zero Infrastructure Footprint**: Executes inside lightweight container tasks with no external agent installations.
    - **Standardized Notifications**: Sends cleanly formatted Slack incident notifications with context.

    ## Prerequisites
    - Azure Service Principal with `Monitoring Reader` access on the App Service resource.
    - Secrets `AZURE_CLIENT_ID`, `AZURE_CLIENT_SECRET`, `AZURE_TENANT_ID`, and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import the blueprint.
    2. Set subscription ID, resource group, and App Service web app name.
    3. Run the workflow to inspect current error rates.

    ## How to extend
    - Trigger an automated restart of the App Service using `az webapp restart` if errors persist across consecutive runs.
    - Query Azure Application Insights to extract the top unhandled exception stack traces.

    ## Links
    - [Monitor Apps in Azure App Service](https://learn.microsoft.com/en-us/azure/app-service/web-sites-monitor)
    - [Kestra Documentation](https://kestra.io/docs)
  tags:
    - Cloud
    - Infrastructure
  subTags:
    - Azure Services
    - Infrastructure Automation
  ee: false
  demo: false
