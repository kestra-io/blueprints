id: snowflake-pipe-load-error-rate-sentinel
namespace: company.data

inputs:
  - id: account
    type: STRING
    description: Snowflake account identifier.
  - id: username
    type: STRING
    description: Snowflake username.
  - id: database
    type: STRING
    defaults: "SNOWFLAKE"
    description: Snowflake database name.
  - id: schema
    type: STRING
    defaults: "ACCOUNT_USAGE"
    description: Snowflake schema name.
  - id: table_name
    type: STRING
    description: Fully qualified table name receiving Snowpipe loads.

tasks:
  - id: query_pipe_load_errors
    type: io.kestra.plugin.jdbc.snowflake.Query
    url: "jdbc:snowflake://{{ inputs.account }}.snowflakecomputing.com"
    username: "{{ inputs.username }}"
    password: "{{ secret('SNOWFLAKE_PASSWORD') }}"
    database: "{{ inputs.database }}"
    schema: "{{ inputs.schema }}"
    sql: |
      SELECT 
        COUNT(*) AS failed_loads,
        COALESCE(MAX(FIRST_ERROR_MESSAGE), 'None') AS error_sample
      FROM TABLE(INFORMATION_SCHEMA.COPY_HISTORY(
        TABLE_NAME => '{{ inputs.table_name }}',
        START_TIME => DATEADD('hour', -1, CURRENT_TIMESTAMP())
      ))
      WHERE STATUS = 'LOAD_FAILED';
    fetchOne: true

  - id: evaluate_load_errors
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.query_pipe_load_errors.row.failed_loads | int > 0 }}"
    then:
      - id: notify_data_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#data-platform-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 Snowflake Snowpipe Ingestion Failed Alert",
                "text": "Table `{{ inputs.table_name }}` experienced *{{ outputs.query_pipe_load_errors.row.failed_loads }} LOAD_FAILED events* in Snowpipe over the last hour! Error sample: `{{ outputs.query_pipe_load_errors.row.error_sample }}`. Schema drift, invalid JSON syntax, or data type mismatch in cloud staging files.",
                "footer": "Kestra Data Sentinel • Snowflake Snowpipe"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#data-platform-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ Snowflake Snowpipe Sentinel Failure",
            "text": "Failed to query Snowflake COPY_HISTORY. Verify account, credentials, and table existence.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/30 * * * *"
    disabled: true

extend:
  metaDescription: "Audits Snowflake Snowpipe COPY_HISTORY for ingestion load failures and malformed staging data files."
  metaTitle: Snowflake Snowpipe Continuous Ingestion Load Failure Sentinel with Kestra
  title: Snowflake Snowpipe Continuous Ingestion Load Failure Sentinel
  shortDescription: Audits Snowflake Snowpipe COPY_HISTORY for ingestion load failures and malformed staging data files.
  description: |
    ## How it works
    This workflow connects to Snowflake using the native JDBC Snowflake plugin to query `INFORMATION_SCHEMA.COPY_HISTORY` for tables populated via Snowpipe. In continuous cloud object storage ingestion (S3, GCS, Azure Blob), upstream microservices or third-party webhooks frequently produce malformed JSON/Parquet files, introduce unexpected schema changes, or corrupt character encodings. When Snowpipe encounters bad files, it logs `LOAD_FAILED` status and halts ingestion for those specific blobs. This workflow inspects recent copy operations, detects failures, and escalates error samples to data engineers.

    ## What you get
    - Real-time detection of continuous data ingestion failures in Snowflake.
    - Prevents silent telemetry loss and broken analytical reporting tables.
    - Quantitative tracking of failed load events with error samples.

    ## Who it's for
    - Data Engineers and Analytics Platform Architects.
    - Database Administrators managing automated cloud data warehouses.

    ## Why orchestrate this with Kestra
    - **Native Snowflake Driver Integration**: Secure, high-speed query execution without external CLI wrappers.
    - **Proactive Data Quality Assurance**: Flags malformed files immediately rather than days later.
    - **Instant Team Escalation**: Delivers structured notifications with error samples directly to Slack.

    ## Prerequisites
    - Snowflake account and user with permissions to query `INFORMATION_SCHEMA.COPY_HISTORY`.
    - Secrets `SNOWFLAKE_PASSWORD` and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import the blueprint.
    2. Input Snowflake account, username, and target table name.
    3. Run the workflow to inspect Snowpipe ingestion errors.

    ## How to extend
    - Query `VALIDATE_PIPE_LOAD` to extract line numbers and column names causing the load failures.
    - Automatically quarantine failing cloud storage objects to an error bucket.

    ## Links
    - [Snowflake COPY_HISTORY Documentation](https://docs.snowflake.com/en/sql-reference/functions/copy_history)
    - [Kestra Documentation](https://kestra.io/docs)
  tags:
    - Data
    - Cloud
  subTags:
    - ELT & Data Landing
    - Infrastructure Automation
  ee: false
  demo: false
