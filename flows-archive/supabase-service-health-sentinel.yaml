id: supabase-service-health-sentinel
namespace: company.team
description: |
  Every 5 minutes, read the service health of a Supabase project from the
  Supabase Management API (read-only: nothing is restarted, paused or
  changed) and classify it as HEALTHY, WARNING, CRITICAL or UNREACHABLE.
  Log quiet runs and alert Slack when the database, Auth, REST, Realtime,
  Storage or the connection pooler is unhealthy or still coming up.

inputs:
  - id: services
    type: STRING
    defaults: "auth,db,pooler,realtime,rest,storage"
    displayName: "Services to Check"
    description: "Comma-separated Supabase services to check: any of auth, db, db_postgres_user, pooler, realtime, rest, storage, pg_bouncer."
  - id: timeout_ms
    type: INT
    defaults: 5000
    displayName: "Health Probe Timeout (ms)"
    description: "How long Supabase waits for each service probe before reporting it, from 0 to 10000."

triggers:
  - id: health_check
    type: io.kestra.plugin.core.trigger.Schedule
    description: Check service health every 5 minutes. Shipped disabled; enable it once the Supabase secrets are set and a manual run has been verified.
    cron: "*/5 * * * *"
    disabled: true

tasks:
  - id: get_service_health
    type: io.kestra.plugin.core.http.Request
    description: Read the health status of each selected service of the project from the Supabase Management API. This is a GET; no service is restarted and no setting is changed.
    uri: "https://api.supabase.com/v1/projects/{{ secret('SUPABASE_PROJECT_REF') }}/health?services={{ inputs.services | replace({' ': ''}) }}&timeout_ms={{ inputs.timeout_ms }}"
    method: GET
    headers:
      Authorization: "Bearer {{ secret('SUPABASE_ACCESS_TOKEN') }}"
    options:
      allowFailed: true
      timeout:
        connectTimeout: PT10S
        readIdleTimeout: PT30S
    retry:
      type: constant
      interval: PT10S
      maxAttempts: 3
    allowFailure: true

  - id: summarize_health
    type: io.kestra.plugin.core.debug.Return
    description: List services whose status is UNHEALTHY (with the error Supabase returns) and services still COMING_UP, count the healthy ones, and classify in one jq query. A missing or non-200 response, or an empty list, becomes UNREACHABLE.
    format: >-
      {{ (outputs.get_service_health.code is not defined or outputs.get_service_health.code != 200)
      ? '{"status":"UNREACHABLE","checked":0,"healthy":0,"unhealthy":"none","coming_up":"none"}'
      : (fromJson(outputs.get_service_health.body) | jq('
      (if type == "array" then . else [] end) as $s
      | [$s[] | select(.status == "UNHEALTHY" or (.status == null and .healthy == false))
      | (.name + (if (.error // "") == "" then "" else " (" + (.error | tostring | split("\"") | join("") | split("\n") | join(" ") | .[0:80]) + ")" end))] as $bad
      | [$s[] | select(.status == "COMING_UP") | .name] as $up
      | {checked: ($s | length), healthy: ([$s[] | select(.status == "ACTIVE_HEALTHY")] | length),
      unhealthy: (if ($bad | length) == 0 then "none" else ($bad | join("; ")) end),
      coming_up: (if ($up | length) == 0 then "none" else ($up | join(", ")) end),
      status: (if ($s | length) == 0 then "UNREACHABLE"
      elif ($bad | length) > 0 then "CRITICAL"
      elif ($up | length) > 0 then "WARNING"
      else "HEALTHY" end)}
      ') | first | toJson) }}

  - id: route_by_health
    type: io.kestra.plugin.core.flow.Switch
    description: Route to a quiet log when every service is healthy, a Slack message when a service is still coming up, or a Slack page when a service is unhealthy or the Management API could not be read.
    value: "{{ fromJson(outputs.summarize_health.value).status }}"
    cases:
      "HEALTHY":
        - id: log_healthy
          type: io.kestra.plugin.core.log.Log
          description: Log a quiet line when the check is healthy; no Slack message is sent.
          message: "Supabase project healthy: {{ fromJson(outputs.summarize_health.value).healthy }} of {{ fromJson(outputs.summarize_health.value).checked }} services ACTIVE_HEALTHY ({{ inputs.services }})."
      "WARNING":
        - id: alert_warning_health
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: Post a Slack message when a service is still coming up, for example after a restart, a resize or an unpause.
          url: "{{ secret('SLACK_WEBHOOK') }}"
          payload: |
            {
              "text": "Supabase project WARNING: still coming up: {{ fromJson(outputs.summarize_health.value).coming_up }}. {{ fromJson(outputs.summarize_health.value).healthy }} of {{ fromJson(outputs.summarize_health.value).checked }} services healthy. If this persists, check the project in the Supabase dashboard. Execution {{ execution.id }}."
            }
      "CRITICAL":
        - id: alert_critical_health
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: Page Slack when a service reports UNHEALTHY, because the app built on this project is failing for users.
          url: "{{ secret('SLACK_WEBHOOK') }}"
          payload: |
            {
              "text": "Supabase project CRITICAL: unhealthy: {{ fromJson(outputs.summarize_health.value).unhealthy }}. {{ fromJson(outputs.summarize_health.value).healthy }} of {{ fromJson(outputs.summarize_health.value).checked }} services healthy. Sign-ins, queries or uploads may be failing; check the project logs and status.supabase.com now. Execution {{ execution.id }}."
            }
      "UNREACHABLE":
        - id: alert_unreachable_api
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: Page Slack when the health endpoint could not be read, indicating an outage, a wrong project ref or an invalid access token.
          url: "{{ secret('SLACK_WEBHOOK') }}"
          payload: |
            {
              "text": "Supabase health sentinel UNREACHABLE: the Management API did not return a usable health response (HTTP {{ outputs.get_service_health.code ?? 'no response' }}). Check the project ref and access token. Execution {{ execution.id }}."
            }
    defaults:
      - id: log_unclassified
        type: io.kestra.plugin.core.log.Log
        description: Fallback for any classification the cases above do not cover, so an unexpected value is visible in the logs.
        message: "Supabase health sentinel completed with an unexpected classification: {{ outputs.summarize_health.value }}."

  - id: log_audit_result
    type: io.kestra.plugin.core.log.Log
    description: Record one audit line for every run, whichever branch fired, so the health history stays queryable even if Slack delivery fails.
    message: "Supabase health sentinel audit: services={{ inputs.services }} http={{ outputs.get_service_health.code ?? 'n/a' }} summary={{ outputs.summarize_health.value }} execution={{ execution.id }}."

errors:
  - id: alert_flow_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alert Slack when the sentinel flow itself fails, so a broken check is never mistaken for a healthy project.
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "text": "Supabase health sentinel flow {{ flow.id }} FAILED (execution {{ execution.id }}). Project health is now unknown; check the task logs and the Supabase dashboard."
      }

outputs:
  - id: status
    type: STRING
    value: "{{ fromJson(outputs.summarize_health.value).status }}"

extend:
  title: "Supabase Service Health Sentinel"
  shortDescription: Read a Supabase project's service health every 5 minutes and alert Slack when the database, Auth, REST, Realtime, Storage or pooler is unhealthy.
  metaTitle: Supabase Service Health Sentinel for Kestra
  metaDescription: "Read Supabase project service health every 5 minutes, change nothing, and alert Slack when the database, Auth, Storage or pooler is unhealthy."
  description: |
    An app on Supabase depends on several services at once: Postgres, the connection pooler, the REST layer, Auth, Realtime and Storage. Any one of them can go unhealthy on its own, after a compute resize, a runaway query that exhausts connections, a project that was paused for inactivity, or a regional incident, and the symptom users see is just "can't log in" or "nothing loads". The dashboard shows the state, but nothing pages the team. This blueprint turns a scheduled, read-only call to the Supabase Management API into a service health gate: `io.kestra.plugin.core.http.Request` reads the health of each service, one jq query lists the unhealthy and starting ones, and the result routes to a quiet log or a Slack alert.

    ## How it works

    1. `get_service_health` (`io.kestra.plugin.core.http.Request`) calls `GET /v1/projects/{ref}/health?services=...&timeout_ms=...` with a personal access token as a bearer token. It is a read: nothing is restarted, paused or changed. Retries cover short network blips, and `allowFailed` plus `allowFailure` keep an API error from aborting the flow so it can be reported instead.
    2. `summarize_health` (`io.kestra.plugin.core.debug.Return`) first guards for a missing or non-200 response (`UNREACHABLE`). Otherwise one jq query reads each entry's `name`, `status` and `error`: any service with `status` `UNHEALTHY` is `CRITICAL`, any service still `COMING_UP` is `WARNING`, all `ACTIVE_HEALTHY` is `HEALTHY`, and an empty list is treated as `UNREACHABLE`.
    3. `route_by_health` (`io.kestra.plugin.core.flow.Switch`) branches on that classification: `HEALTHY` logs quietly, `WARNING` posts a Slack note, `CRITICAL` and `UNREACHABLE` page Slack. A `defaults` fallback logs anything unexpected.
    4. `log_audit_result` (`io.kestra.plugin.core.log.Log`) writes one audit line per run with the HTTP status and the full summary.
    5. The flow-level `errors` block pages Slack if the flow itself fails, and the `health_check` trigger runs every 5 minutes, shipped `disabled: true`.

    ## What you get

    - A 5-minute, read-only health check of every Supabase service your app uses, with no custom scripting and no extra plugin to install.
    - A `status` output (`HEALTHY` / `WARNING` / `CRITICAL` / `UNREACHABLE`) other flows can gate on, for example to hold a migration or a bulk import until the database is healthy again.
    - Slack messages that name the unhealthy service and the error Supabase reports for it.
    - An audit line on every run, separate from Slack.

    ## Who it's for

    - Startups and product teams whose app runs on Supabase and who have no separate uptime tooling.
    - Teams that run ETL, migrations or scheduled jobs against Supabase from Kestra.
    - Agencies that look after several client projects (run one flow per project ref).

    ## Why orchestrate this with Kestra

    The Supabase dashboard and status page show health when someone looks. Kestra turns a plain, read-only Management API call into a scheduled, typed classification with retries, a failure path and an execution history, and the `status` output lets the flows that write to Supabase pause automatically while a service is down.

    ## Prerequisites

    - A Supabase project and a personal access token (or an OAuth token with `projects:read`) from the account settings.
    - The project ref: the 20-letter id in the project URL (`https://<ref>.supabase.co`).
    - A Slack incoming webhook for the WARNING, CRITICAL, UNREACHABLE and flow-failure alerts.

    ### Secrets

    - `SUPABASE_ACCESS_TOKEN`: a personal access token (starts with `sbp_`) that can read the project.
    - `SUPABASE_PROJECT_REF`: the project ref of the project to watch.
    - `SLACK_WEBHOOK`: Slack incoming webhook used for every alert branch and the flow-failure alert.

    In Kestra OSS, secrets are supplied as environment variables prefixed `SECRET_` and base64-encoded, for example `SECRET_SUPABASE_ACCESS_TOKEN=$(echo -n 'sbp_xxxxxxxx' | base64)`, and read back with `{{ secret('SUPABASE_ACCESS_TOKEN') }}`. Use the Enterprise secrets backend for encryption at rest and access control.

    ## Quick start

    1. Create a personal access token in the Supabase account settings and copy the project ref.
    2. Add `SUPABASE_ACCESS_TOKEN`, `SUPABASE_PROJECT_REF` and `SLACK_WEBHOOK` as secrets.
    3. Run the flow manually and compare the services in the logs with the project status in the dashboard. Pausing and restoring a free test project is an easy way to see the `COMING_UP` branch.
    4. Enable `health_check`.

    ## How to extend

    - Wrap the request in a `ForEach` over several project refs to watch every project from one flow.
    - Add `db_postgres_user` to `services` to check that the `postgres` role can still log in.
    - Store the last status in a KV store and alert only when it changes, or only after two unhealthy runs in a row.
    - Chain a second request to `GET /v1/projects/{ref}` to also catch a project that was paused.

    ## Inputs

    - `services`: type STRING, default `auth,db,pooler,realtime,rest,storage`.
    - `timeout_ms`: type INT, default `5000`.

    ## Outputs

    - `status`: one of `HEALTHY`, `WARNING`, `CRITICAL`, `UNREACHABLE`.
    - Example path: `{{ fromJson(outputs.summarize_health.value).unhealthy }}` for the unhealthy services and their errors.

    ## Links

    - [Supabase Management API: get project service health](https://supabase.com/docs/reference/api/v1-get-services-health)
    - [Supabase Management API: authentication](https://supabase.com/docs/reference/api/introduction)
    - [Kestra HTTP Request task](https://kestra.io/plugins/core/tasks/http/io.kestra.plugin.core.http.request)
    - [Kestra Slack plugin](https://kestra.io/plugins/plugin-slack)

    ## Pitfalls

    - The Management API is rate limited per token; a 5-minute schedule for a handful of projects is well inside it, but do not poll every few seconds.
    - The older boolean `healthy` field is deprecated in favour of `status`; the jq reads `status` and only falls back to `healthy` if `status` is missing.
    - A paused project cannot serve traffic, so expect its services to come back unhealthy (or the call to fail) and page; disable the trigger for projects you pause on purpose.
    - This flow only reads; it never restarts, unpauses or resizes a project.
  tags:
    - Infrastructure
  subTags:
    - Monitoring & Alerting
  ee: false
  demo: false
