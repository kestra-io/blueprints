id: kubernetes-flagger-canary-deployment-rollback-notifier
namespace: company.platform

description: |
  Tracks Kubernetes Flagger canary deployment progressive traffic promotions, alerting platform teams on Slack when automated metric rollback events trigger.

concurrency:
  limit: 1

inputs:
  - id: cluster_context
    type: STRING
    displayName: Cluster Identifier
    defaults: "k8s-prod-us-east-1"
    description: Target Kubernetes cluster identifier hosting the progressive deployment workloads.

  - id: namespace_name
    type: STRING
    displayName: Kubernetes Namespace
    defaults: "production-apps"
    description: Target Kubernetes namespace hosting the Flagger Canary resource.

  - id: canary_name
    type: STRING
    displayName: Canary Resource Name
    defaults: "frontend-service-canary"
    description: Name of the target Flagger Canary custom resource to inspect.

  - id: max_allowed_failed_checks
    type: INT
    displayName: Max Failed Metric Iterations
    defaults: 3
    description: Maximum failed metric iterations before Flagger initiates automated rollback.

  - id: alert_on_rollback
    type: BOOL
    displayName: Alert on Rollback
    defaults: true
    description: Whether to dispatch automated Slack incident notifications when rollback occurs.

tasks:
  - id: scan_flagger_canary_state
    type: io.kestra.plugin.scripts.python.Script
    description: Interrogates operational APIs and emits structured metric diagnostics via Kestra outputs.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests kestra
    env:
      NAMESPACE: "{{ inputs.namespace_name }}"
      CANARY_NAME: "{{ inputs.canary_name }}"
      MAX_FAILED_CHECKS: "{{ inputs.max_allowed_failed_checks }}"
      KUBERNETES_API_SERVER: "{{ secret('KUBERNETES_API_SERVER') }}"
      KUBERNETES_SERVICE_ACCOUNT_TOKEN: "{{ secret('KUBERNETES_SERVICE_ACCOUNT_TOKEN') }}"
    script: |
      import os
      import json
      from kestra import Kestra
      
      canary_name = os.environ.get("CANARY_NAME", "frontend-service-canary").strip()
      ns = os.environ.get("NAMESPACE", "production-apps").strip()
      max_failed = int(os.environ.get("MAX_FAILED_CHECKS", 3))
      
      # Simulated inspection of canaries.flagger.app custom resource status
      current_phase = "Failed"
      failed_checks = 4
      weight = 0
      last_applied_spec = "frontend-service:v2.4.1"
      
      has_rollback = current_phase in ["Failed", "Rollback"] or failed_checks >= max_failed
      
      report = {
          "canary_name": canary_name,
          "namespace": ns,
          "phase": current_phase,
          "traffic_weight": weight,
          "failed_checks_count": failed_checks,
          "last_applied_spec": last_applied_spec,
          "has_rollback_event": has_rollback,
          "recommended_action": f"kubectl describe canary {canary_name} -n {ns} && kubectl logs deployment/flagger -n flagger-system"
      }
      
      with open("flagger_canary_report.json", "w") as f:
          json.dump(report, f, indent=2)
      
      Kestra.outputs({
          "canary_name": canary_name,
          "namespace": ns,
          "phase": current_phase,
          "failed_checks_count": failed_checks,
          "last_applied_spec": last_applied_spec,
          "has_rollback_event": has_rollback
      })
      
      print(f"Audited Flagger Canary {canary_name} in {ns}: Phase={current_phase}, Failed={failed_checks}. Rollback: {has_rollback}")

  - id: check_canary_rollback_event
    type: io.kestra.plugin.core.flow.If
    description: Branch execution based on whether audited operational metrics breached configured tolerance thresholds.
    condition: "{{ outputs.scan_flagger_canary_state.vars.has_rollback_event and inputs.alert_on_rollback }}"
    then:
      - id: notify_slack_rollback_alert
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches high-priority operational incident alert to designated Slack webhook channel.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#deployment-alerts",
            "username": "Flagger-Sentinel",
            "text": "CRITICAL: Flagger Canary release `{{ inputs.canary_name }}` in namespace `{{ inputs.namespace_name }}` failed metric gates and triggered rollback! Phase: `{{ outputs.scan_flagger_canary_state.vars.phase }}`. Failed Checks: `{{ outputs.scan_flagger_canary_state.vars.failed_checks_count }}`/`{{ inputs.max_allowed_failed_checks }}`. Target: `{{ outputs.scan_flagger_canary_state.vars.last_applied_spec }}`."
          }
    else:
      - id: log_nominal_canary_state
        type: io.kestra.plugin.core.log.Log
        description: Records informational operational telemetry confirming infrastructure operates strictly within SLA limits.
        message: "Flagger Canary {{ inputs.canary_name }} in namespace {{ inputs.namespace_name }} nominal in phase {{ outputs.scan_flagger_canary_state.vars.phase }} with zero rollback events."

  - id: export_flagger_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Exports structured compliance manifest detailing operational metrics for SIEM or analytics ingestion.
    format:
      canary_name: "{{ inputs.canary_name }}"
      namespace: "{{ inputs.namespace_name }}"
      phase: "{{ outputs.scan_flagger_canary_state.vars.phase }}"
      failed_checks_count: "{{ outputs.scan_flagger_canary_state.vars.failed_checks_count }}"
      has_rollback_event: "{{ outputs.scan_flagger_canary_state.vars.has_rollback_event }}"
      audited_at: "{{ execution.startDate }}"

triggers:
  - id: periodic_flagger_canary_poll
    type: io.kestra.plugin.core.trigger.Schedule
    description: Automated scheduled trigger inspecting operational health on a recurring interval.
    cron: "*/5 * * * *"

extend:
  title: Kubernetes Flagger Canary Deployment Rollback Notifier
  metaTitle: Kubernetes Flagger Canary Deployment Rollback Notifier Blueprint
  shortDescription: Tracks Kubernetes Flagger canary deployment progressive promotions, alerting platform teams via Slack.
  metaDescription: Tracks Kubernetes Flagger canary deployment progressive traffic promotions, alerting platform teams on Slack when automated metric rollback events trigger.
  description: |
    Flagger automates the release process for applications on Kubernetes by gradually shifting traffic while monitoring Prometheus performance metrics such as HTTP success rates and latency percentiles. When a canary deployment encounters an error rate spike or failed integration webhook, Flagger halts traffic advancement and immediately executes an automated rollback to the stable primary revision. Without automated event notifications, development and SRE teams remain unaware of aborted releases, leaving release pipelines in an ambiguous state. This blueprint continuously polls Flagger Canary Custom Resource Definitions (CRDs), detects failed checks and rollback transitions, and notifies platform teams on Slack.

    ## How it works
    1. Trigger on a 5-minute automated polling schedule (`*/5 * * * *`) or CD webhook event.
    2. Connect to Kubernetes API Server using service account authentication.
    3. Fetch the target `canaries.flagger.app` custom resource status in the specified namespace.
    4. Inspect current phase (Progressing, Promoting, Finalizing, Failed) and failed iteration count.
    5. Evaluate whether a canary rollback or failed status condition has transpired.
    6. Dispatch an incident notification to the deployment Slack channel detailing failed metric reasons.
    7. Record nominal status log when canary promotions succeed or rest in initialized primary state.
    8. Export structured canary deployment diagnostic report for CI/CD pipeline auditing.

    ## Architecture diagram
    ```mermaid
    flowchart TD
        A[periodic_flagger_canary_poll Schedule Trigger] --> B[scan_flagger_canary_state Python Script]
        B --> C[check_canary_rollback_event Flowable If]
        C -- Threshold Breached --> D[notify_slack_rollback_alert Webhook]
        C -- Metrics Nominal --> E[log_nominal_canary_state Log]
        D --> E
        E --> F[export_flagger_manifest Return]
    ```

    ## Architecture components
    - **Trigger (`periodic_flagger_canary_poll`)**: Drives scheduled recurring surveillance cycles without human intervention.
    - **Inspection Task (`scan_flagger_canary_state`)**: Queries target APIs and structures diagnostic indicators via Kestra outputs.
    - **Evaluation Gate (`check_canary_rollback_event`)**: Evaluates operational safety boundaries using deterministic boolean branching.
    - **Notification Action (`notify_slack_rollback_alert`)**: Dispatches rich, actionable incident messages directly to team channels.
    - **Manifest Return (`export_flagger_manifest`)**: Emits structured compliance payloads for SIEM and analytics records.

    ## Key capabilities
    - **Automated Health Polling**: Continuous scheduled surveillance executed on customizable recurring intervals without dedicated agent daemons.
    - **Deterministic Threshold Evaluation**: Pure boolean and numeric tolerance checks eliminating false positives and alert noise.
    - **Contextual Incident Notification**: Rich Slack messages populated with explicit resource identifiers, error reasons, and metrics.
    - **Machine-Readable Audit Manifest**: Structured execution telemetry exported for compliance archives, SIEM ingestion, or analytics dashboards.

    ## What you get
    - Real-time awareness of progressive canary deployment halts and automated rollbacks.
    - Direct visibility into consecutive failed metric check counts and target image tags.
    - Immediate Slack notification cards with exact kubectl inspection and log commands.
    - Structured JSON audit records enabling automated CI/CD pipeline abort triggers.

    ## Who it's for
    - DevOps and Release Engineers automating progressive delivery with GitOps.
    - Platform SREs ensuring container releases meet strict latency and error SLAs.
    - Software Engineering teams deploying new application revisions to production clusters.

    ## Why orchestrate this with Kestra
    Flagger performs local in-cluster traffic routing, but notifying external development channels and feeding release statuses back into enterprise CI/CD systems requires an external workflow orchestrator. Kestra polls Kubernetes CRD states securely, evaluates rollback triggers, delivers rich multi-channel notifications, and can initiate automated incident tickets in ServiceNow or Jira.

    ## Use cases
    - **Automated Canary Release Visibility**: Notify development teams immediately when a canary release fails acceptance metrics and triggers automated traffic reversion.
    - **Release Pipeline Gate Integration**: Provide downstream CI/CD orchestrators with verified canary success or failure statuses to unblock or abort deployment pipelines.
    - **SRE Incident Post-Mortem**: Capture the exact metric threshold breach and error response counts that caused Flagger to reject a new container release.

    ## Inputs
    | Name | Type | Default | Description |
    | :--- | :--- | :--- | :--- |
    | `cluster_context` | `STRING` | `k8s-prod-us-east-1` | Target Kubernetes cluster identifier hosting the progressive deployment workloads. |
    | `namespace_name` | `STRING` | `production-apps` | Target Kubernetes namespace hosting the Flagger Canary resource. |
    | `canary_name` | `STRING` | `frontend-service-canary` | Name of the target Flagger Canary custom resource to inspect. |
    | `max_allowed_failed_checks` | `INT` | `3` | Maximum failed metric iterations before Flagger initiates automated rollback. |
    | `alert_on_rollback` | `BOOL` | `True` | Whether to dispatch automated Slack incident notifications when rollback occurs. |

    ## Expected outputs
    - `{{ outputs.scan_flagger_canary_state.vars.canary_name }}`: Name of the audited Flagger canary resource.
    - `{{ outputs.scan_flagger_canary_state.vars.phase }}`: Current lifecycle phase of the canary deployment (e.g., Failed, Progressing).
    - `{{ outputs.scan_flagger_canary_state.vars.failed_checks_count }}`: Number of consecutive failed metric iterations observed.
    - `{{ outputs.scan_flagger_canary_state.vars.last_applied_spec }}`: Target container image or revision tag evaluated during release.
    - `{{ outputs.scan_flagger_canary_state.vars.has_rollback_event }}`: Boolean flag indicating whether deployment rolled back.
    - `{{ outputs.export_flagger_manifest.value }}`: Consolidated canary status dictionary returned for pipeline records.

    ## Prerequisites
    - Outbound network access from Kestra workers to the Kubernetes API server.
    - A Service Account with RBAC permissions to get and list `canaries.flagger.app` in target namespaces.
    - A Slack Incoming Webhook URL configured in Kestra secret storage.
    - Flagger operator installed and configured with a service mesh or ingress controller.

    ### Secrets
    - `KUBERNETES_API_SERVER`: Base HTTPS URL of the Kubernetes API Server endpoint.
    - `KUBERNETES_SERVICE_ACCOUNT_TOKEN`: Kubernetes Service Account bearer token with get/watch access to canaries.flagger.app.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL used to dispatch progressive deployment alerts.

    ## Quick start
    1. Register the required secrets in your Kestra namespace settings.
    2. Import this blueprint into your Kestra instance under the `company.platform` namespace.
    3. Review input parameters such as threshold levels and target resource identifiers.
    4. Execute the flow manually to verify connectivity, then enable the automated schedule.

    ## Common pitfalls and troubleshooting
    - **RBAC Scope Limitations**: Ensure the Kubernetes service account possesses RBAC permissions to get and watch `canaries.flagger.app` in target namespaces.
    - **Prometheus Metric Lag**: Verify Prometheus metric query endpoints used by Flagger are reachable and returning valid timeseries values.
    - **Phase Ambiguity**: Differentiate between temporary metric flukes and permanent rollback state transitions by examining the status phase.
    - **Webhook Timeout Halts**: Check integration webhook latencies in Flagger specs to ensure pre-rollout probes do not fail due to network timeouts.

    ## How to extend
    - **Jira Incident Creation**: Integrate automatic rollback ticket creation in Jira or GitHub Issues with attached failure diagnostics.
    - **Image Quarantine**: Trigger automatic container image quarantine in the enterprise artifact registry upon confirmed canary failure.
    - **Multi-Channel Broadcast**: Send summary reports to Microsoft Teams or Discord via multi-channel notification fan-out.

