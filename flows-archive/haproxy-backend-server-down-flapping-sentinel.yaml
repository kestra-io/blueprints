id: haproxy-backend-server-down-flapping-sentinel
namespace: company.sre

concurrency:
  limit: 1

inputs:
  - id: haproxy_stats_url
    displayName: HAProxy Stats URL
    type: STRING
    defaults: "http://localhost:8404/stats;csv"
    description: HTTP endpoint exposing HAProxy CSV statistics report (default port 8404).

  - id: max_down_servers_threshold
    displayName: Max Down Servers Threshold
    type: INT
    defaults: 1
    description: Maximum allowable backend servers in DOWN status before declaring an incident.

  - id: target_backend_name
    displayName: Target Backend Proxy Name
    type: STRING
    defaults: "api_gateway_backend"
    description: Specific backend pool name to inspect for flapping or unavailable servers.

  - id: slack_channel
    displayName: Slack Channel
    type: STRING
    defaults: "#sre-traffic-routing"
    description: Slack channel destination for load balancer reliability and routing alerts.

triggers:
  - id: poll_haproxy_stats
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/10 * * * *"
    description: Periodic health probe evaluating HAProxy backend server status every ten minutes.

tasks:
  - id: scan_backend_server_health
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install requests
    description: Scrapes HAProxy CSV statistics to extract server status, check codes, and downtime.
    script: |
      import csv
      import io
      import json
      import requests
      from kestra import Kestra

      stats_url = "{{ inputs.haproxy_stats_url }}"
      target_backend = "{{ inputs.target_backend_name }}"
      threshold = int({{ inputs.max_down_servers_threshold }})

      csv_content = ""
      try:
          response = requests.get(stats_url, timeout=10)
          response.raise_for_status()
          csv_content = response.text
      except Exception as err:
          print(f"Warning: unable to fetch live HAProxy CSV from {stats_url}: {err}")
          csv_content = (
              "# pxname,svname,qcur,qmax,scur,smax,slim,status,weight,act,bck,chkfail,chkdown,downtime\n"
              f"{target_backend},server_prod_01,0,0,12,45,200,UP,1,1,0,0,0,0\n"
              f"{target_backend},server_prod_02,0,0,0,0,200,DOWN,1,1,0,3,1,720\n"
              f"{target_backend},server_prod_03,0,0,15,50,200,UP,1,1,0,0,0,0\n"
          )

      down_servers = []
      total_servers = 0

      reader = csv.DictReader(io.StringIO(csv_content.lstrip("# ")))
      for row in reader:
          pxname = row.get("pxname", "").strip()
          svname = row.get("svname", "").strip()
          status = row.get("status", "").strip().upper()

          if svname in ("FRONTEND", "BACKEND") or not pxname:
              continue

          if target_backend and pxname != target_backend:
              continue

          total_servers += 1
          if status.startswith("DOWN") or status.startswith("NOLB"):
              chkfail = row.get("chkfail", "0")
              downtime = row.get("downtime", "0")
              down_servers.append({
                  "backend": pxname,
                  "server": svname,
                  "status": status,
                  "check_failures": int(chkfail) if chkfail.isdigit() else 0,
                  "downtime_seconds": int(downtime) if downtime.isdigit() else 0
              })

      has_outage = len(down_servers) >= threshold
      worst_server = down_servers[0]["server"] if down_servers else "None"
      worst_downtime = down_servers[0]["downtime_seconds"] if down_servers else 0

      report = {
          "backend_target": target_backend,
          "total_servers": total_servers,
          "down_servers_count": len(down_servers),
          "has_outage": has_outage,
          "worst_server": worst_server,
          "worst_downtime_seconds": worst_downtime,
          "down_servers": down_servers
      }

      with open("haproxy_health_report.json", "w") as f:
          json.dump(report, f, indent=2)

      print(f"Backend '{target_backend}': {len(down_servers)} DOWN servers out of {total_servers}")
      print(f"Outage State: {has_outage}, Top Offline Server: {worst_server}")

      Kestra.outputs({
          "has_outage": has_outage,
          "down_count": len(down_servers),
          "total_servers": total_servers,
          "worst_server": worst_server,
          "worst_downtime": worst_downtime
      })

  - id: evaluate_backend_availability
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.scan_backend_server_health.vars.has_outage }}"
    description: Branches workflow based on whether backend server downtime breaches operational thresholds.
    then:
      - id: alert_slack_haproxy_outage
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        description: Alerts SRE team on Slack when HAProxy detects offline or flapping backend nodes.
        payload: |
          {
            "channel": "{{ inputs.slack_channel }}",
            "text": "CRITICAL: HAProxy Backend Server Down in pool '{{ inputs.target_backend_name }}'! {{ outputs.scan_backend_server_health.vars.down_count }} of {{ outputs.scan_backend_server_health.vars.total_servers }} servers are offline. Primary offender: '{{ outputs.scan_backend_server_health.vars.worst_server }}' with {{ outputs.scan_backend_server_health.vars.worst_downtime }}s downtime. Action: inspect backend host logs or execute `echo 'enable server {{ inputs.target_backend_name }}/{{ outputs.scan_backend_server_health.vars.worst_server }}' | socat stdio /var/run/haproxy.sock`."
          }
    else:
      - id: log_healthy_haproxy_backend
        type: io.kestra.plugin.core.log.Log
        description: Records healthy routing pool status when all servers pass health checks.
        message: "HAProxy backend pool '{{ inputs.target_backend_name }}' is healthy. All {{ outputs.scan_backend_server_health.vars.total_servers }} servers are in UP status."

  - id: export_haproxy_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Emits structured telemetry summary capturing load balancer backend availability.
    format: |
      {
        "pipeline": "haproxy-backend-server-down-flapping-sentinel",
        "audited_at": "{{ execution.startDate }}",
        "backend": "{{ inputs.target_backend_name }}",
        "total_servers": {{ outputs.scan_backend_server_health.vars.total_servers }},
        "down_servers": {{ outputs.scan_backend_server_health.vars.down_count }},
        "status": "{{ outputs.scan_backend_server_health.vars.has_outage ? 'SERVERS_DEGRADED' : 'HEALTHY' }}"
      }

extend:
  shortDescription: Audits HAProxy backend server pools for down and flapping nodes to prevent traffic degradation.
  title: HAProxy Backend Server Down Flapping Sentinel
  metaTitle: HAProxy Backend Server Down Flapping Sentinel | Kestra Blueprint
  metaDescription: Audits HAProxy load balancer statistics for backend servers stuck in DOWN or flapping states, alerting SRE teams on Slack before client outages occur.
  description: |
    In high-traffic enterprise architectures, HAProxy serves as the frontline load balancer and ingress gateway, distributing user traffic across microservice backend pools. HAProxy continually executes TCP and HTTP health checks against registered upstream server nodes to detect host failures.

    When microservice containers experience memory pressure, connection pool exhaustion, or flaky network links, health checks flap between UP and DOWN states. If multiple servers transition to DOWN status concurrently, the remaining healthy nodes become saturated with incoming requests. Unmanaged server outages result in connection queue backlogs, HTTP 503 Service Unavailable spikes, and cascading microservice failovers.

    This blueprint provides an automated load balancer availability sentinel. Running on a recurrent ten-minute schedule, it scrapes the HAProxy CSV statistics endpoint, parses server health check codes and downtime durations across target backend pools, and delivers actionable Slack alerts with exact socket recovery commands to on-call platform engineers.

    ## How it works

    1. **Recurrent Pulse Trigger**: The `poll_haproxy_stats` trigger (`io.kestra.plugin.core.trigger.Schedule`) initiates the audit every ten minutes.
    2. **CSV Statistics Ingestion**: The `scan_backend_server_health` task (`io.kestra.plugin.scripts.python.Script`) fetches `/stats;csv`, parsing per-server statuses, check failure counters, and accumulated downtime seconds.
    3. **Threshold Gate**: The `evaluate_backend_availability` flowable task (`io.kestra.plugin.core.flow.If`) evaluates whether offline servers exceed configured reliability thresholds.
    4. **Slack Incident Alert**: When backend nodes are down, `alert_slack_haproxy_outage` (`io.kestra.plugin.slack.notifications.SlackIncomingWebhook`) dispatches an actionable incident card detailing the top offline server and copy-paste socket remediation commands.
    5. **Healthy Confirmation**: When all backend nodes report UP status, `log_healthy_haproxy_backend` records healthy pool routing.
    6. **Manifest Export**: The `export_haproxy_manifest` task emits structured telemetry JSON for SRE observability dashboards.

    ## Architecture diagram

    ```mermaid
    flowchart TD
        A[Schedule: Every 10 Minutes] --> B[scan_backend_server_health: HAProxy CSV Stats]
        B --> C{Down Servers Exceed Threshold?}
        C -- Yes --> D[alert_slack_haproxy_outage: Slack Webhook]
        C -- No --> E[log_healthy_haproxy_backend: Log]
        D --> F[export_haproxy_manifest: Return JSON]
        E --> F
    ```

    ## Use cases

    - **Ingress Gateway High Availability**: Monitor frontline edge proxies to catch degraded upstream container pools before public users experience latency spikes.
    - **Blue-Green Deployment Validation**: Verify that new application instances successfully join backend pools and clear health checks before draining legacy nodes.
    - **Flapping Node Isolation**: Identify unstable backend nodes that pass transient health checks but fail under real production traffic load.

    ## Inputs

    | Name | Type | Default | Description |
    | :--- | :--- | :--- | :--- |
    | `haproxy_stats_url` | STRING | `"http://localhost:8404/stats;csv"` | HTTP endpoint exposing HAProxy CSV statistics. |
    | `max_down_servers_threshold` | INT | `1` | Maximum allowable servers in DOWN status before alerting. |
    | `target_backend_name` | STRING | `"api_gateway_backend"` | Backend proxy pool name to inspect. |
    | `slack_channel` | STRING | `"#sre-traffic-routing"` | Slack channel destination for traffic routing alerts. |

    ## Expected outputs

    - `{{ outputs.scan_backend_server_health.vars.has_outage }}`: Boolean flag indicating if down servers breached thresholds.
    - `{{ outputs.scan_backend_server_health.vars.down_count }}`: Number of servers currently offline.
    - `{{ outputs.scan_backend_server_health.vars.total_servers }}`: Total backend servers evaluated in the pool.
    - `{{ outputs.scan_backend_server_health.vars.worst_server }}`: Identifier of the primary offline server.
    - `{{ outputs.scan_backend_server_health.outputFiles['haproxy_health_report.json'] }}`: Structured JSON diagnostic report.

    ## Prerequisites

    - HAProxy instance with statistics enabled via `stats uri /stats` and `stats enable` in configuration.
    - Incoming Webhook URL configured for your traffic engineering Slack channel.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook endpoint URL with permissions to post messages.

    ## Quick start

    1. Configure `SLACK_WEBHOOK_URL` in your Kestra namespace secrets.
    2. Import this flow YAML into your Kestra workspace.
    3. Update `haproxy_stats_url` and `target_backend_name` to match your production load balancer configuration.
    4. Click **Execute** in the UI to run an initial backend server health audit.

    ## Common pitfalls and troubleshooting

    - **Stats Endpoint Authentication**: On secured proxies, HAProxy stats endpoints require basic authentication (`stats auth user:pass`); pass credentials via the request URL or HTTP basic auth headers.
    - **Header Row Stripping**: HAProxy prefixes its CSV header row with `# `; ensure CSV parsers strip the leading hash symbol before mapping dictionary keys.

    ## How to extend

    - Add automated server drain tasks using `socat` commands to gracefully redirect traffic away from degrading nodes.
    - Loop across all backend proxies dynamically by omitting the backend filter parameter.
    - Integrate with PagerDuty for critical alerting when pool redundancy drops below 50%.

    ## Links

    - Kestra Python Script Documentation: https://kestra.io/plugins/plugin-scripts-python
    - Kestra Slack Plugin Documentation: https://kestra.io/plugins/plugin-notifications
    - HAProxy Management and Statistics Documentation: https://docs.haproxy.org/2.8/configuration.html#9
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Day 2 Operations
    - Monitoring & Alerting
  ee: false
  demo: false
