id: gst-invoice-series-audit
namespace: company.team
description: |
  Audit the sales register's invoice numbering before GSTR-1 is filed: numbers
  must be unique in the financial year, at most 16 characters, and use only
  letters, digits, "-" and "/". Find gaps and out-of-order dates in each series
  and build the "documents issued" summary (GSTR-1 Table 13).

inputs:
  - id: sales_register
    type: FILE
    required: false
    description: CSV of issued invoices with the columns invoice_no, invoice_date (YYYY-MM-DD), taxable_value and status (ISSUED or CANCELLED). Leave empty to use the built-in sample.
  - id: notify_slack
    type: BOOL
    defaults: false
    description: Post the findings to Slack when at least one invoice number breaks the rules. Requires the SLACK_WEBHOOK_URL secret.

triggers:
  - id: monthly_before_gstr1
    type: io.kestra.plugin.core.trigger.Schedule
    description: Run on the 5th of every month at 09:00 IST, before GSTR-1 is due. Shipped disabled; enable it once the flow reads your real sales register instead of the sample.
    cron: "0 9 5 * *"
    timezone: Asia/Kolkata
    disabled: true

tasks:
  - id: sample_sales_register
    type: io.kestra.plugin.core.storage.Write
    description: Two months of invoices from two series with one example of every problem the audit catches. Only used when sales_register is empty.
    extension: .csv
    content: |
      invoice_no,invoice_date,taxable_value,status
      INV/26-27/0101,2026-08-01,12500.00,ISSUED
      INV/26-27/0102,2026-08-03,8400.00,ISSUED
      INV/26-27/0103,2026-08-05,15000.00,CANCELLED
      INV/26-27/0104,2026-08-09,9900.00,ISSUED
      INV/26-27/0104,2026-08-11,4300.00,ISSUED
      INV/26-27/0105,2026-08-12,27000.00,ISSUED
      INV/26-27/0108,2026-08-20,6100.00,ISSUED
      INV/26-27/0109,2026-08-18,3500.00,ISSUED
      inv/26-27/0110,2026-08-24,7700.00,ISSUED
      INV/26-27/0111,2026-09-02,11200.00,ISSUED
      BLRSTORE-INV-26-27-0112,2026-09-04,5200.00,ISSUED
      INV#26-27/0113,2026-09-06,4800.00,ISSUED
      INV/26-27/0114,2026-09-09,9600.00,ISSUED
      EXP/26-27/007,2026-08-14,182000.00,ISSUED
      EXP/26-27/008,2026-09-01,96500.00,ISSUED
      EXP/26-27/009,2026-09-22,143000.00,ISSUED

  - id: audit_series
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: Check every invoice number and every series in DuckDB, without calling any external service. The per-invoice report and the Table 13 summary are exported to CSV, and the last query returns the totals.
    inputFiles:
      sales.csv: "{{ inputs.sales_register ?? outputs.sample_sales_register.uri }}"
    outputFiles:
      - invoice_report.csv
      - gstr1_table13.csv
    fetchType: FETCH_ONE
    sql: |
      CREATE TABLE sales AS
      SELECT
        row_number() OVER () AS line,
        coalesce(invoice_no, '') AS invoice_raw,
        trim(coalesce(invoice_no, '')) AS invoice_no,
        CAST(invoice_date AS DATE) AS invoice_date,
        CAST(nullif(trim(taxable_value), '') AS DECIMAL(15, 2)) AS taxable_value,
        upper(trim(coalesce(status, 'ISSUED'))) AS status
      FROM read_csv('{{ workingDir }}/sales.csv', header = true, all_varchar = true);

      -- Financial year runs April to March. Series = everything before the trailing number.
      CREATE TABLE parsed AS
      SELECT
        *,
        CASE WHEN month(invoice_date) >= 4 THEN year(invoice_date) ELSE year(invoice_date) - 1 END AS fy_start,
        regexp_full_match(invoice_no, '[A-Za-z0-9/-]{1,16}') AS valid_format,
        upper(regexp_extract(invoice_no, '^(.*?)([0-9]+)$', 1)) AS series,
        TRY_CAST(regexp_extract(invoice_no, '([0-9]+)$', 1) AS BIGINT) AS seq_no
      FROM sales;

      CREATE TABLE checked AS
      SELECT
        *,
        'FY ' || fy_start || '-' || right(CAST(fy_start + 1 AS VARCHAR), 2) AS fy,
        count(*) OVER (PARTITION BY fy_start, upper(invoice_no)) AS same_number_count,
        string_agg(CAST(line AS VARCHAR), ', ') OVER (PARTITION BY fy_start, upper(invoice_no)) AS same_number_lines,
        lag(invoice_date) OVER (PARTITION BY fy_start, series ORDER BY seq_no, line) AS previous_date,
        lag(invoice_no) OVER (PARTITION BY fy_start, series ORDER BY seq_no, line) AS previous_invoice
      FROM parsed;

      CREATE TABLE report AS
      SELECT
        line,
        invoice_no,
        invoice_date,
        fy,
        series,
        seq_no,
        status,
        taxable_value,
        CASE WHEN len(errors) > 0 THEN 'ERROR' WHEN len(warnings) > 0 THEN 'WARNING' ELSE 'OK' END AS result,
        array_to_string(list_concat(errors, warnings), ' | ') AS issues
      FROM (
        SELECT
          *,
          list_filter([
            CASE WHEN invoice_no = '' THEN 'Invoice number is empty' END,
            CASE WHEN length(invoice_no) > 16 THEN 'Invoice number has ' || length(invoice_no) || ' characters, the limit is 16' END,
            CASE WHEN invoice_no <> '' AND NOT regexp_full_match(invoice_no, '[A-Za-z0-9/-]+') THEN 'Invoice number "' || invoice_no || '" has characters other than letters, digits, "-" and "/"' END,
            CASE WHEN invoice_no <> '' AND same_number_count > 1 THEN 'Invoice number used more than once in ' || fy || ' (lines ' || same_number_lines || ')' END
          ], lambda x: x IS NOT NULL) AS errors,
          list_filter([
            CASE WHEN valid_format AND seq_no IS NULL THEN 'Invoice number does not end with a running number' END,
            CASE WHEN valid_format AND invoice_no <> upper(invoice_no) AND same_number_count = 1 THEN 'Lower-case letters in "' || invoice_no || '", other invoices in the series are upper case' END,
            CASE WHEN previous_date IS NOT NULL AND invoice_date < previous_date AND previous_invoice <> invoice_no
              THEN 'Dated ' || invoice_date || ', earlier than the previous invoice ' || previous_invoice || ' (' || previous_date || ')' END,
            CASE WHEN taxable_value IS NULL AND status = 'ISSUED' THEN 'Taxable value is missing' END
          ], lambda x: x IS NOT NULL) AS warnings
        FROM checked
      )
      ORDER BY CASE result WHEN 'ERROR' THEN 0 WHEN 'WARNING' THEN 1 ELSE 2 END, line;

      -- Numbers that are missing inside each series, within the financial year.
      CREATE TABLE series_range AS
      SELECT fy_start, fy, series, min(seq_no) AS first_no, max(seq_no) AS last_no,
        arg_min(invoice_no, seq_no) AS first_invoice, arg_max(invoice_no, seq_no) AS last_invoice,
        count(DISTINCT seq_no) AS used_numbers,
        count(DISTINCT seq_no) FILTER (WHERE status = 'CANCELLED') AS cancelled_numbers
      FROM checked
      WHERE valid_format AND seq_no IS NOT NULL
      GROUP BY fy_start, fy, series;

      CREATE TABLE missing AS
      SELECT r.fy, r.series, n.generate_series AS seq_no
      FROM series_range r, generate_series(r.first_no, r.last_no) n
      WHERE NOT EXISTS (
        SELECT 1 FROM checked c
        WHERE c.fy_start = r.fy_start AND c.series = r.series AND c.seq_no = n.generate_series AND c.valid_format
      );

      CREATE TABLE table13 AS
      SELECT
        r.fy,
        r.series,
        r.first_invoice AS sr_no_from,
        r.last_invoice AS sr_no_to,
        r.last_no - r.first_no + 1 AS total_number,
        r.cancelled_numbers + count(m.seq_no) AS cancelled,
        r.last_no - r.first_no + 1 - r.cancelled_numbers - count(m.seq_no) AS net_issued,
        coalesce(string_agg(CAST(m.seq_no AS VARCHAR), ', ' ORDER BY m.seq_no), '') AS missing_numbers
      FROM series_range r
      LEFT JOIN missing m ON m.fy = r.fy AND m.series = r.series
      GROUP BY r.fy, r.series, r.first_invoice, r.last_invoice, r.first_no, r.last_no, r.cancelled_numbers
      ORDER BY r.fy, r.series;

      COPY report TO '{{ outputFiles["invoice_report.csv"] }}' (HEADER, DELIMITER ',');
      COPY table13 TO '{{ outputFiles["gstr1_table13.csv"] }}' (HEADER, DELIMITER ',');

      SELECT
        (SELECT count(*) FROM report) AS invoices,
        (SELECT count(*) FROM report WHERE result = 'OK') AS ok_count,
        (SELECT count(*) FROM report WHERE result = 'WARNING') AS warning_count,
        (SELECT count(*) FROM report WHERE result = 'ERROR') AS error_count,
        (SELECT count(*) FROM missing) AS missing_count,
        (SELECT count(*) FROM table13) AS series_count,
        coalesce((SELECT string_agg(invoice_no || ': ' || issues, chr(10)) FROM report WHERE result = 'ERROR'), '') AS error_details,
        coalesce((SELECT string_agg(invoice_no || ': ' || issues, chr(10)) FROM report WHERE result = 'WARNING'), '') AS warning_details,
        coalesce((SELECT string_agg(fy || ' ' || series || ' missing ' || missing_numbers, chr(10)) FROM table13 WHERE missing_numbers <> ''), '') AS gap_details;

  - id: route_findings
    type: io.kestra.plugin.core.flow.If
    description: Branch on the result. Broken invoice numbers have to be fixed before GSTR-1 is filed, so they are logged and optionally sent to Slack; a clean audit is logged so the execution history doubles as the monthly numbering record.
    condition: "{{ outputs.audit_series.outputs[0].row.error_count > 0 }}"
    then:
      - id: log_errors
        type: io.kestra.plugin.core.log.Log
        level: WARN
        description: Write every invoice to fix, every warning and every gap in the numbering to the execution logs.
        message: |
          Invoice series audit: {{ outputs.audit_series.outputs[0].row.error_count }} error(s), {{ outputs.audit_series.outputs[0].row.warning_count }} warning(s), {{ outputs.audit_series.outputs[0].row.missing_count }} missing number(s) across {{ outputs.audit_series.outputs[0].row.series_count }} series and {{ outputs.audit_series.outputs[0].row.invoices }} invoices.
          Errors:
          {{ outputs.audit_series.outputs[0].row.error_details }}
          Warnings:
          {{ outputs.audit_series.outputs[0].row.warning_details }}
          Gaps (report as cancelled in GSTR-1 Table 13, or find the missing invoices):
          {{ outputs.audit_series.outputs[0].row.gap_details }}

      - id: slack_enabled
        type: io.kestra.plugin.core.flow.If
        description: Only call Slack when the notify_slack input is true, so the flow runs out of the box without any secret.
        condition: "{{ inputs.notify_slack }}"
        then:
          - id: alert_accounts_team
            type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
            description: Tell the accounts team which invoice numbers to fix before GSTR-1 is filed.
            url: "{{ secret('SLACK_WEBHOOK_URL') }}"
            messageText: |
              :warning: Invoice series audit found {{ outputs.audit_series.outputs[0].row.error_count }} invoice number(s) to fix and {{ outputs.audit_series.outputs[0].row.missing_count }} gap(s) in the numbering.
              {{ outputs.audit_series.outputs[0].row.error_details }}
              Full report: execution {{ execution.id }} in flow {{ flow.namespace }}.{{ flow.id }}
    else:
      - id: log_clean
        type: io.kestra.plugin.core.log.Log
        description: Record a clean audit.
        message: "Invoice series audit passed: {{ outputs.audit_series.outputs[0].row.invoices }} invoices in {{ outputs.audit_series.outputs[0].row.series_count }} series, {{ outputs.audit_series.outputs[0].row.missing_count }} missing number(s), {{ outputs.audit_series.outputs[0].row.warning_count }} warning(s)."

errors:
  - id: log_audit_failure
    type: io.kestra.plugin.core.log.Log
    level: ERROR
    description: Make a failed audit loud. If the file is missing or malformed, no invoice was checked, and a silent failure must not be mistaken for a clean register.
    message: "Invoice series audit FAILED in {{ flow.namespace }}.{{ flow.id }} (execution {{ execution.id }}). No invoice was checked. Check the columns of sales_register."

outputs:
  - id: invoice_report
    type: FILE
    description: One row per invoice with the financial year, series, running number, status, result (ERROR, WARNING or OK) and the reasons.
    value: "{{ outputs.audit_series.outputFiles['invoice_report.csv'] }}"
  - id: gstr1_table13
    type: FILE
    description: One row per financial year and series with the first and last number, total, cancelled (including missing numbers) and net issued, ready to copy into GSTR-1 Table 13 (documents issued).
    value: "{{ outputs.audit_series.outputFiles['gstr1_table13.csv'] }}"
  - id: audit_summary
    type: JSON
    description: 'Counts and details, e.g. {"invoices": 16, "error_count": 4, "missing_count": 4, ...}.'
    value: "{{ outputs.audit_series.outputs[0].row | toJson }}"

extend:
  title: Audit GST Invoice Numbering and Build the GSTR-1 Documents Issued Summary
  shortDescription: Monthly DuckDB audit of sales invoice numbers for GST rules (unique per year, 16 characters, allowed characters), gaps and backdating, with a ready GSTR-1 Table 13.
  metaTitle: GST Invoice Number Audit and GSTR-1 Table 13
  metaDescription: Check sales invoice numbers against GST rules every month. Catch duplicates, long numbers, bad characters and gaps, and build GSTR-1 Table 13.
  description: |
    Under GST in India, every tax invoice needs a consecutive serial number that is unique for the financial year, at most 16 characters long, and made only of letters, digits, hyphens and slashes (rule 46 of the CGST Rules). Every GSTR-1 also has to report, for each series, the first and last number used and how many were cancelled (Table 13, "documents issued"). With several billing counters, branches or a new ERP, duplicates, over-long numbers and gaps creep in and are usually noticed only at filing time. This blueprint audits the sales register every month and builds the Table 13 figures for you. Everything runs locally in DuckDB: no GST portal credentials and no sales data leaving your Kestra instance.

    ## How it works

    1. `sample_sales_register` (`io.kestra.plugin.core.storage.Write`) writes two months of invoices from two series with one example of every problem. It is used only when the `sales_register` input is empty, so the flow runs out of the box.
    2. `audit_series` (`io.kestra.plugin.jdbc.duckdb.Queries`) loads the CSV through `inputFiles`, works out the financial year (April to March) and splits each number into its series (everything before the trailing number) and running number. It reports:
       - **errors**: an empty number, more than 16 characters, characters other than letters, digits, `-` and `/`, and the same number used twice in a financial year (case-insensitive);
       - **warnings**: an invoice dated earlier than the previous number in its series, lower-case letters in a series that is otherwise upper case, a number without a running number, and a missing taxable value;
       - **gaps**: running numbers missing inside each series in the financial year.

       It then builds one Table 13 row per financial year and series (first and last number, total, cancelled and net issued). The per-invoice report and the Table 13 summary are written with `outputFiles`, and the final `SELECT` returns the totals through `fetchType: FETCH_ONE`, available as `outputs.audit_series.outputs[0].row`.
    3. `route_findings` (`io.kestra.plugin.core.flow.If`) logs every error, warning and gap when at least one number breaks the rules, and a nested `If` posts the findings to Slack when `notify_slack` is `true`. A clean audit is logged as well.
    4. The `errors` block logs a failed audit loudly, because an audit that silently does not run looks the same as a clean register.
    5. The `monthly_before_gstr1` `Schedule` trigger (5th of each month, 09:00 IST, shipped disabled) runs the audit before GSTR-1 is due.

    ## What you get

    - `outputs.invoice_report`: CSV with `line`, `invoice_no`, `invoice_date`, `fy`, `series`, `seq_no`, `status`, `taxable_value`, `result` (`ERROR`, `WARNING` or `OK`) and `issues`, errors first.
    - `outputs.gstr1_table13`: CSV with `fy`, `series`, `sr_no_from`, `sr_no_to`, `total_number`, `cancelled`, `net_issued` and `missing_numbers`, ready to copy into GSTR-1 Table 13.
    - `outputs.audit_summary`: JSON with `invoices`, `ok_count`, `warning_count`, `error_count`, `missing_count`, `series_count`, `error_details`, `warning_details` and `gap_details`.
    - With the sample data: 4 errors (both invoices that share one number, a 23-character number, and a number with `#`), 2 warnings (an invoice dated before the previous one, lower-case letters) and 4 missing numbers in the `INV/26-27/` series, two of which were actually issued with a malformed number from another counter. The `EXP/26-27/` export series is clean, and Table 13 shows 14 numbers, 5 cancelled (1 marked cancelled plus 4 missing) and 9 net issued for `INV/26-27/`.

    ## Who it's for

    - Accounts teams in India that file GSTR-1 every month or quarter.
    - Retail chains and restaurants that bill from several counters or branches, each with its own series.
    - Chartered accountants and GST practitioners who prepare GSTR-1 for many clients.

    ## Why orchestrate this with Kestra

    A spreadsheet can check one month once. Kestra runs the audit every month on schedule, keeps every month's report and Table 13 in the execution history, branches on the result and alerts the people who can fix the billing setup. Because the input is a plain file, the same flow can be triggered when the sales export lands in S3, SFTP or Google Drive, or run once per GSTIN for multi-state businesses with a `ForEach`.

    ## Prerequisites

    - Nothing for the demo: the sample sales register is built in.
    - For your own data: a CSV export of the sales register from your billing system, ERP or Tally with the columns below.

    ### Inputs

    - `sales_register` (FILE, optional): `invoice_no`, `invoice_date` (`YYYY-MM-DD`), `taxable_value` and `status` (`ISSUED` or `CANCELLED`).
    - `notify_slack` (BOOL, default `false`): post the findings to Slack when at least one invoice number breaks the rules.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack incoming webhook URL. Only needed when `notify_slack` is `true`.

    ## Quick start

    1. Save the flow and run it with the default inputs.
    2. Open the logs of `log_errors` and download `invoice_report` and `gstr1_table13` from the Outputs tab.
    3. Run it again with your own sales register.
    4. Optional: add the `SLACK_WEBHOOK_URL` secret and set `notify_slack` to `true`.
    5. Point the input at your real source and set `disabled: false` on `monthly_before_gstr1`.

    ## Common pitfalls

    - Missing numbers are counted as cancelled in Table 13 because that is how unused numbers are reported, but check each gap first: in the sample, two of them were issued with a malformed number by another counter and must be corrected, not cancelled.
    - Include cancelled invoices in the export with `status: CANCELLED`, otherwise they show up as gaps.
    - Credit notes, debit notes and delivery challans have their own series and their own Table 13 rows. Export them in the same file or in a separate run.
    - Export dates as `YYYY-MM-DD` so the financial year is worked out correctly.

    ## How to extend

    - Read the sales register straight from your billing database (Postgres, MySQL) or warehouse instead of a file.
    - Run the audit per branch or GSTIN with a `ForEach` and compare series across counters.
    - Combine it with the GSTR-2B purchase reconciliation and GSTIN vendor master validation blueprints for a monthly GST close.
    - Block the month-end close with a `Pause` until every error is fixed.

    ## Links

    - [CGST Rules, rule 46 (tax invoice)](https://cbic-gst.gov.in/gst-acts.html)
    - [GSTR-1 (GST portal help)](https://tutorial.gst.gov.in/userguide/returns/index.htm#t=GSTR_1.htm)
    - [Kestra DuckDB plugin](https://kestra.io/plugins/plugin-jdbc/duckdb)
    - [Kestra Slack plugin](https://kestra.io/plugins/plugin-slack)

    - This blueprint has been created by [Ankith-m1006](https://github.com/Ankith-m1006)
  tags:
    - Business
    - Data
  subTags:
    - Policy & Compliance
    - Testing & Quality
  ee: false
  demo: false
