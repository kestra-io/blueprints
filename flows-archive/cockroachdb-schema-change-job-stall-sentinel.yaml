    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
    - [CockroachDB SHOW JOBS Documentation](https://www.cockroachlabs.com/docs/stable/show-jobs)
    - [CockroachDB Online Schema Changes Architecture](https://www.cockroachlabs.com/docs/stable/online-schema-changes)
    - [CockroachDB Troubleshooting Schema Changes](https://www.cockroachlabs.com/docs/stable/common-errors#schema-change-job-hanging)
