    - [Cloudflare GraphQL Analytics API Documentation](https://developers.cloudflare.com/analytics/graphql-api/)
    - [Cloudflare SSL/TLS Encryption Modes Guide](https://developers.cloudflare.com/ssl/origin-configuration/ssl-modes/)
