id: aws-elasticache-engine-cpu-utilization-ceiling-guard
namespace: company.cloud

description: |
  Audits AWS ElastiCache Redis cluster nodes via CloudWatch to detect EngineCPUUtilization spikes,
  pinpointing single-threaded engine saturation and key contention before cache timeouts occur.

concurrency:
  limit: 1

inputs:
  - id: aws_region
    type: STRING
    displayName: AWS Region
    defaults: us-east-1
    description: Target AWS region where the ElastiCache cluster and CloudWatch metrics reside.

  - id: cluster_id
    type: STRING
    displayName: ElastiCache Cluster ID
    defaults: "prod-redis-cache-cluster"
    description: Identifier of the target AWS ElastiCache Redis cluster or replication group.

  - id: engine_cpu_threshold_percent
    type: FLOAT
    displayName: Engine CPU Threshold (%)
    defaults: 80.0
    description: Maximum acceptable EngineCPUUtilization percentage before triggering saturation alerts.

  - id: alert_on_saturation
    type: BOOL
    displayName: Alert on Saturation
    defaults: true
    description: Whether to dispatch automated Slack incident alerts when Redis engine CPU is saturated.

tasks:
  - id: scan_engine_cpu
    type: io.kestra.plugin.scripts.python.Script
    description: Queries AWS CloudWatch for ElastiCache Redis EngineCPUUtilization and SwapUsage metrics.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install boto3 kestra
    env:
      AWS_ACCESS_KEY_ID: "{{ secret('AWS_ACCESS_KEY_ID') }}"
      AWS_SECRET_ACCESS_KEY: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
      AWS_DEFAULT_REGION: "{{ inputs.aws_region }}"
    script: |
      import os
      import json
      import boto3
      from datetime import datetime, timedelta, timezone
      from kestra import Kestra

      region = os.environ.get("AWS_DEFAULT_REGION", "us-east-1")
      cluster_id = "{{ inputs.cluster_id }}".strip()
      threshold = float("{{ inputs.engine_cpu_threshold_percent }}")

      cw_client = boto3.client("cloudwatch", region_name=region)

      end_time = datetime.now(timezone.utc)
      start_time = end_time - timedelta(minutes=15)

      # Query EngineCPUUtilization
      resp = cw_client.get_metric_data(
          MetricDataQueries=[
              {
                  "Id": "engine_cpu",
                  "MetricStat": {
                      "Metric": {
                          "Namespace": "AWS/ElastiCache",
                          "MetricName": "EngineCPUUtilization",
                          "Dimensions": [{"Name": "CacheClusterId", "Value": cluster_id}]
                      },
                      "Period": 300,
                      "Stat": "Maximum"
                  },
                  "ReturnData": True
              },
              {
                  "Id": "cpu_utilization",
                  "MetricStat": {
                      "Metric": {
                          "Namespace": "AWS/ElastiCache",
                          "MetricName": "CPUUtilization",
                          "Dimensions": [{"Name": "CacheClusterId", "Value": cluster_id}]
                      },
                      "Period": 300,
                      "Stat": "Maximum"
                  },
                  "ReturnData": True
              }
          ],
          StartTime=start_time,
          EndTime=end_time
      )

      results = {r["Id"]: (r["Values"][0] if r["Values"] else 0.0) for r in resp.get("MetricDataResults", [])}
      max_engine_cpu = round(results.get("engine_cpu", 0.0), 2)
      host_cpu = round(results.get("cpu_utilization", 0.0), 2)

      is_saturated = max_engine_cpu >= threshold

      report = {
          "cluster_id": cluster_id,
          "region": region,
          "max_engine_cpu_percent": max_engine_cpu,
          "host_cpu_percent": host_cpu,
          "threshold_percent": threshold,
          "is_saturated": is_saturated,
          "remediation_advice": f"Scale ElastiCache node type or shard keyspace on cluster {cluster_id}. Review Redis slowlog for O(N) operations."
      }

      with open("elasticache_report.json", "w") as f:
          json.dump(report, f)

      Kestra.outputs({
          "cluster_id": cluster_id,
          "max_engine_cpu_percent": max_engine_cpu,
          "is_saturated": is_saturated
      })

  - id: check_engine_saturation
    type: io.kestra.plugin.core.flow.If
    description: Evaluates whether Redis Engine CPU utilization exceeds configured threshold.
    condition: "{{ fromJson(read('elasticache_report.json')).is_saturated and inputs.alert_on_saturation }}"
    then:
      - id: notify_slack_engine_saturation
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches high-priority Redis CPU saturation alert to DevOps on Slack.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#cloud-database-alerts",
            "username": "ElastiCache-Sentinel",
            "text": "CRITICAL: AWS ElastiCache Cluster `{{ fromJson(read('elasticache_report.json')).cluster_id }}` EngineCPUUtilization is SATURATED at `{{ fromJson(read('elasticache_report.json')).max_engine_cpu_percent }}%` (Threshold: {{ fromJson(read('elasticache_report.json')).threshold_percent }}%)! Redis is single-threaded and approaching command processing lockup. Host CPU: {{ fromJson(read('elasticache_report.json')).host_cpu_percent }}%. Runbook: {{ fromJson(read('elasticache_report.json')).remediation_advice }}"
          }

  - id: log_cluster_health_state
    type: io.kestra.plugin.core.log.Log
    description: Records an operational audit trail of ElastiCache engine performance.
    message: "AWS ElastiCache audit completed for '{{ fromJson(read('elasticache_report.json')).cluster_id }}'. Engine CPU: {{ fromJson(read('elasticache_report.json')).max_engine_cpu_percent }}%, Saturated: {{ fromJson(read('elasticache_report.json')).is_saturated }}."

  - id: export_cluster_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Emits structured manifest of ElastiCache telemetry for observability and auto-scaling platforms.
    format: "{{ fromJson(read('elasticache_report.json')) }}"

triggers:
  - id: ten_minute_elasticache_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: Automated schedule trigger auditing ElastiCache engine CPU every ten minutes.
    cron: "*/10 * * * *"

extend:
  title: AWS ElastiCache Engine CPU Utilization Ceiling Guard
  metaTitle: AWS ElastiCache Engine CPU Utilization Ceiling Guard Blueprint
  shortDescription: Audits AWS ElastiCache Redis cluster nodes to detect EngineCPUUtilization saturation.
  metaDescription: Audits AWS ElastiCache Redis cluster nodes via CloudWatch to detect EngineCPUUtilization spikes, dispatching actionable scaling alerts to DevOps via Slack.
  description: |
    Modern low-latency microservices and web applications rely heavily on Amazon ElastiCache for Redis to cache session states, frequent database queries, and leaderboards. Because Redis is architecturally single-threaded for core command execution, monitoring standard operating system `CPUUtilization` is dangerously deceptive. A multi-core instance (such as a 4-vCPU `cache.m6g.xlarge`) can report overall host CPU utilization of only 25%, while the single Redis execution thread is running pinned at 100% capacity. When this happens, command queues back up, p99 request latency spikes from sub-millisecond to seconds, and client connections drop abruptly with timeout errors. This sentinel queries the AWS CloudWatch `EngineCPUUtilization` metric on a 10-minute schedule, isolates single-thread Redis core saturation, and delivers actionable incident runbooks to DevOps teams on Slack with slowlog inspection guidelines before application-wide cache lockouts occur.

    ## How it works
    1. **Scheduled triggering**: Executes every 10 minutes via automated cron trigger (`*/10 * * * *`) or runs on-demand via manual execution.
    2. **CloudWatch metrics retrieval**: Fetches `EngineCPUUtilization` and `CPUUtilization` from the `AWS/ElastiCache` namespace across a 15-minute window.
    3. **Single-thread evaluation**: Evaluates the maximum recorded engine CPU percentage against `engine_cpu_threshold_percent`.
    4. **Threshold comparison**: Verifies whether the Redis engine thread is operating above safe headroom levels (e.g. 80%).
    5. **Conditional alerting**: An `io.kestra.plugin.core.flow.If` flowable checks if the engine is saturated and dispatches an incident card to `#cloud-database-alerts`.
    6. **Manifest export**: Logs operational telemetry and returns a structured JSON manifest detailing engine metrics and scaling advice.

    ## Architecture diagram
    ```mermaid
    flowchart TD
      A[ten_minute_elasticache_audit Schedule Trigger] --> B[scan_engine_cpu Python Script]
      B --> C[check_engine_saturation Flowable If]
      C -- Engine CPU Saturated --> D[notify_slack_engine_saturation Webhook]
      C -- Engine CPU Nominal --> E[log_cluster_health_state Log]
      D --> E
      E --> F[export_cluster_manifest Return]
    ```

    ## What you get
    - High-fidelity monitoring of true single-threaded Redis core capacity rather than misleading aggregate host CPU.
    - Early warning before Redis command latency degrades web and mobile application performance.
    - Contextual Slack alerts detailing engine and host CPU ratios with actionable remediation advice.
    - Structured JSON execution manifests for database capacity planning and cluster rightsizing.

    ## Who it's for
    - Database Administrators (DBAs) and Cache Engineers managing high-throughput Redis clusters.
    - Site Reliability Engineers troubleshooting mysterious sub-millisecond API latency degradations.
    - DevOps Teams operating distributed session stores and event stream buffers.

    ## Why orchestrate this with Kestra
    Detecting single-threaded Redis bottlenecks requires dedicated evaluation of engine-specific metrics that standard host alarms frequently miss. Kestra provides scheduled orchestration with container isolation, secret management for cloud credentials, and native Slack notification plugins. Running this sentinel in Kestra gives infrastructure teams a centralized, auditable control loop without configuring complex external monitoring agents.

    ## Use cases
    - **Single-Thread Bottleneck Detection**: Detect unindexed Redis commands (such as `KEYS *` or large `HGETALL`) locking the single-threaded engine.
    - **Keyspace Partition Scaling**: Identify when a Redis node reaches performance limits and requires horizontal sharding or read replica offloading.
    - **Pre-Event Traffic Surge Readiness**: Verify that caching clusters maintain sufficient engine CPU headroom prior to major flash sales or marketing campaigns.

    ## Inputs
    | Name | Type | Default | Description |
    | :--- | :--- | :--- | :--- |
    | `aws_region` | `STRING` | `us-east-1` | Target AWS region where the ElastiCache cluster and CloudWatch metrics reside. |
    | `cluster_id` | `STRING` | `prod-redis-cache-cluster` | Identifier of the target AWS ElastiCache Redis cluster or replication group. |
    | `engine_cpu_threshold_percent` | `FLOAT` | `80.0` | Maximum acceptable EngineCPUUtilization percentage before triggering saturation alerts. |
    | `alert_on_saturation` | `BOOL` | `true` | Whether to dispatch automated Slack incident alerts when Redis engine CPU is saturated. |

    ## Expected outputs
    - `{{ outputs.scan_engine_cpu.vars.cluster_id }}`: Identifier of the evaluated ElastiCache cluster.
    - `{{ outputs.scan_engine_cpu.vars.max_engine_cpu_percent }}`: Maximum recorded EngineCPUUtilization percentage.
    - `{{ outputs.scan_engine_cpu.vars.is_saturated }}`: Boolean flag indicating whether the engine CPU exceeded configured limits.
    - `{{ outputs.export_cluster_manifest.value }}`: Structured dictionary containing the consolidated ElastiCache diagnostic manifest.

    ## Prerequisites
    - Outbound HTTPS network access from Kestra execution workers to AWS CloudWatch endpoints.
    - AWS IAM credentials configured with `cloudwatch:GetMetricData` permissions for the `AWS/ElastiCache` namespace.
    - A Slack Incoming Webhook URL configured in Kestra secrets.

    ### Secrets
    - `AWS_ACCESS_KEY_ID`: AWS IAM access key with permissions to read ElastiCache CloudWatch metrics.
    - `AWS_SECRET_ACCESS_KEY`: AWS IAM secret key corresponding to the access key.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL used to dispatch database incident notifications.

    ## Quick start
    1. Register `AWS_ACCESS_KEY_ID`, `AWS_SECRET_ACCESS_KEY`, and `SLACK_WEBHOOK_URL` in your Kestra secret storage.
    2. Import this blueprint into your Kestra instance under the `company.cloud` namespace.
    3. Configure `cluster_id` with your ElastiCache cluster identifier.
    4. Run a manual execution to test CloudWatch metric discovery and confirm diagnostic output format.

    ## Common pitfalls and troubleshooting
    - **EngineCPUUtilization vs CPUUtilization**: Always alert on `EngineCPUUtilization` for Redis; `CPUUtilization` measures the average across all host vCPUs and masks single-core lockups.
    - **Memcached Differences**: Memcached is multi-threaded and scales across all host vCPUs; this sentinel is specifically tailored for Redis single-threaded engines.
    - **IAM Policy Permissions**: Ensure the IAM policy includes `cloudwatch:GetMetricData`; missing permissions return empty metric data without explicit exceptions.

    ## How to extend
    - **Automated Slowlog Harvesting**: Trigger a secondary Python task to connect to the Redis cluster and extract the top 10 commands from `SLOWLOG GET` upon alert.
    - **Read Replica Auto-Scaling**: Dispatch an AWS API call to add read replicas to the replication group when engine CPU remains elevated for over 30 minutes.
    - **Multi-Cluster Fleet Audit**: Wrap the evaluation in an `io.kestra.plugin.core.flow.ForEach` loop to scan all caching clusters in the AWS account.

    ## Links
    - [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
    - [AWS ElastiCache EngineCPUUtilization Documentation](https://docs.aws.amazon.com/AmazonElastiCache/latest/red-ug/CacheMetrics.Redis.html)
    - [Redis Latency Troubleshooting Guide](https://redis.io/docs/management/optimization/latency/)
  tags:
    - Cloud
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - Day 2 Operations
  ee: false
  demo: false
