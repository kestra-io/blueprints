id: dynamodb-contributor-insights-throttled-key-sentinel
namespace: company.database

description: |
  Audits Amazon DynamoDB Contributor Insights rules to isolate hot partition keys causing
  read and write throttling, dispatching actionable diagnostic manifests to database engineering teams on Slack.

concurrency:
  limit: 1

inputs:
  - id: aws_region
    type: STRING
    displayName: AWS Region
    defaults: us-east-1
    description: Target AWS region where DynamoDB tables and CloudWatch Contributor Insights rules are deployed.

  - id: table_name_filter
    type: STRING
    displayName: Table Name Filter
    defaults: all
    description: Name or substring filter of DynamoDB tables to audit, or all to scan all regional tables.

  - id: max_throttled_keys_threshold
    type: INT
    displayName: Max Throttled Keys Threshold
    defaults: 0
    description: Maximum allowable throttled partition keys before raising an operational incident alert.

  - id: alert_on_throttles
    type: BOOL
    displayName: Alert on Throttles
    defaults: true
    description: Whether to dispatch automated Slack incident notifications when hot partition throttles are detected.

tasks:
  - id: scan_contributor_insights
    type: io.kestra.plugin.scripts.python.Script
    description: Queries Amazon DynamoDB and CloudWatch Contributor Insights to isolate hot partition keys causing throttling.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install boto3
    env:
      AWS_ACCESS_KEY_ID: "{{ secret('AWS_ACCESS_KEY_ID') }}"
      AWS_SECRET_ACCESS_KEY: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
      AWS_DEFAULT_REGION: "{{ inputs.aws_region }}"
    script: |
      import os
      import json
      import boto3
      from datetime import datetime, timedelta, timezone
      from kestra import Kestra

      region = os.environ.get("AWS_DEFAULT_REGION", "us-east-1")
      table_filter = "{{ inputs.table_name_filter }}".strip().lower()
      max_throttles = int("{{ inputs.max_throttled_keys_threshold }}")

      dynamodb = boto3.client("dynamodb", region_name=region)
      cloudwatch = boto3.client("cloudwatch", region_name=region)

      end_time = datetime.now(timezone.utc)
      start_time = end_time - timedelta(hours=1)

      tables_audited = 0
      throttled_tables = []

      paginator = dynamodb.get_paginator("list_tables")
      for page in paginator.paginate():
          for table_name in page.get("TableNames", []):
              if table_filter != "all" and table_filter not in table_name.lower():
                  continue

              tables_audited += 1

              # Check Contributor Insights status
              try:
                  ci_status_resp = dynamodb.describe_contributor_insights(TableName=table_name)
                  ci_status = ci_status_resp.get("ContributorInsightsStatus", "DISABLED")

                  # If Contributor Insights is active, query the insight rule for throttled keys
                  rule_name = f"DynamoDBThrottledKeys-{table_name}"
                  throttled_keys = []

                  if ci_status == "ENABLED":
                      try:
                          insight_resp = cloudwatch.get_insight_rule_report(
                              RuleName=rule_name,
                              StartTime=start_time,
                              EndTime=end_time,
                              Period=300,
                              MaxContributorCount=10
                          )
                          contributors = insight_resp.get("Contributors", [])
                          for c in contributors:
                              throttled_keys.append({
                                  "keys": c.get("Keys", []),
                                  "approximate_aggregate_value": c.get("ApproximateAggregateValue", 0)
                              })
                      except Exception as rule_err:
                          # Fall back to table-level throttle metrics if custom rule is not present
                          pass

                  # Query table throttle events directly from CloudWatch
                  metric_response = cloudwatch.get_metric_data(
                      MetricDataQueries=[
                          {
                              "Id": "read_throttles",
                              "MetricStat": {
                                  "Metric": {
                                      "Namespace": "AWS/DynamoDB",
                                      "MetricName": "ReadThrottleEvents",
                                      "Dimensions": [{"Name": "TableName", "Value": table_name}]
                                  },
                                  "Period": 3600,
                                  "Stat": "Sum"
                              },
                              "ReturnData": True
                          },
                          {
                              "Id": "write_throttles",
                              "MetricStat": {
                                  "Metric": {
                                      "Namespace": "AWS/DynamoDB",
                                      "MetricName": "WriteThrottleEvents",
                                      "Dimensions": [{"Name": "TableName", "Value": table_name}]
                                  },
                                  "Period": 3600,
                                  "Stat": "Sum"
                              },
                              "ReturnData": True
                          }
                      ],
                      StartTime=start_time,
                      EndTime=end_time
                  )

                  results = {r["Id"]: (r["Values"][0] if r["Values"] else 0.0) for r in metric_response.get("MetricDataResults", [])}
                  total_throttles = int(results.get("read_throttles", 0) + results.get("write_throttles", 0))

                  if total_throttles > max_throttles or len(throttled_keys) > 0:
                      throttled_tables.append({
                          "table_name": table_name,
                          "contributor_insights_status": ci_status,
                          "total_throttle_events": total_throttles,
                          "read_throttle_events": int(results.get("read_throttles", 0)),
                          "write_throttle_events": int(results.get("write_throttles", 0)),
                          "top_throttled_keys": throttled_keys,
                          "remediation": f"aws dynamodb update-contributor-insights --table-name {table_name} --contributor-insights-action ENABLE"
                      })
              except Exception as e:
                  print(f"Error inspecting DynamoDB table {table_name}: {e}")

      Kestra.outputs({
          "total_tables_audited": tables_audited,
          "throttled_tables_count": len(throttled_tables),
          "has_throttled_tables": len(throttled_tables) > 0,
          "throttled_tables_details": json.dumps(throttled_tables)
      })

  - id: check_throttled_keys
    type: io.kestra.plugin.core.flow.If
    description: Evaluates whether DynamoDB tables experienced throttling or hot partition key access patterns.
    condition: "{{ outputs.scan_contributor_insights.vars.has_throttled_tables and inputs.alert_on_throttles }}"
    then:
      - id: notify_slack_dba
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches high-priority incident notifications to Slack with hot partition key identities and remediation steps.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#database-alerts",
            "username": "DynamoDB-Insights-Sentinel",
            "text": "CRITICAL: Amazon DynamoDB partition throttling detected in region `{{ inputs.aws_region }}`. Total tables audited: `{{ outputs.scan_contributor_insights.vars.total_tables_audited }}`, Throttled tables: `{{ outputs.scan_contributor_insights.vars.throttled_tables_count }}`."
          }

  - id: log_insights_status
    type: io.kestra.plugin.core.log.Log
    description: Records an operational audit trail of DynamoDB Contributor Insights evaluations.
    message: "DynamoDB Contributor Insights audit finished for region '{{ inputs.aws_region }}'. Total tables: {{ outputs.scan_contributor_insights.vars.total_tables_audited }}, Throttled: {{ outputs.scan_contributor_insights.vars.throttled_tables_count }}."

  - id: export_throttling_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Emits structured manifest of DynamoDB throttled tables and hot partition key values for capacity planning.
    format:
      region: "{{ inputs.aws_region }}"
      table_name_filter: "{{ inputs.table_name_filter }}"
      total_tables_audited: "{{ outputs.scan_contributor_insights.vars.total_tables_audited }}"
      throttled_tables_count: "{{ outputs.scan_contributor_insights.vars.throttled_tables_count }}"
      details: "{{ outputs.scan_contributor_insights.vars.throttled_tables_details }}"

triggers:
  - id: scheduled_dynamodb_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: Automated schedule trigger auditing DynamoDB throttled partition keys every 4 hours.
    cron: "0 */4 * * *"

extend:
  title: DynamoDB Contributor Insights Throttled Key Sentinel
  metaTitle: DynamoDB Contributor Insights Throttled Key Sentinel Blueprint
  shortDescription: Audits Amazon DynamoDB Contributor Insights to isolate hot partition keys causing throttling and transaction retries.
  metaDescription: Audits Amazon DynamoDB Contributor Insights to isolate hot partition keys causing transaction throttles, dispatching actionable diagnostics to database teams.
  description: |
    Amazon DynamoDB partitions table data across physical storage nodes based on partition key hash values. When access patterns concentrate disproportionate read or write request volume on a small subset of primary keys (commonly known as a hot partition), those storage partitions exhaust their 1,000 WCU or 3,000 RCU allocation, resulting in `ProvisionedThroughputExceededException` errors. Without granular diagnostics, engineering teams often over-provision overall table throughput, dramatically inflating cloud infrastructure spend without resolving partition-level hot spots. This sentinel interrogates DynamoDB Contributor Insights and CloudWatch metric telemetry on a scheduled cadence, isolates the exact partition keys and sort keys driving throttles, and dispatches actionable data modeling alerts to database platform teams on Slack.

    ## How it works
    1. **Scheduled triggering**: Executes every 4 hours via automated cron trigger (`0 */4 * * *`) or triggers on-demand via manual execution.
    2. **Table discovery**: Queries the Amazon DynamoDB API (`list_tables`) to identify active tables matching the configured filter.
    3. **Contributor insights inspection**: Calls `describe_contributor_insights` to verify rule status and pulls top contributor key lists via CloudWatch `get_insight_rule_report`.
    4. **Telemetry correlation**: Fetches `ReadThrottleEvents` and `WriteThrottleEvents` sums from CloudWatch across a 1-hour rolling evaluation window.
    5. **Conditional evaluation**: An `io.kestra.plugin.core.flow.If` task evaluates whether any table experienced throttle events or carries hot partition keys.
    6. **Slack incident dispatch**: Emits high-priority alert cards to the `#database-alerts` channel detailing affected tables, throttle event counts, hot key values, and CLI enablement commands.
    7. **Audit trail logging and return**: Logs operational execution status and returns a structured JSON manifest for capacity planning.

    ## Architecture diagram
    ```mermaid
    flowchart TD
      A[scheduled_dynamodb_audit Schedule Trigger] --> B[scan_contributor_insights Python Script]
      B --> C[check_throttled_keys Flowable If]
      C -- Throttling Detected --> D[notify_slack_dba Webhook]
      C -- All Partitions Balanced --> E[log_insights_status Log]
      D --> E
      E --> F[export_throttling_manifest Return]
    ```

    ## Use cases
    - **Hot partition key isolation**: Identify specific tenant IDs, sensor serial numbers, or entity keys causing request throttling on shared multi-tenant tables.
    - **FinOps capacity optimization**: Prevent wasteful whole-table capacity scale-ups by isolating partition key skews that require partition key salt or write sharding.
    - **Contributor insights coverage governance**: Audit regional DynamoDB tables to ensure critical high-throughput tables have CloudWatch Contributor Insights enabled.

    ## Inputs
    | Name | Type | Default | Description |
    | :--- | :--- | :--- | :--- |
    | `aws_region` | `STRING` | `us-east-1` | Target AWS region where DynamoDB tables and CloudWatch Contributor Insights rules are deployed. |
    | `table_name_filter` | `STRING` | `all` | Name or substring filter of DynamoDB tables to audit, or all to scan all regional tables. |
    | `max_throttled_keys_threshold` | `INT` | `0` | Maximum allowable throttled partition keys before raising an operational incident alert. |
    | `alert_on_throttles` | `BOOL` | `true` | Whether to dispatch automated Slack incident notifications when hot partition throttles are detected. |

    ## Expected outputs
    - `{{ outputs.scan_contributor_insights.vars.total_tables_audited }}`: Number of DynamoDB tables evaluated during the audit.
    - `{{ outputs.scan_contributor_insights.vars.throttled_tables_count }}`: Number of tables experiencing read or write throttle events.
    - `{{ outputs.scan_contributor_insights.vars.throttled_tables_details }}`: JSON string listing throttled tables with exact hot partition keys and event counts.
    - `{{ outputs.export_throttling_manifest.value }}`: Structured dictionary containing the consolidated DynamoDB audit summary.

    ## Prerequisites
    - Outbound HTTPS network access from Kestra execution workers to AWS DynamoDB and CloudWatch endpoints.
    - AWS IAM credentials configured with `dynamodb:ListTables`, `dynamodb:DescribeContributorInsights`, and `cloudwatch:GetInsightRuleReport` permissions.
    - Slack incoming webhook endpoint configured for database alerting.

    ### Secrets
    - `AWS_ACCESS_KEY_ID`: AWS IAM access key with permissions to read DynamoDB and CloudWatch Contributor Insights.
    - `AWS_SECRET_ACCESS_KEY`: AWS IAM secret key corresponding to the access key.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL used to dispatch database incident notifications.

    ## Quick start
    1. Define `AWS_ACCESS_KEY_ID`, `AWS_SECRET_ACCESS_KEY`, and `SLACK_WEBHOOK_URL` in your Kestra Secret storage.
    2. Import this workflow into your Kestra instance under the `company.database` namespace.
    3. Configure `aws_region` and `table_name_filter` to target your production DynamoDB tables.
    4. Execute a manual run to test table discovery and verify Slack notification delivery.

    ## Common pitfalls and troubleshooting
    - **Contributor Insights costs**: Amazon DynamoDB Contributor Insights incurs modest charges per million events processed; enable rules selectively on high-traffic tables.
    - **Rule propagation delay**: Newly enabled Contributor Insights rules require several minutes before CloudWatch begins emitting contributor key reports.
    - **Global secondary indexes**: Throttling can occur on Global Secondary Indexes (GSIs) even when the base table is healthy; verify GSI write provisioning matches base table write rates.

    ## How to extend
    - **Automated rule enablement**: Add an automated step to enable Contributor Insights on unmonitored tables that experience non-zero throttle events.
    - **Automated DAX provisioning**: Trigger caching layer recommendations (DynamoDB Accelerator) for tables where top contributor read keys represent static lookup entities.
    - **Jira ticket generation**: Automatically create an architectural backlog ticket in Jira for data engineering teams to implement partition key salting.

    ## Links
    - [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
    - [DynamoDB Contributor Insights Documentation](https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/contributorinsights.html)
    - [Boto3 DynamoDB Client Reference](https://boto3.amazonaws.com/v1/documentation/api/latest/reference/services/dynamodb.html)
  tags:
    - Data
    - Infrastructure
  subTags:
    - Day 2 Operations
    - Monitoring & Alerting
  ee: false
  demo: false
