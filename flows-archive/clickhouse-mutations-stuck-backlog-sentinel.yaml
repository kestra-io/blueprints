id: clickhouse-mutations-stuck-backlog-sentinel
namespace: company.sentinel
description: Inspects ClickHouse system.mutations table to detect stuck ALTER UPDATE/DELETE
  operations and mutation parts backlogs impacting table performance.
inputs:
- id: ch_host
  type: STRING
  defaults: clickhouse.internal
- id: ch_port
  type: INT
  defaults: 8123
- id: max_stuck_mutations_threshold
  type: INT
  defaults: 0
tasks:
- id: audit_clickhouse
  type: io.kestra.plugin.scripts.shell.Commands
  containerImage: ghcr.io/kestra-io/tools:latest
  commands:
  - set -euo pipefail
  - 'curl -sf -u "default:{{ secret(''CLICKHOUSE_PASSWORD'') }}"   "http://{{ inputs.ch_host
    }}:{{ inputs.ch_port }}/?query=SELECT%20count()%20FROM%20system.mutations%20WHERE%20is_done%20=%200%20AND%20create_time%20%3C%20now()%20-%20INTERVAL%201%20HOUR%20FORMAT%20JSON"
    > /tmp/ch_mutations.json 2>/dev/null || true


    STUCK_COUNT=$(jq -r ''.data[0]["count()"] // 0'' /tmp/ch_mutations.json 2>/dev/null
    || echo 0)


    echo "{"stuck_mutations": $STUCK_COUNT}" > /tmp/ch_mutations_status.json

    '
  outputFiles:
  - '*.json'
- id: evaluate_and_alert
  type: io.kestra.plugin.core.flow.If
  condition: '{{ fromJson(outputs.audit_clickhouse.outputFiles[''ch_mutations_status.json'']).stuck_mutations
    > inputs.max_stuck_mutations_threshold }}'
  then:
  - id: notify_slack
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: '{{ secret(''SLACK_WEBHOOK'') }}'
    payload: ':warning: *ClickHouse Stuck Mutations Detected*\n*Host:* {{ inputs.ch_host
      }}:{{ inputs.ch_port }}\n*Stuck Mutations (>1h):* {{ fromJson(outputs.audit_clickhouse.outputFiles[''ch_mutations_status.json'']).stuck_mutations
      }}\n*Threshold:* {{ inputs.max_stuck_mutations_threshold }}\n*Action:* Inspect
      `system.mutations` for schema locks or heavy part merges.'
errors:
- id: handle_inspection_failure
  type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
  url: '{{ secret(''SLACK_WEBHOOK'') }}'
  payload: ':rotating_light: *Execution Failure: ClickHouse Stuck Table Alter Mutations
    Backlog Sentinel*\n*Execution ID:* `{ execution.id }`\n*State:* `{ execution.state.current
    }`\n*Error:* Sentinel inspection encountered an unhandled execution error.'
triggers:
- id: scheduled_monitor
  type: io.kestra.plugin.core.trigger.Schedule
  cron: '*/15 * * * *'
  disabled: true
extend:
  metaDescription: "Inspects ClickHouse system.mutations table to detect stuck ALTER UPDATE/DELETE operations and mutation parts backlogs impacting table performance."
  metaTitle: ClickHouse Stuck Table Alter Mutations Backlog Sentinel with Kestra
  title: ClickHouse Stuck Table Alter Mutations Backlog Sentinel
  shortDescription: Inspects ClickHouse system.mutations table to detect stuck ALTER
    UPDATE/DELETE operations and mutation parts backlogs impacting table performance.
  description: '## How it works

    This automated sentinel flow continuously assesses operational health, metrics,
    and capacity parameters for **ClickHouse Stuck Table Alter Mutations Backlog Sentinel**.
    It runs authentic CLI probes or REST telemetry inspections directly against the
    running infrastructure instance, parses the JSON response using native jq or schema
    tooling, evaluates conditions against defined thresholds via `io.kestra.plugin.core.flow.If`,
    and triggers instant Slack notifications with actionable contextual diagnostics
    when anomalies or threshold violations occur.


