id: datadog-synthetic-test-assertion-regression-sentinel
namespace: company.sre

description: Audits Datadog Synthetic test executions for assertion regressions and critical user journey failures.

concurrency:
  limit: 1

inputs:
  - id: datadogSite
    type: STRING
    displayName: Datadog Site
    defaults: datadoghq.com
    description: Datadog intake domain (e.g., datadoghq.com, datadoghq.eu, us3.datadoghq.com).

  - id: syntheticTestId
    type: STRING
    displayName: Synthetic Test Public ID
    defaults: abc-123-xyz
    description: Public ID of the Datadog Synthetic API or Browser test to evaluate.

  - id: maxConsecutiveFailures
    type: INT
    displayName: Max Consecutive Failures
    defaults: 3
    description: Threshold of consecutive failed test executions triggering regression alerts.

  - id: datadogApiKey
    type: SECRET
    displayName: Datadog API Key
    defaults: datadog_api_key_secret
    description: Encrypted Datadog API key for accessing Synthetic test telemetry.

  - id: datadogAppKey
    type: SECRET
    displayName: Datadog Application Key
    defaults: datadog_app_key_secret
    description: Encrypted Datadog Application key with read permissions.

  - id: slackWebhookUri
    type: SECRET
    displayName: Slack Webhook URI
    defaults: https://hooks.slack.com/services/T00/B00/XXXX
    description: Encrypted Slack Incoming Webhook endpoint for alerting QA and SRE teams.

tasks:
  - id: evaluate_synthetic_test_results
    type: io.kestra.plugin.scripts.python.Script
    description: Queries Datadog API for recent Synthetic test execution results and failed assertions.
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install requests
    env:
      DD_SITE: "{{ inputs.datadogSite }}"
      DD_API_KEY: "{{ inputs.datadogApiKey }}"
      DD_APP_KEY: "{{ inputs.datadogAppKey }}"
      TEST_ID: "{{ inputs.syntheticTestId }}"
    script: |
      import os
      import json
      import requests

      dd_site = os.getenv('DD_SITE', 'datadoghq.com')
      api_key = os.getenv('DD_API_KEY')
      app_key = os.getenv('DD_APP_KEY')
      test_id = os.getenv('TEST_ID')
      max_failures = {{ inputs.maxConsecutiveFailures }}

      headers = {
          "DD-API-KEY": api_key,
          "DD-APPLICATION-KEY": app_key,
          "Accept": "application/json"
      }

      url = f"https://api.{dd_site}/api/v1/synthetics/tests/{test_id}/results"
      resp = requests.get(url, headers=headers, params={"count": 10}, timeout=15)

      results = resp.json().get("results", []) if resp.status_code == 200 else []

      consecutive_fails = 0
      failed_assertions = []

      for r in results:
          status = r.get("result", {}).get("eventType") or r.get("status")
          error_code = r.get("result", {}).get("errorCode")
          error_msg = r.get("result", {}).get("errorMessage", "Assertion failed")

          if error_code or status == 0 or status == "failed":
              consecutive_fails += 1
              failed_assertions.append({
                  "result_id": r.get("result_id"),
                  "check_time": r.get("check_time"),
                  "error_code": error_code,
                  "error_msg": error_msg
              })
          else:
              break

      has_regression = consecutive_fails >= max_failures

      report = {
          "test_id": test_id,
          "evaluated_runs": len(results),
          "consecutive_failures": consecutive_fails,
          "threshold": max_failures,
          "has_regression": has_regression,
          "recent_errors": failed_assertions[:3],
          "recommended_action": f"Inspect Datadog Synthetics UI at https://app.{dd_site}/synthetics/details/{test_id} and trigger redeploy or hotfix." if has_regression else "Synthetic assertions passing normally."
      }

      with open("synthetic_report.json", "w") as f:
          json.dump(report, f)

      print(f"Datadog Synthetic {test_id}: {consecutive_fails} consecutive failures. Regression: {has_regression}")

  - id: check_assertion_regression
    type: io.kestra.plugin.core.flow.If
    description: Branch execution based on whether synthetic test assertion failures exceeded threshold.
    condition: "{{ fromJson(read('synthetic_report.json')).has_regression }}"
    then:
      - id: notify_slack_synthetic_regression
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches high-priority synthetic test regression alert to Slack.
        url: "{{ inputs.slackWebhookUri }}"
        payload: |
          {
            "text": "Datadog Synthetics Alert: Test *{{ fromJson(read('synthetic_report.json')).test_id }}* experienced {{ fromJson(read('synthetic_report.json')).consecutive_failures }} consecutive assertion failures! Threshold: {{ inputs.maxConsecutiveFailures }}. Runbook: {{ fromJson(read('synthetic_report.json')).recommended_action }}"
          }
    else:
      - id: log_healthy_synthetic_tests
        type: io.kestra.plugin.core.log.Log
        description: Logs nominal test execution state when synthetic tests pass assertions.
        message: "Datadog Synthetic test {{ fromJson(read('synthetic_report.json')).test_id }} is passing assertions with zero critical regressions."

  - id: export_synthetic_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Exports structured Datadog synthetic test health report.
    format: "{{ fromJson(read('synthetic_report.json')) }}"

triggers:
  - id: scheduled_synthetic_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: Scheduled audit inspecting Datadog Synthetic test results every fifteen minutes.
    cron: "*/15 * * * *"

extend:
  title: Datadog Synthetic Test Assertion Regression Sentinel
  shortDescription: Monitors Datadog Synthetics API and browser tests for assertion regressions and consecutive failure thresholds.
  metaTitle: Datadog Synthetic Test Assertion Regression Sentinel | Kestra
  metaDescription: Audits Datadog Synthetic API and browser test executions, detects assertion regressions, and delivers actionable incident runbooks to SRE teams via Slack.
  description: |
    Audits Datadog Synthetics synthetic monitoring suites to detect sustained assertion regressions and user journey degradations.

    ## How it works
    1. Triggers every 15 minutes on schedule to inspect synthetic test execution telemetry.
    2. Runs a containerized Python script querying the Datadog Synthetics REST API for recent test execution history.
    3. Evaluates error codes, HTTP status assertions, and response payload validators across consecutive test runs.
    4. Evaluates if consecutive failure counts breach configured limits using an `If` conditional task.
    5. Dispatches an alert to Slack with the test ID, error diagnostics, and direct Datadog UI links when regressions are confirmed.
    6. Logs nominal passing status and exports a structured execution manifest for SRE compliance reporting.

    ## Architecture diagram
    ```mermaid
    flowchart TD
        A[Schedule Trigger: Every 15 Minutes] --> B[Task: evaluate_synthetic_test_results]
        B --> C{Task: check_assertion_regression}
        C -- Regression Detected --> D[Task: notify_slack_synthetic_regression]
        C -- Passing Normally --> E[Task: log_healthy_synthetic_tests]
        D --> F[Task: export_synthetic_manifest]
        E --> F
    ```

    ## What you get
    - Rapid detection of sustained synthetic test assertion failures across public API endpoints and web journeys.
    - Automatic suppression of transient one-off network glitches via consecutive failure evaluation logic.
    - Targeted Slack incident notifications with direct Datadog Synthetics inspection links and failure error codes.
    - Exported JSON test health manifest enabling automated rollback or Canary progression gating.

    ## Who it's for
    - Site Reliability Engineers (SREs) monitoring production uptime SLAs and global synthetic response times.
    - QA Automation and Quality Engineering teams maintaining critical end-to-end user journey tests.
    - Release Managers looking for post-deployment automated validation gates.

    ## Why orchestrate this with Kestra
    While Datadog Synthetics sends raw monitor notifications, complex multi-region environments suffer from alert noise and lack automated remedial orchestration. Kestra transforms synthetic test results into an automated decision engine: it tracks consecutive failure streaks, isolates specific assertion error messages, formats actionable Slack cards, and enables downstream workflows like canary rollbacks or incident ticket creation without manual toil.

    ## Use cases
    - **Continuous Production API Validation**: Alert on broken JSON schema validations or invalid response codes in public partner APIs.
    - **Checkout Flow Degradation**: Detect when synthetic browser tests fail checkout funnel assertion steps following an application release.
    - **Global DNS and Edge Latency Regression**: Identify regional synthetic location probe failures before external customers report outages.

    ## Inputs
    | Name | Type | Default | Description |
    | --- | --- | --- | --- |
    | `datadogSite` | `STRING` | `datadoghq.com` | Datadog intake domain (e.g., datadoghq.com, datadoghq.eu). |
    | `syntheticTestId` | `STRING` | `abc-123-xyz` | Public ID of the Datadog Synthetic API or Browser test to evaluate. |
    | `maxConsecutiveFailures` | `INT` | `3` | Threshold of consecutive failed test executions triggering regression alerts. |
    | `datadogApiKey` | `SECRET` | `None` | Encrypted Datadog API key for accessing Synthetic test telemetry. |
    | `datadogAppKey` | `SECRET` | `None` | Encrypted Datadog Application key with read permissions. |
    | `slackWebhookUri` | `SECRET` | `None` | Encrypted Slack Incoming Webhook endpoint for alerting QA and SRE teams. |

    ## Expected outputs
    Primary execution outputs exported by `export_synthetic_manifest`:
    - `test_id`: Evaluated Datadog Synthetic test identifier.
    - `evaluated_runs`: Number of recent test runs examined.
    - `consecutive_failures`: Count of uninterrupted test run failures.
    - `has_regression`: Boolean flag indicating whether assertion failures breached threshold.
    - `recommended_action`: Remediation link and action steps.

    Example expression: `{{ outputs.export_synthetic_manifest.value.has_regression }}`

    ## Prerequisites
    - An active Datadog account with configured Synthetic API or Browser tests.
    - Datadog API Key and Application Key with `synthetics_read` scope.
    - A Slack Incoming Webhook URL stored in Kestra secrets.

    ### Secrets
    - `DD_API_KEY`: Datadog API key for authentication.
    - `DD_APP_KEY`: Datadog Application key for authorization.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL.

    ## Quick start
    1. Register your Datadog API and Application keys in Kestra secrets.
    2. Deploy this flow into your SRE monitoring namespace.
    3. Specify `syntheticTestId` matching the synthetic test public ID from Datadog.
    4. Execute the workflow to confirm metric extraction and regression detection.

    ## Common pitfalls and troubleshooting
    - **Datadog Site Selection**: European Datadog accounts require setting `datadogSite: datadoghq.eu`. Using the default US domain will result in HTTP 403 or 404 errors.
    - **Flaky Single Tests**: The sentinel evaluates consecutive failures rather than a single intermittent blip to eliminate false positives.
    - **Test Paused State**: If a synthetic test is paused in Datadog, the API returns previous runs without generating new failures.

    ## How to extend
    - **Automated Rollback Triggering**: Trigger a downstream deployment rollback workflow if synthetic regressions persist post-deploy.
    - **PagerDuty Severity Escalation**: Escalate to PagerDuty critical incident alerts when consecutive failures exceed five runs.
    - **Fleet Monitoring**: Iterate over an array of multiple synthetic test IDs using `io.kestra.plugin.core.flow.ForEach`.

    ## Links
    - [Datadog Synthetics API Documentation](https://docs.datadoghq.com/api/latest/synthetics/)
    - [Datadog Synthetic Monitoring Guide](https://docs.datadoghq.com/synthetics/)
    - [Kestra Python Script Plugin](https://kestra.io/plugins/plugin-scripts/python/io.kestra.plugin.scripts.python.script)
    - [Kestra Slack Notification Plugin](https://kestra.io/plugins/plugin-slack/notifications/io.kestra.plugin.slack.notifications.slackincomingwebhook)
  tags:
    - Infrastructure
    - Core
  subTags:
    - Monitoring & Alerting
    - Testing & Quality
  ee: false
  demo: false
