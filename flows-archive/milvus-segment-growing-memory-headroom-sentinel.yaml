id: milvus-segment-growing-memory-headroom-sentinel
namespace: company.ai

inputs:
  - id: milvus_endpoint
    type: STRING
    defaults: "http://milvus.internal:19530"
    description: Base URL of the Milvus Vector Database REST/gRPC proxy.
  - id: collection_name
    type: STRING
    description: Target vector collection name to audit.

tasks:
  - id: inspect_collection_stats
    type: io.kestra.plugin.scripts.shell.Commands
    commands:
      - |
        # Query Milvus collection statistics via REST API
        curl -s -X POST "{{ inputs.milvus_endpoint }}/v1/vector/collections/describe" \
          -H "Content-Type: application/json" \
          -H "Authorization: Bearer {{ secret('MILVUS_TOKEN') }}" \
          --data '{"collectionName": "{{ inputs.collection_name }}"}' > /tmp/milvus_desc.json

        python3 -c "
        import json
        try:
            with open('/tmp/milvus_desc.json') as f:
                data = json.load(f)
            code = data.get('code', 0)
            coll = data.get('data', {})
            row_count = coll.get('rowCount', 0)
            is_loaded = coll.get('loaded', False)
            is_breach = 1 if not is_loaded or code != 0 else 0
            print(f'{is_breach}|{row_count}|{is_loaded}')
        except Exception:
            print('1|0|False')
        " > /tmp/milvus_summary.txt

        IS_BREACH=$(cut -d '|' -f 1 /tmp/milvus_summary.txt)
        ROW_COUNT=$(cut -d '|' -f 2 /tmp/milvus_summary.txt)
        IS_LOADED=$(cut -d '|' -f 3 /tmp/milvus_summary.txt)
        
        echo "::set-output name=is_breach::${IS_BREACH:-0}::"
        echo "::set-output name=row_count::$ROW_COUNT::"
        echo "::set-output name=is_loaded::$IS_LOADED::"

  - id: evaluate_vector_readiness
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.inspect_collection_stats.vars.is_breach | int == 1 }}"
    then:
      - id: notify_ai_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#ai-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 Milvus Vector Collection Unloaded Warning",
                "text": "Vector collection {{ inputs.collection_name }} on {{ inputs.milvus_endpoint }} is not loaded in query node memory (Loaded: {{ outputs.inspect_collection_stats.vars.is_loaded }}). Vector similarity search queries and RAG retrieval will fail.",
                "footer": "Kestra AI Sentinel • Milvus Vector DB"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#ai-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ Milvus Sentinel Failure",
            "text": "Failed to communicate with Milvus proxy at {{ inputs.milvus_endpoint }}.",
            "footer": "Kestra Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  metaDescription: "Audits Milvus vector collections to ensure indexes are loaded in query node memory for real-time similarity search."
  metaTitle: Milvus Vector Database Collection Loading Readiness Sentinel with Kestra
  ee: false
  demo: false
  title: Milvus Vector Database Collection Loading Readiness Sentinel
  shortDescription: Audits Milvus vector collections to ensure indexes are loaded in query node memory for real-time similarity search.
  description: |
    ## How it works
    This workflow connects to a Milvus Vector Database instance via its REST API (`/v1/vector/collections/describe`) to audit collection state and memory loading readiness. In Milvus architectures, vector search operations (`HNSW`, `IVF_FLAT`) require collections and underlying segment indexes to be loaded into QueryNode RAM. When query nodes restart due to OOM errors or cluster memory reaches capacity limits, collections remain unseated or fail to load. This sentinel verifies that the collection is loaded and alerts AI platform engineers before RAG pipelines experience search timeouts.

    ## What you get
    - Real-time verification of Milvus vector collection memory readiness.
    - Protection against silent RAG embedding query failures.
    - Automated Slack incident notifications detailing collection row count and load state.

    ## Who it's for
    - AI Infrastructure Engineers maintaining Milvus and Zilliz vector databases.
    - Machine Learning Platform teams safeguarding enterprise RAG applications.
    - SREs managing GPU/CPU memory allocations for vector search.

    ## Why orchestrate this with Kestra
    - **Scheduled Surveillance**: Routinely checks vector readiness without running custom cron jobs.
    - **Encrypted Credential Protection**: Secures Milvus authentication tokens in Kestra secrets.
    - **Automated Remediation**: Can trigger a collection load request via API (`POST /v1/vector/collections/load`).

    ## Prerequisites
    - Running Milvus instance with enabled REST proxy (`19530`).
    - API token configured in `MILVUS_TOKEN` secret.
    - Slack incoming webhook URL configured in `SLACK_WEBHOOK` secret.

    ## Quick start
    1. Import this blueprint into your Kestra instance.
    2. Add `MILVUS_TOKEN` and `SLACK_WEBHOOK` secrets.
    3. Specify `milvus_endpoint` and `collection_name`.
    4. Enable the schedule trigger for continuous collection surveillance.

    ## How to extend
    - Automatically call `POST /v1/vector/collections/load` when an unloaded collection is detected.
    - Check QueryNode memory consumption metrics via Prometheus endpoint.
    - Route critical alerts to PagerDuty or Opsgenie.

    ## Links
    - [Milvus RESTful API Documentation](https://milvus.io/docs/v2.3.x/restful_api_v2.md)
    - [Kestra Shell Plugin](https://kestra.io/plugins/plugin-scripts-shell)
    - [Kestra Slack Notifications](https://kestra.io/plugins/plugin-slack)
  tags:
    - AI
    - Data
  subTags:
    - Agents & Structured Output
    - ELT & Data Landing
