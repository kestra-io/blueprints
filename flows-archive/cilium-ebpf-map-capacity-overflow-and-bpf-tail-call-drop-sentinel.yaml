    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
    - [Cilium Official Documentation and Architecture Guide](https://docs.cilium.io/en/stable/)
    - [Cilium eBPF Map Tuning and Performance Optimization Manual](https://docs.cilium.io/en/stable/operations/performance/tuning/)
    - [Troubleshooting Cilium Datapath Drops and Network Packet Loss](https://docs.cilium.io/en/stable/operations/troubleshooting/)
