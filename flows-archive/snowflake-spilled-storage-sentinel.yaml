id: snowflake-spilled-storage-sentinel
namespace: company.dataops

inputs:
  - id: snowflake_account
    type: STRING
    defaults: xy12345.us-east-1
    description: Snowflake account identifier.
  - id: snowflake_username
    type: STRING
    defaults: kestra_monitor
    description: Snowflake service user.
  - id: max_spilled_gb_threshold
    type: FLOAT
    defaults: 10.0
    description: Maximum permissible spilled storage in gigabytes per query before alerting.

tasks:
  - id: query_spilled_queries
    type: io.kestra.plugin.jdbc.snowflake.Query
    url: "jdbc:snowflake://{{ inputs.snowflake_account }}.snowflakecomputing.com"
    username: "{{ inputs.snowflake_username }}"
    password: "{{ secret('SNOWFLAKE_PASSWORD') }}"
    sql: |
      SELECT 
        QUERY_ID, 
        USER_NAME, 
        WAREHOUSE_NAME, 
        ROUND((BYTES_SPILLED_TO_LOCAL_STORAGE + BYTES_SPILLED_TO_REMOTE_STORAGE) / 1073741824.0, 2) AS SPILLED_GB,
        QUERY_TEXT
      FROM SNOWFLAKE.ACCOUNT_USAGE.QUERY_HISTORY
      WHERE START_TIME >= DATEADD('hour', -1, CURRENT_TIMESTAMP())
        AND (BYTES_SPILLED_TO_LOCAL_STORAGE + BYTES_SPILLED_TO_REMOTE_STORAGE) > ({{ inputs.max_spilled_gb_threshold }} * 1073741824)
      ORDER BY SPILLED_GB DESC
      LIMIT 5;
    fetchType: FETCH

  - id: evaluate_spilled_storage
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.query_spilled_queries.rows | length > 0 }}"
    then:
      - id: alert_data_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "text": ":warning: *Snowflake Memory Spill Alert*: Detected {{ outputs.query_spilled_queries.rows | length }} queries spilling over {{ inputs.max_spilled_gb_threshold }} GB to disk on warehouse `{{ outputs.query_spilled_queries.rows[0].WAREHOUSE_NAME }}` (Top Query: {{ outputs.query_spilled_queries.rows[0].QUERY_ID }} spilled {{ outputs.query_spilled_queries.rows[0].SPILLED_GB }} GB). Warehouse upsizing or query refactoring recommended."
          }

errors:
  - id: notify_sentinel_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "text": ":warning: *Snowflake Sentinel Failure*: Failed to query spilled storage metrics."
      }

triggers:
  - id: hourly_spill_check
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 * * * *"
    disabled: true

extend:
  metaDescription: "Audits Snowflake query history to identify queries spilling large byte volumes to local/remote storage due to memory exhaustion."
  metaTitle: Snowflake Query Memory Spill to Disk and Warehouse Sizing Sentinel with Kestra
  title: Snowflake Query Memory Spill to Disk and Warehouse Sizing Sentinel
  shortDescription: Audits Snowflake query history to identify queries spilling large byte volumes to local/remote storage due to memory exhaustion.
  description: |
    ## How it works
    This sentinel leverages the JDBC Snowflake plugin to inspect `SNOWFLAKE.ACCOUNT_USAGE.QUERY_HISTORY` over rolling one-hour windows. It isolates queries that exceed virtual warehouse RAM and spill gigabytes to local SSDs or remote cloud storage, alerting administrators to resize warehouses or tune query joins.

    ## What you get
    - Proactive visibility into memory-constrained warehouse workloads.
    - Early prevention of severe analytical query execution slowdowns caused by remote disk I/O.
    - Automated Slack delivery detailing query IDs, warehouses, user names, and spilled gigabytes.

    ## Who it's for
    - Data platform engineers, database administrators, and analytics architects.
    - FinOps leads optimizing warehouse compute size allocations.

    ## Why orchestrate this with Kestra
    Kestra runs automated scheduled analytical health checks natively using the Snowflake JDBC plugin suite, combining SQL telemetry with declarative conditional logic and notification dispatching.

    ## Prerequisites
    - Snowflake account access with permissions on `ACCOUNT_USAGE.QUERY_HISTORY`.
    - Secrets `SNOWFLAKE_PASSWORD` and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import this blueprint into Kestra.
    2. Configure account, user, and threshold GB.
    3. Run manually to check current disk spill metrics.

    ## How to extend
    - Compare remote versus local spill bytes to differentiate mild from catastrophic warehouse undersizing.
    - Automatically scale up the warehouse size via `ALTER WAREHOUSE ... SET WAREHOUSE_SIZE` during heavy reporting windows.
    - Export spill metrics to a FinOps dashboard in Tableau or PowerBI.

    ## Links
    - [Kestra Snowflake Plugin](https://kestra.io/plugins/plugin-jdbc-snowflake)
    - [Snowflake Managing Warehouses](https://docs.snowflake.com/en/user-guide/warehouses-overview)
  tags:
    - Data
    - Cloud
  subTags:
    - FinOps & Cost Management
    - Monitoring & Alerting
  ee: false
  demo: false
