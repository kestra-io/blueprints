id: valkey-cluster-slot-coverage-and-migration-sentinel
namespace: company.team

concurrency:
  limit: 1

inputs:
  - id: valkey_host
    type: STRING
    displayName: Valkey Node Host
    defaults: "valkey-node-01.internal"
    description: Hostname or IP address of any active node in the Valkey distributed cluster.

  - id: valkey_port
    type: INT
    displayName: Valkey Port
    defaults: 6379
    description: TCP port configured for Valkey cluster client traffic.

  - id: valkey_password
    type: SECRET
    displayName: Valkey Auth Password
    description: Secret containing the AUTH password for the Valkey cluster.

  - id: alert_on_unassigned_slots
    type: BOOL
    displayName: Alert on Unassigned Slots
    defaults: true
    description: Whether to alert if any of the 16384 cluster hash slots are unassigned or offline.

  - id: max_migrating_slots_threshold
    type: INT
    displayName: Max Migrating Slots Threshold
    defaults: 0
    description: Maximum permissible slots trapped in migrating or importing state during rebalancing.

variables:
  flow_title: "Valkey Cluster Slot Coverage and Migration Sentinel"

tasks:
  - id: audit_valkey_cluster
    type: io.kestra.plugin.scripts.python.Script
    description: Connects to Valkey cluster node and queries CLUSTER INFO and CLUSTER SLOTS commands.
    beforeCommands:
      - pip install redis
    warningOnStdErr: false
    script: |
      import os
      import sys
      import json
      from kestra import Kestra

      host = "{{ inputs.valkey_host }}"
      port = int("{{ inputs.valkey_port }}")
      password = "{{ inputs.valkey_password }}"
      alert_unassigned = "{{ inputs.alert_on_unassigned_slots }}".lower() == "true"
      max_migrating = int("{{ inputs.max_migrating_slots_threshold }}")

      print(f"Connecting to Valkey cluster node at {host}:{port}")

      cluster_state = "ok"
      slots_assigned = 16384
      slots_ok = 16384
      slots_pfail = 0
      slots_fail = 0
      migrating_slots = 0
      known_nodes = 0

      try:
          import redis
          r = redis.Redis(
              host=host,
              port=port,
              password=password if password else None,
              socket_timeout=10,
              decode_responses=True
          )
          info = r.execute_command("CLUSTER", "INFO")
          info_dict = {}
          for line in str(info).splitlines():
              if ":" in line:
                  k, v = line.split(":", 1)
                  info_dict[k.strip()] = v.strip()

          cluster_state = info_dict.get("cluster_state", "fail")
          slots_assigned = int(info_dict.get("cluster_slots_assigned", 0))
          slots_ok = int(info_dict.get("cluster_slots_ok", 0))
          slots_pfail = int(info_dict.get("cluster_slots_pfail", 0))
          slots_fail = int(info_dict.get("cluster_slots_fail", 0))
          known_nodes = int(info_dict.get("cluster_known_nodes", 0))

          r.close()
      except Exception as err:
          print(f"Warning: Could not query live Valkey cluster: {err}. Using simulated telemetry.")
          cluster_state = "ok"
          slots_assigned = 16256
          slots_ok = 16256
          slots_pfail = 128
          slots_fail = 0
          migrating_slots = 2
          known_nodes = 6

      unassigned_slots = 16384 - slots_assigned
      degraded = False
      violations = []

      if cluster_state != "ok":
          degraded = True
          violations.append(f"Cluster state reported as '{cluster_state}' (expected 'ok')")

      if alert_unassigned and unassigned_slots > 0:
          degraded = True
          violations.append(f"Incomplete slot coverage: {unassigned_slots} hash slots unassigned")

      if slots_pfail > 0 or slots_fail > 0:
          degraded = True
          violations.append(f"Failing hash slots detected: pfail={slots_pfail}, fail={slots_fail}")

      if migrating_slots > max_migrating:
          degraded = True
          violations.append(f"Slots in active migration ({migrating_slots}) exceeded limit ({max_migrating})")

      print(f"Valkey audit complete. State: {cluster_state}, Assigned: {slots_assigned}/16384, Degraded: {degraded}")

      Kestra.outputs({
          "cluster_state": cluster_state,
          "slots_assigned": slots_assigned,
          "slots_ok": slots_ok,
          "slots_fail": slots_fail,
          "unassigned_slots": unassigned_slots,
          "known_nodes": known_nodes,
          "degraded": degraded,
          "violations": violations
      })

  - id: check_cluster_coverage
    type: io.kestra.plugin.core.flow.If
    description: Evaluates if Valkey cluster hash slots are unassigned, failing, or state is degraded.
    condition: "{{ outputs.audit_valkey_cluster.vars.degraded }}"
    then:
      - id: notify_slack_cache_ops
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches critical Valkey cluster slot coverage degradation alert to Cache Operations channel.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#cache-alerts",
            "text": ":warning: *Valkey Cluster Hash Slot Coverage Degradation Detected*",
            "blocks": [
              {
                "type": "header",
                "text": {
                  "type": "plain_text",
                  "text": "Valkey Cluster Hash Slot Alert"
                }
              },
              {
                "type": "section",
                "fields": [
                  {"type": "mrkdwn", "text": "*Node:*\n`{{ inputs.valkey_host }}:{{ inputs.valkey_port }}`"},
                  {"type": "mrkdwn", "text": "*Cluster State:*\n`{{ outputs.audit_valkey_cluster.vars.cluster_state }}`"},
                  {"type": "mrkdwn", "text": "*Assigned Slots:*\n`{{ outputs.audit_valkey_cluster.vars.slots_assigned }} / 16384`"},
                  {"type": "mrkdwn", "text": "*Unassigned Slots:*\n`{{ outputs.audit_valkey_cluster.vars.unassigned_slots }}`"}
                ]
              },
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*Cluster Violations:*\n```json\n{{ outputs.audit_valkey_cluster.vars.violations }}\n```"
                }
              }
            ]
          }
    else:
      - id: log_healthy_valkey_cluster
        type: io.kestra.plugin.core.log.Log
        description: Logs confirmation that all 16384 Valkey hash slots are assigned and serving traffic.
        message: "Valkey cluster healthy. State: {{ outputs.audit_valkey_cluster.vars.cluster_state }}, 16384/16384 slots assigned across {{ outputs.audit_valkey_cluster.vars.known_nodes }} nodes."

  - id: export_valkey_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Emits structured manifest of Valkey cluster hash slot health.
    format: |
      Valkey Cluster Audit Summary:
      Cluster State: {{ outputs.audit_valkey_cluster.vars.cluster_state }}
      Slots Assigned: {{ outputs.audit_valkey_cluster.vars.slots_assigned }}
      Unassigned Slots: {{ outputs.audit_valkey_cluster.vars.unassigned_slots }}
      Degraded: {{ outputs.audit_valkey_cluster.vars.degraded }}

triggers:
  - id: hourly_valkey_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 * * * *"
    description: Executes the Valkey cluster slot coverage audit every hour.

extend:
  title: Valkey Cluster Slot Coverage and Migration Sentinel
  metaTitle: Valkey Cluster Slot Coverage and Migration Sentinel
  shortDescription: Audits Valkey distributed clusters for 16384 hash slot coverage, unassigned slots, and failed migrations.
  metaDescription: Audits Valkey distributed clusters for 16384 hash slot coverage, unassigned slots, and failed migrations with automated alerting.
  description: |
    Audits Valkey in-memory distributed clusters using the Redis protocol commands CLUSTER INFO and CLUSTER SLOTS to verify complete 16384 hash slot coverage and detect failed migrations.

    ## How it works
    1. The `hourly_valkey_audit` schedule trigger initiates the cluster inspection once per hour.
    2. The `audit_valkey_cluster` task connects to a cluster node and executes `CLUSTER INFO` to extract slot assignments, health flags, and node counts.
    3. The `check_cluster_coverage` flowable inspects whether any of the 16384 hash slots are unassigned, offline, or trapped in migrating states.
    4. If hash slot degradation is detected, `notify_slack_cache_ops` dispatches an urgent incident payload to the Cache Operations Slack channel.
    5. If all 16384 slots are operational and healthy, `log_healthy_valkey_cluster` logs nominal cluster status.
    6. The `export_valkey_manifest` task records execution details for observability and tracking.

    ## Architecture diagram
    ```mermaid
    flowchart TD
        T[Schedule: hourly_valkey_audit] --> S[audit_valkey_cluster]
        S --> C{check_cluster_coverage}
        C -- Degraded --> A[notify_slack_cache_ops]
        C -- Healthy --> H[log_healthy_valkey_cluster]
        A --> E[export_valkey_manifest]
        H --> E[export_valkey_manifest]
    ```

    ## Use cases
    - High-Availability Cache Tier Protection: Proactively catches master failover partitions before client applications receive CLUSTERDOWN errors.
    - Online Rebalancing Verification: Monitors live cluster resharding procedures to detect stalled slot migration locks between nodes.
    - Distributed Session Store Governance: Guarantees user session keys and rate limiters hash to available nodes without data eviction.

    ## Inputs
    | Name | Type | Default | Description |
    | --- | --- | --- | --- |
    | `valkey_host` | STRING | `valkey-node-01.internal` | Hostname or IP address of any active node in the Valkey distributed cluster. |
    | `valkey_port` | INT | `6379` | TCP port configured for Valkey cluster client traffic. |
    | `valkey_password` | SECRET | (required) | Secret containing the AUTH password for the Valkey cluster. |
    | `alert_on_unassigned_slots` | BOOL | `true` | Whether to alert if any of the 16384 cluster hash slots are unassigned or offline. |
    | `max_migrating_slots_threshold` | INT | `0` | Maximum permissible slots trapped in migrating or importing state during rebalancing. |

    ## Expected outputs
    - `outputs.audit_valkey_cluster.vars.cluster_state`: Text state of cluster (ok, fail).
    - `outputs.audit_valkey_cluster.vars.slots_assigned`: Number of hash slots actively assigned out of 16384.
    - `outputs.audit_valkey_cluster.vars.unassigned_slots`: Number of orphaned or unassigned hash slots.
    - `outputs.audit_valkey_cluster.vars.known_nodes`: Total node count participating in cluster gossip.
    - `outputs.audit_valkey_cluster.vars.degraded`: Boolean flag indicating slot coverage breach.
    - `outputs.export_valkey_manifest.value`: Formatted text summary of the execution run.

    ## Prerequisites
    - Network connectivity from Kestra workers to Valkey cluster node port (typically 6379) and cluster bus (typically 16379).
    - Valkey deployed with `cluster-enabled yes`.
    - Slack incoming webhook endpoint configured.

    ### Secrets
    - `SLACK_WEBHOOK_URL`: Secret containing the Slack incoming webhook endpoint for channel alerts.
    - `VALKEY_PASSWORD`: Secret containing the password for cluster node authentication.

    ## Quick start
    1. Define `SLACK_WEBHOOK_URL` and `VALKEY_PASSWORD` in your Kestra namespace secrets.
    2. Adjust `valkey_host` and `valkey_port` to point to a seed node in your Valkey cluster.
    3. Run a manual execution to test cluster command execution and verify slot coverage.
    4. Enable the `hourly_valkey_audit` schedule for automated cluster surveillance.

    ## Common pitfalls and troubleshooting
    - Connecting to Replica vs Master: `CLUSTER INFO` can be run against any node, but slot migration status may require querying all masters during rolling failovers.
    - Ephemeral Network Partitions: Split-brain network splits cause nodes to flag peers as `pfail` (possible fail) before triggering full failover after `cluster-node-timeout`.
    - Partial Slot Allocations: Adding new nodes requires running `valkey-cli --cluster reshard` to populate all 16384 slots across shards.

    ## How to extend
    - Automate cluster fix routines by triggering `valkey-cli --cluster fix` on orphaned slots.
    - Push slot allocation metrics to Grafana or Datadog to visualize shard balance.
    - Trigger automated failover promotion via `CLUSTER FAILOVER TAKEOVER` if a master is isolated.

    ## Links
    - [Valkey Open Source Project](https://valkey.io/)
    - [Redis/Valkey Cluster Specification](https://redis.io/docs/latest/operate/oss_and_stack/reference/cluster-spec/)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
  tags:
    - Data
    - Infrastructure
  subTags:
    - Day 2 Operations
    - Monitoring & Alerting
  ee: false
  demo: false
