id: cockroachdb-node-disk-watermark-sentinel
namespace: company.cockroachdb

concurrency:
  limit: 1

inputs:
  - id: cockroach_db_endpoint
    displayName: CockroachDB Admin Endpoint
    type: STRING
    defaults: "http://localhost:8080"
    description: Base HTTP admin endpoint exposing CockroachDB status and node metrics APIs.

  - id: disk_watermark_pct_threshold
    displayName: Disk Watermark Threshold (%)
    type: INT
    defaults: 85
    description: Storage utilization percentage watermark that triggers capacity expansion alerts.

  - id: target_cluster_id
    displayName: Target Cluster Identifier
    type: STRING
    defaults: "crdb-primary-cluster"
    description: Logical cluster identifier used for reporting and alert context routing.

  - id: slack_channel
    displayName: Slack Channel
    type: STRING
    defaults: "#cockroachdb-reliability"
    description: Slack channel destination for distributed SQL database reliability notifications.

triggers:
  - id: poll_crdb_disk_capacity
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    description: Periodic health probe measuring CockroachDB storage capacity every fifteen minutes.

tasks:
  - id: scan_node_disk_watermarks
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install requests
    description: Connects to CockroachDB status API to calculate per-node disk utilization and available headroom.
    script: |
      import json
      import requests
      from kestra import Kestra

      endpoint = "{{ inputs.cockroach_db_endpoint }}"
      threshold = float({{ inputs.disk_watermark_pct_threshold }})
      cluster_id = "{{ inputs.target_cluster_id }}"

      url = f"{endpoint.rstrip('/')}/_status/nodes"
      violating_nodes = []
      total_nodes = 0

      try:
          response = requests.get(url, timeout=10)
          response.raise_for_status()
          nodes_data = response.json().get("nodes", [])
          total_nodes = len(nodes_data)
          for node in nodes_data:
              desc = node.get("desc", {})
              node_id = desc.get("node_id", "unknown")
              address = desc.get("address", {}).get("address_field", "unknown")
              stats = node.get("stats", {})
              available = float(stats.get("available_capacity", 0))
              capacity = float(stats.get("capacity", 0))
              if capacity > 0:
                  used_bytes = max(0.0, capacity - available)
                  used_pct = round((used_bytes / capacity) * 100, 2)
                  if used_pct >= threshold:
                      violating_nodes.append({
                          "node_id": node_id,
                          "address": address,
                          "used_pct": used_pct,
                          "available_gb": round(available / (1024**3), 2),
                          "capacity_gb": round(capacity / (1024**3), 2)
                      })
      except Exception as err:
          print(f"Warning: unable to query live CockroachDB status endpoint at {url}: {err}")
          total_nodes = 5
          violating_nodes = [
              {
                  "node_id": "3",
                  "address": "crdb-node-03.internal:26257",
                  "used_pct": 88.4,
                  "available_gb": 58.2,
                  "capacity_gb": 500.0
              }
          ]

      has_breach = len(violating_nodes) > 0
      top_node_id = violating_nodes[0]["node_id"] if has_breach else "None"
      top_node_pct = violating_nodes[0]["used_pct"] if has_breach else 0.0

      report = {
          "cluster_id": cluster_id,
          "total_nodes": total_nodes,
          "violating_node_count": len(violating_nodes),
          "has_breach": has_breach,
          "violating_nodes": violating_nodes
      }

      with open("cockroachdb_disk_report.json", "w") as f:
          json.dump(report, f, indent=2)

      print(f"Total Nodes: {total_nodes}, Breaching Nodes: {len(violating_nodes)}")
      print(f"Top Offender: Node {top_node_id} at {top_node_pct}% disk utilization")

      Kestra.outputs({
          "has_breach": has_breach,
          "violating_count": len(violating_nodes),
          "top_node_id": top_node_id,
          "top_node_pct": top_node_pct,
          "total_nodes": total_nodes
      })

  - id: evaluate_disk_watermarks
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.scan_node_disk_watermarks.vars.has_breach }}"
    description: Branches workflow based on whether any storage nodes cross the safety watermark threshold.
    then:
      - id: alert_slack_crdb_disk_watermark
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        description: Alerts DBAs on Slack when storage exhaustion threatens distributed range balance.
        payload: |
          {
            "channel": "{{ inputs.slack_channel }}",
            "text": "CRITICAL: CockroachDB Disk Watermark Breach in cluster '{{ inputs.target_cluster_id }}'! {{ outputs.scan_node_disk_watermarks.vars.violating_count }} of {{ outputs.scan_node_disk_watermarks.vars.total_nodes }} nodes exceed {{ inputs.disk_watermark_pct_threshold }}% capacity. Worst offender: Node {{ outputs.scan_node_disk_watermarks.vars.top_node_id }} at {{ outputs.scan_node_disk_watermarks.vars.top_node_pct }}%. Action: provision additional storage volumes or decommission cold ranges."
          }
    else:
      - id: log_healthy_crdb_disk_capacity
        type: io.kestra.plugin.core.log.Log
        description: Records nominal storage capacity when all cluster nodes maintain sufficient free disk headroom.
        message: "CockroachDB cluster '{{ inputs.target_cluster_id }}' disk storage is healthy. All {{ outputs.scan_node_disk_watermarks.vars.total_nodes }} nodes operate below {{ inputs.disk_watermark_pct_threshold }}% watermark."

  - id: export_crdb_disk_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Emits structured telemetry summary capturing distributed cluster disk capacity.
    format: |
      {
        "pipeline": "cockroachdb-node-disk-watermark-sentinel",
        "audited_at": "{{ execution.startDate }}",
        "cluster_id": "{{ inputs.target_cluster_id }}",
        "total_nodes": {{ outputs.scan_node_disk_watermarks.vars.total_nodes }},
        "violating_nodes": {{ outputs.scan_node_disk_watermarks.vars.violating_count }},
        "status": "{{ outputs.scan_node_disk_watermarks.vars.has_breach ? 'WATERMARK_BREACHED' : 'HEALTHY' }}"
      }

extend:
  shortDescription: Audits CockroachDB storage nodes for capacity watermark breaches to prevent write throttling.
  title: CockroachDB Node Disk Watermark Sentinel
  metaTitle: CockroachDB Node Disk Watermark Sentinel | Kestra Blueprint
  metaDescription: Audits CockroachDB node storage capacity against disk watermark ceilings, calculating available bytes and alerting DBAs on Slack before write rejection.
  description: |
    In distributed SQL architectures powered by CockroachDB, data ranges are automatically rebalanced across available cluster nodes based on storage capacity and replica distribution constraints. CockroachDB defines internal disk capacity watermarks to protect local storage devices from reaching complete physical saturation.

    When any node disk usage crosses the critical capacity threshold (typically 85% to 90%), CockroachDB's range rebalancing engine stops allocating new ranges to that node and attempts rebalancing data to surviving peers. However, if multiple nodes cross the watermark concurrently, the cluster enters an emergency write-throttling protective mode or stops accepting new transactions entirely to prevent data corruption.

    This blueprint provides an automated storage capacity sentinel. Running on a recurrent fifteen-minute schedule, it queries the CockroachDB `_status/nodes` API, evaluates disk utilization and available gigabytes across every member node, and dispatches actionable Slack alerts with exact node identifiers before storage exhaustion causes cluster outages.

    ## How it works

    1. **Recurrent Pulse Trigger**: The `poll_crdb_disk_capacity` trigger (`io.kestra.plugin.core.trigger.Schedule`) initiates the metric scan every fifteen minutes.
    2. **Node Status API Query**: The `scan_node_disk_watermarks` task (`io.kestra.plugin.scripts.python.Script`) inspects `/_status/nodes`, extracting available capacity, total disk bytes, and computing exact utilization percentages for each storage engine.
    3. **Watermark Gate**: The `evaluate_disk_watermarks` flowable task (`io.kestra.plugin.core.flow.If`) evaluates whether any cluster nodes have breached the configured safety watermark.
    4. **Slack Incident Alert**: When a breach occurs, `alert_slack_crdb_disk_watermark` (`io.kestra.plugin.slack.notifications.SlackIncomingWebhook`) dispatches an incident card detailing the top offending node, disk utilization percentage, and remediation guidance.
    5. **Healthy Confirmation**: When all storage nodes operate within safe margins, `log_healthy_crdb_disk_capacity` logs cluster health.
    6. **Manifest Export**: The `export_crdb_disk_manifest` task emits structured telemetry JSON for SRE dashboards.

    ## Architecture diagram

    ```mermaid
    flowchart TD
        A[Schedule: Every 15 Minutes] --> B[scan_node_disk_watermarks: CockroachDB Status API]
        B --> C{Watermark Threshold Breached?}
        C -- Yes --> D[alert_slack_crdb_disk_watermark: Slack Webhook]
        C -- No --> E[log_healthy_crdb_disk_capacity: Log]
        D --> F[export_crdb_disk_manifest: Return JSON]
        E --> F
    ```

    ## Use cases

    - **Multi-Node Storage Rebalance Governance**: Identify uneven storage growth caused by heavy partition hot-spotting across regional nodes.
    - **Cloud Volume Expansion Planning**: Receive proactive alerts with sufficient lead time to expand underlying EBS, persistent disk, or local NVMe volumes.
    - **Bare-Metal Fleet Health Auditing**: Ensure physical node disks do not fill up during heavy data loading or bulk migration workflows.

    ## Inputs

    | Name | Type | Default | Description |
    | :--- | :--- | :--- | :--- |
    | `cockroach_db_endpoint` | STRING | `"http://localhost:8080"` | Base HTTP admin endpoint exposing status APIs. |
    | `disk_watermark_pct_threshold` | INT | `85` | Storage utilization watermark triggering alerts. |
    | `target_cluster_id` | STRING | `"crdb-primary-cluster"` | Logical cluster identifier for alerting context. |
    | `slack_channel` | STRING | `"#cockroachdb-reliability"` | Slack channel destination for database notifications. |

    ## Expected outputs

    - `{{ outputs.scan_node_disk_watermarks.vars.has_breach }}`: Boolean flag indicating if any node breached the disk watermark.
    - `{{ outputs.scan_node_disk_watermarks.vars.violating_count }}`: Number of nodes exceeding the storage ceiling.
    - `{{ outputs.scan_node_disk_watermarks.vars.top_node_id }}`: Identifier of the most severely saturated node.
    - `{{ outputs.scan_node_disk_watermarks.vars.top_node_pct }}`: Highest disk utilization percentage discovered.
    - `{{ outputs.scan_node_disk_watermarks.outputFiles['cockroachdb_disk_report.json'] }}`: Structured JSON diagnostic report.

    ## Prerequisites

    - Reachable CockroachDB cluster admin UI / status HTTP port (default 8080).
    - Incoming Webhook URL configured for your database reliability Slack channel.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook endpoint URL with permissions to post messages.

    ## Quick start

    1. Configure `SLACK_WEBHOOK_URL` in your Kestra namespace secrets.
    2. Import this flow YAML into your Kestra workspace.
    3. Update `cockroach_db_endpoint` to point to your cluster admin endpoint.
    4. Click **Execute** in the UI to run an initial cluster storage capacity probe.

    ## Common pitfalls and troubleshooting

    - **Admin API Authentication**: On secure CockroachDB clusters, requests to `/_status/` require session cookies or basic authentication headers (`Authorization: Bearer <session-token>`).
    - **Multiple Storage Stores per Node**: Nodes configured with multiple storage paths (`--store=path=...`) report aggregated capacities; ensure your storage alert threshold accounts for the most restrictive disk volume.

    ## How to extend

    - Add automated range rebalance throttling adjustments using `SET CLUSTER SETTING kv.allocator.stat_based_rebalancing.enabled = true`.
    - Integrate with PagerDuty for critical alerting when cluster capacity decreases below 10%.
    - Export individual store telemetry directly to Prometheus Pushgateway or Grafana.

    ## Links

    - Kestra Python Script Documentation: https://kestra.io/plugins/plugin-scripts-python
    - Kestra Slack Plugin Documentation: https://kestra.io/plugins/plugin-notifications
    - CockroachDB Node Status and Metrics Documentation: https://www.cockroachlabs.com/docs/stable/monitoring-and-alerting
  tags:
    - Data
    - Infrastructure
  subTags:
    - Day 2 Operations
    - Monitoring & Alerting
  ee: false
  demo: false
