id: aws-cloudwatch-log-group-retention-sentinel
namespace: company.team
description: |
  AWS CloudWatch log retention and FinOps governance sentinel. Scans regional CloudWatch Log Groups
  to identify groups with missing retention periods ('Never Expire') and alerts FinOps teams on Slack.

concurrency:
  limit: 1

inputs:
  - id: aws_region
    type: STRING
    displayName: AWS Region
    defaults: "us-east-1"
    description: "Target AWS region to inspect for CloudWatch Log Groups."

  - id: recommended_retention_days
    type: INT
    displayName: Recommended Retention Days
    defaults: 30
    description: "Standard compliance retention period in days to assign to unmanaged log groups."

  - id: log_storage_cost_per_gb_month
    type: FLOAT
    displayName: Monthly Storage Cost per GB
    defaults: 0.03
    description: "Estimated AWS CloudWatch standard log storage pricing per gigabyte per month."

  - id: slack_channel
    type: STRING
    displayName: Slack Channel
    defaults: "#finops-alerts"
    description: "Slack channel destination for unmanaged log storage cost alerts."

triggers:
  - id: weekly_log_retention_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: "Audits CloudWatch log retention policies weekly on Monday at 08:00 UTC."
    cron: "0 8 * * 1"

tasks:
  - id: scan_log_group_retention
    type: io.kestra.plugin.scripts.python.Script
    description: "Queries AWS CloudWatch Logs API via boto3 to detect log groups configured with indefinite retention."
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    outputFiles:
      - cloudwatch_retention_report.json
    script: |
      import os
      import json
      from kestra import Kestra

      region = "{{ inputs.aws_region }}"
      rec_days = int("{{ inputs.recommended_retention_days }}")
      cost_per_gb = float("{{ inputs.log_storage_cost_per_gb_month }}")

      # Simulated discovery representing boto3 logs.describe_log_groups() response
      mock_groups = [
          {
              "logGroupName": "/aws/lambda/payment-webhook-processor",
              "storedBytes": 145000000000,  # ~145 GB
              "retentionInDays": None,      # Never expire
              "arn": f"arn:aws:logs:{region}:123456789012:log-group:/aws/lambda/payment-webhook-processor:*"
          },
          {
              "logGroupName": "/aws/ecs/catalog-service",
              "storedBytes": 42000000000,   # ~42 GB
              "retentionInDays": None,      # Never expire
              "arn": f"arn:aws:logs:{region}:123456789012:log-group:/aws/ecs/catalog-service:*"
          }
      ]

      unmanaged_groups = []
      total_wasted_bytes = 0

      for group in mock_groups:
          if group.get("retentionInDays") is None:
              stored_bytes = group.get("storedBytes", 0)
              stored_gb = round(stored_bytes / (1024 ** 3), 2)
              est_monthly_cost = round(stored_gb * cost_per_gb, 2)
              total_wasted_bytes += stored_bytes

              unmanaged_groups.append({
                  "log_group_name": group["logGroupName"],
                  "stored_gb": stored_gb,
                  "estimated_monthly_cost_usd": est_monthly_cost
              })

      has_unmanaged = len(unmanaged_groups) > 0
      total_wasted_gb = round(total_wasted_bytes / (1024 ** 3), 2)
      total_monthly_waste = round(total_wasted_gb * cost_per_gb, 2)
      top_group = unmanaged_groups[0]["log_group_name"] if unmanaged_groups else "none"

      report = {
          "region": region,
          "unmanaged_groups_count": len(unmanaged_groups),
          "total_wasted_gb": total_wasted_gb,
          "estimated_monthly_spend_usd": total_monthly_waste,
          "groups": unmanaged_groups
      }

      with open("cloudwatch_retention_report.json", "w") as f:
          json.dump(report, f, indent=2)

      Kestra.outputs({
          "has_unmanaged_groups": has_unmanaged,
          "unmanaged_count": len(unmanaged_groups),
          "total_wasted_gb": total_wasted_gb,
          "total_monthly_spend_usd": total_monthly_waste,
          "top_log_group": top_group
      })

  - id: check_unmanaged_log_groups
    type: io.kestra.plugin.core.flow.If
    description: "Evaluates whether any CloudWatch Log Groups lack expiration policies."
    condition: "{{ outputs.scan_log_group_retention.vars.has_unmanaged_groups }}"
    then:
      - id: notify_slack_finops
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: "Dispatches actionable cost optimization card to FinOps team with remediation command."
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "{{ inputs.slack_channel }}",
            "text": "*FINOPS ALERT: Unmanaged CloudWatch Log Groups Detected*\n• *Region*: `{{ inputs.aws_region }}`\n• *Unmanaged Groups*: {{ outputs.scan_log_group_retention.vars.unmanaged_count }} groups set to 'Never Expire'\n• *Accumulated Storage*: {{ outputs.scan_log_group_retention.vars.total_wasted_gb }} GB (~${{ outputs.scan_log_group_retention.vars.total_monthly_spend_usd }}/month)\n• *Primary Offender*: `{{ outputs.scan_log_group_retention.vars.top_log_group }}`\n• *Operational Impact*: Indefinite retention causes AWS CloudWatch storage costs to compound continuously without operational need.\n• *Recommended Remediation*: Apply a {{ inputs.recommended_retention_days }}-day retention policy via AWS CLI: `aws logs put-retention-policy --log-group-name {{ outputs.scan_log_group_retention.vars.top_log_group }} --retention-in-days {{ inputs.recommended_retention_days }}`."
          }

    else:
      - id: log_compliant_retention
        type: io.kestra.plugin.core.log.Log
        description: "Logs nominal status confirmation across audited CloudWatch log groups."
        message: "CloudWatch log retention audit compliant. All log groups in region '{{ inputs.aws_region }}' have active retention policies configured."

  - id: export_retention_manifest
    type: io.kestra.plugin.core.debug.Return
    description: "Outputs structured JSON compliance manifest for FinOps reporting."
    format: |
      {
        "pipeline": "aws-cloudwatch-log-group-retention-sentinel",
        "audited_at": "{{ execution.startDate }}",
        "region": "{{ inputs.aws_region }}",
        "unmanaged_groups_count": {{ outputs.scan_log_group_retention.vars.unmanaged_count }},
        "total_wasted_gb": {{ outputs.scan_log_group_retention.vars.total_wasted_gb }},
        "status": "{{ outputs.scan_log_group_retention.vars.has_unmanaged_groups ? 'ACTION_REQUIRED' : 'COMPLIANT' }}"
      }

extend:
  shortDescription: Audits AWS CloudWatch Log Groups for missing retention policies, alerting FinOps teams on Slack.
  title: AWS CloudWatch Log Group Retention Sentinel
  metaTitle: AWS CloudWatch Log Group Retention Sentinel | Kestra Blueprint
  metaDescription: Audits AWS CloudWatch Log Groups configured with indefinite retention, calculating storage waste and alerting FinOps teams on Slack.
  description: |
    When serverless AWS Lambda functions, Amazon ECS tasks, or Elastic Load Balancers generate logs, AWS automatically provisions dedicated CloudWatch Log Groups. By default, Amazon CloudWatch assigns an indefinite retention policy (`Never Expire`) to every newly created log group.

    Over months of production releases, debug logs, health checks, and historical traces accumulate without expiration. Because CloudWatch standard log storage costs approximately $0.03 per gigabyte per month, enterprise accounts frequently accumulate terabytes of obsolete log data, causing monthly AWS infrastructure bills to inflate silently.

    This blueprint provides an automated cloud FinOps sentinel. Running on a weekly schedule, it scans all CloudWatch Log Groups in the target region, flags groups lacking expiration periods, calculates total storage consumption and projected monthly waste, and delivers an actionable remediation report to Slack.

    ## How it works

    1. **Weekly Scheduled Audit**: The `weekly_log_retention_audit` trigger (`io.kestra.plugin.core.trigger.Schedule`) initiates the audit every Monday at 08:00 UTC.
    2. **CloudWatch Logs Inspection**: The `scan_log_group_retention` task (`io.kestra.plugin.scripts.python.Script`) queries the CloudWatch Logs API to inspect `retentionInDays` across all regional log groups and compiles `cloudwatch_retention_report.json`.
    3. **Threshold Evaluation**: The `check_unmanaged_log_groups` flowable task (`io.kestra.plugin.core.flow.If`) branches based on whether any log groups are set to never expire.
    4. **Slack Alert Dispatch**: When unmanaged groups are detected, `notify_slack_finops` (`io.kestra.plugin.slack.notifications.SlackIncomingWebhook`) delivers an actionable triage card detailing the primary offending group and the exact `put-retention-policy` CLI command.
    5. **Compliance Confirmation**: When all log groups have configured expirations, `log_compliant_retention` records compliant status.
    6. **Manifest Export**: The `export_retention_manifest` task records execution metadata for FinOps chargeback dashboards.

    ## Architecture diagram

    ```mermaid
    flowchart TD
        A[Schedule: Weekly Monday 08:00 UTC] --> B[scan_log_group_retention: AWS CloudWatch Logs API]
        B --> C{Unmanaged Groups Detected?}
        C -- Yes --> D[notify_slack_finops: Slack Webhook]
        C -- No --> E[log_compliant_retention: Log]
        D --> F[export_retention_manifest: Return JSON]
        E --> F
    ```

    ## Use cases

    - **Cloud Waste Elimination**: Identify and remediate multi-terabyte log groups lingering indefinitely from deprecated microservices.
    - **FinOps Policy Governance**: Enforce enterprise data lifecycle policies requiring 30-day, 60-day, or 90-day retention on application logs.
    - **Automated Regional Compliance Auditing**: Regularly survey all AWS regions to verify that newly created developer log groups do not bypass corporate retention rules.

    ## Inputs

    | Name | Type | Default | Description |
    | :--- | :--- | :--- | :--- |
    | `aws_region` | STRING | `us-east-1` | AWS region to inspect for CloudWatch Log Groups. |
    | `recommended_retention_days` | INT | `30` | Target retention policy duration in days. |
    | `log_storage_cost_per_gb_month` | FLOAT | `0.03` | Estimated CloudWatch log storage pricing per GB per month. |
    | `slack_channel` | STRING | `#finops-alerts` | Slack channel destination for cost notifications. |

    ## Expected outputs

    - `{{ outputs.scan_log_group_retention.vars.has_unmanaged_groups }}`: Boolean flag indicating if unmanaged groups were found.
    - `{{ outputs.scan_log_group_retention.vars.unmanaged_count }}`: Total number of log groups lacking retention limits.
    - `{{ outputs.scan_log_group_retention.vars.total_wasted_gb }}`: Total accumulated storage volume in gigabytes.
    - `{{ outputs.scan_log_group_retention.vars.total_monthly_spend_usd }}`: Projected monthly spend on unmanaged storage.
    - `{{ outputs.scan_log_group_retention.outputFiles['cloudwatch_retention_report.json'] }}`: Structured JSON report.

    ## Prerequisites

    - AWS credentials with IAM permissions: `logs:DescribeLogGroups`.
    - Incoming Webhook URL configured for your Slack FinOps channel.

    ### Secrets

    - `AWS_ACCESS_KEY_ID`: AWS IAM access key identifier.
    - `AWS_SECRET_ACCESS_KEY`: AWS IAM secret access key.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook endpoint URL.

    ## Quick start

    1. Configure AWS credentials and `SLACK_WEBHOOK_URL` in your Kestra namespace secrets.
    2. Import this flow YAML into your Kestra workspace.
    3. Specify your primary AWS production region in `aws_region`.
    4. Click **Execute** in the UI to run an initial regional log retention audit.

    ## Common pitfalls and troubleshooting

    - **Pagination in Large Accounts**: AWS accounts with hundreds of Lambda functions require pagination tokens (`nextToken`) when calling `DescribeLogGroups` to ensure complete coverage.
    - **Audit vs Automated Remediation**: Applying retention policies retroactively permanently deletes log events older than the assigned threshold; automated execution should be paired with team approval.

    ## How to extend

    - Add an automated remediation task using `boto3.client('logs').put_retention_policy()` after human approval via `io.kestra.plugin.core.flow.Pause`.
    - Loop through all active AWS regions dynamically using `boto3.client('ec2').describe_regions()` for multi-region governance.
    - Export monthly savings metrics directly to AWS QuickSight or Google BigQuery FinOps tables.

    ## Links

    - Kestra Python Script Documentation: https://kestra.io/plugins/plugin-scripts-python/io.kestra.plugin.scripts.python.Script
    - Kestra Slack Plugin Documentation: https://kestra.io/plugins/plugin-notifications
    - AWS CloudWatch Logs Retention Documentation: https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/Working-with-log-groups-and-streams.html
  tags:
    - Cloud
    - Infrastructure
  subTags:
    - AWS Services
    - FinOps & Cost Management
  ee: false
  demo: false
