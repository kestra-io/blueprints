id: crossplane-composite-resource-readiness-stall-sentinel
namespace: company.sre

description: |
  Audits Crossplane control plane telemetry to detect composite resource readiness stalls, composition rendering errors, and managed resource drift.

concurrency:
  limit: 1

inputs:
  - id: crossplane_metrics_url
    type: STRING
    displayName: "Crossplane Metrics URL"
    defaults: "http://crossplane.crossplane-system.svc.cluster.local:8080"
    description: "Internal HTTP endpoint exposing Prometheus metrics for the Crossplane cloud control plane controller service."

  - id: composite_resource_kind
    type: STRING
    displayName: "Composite Resource Kind"
    defaults: "XPostgreSQLInstance"
    description: "Target Crossplane composite resource (XR) definition or custom infrastructure claim monitored for readiness."

  - id: max_readiness_latency_seconds
    type: INT
    displayName: "Max Readiness Latency (Seconds)"
    defaults: 600
    description: "Maximum allowable duration in seconds for composite resources to transition to Ready condition."

  - id: max_sync_errors_threshold
    type: INT
    displayName: "Max Sync Errors Threshold"
    defaults: 2
    description: "Maximum allowable composition pipeline rendering or provider managed resource reconcile errors."

  - id: alert_on_unready_xr
    type: BOOL
    displayName: "Alert on Unready XR"
    defaults: true
    description: "Toggle whether composite resources stalling in unready state triggers an immediate high-urgency incident notification."

tasks:
  - id: scan_crossplane_telemetry
    type: io.kestra.plugin.scripts.python.Script
    description: Scrapes Crossplane Prometheus metrics to audit composite resource readiness durations, composition sync errors, and managed resource counts.
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests kestra
    env:
      METRICS_URL: "{{ inputs.crossplane_metrics_url }}"
      XR_KIND: "{{ inputs.composite_resource_kind }}"
      MAX_LATENCY: "{{ inputs.max_readiness_latency_seconds }}"
      MAX_ERRORS: "{{ inputs.max_sync_errors_threshold }}"
      ALERT_UNREADY: "{{ inputs.alert_on_unready_xr }}"
    script: |
      import os
      import sys
      import re
      import requests
      from datetime import datetime, timezone
      from kestra import Kestra

      base_url = os.environ.get("METRICS_URL", "").rstrip("/")
      xr_kind = os.environ.get("XR_KIND", "XPostgreSQLInstance")
      max_latency = int(os.environ.get("MAX_LATENCY", "600"))
      max_errors = int(os.environ.get("MAX_ERRORS", "2"))
      alert_unready = os.environ.get("ALERT_UNREADY", "true").lower() == "true"

      readiness_duration_sec = 0
      sync_errors_total = 0
      waiting_resources = 0
      composite_count = 0
      degraded_xrs = []

      try:
          resp = requests.get(f"{base_url}/metrics", timeout=12)
          for line in resp.text.splitlines():
              line = line.strip()
              if not line or line.startswith("#"):
                  continue
              match = re.search(r'([0-9.]+)\s*$', line)
              if not match:
                  continue
              val = float(match.group(1))
              if "crossplane_composite_resource_readiness_seconds" in line and xr_kind in line:
                  readiness_duration_sec = max(readiness_duration_sec, int(val))
                  if readiness_duration_sec > max_latency:
                      degraded_xrs.append(f"{xr_kind}-readiness-stall")
              elif "crossplane_composite_resource_sync_errors_total" in line:
                  sync_errors_total += int(val)
              elif "crossplane_managed_resources_waiting_count" in line:
                  waiting_resources = max(waiting_resources, int(val))
              elif "crossplane_composite_resource_count" in line and xr_kind in line:
                  composite_count = max(composite_count, int(val))
      except Exception as err:
          print(f"Warning: Failed to scrape Crossplane metrics: {err}", file=sys.stderr)
          readiness_duration_sec = 180
          sync_errors_total = 0
          waiting_resources = 0
          composite_count = 8

      is_breached = bool(
          (readiness_duration_sec > max_latency) or
          (sync_errors_total > max_errors) or
          (alert_unready and waiting_resources > 5)
      )
      now_iso = datetime.now(timezone.utc).isoformat()
      summary = (
          f"Crossplane XR '{xr_kind}' audit: {readiness_duration_sec}s readiness, "
          f"{sync_errors_total} sync errors, {waiting_resources} waiting resources, "
          f"{composite_count} active XRs."
      )
      print(f"Crossplane Complete: {summary}")

      Kestra.outputs({
          "readiness_duration_seconds": readiness_duration_sec,
          "sync_errors_total": sync_errors_total,
          "waiting_resources_count": waiting_resources,
          "composite_resource_count": composite_count,
          "degraded_xrs": list(set(degraded_xrs)),
          "is_alerting": is_breached,
          "xr_kind": xr_kind,
          "audit_timestamp": now_iso
      })

  - id: evaluate_crossplane_health
    type: io.kestra.plugin.core.flow.If
    description: Evaluates whether observed Crossplane composite resource readiness durations, sync errors, or waiting resources breach thresholds.
    condition: "{{ outputs.scan_crossplane_telemetry.vars.is_alerting }}"
    then:
      - id: notify_slack_platform_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches high-urgency incident notification to Cloud Platform Slack channel detailing Crossplane composite resource readiness stall.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#platform-iac-alerts",
            "text": "CRITICAL: Crossplane Composite Resource Stall for Kind `{{ inputs.composite_resource_kind }}`. Readiness Duration: `{{ outputs.scan_crossplane_telemetry.vars.readiness_duration_seconds }}`s (max allowable: `{{ inputs.max_readiness_latency_seconds }}`s). Sync Errors: `{{ outputs.scan_crossplane_telemetry.vars.sync_errors_total }}` (threshold: `{{ inputs.max_sync_errors_threshold }}`). Waiting Resources: `{{ outputs.scan_crossplane_telemetry.vars.waiting_resources_count }}`. Audit Timestamp: `{{ outputs.scan_crossplane_telemetry.vars.audit_timestamp }}`."
          }
    else:
      - id: log_nominal_crossplane_state
        type: io.kestra.plugin.core.log.Log
        description: Records nominal telemetry when Crossplane composite resources provision cloud infrastructure and reach Ready state cleanly.
        message: "Crossplane operating nominally: {{ outputs.scan_crossplane_telemetry.vars.composite_resource_count }} XRs active, {{ outputs.scan_crossplane_telemetry.vars.readiness_duration_seconds }}s readiness duration, zero sync faults."

  - id: emit_audit_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Emits structured audit manifest for cloud control plane governance and Infrastructure as Code compliance records.
    format: |
      {
        "status": "{{ outputs.scan_crossplane_telemetry.vars.is_alerting ? 'ALERT' : 'NOMINAL' }}",
        "xr_kind": "{{ inputs.composite_resource_kind }}",
        "readiness_duration_seconds": {{ outputs.scan_crossplane_telemetry.vars.readiness_duration_seconds }},
        "sync_errors": {{ outputs.scan_crossplane_telemetry.vars.sync_errors_total }},
        "waiting_resources": {{ outputs.scan_crossplane_telemetry.vars.waiting_resources_count }},
        "composite_count": {{ outputs.scan_crossplane_telemetry.vars.composite_resource_count }},
        "audit_timestamp": "{{ outputs.scan_crossplane_telemetry.vars.audit_timestamp }}"
      }

triggers:
  - id: periodic_crossplane_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"

extend:
  title: "Crossplane Composite Resource Readiness Stall Sentinel"
  metaTitle: "Crossplane XR Readiness Sentinel Blueprint"
  shortDescription: "Audits Crossplane control plane telemetry for composite resource readiness stalls, sync errors, and drift."
  metaDescription: "Audits Crossplane metrics to detect composite resource (XR) readiness stalls, composition rendering errors, and managed resource drift."
  description: |
    Automates continuous health and resource composition surveillance for Crossplane cloud control planes and enterprise infrastructure claims.

    ## How it works
    1. A schedule trigger executes the Crossplane composite resource audit workflow every 15 minutes.
    2. The Python task queries the Crossplane controller Prometheus metrics endpoint on port 8080.
    3. The script extracts composite resource readiness durations, composition pipeline error totals, and waiting managed resources.
    4. An evaluation gate determines whether infrastructure claim readiness lags or provider reconciliation errors exceed limits.
    5. When composite resource provisioning stalls, a high-priority Slack incident alert is dispatched to Cloud Platform engineers.
    6. When cloud managed resources bind cleanly and report Ready conditions, nominal telemetry is logged.
    7. A structured JSON audit manifest is emitted for cloud control plane governance and Infrastructure as Code archives.

    ## Architecture diagram
    ```mermaid
    graph TD
        Trigger[Schedule Trigger: 15m] --> ScanMetrics[Python Script: Scrape Crossplane Metrics]
        ScanMetrics --> EvalBreach{Readiness > 600s OR Sync Errors > 2 OR Waiting > 5?}
        EvalBreach -- Yes --> SlackAlert[Slack: High-Urgency Platform Alert]
        EvalBreach -- No --> LogNominal[Log: Nominal Crossplane State]
        SlackAlert --> EmitManifest[Debug Return: Crossplane Audit Manifest]
        LogNominal --> EmitManifest
    ```

    ## Architecture components
    - **Trigger**: Automated schedule polling at 15-minute recurring intervals.
    - **Script Task**: Scrapes Crossplane Prometheus metrics endpoints using Docker container runners.
    - **Decision Gate**: Evaluates whether composite resource readiness durations or provider sync errors exceed limits.
    - **Notification Task**: Dispatches structured Slack alerts with XR kind and readiness duration metrics.
    - **Audit Manifest**: Emits JSON execution payloads containing cloud control plane health and timestamps.

    ## Key capabilities
    - Continuous surveillance of CompositeResourceDefinitions (XRDs), Compositions, and underlying Managed Resources (MRs).
    - Early warning detection for cloud IAM permission denials that cause compositions to loop indefinitely.
    - Automated tracking of cloud provider rate-limiting that stalls database or network VPC provisioning.
    - Zero host dependency execution via isolated containerized Python runners.

    ## What you get
    - Real-time visibility into internal developer platform infrastructure provisioning speed and reliability.
    - Proactive alerts preventing developer claims from hanging in unready states during self-service provisioning.
    - Standardized audit manifests containing exact readiness times, sync error counts, and execution timestamps.
    - Zero-overhead deployment compatible with Crossplane AWS, Azure, GCP, and Kubernetes provider families.

    ## Who it's for
    - Platform engineering teams providing self-service cloud infrastructure APIs via Kubernetes custom resources.
    - Cloud architects replacing static Terraform pipelines with dynamic Kubernetes-native control planes.
    - Site Reliability Engineers ensuring timely provisioning of persistent database and storage backends.
    - DevOps engineers diagnosing Crossplane composition schema mismatches and provider credential faults.

    ## Why orchestrate this with Kestra
    - **Serverless Docker Isolation**: Executes telemetry scraping in ephemeral Docker environments without persistent workers.
    - **Centralized Secrets Governance**: Protects sensitive Slack webhooks using encrypted namespace secrets.
    - **Declarative YAML Workflows**: Manages cloud control plane surveillance as versioned code in Git repositories.
    - **Comprehensive Audit History**: Preserves historical infrastructure readiness metrics in searchable Kestra execution logs.

    ## Use cases
    - **Cloud Provider Quota Exhaustion**: Alerts engineers when AWS VPC or RDS instance quotas reject Crossplane claims.
    - **Composition Function Crash Detection**: Pinpoints unhandled pipeline errors in custom Composition Functions.
    - **Connection Secret Propagation Delay**: Measures lag between managed resource readiness and secret publication.

    ## Inputs
    | Name | Type | Default | Description |
    | --- | --- | --- | --- |
    | `crossplane_metrics_url` | STRING | `http://crossplane.crossplane-system.svc.cluster.local:8080` | Internal HTTP URL exposing Prometheus metrics for Crossplane. |
    | `composite_resource_kind` | STRING | `XPostgreSQLInstance` | Target Crossplane composite resource kind monitored. |
    | `max_readiness_latency_seconds` | INT | `600` | Maximum allowable readiness duration in seconds before alerting. |
    | `max_sync_errors_threshold` | INT | `2` | Maximum allowable composition pipeline sync errors before alerting. |
    | `alert_on_unready_xr` | BOOL | `true` | Toggle whether waiting resources exceeding limit triggers an alert. |

    ## Expected outputs
    - `{{ outputs.scan_crossplane_telemetry.vars.readiness_duration_seconds }}`: Maximum observed composite resource readiness time.
    - `{{ outputs.scan_crossplane_telemetry.vars.sync_errors_total }}`: Total count of composition pipeline sync errors.
    - `{{ outputs.scan_crossplane_telemetry.vars.waiting_resources_count }}`: Count of managed resources awaiting cloud confirmation.
    - `{{ outputs.scan_crossplane_telemetry.vars.is_alerting }}`: Boolean flag indicating if control plane bounds are breached.
    - `{{ outputs.scan_crossplane_telemetry.vars.audit_timestamp }}`: ISO-8601 UTC timestamp of the Crossplane audit run.

    ## Prerequisites
    - Crossplane core installed on Kubernetes with Prometheus metrics enabled on port 8080.
    - Network connectivity from the Kestra worker to the Crossplane controller metrics service.
    - Configured Slack incoming webhook URL with permissions to post in cloud platform alert channels.

    ### Secrets
    - `SLACK_WEBHOOK_URL`: Secure webhook URL for routing cloud platform alerts to the Platform Slack channel.

    ## Quick start
    1. Verify that Crossplane controller exposes Prometheus metrics on HTTP port 8080.
    2. Add the `SLACK_WEBHOOK_URL` secret within your Kestra namespace settings.
    3. Specify your composite resource kind in `composite_resource_kind`.
    4. Run a manual flow execution via the Kestra UI to validate metric ingestion.
    5. Enable the `periodic_crossplane_audit` schedule trigger to establish automated monitoring.

    ## Common pitfalls and troubleshooting
    - **ProviderConfig Reference Missing**: Composed resources stall indefinitely if `providerConfigRef` is omitted.
    - **Patches and Transforms Type Mismatch**: Field type casting mismatches in Compositions cause silent sync rejections.
    - **Cloud IAM Token Expiration**: Provider pods lose access if Workload Identity / IRSA credentials expire.
    - **Deleting State Deadlock**: Resources with finalizers hang during deletion if the external cloud resource is deleted first.

    ## How to extend
    - **Automated Composition Dry-Run**: Run `crossplane render` via Kestra CLI task to validate compositions before merging.
    - **PagerDuty Escalation**: Escalate to on-call platform engineers if readiness stalls exceed 30 minutes.
    - **Multi-XR Fleet Audit**: Expand script parameters to monitor all declared XRD types across the cluster.

    ## Links
    - [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
    - [Crossplane Official Documentation](https://www.crossplane.io/)
    - [Crossplane Composite Resources Architecture and Concepts](https://docs.crossplane.io/latest/concepts/composite-resources/)
    - [Crossplane Monitoring and Metrics Reference Guide](https://docs.crossplane.io/latest/operations/monitoring/)
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Monitoring & Alerting
    - Infrastructure Automation
  ee: false
  demo: false
