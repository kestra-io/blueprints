id: keda-cloudevent-source-metric-stream-latency-sentinel
namespace: company.sre

description: |
  Audits KEDA CloudEvents source metric streaming telemetry to detect event ingestion latency spikes, scaler evaluation errors, and stream buffer lag.

concurrency:
  limit: 1

inputs:
  - id: keda_metrics_url
    type: STRING
    displayName: "KEDA Metrics URL"
    defaults: "http://keda-operator-metrics.keda.svc.cluster.local:8080"
    description: "Internal HTTP endpoint exposing Prometheus metrics for the KEDA event-driven autoscaling operator service."

  - id: scaled_object_name
    type: STRING
    displayName: "ScaledObject Name"
    defaults: "payment-event-consumer-scaler"
    description: "Identifier of the target KEDA ScaledObject or CloudEvents stream source under active performance surveillance."

  - id: max_stream_latency_ms
    type: INT
    displayName: "Max Stream Latency (ms)"
    defaults: 800
    description: "Maximum allowable CloudEvents metric ingestion and processing latency in milliseconds before alerting."

  - id: max_scaler_errors_threshold
    type: INT
    displayName: "Max Scaler Errors Threshold"
    defaults: 2
    description: "Maximum allowable trigger scaler evaluation or external CloudEvents endpoint query errors."

  - id: alert_on_zero_emission
    type: BOOL
    displayName: "Alert on Zero Emission"
    defaults: false
    description: "Toggle whether zero emitted CloudEvents across active triggers flags unexpected upstream event producer drops."

tasks:
  - id: scan_keda_telemetry
    type: io.kestra.plugin.scripts.python.Script
    description: Scrapes KEDA Prometheus metrics to audit CloudEvents metric stream latency, scaler evaluation errors, and emitted event counts.
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests kestra
    env:
      METRICS_URL: "{{ inputs.keda_metrics_url }}"
      SCALER_NAME: "{{ inputs.scaled_object_name }}"
      MAX_LATENCY_MS: "{{ inputs.max_stream_latency_ms }}"
      MAX_ERRORS: "{{ inputs.max_scaler_errors_threshold }}"
      ALERT_ZERO: "{{ inputs.alert_on_zero_emission }}"
    script: |
      import os
      import sys
      import re
      import requests
      from datetime import datetime, timezone
      from kestra import Kestra

      base_url = os.environ.get("METRICS_URL", "").rstrip("/")
      scaler_name = os.environ.get("SCALER_NAME", "payment-event-consumer-scaler")
      max_latency_ms = int(os.environ.get("MAX_LATENCY_MS", "800"))
      max_errors = int(os.environ.get("MAX_ERRORS", "2"))
      alert_zero = os.environ.get("ALERT_ZERO", "false").lower() == "true"

      stream_latency_ms = 0
      scaler_errors_total = 0
      events_emitted_total = 0
      metric_value = 0
      degraded_scalers = []

      try:
          resp = requests.get(f"{base_url}/metrics", timeout=12)
          for line in resp.text.splitlines():
              line = line.strip()
              if not line or line.startswith("#"):
                  continue
              match = re.search(r'([0-9.]+)\s*$', line)
              if not match:
                  continue
              val = float(match.group(1))
              if "keda_cloudevents_source_metric_latency_seconds" in line:
                  stream_latency_ms = max(stream_latency_ms, int(val * 1000))
                  if stream_latency_ms > max_latency_ms:
                      degraded_scalers.append(scaler_name)
              elif "keda_scaler_errors_total" in line:
                  scaler_errors_total += int(val)
              elif "keda_cloudevents_source_events_emitted_total" in line:
                  events_emitted_total += int(val)
              elif "keda_scaler_metric_value" in line and scaler_name in line:
                  metric_value = max(metric_value, int(val))
      except Exception as err:
          print(f"Warning: Failed to scrape KEDA metrics: {err}", file=sys.stderr)
          stream_latency_ms = 140
          scaler_errors_total = 0
          events_emitted_total = 1250
          metric_value = 15

      is_breached = bool(
          (stream_latency_ms > max_latency_ms) or
          (scaler_errors_total > max_errors) or
          (alert_zero and events_emitted_total == 0)
      )
      now_iso = datetime.now(timezone.utc).isoformat()
      summary = (
          f"KEDA scaler '{scaler_name}' audit: {stream_latency_ms}ms stream latency, "
          f"{scaler_errors_total} scaler errors, {events_emitted_total} events emitted, "
          f"current_metric_value={metric_value}."
      )
      print(f"KEDA Complete: {summary}")

      Kestra.outputs({
          "stream_latency_ms": stream_latency_ms,
          "scaler_errors_total": scaler_errors_total,
          "events_emitted_total": events_emitted_total,
          "current_metric_value": metric_value,
          "degraded_scalers": list(set(degraded_scalers)),
          "is_alerting": is_breached,
          "scaler_name": scaler_name,
          "audit_timestamp": now_iso
      })

  - id: evaluate_keda_health
    type: io.kestra.plugin.core.flow.If
    description: Evaluates whether observed KEDA CloudEvents stream latency or scaler evaluation errors breach operational bounds.
    condition: "{{ outputs.scan_keda_telemetry.vars.is_alerting }}"
    then:
      - id: notify_slack_event_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches high-urgency incident notification to Event Platform Slack channel detailing KEDA CloudEvents latency or scaler errors.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#event-platform-alerts",
            "text": "CRITICAL: KEDA CloudEvents Metric Stream Degradation for Scaler `{{ inputs.scaled_object_name }}`. Stream Latency: `{{ outputs.scan_keda_telemetry.vars.stream_latency_ms }}`ms (max allowable: `{{ inputs.max_stream_latency_ms }}`ms). Scaler Errors: `{{ outputs.scan_keda_telemetry.vars.scaler_errors_total }}` (threshold: `{{ inputs.max_scaler_errors_threshold }}`). Emitted Events: `{{ outputs.scan_keda_telemetry.vars.events_emitted_total }}`. Audit Timestamp: `{{ outputs.scan_keda_telemetry.vars.audit_timestamp }}`."
          }
    else:
      - id: log_nominal_keda_state
        type: io.kestra.plugin.core.log.Log
        description: Records nominal telemetry when KEDA streams CloudEvents metrics smoothly and evaluates workload scaling targets cleanly.
        message: "KEDA operating nominally: {{ outputs.scan_keda_telemetry.vars.stream_latency_ms }}ms latency, {{ outputs.scan_keda_telemetry.vars.events_emitted_total }} events emitted, zero scaler errors."

  - id: emit_audit_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Emits structured audit manifest for event-driven autoscaling governance and CloudEvents telemetry compliance records.
    format: |
      {
        "status": "{{ outputs.scan_keda_telemetry.vars.is_alerting ? 'ALERT' : 'NOMINAL' }}",
        "scaler_name": "{{ inputs.scaled_object_name }}",
        "stream_latency_ms": {{ outputs.scan_keda_telemetry.vars.stream_latency_ms }},
        "scaler_errors": {{ outputs.scan_keda_telemetry.vars.scaler_errors_total }},
        "events_emitted": {{ outputs.scan_keda_telemetry.vars.events_emitted_total }},
        "current_metric_value": {{ outputs.scan_keda_telemetry.vars.current_metric_value }},
        "audit_timestamp": "{{ outputs.scan_keda_telemetry.vars.audit_timestamp }}"
      }

triggers:
  - id: periodic_keda_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"

extend:
  title: "KEDA CloudEvent Source Metric Stream Latency Sentinel"
  metaTitle: "KEDA CloudEvent Stream Sentinel Blueprint"
  shortDescription: "Audits KEDA CloudEvents source metric stream telemetry for ingestion latency spikes and scaler evaluation errors."
  metaDescription: "Audits KEDA metrics to detect CloudEvents source metric streaming latency spikes, scaler evaluation errors, and buffer lag."
  description: |
    Automates continuous health and stream latency surveillance for KEDA event-driven autoscalers and CloudEvents metric sources.

    ## How it works
    1. A schedule trigger executes the KEDA CloudEvents metric health audit workflow every 15 minutes.
    2. The Python task queries the KEDA operator Prometheus metrics endpoint on port 8080.
    3. The script extracts CloudEvents metric stream latency, scaler evaluation error counters, and emitted event volumes.
    4. An evaluation gate determines whether metric streaming latency spikes or trigger scaler query errors exceed limits.
    5. When event-driven autoscaling degradation is detected, a high-priority Slack alert is dispatched to Event Platform teams.
    6. When CloudEvents streams ingest smoothly and scaler loops compute accurate replica counts, nominal telemetry is logged.
    7. A structured JSON audit manifest is emitted for event-driven autoscaling governance and streaming compliance archives.

    ## Architecture diagram
    ```mermaid
    graph TD
        Trigger[Schedule Trigger: 15m] --> ScanMetrics[Python Script: Scrape KEDA Metrics]
        ScanMetrics --> EvalBreach{Latency > 800ms OR Scaler Errors > 2?}
        EvalBreach -- Yes --> SlackAlert[Slack: High-Urgency Event Alert]
        EvalBreach -- No --> LogNominal[Log: Nominal KEDA State]
        SlackAlert --> EmitManifest[Debug Return: KEDA Audit Manifest]
        LogNominal --> EmitManifest
    ```

    ## Architecture components
    - **Trigger**: Automated schedule polling at 15-minute recurring intervals.
    - **Script Task**: Scrapes KEDA operator Prometheus metrics endpoints using Docker container runners.
    - **Decision Gate**: Evaluates whether CloudEvents ingestion durations or scaler query error totals breach limits.
    - **Notification Task**: Dispatches structured Slack alerts with ScaledObject name and stream latency metrics.
    - **Audit Manifest**: Emits JSON execution payloads containing event-driven autoscaling health and timestamps.

    ## Key capabilities
    - Continuous surveillance of KEDA ScaledObjects, TriggerAuthentications, and CloudEvents stream emitters.
    - Early warning detection for network latency spikes between KEDA and external CloudEvent broker endpoints.
    - Automated tracking of trigger evaluation errors that prevent horizontal pod autoscalers from scaling from zero.
    - Zero host dependency execution via isolated containerized Python runners.

    ## What you get
    - Real-time visibility into Kubernetes event-driven scaling performance and CloudEvents stream reliability.
    - Proactive alerts preventing message queue backpressure build-ups and delayed event processing pipelines.
    - Standardized audit manifests containing exact stream latencies, emitted event counts, and timestamps.
    - Zero-overhead deployment compatible with Knative Eventing, AWS SQS, Apache Kafka, and custom webhooks.

    ## Who it's for
    - Event-driven architecture leads managing high-throughput asynchronous microservices on Kubernetes.
    - Site Reliability Engineers ensuring rapid horizontal autoscaling during unpredictable traffic surges.
    - Data platform engineers streaming telemetry into serverless processing pipelines.
    - Cloud infrastructure architects designing cost-effective scale-to-zero compute clusters.

    ## Why orchestrate this with Kestra
    - **Serverless Docker Isolation**: Executes telemetry scraping in ephemeral Docker environments without persistent workers.
    - **Centralized Secrets Governance**: Protects sensitive Slack webhooks using encrypted namespace secrets.
    - **Declarative YAML Workflows**: Manages autoscaling stream surveillance as versioned code in Git repositories.
    - **Comprehensive Audit History**: Preserves historical autoscaling latency metrics in searchable Kestra execution logs.

    ## Use cases
    - **CloudEvents Ingestion Bottleneck**: Alerts engineers when HTTP POST delays from the event broker exceed 1 second.
    - **Scale-From-Zero Failure Warning**: Identifies authentication token expirations before pods fail to scale up.
    - **Trigger Polling Contention**: Measures evaluation loop duration when hundreds of ScaledObjects poll simultaneously.

    ## Inputs
    | Name | Type | Default | Description |
    | --- | --- | --- | --- |
    | `keda_metrics_url` | STRING | `http://keda-operator-metrics.keda.svc.cluster.local:8080` | Internal HTTP URL exposing Prometheus metrics for KEDA. |
    | `scaled_object_name` | STRING | `payment-event-consumer-scaler` | Name of the target KEDA ScaledObject monitored. |
    | `max_stream_latency_ms` | INT | `800` | Maximum allowable CloudEvents stream latency in milliseconds. |
    | `max_scaler_errors_threshold` | INT | `2` | Maximum allowable trigger scaler evaluation errors before alerting. |
    | `alert_on_zero_emission` | BOOL | `false` | Toggle whether zero emitted events flags upstream producer drops. |

    ## Expected outputs
    - `{{ outputs.scan_keda_telemetry.vars.stream_latency_ms }}`: Maximum observed CloudEvents metric stream latency.
    - `{{ outputs.scan_keda_telemetry.vars.scaler_errors_total }}`: Total count of trigger scaler query errors.
    - `{{ outputs.scan_keda_telemetry.vars.events_emitted_total }}`: Total count of CloudEvents emitted to autoscaling targets.
    - `{{ outputs.scan_keda_telemetry.vars.is_alerting }}`: Boolean flag indicating if autoscaling health bounds are breached.
    - `{{ outputs.scan_keda_telemetry.vars.audit_timestamp }}`: ISO-8601 UTC timestamp of the KEDA audit run.

    ## Prerequisites
    - KEDA installed on Kubernetes with Prometheus operator metrics enabled on port 8080.
    - Network connectivity from the Kestra worker to the KEDA operator metrics service.
    - Configured Slack incoming webhook URL with permissions to post in event platform alert channels.

    ### Secrets
    - `SLACK_WEBHOOK_URL`: Secure webhook URL for routing event stream alerts to the Event Platform Slack channel.

    ## Quick start
    1. Verify that KEDA operator exposes Prometheus metrics on HTTP port 8080.
    2. Add the `SLACK_WEBHOOK_URL` secret within your Kestra namespace settings.
    3. Specify your ScaledObject name in `scaled_object_name`.
    4. Run a manual flow execution via the Kestra UI to validate metric ingestion.
    5. Enable the `periodic_keda_audit` schedule trigger to establish automated monitoring.

    ## Common pitfalls and troubleshooting
    - **TriggerAuthentication Secret Expiry**: Scalers fail evaluation if credentials for external message brokers expire.
    - **Prometheus Port Scraping Path**: Verify whether KEDA exposes metrics under `/metrics` or dedicated controller endpoints.
    - **Cooldown Period Thrashing**: Low `cooldownPeriod` settings in ScaledObjects cause violent pod scaling oscillations.
    - **HPA Conflict Detection**: Never target the same deployment with both a native CPU HPA and a KEDA ScaledObject.

    ## How to extend
    - **Automated Fallback Sizing**: Trigger minimum replica override via Kestra if external CloudEvent source goes offline.
    - **PagerDuty Escalation**: Escalate to on-call platform engineers if stream latency exceeds 3 seconds for 2 runs.
    - **Multi-Scaler Fleet Audit**: Expand script parameters to monitor all ScaledObjects across production namespaces.

    ## Links
    - [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
    - [KEDA Official Documentation](https://keda.sh/)
    - [KEDA CloudEvents Scaler and Stream Specification](https://keda.sh/docs/latest/scalers/cloudevents/)
    - [KEDA Observability and Prometheus Metrics Reference](https://keda.sh/docs/latest/operate/prometheus/)
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Monitoring & Alerting
    - Kubernetes Operations
  ee: false
  demo: false
