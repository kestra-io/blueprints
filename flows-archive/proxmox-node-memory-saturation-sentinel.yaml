id: proxmox-node-memory-saturation-sentinel
namespace: company.infrastructure

description: |
  Audit Proxmox VE hypervisor nodes on a schedule or on demand for memory saturation,
  classify host starvation risk as HEALTHY, WARNING, CRITICAL, or PROBE_FAILED, alert
  Slack with real utilization telemetry, and safely migrate or shut down candidate
  workloads when automated remediation is enabled.

inputs:
  - id: host
    type: STRING
    displayName: "Proxmox Host"
    description: "Hostname or IP address of the Proxmox VE node (no scheme, no port, e.g. pve.internal or 192.168.1.100)."
    defaults: "pve.internal"

  - id: port
    type: INT
    displayName: "API Port"
    description: "HTTPS port on which the Proxmox VE REST API is served. Defaults to 8006."
    defaults: 8006

  - id: node
    type: STRING
    displayName: "Node Name"
    description: "Name of the target Proxmox cluster node to audit (e.g. pve, node1)."
    defaults: "pve"

  - id: verify_ssl
    type: BOOL
    displayName: "Verify SSL Certificate"
    description: "Set to false to accept self-signed TLS certificates typical of private on-premises Proxmox clusters."
    defaults: false

  - id: warning_memory_threshold_percent
    type: INT
    displayName: "Warning Memory Threshold (%)"
    description: "Node memory utilization percentage at or above which the sentinel classifies status as WARNING."
    defaults: 80

  - id: critical_memory_threshold_percent
    type: INT
    displayName: "Critical Memory Threshold (%)"
    description: "Node memory utilization percentage at or above which the sentinel classifies status as CRITICAL and triggers remediation."
    defaults: 90

  - id: candidate_eviction_vms
    type: ARRAY
    itemType: STRING
    displayName: "Candidate Eviction VMs"
    description: "List of non-critical VM names or integer VMIDs targeted for automated migration or power-down during critical memory saturation."
    defaults:
      - "staging-runner-01"
      - "dev-worker-02"

  - id: auto_remediate
    type: BOOL
    displayName: "Auto Remediate"
    description: "When true and dry_run is false, automatically applies remediation_action across candidate_eviction_vms during critical saturation."
    defaults: false

  - id: remediation_action
    type: SELECT
    displayName: "Remediation Action"
    description: "Mitigation applied during critical saturation: MIGRATE live-migrates candidate VMs to an alternate cluster node; STOP powers down non-critical VMs to release RAM."
    values:
      - "MIGRATE"
      - "STOP"
    defaults: "MIGRATE"

  - id: target_migration_node
    type: STRING
    displayName: "Target Migration Node"
    description: "Destination Proxmox node used when remediation_action is set to MIGRATE (e.g. pve2)."
    defaults: "pve2"

  - id: dry_run
    type: BOOL
    displayName: "Dry Run Mode"
    description: "Safety switch. Must be explicitly set to false along with auto_remediate=true for any VM migrations or stops to take place."
    defaults: true

tasks:
  - id: probe_node_metrics
    type: io.kestra.plugin.proxmox.cluster.GetNodeStatus
    description: Fetches live hypervisor node metrics including CPU ratio and used/free/total RAM in bytes.
    allowFailure: true
    host: "{{ inputs.host }}"
    port: "{{ inputs.port }}"
    node: "{{ inputs.node }}"
    username: "{{ secret('PROXMOX_USERNAME') }}"
    password: "{{ secret('PROXMOX_PASSWORD') }}"
    verifySsl: "{{ inputs.verify_ssl }}"

  - id: probe_node_vms
    type: io.kestra.plugin.proxmox.vm.List
    description: Lists all virtual machines hosted on the target node along with their runtime status and memory allocations.
    allowFailure: true
    host: "{{ inputs.host }}"
    port: "{{ inputs.port }}"
    node: "{{ inputs.node }}"
    username: "{{ secret('PROXMOX_USERNAME') }}"
    password: "{{ secret('PROXMOX_PASSWORD') }}"
    verifySsl: "{{ inputs.verify_ssl }}"

  - id: classify_node_saturation
    type: io.kestra.plugin.core.debug.Return
    description: Evaluates RAM saturation against warning and critical ceilings on a single line to guarantee exact downstream matching.
    format: "{{ outputs.probe_node_metrics is not defined or outputs.probe_node_metrics.status is not defined ? 'PROBE_FAILED' : ((((outputs.probe_node_metrics.status.memory.used * 100) / outputs.probe_node_metrics.status.memory.total) >= inputs.critical_memory_threshold_percent) ? 'CRITICAL' : ((((outputs.probe_node_metrics.status.memory.used * 100) / outputs.probe_node_metrics.status.memory.total) >= inputs.warning_memory_threshold_percent) ? 'WARNING' : 'HEALTHY')) }}"

  - id: route_by_verdict
    type: io.kestra.plugin.core.flow.Switch
    description: Dispatches log messages or Slack alerts according to the calculated hypervisor memory saturation classification.
    value: "{{ outputs.classify_node_saturation.value }}"
    cases:
      "HEALTHY":
        - id: log_healthy
          type: io.kestra.plugin.core.log.Log
          message: "Proxmox node '{{ inputs.node }}' memory usage is healthy at {{ ((outputs.probe_node_metrics.status.memory.used * 100) / outputs.probe_node_metrics.status.memory.total) | round(1) }}% ({{ (outputs.probe_node_metrics.status.memory.used / 1073741824) | round(2) }} GB / {{ (outputs.probe_node_metrics.status.memory.total / 1073741824) | round(2) }} GB). Running VMs: {{ (outputs.probe_node_vms.vms ?? []) | jq('[.[] | select(.status == \"running\")] | length') | first }}."

      "WARNING":
        - id: alert_warning_slack
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK') }}"
          payload: |
            {{
              {
                "text": "PROXMOX WARNING: Node '" ~ inputs.node ~ "' memory pressure at " ~ (((outputs.probe_node_metrics.status.memory.used * 100) / outputs.probe_node_metrics.status.memory.total) | round(1)) ~ "%, exceeding warning threshold of " ~ inputs.warning_memory_threshold_percent ~ "%. Total running VMs: " ~ ((outputs.probe_node_vms.vms ?? []) | jq('[.[] | select(.status == \"running\")] | length') | first) ~ ". Monitor workload growth to prevent hypervisor starvation."
              } | toJson
            }}

      "CRITICAL":
        - id: alert_critical_slack
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK') }}"
          payload: |
            {{
              {
                "text": "PROXMOX CRITICAL ALERT: Node '" ~ inputs.node ~ "' memory saturation at " ~ (((outputs.probe_node_metrics.status.memory.used * 100) / outputs.probe_node_metrics.status.memory.total) | round(1)) ~ "%, breaching critical threshold of " ~ inputs.critical_memory_threshold_percent ~ "%. Hypervisor OOM risk detected. Remediation status: " ~ (inputs.auto_remediate and not inputs.dry_run ? "EXECUTING (" ~ inputs.remediation_action ~ ")" : "DRY-RUN / MANUAL INTERVENTION REQUIRED") ~ "."
              } | toJson
            }}

      "PROBE_FAILED":
        - id: alert_probe_failed
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK') }}"
          payload: |
            {{
              {
                "text": "PROXMOX PROBE FAILED: Unable to query status for node '" ~ inputs.node ~ "' on host '" ~ inputs.host ~ "'. Verify Proxmox host network reachability, node name, and authentication credentials."
              } | toJson
            }}
    defaults:
      - id: log_unrecognized_verdict
        type: io.kestra.plugin.core.log.Log
        message: "Unrecognized memory saturation classification verdict: {{ outputs.classify_node_saturation.value }}"

  - id: remediate_memory_pressure
    type: io.kestra.plugin.core.flow.If
    description: Triggers automated mitigation across designated candidate VMs when auto_remediate is true and dry_run is false.
    condition: "{{ inputs.auto_remediate and not inputs.dry_run and outputs.classify_node_saturation.value == 'CRITICAL' }}"
    then:
      - id: loop_candidate_vms
        type: io.kestra.plugin.core.flow.Loop
        description: Iterates through each candidate VM using item.value and applies the configured remediation action.
        values: "{{ inputs.candidate_eviction_vms }}"
        tasks:
          - id: branch_remediation
            type: io.kestra.plugin.core.flow.Switch
            description: Directs execution to live migration or power-down based on the configured remediation action.
            value: "{{ inputs.remediation_action }}"
            cases:
              "MIGRATE":
                - id: migrate_vm
                  type: io.kestra.plugin.proxmox.vm.Migrate
                  description: Live-migrates candidate VM to the designated target node to relieve hypervisor memory pressure.
                  host: "{{ inputs.host }}"
                  port: "{{ inputs.port }}"
                  node: "{{ inputs.node }}"
                  username: "{{ secret('PROXMOX_USERNAME') }}"
                  password: "{{ secret('PROXMOX_PASSWORD') }}"
                  verifySsl: "{{ inputs.verify_ssl }}"
                  vmName: "{{ item.value }}"
                  targetNode: "{{ inputs.target_migration_node }}"
              "STOP":
                - id: stop_vm
                  type: io.kestra.plugin.proxmox.vm.Stop
                  description: Powers down non-critical candidate VM to immediately reclaim host RAM.
                  host: "{{ inputs.host }}"
                  port: "{{ inputs.port }}"
                  node: "{{ inputs.node }}"
                  username: "{{ secret('PROXMOX_USERNAME') }}"
                  password: "{{ secret('PROXMOX_PASSWORD') }}"
                  verifySsl: "{{ inputs.verify_ssl }}"
                  vmName: "{{ item.value }}"

      - id: notify_remediation_complete
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches audit notice to Slack confirming completion of automated hypervisor memory remediation.
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {{
            {
              "text": "PROXMOX REMEDIATION SUCCESS: Applied " ~ inputs.remediation_action ~ " across candidate VMs on node '" ~ inputs.node ~ "' to avert hypervisor memory starvation."
            } | toJson
          }}

  - id: log_dry_run_notice
    type: io.kestra.plugin.core.flow.If
    description: Emits warning instructions when critical memory saturation was detected but remediation was suppressed by dry_run.
    condition: "{{ inputs.dry_run and outputs.classify_node_saturation.value == 'CRITICAL' }}"
    then:
      - id: log_dry_run_details
        type: io.kestra.plugin.core.log.Log
        message: "DRY-RUN ACTIVE: Node '{{ inputs.node }}' reached CRITICAL saturation. Remediation action '{{ inputs.remediation_action }}' simulated for candidate VMs: {{ inputs.candidate_eviction_vms }}. No VMs were modified. Run with auto_remediate=true and dry_run=false to execute active remediation."

  - id: log_audit_summary
    type: io.kestra.plugin.core.log.Log
    description: Emits final immutable audit record for the hypervisor sentinel execution.
    message: "Proxmox memory saturation sentinel audit completed. Node={{ inputs.node }} Verdict={{ outputs.classify_node_saturation.value }} MemoryUsed={{ (outputs.probe_node_metrics.status.memory.used / 1073741824) | round(2) }}GB MemoryTotal={{ (outputs.probe_node_metrics.status.memory.total / 1073741824) | round(2) }}GB"

errors:
  - id: alert_execution_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Posts an urgent alert if the sentinel workflow encounters an unhandled runtime exception.
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {{
        {
          "text": "PROXMOX FLOW ERROR: Execution " ~ execution.id ~ " failed unexpectedly during node memory sentinel probe. Check execution logs."
        } | toJson
      }}

triggers:
  - id: periodic_node_memory_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: Scheduled hypervisor memory saturation check running every 15 minutes. Shipped disabled for safe onboarding.
    cron: "*/15 * * * *"
    disabled: true
    inputs:
      auto_remediate: false
      dry_run: true

extend:
  title: Proxmox Node Memory Saturation and Hypervisor Starvation Sentinel
  metaTitle: Proxmox Node Memory Saturation Sentinel | Kestra
  shortDescription: Audit Proxmox VE hypervisor node memory saturation, alert Slack on host exhaustion risk, and safely migrate or stop candidate workloads.
  metaDescription: Audit Proxmox VE node memory saturation, alert on host exhaustion risk, and safely migrate or stop runaway virtual machines. | Kestra
  description: |
    Enterprise virtualization clusters running Proxmox VE often experience sudden hypervisor
    memory exhaustion: runaway guest workloads, container memory leaks, or uncoordinated batch
    jobs surge in memory consumption simultaneously. When hypervisor host RAM reaches complete
    saturation, the Linux kernel Out-Of-Memory (OOM) killer intervenes, abruptly killing core
    hypervisor daemon processes (`pve-cluster`, `corosync`, `qemu-kvm`) and triggering split-brain
    cluster fencing or ungraceful node reboots that disrupt collocated production workloads.

    This blueprint implements an automated Day 2 Sentinel and Operational Health Gate for Proxmox VE.
    It periodically queries hypervisor node status, measures live memory utilization percentages
    against configurable operational ceilings, audits active virtual machines, alerts infrastructure
    teams on Slack, and safely executes automated mitigation (either live-migrating candidate VMs to
    a healthy cluster node or cleanly stopping non-critical staging workloads) before hypervisor
    kernel panic can occur.

    ## How it works

    1. `probe_node_metrics` (`io.kestra.plugin.proxmox.cluster.GetNodeStatus`) queries `/nodes/{node}/status` over the Proxmox REST API, capturing live CPU utilization, uptime, and exact RAM metrics (`used`, `free`, `total`). `allowFailure: true` ensures connectivity blips are caught gracefully.
    2. `probe_node_vms` (`io.kestra.plugin.proxmox.vm.List`) enumerates all QEMU virtual machines on the target node, extracting their VMIDs, names, running statuses, and memory limits.
    3. `classify_node_saturation` (`io.kestra.plugin.core.debug.Return`) evaluates host RAM utilization `(used * 100 / total)` against `warning_memory_threshold_percent` and `critical_memory_threshold_percent` on a single-line expression to ensure strict string equivalence in downstream matching. Emits `HEALTHY`, `WARNING`, `CRITICAL`, or `PROBE_FAILED`.
    4. `route_by_verdict` (`io.kestra.plugin.core.flow.Switch`) dispatches execution: healthy nodes record an all-clear log, while warning and critical states send formatted Slack notifications with exact GB consumption metrics.
    5. `remediate_memory_pressure` (`io.kestra.plugin.core.flow.If`) activates only when `auto_remediate: true`, `dry_run: false`, and status is `CRITICAL`. It iterates through `candidate_eviction_vms` using `io.kestra.plugin.core.flow.Loop` (referencing `{{ item.value }}`) and applies the chosen `remediation_action`:
       - `MIGRATE`: Executes `io.kestra.plugin.proxmox.vm.Migrate` to live-migrate candidate VMs to `target_migration_node`, immediately reducing memory pressure on the affected hypervisor without workload downtime.
       - `STOP`: Executes `io.kestra.plugin.proxmox.vm.Stop` to power down non-critical staging or development VMs, releasing host physical RAM.
    6. `log_dry_run_notice` (`io.kestra.plugin.core.flow.If`) logs non-destructive simulated actions when `dry_run: true` to prevent accidental workload disruption during testing.
    7. `log_audit_summary` (`io.kestra.plugin.core.log.Log`) writes a final immutable audit record with execution metadata.
    8. The `errors` block intercepts unexpected runtime exceptions and notifies Slack with execution links.

    ## What you get

    - Automated detection of hypervisor host memory saturation before Linux kernel OOM killer fires.
    - Zero-risk dry-run verification mode enabled by default to preview candidate eviction targets.
    - Dual remediation strategy supporting non-disruptive live migration or emergency power-down.
    - Plain-text Slack notification payloads free of unrendered shortcodes and markdown noise.
    - Complete operational audit trail recorded across Kestra execution logs and notification channels.

    ## Who it's for

    - Platform Engineers and Systems Administrators operating on-premises Proxmox VE clusters.
    - DevOps Teams managing mixed-tenancy private cloud hypervisors and CI/CD runner nodes.
    - Site Reliability Engineers preventing cascading hypervisor fencing and cluster split-brain.

    ## Why orchestrate this with Kestra

    Monitoring hypervisor capacity through standalone bash cron jobs or basic Prometheus alerts leaves
    remediation as a manual, after-the-fact firefighting exercise that frequently arrives too late.
    Kestra unifies declarative metric auditing with multi-node remediation, providing built-in credential
    masking for Proxmox API tokens, automatic retries with circuit breaking, and visual execution tracing
    across all hypervisor operations.

    ## Prerequisites

    - A running Proxmox VE cluster or standalone node (version 7.x or 8.x) with the REST API accessible.
    - Proxmox user credentials (`user@realm` such as `root@pam`) with `VM.Audit`, `VM.PowerMgmt`, `VM.Migrate`, and `Sys.Audit` permissions.
    - A secondary cluster node available with sufficient headroom when using `remediation_action: MIGRATE`.

    ### Secrets

    - `PROXMOX_USERNAME`: Proxmox VE user in `user@realm` format (e.g. `root@pam`).
    - `PROXMOX_PASSWORD`: Password for ticket-based authentication against the Proxmox REST API.
    - `SLACK_WEBHOOK`: Incoming webhook URL for routing saturation alerts and remediation notices.

    In Kestra OSS, configure secrets as base64-encoded environment variables:
    `SECRET_PROXMOX_USERNAME`, `SECRET_PROXMOX_PASSWORD`, `SECRET_SLACK_WEBHOOK`.

    ### Inputs

    | Input | Type | Default | Description |
    |---|---|---|---|
    | `host` | STRING | `pve.internal` | Hostname or IP address of the Proxmox VE hypervisor |
    | `port` | INT | `8006` | Proxmox REST API HTTPS port |
    | `node` | STRING | `pve` | Target Proxmox cluster node to audit |
    | `verify_ssl` | BOOL | `false` | Accept self-signed TLS certificates for internal clusters |
    | `warning_memory_threshold_percent` | INT | `80` | Memory percentage triggering WARNING status |
    | `critical_memory_threshold_percent` | INT | `90` | Memory percentage triggering CRITICAL status and remediation |
    | `candidate_eviction_vms` | ARRAY | `["staging-runner-01", "dev-worker-02"]` | VM names or IDs targeted for migration or shutdown |
    | `auto_remediate` | BOOL | `false` | Master toggle to enable automated eviction actions |
    | `remediation_action` | SELECT | `MIGRATE` | Remediation strategy (`MIGRATE` or `STOP`) |
    | `target_migration_node` | STRING | `pve2` | Destination node for VM live migration |
    | `dry_run` | BOOL | `true` | Safety switch suppressing mutations |

    ### Outputs

    - `{{ outputs.probe_node_metrics.status.memory.used }}`: Used node RAM in bytes.
    - `{{ outputs.probe_node_metrics.status.memory.total }}`: Total node RAM in bytes.
    - `{{ outputs.probe_node_vms.vms }}`: List of VM objects including `vmid`, `name`, `status`, and `maxmem`.
    - `{{ outputs.classify_node_saturation.value }}`: Audit classification (`HEALTHY`, `WARNING`, `CRITICAL`, or `PROBE_FAILED`).

    ## Quick start

    1. Configure `PROXMOX_USERNAME`, `PROXMOX_PASSWORD`, and `SLACK_WEBHOOK` in your Kestra namespace secrets.
    2. Import this blueprint into your Kestra instance under `company.infrastructure`.
    3. Execute the flow with default inputs (`dry_run: true`) against your target node name (e.g. `pve`) to audit current memory utilization without risk.
    4. Review execution logs and Slack messages to verify hypervisor telemetry and candidate VM detection.
    5. Set `auto_remediate: true` and `dry_run: false` to enable automated mitigation, and activate the `periodic_node_memory_audit` trigger.

    ## How to extend

    - Add an approval gate (`io.kestra.plugin.core.flow.Pause`) before migration to require operator sign-off in the Kestra UI.
    - Expand candidate detection by dynamically selecting the largest memory-consuming VM via JQ on `outputs.probe_node_vms.vms`.
    - Chain a notification task to PagerDuty or Opsgenie for high-urgency on-call escalation during critical saturation.

    ## Pitfalls

    - `vmName` in `Migrate` and `Stop` tasks accepts either VM name or integer VMID; ensure VM names are unique across the cluster if not using numeric VMIDs.
    - `remediation_action: MIGRATE` requires shared storage or cluster storage replication enabled between `node` and `target_migration_node`.
    - `auto_remediate` is gated by both `dry_run: false` and `CRITICAL` status; a `WARNING` state only dispatches Slack notifications.

    ## Links

    - [Kestra Proxmox Plugin Documentation](https://kestra.io/plugins/plugin-proxmox)
    - [Proxmox VE REST API Documentation](https://pve.proxmox.com/pve-docs/api-viewer/)
  tags:
    - Infrastructure
  subTags:
    - Infrastructure Automation
    - Day 2 Operations
    - Monitoring & Alerting
  ee: false
  demo: false
