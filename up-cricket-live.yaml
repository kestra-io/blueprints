id: up-cricket-live-scores
namespace: community.other
title: UP Cricket Live Scores Fetcher
description: Fetches live cricket scores for Uttar Pradesh districts.
tags:
    - api
    - cricket
    - http

tasks:
    - id: fetch_scores
    type: io.kestra.plugin.core.http.Request
    uri: https://api.example.com/cricket/up-live
    method: GET

    - id: log_response
    type: io.kestra.plugin.core.log.Log
    message: "{{ outputs.fetch_scores.body }}"
