id: up_cricket_live_scores
namespace: blueprint.other

tasks:
    - id: fetch_scores
    type: io.kestra.plugin.core.http.Request
    uri: https://api.cricapi.com/v1/cricScore
    method: GET

    - id: log_response
    type: io.kestra.plugin.core.log.Log
    message: "{{ outputs.fetch_scores.body }}"

extend:
  title: UP Cricket Live Scores Fetcher
  description: "Fetches live cricket scores for Uttar Pradesh leagues. Useful for real-time score tracking dashboards."
  tags:
        - API
  subTags:
        - HTTP
  doc: "https://kestra.io/plugins/core/http/request"
  icon: cricket
  version: "1"
  flowType: ETL
  demo: false
  owner: rajveer-singh-up
