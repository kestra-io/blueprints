name: Validate blueprints

# Validates every flow and dashboard blueprint against the Kestra EE image the branch is indexed for:
# main against the latest stable Kestra, releases/vX.Y.x against the latest vX.Y patch.
# On pushes it runs from main.yml, which indexes the blueprints only once this passes.
#
# Pull requests from forks get no secrets, so they are skipped. Validation renders some flow expressions
# (FILE input defaults) on a server holding the EE license, so a fork's blueprints only reach it once a
# maintainer has read them and dispatches this workflow with the pull request number, from the branch it targets.
# That run takes the workflow, server config and kestractl from that branch or pinned releases, and only sends
# the pull request's YAML files to the validate API as data: it never runs code from the pull request.
on:
  workflow_call:
  pull_request:
    branches:
      - main
      - 'releases/v*'
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Number of the pull request from a fork to validate"
        required: true
        type: string

concurrency:
  # A same-repository pull request fires both pull_request events: without the event name, the run whose job is skipped would cancel the other
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || inputs.pr_number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  KESTRACTL_VERSION: 3.6.1
  KESTRA_IMAGE_REPOSITORY: europe-west1-docker.pkg.dev/kestra-host/docker/kestra-ee

jobs:
  validate-blueprints:
    name: Validate blueprints
    # workflow_call runs on pushes from main.yml, pull_request only on same-repository pull requests
    if: >-
      github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Resolve the pull request head
        id: pr
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          if ! [[ "$PR" =~ ^[0-9]+$ ]]; then
            echo "::error::The pull request number must be an integer."
            exit 1
          fi
          read -r state base_ref head_sha < <(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json state,baseRefName,headRefOid --jq '"\(.state) \(.baseRefName) \(.headRefOid)"')
          if [[ "$state" != "OPEN" ]]; then
            echo "::error::Pull request #$PR is not open."
            exit 1
          fi
          if [[ "$base_ref" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::Pull request #$PR targets $base_ref, so run this workflow from $base_ref instead of $GITHUB_REF_NAME."
            exit 1
          fi
          echo "Validating pull request #$PR at $head_sha"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"

      - name: Checkout blueprints
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.pr.outputs.head_sha || github.sha }}
          path: blueprints
          persist-credentials: false

      - name: Resolve Kestra version
        id: version
        env:
          BRANCH: ${{ github.base_ref || github.ref_name }}
        run: |
          set -euo pipefail
          case "$BRANCH" in
            main)
              version="v$(curl -fsS --retry 3 https://api.kestra.io/v1/versions/latest | jq -er '.version')"
              ;;
            releases/v*)
              # releases/v2.0.x -> latest v2.0.<patch> release tag of Kestra
              line="${BRANCH#releases/v}"
              line="${line%.x}"
              version=$(git ls-remote --tags --refs https://github.com/kestra-io/kestra "refs/tags/v${line}.*" \
                | sed 's#.*refs/tags/##' \
                | { grep -E "^v${line//./\\.}\.[0-9]+$" || true; } \
                | sort -V | tail -1)
              ;;
            *)
              echo "::error::No Kestra version to validate against for branch $BRANCH"
              exit 1
              ;;
          esac
          if [[ -z "$version" ]]; then
            echo "::error::Could not resolve the Kestra version for branch $BRANCH"
            exit 1
          fi
          echo "Validating $BRANCH against Kestra $version"
          echo "image=${KESTRA_IMAGE_REPOSITORY}:${version}" >> "$GITHUB_OUTPUT"

      - name: GCP - Auth with github service account
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Configure docker access to GCP registry for EE image
        run: gcloud auth configure-docker europe-west1-docker.pkg.dev --quiet

      - name: Start Kestra
        id: kestra
        env:
          IMAGE: ${{ steps.version.outputs.image }}
          LICENSE: ${{ secrets.KESTRA_EE_UNIT_TEST_LICENSE_FILE }}
        run: |
          set -euo pipefail
          conf="$RUNNER_TEMP/kestra"
          mkdir -p "$conf"
          echo "$LICENSE" | base64 -d > "$conf/application-secrets.yml"
          cat > "$conf/application.yml" <<'EOF'
          kestra:
            url: "http://localhost:8080/"
            repository:
              type: h2
            queue:
              type: h2
            storage:
              type: local
              local:
                basePath: "/app/storage"
            secret:
              type: jdbc
              jdbc:
                secret: "blueprints-validation-only"
            encryption:
              secret-key: LWBErwwlb/BQcxWujsm+/scPeO01cTKzvW44GbAWvII=
            ee:
              tenants:
                enabled: true
          micronaut:
            security:
              filter:
                enabled: true
          EOF
          docker run -d --name kestra --user root -p 8080:8080 -p 8081:8081 \
            -v "$conf/application.yml:/app/confs/application.yml:ro" \
            -v "$conf/application-secrets.yml:/app/secrets/application-secrets.yml:ro" \
            -e MICRONAUT_CONFIG_FILES=/app/confs/application.yml,/app/secrets/application-secrets.yml \
            "$IMAGE" server standalone
          for _ in $(seq 1 120); do
            if curl -fs http://localhost:8081/health > /dev/null; then
              echo "Kestra is up"
              exit 0
            fi
            if [[ $(docker inspect -f '{{.State.Running}}' kestra) != "true" ]]; then
              break
            fi
            sleep 2
          done
          echo "::error::Kestra did not become healthy"
          docker logs kestra | tail -200
          exit 1

      - name: Create an API token
        id: token
        run: |
          set -euo pipefail
          user="admin@kestra.io"
          password="Blueprints!1234"
          jar="$RUNNER_TEMP/cookies"
          curl -fsS -X POST http://localhost:8080/api/v1/setup -H 'Content-Type: application/json' \
            -d "{\"username\":\"$user\",\"password\":\"$password\",\"tenant\":{\"id\":\"main\",\"name\":\"main\"}}" > /dev/null
          curl -fsS -c "$jar" -b "$jar" -X POST http://localhost:8080/login -H 'Content-Type: application/json' \
            -d "{\"username\":\"$user\",\"password\":\"$password\"}" > /dev/null
          csrf=$(curl -fsS -c "$jar" -b "$jar" http://localhost:8080/ui/ | sed -n 's/.*<meta name="csrf-token" content="\([^"]*\)".*/\1/p' | head -1)
          if [[ -z "$csrf" ]]; then
            echo "::error::No csrf-token meta tag in the Kestra UI page, the API token cannot be created"
            exit 1
          fi
          token=$(curl -fsS -c "$jar" -b "$jar" -X POST http://localhost:8080/api/v1/me/api-tokens \
            -H 'Content-Type: application/json' -H "X-CSRF-TOKEN: $csrf" \
            -d '{"name":"blueprints-validation","maxAge":"PT1H"}' | jq -er '.fullToken')
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Install kestractl
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          asset="kestractl_${KESTRACTL_VERSION}_linux_amd64"
          base="https://github.com/kestra-io/kestractl/releases/download/v${KESTRACTL_VERSION}"
          curl -fsSLO "$base/$asset"
          curl -fsSLO "$base/checksums.txt"
          grep " ${asset}\$" checksums.txt | sha256sum -c -
          install -m 0755 "$asset" /usr/local/bin/kestractl

      - name: Strip blueprint metadata
        run: |
          set -euo pipefail
          # A pull request can commit a symlink to any runner file, and this job holds secrets: only read regular files of the checkout
          root=$(realpath blueprints)
          for dir in blueprints/flows blueprints/dashboards; do
            if [[ -L "$dir" || ! -d "$dir" ]]; then
              echo "::error::$dir must be a directory of the repository"
              exit 1
            fi
          done
          find blueprints/flows blueprints/dashboards \( -name '*.yaml' -o -name '*.yml' \) -print0 > "$RUNNER_TEMP/blueprint-files"
          while IFS= read -r -d '' file; do
            if [[ -L "$file" || ! -f "$file" || "$(realpath -e "$file")" != "$root/"* ]]; then
              echo "::error::Blueprints must be regular files of the repository, $(printf '%q' "$file") is not"
              exit 1
            fi
            target="$RUNNER_TEMP/$file"
            mkdir -p "$(dirname "$target")"
            # The top-level extend block is catalog metadata that the flow and dashboard models reject as an unknown field
            awk '/^extend:/ { skip = 1; next } skip && /^[^[:space:]#]/ { skip = 0 } !skip' "$file" > "$target"
          done < "$RUNNER_TEMP/blueprint-files"

      - name: Validate flows
        working-directory: ${{ runner.temp }}
        env:
          KESTRACTL_HOST: http://localhost:8080
          KESTRACTL_TENANT: main
          KESTRACTL_TOKEN: ${{ steps.token.outputs.token }}
          KESTRACTL_VERSION_CHECK_DISABLED: "true"
          KESTRACTL_TELEMETRY_DISABLED: "true"
        run: |
          set -uo pipefail
          # File names and server messages come from the pull request: escape them before they reach a workflow command
          escape() {
            local value="${1//'%'/%25}"
            value="${value//$'\r'/%0D}"
            value="${value//$'\n'/%0A}"
            printf '%s' "$value"
          }
          # kestractl lists every flow, so only the failing ones are reported, from its JSON output
          resume=$(openssl rand -hex 16)
          echo "::stop-commands::$resume"
          status=0
          kestractl flows validate blueprints/flows --output json > "$RUNNER_TEMP/flows-validation.json" || status=$?
          echo "::$resume::"
          if ! jq -e 'type == "array"' "$RUNNER_TEMP/flows-validation.json" > /dev/null 2>&1; then
            echo "::error::kestractl returned no validation results (exit code $status)"
            exit 1
          fi
          failed=0
          while IFS= read -r -d '' file && IFS= read -r -d '' constraints; do
            failed=$((failed + 1))
            name=$(escape "${file#blueprints/}")
            name="${name//:/%3A}"
            name="${name//,/%2C}"
            echo "::error file=${name}::$(escape "$constraints")"
          done < <(jq -j '.[] | select((.constraints // []) | length > 0) | .file_path, "\u0000", (.constraints | join("; ")), "\u0000"' "$RUNNER_TEMP/flows-validation.json")
          echo "$(jq length "$RUNNER_TEMP/flows-validation.json") flow(s) validated, $failed failed"
          if [[ $failed -gt 0 || $status -ne 0 ]]; then
            exit 1
          fi

      - name: Validate dashboards
        if: ${{ !cancelled() && steps.token.outcome == 'success' }}
        working-directory: ${{ runner.temp }}
        env:
          KESTRACTL_HOST: http://localhost:8080
          KESTRACTL_TENANT: main
          KESTRACTL_TOKEN: ${{ steps.token.outputs.token }}
          KESTRACTL_VERSION_CHECK_DISABLED: "true"
          KESTRACTL_TELEMETRY_DISABLED: "true"
        run: |
          set -uo pipefail
          # File names and server messages come from the pull request: escape them before they reach a workflow command
          escape() {
            local value="${1//'%'/%25}"
            value="${value//$'\r'/%0D}"
            value="${value//$'\n'/%0A}"
            printf '%s' "$value"
          }
          find blueprints/dashboards -type f -print0 > "$RUNNER_TEMP/dashboard-files" || exit 1
          resume=$(openssl rand -hex 16)
          failed=0
          while IFS= read -r -d '' file; do
            # dashboards validate exits 0 on constraint violations, so the result is read from its JSON output
            echo "::stop-commands::$resume"
            result=$(kestractl dashboards validate --file "$file" --output json)
            status=$?
            echo "::$resume::"
            if [[ $status -ne 0 ]]; then
              failed=1
              continue
            fi
            if [[ $(jq -r '.valid' <<< "$result") != "true" ]]; then
              constraints=$(jq -r '.constraints' <<< "$result")
              name=$(escape "${file#blueprints/}")
              name="${name//:/%3A}"
              name="${name//,/%2C}"
              # Charts grouped by label need an Elasticsearch repository, which this H2-backed server can't provide
              if ! grep -v -e 'only supported with an ElasticSearch database' -e '^[[:space:]]*$' <<< "$constraints" > /dev/null; then
                echo "::warning file=${name}::$(escape "$constraints")"
                continue
              fi
              echo "::error file=${name}::$(escape "$constraints")"
              failed=1
            fi
          done < "$RUNNER_TEMP/dashboard-files"
          exit $failed

      - name: Kestra logs
        # Only a server that failed to start or to issue the token needs its logs: validation failures are reported above
        if: failure() && (steps.kestra.outcome == 'failure' || steps.token.outcome == 'failure')
        run: docker logs kestra 2>&1 | tail -300
