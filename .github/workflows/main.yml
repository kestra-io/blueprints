name: Index blueprints

on:
  push:
    branches:
      - main
      - 'releases/v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  index-blueprints:
    name: Index blueprints
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Extract version to index
        id: extract-version
        run: |
          set -euo pipefail
          REF=${GITHUB_REF#refs/}
          if [[ $REF == 'heads/main' ]]; then
            latest=$(curl -fsS https://api.kestra.io/v1/versions/latest | jq -er '.version')
            snapshot=$(curl -fsS 'https://api.kestra.io/v1/versions/latest?snapshot=true' | jq -er '.version')
            echo "version=v$latest" >> "$GITHUB_OUTPUT"
            echo "snapshot_version=v$snapshot" >> "$GITHUB_OUTPUT"
          elif [[ $REF == 'heads/releases/v'* ]]; then
            echo "version=${REF#heads/releases/}" >> "$GITHUB_OUTPUT"
          else
            echo "No indexable version for ref '$REF' (expected heads/main or heads/releases/v*)" >&2
            exit 1
          fi
      - name: Blueprints indexing webhook
        id: trigger-index
        run: |
          set -euo pipefail
          version="${{steps.extract-version.outputs.version}}"
          if [[ -z "$version" || "$version" == "null" ]]; then
            echo "Could not resolve a version to index for $GITHUB_REF" >&2
            exit 1
          fi
          curl -fsS -X POST -H "Content-Type: application/json" -d "{\"tag\": \"$version\", \"to_index\": [\"blueprints\"]}" ${{ secrets.DOC_INDEXING_WEBHOOK }}
          if [ -n "${{steps.extract-version.outputs.snapshot_version}}" ]; then
            snapshot_version=${{steps.extract-version.outputs.snapshot_version}}
            major_version=${version%%.*}
            major_version=${major_version#v}
            major_snapshot_version=${snapshot_version%%.*}
            major_snapshot_version=${major_snapshot_version#v}

            : # Here we try to detect if there is a gap between stable and snapshot release, if that's the case we're probably under an RC release and that must be covered so we launch the indexing for the RC version
            if [ $major_version -eq $major_snapshot_version ]; then
              tmp=${version#*.}
              minor_version=${tmp%%.*}
              minor_version=${minor_version#v}
              tmp=${snapshot_version#*.}
              minor_snapshot_version=${tmp%%.*}
              minor_snapshot_version=${minor_snapshot_version#v}

              rc_minor_version=$(($minor_version + 1))
              if [ $rc_minor_version -lt $minor_snapshot_version ]; then
                curl -fsS -X POST -H "Content-Type: application/json" -d "{\"tag\": \"v${major_version}.${rc_minor_version}.0-SNAPSHOT\", \"to_index\": [\"blueprints\"]}" ${{ secrets.DOC_INDEXING_WEBHOOK }}
              fi
            fi

            : # Run indexing for SNAPSHOT version
            curl -fsS -X POST -H "Content-Type: application/json" -d "{\"tag\": \"$snapshot_version\", \"to_index\": [\"blueprints\"]}" ${{ secrets.DOC_INDEXING_WEBHOOK }}
          fi