name: Validate External Blueprints

# External contributors cannot submit blueprints that are tagged Getting Started
# (installed in the tutorial namespace of every new instance) or flagged extend.ee: true.
# pull_request_target is used so the job can comment on pull requests coming from forks.
# It never checks out or runs code from the pull request, it only reads the changed YAML files through the API.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  validate-external-blueprints:
    name: Validate external blueprints
    # Skip the Kestra team (members, owners and collaborators) and bots
    if: >-
      !contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association)
      && github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Generate a bot token
        id: bot-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.GH_BOT_APP_ID }}
          private-key: ${{ secrets.GH_BOT_PRIVATE_KEY }}
          owner: kestra-io
          repositories: blueprints

      - name: Check changed blueprints
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          MARKER='<!-- external-blueprint-check -->'
          : > report.md

          mapfile -t FILES < <(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" --paginate \
            --jq '.[] | select(.status != "removed") | select(.filename | test("^flows/[^/]+\\.yaml$")) | .filename')

          for file in "${FILES[@]}"; do
            gh api -H "Accept: application/vnd.github.raw+json" "repos/${HEAD_REPO}/contents/${file}?ref=${HEAD_SHA}" > blueprint.yaml
            python3 - "$file" >> report.md <<'PY'
          import sys

          import yaml

          path = sys.argv[1]
          data = yaml.safe_load(open('blueprint.yaml')) or {}
          extend = data.get('extend') or {}
          if 'Getting Started' in (extend.get('tags') or []):
              print(f'- `{path}`: remove the `Getting Started` tag, it is reserved for the tutorial blueprints maintained by the Kestra team')
          if extend.get('ee') is True:
              print(f'- `{path}`: `extend.ee` is `true`, set it to `false` or ask a maintainer to review it')
          PY
          done

          if [ -s report.md ]; then
            {
              echo "$MARKER"
              echo "Hey @${AUTHOR} 👋 thanks a lot for the time and effort you put into this blueprint, we really appreciate it! ❤️"
              echo
              echo "Before we can merge it, a couple of small things need a tweak:"
              echo
              cat report.md
              echo
              echo "Once you push the changes the check runs again and this comment updates itself 🚀 Questions along the way? Ask us on [Slack](https://kestra.io/slack)."
              echo
              echo "Thanks again for contributing! 🍀"
            } > comment.md
            while IFS= read -r line; do echo "::error::${line#- }"; done < report.md
          else
            echo "No blocking issue in ${#FILES[@]} changed blueprint(s)"
          fi

          # Update the previous comment from this check if there is one, so a pull request never gets duplicates
          COMMENT_ID=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --paginate \
            --jq "[.[] | select(.user.type == \"Bot\" and (.body | contains(\"${MARKER}\")))] | last | .id // empty")

          if [ -s report.md ]; then
            if [ -n "$COMMENT_ID" ]; then
              gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}" -F body=@comment.md > /dev/null
            else
              gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file comment.md
            fi
            exit 1
          elif [ -n "$COMMENT_ID" ]; then
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}"
          fi
