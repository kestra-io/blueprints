name: Validate External Blueprints

# External contributors cannot submit blueprints that are tagged Getting Started
# (installed in the tutorial namespace of every new instance) or flagged extend.ee: true.
# This workflow only reads the changed YAML files and has no secrets, so it works on pull requests from forks.
# The pull request comment is posted by comment-external-blueprints.yml once this workflow completes.
on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-external-blueprints:
    name: Validate external blueprints
    # Skip the Kestra team (members, owners and collaborators) and bots
    if: >-
      !contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association)
      && github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check changed blueprints
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mkdir -p result
          : > result/issues.tsv

          mapfile -t FILES < <(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" --paginate \
            --jq '.[] | select(.status != "removed") | select(.filename | test("^flows/[^/]+\\.yaml$")) | .filename')

          for file in "${FILES[@]}"; do
            gh api -H "Accept: application/vnd.github.raw+json" "repos/${HEAD_REPO}/contents/${file}?ref=${HEAD_SHA}" > blueprint.yaml
            python3 - "$file" >> result/issues.tsv <<'PY'
          import sys

          import yaml

          path = sys.argv[1]
          data = yaml.safe_load(open('blueprint.yaml')) or {}
          extend = data.get('extend') or {}
          if 'Getting Started' in (extend.get('tags') or []):
              print(f'tag\t{path}')
          if extend.get('ee') is True:
              print(f'ee\t{path}')
          PY
          done

          # The comment workflow rebuilds the message from these kinds and file paths, so no free text is passed along
          python3 - <<'PY'
          import json
          import os

          issues = []
          for line in open('result/issues.tsv'):
              kind, path = line.rstrip('\n').split('\t')
              issues.append({'kind': kind, 'file': path})
          json.dump({'pr': int(os.environ['PR_NUMBER']), 'head_sha': os.environ['HEAD_SHA'], 'issues': issues}, open('result/result.json', 'w'))
          PY
          rm result/issues.tsv

          MESSAGES=$(python3 -c "
          import json
          texts = {'tag': 'remove the Getting Started tag, it is reserved for the tutorial blueprints maintained by the Kestra team', 'ee': 'extend.ee is true, set it to false or ask a maintainer to review it'}
          for issue in json.load(open('result/result.json'))['issues']:
              print(issue['file'] + ': ' + texts[issue['kind']])
          ")
          if [ -n "$MESSAGES" ]; then
            while IFS= read -r line; do echo "::error::${line}"; done <<< "$MESSAGES"
            echo "failed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No blocking issue in ${#FILES[@]} changed blueprint(s)"
          fi

      - name: Upload the result for the comment workflow
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: external-blueprints-result
          path: result/result.json
          retention-days: 1

      - name: Fail on blocking issues
        if: steps.check.outputs.failed == 'true'
        run: exit 1
