name: Validate External Blueprints

# Extra checks for blueprints changed by people outside the Kestra team:
# - the Getting Started tag is restricted to the tutorial blueprints
# - extend.ee has to match the plugins the flow uses
on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-external-blueprints:
    name: Validate external blueprints
    # Skip the Kestra team (members, owners and collaborators) and bots
    if: >-
      !contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association)
      && github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check changed blueprints
        run: |
          set -euo pipefail
          # The checkout is the merge commit, its first parent is the base branch
          mapfile -t FILES < <(git diff --name-only --diff-filter=AM HEAD^1 HEAD -- 'flows/*.yaml')
          python3 - "${FILES[@]}" <<'PY'
          # Exits 1 when a blocking rule is broken, warnings never fail the job
          import re
          import sys

          import yaml

          ALLOWLIST = '.github/getting-started-blueprints.txt'


          def load_allowlist():
              with open(ALLOWLIST) as f:
                  return {line.strip() for line in f if line.strip() and not line.startswith('#')}


          def main(paths):
              allowed_ids = load_allowlist()
              errors = []
              warnings = []

              for path in paths:
                  with open(path) as f:
                      raw = f.read()
                  data = yaml.safe_load(raw)
                  extend = data.get('extend') or {}
                  tags = extend.get('tags') or []
                  ee = extend.get('ee')
                  flow_id = data.get('id')

                  # Only the flow part, the extend block holds prose that may mention plugin types
                  flow_source = raw.split('\nextend:')[0]
                  plugin_types = set(re.findall(r'type:\s*(io\.kestra\.[\w.]+)', flow_source))
                  ee_types = sorted(t for t in plugin_types if t.startswith('io.kestra.plugin.ee.'))

                  if 'Getting Started' in tags:
                      if flow_id not in allowed_ids:
                          errors.append(f'{path}: the Getting Started tag is reserved for tutorial blueprints, remove it (maintainers can list the id in {ALLOWLIST})')
                      if ee is not False:
                          errors.append(f'{path}: a Getting Started blueprint is installed on every instance and must set extend.ee to false')

                  if ee_types and ee is not True:
                      errors.append(f'{path}: uses Enterprise plugins ({", ".join(ee_types[:3])}) so extend.ee must be true')

                  if ee is True and not ee_types:
                      warnings.append(f'{path}: extend.ee is true but no Enterprise plugin is used, please confirm the flow really needs an Enterprise feature')

              for message in warnings:
                  print(f'::warning::{message}')
              for message in errors:
                  print(f'::error::{message}')

              if not paths:
                  print('No changed blueprint flows to check')
              elif not errors:
                  print(f'Checked {len(paths)} blueprint(s), no blocking issue')
              return 1 if errors else 0


          if __name__ == '__main__':
              sys.exit(main(sys.argv[1:]))
          PY
