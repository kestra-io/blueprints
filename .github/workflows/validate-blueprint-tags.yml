name: Validate Blueprint Tags

on:
  push:
    branches:
      - main
    paths:
      - 'flows/*.yaml'
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-tags:
    name: Validate Blueprint Tags
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate blueprint tags
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          #!/bin/bash
          set -e

          echo "🔍 Validating blueprint tags..."
          echo "Allowed tags: Data, Infrastructure, Business, Cloud, Core, AI, Getting Started, System"
          echo

          # Only the flow files this change touches are in scope, so unrelated
          # flows (or flows gated behind a maintainer review) never block a run.
          FLOW_FILES=()
          if [ -n "$BASE_SHA" ] && git cat-file -e "$BASE_SHA" 2>/dev/null; then
            while IFS= read -r file; do
              [ -n "$file" ] && FLOW_FILES+=("$file")
            done < <(git diff --name-only --diff-filter=AM "$BASE_SHA"...HEAD -- 'flows/*.yaml')
          else
            echo "⚠️  Base commit unavailable, skipping changed-files scoping."
          fi
          echo "Files in scope: ${#FLOW_FILES[@]}"
          echo

          # Track files with issues
          INVALID_FILES=()
          OVER_LIMIT_FILES=()
          OVER_META=()
          FAILED_PARSE=()
          NO_TAGS_FILES=()
          UNEXPECTED_FILES=()

          # Process each in-scope YAML file in flows directory
          for file in "${FLOW_FILES[@]}"; do
            echo "📄 Checking: $file"

            # Extract tags section using Python for reliable YAML parsing
            RESULT=$(python3 -c "
          import yaml
          import sys
          import os

          file_path = '$file'
          try:
              with open(file_path, 'r', encoding='utf-8') as f:
                  data = yaml.safe_load(f)

              if 'extend' in data and 'tags' in data['extend']:
                  tags = data['extend']['tags']

                  # Check for invalid tags
                  allowed_tags = ['Data', 'Infrastructure', 'Business', 'Cloud', 'Core', 'AI', 'Getting Started', 'System']
                  invalid_tags = []
                  for tag in tags:
                      if tag not in allowed_tags:
                          invalid_tags.append(tag)

                  # Check for issues (report both if both exist)
                  issues = []
                  if invalid_tags:
                      issues.append(f'INVALID:{invalid_tags}')
                  if len(tags) > 3:
                      issues.append(f'OVER_LIMIT:{len(tags)}:{tags}')
                  md = data['extend'].get('metaDescription')
                  mdn = ' '.join(md.split()) if isinstance(md, str) else ''
                  if len(mdn) > 160:
                      issues.append('METADESC:' + str(len(mdn)))
                  if issues:
                      print('|'.join(issues))
                  else:
                      print('VALID')
              else:
                  print('NO_TAGS')
          except Exception as e:
              print(f'ERROR:{e}')
          ")

            # Process the result
            if [[ $RESULT == *INVALID:* ]]; then
              INVALID_FILES+=("$file")
              echo "  ❌ Invalid tags: $RESULT"
            fi
            if [[ $RESULT == *OVER_LIMIT:* ]]; then
              OVER_LIMIT_FILES+=("$file")
              echo "  ❌ Too many tags: $RESULT"
            fi

            if [[ $RESULT == *METADESC:* ]]; then
              OVER_META+=("$file")
              echo "  ❌ metaDescription over 160 chars: $RESULT"
            fi
            if [[ $RESULT == VALID ]]; then
              echo "  valid"
            elif [[ $RESULT == NO_TAGS ]]; then
              NO_TAGS_FILES+=("$file")
              echo "  FAIL missing extend/tags: $RESULT"
            elif [[ $RESULT == ERROR:* ]]; then
              FAILED_PARSE+=("$file")
              echo "  FAIL validation error: $RESULT"
            elif [[ $RESULT != *INVALID:* && $RESULT != *OVER_LIMIT:* && $RESULT != *METADESC:* ]]; then
              UNEXPECTED_FILES+=("$file")
              echo "  FAIL unexpected result: $RESULT"
            fi

          done

          echo

          # Check results
          if [ ${#INVALID_FILES[@]} -gt 0 ]; then
            echo "❌ Found files with invalid tags:"
            for file in "${INVALID_FILES[@]}"; do
              echo "  - $file"
            done
            exit 1
          fi

          if [ ${#OVER_LIMIT_FILES[@]} -gt 0 ]; then
            echo "❌ Found files with more than 3 tags:"
            for file in "${OVER_LIMIT_FILES[@]}"; do
              echo "  - $file"
            done
            exit 1
          fi

          if [ ${#OVER_META[@]} -gt 0 ]; then
            echo "❌ Found files with a metaDescription over 160 characters:"
            for file in "${OVER_META[@]}"; do
              echo "  - $file"
            done
            exit 1
          fi

          if [ ${#FAILED_PARSE[@]} -gt 0 ]; then
            echo "Found files that failed YAML parsing or validation:"
            for file in "${FAILED_PARSE[@]}"; do echo "  - $file"; done
            exit 1
          fi

          if [ ${#NO_TAGS_FILES[@]} -gt 0 ]; then
            echo "Found files missing extend/tags:"
            for file in "${NO_TAGS_FILES[@]}"; do echo "  - $file"; done
            exit 1
          fi

          if [ ${#UNEXPECTED_FILES[@]} -gt 0 ]; then
            echo "Found files with unexpected validator output:"
            for file in "${UNEXPECTED_FILES[@]}"; do echo "  - $file"; done
            exit 1
          fi

          echo "✅ All blueprint tags are valid!"
