name: Comment on External Blueprints

# Posts, updates or removes the pull request comment for the Validate External Blueprints workflow.
# It runs in the context of the base repository once that workflow completes, which is what gives it access
# to the bot secrets for pull requests from forks. It never checks out or runs code from the pull request,
# and treats the uploaded result as untrusted data: everything it needs is validated and the comment text is built here.
on:
  workflow_run:
    workflows: ["Validate External Blueprints"]
    types: [completed]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

permissions: {}

jobs:
  comment:
    name: Comment on external blueprints
    if: >-
      github.event.workflow_run.event == 'pull_request'
      && contains(fromJSON('["success", "failure"]'), github.event.workflow_run.conclusion)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
    steps:
      - name: Download the result
        id: result
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          # No artifact means the validation job was skipped for a team member or a bot, nothing to do
          if gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name external-blueprints-result --dir result; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "No result artifact for run ${RUN_ID}"
          fi

      - name: Generate a bot token
        if: steps.result.outputs.found == 'true'
        id: bot-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.GH_BOT_APP_ID }}
          private-key: ${{ secrets.GH_BOT_PRIVATE_KEY }}
          owner: kestra-io
          repositories: blueprints

      - name: Comment on the pull request
        if: steps.result.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          MARKER='<!-- external-blueprint-check -->'

          # Validate the uploaded result, anything unexpected stops the job
          PR_NUMBER=$(python3 - <<'PY'
          import json
          import re

          data = json.load(open('result/result.json'))
          pr = data['pr']
          assert isinstance(pr, int) and pr > 0
          for issue in data['issues']:
              assert issue['kind'] in ('tag', 'ee')
              assert re.fullmatch(r'flows/[A-Za-z0-9._-]+\.yaml', issue['file'])
          print(pr)
          PY
          )

          # The pull request must really be at the commit that was validated, and the author comes from the API
          PR_HEAD_SHA=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq .head.sha)
          if [ "$PR_HEAD_SHA" != "$HEAD_SHA" ]; then
            echo "Pull request ${PR_NUMBER} moved on to ${PR_HEAD_SHA}, a newer run will take care of it"
            exit 0
          fi
          AUTHOR=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq .user.login)

          python3 - "$AUTHOR" "$MARKER" <<'PY'
          import json
          import sys

          author, marker = sys.argv[1], sys.argv[2]
          texts = {
              'tag': 'remove the `Getting Started` tag, it is reserved for the tutorial blueprints maintained by the Kestra team',
              'ee': '`extend.ee` is `true`, set it to `false` or ask a maintainer to review it',
          }
          issues = json.load(open('result/result.json'))['issues']
          if issues:
              lines = [marker]
              lines.append(f'Hey @{author} 👋 thanks a lot for the time and effort you put into this blueprint, we really appreciate it! ❤️')
              lines.append('')
              lines.append('Before we can merge it, a couple of small things need a tweak:')
              lines.append('')
              lines += [f"- `{issue['file']}`: {texts[issue['kind']]}" for issue in issues]
              lines.append('')
              lines.append('Once you push the changes the check runs again and this comment updates itself 🚀 Questions along the way? Ask us on [Slack](https://kestra.io/slack).')
              lines.append('')
              lines.append('Thanks again for contributing! 🍀')
              open('comment.md', 'w').write('\n'.join(lines) + '\n')
          PY

          # Update the previous comment from this check if there is one, so a pull request never gets duplicates
          COMMENT_ID=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --paginate \
            --jq "[.[] | select(.user.type == \"Bot\" and (.body | contains(\"${MARKER}\")))] | last | .id // empty")

          if [ -f comment.md ]; then
            if [ -n "$COMMENT_ID" ]; then
              gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}" -F body=@comment.md > /dev/null
            else
              gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file comment.md
            fi
          elif [ -n "$COMMENT_ID" ]; then
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}"
          fi
