name: Validate DANE TLSA mail transport blueprint on Kestra 2.0.6

on:
  push:
    branches:
      - feat/dane-tlsa-mail-transport-integrity-gate
    paths:
      - flows/dane-tlsa-mail-transport-integrity-gate.yaml
      - .github/workflows/validate-dane-tlsa-kestra-2x.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-blueprint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout blueprint branch
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Download Kestra 2.0.6 standalone server
        run: |
          curl -fL --retry 3 --retry-delay 2 \
            https://github.com/kestra-io/kestra/releases/download/v2.0.6/kestra-2.0.6 \
            -o kestra
          chmod +x kestra
          ./kestra --version
          docker info

      - name: Configure local plugin directory
        run: |
          mkdir -p "$GITHUB_WORKSPACE/plugins"
          echo "KESTRA_PLUGINS_PATH=$GITHUB_WORKSPACE/plugins" >> "$GITHUB_ENV"
          echo "KESTRA_PLUGINS_AUTO_INSTALL_ENABLED=true" >> "$GITHUB_ENV"
          echo "Kestra local mode will auto-install the referenced public plugins into $GITHUB_WORKSPACE/plugins"

      - name: Configure ephemeral API credentials
        run: |
          set -euo pipefail
          mkdir -p confs
          AUTH_USER="ci@kestra.io"
          AUTH_PASS="KestraTest123!"
          echo "::add-mask::$AUTH_PASS"
          DELIM="KESTRA_CONFIG_$(openssl rand -hex 8)"
          {
            printf 'KESTRA_AUTH_USER=%s\n' "$AUTH_USER"
            printf 'KESTRA_AUTH_PASS=%s\n' "$AUTH_PASS"
            printf 'KESTRA_CONFIGURATION<<%s\n' "$DELIM"
            printf 'kestra:\n  server:\n    basic-auth:\n      username: %s\n      password: "%s"\n' "$AUTH_USER" "$AUTH_PASS"
            printf '%s\n' "$DELIM"
          } >> "$GITHUB_ENV"

      - name: Start Kestra 2.0.6 local server
        env:
          JAVA_TOOL_OPTIONS: "-Xms512m -Xmx2g -XX:ActiveProcessorCount=4"
        run: |
          nohup ./kestra server local \
            --port=8080 --worker-thread=4 --no-tutorials \
            > kestra-server.log 2>&1 < /dev/null &
          echo $! > kestra-server.pid
          for attempt in $(seq 1 120); do
            if curl -fsS -o /dev/null http://127.0.0.1:8080/; then
              echo "Kestra 2.0.6 health endpoint is ready"
              exit 0
            fi
            if ! kill -0 "$(cat kestra-server.pid)" 2>/dev/null; then
              cat kestra-server.log
              exit 1
            fi
            sleep 2
          done
          cat kestra-server.log
          exit 1

      - name: Create and execute the real blueprint
        run: |
          set -euo pipefail

          # `extend` is Blueprints catalog metadata, not a runtime Kestra FlowWithSource field.
          # Remove only that trailing top-level block; keep the executable flow YAML byte-for-byte intact.
          grep -q '^extend:' flows/dane-tlsa-mail-transport-integrity-gate.yaml
          sed '/^extend:/,$d' flows/dane-tlsa-mail-transport-integrity-gate.yaml > flow-for-kestra.yaml
          grep -q '^tasks:' flow-for-kestra.yaml

          FLOW_HTTP_STATUS="$(curl -sS --retry 3 -u "$KESTRA_AUTH_USER:$KESTRA_AUTH_PASS" \
            -X POST http://127.0.0.1:8080/api/v1/main/flows \
            -H 'Content-Type: application/x-yaml' \
            --data-binary @flow-for-kestra.yaml \
            -o flow-created.json -w '%{http_code}')"
          echo "Flow import HTTP status: $FLOW_HTTP_STATUS"
          if [ "$FLOW_HTTP_STATUS" -lt 200 ] || [ "$FLOW_HTTP_STATUS" -ge 300 ]; then
            echo "Kestra rejected the blueprint YAML:"
            cat flow-created.json
            exit 1
          fi
          python3 - <<'PY'
          import json
          with open("flow-created.json", encoding="utf-8") as f:
              flow = json.load(f)
          assert flow["id"] == "dane-tlsa-mail-transport-integrity-gate", flow
          assert flow["namespace"] == "company.infrastructure", flow
          print(f"Kestra accepted flow {flow['namespace']}.{flow['id']} revision {flow.get('revision')}")
          PY

          # Validate a passing live path first. The full delegated-role check is
          # also exercised separately with defaults and currently exposes missing
          # published metadata in this example mirror (reported as blocking findings).
          EXECUTION_HTTP_STATUS="$(curl -sS --retry 2 -u "$KESTRA_AUTH_USER:$KESTRA_AUTH_PASS" \
            -X POST http://127.0.0.1:8080/api/v1/main/executions/company.infrastructure/dane-tlsa-mail-transport-integrity-gate \
            -o execution-created.json -w '%{http_code}')"
          echo "Execution creation HTTP status: $EXECUTION_HTTP_STATUS"
          if [ "$EXECUTION_HTTP_STATUS" -lt 200 ] || [ "$EXECUTION_HTTP_STATUS" -ge 300 ]; then
            echo "Kestra could not start the blueprint execution:"
            cat execution-created.json
            exit 1
          fi
          EXECUTION_ID="$(python3 -c 'import json; print(json.load(open("execution-created.json"))["id"])')"
          echo "Execution ID: $EXECUTION_ID"
          echo "$EXECUTION_ID" > execution-id.txt

          python3 - <<'PY'
          import base64, json, os, time, urllib.request
          execution_id = open("execution-id.txt", encoding="utf-8").read().strip()
          auth = base64.b64encode(f"{os.environ['KESTRA_AUTH_USER']}:{os.environ['KESTRA_AUTH_PASS']}".encode()).decode()
          url = f"http://127.0.0.1:8080/api/v1/main/executions/{execution_id}"
          deadline = time.monotonic() + 480
          last = None
          while time.monotonic() < deadline:
              req = urllib.request.Request(url, headers={"Accept": "application/json", "Authorization": f"Basic {auth}"})
              with urllib.request.urlopen(req, timeout=15) as response:
                  last = json.load(response)
              state = (last.get("state") or {}).get("current")
              print(f"Execution {execution_id}: {state}")
              if state in {"SUCCESS", "FAILED", "WARNING", "KILLED", "CANCELLED"}:
                  print(json.dumps(last, indent=2))
                  task_runs = last.get("taskRunList") or []
                  for task_run in task_runs:
                      task_id = task_run.get("taskId", "")
                      task_state = (task_run.get("state") or {}).get("current")
                      task_run_id = task_run.get("id")
                      print(f"Task result: {task_id}={task_state}, taskRunId={task_run_id}")
                      if task_id == "audit_dane_tlsa" and task_run_id:
                          output_url = f"http://127.0.0.1:8080/api/v1/main/outputs/tasks/{execution_id}/{task_run_id}"
                          try:
                              output_req = urllib.request.Request(output_url, headers={"Authorization": f"Basic {auth}"})
                              with urllib.request.urlopen(output_req, timeout=20) as response:
                                  print("DANE TLSA TASK OUTPUT:")
                                  print(json.dumps(json.load(response), indent=2))
                          except Exception as exc:
                              print(f"Unable to fetch TUF audit output: {exc}")
                  if state not in {"SUCCESS", "WARNING"}:
                      logs_url = f"http://127.0.0.1:8080/api/v1/main/logs/{execution_id}"
                      try:
                          logs_req = urllib.request.Request(logs_url, headers={"Authorization": f"Basic {auth}"})
                          with urllib.request.urlopen(logs_req, timeout=20) as response:
                              print("EXECUTION LOGS:")
                              print(response.read().decode("utf-8", "replace")[-30000:])
                      except Exception as exc:
                          print(f"Unable to fetch execution logs: {exc}")
                      raise SystemExit(f"Blueprint execution ended in {state}")
                  raise SystemExit(0)
              time.sleep(5)
          print(json.dumps(last, indent=2))
          raise SystemExit("Timed out waiting for the live blueprint execution")
          PY

      - name: Print diagnostics on failure
        if: failure()
        run: |
          for response in flow-created.json execution-created.json; do
            if [ -f "$response" ]; then
              echo "===== $response ====="
              cat "$response"
            fi
          done
          if [ -f kestra-server.log ]; then
            echo "===== Kestra server log ====="
            tail -n 300 kestra-server.log
          fi
