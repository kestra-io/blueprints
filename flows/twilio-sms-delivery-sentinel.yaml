id: twilio-sms-delivery-sentinel
namespace: company.team
description: |
  Every hour, read recent outbound messages from the Twilio Messaging API
  (read-only: no message is sent or deleted) and classify SMS delivery as
  HEALTHY, WARNING, CRITICAL, LOW_VOLUME or UNREACHABLE. Log quiet runs and
  alert Slack when OTP and notification texts start failing or going
  undelivered, with the most common Twilio error code.

inputs:
  - id: lookback_days
    type: INT
    defaults: 1
    displayName: "Lookback Window (days)"
    description: "Read messages sent since this many days ago (Twilio filters by sent date)."
  - id: warning_failure_rate
    type: FLOAT
    defaults: 5.0
    displayName: "Warning Failure Rate (%)"
    description: "At or above this share of failed or undelivered messages, the check is WARNING."
  - id: critical_failure_rate
    type: FLOAT
    defaults: 15.0
    displayName: "Critical Failure Rate (%)"
    description: "At or above this share of failed or undelivered messages, the check is CRITICAL."
  - id: min_messages
    type: INT
    defaults: 50
    displayName: "Minimum Messages"
    description: "Below this many finished outbound messages, the rate is too noisy to judge and the run is LOW_VOLUME."

triggers:
  - id: hourly_check
    type: io.kestra.plugin.core.trigger.Schedule
    description: Check SMS delivery every hour. Shipped disabled; enable it once the Twilio secrets are set and a manual run has been verified.
    cron: "35 * * * *"
    disabled: true

tasks:
  - id: list_messages
    type: io.kestra.plugin.core.http.Request
    description: Read up to 1,000 messages sent since the start of the lookback window from the Twilio Messages list. This is a GET; no message is sent, redacted or deleted.
    uri: "https://api.twilio.com/2010-04-01/Accounts/{{ secret('TWILIO_ACCOUNT_SID') }}/Messages.json?PageSize=1000&DateSent%3E={{ now() | dateAdd(-inputs.lookback_days, 'DAYS') | date('yyyy-MM-dd', timeZone='UTC') }}"
    method: GET
    options:
      auth:
        type: BASIC
        username: "{{ secret('TWILIO_ACCOUNT_SID') }}"
        password: "{{ secret('TWILIO_AUTH_TOKEN') }}"
      allowFailed: true
      timeout:
        connectTimeout: PT10S
        readIdleTimeout: PT60S
    retry:
      type: constant
      interval: PT10S
      maxAttempts: 3
    allowFailure: true

  - id: summarize_delivery
    type: io.kestra.plugin.core.debug.Return
    description: Keep outbound messages that have finished (delivered, sent, undelivered, failed), compute the failed-or-undelivered share, find the most common error code, and classify in one jq query. Messages still queued or sending are ignored. A missing or non-200 response becomes UNREACHABLE.
    format: >-
      {{ (outputs.list_messages.code is not defined or outputs.list_messages.code != 200)
      ? '{"status":"UNREACHABLE","finished":0,"delivered":0,"failed":0,"rate":0,"top_error":"none","in_flight":0}'
      : (fromJson(outputs.list_messages.body) | jq('
      [(.messages // [])[] | select((.direction // "") | startswith("outbound"))] as $o
      | [$o[] | select(.status == "delivered" or .status == "sent" or .status == "undelivered" or .status == "failed")] as $f
      | [$f[] | select(.status == "undelivered" or .status == "failed")] as $bad
      | ($f | length) as $n
      | (if $n == 0 then 0 else ((($bad | length) * 1000 / $n) | floor) / 10 end) as $r
      | {finished: $n, delivered: ([$f[] | select(.status == "delivered")] | length), failed: ($bad | length), rate: $r,
      in_flight: (($o | length) - $n),
      top_error: (if ($bad | length) == 0 then "none" else ([$bad[] | ((.error_code // "unknown") | tostring)] | group_by(.) | map({e: .[0], c: length}) | max_by(.c) | ("Twilio error " + .e + " x" + (.c | tostring))) end),
      status: (if $n < ' ~ inputs.min_messages ~ ' then "LOW_VOLUME"
      elif $r >= ' ~ inputs.critical_failure_rate ~ ' then "CRITICAL"
      elif $r >= ' ~ inputs.warning_failure_rate ~ ' then "WARNING"
      else "HEALTHY" end)}
      ') | first | toJson) }}

  - id: route_by_delivery
    type: io.kestra.plugin.core.flow.Switch
    description: Route to a quiet log when delivery is healthy or volume is too low to judge, a Slack message when failures cross the warning line, or a Slack page when they cross the critical line or Twilio could not be read.
    value: "{{ fromJson(outputs.summarize_delivery.value).status }}"
    cases:
      "HEALTHY":
        - id: log_healthy
          type: io.kestra.plugin.core.log.Log
          message: "Twilio SMS delivery healthy: {{ fromJson(outputs.summarize_delivery.value).failed }} of {{ fromJson(outputs.summarize_delivery.value).finished }} outbound messages failed or undelivered ({{ fromJson(outputs.summarize_delivery.value).rate }}%)."
      "LOW_VOLUME":
        - id: log_low_volume
          type: io.kestra.plugin.core.log.Log
          message: "Twilio SMS delivery: only {{ fromJson(outputs.summarize_delivery.value).finished }} finished outbound message(s), below the minimum of {{ inputs.min_messages }}; rate not judged this run."
      "WARNING":
        - id: alert_warning_delivery
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: Post a Slack message when the failed-or-undelivered rate is at or above the warning line.
          url: "{{ secret('SLACK_WEBHOOK') }}"
          payload: |
            {
              "text": "Twilio SMS delivery WARNING: {{ fromJson(outputs.summarize_delivery.value).failed }} of {{ fromJson(outputs.summarize_delivery.value).finished }} outbound messages failed or undelivered ({{ fromJson(outputs.summarize_delivery.value).rate }}%). Most common: {{ fromJson(outputs.summarize_delivery.value).top_error }}. Execution {{ execution.id }}."
            }
      "CRITICAL":
        - id: alert_critical_delivery
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: Page Slack when the failed-or-undelivered rate is at or above the critical line, which usually means OTPs are not reaching users.
          url: "{{ secret('SLACK_WEBHOOK') }}"
          payload: |
            {
              "text": "Twilio SMS delivery CRITICAL: {{ fromJson(outputs.summarize_delivery.value).failed }} of {{ fromJson(outputs.summarize_delivery.value).finished }} outbound messages failed or undelivered ({{ fromJson(outputs.summarize_delivery.value).rate }}%). Most common: {{ fromJson(outputs.summarize_delivery.value).top_error }}. Users may not be receiving OTPs; check the sender registration and carrier filtering now. Execution {{ execution.id }}."
            }
      "UNREACHABLE":
        - id: alert_unreachable_api
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: Page Slack when the Messages API could not be read, indicating an outage or invalid credentials.
          url: "{{ secret('SLACK_WEBHOOK') }}"
          payload: |
            {
              "text": "Twilio SMS sentinel UNREACHABLE: the Messages API did not return a usable response (HTTP {{ outputs.list_messages.code ?? 'no response' }}). Check the Account SID and Auth Token. Execution {{ execution.id }}."
            }
    defaults:
      - id: log_unclassified
        type: io.kestra.plugin.core.log.Log
        message: "Twilio SMS sentinel completed with an unexpected classification: {{ outputs.summarize_delivery.value }}."

  - id: log_audit_result
    type: io.kestra.plugin.core.log.Log
    description: Record one audit line for every run, whichever branch fired, so the delivery history stays queryable even if Slack delivery fails.
    message: "Twilio SMS sentinel audit: lookback_days={{ inputs.lookback_days }} http={{ outputs.list_messages.code ?? 'n/a' }} summary={{ outputs.summarize_delivery.value }} execution={{ execution.id }}."

errors:
  - id: alert_flow_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alert Slack when the sentinel flow itself fails, so a broken check is never mistaken for healthy delivery.
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "text": "Twilio SMS sentinel flow {{ flow.id }} FAILED (execution {{ execution.id }}). SMS delivery is now unknown; check the task logs and the Twilio Console message logs."
      }

outputs:
  - id: status
    type: STRING
    value: "{{ fromJson(outputs.summarize_delivery.value).status }}"

extend:
  title: "Twilio SMS Delivery Sentinel"
  shortDescription: Read recent Twilio outbound messages every hour and alert Slack when OTP and notification texts start failing or going undelivered.
  metaTitle: Twilio SMS Delivery Sentinel for Kestra
  metaDescription: "Read recent Twilio outbound messages every hour, change nothing, and alert Slack when SMS failures cross your limits, with the top error code."
  description: |
    One-time passwords, delivery updates and appointment reminders go out as SMS, and when a carrier starts filtering a sender, a sender registration lapses, or a number runs out of balance, messages quietly come back `failed` or `undelivered`. Users simply cannot log in, and the team hears about it from support tickets. Twilio records every outcome and an error code, but nobody watches the rate. This blueprint turns a scheduled, read-only call to the Twilio Messages API into an SMS delivery gate: `io.kestra.plugin.core.http.Request` reads recent outbound messages, one jq query computes the failure rate and the most common error code, and the result routes to a quiet log or a Slack alert.

    ## How it works

    1. `list_messages` (`io.kestra.plugin.core.http.Request`) calls `GET /2010-04-01/Accounts/{AccountSid}/Messages.json` with `PageSize=1000` and a `DateSent>=` filter for the lookback window, using HTTP basic auth with the Account SID and Auth Token. It is a read: nothing is sent, redacted or deleted. Retries cover short network blips, and `allowFailed` plus `allowFailure` keep an API error from aborting the flow so it can be reported instead.
    2. `summarize_delivery` (`io.kestra.plugin.core.debug.Return`) first guards for a missing or non-200 response (`UNREACHABLE`). Otherwise one jq query keeps outbound messages (`direction` starting with `outbound`) whose `status` is final (`delivered`, `sent`, `undelivered`, `failed`), ignores ones still queued or sending, computes the share that `failed` or came back `undelivered`, and finds the most common `error_code`. Fewer than `min_messages` finished messages is `LOW_VOLUME`; at or above `critical_failure_rate` is `CRITICAL`; at or above `warning_failure_rate` is `WARNING`; otherwise `HEALTHY`.
    3. `route_by_delivery` (`io.kestra.plugin.core.flow.Switch`) branches on that classification: `HEALTHY` and `LOW_VOLUME` log quietly, `WARNING` posts a Slack note, `CRITICAL` and `UNREACHABLE` page Slack. A `defaults` fallback logs anything unexpected.
    4. `log_audit_result` (`io.kestra.plugin.core.log.Log`) writes one audit line per run with the HTTP status and the full summary.
    5. The flow-level `errors` block pages Slack if the flow itself fails, and the `hourly_check` trigger runs at 35 minutes past every hour, shipped `disabled: true`.

    ## What you get

    - An hourly, read-only SMS delivery check with no custom scripting and no extra plugin to install.
    - A `status` output (`HEALTHY` / `WARNING` / `CRITICAL` / `LOW_VOLUME` / `UNREACHABLE`) other flows can gate on, for example to switch OTPs to WhatsApp or email while SMS is failing.
    - Slack messages with the failure rate and the most common Twilio error code, which points straight at the cause (for example carrier filtering or an unregistered sender).
    - An audit line on every run, separate from Slack.

    ## Who it's for

    - Apps that send OTPs, order updates or reminders by SMS through Twilio, including Indian businesses that must keep DLT sender registration in order.
    - Support and engineering teams who want to hear about an SMS problem before users report "I didn't get the code".
    - Teams that already run their alerting in Kestra.

    ## Why orchestrate this with Kestra

    Twilio's console shows message logs and its status callbacks report one message at a time. Kestra turns a plain, read-only API call into a scheduled, typed classification with retries, a failure path and an execution history, and the `status` output lets your messaging flows fall back to another channel automatically.

    ## Prerequisites

    - A Twilio account sending SMS (a trial account works for testing) and its Account SID and Auth Token from the Console.
    - A Slack incoming webhook for the WARNING, CRITICAL, UNREACHABLE and flow-failure alerts.

    ### Secrets

    - `TWILIO_ACCOUNT_SID`: the Account SID (starts with `AC`).
    - `TWILIO_AUTH_TOKEN`: the matching Auth Token (or an API key secret, if you use an API key SID as the username instead).
    - `SLACK_WEBHOOK`: Slack incoming webhook used for every alert branch and the flow-failure alert.

    In Kestra OSS, secrets are supplied as environment variables prefixed `SECRET_` and base64-encoded, for example `SECRET_TWILIO_ACCOUNT_SID=$(echo -n 'ACxxxxxxxx' | base64)`, and read back with `{{ secret('TWILIO_ACCOUNT_SID') }}`. Use the Enterprise secrets backend for encryption at rest and access control.

    ## Quick start

    1. In a Twilio trial account, verify your own phone number and send yourself a few test SMS, plus one to an invalid number to produce a failure.
    2. Add `TWILIO_ACCOUNT_SID`, `TWILIO_AUTH_TOKEN` and `SLACK_WEBHOOK` as secrets.
    3. Run the flow manually with a low `min_messages` and compare the counts and error code in the logs with the Messaging logs in the Console.
    4. Enable `hourly_check`.

    ## How to extend

    - Follow `next_page_uri` when you send more than 1,000 messages in the window.
    - Filter by `From` to watch one sender (for example the OTP short code) with its own limits.
    - Look up the top error code in Twilio's error dictionary and include the meaning in the Slack text.
    - Store the last status in a KV store and alert only when it changes.

    ## Inputs

    - `lookback_days`: type INT, default `1`.
    - `warning_failure_rate`: type FLOAT, default `5.0` (percent).
    - `critical_failure_rate`: type FLOAT, default `15.0` (percent).
    - `min_messages`: type INT, default `50`.

    ## Outputs

    - `status`: one of `HEALTHY`, `WARNING`, `CRITICAL`, `LOW_VOLUME`, `UNREACHABLE`.
    - Example path: `{{ fromJson(outputs.summarize_delivery.value).top_error }}` for the most common error code.

    ## Links

    - [Twilio Message resource: read multiple messages](https://www.twilio.com/docs/messaging/api/message-resource)
    - [Twilio error and warning dictionary](https://www.twilio.com/docs/api/errors)
    - [Kestra HTTP Request task](https://kestra.io/plugins/core/tasks/http/io.kestra.plugin.core.http.request)
    - [Kestra Slack plugin](https://kestra.io/plugins/plugin-slack)

    ## Pitfalls

    - Only the first page (up to 1,000 messages) is read; high-volume senders need paging with `next_page_uri` or a shorter window.
    - The date filter works on whole days (UTC), so `lookback_days: 1` covers yesterday and today so far.
    - `sent` means the carrier accepted the message but no delivery receipt came back; it is counted as finished but not as a failure, because many routes never return receipts.
    - This flow only reads; it never sends, redacts or deletes a message.
  tags:
    - Business
  subTags:
    - Monitoring & Alerting
  ee: false
  demo: false
