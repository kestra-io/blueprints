id: asset-fleet-security-audit
namespace: company.team
description: |
  Audit every VM asset in the catalog for a required security agent, stamp
  each machine with a compliance status, then automatically remediate the
  non-compliant ones and reset their status.

labels:
  - key: feature
    value: assets

tasks:
  - id: get_all_servers
    type: io.kestra.plugin.core.debug.Return
    format: "{{ assets(type='io.kestra.plugin.ee.assets.VM') }}"

  - id: audit_servers
    type: io.kestra.plugin.core.flow.Loop
    values: "{{ outputs.get_all_servers.value }}"
    tasks:
      - id: get_server_info
        type: io.kestra.plugin.core.execution.SetVariables
        variables:
          server_id: "{{ fromJson(item.value).id }}"
          server_ip: "{{ fromJson(item.value).metadata.ip_address }}"
          python_version: "{{ fromJson(item.value).metadata.python_version }}"
          server_env: "{{ fromJson(item.value).metadata.env }}"
          server_os: "{{ fromJson(item.value).metadata.os }}"

      - id: check_security_agent
        type: io.kestra.plugin.scripts.shell.Script
        description: Replace this simulated check with a real SSH or agent API probe.
        script: |
          if [ "{{ vars.server_id }}" = "srv-stg-01" ]; then
            echo "CrowdStrike Agent NOT FOUND"
            exit 0
          else
            echo "CrowdStrike Agent v2.4 Active"
            exit 0
          fi

      - id: update_compliance_status
        type: io.kestra.plugin.core.debug.Return
        format: "Updating {{ vars.server_id }} compliance state"
        assets:
          inputs:
            - id: "{{ vars.server_id }}"
          outputs:
            - id: "{{ vars.server_id }}"
              type: io.kestra.plugin.ee.assets.VM
              metadata:
                compliance_status: "{{ vars.server_id == 'srv-stg-01' ? 'non-compliant' : 'compliant' }}"
                last_audit: "{{ now() }}"
                ip_address: "{{ vars.server_ip }}"
                env: "{{ vars.server_env }}"
                os: "{{ vars.server_os }}"
                python_version: "{{ vars.python_version }}"

  - id: fleet_remediation
    type: io.kestra.plugin.core.flow.Sequential
    tasks:
      - id: find_non_compliant
        type: io.kestra.plugin.core.debug.Return
        format: "{{ assets(metadata={'compliance_status': 'non-compliant'}) }}"

      - id: install_security_agent
        type: io.kestra.plugin.core.flow.Loop
        values: "{{ outputs.find_non_compliant.value }}"
        tasks:
          - id: ssh_install
            type: io.kestra.plugin.scripts.shell.Commands
            description: Replace the echo commands with a real remote agent installation.
            taskRunner:
              type: io.kestra.plugin.core.runner.Process
            commands:
              - echo "Connecting to {{ fromJson(item.value).id }} at {{ fromJson(item.value).metadata.ip_address }}..."
              - echo "Installing CrowdStrike Agent v2.4..."
              - sleep 2
            assets:
              inputs:
                - id: "{{ fromJson(item.value).id }}"
              outputs:
                - id: "{{ fromJson(item.value).id }}"
                  type: io.kestra.plugin.ee.assets.VM
                  metadata:
                    compliance_status: "compliant"
                    remediated_at: "{{ now() }}"

triggers:
  - id: daily_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 0 * * *"
    disabled: true

  - id: git_actions_webhook
    type: io.kestra.plugin.core.trigger.Webhook
    key: "{{ secret('AUDIT_WEBHOOK_KEY') }}"

extend:
  shortDescription: "Audit every VM asset for a security agent, stamp compliance status in metadata, then auto-remediate non-compliant machines."
  title: Fleet Security Audit and Auto-Remediation with Assets
  metaTitle: Fleet Security Audit and Remediation with Kestra Assets
  metaDescription: Audit all VM assets for a required security agent, record compliance status as asset metadata, then automatically reinstall the agent on non-compliant servers.
  description: |
    Security audits that end in a PDF do not fix anything. This blueprint runs a closed audit-remediate loop over your whole fleet: it enumerates every `io.kestra.plugin.ee.assets.VM` asset in the Kestra catalog, checks each machine for a required endpoint security agent, stamps `compliance_status` and `last_audit` into the asset metadata, then immediately queries for the non-compliant machines and reinstalls the agent on them, resetting their status to compliant. The asset catalog is both the target list and the compliance record.

    ## How it works
    1. `get_all_servers` (`io.kestra.plugin.core.debug.Return`) fetches every VM asset with `assets(type='io.kestra.plugin.ee.assets.VM')`.
    2. `audit_servers` (`io.kestra.plugin.core.flow.Loop`) loops over the fleet. `get_server_info` (`io.kestra.plugin.core.execution.SetVariables`) unpacks id, IP, env, OS, and Python version from each asset.
    3. `check_security_agent` (`io.kestra.plugin.scripts.shell.Script`) simulates the probe, reporting the agent missing on `srv-stg-01`. Replace it with a real SSH check or an EDR API call.
    4. `update_compliance_status` (`io.kestra.plugin.core.debug.Return`) re-registers each VM asset with `compliance_status` (via a ternary expression), `last_audit: {{ now() }}`, and the carried-over inventory metadata.
    5. `fleet_remediation` (`io.kestra.plugin.core.flow.Sequential`) closes the loop: `find_non_compliant` queries `assets(metadata={'compliance_status': 'non-compliant'})`, then `install_security_agent` iterates over the offenders and `ssh_install` (`io.kestra.plugin.scripts.shell.Commands`) reinstalls the agent, resetting `compliance_status: compliant` and stamping `remediated_at`.
    6. A daily `Schedule` trigger (disabled by default) and a webhook secured by `AUDIT_WEBHOOK_KEY` provide automation entry points.

    ## What you get
    - A full-fleet audit with per-server task runs and logs.
    - Compliance state stored as queryable asset metadata, not a report file.
    - Automatic remediation in the same execution, with `remediated_at` evidence.
    - A repeatable pattern for any check-then-fix policy across cataloged infrastructure.

    ## Who it's for
    - Security engineers enforcing endpoint agent coverage across VM fleets.
    - SRE and platform teams automating compliance instead of chasing tickets.
    - Auditors who need timestamps and execution history rather than screenshots.

    ## Why orchestrate this with Kestra
    Scanners find gaps; ticket queues let them age. Kestra collapses detection and remediation into one governed workflow: the `assets()` function supplies live fleet state, `Loop` gives per-machine isolation and retries, and asset metadata becomes an auditable compliance ledger updated transactionally with each fix. Schedules make it continuous and the execution history proves every audit and every remediation, including who or what triggered them.

    ## Prerequisites
    - A Kestra Enterprise Edition instance (Assets are an EE feature).
    - VM assets with `ip_address`, `env`, `os`, and `python_version` metadata, for example registered by the `asset-provision-servers` blueprint.
    - Real connectivity to the servers when you replace the simulated check and install.

    ### Secrets
    - `AUDIT_WEBHOOK_KEY`: shared secret guarding the `Webhook` trigger, for example called by GitHub Actions.

    ## Quick start
    1. Add the `AUDIT_WEBHOOK_KEY` secret to your Kestra instance.
    2. Run `asset-provision-servers` so VM assets exist in the catalog.
    3. Import this blueprint and execute it manually to watch the audit and remediation loop.
    4. Enable the `daily_audit` schedule to make the audit continuous.

    ## How to extend
    - Replace the simulated probe with `io.kestra.plugin.fs.ssh.Command` or your EDR vendor's API.
    - Alert a Slack channel with the non-compliant list before remediating.
    - Add a `Pause` approval before remediation in production environments.
    - Extend the audit to more checks (open ports, kernel version) and store each result as metadata.

    ## Links
    - Kestra Assets documentation: https://kestra.io/docs/enterprise/governance/assets
    - Shell script plugin docs: https://kestra.io/plugins/plugin-script-shell
  tags:
    - Infrastructure
  subTags:
    - Policy & Compliance
    - Infrastructure Automation
    - Customer Success
  ee: true
  demo: false
