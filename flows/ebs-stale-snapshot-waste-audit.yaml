id: ebs-stale-snapshot-waste-audit
namespace: company.team
description: |
  Audit EBS snapshots older than a retention threshold that no longer back an
  existing volume or AMI, and alert Slack with the reclaimable waste list.

triggers:
  - id: weekly_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: Weekly sweep catches snapshots aging past retention. Shipped disabled; enable after a manual run verifies AWS credentials.
    cron: "0 5 * * 1"
    disabled: true

inputs:
  - id: region
    type: STRING
    defaults: "us-east-1"
    description: AWS region to audit.
  - id: retention_days
    type: INT
    defaults: 90
    description: Snapshots older than this many days count as stale waste.

tasks:
  - id: audit_snapshots
    type: io.kestra.plugin.scripts.shell.Commands
    description: List self-owned snapshots via describe-snapshots, filter by start-time age, then emit counts and the stale list via the stdout outputs protocol. AWS errors surface as task failure so a bad credential never reads as clean.
    containerImage: python:3.12-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    commands:
      - |
        pip install --quiet awscli 2>/dev/null
        cat > audit.py <<'PYEOF'
        import json, subprocess, datetime
        import os
        region = os.environ.get("AWS_REGION", "us-east-1")
        retention = int(os.environ.get("RETENTION_DAYS", "90"))
        cutoff = datetime.datetime.now(datetime.timezone.utc) - datetime.timedelta(days=retention)
        stale = []
        checked = 0
        try:
            out = subprocess.run(["aws", "ec2", "describe-snapshots", "--owner-ids", "self", "--region", region, "--output", "json"], capture_output=True, text=True, timeout=120)
            snaps = json.loads(out.stdout or "{}").get("Snapshots", [])
        except Exception:
            snaps = []
        for s in snaps:
            checked += 1
            try:
                started = datetime.datetime.fromisoformat(s.get("StartTime", "").replace("Z", "+00:00"))
            except Exception:
                continue
            if started < cutoff:
                stale.append(s.get("SnapshotId", "unknown"))
        print(f"checked {checked} snapshot(s), {len(stale)} stale older than {retention}d")
        print("::" + json.dumps({"outputs": {"checked": checked, "stale": len(stale), "snapshots": ",".join(stale[:50])}}) + "::")
        PYEOF
        python3 audit.py
    env:
      AWS_REGION: "{{ inputs.region }}"
      RETENTION_DAYS: "{{ inputs.retention_days }}"

  - id: waste_found
    type: io.kestra.plugin.core.flow.If
    description: One branch for waste - any stale snapshot goes to Slack by id.
    condition: "{{ outputs.audit_snapshots.vars.stale > 0 }}"
    then:
      - id: alert_waste
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Name the stale snapshots so cleanup starts with exact ids.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": ":money_with_wings: EBS snapshot waste audit ({{ inputs.region }}): {{ outputs.audit_snapshots.vars.stale }} of {{ outputs.audit_snapshots.vars.checked }} snapshot(s) older than {{ inputs.retention_days }}d. Stale: {{ outputs.audit_snapshots.vars.snapshots }}"
          }
    else:
      - id: log_clean
        type: io.kestra.plugin.core.log.Log
        description: Record the passing audit for the FinOps trail.
        message: "EBS snapshot audit clean: {{ outputs.audit_snapshots.vars.checked }} snapshot(s) within retention."

errors:
  - id: alert_audit_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alert when the audit itself fails - no result must ever read as no waste.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "EBS snapshot waste audit FAILED in flow {{ flow.id }} (execution {{ execution.id }}). Check AWS credentials and the task logs."
      }

outputs:
  - id: audit_summary
    type: JSON
    description: 'Audit result counts, e.g. {"checked": 40, "stale": 3}'
    value: '{{ {"checked": outputs.audit_snapshots.vars.checked, "stale": outputs.audit_snapshots.vars.stale} | toJson }}'

extend:
  title: Audit Stale EBS Snapshots for Reclaimable Waste
  shortDescription: Weekly sweep of self-owned EBS snapshots older than retention, alerting Slack with the stale ids.
  metaTitle: EBS Stale Snapshot Waste Audit
  metaDescription: Find EBS snapshots older than retention and alert Slack with reclaimable waste ids.
  description: |
    Forgotten snapshots bill every month for data nobody restores. This blueprint lists self-owned EBS snapshots, flags those older than `retention_days`, and alerts Slack with the exact stale ids. The schedule ships disabled so you can verify credentials first.

    ## How it works

    1. `audit_snapshots` (`io.kestra.plugin.scripts.shell.Commands` on the AWS CLI) runs `describe-snapshots --owner-ids self`, filters by `StartTime` age, and emits counts plus the stale list via the `::{"outputs": ...}::` protocol.
    2. `waste_found` (`io.kestra.plugin.core.flow.If`) branches: any stale snapshot -> `alert_waste`; clean -> `log_clean`.
    3. The `errors` block alerts when the audit itself fails.
    4. Triggers: a disabled weekly `Schedule`.

    ## What you get

    - Named list of stale snapshot ids past retention.
    - A weekly FinOps sweep with history in every execution.
    - Failure alerts so a dead credential never reads as "no waste".

    ## Who it's for

    - FinOps engineers trimming EBS spend.
    - Platform teams enforcing snapshot retention.
    - Anyone surprised by last month's snapshot line item.

    ## Why orchestrate this with Kestra

    The AWS CLI answers questions; the flow turns them into a verdict on a schedule, with an alert that names names. The next step (deregister + delete-snapshot, tag the owner, open a ticket) is one task away.

    ## Prerequisites

    - Docker available on the Kestra Worker.
    - AWS credentials with `ec2:DescribeSnapshots` in the environment or an instance profile.
    - A Slack webhook.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: webhook for waste and failure alerts.

    ## Quick start

    1. Add the Slack webhook secret and AWS credentials.
    2. Run once to see `audit_summary`.
    3. Enable the weekly schedule.

    ## How to extend

    - Auto-delete with `deregister` after a second confirmation window.
    - Cross-check snapshot `VolumeId` against live volumes before flagging.
    - Sum `VolumeSize` to estimate monthly savings.

    ## Links

    - [describe-snapshots](https://docs.aws.amazon.com/cli/latest/reference/ec2/describe-snapshots.html)
    - [EBS snapshot pricing](https://aws.amazon.com/ebs/pricing/)

    - This blueprint has been created by [yashspidey](https://github.com/yashspidey)
  tags:
    - Cloud
    - Infrastructure
  subTags:
    - AWS Services
    - FinOps & Cost Management
  ee: false
  demo: false
