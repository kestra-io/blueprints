id: kestra-flow-security-and-governance-gate
namespace: company.governance

description: |
  Automated GitOps governance and security validation gate that audits Kestra flow definitions
  before production deployment. Scans YAML files for plaintext credentials, deprecated syntax,
  missing error handlers, unbounded retries, and schema violations, enforcing organizational policies
  and dispatching actionable remediation reports to Slack.

inputs:
  - id: seed_demo_data
    type: BOOL
    defaults: true
    description: When true, simulates candidate flows containing compliant and non-compliant samples for zero-setup local execution.

  - id: fail_on_policy_breach
    type: BOOL
    defaults: true
    description: When true, halts execution and fails the gate if high-severity violations are detected.

  - id: target_namespace
    type: STRING
    defaults: company.production
    description: Production namespace targeted for deployment verification.

tasks:
  - id: load_candidate_flows
    type: io.kestra.plugin.scripts.python.Script
    description: Prepares candidate flow definitions from repository or loads synthetic compliance test cases.
    containerImage: python:3.11-slim
    script: |
      import json
      from kestra import Kestra

      demo_mode = {{ inputs.seed_demo_data }}

      candidate_flows = []

      if demo_mode:
          compliant_flow = {
              "filename": "flows/analytics_orders_etl.yaml",
              "content": """id: analytics-orders-etl
      namespace: company.production
      description: Production compliant orders ETL pipeline.
      tasks:
        - id: extract_orders
          type: io.kestra.plugin.jdbc.postgresql.Query
          url: jdbc:postgresql://postgres:5432/orders
          username: db_user
          password: "{{ secret('POSTGRES_PASSWORD') }}"
          sql: SELECT * FROM orders;
        - id: transform_orders
          type: io.kestra.plugin.scripts.shell.Commands
          containerImage: python:3.11-slim
          commands:
            - python3 -c "print('Transforming records...')"
      errors:
        - id: notify_on_failure
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: '{"text": "ETL Failed."}'"""
          }

          vulnerable_flow = {
              "filename": "flows/unverified_sync.yaml",
              "content": """id: unverified-sync
      namespace: company.production
      description: Legacy sync flow with governance violations.
      tasks:
        - id: legacy_loop
          type: io.kestra.plugin.core.flow.ForEach
          values: ["a", "b"]
          tasks:
            - id: run_script
              type: io.kestra.plugin.scripts.shell.Commands
              runner: Docker
              commands:
                - echo "export API_TOKEN='sk_live_12345abcdef67890'"
      pluginDefaults:
        - type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          values:
            url: "https://hooks.slack.com/services/T00/B00/SECRET123" """
          }

          candidate_flows = [compliant_flow, vulnerable_flow]

      Kestra.outputs({
          "flows_count": len(candidate_flows),
          "flows_json": json.dumps(candidate_flows)
      })

  - id: scan_flow_security_and_syntax
    type: io.kestra.plugin.scripts.python.Script
    description: Executes policy rules across candidate flows checking for secret leaks, deprecated primitives, and missing error handlers.
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install --quiet pyyaml
    script: |
      import json
      import re
      import yaml
      from kestra import Kestra

      raw_flows = json.loads("""{{ outputs.load_candidate_flows.vars.flows_json }}""")

      total_scanned = len(raw_flows)
      passed_count = 0
      violations = []

      secret_pattern = re.compile(r'(?:(?:api[_-]?key|password|token|secret)\s*[:=]\s*["\'](?!\{\{\s*secret\([^\)]+\)\s*\}\})(?!\{\{\s*inputs\.)[a-zA-Z0-9_\-\.]{8,}["\']|sk_live_[a-zA-Z0-9]{10,}|ghp_[a-zA-Z0-9]{10,})', re.IGNORECASE)

      for item in raw_flows:
          fname = item.get("filename", "unknown.yaml")
          content = item.get("content", "")
          file_violations = []

          # Rule 1: Plaintext Secret Detection
          if secret_pattern.search(content):
              file_violations.append({
                  "severity": "CRITICAL",
                  "rule": "PLAINTEXT_SECRET_DETECTED",
                  "message": "Hardcoded secret detected. Credentials must use {{ secret('NAME') }}."
              })

          # Rule 2: Top-level pluginDefaults Prohibition
          if "pluginDefaults:" in content:
              file_violations.append({
                  "severity": "HIGH",
                  "rule": "PLUGIN_DEFAULTS_DEPRECATED",
                  "message": "Found top-level 'pluginDefaults'. In Kestra 2.0, inline credentials directly on tasks."
              })

          # Rule 3: Deprecated 1.x Tasks and Properties
          if "ForEach" in content:
              file_violations.append({
                  "severity": "HIGH",
                  "rule": "DEPRECATED_FOREACH_TASK",
                  "message": "Deprecated task 'ForEach' detected. Replace with 'io.kestra.plugin.core.flow.Loop'."
              })
          if re.search(r'\s+runner:\s+Docker', content):
              file_violations.append({
                  "severity": "HIGH",
                  "rule": "DEPRECATED_RUNNER_PROPERTY",
                  "message": "Deprecated 'runner: Docker' detected. Replace with 'taskRunner:'."
              })

          # Rule 4: Structural Schema and Error Handling
          try:
              data = yaml.safe_load(content)
              if not isinstance(data, dict):
                  file_violations.append({
                      "severity": "CRITICAL",
                      "rule": "INVALID_YAML_STRUCTURE",
                      "message": "Flow root is not a valid mapping."
                  })
              else:
                  if "errors" not in data:
                      file_violations.append({
                          "severity": "MEDIUM",
                          "rule": "MISSING_ERROR_HANDLER",
                          "message": "Flow lacks a top-level 'errors' block for production alert dispatch."
                      })
          except Exception as err:
              file_violations.append({
                  "severity": "CRITICAL",
                  "rule": "YAML_SYNTAX_ERROR",
                  "message": f"Syntax error: {str(err)}"
              })

          if file_violations:
              violations.append({
                  "filename": fname,
                  "findings": file_violations
              })
          else:
              passed_count += 1

      has_critical = any(
          any(f["severity"] in ("CRITICAL", "HIGH") for f in v["findings"])
          for v in violations
      )

      Kestra.outputs({
          "total_scanned": total_scanned,
          "passed_count": passed_count,
          "violations_count": len(violations),
          "has_critical_breach": has_critical,
          "violations_report": json.dumps(violations)
      })

  - id: evaluate_governance_gate
    type: io.kestra.plugin.core.flow.If
    description: Evaluates whether critical security or architectural policies were breached.
    condition: "{{ outputs.scan_flow_security_and_syntax.vars.has_critical_breach and inputs.fail_on_policy_breach }}"
    then:
      - id: alert_governance_blocker
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches high-priority governance violation card to Slack.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "🛡️ *Kestra Flow Governance Gate Blocked*\n• *Target Namespace:* `{{ inputs.target_namespace }}`\n• *Total Flows Audited:* {{ outputs.scan_flow_security_and_syntax.vars.total_scanned }}\n• *Compliant Flows:* {{ outputs.scan_flow_security_and_syntax.vars.passed_count }}\n• *Violations Found:* {{ outputs.scan_flow_security_and_syntax.vars.violations_count }}\n• *Status:* Deployment halted due to policy violations (plaintext secrets or deprecated syntax)."
          }

      - id: log_governance_remediation
        type: io.kestra.plugin.core.log.Log
        description: Emits detailed itemized violations list in workflow execution logs.
        message: "Policy violations detected during GitOps audit: {{ outputs.scan_flow_security_and_syntax.vars.violations_report }}"
    else:
      - id: notify_governance_approval
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches green compliance verification notice to platform engineering.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "✅ *Kestra Flow Governance Gate Passed*\n• *Target Namespace:* `{{ inputs.target_namespace }}`\n• *All candidate flows meet security, error-handling, and Kestra 2.0 schema standards.*"
          }

triggers:
  - id: scheduled_security_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: Scheduled weekly compliance sweep across all repository flows. Shipped disabled by default.
    cron: "0 4 * * 1"
    disabled: true

  - id: gitops_pr_webhook
    type: io.kestra.plugin.core.trigger.Webhook
    description: Authenticated webhook for event-driven PR validation in CI/CD pipelines.
    key: "{{ secret('GITOPS_WEBHOOK_KEY') }}"

errors:
  - id: alert_audit_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Catches execution errors and alerts platform on-call.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "⚠️ Governance Gate execution {{ execution.id }} failed unexpectedly on flow {{ flow.id }}."
      }

extend:
  title: Kestra Flow Security, Governance and Linting Gate
  shortDescription: Enforce organizational security policies and lint Kestra flow definitions in CI/CD to block hardcoded secrets, deprecated syntax, and missing error handlers.
  metaTitle: Kestra Flow Security and Governance Gate
  metaDescription: Automated GitOps security gate for Kestra. Audits flow definitions in CI/CD to detect hardcoded secrets, deprecated syntax, and missing error handlers.
  description: |
    As enterprise adoption of Kestra expands across dozens of squads, maintaining architectural standards
    and credential security across hundreds of declarative YAML definitions becomes a critical governance
    challenge. Without automated pre-commit gates, developers frequently introduce security vulnerabilities
    such as plaintext API tokens, rely on deprecated 1.x syntax (`ForEach`, legacy `runner:` blocks), or omit
    mandatory `errors` handlers, leading to silent production failures and compliance audit findings.

    This blueprint implements an automated GitOps governance gate that validates candidate Kestra flow definitions
    before promotion to production. It audits YAML files against four policy pillars: secret hygiene, Kestra 2.0
    primitive compliance, top-level `pluginDefaults` avoidance, and error-handling coverage, delivering an
    actionable scorecard to Slack.

    ## How it works

    1. `load_candidate_flows` (`io.kestra.plugin.scripts.python.Script`) ingests candidate YAML flows from the repository or loads synthetic test flows containing compliant and non-compliant samples when demo mode is active.
    2. `scan_flow_security_and_syntax` (`io.kestra.plugin.scripts.python.Script`) evaluates each flow definition against organizational policy rules, scanning for plaintext secret patterns, deprecated task types (`ForEach` instead of `Loop`), deprecated container properties, and missing `errors` blocks.
    3. `evaluate_governance_gate` (`io.kestra.plugin.core.flow.If`) evaluates the compliance verdict against `inputs.fail_on_policy_breach`. If high-severity violations exist, it dispatches an alert card to Slack and logs remediation guidance; otherwise, it records an approved audit stamp.

    ## What you get

    - Automated policy enforcement for Kestra flows directly integrated into GitOps CI/CD pipelines.
    - Detection of plaintext credentials to prevent secret leakage in version control.
    - Automated detection of deprecated 1.x syntax to ensure clean Kestra 2.0 compatibility.
    - Zero-setup demo execution via the `seed_demo_data` toggle with pre-packaged compliance edge cases.

    ## Who it's for

    - Platform Engineers establishing self-service Kestra orchestration standards for internal developers.
    - Security and Compliance Officers enforcing zero-trust credential hygiene and SOC 2 audit readiness.
    - Lead Data Architects managing multi-tenant Kestra deployments across enterprise business units.

    ## Why orchestrate this with Kestra

    Using Kestra to govern Kestra provides seamless native dogfooding. The same declarative engine that powers
    production data pipelines evaluates pipeline definitions, eliminating external bespoke bash linters and
    centralizing audit logs directly within the Kestra execution history.

    ## Pitfalls

    - False positive regex matches: Ensure secret scanning rules distinguish between plaintext string literals and valid Pebble secret expressions (`{{ secret('KEY') }}`).
    - Dynamic flow generation: Flows generated via external templating must be evaluated after template rendering.
    - Severity calibration: Differentiate between non-blocking recommendations (missing descriptions) and blocking policy violations (hardcoded credentials).

    ## Prerequisites

    - Target repository containing Kestra flow definitions.
    - Slack incoming webhook endpoint for governance notifications.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack incoming webhook URL for dispatching audit cards.
    - `GITOPS_WEBHOOK_KEY`: Secret authentication token for event-driven CI/CD webhook triggers.

    ## Quick start

    1. Execute the flow with `seed_demo_data: true` to observe policy evaluation against sample compliant and non-compliant flows.
    2. Configure `SLACK_WEBHOOK_URL` in your Kestra namespace.
    3. Integrate the `gitops_pr_webhook` into your GitHub Actions or GitLab CI pull request pipeline.

    ## Links

    - [Kestra Flow Best Practices Documentation](https://kestra.io/docs/developer-guide/best-practices)
    - [Kestra Secrets Management Guide](https://kestra.io/docs/developer-guide/secrets)
  tags:
    - Core
    - Infrastructure
    - Business
  subTags:
    - CI/CD & Deployment
    - Policy & Compliance
  ee: false
  demo: false
