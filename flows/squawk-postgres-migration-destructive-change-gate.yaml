id: squawk-postgres-migration-destructive-change-gate
namespace: company.data

description: |
  Lint a pending PostgreSQL migration file with Squawk, separate changes
  that risk irreversible data loss or break running application code from
  changes that only risk a locking/availability hiccup, and fail the
  execution outright on the first group so a chained CI/CD pipeline is
  actually blocked, while the second group only pages Slack for review
  since those changes are often still safe to ship with care.

inputs:
  - id: migration_file
    type: FILE
    displayName: "Migration SQL File"
    description: "The pending .sql migration file to lint before it is applied. Used when this flow is run manually or chained as a Subflow; ignored when the webhook trigger fires, which supplies the file instead."

triggers:
  - id: lint_on_pr_webhook
    type: io.kestra.plugin.core.trigger.Webhook
    description: "Lets a CI pipeline POST a pending migration file directly to this flow as part of a pull request check, instead of only running this as a manual Subflow gate. fetchType: STORE streams the POST body straight into Kestra's internal storage and exposes it as the safe trigger.uri reference, rather than as raw trigger.body text, which the Webhook trigger's own documentation warns is untrusted input unsafe to interpolate into a script task's commands."
    key: "{{ secret('MIGRATION_LINT_WEBHOOK_KEY') }}"
    fetchType: STORE
    disabled: true

tasks:
  - id: lint_migration
    type: io.kestra.plugin.scripts.shell.Commands
    description: "Runs Squawk, the open-source PostgreSQL migration linter, against the migration file inside its own container, and writes its structured JSON report to report.json regardless of Squawk's own exit code, since a non-zero exit on lint findings is expected and this flow does its own classification rather than relying on it. Reads trigger.uri when the webhook fired this execution, otherwise falls back to the migration_file input for a manual or Subflow run; both are safe internal-storage file references, never raw interpolated SQL text."
    containerImage: ghcr.io/sbdchd/squawk:latest
    commands:
      - "squawk {{ trigger.uri is defined ? trigger.uri : inputs.migration_file }} --format json > report.json || true"
    outputFiles:
      - "report.json"
    allowFailure: true

  - id: classify_migration_safety
    type: io.kestra.plugin.core.debug.Return
    description: "Classify UNREACHABLE when Squawk could not run at all, BLOCK when at least one finding is an irreversible-data-loss or breaking-change rule (every ban-drop-* rule, a column/table/object rename, a column type change, a cascading truncate, or a SQL syntax error), WARN when only locking/availability-risk rules fired (an unguarded NOT NULL addition, a non-concurrent index operation, nested transactions, missing timeout guards), otherwise PASS. Squawk reports every rule violation at level Warning regardless of how dangerous the rule is (confirmed from its own reporter.rs source: level Error is reserved for syntax errors only), so rule_name is the only reliable signal for this split, not level."
    format: "{{ outputs.lint_migration.outputFiles['report.json'] is defined ? (((read(outputs.lint_migration.outputFiles['report.json']) | jq('[.[] | select(.rule_name | test(\"^ban-drop-\") or . == \"renaming-column\" or . == \"renaming-table\" or . == \"renaming-object\" or . == \"changing-column-type\" or . == \"ban-truncate-cascade\" or . == \"syntax-error\")] | length') | first | default(0)) > 0) ? 'BLOCK' : (((read(outputs.lint_migration.outputFiles['report.json']) | jq('[.[] | select(.rule_name == \"adding-not-nullable-field\" or .rule_name == \"require-concurrent-index-creation\" or .rule_name == \"require-concurrent-index-deletion\" or .rule_name == \"ban-concurrent-index-creation-in-transaction\" or .rule_name == \"transaction-nesting\" or .rule_name == \"require-lock-timeout\" or .rule_name == \"require-statement-timeout\" or .rule_name == \"require-concurrent-reindex\" or .rule_name == \"require-concurrent-partition-detach\")] | length') | first | default(0)) > 0) ? 'WARN' : 'PASS')) : 'UNREACHABLE' }}"

  - id: route_by_migration_safety
    type: io.kestra.plugin.core.flow.Switch
    description: "PASS logs a quiet confirmation. WARN pages Slack with the locking-risk rule names but lets the execution succeed, since these changes are frequently still safe to ship. BLOCK pages Slack with the destructive rule names and then runs fail_gate to deliberately fail the execution, so a parent pipeline chaining this flow as a Subflow migration gate is actually stopped. UNREACHABLE pages Slack separately."
    value: "{{ outputs.classify_migration_safety.value }}"
    cases:
      "PASS":
        - id: log_pass
          type: io.kestra.plugin.core.log.Log
          message: "Migration file {{ inputs.migration_file }} has no destructive or locking-risk findings from Squawk."
      "WARN":
        - id: alert_warn
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "text": "Squawk gate WARN: migration has locking/availability-risk findings only (no irreversible changes): {{ read(outputs.lint_migration.outputFiles['report.json']) | jq('[.[] | select(.rule_name == "adding-not-nullable-field" or .rule_name == "require-concurrent-index-creation" or .rule_name == "require-concurrent-index-deletion" or .rule_name == "ban-concurrent-index-creation-in-transaction" or .rule_name == "transaction-nesting" or .rule_name == "require-lock-timeout" or .rule_name == "require-statement-timeout" or .rule_name == "require-concurrent-reindex" or .rule_name == "require-concurrent-partition-detach") | .rule_name] | unique | join(", ")') | first }}. Review before applying during peak traffic. Execution {{ execution.id }}."
            }
      "BLOCK":
        - id: alert_block
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "text": "Squawk gate BLOCK: migration has irreversible or breaking findings: {{ read(outputs.lint_migration.outputFiles['report.json']) | jq('[.[] | select(.rule_name | test("^ban-drop-") or . == "renaming-column" or . == "renaming-table" or . == "renaming-object" or . == "changing-column-type" or . == "ban-truncate-cascade" or . == "syntax-error") | .rule_name] | unique | join(", ")') | first }}. Execution {{ execution.id }}."
            }
        - id: fail_gate
          type: io.kestra.plugin.core.execution.Fail
          description: "Deliberately fails the execution so a parent pipeline that chains this flow as a Subflow migration gate is actually blocked, not just notified."
          errorMessage: "Migration gate blocked: {{ inputs.migration_file }} has irreversible or breaking findings ({{ read(outputs.lint_migration.outputFiles['report.json']) | jq('[.[] | select(.rule_name | test(\"^ban-drop-\") or . == \"renaming-column\" or . == \"renaming-table\" or . == \"renaming-object\" or . == \"changing-column-type\" or . == \"ban-truncate-cascade\" or . == \"syntax-error\") | .rule_name] | unique | join(\", \")') | first }}). Split the migration or get an explicit sign-off before reapplying."
      "UNREACHABLE":
        - id: alert_unreachable
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "text": "Squawk gate UNREACHABLE: lint_migration produced no report.json, Squawk's container could not run. Execution {{ execution.id }}."
            }
    defaults:
      - id: log_unclassified
        type: io.kestra.plugin.core.log.Log
        message: "Completed Squawk migration safety check with status: {{ outputs.classify_migration_safety.value }}"

  - id: log_audit_status
    type: io.kestra.plugin.core.log.Log
    description: "Post-check status line recorded whenever the execution completes without the BLOCK path failing it outright, for a continuous migration-safety trend in the execution history."
    message: "Squawk gate audit: file={{ inputs.migration_file }}, status={{ outputs.classify_migration_safety.value }}, execution={{ execution.id }}."

errors:
  - id: alert_flow_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: "Fires both when the flow itself breaks unexpectedly and, by design, whenever fail_gate deliberately fails a BLOCK execution. A chained parent pipeline sees this flow's execution as FAILED either way."
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "Squawk Postgres migration destructive-change gate flow {{ flow.id }} FAILED (execution {{ execution.id }}). If this was a BLOCK classification, that is expected; check the execution log for the specific rule names. If it was not, check lint_migration's task log for a container or Squawk problem."
      }

outputs:
  - id: status
    type: STRING
    value: "{{ outputs.classify_migration_safety.value }}"

extend:
  title: "Squawk Postgres Migration Destructive-Change Gate"
  metaTitle: Squawk Postgres Migration Destructive-Change Gate for Kestra
  shortDescription: Lint a pending PostgreSQL migration with Squawk, block on irreversible or breaking changes, and only warn on locking-risk changes that are often still safe to ship.
  metaDescription: Block PostgreSQL migrations with irreversible or breaking changes while only warning on locking-risk changes.
  description: |
    A migration gate that fails on every lint finding trains teams to bypass it, because plenty of Squawk's findings (an index created without CONCURRENTLY, a nested transaction) are locking-risk warnings a team can often still ship carefully, not reasons to block a release. This blueprint lints a pending migration with Squawk, splits its findings into "irreversible or breaks running code" and "locking or availability risk," and only fails the execution outright on the first group, so chaining this flow as a migration gate blocks exactly the changes nobody should ship unreviewed while the second group pages Slack for a human read instead of blocking indefinitely.

    ## How it works

    1. `lint_on_pr_webhook` (`io.kestra.plugin.core.trigger.Webhook`) lets a CI pipeline POST a pending migration file to this flow directly as part of a pull request check. `fetchType: STORE` streams that POST body into Kestra's internal storage and exposes it as `trigger.uri`, a safe file reference, rather than as raw `trigger.body` text, which the trigger's own documentation flags as untrusted input unsafe to interpolate into a script task's `commands`. Running this flow manually or as a `Subflow` instead uses the `migration_file` input, the same kind of safe file reference.
    2. `lint_migration` (`io.kestra.plugin.scripts.shell.Commands`) runs Squawk's own `ghcr.io/sbdchd/squawk` container against whichever of those two is defined, with `--format json`, redirecting its output to `report.json` regardless of Squawk's own exit code (a non-zero exit on findings is expected behavior, not a failure this flow should abort on).
    3. `classify_migration_safety` (`io.kestra.plugin.core.debug.Return`) checks whether `report.json` was produced; if not, `UNREACHABLE`. Otherwise it reads the file with Kestra's `read()` function and counts, by `rule_name`, how many findings are in the destructive/breaking set (every `ban-drop-*` rule, a column/table/object rename, a column type change, a cascading truncate, or a SQL syntax error) versus the locking/availability set (an unguarded `NOT NULL` addition, a non-concurrent index operation, nested transactions, missing timeout guards). This split is deliberate: Squawk's own `level` field reports every rule violation as `Warning` regardless of how dangerous the rule is, confirmed directly from Squawk's `reporter.rs` source, where `level: Error` is reserved for SQL syntax errors only, so `rule_name` is the only signal that actually distinguishes severity here, not `level`.
    4. `route_by_migration_safety` (`io.kestra.plugin.core.flow.Switch`) branches on that string: `PASS` logs a quiet confirmation, `WARN` pages Slack with the specific locking-risk rule names but lets the execution succeed, `BLOCK` pages Slack with the specific destructive rule names and then runs `fail_gate` (`io.kestra.plugin.core.execution.Fail`) to deliberately fail the execution, and `UNREACHABLE` pages Slack separately.
    5. `log_audit_status` records a status line whenever the execution reaches it, i.e. every outcome except `BLOCK`, which fails before reaching this task by design.
    6. The `errors` block fires both for a genuine flow break and, intentionally, every time `fail_gate` fires, a chained parent pipeline sees either case as the same FAILED execution and stops.

    ## What you get

    - A migration gate that distinguishes "irreversible or silently breaks a running application" from "risks a lock or a maintenance window, but is frequently still shippable," instead of a blanket finding-count threshold that trains people to ignore it.
    - A hard stop: `fail_gate` makes the execution itself FAILED on a destructive finding, so a parent flow using this as a `Subflow` task before `migrate apply`-style tasks is actually blocked, not just notified into a channel someone might not read before merging.
    - A `status` output (`PASS` / `WARN` / `BLOCK` / `UNREACHABLE`) you can also read directly if you prefer branching in the caller instead of relying on failure propagation.
    - A documented, source-verified correction of a subtle Squawk behavior (every finding reports as `level: Warning`) that would otherwise make a naive `level`-based gate useless.

    ## Who it's for

    - Platform and database teams enforcing a PostgreSQL migration review policy who want CI to fail loudly on an actual data-loss risk, not on every style nit Squawk reports.
    - Teams who have tried a naive "any finding, fail" gate and abandoned it because locking-risk warnings made it fail on changes the team deliberately decided to ship anyway.

    ## Why orchestrate this with Kestra

    Squawk produces the findings; nothing in the CLI itself enforces a policy or blocks a deploy pipeline on your terms. Kestra turns that output into an actual pass/fail decision with a real execution-history trail of exactly which rule names triggered a block versus a warning, and `Fail` gives a parent pipeline a real signal to stop on instead of a Slack message it has to notice in time.

    ## Prerequisites

    - Docker available to the Kestra worker, to run Squawk's own `ghcr.io/sbdchd/squawk` image, no database connection, server, or account is required; Squawk lints the SQL text itself.
    - A pending `.sql` migration file, either uploaded as `migration_file` for a manual or `Subflow` run, or POSTed by a CI pipeline to the `lint_on_pr_webhook` URL for an event-driven run.
    - A Slack incoming webhook URL.

    ### Secrets

    - `MIGRATION_LINT_WEBHOOK_KEY`: the key segment of the webhook URL (`.../executions/webhook/{namespace}/{flowId}/{key}`). Only needed if you enable `lint_on_pr_webhook`; a manual or `Subflow` run using `migration_file` does not need it.
    - `SLACK_WEBHOOK_URL`: Slack incoming webhook used for the WARN alert, the BLOCK alert, the unreachable alert, and the flow-failure alert.
    - OSS note: if your Kestra instance reads secrets from environment variables instead of a secrets backend, set `SECRET_MIGRATION_LINT_WEBHOOK_KEY` and `SECRET_SLACK_WEBHOOK_URL` as base64, for example `echo -n "<your-value>" | base64`.

    ## Quick start

    1. Add the `SLACK_WEBHOOK_URL` secret, and the `MIGRATION_LINT_WEBHOOK_KEY` secret if you plan to enable the webhook.
    2. Write a test migration containing both a `DROP COLUMN` and an `ADD COLUMN ... NOT NULL` without a default, to exercise the `BLOCK` and `WARN` outcomes in one file (or split them into two runs).
    3. Upload that file as `migration_file`, run the flow manually, and confirm `status` matches what you expect.
    4. Either enable `lint_on_pr_webhook` and have your CI pipeline `curl --data-binary @migration.sql` the webhook URL on each pull request, or wire a `Subflow` task pointing at this flow into your deployment pipeline immediately before the task that applies migrations.

    ## How to extend

    - Add a `pg_version` input and pass it through as Squawk's `--pg-version` flag once you have confirmed the exact flag syntax against the version you run, to make version-specific rules (e.g. identity columns) accurate for your cluster.
    - Store each BLOCK's rule names in a KV store keyed by migration filename, to build a team-wide record of what got stopped and why.
    - Add a second Slack channel specifically for the WARN case, separate from BLOCK, so on-call is not paged for changes that do not need an on-call response.

    ## Links

    - [Squawk documentation](https://squawkhq.com/docs/)
    - [Squawk rule reference](https://squawkhq.com/docs/rules)
    - [Kestra Fail task](https://kestra.io/plugins/core/tasks/execution/io.kestra.plugin.core.execution.fail)
  tags:
    - Data
  subTags:
    - Testing & Quality
    - Day 2 Operations
  ee: false
  demo: false
