id: usaspending-federal-award-competitor-tracker
namespace: company.team

description: |
  Weekly competitor award tracker on USAspending.gov: searches federal contracts for a watchlist of
  competitors, NAICS codes and agencies, keeps only true name or parent matches, diffs every award
  against a persistent DuckDB file (new awards, obligation increases, late-published DoD awards) and
  sends a Slack digest plus CSVs. No API key needed.

inputs:
  - id: competitors
    type: ARRAY
    itemType: STRING
    defaults:
      - Leidos
      - Booz Allen Hamilton
      - CACI
      - Science Applications International
    description: Competitor names or 12-character UEIs, sent as `recipient_search_text`. USAspending matches substrings and parent names, so the flow keeps an award only when a term matches the recipient name as whole words, the recipient UEI, or the name of the recipient's parent. Spell out names that are acronyms of something else ("SAIC" matches MOSAIC and PASSAIC but not Science Applications International Corporation).

  - id: naics_codes
    type: ARRAY
    itemType: STRING
    defaults:
      - "541512"
      - "541511"
      - "541519"
      - "541330"
    description: NAICS codes (2 to 6 digits, shorter codes match the whole branch). Empty list for every NAICS.

  - id: agencies
    type: ARRAY
    itemType: STRING
    defaults:
      - Department of Defense
      - Department of Homeland Security
      - Department of Veterans Affairs
    description: Awarding top-tier agencies by name or abbreviation (`DOD`, `DHS`, `VA`). Checked against `/api/v2/references/toptier_agencies/` because USAspending silently returns zero results for a misspelled agency. Empty list for every agency.

  - id: lookback_days
    type: INT
    defaults: 120
    description: Window of the first (baseline) run, in days of action date.

  - id: overlap_days
    type: INT
    defaults: 100
    description: Days re-read before the last run on later runs. The Department of Defense publishes contract actions on USAspending 90 days after the action date, so a short window never sees DoD awards; the award-level diff keeps the overlap from reporting anything twice.

  - id: new_award_max_age_days
    type: INT
    defaults: 120
    description: An award not seen before counts as NEW when its base obligation date is at most this many days old. Older unseen awards are NEWLY_TRACKED (an existing award that was modified, or a competitor just added to the list) and do not alert.

  - id: match_parents
    type: BOOL
    defaults: true
    description: Keep awards of subsidiaries whose recipient profile lists a watchlist company among its parents (Dynetics and Gibbs & Cox under Leidos, Engility under SAIC). USAspending keeps old parents in that list, so a unit sold years ago can still be credited to its former owner; the CSV names the parent that matched.

  - id: min_alert_amount
    type: FLOAT
    defaults: 250000
    description: Smallest new award or obligation increase, in US dollars, that goes into the Slack digest. Smaller changes are still in the CSV and the DuckDB file.

  - id: max_pages
    type: INT
    defaults: 40
    description: Safety ceiling on pages of 100 awards. The summary flags `truncated` when USAspending still reported `hasNext` at the ceiling.

  - id: since
    type: DATE
    required: false
    description: Optional window start for a backfill. Overrides the stored state for this run.

  - id: state_key
    type: STRING
    defaults: usaspending_competitors
    description: Prefix of the KV keys holding the DuckDB file pointer and the last checked date. Use one prefix per watchlist.

triggers:
  - id: weekly
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 6 * * 1"
    timezone: America/New_York
    description: Monday 06:00 Eastern, after USAspending's nightly loads of the previous week.

tasks:
  - id: state_db
    type: io.kestra.plugin.core.kv.Get
    key: "{{ inputs.state_key }}_db"
    errorOnMissing: false
    description: Internal-storage URI of the DuckDB file with every award seen so far. Missing on the first run.

  - id: previous_window
    type: io.kestra.plugin.core.kv.Get
    key: "{{ inputs.state_key }}_window"
    errorOnMissing: false
    description: JSON with `checked_through` (end of the last window) and `covered_from` (earliest action date ever read).

  - id: agency_reference
    type: io.kestra.plugin.core.http.Download
    description: Top-tier agency names and abbreviations, used to validate the `agencies` input.
    uri: https://api.usaspending.gov/api/v2/references/toptier_agencies/
    headers:
      User-Agent: kestra-usaspending-competitor-tracker/1.0 (https://kestra.io)
    options:
      retryOnStatusCodes: [429, 500, 502, 503, 504]
      retry:
        type: exponential
        interval: PT5S
        maxInterval: PT1M
        maxAttempts: 4

  - id: plan
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: |
      Validates the watchlist (NAICS must be 2 to 6 digits, agencies must exist, closest name suggested
      otherwise), computes the window and builds the `filters` object. `time_period` has two entries,
      action date and last modified date over the same range, which USAspending ORs together: the first
      catches new actions, the second catches awards corrected or published late.
    url: "jdbc:duckdb:"
    fetchType: FETCH_ONE
    inputFiles:
      agencies.json: "{{ outputs.agency_reference.uri }}"
    parameters:
      competitors: "{{ inputs.competitors | toJson }}"
      naics: "{{ inputs.naics_codes | toJson }}"
      agencies: "{{ inputs.agencies | toJson }}"
      since: "{{ inputs.since ?? '' }}"
      previous_window: "{{ (outputs.previous_window.value ?? {}) | toJson }}"
      has_db: "{{ outputs.state_db.value is defined and outputs.state_db.value is not empty }}"
      lookback_days: "{{ inputs.lookback_days }}"
      overlap_days: "{{ inputs.overlap_days }}"
    sql: |
      SET TimeZone = 'UTC';
      CREATE TABLE ref AS
      SELECT a->>'agency_name' AS name, a->>'abbreviation' AS abbr
      FROM (SELECT unnest(from_json(json_extract(content, '$.results'), '["JSON"]')) AS a FROM read_text('agencies.json'));

      CREATE TABLE terms AS
      SELECT ord, trim(term) AS term FROM (
        SELECT unnest(range(1, len(l) + 1)) AS ord, unnest(l) AS term FROM (SELECT from_json(:competitors, '["VARCHAR"]') AS l))
      WHERE trim(term) <> '';

      CREATE TABLE naics AS SELECT DISTINCT trim(x) AS code FROM unnest(from_json(:naics, '["VARCHAR"]')) AS t(x) WHERE trim(x) <> '';

      CREATE TABLE agencies AS
      SELECT trim(x) AS raw,
             (SELECT min(name) FROM ref WHERE lower(name) = lower(trim(x)) OR upper(abbr) = upper(trim(x))) AS name,
             (SELECT arg_max(name, jaro_winkler_similarity(lower(name), lower(trim(x)))) FROM ref) AS closest
      FROM unnest(from_json(:agencies, '["VARCHAR"]')) AS t(x) WHERE trim(x) <> '';

      CREATE TABLE checks AS SELECT
        CASE WHEN (SELECT count(*) FROM naics WHERE NOT regexp_full_match(code, '[0-9]{2,6}')) > 0
             THEN error('Invalid NAICS code(s) ' || (SELECT string_agg(code, ', ') FROM naics WHERE NOT regexp_full_match(code, '[0-9]{2,6}')) || '. Use 2 to 6 digits.') END AS naics_ok,
        CASE WHEN (SELECT count(*) FROM agencies WHERE name IS NULL) > 0
             THEN error('Unknown awarding agency ' || (SELECT string_agg('"' || raw || '" (closest match "' || closest || '")', ', ') FROM agencies WHERE name IS NULL)) END AS agency_ok,
        CASE WHEN (SELECT count(*) FROM terms) + (SELECT count(*) FROM naics) + (SELECT count(*) FROM agencies) = 0
             THEN error('Give at least one competitor, NAICS code or agency; an unfiltered search returns every federal contract.') END AS scope_ok;

      -- Later runs re-read overlap_days before the last window end, but never before the range already covered:
      -- awards signed before it were never in scope, so they must not come back as NEW or "published late".
      CREATE TABLE prev AS
      SELECT CASE WHEN CAST(:has_db AS BOOLEAN) THEN TRY_CAST(json_extract_string(:previous_window, '$.checked_through') AS DATE) END AS checked_through,
             CASE WHEN CAST(:has_db AS BOOLEAN) THEN TRY_CAST(json_extract_string(:previous_window, '$.covered_from') AS DATE) END AS covered_from;

      CREATE TABLE win AS
      SELECT greatest(DATE '2007-10-01',
               CASE WHEN :since <> '' THEN CAST(:since AS DATE)
                    WHEN p.checked_through IS NOT NULL
                      THEN greatest(p.checked_through - CAST(:overlap_days AS INTEGER), coalesce(p.covered_from, DATE '2007-10-01'))
                    ELSE current_date - CAST(:lookback_days AS INTEGER) END) AS d_from,
             current_date AS d_to
      FROM prev p;

      CREATE TABLE f AS
      SELECT json_object(
               'time_period', json_array(
                 json_object('start_date', strftime(d_from, '%Y-%m-%d'), 'end_date', strftime(d_to, '%Y-%m-%d'), 'date_type', 'action_date'),
                 json_object('start_date', strftime(d_from, '%Y-%m-%d'), 'end_date', strftime(d_to, '%Y-%m-%d'), 'date_type', 'last_modified_date')),
               'award_type_codes', json_array('A', 'B', 'C', 'D')) AS base
      FROM win;

      SELECT
        strftime((SELECT d_from FROM win), '%Y-%m-%d') AS window_from,
        strftime((SELECT d_to FROM win), '%Y-%m-%d') AS window_to,
        NOT CAST(:has_db AS BOOLEAN) AS is_baseline,
        coalesce(strftime((SELECT checked_through FROM prev), '%Y-%m-%d'), '') AS previous_checked_through,
        coalesce(strftime((SELECT covered_from FROM prev), '%Y-%m-%d'), '') AS previous_covered_from,
        strftime(least((SELECT d_from FROM win), coalesce((SELECT covered_from FROM prev), (SELECT d_from FROM win))), '%Y-%m-%d') AS covered_from,
        (SELECT count(*) FROM terms) AS competitor_terms,
        coalesce((SELECT string_agg(name, ', ') FROM agencies), 'all agencies') AS agency_names,
        coalesce((SELECT string_agg(code, ', ') FROM naics), 'all NAICS') AS naics_list,
        CAST(json_merge_patch(json_merge_patch(json_merge_patch((SELECT base FROM f),
          CASE WHEN (SELECT count(*) FROM terms) > 0 THEN json_object('recipient_search_text', (SELECT to_json(list(term ORDER BY ord)) FROM terms)) ELSE '{}' END),
          CASE WHEN (SELECT count(*) FROM naics) > 0 THEN json_object('naics_codes', (SELECT to_json(list(code ORDER BY code)) FROM naics)) ELSE '{}' END),
          CASE WHEN (SELECT count(*) FROM agencies) > 0 THEN json_object('agencies', (SELECT to_json(list(json_object('type', 'awarding', 'tier', 'toptier', 'name', name))) FROM agencies)) ELSE '{}' END) AS VARCHAR) AS filters,
        (SELECT CAST(to_json(list(json_object('ord', ord, 'term', term))) AS VARCHAR) FROM terms) AS terms_json;

  - id: bootstrap
    type: io.kestra.plugin.core.flow.If
    description: First run only. Creates the DuckDB file with its three tables so every later task has one code path.
    condition: "{{ outputs.plan.outputs[0].row.is_baseline }}"
    then:
      - id: create_db
        type: io.kestra.plugin.jdbc.duckdb.Queries
        url: "jdbc:duckdb:"
        outputDbFile: true
        fetchType: NONE
        sql: |
          CREATE TABLE awards (
            award_key VARCHAR PRIMARY KEY, award_id VARCHAR, competitor VARCHAR, match_basis VARCHAR,
            recipient_name VARCHAR, recipient_uei VARCHAR, recipient_id VARCHAR,
            awarding_agency VARCHAR, awarding_sub_agency VARCHAR, naics_code VARCHAR, naics_description VARCHAR,
            psc_code VARCHAR, award_type VARCHAR, description VARCHAR, base_obligation_date DATE,
            start_date DATE, end_date DATE, award_amount DOUBLE, last_modified TIMESTAMP,
            first_seen_at TIMESTAMP, last_seen_at TIMESTAMP);
          CREATE TABLE award_events (
            execution_id VARCHAR, detected_at TIMESTAMP, award_key VARCHAR, event_type VARCHAR,
            previous_amount DOUBLE, award_amount DOUBLE, obligation_change DOUBLE, last_modified TIMESTAMP, late_reported BOOLEAN);
          CREATE TABLE recipient_profiles (
            recipient_id VARCHAR PRIMARY KEY, name VARCHAR, parent_name VARCHAR, parent_uei VARCHAR, parents_json VARCHAR, fetched_at TIMESTAMP);

  - id: fetch_pages
    type: io.kestra.plugin.core.flow.Loop
    description: |
      `page` pagination of `spending_by_award`, 100 awards per page, one page at a time. The loop stops at the
      first page whose `page_metadata.hasNext` is false; `max_pages` only sets the ceiling.
    values: "{{ range(1, inputs.max_pages + 1) }}"
    concurrencyLimit: 1
    breakWhen: "{{ iteration.outputs.done }}"
    tasks:
      - id: page
        type: io.kestra.plugin.core.http.Download
        description: 400 and 422 (invalid filter) fail the run with USAspending's message; 429 and 5xx are retried.
        uri: https://api.usaspending.gov/api/v2/search/spending_by_award/
        method: POST
        contentType: application/json
        headers:
          User-Agent: kestra-usaspending-competitor-tracker/1.0 (https://kestra.io)
        body: |
          {
            "filters": {{ outputs.plan.outputs[0].row.filters }},
            "fields": ["Award ID", "generated_internal_id", "Recipient Name", "Recipient UEI", "recipient_id",
                       "Award Amount", "Description", "Contract Award Type", "Awarding Agency", "Awarding Sub Agency",
                       "NAICS", "PSC", "Base Obligation Date", "Start Date", "End Date", "Last Modified Date"],
            "page": {{ item.value }},
            "limit": 100,
            "sort": "Award ID",
            "order": "asc"
          }
        options:
          timeout:
            connectTimeout: PT10S
            readIdleTimeout: PT2M
          retryOnStatusCodes: [429, 500, 502, 503, 504]
          retry:
            type: exponential
            interval: PT10S
            maxInterval: PT2M
            maxAttempts: 4

      - id: has_next
        type: io.kestra.plugin.core.debug.Return
        format: "{{ fromJson(read(outputs.page.uri)).page_metadata.hasNext }}"
    outputs:
      - id: uri
        type: STRING
        value: "{{ outputs.page.uri }}"
      - id: done
        type: BOOL
        value: "{{ outputs.has_next.value != 'true' }}"

  - id: collect_pages
    type: io.kestra.plugin.core.storage.Concat
    files: "{{ outputs.fetch_pages.outputs | jq('[.[].outputs.uri]') | first }}"
    separator: "\n"
    extension: .json

  - id: stage
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: |
      Opens the persistent DuckDB file, parses every page into `staged` (deduplicated on
      `generated_internal_id`, because the PIID in `Award ID` repeats across agencies), matches recipient
      names against the watchlist as whole words and lists the recipients that matched only through
      USAspending's substring or parent search and have no cached profile yet.
    databaseUri: "{{ outputs.state_db.value ?? outputs.create_db.databaseUri }}"
    outputDbFile: true
    fetchType: FETCH_ONE
    inputFiles:
      pages.json: "{{ outputs.collect_pages.uri }}"
    parameters:
      terms: "{{ outputs.plan.outputs[0].row.terms_json ?? '[]' }}"
    sql: |
      SET TimeZone = 'UTC';
      CREATE OR REPLACE TEMP MACRO norm(s) AS ' ' || trim(regexp_replace(lower(coalesce(s, '')), '[^a-z0-9]+', ' ', 'g')) || ' ';
      CREATE TEMP TABLE terms AS SELECT CAST(t->>'ord' AS INTEGER) AS ord, t->>'term' AS term FROM (SELECT unnest(from_json(:terms, '["JSON"]')) AS t);
      CREATE TEMP TABLE docs AS SELECT json AS doc FROM read_json_objects('pages.json', format = 'unstructured');

      CREATE OR REPLACE TABLE staged AS
      SELECT DISTINCT ON (award_key) * FROM (
        SELECT r->>'generated_internal_id' AS award_key,
               r->>'Award ID' AS award_id,
               r->>'Recipient Name' AS recipient_name,
               r->>'Recipient UEI' AS recipient_uei,
               r->>'recipient_id' AS recipient_id,
               coalesce(TRY_CAST(r->>'Award Amount' AS DOUBLE), 0) AS award_amount,
               r->>'Description' AS description,
               r->>'Contract Award Type' AS award_type,
               r->>'Awarding Agency' AS awarding_agency,
               r->>'Awarding Sub Agency' AS awarding_sub_agency,
               r->'NAICS'->>'code' AS naics_code,
               r->'NAICS'->>'description' AS naics_description,
               r->'PSC'->>'code' AS psc_code,
               TRY_CAST(r->>'Base Obligation Date' AS DATE) AS base_obligation_date,
               TRY_CAST(r->>'Start Date' AS DATE) AS start_date,
               TRY_CAST(r->>'End Date' AS DATE) AS end_date,
               TRY_CAST(r->>'Last Modified Date' AS TIMESTAMP) AS last_modified
        FROM docs, unnest(from_json(json_extract(doc, '$.results'), '["JSON"]')) AS t(r))
      WHERE award_key IS NOT NULL
      ORDER BY award_key, last_modified DESC;

      CREATE OR REPLACE TABLE staged_name_match AS
      SELECT s.award_key,
             (SELECT arg_min(t.term, t.ord) FROM terms t
               WHERE contains(norm(s.recipient_name), norm(t.term)) OR upper(t.term) = upper(coalesce(s.recipient_uei, ''))) AS name_term
      FROM staged s;

      SELECT
        (SELECT count(*) FROM docs) AS pages,
        (SELECT count(*) FROM staged) AS awards_fetched,
        (SELECT coalesce(bool_and(CAST(json_extract(doc, '$.page_metadata.hasNext') AS BOOLEAN)), false) FROM docs) AS truncated,
        (SELECT count(*) FROM terms) > 0 AND count(*) > 0 AS needs_lookup,
        count(*) AS lookups,
        CAST(to_json(coalesce(list(recipient_id ORDER BY recipient_id), [])) AS VARCHAR) AS lookup_ids
      FROM (SELECT DISTINCT s.recipient_id FROM staged s JOIN staged_name_match m USING (award_key)
            WHERE m.name_term IS NULL AND s.recipient_id IS NOT NULL
              AND s.recipient_id NOT IN (SELECT recipient_id FROM recipient_profiles));

  - id: resolve_parents
    type: io.kestra.plugin.core.flow.If
    description: Runs only when some recipients matched the search without matching a watchlist term by name and are not in the profile cache yet.
    condition: "{{ outputs.stage.outputs[0].row.needs_lookup }}"
    then:
      - id: lookup_recipients
        type: io.kestra.plugin.core.flow.Loop
        values: "{{ outputs.stage.outputs[0].row.lookup_ids }}"
        concurrencyLimit: 2
        tasks:
          - id: profile
            type: io.kestra.plugin.core.http.Request
            description: Recipient profile with the current `parent_name` and the history of `parents`. A 404 (recipient hash without a profile) is cached as "no parent".
            uri: "https://api.usaspending.gov/api/v2/recipient/{{ item.value }}/"
            headers:
              User-Agent: kestra-usaspending-competitor-tracker/1.0 (https://kestra.io)
            options:
              allowedResponseCodes: [200, 404]
              retryOnStatusCodes: [429, 500, 502, 503, 504]
              retry:
                type: exponential
                interval: PT5S
                maxInterval: PT1M
                maxAttempts: 4
        outputs:
          - id: recipient_id
            type: STRING
            value: "{{ item.value }}"
          - id: body
            type: STRING
            value: "{{ outputs.profile.code == 200 ? outputs.profile.body : '{}' }}"

  - id: diff
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: |
      Caches the recipient profiles, decides which staged awards belong to a competitor (name, current parent
      or a parent listed in the recipient profile), compares each award with the last state: NEW (unseen, base obligation
      recent), NEWLY_TRACKED (unseen, older), OBLIGATION_INCREASE / DEOBLIGATION (Award Amount moved),
      UPDATED (newer Last Modified Date, same money) or UNCHANGED. Writes the events, upserts the awards,
      aggregates new obligations by competitor, agency and NAICS and returns the run summary with the digest.
    databaseUri: "{{ outputs.stage.databaseUri }}"
    outputDbFile: true
    fetchType: FETCH_ONE
    outputFiles:
      - changes_csv
      - aggregates_csv
      - excluded_csv
    parameters:
      terms: "{{ outputs.plan.outputs[0].row.terms_json ?? '[]' }}"
      profiles: "{{ (outputs.lookup_recipients.outputs ?? []) | jq('[.[].outputs | {id: .recipient_id, body: .body}]') | first | toJson }}"
      match_parents: "{{ inputs.match_parents }}"
      new_award_max_age_days: "{{ inputs.new_award_max_age_days }}"
      min_alert_amount: "{{ inputs.min_alert_amount }}"
      is_baseline: "{{ outputs.plan.outputs[0].row.is_baseline }}"
      previous_checked_through: "{{ outputs.plan.outputs[0].row.previous_checked_through }}"
      previous_covered_from: "{{ outputs.plan.outputs[0].row.previous_covered_from }}"
      window_from: "{{ outputs.plan.outputs[0].row.window_from }}"
      window_to: "{{ outputs.plan.outputs[0].row.window_to }}"
      execution_id: "{{ execution.id }}"
      execution_url: "{{ kestra.url ?? '' }}/ui/main/executions/{{ flow.namespace }}/{{ flow.id }}/{{ execution.id }}"
    sql: |
      SET TimeZone = 'UTC';
      CREATE OR REPLACE TEMP MACRO norm(s) AS ' ' || trim(regexp_replace(lower(coalesce(s, '')), '[^a-z0-9]+', ' ', 'g')) || ' ';
      CREATE OR REPLACE TEMP MACRO usd(x) AS CASE WHEN abs(x) >= 1e9 THEN '$' || round(x / 1e9, 2) || 'B'
                                                  WHEN abs(x) >= 1e6 THEN '$' || round(x / 1e6, 1) || 'M'
                                                  WHEN abs(x) >= 1e3 THEN '$' || round(x / 1e3, 0) || 'K'
                                                  ELSE '$' || CAST(round(x) AS BIGINT) END;
      CREATE TEMP TABLE terms AS SELECT CAST(t->>'ord' AS INTEGER) AS ord, t->>'term' AS term FROM (SELECT unnest(from_json(:terms, '["JSON"]')) AS t);

      INSERT OR REPLACE INTO recipient_profiles
      SELECT p->>'id', b->>'name', b->>'parent_name', b->>'parent_uei', CAST(coalesce(b->'parents', '[]') AS VARCHAR), now()
      FROM (SELECT p, CASE WHEN json_valid(p->>'body') THEN CAST(p->>'body' AS JSON) ELSE CAST('{}' AS JSON) END AS b
            FROM (SELECT unnest(from_json(:profiles, '["JSON"]')) AS p));

      -- `parents` holds every parent USAspending has linked to the recipient (the top-level parent_name is often
      -- the recipient itself), without dates, so a subsidiary sold years ago can still list its old parent.
      CREATE TEMP TABLE parent_hits AS
      SELECT rp.recipient_id, arg_min(t.term, t.ord) AS parent_term, arg_min(pp->>'parent_name', t.ord) AS matched_parent
      FROM recipient_profiles rp, unnest(from_json(rp.parents_json, '["JSON"]')) AS x(pp)
      JOIN terms t ON contains(norm(pp->>'parent_name'), norm(t.term)) OR upper(t.term) = upper(coalesce(pp->>'parent_uei', ''))
      GROUP BY rp.recipient_id;

      CREATE TEMP TABLE classified AS
      SELECT s.*,
             CASE WHEN (SELECT count(*) FROM terms) = 0 THEN s.recipient_name
                  ELSE coalesce(m.name_term, CASE WHEN CAST(:match_parents AS BOOLEAN) THEN ph.parent_term END) END AS competitor,
             CASE WHEN (SELECT count(*) FROM terms) = 0 THEN 'filters'
                  WHEN m.name_term IS NOT NULL THEN 'name'
                  WHEN ph.parent_term IS NOT NULL THEN 'parent' END AS match_basis,
             coalesce(ph.matched_parent, rp.parent_name) AS parent_name
      FROM staged s
      JOIN staged_name_match m USING (award_key)
      LEFT JOIN parent_hits ph ON ph.recipient_id = s.recipient_id
      LEFT JOIN recipient_profiles rp ON rp.recipient_id = s.recipient_id;

      CREATE TEMP TABLE events AS
      SELECT c.*, a.award_amount AS previous_amount,
             CASE
               WHEN a.award_key IS NULL AND c.base_obligation_date >= current_date - CAST(:new_award_max_age_days AS INTEGER) THEN 'NEW'
               WHEN a.award_key IS NULL THEN CASE WHEN CAST(:is_baseline AS BOOLEAN) THEN 'BASELINE' ELSE 'NEWLY_TRACKED' END
               WHEN c.award_amount > a.award_amount + 0.5 THEN 'OBLIGATION_INCREASE'
               WHEN c.award_amount < a.award_amount - 0.5 THEN 'DEOBLIGATION'
               WHEN c.last_modified > a.last_modified THEN 'UPDATED'
               ELSE 'UNCHANGED' END AS event_type,
             a.first_seen_at
      FROM classified c LEFT JOIN awards a USING (award_key)
      WHERE c.competitor IS NOT NULL;

      ALTER TABLE events ADD COLUMN obligation_change DOUBLE;
      ALTER TABLE events ADD COLUMN late_reported BOOLEAN;
      UPDATE events SET
        obligation_change = CASE event_type WHEN 'NEW' THEN award_amount
                                            WHEN 'OBLIGATION_INCREASE' THEN award_amount - previous_amount
                                            WHEN 'DEOBLIGATION' THEN award_amount - previous_amount ELSE 0 END,
        late_reported = event_type = 'NEW' AND NOT CAST(:is_baseline AS BOOLEAN) AND :previous_checked_through <> ''
                        AND base_obligation_date >= CAST(nullif(:previous_covered_from, '') AS DATE)
                        AND base_obligation_date < CAST(nullif(:previous_checked_through, '') AS DATE);

      INSERT INTO award_events
      SELECT :execution_id, now(), award_key, event_type, previous_amount, award_amount, obligation_change, last_modified, late_reported
      FROM events WHERE event_type <> 'UNCHANGED';

      INSERT OR REPLACE INTO awards
      SELECT award_key, award_id, competitor, match_basis, recipient_name, recipient_uei, recipient_id, awarding_agency, awarding_sub_agency,
             naics_code, naics_description, psc_code, award_type, description, base_obligation_date, start_date, end_date,
             award_amount, last_modified, coalesce(first_seen_at, now()), now()
      FROM events;

      COPY (
        SELECT event_type, late_reported, competitor, match_basis, recipient_name, recipient_uei, parent_name, award_id, award_type,
               awarding_agency, awarding_sub_agency, naics_code, naics_description, psc_code, base_obligation_date, last_modified,
               previous_amount, award_amount, obligation_change, description,
               'https://www.usaspending.gov/award/' || award_key AS award_url
        FROM events WHERE event_type <> 'UNCHANGED'
        ORDER BY CASE event_type WHEN 'NEW' THEN 1 WHEN 'OBLIGATION_INCREASE' THEN 2 WHEN 'DEOBLIGATION' THEN 3 ELSE 4 END, abs(obligation_change) DESC, award_amount DESC
      ) TO '{{ outputFiles.changes_csv }}' (HEADER, DELIMITER ',');

      COPY (
        SELECT CASE WHEN grouping(competitor) = 0 THEN 'competitor' WHEN grouping(awarding_agency) = 0 THEN 'agency' ELSE 'naics' END AS dimension,
               coalesce(competitor, awarding_agency, naics_code || ' ' || naics_description) AS value,
               count(*) FILTER (WHERE event_type = 'NEW') AS new_awards,
               count(*) FILTER (WHERE event_type = 'OBLIGATION_INCREASE') AS increases,
               round(sum(obligation_change) FILTER (WHERE event_type = 'NEW'), 2) AS new_award_obligations,
               round(sum(obligation_change) FILTER (WHERE event_type IN ('OBLIGATION_INCREASE', 'DEOBLIGATION')), 2) AS net_modification_obligations,
               round(sum(obligation_change), 2) AS total_obligation_change
        FROM events WHERE event_type IN ('NEW', 'OBLIGATION_INCREASE', 'DEOBLIGATION')
        GROUP BY GROUPING SETS ((competitor), (awarding_agency), (naics_code, naics_description))
        ORDER BY dimension, total_obligation_change DESC
      ) TO '{{ outputFiles.aggregates_csv }}' (HEADER, DELIMITER ',');

      COPY (
        SELECT recipient_name, recipient_uei, parent_name, match_basis, count(*) AS awards,
               CASE WHEN match_basis = 'parent' THEN 'parent on the watchlist but match_parents is off'
                    ELSE 'matched the search only as a substring or alias, not as a watchlist name or parent' END AS reason
        FROM classified WHERE competitor IS NULL
        GROUP BY ALL ORDER BY awards DESC
      ) TO '{{ outputFiles.excluded_csv }}' (HEADER, DELIMITER ',');

      CREATE TEMP TABLE digest_new AS
      SELECT * FROM events WHERE event_type = 'NEW' AND award_amount >= CAST(:min_alert_amount AS DOUBLE)
      ORDER BY award_amount DESC LIMIT 10;
      CREATE TEMP TABLE digest_inc AS
      SELECT * FROM events WHERE event_type = 'OBLIGATION_INCREASE' AND obligation_change >= CAST(:min_alert_amount AS DOUBLE)
      ORDER BY obligation_change DESC LIMIT 10;

      CREATE TEMP TABLE summary AS
      SELECT
        :window_from AS window_from, :window_to AS window_to, CAST(:is_baseline AS BOOLEAN) AS is_baseline,
        (SELECT count(*) FROM staged) AS awards_fetched,
        count(*) AS matched_awards,
        (SELECT count(*) FROM classified WHERE competitor IS NULL) AS excluded_awards,
        coalesce((SELECT string_agg(DISTINCT recipient_name, '; ') FROM classified WHERE competitor IS NULL), '') AS excluded_recipients,
        count(*) FILTER (WHERE match_basis = 'parent') AS matched_via_parent,
        count(*) FILTER (WHERE event_type = 'NEW') AS new_awards,
        count(*) FILTER (WHERE late_reported) AS late_reported,
        count(*) FILTER (WHERE event_type = 'OBLIGATION_INCREASE') AS increases,
        count(*) FILTER (WHERE event_type = 'DEOBLIGATION') AS deobligations,
        count(*) FILTER (WHERE event_type = 'NEWLY_TRACKED') AS newly_tracked,
        count(*) FILTER (WHERE event_type = 'BASELINE') AS baseline_awards,
        count(*) FILTER (WHERE event_type = 'UPDATED') AS updated_no_money,
        count(*) FILTER (WHERE event_type = 'UNCHANGED') AS unchanged,
        round(coalesce(sum(obligation_change) FILTER (WHERE event_type = 'NEW'), 0), 2) AS new_award_obligations,
        round(coalesce(sum(obligation_change) FILTER (WHERE event_type = 'OBLIGATION_INCREASE'), 0), 2) AS increase_obligations,
        coalesce((SELECT string_agg(t.term, ', ' ORDER BY t.ord) FROM terms t WHERE t.term NOT IN (SELECT competitor FROM events)), 'none') AS competitors_without_awards,
        coalesce((SELECT string_agg(competitor || ' ' || n || ' new / ' || usd(v), ', ' ORDER BY v DESC)
                  FROM (SELECT competitor, count(*) AS n, sum(obligation_change) AS v FROM events WHERE event_type = 'NEW' GROUP BY competitor)), 'none') AS new_by_competitor,
        (SELECT count(*) FROM digest_new) + (SELECT count(*) FROM digest_inc) AS alert_count,
        coalesce((SELECT string_agg('- ' || usd(award_amount) || ' ' || competitor || ' (' || recipient_name || '), ' || awarding_agency || CASE WHEN awarding_sub_agency <> awarding_agency THEN ' / ' || awarding_sub_agency ELSE '' END
                    || ', NAICS ' || coalesce(naics_code, '?') || ', signed ' || base_obligation_date || CASE WHEN late_reported THEN ' (published late)' ELSE '' END
                    || ' <https://www.usaspending.gov/award/' || award_key || '|' || award_id || '>', chr(10) ORDER BY award_amount DESC) FROM digest_new), '') AS digest_new,
        coalesce((SELECT string_agg('- +' || usd(obligation_change) || ' to ' || usd(award_amount) || ' ' || competitor || ', ' || awarding_agency
                    || ' <https://www.usaspending.gov/award/' || award_key || '|' || award_id || '>', chr(10) ORDER BY obligation_change DESC) FROM digest_inc), '') AS digest_increases
      FROM events;

      ALTER TABLE summary ADD COLUMN totals_label VARCHAR;
      ALTER TABLE summary ADD COLUMN slack_text VARCHAR;
      UPDATE summary SET totals_label = usd(new_award_obligations) || ' in new awards, ' || usd(increase_obligations) || ' in increases';
      UPDATE summary SET slack_text =
        '*Competitor awards on USAspending* (' || window_from || ' to ' || window_to || CASE WHEN is_baseline THEN ', first run' ELSE '' END || ')' || chr(10)
        || new_awards || ' new awards (' || new_by_competitor || '), '
        || increases || ' obligation increases (' || usd(increase_obligations) || ').' || chr(10)
        || '*Largest new awards*' || chr(10) || CASE WHEN digest_new = '' THEN '- none above the threshold' ELSE digest_new END || chr(10)
        || '*Largest increases*' || chr(10) || CASE WHEN digest_increases = '' THEN '- none above the threshold' ELSE digest_increases END || chr(10)
        || 'Execution: ' || :execution_url;

      DROP TABLE staged;
      DROP TABLE staged_name_match;

      SELECT * FROM summary;

  - id: save_db
    type: io.kestra.plugin.core.kv.Set
    key: "{{ inputs.state_key }}_db"
    value: "{{ outputs.diff.databaseUri }}"

  - id: save_window
    type: io.kestra.plugin.core.kv.Set
    key: "{{ inputs.state_key }}_window"
    kvType: JSON
    value: |
      {"checked_through": "{{ outputs.plan.outputs[0].row.window_to }}", "covered_from": "{{ outputs.plan.outputs[0].row.covered_from }}"}

  - id: digest
    type: io.kestra.plugin.core.flow.If
    description: Posts only when a new award or an obligation increase reached `min_alert_amount`.
    condition: "{{ outputs.diff.outputs[0].row.alert_count > 0 }}"
    then:
      - id: log_digest
        type: io.kestra.plugin.core.log.Log
        level: WARN
        message: |
          New awards:
          {{ outputs.diff.outputs[0].row.digest_new }}
          Obligation increases:
          {{ outputs.diff.outputs[0].row.digest_increases }}
      - id: slack_digest
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        allowFailure: true
        description: allowFailure keeps the run green when SLACK_WEBHOOK_URL is not configured; the digest is in the WARN log and the CSV.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {"text": {{ outputs.diff.outputs[0].row.slack_text | toJson }}}
    else:
      - id: nothing_to_report
        type: io.kestra.plugin.core.log.Log
        message: No new award or increase above {{ inputs.min_alert_amount }} USD this run.

  - id: summary
    type: io.kestra.plugin.core.log.Log
    message: |
      Window {{ outputs.diff.outputs[0].row.window_from }} to {{ outputs.diff.outputs[0].row.window_to }}{{ outputs.diff.outputs[0].row.is_baseline ? ' (BASELINE run)' : '' }}; agencies {{ outputs.plan.outputs[0].row.agency_names }}; NAICS {{ outputs.plan.outputs[0].row.naics_list }}.
      {{ outputs.stage.outputs[0].row.pages }} page(s), {{ outputs.diff.outputs[0].row.awards_fetched }} awards fetched{{ outputs.stage.outputs[0].row.truncated ? ', TRUNCATED at max_pages' : '' }}; {{ outputs.diff.outputs[0].row.matched_awards }} matched ({{ outputs.diff.outputs[0].row.matched_via_parent }} via parent), {{ outputs.diff.outputs[0].row.excluded_awards }} excluded: {{ outputs.diff.outputs[0].row.excluded_recipients }}. Profiles looked up: {{ outputs.stage.outputs[0].row.lookups }}.
      New {{ outputs.diff.outputs[0].row.new_awards }} ({{ outputs.diff.outputs[0].row.late_reported }} published late), increases {{ outputs.diff.outputs[0].row.increases }}, deobligations {{ outputs.diff.outputs[0].row.deobligations }}, newly tracked {{ outputs.diff.outputs[0].row.newly_tracked }}, baseline {{ outputs.diff.outputs[0].row.baseline_awards }}, updated {{ outputs.diff.outputs[0].row.updated_no_money }}, unchanged {{ outputs.diff.outputs[0].row.unchanged }}.
      Obligations detected: {{ outputs.diff.outputs[0].row.totals_label }}. New by competitor: {{ outputs.diff.outputs[0].row.new_by_competitor }}. Without awards: {{ outputs.diff.outputs[0].row.competitors_without_awards }}.

outputs:
  - id: summary
    type: JSON
    value: "{{ outputs.diff.outputs[0].row }}"
  - id: changes_csv
    type: FILE
    value: "{{ outputs.diff.outputFiles.changes_csv }}"
  - id: aggregates_csv
    type: FILE
    value: "{{ outputs.diff.outputFiles.aggregates_csv }}"
  - id: excluded_csv
    type: FILE
    value: "{{ outputs.diff.outputFiles.excluded_csv }}"
  - id: awards_db
    type: FILE
    value: "{{ outputs.diff.databaseUri }}"

extend:
  title: Track Competitor Federal Contract Awards and Obligation Increases on USAspending
  metaTitle: USAspending Federal Award Competitor Tracker with DuckDB | Kestra
  shortDescription: Search USAspending.gov every week for contracts won by your competitors in your NAICS codes and agencies, separate new awards from obligation increases on awards already seen, and send a Slack digest with CSVs.
  metaDescription: Track competitors' federal contract awards on USAspending weekly, detect new awards and obligation increases in DuckDB and send a Slack digest.
  description: |
    Capture and BD teams watch who wins what: a competitor's new task order at a target agency, or a large obligation increase on an incumbent contract they plan to recompete. USAspending's keyless API has it all, but its recipient search matches substrings and parent names, DoD actions appear 90 days late, and an award row only carries the cumulative obligation. This flow turns that into a weekly, deduplicated feed of new awards and obligation increases per competitor, agency and NAICS code.

    ## How it works

    1. A weekly `Schedule` (Monday 06:00 Eastern) starts the run. KV holds the URI of a DuckDB file in internal storage and the last window.
    2. `plan` (DuckDB) checks NAICS codes and agency names against `/api/v2/references/toptier_agencies/` and fails with the closest match ("Department of Defence" suggests "Department of Defense"), since USAspending silently returns nothing for an unknown agency. It builds `filters`: contract `award_type_codes` A to D, `recipient_search_text`, `naics_codes`, `agencies` and two `time_period` entries, `action_date` and `last_modified_date`, which the API ORs together.
    3. The first run reads `lookback_days` (120). Later runs re-read `overlap_days` (100) before the last window end, never before the range already covered, so DoD actions published 90 days after signing are still caught.
    4. `fetch_pages` (Loop) posts to `/api/v2/search/spending_by_award/` with `page`, `limit: 100` and a trimmed `fields` list, and stops at the first page whose `page_metadata.hasNext` is false. `max_pages` is a ceiling; the summary says `TRUNCATED` if it is hit.
    5. `stage` (DuckDB on the persistent file) deduplicates on `generated_internal_id` (PIIDs repeat across agencies) and matches recipient names against the watchlist as whole words or by UEI.
    6. `resolve_parents` (If + Loop) calls `/api/v2/recipient/{recipient_id}/` once per recipient that matched no name and caches the profile. The award is kept if a listed parent is on the watchlist (Dynetics and Gibbs & Cox under Leidos, Engility under SAIC); substring hits such as ACACIA7 for "CACI" are dropped.
    7. `diff` compares every kept award with the stored one: `NEW` (unseen, signed within `new_award_max_age_days`), `NEWLY_TRACKED` (unseen and older), `OBLIGATION_INCREASE` or `DEOBLIGATION` (Award Amount changed), `UPDATED` (newer Last Modified Date, same money) or `UNCHANGED`. New awards signed before the previous run are flagged `late_reported`.
    8. `digest` (If) runs when a new award or increase reaches `min_alert_amount`: WARN log plus Slack with `allowFailure: true`.

    ## What you get

    - `changes_csv`: every changed award with event type, competitor, matched parent, agency, NAICS, previous and current amount, obligation change and a USAspending link.
    - `aggregates_csv`: new awards, increases and obligation change by competitor, by agency and by NAICS for the run.
    - `excluded_csv`: recipients dropped as substring or alias matches, with the reason.
    - `awards_db`: the DuckDB file with `awards`, `award_events` and `recipient_profiles`, ready for ad-hoc SQL.
    - A Slack digest of the ten largest new awards and increases. The first run reports the new awards of the lookback window and stores everything else as the baseline; increases start with the second run.

    ## Who it's for

    - Capture managers and BD analysts at federal contractors watching competitors and incumbents.
    - Pricing and market-intelligence teams sizing agency spend by NAICS.

    ## Why orchestrate this with Kestra

    - Pagination, retries on 429 and 5xx and the If branches are declared in YAML.
    - The DuckDB file and the window live in internal storage and KV, so each run only reports what changed.
    - Inputs let one flow serve several watchlists under separate `state_key` prefixes.
    - `allowFailure` keeps the load green when Slack is not configured.

    ## Prerequisites

    - Kestra 2.0 with the JDBC DuckDB and Slack plugins.
    - Outbound HTTPS to `api.usaspending.gov`; no API key.
    - Keep the latest successful execution when purging executions; the DuckDB file lives in its storage.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack incoming webhook for the digest (optional; without it the digest stays in the WARN log and the CSV).

    ## Quick start

    1. Click **Execute** with the defaults (Leidos, Booz Allen Hamilton, CACI and Science Applications International in four IT and engineering NAICS codes at DoD, DHS and VA). The first run reads about 1,200 awards and is marked BASELINE.
    2. Execute again: every award is `UNCHANGED` and no profile is looked up.
    3. Replace the watchlist with your competitors. Spell out acronyms: "SAIC" matches MOSAIC and PASSAIC but not Science Applications International Corporation.
    4. Add `SLACK_WEBHOOK_URL`, set `min_alert_amount` and enable the schedule.

    ## How to extend

    - Track grants or IDVs by changing `award_type_codes` and the `fields` list.
    - Add `psc_codes` or `place_of_performance_locations` to the filters in `plan`, or load `changes_csv` into your CRM.
    - Run several watchlists with a `ForEach` over this flow as a `Subflow`, one `state_key` each.

    ## Links

    - [USAspending API: spending_by_award](https://github.com/fedspendingtransparency/usaspending-api/blob/master/usaspending_api/api_contracts/contracts/v2/search/spending_by_award.md)
    - [USAspending API: recipient profile](https://github.com/fedspendingtransparency/usaspending-api/blob/master/usaspending_api/api_contracts/contracts/v2/recipient/recipient_id.md)
    - [USAspending API documentation](https://api.usaspending.gov/docs/endpoints)
    - [DuckDB Queries](https://kestra.io/plugins/plugin-jdbc-duckdb/io.kestra.plugin.jdbc.duckdb.queries)
    - [Loop](https://kestra.io/plugins/core/flow/io.kestra.plugin.core.flow.loop) and [If](https://kestra.io/plugins/core/flow/io.kestra.plugin.core.flow.if)
    - [HTTP Download](https://kestra.io/plugins/core/http/io.kestra.plugin.core.http.download) and [HTTP Request](https://kestra.io/plugins/core/http/io.kestra.plugin.core.http.request)
    - [Slack Incoming Webhook](https://kestra.io/plugins/plugin-notifications/slack/io.kestra.plugin.slack.notifications.slackincomingwebhook)
    - [KV Store](https://kestra.io/docs/concepts/kv-store)
  tags:
    - Business
  subTags:
    - Reporting & Digests
  ee: false
  demo: false
