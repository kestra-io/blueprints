id: redpanda-schema-registry-compatibility-drift-sentinel
namespace: company.streaming

inputs:
  - id: schema_registry_url
    type: STRING
    defaults: "http://redpanda.internal:8081"
    description: Base URL of the Redpanda Schema Registry HTTP API.
  - id: subject_name
    type: STRING
    description: Target schema subject name to audit (e.g. orders-value).

tasks:
  - id: inspect_schema_subject
    type: io.kestra.plugin.scripts.shell.Commands
    commands:
      - |
        # Query Redpanda Schema Registry for subject versions and compatibility mode
        curl -s "{{ inputs.schema_registry_url }}/subjects/{{ inputs.subject_name }}/versions" > /tmp/rp_versions.json
        curl -s "{{ inputs.schema_registry_url }}/config/{{ inputs.subject_name }}" > /tmp/rp_config.json

        python3 -c "
        import json
        try:
            with open('/tmp/rp_versions.json') as f:
                versions = json.load(f)
            with open('/tmp/rp_config.json') as f:
                cfg = json.load(f)
            v_count = len(versions) if isinstance(versions, list) else 0
            mode = cfg.get('compatibilityLevel', 'FULL')
            is_breach = 1 if mode in ['NONE', 'DISABLED'] else 0
            print(f'{is_breach}|{v_count}|{mode}')
        except Exception:
            print('0|0|UNKNOWN')
        " > /tmp/rp_summary.txt

        IS_BREACH=$(cut -d '|' -f 1 /tmp/rp_summary.txt)
        VERSION_COUNT=$(cut -d '|' -f 2 /tmp/rp_summary.txt)
        COMPAT_MODE=$(cut -d '|' -f 3 /tmp/rp_summary.txt)
        
        echo "::set-output name=is_breach::${IS_BREACH:-0}::"
        echo "::set-output name=version_count::$VERSION_COUNT::"
        echo "::set-output name=compat_mode::$COMPAT_MODE::"

  - id: evaluate_schema_governance
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.inspect_schema_subject.vars.is_breach | int == 1 }}"
    then:
      - id: notify_streaming_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#streaming-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 Redpanda Schema Compatibility Drift Warning",
                "text": "Subject {{ inputs.subject_name }} on {{ inputs.schema_registry_url }} has compatibility mode {{ outputs.inspect_schema_subject.vars.compat_mode }} (Versions: {{ outputs.inspect_schema_subject.vars.version_count }}). Backward or full compatibility enforcement is disabled, allowing breaking Avro/Protobuf schema evolution.",
                "footer": "Kestra Streaming Sentinel • Redpanda"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#streaming-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ Redpanda Sentinel Failure",
            "text": "Failed to communicate with Redpanda Schema Registry at {{ inputs.schema_registry_url }}.",
            "footer": "Kestra Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 * * * *"
    disabled: true

extend:
  metaDescription: "Audits Redpanda Schema Registry subjects to detect disabled compatibility enforcement and breaking schema changes."
  metaTitle: Redpanda Schema Registry Compatibility Drift Sentinel with Kestra
  ee: false
  demo: false
  title: Redpanda Schema Registry Compatibility Drift Sentinel
  shortDescription: Audits Redpanda Schema Registry subjects to detect disabled compatibility enforcement and breaking schema changes.
  description: |
    ## How it works
    This workflow connects to the Redpanda Schema Registry HTTP API (`/subjects/{subject}/versions` and `/config/{subject}`) to audit active schema versions and compatibility levels. In event-driven streaming architectures, schema registries enforce backward, forward, or full compatibility on Avro, JSON Schema, and Protobuf payloads. If developers or automated CI/CD scripts accidentally downgrade subject compatibility to `NONE`, breaking schema changes can be published, causing downstream streaming consumer microservices to crash during deserialization. This sentinel audits compatibility modes and alerts streaming teams.

    ## What you get
    - Real-time tracking of Redpanda schema governance and compatibility modes.
    - Protection against breaking Avro and Protobuf schema evolutions.
    - Automated Slack incident notifications detailing subject versions and compatibility levels.

    ## Who it's for
    - Event-Driven Architecture Specialists and Streaming Platform Engineers.
    - SREs maintaining mission-critical Kafka and Redpanda event backbones.
    - Data Governance Leads enforcing strict serialization compatibility.

    ## Why orchestrate this with Kestra
    - **Automated Governance Surveillance**: Regularly audits schema registries without custom daemon scripts.
    - **Native API Capabilities**: Interacts directly with Confluent-compatible REST endpoints.
    - **Incident Orchestration**: Notifies platform engineers directly in team collaboration channels.

    ## Prerequisites
    - Redpanda cluster with enabled Schema Registry API (`8081`).
    - Slack incoming webhook URL configured in `SLACK_WEBHOOK` secret.

    ## Quick start
    1. Import this blueprint into your Kestra workspace.
    2. Add `SLACK_WEBHOOK` secret to your namespace.
    3. Specify `schema_registry_url` and target `subject_name`.
    4. Enable the schedule trigger for continuous schema surveillance.

    ## How to extend
    - Automatically restore `BACKWARD` compatibility mode via `PUT /config/{subject}`.
    - Audit all registered schema subjects in a single workflow execution.
    - Route critical alerts to PagerDuty or Opsgenie.

    ## Links
    - [Redpanda Schema Registry API](https://docs.redpanda.com/current/manage/schema-reg/schema-reg-api/)
    - [Kestra Shell Plugin](https://kestra.io/plugins/plugin-scripts-shell)
    - [Kestra Slack Notifications](https://kestra.io/plugins/plugin-slack)
  tags:
    - Data
    - Infrastructure
  subTags:
    - ELT & Data Landing
    - Day 2 Operations
