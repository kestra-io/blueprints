id: windows-update-patch-compliance-audit
namespace: company.team
description: |
  Audit Windows Update patch compliance from the local hotfix history: age the
  newest installed update against a threshold, check every reboot-pending source,
  list the recent patch trail, alert Slack when the host is non-compliant, and
  remediate by triggering an update scan or scheduling the owed reboot.

triggers:
  - id: weekly
    type: io.kestra.plugin.core.trigger.Schedule
    description: Run every Monday morning so patch compliance is known before the change window.
    cron: "0 5 * * 1"

inputs:
  - id: maxPatchAgeDays
    type: INT
    description: Maximum acceptable age of the newest installed update in days before the host counts as stale.
    defaults: 30
  - id: requireRebootClear
    type: BOOL
    description: Treat a pending reboot from any source as a compliance failure.
    defaults: true
  - id: remediate
    type: BOOL
    description: Act on stale patch history by triggering a Windows Update detection scan instead of only reporting it.
    defaults: true
  - id: remediateReboot
    type: BOOL
    description: Schedule the pending reboot 15 minutes out when a reboot is owed. Off by default because a reboot interrupts users, so enable it deliberately in a change window.
    defaults: false

tasks:
  - id: collect_patch_state
    type: io.kestra.plugin.scripts.powershell.Script
    description: Read the hotfix history, age the newest update, probe every reboot-pending source, and score the compliance verdict.
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    outputFiles:
      - patch_state.json
    env:
      MAX_PATCH_AGE_DAYS: "{{ inputs.maxPatchAgeDays }}"
      REQUIRE_REBOOT_CLEAR: "{{ inputs.requireRebootClear }}"
    script: |
      $maxPatchAgeDays = [int]$env:MAX_PATCH_AGE_DAYS
      $requireRebootClear = $env:REQUIRE_REBOOT_CLEAR -eq 'true'
      $now = Get-Date

      $os = Get-CimInstance Win32_OperatingSystem -ErrorAction SilentlyContinue
      $all = @(Get-HotFix -ErrorAction SilentlyContinue)
      $dated = @($all | Where-Object { $_.InstalledOn } | Sort-Object { [datetime]$_.InstalledOn } -Descending)
      $newest = if ($dated.Count -gt 0) { $dated[0] } else { $null }
      $newestKb = if ($newest) { $newest.HotFixID } else { '' }
      $newestInstalled = if ($newest) { ([datetime]$newest.InstalledOn).ToUniversalTime().ToString('yyyy-MM-dd') } else { '' }
      $ageDays = if ($newest) { [math]::Round(($now - [datetime]$newest.InstalledOn).TotalDays, 1) } else { -1 }

      $cbs = Test-Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Component Based Servicing\RebootPending'
      $wu = Test-Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\WindowsUpdate\Auto Update\RebootRequired'
      $pfr = $null -ne (Get-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager' -Name PendingFileRenameOperations -ErrorAction SilentlyContinue)
      $sources = @()
      if ($cbs) { $sources += 'component-based-servicing' }
      if ($wu) { $sources += 'windows-update' }
      if ($pfr) { $sources += 'pending-file-rename-operations' }
      $rebootPending = $sources.Count -gt 0

      $recent = @($dated | Select-Object -First 3 | ForEach-Object {
        @{ kb = $_.HotFixID; installed = ([datetime]$_.InstalledOn).ToUniversalTime().ToString('yyyy-MM-dd'); description = "$($_.Description)" }
      })

      $reasons = @()
      if (-not $newest) { $reasons += 'no-hotfix-records' }
      elseif ($ageDays -gt $maxPatchAgeDays) { $reasons += 'newest-patch-older-than-threshold' }
      if ($requireRebootClear -and $rebootPending) { $reasons += 'reboot-pending' }

      $verdict = if ($reasons.Count -eq 0) { 'COMPLIANT' } else { 'NON_COMPLIANT' }

      $report = [pscustomobject]@{
        machine        = $env:COMPUTERNAME
        collectedAtUtc = $now.ToUniversalTime().ToString('o')
        osCaption      = if ($os) { $os.Caption } else { '' }
        lastBoot       = if ($os) { $os.LastBootUpTime.ToUniversalTime().ToString('o') } else { '' }
        hotfixCount    = $all.Count
        datedCount     = $dated.Count
        newestKb       = $newestKb
        newestInstalled = $newestInstalled
        ageDays        = $ageDays
        rebootPending  = $rebootPending
        rebootSources  = $sources
        verdict        = $verdict
        reasons        = $reasons
        recentPatches  = $recent
      }
      $reportPath = Join-Path '{{ outputDir }}' 'patch_state.json'
      $report | ConvertTo-Json -Depth 6 | Set-Content -Path $reportPath -Force

      $payload = @{
        outputs = @{
          verdict         = $verdict
          reasons         = $reasons
          newest_kb       = $newestKb
          newest_installed = $newestInstalled
          age_days        = $ageDays
          hotfix_count    = $all.Count
          reboot_pending  = $rebootPending
          reboot_sources  = $sources
          recent_patches  = $recent
          machine         = $env:COMPUTERNAME
          os_caption      = if ($os) { $os.Caption } else { '' }
        }
      }
      Write-Output ('::' + ($payload | ConvertTo-Json -Compress -Depth 5) + '::')

  - id: recent_patch_trail
    type: io.kestra.plugin.core.flow.Loop
    description: Log the three newest hotfixes so the execution history carries a visible recent patch trail.
    values: "{{ outputs.collect_patch_state.vars.recent_patches }}"
    concurrencyLimit: 1
    tasks:
      - id: log_patch_trail
        type: io.kestra.plugin.core.log.Log
        description: Record one recent hotfix with its install date and description.
        message: "Patch trail on {{ outputs.collect_patch_state.vars.machine }}: {{ item.kb }} installed {{ item.installed }} ({{ item.description }})."

  - id: alert_if_noncompliant
    type: io.kestra.plugin.core.flow.If
    description: Alert when the host is non-compliant, otherwise record the compliant state with the newest patch age.
    condition: "{{ outputs.collect_patch_state.vars.verdict == 'NON_COMPLIANT' }}"
    then:
      - id: alert_slack
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Post the verdict, the reasons, the newest patch age and the reboot sources to the ops channel.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {"text": "Patch compliance NON_COMPLIANT on {{ outputs.collect_patch_state.vars.machine }} ({{ outputs.collect_patch_state.vars.os_caption }}): reasons {{ outputs.collect_patch_state.vars.reasons }}. Newest update {{ outputs.collect_patch_state.vars.newest_kb }} installed {{ outputs.collect_patch_state.vars.newest_installed }}, age {{ outputs.collect_patch_state.vars.age_days }} days against a {{ inputs.maxPatchAgeDays }} day threshold. Reboot pending {{ outputs.collect_patch_state.vars.reboot_pending }} from {{ outputs.collect_patch_state.vars.reboot_sources }}. Execution {{ execution.id }}."}
      - id: log_noncompliant_summary
        type: io.kestra.plugin.core.log.Log
        description: Record the non-compliant verdict with every reason in the execution log.
        message: "Patch compliance NON_COMPLIANT on {{ outputs.collect_patch_state.vars.machine }}: reasons {{ outputs.collect_patch_state.vars.reasons }}, newest {{ outputs.collect_patch_state.vars.newest_kb }} at {{ outputs.collect_patch_state.vars.age_days }} days, reboot pending sources {{ outputs.collect_patch_state.vars.reboot_sources }}, {{ outputs.collect_patch_state.vars.hotfix_count }} hotfix record(s) total."
    else:
      - id: log_compliant
        type: io.kestra.plugin.core.log.Log
        description: Record the compliant verdict with the newest patch age.
        message: "Patch compliance COMPLIANT on {{ outputs.collect_patch_state.vars.machine }}: newest update {{ outputs.collect_patch_state.vars.newest_kb }} installed {{ outputs.collect_patch_state.vars.newest_installed }} ({{ outputs.collect_patch_state.vars.age_days }} days old), no reboot pending, {{ outputs.collect_patch_state.vars.hotfix_count }} hotfix record(s) total."

  - id: trigger_update_scan
    type: io.kestra.plugin.core.flow.If
    description: Run a Windows Update detection scan when the newest update crossed the threshold, so a stale host checks for patches instead of only being reported stale.
    condition: "{{ inputs.remediate and (outputs.collect_patch_state.vars.age_days < 0 or outputs.collect_patch_state.vars.age_days > inputs.maxPatchAgeDays) }}"
    then:
      - id: start_update_scan
        type: io.kestra.plugin.scripts.powershell.Script
        description: Trigger a Windows Update detection scan with UsoClient and verify it ran from the WindowsUpdateClient event log.
        taskRunner:
          type: io.kestra.plugin.core.runner.Process
        script: |
          $wuLog = 'Microsoft-Windows-WindowsUpdateClient/Operational'

          function Confirm-ScanEvent {
            param([datetime]$since, [int]$seconds)
            $deadline = (Get-Date).AddSeconds($seconds)
            while ((Get-Date) -lt $deadline) {
              $evt = Get-WinEvent -FilterHashtable @{ LogName = $wuLog; StartTime = $since } -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($evt) { return $evt }
              Start-Sleep -Seconds 5
            }
            return $null
          }

          $attempts = @()
          if (Get-Command UsoClient.exe -ErrorAction SilentlyContinue) { $attempts += 'UsoClient StartScan' }
          if (Get-Command wuauclt.exe -ErrorAction SilentlyContinue) { $attempts += 'wuauclt /detectnow' }
          $attempts += 'Microsoft.Update.Session detection search'

          $triggered = $false
          $triggerCommand = ''
          $eventId = ''
          $eventTime = ''
          $eventSummary = ''

          foreach ($cmd in $attempts) {
            $since = Get-Date
            $evt = $null
            if ($cmd -eq 'UsoClient StartScan') {
              & UsoClient.exe StartScan 2>&1 | Out-Null
              $evt = Confirm-ScanEvent $since 60
            } elseif ($cmd -eq 'wuauclt /detectnow') {
              & wuauclt.exe /detectnow 2>&1 | Out-Null
              $evt = Confirm-ScanEvent $since 60
            } else {
              try {
                $searcher = (New-Object -ComObject Microsoft.Update.Session).CreateUpdateSearcher()
                $null = $searcher.Search("IsInstalled=0 and Type='Software'")
                $evt = Confirm-ScanEvent $since 30
              } catch {
                $evt = $null
              }
            }
            if ($evt) {
              $triggered = $true
              $triggerCommand = $cmd
              $eventId = "$($evt.Id)"
              $eventTime = $evt.TimeCreated.ToUniversalTime().ToString('o')
              $summary = ($evt.Message -replace '\s+', ' ')
              $eventSummary = $summary.Substring(0, [Math]::Min(120, $summary.Length))
              break
            }
          }

          $payload = @{
            outputs = @{
              update_scan_result = if ($attempts.Count -eq 0) { 'skipped-no-update-client-tool' } elseif ($triggered) { 'update-scan-triggered' } else { 'trigger-unverified' }
              trigger_command    = $triggerCommand
              scan_event_id      = $eventId
              scan_event_time    = $eventTime
              scan_event_summary = $eventSummary
            }
          }
          Write-Output ('::' + ($payload | ConvertTo-Json -Compress -Depth 5) + '::')
      - id: log_update_scan_remediation
        type: io.kestra.plugin.core.log.Log
        description: Record that the Windows Update scan was triggered and which event confirmed it ran.
        message: "Patch remediation on {{ outputs.collect_patch_state.vars.machine }}: update scan result '{{ outputs.start_update_scan.vars.update_scan_result }}' via {{ outputs.start_update_scan.vars.trigger_command }}, confirmed by event {{ outputs.start_update_scan.vars.scan_event_id }} at {{ outputs.start_update_scan.vars.scan_event_time }}: {{ outputs.start_update_scan.vars.scan_event_summary }}."

  - id: schedule_pending_reboot
    type: io.kestra.plugin.core.flow.If
    description: Schedule the owed reboot when remediateReboot is explicitly enabled, so the reboot the patches are waiting on is actually taken in the change window.
    condition: "{{ inputs.remediateReboot and outputs.collect_patch_state.vars.reboot_pending }}"
    then:
      - id: schedule_reboot
        type: io.kestra.plugin.scripts.powershell.Script
        description: Schedule a reboot 15 minutes out with shutdown.exe and emit the deadline, keeping the action opt-in through the remediateReboot input.
        taskRunner:
          type: io.kestra.plugin.core.runner.Process
        script: |
          $output = & shutdown.exe /r /t 900 2>&1 | Out-String
          $exit = $LASTEXITCODE
          $payload = @{
            outputs = @{
              reboot_exit_code = $exit
              reboot_message   = ($output.Trim())
              reboot_at_utc    = ((Get-Date).AddSeconds(900).ToUniversalTime().ToString('o'))
            }
          }
          Write-Output ('::' + ($payload | ConvertTo-Json -Compress -Depth 5) + '::')
      - id: log_reboot_scheduled
        type: io.kestra.plugin.core.log.Log
        description: Record the scheduled reboot deadline in the execution log.
        message: "Patch remediation on {{ outputs.collect_patch_state.vars.machine }}: reboot scheduled (exit {{ outputs.schedule_reboot.vars.reboot_exit_code }}) at {{ outputs.schedule_reboot.vars.reboot_at_utc }}: {{ outputs.schedule_reboot.vars.reboot_message }}."

errors:
  - id: alert_slack_on_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Ping the on-call channel when the audit itself fails so a broken collector never stays silent.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    allowFailure: true
    payload: |
      {"text": "Patch compliance audit failed on {{ outputs.collect_patch_state.vars.machine ?? execution.id }}: {{ errorLogs() }}. Execution {{ execution.id }}."}

outputs:
  - id: verdict
    type: STRING
    value: "{{ outputs.collect_patch_state.vars.verdict }}"
  - id: newest_kb
    type: STRING
    value: "{{ outputs.collect_patch_state.vars.newest_kb }}"
  - id: age_days
    type: INT
    value: "{{ outputs.collect_patch_state.vars.age_days }}"
  - id: hotfix_count
    type: INT
    value: "{{ outputs.collect_patch_state.vars.hotfix_count }}"
  - id: reboot_pending
    type: BOOL
    value: "{{ outputs.collect_patch_state.vars.reboot_pending }}"
  - id: machine
    type: STRING
    value: "{{ outputs.collect_patch_state.vars.machine }}"

extend:
  shortDescription: "Audit Windows Update patch compliance from hotfix history: age the newest update, name every reboot-pending source, trigger an update scan when stale, and gate the owed reboot behind an input."
  title: Windows Update Patch Compliance Audit with Reboot-Pending Checks
  metaTitle: Windows Update Patch Compliance Audit with Reboot Sources and Slack Alerts
  metaDescription: "Audit Windows Update patch compliance from Get-HotFix records: newest patch age, reboot-pending sources, then trigger an update scan or schedule the reboot."
  description: |
    Patch compliance on a Windows fleet usually lives in a spreadsheet that is updated when someone remembers. The host itself already knows better: `Get-HotFix` carries the full installed history with dates, and the registry tells you whether Component Based Servicing, Windows Update or pending file rename operations are holding a reboot open. This blueprint turns those signals into a weekly scored audit: it ages the newest installed update against a threshold, probes every reboot-pending source by name, writes the three newest hotfixes to the execution history as a patch trail, posts one Slack alert only when the host is non-compliant, and then acts on the findings - triggering a Windows Update scan on a stale host and scheduling the owed reboot when you explicitly enable it. The catalog already has patch orchestration waves for Linux, VMware and SSH fleets - a Windows patch compliance audit that reports and remediates is the piece that was missing.

    ## How it works
    1. The `weekly` trigger (`io.kestra.plugin.core.trigger.Schedule`) runs the audit every Monday at 05:00 so the verdict is known before the change window. Manual runs accept `maxPatchAgeDays`, `requireRebootClear`, `remediate` and `remediateReboot` as inputs.
    2. The `collect_patch_state` task (`io.kestra.plugin.scripts.powershell.Script` on the Process task runner) reads the host's own hotfix history with `Get-HotFix`, ages the newest dated update, probes the three reboot-pending registry sources by name, and scores the verdict: no hotfix records, a newest update older than the threshold, or a reboot still pending when `requireRebootClear` is set each produce a `NON_COMPLIANT` reason. The full snapshot lands in `patch_state.json` and the verdict, ages, reasons and recent patches are emitted as task variables.
    3. The `recent_patch_trail` task (`io.kestra.plugin.core.flow.Loop`) walks the three newest hotfixes and logs one line per update - kb, install date, description - so the execution history carries a visible trail without opening the artifact.
    4. The `alert_if_noncompliant` task (`io.kestra.plugin.core.flow.If`) branches on the verdict: a non-compliant host posts one Slack message with the reasons, the newest patch age and the reboot sources by name; a compliant host writes a single log line with the newest update and its age.
    5. The `trigger_update_scan` task (`io.kestra.plugin.core.flow.If`) acts on staleness: when the newest update crossed `maxPatchAgeDays` (or no dated hotfix exists) it triggers a detection scan - `UsoClient StartScan`, then `wuauclt /detectnow`, then a direct `Microsoft.Update.Session` search as a fallback for hosts where the command-line triggers are blocked - and verifies from the WindowsUpdateClient event log that the detection actually ran. On a host inside the threshold the task skips, and the `remediate` input turns the whole step off for report-only auditing.
    6. The `schedule_pending_reboot` task (`io.kestra.plugin.core.flow.If`) acts on the reboot debt: only when `remediateReboot` is explicitly enabled and a reboot is pending does it run `shutdown /r /t 900` - a 15 minute deadline you can still cancel - and log the reboot time. It stays off by default because a reboot interrupts users; it is the deliberate change-window action, not a side effect of the audit.
    7. The `errors` handler posts a Slack notice with `allowFailure: true`, so a broken collector escalates instead of failing silently.

    ## What you get
    - A weekly compliance verdict per host: `COMPLIANT` or `NON_COMPLIANT`, with the exact reasons spelled out.
    - Reboot-pending sources named individually - component-based-servicing, windows-update, pending-file-rename-operations - so the fix is obvious.
    - Remediation that acts on the findings: a Windows Update detection scan triggered and verified on stale hosts, and an opt-in scheduled reboot for hosts that owe one.
    - A recent patch trail in the execution history with kb, date and description for the three newest updates.
    - A `patch_state.json` artifact on every execution, ready for audit evidence.

    ## Who it's for
    - Windows fleet operators who need to know, without logging in, whether every host is inside the patch window and whether a reboot is still owed.
    - Compliance teams that must evidence per-host patch state on a schedule instead of chasing screenshots.
    - Administrators who want the reboot source named - CBS, Windows Update or file renames - rather than a single opaque flag.

    ## Why orchestrate this with Kestra
    The cmdlets and registry probes are trivial on one host and impossible to keep honest across a fleet on a schedule. Kestra gives the audit typed thresholds, a weekly cadence aligned with the change window, an execution history that keeps every artifact and patch trail, and a conditional escalation that stays quiet on compliant hosts. Because the verdict is emitted as a typed flow output, a parent compliance flow can assert on it - a non-compliant host can block a deployment instead of sitting in a report nobody reads.

    ## Prerequisites
    - A Windows Kestra worker with the Process task runner available, since the audit must read the host's own hotfix history and registry and the default Docker runner cannot see them.
    - PowerShell 5.1 or pwsh with permission to read `Get-HotFix` and the Component Based Servicing and Windows Update registry keys and to trigger a Windows Update detection scan (`UsoClient`/`wuauclt` or the Windows Update COM API), plus a Slack incoming webhook stored as the `SLACK_WEBHOOK_URL` secret.
    - Note that `Get-HotFix` rows without an `InstalledOn` date are ignored for aging on purpose - the audit ages only dated records and reports `no-hotfix-records` when none are dated.

    ### Secrets
    - `SLACK_WEBHOOK_URL`: Slack incoming webhook used by the non-compliance alert and by the on-error handler.

    ## Quick start
    1. Add the `SLACK_WEBHOOK_URL` secret to the namespace and deploy the flow on a Windows worker.
    2. Run it manually with the default 30 day threshold and inspect the verdict, the reasons and `patch_state.json` in the outputs tab.
    3. Leave `remediate` on so stale hosts trigger their own update scan, and set `remediateReboot` to true only for a run where a reboot is acceptable - for example inside your change window.
    4. Set `maxPatchAgeDays` to 0 once to watch the stale-patch path fire end to end through Slack and the update-scan remediation.
    5. Leave the weekly schedule at Monday 05:00 or align it with your patch Tuesday, then extend the collector to fan out over a host list.

    ## How to extend
    - Fan the audit out over a fleet by wrapping the collector in `io.kestra.plugin.core.flow.Loop` over a CMDB host list and targeting each host over WinRM.
    - Add a second threshold for security-only updates by filtering `Get-HotFix` on `Description` before aging the newest record.
    - Escalate a non-compliant host to ServiceNow or Jira with the existing plugin tasks instead of Slack.
    - Assert on the emitted `verdict` output from a parent compliance flow so a stale host blocks a deployment pipeline.
    - Pair the reboot action with your maintenance-window calendar by driving `remediateReboot` from a schedule input instead of a manual flag.

    ## Links
    - PowerShell script task: https://kestra.io/plugins/plugin-script-powershell
    - Get-HotFix: https://learn.microsoft.com/powershell/module/microsoft.windows.management.commands/get-hotfix
    - Component Based Servicing reboot pending: https://learn.microsoft.com/windows-hardware/manufacture/component-based-servicing-reference
    - Schedule trigger: https://kestra.io/plugins/core/trigger/io.kestra.plugin.core.trigger.schedule
  tags:
    - Infrastructure
    - System
  subTags:
    - Policy & Compliance
    - Day 2 Operations
  ee: false
  demo: false
