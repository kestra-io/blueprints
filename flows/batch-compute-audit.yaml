id: batch-compute-audit
namespace: company.finops

description: |
  Audits AWS Batch compute environments for orphaned capacity: environments in
  VALID state whose job queues have zero submitted, pending, or running jobs.
  Flags environments nobody schedules against so they can be disabled or deleted.

inputs:
  - id: aws_regions
    type: ARRAY
    itemType: STRING
    defaults: ["us-east-1"]
    description: AWS regions to audit for orphaned Batch compute environments.

tasks:
  - id: check_envs
    type: io.kestra.plugin.core.flow.ForEach
    description: Audit Batch compute environments region by region.
    values: "{{ inputs.aws_regions }}"
    tasks:
      - id: audit_region
        type: io.kestra.plugin.aws.cli.AwsCLI
        description: List compute environments, check job queues and active job counts per environment.
        commands:
          - |
            REGION="{{ taskrun.value }}"
            echo "Checking Batch compute environments in $REGION"
            ORPHAN_LIST=""
            aws batch describe-compute-environments --region "$REGION" \
              --query 'computeEnvironments[?state==`ENABLED` && status==`VALID`].[computeEnvironmentName,computeEnvironmentArn,type]' \
              --output json > /tmp/ces.json
            COUNT=$(python3 -c "import json;print(len(json.load(open('/tmp/ces.json'))))")
            echo "enabled+valid compute environments: $COUNT"
            while IFS= read -r line; do
              CE=$(echo "$line" | python3 -c "import json,sys;print(json.load(sys.stdin)[0])")
              ARN=$(echo "$line" | python3 -c "import json,sys;print(json.load(sys.stdin)[1])")
              CETYPE=$(echo "$line" | python3 -c "import json,sys;print(json.load(sys.stdin)[2])")
              QUEUES=$(aws batch describe-job-queues --region "$REGION" \
                --query "jobQueues[?state==\`ENABLED\` && contains(computeEnvironmentOrder[].computeEnvironment, '$ARN')].jobQueueName" \
                --output text)
              JOBS=0
              for Q in $QUEUES; do
                for S in SUBMITTED PENDING RUNNABLE STARTING RUNNING; do
                  N=$(aws batch list-jobs --region "$REGION" --job-queue "$Q" --job-status "$S" \
                    --query 'length(jobSummaryList)' --output text 2>/dev/null)
                  case "$N" in ''|'None') N=0;; esac
                  JOBS=$((JOBS + N))
                done
              done
              if [ -z "$QUEUES" ]; then
                ORPHAN_LIST="${ORPHAN_LIST}${CE} (${CETYPE}: no enabled job queues attached), "
              elif [ "$JOBS" -eq 0 ]; then
                ORPHAN_LIST="${ORPHAN_LIST}${CE} (${CETYPE}: queues [$QUEUES] have zero active jobs), "
              fi
            done < <(python3 -c "import json;[print(json.dumps(c)) for c in json.load(open('/tmp/ces.json'))]")
            if [ -n "$ORPHAN_LIST" ]; then HAS_ORPHANS=true; else HAS_ORPHANS=false; fi
            echo "HAS_ORPHANS=$HAS_ORPHANS"
            echo "ORPHAN_ENVS=$ORPHAN_LIST"
            echo "REGION_DONE=$REGION"
        env:
          AWS_ACCESS_KEY_ID: "{{ secret('AWS_ACCESS_KEY_ID') }}"
          AWS_SECRET_ACCESS_KEY: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
          AWS_DEFAULT_REGION: "{{ taskrun.value }}"
      - id: notify_region
        type: io.kestra.plugin.core.flow.If
        description: Report orphaned environments, stay quiet when Batch is busy.
        condition: "{{ outputs.audit_region.vars.HAS_ORPHANS == 'true' }}"
        then:
          - id: slack_orphans
            type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
            url: "{{ secret('SLACK_WEBHOOK_URL') }}"
            payload: |
              {
                "text": ":package: Batch audit `{{ outputs.audit_region.vars.REGION_DONE }}` — compute environments with zero active jobs:\n`{{ outputs.audit_region.vars.ORPHAN_ENVS }}`\nDisable or delete the ones no pipeline submits to anymore (check job definitions referencing them first)."
              }
        else:
          - id: log_clean
            type: io.kestra.plugin.core.log.Log
            message: "All Batch compute environments in {{ outputs.audit_region.vars.REGION_DONE }} have active jobs or queues."

triggers:
  - id: weekly
    type: io.kestra.plugin.core.trigger.Schedule
    description: Weekly on Sunday at 02:00 UTC. Shipped disabled; enable after your first manual run.
    cron: "0 2 * * 0"
    disabled: true

extend:
  title: Batch Compute Audit
  metaTitle: Audit Orphaned AWS Batch Compute Environments | Kestra
  shortDescription: Audit Batch compute environments across regions for zero active jobs across their queues, and get a Slack report of orphaned capacity.
  metaDescription: Orphaned Batch compute environments hold capacity nobody uses. This flow finds them and reports weekly.
  description: |
    AWS Batch compute environments are easy to leave behind: a pipeline migrates, a project ends, and the environment stays ENABLED and VALID with job queues nobody submits to. Managed environments scale to zero, but unmanaged ones and their queues are clutter — and Fargate Batch environments still carry configuration risk. This blueprint finds environments with no active work.

    ## How it works

    1. A Schedule trigger fires weekly on Sunday at 02:00 UTC (shipped disabled).
    2. A ForEach loop audits each region in `aws_regions`.
    3. Per region, the flow lists ENABLED and VALID compute environments.
    4. For each environment it finds attached enabled job queues, then counts jobs in SUBMITTED, PENDING, RUNNABLE, STARTING, and RUNNING states across them.
    5. Environments with no queues — or queues with zero active jobs — are flagged, and an `If` task posts a Slack report.

    ## What you get

    - A weekly list of orphaned compute environments, distinguishing "no queues attached" from "queues exist but idle."
    - The queue names per environment, so ownership is easy to trace.
    - Silence when Batch is actually busy.

    ## Who it's for

    Data and ML platform teams running batch workloads whose pipelines have been migrated or retired over time.

    ## Why orchestrate this with Kestra

    Batch environments accumulate silently across regions. As a scheduled flow the audit is automatic, the definition of "active" is explicit in the script, and the report creates a regular decommission review.

    ## Prerequisites

    - AWS credentials with `batch:DescribeComputeEnvironments`, `batch:DescribeJobQueues`, and `batch:ListJobs`.
    - A Slack incoming webhook URL.

    ### Secrets

    - `AWS_ACCESS_KEY_ID`: AWS access key for the Batch API calls.
    - `AWS_SECRET_ACCESS_KEY`: AWS secret key for the Batch API calls.
    - `SLACK_WEBHOOK_URL`: Incoming webhook URL for the orphan report.

    ## Quick start

    1. Add the three secrets above to your Kestra namespace.
    2. Set `aws_regions` to your Batch regions.
    3. Run manually once and confirm orphaned environments with pipeline owners.
    4. Enable the weekly schedule trigger.

    ## How to extend

    - Also audit job definitions with zero jobs submitted in 90 days.
    - Auto-disable (not delete) orphaned environments behind an opt-in gate.
    - Add Fargate vs EC2 type breakdown to prioritize unmanaged environments.

    ## Links

    - [Kestra AWS plugins](https://kestra.io/plugins)
    - [Kestra Slack plugins](https://kestra.io/plugins)
    - [AWS Batch pricing](https://aws.amazon.com/batch/pricing/)
    - [Batch describe-compute-environments API](https://docs.aws.amazon.com/cli/latest/reference/batch/describe-compute-environments.html)
  tags:
    - Infrastructure
  subTags:
    - FinOps & Cost Management
    - Day 2 Operations
  ee: false
  demo: false
