id: toxiproxy-dependency-resilience-gate
namespace: company.team
description: |
  Before a release leaves staging, inject real network faults with Toxiproxy between
  the service and one of its dependencies (slow responses, a dependency that hangs,
  dropped connections), probe the service under each fault, and block the release if
  it does not stay within its latency and error budget. Faults are always removed,
  even when a probe or the gate fails.

inputs:
  - id: toxiproxy_api
    type: STRING
    defaults: "http://toxiproxy.staging.internal:8474"
    displayName: "Toxiproxy API"
    description: "Toxiproxy control API reachable from the worker. Only point this at a staging Toxiproxy."
  - id: proxy_name
    type: STRING
    defaults: "inventory"
    displayName: "Proxy Name"
    description: "Toxiproxy proxy that sits between the service and the dependency."
  - id: proxy_listen
    type: STRING
    defaults: "0.0.0.0:18080"
    displayName: "Proxy Listen Address"
    description: "Address the service already uses to reach the dependency through Toxiproxy."
  - id: dependency_upstream
    type: STRING
    defaults: "inventory.staging.internal:8080"
    displayName: "Dependency Upstream"
    description: "Real host:port of the dependency behind the proxy."
  - id: probe_url
    type: STRING
    defaults: "https://staging.example.com/catalog"
    displayName: "Probe URL"
    description: "Service endpoint that calls the dependency. The gate measures this endpoint under each fault."
  - id: probes
    type: INT
    defaults: 10
    displayName: "Probes Per Scenario"
    description: "Requests sent to the probe URL for the baseline and for each fault scenario."
  - id: scenarios
    type: JSON
    displayName: "Fault Scenarios"
    description: "One Toxiproxy toxic per scenario (`stream` defaults to downstream), with the budget the service must meet while it is active."
    defaults: |
      [
        {"name": "slow_dependency", "type": "latency", "attributes": {"latency": 1500, "jitter": 200}, "max_p95_ms": 1500, "max_error_rate": 0.0},
        {"name": "dependency_hangs", "type": "timeout", "stream": "upstream", "attributes": {"timeout": 0}, "max_p95_ms": 1500, "max_error_rate": 0.0},
        {"name": "connection_reset", "type": "reset_peer", "attributes": {"timeout": 0}, "max_p95_ms": 1500, "max_error_rate": 0.0}
      ]

triggers:
  - id: after_staging_deploy
    type: io.kestra.plugin.core.trigger.Flow
    description: Run the gate every time the staging deploy flow succeeds. Shipped disabled; point it at your own deploy flow and enable it after a manual run.
    disabled: true
    dependsOn:
      - namespace: company.team
        flowId: deploy_staging
        states: [SUCCESS]

tasks:
  - id: setup_proxy
    type: io.kestra.plugin.core.http.Request
    description: Create or update the proxy between the service and the dependency (Toxiproxy `/populate` is idempotent) and make sure no fault is left over from an earlier run.
    uri: "{{ inputs.toxiproxy_api }}/populate"
    method: POST
    contentType: application/json
    body: '[{"name": "{{ inputs.proxy_name }}", "listen": "{{ inputs.proxy_listen }}", "upstream": "{{ inputs.dependency_upstream }}", "enabled": true}]'

  - id: clear_faults
    type: io.kestra.plugin.core.http.Request
    description: Remove every toxic and re-enable all proxies before measuring the baseline.
    uri: "{{ inputs.toxiproxy_api }}/reset"
    method: POST

  - id: baseline
    type: io.kestra.plugin.scripts.python.Script
    description: Probe the service with the dependency healthy, as the reference for the fault scenarios.
    containerImage: python:3.12-slim
    script: &probe |
      import json, time, urllib.error, urllib.request

      url, count = "{{ inputs.probe_url }}", int("{{ inputs.probes }}")
      latencies, errors, degraded = [], 0, 0
      for _ in range(count):
          started = time.time()
          try:
              with urllib.request.urlopen(url, timeout=15) as resp:
                  body = resp.read()
                  if resp.status >= 500:
                      errors += 1
                  elif b'"degraded": true' in body or b'"degraded":true' in body:
                      degraded += 1
          except urllib.error.HTTPError as e:
              errors += 1 if e.code >= 500 else 0
          except Exception:
              errors += 1
          latencies.append((time.time() - started) * 1000)
      latencies.sort()
      p95 = latencies[min(len(latencies) - 1, int(round(0.95 * len(latencies))) - 1)]
      print("::" + json.dumps({"outputs": {
          "p95_ms": round(p95), "max_ms": round(latencies[-1]), "error_rate": round(errors / count, 3),
          "errors": errors, "degraded": degraded, "probes": count,
      }}) + "::")

  - id: each_scenario
    type: io.kestra.plugin.core.flow.Loop
    description: Run the fault scenarios one at a time (they share the proxy), each with its own budget.
    values: "{{ inputs.scenarios | toJson }}"
    concurrencyLimit: 1
    outputs:
      - id: name
        type: STRING
        value: "{{ fromJson(item.value).name }}"
      - id: p95_ms
        type: INT
        value: "{{ outputs.probe.vars.p95_ms }}"
      - id: error_rate
        type: FLOAT
        value: "{{ outputs.probe.vars.error_rate }}"
      - id: degraded
        type: INT
        value: "{{ outputs.probe.vars.degraded }}"
      - id: passed
        type: BOOL
        value: "{{ outputs.probe.vars.p95_ms <= fromJson(item.value).max_p95_ms and outputs.probe.vars.error_rate <= fromJson(item.value).max_error_rate }}"
    tasks:
      - id: inject_fault
        type: io.kestra.plugin.core.http.Request
        description: Add the scenario's toxic to the proxy.
        uri: "{{ inputs.toxiproxy_api }}/proxies/{{ inputs.proxy_name }}/toxics"
        method: POST
        contentType: application/json
        body: '{"name": "{{ fromJson(item.value).name }}", "type": "{{ fromJson(item.value).type }}", "stream": "{{ fromJson(item.value).stream ?? ''downstream'' }}", "toxicity": 1.0, "attributes": {{ fromJson(item.value).attributes | toJson }}}'

      - id: probe
        type: io.kestra.plugin.scripts.python.Script
        description: Probe the service while the fault is active.
        containerImage: python:3.12-slim
        script: *probe

      - id: remove_fault
        type: io.kestra.plugin.core.http.Request
        description: Remove the toxic before the next scenario.
        uri: "{{ inputs.toxiproxy_api }}/proxies/{{ inputs.proxy_name }}/toxics/{{ fromJson(item.value).name }}"
        method: DELETE

      - id: log_scenario
        type: io.kestra.plugin.core.log.Log
        message: "{{ fromJson(item.value).name }} ({{ fromJson(item.value).type }}): p95 {{ outputs.probe.vars.p95_ms }} ms (budget {{ fromJson(item.value).max_p95_ms }} ms), error rate {{ outputs.probe.vars.error_rate }} (budget {{ fromJson(item.value).max_error_rate }}), {{ outputs.probe.vars.degraded }}/{{ outputs.probe.vars.probes }} served degraded."

  - id: gate
    type: io.kestra.plugin.core.flow.If
    description: Block the release when any scenario broke its budget.
    condition: "{{ outputs.each_scenario.outputs | toJson | jq('[.[].outputs.passed] | all') | first }}"
    then:
      - id: log_pass
        type: io.kestra.plugin.core.log.Log
        message: "Resilience gate passed for {{ inputs.probe_url }}: baseline p95 {{ outputs.baseline.vars.p95_ms }} ms; {{ outputs.each_scenario.outputs | toJson | jq('[.[].outputs | \"\\(.name) p95 \\(.p95_ms) ms\"] | join(\", \")') | first }}."
    else:
      - id: block_release
        type: io.kestra.plugin.core.execution.Fail
        errorMessage: "Release blocked: {{ inputs.probe_url }} broke its budget under {{ outputs.each_scenario.outputs | toJson | jq('[.[].outputs | select(.passed | not) | \"\\(.name) (p95 \\(.p95_ms) ms, error rate \\(.error_rate))\"] | join(\", \")') | first }}."

finally:
  - id: always_clean_up
    type: io.kestra.plugin.core.http.Request
    description: Remove every toxic, even if a probe or the gate failed, so staging is never left degraded.
    uri: "{{ inputs.toxiproxy_api }}/reset"
    method: POST

outputs:
  - id: baseline_p95_ms
    type: INT
    value: "{{ outputs.baseline.vars.p95_ms }}"

extend:
  title: "Toxiproxy Dependency Resilience Release Gate"
  shortDescription: Inject real network faults between a staging service and its dependency with Toxiproxy, measure the service under each fault, and block the release when it breaks its latency or error budget.
  metaTitle: Toxiproxy Resilience Release Gate | Kestra
  metaDescription: "Inject latency, hangs and resets with Toxiproxy on staging, measure your service under each fault, and block releases that don't degrade gracefully."
  description: |
    Most outages start with a dependency that gets slow, hangs or drops connections, and the service in front of it either degrades gracefully (short timeouts, a cached fallback) or falls over with it. That behaviour is rarely tested before a release. This blueprint makes it a release gate: after every staging deploy it uses [Toxiproxy](https://github.com/Shopify/toxiproxy) to inject real network faults between the service and one dependency, probes the service under each fault, compares the results with a per-scenario latency and error budget, and blocks the release when the service does not hold up. The faults are always removed, even if a probe or the gate fails.

    ## How it works

    1. `after_staging_deploy` (`io.kestra.plugin.core.trigger.Flow`) starts the gate when `deploy_staging` succeeds. It ships `disabled: true`.
    2. `setup_proxy` (`io.kestra.plugin.core.http.Request`) creates or updates the proxy with Toxiproxy's idempotent `/populate` endpoint, and `clear_faults` calls `/reset` so nothing is left over from an earlier run.
    3. `baseline` (`io.kestra.plugin.scripts.python.Script`) probes the service with the dependency healthy and reports p95 latency, error rate and how many answers were served degraded.
    4. `each_scenario` (`io.kestra.plugin.core.flow.Loop`, one scenario at a time because they share the proxy) adds the scenario's toxic, probes the service, removes the toxic and logs the result against the scenario's budget. Each iteration exposes `name`, `p95_ms`, `error_rate`, `degraded` and `passed` as Loop outputs.
    5. `gate` (`io.kestra.plugin.core.flow.If`) passes when every scenario met its budget and logs a summary; otherwise `block_release` (`io.kestra.plugin.core.execution.Fail`) fails the execution and names each scenario that broke its budget.
    6. `always_clean_up` in the flow's `finally` block calls `/reset` whatever happened, so staging is never left degraded.

    ## What you get

    - A release gate that checks timeouts, fallbacks and retries under real faults, not only the happy path.
    - Per-scenario numbers (p95 latency, error rate, degraded answers) in the logs and as Loop outputs.
    - A failed execution that names the scenarios the service could not survive.
    - A clean staging environment after every run, success or failure.

    ## Who it's for

    - Platform and SRE teams that want resilience checks in the release path, not only in occasional game days.
    - Service owners who want proof that their timeouts and fallbacks work before production finds out.

    ## Why orchestrate this with Kestra

    Fault injection is only safe when the cleanup is guaranteed and the result decides something. Kestra ties the gate to the real deploy with a Flow trigger, runs the scenarios in order with `Loop`, turns the measurements into a release decision with `If` and `Fail`, and its `finally` block removes the faults even when a probe crashes or the gate fails.

    ## Prerequisites

    - A Toxiproxy server in staging, with the service already reaching the dependency through the proxy's listen address, and its API (port 8474 by default) reachable from the worker. Never point it at production.
    - A service endpoint that calls the dependency, to use as `probe_url`.
    - A Kestra worker that can run containers (Docker or Kubernetes task runner) and pull `python:3.12-slim`.

    ### Secrets

    - None by default. If the Toxiproxy API or the probe URL sits behind authentication, add the header from a secret, for example `STAGING_TOKEN`.

    ## Quick start

    1. Set `toxiproxy_api`, `proxy_name`, `proxy_listen`, `dependency_upstream` and `probe_url` for your staging environment.
    2. Adjust `scenarios`: each one is a Toxiproxy toxic (`type`, `attributes`, optional `stream`) with a `max_p95_ms` and `max_error_rate` budget.
    3. Execute the flow and read `log_scenario` for each fault, then the gate result.
    4. Point `after_staging_deploy` at your deploy flow and enable it.

    ## How to extend

    - Add more toxics (`bandwidth`, `slow_close`, `limit_data`) or run the gate against several dependencies with one proxy each.
    - Send the per-scenario results to a dashboard to track resilience across releases.
    - Ask for an approval with `io.kestra.plugin.core.flow.Pause` instead of failing, for teams that accept known gaps.
    - Notify the owning team from the `else` branch with the failing scenarios.

    ## Links

    - [Toxiproxy](https://github.com/Shopify/toxiproxy)
    - [Toxiproxy toxics](https://github.com/Shopify/toxiproxy#toxics)
    - [Kestra Loop task](https://kestra.io/plugins/core/tasks/flow/io.kestra.plugin.core.flow.loop)
    - [Kestra HTTP Request task](https://kestra.io/plugins/core/tasks/http/io.kestra.plugin.core.http.request)
    - [Kestra Flow trigger](https://kestra.io/plugins/core/triggers/io.kestra.plugin.core.trigger.flow)
  tags:
    - Infrastructure
  subTags:
    - CI/CD & Deployment
    - Testing & Quality
  ee: false
  demo: false
