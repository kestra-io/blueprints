id: duckdb-bill-of-materials-explosion
namespace: company.data

inputs:
  - id: batch
    type: FILE
    description: JSON object with parts (string IDs), components (parent, component, units) and orders (order_id, product, quantity). Quantities are positive integers.

tasks:
  - id: source_size
    type: io.kestra.plugin.core.storage.Size
    uri: "{{ inputs.batch }}"

  - id: bound_source
    type: io.kestra.plugin.core.execution.Assert
    conditions:
      - "{{ outputs.source_size.size > 0 and outputs.source_size.size <= 1048576 }}"

  - id: normalize
    type: io.kestra.plugin.jdbc.duckdb.Queries
    inputFiles:
      batch.json: "{{ inputs.batch }}"
    outputFiles:
      - parts.parquet
      - components.parquet
      - orders.parquet
    sql: |
      CREATE TABLE checks (ok BOOLEAN NOT NULL CHECK (ok));
      CREATE TABLE payload AS
      SELECT CAST(content AS JSON) AS doc FROM read_text('{{ workingDir }}/batch.json');
      INSERT INTO checks SELECT json_type(doc) = 'OBJECT' FROM payload;
      INSERT INTO checks SELECT json_type(doc, '$.parts') = 'ARRAY' FROM payload;
      INSERT INTO checks SELECT json_type(doc, '$.components') = 'ARRAY' FROM payload;
      INSERT INTO checks SELECT json_type(doc, '$.orders') = 'ARRAY' FROM payload;
      CREATE TABLE parts (
        part_id VARCHAR PRIMARY KEY CHECK (length(trim(part_id)) BETWEEN 1 AND 128),
        kind VARCHAR NOT NULL CHECK (kind = 'VARCHAR')
      );
      INSERT INTO parts
      SELECT json_extract_string(value, '$'), type FROM payload, json_each(doc, '$.parts');
      INSERT INTO checks SELECT count(*) BETWEEN 1 AND 50 FROM parts;
      CREATE TABLE raw_edges AS SELECT value FROM payload, json_each(doc, '$.components');
      INSERT INTO checks SELECT count(*) <= 100 FROM raw_edges;
      INSERT INTO checks SELECT COALESCE(bool_and(
        json_type(value) = 'OBJECT' AND json_type(value, '$.parent') = 'VARCHAR'
        AND json_type(value, '$.component') = 'VARCHAR'
        AND json_type(value, '$.units') IN ('UBIGINT', 'BIGINT')), true) FROM raw_edges;
      CREATE TABLE components (
        parent VARCHAR NOT NULL REFERENCES parts(part_id),
        component VARCHAR NOT NULL REFERENCES parts(part_id),
        units BIGINT NOT NULL CHECK (units BETWEEN 1 AND 100),
        PRIMARY KEY (parent, component)
      );
      INSERT INTO components SELECT value->>'parent', value->>'component',
        CAST(value->>'units' AS BIGINT) FROM raw_edges;
      INSERT INTO checks SELECT COALESCE(max(n), 0) <= 3
        FROM (SELECT count(*) AS n FROM components GROUP BY parent);
      CREATE TABLE raw_orders AS SELECT value FROM payload, json_each(doc, '$.orders');
      INSERT INTO checks SELECT count(*) BETWEEN 1 AND 20 FROM raw_orders;
      INSERT INTO checks SELECT COALESCE(bool_and(
        json_type(value) = 'OBJECT' AND json_type(value, '$.order_id') = 'VARCHAR'
        AND json_type(value, '$.product') = 'VARCHAR'
        AND json_type(value, '$.quantity') IN ('UBIGINT', 'BIGINT')), false) FROM raw_orders;
      CREATE TABLE orders (
        order_id VARCHAR PRIMARY KEY CHECK (length(trim(order_id)) BETWEEN 1 AND 128),
        product VARCHAR NOT NULL REFERENCES parts(part_id),
        quantity BIGINT NOT NULL CHECK (quantity BETWEEN 1 AND 1000000)
      );
      INSERT INTO orders SELECT value->>'order_id', value->>'product',
        CAST(value->>'quantity' AS BIGINT) FROM raw_orders;
      COPY parts TO '{{ outputFiles['parts.parquet'] }}' (FORMAT PARQUET);
      COPY components TO '{{ outputFiles['components.parquet'] }}' (FORMAT PARQUET);
      COPY orders TO '{{ outputFiles['orders.parquet'] }}' (FORMAT PARQUET);

  - id: validate_topology
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: Reject cycles anywhere in the supplied catalog and paths longer than eight edges before multiplying quantities.
    inputFiles:
      components.parquet: "{{ outputs.normalize.outputFiles['components.parquet'] }}"
      parts.parquet: "{{ outputs.normalize.outputFiles['parts.parquet'] }}"
    outputFiles:
      - approved-components.parquet
    sql: |
      CREATE TABLE edges AS SELECT * FROM read_parquet('{{ workingDir }}/components.parquet');
      CREATE TABLE parts AS SELECT * FROM read_parquet('{{ workingDir }}/parts.parquet');
      CREATE TABLE checks (ok BOOLEAN NOT NULL CHECK (ok));
      -- UNION deduplicates reachable pairs, so a cycle cannot make this recursion infinite.
      INSERT INTO checks
      WITH RECURSIVE reach(start, node) AS (
        SELECT parent, component FROM edges
        UNION
        SELECT r.start, e.component FROM reach r JOIN edges e ON r.node = e.parent
      ) SELECT count(*) = 0 FROM reach WHERE start = node;
      INSERT INTO checks
      WITH RECURSIVE depths(node, depth) AS (
        SELECT part_id, 0 FROM parts
        UNION
        SELECT e.component, d.depth + 1 FROM depths d JOIN edges e ON d.node = e.parent
        WHERE d.depth < 9
      ) SELECT max(depth) <= 8 FROM depths;
      COPY edges TO '{{ outputFiles['approved-components.parquet'] }}' (FORMAT PARQUET);

  - id: explode
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: Keep every assembly path, then sum shared leaf components per order using exact integer decimals.
    inputFiles:
      components.parquet: "{{ outputs.validate_topology.outputFiles['approved-components.parquet'] }}"
      orders.parquet: "{{ outputs.normalize.outputFiles['orders.parquet'] }}"
    outputFiles:
      - demand.parquet
    sql: |
      CREATE TABLE edges AS SELECT * FROM read_parquet('{{ workingDir }}/components.parquet');
      CREATE TABLE orders AS SELECT * FROM read_parquet('{{ workingDir }}/orders.parquet');
      CREATE TABLE demand AS
      WITH RECURSIVE walk(order_id, part_id, required_units, depth) AS (
        SELECT order_id, product, CAST(quantity AS DECIMAL(38,0)), 0 FROM orders
        UNION ALL
        SELECT w.order_id, e.component,
          CAST(w.required_units * e.units AS DECIMAL(38,0)), w.depth + 1
        FROM walk w JOIN edges e ON w.part_id = e.parent WHERE w.depth < 8
      )
      SELECT order_id, part_id, CAST(sum(required_units) AS DECIMAL(38,0)) AS required_units
      FROM walk w WHERE NOT EXISTS (SELECT 1 FROM edges e WHERE e.parent = w.part_id)
      GROUP BY order_id, part_id;
      CREATE TABLE checks (ok BOOLEAN NOT NULL CHECK (ok));
      INSERT INTO checks SELECT count(DISTINCT order_id) = (SELECT count(*) FROM orders) FROM demand;
      INSERT INTO checks SELECT bool_and(required_units > 0) FROM demand;
      COPY demand TO '{{ outputFiles['demand.parquet'] }}' (FORMAT PARQUET);

  - id: export_reports
    type: io.kestra.plugin.core.flow.Parallel
    tasks:
      - id: order_report
        type: io.kestra.plugin.jdbc.duckdb.Queries
        inputFiles:
          demand.parquet: "{{ outputs.explode.outputFiles['demand.parquet'] }}"
        outputFiles:
          - order-demand.csv
        sql: |
          COPY (SELECT * FROM read_parquet('{{ workingDir }}/demand.parquet') ORDER BY order_id, part_id)
          TO '{{ outputFiles['order-demand.csv'] }}' (FORMAT CSV, HEADER true);

      - id: purchasing_report
        type: io.kestra.plugin.jdbc.duckdb.Queries
        inputFiles:
          demand.parquet: "{{ outputs.explode.outputFiles['demand.parquet'] }}"
        outputFiles:
          - purchasing-demand.csv
        sql: |
          COPY (SELECT part_id, CAST(sum(required_units) AS DECIMAL(38,0)) AS required_units,
            count(*) AS order_count FROM read_parquet('{{ workingDir }}/demand.parquet')
            GROUP BY part_id ORDER BY part_id)
          TO '{{ outputFiles['purchasing-demand.csv'] }}' (FORMAT CSV, HEADER true);

outputs:
  - id: demand
    type: FILE
    required: false
    value: "{{ outputs.explode.outputFiles['demand.parquet'] ?? null }}"
  - id: by_order
    type: FILE
    required: false
    value: "{{ outputs.order_report.outputFiles['order-demand.csv'] ?? null }}"
  - id: purchasing
    type: FILE
    required: false
    value: "{{ outputs.purchasing_report.outputFiles['purchasing-demand.csv'] ?? null }}"

triggers:
  - id: batch_ready
    type: io.kestra.plugin.core.trigger.Webhook
    key: "{{ secret('BOM_WEBHOOK_KEY') }}"
    inputs:
      batch: "{{ trigger.body.batch }}"

extend:
  title: Explode a bill of materials into component demand with DuckDB
  metaTitle: DuckDB Bill of Materials Explosion | Kestra
  shortDescription: Calculate exact leaf-component demand across nested assemblies and multiple orders, with cycle and depth checks before expansion.
  metaDescription: Turn a bounded bill of materials and production orders into exact component requirements with DuckDB, cycle checks and purchasing CSV reports.
  description: |
    Calculate purchased-part requirements from nested assemblies without counting a shared component only once. This flow expands every assembly path and adds its quantity contribution to the relevant order.

    ## How it works

    1. Submit a JSON file manually or send its Kestra storage URI as `batch` to the keyed webhook.
    2. Bound the file to 1 MiB. Native DuckDB tasks validate IDs, references, unique edges and positive integer quantities, then save typed Parquet checkpoints.
    3. Reject cycles across the entire catalog, including unused assemblies. Reject paths longer than eight edges before expansion.
    4. Multiply quantities along every path using DECIMAL(38,0), aggregate terminal parts per order, and export order and purchasing reports in parallel.

    ## What you get

    - Typed demand Parquet, order-detail CSV and aggregated purchasing CSV with order counts.
    - Shared subassemblies contribute through every path. An ordered terminal part contributes its order quantity directly.
    - Limits: 50 parts, 100 edges, three children per assembly, 20 orders, eight edges per path, 100 units per edge and 1,000,000 units per order. These bound expansion and keep arithmetic exact.

    ## Who it's for

    Data engineers preparing small manufacturing, kit-assembly or provisioning batches.

    ## Why orchestrate this with Kestra

    Validation, topology checks, expansion and independent exports have separate task histories and inspectable storage artifacts. A failed preflight prevents downstream reports.

    ## Prerequisites

    Install the DuckDB JDBC plugin. Supply `parts` as string IDs, `components` as objects with `parent`, `component`, `units`, and `orders` with `order_id`, `product`, `quantity`. Every referenced part must be listed. A terminal part is any part without children; the catalog must be complete.

    ### Secrets

    - `BOM_WEBHOOK_KEY`: protects event submissions.

    ## Quick start

    1. Configure the secret and import this flow.
    2. Upload `{"parts":["kit","bolt"],"components":[{"parent":"kit","component":"bolt","units":4}],"orders":[{"order_id":"run-1","product":"kit","quantity":3}]}` as `batch`.
    3. Execute and check that both CSVs require 12 bolts. Send a stored file URI through the webhook for subsequent batches.

    ## How to extend

    Join the purchasing report to inventory and lead times. This calculates gross demand; it does not subtract stock, handle substitutions, scrap, fractional units or revisions. Export an immutable catalog revision with each batch.

    ## Links

    - [DuckDB tasks](https://kestra.io/plugins/plugin-jdbc-duckdb)
    - [Recursive CTEs](https://duckdb.org/docs/stable/sql/query_syntax/with)
  tags:
    - Data
  subTags:
    - File & Data Processing Basics
  ee: false
  demo: false
