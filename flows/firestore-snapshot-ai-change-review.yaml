id: firestore-snapshot-ai-change-review
namespace: company.team

inputs:
  - id: repo_url
    type: STRING
    description: HTTPS URL of the repository that the Firestore snapshot flow pushes to.

  - id: branch
    type: STRING
    defaults: main

  - id: snapshot_path
    type: STRING
    defaults: firestore
    description: Folder in the repository that holds the `<collection>.jsonl` snapshot files, searched recursively.

variables:
  # Slack member ID of each collection's owner, mentioned when a change to that collection is rated HIGH.
  owners:
    feature_flags: U0123456789
    settings: U0987654321

tasks:
  - id: workspace
    type: io.kestra.plugin.core.flow.WorkingDirectory
    tasks:
      - id: clone
        type: io.kestra.plugin.git.Clone
        url: "{{ inputs.repo_url }}"
        branch: "{{ inputs.branch }}"
        depth: 100
        username: "{{ secret('GITHUB_USERNAME') }}"
        password: "{{ secret('GITHUB_TOKEN') }}"

      - id: collect_changes
        type: io.kestra.plugin.scripts.python.Script
        description: Compares the snapshot files between the last reviewed commit and HEAD, and lists every document whose data changed.
        containerImage: python:3.12
        beforeCommands:
          - git config --global --add safe.directory '*'
        env:
          SNAPSHOT_PATH: "{{ inputs.snapshot_path }}"
          LAST_SHA: "{{ kv('firestore_review_last_sha', errorOnMissing=false) ?? '' }}"
        script: |
          import json, os, subprocess

          def git(*args):
              return subprocess.run(["git", *args], capture_output=True, text=True)

          def documents(rev, path):
              shown = git("show", f"{rev}:{path}")
              if shown.returncode:
                  return {}
              rows = (json.loads(line) for line in shown.stdout.splitlines() if line.strip())
              return {row["id"]: row["data"] for row in rows}

          head = git("rev-parse", "HEAD").stdout.strip()
          base = os.environ["LAST_SHA"]
          if not base or git("cat-file", "-e", base + "^{commit}").returncode:
              history = git("rev-list", "--max-count=2", "HEAD").stdout.split()
              base = history[1] if len(history) > 1 else ""

          changes = []
          if base and base != head:
              changed = git("diff", "--name-only", base, head, "--", os.environ["SNAPSHOT_PATH"]).stdout.split()
              for path in (p for p in changed if p.endswith(".jsonl")):
                  collection = os.path.basename(path).removesuffix(".jsonl")
                  before, after = documents(base, path), documents(head, path)
                  for doc_id in sorted(before.keys() | after.keys()):
                      if before.get(doc_id) != after.get(doc_id):
                          changes.append({
                              "collection": collection,
                              "document": doc_id,
                              "before": before.get(doc_id),
                              "after": after.get(doc_id),
                          })

          print("::" + json.dumps({"outputs": {"base": base, "head": head, "changes": changes, "count": len(changes)}}) + "::")

  - id: if_changed
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.collect_changes.vars.count > 0 }}"
    then:
      - id: review
        type: io.kestra.plugin.ai.agent.AIAgent
        description: Explains each document change and rates how risky it is for the running app.
        provider:
          type: io.kestra.plugin.ai.provider.GoogleGemini
          apiKey: "{{ secret('GEMINI_API_KEY') }}"
          modelName: gemini-3.5-flash
        systemMessage: |
          You review changes to production configuration stored in Firestore: feature flags, settings and reference data.
          For every change, say in one short sentence what changed, then rate the risk for users of the app:
          - HIGH: a feature exposed to many more users at once, a kill switch or safety limit turned off, a document deleted, prices or quotas changed by a large factor, or credentials and URLs changed.
          - MEDIUM: a gradual rollout step, a new document, or a value change whose effect is unclear.
          - LOW: labels, descriptions or other changes users will not notice.
          Base every rating only on the before and after values you are given. A null "before" means the document was added, a null "after" means it was deleted.
        prompt: |
          Review these Firestore document changes, ordered by collection and document ID:
          {{ outputs.collect_changes.vars.changes | toJson }}
        configuration:
          responseFormat:
            type: JSON
            jsonSchema:
              type: object
              required: [summary, changes]
              properties:
                summary:
                  type: string
                  description: One or two sentences on the overall change set.
                changes:
                  type: array
                  items:
                    type: object
                    required: [collection, document, change, risk, reason]
                    properties:
                      collection:
                        type: string
                      document:
                        type: string
                      change:
                        type: string
                      risk:
                        type: string
                        enum: [HIGH, MEDIUM, LOW]
                      reason:
                        type: string

      - id: notify
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        messageText: |
          *Firestore config changed* ({{ outputs.collect_changes.vars.base | slice(0, 7) }}..{{ outputs.collect_changes.vars.head | slice(0, 7) }} in {{ inputs.repo_url }})
          {{ outputs.review.jsonOutput.summary }}
          {% for c in outputs.review.jsonOutput.changes %}{% set owner = vars.owners[c.collection] ?? '' %}
          • *{{ c.risk }}* `{{ c.collection }}/{{ c.document }}`: {{ c.change }} {{ c.reason }}{% if c.risk == 'HIGH' and owner != '' %} <@{{ owner }}>{% endif %}{% endfor %}

  - id: remember_head
    type: io.kestra.plugin.core.kv.Set
    description: Stores the reviewed commit, so the next run only looks at newer snapshots.
    key: firestore_review_last_sha
    value: "{{ outputs.collect_changes.vars.head }}"

errors:
  - id: alert_on_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    messageText: "Firestore change review failed in {{ flow.namespace }}.{{ flow.id }}, execution {{ execution.id }}."

triggers:
  - id: after_snapshot
    type: io.kestra.plugin.core.trigger.Flow
    inputs:
      repo_url: https://github.com/my-org/firestore-snapshots
    dependsOn:
      - namespace: company.team
        flowId: firestore-collection-git-snapshot
        states: [SUCCESS]

extend:
  title: Review Firestore Config Changes with an AI Agent and Alert Owners in Slack
  metaTitle: AI Review of Firestore Config Changes with Slack Owner Alerts | Kestra
  shortDescription: After each nightly Firestore snapshot, a Gemini agent explains every changed document, rates its risk, and mentions the owner of the collection in Slack when a change is high risk.
  metaDescription: Review Firestore config changes with a Gemini agent after each Git snapshot, rate their risk, and mention collection owners in Slack on high-risk changes.
  description: |
    Feature flags and settings in Firestore are edited straight from the Firebase console, and nobody reads the snapshot diff until something breaks. This flow has a Gemini agent explain and rate every changed document, and mentions the collection's owner in Slack when a change is high risk.

    ## How it works

    1. A `Flow` trigger starts the review each time `firestore-collection-git-snapshot` succeeds.
    2. `Clone` checks out the snapshot repository inside a `WorkingDirectory`.
    3. A Python script compares the snapshot files between the last reviewed commit, kept in the KV store, and `HEAD`, and lists each changed document with its values before and after.
    4. An `If` task stops here when nothing changed.
    5. An `AIAgent` with Google Gemini returns structured JSON: a summary, and per change an explanation, a `HIGH`, `MEDIUM` or `LOW` risk and the reason.
    6. `SlackIncomingWebhook` posts the review and mentions the owner from `vars.owners` next to each `HIGH` change.
    7. `kv.Set` stores the reviewed commit, and the `errors` branch posts to Slack if any step fails.

    ## What you get

    - A plain-language review of every console edit.
    - Owners notified only for risky changes to their own collections.
    - No message on quiet nights, and no change reviewed twice.

    ## Who it's for

    - Product and platform teams that keep feature flags, settings or prices in Firestore.

    ## Why orchestrate this with Kestra

    - The review starts on the snapshot's success event, never on a half-pushed commit.
    - The bookmark only moves after a successful review, so a failed run is retried on the next snapshot.
    - Every review keeps its outputs and token usage in the execution history.

    ## Prerequisites

    - The [Firestore collection snapshot blueprint](https://kestra.io/blueprints/firestore-collection-git-snapshot) running in the same namespace.
    - A Gemini API key from Google AI Studio. The free tier is enough for small collections.
    - A worker that can run Docker containers, for the `python:3.12` image.

    ### Secrets

    - `GITHUB_USERNAME`: Git username that owns the token.
    - `GITHUB_TOKEN`: token with read access to the snapshot repository.
    - `GEMINI_API_KEY`: Google AI Studio API key used by the agent.
    - `SLACK_WEBHOOK`: Slack incoming webhook URL for reviews and failure alerts.

    ## Quick start

    1. Add the four secrets to your namespace.
    2. Set `repo_url` in the trigger inputs to the snapshot repository, and map each collection to its owner's Slack member ID in `variables.owners`.
    3. Execute the flow once by hand to review the latest snapshot commit.
    4. Change a document in the Firebase console and run the snapshot flow. The review follows on its own.

    ## How to extend

    - Open a GitHub issue for every `HIGH` change, assigned to the owner.
    - Give the agent your flag documentation, so it can tell a planned rollout from a mistake.

    ## Links

    - [AIAgent task](https://kestra.io/plugins/plugin-ai/agent/io.kestra.plugin.ai.agent.aiagent)
    - [Google Gemini provider](https://kestra.io/plugins/plugin-ai/provider/io.kestra.plugin.ai.provider.googlegemini)
    - [Git Clone task](https://kestra.io/plugins/plugin-git/io.kestra.plugin.git.clone)
    - [Flow trigger](https://kestra.io/plugins/core/trigger/io.kestra.plugin.core.trigger.flow)
    - [KV store](https://kestra.io/docs/concepts/kv-store)
    - [Slack incoming webhook task](https://kestra.io/plugins/plugin-slack/notifications/io.kestra.plugin.slack.notifications.slackincomingwebhook)
  tags:
    - AI
  subTags:
    - Agents & Structured Output
    - Monitoring & Alerting
  ee: false
  demo: false
