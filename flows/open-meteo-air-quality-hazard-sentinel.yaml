id: open-meteo-air-quality-hazard-sentinel
namespace: company.operations

inputs:
  - id: location_name
    type: STRING
    displayName: Location name
    description: Human-readable identifier for the monitored site, campus, or facility.
    defaults: New Delhi Campus

  - id: latitude
    type: FLOAT
    displayName: Latitude
    description: Geographical latitude coordinate for the monitoring location.
    defaults: 28.6139

  - id: longitude
    type: FLOAT
    displayName: Longitude
    description: Geographical longitude coordinate for the monitoring location.
    defaults: 77.2090

  - id: aqi_alert_threshold
    type: INT
    displayName: US AQI alert threshold
    description: US Air Quality Index threshold that triggers environmental alerts (101 = Unhealthy for Sensitive Groups, 151 = Unhealthy, 201 = Very Unhealthy, 301 = Hazardous).
    defaults: 101

  - id: pm25_who_24h_guideline
    type: FLOAT
    displayName: WHO PM2.5 24h guideline (µg/m³)
    description: World Health Organization 24-hour guideline limit for PM2.5 fine particulate matter (15 µg/m³), evaluated against the rolling 24-hour average.
    defaults: 15.0

  - id: pm25_hourly_screening_limit
    type: FLOAT
    displayName: Hourly PM2.5 screening limit (µg/m³)
    description: Hourly screening threshold used to flag acute short-term particulate spikes. Note that this is an hourly operational screening metric, distinct from the 24-hour average WHO guideline.
    defaults: 35.0

  - id: forecast_days
    type: INT
    displayName: Forecast horizon (days)
    description: Number of forecast days to evaluate from the Open-Meteo Air Quality API.
    defaults: 2

  - id: enable_slack
    type: BOOL
    displayName: Enable Slack notifications
    description: Whether to dispatch alerts to Slack when hazardous thresholds are breached. Requires the SLACK_WEBHOOK_URL secret to be configured in the namespace.
    defaults: false

triggers:
  - id: scheduled_monitor
    type: io.kestra.plugin.core.trigger.Schedule
    description: Evaluates air quality forecasts twice daily at 06:00 and 18:00 UTC before operations shift changes.
    cron: "0 6,18 * * *"

tasks:
  - id: fetch_air_quality
    type: io.kestra.plugin.core.http.Download
    description: Pulls hourly particulate and gaseous pollutant metrics directly from the Open-Meteo Air Quality API (open data under CC BY 4.0, free for non-commercial use up to 10,000 daily calls).
    uri: "https://air-quality-api.open-meteo.com/v1/air-quality?latitude={{ inputs.latitude }}&longitude={{ inputs.longitude }}&hourly=pm10,pm2_5,carbon_monoxide,nitrogen_dioxide,sulphur_dioxide,ozone,us_aqi&timezone=auto&forecast_days={{ inputs.forecast_days }}"

  - id: analyze_air_quality
    type: io.kestra.plugin.jdbc.duckdb.Query
    description: Analyzes hourly air quality records with in-memory DuckDB SQL to compute rolling 24-hour PM2.5 averages, WHO guideline comparisons, and EPA AQI categories.
    inputFiles:
      air_quality.json: "{{ outputs.fetch_air_quality.uri }}"
    fetchType: FETCH_ONE
    sql: |
      WITH unnested AS (
          SELECT
              unnest(hourly.time) AS forecast_time,
              unnest(hourly.pm2_5) AS pm2_5,
              unnest(hourly.pm10) AS pm10,
              unnest(hourly.us_aqi) AS us_aqi,
              unnest(hourly.ozone) AS ozone,
              unnest(hourly.nitrogen_dioxide) AS no2,
              unnest(hourly.carbon_monoxide) AS co
          FROM read_json_auto('{{ workingDir }}/air_quality.json')
      ),
      with_rolling AS (
          SELECT
              forecast_time,
              pm2_5,
              pm10,
              us_aqi,
              ozone,
              no2,
              co,
              round(avg(pm2_5) OVER (
                  ORDER BY forecast_time
                  ROWS BETWEEN 23 PRECEDING AND CURRENT ROW
              ), 1) AS pm2_5_24h_rolling,
              count(*) OVER (
                  ORDER BY forecast_time
                  ROWS BETWEEN 23 PRECEDING AND CURRENT ROW
              ) AS rolling_window_size
          FROM unnested
      )
      SELECT
          count(*) AS total_hours,
          round(avg(pm2_5), 1) AS avg_pm2_5_forecast,
          round(max(pm2_5), 1) AS max_pm2_5_hourly,
          round(max(CASE WHEN rolling_window_size >= 24 THEN pm2_5_24h_rolling ELSE NULL END), 1) AS max_pm2_5_24h_rolling,
          round(avg(pm10), 1) AS avg_pm10_forecast,
          round(max(pm10), 1) AS max_pm10_hourly,
          max(us_aqi) AS max_aqi,
          arg_max(forecast_time, us_aqi) AS peak_aqi_time,
          round(max(ozone), 1) AS max_ozone,
          round(max(no2), 1) AS max_no2,
          count(*) FILTER (WHERE pm2_5 >= {{ inputs.pm25_hourly_screening_limit }}) AS hours_exceeding_pm25_screening,
          count(*) FILTER (WHERE rolling_window_size >= 24 AND pm2_5_24h_rolling >= {{ inputs.pm25_who_24h_guideline }}) AS windows_exceeding_who_24h_limit,
          count(*) FILTER (WHERE us_aqi >= {{ inputs.aqi_alert_threshold }}) AS hours_unhealthy_aqi,
          (
              max(us_aqi) >= {{ inputs.aqi_alert_threshold }} OR
              max(pm2_5) >= {{ inputs.pm25_hourly_screening_limit }} OR
              coalesce(max(CASE WHEN rolling_window_size >= 24 THEN pm2_5_24h_rolling ELSE NULL END), 0.0) >= {{ inputs.pm25_who_24h_guideline }}
          ) AS hazard_detected,
          CASE
              WHEN max(us_aqi) > 300 THEN 'Hazardous'
              WHEN max(us_aqi) > 200 THEN 'Very Unhealthy'
              WHEN max(us_aqi) > 150 THEN 'Unhealthy'
              WHEN max(us_aqi) > 100 THEN 'Unhealthy for Sensitive Groups'
              WHEN max(us_aqi) > 50 THEN 'Moderate'
              ELSE 'Good'
          END AS aqi_category,
          CASE
              WHEN max(pm2_5) >= 75.0 THEN 'PM2.5 (Fine Particulates)'
              WHEN max(pm10) >= 150.0 THEN 'PM10 (Coarse Dust)'
              WHEN max(ozone) >= 180.0 THEN 'Ozone (Ground-Level Smog)'
              WHEN max(no2) >= 200.0 THEN 'Nitrogen Dioxide (Traffic/Combustion)'
              ELSE 'Mixed Ambient Pollutants'
          END AS dominant_hazard_driver
      FROM with_rolling;

  - id: check_hazard_status
    type: io.kestra.plugin.core.flow.If
    description: Assesses if peak forecast AQI, peak hourly PM2.5, or rolling 24-hour PM2.5 breach designated safety thresholds.
    condition: "{{ outputs.analyze_air_quality.row.hazard_detected }}"
    then:
      - id: log_hazard_warning
        type: io.kestra.plugin.core.log.Log
        description: Emits an operational warning when forecast AQI, PM2.5 screening, or rolling 24-hour guidelines are breached.
        level: WARN
        message: |
          ENVIRONMENTAL SCREENING ALERT: {{ inputs.location_name }}
          Hazard Triggers Evaluated: AQI threshold >= {{ inputs.aqi_alert_threshold }} | Hourly PM2.5 limit >= {{ inputs.pm25_hourly_screening_limit }} µg/m³ | WHO 24h limit >= {{ inputs.pm25_who_24h_guideline }} µg/m³.
          Peak US AQI: {{ outputs.analyze_air_quality.row.max_aqi }} ({{ outputs.analyze_air_quality.row.aqi_category }}) expected at {{ outputs.analyze_air_quality.row.peak_aqi_time }}.
          Primary Hazard Driver: {{ outputs.analyze_air_quality.row.dominant_hazard_driver }}.
          Peak Hourly PM2.5: {{ outputs.analyze_air_quality.row.max_pm2_5_hourly }} µg/m³ (Hourly screening limit: {{ inputs.pm25_hourly_screening_limit }} µg/m³).
          Peak 24h Rolling PM2.5: {{ outputs.analyze_air_quality.row.max_pm2_5_24h_rolling }} µg/m³ (WHO 24h guideline: {{ inputs.pm25_who_24h_guideline }} µg/m³).
          Rolling 24h Windows Exceeding WHO Guideline: {{ outputs.analyze_air_quality.row.windows_exceeding_who_24h_limit }}.
          Hours Exceeding PM2.5 Screening Limit: {{ outputs.analyze_air_quality.row.hours_exceeding_pm25_screening }}.
          Hours Exceeding AQI Threshold ({{ inputs.aqi_alert_threshold }}): {{ outputs.analyze_air_quality.row.hours_unhealthy_aqi }} out of {{ outputs.analyze_air_quality.row.total_hours }} forecast hours.
          Advisory Note: Review facility ventilation and outdoor activity plans according to local operational protocols.

      - id: notify_slack_hazard
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches an alert message to Slack when enabled and hazardous thresholds are breached. Requires the SLACK_WEBHOOK_URL secret.
        runIf: "{{ inputs.enable_slack }}"
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "attachments": [
              {
                "color": "#D32F2F",
                "blocks": [
                  {
                    "type": "header",
                    "text": {
                      "type": "plain_text",
                      "text": {{ ("⚠️ Air Quality Alert: " ~ inputs.location_name) | toJson }},
                      "emoji": true
                    }
                  },
                  {
                    "type": "section",
                    "fields": [
                      {
                        "type": "mrkdwn",
                        "text": "*Peak AQI:*\n{{ outputs.analyze_air_quality.row.max_aqi }} ({{ outputs.analyze_air_quality.row.aqi_category }})"
                      },
                      {
                        "type": "mrkdwn",
                        "text": "*Dominant Driver:*\n{{ outputs.analyze_air_quality.row.dominant_hazard_driver }}"
                      },
                      {
                        "type": "mrkdwn",
                        "text": "*Peak 24h Rolling PM2.5:*\n{{ outputs.analyze_air_quality.row.max_pm2_5_24h_rolling }} µg/m³ (WHO limit: {{ inputs.pm25_who_24h_guideline }} µg/m³)"
                      },
                      {
                        "type": "mrkdwn",
                        "text": "*Hours Exceeding AQI Threshold:*\n{{ outputs.analyze_air_quality.row.hours_unhealthy_aqi }} / {{ outputs.analyze_air_quality.row.total_hours }} hrs"
                      }
                    ]
                  },
                  {
                    "type": "context",
                    "elements": [
                      {
                        "type": "mrkdwn",
                        "text": {{ ("📍 Location: " ~ inputs.location_name ~ " | Coordinates: `" ~ inputs.latitude ~ ", " ~ inputs.longitude ~ "` | Peak Time: `" ~ outputs.analyze_air_quality.row.peak_aqi_time ~ "` | Source: Open-Meteo") | toJson }}
                      }
                    ]
                  }
                ]
              }
            ]
          }
    else:
      - id: log_nominal_conditions
        type: io.kestra.plugin.core.log.Log
        description: Emits an informational record when air quality conditions remain below alert limits.
        level: INFO
        message: |
          Air quality screening within acceptable parameters for {{ inputs.location_name }}.
          Peak US AQI: {{ outputs.analyze_air_quality.row.max_aqi }} ({{ outputs.analyze_air_quality.row.aqi_category }}).
          Forecast Average PM2.5: {{ outputs.analyze_air_quality.row.avg_pm2_5_forecast }} µg/m³.
          Peak 24h Rolling PM2.5: {{ outputs.analyze_air_quality.row.max_pm2_5_24h_rolling }} µg/m³ (WHO guideline: {{ inputs.pm25_who_24h_guideline }} µg/m³).
          Peak Hourly PM2.5: {{ outputs.analyze_air_quality.row.max_pm2_5_hourly }} µg/m³ (Screening limit: {{ inputs.pm25_hourly_screening_limit }} µg/m³).

  - id: persist_metrics_snapshot
    type: io.kestra.plugin.core.kv.Set
    description: Persists the latest evaluated site snapshot into Kestra KV store for downstream status queries and state inspection.
    key: "aqi_latest_snapshot_{{ inputs.location_name | slugify }}"
    value:
      location: "{{ inputs.location_name }}"
      latitude: "{{ inputs.latitude }}"
      longitude: "{{ inputs.longitude }}"
      evaluated_at: "{{ now() }}"
      max_aqi: "{{ outputs.analyze_air_quality.row.max_aqi }}"
      aqi_category: "{{ outputs.analyze_air_quality.row.aqi_category }}"
      max_pm2_5_hourly: "{{ outputs.analyze_air_quality.row.max_pm2_5_hourly }}"
      max_pm2_5_24h_rolling: "{{ outputs.analyze_air_quality.row.max_pm2_5_24h_rolling }}"
      windows_exceeding_who_24h_limit: "{{ outputs.analyze_air_quality.row.windows_exceeding_who_24h_limit }}"
      hours_exceeding_pm25_screening: "{{ outputs.analyze_air_quality.row.hours_exceeding_pm25_screening }}"
      hours_unhealthy_aqi: "{{ outputs.analyze_air_quality.row.hours_unhealthy_aqi }}"
      total_hours: "{{ outputs.analyze_air_quality.row.total_hours }}"
      hazard_alerted: "{{ outputs.analyze_air_quality.row.hazard_detected }}"

  - id: summary
    type: io.kestra.plugin.core.log.Log
    description: Produces an audit log confirming workflow completion and snapshot storage.
    level: INFO
    message: "Environmental surveillance cycle completed for {{ inputs.location_name }}. Category: {{ outputs.analyze_air_quality.row.aqi_category }}, Peak AQI: {{ outputs.analyze_air_quality.row.max_aqi }}, Latest snapshot saved to KV store."

outputs:
  - id: peak_aqi
    type: INT
    value: "{{ outputs.analyze_air_quality.row.max_aqi }}"

  - id: aqi_category
    type: STRING
    value: "{{ outputs.analyze_air_quality.row.aqi_category }}"

  - id: max_pm2_5_hourly
    type: FLOAT
    value: "{{ outputs.analyze_air_quality.row.max_pm2_5_hourly }}"

  - id: max_pm2_5_24h_rolling
    type: FLOAT
    value: "{{ outputs.analyze_air_quality.row.max_pm2_5_24h_rolling }}"

  - id: windows_exceeding_who
    type: INT
    value: "{{ outputs.analyze_air_quality.row.windows_exceeding_who_24h_limit }}"

  - id: hazard_alerted
    type: BOOL
    value: "{{ outputs.analyze_air_quality.row.hazard_detected }}"

extend:
  title: Monitor Ambient Air Quality & Particulate Hazards with Open-Meteo, DuckDB and Slack
  metaTitle: Open-Meteo Air Quality & Particulate Hazard Sentinel | Kestra
  shortDescription: Track real-time hourly air quality metrics, particulate matter (PM2.5/PM10), and AQI hazard categories using Open-Meteo and DuckDB with automated Slack alerts.
  metaDescription: Monitor ambient air quality and particulate hazards with Open-Meteo and DuckDB in Kestra. Aggregate WHO threshold breaches and dispatch Slack alerts.
  description: |
    Automated environmental screening workflow that monitors ambient air quality forecasts, fine and coarse
    particulate matter (PM2.5 and PM10), and US Air Quality Index (AQI) categories across corporate campuses,
    manufacturing facilities, or logistics hubs using Open-Meteo open weather data and in-memory DuckDB analytics.

    While other Blueprints (such as `flows/ai-plan-my-day.yaml`) use Open-Meteo's snapshot endpoint for daily
    lifestyle and outfit planning with AI agents, this Blueprint provides an operations-focused analytical pipeline
    dedicated to continuous multi-pollutant vector processing, rolling 24-hour averages, threshold screening,
    and site snapshot persistence.

    ## How it works

    1. `scheduled_monitor` triggers the flow twice daily at 06:00 and 18:00 UTC (aligning with operational
       shift handovers and peak commute intervals) or executes on-demand with custom site coordinates.
    2. `fetch_air_quality` downloads 48 hours of forecast hourly atmospheric pollution data from the
       public Open-Meteo Air Quality API into Kestra internal storage.
    3. `analyze_air_quality` leverages DuckDB to parse the JSON payload in memory, unnesting parallel arrays
       of hourly PM2.5, PM10, Ozone, NO2, and US AQI readings. It computes peak concentrations, a true 24-hour
       rolling average for PM2.5 (compared against the World Health Organization 24-hour guideline of 15 µg/m³),
       hourly screening benchmarks, and standardized US EPA AQI categories.
    4. `check_hazard_status` (If flowable task) branches execution based on whether any environmental hazard
       criteria are breached: peak forecast US AQI reaching or exceeding the alert threshold (default 101),
       peak hourly PM2.5 reaching or exceeding the acute screening limit (default 35.0 µg/m³), or rolling 24-hour
       average PM2.5 reaching or exceeding the WHO 24-hour guideline (default 15.0 µg/m³).
    5. When a hazard is detected, `log_hazard_warning` emits an operational alert at WARN level detailing all
       evaluated thresholds and pollutant concentrations. If the optional `enable_slack` input is enabled,
       `notify_slack_hazard` safely serializes the location name and dispatches a structured Block Kit alert to Slack via incoming webhook.
    6. `persist_metrics_snapshot` records the latest evaluated site snapshot into Kestra's Key-Value store
       (`aqi_latest_snapshot_<slug>`), enabling subsequent runs or status dashboards to inspect the most recent state.
    7. `summary` produces a closing log entry confirming successful snapshot persistence and cycle completion.

    ## What you get

    - Automated operational surveillance of particulate matter (PM2.5, PM10) and gaseous pollutants from open weather models.
    - True 24-hour rolling average calculations for PM2.5 to benchmark against the WHO 24-hour guideline (15 µg/m³),
      distinguished from short-term hourly screening peaks.
    - Standardized US EPA AQI tier categorization (Good, Moderate, Unhealthy for Sensitive Groups, Unhealthy,
      Very Unhealthy, Hazardous).
    - Optional automated notifications to Slack before work shifts begin, safely escaping custom site names.
    - Persistent latest-state snapshots in Kestra's KV store for status queries and operational visibility.

    ## Who it's for

    - Facility & Operations Teams planning outdoor activities, shift schedules, and general site awareness.
    - Environmental Health & Safety (EHS) Coordinators screening forecast air pollution trends.
    - Sustainability & ESG Analysts exploring automated collection of atmospheric open data.
    - Data Engineers orchestrating environmental open data workflows with DuckDB and Kestra.

    ## Why orchestrate this with Kestra

    - **Declarative Simplicity**: Consolidates HTTP ingestion, DuckDB analytical SQL, conditional branching,
      and alerting into a single version-controlled YAML workflow without bespoke Python glue code.
    - **In-Memory Analytical Power**: Employs DuckDB's vectorized JSON unnesting and SQL window functions
      directly inside the execution environment to compute rolling averages efficiently.
    - **Safe Optional Integrations**: Uses Kestra's conditional execution (`runIf`) and secret masking so
      external notifications are cleanly decoupled and optional.
    - **Centralized Observability**: Provides topology maps, execution duration metrics, and structured logs
      out of the box for operational review.

    ## Prerequisites

    - Kestra 2.0 or later with `plugin-jdbc-duckdb` and `plugin-slack` installed.
    - Outbound internet access to Open-Meteo (`https://air-quality-api.open-meteo.com`). Open-Meteo provides
      free access for non-commercial open use (up to 10,000 API calls per day). Atmospheric data is provided
      under the Creative Commons Attribution 4.0 International (CC BY 4.0) license.
    - *Disclaimer*: Model forecasts are atmospheric mathematical estimates and screening indicators. They do
      not replace certified, calibrated on-site reference monitors and are not designed for life-safety critical systems.

    ### Secrets

    - `SLACK_WEBHOOK_URL` (optional): Required only if `enable_slack` is set to `true`. Stores the Slack Incoming
      Webhook URL for channel notifications.

    ## Quick start

    1. Import this blueprint into your Kestra instance.
    2. Click **Execute** with default coordinates (New Delhi Campus) or provide your facility's latitude and longitude.
    3. Review execution logs and outputs to inspect peak AQI, rolling 24-hour PM2.5 averages, and AQI categories.
    4. To enable Slack alerts, configure the `SLACK_WEBHOOK_URL` secret in your namespace and set `enable_slack: true`.
    5. Enable the `scheduled_monitor` trigger to activate automated morning and evening surveillance.

    ## How to extend

    - **Multi-Facility Fleet Monitoring**: Wrap the fetch and DuckDB query inside a `ForEach` loop to scan multiple
      geographic locations in parallel.
    - **Long-term Warehouse Historical Archival**: Append a PostgreSQL, Snowflake, or BigQuery task to store
      historical daily snapshots for long-term multi-year compliance trends.
    - **Building Automation System (BMS) Exploratory Integrations**: Connect an HTTP task or MQTT webhook to
      notify building management systems when forecast AQI is high, allowing human operators to inspect ventilation settings.

    ## Links

    - [Open-Meteo Air Quality API](https://open-meteo.com/en/docs/air-quality-api)
    - [Kestra DuckDB Plugin Documentation](https://kestra.io/plugins/plugin-jdbc-duckdb)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
    - [Kestra KV Store](https://kestra.io/docs/concepts/kv-store)
    - [Kestra Flow Control & If Task](https://kestra.io/plugins/core/flow/io.kestra.plugin.core.flow.if)
    - [EPA Air Quality Index (AQI) Guidelines](https://www.airnow.gov/aqi/aqi-basics/)
  tags:
    - Data
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - Day 2 Operations
  ee: false
  demo: false
