id: fdic-bank-failure-and-merger-vendor-master-sync
namespace: company.team

description: |
  Check the remit-to banks in your vendor master against the FDIC before the next payment run. One
  request gets the current status of every vendor bank charter, one request gets its failure, merger,
  closing and legal-name-change history, and DuckDB decides per vendor whether payments can go out,
  the bank record must be updated to the successor, or payments must be held. Each finding is posted
  once. Works without an API key.

inputs:
  - id: vendors
    type: JSON
    description: |
      Vendor remit-to bank records, one object per vendor with `vendor_id`, `vendor`, `bank_cert` (FDIC
      certificate number, shown on BankFind) and `bank_name` as stored in your ERP. The defaults are SAMPLE
      vendor records pointing at real banks; every bank status and event comes from the live FDIC API.
      A Webhook call can send its own list as `{"vendors": [...]}`.
    defaults:
      - {vendor_id: V-1001, vendor: Acme Industrial Supply, bank_cert: 628, bank_name: JPMorgan Chase Bank}
      - {vendor_id: V-1002, vendor: Bayou Seafood Co, bank_cert: 9320, bank_name: Marion State Bank}
      - {vendor_id: V-1003, vendor: Temecula Freight LLC, bank_cert: 58590, bank_name: Nano Banc}
      - {vendor_id: V-1004, vendor: Sunrise Florals, bank_cert: 58556, bank_name: Gold Coast Bank}
      - {vendor_id: V-1005, vendor: Card Settlement Services, bank_cert: 5649, bank_name: Discover Bank}
      - {vendor_id: V-1006, vendor: Finger Lakes Packaging, bank_cert: 597, bank_name: Chemung Canal Trust Company}
      - {vendor_id: V-1007, vendor: Westside Logistics, bank_cert: 3511, bank_name: Wells Fargo Bank}
      - {vendor_id: V-1008, vendor: Typo Consulting, bank_cert: 9999999, bank_name: Unknown Bank}
      - {vendor_id: V-1009, vendor: Missing Cert Corp, bank_cert: "n/a", bank_name: Some Bank}

  - id: rename_lookback_days
    type: INT
    defaults: 365
    description: Report a legal name change of a still-active bank only if it took effect within this many days. Older renames are history, not an action item.

  - id: state_key
    type: STRING
    defaults: fdic_vendor_bank_findings
    description: KV key holding the findings already reported (vendor, action, FDIC event).

triggers:
  - id: before_payment_run
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 12 * * 1-5"
    description: FDIC republishes the history index daily; a weekday check at noon UTC runs before an afternoon payment run.

  - id: vendor_master_changed
    type: io.kestra.plugin.core.trigger.Webhook
    key: "{{ secret('FDIC_VENDOR_SYNC_WEBHOOK_KEY') }}"
    description: "Call from the ERP when vendor bank details change, optionally with a JSON body {\"vendors\": [...]} to check only those records."

tasks:
  - id: plan
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: Validates the CERT numbers (a non-numeric value would break the API filter) and builds the two FDIC filters.
    url: "jdbc:duckdb:"
    fetchType: FETCH_ONE
    outputFiles:
      - vendors_parquet
    parameters:
      vendors: "{{ (trigger.body.vendors ?? inputs.vendors) | toJson }}"
    sql: |
      CREATE TABLE v AS
      SELECT coalesce(json_extract_string(j, '$.vendor_id'), 'row ' || row_number() OVER ()) AS vendor_id,
             json_extract_string(j, '$.vendor') AS vendor,
             TRY_CAST(json_extract_string(j, '$.bank_cert') AS INTEGER) AS cert,
             json_extract_string(j, '$.bank_cert') AS cert_raw,
             json_extract_string(j, '$.bank_name') AS bank_name
      FROM (SELECT unnest(from_json(:vendors, '["JSON"]')) AS j);
      COPY v TO '{{ outputFiles.vendors_parquet }}' (FORMAT PARQUET);
      SELECT string_agg(DISTINCT CAST(cert AS VARCHAR), ' OR ') AS certs,
             CASE WHEN count(cert) = 0 THEN error('No numeric FDIC CERT in the vendors input.') END AS guard
      FROM v WHERE cert IS NOT NULL;

  - id: institutions
    type: io.kestra.plugin.core.http.Download
    description: Current status of every vendor bank charter. Inactive charters carry `NEWCERT` (successor, 0 if none), `ENDEFYMD` and the closing change code `CHANGEC1`.
    uri: https://api.fdic.gov/banks/institutions
    params:
      filters: "CERT:({{ outputs.plan.outputs[0].row.certs }})"
      fields: CERT,NAME,ACTIVE,NEWCERT,ENDEFYMD,CHANGEC1
      limit: "10000"
    headers:
      User-Agent: kestra-fdic-vendor-bank-sync/1.0 (https://kestra.io)
    options:
      retryOnStatusCodes: [429, 500, 502, 503, 504]
      retry:
        type: exponential
        interval: PT5S
        maxInterval: PT1M
        maxAttempts: 4

  - id: history
    type: io.kestra.plugin.core.http.Download
    description: |
      Institution-level structure events for the same charters: 211 failure, 221 absorption, 223 merger,
      224 affiliated merger, 240 voluntary closing, 510 legal name change. A failed bank appears only as
      `OUT_CERT`, so both fields are filtered. This index is refreshed daily, while `/banks/failures` can lag by weeks.
    uri: https://api.fdic.gov/banks/history
    params:
      filters: "(CERT:({{ outputs.plan.outputs[0].row.certs }}) OR OUT_CERT:({{ outputs.plan.outputs[0].row.certs }})) AND CHANGECODE:(211 OR 221 OR 223 OR 224 OR 240 OR 510)"
      fields: ID,CERT,OUT_CERT,INSTNAME,FRM_INSTNAME,ACQ_CERT,ACQ_INSTNAME,CHANGECODE,CHANGECODE_DESC,EFFDATE
      sort_by: EFFDATE
      sort_order: DESC
      limit: "10000"
    headers:
      User-Agent: kestra-fdic-vendor-bank-sync/1.0 (https://kestra.io)
    options:
      retryOnStatusCodes: [429, 500, 502, 503, 504]
      retry:
        type: exponential
        interval: PT5S
        maxInterval: PT1M
        maxAttempts: 4

  - id: previous
    type: io.kestra.plugin.core.kv.Get
    key: "{{ inputs.state_key }}"
    errorOnMissing: false
    description: Findings reported by earlier runs. Missing on the first run, which is the BASELINE (every open finding is reported once).

  - id: classify
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: |
      One action per vendor. HOLD_PAYMENTS when the charter closed without an FDIC successor (voluntary
      closing, failure paid out) or the CERT is unknown or invalid; UPDATE_BANK when it failed or merged
      into a successor; UPDATE_BANK_NAME when an active bank changed its legal name recently; OK otherwise.
      FDIC often records the same rename under several transactions, so events are deduplicated on
      (charter, code, date). A finding is new if (vendor, action, event) was not reported before.
    url: "jdbc:duckdb:"
    fetchType: FETCH_ONE
    inputFiles:
      inst.json: "{{ outputs.institutions.uri }}"
      hist.json: "{{ outputs.history.uri }}"
      vendors.parquet: "{{ outputs.plan.outputFiles.vendors_parquet }}"
      seen.json: "{{ outputs.previous.value ?? '[]' }}"
    outputFiles:
      - findings_csv
    parameters:
      lookback: "{{ inputs.rename_lookback_days }}"
    sql: |
      SET TimeZone = 'UTC';
      CREATE TABLE inst AS
      SELECT CAST(json_extract_string(d, '$.data.CERT') AS INTEGER) AS cert,
             json_extract_string(d, '$.data.NAME') AS fdic_name,
             CAST(json_extract_string(d, '$.data.ACTIVE') AS INTEGER) = 1 AS active,
             nullif(CAST(json_extract_string(d, '$.data.NEWCERT') AS INTEGER), 0) AS newcert,
             CAST(strptime(json_extract_string(d, '$.data.ENDEFYMD'), '%m/%d/%Y') AS DATE) AS ended_on
      FROM read_json_objects('inst.json'), unnest(from_json(json_extract(json, '$.data'), '["JSON"]')) AS t(d);

      CREATE TABLE ev AS
      SELECT min(id) AS event_id, cert, code, descr, eff, any_value(acq_cert) AS acq_cert,
             any_value(acq_name) AS acq_name, any_value(old_name) AS old_name, any_value(new_name) AS new_name
      FROM (SELECT json_extract_string(d, '$.data.ID') AS id,
                   coalesce(CAST(json_extract_string(d, '$.data.OUT_CERT') AS INTEGER), CAST(json_extract_string(d, '$.data.CERT') AS INTEGER)) AS cert,
                   CAST(json_extract_string(d, '$.data.CHANGECODE') AS INTEGER) AS code,
                   json_extract_string(d, '$.data.CHANGECODE_DESC') AS descr,
                   CAST(left(json_extract_string(d, '$.data.EFFDATE'), 10) AS DATE) AS eff,
                   CAST(json_extract_string(d, '$.data.ACQ_CERT') AS INTEGER) AS acq_cert,
                   json_extract_string(d, '$.data.ACQ_INSTNAME') AS acq_name,
                   json_extract_string(d, '$.data.FRM_INSTNAME') AS old_name,
                   json_extract_string(d, '$.data.INSTNAME') AS new_name
            FROM read_json_objects('hist.json'), unnest(from_json(json_extract(json, '$.data'), '["JSON"]')) AS t(d))
      GROUP BY cert, code, descr, eff;

      CREATE TABLE terminal AS
      SELECT * FROM ev WHERE code <> 510 QUALIFY row_number() OVER (PARTITION BY cert ORDER BY eff DESC) = 1;
      CREATE TABLE rename AS
      SELECT * FROM ev WHERE code = 510 AND eff >= current_date - CAST(:lookback AS INTEGER)
      QUALIFY row_number() OVER (PARTITION BY cert ORDER BY eff DESC) = 1;

      CREATE TABLE findings AS
      SELECT v.vendor_id, v.vendor, v.cert_raw AS bank_cert, v.bank_name, i.fdic_name,
             CASE WHEN v.cert IS NULL THEN 'HOLD_PAYMENTS'
                  WHEN i.cert IS NULL THEN 'HOLD_PAYMENTS'
                  WHEN NOT i.active AND i.newcert IS NULL THEN 'HOLD_PAYMENTS'
                  WHEN NOT i.active THEN 'UPDATE_BANK'
                  WHEN r.cert IS NOT NULL THEN 'UPDATE_BANK_NAME'
                  ELSE 'OK' END AS action,
             CASE WHEN v.cert IS NULL THEN 'Invalid CERT "' || coalesce(v.cert_raw, '') || '"'
                  WHEN i.cert IS NULL THEN 'CERT ' || v.cert || ' is not an FDIC-insured institution'
                  WHEN NOT i.active THEN coalesce(t.descr, 'Inactive') || ' on ' || coalesce(t.eff, i.ended_on)
                       || CASE WHEN i.newcert IS NULL THEN ', no FDIC successor'
                               ELSE ', successor ' || coalesce(t.acq_name, 'CERT ' || i.newcert) || ' (CERT ' || i.newcert || ')' END
                  WHEN r.cert IS NOT NULL THEN 'Renamed on ' || r.eff || ' from ' || r.old_name || ' to ' || r.new_name
                  ELSE 'Active' END AS detail,
             coalesce(CASE WHEN i.active THEN r.event_id ELSE t.event_id END, CAST(v.cert AS VARCHAR) || '-' || coalesce(CAST(i.ended_on AS VARCHAR), 'none'), 'invalid-' || coalesce(v.cert_raw, '')) AS event_id
      FROM read_parquet('vendors.parquet') v
      LEFT JOIN inst i ON i.cert = v.cert
      LEFT JOIN terminal t ON t.cert = v.cert
      LEFT JOIN rename r ON r.cert = v.cert;

      CREATE TABLE seen AS
      SELECT s->>'$.vendor_id' AS vendor_id, s->>'$.action' AS action, s->>'$.event_id' AS event_id
      FROM (SELECT unnest(from_json(content, '["JSON"]')) AS s FROM read_text('seen.json'));
      CREATE TABLE new_findings AS
      SELECT f.* FROM findings f ANTI JOIN seen s ON s.vendor_id = f.vendor_id AND s.action = f.action AND s.event_id = f.event_id
      WHERE f.action <> 'OK';

      COPY (SELECT *, vendor_id IN (SELECT vendor_id FROM new_findings) AS is_new FROM findings
            ORDER BY CASE action WHEN 'HOLD_PAYMENTS' THEN 1 WHEN 'UPDATE_BANK' THEN 2 WHEN 'UPDATE_BANK_NAME' THEN 3 ELSE 4 END, vendor_id)
        TO '{{ outputFiles.findings_csv }}' (HEADER, DELIMITER ',');

      SELECT (SELECT count(*) FROM seen) = 0 AS is_baseline,
             (SELECT count(*) FROM findings) AS vendors,
             (SELECT count(*) FROM findings WHERE action = 'HOLD_PAYMENTS') AS hold,
             (SELECT count(*) FROM findings WHERE action = 'UPDATE_BANK') AS update_bank,
             (SELECT count(*) FROM findings WHERE action = 'UPDATE_BANK_NAME') AS update_name,
             (SELECT count(*) FROM findings WHERE action = 'OK') AS ok,
             (SELECT count(*) FROM new_findings) AS new_findings,
             (SELECT coalesce(string_agg(action || ' ' || vendor_id || ' ' || vendor || ' (' || coalesce(bank_name, '?') || ', CERT ' || coalesce(bank_cert, '?') || ')  ' || detail, chr(10) ORDER BY action, vendor_id), '')
                FROM findings WHERE action <> 'OK') AS open_lines,
             (SELECT CAST(json_object('text', '*FDIC vendor bank check*: ' || count(*) || ' new finding(s) before the next payment run' || chr(10)
                || string_agg('• *' || action || '* ' || vendor_id || ' ' || vendor || ' (' || coalesce(bank_name, '?') || ', CERT ' || coalesce(bank_cert, '?') || ') - ' || detail, chr(10) ORDER BY action, vendor_id)) AS VARCHAR)
                FROM new_findings) AS slack_payload,
             (SELECT coalesce(CAST(json_group_array(json_object('vendor_id', vendor_id, 'action', action, 'event_id', event_id)) AS VARCHAR), '[]')
                FROM (SELECT vendor_id, action, event_id FROM findings WHERE action <> 'OK' UNION SELECT vendor_id, action, event_id FROM seen)) AS seen_now;

  - id: save_state
    type: io.kestra.plugin.core.kv.Set
    key: "{{ inputs.state_key }}"
    value: "{{ outputs.classify.outputs[0].row.seen_now }}"

  - id: route
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.classify.outputs[0].row.new_findings > 0 }}"
    then:
      - id: warn
        type: io.kestra.plugin.core.log.Log
        level: WARN
        message: "{{ outputs.classify.outputs[0].row.new_findings }} new vendor bank finding(s):\n{{ fromJson(outputs.classify.outputs[0].row.slack_payload).text }}"
      - id: notify
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        allowFailure: true
        description: allowFailure keeps the check green when the webhook is not configured; the findings are still in the WARN log and the CSV.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: "{{ outputs.classify.outputs[0].row.slack_payload }}"
    else:
      - id: quiet
        type: io.kestra.plugin.core.log.Log
        message: No new FDIC failure, merger, closing or rename affecting a vendor bank since the last run.

  - id: summary
    type: io.kestra.plugin.core.log.Log
    message: |
      Vendor bank check{{ outputs.classify.outputs[0].row.is_baseline ? ' (BASELINE)' : '' }}: {{ outputs.classify.outputs[0].row.vendors }} vendors, {{ outputs.classify.outputs[0].row.hold }} HOLD_PAYMENTS, {{ outputs.classify.outputs[0].row.update_bank }} UPDATE_BANK, {{ outputs.classify.outputs[0].row.update_name }} UPDATE_BANK_NAME, {{ outputs.classify.outputs[0].row.ok }} OK, {{ outputs.classify.outputs[0].row.new_findings }} new.
      {{ outputs.classify.outputs[0].row.open_lines }}

outputs:
  - id: summary
    type: JSON
    value: "{{ outputs.classify.outputs[0].row }}"
  - id: findings_csv
    type: FILE
    value: "{{ outputs.classify.outputFiles.findings_csv }}"

extend:
  title: Sync Vendor Remit-To Banks with FDIC Bank Failures, Mergers and Closings
  metaTitle: FDIC Bank Failure and Merger Vendor Master Sync | Kestra
  shortDescription: Check the banks in your vendor master against FDIC charter status and structure-change history before each payment run, and tell AP which vendors to hold, which to move to the successor bank and which bank names to update.
  metaDescription: Check vendor remit-to banks against FDIC failures, mergers, closings and renames before each payment run, with hold and update actions in Slack.
  description: |
    Vendor master records keep the bank a vendor gave you years ago. When that bank fails, merges or closes, the FDIC records it, but nobody tells accounts payable: wires to a closed charter bounce and payments to a merged bank use the old name until the routing transition ends. This flow checks every vendor bank against two keyless FDIC BankFind endpoints and gives AP one action per vendor.

    ## How it works

    1. A weekday `Schedule` runs before the payment run; a `Webhook` lets the ERP trigger a check when vendor bank details change, optionally with its own `vendors` list in the body.
    2. `plan` (DuckDB) validates the CERT numbers and builds one OR filter; a list with no numeric CERT fails the run.
    3. `institutions` (HTTP Download) returns the current status of every charter: `ACTIVE`, `NEWCERT` (successor, 0 if none), `ENDEFYMD` and the closing code.
    4. `history` fetches institution-level events for the same charters: 211 failure, 221 absorption, 223 merger, 224 affiliated merger, 240 voluntary closing and 510 legal name change. A failed bank appears only as `OUT_CERT`, so both fields are filtered. This index is refreshed daily, while `/banks/failures` can lag by weeks.
    5. `classify` (DuckDB) deduplicates events and sets the action: `HOLD_PAYMENTS` for a charter closed without FDIC successor, an unknown CERT or an invalid one; `UPDATE_BANK` for a failure or merger, with the successor name and CERT; `UPDATE_BANK_NAME` for an active bank renamed within `rename_lookback_days`; `OK` otherwise.
    6. Findings are keyed on (vendor, action, FDIC event) in the KV store. `route` (If) posts only new ones to Slack and logs them at WARN; the summary and the CSV always list every open finding.

    ## What you get

    - A findings CSV with one row per vendor: stored bank, FDIC name, action, event detail and whether the finding is new.
    - Old mergers caught too: a 2025 merger still shows as `UPDATE_BANK` on the first run.
    - One Slack message per run with only the new findings, silence otherwise.

    The default `vendors` are SAMPLE vendor records pointing at real banks; every bank status, successor and date comes from the live FDIC API.

    ## Who it's for

    - Accounts payable, payment operations and vendor master data teams in US companies.
    - Treasury and fraud teams that review bank detail changes.

    ## Why orchestrate this with Kestra

    - Two HTTP requests with retries, DuckDB joins and KV state for "report once", no database or cron server.
    - Schedule and Webhook triggers run the same checks.

    ## Prerequisites

    - Kestra 2.0 with the DuckDB and Slack plugins and HTTPS access to `api.fdic.gov`. No API key.
    - Vendor bank records with the FDIC certificate number.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack incoming webhook for the findings (optional; without it the WARN log and CSV still carry them).
    - `FDIC_VENDOR_SYNC_WEBHOOK_KEY`: key of the Webhook trigger URL used by the ERP.

    ## Quick start

    1. Click **Execute** with the defaults: a BASELINE with 3 `HOLD_PAYMENTS`, 3 `UPDATE_BANK`, 1 `UPDATE_BANK_NAME` and 2 `OK`.
    2. Execute again: 0 new, the `quiet` branch runs.
    3. Replace `vendors` with an export of your vendor master, add the secrets and enable the schedule.

    ## How to extend

    - Feed `vendors` from your ERP with a JDBC query task.
    - Follow multi-hop successors with a second `institutions` request on `NEWCERT`.
    - Add a `Pause` approval before the payment run for `HOLD_PAYMENTS` findings.

    ## Links

    - [HTTP Download](https://kestra.io/plugins/core/http/io.kestra.plugin.core.http.download), [DuckDB Queries](https://kestra.io/plugins/plugin-jdbc-duckdb/io.kestra.plugin.jdbc.duckdb.queries), [Webhook trigger](https://kestra.io/plugins/core/trigger/io.kestra.plugin.core.trigger.webhook) and [Slack Incoming Webhook](https://kestra.io/plugins/plugin-notifications/slack/io.kestra.plugin.slack.notifications.slackincomingwebhook)
    - [FDIC BankFind Suite API](https://api.fdic.gov/banks/docs/) and [BankFind Suite](https://banks.data.fdic.gov/bankfind-suite/)
  tags:
    - Business
  subTags:
    - Policy & Compliance
    - Reporting & Digests
  ee: false
  demo: false
