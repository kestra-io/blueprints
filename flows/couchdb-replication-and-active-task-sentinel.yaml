id: couchdb-replication-and-active-task-sentinel
namespace: company.data

inputs:
  - id: couchdb_host
    type: STRING
    displayName: CouchDB Host
    defaults: "couchdb.internal"
    description: Hostname or IP address of the Apache CouchDB node exposing port 5984.

  - id: couchdb_port
    type: INT
    displayName: CouchDB Port
    defaults: 5984
    description: Port number for the HTTP REST API on CouchDB (default 5984).

  - id: target_database
    type: STRING
    displayName: Target Database
    defaults: "production_documents"
    description: Database name monitored for active background compaction and replication.

  - id: max_pending_changes
    type: INT
    displayName: Max Pending Changes Threshold
    defaults: 500
    description: Maximum tolerated pending replication changes before triggering critical alerts.

  - id: slack_channel
    type: STRING
    displayName: Slack Channel
    defaults: "#data-platform-alerts"
    description: Slack channel destination for operational CouchDB incident cards.

  - id: auto_compact
    type: BOOL
    displayName: Auto Trigger Compaction
    defaults: true
    description: Automatically trigger database compaction via POST /db/_compact when pending revisions accumulate.

  - id: dry_run
    type: BOOL
    displayName: Dry Run Mode
    defaults: false
    description: When true, audits active tasks and dispatches notifications but skips remediation calls.

triggers:
  - id: every_fifteen_minutes
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"

tasks:
  - id: probe_active_tasks
    type: io.kestra.plugin.core.http.Request
    uri: "http://{{ inputs.couchdb_host }}:{{ inputs.couchdb_port }}/_active_tasks"
    method: GET
    headers:
      Accept: application/json
      Authorization: "Basic {{ (secret('COUCHDB_USERNAME') ~ ':' ~ secret('COUCHDB_PASSWORD')) | base64Encode }}"
    options:
      allowFailed: true
    allowFailure: true

  - id: route_by_task_health
    type: io.kestra.plugin.core.flow.Switch
    value: >-
      {% if outputs.probe_active_tasks.status != 200 or outputs.probe_active_tasks.body is null %}
      PROBE_FAILED
      {% else %}
        {% set tasks = outputs.probe_active_tasks.body %}
        {% set critical_count = 0 %}
        {% set warning_count = 0 %}
        {% for t in tasks %}
          {% if t.type == 'replication' and t.changes_pending is defined and t.changes_pending >= inputs.max_pending_changes %}
            {% set critical_count = critical_count + 1 %}
          {% elseif t.type == 'replication' and t.changes_pending is defined and t.changes_pending > 0 %}
            {% set warning_count = warning_count + 1 %}
          {% endif %}
        {% endfor %}
        {% if critical_count > 0 %}
        CRITICAL
        {% elseif warning_count > 0 %}
        WARNING
        {% else %}
        HEALTHY
        {% endif %}
      {% endif %}
    cases:
      CRITICAL:
        - id: alert_critical_slack
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "channel": "{{ inputs.slack_channel }}",
              "text": "[CRITICAL] CouchDB Continuous Replication Lag Exceeded Threshold - Data Desynchronization Risk",
              "attachments": [
                {
                  "color": "#D32F2F",
                  "title": "CouchDB Replication Lag Incident",
                  "fields": [
                    {
                      "title": "Cluster Host",
                      "value": "{{ inputs.couchdb_host }}:{{ inputs.couchdb_port }}",
                      "short": true
                    },
                    {
                      "title": "Threshold",
                      "value": "{{ inputs.max_pending_changes }} pending changes",
                      "short": true
                    },
                    {
                      "title": "Severity",
                      "value": "CRITICAL - Replication Falling Behind",
                      "short": true
                    },
                    {
                      "title": "Remediation Status",
                      "value": "{{ (inputs.auto_compact and not inputs.dry_run) ? 'Triggering Compaction POST' : 'Remediation Skipped (Dry Run or Disabled)' }}",
                      "short": true
                    }
                  ],
                  "footer": "Kestra CouchDB Sentinel | Execution ID: {{ execution.id }}"
                }
              ]
            }

        - id: check_remediation
          type: io.kestra.plugin.core.flow.If
          condition: "{{ inputs.auto_compact == true and inputs.dry_run == false }}"
          then:
            - id: trigger_database_compaction
              type: io.kestra.plugin.core.http.Request
              uri: "http://{{ inputs.couchdb_host }}:{{ inputs.couchdb_port }}/{{ inputs.target_database }}/_compact"
              method: POST
              headers:
                Content-Type: application/json
                Authorization: "Basic {{ (secret('COUCHDB_USERNAME') ~ ':' ~ secret('COUCHDB_PASSWORD')) | base64Encode }}"
              options:
                allowFailed: true

            - id: notify_remediation_slack
              type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
              url: "{{ secret('SLACK_WEBHOOK_URL') }}"
              payload: |
                {
                  "channel": "{{ inputs.slack_channel }}",
                  "text": "[REMEDIATION] CouchDB database compaction triggered successfully for {{ inputs.target_database }}."
                }

      WARNING:
        - id: alert_warning_slack
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "channel": "{{ inputs.slack_channel }}",
              "text": "[WARNING] CouchDB Active Replication Tasks Processing Changes",
              "attachments": [
                {
                  "color": "#F57C00",
                  "title": "CouchDB Replication Activity Warning",
                  "fields": [
                    {
                      "title": "Cluster Host",
                      "value": "{{ inputs.couchdb_host }}:{{ inputs.couchdb_port }}",
                      "short": true
                    },
                    {
                      "title": "Monitored Database",
                      "value": "{{ inputs.target_database }}",
                      "short": true
                    },
                    {
                      "title": "Severity",
                      "value": "WARNING - Active Changes Pending",
                      "short": true
                    },
                    {
                      "title": "Auto Compact",
                      "value": "{{ inputs.auto_compact ? 'Enabled' : 'Disabled' }}",
                      "short": true
                    }
                  ],
                  "footer": "Kestra CouchDB Sentinel | Execution ID: {{ execution.id }}"
                }
              ]
            }

      PROBE_FAILED:
        - id: alert_probe_failure
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "channel": "{{ inputs.slack_channel }}",
              "text": "[CRITICAL] CouchDB Sentinel Probe Failed - Unable to query /_active_tasks endpoint. Verify network routing and credentials."
            }

      HEALTHY:
        - id: log_tasks_healthy
          type: io.kestra.plugin.core.log.Log
          message: "CouchDB active tasks health is normal. All replication and compaction tasks operating within thresholds."

  - id: log_audit_summary
    type: io.kestra.plugin.core.log.Log
    message: "CouchDB active task health audit completed. Status: {{ outputs.route_by_task_health.value ?? 'PROCESSED' }}."

errors:
  - id: on_flow_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "{{ inputs.slack_channel }}",
        "text": "[ERROR] CouchDB Replication Sentinel flow execution aborted unexpectedly. Execution ID: {{ execution.id }}."
      }

extend:
  title: CouchDB Active Task and Continuous Replication Sentinel
  metaTitle: CouchDB Active Task & Replication Sentinel | Kestra
  shortDescription: Audits CouchDB /_active_tasks for continuous replication lag and automates database compaction.
  metaDescription: Audit CouchDB /_active_tasks for replication lag and stalled compactions, dispatch Slack incident alerts, and automate /_compact maintenance.
  description: |
    Apache CouchDB is an open-source, distributed document-oriented NoSQL database featuring multi-version concurrency control (MVCC) and master-master replication. Organizations rely on CouchDB for edge-to-cloud synchronization, offline-first mobile applications, and multi-region document stores. In distributed environments, background tasks for document replication, view indexing, and database compaction run concurrently and are exposed via the `/_active_tasks` management API. When network partitions occur, authentication credentials expire, or high-volume document updates saturate worker threads, continuous replication tasks stall and `changes_pending` accumulates rapidly. If left unchecked, target clusters fall out of synchronization and append-only `.couch` files exhaust host disk storage. This blueprint provides automated continuous surveillance over `/_active_tasks`, detects replication backlogs, alerts engineering teams via Slack, and automates safe database compaction via `POST /{db}/_compact`.

    ## How it works

    1. Scheduled trigger (`every_fifteen_minutes`) initiates diagnostic health verification every 15 minutes, with manual runs supported via customizable inputs.
    2. Diagnostic probe (`probe_active_tasks`) connects to the CouchDB HTTP REST interface (`port 5984`) via `io.kestra.plugin.core.http.Request` and queries `/_active_tasks` with HTTP Basic Authentication.
    3. Classification logic evaluates the JSON task array using Pebble templating, discerning whether any replication tasks have accumulated pending changes exceeding `max_pending_changes` (`CRITICAL`), if moderate pending changes exist (`WARNING`), if all tasks are healthy (`HEALTHY`), or if the HTTP endpoint was unreachable (`PROBE_FAILED`).
    4. Routing task (`route_by_task_health`) switches execution along dedicated paths according to the classified severity.
    5. On `CRITICAL` or `WARNING` states, structured Slack incident cards notify operations channels with cluster host details, pending change counts, and targeted databases.
    6. Guarded remediation (`check_remediation`) checks whether `auto_compact` is enabled and `dry_run` is disabled. If confirmed, `trigger_database_compaction` dispatches a `POST` request to `/{target_database}/_compact` to reclaim disk space from old document revisions and unblock I/O bottlenecks.
    7. On `PROBE_FAILED`, dedicated alerts notify administrators of unreachable ports or invalid credentials.
    8. Audit log task (`log_audit_summary`) writes execution metadata and classified status to task logs.

    ## What you get

    - Automated continuous surveillance of CouchDB active background tasks across replication, compaction, and indexing pipelines.
    - Early detection of replication lag before multi-region or edge document stores fall out of sync.
    - Automated self-healing database compaction triggering `POST /{db}/_compact` without manual operator intervention.
    - Differentiated incident routing separating active backlog spikes from nominal replication processing.
    - Full execution traceability and audit logging without leaking database passwords in logs or alert payloads.

    ## Who it's for

    - Database Administrators and SREs managing production CouchDB distributed document clusters.
    - Platform Engineers maintaining edge-to-cloud data synchronization and mobile backend stores.
    - Data Infrastructure Teams deploying resilient multi-master document databases.

    ## Why orchestrate this with Kestra

    - Declarative YAML definition unifies distributed document store surveillance, conditional severity triage, and automated self-healing into version-controlled GitOps workflows.
    - Native HTTP request capabilities interact directly with CouchDB's REST APIs without external agent daemons or Python container overhead.
    - Built-in conditional routing and dry-run safety gates isolate discovery from administrative maintenance triggers.
    - Immutable execution history provides operational evidence documenting replication lag recovery timelines and compaction intervals.
    - Cloud-native scheduling and flow-level error-trapping ensure continuous sentinel operation independent of external cron infrastructure.

    ## Prerequisites

    - Apache CouchDB instance running with HTTP REST API access enabled (default port 5984).
    - Database user with permissions to query `/_active_tasks` and trigger `/{db}/_compact`.
    - Slack incoming webhook URL for operational incident dispatch.

    ### Secrets

    - `COUCHDB_USERNAME`: Username for authenticating to CouchDB administrative endpoints (e.g. admin).
    - `COUCHDB_PASSWORD`: Password for the CouchDB administrative user.
    - `SLACK_WEBHOOK_URL`: Incoming webhook URL for posting incident cards to Slack.

    ## Quick start

    1. Configure `COUCHDB_USERNAME`, `COUCHDB_PASSWORD`, and `SLACK_WEBHOOK_URL` in your Kestra namespace secrets.
    2. Deploy this blueprint to your Kestra instance and trigger an initial run with `dry_run: true` to verify connectivity against your CouchDB server.
    3. Review the execution log in the Kestra UI to verify `/_active_tasks` response parsing.
    4. Enable the `every_fifteen_minutes` schedule trigger to activate automated continuous monitoring and remediation.

    ## How to extend

    - Add `GET /_node/_local/_up` health checks to verify node-level cluster member readiness.
    - Integrate PagerDuty alerting via `io.kestra.plugin.notifications.pagerduty.PagerDutyAlert` for continuous replication outages lasting longer than one hour.
    - Attach view index compaction triggers via `POST /{db}/_compact/{design_doc}` to optimize MapReduce secondary indexes.

    ## Links

    - [CouchDB Active Tasks API Documentation](https://docs.couchdb.org/en/stable/api/server/common.html#active-tasks)
    - [CouchDB Compaction Reference](https://docs.couchdb.org/en/stable/maintenance/compaction.html)
    - [CouchDB Replication Overview](https://docs.couchdb.org/en/stable/replication/intro.html)
    - [Kestra HTTP Plugin Documentation](https://kestra.io/plugins/plugin-core/tasks/http)
    - [Kestra Slack Notification Plugin](https://kestra.io/plugins/plugin-notifications)
  tags:
    - Data
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - Realtime & Streaming
  ee: false
  demo: false
