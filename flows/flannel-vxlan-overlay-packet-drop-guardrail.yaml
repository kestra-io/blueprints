id: flannel-vxlan-overlay-packet-drop-guardrail
namespace: company.sre

description: |
  Audits CNCF Flannel CNI network overlay metrics to detect VXLAN tunnel packet drops, MTU size blackholes, and node subnet allocation lease renewal errors.

concurrency:
  limit: 1

inputs:
  - id: flannel_metrics_url
    type: STRING
    displayName: "Flannel Metrics URL"
    defaults: "http://flannel.kube-flannel.svc.cluster.local:8971"
    description: "Internal Kubernetes HTTP endpoint exposing Prometheus metrics from the Flannel CNI DaemonSet."

  - id: cluster_identifier
    type: STRING
    displayName: "Kubernetes Cluster Identifier"
    defaults: "k8s-prod-us-central"
    description: "Identifier of the target Kubernetes cluster monitored for CNI overlay packet drops and subnet routing health."

  - id: max_packet_drops_threshold
    type: INT
    displayName: "Max Packet Drops Threshold"
    defaults: 15
    description: "Maximum allowable threshold for VXLAN overlay packet drops before triggering a network degradation alarm."

  - id: max_subnet_errors
    type: INT
    displayName: "Max Subnet Errors Threshold"
    defaults: 2
    description: "Maximum allowable count of host-gw or VXLAN subnet allocation lease renewal errors."

  - id: alert_on_mtu_mismatch
    type: BOOL
    displayName: "Alert on MTU Mismatch"
    defaults: true
    description: "Toggle whether detected packet fragmentation and MTU overhead blackholes immediately dispatch operational alerts."

tasks:
  - id: fetch_flannel_metrics
    type: io.kestra.plugin.core.http.Request
    description: Connects directly to the Flannel CNI DaemonSet Prometheus metrics service on Kubernetes.
    uri: "{{ inputs.flannel_metrics_url }}/metrics"
    method: GET
    timeout: PT15S

  - id: parse_network_overlay_telemetry
    type: io.kestra.plugin.scripts.python.Script
    description: Evaluates Flannel CNI Prometheus metrics to audit VXLAN encapsulation drops, subnet allocation errors, and node interface states.
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    env:
      RAW_METRICS: "{{ outputs.fetch_flannel_metrics.body }}"
      CLUSTER_ID: "{{ inputs.cluster_identifier }}"
      MAX_DROPS: "{{ inputs.max_packet_drops_threshold }}"
      MAX_ERRORS: "{{ inputs.max_subnet_errors }}"
      ALERT_MTU: "{{ inputs.alert_on_mtu_mismatch }}"
    script: |
      import os
      import sys
      import re
      from datetime import datetime, timezone
      from kestra import Kestra

      raw_content = os.environ.get("RAW_METRICS", "")
      cluster_id = os.environ.get("CLUSTER_ID", "k8s-prod-us-central")
      max_drops = float(os.environ.get("MAX_DROPS", "15"))
      max_errors = float(os.environ.get("MAX_ERRORS", "2"))
      alert_mtu = os.environ.get("ALERT_MTU", "true").lower() == "true"

      if not raw_content or not raw_content.strip():
          print(f"CRITICAL: Flannel metrics payload is empty or unreachable for cluster {cluster_id}!", file=sys.stderr)
          sys.exit(1)

      vxlan_packet_drops_count = 0.0
      subnet_errors_count = 0.0
      worst_backend_interface = "none"
      node_heartbeat_misses = 0

      for line in raw_content.splitlines():
          line = line.strip()
          if not line or line.startswith("#"):
              continue
          match = re.search(r'([0-9.eE+-]+)\s*$', line)
          if not match:
              continue
          val = float(match.group(1))

          if "flannel_backend_vxlan_packet_drops_total" in line or "flannel_packet_drops_total" in line:
              vxlan_packet_drops_count += val
              iface_match = re.search(r'interface="([^"]+)"', line)
              if iface_match and val > 0:
                  worst_backend_interface = iface_match.group(1)
          elif "flannel_subnet_allocation_errors_total" in line or "flannel_lease_renewal_errors_total" in line:
              subnet_errors_count += val
          elif "flannel_node_heartbeat_miss_count" in line:
              node_heartbeat_misses += int(val)

      is_breached = bool((vxlan_packet_drops_count > max_drops) or (subnet_errors_count > max_errors) or (alert_mtu and node_heartbeat_misses > 2))
      now_iso = datetime.now(timezone.utc).isoformat()
      print(f"Flannel Audit: cluster={cluster_id}, drops={vxlan_packet_drops_count}, iface={worst_backend_interface}, subnet_errors={subnet_errors_count}, misses={node_heartbeat_misses}, breached={is_breached}")

      Kestra.outputs({
          "vxlan_packet_drops_count": round(vxlan_packet_drops_count, 0),
          "worst_backend_interface": worst_backend_interface,
          "subnet_errors_count": round(subnet_errors_count, 0),
          "node_heartbeat_misses": node_heartbeat_misses,
          "is_alerting": is_breached,
          "audit_timestamp": now_iso
      })

  - id: record_network_incident_kv
    type: io.kestra.plugin.core.kv.Set
    description: Persists cluster network health state in Kestra KV store for deduplication and incident tracking.
    key: "flannel_network_health_{{ inputs.cluster_identifier }}"
    value: "{{ outputs.parse_network_overlay_telemetry.vars.is_alerting ? 'DEGRADED' : 'HEALTHY' }}"

  - id: write_audit_manifest
    type: io.kestra.plugin.core.storage.Write
    description: Generates a persistent JSON audit manifest stored in Kestra internal storage for reliability compliance.
    content: |
      {
        "cluster_identifier": "{{ inputs.cluster_identifier }}",
        "audit_timestamp": "{{ outputs.parse_network_overlay_telemetry.vars.audit_timestamp }}",
        "vxlan_packet_drops_count": {{ outputs.parse_network_overlay_telemetry.vars.vxlan_packet_drops_count }},
        "worst_backend_interface": "{{ outputs.parse_network_overlay_telemetry.vars.worst_backend_interface }}",
        "subnet_errors_count": {{ outputs.parse_network_overlay_telemetry.vars.subnet_errors_count }},
        "node_heartbeat_misses": {{ outputs.parse_network_overlay_telemetry.vars.node_heartbeat_misses }},
        "is_alerting": {{ outputs.parse_network_overlay_telemetry.vars.is_alerting }}
      }

  - id: check_network_alert_gate
    type: io.kestra.plugin.core.flow.If
    description: Evaluates whether observed packet drops or subnet leasing errors breach cluster guardrails.
    condition: "{{ outputs.parse_network_overlay_telemetry.vars.is_alerting }}"
    then:
      - id: notify_slack_flannel_network_alert
        type: io.kestra.plugin.scripts.shell.Commands
        description: Dispatches high-urgency Slack notification when overlay packet loss or subnet leasing errors occur.
        containerImage: curlimages/curl:8.7.1
        taskRunner:
          type: io.kestra.plugin.core.runner.Process
        env:
          SLACK_WEBHOOK_URL: "{{ secret('SLACK_WEBHOOK_URL') }}"
          CLUSTER_ID: "{{ inputs.cluster_identifier }}"
          DROPS: "{{ outputs.parse_network_overlay_telemetry.vars.vxlan_packet_drops_count }}"
          IFACE: "{{ outputs.parse_network_overlay_telemetry.vars.worst_backend_interface }}"
          ERRORS: "{{ outputs.parse_network_overlay_telemetry.vars.subnet_errors_count }}"
          MISSES: "{{ outputs.parse_network_overlay_telemetry.vars.node_heartbeat_misses }}"
          MANIFEST_URI: "{{ outputs.write_audit_manifest.uri }}"
        commands:
          - |
            curl -s -X POST -H 'Content-type: application/json' \
              --data "{
                \"text\": \"*Flannel CNI Overlay Alert: ${CLUSTER_ID}*\\n*VXLAN Packet Drops:* ${DROPS}\\n*Backend Interface:* ${IFACE}\\n*Subnet Lease Errors:* ${ERRORS}\\n*Heartbeat Misses:* ${MISSES}\\n*Audit Manifest:* ${MANIFEST_URI}\\n*Action:* Verify worker node UDP 8472 connectivity, inspect MTU (1450 standard), and check subnet annotations.\"
              }" \
              "$SLACK_WEBHOOK_URL"

  - id: log_audit_outcome
    type: io.kestra.plugin.core.log.Log
    description: Logs the final operational status and audit manifest URI.
    message: "Flannel audit completed for {{ inputs.cluster_identifier }}. Status: {{ outputs.parse_network_overlay_telemetry.vars.is_alerting ? 'ALERTING' : 'HEALTHY' }}. Manifest: {{ outputs.write_audit_manifest.uri }}."

triggers:
  - id: periodic_flannel_network_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"

extend:
  title: Flannel VXLAN Overlay Packet Drop Guardrail
  metaTitle: CNCF Flannel VXLAN Overlay Network Packet Drop Guardrail
  shortDescription: Audits CNCF Flannel CNI metrics to detect VXLAN tunnel packet drops, MTU size blackholes, and subnet errors.
  metaDescription: Automated Kestra guardrail workflow auditing CNCF Flannel CNI metrics for VXLAN overlay packet drops, MTU blackholes, and subnet lease failures.
  description: |
    ## How it works
    1. A schedule trigger executes the Flannel network health audit workflow every 15 minutes.
    2. The HTTP Request task connects directly to the Flannel DaemonSet Prometheus metrics service on Kubernetes.
    3. The Python task extracts VXLAN encapsulation packet drops, subnet lease renewal failures, and node interface heartbeat misses.
    4. Kestra persists the cluster network health state in the Kestra KV store for deduplication and incident tracking.
    5. A persistent JSON audit manifest is written to Kestra internal storage.
    6. An evaluation gate determines whether packet drop counts or subnet lease errors breach overlay network SLAs.
    7. When packet drops surge or subnet allocation failures are detected, an actionable Slack incident alert is dispatched.
    8. When cross-node VXLAN encapsulation and subnet routing operate cleanly, nominal telemetry is logged.

    ## Architecture diagram
    ```mermaid
    graph TD
        Trigger[Schedule Trigger: 15m] --> FetchMetrics[HTTP Request: Query Flannel Metrics Service]
        FetchMetrics --> ParseTelemetry[Python Script: Extract VXLAN Drops and Subnet Errors]
        ParseTelemetry --> SetKV[KV Store: Persist Health State]
        SetKV --> WriteManifest[Storage Write: Save JSON Audit Manifest]
        WriteManifest --> CheckGate{Drops > 15 OR Subnet Errors > 2?}
        CheckGate -- Yes --> SlackAlert[Commands: Send Slack Incident Notification]
        CheckGate -- No --> LogStatus[Log: Nominal Network Telemetry]
    ```

    ## What you get
    - Proactive visibility into cross-node packet loss before microservices experience mysterious connection resets and RPC timeouts.
    - Immediate incident alerts when physical network switches or cloud VPC firewalls drop UDP port 8472 VXLAN encapsulated traffic.
    - Standardized audit manifests containing exact packet drop totals, subnet error counts, and interface identifiers.
    - State tracking in the Kestra KV store to prevent duplicate alert storms.

    ## Who it's for
    - Kubernetes Network Engineers managing multi-node cluster overlay routing and CNI performance.
    - Site Reliability Engineers diagnosing intermittent gRPC timeouts and TCP SYN packet drops across pods.
    - Platform Engineers maintaining bare-metal, edge, or hybrid cloud Kubernetes deployments using lightweight Flannel CNI.
    - Cloud Infrastructure administrators balancing virtual interface MTU configurations across heterogeneous hypervisors.

    ## Why orchestrate this with Kestra
    - **Multi-Plugin Orchestration**: Leverages native Kestra HTTP, KV store, and storage tasks in a structured closed loop.
    - **Centralized Secrets Governance**: Protects sensitive Slack webhooks using encrypted namespace secrets.
    - **Declarative YAML Workflows**: Manages network infrastructure surveillance as versioned code in Git repositories.
    - **Comprehensive Audit History**: Preserves historical CNI network health metrics in searchable Kestra execution logs.

    ## Use cases
    - **MTU Size Mismatch Blackhole Alarm**: Detects silent packet drops when pods transmit jumbo frames exceeding the 1450 VXLAN limit.
    - **Cross-Node Interconnect Drop Warning**: Identifies when UDP port 8472 packets fail routing between cloud availability zones.
    - **Node Subnet Lease Expiration Guardrail**: Flags CNI leasing errors preventing newly scheduled pods from obtaining cluster IPs.

    ## Inputs
    | Name | Type | Default | Description |
    | --- | --- | --- | --- |
    | `flannel_metrics_url` | STRING | `http://flannel.kube-flannel.svc.cluster.local:8971` | Internal Kubernetes HTTP endpoint exposing Prometheus metrics from Flannel. |
    | `cluster_identifier` | STRING | `k8s-prod-us-central` | Identifier of the target Kubernetes cluster monitored for CNI overlay health. |
    | `max_packet_drops_threshold` | INT | `15` | Maximum acceptable threshold for VXLAN overlay packet drops. |
    | `max_subnet_errors` | INT | `2` | Maximum allowable count of subnet allocation lease renewal errors. |
    | `alert_on_mtu_mismatch` | BOOL | `true` | Toggle whether node interface heartbeat misses trigger an operational alert. |

    ## Expected outputs
    - `{{ outputs.parse_network_overlay_telemetry.vars.vxlan_packet_drops_count }}`: Cumulative count of VXLAN encapsulation packet drops observed.
    - `{{ outputs.parse_network_overlay_telemetry.vars.worst_backend_interface }}`: Name of the backend network interface experiencing packet drops.
    - `{{ outputs.parse_network_overlay_telemetry.vars.subnet_errors_count }}`: Total number of subnet allocation and lease renewal failures.
    - `{{ outputs.parse_network_overlay_telemetry.vars.node_heartbeat_misses }}`: Count of missed peer node heartbeat exchanges.
    - `{{ outputs.parse_network_overlay_telemetry.vars.is_alerting }}`: Boolean flag indicating if network overlay SLAs were breached.
    - `{{ outputs.write_audit_manifest.uri }}`: Kestra internal storage URI for the JSON audit manifest.

    ## Prerequisites
    - Flannel CNI deployed in the cluster with Prometheus metrics enabled on port 8971.
    - Network connectivity from the Kestra worker to the Flannel DaemonSet metrics endpoint.
    - Configured Slack incoming webhook URL with permissions to post in platform NetOps alert channels.

    ### Secrets
    - `SLACK_WEBHOOK_URL`: Secure webhook URL for routing CNI network alerts to the NetOps Slack channel.

    ## Quick start
    1. Confirm that Flannel DaemonSet pods are running and exposing metrics on port 8971.
    2. Add the `SLACK_WEBHOOK_URL` secret within your Kestra namespace settings.
    3. Specify your cluster identifier in `cluster_identifier`.
    4. Run a manual execution via the Kestra UI to validate metric scraping.
    5. Enable the `periodic_flannel_network_audit` schedule trigger to establish automated monitoring.

    ## Common pitfalls and troubleshooting
    - **UDP Port 8472 Firewall Blocks**: Flannel VXLAN requires open UDP port 8472 across all worker node security groups.
    - **Interface Selection Flags**: On multi-NIC nodes, ensure Flannel is started with `--iface` pointing to the primary cluster network card.
    - **MTU Configuration Alignment**: If the underlying physical network MTU is 1500, set Flannel's MTU to 1450 to account for header overhead.
    - **Metrics Port Differentiation**: The Flannel DaemonSet serves telemetry on port 8971, separate from Kubernetes node-exporter.

    ## How to extend
    - **Automated Flannel Pod Restart**: Automatically restart Flannel DaemonSet pods on nodes exhibiting chronic subnet lease stalls.
    - **MTU Path Verification Probe**: Execute automated ping sweeps with DF (Don't Fragment) bits set to detect MTU blackholes.
    - **Cluster Network Latency Matrix**: Correlate packet drop surges with inter-node round-trip times exported to Prometheus.

    ## Links
    - [Kestra HTTP Plugin Documentation](https://kestra.io/plugins/core/http/request)
    - [Kestra KV Store Documentation](https://kestra.io/plugins/core/kv/set)
    - [Kestra Storage Plugin Documentation](https://kestra.io/plugins/core/storage/write)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
    - [CNCF Flannel Official Documentation](https://github.com/flannel-io/flannel)
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Monitoring & Alerting
    - Kubernetes Operations
  ee: false
  demo: false
