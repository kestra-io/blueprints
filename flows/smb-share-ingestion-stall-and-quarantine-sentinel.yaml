id: smb-share-ingestion-stall-and-quarantine-sentinel
namespace: company.storage

inputs:
  - id: smb_host
    type: STRING
    defaults: localhost
    description: Hostname or IP address of the SMB file server.

  - id: smb_port
    type: STRING
    defaults: "445"
    description: Port of the SMB file service (default 445).

  - id: smb_username
    type: STRING
    defaults: smbuser
    description: Service account username authorized to read and move share files.

  - id: smb_share_path
    type: STRING
    defaults: /shared/incoming/
    description: Directory URI on the SMB share monitored for incoming data files.

  - id: quarantine_share_path
    type: STRING
    defaults: /shared/quarantine/
    description: Destination directory URI where stalled or malformed drops are moved.

  - id: file_pattern
    type: STRING
    defaults: ".*\\.csv$"
    description: Regular expression filter applied against file names in the target share.

  - id: min_expected_files
    type: INT
    defaults: 1
    description: Minimum number of batch files expected before raising a stall alert.

  - id: simulate_local_mode
    type: BOOLEAN
    defaults: true
    description: When true, runs synthetic inspection for zero-dependency local testing.

variables:
  default_channel: "#storage-ops"

triggers:
  - id: schedule_periodic_probe
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"

tasks:
  - id: probe_mode_router
    type: io.kestra.plugin.core.flow.If
    condition: "{{ inputs.simulate_local_mode }}"
    then:
      - id: simulate_smb_inspection
        type: io.kestra.plugin.core.execution.Variables
        values:
          detected_files_count: 0
          corrupt_files_count: 1
          quarantine_target_name: corrupt_zero_byte_feed.csv
    else:
      - id: list_smb_incoming_files
        type: io.kestra.plugin.fs.smb.List
        host: "{{ inputs.smb_host }}"
        port: "{{ inputs.smb_port }}"
        username: "{{ inputs.smb_username }}"
        password: "{{ secret('SMB_PASSWORD') }}"
        from: "{{ inputs.smb_share_path }}"
        regExp: "{{ inputs.file_pattern }}"
        sort: LAST_MODIFIED_ASC

  - id: classify_ingestion_health
    type: io.kestra.plugin.core.execution.Labels
    labels:
      health_status: >-
        {{ (inputs.simulate_local_mode ? (outputs.simulate_smb_inspection.values.corrupt_files_count > 0 ? 'WARNING_CORRUPT' : (outputs.simulate_smb_inspection.values.detected_files_count < inputs.min_expected_files ? 'CRITICAL_STALL' : 'HEALTHY')) : ((outputs.list_smb_incoming_files.files | default([])) | length < inputs.min_expected_files ? 'CRITICAL_STALL' : 'HEALTHY')) }}

  - id: handle_health_tier
    type: io.kestra.plugin.core.flow.Switch
    value: "{{ taskrun.labels.health_status }}"
    cases:
      CRITICAL_STALL:
        - id: alert_critical_stall
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "channel": "{{ vars.default_channel }}",
              "text": "CRITICAL: SMB Share Ingestion Stall detected on host {{ inputs.smb_host }} share {{ inputs.smb_share_path }}. Zero or insufficient files matched pattern {{ inputs.file_pattern }}. Execution ID: {{ execution.id }}"
            }
      WARNING_CORRUPT:
        - id: alert_warning_corrupt
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "channel": "{{ vars.default_channel }}",
              "text": "WARNING: Corrupted or zero-byte drop detected on SMB share {{ inputs.smb_share_path }}. Initiating automated quarantine move. Execution ID: {{ execution.id }}"
            }
        - id: quarantine_corrupt_files
          type: io.kestra.plugin.core.flow.If
          condition: "{{ not inputs.simulate_local_mode }}"
          then:
            - id: move_to_quarantine
              type: io.kestra.plugin.fs.smb.Move
              host: "{{ inputs.smb_host }}"
              port: "{{ inputs.smb_port }}"
              username: "{{ inputs.smb_username }}"
              password: "{{ secret('SMB_PASSWORD') }}"
              from: "{{ inputs.smb_share_path }}corrupt_zero_byte_feed.csv"
              to: "{{ inputs.quarantine_share_path }}corrupt_zero_byte_feed.csv"
      HEALTHY:
        - id: notify_healthy_status
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "channel": "{{ vars.default_channel }}",
              "text": "HEALTHY: SMB Share Ingestion operating normally on {{ inputs.smb_host }}. Active files verified. Execution ID: {{ execution.id }}"
            }

  - id: log_audit_summary
    type: io.kestra.plugin.core.log.Log
    message: |
      SMB Ingestion Sentinel Audit Summary:
      Host: {{ inputs.smb_host }}:{{ inputs.smb_port }}
      Share Path: {{ inputs.smb_share_path }}
      Quarantine Path: {{ inputs.quarantine_share_path }}
      Pattern: {{ inputs.file_pattern }}
      Health Status: {{ taskrun.labels.health_status }}
      Execution ID: {{ execution.id }}
      Timestamp: {{ execution.startDate }}

extend:
  title: SMB Share Ingestion Stall and Quarantine Sentinel
  metaTitle: SMB Share Ingestion Stall and Quarantine Sentinel | Kestra
  shortDescription: Audits enterprise SMB and CIFS network shares for batch ingestion stalls, isolates corrupted drops into quarantine folders, and notifies Slack.
  metaDescription: Audit enterprise SMB network shares for pipeline stalls, isolate zero-byte files to quarantine folders, and dispatch Slack alerts before downstream ETL fails.
  description: |
    Enterprise batch processing across banking, healthcare, and retail frequently depends on shared Windows and CIFS network storage (SMB) to exchange scheduled transactions, billing data, and partner data drops. When upstream partners fail to deliver expected files or drop incomplete zero-byte payloads, downstream ELT and analytical workloads either fail abruptly or execute against partial data.

    This sentinel workflow automates the health verification of SMB network shares. It periodically scans target directories using the Kestra SMB plugin, assesses file counts and payloads against expected delivery windows, classifies pipeline health into tri-state operating tiers (CRITICAL_STALL, WARNING_CORRUPT, or HEALTHY), dispatches actionable Slack incident notifications with root-cause context, isolates problematic files into designated quarantine folders, and records an immutable audit ledger entry.

    ## How it works

    1. A periodic `Schedule` trigger wakes the workflow every 15 minutes to inspect the designated SMB incoming directory.
    2. The workflow executes `io.kestra.plugin.fs.smb.List` to retrieve all files matching the configured regular expression pattern, sorting entries chronologically.
    3. An execution `Labels` task evaluates discovered files against expected arrival thresholds and file integrity metrics, assigning an operational status tier.
    4. A `Switch` flow-control task routes execution based on the evaluated health tier.
    5. In the event of a missing feed or stalled arrival, a critical Slack incident notification is dispatched via `io.kestra.plugin.slack.notifications.SlackIncomingWebhook`.
    6. When corrupt or malformed files are detected, an automated `Move` task transfers the offending file out of the active ingestion path into a quarantine directory to prevent downstream pipeline crashes.
    7. A final `Log` task outputs structured audit telemetry summarizing inspected file counts, execution timestamps, and remediation actions.

    ## What you get

    - Automated continuous probing of enterprise SMB and CIFS network shares without requiring manual engineer check-ins.
    - Proactive detection of stalled upstream ingestion feeds before downstream analytics models or data warehouse pipelines execute.
    - Automated file quarantine isolation preventing corrupt, truncated, or zero-byte files from crashing production ETL workflows.
    - Immediate multi-tiered Slack alerts with execution references and diagnostic share metadata.
    - Comprehensive audit logs tracking every inspection cycle and remediation step for operational compliance.

    ## Who it's for

    - Data Engineers managing legacy file-based ETL pipelines reliant on SMB, CIFS, or Windows network storage.
    - Platform and Infrastructure Engineers responsible for shared storage gateways, NAS appliances, and enterprise file servers.
    - Site Reliability Engineers needing automated health gates and incident response mechanisms for partner file exchanges.

    ## Why orchestrate this with Kestra

    - Declarative YAML orchestration replaces fragmented cron jobs, PowerShell scripts, and ad-hoc batch scripts with maintainable workflows.
    - Built-in SMB and CIFS task primitives (`List`, `Move`, `Download`, `Upload`) eliminate external driver installations and complex SMB mounting.
    - Centralized secret management securely masks network share credentials and webhook tokens.
    - Native execution state tracking and audit histories provide complete visibility into every file inspection and quarantine event.

    ## Prerequisites

    - Access to an SMB/CIFS file server, Windows File Share, or Samba container reachable over TCP port 445.
    - A service account with read and write permissions to the monitored share directories.
    - An incoming Slack webhook URL for alert routing.

    ### Secrets

    - `SMB_PASSWORD`: Service account password for authenticating to the SMB network share (required).
    - `SLACK_WEBHOOK_URL`: Incoming webhook URL for posting incident notifications to the storage operations channel (required).

    ## Quick start

    1. Configure the `SMB_PASSWORD` and `SLACK_WEBHOOK_URL` secrets in your Kestra namespace.
    2. Import this blueprint into your Kestra instance.
    3. Execute the flow with default inputs (`simulate_local_mode: true`) to verify the workflow logic, triage routing, and logging outputs without connecting to an external share.
    4. Set `simulate_local_mode: false`, update `smb_host` and `smb_share_path` to point to your production SMB server, and activate the scheduled trigger.

    ## How to extend

    - Add an automated PagerDuty or Opsgenie alert task inside the `CRITICAL_STALL` branch for off-hours escalation.
    - Integrate downstream ETL flow triggers via `io.kestra.plugin.core.flow.SubflowExecution` to automatically launch data warehouse ingestion once the SMB health check confirms a healthy batch.
    - Implement file checksum verification by downloading verified files into Kestra internal storage and calculating SHA-256 hashes before ingestion.

    ## Links

    - [Kestra SMB Plugin Documentation](https://kestra.io/plugins/plugin-fs/tasks/smb)
    - [Samba Official Documentation](https://www.samba.org/samba/docs/)
  tags:
    - Infrastructure
  subTags:
    - Day 2 Operations
    - Incident Response
  ee: false
  demo: false
