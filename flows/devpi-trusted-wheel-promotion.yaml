id: devpi-trusted-wheel-promotion
namespace: company.release
description: Verify a wheel against an independently approved release lock, upload only those exact bytes to a devpi
  index, then download the published file and verify its hash.
inputs:
- id: wheel
  type: FILE
  description: Candidate wheel from staging; never executed.
- id: release_lock
  type: FILE
  description: Independently approved JSON with filename, name, version and sha256. Obtain from protected release
    configuration, not from the candidate artifact.
- id: target_index
  type: STRING
  description: HTTPS devpi user/index URL. Use a non-volatile index with public read access and restricted upload
    access.
tasks:
- id: promotion
  type: io.kestra.plugin.core.flow.WorkingDirectory
  inputFiles:
    candidate.whl: '{{ inputs.wheel }}'
    release-lock.json: '{{ inputs.release_lock }}'
  tasks:
  - id: verify
    type: io.kestra.plugin.scripts.python.Script
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    script: |
      import hashlib
      import json
      import os
      import re
      import shutil
      from pathlib import Path

      if not 0 < Path('release-lock.json').stat().st_size <= 16384:
          raise ValueError('Release lock must be between 1 byte and 16 KiB')
      lock = json.loads(Path('release-lock.json').read_text(encoding='utf-8'))
      if set(lock) != {'filename', 'sha256', 'name', 'version'}:
          raise ValueError('Expected filename, sha256, name and version from the approved release lock')
      filename = lock['filename']
      if not all(isinstance(lock[key], str) for key in lock):
          raise ValueError('Release lock fields must be strings')
      if not isinstance(filename, str) or not re.fullmatch(r'[A-Za-z0-9_][A-Za-z0-9_.+-]{0,199}\.whl', filename):
          raise ValueError('Invalid wheel filename')
      if not re.fullmatch(r'[a-f0-9]{64}', lock['sha256']):
          raise ValueError('Expected a lowercase SHA256')
      for key in ('name', 'version'):
          if not isinstance(lock[key], str) or not re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9_.+-]{0,99}', lock[key]):
              raise ValueError('Invalid release identity')
      source = Path('candidate.whl')
      if not 0 < source.stat().st_size <= 67108864:
          raise ValueError('Wheel must be between 1 byte and 64 MiB')
      digest = hashlib.sha256(source.read_bytes()).hexdigest()
      if digest != lock['sha256']:
          raise ValueError('Candidate differs from the independently approved release lock')
      import zipfile
      from email.parser import BytesParser
      with zipfile.ZipFile(source) as archive:
          metadata = [x for x in archive.infolist() if x.filename.endswith('.dist-info/METADATA')]
          if len(metadata) != 1 or metadata[0].file_size > 1048576:
              raise ValueError('Expected one bounded wheel METADATA entry')
          fields = BytesParser().parsebytes(archive.read(metadata[0]))
      normalize = lambda value: re.sub(r'[-_.]+', '-', value).lower()
      if normalize(fields.get('Name', '')) != normalize(lock['name']) or fields.get('Version') != lock['version']:
          raise ValueError('Wheel metadata does not match approved release identity')
      Path('verified').mkdir(exist_ok=True)
      shutil.copyfile(source, Path('verified') / filename)
      Path('verification.json').write_text(json.dumps(lock, indent=2))
      print('Verified approved wheel:', filename)
    timeout: PT5M
  - id: upload
    type: io.kestra.plugin.scripts.python.Script
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    script: |
      import hashlib
      import json
      import os
      import subprocess
      import sys
      import re
      from pathlib import Path
      from urllib.parse import urlsplit

      lock = json.loads(Path('verification.json').read_text())
      wheel = Path('verified') / lock['filename']
      if hashlib.sha256(wheel.read_bytes()).hexdigest() != lock['sha256']:
          raise ValueError('Verified wheel changed before upload')
      target = os.environ['TARGET_INDEX'].rstrip('/')
      parsed = urlsplit(target)
      if parsed.scheme != 'https' or not parsed.hostname or parsed.username or parsed.password or parsed.query or parsed.fragment:
          raise ValueError('Use an HTTPS index URL without embedded credentials, query or fragment')
      if not all(re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9_.-]{0,99}', part) for part in parsed.path.strip('/').split('/')) or len([part for part in parsed.path.split('/') if part]) != 2:
          raise ValueError('Use a devpi user/index URL')
      import urllib.request
      request = urllib.request.Request(target, headers={'Accept': 'application/json'})
      class NoRedirect(urllib.request.HTTPRedirectHandler):
          def redirect_request(self, req, fp, code, msg, headers, newurl):
              raise ValueError('Unexpected index redirect')
      with urllib.request.build_opener(NoRedirect).open(request, timeout=30) as response:
          raw = response.read(1048577)
      if len(raw) > 1048576:
          raise ValueError('Index configuration exceeds 1 MiB')
      config = json.loads(raw)
      if config.get('type') != 'indexconfig' or config.get('result', {}).get('volatile') is not False:
          raise ValueError('Destination must be a non-volatile devpi index')
      subprocess.run([sys.executable, '-m', 'twine', 'upload', '--non-interactive',
                      '--disable-progress-bar', '--repository-url', target + '/', str(wheel)],
                     check=True, timeout=180)
    timeout: PT5M
    env:
      TARGET_INDEX: '{{ inputs.target_index }}'
      TWINE_USERNAME: '{{ secret(''DEVPI_UPLOAD_USERNAME'') }}'
      TWINE_PASSWORD: '{{ secret(''DEVPI_UPLOAD_PASSWORD'') }}'
      TWINE_NON_INTERACTIVE: '1'
  - id: readback
    type: io.kestra.plugin.scripts.python.Script
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    script: |
      import hashlib
      import json
      import os
      import urllib.request
      from pathlib import Path
      from urllib.parse import urlsplit, quote, unquote

      lock = json.loads(Path('verification.json').read_text())
      target = os.environ['TARGET_INDEX'].rstrip('/')
      class NoRedirect(urllib.request.HTTPRedirectHandler):
          def redirect_request(self, req, fp, code, msg, headers, newurl):
              raise ValueError('Unexpected registry redirect')
      opener = urllib.request.build_opener(NoRedirect)
      request = urllib.request.Request(target + '/' + quote(lock['name'], safe='') + '/' + quote(lock['version'], safe=''),
                                       headers={'Accept': 'application/json'})
      with opener.open(request, timeout=30) as response:
          raw = response.read(1048577)
      if len(raw) > 1048576:
          raise ValueError('Registry response exceeds 1 MiB')
      metadata = json.loads(raw)['result']
      links = [x for x in metadata.get('+links', []) if x.get('rel') == 'releasefile'
               and unquote(urlsplit(x.get('href', '')).path).rsplit('/', 1)[-1] == lock['filename']]
      if len(links) != 1:
          raise ValueError('Registry does not expose exactly one promoted wheel')
      url = links[0]['href']
      a, b = urlsplit(target), urlsplit(url)
      if a.scheme != b.scheme or a.netloc != b.netloc or not b.path.startswith(a.path.rstrip('/') + '/+f/'):
          raise ValueError('Registry returned an unexpected artifact URL')
      with opener.open(url, timeout=30) as response:
          content = response.read(67108865)
      if len(content) > 67108864 or hashlib.sha256(content).hexdigest() != lock['sha256']:
          raise ValueError('Promoted registry bytes differ from the approved wheel')
      Path('promotion-receipt.json').write_text(json.dumps({**lock, 'index': target, 'artifact_url': url,
                                                            'readback_verified': True}, indent=2))
      print('Registry read-back matches the approved SHA256')
    timeout: PT5M
    env:
      TARGET_INDEX: '{{ inputs.target_index }}'
    outputFiles:
    - promotion-receipt.json
outputs:
- id: receipt
  type: FILE
  required: false
  value: '{{ outputs.readback.outputFiles[''promotion-receipt.json''] ?? null }}'
extend:
  title: Promote an approved wheel to devpi and verify registry bytes
  metaTitle: Trusted Python wheel promotion to devpi | Kestra
  shortDescription: Check an independently approved wheel hash, upload only the verified file to devpi, and verify
    the published bytes.
  metaDescription: Promote a wheel to devpi only after its hash matches an approved release lock, then download
    the published artifact and verify the exact bytes.
  description: |
    A wheel's internal RECORD is not independent evidence of trust. This flow checks an approved whole-file hash before a real registry upload, then verifies what the registry serves. It promotes one wheel, not every artifact belonging to the same version.

    ## How it works
    1. Supply the staging wheel and a separately approved JSON release lock with filename, name, version and sha256.
    2. Validate the bounded wheel, whole-file SHA256 and package identity without importing the package.
    3. Recheck the local bytes and upload that file with Twine to the selected devpi user/index. No version-wide devpi push or skip-existing is used.
    4. Read the release metadata from that index, download the matching file and compare its SHA256. Export a receipt only after success.

    ## What you get
    - A real upload, followed by verification of the registry's bytes.
    - Hash or identity mismatches stop before upload.
    - A receipt recording the approved hash and published URL.
    - A failed read-back leaves the upload in place and the execution failed; this is not an atomic transaction or automatic rollback.

    ## Who it's for
    Release engineers promoting an approved Python build from staging to an internal production index.

    ## Why orchestrate this with Kestra
    Separate task states tie approval evidence and upload to a registry receipt. Unlike the offline wheelhouse flow, this writes to a destination registry rather than creating an installation bundle.

    ## Prerequisites
    - Linux Process worker with Python 3.11+ and Twine 7.0.0 installed, plus the Python scripts plugin.
    - An existing HTTPS devpi index with public read access, restricted upload access and volatile=false. No index or account is created by the flow.
    - A wheel no larger than 64 MiB and an independently approved JSON lock. Do not accept the wheel and lock together from an untrusted producer.
    - Trust in the configured registry, its TLS certificate and the operator-approved target. This verifies artifact identity, not malware safety or reproducibility.

    ### Secrets
    - DEVPI_UPLOAD_USERNAME and DEVPI_UPLOAD_PASSWORD: destination upload credentials.

    ## Quick start
    1. Configure the existing index and secrets. Prepare the approved JSON lock outside this workflow.
    2. Run manually with wheel, release_lock and target_index. The operator must already be authorized to select the target and approved lock.
    3. Inspect the receipt and the registry. For any failed read-back, investigate before retrying; the upload may already exist.

    ## How to extend
    Add your release-approval subflow before promotion, or verify registry attestations in addition to the approved hash.

    ## Links
    - [Python tasks](https://kestra.io/plugins/plugin-script-python)
    - [Twine upload](https://twine.readthedocs.io/en/stable/)
    - [devpi release process](https://devpi.net/docs/devpi/devpi/stable/+doc/quickstart-releaseprocess.html)
  tags:
  - Infrastructure
  subTags:
  - CI/CD & Deployment
  ee: false
  demo: false
