id: airbyte-sync-job-consecutive-failures-sentinel
namespace: company.team

inputs:
  - id: airbyte_api_url
    type: STRING
    defaults: "http://airbyte-server.internal:8001/api/v1"
    description: Base URL of the Airbyte configuration API.
  - id: connection_id
    type: STRING
    description: Target Airbyte Connection UUID to audit.
    defaults: "00000000-0000-0000-0000-000000000000"
  - id: failure_threshold
    type: INT
    defaults: 2
    description: "Consecutive failed sync runs to trigger an incident (default 2)."

tasks:
  - id: check_sync_history
    type: io.kestra.plugin.scripts.python.Script
    description: Scrapes Airbyte configuration API for recent job history and checks consecutive sync failure streaks.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests kestra
    env:
      AIRBYTE_URL: "{{ inputs.airbyte_api_url }}"
      CONNECTION_ID: "{{ inputs.connection_id }}"
      FAILURE_THRESHOLD: "{{ inputs.failure_threshold }}"
    script: |
      import os
      import sys
      import json
      import requests
      from kestra import Kestra

      api_url = os.environ.get("AIRBYTE_URL", "http://airbyte-server.internal:8001/api/v1").rstrip("/")
      conn_id = os.environ.get("CONNECTION_ID", "")
      threshold = int(os.environ.get("FAILURE_THRESHOLD", "2"))

      jobs_url = f"{api_url}/jobs/list"
      payload = {
          "configTypes": ["sync"],
          "configId": conn_id,
          "pagination": {"pageSize": 10, "rowOffset": 0}
      }

      try:
          resp = requests.post(jobs_url, json=payload, timeout=15)
          resp.raise_for_status()
          res = resp.json()
      except Exception as exc:
          print(f"CRITICAL: Failed to query Airbyte API at {jobs_url}: {exc}", file=sys.stderr)
          sys.exit(1)

      jobs = res.get("jobs", [])
      consecutive_failures = 0
      for item in jobs:
          status = item.get("job", {}).get("status", "")
          if status == "failed":
              consecutive_failures += 1
          elif status == "succeeded":
              break

      is_breached = bool(consecutive_failures >= threshold)

      report = {
          "connection_id": conn_id,
          "consecutive_failures": consecutive_failures,
          "threshold": threshold,
          "is_breached": is_breached,
          "total_jobs_inspected": len(jobs)
      }

      with open("airbyte_sync_report.json", "w") as f:
          json.dump(report, f, indent=2)

      print(f"Airbyte Audit: Connection={conn_id}, ConsecutiveFailures={consecutive_failures}, Breached={is_breached}")

      Kestra.outputs({
          "is_breach": 1 if is_breached else 0,
          "failure_count": consecutive_failures,
          "total_jobs_checked": len(jobs)
      })
    outputFiles:
      - airbyte_sync_report.json

  - id: evaluate_airbyte_incident
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.check_sync_history.vars.is_breach | int == 1 }}"
    then:
      - id: notify_dataops_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#dataops-alerts",
            "text": "CRITICAL: Airbyte Connection `{{ inputs.connection_id }}` has failed `{{ outputs.check_sync_history.vars.failure_count }}` consecutive times (threshold: `{{ inputs.failure_threshold }}`). Ingestion pipelines halted."
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "#dataops-alerts",
        "text": "CRITICAL: Airbyte Sentinel failed communicating with Airbyte API server at `{{ inputs.airbyte_api_url }}`. Execution ID: `{{ execution.id }}`."
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/20 * * * *"
    disabled: true

extend:
  title: Airbyte Connection Sync Consecutive Failure Sentinel
  metaTitle: Airbyte Connection Sync Consecutive Failure Sentinel Blueprint
  shortDescription: Audits Airbyte API endpoints for repeated connector sync job failures to prevent data pipeline disruption.
  metaDescription: Audits Airbyte API endpoints for repeated connector sync job failures to prevent data pipeline disruption.
  description: |
    ## How it works
    This workflow queries the Airbyte configuration API (`/api/v1/jobs/list`) for historical execution logs belonging to a specific Connection ID. It iterates chronologically backwards through recent synchronization jobs and tallies consecutive `failed` runs until a `succeeded` execution is found. If consecutive failures meet or exceed `failure_threshold`, it flags an active connection outage and dispatches an alert with error context to Slack.

    ## Architecture diagram
    ```mermaid
    flowchart TD
      A[periodic_schedule Schedule Trigger] --> B[check_sync_history Python Script]
      B --> C{Consecutive Failures >= Threshold?}
      C -- Yes --> D[notify_dataops_team Webhook]
      C -- No --> E[Sync Nominal]
    ```

    ## Prerequisites
    - Airbyte server API endpoint reachable over HTTP.
    - Secret `SLACK_WEBHOOK_URL` configured in Kestra.

    ## Quick start
    1. Import the blueprint under the `company.team` namespace.
    2. Configure `airbyte_api_url` and target `connection_id`.
    3. Run manually to check connection health.

    ## Links
    - [Airbyte API Documentation](https://reference.airbyte.com/reference/overview)
    - [Kestra Python Script Documentation](https://kestra.io/plugins/plugin-scripts-python)
  tags:
    - Data
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - Day 2 Operations
  ee: false
  demo: false
