id: airbyte-sync-job-consecutive-failures-sentinel
namespace: company.team

inputs:
  - id: airbyte_api_url
    type: STRING
    defaults: "http://airbyte-server.internal:8001/api/v1"
    description: Base URL of the Airbyte configuration API.
  - id: connection_id
    type: STRING
    description: Target Airbyte Connection UUID to audit.
  - id: failure_threshold
    type: INT
    defaults: 2
    description: "Consecutive failed sync runs to trigger an incident (default 2)."

tasks:
  - id: check_sync_history
    type: io.kestra.plugin.scripts.python.Script
    description: Queries the Airbyte configuration API for recent synchronization jobs and evaluates consecutive failure counts.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests kestra
    env:
      AIRBYTE_URL: "{{ inputs.airbyte_api_url }}"
      CONNECTION_ID: "{{ inputs.connection_id }}"
      FAILURE_THRESHOLD: "{{ inputs.failure_threshold }}"
    script: |
      import os
      import sys
      import requests
      from kestra import Kestra

      base_url = os.environ.get("AIRBYTE_URL", "http://airbyte-server.internal:8001/api/v1").rstrip("/")
      conn_id = os.environ.get("CONNECTION_ID", "")
      threshold = int(os.environ.get("FAILURE_THRESHOLD", "2"))

      try:
          resp = requests.post(
              f"{base_url}/jobs/list",
              headers={"Content-Type": "application/json"},
              json={
                  "configTypes": ["sync"],
                  "configId": conn_id,
                  "pagination": {"pageSize": 10, "rowOffset": 0}
              },
              timeout=15
          )
          resp.raise_for_status()
          data = resp.json()
      except Exception as err:
          print(f"CRITICAL: Failed to query Airbyte API: {err}", file=sys.stderr)
          sys.exit(1)

      jobs = data.get("jobs", [])
      failures = 0
      for item in jobs:
          status = item.get("job", {}).get("status")
          if status == "failed":
              failures += 1
          elif status == "succeeded":
              break

      is_breach = bool(failures >= threshold)
      print(f"Airbyte Audit Complete: Connection={conn_id}, Failures={failures}, Threshold={threshold}, Breach={is_breach}")

      Kestra.outputs({
          "is_breach": is_breach,
          "failure_count": failures
      })

  - id: evaluate_airbyte_incident
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.check_sync_history.vars.is_breach }}"
    then:
      - id: notify_dataops_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#dataops-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 Airbyte Sync Failure Sentinel Alert",
                "text": "Airbyte Connection {{ inputs.connection_id }} has failed {{ outputs.check_sync_history.vars.failure_count }} consecutive times (threshold {{ inputs.failure_threshold }}). Ingestion pipelines are halted.",
                "footer": "Kestra Ingestion Sentinel • Airbyte"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "#dataops-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ Airbyte Sentinel Failure",
            "text": "Failed to communicate with Airbyte API server at {{ inputs.airbyte_api_url }}.",
            "footer": "Kestra Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/20 * * * *"
    disabled: true

extend:
  metaDescription: "Audits Airbyte API endpoints for repeated connector sync job failures to prevent data pipeline disruption."
  metaTitle: Airbyte Connection Sync Consecutive Failure Sentinel with Kestra
  ee: false
  demo: false
  title: Airbyte Connection Sync Consecutive Failure Sentinel
  shortDescription: Audits Airbyte API endpoints for repeated connector sync job failures to prevent data pipeline disruption.
  description: |
    ## How it works
    This workflow queries the Airbyte configuration API (`/api/v1/jobs/list`) for historical execution logs belonging to a specific Connection ID. It iterates chronologically backwards through recent synchronization jobs and tallies consecutive `failed` runs until a `succeeded` execution is found. If consecutive failures meet or exceed `failure_threshold`, it flags an active connection outage and dispatches an alert with error context to the data operations channel.

    ## What you get
    - Real-time detection of broken ELT ingestion connectors.
    - Protection against schema drift silent failures and expired API tokens.
    - Automated Slack incident notifications with consecutive failure counts.

    ## Who it's for
    - Analytics Engineers responsible for ELT replication pipelines.
    - Data Platform teams managing Airbyte instances on Kubernetes.
    - Database Administrators monitoring CDC sync health.

    ## Why orchestrate this with Kestra
    - **Centralized Alerting**: Unifies ingestion alerts with downstream transformation monitoring.
    - **Intelligent Retries**: Enables Kestra to trigger automated connection resets or sync retries.
    - **Audit Trail**: Logs all connection state checks for historical compliance and uptime tracking.

    ## Prerequisites
    - Running Airbyte instance with accessible configuration API.
    - Target Connection UUID.
    - Slack Webhook URL configured in `SLACK_WEBHOOK_URL` secret.

    ## Quick start
    1. Import this blueprint into Kestra.
    2. Set `SLACK_WEBHOOK_URL` secret in namespace settings.
    3. Provide your Airbyte connection UUID in `connection_id`.
    4. Enable the schedule trigger for continuous sync audit.

    ## How to extend
    - Add a remediation task calling `POST /api/v1/connections/sync` to retry failed syncs after a delay.
    - Fetch and display the last job failure stack trace in the Slack notification payload.
    - Integrate with Jira to automatically open a ticket for data connector breakages.

    ## Links
    - [Airbyte API Documentation](https://reference.airbyte.com/)
    - [Kestra Shell Plugin](https://kestra.io/plugins/plugin-scripts-shell)
    - [Kestra Slack Notifications](https://kestra.io/plugins/plugin-slack)
  tags:
    - Data
    - Infrastructure
  subTags:
    - ELT & Data Landing
    - Day 2 Operations
