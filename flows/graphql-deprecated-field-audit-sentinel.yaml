id: graphql-deprecated-field-audit-sentinel
namespace: company.platform

inputs:
  - id: graphql_endpoint_url
    type: STRING
    displayName: GraphQL Endpoint URL
    defaults: "https://api.example.com/graphql"
    description: Full HTTP or HTTPS URL of the GraphQL schema endpoint to inspect for deprecated fields and enum values.

  - id: max_allowed_deprecated_fields
    type: INT
    displayName: Maximum Allowed Deprecated Fields
    defaults: 0
    description: Threshold of deprecated fields allowed before triggering an alert. Set to 0 to alert on any detected deprecated field.

  - id: fail_on_threshold_breach
    type: BOOL
    displayName: Fail on Threshold Breach
    defaults: false
    description: Whether to fail the execution if deprecated fields exceed the threshold, acting as a strict CI/CD gate.

triggers:
  - id: weekly_deprecation_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: Weekly scheduled scan to track schema deprecation lifecycle and sunsetting progress. Shipped disabled by default.
    cron: "0 9 * * 1"
    disabled: true
    inputs:
      graphql_endpoint_url: "https://api.example.com/graphql"
      max_allowed_deprecated_fields: 0

tasks:
  - id: query_schema_deprecations
    type: io.kestra.plugin.graphql.Request
    description: Execute an introspection query retrieving all schema types with their deprecated fields, enum values, and deprecation reasons.
    uri: "{{ inputs.graphql_endpoint_url }}"
    headers:
      User-Agent: "Kestra-GraphQL-Deprecation-Sentinel/1.0"
      Authorization: "Bearer {{ secret('GRAPHQL_AUTH_TOKEN') }}"
    failOnGraphQLErrors: false
    query: |
      query AuditSchemaDeprecations {
        __schema {
          types {
            name
            kind
            fields(includeDeprecated: true) {
              name
              isDeprecated
              deprecationReason
            }
            enumValues(includeDeprecated: true) {
              name
              isDeprecated
              deprecationReason
            }
          }
        }
      }
    options:
      allowFailed: true

  - id: evaluate_deprecations
    type: io.kestra.plugin.core.flow.If
    description: Check whether discovered deprecated fields exceed the configured threshold.
    condition: "{{ outputs.query_schema_deprecations.body is defined and outputs.query_schema_deprecations.body.__schema is defined and ((outputs.query_schema_deprecations.body | jq('[.__schema.types[]? | .fields[]? | select(.isDeprecated == true)] | length') | first) | int) > inputs.max_allowed_deprecated_fields }}"
    then:
      - id: alert_deprecated_fields_digest
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Post a detailed summary to Slack listing deprecated fields, parent types, and deprecation reasons.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "📋 *GraphQL Schema Deprecation Alert*: Found {{ outputs.query_schema_deprecations.body | jq('[.__schema.types[]? | .fields[]? | select(.isDeprecated == true)] | length') | first }} deprecated field(s) on `{{ inputs.graphql_endpoint_url }}` (Threshold: {{ inputs.max_allowed_deprecated_fields }}).\n\n*Deprecated Items:* {{ outputs.query_schema_deprecations.body | jq('[.__schema.types[]? | .name as $t | .fields[]? | select(.isDeprecated == true) | $t + \".\" + .name + \" (\" + (.deprecationReason // \"no reason provided\") + \")\"] | .[0:10] | join(\"; \")') | first }}\n*Execution ID:* {{ execution.id }}"
          }

      - id: check_fail_policy
        type: io.kestra.plugin.core.flow.If
        description: Conditionally fail the pipeline if fail_on_threshold_breach is enabled.
        condition: "{{ inputs.fail_on_threshold_breach }}"
        then:
          - id: fail_deprecation_gate
            type: io.kestra.plugin.core.execution.Fail
            description: Fail execution to halt CI/CD deployment when deprecated field accumulation exceeds tolerance.
    else:
      - id: log_deprecations_healthy
        type: io.kestra.plugin.core.log.Log
        description: Log clean status when deprecated field counts are within acceptable limits.
        message: "HEALTHY: Deprecated field count on {{ inputs.graphql_endpoint_url }} is within acceptable threshold (<= {{ inputs.max_allowed_deprecated_fields }})."

  - id: log_audit_summary
    type: io.kestra.plugin.core.log.Log
    description: Record final audit metrics for compliance and historical tracking.
    message: "GraphQL deprecation audit completed for {{ inputs.graphql_endpoint_url }}. Total deprecated fields discovered: {{ outputs.query_schema_deprecations.body is defined and outputs.query_schema_deprecations.body.__schema is defined ? (outputs.query_schema_deprecations.body | jq('[.__schema.types[]? | .fields[]? | select(.isDeprecated == true)] | length') | first) : 0 }}."

errors:
  - id: alert_on_audit_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alert engineering team if network issues or server errors prevent schema inspection.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "⚠️ *GraphQL Deprecation Sentinel Error*: Execution `{{ execution.id }}` failed while inspecting `{{ inputs.graphql_endpoint_url }}`. Verify endpoint availability."
      }

outputs:
  - id: status
    type: STRING
    value: "{{ outputs.query_schema_deprecations.body is defined and outputs.query_schema_deprecations.body.__schema is defined and ((outputs.query_schema_deprecations.body | jq('[.__schema.types[]? | .fields[]? | select(.isDeprecated == true)] | length') | first) | int) > inputs.max_allowed_deprecated_fields ? 'THRESHOLD_EXCEEDED' : 'HEALTHY' }}"
  - id: deprecated_fields_count
    type: INT
    value: "{{ outputs.query_schema_deprecations.body is defined and outputs.query_schema_deprecations.body.__schema is defined ? ((outputs.query_schema_deprecations.body | jq('[.__schema.types[]? | .fields[]? | select(.isDeprecated == true)] | length') | first) | int) : 0 }}"

extend:
  title: GraphQL deprecated field and schema evolution audit sentinel
  metaTitle: GraphQL Deprecated Field Audit Sentinel | Kestra
  shortDescription: Audit GraphQL schemas for deprecated fields and enum values using introspection, tracking sunsetting timelines with Slack alerts.
  metaDescription: Audit GraphQL schemas for deprecated fields and enum values via introspection, enforce sunsetting thresholds, and alert API teams on stale schema drift.
  description: |
    Govern GraphQL schema evolution and monitor API sunsetting lifecycles by automatically auditing deprecated fields, arguments, and enum values. When evolving public or federated GraphQL APIs, backend teams tag outdated fields with `@deprecated(reason: "...")` to warn consumer applications before final removal. However, without automated auditing, deprecated fields frequently accumulate indefinitely, confusing client developers and inflating maintenance costs. This sentinel periodically queries your GraphQL schema introspection endpoint with `includeDeprecated: true`, tallies all deprecated members across all types, evaluates counts against tolerance thresholds, and publishes an actionable Slack digest complete with deprecation reasons.

    ## How it works
    1. A `Schedule` trigger initiates the audit on a weekly cadence every Monday at 09:00 UTC (shipped disabled by default).
    2. Task `query_schema_deprecations` uses `io.kestra.plugin.graphql.Request` to query the GraphQL introspection system for `__schema.types`, explicitly requesting `fields(includeDeprecated: true)` and `enumValues(includeDeprecated: true)` alongside `isDeprecated` and `deprecationReason`.
    3. Task `evaluate_deprecations` (`io.kestra.plugin.core.flow.If`) counts all deprecated fields across types using jq filtering and compares the total against `inputs.max_allowed_deprecated_fields`:
       - If the threshold is exceeded: Task `alert_deprecated_fields_digest` sends a formatted Slack notification listing the total count and top deprecated fields with reasons. If `inputs.fail_on_threshold_breach` is true, task `fail_deprecation_gate` (`io.kestra.plugin.core.execution.Fail`) terminates the workflow with an error.
       - If within threshold: Task `log_deprecations_healthy` records healthy compliance.
    4. Task `log_audit_summary` outputs structured metrics including total deprecated counts.
    5. Top-level `errors` handler catches connection errors or unreachable endpoints.

    ## What you get
    - Continuous visibility into deprecated fields across internal microservices, federated subgraphs, or public APIs.
    - Automated detection of forgotten deprecated fields to keep schema documentation clean and concise.
    - Detailed Slack digests displaying exact parent types, field names, and migration recommendations.
    - Configurable deployment gate to prevent merging changes that introduce excess technical debt.

    ## Who it's for
    - API Platform and Core Infrastructure teams maintaining public or internal GraphQL services.
    - Backend Engineers tracking schema migration lifecycles and sunsetting schedules.
    - Developer Experience (DevEx) teams ensuring consistent client developer journeys.

    ## Why orchestrate this with Kestra
    Ad-hoc scripts running on developer laptops fail to provide continuous compliance history or centralized alerting. Kestra provides declarative, version-controlled workflows with native GraphQL querying, jq transformation pipelines, secrets management, and automated scheduling. Rather than building custom API scrapers, your schema governance runs as a production-grade, observable pipeline directly within your orchestrator.

    ## Prerequisites
    - Network connectivity from the Kestra worker to the target GraphQL endpoint.
    - A valid authentication token or API key if the GraphQL endpoint requires credentials.

    ### Secrets
    - `GRAPHQL_AUTH_TOKEN`: Bearer token or API key used in the `Authorization` header to access the schema.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL used to post deprecation digests and error alerts.

    ## Quick start
    1. Add your Slack incoming webhook URL and API token under Kestra Secrets (`SLACK_WEBHOOK_URL` and `GRAPHQL_AUTH_TOKEN`).
    2. Provide your GraphQL endpoint URL in `graphql_endpoint_url` (e.g. `https://api.yourcompany.com/graphql`).
    3. Trigger a manual execution from the Kestra UI to review currently deprecated fields.
    4. Enable the `weekly_deprecation_audit` trigger to receive recurring reports every Monday.

    ## How to extend
    - Compare deprecation counts against previous execution outputs using Kestra KV store to track week-over-week migration velocity.
    - Parse sunset dates within deprecation reasons (e.g., `"Deprecated as of 2026-12-01"`) and trigger high-priority alerts when sunset dates pass.
    - Generate Jira or Linear tickets automatically for deprecated fields that remain unremoved after 90 days.

    ## Links
    - [GraphQL Specification: Deprecation](https://spec.graphql.org/draft/#sec-Field-Deprecation)
    - [Kestra GraphQL Plugin Documentation](https://kestra.io/plugins/plugin-graphql)
    - [Kestra Slack Notification Plugin](https://kestra.io/plugins/plugin-slack)
  tags:
    - Infrastructure
    - Data
  subTags:
    - Policy & Compliance
    - Reporting & Digests
  ee: false
  verified: false
  demo: false
