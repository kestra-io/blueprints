id: cilium-bpf-map-pressure-overflow-sentinel
namespace: company.networking

inputs:
  - id: cilium_metrics_url
    type: STRING
    defaults: "http://cilium.kube-system:9962/metrics"
    description: Prometheus scrape endpoint for Cilium CNI daemon.
  - id: pressure_threshold
    type: FLOAT
    defaults: 0.80
    description: "Maximum allowable eBPF map pressure ratio before alerting (default 0.80 = 80%)."

tasks:
  - id: query_bpf_pressure
    type: io.kestra.plugin.scripts.shell.Commands
    commands:
      - |
        curl -s -f "{{ inputs.cilium_metrics_url }}" > /tmp/cilium_telemetry.txt
        
        # Scrape cilium_bpf_map_pressure metric
        MAX_PRESSURE=$(grep -E "^cilium_bpf_map_pressure" /tmp/cilium_telemetry.txt | awk '{if ($2>max) max=$2} END {print max+0}')
        echo "::set-output name=max_pressure::$MAX_PRESSURE::"

  - id: evaluate_bpf_pressure
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.query_bpf_pressure.vars.max_pressure | float >= inputs.pressure_threshold }}"
    then:
      - id: notify_networking_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#networking-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 Cilium eBPF Map Pressure Critical Alert",
                "text": "Cilium node at `{{ inputs.cilium_metrics_url }}` reached peak eBPF map pressure of *{{ outputs.query_bpf_pressure.vars.max_pressure }}* (threshold {{ inputs.pressure_threshold }})! eBPF connection tracking (conntrack) or NAT maps are near overflow, causing kernel packet drops.",
                "footer": "Kestra Networking Sentinel • Cilium eBPF"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#networking-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ Cilium Sentinel Failure",
            "text": "Failed to scrape Cilium metrics endpoint. Verify daemonset pod status and network access.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  metaDescription: "Monitors Cilium CNI eBPF map pressure to prevent kernel connection table overflow and pod packet dropouts."
  metaTitle: Cilium eBPF Map Pressure and Kernel Conntrack Saturation Sentinel with Kestra
  title: Cilium eBPF Map Pressure and Kernel Conntrack Saturation Sentinel
  shortDescription: Monitors Cilium CNI eBPF map pressure to prevent kernel connection table overflow and pod packet dropouts.
  description: |
    ## How it works
    This workflow connects to the Cilium CNI Prometheus endpoint (`port 9962`) to audit the `cilium_bpf_map_pressure` metric. Cilium relies on Linux kernel eBPF hash tables (maps) to manage connection tracking (conntrack), NAT tables, and network policies. In high-connection microservice environments, when eBPF maps reach capacity (80-100%), the Linux kernel rejects new flow allocations, resulting in silent packet drops, connection resets, and intermittent service DNS resolution failures. This workflow detects pressure build-up and dispatches warnings before connection tables overflow.

    ## What you get
    - Real-time detection of eBPF kernel map capacity saturation.
    - Prevents packet loss and intermittent network dropouts across Kubernetes worker nodes.
    - Clear quantitative ratios on conntrack table headroom.

    ## Who it's for
    - Kubernetes Network Engineers and Platform Reliability Leads.
    - SREs managing high-throughput microservices on Cilium CNI.

    ## Why orchestrate this with Kestra
    - **Continuous Kernel Telemetry Auditing**: Evaluates low-level networking parameters automatically.
    - **Multi-Node Visibility**: Can be run against cluster-wide Prometheus endpoints or specific nodes.
    - **Instant Team Alerting**: Delivers actionable notifications directly to networking on-call channels.

    ## Prerequisites
    - Cilium CNI installed with Prometheus metrics enabled (`prometheus.enabled=true`).
    - Secret `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import the blueprint.
    2. Configure the Cilium metrics endpoint and threshold.
    3. Run the workflow to inspect eBPF map pressure.

    ## How to extend
    - Inspect specific map names using the `map_name` label on `cilium_bpf_map_pressure`.
    - Automatically scale up `bpf.ctMapMax` parameters via CiliumConfig CRD when saturation occurs.

    ## Links
    - [Cilium Prometheus Metrics Reference](https://docs.cilium.io/en/stable/observability/metrics/)
    - [Kestra Documentation](https://kestra.io/docs)
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Day 2 Operations
    - Infrastructure Automation
  ee: false
  demo: false
