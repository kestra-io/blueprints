id: secretsmanager-unused-finder
namespace: company.team
description: |
  Stale secrets nobody reads are rotation debt and breach blast radius.
  This flow lists every Secrets Manager secret, flags the ones not accessed
  within `unused_days` (default 90, including never-accessed secrets), and
  flags secrets not changed within `rotation_days` (default 180) as rotation
  gaps. Report-only: it never deletes or rotates anything, it just shows you
  the evidence sorted by risk.

triggers:
  - id: weekly_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: Runs every Sunday at 06:00 UTC. Shipped disabled; enable after a first successful manual run.
    cron: "0 6 * * 0"
    disabled: true

inputs:
  - id: aws_region
    type: STRING
    defaults: us-east-1
    description: AWS region whose Secrets Manager secrets to audit.
  - id: unused_days
    type: INT
    defaults: 90
    description: Flag secrets not accessed within this many days (or never accessed at all).
  - id: rotation_days
    type: INT
    defaults: 180
    description: Flag secrets not changed within this many days as rotation gaps.

tasks:
  - id: fetch_secrets
    type: io.kestra.plugin.aws.cli.AwsCLI
    description: List all secrets and hand the raw JSON to the analysis step as base64.
    accessKeyId: "{{ secret('AWS_ACCESS_KEY_ID') }}"
    secretKeyId: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
    commands:
      - |
        aws secretsmanager list-secrets --region "{{ inputs.aws_region }}" --output json | base64 -w0

  - id: audit
    type: io.kestra.plugin.aws.cli.AwsCLI
    description: Score every secret for access staleness and rotation gaps, sorted by risk.
    accessKeyId: "{{ secret('AWS_ACCESS_KEY_ID') }}"
    secretKeyId: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
    commands:
      - |
        echo '{{ outputs.fetch_secrets.stdout }}' | base64 -d > /tmp/secrets.json
        python3 << 'PYEOF'
        import json, datetime
        UNUSED_DAYS = {{ inputs.unused_days }}
        ROT_DAYS = {{ inputs.rotation_days }}
        secrets = json.load(open('/tmp/secrets.json')).get('SecretList', [])
        now = datetime.datetime.now(datetime.timezone.utc)

        def parse(ts):
            return datetime.datetime.fromisoformat(str(ts).replace('Z', '+00:00'))

        findings = []
        for s in secrets:
            name = s.get('Name', '?')
            accessed = s.get('LastAccessedDate')
            changed = s.get('LastChangedDate')
            if accessed:
                age_a = (now - parse(accessed)).days
                ev_a = "last accessed %dd ago" % age_a
                unused = age_a > UNUSED_DAYS
            else:
                ev_a = "never accessed"
                unused = True
            if changed:
                age_c = (now - parse(changed)).days
                ev_c = "last changed %dd ago" % age_c
                stale = age_c > ROT_DAYS
            else:
                ev_c = "change date unknown"
                stale = True
            if unused or stale:
                risk = "CRITICAL" if (unused and stale) else ("HIGH" if unused else "MEDIUM")
                findings.append((risk, "%s [%s] - %s, %s" % (name, risk, ev_a, ev_c)))

        rank = {"CRITICAL": 0, "HIGH": 1, "MEDIUM": 2}
        findings.sort(key=lambda f: rank[f[0]])
        print("TOTAL_COUNT=%d" % len(secrets))
        print("FINDINGS_COUNT=%d" % len(findings))
        print("FINDINGS=" + (" | ".join(f[1] for f in findings) if findings else "none"))
        PYEOF

  - id: decide_notify
    type: io.kestra.plugin.core.flow.If
    description: Report secrets needing attention; log a clean line otherwise.
    condition: "{{ outputs.audit.vars.FINDINGS_COUNT != '0' }}"
    then:
      - id: notify
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Report secrets sorted by risk with per-secret age and access evidence.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": ":key: *Secrets Manager hygiene report* (`{{ inputs.aws_region }}`) — {{ outputs.audit.vars.FINDINGS_COUNT }} of {{ outputs.audit.vars.TOTAL_COUNT }} secret(s) need attention (unused > {{ inputs.unused_days }}d or unrotated > {{ inputs.rotation_days }}d), sorted by risk:\n{{ outputs.audit.vars.FINDINGS }}\n\nStale secrets are rotation debt and breach blast radius: rotate the ones still in use, delete the ones nothing reads anymore."
          }
    else:
      - id: log_clean
        type: io.kestra.plugin.core.log.Log
        message: "All {{ outputs.audit.vars.TOTAL_COUNT }} secrets in {{ inputs.aws_region }} were accessed within {{ inputs.unused_days }} days and changed within {{ inputs.rotation_days }} days."

extend:
  title: Secrets Manager Unused Secrets Finder
  metaTitle: Find Unused and Unrotated Secrets Manager Secrets | Kestra
  shortDescription: Audit Secrets Manager for secrets nobody reads and ones past rotation age — report-only, with per-secret evidence sorted by risk.
  metaDescription: Find unused and unrotated Secrets Manager secrets. Weekly hygiene report sorted by risk, with per-secret age and access evidence.
  description: |
    Every secret sitting in Secrets Manager that nobody reads is a liability: it's rotation debt you'll pay during an incident, and blast radius if it ever leaks. Teams create secrets for migrations, experiments, and ex-employees' services — and never clean them up. This blueprint finds them weekly and shows you the evidence, sorted by risk. It never deletes or rotates anything; it just tells you what needs attention.

    ## How it works

    1. A Schedule trigger fires weekly on Sunday at 06:00 UTC (shipped disabled).
    2. `fetch_secrets` calls `list-secrets`, which returns each secret's `LastAccessedDate` and `LastChangedDate`.
    3. `audit` scores every secret: not accessed within `unused_days` (default 90, or never accessed) and not changed within `rotation_days` (default 180). Secrets failing both are CRITICAL, unused-only are HIGH, stale-rotation-only are MEDIUM.
    4. An `If` task posts a Slack report sorted by risk with per-secret age and access evidence — or logs a clean line when everything is healthy.

    ## What you get

    - A weekly list of secrets nobody reads, with "never accessed" called out explicitly.
    - Rotation gaps: secrets older than your rotation policy that are quietly overdue.
    - Risk-ranked output — CRITICAL (unused and unrotated) first, so triage starts at the top.
    - Report-only by design: findings, not surprise deletions.

    ## Who it's for

    Security and platform engineers responsible for secrets hygiene who suspect their Secrets Manager is full of credentials for services that no longer exist.

    ## Why orchestrate this with Kestra

    A manual console review happens once, then never again. As a scheduled flow the audit runs itself against the live API, the staleness thresholds are visible inputs, and the weekly report creates the paper trail compliance asks for.

    ## Prerequisites

    - AWS credentials with `secretsmanager:ListSecrets` in the audited region.
    - A Slack incoming webhook URL.

    ### Secrets

    - `AWS_ACCESS_KEY_ID`: AWS access key for the Secrets Manager API calls.
    - `AWS_SECRET_ACCESS_KEY`: AWS secret key for the Secrets Manager API calls.
    - `SLACK_WEBHOOK_URL`: Incoming webhook URL for the hygiene report.

    ## Quick start

    1. Add the three secrets above to your Kestra namespace.
    2. Set `aws_region` to the region holding your secrets.
    3. Run manually once; confirm the "never accessed" secrets really are dead before deleting any.
    4. Enable the weekly schedule trigger.

    ## How to extend

    - Exclude secrets managed by other AWS services (`OwningService` set, e.g. RDS rotation) from the unused check.
    - Auto-tag stale secrets (`HygieneReview=true`) instead of just reporting.
    - Fan out per-team by parsing a `Team` tag and routing to team channels.

    ## Links

    - [Kestra AWS plugins](https://kestra.io/plugins)
    - [Kestra Slack plugins](https://kestra.io/plugins)
    - [Secrets Manager list-secrets API](https://docs.aws.amazon.com/cli/latest/reference/secretsmanager/list-secrets.html)
    - [Rotating secrets](https://docs.aws.amazon.com/secretsmanager/latest/userguide/rotating-secrets.html)
  tags:
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - Day 2 Operations
  ee: false
  demo: false
