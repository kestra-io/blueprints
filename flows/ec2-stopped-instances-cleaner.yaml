id: ec2-stopped-instances-cleaner
namespace: company.finops

description: |
  Finds EC2 instances that have been stopped for 30+ days and are still burning
  money on attached EBS volumes. Reports the waste per instance with volume
  details, and can optionally terminate the old instances behind an explicit
  opt-in gate (default off, report-only).

inputs:
  - id: aws_regions
    type: ARRAY
    itemType: STRING
    defaults: ["us-east-1"]
    description: AWS regions to audit for long-stopped EC2 instances.
  - id: min_stopped_days
    type: INT
    defaults: 30
    description: Instances stopped longer than this many days are flagged.
  - id: ebs_gb_month_usd
    type: STRING
    defaults: "0.08"
    description: EBS cost per GB-month in USD (gp3 list price). Tune for your volume mix.
  - id: terminate_old
    type: BOOLEAN
    defaults: false
    description: When true, terminate flagged instances. Default false (report-only).

tasks:
  - id: check_stopped
    type: io.kestra.plugin.core.flow.ForEach
    description: Audit stopped instances region by region.
    values: "{{ inputs.aws_regions }}"
    tasks:
      - id: audit_region
        type: io.kestra.plugin.aws.cli.AwsCLI
        description: List stopped instances, age them, total their EBS waste, optionally terminate.
        commands:
          - |
            REGION="{{ taskrun.value }}"
            DAYS={{ inputs.min_stopped_days }}
            PRICE="{{ inputs.ebs_gb_month_usd }}"
            TERMINATE="{{ inputs.terminate_old }}"
            CUTOFF=$(date -u -d "$DAYS days ago" +%s)
            echo "Checking stopped instances in $REGION older than $DAYS days"
            aws ec2 describe-instances --region "$REGION" \
              --filters Name=instance-state-name,Values=stopped \
              --query 'Reservations[].Instances[].[InstanceId,InstanceType,LaunchTime]' \
              --output json > /tmp/stopped.json
            COUNT=$(python3 -c "import json;print(len(json.load(open('/tmp/stopped.json'))))")
            echo "stopped instances found: $COUNT"
            WASTE_IDS=""
            WASTE_TOTAL=0
            TERMINATED_LIST=""
            for IID in $(python3 -c "
            import json,time
            cutoff=$CUTOFF
            for i in json.load(open('/tmp/stopped.json')):
                try:
                    lt=int(time.mktime(time.strptime(i[2][:19],'%Y-%m-%dT%H:%M:%S')))
                except Exception:
                    continue
                if lt < cutoff:
                    print(i[0])
            "); do
              VOLS=$(aws ec2 describe-volumes --region "$REGION" \
                --filters Name=attachment.instance-id,Values="$IID" \
                --query 'Volumes[].[VolumeId,Size]' --output text)
              GB=$(echo "$VOLS" | awk '{s+=$2} END {print s+0}')
              COST=$(python3 -c "print('{:.2f}'.format($GB * float('$PRICE')))")
              WASTE_IDS="${WASTE_IDS}${IID} (${GB}GB EBS ~\$${COST}/mo), "
              WASTE_TOTAL=$(python3 -c "print('{:.2f}'.format(float('$WASTE_TOTAL') + float('$COST')))")
              if [ "$TERMINATE" = "true" ]; then
                aws ec2 terminate-instances --region "$REGION" --instance-ids "$IID" >/dev/null
                TERMINATED_LIST="${TERMINATED_LIST}${IID}, "
                echo "terminated $IID"
              fi
            done
            if [ -n "$WASTE_IDS" ]; then HAS_WASTE=true; else HAS_WASTE=false; fi
            echo "HAS_WASTE=$HAS_WASTE"
            echo "WASTE_IDS=$WASTE_IDS"
            echo "EST_MONTHLY_WASTE=$WASTE_TOTAL"
            echo "TERMINATED=$TERMINATED_LIST"
            echo "REGION_DONE=$REGION"
        env:
          AWS_ACCESS_KEY_ID: "{{ secret('AWS_ACCESS_KEY_ID') }}"
          AWS_SECRET_ACCESS_KEY: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
          AWS_DEFAULT_REGION: "{{ taskrun.value }}"
      - id: notify_region
        type: io.kestra.plugin.core.flow.If
        description: Report waste, stay quiet when nothing is old enough.
        condition: "{{ outputs.audit_region.vars.HAS_WASTE == 'true' }}"
        then:
          - id: slack_waste
            type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
            url: "{{ secret('SLACK_WEBHOOK_URL') }}"
            payload: |
              {
                "text": ":octagonal_sign: EC2 stopped-instance audit `{{ outputs.audit_region.vars.REGION_DONE }}` — instances stopped 30d+ wasting ~${{ outputs.audit_region.vars.EST_MONTHLY_WASTE }}/mo on EBS:\n`{{ outputs.audit_region.vars.WASTE_IDS }}`\nTerminated this run: `{{ outputs.audit_region.vars.TERMINATED }}`\nSnapshot the volumes you want to keep, then terminate the rest."
              }
        else:
          - id: log_clean
            type: io.kestra.plugin.core.log.Log
            message: "No EC2 instances stopped longer than {{ inputs.min_stopped_days }} days in {{ outputs.audit_region.vars.REGION_DONE }}."

triggers:
  - id: weekly
    type: io.kestra.plugin.core.trigger.Schedule
    description: Weekly on Sunday at 02:00 UTC. Shipped disabled; enable after your first manual run.
    cron: "0 2 * * 0"
    disabled: true

extend:
  title: EC2 Stopped Instances Cleaner
  metaTitle: Find Stopped EC2 Instances Wasting EBS Money | Kestra
  shortDescription: Audit stopped EC2 instances older than 30 days across regions, total their attached EBS waste, and optionally terminate them behind an explicit opt-in gate.
  metaDescription: Stopped EC2 instances still bill for EBS. This flow finds 30d+ stopped instances, reports the waste, and can terminate them.
  description: |
    A stopped EC2 instance looks free — it isn't. Every attached EBS volume keeps billing per GB-month, so a forgotten stopped instance quietly costs money for months. This blueprint finds instances stopped longer than your threshold, totals the EBS waste, and can terminate them when you explicitly opt in.

    ## How it works

    1. A Schedule trigger fires weekly on Sunday at 02:00 UTC (shipped disabled).
    2. A ForEach loop audits each region in `aws_regions`.
    3. Per region, the flow lists stopped instances and keeps only those whose launch-to-stopped age exceeds `min_stopped_days` (default 30).
    4. For each old instance it sums attached EBS volume sizes and estimates monthly waste at the gp3 list price.
    5. An `If` task posts a Slack report with instance IDs and waste only when something is found. A second opt-in gate (`terminate_old`, default false) terminates flagged instances.

    ## What you get

    - A weekly list of long-stopped instances with per-instance EBS size and dollar waste.
    - An explicit, default-off terminate path for teams that want the cleanup automated.
    - Multi-region coverage in one run, silence on clean weeks.

    ## Who it's for

    Platform and FinOps teams with dev/test accounts where "I'll restart it later" instances accumulate.

    ## Why orchestrate this with Kestra

    A manual console sweep finds today's waste and is forgotten. As a scheduled flow the audit runs itself, the age threshold is an input, every run is logged, and the dangerous action (terminate) sits behind a deliberate boolean instead of a script someone runs half-awake.

    ## Prerequisites

    - AWS credentials with `ec2:DescribeInstances`, `ec2:DescribeVolumes`, and (only if you enable it) `ec2:TerminateInstances`.
    - A Slack incoming webhook URL.

    ### Secrets

    - `AWS_ACCESS_KEY_ID`: AWS access key for the EC2 API calls.
    - `AWS_SECRET_ACCESS_KEY`: AWS secret key for the EC2 API calls.
    - `SLACK_WEBHOOK_URL`: Incoming webhook URL for the waste report.

    ## Quick start

    1. Add the three secrets above to your Kestra namespace.
    2. Set `aws_regions` and leave `terminate_old` false for the first run.
    3. Review the Slack report, snapshot volumes worth keeping, then flip `terminate_old` to true if you want automation.
    4. Enable the weekly schedule trigger.

    ## How to extend

    - Auto-snapshot volumes before terminating, and tag snapshots with the instance ID.
    - Exclude instances tagged `Keep=true` for known standby capacity.
    - Also flag stopped instances with large instance-store-backed AMIs.

    ## Links

    - [Kestra AWS plugins](https://kestra.io/plugins)
    - [Kestra Slack plugins](https://kestra.io/plugins)
    - [EBS pricing](https://aws.amazon.com/ebs/pricing/)
    - [EC2 describe-instances API](https://docs.aws.amazon.com/cli/latest/reference/ec2/describe-instances.html)
  tags:
    - Infrastructure
  subTags:
    - FinOps & Cost Management
    - Day 2 Operations
  ee: false
  demo: false
