id: unused-vpc-finder
namespace: company.finops

description: |
  Finds VPCs with nothing running in them. Abandoned VPCs from deleted projects
  keep NAT Gateways, endpoints, and EIPs billing behind them. This flow audits
  every non-default VPC for running instances and network interfaces, and
  reports the empty ones so the whole stack can be torn down.

inputs:
  - id: aws_regions
    type: ARRAY
    itemType: STRING
    defaults: ["us-east-1"]
    description: AWS regions to audit for unused VPCs.

tasks:
  - id: find_unused
    type: io.kestra.plugin.core.flow.ForEach
    description: Audit VPCs region by region.
    values: "{{ inputs.aws_regions }}"
    tasks:
      - id: audit_region
        type: io.kestra.plugin.aws.cli.AwsCLI
        description: List non-default VPCs and check for running instances and ENIs.
        commands:
          - |
            REGION="{{ taskrun.value }}"
            echo "Checking VPCs in $REGION"
            aws ec2 describe-vpcs --region "$REGION" \
              --query 'Vpcs[?IsDefault==`false`].[VpcId]' \
              --output text > /tmp/vpcs.txt || true
            EMPTY_COUNT=0
            EMPTY_LIST=""
            while read -r VPC; do
              [ -z "$VPC" ] && continue
              INST=$(aws ec2 describe-instances --region "$REGION" \
                --filters Name=vpc-id,Values="$VPC" Name=instance-state-name,Values=running,pending \
                --query 'length(Reservations[])' --output text 2>/dev/null)
              ENIS=$(aws ec2 describe-network-interfaces --region "$REGION" \
                --filters Name=vpc-id,Values="$VPC" \
                --query 'length(NetworkInterfaces)' --output text 2>/dev/null)
              case "$INST" in ''|'None') INST=0;; esac
              case "$ENIS" in ''|'None') ENIS=0;; esac
              echo "vpc $VPC: $INST running instances, $ENIS interfaces"
              if [ "$INST" -eq 0 ] && [ "$ENIS" -eq 0 ]; then
                EMPTY_LIST="${EMPTY_LIST}${VPC}, "
                EMPTY_COUNT=$((EMPTY_COUNT + 1))
              fi
            done < /tmp/vpcs.txt
            if [ "$EMPTY_COUNT" -gt 0 ]; then HAS_EMPTY=true; else HAS_EMPTY=false; fi
            echo "HAS_EMPTY=$HAS_EMPTY"
            echo "EMPTY_COUNT=$EMPTY_COUNT"
            echo "EMPTY_VPCS=$EMPTY_LIST"
            echo "REGION_DONE=$REGION"
        env:
          AWS_ACCESS_KEY_ID: "{{ secret('AWS_ACCESS_KEY_ID') }}"
          AWS_SECRET_ACCESS_KEY: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
          AWS_DEFAULT_REGION: "{{ taskrun.value }}"
      - id: notify_region
        type: io.kestra.plugin.core.flow.If
        description: Report empty VPCs for teardown review.
        condition: "{{ outputs.audit_region.vars.HAS_EMPTY == 'true' }}"
        then:
          - id: slack_empty
            type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
            url: "{{ secret('SLACK_WEBHOOK_URL') }}"
            payload: |
              {
                "text": ":broom: Empty VPCs in `{{ outputs.audit_region.vars.REGION_DONE }}` — *{{ outputs.audit_region.vars.EMPTY_COUNT }}* with no running instances or interfaces.\n`{{ outputs.audit_region.vars.EMPTY_VPCS }}`\nCheck for NAT Gateways, EIPs, and endpoints inside before deleting the VPC — they bill independently!"
              }
        else:
          - id: log_clean
            type: io.kestra.plugin.core.log.Log
            message: "No empty VPCs in {{ outputs.audit_region.vars.REGION_DONE }} — every VPC has live resources."

triggers:
  - id: weekly
    type: io.kestra.plugin.core.trigger.Schedule
    description: Weekly on Sunday at 02:00 UTC. Shipped disabled; enable after your first manual run.
    cron: "0 2 * * 0"
    disabled: true

extend:
  title: Unused VPC Finder
  metaTitle: Find Empty VPCs Ready for Teardown | Kestra
  shortDescription: Audit non-default VPCs across regions for running instances and interfaces, and get a Slack report of the empty ones ready for teardown.
  metaDescription: Empty VPCs hide billing NAT Gateways and EIPs. This flow finds VPCs with nothing running and reports them weekly.
  description: |
    A VPC itself is free — but the things inside it are not. Every abandoned project VPC keeps its NAT Gateways ($32/mo each), VPC endpoints ($7/mo per AZ), and Elastic IPs ($3.65/mo) billing quietly in the background. Deleting the project and forgetting the VPC is one of the most common AWS money leaks. This blueprint finds the empty ones with the real EC2 API.

    ## How it works

    1. A Schedule trigger fires weekly on Sunday at 02:00 UTC (shipped disabled).
    2. A ForEach loop audits each region in `aws_regions`.
    3. Per region, the flow lists non-default VPCs, then checks each for running/pending instances and any network interfaces.
    4. VPCs with zero of both are flagged empty (default VPCs are always excluded).
    5. An `If` task posts a Slack report with the empty VPC IDs and a reminder to check the billable resources inside before teardown.

    ## What you get

    - A weekly list of VPCs with nothing running in them, ready for teardown review.
    - A pointer at the hidden waste — NAT Gateways, endpoints, and EIPs bill independently of the VPC.
    - Multi-region coverage in one run.
    - Silence when every VPC is live — alerts only on real findings.

    ## Who it's for

    Platform engineers and FinOps teams managing many environments, where deleted projects leave their VPCs behind "just in case."

    ## Why orchestrate this with Kestra

    A one-off CLI session finds today's empty VPCs and is forgotten by next month. As a scheduled Kestra flow the audit runs itself, every run is logged for audit, and adding a region is one list entry — not a new script.

    ## Prerequisites

    - AWS credentials with `ec2:DescribeVpcs`, `ec2:DescribeInstances`, and `ec2:DescribeNetworkInterfaces` permissions.
    - A Slack incoming webhook URL.

    ### Secrets

    - `AWS_ACCESS_KEY_ID`: AWS access key for the EC2 API calls.
    - `AWS_SECRET_ACCESS_KEY`: AWS secret key for the EC2 API calls.
    - `SLACK_WEBHOOK_URL`: Incoming webhook URL for the teardown report.

    ## Quick start

    1. Add the three secrets above to your Kestra namespace.
    2. Set `aws_regions` to the regions you run VPCs in.
    3. Run manually once and review the Slack report (or the clean log line).
    4. Enable the weekly schedule trigger.

    ## How to extend

    - List the billable resources inside each empty VPC (NAT GWs, endpoints, EIPs) for a one-click teardown checklist.
    - Exclude VPCs tagged `Keep=true` for known standby environments.
    - Chain with the NAT Gateway and EIP finder blueprints for a full cleanup pipeline.

    ## Links

    - [Kestra AWS plugins](https://kestra.io/plugins)
    - [Kestra Slack plugins](https://kestra.io/plugins)
    - [VPC pricing components](https://aws.amazon.com/vpc/pricing/)
    - [EC2 describe-vpcs API](https://docs.aws.amazon.com/cli/latest/reference/ec2/describe-vpcs.html)
  tags:
    - Infrastructure
  subTags:
    - FinOps & Cost Management
    - Day 2 Operations
  ee: false
  demo: false
