id: redis-cache-stampede-mitigation-and-ttl-jitter-rebalancer
namespace: company.cache

inputs:
  - id: redis_host
    type: STRING
    displayName: Redis Host
    description: Hostname or IP of the Redis cache server.
    defaults: localhost

  - id: redis_port
    type: INT
    displayName: Redis Port
    description: TCP port of the Redis cache server.
    defaults: 6379

  - id: key_pattern
    type: STRING
    displayName: Cache Key Pattern
    description: Pattern used by SCAN to discover target cache keys (e.g. cache:catalog:*).
    defaults: "cache:catalog:*"

  - id: sample_limit
    type: INT
    displayName: Sample Limit
    description: Maximum number of matching keys to evaluate during the audit pass.
    defaults: 500

  - id: cluster_window_seconds
    type: INT
    displayName: Cluster Window Seconds
    description: Time window in seconds used to group key expirations into temporal buckets.
    defaults: 300

  - id: max_cluster_percent
    type: INT
    displayName: Max Cluster Percentage Threshold
    description: Threshold percentage of sampled keys expiring in a single window that flags a cache stampede risk.
    defaults: 35

  - id: jitter_min_percent
    type: INT
    displayName: Jitter Minimum Percentage
    description: Minimum percentage offset applied to stagger clustered key expirations.
    defaults: 10

  - id: jitter_max_percent
    type: INT
    displayName: Jitter Maximum Percentage
    description: Maximum percentage offset applied to stagger clustered key expirations.
    defaults: 25

  - id: dry_run
    type: SELECT
    displayName: Dry Run
    description: When true, analyze TTL distribution and calculate adjustments without running EXPIRE commands.
    values:
      - "true"
      - "false"
    defaults: "false"

triggers:
  - id: periodic_cache_jitter_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    description: Recurring audit pass to continuously detect and smooth synchronized TTL clustering.
    cron: "0 */6 * * *"
    disabled: true

tasks:
  - id: audit_ttl_distribution
    type: io.kestra.plugin.scripts.python.Script
    description: Non-blockingly scan candidate cache keys, extract TTLs via pipeline, and detect expiration clustering.
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install redis
    env:
      REDIS_PASSWORD: "{{ secret('REDIS_PASSWORD') }}"
    script: |
      import os
      import json
      import math
      import redis
      from kestra import Kestra

      host = "{{ inputs.redis_host }}"
      port = {{ inputs.redis_port }}
      password = os.environ.get("REDIS_PASSWORD") or None
      pattern = "{{ inputs.key_pattern }}"
      sample_limit = {{ inputs.sample_limit }}
      window_sec = {{ inputs.cluster_window_seconds }}
      threshold_pct = {{ inputs.max_cluster_percent }}

      client = redis.Redis(
          host=host,
          port=port,
          password=password,
          decode_responses=True,
          socket_connect_timeout=10,
          socket_timeout=10
      )

      cursor = 0
      sampled_keys = []
      while len(sampled_keys) < sample_limit:
          cursor, batch = client.scan(cursor=cursor, match=pattern, count=min(100, sample_limit - len(sampled_keys)))
          sampled_keys.extend(batch)
          if cursor == 0:
              break

      total_sampled = len(sampled_keys)
      if total_sampled == 0:
          print("No keys found matching pattern:", pattern)
          report = {
              "total_sampled": 0,
              "expiring_keys_count": 0,
              "stampede_risk": False,
              "peak_cluster_percentage": 0.0,
              "risk_status": "NO_KEYS_FOUND"
          }
          with open("ttl_audit_report.json", "w") as f:
              json.dump(report, f, indent=2)
          Kestra.outputs(report)
          exit(0)

      pipe = client.pipeline(transaction=False)
      for k in sampled_keys:
          pipe.ttl(k)
      ttls = pipe.execute()

      key_ttl_pairs = []
      for k, t in zip(sampled_keys, ttls):
          if t > 0:
              key_ttl_pairs.append((k, t))

      expiring_count = len(key_ttl_pairs)
      if expiring_count == 0:
          print("Sampled keys have no active TTL (-1 or -2).")
          report = {
              "total_sampled": total_sampled,
              "expiring_keys_count": 0,
              "stampede_risk": False,
              "peak_cluster_percentage": 0.0,
              "risk_status": "NO_EXPIRING_KEYS"
          }
          with open("ttl_audit_report.json", "w") as f:
              json.dump(report, f, indent=2)
          Kestra.outputs(report)
          exit(0)

      buckets = {}
      for k, t in key_ttl_pairs:
          bucket_id = t // window_sec
          buckets[bucket_id] = buckets.get(bucket_id, 0) + 1

      peak_bucket_id = max(buckets, key=buckets.get)
      peak_bucket_count = buckets[peak_bucket_id]
      peak_pct = round((peak_bucket_count / expiring_count) * 100.0, 2)

      ttl_vals = [t for _, t in key_ttl_pairs]
      ttl_min = min(ttl_vals)
      ttl_max = max(ttl_vals)
      ttl_mean = round(sum(ttl_vals) / len(ttl_vals), 2)
      variance = sum((t - ttl_mean) ** 2 for t in ttl_vals) / len(ttl_vals)
      ttl_stdev = round(math.sqrt(variance), 2)

      stampede_risk = (peak_pct >= threshold_pct) and (expiring_count >= 10)
      risk_status = "STAMPEDE_RISK" if stampede_risk else "BALANCED"

      clustered_keys = [k for k, t in key_ttl_pairs if (t // window_sec) == peak_bucket_id]

      report = {
          "total_sampled": total_sampled,
          "expiring_keys_count": expiring_count,
          "peak_bucket_id": int(peak_bucket_id),
          "peak_bucket_window_start": int(peak_bucket_id * window_sec),
          "peak_bucket_window_end": int((peak_bucket_id + 1) * window_sec),
          "peak_bucket_count": int(peak_bucket_count),
          "peak_cluster_percentage": float(peak_pct),
          "ttl_min": int(ttl_min),
          "ttl_max": int(ttl_max),
          "ttl_mean": float(ttl_mean),
          "ttl_stdev": float(ttl_stdev),
          "stampede_risk": bool(stampede_risk),
          "risk_status": risk_status,
          "candidate_keys_to_jitter": clustered_keys[:100]
      }

      print(f"Audit Complete: {expiring_count} expiring keys evaluated.")
      print(f"Peak bucket: {peak_bucket_count} keys ({peak_pct}%) in window [{peak_bucket_id * window_sec}s - {(peak_bucket_id + 1) * window_sec}s].")
      print(f"Stampede Risk: {risk_status} (Threshold: {threshold_pct}%).")

      with open("ttl_audit_report.json", "w") as f:
          json.dump(report, f, indent=2)

      Kestra.outputs(report)
    outputFiles:
      - ttl_audit_report.json

  - id: evaluate_stampede_risk
    type: io.kestra.plugin.core.flow.If
    description: Branch based on detected expiration clustering to apply jitter remediation when risk is present.
    condition: "{{ outputs.audit_ttl_distribution.vars.stampede_risk }}"
    then:
      - id: apply_ttl_jitter_rebalance
        type: io.kestra.plugin.scripts.python.Script
        description: Apply randomized TTL jitter offset to clustered keys to stagger expirations smoothly across time.
        containerImage: python:3.11-slim
        beforeCommands:
          - pip install redis
        env:
          REDIS_PASSWORD: "{{ secret('REDIS_PASSWORD') }}"
        inputFiles:
          ttl_audit_report.json: "{{ outputs.audit_ttl_distribution.outputFiles['ttl_audit_report.json'] }}"
        script: |
          import os
          import json
          import random
          import math
          import redis
          from kestra import Kestra

          dry_run = "{{ inputs.dry_run }}" == "true"
          host = "{{ inputs.redis_host }}"
          port = {{ inputs.redis_port }}
          password = os.environ.get("REDIS_PASSWORD") or None
          window_sec = {{ inputs.cluster_window_seconds }}
          jitter_min = {{ inputs.jitter_min_percent }}
          jitter_max = {{ inputs.jitter_max_percent }}

          with open("ttl_audit_report.json", "r") as f:
              audit_data = json.load(f)

          client = redis.Redis(
              host=host,
              port=port,
              password=password,
              decode_responses=True,
              socket_connect_timeout=10,
              socket_timeout=10
          )

          candidate_keys = audit_data.get("candidate_keys_to_jitter", [])
          if not candidate_keys:
              print("No candidate keys available for jitter.")
              Kestra.outputs({"rebalanced_count": 0, "dry_run": dry_run})
              exit(0)

          pipe = client.pipeline(transaction=False)
          for k in candidate_keys:
              pipe.ttl(k)
          current_ttls = pipe.execute()

          rebalance_plan = []
          for k, t in zip(candidate_keys, current_ttls):
              if t > 60:
                  direction = random.choice([-1, 1])
                  jitter_factor = random.uniform(jitter_min, jitter_max) / 100.0
                  offset_seconds = int(t * jitter_factor * direction)
                  new_ttl = max(60, t + offset_seconds)
                  rebalance_plan.append((k, t, new_ttl))

          if not dry_run and rebalance_plan:
              update_pipe = client.pipeline(transaction=False)
              for k, old_t, new_t in rebalance_plan:
                  update_pipe.expire(k, new_t)
              update_pipe.execute()
              print(f"Successfully applied jittered EXPIRE to {len(rebalance_plan)} keys.")
          else:
              print(f"DRY RUN: Planned jitter adjustments for {len(rebalance_plan)} keys without writing to Redis.")

          rebalance_summary = {
              "rebalanced_count": len(rebalance_plan),
              "dry_run": dry_run,
              "pre_peak_cluster_percentage": audit_data.get("peak_cluster_percentage"),
              "jitter_min_percent": jitter_min,
              "jitter_max_percent": jitter_max,
              "sample_adjustments": [
                  {"key": k, "old_ttl": old_t, "new_ttl": new_t}
                  for k, old_t, new_t in rebalance_plan[:10]
              ]
          }

          with open("rebalance_summary.json", "w") as f:
              json.dump(rebalance_summary, f, indent=2)

          Kestra.outputs(rebalance_summary)
        outputFiles:
          - rebalance_summary.json

      - id: notify_stampede_risk_mitigated
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatch operational alert to Slack documenting the stampede risk and remediation metrics.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "⚠️ *Redis Cache Stampede Risk Mitigated*\n*Host:* `{{ inputs.redis_host }}:{{ inputs.redis_port }}`\n*Pattern:* `{{ inputs.key_pattern }}`\n*Peak Clustering:* `{{ outputs.audit_ttl_distribution.vars.peak_cluster_percentage }}%` (Threshold: `{{ inputs.max_cluster_percent }}%`)\n*Keys Rebalanced:* `{{ outputs.apply_ttl_jitter_rebalance.vars.rebalanced_count }}` (Dry Run: `{{ inputs.dry_run }}`)\n*Execution:* <{{ flow.url }}|{{ execution.id }}>"
          }

  - id: verify_redis_health
    type: io.kestra.plugin.redis.cli.RedisCLI
    description: Validate Redis command statistics and memory consumption remain within normal bounds following rebalancing.
    host: "{{ inputs.redis_host }}"
    port: "{{ inputs.redis_port }}"
    password: "{{ secret('REDIS_PASSWORD') }}"
    commands:
      - INFO memory
      - INFO stats

  - id: log_audit_summary
    type: io.kestra.plugin.core.log.Log
    description: Emit an immutable operational audit log record capturing pre- and post-rebalance telemetry.
    message: |
      [AUDIT] Redis Cache Stampede & TTL Jitter Audit Completed.
      Status: {{ outputs.audit_ttl_distribution.vars.risk_status }}
      Pattern: {{ inputs.key_pattern }}
      Keys Sampled: {{ outputs.audit_ttl_distribution.vars.total_sampled }}
      Expiring Keys: {{ outputs.audit_ttl_distribution.vars.expiring_keys_count }}
      Peak Cluster: {{ outputs.audit_ttl_distribution.vars.peak_cluster_percentage }}% (Limit: {{ inputs.max_cluster_percent }}%)
      TTL Range: {{ outputs.audit_ttl_distribution.vars.ttl_min }}s - {{ outputs.audit_ttl_distribution.vars.ttl_max }}s (Mean: {{ outputs.audit_ttl_distribution.vars.ttl_mean }}s, Stdev: {{ outputs.audit_ttl_distribution.vars.ttl_stdev }}s)
      Rebalanced Keys: {{ outputs.apply_ttl_jitter_rebalance.vars.rebalanced_count ?? 0 }}
      Dry Run: {{ inputs.dry_run }}

errors:
  - id: alert_execution_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Notify on-call channel if the cache audit or rebalancing flow encounters transport or runtime failures.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "❌ *Redis Cache Stampede Rebalancer Failed*\nFlow `{{ flow.id }}` failed during execution `{{ execution.id }}` against Redis host `{{ inputs.redis_host }}:{{ inputs.redis_port }}`. Inspect execution logs for stack trace."
      }

extend:
  title: Redis Cache Stampede Mitigation and Synchronized TTL Jitter Rebalancer
  metaTitle: Redis Cache Stampede Mitigation & TTL Jitter | Kestra
  shortDescription: Audit Redis cache namespaces for synchronized TTL clustering, detect cache stampede risk, and automatically apply randomized jitter to stagger key expirations.
  metaDescription: Audit Redis cache key TTL clustering to detect thundering herd risk and automatically apply jitter to stagger expirations and protect backend databases.
  description: |
    In high-throughput architectures using Redis as a distributed caching tier, batch ingestion jobs,
    midnight catalog syncs, and microservice cache warmers often write thousands of keys simultaneously
    with an identical, uniform time-to-live (for example, `EXPIRE key 86400`). Because these keys share
    the exact same creation timestamp and duration, their lifespans expire concurrently within a tight
    temporal window. When that synchronized expiration window hits, cache hit ratios collapse from 99%
    to zero, triggering a catastrophic **thundering herd / cache stampede**: thousands of incoming
    application requests simultaneously miss the cache and overwhelm the backing SQL database or search
    cluster, leading to connection pool exhaustion and cascading service outages.

    This blueprint implements an automated Day 2 Operations jitter rebalancer for Redis. It safely
    samples keys across designated cache namespaces using non-blocking cursor scans, extracts remaining
    lifespans via pipelined TTL queries, constructs a temporal expiration histogram, and calculates
    peak cluster density. When a dangerous cluster is detected, it automatically computes bounded
    pseudo-random jitter offsets and applies staggered `EXPIRE` renewals to smooth expirations across
    time without invalidating the underlying cached payloads.

    ## How it works

    1. `periodic_cache_jitter_schedule` (`io.kestra.plugin.core.trigger.Schedule`) triggers the audit pass every 6 hours (disabled by default for initial safe onboarding).
    2. `audit_ttl_distribution` (`io.kestra.plugin.scripts.python.Script`) connects to Redis, executes non-blocking `SCAN` iteration to collect up to `sample_limit` keys matching `key_pattern`, pipelines `TTL` commands, computes statistical dispersion (min, max, mean, standard deviation), and identifies peak expiration density across `cluster_window_seconds` buckets.
    3. `evaluate_stampede_risk` (`io.kestra.plugin.core.flow.If`) evaluates whether peak cluster concentration exceeds `max_cluster_percent` with sufficient sample size.
    4. When stampede risk is detected:
       - `apply_ttl_jitter_rebalance` (`io.kestra.plugin.scripts.python.Script`) calculates a bounded random jitter factor (`jitter_min_percent` to `jitter_max_percent`) per key in the peak bucket. When `dry_run` is `false`, it executes pipelined `EXPIRE` commands to distribute expirations across the timeline; when `dry_run` is `true`, it records planned adjustments without mutating state.
       - `notify_stampede_risk_mitigated` (`io.kestra.plugin.slack.notifications.SlackIncomingWebhook`) dispatches a real-time advisory alert to Slack with cluster metrics and rebalance counts.
    5. `verify_redis_health` (`io.kestra.plugin.redis.cli.RedisCLI`) executes `INFO memory` and `INFO stats` through the official Redis CLI container runner to confirm server stability and command latency post-rebalance.
    6. `log_audit_summary` (`io.kestra.plugin.core.log.Log`) writes an immutable summary entry to the Kestra execution timeline capturing full statistical telemetry.
    7. A flow-level `errors` handler captures connection timeouts or authentication failures and routes an incident alert to Slack.

    ## What you get

    - Automated detection of synchronized cache key expiration spikes before thundering herd outages hit backend databases.
    - Zero-downtime, non-destructive TTL smoothing: staggers key expirations without clearing or re-fetching valid cache data.
    - Non-blocking Redis operations: uses cursor-based `SCAN` and pipelined batches instead of dangerous blocking `KEYS *` commands.
    - Built-in `dry_run` simulation mode to safely preview rebalancing distributions prior to live production activation.
    - Comprehensive statistical telemetry (mean, standard deviation, peak cluster percentage) persisted in Kestra execution history.
    - Post-rebalance health verification using native `RedisCLI` to confirm memory headroom and operational metrics.

    ## Who it's for

    - Platform Engineers and Site Reliability Engineers operating large-scale Redis caching clusters.
    - Backend Architects and Lead Developers designing resilient caching tiers for high-traffic eCommerce and SaaS platforms.
    - Database Administrators seeking to safeguard relational databases (PostgreSQL, MySQL) against sudden cache miss spikes.

    ## Why orchestrate this with Kestra

    Mitigating cache stampedes with standalone shell scripts or ad-hoc cron jobs introduces unmanaged dependencies, unmasked credentials, and zero execution lineage. Kestra provides native containerized execution sandboxes, enterprise secret governance, declarative scheduling, structured outputs, conditional remediation branching, and turnkey Slack alerting in a single observable YAML blueprint.

    ## Prerequisites

    - A running Redis instance (version 6.0 or higher) reachable from the Kestra worker environment.
    - An incoming Slack webhook URL for operational notifications.
    - Docker enabled on the Kestra worker host for containerized script and Redis CLI execution.

    ### Secrets

    - `REDIS_PASSWORD`: Authentication password or token for the Redis instance (leave blank or placeholder for unsecured local development).
    - `SLACK_WEBHOOK_URL`: Incoming Webhook URL for Slack incident and operational notifications.

    ## Quick start

    1. Configure `REDIS_PASSWORD` and `SLACK_WEBHOOK_URL` in your Kestra namespace secrets.
    2. Start a local Redis container for testing:
       ```bash
       docker run -d --name redis-cache-dev -p 6379:6379 redis:7-alpine
       ```
    3. Seed the local Redis instance with synchronized sample keys:
       ```bash
       docker exec -i redis-cache-dev redis-cli << 'EOF'
       MSET cache:catalog:101 '{"item":"shoes"}' cache:catalog:102 '{"item":"shirt"}' cache:catalog:103 '{"item":"hat"}'
       EXPIRE cache:catalog:101 3600
       EXPIRE cache:catalog:102 3600
       EXPIRE cache:catalog:103 3600
       EOF
       ```
    4. Run a manual execution with `dry_run: "true"` to verify key discovery and review the calculated jitter offsets in `rebalance_summary.json`.
    5. Set `dry_run: "false"` on a follow-up run to apply live TTL renewals, and enable `periodic_cache_jitter_schedule` for continuous background surveillance.

    ## How to extend

    - Integrate database query rate metrics by chaining an `io.kestra.plugin.jdbc.postgres.Query` task to correlate cache miss spikes with relational database connection pool depth.
    - Add dynamic cache warming: in the rebalance task, trigger a downstream subflow (`io.kestra.plugin.core.flow.Subflow`) to pre-warm the soonest-expiring cache items asynchronously before they lapse.
    - Route critical alerts to PagerDuty or Opsgenie via `io.kestra.plugin.pagerduty` when peak cluster density exceeds 75% on mission-critical cache partitions.

    ## Links

    - [Kestra Redis Plugin Documentation](https://kestra.io/plugins/plugin-redis)
    - [Redis EXPIRE Command Specification](https://redis.io/docs/latest/commands/expire/)
    - [Redis SCAN Cursor Documentation](https://redis.io/docs/latest/commands/scan/)
    - [AWS Architecture: Preventing Cache Stampede with Jitter](https://aws.amazon.com/builders-library/caching-challenges-and-strategies/)
  tags:
    - Infrastructure
    - Data
  subTags:
    - Day 2 Operations
    - Infrastructure Automation
  ee: false
  demo: false
