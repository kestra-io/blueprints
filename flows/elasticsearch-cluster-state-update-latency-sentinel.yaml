id: elasticsearch-cluster-state-update-latency-sentinel
namespace: company.team

inputs:
  - id: es_host
    type: STRING
    defaults: "elasticsearch.internal"
    description: Elasticsearch cluster hostname or IP address.
  - id: es_port
    type: INT
    defaults: 9200
    description: Elasticsearch HTTP port.
  - id: es_user
    type: STRING
    defaults: "elastic"
    description: Elasticsearch username.
  - id: max_pending_tasks_threshold
    type: INT
    defaults: 10
    description: Maximum acceptable count of pending cluster tasks before alerting.

tasks:
  - id: query_pending_cluster_tasks
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests
    env:
      ES_HOST: "{{ inputs.es_host }}"
      ES_PORT: "{{ inputs.es_port }}"
      ES_USER: "{{ inputs.es_user }}"
      ES_PASSWORD: "{{ secret('ES_PASSWORD') }}"
    script: |
      import os
      import sys
      import json
      import requests
      from kestra import Kestra

      host = os.environ.get("ES_HOST", "elasticsearch.internal")
      port = os.environ.get("ES_PORT", "9200")
      user = os.environ.get("ES_USER", "elastic")
      password = os.environ.get("ES_PASSWORD", "")

      auth = (user, password) if user and password else None
      url = f"http://{host}:{port}/_cluster/pending_tasks"

      try:
          resp = requests.get(url, auth=auth, timeout=15)
          resp.raise_for_status()
          data = resp.json()
      except Exception as e:
          print(f"CRITICAL: Failed to query Elasticsearch pending tasks at {url}: {e}", file=sys.stderr)
          sys.exit(1)

      tasks = data.get("tasks", [])
      pending_count = len(tasks)
      urgent_tasks = len([t for t in tasks if t.get("priority") in ("URGENT", "HIGH")])

      report = {
          "pending_count": pending_count,
          "urgent_tasks": urgent_tasks,
          "tasks": tasks
      }

      with open("pending_tasks_report.json", "w") as f:
          json.dump(report, f, indent=2)

      Kestra.outputs({
          "pending_count": pending_count,
          "urgent_tasks": urgent_tasks
      })
      print(f"Elasticsearch pending tasks audit: pending={pending_count}, urgent={urgent_tasks}")
    outputFiles:
      - pending_tasks_report.json

  - id: evaluate_master_state_health
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.query_pending_cluster_tasks.vars.pending_count | int >= inputs.max_pending_tasks_threshold or outputs.query_pending_cluster_tasks.vars.urgent_tasks | int > 0 }}"
    then:
      - id: notify_cluster_operators
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#elasticsearch-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 Elasticsearch Master Cluster State Update Stall Alert",
                "text": "Elasticsearch master on `{{ inputs.es_host }}` has *{{ outputs.query_pending_cluster_tasks.vars.pending_count }}* pending cluster tasks (*{{ outputs.query_pending_cluster_tasks.vars.urgent_tasks }}* HIGH/URGENT priority)! Impact: Cluster state updates (mapping additions, shard reassignments, index creations) are blocked, causing master node timeouts and cluster instability.",
                "footer": "Kestra Search Sentinel • Elasticsearch"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "#elasticsearch-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ Elasticsearch Master Cluster State Update Latency Sentinel Pipeline Failure",
            "text": "Failed to query Elasticsearch _cluster/pending_tasks. Check master node connectivity. Execution ID: {{ execution.id }}",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  metaDescription: "Audits Elasticsearch pending cluster tasks to detect master node state publication lag and mapping stalls."
  metaTitle: Elasticsearch Master Cluster State Update Latency Sentinel with Kestra
  title: Elasticsearch Master Cluster State Update Latency Sentinel
  shortDescription: Audits Elasticsearch pending cluster tasks to detect master node state publication lag and mapping stalls.
  description: |
    ## How it works
    This workflow executes `GET /_cluster/pending_tasks` against the Elasticsearch cluster. The elected master node processes cluster state changes single-threaded. When mapping explosions, shard rerouting storms, or bulk index creations flood the master, tasks accumulate in the queue. If pending tasks exceed the threshold or urgent tasks queue up, Slack is alerted immediately.

    ## What you get
    - Real-time visibility into master node task processing and state publication health.
    - Prevents catastrophic cluster freezes and master node timeout disconnects.
    - Early warning of dynamic mapping explosion storms.

    ## Who it's for
    - Elasticsearch Cluster Architects and SREs responsible for large multi-node clusters.
    - Data Platform Engineers managing dynamic schemaless index pipelines.

    ## Why orchestrate this with Kestra
    - **Master Node Health Protection**: Catch cluster state backlog before nodes drop out.
    - **Lightweight Polling**: Fast REST API call with minimal cluster overhead.
    - **Prioritized Alerts**: Distinguish between background maintenance tasks and urgent routing tasks.

    ## Architecture diagram
    ```mermaid
    flowchart TD
      A[periodic_schedule Schedule Trigger] --> B[query_pending_cluster_tasks Python Script]
      B --> C{Tasks Exceed Threshold?}
      C -- Yes --> D[notify_cluster_operators Slack Webhook]
      C -- No --> E[Cluster Processing Nominal]
    ```

    ## Prerequisites
    - Elasticsearch cluster (7.x / 8.x) accessible via REST.
    - Secrets `ES_PASSWORD` and `SLACK_WEBHOOK_URL` configured in Kestra.

    ## Quick start
    1. Import the blueprint under the `company.team` namespace.
    2. Configure cluster host and pending task threshold.
    3. Run the workflow to inspect cluster state update health.

    ## How to extend
    - Inspect task wait times (`time_in_queue_millis`) to identify slowest operations.
    - Trigger master node heap dumps if pending tasks persist during garbage collection pauses.

    ## Links
    - [Elasticsearch Pending Cluster Tasks API](https://www.elastic.co/guide/en/elasticsearch/reference/current/cluster-pending.html)
    - [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
  tags:
    - Data
    - Infrastructure
  subTags:
    - ELT & Data Landing
    - Day 2 Operations
  ee: false
  demo: false
