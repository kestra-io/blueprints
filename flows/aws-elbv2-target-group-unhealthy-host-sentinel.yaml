id: aws-elbv2-target-group-unhealthy-host-sentinel
namespace: company.netops
description: |
  Monitors AWS Application and Network Load Balancer target groups across a region for unhealthy targets,
  zero-healthy outages, and health check failures, alerting infrastructure engineers on Slack.

concurrency:
  limit: 1

inputs:
  - id: aws_region
    type: STRING
    displayName: AWS Region
    description: AWS Region where Application and Network Load Balancers are deployed.
    defaults: us-east-1

  - id: unhealthy_host_threshold_percentage
    type: FLOAT
    displayName: Unhealthy Host Threshold (%)
    description: Minimum percentage of unhealthy targets in a target group to trigger a warning alert.
    defaults: 25.0

  - id: alert_on_zero_healthy_targets
    type: BOOLEAN
    displayName: Alert on Zero Healthy Targets
    description: Immediately trigger a critical alert when a target group has registered targets but zero healthy hosts.
    defaults: true

triggers:
  - id: periodic_target_group_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: Periodic health audit of load balancer target groups every 15 minutes.
    cron: "*/15 * * * *"
    disabled: true

tasks:
  - id: audit_target_group_health
    type: io.kestra.plugin.aws.cli.AwsCLI
    description: Query regional ELBv2 target groups and describe target health states to evaluate routing degradation risk.
    region: "{{ inputs.aws_region }}"
    accessKeyId: "{{ secret('AWS_ACCESS_KEY_ID') }}"
    secretKeyId: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
    commands:
      - |
        aws elbv2 describe-target-groups --output json > target_groups.json

        python3 -c "
        import json, subprocess, sys

        with open('target_groups.json') as f:
            tg_data = json.load(f)

        target_groups = tg_data.get('TargetGroups', [])
        threshold_pct = float('{{ inputs.unhealthy_host_threshold_percentage }}')
        alert_on_zero = str('{{ inputs.alert_on_zero_healthy_targets }}').lower() == 'true'

        degraded_groups = []
        audited_count = 0

        for tg in target_groups:
            tg_arn = tg.get('TargetGroupArn')
            tg_name = tg.get('TargetGroupName', 'unknown')
            protocol = tg.get('Protocol', 'unknown')
            port = tg.get('Port', 0)
            vpc_id = tg.get('VpcId', 'unknown')
            lb_arns = tg.get('LoadBalancerArns', [])
            lb_names = [arn.split('/')[-2] + '/' + arn.split('/')[-1] if '/' in arn else arn for arn in lb_arns]

            cmd = f'aws elbv2 describe-target-health --target-group-arn \"{tg_arn}\" --output json'
            res = subprocess.run(cmd, shell=True, capture_output=True, text=True)
            if res.returncode:
                continue

            health_data = json.loads(res.stdout)
            descriptions = health_data.get('TargetHealthDescriptions', [])
            audited_count += 1

            total = len(descriptions)
            if total == 0:
                continue

            healthy = sum(1 for d in descriptions if d.get('TargetHealth', {}).get('State') == 'healthy')
            unhealthy = sum(1 for d in descriptions if d.get('TargetHealth', {}).get('State') == 'unhealthy')
            initial = sum(1 for d in descriptions if d.get('TargetHealth', {}).get('State') == 'initial')
            draining = sum(1 for d in descriptions if d.get('TargetHealth', {}).get('State') == 'draining')
            unused = sum(1 for d in descriptions if d.get('TargetHealth', {}).get('State') == 'unused')

            reasons = sorted(list(set(
                d.get('TargetHealth', {}).get('Reason')
                for d in descriptions
                if d.get('TargetHealth', {}).get('Reason')
            )))

            unhealthy_pct = round((unhealthy / total) * 100, 2)
            healthy_pct = round((healthy / total) * 100, 2)

            is_zero_healthy = (total > 0 and healthy == 0 and alert_on_zero)
            is_threshold_exceeded = (total > 0 and unhealthy_pct >= threshold_pct)

            if is_zero_healthy or is_threshold_exceeded:
                severity = 'CRITICAL' if is_zero_healthy else 'WARNING'
                degraded_groups.append({
                    'target_group_name': tg_name,
                    'target_group_arn': tg_arn,
                    'protocol': protocol,
                    'port': port,
                    'vpc_id': vpc_id,
                    'load_balancers': lb_names if lb_names else ['unattached'],
                    'total_targets': total,
                    'healthy_targets': healthy,
                    'unhealthy_targets': unhealthy,
                    'initial_targets': initial,
                    'draining_targets': draining,
                    'unused_targets': unused,
                    'unhealthy_pct': unhealthy_pct,
                    'healthy_pct': healthy_pct,
                    'failure_reasons': reasons,
                    'severity': severity
                })

        summary_lines = []
        for dg in degraded_groups:
            summary_lines.append(
                f\"[{dg['severity']}] {dg['target_group_name']} ({dg['protocol']}:{dg['port']}) on {', '.join(dg['load_balancers'])}: \"
                f\"{dg['healthy_targets']}/{dg['total_targets']} healthy ({dg['unhealthy_pct']}% unhealthy). \"
                f\"Reasons: {', '.join(dg['failure_reasons']) if dg['failure_reasons'] else 'none'}\"
            )

        result = {
            'region': '{{ inputs.aws_region }}',
            'total_target_groups': len(target_groups),
            'audited_target_groups': audited_count,
            'degraded_count': len(degraded_groups),
            'degraded_target_groups': degraded_groups,
            'alert_triggered': len(degraded_groups) > 0,
            'summary_report': '\n'.join(summary_lines) if summary_lines else 'All audited target groups are healthy.'
        }

        with open('target_group_summary.json', 'w') as out:
            json.dump(result, out, indent=2)

        print('ELBv2 Target Group audit completed:', json.dumps(result, indent=2))
        "
    outputFiles:
      - target_group_summary.json

  - id: evaluate_target_group_health
    type: io.kestra.plugin.core.flow.If
    description: Evaluate audit results and trigger notifications if degraded target groups are detected.
    condition: "{{ fromJson(read(outputs.audit_target_group_health.outputFiles['target_group_summary.json'])).alert_triggered }}"
    then:
      - id: alert_netops_slack
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatch high-priority alert to NetOps Slack with degraded target group breakdown.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "attachments": [
              {
                "color": "danger",
                "title": "AWS Load Balancer Target Group Degraded Health Alert",
                "text": "Detected *{{ fromJson(read(outputs.audit_target_group_health.outputFiles['target_group_summary.json'])).degraded_count }}* degraded target group(s) in region `{{ inputs.aws_region }}` exceeding unhealthy threshold or having zero healthy targets.\n\n*Summary Report:*\n```\n{{ fromJson(read(outputs.audit_target_group_health.outputFiles['target_group_summary.json'])).summary_report }}\n```",
                "footer": "Kestra Cloud Sentinel • AWS ELBv2"
              }
            ]
          }

  - id: export_audit_telemetry
    type: io.kestra.plugin.core.log.Log
    description: Record target group health telemetry and summary report in Kestra execution logs.
    message: |
      Audit complete for AWS Region {{ inputs.aws_region }}.
      Total target groups: {{ fromJson(read(outputs.audit_target_group_health.outputFiles['target_group_summary.json'])).total_target_groups }}
      Audited groups with registered targets: {{ fromJson(read(outputs.audit_target_group_health.outputFiles['target_group_summary.json'])).audited_target_groups }}
      Degraded target groups: {{ fromJson(read(outputs.audit_target_group_health.outputFiles['target_group_summary.json'])).degraded_count }}
      Alert triggered: {{ fromJson(read(outputs.audit_target_group_health.outputFiles['target_group_summary.json'])).alert_triggered }}

errors:
  - id: notify_sentinel_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Send alert if AWS CLI API introspection fails during execution.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "attachments": [
          {
            "color": "danger",
            "title": "AWS Target Group Sentinel Execution Failure",
            "text": "Failed to audit ELBv2 target group health in region `{{ inputs.aws_region }}`. Check AWS IAM permissions or API connectivity.",
            "footer": "Kestra Cloud Sentinel • Error Handler"
          }
        ]
      }

extend:
  metaDescription: "Audit AWS Application and Network Load Balancer target groups for unhealthy host ratios and zero-healthy outages, then dispatch alerts to Slack."
  metaTitle: AWS ALB and NLB Target Group Unhealthy Host Sentinel with Kestra
  title: AWS ALB and NLB Target Group Unhealthy Host Sentinel
  shortDescription: Audit AWS Application and Network Load Balancer target groups for unhealthy host ratios and zero-healthy outages, then dispatch alerts to Slack.
  description: |
    ## How it works

    This sentinel connects to AWS Elastic Load Balancing (ELBv2) to inspect all Application Load Balancer and Network Load Balancer target groups across a region. It performs a two-tier evaluation:

    1. **Regional Target Group Discovery**: Calls `aws elbv2 describe-target-groups` to enumerate all registered target groups, their protocol, port, VPC, and parent load balancers.
    2. **Host Health Evaluation**: For each target group, it calls `aws elbv2 describe-target-health` to inspect the state of every registered target (`healthy`, `unhealthy`, `initial`, `draining`, or `unused`) and extract error reasons such as `Target.FailedHealthChecks`, `Target.Timeout`, or `Target.ResponseCodeMismatch`.
    3. **Degradation Detection**: Computes the percentage of unhealthy hosts against `unhealthy_host_threshold_percentage`. If a target group has registered targets but zero healthy hosts, it flags an immediate `CRITICAL` outage. If the unhealthy ratio breaches the threshold, it flags a `WARNING`.
    4. **Automated Alerting**: Generates a structured operational summary and dispatches an alert to Slack via incoming webhook.

    ## What you get

    - **Zero-Healthy Outage Prevention**: Detects when rolling container deployments or infrastructure failures leave an ingress target group with zero healthy hosts, dropping user traffic with 502/503 errors.
    - **Fleet-Wide Visibility**: Automatically evaluates all ALB and NLB target groups in the region without requiring manual maintenance of target group ARN lists.
    - **Failure Reason Extraction**: Surfaces the exact AWS health check failure reasons directly in the Slack alert for rapid mean-time-to-resolution (MTTR).
    - **Non-Disruptive Audit**: Executes entirely read-only API inspection with zero impact on ingress routing or target lifecycle.

    ## Who it's for

    - **Site Reliability Engineers (SREs)**: Guarding production ingress endpoints against silent rolling deployment failures.
    - **Cloud Infrastructure & DevOps Engineers**: Ensuring high availability and backend health across containerized workloads (ECS, EKS) and EC2 auto-scaling groups.
    - **Network Engineers**: Monitoring regional load balancing fabric and health check stability.

    ## Why orchestrate this with Kestra

    AWS CloudWatch alarms monitor aggregate metrics like `UnHealthyHostCount`, but in dynamic microservice environments, new target groups are constantly created and destroyed by Helm or Terraform. CloudWatch cannot automatically discover every ephemeral target group, correlate it with parent load balancers, and report root-cause failure codes across an entire region. Kestra combines automated AWS CLI discovery, deep target health introspection, conditional evaluation, and Slack notification into a repeatable, auditable workflow.

    ## Inputs

    | Name | Type | Default | Description |
    | :--- | :--- | :--- | :--- |
    | `aws_region` | STRING | `us-east-1` | AWS Region where Application and Network Load Balancers are deployed. |
    | `unhealthy_host_threshold_percentage` | FLOAT | `25.0` | Minimum percentage of unhealthy targets in a target group to trigger a warning alert. |
    | `alert_on_zero_healthy_targets` | BOOLEAN | `true` | Immediately trigger a critical alert when a target group has registered targets but zero healthy hosts. |

    ## Expected outputs

    - `{{ outputs.audit_target_group_health.outputFiles['target_group_summary.json'] }}`: Complete JSON report with regional target group counts, audited groups, degraded groups, and error reasons.
    - `{{ outputs.export_audit_telemetry }}`: Execution log summary detailing regional target group statistics and alert triggers.

    ## Prerequisites

    - An AWS account with permissions to execute `elasticloadbalancing:DescribeTargetGroups` and `elasticloadbalancing:DescribeTargetHealth`.
    - Application Load Balancers or Network Load Balancers with registered target groups.
    - A Slack Incoming Webhook URL configured for your infrastructure alerting channel.

    ### Secrets

    - `AWS_ACCESS_KEY_ID`: AWS IAM access key ID with read access to ELBv2.
    - `AWS_SECRET_ACCESS_KEY`: AWS IAM secret access key corresponding to the access key ID.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook endpoint URL used for sending health degradation notifications.

    ## Quick start

    1. Configure `AWS_ACCESS_KEY_ID`, `AWS_SECRET_ACCESS_KEY`, and `SLACK_WEBHOOK_URL` in your Kestra namespace secrets.
    2. Import this flow YAML into your Kestra instance.
    3. Click **Execute** in the UI with your target `aws_region`.
    4. Review execution outputs to inspect regional target group health.

    ## Common pitfalls and troubleshooting

    - **Empty Target Groups**: Target groups with zero registered targets (e.g. idle or during initial cluster provisioning) are ignored to avoid false positive alerts.
    - **Targets in Initial State**: During initial container registration, targets remain in `initial` state while health checks stabilize. The sentinel tracks `initial` targets separately without counting them as failed.
    - **Target Groups Without Parent Load Balancers**: Orphaned target groups not associated with any active load balancer are audited and tagged as `unattached` in the summary report.

    ## How to extend

    - Add automated PagerDuty incident triggering for any target group with `CRITICAL` zero-healthy severity.
    - Automatically scale up ECS service desired tasks via `aws ecs update-service` when healthy target count drops below minimum service requirements.

    ## Links

    - Kestra AWS Plugin Documentation: https://kestra.io/plugins/plugin-aws
    - Kestra Slack Plugin Documentation: https://kestra.io/plugins/plugin-notifications
    - AWS ELBv2 Target Group Health Documentation: https://docs.aws.amazon.com/elasticloadbalancing/latest/application/target-group-health-checks.html
  tags:
    - Cloud
    - Infrastructure
  subTags:
    - Monitoring & Alerting
  ee: false
  demo: false
