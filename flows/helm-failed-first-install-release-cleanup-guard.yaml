# SPDX-License-Identifier: Apache-2.0
id: helm-failed-first-install-release-cleanup-guard
namespace: company.team
description: Reclaim one abandoned failed first-install Helm release after stable observation and explicit approval under a cooperative release fence.

concurrency:
  limit: 1
  behavior: QUEUE

inputs:
  - id: release_name
    type: STRING
    defaults: application
  - id: release_namespace
    type: STRING
    defaults: applications
  - id: master_url
    type: STRING
    defaults: "{{ secret('K8S_MASTER_URL') }}"
  - id: ca_cert
    type: STRING
    defaults: "{{ secret('K8S_CA_CERT') }}"
  - id: token
    type: SECRET
    defaults: "{{ secret('K8S_TOKEN') }}"
  - id: docker_network
    type: STRING
    defaults: bridge
  - id: grace_seconds
    type: INT
    defaults: 1800
    min: 1
    max: 86400
  - id: dry_run
    type: BOOL
    defaults: true
  - id: auto_remediate
    type: BOOL
    defaults: false

variables:
  history_secret: "sh.helm.release.v1.{{ inputs.release_name }}.v1"
  fence_name: "helm-recovery-{{ inputs.release_name }}"
  observation_key: "helm-first-install-{{ inputs.master_url | sha256 }}-{{ inputs.release_namespace }}-{{ inputs.release_name }}"

tasks:
  - id: require_identifiers
    type: io.kestra.plugin.core.execution.Fail
    condition: >-
      {{ inputs.release_name | length < 1 or inputs.release_name | length > 49 or
         inputs.release_name | replace({'^[a-z0-9]([a-z0-9-]*[a-z0-9])?$': ''}, regexp=true) | length > 0 or
         inputs.release_namespace | length < 1 or inputs.release_namespace | length > 63 or
         inputs.release_namespace | replace({'^[a-z0-9]([a-z0-9-]*[a-z0-9])?$': ''}, regexp=true) | length > 0 }}
    errorMessage: Release must be a lowercase DNS label of at most 49 characters and namespace at most 63.

  - id: first_install_record
    type: io.kestra.plugin.kubernetes.kubectl.Get
    resourceType: Secret
    namespace: "{{ inputs.release_namespace }}"
    resourcesNames:
      - "{{ render(vars.history_secret) }}"
    fetchType: FETCH_ONE
    connection:
      masterUrl: "{{ inputs.master_url }}"
      caCertData: "{{ inputs.ca_cert }}"
      oauthToken: "{{ inputs.token }}"

  - id: existing_first_install
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.first_install_record.size == 1 }}"
    then:
      - id: release_state
        type: io.kestra.plugin.helm.Status
        releaseName: "{{ inputs.release_name }}"
        namespace: "{{ inputs.release_namespace }}"
        containerImage: alpine/helm:4.3.0@sha256:a6cf54599ccb99d90cf0712b30f03fdb3cab062e6b94e0418cc4db7e8a1464b2
        taskRunner:
          type: io.kestra.plugin.scripts.runner.docker.Docker
          entryPoint: []
          networkMode: "{{ inputs.docker_network }}"
          memory:
            memory: 512MB
        connection:
          masterUrl: "{{ inputs.master_url }}"
          caCertData: "{{ inputs.ca_cert }}"
          oauthToken: "{{ inputs.token }}"

      - id: failed_revision_one
        type: io.kestra.plugin.core.flow.If
        condition: "{{ outputs.release_state.status == 'failed' and outputs.release_state.revision == 1 }}"
        then:
          - id: require_history_identity
            type: io.kestra.plugin.core.execution.Fail
            condition: >-
              {{ outputs.first_install_record.metadataItem.name != render(vars.history_secret) or
                 outputs.first_install_record.metadataItem.namespace != inputs.release_namespace or
                 (outputs.first_install_record.metadataItem.labels.owner ?? '') != 'helm' or
                 (outputs.first_install_record.metadataItem.labels.name ?? '') != inputs.release_name or
                 (outputs.first_install_record.metadataItem.labels.version ?? '') != '1' or
                 (outputs.first_install_record.metadataItem.labels.status ?? '') != 'failed' or
                 (outputs.first_install_record.metadataItem.deletionTimestamp ?? '') != '' }}
            errorMessage: Exact first-install Secret does not match native failed revision 1. Nothing is removed.

          - id: bounded_manifest
            type: io.kestra.plugin.core.execution.Fail
            condition: "{{ read(outputs.release_state.manifest) | length > 262144 }}"
            errorMessage: Manifest exceeds the 256 KiB policy budget. Review manually.

          - id: manifest_documents
            type: io.kestra.plugin.serdes.yaml.YamlToJson
            from: "{{ outputs.release_state.manifest }}"
            jsonl: false

          - id: classify_manifest
            type: io.kestra.plugin.core.output.OutputValues
            values:
              safe: >-
                {{ {'documents': fromJson(read(outputs.manifest_documents.uri)), 'namespace': inputs.release_namespace} | toJson | jq('. as $x | (.documents | if type == "array" then . else [.] end | map(select(. != null))) as $docs | ($docs | length > 0 and length <= 32) and all($docs[]; type == "object" and (.kind == "Deployment" or .kind == "ConfigMap" or .kind == "Service") and (.metadata.namespace // $x.namespace) == $x.namespace and (.metadata.annotations["helm.sh/resource-policy"] // "") != "keep" and (.metadata.annotations["helm.sh/hook"] // "") == "" and (if .kind == "Deployment" then all((.spec.template.spec.volumes // [])[]; has("emptyDir") or has("configMap") or has("secret") or has("projected") or has("downwardAPI")) else true end))') | first }}

          - id: require_disposable_manifest
            type: io.kestra.plugin.core.execution.Fail
            condition: "{{ outputs.classify_manifest.values.safe != 'true' }}"
            errorMessage: Only 1 to 32 namespaced Deployment, ConfigMap and Service documents without persistent volumes, hooks or keep policy qualify.

          - id: observation
            type: io.kestra.plugin.core.output.OutputValues
            values:
              signature: "{{ [outputs.first_install_record.metadataItem.uid, outputs.first_install_record.metadataItem.resourceVersion, outputs.release_state.status, outputs.release_state.revision, read(outputs.release_state.manifest) | sha256] | toJson }}"
              now_seconds: "{{ now() | timestamp }}"
              old_record: "{{ kv(render(vars.observation_key), errorOnMissing=false) ?? '{}' }}"

          - id: bounded_observation
            type: io.kestra.plugin.core.execution.Fail
            condition: "{{ outputs.observation.values.old_record | length > 4096 }}"
            errorMessage: Observation exceeds 4096 characters. Review the record manually.

          - id: reconcile_observation
            type: io.kestra.plugin.core.output.OutputValues
            values:
              record: >-
                {{ {'old': outputs.observation.values.old_record, 'signature': outputs.observation.values.signature, 'now': outputs.observation.values.now_seconds} | toJson | jq('(.old | fromjson) as $old | (.now | tonumber) as $now | {signature: .signature, first_seen: (if $old.signature == .signature and ($old.first_seen | type) == "number" and $old.first_seen >= 0 and $old.first_seen <= $now then $old.first_seen else $now end)}') | first | toJson }}

          - id: remember_observation
            type: io.kestra.plugin.core.kv.Set
            key: "{{ render(vars.observation_key) }}"
            value: "{{ outputs.reconcile_observation.values.record }}"

          - id: report_candidate
            type: io.kestra.plugin.core.log.Log
            message: "Failed revision 1 for {{ inputs.release_namespace }}/{{ inputs.release_name }} observed for {{ (outputs.observation.values.now_seconds | number) - fromJson(outputs.reconcile_observation.values.record).first_seen }} seconds. Required grace {{ inputs.grace_seconds }}. dry_run={{ inputs.dry_run }}, auto_remediate={{ inputs.auto_remediate }}."

          - id: authorized_cleanup
            type: io.kestra.plugin.core.flow.If
            condition: "{{ inputs.auto_remediate and not inputs.dry_run and (outputs.observation.values.now_seconds | number) - fromJson(outputs.reconcile_observation.values.record).first_seen >= inputs.grace_seconds }}"
            then:
              - id: approve_cleanup
                type: io.kestra.plugin.core.flow.Pause
                pauseDuration: PT1H
                behavior: FAIL
                onResume:
                  - id: approved
                    type: BOOL
                    defaults: false
                    description: Approve removal of the failed revision 1 and confirm its chart data is disposable.
                  - id: original_runner_stopped
                    type: BOOL
                    defaults: false
                    description: Confirm the original process stopped and all release writers honor the dedicated recovery fence.

              - id: confirmed_cleanup
                type: io.kestra.plugin.core.flow.If
                condition: "{{ (outputs.approve_cleanup.onResume.approved ?? false) and (outputs.approve_cleanup.onResume.original_runner_stopped ?? false) }}"
                then:
                  - id: fence_state
                    type: io.kestra.plugin.kubernetes.kubectl.Get
                    resourceType: ConfigMap
                    namespace: "{{ inputs.release_namespace }}"
                    resourcesNames:
                      - "{{ render(vars.fence_name) }}"
                    fetchType: FETCH_ONE
                    connection:
                      masterUrl: "{{ inputs.master_url }}"
                      caCertData: "{{ inputs.ca_cert }}"
                      oauthToken: "{{ inputs.token }}"

                  - id: require_idle_fence
                    type: io.kestra.plugin.core.execution.Fail
                    condition: >-
                      {{ outputs.fence_state.size != 1 or
                         (outputs.fence_state.metadataItem.annotations['helm-recovery-release'] ?? '') != inputs.release_name or
                         (outputs.fence_state.metadataItem.annotations['helm-recovery-holder'] ?? 'missing') != '' }}
                    errorMessage: Dedicated release fence is missing, mismatched or held. Inspect its owner before retrying.

                  - id: acquire_fence
                    type: io.kestra.plugin.kubernetes.kubectl.Patch
                    resourceType: ConfigMap
                    resourceName: "{{ render(vars.fence_name) }}"
                    namespace: "{{ inputs.release_namespace }}"
                    patchStrategy: JSON_PATCH
                    patch: >-
                      {{ [{'op': 'test', 'path': '/metadata/uid', 'value': outputs.fence_state.metadataItem.uid}, {'op': 'test', 'path': '/metadata/resourceVersion', 'value': outputs.fence_state.metadataItem.resourceVersion}, {'op': 'test', 'path': '/metadata/annotations/helm-recovery-holder', 'value': ''}, {'op': 'replace', 'path': '/metadata/annotations/helm-recovery-holder', 'value': execution.id}] | toJson }}
                    connection:
                      masterUrl: "{{ inputs.master_url }}"
                      caCertData: "{{ inputs.ca_cert }}"
                      oauthToken: "{{ inputs.token }}"

                  - id: fenced_history
                    type: io.kestra.plugin.kubernetes.kubectl.Get
                    resourceType: Secret
                    namespace: "{{ inputs.release_namespace }}"
                    resourcesNames:
                      - "{{ render(vars.history_secret) }}"
                    fetchType: FETCH_ONE
                    connection:
                      masterUrl: "{{ inputs.master_url }}"
                      caCertData: "{{ inputs.ca_cert }}"
                      oauthToken: "{{ inputs.token }}"

                  - id: fenced_release
                    type: io.kestra.plugin.helm.Status
                    releaseName: "{{ inputs.release_name }}"
                    namespace: "{{ inputs.release_namespace }}"
                    containerImage: alpine/helm:4.3.0@sha256:a6cf54599ccb99d90cf0712b30f03fdb3cab062e6b94e0418cc4db7e8a1464b2
                    taskRunner:
                      type: io.kestra.plugin.scripts.runner.docker.Docker
                      entryPoint: []
                      networkMode: "{{ inputs.docker_network }}"
                      memory:
                        memory: 512MB
                    connection:
                      masterUrl: "{{ inputs.master_url }}"
                      caCertData: "{{ inputs.ca_cert }}"
                      oauthToken: "{{ inputs.token }}"

                  - id: require_unchanged_candidate
                    type: io.kestra.plugin.core.execution.Fail
                    condition: >-
                      {{ outputs.fenced_history.size != 1 or
                         outputs.fenced_history.metadataItem.uid != outputs.first_install_record.metadataItem.uid or
                         outputs.fenced_history.metadataItem.resourceVersion != outputs.first_install_record.metadataItem.resourceVersion or
                         outputs.fenced_release.status != 'failed' or outputs.fenced_release.revision != 1 or
                         read(outputs.fenced_release.manifest) != read(outputs.release_state.manifest) }}
                    errorMessage: Approved release changed. Nothing is removed; fence is retained for reconciliation.

                  - id: remove_failed_install
                    type: io.kestra.plugin.helm.Uninstall
                    releaseName: "{{ inputs.release_name }}"
                    namespace: "{{ inputs.release_namespace }}"
                    keepHistory: false
                    ignoreNotFound: false
                    noHooks: true
                    wait: WATCHER
                    cascade: FOREGROUND
                    timeout: PT45S
                    containerImage: alpine/helm:4.3.0@sha256:a6cf54599ccb99d90cf0712b30f03fdb3cab062e6b94e0418cc4db7e8a1464b2
                    taskRunner:
                      type: io.kestra.plugin.scripts.runner.docker.Docker
                      entryPoint: []
                      networkMode: "{{ inputs.docker_network }}"
                      memory:
                        memory: 512MB
                    connection:
                      masterUrl: "{{ inputs.master_url }}"
                      caCertData: "{{ inputs.ca_cert }}"
                      oauthToken: "{{ inputs.token }}"

                  - id: release_absence
                    type: io.kestra.plugin.helm.Uninstall
                    description: Native dry-run read accepts only Helm not-found and never removes a surviving release.
                    releaseName: "{{ inputs.release_name }}"
                    namespace: "{{ inputs.release_namespace }}"
                    dryRun: true
                    ignoreNotFound: true
                    noHooks: true
                    containerImage: alpine/helm:4.3.0@sha256:a6cf54599ccb99d90cf0712b30f03fdb3cab062e6b94e0418cc4db7e8a1464b2
                    taskRunner:
                      type: io.kestra.plugin.scripts.runner.docker.Docker
                      entryPoint: []
                      networkMode: "{{ inputs.docker_network }}"
                      memory:
                        memory: 512MB
                    connection:
                      masterUrl: "{{ inputs.master_url }}"
                      caCertData: "{{ inputs.ca_cert }}"
                      oauthToken: "{{ inputs.token }}"

                  - id: history_absence
                    type: io.kestra.plugin.kubernetes.kubectl.Get
                    resourceType: Secret
                    namespace: "{{ inputs.release_namespace }}"
                    resourcesNames:
                      - "{{ render(vars.history_secret) }}"
                    fetchType: FETCH_ONE
                    connection:
                      masterUrl: "{{ inputs.master_url }}"
                      caCertData: "{{ inputs.ca_cert }}"
                      oauthToken: "{{ inputs.token }}"

                  - id: require_name_reclaimed
                    type: io.kestra.plugin.core.execution.Fail
                    condition: "{{ outputs.release_absence.status != 'not-found' or outputs.history_absence.size != 0 }}"
                    errorMessage: Release or revision-1 history still exists. Fence retained; cleanup is incomplete.

                  - id: verify_managed_resources
                    type: io.kestra.plugin.core.flow.Loop
                    values: "{{ outputs.release_state.resources | toJson }}"
                    concurrencyLimit: 1
                    tasks:
                      - id: managed_resource_absence
                        type: io.kestra.plugin.kubernetes.kubectl.Get
                        resourceType: "{{ fromJson(item.value).kind }}"
                        apiGroup: "{{ fromJson(item.value).kind == 'Deployment' ? 'apps' : '' }}"
                        namespace: "{{ inputs.release_namespace }}"
                        resourcesNames:
                          - "{{ fromJson(item.value).name }}"
                        fetchType: FETCH_ONE
                        connection:
                          masterUrl: "{{ inputs.master_url }}"
                          caCertData: "{{ inputs.ca_cert }}"
                          oauthToken: "{{ inputs.token }}"

                      - id: require_resource_absence
                        type: io.kestra.plugin.core.execution.Fail
                        condition: "{{ outputs.managed_resource_absence.size != 0 }}"
                        errorMessage: Approved managed resource remains after uninstall. Fence retained; inspect finalizers and partial cleanup.

                  - id: release_fence
                    type: io.kestra.plugin.kubernetes.kubectl.Patch
                    resourceType: ConfigMap
                    resourceName: "{{ render(vars.fence_name) }}"
                    namespace: "{{ inputs.release_namespace }}"
                    patchStrategy: JSON_PATCH
                    patch: >-
                      {{ [{'op': 'test', 'path': '/metadata/uid', 'value': outputs.acquire_fence.metadata.uid}, {'op': 'test', 'path': '/metadata/annotations/helm-recovery-holder', 'value': execution.id}, {'op': 'replace', 'path': '/metadata/annotations/helm-recovery-holder', 'value': ''}] | toJson }}
                    connection:
                      masterUrl: "{{ inputs.master_url }}"
                      caCertData: "{{ inputs.ca_cert }}"
                      oauthToken: "{{ inputs.token }}"

  - id: completion
    type: io.kestra.plugin.core.log.Log
    message: "First-install cleanup check complete for {{ inputs.release_namespace }}/{{ inputs.release_name }}. No matching first-install record means no cleanup target."

errors:
  - id: alert_cleanup_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: >-
      {{ {'text': 'First-install cleanup failed for ' ~ inputs.release_namespace ~ '/' ~ inputs.release_name ~ '. Execution ' ~ execution.id ~ '. Inspect release state and any retained recovery fence before a fresh attempt.'} | toJson }}

triggers:
  - id: scheduled_check
    type: io.kestra.plugin.core.trigger.Schedule
    disabled: true
    cron: "*/15 * * * *"
    inputs:
      dry_run: true
      auto_remediate: false

extend:
  title: Reclaim an abandoned failed first Helm install
  metaTitle: Reclaim a failed first Helm install with Kestra
  shortDescription: Observe an abandoned failed Helm revision 1, approve native uninstall under a cooperative fence and verify the release name is free.
  metaDescription: Reclaim a failed first Helm install after a grace window and explicit approval. Verify release and history absence under a cooperative release fence.
  tags:
    - Infrastructure
  subTags:
    - Kubernetes Operations
    - Day 2 Operations
  ee: false
  demo: false
  description: |
    A failed first install can keep its name occupied with no prior rollback revision.

    ## How it works
    Native Get reads the exact revision-1 Secret. Helm Status must report failed at revision 1. Serdes parses the manifest. Policy accepts 1 to 32 namespaced Deployment, ConfigMap and Service documents, rejects keep policies and permits only ephemeral or configuration volumes. Policy parsing has a 256 KiB budget.

    KV records Secret UID/resourceVersion, status, revision and manifest hash. Unchanged state aged at least grace_seconds qualifies. Dry-run reports without removal. Both BOOL confirmations are required: approve removal and confirm the original process stopped with all writers honoring the fence.

    Conditional ConfigMap Patch acquires the fence. Fresh reads reject changed identity or state. Uninstall runs once with keepHistory false, foreground deletion, a 45-second wait and no delete hooks. A native dry-run probe must report not-found, exact Secret Get must return zero and serial Get must find every managed resource gone. Only then is the fence cleared.

    ## What you get
    A proposal and failed execution on stale approval, refusal or incomplete reclamation. Approval destroys history. The chart is not repaired or reinstalled.

    ## Who it's for
    Platform teams cleaning disposable installs with a shared release mutex.

    ## Why orchestrate this with Kestra
    KV carries observation across runs. Pause records approval. Native removal and absence checks share an execution. Flow concurrency queues this flow only; the ConfigMap fences cooperating clients across flows.

    ## Tested end to end
    Kestra 2.0.6 and 2.0.5 with Helm 4.3.0 and Kubernetes 1.31.5. A bad-image install left failed revision 1; plain reinstall refused the name and rollback had no previous revision. Approved cleanup removed history and 2 managed objects, then a corrected same-name install succeeded. Dry-run and decline preserved state. RBAC refusal failed. Stale approval failed before removal. A finalizer left a workload after Helm reported success; the independent native read failed the flow and retained its fence. Manual reconciliation followed by a fresh run caused no duplicate removal. Two servers racing for one fence invoked Uninstall once. A second cluster reproduced recovery and stale approval. Protected 128 lookalike Secrets and 2 unrelated values (35 bytes) survived.

    ## Prerequisites
    Helm Secret storage, reachable API, Docker workers and Helm, Kubernetes, Serdes and Slack plugins. Secret get/list/update/delete, chart-resource get/list/watch/delete and Pod get/list are needed. The fence needs ConfigMap get/patch. Discovery reads are required. Scope the role to the disposable namespace.

    ### Secrets
    K8S_MASTER_URL, K8S_CA_CERT (base64 CA), K8S_TOKEN and SLACK_WEBHOOK_URL. The token input is SECRET.

    ### Inputs
    release_name selects one lowercase label of at most 49 characters so the fence fits a DNS label. release_namespace allows 63. grace_seconds defaults to 1800 and is bounded from 1 to 86400. dry_run defaults true and auto_remediate false. docker_network defaults bridge.

    ## Quick start
    1. Provision helm-recovery-<release> ConfigMap with annotations helm-recovery-release: <release> and helm-recovery-holder: "". Every writer must hold it through its operation.
    2. Configure secrets. Run dry-run twice across the grace interval.
    3. Inspect chart data and existing install-hook effects. Stop the original process before enabling write mode and approving both confirmations.
    4. After failure, inspect release and active clients. Clear only a stopped holder with conditional Patch. Start fresh instead of replaying Uninstall.

    ## How to extend
    Add an approved corrected-chart install after successful reclamation.
    Limits: no protection from clients ignoring the fence, no expiry and no reversal of install hooks, CRDs or external data. Manifest policy is not proof of statelessness. Helm may purge history before every resource disappears; inspect survivors and reconcile the held fence before rerunning. Native reads load full manifests before the policy budget. No automatic write retry. The disabled schedule forces safe mode.

    ## Links
    - [Helm plugin](https://kestra.io/plugins/plugin-helm)
    - [Helm uninstall](https://helm.sh/docs/helm/helm_uninstall/)
    - [Conditional Kubernetes updates](https://kubernetes.io/docs/reference/using-api/api-concepts/#updates-to-existing-resources)

    This blueprint was created by [zkasuran](https://github.com/zkasuran).
