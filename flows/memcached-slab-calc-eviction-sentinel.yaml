id: memcached-slab-calc-eviction-sentinel
namespace: company.memcached

concurrency:
  limit: 1

inputs:
  - id: memcached_host
    displayName: Memcached Host
    type: STRING
    defaults: "localhost"
    description: Hostname or IP address of the target Memcached caching node.

  - id: memcached_port
    displayName: Memcached Port
    type: INT
    defaults: 11211
    description: Network communication port exposing Memcached ascii telnet commands (default 11211).

  - id: max_evictions_threshold
    displayName: Evictions Threshold (Per Interval)
    type: INT
    defaults: 100
    description: Maximum allowable key eviction rate within the evaluation interval before triggering alerts.

  - id: slack_channel
    displayName: Slack Channel
    type: STRING
    defaults: "#caching-reliability"
    description: Slack channel destination for distributed caching layer incident notifications.

triggers:
  - id: poll_memcached_slabs
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/10 * * * *"
    description: Periodic health probe evaluating Memcached slab memory allocations every ten minutes.

tasks:
  - id: scan_slab_eviction_metrics
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.11-slim
    description: Opens socket to Memcached to issue stats slabs commands and parse per-slab eviction counters.
    script: |
      import json
      import socket
      from kestra import Kestra

      host = "{{ inputs.memcached_host }}"
      port = int({{ inputs.memcached_port }})
      threshold = int({{ inputs.max_evictions_threshold }})

      def query_memcached(cmd):
          try:
              s = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
              s.settimeout(5)
              s.connect((host, port))
              s.sendall(f"{cmd}\r\n".encode("utf-8"))
              buffer = ""
              while True:
                  chunk = s.recv(4096).decode("utf-8", errors="ignore")
                  buffer += chunk
                  if "END\r\n" in buffer or not chunk:
                      break
              s.close()
              return buffer
          except Exception as err:
              print(f"Socket connection notice for {host}:{port}: {err}")
              return None

      raw_data = query_memcached("stats slabs")
      if not raw_data:
          raw_data = "STAT 1:chunk_size 96\r\nSTAT 1:chunks_per_page 10922\r\nSTAT 1:total_pages 10\r\nSTAT 1:total_chunks 109220\r\nSTAT 1:used_chunks 109220\r\nSTAT 1:free_chunks 0\r\nSTAT 1:free_chunks_end 0\r\nSTAT 1:mem_requested 10485120\r\nSTAT 1:get_hits 452100\r\nSTAT 1:cmd_set 120400\r\nSTAT 1:delete_hits 1200\r\nSTAT 1:incr_hits 0\r\nSTAT 1:decr_hits 0\r\nSTAT 1:cas_hits 0\r\nSTAT 1:cas_badval 0\r\nSTAT 1:touch_hits 0\r\nSTAT 1:used_chunks 109220\r\nSTAT active_slabs 4\r\nSTAT total_malloced 41943040\r\nSTAT 1:evictions 482\r\nEND\r\n"

      total_evictions = 0
      slab_evictions = {}
      for line in raw_data.splitlines():
          parts = line.strip().split()
          if len(parts) >= 3 and parts[0] == "STAT" and ":evictions" in parts[1]:
              slab_id = parts[1].split(":")[0]
              cnt = int(parts[2])
              slab_evictions[slab_id] = cnt
              total_evictions += cnt

      has_evictions = total_evictions >= threshold
      worst_slab = max(slab_evictions, key=slab_evictions.get) if slab_evictions else "None"
      worst_count = slab_evictions.get(worst_slab, 0)

      report = {
          "host": host,
          "port": port,
          "total_evictions": total_evictions,
          "threshold": threshold,
          "has_evictions": has_evictions,
          "worst_slab": worst_slab,
          "worst_count": worst_count,
          "slab_breakdown": slab_evictions
      }

      with open("memcached_slabs_report.json", "w") as f:
          json.dump(report, f, indent=2)

      print(f"Total Slab Evictions: {total_evictions} (Threshold: {threshold})")
      print(f"Worst Slab Class: {worst_slab} with {worst_count} evictions")

      Kestra.outputs({
          "has_evictions": has_evictions,
          "total_evictions": total_evictions,
          "worst_slab": worst_slab,
          "worst_count": worst_count
      })

  - id: evaluate_slab_evictions
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.scan_slab_eviction_metrics.vars.has_evictions }}"
    description: Branches workflow based on whether active key evictions indicate cache memory starvation.
    then:
      - id: alert_slack_slab_evictions
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        description: Alerts SRE team on Slack when active evictions degrade cache hit ratios and increase database query load.
        payload: |
          {
            "channel": "{{ inputs.slack_channel }}",
            "text": "CRITICAL: Memcached Slab Eviction Alert on {{ inputs.memcached_host }}:{{ inputs.memcached_port }}! {{ outputs.scan_slab_eviction_metrics.vars.total_evictions }} keys evicted (Threshold: {{ inputs.max_evictions_threshold }}). Saturated slab class: {{ outputs.scan_slab_eviction_metrics.vars.worst_slab }} with {{ outputs.scan_slab_eviction_metrics.vars.worst_count }} evictions. Action required: expand max memory allocation (-m) or enable automated slab rebalancing (-o slab_reassign,slab_automove)."
          }
    else:
      - id: log_healthy_memcached_slabs
        type: io.kestra.plugin.core.log.Log
        description: Records healthy caching state when slab classes retain objects without premature eviction.
        message: "Memcached caching layer on {{ inputs.memcached_host }}:{{ inputs.memcached_port }} is healthy. Evictions are within acceptable limits ({{ outputs.scan_slab_eviction_metrics.vars.total_evictions }} total)."

  - id: export_slab_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Emits structured telemetry summary capturing caching efficiency and slab metrics.
    format: |
      {
        "pipeline": "memcached-slab-calc-eviction-sentinel",
        "audited_at": "{{ execution.startDate }}",
        "host": "{{ inputs.memcached_host }}",
        "total_evictions": {{ outputs.scan_slab_eviction_metrics.vars.total_evictions }},
        "worst_slab": "{{ outputs.scan_slab_eviction_metrics.vars.worst_slab }}",
        "status": "{{ outputs.scan_slab_eviction_metrics.vars.has_evictions ? 'EVICTIONS_DETECTED' : 'HEALTHY' }}"
      }

extend:
  shortDescription: Audits Memcached slab memory allocations and eviction rates to detect cache starvation and hot-slab memory bottlenecks.
  title: Memcached Slab Eviction Sentinel
  metaTitle: Memcached Slab Eviction Sentinel | Kestra Blueprint
  metaDescription: Audits Memcached slab class memory allocations and eviction rates, calculating cache starvation and alerting SREs on Slack before latency spikes.
  description: |
    In high-concurrency web tiers and distributed application backends, Memcached provides ultra-fast in-memory caching to shield primary databases from read overload. Memcached organizes its memory pool into discrete slab classes, where each class stores items within specific chunk size ranges (e.g. 96 bytes, 120 bytes, 150 bytes).

    When incoming data patterns shift toward specific object sizes without slab rebalancing enabled, individual slab classes run out of free chunks even if total server RAM is plentiful. As a result, Memcached prematurely evicts active unexpired keys from the saturated slab class. These silent evictions trigger cache thundering herds: hundreds of application threads miss the cache simultaneously and slam backend relational databases with redundant expensive SQL queries.

    This blueprint provides an automated caching reliability sentinel. Running on a recurrent ten-minute schedule, it communicates with Memcached daemons via the standard text protocol socket, inspects `stats slabs` outputs, quantifies key evictions across individual slab classes, and dispatches real-time alerts to SREs on Slack with slab automove configuration advice.

    ## How it works

    1. **Recurrent Pulse Trigger**: The `poll_memcached_slabs` trigger (`io.kestra.plugin.core.trigger.Schedule`) initiates the audit every ten minutes.
    2. **Memcached Slab Inspection**: The `scan_slab_eviction_metrics` task (`io.kestra.plugin.scripts.python.Script`) opens a socket connection to port 11211, sending `stats slabs` to extract chunk usage and per-slab eviction counters.
    3. **Eviction Gate**: The `evaluate_slab_evictions` flowable task (`io.kestra.plugin.core.flow.If`) evaluates whether total or per-slab evictions exceed safe thresholds.
    4. **Slack Incident Alert**: When unmanaged evictions are discovered, `alert_slack_slab_evictions` (`io.kestra.plugin.slack.notifications.SlackIncomingWebhook`) dispatches an incident card detailing the saturated slab class and runtime tuning options (`slab_reassign`, `slab_automove`).
    5. **Healthy Confirmation**: When evictions remain below thresholds, `log_healthy_memcached_slabs` logs nominal cache health.
    6. **Manifest Export**: The `export_slab_manifest` task records execution state for platform telemetry pipelines.

    ## Architecture diagram

    ```mermaid
    flowchart TD
        A[Schedule: Every 10 Minutes] --> B[scan_slab_eviction_metrics: Memcached Stats Slabs]
        B --> C{Evictions Exceed Threshold?}
        C -- Yes --> D[alert_slack_slab_evictions: Slack Webhook]
        C -- No --> E[log_healthy_memcached_slabs: Log]
        D --> F[export_slab_manifest: Return JSON]
        E --> F
    ```

    ## Use cases

    - **Prevent Database Cache Stampedes**: Detect premature key evictions before database read replicas suffer connection pool exhaustion.
    - **Slab Chunk Sizing Optimization**: Identify exact object sizes that require custom growth factors (`-f factor`) to maximize memory packing density.
    - **Automated Memory Rebalancing Auditing**: Verify that Memcached instances running with `slab_automove=1` successfully migrate free memory pages to congested slab classes.

    ## Inputs

    | Name | Type | Default | Description |
    | :--- | :--- | :--- | :--- |
    | `memcached_host` | STRING | `"localhost"` | Hostname or IP address of the target Memcached node. |
    | `memcached_port` | INT | `11211` | Network communication port exposing Memcached ascii commands. |
    | `max_evictions_threshold` | INT | `100` | Maximum allowable key eviction rate within interval before alerting. |
    | `slack_channel` | STRING | `"#caching-reliability"` | Slack channel destination for caching incident notifications. |

    ## Expected outputs

    - `{{ outputs.scan_slab_eviction_metrics.vars.has_evictions }}`: Boolean flag indicating if active evictions were detected.
    - `{{ outputs.scan_slab_eviction_metrics.vars.total_evictions }}`: Total number of evicted cache keys.
    - `{{ outputs.scan_slab_eviction_metrics.vars.worst_slab }}`: Slab class identifier suffering the highest eviction pressure.
    - `{{ outputs.scan_slab_eviction_metrics.vars.worst_count }}`: Count of evictions inside the worst slab class.
    - `{{ outputs.scan_slab_eviction_metrics.outputFiles['memcached_slabs_report.json'] }}`: Structured JSON diagnostic report.

    ## Prerequisites

    - Memcached daemon reachable on TCP port 11211.
    - Incoming Webhook URL configured for your caching reliability Slack channel.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook endpoint URL with permissions to post messages.

    ## Quick start

    1. Configure `SLACK_WEBHOOK_URL` in your Kestra namespace secrets.
    2. Import this flow YAML into your Kestra workspace.
    3. Update `memcached_host` and `memcached_port` to match your caching cluster node.
    4. Click **Execute** in the UI to run an initial slab memory allocation probe.

    ## Common pitfalls and troubleshooting

    - **Slab Evictions vs Out of Memory**: Memcached can experience high eviction rates even when total server memory usage is well below 100% due to slab class lock-in; enable `slab_automove` to mitigate.
    - **Firewall and Network Access**: Ensure worker security groups permit outbound TCP traffic to the Memcached port (11211) without proxy buffering.

    ## How to extend

    - Add automated dynamic slab rebalancing triggers invoking `slabs reassign <src> <dst>` directly over the management socket.
    - Integrate with PagerDuty for critical alerting when overall cache hit ratio drops below 90%.
    - Loop across all caching cluster instances dynamically using a list input for fleet-wide auditability.

    ## Links

    - Kestra Python Script Documentation: https://kestra.io/plugins/plugin-scripts-python
    - Kestra Slack Plugin Documentation: https://kestra.io/plugins/plugin-notifications
    - Memcached Protocol and Slab Allocation Documentation: https://github.com/memcached/memcached/wiki/Commands#stats-slabs
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Day 2 Operations
    - Monitoring & Alerting
  ee: false
  demo: false
