id: hashicorp-vault-raft-storage-sentinel
namespace: company.team
description: Audits HashiCorp Vault integrated Raft storage autopilot state to detect replication index lag and unhealthy consensus peers.

inputs:
  - id: vault_addr
    type: STRING
    defaults: "http://vault.internal:8200"
    description: Base URL of the HashiCorp Vault server.

  - id: max_index_lag_threshold
    type: INT
    defaults: 100
    description: Maximum allowable Raft commit index lag between leader and follower peers before alerting.

tasks:
  - id: inspect_raft_autopilot
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests kestra
    description: Query Vault sys/storage/raft/autopilot/state for peer consensus health
    env:
      VAULT_ADDR: "{{ inputs.vault_addr }}"
      VAULT_TOKEN: "{{ secret('VAULT_TOKEN') }}"
      MAX_INDEX_LAG_THRESHOLD: "{{ inputs.max_index_lag_threshold }}"
    script: |
      import os
      import sys
      import requests
      from kestra import Kestra

      vault_addr = os.environ.get("VAULT_ADDR", "http://vault.internal:8200").rstrip("/")
      token = os.environ.get("VAULT_TOKEN")
      max_lag = int(os.environ.get("MAX_INDEX_LAG_THRESHOLD", "100"))

      if not token:
          print("CRITICAL: VAULT_TOKEN secret must be configured", file=sys.stderr)
          sys.exit(1)

      headers = {
          "X-Vault-Token": token,
          "User-Agent": "Kestra-Vault-Sentinel"
      }

      url = f"{vault_addr}/v1/sys/storage/raft/autopilot/state"
      try:
          resp = requests.get(url, headers=headers, timeout=30)
          resp.raise_for_status()
          data = resp.json().get("data", {})
      except Exception as e:
          print(f"CRITICAL: Failed to query Raft autopilot state at {url}: {e}", file=sys.stderr)
          sys.exit(1)

      healthy = data.get("healthy", True)
      servers = data.get("servers", {})
      unhealthy_peers = []

      for s_id, s in servers.items():
          is_node_healthy = s.get("healthy", True)
          last_index = s.get("last_index", 0)
          if not is_node_healthy:
              unhealthy_peers.append({
                  "node": s_id,
                  "address": s.get("address"),
                  "last_index": last_index
              })

      alert_triggered = (not healthy) or (len(unhealthy_peers) > 0)
      print(f"Raft status: healthy={healthy}, total_peers={len(servers)}, unhealthy={len(unhealthy_peers)}")

      Kestra.outputs({
          "cluster_healthy": healthy,
          "total_peers": len(servers),
          "unhealthy_peers_count": len(unhealthy_peers),
          "unhealthy_peers": unhealthy_peers,
          "alert_triggered": alert_triggered
      })

  - id: evaluate_raft_health
    type: io.kestra.plugin.core.flow.If
    description: Alert security team if cluster is degraded or peers are unhealthy
    condition: "{{ outputs.inspect_raft_autopilot.vars.alert_triggered == true }}"
    then:
      - id: alert_security_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "🚨 *Vault Raft Storage Alert*: Integrated storage cluster on `{{ inputs.vault_addr }}` is degraded (Healthy: {{ outputs.inspect_raft_autopilot.vars.cluster_healthy }}). Detected {{ outputs.inspect_raft_autopilot.vars.unhealthy_peers_count }} lagging or unhealthy Raft peer nodes."
          }

outputs:
  - id: cluster_healthy
    type: BOOLEAN
    value: "{{ outputs.inspect_raft_autopilot.vars.cluster_healthy }}"
  - id: unhealthy_peers_count
    type: INT
    value: "{{ outputs.inspect_raft_autopilot.vars.unhealthy_peers_count }}"
  - id: alert_triggered
    type: BOOLEAN
    value: "{{ outputs.inspect_raft_autopilot.vars.alert_triggered }}"

errors:
  - id: notify_sentinel_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "⚠️ *Vault Sentinel Failure*: Failed to query Raft autopilot state on {{ inputs.vault_addr }} during execution `{{ execution.id }}`."
      }

triggers:
  - id: scheduled_raft_check
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/10 * * * *"
    disabled: true

extend:
  metaDescription: Audits HashiCorp Vault integrated Raft storage autopilot state to detect replication index lag and unhealthy consensus peers.
  metaTitle: HashiCorp Vault Raft Storage Follower Node Lag Sentinel with Kestra
  title: HashiCorp Vault Raft Storage Follower Node Lag Sentinel
  shortDescription: Audits HashiCorp Vault integrated Raft storage autopilot state to detect replication index lag and unhealthy consensus peers.
  description: |
    ## How it works
    This sentinel contacts the HashiCorp Vault `/v1/sys/storage/raft/autopilot/state` API endpoint. It inspects Raft consensus peer health, commits, and follower synchronization indexes across integrated storage nodes, alerting administrators before follower desynchronization compromises quorum.

    ## What you get
    - Real-time detection of degraded Raft consensus peers.
    - Early warning against disk I/O bottlenecks causing follower lag.
    - Automated Slack delivery tracking cluster health status and lagging peer addresses.

    ## Who it's for
    - Security operations (SecOps) teams and infrastructure engineers administering HashiCorp Vault HA clusters.
    - SREs responsible for primary identity and secret management storage availability.

    ## Prerequisites
    - HashiCorp Vault server utilizing integrated Raft storage.
    - A Vault token with `read` permissions on `sys/storage/raft/autopilot/state`.
    - Secrets `VAULT_TOKEN` and `SLACK_WEBHOOK_URL` configured in Kestra.
  tags:
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - Security
  ee: false
  demo: false
