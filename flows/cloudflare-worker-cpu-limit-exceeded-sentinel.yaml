id: cloudflare-worker-cpu-limit-exceeded-sentinel
namespace: company.networking

inputs:
  - id: account_id
    type: STRING
    description: Cloudflare Account ID.
  - id: script_name
    type: STRING
    description: Cloudflare Worker script name to audit.
  - id: cpu_exceeded_threshold
    type: INT
    defaults: 10
    description: Maximum acceptable count of CPU limit exceeded invocation failures over 15 minutes.

tasks:
  - id: query_worker_telemetry
    type: io.kestra.plugin.scripts.shell.Commands
    containerImage: ghcr.io/kestra-io/tools:latest
    commands:
      - |
        GRAPHQL_QUERY='{"query":"{ viewer { accounts(filter: {accountTag: \"{{ inputs.account_id }}\"}) { workersInvocationsAdaptive(filter: {datetime_geq: \"{{ now() | dateAdd(-15, '''MINUTES''') | isoDate }}\", scriptName: \"{{ inputs.script_name }}\", status: \"cpuExceeded\"}, limit: 100) { sum { subrequests } count } } } }"}'
        
        curl -s -X POST "https://api.cloudflare.com/client/v4/graphql"           -H "Authorization: Bearer {{ secret('CLOUDFLARE_API_TOKEN') }}"           -H "Content-Type: application/json"           --data-raw "$GRAPHQL_QUERY" > /tmp/worker_data.json
        
        CPU_EXCEEDED_COUNT=$(jq '[.data.viewer.accounts[0].workersInvocationsAdaptive[]? | .count] | add // 0' /tmp/worker_data.json)
        
        echo "::set-output name=cpu_exceeded_count::$CPU_EXCEEDED_COUNT::"

  - id: evaluate_worker_health
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.query_worker_telemetry.vars.cpu_exceeded_count | int > inputs.cpu_exceeded_threshold }}"
    then:
      - id: notify_edge_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#edge-network-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 Cloudflare Worker CPU Limit Exceeded (Error 1102) Alert",
                "text": "Cloudflare Worker `{{ inputs.script_name }}` recorded *{{ outputs.query_worker_telemetry.vars.cpu_exceeded_count }}* invocations exceeding CPU execution limits (Error 1102). Impact: Edge requests are aborted with HTTP 500 status codes due to CPU starvation, infinite loops, or unoptimized JSON parsing.",
                "footer": "Kestra Serverless Sentinel • Cloudflare Workers"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#edge-network-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ Cloudflare Worker Sentinel Execution Failed",
            "text": "The Cloudflare Worker GraphQL query workflow failed. Please verify API token and account parameters.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  metaDescription: "Audits Cloudflare Workers analytics to detect CPU time limit exceptions and serverless edge execution aborts."
  metaTitle: Cloudflare Worker CPU Time Limit Exceeded (Error 1102) Sentinel with Kestra
  title: Cloudflare Worker CPU Time Limit Exceeded (Error 1102) Sentinel
  shortDescription: Audits Cloudflare Workers analytics to detect CPU time limit exceptions and serverless edge execution aborts.
  description: |
    ## How it works
    This workflow connects to the Cloudflare GraphQL Analytics API (`workersInvocationsAdaptive`) to query edge executions with status `cpuExceeded`. When serverless worker functions exceed their configured CPU time limits (e.g. 50ms on standard plans) due to inefficient regex processing, complex cryptographic calculations, or large JSON parsing, Cloudflare immediately aborts the worker with Error 1102. An automated incident alert is sent to Slack.

    ## What you get
    - Real-time detection of catastrophic serverless CPU starvation at global edge locations.
    - Prevents silent user request dropouts and edge 500 error spikes.
    - Detailed breakdown of invocation counts and subrequest totals.

    ## Who it's for
    - Serverless Engineers and Frontend Developers building edge computing logic on Cloudflare Workers.
    - SREs maintaining mission-critical edge gateways, auth routers, and A/B testing proxies.

    ## Why orchestrate this with Kestra
    - **Automated Sampling**: Schedule continuous 15-minute audits without managing custom monitoring scripts.
    - **GraphQL Integration**: Query Cloudflare's high-resolution telemetry data natively.
    - **Unified Alerting**: Route actionable diagnostics directly to on-call engineering channels.

    ## Prerequisites
    - Cloudflare API token with `Account.Analytics:Read` permissions.
    - Secrets `CLOUDFLARE_API_TOKEN` and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import this blueprint into Kestra.
    2. Provide your Account ID and Worker script name.
    3. Run the workflow to inspect serverless CPU health.

    ## How to extend
    - Query duration quantiles (p50, p99) to detect gradual latency regression before hard CPU limit aborts.
    - Automatically scale to Unbound workers plan or rollback recent worker releases.

    ## Links
    - [Cloudflare Workers Analytics Documentation](https://developers.cloudflare.com/workers/observability/metrics-and-analytics/)
    - [Kestra Shell Plugin](https://kestra.io/plugins/plugin-scripts/commands/io.kestra.plugin.scripts.shell.commands)
  tags:
    - Cloud
    - Infrastructure
  subTags:
    - Infrastructure Automation
    - Day 2 Operations
  ee: false
  demo: false
