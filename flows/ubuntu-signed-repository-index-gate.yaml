id: ubuntu-signed-repository-index-gate
namespace: company.infrastructure
description: Verify an official Ubuntu update pocket signature, freshness and exact package-index hash before image
  promotion. No packages or repository settings are changed.
inputs:
- id: suite
  type: SELECT
  values:
  - noble-updates
  - jammy-updates
  defaults: noble-updates
- id: component
  type: SELECT
  values:
  - main
  - universe
  defaults: main
- id: architecture
  type: SELECT
  values:
  - amd64
  - i386
  defaults: amd64
tasks:
- id: verify_signed_release
  type: io.kestra.plugin.scripts.python.Script
  taskRunner:
    type: io.kestra.plugin.core.runner.Process
  env:
    SUITE: '{{ inputs.suite }}'
    COMPONENT: '{{ inputs.component }}'
    ARCHITECTURE: '{{ inputs.architecture }}'
  outputFiles:
  - verified-index.json
  script: |
    import json, os, subprocess, tempfile, urllib.request
    from urllib.parse import urlsplit
    from pathlib import Path
    from datetime import datetime, timezone, timedelta
    from email.utils import parsedate_to_datetime


    class ArchiveRedirectHandler(urllib.request.HTTPRedirectHandler):
        def redirect_request(self, req, fp, code, msg, headers, newurl):
            parsed = urlsplit(newurl)
            if parsed.scheme != 'https' or parsed.netloc != 'archive.ubuntu.com' or not parsed.path.startswith('/ubuntu/dists/'):
                raise ValueError('Archive redirect leaves the allowed HTTPS origin')
            return super().redirect_request(req, fp, code, msg, headers, newurl)


    def open_archive(url):
        return urllib.request.build_opener(ArchiveRedirectHandler()).open(url, timeout=30)



    def verified_index(suite, component, architecture, now=None):
        if suite not in ('noble-updates', 'jammy-updates'):
            raise ValueError('Only official Ubuntu updates pockets are supported')
        if component not in ('main', 'universe') or architecture not in ('amd64', 'i386'):
            raise ValueError('Unsupported component or architecture')
        url = 'https://archive.ubuntu.com/ubuntu/dists/' + suite + '/InRelease'
        with open_archive(url) as response:
            signed = response.read(8 * 1024 * 1024 + 1)
        if len(signed) > 8 * 1024 * 1024:
            raise ValueError('Signed metadata exceeds download limit')
        with tempfile.TemporaryDirectory() as tmp:
            source, plain = Path(tmp) / 'InRelease', Path(tmp) / 'Release'
            source.write_bytes(signed)
            result = subprocess.run(['gpgv', '--keyring', '/usr/share/keyrings/ubuntu-archive-keyring.gpg', '--output', str(plain), str(source)], text=True, capture_output=True, timeout=30)
            if result.returncode:
                raise ValueError('Ubuntu archive signature verification failed: ' + result.stderr[-1000:])
            text = plain.read_text()
        fields = {}
        for line in text.splitlines():
            if line and not line[0].isspace() and ': ' in line:
                key, value = line.split(': ', 1)
                if key in fields:
                    raise ValueError('Duplicate signed metadata field')
                fields[key] = value
        if fields.get('Origin') != 'Ubuntu' or fields.get('Suite') != suite or fields.get('Codename') != suite.split('-')[0]:
            raise ValueError('Unexpected signed repository identity')
        now = now or datetime.now(timezone.utc)
        date = parsedate_to_datetime(fields['Date'])
        if date.tzinfo is None or date > now + timedelta(minutes=10) or now - date > timedelta(hours=48):
            raise ValueError('Signed metadata is stale or from the future')
        if 'Valid-Until' in fields:
            valid_until = parsedate_to_datetime(fields['Valid-Until'])
            if valid_until.tzinfo is None or valid_until <= now:
                raise ValueError('Signed metadata has expired or has no timezone')
        name = component + '/binary-' + architecture + '/Packages.xz'
        matches = []
        in_sha256 = False
        for line in text.splitlines():
            if line == 'SHA256:':
                in_sha256 = True
                continue
            if in_sha256 and line and not line[0].isspace():
                in_sha256 = False
            if in_sha256:
                entry = line.split()
                if len(entry) == 3 and entry[2] == name:
                    matches.append(entry)
        if len(matches) != 1 or len(matches[0][0]) != 64 or not all(c in '0123456789abcdef' for c in matches[0][0]):
            raise ValueError('Missing or ambiguous signed SHA256 index entry')
        digest, size, _ = matches[0]
        if not 0 < int(size) <= 32 * 1024 * 1024:
            raise ValueError('Index size outside allowed download range')
        return dict(suite=suite, signed_date=fields['Date'], valid_until=fields.get('Valid-Until'), index_url='https://archive.ubuntu.com/ubuntu/dists/' + suite + '/' + component + '/binary-' + architecture + '/by-hash/SHA256/' + digest, sha256=digest, size=int(size), source_url=url)


    if __name__ == '__main__':
        report = verified_index(os.environ['SUITE'], os.environ['COMPONENT'], os.environ['ARCHITECTURE'])
        Path(os.environ['WORKING_DIR'], 'verified-index.json').write_text(json.dumps(report, indent=2))
        print('::' + json.dumps({'outputs': {'signed_date': report['signed_date'], 'index_url': report['index_url']}}) + '::')
- id: verify_index_bytes
  type: io.kestra.plugin.scripts.python.Script
  taskRunner:
    type: io.kestra.plugin.core.runner.Process
  inputFiles:
    verified-index.json: '{{ outputs.verify_signed_release.outputFiles[''verified-index.json''] }}'
  outputFiles:
  - ubuntu-index-evidence.json
  script: |
    import hashlib, json, os, urllib.request
    from urllib.parse import urlsplit
    from pathlib import Path


    class ArchiveRedirectHandler(urllib.request.HTTPRedirectHandler):
        def redirect_request(self, req, fp, code, msg, headers, newurl):
            parsed = urlsplit(newurl)
            if parsed.scheme != 'https' or parsed.netloc != 'archive.ubuntu.com' or not parsed.path.startswith('/ubuntu/dists/'):
                raise ValueError('Archive redirect leaves the allowed HTTPS origin')
            return super().redirect_request(req, fp, code, msg, headers, newurl)


    def open_archive(url):
        return urllib.request.build_opener(ArchiveRedirectHandler()).open(url, timeout=30)



    def check_index(report):
        expected_size = report['size']
        parsed = urlsplit(report['index_url'])
        if parsed.scheme != 'https' or parsed.netloc != 'archive.ubuntu.com' or not parsed.path.startswith('/ubuntu/dists/') or parsed.query or parsed.fragment or type(expected_size) is not int or not 0 < expected_size <= 32 * 1024 * 1024:
            raise ValueError('Invalid verified index locator')
        digest, size = hashlib.sha256(), 0
        with open_archive(report['index_url']) as response:
            while True:
                block = response.read(64 * 1024)
                if not block:
                    break
                size += len(block)
                if size > expected_size:
                    raise ValueError('Downloaded index exceeds signed size')
                digest.update(block)
        observed = digest.hexdigest()
        return dict(report, observed_sha256=observed, observed_size=size, matches=(size == expected_size and observed == report['sha256']), scope='Signed repository metadata and index integrity only; not package vulnerability or malware analysis.')


    if __name__ == '__main__':
        report = check_index(json.loads(Path('verified-index.json').read_text()))
        Path(os.environ['WORKING_DIR'], 'ubuntu-index-evidence.json').write_text(json.dumps(report, indent=2))
        print('::' + json.dumps({'outputs': {'matches': report['matches'], 'index_url': report['index_url']}}) + '::')
- id: publish_evidence
  type: io.kestra.plugin.core.output.OutputValues
  values:
    report_uri: '{{ outputs.verify_index_bytes.outputFiles[''ubuntu-index-evidence.json''] }}'
    index_url: '{{ outputs.verify_index_bytes.vars.index_url }}'
- id: gate_promotion
  type: io.kestra.plugin.core.flow.If
  condition: '{{ outputs.verify_index_bytes.vars.matches }}'
  then:
  - id: integrity_verified
    type: io.kestra.plugin.core.log.Log
    message: Signed Ubuntu release and exact package-index bytes verified. This is not package vulnerability clearance.
  else:
  - id: block_mismatched_index
    type: io.kestra.plugin.core.execution.Fail
    errorMessage: Package-index bytes do not match signed metadata. Inspect ubuntu-index-evidence.json; do not promote.
triggers:
- id: daily
  type: io.kestra.plugin.core.trigger.Schedule
  cron: 0 6 * * *
  disabled: true
extend:
  title: Verify Ubuntu Signed Repository Indexes Before Image Promotion
  metaTitle: Ubuntu Signed Repository Index Gate | Kestra
  shortDescription: Verify archive signatures, freshness and exact package-index hashes before promoting a Linux
    image or approving a mirror.
  metaDescription: Verify Ubuntu archive signatures, release freshness and signed package-index hashes before image
    promotion, saving JSON evidence without installing packages.
  description: |
    ## How it works
    1. A manual run or disabled daily schedule chooses an Ubuntu updates pocket, component and architecture.
    2. A Python task downloads InRelease and invokes gpgv against the worker's preinstalled Ubuntu archive keyring. Only authenticated Release content is parsed.
    3. The task checks Origin, Suite, Codename and signed Date, then selects the exact SHA256 entry for Packages.xz. Metadata older than 48 hours or over ten minutes ahead is rejected; Valid-Until is enforced when present.
    4. A second task streams the index through its content-addressed by-hash URL, avoiding a moving-index race. It compares both signed size and SHA256, saves evidence, and routes the promotion gate.

    ## What you get
    - Verified signed metadata identity, timestamps and expected index size/hash.
    - JSON evidence containing observed bytes/hash and the final integrity result.
    - Fail-closed signature, identity, freshness and download errors. A mismatch preserves evidence before the explicit Fail task.

    ## Who it's for
    Platform engineers maintaining Ubuntu image pipelines or checking official update-mirror integrity.

    ## Why orchestrate this with Kestra
    Separate signature verification and byte verification have visible task states, bounded downloads and durable artifacts. A downstream image flow can call this as a subflow without silently trusting a shell exit or installing packages during a probe.

    ## Prerequisites
    Use an Ubuntu Linux worker with Python 3, gpgv and a current ubuntu-keyring package providing /usr/share/keyrings/ubuntu-archive-keyring.gpg. The Process runner uses those installed tools. Permit HTTPS access to archive.ubuntu.com. The workflow never downloads a trust key, changes APT configuration or installs a package. Official noble-updates and jammy-updates pockets are intentionally the only allowed suites.

    ### Secrets
    None. All archive material is public; the keyring is a public trust anchor, not a secret.

    ## Quick start
    1. Install the worker prerequisites through your normal reviewed image process, then import the flow.
    2. Execute noble-updates, main and amd64 and inspect ubuntu-index-evidence.json.
    3. Confirm signature and freshness errors stop before promotion; never bypass a failure by importing an unreviewed key.
    4. Use the flow from an image pipeline, or enable the daily schedule if recurring checks are useful.

    ## How to extend
    Add an independently configured downstream approval step or compare evidence across mirrors. Keep the trust anchor out of the downloaded repository. This checks repository/index integrity, not the vulnerability, license or runtime safety of individual packages.

    ## Links
    - [Python Script task](https://kestra.io/plugins/plugin-script-python/io.kestra.plugin.scripts.python.script)
    - [APT archive authentication](https://manpages.ubuntu.com/manpages/jammy/man8/apt-secure.8.html)
    - [Ubuntu package archive](https://ubuntu.com/project/docs/how-ubuntu-is-made/concepts/package-archive/)
  tags:
  - Infrastructure
  subTags:
  - CI/CD & Deployment
  ee: false
  demo: false
