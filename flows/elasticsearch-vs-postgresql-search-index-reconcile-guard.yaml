id: elasticsearch-vs-postgresql-search-index-reconcile-guard
namespace: company.team

description: |
  Reconcile an Elasticsearch search index against its PostgreSQL source of truth. PostgreSQL is read
  first for the authoritative keyset and a per-row version, then the indexed documents are read from
  Elasticsearch. A document whose key is gone from PostgreSQL is ORPHANED and still answers searches.
  A document whose version is behind the row it mirrors is STALE. A row that is not indexed yet is
  MISSING and cannot be found. When auto_remediate is set the orphans are deleted and the stale and
  missing documents reindexed from the database, each only behind an approval gate. Both sides are
  then read again and the run fails if any divergence remains. PostgreSQL is never written.

inputs:
  - id: pg_host
    type: STRING
    displayName: PostgreSQL host
    defaults: "localhost"

  - id: pg_port
    type: INT
    displayName: PostgreSQL port
    defaults: 5432

  - id: pg_db
    type: STRING
    displayName: PostgreSQL database
    defaults: "postgres"

  - id: pg_user
    type: STRING
    displayName: PostgreSQL user
    defaults: "postgres"

  - id: pg_password
    type: STRING
    displayName: PostgreSQL password
    defaults: "{{ secret('POSTGRES_PASSWORD') }}"

  - id: pg_table
    type: STRING
    displayName: Source of truth table
    description: Table that holds the authoritative live rows. A deleted row is gone from it.
    defaults: "product"

  - id: pg_key_column
    type: STRING
    displayName: Key column
    description: Primary key column whose value is the Elasticsearch document id.
    defaults: "product_id"

  - id: pg_version_column
    type: STRING
    displayName: Version column
    description: Column that increases on every update, compared against the document version.
    defaults: "version"

  - id: pg_payload_column
    type: STRING
    displayName: Payload column
    description: A column reindexed into the document when a stale or missing document is rebuilt.
    defaults: "title"

  - id: es_host
    type: STRING
    displayName: Elasticsearch host
    description: Full URL including scheme and port, for example http://localhost:9200.
    defaults: "{{ secret('ELASTICSEARCH_HOST') }}"

  - id: es_user
    type: STRING
    displayName: Elasticsearch user
    defaults: "{{ secret('ELASTICSEARCH_USERNAME') }}"

  - id: es_password
    type: STRING
    displayName: Elasticsearch password
    defaults: "{{ secret('ELASTICSEARCH_PASSWORD') }}"

  - id: es_index
    type: STRING
    displayName: Search index
    description: The index that serves queries and is reconciled against the table.
    defaults: "products"

  - id: doc_version_field
    type: STRING
    displayName: Document version field
    description: Field in the document source that carries the row version.
    defaults: "version"

  - id: doc_payload_field
    type: STRING
    displayName: Document payload field
    description: Field in the document source rebuilt from pg_payload_column.
    defaults: "title"

  - id: batch_limit
    type: INT
    displayName: Rows per run
    description: Upper bound on the keyset read from each side in one run, so a huge table cannot build an unbounded diff.
    defaults: 5000

  - id: auto_remediate
    type: BOOL
    displayName: Auto remediate
    defaults: false

  - id: dry_run
    type: BOOL
    displayName: Dry run
    description: Must be false, together with auto_remediate, for any delete or reindex to run.
    defaults: true

variables:
  jdbc_url: "jdbc:postgresql://{{ inputs.pg_host }}:{{ inputs.pg_port }}/{{ inputs.pg_db }}"
  diff_prog: >-
    .pg as $pg | .es as $esr | .vf as $vf
    | ($pg | map({ (.k|tostring): {v: .v, p: .p} }) | add // {}) as $pgm
    | (($esr.hits.hits // []) | map({ id: (._id|tostring), v: (._source[$vf]) })) as $esx
    | ($esx | map(.id)) as $esids
    | ([ $esx[]
         | if ($pgm[.id] == null) then {code: "ORPHAN", key: .id, pg_version: null, es_version: .v}
           elif ((.v // -1) < $pgm[.id].v) then {code: "STALE", key: .id, pg_version: $pgm[.id].v, es_version: .v, new_version: $pgm[.id].v, new_payload: $pgm[.id].p}
           else empty end ]) as $esf
    | ([ $pg[] | select(([.k|tostring] - $esids) | length > 0)
         | {code: "MISSING", key: (.k|tostring), pg_version: .v, es_version: null, new_version: .v, new_payload: .p} ]) as $miss
    | {findings: ($esf + $miss)}
  orphan_prog: >-
    [.findings[] | select(.code == "ORPHAN") | .key]
  upsert_prog: >-
    .vf as $vf | .pf as $pf
    | [.findings[] | select(.code == "STALE" or .code == "MISSING")
       | {key: .key, doc_str: ({($vf): .new_version, ($pf): .new_payload} | tojson)}]

tasks:
  - id: pg_read
    type: io.kestra.plugin.jdbc.postgresql.Query
    description: Read-only. The authoritative keyset, each row version and the payload column, in key order.
    url: "{{ render(vars.jdbc_url) }}"
    username: "{{ inputs.pg_user }}"
    password: "{{ inputs.pg_password }}"
    fetchType: FETCH
    sql: >-
      SELECT {{ inputs.pg_key_column }} AS k, {{ inputs.pg_version_column }} AS v, {{ inputs.pg_payload_column }} AS p
      FROM {{ inputs.pg_table }}
      ORDER BY {{ inputs.pg_key_column }}
      LIMIT {{ inputs.batch_limit }}

  - id: es_read
    type: io.kestra.plugin.elasticsearch.Request
    description: Read-only. Every indexed document id with its version field, up to batch_limit hits.
    connection:
      hosts:
        - "{{ inputs.es_host }}"
      basicAuth:
        username: "{{ inputs.es_user }}"
        password: "{{ inputs.es_password }}"
    method: GET
    endpoint: "{{ inputs.es_index }}/_search"
    parameters:
      size: "{{ inputs.batch_limit }}"
      _source: "{{ inputs.doc_version_field }}"

  - id: index_check
    type: io.kestra.plugin.core.flow.If
    description: The Request task succeeds on any HTTP status, so a non-200 read is caught here before the diff.
    condition: "{{ outputs.es_read.status != 200 }}"
    then:
      - id: index_unreadable
        type: io.kestra.plugin.core.execution.Fail
        errorMessage: "Elasticsearch returned HTTP {{ outputs.es_read.status }} for index {{ inputs.es_index }}. The index must exist and be readable before it can be reconciled."

  - id: diff
    type: io.kestra.plugin.core.output.OutputValues
    description: Diff both sides. Orphan when the document key is gone from PostgreSQL, stale when the document version is behind, missing when a row is not indexed.
    values:
      result: >-
        {{ {'pg': outputs.pg_read.rows, 'es': outputs.es_read.response, 'vf': inputs.doc_version_field} | jq(vars.diff_prog) | first | toJson }}

  - id: plan
    type: io.kestra.plugin.core.output.OutputValues
    description: The orphan ids to delete and the stale plus missing documents to reindex from the database row.
    values:
      orphans: >-
        {{ fromJson(outputs.diff.values.result) | jq(vars.orphan_prog) | first | toJson }}
      upserts: >-
        {{ {'findings': fromJson(outputs.diff.values.result).findings, 'vf': inputs.doc_version_field, 'pf': inputs.doc_payload_field} | jq(vars.upsert_prog) | first | toJson }}

  - id: summary
    type: io.kestra.plugin.core.log.Log
    message: >-
      Reconcile of index {{ inputs.es_index }} against {{ render(vars.jdbc_url) }}:
      {{ fromJson(outputs.diff.values.result).findings | length }} divergences
      ({{ fromJson(outputs.diff.values.result).findings | jq('[.[] | select(.code=="ORPHAN")] | length') | first }} orphan,
      {{ fromJson(outputs.diff.values.result).findings | jq('[.[] | select(.code=="STALE")] | length') | first }} stale,
      {{ fromJson(outputs.diff.values.result).findings | jq('[.[] | select(.code=="MISSING")] | length') | first }} missing).
      {{ fromJson(outputs.diff.values.result).findings | jq('map("\(.code) \(.key) db=\(.pg_version // "gone") idx=\(.es_version // "none")") | join("; ")') | first }}

  - id: route
    type: io.kestra.plugin.core.flow.If
    condition: "{{ fromJson(outputs.diff.values.result).findings | length > 0 }}"
    then:
      - id: alert
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {{ {'text': 'Elasticsearch vs PostgreSQL reconcile on ' ~ inputs.es_index ~ ': ' ~ (fromJson(outputs.diff.values.result).findings | jq('map("\(.code) \(.key)") | join(", ")') | first) ~ '.' ~ (inputs.auto_remediate and not inputs.dry_run ? ' Remediation armed, waiting for approval.' : ' No change applied (auto_remediate=' ~ inputs.auto_remediate ~ ', dry_run=' ~ inputs.dry_run ~ ').')} | toJson }}

      - id: remediate_gate
        type: io.kestra.plugin.core.flow.If
        condition: "{{ inputs.auto_remediate and not inputs.dry_run }}"
        then:
          - id: approval
            type: io.kestra.plugin.core.flow.Pause
            description: Hold before any write to the index. Resume with approved true to apply, anything else leaves the index untouched.
            onResume:
              - id: approved
                type: BOOL
                required: false
                description: Set true to delete the orphans and reindex the stale and missing documents.
          - id: apply_gate
            type: io.kestra.plugin.core.flow.If
            condition: "{{ outputs.approval.onResume.approved ?? false }}"
            then:
              - id: evict_gate
                type: io.kestra.plugin.core.flow.If
                condition: "{{ fromJson(outputs.plan.values.orphans) | length > 0 }}"
                then:
                  - id: delete_orphans
                    type: io.kestra.plugin.elasticsearch.Request
                    description: Delete the orphan documents by id in one request, then refresh so the re-read sees the deletions.
                    connection:
                      hosts:
                        - "{{ inputs.es_host }}"
                      basicAuth:
                        username: "{{ inputs.es_user }}"
                        password: "{{ inputs.es_password }}"
                    method: POST
                    endpoint: "{{ inputs.es_index }}/_delete_by_query"
                    parameters:
                      refresh: "true"
                    body: >-
                      {{ {'query': {'ids': {'values': fromJson(outputs.plan.values.orphans)}}} | toJson }}

                  - id: delete_ok
                    type: io.kestra.plugin.core.flow.If
                    condition: "{{ outputs.delete_orphans.status != 200 }}"
                    then:
                      - id: delete_failed
                        type: io.kestra.plugin.core.execution.Fail
                        errorMessage: "Delete by query returned HTTP {{ outputs.delete_orphans.status }}: {{ outputs.delete_orphans.response | toJson }}"

              - id: reindex_gate
                type: io.kestra.plugin.core.flow.If
                condition: "{{ fromJson(outputs.plan.values.upserts) | length > 0 }}"
                then:
                  - id: reindex
                    type: io.kestra.plugin.core.flow.Loop
                    description: Reindex each stale and missing document from the database row behind the remediation gate. Serial so the writes do not race.
                    concurrencyLimit: 1
                    values: "{{ outputs.plan.values.upserts }}"
                    tasks:
                      - id: put_doc
                        type: io.kestra.plugin.elasticsearch.Put
                        connection:
                          hosts:
                            - "{{ inputs.es_host }}"
                          basicAuth:
                            username: "{{ inputs.es_user }}"
                            password: "{{ inputs.es_password }}"
                        index: "{{ inputs.es_index }}"
                        key: "{{ fromJson(item.value).key }}"
                        value: "{{ fromJson(item.value).doc_str }}"
                        refreshPolicy: IMMEDIATE

              - id: reverify_pg
                type: io.kestra.plugin.jdbc.postgresql.Query
                description: Read-only. Read the source of truth again after the writes.
                url: "{{ render(vars.jdbc_url) }}"
                username: "{{ inputs.pg_user }}"
                password: "{{ inputs.pg_password }}"
                fetchType: FETCH
                sql: >-
                  SELECT {{ inputs.pg_key_column }} AS k, {{ inputs.pg_version_column }} AS v, {{ inputs.pg_payload_column }} AS p
                  FROM {{ inputs.pg_table }}
                  ORDER BY {{ inputs.pg_key_column }}
                  LIMIT {{ inputs.batch_limit }}

              - id: reverify_es
                type: io.kestra.plugin.elasticsearch.Request
                description: Read the index again, so the proof comes from Elasticsearch itself.
                connection:
                  hosts:
                    - "{{ inputs.es_host }}"
                  basicAuth:
                    username: "{{ inputs.es_user }}"
                    password: "{{ inputs.es_password }}"
                method: GET
                endpoint: "{{ inputs.es_index }}/_search"
                parameters:
                  size: "{{ inputs.batch_limit }}"
                  _source: "{{ inputs.doc_version_field }}"

              - id: reverify_diff
                type: io.kestra.plugin.core.output.OutputValues
                description: Re-run the same diff. An orphan still indexed, a document still behind or a row still unindexed is unresolved.
                values:
                  remaining: >-
                    {{ {'pg': outputs.reverify_pg.rows, 'es': outputs.reverify_es.response, 'vf': inputs.doc_version_field} | jq(vars.diff_prog) | first | toJson }}

              - id: verify_result
                type: io.kestra.plugin.core.flow.If
                condition: "{{ fromJson(outputs.reverify_diff.values.remaining).findings | length > 0 }}"
                then:
                  - id: remediation_failed
                    type: io.kestra.plugin.core.execution.Fail
                    errorMessage: >-
                      Reconcile did not converge: {{ fromJson(outputs.reverify_diff.values.remaining).findings | jq('map("\(.code) \(.key)") | join(", ")') | first }} still diverge.
                      A row may have changed during the run or the connecting Elasticsearch user may not delete or index these documents.
                else:
                  - id: remediated
                    type: io.kestra.plugin.core.log.Log
                    message: >-
                      Reconciled and verified: deleted the orphan documents, reindexed the stale and missing documents, 0 divergence left.
            else:
              - id: withheld
                type: io.kestra.plugin.core.log.Log
                message: "Approval was not granted, so no document was deleted or reindexed. The divergence stands."
    else:
      - id: clean
        type: io.kestra.plugin.core.log.Log
        message: "The index matches the source of truth: every document mirrors a live row at its current version and every live row is indexed."

errors:
  - id: alert_flow_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {{ {'text': 'Elasticsearch vs PostgreSQL reconcile guard failed on ' ~ inputs.es_index ~ ' (execution ' ~ execution.id ~ '). Check the logs.'} | toJson }}

triggers:
  - id: hourly
    type: io.kestra.plugin.core.trigger.Schedule
    description: Shipped disabled and always in safe mode.
    cron: "35 * * * *"
    disabled: true
    inputs:
      auto_remediate: false
      dry_run: true

extend:
  title: Elasticsearch vs PostgreSQL Search Index Reconcile Guard
  shortDescription: Reconcile an Elasticsearch search index against its PostgreSQL source of truth, find orphaned, stale and missing documents by reading the keyset from PostgreSQL, alert Slack, then behind an approval gate delete and reindex them and re-verify.
  metaTitle: Reconcile an Elasticsearch index against PostgreSQL with Kestra
  metaDescription: Find Elasticsearch docs orphaned, stale or missing versus a PostgreSQL source of truth, alert Slack, delete and reindex them, then fail if any remain.
  description: |
    A search index drifts from the table it is built from in three ways that neither system can see
    alone. A row deleted in PostgreSQL can leave its document behind in Elasticsearch, so search keeps
    returning a record that no longer exists. A row updated in PostgreSQL can leave an older copy in
    the index, so search returns a document that is behind the truth. A new row may never reach the
    index, so it cannot be found at all.

    This blueprint reconciles the two. It reads the authoritative keyset and a per-row version from
    PostgreSQL first, then reads the indexed documents from Elasticsearch and diffs both sides.
    PostgreSQL is the source of truth, so the keyset is driven from it and every run is deterministic.
    It reports the divergence, alerts Slack and on request deletes the orphans with one
    `_delete_by_query` and reindexes each stale or missing document from the database row with a
    `Put`. Every write sits behind a `Pause` for human approval. After the writes it reads both sides
    again and fails the run if any divergence remains. PostgreSQL is never written.

    This blueprint was created by [zkasuran](https://github.com/zkasuran).

    ## Findings

    | Finding | Meaning | Fix |
    |---|---|---|
    | `ORPHAN` | The document key is gone from PostgreSQL (the row was deleted) but the document is still indexed | delete the document |
    | `STALE` | The row is live but the document version is behind the database version | reindex the document at the current database version and payload |
    | `MISSING` | The row is live but is not indexed, so it cannot be found | index the document from the database row |

    A deleted row with no document is already correct and is not flagged. The gate that must reach
    zero is the orphan plus stale plus missing count.

    ## How it works

    1. `pg_read` (`io.kestra.plugin.jdbc.postgresql.Query`, read-only) returns every live row with its
       key, its version and the payload column, in key order, up to `batch_limit` rows.
    2. `es_read` (`io.kestra.plugin.elasticsearch.Request`, read-only) runs one `_search` that returns
       every document id with its version field. `index_check` fails the run if the read is not HTTP
       200, because the Request task reports success on any status.
    3. `diff` compares the two in code. An orphan is a document whose key is not in the PostgreSQL
       keyset. A stale document is one whose version is below the database version. A missing row is
       one in PostgreSQL with no document. `plan` builds the orphan id list and the reindex list.
       `summary` logs the counts.
    4. `route` (`io.kestra.plugin.core.flow.If`):
       - **clean:** logs it, nothing to do, no alert.
       - **divergence:** `alert` posts to Slack.
         - `remediate_gate` runs only when `auto_remediate` is true and `dry_run` is false.
         - `approval` (`io.kestra.plugin.core.flow.Pause`) holds the run. It resumes only when a human
           sets `approved` true, so an unanswered or declined resume applies nothing.
         - `delete_orphans` (`io.kestra.plugin.elasticsearch.Request`, `_delete_by_query` with
           `refresh`) removes the orphan documents. `reindex` (`io.kestra.plugin.core.flow.Loop`,
           `concurrencyLimit: 1`) rebuilds each stale and missing document with
           `io.kestra.plugin.elasticsearch.Put` at `refreshPolicy: IMMEDIATE`.
         - `reverify_pg` and `reverify_es` read both sides again, `reverify_diff` re-runs the diff and
           `verify_result` fails the run if any orphan, stale or missing document is left.
    5. `errors` alerts Slack when the flow fails.

    ## What you get

    - A per-key reconcile across two live systems, with PostgreSQL as the source of truth, not a scan
      of Elasticsearch on its own.
    - The orphaned, stale and missing documents named, with the database version next to the indexed
      version.
    - Deletes and reindexes applied only behind `auto_remediate`, `dry_run` and a human approval, with
      a second read of both sides as proof.

    ## Who it's for

    - Teams that build an Elasticsearch index from a PostgreSQL table and have served a deleted record
      or a stale result in search.
    - SREs who want a scheduled check that the search index has not drifted from its database.
    - Teams evaluating the PostgreSQL and Elasticsearch plugins who want one flow that reads from both
      and writes only to the index.

    ## Why orchestrate this with Kestra

    A search index drifts quietly and the drift spans two systems that each look healthy alone. Kestra
    reads the authoritative keyset from PostgreSQL, reads the documents from Elasticsearch, sends the
    divergence to Slack, deletes and reindexes only behind two flags and an approval, verifies the
    result and keeps a history of every reconcile.

    ## Tested end to end

    On Kestra 2.0.5 against PostgreSQL 16 and Elasticsearch 8.15.3, with a local HTTP sink standing in
    for Slack. The source table held 5 live rows (`1` v5, `2` v5, `3` v7, `4` v3, `5` v2). The index
    held 6 documents (`1` v5, `2` v5, `3` v4, `4` v2, `6` v9, `7` v4), so `3` and `4` were stale, `6`
    and `7` were orphaned and `5` was missing.

    | Run | Inputs | Result |
    |---|---|---|
    | 1 | defaults | 5 divergences (orphan `6`, `7`; stale `3` db=7 idx=4, `4` db=3 idx=2; missing `5`). Alert sent. The index was unchanged |
    | 2 | `auto_remediate: true`, `dry_run: true` | Same 5 divergences, the gate stayed closed, the index was unchanged |
    | 3 | `auto_remediate: true`, `dry_run: false`, approved | Deleted 2 orphans, reindexed 2 stale and 1 missing document, re-read reported 0 remaining. `_search` after: `6` and `7` gone, `3` now v7, `4` now v3, `5` indexed v2, `1` and `2` untouched. `psql` confirmed the table unchanged |
    | 4 | clean index, `auto_remediate: true`, `dry_run: false` | 0 divergences, clean branch, no alert |
    | 5 | `auto_remediate: true`, `dry_run: false`, approval declined | 5 divergences, no write, the index was unchanged |
    | 6 | `auto_remediate: true`, `dry_run: false`, approved, with a writer indexing a new orphan during the pause | Re-read still found the new orphan, `verify_result` failed the run rather than reporting success |
    | 7 | unreachable Elasticsearch host | `es_read` failed, the run failed, the `errors` block posted to Slack |

    Detector proof: the degraded index reported 5 and the clean index reported 0, both matching the
    counts measured straight from `psql` and the Elasticsearch `_count` and `_search` APIs. PostgreSQL
    held 5 rows before and after every run.

    ## Prerequisites

    - A PostgreSQL table that is the source of truth, with a key column, a version that increases on
      every update and a hard delete that removes the row.
    - An Elasticsearch index whose document `_id` is the row key, carrying a version field it was
      indexed at and a payload field.
    - For the audit, a PostgreSQL role that can read the table and an Elasticsearch user that can
      search the index. For remediation, an Elasticsearch user allowed to delete and index documents.
    - Local testing:
      - `docker run -d --name pg --network kw7 -e POSTGRES_PASSWORD=pw postgres:16`;
      - `docker run -d --name es --network kw7 -e discovery.type=single-node -e xpack.security.enabled=false docker.elastic.co/elasticsearch/elasticsearch:8.15.3`;
      - seed a few rows, index some at the right version, index others a version behind, leave a document for a deleted row and leave one row unindexed.

    ### Secrets

    - `POSTGRES_PASSWORD`: the password for `pg_user`, read by every query.
    - `ELASTICSEARCH_HOST`: the index URL including scheme and port, for example `http://host:9200`.
    - `ELASTICSEARCH_USERNAME` and `ELASTICSEARCH_PASSWORD`: the Elasticsearch credentials.
    - `SLACK_WEBHOOK_URL`: used by `alert` and the `errors` block.
    - In Kestra OSS, provide each one as a base64-encoded environment variable prefixed `SECRET_`.

    ### Inputs

    | Input | Default | Purpose |
    |---|---|---|
    | `pg_host` / `pg_port` / `pg_db` / `pg_user` | localhost, 5432, postgres, postgres | PostgreSQL connection |
    | `pg_password` | `secret('POSTGRES_PASSWORD')` | PostgreSQL password |
    | `pg_table` | `product` | Source of truth table |
    | `pg_key_column` / `pg_version_column` / `pg_payload_column` | product_id, version, title | Row key, version and payload |
    | `es_host` / `es_user` / `es_password` | `secret(...)` | Elasticsearch connection |
    | `es_index` | `products` | Index reconciled against the table |
    | `doc_version_field` / `doc_payload_field` | version, title | Document version and payload fields |
    | `batch_limit` | `5000` | Upper bound on the keyset read from each side |
    | `auto_remediate` | `false` | Allow deletes and reindexes |
    | `dry_run` | `true` | Must be `false` for a change to apply |

    ## Quick start

    1. Add the `POSTGRES_PASSWORD`, `ELASTICSEARCH_HOST`, `ELASTICSEARCH_USERNAME`,
       `ELASTICSEARCH_PASSWORD` and `SLACK_WEBHOOK_URL` secrets.
    2. Import the flow and set the connection inputs and the field names to match your index.
    3. Run it once and read the orphaned, stale and missing documents.
    4. Run it with `auto_remediate: true` and `dry_run: false`, approve the pause, then read the
       `remediated` log for the proof.
    5. Enable the `hourly` trigger, which always runs in safe mode.

    ## How to extend

    - Compare on `updated_at` instead of a numeric version by returning it from the query and storing
      it in the document.
    - Create the index from a mapping first when it may not exist, then let the missing rows fill it.
    - Page through a large table by ordering on the key and carrying a cursor in a KV store, so an
      index larger than `index.max_result_window` is reconciled in slices.
    - Reconcile several indices by looping over a list of tables and indices.

    ## Links

    - Elasticsearch plugin: https://kestra.io/plugins/plugin-elasticsearch
    - PostgreSQL plugin: https://kestra.io/plugins/plugin-jdbc-postgres
    - Delete by query: https://www.elastic.co/guide/en/elasticsearch/reference/current/docs-delete-by-query.html
  tags:
    - Data
    - Infrastructure
  subTags:
    - Day 2 Operations
    - Testing & Quality
  ee: false
  demo: false