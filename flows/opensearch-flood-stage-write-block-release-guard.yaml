id: opensearch-flood-stage-write-block-release-guard
namespace: company.team
description: |
  Detect OpenSearch indices left read-only by the flood-stage disk
  watermark, confirm disk has dropped back under the high watermark, then
  clear the read_only_allow_delete block and prove writes work again.

inputs:
  - id: opensearch_url
    type: STRING
    defaults: "http://localhost:9200"
    description: Base URL of the OpenSearch cluster, scheme host and port.
  - id: opensearch_username
    type: STRING
    defaults: "{{ secret('OPENSEARCH_USERNAME') }}"
    description: Username for basic auth. Clusters with security disabled ignore it.
  - id: opensearch_password
    type: STRING
    defaults: "{{ secret('OPENSEARCH_PASSWORD') }}"
    description: Password for basic auth. Clusters with security disabled ignore it.
  - id: target
    type: STRING
    defaults: "_all"
    description: Index or pattern to inspect and clear. Defaults to every index.
  - id: high_watermark_percent
    type: FLOAT
    defaults: 90.0
    description: Measured disk usage must sit under this percent before the block is cleared. Mirrors the OpenSearch high watermark default of ninety percent.
  - id: probe_index
    type: STRING
    defaults: ""
    description: Existing index to write a one-document probe into after the block clears. Leave empty to skip the probe.
  - id: dry_run
    type: BOOL
    defaults: true
    description: When true the flow only reports, it never clears the block.
  - id: auto_remediate
    type: BOOL
    defaults: false
    description: When true and dry_run is false the flow clears the block.
  - id: probe_write
    type: BOOL
    defaults: false
    description: When true a probe document is written after the clear to confirm writes are accepted again.
triggers:
  - id: daily
    type: io.kestra.plugin.core.trigger.Schedule
    description: Scan for stuck flood-stage write blocks every morning in safe report-only mode.
    cron: "0 6 * * *"
    disabled: true
    inputs:
      dry_run: true
      auto_remediate: false

tasks:
  - id: detect
    type: io.kestra.plugin.opensearch.Request
    description: Read which indices still carry the read_only_allow_delete block that the flood-stage watermark sets.
    connection:
      hosts:
        - "{{ inputs.opensearch_url }}"
      basicAuth:
        username: "{{ inputs.opensearch_username }}"
        password: "{{ inputs.opensearch_password }}"
    method: GET
    endpoint: "{{ inputs.target }}/_settings/index.blocks.read_only_allow_delete"
    parameters:
      flat_settings: "true"
      expand_wildcards: "all"

  - id: node_fs
    type: io.kestra.plugin.opensearch.Request
    description: Read filesystem totals per node so the flow can compute current disk usage.
    connection:
      hosts:
        - "{{ inputs.opensearch_url }}"
      basicAuth:
        username: "{{ inputs.opensearch_username }}"
        password: "{{ inputs.opensearch_password }}"
    method: GET
    endpoint: "_nodes/stats/fs"
    parameters:
      filter_path: "nodes.*.fs.total"
  - id: cluster_settings
    type: io.kestra.plugin.opensearch.Request
    description: Read cluster settings with defaults so the configured high watermark is on the record.
    connection:
      hosts:
        - "{{ inputs.opensearch_url }}"
      basicAuth:
        username: "{{ inputs.opensearch_username }}"
        password: "{{ inputs.opensearch_password }}"
    method: GET
    endpoint: "_cluster/settings"
    parameters:
      include_defaults: "true"
      flat_settings: "true"

  - id: report
    type: io.kestra.plugin.core.log.Log
    description: Record the blocked indices, the measured disk usage and whether the flow will act.
    message: |
      Flood-stage block scan on {{ inputs.target }}.
      Blocked indices: {{ outputs.detect.response | jq('keys') | first }} (count {{ outputs.detect.response | jq('keys|length') | first }}).
      Max node disk usage: {{ outputs.node_fs.response | jq('[.nodes[].fs.total|(1-(.available_in_bytes/.total_in_bytes))*100]|max') | first }} percent.
      Clear threshold (high watermark input): {{ inputs.high_watermark_percent }} percent.
      Configured high watermark: {{ outputs.cluster_settings.response | jq('(.transient["cluster.routing.allocation.disk.watermark.high"]) // (.persistent["cluster.routing.allocation.disk.watermark.high"]) // (.defaults["cluster.routing.allocation.disk.watermark.high"])') | first }}.
      Mode dry_run={{ inputs.dry_run }} auto_remediate={{ inputs.auto_remediate }}.
  - id: alert_detected_gate
    type: io.kestra.plugin.core.flow.If
    description: Alert Slack the moment a stuck write block is found, before and apart from any remediation decision.
    condition: "{{ (outputs.detect.response | jq('keys|length') | first) > 0 }}"
    then:
      - id: alert_detected
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Post the blocked indices, the measured disk usage and whether a change will be applied on this run.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "OpenSearch flood-stage write block detected on {{ inputs.target }}. Blocked indices {{ outputs.detect.response | jq('keys|join(", ")') | first }} (count {{ outputs.detect.response | jq('keys|length') | first }}). Max node disk usage {{ outputs.node_fs.response | jq('[.nodes[].fs.total|(1-(.available_in_bytes/.total_in_bytes))*100]|max') | first }} percent. Remediation will run {{ inputs.auto_remediate and not inputs.dry_run }} (auto_remediate {{ inputs.auto_remediate }} dry_run {{ inputs.dry_run }})."
          }

  - id: route
    type: io.kestra.plugin.core.flow.If
    description: Act only when a block is present and the operator asked for a real remediation.
    condition: "{{ (outputs.detect.response | jq('keys|length') | first) > 0 and inputs.auto_remediate and not inputs.dry_run }}"
    then:
      - id: disk_gate
        type: io.kestra.plugin.core.flow.If
        description: Clear the block only when disk has recovered under the high watermark, otherwise clearing would re-trip at once.
        condition: "{{ (outputs.node_fs.response | jq('[.nodes[].fs.total|(1-(.available_in_bytes/.total_in_bytes))*100]|max') | first) < inputs.high_watermark_percent }}"
        then:
          - id: clear
            type: io.kestra.plugin.opensearch.Request
            description: Clear the read_only_allow_delete block across the target by setting it to null.
            connection:
              hosts:
                - "{{ inputs.opensearch_url }}"
              basicAuth:
                username: "{{ inputs.opensearch_username }}"
                password: "{{ inputs.opensearch_password }}"
            method: PUT
            endpoint: "{{ inputs.target }}/_settings"
            body: |
              {"index.blocks.read_only_allow_delete": null}
          - id: reverify
            type: io.kestra.plugin.opensearch.Request
            description: Re-read the index block setting so the clear is confirmed against the system itself.
            connection:
              hosts:
                - "{{ inputs.opensearch_url }}"
              basicAuth:
                username: "{{ inputs.opensearch_username }}"
                password: "{{ inputs.opensearch_password }}"
            method: GET
            endpoint: "{{ inputs.target }}/_settings/index.blocks.read_only_allow_delete"
            parameters:
              flat_settings: "true"
              expand_wildcards: "all"

          - id: reverify_cluster
            type: io.kestra.plugin.opensearch.Request
            description: Re-read cluster settings so any cluster-level read-only block is also on the record.
            connection:
              hosts:
                - "{{ inputs.opensearch_url }}"
              basicAuth:
                username: "{{ inputs.opensearch_username }}"
                password: "{{ inputs.opensearch_password }}"
            method: GET
            endpoint: "_cluster/settings"
            parameters:
              flat_settings: "true"

          - id: verify_report
            type: io.kestra.plugin.core.log.Log
            description: Record the state after the clear so the audit trail shows the result.
            message: |
              After clear on {{ inputs.target }}.
              Still-blocked indices: {{ outputs.reverify.response | jq('keys') | first }} (count {{ outputs.reverify.response | jq('keys|length') | first }}).
              Cluster read-only block: {{ outputs.reverify_cluster.response | jq('(.persistent["cluster.blocks.read_only_allow_delete"]) // (.transient["cluster.blocks.read_only_allow_delete"]) // "none"') | first }}.
          - id: landed
            type: io.kestra.plugin.core.flow.If
            description: Fail loudly when the block is still present after the clear, otherwise confirm success.
            condition: "{{ (outputs.reverify.response | jq('keys|length') | first) == 0 }}"
            then:
              - id: probe_gate
                type: io.kestra.plugin.core.flow.If
                description: Write a probe document when asked so a real write proves the index accepts writes again.
                condition: "{{ inputs.probe_write }}"
                then:
                  - id: probe
                    type: io.kestra.plugin.opensearch.Request
                    description: Write one marker document into the probe index to confirm writes are accepted.
                    connection:
                      hosts:
                        - "{{ inputs.opensearch_url }}"
                      basicAuth:
                        username: "{{ inputs.opensearch_username }}"
                        password: "{{ inputs.opensearch_password }}"
                    method: POST
                    endpoint: "{{ inputs.probe_index }}/_doc"
                    body: |
                      {"flow": "{{ flow.id }}", "execution": "{{ execution.id }}", "check": "write-unblocked-probe"}
                  - id: probe_landed
                    type: io.kestra.plugin.core.flow.If
                    description: A probe write is only a pass on a 2xx status, the plugin reports task success on any status.
                    condition: "{{ outputs.probe.status == 200 or outputs.probe.status == 201 }}"
                    then:
                      - id: success_probe
                        type: io.kestra.plugin.core.log.Log
                        description: Record that the clear landed and a real write was accepted.
                        message: "Block cleared on {{ inputs.target }} and probe write to {{ inputs.probe_index }} returned {{ outputs.probe.status }}."
                    else:
                      - id: fail_probe
                        type: io.kestra.plugin.core.execution.Fail
                        description: Fail when the probe write was rejected so a half-cleared cluster is never reported healthy.
                        errorMessage: "Probe write to {{ inputs.probe_index }} returned {{ outputs.probe.status }}, writes are still blocked."
                else:
                  - id: success_noprobe
                    type: io.kestra.plugin.core.log.Log
                    description: Record that the clear landed when no probe write was requested.
                    message: "Block cleared on {{ inputs.target }}, no probe write requested."
            else:
              - id: fail_not_cleared
                type: io.kestra.plugin.core.execution.Fail
                description: Fail when indices are still blocked after the clear so the problem is never hidden.
                errorMessage: "read_only_allow_delete still present after clear on {{ inputs.target }}, see the verify_report task."
        else:
          - id: refuse_report
            type: io.kestra.plugin.core.log.Log
            description: Record that the flow refused to clear because disk is still above the high watermark.
            message: "Refusing to clear on {{ inputs.target }}, disk usage {{ outputs.node_fs.response | jq('[.nodes[].fs.total|(1-(.available_in_bytes/.total_in_bytes))*100]|max') | first }} percent is not under the threshold {{ inputs.high_watermark_percent }} percent."
          - id: fail_disk_full
            type: io.kestra.plugin.core.execution.Fail
            description: Fail so the alert fires, clearing the block while disk is full would only re-trip the flood stage.
            errorMessage: "Disk is still above the high watermark on {{ inputs.target }}, free space before clearing read_only_allow_delete."
    else:
      - id: report_only
        type: io.kestra.plugin.core.log.Log
        description: Record a no-change outcome, either nothing is blocked or the run is in report mode.
        message: "No action taken on {{ inputs.target }}. Blocked count {{ outputs.detect.response | jq('keys|length') | first }}, dry_run {{ inputs.dry_run }}, auto_remediate {{ inputs.auto_remediate }}."

errors:
  - id: alert
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alert Slack on any failure so a stuck write block or a refused clear is never silent.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "opensearch-flood-stage-write-block-release-guard failed in flow {{ flow.id }} (execution {{ execution.id }}) on target {{ inputs.target }}. The write block is still present or the clear was refused because disk is full or a request errored. Check the execution logs."
      }
extend:
  title: Detect and Release OpenSearch Flood-Stage Write Blocks
  shortDescription: A Request task finds indices stuck read-only after the flood-stage watermark, confirms disk recovered, clears the read_only_allow_delete block and probes a write.
  metaTitle: OpenSearch Flood-Stage Write Block Release with Kestra
  metaDescription: Detect OpenSearch indices stuck read-only after the flood-stage disk watermark, confirm disk recovered, then clear the block and verify writes.
  description: |
    When a data node crosses the flood-stage disk watermark, OpenSearch sets `index.blocks.read_only_allow_delete` on its indices and every write returns HTTP 429. Freeing disk does not reliably bring writes back. On a single-node cluster the disk decider is off by default, so nothing re-evaluates the block. Plenty of production clusters disable the decider or sit right at the watermark. The block then stays until an operator runs `PUT _all/_settings` with the setting cleared to null. This blueprint does that safely: it finds the stuck indices, confirms disk has genuinely recovered, clears the block, re-reads the system to prove the clear landed then writes a probe document to prove writes are accepted again. It alerts Slack the moment a block is detected, before any remediation decision.

    ## Findings

    - The flood-stage block rejects writes with HTTP 429 and the reason `disk usage exceeded flood-stage watermark, index has read-only-allow-delete block`, not 403. The `io.kestra.plugin.opensearch.Request` task reports task success on any status, so every gate here reads `outputs.<id>.status` or re-reads the setting, never task success.
    - The block clears only with the body value `null`. Sending `false` leaves it in place.
    - Clearing while disk is still full just re-trips the flood stage, so the flow refuses to clear unless measured disk usage is under the high watermark.

    ## How it works

    1. `detect` (`io.kestra.plugin.opensearch.Request`) reads `GET {target}/_settings/index.blocks.read_only_allow_delete`. OpenSearch returns one entry per blocked index and omits the rest, so the key count is the number of stuck indices.
    2. `node_fs` reads `GET _nodes/stats/fs` and the flow computes the busiest node's disk usage percent. `cluster_settings` reads the configured high watermark for the record.
    3. `report` logs the blocked indices, the measured usage and the mode. `alert_detected` then posts a Slack findings alert whenever a block is present, before and apart from the remediation gate, so a plain detect run or a dry_run run both alert.
    4. `route` (`io.kestra.plugin.core.flow.If`) acts only when a block is present, `auto_remediate` is true and `dry_run` is false. Otherwise `report_only` records a no-change outcome.
    5. `disk_gate` clears the block only when measured usage is under `high_watermark_percent`. If disk is still full it logs the refusal and fails so the alert fires.
    6. `clear` sends `PUT {target}/_settings` with `read_only_allow_delete` set to null. `reverify` and `reverify_cluster` re-read the system and `landed` fails the run if any index is still blocked.
    7. When `probe_write` is true, `probe` writes one document and `probe_landed` fails unless the status is 200 or 201.
    8. The `errors` block posts a Slack alert on any failure.
    9. A disabled `Schedule` trigger runs the scan every morning in report-only mode.
    ## What you get

    - A one-command recovery for the most common OpenSearch disk incident, driven through the plugin and logged as an execution.
    - A safety gate that refuses to clear while disk is still full, so the block does not re-trip the moment it is removed.
    - Proof the fix landed, from a re-read of the setting and an optional real write, not from a hopeful 200.
    - A Slack findings alert the moment a block is detected, independent of whether a clear will run.
    - A Slack failure alert whenever the block persists after a clear or the clear is refused.

    ## Who it's for

    - Platform and SRE teams whose ingest stops with HTTP 429 after a disk scare and stays stopped.
    - Teams running single-node or small OpenSearch clusters where the write block never auto-clears.
    - Anyone who has cleared this block by hand at 3am and wants it gated, logged and alertable instead.

    ## Why orchestrate this with Kestra

    Clearing a write block is a destructive-adjacent action that must be observed. Running it as a flow records which indices were stuck, what the disk looked like, whether the clear was allowed and whether writes came back, all against one execution id. The read-only default and the disk gate stop a careless clear during a real disk-full event. The re-read plus probe mean a green run actually means writes work.

    ## Tested end to end

    Verified on Kestra 2.0.5 against OpenSearch 2.19.6 with security disabled. The flood-stage block was reproduced two ways: by lowering the watermark so the disk monitor set `read_only_allow_delete` on every index on its own and by applying the identical index setting the flood stage applies. A write while blocked returned HTTP 429 with the flood-stage reason. Clean, report, dry-run, remediate and refuse paths were all run and each outcome was confirmed with a direct OpenSearch call, not only the Kestra log.

    ## Prerequisites

    - A reachable OpenSearch cluster. For a secured cluster, credentials allowed to read settings and node stats and to update index settings.
    - A Slack incoming webhook for failure alerts.
    - For the probe write, an existing index the flow may append a one-document marker to.

    ### Secrets

    - `OPENSEARCH_USERNAME`: username for basic auth, when the cluster has security enabled.
    - `OPENSEARCH_PASSWORD`: password for basic auth, when the cluster has security enabled.
    - `SLACK_WEBHOOK_URL`: Slack incoming webhook URL for failure alerts.

    ### Inputs

    - `opensearch_url`: base URL of the cluster.
    - `target`: index or pattern to inspect and clear, `_all` by default.
    - `high_watermark_percent`: disk usage ceiling before a clear is allowed, 90.0 by default.
    - `dry_run` and `auto_remediate`: the two safety gates. A clear runs only when `auto_remediate` is true and `dry_run` is false.
    - `probe_write` and `probe_index`: turn on a real write check after the clear.
    ## Quick start

    1. Add the Slack webhook secret plus the OpenSearch credentials if your cluster is secured.
    2. Set `opensearch_url` to your cluster. Run once with the defaults (`dry_run` true) to see which indices are blocked and what disk looks like.
    3. When disk has recovered, run with `auto_remediate` true and `dry_run` false to clear the block. Set `probe_write` true with a `probe_index` to confirm a real write.
    4. Set `disabled: false` on the `daily` trigger to scan every morning in report-only mode.

    ## How to extend

    - Point `target` at a prefix like `logs-*` to scope the clear to one index family.
    - Raise or lower `high_watermark_percent` to match your configured flood and high watermarks.
    - Add a second alert branch that pages when the clear is refused because disk is genuinely full, which is a capacity problem the clear cannot fix.
    - Chain a downstream flow off this flow's FAILED state to open a ticket when a block cannot be cleared.

    ## Links

    - [OpenSearch plugin documentation](https://kestra.io/plugins/plugin-opensearch)
    - [OpenSearch disk-based shard allocation](https://docs.opensearch.org/latest/tuning-your-cluster/cluster/)
    - [OpenSearch index blocks](https://docs.opensearch.org/latest/api-reference/index-apis/blocks/)

    This blueprint was created by [zkasuran](https://github.com/zkasuran).
  tags:
    - Infrastructure
    - System
  subTags:
    - Day 2 Operations
    - Monitoring & Alerting
    - Storage
  ee: false
  demo: false









