id: sentry-bad-release-automated-rollback-gate
namespace: company.deployments

inputs:
  - id: release_version
    type: STRING
    defaults: "v2.4.0"
    description: Target release version tag to evaluate in Sentry.

  - id: previous_stable_version
    type: STRING
    defaults: "v2.3.9"
    description: Known stable release version to roll back to if health checks fail.

  - id: max_tolerated_new_issues
    type: INT
    defaults: 5
    description: Maximum tolerated newly introduced unresolved issues before triggering a rollback.

tasks:
  - id: fetch_release_details
    type: io.kestra.plugin.fs.http.Request
    uri: "https://sentry.io/api/0/projects/{{ secret('SENTRY_ORG_SLUG') }}/{{ secret('SENTRY_PROJECT_SLUG') }}/releases/{{ inputs.release_version }}/"
    method: GET
    headers:
      Authorization: "Bearer {{ secret('SENTRY_AUTH_TOKEN') }}"
      Content-Type: "application/json"

  - id: fetch_release_issues
    type: io.kestra.plugin.fs.http.Request
    uri: "https://sentry.io/api/0/projects/{{ secret('SENTRY_ORG_SLUG') }}/{{ secret('SENTRY_PROJECT_SLUG') }}/issues/?query=firstRelease:{{ inputs.release_version }}+is:unresolved&limit=25"
    method: GET
    headers:
      Authorization: "Bearer {{ secret('SENTRY_AUTH_TOKEN') }}"
      Content-Type: "application/json"

  - id: evaluate_release_health
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.12-slim
    script: |
      import json
      import sys
      from kestra import Kestra

      # Parse release details and issue listing directly without synthetic fallbacks
      release_raw = {{ outputs.fetch_release_details.body }}
      issues_raw = {{ outputs.fetch_release_issues.body }}

      if not isinstance(release_raw, dict):
          raise ValueError(f"Sentry release endpoint returned invalid payload. Expected JSON object, got {type(release_raw)}.")

      if not isinstance(issues_raw, list):
          raise ValueError(f"Sentry issues endpoint returned invalid payload. Expected JSON list, got {type(issues_raw)}.")

      new_issues_count = len(issues_raw)
      total_event_count = sum(int(issue.get("count", 0)) for issue in issues_raw)
      max_tolerated = int("{{ inputs.max_tolerated_new_issues }}")

      # Determine if the release has breached the failure threshold
      rollback_needed = new_issues_count >= max_tolerated or total_event_count >= 100

      print(f"Sentry Release Evaluation for {{ inputs.release_version }}:")
      print(f"  New Unresolved Issues: {new_issues_count} (Threshold: {max_tolerated})")
      print(f"  Total Error Events: {total_event_count}")
      print(f"  Rollback Required: {rollback_needed}")

      top_culprits = [
          {"id": i.get("id"), "title": i.get("title"), "count": i.get("count")}
          for i in issues_raw[:3]
      ]

      Kestra.outputs({
          "new_issues_count": new_issues_count,
          "total_event_count": total_event_count,
          "rollback_required": rollback_needed,
          "top_culprits": top_culprits
      })

  - id: rollback_decision_gate
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.evaluate_release_health.vars.rollback_required }}"
    then:
      - id: trigger_automated_rollback
        type: io.kestra.plugin.fs.http.Request
        uri: "https://api.github.com/repos/{{ secret('GITHUB_REPOSITORY') }}/dispatches"
        method: POST
        headers:
          Authorization: "Bearer {{ secret('GITHUB_TOKEN') }}"
          Accept: "application/vnd.github.v3+json"
          Content-Type: "application/json"
        body: |
          {
            "event_type": "rollback_deployment",
            "client_payload": {
              "failed_release": "{{ inputs.release_version }}",
              "target_rollback_version": "{{ inputs.previous_stable_version }}",
              "trigger_reason": "Sentry release error threshold breached: {{ outputs.evaluate_release_health.vars.new_issues_count }} new unresolved issues detected."
            }
          }

      - id: notify_slack_rollback_executed
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": ":rotating_light: *Automated Deployment Rollback Triggered*\nProject: `{{ secret('SENTRY_PROJECT_SLUG') }}`\nFailed Release: `{{ inputs.release_version }}`\nRollback Target: `{{ inputs.previous_stable_version }}`\nNew Issues: `{{ outputs.evaluate_release_health.vars.new_issues_count }}`\nTotal Crashes: `{{ outputs.evaluate_release_health.vars.total_event_count }}`\nStatus: Rollback dispatch event sent to GitHub Actions."
          }

  - id: log_verification_result
    type: io.kestra.plugin.core.log.Log
    message: "Release health gate completed for {{ inputs.release_version }}. Rollback triggered: {{ outputs.evaluate_release_health.vars.rollback_required }}"

triggers:
  - id: deployment_window_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/10 * * * *"

extend:
  title: Sentry Bad Release Automated Rollback Gate
  metaTitle: Sentry Bad Release Rollback Gate | Kestra
  shortDescription: Automated Sentry release health monitoring that triggers instant deployment rollbacks on error spikes.
  metaDescription: Detect Sentry error bursts on new releases, evaluate error thresholds, and trigger automated deployment rollbacks with incident notifications via Kestra.
  description: |
    Automated canary and release health evaluation sentinel that monitors Sentry for error velocity and actively executes automated deployment rollbacks when failure thresholds are breached.

    ## How it works

    1. A schedule trigger runs every 10 minutes during active deployment windows, or executes on-demand post-deployment.
    2. The first HTTP request task queries Sentry's Releases API to verify release metadata and adoption status.
    3. The second HTTP request queries the Sentry Issues API for new unresolved issues whose `firstRelease` matches the active deployment version.
    4. An inline Python task evaluates error counts and event volume against configured tolerances, raising explicit exceptions if Sentry credentials or endpoints fail.
    5. A conditional flow gate evaluates whether error thresholds were breached.
    6. When a bad release is detected, the workflow actively dispatches a rollback event to GitHub Actions via repository dispatch, instructing CI/CD to roll back to the previous stable release.
    7. A high-priority incident notification is dispatched to Slack with error counts, culprit issue titles, and rollback dispatch confirmation.
    8. A log task writes an audit trace of the verification and rollback decision.

    ## What you get

    - Active automated rollback execution without requiring human intervention during critical production outages.
    - Zero silent failures: strictly verifies real API responses and fails loudly on network or credential faults.
    - Automated post-deployment stabilization and safety gating for continuous delivery pipelines.

    ## Who it's for

    - DevOps and Platform Engineers operating automated GitOps and continuous delivery pipelines.
    - Site Reliability Engineers establishing automated mean-time-to-recovery (MTTR) safeguards.
    - Release Managers automating canary release verification and automated rollbacks.

    ## Why orchestrate this with Kestra

    - Connects error observability (Sentry) directly to deployment execution (GitHub Actions / CI/CD) in a single declarative flow.
    - Secure credential management keeping Sentry and GitHub personal access tokens masked in logs.
    - Conditional execution branching and retry policies ensure reliable automated remediation.

    ## Prerequisites

    - A Sentry organization and project with API access.
    - Sentry Internal Integration auth token with `project:read` and `event:read` scopes.
    - A GitHub repository with a workflow configured to receive `rollback_deployment` repository dispatches.
    - A Slack Incoming Webhook URL for alerting.

    ### Secrets

    - `SENTRY_AUTH_TOKEN`: Sentry API token with `project:read` and `event:read` permissions.
    - `SENTRY_ORG_SLUG`: Sentry organization URL slug.
    - `SENTRY_PROJECT_SLUG`: Target Sentry project identifier.
    - `GITHUB_REPOSITORY`: Target GitHub repository in `owner/repo` format for rollback dispatch.
    - `GITHUB_TOKEN`: GitHub personal access token with `repo` scope to trigger repository dispatches.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL for rollback incident alerts.

    ## Quick start

    1. Configure the required Sentry, GitHub, and Slack secrets in your Kestra namespace.
    2. In your target GitHub repository, ensure a workflow listens for `repository_dispatch` with event type `rollback_deployment`.
    3. Execute the flow manually with test release versions to verify API authentication and gate logic.
    4. Enable the schedule trigger or call this flow via webhook as the final step of your deployment pipeline.

    ## How to extend

    - Add direct Kubernetes deployment rollback using the Kestra Kubernetes plugin (`kubectl rollout undo`).
    - Integrate ArgoCD or Flux sync suspension to freeze GitOps sync during rollbacks.
    - Add multi-region traffic shifting to drain traffic from degraded clusters automatically.

    ## Links

    - [Sentry Releases API Documentation](https://docs.sentry.io/api/releases/)
    - [GitHub Repository Dispatch API](https://docs.github.com/en/rest/repos/repos#create-a-repository-dispatch-event)
    - [Kestra HTTP Request Plugin](https://kestra.io/plugins/plugin-fs/tasks/http/io.kestra.plugin.fs.http.request)
    - [Kestra Slack Notifications Plugin](https://kestra.io/plugins/plugin-notifications/tasks/slack/io.kestra.plugin.notifications.slack.slackincomingwebhook)
  tags:
    - Cloud
    - Infrastructure
  subTags:
    - CI/CD & Deployment
    - Incident Response
    - Monitoring & Alerting
  ee: false
  verified: false
  demo: false
