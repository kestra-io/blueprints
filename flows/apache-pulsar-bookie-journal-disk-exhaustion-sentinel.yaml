id: apache-pulsar-bookie-journal-disk-exhaustion-sentinel
namespace: company.team

description: Inspects Apache Pulsar BookKeeper storage ledger daemons for write journal disk utilization to prevent ledger write freezes and bookie crashes.

inputs:
  - id: bookie_metrics_url
    type: STRING
    defaults: "http://bookie.internal:8000/metrics"
    description: URL of the Apache Pulsar BookKeeper Prometheus metrics endpoint.
  - id: min_free_disk_space_mb_threshold
    type: INT
    defaults: 10240
    description: Minimum required free disk space in Megabytes before triggering alerts.

tasks:
  - id: audit_bookie_metrics
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests
    env:
      METRICS_URL: "{{ inputs.bookie_metrics_url }}"
    script: |
      import os
      import sys
      import json
      import requests
      from kestra import Kestra

      url = os.environ.get("METRICS_URL", "http://bookie.internal:8000/metrics")

      try:
          resp = requests.get(url, timeout=15)
          resp.raise_for_status()
          content = resp.text
      except Exception as e:
          print(f"CRITICAL: Failed to scrape BookKeeper metrics at {url}: {e}", file=sys.stderr)
          sys.exit(1)

      is_full = 0
      free_bytes = None

      for line in content.splitlines():
          line = line.strip()
          if line.startswith("#") or not line:
              continue
          if "bookkeeper_server_JOURNAL_DEVICE_FULL" in line:
              parts = line.split()
              if len(parts) >= 2:
                  try:
                      is_full = int(float(parts[1]))
                  except ValueError:
                      pass
          elif "bookkeeper_server_journal_free_disk_space" in line:
              parts = line.split()
              if len(parts) >= 2:
                  try:
                      free_bytes = float(parts[1])
                  except ValueError:
                      pass

      if free_bytes is None:
          print(f"CRITICAL: Prometheus metric 'bookkeeper_server_journal_free_disk_space' not found in scrape response from {url}", file=sys.stderr)
          sys.exit(1)

      free_mb = int(free_bytes / (1024 * 1024))

      status_data = {
          "is_full": is_full,
          "free_mb": free_mb,
          "free_bytes": free_bytes
      }

      with open("bookie_status.json", "w") as f:
          json.dump(status_data, f, indent=2)

      Kestra.outputs({
          "is_full": is_full,
          "free_mb": free_mb
      })
      print(f"BookKeeper journal status: is_full={is_full}, free_mb={free_mb} MB")
    outputFiles:
      - bookie_status.json

  - id: evaluate_and_alert
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.audit_bookie_metrics.vars.is_full == 1 or outputs.audit_bookie_metrics.vars.free_mb < inputs.min_free_disk_space_mb_threshold }}"
    then:
      - id: notify_slack
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#streaming-incidents",
            "text": ":warning: *Apache Pulsar Bookie Journal Disk Depletion*\n*Metrics Endpoint:* {{ inputs.bookie_metrics_url }}\n*Free Journal Space:* {{ outputs.audit_bookie_metrics.vars.free_mb }} MB\n*Threshold Minimum:* {{ inputs.min_free_disk_space_mb_threshold }} MB\n*Device Full Flag:* {{ outputs.audit_bookie_metrics.vars.is_full }}\n*Impact:* Bookies will reject all ingress publish requests."
          }

errors:
  - id: handle_inspection_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "#streaming-incidents",
        "text": ":rotating_light: *Execution Failure: Apache Pulsar BookKeeper Journal Disk Headroom Sentinel*\n*Execution ID:* `{{ execution.id }}`\n*State:* `{{ execution.state.current }}`\n*Error:* Sentinel inspection encountered an unhandled execution error."
      }

triggers:
  - id: scheduled_monitor
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/5 * * * *"
    disabled: true

extend:
  metaDescription: "Audits Apache Pulsar BookKeeper journal storage headroom to prevent broker write locks and ledger freezes."
  metaTitle: Apache Pulsar BookKeeper Journal Disk Exhaustion Sentinel with Kestra
  title: Apache Pulsar BookKeeper Journal Disk Exhaustion Sentinel
  shortDescription: Audits Apache Pulsar BookKeeper journal storage headroom to prevent broker write locks and ledger freezes.
  description: |
    ## How it works
    This workflow monitors Apache Pulsar BookKeeper storage daemons via Prometheus metrics. The write-ahead journal guarantees message persistence. If physical journal volume capacity exhausts, BookKeeper initiates read-only lockdown, rejecting all incoming topic writes. The sentinel alerts operators before disk capacity crosses critical thresholds.

    ## Architecture diagram
    ```mermaid
    flowchart TD
      A[scheduled_monitor Schedule Trigger] --> B[audit_bookie_metrics Python Script]
      B --> C{Journal Full or Free MB < Limit?}
      C -- Yes --> D[notify_slack Slack Webhook]
      C -- No --> E[Journal Headroom Nominal]
    ```

    ## Prerequisites
    - Apache Pulsar BookKeeper Prometheus metrics reachable via HTTP.
    - Secret `SLACK_WEBHOOK_URL` configured in Kestra.

    ## Quick start
    1. Import the blueprint under the `company.team` namespace.
    2. Configure `bookie_metrics_url` and threshold.
    3. Run manually to verify BookKeeper journal space.

    ## Links
    - [Apache BookKeeper Storage Monitoring](https://bookkeeper.apache.org/docs/admin/metrics)
    - [Kestra Python Script Documentation](https://kestra.io/plugins/plugin-scripts-python)
  tags:
    - Data
    - Infrastructure
  subTags:
    - Event-Driven Architecture
    - Day 2 Operations
  ee: false
  demo: false
