id: sec-red-flag-filings-monitor
namespace: company.team

inputs:
  - id: tickers
    type: ARRAY
    itemType: STRING
    displayName: Watchlist
    description: Tickers of the companies to monitor, for example suppliers, customers or holdings. Keep the trigger's `tickers` in sync for automatic runs.
    defaults:
      - INTC
      - PFE
      - NKE
      - TGT
      - CRM

  - id: lookback_days
    type: INT
    displayName: Lookback (days)
    description: Filings filed in this many days are checked on a manual run.
    defaults: 30

  - id: items
    type: MULTISELECT
    displayName: 8-K items to flag
    description: Remove 5.02 if officer and director appointments are too frequent for your watchlist.
    values:
      - "1.03"
      - "3.01"
      - "4.01"
      - "4.02"
      - "5.02"
    defaults:
      - "1.03"
      - "3.01"
      - "4.01"
      - "4.02"
      - "5.02"

tasks:
  - id: companies
    type: io.kestra.plugin.edgar.company.Lookup
    description: Resolves the watchlist to SEC CIKs and company names.
    # SEC requires a User-Agent with your name or company and a contact email. Set it once in the KV store.
    userAgent: "{{ kv('SEC_EDGAR_USER_AGENT', errorOnMissing=false) ?? '' }}"
    tickers: "{{ inputs.tickers }}"
    fetchType: FETCH

  - id: each_company
    type: io.kestra.plugin.core.flow.Loop
    # On a filing-triggered run the trigger already holds the new filings.
    runIf: "{{ not (trigger is defined and trigger.filings is defined) }}"
    values: "{{ inputs.tickers }}"
    # One at a time: SEC allows 10 requests per second across all your tools.
    concurrencyLimit: 1
    outputs:
      - id: filings
        type: JSON
        value: "{{ outputs.filings.rows | toJson }}"
    tasks:
      - id: filings
        type: io.kestra.plugin.edgar.filings.List
        description: The company's 8-Ks and late-filing notices in the lookback window, with their item numbers.
        userAgent: "{{ kv('SEC_EDGAR_USER_AGENT', errorOnMissing=false) ?? '' }}"
        ticker: "{{ item.value }}"
        forms:
          - 8-K
          - 8-K/A
          - NT 10-K
          - NT 10-Q
        startDate: "{{ now() | dateAdd(-inputs.lookback_days, 'DAYS') | date('yyyy-MM-dd') }}"
        maxResults: 1000

  - id: red_flags
    type: io.kestra.plugin.jdbc.duckdb.Query
    description: One row per red flag, from the form type and SEC's 8-K item numbers only (no document is read).
    inputFiles:
      filings.json: >-
        {{ trigger is defined and trigger.filings is defined
           ? trigger.filings | toJson
           : outputs.each_company.outputs | jq('[.[].outputs.filings[]]') | first | toJson }}
    fetchType: FETCH
    sql: |
      WITH companies(ticker, cik, name) AS (
          VALUES {% for c in outputs.companies.rows %}('{{ c.ticker }}', '{{ c.cik }}', '{{ c.name | replace({"'": "''"}) }}'){{ loop.last ? '' : ', ' }}{% endfor %}
      ),
      filings AS (
          SELECT DISTINCT f.cik, f.accessionNumber AS accession_number, f.form, CAST(f.filingDate AS DATE) AS filing_date,
                 TRY_CAST(f.reportDate AS DATE) AS report_date, f.primaryDocumentUrl AS url,
                 coalesce(f.items, []) AS items
          FROM read_json('{{ workingDir }}/filings.json', format = 'array',
                         columns = {cik: 'VARCHAR', accessionNumber: 'VARCHAR', form: 'VARCHAR', filingDate: 'VARCHAR',
                                    reportDate: 'VARCHAR', primaryDocumentUrl: 'VARCHAR', items: 'VARCHAR[]'}) f
      ),
      rules(code, kind, severity, meaning) AS (
          VALUES ('1.03', 'item', 1, 'bankruptcy or receivership'),
                 ('4.02', 'item', 2, 'previously issued financial statements should no longer be relied upon (restatement)'),
                 ('3.01', 'item', 3, 'notice of delisting or failure to meet a listing standard'),
                 ('4.01', 'item', 4, 'change of the company''s auditor'),
                 ('NT 10-K', 'form', 5, 'annual report (10-K) will be late'),
                 ('NT 10-Q', 'form', 5, 'quarterly report (10-Q) will be late'),
                 ('5.02', 'item', 6, 'departure, election or appointment of a director or officer')
      ),
      flags AS (
          SELECT f.*, r.code, r.severity, r.meaning
          FROM filings f
          JOIN rules r ON (r.kind = 'form' AND f.form = r.code)
                       OR (r.kind = 'item' AND f.form IN ('8-K', '8-K/A') AND list_contains(f.items, r.code)
                           AND r.code IN ({% for i in inputs.items %}'{{ i }}'{{ loop.last ? '' : ', ' }}{% endfor %}))
      )
      -- A triggered run can't read the watchlist input: a company missing from it is named by its CIK, never dropped.
      SELECT coalesce(c.ticker, 'CIK ' || ltrim(fl.cik, '0')) AS ticker, coalesce(c.name, 'not in the watchlist input') AS name,
             fl.form, fl.filing_date, fl.accession_number, fl.url,
             string_agg(fl.code, ', ' ORDER BY fl.severity) AS codes, min(fl.severity) AS severity,
             format('{} ({}): {} filed on {}: {}{}. {}', coalesce(c.ticker, 'CIK ' || ltrim(fl.cik, '0')),
                    coalesce(c.name, 'not in the watchlist input'), fl.form, fl.filing_date,
                    string_agg(CASE WHEN fl.code LIKE 'NT%' THEN fl.meaning ELSE 'item ' || fl.code || ', ' || fl.meaning END, '; ' ORDER BY fl.severity),
                    CASE WHEN fl.form = '8-K/A' THEN ' (amendment)' ELSE '' END, fl.url) AS message
      FROM flags fl
      LEFT JOIN companies c ON ltrim(c.cik, '0') = ltrim(fl.cik, '0')
      GROUP BY c.ticker, c.name, fl.cik, fl.form, fl.filing_date, fl.accession_number, fl.url
      ORDER BY severity, filing_date DESC, ticker

  - id: report
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.red_flags.size > 0 }}"
    then:
      - id: log_flags
        type: io.kestra.plugin.core.log.Log
        level: WARN
        message: |
          {{ outputs.red_flags.size }} red-flag filing(s):
          {% for f in outputs.red_flags.rows %}- {{ f.message }}
          {% endfor %}
      - id: slack
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Optional. Without the SLACK_WEBHOOK_URL secret this step fails as a warning; the red flags above are already logged.
        allowFailure: true
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        # A full JSON payload: `messageText` starting with a number is cut to that number (kestra-io/plugin-slack#103).
        payload: >-
          {{ outputs.red_flags.rows | jq('{text: ((length | tostring) + " red-flag filing(s):\n" + (map("• " + .message) | join("\n")))}') | first | toJson }}
    else:
      - id: all_clear
        type: io.kestra.plugin.core.log.Log
        message: No red-flag filing from the watchlist.

outputs:
  - id: red_flag_count
    type: INT
    value: "{{ outputs.red_flags.size ?? 0 }}"

triggers:
  - id: new_filing
    type: io.kestra.plugin.edgar.filings.Trigger
    description: Runs when a watched company files an 8-K or a late-filing notice. Enable after setting SEC_EDGAR_USER_AGENT.
    userAgent: "{{ kv('SEC_EDGAR_USER_AGENT', errorOnMissing=false) ?? '' }}"
    tickers:
      - INTC
      - PFE
      - NKE
      - TGT
      - CRM
    forms:
      - 8-K
      - 8-K/A
      - NT 10-K
      - NT 10-Q
    interval: PT30M
    disabled: true

extend:
  title: Monitor SEC Red-Flag Filings such as Restatements and Late Reports with Slack Alerts
  shortDescription: When a company you follow files an 8-K about a restatement, auditor change, delisting notice, bankruptcy or officer change, or warns that a 10-K or 10-Q will be late, alert in the logs and on Slack.
  metaTitle: SEC Red-Flag Filings Monitor with Kestra, DuckDB and Slack
  metaDescription: Alert on SEC filings that signal trouble, such as restatements, auditor changes, delisting notices, bankruptcies and late 10-K or 10-Q notices.
  description: |
    Watch suppliers, customers or holdings for the SEC filings that signal trouble. Rule-based, with no
    LLM and no document parsing: only the form type and the 8-K item numbers SEC lists for each filing.
    No API key or paid data feed.

    Unlike `sec-8k-filing-watcher`, which reads every 8-K and summarizes it with a local LLM, this flow
    never opens a filing: it flags a fixed set of red flags, so results are deterministic and cover
    late-filing notices, which aren't 8-Ks.

    ## How it works

    1. `new_filing` (EDGAR trigger) runs the flow when a watched company files an 8-K, 8-K/A, NT 10-K or
       NT 10-Q. A manual run lists those filings for `lookback_days` with `filings.List` instead.
    2. `red_flags` (DuckDB) keeps a filing when it is an NT 10-K or NT 10-Q (the report will be late), or
       an 8-K or 8-K/A with one of these items, most severe first:
       - 1.03 bankruptcy or receivership
       - 4.02 non-reliance on previously issued financial statements (a restatement)
       - 3.01 delisting notice or failure to meet a listing standard
       - 4.01 change of auditor
       - 5.02 departure, election or appointment of a director or officer
    3. `report` logs each flagged filing at WARN with its link and posts the list to Slack.

    ## What you get

    - One line per filing: company, form, date, every red-flag item it reports, and the filing's URL.
    - The `items` input drops 5.02, which also covers routine appointments, if it is too noisy.

    ## Who it's for

    Credit and counterparty-risk analysts, procurement and treasury teams, and portfolio managers.

    ## Why orchestrate this with Kestra

    The EDGAR trigger replaces a polling script and keeps its own watermark; the rules are one SQL query
    versioned with the flow, and every run keeps its logs.

    ## Prerequisites

    Kestra 2.0 with plugin-edgar 1.0.0 (auto-installed on save in a local OSS instance, otherwise
    `kestra plugins install io.kestra.plugin:plugin-edgar:1.0.0`).

    ### Secrets

    - `SLACK_WEBHOOK_URL` (optional): without it the Slack step ends in a warning; flags stay logged.

    ## Quick start

    1. **Namespaces** > `company.team` > **KV Store**: key `SEC_EDGAR_USER_AGENT`, type `STRING`, value
       your name and email (`Example Co admin@example.com`). SEC rejects requests without one.
    2. Execute with your watchlist and `lookback_days` set to 90, then check the logs.
    3. Copy the watchlist into the trigger's `tickers` and the input's defaults, then enable the trigger.

    ## How to extend

    - Add an item, such as 2.06 (impairment), to the `items` input and the `rules` list in `red_flags`.
    - Known limits: the flow can't tell a 5.02 departure from an appointment, or which party concluded
      a 4.02, without reading the filing.

    ## Links

    - [SEC Form 8-K items](https://www.sec.gov/files/form8-k.pdf),
      [EDGAR List](https://kestra.io/plugins/plugin-edgar/filings/io.kestra.plugin.edgar.filings.list),
      [EDGAR Trigger](https://kestra.io/plugins/plugin-edgar/filings/io.kestra.plugin.edgar.filings.trigger),
      [DuckDB Query](https://kestra.io/plugins/plugin-jdbc-duckdb/io.kestra.plugin.jdbc.duckdb.query)
  tags:
    - Data
    - Business
  subTags:
    - Monitoring & Alerting
  ee: false
  demo: false
