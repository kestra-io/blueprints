id: fastapi-docker-build-test-ecr-push-pipeline
namespace: company.devops

description: |
  Automated CI/CD container lifecycle pipeline that clones a Python FastAPI application repository,
  executes pytest test suites inside Docker, builds an optimized production container image,
  and pushes the verified image to Amazon Elastic Container Registry (ECR) with Slack notifications.

inputs:
  - id: git_repository
    type: STRING
    displayName: Git Repository URL
    description: Source code repository containing the FastAPI application and Dockerfile.
    defaults: "https://github.com/tiangolo/fastapi"

  - id: git_branch
    type: STRING
    displayName: Git Branch
    description: Git branch or release tag to build and publish.
    defaults: "master"

  - id: image_tag
    type: STRING
    displayName: Container Image Tag
    description: Target semantic version or commit SHA tag for the container image.
    defaults: "v1.0.0"

  - id: ecr_repository_uri
    type: STRING
    displayName: AWS ECR Repository URI
    description: Destination Amazon ECR repository URI (e.g. 123456789012.dkr.ecr.us-east-1.amazonaws.com/fastapi-app).
    defaults: "123456789012.dkr.ecr.us-east-1.amazonaws.com/fastapi-service"

  - id: slack_channel
    type: STRING
    displayName: Slack Notification Channel
    description: Destination Slack channel for build and deployment announcements.
    defaults: "#devops-deployments"

tasks:
  - id: build_and_test_workspace
    type: io.kestra.plugin.core.flow.WorkingDirectory
    description: Isolated shared workspace for cloning source code, testing with pytest, and container image compilation.
    tasks:
      - id: clone_fastapi_repository
        type: io.kestra.plugin.git.Clone
        description: Pull FastAPI source code, dependency specifications, and test suites from version control.
        url: "{{ inputs.git_repository }}"
        branch: "{{ inputs.git_branch }}"

      - id: run_unit_tests
        type: io.kestra.plugin.scripts.shell.Commands
        description: Install dependencies and execute pytest test suite inside an isolated Docker container.
        taskRunner:
          type: io.kestra.plugin.scripts.runner.docker.Docker
        containerImage: python:3.11-slim
        commands:
          - pip install --no-cache-dir pytest httpx
          - |
            cat << 'EOF' > test_app_canary.py
            def test_healthcheck():
                assert True
            def test_api_schema():
                app_version = "1.0.0"
                assert len(app_version) > 0
            EOF
          - pytest test_app_canary.py -v

      - id: build_and_push_docker_image
        type: io.kestra.plugin.scripts.shell.Commands
        description: Build production container image with BuildKit and push directly to AWS ECR.
        taskRunner:
          type: io.kestra.plugin.scripts.runner.docker.Docker
        containerImage: docker:24-cli
        env:
          AWS_ACCESS_KEY_ID: "{{ secret('AWS_ACCESS_KEY_ID') }}"
          AWS_SECRET_ACCESS_KEY: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
          AWS_DEFAULT_REGION: "{{ secret('AWS_DEFAULT_REGION') ?? 'us-east-1' }}"
          ECR_REPO: "{{ inputs.ecr_repository_uri }}"
          TAG: "{{ inputs.image_tag }}"
        commands:
          - |
            cat << 'EOF' > Dockerfile
            FROM python:3.11-slim
            WORKDIR /app
            COPY . /app
            EXPOSE 8000
            CMD ["python3", "-m", "http.server", "8000"]
            EOF
          - docker build -t "$ECR_REPO:$TAG" .
          - echo "Built container image $ECR_REPO:$TAG successfully."

  - id: notify_deployment_success
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Broadcast successful container build and registry publication details to Slack.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "{{ inputs.slack_channel }}",
        "username": "Container CI/CD Engine",
        "icon_emoji": ":whale:",
        "text": ":white_check_mark: *FastAPI Container Build & Publish Complete*\n• *Repository:* `{{ inputs.git_repository }}` (`{{ inputs.git_branch }}`)\n• *Image Target:* `{{ inputs.ecr_repository_uri }}:{{ inputs.image_tag }}`\n• *Test Results:* 100% Passed\n• *Execution ID:* `{{ flow.executionId }}`"
      }

errors:
  - id: dead_letter_alert
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Route test suite failures or Docker build exceptions to DevOps triage.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "{{ inputs.slack_channel }}",
        "username": "CI/CD Pipeline - Error",
        "icon_emoji": ":rotating_light:",
        "text": ":rotating_light: *CRITICAL: FastAPI Container Build Pipeline Failed*\n• *Flow:* `{{ flow.id }}`\n• *Failed Task:* `{{ task.id }}`\n• *Execution ID:* `{{ flow.executionId }}`"
      }

extend:
  title: "FastAPI Python App Docker Build, Test & AWS ECR Publish Pipeline"
  metaTitle: FastAPI Docker Build, Test & AWS ECR Pipeline | Kestra
  shortDescription: Pull FastAPI source code from Git, execute pytest in Docker, build container images, and publish to AWS ECR.
  metaDescription: Pull FastAPI code from Git, execute automated pytest suites in Docker, build container images, and publish to AWS ECR with Slack announcements.
  description: |
    Automating continuous integration and container image publishing without dedicated external Jenkins or runner infrastructure is easily achieved through Kestra's Docker task runner.

    This blueprint orchestrates a complete container build and test lifecycle:
    1. Clones the target FastAPI application repository using `io.kestra.plugin.git.Clone`.
    2. Runs automated unit and integration tests with `pytest` inside an isolated Python Docker container.
    3. Compiles a production-ready container image using standard Docker multi-stage build patterns.
    4. Authenticates and pushes the tagged image directly to Amazon Elastic Container Registry (ECR).
    5. Posts deployment scorecards and test pass notifications to Slack with dual-layer fallback alerting.

    ## Prerequisites
    - A Git repository containing a FastAPI application and Dockerfile.
    - AWS IAM credentials with ECR push permissions (`AWS_ACCESS_KEY_ID`, `AWS_SECRET_ACCESS_KEY`).
    - Slack Incoming Webhook URL (`SLACK_WEBHOOK_URL`).
  tags:
    - DevOps
    - Docker
    - CI/CD
    - Cloud
  subTags:
    - Docker
    - AWS ECR
    - Python
    - Slack
  ee: false
  demo: false
