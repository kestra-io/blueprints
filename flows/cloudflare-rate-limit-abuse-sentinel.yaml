id: cloudflare-rate-limit-abuse-sentinel
namespace: company.netops

inputs:
  - id: cloudflare_zone_id
    type: STRING
    defaults: 023e105f4ecef8ad9ca31a8372d0c353
    description: The 32-character Cloudflare Zone Tag ID to inspect.
  - id: max_tolerated_blocks_per_hour
    type: INT
    defaults: 200
    description: Maximum acceptable edge block events in a 1-hour window before alerting.

tasks:
  - id: query_edge_firewall_blocks
    type: io.kestra.plugin.scripts.shell.Commands
    runner: PROCESS
    commands:
      - |
        ONE_HOUR_AGO=$(python3 -c "import datetime; print((datetime.datetime.utcnow() - datetime.timedelta(hours=1)).strftime('%Y-%m-%dT%H:%M:%SZ'))")
        GRAPHQL_PAYLOAD=$(python3 -c "
        import json
        query = {
            'query': '''
            query GetFirewallEvents($zoneTag: String!, $since: String!) {
              viewer {
                zones(filter: {zoneTag: $zoneTag}) {
                  firewallEventsAdaptive(filter: {datetime_geq: $since, action: "block"}, limit: 500) {
                    action
                    clientIP
                    clientRequestHTTPHost
                    clientRequestPath
                  }
                }
              }
            }
            ''',
            'variables': {
                'zoneTag': '{{ inputs.cloudflare_zone_id }}',
                'since': '$ONE_HOUR_AGO'
            }
        }
        print(json.dumps(query))
        ")
        curl -s -X POST "https://api.cloudflare.com/client/v4/graphql"           -H "Authorization: Bearer {{ secret('CLOUDFLARE_API_TOKEN') }}"           -H "Content-Type: application/json"           --data-raw "$GRAPHQL_PAYLOAD" > cf_events.json
        python3 -c "
        import json
        with open('cf_events.json') as f:
            data = json.load(f)
        zones = data.get('data', {}).get('viewer', {}).get('zones', [])
        events = zones[0].get('firewallEventsAdaptive', []) if zones else []
        block_count = len(events)
        result = {
            'zone_id': '{{ inputs.cloudflare_zone_id }}',
            'block_count': block_count,
            'alert_triggered': block_count >= {{ inputs.max_tolerated_blocks_per_hour }}
        }
        with open('cf_summary.json', 'w') as out:
            json.dump(result, out)
        print('Cloudflare edge audit:', result)
        "
    outputFiles:
      - cf_summary.json

  - id: evaluate_abuse_threshold
    type: io.kestra.plugin.core.flow.If
    condition: "{{ json(read(outputs.query_edge_firewall_blocks.outputFiles['cf_summary.json'])).alert_triggered }}"
    then:
      - id: alert_soc_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "text": ":shield: *Cloudflare Abuse Alert*: Edge rate limiting blocked {{ json(read(outputs.query_edge_firewall_blocks.outputFiles['cf_summary.json'])).block_count }} malicious requests on zone `{{ inputs.cloudflare_zone_id }}` in the past hour."
          }

errors:
  - id: notify_sentinel_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "text": ":warning: *Cloudflare Sentinel Execution Failure*: Failed to query GraphQL analytics for zone `{{ inputs.cloudflare_zone_id }}`."
      }

triggers:
  - id: hourly_abuse_check
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 * * * *"
    disabled: true

extend:
  title: Cloudflare Edge Rate Limiting and Abuse Threshold Sentinel
  shortDescription: Audits Cloudflare GraphQL edge analytics to detect volumetric traffic surges and abnormal rate-limit enforcement.
  description: |
    ## How it works
    This workflow queries Cloudflare GraphQL Analytics API to inspect the `firewallEventsAdaptive` dataset over rolling one-hour windows. It aggregates edge firewall blocks, evaluates anomalous spikes against configured security thresholds, and notifies SecOps teams when potential DDoS or scraping attacks occur.

    ## What you get
    - Real-time visibility into edge mitigation events across Cloudflare-protected web properties.
    - Early alerting for volumetric abuse, credential stuffing, and bot attacks before origin degradation.
    - Automated Slack incident delivery including exact block counts and zone identifiers.

    ## Who it's for
    - Security engineers, SOC analysts, and network administrators managing Cloudflare WAF/CDN.
    - DevOps teams maintaining public-facing APIs and high-traffic web applications.

    ## Why orchestrate this with Kestra
    Kestra provides reliable scheduled event aggregation and notification capabilities without requiring standalone SIEM ingestion pipelines for edge monitoring.

    ## Prerequisites
    - Cloudflare API Token with `Zone.Analytics:Read` permissions.
    - Secrets `CLOUDFLARE_API_TOKEN` and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import this blueprint into Kestra.
    2. Input your `cloudflare_zone_id` and threshold.
    3. Trigger a manual test, then enable the hourly schedule.

    ## How to extend
    - Automatically adjust Cloudflare security level to 'Under Attack' mode when high thresholds are breached.
    - Export raw attacker IP lists to AWS WAF or internal firewall blacklists.
    - Correlate edge blocks with origin server response codes.

    ## Links
    - [Cloudflare GraphQL Analytics API](https://developers.cloudflare.com/analytics/graphql-api/)
    - [Kestra Slack Notifications](https://kestra.io/plugins/plugin-slack)
  tags:
    - Cloud
    - Infrastructure
  subTags:
    - Monitoring & Alerting
  ee: false
  demo: false
