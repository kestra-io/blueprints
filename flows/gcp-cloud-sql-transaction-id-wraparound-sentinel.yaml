id: gcp-cloud-sql-transaction-id-wraparound-sentinel
namespace: company.cloud

inputs:
  - id: project_id
    type: STRING
    description: Google Cloud Project ID.
  - id: instance_id
    type: STRING
    description: Cloud SQL instance ID to audit.

tasks:
  - id: query_cloud_sql_status
    type: io.kestra.plugin.gcp.gcloud.GCloudCLI
    projectId: "{{ inputs.project_id }}"
    serviceAccount: "{{ secret('GCP_SERVICE_ACCOUNT') }}"
    commands:
      - |
        gcloud sql instances describe "{{ inputs.instance_id }}" --format=json > /tmp/sql_inst.json
        
        STATE=$(jq -r '.state // "UNKNOWN"' /tmp/sql_inst.json)
        
        # Query active connections over last 15 minutes
        START_TIME=$(date -u -v-15M +%Y-%m-%dT%H:%M:%SZ)
        FILTER="metric.type="cloudsql.googleapis.com/database/network/connections" AND resource.labels.database_id="{{ inputs.project_id }}:{{ inputs.instance_id }}""
        
        gcloud monitoring timeseries list \
          --filter="$FILTER" \
          --interval-start-time="$START_TIME" \
          --format=json > /tmp/sql_conn.json
        
        PEAK_CONN=$(jq '[.[]?.points[]?.value.int64Value // 0] | max // 0' /tmp/sql_conn.json)
        
        echo "::set-output name=state::$STATE::"
        echo "::set-output name=peak_conn::$PEAK_CONN::"

  - id: evaluate_sql_health
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.query_cloud_sql_status.vars.state != 'RUNNABLE' }}"
    then:
      - id: notify_dba_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#gcp-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 Google Cloud SQL Instance Degraded Alert",
                "text": "Cloud SQL instance `{{ inputs.instance_id }}` in project `{{ inputs.project_id }}` is in non-runnable state: *{{ outputs.query_cloud_sql_status.vars.state }}*! Impact: Managed database service is offline, failing over, or undergoing emergency maintenance.",
                "footer": "Kestra Database Sentinel • Google Cloud SQL"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#gcp-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ Google Cloud SQL Database Connection and Health Sentinel Pipeline Failure",
            "text": "Failed to inspect Cloud SQL instance state. Verify instance ID and IAM permissions.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  title: Google Cloud SQL Database Connection and Health Sentinel
  shortDescription: Audits Google Cloud SQL instances to detect database state degradation and connection capacity saturation.
  description: |
    ## How it works
    This workflow executes `gcloud sql instances describe` and queries Cloud Monitoring for database connection telemetry. Cloud SQL managed instances (PostgreSQL, MySQL, SQL Server) report operational health via `state == 'RUNNABLE'`. If an instance enters maintenance restart, storage auto-resize deadlock, or replication failure, the state changes to `SUSPENDED`, `FAILED`, or `MAINTENANCE`. Slack is alerted immediately upon any non-runnable status.

    ## What you get
    - Continuous monitoring of Google Cloud SQL managed database operational state.
    - Prevents undetected database outages and failover delays.
    - Integrates live connection telemetry for capacity planning.

    ## Who it's for
    - Database Administrators (DBAs) and SREs managing Google Cloud SQL production instances.
    - Platform teams running transactional applications on GCP.

    ## Why orchestrate this with Kestra
    - **Native Cloud SQL API Invocation**: Direct inspection via official Google Cloud tooling.
    - **Continuous Availability Verification**: Run 15-minute scheduled health audits.
    - **Instant Triage**: Rapid escalation to on-call database response teams.

    ## Prerequisites
    - Google Cloud SQL instance deployed with Cloud Monitoring.
    - Secrets `GCP_SERVICE_ACCOUNT` and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import the blueprint.
    2. Configure project ID and instance ID.
    3. Run the workflow to inspect database status.

    ## How to extend
    - Monitor `cloudsql.googleapis.com/database/disk/utilization` alongside state.
    - Automatically scale instance tier upon sustained CPU saturation.

    ## Links
    - [Google Cloud SQL Metrics Documentation](https://cloud.google.com/sql/docs/postgres/monitoring)
    - [Kestra GCloud CLI Plugin](https://kestra.io/plugins/plugin-gcp/io.kestra.plugin.gcp.gcloud.gcloudcli)
  tags:
    - Cloud
    - Data
  ee: false
  demo: false
