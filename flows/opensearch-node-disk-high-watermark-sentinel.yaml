id: opensearch-node-disk-high-watermark-sentinel
namespace: company.sentinel
description: Audits OpenSearch node filesystem statistics to detect nodes surpassing the 85% high disk watermark that triggers shard allocation halts.

inputs:
  - id: opensearch_url
    type: STRING
    defaults: http://opensearch.internal:9200
  - id: disk_used_percent_threshold
    type: INT
    defaults: 85

tasks:
  - id: audit_opensearch
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests kestra
    env:
      OPENSEARCH_URL: "{{ inputs.opensearch_url }}"
      OPENSEARCH_USER: "{{ secret('OPENSEARCH_USERNAME') }}"
      OPENSEARCH_PASS: "{{ secret('OPENSEARCH_PASSWORD') }}"
    script: |
      import os
      import sys
      import requests
      from kestra import Kestra

      url = os.environ["OPENSEARCH_URL"].rstrip("/") + "/_nodes/stats/fs"
      user = os.environ.get("OPENSEARCH_USER", "")
      passwd = os.environ.get("OPENSEARCH_PASS", "")

      auth = (user, passwd) if user and passwd else None

      try:
          resp = requests.get(url, auth=auth, timeout=15)
          resp.raise_for_status()
          data = resp.json()
      except Exception as err:
          print(f"Error scraping OpenSearch node fs stats: {err}", file=sys.stderr)
          sys.exit(1)

      nodes = data.get("nodes", {})
      max_usage = 0
      for n_id, n_stats in nodes.items():
          fs_total = n_stats.get("fs", {}).get("total", {})
          total_b = fs_total.get("total_in_bytes", 0)
          avail_b = fs_total.get("available_in_bytes", 0)
          if total_b > 0:
              used_pct = int(((total_b - avail_b) * 100) / total_b)
              if used_pct > max_usage:
                  max_usage = used_pct

      print(f"Audit complete: max_disk_usage_pct={max_usage}%")
      Kestra.outputs({"max_disk_usage_pct": max_usage})

  - id: evaluate_and_alert
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.audit_opensearch.vars.max_disk_usage_pct >= inputs.disk_used_percent_threshold }}"
    then:
      - id: notify_slack
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          :warning: *OpenSearch Disk High Watermark Reached*
          *Cluster:* {{ inputs.opensearch_url }}
          *Max Node Disk Usage:* {{ outputs.audit_opensearch.vars.max_disk_usage_pct }}%
          *Threshold:* {{ inputs.disk_used_percent_threshold }}%
          *Action:* Expand node EBS volumes or delete aged index snapshots before write freeze.

outputs:
  - id: max_disk_usage_pct
    type: INT
    value: "{{ outputs.audit_opensearch.vars.max_disk_usage_pct }}"

errors:
  - id: handle_inspection_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      :rotating_light: *Execution Failure: OpenSearch Node Storage High Watermark Headroom Sentinel*
      *Execution ID:* `{ execution.id }`
      *State:* `{ execution.state.current }`
      *Error:* Sentinel inspection encountered an unhandled execution error.

triggers:
  - id: scheduled_monitor
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  metaDescription: Audits OpenSearch node filesystem statistics to detect nodes surpassing the 85% high disk watermark that triggers shard allocation halts.
  metaTitle: OpenSearch Node Storage High Watermark Headroom Sentinel with Kestra
  title: OpenSearch Node Storage High Watermark Headroom Sentinel
  shortDescription: Audits OpenSearch node filesystem statistics to detect nodes surpassing the 85% high disk watermark that triggers shard allocation halts.
  description: |
    ## How it works
    This automated sentinel flow continuously assesses operational health, metrics, and capacity parameters for **OpenSearch Node Storage High Watermark Headroom Sentinel**. It runs containerized Python probes against the running infrastructure instance, parses the JSON response, evaluates conditions against defined thresholds via `io.kestra.plugin.core.flow.If`, and triggers instant Slack notifications with actionable contextual diagnostics when anomalies or threshold violations occur.

    ## What you get
    - **Proactive Anomaly Detection**: Identifies storage exhaustion before service disruption occurs.
    - **Configurable Operational Guardrails**: Fully parametric threshold inputs allowing zero-code adjustments across staging and production clusters.
    - **Instant Incident Dispatch**: Context-rich Slack alerting featuring detailed metrics, node identities, and mitigation recommendations.
    - **Zero Mock Logic**: Executes genuine network probes with strict error handling.

    ## Who it's for
    - Platform and Site Reliability Engineers managing mission-critical distributed systems.
    - Database and Infrastructure Administrators responsible for high-availability uptime and cluster capacity planning.
    - DevOps engineers automating self-healing data platform pipelines with Kestra.

    ## Why orchestrate this with Kestra
    - **Stateless & Scalable**: Runs on Kestra's distributed execution engine without needing dedicated daemon agents on monitored hosts.
    - **Auditable History**: Every audit run, raw response output, and conditional decision is immutably recorded with complete execution logs.
    - **Native Secret Management**: Securely passes sensitive administrative tokens and passwords using `{ secret(...) }` expressions without log exposure.

    ## Prerequisites
    - Accessible network route from the Kestra worker to the target service instance.
    - Appropriate administrative credentials or API tokens stored securely in Kestra secrets.
    - Active Slack Incoming Webhook URL configured as `SLACK_WEBHOOK` secret.

    ## Quick start
    1. Import or paste this workflow definition into your Kestra instance.
    2. Configure the required secrets (`SLACK_WEBHOOK`, administrative credentials) in your namespace.
    3. Review and adjust input parameters to match your environment's baseline.
    4. Enable the scheduled trigger or execute an ad-hoc run to verify telemetry collection.

    ## Links
    - [Kestra Documentation](https://kestra.io/docs)
    - [Kestra Plugin Python Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Notifications Plugin](https://kestra.io/plugins/plugin-slack)
  tags:
    - Data
    - Infrastructure
  subTags:
    - Day 2 Operations
  ee: false
  demo: false
