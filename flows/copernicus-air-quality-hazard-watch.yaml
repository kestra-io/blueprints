id: copernicus-air-quality-hazard-watch
namespace: company.team

description: |
  Ingests multi-city atmospheric telemetry from the Open-Meteo European Air Quality and Copernicus
  Atmosphere Monitoring Service (CAMS) every two hours, classifies European AQI severity and particulate
  hazards (PM2.5, PM10, NO2) in DuckDB, persists columnar Parquet snapshots to Kestra internal storage,
  and triggers Slack alerts when air quality degrades to poor or hazardous levels.

inputs:
  - id: alert_aqi_threshold
    type: INT
    displayName: European AQI alert threshold
    description: Minimum European Air Quality Index value (from 0 to 100+) required to trigger an environmental alert. Index >= 40 indicates poor air quality.
    defaults: 40

  - id: state_key
    type: STRING
    displayName: KV state key
    description: Key in Kestra KV store used to record previous peak AQI levels and timestamps to prevent duplicate alerts.
    defaults: air_quality_watch_state

triggers:
  - id: every_two_hours
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 */2 * * *"
    recoverMissedSchedules: LAST
    description: Ingests updated atmospheric model readings every two hours across monitored metropolitan coordinates.

concurrency:
  limit: 1
  behavior: QUEUE

tasks:
  - id: fetch_air_quality
    type: io.kestra.plugin.core.http.Download
    description: Downloads the latest atmospheric quality JSON feed across five metropolitan coordinates from the Open-Meteo European Air Quality API.
    uri: "https://air-quality-api.open-meteo.com/v1/air-quality?latitude=52.52,48.85,51.50,40.71,34.05&longitude=13.41,2.35,-0.12,-74.00,-118.24&current=european_aqi,pm10,pm2_5,carbon_monoxide,nitrogen_dioxide,sulphur_dioxide,ozone"

  - id: analyze_air_quality
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: |
      Processes raw atmospheric telemetry in DuckDB, maps European AQI ratings into actionable health categories,
      and generates columnar Parquet datasets and alert CSVs in Kestra internal storage.
    url: "jdbc:duckdb:"
    fetchType: FETCH_ONE
    inputFiles:
      telemetry.json: "{{ outputs.fetch_air_quality.uri }}"
    outputFiles:
      - air_quality_snapshot.parquet
      - hazardous_air_alerts.csv
    sql: |
      CREATE TABLE raw_feed AS
      SELECT * FROM read_json_auto('telemetry.json');

      CREATE TABLE locations_analyzed AS
      SELECT 
          latitude,
          longitude,
          elevation,
          timezone,
          current->>'time' AS observation_time,
          TRY_CAST(current->>'european_aqi' AS INTEGER) AS european_aqi,
          TRY_CAST(current->>'pm2_5' AS DOUBLE) AS pm2_5,
          TRY_CAST(current->>'pm10' AS DOUBLE) AS pm10,
          TRY_CAST(current->>'nitrogen_dioxide' AS DOUBLE) AS no2,
          TRY_CAST(current->>'ozone' AS DOUBLE) AS o3,
          CASE 
              WHEN TRY_CAST(current->>'european_aqi' AS INTEGER) >= 80 THEN 'HAZARDOUS'
              WHEN TRY_CAST(current->>'european_aqi' AS INTEGER) >= 60 THEN 'VERY_POOR'
              WHEN TRY_CAST(current->>'european_aqi' AS INTEGER) >= 40 THEN 'POOR'
              WHEN TRY_CAST(current->>'european_aqi' AS INTEGER) >= 20 THEN 'MODERATE'
              ELSE 'GOOD'
          END AS aqi_category,
          CURRENT_TIMESTAMP AS processed_at
      FROM raw_feed;

      COPY locations_analyzed TO 'air_quality_snapshot.parquet' (FORMAT PARQUET);

      CREATE TABLE alert_locations AS
      SELECT 
          latitude,
          longitude,
          observation_time,
          european_aqi,
          aqi_category,
          pm2_5,
          pm10,
          no2
      FROM locations_analyzed
      WHERE european_aqi >= {{ inputs.alert_aqi_threshold }}
      ORDER BY european_aqi DESC;

      COPY alert_locations TO 'hazardous_air_alerts.csv' (HEADER, DELIMITER ',');

      SELECT 
          (SELECT COUNT(*) FROM locations_analyzed)::INTEGER AS total_locations,
          (SELECT COUNT(*) FROM alert_locations)::INTEGER AS alert_count,
          (SELECT MAX(european_aqi) FROM locations_analyzed) AS peak_aqi,
          (SELECT aqi_category FROM locations_analyzed ORDER BY european_aqi DESC LIMIT 1) AS peak_category,
          (SELECT observation_time FROM locations_analyzed LIMIT 1) AS observation_time;

  - id: check_air_hazard
    type: io.kestra.plugin.core.flow.If
    description: Checks whether any monitored locations breached the air quality threshold.
    condition: "{{ outputs.analyze_air_quality.row.alert_count > 0 }}"
    then:
      - id: notify_slack_aqi
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        allowFailure: true
        description: Emits an air quality hazard notification to the designated Slack channel.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "🏭 *Air Quality Alert: High Atmospheric Pollution Detected*",
            "blocks": [
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*Copernicus Atmospheric Quality Warning*\n• *Peak European AQI*: `{{ outputs.analyze_air_quality.row.peak_aqi }}`\n• *Category*: `{{ outputs.analyze_air_quality.row.peak_category }}`\n• *Observation Time*: `{{ outputs.analyze_air_quality.row.observation_time }}`\n• *Locations Breaching Threshold*: `{{ outputs.analyze_air_quality.row.alert_count }}` of `{{ outputs.analyze_air_quality.row.total_locations }}`\n• *Snapshot Storage*: `{{ outputs.analyze_air_quality.outputFiles['air_quality_snapshot.parquet'] }}`"
                }
              }
            ]
          }

  - id: persist_aqi_state
    type: io.kestra.plugin.core.kv.Set
    description: Records the latest peak AQI metrics in the Kestra KV store.
    key: "{{ inputs.state_key }}"
    value:
      peak_aqi: "{{ outputs.analyze_air_quality.row.peak_aqi }}"
      peak_category: "{{ outputs.analyze_air_quality.row.peak_category }}"
      observation_time: "{{ outputs.analyze_air_quality.row.observation_time }}"
      updated_at: "{{ now() }}"

extend:
  title: Copernicus Global Atmospheric & Air Quality Hazard Watch
  metaTitle: Copernicus Atmospheric & Air Quality Hazard Watch | Kestra
  shortDescription: Ingest Copernicus atmospheric quality telemetry, classify AQI and PM2.5 in DuckDB, and alert on pollution risk.
  metaDescription: Ingest Copernicus air quality telemetry, classify European AQI and PM2.5 levels in DuckDB, store Parquet, and alert in Slack.
  description: |
    ## What does this flow do?

    This blueprint monitors multi-pollutant atmospheric air quality telemetry across global metropolitan centers using the Open-Meteo European Air Quality API, powered by the European Union's Copernicus Atmosphere Monitoring Service (CAMS). Every two hours, the workflow fetches real-time concentrations of particulate matter ($\text{PM}_{2.5}$ and $\text{PM}_{10}$), nitrogen dioxide ($\text{NO}_2$), ozone ($\text{O}_3$), and the European Air Quality Index (European AQI).

    The workflow ingests the JSON telemetry feed into an embedded DuckDB database, maps continuous indices into official health risk categories (`GOOD`, `MODERATE`, `POOR`, `VERY_POOR`, and `HAZARDOUS`), exports columnar Parquet snapshots and filtered incident CSVs to Kestra internal storage, maintains state in the Kestra KV store, and fires conditional Slack alerts when atmospheric pollution breaches safety thresholds ($\text{AQI} \ge 40$).

    ## Why use this?

    Industrial plants, logistics networks, smart building management systems, and corporate campuses require automated air quality monitoring to dynamically adjust HVAC filtration, protect field personnel, and verify regulatory environmental compliance.

    Key advantages of this pipeline include:

    - **Official Keyless European Telemetry**: Queries authoritative Copernicus Atmosphere data with zero API key dependencies or usage paywalls.
    - **In-Memory Columnar Transformation**: DuckDB processes multi-city coordinates, calculates severity rankings, and outputs compressed Parquet files directly to Kestra internal storage.
    - **Proactive Health Alerting**: Translates complex chemical concentrations into clear, actionable air quality bands with rich Slack notifications.
    - **Zero Failure Impact**: Slack tasks include `allowFailure: true` so temporary notification outages do not interrupt continuous historical data recording.

    ## Architecture

    ```mermaid
    flowchart TD
      A["Schedule Trigger<br/>(Every 2 Hours)"] --> B["HTTP Download<br/>(Copernicus / Open-Meteo API)"]
      B --> C["DuckDB Queries<br/>(Classify AQI & Filter Pollution Spikes)"]
      C --> D["Kestra Internal Storage<br/>(air_quality_snapshot.parquet)"]
      C --> E["Kestra Internal Storage<br/>(hazardous_air_alerts.csv)"]
      C --> F{"If Alert Count > 0"}
      F -- Yes --> G["Slack Notification<br/>(Air Quality Warning)"]
      F -- No --> H["Skip Alert"]
      G --> I["KV Set<br/>(Update Peak AQI State)"]
      H --> I
    ```

    ## Prerequisites

    - Kestra 2.0 with the JDBC DuckDB plugin (`io.kestra.plugin.jdbc.duckdb.Queries`) and the Slack notifications plugin (`io.kestra.plugin.slack.notifications.SlackIncomingWebhook`).
    - Outbound HTTPS network connectivity to `air-quality-api.open-meteo.com`.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Optional Slack incoming webhook endpoint for real-time air quality hazard notifications.

    ## Quick start

    1. Import this flow into your Kestra instance.
    2. Click **Execute** using default inputs (`alert_aqi_threshold: 40`).
    3. Verify the execution outputs under the **Outputs** tab:
       - `air_quality_snapshot.parquet`: Columnar historical snapshot containing the latest readings across all monitored coordinates.
       - `hazardous_air_alerts.csv`: Tabular CSV listing all coordinates meeting or exceeding the alert threshold.
    4. Check the **KV Store** tab for the `air_quality_watch_state` key to confirm recorded telemetry values.
    5. Set the `SLACK_WEBHOOK_URL` secret and enable the schedule trigger for continuous environmental surveillance.

    ## How to extend

    - **Custom Geographic Coordinates**: Update the latitude and longitude query parameters to monitor your specific manufacturing facilities or distribution centers.
    - **Automated HVAC Integration**: Connect an outbound webhook to commercial building automation systems to switch air handlers into recirculation mode during high AQI events.
    - **Warehouse Ingestion**: Add downstream tasks using `io.kestra.plugin.gcp.bigquery.Load` or `io.kestra.plugin.aws.s3.Upload` to archive longitudinal environmental telemetry.

    ## Links

    - [Kestra HTTP Download Plugin](https://kestra.io/plugins/core/http/io.kestra.plugin.core.http.download)
    - [Kestra DuckDB Plugin](https://kestra.io/plugins/plugin-jdbc-duckdb/io.kestra.plugin.jdbc.duckdb.queries)
    - [Kestra KV Store](https://kestra.io/plugins/core/kv/io.kestra.plugin.core.kv.set)
    - [Kestra Slack Notifications](https://kestra.io/plugins/plugin-notifications/slack/io.kestra.plugin.slack.notifications.slackincomingwebhook)
    - [Open-Meteo Air Quality API](https://open-meteo.com/en/docs/air-quality-api)
    - [Copernicus Atmosphere Monitoring Service (CAMS)](https://atmosphere.copernicus.eu/)
  tags:
    - Data
  subTags:
    - Monitoring & Alerting
    - Realtime & Streaming
  ee: false
  demo: false
