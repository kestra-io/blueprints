id: github-stale-pr-cleanup
namespace: company.devops
description: This workflow automatically scans open pull requests in a specified GitHub repository, identifies PRs that haven't been updated within a specified number of days, posts a reminder comment on stale PRs, and sends a summary report to Slack.

inputs:
  - id: repository
    type: STRING
    defaults: "architdhakar/kestra_test_repo"

  - id: days_stale
    type: INT
    defaults: 0

tasks:
  - id: fetch_open_prs
    type: io.kestra.plugin.core.http.Request
    uri: "https://api.github.com/repos/{{ inputs.repository }}/pulls?state=open&per_page=100"
    headers:
      Accept: "application/vnd.github+json"
      Authorization: "Bearer {{ secret('GITHUB_TOKEN') }}"

  - id: process_each_pr
    type: io.kestra.plugin.core.flow.Loop
    values: "{{ fromJson(outputs.fetch_open_prs.body) }}"
    tasks:
      - id: log_pr
        type: io.kestra.plugin.core.log.Log
        message: |
          PR number: {{ fromJson(item.value).number }}
          PR title: {{ fromJson(item.value).title }}
          Last updated: {{ fromJson(item.value).updated_at }}

      - id: check_stale_and_label
        type: io.kestra.plugin.core.flow.If
        condition: "{{ (fromJson(item.value).updated_at | date('yyyy-MM-dd')) <= (now() | dateAdd(-inputs.days_stale, 'DAYS') | date('yyyy-MM-dd')) }}"
        then:
          - id: log_stale_pr
            type: io.kestra.plugin.core.log.Log
            message: |
              STALE PR FOUND
              PR: #{{ fromJson(item.value).number }}
              Title: {{ fromJson(item.value).title }}

          - id: comment_on_pr
            type: io.kestra.plugin.github.issues.Comment
            oauthToken: "{{ secret('GITHUB_TOKEN') }}"
            repository: "{{ inputs.repository }}"
            issueNumber: "{{ fromJson(item.value).number }}"
            body: |
              Hi! This pull request has had no activity for over {{ inputs.days_stale }} days.
              Please update this branch or apply the `keep-open` label if work is still ongoing.

  - id: notify_slack_summary
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "GitHub PR scan completed for {{ inputs.repository }}. Open PRs scanned: {{ fromJson(outputs.fetch_open_prs.body) | length }}. Stale threshold: {{ inputs.days_stale }} day(s)."
      }


extend:
  title: Scan Stale GitHub Pull Requests and Notify Slack
  metaTitle: Scan Stale GitHub PRs and Send Slack Report
  shortDescription: Scans open pull requests inactive for over a configured threshold, adds a reminder comment, and sends a summary report to Slack.
  metaDescription: Automate GitHub repository maintenance by scanning stale PRs, adding warning comments, and notifying team channels in Slack.
  description: |
    ## Why orchestrate this with Kestra
    Managing repository health manually across multiple teams leads to abandoned branches and stale pull requests. Orchestrating stale PR sweeps with Kestra provides declarative scheduling, robust error handling, automated GitHub API authentication, and centralized status notifications without maintaining standalone cron infrastructure or custom scripts.

    ## Prerequisites
    - A target GitHub repository with open pull requests.
    - A GitHub Personal Access Token (PAT) with `repo` issue write permissions.
    - A Slack Incoming Webhook URL.

    ### Secrets
    - `GITHUB_TOKEN`: GitHub Personal Access Token used to query pull requests and post comments.
    - `SLACK_WEBHOOK_URL`: Incoming Webhook URL to send execution summary alerts to Slack.

    ## How it works
    1. Fetches all open pull requests from the specified target repository using the GitHub API.
    2. Loops through each pull request and extracts its metadata (PR number, title, and last updated date).
    3. Compares the PR's `updated_at` date against the configured `days_stale` input threshold.
    4. Automatically posts a reminder comment on any PR flagged as stale.
    5. Sends a summary message to Slack detailing total scanned pull requests.

    ## Quick start
    1. Configure the `GITHUB_TOKEN` and `SLACK_WEBHOOK_URL` secrets in your Kestra namespace.
    2. Import this blueprint and click **Execute** with your target repository name.
    3. Verify execution logs and activate the weekly schedule trigger.

    ## How to extend
    - Add an extra branch-closing or auto-labeling task for PRs inactive for over 60 days.
    - Send individual direct messages on Slack to PR authors by mapping GitHub usernames to Slack IDs.

    ## Links
    - [Kestra GitHub Plugin Documentation](https://kestra.io/plugins/plugin-github)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
    - [GitHub REST API Documentation](https://docs.github.com/rest)
  tags:
    - Core
  subTags:
    - Flow Control & Conditions
  ee: false
  demo: false