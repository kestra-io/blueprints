id: ldap-privileged-group-membership-gate
namespace: company.team
description: |
  Check whether a named account still exists in the people tree and, if so,
  whether it is still listed as a member of a privileged LDAP group,
  classify HEALTHY, AT_RISK (still a member), or UNREACHABLE (account not
  found), alert Slack, and optionally remove it from the group with
  Modify. auto_remediate and dry_run are two independent gates: the
  account entry itself and every group membership besides the one named
  group are left untouched.

triggers:
  - id: periodic_membership_check
    type: io.kestra.plugin.core.trigger.Schedule
    description: Check every 6 hours - privileged group membership drifts slowly, usually only when an offboarding or access review step is missed. Shipped disabled; enable it once the LDAP secrets and target_uid/privileged_group_dn point at a real directory and a manual run has been verified. Always fires in safe mode (auto_remediate false, dry_run true) regardless of this flow's own defaults.
    cron: "0 */6 * * *"
    disabled: true
    inputs:
      auto_remediate: "false"
      dry_run: "true"

inputs:
  - id: target_uid
    type: STRING
    displayName: "Target Account uid"
    defaults: "jdoe"
    description: uid of the account audited (matches the LDAP uid attribute under people_base_dn, the same attribute the offboarding deprovision blueprint matches on).

  - id: people_base_dn
    type: STRING
    displayName: "People Base DN"
    defaults: "ou=people,dc=example,dc=com"
    description: Organizational unit searched for target_uid, and used to build its full member DN as uid={{ target_uid }},{{ people_base_dn }}.

  - id: privileged_group_dn
    type: STRING
    displayName: "Privileged Group DN"
    defaults: "cn=admins,ou=groups,dc=example,dc=com"
    description: DN of the sensitive group audited for the account's continued membership. Must use a group schema with a multi-valued member attribute (for example groupOfNames).

  - id: auto_remediate
    type: SELECT
    displayName: "Auto Remediate"
    defaults: "false"
    values:
      - "false"
      - "true"
    description: If "true" and target_uid is confirmed still in privileged_group_dn, remove it from that one group's member attribute (still gated by dry_run below). If "false", the risk is only reported. Has no effect when target_uid does not exist at all, since there is nothing to remove.

  - id: dry_run
    type: SELECT
    displayName: "Dry Run"
    defaults: "true"
    values:
      - "true"
      - "false"
    description: If "true", remediation is only logged, the Modify call never runs. Must be explicitly "false", together with auto_remediate "true", for the account to actually be removed from the group.

tasks:
  - id: check_account_exists
    type: io.kestra.plugin.ldap.Search
    description: "io.kestra.plugin.ldap.Search's only output is a uri pointing to an LDIF file of matching entries (verified from the plugin's own source) - there is no row/count field. A zero-match search writes an empty file, so read(outputs.check_account_exists.uri) == '' is how absence is detected."
    hostname: "{{ secret('LDAP_HOSTNAME') }}"
    port: 389
    userDn: "{{ secret('LDAP_ADMIN_DN') }}"
    password: "{{ secret('LDAP_ADMIN_PASSWORD') }}"
    baseDn: "{{ inputs.people_base_dn }}"
    filter: "(uid={{ inputs.target_uid }})"
    attributes:
      - uid
    sizeLimit: 1

  - id: check_group_membership
    type: io.kestra.plugin.ldap.Search
    description: Searches privileged_group_dn itself (default SUB scope starting at that DN; a group entry has no descendants, so this only ever matches the group entry) filtered by member equality. A non-empty result means target_uid's member DN is currently present in that group's member attribute.
    hostname: "{{ secret('LDAP_HOSTNAME') }}"
    port: 389
    userDn: "{{ secret('LDAP_ADMIN_DN') }}"
    password: "{{ secret('LDAP_ADMIN_PASSWORD') }}"
    baseDn: "{{ inputs.privileged_group_dn }}"
    filter: "(member=uid={{ inputs.target_uid }},{{ inputs.people_base_dn }})"
    attributes:
      - cn
    sizeLimit: 1

  - id: evaluate_account_presence
    type: io.kestra.plugin.core.flow.If
    description: UNREACHABLE when target_uid has no entry at all under people_base_dn - either it was already fully deprovisioned, or the uid/base DN given to this audit is wrong, either way there is no live account to assess group risk against.
    condition: "{{ read(outputs.check_account_exists.uri) != '' }}"
    then:
      - id: evaluate_group_membership
        type: io.kestra.plugin.core.flow.If
        description: AT_RISK when the account still exists and is still a member of privileged_group_dn.
        condition: "{{ read(outputs.check_group_membership.uri) != '' }}"
        then:
          - id: route_remediation
            type: io.kestra.plugin.core.flow.Switch
            description: auto_remediate only decides whether remediation is considered at all; dry_run, checked separately below, decides whether Modify actually runs.
            value: "{{ inputs.auto_remediate }}"
            cases:
              "true":
                - id: check_dry_run
                  type: io.kestra.plugin.core.flow.If
                  condition: "{{ inputs.dry_run == \"false\" }}"
                  then:
                    - id: build_revocation_record
                      type: io.kestra.plugin.core.storage.Write
                      description: One Ion modify record that deletes target_uid's member DN from privileged_group_dn, in the same Ion-to-LDIF shape the LDAP offboarding deprovision blueprint uses for its group revocations.
                      extension: .ion
                      content: |
                        {dn:"{{ inputs.privileged_group_dn }}",changeType:"modify",modifications:[{operation:"DELETE",attribute:"member",values:["uid={{ inputs.target_uid }},{{ inputs.people_base_dn }}"]}]}
                    - id: convert_to_ldif
                      type: io.kestra.plugin.ldap.IonToLdif
                      description: Convert the modify Ion record into the LDIF format the Modify task expects.
                      inputs:
                        - "{{ outputs.build_revocation_record.uri }}"
                    - id: remove_group_membership
                      type: io.kestra.plugin.ldap.Modify
                      description: Applies only the one DELETE-member modification against privileged_group_dn - target_uid's own entry under people_base_dn, and every other group it may belong to, are untouched.
                      hostname: "{{ secret('LDAP_HOSTNAME') }}"
                      port: 389
                      userDn: "{{ secret('LDAP_ADMIN_DN') }}"
                      password: "{{ secret('LDAP_ADMIN_PASSWORD') }}"
                      inputs:
                        - "{{ outputs.convert_to_ldif.urisList[0] }}"
                    - id: log_remediation_applied
                      type: io.kestra.plugin.core.log.Log
                      message: "Removed uid={{ inputs.target_uid }},{{ inputs.people_base_dn }} from {{ inputs.privileged_group_dn }}."
                  else:
                    - id: log_dry_run_remediation
                      type: io.kestra.plugin.core.log.Log
                      message: "DRY RUN: would remove uid={{ inputs.target_uid }},{{ inputs.people_base_dn }} from {{ inputs.privileged_group_dn }} (dry_run is true). No change made."
              "false":
                - id: log_remediation_disabled
                  type: io.kestra.plugin.core.log.Log
                  message: "auto_remediate is false: {{ inputs.target_uid }} is still a member of {{ inputs.privileged_group_dn }}, but no remediation was attempted."
          - id: alert_still_a_member
            type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
            description: Always alert on AT_RISK, independent of whether remediation ran.
            url: "{{ secret('SLACK_WEBHOOK_URL') }}"
            payload: |
              {
                "text": "LDAP privileged group gate: AT_RISK. uid={{ inputs.target_uid }},{{ inputs.people_base_dn }} is still a member of {{ inputs.privileged_group_dn }}. auto_remediate: {{ inputs.auto_remediate }}. dry_run: {{ inputs.dry_run }}. Remediated: {{ outputs.remove_group_membership is defined }}. Execution {{ execution.id }}."
              }
        else:
          - id: log_membership_healthy
            type: io.kestra.plugin.core.log.Log
            message: "HEALTHY: uid={{ inputs.target_uid }},{{ inputs.people_base_dn }} exists and is not a member of {{ inputs.privileged_group_dn }}."
    else:
      - id: alert_account_unreachable
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: UNREACHABLE means target_uid has no entry under people_base_dn at all - distinct from both HEALTHY and AT_RISK.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "LDAP privileged group gate: UNREACHABLE. uid={{ inputs.target_uid }} has no entry under {{ inputs.people_base_dn }} - it may already be fully deprovisioned, or target_uid/people_base_dn may be wrong. Execution {{ execution.id }}."
          }

  - id: log_audit_complete
    type: io.kestra.plugin.core.log.Log
    description: Final status line for every run, independent of which branch fired, so the execution history always shows the headline numbers.
    message: "Privileged group audit complete for uid={{ inputs.target_uid }} against {{ inputs.privileged_group_dn }}. account_found={{ read(outputs.check_account_exists.uri) != '' }}. auto_remediate={{ inputs.auto_remediate }}. dry_run={{ inputs.dry_run }}."

errors:
  - id: alert_execution_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alert when the flow itself fails outside the handled branches, for example an unreachable LDAP server or invalid bind credentials.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "LDAP privileged group gate FAILED in execution {{ execution.id }} for uid={{ inputs.target_uid }} against {{ inputs.privileged_group_dn }}. The membership audit did not complete; investigate before trusting the last known HEALTHY/AT_RISK/UNREACHABLE status."
      }

extend:
  title: "LDAP Privileged Group Membership Gate"
  shortDescription: Check whether an account is still a member of a privileged LDAP group, alert Slack on lingering access or a missing account, and optionally revoke the membership.
  metaTitle: LDAP Privileged Group Membership Gate with Kestra
  metaDescription: "Audit whether an LDAP account still belongs to a privileged group, alert on lingering access, and optionally revoke it."
  description: |
    An offboarding ticket that moves an account out of the active people tree but
    forgets one admin group leaves behind exactly the kind of access nobody is
    watching for - the account looks gone, but it is still sitting inside
    `cn=admins` or whatever sensitive group it was never explicitly removed from.
    This blueprint checks both halves of that gap with `io.kestra.plugin.ldap.Search`:
    does the account still exist, and if so, is it still listed in the privileged
    group's own `member` attribute. It classifies the result into a three-state risk
    level, alerts on anything but a clean bill of health, and can revoke the one
    membership with `io.kestra.plugin.ldap.Modify`, behind two independent gates.

    ## How it works

    1. `periodic_membership_check` (`io.kestra.plugin.core.trigger.Schedule`) runs every 6 hours, always forcing `auto_remediate: "false"` and `dry_run: "true"` through its own `inputs:` override regardless of this flow's defaults. Shipped disabled so you can validate a manual run first.
    2. `check_account_exists` (`io.kestra.plugin.ldap.Search`) filters `people_base_dn` by `(uid={{ target_uid }})`, `sizeLimit: 1`. Its only output is `uri`, an LDIF file that is empty when nothing matches.
    3. `check_group_membership` (`io.kestra.plugin.ldap.Search`) filters `privileged_group_dn` itself by `(member=uid={{ target_uid }},{{ people_base_dn }})`, `sizeLimit: 1` - a non-empty result means that exact member DN is present on the group entry right now.
    4. `evaluate_account_presence` (`io.kestra.plugin.core.flow.If`) branches on `read(outputs.check_account_exists.uri) != ''`.
       - `else` (UNREACHABLE): `alert_account_unreachable` reports that the account has no entry at all.
       - `then` (account exists): nested `evaluate_group_membership` (`io.kestra.plugin.core.flow.If`) branches on `read(outputs.check_group_membership.uri) != ''`.
         - `else` (HEALTHY): `log_membership_healthy` records a clean check.
         - `then` (AT_RISK): `route_remediation` (`io.kestra.plugin.core.flow.Switch` on `auto_remediate`) either considers remediation (`"true"`, gated again by `dry_run` through `check_dry_run`) or only logs that remediation is disabled (`"false"`). When both gates allow it, an Ion `modify` record naming only `privileged_group_dn`'s `member` attribute is written, converted to LDIF with `io.kestra.plugin.ldap.IonToLdif`, and applied with `io.kestra.plugin.ldap.Modify` - the same Ion-to-LDIF shape this repo's own `ldap-employee-offboarding-deprovision.yaml` uses. `alert_still_a_member` always fires to Slack regardless of which remediation path ran.
    5. `log_audit_complete` always runs last, printing the headline numbers regardless of which branch fired.
    6. The `errors` block alerts Slack separately if the flow itself fails outright - an unreachable directory or bad bind credentials must not read as "no risk".

    ## What you get

    - A direct, two-part answer - does the account exist, is it still in the group - instead of inferring either from an offboarding ticket's status field.
    - A distinct UNREACHABLE state so an account that never existed (or a typo'd `target_uid`) is never misread as a clean HEALTHY result.
    - Remediation scoped to exactly one `DELETE` of one `member` value on one named group - it cannot touch the account's own entry, any other group, or any other attribute.
    - Two independent gates (`auto_remediate`, `dry_run`) between "still a member" and "membership actually revoked".
    - A final status log every run, risk or not, so the execution history doubles as an access-review trail for that account and group.

    ## Who it's for

    - IT and identity teams running an on-premises OpenLDAP, ApacheDS, or similar directory who want a scheduled check that an offboarding or access-review action actually took effect on a specific sensitive group.
    - Security teams doing periodic privileged-access reviews who want one Slack alert naming the exact account and group, instead of exporting the whole group and diffing it by hand.
    - Anyone extending this repo's own `ldap-employee-offboarding-deprovision.yaml` - that blueprint's own "How to extend" section suggests exactly this: "Add a scheduled `io.kestra.plugin.ldap.Search` trigger elsewhere in the catalog to audit for stale accounts that were never offboarded through this path."

    ## Why orchestrate this with Kestra

    Two LDAP searches run by hand answer one moment in time; they do not decide a cadence, classify the combined result into a three-state risk level, gate a membership change behind two independent confirmations, or notify anyone. Kestra supplies the schedule, the HEALTHY/AT_RISK/UNREACHABLE classification as a first-class branch, two independent authorization gates before any membership is revoked, and an execution history that shows exactly when an account's privileged access should have been removed and whether it was.

    ## Prerequisites

    - An LDAP directory reachable from Kestra, with the account's entry under `people_base_dn` and the sensitive group using a schema with a multi-valued `member` attribute (for example `groupOfNames`).
    - A bind account with permission to search `people_base_dn` and `privileged_group_dn`, and, if `auto_remediate` will ever be `"true"`, permission to modify `privileged_group_dn`.
    - A Slack incoming webhook for alerts.

    Local testing:
    `docker run -d --name ldap-gate -p 3890:389 --env LDAP_ORGANISATION="Example Inc" --env LDAP_DOMAIN="example.com" --env LDAP_ADMIN_PASSWORD="<your-local-password>" osixia/openldap:1.5.0`
    `docker network connect YOUR_KESTRA_NETWORK ldap-gate` (check existing networks first with `docker network ls`; only needed if the Kestra Worker runs in a separate Docker network than this container; set `LDAP_HOSTNAME` to `ldap-gate` from inside that network, or `localhost` with `port: 3890` from the host - the Search/Modify tasks' `port` property is a plain input, not read from a secret, so adjust the task-level `port: 389` in this flow to `3890` for host-side testing). Host port `3890` is used here specifically so it never collides with Kestra's own UI on `8080`, and `389` stays free for an in-network connection.

    ### Secrets

    - `LDAP_HOSTNAME`: hostname of the LDAP server.
    - `LDAP_ADMIN_DN` / `LDAP_ADMIN_PASSWORD`: bind credentials used by every `io.kestra.plugin.ldap.Search`/`Modify` task in this flow.
    - `SLACK_WEBHOOK_URL`: Slack incoming webhook used by `alert_still_a_member`, `alert_account_unreachable`, and the `errors` block.
    - In Kestra OSS (no Enterprise secrets backend), secrets are supplied as environment variables prefixed `SECRET_`, base64-encoded, and read back in flows with `{{ secret('NAME') }}` - for example `SECRET_LDAP_ADMIN_PASSWORD=$(echo -n '<your-local-password>' | base64)`. This keeps credentials out of the flow YAML but, per Kestra's own documentation, offers no encryption at rest or access control beyond the host environment; use the Enterprise secrets backend for stronger guarantees.

    ### Inputs

    - `target_uid` (STRING, default `jdoe`): uid of the account audited.
    - `people_base_dn` (STRING, default `ou=people,dc=example,dc=com`): OU searched for `target_uid`.
    - `privileged_group_dn` (STRING, default `cn=admins,ou=groups,dc=example,dc=com`): sensitive group audited for lingering membership.
    - `auto_remediate` (SELECT: `"false"`, `"true"`; default `"false"`): must be `"true"` for remediation to even be considered.
    - `dry_run` (SELECT: `"true"`, `"false"`; default `"true"`): must be explicitly `"false"`, together with `auto_remediate: "true"`, for the group membership to actually be revoked.

    ### Outputs

    - `outputs.check_account_exists.uri`: LDIF file for the `uid` lookup, every run; `read(...)` on it is empty when the account does not exist.
    - `outputs.check_group_membership.uri`: LDIF file for the group-membership check, every run; `read(...)` on it is empty when the account is not a member.
    - `outputs.remove_group_membership`: present only when remediation actually ran.

    ## Quick start

    1. Start OpenLDAP locally with the command above, create a `jdoe` entry under `ou=people,dc=example,dc=com`, and add it as a `member` of `cn=admins,ou=groups,dc=example,dc=com`.
    2. Add the `LDAP_HOSTNAME`, `LDAP_ADMIN_DN`, `LDAP_ADMIN_PASSWORD`, and `SLACK_WEBHOOK_URL` secrets.
    3. Run the flow manually with the defaults and confirm `alert_still_a_member` fires (AT_RISK: the account exists and is still a group member).
    4. Run once with `auto_remediate: "true"` and `dry_run: "true"` and confirm `log_dry_run_remediation` describes the removal without applying it.
    5. Run once with `auto_remediate: "true"` and `dry_run: "false"` and confirm `remove_group_membership` runs, then verify with an LDAP search on `cn=admins` that `jdoe` is no longer listed.
    6. Point `target_uid` at a uid that does not exist under `people_base_dn` and re-run to confirm `alert_account_unreachable` fires (UNREACHABLE) instead of either HEALTHY or AT_RISK.
    7. Enable `periodic_membership_check` once you trust the check; it always runs in the safe `auto_remediate: "false"` / `dry_run: "true"` mode regardless of what you leave the flow's own defaults set to.

    ## How to extend

    - Loop over several `target_uid`/`privileged_group_dn` pairs with `io.kestra.plugin.core.flow.Loop` to run the same gate across an entire access-review list in one flow.
    - Chain this flow after `ldap-employee-offboarding-deprovision.yaml` with a `Subflow` task as a same-run verification that the offboarding's own group revocation actually took effect, instead of waiting for the next scheduled audit.
    - Add a second `check_group_membership`-style task per additional sensitive group, and fold every result into one combined AT_RISK condition, for an account that must be checked against several privileged groups at once.
    - Replace the hardcoded `(member=...)` filter with `(|(member=...)(uniqueMember=...))` if your directory mixes `groupOfNames` and `groupOfUniqueNames` schemas across different groups.

    ## Pitfalls

    - **`io.kestra.plugin.ldap.Search` has no row/count output, only `uri`.** Every presence/absence check in this flow goes through `read(outputs.x.uri) == ''` on the stored LDIF file, not a structured field - there is nothing like `outputs.search.totalHits` for this plugin, unlike some other search-oriented plugins in this repo.
    - **The group search relies on default SUB scope matching only the group entry itself.** A `groupOfNames` entry has no descendants, so searching `privileged_group_dn` with the default scope and a `(member=...)` filter can only ever return that one group entry or nothing - it does not recurse into nested groups. A nested-group structure needs a separate lookup per group in the chain.
    - **This only revokes membership in the one group you name.** An account flagged AT_RISK in `cn=admins` may still hold access through a completely different group this flow was never told to check - it is a single-group gate, not a full privileged-access inventory.
    - **There is no structured "list group members" or "check membership" task in this plugin.** Both checks go through the same generic `io.kestra.plugin.ldap.Search` task used by this repo's own `ldap-employee-offboarding-deprovision.yaml`, and remediation reuses that same blueprint's Ion-to-LDIF-to-`Modify` chain rather than inventing a new one.
    - **`auto_remediate` and `dry_run` are independent gates, not a single boolean.** Both must be `"true"`/`"false"` respectively for the group membership to actually be revoked; setting only one leaves the other still blocking.
    - **`Switch` case keys `"true"`/`"false"` are quoted strings.** `auto_remediate` renders as the literal string `"true"` or `"false"`; unquoted `true:`/`false:` YAML map keys would parse as booleans instead and would not match.
    - **This blueprint is UNTESTED against a live LDAP directory.** `Search`'s `uri`-only output, the connection properties (`hostname`, `port`, `userDn`, `password`), and the Ion/LDIF remediation shape are all taken verbatim from the plugin's source and this repo's own existing LDAP blueprint - but no Docker container or Kestra engine was run to execute this flow end to end.

    ## Links

    - [plugin-ldap documentation](https://kestra.io/plugins/plugin-ldap)
    - [plugin-ldap source (Search.java)](https://github.com/kestra-io/plugin-ldap/blob/main/src/main/java/io/kestra/plugin/ldap/Search.java)
    - [RFC 4519 - member attribute / groupOfNames](https://www.rfc-editor.org/rfc/rfc4519)
    - [Kestra secrets (OSS vs Enterprise)](https://kestra.io/docs/concepts/secret)
  tags:
    - Infrastructure
    - Core
  subTags:
    - Infrastructure Automation
    - Policy & Compliance
  ee: false
  demo: false
