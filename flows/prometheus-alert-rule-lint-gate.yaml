id: prometheus-alert-rule-lint-gate
namespace: company.team
description: |
  Lint Prometheus alert and recording rule definitions before they merge. A CI
  webhook or a disabled daily schedule checks out the repository, runs promtool
  inside the official Prometheus container, and escalates every violation as a
  GitHub issue, a Slack alert, and a red execution.

triggers:
  - id: on_rules_change
    type: io.kestra.plugin.core.trigger.Webhook
    description: Your CI POSTs here whenever files under the rules directory change, so every alert rule edit is linted before merge.
    key: "{{ secret('RULES_WEBHOOK_KEY') }}"
  - id: nightly_lint
    type: io.kestra.plugin.core.trigger.Schedule
    description: Daily full lint of the rules directory as a net for edits that bypassed the webhook, shipped disabled until you switch it on.
    cron: "0 5 * * *"
    disabled: true

inputs:
  - id: repository
    type: STRING
    defaults: your-org/your-repo
    description: GitHub repository in owner/repo form that is cloned for linting and receives the issue when violations are found.
  - id: rules_dir
    type: STRING
    defaults: alerts
    description: Directory inside the repository holding the Prometheus rule files, scanned recursively for yaml and yml files.
  - id: branch
    type: STRING
    defaults: main
    description: Branch to check out and lint when the run starts.

tasks:
  # --- 1. check out the rules and run promtool ---
  - id: workspace
    type: io.kestra.plugin.core.flow.WorkingDirectory
    description: One shared filesystem so the checkout, the promtool container, and the parser all see the same rule files and the same report.
    tasks:
      - id: clone_repository
        type: io.kestra.plugin.git.Clone
        description: Check out the repository at the configured branch so promtool lints the exact rule definitions CI is about to merge.
        url: "https://github.com/{{ inputs.repository }}.git"
        username: x-access-token
        password: "{{ secret('GITHUB_TOKEN') }}"
        branch: "{{ inputs.branch }}"

      - id: run_promtool
        type: io.kestra.plugin.scripts.shell.Commands
        description: Find every rule file under rules_dir, run promtool check rules with all lint checks plus an optional config check inside the official Prometheus image, and collect both files as output files. Exit codes are absorbed so the parser, not promtool, drives the gate.
        taskRunner:
          type: io.kestra.plugin.scripts.runner.docker.Docker
        containerImage: prom/prometheus:v2.53.0
        outputFiles:
          - rules-manifest.txt
          - promtool-report.txt
        commands:
          - |
            RULES_DIR="{{ inputs.rules_dir }}"
            : > rules-manifest.txt
            : > promtool-report.txt
            if [ -d "$RULES_DIR" ]; then
              find "$RULES_DIR" -type f \( -name '*.yaml' -o -name '*.yml' \) | sort >> rules-manifest.txt
            fi
            if [ -s rules-manifest.txt ]; then
              RULE_FILES=$(cat rules-manifest.txt)
              promtool check rules --lint=all $RULE_FILES > promtool-report.txt 2>&1 || true
            fi
            if [ -f prometheus.yml ]; then
              promtool check config --lint=all prometheus.yml >> promtool-report.txt 2>&1 || true
            fi
            cat promtool-report.txt

      # --- 2. turn the raw promtool output into violations ---
      - id: assess
        type: io.kestra.plugin.scripts.python.Script
        description: Walk the promtool report and emit a structured violations list with file, rule, and message plus a pass or fail verdict through the outputs protocol.
        taskRunner:
          type: io.kestra.plugin.core.runner.Process
        inputFiles:
          promtool-report.txt: "{{ outputs.run_promtool.outputFiles['promtool-report.txt'] }}"
          rules-manifest.txt: "{{ outputs.run_promtool.outputFiles['rules-manifest.txt'] }}"
        env:
          RULES_DIR: "{{ inputs.rules_dir }}"
        script: |
          import json
          import os
          import re

          REPORT_PATH = "promtool-report.txt"
          MANIFEST_PATH = "rules-manifest.txt"
          RULE_NAME_RE = re.compile(r'rule\s+\d+,\s*"([^"]+)"')
          FILE_HINT_RE = re.compile(r'^([^\s:]+\.(?:yaml|yml))\s*:')
          STRUCTURAL_TOKENS = ("SUCCESS", "rules found", "is valid", "no problems")

          def read_lines(path):
              try:
                  with open(path, "r", encoding="utf-8", errors="replace") as handle:
                      return [line.rstrip() for line in handle]
              except OSError:
                  return []

          def one_line(text):
              return re.sub(r"\s+", " ", str(text)).strip()

          def json_safe(text):
              return one_line(text).replace("\\", "/").replace('"', "'")

          def rule_name(message):
              match = RULE_NAME_RE.search(message)
              if match:
                  return match.group(1)
              return "promtool"

          manifest = [line.strip() for line in read_lines(MANIFEST_PATH) if line.strip()]
          report = read_lines(REPORT_PATH)
          rules_dir = os.environ.get("RULES_DIR", "rules")

          violations = []
          current_file = None
          pending = None

          def add_violation(message):
              global pending
              path = current_file
              if path is None:
                  hint = FILE_HINT_RE.match(message)
                  path = hint.group(1) if hint else "report"
              violations.append({
                  "file": path,
                  "rule": rule_name(message),
                  "message": one_line(message),
              })
              pending = len(violations) - 1

          for line in report:
              stripped = line.strip()
              if not stripped:
                  continue
              if stripped.startswith("Checking "):
                  current_file = one_line(stripped[9:])
                  pending = None
                  continue
              if any(token in stripped for token in STRUCTURAL_TOKENS):
                  pending = None
                  continue
              is_lint = re.match(r"^LINT\s+(ERROR|WARNING)", stripped) is not None
              has_file_hint = FILE_HINT_RE.match(stripped) is not None
              if is_lint or has_file_hint:
                  add_violation(stripped)
                  continue
              if pending is not None:
                  violations[pending]["message"] = one_line(
                      violations[pending]["message"] + " " + stripped
                  )
                  continue
              if "FAILED" in stripped or "error" in stripped.lower():
                  add_violation(stripped)
                  continue

          if not manifest:
              violations.append({
                  "file": rules_dir,
                  "rule": "no_rule_files",
                  "message": "no YAML rule files matched under " + rules_dir,
              })
          elif not any(line.strip().startswith("Checking ") for line in report):
              violations.append({
                  "file": rules_dir,
                  "rule": "report_missing",
                  "message": "promtool produced no readable report for the checked rule files",
              })

          files_checked = len(manifest)
          violation_count = len(violations)
          gate_passed = violation_count == 0
          verdict = "pass" if gate_passed else "violations"

          bullets = ["- %s (%s): %s" % (v["file"], v["rule"], v["message"])
                     for v in violations[:25]]
          if violation_count > 25:
              bullets.append("- and %d more" % (violation_count - 25))
          violations_markdown = "\n".join(bullets) if bullets else "none"
          brief = "; ".join("%s: %s" % (v["file"], v["message"])
                            for v in violations[:3]) or "none"
          violations_brief = json_safe(brief)

          print("files_checked=%d violation_count=%d verdict=%s" % (
              files_checked, violation_count, verdict))
          print("::" + json.dumps({"outputs": {
              "verdict": verdict,
              "gate_passed": gate_passed,
              "files_checked": files_checked,
              "violation_count": violation_count,
              "violations": violations[:25],
              "violations_markdown": violations_markdown,
              "violations_brief": violations_brief,
          }}) + "::")

  # --- 3. escalate violations and turn the execution red ---
  - id: lint_gate
    type: io.kestra.plugin.core.flow.If
    description: Open the escalation path only when promtool reported at least one violation, so a clean rules directory stays quiet.
    condition: "{{ outputs.assess.vars.violation_count > 0 }}"
    then:
      - id: open_lint_issue
        type: io.kestra.plugin.github.issues.Create
        description: File the whole violations list in the team's GitHub backlog so a broken rule definition becomes tracked work instead of a CI log nobody reads.
        jwtToken: "{{ secret('GITHUB_TOKEN') }}"
        repository: "{{ inputs.repository }}"
        title: "promtool found {{ outputs.assess.vars.violation_count }} alert rule violation(s) in {{ inputs.repository }}"
        body: |
          ## Prometheus alert rule lint violations

          Branch `{{ inputs.branch }}`, rules directory `{{ inputs.rules_dir }}`.

          **{{ outputs.assess.vars.violation_count }} violation(s)** across {{ outputs.assess.vars.files_checked }} checked rule file(s).

          {{ outputs.assess.vars.violations_markdown }}

          Execution {{ execution.id }}

          Fix the rule definitions listed above, run `promtool check rules` locally until it reports zero violations, then close this issue.
        labels:
          - prometheus
          - alert-rules
          - lint-gate
      - id: alert_slack
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Post the violation count and the first hits to the team channel right after the issue is filed.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "promtool lint gate FAILED for {{ inputs.repository }}: {{ outputs.assess.vars.violation_count }} violation(s) in {{ outputs.assess.vars.files_checked }} rule file(s). First hits: {{ outputs.assess.vars.violations_brief }}. A GitHub issue has been opened. Execution {{ execution.id }}."
          }
      - id: fail_gate
        type: io.kestra.plugin.core.execution.Fail
        description: Turn the execution red so the CI job or downstream flow gated on this run blocks the merge instead of passing quietly.
        errorMessage: "promtool lint gate found {{ outputs.assess.vars.violation_count }} violation(s) in {{ inputs.repository }} under {{ inputs.rules_dir }}: {{ outputs.assess.vars.violations_brief }}"
    else:
      - id: log_clean
        type: io.kestra.plugin.core.log.Log
        description: Record the clean lint so the execution history doubles as proof the rule definitions were checked.
        message: "promtool lint gate passed for {{ inputs.repository }}: {{ outputs.assess.vars.files_checked }} rule file(s) under {{ inputs.rules_dir }}, zero violations."

errors:
  - id: alert_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alert Slack when the lint itself breaks, because a dead gate is indistinguishable from a clean rules directory.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "FAILED {{ flow.id }} run {{ execution.id }}: the promtool lint gate could not assess {{ inputs.repository }}. Check the GITHUB_TOKEN secret, Docker access on the worker, and the rules_dir input."
      }

# --- 4. gate results for downstream flows ---
outputs:
  - id: verdict
    type: STRING
    description: Lint verdict, either pass or violations.
    value: "{{ outputs.assess.vars.verdict }}"
  - id: gate_passed
    type: BOOLEAN
    description: True when promtool reported zero violations, false when the gate escalated.
    value: "{{ outputs.assess.vars.gate_passed }}"
  - id: files_checked
    type: STRING
    description: Number of rule files checked by promtool, for example 12.
    value: "{{ outputs.assess.vars.files_checked }}"
  - id: violation_count
    type: STRING
    description: Number of violations found across the checked rule files, for example 3.
    value: "{{ outputs.assess.vars.violation_count }}"
  - id: lint_report
    type: STRING
    description: Full lint report as a JSON string with verdict, counts, and the violations list.
    value: "{{ outputs.assess.vars | toJson }}"

extend:
  title: Prometheus Alert Rule Linting Gate with promtool
  metaTitle: Lint Prometheus Alert Rules Before Merge with Kestra
  shortDescription: Check out a repository on every rules change, lint the Prometheus alert and recording rules with promtool inside a container, and escalate every violation as a GitHub issue, a Slack alert, and a failed gate.
  metaDescription: Lint Prometheus alert rules with promtool before merge. Escalate every violation as a GitHub issue, a Slack alert, and a failed Kestra execution.
  description: |
    Merge gates usually test application code and leave monitoring configuration to luck, so a broken alert expression only surfaces when the pager fails to fire. This blueprint lints the rules themselves. A keyed webhook fires when your CI sees the rules directory change, the repository is checked out into a shared working directory, and `promtool check rules` runs inside the official Prometheus image with every lint check enabled, alongside `promtool check config` when a `prometheus.yml` sits at the repository root. A Python step turns the raw promtool output into a violations list with the file, the rule, and the message for each hit, and a single branch decides whether the run goes quiet or loud. On any hit the flow opens a labeled GitHub issue with the full list, pings Slack with the first few entries, and fails the execution so the merge stays blocked.

    ## How it works

    1. The `on_rules_change` trigger (`io.kestra.plugin.core.trigger.Webhook`, guarded by the `RULES_WEBHOOK_KEY` secret) starts a run whenever your CI posts that files under the rules directory changed, and the `nightly_lint` `io.kestra.plugin.core.trigger.Schedule` trigger offers a daily cron that ships `disabled: true`.
    2. `workspace` (`io.kestra.plugin.core.flow.WorkingDirectory`) opens one shared filesystem for the checkout, the container, and the parser.
    3. `clone_repository` (`io.kestra.plugin.git.Clone`) checks out `{{ inputs.repository }}` at `{{ inputs.branch }}`, authenticating with `GITHUB_TOKEN`.
    4. `run_promtool` (`io.kestra.plugin.scripts.shell.Commands` on the `io.kestra.plugin.scripts.runner.docker.Docker` runner, image `prom/prometheus:v2.53.0`) finds every `yaml` and `yml` file under `{{ inputs.rules_dir }}`, writes the sorted list to `rules-manifest.txt`, runs `promtool check rules --lint=all` over that list, and appends `promtool check config --lint=all prometheus.yml` when the config file exists. Exit codes are absorbed with `|| true` so the task stays green and the parser, not promtool, decides the verdict. Both files are declared as `outputFiles`.
    5. `assess` (`io.kestra.plugin.scripts.python.Script` on the `io.kestra.plugin.core.runner.Process` runner) pulls those two files in through `inputFiles`, walks the `Checking` and `FAILED` blocks, and emits `verdict`, `gate_passed`, `files_checked`, `violation_count`, the `violations` list, `violations_markdown`, and `violations_brief` through the outputs protocol.
    6. `lint_gate` (`io.kestra.plugin.core.flow.If`) opens the escalation path when `violation_count` is above zero: `open_lint_issue` (`io.kestra.plugin.github.issues.Create`) files the markdown list under three labels, `alert_slack` posts the count and the first hits, and `fail_gate` (`io.kestra.plugin.core.execution.Fail`) turns the execution red.
    7. A clean run falls through to `log_clean` (`io.kestra.plugin.core.log.Log`), while the `errors` handler pings Slack whenever the checkout, the container, or the parser itself breaks.

    ## What you get

    - Alert rule syntax problems and lint findings caught in CI instead of during the next incident.
    - One violation entry per hit with the file, the rule name, and the message promtool printed.
    - A labeled GitHub issue that carries the whole list into the backlog engineers already work from.
    - A red execution that branch protections and downstream flow triggers can block on.
    - A quiet logged all-clear plus `verdict`, `gate_passed`, `files_checked`, `violation_count`, and a full `lint_report` for other flows.
    - A dated execution history that proves the rules directory was checked on every change.

    ## Who it's for

    - SRE and platform teams who own a Prometheus rules repository and review alert changes in pull requests.
    - Observability leads who want duplicate rules, template errors, and malformed PromQL caught before merge.
    - Platform engineers wiring monitoring configuration into the same gates they already apply to application code.

    ## Why orchestrate this with Kestra

    A `promtool` step in CI tells you a file failed, but it does not open the issue, tell the team, or give the gate a state anyone can query later. Kestra supplies the keyed event trigger, a hermetic container so the promtool version lives in the flow rather than in a runner image someone maintains, a branch that separates escalation from the all-clear, and routing into GitHub and Slack from one declarative file. Because the check runs as an execution, every lint carries inputs, outputs, and logs you can replay, and the same flow can be called as a subflow from any deploy pipeline that must not proceed with broken rules.

    ## Prerequisites

    - A worker with Docker access, since the lint runs inside the `prom/prometheus:v2.53.0` image.
    - A task working directory the container can write to, because that image runs as `nobody` and the manifest and report files are written there.
    - A GitHub repository whose rule files live under a directory of `yaml` files and that allows issue creation with the provided token.
    - Python 3 on the Kestra worker for the parser, or switch `assess` to a Docker task runner.
    - A CI job that POSTs to the webhook whenever the rules directory changes.

    ### Secrets

    - `GITHUB_TOKEN`: personal access token used both to clone the repository and to open the issue on violations.
    - `RULES_WEBHOOK_KEY`: key segment guarding the webhook URL, treat it like a password.
    - `SLACK_WEBHOOK_URL`: Slack incoming webhook used for violation and failure alerts.

    ## Quick start

    1. Add the three secrets under Namespace, Secrets, then set `repository` and `rules_dir` to match your project layout.
    2. Run the flow once by hand and read `verdict` plus `lint_report` from the Outputs tab to confirm promtool is checking the files you expect.
    3. Point your CI at the webhook so every rules change starts a check:

    ```yaml
    # webhook target to paste into CI
    https://your-kestra.example.com/api/v1/main/executions/webhook/company.team/prometheus-alert-rule-lint-gate/$RULES_WEBHOOK_KEY
    ```

    4. When you also want a nightly safety net, flip the schedule:

    ```yaml
    - id: nightly_lint
      type: io.kestra.plugin.core.trigger.Schedule
      cron: "0 5 * * *"
      disabled: false
    ```

    ## How to extend

    - Narrow the findings by changing `--lint=all` to `--lint=duplicate-rules`, or add `--lint-fatal` if you want promtool to stop at the first problem.
    - Move `promtool test rules` into the same container command so unit test expectations gate alongside syntax.
    - Lint several rules directories by overriding `rules_dir` per call or by looping over a list of paths.
    - Replace `open_lint_issue` with a pull request comment or a ticket in Jira or Linear, or chain a remediation flow from the FAILED state.
    - Reuse the verdict as a subflow in every deploy pipeline with `io.kestra.plugin.core.flow.Subflow`.

    ## Links

    - [Prometheus alerting rules documentation](https://prometheus.io/docs/prometheus/latest/configuration/alerting_rules/)
    - [promtool command line reference](https://prometheus.io/docs/prometheus/latest/command-line/promtool/)
    - [GitHub plugin documentation](https://kestra.io/plugins/plugin-github)
  tags:
    - Infrastructure
  subTags:
    - CI/CD & Deployment
    - Monitoring & Alerting
  ee: false
  demo: false
