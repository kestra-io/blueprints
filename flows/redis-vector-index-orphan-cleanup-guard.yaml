# Original workflow. Plugin interfaces referenced, no third-party source copied.
id: redis-vector-index-orphan-cleanup-guard
namespace: company.team
concurrency:
  limit: 1
  behavior: QUEUE
inputs:
- id: redis_host
  type: STRING
  defaults: localhost
  description: Redis 8 host reachable by workers.
- id: redis_port
  type: INT
  defaults: 6379
  description: Redis TCP port.
- id: redis_user
  type: STRING
  defaults: cleanup
  description: ACL user for audit and cleanup.
- id: redis_password
  type: SECRET
  defaults: "{{ secret('REDIS_PASSWORD') }}"
  description: Redis password. Never use a STRING input.
- id: vector_key
  type: STRING
  defaults: doc_embeddings
  description: One Redis 8 vector set. Not a Redis Stack search index.
- id: source_hash
  type: STRING
  defaults: source_documents
  description: 'Authoritative hash: exact element ID to document bytes.'
- id: element_prefix
  type: STRING
  defaults: 'doc:'
  description: Only matching element IDs are eligible.
- id: protected_ids
  type: ARRAY
  defaults: []
  description: Exact IDs never deleted even if their source is absent.
  itemType: STRING
- id: max_members
  type: INT
  defaults: 500
  description: Both vector and source cardinality must be at most this, range 1 to 2000.
- id: query_vector
  type: ARRAY
  defaults:
  - 1.0
  - 0.0
  - 0.0
  description: Search probe embedding matching the vector set dimension.
  itemType: FLOAT
- id: allow_empty_source
  type: BOOL
  defaults: false
  description: Explicit permission for a genuinely empty source, not an outage.
- id: writers_share_fence
  type: BOOL
  defaults: false
  description: Confirm every source/vector writer obeys the persistent lock protocol.
- id: docker_network
  type: STRING
  defaults: bridge
  description: Network used by the Redis CLI task runner.
- id: dry_run
  type: BOOL
  defaults: true
  description: Report findings without writes.
- id: auto_remediate
  type: BOOL
  defaults: false
  description: Allow cleanup only with dry_run false and explicit approval.
variables:
  redis_url: "redis://{{ inputs.redis_user | urlencode }}:{{ inputs.redis_password | urlencode }}@{{ inputs.redis_host }}:{{ inputs.redis_port }}/0"
  fence_key: "{{ inputs.vector_key ~ ':source-cleanup-lock' }}"
  audit_script: 'local cap=tonumber(ARGV[1]); local prefix=ARGV[2]; local protected=cjson.decode(ARGV[3]); local n=redis.call(''VCARD'',KEYS[1]); local s=redis.call(''HLEN'',KEYS[2]); if redis.call(''PTTL'',KEYS[1])>=0 or redis.call(''PTTL'',KEYS[2])>=0 then return redis.error_reply(''source and vector keys must not expire'') end; if n>cap or s>cap then return redis.error_reply(''inventory exceeds max_members'') end; if s==0 and ARGV[4]~=''true'' then return redis.error_reply(''empty source refused'') end; local fields=redis.call(''HKEYS'',KEYS[2]); for _,field in ipairs(fields) do if redis.call(''HPTTL'',KEYS[2],''FIELDS'',1,field)[1]>=0 then return redis.error_reply(''source fields must not expire'') end end; local members=redis.call(''VRANDMEMBER'',KEYS[1],cap+1); local candidates={}; local kept=0; if #members~=n then return redis.error_reply(''incomplete vector inventory'') end; for _,id in ipairs(members) do if #id>256 or string.find(id,string.char(123,123),1,true) or string.find(id,''%c'') then return redis.error_reply(''unsafe element id'') end; local protect=false; for _,p in ipairs(protected) do if id==p then protect=true end end; if string.sub(id,1,#prefix)==prefix and not protect and redis.call(''HEXISTS'',KEYS[2],id)==0 then table.insert(candidates,id) else kept=kept+1 end; end; table.sort(candidates); local encoded=cjson.encode({vectors=n,sources=s,candidates=candidates,protected=kept}); return (string.gsub(encoded,''.'',function(c) return string.format(''%02x'',string.byte(c)) end))'
  eligibility_script: if redis.call('GET',KEYS[3])~=ARGV[1] or redis.call('PTTL',KEYS[3])~=-1 then return redis.error_reply('persistent fence lost') end; return redis.call('HEXISTS',KEYS[2],ARGV[2])==0 and redis.call('VEMB',KEYS[1],ARGV[2])~=false and 1 or 0
  release_script: if redis.call('GET',KEYS[1])~=ARGV[1] then return redis.error_reply('fence ownership changed') end; return redis.call('DEL',KEYS[1])
tasks:
- id: validate_inputs
  type: io.kestra.plugin.core.execution.Assert
  conditions:
  - "{{ inputs.max_members >= 1 and inputs.max_members <= 2000 }}"
  - "{{ inputs.redis_port >= 1 and inputs.redis_port <= 65535 }}"
  - "{{ inputs.vector_key != inputs.source_hash and inputs.source_hash != inputs.vector_key ~ ':source-cleanup-lock' }}"
  - "{{ inputs.vector_key | length > 0 and inputs.vector_key | length <= 128 }}"
  - "{{ inputs.source_hash | length > 0 and inputs.source_hash | length <= 128 }}"
  - "{{ inputs.vector_key | replace({'[A-Za-z0-9:_-]': ''}, regexp=true) | length == 0 }}"
  - "{{ inputs.source_hash | replace({'[A-Za-z0-9:_-]': ''}, regexp=true) | length == 0 }}"
  - "{{ inputs.element_prefix | length > 0 and inputs.element_prefix | length <= 128 }}"
  - "{{ inputs.protected_ids | length <= inputs.max_members }}"
  - "{{ inputs.query_vector | length > 0 and inputs.query_vector | length <= 4096 }}"
- id: audit_members
  type: io.kestra.plugin.redis.cli.RedisCLI
  host: "{{ inputs.redis_host }}"
  port: "{{ inputs.redis_port }}"
  username: "{{ inputs.redis_user }}"
  password: "{{ inputs.redis_password }}"
  containerImage: redis@sha256:4d25e2fe601f7ffaeb4437cb6ced3518bc36edf34ebe98863c80836943d94529
  jsonOutput: false
  timeout: PT30S
  taskRunner:
    type: io.kestra.plugin.scripts.runner.docker.Docker
    networkMode: "{{ inputs.docker_network }}"
    memory:
      memory: 128MB
    cpu:
      cpus: 0.25
  commands:
  - "{{ 'EVAL_RO ' ~ (vars.audit_script | toJson) ~ ' 2 ' ~ (inputs.vector_key | toJson) ~ ' ' ~ (inputs.source_hash | toJson) ~ ' ' ~ inputs.max_members ~ ' ' ~ (inputs.element_prefix | toJson) ~ ' ' ~ (inputs.protected_ids | toJson | toJson) ~ ' ' ~ inputs.allow_empty_source }}"
- id: audit_members_decoded
  type: io.kestra.plugin.scripts.python.Script
  containerImage: python@sha256:a6e34c598f2467ed0e9a8d349809fcd8b5c603269512df273a0bb1784edc11b1
  timeout: PT30S
  taskRunner:
    type: io.kestra.plugin.scripts.runner.docker.Docker
    networkMode: none
    memory:
      memory: 128MB
    cpu:
      cpus: 0.25
  inputFiles:
    audit.txt: "{{ outputs.audit_members.vars.command_1 }}"
  script: |
    import json
    from pathlib import Path
    raw=Path('audit.txt').read_text().strip()
    if len(raw)>2000000:
        raise ValueError('audit payload exceeds byte limit')
    if not raw or any(c not in '0123456789abcdef' for c in raw):
        raise ValueError('Redis audit refused or failed: '+raw[:300])
    data=json.loads(bytes.fromhex(raw))
    ids=data['candidates']
    if ids=={}:
        ids=[]
    if not isinstance(ids,list) or any(not isinstance(x,str) for x in ids):
        raise ValueError('invalid audit candidates')
    print('::'+json.dumps({'outputs':{'candidates':ids,'vectors':data['vectors'],'sources':data['sources']}})+'::')
- id: plan
  type: io.kestra.plugin.core.output.OutputValues
  values:
    candidates: "{{ outputs.audit_members_decoded.vars.candidates | toJson }}"
    owner: "{{ execution.id }}"
- id: search_before
  type: io.kestra.plugin.redis.vector.Similarity
  url: "{{ render(vars.redis_url) }}"
  key: "{{ inputs.vector_key }}"
  vector: "{{ inputs.query_vector }}"
  count: 10
  timeout: PT30S
- id: summary
  type: io.kestra.plugin.core.log.Log
  message: "Source-orphan candidates: {{ fromJson(outputs.plan.values.candidates) | length }}. Vector members: {{ outputs.audit_members_decoded.vars.vectors }}. Source documents: {{ outputs.audit_members_decoded.vars.sources }}."
- id: has_orphans
  type: io.kestra.plugin.core.flow.If
  condition: "{{ fromJson(outputs.plan.values.candidates) | length > 0 }}"
  then:
  - id: live_mode
    type: io.kestra.plugin.core.flow.If
    condition: "{{ inputs.auto_remediate and not inputs.dry_run }}"
    then:
    - id: approval
      type: io.kestra.plugin.core.flow.Pause
      timeout: PT1H
      onResume:
      - id: approved
        type: BOOL
        defaults: false
        description: Delete the listed source-orphan embeddings?
    - id: approved_gate
      type: io.kestra.plugin.core.flow.If
      condition: "{{ outputs.approval.onResume.approved ?? false }}"
      then:
      - id: require_writer_contract
        type: io.kestra.plugin.core.execution.Assert
        conditions:
        - "{{ inputs.writers_share_fence }}"
      - id: acquire_fence
        type: io.kestra.plugin.redis.string.Set
        url: "{{ render(vars.redis_url) }}"
        key: "{{ render(vars.fence_key) }}"
        value: "{{ execution.id }}"
        serdeType: STRING
        options:
          mustNotExist: true
        timeout: PT30S
      - id: read_fence
        type: io.kestra.plugin.redis.string.Get
        url: "{{ render(vars.redis_url) }}"
        key: "{{ render(vars.fence_key) }}"
        serdeType: STRING
        timeout: PT30S
      - id: require_fence
        type: io.kestra.plugin.core.execution.Assert
        conditions:
        - "{{ outputs.read_fence.data == execution.id }}"
      - id: require_persistent_fence
        type: io.kestra.plugin.redis.cli.RedisCLI
        host: "{{ inputs.redis_host }}"
        port: "{{ inputs.redis_port }}"
        username: "{{ inputs.redis_user }}"
        password: "{{ inputs.redis_password }}"
        containerImage: redis@sha256:4d25e2fe601f7ffaeb4437cb6ced3518bc36edf34ebe98863c80836943d94529
        jsonOutput: true
        timeout: PT30S
        taskRunner:
          type: io.kestra.plugin.scripts.runner.docker.Docker
          networkMode: "{{ inputs.docker_network }}"
          memory:
            memory: 128MB
          cpu:
            cpus: 0.25
        commands:
        - "{{ 'PTTL ' ~ (render(vars.fence_key) | toJson) }}"
      - id: require_no_expiry
        type: io.kestra.plugin.core.execution.Assert
        conditions:
        - "{{ fromJson(outputs.require_persistent_fence.vars.command_1) == -1 }}"
      - id: audit_under_fence
        type: io.kestra.plugin.redis.cli.RedisCLI
        host: "{{ inputs.redis_host }}"
        port: "{{ inputs.redis_port }}"
        username: "{{ inputs.redis_user }}"
        password: "{{ inputs.redis_password }}"
        containerImage: redis@sha256:4d25e2fe601f7ffaeb4437cb6ced3518bc36edf34ebe98863c80836943d94529
        jsonOutput: false
        timeout: PT30S
        taskRunner:
          type: io.kestra.plugin.scripts.runner.docker.Docker
          networkMode: "{{ inputs.docker_network }}"
          memory:
            memory: 128MB
          cpu:
            cpus: 0.25
        commands:
        - "{{ 'EVAL_RO ' ~ (vars.audit_script | toJson) ~ ' 2 ' ~ (inputs.vector_key | toJson) ~ ' ' ~ (inputs.source_hash | toJson) ~ ' ' ~ inputs.max_members ~ ' ' ~ (inputs.element_prefix | toJson) ~ ' ' ~ (inputs.protected_ids | toJson | toJson) ~ ' ' ~ inputs.allow_empty_source }}"
      - id: audit_under_fence_decoded
        type: io.kestra.plugin.scripts.python.Script
        containerImage: python@sha256:a6e34c598f2467ed0e9a8d349809fcd8b5c603269512df273a0bb1784edc11b1
        timeout: PT30S
        taskRunner:
          type: io.kestra.plugin.scripts.runner.docker.Docker
          networkMode: none
          memory:
            memory: 128MB
          cpu:
            cpus: 0.25
        inputFiles:
          audit.txt: "{{ outputs.audit_under_fence.vars.command_1 }}"
        script: |
          import json
          from pathlib import Path
          raw=Path('audit.txt').read_text().strip()
          if len(raw)>2000000:
              raise ValueError('audit payload exceeds byte limit')
          if not raw or any(c not in '0123456789abcdef' for c in raw):
              raise ValueError('Redis audit refused or failed: '+raw[:300])
          data=json.loads(bytes.fromhex(raw))
          ids=data['candidates']
          if ids=={}:
              ids=[]
          if not isinstance(ids,list) or any(not isinstance(x,str) for x in ids):
              raise ValueError('invalid audit candidates')
          print('::'+json.dumps({'outputs':{'candidates':ids,'vectors':data['vectors'],'sources':data['sources']}})+'::')
      - id: delete_orphans
        type: io.kestra.plugin.core.flow.Loop
        concurrencyLimit: 1
        values: "{{ outputs.plan.values.candidates }}"
        tasks:
        - id: eligibility
          type: io.kestra.plugin.redis.cli.RedisCLI
          host: "{{ inputs.redis_host }}"
          port: "{{ inputs.redis_port }}"
          username: "{{ inputs.redis_user }}"
          password: "{{ inputs.redis_password }}"
          containerImage: redis@sha256:4d25e2fe601f7ffaeb4437cb6ced3518bc36edf34ebe98863c80836943d94529
          jsonOutput: true
          timeout: PT30S
          taskRunner:
            type: io.kestra.plugin.scripts.runner.docker.Docker
            networkMode: "{{ inputs.docker_network }}"
            memory:
              memory: 128MB
            cpu:
              cpus: 0.25
          commands:
          - "{{ 'EVAL_RO ' ~ (vars.eligibility_script | toJson) ~ ' 3 ' ~ (inputs.vector_key | toJson) ~ ' ' ~ (inputs.source_hash | toJson) ~ ' ' ~ (render(vars.fence_key) | toJson) ~ ' ' ~ (outputs.plan.values.owner | toJson) ~ ' ' ~ (item.value | toJson) }}"
        - id: eligible
          type: io.kestra.plugin.core.flow.If
          condition: "{{ fromJson(outputs.eligibility.vars.command_1) == 1 }}"
          then:
          - id: remove_element
            type: io.kestra.plugin.redis.vector.Delete
            url: "{{ render(vars.redis_url) }}"
            key: "{{ inputs.vector_key }}"
            elements:
            - "{{ item.value }}"
            failedOnMissing: false
            timeout: PT30S
          else:
          - id: skip_changed
            type: io.kestra.plugin.core.log.Log
            message: Candidate is no longer source-orphaned or was already removed. Skipped.
      - id: audit_after
        type: io.kestra.plugin.redis.cli.RedisCLI
        host: "{{ inputs.redis_host }}"
        port: "{{ inputs.redis_port }}"
        username: "{{ inputs.redis_user }}"
        password: "{{ inputs.redis_password }}"
        containerImage: redis@sha256:4d25e2fe601f7ffaeb4437cb6ced3518bc36edf34ebe98863c80836943d94529
        jsonOutput: false
        timeout: PT30S
        taskRunner:
          type: io.kestra.plugin.scripts.runner.docker.Docker
          networkMode: "{{ inputs.docker_network }}"
          memory:
            memory: 128MB
          cpu:
            cpus: 0.25
        commands:
        - "{{ 'EVAL_RO ' ~ (vars.audit_script | toJson) ~ ' 2 ' ~ (inputs.vector_key | toJson) ~ ' ' ~ (inputs.source_hash | toJson) ~ ' ' ~ inputs.max_members ~ ' ' ~ (inputs.element_prefix | toJson) ~ ' ' ~ (inputs.protected_ids | toJson | toJson) ~ ' ' ~ inputs.allow_empty_source }}"
      - id: audit_after_decoded
        type: io.kestra.plugin.scripts.python.Script
        containerImage: python@sha256:a6e34c598f2467ed0e9a8d349809fcd8b5c603269512df273a0bb1784edc11b1
        timeout: PT30S
        taskRunner:
          type: io.kestra.plugin.scripts.runner.docker.Docker
          networkMode: none
          memory:
            memory: 128MB
          cpu:
            cpus: 0.25
        inputFiles:
          audit.txt: "{{ outputs.audit_after.vars.command_1 }}"
        script: |
          import json
          from pathlib import Path
          raw=Path('audit.txt').read_text().strip()
          if len(raw)>2000000:
              raise ValueError('audit payload exceeds byte limit')
          if not raw or any(c not in '0123456789abcdef' for c in raw):
              raise ValueError('Redis audit refused or failed: '+raw[:300])
          data=json.loads(bytes.fromhex(raw))
          ids=data['candidates']
          if ids=={}:
              ids=[]
          if not isinstance(ids,list) or any(not isinstance(x,str) for x in ids):
              raise ValueError('invalid audit candidates')
          print('::'+json.dumps({'outputs':{'candidates':ids,'vectors':data['vectors'],'sources':data['sources']}})+'::')
      - id: after_plan
        type: io.kestra.plugin.core.output.OutputValues
        values:
          remaining: "{{ outputs.audit_after_decoded.vars.candidates | toJson }}"
      - id: require_no_orphans
        type: io.kestra.plugin.core.execution.Assert
        conditions:
        - "{{ fromJson(outputs.after_plan.values.remaining) | length == 0 }}"
      - id: search_after
        type: io.kestra.plugin.redis.vector.Similarity
        url: "{{ render(vars.redis_url) }}"
        key: "{{ inputs.vector_key }}"
        vector: "{{ inputs.query_vector }}"
        count: 10
        timeout: PT30S
      - id: release_fence
        type: io.kestra.plugin.redis.cli.RedisCLI
        host: "{{ inputs.redis_host }}"
        port: "{{ inputs.redis_port }}"
        username: "{{ inputs.redis_user }}"
        password: "{{ inputs.redis_password }}"
        containerImage: redis@sha256:4d25e2fe601f7ffaeb4437cb6ced3518bc36edf34ebe98863c80836943d94529
        jsonOutput: true
        timeout: PT30S
        taskRunner:
          type: io.kestra.plugin.scripts.runner.docker.Docker
          networkMode: "{{ inputs.docker_network }}"
          memory:
            memory: 128MB
          cpu:
            cpus: 0.25
        commands:
        - "{{ 'EVAL ' ~ (vars.release_script | toJson) ~ ' 1 ' ~ (render(vars.fence_key) | toJson) ~ ' ' ~ (execution.id | toJson) }}"
      - id: require_released
        type: io.kestra.plugin.core.execution.Assert
        conditions:
        - "{{ fromJson(outputs.release_fence.vars.command_1) == 1 }}"
      - id: recovered
        type: io.kestra.plugin.core.log.Log
        message: "Fresh complete membership audit found no eligible source-orphan embeddings. The persistent writer fence was released. Search sample: {{ outputs.search_after.matches | length }} hits."
      else:
      - id: declined
        type: io.kestra.plugin.core.log.Log
        message: Approval declined. No Redis write was attempted.
    else:
    - id: observation
      type: io.kestra.plugin.core.log.Log
      message: Observation mode. No Redis write was attempted.
  else:
  - id: healthy
    type: io.kestra.plugin.core.log.Log
    message: No eligible source-orphan embeddings found.
errors:
- id: failure_alert
  type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
  url: "{{ secret('SLACK_WEBHOOK_URL') }}"
  payload: "{{ {'text':'Redis vector cleanup failed in execution ' ~ execution.id ~ '. Inspect remaining orphans and any persistent writer fence before recovery.'} | toJson }}"
triggers:
- id: daily_audit
  type: io.kestra.plugin.core.trigger.Schedule
  cron: 0 3 * * *
  disabled: true
  inputs:
    dry_run: true
    auto_remediate: false
extend:
  title: Remove Redis vector hits whose source document is gone
  shortDescription: Find source-orphan embeddings, approve bounded deletion under a persistent writer fence then verify vector membership.
  metaTitle: Remove orphan Redis vector embeddings with Kestra
  metaDescription: Audit Redis vector IDs against source documents, approve bounded cleanup under a shared writer fence then fail if eligible orphans remain.
  description: |
    ## How it works
    The flow compares vector element IDs with field names in an authoritative Redis hash. An absent field is an orphan; an empty value is present. RedisCLI uses bounded EVAL_RO because no hash or vector-inventory task exists. Quote-free hex avoids the plugin's JSON escaping defect; a network-disabled task decodes it. Native Similarity samples search.
  
    Live mode requires both flags, explicit approval and a shared writer-fence contract. Native SET NX creates a persistent lock named vector_key plus :source-cleanup-lock. Every source and vector writer must acquire this same lock and hold it until its commands finish. The flow verifies ownership, rereads each candidate under that lock then calls native vector.Delete one ID at a time. Restored sources and already removed IDs are skipped. A complete membership recheck must find zero eligible orphans. A second Similarity sample shows current hits. Token-checked Lua release is used because the plugin has no compare-and-delete lock task.
  
    ## What you get
    A bounded orphan plan and explicit approval before destructive work. Live sources, protected IDs and IDs outside the prefix are spared. Source document bytes are never modified. A failed deletion or newly arriving orphan fails verification instead of producing a recovery message.
  
    ## Who it's for
    Teams storing documents in a Redis hash and embeddings in a Redis 8 vector set whose reader cannot resolve deleted-source search hits.
  
    ## Why orchestrate this with Kestra
    Kestra records approval and recovery. Flow concurrency covers this flow only; the Redis fence coordinates cooperative writers.
  
    ## Tested end to end
    52 cases passed 506 assertions on stock Kestra 2.0.6, 2.0.5 and fresh Redis 8.6.3. Source deletion left two unresolved hits; cleanup left zero and preserved 34 source bytes. Refused writes failed. Restored sources survived.
  
    ## Prerequisites
    Redis 8 vector sets, not Redis Stack search indexes. Hash fields equal element IDs. Source keys, fields and vector keys must not expire. All writers must share the persistent lock. Never evict or remove a live lock. Disable eviction and configure durable persistence. Administrators that bypass it remain outside this guarantee.
  
    ### Secrets
    REDIS_PASSWORD is a SECRET input. SLACK_WEBHOOK_URL serves errors. The ACL user needs GET, SET and DEL for the exact fence; HLEN, HKEYS, HPTTL and HEXISTS on the source hash; VCARD, VRANDMEMBER, VEMB, VSIM and VREM on the vector key; PTTL, EVAL_RO and EVAL for those keys. No source writes or other indexes are needed.
  
    ### Inputs
    Set the Redis connection, vector_key, source_hash and nonempty element_prefix. Key names allow ASCII letters, digits, colon, underscore and hyphen. Element IDs allow UTF-8 up to 256 bytes, excluding controls and template delimiters. protected_ids lists exact exclusions. max_members bounds each inventory from 1 to 2000. query_vector must match the dimension. docker_network selects connectivity. Defaults are dry_run true, auto_remediate false, writers_share_fence false and allow_empty_source false.
  
    ## Quick start
    1. Configure secrets and source/index inputs. Run the safe defaults and inspect the candidate count.
    2. Implement the shared persistent fence in every writer. Run live mode, review IDs and explicitly approve.
    3. Require the recovered message. For a retained lock, confirm its owning execution and pending Redis commands have stopped. Compare its token before deleting it then rerun. Completed deletions are idempotent. Never expire or steal a live lock.
    4. Enable the disabled daily schedule only after checking its safe-mode inputs.
  
    ## How to extend
    Send the plan to an approval channel or archive audit receipts. Keep the source contract unchanged when adding triggers.
  
    Limits: one Redis database and one bounded vector set. No source backfill, re-embedding or graph repair. Protected missing-source hits may remain intentionally. Search is a sample; complete membership is the recovery gate. Locking is cooperative and cleanup failures may block writers until manual recovery.
  
    ## Links
    - [Redis VREM](https://redis.io/docs/latest/commands/vrem/)
    - [Redis VRANDMEMBER](https://redis.io/docs/latest/commands/vrandmember/)
    - [Kestra Redis plugin](https://kestra.io/plugins/plugin-redis)
  
    This blueprint was created by [zkasuran](https://github.com/zkasuran).
  tags:
  - Data
  - AI
  subTags:
  - Vector Stores & RAG
  - Day 2 Operations
  ee: false
  demo: false
