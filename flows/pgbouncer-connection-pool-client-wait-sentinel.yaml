id: pgbouncer-connection-pool-client-wait-sentinel
namespace: company.database

description: |
  Audits PgBouncer connection pool saturation to detect queued waiting clients, transaction pool exhaustion, and slow server connection checkout times.

concurrency:
  limit: 1

inputs:
  - id: pgbouncer_host
    type: STRING
    displayName: "PgBouncer Host"
    defaults: "pgbouncer.internal"
    description: "Hostname or IP address of the PgBouncer pooler instance."

  - id: pgbouncer_port
    type: INT
    displayName: "PgBouncer Port"
    defaults: 6432
    description: "Administrative listening port configured on PgBouncer."

  - id: target_database
    type: STRING
    displayName: "Audited Database Name"
    defaults: "production_db"
    description: "Database pool name to inspect for client wait queues."

  - id: max_waiting_clients_threshold
    type: INT
    displayName: "Max Waiting Clients"
    defaults: 15
    description: "Maximum allowable clients trapped in cl_waiting state before dispatching incident alerts."

triggers:
  - id: scheduled_check
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/5 * * * *"
    disabled: true

tasks:
  - id: probe_pgbouncer_pools
    type: io.kestra.plugin.scripts.shell.Commands
    containerImage: postgres:16-alpine
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    env:
      PGHOST: "{{ inputs.pgbouncer_host }}"
      PGPORT: "{{ inputs.pgbouncer_port }}"
      PGDATABASE: "pgbouncer"
      PGUSER: "pgbouncer_admin"
      PGPASSWORD: "{{ secret('PGBOUNCER_ADMIN_PASSWORD') }}"
      TARGET_DB: "{{ inputs.target_database }}"
      MAX_WAITING: "{{ inputs.max_waiting_clients_threshold }}"
    commands:
      - |
        # Connect to PgBouncer admin database and query SHOW POOLS
        POOL_ROW=$(psql -t -A -F"," -c "SHOW POOLS;" 2>/dev/null | grep "^$TARGET_DB," | head -n 1)

        if [ -z "$POOL_ROW" ]; then
          # Fallback check if pools exist
          POOL_COUNT=$(psql -t -A -c "SHOW POOLS;" 2>/dev/null | wc -l)
          if [ "$POOL_COUNT" -eq 0 ]; then
            echo "Failed to connect to PgBouncer admin interface at $PGHOST:$PGPORT" >&2
            exit 1
          fi
          # Default zero metrics if database has no active pool yet
          CL_ACTIVE=0
          CL_WAITING=0
          SV_ACTIVE=0
          SV_IDLE=0
          MAXWAIT=0
        else
          # PgBouncer SHOW POOLS format: database, user, cl_active, cl_waiting, sv_active, sv_idle, sv_used, sv_tested, sv_login, maxwait, maxwait_us, pool_mode
          CL_ACTIVE=$(echo "$POOL_ROW" | cut -d',' -f3)
          CL_WAITING=$(echo "$POOL_ROW" | cut -d',' -f4)
          SV_ACTIVE=$(echo "$POOL_ROW" | cut -d',' -f5)
          SV_IDLE=$(echo "$POOL_ROW" | cut -d',' -f6)
          MAXWAIT=$(echo "$POOL_ROW" | cut -d',' -f10)
        fi

        IS_ALERT=false
        if [ "$CL_WAITING" -ge "$MAX_WAITING" ]; then
          IS_ALERT=true
        fi

        cat <<EOF > output.json
        {
          "database": "$TARGET_DB",
          "cl_active": $CL_ACTIVE,
          "cl_waiting": $CL_WAITING,
          "sv_active": $SV_ACTIVE,
          "sv_idle": $SV_IDLE,
          "maxwait_sec": $MAXWAIT,
          "is_alert": $IS_ALERT
        }
        EOF

    outputFiles:
      - output.json

  - id: evaluate_pool_saturation
    type: io.kestra.plugin.core.flow.If
    condition: "{{ json(read(outputs.probe_pgbouncer_pools.outputFiles['output.json'])).is_alert }}"
    then:
      - id: notify_slack_pool_exhausted
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#dba-alerts",
            "text": "🚨 *PgBouncer Connection Pool Saturation: `{{ inputs.target_database }}`*\n- *Waiting Clients*: `{{ json(read(outputs.probe_pgbouncer_pools.outputFiles['output.json'])).cl_waiting }}` (Threshold: {{ inputs.max_waiting_clients_threshold }})\n- *Active Clients*: `{{ json(read(outputs.probe_pgbouncer_pools.outputFiles['output.json'])).cl_active }}`\n- *Server Active*: `{{ json(read(outputs.probe_pgbouncer_pools.outputFiles['output.json'])).sv_active }}`\n- *Max Wait Time*: `{{ json(read(outputs.probe_pgbouncer_pools.outputFiles['output.json'])).maxwait_sec }}s`\n- *Action*: Database pool exhausted. Check for slow locking queries or increase default_pool_size."
          }

errors:
  - id: notify_pgbouncer_probe_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#dba-alerts",
        "text": "❌ *PgBouncer Connection Sentinel Probe Failed on `{{ inputs.pgbouncer_host }}`*"
      }

extend:
  title: PgBouncer Connection Pool Waiting Clients Sentinel
  shortDescription: Audits PgBouncer administrative pools to catch queued client connection backlogs and database pool exhaustion before application timeouts occur.
  description: |
    Audits PgBouncer connection pool saturation to detect queued waiting clients, transaction pool exhaustion, and slow server connection checkout times.

    ## How it works
    1. A high-frequency schedule or manual run connects to the administrative `pgbouncer` pseudo-database using standard PostgreSQL client tools.
    2. Runs the native `SHOW POOLS;` command to query real-time pool metrics including active clients, waiting clients, and server pool utilization.
    3. Evaluates whether `cl_waiting` exceeds the safe threshold, signaling that client requests are queuing because all database backend connections are saturated.
    4. Automatically dispatches an incident payload to Slack with exact connection pool counts and longest client wait times.

    ## What you get
    - Immediate detection of database connection starvations before API gateways return HTTP 504 Gateway Timeouts.
    - Zero impact on production tables by querying the internal PgBouncer administrative memory buffer.
    - Actionable metrics indicating whether the bottleneck is lack of server connections or slow transaction durations.

    ## Who it's for
    - Database Administrators (DBAs) managing PostgreSQL connection pooling architectures.
    - Backend Engineers debugging intermittent API connection pool acquisition timeouts.
    - Site Reliability Engineers safeguarding database cluster availability during high-traffic spikes.

    ## Why orchestrate this with Kestra
    - Operates independently of database application servers with zero code modifications.
    - Keeps sensitive administrative credentials encrypted within Kestra namespace secrets.
    - Can be extended to run automatic diagnostic queries against `pg_stat_activity` to pinpoint blocking locks.

    ## Prerequisites
    - PgBouncer deployed with admin user access enabled (`admin_users = pgbouncer_admin`).
    - Network route allowing Kestra workers to reach PgBouncer administrative port (default 6432).
    - `PGBOUNCER_ADMIN_PASSWORD` and `SLACK_WEBHOOK` stored in Kestra secrets.

    ## Quick start
    1. Import this blueprint into your Kestra instance.
    2. Add `PGBOUNCER_ADMIN_PASSWORD` and `SLACK_WEBHOOK` to your namespace secrets.
    3. Configure `pgbouncer_host`, `pgbouncer_port`, and `target_database`.
    4. Trigger a test execution to verify administrative pool metrics capture.
    5. Enable the schedule trigger for continuous pool surveillance.

    ## How to extend
    - Chain a task that executes `SHOW STATS;` or `SHOW CLIENTS;` to identify the specific client IPs causing connection exhaustion.
    - Integrate with PagerDuty for critical multi-minute pool lockups.
    - Automatically scale PgBouncer container replicas in Kubernetes upon sustained client queuing.

    ## Links
    - [PgBouncer Official Documentation](https://www.pgbouncer.org/)
    - [PgBouncer SHOW Commands Reference](https://www.pgbouncer.org/usage.html)
    - [Kestra Slack Notification Plugin](https://kestra.io/plugins/plugin-slack)
  tags:
    - Data
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - Databases
  ee: false
  demo: false
