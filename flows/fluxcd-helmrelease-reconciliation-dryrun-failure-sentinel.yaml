    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
    - [FluxCD Official Documentation](https://fluxcd.io/)
    - [FluxCD Helm Controller Architecture and CRD Guide](https://fluxcd.io/flux/components/helm/)
    - [FluxCD Monitoring and Prometheus Metrics Reference](https://fluxcd.io/flux/cheatsheets/monitoring/)
