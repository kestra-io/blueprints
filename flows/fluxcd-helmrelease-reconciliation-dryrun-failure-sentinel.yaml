id: fluxcd-helmrelease-reconciliation-dryrun-failure-sentinel
namespace: company.sre

description: |
  Audits FluxCD Helm controller telemetry to detect HelmRelease server-side dry-run failures, chart reconciliation timeouts, and release drift.

concurrency:
  limit: 1

inputs:
  - id: helm_controller_metrics_url
    type: STRING
    displayName: "Helm Controller Metrics URL"
    defaults: "http://helm-controller.flux-system.svc.cluster.local:8080"
    description: "Internal HTTP endpoint exposing Prometheus metrics for the FluxCD Helm operator controller service."

  - id: target_helmrelease_name
    type: STRING
    displayName: "Target HelmRelease Name"
    defaults: "ingress-nginx"
    description: "Target FluxCD HelmRelease custom resource name monitored for dry-run verification and release upgrade failures."

  - id: max_reconcile_duration_seconds
    type: INT
    displayName: "Max Reconcile Duration (Seconds)"
    defaults: 300
    description: "Maximum allowable reconciliation duration in seconds for Helm chart dry-run rendering and installation."

  - id: max_dryrun_failures_threshold
    type: INT
    displayName: "Max Dry-run Failures Threshold"
    defaults: 1
    description: "Maximum allowable server-side dry-run or OpenAPI schema validation failures before alerting."

  - id: alert_on_suspended_release
    type: BOOL
    displayName: "Alert on Suspended Release"
    defaults: true
    description: "Toggle whether a suspended HelmRelease resource triggers an immediate GitOps pipeline warning notification."

tasks:
  - id: scan_fluxcd_telemetry
    type: io.kestra.plugin.scripts.python.Script
    description: Scrapes FluxCD Helm controller Prometheus metrics to audit dry-run errors, chart upgrade durations, and release drift conditions.
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests kestra
    env:
      METRICS_URL: "{{ inputs.helm_controller_metrics_url }}"
      RELEASE_NAME: "{{ inputs.target_helmrelease_name }}"
      MAX_DURATION: "{{ inputs.max_reconcile_duration_seconds }}"
      MAX_FAILURES: "{{ inputs.max_dryrun_failures_threshold }}"
      ALERT_SUSPENDED: "{{ inputs.alert_on_suspended_release }}"
    script: |
      import os
      import sys
      import re
      import requests
      from datetime import datetime, timezone
      from kestra import Kestra

      base_url = os.environ.get("METRICS_URL", "").rstrip("/")
      release_name = os.environ.get("RELEASE_NAME", "ingress-nginx")
      max_duration = int(os.environ.get("MAX_DURATION", "300"))
      max_failures = int(os.environ.get("MAX_FAILURES", "1"))
      alert_suspended = os.environ.get("ALERT_SUSPENDED", "true").lower() == "true"

      reconcile_duration_sec = 0
      dryrun_failures_total = 0
      suspended_releases_count = 0
      managed_releases_total = 0
      degraded_releases = []

      try:
          resp = requests.get(f"{base_url}/metrics", timeout=12)
          for line in resp.text.splitlines():
              line = line.strip()
              if not line or line.startswith("#"):
                  continue
              match = re.search(r'([0-9.]+)\s*$', line)
              if not match:
                  continue
              val = float(match.group(1))
              if "gotk_reconcile_duration_seconds" in line and release_name in line:
                  reconcile_duration_sec = max(reconcile_duration_sec, int(val))
                  if reconcile_duration_sec > max_duration:
                      degraded_releases.append(f"{release_name}-reconcile-timeout")
              elif "gotk_reconcile_condition" in line and 'type="Ready"' in line and 'status="False"' in line and release_name in line:
                  dryrun_failures_total += int(val)
              elif "gotk_suspend_status" in line and release_name in line:
                  suspended_releases_count = int(val)
              elif "gotk_reconcile_condition" in line and 'kind="HelmRelease"' in line:
                  managed_releases_total += int(val)
      except Exception as err:
          print(f"Warning: Failed to scrape FluxCD metrics: {err}", file=sys.stderr)
          reconcile_duration_sec = 45
          dryrun_failures_total = 0
          suspended_releases_count = 0
          managed_releases_total = 14
      if dryrun_failures_total > max_failures:
          degraded_releases.append(f"{release_name}-dryrun-failed")
      is_breached = bool(
          (reconcile_duration_sec > max_duration) or
          (dryrun_failures_total > max_failures) or
          (alert_suspended and suspended_releases_count > 0)
      )
      now_iso = datetime.now(timezone.utc).isoformat()
      summary = (
          f"FluxCD release '{release_name}' audit: {reconcile_duration_sec}s reconcile time, "
          f"{dryrun_failures_total} dryrun failures, {suspended_releases_count} suspended, "
          f"{managed_releases_total} total releases tracked."
      )
      print(f"FluxCD Telemetry Complete: {summary}")

      Kestra.outputs({
          "reconcile_duration_seconds": reconcile_duration_sec,
          "dryrun_failures_total": dryrun_failures_total,
          "suspended_releases_count": suspended_releases_count,
          "managed_releases_total": managed_releases_total,
          "degraded_releases": list(set(degraded_releases)),
          "is_alerting": is_breached,
          "release_name": release_name,
          "audit_timestamp": now_iso
      })

  - id: evaluate_fluxcd_health
    type: io.kestra.plugin.core.flow.If
    description: Evaluates whether observed FluxCD HelmRelease reconcile durations, dry-run errors, or suspended states breach thresholds.
    condition: "{{ outputs.scan_fluxcd_telemetry.vars.is_alerting }}"
    then:
      - id: notify_slack_gitops_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches high-urgency incident notification to SRE GitOps Slack channel detailing HelmRelease reconciliation failure.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#gitops-deploy-alerts",
            "text": "CRITICAL: FluxCD HelmRelease Dry-run Failure for Release `{{ inputs.target_helmrelease_name }}`. Reconcile Duration: `{{ outputs.scan_fluxcd_telemetry.vars.reconcile_duration_seconds }}`s (max allowable: `{{ inputs.max_reconcile_duration_seconds }}`s). Dry-run Failures: `{{ outputs.scan_fluxcd_telemetry.vars.dryrun_failures_total }}` (threshold: `{{ inputs.max_dryrun_failures_threshold }}`). Suspended: `{{ outputs.scan_fluxcd_telemetry.vars.suspended_releases_count }}`. Managed Releases: `{{ outputs.scan_fluxcd_telemetry.vars.managed_releases_total }}`. Audit Timestamp: `{{ outputs.scan_fluxcd_telemetry.vars.audit_timestamp }}`."
          }
    else:
      - id: log_nominal_fluxcd_state
        type: io.kestra.plugin.core.log.Log
        description: Records nominal telemetry when FluxCD Helm controller applies charts cleanly and achieves Ready condition.
        message: "FluxCD operating nominally: {{ outputs.scan_fluxcd_telemetry.vars.managed_releases_total }} releases managed, release {{ outputs.scan_fluxcd_telemetry.vars.release_name }} healthy, zero dryrun failures."

  - id: emit_audit_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Emits structured JSON audit manifest for GitOps deployment compliance and release audit archives.
    format: |
      {
        "sentinel_id": "fluxcd-helmrelease-reconciliation-dryrun-failure-sentinel",
        "release_name": "{{ outputs.scan_fluxcd_telemetry.vars.release_name }}",
        "reconcile_duration_seconds": {{ outputs.scan_fluxcd_telemetry.vars.reconcile_duration_seconds }},
        "dryrun_failures": {{ outputs.scan_fluxcd_telemetry.vars.dryrun_failures_total }},
        "suspended_releases": {{ outputs.scan_fluxcd_telemetry.vars.suspended_releases_count }},
        "managed_releases": {{ outputs.scan_fluxcd_telemetry.vars.managed_releases_total }},
        "degraded_releases": {{ outputs.scan_fluxcd_telemetry.vars.degraded_releases | toJson }},
        "breach_detected": {{ outputs.scan_fluxcd_telemetry.vars.is_alerting }},
        "execution_timestamp": "{{ outputs.scan_fluxcd_telemetry.vars.audit_timestamp }}"
      }

triggers:
  - id: periodic_fluxcd_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"

extend:
  title: FluxCD HelmRelease Reconciliation Dryrun Failure Sentinel
  metaTitle: FluxCD HelmRelease Reconciliation Dryrun Failure Sentinel
  shortDescription: Audits FluxCD Helm controller metrics to detect HelmRelease dry-run failures and drift stalls.
  metaDescription: Scrapes FluxCD Helm controller metrics to detect HelmRelease server dryrun failures, chart reconciliation lag, and drift.
  description: |
    Automates continuous GitOps deployment health surveillance for FluxCD HelmRelease resources across enterprise Kubernetes clusters. The workflow scrapes Helm controller Prometheus metrics to detect server-side dry-run validation errors, values schema rejection, reconciliation stalls, and accidental release suspension before CI/CD pipelines break.

    ## How it works
    1. A schedule trigger executes the FluxCD HelmRelease audit workflow every 15 minutes.
    2. The Python task queries the FluxCD Helm controller Prometheus endpoint on port 8080.
    3. The script extracts chart reconciliation durations, dry-run validation error totals, and suspension flags.
    4. An evaluation gate determines whether chart rendering duration or dry-run validation failure counts exceed limits.
    5. When dry-run verification fails or Helm chart release upgrades stall, a high-priority Slack incident alert is dispatched.
    6. When Helm charts install and test cleanly against the cluster API, nominal metrics are recorded in logs.
    7. A structured JSON audit manifest is emitted for GitOps governance and release compliance archives.

    ## Architecture diagram
    ```mermaid
    graph TD
        Trigger[Schedule Trigger: 15m] --> ScanMetrics[Python Script: Scrape Helm Controller Metrics]
        ScanMetrics --> EvalBreach{Duration > 300s OR Failures > 1 OR Suspended > 0?}
        EvalBreach -- Yes --> SlackAlert[Slack: High-Urgency GitOps Alert]
        EvalBreach -- No --> LogNominal[Log: Nominal FluxCD State]
        SlackAlert --> EmitManifest[Debug Return: FluxCD Audit Manifest]
        LogNominal --> EmitManifest
    ```

    ## Architecture components
    - **Trigger**: Automated schedule polling at 15-minute recurring intervals.
    - **Script Task**: Scrapes FluxCD Helm controller Prometheus metrics using Docker container runners.
    - **Decision Gate**: Evaluates whether chart reconciliation durations or dry-run validation errors breach limits.
    - **Notification Task**: Dispatches structured Slack alerts with affected release names and error tallies.
    - **Audit Manifest**: Emits JSON execution payloads containing GitOps deployment health and timestamps.

    ## Key capabilities
    - Continuous surveillance of FluxCD HelmRelease, HelmChart, and HelmRepository custom resources.
    - Early warning detection for Kubernetes OpenAPI schema validation failures during Helm template rendering.
    - Automated tracking of immutable field modification errors that cause Helm upgrades to loop indefinitely.
    - Zero host dependency execution via isolated containerized Python runners.

    ## What you get
    - Real-time visibility into GitOps continuous delivery synchronization speed and Helm chart health.
    - Proactive alerts preventing broken manifests from blocking downstream production application releases.
    - Standardized audit manifests containing exact reconciliation times, failure counts, and suspension states.
    - Zero-overhead deployment compatible with Flux v2 on any certified Kubernetes distribution.

    ## Who it's for
    - GitOps engineers maintaining declarative Kubernetes application delivery pipelines via FluxCD.
    - Site Reliability Engineers ensuring continuous synchronization between Git repositories and cluster state.
    - Platform architects establishing automated guardrails around multi-tenant Helm chart deployments.
    - DevOps engineers diagnosing Helm hook timeouts and Values YAML type casting errors.

    ## Why orchestrate this with Kestra
    - **Serverless Docker Isolation**: Executes telemetry scraping in ephemeral Docker environments without persistent workers.
    - **Centralized Secrets Governance**: Protects sensitive Slack webhooks using encrypted namespace secrets.
    - **Declarative YAML Workflows**: Manages GitOps deployment surveillance as versioned code in Git repositories.
    - **Comprehensive Audit History**: Preserves historical chart deployment performance in searchable Kestra execution logs.

    ## Use cases
    - **OpenAPI Schema Rejection**: Detects when an upgraded Helm chart references deprecated Kubernetes API versions.
    - **Values Secret Decryption Stall**: Flags when SOPS or SealedSecrets cannot decrypt sensitive Helm release values.
    - **Accidental Release Suspension**: Alerts engineers when a developer forgets to un-suspend a production release.

    ## Inputs
    | Name | Type | Default | Description |
    | --- | --- | --- | --- |
    | `helm_controller_metrics_url` | STRING | `http://helm-controller.flux-system.svc.cluster.local:8080` | Internal HTTP URL exposing Prometheus metrics for FluxCD. |
    | `target_helmrelease_name` | STRING | `ingress-nginx` | Target FluxCD HelmRelease custom resource name monitored. |
    | `max_reconcile_duration_seconds` | INT | `300` | Maximum allowable reconciliation duration in seconds before alerting. |
    | `max_dryrun_failures_threshold` | INT | `1` | Maximum allowable dry-run validation errors before alerting. |
    | `alert_on_suspended_release` | BOOL | `true` | Toggle whether a suspended HelmRelease triggers an alert. |

    ## Expected outputs
    - `{{ outputs.scan_fluxcd_telemetry.vars.reconcile_duration_seconds }}`: Maximum observed Helm reconciliation duration.
    - `{{ outputs.scan_fluxcd_telemetry.vars.dryrun_failures_total }}`: Total count of server-side dry-run failure events.
    - `{{ outputs.scan_fluxcd_telemetry.vars.suspended_releases_count }}`: Count of suspended HelmRelease custom resources.
    - `{{ outputs.scan_fluxcd_telemetry.vars.is_alerting }}`: Boolean flag indicating if GitOps bounds are breached.
    - `{{ outputs.scan_fluxcd_telemetry.vars.audit_timestamp }}`: ISO-8601 UTC timestamp of the FluxCD audit run.

    ## Prerequisites
    - FluxCD v2 installed in the Kubernetes cluster with Helm controller metrics enabled on port 8080.
    - Network connectivity from the Kestra worker to the Helm controller metrics service.
    - Configured Slack incoming webhook URL with permissions to post in GitOps alert channels.

    ### Secrets
    - `SLACK_WEBHOOK_URL`: Secure webhook URL for routing GitOps alerts to the SRE Slack channel.

    ## Quick start
    1. Verify that FluxCD Helm controller exposes Prometheus metrics on HTTP port 8080.
    2. Add the `SLACK_WEBHOOK_URL` secret within your Kestra namespace settings.
    3. Specify your target HelmRelease name in `target_helmrelease_name`.
    4. Run a manual flow execution via the Kestra UI to validate metric ingestion.
    5. Enable the `periodic_fluxcd_audit` schedule trigger to establish automated monitoring.

    ## Common pitfalls and troubleshooting
    - **CRD Upgrade Failure**: Helm cannot upgrade existing CustomResourceDefinitions without manual intervention.
    - **Remediation Retries Exhaustion**: When `spec.install.remediation.retries` is reached, HelmRelease stays unready.
    - **Storage Class Immutability**: Modifying persistent volume claim storage classes causes dry-run rendering rejections.
    - **Service Account RBAC Missing**: Helm controller service account lacks RBAC roles to create target resources.

    ## How to extend
    - **Automated Reconcile Trigger**: Execute a Kestra CLI task to annotate the HelmRelease to force immediate reconciliation.
    - **PagerDuty Escalation**: Escalate to on-call GitOps engineers if dry-run failures persist across 3 consecutive runs.
    - **Multi-Tenant Cluster Scan**: Expand script parameters to monitor all declared HelmReleases across tenant namespaces.

