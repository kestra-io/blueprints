id: aws-dynamodb-user-errors-and-throttled-requests-sentinel
namespace: company.database
description: Audits Amazon DynamoDB table ThrottledRequests and UserErrors via CloudWatch
  metrics, flags capacity starvation, logs a GitHub DBA ticket, and alerts Slack.
inputs:
- id: aws_region
  type: STRING
  displayName: AWS Region
  defaults: us-east-1
- id: table_name
  type: STRING
  displayName: DynamoDB Table Name
  defaults: user-sessions-table
- id: throttle_threshold
  type: INT
  displayName: Max Throttles (15m)
  defaults: 10
- id: target_repository
  type: STRING
  displayName: Database Issue Repository
  defaults: my-org/database-operations
triggers:
- id: periodic_dynamodb_throttle_check
  type: io.kestra.plugin.core.trigger.Schedule
  cron: '*/15 * * * *'
  disabled: true
tasks:
- id: probe_dynamodb_throttles
  type: io.kestra.plugin.aws.cli.AwsCLI
  description: Queries CloudWatch for DynamoDB ThrottledRequests metric over the last
    15 minutes
  accessKeyId: '{{ secret(''AWS_ACCESS_KEY_ID'') }}'
  secretKeyId: '{{ secret(''AWS_SECRET_ACCESS_KEY'') }}'
  region: '{{ inputs.aws_region }}'
  commands:
  - aws cloudwatch get-metric-data --metric-data-queries '[{"Id":"m1","MetricStat":{"Metric":{"Namespace":"AWS/DynamoDB","MetricName":"ThrottledRequests","Dimensions":[{"Name":"TableName","Value":"{{
    inputs.table_name }}"}]},"Period":900,"Stat":"Sum"},"ReturnData":true}]' --start-time
    $(date -u -v-15M +%Y-%m-%dT%H:%M:%SZ) --end-time $(date -u +%Y-%m-%dT%H:%M:%SZ)
    --output json | tr -d '\n' | xargs -0 -I {} echo '::{"outputs":{}}::'
- id: evaluate_throttles
  type: io.kestra.plugin.core.debug.Return
  description: Evaluates throttled request sum against threshold
  format:
    table: '{{ inputs.table_name }}'
    throttle_count: '{{ outputs.probe_dynamodb_throttles.vars.MetricDataResults[0].Values[0]
      ?? 0 }}'
    threshold: '{{ inputs.throttle_threshold }}'
    is_throttling_critical: '{{ (outputs.probe_dynamodb_throttles.vars.MetricDataResults[0].Values[0]
      ?? 0) >= inputs.throttle_threshold }}'
- id: branch_on_throttles
  type: io.kestra.plugin.core.flow.If
  description: Branches based on whether DynamoDB throttles exceeded threshold
  condition: '{{ outputs.evaluate_throttles.value.is_throttling_critical == true }}'
  then:
  - id: create_dynamodb_incident_issue
    type: io.kestra.plugin.github.issues.Create
    description: Logs a prioritized GitHub issue documenting DynamoDB throttling
    oauthToken: '{{ secret(''GITHUB_TOKEN'') }}'
    repository: '{{ inputs.target_repository }}'
    title: '[DynamoDB Alert] ThrottledRequests Capacity Starvation on {{ inputs.table_name
      }}'
    body: "## \U0001F6A8 Amazon DynamoDB Throttling Starvation\n\nThe NoSQL database\
      \ sentinel detected excessive ThrottledRequests:\n- **Table Name:** `{{ inputs.table_name\
      \ }}`\n- **Throttled Requests (15m):** **{{ outputs.evaluate_throttles.value.throttle_count\
      \ }}**\n- **Threshold:** `{{ inputs.throttle_threshold }}`\n\nPlease verify\
      \ table Read/Write Capacity Units (RCU/WCU) or auto-scaling policies.\n*Generated\
      \ automatically by Kestra DynamoDB Sentinel.*"
  - id: alert_database_slack
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Dispatches alert to database Slack channel
    url: '{{ secret(''SLACK_WEBHOOK'') }}'
    payload: "{{ {'text': '\U0001F6A8 *Amazon DynamoDB Throttling Alert*\\n*Table:*\
      \ `' ~ inputs.table_name ~ '`\\n*Throttles:* *' ~ outputs.evaluate_throttles.value.throttle_count\
      \ ~ '*\\n*Incident Ticket:* <' ~ (outputs.create_dynamodb_incident_issue.issueUrl\
      \ ?? '#') ~ '|View GitHub Issue>'} | toJson }}"
  else:
  - id: log_table_healthy
    type: io.kestra.plugin.core.log.Log
    message: DynamoDB table {{ inputs.table_name }} is operating within capacity limits
      ({{ outputs.evaluate_throttles.value.throttle_count }} throttles < {{ inputs.throttle_threshold
      }}).
- id: log_audit_complete
  type: io.kestra.plugin.core.log.Log
  description: Final audit status log
  message: DynamoDB audit complete for {{ inputs.table_name }}.
errors:
- id: alert_flow_failure
  type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
  description: Alerts Slack on execution failure
  url: '{{ secret(''SLACK_WEBHOOK'') }}'
  payload: "{{ {'text': '\u26A0\uFE0F *Amazon DynamoDB Sentinel Failed* in execution\
    \ `' ~ execution.id ~ '`.'} | toJson }}"
extend:
  title: Amazon DynamoDB Throttled Requests and Capacity Starvation Sentinel
  shortDescription: Audit Amazon DynamoDB ThrottledRequests via CloudWatch, detect
    provisioned capacity starvation, open GitHub issues, and alert Slack.
  metaTitle: Amazon DynamoDB Throttling Sentinel with Kestra
  metaDescription: Monitor Amazon DynamoDB throttled requests and capacity limits
    with Kestra. Query CloudWatch, open GitHub issues, and alert Slack.
  description: 'Serverless NoSQL databases like Amazon DynamoDB automatically partition
    data across storage nodes. When hot partition keys or traffic spikes exceed provisioned
    Read/Write Capacity Units (or on-demand burst capacity), DynamoDB throttles requests,
    causing HTTP 400 ProvisionedThroughputExceededException errors to client microservices.
    This blueprint queries CloudWatch for ThrottledRequests metrics periodically,
    identifies capacity starvation, files a prioritized GitHub DBA ticket, and alerts
    the engineering team on Slack.


    ## How it works


    1. `periodic_dynamodb_throttle_check` runs every 15 minutes.

    2. `probe_dynamodb_throttles` queries CloudWatch for ThrottledRequests.

    3. `evaluate_throttles` evaluates if throttles exceed threshold.

    4. `branch_on_throttles` logs a GitHub issue and alerts Slack if breached.

    5. `log_audit_complete` logs final outcome.

    6. `errors` block alerts Slack on execution failure.


    ## What you get


    - Automated, continuous monitoring of DynamoDB table capacity.

    - Early warning before throughput starvation impacts customer checkout or login
    flows.

    - Consolidated GitHub incident tickets with table metrics.

    - Real-time Slack notifications.


    ## Who it''s for


    - Database Administrators and NoSQL SREs managing DynamoDB tables.

    - Serverless platform developers building high-throughput applications.

    - Infrastructure leads tuning database cost and capacity allocation.


    ## Why orchestrate this with Kestra


    Kestra provides declarative automation connecting CloudWatch metrics, conditional
    evaluation, and chat notifications in a single auditable flow.


    ## Prerequisites


    - An AWS account with an active DynamoDB table.

    - IAM credentials with CloudWatch read permissions.

    - A GitHub Personal Access Token.

    - A Slack incoming webhook URL.


    ### Secrets


    - `AWS_ACCESS_KEY_ID`, `AWS_SECRET_ACCESS_KEY`: AWS credentials.

    - `GITHUB_TOKEN`: GitHub token.

    - `SLACK_WEBHOOK`: Slack webhook URL.


    ## Inputs


    - `aws_region`: Target region.

    - `table_name`: DynamoDB table name.

    - `throttle_threshold`: Max throttles before alerting.

    - `target_repository`: GitHub repository.


    ## Outputs


    - `outputs.evaluate_throttles.value.throttle_count`: Number of throttles detected.

    - `outputs.evaluate_throttles.value.is_throttling_critical`: Boolean breach flag.


    ## Quick start


    1. Configure secrets.

    2. Set inputs to match target DynamoDB table.

    3. Run manually to verify metric retrieval.

    4. Enable schedule trigger.


    ## How to extend


    - Add automated auto-scaling policy adjustment tasks.

    - Route urgent alerts to PagerDuty.


    ## Links


    - [Amazon DynamoDB CloudWatch Metrics](https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/metrics-dimensions.html)

    - [Kestra AWS Plugin](https://kestra.io/plugins/plugin-aws)'
  tags:
    - Data
    - Cloud
  subTags:
    - Monitoring & Alerting
  ee: false
  demo: false
