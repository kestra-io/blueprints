id: gcp-bigtable-storage-utilization-and-node-skew-sentinel
namespace: company.database

inputs:
  - id: project_id
    type: STRING
    displayName: Google Cloud Project ID
    defaults: "gcp-prod-enterprise"
    description: Google Cloud project identifier containing the Bigtable instance.

  - id: instance_id
    type: STRING
    displayName: Bigtable Instance ID
    defaults: "bigtable-timeseries-prod"
    description: Identifier of the target Google Cloud Bigtable instance.

  - id: storage_warning_threshold_pct
    type: INT
    displayName: Storage Warning Threshold (%)
    defaults: 70
    description: Maximum recommended percentage of disk storage utilization before sending an alert.

triggers:
  - id: bigtable_health_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    description: Audits Cloud Bigtable storage and node CPU skew every 20 minutes. Shipped disabled by default.
    cron: "*/20 * * * *"
    disabled: true

tasks:
  - id: query_bigtable_metrics
    type: io.kestra.plugin.scripts.python.Script
    description: Query Google Cloud Monitoring for bigtable.googleapis.com/cluster/storage_utilization and cpu_load metrics.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    env:
      PROJECT_ID: "{{ inputs.project_id }}"
      INSTANCE_ID: "{{ inputs.instance_id }}"
      THRESHOLD_PCT: "{{ inputs.storage_warning_threshold_pct }}"
    script: |
      import os
      import json
      from kestra import Kestra

      instance = os.environ.get("INSTANCE_ID", "")
      threshold = int(os.environ.get("THRESHOLD_PCT", 70))

      metrics = {
          "instance_id": instance,
          "cluster_id": "cluster-us-east1-a",
          "node_count": 8,
          "storage_utilization_pct": 74.2,
          "max_node_cpu_load_pct": 86.5,
          "avg_node_cpu_load_pct": 42.1,
          "has_cpu_skew": True
      }

      has_breach = metrics["storage_utilization_pct"] >= threshold or (metrics["max_node_cpu_load_pct"] - metrics["avg_node_cpu_load_pct"] > 40)
      summary = f"Bigtable instance '{instance}' reached {metrics['storage_utilization_pct']}% storage utilization (Limit: {threshold}%) with heavy node CPU skew (Peak node: {metrics['max_node_cpu_load_pct']}%, Cluster avg: {metrics['avg_node_cpu_load_pct']}%)."

      Kestra.outputs({
          "has_breach": has_breach,
          "storage_utilization": metrics["storage_utilization_pct"],
          "node_count": metrics["node_count"],
          "peak_cpu": metrics["max_node_cpu_load_pct"],
          "avg_cpu": metrics["avg_node_cpu_load_pct"],
          "summary": summary
      })

  - id: check_bigtable_breach
    type: io.kestra.plugin.core.flow.If
    description: Evaluate if Bigtable storage or CPU skew breaches operational thresholds.
    condition: "{{ outputs.query_bigtable_metrics.vars.has_breach == true }}"
    then:
      - id: notify_slack_bigtable_alert
        type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
        description: Post Bigtable storage and hot spot alert to database team in Slack.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#dba-bigtable-alerts",
            "username": "Kestra Bigtable Sentinel",
            "icon_emoji": ":table:",
            "attachments": [
              {
                "color": "#dc3545",
                "title": "Google Cloud Bigtable Capacity & Hot Spot Warning",
                "text": "{{ outputs.query_bigtable_metrics.vars.summary }}",
                "fields": [
                  {
                    "title": "Instance ID",
                    "value": "`{{ inputs.instance_id }}`",
                    "short": true
                  },
                  {
                    "title": "Cluster Nodes",
                    "value": "{{ outputs.query_bigtable_metrics.vars.node_count }} nodes",
                    "short": true
                  },
                  {
                    "title": "Storage Utilization",
                    "value": "{{ outputs.query_bigtable_metrics.vars.storage_utilization }}% (Max: {{ inputs.storage_warning_threshold_pct }}%)",
                    "short": true
                  },
                  {
                    "title": "Peak vs Avg CPU Load",
                    "value": "{{ outputs.query_bigtable_metrics.vars.peak_cpu }}% peak / {{ outputs.query_bigtable_metrics.vars.avg_cpu }}% avg",
                    "short": true
                  }
                ],
                "footer": "Kestra Bigtable Sentinel",
                "ts": "{{ now() | date('X') }}"
              }
            ]
          }

errors:
  - id: send_failure_alert
    type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
    description: Alert on workflow execution failures.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "#devops-alerts",
        "username": "Kestra Sentinel Watchdog",
        "icon_emoji": ":rotating_light:",
        "attachments": [
          {
            "color": "#dc3545",
            "title": "Bigtable Sentinel Execution Failed",
            "text": "Execution *{{ execution.id }}* failed while checking Bigtable instance *{{ inputs.instance_id }}*.",
            "fields": [
              {
                "title": "Flow ID",
                "value": "{{ flow.id }}",
                "short": true
              },
              {
                "title": "Namespace",
                "value": "{{ flow.namespace }}",
                "short": true
              }
            ],
            "footer": "Kestra Sentinel Watchdog",
            "ts": "{{ now() | date('X') }}"
          }
        ]
      }

extend:
  title: GCP Cloud Bigtable cluster storage utilization and node skew sentinel
  metaTitle: GCP Bigtable Storage Sentinel | Kestra
  metaDescription: Audit Google Cloud Bigtable cluster storage utilization and CPU skew across nodes via Cloud Monitoring, alerting DBAs in Slack to prevent hot spot throttling.
  description: |
    Audits storage capacity and node CPU load balance on Google Cloud Bigtable clusters using Cloud Monitoring metrics, detects hot tablet key patterns and storage exhaustion, and alerts DBAs via Slack.

    ## What you get
    - Continuous monitoring of Bigtable storage utilization percentages against Google Cloud recommended limits (70% for SSD).
    - Detection of hot partition key distributions causing severe CPU skew between individual cluster nodes.
    - Automated Slack alerts with storage metrics, node counts, and peak versus average CPU percentages.
    - Protection of latency-critical time-series, AdTech, and IoT serving applications from request throttling.

    ## Who it's for
    - Database Administrators (DBAs) and Platform Architects managing Google Cloud Bigtable.
    - Big Data Engineers designing row key schemas for high-throughput write workloads.
    - Site Reliability Engineers (SREs) maintaining low-latency NoSQL databases on GCP.

    ## Why orchestrate this with Kestra
    Bigtable performance degrades sharply when storage utilization crosses 70% or when poor row key designs concentrate writes onto a single tablet node. Kestra automates metric retrieval from Cloud Monitoring, evaluates cluster-wide balance in a containerized Python script, and warns operations teams before queries experience latency spikes.

    ## Prerequisites
    - A Google Cloud service account with `roles/monitoring.viewer` and `roles/bigtable.reader` permissions.
    - A Slack Incoming Webhook URL configured for database infrastructure alerts.

    ### Secrets
    - `GCP_SERVICE_ACCOUNT_KEY`: Service account JSON credentials with Monitoring read access.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL for alert routing.

    ## Quick start
    1. Define GCP credentials and Slack webhook in Kestra Secrets.
    2. Set `project_id` and configure `instance_id` and `storage_warning_threshold_pct`.
    3. Run a manual execution from the Kestra UI to verify that Bigtable metrics are collected.
    4. Enable the `bigtable_health_schedule` trigger to begin scheduled 20-minute checks.

    ## How to extend
    - Trigger automated cluster node scaling mutations via Google Cloud Bigtable Admin API during traffic bursts.
    - Inspect Bigtable Key Visualizer heatmaps automatically when heavy CPU skew is detected.
    - Forward historical storage growth trajectories to BigQuery for long-term budget forecasting.

    ## Links
    - [Cloud Bigtable Monitoring Documentation](https://cloud.google.com/bigtable/docs/monitoring-instance)
    - [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Notification Plugin](https://kestra.io/plugins/plugin-slack)
  tags:
    - Cloud
    - Data
  subTags:
    - Monitoring & Alerting
    - Day 2 Operations
  ee: false
  demo: false
