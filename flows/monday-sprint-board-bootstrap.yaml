id: monday-sprint-board-bootstrap
namespace: company.team
description: |
  Bootstrap a sprint board in monday.com as code. Create the board from a
  template, add Committed and Stretch groups, add a Status column, and
  post the new board id to Discord so the whole setup is one execution
  instead of fifteen minutes of Friday clicking.

inputs:
  - id: sprint_name
    type: STRING
    defaults: Sprint 42
    description: Name of the new sprint board as it will appear in monday.com.

  - id: template_id
    type: STRING
    defaults: "1234567890"
    description: monday.com template id to clone the board from. Replace with a real template id, or remove the templateId property on create_board to start from a blank board.

  - id: workspace_id
    type: STRING
    defaults: "1234567"
    description: Workspace id where the board is created. Copy it from the workspace URL.

tasks:
  - id: create_board
    type: io.kestra.plugin.monday.boards.Create
    description: Create the sprint board from the template inside the target workspace, emitting the new board id for every task that follows.
    apiToken: "{{ secret('MONDAY_API_TOKEN') }}"
    boardName: "{{ inputs.sprint_name }}"
    boardKind: PUBLIC
    workspaceId: "{{ inputs.workspace_id }}"
    templateId: "{{ inputs.template_id }}"
    boardDescription: "Sprint board created by Kestra flow {{ flow.id }}, execution {{ execution.id }}."

  - id: committed_group
    type: io.kestra.plugin.monday.groups.Create
    description: Add the Committed group where the team places work it commits to finishing this sprint.
    apiToken: "{{ secret('MONDAY_API_TOKEN') }}"
    boardId: "{{ outputs.create_board.boardId }}"
    groupName: Committed

  - id: stretch_group
    type: io.kestra.plugin.monday.groups.Create
    description: Add the Stretch group for work the team pulls in only if the committed scope lands early.
    apiToken: "{{ secret('MONDAY_API_TOKEN') }}"
    boardId: "{{ outputs.create_board.boardId }}"
    groupName: Stretch

  - id: status_column
    type: io.kestra.plugin.monday.columns.Create
    description: Add a Status column so every item on the fresh board carries workflow state from the first minute.
    apiToken: "{{ secret('MONDAY_API_TOKEN') }}"
    boardId: "{{ outputs.create_board.boardId }}"
    title: Status
    columnType: status

  - id: announce
    type: io.kestra.plugin.discord.DiscordIncomingWebhook
    description: Share the new board id and the created structure with the team channel so everyone starts the sprint on the same board.
    url: "{{ secret('DISCORD_WEBHOOK_URL') }}"
    payload: |
      {
        "content": "Sprint board {{ inputs.sprint_name }} is ready in monday.com (board id {{ outputs.create_board.boardId }}). Groups Committed ({{ outputs.committed_group.groupId }}) and Stretch ({{ outputs.stretch_group.groupId }}) plus a Status column ({{ outputs.status_column.columnId }}) were created by execution {{ execution.id }}."
      }

errors:
  - id: alert_failure
    type: io.kestra.plugin.discord.DiscordIncomingWebhook
    description: Alert Discord when the bootstrap fails so the team never starts a sprint on a half-built board.
    url: "{{ secret('DISCORD_WEBHOOK_URL') }}"
    payload: |
      {
        "content": "Sprint board bootstrap FAILED in flow {{ flow.id }} (execution {{ execution.id }}). The board may be partially created; check the task logs before retrying."
      }

extend:
  title: Bootstrap a monday.com Sprint Board from a Template as Code
  shortDescription: One execution creates a monday.com sprint board from a template, adds Committed and Stretch groups plus a Status column, and posts the board id to Discord.
  metaTitle: monday.com Sprint Board Bootstrap with Kestra
  metaDescription: Create monday.com sprint boards as code with Kestra. Clone a template, add Committed and Stretch groups and a Status column, and announce the id in Discord.
  description: |
    Sprint boards should be reproducible artifacts, not the output of someone clicking through monday.com every other Friday. This blueprint declares the whole setup in YAML: `io.kestra.plugin.monday.boards.Create` clones a template into the target workspace, two `io.kestra.plugin.monday.groups.Create` tasks add the Committed and Stretch groups, `io.kestra.plugin.monday.columns.Create` adds a Status column, and Discord receives the new board id. Every sprint starts from an identical, versioned structure.

    ## How it works

    1. `create_board` (`io.kestra.plugin.monday.boards.Create`) creates a public board named from the `sprint_name` input, cloned from `template_id` inside `workspace_id`. The new id is exposed as `{{ outputs.create_board.boardId }}`.
    2. `committed_group` and `stretch_group` (`io.kestra.plugin.monday.groups.Create`) add the two sprint groups to that board; each returns its `groupId` and `title`.
    3. `status_column` (`io.kestra.plugin.monday.columns.Create`) adds a `status` column named Status, returning its `columnId`.
    4. `announce` posts the board id, both group ids, and the column id to Discord so the team can jump straight in.
    5. The `errors` block posts a distinct Discord alert on failure, flagging that the board may be partially created before anyone retries.

    ## What you get

    - Sprint board structure as reviewable, versionable code instead of tribal clicking knowledge.
    - Identical boards every sprint, with ids captured as outputs for downstream automation.
    - A Discord announcement the moment the board is ready.
    - A failure alert that prevents the team from starting on a half-built board.

    ## Who it's for

    - Engineering managers and scrum leads who rebuild the same board every sprint.
    - PMO and ops teams standardizing board structure across many squads.
    - Platform teams treating workspace setup as part of their provisioning code.

    ## Why orchestrate this with Kestra

    A board template covers layout, but the ritual around it, naming, groups, columns, announcements, still happens by hand. Kestra chains the four API calls with output passing, records who created which board when, retries transient API failures, and makes the sprint cadence one Execute click or one API call from your sprint-planning automation.

    ## Prerequisites

    - A monday.com template board and its template id, or remove `templateId` to start blank.
    - The target workspace id.
    - A Discord incoming webhook for announcements and failure alerts.

    ### Secrets

    - `MONDAY_API_TOKEN`: monday.com personal API v2 token, from Profile, Developers, My Access Tokens.
    - `DISCORD_WEBHOOK_URL`: Discord incoming webhook URL.

    ## Quick start

    1. Add the two secrets to your Kestra namespace.
    2. Set `template_id` and `workspace_id` to real ids from your account.
    3. Execute the flow with the next sprint's name and open the board id Discord reports.

    ## How to extend

    - Add more columns, for example `date` or `numbers`, with additional `io.kestra.plugin.monday.columns.Create` tasks.
    - Seed the board with carry-over items using `io.kestra.plugin.monday.items.Create` into the Committed group id output.
    - Schedule the bootstrap on your sprint cadence with `io.kestra.plugin.core.trigger.Schedule` and a templated sprint name.
    - Archive the previous sprint's board in the same run with `io.kestra.plugin.monday.boards.Archive`.

    ## Links

    - [monday.com plugin documentation](https://kestra.io/plugins/plugin-monday)
    - [monday.com API reference](https://developer.monday.com/api-reference/docs)
  tags:
    - Business
  subTags:
    - HR & Ops Automation
    - Day 2 Operations
  ee: false
  demo: false
