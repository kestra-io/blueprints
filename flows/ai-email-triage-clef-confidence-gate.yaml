id: ai-email-triage-clef-confidence-gate
namespace: company.ai
description: |
  Classify incoming emails with Cloudflare's Clef decision model and route
  them by category and confidence, sending low-confidence mail to human review.

inputs:
  - id: email_subject
    type: STRING
    defaults: "Invoice #4821 overdue, please pay within 3 days"
    description: Subject line of the email to classify.

  - id: email_body
    type: STRING
    defaults: |
      Hi team, invoice #4821 for $4,200 is now 12 days overdue.
      Please arrange payment this week to avoid late fees. Thanks, Accounts.
    description: Plain-text body of the email to classify.

  - id: sender_email
    type: STRING
    defaults: accounts@vendor-example.com
    description: Sender address.

  - id: model
    type: SELECT
    defaults: clef-flash
    values:
      - clef-flash
      - clef
    description: Clef model selector sent in the request body.

  - id: confidence_threshold
    type: FLOAT
    defaults: 0.5
    description: Below this confidence the email goes to human review.

tasks:
  - id: tier0_heuristics
    type: io.kestra.plugin.scripts.python.Script
    description: Sanitize guard — flags bulk patterns and redacts codes and account numbers before any model call.
    dependencies:
      - kestra
    script: |
      import json
      import re
      from kestra import Kestra
  
      subject = """{{ inputs.email_subject }}"""
      body = """{{ inputs.email_body }}"""
      text = (subject + "\n" + body).lower()
  
      heuristic = "none"
      if "list-unsubscribe" in text or "unsubscribe" in text:
          heuristic = "newsletter"

      safe_subject = re.sub(r"\b\d{4,}\b", "***", subject)
      safe_body = re.sub(r"\b\d{4,}\b", "***", body)
      safe_state = "From: " + """{{ inputs.sender_email }}""" + " Subject: " + safe_subject + " Body: " + safe_body
      safe_state_json = json.dumps(safe_state)
  
      Kestra.outputs({
          "heuristic": heuristic,
          "safe_subject": safe_subject,
          "safe_body": safe_body,
          "safe_state_json": safe_state_json,
      })

  - id: classify_clef
    type: io.kestra.plugin.core.http.Request
    description: One Clef call evaluating category, safe-to-delete and urgency in parallel.
    uri: "https://api.cloudflare.com/client/v4/accounts/{{ secret('CLOUDFLARE_ACCOUNT_ID') }}/ai/run/@cf/cloudflare/clef-flash"
    method: POST
    contentType: application/json
    headers:
      Authorization: "Bearer {{ secret('CLOUDFLARE_API_TOKEN') }}"
    body: |
      {
        "model": "{{ inputs.model }}",
        "state": {{ outputs.tier0_heuristics.vars.safe_state_json }},
        "questions": {
          "category": {
            "type": "choice",
            "instructions": "Classify this email into exactly one category.",
            "criteria": {
              "newsletter": "subscriptions, digests, marketing blasts",
              "promo": "discounts, offers, sales campaigns",
              "receipt": "order confirmations, payment receipts, invoices",
              "finance-legal": "money movement, contracts, compliance, account security",
              "work": "job-related professional correspondence",
              "personal": "friends, family, direct human messages",
              "urgent": "outage, breach, deadline today, needs immediate action",
              "low-priority": "FYI threads, cc loops, no action needed"
            }
          },
          "safe_delete": {
            "type": "noul",
            "instructions": "Is it safe to delete this email without any loss?"
          },
          "urgency": {
            "type": "score",
            "instructions": "How urgent is this email?",
            "criteria": ["routine, no rush", "today", "urgent", "critical, act now"]
          }
        }
      }
    retry:
      type: exponential
      interval: PT2S
      maxInterval: PT20S
      maxAttempts: 3

  - id: route_decision
    type: io.kestra.plugin.core.flow.If
    description: Confidence gate — below threshold goes to human review, never auto-labeled.
    condition: "{{ fromJson(outputs.classify_clef.body ?? '{}').result.answers.category.confidence < inputs.confidence_threshold }}"
    then:
      - id: notify_human_review
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        messageText: |
          :eyes: *HUMAN REVIEW* — low-confidence triage
          *Subject:* {{ inputs.email_subject }}
          *Guessed category:* `{{ fromJson(outputs.classify_clef.body ?? '{}').result.answers.category.choice ?? 'unknown' }}` (confidence `{{ fromJson(outputs.classify_clef.body ?? '{}').result.answers.category.confidence ?? 'n/a' }}`)
    else:
      - id: route_by_category
        type: io.kestra.plugin.core.flow.Switch
        description: High-confidence mail fans out to team-specific cards by category.
        value: "{{ fromJson(outputs.classify_clef.body ?? '{}').result.answers.category.choice ?? 'unknown' }}"
        cases:
          newsletter:
            - id: log_newsletter_skip
              type: io.kestra.plugin.core.log.Log
              message: "Newsletter classified with high confidence — logged quietly, no alert. Subject: {{ inputs.email_subject }}"
          urgent:
            - id: alert_urgent
              type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
              url: "{{ secret('SLACK_WEBHOOK_URL') }}"
              description: Incident-style card for urgent mail.
              messageText: |
                :rotating_light: *URGENT EMAIL*
                *Subject:* {{ inputs.email_subject }}
                *From:* {{ inputs.sender_email }}
                *Urgency score:* `{{ fromJson(outputs.classify_clef.body ?? '{}').result.answers.urgency.score ?? 'n/a' }}` | *Safe to delete:* `{{ fromJson(outputs.classify_clef.body ?? '{}').result.answers.safe_delete.noul ?? 'n/a' }}`
          finance-legal:
            - id: notify_finance
              type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
              url: "{{ secret('SLACK_WEBHOOK_URL') }}"
              description: Finance card for money and legal mail.
              messageText: |
                :bank: *FINANCE / LEGAL EMAIL*
                *Subject:* {{ inputs.email_subject }}
                *From:* {{ inputs.sender_email }}
                *Urgency score:* `{{ fromJson(outputs.classify_clef.body ?? '{}').result.answers.urgency.score ?? 'n/a' }}`
            - id: log_finance_protect
              type: io.kestra.plugin.core.log.Log
              description: Finance-legal mail is never auto-deleted regardless of safe_delete score.
              message: "PROTECTED: finance-legal sender {{ inputs.sender_email }} — never auto-delete."
          promo:
            - id: log_promo_skip
              type: io.kestra.plugin.core.log.Log
              message: "Promo classified with high confidence — logged quietly, no alert. Subject: {{ inputs.email_subject }}"
          low-priority:
            - id: log_low_priority_skip
              type: io.kestra.plugin.core.log.Log
              message: "Low-priority mail logged quietly, no alert. Subject: {{ inputs.email_subject }}"
        defaults:
          - id: notify_standard
            type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
            url: "{{ secret('SLACK_WEBHOOK_URL') }}"
            description: Standard triage card for receipt, work, personal and anything else.
            messageText: |
              :inbox_tray: *Email triaged*
              *Subject:* {{ inputs.email_subject }}
              *Category:* `{{ fromJson(outputs.classify_clef.body ?? '{}').result.answers.category.choice ?? 'unknown' }}` | *Urgency:* `{{ fromJson(outputs.classify_clef.body ?? '{}').result.answers.urgency.score ?? 'n/a' }}` | *Safe to delete:* `{{ fromJson(outputs.classify_clef.body ?? '{}').result.answers.safe_delete.noul ?? 'n/a' }}`

triggers:
  - id: scheduled_inbox_sweep
    type: io.kestra.plugin.core.trigger.Schedule
    description: Periodic sweep of unread mail. Shipped disabled for safe manual verification first.
    cron: "0 9 * * *"
    disabled: true
  - id: webhook_inbound_email
    type: io.kestra.plugin.core.trigger.Webhook
    description: Authenticated webhook endpoint for realtime mail ingestion.
    key: "{{ secret('WEBHOOK_KEY') }}"

errors:
  - id: alert_triage_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    description: Failure notice if classification or routing throws an unhandled exception.
    messageText: ":warning: Execution {{ execution.id }} failed in flow `{{ flow.namespace }}.{{ flow.id }}`."

outputs:
  - id: category
    type: STRING
    value: "{{ fromJson(outputs.classify_clef.body ?? '{}').result.answers.category.choice ?? 'unknown' }}"
  - id: confidence
    type: FLOAT
    value: "{{ fromJson(outputs.classify_clef.body ?? '{}').result.answers.category.confidence ?? 0 }}"

extend:
  title: Triage Inbox Emails with Cloudflare Clef Decision Models
  metaTitle: Email Triage with Clef Decision Models | Kestra
  shortDescription: Classify inbox mail with Clef choice+noul+score in one call and route by category behind a confidence gate, with human review for uncertain mail.
  metaDescription: Classify inbox emails with Cloudflare Clef in one call and route by category behind a confidence gate with human review.
  description: |
    Shared inboxes drown in newsletters, promos, receipts and the occasional critical outage or overdue invoice. Chat LLMs can classify, but they are slow, pricey per run, and return free-form text you must parse — occasionally inventing labels.

    This blueprint uses a decision model instead: Cloudflare's Clef (`clef-flash` default, `clef` optional), which speaks the Jev / System One API. One HTTP call evaluates three typed questions in parallel — category (`choice` over 8 labels), safe-to-delete (`noul` probability), urgency (`score` over 4 levels) — and returns probabilities plus confidence. A sanitize task redacts codes and account numbers before any model call, finance-legal mail is hard-protected from auto-delete, and anything under the confidence threshold goes to human review instead of being auto-labeled.

    ## How it works

    1. `tier0_heuristics` (`scripts.python.Script`): flags bulk-mail patterns and redacts 4+ digit runs (codes, account numbers) to `***`, publishing `heuristic`, `safe_subject`, `safe_body` and a JSON-escaped `safe_state_json`.
    2. `classify_clef` (`core.http.Request`): POSTs the scrubbed state plus `choice`/`noul`/`score` questions to `.../ai/run/@cf/cloudflare/clef-flash`, with exponential retries.
    3. `route_decision` (`core.flow.If`): confidence below `inputs.confidence_threshold` (default 0.5) routes to `notify_human_review` (Slack); otherwise `route_by_category` (`core.flow.Switch`) fans out to team cards — `urgent` incident card, `finance-legal` card plus protection log, quiet logs for `newsletter`/`promo`/`low-priority`, standard card for the rest.
    4. `alert_triage_failure` (`errors` block): posts to Slack if classification or routing throws.

    ## What you get

    - One-call typed classification — no prompt parsing, no invented labels, ~38ms median on `clef-flash`.
    - Zero auto-labeling below confidence: uncertain mail always escalates to a human.
    - PII minimization baked in: codes and account numbers never reach the model.
    - Team-specific Slack cards per category, quiet logs for bulk mail, failure alerts on errors.

    ## Who it's for

    - Platform engineers, AI practitioners and ops teams automating shared inboxes and SLA escalation paths.

    ## Why orchestrate this with Kestra

    Cron plus scripts hide retries, secrets and audit trails. Kestra gives declarative scheduling, masked secrets, confidence-gated routing, per-category fan-out and full execution history in one maintainable YAML workflow.

    ## Prerequisites

    - A free Cloudflare account with Workers AI enabled (10,000 Neurons/day free covers roughly a million `clef-flash` classifications daily).
    - A Slack workspace with an incoming webhook for notifications.

    ### Secrets

    - `CLOUDFLARE_ACCOUNT_ID`: Cloudflare account ID in the Workers AI URL (required).
    - `CLOUDFLARE_API_TOKEN`: Token with Workers AI Read + Edit (required).
    - `SLACK_WEBHOOK_URL`: Incoming webhook for triage cards and failure alerts (required).
    - `WEBHOOK_KEY`: Auth key for the realtime webhook trigger (required).
    - OSS self-hosted: provide these as base64 `SECRET_<NAME>` environment variables (e.g. `SECRET_CLOUDFLARE_API_TOKEN`); Cloud/EE users add them under Namespaces → Secrets.

    ### Inputs

    - `email_subject`, `email_body`, `sender_email`: the mail to classify (defaults ship a runnable demo).
    - `model` (`clef-flash` / `clef`): decision model selector. Note the request URI targets the flash endpoint; align both when switching.
    - `confidence_threshold` (FLOAT, default `0.5`): below this, mail goes to human review.

    ### Outputs

    - `outputs.category`: winning category label (or `unknown`).
    - `outputs.confidence`: winning confidence (or `0`).

    ## Quick start

    1. Add the four secrets above to your namespace (or OSS environment).
    2. Import this blueprint and Execute with defaults — no inbox needed.
    3. Verify the human-review Slack card (the demo invoice classifies `receipt` at low confidence by design).
    4. Re-run with your own mail via custom inputs; enable `scheduled_inbox_sweep` or point a mail handler at `webhook_inbound_email` when satisfied.

    ## How to extend

    - Swap `model` to `clef` for max precision, point the same body at TypeSafe Jev (`api.typesafe.ai/v1/systemone`), or fall back to Gemini `Classification` — the question schema ports directly.
    - Fan out per-team channels with one webhook URL per team, or apply Gmail labels via the Google Workspace plugin.
    - Feed attachments to Clef's multimodal `images[]` (Jev-class models without vision cannot do this).
    - Persist every verdict to Postgres for an audit trail, like the HuggingFace classification blueprint does.

    ## Common pitfalls

    - **Confidential mail transits a third party:** subjects and bodies are sent to Cloudflare. Redaction covers digit runs, but review vendor data terms before production; self-host `Cloudflare/clef-flash` (Apache-2.0) or go local Ollama for sensitive mailboxes.
    - **Spaced or dashed codes slip redaction:** `123 456` survives the digit-run regex; normalize separators first if your threat model needs it.
    - **Overlapping criteria split votes:** category definitions that share features (invoice vs urgent vs finance-legal) lower confidence by design — sharpen boundaries instead of lowering the threshold.
    - **Spoofed senders:** verify SPF/DKIM/DMARC before trusting `sender_email` for anything consequential.
    - **Prompt injection in bodies:** treat mail text as untrusted data; strict typed outputs bound the damage, human review gates the actions.

    ## Links

    - [Clef on Workers AI](https://developers.cloudflare.com/workers-ai/models/clef/)
    - [Clef-flash on Workers AI](https://developers.cloudflare.com/workers-ai/models/clef-flash)
    - [Introducing Clef (blog)](https://blog.cloudflare.com/clef-decision-models)
    - [TypeSafe System One API (Jev-compatible)](https://docs.typesafe.ai/api)
    - [Kestra HTTP Request](https://kestra.io/plugins/core/http/io.kestra.plugin.core.http.request)

    - This blueprint has been created by [Sagetrash](https://github.com/Sagetrash)
  tags:
    - AI
    - Business
  subTags:
    - Classification & Moderation
    - Reporting & Digests
  ee: false
  demo: false