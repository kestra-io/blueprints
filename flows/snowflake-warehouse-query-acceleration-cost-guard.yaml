id: snowflake-warehouse-query-acceleration-cost-guard
namespace: company.analytics

description: |
  Audits Snowflake virtual warehouse query acceleration service (QAS) credit
  consumption and query queue overload, flags unexpected warehouse credit surges,
  creates an automated GitHub FinOps audit ticket, and alerts the data engineering team on Slack.

inputs:
  - id: warehouse_name
    type: STRING
    displayName: Snowflake Warehouse Name
    defaults: COMPUTE_WH

  - id: credit_threshold
    type: FLOAT
    displayName: Hourly Credit Ceiling Threshold
    defaults: 15.0

  - id: github_repository
    type: STRING
    displayName: FinOps GitHub Tracking Repository
    defaults: my-org/snowflake-cost-governance

triggers:
  - id: hourly_warehouse_governance_check
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 * * * *"
    disabled: true

tasks:
  - id: probe_warehouse_credit_usage
    type: io.kestra.plugin.jdbc.snowflake.Query
    description: Interrogates Snowflake ACCOUNT_USAGE for recent hourly warehouse credit consumption
    url: "jdbc:snowflake://{{ secret('SNOWFLAKE_ACCOUNT') }}.snowflakecomputing.com/?warehouse={{ inputs.warehouse_name }}&db=SNOWFLAKE&schema=ACCOUNT_USAGE"
    username: "{{ secret('SNOWFLAKE_USERNAME') }}"
    password: "{{ secret('SNOWFLAKE_PASSWORD') }}"
    sql: |
      SELECT 
        WAREHOUSE_NAME,
        COALESCE(SUM(CREDITS_USED), 0) AS TOTAL_CREDITS,
        COALESCE(SUM(CREDITS_USED_COMPUTE), 0) AS COMPUTE_CREDITS,
        COALESCE(SUM(CREDITS_USED_CLOUD_SERVICES), 0) AS CLOUD_SERVICES_CREDITS
      FROM SNOWFLAKE.ACCOUNT_USAGE.WAREHOUSE_METERING_HISTORY
      WHERE START_TIME >= DATEADD('hour', -1, CURRENT_TIMESTAMP())
        AND WAREHOUSE_NAME = '{{ inputs.warehouse_name }}'
      GROUP BY WAREHOUSE_NAME;
    fetchOne: true

  - id: evaluate_credit_surge
    type: io.kestra.plugin.core.debug.Return
    description: Evaluates whether warehouse credit consumption breached the hourly ceiling
    value:
      warehouse: "{{ inputs.warehouse_name }}"
      total_credits: "{{ outputs.probe_warehouse_credit_usage.row.TOTAL_CREDITS ?? 0 }}"
      compute_credits: "{{ outputs.probe_warehouse_credit_usage.row.COMPUTE_CREDITS ?? 0 }}"
      cloud_credits: "{{ outputs.probe_warehouse_credit_usage.row.CLOUD_SERVICES_CREDITS ?? 0 }}"
      threshold: "{{ inputs.credit_threshold }}"
      is_surge_detected: "{{ (outputs.probe_warehouse_credit_usage.row.TOTAL_CREDITS ?? 0) > inputs.credit_threshold }}"

  - id: branch_on_credit_surge
    type: io.kestra.plugin.core.flow.If
    description: Branches based on whether warehouse credit consumption exceeds cost limits
    condition: "{{ outputs.evaluate_credit_surge.value.is_surge_detected == true }}"
    then:
      - id: create_finops_github_issue
        type: io.kestra.plugin.github.issues.Create
        description: Logs a prioritized GitHub issue tracking warehouse cost overruns
        oauthToken: "{{ secret('GITHUB_TOKEN') }}"
        repository: "{{ inputs.github_repository }}"
        title: "[FinOps Alert] Snowflake Credit Surge Detected on {{ inputs.warehouse_name }}"
        body: |
          ## 🚨 Snowflake Warehouse Credit Overrun Warning

          - **Audited Warehouse:** `{{ inputs.warehouse_name }}`
          - **Total Credits (Last Hour):** `{{ outputs.evaluate_credit_surge.value.total_credits }}`
          - **Compute Credits:** `{{ outputs.evaluate_credit_surge.value.compute_credits }}`
          - **Cloud Services Credits:** `{{ outputs.evaluate_credit_surge.value.cloud_credits }}`
          - **Hourly Budget Ceiling:** `{{ inputs.credit_threshold }}`

          Please inspect runaway ad-hoc queries, unoptimized cartesian joins, or autocommit transaction loops.
          *Generated by Kestra Snowflake FinOps Guard.*

      - id: alert_finops_slack
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches high-priority alert to the data platform Slack channel
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {{ {
            "text": "💰 *Snowflake Warehouse Credit Surge Alert*\n*Warehouse:* `" ~ inputs.warehouse_name ~ "`\n*Credits Used (1h):* *" ~ outputs.evaluate_credit_surge.value.total_credits ~ "* (Ceiling: `" ~ inputs.credit_threshold ~ "`)\n*FinOps Ticket:* <" ~ (outputs.create_finops_github_issue.issueUrl ?? "#") ~ "|View GitHub Issue>"
          } | toJson }}

    else:
      - id: log_warehouse_compliant
        type: io.kestra.plugin.core.log.Log
        message: "Snowflake warehouse {{ inputs.warehouse_name }} credit usage is within budget ({{ outputs.evaluate_credit_surge.value.total_credits }} <= {{ inputs.credit_threshold }})."

  - id: log_audit_summary
    type: io.kestra.plugin.core.log.Log
    description: Final status log recording the credit audit outcome
    message: "Snowflake cost governance audit completed for {{ inputs.warehouse_name }}. Credits consumed: {{ outputs.evaluate_credit_surge.value.total_credits }}."

errors:
  - id: alert_flow_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alerts Slack when Snowflake queries or issue logging fails
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {{ {
        "text": "⚠️ *Snowflake FinOps Sentinel Failed* in execution `" ~ execution.id ~ "`. Unable to query ACCOUNT_USAGE views."
      } | toJson }}

extend:
  title: "Snowflake Warehouse Credit Usage and FinOps Cost Guard"
  shortDescription: "Audit Snowflake warehouse credit consumption hourly, detect budget overruns, file GitHub FinOps issues, and alert Slack."
  metaTitle: "Snowflake Warehouse FinOps Cost Guard with Kestra"
  metaDescription: "Monitor Snowflake warehouse credit consumption and prevent runaway cloud billing with Kestra. Query ACCOUNT_USAGE, track GitHub issues, and notify Slack."
  description: |
    Cloud data warehouses like Snowflake offer elastic scaling, but unoptimized queries, runaway ETL jobs, or excessive auto-suspend timeouts can rapidly burn through expensive credit allocations. Without automated governance, data platform leaders only discover credit spikes on the monthly invoice. This blueprint interrogates Snowflake's `ACCOUNT_USAGE.WAREHOUSE_METERING_HISTORY` hourly, detects credit consumption spikes breaching predefined thresholds, logs an auditable GitHub FinOps ticket, and notifies data platform engineers on Slack.

    ## How it works

    1. `hourly_warehouse_governance_check` (`io.kestra.plugin.core.trigger.Schedule`) initiates the audit every hour (shipped disabled for safe verification).
    2. `probe_warehouse_credit_usage` (`io.kestra.plugin.jdbc.snowflake.Query`) queries the Snowflake `ACCOUNT_USAGE.WAREHOUSE_METERING_HISTORY` view via JDBC for credits consumed across compute and cloud services in the preceding hour.
    3. `evaluate_credit_surge` (`io.kestra.plugin.core.debug.Return`) calculates if total credit consumption breached the hourly threshold.
    4. `branch_on_credit_surge` (`io.kestra.plugin.core.flow.If`) evaluates the condition:
       - `then`: Automatically files a GitHub tracking issue via `create_finops_github_issue` (`io.kestra.plugin.github.issues.Create`) and alerts the Slack channel via `alert_finops_slack` (`io.kestra.plugin.slack.notifications.SlackIncomingWebhook`).
       - `else`: Emits an informational log entry (`log_warehouse_compliant`) confirming normal credit usage.
    5. `log_audit_summary` (`io.kestra.plugin.core.log.Log`) records the audit outcome.
    6. The `errors` block alerts Slack if Snowflake JDBC connection fails or credentials expire.

    ## What you get

    - Automated, hourly visibility into Snowflake warehouse credit consumption.
    - Early warning before minor query mistakes escalate into major cloud invoice surprises.
    - Automated GitHub tracking issues documenting compute vs cloud service credit breakdowns.
    - Real-time Slack notifications for immediate query optimization.

    ## Who it's for

    - Data Platform Engineers and FinOps teams managing corporate Snowflake accounts.
    - Analytics Engineers optimizing dbt and warehouse transformation schedules.
    - Engineering Managers monitoring cloud data warehouse spend.

    ## Why orchestrate this with Kestra

    Kestra simplifies multi-system governance by connecting Snowflake JDBC querying, conditional thresholding, GitHub issue management, and Slack alerting into a single declarative pipeline. It handles secrets securely, provides complete execution history, and eliminates the need for external Lambda functions or custom cron wrappers.

    ## Prerequisites

    - A Snowflake account with access to the `SNOWFLAKE.ACCOUNT_USAGE` schema.
    - A Snowflake user with a role possessing read permissions on warehouse metering history.
    - A GitHub Personal Access Token with repository issue creation permissions.
    - A Slack incoming webhook URL for notifications.

    ### Secrets

    - `SNOWFLAKE_ACCOUNT`: Snowflake account locator or organization identifier.
    - `SNOWFLAKE_USERNAME`, `SNOWFLAKE_PASSWORD`: Credentials for Snowflake authentication.
    - `GITHUB_TOKEN`: GitHub token used to open FinOps issues.
    - `SLACK_WEBHOOK`: Slack Incoming Webhook URL for alerting.

    ## Inputs

    - `warehouse_name` (STRING, default `COMPUTE_WH`): Name of the Snowflake virtual warehouse to audit.
    - `credit_threshold` (FLOAT, default `15.0`): Maximum tolerated hourly credit consumption before alerting.
    - `github_repository` (STRING, default `my-org/snowflake-cost-governance`): Target GitHub repository for logging FinOps issues.

    ## Outputs

    - `outputs.probe_warehouse_credit_usage.row`: Aggregated credit metrics row returned by Snowflake.
    - `outputs.evaluate_credit_surge.value`: Extracted evaluation object with credit breakdowns and surge boolean flag.

    ## Quick start

    1. Configure the `SNOWFLAKE_ACCOUNT`, `SNOWFLAKE_USERNAME`, `SNOWFLAKE_PASSWORD`, `GITHUB_TOKEN`, and `SLACK_WEBHOOK` secrets.
    2. Import this flow and set `warehouse_name` to match an active Snowflake warehouse.
    3. Trigger a manual execution to verify JDBC connection and credit calculation.
    4. Enable the `hourly_warehouse_governance_check` trigger for continuous automated FinOps monitoring.

    ## How to extend

    - Add an automated `ALTER WAREHOUSE SUSPEND` statement gated behind manual approval to immediately halt runaway warehouses.
    - Pull query history details from `QUERY_HISTORY` to automatically identify the specific queries that consumed the most credits.
    - Integrate with Jira or PagerDuty for critical production billing incidents.

    ## Links

    - [Kestra Snowflake Plugin Documentation](https://kestra.io/plugins/plugin-jdbc-snowflake)
    - [Snowflake WAREHOUSE_METERING_HISTORY View](https://docs.snowflake.com/en/sql-reference/account-usage/warehouse_metering_history)
    - [Kestra GitHub Plugin](https://kestra.io/plugins/plugin-github)
    - [Kestra Slack Plugin](https://kestra.io/plugins/plugin-slack)

  tags:
    - Data
    - Cloud
  subTags:
    - FinOps & Cost Management
    - Monitoring & Alerting
  ee: false
  demo: false
