id: cloudformation-failed-cleanup
namespace: company.finops

description: |
  Finds CloudFormation stacks stuck in ROLLBACK_COMPLETE or DELETE_FAILED for
  over 30 days and reports them for cleanup. Failed stacks hold onto resources,
  block stack names, and confuse every future deploy.

inputs:
  - id: aws_regions
    type: ARRAY
    itemType: STRING
    defaults: ["us-east-1"]
    description: AWS regions to scan for failed stacks.
  - id: max_age_days
    type: INT
    defaults: 30
    description: Failed stacks older than this many days are reported (default 30).

tasks:
  - id: check_stacks
    type: io.kestra.plugin.core.flow.ForEach
    description: Scan CloudFormation stacks region by region.
    values: "{{ inputs.aws_regions }}"
    tasks:
      - id: audit_region
        type: io.kestra.plugin.aws.cli.AwsCLI
        description: List stacks in failed states and filter by age.
        commands:
          - |
            REGION="{{ taskrun.value }}"
            MAX_AGE={{ inputs.max_age_days }}
            CUTOFF_EPOCH=$(date -u -d "$MAX_AGE days ago" +%s)
            echo "Scanning failed CloudFormation stacks in $REGION (older than $MAX_AGE days)"
            aws cloudformation list-stacks --region "$REGION" \
              --stack-status-filter ROLLBACK_COMPLETE DELETE_FAILED \
              --query 'StackSummaries[].[StackName,StackStatus,CreationTime]' --output json > /tmp/stacks.json
            python3 -c "
            import json, datetime, os
            cutoff = $CUTOFF_EPOCH
            stacks = json.load(open('/tmp/stacks.json'))
            out = []
            for s in stacks:
                name, status, created = s
                # CreationTime like '2024-01-15T10:30:00.000Z'
                try:
                    ts = created.replace('Z', '+00:00')
                    epoch = int(datetime.datetime.fromisoformat(ts).timestamp())
                except Exception:
                    continue
                age_days = (int(datetime.datetime.now(datetime.timezone.utc).timestamp()) - epoch) // 86400
                if epoch < cutoff:
                    out.append(f'{name} [{status}, {age_days}d old]')
                    print(f'stack {name}: {status}, {age_days} days old')
            open('/tmp/found.txt', 'w').write('\n'.join(out))
            print(f'FOUND_COUNT={len(out)}')
            "
            FOUND_COUNT=$(wc -l < /tmp/found.txt | tr -d ' ')
            FOUND_LIST=$(paste -sd' ' /tmp/found.txt | head -c 1500)
            if [ "$FOUND_COUNT" -gt 0 ]; then HAS_FAILED=true; else HAS_FAILED=false; fi
            echo "HAS_FAILED=$HAS_FAILED"
            echo "FOUND_COUNT=$FOUND_COUNT"
            echo "FAILED_STACKS=$FOUND_LIST"
            echo "REGION_DONE=$REGION"
        env:
          AWS_ACCESS_KEY_ID: "{{ secret('AWS_ACCESS_KEY_ID') }}"
          AWS_SECRET_ACCESS_KEY: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
          AWS_DEFAULT_REGION: "{{ taskrun.value }}"
      - id: notify_region
        type: io.kestra.plugin.core.flow.If
        description: Report failed stacks, stay quiet when every stack is healthy.
        condition: "{{ outputs.audit_region.vars.HAS_FAILED == 'true' }}"
        then:
          - id: slack_failed
            type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
            url: "{{ secret('SLACK_WEBHOOK_URL') }}"
            payload: |
              {
                "text": ":warning: CloudFormation cleanup `{{ outputs.audit_region.vars.REGION_DONE }}` — *{{ outputs.audit_region.vars.FOUND_COUNT }}* stack(s) stuck in a failed state for {{ inputs.max_age_days }}+ days.\n`{{ outputs.audit_region.vars.FAILED_STACKS }}`\nDelete them from the console (retain resources first if anything is still needed)."
              }
        else:
          - id: log_clean
            type: io.kestra.plugin.core.log.Log
            message: "No stale failed CloudFormation stacks in {{ outputs.audit_region.vars.REGION_DONE }} — every stack is healthy or recently touched."

triggers:
  - id: weekly
    type: io.kestra.plugin.core.trigger.Schedule
    description: Weekly on Sunday at 05:30 UTC. Shipped disabled; enable after your first manual run.
    cron: "30 5 * * 0"
    disabled: true

extend:
  title: CloudFormation Failed Cleanup
  metaTitle: Find Stale Failed CloudFormation Stacks | Kestra
  shortDescription: Find CloudFormation stacks stuck in ROLLBACK_COMPLETE or DELETE_FAILED for over 30 days and get a Slack report for cleanup.
  metaDescription: Failed CloudFormation stacks block names and hold resources. This flow reports stale failed stacks weekly.
  description: |
    A stack in ROLLBACK_COMPLETE is a deploy that failed and never got retried. A stack in DELETE_FAILED is worse — deletion failed partway and now the half-deleted resources linger. Both block the stack name forever and confuse every future deployment. They accumulate silently because nobody pages on them. This blueprint surfaces them.

    ## How it works

    1. A Schedule trigger fires weekly on Sunday at 05:30 UTC (shipped disabled).
    2. A ForEach loop scans each region in `aws_regions`.
    3. Per region, the flow lists stacks in `ROLLBACK_COMPLETE` and `DELETE_FAILED` states.
    4. Stacks older than `max_age_days` (default 30) are flagged — recent failures are still being worked on, old ones are forgotten.
    5. An `If` task posts a Slack report with the stale failed stack names, statuses, and ages.

    ## What you get

    - A weekly list of stale failed stacks with status and age as evidence.
    - The age filter keeps the report focused on forgotten stacks, not in-flight incidents.
    - Multi-region coverage in one run.
    - Silence when every stack is healthy.

    ## Who it's for

    Platform teams running CloudFormation or CDK who want failed-stack hygiene without manual console spelunking.

    ## Why orchestrate this with Kestra

    Failed-stack hygiene is a recurring cross-region audit — perfect for a scheduled flow. The age threshold is an input, every run is logged for audit, and the report lands in Slack where the cleanup actually gets done.

    ## Prerequisites

    - AWS credentials with `cloudformation:ListStacks` permission.
    - A Slack incoming webhook URL.

    ### Secrets

    - `AWS_ACCESS_KEY_ID`: AWS access key for the CloudFormation API calls.
    - `AWS_SECRET_ACCESS_KEY`: AWS secret key for the CloudFormation API calls.
    - `SLACK_WEBHOOK_URL`: Incoming webhook URL for the failed-stack report.

    ## Quick start

    1. Add the three secrets above to your Kestra namespace.
    2. Set `aws_regions` to the regions where you deploy CloudFormation.
    3. Run manually once and review the stale failed stacks.
    4. Enable the weekly schedule trigger.

    ## How to extend

    - Describe each failed stack's events to include the root failure reason in the report.
    - Auto-delete `ROLLBACK_COMPLETE` stacks with zero resources after N consecutive flagged weeks.
    - Also cover `UPDATE_ROLLBACK_COMPLETE` stacks that never got a successful follow-up deploy.

    ## Links

    - [Kestra AWS plugins](https://kestra.io/plugins)
    - [Kestra Slack plugins](https://kestra.io/plugins)
    - [CloudFormation stack status codes](https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/using-cfn-describing-stacks.html)
    - [Deleting a stack](https://docs.aws.amazon.com/cli/latest/reference/cloudformation/delete-stack.html)
  tags:
    - Infrastructure
  subTags:
    - Day 2 Operations
  ee: false
  demo: false
