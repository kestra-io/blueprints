id: s3-lifecycle-governance-guard
namespace: company.team
description: |
  Audit every S3 bucket for a lifecycle configuration and optionally
  enforce one. Buckets without lifecycle rules accumulate old versions and
  stale objects forever — this flow lists all buckets, checks each one,
  and (in enforce mode) applies an Intelligent-Tiering transition rule so
  cold data stops sitting in Standard storage. Dry-run by default; nothing
  changes unless you flip `enforce` to true.

triggers:
  - id: weekly_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: Runs every Sunday at 03:00 UTC. Shipped disabled; enable after a first successful manual run.
    cron: "0 3 * * 0"
    disabled: true

inputs:
  - id: aws_region
    type: STRING
    defaults: us-east-1
    description: AWS region to audit.
  - id: enforce
    type: BOOL
    defaults: false
    description: When true, applies the lifecycle rule to buckets missing one. When false, audit only.
  - id: transition_days
    type: INT
    defaults: 30
    description: Days after which objects transition to Intelligent-Tiering when enforcing.

tasks:
  - id: audit_buckets
    type: io.kestra.plugin.aws.cli.AwsCLI
    description: Check the lifecycle configuration of every bucket.
    region: "{{ inputs.aws_region }}"
    accessKeyId: "{{ secret('AWS_ACCESS_KEY_ID') }}"
    secretKeyId: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
    commands:
      - |
        echo "Auditing S3 buckets in {{ inputs.aws_region }} (enforce={{ inputs.enforce }})"
        for BUCKET in $(aws s3api list-buckets --query "Buckets[].Name" --output text --region "{{ inputs.aws_region }}"); do
          if aws s3api get-bucket-lifecycle-configuration --bucket "$BUCKET" --region "{{ inputs.aws_region }}" >/dev/null 2>&1; then
            echo "OK $BUCKET has lifecycle configuration"
          else
            if [ "{{ inputs.enforce }}" = "true" ]; then
              aws s3api put-bucket-lifecycle-configuration --bucket "$BUCKET" --region "{{ inputs.aws_region }}" \
                --lifecycle-configuration '{"Rules":[{"ID":"intelligent-tiering-guard","Status":"Enabled","Filter":{"Prefix":""},"Transitions":[{"Days":{{ inputs.transition_days }},"StorageClass":"INTELLIGENT_TIERING"}]}]}'
              echo "ENFORCED $BUCKET lifecycle rule applied"
            else
              echo "MISSING $BUCKET no lifecycle configuration (dry-run)"
            fi
          fi
        done

  - id: decide_notification
    type: io.kestra.plugin.core.flow.If
    description: Send a different summary depending on whether anything was enforced.
    condition: "{{ outputs.audit_buckets.stdout contains 'ENFORCED' }}"
    then:
      - id: notify_enforced
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Report which buckets got a lifecycle rule.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": ":white_check_mark: *S3 lifecycle governance* — rules enforced in `{{ inputs.aws_region }}`:\n```{{ outputs.audit_buckets.stdout }}```"
          }
    else:
      - id: notify_audit
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Report the audit result without changes.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": ":mag: *S3 lifecycle audit* (`{{ inputs.aws_region }}`, dry-run):\n```{{ outputs.audit_buckets.stdout }}```"
          }

extend:
  title: S3 Lifecycle Governance Guard
  metaTitle: Audit and Enforce S3 Lifecycle Policies | Kestra
  shortDescription: Audit every S3 bucket for a lifecycle configuration and optionally enforce Intelligent-Tiering transitions — dry-run by default, nothing changes unless you say so.
  metaDescription: Find S3 buckets without lifecycle policies and optionally enforce Intelligent-Tiering. Weekly audit with Slack reporting, dry-run by default.
  description: |
    Buckets without lifecycle rules accumulate old versions and stale objects forever, and the Standard storage bill grows every month. Nobody audits this because checking fifty buckets by hand is miserable. This blueprint does the audit weekly and — only if you opt in — applies a sensible Intelligent-Tiering rule where one is missing.

    ## How it works

    1. A Schedule trigger fires weekly on Sunday at 03:00 UTC (shipped disabled).
    2. An audit task lists every bucket, checks its lifecycle configuration, and — in enforce mode — applies an Intelligent-Tiering transition rule after `transition_days`.
    3. An `If` task picks the notification: one Slack message when rules were enforced, a different one for a clean or dry-run audit.

    ## What you get

    - A weekly inventory of which buckets lack lifecycle governance.
    - Automatic cost control: cold data moves to Intelligent-Tiering instead of sitting in Standard.
    - Dry-run by default — the flow reports without changing anything until you flip `enforce` to true.
    - A Slack paper trail of every enforcement action.

    ## Who it's for

    FinOps-minded platform teams and DevOps engineers responsible for AWS spend who suspect their S3 bill has a lifecycle-shaped hole in it.

    ## Why orchestrate this with Kestra

    A one-off script run from a laptop is forgotten next week. As a scheduled Kestra flow the audit runs itself, every run is logged, and the enforce toggle is a visible input — not a code change — so enabling enforcement is a deliberate, reviewable decision.

    ## Prerequisites

    - AWS credentials with `s3:ListAllMyBuckets`, `s3:GetLifecycleConfiguration`, and (for enforce mode) `s3:PutLifecycleConfiguration`.
    - A Slack incoming webhook URL.

    ### Secrets

    - `AWS_ACCESS_KEY_ID`: AWS access key for the S3 API calls.
    - `AWS_SECRET_ACCESS_KEY`: AWS secret key for the S3 API calls.
    - `SLACK_WEBHOOK_URL`: Incoming webhook URL for the audit report.

    ## Quick start

    1. Add the three secrets above to your Kestra namespace.
    2. Run once with `enforce: false` and review the Slack report.
    3. When happy, set `enforce: true` and re-run to apply the rules.
    4. Enable the weekly schedule trigger.

    ## How to extend

    - Add versioning cleanup (noncurrent version expiration) to the enforced rule.
    - Push findings to a dashboard or a weekly email digest.
    - Scope the audit with a bucket-name prefix input for large organizations.

    ## Links

    - [Kestra AWS plugins](https://kestra.io/plugins)
    - [Kestra Slack plugins](https://kestra.io/plugins)
    - [S3 put-bucket-lifecycle-configuration API](https://docs.aws.amazon.com/cli/latest/reference/s3api/put-bucket-lifecycle-configuration.html)
  tags:
    - Infrastructure
  subTags:
    - FinOps & Cost Management
    - Day 2 Operations
  ee: false
  demo: false
