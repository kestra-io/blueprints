id: s3-lifecycle-governance-guard
namespace: company.team
description: |
  Audit every S3 bucket for a lifecycle configuration and optionally
  enforce one. Buckets without lifecycle rules accumulate old versions and
  stale objects forever — this flow lists all buckets, checks each one,
  and (in enforce mode) applies an Intelligent-Tiering transition rule so
  cold data stops sitting in Standard storage. Dry-run by default; nothing
  changes unless you flip `enforce` to true.

triggers:
  - id: weekly_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: Runs every Sunday at 03:00 UTC. Shipped disabled; enable after a first successful manual run.
    cron: "0 3 * * 0"
    disabled: true

inputs:
  - id: aws_region
    type: STRING
    defaults: us-east-1
    description: AWS region to audit.
  - id: enforce
    type: BOOL
    defaults: false
    description: When true, applies the lifecycle rule to buckets missing one. When false, audit only.
  - id: transition_days
    type: INT
    defaults: 30
    description: Days after which objects transition to Intelligent-Tiering when enforcing.

tasks:
  - id: audit_buckets
    type: io.kestra.plugin.aws.cli.AwsCLI
    description: Check the lifecycle configuration of every bucket.
    region: "{{ inputs.aws_region }}"
    accessKeyId: "{{ secret('AWS_ACCESS_KEY_ID') }}"
    secretKeyId: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
    commands:
      - |
        echo "Auditing S3 buckets in {{ inputs.aws_region }} (enforce={{ inputs.enforce }})"
        for BUCKET in $(aws s3api list-buckets --query "Buckets[].Name" --output text --region "{{ inputs.aws_region }}"); do
          if aws s3api get-bucket-lifecycle-configuration --bucket "$BUCKET" --region "{{ inputs.aws_region }}" >/dev/null 2>&1; then
            echo "OK $BUCKET has lifecycle configuration"
          else
            if [ "{{ inputs.enforce }}" = "true" ]; then
              aws s3api put-bucket-lifecycle-configuration --bucket "$BUCKET" --region "{{ inputs.aws_region }}" \
                --lifecycle-configuration '{"Rules":[{"ID":"intelligent-tiering-guard","Status":"Enabled","Filter":{"Prefix":""},"Transitions":[{"Days":{{ inputs.transition_days }},"StorageClass":"INTELLIGENT_TIERING"}]}]}'
              echo "ENFORCED $BUCKET lifecycle rule applied"
            else
              echo "MISSING $BUCKET no lifecycle configuration (dry-run)"
            fi
          fi
        done

  - id: decide_notification
    type: io.kestra.plugin.core.flow.If
    description: Send a different summary depending on whether anything was enforced.
    condition: "{{ outputs.audit_buckets.stdout contains 'ENFORCED' }}"
    then:
      - id: notify_enforced
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Report which buckets got a lifecycle rule.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": ":white_check_mark: *S3 lifecycle governance* — rules enforced in `{{ inputs.aws_region }}`:\n```{{ outputs.audit_buckets.stdout }}```"
          }
    else:
      - id: notify_audit
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Report the audit result without changes.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": ":mag: *S3 lifecycle audit* (`{{ inputs.aws_region }}`, dry-run):\n```{{ outputs.audit_buckets.stdout }}```"
          }
