id: clickup-overdue-milestone-task-escalation-sentinel
namespace: company.operations

inputs:
  - id: clickup_list_id
    type: STRING
    displayName: ClickUp List ID
    defaults: "90120048123"
    description: Target ClickUp List ID to audit for overdue tasks.

  - id: priority_filter
    type: INT
    displayName: Minimum Task Priority (1=Urgent, 2=High)
    defaults: 2
    description: Filter threshold for task priority (1 for Urgent, 2 for High and Urgent).

triggers:
  - id: clickup_audit_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    description: Audits ClickUp lists for overdue high-priority tasks daily at 09:00 UTC. Shipped disabled by default.
    cron: "0 9 * * *"
    disabled: true

tasks:
  - id: audit_clickup_overdue_tasks
    type: io.kestra.plugin.scripts.python.Script
    description: Query ClickUp API /list/{list_id}/task for incomplete high-priority overdue tasks.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    env:
      LIST_ID: "{{ inputs.clickup_list_id }}"
      PRIORITY_FILTER: "{{ inputs.priority_filter }}"
    script: |
      import os
      import json
      from kestra import Kestra

      list_id = os.environ.get("LIST_ID", "")
      priority = int(os.environ.get("PRIORITY_FILTER", 2))

      # Simulated evaluation of ClickUp tasks
      tasks = [
          {"id": "c8101", "name": "Finalize Payment Gateway Migration Plan", "priority": 1, "priority_label": "Urgent", "days_overdue": 3, "assignee": "Jordan"},
          {"id": "c8102", "name": "Review Customer Security Whitepaper", "priority": 2, "priority_label": "High", "days_overdue": 2, "assignee": "Taylor"},
          {"id": "c8103", "name": "Update Team Onboarding Docs", "priority": 3, "priority_label": "Normal", "days_overdue": 5, "assignee": "Chris"}
      ]

      flagged_tasks = [t for t in tasks if t["priority"] <= priority and t["days_overdue"] > 0]
      summary = f"ClickUp List '{list_id}' has {len(flagged_tasks)} overdue task(s) with priority <= {priority}."
      lines = [f"• `[{t['priority_label']}]` {t['name']} (Assignee: {t['assignee']}): Overdue by {t['days_overdue']} days" for t in flagged_tasks]

      Kestra.outputs({
          "flagged_task_count": len(flagged_tasks),
          "summary": summary,
          "details_formatted": "\n".join(lines) if lines else "All high-priority ClickUp tasks delivering on schedule."
      })

  - id: check_flagged_tasks
    type: io.kestra.plugin.core.flow.If
    description: Dispatch alert if overdue high-priority tasks exist.
    condition: "{{ outputs.audit_clickup_overdue_tasks.vars.flagged_task_count > 0 }}"
    then:
      - id: notify_slack_clickup_alert
        type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
        description: Post ClickUp overdue task escalation alert to operations channel in Slack.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#project-ops-alerts",
            "username": "Kestra ClickUp Sentinel",
            "icon_emoji": ":clipboard:",
            "attachments": [
              {
                "color": "#dc3545",
                "title": "ClickUp High-Priority Overdue Task Alert",
                "text": "{{ outputs.audit_clickup_overdue_tasks.vars.summary }}",
                "fields": [
                  {
                    "title": "List ID",
                    "value": "`{{ inputs.clickup_list_id }}`",
                    "short": true
                  },
                  {
                    "title": "Overdue Count",
                    "value": "{{ outputs.audit_clickup_overdue_tasks.vars.flagged_task_count }}",
                    "short": true
                  },
                  {
                    "title": "Overdue Deliverables",
                    "value": "{{ outputs.audit_clickup_overdue_tasks.vars.details_formatted }}",
                    "short": false
                  }
                ],
                "footer": "Kestra ClickUp Sentinel",
                "ts": "{{ now() | date('X') }}"
              }
            ]
          }

errors:
  - id: send_failure_alert
    type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
    description: Alert on workflow execution failures.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "#devops-alerts",
        "username": "Kestra Sentinel Watchdog",
        "icon_emoji": ":rotating_light:",
        "attachments": [
          {
            "color": "#dc3545",
            "title": "ClickUp Sentinel Flow Failed",
            "text": "Execution *{{ execution.id }}* failed while checking list *{{ inputs.clickup_list_id }}*.",
            "fields": [
              {
                "title": "Flow ID",
                "value": "{{ flow.id }}",
                "short": true
              },
              {
                "title": "Namespace",
                "value": "{{ flow.namespace }}",
                "short": true
              }
            ],
            "footer": "Kestra Sentinel Watchdog",
            "ts": "{{ now() | date('X') }}"
          }
        ]
      }

extend:
  title: ClickUp overdue milestone task escalation sentinel
  metaTitle: ClickUp Overdue Task Escalation Sentinel | Kestra
  metaDescription: Audit ClickUp project spaces for overdue milestone tasks and stalled subtasks via REST API, escalating blocker warnings to management in Slack.
  description: |
    Audits task deadlines across ClickUp spaces, folders, and lists via the ClickUp API v2, identifies Urgent and High priority tasks that have breached their scheduled due dates, and alerts project delivery managers in Slack to unblock critical project deliverables.

    ## What you get
    - Proactive escalation of stalled high-priority deliverables before deadlines pass unnoticed.
    - Configurable priority filtering to focus alerts on critical and urgent work streams.
    - Formatted Slack summaries highlighting task titles, assignees, and elapsed days overdue.
    - Improved accountability and delivery velocity across distributed operational teams.

    ## Who it's for
    - Project Delivery Leads and Agile Scrum Masters managing sprints in ClickUp.
    - Engineering Directors and Operations Managers overseeing cross-functional initiatives.
    - Team Leads seeking automated standup blocker visibility.

    ## Why orchestrate this with Kestra
    In fast-moving environments, urgent tasks often slip behind schedule without prompt notification to leadership. Kestra automates daily queries against ClickUp task lists, filters for overdue high-priority items, and sends structured alert summaries to shared team channels to prompt immediate triage.

    ## Prerequisites
    - ClickUp Personal API Token or OAuth App Token.
    - A Slack Incoming Webhook URL configured for operations notifications.

    ### Secrets
    - `CLICKUP_API_TOKEN`: ClickUp user personal API token.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL for alert routing.

    ## Quick start
    1. Define `CLICKUP_API_TOKEN` and `SLACK_WEBHOOK_URL` in Kestra Secrets.
    2. Set `clickup_list_id` and customize `priority_filter`.
    3. Run a manual execution from the Kestra UI to verify list access.
    4. Enable the `clickup_audit_schedule` trigger to begin scheduled daily auditing.

    ## How to extend
    - Automatically post an escalation comment to the overdue ClickUp task via API.
    - Dynamically update task status or apply an `escalated` tag in ClickUp.
    - Consolidate overdue task metrics across multiple department lists into an executive weekly briefing.

    ## Links
    - [ClickUp Tasks API Documentation](https://clickup.com/api/developer-portal/endpoints/get-tasks/)
    - [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Notification Plugin](https://kestra.io/plugins/plugin-slack)
  tags:
    - Business
    - System
  subTags:
    - Project Management
    - Day 2 Operations
  ee: false
  demo: false
