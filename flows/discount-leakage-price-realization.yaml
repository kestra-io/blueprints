id: discount-leakage-price-realization
namespace: company.team

description: |
  Monthly pricing control: compare every invoiced line with the price book and with the quote
  that was approved, measure the price waterfall (list, on-invoice discount, off-invoice
  rebates and free goods, pocket price), find discounts above each rep's authority with no
  approval, invoices billed below the approved quote, expired promotions still applied,
  customers who receive more than their tier allows and rebates paid on volumes never reached,
  quantify the leakage, and track price realisation by product, segment and rep over time.

inputs:
  - id: month
    type: STRING
    displayName: Month (YYYY-MM)
    defaults: "2026-09"
    validator: ^\d{4}-(0[1-9]|1[0-2])$

  - id: scenario
    type: SELECT
    displayName: Demo scenario
    description: ISSUES adds an invoice line for a product missing from the price book and a quote approved by someone with no approval authority, which must stop the analysis.
    values:
      - CLEAN
      - ISSUES
    defaults: CLEAN

  - id: leakage_alert
    type: FLOAT
    displayName: Leakage alert (share of list revenue, %)
    description: Above this, the month needs the commercial director's sign-off.
    defaults: 1.0

  - id: approved_by
    type: STRING
    displayName: Approved by
    defaults: ""

variables:
  state_key: price_realization
  pack_dir: "pricing/{{ inputs.month }}"

concurrency:
  limit: 1

tasks:
  - id: state
    type: io.kestra.plugin.core.output.OutputValues
    values:
      s: "{{ kv(vars.state_key, errorOnMissing=false) ?? {'months': {}} | toJson }}"

  - id: period_gate
    type: io.kestra.plugin.core.flow.If
    condition: "{{ fromJson(outputs.state.values.s).months | keys contains inputs.month }}"
    then:
      - id: already_closed
        type: io.kestra.plugin.core.execution.Fail
        errorMessage: "The {{ inputs.month }} pricing review is already signed off."

  - id: analyse
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: >
      One DuckDB session: price book, discount authority matrix, customer tiers, promotions,
      quotes and approvals, invoice lines and rebate agreements (demo generator or your CPQ,
      ERP and rebate system), the price waterfall, the leakage findings, the realisation
      trend and the checks.
    outputFiles:
      - waterfall
      - findings
      - realization
      - blockers
    fetchType: FETCH_ONE
    sql: |
      SET VARIABLE m0 = DATE '{{ inputs.month }}-01';
      SET VARIABLE m1 = (DATE '{{ inputs.month }}-01' + INTERVAL 1 MONTH - INTERVAL 1 DAY)::DATE;

      -- =======================================================================
      -- Commercial policy. Replace with your price book, authority matrix,
      -- customer tiers, promotions and rebate agreements.
      -- =======================================================================
      CREATE TABLE price_book (sku VARCHAR, family VARCHAR, list_price DOUBLE, floor_price DOUBLE);
      INSERT INTO price_book VALUES
        ('LIC-PRO', 'Software', 1200, 780), ('LIC-ENT', 'Software', 3000, 1950), ('SUP-PREM', 'Support', 600, 480),
        ('HW-GW', 'Hardware', 850, 640), ('HW-SENS', 'Hardware', 140, 105), ('SVC-DAY', 'Services', 1400, 1120);
      -- Discount authority: the deepest discount each role may give without approval.
      CREATE TABLE authority (role VARCHAR, max_discount DOUBLE);
      INSERT INTO authority VALUES ('REP', 0.10), ('SALES_MANAGER', 0.20), ('SALES_DIRECTOR', 0.30), ('CRO', 0.45);
      CREATE TABLE people (person VARCHAR, role VARCHAR);
      INSERT INTO people SELECT 'REP-' || lpad(i::VARCHAR, 2, '0'), 'REP' FROM range(1, 13) t(i);
      INSERT INTO people VALUES ('MGR-01', 'SALES_MANAGER'), ('MGR-02', 'SALES_MANAGER'), ('DIR-01', 'SALES_DIRECTOR'), ('CRO', 'CRO');
      -- Customer tiers: the standing discount a customer is entitled to.
      CREATE TABLE customers AS
      SELECT 'CUS-' || lpad(i::VARCHAR, 3, '0') AS customer, ['GOLD', 'SILVER', 'SILVER', 'BRONZE', 'BRONZE', 'BRONZE'][1 + i % 6] AS tier,
             ['Enterprise', 'Mid-market', 'SMB'][1 + i % 3] AS segment, 'REP-' || lpad((1 + i % 12)::VARCHAR, 2, '0') AS rep
      FROM range(1, 91) t(i);
      CREATE TABLE tiers (tier VARCHAR, standing_discount DOUBLE); INSERT INTO tiers VALUES ('GOLD', 0.15), ('SILVER', 0.08), ('BRONZE', 0.0);
      CREATE TABLE promotions (promo VARCHAR, sku VARCHAR, discount DOUBLE, valid_from DATE, valid_to DATE);
      INSERT INTO promotions VALUES ('SUMMER-HW', 'HW-GW', 0.12, DATE '2026-06-01', DATE '2026-08-31'), ('Q3-SVC', 'SVC-DAY', 0.10, DATE '2026-07-01', DATE '2026-09-30');
      -- Rebates: a share of the year's purchases, payable only above a volume threshold.
      CREATE TABLE rebates (customer VARCHAR, threshold DOUBLE, rate DOUBLE);
      INSERT INTO rebates SELECT customer, 25000, 0.03 FROM customers WHERE tier = 'GOLD';

      -- =======================================================================
      -- Quotes (with the discount approved) and invoice lines. The demo plants:
      -- a rep giving 25% without approval, an invoice billed below its quote, an
      -- expired promotion still applied in September, a Bronze customer given a
      -- Gold discount, free goods off the invoice, and a rebate accrued for a
      -- customer far below its threshold.
      -- =======================================================================
      CREATE TABLE quotes AS
      SELECT 'Q-' || lpad(i::VARCHAR, 4, '0') AS quote, c.customer, c.rep, pb.sku,
             1 + (hash(i) % 20)::INT AS qty,
             least(t.standing_discount + CASE WHEN hash(i || 'd') % 4 = 0 THEN 0.05 ELSE 0 END, 0.45) AS quoted_discount,
             NULL::VARCHAR AS approved_by, NULL::VARCHAR AS promo,
             (DATE '2026-04-01' + ((i * 3) % 180)::INT)::DATE AS quoted_on
      FROM range(1, 601) t(i)
      JOIN customers c ON c.customer = 'CUS-' || lpad((1 + i % 90)::VARCHAR, 3, '0')
      JOIN tiers t ON t.tier = c.tier
      JOIN (SELECT sku, row_number() OVER (ORDER BY sku) - 1 AS k FROM price_book) pb ON pb.k = i % 6;
      -- Quotes above the rep's authority were approved by a manager or director.
      UPDATE quotes SET approved_by = CASE WHEN quoted_discount > 0.20 THEN 'DIR-01' ELSE 'MGR-0' || (1 + hash(quote) % 2) END WHERE quoted_discount > 0.10;
      -- Planted findings, on quotes invoiced this month (invoiced 10 to 29 days after the quote).
      CREATE TABLE planted AS
      SELECT quote, row_number() OVER (ORDER BY quote) AS n FROM quotes
      WHERE quoted_on BETWEEN getvariable('m0') - 9 AND getvariable('m0') - 1 AND sku <> 'HW-GW';
      UPDATE quotes SET quoted_discount = 0.25, approved_by = NULL WHERE quote IN (SELECT quote FROM planted WHERE n IN (1, 2, 3));      -- above authority, no approval
      UPDATE quotes SET quoted_discount = 0.15, approved_by = 'MGR-01'
        WHERE quote IN (SELECT quote FROM planted WHERE n IN (4, 5)) AND customer IN (SELECT customer FROM customers WHERE tier = 'BRONZE');  -- Gold discount to Bronze
      UPDATE quotes SET quoted_discount = 0.30, approved_by = 'DIR-01'
        WHERE quote IN (SELECT quote FROM planted WHERE n = 6);                                                                     -- director-approved 30%, far above tier
      -- An expired summer promotion still applied to September gateway quotes.
      UPDATE quotes SET promo = 'SUMMER-HW', quoted_discount = 0.12 WHERE sku = 'HW-GW' AND quoted_on BETWEEN DATE '2026-09-01' AND DATE '2026-09-20';
      -- The current services promotion, applied correctly.
      UPDATE quotes SET promo = 'Q3-SVC', quoted_discount = 0.10 WHERE sku = 'SVC-DAY' AND quoted_on BETWEEN DATE '2026-08-15' AND DATE '2026-09-10' AND quoted_discount < 0.10;
      {% if inputs.scenario == 'ISSUES' %}
      UPDATE quotes SET approved_by = 'REP-05', quoted_discount = 0.18 WHERE quote = 'Q-0019';
      {% endif %}

      CREATE TABLE invoice_lines AS
      SELECT 'INV-' || q.quote AS invoice, q.quote, q.customer, q.rep, q.sku, q.qty, (q.quoted_on + 10 + (hash(q.quote) % 20)::INT)::DATE AS invoiced_on,
             pb.list_price, round(pb.list_price * (1 - q.quoted_discount), 2) AS net_price,
             0.0 AS free_qty
      FROM quotes q JOIN price_book pb USING (sku);
      UPDATE invoice_lines SET net_price = round(net_price * 0.9, 2) WHERE quote IN (SELECT quote FROM planted WHERE n IN (7, 8));   -- billed below the approved quote
      UPDATE invoice_lines SET free_qty = 2 WHERE quote IN (SELECT quote FROM planted WHERE n IN (9, 10));                           -- free goods shipped off the invoice
      {% if inputs.scenario == 'ISSUES' %}
      INSERT INTO invoice_lines VALUES ('INV-X1', NULL, 'CUS-004', 'REP-04', 'HW-NEW', 5, getvariable('m0') + 5, NULL, 400, 0);
      {% endif %}
      -- Rebates accrued in the ledger this year, per customer.
      -- One Bronze customer has a rebate accrued but no rebate agreement at all.
      CREATE TABLE rebate_accruals AS SELECT 'CUS-003' AS customer, 4200.0 AS accrued;

      -- =======================================================================
      -- Checks.
      -- =======================================================================
      CREATE TABLE blockers AS
      SELECT 'SKU_NOT_IN_PRICE_BOOK' AS code, invoice AS ref, sku || ' is invoiced but has no list price' AS detail FROM invoice_lines WHERE sku NOT IN (SELECT sku FROM price_book)
      UNION ALL SELECT 'APPROVER_WITHOUT_AUTHORITY', q.quote, q.approved_by || ' (' || p.role || ', up to ' || round(100 * a.max_discount) || '%) approved ' || round(100 * q.quoted_discount) || '%'
        FROM quotes q JOIN people p ON p.person = q.approved_by JOIN authority a ON a.role = p.role WHERE q.quoted_discount > a.max_discount;

      -- =======================================================================
      -- The price waterfall for the month's invoices.
      -- =======================================================================
      CREATE TABLE lines AS
      SELECT i.*, c.tier, c.segment, pb.family, q.quoted_discount, q.approved_by, q.promo, q.quoted_on,
             i.qty * i.list_price AS list_revenue, i.qty * i.net_price AS invoice_revenue,
             i.free_qty * i.list_price AS free_goods,
             round(i.list_price * (1 - q.quoted_discount), 2) AS quoted_price
      FROM invoice_lines i JOIN customers c USING (customer) JOIN price_book pb USING (sku) JOIN quotes q USING (quote)
      WHERE i.invoiced_on BETWEEN getvariable('m0') AND getvariable('m1');

      CREATE TABLE ytd_purchases AS
      SELECT customer, sum(qty * net_price) AS purchases FROM invoice_lines WHERE year(invoiced_on) = year(getvariable('m0')) AND invoiced_on <= getvariable('m1') AND list_price IS NOT NULL GROUP BY customer;

      -- =======================================================================
      -- Leakage findings: money given away that policy did not allow.
      -- =======================================================================
      CREATE TABLE findings AS
      SELECT 'DISCOUNT_ABOVE_AUTHORITY' AS finding, l.invoice AS ref, l.rep, l.customer,
             round(100 * l.quoted_discount) || '% given by ' || l.rep || ' (authority 10%) with no approval' AS detail,
             l.qty * l.list_price * (l.quoted_discount - greatest(0.10, t.standing_discount)) AS leakage
      FROM lines l JOIN tiers t ON t.tier = l.tier
      WHERE l.approved_by IS NULL AND l.quoted_discount > 0.10 AND l.quoted_discount > t.standing_discount AND l.promo IS NULL
      UNION ALL
      SELECT 'BILLED_BELOW_QUOTE', invoice, rep, customer, 'Invoiced at ' || net_price || ' against an approved ' || quoted_price, qty * (quoted_price - net_price)
      FROM lines WHERE net_price < quoted_price - 0.01
      UNION ALL
      SELECT 'EXPIRED_PROMOTION', l.invoice, l.rep, l.customer, l.promo || ' applied on ' || l.quoted_on || ', valid until ' || p.valid_to, l.qty * l.list_price * p.discount
      FROM lines l JOIN promotions p ON p.promo = l.promo WHERE l.quoted_on NOT BETWEEN p.valid_from AND p.valid_to
      UNION ALL
      SELECT 'ABOVE_TIER_DISCOUNT', l.invoice, l.rep, l.customer, l.tier || ' customer given ' || round(100 * l.quoted_discount) || '%, entitled to ' || round(100 * t.standing_discount) || '%, approved by ' || l.approved_by,
             l.qty * l.list_price * (l.quoted_discount - t.standing_discount)
      FROM lines l JOIN tiers t ON t.tier = l.tier
      WHERE l.approved_by IS NOT NULL AND l.quoted_discount - t.standing_discount > 0.10
      UNION ALL
      SELECT 'FREE_GOODS', invoice, rep, customer, free_qty || ' units of ' || sku || ' shipped at no charge, off the invoice', free_goods FROM lines WHERE free_qty > 0
      UNION ALL
      SELECT 'REBATE_NOT_EARNED', a.customer, c.rep, a.customer,
             'Rebate accrued ' || a.accrued || CASE WHEN r.threshold IS NULL THEN ' with no rebate agreement'
                                                   ELSE ' but purchases ' || round(coalesce(p.purchases, 0)) || ' are below the threshold of ' || r.threshold END,
             a.accrued
      FROM rebate_accruals a JOIN customers c USING (customer) LEFT JOIN rebates r USING (customer) LEFT JOIN ytd_purchases p USING (customer)
      WHERE r.threshold IS NULL OR coalesce(p.purchases, 0) < r.threshold;

      -- Waterfall: list, on-invoice discount, off-invoice (free goods, rebates earned), pocket.
      CREATE TABLE waterfall AS
      WITH rb AS (
        SELECT sum(l.invoice_revenue * r.rate) AS earned FROM lines l JOIN rebates r USING (customer) JOIN ytd_purchases p USING (customer) WHERE p.purchases >= r.threshold
      )
      SELECT 1 AS ord, 'List revenue' AS step, sum(list_revenue) AS amount FROM lines
      UNION ALL SELECT 2, 'On-invoice discounts', -sum(list_revenue - invoice_revenue) FROM lines
      UNION ALL SELECT 3, 'Invoice revenue', sum(invoice_revenue) FROM lines
      UNION ALL SELECT 4, 'Free goods', -sum(free_goods) FROM lines
      UNION ALL SELECT 5, 'Rebates earned', -coalesce((SELECT earned FROM rb), 0)
      UNION ALL SELECT 6, 'Pocket revenue', sum(invoice_revenue) - sum(free_goods) - coalesce((SELECT earned FROM rb), 0) FROM lines;

      CREATE TABLE realization AS
      SELECT 'family' AS dimension, family AS value, round(100 * sum(invoice_revenue) / sum(list_revenue), 1) AS realization_pct, round(sum(list_revenue)) AS list_revenue FROM lines GROUP BY family
      UNION ALL SELECT 'segment', segment, round(100 * sum(invoice_revenue) / sum(list_revenue), 1), round(sum(list_revenue)) FROM lines GROUP BY segment
      UNION ALL SELECT 'rep', rep, round(100 * sum(invoice_revenue) / sum(list_revenue), 1), round(sum(list_revenue)) FROM lines GROUP BY rep
      ORDER BY dimension, realization_pct;

      COPY (SELECT step, round(amount, 2) AS amount FROM waterfall ORDER BY ord) TO '{{ outputFiles.waterfall }}' (HEADER, DELIMITER ',');
      COPY (SELECT finding, ref, rep, customer, detail, round(leakage, 2) AS leakage FROM findings ORDER BY leakage DESC) TO '{{ outputFiles.findings }}' (HEADER, DELIMITER ',');
      COPY realization TO '{{ outputFiles.realization }}' (HEADER, DELIMITER ',');
      COPY blockers TO '{{ outputFiles.blockers }}' (HEADER, DELIMITER ',');

      SELECT
        (SELECT count(*) FROM lines)::INT AS lines,
        (SELECT string_agg(step || ' ' || format('{:,.0f}', amount::DOUBLE), ', ' ORDER BY ord) FROM waterfall) AS waterfall,
        (SELECT round(100 * (SELECT amount FROM waterfall WHERE ord = 6) / (SELECT amount FROM waterfall WHERE ord = 1), 2))::DOUBLE AS pocket_pct,
        (SELECT round(coalesce(sum(leakage), 0), 2) FROM findings)::DOUBLE AS leakage,
        (SELECT round(100 * coalesce(sum(leakage), 0) / (SELECT amount FROM waterfall WHERE ord = 1), 2) FROM findings)::DOUBLE AS leakage_pct,
        (SELECT string_agg(finding || ' ' || n || ' (' || format('{:,.0f}', l) || ')', ', ' ORDER BY l DESC) FROM (SELECT finding, count(*) AS n, sum(leakage)::DOUBLE AS l FROM findings GROUP BY finding)) AS findings,
        (SELECT string_agg(value || ' ' || realization_pct || '%', ', ' ORDER BY realization_pct) FROM (SELECT * FROM realization WHERE dimension = 'rep' ORDER BY realization_pct LIMIT 3)) AS lowest_reps,
        (SELECT string_agg(value || ' ' || realization_pct || '%', ', ' ORDER BY value) FROM realization WHERE dimension = 'family') AS by_family,
        (SELECT json_group_object(value, realization_pct)::VARCHAR FROM realization WHERE dimension = 'family') AS family_json,
        (SELECT count(*) FROM blockers)::INT AS blockers,
        (SELECT coalesce(string_agg(code || ' ' || ref || ': ' || detail, '; ' ORDER BY code, ref), '') FROM blockers) AS blocker_detail;

  - id: result
    type: io.kestra.plugin.core.output.OutputValues
    values:
      r: "{{ (outputs.analyse.outputs | last).row | toJson }}"
      trend: >-
        {{ fromJson(outputs.state.values.s).months | jq('to_entries | sort_by(.key) | map("\(.key): \(.value.pocket_pct)%") | join(", ")') | first }}

  - id: log_analysis
    type: io.kestra.plugin.core.log.Log
    message: |
      Pricing review {{ inputs.month }} ({{ inputs.scenario }}).
      {{ outputs.result.values.r | jq('"\(.lines) invoice lines. \(.waterfall). Pocket price \(.pocket_pct)% of list."') | first }}
      {{ outputs.result.values.r | jq('"Leakage \(.leakage) (\(.leakage_pct)% of list): \(.findings)."') | first }}
      {{ outputs.result.values.r | jq('"Realisation by family: \(.by_family). Lowest reps: \(.lowest_reps)."') | first }}
      Pocket price trend: {{ outputs.result.values.trend == '' ? 'first month' : outputs.result.values.trend }}.
      {{ outputs.result.values.r | jq('"Blockers: \(.blockers). \(.blocker_detail)"') | first }}

  - id: evidence
    type: io.kestra.plugin.core.namespace.UploadFiles
    namespace: "{{ flow.namespace }}"
    filesMap:
      "{{ render(vars.pack_dir) }}/price-waterfall.csv": "{{ outputs.analyse.outputFiles.waterfall }}"
      "{{ render(vars.pack_dir) }}/leakage-findings.csv": "{{ outputs.analyse.outputFiles.findings }}"
      "{{ render(vars.pack_dir) }}/realization.csv": "{{ outputs.analyse.outputFiles.realization }}"
      "{{ render(vars.pack_dir) }}/blockers.csv": "{{ outputs.analyse.outputFiles.blockers }}"

  - id: decide
    type: io.kestra.plugin.core.flow.Switch
    value: >-
      {%- set r = outputs.result.values.r -%}
      {%- if (r | jq('.blockers > 0') | first) -%}BLOCKED
      {%- elseif (r | jq('.leakage_pct') | first) > inputs.leakage_alert and inputs.approved_by == '' -%}NEEDS_SIGN_OFF
      {%- else -%}CLOSE{%- endif -%}
    cases:
      CLOSE:
        - id: save
          type: io.kestra.plugin.core.kv.Set
          key: "{{ vars.state_key }}"
          kvType: JSON
          value: >-
            {{ {'old': fromJson(outputs.state.values.s), 'r': fromJson(outputs.result.values.r), 'm': inputs.month, 'by': inputs.approved_by}
               | jq('{months: (.old.months + {(.m): {pocket_pct: .r.pocket_pct, leakage: .r.leakage, by_family: (.r.family_json | fromjson), signed_off_by: .by}})}') | first | toJson }}

        - id: log_closed
          type: io.kestra.plugin.core.log.Log
          message: "Pricing review for {{ inputs.month }} closed. Findings for the sales leaders in {{ render(vars.pack_dir) }}/leakage-findings.csv."

      NEEDS_SIGN_OFF:
        - id: sign_off_required
          type: io.kestra.plugin.core.execution.Fail
          errorMessage: >-
            Leakage is {{ outputs.result.values.r | jq('.leakage_pct') | first }}% of list revenue, above {{ inputs.leakage_alert }}%:
            {{ outputs.result.values.r | jq('.findings') | first }}. Review {{ render(vars.pack_dir) }}/leakage-findings.csv and run again with approved_by.

    defaults:
      - id: blocked
        type: io.kestra.plugin.core.execution.Fail
        errorMessage: "The {{ inputs.month }} pricing review cannot run: {{ outputs.result.values.r | jq('.blocker_detail') | first }}"

extend:
  title: Find discount leakage and track price realisation from list price to pocket price
  metaTitle: Discount leakage and price realisation waterfall with Kestra and DuckDB
  shortDescription: Compare every invoice line with the price book and the approved quote, build the list-to-pocket price waterfall, find unauthorised discounts, expired promotions, free goods and unearned rebates, and track realisation.
  metaDescription: Monthly pricing control in Kestra and DuckDB. Price waterfall, discounts above authority, expired promotions, free goods, unearned rebates.
  description: |
    A point of price is often worth more to profit than a point of volume, and it leaks in small amounts nobody adds up:
    - a rep goes past their discount authority,
    - an invoice is keyed below the quote that was approved,
    - a summer promotion keeps running in September,
    - units ship free outside the invoice,
    - a rebate is accrued for a customer with no agreement.

    This flow reconciles every invoice line to the price book and the approved quote each month. It builds the price waterfall from list to pocket price, and puts a number on each leak.

    It runs with no setup and no network. The demo has:
    - six products in four families and 90 customers on Gold, Silver and Bronze tiers;
    - twelve reps under managers, a director and a CRO, with a discount authority matrix;
    - two promotions, rebates for Gold customers, and 600 quotes from April.

    Every kind of leak is planted in the month's invoices.

    This blueprint was created by [zkasuran](https://github.com/zkasuran).

    ## The waterfall

    List revenue, then on-invoice discounts, gives invoice revenue. Free goods and rebates earned are deducted from that to give pocket revenue, the money actually kept. Pocket price as a share of list is tracked month by month in KV, with realisation by product family, segment and rep.

    ## Leakage findings

    | Finding | Leakage counted |
    |---|---|
    | `DISCOUNT_ABOVE_AUTHORITY`: deeper than the rep may give, no approval | The discount beyond the rep's authority or the customer's tier |
    | `BILLED_BELOW_QUOTE`: invoice price below the approved quote | The difference |
    | `EXPIRED_PROMOTION`: a promotion applied outside its dates | The promotional discount |
    | `ABOVE_TIER_DISCOUNT`: approved, but more than 10 points above the customer's tier | The discount above the tier |
    | `FREE_GOODS`: units shipped at no charge | Their list value |
    | `REBATE_NOT_EARNED`: rebate accrued with no agreement or below its volume threshold | The accrual |

    Leakage above `leakage_alert` percent of list revenue needs the commercial director's sign-off.

    ## Controls

    - **Blocked:** an invoiced product with no list price, or a quote approved by someone beyond their own authority. That second case is a control failure, not a leak.
    - **Lock:** a signed-off month cannot be rerun.

    ## How it works

    1. `state` and `period_gate` refuse a month already signed off.
    2. `analyse` (`io.kestra.plugin.jdbc.duckdb.Queries`) holds the price book, authority matrix, people, tiers, promotions, rebates, quotes, invoice lines and accruals. It runs the checks, then builds the month's lines, the findings, the waterfall and the realisation.
    3. `result` reads the pocket price trend from earlier months. `log_analysis` prints it. `evidence` stores `price-waterfall.csv`, `leakage-findings.csv` (each finding with rep, customer, explanation and amount), `realization.csv` and `blockers.csv`.
    4. `decide` (`io.kestra.plugin.core.flow.Switch`):
       - `CLOSE` stores the month's pocket price, leakage and realisation.
       - Otherwise the run fails: `NEEDS_SIGN_OFF` or `BLOCKED`.

    ## Tested end to end

    On Kestra 2.0.3 OSS.

    | Run | Inputs | Result |
    |---|---|---|
    | 1 | 2026-09 | 99 invoice lines. List 1,296,620, discounts -92,319, invoice 1,204,301, free goods -6,280, rebates -6,825, pocket 1,191,196: 91.87% of list. Leakage 39,721 (3.06%) across all six finding types. The largest is a director-approved 30% to a Bronze customer (9,900). Stops for sign-off |
    | 2 | same, `approved_by` | Closed |
    | 3 | again | Refused |
    | 4 | 2026-08, signed off | 93.05% pocket, 1.94% leakage |
    | 5 | 2026-10 `ISSUES` | Blocked: a product without a list price, a quote where a rep approved 18% against their 10% authority |
    | 6 | 2026-10 | Expired summer promotions still on 6 lines. Trend: 2026-08 93.05%, 2026-09 91.87%, 2026-10 93.44% |

    For every month, invoice revenue equals list revenue plus discounts, and pocket revenue equals invoice revenue plus free goods and rebates.

    ## Problems found while testing

    - **Most planted leaks were invisible.** The first demo planted them on fixed quote numbers, most of which were invoiced in other months, so only 3 of 6 finding types appeared. The leaks are now placed on quotes invoiced in the month.
    - **The approver test could never fail.** The planted rep-approved quote carried a discount within the rep's own authority. It now carries 18%.
    - **Pebble cannot index a map with a key like `2026-09`.** The closed-month check now uses `keys contains`.

    ## Inputs

    | Input | Default | Purpose |
    |---|---|---|
    | `month` | `2026-09` | `YYYY-MM`, validated |
    | `scenario` | `CLEAN` | Demo only |
    | `leakage_alert` | `1.0` | Sign-off threshold, % of list |
    | `approved_by` | empty | The commercial director |

    ## Use it with your data

    - Replace the policy tables (`price_book`, `authority`, `people`, `tiers`, `promotions`, `rebates`) with your price book, approval matrix and agreements.
    - Replace `quotes` and `invoice_lines` with your CPQ quotes and ERP invoice lines linked by quote, and `rebate_accruals` with the ledger.
    - Send `leakage-findings.csv` to the sales leaders each month.

    ## Things to know

    - Leakage is measured against policy, not against what the customer would have paid. An approved discount within policy is not leakage, even when it is deep.
    - Payment terms, freight absorbed and cash discounts are further steps of the waterfall. Add them as off-invoice lines.

    ## Links

    - DuckDB plugin: https://kestra.io/plugins/plugin-jdbc-duckdb
  tags:
    - Business
    - Data
  subTags:
    - Reporting & Digests
    - Policy & Compliance
  ee: false
  demo: true
