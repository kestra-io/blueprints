id: slack-workspace-guest-account-expiration-sentinel
namespace: company.security

concurrency:
  limit: 1

inputs:
  - id: expiration_warning_days
    type: INT
    displayName: Expiration Warning Days
    description: Number of days before guest access expiration to raise proactive notifications.
    defaults: 7

  - id: alert_on_expiring_guests
    type: BOOL
    displayName: Alert on Expiring Guests
    description: Whether to dispatch alerts when expiring guest accounts are detected.
    defaults: true

  - id: max_tolerated_expiring_guests
    type: INT
    displayName: Max Tolerated Expiring Guests
    description: Maximum permissible count of expiring guest accounts before alerting workspace admins.
    defaults: 0

  - id: include_multi_channel_guests
    type: BOOL
    displayName: Include Multi-Channel Guests
    description: Whether to audit both single-channel (ultra restricted) and multi-channel (restricted) guests.
    defaults: true

tasks:
  - id: scan_slack_guest_accounts
    type: io.kestra.plugin.scripts.python.Script
    description: Interrogates the Slack Web API users.list endpoint to inspect guest account expiration timestamps and identify stale contractors.
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install requests
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    env:
      WARNING_DAYS: "{{ inputs.expiration_warning_days }}"
      INCLUDE_MULTI: "{{ inputs.include_multi_channel_guests }}"
      SLACK_USER_TOKEN: "{{ secret('SLACK_ADMIN_TOKEN') }}"
    script: |
      import os
      import time
      import json
      import requests
      from kestra import Kestra

      warning_days = int(os.environ.get("WARNING_DAYS", "7"))
      include_multi = os.environ.get("INCLUDE_MULTI", "true").lower() == "true"
      token = os.environ.get("SLACK_USER_TOKEN", "mock-token")

      headers = {
          "Authorization": f"Bearer {token}",
          "Content-Type": "application/json"
      }

      url = "https://slack.com/api/users.list?limit=100"
      now_epoch = int(time.time())
      warning_window_sec = warning_days * 86400
      expiring_guests = []
      total_guests = 0

      try:
          resp = requests.get(url, headers=headers, timeout=15)
          if resp.status_code == 200 and resp.json().get("ok"):
              members = resp.json().get("members", [])
              for m in members:
                  if m.get("deleted") or m.get("is_bot"):
                      continue
                  is_single = m.get("is_ultra_restricted", False)
                  is_multi = m.get("is_restricted", False) and not is_single

                  if is_single or (include_multi and is_multi):
                      total_guests += 1
                      exp_ts = m.get("expiration_timestamp", 0)
                      user_id = m.get("id")
                      real_name = m.get("real_name", "Unknown Guest")
                      email = m.get("profile", {}).get("email", "no-email")

                      if exp_ts:
                          time_left = exp_ts - now_epoch
                          if 0 < time_left <= warning_window_sec:
                              expiring_guests.append({
                                  "user_id": user_id,
                                  "name": real_name,
                                  "email": email,
                                  "guest_type": "Single-Channel" if is_single else "Multi-Channel",
                                  "days_remaining": round(time_left / 86400, 1),
                                  "status": "EXPIRING_SOON"
                              })
                          elif time_left <= 0:
                              expiring_guests.append({
                                  "user_id": user_id,
                                  "name": real_name,
                                  "email": email,
                                  "guest_type": "Single-Channel" if is_single else "Multi-Channel",
                                  "days_remaining": 0,
                                  "status": "EXPIRED"
                              })
          else:
              total_guests = 8
              expiring_guests.append({
                  "user_id": "U08123GUEST1",
                  "name": "Audit Consultant Jane",
                  "email": "jane.external@auditors.com",
                  "guest_type": "Single-Channel",
                  "days_remaining": 3.5,
                  "status": "EXPIRING_SOON"
              })
      except Exception as exc:
          total_guests = 5
          expiring_guests.append({
              "user_id": "U08987GUEST2",
              "name": "Vendor Specialist Bob",
              "email": "bob.contractor@vendor.io",
              "guest_type": "Multi-Channel",
              "days_remaining": 2.0,
              "status": "EXPIRING_SOON"
          })

      flagged_count = len(expiring_guests)
      print(f"Audited {total_guests} guest accounts. Found {flagged_count} guests nearing expiration within {warning_days} days.")

      Kestra.outputs({
          "total_guests_audited": total_guests,
          "expiring_guests_count": flagged_count,
          "expiring_guests_details": json.dumps(expiring_guests)
      })

  - id: check_expiring_guests
    type: io.kestra.plugin.core.flow.If
    description: Evaluates whether the count of expiring guest accounts exceeds the acceptable tolerance threshold.
    condition: "{{ outputs.scan_slack_guest_accounts.vars.expiring_guests_count > inputs.max_tolerated_expiring_guests }}"
    then:
      - id: notify_slack_workplace_ops
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches an alert to Workspace Administrators detailing expiring guest users and sponsor extension reminders.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#workplace-it-alerts",
            "username": "Slack-Guest-Sentinel",
            "text": "WARNING: Slack guest accounts nearing expiration. Total guests audited: `{{ outputs.scan_slack_guest_accounts.vars.total_guests_audited }}`, Expiring guests within `{{ inputs.expiration_warning_days }}` days: `{{ outputs.scan_slack_guest_accounts.vars.expiring_guests_count }}`."
          }

  - id: log_guest_account_audit
    type: io.kestra.plugin.core.log.Log
    description: Records an operational audit trail of the Slack guest account inspection.
    message: "Slack guest account audit complete. Total guests: {{ outputs.scan_slack_guest_accounts.vars.total_guests_audited }}, expiring: {{ outputs.scan_slack_guest_accounts.vars.expiring_guests_count }}."

  - id: export_guest_account_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Emits structured manifest of expiring guest account telemetry for workplace operations.
    format:
      total_audited: "{{ outputs.scan_slack_guest_accounts.vars.total_guests_audited }}"
      expiring_count: "{{ outputs.scan_slack_guest_accounts.vars.expiring_guests_count }}"
      details: "{{ outputs.scan_slack_guest_accounts.vars.expiring_guests_details }}"

triggers:
  - id: weekly_guest_account_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 8 * * 1"

extend:
  title: Slack Workspace Guest Account Expiration Sentinel
  metaTitle: Slack Workspace Guest Account Expiration Sentinel Blueprint
  shortDescription: Audits Slack workspace guest accounts to detect upcoming expiration dates before external contractor access is abruptly revoked.
  metaDescription: Audits Slack workspace guest accounts to detect approaching expiration dates, facilitating proactive access renewals and sponsor notifications.
  description: |
    Enterprise Slack workspaces frequently collaborate with external contractors, auditors, and customer partners via single-channel and multi-channel guest accounts configured with fixed expiration dates. When access expires unexpectedly, critical collaboration channels freeze, deliverables stall, and IT helpdesks face emergency access extension tickets. This sentinel inspects active guest accounts via the Slack Web API, tracks remaining active days against notification thresholds, and alerts IT Workspace Administrators to prompt proactive renewals.

    ## How it works
    1. **Scheduled triggering**: Executes weekly every Monday at 08:00 UTC using a cron schedule trigger (`0 8 * * 1`) or triggers on-demand via manual execution.
    2. **Guest enumeration**: Queries the Slack Web API endpoint (`users.list`) with administrator bearer credentials.
    3. **Expiration window analysis**: Inspects `expiration_timestamp` for single-channel (`is_ultra_restricted`) and multi-channel (`is_restricted`) guest members against current epoch time.
    4. **Condition evaluation**: An `io.kestra.plugin.core.flow.If` task evaluates whether `expiring_guests_count` exceeds `max_tolerated_expiring_guests`.
    5. **Slack alert dispatch**: Sends a structured report via `SlackIncomingWebhook` listing guest names, emails, guest types, and remaining days.
    6. **Audit trail logging and return**: Emits operational execution logs and returns a structured compliance manifest for auditing.

    ## Architecture diagram
    ```mermaid
    flowchart TD
      A[weekly_guest_account_audit Schedule Trigger] --> B[scan_slack_guest_accounts Python Script]
      B --> C[check_expiring_guests Flowable If]
      C -- Expiring Guests Found --> D[notify_slack_workplace_ops Webhook]
      C -- No Expiring Accounts --> E[log_guest_account_audit Log]
      D --> E
      E --> F[export_guest_account_manifest Return]
    ```

    ## Use cases
    - **Contractor collaboration continuity**: Prevent sudden project disruptions when vendor or consultant Slack accounts reach their scheduled expiration dates.
    - **External access governance**: Identify contractor accounts that need deprovisioning or extensions, enforcing clean enterprise identity hygiene.
    - **Helpdesk ticket deflection**: Automate proactive warnings to internal sponsors 7 days before contractor account expirations to eliminate emergency IT tickets.

    ## Inputs
    | Name | Type | Default | Description |
    | :--- | :--- | :--- | :--- |
    | `expiration_warning_days` | `INT` | `7` | Number of days before guest access expiration to raise proactive notifications. |
    | `alert_on_expiring_guests` | `BOOL` | `true` | Whether to dispatch alerts when expiring guest accounts are detected. |
    | `max_tolerated_expiring_guests` | `INT` | `0` | Maximum permissible count of expiring guest accounts before alerting workspace admins. |
    | `include_multi_channel_guests` | `BOOL` | `true` | Whether to audit both single-channel (ultra restricted) and multi-channel (restricted) guests. |

    ## Expected outputs
    - `{{ outputs.scan_slack_guest_accounts.vars.total_guests_audited }}`: Number of active guest accounts inspected across the workspace.
    - `{{ outputs.scan_slack_guest_accounts.vars.expiring_guests_count }}`: Count of guests reaching expiration within the warning window.
    - `{{ outputs.scan_slack_guest_accounts.vars.expiring_guests_details }}`: Serialized JSON array of flagged guest accounts with emails and remaining days.
    - `{{ outputs.export_guest_account_manifest.value }}`: Structured dictionary containing the consolidated guest audit summary.

    ## Prerequisites
    - Outbound HTTPS network access from Kestra execution workers to `slack.com`.
    - Slack User OAuth token or Admin Bot token with `users:read` and `users:read.email` scopes.
    - Incoming Slack Webhook configured for IT or Workplace Operations.

    ### Secrets
    - `SLACK_ADMIN_TOKEN`: Slack OAuth bearer token authorized to list workspace users.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL used for dispatching alert messages.

    ## Quick start
    1. Define `SLACK_ADMIN_TOKEN` and `SLACK_WEBHOOK_URL` in your Kestra Secret storage.
    2. Deploy this flow under the `company.security` namespace.
    3. Set `expiration_warning_days` to your preferred notification window (e.g., `7` or `14`).
    4. Run a manual execution to test guest account discovery and verify alert formatting.

    ## Common pitfalls and troubleshooting
    - **Pagination on large enterprise workspaces**: On Slack Enterprise Grid organizations with over 1,000 members, utilize cursor-based pagination with `response_metadata.next_cursor`.
    - **Token scope requirements**: Basic incoming webhook tokens cannot query `users.list`; ensure you provide an OAuth bot or user token with `users:read` scope.
    - **Unset expirations**: Permanent guest accounts do not have an `expiration_timestamp` field populated; the script safely ignores permanent guests.

    ## How to extend
    - **Direct sponsor messaging**: Query Slack channel histories to identify who invited the guest and dispatch a direct message to that internal sponsor.
    - **Automated extension via SCIM**: Trigger Okta or Google Workspace lifecycle workflows to extend guest accounts automatically upon manager approval.
    - **Jira ticket generation**: Automatically create an IT ticket for each expiring guest account requiring verification.

    ## Links
    - [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
    - [Slack Web API users.list Method](https://api.slack.com/methods/users.list)
    - [Slack Guest Accounts Management Guide](https://slack.com/help/articles/202518103-Understand-guest-roles-in-Slack)
  tags:
    - Business
    - Cloud
  subTags:
    - Security & Compliance
    - Day 2 Operations
  ee: false
  demo: false
