id: ollama-vram-saturation-and-eviction-sentinel
namespace: company.team
description: |
  Audit Ollama local LLM serving instances for GPU VRAM exhaustion, CPU RAM layer spilling,
  and model concurrency bottlenecks. When VRAM headroom breaches critical thresholds,
  the sentinel alerts engineering channels and optionally triggers proactive eviction
  of idle models to prevent out-of-memory crashes.

triggers:
  - id: periodic_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: Audit Ollama model memory allocation every 5 minutes.
    cron: "*/5 * * * *"
    disabled: true

inputs:
  - id: ollama_endpoint
    type: STRING
    defaults: "http://localhost:11434"
    description: "Base HTTP URL of the target Ollama instance."

  - id: total_gpu_vram_gb
    type: FLOAT
    defaults: 24.0
    description: "Total physical GPU VRAM capacity available on the host (in gigabytes, e.g. 24.0 for RTX 3090/4090 or 80.0 for A100/H100)."

  - id: vram_warning_threshold_pct
    type: INT
    defaults: 80
    description: "Percentage of GPU VRAM allocated above which a WARNING status is flagged."

  - id: vram_critical_threshold_pct
    type: INT
    defaults: 92
    description: "Percentage of GPU VRAM allocated above which a CRITICAL status is flagged."

  - id: auto_evict_idle_models
    type: BOOLEAN
    defaults: false
    description: "If true and status is CRITICAL, sends a zero keep-alive command to unload idle models and reclaim VRAM."

  - id: slack_webhook_url
    type: STRING
    required: false
    description: "Optional Slack Incoming Webhook URL to deliver actionable incident alerts."

tasks:
  - id: probe_ollama_version
    type: io.kestra.plugin.core.http.Request
    description: "Verify that the Ollama service daemon is reachable and responding."
    uri: "{{ inputs.ollama_endpoint }}/api/version"
    method: GET

  - id: fetch_running_models
    type: io.kestra.plugin.core.http.Request
    description: "Query currently loaded models, VRAM footprint, and expiration timers from the /api/ps endpoint."
    uri: "{{ inputs.ollama_endpoint }}/api/ps"
    method: GET

  - id: evaluate_vram_and_spilling
    type: io.kestra.plugin.scripts.python.Script
    description: "Analyze active model footprints, detect CPU RAM offloading bottlenecks, and assess saturation."
    containerImage: python:3.12-slim
    inputFiles:
      models_response.json: "{{ outputs.fetch_running_models.body }}"
    outputFiles:
      - metrics_summary.json
    script: |
      import json
      import sys
      from kestra import Kestra

      with open("models_response.json", "r") as f:
          raw_data = json.load(f)

      models = raw_data.get("models", [])
      total_vram_bytes = {{ inputs.total_gpu_vram_gb }} * (1024 ** 3)
      warning_pct = {{ inputs.vram_warning_threshold_pct }}
      critical_pct = {{ inputs.vram_critical_threshold_pct }}

      total_allocated_vram = 0
      total_model_size = 0
      model_details = []
      spilled_models = []

      for m in models:
          m_name = m.get("name", "unknown")
          m_size = m.get("size", 0)
          m_vram = m.get("size_vram", 0)
          m_expires = m.get("expires_at", "never")

          total_allocated_vram += m_vram
          total_model_size += m_size

          # If size_vram is less than total size, layers were offloaded to system RAM
          is_spilled = m_vram < m_size
          if is_spilled:
              spilled_models.append(m_name)

          vram_gb = round(m_vram / (1024 ** 3), 2)
          total_gb = round(m_size / (1024 ** 3), 2)

          model_details.append({
              "name": m_name,
              "vram_gb": vram_gb,
              "total_gb": total_gb,
              "spilled_to_system_ram": is_spilled,
              "expires_at": m_expires
          })

      vram_usage_pct = round((total_allocated_vram / total_vram_bytes) * 100, 2) if total_vram_bytes > 0 else 0.0

      if vram_usage_pct >= critical_pct or len(spilled_models) > 0:
          status = "CRITICAL"
      elif vram_usage_pct >= warning_pct:
          status = "WARNING"
      else:
          status = "HEALTHY"

      metrics = {
          "status": status,
          "active_model_count": len(models),
          "allocated_vram_gb": round(total_allocated_vram / (1024 ** 3), 2),
          "total_vram_gb": {{ inputs.total_gpu_vram_gb }},
          "vram_utilization_pct": vram_usage_pct,
          "spilled_models_count": len(spilled_models),
          "spilled_models": spilled_models,
          "models": model_details
      }

      print(f"[Ollama Sentinel] Health: {status} | VRAM: {vram_usage_pct}% | Active Models: {len(models)}")
      if spilled_models:
          print(f"[Warning] Models spilled to CPU RAM (severe inference latency risk): {spilled_models}")

      with open("metrics_summary.json", "w") as out:
          json.dump(metrics, out, indent=2)

      Kestra.outputs(metrics)

  - id: check_and_remediate_idle_models
    type: io.kestra.plugin.core.flow.If
    description: "Proactively unload models with keep_alive: 0s if critical VRAM pressure is detected and auto_evict is enabled."
    condition: "{{ inputs.auto_evict_idle_models and outputs.evaluate_vram_and_spilling.vars.status == 'CRITICAL' and outputs.evaluate_vram_and_spilling.vars.active_model_count > 0 }}"
    then:
      - id: log_remediation_intent
        type: io.kestra.plugin.core.log.Log
        message: "Triggering proactive eviction of active Ollama models to relieve critical VRAM saturation: {{ outputs.evaluate_vram_and_spilling.vars.models }}"

      - id: evict_each_model
        type: io.kestra.plugin.core.flow.EachSequential
        values: "{{ outputs.evaluate_vram_and_spilling.vars.models }}"
        tasks:
          - id: unload_model
            type: io.kestra.plugin.core.http.Request
            description: "Unload model from GPU memory immediately by passing keep_alive = 0."
            uri: "{{ inputs.ollama_endpoint }}/api/generate"
            method: POST
            contentType: application/json
            body: |
              {
                "model": "{{ taskrun.value.name }}",
                "keep_alive": 0
              }

  - id: dispatch_slack_alert
    type: io.kestra.plugin.core.flow.If
    description: "Notify engineering team on Slack if memory headroom is in WARNING or CRITICAL state."
    condition: "{{ inputs.slack_webhook_url != null and inputs.slack_webhook_url != '' and outputs.evaluate_vram_and_spilling.vars.status != 'HEALTHY' }}"
    then:
      - id: post_slack_notification
        type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
        url: "{{ inputs.slack_webhook_url }}"
        payload: |
          {
            "text": "🚨 *Ollama Sentinel Alert: {{ outputs.evaluate_vram_and_spilling.vars.status }}*\n*Host Endpoint:* `{{ inputs.ollama_endpoint }}`\n*VRAM Utilization:* `{{ outputs.evaluate_vram_and_spilling.vars.vram_utilization_pct }}%` ({{ outputs.evaluate_vram_and_spilling.vars.allocated_vram_gb }} GB / {{ inputs.total_gpu_vram_gb }} GB)\n*Active Models:* {{ outputs.evaluate_vram_and_spilling.vars.active_model_count }}\n*CPU Spilled Models:* `{{ outputs.evaluate_vram_and_spilling.vars.spilled_models }}`\n*Auto Eviction Run:* {{ inputs.auto_evict_idle_models }}\n*Execution:* `{{ execution.id }}`"
          }

extend:
  title: Ollama VRAM Saturation and Idle Model Eviction Sentinel
  shortDescription: Audit running Ollama models, track GPU VRAM allocation vs RAM spilling, and trigger automated idle model eviction when memory headroom breaches thresholds.
  metaTitle: Ollama VRAM Saturation and Eviction Sentinel | Kestra
  metaDescription: Audit Ollama LLM serving nodes for GPU VRAM exhaustion, CPU RAM spilling bottlenecks, and automate idle model eviction with alerts using Kestra orchestration.
  description: |
    Running local large language models (LLMs) with Ollama on shared GPU servers or workstations frequently leads to silent memory saturation. When new inference tasks load additional models, existing models remain resident in GPU VRAM until their `keep_alive` window expires. If cumulative weights exceed physical VRAM capacity, Ollama either fails with CUDA out-of-memory (OOM) errors or silently spills model layers onto system RAM, resulting in orders-of-magnitude slower token generation.

    This blueprint provides an autonomous sentinel that periodically queries Ollama's active model telemetry, calculates real GPU VRAM saturation ratios, identifies models that have spilled to system memory, and optionally triggers proactive model unloads (`keep_alive: 0`) to safeguard cluster headroom.

    ## Architecture Overview

    1. **Endpoint Liveness Verification**: Probes `/api/version` to guarantee daemon responsiveness.
    2. **Active Model Telemetry Inspection**: Extracts model names, total memory footprint (`size`), GPU allocation (`size_vram`), and expiration timestamps via the `/api/ps` endpoint.
    3. **VRAM Saturation & Spilling Analysis**: A lightweight Python task computes:
       - Aggregate VRAM allocation against configured physical hardware limits (`total_gpu_vram_gb`).
       - Discrepancies where `size_vram < size`, pinpointing models operating in hybrid CPU/RAM mode with degraded inference throughput.
       - Classification into `HEALTHY`, `WARNING`, or `CRITICAL` operational tiers.
    4. **Automated Memory Remediation**: If `auto_evict_idle_models` is enabled and critical saturation is reached, Kestra automatically unloads models via `/api/generate` with `keep_alive: 0`.
    5. **Multi-Channel Alert Dispatch**: Posts rich diagnostic payloads to Slack whenever thresholds are breached.

    ## Prerequisites

    - A running Ollama instance accessible over HTTP (default `http://localhost:11434`).
    - Python runtime container execution capability on the Kestra worker (`Docker` or `Process` runner).
    - An optional Slack Incoming Webhook URL if team notification is desired.
  tags:
    - AI
    - Infrastructure
  subTags:
    - LLM
    - Reliability
    - Monitoring
  ee: false
  demo: false
