id: tvmaze-broadcast-schedule-lakehouse-loader
namespace: company.analytics
description: Ingests television episode broadcast schedules, network ratings, and runtime metadata from TVmaze into Parquet lakehouse storage via DuckDB, tracking prime-time broadcasts in Kestra KV store.

inputs:
  - id: country_code
    type: STRING
    description: ISO country code for broadcast television schedule lookup.
    defaults: US

  - id: prime_time_runtime_min
    type: INT
    description: Minimum episode runtime in minutes to highlight feature-length or prime-time broadcasts.
    defaults: 60

  - id: state_key
    type: STRING
    description: Kestra KV store key maintaining the latest known broadcast episode IDs.
    defaults: tvmaze_monitored_broadcast_state

variables:
  default_state: "[]"

triggers:
  - id: daily_broadcast_sync
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 8 * * *"

tasks:
  - id: get_current_state
    type: io.kestra.plugin.core.kv.Get
    key: "{{ inputs.state_key }}"
    errorOnMissing: false

  - id: ingest_and_transform_schedule
    type: io.kestra.plugin.scripts.python.Commands
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install requests duckdb
    commands:
      - |
        python3 - << 'EOF'
        import os
        import json
        import requests
        import duckdb
        from datetime import datetime

        raw_state = """{{ outputs.get_current_state.value ?? vars.default_state }}"""
        try:
            seen_episodes = set(json.loads(raw_state)) if raw_state else set()
        except Exception:
            seen_episodes = set()

        country = "{{ inputs.country_code }}"
        min_runtime = int("{{ inputs.prime_time_runtime_min }}")

        url = f"https://api.tvmaze.com/schedule?country={country}"
        headers = {"User-Agent": "KestraTVmazeLakehouse/1.0 (media-analytics@kestra.io)"}

        records = []
        prime_broadcasts = []
        harvested_ids = []

        try:
            resp = requests.get(url, headers=headers, timeout=20)
            if resp.status_code == 200:
                episodes = resp.json()
                for ep in episodes:
                    ep_id = ep.get("id")
                    name = ep.get("name", "")
                    season = ep.get("season", 0)
                    number = ep.get("number", 0)
                    airdate = ep.get("airdate", "")
                    airtime = ep.get("airtime", "")
                    runtime = int(ep.get("runtime", 0)) if ep.get("runtime") else 0

                    show_obj = ep.get("show", {})
                    show_name = show_obj.get("name", "")
                    show_type = show_obj.get("type", "")
                    genres = ", ".join(show_obj.get("genres", []))
                    rating = float(show_obj.get("rating", {}).get("average", 0.0) or 0.0)
                    network = show_obj.get("network", {}).get("name", "") if show_obj.get("network") else ""

                    is_prime = runtime >= min_runtime
                    is_new = ep_id not in seen_episodes

                    harvested_ids.append(ep_id)

                    records.append({
                        "episode_id": ep_id,
                        "episode_name": name,
                        "show_name": show_name,
                        "season": int(season) if season else 1,
                        "episode_number": int(number) if number else 1,
                        "airdate": airdate,
                        "airtime": airtime,
                        "runtime_minutes": runtime,
                        "network": network,
                        "genres": genres,
                        "rating": rating,
                        "is_feature_length": is_prime,
                        "is_new_broadcast": is_new,
                        "harvest_time": datetime.utcnow().isoformat()
                    })

                    if is_prime:
                        prime_broadcasts.append({"show": show_name, "episode": name, "runtime": runtime})
        except Exception as e:
            print(f"Error fetching TVmaze broadcast schedule: {e}")

        with open("tvmaze_schedule.json", "w", encoding="utf-8") as f:
            json.dump(records, f)

        con = duckdb.connect()
        if records:
            con.execute("CREATE TABLE tvmaze AS SELECT * FROM read_json_auto('tvmaze_schedule.json')")
            con.execute("COPY tvmaze TO 'tvmaze_schedule.parquet' (FORMAT PARQUET)")
            con.execute("COPY tvmaze TO 'tvmaze_schedule.csv' (HEADER, DELIMITER ',')")
        else:
            con.execute("""
                CREATE TABLE tvmaze (
                    episode_id BIGINT,
                    episode_name VARCHAR,
                    show_name VARCHAR,
                    season INTEGER,
                    episode_number INTEGER,
                    airdate VARCHAR,
                    airtime VARCHAR,
                    runtime_minutes INTEGER,
                    network VARCHAR,
                    genres VARCHAR,
                    rating DOUBLE,
                    is_feature_length BOOLEAN,
                    is_new_broadcast BOOLEAN,
                    harvest_time VARCHAR
                )
            """)
            con.execute("COPY tvmaze TO 'tvmaze_schedule.parquet' (FORMAT PARQUET)")
            con.execute("COPY tvmaze TO 'tvmaze_schedule.csv' (HEADER, DELIMITER ',')")

        summary = {
            "total_broadcasts_count": len(records),
            "prime_broadcasts_count": len(prime_broadcasts),
            "prime_broadcasts": prime_broadcasts[:5],
            "updated_state": list(set(list(seen_episodes) + harvested_ids))[:500]
        }

        print(f"::{{'outputs': {json.dumps(summary)}}}::")
        EOF
    outputFiles:
      - tvmaze_schedule.parquet
      - tvmaze_schedule.csv

  - id: persist_state
    type: io.kestra.plugin.core.kv.Set
    key: "{{ inputs.state_key }}"
    value: "{{ outputs.ingest_and_transform_schedule.vars.updated_state | toJson }}"

  - id: check_prime_broadcasts
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.ingest_and_transform_schedule.vars.prime_broadcasts_count > 0 }}"
    then:
      - id: notify_prime_schedule
        type: io.kestra.plugin.core.log.Log
        level: INFO
        message: "📺 Broadcast Media Schedule Audit: Harvested {{ outputs.ingest_and_transform_schedule.vars.total_broadcasts_count }} daily episodes, including {{ outputs.ingest_and_transform_schedule.vars.prime_broadcasts_count }} feature-length broadcasts."

outputs:
  - id: total_broadcasts
    type: INT
    value: "{{ outputs.ingest_and_transform_schedule.vars.total_broadcasts_count }}"
  - id: prime_broadcasts_count
    type: INT
    value: "{{ outputs.ingest_and_transform_schedule.vars.prime_broadcasts_count }}"
  - id: dataset_parquet
    type: FILE
    value: "{{ outputs.ingest_and_transform_schedule.outputFiles['tvmaze_schedule.parquet'] }}"

extend:
  title: TVmaze Broadcast Television Schedule Lakehouse Loader with DuckDB
  metaTitle: TVmaze Broadcast Schedule Lakehouse Loader | Kestra
  shortDescription: Ingests television episode broadcast schedules, network ratings, and runtime metadata from TVmaze into Parquet lakehouse storage via DuckDB.
  metaDescription: Poll TVmaze REST API for daily television broadcast lineups, convert media runtime telemetry into Parquet via DuckDB, and track state in KV store.
  tags:
    - Data
  subTags:
    - ELT & Warehouse Loading
    - File & Data Processing Basics
  ee: false
  demo: false
  description: |
    Automate the collection, media harmonization, and analytical lakehouse persistence of television
    broadcast programming schedules, episode runtimes, network channels, and viewer ratings from TVmaze into Parquet using DuckDB.

    ## How it works

    1. **State Recovery**: Queries the Kestra KV store (`tvmaze_monitored_broadcast_state`) for previous broadcast episode identifiers.
    2. **TVmaze Schedule Ingestion**: Queries the official TVmaze Schedule REST API (`api.tvmaze.com/schedule`) across configured national broadcast markets.
    3. **DuckDB Media Normalization**: Unpacks episode names, season sequences, broadcast runtimes, networks, and genres into a relational schema inside Docker.
    4. **Analytical Lake Export**: Exports normalized programming records into columnar Parquet and CSV files for audience media modeling and entertainment analytics.
    5. **Milestone Evaluation & State Commitment**: Evaluates feature-length and prime-time broadcasts, highlights programming entries, and commits state to Kestra KV store.

    ## What you get

    - Automated, scheduled collection of global television media broadcast lineups.
    - Columnar Parquet datasets queryable with DuckDB, ClickHouse, Snowflake, or Athena.
    - Built-in KV state management providing idempotent execution and zero database requirements.

    ## Who it's for

    - Media Planners and Advertising Analytics Engineers tracking linear TV programming.
    - Entertainment Content Strategists monitoring network programming allocations.
    - Analytics Engineers building reproducible multi-cloud lakehouse pipelines.

    ## Why orchestrate this with Kestra

    - Built-in KV store maintains historical broadcast episode states across runs without database infrastructure.
    - Ephemeral Docker execution guarantees reproducible, clean Python and DuckDB runtimes.
    - Declarative scheduled execution with automated error recovery and conditional logging.

    ## Prerequisites

    - Docker runner configured on the Kestra worker.
    - Outbound internet access to `api.tvmaze.com`.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: (Optional) Webhook URL for alerting media teams on scheduled prime-time programming.

    ## Quick start

    1. Import this blueprint into your Kestra instance.
    2. Set your target `country_code` (default `US`, `GB`, `FR`, etc.).
    3. Click **Execute** to run an immediate harvest and generate the Parquet table.
    4. Enable the `daily_broadcast_sync` schedule for automated daily updates.

    ## How to extend

    - Add an S3 or Google Cloud Storage step to partition daily broadcast lineups into an analytical lakehouse.
    - Connect a sentiment analysis step over episode summaries using Hugging Face or Ollama.

    ## Links

    - [TVmaze API Documentation](https://www.tvmaze.com/api#schedule)
    - [DuckDB Documentation](https://duckdb.org/)
    - [Kestra Task Runners](https://kestra.io/docs/task-runners)
