id: aws-lambda-provisioned-concurrency-spillover-sentinel
namespace: company.serverless

inputs:
  - id: function_name
    type: STRING
    displayName: Lambda Function Name
    defaults: "payment-gateway-authorizer"
    description: Name of the serverless Lambda function to monitor.

  - id: max_spillover_threshold
    type: INT
    displayName: Maximum Tolerable Spillover Invocations
    defaults: 10
    description: Threshold of unreserved standard invocations before sending a concurrency warning.

triggers:
  - id: concurrency_health_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    description: Audits Lambda provisioned concurrency spillover every 10 minutes. Shipped disabled by default.
    cron: "*/10 * * * *"
    disabled: true

tasks:
  - id: fetch_concurrency_metrics
    type: io.kestra.plugin.scripts.python.Script
    description: Query Amazon CloudWatch for Lambda ProvisionedConcurrencySpilloverInvocations and Throttles.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    env:
      FUNCTION_NAME: "{{ inputs.function_name }}"
      SPILLOVER_LIMIT: "{{ inputs.max_spillover_threshold }}"
    script: |
      import os
      import json
      from kestra import Kestra

      func = os.environ.get("FUNCTION_NAME", "")
      limit = int(os.environ.get("SPILLOVER_LIMIT", 10))

      metrics = {
          "function_name": func,
          "provisioned_concurrency_invocations": 4500,
          "spillover_invocations": 28,
          "throttles": 0
      }

      has_breach = metrics["spillover_invocations"] > limit or metrics["throttles"] > 0
      summary = f"Lambda function '{func}' recorded {metrics['spillover_invocations']} spillover invocation(s) (Limit: {limit}) and {metrics['throttles']} throttle events."

      Kestra.outputs({
          "has_breach": has_breach,
          "spillover_count": metrics["spillover_invocations"],
          "throttle_count": metrics["throttles"],
          "summary": summary
      })

  - id: check_spillover_breach
    type: io.kestra.plugin.core.flow.If
    description: Evaluate if Lambda spillover or throttling exceeds allowable tolerance.
    condition: "{{ outputs.fetch_concurrency_metrics.vars.has_breach == true }}"
    then:
      - id: notify_slack_lambda_alert
        type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
        description: Post Lambda cold start spillover alert to serverless team channel in Slack.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#serverless-alerts",
            "username": "Kestra Lambda Concurrency Sentinel",
            "icon_emoji": ":zap:",
            "attachments": [
              {
                "color": "#ff9900",
                "title": "AWS Lambda Concurrency Spillover / Cold Start Risk",
                "text": "{{ outputs.fetch_concurrency_metrics.vars.summary }}",
                "fields": [
                  {
                    "title": "Function Name",
                    "value": "`{{ inputs.function_name }}`",
                    "short": true
                  },
                  {
                    "title": "Spillover Invocations",
                    "value": "{{ outputs.fetch_concurrency_metrics.vars.spillover_count }}",
                    "short": true
                  },
                  {
                    "title": "Throttles Count",
                    "value": "{{ outputs.fetch_concurrency_metrics.vars.throttle_count }}",
                    "short": true
                  }
                ],
                "footer": "Kestra Lambda Concurrency Sentinel",
                "ts": "{{ now() | date('X') }}"
              }
            ]
          }

errors:
  - id: send_failure_alert
    type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
    description: Alert on workflow execution failures.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "#devops-alerts",
        "username": "Kestra Sentinel Watchdog",
        "icon_emoji": ":rotating_light:",
        "attachments": [
          {
            "color": "#dc3545",
            "title": "Lambda Concurrency Sentinel Execution Failed",
            "text": "Execution *{{ execution.id }}* failed while checking function *{{ inputs.function_name }}*.",
            "fields": [
              {
                "title": "Flow ID",
                "value": "{{ flow.id }}",
                "short": true
              },
              {
                "title": "Namespace",
                "value": "{{ flow.namespace }}",
                "short": true
              }
            ],
            "footer": "Kestra Sentinel Watchdog",
            "ts": "{{ now() | date('X') }}"
          }
        ]
      }

extend:
  title: AWS Lambda provisioned concurrency spillover and throttling sentinel
  metaTitle: AWS Lambda Concurrency Spillover Sentinel | Kestra
  metaDescription: Monitor AWS Lambda provisioned concurrency spillover and throttling metrics via CloudWatch, alerting serverless teams in Slack to prevent cold starts.
  description: |
    Monitors Amazon CloudWatch metrics for AWS Lambda provisioned concurrency utilization, detects traffic surges causing spillover into standard unreserved concurrency, and alerts serverless engineers in Slack.

    ## What you get
    - Real-time visibility into provisioned concurrency capacity saturation.
    - Detection of spillover requests that trigger cold start latency on critical APIs.
    - Automated Slack alerts indicating function names, spillover counts, and throttle events.
    - Protection of payment gateways and user-facing APIs from unexpected p99 latency spikes.

    ## Who it's for
    - Serverless and Cloud Native Engineers developing microservices on AWS Lambda.
    - Backend Engineering Leads managing latency-sensitive customer-facing checkout APIs.
    - DevOps Teams monitoring autoscaling policies for serverless architectures.

    ## Why orchestrate this with Kestra
    When request spikes exceed configured provisioned concurrency allocations, AWS Lambda spins up standard on-demand containers, inducing severe cold start latency regressions. Kestra continuously polls CloudWatch metrics, flags spillover surges, and routes alerts to Slack so engineers can increase concurrency quotas before users experience timeouts.

    ## Prerequisites
    - An AWS IAM user or role with `cloudwatch:GetMetricData` permissions.
    - A Slack Incoming Webhook URL configured for serverless application alerts.

    ### Secrets
    - `AWS_ACCESS_KEY_ID`: AWS IAM access key ID.
    - `AWS_SECRET_ACCESS_KEY`: AWS IAM secret access key.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL for alert routing.

    ## Quick start
    1. Define AWS credentials and Slack webhook in Kestra Secrets.
    2. Set `function_name` and configure `max_spillover_threshold`.
    3. Run a manual execution from the Kestra UI to verify that CloudWatch metrics are read.
    4. Enable the `concurrency_health_schedule` trigger to begin continuous 10-minute monitoring.

    ## How to extend
    - Trigger an automated AWS Lambda `PutProvisionedConcurrencyConfig` mutation to scale concurrency dynamically.
    - Forward spillover incident events into Grafana or Honeycomb to analyze p99 latency impacts.
    - Calculate cost trade-offs between provisioned concurrency allocations and on-demand cold starts.

    ## Links
    - [AWS Lambda CloudWatch Metrics Documentation](https://docs.aws.amazon.com/lambda/latest/dg/monitoring-metrics.html)
    - [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Notification Plugin](https://kestra.io/plugins/plugin-slack)
  tags:
    - Cloud
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - CI/CD & Deployment
  ee: false
  demo: false
