id: cloudtrail-audit-enabler
namespace: company.security

description: |
  Verifies every CloudTrail trail is multi-region with log file validation
  enabled, optionally fixes the gaps, and posts a Slack compliance report.

inputs:
  - id: aws_regions
    type: ARRAY
    itemType: STRING
    defaults: ["us-east-1"]
    description: AWS regions to audit for CloudTrail coverage (trails are listed per region).
  - id: auto_fix
    type: BOOLEAN
    defaults: false
    description: When true, update non-compliant trails to be multi-region with log file validation enabled.

variables:
  slack_webhook_url: "{{ secret('SLACK_WEBHOOK_URL') }}"

tasks:
  - id: audit_trails
    type: io.kestra.plugin.core.flow.ForEach
    description: Audit CloudTrail trails in each region, in parallel.
    values: "{{ inputs.aws_regions }}"
    tasks:
      - id: audit_region
        type: io.kestra.plugin.aws.cli.AwsCLI
        description: Describe trails in this region and flag those missing multi-region or log validation.
        commands:
          - |
            export REGION="{{ taskrun.value }}"
            aws cloudtrail describe-trails --region "$REGION" --output json > "/tmp/ct_trails_${REGION}.json"
            python3 << 'PYEOF'
            import json, os
            region = os.environ["REGION"]
            with open(f"/tmp/ct_trails_{region}.json") as f:
                trails = json.load(f).get("trailList", [])
            noncompliant = []
            records = []
            for t in trails:
                name = t.get("Name", "")
                multi = bool(t.get("IsMultiRegionTrail"))
                valid = bool(t.get("LogFileValidationEnabled"))
                ok = multi and valid
                if not ok:
                    noncompliant.append(name)
                records.append({
                    "region": region,
                    "trail": name,
                    "multi_region": multi,
                    "log_validation": valid,
                    "compliant": ok,
                    "fixed": False,
                })
            with open(f"/tmp/cloudtrail_{region}.json", "w") as f:
                json.dump(records, f)
            print(f"TRAIL_COUNT={len(trails)}")
            print(f"NONCOMPLIANT_COUNT={len(noncompliant)}")
            print(f"NONCOMPLIANT={','.join(noncompliant)}")
            PYEOF
        env:
          AWS_ACCESS_KEY_ID: "{{ secret('AWS_ACCESS_KEY_ID') }}"
          AWS_SECRET_ACCESS_KEY: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
          AWS_DEFAULT_REGION: "{{ taskrun.value }}"
        outputFiles:
          - "/tmp/cloudtrail_*.json"

      - id: fix_trails
        type: io.kestra.plugin.core.flow.If
        description: Fix non-compliant trails when auto_fix is on.
        condition: "{{ inputs.auto_fix == true and outputs.audit_region.vars.NONCOMPLIANT != '' }}"
        then:
          - id: apply_fix
            type: io.kestra.plugin.aws.cli.AwsCLI
            description: Enable multi-region and log file validation on each non-compliant trail.
            commands:
              - |
                export REGION="{{ taskrun.value }}"
                export NONCOMPLIANT="{{ outputs.audit_region.vars.NONCOMPLIANT }}"
                python3 << 'PYEOF'
                import json, os, subprocess
                region = os.environ["REGION"]
                names = [n for n in os.environ.get("NONCOMPLIANT", "").split(",") if n]
                fixed = []
                for name in names:
                    try:
                        subprocess.run(
                            ["aws", "cloudtrail", "update-trail", "--name", name,
                             "--is-multi-region-trail", "--enable-log-file-validation",
                             "--region", region],
                            check=True, capture_output=True, text=True,
                        )
                        fixed.append(name)
                    except subprocess.CalledProcessError:
                        pass
                path = f"/tmp/cloudtrail_{region}.json"
                with open(path) as f:
                    records = json.load(f)
                for r in records:
                    if r["trail"] in fixed:
                        r["fixed"] = True
                        r["compliant"] = True
                        r["multi_region"] = True
                        r["log_validation"] = True
                with open(path, "w") as f:
                    json.dump(records, f)
                print(f"FIXED={','.join(fixed)}")
                print(f"FIXED_COUNT={len(fixed)}")
                PYEOF
            env:
              AWS_ACCESS_KEY_ID: "{{ secret('AWS_ACCESS_KEY_ID') }}"
              AWS_SECRET_ACCESS_KEY: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
              AWS_DEFAULT_REGION: "{{ taskrun.value }}"
            outputFiles:
              - "/tmp/cloudtrail_*.json"

  - id: aggregate
    type: io.kestra.plugin.aws.cli.AwsCLI
    description: Combine per-region trail results into compliance vars for the report.
    commands:
      - |
        python3 << 'PYEOF'
        import json, glob
        records = []
        for path in sorted(glob.glob("/tmp/cloudtrail_*.json")):
            with open(path) as f:
                records.extend(json.load(f))
        total = len(records)
        bad = [r for r in records if not r["compliant"]]
        fixed = [r for r in records if r.get("fixed")]
        print(f"TOTAL_TRAILS={total}")
        print(f"NONCOMPLIANT_COUNT={len(bad)}")
        print(f"FIXED_COUNT={len(fixed)}")
        print(f"NONCOMPLIANT_LIST={', '.join(f\"{r['trail']} ({r['region']})\" for r in bad) if bad else 'none'}")
        print(f"FIXED_LIST={', '.join(fixed) if fixed else 'none'}")
        print(f"HAS_FINDINGS={'true' if (bad or fixed) else 'false'}")
        print("REPORT<<EOF")
        for r in records:
            mark = "[OK] " if r["compliant"] else "[MISS]"
            fix_mark = " (fixed this run)" if r.get("fixed") else ""
            print(f"{mark} {r['trail']} [{r['region']}] multi_region={r['multi_region']} log_validation={r['log_validation']}{fix_mark}")
        print("EOF")
        PYEOF

  - id: notify
    type: io.kestra.plugin.core.flow.If
    description: Post the compliance report to Slack when there are gaps or fixes.
    condition: "{{ outputs.aggregate.vars.HAS_FINDINGS == 'true' }}"
    then:
      - id: slack_report
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ vars.slack_webhook_url }}"
        payload: |
          {
            "text": ":mag: *CloudTrail compliance report*\nAudited {{ outputs.aggregate.vars.TOTAL_TRAILS }} trail(s). Non-compliant: {{ outputs.aggregate.vars.NONCOMPLIANT_LIST }}.\nAuto-fixed this run: {{ outputs.aggregate.vars.FIXED_LIST }}"
          }
    else:
      - id: log_clean
        type: io.kestra.plugin.core.log.Log
        message: "All {{ outputs.aggregate.vars.TOTAL_TRAILS }} CloudTrail trail(s) are multi-region with log file validation enabled. No gaps to report."

triggers:
  - id: weekly
    type: io.kestra.plugin.core.trigger.Schedule
    disabled: true
    cron: "0 9 * * MON"
    description: Weekly on Monday at 09:00 UTC — trail config changes are rare, a weekly audit is enough.

extend:
  title: CloudTrail Audit Enabler
  metaTitle: Audit & Fix CloudTrail Coverage Gaps | Kestra
  shortDescription: Verify every CloudTrail trail is multi-region with log file validation enabled, auto-fix the gaps, and get a Slack compliance report.
  metaDescription: Catch blind spots in your audit trail — verify multi-region CloudTrail with log validation, auto-fix gaps, and report to Slack.
  description: |
    An incomplete CloudTrail is a blind incident response: single-region trails miss activity everywhere else, and without log file validation you can't prove the logs weren't tampered with. This blueprint checks every trail for both settings, optionally fixes the gaps, and reports compliance to Slack — so your audit trail is actually complete.

    ## How it works

    1. A Schedule trigger fires weekly on Monday at 09:00 UTC (shipped disabled).
    2. A `ForEach` iterates your `aws_regions` input and runs `aws cloudtrail describe-trails` per region, checking each trail for `IsMultiRegionTrail` and `LogFileValidationEnabled`.
    3. An `If` task gates the remediation: when trails are non-compliant and `auto_fix` is true, it runs `aws cloudtrail update-trail --is-multi-region-trail --enable-log-file-validation` on each of them.
    4. An aggregation task combines the per-region results, and a final `If` posts a Slack compliance report when there are gaps or fixes — otherwise it just logs that everything is compliant.

    ## What you get

    - A real per-trail compliance check across your regions — multi-region AND log validation.
    - Optional one-click remediation: flip `auto_fix` to true and the gaps are closed for you.
    - A Slack report naming exactly which trails were non-compliant and which were fixed this run.
    - Silence on clean weeks: no alert fatigue when every trail is compliant.

    ## Who it's for

    Security engineers, compliance teams, and platform owners who need to prove — not assume — that CloudTrail captures everything, everywhere, untampered.

    ## Why orchestrate this with Kestra

    Clicking through the console once doesn't keep you compliant; config drifts. As a Kestra flow the audit runs on a schedule, every fix is logged with the trail name, and the Slack report gives the team a weekly paper trail of the compliance state — all in versioned YAML.

    ## Prerequisites

    - AWS credentials with `cloudtrail:DescribeTrails` permission (plus `cloudtrail:UpdateTrail` if you use `auto_fix`).
    - A Slack incoming webhook URL.

    ### Secrets

    - `AWS_ACCESS_KEY_ID`: AWS access key for the CloudTrail API calls.
    - `AWS_SECRET_ACCESS_KEY`: AWS secret key for the CloudTrail API calls.
    - `SLACK_WEBHOOK_URL`: Incoming webhook URL for the compliance report.

    ## Quick start

    1. Add the three secrets above to your Kestra namespace.
    2. Run manually once with `auto_fix: false` to see which trails are non-compliant.
    3. Re-run with `auto_fix: true` to remediate, or keep it report-only for change control.
    4. Enable the weekly schedule trigger.

    ## How to extend

    - Also check that each trail logs to an encrypted, MFA-delete-protected S3 bucket.
    - Add an SNS/CloudWatch alarm check for `StopLogging` events on every trail.
    - Route the report to a compliance channel and open a ticket when new gaps appear.

    ## Links

    - [Kestra AWS plugins](https://kestra.io/plugins)
    - [Kestra Slack plugins](https://kestra.io/plugins)
    - [CloudTrail describe-trails API](https://docs.aws.amazon.com/cli/latest/reference/cloudtrail/describe-trails.html)
    - [CloudTrail update-trail API](https://docs.aws.amazon.com/cli/latest/reference/cloudtrail/update-trail.html)
  tags:
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - Day 2 Operations
  ee: false
  demo: false
