id: haproxy-backend-drain-gate
namespace: company.team
description: |
  Take one server out of an HAProxy backend for maintenance without cutting live connections,
  and put it back once its health check passes. A drain only goes ahead when the other servers
  can carry the traffic and on-call approves it. The flow sets the server to DRAIN, waits until
  its sessions reach zero, then sets MAINT. The enable mode sets READY and waits for UP.

concurrency:
  limit: 1
  behavior: QUEUE

triggers:
  - id: haproxy_change
    type: io.kestra.plugin.core.trigger.Webhook
    key: haproxy-drain-change-me
    description: >-
      Start a drain or an enable from a maintenance script or chat bot. Query parameters
      override the inputs: `curl -X POST "http://localhost:8080/api/v1/main/executions/webhook/company.team/haproxy-backend-drain-gate/haproxy-drain-change-me?action=enable&backend=web&server=web1"`.
      Only action, backend and server can be overridden this way.
  - id: nightly_reenable
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "30 3 * * *"
    disabled: true
    inputs:
      action: enable
    description: >-
      Nightly backstop: puts the default server back in rotation if a drain was left behind,
      for example after a drain timed out and nobody came back to it. It does nothing when the
      server is already UP. Shipped disabled, because a server that is in maintenance on purpose
      must not be re-enabled by a timer.

inputs:
  - id: action
    type: SELECT
    values:
      - drain
      - enable
    defaults: drain
    description: drain takes the server out of rotation for maintenance after approval. enable puts it back and waits for its health check to report UP.
  - id: backend
    type: STRING
    defaults: web
    description: Name of the HAProxy backend, as written in haproxy.cfg. Letters, digits, dot, dash and underscore only.
  - id: server
    type: STRING
    defaults: web1
    description: Name of the server inside the backend. Letters, digits, dot, dash and underscore only. A name that does not exist is refused.
  - id: min_healthy
    type: INT
    defaults: 2
    description: Servers other than this one that must be UP after the drain. A drain that would leave fewer is refused. Raise it to protect capacity; set it to 0 only for a single-server backend.
  - id: drain_timeout_seconds
    type: INT
    defaults: 600
    description: How long to wait for the server's sessions to close. Long-lived clients such as WebSockets or downloads may need more. On timeout the server stays in DRAIN and the run fails.
  - id: poll_seconds
    type: INT
    defaults: 10
    description: How often the flow reads the server's session count and health while it waits.
  - id: health_timeout_seconds
    type: INT
    defaults: 120
    description: How long an enable waits for the health check to report UP. The check needs a few passes (rise count times the interval), so keep this above that.
  - id: haproxy_host
    type: STRING
    defaults: 127.0.0.1
    description: Host of the HAProxy runtime socket. Bind the socket to loopback or a management network only, because it has no authentication.
  - id: haproxy_port
    type: INT
    defaults: 9990
    description: TCP port of the HAProxy runtime socket, set with `stats socket ipv4@<addr>:<port> level admin` in the global section.
  - id: kestra_url
    type: STRING
    defaults: http://localhost:8080
    description: Base URL of your Kestra UI, used for the approval link in Slack.

variables:
  # Webhook calls can override these three from the query string (trigger.parameters holds each query value as a list); manual runs and the schedule use the inputs.
  action: "{{ trigger.parameters.action[0] ?? inputs.action }}"
  backend: "{{ trigger.parameters.backend[0] ?? inputs.backend }}"
  server: "{{ trigger.parameters.server[0] ?? inputs.server }}"
  # One read of `show stat` for one backend. Prints the server list and the target's status, sessions and
  # the number of other UP servers as a ::{"outputs":...}:: line. HAProxy's runtime API is plain text over TCP.
  read_stats: |
    set -eu
    { exec 3<>/dev/tcp/$HA_HOST/$HA_PORT; } 2>/dev/null || { echo "HAProxy runtime socket not reachable at $HA_HOST:$HA_PORT" >&2; exit 1; }
    printf 'show stat\n' >&3
    now=$(date +%s)
    start=${HA_START:-$now}
    timed_out=false
    if [ "${HA_TIMEOUT:-0}" -gt 0 ] && [ $((now - start)) -ge "$HA_TIMEOUT" ]; then timed_out=true; fi
    cat <&3 | awk -F, -v be="$HA_BACKEND" -v sv="$HA_SERVER" -v now="$now" -v timed_out="$timed_out" '
      NR == 1 { sub(/^# /, ""); for (i = 1; i <= NF; i++) col[$i] = i; next }
      $1 == be && $2 != "BACKEND" {
        st = $(col["status"]); sc = $(col["scur"]) + 0
        list = list (n++ ? "," : "") sprintf("{\"server\":\"%s\",\"status\":\"%s\",\"sessions\":%d}", $2, st, sc)
        if ($2 == sv) { tstatus = st; tsess = sc; found = "true" }
        else if (st == "UP") up++
      }
      END {
        printf "::{\"outputs\":{\"servers\":[%s],\"found\":%s,\"target_status\":\"%s\",\"target_sessions\":%d,\"others_up\":%d,\"timed_out\":%s,\"now\":%d}}::\n", list, (found == "true" ? "true" : "false"), tstatus, tsess, up, timed_out, now
      }'
  # Sends one `set server <backend>/<server> state <HA_STATE>` and fails on any reply, because HAProxy answers
  # errors (for example "No such server.") with text and success with nothing.
  set_state: |
    set -eu
    { exec 3<>/dev/tcp/$HA_HOST/$HA_PORT; } 2>/dev/null || { echo "HAProxy runtime socket not reachable at $HA_HOST:$HA_PORT" >&2; exit 1; }
    printf 'set server %s/%s state %s\n' "$HA_BACKEND" "$HA_SERVER" "$HA_STATE" >&3
    reply=""
    read -r -t 5 reply <&3 || true
    if [ -n "$reply" ]; then echo "HAProxy refused 'set server $HA_BACKEND/$HA_SERVER state $HA_STATE': $reply" >&2; exit 1; fi
    printf '::{"outputs":{"started_at":%s}}::\n' "$(date +%s)"
    echo "$HA_BACKEND/$HA_SERVER set to $HA_STATE"

tasks:
  - id: validate_input
    type: io.kestra.plugin.core.flow.If
    description: Names and modes are checked before the socket is touched. A bad name never reaches HAProxy.
    condition: >-
      {{ (render(vars.backend) | toJson | jq('if test("^[A-Za-z0-9_.-]+$") then "ok" else "bad" end')) contains 'bad'
         or (render(vars.server) | toJson | jq('if test("^[A-Za-z0-9_.-]+$") then "ok" else "bad" end')) contains 'bad'
         or (not (['drain', 'enable'] contains render(vars.action)))
         or inputs.min_healthy < 0
         or inputs.drain_timeout_seconds < 1
         or inputs.poll_seconds < 1
         or inputs.health_timeout_seconds < 1 }}
    then:
      - id: reject_input
        type: io.kestra.plugin.core.execution.Fail
        errorMessage: >-
          Rejected before any change. backend and server may only contain letters, digits, dot, dash and underscore (got backend '{{ render(vars.backend) }}', server '{{ render(vars.server) }}'). action must be drain or enable (got '{{ render(vars.action) }}'). min_healthy and the timeouts must be positive or zero.

  - id: read_pool
    type: io.kestra.plugin.scripts.shell.Commands
    description: Reads every server of the backend from HAProxy (`show stat`). Retried, because the runtime socket can be restarting.
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    interpreter:
      - bash
      - -c
    env:
      HA_HOST: "{{ inputs.haproxy_host }}"
      HA_PORT: "{{ inputs.haproxy_port }}"
      HA_BACKEND: "{{ render(vars.backend) }}"
      HA_SERVER: "{{ render(vars.server) }}"
      HA_START: ""
      HA_TIMEOUT: "0"
    commands:
      - "{{ vars.read_stats }}"
    retry:
      type: exponential
      interval: PT2S
      maxInterval: PT30S
      maxAttempts: 3

  - id: target_check
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.read_pool.vars.found == false }}"
    then:
      - id: unknown_server
        type: io.kestra.plugin.core.execution.Fail
        errorMessage: "Server '{{ render(vars.server) }}' is not in backend '{{ render(vars.backend) }}'. Servers HAProxy reports there: {{ outputs.read_pool.vars.servers | jq('[.[].server] | join(\", \")') | first }}. Check the name, then run again."

  - id: if_enable
    type: io.kestra.plugin.core.flow.If
    description: Enable mode. Puts the server back in rotation and waits for its health check.
    condition: "{{ render(vars.action) == 'enable' }}"
    then:
      - id: set_ready
        type: io.kestra.plugin.scripts.shell.Commands
        description: Sets the server to READY. Health checks then decide when it takes traffic.
        taskRunner:
          type: io.kestra.plugin.core.runner.Process
        interpreter:
          - bash
          - -c
        env:
          HA_HOST: "{{ inputs.haproxy_host }}"
          HA_PORT: "{{ inputs.haproxy_port }}"
          HA_BACKEND: "{{ render(vars.backend) }}"
          HA_SERVER: "{{ render(vars.server) }}"
          HA_STATE: ready
        commands:
          - "{{ vars.set_state }}"
        retry:
          type: exponential
          interval: PT2S
          maxInterval: PT30S
          maxAttempts: 3

      - id: wait_health
        type: io.kestra.plugin.core.flow.LoopUntil
        description: Reads the server every poll_seconds until HAProxy reports UP, or health_timeout_seconds passes.
        condition: "{{ outputs.poll_health.vars.target_status == 'UP' or outputs.poll_health.vars.timed_out == true }}"
        checkFrequency:
          interval: "PT{{ inputs.poll_seconds }}S"
          maxIterations: 1000
        failOnMaxReached: false
        tasks:
          - id: poll_health
            type: io.kestra.plugin.scripts.shell.Commands
            taskRunner:
              type: io.kestra.plugin.core.runner.Process
            interpreter:
              - bash
              - -c
            env:
              HA_HOST: "{{ inputs.haproxy_host }}"
              HA_PORT: "{{ inputs.haproxy_port }}"
              HA_BACKEND: "{{ render(vars.backend) }}"
              HA_SERVER: "{{ render(vars.server) }}"
              HA_START: "{{ outputs.set_ready.vars.started_at }}"
              HA_TIMEOUT: "{{ inputs.health_timeout_seconds }}"
            commands:
              - "{{ vars.read_stats }}"
            retry:
              type: exponential
              interval: PT2S
              maxInterval: PT30S
              maxAttempts: 3

      - id: confirm_health
        type: io.kestra.plugin.scripts.shell.Commands
        description: One more read after the wait, so the report and the verdict use the current state.
        taskRunner:
          type: io.kestra.plugin.core.runner.Process
        interpreter:
          - bash
          - -c
        env:
          HA_HOST: "{{ inputs.haproxy_host }}"
          HA_PORT: "{{ inputs.haproxy_port }}"
          HA_BACKEND: "{{ render(vars.backend) }}"
          HA_SERVER: "{{ render(vars.server) }}"
          HA_START: ""
          HA_TIMEOUT: "0"
        commands:
          - "{{ vars.read_stats }}"
        retry:
          type: exponential
          interval: PT2S
          maxInterval: PT30S
          maxAttempts: 3

      - id: health_gate
        type: io.kestra.plugin.core.flow.If
        condition: "{{ outputs.confirm_health.vars.target_status != 'UP' }}"
        then:
          - id: not_up
            type: io.kestra.plugin.core.execution.Fail
            errorMessage: "{{ render(vars.backend) }}/{{ render(vars.server) }} is READY but its health check has not reported UP within {{ inputs.health_timeout_seconds }} s (HAProxy status: {{ outputs.confirm_health.vars.target_status }}). It takes no traffic until the check passes. Check the server's health endpoint, then look at the HAProxy log."

      - id: notify_enabled
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        messageText: >-
          {{ render(vars.backend) }}/{{ render(vars.server) }} is back in rotation: HAProxy reports UP with {{ outputs.confirm_health.vars.target_sessions }} session(s). {{ outputs.read_pool.vars.others_up }} other server(s) were UP when the run started.

  - id: if_drain
    type: io.kestra.plugin.core.flow.If
    description: Drain mode. Checks capacity, asks for approval, drains, waits for sessions to close, then sets MAINT.
    condition: "{{ render(vars.action) == 'drain' }}"
    then:
      - id: precheck
        type: io.kestra.plugin.core.flow.If
        description: Refuses before asking anyone when the other servers cannot carry the traffic.
        condition: "{{ outputs.read_pool.vars.others_up < inputs.min_healthy }}"
        then:
          - id: notify_refused
            type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
            url: "{{ secret('SLACK_WEBHOOK_URL') }}"
            messageText: >-
              Drain refused for {{ render(vars.backend) }}/{{ render(vars.server) }}: nothing was changed. Only {{ outputs.read_pool.vars.others_up }} other server(s) are UP and the minimum is {{ inputs.min_healthy }}. Bring a server back, or lower min_healthy if the capacity loss is acceptable, then run again.
          - id: refuse_drain
            type: io.kestra.plugin.core.execution.Exit
            state: FAILED

      - id: ask_approval
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Asks on-call to approve. The approval happens in the Kestra UI, which shows the capacity numbers.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        messageText: >-
          Approval needed: drain {{ render(vars.backend) }}/{{ render(vars.server) }} for maintenance. {{ outputs.read_pool.vars.others_up }} other server(s) are UP, the minimum is {{ inputs.min_healthy }}, and {{ outputs.read_pool.vars.target_sessions }} session(s) are open on it now. Open {{ inputs.kestra_url }}/ui/main/executions/{{ flow.namespace }}/{{ flow.id }}/{{ execution.id }} and choose drain. No answer within an hour changes nothing.

      - id: wait_for_decision
        type: io.kestra.plugin.core.flow.Pause
        description: No answer within an hour means nothing is changed.
        pauseDuration: PT1H
        behavior: RESUME
        onResume:
          - id: decision
            type: SELECT
            values:
              - drain
              - decline
            defaults: decline
            description: drain goes ahead. decline leaves the server in rotation, and so does no answer before the timeout.

      - id: decision_gate
        type: io.kestra.plugin.core.flow.If
        description: Anything but drain counts as a decline, including no answer. A timed-out Pause leaves the answer empty.
        condition: "{{ (outputs.wait_for_decision.onResume.decision ?? '') != 'drain' }}"
        then:
          - id: notify_declined
            type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
            url: "{{ secret('SLACK_WEBHOOK_URL') }}"
            messageText: "Drain of {{ render(vars.backend) }}/{{ render(vars.server) }} was not approved. The server is unchanged."
          - id: end_declined
            type: io.kestra.plugin.core.execution.Exit
            state: SUCCESS

      - id: recheck_pool
        type: io.kestra.plugin.scripts.shell.Commands
        description: Reads the pool again, because servers can change while the approval waits. The capacity check runs against this read.
        taskRunner:
          type: io.kestra.plugin.core.runner.Process
        interpreter:
          - bash
          - -c
        env:
          HA_HOST: "{{ inputs.haproxy_host }}"
          HA_PORT: "{{ inputs.haproxy_port }}"
          HA_BACKEND: "{{ render(vars.backend) }}"
          HA_SERVER: "{{ render(vars.server) }}"
          HA_START: ""
          HA_TIMEOUT: "0"
        commands:
          - "{{ vars.read_stats }}"
        retry:
          type: exponential
          interval: PT2S
          maxInterval: PT30S
          maxAttempts: 3

      - id: recheck_gate
        type: io.kestra.plugin.core.flow.If
        description: Refuses again if the approval is stale, for example after another server went down.
        condition: "{{ outputs.recheck_pool.vars.others_up < inputs.min_healthy or outputs.recheck_pool.vars.found == false }}"
        then:
          - id: notify_refused_late
            type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
            url: "{{ secret('SLACK_WEBHOOK_URL') }}"
            messageText: >-
              Drain of {{ render(vars.backend) }}/{{ render(vars.server) }} was approved but refused and nothing was changed: the pool changed while the approval waited. Now {{ outputs.recheck_pool.vars.others_up }} other server(s) are UP and the minimum is {{ inputs.min_healthy }}. Check the servers, then run again.
          - id: refuse_late
            type: io.kestra.plugin.core.execution.Exit
            state: FAILED

      - id: start_drain
        type: io.kestra.plugin.scripts.shell.Commands
        description: Sets DRAIN. HAProxy stops sending new sessions at once; the open ones keep running.
        taskRunner:
          type: io.kestra.plugin.core.runner.Process
        interpreter:
          - bash
          - -c
        env:
          HA_HOST: "{{ inputs.haproxy_host }}"
          HA_PORT: "{{ inputs.haproxy_port }}"
          HA_BACKEND: "{{ render(vars.backend) }}"
          HA_SERVER: "{{ render(vars.server) }}"
          HA_STATE: drain
        commands:
          - "{{ vars.set_state }}"
        retry:
          type: exponential
          interval: PT2S
          maxInterval: PT30S
          maxAttempts: 3

      - id: wait_drain
        type: io.kestra.plugin.core.flow.LoopUntil
        description: Reads the session count every poll_seconds until it reaches 0, or drain_timeout_seconds passes.
        condition: "{{ outputs.poll_drain.vars.target_sessions == 0 or outputs.poll_drain.vars.timed_out == true }}"
        checkFrequency:
          interval: "PT{{ inputs.poll_seconds }}S"
          maxIterations: 1000
        failOnMaxReached: false
        tasks:
          - id: poll_drain
            type: io.kestra.plugin.scripts.shell.Commands
            taskRunner:
              type: io.kestra.plugin.core.runner.Process
            interpreter:
              - bash
              - -c
            env:
              HA_HOST: "{{ inputs.haproxy_host }}"
              HA_PORT: "{{ inputs.haproxy_port }}"
              HA_BACKEND: "{{ render(vars.backend) }}"
              HA_SERVER: "{{ render(vars.server) }}"
              HA_START: "{{ outputs.start_drain.vars.started_at }}"
              HA_TIMEOUT: "{{ inputs.drain_timeout_seconds }}"
            commands:
              - "{{ vars.read_stats }}"
            retry:
              type: exponential
              interval: PT2S
              maxInterval: PT30S
              maxAttempts: 3

      - id: confirm_drained
        type: io.kestra.plugin.scripts.shell.Commands
        description: One more read after the wait, so the MAINT decision uses the current session count.
        taskRunner:
          type: io.kestra.plugin.core.runner.Process
        interpreter:
          - bash
          - -c
        env:
          HA_HOST: "{{ inputs.haproxy_host }}"
          HA_PORT: "{{ inputs.haproxy_port }}"
          HA_BACKEND: "{{ render(vars.backend) }}"
          HA_SERVER: "{{ render(vars.server) }}"
          HA_START: ""
          HA_TIMEOUT: "0"
        commands:
          - "{{ vars.read_stats }}"
        retry:
          type: exponential
          interval: PT2S
          maxInterval: PT30S
          maxAttempts: 3

      - id: drain_gate
        type: io.kestra.plugin.core.flow.If
        condition: "{{ outputs.confirm_drained.vars.target_sessions > 0 }}"
        then:
          - id: drain_timed_out
            type: io.kestra.plugin.core.execution.Fail
            errorMessage: "Drain of {{ render(vars.backend) }}/{{ render(vars.server) }} timed out after {{ inputs.drain_timeout_seconds }} s with {{ outputs.confirm_drained.vars.target_sessions }} session(s) still open. The server stays in DRAIN: no new sessions, the open ones continue. Nothing was set to MAINT. Find the slow clients, or run with action enable to put the server back in rotation."

      - id: set_maint
        type: io.kestra.plugin.scripts.shell.Commands
        description: Sets MAINT once no sessions are left. Safe because DRAIN has stopped new sessions.
        taskRunner:
          type: io.kestra.plugin.core.runner.Process
        interpreter:
          - bash
          - -c
        env:
          HA_HOST: "{{ inputs.haproxy_host }}"
          HA_PORT: "{{ inputs.haproxy_port }}"
          HA_BACKEND: "{{ render(vars.backend) }}"
          HA_SERVER: "{{ render(vars.server) }}"
          HA_STATE: maint
        commands:
          - "{{ vars.set_state }}"
        retry:
          type: exponential
          interval: PT2S
          maxInterval: PT30S
          maxAttempts: 3

      - id: confirm_maint
        type: io.kestra.plugin.scripts.shell.Commands
        description: Reads the server back to confirm MAINT is what HAProxy now reports.
        taskRunner:
          type: io.kestra.plugin.core.runner.Process
        interpreter:
          - bash
          - -c
        env:
          HA_HOST: "{{ inputs.haproxy_host }}"
          HA_PORT: "{{ inputs.haproxy_port }}"
          HA_BACKEND: "{{ render(vars.backend) }}"
          HA_SERVER: "{{ render(vars.server) }}"
          HA_START: ""
          HA_TIMEOUT: "0"
        commands:
          - "{{ vars.read_stats }}"
        retry:
          type: exponential
          interval: PT2S
          maxInterval: PT30S
          maxAttempts: 3

      - id: maint_gate
        type: io.kestra.plugin.core.flow.If
        condition: "{{ outputs.confirm_maint.vars.target_status != 'MAINT' }}"
        then:
          - id: not_maint
            type: io.kestra.plugin.core.execution.Fail
            errorMessage: "{{ render(vars.backend) }}/{{ render(vars.server) }} was set to MAINT but HAProxy reports status {{ outputs.confirm_maint.vars.target_status }}. Check the server with `show servers state` on the runtime socket."

      - id: notify_drained
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        messageText: >-
          {{ render(vars.backend) }}/{{ render(vars.server) }} is in maintenance: its sessions drained to 0 and HAProxy reports {{ outputs.confirm_maint.vars.target_status }}. {{ outputs.recheck_pool.vars.others_up }} other server(s) are UP. When the work is done, run this flow with action enable.

errors:
  - id: alert_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    messageText: >-
      HAProxy drain gate failed in execution {{ execution.id }}
      {% if errorLogs() | length > 0 %}at `{{ errorLogs()[0]['taskId'] }}`: {{ errorLogs()[0]['message'] | split(' \[\[') | first }}{% else %}without an error message{% endif %}.
      The server state may have changed; check it in HAProxy before you act.
      {{ inputs.kestra_url }}/ui/main/executions/{{ flow.namespace }}/{{ flow.id }}/{{ execution.id }}

outputs:
  - id: server_status
    type: STRING
    description: HAProxy status of the server at the end of the run (MAINT after a drain, UP after an enable). Empty when the run was refused, declined or failed, because outputs are not written on those runs.
    value: "{{ outputs.confirm_health.vars.target_status ?? outputs.confirm_maint.vars.target_status ?? '' }}"
extend:
  title: Take an HAProxy Server Out of Rotation Without Dropping Live Sessions
  shortDescription: Checks that the rest of an HAProxy backend can carry the traffic, asks on-call to approve, drains the server until its sessions close, then sets it to maintenance. Enable mode puts it back once its health check passes.
  metaTitle: HAProxy Backend Drain Gate with Kestra
  metaDescription: Drain an HAProxy server for maintenance after a capacity check and approval, wait for its sessions to close, then re-enable it once health is UP.
  description: |
    Taking a server out of an HAProxy backend for maintenance is easy to get wrong. Setting it to `maint` cuts the connections it is still serving. Taking out one server too many overloads the rest. And the capacity of the pool is rarely checked at the moment it matters, which is right before the change.

    This blueprint does it in order. It checks that enough other servers are UP, asks on-call to approve in the Kestra UI, checks the pool again once the approval comes back (the pool can change while people decide), sets the server to `drain` so no new sessions arrive, waits until its open sessions reach zero, and only then sets `maint`. It talks to HAProxy's runtime API over the stats socket on TCP, so it needs no Data Plane API and no agent. Its shell tasks run with the Process runner, so no Docker is needed.

    ## How it works
    1. `validate_input` (`If`) rejects a bad backend or server name, or a bad mode, before the socket is opened.
    2. `read_pool` (`Commands`) reads `show stat` for the backend. `target_check` (`If`) stops if the server is not in it.
    3. Drain mode (`if_drain`):
       - `precheck` (`If`) refuses without asking anyone when fewer than `min_healthy` other servers are UP. `refuse_drain` ends the run `FAILED`.
       - `ask_approval` (Slack) sends the approval link. `wait_for_decision` (`Pause`, one hour) waits for `drain` or `decline`.
       - `recheck_pool` reads the pool again and `recheck_gate` (`If`) refuses if the answer came after the pool changed.
       - `start_drain` sets `drain`. `wait_drain` (`LoopUntil`) reads the session count every `poll_seconds` until it reaches 0 or `drain_timeout_seconds` passes. `confirm_drained` reads once more and `drain_gate` fails the run if sessions are still open.
       - `set_maint`, `confirm_maint` and `maint_gate` set `maint` and check that HAProxy reports it. `notify_drained` reports.
    4. Enable mode (`if_enable`): `set_ready`, then `wait_health` (`LoopUntil`) until HAProxy reports `UP` or `health_timeout_seconds` passes. `health_gate` (`If`) fails the run if it did not, and `notify_enabled` reports.
    5. A webhook can start either mode with query parameters (`action`, `backend`, `server`).

    ## Error handling
    - **Bad input changes nothing.** Names may contain only letters, digits, dot, dash and underscore. Anything else stops at `reject_input` before the socket is touched.
    - **Capacity is checked twice.** Once before the approval is requested, and again after it. The second check decides, so a stale approval is refused.
    - **Timeouts never send a server to `maint` with sessions open.** If sessions remain at the drain timeout, `drain_timed_out` fails the run and the server stays in `DRAIN`: no new sessions, existing ones continue. Nothing is changed beyond that.
    - **Errors name the task.** The `errors` alert gives the failing task and its cause, for example `read_pool`: "HAProxy runtime socket not reachable at 127.0.0.1:9990", or `not_up` when an enabled server does not pass its health check.
    - **HAProxy's replies are checked.** HAProxy answers errors such as "No such server." with text and success with nothing, so a non-empty reply to `set server` fails the task.
    - **Retries** with exponential backoff on every socket call, so a restarting HAProxy is retried before the run fails.
    - **One run at a time.** `concurrency` (`limit: 1`, `QUEUE`) holds a second run until the approval in progress is answered. Without it, two drains of different servers could each pass the capacity check on their own.

    ## What this blueprint teaches about Kestra
    - A human gate in the middle of a flow: `Pause` with an `onResume` `SELECT`, a default of `decline` when nobody answers, and a fresh read after the pause.
    - `LoopUntil` for "wait until this holds", with the timer in the flow. In the Kestra UI the execution shows as PAUSED between polls. That is expected, not a stuck run.
    - Shell tasks with the `Process` runner, and values passed through `env` instead of being pasted into the command.
    - Webhook query parameters through `trigger.parameters`, and `render()` for a variable that holds a template used inside an expression.
    - Flow `errors` with `errorLogs()` to name the failed task in the alert, and `Exit` for an intended refusal.

    ## Prerequisites
    - HAProxy 2.x (tested with 2.9.15) with a stats socket on TCP at admin level, in the `global` section: `stats socket ipv4@127.0.0.1:9990 level admin`. Bind it to loopback or a management network only: it has no authentication.
    - Kestra 2.0 or later, with worker hosts that have `bash`, `awk` and `date`.
    - A Slack incoming webhook.

    ### Secrets
    - `SLACK_WEBHOOK_URL`: incoming webhook for the channel that approves maintenance and receives the alerts.

    ### Inputs
    - `action` (SELECT `drain` or `enable`, default `drain`): drain goes through approval; enable puts the server back and waits for UP.
    - `backend` (STRING, default `web`): the HAProxy backend name.
    - `server` (STRING, default `web1`): the server inside it. A name that does not exist is refused.
    - `min_healthy` (INT, default 2): other servers that must be UP after the drain. A drain that would leave fewer is refused.
    - `drain_timeout_seconds` (INT, default 600): how long to wait for sessions to close before failing and leaving the server in `DRAIN`.
    - `poll_seconds` (INT, default 10): how often the session count and health are read while waiting.
    - `health_timeout_seconds` (INT, default 120): how long an enable waits for UP.
    - `haproxy_host` and `haproxy_port` (defaults `127.0.0.1` and `9990`): the stats socket.
    - `kestra_url` (STRING, default `http://localhost:8080`): base URL for the approval link.

    ### Outputs
    - `server_status` (STRING): HAProxy status at the end of a successful run, `MAINT` after a drain and `UP` after an enable. Empty when the run was refused, declined or failed, because Kestra writes no outputs on those runs.

    ## Quick start
    1. Set the `SLACK_WEBHOOK_URL` secret and configure HAProxy with the stats socket above.
    2. Run with the defaults. The run checks `web` for `web1`, then posts an approval request to Slack and pauses. Choose `drain` in the Kestra UI.
    3. The server drains, and when its sessions reach 0 it is set to `MAINT`. Run again with `action` set to `enable` to put it back, which waits for UP.

    Measured on the test rig (3 backends, HAProxy 2.9.15, 6 long connections, 2 per server): a drain approved from the UI ran for 60 to 64 seconds. The sessions closed as their 60-second requests finished, then the server was set to `MAINT` and HAProxy confirmed it. The matrix passed 12 of 12 on Kestra 2.0.1 and on 2.0.5 (`latest`).

    ## How to read the result
    - `FAILED` at `refuse_drain`, `refuse_late` or `reject_input`: nothing was changed. The Slack message says what was checked.
    - `FAILED` at `drain_timed_out`: the server is in `DRAIN` with sessions still open. Find those clients; the server is not in `MAINT`.
    - `SUCCESS` with `end_declined`: nobody approved, so the server stayed in rotation.

    ## How to extend
    - Use the HAProxy Data Plane API instead of the stats socket for setups that need authentication. Swap the `Commands` tasks for `io.kestra.plugin.core.http.Request` calls with `options.auth`.
    - Drain several servers in turn with a `Loop` over a list input, keeping `min_healthy` checked for each one.
    - Open a ticket in your tracker from `notify_drained` so the maintenance window has a record.

