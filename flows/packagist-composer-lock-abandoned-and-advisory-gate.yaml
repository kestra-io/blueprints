id: packagist-composer-lock-abandoned-and-advisory-gate
namespace: company.team

description: |
  CI gate for PHP projects built on Packagist. The flow downloads a composer.lock from a raw URL,
  sends every locked package (and every package it replaces at `self.version`) to the Packagist
  security advisories API in one batch, evaluates each advisory's Composer constraint against the
  locked version, and reads each package's Packagist metadata for the `abandoned` flag, the
  suggested replacement, the latest stable release and the first release that clears all known
  advisories. Findings are fingerprinted in KV so Slack only hears about new ones.

inputs:
  - id: composer_lock_url
    type: STRING
    displayName: composer.lock URL
    description: Raw URL of the composer.lock. A `github.com/<owner>/<repo>/blob/<ref>/<path>` link is rewritten to `raw.githubusercontent.com`. The default is the Symfony Demo application at v1.6.1 (mid 2020), which locks Symfony 5.1, Twig 3.0, Zend Framework components and a `3.0.x-dev` branch.
    defaults: https://raw.githubusercontent.com/symfony/demo/662a539a6c7e1f3ffefb5cc48c42a8367b901f5b/composer.lock

  - id: include_dev
    type: BOOL
    defaults: true
    description: Gate on advisories and abandonment in `packages-dev` too (`composer audit` also checks dev packages by default). When false they are still reported, with status NOT_GATED.

  - id: min_severity
    type: SELECT
    values: [low, medium, high, critical]
    defaults: low
    description: Lowest advisory severity that blocks. Advisories below it are BELOW_THRESHOLD. Advisories without a severity (older FriendsOfPHP entries) always gate, because unknown is not low.

  - id: fail_on_abandoned
    type: BOOL
    defaults: false
    description: Count abandoned packages as BLOCKING. When false they are reported with status WARN and alert once.

  - id: ignore_ids
    type: ARRAY
    itemType: STRING
    defaults: []
    description: Accepted risks. Packagist advisory ids (`PKSA-...`), CVE ids or GHSA ids, or a package name such as `doctrine/annotations` to accept its abandonment. Matching findings get status ACCEPTED and never block.

  - id: state_id
    type: STRING
    required: false
    description: Groups runs whose findings are compared, for example `owner/repo#123` for every push to one pull request (whose lock URL changes with each commit SHA). Empty means one state per lock URL.

  - id: fail_on_advisory
    type: BOOL
    defaults: false
    description: true fails the execution when any BLOCKING finding exists (the CI gate; the webhook sets it). false ends in WARNING so the weekly sweep reports without turning red.

triggers:
  - id: ci_gate
    type: io.kestra.plugin.core.trigger.Webhook
    description: |
      CI POSTs `{"composer_lock_url": "https://raw.githubusercontent.com/<owner>/<repo>/<sha>/composer.lock", "state_id": "<owner>/<repo>#<pr>"}`
      to `/api/v1/main/executions/webhook/company.team/packagist-composer-lock-abandoned-and-advisory-gate/<key>`. With `wait`
      and `returnOutputs` the response carries the verdict and counts; a blocked gate answers HTTP 500.
    key: "{{ secret('COMPOSER_GATE_WEBHOOK_KEY') }}"
    wait: true
    returnOutputs: true
    inputs:
      composer_lock_url: "{{ trigger.body.composer_lock_url }}"
      state_id: "{{ trigger.body.state_id ?? '' }}"
      fail_on_advisory: "{{ trigger.body.fail_on_advisory ?? true }}"

  - id: weekly_packagist_sweep
    type: io.kestra.plugin.core.trigger.Schedule
    description: New advisories and abandonments land on versions you already ship. Point `composer_lock_url` at your main branch; only findings not reported before are posted.
    cron: "0 6 * * 1"
    inputs:
      fail_on_advisory: false

tasks:
  - id: download_lock
    type: io.kestra.plugin.core.http.Download
    description: Plain HTTPS download, no checkout and no Composer. A 404 (wrong ref or path) fails here with the status code.
    uri: "{{ (inputs.composer_lock_url contains '://github.com/' and inputs.composer_lock_url contains '/blob/') ? (inputs.composer_lock_url | replace({'://github.com/': '://raw.githubusercontent.com/', '/blob/': '/'})) : inputs.composer_lock_url }}"
    headers:
      User-Agent: kestra-composer-lock-gate/1.0 (+https://kestra.io/blueprints)

  - id: parse_lock
    type: io.kestra.plugin.scripts.python.Script
    description: |
      Standard library only. Reads `packages` and `packages-dev`. A `dev-<branch>` version is resolved through the
      package's `extra.branch-alias` or the lock's root `aliases` (`dev-main` as `3.0.x-dev`); without an alias it is
      DEV_BRANCH and cannot be matched against version ranges. `replace` entries with the constraint `self.version`
      (laravel/framework replaces 30 `illuminate/*` packages) are added as REPLACED rows at the locked version, because
      advisories are often filed against the split package. Replaces with other constraints (`*`, a renamed fork) are skipped.
    containerImage: python:3.13-slim
    inputFiles:
      composer.lock: "{{ outputs.download_lock.uri }}"
    outputFiles:
      - packages.csv
    env:
      LOCK_URL: "{{ inputs.composer_lock_url }}"
      STATE_ID: "{{ inputs.state_id ?? '' }}"
    script: |
      import csv, hashlib, json, os

      raw = open("composer.lock", "rb").read().decode("utf-8-sig", errors="replace")
      try:
          lock = json.loads(raw)
      except ValueError:
          raise SystemExit("The URL did not return JSON. Use the raw composer.lock URL, not a GitHub page.")
      if not isinstance(lock, dict) or not isinstance(lock.get("packages"), list):
          raise SystemExit("No `packages` list: this is not a composer.lock (a composer.json has `require` instead).")

      root_alias = {(a.get("package"), a.get("version")): a.get("alias") for a in lock.get("aliases") or []}
      rows, skipped_replace = [], 0
      for section, key in (("prod", "packages"), ("dev", "packages-dev")):
          for p in lock.get(key) or []:
              name, ver = p["name"].lower(), p["version"]
              eff, res = ver, "TAGGED"
              if ver.startswith("dev-"):
                  alias = root_alias.get((p["name"], ver)) or ((p.get("extra") or {}).get("branch-alias") or {}).get(ver)
                  eff, res = (alias, "DEV_ALIAS") if alias else ("", "DEV_BRANCH")
              elif ver.endswith("-dev"):
                  res = "DEV_ALIAS"
              rows.append([section, name, ver, eff, res, "", (p.get("time") or "")[:10], ((p.get("source") or {}).get("reference") or "")[:12]])
              for rep, constraint in (p.get("replace") or {}).items():
                  if constraint == "self.version":
                      rows.append([section, rep.lower(), ver, eff, "REPLACED", name, "", ""])
                  else:
                      skipped_replace += 1

      with open("packages.csv", "w", newline="", encoding="utf-8") as f:
          w = csv.writer(f)
          w.writerow(["section", "package", "locked_version", "effective_version", "resolution", "replaced_by", "released", "reference"])
          w.writerows(rows)

      count = lambda s, r=None: sum(1 for x in rows if x[0] == s and (r is None and x[4] != "REPLACED" or x[4] == r))
      print(f"Lock {lock.get('content-hash', '?')[:12]}: {count('prod')} packages, {count('dev')} packages-dev, "
            f"{sum(1 for x in rows if x[4] == 'REPLACED')} replaced at self.version ({skipped_replace} other replaces skipped), "
            f"{sum(1 for x in rows if x[4] == 'DEV_ALIAS')} dev versions with an alias, {sum(1 for x in rows if x[4] == 'DEV_BRANCH')} unaliased dev branches")
      identity = os.environ.get("STATE_ID") or os.environ["LOCK_URL"].replace("://github.com/", "://raw.githubusercontent.com/").replace("/blob/", "/")
      print("::" + json.dumps({"outputs": {"packages": count("prod"), "packages_dev": count("dev"),
                                           "state_key": "composer_gate_" + hashlib.sha256(identity.encode()).hexdigest()[:16]}}) + "::")

  - id: previous_findings
    type: io.kestra.plugin.core.kv.Get
    key: "{{ outputs.parse_lock.vars.state_key }}"
    errorOnMissing: false
    description: Fingerprints reported last time for this lock (or `state_id`). Missing on the first run, which is the BASELINE.

  - id: query_packagist
    type: io.kestra.plugin.scripts.python.Script
    description: |
      One POST to `https://packagist.org/api/security-advisories/` with `packages[]` for every name (chunks of 100), then
      `GET https://repo.packagist.org/p2/<vendor>/<package>.json` per locked package (8 in parallel, retries on 429/5xx) for
      `abandoned`, the release list and the latest stable version. Constraints follow Composer's parser: `|` or `||` is OR,
      `,` or a space is AND, `<1.2.3` and `>=1.2.3` compare against `1.2.3-dev` (so 1.2.3-RC1 is not below 1.2.3), and `^`,
      `~`, `1.2.*` and `1.0 - 2.0` expand to ranges. A constraint that cannot be parsed yields REVIEW instead of a silent miss.
    containerImage: python:3.13-slim
    inputFiles:
      packages.csv: "{{ outputs.parse_lock.outputFiles['packages.csv'] }}"
    outputFiles:
      - findings.csv
      - inventory.csv
    script: |
      import csv, json, re, time, urllib.error, urllib.parse, urllib.request
      from concurrent.futures import ThreadPoolExecutor

      UA = {"User-Agent": "kestra-composer-lock-gate/1.0 (+https://kestra.io/blueprints)", "Accept": "application/json"}
      STAB = {"dev": 0, "alpha": 1, "a": 1, "beta": 2, "b": 2, "rc": 3, "patch": 5, "pl": 5, "p": 5}
      VRE = re.compile(r"^v?(\d+)(?:\.(\d+))?(?:\.(\d+))?(?:\.(\d+))?(?:[._-]?(stable|beta|b|rc|alpha|a|patch|pl|p)((?:[.-]?\d+)*))?(?:[.-]?(dev))?$", re.I)

      def http(url, data=None, attempts=5):
          for i in range(attempts):
              try:
                  with urllib.request.urlopen(urllib.request.Request(url, data=data, headers=UA), timeout=60) as r:
                      return json.load(r)
              except urllib.error.HTTPError as e:
                  if e.code == 404:
                      return None
                  if e.code not in (429, 500, 502, 503, 504) or i == attempts - 1:
                      raise
              except urllib.error.URLError:
                  if i == attempts - 1:
                      raise
              time.sleep(2 ** i)

      def norm(v):
          """Composer version as a sortable tuple (4 numbers, stability rank, stability number); None if not a version."""
          v = (v or "").strip()
          m = re.match(r"^v?(\d+(?:\.\d+){0,2})\.[x*]-dev$", v, re.I)  # 3.0.x-dev is 3.0.9999999.9999999-dev
          if m:
              return tuple(([int(x) for x in m.group(1).split(".")] + [9999999] * 4)[:4]) + (0, 0)
          m = VRE.match(v)
          if not m:
              return None
          stab, n, dev = m.group(5), m.group(6), m.group(7)
          return tuple(int(x or 0) for x in m.groups()[:4]) + ((0, 0) if dev else (STAB[stab.lower()] if stab else 4, int(re.sub(r"\D", "", n) or 0) if n else 0))

      def explicit(v):
          return bool(re.search(r"(stable|beta|b|rc|alpha|a|patch|pl|p|dev)\d*$", v, re.I))

      def dev_of(k):
          return k[:4] + (0, 0)

      def bump(parts, i):
          return dev_of(tuple((parts[:i] + [parts[i] + 1] + [0] * 4)[:4]) + (4, 0))

      def atom(c):
          """One constraint term -> list of (op, key) checks, all must hold."""
          if c in ("*", "x", "*@dev"):
              return []
          if c[0] in "^~" or re.match(r"^v?\d+(\.\d+)*\.[x*]$", c):
              base = c.lstrip("^~").rstrip(".*x").rstrip(".")
              parts = [int(x) for x in base.lstrip("v").split(".")] if re.match(r"^v?\d+(\.\d+)*$", base) else None
              if not parts:
                  return None
              low = dev_of(norm(base))
              if c[0] == "^":
                  i = next((j for j, p in enumerate(parts) if p), len(parts) - 1)
              elif c[0] == "~":
                  i = max(len(parts) - 2, 0)
              else:
                  i = len(parts) - 1
              return [(">=", low), ("<", bump(parts, i))]
          m = re.match(r"^(<=|>=|<>|!=|==|=|<|>)?\s*(\S+)$", c)
          if not m or norm(m.group(2)) is None:
              return None
          op, k = m.group(1) or "==", norm(m.group(2))
          if op in ("<", ">=") and not explicit(m.group(2)):
              k = dev_of(k)
          return [({"=": "==", "<>": "!="}.get(op, op), k)]

      def parse(constraint):
          if not constraint.strip():
              return None
          groups = []
          for alt in re.split(r"\s*\|\|?\s*", constraint.strip()):
              alt = re.sub(r"\s*([<>=!]+)\s*", r" \1", alt).strip()
              h = re.match(r"^(\S+)\s+-\s+(\S+)$", alt)
              if h:
                  up = h.group(2).lstrip("v").split(".")
                  upper = [("<=", norm(h.group(2)))] if len(up) >= 3 else [("<", bump([int(x) for x in up], len(up) - 1))]
                  groups.append([(">=", dev_of(norm(h.group(1))))] + upper)
                  continue
              terms = [atom(t) for t in re.split(r"\s*,\s*|\s+(?=[<>=!^~v\d*])", alt) if t]
              if any(t is None for t in terms):
                  return None
              groups.append([chk for t in terms for chk in t])
          return groups

      OPS = {"<": lambda a, b: a < b, "<=": lambda a, b: a <= b, ">": lambda a, b: a > b, ">=": lambda a, b: a >= b, "==": lambda a, b: a == b, "!=": lambda a, b: a != b}
      def hits(k, groups):
          return any(all(OPS[op](k, b) for op, b in g) for g in groups)

      rows = list(csv.DictReader(open("packages.csv", encoding="utf-8")))
      names = sorted({r["package"] for r in rows})
      advisories = {}
      for i in range(0, len(names), 100):
          body = urllib.parse.urlencode([("packages[]", n) for n in names[i:i + 100]]).encode()
          for name, items in ((http("https://packagist.org/api/security-advisories/", body) or {}).get("advisories") or {}).items():
              advisories.setdefault(name.lower(), {}).update({a["advisoryId"]: a for a in items})

      roots = sorted({r["package"] for r in rows if r["resolution"] != "REPLACED"})
      def meta(name):
          doc = http(f"https://repo.packagist.org/p2/{name}.json")
          return name, (doc or {}).get("packages", {}).get(name) if doc else None
      with ThreadPoolExecutor(max_workers=8) as pool:
          metadata = dict(pool.map(meta, roots))

      def parsed(a):
          a.setdefault("_groups", parse(a.get("affectedVersions") or ""))
          return a["_groups"]

      installed = set(roots)
      findings, inventory, unparsed, seen, dupes = [], [], set(), set(), 0
      for r in rows:
          root = r["replaced_by"] or r["package"]
          versions = metadata.get(root)
          k = norm(r["effective_version"])
          stable = sorted({norm(v["version"]): v["version"] for v in versions or [] if (norm(v["version"]) or (0, 0, 0, 0, 0))[4] >= 4}.items())
          latest = stable[-1] if stable else None
          in_major = [s for s in stable if k and s[0][0] == k[0] and (k[0] or s[0][1] == k[1])]
          own = advisories.get(r["package"], {}).values()
          family = [a for n in {root} | {x["package"] for x in rows if x["replaced_by"] == root} for a in advisories.get(n, {}).values()]
          matched = []
          for a in own:
              g = parsed(a)
              if g is None:
                  unparsed.add(a["advisoryId"])
              if k and (g is None or hits(k, g)):
                  matched.append((a, "unparsed constraint" if g is None else "in range"))
          clean = lambda cands: next((v for key, v in cands if (not k or key > k) and not any(g and hits(key, g) for g in map(parsed, family))), "")
          safe, safe_major = (clean(stable), clean(in_major)) if matched else ("", "")
          for a, how in list(matched):
              # the same CVE is often filed on laravel/framework and on the illuminate/* package it replaces
              if r["replaced_by"] and (root, a.get("cve") or a["advisoryId"]) in seen:
                  matched.remove((a, how))
                  dupes += 1
                  continue
              seen.add((root, a.get("cve") or a["advisoryId"]))
              findings.append(["ADVISORY", r["section"], r["package"], r["replaced_by"], r["locked_version"], a["advisoryId"], a.get("cve") or "", a.get("remoteId") or "",
                               (a.get("severity") or "unknown").lower(), (a.get("title") or "")[:200], a.get("affectedVersions") or "", how, safe_major, safe, "", a.get("reportedAt", "")[:10], a.get("link") or ""])
          abandoned = (versions[0].get("abandoned") if versions else None) or False
          replacement = abandoned if isinstance(abandoned, str) and abandoned != "__unset" else ""
          if abandoned and abandoned != "__unset" and not r["replaced_by"]:
              findings.append(["ABANDONED", r["section"], r["package"], "", r["locked_version"], "", "", "", "", "Package is abandoned on Packagist" + (f", use {replacement}" if replacement else ", no replacement suggested"),
                               "", ("replacement already locked" if replacement.lower() in installed else ""), "", "", replacement, "", f"https://packagist.org/packages/{r['package']}"])
          if not latest or not k:
              gap, majors = ("NOT_ON_PACKAGIST" if versions is None and not r["replaced_by"] else "UNKNOWN"), ""
          elif k >= latest[0]:
              gap, majors = "CURRENT", 0
          else:
              gap = "MAJOR" if latest[0][0] != k[0] or (k[0] == 0 and latest[0][1] != k[1]) else "MINOR" if latest[0][1] != k[1] else "PATCH"
              majors = latest[0][0] - k[0]
          if r["replaced_by"] and not matched:
              continue
          inventory.append([r["section"], r["package"], r["replaced_by"], r["locked_version"], r["resolution"], r["released"], latest[1] if latest else "", in_major[-1][1] if in_major else "",
                            gap, majors, "yes" if abandoned and abandoned != "__unset" else "no", replacement, len(own), len(matched), safe_major, safe,
                            "" if not versions or r["resolution"] != "TAGGED" else ("yes" if k in dict(stable) or any(norm(v["version"]) == k for v in versions) else "no")])

      with open("findings.csv", "w", newline="", encoding="utf-8") as f:
          w = csv.writer(f)
          w.writerow(["finding", "section", "package", "via", "locked_version", "advisory_id", "cve", "remote_id", "severity", "title", "affected_versions", "match",
                      "first_safe_same_major", "first_safe_version", "replacement", "reported", "link"])
          w.writerows(findings)
      with open("inventory.csv", "w", newline="", encoding="utf-8") as f:
          w = csv.writer(f)
          w.writerow(["section", "package", "via", "locked_version", "resolution", "released", "latest_stable", "latest_in_major", "behind", "majors_behind", "abandoned",
                      "replacement", "advisories_total", "advisories_matching", "first_safe_same_major", "first_safe_version", "locked_version_still_listed"])
          w.writerows(inventory)

      missing = sorted(n for n in roots if metadata.get(n) is None)
      print(f"Packagist: {len(names)} names in {(len(names) + 99) // 100} advisory request(s), {sum(len(v) for v in advisories.values())} advisories on {sum(1 for v in advisories.values() if v)} packages; "
            f"{len(roots)} metadata files, {len(missing)} not on Packagist{(' (' + ', '.join(missing[:5]) + ')') if missing else ''}; {len(unparsed)} unparsed constraints, {dupes} duplicate CVEs on replaced packages dropped")
      print("::" + json.dumps({"outputs": {"advisory_names": len(names), "advisory_packages": len(advisories), "metadata_missing": len(missing), "unparsed_constraints": len(unparsed)}}) + "::")

  - id: evaluate_findings
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: |
      Applies the policy and the state in SQL. A finding is ACCEPTED (advisory id, CVE or GHSA, or for abandonment the package
      name, in `ignore_ids`) or NOT_GATED (dev package with `include_dev` off). Otherwise an advisory is BELOW_THRESHOLD
      (severity under `min_severity`), REVIEW (unparsed constraint) or BLOCKING, and an abandoned package is BLOCKING with
      `fail_on_abandoned`, else WARN. Fingerprints are package plus advisory id (or
      `abandoned`), without the version, so bumping to another still-affected version does not re-alert.
    url: "jdbc:duckdb:"
    fetchType: FETCH_ONE
    inputFiles:
      findings.csv: "{{ outputs.query_packagist.outputFiles['findings.csv'] }}"
      inventory.csv: "{{ outputs.query_packagist.outputFiles['inventory.csv'] }}"
      previous.json: "{{ outputs.previous_findings.value ?? '[]' }}"
      policy.json: "{{ {'include_dev': inputs.include_dev, 'min_severity': inputs.min_severity, 'fail_on_abandoned': inputs.fail_on_abandoned, 'ignore_ids': inputs.ignore_ids} | toJson }}"
    outputFiles:
      - findings_csv
      - inventory_csv
    sql: |
      SET TimeZone = 'UTC';

      CREATE TABLE policy AS
      SELECT * FROM read_json('policy.json', columns = {'include_dev': 'BOOLEAN', 'min_severity': 'VARCHAR', 'fail_on_abandoned': 'BOOLEAN', 'ignore_ids': 'VARCHAR[]'});

      CREATE TABLE previous AS
      SELECT unnest(from_json(content, '["VARCHAR"]')) AS fingerprint FROM read_text('previous.json');

      CREATE MACRO sev_rank(s) AS CASE s WHEN 'low' THEN 1 WHEN 'medium' THEN 2 WHEN 'moderate' THEN 2 WHEN 'high' THEN 3 WHEN 'critical' THEN 4 ELSE 5 END;

      CREATE TABLE flagged AS
      SELECT *, status IN ('BLOCKING', 'WARN', 'REVIEW') AND fingerprint NOT IN (SELECT fingerprint FROM previous) AS is_new
      FROM (
        SELECT f.*,
               CASE WHEN list_has_any(p.ignore_ids, CASE WHEN f.finding = 'ABANDONED' THEN [f.package] ELSE [f.advisory_id, f.cve, f.remote_id] END) THEN 'ACCEPTED'
                    WHEN f.section = 'dev' AND NOT p.include_dev THEN 'NOT_GATED'
                    WHEN f.finding = 'ABANDONED' THEN CASE WHEN p.fail_on_abandoned THEN 'BLOCKING' ELSE 'WARN' END
                    WHEN f.match = 'unparsed constraint' THEN 'REVIEW'
                    WHEN sev_rank(f.severity) < sev_rank(p.min_severity) THEN 'BELOW_THRESHOLD'
                    ELSE 'BLOCKING' END AS status,
               f.package || '|' || CASE WHEN f.finding = 'ABANDONED' THEN 'abandoned' ELSE f.advisory_id END AS fingerprint
        FROM read_csv('findings.csv', header = true, all_varchar = true) f CROSS JOIN policy p);

      COPY (SELECT status, is_new, * EXCLUDE (status, is_new) FROM flagged
            ORDER BY status = 'BLOCKING' DESC, is_new DESC, finding, sev_rank(severity) DESC, package, advisory_id)
        TO '{{ outputFiles.findings_csv }}' (HEADER, DELIMITER ',');

      COPY (SELECT * FROM read_csv('inventory.csv', header = true, all_varchar = true)
            ORDER BY CAST(advisories_matching AS INT) DESC, abandoned DESC, CAST(nullif(majors_behind, '') AS INT) DESC NULLS LAST, package)
        TO '{{ outputFiles.inventory_csv }}' (HEADER, DELIMITER ',');

      SELECT
        (SELECT count(*) FILTER (WHERE finding = 'ADVISORY') FROM flagged) AS advisories,
        (SELECT count(DISTINCT package) FILTER (WHERE finding = 'ADVISORY') FROM flagged) AS vulnerable_packages,
        (SELECT count(*) FILTER (WHERE finding = 'ABANDONED') FROM flagged) AS abandoned,
        (SELECT count(*) FILTER (WHERE status = 'BLOCKING') FROM flagged) AS blocking,
        (SELECT count(*) FILTER (WHERE status IN ('WARN', 'REVIEW', 'BELOW_THRESHOLD', 'NOT_GATED')) FROM flagged) AS non_blocking,
        (SELECT count(*) FILTER (WHERE status = 'ACCEPTED') FROM flagged) AS accepted,
        (SELECT count(*) FILTER (WHERE is_new) FROM flagged) AS new_findings,
        (SELECT count(*) FROM previous WHERE fingerprint NOT IN (SELECT fingerprint FROM flagged)) AS resolved,
        (SELECT count(*) FROM previous) = 0 AS is_baseline,
        (SELECT count(*) FILTER (WHERE behind = 'MAJOR') FROM read_csv('inventory.csv', header = true, all_varchar = true) WHERE via IS NULL) AS major_behind,
        (SELECT coalesce(string_agg(line, chr(10) ORDER BY ord), '') || CASE WHEN (SELECT count(*) FROM flagged WHERE is_new) > 15
                THEN chr(10) || '... and ' || ((SELECT count(*) FROM flagged WHERE is_new) - 15) || ' more in the findings CSV' ELSE '' END
         FROM (SELECT row_number() OVER (ORDER BY finding DESC, sev_rank(severity) DESC, package) AS ord,
                      CASE WHEN finding = 'ABANDONED' THEN '- `' || package || '` abandoned' || CASE WHEN replacement <> '' THEN ', use ' || replacement ELSE '' END
                           ELSE '- `' || package || '@' || locked_version || '` ' || severity || ' ' || coalesce(nullif(cve, ''), advisory_id) || ' ' || left(title, 80)
                                || CASE WHEN first_safe_version <> '' THEN ', first clean release ' || first_safe_version ELSE ', no clean release yet' END END AS line
               FROM flagged WHERE is_new ORDER BY ord LIMIT 15)) AS new_lines,
        (SELECT coalesce(CAST(to_json(list(fingerprint ORDER BY fingerprint)) AS VARCHAR), '[]') FROM flagged WHERE status IN ('BLOCKING', 'WARN', 'REVIEW')) AS fingerprints;

  - id: save_findings
    type: io.kestra.plugin.core.kv.Set
    description: Current alertable fingerprints. A finding that is fixed and later reintroduced is reported again.
    key: "{{ outputs.parse_lock.vars.state_key }}"
    value: "{{ outputs.evaluate_findings.outputs[0].row.fingerprints }}"

  - id: summary
    type: io.kestra.plugin.core.log.Log
    message: |
      {{ outputs.parse_lock.vars.packages }} packages and {{ outputs.parse_lock.vars.packages_dev }} packages-dev checked against Packagist{{ outputs.evaluate_findings.outputs[0].row.is_baseline ? ', BASELINE run' : '' }}.
      Findings: {{ outputs.evaluate_findings.outputs[0].row.advisories }} advisories on {{ outputs.evaluate_findings.outputs[0].row.vulnerable_packages }} packages, {{ outputs.evaluate_findings.outputs[0].row.abandoned }} abandoned packages, {{ outputs.evaluate_findings.outputs[0].row.major_behind }} packages at least one major behind.
      Policy: {{ outputs.evaluate_findings.outputs[0].row.blocking }} BLOCKING, {{ outputs.evaluate_findings.outputs[0].row.non_blocking }} non-blocking, {{ outputs.evaluate_findings.outputs[0].row.accepted }} ACCEPTED; {{ outputs.evaluate_findings.outputs[0].row.new_findings }} new, {{ outputs.evaluate_findings.outputs[0].row.resolved }} resolved since the last run.
      Findings CSV: {{ outputs.evaluate_findings.outputFiles.findings_csv }}

  - id: notify_new
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    runIf: "{{ outputs.evaluate_findings.outputs[0].row.new_findings > 0 }}"
    allowFailure: true
    description: Posts only findings not reported before for this lock. allowFailure keeps the verdict intact when the webhook secret is not configured.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": {{ ('Composer lock gate: ' ~ outputs.evaluate_findings.outputs[0].row.new_findings ~ ' new findings') | toJson }},
        "blocks": [
          {"type": "section", "text": {"type": "mrkdwn", "text": {{ (':package: *Composer lock gate*: ' ~ outputs.evaluate_findings.outputs[0].row.new_findings ~ ' new findings (' ~ outputs.evaluate_findings.outputs[0].row.blocking ~ ' blocking, ' ~ (inputs.fail_on_advisory ? 'gate' : 'report only') ~ ') in ' ~ inputs.composer_lock_url) | toJson }} }},
          {"type": "section", "text": {"type": "mrkdwn", "text": {{ outputs.evaluate_findings.outputs[0].row.new_lines | toJson }} }},
          {"type": "context", "elements": [{"type": "mrkdwn", "text": {{ ('Execution ' ~ (kestra.url ?? '') ~ '/ui/executions/' ~ flow.namespace ~ '/' ~ flow.id ~ '/' ~ execution.id) | toJson }} }]}
        ]
      }

  - id: gate
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.evaluate_findings.outputs[0].row.blocking > 0 }}"
    then:
      - id: block_merge
        type: io.kestra.plugin.core.execution.Fail
        runIf: "{{ inputs.fail_on_advisory }}"
        errorMessage: "{{ outputs.evaluate_findings.outputs[0].row.blocking }} blocking Composer findings ({{ outputs.evaluate_findings.outputs[0].row.new_findings }} new); see {{ outputs.evaluate_findings.outputFiles.findings_csv }}"

      - id: warn_only
        type: io.kestra.plugin.core.execution.Fail
        runIf: "{{ not inputs.fail_on_advisory }}"
        allowFailure: true
        description: Report mode. The failure is allowed, so the execution ends in WARNING instead of FAILED.
        errorMessage: "{{ outputs.evaluate_findings.outputs[0].row.blocking }} blocking Composer findings (fail_on_advisory is false)"
    else:
      - id: passed
        type: io.kestra.plugin.core.log.Log
        message: "Gate passed: no blocking findings ({{ outputs.evaluate_findings.outputs[0].row.non_blocking }} non-blocking, {{ outputs.evaluate_findings.outputs[0].row.accepted }} accepted, {{ outputs.evaluate_findings.outputs[0].row.resolved }} resolved since the last run)."

outputs:
  - id: findings_csv
    type: FILE
    value: "{{ outputs.evaluate_findings.outputFiles.findings_csv }}"
  - id: inventory_csv
    type: FILE
    value: "{{ outputs.evaluate_findings.outputFiles.inventory_csv }}"
  - id: verdict
    type: STRING
    value: "{{ outputs.evaluate_findings.outputs[0].row.blocking > 0 ? 'FAIL' : 'PASS' }}"
  - id: blocking
    type: INT
    value: "{{ outputs.evaluate_findings.outputs[0].row.blocking }}"
  - id: new_findings
    type: INT
    value: "{{ outputs.evaluate_findings.outputs[0].row.new_findings }}"

extend:
  title: Gate a composer.lock on Packagist Security Advisories and Abandoned Packages
  metaTitle: Composer Lock Advisory and Abandoned Package Gate with Packagist | Kestra
  shortDescription: Check every package in a composer.lock against the Packagist security advisories API and package metadata, report vulnerable versions, abandoned packages with their replacement and how far each package is behind, then fail CI or warn and post only new findings to Slack.
  metaDescription: Audit a composer.lock against Packagist advisories and abandoned flags, evaluate Composer constraints, and gate PHP CI with Kestra, DuckDB and Slack.
  description: |
    `composer audit` needs PHP, Composer and a checkout, and says little about packages that are abandoned or majors behind. This flow reads a composer.lock from a raw URL and uses Packagist's two keyless APIs: the security advisories API, and the Composer v2 metadata (`repo.packagist.org/p2`) for the `abandoned` flag, its suggested replacement and the release history.

    ## How it works

    1. `ci_gate` (Webhook, `wait`, `returnOutputs`) is called by CI with `{"composer_lock_url": "...", "state_id": "owner/repo#123"}` and sets `fail_on_advisory: true`; `weekly_packagist_sweep` (Schedule) re-checks the main branch in report mode.
    2. `download_lock` fetches the file (`github.com/.../blob/...` links are rewritten to raw).
    3. `parse_lock` (Python) reads `packages` and `packages-dev`, resolves `dev-<branch>` through `extra.branch-alias` or the root `aliases`, and adds packages replaced at `self.version` (laravel/framework replaces 30 `illuminate/*` packages, where advisories are often filed) at the locked version.
    4. `previous_findings` (KV Get) loads last run's fingerprints for this lock or `state_id`.
    5. `query_packagist` (Python) sends all names in one `POST /api/security-advisories/` with `packages[]` (chunks of 100) and reads `p2/<vendor>/<package>.json` per package, 8 in parallel with retries. It evaluates each `affectedVersions` (below) and finds the first stable release clear of every known advisory, overall and inside the locked major. A CVE already reported on laravel/framework is not repeated for `illuminate/*`.
    6. `evaluate_findings` (DuckDB) sets ACCEPTED (`ignore_ids`), NOT_GATED (dev with `include_dev` off), BELOW_THRESHOLD (`min_severity`), REVIEW (unparsed constraint), BLOCKING, or for abandonment WARN unless `fail_on_abandoned`. Fingerprints (package plus advisory id, or `abandoned`) are saved to KV.
    7. `notify_new` (Slack, `allowFailure`) posts new findings; `gate` (If) fails the run or ends it in WARNING, per `fail_on_advisory`.

    ### Composer constraint semantics

    `|` or `||` is OR, `,` or a space is AND: `>=1.0,<1.2.3|>=2.0,<2.1` means 1.0 up to 1.2.3, or 2.0 up to 2.1. Versions normalise to four numbers plus stability (dev < alpha < beta < RC < stable < patch); a leading `v` is ignored. As in Composer, `<1.2.3` and `>=1.2.3` compare against `1.2.3-dev`, so 1.2.3-RC1 is not below 1.2.3, while `<=3.26.0` includes 3.26.0-RC1. `^`, `~`, `1.2.*` and `1.0 - 2.0` expand to ranges and `3.0.x-dev` sorts as 3.0.9999999.9999999-dev. An unparseable constraint is REVIEW, never a silent pass.

    ## What you get

    - A findings CSV: status, new flag, ADVISORY or ABANDONED, prod or dev, package, locked version, PKSA id, CVE, GHSA, severity, title, range, first clean release (same major and overall), replacement and whether it is already locked.
    - An inventory CSV: latest stable, latest in the locked major, MAJOR, MINOR, PATCH or CURRENT behind (a 0.x minor bump counts as MAJOR, as `^` treats it), majors behind, abandoned, advisory counts.
    - A CI verdict over HTTP (500 when blocked); Slack only hears about new findings.

    ## Who it's for

    - PHP platform and security teams gating Laravel, Symfony or Drupal repositories, and maintainers tracking abandoned dependencies.

    ## Why orchestrate this with Kestra

    - A Webhook with `wait` and `returnOutputs` is a synchronous CI check, no PHP runtime needed.
    - KV gives per-pull-request state; `If`, `runIf` and `allowFailure` express block, warn and notify; every run keeps its CSVs.

    ## Prerequisites

    - Kestra 2.0 with the Python, DuckDB and Slack plugins; Python uses only the standard library (`python:3.13-slim`).
    - HTTPS to `packagist.org` and `repo.packagist.org` (keyless). Private-repository packages show as NOT_ON_PACKAGIST.

    ### Secrets

    - `COMPOSER_GATE_WEBHOOK_KEY`: key in the webhook URL that CI calls (required for the webhook trigger).
    - `SLACK_WEBHOOK_URL`: Slack incoming webhook (optional; without it the post fails with a warning and the verdict is unchanged).

    ## Quick start

    1. Click **Execute**. The default, Symfony Demo v1.6.1, gives about 48 advisories on 20 packages and 12 abandoned packages (Zend Framework pointing to Laminas) and ends in WARNING.
    2. Execute again: `0 new`, no Slack post.
    3. Try BookStack v21.05 (`https://github.com/BookStackApp/BookStack/blob/d7d8fa1e5b756d7bdab2365edfc54597db1d86a9/composer.lock`) with `min_severity: high` for Laravel 6 and `illuminate/*` replaces.
    4. Add `COMPOSER_GATE_WEBHOOK_KEY` and POST `composer_lock_url` and `state_id` as JSON to `/api/v1/main/executions/webhook/company.team/packagist-composer-lock-abandoned-and-advisory-gate/<key>` with `curl --fail`.
    5. Point `composer_lock_url` at your main branch and enable the schedule.

    ## How to extend

    - Check the lock's `platform` PHP version against endoflife.date.
    - Loop over many repositories with `ForEach` and a Subflow, loading both CSVs into a warehouse.
    - Post the findings CSV as a pull request comment through the GitHub API.

    ## Links

    - [Webhook trigger](https://kestra.io/plugins/core/trigger/io.kestra.plugin.core.trigger.webhook) and [Schedule trigger](https://kestra.io/plugins/core/trigger/io.kestra.plugin.core.trigger.schedule)
    - [Python Script](https://kestra.io/plugins/plugin-script-python/io.kestra.plugin.scripts.python.script) and [DuckDB Queries](https://kestra.io/plugins/plugin-jdbc-duckdb/io.kestra.plugin.jdbc.duckdb.queries)
    - [KV Set](https://kestra.io/plugins/core/kv/io.kestra.plugin.core.kv.set) and [If](https://kestra.io/plugins/core/flow/io.kestra.plugin.core.flow.if)
    - [Slack Incoming Webhook](https://kestra.io/plugins/plugin-notifications/slack/io.kestra.plugin.slack.notifications.slackincomingwebhook)
    - [Packagist API](https://packagist.org/apidoc) and [Composer version constraints](https://getcomposer.org/doc/articles/versions.md)
  tags:
    - Infrastructure
  subTags:
    - CI/CD & Deployment
    - Approval Gates
  ee: false
  demo: false
