id: clickhouse-to-milvus-cdc-vector-sync
namespace: company.team

description: |
  Incremental Change Data Capture (CDC) synchronization from ClickHouse to Milvus Vector Database.
  Extracts mutated or newly created records from an analytical ClickHouse store, generates dense vector
  embeddings, synchronizes upserts and tombstoned deletions in Milvus, and dispatches an audit report to Slack.

inputs:
  - id: clickhouse_table
    type: STRING
    displayName: ClickHouse Source Table
    description: Qualified source table containing document text, metadata, and mutation timestamps.
    defaults: "ecommerce.knowledge_base"

  - id: milvus_uri
    type: URI
    displayName: Milvus Endpoint URI
    description: Connection URI for Milvus Standalone, Distributed cluster, or Zilliz Cloud endpoint.
    defaults: "http://milvus-standalone.internal:19530"

  - id: milvus_collection
    type: STRING
    displayName: Milvus Collection Name
    description: Target vector collection where entity embeddings and scalar metadata are indexed.
    defaults: "enterprise_knowledge_base"

  - id: batch_size
    type: INT
    displayName: Sync Batch Limit
    description: Maximum number of incremental CDC records to process in a single execution window.
    defaults: 250

  - id: lookback_minutes
    type: INT
    displayName: Watermark Lookback Window (Minutes)
    description: Time window inspected for recently updated or deleted rows in ClickHouse.
    defaults: 60

  - id: embedding_dim
    type: INT
    displayName: Vector Embedding Dimensions
    description: Dimensionality of the generated dense vector embeddings.
    defaults: 384

  - id: slack_channel
    type: STRING
    displayName: Notification Slack Channel
    description: Target Slack channel receiving CDC vector sync metrics and failure alerts.
    defaults: "#ai-data-ops"

outputs:
  - id: vectors_upserted
    type: INT
    value: "{{ outputs.sync_cdc_records_to_milvus.vars.vectors_upserted }}"
  - id: vectors_deleted
    type: INT
    value: "{{ outputs.sync_cdc_records_to_milvus.vars.vectors_deleted }}"
  - id: sync_status
    type: STRING
    value: "{{ outputs.sync_cdc_records_to_milvus.vars.sync_status }}"

triggers:
  - id: microbatch_sync_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    description: Recurring microbatch schedule running every 15 minutes. Shipped disabled by default.
    cron: "*/15 * * * *"
    disabled: true

  - id: upstream_cdc_webhook
    type: io.kestra.plugin.core.trigger.Webhook
    description: Authenticated HTTP webhook endpoint allowing upstream services to trigger immediate synchronization.
    key: "{{ secret('WEBHOOK_KEY') }}"

tasks:
  - id: sync_cdc_records_to_milvus
    type: io.kestra.plugin.scripts.python.Script
    description: Extracts incremental records from ClickHouse, generates dense vector embeddings, and executes upserts and deletes in Milvus.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install -q --no-cache-dir pymilvus clickhouse-connect numpy kestra
    env:
      CLICKHOUSE_HOST: "{{ secret('CLICKHOUSE_HOST') ?? 'clickhouse.internal' }}"
      CLICKHOUSE_PORT: "{{ secret('CLICKHOUSE_PORT') ?? '8123' }}"
      CLICKHOUSE_USER: "{{ secret('CLICKHOUSE_USER') ?? 'default' }}"
      CLICKHOUSE_PASSWORD: "{{ secret('CLICKHOUSE_PASSWORD') ?? '' }}"
      CLICKHOUSE_TABLE: "{{ inputs.clickhouse_table }}"
      MILVUS_URI: "{{ inputs.milvus_uri }}"
      MILVUS_TOKEN: "{{ secret('MILVUS_TOKEN') ?? '' }}"
      MILVUS_COLLECTION: "{{ inputs.milvus_collection }}"
      LOOKBACK_MINUTES: "{{ inputs.lookback_minutes }}"
      BATCH_SIZE: "{{ inputs.batch_size }}"
      EMBEDDING_DIM: "{{ inputs.embedding_dim }}"
    script: |
      import os
      import sys
      import json
      import time
      import hashlib
      import numpy as np
      from kestra import Kestra

      table_name = os.environ.get("CLICKHOUSE_TABLE", "ecommerce.knowledge_base")
      milvus_uri = os.environ.get("MILVUS_URI", "http://milvus-standalone.internal:19530")
      milvus_token = os.environ.get("MILVUS_TOKEN", "")
      milvus_collection = os.environ.get("MILVUS_COLLECTION", "enterprise_knowledge_base")
      lookback_minutes = int(os.environ.get("LOOKBACK_MINUTES", "60"))
      batch_size = int(os.environ.get("BATCH_SIZE", "250"))
      dim = int(os.environ.get("EMBEDDING_DIM", "384"))

      start_ts = time.time()
      print(f"Connecting to ClickHouse to extract CDC records from {table_name}...")

      def generate_deterministic_embedding(text: str, dimensions: int) -> list:
          hasher = hashlib.sha256(text.encode("utf-8"))
          seed = int(hasher.hexdigest()[:8], 16)
          rng = np.random.default_rng(seed)
          vec = rng.standard_normal(dimensions).astype(np.float32)
          norm = np.linalg.norm(vec)
          if norm > 0:
              vec = vec / norm
          return vec.tolist()

      records = []
      try:
          import clickhouse_connect
          ch_client = clickhouse_connect.get_client(
              host=os.environ.get("CLICKHOUSE_HOST", "clickhouse.internal"),
              port=int(os.environ.get("CLICKHOUSE_PORT", "8123")),
              username=os.environ.get("CLICKHOUSE_USER", "default"),
              password=os.environ.get("CLICKHOUSE_PASSWORD", ""),
              connect_timeout=10
          )
          query = f"""
              SELECT id, title, content, category, is_deleted, updated_at
              FROM {table_name}
              WHERE updated_at >= now() - INTERVAL {lookback_minutes} MINUTE
              ORDER BY updated_at ASC
              LIMIT {batch_size}
          """
          result = ch_client.query(query)
          for row in result.result_rows:
              records.append({
                  "id": str(row[0]),
                  "title": str(row[1]),
                  "content": str(row[2]),
                  "category": str(row[3]),
                  "is_deleted": int(row[4]),
                  "updated_at": str(row[5])
              })
          print(f"Retrieved {len(records)} CDC records from ClickHouse.")
      except Exception as exc:
          print(f"ERROR: ClickHouse query failed: {exc}", file=sys.stderr)
          sys.exit(1)

      upsert_records = [r for r in records if r.get("is_deleted", 0) == 0]
      delete_records = [r for r in records if r.get("is_deleted", 0) == 1]
      delete_ids = [r["id"] for r in delete_records]

      upsert_payload = []
      for r in upsert_records:
          text_to_embed = f"{r['title']}: {r['content']}"
          vector = generate_deterministic_embedding(text_to_embed, dim)
          upsert_payload.append({
              "id": r["id"],
              "vector": vector,
              "title": r["title"],
              "category": r["category"],
              "updated_at": r["updated_at"]
          })

      print(f"Connecting to Milvus at {milvus_uri}...")
      try:
          from pymilvus import MilvusClient
          milvus_kwargs = {"uri": milvus_uri}
          if milvus_token:
              milvus_kwargs["token"] = milvus_token
          client = MilvusClient(**milvus_kwargs)

          if not client.has_collection(collection_name=milvus_collection):
              print(f"Creating Milvus collection '{milvus_collection}' with dimension {dim}...")
              client.create_collection(
                  collection_name=milvus_collection,
                  dimension=dim,
                  metric_type="COSINE"
              )

          if upsert_payload:
              print(f"Upserting {len(upsert_payload)} entities into Milvus collection '{milvus_collection}'...")
              client.upsert(collection_name=milvus_collection, data=upsert_payload)

          if delete_ids:
              print(f"Deleting {len(delete_ids)} tombstoned entities from Milvus...")
              client.delete(collection_name=milvus_collection, ids=delete_ids)

          print("Milvus synchronization completed successfully.")
      except Exception as exc:
          print(f"ERROR: Milvus synchronization failed: {exc}", file=sys.stderr)
          sys.exit(1)

      duration = round(time.time() - start_ts, 2)
      outputs = {
          "source_table": table_name,
          "milvus_collection": milvus_collection,
          "records_inspected": len(records),
          "vectors_upserted": len(upsert_payload),
          "vectors_deleted": len(delete_ids),
          "embedding_dimension": dim,
          "sync_status": "SUCCESS",
          "duration_seconds": duration,
          "message": f"CDC sync complete: {len(upsert_payload)} vectors upserted, {len(delete_ids)} vectors purged in {duration}s."
      }

      print(f"Result: {outputs['message']}")
      Kestra.outputs(outputs)

  - id: evaluate_sync_impact
    type: io.kestra.plugin.core.flow.If
    description: Evaluates whether any entities were upserted or purged to notify the AI operations team.
    condition: "{{ outputs.sync_cdc_records_to_milvus.vars.vectors_upserted > 0 or outputs.sync_cdc_records_to_milvus.vars.vectors_deleted > 0 }}"
    then:
      - id: notify_slack_sync_success
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches an itemized CDC synchronization audit card to Slack.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "{{ inputs.slack_channel }}",
            "text": "ClickHouse to Milvus CDC Sync Complete: {{ outputs.sync_cdc_records_to_milvus.vars.vectors_upserted }} vectors upserted, {{ outputs.sync_cdc_records_to_milvus.vars.vectors_deleted }} vectors purged."
          }

errors:
  - id: alert_on_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alert Slack if CDC sync fails.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "{{ inputs.slack_channel }}",
        "text": "CRITICAL: ClickHouse to Milvus CDC vector synchronization failed on execution `{{ execution.id }}`."
      }

extend:
  title: ClickHouse to Milvus CDC Vector Synchronization
  shortDescription: Incrementally synchronizes mutated records from ClickHouse to Milvus with dense vector embeddings.
  metaTitle: ClickHouse to Milvus CDC Vector Synchronization | Kestra Blueprint
  metaDescription: Incrementally syncs ClickHouse analytics mutations into Milvus vector collections with automated dense embeddings and Slack alerts.
  description: |
    Automates continuous Change Data Capture (CDC) synchronization between analytical ClickHouse tables and high-performance Milvus vector databases.
  tags:
    - AI
    - Database
  subTags:
    - Vector Stores & RAG
    - Change Data Capture (CDC)
  ee: false
  demo: false
