id: kafka-client-quota-guard
namespace: company.team

description: |
  Keep Kafka client-id quotas on the declared policy: describe every client quota on the
  cluster, report policy clients with no quota or a different one, and any client allowed
  more than the ceiling (an ad-hoc notebook allowed 100 MB/s can starve every producer on
  the broker). Alert Slack, and optionally apply the policy values and clamp over-ceiling
  rates with QuotaAlter, then describe the quotas again to verify. Off by default.

inputs:
  - id: bootstrap_servers
    type: STRING
    displayName: Kafka bootstrap servers
    defaults: "localhost:9092"

  - id: policy
    type: JSON
    displayName: Quota policy
    description: Required quotas per client-id, in bytes per second. Keys among producer_byte_rate, consumer_byte_rate and request_percentage.
    defaults: >-
      {"etl-loader": {"producer_byte_rate": 5242880, "consumer_byte_rate": 10485760},
       "billing-service": {"producer_byte_rate": 524288, "consumer_byte_rate": 1048576},
       "analytics-reader": {"consumer_byte_rate": 20971520}}

  - id: ceiling_byte_rate
    type: INT
    displayName: Ceiling (bytes/s)
    description: No client, in the policy or not, may have a producer or consumer byte rate above this.
    defaults: 52428800

  - id: auto_remediate
    type: BOOL
    displayName: Auto remediate
    defaults: false

  - id: dry_run
    type: BOOL
    displayName: Dry run
    description: Must be false, together with auto_remediate, for QuotaAlter to run.
    defaults: true

tasks:
  - id: describe
    type: io.kestra.plugin.kafka.QuotaDescribe
    description: Read-only. Every quota entity on the cluster with its configured rates.
    properties:
      bootstrap.servers: "{{ inputs.bootstrap_servers }}"

  - id: findings
    type: io.kestra.plugin.core.output.OutputValues
    description: One finding per client to fix, with the rates to set. Rates already right are left out.
    values:
      items: >-
        {{ {'policy': inputs.policy, 'live': outputs.describe.quotas ?? [], 'ceil': inputs.ceiling_byte_rate} | jq('
           (.live | map(select(.entity["client-id"] != null) | {(.entity["client-id"]): .quotas}) | add // {}) as $live
           | .ceil as $ceil
           | ([.policy | to_entries[] | . as $p | ($live[$p.key] // null) as $cur
               | {client: $p.key, current: $cur, set: ($p.value | with_entries(select(($cur // {})[.key] != .value)))}
               | select(.set | length > 0)
               | . + {reason: (if .current == null then "NO_QUOTA" else "DRIFT" end)}])
           + ([$live | to_entries[] | select(.key as $c | (["producer_byte_rate", "consumer_byte_rate"] | map(. as $r | ($live[$c][$r] // 0) > $ceil) | any))]
              | map(. as $e | {client: .key, current: .value, reason: "OVER_CEILING",
                    set: (["producer_byte_rate", "consumer_byte_rate"] | map(select(($e.value[.] // 0) > $ceil)) | map({(.): $ceil}) | add)}))
           | group_by(.client) | map({client: .[0].client, current: .[0].current, reason: (map(.reason) | unique | join("+")), set: (map(.set) | add)})') | first | toJson }}

  - id: summary
    type: io.kestra.plugin.core.log.Log
    message: >-
      Kafka client quotas on {{ inputs.bootstrap_servers }}: {{ outputs.describe.quotas | length }} quota entities,
      {{ fromJson(outputs.findings.values.items) | length }} clients to fix{{ fromJson(outputs.findings.values.items) | jq('if length == 0 then "" else ": " + (map("\(.client) \(.reason) \(.current // {} | tojson) -> \(.set | tojson)") | join("; ")) end') | first }}.

  - id: route
    type: io.kestra.plugin.core.flow.If
    condition: "{{ fromJson(outputs.findings.values.items) | length > 0 }}"
    then:
      - id: alert
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {{ {'text': 'Kafka client quotas off policy on ' ~ inputs.bootstrap_servers ~ ': ' ~ (fromJson(outputs.findings.values.items) | jq('map("\(.client) (\(.reason))") | join(", ")') | first) ~ '.' ~ (inputs.auto_remediate and not inputs.dry_run ? ' Applying the policy now.' : ' No change applied (auto_remediate=' ~ inputs.auto_remediate ~ ', dry_run=' ~ inputs.dry_run ~ ').')} | toJson }}

      - id: remediate_gate
        type: io.kestra.plugin.core.flow.If
        condition: "{{ inputs.auto_remediate and not inputs.dry_run }}"
        then:
          - id: remediate
            type: io.kestra.plugin.core.flow.Loop
            description: One QuotaAlter per client, setting only the rates that are wrong. A rate left empty is not touched.
            values: "{{ outputs.findings.values.items }}"
            tasks:
              - id: alter
                type: io.kestra.plugin.kafka.QuotaAlter
                properties:
                  bootstrap.servers: "{{ inputs.bootstrap_servers }}"
                entityClientId: "{{ fromJson(item.value).client }}"
                producerByteRate: "{{ fromJson(item.value).set | jq('.producer_byte_rate') | first }}"
                consumerByteRate: "{{ fromJson(item.value).set | jq('.consumer_byte_rate') | first }}"
                requestPercentage: "{{ fromJson(item.value).set | jq('.request_percentage') | first }}"

          - id: verify
            type: io.kestra.plugin.kafka.QuotaDescribe
            properties:
              bootstrap.servers: "{{ inputs.bootstrap_servers }}"

          - id: verify_result
            type: io.kestra.plugin.core.flow.If
            condition: >-
              {{ {'want': fromJson(outputs.findings.values.items), 'live': outputs.verify.quotas} | jq('(.live | map(select(.entity["client-id"] != null) | {(.entity["client-id"]): .quotas}) | add // {}) as $l
                 | [.want[] | .client as $c | .set | to_entries[] | select(($l[$c][.key] // null) != .value)] | length') | first > 0 }}
            then:
              - id: remediation_failed
                type: io.kestra.plugin.core.execution.Fail
                errorMessage: "QuotaAlter ran, but the re-describe shows quotas that still differ."
            else:
              - id: remediated
                type: io.kestra.plugin.core.log.Log
                message: "Applied and verified on {{ fromJson(outputs.findings.values.items) | length }} clients."
    else:
      - id: compliant
        type: io.kestra.plugin.core.log.Log
        message: "Every policy client has its quotas and no client is above {{ inputs.ceiling_byte_rate }} bytes/s."

errors:
  - id: alert_flow_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {{ {'text': 'Kafka client quota guard failed on ' ~ inputs.bootstrap_servers ~ ' (execution ' ~ execution.id ~ '). Quota state unknown, check the logs.'} | toJson }}

triggers:
  - id: hourly
    type: io.kestra.plugin.core.trigger.Schedule
    description: Shipped disabled, and always in safe mode.
    cron: "15 * * * *"
    disabled: true
    inputs:
      auto_remediate: false
      dry_run: true

extend:
  title: Kafka Client Quota Guard
  shortDescription: Check every Kafka client-id quota against a declared policy and a byte-rate ceiling, alert Slack, and optionally apply the policy with QuotaAlter and verify it.
  metaTitle: Kafka Client Quota Guard with Kestra
  metaDescription: Audit Kafka client-id quotas against a policy and a ceiling, alert Slack, and enforce them with QuotaAlter behind dry-run gates, then verify.
  description: |
    Kafka quotas are what stop one client from taking the whole broker. They get lost the same way other configs do. A new service ships without its quota. Someone raises a notebook's consumer rate to 100 MB/s for a one-off backfill and leaves it. A quota set by hand differs from the one in the capacity plan. The first sign is usually every other producer timing out.

    This blueprint reads every client-id quota on the cluster with the AdminClient and checks it against a declared policy and a ceiling that applies to every client. It alerts Slack, and can apply the policy with `QuotaAlter` behind two gates, then describes the quotas again to verify.

    This blueprint was created by [zkasuran](https://github.com/zkasuran).

    ## Findings

    | Finding | Rule | Fix applied |
    |---|---|---|
    | `NO_QUOTA` | A client in the policy has no quota on the cluster | The policy rates |
    | `DRIFT` | A policy client has a rate that differs from the policy | Only the rates that differ |
    | `OVER_CEILING` | Any client, in the policy or not, has a producer or consumer byte rate above `ceiling_byte_rate` | That rate clamped to the ceiling |

    A client that is right is not touched. A rate not in the policy is never changed or removed.

    ## How it works

    1. `describe` (`io.kestra.plugin.kafka.QuotaDescribe`, read-only) lists every quota entity and its rates.
    2. `findings` compares them with the policy and the ceiling in one jq expression. It keeps, per client, only the rates to set.
    3. `summary` logs the result every run.
    4. `route` (`io.kestra.plugin.core.flow.If`):
       - **compliant:** logs it.
       - **findings:** `alert` posts to Slack.
         - `remediate_gate` runs only when `auto_remediate` is true and `dry_run` is false.
         - `remediate` (`io.kestra.plugin.core.flow.Loop` over `io.kestra.plugin.kafka.QuotaAlter`) sets only the wrong rates. A rate that renders empty is skipped.
         - `verify` describes again, and `verify_result` fails if any rate still differs.
    5. `errors` alerts Slack when the flow fails, for example on an unreachable broker.

    ## What you get

    - One view of every client-id quota on the cluster, checked against the capacity plan.
    - Three findings (missing quota, drifted rate, rate above the ceiling) with the exact rates to set.
    - Fixes limited to the rates that are wrong, behind two gates, verified by a second describe.

    ## Who it's for

    - Platform teams running a shared Kafka cluster for many services.
    - SREs who have seen one client starve the brokers and want a ceiling enforced on every client.
    - Teams evaluating the Kafka plugin who want an example of `QuotaDescribe` and `QuotaAlter`.

    ## Why orchestrate this with Kestra

    Quotas are set once with `kafka-configs.sh` and then forgotten. Kestra runs the check on a schedule, keeps the policy next to the flow, turns findings into a Slack alert, gates the change behind `auto_remediate` and `dry_run`, and keeps a history of every run, so you can see when a quota changed and who put it back.

    ## Tested end to end

    On Kestra 2.0.5 OSS against Apache Kafka 3.9.1 (KRaft), with a local HTTP sink standing in for Slack. Quotas were set beforehand with `kafka-configs.sh`:
    - `etl-loader`: below the policy;
    - `billing-service`: on the policy;
    - `adhoc-notebook`: consumer rate of 100 MB/s, above the 50 MB/s ceiling;
    - `analytics-reader`: no quota at all.

    | Run | Inputs | Result |
    |---|---|---|
    | 1 | defaults | 3 findings: `etl-loader` DRIFT, `analytics-reader` NO_QUOTA, `adhoc-notebook` OVER_CEILING. `billing-service` not reported. Alert sent |
    | 2 | `auto_remediate: true`, `dry_run: true` | Same report. `kafka-configs.sh` shows nothing changed |
    | 3 | `auto_remediate: true`, `dry_run: false` | 3 `QuotaAlter` calls, re-describe passes. `kafka-configs.sh` shows `etl-loader` at 5 MB/s and 10 MB/s, `analytics-reader` at 20 MB/s and `adhoc-notebook` at 50 MB/s |
    | 4 | defaults again | Compliant, no alert |
    | 5 | unreachable broker | AdminClient timeout, the `errors` alert is sent |

    ## Prerequisites

    - A Kafka cluster reachable from the Kestra worker, and a principal allowed to `DescribeConfigs` and, for remediation, `AlterConfigs` on the cluster.
    - Local testing: `docker run -d --name kafka -p 9092:9092 apache/kafka:3.9.1`, then set a few quotas with `kafka-configs.sh --alter --entity-type clients`.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack incoming webhook used by `alert` and the `errors` block. In Kestra OSS, provide it as the base64-encoded environment variable `SECRET_SLACK_WEBHOOK_URL`.

    ### Inputs

    | Input | Default | Purpose |
    |---|---|---|
    | `bootstrap_servers` | `localhost:9092` | Brokers |
    | `policy` | 3 example clients | Required rates per client-id |
    | `ceiling_byte_rate` | `52428800` (50 MB/s) | Highest rate any client may have |
    | `auto_remediate` | `false` | Allow `QuotaAlter` |
    | `dry_run` | `true` | Must be `false` for a change to apply |

    The `hourly` trigger is shipped disabled and always runs in safe mode.

    ## Quick start

    1. Add the `SLACK_WEBHOOK_URL` secret.
    2. Import the flow, set `bootstrap_servers`, and replace `policy` with your clients and rates.
    3. Run it once with the defaults and read the findings.
    4. Run it with `auto_remediate: true` and `dry_run: false` to apply them.
    5. Enable the `hourly` trigger, which always runs in safe mode.

    ## How to extend

    - Add user and IP quotas with the `entityUser` and `entityIp` properties.
    - Load the policy from a Git repository or a namespace file so it is reviewed like code.
    - Compare quotas with actual traffic from your metrics backend and flag clients that never come near theirs.
    - Open a ticket instead of fixing when the client belongs to another team.

    ## Links

    - Kafka quotas: https://kafka.apache.org/documentation/#design_quotas
    - Kafka plugin: https://kestra.io/plugins/plugin-kafka
  tags:
    - Data
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - Day 2 Operations
  ee: false
  demo: false
