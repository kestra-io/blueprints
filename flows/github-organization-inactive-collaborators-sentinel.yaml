id: github-organization-inactive-collaborators-sentinel
namespace: company.security

inputs:
  - id: github_org
    type: STRING
    description: GitHub organization name.
  - id: max_inactive_members
    type: INT
    defaults: 5
    description: Maximum acceptable count of members with pending or inactive outside collaborator status.

tasks:
  - id: audit_outside_collaborators
    type: io.kestra.plugin.scripts.shell.Commands
    containerImage: ghcr.io/kestra-io/tools:latest
    commands:
      - |
        curl -s -H "Authorization: Bearer {{ secret('GITHUB_TOKEN') }}"           "https://api.github.com/orgs/{{ inputs.github_org }}/outside_collaborators?per_page=100" > /tmp/collaborators.json
        
        COLLAB_COUNT=$(jq 'length // 0' /tmp/collaborators.json)
        COLLAB_LOGINS=$(jq -r '[.[0:10][] | .login] | join(", ")' /tmp/collaborators.json)
        
        echo "::set-output name=collab_count::$COLLAB_COUNT::"
        echo "::set-output name=sample_logins::$COLLAB_LOGINS::"

  - id: evaluate_collaborator_sprawl
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.audit_outside_collaborators.vars.collab_count | int > inputs.max_inactive_members }}"
    then:
      - id: notify_security_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#sec-ops-alerts",
            "attachments": [
              {
                "color": "warning",
                "title": "⚠️ GitHub Organization Outside Collaborator Sprawl Alert",
                "text": "Organization `{{ inputs.github_org }}` has *{{ outputs.audit_outside_collaborators.vars.collab_count }}* outside collaborator(s) with repository access (sample users: {{ outputs.audit_outside_collaborators.vars.sample_logins }}). Impact: Contractor and vendor accounts retaining repository access after contract completion violate principle of least privilege and SOC2 access governance.",
                "footer": "Kestra Security Governance • GitHub IAM"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#sec-ops-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ GitHub Collaborator Sentinel Execution Failed",
            "text": "The outside collaborator audit query failed. Please verify organization permissions and GITHUB_TOKEN scope.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 9 * * 1"
    disabled: true
    inputs:
      github_org: replace-with-your-github-org

extend:
  metaDescription: "Audits GitHub organization outside collaborators to detect orphaned contractor accounts and enforce least-privilege IAM hygiene."
  metaTitle: GitHub Organization Outside Collaborator Access Governance Sentinel with Kestra
  title: GitHub Organization Outside Collaborator Access Governance Sentinel
  shortDescription: Audits GitHub organization outside collaborators to detect orphaned contractor accounts and enforce least-privilege IAM hygiene.
  description: |
    ## How it works
    This workflow connects to the GitHub REST API (`/orgs/{org}/outside_collaborators`) to audit all non-member external collaborators granted direct repository permissions. External contractors, offshore development partners, and temporary vendors frequently retain code repository access long after projects conclude. When collaborator counts exceed safety thresholds, an automated Slack compliance notification is dispatched.

    ## What you get
    - Proactive visibility into external contractor and vendor access footprints.
    - Simplifies SOC2, ISO27001, and HIPAA identity access review (IAM) certifications.
    - Prevents supply-chain source code exfiltration through abandoned vendor accounts.

    ## Who it's for
    - Security Operations (SecOps) and IT Compliance Officers auditing cloud developer access.
    - Engineering Directors managing contractor and vendor onboarding/offboarding.

    ## Why orchestrate this with Kestra
    - **Scheduled Weekly Sweeps**: Automate compliance audits every Monday morning without spreadsheets.
    - **Enterprise Extensibility**: Seamlessly connect to identity governance systems (Okta, Jira Service Management).
    - **Audit Log Trail**: Keep immutable execution logs of access reviews for external compliance audits.

    ## Prerequisites
    - GitHub personal access token or GitHub App token with `admin:org` permissions.
    - Secrets `GITHUB_TOKEN` and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import this blueprint into Kestra.
    2. Supply your GitHub organization name and credentials.
    3. Run the workflow to inspect current outside collaborator access.

    ## How to extend
    - Cross-reference GitHub logins against active HRIS directories (e.g., Workday, BambooHR).
    - Automatically revoke permissions for contractors whose end date has passed.

    ## Links
    - [GitHub Outside Collaborators REST API Documentation](https://docs.github.com/en/rest/orgs/outside-collaborators)
    - [Kestra Shell Plugin](https://kestra.io/plugins/plugin-scripts/commands/io.kestra.plugin.scripts.shell.commands)
  tags:
    - Cloud
    - Business
  subTags:
    - CI/CD & Deployment
    - Infrastructure Automation
  ee: false
  demo: false
