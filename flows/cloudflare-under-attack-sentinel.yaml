id: cloudflare-under-attack-sentinel
namespace: company.netops

inputs:
  - id: cloudflare_zone_id
    type: STRING
    defaults: 023e105f4ecef8ad9ca31a8372d0c353
    description: The 32-character Cloudflare Zone Tag ID to inspect.

tasks:
  - id: query_security_level
    type: io.kestra.plugin.scripts.shell.Commands
    runner: PROCESS
    commands:
      - |
        curl -s -H "Authorization: Bearer {{ secret('CLOUDFLARE_API_TOKEN') }}"           -H "Content-Type: application/json"           "https://api.cloudflare.com/client/v4/zones/{{ inputs.cloudflare_zone_id }}/settings/security_level" > sec_level.json
        python3 -c "
        import json
        with open('sec_level.json') as f:
            data = json.load(f)
        level = data.get('result', {}).get('value', 'unknown')
        is_under_attack = (level == 'under_attack')
        result = {
            'zone_id': '{{ inputs.cloudflare_zone_id }}',
            'security_level': level,
            'is_under_attack': is_under_attack
        }
        with open('sec_summary.json', 'w') as out:
            json.dump(result, out)
        print('Cloudflare security level audit:', result)
        "
    outputFiles:
      - sec_summary.json

  - id: evaluate_attack_mode
    type: io.kestra.plugin.core.flow.If
    condition: "{{ json(read(outputs.query_security_level.outputFiles['sec_summary.json'])).is_under_attack }}"
    then:
      - id: alert_soc_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "text": ":shield: *Cloudflare Under Attack Alert*: Zone `{{ inputs.cloudflare_zone_id }}` is currently operating in `under_attack` mode. JavaScript challenges are actively being served to all visitors."
          }

errors:
  - id: notify_sentinel_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "text": ":warning: *Cloudflare Sentinel Execution Failure*: Failed to query security level for zone {{ inputs.cloudflare_zone_id }}."
      }

triggers:
  - id: scheduled_security_check
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  title: Cloudflare Under Attack Mode Security Sentinel
  shortDescription: Audits Cloudflare zone settings to detect active Under Attack mode and remind operators when mitigation can be safely dialed back.
  description: |
    ## How it works
    This workflow contacts the Cloudflare Zone Settings API to evaluate the active `security_level`. It alerts SecOps teams whenever Under Attack mode is enabled, ensuring that intrusive JavaScript interstitial challenges are not left active indefinitely after a DDoS attack subsides.

    ## What you get
    - Immediate notification when automated or manual mitigations engage Under Attack mode.
    - Prevention of prolonged user friction and conversion rate drops caused by forgotten security modes.
    - Automated Slack delivery tracking active security mode status.

    ## Who it's for
    - Security operations (SecOps) teams and SOC analysts managing edge CDN defense.
    - Site reliability engineers overseeing user experience during cyberattacks.

    ## Why orchestrate this with Kestra
    Kestra automates distributed cloud observability, executing scheduled health checks with fine-grained error management and notification delivery.

    ## Prerequisites
    - Cloudflare API Token with `Zone.Zone_Settings:Read` permissions.
    - Secrets `CLOUDFLARE_API_TOKEN` and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import this blueprint into Kestra.
    2. Configure `cloudflare_zone_id`.
    3. Run manually to check current security level.

    ## How to extend
    - Query Cloudflare GraphQL Analytics to determine when traffic volume returns to normal baselines.
    - Automatically downgrade security level to `medium` or `high` via an automated subflow once attack traffic ceases.
    - Log security level changes to an incident timeline channel.

    ## Links
    - [Cloudflare Security Level Documentation](https://developers.cloudflare.com/waf/tools/security-level/)
    - [Kestra Slack Notifications](https://kestra.io/plugins/plugin-slack)
  tags:
    - Cloud
    - Infrastructure
  subTags:
    - Monitoring & Alerting
  ee: false
  demo: false
