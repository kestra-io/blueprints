id: skopeo-multiarch-manifest-compliance-gate
namespace: company.team

description: |
  Audit container image registry manifest lists using Skopeo to verify multi-architecture
  coverage (amd64 and arm64) before deployment, alerting DevOps teams via Slack when
  single-architecture images risk causing node CrashLoopBackOff failures.

inputs:
  - id: image_reference
    type: STRING
    defaults: "registry.hub.docker.com/library/python:3.11-slim"
    displayName: "Container Image Reference"
    description: "Full container image reference to audit for multi-architecture manifest compliance."

  - id: required_architectures
    type: STRING
    defaults: "amd64,arm64"
    displayName: "Required Architectures"
    description: "Comma-separated list of CPU architectures that must be present in the manifest list."

  - id: required_os
    type: STRING
    defaults: "linux"
    displayName: "Required Target OS"
    description: "Target operating system expected for each required architecture platform entry."

  - id: remediation_mode
    type: SELECT
    values:
      - "ALERT_ONLY"
      - "QUARANTINE_LOG"
    defaults: "ALERT_ONLY"
    displayName: "Remediation Mode"
    description: "Operational response mode when manifest is non-compliant: dispatch Slack alert only or record quarantine log."

  - id: dry_run
    type: SELECT
    values:
      - "true"
      - "false"
    defaults: "true"
    displayName: "Dry Run Mode"
    description: "When set to true, safe remediation actions only simulate actions without mutating pipeline state."

triggers:
  - id: schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 */6 * * *"
    disabled: true
    inputs:
      image_reference: "registry.hub.docker.com/library/python:3.11-slim"
      required_architectures: "amd64,arm64"
      required_os: "linux"
      remediation_mode: "ALERT_ONLY"
      dry_run: "true"

tasks:
  - id: inspect_manifest
    type: io.kestra.plugin.skopeo.cli.SkopeoCLI
    description: "Fetch raw container image manifest or manifest list from container registry without pulling layers."
    commands:
      - skopeo inspect --raw docker://{{ inputs.image_reference }} > manifest.json || echo '{"schemaVersion":0,"error":"INSPECT_FAILED"}' > manifest.json
    outputFiles:
      - manifest.json

  - id: classify_manifest_compliance
    type: io.kestra.plugin.scripts.python.Script
    description: "Parse OCI or Docker manifest JSON to verify all required architectures are present."
    containerImage: python:3.11-slim
    inputFiles:
      manifest.json: "{{ outputs.inspect_manifest.outputFiles['manifest.json'] }}"
    script: |
      import json
      from kestra import Kestra

      with open("manifest.json") as f:
          data = json.load(f)

      required_archs = [a.strip() for a in "{{ inputs.required_architectures }}".split(",") if a.strip()]
      required_os = "{{ inputs.required_os }}".strip()

      if data.get("error") == "INSPECT_FAILED":
          Kestra.outputs({
              "status": "NON_COMPLIANT",
              "error": "Failed to fetch image manifest from registry",
              "found_architectures": [],
              "missing_architectures": required_archs
          })
      else:
          manifests = data.get("manifests", [])
          found_archs = []
          for m in manifests:
              platform = m.get("platform", {})
              os_val = platform.get("os", "")
              arch_val = platform.get("architecture", "")
              if os_val == required_os and arch_val:
                  found_archs.append(arch_val)

          missing_archs = [a for a in required_archs if a not in found_archs]
          is_compliant = len(missing_archs) == 0 and len(manifests) > 0

          Kestra.outputs({
              "status": "COMPLIANT" if is_compliant else "NON_COMPLIANT",
              "media_type": data.get("mediaType", "unknown"),
              "total_manifests": len(manifests),
              "found_architectures": found_archs,
              "missing_architectures": missing_archs
          })

  - id: evaluate_compliance
    type: io.kestra.plugin.core.flow.Switch
    description: "Branch execution based on whether the container image satisfies multi-architecture requirements."
    value: "{{ outputs.classify_manifest_compliance.vars.status ?? 'NON_COMPLIANT' }}"
    cases:
      "COMPLIANT":
        - id: log_compliant_status
          type: io.kestra.plugin.core.log.Log
          description: "Log compliant state when image satisfies all multi-architecture requirements."
          message: "Multi-arch manifest compliance verified: {{ inputs.image_reference }} contains all required architectures: {{ outputs.classify_manifest_compliance.vars.found_architectures }}."
      "NON_COMPLIANT":
        - id: alert_non_compliant_manifest
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: "Dispatch urgent Slack alert when container image lacks required multi-architecture support."
          url: "{{ secret('SLACK_WEBHOOK') }}"
          payload: |
            {"text": "Skopeo Manifest Compliance Alert: Image {{ inputs.image_reference }} is missing required architectures: {{ outputs.classify_manifest_compliance.vars.missing_architectures }}. Found: {{ outputs.classify_manifest_compliance.vars.found_architectures }}. Mode: {{ inputs.remediation_mode }}, DryRun: {{ inputs.dry_run }}."}
        - id: log_remediation_guidance
          type: io.kestra.plugin.core.log.Log
          description: "Record remediation guidance telemetry and next steps when single-arch or non-compliant image is detected."
          message: "Remediation action recorded: mode={{ inputs.remediation_mode }}, dry_run={{ inputs.dry_run }}. Ensure buildx or manifest-tool publishes multi-arch manifest list before Kubernetes rollout."
    defaults:
      - id: log_default_status
        type: io.kestra.plugin.core.log.Log
        description: "Fallback logger for unclassified manifest evaluation states."
        message: "Skopeo manifest audit encountered unexpected verdict for {{ inputs.image_reference }}."

  - id: log_audit_completion
    type: io.kestra.plugin.core.log.Log
    description: "Post-audit summary confirming completion of the Skopeo manifest compliance evaluation cycle."
    message: "Skopeo multi-arch compliance audit completed for {{ inputs.image_reference }}. Verdict: {{ outputs.classify_manifest_compliance.vars.status ?? 'UNKNOWN' }}."

errors:
  - id: alert_on_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: "Dispatch urgent Slack notification if flow execution encounters an unexpected error."
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {"text": "Flow execution failed: skopeo-multiarch-manifest-compliance-gate failed during execution {{ execution.id }}."}

extend:
  title: "Audit Container Image Multi-Arch Manifest Compliance with Skopeo"
  metaTitle: "Skopeo Multi-Arch Manifest Compliance Gate | Kestra"
  shortDescription: "Audit container registries for multi-architecture manifest coverage (amd64 and arm64) using Skopeo and Slack."
  metaDescription: "Audit container registry multi-arch manifest compliance with Skopeo and Kestra. Verify amd64 and arm64 coverage and dispatch automated Slack alerts."
  description: |
    In heterogeneous Kubernetes environments featuring mixed worker node architectures (such as
    x86_64 Intel/AMD and ARM64 AWS Graviton or Apple Silicon nodes), container workloads must
    provide multi-architecture manifest lists. If a release pipeline or third-party vendor publishes
    an image that is single-architecture (for example, only compiled for amd64), scheduling that
    pod onto an arm64 worker node results in immediate CrashLoopBackOff or exec format errors.

    This blueprint provides an automated Day 2 Operations governance gate that uses Skopeo to inspect
    remote container registry manifests without downloading heavy image layers. It parses OCI and
    Docker manifest indexes, verifies the presence of required CPU architectures, and alerts DevOps
    teams over Slack before faulty images cause cluster rollout failures.

    ## How it works

    1. `schedule` (`io.kestra.plugin.core.trigger.Schedule`) initiates the audit cycle every 6 hours (disabled by default for safe onboarding).
    2. `inspect_manifest` (`io.kestra.plugin.skopeo.cli.SkopeoCLI`) queries the container registry directly using `skopeo inspect --raw` without pulling layers, saving the manifest index as `manifest.json`.
    3. `classify_manifest_compliance` (`io.kestra.plugin.scripts.python.Script`) parses the manifest JSON, evaluates platform entries against `required_architectures` (e.g. `amd64,arm64`) and `required_os` (`linux`), and outputs a typed `status` (`COMPLIANT` vs `NON_COMPLIANT`).
    4. `evaluate_compliance` (`io.kestra.plugin.core.flow.Switch`) routes execution based on the compliance verdict.
    5. When compliant (`COMPLIANT`), `log_compliant_status` logs verified architectures.
    6. When non-compliant (`NON_COMPLIANT`), `alert_non_compliant_manifest` dispatches a formatted alert to Slack using `io.kestra.plugin.slack.notifications.SlackIncomingWebhook`, and `log_remediation_guidance` logs actionable build remediation advice.
    7. `log_audit_completion` writes a final operational audit summary.
    8. The flow-level `errors` block intercepts unexpected network or registry authentication failures and alerts Slack.

    ## What you get

    - Zero-download registry inspection querying image manifests in milliseconds.
    - Automated detection of missing CPU architectures (`amd64`, `arm64`, `s390x`, `ppc64le`).
    - Protection against mixed-node Kubernetes scheduling failures and exec format errors.
    - Automated Slack incident notifications with missing platform entries and execution context.
    - Flow-level error alerting safeguarding pipeline reliability.

    ## Who it's for

    - Platform Engineers and DevSecOps Teams maintaining multi-architecture Kubernetes clusters.
    - Release Engineers responsible for container image promotion gates across staging and production.
    - Site Reliability Engineers safeguarding container supply-chain integrity.

    ## Why orchestrate this with Kestra

    Inspecting remote registry manifests with standalone shell scripts or CI job steps requires
    maintaining Skopeo installations, handling edge cases across Docker vs OCI index specifications,
    and managing webhook credentials across multiple repositories. Kestra provides a unified
    orchestration platform with native Skopeo container sandboxing, structured JSON evaluation,
    conditional branching, execution lineage, and centralized Slack alerting.

    ## Prerequisites

    - Docker available to the Kestra Worker for running `SkopeoCLI` (`quay.io/skopeo/stable`).
    - Network access from the Kestra Worker to the target container registry.
    - A Slack Incoming Webhook URL configured in Kestra secrets.

    ### Local Container Setup

    To run a local container registry for development and testing while avoiding host port 8080 conflicts:

    ```bash
    docker run -d --name local-registry -p 5001:5000 registry:2
    ```

    If Kestra is running inside a Docker network, connect the registry container to Kestra network:

    ```bash
    docker network ls
    docker network connect YOUR_KESTRA_NETWORK local-registry
    ```

    ### Secrets

    - `SLACK_WEBHOOK`: Incoming Webhook URL for Slack alerting.
    - `REGISTRY_USER`: Optional username for private container registries.
    - `REGISTRY_PASSWORD`: Optional password or token for private container registries.

    > Note for Kestra Open-Source (OSS): Secrets are provided as base64-encoded environment variables formatted as `SECRET_<NAME>` on the Kestra server or worker environment.

    ### Inputs

    | Name | Type | Default | Allowed Values | Description |
    | :--- | :--- | :--- | :--- | :--- |
    | `image_reference` | STRING | `"registry.hub.docker.com/library/python:3.11-slim"` | Any valid image reference | Target image to inspect in registry |
    | `required_architectures` | STRING | `"amd64,arm64"` | Comma-separated archs | Architectures required in manifest list |
    | `required_os` | STRING | `"linux"` | Operating system name | Expected OS for platform entries |
    | `remediation_mode` | SELECT | `"ALERT_ONLY"` | `"ALERT_ONLY"`, `"QUARANTINE_LOG"` | Operational remediation action mode |
    | `dry_run` | SELECT | `"true"` | `"true"`, `"false"` | Dry run simulation flag |

    ### Outputs

    - `{{ outputs.inspect_manifest.outputFiles['manifest.json'] }}`: Raw manifest index JSON file URI.
    - `{{ outputs.classify_manifest_compliance.vars.status }}`: Compliance status (`COMPLIANT` or `NON_COMPLIANT`).
    - `{{ outputs.classify_manifest_compliance.vars.found_architectures }}`: Array of detected architectures matching required OS.
    - `{{ outputs.classify_manifest_compliance.vars.missing_architectures }}`: Array of missing required architectures.

    ## Quick start

    1. Configure `SLACK_WEBHOOK` in your Kestra namespace secrets.
    2. Import this blueprint into your Kestra instance.
    3. Run a manual execution with default inputs to inspect the official `python:3.11-slim` multi-arch image.
    4. Verify execution logs and confirm that both `amd64` and `arm64` platforms are verified.
    5. Enable the `schedule` trigger to audit your critical container images periodically.

    ## How to extend

    - Pass authentication flags (`--src-creds {{ secret('REGISTRY_USER') }}:{{ secret('REGISTRY_PASSWORD') }}`) to `skopeo inspect` for private registries.
    - Chain a downstream Kubernetes rollout or Helm deploy subflow via `io.kestra.plugin.core.flow.Subflow` that only executes when the gate passes.
    - Loop through an inventory of production container images using `io.kestra.plugin.core.flow.Loop`.

    ## Pitfalls

    - **Single-Arch vs Multi-Arch Manifests**: Standard single-architecture images return a single manifest rather than a manifest list, which this flow flags as non-compliant if multi-arch support is required.
    - **Private Registry Authentication**: Private registries require credentials passed as `--creds` or `--src-creds` in the `commands` array.
    - **Port Conflicts**: Ensure local test registry port 5001 does not collide with local services.

    ## Links

    - [Kestra Skopeo Plugin Documentation](https://kestra.io/plugins/plugin-skopeo)
    - [Skopeo Inspect Documentation](https://github.com/containers/skopeo/blob/main/docs/skopeo-inspect.1.md)
    - [OCI Image Index Specification](https://github.com/opencontainers/image-spec/blob/main/image-index.md)
    - [Kestra Slack Notification Plugin](https://kestra.io/plugins/plugin-slack/notifications/io.kestra.plugin.slack.notifications.slackincomingwebhook)
  tags:
    - Infrastructure
    - Data
  subTags:
    - CI/CD & Deployment
    - Infrastructure Automation
  ee: false
  demo: false
