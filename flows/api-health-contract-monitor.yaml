id: api-health-contract-monitor
namespace: company.team

description: |
  Operational API health and contract monitor: executes scheduled probes, validates HTTP status and latency,
  enforces JSON response schema contracts, and alerts on degradation.

triggers:
  - id: inbound_probe_webhook
    type: io.kestra.plugin.core.trigger.Webhook
    key: "{{ secret('API_PROBE_WEBHOOK_KEY') }}"

  - id: scheduled_five_minute_probe
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/5 * * * *"
    disabled: true

inputs:
  - id: endpoint_url
    type: STRING
    defaults: "https://api.internal.acme/v1/health"
    description: Target REST API endpoint to probe.

  - id: expected_status_code
    type: INT
    defaults: 200
    description: Expected HTTP response status code.

  - id: max_acceptable_latency_ms
    type: INT
    defaults: 800
    description: Maximum acceptable response latency in milliseconds.

  - id: retry_attempts
    type: INT
    defaults: 3
    description: Number of retry attempts on transient network timeouts before failing.

  - id: environment_tier
    type: SELECT
    values: [Production, Staging]
    defaults: Production
    description: Target deployment tier under observation.

tasks:
  - id: init_probe_session
    type: io.kestra.plugin.core.log.Log
    message: |
      Initializing API Health and Contract Monitor:
      Execution ID: {{ execution.id }}
      Endpoint: {{ inputs.endpoint_url }} ({{ inputs.environment_tier }})
      Expected Status: {{ inputs.expected_status_code }}
      Max Latency Threshold: {{ inputs.max_acceptable_latency_ms }} ms

  - id: execute_api_health_probe
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests kestra
    env:
      ENDPOINT: "{{ inputs.endpoint_url }}"
      EXPECTED_STATUS: "{{ inputs.expected_status_code }}"
      MAX_LATENCY: "{{ inputs.max_acceptable_latency_ms }}"
    script: |
      import os
      import sys
      import time
      import json
      import requests
      from kestra import Kestra

      endpoint = os.environ.get("ENDPOINT", "https://api.internal.acme/v1/health")
      expected_status = int(os.environ.get("EXPECTED_STATUS", "200"))
      max_latency = int(os.environ.get("MAX_LATENCY", "800"))

      print(f"Probing API endpoint '{endpoint}' (Max Latency: {max_latency}ms)...")

      start_time = time.time()
      try:
          resp = requests.get(endpoint, timeout=10)
          latency_ms = int((time.time() - start_time) * 1000)
          response_status = resp.status_code
          body = resp.json() if resp.headers.get("content-type", "").startswith("application/json") else {}
      except Exception as exc:
          print(f"CRITICAL: Failed to connect to API endpoint at {endpoint}: {exc}", file=sys.stderr)
          sys.exit(1)

      required_keys = ["status"]
      missing_keys = [k for k in required_keys if k not in body]
      schema_valid = len(missing_keys) == 0

      status_ok = (response_status == expected_status)
      latency_ok = (latency_ms <= max_latency)
      is_healthy = status_ok and latency_ok and schema_valid

      probe_report = {
          "endpoint": endpoint,
          "http_status": response_status,
          "latency_ms": latency_ms,
          "status_ok": status_ok,
          "latency_ok": latency_ok,
          "schema_contract_valid": schema_valid,
          "missing_contract_keys": missing_keys,
          "is_healthy": is_healthy
      }

      with open("probe_report.json", "w") as f:
          json.dump(probe_report, f, indent=2)

      print(f"Probe Result: Status={response_status}, Latency={latency_ms}ms, Healthy={is_healthy}")

      Kestra.outputs({
          "http_status": response_status,
          "latency_ms": latency_ms,
          "schema_valid": schema_valid,
          "is_healthy": is_healthy
      })
    outputFiles:
      - probe_report.json

  - id: evaluate_health_and_contract
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.execute_api_health_probe.vars.is_healthy }}"
    then:
      - id: log_healthy_endpoint
        type: io.kestra.plugin.core.log.Log
        message: |
          API Endpoint {{ inputs.endpoint_url }} is HEALTHY:
          - Response Code: {{ outputs.execute_api_health_probe.vars.http_status }}
          - Latency: {{ outputs.execute_api_health_probe.vars.latency_ms }} ms
          - JSON Schema Contract: Validated

    else:
      - id: notify_slack_endpoint_degraded
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#api-alerts",
            "username": "API-Health-Monitor",
            "text": "CRITICAL: API Health Probe Alert! Endpoint `{{ inputs.endpoint_url }}` is DEGRADED. Status: `{{ outputs.execute_api_health_probe.vars.http_status }}`, Latency: `{{ outputs.execute_api_health_probe.vars.latency_ms }}ms`."
          }

errors:
  - id: alert_on_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "#api-alerts",
        "username": "API-Health-Monitor",
        "text": "CRITICAL: API Health Monitor execution failed on `{{ inputs.endpoint_url }}`. Execution ID: `{{ execution.id }}`."
      }

extend:
  title: API Health and Contract Monitor
  metaTitle: API Health and Contract Monitor Blueprint
  shortDescription: Probes REST APIs, verifies status code and latency SLAs, and validates JSON contracts.
  metaDescription: Probes REST API endpoints, validates HTTP status code and latency SLAs, enforces response contracts, and alerts on degradation.
  description: |
    ## How it works
    This workflow executes automated health and contract probes against REST APIs. It issues live HTTP requests, measures real-time response latency, confirms expected HTTP response status codes, validates JSON response payloads, and notifies on Slack if latency thresholds or contract expectations are breached.

    ## Architecture diagram
    ```mermaid
    flowchart TD
      A[scheduled_five_minute_probe Schedule Trigger] --> B[init_probe_session Log]
      B --> C[execute_api_health_probe Python Script]
      C --> D{Is API Healthy?}
      D -- Yes --> E[log_healthy_endpoint Log]
      D -- No --> F[notify_slack_endpoint_degraded Webhook]
    ```

    ## Prerequisites
    - Target REST API endpoint reachable over HTTP/HTTPS.
    - Secret `SLACK_WEBHOOK_URL` configured in Kestra.

    ## Quick start
    1. Import the blueprint under the `company.team` namespace.
    2. Configure `endpoint_url`, `expected_status_code`, and `max_acceptable_latency_ms`.
    3. Run manually to verify endpoint health.

    ## Links
    - [Kestra Python Script Documentation](https://kestra.io/plugins/plugin-scripts-python)
  tags:
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - Quality Assurance
    - Network
  ee: false
  demo: false
