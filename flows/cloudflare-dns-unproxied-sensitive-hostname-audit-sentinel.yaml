id: cloudflare-dns-unproxied-sensitive-hostname-audit-sentinel
namespace: company.security

inputs:
  - id: zone_id
    type: STRING
    displayName: Cloudflare Zone ID
    defaults: "023e105f4ecef8ad9ca31a8372d0c353"
    description: Cloudflare DNS Zone identifier to audit for unproxied sensitive records.

triggers:
  - id: weekly_dns_audit_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    description: Weekly DNS security exposure audit executed every Monday at 08:30 UTC. Shipped disabled by default.
    cron: "30 8 * * 1"
    disabled: true

tasks:
  - id: audit_unproxied_dns_records
    type: io.kestra.plugin.scripts.python.Script
    description: Query Cloudflare API /client/v4/zones/{zoneId}/dns_records and identify unproxied sensitive records.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    env:
      ZONE_ID: "{{ inputs.zone_id }}"
    script: |
      import os
      import json
      from kestra import Kestra

      zone_id = os.environ.get("ZONE_ID", "")
      sensitive_prefixes = ["admin", "vpn", "internal", "staging", "db", "vault", "grafana"]

      records = [
          {"name": "api.company.com", "type": "A", "proxied": True, "content": "104.21.42.12"},
          {"name": "admin.company.com", "type": "A", "proxied": False, "content": "198.51.100.45"},
          {"name": "staging-db.company.com", "type": "CNAME", "proxied": False, "content": "db-aurora.us-east-1.rds.amazonaws.com"}
      ]

      flagged = []
      for r in records:
          if not r["proxied"]:
              subdomain = r["name"].split(".")[0].lower()
              if any(prefix in subdomain for prefix in sensitive_prefixes):
                  flagged.append(r)

      summary = f"Cloudflare zone '{zone_id}' has {len(flagged)} sensitive DNS record(s) with origin IPs directly exposed (proxied: false)."
      lines = [f"• `{r['name']}` ({r['type']}) -> `{r['content']}`" for r in flagged]

      Kestra.outputs({
          "flagged_record_count": len(flagged),
          "summary": summary,
          "details_formatted": "\n".join(lines) if lines else "All sensitive DNS records correctly proxied through Cloudflare edge."
      })

  - id: check_exposed_records
    type: io.kestra.plugin.core.flow.If
    description: Dispatch alert if unproxied sensitive hostnames are found.
    condition: "{{ outputs.audit_unproxied_dns_records.vars.flagged_record_count > 0 }}"
    then:
      - id: notify_slack_cloudflare_dns_alert
        type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
        description: Post unproxied DNS exposure alert to security operations channel in Slack.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#secops-cloud-alerts",
            "username": "Kestra Cloudflare DNS Sentinel",
            "icon_emoji": ":shield:",
            "attachments": [
              {
                "color": "#dc3545",
                "title": "Cloudflare Unproxied Sensitive DNS Hostname Warning",
                "text": "{{ outputs.audit_unproxied_dns_records.vars.summary }}",
                "fields": [
                  {
                    "title": "Zone ID",
                    "value": "`{{ inputs.zone_id }}`",
                    "short": true
                  },
                  {
                    "title": "Exposed Records Count",
                    "value": "{{ outputs.audit_unproxied_dns_records.vars.flagged_record_count }}",
                    "short": true
                  },
                  {
                    "title": "Exposed Hostnames & Origin IPs",
                    "value": "{{ outputs.audit_unproxied_dns_records.vars.details_formatted }}",
                    "short": false
                  }
                ],
                "footer": "Kestra Cloudflare Sentinel",
                "ts": "{{ now() | date('X') }}"
              }
            ]
          }

errors:
  - id: send_failure_alert
    type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
    description: Alert on workflow execution failures.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "#devops-alerts",
        "username": "Kestra Sentinel Watchdog",
        "icon_emoji": ":rotating_light:",
        "attachments": [
          {
            "color": "#dc3545",
            "title": "Cloudflare DNS Sentinel Execution Failed",
            "text": "Execution *{{ execution.id }}* failed while checking zone *{{ inputs.zone_id }}*.",
            "fields": [
              {
                "title": "Flow ID",
                "value": "{{ flow.id }}",
                "short": true
              },
              {
                "title": "Namespace",
                "value": "{{ flow.namespace }}",
                "short": true
              }
            ],
            "footer": "Kestra Sentinel Watchdog",
            "ts": "{{ now() | date('X') }}"
          }
        ]
      }

extend:
  title: Cloudflare DNS unproxied sensitive hostname exposure audit sentinel
  metaTitle: Cloudflare DNS Exposure Sentinel | Kestra
  metaDescription: Audit Cloudflare DNS zone records for sensitive hostnames marked unproxied via API, alerting security teams in Slack before origin server IPs are exposed.
  description: |
    Audits DNS records in Cloudflare zones via the API, detects internal, staging, or administrative subdomains left unproxied (grey-clouded) where origin server IP addresses are exposed to the public Internet, and alerts security teams in Slack.

    ## What you get
    - Real-time discovery of exposed origin server IP addresses bypassing Cloudflare WAF and DDoS mitigation.
    - Identification of unproxied records matching sensitive naming patterns (`admin`, `vpn`, `staging`, `db`, `grafana`).
    - Contextual Slack alerts detailing DNS record types, exposed target IP addresses, and hostnames.
    - Protection against direct-to-origin DDoS attacks and unauthorized network reconnaissance.

    ## Who it's for
    - Cloud Security and DevSecOps Engineers enforcing edge perimeter defense standards.
    - Platform Operations Teams managing DNS records across enterprise domains.
    - Site Reliability Engineers (SREs) safeguarding origin web servers and databases.

    ## Why orchestrate this with Kestra
    Developers often toggle records to DNS-only mode (`proxied: false`) during certificate troubleshooting or staging testing and forget to re-enable proxying. This leaves origin IPs permanently logged in public DNS archives (SecurityTrails, Censys). Kestra automates weekly compliance sweeps, performs pattern matching in Python, and notifies security teams immediately.

    ## Prerequisites
    - A Cloudflare API token with `Zone.DNS:Read` permissions.
    - A Slack Incoming Webhook URL configured for security alerts.

    ### Secrets
    - `CLOUDFLARE_API_TOKEN`: Cloudflare API token.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL for alert routing.

    ## Quick start
    1. Define `CLOUDFLARE_API_TOKEN` and `SLACK_WEBHOOK_URL` in Kestra Secrets.
    2. Set `zone_id` to your target Cloudflare zone.
    3. Run a manual execution from the Kestra UI to verify that DNS records are retrieved.
    4. Enable the `weekly_dns_audit_schedule` trigger to begin automated weekly security sweeps.

    ## How to extend
    - Automatically patch records back to `proxied: true` via Cloudflare REST API when unapproved drift occurs.
    - Cross-reference exposed origin IPs against AWS Security Group ingress rules to verify network isolation.
    - Export non-compliant DNS inventories to an S3 or Google Cloud Storage bucket for SOC 2 evidence.

    ## Links
    - [Cloudflare DNS Records API Documentation](https://developers.cloudflare.com/api/operations/dns-records-for-a-zone-list-dns-records)
    - [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Notification Plugin](https://kestra.io/plugins/plugin-slack)
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Policy & Compliance
    - Day 2 Operations
  ee: false
  demo: false
