id: redshift-idle-finder
namespace: company.finops

description: |
  Finds Redshift clusters burning hourly money for nothing: paused clusters
  still holding paid storage, and available clusters with zero database
  connections over 7 days. Reports node type and hourly waste per cluster.

inputs:
  - id: aws_regions
    type: ARRAY
    itemType: STRING
    defaults: ["us-east-1"]
    description: AWS regions to audit for idle Redshift clusters.
  - id: conn_threshold
    type: INT
    defaults: 1
    description: Available clusters averaging fewer connections than this (7d) count as idle.
  - id: node_hourly_usd
    type: STRING
    defaults: "0.25"
    description: Estimated hourly cost per node in USD (dc2.large ~$0.25; tune for ra3 node types).

tasks:
  - id: check_clusters
    type: io.kestra.plugin.core.flow.ForEach
    description: Audit Redshift clusters region by region.
    values: "{{ inputs.aws_regions }}"
    tasks:
      - id: audit_region
        type: io.kestra.plugin.aws.cli.AwsCLI
        description: List clusters, check paused status and 7-day connection counts per cluster.
        commands:
          - |
            REGION="{{ taskrun.value }}"
            CONN_T={{ inputs.conn_threshold }}
            PRICE="{{ inputs.node_hourly_usd }}"
            END=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            START=$(date -u -d "7 days ago" +%Y-%m-%dT%H:%M:%SZ)
            echo "Checking Redshift clusters in $REGION"
            PAUSED_LIST=""
            IDLE_LIST=""
            TOTAL=0
            for CID in $(aws redshift describe-clusters --region "$REGION" \
              --query 'Clusters[].[ClusterIdentifier]' --output text); do
              INFO=$(aws redshift describe-clusters --region "$REGION" --cluster-identifier "$CID" \
                --query 'Clusters[0].[ClusterStatus,NodeType,NumberOfNodes]' --output text)
              STATUS=$(echo "$INFO" | awk '{print $1}')
              NTYPE=$(echo "$INFO" | awk '{print $2}')
              NODES=$(echo "$INFO" | awk '{print $3}')
              if [ "$STATUS" = "paused" ]; then
                PAUSED_LIST="${PAUSED_LIST}${CID} (${NTYPE} x${NODES}, paused - storage still billed), "
                continue
              fi
              CONN=$(aws cloudwatch get-metric-statistics --region "$REGION" \
                --namespace AWS/Redshift --metric-name DatabaseConnections \
                --dimensions Name=ClusterIdentifier,Value="$CID" \
                --start-time "$START" --end-time "$END" --period 604800 --statistics Average \
                --query 'Datapoints[0].Average' --output text 2>/dev/null)
              case "$CONN" in ''|'None') CONN=0;; esac
              IDLE=$(python3 -c "print('y' if float('$CONN') < $CONN_T else 'n')")
              if [ "$IDLE" = "y" ]; then
                COST=$(python3 -c "print('{:.2f}'.format(float('$PRICE') * int('$NODES') * 730))")
                IDLE_LIST="${IDLE_LIST}${CID} (${NTYPE} x${NODES}, ${CONN} conns ~\$${COST}/mo), "
                TOTAL=$(python3 -c "print('{:.2f}'.format(float('$TOTAL') + float('$COST')))")
              fi
            done
            if [ -n "$PAUSED_LIST$IDLE_LIST" ]; then HAS_FINDINGS=true; else HAS_FINDINGS=false; fi
            echo "HAS_FINDINGS=$HAS_FINDINGS"
            echo "PAUSED_CLUSTERS=$PAUSED_LIST"
            echo "IDLE_CLUSTERS=$IDLE_LIST"
            echo "EST_MONTHLY_WASTE=$TOTAL"
            echo "REGION_DONE=$REGION"
        env:
          AWS_ACCESS_KEY_ID: "{{ secret('AWS_ACCESS_KEY_ID') }}"
          AWS_SECRET_ACCESS_KEY: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
          AWS_DEFAULT_REGION: "{{ taskrun.value }}"
      - id: notify_region
        type: io.kestra.plugin.core.flow.If
        description: Report paused and idle clusters, stay quiet when warehouses are queried.
        condition: "{{ outputs.audit_region.vars.HAS_FINDINGS == 'true' }}"
        then:
          - id: slack_findings
            type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
            url: "{{ secret('SLACK_WEBHOOK_URL') }}"
            payload: |
              {
                "text": ":bar_chart: Redshift audit `{{ outputs.audit_region.vars.REGION_DONE }}`\n:pause_button: Paused (storage still billed): `{{ outputs.audit_region.vars.PAUSED_CLUSTERS }}`\n:zzz: Available but zero queries (7d), ~${{ outputs.audit_region.vars.EST_MONTHLY_WASTE }}/mo waste: `{{ outputs.audit_region.vars.IDLE_CLUSTERS }}`\nSnapshot and delete what the analytics team confirms is dead."
              }
        else:
          - id: log_clean
            type: io.kestra.plugin.core.log.Log
            message: "All Redshift clusters in {{ outputs.audit_region.vars.REGION_DONE }} are actively queried."

triggers:
  - id: weekly
    type: io.kestra.plugin.core.trigger.Schedule
    description: Weekly on Sunday at 02:00 UTC. Shipped disabled; enable after your first manual run.
    cron: "0 2 * * 0"
    disabled: true

extend:
  title: Redshift Idle Finder
  metaTitle: Find Idle Redshift Clusters | Kestra
  shortDescription: Audit Redshift clusters across regions for paused clusters and zero-connection warehouses over 7 days, with hourly waste per cluster.
  metaDescription: Idle Redshift clusters burn hourly node money. This flow finds paused and unused clusters via CloudWatch weekly.
  description: |
    Redshift bills per node per hour while a cluster is available — and paused clusters still bill for managed storage. Analytics warehouses get spun up for a quarter's reporting and then sit untouched. This blueprint separates the paused (storage-only cost) from the available-but-unqueried (full hourly burn) so each gets the right action.

    ## How it works

    1. A Schedule trigger fires weekly on Sunday at 02:00 UTC (shipped disabled).
    2. A ForEach loop audits each region in `aws_regions`.
    3. Per region, the flow lists clusters with status, node type, and node count.
    4. Paused clusters are reported as storage-cost items; available clusters get 7-day average `DatabaseConnections` from CloudWatch, and near-zero counts as idle.
    5. An `If` task posts a Slack report with both lists and the estimated monthly waste.

    ## What you get

    - Paused clusters called out (snapshot + delete the storage, or resume and use them).
    - Idle-but-available clusters with connection evidence and dollar waste.
    - Multi-region coverage, silence on queried weeks.

    ## Who it's for

    Data platform teams where warehouse sprawl outpaced governance.

    ## Why orchestrate this with Kestra

    Warehouse usage follows business cycles; a manual check during a quiet week misleads. As a scheduled flow the 7-day window smooths the signal, and the recurring report keeps decommission decisions moving.

    ## Prerequisites

    - AWS credentials with `redshift:DescribeClusters` and `cloudwatch:GetMetricStatistics`.
    - A Slack incoming webhook URL.

    ### Secrets

    - `AWS_ACCESS_KEY_ID`: AWS access key for the Redshift and CloudWatch API calls.
    - `AWS_SECRET_ACCESS_KEY`: AWS secret key for the Redshift and CloudWatch API calls.
    - `SLACK_WEBHOOK_URL`: Incoming webhook URL for the cluster report.

    ## Quick start

    1. Add the three secrets above to your Kestra namespace.
    2. Set `aws_regions` and tune `node_hourly_usd` to your node family.
    3. Run manually once and confirm idle clusters with the analytics owners.
    4. Enable the weekly schedule trigger.

    ## How to extend

    - Also check `QueryDuration` to catch clusters with connections but no real queries.
    - Auto-snapshot paused clusters older than N days, then delete them.
    - Add Serverless workgroup usage (RPUs) for the serverless side of the fleet.

    ## Links

    - [Kestra AWS plugins](https://kestra.io/plugins)
    - [Kestra Slack plugins](https://kestra.io/plugins)
    - [Redshift pricing](https://aws.amazon.com/redshift/pricing/)
    - [Redshift CloudWatch metrics](https://docs.aws.amazon.com/redshift/latest/mgmt/metrics-list.html)
  tags:
    - Infrastructure
  subTags:
    - FinOps & Cost Management
    - Monitoring & Alerting
  ee: false
  demo: false
