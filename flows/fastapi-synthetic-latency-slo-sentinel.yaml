id: fastapi-synthetic-latency-slo-sentinel
namespace: company.sre

inputs:
  - id: api_endpoint_url
    type: STRING
    defaults: "https://api.github.com/zen"
    description: Target FastAPI or REST endpoint URL to evaluate for synthetic latency.

  - id: p95_latency_threshold_ms
    type: INT
    defaults: 250
    description: Maximum acceptable p95 response latency in milliseconds before triggering an SLO breach.

  - id: sample_iterations
    type: INT
    defaults: 5
    description: Number of consecutive synthetic probe requests to collect statistical latency metrics.

tasks:
  - id: run_synthetic_probes
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install kestra requests
    script: |
      import time
      import requests
      from kestra import Kestra

      endpoint = "{{ inputs.api_endpoint_url }}"
      iterations = {{ inputs.sample_iterations }}
      latencies = []

      print(f"Executing {iterations} synthetic probes against {endpoint}...")
      for i in range(iterations):
          start_time = time.time()
          try:
              resp = requests.get(endpoint, timeout=5)
              duration_ms = (time.time() - start_time) * 1000
              latencies.append(duration_ms)
              print(f"Probe {i+1}: status={resp.status_code}, latency={duration_ms:.1f}ms")
          except Exception as e:
              latencies.append(5000.0)
              print(f"Probe {i+1} failed: {e}")

      latencies.sort()
      # Calculate p95 approximation
      idx = int(0.95 * len(latencies))
      p95_latency = latencies[min(idx, len(latencies) - 1)]
      avg_latency = sum(latencies) / len(latencies)
      threshold = {{ inputs.p95_latency_threshold_ms }}
      slo_breached = p95_latency > threshold

      print(f"Results: p95={p95_latency:.1f}ms (threshold={threshold}ms) | Breach={slo_breached}")
      Kestra.outputs({
          "p95_latency_ms": round(p95_latency, 1),
          "avg_latency_ms": round(avg_latency, 1),
          "slo_breached": slo_breached,
          "total_probes": iterations
      })

  - id: evaluate_slo_compliance
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.run_synthetic_probes.vars.slo_breached ?? false }}"
    then:
      - id: notify_slo_breach
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Alerts on-call SREs to degraded API latency violating service level objectives.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "🚨 *FastAPI Latency SLO Breach Detected:* Endpoint `{{ inputs.api_endpoint_url }}` p95 latency reached *{{ outputs.run_synthetic_probes.vars.p95_latency_ms }}ms* (Threshold: {{ inputs.p95_latency_threshold_ms }}ms). Execution `{{ execution.id }}`."
          }
    else:
      - id: notify_slo_healthy
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Emits routine healthy status confirmation to operational monitoring logs.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "✅ *FastAPI Latency SLO Healthy:* Endpoint `{{ inputs.api_endpoint_url }}` running nominal at *{{ outputs.run_synthetic_probes.vars.p95_latency_ms }}ms* p95 latency."
          }

  - id: log_slo_metrics_archive
    type: io.kestra.plugin.scripts.shell.Commands
    containerImage: alpine:latest
    commands:
      - echo "Archived SLO synthetic metric snapshot for {{ inputs.api_endpoint_url }} at $(date)"

errors:
  - id: alert_on_probe_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Catches probe network exceptions or runner errors and alerts SREs immediately.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "💥 *Synthetic Latency Sentinel Abort:* Failed executing probe benchmark for `{{ inputs.api_endpoint_url }}` in execution `{{ execution.id }}`. Check Kestra logs."
      }

triggers:
  - id: recurring_slo_check
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"

extend:
  title: "Monitor FastAPI Synthetic Latency SLOs and Alert SRE Teams via Slack"
  shortDescription: "Execute recurring synthetic HTTP latency benchmarks against FastAPI services, evaluate p95 SLO breaches, and alert SREs via Slack."
  metaTitle: "FastAPI Synthetic Latency SLO Sentinel in Kestra"
  metaDescription: "Orchestrate automated synthetic latency probes for FastAPI services with p95 percentile evaluation and Slack incident alerting in Kestra."
  description: |
    # Monitor FastAPI Synthetic Latency SLOs and Alert SRE Teams via Slack

    Production microservices built with modern asynchronous Python frameworks (such as FastAPI) require strict Service Level Objective (SLO) guarantees for user-facing API routes. Slow queries, connection pool saturation, or garbage collection pauses can cause sudden tail-latency spikes that bypass simple uptime monitors.

    This blueprint automates continuous synthetic probing against critical FastAPI endpoints. It measures multi-sample latency profiles, calculates p95 percentile response times, evaluates results against defined SLA/SLO thresholds, and dispatches rich triage alerts to your designated Slack operational incident channel.

    ## How it works

    1. `run_synthetic_probes` (`io.kestra.plugin.scripts.python.Script`): Launches an isolated Python container to execute calibrated synthetic HTTP probe requests, measuring per-request duration and calculating the p95 percentile latency metric before emitting structured parameters via `Kestra.outputs`.
    2. `evaluate_slo_compliance` (`io.kestra.plugin.core.flow.If`): Tests whether calculated p95 latency breaches the configured latency budget threshold. Routes to `notify_slo_breach` on violation, or `notify_slo_healthy` for routine operational confirmation.
    3. `log_slo_metrics_archive` (`io.kestra.plugin.scripts.shell.Commands`): Logs and archives metric audit metadata for compliance tracking.
    4. `alert_on_probe_failure` (`errors` block): Triggers immediately if target endpoints drop packets, time out, or encounter runner failures, notifying on-call engineers with the execution ID.

    ## What you get

    - Automated, scheduled synthetic probing every 15 minutes (`*/15 * * * *`).
    - Statistical p95 and average response duration calculation without requiring third-party SaaS agents.
    - Differentiated Slack messaging distinguishing between critical SLO breaches and nominal health checks.
    - Robust error isolation with execution-linked incident notifications.

    ## Who it's for

    - Site Reliability Engineers (SREs) and DevOps teams managing FastAPI and REST service availability.
    - Backend Platform Engineers needing automated canary latency verification after deployments.
    - Cloud Architects monitoring distributed API gateway performance.

    ## Why orchestrate this with Kestra

    Monitoring latency SLAs across multiple distributed endpoints requires resilient scheduling, isolated container runtimes, and customizable alerting workflows. Kestra coordinates synthetic checks declaratively without provisioning extra daemon infrastructure, providing native secrets handling and built-in execution histories for trend analysis.

    ## Prerequisites

    - Reachable FastAPI or REST service endpoint (public or within your VPC).
    - Slack Incoming Webhook URL configured for incident dispatch.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook endpoint for alerting.

    ## Quick start

    1. Configure the `SLACK_WEBHOOK_URL` secret in your Kestra namespace.
    2. Import this blueprint into your Kestra instance.
    3. Adjust `api_endpoint_url` and `p95_latency_threshold_ms` inputs according to your service specifications.
    4. Click **Execute** to run an on-demand synthetic probe test.
    5. Keep the `recurring_slo_check` cron trigger enabled for automated continuous health surveillance.

    ## How to extend

    - Add authentication headers (e.g. Bearer tokens or API keys) via secrets for protected internal endpoints.
    - Store historic p95 metrics directly into InfluxDB, Prometheus, or Google BigQuery using Kestra database plugins.
    - Integrate PagerDuty (`io.kestra.plugin.notifications.pagerduty.PagerDutyAlert`) for Sev-1 escalations when p95 breaches persist.

    ## Links

    - [Kestra Python Script Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
    - [FastAPI Framework Documentation](https://fastapi.tiangolo.com/)
    - This blueprint has been created by [GauravPatil2515](https://github.com/GauravPatil2515)
  tags:
    - Infrastructure
    - Cloud
    - Business
  subTags:
    - Monitoring & Alerting
    - Testing & Quality
  ee: false
  demo: false
