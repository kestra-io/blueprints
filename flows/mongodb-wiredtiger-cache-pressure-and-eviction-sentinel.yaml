id: mongodb-wiredtiger-cache-pressure-and-eviction-sentinel
namespace: company.database

description: |
  Audits MongoDB WiredTiger storage engine cache pressure and dirty byte saturation
  via serverStatus metrics, flags unconstrained memory eviction risks, logs an automated
  GitHub DBA investigation ticket, and alerts the database team on Slack.

inputs:
  - id: connection_uri
    type: STRING
    displayName: MongoDB Connection URI
    defaults: "mongodb://mongo-cluster.internal.company.com:27017"

  - id: dirty_cache_percent_threshold
    type: FLOAT
    displayName: Maximum Dirty Cache Threshold (%)
    defaults: 20.0

  - id: target_repository
    type: STRING
    displayName: DBA Operations Issue Tracker
    defaults: my-org/database-operations

triggers:
  - id: periodic_wiredtiger_health_check
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/10 * * * *"
    disabled: true

tasks:
  - id: probe_wiredtiger_cache_status
    type: io.kestra.plugin.scripts.python.Script
    description: Interrogates MongoDB serverStatus WiredTiger cache metrics for dirty bytes and memory pressure
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install pymongo kestra
    script: |
      import os
      from pymongo import MongoClient
      from kestra import Kestra

      uri = "{{ inputs.connection_uri }}"
      threshold_pct = float("{{ inputs.dirty_cache_percent_threshold }}")

      try:
          client = MongoClient(uri, serverSelectionTimeoutMS=10000)
          status = client.admin.command("serverStatus")
          client.close()
      except Exception as err:
          print(f"Failed to connect to MongoDB: {err}")
          status = {}

      wt_cache = status.get("wiredTiger", {}).get("cache", {})
      max_bytes = wt_cache.get("maximum bytes configured", 0)
      bytes_in_cache = wt_cache.get("bytes currently in the cache", 0)
      dirty_bytes = wt_cache.get("tracked dirty bytes in the cache", 0)

      # Calculate dirty cache percentage
      dirty_pct = round((dirty_bytes / max_bytes * 100.0), 2) if max_bytes > 0 else 0.0
      usage_pct = round((bytes_in_cache / max_bytes * 100.0), 2) if max_bytes > 0 else 0.0

      is_pressure_critical = dirty_pct >= threshold_pct
      print(f"WiredTiger Cache: {bytes_in_cache}/{max_bytes} ({usage_pct}%), Dirty: {dirty_bytes} ({dirty_pct}%)")

      Kestra.outputs({
          "max_bytes": max_bytes,
          "bytes_in_cache": bytes_in_cache,
          "dirty_bytes": dirty_bytes,
          "usage_pct": usage_pct,
          "dirty_pct": dirty_pct,
          "threshold_pct": threshold_pct,
          "is_pressure_critical": is_pressure_critical
      })

  - id: branch_on_cache_pressure
    type: io.kestra.plugin.core.flow.If
    description: Branches based on whether WiredTiger dirty cache exceeds the safe eviction threshold
    condition: "{{ outputs.probe_wiredtiger_cache_status.vars.is_pressure_critical == true }}"
    then:
      - id: create_dba_incident_issue
        type: io.kestra.plugin.github.issues.Create
        description: Logs a prioritized GitHub issue tracking MongoDB WiredTiger cache saturation
        oauthToken: "{{ secret('GITHUB_TOKEN') }}"
        repository: "{{ inputs.target_repository }}"
        title: "[DBA Alert] MongoDB WiredTiger Dirty Cache Pressure Exceeded: {{ outputs.probe_wiredtiger_cache_status.vars.dirty_pct }}%"
        body: |
          ## 🚨 MongoDB WiredTiger Storage Engine Cache Saturation

          The database reliability sentinel detected excessive dirty byte accumulation in WiredTiger cache:
          - **Connection Host:** `{{ inputs.connection_uri }}`
          - **Dirty Cache Percentage:** **{{ outputs.probe_wiredtiger_cache_status.vars.dirty_pct }}%**
          - **Configured Threshold:** `{{ inputs.dirty_cache_percent_threshold }}%`
          - **Total Cache Utilization:** `{{ outputs.probe_wiredtiger_cache_status.vars.usage_pct }}%`

          When dirty cache exceeds 20%, WiredTiger forces foreground application threads to perform page reconciliation, causing severe query latency degradation.
          *Generated automatically by Kestra MongoDB Sentinel.*

      - id: alert_dba_slack
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches high-priority alert to DBA Slack channel
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {{ {
            "text": "🚨 *MongoDB WiredTiger Cache Pressure Detected*\n*Dirty Cache:* *" ~ outputs.probe_wiredtiger_cache_status.vars.dirty_pct ~ "%* (Threshold: `" ~ inputs.dirty_cache_percent_threshold ~ "%`)\n*Total Cache Usage:* *" ~ outputs.probe_wiredtiger_cache_status.vars.usage_pct ~ "%*\n*DBA Incident:* <" ~ (outputs.create_dba_incident_issue.issueUrl ?? "#") ~ "|View GitHub Issue>"
          } | toJson }}

    else:
      - id: log_cache_healthy
        type: io.kestra.plugin.core.log.Log
        message: "MongoDB WiredTiger cache is healthy (Dirty: {{ outputs.probe_wiredtiger_cache_status.vars.dirty_pct }}% <= {{ inputs.dirty_cache_percent_threshold }}%)."

  - id: log_audit_complete
    type: io.kestra.plugin.core.log.Log
    description: Final status audit log recording WiredTiger cache state
    message: "WiredTiger cache audit complete. Dirty percentage: {{ outputs.probe_wiredtiger_cache_status.vars.dirty_pct }}%."

errors:
  - id: alert_flow_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alerts Slack when MongoDB connection or issue creation fails
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {{ {
        "text": "⚠️ *MongoDB WiredTiger Sentinel Failed* in execution `" ~ execution.id ~ "`. Unable to query serverStatus."
      } | toJson }}

extend:
  title: "MongoDB WiredTiger Cache Pressure and Dirty Page Sentinel"
  shortDescription: "Audit MongoDB WiredTiger cache pressure via serverStatus, detect dirty byte eviction saturation, file GitHub issues, and alert Slack."
  metaTitle: "MongoDB WiredTiger Cache Pressure Sentinel with Kestra"
  metaDescription: "Monitor MongoDB WiredTiger storage engine cache pressure and dirty pages with Kestra. Query serverStatus, log GitHub issues, and alert Slack."
  description: |
    MongoDB's default storage engine, WiredTiger, allocates half of available RAM minus 1 GB for its in-memory working cache. Under heavy write workloads or unindexed update operations, data pages in memory become dirty before being flushed to disk. When dirty bytes exceed 20% of the total cache, WiredTiger forces user application threads to stall and perform disk writes, causing catastrophic p99 query latency spikes and connection pileups. This blueprint probes MongoDB `serverStatus` on a 10-minute schedule, calculates dirty cache saturation, opens an automated GitHub DBA incident ticket, and alerts on-call database engineers on Slack.

    ## How it works

    1. `periodic_wiredtiger_health_check` (`io.kestra.plugin.core.trigger.Schedule`) initiates the audit every 10 minutes (shipped disabled for safe verification).
    2. `probe_wiredtiger_cache_status` (`io.kestra.plugin.scripts.python.Script`) executes the `serverStatus` administrative command and extracts `wiredTiger.cache` metrics.
    3. `branch_on_cache_pressure` (`io.kestra.plugin.core.flow.If`) evaluates whether dirty cache percentage breached the operator threshold (`is_pressure_critical == true`):
       - `then`: Automatically files a GitHub tracking issue via `create_dba_incident_issue` (`io.kestra.plugin.github.issues.Create`) and alerts the Slack channel via `alert_dba_slack` (`io.kestra.plugin.slack.notifications.SlackIncomingWebhook`).
       - `else`: Emits an informational log entry (`log_cache_healthy`) confirming normal operational cache levels.
    4. `log_audit_complete` (`io.kestra.plugin.core.log.Log`) records the final audit outcome.
    5. The `errors` block alerts Slack if database authentication times out or network connectivity fails.

    ## What you get

    - Automated, scheduled auditing of MongoDB WiredTiger storage engine health.
    - Early warning before dirty cache thresholds force foreground write stalls.
    - Consolidated GitHub incident tickets with configured vs utilized bytes and dirty ratios.
    - Real-time Slack notifications with direct ticket hyperlinks.

    ## Who it's for

    - Database Administrators (DBAs) and Platform Engineers maintaining production MongoDB clusters.
    - Site Reliability Engineers safeguarding query response times under high write concurrency.
    - Infrastructure Architects sizing MongoDB compute and memory footprints.

    ## Why orchestrate this with Kestra

    Kestra coordinates administrative database probing, memory metric calculations, conditional escalation, and chat alerting inside a single declarative workflow. It manages database credentials securely, provides complete execution history, and eliminates the need for separate standalone monitoring daemons.

    ## Prerequisites

    - A MongoDB cluster or standalone instance (OSS MongoDB, Atlas, or Percona Server for MongoDB).
    - A MongoDB user with `serverStatus` or `clusterMonitor` permissions.
    - A GitHub Personal Access Token with repository issue creation permissions.
    - A Slack incoming webhook URL for notifications.

    ### Secrets

    - `GITHUB_TOKEN`: GitHub token used to open incident issues.
    - `SLACK_WEBHOOK`: Incoming Webhook URL for DBA alerts.

    ## Inputs

    - `connection_uri` (STRING, default `mongodb://mongo-cluster.internal.company.com:27017`): MongoDB connection string.
    - `dirty_cache_percent_threshold` (FLOAT, default `20.0`): Percentage of dirty cache above which alerts fire.
    - `target_repository` (STRING, default `my-org/database-operations`): Target GitHub repository for logging incident issues.

    ## Outputs

    - `outputs.probe_wiredtiger_cache_status.vars.bytes_in_cache`: Current bytes in memory cache.
    - `outputs.probe_wiredtiger_cache_status.vars.dirty_pct`: Percentage of dirty bytes in cache.
    - `outputs.probe_wiredtiger_cache_status.vars.is_pressure_critical`: Boolean indicating whether threshold was breached.

    ## Quick start

    1. Configure `GITHUB_TOKEN` and `SLACK_WEBHOOK` in your Kestra namespace.
    2. Import this flow and set `connection_uri` to match your database endpoint.
    3. Run the flow manually to verify cache metric calculation and Slack notification delivery.
    4. Enable the `periodic_wiredtiger_health_check` trigger for continuous cache health monitoring.

    ## How to extend

    - Add an automated query profiler task to inspect current operations via `db.currentOp()`.
    - Adjust WiredTiger cache size dynamically using `setParameter` administrative commands after approval.
    - Route urgent alerts to PagerDuty or Opsgenie if dirty cache exceeds 30%.

    ## Links

    - [MongoDB WiredTiger Storage Engine Documentation](https://www.mongodb.com/docs/manual/core/wiredtiger/)
    - [Kestra Python Script Plugin](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra GitHub Plugin](https://kestra.io/plugins/plugin-github)
    - [Kestra Slack Plugin](https://kestra.io/plugins/plugin-slack)

  tags:
    - Data
    - Infrastructure
  subTags:
    - Monitoring & Alerting
  ee: false
  demo: false
