id: elasticsearch-jvm-heap-pressure-and-old-gc-sentinel
namespace: company.sre

description: |
  Audits Elasticsearch nodes JVM heap memory consumption and old generation garbage collection frequency to prevent node disconnects and stop-the-world pauses.

concurrency:
  limit: 1

inputs:
  - id: es_host
    type: STRING
    displayName: "Elasticsearch Host"
    defaults: "elasticsearch.internal"
    description: "Hostname for Elasticsearch cluster endpoint."
  - id: es_user
    type: STRING
    displayName: "Elasticsearch User"
    defaults: "elastic"
    description: "Elasticsearch HTTP basic auth user."

triggers:
  - id: scheduled_check
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

tasks:
  - id: probe_metrics
    type: io.kestra.plugin.scripts.shell.Commands
    containerImage: curlimages/curl:latest
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    env:
      ES_HOST: "{{ inputs.es_host }}"
      ES_USER: "{{ inputs.es_user }}"
      ES_PASS: "{{ secret('ES_PASSWORD') }}"
    commands:
      - |
        JVM_STATS=$(curl -s -u "$ES_USER:$ES_PASS" "http://$ES_HOST:9200/_nodes/stats/jvm" 2>/dev/null)
        if [ -z "$JVM_STATS" ]; then echo "Elasticsearch JVM stats check failed" >&2; exit 1; fi
        echo "$JVM_STATS" | jq '
        [ .nodes | to_entries[] | {name: .value.name, heap_pct: .value.jvm.mem.heap_used_percent, gc_old_count: .value.jvm.gc.collectors.old.collection_count} ]
        | {top_heap: (sort_by(-.heap_pct)[0]), is_alert: (any(.[]; .heap_pct > 85))}
        ' > output.json
    outputFiles:
      - output.json

  - id: evaluate_threshold
    type: io.kestra.plugin.core.flow.If
    condition: "{{ json(read(outputs.probe_metrics.outputFiles['output.json'])).is_alert }}"
    then:
      - id: notify_slack
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#infrastructure-alerts",
            "text": "🚨 *Elasticsearch JVM Heap Alert: `{{ inputs.es_host }}`*\n- *Node*: `{{ json(read(outputs.probe_metrics.outputFiles['output.json'])).top_heap.name }}`\n- *Heap Used*: `{{ json(read(outputs.probe_metrics.outputFiles['output.json'])).top_heap.heap_pct }}%`"
          }

errors:
  - id: notify_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#infrastructure-alerts",
        "text": "❌ *Sentinel probe execution failed for elasticsearch-jvm-heap-pressure-and-old-gc-sentinel*"
      }

extend:
  title: Elasticsearch jvm heap memory pressure and gc sentinel
  shortDescription: Audits Elasticsearch nodes JVM heap memory consumption and old generation garbage collection frequency to prevent node disconnects and stop-the-world pauses.
  description: |
