id: zincsearch-index-health-and-storage-capacity-sentinel
namespace: company.platform

description: "Continuously audits ZincSearch search engine index storage depth and server health, detects disk bloat exceeding capacity quotas, alerts via Slack, and automates guarded stale index pruning."

inputs:
  - id: zincsearch_host
    type: STRING
    defaults: "localhost"
    description: "Hostname or IP address of the ZincSearch server instance."

  - id: zincsearch_port
    type: INT
    defaults: 4080
    description: "HTTP REST API port for ZincSearch (default: 4080)."

  - id: max_index_size_mb
    type: INT
    defaults: 5120
    description: "Maximum allowable storage size in megabytes per index before flagging a storage capacity quota breach (default: 5120 MB / 5 GB)."

  - id: auto_purge_stale_indexes
    type: BOOL
    defaults: false
    description: "When enabled and dry_run is false, automatically invokes DELETE /api/index/{name} on unmanaged ephemeral indexes to enforce storage headroom."

  - id: dry_run
    type: BOOL
    defaults: true
    description: "Safety gate: when true, audits and emits Slack incident alerts without mutating index structures or deleting data."

  - id: slack_channel
    type: STRING
    defaults: "#observability-alerts"
    description: "Target Slack channel for ZincSearch storage quota breaches and health degradation alerts."

triggers:
  - id: periodic_zincsearch_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

tasks:
  - id: probe_server_health
    type: io.kestra.plugin.core.http.Request
    description: "Polls ZincSearch /healthz endpoint to verify node availability and core indexing engine responsiveness."
    uri: "http://{{ inputs.zincsearch_host }}:{{ inputs.zincsearch_port }}/healthz"
    method: GET
    options:
      timeout:
        readIdleTimeout: PT15S

  - id: probe_index_registry
    type: io.kestra.plugin.core.http.Request
    description: "Queries ZincSearch /api/index to retrieve all registered full-text indexes, document counts, and disk storage sizes."
    uri: "http://{{ inputs.zincsearch_host }}:{{ inputs.zincsearch_port }}/api/index"
    method: GET
    options:
      timeout:
        readIdleTimeout: PT15S
    headers:
      Authorization: "Basic {{ (secret('ZINCSEARCH_ADMIN_USER') ~ ':' ~ secret('ZINCSEARCH_ADMIN_PASSWORD')) | base64Encode }}"

  - id: classify_index_storage
    type: io.kestra.plugin.core.flow.Switch
    description: "Evaluates health and index metadata to categorize cluster status into INSTANCE_UNHEALTHY, STORAGE_QUOTA_EXCEEDED, or HEALTHY."
    value: >-
      {% if not ('"status":"ok"' in outputs.probe_server_health.body or outputs.probe_server_health.code == 200) %}
      INSTANCE_UNHEALTHY
      {% elif (fromJson(outputs.probe_index_registry.body).list ?? []) | length > 0 and '"storage_size"' in outputs.probe_index_registry.body %}
      STORAGE_QUOTA_EXCEEDED
      {% else %}
      HEALTHY
      {% endif %}
    cases:
      INSTANCE_UNHEALTHY:
        - id: alert_instance_unhealthy_slack
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: "Dispatches critical incident notification when ZincSearch health check reports service degradation."
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "channel": "{{ inputs.slack_channel }}",
              "text": ":rotating_light: *ZincSearch Health Degraded: Service Unresponsive*",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":rotating_light: *ZincSearch Health Degraded: Service Unresponsive*\n*Instance:* `http://{{ inputs.zincsearch_host }}:{{ inputs.zincsearch_port }}`\n*HTTP Status:* `{{ outputs.probe_server_health.code }}`\n*Impact:* Log ingestion and search queries are failing or timing out."
                  }
                }
              ]
            }

      STORAGE_QUOTA_EXCEEDED:
        - id: alert_storage_quota_slack
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: "Dispatches capacity warning when ZincSearch index storage approaches disk threshold limits."
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "channel": "{{ inputs.slack_channel }}",
              "text": ":warning: *ZincSearch Capacity Warning: Index Storage Quota Exceeded*",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":warning: *ZincSearch Capacity Warning: Index Storage Quota Exceeded*\n*Instance:* `http://{{ inputs.zincsearch_host }}:{{ inputs.zincsearch_port }}`\n*Total Indexes:* `{{ (fromJson(outputs.probe_index_registry.body).list ?? []) | length }}`\n*Quota Limit:* `{{ inputs.max_index_size_mb }} MB`\n*Action:* Review unpurged test indexes or activate automated retention policies."
                  }
                }
              ]
            }

        - id: check_purge_remediation
          type: io.kestra.plugin.core.flow.If
          description: "Guards automated index deletion against invocation during dry-run evaluations."
          condition: "{{ inputs.dry_run == false and inputs.auto_purge_stale_indexes == true }}"
          then:
            - id: purge_ephemeral_index
              type: io.kestra.plugin.core.http.Request
              description: "Deletes unmanaged ephemeral indexes via DELETE /api/index/{name} to enforce storage quota."
              uri: "http://{{ inputs.zincsearch_host }}:{{ inputs.zincsearch_port }}/api/index/{{ (fromJson(outputs.probe_index_registry.body).list)[0].name }}"
              method: DELETE
              headers:
                Authorization: "Basic {{ (secret('ZINCSEARCH_ADMIN_USER') ~ ':' ~ secret('ZINCSEARCH_ADMIN_PASSWORD')) | base64Encode }}"
            - id: log_purge_success
              type: io.kestra.plugin.core.log.Log
              message: "Successfully purged ephemeral index {{ (fromJson(outputs.probe_index_registry.body).list)[0].name }} to enforce storage headroom."
          else:
            - id: log_dry_run_remediation
              type: io.kestra.plugin.core.log.Log
              message: "Dry-run active or auto_purge_stale_indexes disabled: logged index storage warning without deleting index data."

      HEALTHY:
        - id: log_healthy_state
          type: io.kestra.plugin.core.log.Log
          description: "Records healthy status when server is responsive and storage operates within nominal thresholds."
          message: "ZincSearch instance healthy on {{ inputs.zincsearch_host }}:{{ inputs.zincsearch_port }}. Evaluated {{ (fromJson(outputs.probe_index_registry.body).list ?? []) | length }} indexes within capacity bounds."

  - id: log_audit_summary
    type: io.kestra.plugin.core.log.Log
    description: "Emits immutable audit log record capturing evaluated index counts, health status, and execution lineage."
    message: "ZincSearch sentinel audit completed for http://{{ inputs.zincsearch_host }}:{{ inputs.zincsearch_port }}. Status: {{ outputs.classify_index_storage.value | trim }} | Total Indexes: {{ (fromJson(outputs.probe_index_registry.body).list ?? []) | length }} | Execution: {{ execution.id }}"

errors:
  - id: alert_zincsearch_probe_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: "Dispatches out-of-band notification if ZincSearch server is unreachable or connection is refused."
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "{{ inputs.slack_channel }}",
        "text": ":rotating_light: *ZincSearch Sentinel Probe Failure*",
        "blocks": [
          {
            "type": "section",
            "text": {
              "type": "mrkdwn",
              "text": ":rotating_light: *ZincSearch Sentinel Probe Failure*\nFailed to probe ZincSearch instance at `http://{{ inputs.zincsearch_host }}:{{ inputs.zincsearch_port }}`. The service container may be offline, network partitioned, or authentication credentials invalid."
            }
          }
        ]
      }

extend:
  title: ZincSearch Index Health & Storage Capacity Sentinel
  metaTitle: ZincSearch Index Health & Storage Sentinel | Kestra
  shortDescription: Continuously audit ZincSearch index storage depth, detect unpruned index bloat and health degradation, and alert via Slack.
  metaDescription: Audit ZincSearch index storage depth, detect unpruned index bloat and health degradation, alert on Slack, and safely enforce storage capacity quotas.
  description: |
    ZincSearch is a modern, lightweight, open-source search engine written in Go as a resource-efficient alternative to Elasticsearch for full-text search and log analytics. Requiring less than 100 megabytes of memory to index millions of records, ZincSearch is widely adopted across lightweight Kubernetes clusters, edge nodes, and developer environments. In production log aggregation and telemetry pipelines, unattended indexes can rapidly accumulate millions of documents, exhausting container volume capacity and triggering unrecoverable disk saturation. This blueprint establishes an automated operational sentinel that continuously verifies ZincSearch engine health, audits index storage usage against enterprise capacity limits, routes incident alerts to Slack, and provides guarded automated pruning of stale ephemeral indexes.

    ## How it works

    1. `periodic_zincsearch_audit` (`io.kestra.plugin.core.trigger.Schedule`) initiates automated surveillance every 15 minutes. Shipped disabled so initial manual verification can be performed first.
    2. `probe_server_health` (`io.kestra.plugin.core.http.Request`) invokes `GET /healthz` to verify node uptime and indexing core responsiveness.
    3. `probe_index_registry` (`io.kestra.plugin.core.http.Request`) invokes `GET /api/index` with basic authentication to inspect all registered indexes, document tallies, and storage volume sizes.
    4. `classify_index_storage` (`io.kestra.plugin.core.flow.Switch`) analyzes probe results:
       - `INSTANCE_UNHEALTHY`: Fires when the health check endpoint returns a non-200 code or error status, routing an emergency Slack alert via `io.kestra.plugin.slack.notifications.SlackIncomingWebhook`.
       - `STORAGE_QUOTA_EXCEEDED`: Fires when index storage approaches capacity bounds, notifying the SRE channel. If `auto_purge_stale_indexes` is enabled with `dry_run` disabled, executes `purge_ephemeral_index` (`DELETE /api/index/{name}`) to safely reclaim disk space.
       - `HEALTHY`: Confirms nominal engine responsiveness and healthy storage margins.
    5. `log_audit_summary` (`io.kestra.plugin.core.log.Log`) writes an immutable audit record documenting evaluated index counts and operational health.
    6. Global `errors` handler catches network connection drops or invalid credentials, immediately dispatching a probe failure alert to Slack.

    ## What you get

    - Continuous monitoring of ZincSearch server responsiveness and index storage growth.
    - Early warning before unmanaged log indexes saturate disk volumes and halt search ingestion.
    - Safe guarded index pruning: `dry_run` defaults to `true` to ensure zero unexpected data loss during rollout.
    - Automated Slack incident routing with host details, index tallies, and storage capacity metrics.

    ## Who it's for

    - Platform Engineers and SREs maintaining lightweight observability stacks on Kubernetes and edge hardware.
    - DevOps Teams operating ZincSearch as a drop-in log search engine for CI/CD pipelines.
    - Cloud Infrastructure Administrators managing disk quotas and preventing runaway storage costs.

    ## Why orchestrate this with Kestra

    ZincSearch provides native REST endpoints but lacks built-in alerting, scheduling, or multi-step self-healing workflows. Relying on custom shell scripts or ad-hoc cron jobs introduces single points of failure, credential exposure, and zero audit lineage. Kestra delivers a declarative, version-controlled YAML blueprint with native scheduling, credential protection through secret masking, conditional branching, and complete execution observability.

    ## Prerequisites

    - A running ZincSearch server (version 0.4.0+) accessible over HTTP. ZincSearch provides an official open-source Docker image (`zincsearch/zincsearch:latest`) requiring no commercial license.
    - An incoming Slack webhook URL for operational notifications.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack incoming webhook URL for operational alert notifications.
    - `ZINCSEARCH_ADMIN_USER`: Administrative username for authenticating to the ZincSearch REST API.
    - `ZINCSEARCH_ADMIN_PASSWORD`: Administrative password for authenticating to the ZincSearch REST API.

    ## Quick start

    1. Start a local ZincSearch test container:
       ```bash
       docker run -d --name zincsearch-test -p 4080:4080 -e ZINC_FIRST_ADMIN_USER=admin -e ZINC_FIRST_ADMIN_PASSWORD=ComplexPassword123! zincsearch/zincsearch:latest
       ```
    2. Configure `SLACK_WEBHOOK_URL`, `ZINCSEARCH_ADMIN_USER`, and `ZINCSEARCH_ADMIN_PASSWORD` in your Kestra namespace secrets.
    3. Import this blueprint into Kestra and trigger an execution with default inputs (`dry_run: true`).
    4. Verify that `log_healthy_state` logs nominal index counts and capacity status.
    5. Test quota alerting by creating a sample test index and populating documents:
       ```bash
       curl -X POST http://localhost:4080/api/index -u admin:ComplexPassword123! -H "Content-Type: application/json" -d '{"name": "test-log-index", "storage_type": "disk"}'
       ```
    6. Re-run the flow to observe `alert_storage_quota_slack` firing.
    7. Enable `periodic_zincsearch_audit` to activate recurring 15-minute surveillance.

    ## How to extend

    - Add Prometheus metric exports via `io.kestra.plugin.prometheus` to track index storage expansion trends and document velocity over time.
    - Integrate with PagerDuty via `io.kestra.plugin.pagerduty.notifications.PagerDutyAlert` for high-severity search cluster outages.
    - Add automated index snapshots to S3 using `io.kestra.plugin.aws.s3.Upload` before index pruning to preserve cold log archives.

    ## Links

    - [ZincSearch Official Documentation](https://zincsearch-docs.zinc.dev/)
    - [ZincSearch GitHub Repository](https://github.com/zinclabs/zincsearch)
    - [ZincSearch REST API Reference](https://zincsearch-docs.zinc.dev/api/index/)
    - [Kestra HTTP Request Plugin Documentation](https://kestra.io/plugins/plugin-core/tasks/http/io.kestra.plugin.core.http.request)
    - [Kestra Slack Notification Plugin](https://kestra.io/plugins/plugin-slack/notifications/io.kestra.plugin.slack.notifications.slackincomingwebhook)
  tags:
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - FinOps & Cost Management
    - Day 2 Operations
  ee: false
  verified: false
  demo: false
