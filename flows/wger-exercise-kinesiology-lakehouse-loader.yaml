id: wger-exercise-kinesiology-lakehouse-loader
namespace: company.analytics
description: Ingests workout movement libraries, muscle group biomechanics, and exercise equipment taxonomies from wger API into DuckDB, exports Parquet and analytics datasets, and manages sync state with Kestra KV store.

inputs:
  - id: state_key
    type: STRING
    description: Kestra KV store key tracking processed unique entity identifiers.
    defaults: wger-exercise-kinesiology-lakehouse-loader_state

variables:
  default_state: "[]"

triggers:
  - id: periodic_sync
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 4 * * 1"

tasks:
  - id: get_current_state
    type: io.kestra.plugin.core.kv.Get
    key: "{{ inputs.state_key }}"
    errorOnMissing: false

  - id: ingest_and_transform
    type: io.kestra.plugin.scripts.python.Commands
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install requests duckdb
    commands:
      - |
        python3 - << 'PYEOF'
        import os
        import json
        import requests
        import duckdb
        from datetime import datetime, timezone

        raw_state = """{{ outputs.get_current_state.value ?? vars.default_state }}"""
        try:
            seen_ids = set(json.loads(raw_state))
        except Exception:
            seen_ids = set()

        url = "https://wger.de/api/v2/exercise/?language=2&limit=50"
        headers = {"User-Agent": "KestraLakehouseLoader/1.0 (kestra-data-pipeline; contact@company.internal)"}

        resp = requests.get(url, headers=headers, timeout=30)
        resp.raise_for_status()
        data = resp.json()
        root_key = "results"
        items = data.get(root_key, data) if root_key else data

        records = []
        now_iso = datetime.now(timezone.utc).isoformat()
        current_ids = []

        
        for item in items:
            eid = str(item.get('id', 'UNKNOWN'))
            current_ids.append(eid)
            name = item.get('name', 'Unnamed Exercise')
            cat = str(item.get('category', 'General'))
            muscles = item.get('muscles', [])
            m_count = len(muscles) if isinstance(muscles, list) else 0
            equipment = item.get('equipment', [])
            eq_count = len(equipment) if isinstance(equipment, list) else 0

            records.append({
                'exercise_id': eid,
                'name': str(name),
                'category': cat,
                'muscles_count': m_count,
                'equipment_count': eq_count,
                'is_new': bool(eid not in seen_ids),
                'ingestion_timestamp': now_iso
            })
        

        con = duckdb.connect(database=":memory:")
        con.execute("""
            CREATE TABLE exercise_catalog (
                exercise_id VARCHAR,
                name VARCHAR,
                category VARCHAR,
                muscles_count INTEGER,
                equipment_count INTEGER,
                is_new BOOLEAN,
                ingestion_timestamp VARCHAR
            );
        """)

        if records:
            con.execute("INSERT INTO exercise_catalog SELECT * FROM read_json_auto(?)", [json.dumps(records)])

        con.execute("COPY exercise_catalog TO 'exercise_catalog.parquet' (FORMAT PARQUET, COMPRESSION ZSTD);")
        con.execute("""
            COPY (
                SELECT
                    category,
                    COUNT(*) AS exercise_count,
                    AVG(muscles_count) AS avg_muscles_targeted
                FROM exercise_catalog
                GROUP BY 1
                ORDER BY exercise_count DESC
            ) TO 'exercises_by_category.csv' (HEADER, DELIMITER ',');
        """)

        new_count = con.execute("SELECT count(*) FROM exercise_catalog WHERE is_new = true").fetchone()[0]
        total_count = con.execute("SELECT count(*) FROM exercise_catalog").fetchone()[0]

        updated_ids = list(seen_ids.union(current_ids))
        with open("updated_state.json", "w") as f:
            json.dump(updated_ids, f)

        metrics = {
            "total_extracted": total_count,
            "new_entities": new_count,
            "synced_at": now_iso
        }
        with open("metrics.json", "w") as f:
            json.dump(metrics, f)

        print(f"Lakehouse sync complete. Processed {total_count} records ({new_count} newly observed).")
        PYEOF
    outputFiles:
      - exercise_catalog.parquet
      - exercises_by_category.csv
      - updated_state.json
      - metrics.json

  - id: update_state
    type: io.kestra.plugin.core.kv.Set
    key: "{{ inputs.state_key }}"
    value: "{{ read(outputs.ingest_and_transform.outputFiles['updated_state.json']) }}"

  - id: analyze_and_notify
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.ingest_and_transform.outputFiles['exercise_catalog.parquet'] != null }}"
    then:
      - id: log_metrics
        type: io.kestra.plugin.core.log.Log
        message: "wger Exercise Kinesiology Catalog sync succeeded. Metrics: {{ read(outputs.ingest_and_transform.outputFiles['metrics.json']) }}"
