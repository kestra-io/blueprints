id: alembic-migration-divergent-heads-and-schema-drift-gate
namespace: company.platform

description: |
  Inspects an Alembic database migration repository before deployment to
  detect divergent migration heads, catch uncommitted SQLAlchemy model schema
  drift, and export an offline DDL dry-run script for pending migrations.
  Blocks CI/CD pipelines when multiple divergent heads or uncommitted model
  schema mutations are detected, while generating review artifacts for safe
  database deployment approvals.

inputs:
  - id: migrations_bundle
    type: FILE
    displayName: "Migrations Bundle Archive"
    description: "Optional tar.gz or zip archive containing alembic.ini, alembic/ versions, and SQLAlchemy models. If omitted, the flow initializes a self-contained environment with sample revisions to demonstrate inspection."
    required: false

  - id: database_url
    type: STRING
    displayName: "Target Database URL"
    description: "Database connection URL (PostgreSQL postgresql://user:pass@host:5432/db or SQLite sqlite:///app.db). In production, configure this via secret('DATABASE_URL')."
    defaults: "sqlite:///app.db"

  - id: fail_on_model_drift
    type: BOOL
    displayName: "Fail on Model Drift"
    description: "When true, blocks the deployment gate if alembic check detects uncommitted SQLAlchemy model schema mutations not captured in migration scripts."
    defaults: true

  - id: generate_sql_dryrun
    type: BOOL
    displayName: "Generate SQL Dry-Run Plan"
    description: "When true, executes alembic upgrade --sql to generate raw DDL statements for pending migrations and saves them as an execution artifact."
    defaults: true

triggers:
  - id: check_on_pr_webhook
    type: io.kestra.plugin.core.trigger.Webhook
    description: "Enables CI/CD pipelines (GitHub Actions, GitLab CI) to POST a pull request's migration bundle to Kestra for pre-merge validation. Streams the payload to Kestra internal storage as trigger.uri."
    key: "{{ secret('ALEMBIC_GATE_WEBHOOK_KEY') }}"
    fetchType: STORE
    disabled: true

  - id: schedule_nightly_drift_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: "Executes scheduled schema parity audits to ensure deployed databases remain synchronized with the latest migration revisions."
    cron: "0 4 * * 1-5"
    disabled: true

tasks:
  - id: inspect_alembic_state
    type: io.kestra.plugin.scripts.shell.Commands
    description: |
      Executes Alembic CLI inspection inside a Python container. Inspects migration
      heads for branch divergence, compares database schema against SQLAlchemy models
      via alembic check, and generates offline dry-run SQL for pending revisions.
    containerImage: python:3.11-slim
    allowFailure: true
    outputFiles:
      - "alembic-report.json"
      - "migration-plan.sql"
    commands:
      - |
        set -e
        pip install --no-cache-dir alembic sqlalchemy psycopg2-binary > /dev/null 2>&1

        cat << 'EOF' > runner.py
        import os
        import sys
        import json
        import subprocess
        import tarfile
        import zipfile
        from pathlib import Path

        db_url = os.environ.get("DATABASE_URL", "sqlite:///app.db")
        fail_on_drift = os.environ.get("FAIL_ON_DRIFT", "true").lower() == "true"
        gen_sql = os.environ.get("GENERATE_SQL", "true").lower() == "true"
        bundle_path = os.environ.get("BUNDLE_PATH", "")

        # Unpack user bundle if provided, otherwise bootstrap self-contained test environment
        if bundle_path and os.path.exists(bundle_path):
            if tarfile.is_tarfile(bundle_path):
                with tarfile.open(bundle_path, "r:*") as tar:
                    tar.extractall(".")
            elif zipfile.is_zipfile(bundle_path):
                with zipfile.ZipFile(bundle_path, "r") as z:
                    z.extractall(".")
        else:
            # Bootstrap clean demonstration workspace
            subprocess.run([sys.executable, "-m", "alembic", "init", "alembic"], check=True, capture_output=True)
            ini_file = Path("alembic.ini")
            ini_text = ini_file.read_text(encoding="utf-8")
            ini_text = ini_text.replace("sqlalchemy.url = driver://user:pass@localhost/dbname", f"sqlalchemy.url = {db_url}")
            ini_file.write_text(ini_text, encoding="utf-8")

            Path("models.py").write_text('''
        from sqlalchemy.orm import declarative_base
        from sqlalchemy import Column, Integer, String, DateTime, func

        Base = declarative_base()

        class User(Base):
            __tablename__ = "users"
            id = Column(Integer, primary_key=True)
            email = Column(String(255), unique=True, nullable=False)
            created_at = Column(DateTime, server_default=func.now(), nullable=False)
        ''', encoding="utf-8")

            env_path = Path("alembic/env.py")
            env_code = env_path.read_text(encoding="utf-8")
            env_code = "from models import Base\n" + env_code
            env_code = env_code.replace("target_metadata = None", "target_metadata = Base.metadata")
            env_path.write_text(env_code, encoding="utf-8")

            # Create initial baseline revision and apply to target database
            subprocess.run([sys.executable, "-m", "alembic", "revision", "--autogenerate", "-m", "create_users_table"], check=True, capture_output=True)
            subprocess.run([sys.executable, "-m", "alembic", "upgrade", "head"], check=True, capture_output=True)

        # 1. Inspect Alembic heads
        heads_proc = subprocess.run([sys.executable, "-m", "alembic", "heads"], capture_output=True, text=True)
        raw_heads = [line.strip() for line in heads_proc.stdout.splitlines() if line.strip()]
        heads = [line.split()[0] for line in raw_heads if line]
        multiple_heads = len(heads) > 1

        # 2. Inspect Alembic current database revision
        current_proc = subprocess.run([sys.executable, "-m", "alembic", "current"], capture_output=True, text=True)
        raw_current = [line.strip() for line in current_proc.stdout.splitlines() if line.strip()]
        current_rev = raw_current[0].split()[0] if raw_current and not raw_current[0].startswith("None") else None

        # 3. Inspect schema drift via alembic check
        check_proc = subprocess.run([sys.executable, "-m", "alembic", "check"], capture_output=True, text=True)
        schema_drift_detected = (check_proc.returncode != 0)
        drift_details = check_proc.stdout.strip() if check_proc.stdout.strip() else check_proc.stderr.strip()

        # 4. Generate SQL dry-run plan if single head and pending migrations exist
        sql_plan_content = "-- Alembic Dry-Run Migration Plan\n"
        pending_count = 0
        if not multiple_heads:
            sql_proc = subprocess.run([sys.executable, "-m", "alembic", "upgrade", "head", "--sql"], capture_output=True, text=True)
            if sql_proc.returncode == 0:
                sql_plan_content = sql_proc.stdout
                pending_statements = [l for l in sql_proc.stdout.splitlines() if l.strip() and not l.strip().startswith("--")]
                pending_count = 1 if len(pending_statements) > 0 and current_rev not in heads else 0

        Path("migration-plan.sql").write_text(sql_plan_content, encoding="utf-8")

        # Determine diagnostic gate status
        if multiple_heads:
            gate_status = "BLOCK_MULTIPLE_HEADS"
            remediation = f"Run 'alembic merge -m \"merge divergent heads\" {' '.join(heads)}' to unify branching revisions."
        elif schema_drift_detected and fail_on_drift:
            gate_status = "BLOCK_SCHEMA_DRIFT"
            remediation = "Run 'alembic revision --autogenerate -m \"capture_model_drift\"' to commit missing schema migrations."
        elif pending_count > 0:
            gate_status = "PASS_PENDING_MIGRATIONS"
            remediation = "Review migration-plan.sql DDL artifact and proceed with deployment upgrade."
        else:
            gate_status = "PASS_UP_TO_DATE"
            remediation = "Database schema is synchronized with code models and latest revision."

        report = {
            "gate_status": gate_status,
            "heads": heads,
            "head_count": len(heads),
            "multiple_heads": multiple_heads,
            "current_revision": current_rev,
            "schema_drift_detected": schema_drift_detected,
            "drift_details": drift_details,
            "pending_count": pending_count,
            "remediation": remediation
        }

        with open("alembic-report.json", "w", encoding="utf-8") as f:
            json.dump(report, f, indent=2)

        print(f"Alembic inspection complete: status={gate_status}, heads={len(heads)}, drift={schema_drift_detected}")
        EOF

        DATABASE_URL="{{ inputs.database_url }}" \
        FAIL_ON_DRIFT="{{ inputs.fail_on_model_drift }}" \
        GENERATE_SQL="{{ inputs.generate_sql_dryrun }}" \
        BUNDLE_PATH="{{ trigger.uri ?? inputs.migrations_bundle ?? '' }}" \
        python runner.py

  - id: classify_migration_gate
    type: io.kestra.plugin.core.debug.Return
    description: Evaluates the Alembic diagnostic report and extracts the operational gate status.
    value: >-
      {{
        outputs.inspect_alembic_state.outputFiles['alembic-report.json']
        ? (read(outputs.inspect_alembic_state.outputFiles['alembic-report.json']) | json).gate_status
        : 'UNREACHABLE'
      }}

  - id: route_by_migration_status
    type: io.kestra.plugin.core.flow.Switch
    description: Routes workflow execution based on the detected migration gate status.
    value: "{{ outputs.classify_migration_gate.value }}"
    cases:
      BLOCK_MULTIPLE_HEADS:
        - id: alert_multiple_heads
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: Sends high-priority Slack alert when divergent Alembic heads block deployment.
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "channel": "#platform-deployments",
              "text": "*Alembic Migration Gate Blocked: Divergent Heads Detected*\n- Multiple migration heads found in repository.\n- Deployment upgrade cannot proceed without resolving branch divergence.\n- *Action Required:* Run `alembic merge heads` locally and commit the merge revision."
            }
        - id: fail_gate_multiple_heads
          type: io.kestra.plugin.core.execution.Fail
          description: Deliberately fails the execution to block downstream CI/CD deployment jobs.
          errorMessage: "Deployment blocked: Multiple divergent Alembic heads detected. Merge conflicting revisions with 'alembic merge heads' before deployment."

      BLOCK_SCHEMA_DRIFT:
        - id: alert_schema_drift
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: Sends Slack alert when uncommitted SQLAlchemy model mutations are detected.
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "channel": "#platform-deployments",
              "text": "*Alembic Migration Gate Blocked: Schema Drift Detected*\n- SQLAlchemy models in code do not match database migration state.\n- *Action Required:* Run `alembic revision --autogenerate` to generate missing migration scripts."
            }
        - id: fail_gate_schema_drift
          type: io.kestra.plugin.core.execution.Fail
          description: Deliberately fails the execution when model schema drift is detected.
          errorMessage: "Deployment blocked: Uncommitted SQLAlchemy model drift detected via alembic check. Generate corresponding migration revision before deploying."

      PASS_PENDING_MIGRATIONS:
        - id: log_pending_migrations
          type: io.kestra.plugin.core.log.Log
          description: Logs approval notice for pending migrations with SQL dry-run plan.
          message: "Alembic gate PASSED with pending migrations. Single head verified, 0 model drift. Review dry-run DDL at {{ outputs.inspect_alembic_state.outputFiles['migration-plan.sql'] }}."
        - id: notify_pending_migration_review
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: Notifies engineering and DBA teams that pending migrations are ready for deployment.
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "channel": "#platform-deployments",
              "text": "*Alembic Migration Gate Passed: Pending Migrations Ready*\n- Migration graph verified with single head and zero model drift.\n- Offline DDL dry-run script generated and attached for deployment review."
            }

      PASS_UP_TO_DATE:
        - id: log_up_to_date
          type: io.kestra.plugin.core.log.Log
          description: Confirms database schema is fully up-to-date with code models and latest revision.
          message: "Alembic gate PASSED: Database schema is fully synchronized with latest migration head. Zero pending migrations, zero model drift."

    defaults:
      - id: log_unreachable_state
        type: io.kestra.plugin.core.log.Log
        description: Logs unexpected or unreachable inspection outcome.
        message: "Alembic inspection returned unexpected status: {{ outputs.classify_migration_gate.value }}"

outputs:
  - id: gate_status
    type: STRING
    value: "{{ outputs.classify_migration_gate.value }}"

  - id: report_uri
    type: STRING
    value: "{{ outputs.inspect_alembic_state.outputFiles['alembic-report.json'] }}"

  - id: sql_plan_uri
    type: STRING
    value: "{{ outputs.inspect_alembic_state.outputFiles['migration-plan.sql'] }}"

errors:
  - id: alert_execution_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alerts operations team if inspection container fails to execute.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "#platform-deployments",
        "text": "*Alembic Migration Gate Pipeline Failed*\nExecution failed during migration preflight inspection. Check execution logs."
      }

extend:
  title: "Alembic Migration Divergent Heads and Schema Drift Gate"
  metaTitle: "Alembic Migration Multi-Head & Drift Gate | Kestra Blueprint"
  shortDescription: "Detect divergent Alembic migration heads, catch uncommitted SQLAlchemy model schema drift, and export dry-run DDL before deployment."
  metaDescription: "Block deployments on divergent Alembic migration heads or uncommitted SQLAlchemy model schema drift while exporting dry-run DDL for review."
  description: |
    Database migration failures during production rollouts are frequently caused by two preventable issues: divergent migration heads created when concurrent developer branches merge without a merge revision, and uncommitted schema drift where SQLAlchemy model definitions change in Python code without a corresponding migration script.

    This blueprint runs pre-deployment inspection using official Alembic CLI tools in a containerized environment. It checks for divergent migration heads, validates SQLAlchemy model synchronization using `alembic check`, generates an offline SQL dry-run script (`migration-plan.sql`) for pending revisions, and blocks downstream CI/CD deployment jobs when breaking migration conflicts are detected.

    ## How it works

    1. `check_on_pr_webhook` (`io.kestra.plugin.core.trigger.Webhook`) allows external CI/CD pipelines (such as GitHub Actions or GitLab CI) to POST a pull request's migration bundle into Kestra. Using `fetchType: STORE`, the payload is securely written to internal storage and exposed as `trigger.uri`. Alternatively, running the flow manually or as a `Subflow` utilizes `migrations_bundle`.
    2. `inspect_alembic_state` (`io.kestra.plugin.scripts.shell.Commands`) runs in a `python:3.11-slim` container. It inspects migration revisions with `alembic heads`, checks currently applied database versions with `alembic current`, evaluates model parity with `alembic check`, and generates an offline SQL dry-run plan with `alembic upgrade head --sql`. Output artifacts `alembic-report.json` and `migration-plan.sql` are collected.
    3. `classify_migration_gate` (`io.kestra.plugin.core.debug.Return`) reads the structured diagnostic report and determines the gate classification: `BLOCK_MULTIPLE_HEADS`, `BLOCK_SCHEMA_DRIFT`, `PASS_PENDING_MIGRATIONS`, or `PASS_UP_TO_DATE`.
    4. `route_by_migration_status` (`io.kestra.plugin.core.flow.Switch`) branches on the classification:
       - `BLOCK_MULTIPLE_HEADS`: Sends a Slack notification containing the conflicting head revision IDs and fails the execution via `fail_gate_multiple_heads` (`io.kestra.plugin.core.execution.Fail`) to halt CI/CD deployment.
       - `BLOCK_SCHEMA_DRIFT`: Alerts the platform team with the detected model drift details and halts execution via `fail_gate_schema_drift`.
       - `PASS_PENDING_MIGRATIONS`: Notifies the team that pending migrations are validated, attaches the generated `migration-plan.sql` dry-run DDL artifact for review, and permits deployment to proceed.
       - `PASS_UP_TO_DATE`: Logs a confirmation that database schema and model definitions are fully synchronized.
    5. The `errors` block alerts the engineering team if runner execution fails unexpectedly.

    ## What you get

    - Automated prevention of deployment crashes caused by `Multiple heads are present` errors during `alembic upgrade head`.
    - Early detection of uncommitted SQLAlchemy model schema drift, preventing production runtime `UndefinedColumn` errors.
    - Pre-computed offline SQL dry-run artifacts (`migration-plan.sql`) allowing DBAs to review exact DDL statements before execution.
    - Hard CI/CD deployment blocking via Kestra's `Fail` task to stop broken builds before database modification occurs.

    ## Who it's for

    - Platform Engineers and DevOps teams managing database schema rollout pipelines.
    - Backend Engineers developing applications with SQLAlchemy, FastAPI, Flask, or Django with Alembic.
    - Database Administrators requiring pre-execution DDL dry-run reviews for production database changes.

    ## Why orchestrate this with Kestra

    Alembic CLI commands output text diagnostics but do not natively orchestrate approval routing, artifact persistence, or cross-system notifications. Orchestrating migration verification in Kestra provides declarative gate policies, captures generated SQL dry-run scripts as auditable downloadable artifacts, and seamlessly halts chained deployment pipelines when schema inconsistencies are detected.

    ## Prerequisites

    - A Kestra worker with Docker container execution enabled.
    - Network access from the container to the target PostgreSQL or MySQL database (or local SQLite for self-contained testing).
    - A Slack incoming webhook URL for notifications.

    ### Secrets

    - `ALEMBIC_GATE_WEBHOOK_KEY`: Authentication key for the CI/CD webhook trigger (`.../executions/webhook/{namespace}/{flowId}/{key}`). Only required when `check_on_pr_webhook` is enabled.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL used to transmit deployment gate alerts, remediation instructions, and review notices.
    - `DATABASE_URL`: Connection string for target database in production environments.

    ## Quick start

    1. Configure the `SLACK_WEBHOOK_URL` secret in your Kestra namespace.
    2. Import this blueprint into your Kestra instance and click **Execute** with default inputs. The flow will bootstrap a demonstration Alembic environment, execute schema verification, generate dry-run artifacts, and pass the gate.
    3. To test multi-head detection, upload a migration bundle containing divergent revisions or test branching with `alembic revision --splice`.
    4. Enable `check_on_pr_webhook` to trigger automated pre-merge migration verification from your CI/CD repository workflows.

    ## How to extend

    - Connect downstream database upgrade tasks using `io.kestra.plugin.jdbc.postgresql.Query` or chained Subflows once the gate passes.
    - Integrate with GitHub Commit Status API to report check run passes or failures directly onto pull requests.
    - Store generated `migration-plan.sql` artifacts in an S3 or Google Cloud Storage bucket for regulatory compliance audit trails.

    ## Links

    - [Alembic Documentation](https://alembic.sqlalchemy.org/en/latest/)
    - [SQLAlchemy Documentation](https://docs.sqlalchemy.org/)
    - [Kestra Commands Plugin](https://kestra.io/plugins/plugin-scripts-shell/tasks/io.kestra.plugin.scripts.shell.commands)
    - [Kestra Fail Task](https://kestra.io/plugins/core/tasks/execution/io.kestra.plugin.core.execution.fail)
    - [Kestra Switch Task](https://kestra.io/plugins/core/tasks/flow/io.kestra.plugin.core.flow.switch)
  tags:
    - Infrastructure
  subTags:
    - CI/CD & Deployment
    - Approval Gates
  ee: false
  demo: false
