    - [Kestra n8n plugin](https://kestra.io/plugins/plugin-n8n)
    - [Kestra Slack notifications plugin](https://kestra.io/plugins/plugin-notifications)
    - [n8n webhook node documentation](https://docs.n8n.io/integrations/builtin/core-nodes/n8n-nodes-base.webhook/)
