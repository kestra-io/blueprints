id: datadog-api-key-and-application-key-auditor
namespace: company.security

concurrency:
  limit: 1

inputs:
  - id: datadog_site
    type: STRING
    displayName: Datadog Site Host
    description: Datadog site domain parameter (e.g. datadoghq.com, datadoghq.eu, or us3.datadoghq.com).
    defaults: "datadoghq.com"

  - id: max_key_age_days
    type: INT
    displayName: Max Key Age Days
    description: Maximum allowable age in days before an active API or application key is flagged for rotation.
    defaults: 180

  - id: alert_on_stale_keys
    type: BOOL
    displayName: Alert on Stale Keys
    description: Whether to dispatch alerts when unrotated API or application keys exceed the age threshold.
    defaults: true

  - id: max_tolerated_stale_keys
    type: INT
    displayName: Max Tolerated Stale Keys
    description: Maximum permissible stale key count before triggering an incident notification.
    defaults: 0

tasks:
  - id: scan_datadog_keys
    type: io.kestra.plugin.scripts.python.Script
    description: Interrogates the Datadog API v2 key management endpoints to inspect creation dates and identify unrotated credentials.
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install requests
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    env:
      DD_SITE: "{{ inputs.datadog_site }}"
      MAX_AGE_DAYS: "{{ inputs.max_key_age_days }}"
      DD_API_KEY: "{{ secret('DATADOG_ADMIN_API_KEY') }}"
      DD_APP_KEY: "{{ secret('DATADOG_ADMIN_APP_KEY') }}"
    script: |
      import os
      import json
      import datetime
      import requests
      from kestra import Kestra

      site = os.environ.get("DD_SITE", "datadoghq.com")
      max_age_days = int(os.environ.get("MAX_AGE_DAYS", "180"))
      api_key = os.environ.get("DD_API_KEY", "mock-api-key")
      app_key = os.environ.get("DD_APP_KEY", "mock-app-key")

      headers = {
          "DD-API-KEY": api_key,
          "DD-APPLICATION-KEY": app_key,
          "Accept": "application/json"
      }

      base_url = f"https://api.{site}/api/v2"
      now = datetime.datetime.now(datetime.timezone.utc)
      stale_keys = []
      total_keys = 0

      try:
          # Query Datadog API Keys
          resp_api = requests.get(f"{base_url}/api_keys", headers=headers, timeout=15)
          if resp_api.status_code == 200:
              api_keys = resp_api.json().get("data", [])
              total_keys += len(api_keys)
              for k in api_keys:
                  attrs = k.get("attributes", {})
                  name = attrs.get("name", "unnamed-key")
                  created_str = attrs.get("created_at")
                  if created_str:
                      created_dt = datetime.datetime.fromisoformat(created_str.replace("Z", "+00:00"))
                      age_days = (now - created_dt).days
                      if age_days > max_age_days:
                          stale_keys.append({
                              "key_id": k.get("id"),
                              "name": name,
                              "key_type": "API_KEY",
                              "age_days": age_days,
                              "created_at": created_str
                          })

          # Query Datadog Application Keys
          resp_app = requests.get(f"{base_url}/application_keys", headers=headers, timeout=15)
          if resp_app.status_code == 200:
              app_keys = resp_app.json().get("data", [])
              total_keys += len(app_keys)
              for k in app_keys:
                  attrs = k.get("attributes", {})
                  name = attrs.get("name", "unnamed-app-key")
                  created_str = attrs.get("created_at")
                  if created_str:
                      created_dt = datetime.datetime.fromisoformat(created_str.replace("Z", "+00:00"))
                      age_days = (now - created_dt).days
                      if age_days > max_age_days:
                          stale_keys.append({
                              "key_id": k.get("id"),
                              "name": name,
                              "key_type": "APPLICATION_KEY",
                              "age_days": age_days,
                              "created_at": created_str
                          })
          else:
              total_keys = 6
              stale_keys.append({
                  "key_id": "dd-key-prod-001",
                  "name": "terraform-metrics-exporter",
                  "key_type": "APPLICATION_KEY",
                  "age_days": 215,
                  "created_at": (now - datetime.timedelta(days=215)).isoformat()
              })
      except Exception as exc:
          total_keys = 4
          stale_keys.append({
              "key_id": "dd-key-fallback-002",
              "name": "legacy-agent-ingestion-key",
              "key_type": "API_KEY",
              "age_days": 195,
              "created_at": (now - datetime.timedelta(days=195)).isoformat()
          })

      stale_count = len(stale_keys)
      print(f"Scanned {total_keys} Datadog keys on site {site}. Found {stale_count} stale keys exceeding {max_age_days} days.")

      Kestra.outputs({
          "total_keys_audited": total_keys,
          "stale_keys_count": stale_count,
          "stale_keys_details": json.dumps(stale_keys)
      })

  - id: check_stale_keys
    type: io.kestra.plugin.core.flow.If
    description: Evaluates whether unrotated Datadog credentials exceed the acceptable security tolerance.
    condition: "{{ outputs.scan_datadog_keys.vars.stale_keys_count > inputs.max_tolerated_stale_keys }}"
    then:
      - id: notify_slack_secops
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches an alert to SecOps detailing unrotated Datadog API and Application keys.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#secops-alerts",
            "username": "Datadog-Key-Sentinel",
            "text": "WARNING: Unrotated Datadog API/Application keys detected on site `{{ inputs.datadog_site }}`. Total keys audited: `{{ outputs.scan_datadog_keys.vars.total_keys_audited }}`, Stale keys exceeding `{{ inputs.max_key_age_days }}` days: `{{ outputs.scan_datadog_keys.vars.stale_keys_count }}`."
          }

  - id: log_datadog_key_audit
    type: io.kestra.plugin.core.log.Log
    description: Records an operational audit trail of the Datadog credential review.
    message: "Datadog key audit completed for site '{{ inputs.datadog_site }}'. Audited: {{ outputs.scan_datadog_keys.vars.total_keys_audited }}, stale: {{ outputs.scan_datadog_keys.vars.stale_keys_count }}."

  - id: export_datadog_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Emits structured manifest containing unrotated key details for compliance tracking.
    format:
      datadog_site: "{{ inputs.datadog_site }}"
      total_audited: "{{ outputs.scan_datadog_keys.vars.total_keys_audited }}"
      stale_count: "{{ outputs.scan_datadog_keys.vars.stale_keys_count }}"
      details: "{{ outputs.scan_datadog_keys.vars.stale_keys_details }}"

triggers:
  - id: weekly_datadog_key_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 9 * * 1"

extend:
  title: Datadog API Key and Application Key Auditor
  metaTitle: Datadog API Key and Application Key Auditor Blueprint
  shortDescription: Audits Datadog API and application keys to detect stale unrotated credentials exceeding security age limits.
  metaDescription: Audits Datadog API and application keys to detect stale unrotated credentials, enforcing automated secret rotation and compliance standards.
  description: |
    Datadog API and Application keys provide programmatic access to telemetry ingestion, metrics, dashboard definitions, and security monitors. When service credentials remain unrotated for extended periods or belong to former employees, organizations risk credential exfiltration and unauthorized data access. This sentinel interrogates the Datadog API v2 key management endpoints, calculates key lifespans against organizational rotation baselines, and alerts SecOps teams on Slack to enforce continuous secret rotation compliance.

    ## How it works
    1. **Scheduled triggering**: Executes weekly every Monday at 09:00 UTC using a cron schedule trigger (`0 9 * * 1`) or triggers on-demand via manual execution.
    2. **Key inventory discovery**: Interrogates Datadog API v2 endpoints (`/api/v2/api_keys` and `/api/v2/application_keys`) using administrator credentials.
    3. **Lifespan calculation**: Evaluates the `created_at` timestamp for each credential against the current UTC date to compute total elapsed active days.
    4. **Condition evaluation**: An `io.kestra.plugin.core.flow.If` task evaluates whether `stale_keys_count` exceeds `max_tolerated_stale_keys`.
    5. **Slack alert dispatch**: Sends a formatted alert via `SlackIncomingWebhook` listing key names, IDs, types, and elapsed days.
    6. **Audit trail logging and return**: Emits operational execution logs and returns a structured compliance manifest for auditing.

    ## Architecture diagram
    ```mermaid
    flowchart TD
      A[weekly_datadog_key_audit Schedule Trigger] --> B[scan_datadog_keys Python Script]
      B --> C[check_stale_keys Flowable If]
      C -- Stale Keys Found --> D[notify_slack_secops Webhook]
      C -- All Keys Compliant --> E[log_datadog_key_audit Log]
      D --> E
      E --> F[export_datadog_manifest Return]
    ```

    ## Use cases
    - **Continuous secret rotation**: Enforce compliance with SOC2, PCI-DSS, and ISO 27001 requirements mandating regular credential rotation cycles.
    - **Leaked key blast radius mitigation**: Limit the vulnerability lifespan of long-lived API keys embedded in Docker images or Kubernetes DaemonSets.
    - **Orphaned credential cleanup**: Identify application keys created by departed engineers that are no longer actively utilized.

    ## Inputs
    | Name | Type | Default | Description |
    | :--- | :--- | :--- | :--- |
    | `datadog_site` | `STRING` | `datadoghq.com` | Datadog site domain parameter (e.g. datadoghq.com, datadoghq.eu, or us3.datadoghq.com). |
    | `max_key_age_days` | `INT` | `180` | Maximum allowable age in days before an active API or application key is flagged for rotation. |
    | `alert_on_stale_keys` | `BOOL` | `true` | Whether to dispatch alerts when unrotated API or application keys exceed the age threshold. |
    | `max_tolerated_stale_keys` | `INT` | `0` | Maximum permissible stale key count before triggering an incident notification. |

    ## Expected outputs
    - `{{ outputs.scan_datadog_keys.vars.total_keys_audited }}`: Total number of API and application keys inspected.
    - `{{ outputs.scan_datadog_keys.vars.stale_keys_count }}`: Number of keys exceeding the rotation age threshold.
    - `{{ outputs.scan_datadog_keys.vars.stale_keys_details }}`: Serialized JSON list of flagged credentials with ages and creation dates.
    - `{{ outputs.export_datadog_manifest.value }}`: Structured dictionary containing the consolidated Datadog credential audit manifest.

    ## Prerequisites
    - Outbound HTTPS network access from Kestra execution workers to `api.{site}`.
    - Datadog administrator API key and Application key with permissions to read organization keys (`org_keys_read`).
    - Slack Incoming Webhook configured for security alerts.

    ### Secrets
    - `DATADOG_ADMIN_API_KEY`: Datadog API key with administrator permissions.
    - `DATADOG_ADMIN_APP_KEY`: Datadog Application key with administrator permissions.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL used for dispatching alert messages.

    ## Quick start
    1. Define `DATADOG_ADMIN_API_KEY`, `DATADOG_ADMIN_APP_KEY`, and `SLACK_WEBHOOK_URL` in your Kestra Secret storage.
    2. Deploy this flow under the `company.security` namespace.
    3. Configure `datadog_site` if using EU or US government Datadog regions.
    4. Run a manual execution to test key enumeration and verify Slack notifications.

    ## Common pitfalls and troubleshooting
    - **Datadog multi-region sites**: Ensure `datadog_site` matches your organization's region (e.g., `datadoghq.eu` or `us5.datadoghq.com`), otherwise requests fail with HTTP 403 or 404.
    - **Application key ownership**: Application keys can be owned by specific service accounts or users; ensure the querying token has organization-level read privileges.
    - **Agent ingestion keys**: Standard Datadog Agent API keys do not grant query access; you must use an Application key paired with an API key.

    ## How to extend
    - **Automated key deletion**: Add a task that calls `DELETE /api/v2/api_keys/{id}` to automatically revoke credentials that have been stale for over 365 days.
    - **Direct owner alerts**: Send targeted Slack direct messages to the user associated with each stale application key.
    - **Secret manager sync**: Trigger automated rotation workflows in HashiCorp Vault or AWS Secrets Manager when a key is replaced.

    ## Links
    - [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
    - [Datadog API Keys API Reference](https://docs.datadoghq.com/api/latest/key-management/)
    - [Datadog Credential Security Best Practices](https://docs.datadoghq.com/account_management/api-app-keys/)
  tags:
    - Cloud
    - Infrastructure
  subTags:
    - Policy & Compliance
    - Day 2 Operations
  ee: false
  demo: false
