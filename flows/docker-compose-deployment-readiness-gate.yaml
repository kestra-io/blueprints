id: docker-compose-deployment-readiness-gate
namespace: company.infrastructure
description: |
  Audit a real Docker Compose deployment file before it reaches a server. The flow parses the
  Compose model, checks service references, and highlights risky host access, privileged
  containers, host networking, literal secrets, floating image tags, missing healthchecks and
  restart policies. It produces a machine-readable report and optionally fails a deployment gate
  when high-risk findings are present.

inputs:
  - id: compose_url
    type: STRING
    displayName: Public Compose YAML URL
    defaults: https://raw.githubusercontent.com/docker/awesome-compose/master/nginx-golang-mysql/compose.yaml
    description: HTTPS URL to a raw Compose YAML file hosted on raw.githubusercontent.com.
  - id: fail_on_high_risk
    type: BOOL
    displayName: Fail on high-risk findings
    defaults: true
    description: Finish in FAILED when privileged mode, host networking, host Docker socket access, literal secrets, or invalid service references are found.
  - id: warn_on_floating_images
    type: BOOL
    displayName: Warn on floating image references
    defaults: true
    description: Warn when an image reference uses no version tag or uses a latest tag instead of an immutable digest.
  - id: warn_on_missing_healthchecks
    type: BOOL
    displayName: Warn on missing healthchecks
    defaults: true
    description: Warn for services without a Compose healthcheck.
  - id: warn_on_missing_restart_policy
    type: BOOL
    displayName: Warn on missing restart policy
    defaults: false
    description: Warn for long-running services that do not declare a restart policy.
  - id: minimum_service_count
    type: INT
    displayName: Minimum service count
    defaults: 1
    description: Minimum number of services required in the Compose model.

triggers:
  - id: weekly_compose_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: Re-audit the configured public Compose file weekly. This trigger is disabled until the operator validates the initial findings.
    cron: "0 8 * * 1"
    disabled: true

tasks:
  - id: validate_request
    type: io.kestra.plugin.scripts.python.Script
    description: Validate input types, the service-count threshold, and the allowed raw GitHub host before fetching external content.
    containerImage: python:3.12-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    env:
      COMPOSE_URL: "{{ inputs.compose_url }}"
      MINIMUM_SERVICES: "{{ inputs.minimum_service_count }}"
    script: |
      import os
      from urllib.parse import urlsplit

      url = os.environ.get("COMPOSE_URL", "").strip()
      parsed = urlsplit(url)
      try:
          minimum = int(os.environ.get("MINIMUM_SERVICES", "1"))
      except ValueError as exc:
          raise ValueError("minimum_service_count must be an integer") from exc

      if parsed.scheme.lower() != "https" or parsed.hostname != "raw.githubusercontent.com":
          raise ValueError("compose_url must use HTTPS on raw.githubusercontent.com to avoid fetching arbitrary internal URLs")
      if parsed.username or parsed.password or parsed.port not in (None, 443):
          raise ValueError("compose_url must not contain embedded credentials or a non-standard port")
      if not parsed.path.endswith((".yaml", ".yml")):
          raise ValueError("compose_url must point to a .yaml or .yml file")
      if minimum < 1:
          raise ValueError("minimum_service_count must be at least one")

      print(f"Validated raw Compose URL and minimum_service_count={minimum}.")

  - id: fetch_compose_config
    type: io.kestra.plugin.core.http.Request
    description: Fetch the actual Compose YAML from the public source URL, rather than auditing a hard-coded example.
    uri: "{{ inputs.compose_url }}"
    method: GET
    headers:
      Accept: "text/plain, application/yaml, */*"
      User-Agent: Kestra-Compose-Deployment-Readiness-Gate/1.0
    timeout: PT30S

  - id: audit_compose_policy
    type: io.kestra.plugin.scripts.python.Script
    description: Parse the Compose model and create structured findings. High-risk findings are distinguished from advisory hardening opportunities.
    containerImage: python:3.12-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    dependencies:
      - kestra
      - pyyaml
    inputFiles:
      compose.yaml: "{{ outputs.fetch_compose_config.body }}"
    env:
      COMPOSE_URL: "{{ inputs.compose_url }}"
      MINIMUM_SERVICES: "{{ inputs.minimum_service_count }}"
      FAIL_ON_HIGH_RISK: "{{ inputs.fail_on_high_risk }}"
      WARN_FLOATING_IMAGES: "{{ inputs.warn_on_floating_images }}"
      WARN_MISSING_HEALTHCHECKS: "{{ inputs.warn_on_missing_healthchecks }}"
      WARN_MISSING_RESTART_POLICY: "{{ inputs.warn_on_missing_restart_policy }}"
    outputFiles:
      - compose-readiness-report.json
    script: |
      import json
      import os
      import re
      from datetime import datetime, timezone
      from urllib.parse import urlsplit

      import yaml
      from kestra import Kestra

      source_url = os.environ["COMPOSE_URL"]
      minimum_services = int(os.environ.get("MINIMUM_SERVICES", "1"))
      warn_floating = os.environ.get("WARN_FLOATING_IMAGES", "true").lower() == "true"
      warn_healthchecks = os.environ.get("WARN_MISSING_HEALTHCHECKS", "true").lower() == "true"
      warn_restart = os.environ.get("WARN_MISSING_RESTART_POLICY", "false").lower() == "true"

      with open("compose.yaml", encoding="utf-8") as source:
          raw_yaml = source.read()
      try:
          compose = yaml.safe_load(raw_yaml)
      except yaml.YAMLError as exc:
          raise ValueError(f"Compose source is not valid YAML: {exc}") from exc
      if not isinstance(compose, dict):
          raise ValueError("Compose YAML must parse to a mapping.")
      services = compose.get("services")
      if not isinstance(services, dict) or not services:
          raise ValueError("Compose YAML must define a non-empty services mapping.")
      if len(services) < minimum_services:
          raise ValueError(f"Compose file defines {len(services)} service(s), below minimum_service_count={minimum_services}.")

      declared_volumes = compose.get("volumes") or {}
      declared_secrets = compose.get("secrets") or {}
      declared_configs = compose.get("configs") or {}
      if not isinstance(declared_volumes, dict):
          raise ValueError("Top-level volumes must be a mapping.")
      if not isinstance(declared_secrets, dict):
          raise ValueError("Top-level secrets must be a mapping.")
      if not isinstance(declared_configs, dict):
          raise ValueError("Top-level configs must be a mapping.")

      findings = []
      def add(severity, code, service, message):
          findings.append({
              "severity": severity,
              "code": code,
              "service": service,
              "message": message,
          })

      secret_key_pattern = re.compile(r"(?:PASS(?:WORD)?|TOKEN|SECRET|API[_-]?KEY|PRIVATE[_-]?KEY)", re.IGNORECASE)
      sensitive_stateful_pattern = re.compile(r"(?:^|[-_])(db|database|mysql|mariadb|postgres|postgresql|redis|mongo|mongodb|elasticsearch)(?:$|[-_])", re.IGNORECASE)
      services_with_healthchecks = {
          name for name, config in services.items()
          if isinstance(config, dict) and isinstance(config.get("healthcheck"), dict)
      }

      for service_name, service in services.items():
          if not isinstance(service, dict):
              add("BLOCK", "SERVICE_CONFIG_INVALID", str(service_name), "Service configuration must be a mapping.")
              continue

          image = service.get("image")
          if isinstance(image, str) and image.strip() and warn_floating:
              image_ref = image.strip()
              if "@sha256:" not in image_ref:
                  last_component = image_ref.rsplit("/", 1)[-1]
                  has_tag = ":" in last_component
                  tag = last_component.rsplit(":", 1)[1] if has_tag else ""
                  if not has_tag or tag.lower() in {"latest", "stable", "edge", "main", "master"}:
                      add("WARN", "FLOATING_IMAGE_REFERENCE", service_name, f"Image '{image_ref}' is not pinned to an immutable digest and uses no explicit version tag or a floating tag.")

          if service.get("privileged") is True:
              add("BLOCK", "PRIVILEGED_CONTAINER", service_name, "privileged: true grants the container broad host-level capabilities.")
          if str(service.get("network_mode", "")).strip().lower() == "host":
              add("BLOCK", "HOST_NETWORK_MODE", service_name, "host networking removes network namespace isolation.")

          cap_add = service.get("cap_add") or []
          if not isinstance(cap_add, list):
              cap_add = [cap_add]
          dangerous_caps = sorted({
              str(cap).upper().replace("CAP_", "")
              for cap in cap_add
              if str(cap).upper().replace("CAP_", "") in {"SYS_ADMIN", "SYS_MODULE", "SYS_PTRACE", "NET_ADMIN"}
          })
          if dangerous_caps:
              add("WARN", "DANGEROUS_CAPABILITIES", service_name, "Review added Linux capabilities: " + ", ".join(dangerous_caps) + ".")

          volumes = service.get("volumes") or []
          if not isinstance(volumes, list):
              add("WARN", "VOLUME_FORMAT_UNEXPECTED", service_name, "Volumes is not a list, so host-mount checks were incomplete.")
              volumes = []
          for mount in volumes:
              source_ref = ""
              target_ref = ""
              read_only = False
              if isinstance(mount, str):
                  pieces = mount.split(":")
                  source_ref = pieces[0].strip()
                  if len(pieces) >= 2:
                      target_ref = pieces[1].strip()
                  if len(pieces) >= 3:
                      read_only = "ro" in pieces[2].split(",")
              elif isinstance(mount, dict):
                  source_ref = str(mount.get("source") or "").strip()
                  target_ref = str(mount.get("target") or "").strip()
                  read_only = bool(mount.get("read_only", False))
              else:
                  continue

              normalized_source = source_ref.replace("\\", "/")
              if normalized_source in {"/var/run/docker.sock", "/run/docker.sock", "/var/run"} or normalized_source.startswith("/var/run/docker.sock/"):
                  add("BLOCK", "HOST_DOCKER_SOCKET_MOUNT", service_name, f"Mount '{source_ref}' gives the container access to the host Docker socket/runtime.")
              if normalized_source == "/" and not read_only:
                  add("BLOCK", "HOST_ROOT_MOUNT_WRITABLE", service_name, "A writable host-root bind mount gives the container broad access to host files.")
              if target_ref in {"/var/run/docker.sock", "/run/docker.sock"}:
                  add("BLOCK", "DOCKER_SOCKET_TARGET_MOUNT", service_name, "A mount targets the Docker socket path inside the container.")

              if source_ref and not source_ref.startswith((".", "/", "~")) and ":" not in source_ref:
                  if source_ref not in declared_volumes:
                      add("BLOCK", "UNDECLARED_NAMED_VOLUME", service_name, f"Named volume '{source_ref}' is used but not declared at the top level.")

          environment = service.get("environment") or {}
          env_items = []
          if isinstance(environment, dict):
              env_items = [(str(k), v) for k, v in environment.items()]
          elif isinstance(environment, list):
              for entry in environment:
                  if isinstance(entry, str) and "=" in entry:
                      key, value = entry.split("=", 1)
                      env_items.append((key.strip(), value.strip()))
          else:
              add("WARN", "ENVIRONMENT_FORMAT_UNEXPECTED", service_name, "Environment is not a mapping or list; literal-secret checks were incomplete.")

          for key, raw_value in env_items:
              value = "" if raw_value is None else str(raw_value).strip()
              key_upper = key.upper()
              if not secret_key_pattern.search(key_upper) or not value:
                  continue
              external_reference = (
                  key_upper.endswith("_FILE")
                  or value.startswith("$")
                  or value.startswith("$" + "{")
                  or value.startswith("/run/secrets/")
                  or value.startswith("{" + "{ secret(")
                  or value.startswith("{" + "{secret(")
              )
              if not external_reference:
                  add("BLOCK", "LITERAL_SECRET_ENVIRONMENT_VALUE", service_name, f"Environment key '{key}' appears to contain a literal secret. Prefer a Compose secret, environment interpolation, or a *_FILE pattern.")

          service_secrets = service.get("secrets") or []
          if isinstance(service_secrets, list):
              for ref in service_secrets:
                  secret_name = str(ref.get("source") if isinstance(ref, dict) else ref)
                  if secret_name not in declared_secrets:
                      add("BLOCK", "UNDECLARED_SECRET_REFERENCE", service_name, f"Service references secret '{secret_name}' which is not declared at the top level.")
          elif isinstance(service_secrets, dict):
              for alias, ref in service_secrets.items():
                  secret_name = str((ref or {}).get("source", alias)) if isinstance(ref, dict) else str(alias)
                  if secret_name not in declared_secrets:
                      add("BLOCK", "UNDECLARED_SECRET_REFERENCE", service_name, f"Service references secret '{secret_name}' which is not declared at the top level.")

          service_configs = service.get("configs") or []
          if isinstance(service_configs, list):
              for ref in service_configs:
                  config_name = str(ref.get("source") if isinstance(ref, dict) else ref)
                  if config_name not in declared_configs:
                      add("BLOCK", "UNDECLARED_CONFIG_REFERENCE", service_name, f"Service references config '{config_name}' which is not declared at the top level.")

          dependencies = service.get("depends_on") or {}
          if isinstance(dependencies, list):
              dependency_names = [str(dep) for dep in dependencies]
              dependency_conditions = {}
          elif isinstance(dependencies, dict):
              dependency_names = [str(dep) for dep in dependencies.keys()]
              dependency_conditions = dependencies
          else:
              dependency_names = []
              dependency_conditions = {}
          for dependency in dependency_names:
              if dependency not in services:
                  add("BLOCK", "UNDECLARED_SERVICE_DEPENDENCY", service_name, f"depends_on references service '{dependency}' which is not defined.")
              else:
                  condition = dependency_conditions.get(dependency)
                  if isinstance(condition, dict) and condition.get("condition") == "service_healthy" and dependency not in services_with_healthchecks:
                      add("WARN", "HEALTHY_DEPENDENCY_WITHOUT_HEALTHCHECK", service_name, f"depends_on waits for '{dependency}' to be healthy, but that service has no healthcheck.")

          ports = service.get("ports") or []
          if isinstance(ports, list) and sensitive_stateful_pattern.search(str(service_name)):
              for port in ports:
                  if isinstance(port, dict):
                      published = str(port.get("published") or "").strip()
                      host_ip = str(port.get("host_ip") or "").strip()
                  elif isinstance(port, (str, int)):
                      pieces = str(port).split(":")
                      published = pieces[-2] if len(pieces) >= 2 else ""
                      host_ip = pieces[0] if len(pieces) >= 3 else ""
                  else:
                      continue
                  if published and host_ip not in {"127.0.0.1", "::1", "localhost"}:
                      add("WARN", "STATEFUL_SERVICE_PUBLISHED_PORT", service_name, f"Stateful service publishes host port {published}; bind it to loopback or keep it on an internal network unless external access is required.")

          if warn_healthchecks and not isinstance(service.get("healthcheck"), dict):
              add("WARN", "MISSING_HEALTHCHECK", service_name, "Service has no healthcheck; orchestration cannot verify application-level readiness.")
          if warn_restart and not service.get("restart"):
              add("WARN", "MISSING_RESTART_POLICY", service_name, "Service has no explicit restart policy.")

      blocking = [finding for finding in findings if finding["severity"] == "BLOCK"]
      warnings = [finding for finding in findings if finding["severity"] == "WARN"]
      verdict = "BLOCK" if blocking else ("PASS_WITH_WARNINGS" if warnings else "PASS")
      report = {
          "schemaVersion": 1,
          "checkedAt": datetime.now(timezone.utc).isoformat(),
          "sourceUrl": source_url,
          "serviceCount": len(services),
          "serviceNames": list(services.keys()),
          "declaredVolumeCount": len(declared_volumes),
          "declaredSecretCount": len(declared_secrets),
          "declaredConfigCount": len(declared_configs),
          "blockingFindingCount": len(blocking),
          "warningCount": len(warnings),
          "verdict": verdict,
          "findings": findings,
          "scopeNote": "This gate audits Compose YAML structure and common deployment-hardening hazards. It does not replace docker compose config, image scanning, or runtime validation.",
      }
      with open("compose-readiness-report.json", "w", encoding="utf-8") as target:
          json.dump(report, target, indent=2, ensure_ascii=False)

      print(f"Compose readiness audit: services={len(services)}, verdict={verdict}, blocking={len(blocking)}, warnings={len(warnings)}")
      Kestra.outputs({
          "source_url": source_url,
          "service_count": len(services),
          "service_names": list(services.keys()),
          "blocking_finding_count": len(blocking),
          "warning_count": len(warnings),
          "verdict": verdict,
          "findings": findings,
      })

  - id: enforce_readiness_policy
    type: io.kestra.plugin.core.flow.If
    description: Fail closed when high-risk findings exist and the input policy enables enforcement; otherwise keep the report available for remediation planning.
    condition: "{{ inputs.fail_on_high_risk and outputs.audit_compose_policy.vars.verdict == 'BLOCK' }}"
    then:
      - id: fail_readiness_gate
        type: io.kestra.plugin.core.execution.Fail
        description: Stop downstream deployment workflows when high-risk Compose findings require remediation.
        errorMessage: "Docker Compose readiness gate blocked: {{ outputs.audit_compose_policy.vars.blocking_finding_count }} high-risk finding(s). Review compose-readiness-report.json and the audit task output."
    else:
      - id: log_readiness_verdict
        type: io.kestra.plugin.core.log.Log
        level: INFO
        message: "Compose readiness audit {{ outputs.audit_compose_policy.vars.verdict }} for {{ inputs.compose_url }}; services={{ outputs.audit_compose_policy.vars.service_count }}, blocking={{ outputs.audit_compose_policy.vars.blocking_finding_count }}, warnings={{ outputs.audit_compose_policy.vars.warning_count }}."

extend:
  title: Docker Compose Deployment Readiness Gate
  metaTitle: Docker Compose Deployment Readiness Gate | Kestra
  shortDescription: Inspect a real Docker Compose file for privileged containers, host access, plaintext secrets, invalid service references, floating image tags, and missing readiness safeguards.
  metaDescription: Audit Compose YAML for privileged services, host Docker socket mounts, literal secrets, dangling dependencies, floating images, and readiness safeguards before deployment.
  description: |
    Validate a Docker Compose file before deploying it on a server. The workflow fetches public Compose YAML, parses its service graph, checks service dependencies and declared secrets/configs/volumes, and identifies risky host access such as privileged containers, host networking, writable host-root mounts, and Docker socket exposure. It also flags literal secret-like environment values, floating image references, missing healthchecks, and exposed ports on stateful services. A JSON report records evidence; high-risk findings can block downstream deployment.

    ## How it works

    1. The validation task restricts the input to a public HTTPS raw GitHub YAML file, preventing credentials in the URL and arbitrary private-host targets.
    2. The HTTP Request task fetches the actual Compose document from that source.
    3. The Python policy task parses the YAML and inventories services, volumes, secrets, configs and declared dependencies.
    4. High-risk checks flag privileged mode, host networking, Docker socket and writable host-root mounts, literal secret values, undefined services, and missing declarations.
    5. Advisory checks identify floating image references, missing healthchecks, optional restart-policy gaps, and published stateful-service ports.
    6. The final If gate optionally fails the run when blocking findings are present, while keeping the JSON report in task outputs.

    ## What you get

    - A JSON report with service names, source URL, warning/block counts, and each finding's code and rationale.
    - Early detection of dangerous Compose host access and literal secrets before deploying a stack.
    - Checks for dangling service, volume, secret, and config references.
    - Optional enforcement mode for downstream deployment gating.

    ## Who it's for

    - Platform engineers reviewing Compose stacks used for development, test or small production hosts.
    - DevOps and SRE teams maintaining multi-container services.
    - Security engineers standardizing safe Compose conventions across repositories.

    ## Why orchestrate this with Kestra

    The workflow brings configuration audit, evidence retention and deployment gating into one visible execution. Teams can schedule re-audits, tune policy inputs per repository, and gate downstream rollout flows on the recorded verdict instead of maintaining separate ad-hoc scripts.

    ## Prerequisites

    - A Kestra 2.x worker with Docker enabled for Python Script tasks.
    - Network access to raw.githubusercontent.com.
    - The Python script runner can install PyYAML and the Kestra outputs helper into its isolated container.
    - The optional weekly trigger should remain disabled until the configured file and findings have been reviewed.

    ### Secrets

    - No secrets are needed for the default audit of a public Compose file. If a private repository is needed, mirror the configuration to an approved public/raw source or extend the flow with a supported authenticated source rather than embedding credentials in the URL.

    ## Quick start

    1. Import the flow and leave compose_url at the default public Docker Compose sample.
    2. Execute the flow and inspect the audit_compose_policy task output plus compose-readiness-report.json.
    3. Review any BLOCK finding before deployment and apply the minimal mitigation to the Compose file.
    4. Keep fail_on_high_risk enabled if a blocking finding must prevent downstream deployment.
    5. Enable weekly_compose_audit only after validating the source URL and desired warning policy.

    ## How to extend

    - Add repository-specific rules for image digests, read-only root filesystems, resource reservations, and approved published ports.
    - Run docker compose config and an image scanner in separate tasks to complement the structural checks.
    - Upload the JSON report to S3 or attach a summary to a deployment approval workflow.
    - Trigger the flow from CI when a compose file changes, while keeping source validation restricted to approved raw content hosts.

    ## Links

    - [Compose Specification](https://compose-spec.io/)
    - [Docker Compose configuration reference](https://docs.docker.com/reference/compose-file/)
    - [Docker Compose secrets](https://docs.docker.com/compose/how-tos/use-secrets/)
    - [Kestra Python Script plugin](https://kestra.io/plugins/plugin-scripts/python)
    - [Kestra HTTP Request plugin](https://kestra.io/plugins/plugin-core/http/io.kestra.plugin.core.http.request)
  tags:
    - Infrastructure
  subTags:
    - CI/CD & Deployment
    - Infrastructure Automation
  ee: false
  demo: false
