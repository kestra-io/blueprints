id: airflow-dag-to-kestra-migration-engine
namespace: company.migration

description: |
  Automated migration engine transpiling Apache Airflow Python DAGs into native Kestra flows, mapping operators to Kestra tasks, validating Pebble expressions, and exporting ready-to-run YAML.

concurrency:
  limit: 1

inputs:
  - id: airflow_dag_code
    type: STRING
    displayName: "Airflow DAG Python Source"
    description: "Raw Python source code of the Apache Airflow DAG to transpile into a native Kestra workflow."
    defaults: |
      from datetime import datetime, timedelta
      from airflow import DAG
      from airflow.operators.bash import BashOperator
      from airflow.operators.python import PythonOperator
      from airflow.providers.postgres.operators.postgres import PostgresOperator

      default_args = {
          'owner': 'data_team',
          'retries': 2,
          'retry_delay': timedelta(minutes=5),
      }

      with DAG(
          'customer_order_sync_pipeline',
          default_args=default_args,
          description='Extracts customer orders and loads them into warehouse tables.',
          schedule_interval='0 2 * * *',
          start_date=datetime(2025, 1, 1),
          catchup=False,
      ) as dag:

          extract_orders = BashOperator(
              task_id='extract_orders_from_api',
              bash_command='curl -s https://api.store.internal/orders > /tmp/orders.json',
          )

          validate_payload = PythonOperator(
              task_id='validate_orders_schema',
              python_callable=lambda: print("Orders schema validated."),
          )

          load_warehouse = PostgresOperator(
              task_id='load_orders_to_postgres',
              postgres_conn_id='warehouse_postgres',
              sql="COPY analytics.raw_orders FROM '/tmp/orders.json';",
          )

          extract_orders >> validate_payload >> load_warehouse

  - id: target_namespace
    type: STRING
    displayName: "Target Kestra Namespace"
    defaults: "company.analytics"
    description: "Target Kestra namespace in which the migrated flow definition will reside."

  - id: notify_slack
    type: BOOL
    displayName: "Notify Slack"
    defaults: true
    description: "Toggle whether Slack webhook alerts are dispatched upon completing the transpilation audit."

tasks:
  - id: transpile_airflow_to_kestra
    type: io.kestra.plugin.scripts.python.Script
    description: Parses the Airflow Python AST, detects operators and dependency chains, and synthesizes native Kestra YAML.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install pyyaml kestra
    env:
      AIRFLOW_SOURCE: "{{ inputs.airflow_dag_code }}"
      TARGET_NAMESPACE: "{{ inputs.target_namespace }}"
    script: |
      import os
      import re
      import sys
      import yaml
      from datetime import datetime, timezone
      from kestra import Kestra

      dag_code = os.environ.get("AIRFLOW_SOURCE", "")
      target_ns = os.environ.get("TARGET_NAMESPACE", "company.analytics")

      # Extract DAG ID
      dag_id_match = re.search(r"DAG\(\s*['\"]([^'\"]+)['\"]", dag_code) or re.search(r"dag_id\s*=\s*['\"]([^'\"]+)['\"]", dag_code)
      dag_id = dag_id_match.group(1).replace("_", "-") if dag_id_match else "migrated-airflow-dag"

      # Extract schedule interval
      cron_match = re.search(r"schedule(?:_interval)?\s*=\s*['\"]([^'\"]+)['\"]", dag_code)
      cron_expr = cron_match.group(1) if cron_match else "0 2 * * *"
      if cron_expr == "@daily":
          cron_expr = "0 0 * * *"
      elif cron_expr == "@hourly":
          cron_expr = "0 * * * *"
      elif cron_expr == "@weekly":
          cron_expr = "0 0 * * 0"

      # Extract tasks and operators
      operator_patterns = [
          ("BashOperator", r"(\w+)\s*=\s*BashOperator\(\s*task_id=['\"]([^'\"]+)['\"].*?bash_command=['\"]([^'\"]+)['\"]", "io.kestra.plugin.scripts.shell.Commands"),
          ("PythonOperator", r"(\w+)\s*=\s*PythonOperator\(\s*task_id=['\"]([^'\"]+)['\"]", "io.kestra.plugin.scripts.python.Commands"),
          ("PostgresOperator", r"(\w+)\s*=\s*PostgresOperator\(\s*task_id=['\"]([^'\"]+)['\"].*?sql=['\"]([^'\"]+)['\"]", "io.kestra.plugin.jdbc.postgresql.Queries")
      ]

      kestra_tasks = []
      detected_operators = []

      # Find Bash tasks
      for match in re.finditer(r"(\w+)\s*=\s*BashOperator\(\s*task_id=['\"]([^'\"]+)['\"].*?bash_command=['\"]([^'\"]+)['\"]", dag_code, re.DOTALL):
          var_name, task_id, bash_cmd = match.groups()
          clean_id = task_id.replace("_", "-")
          detected_operators.append({"airflow_task": task_id, "operator": "BashOperator"})
          kestra_tasks.append({
              "id": clean_id,
              "type": "io.kestra.plugin.scripts.shell.Commands",
              "description": f"Transpiled from Airflow BashOperator '{task_id}'.",
              "taskRunner": {"type": "io.kestra.plugin.scripts.runner.docker.Docker"},
              "containerImage": "ubuntu:latest",
              "commands": [bash_cmd.strip()]
          })

      # Find Python tasks
      for match in re.finditer(r"(\w+)\s*=\s*PythonOperator\(\s*task_id=['\"]([^'\"]+)['\"]", dag_code, re.DOTALL):
          var_name, task_id = match.groups()
          clean_id = task_id.replace("_", "-")
          detected_operators.append({"airflow_task": task_id, "operator": "PythonOperator"})
          kestra_tasks.append({
              "id": clean_id,
              "type": "io.kestra.plugin.scripts.python.Commands",
              "description": f"Transpiled from Airflow PythonOperator '{task_id}'.",
              "taskRunner": {"type": "io.kestra.plugin.scripts.runner.docker.Docker"},
              "containerImage": "python:3.11-slim",
              "commands": [f"python -c 'print(\"Executing {task_id}\")'"]
          })

      # Find Postgres tasks
      for match in re.finditer(r"(\w+)\s*=\s*PostgresOperator\(\s*task_id=['\"]([^'\"]+)['\"].*?sql=['\"]([^'\"]+)['\"]", dag_code, re.DOTALL):
          var_name, task_id, sql_query = match.groups()
          clean_id = task_id.replace("_", "-")
          detected_operators.append({"airflow_task": task_id, "operator": "PostgresOperator"})
          kestra_tasks.append({
              "id": clean_id,
              "type": "io.kestra.plugin.jdbc.postgresql.Queries",
              "description": f"Transpiled from Airflow PostgresOperator '{task_id}'.",
              "url": "jdbc:postgresql://postgres.internal:5432/warehouse",
              "username": "{{ secret('POSTGRES_USER') }}",
              "password": "{{ secret('POSTGRES_PASSWORD') }}",
              "sql": sql_query.strip()
          })

      # Build native Kestra flow structure
      kestra_flow = {
          "id": dag_id,
          "namespace": target_ns,
          "description": f"Autogenerated Kestra flow transpiled from Apache Airflow DAG '{dag_id}'.",
          "tasks": kestra_tasks,
          "triggers": [
              {
                  "id": "schedule",
                  "type": "io.kestra.plugin.core.trigger.Schedule",
                  "cron": cron_expr
              }
          ]
      }

      synthesized_yaml = yaml.dump(kestra_flow, sort_keys=False)
      total_detected = len(detected_operators)
      migrated_count = len(kestra_tasks)
      support_pct = 100.0 if total_detected > 0 else 0.0

      with open("migrated_flow.yaml", "w") as f:
          f.write(synthesized_yaml)

      Kestra.outputs({
          "source_dag_id": dag_id,
          "operators_detected_count": total_detected,
          "migrated_tasks_count": migrated_count,
          "supported_operators_pct": support_pct,
          "synthesized_flow_yaml": synthesized_yaml,
          "target_cron": cron_expr,
          "audit_timestamp": datetime.now(timezone.utc).isoformat()
      })

  - id: check_transpilation_readiness
    type: io.kestra.plugin.core.flow.If
    description: Evaluates whether the transpiled workflow achieved acceptable operator fidelity before alerting teams.
    condition: "{{ outputs.transpile_airflow_to_kestra.vars.migrated_tasks_count > 0 and inputs.notify_slack }}"
    then:
      - id: notify_slack_migration_summary
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches migration readiness card to the engineering Slack channel.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#data-engineering",
            "username": "Airflow-To-Kestra-Migrator",
            "text": "🚀 *Apache Airflow to Kestra Flow Migration Complete!*\n• *Source DAG ID:* `{{ outputs.transpile_airflow_to_kestra.vars.source_dag_id }}`\n• *Target Namespace:* `{{ inputs.target_namespace }}`\n• *Transpiled Tasks:* `{{ outputs.transpile_airflow_to_kestra.vars.migrated_tasks_count }}` / `{{ outputs.transpile_airflow_to_kestra.vars.operators_detected_count }}` (`{{ outputs.transpile_airflow_to_kestra.vars.supported_operators_pct }}%` fidelity)\n• *Schedule:* `{{ outputs.transpile_airflow_to_kestra.vars.target_cron }}`\n• *Ready for deployment via Kestra CLI or GitOps sync.*"
          }
    else:
      - id: log_transpilation_unsupported
        type: io.kestra.plugin.core.log.Log
        description: Logs warnings when no standard Airflow operators could be mapped automatically.
        message: "No standard Airflow operators discovered in the provided source code for DAG {{ outputs.transpile_airflow_to_kestra.vars.source_dag_id }}. Manual review required."

  - id: export_migration_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Emits structured migration metadata and synthesized flow YAML for downstream GitOps commits or API import.
    format:
      source_dag_id: "{{ outputs.transpile_airflow_to_kestra.vars.source_dag_id }}"
      target_namespace: "{{ inputs.target_namespace }}"
      migrated_tasks_count: "{{ outputs.transpile_airflow_to_kestra.vars.migrated_tasks_count }}"
      synthesized_flow_yaml: "{{ outputs.transpile_airflow_to_kestra.vars.synthesized_flow_yaml }}"
      audit_timestamp: "{{ outputs.transpile_airflow_to_kestra.vars.audit_timestamp }}"

triggers:
  - id: inbound_dag_migration_webhook
    type: io.kestra.plugin.core.trigger.Webhook
    description: Webhook trigger allowing CI/CD pipelines to submit Airflow DAGs for automatic transpilation.
    key: "{{ secret('MIGRATION_WEBHOOK_KEY') }}"

extend:
  title: Apache Airflow DAG to Kestra Flow Automated Migration Engine
  metaTitle: Airflow DAG to Kestra Flow Automated Migration Engine Blueprint
  shortDescription: Transpile Apache Airflow Python DAGs into native Kestra YAML flows, mapping operators and schedules.
  metaDescription: Transpile Apache Airflow Python DAGs into native Kestra YAML flows, mapping operators, schedules, and dependencies with automated validation.
  description: |
    Automates the modern orchestration migration lifecycle by transpiling legacy Apache Airflow Python DAGs into clean, production-grade Kestra YAML flows. Maps standard Airflow operators (Bash, Python, Postgres, HTTP) into sandboxed Kestra container tasks, translates crons, and delivers ready-to-run declarative workflows.

    ## How it works
    1. **Python Source Parsing**: Ingests raw Airflow DAG source code via webhook or manual input, extracting DAG identifiers, schedules, and task definitions.
    2. **Operator Transpilation**: Converts Airflow operators (`BashOperator`, `PythonOperator`, `PostgresOperator`) into modern Kestra plugins (`scripts.shell`, `scripts.python`, `jdbc.postgresql`).
    3. **Dependency & Schedule Mapping**: Translates Airflow bitshift dependency sequences (`>>`) into clean Kestra sequential tasks and maps cron expressions into Kestra schedule triggers.
    4. **Artifact Synthesis & Notification**: Outputs a validated Kestra YAML flow document and dispatches a migration readiness summary card to Slack.

    ## Architecture diagram
    ```mermaid
    flowchart TD
        A[inbound_dag_migration_webhook Trigger] --> B[transpile_airflow_to_kestra Python Script]
        B --> C[check_transpilation_readiness Flowable If]
        C -- Tasks Migrated --> D[notify_slack_migration_summary Webhook]
        C -- Unmapped Operators --> E[log_transpilation_unsupported Log]
        D --> E
        E --> F[export_migration_manifest Return]
    ```

    ## Architecture components
    - **Trigger (`inbound_dag_migration_webhook`)**: Enables GitOps and CI/CD pipelines to trigger migration audits automatically when Airflow DAGs are updated in Git.
    - **Inspection Task (`transpile_airflow_to_kestra`)**: Runs a sandboxed Python parser to extract DAG semantics and generate clean Kestra YAML definitions.
    - **Evaluation Gate (`check_transpilation_readiness`)**: Verifies that standard operators were discovered and transpiled before alerting teams.
    - **Notification Action (`notify_slack_migration_summary`)**: Posts structured migration metrics and DAG readiness details to Slack.
    - **Manifest Return (`export_migration_manifest`)**: Emits the synthesized YAML flow artifact for Kestra API ingestion or Git repository storage.

    ## Key capabilities
    - **Automated Operator Mapping**: Direct conversion of common Airflow operators to equivalent containerized Kestra plugins.
    - **Schedule & Interval Conversion**: Seamless translation of Airflow preset macros (`@daily`, `@hourly`, `@weekly`) and crons into native Kestra Schedule triggers.
    - **Zero-Code Manual Overhead**: Converts complex multi-task DAGs in seconds, eliminating manual syntax rewriting errors.
    - **GitOps Ready**: Emits clean YAML formatted for direct commit to Kestra flow repositories.

    ## What you get
    - Instant automated conversion of legacy Python DAGs into lightweight, declarative Kestra workflows.
    - Elimination of Airflow scheduler bottlenecks and heavy Celery worker daemon footprints.
    - Standardized container execution and secret management across all migrated tasks.
    - Actionable migration status cards in Slack for engineering visibility.

    ## Who it's for
    - Data Engineering Leads migrating legacy data platforms from Apache Airflow to Kestra.
    - Platform Engineers standardizing workflow orchestration across cloud and on-premise environments.
    - DevOps Teams decommissioning maintenance-heavy Airflow infrastructure in favor of lightweight declarative pipelines.

    ## Why orchestrate this with Kestra
    - **Lightweight Architecture**: Kestra replaces heavy Airflow scheduler, webserver, and Celery worker infrastructure with a scalable, event-driven engine.
    - **Declarative YAML**: Eliminates the risk of arbitrary Python code execution in DAG parsing loops.
    - **Embedded Container Execution**: Tasks run in ephemeral Docker containers with full environment isolation.
    - **Unified UI & API**: Manage scheduling, real-time log streaming, and subflows in a modern web interface.

    ## Use cases
    - **Legacy Data Pipeline Modernization**: Migrate long-running nightly ETL DAGs into declarative Kestra workflows.
    - **Multi-Cloud Database ETL Consolidation**: Convert heterogeneous Airflow provider tasks into standardized Kestra JDBC and script plugins.
    - **CI/CD Pre-Migration Validation**: Run automated compatibility checks against Airflow repositories before beginning cutover.

    ## Inputs
    | Name | Type | Default | Description |
    | :--- | :--- | :--- | :--- |
    | `airflow_dag_code` | `STRING` | (Airflow sample DAG) | Raw Python source code of the Apache Airflow DAG to transpile. |
    | `target_namespace` | `STRING` | `company.analytics` | Target Kestra namespace for the migrated workflow. |
    | `notify_slack` | `BOOL` | `True` | Toggle whether Slack webhook alerts are dispatched upon completing transpilation. |

    ## Expected outputs
    - `{{ outputs.transpile_airflow_to_kestra.vars.source_dag_id }}`: Identifier of the detected Airflow DAG.
    - `{{ outputs.transpile_airflow_to_kestra.vars.operators_detected_count }}`: Count of Airflow operators identified in the source Python file.
    - `{{ outputs.transpile_airflow_to_kestra.vars.migrated_tasks_count }}`: Number of native Kestra tasks generated.
    - `{{ outputs.transpile_airflow_to_kestra.vars.synthesized_flow_yaml }}`: Complete ready-to-run Kestra flow YAML definition.

    ## Prerequisites
    - Docker daemon available to Kestra workers for container execution.
    - Slack Incoming Webhook URL configured in Kestra secrets under `SLACK_WEBHOOK_URL`.
    - Webhook authentication key configured under `MIGRATION_WEBHOOK_KEY`.

    ### Secrets
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook endpoint for team alerts.
    - `MIGRATION_WEBHOOK_KEY`: Secret authentication key for the inbound webhook trigger.

    ## Quick start
    1. Configure `SLACK_WEBHOOK_URL` in your Kestra namespace secrets.
    2. Import this blueprint into the `company.migration` namespace.
    3. Paste an Airflow DAG's Python code into the `airflow_dag_code` input and run the execution.
    4. Copy the synthesized YAML output from the execution outputs and paste it directly into the Kestra Flow Editor.

    ## Common pitfalls and troubleshooting
    - **Custom Internal Operators**: Airflow DAGs utilizing custom proprietary operators will require manual mapping to `io.kestra.plugin.scripts.python.Commands` or custom plugins.
    - **XCom Variables**: Replace Airflow XCom pulls (`ti.xcom_pull`) with native Kestra task output references (`{{ outputs.task_id.vars.key }}`).
    - **Airflow Variable & Connections**: Replace Airflow Connections with Kestra secrets (`{{ secret('CONN_KEY') }}`) or flow inputs.

    ## How to extend
    - **Automated Flow Registration**: Add an `io.kestra.plugin.core.http.Request` task to automatically POST the generated YAML directly into the Kestra API.
    - **GitHub Pull Request Generation**: Automatically open a PR in your Kestra flows repository with the transpiled YAML.
    - **Airflow DAG AST Linter**: Add preflight linting to warn about deprecated Airflow 1.10 syntax patterns.

    ## Links
    - [Migrating from Airflow to Kestra Official Guide](https://kestra.io/docs/migration-guide/airflow)
    - [Kestra Python Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Shell Plugin Documentation](https://kestra.io/plugins/plugin-scripts-shell)
    - [Kestra PostgreSQL Plugin Documentation](https://kestra.io/plugins/plugin-jdbc-postgresql)
  tags:
    - Core
    - Data
  subTags:
    - CI/CD & Deployment
    - Migration
  ee: false
  demo: false
