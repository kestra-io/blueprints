id: redis-streams-consumer-group-pel-lag-sentinel
namespace: company.streaming

inputs:
  - id: redis_host
    type: STRING
    defaults: "redis.internal"
    description: Hostname of Redis instance.
  - id: redis_port
    type: INT
    defaults: 6379
    description: Redis port.
  - id: stream_key
    type: STRING
    description: Redis Stream key name.
  - id: group_name
    type: STRING
    description: Consumer group name.
  - id: max_pel_count
    type: INT
    defaults: 100
    description: "Maximum allowable pending unacknowledged entries before alerting (default 100)."

tasks:
  - id: inspect_stream_group
    type: io.kestra.plugin.scripts.shell.Commands
    commands:
      - |
        # Run XINFO GROUPS to inspect consumer group pending entries list
        redis-cli -h "{{ inputs.redis_host }}" -p {{ inputs.redis_port }} -a "{{ secret('REDIS_PASSWORD') }}" XINFO GROUPS "{{ inputs.stream_key }}" > /tmp/xinfo_groups.txt
        
        # Parse pending count for the specified group
        python3 -c "
        try:
            with open('/tmp/xinfo_groups.txt') as f:
                lines = [line.strip() for line in f]
            pending = 0
            for i, line in enumerate(lines):
                if line == 'name' and i + 1 < len(lines) and lines[i+1] == '{{ inputs.group_name }}':
                    for j in range(i, min(i + 20, len(lines))):
                        if lines[j] == 'pending' and j + 1 < len(lines):
                            pending = int(lines[j+1])
                            break
            print(pending)
        except Exception:
            print(0)
        " > /tmp/pel_count.txt
        
        PEL_COUNT=$(cat /tmp/pel_count.txt | tr -d '[:space:]')
        echo "::set-output name=pel_count::${PEL_COUNT:-0}::"

  - id: evaluate_pel_lag
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.inspect_stream_group.vars.pel_count | int > inputs.max_pel_count }}"
    then:
      - id: notify_streaming_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#streaming-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 Redis Streams Consumer PEL Backlog Alert",
                "text": "Consumer group `{{ inputs.group_name }}` on stream `{{ inputs.stream_key }}` has *{{ outputs.inspect_stream_group.vars.pel_count }} pending unacknowledged entries (PEL)*! Worker consumers have crashed without calling `XACK`, leaving stream messages stranded in the Pending Entries List.",
                "footer": "Kestra Streaming Sentinel • Redis Streams"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#streaming-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ Redis Streams Sentinel Failure",
            "text": "Failed to execute XINFO GROUPS on Redis instance. Verify stream key, group name, and password.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  title: Redis Streams Consumer Group Pending Entries List (PEL) Lag Sentinel
  shortDescription: Audits Redis Streams consumer groups for Pending Entries List (PEL) lag and abandoned unacknowledged messages.
  description: |
    ## How it works
    This workflow connects to Redis via `redis-cli` and executes `XINFO GROUPS` on target Redis Streams keys (`stream_key`) to audit the size of the Pending Entries List (PEL). In Redis Streams consumer groups, when a worker reads messages via `XREADGROUP`, Redis marks them as delivered and tracks them in the consumer's PEL until the worker explicitly acknowledges them with `XACK`. If consumer microservices crash, encounter unhandled errors, or drop connections, entries remain indefinitely in the PEL, consuming Redis RAM and preventing at-least-once message reprocessing. This workflow tracks PEL depth and alerts streaming teams.

    ## What you get
    - Real-time detection of stranded, unacknowledged entries in Redis Streams.
    - Prevents data loss and Redis memory bloat from abandoned PEL lists.
    - Quantitative metrics on pending message counts per consumer group.

    ## Who it's for
    - Backend Systems Engineers and Event-Driven Microservice Developers.
    - Redis Cache and Queue Administrators.

    ## Why orchestrate this with Kestra
    - **Continuous Stream Health Auditing**: Regularly inspects consumer group state automatically.
    - **Secure Credential Injection**: Passes Redis passwords securely via Kestra secrets.
    - **Direct Team Alerts**: Delivers notifications with stream and group names directly to Slack.

    ## Prerequisites
    - Redis instance (v5.0+) with Redis Streams in use.
    - Secrets `REDIS_PASSWORD` and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import the blueprint.
    2. Input Redis host, port, stream key, and consumer group name.
    3. Run the workflow to inspect PEL depth.

    ## How to extend
    - Execute `XAUTOCLAIM` automatically to reassign stranded messages to healthy active consumers.
    - Query `XINFO CONSUMERS` to identify the specific inactive consumer instance holding pending messages.

    ## Links
    - [Redis Streams Consumer Groups Documentation](https://redis.io/docs/latest/develop/data-types/streams/)
    - [Kestra Documentation](https://kestra.io/docs)
  tags:
    - Data
    - Infrastructure
  ee: false
  demo: false
