id: github-issue-triage-and-duplicate-detection-qdrant
namespace: company.team

inputs:
  - id: embedding_model
    type: STRING
    displayName: Embedding Model
    defaults: "text-embedding-3-small"
    description: OpenAI embedding model used to vectorize issue titles and descriptions.

  - id: chat_model
    type: STRING
    displayName: Chat Classification Model
    defaults: "gpt-4o-mini"
    description: OpenAI chat model used for zero-shot issue categorization when no duplicates exist.

  - id: qdrant_collection
    type: STRING
    displayName: Qdrant Collection Name
    defaults: "github-issues"
    description: Qdrant vector collection storing historical issue embeddings and metadata.

  - id: similarity_threshold
    type: FLOAT
    displayName: Similarity Score Threshold
    defaults: 0.82
    description: Minimum cosine similarity score (0.0 to 1.0) to flag an issue as a potential duplicate.

  - id: top_k
    type: INT
    displayName: Top Matches Limit
    defaults: 3
    description: Maximum number of nearest duplicate candidates to retrieve from Qdrant.

  - id: allowed_labels
    type: ARRAY
    itemType: STRING
    displayName: Allowed Classification Labels
    defaults:
      - "bug"
      - "feature"
      - "question"
      - "documentation"
    description: Permitted taxonomy of issue labels applied by the classification model.

  - id: slack_channel
    type: STRING
    displayName: Slack Notification Channel
    defaults: "#github-triage"
    description: Destination Slack channel for duplicate detection alerts.

triggers:
  - id: github_issue_webhook
    type: io.kestra.plugin.core.trigger.Webhook
    description: Receives GitHub issue webhook payloads authenticated via secret token.
    key: "{{ secret('GITHUB_WEBHOOK_KEY') }}"

tasks:
  - id: gate_issue_event
    type: io.kestra.plugin.core.flow.If
    description: Gate execution to only process newly opened issues authored by human users with non-empty content.
    condition: "{{ trigger.body.action == 'opened' and trigger.body.issue.user.type != 'Bot' and (trigger.body.issue.title | default('') | trim != '') }}"
    then:
      - id: create_collection_if_missing
        type: io.kestra.plugin.qdrant.CreateCollection
        description: Ensure the Qdrant vector collection exists with 1536-dimensional cosine vectors.
        host: "{{ secret('QDRANT_HOST') }}"
        apiKey: "{{ secret('QDRANT_API_KEY') }}"
        collectionName: "{{ inputs.qdrant_collection }}"
        vectorSize: 1536
        distance: COSINE
        allowFailure: true
        retry:
          type: constant
          interval: PT2S
          maxAttempts: 2

      - id: create_embedding
        type: io.kestra.plugin.core.http.Request
        description: Generate dense vector embedding from issue title and body via OpenAI API.
        uri: "https://api.openai.com/v1/embeddings"
        method: POST
        contentType: application/json
        headers:
          Authorization: "Bearer {{ secret('OPENAI_API_KEY') }}"
        body: |
          {
            "model": "{{ inputs.embedding_model }}",
            "input": {{ (trigger.body.issue.title ~ "\n\n" ~ (trigger.body.issue.body | default(""))) | slice(0, 8000) | toJson }}
          }
        retry:
          type: constant
          interval: PT3S
          maxAttempts: 3

      - id: search_similar_issues
        type: io.kestra.plugin.qdrant.Query
        description: Search Qdrant collection for semantically similar issues using cosine similarity.
        host: "{{ secret('QDRANT_HOST') }}"
        apiKey: "{{ secret('QDRANT_API_KEY') }}"
        collectionName: "{{ inputs.qdrant_collection }}"
        vector: "{{ fromJson(outputs.create_embedding.body).data[0].embedding }}"
        limit: "{{ inputs.top_k + 1 }}"
        scoreThreshold: "{{ inputs.similarity_threshold }}"
        fetchType: FETCH
        retry:
          type: constant
          interval: PT3S
          maxAttempts: 3

      - id: filter_matches
        type: io.kestra.plugin.core.output.OutputValues
        description: Exclude the current issue number from candidates and count matches.
        values:
          duplicate_candidates: >-
            {{ ({'rows': outputs.search_similar_issues.rows} | jq('[(.rows // [])[] | select((.id | tostring) != (\"' ~ trigger.body.issue.number ~ '\"))]')) | first | default([]) }}
          has_duplicates: >-
            {{ (({'rows': outputs.search_similar_issues.rows} | jq('[(.rows // [])[] | select((.id | tostring) != (\"' ~ trigger.body.issue.number ~ '\"))] | length')) | first | number) > 0 }}

      - id: route_triage_decision
        type: io.kestra.plugin.core.flow.Switch
        description: Route action based on whether potential duplicate candidates were identified.
        value: "{{ outputs.filter_matches.values.has_duplicates ? 'DUPLICATE_FOUND' : 'NO_DUPLICATE' }}"
        cases:
          "DUPLICATE_FOUND":
            - id: add_duplicate_label
              type: io.kestra.plugin.core.http.Request
              description: Tag the issue with possible-duplicate label.
              uri: "https://api.github.com/repos/{{ trigger.body.repository.full_name }}/issues/{{ trigger.body.issue.number }}/labels"
              method: POST
              contentType: application/json
              headers:
                Authorization: "Bearer {{ secret('GITHUB_TOKEN') }}"
                Accept: application/vnd.github+json
              body: '{"labels": ["possible-duplicate"]}'
              retry:
                type: constant
                interval: PT3S
                maxAttempts: 3

            - id: comment_duplicate_matches
              type: io.kestra.plugin.github.issues.Comment
              description: Post explanatory comment with links and similarity scores of matching issues.
              oauthToken: "{{ secret('GITHUB_TOKEN') }}"
              repository: "{{ trigger.body.repository.full_name }}"
              issueNumber: "{{ trigger.body.issue.number }}"
              body: |
                ### Potential Duplicate Issues Detected

                Our automated triage detected semantically similar existing issues in this repository:

                {% for m in outputs.filter_matches.values.duplicate_candidates %}
                - #{{ m.payload.number }}: [{{ m.payload.title }}]({{ m.payload.url }}) (similarity score: {{ (m.score * 100) | round(1) }}%)
                {% endfor %}

                Please review the matching issues above to verify if your inquiry or defect report is already tracked.
              retry:
                type: constant
                interval: PT3S
                maxAttempts: 3

            - id: notify_slack_duplicate
              type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
              description: Alert triage channel when a potential duplicate issue is created.
              url: "{{ secret('SLACK_WEBHOOK_URL') }}"
              payload: |
                {
                  "channel": "{{ inputs.slack_channel }}",
                  "text": ":warning: Potential Duplicate Issue Opened: <{{ trigger.body.issue.html_url }}|#{{ trigger.body.issue.number }} {{ trigger.body.issue.title }}>",
                  "attachments": [
                    {
                      "color": "#E2B93B",
                      "title": "Semantic Duplicate Alert",
                      "fields": [
                        {
                          "title": "Repository",
                          "value": "`{{ trigger.body.repository.full_name }}`",
                          "short": true
                        },
                        {
                          "title": "Author",
                          "value": "@{{ trigger.body.issue.user.login }}",
                          "short": true
                        },
                        {
                          "title": "Top Match",
                          "value": "<{{ outputs.filter_matches.values.duplicate_candidates[0].payload.url }}|#{{ outputs.filter_matches.values.duplicate_candidates[0].payload.number }} {{ outputs.filter_matches.values.duplicate_candidates[0].payload.title }}> ({{ (outputs.filter_matches.values.duplicate_candidates[0].score * 100) | round(1) }}%)",
                          "short": false
                        }
                      ]
                    }
                  ]
                }
              retry:
                type: constant
                interval: PT5S
                maxAttempts: 3

          "NO_DUPLICATE":
            - id: classify_issue
              type: io.kestra.plugin.openai.ChatCompletion
              description: Classify unique issue into standard categories using structured JSON output.
              apiKey: "{{ secret('OPENAI_API_KEY') }}"
              model: "{{ inputs.chat_model }}"
              messages:
                - role: system
                  content: |
                    You are a software engineering issue triage classifier. Categorize the given issue into exactly one of these allowed labels: {{ inputs.allowed_labels | toJson }}.
                    Return valid JSON strictly matching the requested schema.
                - role: user
                  content: |
                    Title: {{ trigger.body.issue.title }}
                    Body:
                    {{ (trigger.body.issue.body | default("No body provided")) | slice(0, 3000) }}
              jsonResponseSchema: |
                {
                  "type": "object",
                  "properties": {
                    "label": {
                      "type": "string"
                    },
                    "reasoning": {
                      "type": "string"
                    }
                  },
                  "required": ["label", "reasoning"],
                  "additionalProperties": false
                }
              retry:
                type: constant
                interval: PT3S
                maxAttempts: 3

            - id: check_and_apply_classification
              type: io.kestra.plugin.core.flow.If
              description: Validate predicted label against allowed taxonomy before tagging GitHub issue.
              condition: "{{ inputs.allowed_labels contains fromJson(outputs.classify_issue.choices[0].message.content).label }}"
              then:
                - id: apply_category_label
                  type: io.kestra.plugin.core.http.Request
                  description: Apply validated category label to the GitHub issue.
                  uri: "https://api.github.com/repos/{{ trigger.body.repository.full_name }}/issues/{{ trigger.body.issue.number }}/labels"
                  method: POST
                  contentType: application/json
                  headers:
                    Authorization: "Bearer {{ secret('GITHUB_TOKEN') }}"
                    Accept: application/vnd.github+json
                  body: '{"labels": ["{{ fromJson(outputs.classify_issue.choices[0].message.content).label }}"]}'
                  retry:
                    type: constant
                    interval: PT3S
                    maxAttempts: 3
              else:
                - id: log_unrecognized_label
                  type: io.kestra.plugin.core.log.Log
                  message: "Predicted label '{{ fromJson(outputs.classify_issue.choices[0].message.content).label }}' is outside allowed taxonomy {{ inputs.allowed_labels }}. Skipping automatic labeling."

      - id: upsert_issue_vector
        type: io.kestra.plugin.qdrant.Upsert
        description: Index current issue embedding and metadata into Qdrant for future matching.
        host: "{{ secret('QDRANT_HOST') }}"
        apiKey: "{{ secret('QDRANT_API_KEY') }}"
        collectionName: "{{ inputs.qdrant_collection }}"
        points:
          - id: "{{ trigger.body.issue.number }}"
            vector: "{{ fromJson(outputs.create_embedding.body).data[0].embedding }}"
            payload:
              title: "{{ trigger.body.issue.title }}"
              url: "{{ trigger.body.issue.html_url }}"
              number: "{{ trigger.body.issue.number }}"
              repo: "{{ trigger.body.repository.full_name }}"
        retry:
          type: constant
          interval: PT3S
          maxAttempts: 3
    else:
      - id: log_skipped_event
        type: io.kestra.plugin.core.log.Log
        message: "Skipping event: action='{{ trigger.body.action }}', user_type='{{ trigger.body.issue.user.type | default('unknown') }}', number={{ trigger.body.issue.number | default(0) }}."

extend:
  title: GitHub Issue Triage and Duplicate Detection with Qdrant
  metaTitle: GitHub Issue Duplicate Detection and AI Triage with Qdrant
  shortDescription: Detect duplicate GitHub issues with OpenAI embeddings and Qdrant, auto-label issues, and comment with matching links.
  metaDescription: Triage GitHub issues with OpenAI embeddings and Qdrant vector search to detect duplicates, auto-label categories, and notify Slack.
  description: |
    Automate GitHub issue triage, semantic duplicate detection, and category labeling using OpenAI, Qdrant vector search, and Kestra orchestration. In active open-source and enterprise repositories, maintainers frequently spend hours manually reading incoming issues, flagging duplicates, and assigning taxonomy labels. Traditional keyword searches often fail because users describe identical problems using entirely different terminology.

    This blueprint reacts to newly opened GitHub issues via a webhook, converts the title and body into dense vector embeddings with OpenAI, and queries a Qdrant collection for existing semantically similar issues. When candidate duplicates cross a configurable cosine similarity threshold, the workflow tags the issue with a `possible-duplicate` label, posts a polite comment linking to prior matching issues with confidence scores, and alerts the maintainer Slack channel. If no duplicates are found, the flow runs an OpenAI classification model to auto-label the issue with standard taxonomy categories (e.g., bug, feature, question, documentation) and indexes the new issue into Qdrant for future matching.

    ## How it works

    1. `github_issue_webhook` receives GitHub issue event webhooks authenticated by a shared secret key configured in the webhook URL.
    2. `gate_issue_event` (`io.kestra.plugin.core.flow.If`) gates execution to only process `opened` actions authored by human users (`user.type != 'Bot'`) with non-empty titles. All other actions and bot activities are safely logged and skipped.
    3. `create_collection_if_missing` (`io.kestra.plugin.qdrant.CreateCollection`) idempotently ensures the target Qdrant collection exists with 1536-dimensional cosine vector configuration.
    4. `create_embedding` (`io.kestra.plugin.core.http.Request`) invokes the OpenAI Embeddings API (`text-embedding-3-small`) to convert the issue title and body into a high-dimensional vector.
    5. `search_similar_issues` (`io.kestra.plugin.qdrant.Query`) searches Qdrant for nearest neighbor vectors above `similarity_threshold` (default 0.82) using `fetchType: FETCH`.
    6. `filter_matches` (`io.kestra.plugin.core.output.OutputValues`) excludes the current issue number from the search candidates to prevent self-matching.
    7. `route_triage_decision` (`io.kestra.plugin.core.flow.Switch`) inspects candidate counts:
       - **Duplicate candidates found**: `add_duplicate_label` applies the `possible-duplicate` label, `comment_duplicate_matches` posts a markdown comment listing matching issue URLs and similarity scores, and `notify_slack_duplicate` posts an alert to the triage Slack channel.
       - **No duplicates found**: `classify_issue` (`io.kestra.plugin.openai.ChatCompletion`) classifies the issue into standard categories using structured JSON output, validates the label against `allowed_labels`, and applies the validated label to the issue via `apply_category_label`.
    8. `upsert_issue_vector` (`io.kestra.plugin.qdrant.Upsert`) indexes the issue number, embedding vector, title, and URL into Qdrant so subsequent incoming issues can match against it. Setting the point ID to the issue number guarantees idempotent upserts on redelivered webhooks.

    ## What you get

    - Automated semantic duplicate detection that catches similar issues even when described with different phrasing.
    - Automated comment generation linking new issues directly to historical issues with similarity percentages.
    - Automated category classification (bug, feature, question, docs) for unique issues using structured JSON schema.
    - Zero human overhead for repetitive initial triage, freeing maintainers to focus on code review and bug fixes.
    - Real-time Slack notifications dispatched only when duplicate issues require maintainer attention.

    ## Who it's for

    - Open Source Maintainers managing high-traffic GitHub repositories.
    - Developer Relations and Engineering Support teams triaging public issue backlogs.
    - Platform and SRE teams standardizing incident and bug intake across distributed microservices.

    ## Why orchestrate this with Kestra

    Building duplicate detection with custom webhooks or ad hoc scripts introduces infrastructure maintenance, unhandled rate limits, lost webhook retries, and brittle vector store connections.

    Orchestrating this with Kestra provides an event-driven webhook endpoint, declarative retries across GitHub, OpenAI, and Qdrant APIs, conditional routing with Switch and If tasks, and end-to-end execution lineage without managing dedicated server daemons.

    ## Prerequisites

    - A GitHub repository with administrative access to configure webhooks and personal access tokens.
    - An OpenAI API key with access to `text-embedding-3-small` and `gpt-4o-mini`.
    - A Qdrant cluster (Qdrant Cloud or self-hosted gRPC endpoint) reachable from the Kestra instance.
    - A Slack Incoming Webhook URL for triage channel alerts.

    ### Secrets

    - `GITHUB_WEBHOOK_KEY`: Secret key securing the Kestra webhook trigger endpoint against unauthorized HTTP calls.
    - `GITHUB_TOKEN`: GitHub Personal Access Token (classic or fine-grained) with `issues:write` permissions.
    - `OPENAI_API_KEY`: OpenAI API key used for generating vector embeddings and structured chat classification.
    - `QDRANT_HOST`: Hostname or IP address of the Qdrant gRPC service endpoint (default port 6334).
    - `QDRANT_API_KEY`: API key used to authenticate with the Qdrant vector database.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL used to dispatch duplicate detection notifications.

    ## Quick start

    1. Configure the six required secrets in your Kestra namespace: `GITHUB_WEBHOOK_KEY`, `GITHUB_TOKEN`, `OPENAI_API_KEY`, `QDRANT_HOST`, `QDRANT_API_KEY`, and `SLACK_WEBHOOK_URL`.
    2. Copy the generated Webhook URL from the Kestra UI under the `github_issue_webhook` trigger (e.g., `https://<kestra-host>/api/v1/executions/webhook/company.team/github-issue-triage-and-duplicate-detection-qdrant/<your-key>`).
    3. In your GitHub repository settings under **Webhooks**, add a webhook with Content type `application/json` and select the **Issues** event. Note that GitHub signs payloads with HMAC while Kestra authenticates incoming calls via the secret webhook key embedded in the URL path.
    4. Open a test issue in the repository and verify automated duplicate matching or categorization in Kestra's execution graph.

    ## How to extend

    - Pull Request triage: Extend the trigger to handle `pull_request` events to cross-reference incoming PRs against open bug issues.
    - Cross-encoder reranking: Add a Cohere or local cross-encoder reranking task before commenting to further filter semantic false positives.
    - Auto-closing resolved duplicates: Automatically close duplicate issues and link the master issue when similarity exceeds 0.95.

    ## Links

    - [Kestra Webhook Trigger Documentation](https://kestra.io/plugins/core/triggers/io.kestra.plugin.core.trigger.webhook)
    - [Kestra Qdrant Plugin Documentation](https://kestra.io/plugins/plugin-qdrant)
    - [Kestra GitHub Plugin Documentation](https://kestra.io/plugins/plugin-github)
    - [Kestra OpenAI Plugin Documentation](https://kestra.io/plugins/plugin-openai)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
  tags:
    - AI
  subTags:
    - Classification & Moderation
    - RAG & Knowledge Retrieval
  ee: false
  verified: false
  demo: false
