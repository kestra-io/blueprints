id: postgresql-cross-environment-schema-drift-guard
namespace: company.database

inputs:
  - id: staging_schema
    type: STRING
    displayName: Staging Schema
    defaults: public
    description: Target schema name in the staging or pre-production PostgreSQL database.

  - id: production_schema
    type: STRING
    displayName: Production Schema
    defaults: public
    description: Target schema name in the production PostgreSQL database.

  - id: fail_on_breaking_drift
    type: BOOL
    displayName: Fail on Breaking Drift
    defaults: true
    description: When true, halts execution with an error if breaking schema mutations (type mismatch, missing columns in staging) are detected.

  - id: slack_channel
    type: STRING
    displayName: Slack Notification Channel
    defaults: "#data-ops-alerts"
    description: Destination Slack channel for schema drift notifications.

  - id: ignored_tables
    type: ARRAY
    itemType: STRING
    displayName: Ignored Tables
    defaults:
      - flyway_schema_history
      - schema_migrations
      - databasechangelog
      - databasechangeloglock
    description: Migration tracking or lock tables excluded from schema comparison.

triggers:
  - id: post_migration_webhook
    type: io.kestra.plugin.core.trigger.Webhook
    description: Webhook endpoint triggered by CI/CD deployment pipelines immediately following staging database migrations.
    key: "{{ secret('SCHEMA_GATE_WEBHOOK_KEY') }}"
    disabled: true

  - id: daily_preflight_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: Scheduled preflight schema parity audit executed Monday through Friday at 06:00 UTC before business deployments.
    cron: "0 6 * * 1-5"
    disabled: true

tasks:
  - id: fetch_catalogs_in_parallel
    type: io.kestra.plugin.core.flow.Parallel
    description: Query information_schema catalogs across staging and production in parallel to minimize audit latency.
    tasks:
      - id: fetch_staging_columns
        type: io.kestra.plugin.jdbc.postgresql.Query
        description: Query information_schema.columns on the staging PostgreSQL database.
        url: "{{ secret('STAGING_POSTGRES_JDBC_URL') }}"
        username: "{{ secret('STAGING_POSTGRES_USER') }}"
        password: "{{ secret('STAGING_POSTGRES_PASSWORD') }}"
        fetchType: FETCH
        sql: |
          SELECT
            c.table_name,
            c.column_name,
            c.data_type,
            c.udt_name,
            c.is_nullable,
            c.column_default,
            c.character_maximum_length,
            c.numeric_precision,
            c.numeric_scale,
            c.ordinal_position
          FROM information_schema.columns c
          JOIN information_schema.tables t
            ON t.table_schema = c.table_schema
           AND t.table_name = c.table_name
          WHERE c.table_schema = '{{ inputs.staging_schema }}'
            AND t.table_type = 'BASE TABLE'
            {% if inputs.ignored_tables is not empty %}
            AND c.table_name NOT IN ('{{ inputs.ignored_tables | join("', '") }}')
            {% endif %}
          ORDER BY c.table_name, c.ordinal_position;

      - id: fetch_production_columns
        type: io.kestra.plugin.jdbc.postgresql.Query
        description: Query information_schema.columns on the production PostgreSQL database.
        url: "{{ secret('PRODUCTION_POSTGRES_JDBC_URL') }}"
        username: "{{ secret('PRODUCTION_POSTGRES_USER') }}"
        password: "{{ secret('PRODUCTION_POSTGRES_PASSWORD') }}"
        fetchType: FETCH
        sql: |
          SELECT
            c.table_name,
            c.column_name,
            c.data_type,
            c.udt_name,
            c.is_nullable,
            c.column_default,
            c.character_maximum_length,
            c.numeric_precision,
            c.numeric_scale,
            c.ordinal_position
          FROM information_schema.columns c
          JOIN information_schema.tables t
            ON t.table_schema = c.table_schema
           AND t.table_name = c.table_name
          WHERE c.table_schema = '{{ inputs.production_schema }}'
            AND t.table_type = 'BASE TABLE'
            {% if inputs.ignored_tables is not empty %}
            AND c.table_name NOT IN ('{{ inputs.ignored_tables | join("', '") }}')
            {% endif %}
          ORDER BY c.table_name, c.ordinal_position;

  - id: analyze_schema_drift
    type: io.kestra.plugin.scripts.python.Script
    description: Compare column catalogs between environments, classify drift severity, and emit remediation DDL.
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: python:3.11-slim
    inputFiles:
      staging_columns.json: "{{ outputs.fetch_staging_columns.rows is not null ? (outputs.fetch_staging_columns.rows | toJson) : '[]' }}"
      production_columns.json: "{{ outputs.fetch_production_columns.rows is not null ? (outputs.fetch_production_columns.rows | toJson) : '[]' }}"
    outputFiles:
      - schema_drift_report.json
      - remediation_patch.sql
    script: |
      import json
      import os

      def load_rows(filename):
          if not os.path.exists(filename):
              return []
          with open(filename, "r", encoding="utf-8") as f:
              data = json.load(f)
              if isinstance(data, list):
                  return [{k.lower(): v for k, v in row.items()} for row in data]
              return []

      staging_rows = load_rows("staging_columns.json")
      production_rows = load_rows("production_columns.json")

      stg_map = {(r["table_name"], r["column_name"]): r for r in staging_rows}
      prd_map = {(r["table_name"], r["column_name"]): r for r in production_rows}

      stg_tables = set(k[0] for k in stg_map)
      prd_tables = set(k[0] for k in prd_map)

      drifts = []
      remediation_sql = []

      # 1. Tables in production but missing in staging (unauthorized prod changes or forgotten branches)
      for t in sorted(prd_tables - stg_tables):
          drifts.append({
              "type": "TABLE_MISSING_IN_STAGING",
              "severity": "CRITICAL",
              "table": t,
              "detail": "Table exists in Production but is absent from Staging migrations."
          })
          remediation_sql.append(f"-- WARNING: Table {t} exists in Production but missing in Staging repository.")

      # 2. Tables in staging but missing in production (pending release)
      for t in sorted(stg_tables - prd_tables):
          drifts.append({
              "type": "TABLE_PENDING_DEPLOYMENT",
              "severity": "INFO",
              "table": t,
              "detail": "Table exists in Staging; pending deployment to Production."
          })
          remediation_sql.append(f"-- NOTICE: Table {t} exists in Staging; pending deployment to Production.")

      # 3. Column-level parity check
      for key, s_col in stg_map.items():
          t_name, c_name = key
          if t_name not in prd_tables:
              continue

          udt = s_col.get("udt_name") or s_col.get("data_type") or "text"

          if key not in prd_map:
              drifts.append({
                  "type": "COLUMN_PENDING_DEPLOYMENT",
                  "severity": "INFO",
                  "table": t_name,
                  "column": c_name,
                  "detail": f"Column {c_name} ({udt}) exists in Staging but missing in Production."
              })
              null_clause = " NOT NULL" if s_col.get("is_nullable") == "NO" else ""
              def_val = s_col.get("column_default")
              def_clause = f" DEFAULT {def_val}" if def_val else ""
              remediation_sql.append(f"ALTER TABLE {t_name} ADD COLUMN {c_name} {udt}{null_clause}{def_clause};")
          else:
              p_col = prd_map[key]
              p_udt = p_col.get("udt_name") or p_col.get("data_type") or "text"

              if udt != p_udt:
                  drifts.append({
                      "type": "TYPE_MISMATCH",
                      "severity": "CRITICAL",
                      "table": t_name,
                      "column": c_name,
                      "detail": f"Data type mismatch on {c_name}: Staging={udt} vs Production={p_udt}."
                  })
                  remediation_sql.append(f"ALTER TABLE {t_name} ALTER COLUMN {c_name} TYPE {udt};")
              elif s_col.get("character_maximum_length") != p_col.get("character_maximum_length"):
                  s_len = s_col.get("character_maximum_length")
                  p_len = p_col.get("character_maximum_length")
                  if s_len and p_len and s_len != p_len:
                      sev = "CRITICAL" if s_len < p_len else "WARNING"
                      drifts.append({
                          "type": "LENGTH_MISMATCH",
                          "severity": sev,
                          "table": t_name,
                          "column": c_name,
                          "detail": f"Length mismatch on {c_name}: Staging={s_len} vs Production={p_len}."
                      })
                      remediation_sql.append(f"ALTER TABLE {t_name} ALTER COLUMN {c_name} TYPE varchar({s_len});")

              s_null = s_col.get("is_nullable")
              p_null = p_col.get("is_nullable")
              if s_null != p_null:
                  sev = "CRITICAL" if s_null == "NO" else "WARNING"
                  drifts.append({
                      "type": "NULLABILITY_MISMATCH",
                      "severity": sev,
                      "table": t_name,
                      "column": c_name,
                      "detail": f"Nullability mismatch on {c_name}: Staging={s_null} vs Production={p_null}."
                  })
                  action = "SET NOT NULL" if s_null == "NO" else "DROP NOT NULL"
                  remediation_sql.append(f"ALTER TABLE {t_name} ALTER COLUMN {c_name} {action};")

      # 4. Columns in production but missing in staging
      for key, p_col in prd_map.items():
          t_name, c_name = key
          if t_name not in stg_tables:
              continue
          if key not in stg_map:
              p_udt = p_col.get("udt_name") or p_col.get("data_type") or "text"
              drifts.append({
                  "type": "COLUMN_MISSING_IN_STAGING",
                  "severity": "CRITICAL",
                  "table": t_name,
                  "column": c_name,
                  "detail": f"Column {c_name} ({p_udt}) exists in Production but missing in Staging."
              })
              remediation_sql.append(f"-- WARNING: Column {t_name}.{c_name} exists in Production but missing in Staging.")

      total_drift_count = len(drifts)
      breaking_drift_count = sum(1 for d in drifts if d["severity"] == "CRITICAL")
      non_breaking_drift_count = total_drift_count - breaking_drift_count

      if breaking_drift_count > 0:
          drift_status = "CRITICAL_DRIFT"
      elif total_drift_count > 0:
          drift_status = "ADDITIVE_ONLY"
      else:
          drift_status = "IN_SYNC"

      # Write report JSON
      with open("schema_drift_report.json", "w", encoding="utf-8") as f:
          json.dump({
              "drift_status": drift_status,
              "total_drift_count": total_drift_count,
              "breaking_drift_count": breaking_drift_count,
              "non_breaking_drift_count": non_breaking_drift_count,
              "drifts": drifts
          }, f, indent=2)

      # Write remediation patch SQL
      with open("remediation_patch.sql", "w", encoding="utf-8") as f:
          f.write("-- Automated PostgreSQL Remediation DDL Patch\n")
          f.write("-- Generated by Kestra cross-environment schema drift guard\n\n")
          if remediation_sql:
              f.write("\n".join(remediation_sql) + "\n")
          else:
              f.write("-- Zero drift detected. Schemas are in 100% parity.\n")

      print(f"Audit completed: status={drift_status}, total={total_drift_count}, breaking={breaking_drift_count}")
      print("::" + json.dumps({
          "outputs": {
              "total_drift_count": total_drift_count,
              "breaking_drift_count": breaking_drift_count,
              "non_breaking_drift_count": non_breaking_drift_count,
              "has_breaking_drift": breaking_drift_count > 0,
              "drift_status": drift_status
          }
      }) + "::")

  - id: evaluate_drift_gate
    type: io.kestra.plugin.core.flow.If
    description: Branch based on detected schema drift to notify team and enforce deployment gates.
    condition: "{{ outputs.analyze_schema_drift.vars.total_drift_count > 0 }}"
    then:
      - id: notify_drift_alert
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Post detailed drift summary and remediation metrics to Slack.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "{{ inputs.slack_channel }}",
            "text": ":warning: *PostgreSQL Schema Drift Detected* | Staging: `{{ inputs.staging_schema }}` vs Production: `{{ inputs.production_schema }}`\n• Drift Status: *{{ outputs.analyze_schema_drift.vars.drift_status }}*\n• Total Differences: `{{ outputs.analyze_schema_drift.vars.total_drift_count }}`\n• Breaking Mutations: `{{ outputs.analyze_schema_drift.vars.breaking_drift_count }}`\n• Additive Pending: `{{ outputs.analyze_schema_drift.vars.non_breaking_drift_count }}`\n• Execution: `{{ execution.id }}`"
          }

      - id: check_breaking_gate
        type: io.kestra.plugin.core.flow.If
        description: Halt pipeline execution if breaking mutations exist and fail_on_breaking_drift is enabled.
        condition: "{{ outputs.analyze_schema_drift.vars.has_breaking_drift and inputs.fail_on_breaking_drift }}"
        then:
          - id: halt_on_breaking_drift
            type: io.kestra.plugin.core.execution.Fail
            description: Reject execution to prevent deploying applications against drifted database schemas.
            errorMessage: "Deployment gate rejected: Detected {{ outputs.analyze_schema_drift.vars.breaking_drift_count }} breaking schema mutation(s) between Staging and Production."
    else:
      - id: log_clean_parity
        type: io.kestra.plugin.core.log.Log
        description: Record audit confirmation when zero schema drift is found.
        message: "Zero schema drift detected. Staging and Production schemas are in 100% parity."

  - id: export_drift_manifest
    type: io.kestra.plugin.core.output.OutputValues
    description: Export structured drift metrics and artifact links for downstream orchestration.
    values:
      total_drift_count: "{{ outputs.analyze_schema_drift.vars.total_drift_count }}"
      breaking_drift_count: "{{ outputs.analyze_schema_drift.vars.breaking_drift_count }}"
      non_breaking_drift_count: "{{ outputs.analyze_schema_drift.vars.non_breaking_drift_count }}"
      drift_status: "{{ outputs.analyze_schema_drift.vars.drift_status }}"
      report_file: "{{ outputs.analyze_schema_drift.outputFiles['schema_drift_report.json'] }}"
      patch_file: "{{ outputs.analyze_schema_drift.outputFiles['remediation_patch.sql'] }}"

outputs:
  - id: drift_status
    type: STRING
    displayName: Schema Drift Status
    description: Status of the comparison (IN_SYNC, ADDITIVE_ONLY, or CRITICAL_DRIFT).
    value: "{{ outputs.export_drift_manifest.values.drift_status }}"

  - id: total_drift_count
    type: INT
    displayName: Total Drift Count
    description: Total number of schema differences detected across environments.
    value: "{{ outputs.export_drift_manifest.values.total_drift_count }}"

  - id: breaking_drift_count
    type: INT
    displayName: Breaking Drift Count
    description: Number of breaking schema differences (type mismatches, dropped columns, nullability conflicts).
    value: "{{ outputs.export_drift_manifest.values.breaking_drift_count }}"

  - id: remediation_patch_file
    type: URI
    displayName: Remediation DDL Patch File
    description: URI to the generated SQL patch file containing alignment statements.
    value: "{{ outputs.export_drift_manifest.values.patch_file }}"

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Notify on unexpected worker errors, database connectivity timeouts, or query failures.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "{{ inputs.slack_channel }}",
        "text": ":x: *PostgreSQL Schema Drift Pipeline Failed* | Execution `{{ execution.id }}` terminated unexpectedly during database catalog introspection."
      }

extend:
  title: Cross-Environment PostgreSQL Database Schema Drift and Parity Guard
  shortDescription: Audit PostgreSQL schemas between staging and production in parallel to detect missing columns, type mutations, and breaking DDL drift.
  metaTitle: PostgreSQL Cross-Environment Schema Drift Guard in Kestra
  metaDescription: Audit staging and production PostgreSQL schemas in parallel, detect breaking type and column mutations, generate DDL remediation patches, and alert Slack.
  description: |
    # Cross-Environment PostgreSQL Database Schema Drift and Parity Guard

    Database schema drift between staging, pre-production, and production is one of the most frequent causes of failed deployments, broken migrations, and silent application runtime errors. Manual hotfixes applied directly to production, interrupted migration runners, or forgotten feature branches create subtle catalog disparities: mismatched data types, unaligned column lengths, or missing constraints that pass staging integration tests but crash when promoted to production.

    This blueprint implements a cross-environment schema drift detection and release gate for PostgreSQL: it introspects `information_schema.columns` across both staging and production environments concurrently, runs an automated parity diff in an isolated container, categorizes mutations by severity, generates executable DDL remediation patches, and notifies engineering teams on Slack.

    ## How it works

    1. **Parallel Catalog Introspection (`fetch_catalogs_in_parallel`)**: Uses `io.kestra.plugin.core.flow.Parallel` to execute concurrent catalog queries on both Staging (`fetch_staging_columns`) and Production (`fetch_production_columns`) using the native PostgreSQL JDBC plugin (`io.kestra.plugin.jdbc.postgresql.Query`). Common migration lock tables (`flyway_schema_history`, `schema_migrations`, `databasechangelog`) are excluded automatically via `ignored_tables`.
    2. **Automated Schema Diff and Classification (`analyze_schema_drift`)**: Runs an isolated Python script in `python:3.11-slim` that compares catalog definitions between environments. It flags:
       - **Tables/Columns Missing in Staging**: Critical mutations present in production but missing from staging, signaling unrecorded manual database edits.
       - **Pending Deployments**: Additive tables or columns present in staging but not yet deployed to production.
       - **Data Type and Length Mismatches**: Incompatible underlying PostgreSQL types (`udt_name`) or string length constraints (`character_maximum_length`).
       - **Nullability Drift**: Disparities in `is_nullable` where one environment requires `NOT NULL` without a default value.
    3. **Remediation Artifact Generation**: Generates a structured JSON report (`schema_drift_report.json`) and a companion SQL script (`remediation_patch.sql`) containing alignment `ALTER TABLE` statements stored directly in Kestra execution storage.
    4. **Release Gating (`evaluate_drift_gate`)**: If differences are detected, dispatches a summary to Slack (`notify_drift_alert`). If `has_breaking_drift` is true and `fail_on_breaking_drift` is enabled, triggers `halt_on_breaking_drift` (`io.kestra.plugin.core.execution.Fail`) to halt CI/CD promotion workflows before applications are deployed against incompatible databases.
    5. **Clean Parity Audit (`log_clean_parity`)**: If both catalogs match, logs an audit confirmation with zero drift.

    ## What you get

    - **Automated Deployment Safety**: Catch database schema regressions before deploying code to production.
    - **Zero External Dependencies**: Operates entirely through native Kestra PostgreSQL JDBC tasks and internal container execution without requiring third-party SaaS migration agents.
    - **Executable Remediation Patch**: Automatically generates `ALTER TABLE` DDL statements to bring production and staging back into alignment.
    - **Real-Time Slack Visibility**: Instant notifications with breakdown of breaking vs additive differences and direct execution deep-links.

    ## Who it's for

    - **Site Reliability Engineers (SREs)** maintaining database reliability and uptime.
    - **Database Administrators (DBAs)** auditing consistency across multi-tier database clusters.
    - **Data Platform Engineers** gating ETL and analytics pipelines on upstream relational schema stability.

    ## Why orchestrate this with Kestra

    Building cross-environment database diffs with ad-hoc shell scripts requires maintaining credential files on jump boxes, managing parallel query connections manually, and writing bespoke webhook notification code.

    Orchestrating this workflow with Kestra centralizes database connection secrets securely, runs parallel introspection queries natively, isolates Python comparison logic in ephemeral containers, generates downloadable DDL remediation artifacts in execution storage, and gates release pipelines through declarative YAML flow control.

    ## Prerequisites

    - Two accessible PostgreSQL 12+ databases (e.g. Staging and Production).
    - Database user credentials with `SELECT` privileges on `information_schema.columns` and `information_schema.tables`.
    - An incoming Slack Incoming Webhook URL targeting your engineering alert channel.

    ### Secrets

    - `STAGING_POSTGRES_JDBC_URL`: JDBC connection URL for the staging database (e.g. `jdbc:postgresql://staging-db:5432/app_staging`).
    - `STAGING_POSTGRES_USER`: Database user for staging introspection.
    - `STAGING_POSTGRES_PASSWORD`: Password for the staging database user.
    - `PRODUCTION_POSTGRES_JDBC_URL`: JDBC connection URL for the production database (e.g. `jdbc:postgresql://prod-db:5432/app_production`).
    - `PRODUCTION_POSTGRES_USER`: Database user for production introspection.
    - `PRODUCTION_POSTGRES_PASSWORD`: Password for the production database user.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook endpoint URL used for sending alert notifications.
    - `SCHEMA_GATE_WEBHOOK_KEY`: Secret authentication key securing the incoming CI/CD webhook trigger.

    ### Inputs

    - `staging_schema` (STRING, default `public`): Schema name to audit in the staging database.
    - `production_schema` (STRING, default `public`): Schema name to audit in the production database.
    - `fail_on_breaking_drift` (BOOL, default `true`): Whether breaking schema drift halts execution with an error.
    - `slack_channel` (STRING, default `#data-ops-alerts`): Destination Slack channel for notifications.
    - `ignored_tables` (ARRAY of STRING): Migration tracking tables excluded from drift detection.

    ### Outputs

    - `drift_status`: High-level parity status (`IN_SYNC`, `ADDITIVE_ONLY`, or `CRITICAL_DRIFT`).
    - `total_drift_count`: Total number of detected column and table differences.
    - `breaking_drift_count`: Number of breaking mutations that risk application crashes.
    - `remediation_patch_file`: Internal storage URI for the generated `remediation_patch.sql` artifact.

    ## Quick start

    1. Configure the staging, production, and Slack secrets in **Namespace Files & Secrets**.
    2. Import this blueprint into your Kestra instance.
    3. Click **Execute** in the Kestra UI to run an initial schema parity audit across staging and production.
    4. Inspect execution outputs to review the parity status and download the generated `remediation_patch.sql` file.
    5. Enable `post_migration_webhook` in your CI/CD deployment pipeline or activate `daily_preflight_audit` for automated morning checks.

    ## Common pitfalls and troubleshooting

    - **Data Type Aliasing**: PostgreSQL represents types with internal names in `udt_name` (e.g. `int4` for `integer`, `int8` for `bigint`, `varchar` for `character varying`). The comparison script normalizes checks using `udt_name` to prevent false-positive drift alarms.
    - **Migration Lock Tables**: Schema migration tools (Flyway, Liquibase, Django, Rails) frequently leave transient history or lock tables in one environment. Ensure all framework-specific table names are populated in `inputs.ignored_tables`.
    - **Firewall and Network Access**: Kestra workers require egress network connectivity to both staging and production PostgreSQL ports. If production databases reside in private VPCs, deploy Kestra workers in matching VPC subnets.

    ## How to extend

    - **Index and Constraint Parity**: Extend the JDBC queries to include `pg_indexes` and `information_schema.table_constraints` to detect missing primary keys, unique constraints, and foreign key indexes.
    - **Automated Pull Request Creation**: Chain a GitHub or GitLab task to automatically open a remediation pull request containing the generated `remediation_patch.sql` whenever unauthorized production drift occurs.
    - **Multi-Tenant Fanout**: Wrap the flow inside `io.kestra.plugin.core.flow.ForEachItem` to audit schema consistency across dozens of isolated tenant databases concurrently.

    ## Links

    - Kestra PostgreSQL Plugin Documentation: https://kestra.io/plugins/plugin-jdbc-postgres
    - Kestra Slack Plugin Documentation: https://kestra.io/plugins/plugin-notifications
    - PostgreSQL information_schema Documentation: https://www.postgresql.org/docs/current/information-schema.html
  tags:
    - Data
    - Infrastructure
  subTags:
    - Testing & Quality
    - Day 2 Operations
  ee: false
  demo: false
