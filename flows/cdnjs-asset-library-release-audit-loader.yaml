id: cdnjs-asset-library-release-audit-loader
namespace: company.analytics
description: Ingests public CDN JavaScript asset distributions and release versions from cdnjs into Parquet lakehouse storage via DuckDB, tracking CDN asset updates in Kestra KV store.

inputs:
  - id: libraries
    type: ARRAY
    itemType: STRING
    description: List of critical frontend web libraries to audit on cdnjs.
    defaults:
      - vue
      - react
      - twitter-bootstrap
      - font-awesome
      - d3
      - chartist

  - id: state_key
    type: STRING
    description: Kestra KV store key maintaining the latest known cdnjs asset versions.
    defaults: cdnjs_monitored_libraries_version_state

variables:
  default_state: "{}"

triggers:
  - id: daily_cdnjs_sync
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 7 * * *"

tasks:
  - id: get_current_state
    type: io.kestra.plugin.core.kv.Get
    key: "{{ inputs.state_key }}"
    errorOnMissing: false

  - id: ingest_and_transform_libraries
    type: io.kestra.plugin.scripts.python.Commands
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install requests duckdb
    commands:
      - |
        python3 - << 'EOF'
        import os
        import json
        import requests
        import duckdb
        from datetime import datetime

        raw_state = """{{ outputs.get_current_state.value ?? vars.default_state }}"""
        try:
            state = json.loads(raw_state) if raw_state else {}
        except Exception:
            state = {}

        libraries = json.loads("""{{ inputs.libraries | toJson }}""")

        headers = {
            "User-Agent": "KestraCdnjsLakehouse/1.0 (frontend-ops@kestra.io)"
        }

        records = []
        new_releases = []
        new_state = dict(state)

        for lib in libraries:
            try:
                url = f"https://api.cdnjs.com/libraries?search={lib}&fields=version,description,homepage"
                resp = requests.get(url, headers=headers, timeout=15)
                if resp.status_code == 200:
                    data = resp.json()
                    results = data.get("results", [])
                    matched = None
                    for item in results:
                        if item.get("name") == lib:
                            matched = item
                            break
                    if not matched and results:
                        matched = results[0]

                    if matched:
                        lib_name = matched.get("name", lib)
                        latest_ver = matched.get("version", "")
                        cdn_url = matched.get("latest", "")
                        description = (matched.get("description") or "")[:250]
                        homepage = matched.get("homepage") or ""

                        previous_ver = state.get(lib_name)
                        is_new_release = bool(previous_ver and previous_ver != latest_ver)

                        records.append({
                            "library_name": lib_name,
                            "latest_version": latest_ver,
                            "previous_version": previous_ver if previous_ver else latest_ver,
                            "is_new_release": is_new_release,
                            "cdn_bundle_url": cdn_url,
                            "homepage": homepage,
                            "description": description,
                            "harvest_time": datetime.utcnow().isoformat()
                        })

                        if is_new_release:
                            new_releases.append({
                                "library": lib_name,
                                "from_version": previous_ver,
                                "to_version": latest_ver,
                                "cdn_url": cdn_url
                            })

                        new_state[lib_name] = latest_ver
            except Exception as e:
                print(f"Warning: Failed to fetch cdnjs metadata for '{lib}': {e}")

        with open("cdnjs_releases.json", "w", encoding="utf-8") as f:
            json.dump(records, f)

        con = duckdb.connect()
        if records:
            con.execute("CREATE TABLE cdnjs_audit AS SELECT * FROM read_json_auto('cdnjs_releases.json')")
            con.execute("COPY cdnjs_audit TO 'cdnjs_asset_audit.parquet' (FORMAT PARQUET)")
            con.execute("COPY cdnjs_audit TO 'cdnjs_asset_audit.csv' (HEADER, DELIMITER ',')")
        else:
            con.execute("""
                CREATE TABLE cdnjs_audit (
                    library_name VARCHAR,
                    latest_version VARCHAR,
                    previous_version VARCHAR,
                    is_new_release BOOLEAN,
                    cdn_bundle_url VARCHAR,
                    homepage VARCHAR,
                    description VARCHAR,
                    harvest_time VARCHAR
                )
            """)
            con.execute("COPY cdnjs_audit TO 'cdnjs_asset_audit.parquet' (FORMAT PARQUET)")
            con.execute("COPY cdnjs_audit TO 'cdnjs_asset_audit.csv' (HEADER, DELIMITER ',')")

        summary = {
            "monitored_libraries": len(records),
            "new_releases_count": len(new_releases),
            "new_releases": new_releases,
            "updated_state": new_state
        }

        print(f"::{{'outputs': {json.dumps(summary)}}}::")
        EOF
    outputFiles:
      - cdnjs_asset_audit.parquet
      - cdnjs_asset_audit.csv

  - id: persist_state
    type: io.kestra.plugin.core.kv.Set
    key: "{{ inputs.state_key }}"
    value: "{{ outputs.ingest_and_transform_libraries.vars.updated_state | toJson }}"

  - id: check_new_releases
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.ingest_and_transform_libraries.vars.new_releases_count > 0 }}"
    then:
      - id: notify_cdn_update
        type: io.kestra.plugin.core.log.Log
        level: WARN
        message: "🌐 cdnjs Asset Release Detected: {{ outputs.ingest_and_transform_libraries.vars.new_releases_count }} frontend library(ies) updated on public CDN edge."

outputs:
  - id: monitored_count
    type: INT
    value: "{{ outputs.ingest_and_transform_libraries.vars.monitored_libraries }}"
  - id: new_releases_count
    type: INT
    value: "{{ outputs.ingest_and_transform_libraries.vars.new_releases_count }}"
  - id: dataset_parquet
    type: FILE
    value: "{{ outputs.ingest_and_transform_libraries.outputFiles['cdnjs_asset_audit.parquet'] }}"

extend:
  title: cdnjs Asset Library Release Audit Loader with DuckDB
  metaTitle: cdnjs Asset Library Release Audit Loader | Kestra
  shortDescription: Ingests public CDN JavaScript asset distributions and release versions from cdnjs into Parquet lakehouse storage via DuckDB.
  metaDescription: Poll cdnjs REST API for frontend library releases, extract CDN bundle endpoints into Parquet via DuckDB, and track state in KV store.
  tags:
    - Data
  subTags:
    - ELT & Warehouse Loading
    - File & Data Processing Basics
  ee: false
  demo: false
  description: |
    Automate the scheduled harvesting, transformation, and analytical lakehouse persistence of public CDN
    frontend asset distributions, script release versions, and edge bundle URLs from cdnjs into Parquet using DuckDB.

    ## How it works

    1. **State Recovery**: Queries the Kestra KV store (`cdnjs_monitored_libraries_version_state`) for previously verified CDN asset versions.
    2. **cdnjs API Extraction**: Queries the official cdnjs search API (`api.cdnjs.com/libraries`) for mission-critical client-side libraries.
    3. **DuckDB Schema Normalization**: Extracts latest versions, production bundle CDN endpoints, and homepage URLs into a relational schema inside Docker.
    4. **Analytical Lake Export**: Exports normalized CDN inventory records into columnar Parquet and CSV files for web security auditing and asset integrity monitoring.
    5. **Version Change Detection & State Commitment**: Flags libraries that published new edge versions and commits the updated mapping to Kestra KV store.

    ## What you get

    - Automated recurring CDN dependency audit protecting web applications against unannounced upstream asset drift.
    - Columnar Parquet datasets capturing CDN bundle URLs and library metadata.
    - Built-in KV state management providing idempotent execution and automated release drift detection.

    ## Who it's for

    - Frontend Engineers and Web Performance Architects tracking client-side dependencies.
    - SecOps teams monitoring Subresource Integrity (SRI) and CDN script updates.
    - Data Engineers building reproducible multi-cloud lakehouse pipelines.

    ## Why orchestrate this with Kestra

    - Built-in KV store maintains asset version state across runs without external database infrastructure.
    - Ephemeral Docker execution guarantees isolated Python and DuckDB dependencies cleanly.
    - Declarative flow control provides transparent logging, automated error handling, and scheduled execution.

    ## Prerequisites

    - Docker runtime configured on the Kestra worker.
    - Outbound internet access to `api.cdnjs.com`.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: (Optional) Webhook URL for forwarding CDN upgrade alerts.

    ## Quick start

    1. Import this blueprint into your Kestra instance.
    2. Adjust the `libraries` input array with your application's public CDN scripts.
    3. Click **Execute** to run an initial release metadata harvest.
    4. Enable the `daily_cdnjs_sync` trigger for automated daily synchronization.

    ## How to extend

    - Add an S3 or Google Cloud Storage upload task to archive quarterly CDN audit snapshots.
    - Connect a Subresource Integrity (SRI) hash verification task downstream.

    ## Links

    - [cdnjs API Documentation](https://cdnjs.com/api)
    - [DuckDB Documentation](https://duckdb.org/)
    - [Kestra Task Runners](https://kestra.io/docs/task-runners)
