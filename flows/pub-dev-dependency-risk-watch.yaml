id: pub-dev-dependency-risk-watch
namespace: company.mobile

inputs:
  - id: pubspec_lock_url
    type: STRING
    defaults: "https://raw.githubusercontent.com/flutter/gallery/main/pubspec.lock"
    description: Raw URL of the pubspec.lock file to audit, for example the raw link of your app repository on GitHub.

  - id: max_packages
    type: INT
    defaults: 25
    description: Upper bound on direct dependencies checked per run, which keeps pub.dev traffic polite.

triggers:
  - id: lockfile_changed
    type: io.kestra.plugin.core.trigger.Webhook
    description: Point a GitHub push webhook at this trigger so every change to pubspec.lock is audited within seconds.
    key: "{{ secret('PUBDEV_WATCH_WEBHOOK_KEY') }}"

  - id: weekly_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: Monday 07:00 UTC sweep that catches advisories and discontinued packages published between releases.
    cron: "0 7 * * 1"
    disabled: true

tasks:
  - id: fetch_lockfile
    type: io.kestra.plugin.core.http.Request
    description: Download the pubspec.lock that pins every Dart and Flutter package version the app actually ships.
    uri: "{{ inputs.pubspec_lock_url }}"
    method: GET
    retry:
      type: exponential
      interval: PT2S
      maxInterval: PT10S
      maxAttempts: 3

  - id: extract_direct_dependencies
    type: io.kestra.plugin.scripts.shell.Commands
    description: Keep only hosted packages the app depends on directly and write them as a JSON array of name and locked version.
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    inputFiles:
      pubspec.lock: "{{ outputs.fetch_lockfile.body }}"
    outputFiles:
      - packages.json
    commands:
      - |
        awk -v max={{ inputs.max_packages }} '
          BEGIN { printf "["; sep = ""; count = 0 }
          /^  [A-Za-z0-9_]+:$/ { name = $1; sub(":", "", name); dep = ""; src = "" }
          /^    dependency:/ { dep = $0 }
          /^    source:/ { src = $2 }
          /^    version:/ {
            ver = $2; gsub("\"", "", ver)
            if (src == "hosted" && dep ~ /direct/ && count < max) {
              printf "%s{\"name\":\"%s\",\"version\":\"%s\"}", sep, name, ver
              sep = ","; count++
            }
          }
          END { printf "]" }
        ' pubspec.lock > packages.json

  - id: audit_packages
    type: io.kestra.plugin.core.flow.Loop
    description: Check each direct dependency against pub.dev, four at a time, and raise an alert for every risky one.
    values: "{{ read(outputs.extract_direct_dependencies.outputFiles['packages.json']) }}"
    concurrencyLimit: 4
    tasks:
      - id: fetch_package
        type: io.kestra.plugin.core.http.Request
        description: Read the package record from the pub.dev API to get the latest version and the discontinued flag.
        uri: "https://pub.dev/api/packages/{{ item.value | jq('.name') | first }}"
        method: GET
        retry:
          type: exponential
          interval: PT2S
          maxInterval: PT10S
          maxAttempts: 3

      - id: fetch_advisories
        type: io.kestra.plugin.core.http.Request
        description: Read the security advisories pub.dev lists for the package.
        uri: "https://pub.dev/api/packages/{{ item.value | jq('.name') | first }}/advisories"
        method: GET
        retry:
          type: exponential
          interval: PT2S
          maxInterval: PT10S
          maxAttempts: 3

      - id: assess_package
        type: io.kestra.plugin.core.output.OutputValues
        description: Compare the locked version with the latest release and count discontinued and advisory signals.
        values:
          name: "{{ item.value | jq('.name') | first }}"
          locked: "{{ item.value | jq('.version') | first }}"
          latest: "{{ outputs.fetch_package.body | jq('.latest.version') | first }}"
          discontinued: "{{ outputs.fetch_package.body | jq('.isDiscontinued // false') | first }}"
          advisories: "{{ outputs.fetch_advisories.body | jq('.advisories | length') | first }}"

      - id: risk_gate
        type: io.kestra.plugin.core.flow.If
        description: Alert only when the package is discontinued or carries at least one published security advisory.
        condition: "{{ outputs.assess_package.values.discontinued == 'true' or outputs.assess_package.values.advisories != '0' }}"
        then:
          - id: alert_risky_package
            type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
            url: "{{ secret('SLACK_WEBHOOK_URL') }}"
            payload: "{{ {'text': ':warning: *Risky Dart dependency:* `' ~ outputs.assess_package.values.name ~ '`\n• *Locked:* ' ~ outputs.assess_package.values.locked ~ '  *Latest:* ' ~ outputs.assess_package.values.latest ~ '\n• *Discontinued:* ' ~ outputs.assess_package.values.discontinued ~ '\n• *Advisories:* ' ~ outputs.assess_package.values.advisories ~ '\n• <https://pub.dev/packages/' ~ outputs.assess_package.values.name ~ '|View on pub.dev>'} | toJson }}"
        else:
          - id: log_package_ok
            type: io.kestra.plugin.core.log.Log
            message: "{{ outputs.assess_package.values.name }} {{ outputs.assess_package.values.locked }} has no advisories and is not discontinued, latest is {{ outputs.assess_package.values.latest }}."

  - id: log_audit_complete
    type: io.kestra.plugin.core.log.Log
    message: "Audited the direct dependencies of {{ inputs.pubspec_lock_url }} in execution {{ execution.id }}."

errors:
  - id: alert_audit_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: "{{ {'text': ':x: pub.dev dependency audit failed in execution `' ~ execution.id ~ '`. Check the task logs in Kestra.'} | toJson }}"

extend:
  title: Dart and Flutter Dependency Risk Watch with pub.dev
  metaTitle: Dart and Flutter Dependency Risk Watch from pub.dev | Kestra
  shortDescription: Audit a Flutter app's pubspec.lock against the live pub.dev API and alert Slack about discontinued packages and security advisories.
  metaDescription: Audit pubspec.lock against pub.dev, flag discontinued Dart and Flutter packages and security advisories, and alert Slack for every risky dependency.
  description: |
    Flutter and Dart apps pin dozens of packages in pubspec.lock, and a package can be discontinued or receive a security advisory long after it was added. This blueprint audits the direct dependencies of any app against the live pub.dev API and alerts the team about the risky ones.

    ## How it works

    1. The `lockfile_changed` webhook trigger runs the audit whenever a push webhook reports a change to pubspec.lock, and the `weekly_audit` schedule is a Monday safety net that ships disabled.
    2. `fetch_lockfile` downloads the raw pubspec.lock from the URL given in the `pubspec_lock_url` input.
    3. `extract_direct_dependencies` keeps only hosted packages the app depends on directly and writes them as a JSON array, capped by `max_packages`.
    4. `audit_packages` loops over the array four packages at a time, and each iteration calls the pub.dev package endpoint and the advisories endpoint.
    5. `assess_package` compares the locked version with the latest release and counts discontinued and advisory signals.
    6. `risk_gate` sends one Slack message through `alert_risky_package` when a package is discontinued or has an advisory, and logs the healthy ones.
    7. A flow level error handler reports any failed audit to Slack.

    ## What you get

    - A per package verdict built from live pub.dev data, not from a hard coded list.
    - One Slack alert per risky dependency with the locked version, the latest version and a link to the package page.
    - Retries with backoff on every pub.dev call and a failure alert when the audit breaks.

    ## Who it's for

    - Mobile and Flutter engineers who ship apps with many third party packages.
    - Platform and security teams that track supply chain risk across app repositories.

    ## Why orchestrate this with Kestra

    A cron script has no retries, no per package history and no secret masking. Kestra gives each package its own execution and logs, retries transient errors, limits concurrency and keeps the Slack URL out of the code.

    ## Prerequisites

    - A public or reachable raw URL for the pubspec.lock you want to audit.
    - A Slack incoming webhook.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack incoming webhook that receives risk and failure alerts (required).
    - `PUBDEV_WATCH_WEBHOOK_KEY`: key segment of the webhook trigger URL, for example the one used by a GitHub push webhook (required).

    ## Quick start

    1. Add the two secrets in your Kestra namespace.
    2. Import this blueprint and run it once with the default pubspec_lock_url.
    3. Replace the URL with the raw pubspec.lock of your app and enable the weekly schedule.

    ## How to extend

    - Open a GitHub issue per risky package with the GitHub plugin instead of a Slack message.
    - Audit several repositories by passing a list of lockfile URLs to an outer loop.

    ## Links

    - [pub.dev API documentation](https://pub.dev/help/api)
    - [Kestra Slack plugin](https://kestra.io/plugins/plugin-slack)
    - [Kestra HTTP request task](https://kestra.io/plugins/core/tasks/http/io.kestra.plugin.core.http.request)
  tags:
    - Infrastructure
  subTags:
    - Day 2 Operations
    - Monitoring & Alerting
  ee: false
  demo: false
