id: pyroscope-ingestion-health-and-app-coverage-sentinel
namespace: company.team
description: |
  Audits Grafana Pyroscope continuous profiling server instances on a schedule,
  verifying ingester readiness, detecting service profiling dropouts against
  expected application coverage quotas, and dispatching actionable Slack alerts.

triggers:
  - id: periodic_profiling_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: "Periodically audits Grafana Pyroscope ingester readiness and active application profiling streams. Shipped disabled by default; enable once pyroscope_host and pyroscope_port point to a running Pyroscope instance."
    cron: "*/15 * * * *"
    disabled: true
    inputs:
      pyroscope_host: "localhost"
      pyroscope_port: 4040
      min_expected_apps: 1
      alert_channel: "#observability-alerts"

inputs:
  - id: pyroscope_host
    type: STRING
    displayName: "Pyroscope Host"
    defaults: "localhost"
    description: "Hostname or IP address of the Grafana Pyroscope server."

  - id: pyroscope_port
    type: INT
    displayName: "Pyroscope Port"
    defaults: 4040
    description: "HTTP API port exposed by the Grafana Pyroscope instance (default: 4040)."

  - id: min_expected_apps
    type: INT
    displayName: "Minimum Expected Profiling Applications"
    defaults: 1
    description: "Minimum count of active application profiling streams expected in Pyroscope. A lower count signals profiling agent dropouts."

  - id: alert_channel
    type: STRING
    displayName: "Slack Alert Channel"
    defaults: "#observability-alerts"
    description: "Slack channel where operational profiling health notifications are dispatched."

tasks:
  - id: probe_pyroscope_readiness
    type: io.kestra.plugin.core.http.Request
    description: "Queries Grafana Pyroscope GET /ready endpoint to verify that ingester components and storage rings are ready to accept profiling data."
    uri: "http://{{ inputs.pyroscope_host }}:{{ inputs.pyroscope_port }}/ready"
    method: GET
    headers:
      Accept: "text/plain"
    options:
      allowFailed: true

  - id: probe_active_apps
    type: io.kestra.plugin.core.http.Request
    description: "Fetches active application profiling streams from Pyroscope GET /api/apps endpoint to measure continuous profiling coverage."
    uri: "http://{{ inputs.pyroscope_host }}:{{ inputs.pyroscope_port }}/api/apps"
    method: GET
    headers:
      Accept: "application/json"
    options:
      allowFailed: true

  - id: classify_pyroscope_status
    type: io.kestra.plugin.core.flow.Switch
    description: "Evaluates ingester HTTP readiness code and active profiling stream count to classify operational state."
    value: >-
      {% if outputs.probe_pyroscope_readiness.code != 200 %}
      INGESTER_DEGRADED
      {% elif (fromJson(outputs.probe_active_apps.body) ?? []) | length < inputs.min_expected_apps %}
      APPLICATION_COVERAGE_DEFICIT
      {% else %}
      HEALTHY
      {% endif %}
    cases:
      INGESTER_DEGRADED:
        - id: alert_ingester_degraded
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: "Dispatches critical operational alert when Pyroscope ingester is degraded or rejecting profile ingestion."
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "channel": "{{ inputs.alert_channel }}",
              "text": ":rotating_light: *Grafana Pyroscope Ingester Degraded*",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":rotating_light: *Grafana Pyroscope Ingester Degraded*\n*Host:* `{{ inputs.pyroscope_host }}:{{ inputs.pyroscope_port }}`\n*Readiness Status Code:* `{{ outputs.probe_pyroscope_readiness.code }}`\n*Impact:* Profiling agents (Go, Java, eBPF, Python) cannot submit stack traces. Ingester ring or storage blocks may be saturated."
                  }
                }
              ]
            }

      APPLICATION_COVERAGE_DEFICIT:
        - id: alert_coverage_deficit
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: "Dispatches warning alert when the number of active profiling streams drops below the expected threshold."
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "channel": "{{ inputs.alert_channel }}",
              "text": ":warning: *Grafana Pyroscope Profiling Coverage Deficit*",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":warning: *Continuous Profiling Coverage Deficit*\n*Host:* `{{ inputs.pyroscope_host }}:{{ inputs.pyroscope_port }}`\n*Active Applications:* `{{ (fromJson(outputs.probe_active_apps.body) ?? []) | length }}` (Expected minimum: `{{ inputs.min_expected_apps }}`)\n*Impact:* One or more microservices have stopped streaming continuous profiling data. Profiling agents may have crashed or network egress failed."
                  }
                }
              ]
            }

      HEALTHY:
        - id: log_healthy_state
          type: io.kestra.plugin.core.log.Log
          message: "Grafana Pyroscope profiling server healthy on {{ inputs.pyroscope_host }}:{{ inputs.pyroscope_port }}. Ingester ready, active applications: {{ (fromJson(outputs.probe_active_apps.body) ?? []) | length }} (threshold: {{ inputs.min_expected_apps }})."

  - id: log_audit_complete
    type: io.kestra.plugin.core.log.Log
    description: "Persists final execution audit trail with host address and application profiling count for compliance history."
    message: "Pyroscope profiling sentinel audit completed for {{ inputs.pyroscope_host }}:{{ inputs.pyroscope_port }}. Active apps: {{ (fromJson(outputs.probe_active_apps.body) ?? []) | length }}."

errors:
  - id: alert_pyroscope_unreachable
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: "Dispatches out-of-band notification if Pyroscope server cannot be reached."
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "{{ inputs.alert_channel }}",
        "text": ":rotating_light: *Grafana Pyroscope Server Unreachable*",
        "blocks": [
          {
            "type": "section",
            "text": {
              "type": "mrkdwn",
              "text": ":rotating_light: *Pyroscope Connectivity Outage*\nFailed to connect to Grafana Pyroscope HTTP endpoint at `http://{{ inputs.pyroscope_host }}:{{ inputs.pyroscope_port }}`. The server container may be down or network connectivity interrupted."
            }
          }
        ]
      }

extend:
  title: Grafana Pyroscope Ingestion Health & Application Coverage Sentinel
  metaTitle: Pyroscope Ingestion Health & App Coverage Sentinel | Kestra
  shortDescription: Audit Grafana Pyroscope ingester readiness, track continuous profiling application coverage, and alert Slack on dropouts.
  metaDescription: Audit Grafana Pyroscope ingester readiness, track continuous profiling app coverage, and dispatch Slack alerts on profiling dropouts.
  description: |
    Monitors standalone and cluster Grafana Pyroscope continuous profiling deployments in real time, verifying ingester readiness and asserting that expected microservice applications are actively streaming profiling data to prevent blind spots during performance investigations.

    ## How it works

    1. `periodic_profiling_audit` (`io.kestra.plugin.core.trigger.Schedule`) fires every 15 minutes with target connection details and coverage thresholds. Shipped disabled by default to facilitate safe initial verification.
    2. `probe_pyroscope_readiness` (`io.kestra.plugin.core.http.Request`) probes `GET /ready` to ensure the Pyroscope ingester ring and tenant distributors are fully operational.
    3. `probe_active_apps` (`io.kestra.plugin.core.http.Request`) queries `GET /api/apps` to retrieve the list of all currently reporting profiling applications.
    4. `classify_pyroscope_status` (`io.kestra.plugin.core.flow.Switch`) routes execution:
       - `INGESTER_DEGRADED`: Triggers when `/ready` returns a non-200 status code (e.g. 503 during ingester ring backpressure or storage saturation), dispatching an urgent alert to `#observability-alerts` via `io.kestra.plugin.slack.notifications.SlackIncomingWebhook`.
       - `APPLICATION_COVERAGE_DEFICIT`: Triggers when active application count is below `min_expected_apps`, dispatching a Slack warning alerting SREs to profiling agent dropouts.
       - `HEALTHY`: Confirms ingester readiness and expected coverage, logging operational status via `io.kestra.plugin.core.log.Log`.
    5. `log_audit_complete` always records execution completion and active application counts for long-term auditability.
    6. The global `errors` block intercepts connection drops or socket errors to immediately notify on-call engineers when the Pyroscope container is unreachable.

    ## What you get

    - Early warning when Pyroscope ingesters enter backpressure and drop application profile samples.
    - Proactive detection of profiling agent dropouts (e.g., following microservice redeployments or failed sidecar injections).
    - Seamless integration with Slack alerting pipelines using standard webhook endpoints.
    - Clean observability history capturing exactly when profiling coverage was compromised.

    ## Who it's for

    - Site Reliability Engineers (SREs) and Platform Engineers maintaining observability infrastructure.
    - Performance Engineering teams relying on continuous profiling (pprof, async-profiler, eBPF) for flame graph analysis.
    - DevOps engineers managing Grafana LGTM stack deployments (Loki, Grafana, Tempo, Mimir, Pyroscope).

    ## Why orchestrate this with Kestra

    Continuous profiling is vital for root-cause latency analysis and memory leak detection, yet the profiling infrastructure itself is rarely monitored for coverage dropouts. Static ping checks cannot parse the active application array or assert whether required services are actively streaming profiles. Kestra provides declarative scheduling, robust error handling, secure credential management, and structured alerting.

    ## Prerequisites

    - A running Grafana Pyroscope instance (version 1.0+), reachable over HTTP. Grafana publishes an official open-source Docker image (`grafana/pyroscope:latest`) requiring no license key or paid account.
    - A Slack incoming webhook URL configured for operational alerts.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack incoming webhook URL used by `alert_ingester_degraded`, `alert_coverage_deficit`, and the global `errors` handler.

    ## Quick start

    1. Start a local Grafana Pyroscope container:
       ```bash
       docker run -d --name pyroscope-test -p 4040:4040 grafana/pyroscope:latest
       ```
    2. Configure the `SLACK_WEBHOOK_URL` secret in your Kestra namespace.
    3. Import this blueprint into Kestra and trigger an execution with default inputs (`min_expected_apps: 0`).
    4. Confirm that `log_healthy_state` logs nominal readiness.
    5. Set `min_expected_apps: 5` and re-run to verify that `APPLICATION_COVERAGE_DEFICIT` alerts Slack when reporting services fall below threshold.
    6. Enable `periodic_profiling_audit` once verified.

    ## How to extend

    - Add an array comparison step using `io.kestra.plugin.core.flow.EachSequential` to check for specific mandatory service names (e.g., `checkout-service.cpu`, `auth-service.inuse_space`).
    - Integrate with PagerDuty using `io.kestra.plugin.pagerduty.notifications.PagerDutyAlert` when `INGESTER_DEGRADED` fires in critical production environments.
    - Query Pyroscope's `/metrics` endpoint to monitor compactor block counts and long-term disk retention trends.

    ## Links

    - [Grafana Pyroscope Official Documentation](https://grafana.com/docs/pyroscope/latest/)
    - [Grafana Pyroscope HTTP API Reference](https://grafana.com/docs/pyroscope/latest/reference/http-api/)
    - [Grafana Pyroscope Official Docker Hub Image](https://hub.docker.com/r/grafana/pyroscope)
    - [Kestra HTTP Request Plugin Documentation](https://kestra.io/plugins/plugin-core/tasks/http/io.kestra.plugin.core.http.request)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack/notifications/io.kestra.plugin.slack.notifications.slackincomingwebhook)
  tags:
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - Day 2 Operations
  ee: false
  demo: false
