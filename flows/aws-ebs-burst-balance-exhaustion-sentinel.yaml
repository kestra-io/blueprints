id: aws-ebs-burst-balance-exhaustion-sentinel
namespace: company.cloud

inputs:
  - id: aws_region
    type: STRING
    defaults: "us-east-1"
    description: Target AWS region.
  - id: volume_id
    type: STRING
    description: Amazon EBS gp2 Volume ID (e.g., vol-0123456789abcdef0).
  - id: min_burst_balance_pct
    type: FLOAT
    defaults: 25.0
    description: Minimum acceptable BurstBalance percentage before triggering I/O bottleneck alert.

tasks:
  - id: query_ebs_burst_balance
    type: io.kestra.plugin.aws.cli.AwsCLI
    region: "{{ inputs.aws_region }}"
    accessKeyId: "{{ secret('AWS_ACCESS_KEY_ID') }}"
    secretKeyId: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
    commands:
      - |
        START_TIME=$(date -u -v-30M +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || date -u -d "30 minutes ago" +%Y-%m-%dT%H:%M:%SZ)
        END_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
        
        aws cloudwatch get-metric-data           --metric-data-queries '[{"Id":"bbal","MetricStat":{"Metric":{"Namespace":"AWS/EBS","MetricName":"BurstBalance","Dimensions":[{"Name":"VolumeId","Value":"{{ inputs.volume_id }}"}]},"Period":300,"Stat":"Minimum"}}]'           --start-time "$START_TIME"           --end-time "$END_TIME"           --output json > /tmp/ebs_burst.json
        
        BURST_BALANCE=$(jq '.MetricDataResults[0].Values[0] // 100' /tmp/ebs_burst.json)
        
        echo "::set-output name=burst_balance::$BURST_BALANCE::"

  - id: evaluate_burst_balance
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.query_ebs_burst_balance.vars.burst_balance | float < inputs.min_burst_balance_pct }}"
    then:
      - id: notify_storage_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#infrastructure-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 AWS EBS Volume IOPS Burst Balance Exhaustion Alert",
                "text": "EBS Volume `{{ inputs.volume_id }}` BurstBalance has dropped to *{{ outputs.query_ebs_burst_balance.vars.burst_balance }}%* (warning threshold: {{ inputs.min_burst_balance_pct }}%). Impact: gp2 volume I/O throughput is collapsing to baseline (3 IOPS/GiB), causing disk write stalls, frozen databases, and unresponsive EC2 instances.",
                "footer": "Kestra Cloud Sentinel • AWS EBS"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#infrastructure-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ EBS Burst Balance Sentinel Execution Failed",
            "text": "The EBS BurstBalance CloudWatch query workflow failed. Please verify AWS credentials and Volume ID.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true
    inputs:
      volume_id: replace-with-your-volume-id

extend:
  metaDescription: "Audits Amazon EBS CloudWatch metrics to detect gp2 volume burst balance depletion and storage I/O throughput collapse."
  metaTitle: AWS EBS General Purpose gp2 Volume Burst Balance Exhaustion Sentinel with Kestra
  title: AWS EBS General Purpose gp2 Volume Burst Balance Exhaustion Sentinel
  shortDescription: Audits Amazon EBS CloudWatch metrics to detect gp2 volume burst balance depletion and storage I/O throughput collapse.
  description: |
    ## How it works
    This workflow connects to Amazon CloudWatch via the AWS CLI plugin to sample the `BurstBalance` metric for designated general purpose gp2 EBS volumes. Under sustained disk I/O, gp2 volumes deplete their burst bucket down to 0%, collapsing disk performance to baseline (3 IOPS per GiB). When the burst balance falls below safety thresholds, an automated Slack incident notification is dispatched.

    ## What you get
    - Proactive detection of impending disk I/O starvation before databases freeze.
    - Prevents kernel I/O wait lockups and application thread pool starvation.
    - Actionable recommendation to migrate to gp3 (which provides baseline 3,000 IOPS regardless of volume size).

    ## Who it's for
    - Storage Engineers and SREs maintaining production EC2 instances and database volumes.
    - Cloud Architects modernizing legacy EBS storage volumes to gp3.

    ## Why orchestrate this with Kestra
    - **Native Telemetry Sampling**: Execute authenticated CloudWatch queries using `io.kestra.plugin.aws.cli.AwsCLI`.
    - **Automated Workflow Orchestration**: Centralize storage health audits with enterprise notifications in one flow.
    - **Remediation Ready**: Can be configured to invoke `aws ec2 modify-volume --volume-type gp3` automatically.

    ## Prerequisites
    - AWS IAM credentials with `cloudwatch:GetMetricData` permissions.
    - Secrets `AWS_ACCESS_KEY_ID`, `AWS_SECRET_ACCESS_KEY`, and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import this blueprint into Kestra.
    2. Supply your EBS volume ID and configure secrets.
    3. Run the workflow to inspect current IOPS burst balance reserves.

    ## How to extend
    - Query all gp2 volumes attached to running EC2 instances dynamically.
    - Automatically trigger volume modification from gp2 to gp3.

    ## Links
    - [Amazon EBS Volume Metrics in CloudWatch](https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/using_cloudwatch_ebs.html)
    - [Kestra AWS Plugin](https://kestra.io/plugins/plugin-aws)
  tags:
    - Cloud
    - Infrastructure
  subTags:
    - AWS Services
    - Infrastructure Automation
  ee: false
  verified: false
  demo: false
