id: crossref-journal-sqlite-catalog
namespace: company.research
description: Maintain a journal research watchlist in SQLite and report newly discovered papers and metadata changes
  since the previous successful run.
inputs:
- id: issn
  type: STRING
  defaults: 2475-9066
  validator: ^\d{4}-\d{3}[\dXx]$
  description: Journal ISSN; defaults to the Journal of Open Source Software.
- id: lookback_days
  type: INT
  defaults: 7
  min: 1
  max: 365
- id: page_size
  type: INT
  defaults: 1000
  min: 1
  max: 1000
  description: Maximum works in a snapshot. If more match, narrow the lookback; the flow fails instead of exporting
    a partial catalog.
triggers:
- id: daily
  type: io.kestra.plugin.core.trigger.Schedule
  cron: 0 7 * * *
  timezone: UTC
tasks:
- id: previous_catalog
  type: io.kestra.plugin.core.kv.Get
  key: '{{ flow.id }}_v1_{{ inputs.issn | upper }}'
  errorOnMissing: false
  description: Read the last successful catalog URI; the journal ISSN isolates saved histories.
- id: fetch_works
  type: io.kestra.plugin.core.http.Download
  uri: https://api.crossref.org/journals/{{ inputs.issn }}/works?filter=from-pub-date:{{ now() | dateAdd(-inputs.lookback_days,
    'DAYS') | date('yyyy-MM-dd') }},until-pub-date:{{ now() | date('yyyy-MM-dd') }}&rows={{ inputs.page_size }}&sort=published&order=desc
  headers:
    User-Agent: kestra-crossref-journal-catalog/1.0 (https://kestra.io)
    Accept: application/json
  retry:
    type: exponential
    interval: PT5S
    maxInterval: PT1M
    maxAttempts: 3
- id: inspect_response
  type: io.kestra.plugin.scripts.python.Script
  containerImage: python:3.13-slim
  inputFiles:
    response.json: '{{ outputs.fetch_works.uri }}'
  script: |
    import json
    from pathlib import Path

    response = json.loads(Path("response.json").read_text())
    if response.get("status") != "ok" or response.get("message-type") != "work-list":
        raise ValueError("Crossref did not return a successful work-list")
    message = response["message"]
    items = message["items"]
    total = message["total-results"]
    if not isinstance(items, list) or not isinstance(total, int) or total < 0:
        raise ValueError("Invalid Crossref result structure")
    print("::" + json.dumps({"outputs": {
        "complete": total == len(items),
        "matched": total,
        "received": len(items)
    }}) + "::")
- id: require_complete_snapshot
  type: io.kestra.plugin.core.flow.If
  condition: '{{ outputs.inspect_response.vars.complete }}'
  then:
  - id: build_catalog
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.13-slim
    inputFiles:
      response.json: '{{ outputs.fetch_works.uri }}'
      previous.sqlite: '{{ outputs.previous_catalog.value ?? '''' }}'
    outputFiles:
    - catalog.sqlite
    - works.csv
    - new-works.csv
    - changes.json
    - report.md
    - summary.json
    script: |
      import csv
      import html
      import json
      import os
      import re
      import shutil
      import sqlite3
      from datetime import datetime, timezone
      from pathlib import Path
      from urllib.parse import quote

      message = json.loads(Path("response.json").read_text())["message"]
      issn = os.environ["JOURNAL_ISSN"].upper()
      had_previous = os.environ["HAD_PREVIOUS"].lower() == "true"
      timestamp = datetime.now(timezone.utc).isoformat()
      fields = ["title", "published", "authors", "journal", "work_type"]
      columns = ["doi", *fields, "doi_url", "citation_count", "source_json", "first_seen", "last_seen"]

      if had_previous:
          if not Path("previous.sqlite").is_file() or Path("previous.sqlite").stat().st_size == 0:
              raise ValueError("The checkpoint exists but its database is missing or empty")
          shutil.copyfile("previous.sqlite", "catalog.sqlite")

      records = {}
      for item in message["items"]:
          doi = str(item.get("DOI") or "").strip().lower()
          if not re.fullmatch(r"10\.\d{4,9}/\S+", doi):
              raise ValueError(f"Missing or invalid DOI: {doi!r}")
          parts = item.get("published", {}).get("date-parts", [[]])[0]
          published = "-".join(str(p).zfill(4 if i == 0 else 2) for i, p in enumerate(parts))
          authors = [a.get("name") or " ".join(filter(None, [a.get("given"), a.get("family")]))
                     for a in item.get("author", [])]
          records[doi] = {
              "doi": doi, "title": " ".join(item.get("title", [])), "published": published,
              "authors": "; ".join(authors), "journal": " ".join(item.get("container-title", [])),
              "work_type": item.get("type", ""), "doi_url": "https://doi.org/" + quote(doi, safe="/"),
              "citation_count": int(item.get("is-referenced-by-count", 0)),
              "source_json": json.dumps(item, ensure_ascii=False),
              "first_seen": timestamp, "last_seen": timestamp
          }

      new = []
      changed = []
      db = sqlite3.connect("catalog.sqlite")
      db.row_factory = sqlite3.Row
      try:
          with db:
              if had_previous:
                  if db.execute("PRAGMA integrity_check").fetchone()[0] != "ok":
                      raise ValueError("Previous catalog failed its integrity check")
                  metadata = dict(db.execute("SELECT key, value FROM catalog_metadata"))
                  if metadata.get("schema_version") != "1" or metadata.get("issn") != issn:
                      raise ValueError("Checkpoint belongs to a different journal or schema version")
              else:
                  db.execute("""CREATE TABLE works (
                      doi TEXT PRIMARY KEY, title TEXT NOT NULL, published TEXT, authors TEXT,
                      journal TEXT, work_type TEXT, doi_url TEXT, citation_count INTEGER,
                      source_json TEXT NOT NULL, first_seen TEXT NOT NULL, last_seen TEXT NOT NULL)""")
                  db.execute("CREATE INDEX works_published ON works(published)")
                  db.execute("""CREATE TABLE metadata_changes (
                      id INTEGER PRIMARY KEY, doi TEXT NOT NULL, detected_at TEXT NOT NULL,
                      changed_fields TEXT NOT NULL, before_json TEXT NOT NULL, after_json TEXT NOT NULL)""")
                  db.execute("CREATE TABLE catalog_metadata (key TEXT PRIMARY KEY, value TEXT NOT NULL)")
                  db.executemany("INSERT INTO catalog_metadata VALUES (?,?)", [("schema_version", "1"), ("issn", issn)])
              for doi, record in sorted(records.items()):
                  previous = db.execute("SELECT * FROM works WHERE doi = ?", (doi,)).fetchone()
                  if previous is None:
                      new.append({k: record[k] for k in columns if k != "source_json"})
                  else:
                      record["first_seen"] = previous["first_seen"]
                      updated_fields = [k for k in fields if previous[k] != record[k]]
                      if updated_fields:
                          before = {k: previous[k] for k in fields}
                          after = {k: record[k] for k in fields}
                          changed.append({"doi": doi, "title": record["title"], "doi_url": record["doi_url"],
                                          "changed_fields": updated_fields, "before": before, "after": after})
                          db.execute("INSERT INTO metadata_changes (doi, detected_at, changed_fields, before_json, after_json) VALUES (?,?,?,?,?)",
                                     (doi, timestamp, json.dumps(updated_fields), json.dumps(before), json.dumps(after)))
                  db.execute("""INSERT INTO works VALUES (:doi,:title,:published,:authors,:journal,:work_type,
                      :doi_url,:citation_count,:source_json,:first_seen,:last_seen)
                      ON CONFLICT(doi) DO UPDATE SET title=excluded.title, published=excluded.published,
                      authors=excluded.authors, journal=excluded.journal, work_type=excluded.work_type,
                      doi_url=excluded.doi_url, citation_count=excluded.citation_count,
                      source_json=excluded.source_json, last_seen=excluded.last_seen""", record)
              if db.execute("PRAGMA integrity_check").fetchone()[0] != "ok":
                  raise RuntimeError("Updated SQLite catalog failed its integrity check")
          count = db.execute("SELECT COUNT(*) FROM works").fetchone()[0]
          csv_columns = [k for k in columns if k != "source_json"]
          with open("works.csv", "w", newline="", encoding="utf-8") as handle:
              writer = csv.writer(handle)
              writer.writerow(csv_columns)
              writer.writerows(tuple(row[k] for k in csv_columns) for row in db.execute("SELECT * FROM works ORDER BY doi"))
          with open("new-works.csv", "w", newline="", encoding="utf-8") as handle:
              writer = csv.DictWriter(handle, fieldnames=csv_columns)
              writer.writeheader()
              writer.writerows(new)
      finally:
          db.close()

      summary = {
          "retrieved_at": timestamp, "issn": issn, "first_run": not had_previous,
          "matched": message["total-results"], "fetched_unique_dois": len(records),
          "catalog_total": count, "new_works": len(new), "changed_works": len(changed),
          "duplicate_records": len(message["items"]) - len(records),
          "source": "Crossref REST API", "scope": "Publication-date window merged into saved history"
      }
      Path("summary.json").write_text(json.dumps(summary, indent=2), encoding="utf-8")
      Path("changes.json").write_text(json.dumps({"summary": summary, "new": new, "changed": changed}, ensure_ascii=False, indent=2), encoding="utf-8")

      def md(value):
          value = html.escape(" ".join(str(value).split()), quote=False)
          return re.sub(r"([\\`*_{}\[\]()#!|])", r"\\\1", value)

      report = [f"# Journal watch: {issn}", "", f"Run: {timestamp}", "",
                f"**{len(new)} new** · **{len(changed)} changed** · **{count} saved papers**", ""]
      if not had_previous:
          report += ["First run: these are baseline discoveries, not papers confirmed new since a previous run.", ""]
      report += ["## New since the previous successful run", ""]
      report += ([f"- [{md(item['title'] or item['doi'])}]({item['doi_url']}) — {md(item['published'] or 'date unavailable')}"
                  for item in new] or ["No newly discovered papers in the fetched window."])
      report += ["", "## Metadata changes", ""]
      report += ([f"- [{md(item['title'] or item['doi'])}]({item['doi_url']}): {', '.join(item['changed_fields'])}"
                  for item in changed] or ["No changes to tracked metadata in the fetched window."])
      report += ["", "Only records in the fetched publication window are checked. Older saved papers remain in the catalog.",
                 "Citation-count changes are saved but do not generate metadata-change entries.", ""]
      Path("report.md").write_text("\n".join(report), encoding="utf-8")
      print("::" + json.dumps({"outputs": {"catalog_total": count, "new_works": len(new), "changed_works": len(changed)}}) + "::")
    description: Merge the fetched window into saved history; export a new-papers report and a metadata-change audit
      trail.
    env:
      JOURNAL_ISSN: '{{ inputs.issn }}'
      HAD_PREVIOUS: '{{ (outputs.previous_catalog.value ?? '''') != '''' }}'
  - id: save_checkpoint
    type: io.kestra.plugin.core.kv.Set
    key: '{{ flow.id }}_v1_{{ inputs.issn | upper }}'
    value: '{{ outputs.build_catalog.outputFiles[''catalog.sqlite''] }}'
    kvType: STRING
    description: Advance the checkpoint only after every output file has been generated successfully.
  else:
  - id: refuse_truncation
    type: io.kestra.plugin.core.execution.Fail
    errorMessage: Crossref matched {{ outputs.inspect_response.vars.matched }} works but returned {{ outputs.inspect_response.vars.received
      }}. Narrow lookback_days or increase page_size (maximum 1000). No catalog was exported. Saved history was
      not changed.
outputs:
- id: matched_works
  type: INT
  value: '{{ outputs.inspect_response.vars.matched }}'
- id: catalog_total
  type: INT
  value: '{{ outputs.build_catalog.vars.catalog_total }}'
- id: new_works
  type: INT
  value: '{{ outputs.build_catalog.vars.new_works }}'
- id: changed_works
  type: INT
  value: '{{ outputs.build_catalog.vars.changed_works }}'
extend:
  title: Crossref Journal Watchlist with Saved History and New-Paper Reports
  metaTitle: Crossref Research Watchlist and SQLite History | Kestra
  shortDescription: Track journal papers across runs, report newly discovered DOIs and metadata changes, and keep
    a verified SQLite history.
  metaDescription: Track Crossref journal papers in SQLite, discover new DOIs, audit metadata changes, and download
    daily reports without repeating old papers.
  description: |
    Keep a journal watchlist from Crossref's public API. Each run merges a bounded
    publication-date window into saved SQLite history, keyed by lowercase DOI.
    The default journal is the Journal of Open Source Software.

    ## How it works

    1. A daily UTC schedule reads the journal's last successful catalog URI from KV.
    2. Download recent works and reject incomplete API responses before writing history.
    3. Merge new DOIs, preserve first-seen times, update last-seen times, and audit
       changes to title, authors, publication date, journal, and work type.
    4. Export the catalog and reports, then advance the KV checkpoint. Queued
       executions prevent overlapping runs from overwriting each other's state.

    ## What you get

    - `catalog.sqlite`: all observed papers, raw metadata, first/last-seen timestamps,
      and a `metadata_changes` table with before/after values.
    - `works.csv`: accumulated papers; `new-works.csv`: only this run's new DOIs.
    - `report.md`: a readable new-paper and metadata-change digest.
    - `changes.json` and `summary.json`: machine-readable deltas and provenance.
    - First-run discoveries are labeled as a baseline. Identical repeat runs report
      zero new papers. Empty windows keep prior history; citation-count changes
      update the catalog without creating metadata-change alerts.

    ## Who it's for

    Research data engineers and library teams following journal publications.
    Citation counts are Crossref's values, not an exhaustive impact measure.

    ## Why orchestrate this with Kestra

    Kestra coordinates retries, completeness checks, artifact storage, and a
    checkpoint committed only after outputs succeed. Failed fetches, invalid prior
    databases, and truncated responses do not advance saved history.

    ## Prerequisites

    - Kestra with the Python plugin, Docker, and outbound HTTPS to api.crossref.org.
    - Durable Kestra database and internal storage. Retain the execution artifacts
      referenced by the current checkpoint; purging them breaks history restoration.

    ### Secrets

    None. The public Crossref endpoint needs no API key.

    ## Quick start

    1. Import the runnable YAML without the catalog-only `extend` block.
    2. Execute with defaults, then download the build_catalog reports.
    3. Execute again: previously discovered DOIs should not appear as new.
    4. Set your ISSN and window, then enable the daily schedule. Histories are
       separate per ISSN and namespace. A missing checkpoint starts a new baseline.
    5. If matches exceed page_size (maximum 1,000), narrow the window.

    ## How to extend

    Add cursor pagination, keyword filters, or delivery to your preferred channel.
    Only the fetched window is refreshed: older metadata revisions and gaps longer
    than the lookback require explicit backfills. No paper is deleted just because
    it falls outside the current window.

    ## Links

    - [Crossref API](https://github.com/CrossRef/rest-api-doc)
    - [Python Script](https://kestra.io/plugins/plugin-script-python/io.kestra.plugin.scripts.python.script)
    - [KV Set](https://kestra.io/plugins/core/kv/io.kestra.plugin.core.kv.set)
  tags:
  - Data
  subTags:
  - ELT & Data Landing
  - Testing & Quality
  ee: false
  demo: false
concurrency:
  limit: 1
  behavior: QUEUE
