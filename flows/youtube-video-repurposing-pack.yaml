id: youtube-video-repurposing-pack
namespace: company.team
description: |
  Turn every new YouTube upload into a ready-to-review content pack. Wait for
  the video's captions, distill the transcript into a content brief with an
  LLM, then draft a YouTube description with chapters, an X thread, a LinkedIn
  post and a newsletter section in parallel. The drafts land in Slack, and the
  whole pack is saved as a Markdown file on the execution.

triggers:
  - id: on_new_upload
    type: io.kestra.plugin.youtube.VideoTrigger
    description: Poll your channel every 5 minutes and start an execution when a new video is published, including unlisted ones. Set your channel ID, then enable it.
    accessToken: "{{ kv('YOUTUBE_ACCESS_TOKEN') }}"
    channelId: UC_your_channel_id
    interval: PT5M
    maxResults: 5
    disabled: true

inputs:
  - id: video_id
    type: STRING
    displayName: Video ID
    description: For manual runs and backfills, the ID of one of your own videos (the part after `v=` in the URL). Uploads detected by the trigger ignore this.
    required: false
  - id: brand_voice
    type: STRING
    displayName: Brand voice
    description: How the drafts should sound. Passed to every writing prompt.
    defaults: Friendly and practical, plain language, no hype, no emojis.

variables:
  claude_model: claude-opus-5-5
  formats:
    seo_description: YouTube description with chapters
    x_thread: X thread
    linkedin_post: LinkedIn post
    newsletter: Newsletter section

tasks:
  - id: dedupe_trigger_runs
    type: io.kestra.plugin.core.flow.If
    description: Each poll looks back over the interval plus 5 minutes, so the same upload is seen by two polls. Triggered runs claim the video ID in KV and stop if it was already claimed. Manual runs skip this check, so a video can always be reprocessed by hand.
    condition: "{{ trigger.videoId ?? '' }}"
    then:
      - id: skip_if_claimed
        type: io.kestra.plugin.core.flow.If
        description: Stop if an earlier execution already took this upload.
        condition: "{{ kv('yt_pack_' ~ trigger.videoId, errorOnMissing=false) is not null }}"
        then:
          - id: already_processed
            type: io.kestra.plugin.core.execution.Exit
            description: End quietly, another execution is handling this upload.
            state: SUCCESS

      - id: claim_video
        type: io.kestra.plugin.core.kv.Set
        description: Claim the upload before the caption wait, which can take hours, so later polls skip it.
        key: "yt_pack_{{ trigger.videoId }}"
        value: "{{ execution.id }}"
        ttl: P30D

  - id: get_token
    type: io.kestra.plugin.youtube.OAuth2
    description: Exchange the refresh token for a short-lived access token used by the API calls below.
    clientId: "{{ secret('YOUTUBE_CLIENT_ID') }}"
    clientSecret: "{{ secret('YOUTUBE_CLIENT_SECRET') }}"
    refreshToken: "{{ secret('YOUTUBE_REFRESH_TOKEN') }}"

  - id: video_details
    type: io.kestra.plugin.youtube.VideoStats
    description: Read the video's title, description and duration. Uploads from the trigger take precedence over the `video_id` input.
    accessToken: "{{ outputs.get_token.accessToken }}"
    videoIds:
      - "{{ trigger.videoId ?? inputs.video_id }}"
    includeSnippet: true
    includeContentDetails: true

  - id: wait_for_captions
    type: io.kestra.plugin.core.flow.LoopUntil
    description: Auto-generated captions can take minutes to hours after upload. Check every 15 minutes for up to 6 hours, refreshing the token on each check.
    condition: "{{ fromJson(outputs.check_captions.body).items | length > 0 }}"
    failOnMaxReached: true
    checkFrequency:
      interval: PT15M
      maxDuration: PT6H
    tasks:
      - id: loop_token
        type: io.kestra.plugin.youtube.OAuth2
        description: Fresh access token for this check, since the wait can outlive a one-hour token.
        clientId: "{{ secret('YOUTUBE_CLIENT_ID') }}"
        clientSecret: "{{ secret('YOUTUBE_CLIENT_SECRET') }}"
        refreshToken: "{{ secret('YOUTUBE_REFRESH_TOKEN') }}"

      - id: check_captions
        type: io.kestra.plugin.core.http.Request
        description: List the caption tracks available for the video.
        uri: "https://www.googleapis.com/youtube/v3/captions?part=snippet&videoId={{ outputs.video_details.videos[0].videoId }}"
        headers:
          Authorization: "Bearer {{ outputs.loop_token.accessToken }}"

  - id: caption_token
    type: io.kestra.plugin.youtube.OAuth2
    description: Fresh access token for the caption download.
    clientId: "{{ secret('YOUTUBE_CLIENT_ID') }}"
    clientSecret: "{{ secret('YOUTUBE_CLIENT_SECRET') }}"
    refreshToken: "{{ secret('YOUTUBE_REFRESH_TOKEN') }}"

  - id: list_captions
    type: io.kestra.plugin.core.http.Request
    description: List the caption tracks again so the download uses the final set of tracks.
    uri: "https://www.googleapis.com/youtube/v3/captions?part=snippet&videoId={{ outputs.video_details.videos[0].videoId }}"
    headers:
      Authorization: "Bearer {{ outputs.caption_token.accessToken }}"

  - id: download_transcript
    type: io.kestra.plugin.core.http.Download
    description: Download the captions as SRT, preferring a human-made track over the auto-generated one. Only works for videos on your own channel.
    uri: "https://www.googleapis.com/youtube/v3/captions/{{ outputs.list_captions.body | jq('.items | sort_by(.snippet.trackKind == \"asr\") | .[0].id') | first }}?tfmt=srt"
    headers:
      Authorization: "Bearer {{ outputs.caption_token.accessToken }}"

  - id: content_brief
    type: io.kestra.plugin.ai.completion.ChatCompletion
    description: Distill the transcript into a factual brief with summary, key points, chapters and quotes. Every draft is written from this brief, so the transcript is only sent to the model once.
    provider:
      type: io.kestra.plugin.ai.provider.Anthropic
      apiKey: "{{ secret('ANTHROPIC_API_KEY') }}"
      modelName: "{{ vars.claude_model }}"
    configuration:
      maxToken: 16000
    messages:
      - type: SYSTEM
        content: |
          You analyze video transcripts for a content team. Use only what is said in the transcript. Never invent facts, numbers, names or links.
      - type: USER
        content: |
          Video title: {{ outputs.video_details.videos[0].title }}
          Video description: {{ outputs.video_details.videos[0].description }}

          Write a content brief in Markdown with these sections:
          ## Summary
          One paragraph of 3 to 4 sentences.
          ## Key points
          5 to 8 bullets, each one concrete takeaway.
          ## Chapters
          3 to 10 lines in the form `MM:SS Title` (use `H:MM:SS` for videos over an hour). The first chapter must be `00:00`. Take the timestamps from the transcript, keep titles under 50 characters, and space chapters at least 30 seconds apart. Write them as plain lines, not inside a code block.
          ## Quotes
          3 short lines quoted verbatim from the transcript.
          ## Keywords
          5 to 8 search keywords, comma-separated.

          Transcript (SRT):
          {{ read(outputs.download_transcript.uri) }}

  - id: drafts
    type: io.kestra.plugin.core.flow.Parallel
    description: Write the four drafts at the same time, each from the same brief.
    tasks:
      - id: seo_description
        type: io.kestra.plugin.ai.completion.ChatCompletion
        description: YouTube description with a hook, summary, chapters and hashtags, ready to paste into YouTube Studio.
        provider:
          type: io.kestra.plugin.ai.provider.Anthropic
          apiKey: "{{ secret('ANTHROPIC_API_KEY') }}"
          modelName: "{{ vars.claude_model }}"
        configuration:
          maxToken: 16000
        messages:
          - type: SYSTEM
            content: "You write YouTube descriptions in the first person, as the creator of the video. Voice: {{ inputs.brand_voice }}"
          - type: USER
            content: |
              Write the description for the video "{{ outputs.video_details.videos[0].title }}".
              Structure: a two-line hook (it shows above the fold), a short summary paragraph, the chapters copied exactly from the brief under a "Chapters" heading, then 3 hashtags.
              Return only the description text, no commentary.

              Brief:
              {{ outputs.content_brief.textOutput }}

      - id: x_thread
        type: io.kestra.plugin.ai.completion.ChatCompletion
        description: X thread of 5 to 7 posts with the video link in the last post.
        provider:
          type: io.kestra.plugin.ai.provider.Anthropic
          apiKey: "{{ secret('ANTHROPIC_API_KEY') }}"
          modelName: "{{ vars.claude_model }}"
        configuration:
          maxToken: 16000
        messages:
          - type: SYSTEM
            content: "You write X threads in the first person, as the creator of the video promoting their own work. Never refer to \"the creator\". Voice: {{ inputs.brand_voice }}"
          - type: USER
            content: |
              Write a thread of 5 to 7 posts about this video. Number them `1/`, `2/` and so on, keep each post under 270 characters, open with the strongest takeaway, and end the last post with https://www.youtube.com/watch?v={{ outputs.video_details.videos[0].videoId }}
              Return only the thread.

              Brief:
              {{ outputs.content_brief.textOutput }}

      - id: linkedin_post
        type: io.kestra.plugin.ai.completion.ChatCompletion
        description: LinkedIn post of 150 to 250 words with the link at the end.
        provider:
          type: io.kestra.plugin.ai.provider.Anthropic
          apiKey: "{{ secret('ANTHROPIC_API_KEY') }}"
          modelName: "{{ vars.claude_model }}"
        configuration:
          maxToken: 16000
        messages:
          - type: SYSTEM
            content: "You write LinkedIn posts in the first person, as the creator of the video sharing their own work. Never refer to \"the creator\". Voice: {{ inputs.brand_voice }}"
          - type: USER
            content: |
              Write a LinkedIn post of 150 to 250 words about this video. Start with a one-line hook, use short paragraphs, include at most 3 hashtags, and finish with https://www.youtube.com/watch?v={{ outputs.video_details.videos[0].videoId }}
              Return only the post.

              Brief:
              {{ outputs.content_brief.textOutput }}

      - id: newsletter
        type: io.kestra.plugin.ai.completion.ChatCompletion
        description: Newsletter section with a subject line, 250 to 400 words and a call to watch.
        provider:
          type: io.kestra.plugin.ai.provider.Anthropic
          apiKey: "{{ secret('ANTHROPIC_API_KEY') }}"
          modelName: "{{ vars.claude_model }}"
        configuration:
          maxToken: 16000
        messages:
          - type: SYSTEM
            content: "You write email newsletters in the first person, as the creator writing to their own subscribers about their new video. Never refer to \"the creator\". Voice: {{ inputs.brand_voice }}"
          - type: USER
            content: |
              Write a newsletter section about this video: a subject line on the first line prefixed with `Subject:`, then 250 to 400 words built around the key points, then a call to watch at https://www.youtube.com/watch?v={{ outputs.video_details.videos[0].videoId }}
              Return only the newsletter text.

              Brief:
              {{ outputs.content_brief.textOutput }}

  - id: save_pack
    type: io.kestra.plugin.core.storage.Write
    description: Save the brief and all four drafts as one Markdown file attached to the execution.
    extension: .md
    content: |
      # Content pack: {{ outputs.video_details.videos[0].title }}

      Video: https://www.youtube.com/watch?v={{ outputs.video_details.videos[0].videoId }}
      Generated by execution {{ execution.id }}

      {{ outputs.content_brief.textOutput }}

      ---
      ## YouTube description
      {{ outputs.seo_description.textOutput }}

      ---
      ## X thread
      {{ outputs.x_thread.textOutput }}

      ---
      ## LinkedIn post
      {{ outputs.linkedin_post.textOutput }}

      ---
      ## Newsletter
      {{ outputs.newsletter.textOutput }}

  - id: announce_pack
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Tell the channel a new pack is ready. Each draft follows as its own message so it can be copied in one go.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    messageText: |
      *Content pack ready:* {{ outputs.video_details.videos[0].title }}
      https://www.youtube.com/watch?v={{ outputs.video_details.videos[0].videoId }}
      Four drafts below. The full pack with the brief is attached to Kestra execution {{ execution.id }}.

  - id: post_drafts
    type: io.kestra.plugin.core.flow.Loop
    description: Post each draft to Slack in a fixed order.
    values: ["seo_description", "x_thread", "linkedin_post", "newsletter"]
    concurrencyLimit: 1
    tasks:
      - id: post_draft
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: One Slack message per draft.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        messageText: |
          *{{ vars.formats[item.value] }}*

          {{ outputs[item.value].textOutput }}

errors:
  - id: alert_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alert Slack when the pack could not be built, for example when no captions appeared within 6 hours.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    messageText: |
      Content pack FAILED for video {{ trigger.videoId ?? inputs.video_id ?? 'unknown' }} (execution {{ execution.id }}). Check whether the video has captions and whether the YouTube refresh token is still valid.

outputs:
  - id: content_pack
    type: FILE
    displayName: Content pack
    description: Markdown file with the brief and all four drafts.
    value: "{{ outputs.save_pack.uri }}"
  - id: transcript
    type: FILE
    displayName: Transcript
    description: The SRT captions the pack was written from.
    value: "{{ outputs.download_transcript.uri }}"

extend:
  shortDescription: Turn each new YouTube upload into a reviewed content pack (description with chapters, X thread, LinkedIn post and newsletter) using captions and an LLM.
  title: YouTube Video Repurposing Pack with AI
  metaTitle: Repurpose YouTube Videos with AI | Kestra
  description: |
    Publishing the video is only half the job. Creators then spend hours writing chapters and an SEO description, and turning the same ideas into posts for X, LinkedIn and their newsletter. This blueprint does that groundwork every time you upload. It waits for the video's captions, condenses the transcript into a factual brief, and drafts each format in parallel. You get the drafts in Slack to review and copy, plus one Markdown file holding the whole pack. Nothing is published automatically, so you stay in control of what goes out.

    ## How it works
    1. The `on_new_upload` trigger (`io.kestra.plugin.youtube.VideoTrigger`) polls your channel every 5 minutes and starts an execution for each new upload, including unlisted ones, since it reads your uploads with your own token. Each poll looks back over the interval plus 5 minutes, so `dedupe_trigger_runs` records the video ID in the KV store (`yt_pack_<videoId>`, kept for 30 days) and stops any later run for the same video. For manual runs and backfills, pass a `video_id` instead; manual runs are never skipped.
    2. `get_token` (`io.kestra.plugin.youtube.OAuth2`) exchanges your refresh token for an access token, and `video_details` (`io.kestra.plugin.youtube.VideoStats`) reads the title, description and duration.
    3. `wait_for_captions` (`io.kestra.plugin.core.flow.LoopUntil`) checks the YouTube captions API every 15 minutes for up to 6 hours. YouTube's auto-generated captions are often not ready the moment a video goes live, so this lets the flow wait without failing. It gets a new token on every check.
    4. `list_captions` and `download_transcript` (`io.kestra.plugin.core.http.Download`) fetch the captions as SRT, preferring a human-made track over the auto-generated one. The timestamps are what make accurate chapters possible.
    5. `content_brief` (`io.kestra.plugin.ai.completion.ChatCompletion` with Claude Opus 5.5 through the Anthropic provider) turns the transcript into a brief: summary, key points, chapters, verbatim quotes and keywords. The model is told to use only what is said in the video.
    6. `drafts` (`io.kestra.plugin.core.flow.Parallel`) writes four drafts from that brief at the same time: a YouTube description with chapters, an X thread, a LinkedIn post and a newsletter section, all in your `brand_voice`.
    7. `save_pack` (`io.kestra.plugin.core.storage.Write`) stores everything as one Markdown file, exposed as the `content_pack` flow output. `announce_pack` and `post_drafts` (`io.kestra.plugin.core.flow.Loop`) post the drafts to Slack, one message per format, in a fixed order.
    8. If anything fails, for example no captions within 6 hours or a revoked token, `alert_failure` posts to Slack.

    ## What you get
    - A YouTube description with chapters taken from real transcript timestamps, ready to paste into YouTube Studio.
    - Drafts for X, LinkedIn and your newsletter, all written from the same brief and in the same voice.
    - One Markdown file per video with the brief and every draft, downloadable from the execution's Outputs tab.
    - The SRT transcript saved as a second output, for subtitles, blog posts or search.
    - A pipeline that waits for captions instead of failing, and processes each upload once even though polls overlap.

    ## Who it's for
    - YouTube creators and small media teams who repurpose every video by hand today.
    - Developer advocates and course creators who publish tutorials and want chapters and social posts for each one.
    - Agencies running content for several channels, with one flow per channel.

    ## Why orchestrate this with Kestra
    The hard parts here are not the prompts. They are waiting hours for captions without holding a process open, refreshing short-lived OAuth tokens, writing four drafts at once, and keeping every output tied to the video it came from. Kestra handles the waiting with `LoopUntil`, runs the drafts with `Parallel`, keeps secrets out of the flow, and records each run with its transcript and pack as downloadable outputs. If one draft fails, you can replay just that task, and swapping Claude for another provider is a single `provider` change.

    ## Prerequisites
    - A YouTube channel. Captions can only be downloaded for your own videos, so use one of your own video IDs when testing.
    - A Google Cloud project with the **YouTube Data API v3** enabled and an OAuth client. Generate a refresh token with the `https://www.googleapis.com/auth/youtube.force-ssl` scope, which the captions download requires.
    - An Anthropic API key from the Claude Console (console.anthropic.com), created inside a workspace. A key that isn't scoped to a workspace is rejected because Kestra can't send the `anthropic-workspace-id` header.
    - A Slack incoming webhook for the review channel.
    - For the trigger: a fresh access token in the namespace KV store under `YOUTUBE_ACCESS_TOKEN`. The `youtube-token-refresh` blueprint does this. Schedule it at least every 45 minutes (for example `*/45 * * * *`), since access tokens expire after an hour.

    ### Secrets
    - `YOUTUBE_CLIENT_ID`: OAuth client ID from Google Cloud.
    - `YOUTUBE_CLIENT_SECRET`: OAuth client secret.
    - `YOUTUBE_REFRESH_TOKEN`: refresh token for your channel, granted the `youtube.force-ssl` scope.
    - `ANTHROPIC_API_KEY`: Anthropic API key used for the brief and the drafts.
    - `SLACK_WEBHOOK_URL`: Slack incoming webhook that receives the drafts and failure alerts.

    ### Inputs
    - `video_id` (STRING, optional, no default): video to process on manual runs. Trigger runs use the detected upload instead.
    - `brand_voice` (STRING, default `Friendly and practical, plain language, no hype, no emojis.`): tone applied to every draft.

    ### Outputs
    - `{{ outputs.content_pack }}` (flow output) / `{{ outputs.save_pack.uri }}`: Markdown file with the brief and all four drafts.
    - `{{ outputs.transcript }}` (flow output) / `{{ outputs.download_transcript.uri }}`: the SRT transcript.
    - `{{ outputs.content_brief.textOutput }}`: the brief (summary, key points, chapters, quotes, keywords).
    - `{{ outputs.seo_description.textOutput }}`, `{{ outputs.x_thread.textOutput }}`, `{{ outputs.linkedin_post.textOutput }}`, `{{ outputs.newsletter.textOutput }}`: the individual drafts.
    - `{{ outputs.content_brief.tokenUsage }}`: tokens used for the brief, useful for tracking cost.

    ## Quick start
    1. Create the five secrets above.
    2. Save the flow and run it with `video_id` set to one of your own captioned videos. The run finishes in under a minute when captions already exist.
    3. Review the drafts in Slack, and download `content_pack` from the execution's Outputs tab.
    4. To automate it, set `channelId` on the trigger to your channel ID (it starts with `UC`), schedule `youtube-token-refresh` every 45 minutes, and remove `disabled: true` from the trigger.

    ## How to extend
    - Publish automatically after approval: add a `io.kestra.plugin.core.flow.Pause` after the drafts, then post with `io.kestra.plugin.x.XTemplate` or `io.kestra.plugin.bluesky.BlueskyTemplate`.
    - Write the description and chapters back to YouTube with an `io.kestra.plugin.core.http.Request` to the `videos.update` endpoint after approval.
    - Add formats such as a blog post, Instagram caption or Shorts script by adding a branch under `drafts` and its id to `post_drafts`.
    - Prefer a caption language by changing the `jq` filter in `download_transcript`, for example to select `.snippet.language == "en"` first.
    - Save packs to Notion or Google Drive instead of Slack for a content calendar.
    - Lower the cost by setting `claude_model` to `claude-sonnet-5-5` or `claude-haiku-4-5`, or swap in OpenAI, Gemini, Mistral or a local Ollama model by changing `provider`.

    ## Links
    - YouTube plugin: https://kestra.io/plugins/plugin-youtube
    - AI plugin: https://kestra.io/plugins/plugin-ai
    - LoopUntil task: https://kestra.io/plugins/core/tasks/flow/io.kestra.plugin.core.flow.loopuntil
    - YouTube captions API: https://developers.google.com/youtube/v3/docs/captions
    - YouTube chapters requirements: https://support.google.com/youtube/answer/9884579
    - This blueprint has been created by [Biplab Bera](https://github.com/bishalbera)
  tags:
    - AI
    - Business
  subTags:
    - Content Generation
  ee: false
  demo: false
  metaDescription: Turn each new YouTube upload into chapters, an SEO description, an X thread, a LinkedIn post and a newsletter draft with captions, Claude and Kestra.
