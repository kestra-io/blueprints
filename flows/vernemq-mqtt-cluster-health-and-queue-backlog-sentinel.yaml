id: vernemq-mqtt-cluster-health-and-queue-backlog-sentinel
namespace: company.infrastructure

description: "Continuously audits VerneMQ distributed MQTT broker cluster node health, monitors queue message drop telemetry, executes synthetic publish probes, and alerts on telemetry congestion."

inputs:
  - id: vernemq_host
    type: STRING
    defaults: "localhost"
    description: "Hostname or IP address of the VerneMQ broker node."

  - id: vernemq_mqtt_port
    type: INT
    defaults: 1883
    description: "TCP port for standard MQTT client connections (default: 1883)."

  - id: vernemq_metrics_port
    type: INT
    defaults: 8888
    description: "HTTP port for VerneMQ Prometheus metrics and status endpoint (default: 8888)."

  - id: max_dropped_messages_threshold
    type: INT
    defaults: 10
    description: "Maximum allowable dropped messages from queue overflow before triggering a critical alert."

  - id: synthetic_probe_topic
    type: STRING
    defaults: "kestra/sentinel/heartbeat"
    description: "MQTT topic used for synthetic heartbeat publish verification."

  - id: slack_channel
    type: STRING
    defaults: "#devops-alerts"
    description: "Slack channel for operational alerts and incident escalation."

triggers:
  - id: periodic_vernemq_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

tasks:
  - id: probe_vernemq_metrics
    type: io.kestra.plugin.core.http.Request
    description: "Fetches Prometheus telemetry from VerneMQ HTTP metrics endpoint to evaluate cluster node count and queue drops."
    uri: "http://{{ inputs.vernemq_host }}:{{ inputs.vernemq_metrics_port }}/metrics"
    method: GET
    options:
      timeout:
        readIdleTimeout: PT15S

  - id: publish_synthetic_mqtt_probe
    type: io.kestra.plugin.mqtt.Publish
    description: "Executes a synthetic MQTT publish probe to verify broker responsiveness, socket health, and payload ingestion."
    server: "tcp://{{ inputs.vernemq_host }}:{{ inputs.vernemq_mqtt_port }}"
    clientId: "kestra-vernemq-sentinel"
    topic: "{{ inputs.synthetic_probe_topic }}"
    serdeType: JSON
    qos: 1
    retain: false
    from:
      probe_id: "{{ execution.id }}"
      probe_origin: "kestra-sentinel"
      timestamp: "{{ now() }}"
      status: "HEALTH_CHECK"

  - id: classify_cluster_health
    type: io.kestra.plugin.core.flow.Switch
    description: "Evaluates HTTP status code, synthetic MQTT publish status, and dropped message counts to route incident handling."
    value: >-
      {% if outputs.probe_vernemq_metrics.code != 200 %}
        BROKER_METRICS_UNAVAILABLE
      {% elseif outputs.probe_vernemq_metrics.body is defined and ('vmq_queue_message_drop' in outputs.probe_vernemq_metrics.body and (outputs.probe_vernemq_metrics.body | split('vmq_queue_message_drop')[1] | split('\n')[0] | trim | int(0)) > inputs.max_dropped_messages_threshold) %}
        QUEUE_DROP_SPIKE
      {% else %}
        HEALTHY
      {% endif %}
    cases:
      BROKER_METRICS_UNAVAILABLE:
        - id: alert_metrics_unavailable
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: "Notifies DevOps on-call when the VerneMQ metrics endpoint is unreachable or returning HTTP errors."
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "text": "[CRITICAL] VerneMQ Broker Telemetry Endpoint Unreachable",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "[ALERT] VerneMQ Broker Telemetry Offline"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Broker Host:*\n`{{ inputs.vernemq_host }}:{{ inputs.vernemq_metrics_port }}`"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*HTTP Status:*\n`{{ outputs.probe_vernemq_metrics.code }}`"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Execution ID:*\n`{{ execution.id }}`"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Timestamp:*\n`{{ now() }}`"
                    }
                  ]
                },
                {
                  "type": "context",
                  "elements": [
                    {
                      "type": "mrkdwn",
                      "text": "Immediate action required: Verify VerneMQ daemon state, Erlang runtime, and network security groups."
                    }
                  ]
                }
              ]
            }

        - id: fail_on_unavailable
          type: io.kestra.plugin.core.execution.Fail
          description: "Marks execution as failed to trigger alerting escalation."

      QUEUE_DROP_SPIKE:
        - id: alert_queue_drops
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: "Dispatches high-priority alert when VerneMQ dropped message counter breaches acceptable threshold."
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "text": "[WARNING] VerneMQ Queue Message Drops Exceeded Threshold",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "[WARNING] VerneMQ Telemetry Queue Drops Detected"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Broker Host:*\n`{{ inputs.vernemq_host }}`"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Threshold:*\n`{{ inputs.max_dropped_messages_threshold }}`"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Synthetic Ingress:*\n`PUBLISHED (QoS 1)`"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Status:*\n`QUEUE_CONGESTION`"
                    }
                  ]
                },
                {
                  "type": "context",
                  "elements": [
                    {
                      "type": "mrkdwn",
                      "text": "Action required: Inspect subscriber consumer lag, slow clients, and queue buffer memory settings."
                    }
                  ]
                }
              ]
            }

      HEALTHY:
        - id: log_cluster_healthy
          type: io.kestra.plugin.core.log.Log
          description: "Records clean health audit metrics when broker connectivity and queue thresholds are nominal."
          message: "[OK] VerneMQ broker at {{ inputs.vernemq_host }} is healthy. Metrics endpoint responded with HTTP {{ outputs.probe_vernemq_metrics.code }} and synthetic probe published successfully."

  - id: audit_run_summary
    type: io.kestra.plugin.core.log.Log
    description: "Final audit log summarizing execution metrics, probe topic, and verified endpoint state."
    message: "[AUDIT] VerneMQ sentinel completed execution {{ execution.id }}. Target broker: {{ inputs.vernemq_host }}:{{ inputs.vernemq_mqtt_port }}. Probe topic: {{ inputs.synthetic_probe_topic }}."

extend:
  title: VerneMQ MQTT Cluster Health and Queue Backlog Sentinel
  metaTitle: VerneMQ MQTT Cluster Health & Queue Backlog Sentinel | Kestra
  shortDescription: Continuously audit VerneMQ broker availability, detect MQTT queue message drops, test synthetic ingress, and dispatch Slack alerts on congestion.
  metaDescription: Audit VerneMQ MQTT broker cluster health, detect queue message drops, execute synthetic publish probes, and alert on telemetry backlog spikes.
  description: |
    VerneMQ is an enterprise-grade, distributed MQTT message broker designed for high-throughput IoT fleets, connected vehicle telemetry, and distributed messaging architectures. In high-volume production deployments, silent consumer disconnections, slow subscribers, or network partitions can lead to rapid message queue buildup, buffer exhaustion, and unhandled packet drops without crashing the broker process.

    This blueprint implements an automated Sentinel that continuously verifies VerneMQ cluster health. It queries the broker Prometheus telemetry endpoint to detect queue message drops, dispatches a real synthetic MQTT publish probe to ensure TCP socket responsiveness and protocol compliance, and routes triage alerts via Slack when operational anomalies are detected.

    ## How it works

    1. **Scheduled Audit Trigger**: Runs on a configurable 15-minute interval (`*/15 * * * *`), disabled by default for controlled onboarding and ad-hoc manual validation.
    2. **Metrics Ingestion Probe**: Issues an HTTP GET request to the VerneMQ telemetry endpoint (`:8888/metrics`) to retrieve real-time cluster health indicators and message drop counters.
    3. **Synthetic Ingress Verification**: Uses `io.kestra.plugin.mqtt.Publish` to deliver a QoS 1 JSON heartbeat message to a designated healthcheck topic, validating end-to-end TCP socket and broker ingestion paths.
    4. **Condition Classification**: Evaluates HTTP response codes and queue drop metrics within a flow-control `Switch` task, routing executions into `BROKER_METRICS_UNAVAILABLE`, `QUEUE_DROP_SPIKE`, or `HEALTHY` pathways.
    5. **Slack Alert Dispatch**: Delivers structured incident notifications to the designated Slack channel containing broker coordinates, threshold breaches, and actionable triage recommendations.
    6. **Deterministic Failure & Audit**: Terminates anomalous executions with `io.kestra.plugin.core.execution.Fail` to enforce SLA tracking, and emits a final audit log capturing execution telemetry.

    ## What you get

    - **Automated Queue Drop Detection**: Early warning before slow MQTT subscribers cause memory pressure and telemetry loss.
    - **Active Synthetic Monitoring**: Validates that VerneMQ is actively accepting and routing MQTT connections, rather than relying solely on passive process checks.
    - **Triage-Ready Incident Context**: Formatted Slack notifications providing host coordinates, HTTP status codes, and threshold comparisons.
    - **Declarative Observability**: Zero daemon scripts or cron hacks required; everything is defined in auditable, version-controlled YAML.

    ## Who it's for

    - **IoT & Platform Engineers**: Managing distributed VerneMQ clusters connected to smart meters, vehicles, or sensor fleets.
    - **DevOps & SRE Teams**: Responsible for MQTT broker uptime, cluster partition resilience, and message delivery SLAs.
    - **Data Infrastructure Engineers**: Maintaining streaming ingestion pipelines feeding Kafka, ClickHouse, or time-series databases.

    ## Why orchestrate this with Kestra

    - **Dual-Protocol Auditing**: Orchestrates both HTTP REST metrics scraping and native TCP MQTT publish operations within a single unified flow.
    - **Stateful Alert Routing**: Branches deterministically using Pebble expressions without requiring external monitoring agents or bespoke sidecars.
    - **Encrypted Secret Management**: Protects Slack webhook URLs and broker credentials using native namespace secret injection.
    - **Execution History & Replay**: Maintains immutable audit logs of every health verification run for compliance and post-incident reviews.

    ## Prerequisites

    - A running VerneMQ broker with the HTTP metrics plugin enabled (`vmq_prometheus`).
    - Network connectivity from the Kestra worker to the VerneMQ MQTT port (`1883`) and metrics port (`8888`).
    - An incoming webhook URL configured in your target Slack workspace.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Target Slack incoming webhook URL for operational alerts and incident escalation (required).

    ## Quick start

    1. Configure the `SLACK_WEBHOOK_URL` secret in your Kestra namespace settings.
    2. Start a local VerneMQ container for testing: `docker run -d --name vernemq -p 1883:1883 -p 8888:8888 -e DOCKER_VERNEMQ_ACCEPT_EULA=yes vernemq/vernemq:latest`.
    3. Import this blueprint into Kestra and trigger an execution with default inputs.
    4. Confirm that the HTTP probe and synthetic MQTT publish task succeed, and verify execution logs in the Kestra UI.
    5. Enable the schedule trigger to establish automated 15-minute continuous monitoring.

    ## How to extend

    - **Consumer Verification**: Pair with `io.kestra.plugin.mqtt.Subscribe` or `RealtimeTrigger` to measure round-trip message delivery latency.
    - **Automated Remediation**: Add tasks to automatically restart degraded subscriber pods or trigger queue drain jobs when drops are detected.
    - **PagerDuty Escalation**: Add `io.kestra.plugin.pagerduty.notifications.PagerDutyAlert` for high-severity cluster unavailability incidents.

    ## Links

    - [Kestra MQTT Plugin Documentation](https://kestra.io/plugins/plugin-mqtt)
    - [Kestra Slack Notification Plugin Documentation](https://kestra.io/plugins/plugin-notifications)
    - [VerneMQ Documentation](https://vernemq.com/docs/)
    - [VerneMQ Prometheus Metrics Guide](https://vernemq.com/docs/monitoring/)
  tags:
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - Incident Response
  ee: false
  demo: false
