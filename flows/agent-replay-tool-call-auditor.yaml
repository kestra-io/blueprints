id: agent-replay-tool-call-auditor
namespace: company.ai
description: 'Replay a batch of recorded agent traces against deterministic tool schemas and

  ordered workflow policies. Unlike a live-run denylist audit, this blueprint

  checks whether each recorded call has the required arguments, whether

  mandatory steps occurred in order, whether a prohibited action appeared, and

  whether a documented alternate sequence was followed. It performs no real

  tool actions and uses bundled synthetic traces by default.

  '
inputs:
- id: trace_dataset
  type: STRING
  displayName: Optional trace dataset JSON
  description: Optional JSON array of trace objects, or an object with a traces array. Leave blank to use the bundled examples. A webhook body with a traces array is used when this is blank.
  defaults: ''
- id: minimum_pass_rate
  type: FLOAT
  displayName: Minimum pass rate (%)
  description: Threshold from 0 through 100. Reports are always generated; a below-threshold run takes the failure branch without stopping report generation.
  defaults: 70
- id: allowed_tools
  type: STRING
  displayName: Allowed tools (comma separated)
  description: Tool names agents may call. Calls outside this list fail policy validation.
  defaults: authorize, validate, lookup, summarize, delete_user
- id: prohibited_tools
  type: STRING
  displayName: Prohibited tools (comma separated)
  description: Tool names that are always prohibited, even if listed in allowed_tools.
  defaults: delete_user, shell_exec
triggers:
- id: trace_ingest_webhook
  type: io.kestra.plugin.core.trigger.Webhook
  description: Optional event-driven ingestion for recorded traces. Configure the WEBHOOK_KEY secret before enabling callers; do not expose the key in source or logs.
  key: '{{ secret(''WEBHOOK_KEY'') }}'
tasks:
- id: load_dataset
  type: io.kestra.plugin.scripts.python.Script
  description: Choose user-supplied JSON, a webhook payload, or six bundled synthetic traces; validate the pass-rate boundary and emit the resolved run configuration.
  containerImage: python:3.11-slim
  taskRunner:
    type: io.kestra.plugin.scripts.runner.docker.Docker
  dependencies:
  - kestra
  env:
    USER_DATASET: '{{ inputs.trace_dataset }}'
    WEBHOOK_BODY: '{{ (trigger.body ?? {}) | toJson }}'
    MIN_PASS_RATE: '{{ inputs.minimum_pass_rate }}'
    ALLOWED_TOOLS: '{{ inputs.allowed_tools }}'
    PROHIBITED_TOOLS: '{{ inputs.prohibited_tools }}'
  script: "import json, os\nfrom kestra import Kestra\n\nFIXTURES = [\n  {\"id\":\"trace-success\",\"tool_calls\":[{\"tool\":\"authorize\",\"arguments\":{\"user_id\":\"u-17\",\"scope\":\"read\"}},{\"tool\":\"validate\",\"arguments\":{\"resource\":\"invoice-42\"}},{\"tool\":\"lookup\",\"arguments\":{\"query\":\"invoice-42\"}},{\"tool\":\"summarize\",\"arguments\":{\"format\":\"short\"}}],\"expected_behavior\":\"authorize, validate, lookup, summarize in order\",\"metadata\":{\"case\":\"successful sequence\"}},\n  {\"id\":\"trace-invalid-arguments\",\"tool_calls\":[{\"tool\":\"authorize\",\"arguments\":{\"user_id\":\"u-18\",\"scope\":\"read\"}},{\"tool\":\"validate\",\"arguments\":{\"resource\":\"invoice-43\"}},{\"tool\":\"lookup\",\"arguments\":{\"limit\":5}},{\"tool\":\"summarize\",\"arguments\":{\"format\":\"short\"}}],\"expected_behavior\":\"lookup requires a non-empty query\",\"metadata\":{\"case\":\"invalid arguments\"}},\n  {\"id\":\"trace-missing-authorization\",\"tool_calls\":[{\"\
    tool\":\"validate\",\"arguments\":{\"resource\":\"invoice-44\"}},{\"tool\":\"lookup\",\"arguments\":{\"query\":\"invoice-44\"}},{\"tool\":\"summarize\",\"arguments\":{\"format\":\"short\"}}],\"expected_behavior\":\"authorization is mandatory and first\",\"metadata\":{\"case\":\"missing mandatory step\"}},\n  {\"id\":\"trace-prohibited-action\",\"tool_calls\":[{\"tool\":\"authorize\",\"arguments\":{\"user_id\":\"u-20\",\"scope\":\"read\"}},{\"tool\":\"validate\",\"arguments\":{\"resource\":\"invoice-45\"}},{\"tool\":\"delete_user\",\"arguments\":{\"user_id\":\"u-20\"}},{\"tool\":\"lookup\",\"arguments\":{\"query\":\"invoice-45\"}},{\"tool\":\"summarize\",\"arguments\":{\"format\":\"short\"}}],\"expected_behavior\":\"delete_user is prohibited\",\"metadata\":{\"case\":\"prohibited action\"}},\n  {\"id\":\"trace-malformed\",\"tool_calls\":[{\"tool\":\"authorize\",\"arguments\":{\"user_id\":\"u-21\",\"scope\":\"read\"}},{\"tool\":\"lookup\"},{\"arguments\":{\"format\":\"short\"}}],\"expected_behavior\"\
    :\"every call must have tool and object arguments\",\"metadata\":{\"case\":\"malformed trace\"}},\n  {\"id\":\"trace-valid-alternate\",\"tool_calls\":[{\"tool\":\"authorize\",\"arguments\":{\"user_id\":\"u-22\",\"scope\":\"read\"}},{\"tool\":\"lookup\",\"arguments\":{\"query\":\"invoice-46\"}},{\"tool\":\"validate\",\"arguments\":{\"resource\":\"invoice-46\"}},{\"tool\":\"summarize\",\"arguments\":{\"format\":\"short\"}}],\"expected_behavior\":\"authorized lookup before validation is an explicitly allowed alternate\",\"metadata\":{\"case\":\"valid alternate sequence\"}}\n]\n\nuser_data = os.environ.get(\"USER_DATASET\", \"\").strip()\nwebhook = json.loads(os.environ.get(\"WEBHOOK_BODY\", \"{}\") or \"{}\")\ninput_error = None\nif user_data:\n    try:\n        parsed = json.loads(user_data)\n        traces = parsed.get(\"traces\") if isinstance(parsed, dict) else parsed\n        source = \"input\"\n    except (ValueError, TypeError) as exc:\n        traces, source = [], \"input\"\n  \
    \      input_error = \"Dataset is not valid JSON: \" + str(exc)\nelif isinstance(webhook, dict) and \"traces\" in webhook:\n    traces, source = webhook[\"traces\"], \"webhook\"\nelse:\n    traces, source = FIXTURES, \"bundled-fixtures\"\nif not isinstance(traces, list) or not traces:\n    input_error = input_error or \"Dataset must be a non-empty JSON array or an object with a non-empty traces array.\"\n    traces = [{\"id\":\"<dataset-input>\",\"tool_calls\":[],\"expected_behavior\":\"Input dataset must be a non-empty trace array.\",\"input_error\":input_error}]\nelse:\n    ids = [trace.get(\"id\") for trace in traces if isinstance(trace, dict) and isinstance(trace.get(\"id\"), str)]\n    duplicates = {trace_id for trace_id in ids if ids.count(trace_id) > 1}\n    for trace in traces:\n        if isinstance(trace, dict) and trace.get(\"id\") in duplicates:\n            trace[\"dataset_duplicate_id\"] = True\ntry:\n    threshold = float(os.environ[\"MIN_PASS_RATE\"])\nexcept (KeyError,\
    \ ValueError):\n    raise ValueError(\"minimum_pass_rate must be a number from 0 to 100\")\nif not 0 <= threshold <= 100:\n    raise ValueError(\"minimum_pass_rate must be between 0 and 100\")\npolicy = {\n    \"required_sequence\": [\"authorize\", \"validate\", \"lookup\", \"summarize\"],\n    \"allowed_alternate_sequences\": [[\"authorize\", \"lookup\", \"validate\", \"summarize\"]],\n    \"required_arguments\": {\"authorize\":[\"user_id\",\"scope\"],\"validate\":[\"resource\"],\"lookup\":[\"query\"],\"summarize\":[\"format\"]},\n    \"allowed_argument_values\": {\"authorize.scope\":[\"read\"],\"summarize.format\":[\"short\",\"detailed\"]},\n    \"allowed_tools\": [x.strip() for x in os.environ.get(\"ALLOWED_TOOLS\", \"\").split(\",\") if x.strip()],\n    \"prohibited_tools\": [x.strip() for x in os.environ.get(\"PROHIBITED_TOOLS\", \"\").split(\",\") if x.strip()]\n}\nKestra.outputs({\"traces\": traces, \"policy\": policy, \"minimum_pass_rate\": threshold, \"dataset_source\": source,\
    \ \"input_error\": input_error})\nprint(\"Loaded %d trace(s) from %s\" % (len(traces), source))\n"
- id: audit_each_trace
  type: io.kestra.plugin.core.flow.Loop
  description: Replay every recorded trace independently through the deterministic schema and sequence checks. Each iteration returns one structured result for the aggregate report.
  values: '{{ outputs.load_dataset.vars.traces }}'
  concurrencyLimit: 1
  tasks:
  - id: audit_trace
    type: io.kestra.plugin.scripts.python.Script
    description: Classify malformed input separately from behavioral policy failures, then check required arguments, allowed/prohibited tools, exact expected order, and the one documented alternate order.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    dependencies:
    - kestra
    env:
      TRACE: '{{ item.value }}'
      POLICY: '{{ outputs.load_dataset.vars.policy | toJson }}'
    script: "import json, os\nfrom kestra import Kestra\n\ntrace = json.loads(os.environ[\"TRACE\"])\npolicy = json.loads(os.environ[\"POLICY\"])\nviolations = []\ncategory = None\ntrace_id = trace.get(\"id\") if isinstance(trace, dict) else None\ncalls = trace.get(\"tool_calls\") if isinstance(trace, dict) else None\nif isinstance(trace, dict) and trace.get(\"input_error\"):\n    category = \"malformed_input\"\n    violations.append({\"rule\":\"dataset.json\",\"message\":trace[\"input_error\"]})\nelif isinstance(trace, dict) and trace.get(\"dataset_duplicate_id\"):\n    category = \"malformed_input\"\n    violations.append({\"rule\":\"trace.id.unique\",\"message\":\"Trace id is duplicated in the submitted dataset.\"})\nelif not isinstance(trace_id, str) or not trace_id.strip() or not isinstance(calls, list) or not isinstance(trace.get(\"expected_behavior\"), str) or not trace.get(\"expected_behavior\").strip():\n    category = \"malformed_input\"\n    violations.append({\"rule\":\"trace.schema\"\
      ,\"message\":\"Trace requires a unique non-empty string id, tool_calls array, and non-empty expected_behavior string.\"})\n    calls = calls if isinstance(calls, list) else []\nnames = []\nif category is None:\n    for index, call in enumerate(calls):\n        if not isinstance(call, dict) or not isinstance(call.get(\"tool\"), str) or not isinstance(call.get(\"arguments\"), dict):\n            category = \"malformed_input\"\n            violations.append({\"rule\":\"call.schema\",\"call_index\":index,\"message\":\"Each call requires a string tool and an arguments object.\"})\n            continue\n        name = call[\"tool\"]\n        names.append(name)\n        required = policy[\"required_arguments\"].get(name, [])\n        missing = [key for key in required if not isinstance(call[\"arguments\"].get(key), str) or not call[\"arguments\"][key].strip()]\n        if missing:\n            violations.append({\"rule\":\"arguments.required\",\"call_index\":index,\"tool\":name,\"missing\"\
      :missing,\"message\":\"Provide the required argument(s): \" + \", \".join(missing) + \".\"})\n        for key, allowed_values in policy.get(\"allowed_argument_values\", {}).items():\n            arg_tool, arg_name = key.split(\".\", 1)\n            if name == arg_tool and arg_name in call[\"arguments\"] and call[\"arguments\"][arg_name] not in allowed_values:\n                violations.append({\"rule\":\"arguments.value\",\"call_index\":index,\"tool\":name,\"argument\":arg_name,\"allowed\":allowed_values,\"message\":\"Use one of the allowed values for %s: %s.\" % (arg_name, \", \".join(allowed_values))})\n        if name not in policy[\"allowed_tools\"]:\n            violations.append({\"rule\":\"tool.unexpected\",\"call_index\":index,\"tool\":name,\"message\":\"Tool is not in the configured allowed_tools list.\"})\n        if name in policy[\"prohibited_tools\"]:\n            violations.append({\"rule\":\"tool.prohibited\",\"call_index\":index,\"tool\":name,\"message\":\"This tool\
      \ is explicitly prohibited by policy.\"})\n    expected = policy[\"required_sequence\"]\n    accepted = [expected] + policy.get(\"allowed_alternate_sequences\", [])\n    if names not in accepted:\n        violations.append({\"rule\":\"sequence.mismatch\",\"actual\":names,\"expected\":expected,\"allowed_alternates\":policy.get(\"allowed_alternate_sequences\", []),\"message\":\"Recorded calls do not match a required or explicitly allowed tool sequence.\"})\nif violations and category is None:\n    category = \"behavioral_policy\"\nresult = {\"trace_id\":trace_id or \"<missing-id>\",\"passed\":not violations,\"category\":category or \"passed\",\"violations\":violations,\"tool_sequence\":names,\"expected_behavior\":trace.get(\"expected_behavior\") if isinstance(trace, dict) else None}\nKestra.outputs({\"result_json\":json.dumps(result,sort_keys=True,separators=(\",\",\":\")),\"trace_id\":result[\"trace_id\"],\"passed\":result[\"passed\"],\"category\":result[\"category\"]})\n"
  outputs:
  - id: trace_id
    type: STRING
    value: '{{ outputs.audit_trace.vars.trace_id }}'
  - id: passed
    type: BOOL
    value: '{{ outputs.audit_trace.vars.passed }}'
  - id: category
    type: STRING
    value: '{{ outputs.audit_trace.vars.category }}'
  - id: result_json
    type: STRING
    value: '{{ outputs.audit_trace.vars.result_json }}'
- id: aggregate_results
  type: io.kestra.plugin.scripts.python.Script
  description: Aggregate actual per-trace Loop results into stable counts, pass rate, failure categories, and actionable findings; render both JSON and Markdown reports.
  containerImage: python:3.11-slim
  taskRunner:
    type: io.kestra.plugin.scripts.runner.docker.Docker
  dependencies:
  - kestra
  env:
    LOOP_RESULTS: '{{ loopOutputs(outputs.audit_each_trace.outputs, ''result_json'') | toJson }}'
    MIN_PASS_RATE: '{{ outputs.load_dataset.vars.minimum_pass_rate }}'
    DATASET_SOURCE: '{{ outputs.load_dataset.vars.dataset_source }}'
  script: "import json, os\nfrom kestra import Kestra\n\nrows = json.loads(os.environ[\"LOOP_RESULTS\"])\nresults = [json.loads(row) for row in rows]\ntotal = len(results)\npassed = sum(1 for row in results if row[\"passed\"])\ncategories = {}\nfor row in results:\n    if not row[\"passed\"]:\n        categories[row[\"category\"]] = categories.get(row[\"category\"], 0) + 1\nraw_rate = (passed * 100.0 / total) if total else 0.0\nrate = round(raw_rate, 2)\nthreshold = float(os.environ[\"MIN_PASS_RATE\"])\nthreshold_met = raw_rate >= threshold\nreport = {\"schema_version\":\"1.0\",\"status\":\"PASSED\" if threshold_met else \"FAILED\",\"dataset_source\":os.environ.get(\"DATASET_SOURCE\",\"unknown\"),\"total_traces\":total,\"passed\":passed,\"failed\":total-passed,\"pass_rate\":rate,\"minimum_pass_rate\":threshold,\"threshold_met\":threshold_met,\"failure_categories\":dict(sorted(categories.items())),\"results\":results}\nmarkdown = [\"# Agent replay audit report\", \"\", \"- Dataset source:\
    \ **%s**\" % report[\"dataset_source\"], \"- Traces: **%d**\" % total, \"- Passed / failed: **%d / %d**\" % (passed,total-passed), \"- Pass rate: **%.2f%%** (minimum **%.2f%%**; %s)\" % (rate,threshold,\"met\" if report[\"threshold_met\"] else \"not met\"), \"\", \"## Failure categories\", \"\"]\nif categories:\n    markdown.extend(\"- `%s`: %d\" % (name,count) for name,count in sorted(categories.items()))\nelse:\n    markdown.append(\"- None\")\nmarkdown.extend([\"\", \"## Trace results\", \"\", \"| Trace | Result | Category | Findings |\", \"| --- | --- | --- | --- |\"])\ndef markdown_cell(value):\n    return str(value).replace(\"\\\\\", \"\\\\\\\\\").replace(\"|\", \"\\\\|\").replace(\"\\r\", \" \").replace(\"\\n\", \" \").replace(\"`\", \"\\\\`\")\nfor row in results:\n    findings = \"; \".join(v[\"message\"] for v in row[\"violations\"]) or \"No violations\"\n    markdown.append(\"| `%s` | %s | `%s` | %s |\" % (markdown_cell(row[\"trace_id\"]), \"PASS\" if row[\"passed\"] else\
    \ \"FAIL\", markdown_cell(row[\"category\"]), markdown_cell(findings)))\nreport_json = json.dumps(report,sort_keys=True,indent=2)\nreport_md = \"\\n\".join(markdown) + \"\\n\"\nKestra.outputs({\"report_json\":report_json,\"report_markdown\":report_md,\"status\":report[\"status\"],\"total_traces\":total,\"passed\":passed,\"failed\":total-passed,\"pass_rate\":rate,\"threshold_met\":report[\"threshold_met\"],\"failure_categories\":categories})\n"
- id: threshold_gate
  type: io.kestra.plugin.core.flow.If
  description: Record whether the configured pass-rate threshold was met. Both branches continue to report persistence, including on policy failure.
  condition: '{{ outputs.aggregate_results.vars.threshold_met }}'
  then:
  - id: log_threshold_met
    type: io.kestra.plugin.core.log.Log
    description: Record a passing audit result with its measured rate.
    message: 'Audit threshold met: {{ outputs.aggregate_results.vars.pass_rate }}% passed (minimum {{ outputs.load_dataset.vars.minimum_pass_rate }}%).'
  else:
  - id: log_threshold_failed
    type: io.kestra.plugin.core.log.Log
    description: Record a below-threshold result while preserving the generated reports and successful flow completion.
    message: 'AUDIT GATE FAILED: {{ outputs.aggregate_results.vars.pass_rate }}% passed (minimum {{ outputs.load_dataset.vars.minimum_pass_rate }}%). Review report outputs.'
- id: save_json_report
  type: io.kestra.plugin.core.storage.Write
  description: Persist the generated machine-readable report in Kestra internal storage.
  content: '{{ outputs.aggregate_results.vars.report_json }}'
  extension: .json
- id: save_markdown_report
  type: io.kestra.plugin.core.storage.Write
  description: Persist the same findings as a review-friendly Markdown report.
  content: '{{ outputs.aggregate_results.vars.report_markdown }}'
  extension: .md
outputs:
- id: status
  type: STRING
  value: '{{ outputs.aggregate_results.vars.status }}'
- id: total_traces
  type: INT
  value: '{{ outputs.aggregate_results.vars.total_traces }}'
- id: passed
  type: INT
  value: '{{ outputs.aggregate_results.vars.passed }}'
- id: failed
  type: INT
  value: '{{ outputs.aggregate_results.vars.failed }}'
- id: pass_rate
  type: FLOAT
  value: '{{ outputs.aggregate_results.vars.pass_rate }}'
- id: threshold_met
  type: BOOL
  value: '{{ outputs.aggregate_results.vars.threshold_met }}'
- id: json_report_uri
  type: STRING
  value: '{{ outputs.save_json_report.uri }}'
- id: markdown_report_uri
  type: STRING
  value: '{{ outputs.save_markdown_report.uri }}'
extend:
  title: Agent Replay and Tool-Call Auditor
  metaTitle: Agent Replay and Tool-Call Auditor | Kestra
  shortDescription: Replay recorded agent traces against ordered tool policies, required arguments, and explicit alternates, then export actionable JSON and Markdown reports.
  metaDescription: Replay recorded agent traces against deterministic tool-call rules and generate actionable JSON and Markdown audit reports.
  description: 'Replay recorded AI agent tool-call traces to catch missing steps, invalid arguments, unexpected calls, malformed records, and sequence regressions. Six synthetic examples run offline. It audits recorded behavior, not future runs.


    ## How it works


    1. `load_dataset` chooses JSON input, webhook traces, or bundled fixtures and resolves the policy.

    2. `audit_each_trace` (`io.kestra.plugin.core.flow.Loop`) checks each trace''s schema, required arguments, tool permissions, required order, and allowed alternate order.

    3. `aggregate_results` computes counts, rate, categories, and both report formats from the trace results.

    4. `threshold_gate` (`io.kestra.plugin.core.flow.If`) records pass or failure. Both branches proceed to report persistence.


    ## What you get


    - Per-trace findings, separating malformed input from behavioral violations.

    - Counts, pass rate, failure categories, threshold status, JSON and Markdown reports.

    - Report URIs: `{{ outputs.save_json_report.uri }}` and `{{ outputs.save_markdown_report.uri }}`.


    ## Who it''s for


    - Agent developers testing recorded runs against deterministic contracts; quality teams reviewing regressions.


    ## Why orchestrate this with Kestra


    - The execution records per-trace replay and the threshold decision; below-threshold runs still save reports.


    ## Prerequisites


    - Kestra 2.0+, Docker task runner, and Python Scripts plugin. Defaults need no credentials.

    - Optional `trace_dataset`: JSON array or `{"traces":[...]}`. Each trace needs unique non-empty `id`, non-empty `expected_behavior`, and `tool_calls`; each call needs a `tool` string and `arguments` object. Required values are non-empty strings; `metadata` is optional.


    ### Secrets


    - `WEBHOOK_KEY`: optional secret for webhook ingestion. Manual runs need no secret. Treat the keyed URL as a credential; rotate if exposed.


    ## Quick start


    1. Import with Python Scripts and Docker runner enabled.

    2. Execute defaults: examples cover valid, invalid-argument, missing-step, prohibited, malformed, and alternate-sequence cases.

    3. Review both storage outputs. The default 70% threshold takes the failure branch (the fixtures pass 2/6); set `minimum_pass_rate` to `30` to exercise the passing branch. Reports are saved either way.


    ## How to extend


    - Edit `load_dataset` policy to change order, alternates, argument requirements, values, and tool lists.

    - Supply a JSON array of trace objects through `trace_dataset` or POST a `traces` array after setting `WEBHOOK_KEY`.

    - Use only trusted recorded traces; protect and rotate the webhook key.


    ## Links


    - [Python Scripts plugin](https://kestra.io/plugins/plugin-script-python/io.kestra.plugin.scripts.python.script)

    - [Loop flow task](https://kestra.io/plugins/core/flow/io.kestra.plugin.core.flow.loop)

    - [If flow task](https://kestra.io/plugins/core/flow/io.kestra.plugin.core.flow.if)

    - [Webhook trigger](https://kestra.io/plugins/core/trigger/io.kestra.plugin.core.trigger.webhook)

    '
  tags:
  - AI
  subTags:
  - Agents & Structured Output
  - Testing & Quality
  ee: false
  demo: false
