id: global-foreign-exchange-rates-lakehouse-loader
namespace: company.analytics
description: Ingests international currency foreign exchange spot rates, baseline anchors, and valuation movements from Open Exchange Rates API into Parquet lakehouse storage via DuckDB, tracking forex delta drifts in Kestra KV store.

inputs:
  - id: base_currency
    type: STRING
    description: Baseline anchor currency code.
    defaults: USD

  - id: target_currencies
    type: ARRAY
    itemType: STRING
    description: List of foreign currency pairs to track.
    defaults:
      - EUR
      - GBP
      - JPY
      - CAD
      - AUD
      - CHF
      - INR
      - SGD

  - id: state_key
    type: STRING
    description: Kestra KV store key tracking previous currency spot rates.
    defaults: open_er_monitored_forex_state

variables:
  default_state: "{}"

triggers:
  - id: daily_forex_sync
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 0 * * *"

tasks:
  - id: get_current_state
    type: io.kestra.plugin.core.kv.Get
    key: "{{ inputs.state_key }}"
    errorOnMissing: false

  - id: ingest_and_transform_forex
    type: io.kestra.plugin.scripts.python.Commands
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install requests duckdb
    commands:
      - |
        python3 - << 'EOF'
        import os
        import json
        import requests
        import duckdb
        from datetime import datetime

        raw_state = """{{ outputs.get_current_state.value ?? vars.default_state }}"""
        try:
            state = json.loads(raw_state) if raw_state else {}
        except Exception:
            state = {}

        base = "{{ inputs.base_currency }}"
        targets = json.loads("""{{ inputs.target_currencies | toJson }}""")

        url = f"https://open.er-api.com/v6/latest/{base}"
        headers = {"User-Agent": "KestraForexLakehouse/1.0 (macro-finance@kestra.io)"}

        records = []
        new_state = dict(state)

        try:
            resp = requests.get(url, headers=headers, timeout=20)
            if resp.status_code == 200:
                data = resp.json()
                rates = data.get("rates", {})
                time_last_update_utc = data.get("time_last_update_utc", "")

                for curr in targets:
                    if curr in rates:
                        rate = float(rates[curr])
                        prior_rate = float(state.get(curr, rate))
                        rate_drift_pct = round(((rate - prior_rate) / prior_rate * 100.0) if prior_rate else 0.0, 4)

                        records.append({
                            "base_currency": base,
                            "quote_currency": curr,
                            "exchange_rate": rate,
                            "previous_rate": prior_rate,
                            "rate_drift_percent": rate_drift_pct,
                            "time_last_update_utc": time_last_update_utc,
                            "harvest_time": datetime.utcnow().isoformat()
                        })

                        new_state[curr] = rate
        except Exception as e:
            print(f"Error fetching foreign exchange rates: {e}")

        with open("forex_rates.json", "w", encoding="utf-8") as f:
            json.dump(records, f)

        con = duckdb.connect()
        if records:
            con.execute("CREATE TABLE forex_rates AS SELECT * FROM read_json_auto('forex_rates.json')")
            con.execute("COPY forex_rates TO 'foreign_exchange_rates.parquet' (FORMAT PARQUET)")
            con.execute("COPY forex_rates TO 'foreign_exchange_rates.csv' (HEADER, DELIMITER ',')")
        else:
            con.execute("""
                CREATE TABLE forex_rates (
                    base_currency VARCHAR,
                    quote_currency VARCHAR,
                    exchange_rate DOUBLE,
                    previous_rate DOUBLE,
                    rate_drift_percent DOUBLE,
                    time_last_update_utc VARCHAR,
                    harvest_time VARCHAR
                )
            """)
            con.execute("COPY forex_rates TO 'foreign_exchange_rates.parquet' (FORMAT PARQUET)")
            con.execute("COPY forex_rates TO 'foreign_exchange_rates.csv' (HEADER, DELIMITER ',')")

        summary = {
            "tracked_currencies_count": len(records),
            "updated_state": new_state
        }

        print(f"::{{'outputs': {json.dumps(summary)}}}::")
        EOF
    outputFiles:
      - foreign_exchange_rates.parquet
      - foreign_exchange_rates.csv

  - id: persist_state
    type: io.kestra.plugin.core.kv.Set
    key: "{{ inputs.state_key }}"
    value: "{{ outputs.ingest_and_transform_forex.vars.updated_state | toJson }}"

  - id: log_forex_sync
    type: io.kestra.plugin.core.log.Log
    level: INFO
    message: "💱 Foreign Exchange Lakehouse Sync: Updated spot rates for {{ outputs.ingest_and_transform_forex.vars.tracked_currencies_count }} currency pairs anchored against {{ inputs.base_currency }}."

outputs:
  - id: currencies_count
    type: INT
    value: "{{ outputs.ingest_and_transform_forex.vars.tracked_currencies_count }}"
  - id: dataset_parquet
    type: FILE
    value: "{{ outputs.ingest_and_transform_forex.outputFiles['foreign_exchange_rates.parquet'] }}"

extend:
  title: Global Foreign Exchange Rates Lakehouse Loader with DuckDB
  metaTitle: Foreign Exchange Rates Lakehouse Loader | Kestra
  shortDescription: Ingests international currency foreign exchange spot rates, baseline anchors, and valuation movements from Open Exchange Rates API into Parquet lakehouse storage via DuckDB.
  metaDescription: Poll open exchange rates API for foreign currency spot valuations, convert FX series into Parquet via DuckDB, and track state in KV store.
  tags:
    - Data
  subTags:
    - ELT & Warehouse Loading
    - File & Data Processing Basics
  ee: false
  demo: false
  description: |
    Automate the collection, financial harmonization, and analytical lakehouse persistence of international
    foreign exchange (Forex) spot rates, currency baselines, and percentage valuation drifts into Parquet using DuckDB.

    ## How it works

    1. **State Recovery**: Queries the Kestra KV store (`open_er_monitored_forex_state`) for previous currency spot rate benchmarks.
    2. **Forex API Ingestion**: Queries the official Open Exchange Rates endpoint (`open.er-api.com/v6/latest/{base}`) across major liquid international currencies.
    3. **DuckDB Financial Normalization**: Computes intra-run spot rate percentage drifts and timestamps into a relational schema inside Docker.
    4. **Analytical Lake Export**: Exports normalized currency spot records into columnar Parquet and CSV files for multinational treasury management and corporate valuation modeling.
    5. **State Commitment**: Commits updated currency valuation mappings to Kestra KV store for reliable, stateful incremental processing.

    ## What you get

    - Automated, scheduled collection of global currency spot valuations and exchange rates.
    - Columnar Parquet datasets queryable with DuckDB, ClickHouse, Snowflake, or Athena.
    - Built-in KV state management providing idempotent execution and zero database requirements.

    ## Who it's for

    - Corporate Treasury and Financial Engineering teams auditing cross-border valuation exposures.
    - E-commerce Operations maintaining multi-currency transaction dimensions.
    - Analytics Engineers building reproducible multi-cloud lakehouse pipelines.

    ## Why orchestrate this with Kestra

    - Built-in KV store maintains historical exchange rate states across runs without database infrastructure.
    - Ephemeral Docker execution guarantees reproducible, clean Python and DuckDB runtimes.
    - Declarative scheduled execution with automated error recovery and conditional logging.

    ## Prerequisites

    - Docker runner configured on the Kestra worker.
    - Outbound internet access to `open.er-api.com`.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: (Optional) Webhook URL for alerting treasury teams on currency volatility swings.

    ## Quick start

    1. Import this blueprint into your Kestra instance.
    2. Set your baseline `base_currency` and `target_currencies` array.
    3. Click **Execute** to run an immediate harvest and generate the Parquet archive.
    4. Enable the `daily_forex_sync` schedule for automated daily updates.

    ## How to extend

    - Add an S3 or Google Cloud Storage step to partition daily foreign exchange rate snapshots.
    - Connect a dbt task downstream to convert transactional sales into a unified reporting currency.

    ## Links

    - [Open Exchange Rates API](https://www.exchangerate-api.com/docs/free)
    - [DuckDB Documentation](https://duckdb.org/)
    - [Kestra Task Runners](https://kestra.io/docs/task-runners)
