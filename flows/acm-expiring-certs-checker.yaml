id: acm-expiring-certs-checker
namespace: company.team
description: |
  Expired TLS certificates mean outages. This flow scans ACM in each of
  your regions for ISSUED certificates, reads every certificate's NotAfter
  date, and flags the ones expiring within `warning_days` (default 30).
  You get a Slack alert naming the domain, the expiry date, days remaining,
  and what to do about renewal.

triggers:
  - id: weekly_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: Runs every Sunday at 05:00 UTC. Shipped disabled; enable after a first successful manual run.
    cron: "0 5 * * 0"
    disabled: true

inputs:
  - id: aws_regions
    type: ARRAY
    itemType: STRING
    defaults: ["us-east-1"]
    description: AWS regions to scan for ACM certificates.
  - id: warning_days
    type: INT
    defaults: 30
    description: Flag certificates expiring within this many days.

tasks:
  - id: audit_certs
    type: io.kestra.plugin.core.flow.ForEach
    description: Check certificate expiry region by region.
    values: "{{ inputs.aws_regions }}"
    tasks:
      - id: check_certs
        type: io.kestra.plugin.aws.cli.AwsCLI
        description: List ISSUED certificates and flag the ones expiring inside the warning window.
        accessKeyId: "{{ secret('AWS_ACCESS_KEY_ID') }}"
        secretKeyId: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
        commands:
          - |
            REGION="{{ taskrun.value }}"
            WARN_DAYS="{{ inputs.warning_days }}"
            NOW=$(date +%s)
            CUTOFF=$((NOW + WARN_DAYS * 86400))
            aws acm list-certificates --certificate-statuses ISSUED --region "$REGION" \
              --query "CertificateSummaryList[].CertificateArn" --output text | tr '\t' '\n' > /tmp/arns.txt || true
            COUNT=0
            FINDINGS=""
            while read -r ARN; do
              [ -z "$ARN" ] && continue
              if ! DESC=$(aws acm describe-certificate --certificate-arn "$ARN" --region "$REGION" 2>/dev/null); then
                continue
              fi
              DOMAIN=$(echo "$DESC" | python3 -c "import json,sys; print(json.load(sys.stdin)['Certificate']['DomainName'])")
              NOTAFTER=$(echo "$DESC" | python3 -c "import json,sys; print(json.load(sys.stdin)['Certificate']['NotAfter'])")
              EXP_EPOCH=$(date -d "$NOTAFTER" +%s 2>/dev/null) || continue
              DAYS_LEFT=$(( (EXP_EPOCH - NOW) / 86400 ))
              if [ "$EXP_EPOCH" -le "$CUTOFF" ]; then
                COUNT=$((COUNT + 1))
                FINDINGS="${FINDINGS}${DOMAIN} expires ${NOTAFTER%%T*} (${DAYS_LEFT}d left) | "
              fi
            done < /tmp/arns.txt
            echo "EXPIRING_COUNT=$COUNT"
            echo "EXPIRING_LIST=${FINDINGS% | }"
            echo "REGION_DONE=$REGION"

      - id: decide_notify
        type: io.kestra.plugin.core.flow.If
        description: Alert when certificates are expiring; log a clean line otherwise.
        condition: "{{ outputs.check_certs.vars.EXPIRING_COUNT != '0' }}"
        then:
          - id: notify
            type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
            description: Alert with domain, expiry date, days remaining, and renewal guidance.
            url: "{{ secret('SLACK_WEBHOOK_URL') }}"
            payload: |
              {
                "text": ":rotating_light: *ACM certificates expiring within {{ inputs.warning_days }} days* (`{{ outputs.check_certs.vars.REGION_DONE }}`):\n{{ outputs.check_certs.vars.EXPIRING_LIST }}\n\n*Renewal action:* certificates ACM manages (DNS-validated and attached to an AWS resource) auto-renew — verify the renewal status in the ACM console. Imported certificates never auto-renew: reissue and re-import before the expiry date."
              }
        else:
          - id: log_clean
            type: io.kestra.plugin.core.log.Log
            message: "No ACM certificates expiring within {{ inputs.warning_days }} days in {{ outputs.check_certs.vars.REGION_DONE }}."

extend:
  title: ACM Expiring Certificates Checker
  metaTitle: Alert on Expiring ACM Certificates Before They Cause Outages | Kestra
  shortDescription: Scan ACM across regions for TLS certificates expiring soon and get a Slack alert with domain, expiry date, days left, and renewal guidance.
  metaDescription: Find ACM certificates expiring within N days across regions. Weekly check with Slack alerts naming domain, expiry date, and renewal action.
  description: |
    An expired TLS certificate is one of the most embarrassing ways to cause an outage — and it keeps happening because nobody watches expiry dates until something breaks. This blueprint scans ACM in your regions every week and flags every certificate expiring inside your warning window, with the domain, the date, and what to do about it.

    ## How it works

    1. A Schedule trigger fires weekly on Sunday at 05:00 UTC (shipped disabled).
    2. A ForEach loop scans each region in `aws_regions`, listing ISSUED certificates with `list-certificates`.
    3. Per certificate, `describe-certificate` reads the `NotAfter` date; anything expiring within `warning_days` (default 30) is flagged with days remaining.
    4. An `If` task posts a Slack alert with the domain, expiry date, days left, and renewal guidance — or logs a clean line when nothing is expiring.

    ## What you get

    - A weekly watch on every ACM certificate's expiry date, across regions.
    - Alerts that name the domain, the exact expiry date, and days remaining — no digging through the console.
    - Renewal guidance in the alert itself: ACM-managed auto-renewal vs manual reissue for imported certs.
    - Zero noise when everything is healthy — just a log line.

    ## Who it's for

    Platform and SRE teams responsible for TLS on load balancers, CloudFront distributions, and API gateways who want the expiry warning weeks before the outage.

    ## Why orchestrate this with Kestra

    Calendar reminders get snoozed and spreadsheet trackers rot. As a scheduled flow the check runs itself against the real ACM API, the warning window is a visible input, and every run leaves an auditable log of what was expiring and when.

    ## Prerequisites

    - AWS credentials with `acm:ListCertificates` and `acm:DescribeCertificate` in each scanned region.
    - A Slack incoming webhook URL.

    ### Secrets

    - `AWS_ACCESS_KEY_ID`: AWS access key for the ACM API calls.
    - `AWS_SECRET_ACCESS_KEY`: AWS secret key for the ACM API calls.
    - `SLACK_WEBHOOK_URL`: Incoming webhook URL for the expiry alerts.

    ## Quick start

    1. Add the three secrets above to your Kestra namespace.
    2. Set `aws_regions` to every region where you hold certificates (remember us-east-1 for CloudFront).
    3. Run manually once and confirm the report matches the ACM console.
    4. Enable the weekly schedule trigger.

    ## How to extend

    - Also cover certificates in EXPIRED or VALIDATION_TIMED_OUT status for a full hygiene view.
    - Page the on-call (PagerDuty/Opsgenie webhook) instead of Slack when under 7 days.
    - Handle `list-certificates` pagination explicitly for accounts with 1000+ certificates.

    ## Links

    - [Kestra AWS plugins](https://kestra.io/plugins)
    - [Kestra Slack plugins](https://kestra.io/plugins)
    - [ACM managed renewal](https://docs.aws.amazon.com/acm/latest/userguide/acm-renewal.html)
    - [ACM describe-certificate API](https://docs.aws.amazon.com/cli/latest/reference/acm/describe-certificate.html)
  tags:
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - Day 2 Operations
  ee: false
  demo: false
