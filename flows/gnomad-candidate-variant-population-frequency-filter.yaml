id: gnomad-candidate-variant-population-frequency-filter
namespace: company.team

description: |
  Population-frequency filter for the candidate variants of a rare disease case. Each variant is looked up in
  gnomAD v4 (joint exome + genome) through the GraphQL API, 25 variants per request. The filtering allele frequency
  (FAF95 grpmax) is compared with the ACMG/ClinGen BA1 and BS1 cut-offs, and the flow tags common variants as
  benign evidence. Variants that fail gnomAD QC and variants on the ClinGen BA1 exception list go to a curator
  instead. Results are cached in KV, so variants that recur across cases are not queried again.

inputs:
  - id: case_id
    type: STRING
    defaults: SAMPLE-CASE-001
    description: Case or sample id used in the report and the Slack message. A webhook call can pass `case_id` in the JSON body.

  - id: variants
    type: STRING
    defaults: "17-43071077-T-C, chr17:43071077:T:C, 17-43071077-T-A, 1-11796321-G-A, 6-26092913-G-A, 13-20189473-C-T, 1-55051215-G-GA, 14-23419408-G-T, X-31478252-C-T, 13-32340300-G-T, BRCA2:c.5946delT"
    description: |
      GRCh38 variants as chrom-pos-ref-alt (the gnomAD id format), separated by commas, semicolons or new lines.
      `chr` prefixes and `:` separators are accepted. The defaults are a sample candidate list (one duplicate and one
      HGVS string included on purpose); every frequency comes from the live gnomAD API. A webhook call can pass `variants`.

  - id: ba1_faf
    type: FLOAT
    defaults: 0.05
    description: Stand-alone benign (BA1) cut-off on the joint FAF95 grpmax. 0.05 is the ClinGen SVI default.

  - id: bs1_faf
    type: FLOAT
    defaults: 0.001
    description: Strong benign (BS1) cut-off. It depends on the disease (prevalence, penetrance, inheritance), so set it per gene or test; recessive conditions need a much higher value.

  - id: ba1_exceptions
    type: STRING
    defaults: "6-26092913-G-A, 6-26090951-C-G, 13-20189473-C-T"
    description: Variants that are never auto-filtered (from the ClinGen SVI BA1 exception list); above the BS1 cut-off they go to a curator. Defaults are HFE C282Y, HFE H63D and GJB2 V37I in GRCh38.

  - id: cache_days
    type: INT
    defaults: 90
    description: Re-query cached variants older than this. gnomAD updates releases in place under the same dataset id.

triggers:
  - id: case_ready
    type: io.kestra.plugin.core.trigger.Webhook
    key: "{{ secret('GNOMAD_FILTER_WEBHOOK_KEY') }}"
    description: POST a JSON body such as {"case_id":"RD-2026-0412","variants":"1-55051215-G-GA, 14-23419408-G-T"} when the variant caller has produced the candidate list.

variables:
  case_id: "{{ trigger.body.case_id ?? inputs.case_id }}"
  variants: "{{ trigger.body.variants ?? inputs.variants }}"

tasks:
  - id: cache
    type: io.kestra.plugin.core.kv.Get
    key: gnomad_r4_frequency_cache
    errorOnMissing: false
    description: JSON array with one row per gnomAD lookup (found or not). Missing on the first run.

  - id: plan
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: |
      Normalises the input to gnomAD ids, marks malformed entries INVALID and removes duplicates. Variants not in the
      cache (or older than `cache_days`) are packed into GraphQL bodies of at most 25 aliased `variant` fields, the
      query cost limit of the public API.
    url: "jdbc:duckdb:"
    fetchType: FETCH_ONE
    inputFiles:
      cache.json: "{{ outputs.cache.value ?? '[]' }}"
    outputFiles:
      - entries_json
    parameters:
      variants: "{{ render(vars.variants) }}"
      cache_days: "{{ inputs.cache_days }}"
    sql: |
      SET TimeZone = 'UTC';
      CREATE TABLE raw AS
      SELECT row_number() OVER () AS pos, trim(x) AS raw_input
      FROM unnest(regexp_split_to_array(:variants, '[,;\n]+')) AS t(x) WHERE trim(x) <> '';

      CREATE TABLE entries AS
      SELECT pos, raw_input, vid,
             regexp_full_match(vid, '([1-9]|1[0-9]|2[0-2]|X|Y|M)-[1-9][0-9]*-[ACGT]+-[ACGT]+')
               AND split_part(vid, '-', 3) <> split_part(vid, '-', 4) AS valid,
             row_number() OVER (PARTITION BY vid ORDER BY pos) > 1 AS duplicate
      FROM (SELECT pos, raw_input,
                   regexp_replace(regexp_replace(upper(raw_input), '^CHR', ''), '[^0-9A-Z]+', '-', 'g') AS vid
            FROM raw);

      CREATE TABLE fresh AS
      SELECT c->>'$.vid' AS vid
      FROM (SELECT unnest(from_json(content, '["JSON"]')) AS c FROM read_text('cache.json'))
      WHERE CAST(c->>'$.fetched_at' AS TIMESTAMP) >= now() - to_days(CAST(:cache_days AS INTEGER));

      CREATE TABLE to_query AS
      SELECT vid, row_number() OVER (ORDER BY min(pos)) AS n
      FROM entries WHERE valid AND vid NOT IN (SELECT vid FROM fresh) GROUP BY vid;

      COPY (SELECT * FROM entries ORDER BY pos) TO '{{ outputFiles.entries_json }}' (FORMAT JSON, ARRAY true);

      SELECT
        (SELECT count(*) FROM entries) AS submitted,
        (SELECT count(*) FROM entries WHERE duplicate) AS duplicates,
        (SELECT count(*) FROM entries WHERE NOT valid) AS invalid,
        (SELECT count(DISTINCT vid) FROM entries WHERE valid AND vid IN (SELECT vid FROM fresh)) AS from_cache,
        (SELECT count(*) FROM to_query) AS to_query,
        (SELECT coalesce(CAST(json_group_array(body) AS VARCHAR), '[]') FROM (
           SELECT json_object('query', '{ ' || string_agg(
                    'v_' || replace(vid, '-', '_') || ': variant(variantId: "' || vid || '", dataset: gnomad_r4) { variant_id rsids flags '
                    || 'joint { ac an homozygote_count hemizygote_count filters faf95 { popmax popmax_population } } '
                    || 'exome { filters } genome { filters } }', ' ' ORDER BY n) || ' }') AS body
           FROM to_query GROUP BY (n - 1) // 25 ORDER BY min(n))) AS bodies;

  - id: lookup
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.plan.outputs[0].row.to_query > 0 }}"
    then:
      - id: batches
        type: io.kestra.plugin.core.flow.Loop
        description: One POST per 25 variants, one at a time to stay well inside the public API rate limit.
        values: "{{ outputs.plan.outputs[0].row.bodies }}"
        concurrencyLimit: 1
        tasks:
          - id: graphql
            type: io.kestra.plugin.core.http.Download
            uri: https://gnomad.broadinstitute.org/api
            method: POST
            contentType: application/json
            body: "{{ item.value }}"
            headers:
              User-Agent: "kestra-gnomad-candidate-variant-population-frequency-filter/1.0 (https://kestra.io)"
            options:
              retryOnStatusCodes: [429, 500, 502, 503, 504]
              retry:
                type: exponential
                interval: PT10S
                maxInterval: PT2M
                maxAttempts: 4
        outputs:
          - id: uri
            type: STRING
            value: "{{ outputs.graphql.uri }}"

      - id: responses
        type: io.kestra.plugin.core.storage.Concat
        files: "{{ outputs.batches.outputs | jq('[.[].outputs.uri]') | first }}"
        separator: "\n"
        extension: .json

  - id: classify
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: |
      A null alias means gnomAD has no record of the allele (ABSENT). A variant above the BS1 cut-off is QC_REVIEW
      when every cohort that contains it (exome, genome) has a failing filter such as AS_VQSR or AC0, so a sequencing
      artefact is never tagged benign. Variants on the BA1 exception list above the BS1 cut-off become BA1_EXCEPTION and are never
      auto-filtered. Otherwise the joint FAF95 grpmax decides BA1, BS1 or RETAIN. ABSENT and RETAIN variants are kept for curation.
    url: "jdbc:duckdb:"
    fetchType: FETCH_ONE
    inputFiles:
      entries.json: "{{ outputs.plan.outputFiles.entries_json }}"
      cache.json: "{{ outputs.cache.value ?? '[]' }}"
      responses.json: "{{ outputs.responses.uri ?? '' }}"
    outputFiles:
      - results_csv
      - cache_json
    parameters:
      ba1: "{{ inputs.ba1_faf }}"
      bs1: "{{ inputs.bs1_faf }}"
      exceptions: "{{ inputs.ba1_exceptions }}"
      case_id: "{{ render(vars.case_id) }}"
      execution_url: "{{ kestra.url ?? '' }}/ui/executions/{{ flow.namespace }}/{{ flow.id }}/{{ execution.id }}"
    sql: |
      SET TimeZone = 'UTC';
      CREATE TABLE entries AS
      SELECT CAST(e->>'$.pos' AS INTEGER) AS pos, e->>'$.raw_input' AS raw_input, e->>'$.vid' AS vid,
             CAST(e->>'$.valid' AS BOOLEAN) AS valid, CAST(e->>'$.duplicate' AS BOOLEAN) AS duplicate
      FROM (SELECT unnest(from_json(content, '["JSON"]')) AS e FROM read_text('entries.json'));

      CREATE TABLE fetched AS
      SELECT replace(substr(k, 3), '_', '-') AS vid,
             v->>'$.variant_id' IS NOT NULL AS found,
             TRY_CAST(v->>'$.joint.faf95.popmax' AS DOUBLE) AS faf95_grpmax,
             v->>'$.joint.faf95.popmax_population' AS grpmax_group,
             TRY_CAST(v->>'$.joint.ac' AS INTEGER) AS ac, TRY_CAST(v->>'$.joint.an' AS INTEGER) AS an,
             TRY_CAST(v->>'$.joint.homozygote_count' AS INTEGER) AS hom, TRY_CAST(v->>'$.joint.hemizygote_count' AS INTEGER) AS hemi,
             array_to_string(from_json(coalesce(v->'$.rsids', '[]'), '["VARCHAR"]'), ' ') AS rsids,
             array_to_string(from_json(coalesce(v->'$.flags', '[]'), '["VARCHAR"]'), ' ') AS flags,
             CASE WHEN json_type(v->'$.exome') = 'OBJECT' THEN array_to_string(from_json(v->'$.exome.filters', '["VARCHAR"]'), ' ') ELSE 'not called' END AS exome_filters,
             CASE WHEN json_type(v->'$.genome') = 'OBJECT' THEN array_to_string(from_json(v->'$.genome.filters', '["VARCHAR"]'), ' ') ELSE 'not called' END AS genome_filters,
             CAST(now() AS VARCHAR) AS fetched_at
      FROM (SELECT k, json_extract(json, '$.data.' || k) AS v
            FROM (SELECT json, unnest(json_keys(json, '$.data')) AS k
                  FROM read_json_objects('responses.json', format = 'newline_delimited')));

      CREATE TABLE cache AS
      SELECT * FROM fetched
      UNION ALL BY NAME
      SELECT c->>'$.vid' AS vid, CAST(c->>'$.found' AS BOOLEAN) AS found, TRY_CAST(c->>'$.faf95_grpmax' AS DOUBLE) AS faf95_grpmax,
             c->>'$.grpmax_group' AS grpmax_group, TRY_CAST(c->>'$.ac' AS INTEGER) AS ac, TRY_CAST(c->>'$.an' AS INTEGER) AS an,
             TRY_CAST(c->>'$.hom' AS INTEGER) AS hom, TRY_CAST(c->>'$.hemi' AS INTEGER) AS hemi, c->>'$.rsids' AS rsids,
             c->>'$.flags' AS flags, c->>'$.exome_filters' AS exome_filters, c->>'$.genome_filters' AS genome_filters, c->>'$.fetched_at' AS fetched_at
      FROM (SELECT unnest(from_json(content, '["JSON"]')) AS c FROM read_text('cache.json'))
      WHERE c->>'$.vid' NOT IN (SELECT vid FROM fetched);

      CREATE TABLE results AS
      SELECT e.pos, e.raw_input, CASE WHEN e.valid THEN e.vid END AS variant_id, c.rsids,
             CASE WHEN NOT e.valid THEN 'INVALID'
                  WHEN NOT c.found THEN 'ABSENT'
                  WHEN coalesce(c.faf95_grpmax, 0) > CAST(:bs1 AS DOUBLE)
                       AND c.exome_filters <> '' AND c.genome_filters <> '' THEN 'QC_REVIEW'
                  WHEN coalesce(c.faf95_grpmax, 0) > CAST(:bs1 AS DOUBLE)
                       AND e.vid IN (SELECT trim(x) FROM unnest(string_split(:exceptions, ',')) AS t(x)) THEN 'BA1_EXCEPTION'
                  WHEN coalesce(c.faf95_grpmax, 0) > CAST(:ba1 AS DOUBLE) THEN 'BA1'
                  WHEN coalesce(c.faf95_grpmax, 0) > CAST(:bs1 AS DOUBLE) THEN 'BS1'
                  ELSE 'RETAIN' END AS tag,
             c.faf95_grpmax, c.grpmax_group, c.ac, c.an, c.hom, c.hemi, c.exome_filters, c.genome_filters, c.flags,
             CASE WHEN e.valid THEN 'https://gnomad.broadinstitute.org/variant/' || e.vid || '?dataset=gnomad_r4' END AS gnomad_url
      FROM entries e LEFT JOIN cache c ON c.vid = e.vid
      WHERE NOT e.duplicate;

      COPY (SELECT *, tag IN ('RETAIN', 'ABSENT') AS keep_for_curation FROM results ORDER BY pos)
        TO '{{ outputFiles.results_csv }}' (HEADER, DELIMITER ',');
      COPY (SELECT * FROM cache ORDER BY vid) TO '{{ outputFiles.cache_json }}' (FORMAT JSON, ARRAY true);

      CREATE TABLE line AS
      SELECT tag, raw_input || CASE WHEN faf95_grpmax IS NOT NULL THEN ' FAF95 ' || printf('%.6f', faf95_grpmax) || ' (' || grpmax_group || ')' ELSE '' END
                 || CASE WHEN tag = 'QC_REVIEW' THEN ' exome ' || coalesce(nullif(exome_filters, ''), 'PASS') || ', genome ' || coalesce(nullif(genome_filters, ''), 'PASS') ELSE '' END AS txt, pos
      FROM results;

      SELECT *, '*gnomAD frequency filter, case ' || :case_id || '*' || chr(10)
                || filtered || ' tagged benign (BA1 ' || ba1 || ', BS1 ' || bs1 || '), ' || kept || ' kept, ' || review || ' need review, ' || invalid || ' invalid' || chr(10)
                || review_text || chr(10) || 'Execution ' || :execution_url AS slack_text
      FROM (SELECT
        (SELECT count(*) FROM results) AS unique_variants,
        (SELECT count(*) FROM fetched) AS queried,
        (SELECT count(*) FILTER (WHERE tag = 'BA1') FROM results) AS ba1,
        (SELECT count(*) FILTER (WHERE tag = 'BS1') FROM results) AS bs1,
        (SELECT count(*) FILTER (WHERE tag IN ('BA1', 'BS1')) FROM results) AS filtered,
        (SELECT count(*) FILTER (WHERE tag IN ('RETAIN', 'ABSENT')) FROM results) AS kept,
        (SELECT count(*) FILTER (WHERE tag = 'ABSENT') FROM results) AS absent,
        (SELECT count(*) FILTER (WHERE tag IN ('QC_REVIEW', 'BA1_EXCEPTION')) FROM results) AS review,
        (SELECT count(*) FILTER (WHERE tag = 'INVALID') FROM results) AS invalid,
        (SELECT coalesce(string_agg(tag || ' ' || txt, chr(10) ORDER BY pos), '') FROM line) AS report,
        (SELECT coalesce(string_agg(tag || ' ' || txt, chr(10) ORDER BY pos), '') FROM line WHERE tag IN ('QC_REVIEW', 'BA1_EXCEPTION', 'INVALID')) AS review_text);

  - id: save_cache
    type: io.kestra.plugin.core.kv.Set
    key: gnomad_r4_frequency_cache
    value: "{{ read(outputs.classify.outputFiles.cache_json) | trim }}"

  - id: needs_review
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.classify.outputs[0].row.review + outputs.classify.outputs[0].row.invalid > 0 }}"
    then:
      - id: log_review
        type: io.kestra.plugin.core.log.Log
        level: WARN
        message: "Case {{ render(vars.case_id) }}: {{ outputs.classify.outputs[0].row.review }} variant(s) need a curator and {{ outputs.classify.outputs[0].row.invalid }} entry(ies) are not gnomAD ids:\n{{ outputs.classify.outputs[0].row.review_text }}"

  - id: notify
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    allowFailure: true
    description: allowFailure keeps the case result intact when the webhook is not configured; everything is in the log and the CSV.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {{ {'text': outputs.classify.outputs[0].row.slack_text} | toJson }}

  - id: summary
    type: io.kestra.plugin.core.log.Log
    message: |
      Case {{ render(vars.case_id) }}: {{ outputs.plan.outputs[0].row.submitted }} entries, {{ outputs.plan.outputs[0].row.duplicates }} duplicate(s), {{ outputs.classify.outputs[0].row.unique_variants }} unique; {{ outputs.plan.outputs[0].row.from_cache }} from cache, {{ outputs.classify.outputs[0].row.queried }} queried from gnomAD.
      BA1 {{ outputs.classify.outputs[0].row.ba1 }}, BS1 {{ outputs.classify.outputs[0].row.bs1 }}, kept {{ outputs.classify.outputs[0].row.kept }} (absent {{ outputs.classify.outputs[0].row.absent }}), review {{ outputs.classify.outputs[0].row.review }}, invalid {{ outputs.classify.outputs[0].row.invalid }}.
      {{ outputs.classify.outputs[0].row.report }}

outputs:
  - id: summary
    type: JSON
    value: "{{ outputs.classify.outputs[0].row }}"
  - id: results_csv
    type: FILE
    value: "{{ outputs.classify.outputFiles.results_csv }}"

extend:
  title: Filter Rare Disease Candidate Variants by gnomAD Population Frequency (ACMG BA1/BS1)
  metaTitle: gnomAD Candidate Variant Frequency Filter for ACMG BA1 and BS1 | Kestra
  shortDescription: Look up a case's candidate variants in gnomAD v4 with batched GraphQL requests, tag common variants as BA1 or BS1 benign evidence on the filtering allele frequency, and send QC failures and BA1 exceptions to a curator.
  metaDescription: Per-case gnomAD v4 lookup of candidate variants that tags BA1/BS1 benign evidence on FAF95 grpmax, flags QC failures and caches results in KV.
  description: |
    Rare disease curation first removes variants too common to cause the disorder. ACMG/AMP criteria BA1 and BS1 use
    the gnomAD filtering allele frequency (FAF95 grpmax), not the raw frequency. Two traps make a naive filter unsafe:
    a frequent call can be an artefact that fails gnomAD QC, and some pathogenic founder variants (HFE C282Y, GJB2 V37I)
    pass BA1. This flow filters a case's candidates against gnomAD v4 and sends both traps to a curator.

    ## How it works

    1. A `Webhook` trigger receives `case_id` and `variants` when the variant caller finishes; manual runs use the inputs.
    2. `cache` (KV Get) reads earlier lookups. `plan` (DuckDB) normalises ids (`chr17:43071077:T:C` to `17-43071077-T-C`), marks HGVS strings, rsIDs and REF = ALT entries `INVALID`, removes duplicates and packs uncached variants into GraphQL bodies of 25 aliased `variant` fields (the API's query cost limit).
    3. `lookup` (If + Loop) POSTs each body to `https://gnomad.broadinstitute.org/api`, one at a time with retries on 429 and 5xx. Fully cached cases make no request.
    4. `classify` (DuckDB) tags each variant using the joint exome + genome FAF95 grpmax:
       - `ABSENT`: gnomAD has no record of the allele.
       - `BA1_EXCEPTION`: on the exception list and above the BS1 cut-off.
       - `QC_REVIEW`: above the BS1 cut-off, but every cohort that called the variant has a failing filter (AS_VQSR, AC0).
       - `BA1`, `BS1` or `RETAIN` by the cut-offs.
    5. `save_cache` (KV Set) stores the lookups; `needs_review` (If) logs review rows at WARN; `notify` posts to Slack.

    ## What you get

    - A results CSV per case with tag, FAF95, ancestry group, AC/AN, homozygotes, hemizygotes, cohort filters, flags, a gnomAD link and `keep_for_curation`.
    - QC failures and exception-list variants are never auto-filtered.
    - Variants that recur across cases come from the cache, inside the API rate limit.

    ## Who it's for

    - Variant curators in rare disease and hereditary cancer labs, and the bioinformaticians who run tertiary analysis.

    ## Why orchestrate this with Kestra

    - The webhook connects the filter to the pipeline; batching, retries and the KV cache are declarative.
    - `allowFailure` on Slack keeps the result without a webhook; the log and CSV keep everything.

    ## Prerequisites

    - Kestra 2.0 with the JDBC DuckDB and Slack plugins.
    - Outbound HTTPS to `gnomad.broadinstitute.org`; no API key. Variants must be GRCh38.

    ### Secrets

    - `GNOMAD_FILTER_WEBHOOK_KEY`: key in the webhook URL (required for the trigger).
    - `SLACK_WEBHOOK_URL`: Slack incoming webhook for the case summary (optional).

    ## Quick start

    1. Import the flow and click **Execute**. The default variants are a sample candidate list; every frequency comes from the live API. Expect 2 BA1, 1 BS1, 3 kept (1 absent), 3 for review and 1 invalid.
    2. Execute again: 9 variants from the cache, no request.
    3. Set `bs1_faf` for your disease: `0.02` keeps the PCSK9 insertion at FAF95 0.0155.
    4. Configure the secrets and POST a case to the webhook URL.

    ## How to extend

    - Use gene-specific BS1 cut-offs from the ClinGen variant curation expert panels.

    ## Links

    - [Webhook trigger](https://kestra.io/plugins/core/trigger/io.kestra.plugin.core.trigger.webhook), [If](https://kestra.io/plugins/core/flow/io.kestra.plugin.core.flow.if) and [Loop](https://kestra.io/plugins/core/flow/io.kestra.plugin.core.flow.loop)
    - [HTTP Download](https://kestra.io/plugins/core/http/io.kestra.plugin.core.http.download) and [KV Store](https://kestra.io/docs/concepts/kv-store)
    - [DuckDB Queries](https://kestra.io/plugins/plugin-jdbc-duckdb/io.kestra.plugin.jdbc.duckdb.queries)
    - [Slack Incoming Webhook](https://kestra.io/plugins/plugin-notifications/slack/io.kestra.plugin.slack.notifications.slackincomingwebhook)
    - [gnomAD browser](https://gnomad.broadinstitute.org/) and [gnomAD API](https://gnomad.broadinstitute.org/help/is-there-an-api)
    - [ClinGen SVI recommendations for BA1](https://clinicalgenome.org/working-groups/sequence-variant-interpretation/)
  tags:
    - Data
  subTags:
    - Testing & Quality
    - ELT & Data Landing
  ee: false
  demo: false
