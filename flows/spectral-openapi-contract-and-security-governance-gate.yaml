id: spectral-openapi-contract-and-security-governance-gate
namespace: company.platform

description: |
  Lints OpenAPI and AsyncAPI specifications using Stoplight Spectral in a
  containerized pre-deployment gate. Evaluates API definitions against OWASP
  API security standards and corporate style guides, separates blocking contract
  errors from non-blocking style warnings, exports a structured diagnostic
  report artifact, and blocks CI/CD pipelines when breaking contract violations occur.

inputs:
  - id: spec_file
    type: FILE
    displayName: "OpenAPI Specification File"
    description: "The OpenAPI or AsyncAPI specification file (YAML or JSON) to lint. Used during manual execution or Subflow chaining; ignored when the webhook trigger fires, which supplies the file instead."

  - id: custom_ruleset_file
    type: FILE
    displayName: "Custom Spectral Ruleset"
    description: "Optional custom .spectral.yaml ruleset. If omitted, the gate applies standard spectral:oas rules with OWASP API security requirements."
    required: false

  - id: fail_on_warnings
    type: BOOL
    displayName: "Fail on Style Warnings"
    description: "When true, treats severity 1 (warning) findings as blocking errors. When false, only severity 0 (errors) fail the deployment gate."
    defaults: false

triggers:
  - id: check_on_pr_webhook
    type: io.kestra.plugin.core.trigger.Webhook
    description: "Allows CI/CD pipelines (GitHub Actions, GitLab CI) to POST candidate OpenAPI specifications to Kestra on pull requests. fetchType: STORE streams the upload safely into internal storage as trigger.uri."
    key: "{{ secret('SPECTRAL_GATE_WEBHOOK_KEY') }}"
    fetchType: STORE
    disabled: true

tasks:
  - id: lint_api_specification
    type: io.kestra.plugin.scripts.shell.Commands
    description: |
      Executes Spectral CLI against the candidate OpenAPI specification inside a
      lightweight Node container. Generates a structured JSON diagnostic report
      and calculates severity metrics.
    containerImage: node:22-alpine
    allowFailure: true
    outputFiles:
      - "spectral-report.json"
      - "governance-summary.json"
    commands:
      - |
        set -e
        npm install -g @stoplight/spectral-cli > /dev/null 2>&1

        SPEC_FILE="{{ trigger.uri is defined ? trigger.uri : (inputs.spec_file is defined ? inputs.spec_file : '') }}"
        RULESET_FILE="{{ inputs.custom_ruleset_file is defined ? inputs.custom_ruleset_file : '' }}"
        FAIL_ON_WARN="{{ inputs.fail_on_warnings }}"

        if [ -z "$SPEC_FILE" ] || [ ! -f "$SPEC_FILE" ]; then
          echo "No specification file available: supply spec_file or trigger this flow via check_on_pr_webhook." >&2
          exit 1
        fi
        TARGET="$SPEC_FILE"

        # If no custom ruleset provided, generate baseline OpenAPI ruleset extending spectral:oas
        if [ -z "$RULESET_FILE" ] || [ ! -f "$RULESET_FILE" ]; then
          cat << 'EOF' > .spectral.yaml
        extends: ["spectral:oas"]
        rules:
          operation-description: warn
          operation-operationId: error
          operation-security-defined: error
          oas3-api-servers: warn
          oas3-schema: error
        EOF
          RULESET_ARG="--ruleset .spectral.yaml"
        else
          RULESET_ARG="--ruleset $RULESET_FILE"
        fi

        # Run Spectral linter with JSON output
        set +e
        spectral lint "$TARGET" $RULESET_ARG -f json -o spectral-report.json
        EXIT_CODE=$?
        set -e

        # Evaluate diagnostic output and calculate severity metrics
        node << 'EOF'
        const fs = require('fs');

        let findings = [];
        if (fs.existsSync('spectral-report.json')) {
          try {
            findings = JSON.parse(fs.readFileSync('spectral-report.json', 'utf8'));
          } catch (e) {
            findings = [];
          }
        }

        const errors = findings.filter(f => f.severity === 0);
        const warnings = findings.filter(f => f.severity === 1);
        const infos = findings.filter(f => f.severity === 2);
        const hints = findings.filter(f => f.severity === 3);

        const failOnWarn = process.env.FAIL_ON_WARN === 'true';

        let gateStatus = 'PASS_CLEAN';
        if (errors.length > 0) {
          gateStatus = 'BLOCK_ERRORS';
        } else if (warnings.length > 0 && failOnWarn) {
          gateStatus = 'BLOCK_WARNINGS';
        } else if (warnings.length > 0) {
          gateStatus = 'WARN_STYLE_ONLY';
        }

        const summary = {
          gate_status: gateStatus,
          total_findings: findings.length,
          error_count: errors.length,
          warning_count: warnings.length,
          info_count: infos.length,
          hint_count: hints.length,
          blocking: (errors.length > 0 || (warnings.length > 0 && failOnWarn)),
          errors: errors.slice(0, 5).map(e => ({ code: e.code, message: e.message, path: e.path ? e.path.join('.') : '' })),
          warnings: warnings.slice(0, 5).map(w => ({ code: w.code, message: w.message, path: w.path ? w.path.join('.') : '' }))
        };

        fs.writeFileSync('governance-summary.json', JSON.stringify(summary, null, 2));
        console.log(`Spectral lint complete: status=${gateStatus}, errors=${errors.length}, warnings=${warnings.length}`);
        EOF

  - id: classify_governance_gate
    type: io.kestra.plugin.core.debug.Return
    description: Extracts the governance verdict and severity counts from the Spectral summary report.
    format: "{{ outputs.lint_api_specification.outputFiles['governance-summary.json'] is defined ? (read(outputs.lint_api_specification.outputFiles['governance-summary.json']) | jq('.gate_status') | first) : 'UNREACHABLE' }}"

  - id: route_by_governance_status
    type: io.kestra.plugin.core.flow.Switch
    description: Routes downstream pipeline actions based on Spectral API governance classification.
    value: "{{ outputs.classify_governance_gate.value }}"
    cases:
      BLOCK_ERRORS:
        - id: alert_contract_errors
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: Sends high-priority Slack notification when blocking OpenAPI schema or security errors occur.
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "channel": "#api-platform-alerts",
              "text": "*Spectral API Governance Gate: FAILED (Contract Errors)*\n- The OpenAPI specification contains blocking schema or security violations.\n- Deployment to API Gateway halted to prevent routing or security failures.\n- Review findings in `spectral-report.json`."
            }
        - id: fail_gate_errors
          type: io.kestra.plugin.core.execution.Fail
          description: Deliberately halts the execution to prevent broken API definitions from reaching production gateways.
          errorMessage: "API deployment blocked: Spectral identified critical contract or security errors in the OpenAPI specification."

      BLOCK_WARNINGS:
        - id: alert_policy_warnings
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: Sends Slack notification when style governance warnings block pipeline execution.
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "channel": "#api-platform-alerts",
              "text": "*Spectral API Governance Gate: FAILED (Style Warnings Blocked)*\n- Specification violated corporate API style rules under strict mode.\n- Correct formatting, missing descriptions, or casing before deployment."
            }
        - id: fail_gate_warnings
          type: io.kestra.plugin.core.execution.Fail
          description: Halts execution when strict style compliance policy is enforced.
          errorMessage: "API deployment blocked: Specification failed strict style governance ruleset."

      WARN_STYLE_ONLY:
        - id: log_style_warnings
          type: io.kestra.plugin.core.log.Log
          description: Logs style warnings while allowing execution to proceed.
          message: "Spectral gate PASSED with warnings: Zero blocking contract errors detected. Non-blocking style recommendations logged in spectral-report.json."
        - id: notify_style_recommendations
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: Notifies developers of non-blocking style recommendations.
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "channel": "#api-platform-alerts",
              "text": "*Spectral API Governance Gate: PASSED with Warnings*\n- Zero blocking contract errors found.\n- Minor style recommendations reported for review."
            }

      PASS_CLEAN:
        - id: log_clean_spec
          type: io.kestra.plugin.core.log.Log
          description: Confirms that OpenAPI specification is 100% compliant with governance rules.
          message: "Spectral gate PASSED: OpenAPI specification is fully compliant with OWASP security and API standards."

    defaults:
      - id: log_unreachable_outcome
        type: io.kestra.plugin.core.log.Log
        description: Logs unexpected or unreachable inspection outcome.
        message: "Spectral inspection produced unexpected status: {{ outputs.classify_governance_gate.value }}"

outputs:
  - id: gate_status
    type: STRING
    value: "{{ outputs.classify_governance_gate.value }}"

  - id: report_uri
    type: STRING
    value: "{{ outputs.lint_api_specification.outputFiles['spectral-report.json'] }}"

  - id: summary_uri
    type: STRING
    value: "{{ outputs.lint_api_specification.outputFiles['governance-summary.json'] }}"

errors:
  - id: alert_execution_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alerts operations team if the linting container fails unexpectedly.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "#api-platform-alerts",
        "text": "*Spectral API Governance Gate: Execution Error*\nFailed to run Spectral CLI inspection. Check execution logs."
      }

extend:
  title: "Spectral OpenAPI Contract and Security Governance Gate"
  metaTitle: "Spectral OpenAPI Contract & Security Gate | Kestra Blueprint"
  shortDescription: "Lint OpenAPI and AsyncAPI specifications with Stoplight Spectral to enforce OWASP security rules and block broken API contracts."
  metaDescription: "Block invalid or unauthenticated OpenAPI contracts with Stoplight Spectral before deployment, while separating blocking errors from style warnings."
  description: |
    Deploying invalid, inconsistent, or unsecured OpenAPI specifications to production API gateways (such as Kong, Apisix, Tyk, or AWS API Gateway) causes route reload failures, broken client SDK generation, and exposed unauthenticated endpoints.

    This blueprint runs pre-deployment API contract linting using Stoplight Spectral in an isolated container. It validates OpenAPI 3.x and AsyncAPI definitions against OWASP API security standards and corporate style guides, captures line-by-line violation paths in `spectral-report.json`, separates critical contract errors from non-blocking documentation warnings, and halts CI/CD release pipelines when breaking specification flaws are detected.

    ## How it works

    1. `check_on_pr_webhook` (`io.kestra.plugin.core.trigger.Webhook`) allows external CI/CD pipelines (GitHub Actions, GitLab CI) to POST candidate OpenAPI specifications directly to Kestra. Using `fetchType: STORE`, the document is streamed securely into internal storage and exposed as `trigger.uri`. Alternatively, running the flow manually or as a `Subflow` utilizes the `spec_file` input.
    2. `lint_api_specification` (`io.kestra.plugin.scripts.shell.Commands`) executes inside a `node:22-alpine` container. It runs `spectral lint` against the specification and custom ruleset, exports structured diagnostics to `spectral-report.json`, and computes severity metrics (`error_count`, `warning_count`, `info_count`).
    3. `classify_governance_gate` (`io.kestra.plugin.core.debug.Return`) evaluates `governance-summary.json` to determine the gate verdict: `BLOCK_ERRORS`, `BLOCK_WARNINGS`, `WARN_STYLE_ONLY`, or `PASS_CLEAN`.
    4. `route_by_governance_status` (`io.kestra.plugin.core.flow.Switch`) routes execution:
       - `BLOCK_ERRORS`: Alerts the team on Slack with violation details and halts execution via `fail_gate_errors` (`io.kestra.plugin.core.execution.Fail`).
       - `BLOCK_WARNINGS`: Fails execution under strict mode when `fail_on_warnings` is enabled.
       - `WARN_STYLE_ONLY`: Sends a non-blocking Slack advisory with style recommendations while allowing deployment to proceed.
       - `PASS_CLEAN`: Logs confirmation that the API contract is fully compliant.
    5. The `errors` block alerts the engineering team if runner execution fails unexpectedly.

    ## What you get

    - Automated enforcement of OWASP API security rules (such as mandatory `security` schemes and valid schema definitions) before gateway deployment.
    - Separation of critical blocking contract flaws from non-blocking documentation/style recommendations.
    - Machine-readable diagnostic artifacts (`spectral-report.json`) pinpointing exact line numbers, JSON pointer paths, and rule identifiers for rapid developer resolution.
    - Hard stop deployment protection via Kestra's `Fail` task to prevent invalid specifications from breaking gateway reload cycles.

    ## Who it's for

    - API Platform Engineers and DevOps teams managing API gateways, developer portals, and client SDK generation.
    - Backend Engineers designing REST and Event-Driven microservice APIs with OpenAPI and AsyncAPI.
    - Security Engineers enforcing organization-wide API security baselines.

    ## Why orchestrate this with Kestra

    Spectral CLI prints linting results to terminal streams but cannot natively coordinate multi-stage deployment approvals, store auditable execution artifacts, or integrate with incident messaging. Orchestrating Spectral with Kestra turns static linting into an automated quality gate that stops broken releases, exposes downloadable diagnostic reports, and dispatches targeted alerts to relevant teams.

    ## Prerequisites

    - A Kestra worker with Docker container execution enabled.
    - An incoming Slack webhook URL for alerts and review notices.

    ### Secrets

    - `SPECTRAL_GATE_WEBHOOK_KEY`: Authentication key for the webhook trigger (`.../executions/webhook/{namespace}/{flowId}/{key}`). Required only when `check_on_pr_webhook` is active.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL used to transmit deployment gate alerts, remediation instructions, and review notices.

    ## Quick start

    1. Configure the `SLACK_WEBHOOK_URL` secret in your Kestra namespace.
    2. Upload a clean OpenAPI 3.x specification as `spec_file`, run the flow, and confirm `gate_status` reads `PASS_CLEAN`.
    3. Upload an OpenAPI specification missing security definitions or response schemas instead, and observe the automated `BLOCK_ERRORS` gate.
    4. Enable `check_on_pr_webhook` in your repository CI pipeline to automatically validate API specifications on every pull request.

    ## How to extend

    - Add downstream API Gateway deployment tasks (e.g. Kong or AWS API Gateway updates) that execute automatically upon `PASS_CLEAN`.
    - Upload corporate `.spectral.yaml` rulesets to Kestra namespace storage to enforce company-wide API guidelines across all development teams.
    - Integrate with developer portals (Backstage, Readme) to publish verified API specifications upon gate completion.

    ## Links

    - [Stoplight Spectral Documentation](https://docs.stoplight.io/docs/spectral)
    - [OWASP API Security Top 10](https://owasp.org/www-project-api-security/)
    - [Kestra Commands Plugin](https://kestra.io/plugins/plugin-scripts-shell/tasks/io.kestra.plugin.scripts.shell.commands)
    - [Kestra Fail Task](https://kestra.io/plugins/core/tasks/execution/io.kestra.plugin.core.execution.fail)
    - [Kestra Switch Task](https://kestra.io/plugins/core/tasks/flow/io.kestra.plugin.core.flow.switch)
  tags:
    - Infrastructure
  subTags:
    - CI/CD & Deployment
    - Approval Gates
  ee: false
  demo: false
