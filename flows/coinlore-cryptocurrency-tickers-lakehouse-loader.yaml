id: coinlore-crypto-market-tickers-lakehouse-loader
namespace: company.analytics
description: Ingests real-time cryptocurrency exchange tickers, circulating supplies, and market cap valuations from Coinlore API into DuckDB, exports Parquet and analytics datasets, and manages sync state with Kestra KV store.

inputs:
  - id: state_key
    type: STRING
    description: Kestra KV store key tracking processed unique entity identifiers.
    defaults: coinlore-crypto-market-tickers-lakehouse-loader_state

variables:
  default_state: "[]"

triggers:
  - id: periodic_sync
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 4 * * 1"

tasks:
  - id: get_current_state
    type: io.kestra.plugin.core.kv.Get
    key: "{{ inputs.state_key }}"
    errorOnMissing: false

  - id: ingest_and_transform
    type: io.kestra.plugin.scripts.python.Commands
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install requests duckdb
    commands:
      - |
        python3 - << 'PYEOF'
        import os
        import json
        import requests
        import duckdb
        from datetime import datetime, timezone

        raw_state = """{{ outputs.get_current_state.value ?? vars.default_state }}"""
        try:
            seen_ids = set(json.loads(raw_state))
        except Exception:
            seen_ids = set()

        url = "https://api.coinlore.net/api/tickers/?start=0&limit=50"
        headers = {"User-Agent": "KestraLakehouseLoader/1.0 (kestra-data-pipeline; contact@company.internal)"}

        resp = requests.get(url, headers=headers, timeout=30)
        resp.raise_for_status()
        data = resp.json()
        root_key = "data"
        items = data.get(root_key, data) if root_key else data

        records = []
        now_iso = datetime.now(timezone.utc).isoformat()
        current_ids = []

        
        for item in items:
            tid = str(item.get('id', 'UNKNOWN'))
            current_ids.append(tid)
            try:
                price = float(item.get('price_usd', 0.0))
            except Exception:
                price = 0.0
            try:
                chg = float(item.get('percent_change_24h', 0.0))
            except Exception:
                chg = 0.0
            try:
                mcap = float(item.get('market_cap_usd', 0.0))
            except Exception:
                mcap = 0.0
            try:
                vol = float(item.get('volume24', 0.0))
            except Exception:
                vol = 0.0

            records.append({
                'ticker_id': tid,
                'symbol': str(item.get('symbol', 'UNKNOWN')),
                'name': str(item.get('name', 'UNKNOWN')),
                'price_usd': price,
                'percent_change_24h': chg,
                'market_cap_usd': mcap,
                'volume24': vol,
                'is_new': bool(tid not in seen_ids),
                'ingestion_timestamp': now_iso
            })
        

        con = duckdb.connect(database=":memory:")
        con.execute("""
            CREATE TABLE crypto_tickers (
                ticker_id VARCHAR,
                symbol VARCHAR,
                name VARCHAR,
                price_usd DOUBLE,
                percent_change_24h DOUBLE,
                market_cap_usd DOUBLE,
                volume24 DOUBLE,
                is_new BOOLEAN,
                ingestion_timestamp VARCHAR
            );
        """)

        if records:
            con.execute("INSERT INTO crypto_tickers SELECT * FROM read_json_auto(?)", [json.dumps(records)])

        con.execute("COPY crypto_tickers TO 'crypto_tickers.parquet' (FORMAT PARQUET, COMPRESSION ZSTD);")
        con.execute("""
            COPY (
                SELECT
                    symbol,
                    name,
                    price_usd,
                    market_cap_usd,
                    percent_change_24h
                FROM crypto_tickers
                ORDER BY market_cap_usd DESC
                LIMIT 15
            ) TO 'top_cryptos_summary.csv' (HEADER, DELIMITER ',');
        """)

        new_count = con.execute("SELECT count(*) FROM crypto_tickers WHERE is_new = true").fetchone()[0]
        total_count = con.execute("SELECT count(*) FROM crypto_tickers").fetchone()[0]

        updated_ids = list(seen_ids.union(current_ids))
        with open("updated_state.json", "w") as f:
            json.dump(updated_ids, f)

        metrics = {
            "total_extracted": total_count,
            "new_entities": new_count,
            "synced_at": now_iso
        }
        with open("metrics.json", "w") as f:
            json.dump(metrics, f)

        print(f"Lakehouse sync complete. Processed {total_count} records ({new_count} newly observed).")
        PYEOF
    outputFiles:
      - crypto_tickers.parquet
      - top_cryptos_summary.csv
      - updated_state.json
      - metrics.json

  - id: update_state
    type: io.kestra.plugin.core.kv.Set
    key: "{{ inputs.state_key }}"
    value: "{{ read(outputs.ingest_and_transform.outputFiles['updated_state.json']) }}"

  - id: analyze_and_notify
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.ingest_and_transform.outputFiles['crypto_tickers.parquet'] != null }}"
    then:
      - id: log_metrics
        type: io.kestra.plugin.core.log.Log
        message: "Coinlore Cryptocurrency Tickers sync succeeded. Metrics: {{ read(outputs.ingest_and_transform.outputFiles['metrics.json']) }}"
