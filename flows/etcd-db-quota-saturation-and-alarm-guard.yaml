id: etcd-db-quota-saturation-and-alarm-guard
namespace: company.sentinel
description: Audits Etcd key-value store storage quota consumption and cluster leader stability to prevent NOSPACE alarms and Kubernetes API freeze.
inputs:
  - id: etcd_endpoint
    type: STRING
    defaults: http://etcd.internal:2379
  - id: max_quota_percent_threshold
    type: INT
    defaults: 80
  - id: max_failed_proposals_threshold
    type: INT
    defaults: 5
tasks:
  - id: probe_etcd_metrics
    type: io.kestra.plugin.scripts.shell.Commands
    containerImage: ghcr.io/kestra-io/tools:latest
    commands:
      - set -euo pipefail
      - |
        AUTH_HEADER=""
        if [ -n "{{ secret('ETCD_TOKEN') }}" ]; then
          AUTH_HEADER="-H Authorization:Bearer {{ secret('ETCD_TOKEN') }}"
        fi

        curl -sf -m 10 $AUTH_HEADER "{{ inputs.etcd_endpoint }}/metrics" > /tmp/etcd_raw.txt 2>/dev/null || echo "" > /tmp/etcd_raw.txt

        python3 - <<'PY' > /tmp/etcd_health.json
        import os, sys, json

        metrics = {}
        try:
            with open("/tmp/etcd_raw.txt", "r") as f:
                for line in f:
                    line = line.strip()
                    if line and not line.startswith("#"):
                        parts = line.split()
                        if len(parts) >= 2:
                            try:
                                metrics[parts[0]] = float(parts[1])
                            except ValueError:
                                pass
        except Exception:
            pass

        db_size = int(metrics.get("etcd_mvcc_db_total_size_in_bytes", 0))
        quota_bytes = int(metrics.get("etcd_server_quota_backend_bytes", 0))
        quota_pct = round((db_size / quota_bytes) * 100, 2) if quota_bytes > 0 else 0.0
        has_leader = int(metrics.get("etcd_server_has_leader", 1))
        failed_proposals = int(metrics.get("etcd_server_proposals_failed_total", 0))

        res = {
            "db_size_bytes": db_size,
            "quota_bytes": quota_bytes,
            "quota_used_pct": quota_pct,
            "has_leader": has_leader,
            "failed_proposals": failed_proposals
        }
        print(json.dumps(res))
        PY
    outputFiles:
      - "/tmp/etcd_health.json"

  - id: evaluate_quota_and_leader
    type: io.kestra.plugin.core.flow.If
    condition: "{{ fromJson(read(outputs.probe_etcd_metrics.outputFiles['/tmp/etcd_health.json'])).quota_used_pct > inputs.max_quota_percent_threshold or fromJson(read(outputs.probe_etcd_metrics.outputFiles['/tmp/etcd_health.json'])).has_leader == 0 }}"
    then:
      - id: notify_slack_alert
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          :warning: *Etcd Cluster Storage Quota Alert*
          *Endpoint:* `{{ inputs.etcd_endpoint }}`
          *Quota Utilization:* `{{ fromJson(read(outputs.probe_etcd_metrics.outputFiles['/tmp/etcd_health.json'])).quota_used_pct }}%` (Threshold: `{{ inputs.max_quota_percent_threshold }}%`)
          *DB Size:* `{{ fromJson(read(outputs.probe_etcd_metrics.outputFiles['/tmp/etcd_health.json'])).db_size_bytes }} bytes` / Quota: `{{ fromJson(read(outputs.probe_etcd_metrics.outputFiles['/tmp/etcd_health.json'])).quota_bytes }} bytes`
          *Cluster Has Leader:* `{{ fromJson(read(outputs.probe_etcd_metrics.outputFiles['/tmp/etcd_health.json'])).has_leader == 1 ? 'Yes' : 'NO LEADER' }}`
          *Failed Proposals:* `{{ fromJson(read(outputs.probe_etcd_metrics.outputFiles['/tmp/etcd_health.json'])).failed_proposals }}`
          *Action Required:* Run `etcdctl compact` and `etcdctl defrag` immediately to free physical database space and prevent NOSPACE alarm locks.

  - id: record_audit_summary
    type: io.kestra.plugin.core.log.Log
    message: "Etcd audit completed for {{ inputs.etcd_endpoint }}. Quota used: {{ fromJson(read(outputs.probe_etcd_metrics.outputFiles['/tmp/etcd_health.json'])).quota_used_pct }}%, Has leader: {{ fromJson(read(outputs.probe_etcd_metrics.outputFiles['/tmp/etcd_health.json'])).has_leader }}."

errors:
  - id: handle_inspection_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      :rotating_light: *Sentinel Error: Etcd Storage Quota Monitor*
      *Execution ID:* `{{ execution.id }}`
      *State:* `{{ execution.state.current }}`
      *Details:* Failed to reach Etcd metrics endpoint at `{{ inputs.etcd_endpoint }}`.

triggers:
  - id: hourly_sentinel_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 * * * *"
    disabled: true

extend:
  title: Etcd Database Quota Saturation and Alarm Guard
  metaTitle: Etcd Database Quota Saturation Guard | Kestra
  shortDescription: Audits Etcd storage quota consumption and leader stability to prevent NOSPACE alarms and Kubernetes API freeze.
  metaDescription: Audits Etcd key-value store storage quota consumption and cluster leader stability to prevent NOSPACE alarms and Kubernetes API freeze.
  tags:
    - Infrastructure
    - Data
  subTags:
    - Monitoring & Alerting
    - Kubernetes Operations
  ee: false
  demo: false
  description: |
    Automated sentinel flow that audits Etcd distributed key-value clusters for physical database quota consumption and Raft leader stability to prevent cluster write locks.

    ## How it works

    1. Scheduled trigger fires hourly (or on-demand) to execute the cluster metrics probe.
    2. Probes Etcd HTTP `/metrics` endpoint to collect MVCC database size, backend storage quota, and consensus health.
    3. Python parser computes percentage of storage quota utilized and checks for active consensus leadership.
    4. An `io.kestra.plugin.core.flow.If` condition checks if storage quota exceeds configured limits or if the cluster has lost its Raft leader.
    5. Dispatches formatted Slack alerts containing actionable metrics if an anomaly is detected.
    6. Dedicated `errors` handler captures connection timeouts and network unreachable errors.

    ## What you get

    - Early warning before Etcd triggers its internal `NOSPACE` alarm and turns Kubernetes clusters into read-only states.
    - Visibility into MVCC revision buildup before physical defragmentation is urgently required.
    - Automated audit trail recorded in Kestra execution artifacts for cluster reliability compliance.

    ## Who it's for

    - Platform Engineers and Kubernetes Administrators managing production control planes and distributed state stores.
    - SREs responsible for Kubernetes high-availability uptime and disaster recovery.

    ## Why orchestrate this with Kestra

    - Declarative cluster auditing without deploying proprietary agent daemons on control plane nodes.
    - Centralized secret management for Etcd bearer tokens via `{{ secret('ETCD_TOKEN') }}`.
    - Unified alerting and automated remediation pipeline integration in declarative YAML workflows.

    ## Prerequisites

    - Network route from the Kestra worker to the Etcd client port 2379.
    - Etcd metrics endpoint enabled (default on port 2379).

    ### Secrets

    - `ETCD_TOKEN`: Optional bearer token for authenticated Etcd endpoints.
    - `SLACK_WEBHOOK`: Incoming webhook URL for operational alerts.

    ## Quick start

    1. Deploy this flow to your Kestra instance.
    2. Set `inputs.etcd_endpoint` to match your Etcd cluster client endpoint.
    3. Add the `SLACK_WEBHOOK` secret under the target namespace.
    4. Execute a manual test run to verify metric collection.
    5. Enable the `hourly_sentinel_schedule` trigger for continuous monitoring.

    ## How to extend

    - Add automated `etcdctl compact` and `etcdctl defrag` execution tasks inside the `then` branch.
    - Forward historical quota consumption rates into Prometheus or Grafana.
    - Integrate with PagerDuty for critical leaderless cluster conditions.

    ## Links

    - [Etcd Maintenance and Quota Documentation](https://etcd.io/docs/current/op-guide/maintenance/)
    - [Kestra Shell Plugin](https://kestra.io/plugins/plugin-scripts-shell)
    - [Kestra Slack Plugin](https://kestra.io/plugins/plugin-slack)
