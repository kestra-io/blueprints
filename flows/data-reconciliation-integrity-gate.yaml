id: data-reconciliation-integrity-gate
namespace: company.data

inputs:
  - id: demo_scenario
    type: SELECT
    displayName: Demo Scenario
    description: "Scenario to execute: HAPPY_PATH (immediate parity), REPLICA_LAG (converges on 2nd attempt), DATA_DRIFT (checksum mismatch fails gate)."
    defaults: HAPPY_PATH
    values:
      - HAPPY_PATH
      - REPLICA_LAG
      - DATA_DRIFT

  - id: max_polling_attempts
    type: INT
    displayName: Maximum Polling Iterations
    description: Maximum number of polling iterations before failing the parity gate.
    defaults: 5

  - id: polling_interval_seconds
    type: INT
    displayName: Polling Interval (Seconds)
    description: Delay in seconds between polling verification attempts.
    defaults: 2

  - id: alert_slack_channel
    type: STRING
    displayName: Slack Notification Channel
    description: Target Slack channel for incident alerts if reconciliation fails.
    defaults: "#data-ops-alerts"

  - id: enable_slack_notification
    type: BOOL
    displayName: Enable Slack Alerts
    description: Enable Slack webhook alerts on failure. Requires SLACK_WEBHOOK_URL secret.
    defaults: false

triggers:
  - id: cdc_sync_event
    type: io.kestra.plugin.core.trigger.Webhook
    key: cdc-sync-event
    description: Webhook trigger invoked by upstream CDC systems upon replication completion.
    disabled: true

  - id: hourly_reconciliation_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 * * * *"
    description: Scheduled reconciliation sweep verifying replica consistency hourly.
    disabled: true

tasks:
  - id: setup_demo_warehouse
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: Initializes isolated DuckDB warehouse tables representing primary, replica, and staging environments.
    outputDbFile: true
    sql: |
      -- Staging table awaiting promotion to production target
      CREATE OR REPLACE TABLE staging_orders (
          id BIGINT,
          customer_id VARCHAR,
          order_amount DECIMAL(10,2),
          order_status VARCHAR,
          created_at TIMESTAMP
      );

      INSERT INTO staging_orders VALUES
          (101, 'cust_001', 250.00, 'COMPLETED', TIMESTAMP '2026-10-30 10:00:00'),
          (102, 'cust_002', 45.50,  'COMPLETED', TIMESTAMP '2026-10-30 10:05:00'),
          (103, 'cust_003', 1200.00,'COMPLETED', TIMESTAMP '2026-10-30 10:10:00'),
          (104, 'cust_004', 89.99,  'COMPLETED', TIMESTAMP '2026-10-30 10:15:00'),
          (105, 'cust_005', 310.25, 'COMPLETED', TIMESTAMP '2026-10-30 10:20:00');

      -- Primary source table representing authoritative system of record
      CREATE OR REPLACE TABLE source_a_primary (
          id BIGINT,
          customer_id VARCHAR,
          order_amount DECIMAL(10,2),
          order_status VARCHAR,
          created_at TIMESTAMP
      );

      INSERT INTO source_a_primary SELECT * FROM staging_orders;

      -- Read-replica table populated according to chosen demo scenario
      CREATE OR REPLACE TABLE source_b_replica (
          id BIGINT,
          customer_id VARCHAR,
          order_amount DECIMAL(10,2),
          order_status VARCHAR,
          created_at TIMESTAMP,
          available_after_attempt INTEGER DEFAULT 1
      );

      -- Seed replica based on test scenario with valid Pebble syntax
      {% if inputs.demo_scenario == 'HAPPY_PATH' %}
      INSERT INTO source_b_replica
      SELECT id, customer_id, order_amount, order_status, created_at, 1 FROM staging_orders;
      {% elseif inputs.demo_scenario == 'REPLICA_LAG' %}
      -- Initial CDC lag: items 101-103 available on attempt 1, 104-105 catch up on attempt 2
      INSERT INTO source_b_replica
      SELECT id, customer_id, order_amount, order_status, created_at,
             CASE WHEN id <= 103 THEN 1 ELSE 2 END
      FROM staging_orders;
      {% elseif inputs.demo_scenario == 'DATA_DRIFT' %}
      -- Unrecoverable drift: identical row counts but mismatched amounts/statuses
      INSERT INTO source_b_replica VALUES
          (101, 'cust_001', 250.00,  'COMPLETED', TIMESTAMP '2026-10-30 10:00:00', 1),
          (102, 'cust_002', 45.50,   'COMPLETED', TIMESTAMP '2026-10-30 10:05:00', 1),
          (103, 'cust_003', 9999.00, 'COMPLETED', TIMESTAMP '2026-10-30 10:10:00', 1),
          (104, 'cust_004', 89.99,   'COMPLETED', TIMESTAMP '2026-10-30 10:15:00', 1),
          (105, 'cust_005', 310.25,  'CANCELLED', TIMESTAMP '2026-10-30 10:20:00', 1);
      {% endif %}

      -- Production target warehouse table
      CREATE OR REPLACE TABLE target_orders (
          id BIGINT PRIMARY KEY,
          customer_id VARCHAR,
          order_amount DECIMAL(10,2),
          order_status VARCHAR,
          created_at TIMESTAMP,
          promoted_at TIMESTAMP
      );

  - id: reconcile_parity_gate
    type: io.kestra.plugin.core.flow.LoopUntil
    description: >
      Repeatedly verifies checksum and row count parity across sources until convergent or timed out.
      NOTE: The condition references leaf task IDs (primary_checksum, replica_checksum) directly — not
      the enclosing Parallel container — which is the correct Kestra output-scoping pattern.
    condition: "{{ outputs.primary_checksum.row.row_count == outputs.replica_checksum.row.row_count and outputs.primary_checksum.row.content_checksum == outputs.replica_checksum.row.content_checksum }}"
    failOnMaxReached: true
    checkFrequency:
      maxIterations: "{{ inputs.max_polling_attempts }}"
      interval: "PT{{ inputs.polling_interval_seconds }}S"
    tasks:
      - id: record_polling_attempt
        type: io.kestra.plugin.core.kv.Set
        description: Increments iteration counter in Kestra KV store to drive lag convergence.
        key: "reconcile_attempt_{{ execution.id }}"
        kvType: NUMBER
        value: "{{ (kv('reconcile_attempt_' ~ execution.id, errorOnMissing=false) ?? 0) + 1 }}"

      - id: fetch_source_checksums
        type: io.kestra.plugin.core.flow.Parallel
        description: Queries primary and replica sources concurrently to compute parity metrics.
        tasks:
          - id: primary_checksum
            type: io.kestra.plugin.jdbc.duckdb.Query
            databaseUri: "{{ outputs.setup_demo_warehouse.databaseUri }}"
            fetchType: FETCH_ONE
            sql: |
              SELECT
                  COUNT(*) AS row_count,
                  COALESCE(
                      MD5(STRING_AGG(CONCAT_WS(':', CAST(id AS VARCHAR), customer_id, CAST(order_amount AS VARCHAR), order_status), '' ORDER BY id)),
                      'EMPTY'
                  ) AS content_checksum
              FROM source_a_primary;

          - id: replica_checksum
            type: io.kestra.plugin.jdbc.duckdb.Query
            databaseUri: "{{ outputs.setup_demo_warehouse.databaseUri }}"
            fetchType: FETCH_ONE
            sql: |
              SELECT
                  COUNT(*) AS row_count,
                  COALESCE(
                      MD5(STRING_AGG(CONCAT_WS(':', CAST(id AS VARCHAR), customer_id, CAST(order_amount AS VARCHAR), order_status), '' ORDER BY id)),
                      'EMPTY'
                  ) AS content_checksum
              FROM source_b_replica
              WHERE available_after_attempt <= {{ kv('reconcile_attempt_' ~ execution.id, errorOnMissing=false) ?? 1 }};

  - id: promote_staged_data
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: Safely promotes validated staged orders into target warehouse upon verified parity.
    databaseUri: "{{ outputs.setup_demo_warehouse.databaseUri }}"
    outputDbFile: true
    sql: |
      INSERT INTO target_orders (id, customer_id, order_amount, order_status, created_at, promoted_at)
      SELECT
          id,
          customer_id,
          order_amount,
          order_status,
          created_at,
          CURRENT_TIMESTAMP AS promoted_at
      FROM staging_orders;

  - id: verify_target_promotion
    type: io.kestra.plugin.jdbc.duckdb.Query
    description: Asserts that target production table received all promoted staging records.
    databaseUri: "{{ outputs.promote_staged_data.databaseUri }}"
    fetchType: FETCH_ONE
    sql: |
      SELECT COUNT(*) AS promoted_count FROM target_orders;

  - id: cleanup_kv_store_success
    type: io.kestra.plugin.core.kv.Delete
    description: Removes the iteration counter key written during reconciliation polling (success path).
    key: "reconcile_attempt_{{ execution.id }}"

  - id: log_successful_promotion
    type: io.kestra.plugin.core.log.Log
    message: |
      ===============================================================
      [DATA INTEGRITY GATE] SUCCESSFUL PROMOTION AUDIT
      ---------------------------------------------------------------
      Execution ID    : {{ execution.id }}
      Demo Scenario   : {{ inputs.demo_scenario }}
      Primary Count   : {{ outputs.primary_checksum.row.row_count }}
      Replica Count   : {{ outputs.replica_checksum.row.row_count }}
      Checksum Parity : MATCH ({{ outputs.primary_checksum.row.content_checksum }})
      Target Records  : {{ outputs.verify_target_promotion.row.promoted_count }} rows successfully promoted
      ===============================================================

errors:
  - id: extract_drift_forensics
    type: io.kestra.plugin.jdbc.duckdb.Query
    description: Extracts divergent records to pinpoint specific discrepancies for incident triage.
    databaseUri: "{{ outputs.setup_demo_warehouse.databaseUri }}"
    fetchType: FETCH
    sql: |
      SELECT
          COALESCE(p.id, r.id) AS record_id,
          p.order_amount AS primary_amount,
          r.order_amount AS replica_amount,
          p.order_status AS primary_status,
          r.order_status AS replica_status,
          CASE
              WHEN p.id IS NULL THEN 'MISSING_IN_PRIMARY'
              WHEN r.id IS NULL THEN 'MISSING_IN_REPLICA'
              WHEN p.order_amount != r.order_amount THEN 'AMOUNT_MISMATCH'
              WHEN p.order_status != r.order_status THEN 'STATUS_MISMATCH'
              ELSE 'UNKNOWN_DIVERGENCE'
          END AS divergence_reason
      FROM source_a_primary p
      FULL OUTER JOIN source_b_replica r ON p.id = r.id
      WHERE p.id IS NULL
         OR r.id IS NULL
         OR p.order_amount != r.order_amount
         OR p.order_status != r.order_status
      LIMIT 10;

  - id: cleanup_kv_store_failure
    type: io.kestra.plugin.core.kv.Delete
    description: >
      Removes the iteration counter key written during reconciliation polling (failure path)
      to prevent KV store accumulation across failed executions.
    key: "reconcile_attempt_{{ execution.id }}"

  - id: log_divergence_diagnostics
    type: io.kestra.plugin.core.log.Log
    level: ERROR
    message: |
      ===============================================================
      [DATA INTEGRITY GATE] INTEGRITY BREACH - PIPELINE ABORTED
      ---------------------------------------------------------------
      Execution ID       : {{ execution.id }}
      Scenario           : {{ inputs.demo_scenario }}
      Primary Checksum   : {{ outputs.primary_checksum.row.content_checksum | default('N/A') }} ({{ outputs.primary_checksum.row.row_count | default('N/A') }} rows)
      Replica Checksum   : {{ outputs.replica_checksum.row.content_checksum | default('N/A') }} ({{ outputs.replica_checksum.row.row_count | default('N/A') }} rows)
      Forensics Extracted: {{ outputs.extract_drift_forensics.size | default(0) }} divergent sample records identified.
      Promotion Status   : BLOCKED - No staged records promoted to target_orders.
      ===============================================================

  - id: alert_slack_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Dispatches high-priority incident alert to Slack with execution diagnostics.
    runIf: "{{ inputs.enable_slack_notification }}"
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "{{ inputs.alert_slack_channel }}",
        "attachments": [
          {
            "color": "#D32F2F",
            "title": ":rotating_light: Data Integrity Gate Failure Alert",
            "title_link": "{{ envs.KESTRA_URL ?? 'http://localhost:8080' }}/ui/executions/{{ flow.namespace }}/{{ flow.id }}/{{ execution.id }}",
            "fields": [
              {
                "title": "Flow",
                "value": "`{{ flow.namespace }}.{{ flow.id }}`",
                "short": true
              },
              {
                "title": "Execution ID",
                "value": "`{{ execution.id }}`",
                "short": true
              },
              {
                "title": "Scenario",
                "value": "{{ inputs.demo_scenario }}",
                "short": true
              },
              {
                "title": "Primary Rows",
                "value": "{{ outputs.primary_checksum.row.row_count | default('N/A') }}",
                "short": true
              },
              {
                "title": "Replica Rows",
                "value": "{{ outputs.replica_checksum.row.row_count | default('N/A') }}",
                "short": true
              },
              {
                "title": "Parity Status",
                "value": "CHECKSUM_MISMATCH - Staging promotion prevented",
                "short": false
              }
            ],
            "footer": "Kestra Data Reconciliation & Integrity Gate",
            "ts": {{ now() | timestamp }}
          }
        ]
      }

extend:
  title: Data Reconciliation & Parity Gate with Automated Polling and Slack Alerts
  metaTitle: Data Reconciliation & Integrity Gate | Kestra
  shortDescription: Verify replica parity and cryptographic checksums in DuckDB before promoting staged data, with automatic polling and Slack alerts.
  metaDescription: Reconcile read replica parity and cryptographic checksums in DuckDB before promoting data, featuring automated polling and Slack alerts.
  description: |
    This flow implements an automated data reconciliation and integrity gate before promoting staged records into production analytical tables. It is designed for Change Data Capture (CDC) pipelines and primary-to-replica synchronization patterns where replication lag or network drops can cause inconsistent data states.

    ## How it works

    1. **Demo Warehouse Initialization**: Seeds isolated DuckDB staging, primary, and replica tables with realistic order records, demonstrating clean parity, CDC lag catch-up, or deliberate data drift scenarios based on the `demo_scenario` input.
    2. **Parallel Checksum Verification**: Dispatches concurrent DuckDB queries using `io.kestra.plugin.core.flow.Parallel` to calculate row volumes and order-deterministic MD5 cryptographic content checksums across both primary and read-replica datasets.
    3. **Automated Convergence Polling**: Encapsulates the verification logic inside `io.kestra.plugin.core.flow.LoopUntil`. If replication lag is detected, the flow pauses and repeatedly samples checksums until parity converges or the polling threshold (`max_polling_attempts`) is exhausted.
    4. **Atomic Staging Promotion**: Upon confirmed parity, the flow safely executes `INSERT INTO target_orders SELECT ... FROM staging_orders` and logs audit metadata.
    5. **Automated Incident Triage & Alerts**: If parity fails to converge or unrecoverable drift occurs, the `errors` handler triggers forensic SQL queries (locating unmatched order IDs via `FULL OUTER JOIN`), cleans up the KV store, logs divergence diagnostics, and sends rich notifications to Slack via `io.kestra.plugin.slack.notifications.SlackIncomingWebhook`.

    ## What you get

    - **Deterministic Parity Gates**: Avoid downstream dashboard corruptions by preventing staging promotion until row counts and cryptographic checksums match 100%.
    - **Self-Healing Replication Lag**: Transparently resolves transient CDC lag using configurable backoff and iteration limits without failing the pipeline immediately.
    - **Forensic Triage**: Identifies divergence root causes with row-level forensic queries directly inside the execution error handler.
    - **Multi-Channel Alerting**: Instant notification via Slack incoming webhooks with contextual error details, execution IDs, and namespace context.
    - **Portable Embedded Execution**: Runs completely self-contained on embedded DuckDB without external database infrastructure required for testing.

    ## Who it's for

    - **Analytics Engineers**: Ensuring data warehouse staging layers are populated only when upstream CDC replicas are consistent.
    - **Data Engineers**: Orchestrating cross-database replication pipelines and enforcing pre-load integrity assertions.
    - **Data Platform Teams**: Establishing standard validation gate templates for downstream ingestion teams.

    ## Why orchestrate this with Kestra

    - **Flowable Control**: Native `LoopUntil` and `Parallel` execution blocks allow multi-source polling without external scheduling daemons or custom polling loops.
    - **Execution Scoping**: Embedded database files persist across task boundaries using task output URIs (`outputs.setup_demo_warehouse.databaseUri`) within a single flow run.
    - **Resilient Error Pipelines**: Standardized `errors` handlers capture failures at any pipeline stage, running cleanup and diagnostic workflows before terminating.
    - **Extensible Integration**: Decoupled task definitions make it straightforward to replace DuckDB with Snowflake, BigQuery, PostgreSQL, or ClickHouse using standard Kestra JDBC plugins.

    ## Prerequisites

    - A Kestra instance with the DuckDB (`plugin-jdbc-duckdb`) and Slack (`plugin-slack`) plugins installed (tested on Kestra 2.0+).
    - Optional: A Slack Incoming Webhook URL stored as a Kestra secret if Slack failure alerts are enabled.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Required only when `enable_slack_notification` is `true`. Configure under **Administration → Secrets** with your Slack Incoming Webhook URL.

    ## Quick start

    1. Save this blueprint into your Kestra instance under namespace `company.data`.
    2. Click **New Execution** and run with default inputs (`demo_scenario: HAPPY_PATH`) to test immediate checksum convergence and successful data promotion.
    3. Run with `demo_scenario: REPLICA_LAG` to observe automated `LoopUntil` retries converging after replica catches up.
    4. Run with `demo_scenario: DATA_DRIFT` to observe the parity gate breach, forensic failure extraction, and incident alert handling.

    ## How to extend

    - **Swap Database Engines**: Replace `io.kestra.plugin.jdbc.duckdb.Query` tasks with `io.kestra.plugin.jdbc.snowflake.Query`, `io.kestra.plugin.jdbc.postgres.Query`, or `io.kestra.plugin.jdbc.bigquery.Query` for production enterprise warehouses.
    - **Dynamic Tolerance**: Add numeric thresholds in `LoopUntil` conditions (e.g., allow up to 0.01% volume drift for soft-gate configurations).
    - **Triggering Ingestion**: Enable the included `cdc_sync_event` trigger or attach an `io.kestra.plugin.core.trigger.Flow` trigger to initiate downstream dbt/Sling transformations once parity promotion succeeds.

    ## Links

    - [Kestra LoopUntil Documentation](https://kestra.io/plugins/core/flow/loopuntil)
    - [Kestra Parallel Documentation](https://kestra.io/plugins/core/flow/parallel)
    - [Kestra Key-Value Store Documentation](https://kestra.io/plugins/core/kv)
    - [Kestra DuckDB Plugin](https://kestra.io/plugins/plugin-jdbc-duckdb)
    - [Kestra Slack Plugin](https://kestra.io/plugins/plugin-slack)
  tags:
    - Data
  subTags:
    - Testing & Quality
    - Realtime & Streaming
  ee: false
  demo: false
