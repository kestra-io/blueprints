id: postgres-connection-pool-and-deadlock-sentinel
namespace: company.team
description: |
  Automated PostgreSQL connection saturation and lock health monitor. Queries pg_stat_database and pg_stat_activity
  to detect pool exhaustion, aged idle-in-transaction connections, and deadlocks, alerting DBAs on Slack.

concurrency:
  limit: 1

inputs:
  - id: postgres_url
    type: STRING
    displayName: PostgreSQL JDBC URL
    description: JDBC connection string targeting the target PostgreSQL database.
    defaults: "jdbc:postgresql://localhost:5432/postgres"

  - id: max_connection_utilization_percent
    type: FLOAT
    displayName: Max Connection Utilization Percent
    description: Threshold percentage of max_connections beyond which an alert is triggered.
    defaults: 80.0

  - id: max_idle_transaction_age_seconds
    type: INT
    displayName: Max Idle in Transaction Age (Seconds)
    description: Duration in seconds an idle transaction can remain open before triggering an alert.
    defaults: 120

  - id: slack_channel
    type: STRING
    displayName: Alert Channel
    description: Slack channel destination for database performance alerts.
    defaults: "#dba-alerts"

triggers:
  - id: scheduled_health_check
    type: io.kestra.plugin.core.trigger.Schedule
    description: Periodic PostgreSQL connection pool and lock health check executed every 5 minutes.
    cron: "*/5 * * * *"

tasks:
  - id: audit_postgres_health
    type: io.kestra.plugin.jdbc.postgres.Query
    description: Query pg_stat_activity and pg_stat_database to compute connection saturation and idle transaction metrics.
    url: "{{ inputs.postgres_url }}"
    username: "{{ secret('POSTGRES_USERNAME') }}"
    password: "{{ secret('POSTGRES_PASSWORD') }}"
    fetchType: FETCH
    sql: |
      WITH connection_stats AS (
        SELECT
          COUNT(*) AS total_connections,
          COUNT(*) FILTER (WHERE state = 'active') AS active_connections,
          COUNT(*) FILTER (WHERE state = 'idle') AS idle_connections,
          COUNT(*) FILTER (WHERE state = 'idle in transaction') AS idle_in_transaction_connections,
          COUNT(*) FILTER (
            WHERE state = 'idle in transaction'
              AND EXTRACT(EPOCH FROM (now() - state_change)) >= {{ inputs.max_idle_transaction_age_seconds }}
          ) AS aged_idle_in_transaction_connections,
          MAX(EXTRACT(EPOCH FROM (now() - state_change))) FILTER (WHERE state = 'idle in transaction') AS max_idle_in_trx_seconds
        FROM pg_stat_activity
        WHERE backend_type = 'client backend'
      ),
      database_deadlocks AS (
        SELECT COALESCE(SUM(deadlocks), 0) AS total_deadlocks
        FROM pg_stat_database
        WHERE datname = current_database()
      ),
      server_settings AS (
        SELECT setting::int AS max_connections
        FROM pg_settings
        WHERE name = 'max_connections'
      )
      SELECT
        c.total_connections,
        c.active_connections,
        c.idle_connections,
        c.idle_in_transaction_connections,
        c.aged_idle_in_transaction_connections,
        ROUND(COALESCE(c.max_idle_in_trx_seconds, 0)::numeric, 1) AS max_idle_in_trx_seconds,
        d.total_deadlocks,
        s.max_connections,
        ROUND((c.total_connections::numeric / s.max_connections::numeric) * 100, 1) AS connection_utilization_percent,
        CASE
          WHEN (c.total_connections::numeric / s.max_connections::numeric) * 100 >= {{ inputs.max_connection_utilization_percent }} THEN 'CONNECTION_POOL_SATURATION'
          WHEN c.aged_idle_in_transaction_connections > 0 THEN 'IDLE_IN_TRANSACTION_STARVATION'
          ELSE 'HEALTHY'
        END AS health_status
      FROM connection_stats c
      CROSS JOIN database_deadlocks d
      CROSS JOIN server_settings s;

  - id: evaluate_health_thresholds
    type: io.kestra.plugin.core.flow.If
    description: Branch execution when connection utilization or idle transaction duration breaches thresholds.
    condition: "{{ outputs.audit_postgres_health.rows[0].health_status != 'HEALTHY' }}"
    then:
      - id: notify_dba_slack
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Broadcast critical connection pool warning with operational diagnostics to Slack.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        messageText: |
          *PostgreSQL Connection Pool Alert*
          • *Status*: `{{ outputs.audit_postgres_health.rows[0].health_status }}`
          • *Connection Utilization*: `{{ outputs.audit_postgres_health.rows[0].total_connections }} / {{ outputs.audit_postgres_health.rows[0].max_connections }}` (`{{ outputs.audit_postgres_health.rows[0].connection_utilization_percent }}%`)
          • *Active Queries*: `{{ outputs.audit_postgres_health.rows[0].active_connections }}`
          • *Idle in Transaction*: `{{ outputs.audit_postgres_health.rows[0].idle_in_transaction_connections }}` (Aged >= {{ inputs.max_idle_transaction_age_seconds }}s: `{{ outputs.audit_postgres_health.rows[0].aged_idle_in_transaction_connections }}`)
          • *Max Idle Transaction Duration*: `{{ outputs.audit_postgres_health.rows[0].max_idle_in_trx_seconds }}s`
          • *Total Recorded Deadlocks*: `{{ outputs.audit_postgres_health.rows[0].total_deadlocks }}`
          • *Remediation*: Investigate unclosed client connections. Terminate stalled sessions with `SELECT pg_terminate_backend(pid);` or adjust PgBouncer pool sizing.

    else:
      - id: log_healthy_status
        type: io.kestra.plugin.core.log.Log
        description: Confirm that connection pool utilization is well within nominal operational limits.
        message: "PostgreSQL connection pool health is nominal. Current utilization: {{ outputs.audit_postgres_health.rows[0].connection_utilization_percent }}% of max_connections."

  - id: export_audit_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Record connection pool telemetry manifest for execution history and reliability records.
    format: |
      {
        "pipeline": "postgres-connection-pool-and-deadlock-sentinel",
        "audited_at": "{{ execution.startDate }}",
        "health_status": "{{ outputs.audit_postgres_health.rows[0].health_status }}",
        "connection_utilization_percent": {{ outputs.audit_postgres_health.rows[0].connection_utilization_percent }},
        "total_connections": {{ outputs.audit_postgres_health.rows[0].total_connections }},
        "max_connections": {{ outputs.audit_postgres_health.rows[0].max_connections }},
        "aged_idle_in_trx": {{ outputs.audit_postgres_health.rows[0].aged_idle_in_transaction_connections }}
      }

extend:
  shortDescription: Monitor PostgreSQL connection pool utilization, aged idle-in-transaction sessions, and deadlocks with automated Slack alerts.
  title: PostgreSQL Connection Pool Saturation and Deadlock Sentinel
  metaTitle: PostgreSQL Connection Pool Sentinel | Kestra Blueprint
  metaDescription: Automated database reliability workflow to monitor PostgreSQL connection pool limits, idle transactions, deadlocks, and alert Slack.
  description: |
    In PostgreSQL production environments, connection pool exhaustion and lingering idle-in-transaction states represent catastrophic failure vectors. When application workloads leak connections or experience sudden traffic spikes, active sessions quickly consume the server's `max_connections` allocation. Once saturated, PostgreSQL rejects incoming requests with `FATAL: remaining connection slots are reserved for non-replication superuser connections`, abruptly taking dependent services offline.

    Furthermore, connections left in `idle in transaction` state prevent the autovacuum daemon from cleaning dead row versions (tuples). This results in severe table bloat, disk exhaustion, and degraded query cache hit ratios.

    This blueprint establishes a continuous reliability watchdog for PostgreSQL. Executing on a 5-minute schedule or on-demand, it inspects `pg_stat_activity` and `pg_stat_database` to evaluate pool utilization percentages, flags aged idle transactions, records cumulative deadlocks, and delivers actionable Slack alerts before connection starvation causes production outages.

    ## How it works

    1. **Scheduled Health Check**: The `scheduled_health_check` trigger (`io.kestra.plugin.core.trigger.Schedule`) executes every 5 minutes or on-demand via the Kestra UI.
    2. **Activity & Pool Audit**: The `audit_postgres_health` task (`io.kestra.plugin.jdbc.postgres.Query`) queries `pg_stat_activity` and `pg_settings` using Common Table Expressions (CTEs) to calculate connection utilization percentage against `max_connections` and identify transactions left idle for longer than `max_idle_transaction_age_seconds`.
    3. **Threshold Gate**: The `evaluate_health_thresholds` flowable task (`io.kestra.plugin.core.flow.If`) evaluates whether the computed `health_status` is non-healthy (`CONNECTION_POOL_SATURATION` or `IDLE_IN_TRANSACTION_STARVATION`).
    4. **Slack Alert Notification**: If thresholds are breached, `notify_dba_slack` (`io.kestra.plugin.slack.notifications.SlackIncomingWebhook`) dispatches a diagnostic card detailing connection counts, aged idle transaction duration, and remediation commands.
    5. **Nominal Logging**: If all metrics remain healthy, `log_healthy_status` records current pool capacity in execution logs.
    6. **Audit Manifest**: The `export_audit_manifest` task records telemetry metrics for reliability reporting and observability platforms.

    ## What you get

    - Early warning before PostgreSQL reaches `max_connections` and rejects application queries.
    - Detection of aged `idle in transaction` sessions that cause table bloat and block autovacuum.
    - Visibility into cumulative database deadlock counts.
    - Zero human overhead for continuous PostgreSQL connection health surveillance.

    ## Who it is for

    - Site Reliability Engineers (SREs) and Database Administrators managing production PostgreSQL clusters.
    - Backend engineers diagnosing connection leaks, pool starvation, or transaction timeout spikes.
    - Platform teams managing connection poolers such as PgBouncer or Pgpool-II.

    ## Why orchestrate this with Kestra

    Monitoring PostgreSQL connection pool health usually requires complex external metric agents or custom cron daemons. Kestra provides declarative, serverless orchestration: it handles secure JDBC connectivity, schedules regular health checks, branches conditionally based on utilization thresholds, and alerts the engineering team directly in Slack.

    ## Inputs

    | Name | Type | Default | Description |
    | :--- | :--- | :--- | :--- |
    | `postgres_url` | STRING | `jdbc:postgresql://localhost:5432/postgres` | JDBC connection string targeting the target PostgreSQL database. |
    | `max_connection_utilization_percent` | FLOAT | `80.0` | Threshold percentage of max_connections beyond which an alert is triggered. |
    | `max_idle_transaction_age_seconds` | INT | `120` | Duration in seconds an idle transaction can remain open before triggering an alert. |
    | `slack_channel` | STRING | `#dba-alerts` | Slack channel destination for database performance alerts. |

    ## Expected outputs

    - `{{ outputs.audit_postgres_health.rows[0].connection_utilization_percent }}`: Current percentage of allowed connections in use.
    - `{{ outputs.audit_postgres_health.rows[0].idle_in_transaction_connections }}`: Count of active sessions currently holding an uncommitted transaction in idle state.
    - `{{ outputs.audit_postgres_health.rows[0].aged_idle_in_transaction_connections }}`: Count of idle transactions older than the configured threshold.
    - `{{ outputs.audit_postgres_health.rows[0].health_status }}`: Computed operational status (`HEALTHY`, `CONNECTION_POOL_SATURATION`, or `IDLE_IN_TRANSACTION_STARVATION`).
    - `{{ outputs.export_audit_manifest.value }}`: Structured JSON telemetry manifest recording execution timestamp and pool metrics.

    ## Prerequisites

    - A PostgreSQL database instance (version 12, 13, 14, 15, or 16).
    - A database user with `pg_read_all_stats` role or superuser privileges to inspect all client connections in `pg_stat_activity`.
    - A Slack Incoming Webhook URL targeting your database alert channel.

    ### Secrets

    - `POSTGRES_USERNAME`: Database username authorized to inspect server activity views.
    - `POSTGRES_PASSWORD`: Password for the PostgreSQL monitoring user.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook endpoint URL used for sending alert notifications.

    ## Quick start

    1. Configure `POSTGRES_USERNAME`, `POSTGRES_PASSWORD`, and `SLACK_WEBHOOK_URL` in your Kestra namespace secrets.
    2. Import this flow YAML into your Kestra instance.
    3. Click **Execute** in the UI to run an initial connection audit.
    4. Review execution outputs to check connection pool utilization and active transaction states.

    ## Common pitfalls and troubleshooting

    - **Permissions on pg_stat_activity**: In PostgreSQL 10+, non-superuser accounts can only view queries executed by their own role unless granted the `pg_read_all_stats` predefined role. Grant `GRANT pg_read_all_stats TO <monitoring_user>;` for full visibility.
    - **Pooled Connection Behavior**: If utilizing an external transaction pooler like PgBouncer in transaction pooling mode, server connections may rapidly fluctuate. Adjust `max_idle_transaction_age_seconds` to reflect your workload characteristics.
    - **Deadlock Metric Reset**: The `deadlocks` column in `pg_stat_database` is cumulative since the last stats reset. Track the change over time rather than absolute historical counts.

    ## How to extend

    - Add `io.kestra.plugin.notifications.pagerduty.PagerDutyAlert` inside the `then:` block for critical saturation escalations.
    - Automate termination of idle sessions older than 600 seconds by adding an auxiliary task executing `SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE ...`.
    - Monitor replication slot lag by joining `pg_replication_slots` into the diagnostic query.

    ## Links

    - Kestra PostgreSQL Plugin Documentation: https://kestra.io/plugins/plugin-jdbc-postgres
    - Kestra Slack Plugin Documentation: https://kestra.io/plugins/plugin-notifications
    - PostgreSQL pg_stat_activity Documentation: https://www.postgresql.org/docs/current/monitoring-stats.html#PG-STAT-ACTIVITY-VIEW
  tags:
    - Data
    - Business
  subTags:
    - Warehousing & Analytics
    - Observability & Performance
  ee: false
  demo: false
