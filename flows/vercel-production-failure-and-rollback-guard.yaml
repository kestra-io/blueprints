id: vercel-production-failure-and-rollback-guard
namespace: company.platform

description: |
  Audit Vercel project deployments for production build failures and stalled pipelines.
  When the active production deployment is degraded or broken, this flow identifies the
  last known healthy deployment, alerts Slack, pauses for interactive operator approval,
  and executes an automated zero-downtime rollback promotion via Vercel's REST API.

inputs:
  - id: vercel_api_token
    type: STRING
    displayName: Vercel API Token
    description: >-
      Vercel Personal Access Token or Team Token with deployment read and project write permissions.
      Leave blank to automatically use the VERCEL_API_TOKEN secret.
    defaults: ""

  - id: project_id
    type: STRING
    displayName: Vercel Project ID or Name
    description: Name or ID of the Vercel project to monitor (e.g., 'acme-web' or 'prj_xxxx').
    defaults: "acme-web"

  - id: team_id
    type: STRING
    displayName: Vercel Team ID or Slug
    description: Optional Vercel Team ID or slug (e.g. team_xxxx) for team-scoped projects. Leave blank for personal accounts.
    defaults: ""

  - id: stalled_threshold_minutes
    type: INT
    displayName: Stalled Build Threshold (Minutes)
    description: Duration in minutes after which an in-flight deployment in BUILDING, INITIALIZING, or QUEUED state is flagged as stalled.
    defaults: 15

  - id: auto_rollback
    type: BOOL
    displayName: Enable Rollback Remediation
    description: When true and a production failure is detected, initiates the rollback promotion workflow.
    defaults: true

  - id: require_approval
    type: BOOL
    displayName: Require Human Approval Before Rollback
    description: When true, pauses execution via Kestra UI for operator confirmation before promoting the rollback deployment.
    defaults: true

  - id: rollback_reason
    type: STRING
    displayName: Rollback Reason Message
    description: Audit description attached to the Vercel rollback API call.
    defaults: "Automated production rollback executed by Kestra failure guard"

triggers:
  - id: scheduled_production_health_check
    type: io.kestra.plugin.core.trigger.Schedule
    description: Recurring hourly production deployment health surveillance. Shipped disabled by default.
    cron: "0 * * * *"
    disabled: true

tasks:
  - id: audit_production_deployments
    type: io.kestra.plugin.scripts.python.Script
    description: Queries Vercel v6 Deployments API, inspects production deployment health, and isolates the latest healthy rollback candidate.
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    script: |
      import os
      import json
      import time
      import urllib.request
      import urllib.error
      import urllib.parse
      from datetime import datetime, timezone

      try:
          from kestra import Kestra
      except ImportError:
          Kestra = None

      token = "{{ inputs.vercel_api_token != '' ? inputs.vercel_api_token : secret('VERCEL_API_TOKEN') }}"
      project_id = "{{ inputs.project_id }}".strip()
      team_id = "{{ inputs.team_id }}".strip()
      stalled_threshold_minutes = int("{{ inputs.stalled_threshold_minutes }}")
      auto_rollback = "{{ inputs.auto_rollback }}".lower() == "true"

      now_ms = int(time.time() * 1000)
      stalled_threshold_ms = stalled_threshold_minutes * 60 * 1000

      params = {"app": project_id, "limit": "30"}
      if team_id:
          params["teamId"] = team_id

      query_string = urllib.parse.urlencode(params)
      api_url = f"https://api.vercel.com/v6/deployments?{query_string}"

      headers = {
          "Authorization": f"Bearer {token}",
          "Content-Type": "application/json",
          "User-Agent": "kestra-vercel-rollback-guard/1.0"
      }

      req = urllib.request.Request(api_url, headers=headers, method="GET")

      try:
          with urllib.request.urlopen(req, timeout=30) as response:
              raw_body = response.read().decode("utf-8")
              payload = json.loads(raw_body)
      except urllib.error.HTTPError as e:
          err_msg = e.read().decode("utf-8") if e.fp else str(e)
          print(f"HTTPError {e.code} contacting Vercel API: {err_msg}")
          raise RuntimeError(f"Vercel API returned HTTP {e.code}: {err_msg}")
      except Exception as e:
          print(f"Error querying Vercel deployments: {e}")
          raise

      deployments = payload.get("deployments", [])
      print(f"Retrieved {len(deployments)} deployments for project '{project_id}'.")

      prod_deployments = [d for d in deployments if (d.get("target") or "preview") == "production"]
      if not prod_deployments:
          print("No production deployments found in audit window.")
          summary = f"No production deployments found for project '{project_id}'."
          if Kestra:
              Kestra.outputs({
                  "is_production_degraded": False,
                  "should_trigger_rollback": False,
                  "rollback_available": False,
                  "latest_deployment_id": "none",
                  "latest_state": "NONE",
                  "latest_commit": "none",
                  "latest_author": "none",
                  "latest_url": "",
                  "rollback_candidate_id": "none",
                  "rollback_candidate_url": "",
                  "rollback_candidate_commit": "none",
                  "rollback_candidate_author": "none",
                  "failure_reason": "No production deployments recorded.",
                  "summary_markdown": summary
              })
          exit(0)

      latest = prod_deployments[0]
      latest_id = latest.get("uid") or latest.get("id") or "unknown"
      latest_state = str(latest.get("state") or latest.get("readyState") or "UNKNOWN").upper()
      latest_created = int(latest.get("created") or latest.get("createdAt") or 0)
      latest_meta = latest.get("meta") or {}
      latest_commit = (latest_meta.get("githubCommitSha") or latest_meta.get("commitSha") or "")[:8]
      latest_branch = latest_meta.get("githubCommitRef") or latest_meta.get("branch") or "main"
      latest_author = latest_meta.get("githubCommitAuthorName") or (latest.get("creator") or {}).get("username") or "unknown"
      latest_url = latest.get("url") or ""
      if latest_url and not latest_url.startswith("http"):
          latest_url = f"https://{latest_url}"

      age_ms = now_ms - latest_created if latest_created > 0 else 0
      age_minutes = int(round(age_ms / 60000.0))

      is_degraded = False
      failure_reason = ""

      if latest_state == "ERROR":
          is_degraded = True
          failure_reason = f"Latest production deployment {latest_id} failed with ERROR state."
      elif latest_state in ("BUILDING", "INITIALIZING", "QUEUED") and age_ms >= stalled_threshold_ms:
          is_degraded = True
          failure_reason = f"Production deployment {latest_id} is stalled in {latest_state} ({age_minutes}m elapsed, exceeding {stalled_threshold_minutes}m SLA)."

      rollback_candidate = None
      if is_degraded:
          for candidate in prod_deployments[1:]:
              cand_state = str(candidate.get("state") or candidate.get("readyState") or "").upper()
              if cand_state == "READY":
                  rollback_candidate = candidate
                  break

      candidate_id = ""
      candidate_url = ""
      candidate_commit = ""
      candidate_author = ""
      rollback_available = False

      if rollback_candidate:
          rollback_available = True
          candidate_id = rollback_candidate.get("uid") or rollback_candidate.get("id") or "unknown"
          candidate_url = rollback_candidate.get("url") or ""
          if candidate_url and not candidate_url.startswith("http"):
              candidate_url = f"https://{candidate_url}"
          cand_meta = rollback_candidate.get("meta") or {}
          candidate_commit = (cand_meta.get("githubCommitSha") or cand_meta.get("commitSha") or "")[:8]
          candidate_author = cand_meta.get("githubCommitAuthorName") or (rollback_candidate.get("creator") or {}).get("username") or "unknown"

      should_trigger = is_degraded and rollback_available and auto_rollback

      if is_degraded:
          summary = (
              f"🚨 **Production Outage on `{project_id}`**\n"
              f"- **Failed Deployment:** `{latest_id}` (State: `{latest_state}`, {age_minutes}m ago)\n"
              f"- **Broken Commit:** `{latest_commit}` on `{latest_branch}` by *{latest_author}*\n"
              f"- **Failure Reason:** {failure_reason}\n"
          )
          if rollback_available:
              summary += (
                  f"- **Proposed Rollback Target:** `{candidate_id}` (Commit: `{candidate_commit}` by *{candidate_author}*)\n"
                  f"- **Action:** Automated rollback promotion {'armed behind approval gate' if should_trigger else 'disabled'}."
              )
          else:
              summary += "- ⚠️ **No previous healthy READY production deployment found in history to roll back to.**"
      else:
          summary = (
              f"✅ **Production `{project_id}` is Healthy**\n"
              f"- **Active Deployment:** `{latest_id}` (State: `{latest_state}`)\n"
              f"- **Commit:** `{latest_commit}` on `{latest_branch}` by *{latest_author}*\n"
              f"- **URL:** {latest_url}"
          )

      print(summary)

      if Kestra:
          Kestra.outputs({
              "is_production_degraded": is_degraded,
              "should_trigger_rollback": should_trigger,
              "rollback_available": rollback_available,
              "latest_deployment_id": latest_id,
              "latest_state": latest_state,
              "latest_commit": latest_commit,
              "latest_author": latest_author,
              "latest_url": latest_url,
              "rollback_candidate_id": candidate_id,
              "rollback_candidate_url": candidate_url,
              "rollback_candidate_commit": candidate_commit,
              "rollback_candidate_author": candidate_author,
              "failure_reason": failure_reason,
              "summary_markdown": summary
          })

  - id: tag_execution_status
    type: io.kestra.plugin.core.execution.Labels
    description: Tags the execution with project name, health state, and rollback candidate ID for dashboard filtering.
    labels:
      project: "{{ inputs.project_id }}"
      status: "{{ outputs.audit_production_deployments.vars.is_production_degraded ? 'production_degraded' : 'healthy' }}"
      rollback_candidate: "{{ outputs.audit_production_deployments.vars.rollback_candidate_id != '' ? outputs.audit_production_deployments.vars.rollback_candidate_id : 'none' }}"

  - id: evaluate_production_health
    type: io.kestra.plugin.core.flow.If
    description: Evaluates whether production is degraded and initiates notification and rollback remediation workflows.
    condition: "{{ outputs.audit_production_deployments.vars.is_production_degraded }}"
    then:
      - id: alert_production_degraded_slack
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Alerts engineering team on Slack regarding the production deployment failure and candidate rollback plan.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "🚨 *CRITICAL: Vercel Production Outage Detected*\n*Project:* `{{ inputs.project_id }}`\n*Failed Deployment:* `{{ outputs.audit_production_deployments.vars.latest_deployment_id }}` (State: `{{ outputs.audit_production_deployments.vars.latest_state }}`)\n*Broken Commit:* `{{ outputs.audit_production_deployments.vars.latest_commit }}` by *{{ outputs.audit_production_deployments.vars.latest_author }}*\n*Rollback Target:* `{{ outputs.audit_production_deployments.vars.rollback_candidate_id }}` (Commit: `{{ outputs.audit_production_deployments.vars.rollback_candidate_commit }}`)\n\n{{ outputs.audit_production_deployments.vars.should_trigger_rollback ? (inputs.require_approval ? '⏸️ *Execution paused in Kestra UI for operator approval.* Review proposed rollback and click Resume.' : '⚡ *Executing automated rollback promotion...*') : '⚠️ *Rollback not eligible (disabled or no healthy candidate found).* Manual investigation required.' }}"
          }

      - id: check_rollback_eligibility
        type: io.kestra.plugin.core.flow.If
        description: Checks if a valid healthy candidate exists and automated rollback is enabled.
        condition: "{{ outputs.audit_production_deployments.vars.should_trigger_rollback }}"
        then:
          - id: gate_operator_approval
            type: io.kestra.plugin.core.flow.If
            description: Pauses execution for interactive human sign-off when approval is required.
            condition: "{{ inputs.require_approval }}"
            then:
              - id: pause_for_rollback_approval
                type: io.kestra.plugin.core.flow.Pause
                description: >-
                  Execution paused for SRE / DevOps operator review.
                  Approving will revert live production traffic on Vercel to deployment
                  {{ outputs.audit_production_deployments.vars.rollback_candidate_id }} (commit {{ outputs.audit_production_deployments.vars.rollback_candidate_commit }}).
                onResume:
                  - id: approved
                    type: BOOL
                    defaults: false
                    description: Set to true to authorize the production rollback on Vercel.

              - id: assert_approval_granted
                type: io.kestra.plugin.core.flow.If
                description: Verifies whether operator granted approval before proceeding.
                condition: "{{ outputs.pause_for_rollback_approval.onResume.approved ?? false }}"
                else:
                  - id: log_rollback_declined
                    type: io.kestra.plugin.core.log.Log
                    description: Logs that rollback promotion was rejected or resumed without explicit approval.
                    message: "⚠️ Operator resumed execution without granting rollback approval. Production remains unchanged."

                  - id: notify_slack_rollback_cancelled
                    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
                    description: Informs Slack channel that rollback promotion was aborted by operator.
                    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
                    payload: |
                      {
                        "text": "⚠️ *Vercel Rollback Cancelled*\nOperator resumed execution without approval for project `{{ inputs.project_id }}`. Rollback promotion was aborted."
                      }

          - id: trigger_vercel_rollback
            type: io.kestra.plugin.core.http.Request
            description: Calls Vercel Rollback REST API to instantly revert production traffic to the designated healthy deployment.
            uri: "https://api.vercel.com/v1/projects/{{ inputs.project_id }}/rollback/{{ outputs.audit_production_deployments.vars.rollback_candidate_id }}{{ inputs.team_id != '' ? '?teamId=' ~ inputs.team_id : '' }}"
            method: POST
            headers:
              Authorization: "Bearer {{ inputs.vercel_api_token != '' ? inputs.vercel_api_token : secret('VERCEL_API_TOKEN') }}"
              Content-Type: "application/json"
              User-Agent: "kestra-vercel-rollback-guard/1.0"
            body: |
              {
                "description": "{{ inputs.rollback_reason }}"
              }

          - id: verify_rollback_status
            type: io.kestra.plugin.core.http.Request
            description: Queries deployment metadata from Vercel API to confirm the target deployment is ready and verified.
            uri: "https://api.vercel.com/v13/deployments/{{ outputs.audit_production_deployments.vars.rollback_candidate_id }}{{ inputs.team_id != '' ? '?teamId=' ~ inputs.team_id : '' }}"
            method: GET
            headers:
              Authorization: "Bearer {{ inputs.vercel_api_token != '' ? inputs.vercel_api_token : secret('VERCEL_API_TOKEN') }}"
              Content-Type: "application/json"

          - id: notify_slack_rollback_success
            type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
            description: Broadcasts incident resolution to Slack with rollback confirmation and live URL.
            url: "{{ secret('SLACK_WEBHOOK_URL') }}"
            payload: |
              {
                "text": "✅ *Vercel Production Rollback Complete*\n*Project:* `{{ inputs.project_id }}`\n*Promoted Stable Deployment:* `{{ outputs.audit_production_deployments.vars.rollback_candidate_id }}`\n*Restored Commit:* `{{ outputs.audit_production_deployments.vars.rollback_candidate_commit }}` by *{{ outputs.audit_production_deployments.vars.rollback_candidate_author }}*\n*Live URL:* <{{ outputs.audit_production_deployments.vars.rollback_candidate_url }}|Open Production Application>\n*Status:* Traffic redirected to healthy revision; production SLA restored."
              }

    else:
      - id: log_production_healthy
        type: io.kestra.plugin.core.log.Log
        description: Confirms that active production deployment is healthy and meets SLA.
        message: >-
          ✅ Vercel Production Guard: Current production deployment {{ outputs.audit_production_deployments.vars.latest_deployment_id }} is healthy (State: {{ outputs.audit_production_deployments.vars.latest_state }}).
          Project {{ inputs.project_id }} meets all operational uptime requirements.

errors:
  - id: alert_on_flow_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alerts on-call engineering if the rollback guard encounters an unhandled API or network failure.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "❌ *Vercel Rollback Guard Execution Failed*\nFlow `{{ flow.id }}` in namespace `{{ flow.namespace }}` failed (execution `{{ execution.id }}`). Check Kestra execution logs for error details."
      }

extend:
  title: Vercel Production Deployment Failure and Automated Rollback Guard
  metaTitle: Vercel Production Deployment Failure and Rollback Guard | Kestra
  shortDescription: Detect broken Vercel production builds, pause for human approval, and automatically execute an API rollback to the last healthy deployment.
  metaDescription: Audit Vercel production deployments, pause for operator approval on failures, and trigger automated API rollbacks to the last stable build.
  description: |
    Production web applications hosted on Vercel rely on automated continuous deployment workflows to ship code changes to users. However, undetected runtime dependency faults, database migration mismatches, or build errors during production promotions can leave the primary production domain degraded or completely broken. While modern teams use automated monitoring, traditional alerting leaves engineers scrambling to manually log in to the Vercel dashboard, search for the last working release in the deployment history, and execute a manual rollback—a process that incurs costly downtime and elevated mean-time-to-recovery (MTTR).

    This blueprint implements a production-grade, self-healing deployment guard and disaster recovery orchestrator for Vercel. It audits active production deployments, detects hard build failures (`ERROR`) or wedged builds exceeding SLA thresholds, automatically isolates the last verified healthy production build from deployment history, alerts Slack, holds execution behind an interactive Kestra human-in-the-loop approval gate (`io.kestra.plugin.core.flow.Pause`), and dispatches an instant, zero-downtime traffic rollback using Vercel's REST API (`POST /v1/projects/{projectId}/rollback/{deploymentId}`).

    ## How it works

    1. `scheduled_production_health_check` (`io.kestra.plugin.core.trigger.Schedule`) triggers recurring hourly health surveillance (shipped disabled by default for scheduled or event-driven execution).
    2. `audit_production_deployments` (`io.kestra.plugin.scripts.python.Script`) queries Vercel's REST API (`GET https://api.vercel.com/v6/deployments?app={project_id}&limit=30`) using Python's standard library `urllib`. It filters production-targeted deployments, evaluates whether the active build failed (`state == 'ERROR'`) or stalled past `stalled_threshold_minutes`, isolates the previous stable deployment with `state == 'READY'`, and extracts commit and author telemetry.
    3. `tag_execution_status` (`io.kestra.plugin.core.execution.Labels`) attaches `project`, `status`, and `rollback_candidate` labels to the execution for operational dashboard filtering.
    4. `evaluate_production_health` (`io.kestra.plugin.core.flow.If`) evaluates whether production is degraded:
       - If degraded, `alert_production_degraded_slack` (`io.kestra.plugin.slack.notifications.SlackIncomingWebhook`) broadcasts an emergency alert to Slack detailing the outage and proposed rollback revision.
       - `check_rollback_eligibility` (`io.kestra.plugin.core.flow.If`) verifies that a valid candidate exists and rollback is enabled.
       - If `require_approval` is enabled, `pause_for_rollback_approval` (`io.kestra.plugin.core.flow.Pause`) holds execution for SRE review in the Kestra UI. Resuming with `approved: true` authorizes traffic redirection.
       - `trigger_vercel_rollback` (`io.kestra.plugin.core.http.Request`) dispatches `POST https://api.vercel.com/v1/projects/{projectId}/rollback/{deploymentId}` to immediately revert production domain routing to the healthy deployment.
       - `verify_rollback_status` (`io.kestra.plugin.core.http.Request`) verifies the target deployment status via `GET /v13/deployments/{id}`.
       - `notify_slack_rollback_success` (`io.kestra.plugin.slack.notifications.SlackIncomingWebhook`) confirms traffic recovery with live deployment links.
       - If production is healthy, `log_production_healthy` logs clean confirmation.
    5. The global `errors` block alerts on-call responders if network or API authentication failures occur during execution.

    ## What you get

    - **Automated Disaster Recovery**: Rapidly detects broken production releases and identifies the exact last working deployment without manual history audits.
    - **Human-in-the-Loop Safeguards**: Interactive approval gate (`io.kestra.plugin.core.flow.Pause`) ensures high-impact production traffic mutations remain under deliberate operator control.
    - **Zero-Downtime Rollback Promotion**: Calls Vercel's project rollback API directly, instantaneously shifting production traffic back to pre-built, verified artifacts.
    - **Multi-Channel Incident Transparency**: Dispatches Slack alerts for outage detection, operator approval requests, and post-rollback recovery confirmation.
    - **Immutable Execution Telemetry**: Captures structured before-and-after deployment metadata, commit hashes, authors, and approval decisions in Kestra's execution history.

    ## Who it's for

    - **Site Reliability Engineers (SREs)**: Automating incident containment and reducing mean-time-to-recovery (MTTR) for customer-facing web applications.
    - **Frontend & Platform Leads**: Protecting production web applications against bad merges, broken SSG builds, or unhandled runtime exceptions.
    - **DevOps Engineers**: Standardizing disaster recovery runbooks into auditable, repeatable declarative workflows.

    ## Why orchestrate this with Kestra

    A simple shell script or webhook notification cannot pause safely for human approval, remember historical deployment candidates across steps, manage encrypted API tokens, and execute multi-stage verification with conditional branching. Kestra combines lightweight containerless scripting (`io.kestra.plugin.core.runner.Process`), declarative REST API calls (`io.kestra.plugin.core.http.Request`), durable interactive pause gates (`io.kestra.plugin.core.flow.Pause`), and team alerting (`io.kestra.plugin.slack.notifications.SlackIncomingWebhook`) into a single observable workflow.

    ## Prerequisites

    - A Vercel account with a project deployed to production.
    - A Vercel Access Token with permission to read deployments and manage project rollbacks.
    - A Slack incoming webhook URL for operational incident broadcasting.

    ### Secrets

    - `VERCEL_API_TOKEN`: Vercel Personal Access Token or Team Token used for deployment inspection and rollback execution.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL to receive outage notifications and rollback status reports.

    ## Quick start

    1. Configure `VERCEL_API_TOKEN` and `SLACK_WEBHOOK_URL` in your Kestra namespace secrets.
    2. Set `project_id` to your target Vercel application name (e.g. `acme-web`).
    3. Run a manual execution with `auto_rollback: false` to test read-only surveillance and candidate detection.
    4. Enable `auto_rollback: true` and `require_approval: true` to arm the self-healing rollback guard.
    5. Enable `scheduled_production_health_check` to activate recurring hourly surveillance.

    ## How to extend

    - **Automated Smoke Testing**: Insert an `io.kestra.plugin.core.http.Request` health probe verifying HTTP 200 and JSON payloads on your production domain after rollback completes.
    - **GitHub Issue Creation**: Add an `io.kestra.plugin.github.issues.Create` task to automatically create an incident issue tracking the broken commit.
    - **Multi-Project Fleet Protection**: Wrap the inspection and rollback tasks in a `ForEach` loop iterating across all critical production projects in your Vercel organization.
    - **PagerDuty Integration**: Add PagerDuty incident triggers to page on-call SREs simultaneously with the Kestra Pause approval request.

    ## Links

    - [Kestra HTTP Request Plugin Documentation](https://kestra.io/plugins/plugin-core/tasks/http/io.kestra.plugin.core.http.request)
    - [Kestra Pause Flow Task Documentation](https://kestra.io/plugins/core/flow/io.kestra.plugin.core.flow.pause)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
    - [Vercel Rollback REST API Reference](https://vercel.com/docs/rest-api/endpoints/projects#rollback-a-project)
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - CI/CD & Deployment
    - Incident Response
    - Approval Gates
  ee: false
  demo: false
