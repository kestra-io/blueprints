id: graphql-federated-subgraph-health-sentinel
namespace: company.governance

inputs:
  - id: subgraph_endpoint_url
    type: STRING
    displayName: Subgraph GraphQL Endpoint URL
    defaults: "https://spacex-production.up.railway.app/"
    description: Microservice subgraph HTTP endpoint URL to probe (e.g. 'https://accounts-subgraph.internal/graphql').

  - id: subgraph_name
    type: STRING
    displayName: Subgraph Name
    defaults: "accounts-service"
    description: Human-readable identifier for the microservice subgraph within the federated architecture.

  - id: fail_on_subgraph_down
    type: BOOL
    displayName: Fail on Subgraph Outage
    defaults: true
    description: Whether to fail execution when subgraph probing fails to trip external monitoring alerts and prevent router deployments.

triggers:
  - id: periodic_subgraph_probe
    type: io.kestra.plugin.core.trigger.Schedule
    description: High-frequency 5-minute health probe validating subgraph SDL availability. Shipped disabled by default.
    cron: "*/5 * * * *"
    disabled: true

tasks:
  - id: probe_subgraph_federation
    type: io.kestra.plugin.graphql.Request
    description: Query the subgraph for federation service SDL schema and root typename with error capture enabled.
    uri: "{{ inputs.subgraph_endpoint_url }}"
    headers:
      Authorization: "Bearer {{ secret('SUBGRAPH_API_KEY') }}"
      Content-Type: "application/json"
      User-Agent: "Kestra-Subgraph-Sentinel/1.0"
    failOnGraphQLErrors: false
    allowFailed: true
    query: |
      query CheckFederationSDL {
        _service {
          sdl
        }
        __typename
      }

  - id: evaluate_subgraph_health
    type: io.kestra.plugin.core.flow.If
    description: Assert that HTTP status is 200 and no uncaught GraphQL errors are returned in the response payload.
    condition: "{{ outputs.probe_subgraph_federation.code == 200 and (outputs.probe_subgraph_federation.error is not defined or outputs.probe_subgraph_federation.error == null) }}"
    then:
      - id: log_subgraph_healthy
        type: io.kestra.plugin.core.log.Log
        description: Log operational health when subgraph successfully responds with valid schema metadata.
        message: "HEALTHY: Federated subgraph '{{ inputs.subgraph_name }}' at {{ inputs.subgraph_endpoint_url }} is operational with valid SDL."
    else:
      - id: alert_subgraph_outage
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatch high-priority Slack incident notification to SRE and API Platform teams detailing subgraph failure.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "🚨 *GRAPHQL FEDERATION OUTAGE: Subgraph Service Degraded* 🚨\n\n*Subgraph:* `{{ inputs.subgraph_name }}`\n*Endpoint:* `{{ inputs.subgraph_endpoint_url }}`\n*HTTP Status:* {{ outputs.probe_subgraph_federation.code }}\n*Error Details:* `{{ outputs.probe_subgraph_federation.error is defined and outputs.probe_subgraph_federation.error != null ? outputs.probe_subgraph_federation.error : 'Service unreachable or schema unresolvable' }}`\n\n*Execution ID:* {{ execution.id }}\n*Impact:* Supergraph gateway router may fail schema composition or return partial entity resolution errors. Immediate investigation required."
          }

      - id: check_fail_policy
        type: io.kestra.plugin.core.flow.If
        description: Halt pipeline when fail_on_subgraph_down is enabled.
        condition: "{{ inputs.fail_on_subgraph_down }}"
        then:
          - id: halt_pipeline_gate
            type: io.kestra.plugin.core.execution.Fail
            description: Fail execution to alert incident management systems and block gateway composition pipelines.

  - id: log_audit_summary
    type: io.kestra.plugin.core.log.Log
    description: Record final audit metrics for subgraph availability.
    message: "Federated subgraph probe finished for '{{ inputs.subgraph_name }}'. HTTP Code: {{ outputs.probe_subgraph_federation.code }}."

errors:
  - id: alert_on_network_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alert SRE if network connection to the subgraph drops completely.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "⚠️ *Subgraph Network Failure*: Execution `{{ execution.id }}` encountered a fatal connection timeout connecting to `{{ inputs.subgraph_endpoint_url }}`."
      }

outputs:
  - id: status
    type: STRING
    value: "{{ outputs.probe_subgraph_federation.code == 200 and (outputs.probe_subgraph_federation.error is not defined or outputs.probe_subgraph_federation.error == null) ? 'HEALTHY' : 'DEGRADED' }}"
  - id: http_status_code
    type: INT
    value: "{{ outputs.probe_subgraph_federation.code }}"
  - id: subgraph_name
    type: STRING
    value: "{{ inputs.subgraph_name }}"

extend:
  title: GraphQL federated subgraph availability and SDL schema sentinel
  metaTitle: GraphQL Federated Subgraph Sentinel | Kestra
  shortDescription: High-frequency availability sentinel that verifies Apollo Federation _service SDL schema endpoints on microservice subgraphs to prevent supergraph outages.
  metaDescription: Probe GraphQL federated subgraphs for _service SDL schema availability every 5 minutes and alert SRE teams in Slack to prevent supergraph composition outages.
  description: |
    Prevent distributed GraphQL supergraph outages and composition failures by continuously monitoring individual federated microservice subgraphs. In modern enterprise federated architectures (Apollo Federation, Hive Gateway, Cosmo Router), a central gateway dynamically delegates client queries to discrete underlying microservices (subgraphs) representing distinct business capabilities. Under the Apollo Federation specification, every subgraph must reliably expose its Schema Definition Language via the `_service { sdl }` field. When a single subgraph encounters an internal error, container crash loop, or invalid schema update, the gateway router can fail composition or drop entity resolution across user sessions. This blueprint executes a 5-minute health probe using `io.kestra.plugin.graphql.Request`, validates SDL response payloads, and trips an automated Slack incident alert and pipeline failure when a subgraph degrades.

    ## How it works
    1. A `Schedule` trigger executes an automated probe every 5 minutes (shipped disabled by default).
    2. Task `probe_subgraph_federation` sends a federation probe query (`query CheckFederationSDL { _service { sdl } __typename }`) to the subgraph HTTP endpoint (`subgraph_endpoint_url`) authenticated via `SUBGRAPH_API_KEY`. It configures `failOnGraphQLErrors: false` and `allowFailed: true` to inspect error bodies safely.
    3. Task `evaluate_subgraph_health` (`io.kestra.plugin.core.flow.If`) evaluates two conditions: HTTP status 200 and the absence of any GraphQL error payloads:
       - If healthy: Task `log_subgraph_healthy` logs operational confirmation.
       - If degraded: Task `alert_subgraph_outage` delivers a high-priority Slack notification detailing the failing subgraph and HTTP status code. If `inputs.fail_on_subgraph_down` is enabled, task `halt_pipeline_gate` terminates the execution with an error.
    4. Task `log_audit_summary` logs the audit metrics.
    5. Top-level `errors` handler catches DNS resolution failures or VPC network drops.

    ## What you get
    - Continuous 5-minute automated health verification of federated GraphQL subgraphs.
    - Early detection of broken `_service` SDL endpoints before router schema composition fails.
    - Targeted Slack notifications pinpointing the exact offending microservice team.
    - A reliable CI/CD gate preventing router deployment when downstream subgraphs are offline.

    ## Who it's for
    - API Platform and Core Infrastructure teams managing federated GraphQL gateways.
    - Microservice backend engineers responsible for domain-specific subgraphs.
    - Site Reliability Engineers (SRE) monitoring distributed service-mesh availability.

    ## Why orchestrate this with Kestra
    Standard generic HTTP pings verify only that a web server is listening on port 80/443; they cannot detect whether a subgraph's GraphQL schema parser or federation metadata resolver is broken. Kestra provides native GraphQL execution via `io.kestra.plugin.graphql.Request`, secure secret management for service-to-service API tokens, declarative flow-control logic, and automated multi-channel incident dispatch in plain YAML.

    ## Prerequisites
    - An accessible GraphQL subgraph endpoint supporting Apollo Federation (`_service { sdl }`).
    - An internal API token or bearer secret if the subgraph requires authentication.
    - A Slack Incoming Webhook URL.

    ### Secrets
    - `SUBGRAPH_API_KEY`: API token passed in the `Authorization: Bearer` header.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL used to receive incident notifications.

    ## Quick start
    1. Store your subgraph API key and Slack webhook in Kestra Secrets (`SUBGRAPH_API_KEY` and `SLACK_WEBHOOK_URL`).
    2. Configure `subgraph_endpoint_url` with your subgraph URL and provide a recognizable `subgraph_name` (e.g. `billing-subgraph`).
    3. Trigger a manual execution from the Kestra UI to verify that the query connects successfully.
    4. Enable the `periodic_subgraph_probe` schedule to establish continuous 5-minute availability monitoring.

    ## How to extend
    - Wrap the probe task in a `ForEach` loop to query a complete array of all company subgraphs in a single execution.
    - Compare the returned SDL schema against a Git-versioned baseline to detect unauthorized schema drift.
    - Integrate with ArgoCD or Kubernetes restart tasks to automatically restart failed subgraph pods.

    ## Links
    - [Apollo Federation Subgraph Specification](https://www.apollographql.com/docs/federation/subgraph-spec/)
    - [Kestra GraphQL Plugin](https://kestra.io/plugins/plugin-graphql)
    - [Kestra Slack Notification Plugin](https://kestra.io/plugins/plugin-slack)
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Monitoring & Alerting
    - Incident Response
  ee: false
  demo: false
