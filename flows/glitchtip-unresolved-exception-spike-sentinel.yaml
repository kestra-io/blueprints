id: glitchtip-unresolved-exception-spike-sentinel
namespace: company.observability

inputs:
  - id: glitchtip_url
    type: STRING
    defaults: "https://glitchtip.internal"
    description: Base URL of the GlitchTip error tracking server.
  - id: organization_slug
    type: STRING
    description: Target GlitchTip organization slug.
  - id: project_slug
    type: STRING
    description: Target GlitchTip project slug to audit.
  - id: max_unresolved_issues
    type: INT
    defaults: 25
    description: "Maximum allowable unresolved exception issues before alerting (default 25)."

tasks:
  - id: inspect_unresolved_issues
    type: io.kestra.plugin.scripts.shell.Commands
    commands:
      - |
        # Query GlitchTip API for unresolved issues
        curl -s -H "Authorization: Bearer {{ secret('GLITCHTIP_AUTH_TOKEN') }}" \
          "{{ inputs.glitchtip_url }}/api/0/projects/{{ inputs.organization_slug }}/{{ inputs.project_slug }}/issues/?query=is:unresolved" > /tmp/glitchtip_issues.json

        python3 -c "
        import json
        try:
            with open('/tmp/glitchtip_issues.json') as f:
                issues = json.load(f)
            count = len(issues) if isinstance(issues, list) else 0
            titles = ', '.join([i.get('title', 'Unknown') for i in (issues[:3] if isinstance(issues, list) else [])])
            is_breach = 1 if count > {{ inputs.max_unresolved_issues }} else 0
            print(f'{is_breach}|{count}|{titles}')
        except Exception:
            print('0|0|')
        " > /tmp/glitchtip_summary.txt

        IS_BREACH=$(cut -d '|' -f 1 /tmp/glitchtip_summary.txt)
        ISSUE_COUNT=$(cut -d '|' -f 2 /tmp/glitchtip_summary.txt)
        SAMPLE_TITLES=$(cut -d '|' -f 3 /tmp/glitchtip_summary.txt)
        
        echo "::set-output name=is_breach::${IS_BREACH:-0}::"
        echo "::set-output name=issue_count::$ISSUE_COUNT::"
        echo "::set-output name=sample_titles::$SAMPLE_TITLES::"

  - id: evaluate_error_spike
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.inspect_unresolved_issues.vars.is_breach | int == 1 }}"
    then:
      - id: notify_engineering_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#error-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 GlitchTip Unresolved Exception Surge Alert",
                "text": "Project {{ inputs.project_slug }} in {{ inputs.organization_slug }} has {{ outputs.inspect_unresolved_issues.vars.issue_count }} unresolved issues (threshold {{ inputs.max_unresolved_issues }}). Sample Errors: {{ outputs.inspect_unresolved_issues.vars.sample_titles }}.",
                "footer": "Kestra Error Tracking Sentinel • GlitchTip"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#error-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ GlitchTip Sentinel Failure",
            "text": "Failed to connect to GlitchTip endpoint at {{ inputs.glitchtip_url }}.",
            "footer": "Kestra Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/20 * * * *"
    disabled: true

extend:
  metaDescription: "Audits GlitchTip error tracking endpoints to detect application crash surges and unresolved issues."
  metaTitle: GlitchTip Unresolved Exception Spike Sentinel with Kestra
  ee: false
  demo: false
  title: GlitchTip Unresolved Exception Spike Sentinel
  shortDescription: Audits GlitchTip error tracking endpoints to detect application crash surges and unresolved issues.
  description: |
    ## How it works
    This workflow connects to the GlitchTip REST API (`/api/0/projects/{org}/{project}/issues/?query=is:unresolved`) to audit open, unresolved application exceptions. In high-traffic microservice environments, broken deployments or upstream third-party API outages produce sudden surges in unhandled runtime exceptions. This sentinel tracks the volume of unresolved issues, isolates recent error titles, and dispatches a prioritized Slack incident notification if active defects exceed acceptable thresholds.

    ## What you get
    - Continuous tracking of application stability and runtime exceptions.
    - Instant visibility into newly introduced production bugs.
    - Contextual Slack alerts with top error signatures and volume counts.

    ## Who it's for
    - Application Developers maintaining production web apps and APIs.
    - Site Reliability Engineers safeguarding customer error budget SLAs.
    - Quality Assurance and Engineering Managers tracking release stability.

    ## Why orchestrate this with Kestra
    - **Automated Triage Orchestration**: Links error detection with automated ticket creation in Jira or Linear.
    - **Decoupled Error Auditing**: Operates independently of application frameworks.
    - **Enterprise Secret Storage**: Safely manages GlitchTip API tokens in Kestra secrets.

    ## Prerequisites
    - Running GlitchTip open-source error tracking instance.
    - API token configured in `GLITCHTIP_AUTH_TOKEN` secret.
    - Slack incoming webhook URL stored in `SLACK_WEBHOOK` secret.

    ## Quick start
    1. Import this blueprint into Kestra.
    2. Add `GLITCHTIP_AUTH_TOKEN` and `SLACK_WEBHOOK` secrets.
    3. Configure `organization_slug` and `project_slug`.
    4. Enable the schedule trigger to activate automatic error monitoring.

    ## How to extend
    - Automatically create a GitHub Issue when new unresolved exception clusters appear.
    - Trigger a canary rollback if error counts surge immediately following a deployment.
    - Filter issues by specific tags such as `environment:production` or `release:v2.1`.

    ## Links
    - [GlitchTip API Reference](https://glitchtip.com/documentation/api)
    - [Kestra Shell Plugin](https://kestra.io/plugins/plugin-scripts-shell)
    - [Kestra Slack Notifications](https://kestra.io/plugins/plugin-slack)
  tags:
    - Infrastructure
    - Business
  subTags:
    - Day 2 Operations
    - HR & Ops Automation
