id: glitchtip-unresolved-exception-spike-sentinel
namespace: company.team
description: Audits GlitchTip error tracking endpoints to detect application crash surges and unresolved issues.

inputs:
  - id: glitchtip_url
    type: STRING
    defaults: "https://glitchtip.internal"
    description: Base URL of the GlitchTip error tracking server.
  - id: organization_slug
    type: STRING
    defaults: "primary-org"
    description: Target GlitchTip organization slug.
  - id: project_slug
    type: STRING
    defaults: "web-backend"
    description: Target GlitchTip project slug to audit.
  - id: max_unresolved_issues
    type: INT
    defaults: 25
    description: "Maximum allowable unresolved exception issues before alerting (default 25)."

tasks:
  - id: inspect_unresolved_issues
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    description: Query GlitchTip API for unresolved issues and detect surges
    env:
      GLITCHTIP_AUTH_TOKEN: "{{ secret('GLITCHTIP_AUTH_TOKEN') }}"
      GLITCHTIP_URL: "{{ inputs.glitchtip_url }}"
      ORG_SLUG: "{{ inputs.organization_slug }}"
      PROJECT_SLUG: "{{ inputs.project_slug }}"
      MAX_ISSUES: "{{ inputs.max_unresolved_issues }}"
    script: |
      import os
      import sys
      import json
      import urllib.request
      import urllib.error
      from kestra import Kestra

      base_url = os.environ.get("GLITCHTIP_URL", "https://glitchtip.internal").rstrip("/")
      token = os.environ.get("GLITCHTIP_AUTH_TOKEN")
      org = os.environ.get("ORG_SLUG")
      project = os.environ.get("PROJECT_SLUG")
      max_issues = int(os.environ.get("MAX_ISSUES", "25"))

      if not org or not project:
          print("ERROR: organization_slug and project_slug must be provided", file=sys.stderr)
          sys.exit(1)

      url = f"{base_url}/api/0/projects/{org}/{project}/issues/?query=is:unresolved"
      headers = {
          "Accept": "application/json",
          "User-Agent": "Kestra-GlitchTip-Sentinel"
      }
      if token:
          headers["Authorization"] = f"Bearer {token}"

      req = urllib.request.Request(url, headers=headers)
      try:
          with urllib.request.urlopen(req, timeout=30) as resp:
              issues = json.loads(resp.read().decode("utf-8"))
      except urllib.error.HTTPError as e:
          print(f"CRITICAL: HTTP error querying GlitchTip: {e.code} {e.reason}", file=sys.stderr)
          sys.exit(1)
      except Exception as e:
          print(f"CRITICAL: Failed to connect to GlitchTip at {url}: {e}", file=sys.stderr)
          sys.exit(1)

      if not isinstance(issues, list):
          print("CRITICAL: Unexpected response format from GlitchTip API", file=sys.stderr)
          sys.exit(1)

      issue_count = len(issues)
      sample_titles = ", ".join([str(i.get("title", "Unknown")) for i in issues[:3]])
      is_breach = issue_count > max_issues

      Kestra.outputs({
          "is_breach": is_breach,
          "issue_count": issue_count,
          "sample_titles": sample_titles
      })

  - id: evaluate_error_spike
    type: io.kestra.plugin.core.flow.If
    description: Send Slack alert if unresolved issues breach threshold
    condition: "{{ outputs.inspect_unresolved_issues.vars.is_breach == true }}"
    then:
      - id: notify_engineering_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#error-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 GlitchTip Unresolved Exception Surge Alert",
                "text": "Project `{{ inputs.project_slug }}` in `{{ inputs.organization_slug }}` has *{{ outputs.inspect_unresolved_issues.vars.issue_count }}* unresolved issues (threshold {{ inputs.max_unresolved_issues }}). Sample Errors: {{ outputs.inspect_unresolved_issues.vars.sample_titles }}.",
                "footer": "Kestra Error Tracking Sentinel • GlitchTip"
              }
            ]
          }

outputs:
  - id: is_breach
    type: BOOLEAN
    value: "{{ outputs.inspect_unresolved_issues.vars.is_breach }}"
  - id: issue_count
    type: INT
    value: "{{ outputs.inspect_unresolved_issues.vars.issue_count }}"
  - id: sample_titles
    type: STRING
    value: "{{ outputs.inspect_unresolved_issues.vars.sample_titles }}"

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "#error-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ GlitchTip Sentinel Failure",
            "text": "Failed to connect to GlitchTip endpoint at {{ inputs.glitchtip_url }} on execution `{{ execution.id }}`.",
            "footer": "Kestra Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/20 * * * *"
    disabled: true

extend:
  metaDescription: Audits GlitchTip error tracking endpoints to detect application crash surges and unresolved issues.
  metaTitle: GlitchTip Unresolved Exception Spike Sentinel with Kestra
  ee: false
  demo: false
  title: GlitchTip Unresolved Exception Spike Sentinel
  shortDescription: Audits GlitchTip error tracking endpoints to detect application crash surges and unresolved issues.
  description: |
    ## How it works
    This workflow connects to the GlitchTip REST API to query all open, unresolved issues for a specified project. If the count of unresolved issues exceeds the configured threshold, a critical incident alert is sent to Slack.

    ## What you get
    - Real-time exception spike detection across core applications.
    - Automated threshold surveillance without external pollers.
    - Immediate incident response notification.

    ## Who it's for
    - SRE and DevOps teams tracking application stability.
    - Engineering Leads maintaining software quality SLA.

    ## Prerequisites
    - GlitchTip API endpoint and authentication token.
    - Secret `GLITCHTIP_AUTH_TOKEN` and `SLACK_WEBHOOK_URL` configured in Kestra.
  tags:
    - Infrastructure
  subTags:
    - Monitoring & Alerting
