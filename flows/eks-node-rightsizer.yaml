id: eks-node-rightsizer
namespace: company.finops

description: |
  Analyzes EKS managed node groups against real CPU and memory utilization and
  recommends smaller instance types when nodes are consistently underused.
  Rightsizing node groups is usually the single biggest EKS cost lever.

inputs:
  - id: aws_regions
    type: ARRAY
    itemType: STRING
    defaults: ["us-east-1"]
    description: AWS regions to audit for EKS node group rightsizing.
  - id: cpu_threshold_pct
    type: STRING
    defaults: "30"
    description: Node groups under this average CPU % (7d) are flagged for downsizing.
  - id: mem_threshold_pct
    type: STRING
    defaults: "40"
    description: Node groups under this average memory % (7d) are flagged for downsizing.

tasks:
  - id: check_nodegroups
    type: io.kestra.plugin.core.flow.ForEach
    description: Audit EKS node groups region by region.
    values: "{{ inputs.aws_regions }}"
    tasks:
      - id: audit_region
        type: io.kestra.plugin.aws.cli.AwsCLI
        description: List clusters and node groups, compare instance types against 7-day utilization.
        commands:
          - |
            REGION="{{ taskrun.value }}"
            CPU_T="{{ inputs.cpu_threshold_pct }}"
            MEM_T="{{ inputs.mem_threshold_pct }}"
            END=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            START=$(date -u -d "7 days ago" +%Y-%m-%dT%H:%M:%SZ)
            echo "Checking EKS node groups in $REGION"
            RECS=""
            for CLUSTER in $(aws eks list-clusters --region "$REGION" --query 'clusters' --output text); do
              for NG in $(aws eks list-nodegroups --region "$REGION" --cluster-name "$CLUSTER" --query 'nodegroups' --output text); do
                TYPES=$(aws eks describe-nodegroup --region "$REGION" --cluster-name "$CLUSTER" \
                  --nodegroup-name "$NG" --query 'nodegroup.instanceTypes' --output text)
                DESIRED=$(aws eks describe-nodegroup --region "$REGION" --cluster-name "$CLUSTER" \
                  --nodegroup-name "$NG" --query 'nodegroup.scalingConfig.desiredSize' --output text)
                CPU=$(aws cloudwatch get-metric-statistics --region "$REGION" \
                  --namespace ContainerInsights --metric-name node_cpu_utilization \
                  --dimensions Name=ClusterName,Value="$CLUSTER" \
                  --start-time "$START" --end-time "$END" --period 604800 --statistics Average \
                  --query 'Datapoints[0].Average' --output text 2>/dev/null)
                MEM=$(aws cloudwatch get-metric-statistics --region "$REGION" \
                  --namespace ContainerInsights --metric-name node_memory_utilization \
                  --dimensions Name=ClusterName,Value="$CLUSTER" \
                  --start-time "$START" --end-time "$END" --period 604800 --statistics Average \
                  --query 'Datapoints[0].Average' --output text 2>/dev/null)
                case "$CPU" in ''|'None') CPU=-1;; esac
                case "$MEM" in ''|'None') MEM=-1;; esac
                LOW=$(python3 -c "
            cpu=float('$CPU'); mem=float('$MEM')
            print('y' if cpu >= 0 and cpu < float('$CPU_T') and mem < float('$MEM_T') else 'n')")
                if [ "$LOW" = "y" ]; then
                  RECS="${RECS}${CLUSTER}/${NG}: ${TYPES} x${DESIRED} at cpu=${CPU}% mem=${MEM}% -> consider one size down, "
                fi
              done
            done
            if [ -n "$RECS" ]; then HAS_RECS=true; else HAS_RECS=false; fi
            echo "HAS_RECS=$HAS_RECS"
            echo "RECOMMENDATIONS=$RECS"
            echo "REGION_DONE=$REGION"
        env:
          AWS_ACCESS_KEY_ID: "{{ secret('AWS_ACCESS_KEY_ID') }}"
          AWS_SECRET_ACCESS_KEY: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
          AWS_DEFAULT_REGION: "{{ taskrun.value }}"
      - id: notify_region
        type: io.kestra.plugin.core.flow.If
        description: Report downsizing candidates, stay quiet when nodes are well used.
        condition: "{{ outputs.audit_region.vars.HAS_RECS == 'true' }}"
        then:
          - id: slack_recs
            type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
            url: "{{ secret('SLACK_WEBHOOK_URL') }}"
            payload: |
              {
                "text": ":chart_with_downwards_trend: EKS rightsizing `{{ outputs.audit_region.vars.REGION_DONE }}` — node groups running under thresholds (7d avg):\n`{{ outputs.audit_region.vars.RECOMMENDATIONS }}`\nValidate against pod resource requests before downsizing; check for single-AZ or GPU constraints."
              }
        else:
          - id: log_clean
            type: io.kestra.plugin.core.log.Log
            message: "All EKS node groups in {{ outputs.audit_region.vars.REGION_DONE }} are above utilization thresholds."

triggers:
  - id: weekly
    type: io.kestra.plugin.core.trigger.Schedule
    description: Weekly on Sunday at 02:00 UTC. Shipped disabled; enable after your first manual run.
    cron: "0 2 * * 0"
    disabled: true

extend:
  title: EKS Node Rightsizer
  metaTitle: Rightsize EKS Node Groups | Kestra
  shortDescription: Audit EKS managed node groups across regions against 7-day CPU/memory utilization and get Slack recommendations for smaller instance types.
  metaDescription: Oversized EKS nodes are the biggest Kubernetes cost leak. This flow flags underused node groups weekly with evidence.
  description: |
    Most EKS clusters are sized for a launch day that never comes back. Node groups run at 15% CPU for months because nobody re-checks the instance type choice. This blueprint compares what you provisioned against what you actually use and recommends where one size down is safe.

    ## How it works

    1. A Schedule trigger fires weekly on Sunday at 02:00 UTC (shipped disabled).
    2. A ForEach loop audits each region in `aws_regions`.
    3. Per region, the flow lists clusters and managed node groups with their instance types and desired sizes.
    4. 7-day average `node_cpu_utilization` and `node_memory_utilization` come from Container Insights; node groups under both thresholds are flagged.
    5. An `If` task posts a Slack report with the downsizing candidates and their numbers.

    ## What you get

    - A weekly shortlist of node groups to downsize, with utilization evidence attached.
    - Instance type and desired size per candidate, so the change is a one-line nodegroup update.
    - Silence when the fleet is well utilized.

    ## Who it's for

    Platform teams running EKS who suspect their nodes are oversized but never had the data in one place.

    ## Why orchestrate this with Kestra

    Utilization drifts as workloads change; a one-time analysis rots. As a scheduled flow the recommendation refreshes weekly, thresholds are inputs, and the report is a standing agenda item instead of a forgotten spreadsheet.

    ## Prerequisites

    - AWS credentials with `eks:ListClusters`, `eks:ListNodegroups`, `eks:DescribeNodegroup`, and `cloudwatch:GetMetricStatistics`.
    - Container Insights enabled on the clusters (metrics come from the ContainerInsights namespace).

    ### Secrets

    - `AWS_ACCESS_KEY_ID`: AWS access key for the EKS and CloudWatch API calls.
    - `AWS_SECRET_ACCESS_KEY`: AWS secret key for the EKS and CloudWatch API calls.
    - `SLACK_WEBHOOK_URL`: Incoming webhook URL for the rightsizing report.

    ## Quick start

    1. Add the three secrets above to your Kestra namespace.
    2. Set `aws_regions` to your EKS regions.
    3. Run manually once and sanity-check recommendations against pod requests/limits.
    4. Enable the weekly schedule trigger.

    ## How to extend

    - Pull per-nodegroup metrics instead of cluster-level averages for finer targeting.
    - Estimate dollar savings using the instance type hourly price.
    - Exclude node groups tagged `Keep=true` (GPU, single-AZ, or stateful workloads).

    ## Links

    - [Kestra AWS plugins](https://kestra.io/plugins)
    - [Kestra Slack plugins](https://kestra.io/plugins)
    - [EKS managed node groups](https://docs.aws.amazon.com/eks/latest/userguide/managed-node-groups.html)
    - [Container Insights EKS metrics](https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/ContainerInsights-EKS-metrics.html)
  tags:
    - Infrastructure
  subTags:
    - FinOps & Cost Management
    - Monitoring & Alerting
  ee: false
  demo: false
