id: ai-incident-response-automation
namespace: company.devops

description: |
  Automates incident triage when a GitHub issue is opened.
  Uses OpenAI to classify severity, notifies Slack, and optionally 
  creates Jira tickets for critical incidents.

extend:
  title: AI-Powered Incident Response Automation
  description: |
    ## Prerequisites
    - Kestra secrets: `OPENAI_API_KEY`, `SLACK_WEBHOOK_URL`, `JIRA_API_TOKEN`
    - GitHub webhook configured to trigger on `issues.opened`
    
    ## What this flow does
    1. Receives a GitHub webhook when an issue is opened
    2. Runs AI triage and Slack notification in **parallel**
    3. Creates a Jira ticket if classified as "critical"
    4. Logs all events to BigQuery for analytics
    
    ## Outputs
    - `{{ outputs.triage.severity }}` - AI-classified severity level
    - `{{ outputs.jira_ticket.url }}` - Jira ticket URL (if created)
  metaDescription: "Automate incident triage using OpenAI, Slack, and Jira with parallel processing in Kestra."
  tags:
    - AI
    - incident-response
    - OpenAI
    - Slack
    - Jira
    - automation
  ee: false

inputs:
  - id: issue_title
    type: STRING
    description: GitHub issue title
  - id: issue_body
    type: STRING
    description: GitHub issue body content

triggers:
  - id: github_webhook
    type: io.kestra.plugin.github.triggers.GithubTrigger
    conditions:
      - type: io.kestra.plugin.github.conditions.IssueOpened

tasks:
  - id: parallel_initial_response
    type: io.kestra.core.tasks.flows.Parallel
    tasks:
      - id: ai_triage
        type: io.kestra.plugin.openai.ChatCompletion
        apiKey: "{{ secret('OPENAI_API_KEY') }}"
        model: gpt-4o-mini
        messages:
          - role: user
            content: |
              Classify this GitHub issue severity as 'critical', 'high', 'medium', or 'low'.
              Title: {{ inputs.issue_title }}
              Body: {{ inputs.issue_body }}
              Respond with ONLY the severity level.
      
      - id: notify_slack
        type: io.kestra.plugin.slack.IncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {"text": "🔔 New issue: {{ inputs.issue_title }}\nAI triage in progress..."}

  - id: check_severity
    type: io.kestra.core.tasks.flows.If
    condition: "{{ outputs.ai_triage.choices[0].message.content == 'critical' }}"
    then:
      - id: create_jira_ticket
        type: io.kestra.plugin.jira.issues.Create
        domain: "{{ secret('JIRA_DOMAIN') }}"
        username: "{{ secret('JIRA_USERNAME') }}"
        password: "{{ secret('JIRA_API_TOKEN') }}"
        projectKey: OPS
        summary: "[CRITICAL] {{ inputs.issue_title }}"
        issueType: Bug
      
      - id: alert_oncall
        type: io.kestra.plugin.slack.IncomingWebhook
        url: "{{ secret('SLACK_ONCALL_WEBHOOK') }}"
        payload: |
          {"text": "🚨 CRITICAL issue detected: {{ inputs.issue_title }}"}

errors:
  - id: handle_error
    type: io.kestra.plugin.slack.IncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {"text": "❌ Incident automation failed for: {{ inputs.issue_title }}\nError: {{ errorLogs() }}"}
