id: ai-incident-response-automation
namespace: company.devops

description: |
  Automates incident triage when a GitHub issue is opened.
  Uses OpenAI to classify severity, notifies Slack, and optionally 
  creates Jira tickets for critical incidents.

inputs:
  - id: issue_title
    type: STRING
    description: GitHub issue title
  - id: issue_body
    type: STRING
    description: GitHub issue body content

triggers:
  - id: github_webhook
    type: io.kestra.plugin.core.trigger.Webhook
    key: "{{ secret('GITHUB_WEBHOOK_KEY') }}"

tasks:
  - id: parallel_initial_response
    type: io.kestra.plugin.core.flow.Parallel
    tasks:
      - id: ai_triage
        type: io.kestra.plugin.openai.ChatCompletion
        apiKey: "{{ secret('OPENAI_API_KEY') }}"
        model: gpt-4o-mini
        messages:
          - role: user
            content: |
              Classify this GitHub issue severity as 'critical', 'high', 'medium', or 'low'.
              Title: {{ trigger.body.issue.title ?? inputs.issue_title }}
              Body: {{ trigger.body.issue.body ?? inputs.issue_body }}
              Respond with ONLY the severity level.
      
      - id: notify_slack
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {"text": "[New Issue] {{ trigger.body.issue.title ?? inputs.issue_title }}\nAI triage in progress..."}

  - id: check_severity
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.ai_triage.choices[0].message.content == 'critical' }}"
    then:
      - id: create_jira_ticket
        type: io.kestra.plugin.jira.issues.Create
        baseUrl: "https://{{ secret('JIRA_DOMAIN') }}.atlassian.net"
        username: "{{ secret('JIRA_USERNAME') }}"
        password: "{{ secret('JIRA_API_TOKEN') }}"
        projectKey: OPS
        summary: "[CRITICAL] {{ trigger.body.issue.title ?? inputs.issue_title }}"
        labels:
          - incident
          - critical
      
      - id: alert_oncall
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_ONCALL_WEBHOOK') }}"
        payload: |
          {"text": "[CRITICAL] Issue detected: {{ trigger.body.issue.title ?? inputs.issue_title }}"}

errors:
  - id: handle_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {"text": "[ERROR] Incident automation failed for: {{ trigger.body.issue.title ?? inputs.issue_title }}\nError: {{ errorLogs() }}"}

extend:
  title: AI-Powered Incident Response Automation
  shortDescription: Automates incident triage when a GitHub issue is opened using OpenAI, Slack, and Jira.
  metaTitle: AI-Powered Incident Response Automation
  metaDescription: Automate incident triage using OpenAI, Slack, and Jira with parallel processing in Kestra.
  description: |
    ## How it works
    This blueprint automates incident triage by listening for new GitHub issues via a webhook. It then runs AI triage (using OpenAI's `gpt-4o-mini`) and sends an initial Slack notification in parallel. If the AI classifies the issue as 'critical', it automatically creates a Jira bug ticket and alerts the on-call team in Slack.
    
    ## What you get
    - An automated, AI-driven assessment of incoming GitHub issues.
    - Instant Slack notifications.
    - Automatic Jira ticket creation for critical issues.
    
    ## Who it's for
    - DevOps and SRE teams looking to automate their incident response and alert routing.
    
    ## Why orchestrate this with Kestra
    Kestra's parallel processing and seamless integration with APIs like OpenAI, Slack, and Jira make it perfect for rapid incident response workflows.
    
    ## Prerequisites
    - An OpenAI API key
    - A Slack Incoming Webhook URL
    - Jira credentials
    - A GitHub repository configured to send webhooks to Kestra
    
    ### Secrets
    - `OPENAI_API_KEY`: Your OpenAI API key
    - `SLACK_WEBHOOK_URL`: Your main Slack webhook
    - `SLACK_ONCALL_WEBHOOK`: Your on-call Slack webhook
    - `JIRA_DOMAIN`: Your Jira Cloud subdomain (the part before `.atlassian.net`)
    - `JIRA_USERNAME`: Your Jira username
    - `JIRA_API_TOKEN`: Your Jira API token
    - `GITHUB_WEBHOOK_KEY`: A secret key configured in your GitHub webhook
    
    ## Quick start
    Deploy the blueprint, configure your secrets, and set up your GitHub webhook to point to the Kestra webhook URL.
    
    ## How to extend
    You can extend this to trigger PagerDuty alerts, or automatically assign developers in Jira based on the AI's assessment of the issue topic.
    
    ## Links
    - [Webhook documentation](https://kestra.io/plugins/core/triggers/io.kestra.plugin.core.trigger.webhook)
    - [OpenAI Plugin documentation](https://kestra.io/plugins/plugin-openai)
    - [Slack Plugin documentation](https://kestra.io/plugins/plugin-slack)
  subTags:
    - Monitoring & Alerting
  tags:
    - Infrastructure
    - Business
    - AI
  ee: false
  demo: false
