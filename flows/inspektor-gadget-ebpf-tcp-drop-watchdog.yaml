id: inspektor-gadget-ebpf-tcp-drop-watchdog
namespace: company.platform

description: |
  Audits Inspektor Gadget eBPF kernel telemetry to detect silent TCP packet drops, socket buffer exhaustion, and node network stalls across Kubernetes clusters.

concurrency:
  limit: 1

inputs:
  - id: gadget_metrics_url
    type: STRING
    displayName: "Inspektor Gadget Metrics Endpoint"
    defaults: "http://gadget-metrics.gadget-system.svc.cluster.local:2224/metrics"
    description: "HTTP URL exposing Prometheus telemetry for Inspektor Gadget eBPF trace collectors."

  - id: max_allowable_tcp_drops
    type: INT
    displayName: "Max Allowable TCP Drops"
    defaults: 25
    description: "Maximum allowable kernel TCP drop events across the audit lookback period before triggering an incident alert."

  - id: max_ebpf_event_loss
    type: INT
    displayName: "Max Allowable eBPF Ring Buffer Event Drops"
    defaults: 10
    description: "Maximum allowable dropped eBPF events from perf/ring buffer saturation before alerting on telemetry degradation."

  - id: lookback_minutes
    type: INT
    displayName: "Lookback Window (Minutes)"
    defaults: 15
    description: "Time window in minutes over which TCP drop velocity and eBPF ring buffer loss are evaluated."

  - id: alert_on_violation
    type: BOOL
    displayName: "Alert On Violation"
    defaults: true
    description: "Toggle whether actionable incident alerts are dispatched to the Platform Engineering Slack channel."

tasks:
  - id: audit_ebpf_tcp_drops
    type: io.kestra.plugin.scripts.python.Script
    description: "Connects to Inspektor Gadget Prometheus endpoint, parses eBPF kernel metrics for TCP drops and ring buffer losses, and evaluates compliance against operational thresholds."
    warningOnStdErr: false
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    env:
      GADGET_METRICS_URL: "{{ inputs.gadget_metrics_url }}"
      MAX_ALLOWABLE_TCP_DROPS: "{{ inputs.max_allowable_tcp_drops }}"
      MAX_EBPF_EVENT_LOSS: "{{ inputs.max_ebpf_event_loss }}"
      LOOKBACK_MINUTES: "{{ inputs.lookback_minutes }}"
    script: |
      import os
      import sys
      import urllib.request
      import urllib.error
      import json

      metrics_url = os.environ.get("GADGET_METRICS_URL")
      max_tcp_drops = int(os.environ.get("MAX_ALLOWABLE_TCP_DROPS", "25"))
      max_ebpf_loss = int(os.environ.get("MAX_EBPF_EVENT_LOSS", "10"))
      lookback = int(os.environ.get("LOOKBACK_MINUTES", "15"))

      print(f"Connecting to Inspektor Gadget telemetry endpoint: {metrics_url}")

      try:
          req = urllib.request.Request(
              metrics_url,
              headers={"User-Agent": "Kestra-Inspektor-Gadget-Watchdog/1.0"}
          )
          with urllib.request.urlopen(req, timeout=15) as resp:
              raw_content = resp.read().decode("utf-8")
      except urllib.error.URLError as err:
          print(f"CRITICAL: Failed to query Inspektor Gadget metrics at {metrics_url}: {err.reason}", file=sys.stderr)
          sys.exit(1)
      except Exception as err:
          print(f"CRITICAL: Unexpected error querying Inspektor Gadget metrics: {err}", file=sys.stderr)
          sys.exit(1)

      tcp_drop_total = 0
      ebpf_dropped_events = 0
      active_tracers = 0
      tcp_connect_latency_us = 0.0
      parsed_metrics = {}

      for line in raw_content.splitlines():
          line = line.strip()
          if not line or line.startswith("#"):
              continue

          parts = line.split()
          if len(parts) != 2:
              continue

          metric_name, metric_value = parts[0], parts[1]
          try:
              val = float(metric_value)
          except ValueError:
              continue

          if "gadget_tcp_drop_total" in metric_name or "gadget_tracetcp_drop_total" in metric_name:
              tcp_drop_total += int(val)
              parsed_metrics[metric_name] = val
          elif "gadget_ebpf_dropped_events_total" in metric_name:
              ebpf_dropped_events += int(val)
              parsed_metrics[metric_name] = val
          elif "gadget_active_tracers" in metric_name:
              active_tracers += int(val)
              parsed_metrics[metric_name] = val
          elif "gadget_trace_tcp_connect_latency_microseconds" in metric_name:
              tcp_connect_latency_us = max(tcp_connect_latency_us, val)
              parsed_metrics[metric_name] = val

      drop_violation = tcp_drop_total > max_tcp_drops
      ebpf_loss_violation = ebpf_dropped_events > max_ebpf_loss
      status = "VIOLATION" if (drop_violation or ebpf_loss_violation) else "HEALTHY"

      print(f"Audit Status: {status}")
      print(f"Observed TCP Drops: {tcp_drop_total} (Threshold: {max_tcp_drops})")
      print(f"Observed eBPF Event Loss: {ebpf_dropped_events} (Threshold: {max_ebpf_loss})")
      print(f"Active Gadget Tracers: {active_tracers}")
      print(f"Peak TCP Connect Latency: {tcp_connect_latency_us:.2f} us")

      diagnostic_summary = (
          f"Inspektor Gadget eBPF Audit completed across {lookback}-minute window. "
          f"Status: {status}. Total TCP Drops: {tcp_drop_total}, "
          f"Ring Buffer Event Loss: {ebpf_dropped_events}, "
          f"Active Tracers: {active_tracers}."
      )

      from kestra import Kestra
      Kestra.outputs({
          "status": status,
          "tcp_drop_total": tcp_drop_total,
          "ebpf_dropped_events": ebpf_dropped_events,
          "active_tracers": active_tracers,
          "tcp_connect_latency_us": tcp_connect_latency_us,
          "drop_violation": drop_violation,
          "ebpf_loss_violation": ebpf_loss_violation,
          "diagnostic_summary": diagnostic_summary
      })

  - id: check_alert_condition
    type: io.kestra.plugin.core.flow.If
    description: "Evaluates whether observed TCP drops or eBPF ring buffer event loss exceeded permitted thresholds and alerting is enabled."
    condition: "{{ inputs.alert_on_violation and (outputs.audit_ebpf_tcp_drops.vars.drop_violation or outputs.audit_ebpf_tcp_drops.vars.ebpf_loss_violation) }}"
    then:
      - id: notify_platform_sre
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: "Dispatches actionable kernel network diagnostics and socket buffer remediation advice to the Platform SRE Slack channel."
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "*Inspektor Gadget eBPF TCP Drop Alert*\n*Status:* {{ outputs.audit_ebpf_tcp_drops.vars.status }}\n*Summary:* {{ outputs.audit_ebpf_tcp_drops.vars.diagnostic_summary }}\n*TCP Drops Observed:* {{ outputs.audit_ebpf_tcp_drops.vars.tcp_drop_total }} (Threshold: {{ inputs.max_allowable_tcp_drops }})\n*eBPF Ring Buffer Loss:* {{ outputs.audit_ebpf_tcp_drops.vars.ebpf_dropped_events }} (Threshold: {{ inputs.max_ebpf_event_loss }})\n*Active Tracers:* {{ outputs.audit_ebpf_tcp_drops.vars.active_tracers }}\n*Peak Connect Latency:* {{ outputs.audit_ebpf_tcp_drops.vars.tcp_connect_latency_us }} us\n*Remediation:* Check node socket buffers (net.ipv4.tcp_rmem) and conntrack table saturation on affected worker nodes."
          }

  - id: emit_audit_manifest
    type: io.kestra.plugin.core.debug.Return
    description: "Emits a structured JSON audit manifest for SRE observability dashboards and kernel performance records."
    format: |
      {
        "status": "{{ outputs.audit_ebpf_tcp_drops.vars.status }}",
        "tcp_drop_total": {{ outputs.audit_ebpf_tcp_drops.vars.tcp_drop_total }},
        "ebpf_dropped_events": {{ outputs.audit_ebpf_tcp_drops.vars.ebpf_dropped_events }},
        "active_tracers": {{ outputs.audit_ebpf_tcp_drops.vars.active_tracers }},
        "tcp_connect_latency_us": {{ outputs.audit_ebpf_tcp_drops.vars.tcp_connect_latency_us }},
        "drop_violation": {{ outputs.audit_ebpf_tcp_drops.vars.drop_violation }},
        "ebpf_loss_violation": {{ outputs.audit_ebpf_tcp_drops.vars.ebpf_loss_violation }}
      }

  - id: log_audit_completion
    type: io.kestra.plugin.core.log.Log
    description: "Logs the summary outcome of the Inspektor Gadget eBPF telemetry audit."
    message: "Inspektor Gadget eBPF audit completed successfully. Status: {{ outputs.audit_ebpf_tcp_drops.vars.status }}. TCP Drops: {{ outputs.audit_ebpf_tcp_drops.vars.tcp_drop_total }}, eBPF Ring Buffer Loss: {{ outputs.audit_ebpf_tcp_drops.vars.ebpf_dropped_events }}."

triggers:
  - id: periodic_ebpf_kernel_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"

extend:
  title: Inspektor Gadget eBPF TCP Drop Watchdog
  metaTitle: Inspektor Gadget eBPF Kernel TCP Packet Drop Watchdog
  shortDescription: Audits Inspektor Gadget eBPF telemetry to detect silent TCP drops, socket buffer exhaustion, and ring buffer loss.
  metaDescription: Automated Kestra watchdog workflow monitoring Inspektor Gadget eBPF metrics for kernel TCP packet drops, socket overflows, and network telemetry stalls.
  description: |
    ## How it works
    1. A schedule trigger executes the Inspektor Gadget eBPF kernel telemetry audit workflow every 15 minutes.
    2. The Python task queries the Inspektor Gadget Prometheus telemetry service on Kubernetes.
    3. The script evaluates kernel-level `kfree_skb` and TCP connection drop events intercepting silent packet loss.
    4. An evaluation gate determines whether packet drop counts or eBPF ring buffer event loss breach cluster guardrails.
    5. When packet drops surge or ring buffer loss is detected, an actionable Slack incident alert is dispatched.
    6. When low-level kernel networking operates cleanly, nominal status is logged.

    ## Architecture diagram
    ```mermaid
    graph TD
        Trigger[Schedule Trigger: 15m] --> AuditDrops[Python Script: Query Inspektor Gadget Metrics]
        AuditDrops --> EvalBreach{TCP Drops > 25 OR Ring Buffer Loss > 10?}
        EvalBreach -- Yes --> SlackAlert[Slack: Kernel TCP Drop Alert]
        EvalBreach -- No --> LogNominal[Log: Nominal Kernel Networking]
    ```

    ## What you get
    - Immediate root-cause attribution for mysterious connection reset (ECONNRESET) errors in microservices.
    - Kernel-level visibility into network drops occurring before application-layer socket ingestion.
    - Automatic verification that eBPF tracers remain active across all cluster nodes without ring buffer overflows.
    - Enterprise Slack notifications with clear Linux sysctl tuning guidance.

    ## Who it's for
    - Kubernetes Platform Engineers managing high-throughput microservice networking.
    - Site Reliability Engineers investigating intermittent gRPC and HTTP/2 connection resets.
    - Cloud Infrastructure Architects optimizing Linux kernel network stack parameters (`tcp_rmem`, `tcp_wmem`).
    - Systems Engineers ensuring eBPF tracing reliability across production node pools.

    ## Why orchestrate this with Kestra
    - **Automated Kernel Surveillance**: Runs continuously on a cron schedule without manual intervention.
    - **Centralized Secrets Governance**: Protects sensitive Slack webhooks using encrypted namespace secrets.
    - **Declarative YAML Workflows**: Manages kernel telemetry infrastructure surveillance as versioned code in Git repositories.
    - **Comprehensive Audit History**: Preserves historical eBPF packet drop metrics in searchable Kestra execution logs.

    ## Use cases
    - **Silent TCP Drop Alarm**: Detects kernel packet drops caused by socket buffer or conntrack table exhaustion.
    - **eBPF Telemetry Health Watchdog**: Verifies that ring buffer event loss is not masking underlying cluster network issues.
    - **Microservice Outage Forensics**: Correlates application timeout spikes with low-level kernel networking telemetry.

    ## Inputs
    | Name | Type | Default | Description |
    | --- | --- | --- | --- |
    | `gadget_metrics_url` | STRING | `http://gadget-metrics.gadget-system.svc.cluster.local:2224/metrics` | Internal Kubernetes HTTP endpoint exposing Prometheus metrics from Inspektor Gadget. |
    | `max_allowable_tcp_drops` | INT | `25` | Maximum allowable kernel TCP drop events before triggering an alert. |
    | `max_ebpf_event_loss` | INT | `10` | Maximum allowable dropped eBPF events from ring buffer saturation. |
    | `lookback_minutes` | INT | `15` | Time window in minutes over which TCP drop velocity is evaluated. |
    | `alert_on_violation` | BOOL | `true` | Toggle whether operational incident alerts are dispatched to Slack. |

    ## Expected outputs
    - `{{ outputs.audit_ebpf_tcp_drops.vars.status }}`: Overall audit status (HEALTHY or VIOLATION).
    - `{{ outputs.audit_ebpf_tcp_drops.vars.tcp_drop_total }}`: Total number of kernel TCP drop events detected.
    - `{{ outputs.audit_ebpf_tcp_drops.vars.ebpf_dropped_events }}`: Count of dropped eBPF ring buffer events.
    - `{{ outputs.audit_ebpf_tcp_drops.vars.active_tracers }}`: Number of active Inspektor Gadget trace programs.
    - `{{ outputs.audit_ebpf_tcp_drops.vars.tcp_connect_latency_us }}`: Peak TCP connection establishment latency in microseconds.
    - `{{ outputs.audit_ebpf_tcp_drops.vars.diagnostic_summary }}`: Textual summary of the kernel telemetry audit.

    ## Prerequisites
    - Kubernetes cluster running Linux kernel 5.4+ with BTF enabled.
    - Inspektor Gadget deployed via DaemonSet with Prometheus metrics enabled on port 2224.
    - Network connectivity from the Kestra worker to the Inspektor Gadget metrics service.
    - Slack incoming webhook URL configured in Kestra secrets under `SLACK_WEBHOOK_URL`.

    ### Secrets
    - `SLACK_WEBHOOK_URL`: Secure webhook URL for routing kernel network alerts to Platform SRE channels.

    ## Quick start
    1. Verify Inspektor Gadget DaemonSet is running: `kubectl gadget version`.
    2. Add the `SLACK_WEBHOOK_URL` secret within your Kestra namespace settings.
    3. Trigger a manual execution via the Kestra UI to validate metric collection.
    4. Enable the `periodic_ebpf_kernel_audit` schedule trigger to establish automated surveillance.

    ## Common pitfalls and troubleshooting
    - **Kernel BTF Support**: Ensure the Linux kernel has `CONFIG_DEBUG_INFO_BTF=y` enabled for eBPF CO-RE compatibility.
    - **Metrics Service Port**: Inspektor Gadget Prometheus exporter runs on port 2224 by default; confirm the Kubernetes Service targets this port.
    - **Ring Buffer Saturation**: If `ebpf_dropped_events` is high, increase the Gadget ring buffer memory limit in the DaemonSet manifest.
    - **Network Policy Isolation**: Confirm network policies permit ingress on port 2224 from the Kestra worker namespace.

    ## How to extend
    - **Automated Sysctl Tuning**: Trigger an Ansible or Kubernetes DaemonSet job to dynamically bump `net.ipv4.tcp_rmem` when drops surge.
    - **Pod Level Correlation**: Query Inspektor Gadget trace TCP output to identify the exact pod IP addresses initiating dropped connections.
    - **Prometheus Alertmanager Forwarding**: Bridge Kestra audit results into Prometheus Alertmanager for unified corporate escalation.

    ## Links
    - [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
    - [CNCF Inspektor Gadget Documentation](https://www.inspektor-gadget.io/docs/latest/)
    - [Inspektor Gadget Prometheus Exporter Architecture](https://www.inspektor-gadget.io/docs/latest/gadgets/trace/tcpdrop/)
    - [Linux Kernel eBPF Subsystem Documentation](https://docs.kernel.org/bpf/index.html)
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Monitoring & Alerting
    - Kubernetes Operations
  ee: false
  demo: false
