id: transit-gateway-audit
namespace: company.finops

description: |
  Audits Transit Gateway attachments for zero traffic. Each attachment costs
  ~$36.50/month in hourly charges before a byte flows, and test VPCs stay
  attached long after the tests end. This flow lists every attachment, checks
  CloudWatch bytes transferred, and reports the idle ones.

inputs:
  - id: aws_regions
    type: ARRAY
    itemType: STRING
    defaults: ["us-east-1"]
    description: AWS regions to audit for idle Transit Gateway attachments.
  - id: traffic_window_days
    type: INT
    defaults: 14
    description: Lookback window in days for the traffic check.
  - id: monthly_cost_usd
    type: STRING
    defaults: "36.50"
    description: Monthly hourly-charge cost of one TGW attachment in USD ($0.05/hr).

tasks:
  - id: audit_tgw
    type: io.kestra.plugin.core.flow.ForEach
    description: Audit Transit Gateway attachments region by region.
    values: "{{ inputs.aws_regions }}"
    tasks:
      - id: audit_region
        type: io.kestra.plugin.aws.cli.AwsCLI
        description: List TGWs and check CloudWatch bytes per gateway.
        commands:
          - |
            REGION="{{ taskrun.value }}"
            DAYS={{ inputs.traffic_window_days }}
            PRICE="{{ inputs.monthly_cost_usd }}"
            END=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            START=$(date -u -d "$DAYS days ago" +%Y-%m-%dT%H:%M:%SZ)
            PERIOD=$((DAYS * 86400))
            echo "Checking Transit Gateways in $REGION (window: last $DAYS days)"
            aws ec2 describe-transit-gateways --region "$REGION" \
              --query 'TransitGateways[?State==`available`].[TransitGatewayId]' \
              --output text > /tmp/tgws.txt || true
            IDLE_COUNT=0
            IDLE_LIST=""
            while read -r TGW; do
              [ -z "$TGW" ] && continue
              ATTS=$(aws ec2 describe-transit-gateway-attachments --region "$REGION" \
                --filters Name=transit-gateway-id,Values="$TGW" \
                --query 'length(TransitGatewayAttachments[?State==`available`])' \
                --output text 2>/dev/null)
              case "$ATTS" in ''|'None') ATTS=0;; esac
              BYTES=$(aws cloudwatch get-metric-statistics --region "$REGION" \
                --namespace AWS/TransitGateway \
                --metric-name BytesIn \
                --dimensions Name=TransitGateway,Value="$TGW" \
                --start-time "$START" --end-time "$END" \
                --period "$PERIOD" --statistics Sum \
                --query 'Datapoints[0].Sum' --output text 2>/dev/null)
              case "$BYTES" in ''|'None') BYTES=0;; esac
              BYTES_INT=${BYTES%.*}
              echo "tgw $TGW: $ATTS attachments, ${BYTES_INT} bytes in ${DAYS}d"
              if [ "$BYTES_INT" -eq 0 ] && [ "$ATTS" -gt 0 ]; then
                WASTE=$(python3 -c "print('{:.2f}'.format($ATTS * float('$PRICE')))")
                IDLE_LIST="${IDLE_LIST}${TGW} (${ATTS} attachments, ~\$${WASTE}/mo), "
                IDLE_COUNT=$((IDLE_COUNT + 1))
              fi
            done < /tmp/tgws.txt
            if [ "$IDLE_COUNT" -gt 0 ]; then HAS_IDLE=true; else HAS_IDLE=false; fi
            echo "HAS_IDLE=$HAS_IDLE"
            echo "IDLE_COUNT=$IDLE_COUNT"
            echo "IDLE_TGWS=$IDLE_LIST"
            echo "REGION_DONE=$REGION"
        env:
          AWS_ACCESS_KEY_ID: "{{ secret('AWS_ACCESS_KEY_ID') }}"
          AWS_SECRET_ACCESS_KEY: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
          AWS_DEFAULT_REGION: "{{ taskrun.value }}"
      - id: notify_region
        type: io.kestra.plugin.core.flow.If
        description: Report idle Transit Gateways for detachment review.
        condition: "{{ outputs.audit_region.vars.HAS_IDLE == 'true' }}"
        then:
          - id: slack_idle
            type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
            url: "{{ secret('SLACK_WEBHOOK_URL') }}"
            payload: |
              {
                "text": ":money_with_wings: Idle Transit Gateways in `{{ outputs.audit_region.vars.REGION_DONE }}` — *{{ outputs.audit_region.vars.IDLE_COUNT }}* with zero bytes in 14 days but live attachments.\n`{{ outputs.audit_region.vars.IDLE_TGWS }}`\nDetach unused VPCs in the VPC console — each attachment bills hourly regardless of traffic."
              }
        else:
          - id: log_busy
            type: io.kestra.plugin.core.log.Log
            message: "No idle Transit Gateways in {{ outputs.audit_region.vars.REGION_DONE }} — every gateway moved traffic in the window."

triggers:
  - id: weekly
    type: io.kestra.plugin.core.trigger.Schedule
    description: Weekly on Sunday at 02:00 UTC. Shipped disabled; enable after your first manual run.
    cron: "0 2 * * 0"
    disabled: true

extend:
  title: Transit Gateway Idle Audit
  metaTitle: Find Idle Transit Gateway Attachments | Kestra
  shortDescription: Audit Transit Gateways across regions, check 14 days of CloudWatch bytes per gateway, and get a Slack report of the idle ones with attachment waste estimates.
  metaDescription: Each TGW attachment costs ~$36.50/mo in hourly charges. This flow finds zero-traffic gateways and reports the waste weekly.
  description: |
    A Transit Gateway attachment costs about $0.05/hour — roughly $36.50/month — per attachment, whether it routes a terabyte or nothing at all. Test VPCs get attached, the tests end, and the attachments stay, billing quietly. This blueprint finds the idle ones with real traffic data.

    ## How it works

    1. A Schedule trigger fires weekly on Sunday at 02:00 UTC (shipped disabled).
    2. A ForEach loop audits each region in `aws_regions`.
    3. Per region, the flow lists available Transit Gateways, counts their live attachments, then pulls the full-window `BytesIn` CloudWatch metric per gateway.
    4. Gateways with live attachments but zero bytes in the window are flagged idle, with waste estimated per attachment.
    5. An `If` task posts a Slack report with the idle gateways only when something is actually idle.

    ## What you get

    - A weekly list of Transit Gateways moving zero traffic, with attachment counts and waste estimates.
    - A concrete detachment list — unused VPC attachments are pure hourly waste.
    - Multi-region coverage in one run.
    - Silence when every gateway routes traffic — alerts only on real findings.

    ## Who it's for

    Platform engineers running hub-and-spoke networks, where test and temp VPCs get attached and never detached.

    ## Why orchestrate this with Kestra

    A one-off CLI session finds today's idle gateways and is forgotten by next month. As a scheduled Kestra flow the audit runs itself, the window is an input anyone can tune, every run is logged for audit, and adding a region is one list entry — not a new script.

    ## Prerequisites

    - AWS credentials with `ec2:DescribeTransitGateways`, `ec2:DescribeTransitGatewayAttachments`, and `cloudwatch:GetMetricStatistics` permissions.
    - A Slack incoming webhook URL.

    ### Secrets

    - `AWS_ACCESS_KEY_ID`: AWS access key for the EC2 and CloudWatch API calls.
    - `AWS_SECRET_ACCESS_KEY`: AWS secret key for the EC2 and CloudWatch API calls.
    - `SLACK_WEBHOOK_URL`: Incoming webhook URL for the audit report.

    ## Quick start

    1. Add the three secrets above to your Kestra namespace.
    2. Set `aws_regions` to the regions you run Transit Gateways in.
    3. Run manually once and review the Slack report (or the clean log line).
    4. Enable the weekly schedule trigger.

    ## How to extend

    - Also check `BytesOut` for gateways that only receive but never send.
    - List the specific idle attachments (VPC IDs) per gateway for a one-click detach list.
    - Exclude gateways tagged `Keep=true` for known standby hub setups.

    ## Links

    - [Kestra AWS plugins](https://kestra.io/plugins)
    - [Kestra Slack plugins](https://kestra.io/plugins)
    - [Transit Gateway pricing](https://aws.amazon.com/transit-gateway/pricing/)
    - [EC2 describe-transit-gateways API](https://docs.aws.amazon.com/cli/latest/reference/ec2/describe-transit-gateways.html)
  tags:
    - Infrastructure
  subTags:
    - FinOps & Cost Management
    - Monitoring & Alerting
  ee: false
  demo: false
