id: trello-new-card-router
namespace: company.team
description: |
  Auto-acknowledge every new card dropped into a Trello intake list. The
  Trello trigger polls the list, and for each detected card the flow posts
  intake instructions as a comment and tells Slack how many requests just
  arrived, so requesters hear back within minutes without a human watching
  the board.

tasks:
  - id: acknowledge_each_card
    type: io.kestra.plugin.core.flow.ForEach
    description: Iterate over every card detected in the polling batch so each requester gets an acknowledgement, not just the first.
    values: "{{ trigger.cards }}"
    tasks:
      - id: comment_instructions
        type: io.kestra.plugin.trello.cards.Comment
        description: Post the intake instructions on the new card so the requester knows the request was seen and what happens next.
        apiKey: "{{ secret('TRELLO_API_KEY') }}"
        apiToken: "{{ secret('TRELLO_API_TOKEN') }}"
        cardId: "{{ fromJson(taskrun.value).cardId }}"
        text: |
          Thanks, your request "{{ fromJson(taskrun.value).cardName }}" has been received.

          Next steps for intake:
          1. Add a short acceptance criteria section to the card description.
          2. Attach any screenshots or files the team will need.
          3. The team reviews intake twice a day and will move your card once it is scheduled.

  - id: notify
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Tell the team how many new intake requests were acknowledged in this batch.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "Trello intake acknowledged {{ trigger.count }} new cards. Each requester received the intake instructions as a comment (execution {{ execution.id }})."
      }

errors:
  - id: alert_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alert Slack when acknowledgement fails so new requests never sit unanswered without anyone knowing.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "Trello intake acknowledgement FAILED in flow {{ flow.id }} (execution {{ execution.id }}). New cards may be waiting without a reply; check the task logs and the Trello credentials."
      }

triggers:
  - id: watch_intake
    type: io.kestra.plugin.trello.cards.Trigger
    description: Poll the intake list every five minutes and start one execution per batch of newly detected cards.
    apiKey: "{{ secret('TRELLO_API_KEY') }}"
    apiToken: "{{ secret('TRELLO_API_TOKEN') }}"
    lists:
      - replace-with-your-intake-list-id
    interval: PT5M
    disabled: true

extend:
  title: Auto-Acknowledge New Trello Intake Cards with Instructions and Slack Alerts
  shortDescription: A Trello trigger polls an intake list and, for every new card, comments the intake instructions and posts a batch summary to Slack.
  metaTitle: Trello New Card Auto-Acknowledgement with Kestra
  metaDescription: Poll a Trello intake list with Kestra, comment intake instructions on every new card, and notify Slack, so requests get acknowledged within minutes.
  description: |
    An intake list only works if requesters trust that someone is watching it. This blueprint makes the acknowledgement automatic: `io.kestra.plugin.trello.cards.Trigger` polls the intake list, and for every new card the flow posts the intake instructions as a comment through `io.kestra.plugin.trello.cards.Comment` and summarizes the batch in Slack. Requesters hear back within the polling interval, and the team sees intake volume in chat without opening the board.

    ## How it works

    1. The `watch_intake` trigger (`io.kestra.plugin.trello.cards.Trigger`) polls the configured list every five minutes and fires one execution per batch of detected cards. It ships `disabled: true`; point `lists` at your intake list id before enabling.
    2. The trigger exposes the batch as `{{ trigger.cards }}`, where each card carries `cardId`, `cardName`, `cardUrl`, `listId`, and an `action` label, plus `{{ trigger.count }}` for the batch size.
    3. `acknowledge_each_card` (`io.kestra.plugin.core.flow.ForEach`) iterates over the batch. Inside the loop, `{{ fromJson(taskrun.value).cardId }}` addresses the current card.
    4. `comment_instructions` (`io.kestra.plugin.trello.cards.Comment`) posts the intake checklist on the card, quoting the card name so the comment reads as a personal acknowledgement.
    5. `notify` posts the batch count to Slack, and the `errors` block raises a distinct alert when acknowledgement fails, since an unanswered intake list erodes trust fastest.

    ## What you get

    - Every new request acknowledged within the polling interval, with concrete next steps.
    - Batch-safe processing: five cards arriving together produce five comments, not one.
    - Intake volume visible in Slack without anyone watching the board.
    - A failure alert for the silent-intake failure mode.

    ## Who it's for

    - Teams running request intake through a Trello list: IT, design, data, or internal tooling.
    - Ops leads who want a service-desk feel without adopting a service desk.
    - Anyone whose intake column has become a place where requests go quiet.

    ## Why orchestrate this with Kestra

    Trello has no built-in way to run logic when a card appears. Kestra supplies the polling trigger with batch semantics, the loop over detected cards, secret management for the API credentials, and an execution history that shows exactly which cards were acknowledged and when.

    ## Prerequisites

    - A Trello board with an intake list, and that list's id for the trigger's `lists` property.
    - A Trello API key and token from https://trello.com/power-ups/admin.
    - A Slack incoming webhook for batch summaries and failure alerts.

    ### Secrets

    - `TRELLO_API_KEY`: Trello API key.
    - `TRELLO_API_TOKEN`: Trello API token.
    - `SLACK_WEBHOOK_URL`: Slack incoming webhook URL.

    ## Quick start

    1. Add the three secrets to your Kestra namespace.
    2. Replace `replace-with-your-intake-list-id` with your intake list id.
    3. Set `disabled: false` on the `watch_intake` trigger, drop a card into the list, and check the comment plus the Slack summary.

    ## How to extend

    - Tailor the instruction text per list by watching several lists and branching on `{{ fromJson(taskrun.value).listId }}` with `io.kestra.plugin.core.flow.If`.
    - Set a response-time expectation by adding a due date to each card with `io.kestra.plugin.trello.cards.Update`.
    - Shorten `interval` for a snappier acknowledgement, or lengthen it for low-traffic boards.
    - Include `{{ fromJson(taskrun.value).cardUrl }}` in the Slack payload to deep-link each card.

    ## Links

    - [Trello plugin documentation](https://kestra.io/plugins/plugin-trello)
    - [Trello REST API documentation](https://developer.atlassian.com/cloud/trello/rest/)
  tags:
    - Business
  subTags:
    - Realtime Events
    - HR & Ops Automation
  ee: false
  demo: false
