id: dragonfly-replication-offset-drift-sentinel
namespace: company.team
description: Audits Dragonfly cache primary and replica replication offsets via redis-cli to detect replication stream desynchronization.

inputs:
  - id: dragonfly_host
    type: STRING
    defaults: dragonfly-replica.internal
  - id: dragonfly_port
    type: INT
    defaults: 6379
  - id: max_repl_lag_bytes_threshold
    type: INT
    defaults: 1048576

tasks:
  - id: audit_dragonfly
    type: io.kestra.plugin.scripts.python.Script
    description: Probes Dragonfly replication stats to measure primary-replica offset lag.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install redis kestra
    env:
      DRAGONFLY_HOST: "{{ inputs.dragonfly_host }}"
      DRAGONFLY_PORT: "{{ inputs.dragonfly_port }}"
      DRAGONFLY_PASSWORD: "{{ secret('DRAGONFLY_PASSWORD') }}"
    outputFiles:
      - df_repl_health.json
    script: |
      import os
      import sys
      import json
      import redis
      from kestra import Kestra

      host = os.environ.get("DRAGONFLY_HOST", "dragonfly-replica.internal")
      port = int(os.environ.get("DRAGONFLY_PORT", 6379))
      password = os.environ.get("DRAGONFLY_PASSWORD") or None

      try:
          client = redis.Redis(
              host=host,
              port=port,
              password=password,
              socket_connect_timeout=10,
              socket_timeout=10,
              decode_responses=True
          )
          repl = client.info(section="replication")
      except Exception as err:
          print(f"ERROR: Failed to connect to Dragonfly at {host}:{port}: {err}", file=sys.stderr)
          sys.exit(1)

      role = repl.get("role", "unknown")
      master_offset = int(repl.get("master_repl_offset", 0))
      slave_offset = int(repl.get("slave_repl_offset", master_offset))

      drift_bytes = max(0, master_offset - slave_offset)

      report = {
          "role": role,
          "drift_bytes": drift_bytes,
          "master_offset": master_offset,
          "slave_offset": slave_offset
      }
      with open("df_repl_health.json", "w", encoding="utf-8") as f:
          json.dump(report, f, indent=2)

      print(f"Dragonfly replication: role={role}, drift={drift_bytes} bytes")

      Kestra.outputs(report)

  - id: evaluate_and_alert
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.audit_dragonfly.vars.drift_bytes > inputs.max_repl_lag_bytes_threshold }}"
    then:
      - id: notify_slack
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "text": "Dragonfly Replication Offset Drift\n*Host:* {{ inputs.dragonfly_host }}:{{ inputs.dragonfly_port }}\n*Role:* {{ outputs.audit_dragonfly.vars.role }}\n*Replication Drift:* {{ outputs.audit_dragonfly.vars.drift_bytes }} bytes\n*Threshold:* {{ inputs.max_repl_lag_bytes_threshold }} bytes\n*Risk:* Stale reads on read-replica endpoints."
          }

errors:
  - id: handle_inspection_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "text": "Execution Failure: Dragonfly Primary-Replica Offset Drift Sentinel\n*Execution ID:* `{{ execution.id }}`\n*State:* `{{ execution.state.current }}`\n*Error:* Sentinel inspection encountered an unhandled execution error."
      }

triggers:
  - id: scheduled_monitor
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/10 * * * *"
    disabled: true

extend:
  metaDescription: "Audits Dragonfly cache primary and replica replication offsets via redis-cli to detect replication stream desynchronization."
  metaTitle: Dragonfly Primary-Replica Offset Drift Sentinel with Kestra
  title: Dragonfly Primary-Replica Offset Drift Sentinel
  shortDescription: Audits Dragonfly cache primary and replica replication offsets to detect replication stream desynchronization.
  description: |
    ## How it works
    This automated sentinel flow continuously assesses operational health, metrics, and capacity parameters for **Dragonfly Primary-Replica Offset Drift Sentinel**. It runs authentic CLI probes or REST telemetry inspections directly against the running infrastructure instance, parses the JSON response using native jq or schema tooling, evaluates conditions against defined thresholds via `io.kestra.plugin.core.flow.If`, and triggers instant Slack notifications with actionable contextual diagnostics when anomalies or threshold violations occur.

    ## Prerequisites
    - Accessible network route from the Kestra worker to the target service instance.
    - Active Slack Incoming Webhook URL configured as `SLACK_WEBHOOK` secret.

    ## Quick start
    1. Import this blueprint into Kestra under the `company.team` namespace.
    2. Configure required secrets (`SLACK_WEBHOOK`, `DRAGONFLY_PASSWORD`).
    3. Review and adjust input parameters.
  tags:
    - Infrastructure
  subTags:
    - Monitoring & Alerting
  ee: false
