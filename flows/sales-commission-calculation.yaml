id: sales-commission-calculation
namespace: company.team

description: |
  Monthly sales commission run: credit each closed-won deal to its reps (splits, overlays),
  compute year-to-date quota attainment, apply the tiered rate with accelerators above quota
  and a decelerator below threshold, pay only on cash collected, claw back commission on deals
  that churned or were refunded inside the clawback window, apply caps, guarantees for new
  hires and SPIFs, reconcile credited bookings to the CRM and the ledger, produce a statement
  per rep and the payroll file, and accrue earned-but-unpaid commission. Locks the month.

inputs:
  - id: month
    type: STRING
    displayName: Month (YYYY-MM)
    defaults: "2026-09"
    validator: ^\d{4}-(0[1-9]|1[0-2])$

  - id: scenario
    type: SELECT
    displayName: Demo scenario
    description: ISSUES adds a deal whose split credits add up to 130%, a deal credited to a rep not on any plan, and a deal booked in the CRM but missing from the ledger, which must stop the run.
    values:
      - CLEAN
      - ISSUES
    defaults: CLEAN

  - id: clawback_days
    type: INT
    displayName: Clawback window (days)
    description: Commission is clawed back when a deal churns or is refunded within this many days of closing.
    defaults: 180

  - id: approved_by
    type: STRING
    displayName: Approved by
    description: The sales operations or finance approver. Needed when a payout exceeds the cap, a clawback exceeds 5,000, or a rep is above 200% of quota.
    defaults: ""

variables:
  lock_key: commission_runs
  pack_dir: "commissions/{{ inputs.month }}"

concurrency:
  limit: 1

tasks:
  - id: state
    type: io.kestra.plugin.core.output.OutputValues
    values:
      s: "{{ kv(vars.lock_key, errorOnMissing=false) ?? {'last': '', 'paid': {}} | toJson }}"
      last: "{{ (kv(vars.lock_key, errorOnMissing=false) ?? {'last': ''}) | jq('.last') | first }}"
      previous: "{{ (inputs.month ~ '-01') | date('yyyy-MM-dd') | dateAdd(-1, 'MONTHS') | date('yyyy-MM') }}"

  - id: order_gate
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.state.values.last != '' and (inputs.month <= outputs.state.values.last or outputs.state.values.last != outputs.state.values.previous) }}"
    then:
      - id: out_of_order
        type: io.kestra.plugin.core.execution.Fail
        errorMessage: >-
          {{ inputs.month <= outputs.state.values.last ? inputs.month ~ ' has already been paid.' : 'Run ' ~ outputs.state.values.previous ~ ' first (last paid: ' ~ outputs.state.values.last ~ ').' }}

  - id: calculate
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: >
      One DuckDB session: plans, reps, deals, splits, invoices and payments, churn events and
      the ledger (demo generator or your CRM, billing and HR exports), credits, attainment,
      earned commission by tier, the cash-collected payout rule, clawbacks, caps, guarantees,
      SPIFs, the statements, the payroll file, the accrual and the checks.
    outputFiles:
      - statements
      - deals
      - payroll
      - blockers
    fetchType: FETCH_ONE
    sql: |
      SET VARIABLE m_start = DATE '{{ inputs.month }}-01';
      SET VARIABLE m_end = (DATE '{{ inputs.month }}-01' + INTERVAL 1 MONTH - INTERVAL 1 DAY)::DATE;
      SET VARIABLE y_start = make_date(year(DATE '{{ inputs.month }}-01'), 1, 1);

      -- =======================================================================
      -- Plans. A rate per tier of year-to-date attainment, a monthly cap and a
      -- guarantee for new hires. Replace with your compensation plans.
      -- =======================================================================
      CREATE TABLE plans (plan VARCHAR, annual_quota DOUBLE, tier_from DOUBLE, tier_to DOUBLE, rate DOUBLE, monthly_cap DOUBLE);
      INSERT INTO plans VALUES
        ('AE', 1200000, 0.0, 0.5, 0.05, 15000), ('AE', 1200000, 0.5, 1.0, 0.10, 15000), ('AE', 1200000, 1.0, 1.5, 0.15, 15000), ('AE', 1200000, 1.5, 99, 0.20, 15000),
        ('SE', 2400000, 0.0, 1.0, 0.02, 15000), ('SE', 2400000, 1.0, 99, 0.03, 15000),
        ('MGR', 6000000, 0.0, 1.0, 0.012, 30000), ('MGR', 6000000, 1.0, 99, 0.02, 30000);

      CREATE TABLE reps AS
      SELECT 'REP-' || lpad(i::VARCHAR, 2, '0') AS rep, 'Rep ' || i AS name, CASE WHEN i <= 10 THEN 'AE' WHEN i <= 13 THEN 'SE' ELSE 'MGR' END AS plan,
             CASE WHEN i = 9 THEN DATE '2026-07-01' ELSE DATE '2024-01-01' END AS hired_on, CASE WHEN i = 9 THEN 6000 ELSE 0 END AS monthly_guarantee
      FROM range(1, 15) t(i);

      -- =======================================================================
      -- Closed-won deals of the year. Replace with your CRM export.
      -- =======================================================================
      CREATE TABLE deals AS
      SELECT 'OPP-' || lpad(i::VARCHAR, 4, '0') AS deal, 'Customer ' || (1 + i % 90) AS customer,
             (getvariable('y_start') + ((i * 13) % 270)::INT)::DATE AS closed_on,
             round(6000 + (hash(i) % 60000)::INT * CASE WHEN i % 17 = 0 THEN 3 ELSE 1 END, -2)::DOUBLE AS acv,
             'REP-' || lpad((1 + i % 10)::VARCHAR, 2, '0') AS owner
      FROM range(1, 241) t(i);
      -- One rep has a monster quarter, to show accelerators and the cap.
      UPDATE deals SET acv = acv * 4 WHERE owner = 'REP-03' AND month(closed_on) = 9;

      -- Credit splits: the owner gets 100%; one deal in five is shared 60/40 with another AE;
      -- the SE overlay and the manager get 100% on top (overlay credit, not a split).
      CREATE TABLE credits AS
      SELECT deal, owner AS rep, CASE WHEN hash(deal) % 5 = 0 THEN 0.6 ELSE 1.0 END AS share, 'SPLIT' AS kind FROM deals
      UNION ALL SELECT deal, 'REP-' || lpad((1 + (hash(deal) % 10)::INT)::VARCHAR, 2, '0'), 0.4, 'SPLIT' FROM deals
        WHERE hash(deal) % 5 = 0 AND 'REP-' || lpad((1 + (hash(deal) % 10)::INT)::VARCHAR, 2, '0') <> owner
      UNION ALL SELECT deal, 'REP-' || (11 + (hash(deal || 's') % 3)::INT), 1.0, 'OVERLAY' FROM deals
      UNION ALL SELECT deal, 'REP-14', 1.0, 'OVERLAY' FROM deals;
      -- REP-09 joined in July: earlier deals in the demo belong to REP-10.
      UPDATE credits SET rep = 'REP-10' WHERE rep = 'REP-09' AND deal IN (SELECT deal FROM deals WHERE closed_on < DATE '2026-07-01');
      UPDATE deals SET owner = 'REP-10' WHERE owner = 'REP-09' AND closed_on < DATE '2026-07-01';
      -- Fix splits whose second rep happened to be the owner: give the owner 100%.
      UPDATE credits SET share = 1.0 WHERE kind = 'SPLIT' AND share = 0.6
        AND deal NOT IN (SELECT deal FROM credits WHERE kind = 'SPLIT' AND share = 0.4);

      -- Invoices and payments: one invoice per deal, paid 15 to 75 days later; one in twelve still unpaid.
      CREATE TABLE payments AS
      SELECT deal, CASE WHEN hash(deal || 'p') % 12 = 0 THEN NULL ELSE (closed_on + (15 + hash(deal) % 61)::INT)::DATE END AS paid_on, acv AS amount FROM deals;
      -- Churn and refunds: a few customers cancel inside the clawback window.
      CREATE TABLE churn AS
      SELECT deal, (closed_on + (40 + hash(deal) % 100)::INT)::DATE AS churned_on, 'Cancelled in the first months' AS reason FROM deals WHERE hash(deal || 'c') % 23 = 0;
      -- SPIF: 1,000 per new-logo deal above 50,000 closed in September.
      CREATE TABLE spifs AS
      SELECT owner AS rep, 'Q3 new-logo SPIF: ' || deal AS reason, 1000.0 AS amount, closed_on AS earned_on FROM deals WHERE month(closed_on) = 9 AND acv > 50000;

      -- Ledger revenue bookings. Replace with your ERP.
      CREATE TABLE ledger AS SELECT deal, acv AS booked FROM deals;
      {% if inputs.scenario == 'ISSUES' %}
      INSERT INTO deals VALUES ('OPP-9001', 'Customer 7', getvariable('m_start') + 10, 45000, 'REP-02'), ('OPP-9002', 'Customer 8', getvariable('m_start') + 12, 30000, 'REP-77');
      INSERT INTO credits VALUES ('OPP-9001', 'REP-02', 0.7, 'SPLIT'), ('OPP-9001', 'REP-05', 0.6, 'SPLIT'), ('OPP-9002', 'REP-77', 1.0, 'SPLIT');
      INSERT INTO payments VALUES ('OPP-9001', getvariable('m_start') + 20, 45000), ('OPP-9002', NULL, 30000);
      {% endif %}

      -- =======================================================================
      -- Checks.
      -- =======================================================================
      CREATE TABLE blockers AS
      SELECT 'SPLITS_NOT_100' AS code, deal AS ref, 'Split credits add up to ' || round(100 * sum(share)) || '%' AS detail FROM credits WHERE kind = 'SPLIT' GROUP BY deal HAVING abs(sum(share) - 1) > 0.0001
      UNION ALL SELECT 'REP_NOT_ON_A_PLAN', c.deal, c.rep || ' is credited but has no compensation plan' FROM credits c WHERE c.rep NOT IN (SELECT rep FROM reps)
      UNION ALL SELECT 'CREDITED_BEFORE_HIRE', c.deal, c.rep || ' credited on a deal closed ' || d.closed_on || ', before joining on ' || r.hired_on
        FROM credits c JOIN deals d USING (deal) JOIN reps r ON r.rep = c.rep WHERE d.closed_on < r.hired_on
      UNION ALL SELECT 'NOT_IN_LEDGER', d.deal, 'Closed-won for ' || d.acv || ' in the CRM, no booking in the ledger' FROM deals d WHERE d.closed_on <= getvariable('m_end') AND d.deal NOT IN (SELECT deal FROM ledger)
      UNION ALL SELECT 'AMOUNT_DIFFERS_FROM_LEDGER', d.deal, 'CRM ' || d.acv || ', ledger ' || l.booked FROM deals d JOIN ledger l USING (deal) WHERE abs(d.acv - l.booked) >= 0.01;

      -- =======================================================================
      -- Earned commission. Credits are applied in closing order; each deal's
      -- credit is cut across the tiers it spans, so a deal that crosses quota
      -- earns the lower rate on the part below and the higher rate above.
      -- =======================================================================
      CREATE TABLE credited AS
      SELECT c.rep, r.plan, d.deal, d.customer, d.closed_on, c.kind, d.acv * c.share AS credit,
             sum(d.acv * c.share) OVER (PARTITION BY c.rep ORDER BY d.closed_on, d.deal ROWS UNBOUNDED PRECEDING) AS cum_after,
             (SELECT max(annual_quota) FROM plans p WHERE p.plan = r.plan) AS quota
      FROM credits c JOIN deals d USING (deal) JOIN reps r ON r.rep = c.rep
      WHERE d.closed_on BETWEEN getvariable('y_start') AND getvariable('m_end');

      CREATE TABLE earned AS
      SELECT k.rep, k.plan, k.deal, k.customer, k.closed_on, k.kind, k.credit, k.cum_after, k.quota,
             sum(greatest(least(k.cum_after, p.tier_to * k.quota) - greatest(k.cum_after - k.credit, p.tier_from * k.quota), 0) * p.rate) AS commission
      FROM credited k JOIN plans p ON p.plan = k.plan
      GROUP BY ALL;

      -- Paid on cash: commission becomes payable in the month the invoice is paid.
      -- Clawback: a deal churned within the window takes back what was paid on it.
      CREATE TABLE deal_lines AS
      SELECT e.*, p.paid_on, ch.churned_on,
             CASE WHEN p.paid_on <= getvariable('m_end') THEN true ELSE false END AS collected,
             CASE WHEN ch.churned_on <= getvariable('m_end') AND date_diff('day', e.closed_on, ch.churned_on) <= {{ inputs.clawback_days }} THEN true ELSE false END AS clawed
      FROM earned e LEFT JOIN payments p USING (deal) LEFT JOIN churn ch USING (deal);

      -- What has already been paid in earlier runs, per rep and deal.
      CREATE TABLE paid_before AS
      SELECT split_part(key, '|', 1) AS rep, split_part(key, '|', 2) AS deal, value::DOUBLE AS paid
      FROM json_each('{{ outputs.state.values.s | jq(".paid") | first | toJson }}');

      CREATE TABLE movements AS
      SELECT d.rep, d.deal, d.customer, d.closed_on, d.kind, d.credit, d.commission, d.collected, d.clawed, d.paid_on, d.churned_on,
             coalesce(pb.paid, 0) AS paid_before,
             CASE WHEN d.clawed THEN -coalesce(pb.paid, 0) WHEN d.collected THEN d.commission - coalesce(pb.paid, 0) ELSE 0 END AS this_month,
             CASE WHEN d.clawed THEN 'CLAWBACK' WHEN d.collected AND coalesce(pb.paid, 0) = 0 THEN 'PAYABLE' WHEN d.collected THEN 'TRUE_UP' ELSE 'AWAITING_CASH' END AS status
      FROM deal_lines d LEFT JOIN paid_before pb USING (rep, deal);

      -- =======================================================================
      -- Statement per rep: payable, clawbacks, SPIFs, guarantee, cap.
      -- =======================================================================
      CREATE TABLE statements AS
      WITH s AS (
        SELECT r.rep, r.name, r.plan, r.monthly_guarantee,
               coalesce(sum(m.credit), 0) AS ytd_credit, (SELECT max(annual_quota) FROM plans p WHERE p.plan = r.plan) AS quota,
               coalesce(sum(m.commission), 0) AS ytd_earned,
               coalesce(sum(m.this_month) FILTER (WHERE m.status IN ('PAYABLE', 'TRUE_UP')), 0) AS payable,
               coalesce(sum(m.this_month) FILTER (WHERE m.status = 'CLAWBACK'), 0) AS clawback,
               coalesce(sum(m.commission) FILTER (WHERE m.status = 'AWAITING_CASH'), 0) AS awaiting_cash,
               coalesce((SELECT sum(amount) FROM spifs sp WHERE sp.rep = r.rep AND sp.earned_on BETWEEN getvariable('m_start') AND getvariable('m_end')), 0) AS spif
        FROM reps r LEFT JOIN movements m USING (rep) GROUP BY r.rep, r.name, r.plan, r.monthly_guarantee
      )
      SELECT s.* REPLACE (CASE WHEN getvariable('m_start') >= date_trunc('month', (SELECT hired_on FROM reps x WHERE x.rep = s.rep))
                                AND getvariable('m_start') < (SELECT hired_on FROM reps x WHERE x.rep = s.rep) + INTERVAL 6 MONTH THEN s.monthly_guarantee ELSE 0 END AS monthly_guarantee),
             coalesce(s.ytd_credit / nullif(s.quota, 0), 0) AS attainment,
             (SELECT max(monthly_cap) FROM plans p WHERE p.plan = s.plan) AS cap
      FROM s;
      ALTER TABLE statements ADD COLUMN gross DOUBLE; ALTER TABLE statements ADD COLUMN cap_cut DOUBLE;
      ALTER TABLE statements ADD COLUMN guarantee_topup DOUBLE; ALTER TABLE statements ADD COLUMN net_pay DOUBLE;
      UPDATE statements SET gross = payable + clawback + spif;
      UPDATE statements SET cap_cut = greatest(gross - cap, 0);
      UPDATE statements SET guarantee_topup = greatest(monthly_guarantee - (gross - cap_cut), 0);
      UPDATE statements SET net_pay = gross - cap_cut + guarantee_topup;

      -- The capped amount is not lost: it stays earned and unpaid, carried to the
      -- next month's accrual. Earned but unpaid = awaiting cash + cap cut.
      CREATE TABLE payroll AS
      SELECT rep, name, round(net_pay, 2) AS amount, '{{ inputs.month }}' AS period, 'Commission' AS pay_code FROM statements WHERE round(net_pay, 2) <> 0 ORDER BY rep;

      -- What this run pays per rep and deal, for the next run's paid_before. A capped
      -- statement is paid pro rata on its payable deals.
      CREATE TABLE paid_now AS
      SELECT m.rep, m.deal, coalesce(pb.paid, 0) + CASE WHEN m.status = 'CLAWBACK' THEN m.this_month
             ELSE m.this_month * CASE WHEN s.payable > 0 THEN (s.payable - least(s.cap_cut, s.payable)) / s.payable ELSE 1 END END AS paid
      FROM movements m JOIN statements s USING (rep) LEFT JOIN paid_before pb USING (rep, deal)
      WHERE m.status IN ('PAYABLE', 'TRUE_UP', 'CLAWBACK') OR pb.paid IS NOT NULL;

      COPY (SELECT rep, name, plan, round(ytd_credit) AS ytd_credit, quota, round(100 * attainment, 1) AS attainment_pct, round(ytd_earned, 2) AS ytd_earned,
                   round(payable, 2) AS payable, round(clawback, 2) AS clawback, round(spif, 2) AS spif, round(cap_cut, 2) AS cap_cut,
                   round(guarantee_topup, 2) AS guarantee_topup, round(net_pay, 2) AS net_pay, round(awaiting_cash, 2) AS awaiting_cash FROM statements ORDER BY rep)
        TO '{{ outputFiles.statements }}' (HEADER, DELIMITER ',');
      COPY (SELECT rep, deal, customer, closed_on, kind, round(credit, 2) AS credit, round(commission, 2) AS commission, paid_on, churned_on, status,
                   round(paid_before, 2) AS paid_before, round(this_month, 2) AS this_month FROM movements ORDER BY rep, closed_on, deal) TO '{{ outputFiles.deals }}' (HEADER, DELIMITER ',');
      COPY payroll TO '{{ outputFiles.payroll }}' (HEADER, DELIMITER ',');
      COPY blockers TO '{{ outputFiles.blockers }}' (HEADER, DELIMITER ',');

      SELECT
        (SELECT round(sum(net_pay), 2)::DOUBLE FROM statements) AS total_pay,
        (SELECT round(sum(payable), 2)::DOUBLE FROM statements) AS payable,
        (SELECT round(sum(clawback), 2)::DOUBLE FROM statements) AS clawbacks,
        (SELECT round(sum(spif), 2)::DOUBLE FROM statements) AS spifs,
        (SELECT round(sum(cap_cut), 2)::DOUBLE FROM statements) AS capped,
        (SELECT round(sum(guarantee_topup), 2)::DOUBLE FROM statements) AS guarantees,
        (SELECT round(sum(awaiting_cash) + sum(cap_cut), 2)::DOUBLE FROM statements) AS accrual,
        (SELECT string_agg(rep || ' ' || round(100 * attainment) || '%', ', ' ORDER BY attainment DESC) FROM (SELECT * FROM statements WHERE plan = 'AE' ORDER BY attainment DESC LIMIT 3)) AS top_attainment,
        (SELECT max(attainment) FROM statements)::DOUBLE AS max_attainment,
        (SELECT coalesce(min(clawback), 0) FROM statements)::DOUBLE AS largest_clawback,
        (SELECT coalesce(string_agg(rep || ' ' || round(cap_cut), ', '), '') FROM statements WHERE cap_cut > 0) AS cap_detail,
        (SELECT coalesce(string_agg(rep || ' ' || deal || ' ' || round(this_month), ', '), '') FROM movements WHERE status = 'CLAWBACK' AND this_month <> 0) AS clawback_detail,
        (SELECT count(*) FROM movements WHERE status = 'AWAITING_CASH')::INT AS awaiting_deals,
        -- Credited bookings against the ledger: every booking is credited exactly 100% in splits.
        (SELECT round(sum(credit), 2) FROM credited WHERE kind = 'SPLIT')::DOUBLE AS split_credit,
        (SELECT round(sum(booked), 2) FROM ledger l JOIN deals d USING (deal) WHERE d.closed_on BETWEEN getvariable('y_start') AND getvariable('m_end'))::DOUBLE AS ledger_bookings,
        (SELECT json_group_object(rep || '|' || deal, round(paid, 2))::VARCHAR FROM paid_now) AS paid_state,
        (SELECT count(*) FROM blockers)::INT AS blockers,
        (SELECT coalesce(string_agg(code || ' ' || ref || ': ' || detail, '; ' ORDER BY code, ref), '') FROM blockers) AS blocker_detail;

  - id: result
    type: io.kestra.plugin.core.output.OutputValues
    values:
      r: "{{ (outputs.calculate.outputs | last).row | toJson }}"

  - id: log_run
    type: io.kestra.plugin.core.log.Log
    message: |
      Commission run {{ inputs.month }} ({{ inputs.scenario }}).
      {{ outputs.result.values.r | jq('"Pay \(.total_pay): payable on collected deals \(.payable), clawbacks \(.clawbacks), SPIFs \(.spifs), cap cuts \(.capped), guarantees \(.guarantees)."') | first }}
      {{ outputs.result.values.r | jq('"Top attainment: \(.top_attainment). Capped: \(.cap_detail). Clawed back: \(.clawback_detail)."') | first }}
      {{ outputs.result.values.r | jq('"Accrual for earned but unpaid commission: \(.accrual) (\(.awaiting_deals) deal credits awaiting cash, plus cap carry-over). Split credits \(.split_credit) against ledger bookings \(.ledger_bookings)."') | first }}
      {{ outputs.result.values.r | jq('"Blockers: \(.blockers). \(.blocker_detail)"') | first }}

  - id: evidence
    type: io.kestra.plugin.core.namespace.UploadFiles
    namespace: "{{ flow.namespace }}"
    filesMap:
      "{{ render(vars.pack_dir) }}/statements.csv": "{{ outputs.calculate.outputFiles.statements }}"
      "{{ render(vars.pack_dir) }}/deal-credits.csv": "{{ outputs.calculate.outputFiles.deals }}"
      "{{ render(vars.pack_dir) }}/payroll.csv": "{{ outputs.calculate.outputFiles.payroll }}"
      "{{ render(vars.pack_dir) }}/blockers.csv": "{{ outputs.calculate.outputFiles.blockers }}"

  - id: decide
    type: io.kestra.plugin.core.flow.Switch
    value: >-
      {%- set r = outputs.result.values.r -%}
      {%- if (r | jq('.blockers > 0 or (.split_credit - .ledger_bookings) > 0.01 or (.split_credit - .ledger_bookings) < -0.01') | first) -%}BLOCKED
      {%- elseif (r | jq('.capped > 0 or .largest_clawback < -5000 or .max_attainment > 2') | first) and inputs.approved_by == '' -%}NEEDS_APPROVAL
      {%- else -%}PAY{%- endif -%}
    cases:
      PAY:
        - id: lock_month
          type: io.kestra.plugin.core.kv.Set
          description: What has been paid per rep and deal, so true-ups and clawbacks next month start from it.
          key: "{{ vars.lock_key }}"
          kvType: JSON
          value: >-
            {{ {'r': fromJson(outputs.result.values.r), 'm': inputs.month, 'by': inputs.approved_by}
               | jq('{last: .m, approved_by: .by, paid: (.r.paid_state | fromjson), total_pay: .r.total_pay, accrual: .r.accrual}') | first | toJson }}

        - id: log_paid
          type: io.kestra.plugin.core.log.Log
          message: "Commission for {{ inputs.month }} released: {{ outputs.result.values.r | jq('.total_pay') | first }}. Send {{ render(vars.pack_dir) }}/payroll.csv to payroll and accrue {{ outputs.result.values.r | jq('.accrual') | first }}."

      NEEDS_APPROVAL:
        - id: approval_required
          type: io.kestra.plugin.core.execution.Fail
          errorMessage: >-
            Review before payroll: cap cuts {{ outputs.result.values.r | jq('.cap_detail') | first }}; clawbacks {{ outputs.result.values.r | jq('.clawback_detail') | first }};
            top attainment {{ outputs.result.values.r | jq('.top_attainment') | first }}. Read {{ render(vars.pack_dir) }}/statements.csv and run again with approved_by.

    defaults:
      - id: blocked
        type: io.kestra.plugin.core.execution.Fail
        errorMessage: >-
          Commission for {{ inputs.month }} cannot be paid: {{ outputs.result.values.r | jq('.blocker_detail') | first }}
          (split credits {{ outputs.result.values.r | jq('.split_credit') | first }}, ledger bookings {{ outputs.result.values.r | jq('.ledger_bookings') | first }})

extend:
  title: Calculate monthly sales commissions with tiers, cash-collected payout, clawbacks and caps
  metaTitle: Sales commission calculation with accelerators, clawbacks and payroll file in Kestra
  shortDescription: Credit deals to reps, apply tiered rates with accelerators, pay on cash collected, claw back churned deals, apply caps, guarantees and SPIFs, reconcile to the ledger and produce the payroll file.
  metaDescription: Monthly sales commission run in Kestra and DuckDB. Splits, tiered accelerators, pay on cash, clawbacks, caps, guarantees, SPIFs and payroll file.
  description: |
    Commission disputes cost sales teams trust, and errors cost finance money. The rules are simple to state and fiddly to apply:
    - deals are split between reps,
    - rates step up as attainment crosses tiers, and a deal that crosses quota is paid at two rates,
    - commission is paid only once the customer pays,
    - commission on a customer who churns soon after signing is clawed back,
    - monthly caps carry over instead of disappearing, and new hires get a guarantee.

    This flow runs the whole monthly cycle, gives every rep a statement that explains each number, and produces the payroll file.

    It runs with no setup and no network. DuckDB generates a year of 240 closed-won deals and a team of 14:
    - 10 account executives (one hired in July with a six-month guarantee),
    - 3 sales engineers on overlay credit, and a sales manager on overlay credit across the whole team.

    One deal in five is split 60/40 between two AEs. Invoices are paid 15 to 75 days after closing, one in twelve is unpaid, a few customers churn within months, and a September SPIF pays 1,000 per new-logo deal above 50,000.

    This blueprint was created by [zkasuran](https://github.com/zkasuran).

    ## Rules

    | Rule | Implementation |
    |---|---|
    | Credit | Split credits must add up to 100% per deal. Overlay credit (SE, manager) comes on top |
    | Attainment | Year-to-date credit / annual quota, accumulated in closing order |
    | Tiers | Each deal's credit is cut across the tiers it spans, so a deal that crosses quota earns the lower rate below and the accelerated rate above (AE: 5% to 50%, 10% to 100%, 15% to 150%, 20% beyond) |
    | Pay on cash | Commission becomes payable in the month the invoice is paid. Until then it is accrued |
    | Clawback | A deal that churns within `clawback_days` of closing takes back everything paid on it |
    | True-up | Each run pays earned commission less what was already paid per rep and deal, stored in KV, so nothing is paid twice |
    | Cap | A monthly cap per plan. The excess stays earned and is paid in later months as a true-up |
    | Guarantee | New hires are topped up to their guarantee for six months from joining |
    | SPIF | One-off incentives added for the month |

    ## Controls

    - **Blocked:**
      - split credits not equal to 100%,
      - a rep with no plan, or credited before joining,
      - a closed-won deal missing from the ledger or booked at another amount,
      - total split credit not equal to ledger bookings.
    - **Needs approval:** a cap cut, a clawback above 5,000, or a rep above 200% of quota.
    - **Order:** months run once, in order.

    ## How it works

    1. `state` loads the last month paid and what was paid per rep and deal. `order_gate` enforces the order.
    2. `calculate` (`io.kestra.plugin.jdbc.duckdb.Queries`):
       - credits each deal and computes the tiered earnings, payout status and clawbacks;
       - builds each rep's statement, with cap, guarantee and SPIF;
       - writes the payroll file, the per-deal paid amounts for the next run, and the checks.
    3. `log_run` prints the totals and the accrual. `evidence` stores `statements.csv`, `deal-credits.csv` (every credit with its commission, status, paid before and paid now), `payroll.csv` and `blockers.csv`.
    4. `decide` (`io.kestra.plugin.core.flow.Switch`):
       - `PAY`: stores what was paid.
       - Otherwise the run fails with the reason.

    ## Tested end to end

    On Kestra 2.0.3 OSS. January to August were run in sequence, then:

    | Run | Inputs | Result |
    |---|---|---|
    | 1 | 2026-09 | Clawbacks on two churned deals across 6 credits. SPIFs 9,000. Two AEs above the 15,000 cap (8,165 and 10,188 cut). Stops for approval |
    | 2 | same, `approved_by` | Paid 147,251.20. Accrual 363,874.97 (unpaid invoices + cap carry-over) |
    | 3 | 2026-10 `ISSUES` | Blocked: splits adding up to 130%, a rep not on a plan, two deals missing from the ledger |
    | 4 | 2026-10 | September's cap carry-over is paid as a true-up, and a new cap applies. Stops for approval |
    | 5 | 2026-09 again | Refused |

    Earlier months showed the other rules:
    - the March clawback of a deal paid in February;
    - the new hire's guarantee starting only in July;
    - accelerated rates as AEs passed quota in September.

    I recomputed the tiered year-to-date earnings of all 14 reps independently in Python from `deal-credits.csv`, and they matched. Every statement's net pay equals payable + clawback + SPIF - cap + guarantee.

    ## Problems found while testing

    - **A guarantee paid before the hire date.** The new hire's guarantee was applied from January. It now runs for six months from the hire date, and a credit dated before joining blocks the run.
    - **The first run paid eight months at once.** Starting in August caught up January to July, and every cap fired. Commission runs are monthly, so the flow refuses to skip a month, and the demo runs from January.

    ## Inputs

    | Input | Default | Purpose |
    |---|---|---|
    | `month` | `2026-09` | `YYYY-MM`, validated |
    | `scenario` | `CLEAN` | Demo only |
    | `clawback_days` | `180` | Clawback window |
    | `approved_by` | empty | Sales operations or finance |

    ## Use it with your data

    - Replace `plans` and `reps` with your compensation plans and HR file.
    - Replace `deals`, `credits`, `payments`, `churn`, `spifs` and `ledger` with exports from your CRM, billing system and ERP.
    - Send `payroll.csv` to payroll and book the accrual. Share each rep's rows of `deal-credits.csv` with them as their statement detail.

    ## Things to know

    - Quotas reset each calendar year. Ramped quotas for new hires, multi-year deals and renewal rates need extra columns on `plans`.
    - Under IFRS 15 / ASC 340-40, commission on multi-year contracts is capitalised and amortised. Feed `payroll.csv` to that process.
    - Reset by deleting the KV key `commission_runs`.

