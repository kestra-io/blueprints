id: sports-odds-quality-check
namespace: company.team
description: Check returned odds groups before private research. Fictional fixtures run by default; live mode makes
  one own-key ParlayAPI request. This is a quality report, not a full-board or trading guarantee.
inputs:
- id: source
  type: SELECT
  values:
  - fixture
  - live
  defaults: fixture
  description: Fixture makes no API request. Live requires your own PARLAY_API_KEY secret and explicit real bookmaker
    keys.
- id: sport
  type: STRING
  defaults: americanfootball_nfl
  description: Exact API sport key, used as fixture metadata in fixture mode.
- id: bookmakers
  type: ARRAY
  itemType: STRING
  defaults:
  - demo_alpha
  - demo_beta
  description: One to five distinct required bookmaker keys. Replace demo keys before live mode.
- id: markets
  type: ARRAY
  itemType: STRING
  defaults:
  - h2h
  - spreads
  - totals
  description: One or more of h2h, spreads and totals. Other markets are outside this example.
- id: region
  type: SELECT
  values:
  - global
  - us
  - us2
  - uk
  - eu
  - au
  - fr
  - ca
  - br
  - mx
  - latam
  - asia
  defaults: us
  description: One region; choose a region that includes your required books.
- id: max_age_seconds
  type: INT
  defaults: 120
  description: User-chosen maximum age, 1 through 3600 seconds, for the API-reported bookmaker timestamp.
tasks:
- id: check
  type: io.kestra.plugin.scripts.python.Script
  description: Keep raw odds in task memory; write only counts, fixed reason labels, request status and numeric
    credit metadata.
  containerImage: python:3.13-slim
  timeout: PT30S
  env:
    BLUEPRINT_INPUTS: '{{ inputs | toJson }}'
    PARLAY_API_KEY: '{% if inputs.source == ''live'' %}{{ secret(''PARLAY_API_KEY'') }}{% endif %}'
  outputFiles:
  - quality-summary.json
  script: |
    import copy
    import http.client
    import json
    import math
    import os
    import re
    import time
    from collections import Counter, defaultdict
    from datetime import datetime, timezone
    from pathlib import Path
    from urllib.parse import urlencode

    MAX_BYTES = 2 * 1024 * 1024
    MAX_EVENTS = 500
    MAX_OUTCOMES = 20000
    REFERENCE = datetime(2030, 1, 1, 12, tzinfo=timezone.utc).timestamp()


    def number(value):
        return type(value) in (int, float) and math.isfinite(value)


    def timestamp(value):
        if not isinstance(value, str):
            return None
        try:
            parsed = datetime.fromisoformat(value.replace('Z', '+00:00'))
            return parsed.timestamp() if parsed.tzinfo else None
        except ValueError:
            return None


    def settings(raw):
        c = json.loads(raw)
        if c['source'] not in ('fixture', 'live'):
            raise ValueError('source')
        if not re.fullmatch(r'[a-z][a-z0-9_]{0,79}', c['sport']):
            raise ValueError('sport')
        for name in ('bookmakers', 'markets'):
            values = c[name]
            if not isinstance(values, list) or not 1 <= len(values) <= 5:
                raise ValueError('selection')
            if any(not isinstance(v, str) or not re.fullmatch(r'[a-z][a-z0-9_]{0,59}', v) for v in values):
                raise ValueError('selection')
            if len(set(values)) != len(values):
                raise ValueError('duplicate input')
        if not set(c['markets']) <= {'h2h', 'spreads', 'totals'}:
            raise ValueError('markets')
        if type(c['max_age_seconds']) is not int or not 1 <= c['max_age_seconds'] <= 3600:
            raise ValueError('age')
        if c['region'] not in {'global', 'us', 'us2', 'uk', 'eu', 'au', 'fr', 'ca', 'br', 'mx', 'latam', 'asia'}:
            raise ValueError('region')
        if c['source'] == 'live' and any(b.startswith('demo_') for b in c['bookmakers']):
            raise ValueError('replace demo books before live mode')
        return c


    def fixtures(c):
        # Every event, quote and timestamp here is fictional and deterministic.
        markets = {
            'h2h': [{'name': 'Demo Home', 'price': 1.9}, {'name': 'Demo Away', 'price': 2.1}],
            'spreads': [{'name': 'Demo Home', 'point': -3.5, 'price': 1.9}, {'name': 'Demo Away', 'point': 3.5, 'price': 1.9}],
            'totals': [{'name': 'Over', 'point': 42.5, 'price': 1.9}, {'name': 'Under', 'point': 42.5, 'price': 1.9}],
        }
        base = {'id': 'fictional-clean', 'sport_key': c['sport'], 'home_team': 'Demo Home', 'away_team': 'Demo Away',
                'commence_time': '2030-01-01T18:00:00Z', 'bookmakers': [
                    {'key': b, 'last_update_ms': int(REFERENCE * 1000),
                     'markets': [{'key': m, 'outcomes': copy.deepcopy(markets[m])} for m in c['markets']]}
                    for b in c['bookmakers']]}
        rows = []
        for case in ('clean', 'missing', 'duplicate', 'stale', 'unknown'):
            event = copy.deepcopy(base)
            event['id'] = 'fictional-' + case
            if case == 'missing':
                event['bookmakers'].pop()
            if case == 'duplicate':
                for market in event['bookmakers'][0]['markets']:
                    market['outcomes'].append(copy.deepcopy(market['outcomes'][0]))
            if case == 'stale':
                event['bookmakers'][0]['last_update_ms'] -= (c['max_age_seconds'] + 1) * 1000
            if case == 'unknown':
                event['bookmakers'][0].pop('last_update_ms')
            rows.append(event)
        return rows


    def fetch(c, key):
        if not isinstance(key, str) or not 1 <= len(key) <= 512 or any(ord(ch) < 33 or ord(ch) > 126 for ch in key):
            raise ValueError('key')
        query = urlencode({'regions': c['region'], 'bookmakers': ','.join(c['bookmakers']),
                           'markets': ','.join(c['markets']), 'oddsFormat': 'decimal', 'dateFormat': 'iso'})
        path = '/v1/sports/' + c['sport'] + '/odds?' + query
        conn = http.client.HTTPSConnection('parlay-api.com', timeout=15)
        response = None
        deadline = time.monotonic() + 15
        try:
            # One request, fixed HTTPS host, no proxy, redirect handling or retries.
            conn.request('GET', path, headers={'X-API-Key': key, 'Accept': 'application/json', 'Accept-Encoding': 'identity'})
            response = conn.getresponse()
            meta = {'http_status': response.status, 'requests_last': None, 'retry_after_seconds': None}
            for header, field, maximum in [('x-requests-last', 'requests_last', 1000000), ('retry-after', 'retry_after_seconds', 86400)]:
                value = response.getheader(header, '')
                if isinstance(value, str) and value.isascii() and value.isdecimal() and len(value) <= 9 and int(value) <= maximum:
                    meta[field] = int(value)
            if response.status != 200:
                return None, meta  # Includes 3xx, 401, 403 and 429; never follow/retry.
            if response.getheader('content-encoding', 'identity').lower() != 'identity':
                raise ValueError('encoding')
            if response.getheader('content-type', '').split(';')[0].strip().lower() != 'application/json':
                raise ValueError('content type')
            raw = bytearray()
            while True:
                remaining = deadline - time.monotonic()
                if remaining <= 0:
                    raise TimeoutError('deadline')
                if conn.sock is not None:
                    conn.sock.settimeout(remaining)
                chunk = response.read1(min(65536, MAX_BYTES + 1 - len(raw)))
                if not chunk:
                    break
                raw.extend(chunk)
                if len(raw) > MAX_BYTES:
                    raise ValueError('size')
            return json.loads(raw), meta
        finally:
            try:
                if response is not None:
                    response.close()
            finally:
                conn.close()


    def analyze(rows, c, reference):
        if not isinstance(rows, list) or len(rows) > MAX_EVENTS:
            raise ValueError('event shape/limit')
        reasons = Counter()
        groups = {}
        seen_ids = Counter(e.get('id') for e in rows if isinstance(e, dict) and isinstance(e.get('id'), str))
        invalid_events = 0
        outcome_count = 0
        for event in rows:
            if not isinstance(event, dict):
                raise ValueError('event shape')
            identity = [event.get(k) for k in ('id', 'sport_key', 'home_team', 'away_team')]
            if (any(not isinstance(v, str) or not v.strip() for v in identity)
                    or event['sport_key'] != c['sport'] or identity[2] == identity[3]
                    or timestamp(event.get('commence_time')) is None or seen_ids[identity[0]] != 1):
                invalid_events += 1
                continue
            home, away = identity[2:]
            present_markets = set()
            seen_books = set()
            if not isinstance(event.get('bookmakers'), list):
                raise ValueError('book shape')
            for book in event['bookmakers']:
                if not isinstance(book, dict) or not isinstance(book.get('key'), str):
                    raise ValueError('book shape')
                if book['key'] not in c['bookmakers']:
                    continue
                if book['key'] in seen_books:
                    raise ValueError('duplicate bookmaker block')
                seen_books.add(book['key'])
                clock = book.get('last_update_ms')
                age = reference - clock / 1000 if number(clock) else None
                book_errors = set()
                if age is None:
                    book_errors.add('unknown_timestamp')
                elif age < 0:
                    book_errors.add('future_timestamp')
                elif age > c['max_age_seconds']:
                    book_errors.add('stale_timestamp')
                if book.get('topped_up') is True:
                    book_errors.add('topped_up')
                if not isinstance(book.get('markets'), list):
                    raise ValueError('market shape')
                seen_markets = set()
                for market in book['markets']:
                    if not isinstance(market, dict) or not isinstance(market.get('key'), str):
                        raise ValueError('market shape')
                    kind = market['key']
                    if kind not in c['markets']:
                        continue
                    if kind in seen_markets:
                        raise ValueError('duplicate market block')
                    seen_markets.add(kind)
                    if not isinstance(market.get('outcomes'), list):
                        raise ValueError('outcome shape')
                    for outcome in market['outcomes']:
                        outcome_count += 1
                        if outcome_count > MAX_OUTCOMES or not isinstance(outcome, dict):
                            raise ValueError('outcome shape/limit')
                        name, point = outcome.get('name'), outcome.get('point')
                        allowed = {'Over', 'Under'} if kind == 'totals' else {home, away} | ({'Draw'} if kind == 'h2h' else set())
                        bad = name not in allowed
                        if kind == 'h2h':
                            line = None
                            bad |= point is not None
                        else:
                            bad |= not number(point)
                            line = point if number(point) else None
                            if kind == 'spreads' and name == away and line is not None:
                                line = -line  # Same home handicap, never abs(point).
                        key = (event['id'], event['sport_key'], event['commence_time'], kind, line)
                        group = groups.setdefault(key, {'books': defaultdict(dict), 'errors': set(), 'expected': allowed - {'Draw'}})
                        group['errors'].update(book_errors)
                        if bad:
                            group['errors'].add('invalid_selection')
                            continue
                        present_markets.add(kind)
                        group['expected'].add(name)  # Observed Draw must exist at every required book.
                        price = outcome.get('price')
                        if not number(price) or price <= 1:
                            group['errors'].add('missing_or_invalid_price')
                        if name in group['books'][book['key']]:
                            group['errors'].add('duplicate_selection')
                        group['books'][book['key']][name] = price
            for missing in set(c['markets']) - present_markets:
                groups.setdefault((event['id'], event['sport_key'], event['commence_time'], missing, None),
                                  {'books': {}, 'errors': {'missing_market'}, 'expected': set()})
        accepted = 0
        for group in groups.values():
            errors = group['errors']
            if set(group['books']) != set(c['bookmakers']):
                errors.add('missing_bookmaker')
            if any(set(selections) != group['expected'] for selections in group['books'].values()):
                errors.add('missing_selection')
            reasons.update(errors)
            accepted += not errors
        return {'events_seen': len(rows), 'invalid_identity_events': invalid_events, 'groups_seen': len(groups),
                'accepted_groups': accepted, 'rejected_groups': len(groups) - accepted,
                'reason_group_counts': dict(sorted(reasons.items())), 'board_completeness': 'unknown',
                'scope': 'required books and selections within returned event/market/line groups only'}


    def main():
        try:
            c = settings(os.environ['BLUEPRINT_INPUTS'])
            if c['source'] == 'fixture':
                rows, meta, reference = fixtures(c), {'http_status': None, 'requests_last': None}, REFERENCE
            else:
                rows, meta = fetch(c, os.environ.get('PARLAY_API_KEY', ''))
                reference = time.time()
            if rows is None:
                summary = {'status': 'request_stopped', 'source': c['source'], **meta}
            else:
                summary = {'status': 'analyzed', 'source': c['source'], **meta, **analyze(rows, c, reference),
                           'age_reference_utc': datetime.fromtimestamp(reference, timezone.utc).isoformat(),
                           'retrieved_at_utc': datetime.now(timezone.utc).isoformat() if c['source'] == 'live' else None}
            Path('quality-summary.json').write_text(json.dumps(summary, sort_keys=True))
        except Exception:
            # Never emit response data, input values, URLs, keys or exception text.
            print('Quality check stopped: invalid input, response, or network limit.', flush=True)
            raise SystemExit(1) from None


    if __name__ == '__main__':
        main()
- id: summary
  type: io.kestra.plugin.core.log.Log
  description: Log the small quality report; it contains no raw prices, fixture identifiers or credentials.
  message: '{{ read(outputs.check.outputFiles[''quality-summary.json'']) }}'
extend:
  title: Check sports odds identity, coverage and timestamp quality before private research
  metaDescription: Run fictional odds quality checks, then optionally inspect one private ParlayAPI response with
    your own key. Report gaps without claiming complete coverage.
  description: |
    Decide whether returned odds groups meet a research pipeline's requirements. This flow demonstrates quality checks on fictional data before offering an explicit, single-request ParlayAPI mode. It reports missing data rather than repairing or inventing quotes.

    ## How it works

    1. The Python task uses five deterministic fictional cases: clean, missing book, duplicate selection, stale timestamp and unknown timestamp. Fixture mode makes no API request and needs no secret. Every fixture price and event is invented for this example.
    2. The same validator checks live responses when you explicitly choose `source: live`. It groups by the returned event ID, sport, start time, market and exact line. A spread uses the home team's signed handicap, so home -3.5 cannot be combined with home +3.5. Totals at different points stay separate.
    3. Required books must provide matching selections with finite decimal prices above 1. Both teams are required for moneyline/spread; Over and Under are required for totals. An observed Draw must appear at all required books. This example does not infer which competitions require a draw outcome.
    4. `last_update_ms` is the API-reported bookmaker-block clock. Missing clocks are unknown; future or over-age clocks are rejected. Topped-up blocks are flagged. Retrieval time never replaces the reported clock. This does not measure latency from the bookmaker's own origin.
    5. A second task logs a compact summary. Raw quotes remain in memory and are not deliberately written to output files or logs. Request stops, including 429, produce `status: request_stopped`, distinct from an analyzed response.

    ## Prerequisites and secrets

    - A Kestra instance with the Python Script plugin and a worker able to run `python:3.13-slim`. The first container-image pull needs registry access; fixture processing itself uses no network. The script uses only Python's standard library, with no pip installation.
    - For optional live mode only, a ParlayAPI account with an API key authorized for the request. Set the Kestra secret `PARLAY_API_KEY` to that key. The secret expression is conditional and is not evaluated in fixture mode. Do not paste a key into flow inputs, the URL or the YAML.
    - Live mode needs HTTPS access to `parlay-api.com`. It can consume account credits, including for empty responses. See current account limits and API documentation before running.
    - Restrict flow editing, worker access, execution logs and internal storage to authorized users. A secret reaches the private task environment in live mode. This blueprint grants no feed redistribution rights; keep account data and research private.

    ## Inputs

    - `source` (SELECT, default `fixture`): `fixture` or `live`; live is always opt-in.
    - `sport` (STRING, default `americanfootball_nfl`): exact API sport key. In fixture mode this only labels fictional data.
    - `bookmakers` (ARRAY of STRING, default `demo_alpha`, `demo_beta`): one to five unique required keys. For live mode, replace these fictional keys with the real books your account needs. A missing book is a finding, not a claim that it is available.
    - `markets` (ARRAY of STRING, default `h2h`, `spreads`, `totals`): one or more of these exact game-market keys. Props, period markets and outright markets are outside this example.
    - `region` (SELECT, default `us`): one documented region. The selected region must include the requested books; check the current region catalog.
    - `max_age_seconds` (INT, default 120): 1 to 3600. This is a chosen research threshold, not a provider freshness promise. The fixture reference time is fixed at 2030-01-01T12:00:00Z so the demo does not decay with wall time.

    ## Quick start

    1. Import this flow into `company.team` and run with defaults. No account or key is required for the fictional cases.
    2. Open `outputs.check.outputFiles['quality-summary.json']` or the `summary` task log. With defaults, expect 5 fictional events, 15 groups, 3 accepted and 12 rejected groups. Rejection reasons can overlap and their counts need not sum to rejected groups.
    3. If you want to inspect an authorized response, configure the secret, change the source to `live`, and replace the demo books with exact current bookmaker keys. Choose the appropriate sport and region. Run manually once. There is no enabled schedule, automatic retry or redirect following.

    ## Outputs and limits

    The downloadable summary at `{{ outputs.check.outputFiles['quality-summary.json'] }}` includes counts, fixed reason labels, the age reference, retrieval time in live mode, HTTP status and numeric `x-requests-last` when reported. A missing charge header stays null. Numeric Retry-After is reported for stopped requests; HTTP-date Retry-After is left null. Either form causes no retry.

    The live request uses a fixed HTTPS origin and the `X-API-Key` header, requests decimal odds and ISO dates, and refuses compressed responses. It accepts at most 2 MiB of JSON, 500 events and 20,000 examined outcomes. An over-limit or malformed response fails the task without echoing the response or exception. It uses 15-second socket timeouts and a 15-second body-read deadline, with a 30-second Kestra task timeout as the outer bound. DNS resolution and task cancellation depend on the worker/runtime; this is not a hard wire-byte or end-to-end service guarantee.

    `accepted_groups` only means that the required books and selections in a returned event/market/line group passed these checks. An empty result remains empty. The summary always says `board_completeness: unknown`: entirely absent events or lines cannot be discovered from one response. Duplicate event IDs or missing kickoff identity are rejected instead of merged, and missing prices remain missing. Repeated requested bookmaker or market blocks stop the task, so disjoint duplicate blocks cannot silently combine into a passing group. The report does not place bets, calculate profit, publish raw odds, or prove complete board coverage or sustained stream continuity.

    ## Links

    - Python script tasks: https://kestra.io/docs/how-to-guides/python
    - Input/output files: https://kestra.io/docs/scripts/input-output-files
    - Kestra secrets: https://kestra.io/docs/concepts/secrets
    - API authentication, parameters, response clocks and credits: https://parlay-api.com/docs
    - Optional Python client: https://github.com/JacobiusMakes/parlay-api-python
  tags:
  - Data
  - Core
  ee: false
  demo: false
