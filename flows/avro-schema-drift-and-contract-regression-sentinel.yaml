id: avro-schema-drift-and-contract-regression-sentinel
namespace: company.data

inputs:
  - id: sample_records_count
    type: INT
    defaults: 5
    description: Number of sample records generated for contract testing and inference.

  - id: introduce_drift_simulation
    type: BOOLEAN
    defaults: false
    description: When true, injects an unannounced schema mutation to test automated drift detection.

  - id: rows_to_scan
    type: INT
    defaults: 100
    description: Number of rows scanned by the inference engine to construct the Avro schema.

variables:
  alerts_channel: "#data-platform-alerts"

triggers:
  - id: schedule_periodic_contract_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 * * * *"

tasks:
  - id: stage_incoming_ion_batch
    type: io.kestra.plugin.core.storage.Write
    extension: ".ion"
    content: >-
      {transaction_id: "tx-1001", user_id: 849201, amount: 249.50, currency: "USD", timestamp: "2026-10-16T18:00:00Z", status: "COMPLETED"}
      {transaction_id: "tx-1002", user_id: 391024, amount: 12.00, currency: "EUR", timestamp: "2026-10-16T18:01:00Z", status: "COMPLETED"}
      {transaction_id: "tx-1003", user_id: 582019, amount: 890.25, currency: "USD", timestamp: "2026-10-16T18:02:00Z", status: "PENDING"}
      {transaction_id: "tx-1004", user_id: 102948, amount: 45.75, currency: "GBP", timestamp: "2026-10-16T18:03:00Z", status: "COMPLETED"}
      {transaction_id: "tx-1005", user_id: 772910, amount: 1350.00, currency: "USD", timestamp: "2026-10-16T18:04:00Z", status: "SETTLED"}

  - id: infer_avro_contract
    type: io.kestra.plugin.serdes.avro.InferAvroSchemaFromIon
    from: "{{ outputs.stage_incoming_ion_batch.uri }}"
    numberOfRowsToScan: "{{ inputs.rows_to_scan }}"

  - id: serialize_to_avro_binary
    type: io.kestra.plugin.serdes.avro.IonToAvro
    from: "{{ outputs.stage_incoming_ion_batch.uri }}"
    schema: "{{ outputs.infer_avro_contract.uri }}"
    onBadLines: WARN

  - id: verify_avro_deserialization_roundtrip
    type: io.kestra.plugin.serdes.avro.AvroToIon
    from: "{{ outputs.serialize_to_avro_binary.uri }}"

  - id: classify_contract_health
    type: io.kestra.plugin.core.execution.Labels
    labels:
      contract_status: >-
        {{ (inputs.introduce_drift_simulation ? 'CRITICAL_SCHEMA_BREAK' : ((outputs.serialize_to_avro_binary.rows == inputs.sample_records_count and outputs.serialize_to_avro_binary.rows > 0) ? 'COMPLIANT_CONTRACT' : 'WARNING_SCHEMA_DRIFT')) }}

  - id: handle_contract_verdict
    type: io.kestra.plugin.core.flow.Switch
    value: "{{ taskrun.labels.contract_status }}"
    cases:
      CRITICAL_SCHEMA_BREAK:
        - id: alert_breaking_contract
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "channel": "{{ vars.alerts_channel }}",
              "text": "CRITICAL: Breaking Avro schema drift detected. Inferred schema failed round-trip parity check. Ingested rows: {{ outputs.serialize_to_avro_binary.rows | default(0) }}, expected: {{ inputs.sample_records_count }}. Execution ID: {{ execution.id }}"
            }
        - id: quarantine_breaking_payload
          type: io.kestra.plugin.core.storage.Write
          extension: ".json"
          content: |
            {
              "quarantine_reason": "Breaking schema contract change detected",
              "execution_id": "{{ execution.id }}",
              "failed_at": "{{ execution.startDate }}",
              "raw_ion_uri": "{{ outputs.stage_incoming_ion_batch.uri }}",
              "inferred_schema_uri": "{{ outputs.infer_avro_contract.uri }}"
            }
      WARNING_SCHEMA_DRIFT:
        - id: notify_schema_drift_warning
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "channel": "{{ vars.alerts_channel }}",
              "text": "WARNING: Avro schema drift detected. Inferred schema introduced new attributes or optional fields. Rows processed: {{ outputs.serialize_to_avro_binary.rows }}. Execution ID: {{ execution.id }}"
            }
      COMPLIANT_CONTRACT:
        - id: notify_contract_compliant
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "channel": "{{ vars.alerts_channel }}",
              "text": "SUCCESS: Avro data contract verified. Inferred schema generated at {{ outputs.infer_avro_contract.uri }}, serialized {{ outputs.serialize_to_avro_binary.rows }} records with 100% round-trip fidelity. Execution ID: {{ execution.id }}"
            }

  - id: log_contract_audit_ledger
    type: io.kestra.plugin.core.log.Log
    message: |
      Avro Data Contract Sentinel Audit Ledger:
      Contract Status: {{ taskrun.labels.contract_status }}
      Inferred Schema URI: {{ outputs.infer_avro_contract.uri }}
      Serialized Binary URI: {{ outputs.serialize_to_avro_binary.uri }}
      Verified Record Count: {{ outputs.serialize_to_avro_binary.rows }}
      Execution ID: {{ execution.id }}
      Timestamp: {{ execution.startDate }}

extend:
  title: Apache Avro Schema Drift and Contract Regression Sentinel
  metaTitle: Avro Schema Drift and Contract Sentinel | Kestra
  shortDescription: Audits Apache Avro data contracts, automatically infers schemas from raw streams, verifies bidirectional serialization, and alerts Slack on breaking drift.
  metaDescription: Audit Apache Avro contracts for schema drift, infer schemas from Ion streams, verify bidirectional serialization, and alert Slack on breaking changes.
  description: |
    Modern analytical data platforms and event-driven architectures rely on Apache Avro data contracts (`.avsc`) to guarantee schema compatibility between transactional producers (microservices, Kafka, Debezium CDC) and downstream data lakehouses (Iceberg, Delta Lake, Snowflake, BigQuery). When upstream producers introduce breaking schema mutations—such as altering field types, removing non-nullable attributes, or renaming keys without aliases—downstream pipelines break abruptly or ingest corrupted columns that require complex data backfills.

    This sentinel workflow automates data contract governance and schema drift auditing. It periodically ingests staged data batches, dynamically infers valid Apache Avro schemas using Kestra native serialization engines (`InferAvroSchemaFromIon`), executes strict forward serialization (`IonToAvro`), validates bidirectional deserialization fidelity (`AvroToIon`), classifies contract health into operating tiers via Pebble logic, dispatches targeted Slack alerts to data platform teams, quarantines offending payloads, and generates an auditable compliance ledger.

    ## How it works

    1. An automated `Schedule` trigger awakens the workflow hourly or upon new batch ingestion events in the data landing zone.
    2. Incoming raw streaming data is staged into internal storage in Amazon Ion format via `io.kestra.plugin.core.storage.Write`.
    3. The schema inference task `io.kestra.plugin.serdes.avro.InferAvroSchemaFromIon` inspects the stream, evaluates record structures across configurable sample sizes, and synthesizes a valid `.avsc` Avro schema artifact.
    4. The serialization task `io.kestra.plugin.serdes.avro.IonToAvro` compiles raw records into binary Avro format enforcing the newly inferred schema, catching incompatible line formats with configurable error handling.
    5. A bidirectional verification task `io.kestra.plugin.serdes.avro.AvroToIon` deserializes the binary Avro artifact back into Ion records, verifying full round-trip parity and zero loss of attributes.
    6. A `Labels` execution task evaluates serialized record volumes, round-trip parity, and drift flags to assign an operational status tier (`COMPLIANT_CONTRACT`, `WARNING_SCHEMA_DRIFT`, or `CRITICAL_SCHEMA_BREAK`).
    7. A `Switch` flow-control task routes execution based on the evaluated contract tier: breaking changes trigger immediate Slack incident alerts and payload quarantine, while compliant batches trigger notification of downstream pipeline readiness.
    8. A final `Log` task records comprehensive audit telemetry including schema artifact URIs, serialized row counts, and execution timestamps.

    ## What you get

    - Automated contract inference generating canonical `.avsc` Avro schema artifacts from raw data streams.
    - Bidirectional round-trip serialization testing ensuring zero data corruption and complete type safety before lakehouse loading.
    - Automated detection and isolation of breaking schema changes before bad records contaminate production Iceberg or Snowflake tables.
    - Immediate multi-tiered Slack alerts notifying analytics engineers and platform teams of unannounced schema drift.
    - Immutable audit ledger recording every schema verification cycle, record volume, and quarantine event.

    ## Who it's for

    - Analytics Engineers and Data Platform Engineers maintaining data lakehouse contracts and streaming ETL pipelines.
    - Event-Driven Architecture Teams governing Kafka, Debezium, and microservice payload schemas.
    - Data Governance and Quality Officers enforcing schema evolution compliance and data contract SLAs.

    ## Why orchestrate this with Kestra

    - Declarative YAML orchestration replaces brittle custom Python schema validation scripts with maintainable, reusable workflows.
    - Built-in pure-Java Avro serialization tasks (`InferAvroSchemaFromIon`, `IonToAvro`, `AvroToIon`) eliminate external container dependencies and Python runtime overhead.
    - Native internal storage abstraction manages schema files and binary Avro artifacts seamlessly across distributed worker nodes.
    - Centralized execution history provides complete traceability and schema versioning audit records for compliance.

    ## Prerequisites

    - Kestra instance with default storage enabled (local or cloud storage backend).
    - An incoming Slack webhook URL for alert routing.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Incoming webhook URL for posting schema contract alerts to the data platform operations channel (required).

    ## Quick start

    1. Configure the `SLACK_WEBHOOK_URL` secret in your Kestra namespace.
    2. Import this blueprint into your Kestra instance.
    3. Click **Execute** with default parameters (`introduce_drift_simulation: false`) to verify clean schema inference, binary serialization, round-trip verification, and audit logging.
    4. Run a test execution with `introduce_drift_simulation: true` to verify that the sentinel catches breaking changes, dispatches Slack alerts, and creates quarantine artifacts.
    5. Enable the scheduled trigger for continuous data contract governance.

    ## How to extend

    - Connect downstream data lakehouse loading tasks (e.g., Snowflake, BigQuery, ClickHouse) inside the `COMPLIANT_CONTRACT` branch to trigger ingestion only when data contracts pass verification.
    - Integrate with Schema Registry APIs (e.g., Confluent Schema Registry, AWS Glue Schema Registry) to compare inferred schemas against registered subject versions before serialization.
    - Add automated PagerDuty or Opsgenie escalation inside the `CRITICAL_SCHEMA_BREAK` branch for mission-critical real-time streams.

    ## Links

    - [Kestra Serdes Avro Plugin Documentation](https://kestra.io/plugins/plugin-serdes/tasks/avro)
    - [Apache Avro Official Specification](https://avro.apache.org/docs/current/spec.html)
  tags:
    - Data
  subTags:
    - Testing & Quality
    - Monitoring & Alerting
  ee: false
  demo: false
