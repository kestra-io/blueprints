id: pip-licenses-dependency-copyleft-compliance-gate
namespace: company.data

description: |
  Install a Python project's dependencies in a disposable container,
  scan every installed package's declared license with pip-licenses,
  and fail the execution outright when a strong-copyleft license
  (GPL/AGPL/LGPL family, SSPL, CC-BY-NC) is present, since bundling
  one into proprietary distributed software is a real legal exposure,
  while a package with no detectable license only pages Slack for a
  human to actually read its source and confirm. A dependency set that
  fails to even install is its own distinct failure mode, not silently
  reported as zero risky licenses.

inputs:
  - id: requirements_file
    type: FILE
    displayName: "requirements.txt File"
    description: "The Python requirements.txt whose dependency tree should be scanned for license compliance. Used when this flow is run manually or chained as a Subflow; ignored when the webhook trigger fires, which supplies the file instead."

triggers:
  - id: scan_on_pr_webhook
    type: io.kestra.plugin.core.trigger.Webhook
    description: "Lets a CI pipeline POST a pull request's requirements.txt directly to this flow as part of a dependency review check. fetchType: STORE streams the POST body into Kestra's internal storage and exposes it as the safe trigger.uri reference, rather than as raw trigger.body text, which the Webhook trigger's own documentation warns is untrusted input unsafe to interpolate into a script task's commands."
    key: "{{ secret('LICENSE_SCAN_WEBHOOK_KEY') }}"
    fetchType: STORE
    disabled: true

tasks:
  - id: scan_dependency_licenses
    type: io.kestra.plugin.scripts.shell.Commands
    description: |
      Installs the project's dependencies from requirements_file into a disposable container, then runs
      pip-licenses to report every installed package's declared license as JSON. If the install step itself
      fails (a yanked package, a version conflict, a typo), the task fails before report.json is ever
      written, which the classify step below treats as its own UNREACHABLE outcome, distinct from the
      install succeeding with zero risky licenses found.
    containerImage: python:3.12-slim
    commands:
      - "pip install --quiet --no-cache-dir -r {{ trigger.uri is defined ? trigger.uri : inputs.requirements_file }}"
      - "pip install --quiet --no-cache-dir pip-licenses"
      - "pip-licenses --format=json > report.json"
    outputFiles:
      - "report.json"
    allowFailure: true

  - id: classify_license_compliance
    type: io.kestra.plugin.core.debug.Return
    description: "Classify UNREACHABLE when report.json was never produced (the dependency install itself failed), BLOCK when at least one installed package's License field matches a strong-copyleft or non-commercial-restrictive pattern (GPL/AGPL/LGPL family, SSPL, CC-BY-NC), WARN when none are copyleft but at least one package reports pip-licenses' own UNKNOWN marker for an undetectable license, otherwise PASS."
    format: "{{ outputs.scan_dependency_licenses.outputFiles['report.json'] is defined ? (((read(outputs.scan_dependency_licenses.outputFiles['report.json']) | jq('[.[] | select(.License | test(\"GPL|SSPL|CC-BY-NC\"; \"i\"))] | length') | first | default(0)) > 0) ? 'BLOCK' : (((read(outputs.scan_dependency_licenses.outputFiles['report.json']) | jq('[.[] | select(.License == \"UNKNOWN\")] | length') | first | default(0)) > 0) ? 'WARN' : 'PASS')) : 'UNREACHABLE' }}"

  - id: route_by_license_compliance
    type: io.kestra.plugin.core.flow.Switch
    description: "PASS logs a quiet confirmation. WARN pages Slack with the packages whose license pip-licenses could not determine, but lets the execution succeed, since an undetectable license needs a human to actually read the source, not an automatic block. BLOCK pages Slack with the specific copyleft packages and licenses and then runs fail_gate to deliberately fail the execution, so a parent pipeline chaining this flow as a Subflow dependency gate is actually stopped. UNREACHABLE pages Slack separately."
    value: "{{ outputs.classify_license_compliance.value }}"
    cases:
      "PASS":
        - id: log_pass
          type: io.kestra.plugin.core.log.Log
          message: "No copyleft or unknown-license dependencies found in requirements_file."
      "WARN":
        - id: alert_warn
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "text": "License gate WARN: no copyleft licenses found, but pip-licenses could not determine a license for: {{ read(outputs.scan_dependency_licenses.outputFiles['report.json']) | jq('[.[] | select(.License == "UNKNOWN") | .Name] | unique | join(", ")') | first }}. A human should read the package source before trusting it. Execution {{ execution.id }}."
            }
      "BLOCK":
        - id: alert_block
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "text": "License gate BLOCK: copyleft or restrictive-license dependencies found: {{ read(outputs.scan_dependency_licenses.outputFiles['report.json']) | jq('[.[] | select(.License | test("GPL|SSPL|CC-BY-NC"; "i")) | .Name + " (" + .License + ")"] | join("; ")') | first }}. Bundling these into proprietary distributed software is a real legal exposure. Execution {{ execution.id }}."
            }
        - id: fail_gate
          type: io.kestra.plugin.core.execution.Fail
          description: "Deliberately fails the execution so a parent pipeline that chains this flow as a Subflow dependency gate is actually blocked, not just notified."
          errorMessage: "Dependency license gate blocked: copyleft or restrictive-license package(s) found ({{ read(outputs.scan_dependency_licenses.outputFiles['report.json']) | jq('[.[] | select(.License | test(\"GPL|SSPL|CC-BY-NC\"; \"i\")) | .Name] | unique | join(\", \")') | first }}). Get explicit legal sign-off or remove the dependency before reapplying."
      "UNREACHABLE":
        - id: alert_unreachable
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "text": "License gate UNREACHABLE: scan_dependency_licenses produced no report.json, most likely because pip install itself failed on requirements_file (a yanked package, a version conflict, or a typo). Check its task log. Execution {{ execution.id }}."
            }
    defaults:
      - id: log_unclassified
        type: io.kestra.plugin.core.log.Log
        message: "Completed dependency license compliance check with status: {{ outputs.classify_license_compliance.value }}"

  - id: log_audit_status
    type: io.kestra.plugin.core.log.Log
    description: "Post-check status line recorded whenever the execution completes without the BLOCK path failing it outright, for a continuous license-compliance trend in the execution history."
    message: "License gate audit: status={{ outputs.classify_license_compliance.value }}, execution={{ execution.id }}."

errors:
  - id: alert_flow_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: "Fires both when the flow itself breaks unexpectedly and, by design, whenever fail_gate deliberately fails a BLOCK execution. A chained parent pipeline sees this flow's execution as FAILED either way."
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "pip-licenses dependency copyleft compliance gate flow {{ flow.id }} FAILED (execution {{ execution.id }}). If this was a BLOCK classification, that is expected; check the execution log for the specific packages. If it was not, check scan_dependency_licenses' task log for an install or container problem."
      }

outputs:
  - id: status
    type: STRING
    value: "{{ outputs.classify_license_compliance.value }}"

extend:
  title: "pip-licenses Dependency Copyleft Compliance Gate"
  metaTitle: pip-licenses Dependency Copyleft Compliance Gate for Kestra
  shortDescription: Install a Python project's dependencies, scan their declared licenses with pip-licenses, and block on copyleft or restrictive licenses while only warning on undetectable ones.
  metaDescription: Block Python dependencies with copyleft licenses while only warning on undetectable licenses.
  description: |
    A license gate that treats "copyleft" and "we could not determine the license" the same way either blocks on things nobody needs to block on, or quietly lets a real legal exposure through. This blueprint installs a Python project's dependencies in a disposable container, scans every installed package's declared license with pip-licenses, and fails the execution outright only when a strong-copyleft or non-commercial-restrictive license is found, while a package pip-licenses could not classify at all only pages Slack for a human to actually read its source, and a dependency set that fails to even install is reported as its own distinct outcome rather than silently passing with zero findings.

    ## How it works

    1. `scan_on_pr_webhook` (`io.kestra.plugin.core.trigger.Webhook`) lets a CI pipeline POST a pull request's `requirements.txt` to this flow directly. `fetchType: STORE` streams that POST body into Kestra's internal storage and exposes it as `trigger.uri`, a safe file reference, rather than as raw `trigger.body` text, which the trigger's own documentation flags as untrusted input unsafe to interpolate into a script task's `commands`. Running this flow manually or as a `Subflow` instead uses the `requirements_file` input, the same kind of safe file reference.
    2. `scan_dependency_licenses` (`io.kestra.plugin.scripts.shell.Commands`) runs `pip install` against that file inside a disposable `python:3.12-slim` container, then `pip-licenses --format=json` to report every installed package's `Name`, `License`, `Version`, `Author`, and `URL`. If the install itself fails, the task fails before `report.json` is ever written, and `allowFailure: true` lets the flow continue to classification instead of aborting the whole execution right there.
    3. `classify_license_compliance` (`io.kestra.plugin.core.debug.Return`) checks whether `report.json` was produced; if not, `UNREACHABLE`. Otherwise it uses `jq` to test every package's `License` field against a copyleft/restrictive pattern (`GPL`, `SSPL`, `CC-BY-NC`, case-insensitive, which catches the GPL/AGPL/LGPL family regardless of exact version wording) for `BLOCK`, then checks for pip-licenses' own `UNKNOWN` marker for `WARN`, otherwise `PASS`.
    4. `route_by_license_compliance` (`io.kestra.plugin.core.flow.Switch`) branches on that string: `PASS` logs a quiet confirmation, `WARN` pages Slack with the specific undetermined packages but lets the execution succeed, `BLOCK` pages Slack with the specific copyleft packages and licenses and then runs `fail_gate` (`io.kestra.plugin.core.execution.Fail`) to deliberately fail the execution, and `UNREACHABLE` pages Slack separately.
    5. `log_audit_status` records a status line whenever the execution reaches it, i.e. every outcome except `BLOCK`, which fails before reaching this task by design.
    6. The `errors` block fires both for a genuine flow break and, intentionally, every time `fail_gate` fires — a chained parent pipeline sees either case as the same FAILED execution and stops.

    ## What you get

    - A license gate that distinguishes "a real legal exposure if this ships" from "unknown, needs a human to actually look," instead of treating every non-trivially-licensed package the same way.
    - A separate, correctly identified failure mode for a dependency set that does not even install, instead of that case being silently misreported as zero risky licenses found.
    - A hard stop: `fail_gate` makes the execution itself FAILED on a copyleft finding, so a parent flow using this as a `Subflow` task before a build or release step is actually blocked, not just notified into a channel someone might not read before merging.
    - A `status` output (`PASS` / `WARN` / `BLOCK` / `UNREACHABLE`) you can also read directly if you prefer branching in the caller instead of relying on failure propagation.

    ## Who it's for

    - Platform and legal/compliance-adjacent engineering teams at companies that distribute proprietary software and need to keep strong-copyleft code out of it without manually reading every transitive dependency's license.
    - Teams who have tried a naive "any non-MIT/Apache license, fail" gate and abandoned it because it blocked on permissively-licensed packages pip-licenses just could not auto-classify.

    ## Why orchestrate this with Kestra

    `pip-licenses` produces the facts; nothing in the CLI itself enforces a policy or blocks a build pipeline on your terms. Kestra turns that output into an actual pass/fail decision with a real execution-history trail of exactly which package and license triggered a block versus a warning, and `Fail` gives a parent pipeline a real signal to stop on instead of a Slack message it has to notice in time.

    ## Prerequisites

    - Docker available to the Kestra worker and outbound network access to PyPI, to install the project's actual dependencies — no account or license server is required.
    - A `requirements.txt` to scan.
    - A Slack incoming webhook URL.

    ### Secrets

    - `LICENSE_SCAN_WEBHOOK_KEY`: the key segment of the webhook URL (`.../executions/webhook/{namespace}/{flowId}/{key}`). Only needed if you enable `scan_on_pr_webhook`; a manual or `Subflow` run using `requirements_file` does not need it.
    - `SLACK_WEBHOOK_URL`: Slack incoming webhook used for the WARN alert, the BLOCK alert, the unreachable alert, and the flow-failure alert.
    - OSS note: if your Kestra instance reads secrets from environment variables instead of a secrets backend, set `SECRET_LICENSE_SCAN_WEBHOOK_KEY` and `SECRET_SLACK_WEBHOOK_URL` as base64, for example `echo -n "<your-value>" | base64`.

    ## Quick start

    1. Add the `SLACK_WEBHOOK_URL` secret, and the `LICENSE_SCAN_WEBHOOK_KEY` secret if you plan to enable the webhook.
    2. Create a test `requirements.txt` containing one permissively-licensed package and one GPL-licensed package (for example an older `pyreadline` release) to exercise both `PASS` and `BLOCK` in one run.
    3. Upload that file as `requirements_file`, run the flow manually, and confirm `status` matches what you expect.
    4. Either enable `scan_on_pr_webhook` and have your CI pipeline `curl --data-binary @requirements.txt` the webhook URL on each pull request, or wire a `Subflow` task pointing at this flow into your build pipeline immediately before packaging a release.

    ## How to extend

    - Add an `allowlist` input of pre-approved copyleft packages (for example ones your legal team has already cleared under a specific exception) and exclude them from the `BLOCK` jq filter by name.
    - Run the equivalent check for a Node.js project with `license-checker` instead of `pip-licenses`, reusing the same classify-by-pattern logic against its JSON output.
    - Store each BLOCK's package list in a KV store keyed by requirements file hash, to build a team-wide record of what got stopped and why.

    ## Links

    - [pip-licenses documentation](https://github.com/raimon49/pip-licenses)
    - [Kestra Fail task](https://kestra.io/plugins/core/tasks/execution/io.kestra.plugin.core.execution.fail)
  tags:
    - Business
  subTags:
    - Policy & Compliance
    - Approval Gates
  ee: false
  demo: false
