id: azure-keyvault-certificate-expiration-countdown-notifier
namespace: company.cloud

description: |
  Audits Azure Key Vault SSL/TLS certificates to detect approaching expirations within 30 days,
  dispatching automated renewal alerts and thumbprint manifests to SecOps teams via Slack.

concurrency:
  limit: 1

inputs:
  - id: keyvault_uri
    type: STRING
    displayName: Key Vault URI
    defaults: "https://kv-production-security.vault.azure.net"
    description: Base HTTPS endpoint URI of the target Azure Key Vault.

  - id: expiration_warning_days_threshold
    type: INT
    displayName: Expiration Warning Days
    defaults: 30
    description: Number of days before certificate expiration to trigger renewal alerts.

  - id: alert_on_expiring
    type: BOOL
    displayName: Alert on Expiring
    defaults: true
    description: Whether to dispatch automated Slack alerts when certificates approach expiration.

tasks:
  - id: scan_certificates
    type: io.kestra.plugin.scripts.python.Script
    description: Queries Azure Key Vault Certificate Client to inspect certificate expiration dates and properties.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install azure-identity azure-keyvault-certificates kestra
    env:
      AZURE_CLIENT_ID: "{{ secret('AZURE_CLIENT_ID') }}"
      AZURE_CLIENT_SECRET: "{{ secret('AZURE_CLIENT_SECRET') }}"
      AZURE_TENANT_ID: "{{ secret('AZURE_TENANT_ID') }}"
    script: |
      import os
      import json
      from datetime import datetime, timezone
      from azure.identity import ClientSecretCredential
      from azure.keyvault.certificates import CertificateClient
      from kestra import Kestra

      vault_uri = "{{ inputs.keyvault_uri }}".rstrip('/')
      warning_threshold_days = int("{{ inputs.expiration_warning_days_threshold }}")

      client_id = os.environ.get("AZURE_CLIENT_ID", "")
      client_secret = os.environ.get("AZURE_CLIENT_SECRET", "")
      tenant_id = os.environ.get("AZURE_TENANT_ID", "")

      now = datetime.now(timezone.utc)
      expiring_certificates = []
      total_certificates = 0
      has_expiring_certs = False

      try:
          cred = ClientSecretCredential(
              tenant_id=tenant_id,
              client_id=client_id,
              client_secret=client_secret
          )
          client = CertificateClient(vault_url=vault_uri, credential=cred)

          cert_properties = client.list_properties_of_certificates()
          for prop in cert_properties:
              if prop.enabled:
                  total_certificates += 1
                  expires_on = prop.expires_on
                  if expires_on:
                      remaining_days = (expires_on - now).days
                      if remaining_days <= warning_threshold_days:
                          expiring_certificates.append({
                              "name": prop.name,
                              "expires_on": expires_on.isoformat(),
                              "days_remaining": remaining_days,
                              "thumbprint": prop.x509_thumbprint.hex() if prop.x509_thumbprint else "unknown"
                          })

          if len(expiring_certificates) > 0:
              has_expiring_certs = True

          report = {
              "vault_uri": vault_uri,
              "total_certificates_audited": total_certificates,
              "expiring_certificates_count": len(expiring_certificates),
              "threshold_days": warning_threshold_days,
              "has_expiring_certs": has_expiring_certs,
              "expiring_certs_sample": expiring_certificates[:10]
          }

          with open("keyvault_report.json", "w") as f:
              json.dump(report, f)

          Kestra.outputs({
              "vault_uri": vault_uri,
              "total_certificates": total_certificates,
              "expiring_count": len(expiring_certificates),
              "has_expiring_certs": has_expiring_certs
          })

      except Exception as e:
          print(f"Error querying Azure Key Vault: {e}")
          report = {
              "vault_uri": vault_uri,
              "error": str(e),
              "has_expiring_certs": False
          }
          with open("keyvault_report.json", "w") as f:
              json.dump(report, f)
          Kestra.outputs({
              "vault_uri": vault_uri,
              "total_certificates": 0,
              "expiring_count": 0,
              "has_expiring_certs": False
          })

  - id: check_expiring_certificates
    type: io.kestra.plugin.core.flow.If
    description: Evaluates whether any enabled certificates in Key Vault are approaching expiration.
    condition: "{{ fromJson(read('keyvault_report.json')).has_expiring_certs and inputs.alert_on_expiring }}"
    then:
      - id: notify_slack_expiring_certs
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches high-priority certificate expiration warning to SecOps on Slack.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#secops-certificates",
            "username": "KeyVault-Sentinel",
            "text": "SECURITY ALERT: Azure Key Vault `{{ fromJson(read('keyvault_report.json')).vault_uri }}` has `{{ fromJson(read('keyvault_report.json')).expiring_certificates_count }}` certificate(s) expiring within {{ fromJson(read('keyvault_report.json')).threshold_days }} days! Total certificates: {{ fromJson(read('keyvault_report.json')).total_certificates_audited }}. Immediate renewal required to prevent HTTPS outages."
          }

  - id: log_certificate_health_state
    type: io.kestra.plugin.core.log.Log
    description: Records an operational audit trail of Azure Key Vault certificate expirations.
    message: "Azure Key Vault audit completed for '{{ fromJson(read('keyvault_report.json')).vault_uri }}'. Expiring certificates: {{ fromJson(read('keyvault_report.json')).expiring_certificates_count }}, Total: {{ fromJson(read('keyvault_report.json')).total_certificates_audited }}."

  - id: export_keyvault_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Emits structured manifest of expiring certificates for PKI tracking and compliance records.
    format: "{{ fromJson(read('keyvault_report.json')) }}"

triggers:
  - id: daily_keyvault_certificate_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: Automated schedule trigger auditing Key Vault certificates daily at 08:00 UTC.
    cron: "0 8 * * *"

extend:
  title: Azure KeyVault Certificate Expiration Countdown Notifier
  metaTitle: Azure KeyVault Certificate Expiration Countdown Notifier Blueprint
  shortDescription: Audits Azure Key Vault SSL/TLS certificates to detect approaching expirations within 30 days.
  metaDescription: Audits Azure Key Vault SSL/TLS certificates to detect approaching expirations within 30 days, dispatching renewal alerts to SecOps teams via Slack.
  description: |
    Enterprise cloud infrastructure relies on Azure Key Vault as a centralized, hardware-security-module (HSM) backed repository for managing SSL/TLS certificates used by Azure Application Gateways, Azure Front Door, custom domain App Services, and internal Kubernetes ingress controllers. While Azure Key Vault supports integrated DigiCert or GlobalSign certificate authority auto-renewal, custom external certificates or wildcards uploaded as PFX/PEM files require manual issuance and re-upload. When teams overlook renewal deadlines, public websites display catastrophic browser security warnings (`NET::ERR_CERT_DATE_INVALID`), API client connections fail TLS handshakes, and customer transactions halt. This notifier runs a daily automated audit across target Key Vaults, identifies enabled certificates expiring within a configurable threshold (e.g. 30 days), and delivers rich notification digests to SecOps and PKI engineering teams on Slack.

    ## How it works
    1. **Scheduled triggering**: Executes daily at 08:00 UTC via automated cron trigger (`0 8 * * *`) or runs on-demand via manual execution.
    2. **Certificate enumeration**: Interrogates the Azure Key Vault Certificate Client API (`list_properties_of_certificates`) targeting the vault HTTPS endpoint.
    3. **Validity inspection**: Filters for enabled certificates and calculates remaining lifetime days using `expires_on` relative to current UTC time.
    4. **Threshold comparison**: Isolates certificates with fewer remaining days than `expiration_warning_days_threshold` and compiles certificate thumbprints.
    5. **Conditional alerting**: An `io.kestra.plugin.core.flow.If` flowable checks if expiring certificates exist and dispatches an alert card to `#secops-certificates`.
    6. **Manifest export**: Emits a structured JSON audit payload detailing certificate names, expiration dates, remaining days, and thumbprints for compliance lineage.

    ## Architecture diagram
    ```mermaid
    flowchart TD
      A[daily_keyvault_certificate_audit Schedule Trigger] --> B[scan_certificates Python Script]
      B --> C[check_expiring_certificates Flowable If]
      C -- Expiring Certs Found --> D[notify_slack_expiring_certs Webhook]
      C -- All Certs Healthy --> E[log_certificate_health_state Log]
      D --> E
      E --> F[export_keyvault_manifest Return]
    ```

    ## What you get
    - Proactive visibility into expiring SSL/TLS certificates across Azure Key Vault instances.
    - Elimination of unexpected public domain HTTPS outages caused by lapsed certificate renewals.
    - Contextual Slack alerts detailing exact certificate names, thumbprints, and expiration countdown days.
    - Structured JSON manifests supporting automated ITIL certificate inventory tracking.

    ## Who it's for
    - Security Operations (SecOps) and Public Key Infrastructure (PKI) Engineers.
    - Cloud Infrastructure Administrators maintaining Application Gateways and Front Door profiles.
    - Site Reliability Engineers preventing TLS certificate date invalid outages.

    ## Why orchestrate this with Kestra
    Managing certificate lifecycles across multiple Azure subscriptions often leads to blind spots when certificates are uploaded manually. Kestra provides a scheduled orchestration engine that audits Key Vaults, executes authenticated SDK queries, parses cryptographic metadata, and delivers structured multi-channel alerts. With Kestra's containerized Python runner and native secret management, security teams establish reliable compliance watchdogs without maintaining custom serverless functions.

    ## Use cases
    - **Custom Domain Certificate Renewal Countdown**: Automatically notify web operations when manual domain certificates have 30, 14, and 7 days left.
    - **App Service Custom Domain Safeguard**: Prevent production web application downtime due to unrenewed wildcards or multi-domain SAN certificates.
    - **Compliance and Audit Evidence**: Generate daily audit logs proving that all active cryptographic assets remain within certified validity windows.

    ## Inputs
    | Name | Type | Default | Description |
    | :--- | :--- | :--- | :--- |
    | `keyvault_uri` | `STRING` | `https://kv-production-security.vault.azure.net` | Base HTTPS endpoint URI of the target Azure Key Vault. |
    | `expiration_warning_days_threshold` | `INT` | `30` | Number of days before certificate expiration to trigger renewal alerts. |
    | `alert_on_expiring` | `BOOL` | `true` | Whether to dispatch automated Slack alerts when certificates approach expiration. |

    ## Expected outputs
    - `{{ outputs.scan_certificates.vars.vault_uri }}`: URI of the evaluated Key Vault.
    - `{{ outputs.scan_certificates.vars.total_certificates }}`: Total number of enabled certificates inspected.
    - `{{ outputs.scan_certificates.vars.expiring_count }}`: Count of certificates approaching expiration within the threshold.
    - `{{ outputs.export_keyvault_manifest.value }}`: Structured dictionary containing the consolidated certificate expiration diagnostic manifest.

    ## Prerequisites
    - Outbound HTTPS network access from Kestra execution workers to Azure Key Vault endpoints (`*.vault.azure.net`).
    - An Azure Service Principal with `Key Vault Certificate User` or `Key Vault Reader` role on the target vault.
    - A Slack Incoming Webhook URL configured in Kestra secrets.

    ### Secrets
    - `AZURE_CLIENT_ID`: Service Principal Application (Client) ID.
    - `AZURE_CLIENT_SECRET`: Service Principal Secret.
    - `AZURE_TENANT_ID`: Azure Active Directory Directory (Tenant) ID.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL used to dispatch certificate alerts.

    ## Quick start
    1. Register `AZURE_CLIENT_ID`, `AZURE_CLIENT_SECRET`, `AZURE_TENANT_ID`, and `SLACK_WEBHOOK_URL` in your Kestra secret storage.
    2. Import this blueprint into your Kestra instance under the `company.cloud` namespace.
    3. Configure `keyvault_uri` with your Key Vault URL.
    4. Run a manual execution to test Key Vault certificate discovery and verify the output manifest.

    ## Common pitfalls and troubleshooting
    - **Access Policies vs Azure RBAC**: Key Vaults use either Azure RBAC or Vault Access Policies; ensure the service principal has `Certificates: Get, List` permissions under whichever model is active.
    - **Private Endpoint Routing**: If your Key Vault disables public network access, ensure your Kestra workers run within an integrated Azure VNet or self-hosted agent pool.
    - **Disabled Certificates**: Certificates marked as disabled in the vault are excluded from evaluation to avoid alerting on retired credentials.

    ## How to extend
    - **Automated Let's Encrypt Renewal Flow**: Trigger an automated ACME certificate renewal workflow to generate a new certificate and import it into Key Vault.
    - **ServiceNow Change Request**: Automatically create an ITIL change request ticket in ServiceNow when a certificate enters the 14-day expiration window.
    - **Multi-Vault Fleet Audit**: Wrap the evaluation in an `io.kestra.plugin.core.flow.ForEach` loop to scan all Key Vaults across corporate Azure subscriptions.

    ## Links
    - [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
    - [Azure Key Vault Certificates Documentation](https://learn.microsoft.com/en-us/azure/key-vault/certificates/about-certificates)
    - [Azure SDK for Python Key Vault Certificates](https://learn.microsoft.com/en-us/python/api/overview/azure/keyvault-certificates-readme)
