id: smb-share-storage-capacity-sentinel
namespace: company.storage

inputs:
  - id: smb_server
    type: STRING
    defaults: "smb-storage.internal"
    description: Hostname or IP address of the SMB/CIFS file server.
  - id: share_name
    type: STRING
    description: Target SMB share name to audit.
  - id: max_usage_percentage
    type: INT
    defaults: 85
    description: "Maximum allowable disk space utilization percentage before alerting (default 85%)."

tasks:
  - id: audit_share_capacity
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.11-slim
    beforeCommands:
      - apt-get update && apt-get install -y --no-install-recommends smbclient
      - pip install kestra
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    env:
      SMB_SERVER: "{{ inputs.smb_server }}"
      SHARE_NAME: "{{ inputs.share_name }}"
      SMB_USER: "{{ secret('SMB_USER') }}"
      SMB_PASSWORD: "{{ secret('SMB_PASSWORD') }}"
      MAX_USAGE_PCT: "{{ inputs.max_usage_percentage }}"
    script: |
      import os
      import sys
      import re
      import subprocess
      from kestra import Kestra

      smb_server = os.environ.get("SMB_SERVER")
      share_name = os.environ.get("SHARE_NAME")
      smb_user = os.environ.get("SMB_USER")
      smb_password = os.environ.get("SMB_PASSWORD")
      max_pct = float(os.environ.get("MAX_USAGE_PCT", 85))

      share_path = f"//{smb_server}/{share_name}"
      cmd = [
          "smbclient",
          share_path,
          f"-U{smb_user}%{smb_password}",
          "-c",
          "du"
      ]

      try:
          proc = subprocess.run(cmd, capture_output=True, text=True, check=True)
          output = proc.stdout
      except subprocess.CalledProcessError as exc:
          print(f"smbclient command failed with exit code {exc.returncode}: {exc.stderr}", file=sys.stderr)
          sys.exit(1)
      except Exception as exc:
          print(f"Error executing smbclient: {exc}", file=sys.stderr)
          sys.exit(1)

      m = re.search(r'(\d+)\s+blocks of size\s+(\d+)\.\s+(\d+)\s+blocks available', output)
      if not m:
          print(f"Failed to parse block size from smbclient output: {output}", file=sys.stderr)
          sys.exit(1)

      total_blocks = int(m.group(1))
      block_size = int(m.group(2))
      avail_blocks = int(m.group(3))

      if total_blocks <= 0:
          print(f"Invalid total blocks reported: {total_blocks}", file=sys.stderr)
          sys.exit(1)

      used_blocks = total_blocks - avail_blocks
      used_pct = round((used_blocks / total_blocks) * 100.0, 1)
      total_gb = int((total_blocks * block_size) // (1024**3))
      used_gb = int((used_blocks * block_size) // (1024**3))
      is_breach = 1 if used_pct >= max_pct else 0

      print(f"SMB Share {share_path}: Used {used_pct}% ({used_gb} GB / {total_gb} GB). Breach: {bool(is_breach)}")

      Kestra.outputs({
          "is_breach": is_breach,
          "used_pct": used_pct,
          "used_gb": used_gb,
          "total_gb": total_gb
      })

  - id: evaluate_share_headroom
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.audit_share_capacity.vars.is_breach | int == 1 }}"
    then:
      - id: notify_storage_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#storage-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 SMB Network Share Storage Headroom Warning",
                "text": "SMB Share //{{ inputs.smb_server }}/{{ inputs.share_name }} has reached {{ outputs.audit_share_capacity.vars.used_pct }}% capacity ({{ outputs.audit_share_capacity.vars.used_gb }} GB of {{ outputs.audit_share_capacity.vars.total_gb }} GB). Risk of filesystem write locks.",
                "footer": "Kestra Storage Sentinel • SMB/CIFS"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#storage-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ SMB Sentinel Failure",
            "text": "Failed to query SMB share capacity on {{ inputs.smb_server }}.",
            "footer": "Kestra Failure Sentinel"
          }
        ]
      }

outputs:
  - id: is_breach
    type: INT
    value: "{{ outputs.audit_share_capacity.vars.is_breach }}"
  - id: used_pct
    type: FLOAT
    value: "{{ outputs.audit_share_capacity.vars.used_pct }}"
  - id: used_gb
    type: INT
    value: "{{ outputs.audit_share_capacity.vars.used_gb }}"
  - id: total_gb
    type: INT
    value: "{{ outputs.audit_share_capacity.vars.total_gb }}"

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 * * * *"
    disabled: true

extend:
  metaDescription: "Audits SMB and CIFS network file shares for disk capacity saturation and volume headroom."
  metaTitle: SMB Network File Share Storage Headroom Sentinel with Kestra
  ee: false
  demo: false
  title: SMB Network File Share Storage Headroom Sentinel
  shortDescription: Audits SMB and CIFS network file shares for disk capacity saturation and volume headroom.
  description: |
    ## How it works
    This workflow connects to an enterprise SMB/CIFS file server using `smbclient` with domain credentials to audit volume storage statistics. By querying the remote share disk metrics (`du`), it calculates total volume blocks, block byte size, and available free space. When network shares utilized by automated document ingestion, image rendering, or backup flows run out of disk space, Windows and Linux clients receive write faults (`STATUS_DISK_FULL`). This sentinel continuously calculates disk utilization percentages and alerts storage engineers before capacity limits are exceeded.

    ## What you get
    - Real-time disk capacity monitoring for SMB and CIFS enterprise network shares.
    - Protection against unexpected document upload and ingestion stalls.
    - Automated Slack incident notifications with used and total gigabyte metrics.

    ## Who it's for
    - Systems Administrators maintaining Windows File Servers and Samba NAS clusters.
    - Enterprise Integration Engineers ingesting files from legacy network volumes.
    - SREs managing multi-protocol storage infrastructure.

    ## Why orchestrate this with Kestra
    - **Scheduled Surveillance**: Automates hourly storage audits without installing agent software.
    - **Encrypted Credential Security**: Secures SMB domain credentials inside Kestra's encrypted secret store.
    - **Cross-Platform Integration**: Unifies Windows file server monitoring with cloud storage sentinels.

    ## Prerequisites
    - SMB/CIFS file server accessible over port `445`.
    - `smbclient` utility installed in the execution container.
    - Secrets `SMB_USER`, `SMB_PASSWORD`, and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import this blueprint into your Kestra instance.
    2. Add `SMB_USER`, `SMB_PASSWORD`, and `SLACK_WEBHOOK` secrets.
    3. Specify `smb_server` and target `share_name`.
    4. Enable the schedule trigger for continuous disk headroom surveillance.

    ## How to extend
    - Archive older files from the share to cloud object storage when space is low.
    - Audit folder-level directory sizes to detect specific subdirectories consuming excessive capacity.
    - Deliver alerts to email or Microsoft Teams.

    ## Links
    - [Samba smbclient Documentation](https://www.samba.org/samba/docs/current/man-html/smbclient.1.html)
    - [Kestra Shell Plugin](https://kestra.io/plugins/plugin-scripts-shell)
    - [Kestra Slack Notifications](https://kestra.io/plugins/plugin-slack)
  tags:
    - Data
    - Infrastructure
  subTags:
    - ELT & Data Landing
    - Day 2 Operations
