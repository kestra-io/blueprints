id: postgres-role-privilege-hygiene-guard
namespace: company.team

description: |
  Audit PostgreSQL roles and grants against a few rules that matter for security reviews:
  login roles past their VALID UNTIL date, logins expiring soon, superuser or CREATEROLE held
  by roles outside an allowlist, CREATE on schema public granted to PUBLIC, and tables whose
  privileges are granted to PUBLIC. Alert Slack and optionally run the generated fix statements
  (NOLOGIN, NOSUPERUSER, REVOKE ...) one by one, then audit again to prove each finding is gone.

inputs:
  - id: jdbc_url
    type: STRING
    displayName: JDBC URL
    defaults: "jdbc:postgresql://localhost:5432/app"

  - id: privileged_allowlist
    type: ARRAY
    itemType: STRING
    displayName: Roles allowed to be superuser or CREATEROLE
    defaults:
      - postgres

  - id: expiring_days
    type: INT
    displayName: Warn when a login expires within (days)
    defaults: 14

  - id: auto_remediate
    type: BOOL
    displayName: Auto remediate
    description: Run the fix statement of every finding that has one. Expiring logins are only reported.
    defaults: false

  - id: dry_run
    type: BOOL
    displayName: Dry run
    description: Must be false, together with auto_remediate, for any statement to run.
    defaults: true

variables:
  audit_sql: |
    WITH allow AS (SELECT unnest(ARRAY[{{ inputs.privileged_allowlist | jq('map("\u0027" + gsub("\u0027"; "\u0027\u0027") + "\u0027") | join(",")') | first }}]::text[]) AS rolname)
    SELECT 'EXPIRED_LOGIN' AS finding, 'HIGH' AS severity, r.rolname AS object,
           'Login role expired on ' || to_char(r.rolvaliduntil, 'YYYY-MM-DD') || ', but the role still has LOGIN: it works again as soon as VALID UNTIL is changed' AS detail,
           format('ALTER ROLE %I NOLOGIN', r.rolname) AS fix_sql
      FROM pg_roles r WHERE r.rolcanlogin AND r.rolvaliduntil < now()
    UNION ALL
    SELECT 'EXPIRING_LOGIN', 'LOW', r.rolname, 'Login expires on ' || to_char(r.rolvaliduntil, 'YYYY-MM-DD') || ': rotate or extend', NULL
      FROM pg_roles r WHERE r.rolcanlogin AND r.rolvaliduntil BETWEEN now() AND now() + interval '{{ inputs.expiring_days }} days'
    UNION ALL
    SELECT 'UNEXPECTED_SUPERUSER', 'HIGH', r.rolname, 'Superuser not in the allowlist', format('ALTER ROLE %I NOSUPERUSER', r.rolname)
      FROM pg_roles r WHERE r.rolsuper AND r.rolname NOT IN (SELECT rolname FROM allow)
    UNION ALL
    SELECT 'UNEXPECTED_CREATEROLE', 'HIGH', r.rolname, 'CREATEROLE lets this role create and grant roles; not in the allowlist', format('ALTER ROLE %I NOCREATEROLE', r.rolname)
      FROM pg_roles r WHERE r.rolcreaterole AND NOT r.rolsuper AND r.rolname NOT IN (SELECT rolname FROM allow)
    UNION ALL
    SELECT 'PUBLIC_CREATE_ON_SCHEMA', 'HIGH', n.nspname, 'Every role can create objects in this schema (search_path hijacking, CVE-2018-1058)', format('REVOKE CREATE ON SCHEMA %I FROM PUBLIC', n.nspname)
      FROM pg_namespace n WHERE n.nspname !~ '^pg_' AND n.nspname <> 'information_schema' AND has_schema_privilege('public', n.oid, 'CREATE')
    UNION ALL
    SELECT 'PUBLIC_TABLE_GRANT', 'MEDIUM', c.oid::regclass::text,
           'Granted to PUBLIC: ' || string_agg(DISTINCT a.privilege_type, ', ' ORDER BY a.privilege_type),
           format('REVOKE ALL ON TABLE %s FROM PUBLIC', c.oid::regclass)
      FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace, aclexplode(c.relacl) a
     WHERE c.relkind IN ('r', 'p', 'v', 'm') AND n.nspname !~ '^pg_' AND n.nspname <> 'information_schema' AND a.grantee = 0
     GROUP BY c.oid
    ORDER BY 2, 1, 3

tasks:
  - id: audit
    type: io.kestra.plugin.jdbc.postgresql.Query
    description: Read-only catalog query. Every fix statement is built with format('%I') or regclass, so object names are quoted by PostgreSQL itself.
    url: "{{ inputs.jdbc_url }}"
    username: "{{ secret('POSTGRES_USERNAME') }}"
    password: "{{ secret('POSTGRES_PASSWORD') }}"
    fetchType: FETCH
    sql: "{{ render(vars.audit_sql) }}"

  - id: summary
    type: io.kestra.plugin.core.log.Log
    message: >-
      PostgreSQL role and grant audit on {{ inputs.jdbc_url }}: {{ outputs.audit.size }} findings.
      {% for r in outputs.audit.rows %}{{ r.severity }} {{ r.finding }} {{ r.object }}: {{ r.detail }}. {% endfor %}

  - id: route
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.audit.size > 0 }}"
    then:
      - id: alert
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {{ {'text': 'PostgreSQL role and grant audit on ' ~ inputs.jdbc_url ~ ': ' ~ outputs.audit.size ~ ' findings. ' ~ (outputs.audit.rows | jq('map("\(.finding) \(.object)") | join(", ")') | first) ~ '.' ~ (inputs.auto_remediate and not inputs.dry_run ? ' Applying the fixes now.' : ' No change applied (auto_remediate=' ~ inputs.auto_remediate ~ ', dry_run=' ~ inputs.dry_run ~ ').')} | toJson }}

      - id: remediate_gate
        type: io.kestra.plugin.core.flow.If
        condition: "{{ inputs.auto_remediate and not inputs.dry_run and outputs.audit.rows | jq('map(select(.fix_sql != null)) | length') | first > 0 }}"
        then:
          - id: remediate
            type: io.kestra.plugin.core.flow.Loop
            concurrencyLimit: 1
            description: One statement per finding, each isolated so one failure does not stop the others.
            values: "{{ outputs.audit.rows | jq('map(select(.fix_sql != null))') | first | toJson }}"
            tasks:
              - id: fix
                type: io.kestra.plugin.jdbc.postgresql.Query
                allowFailure: true
                url: "{{ inputs.jdbc_url }}"
                username: "{{ secret('POSTGRES_USERNAME') }}"
                password: "{{ secret('POSTGRES_PASSWORD') }}"
                fetchType: NONE
                sql: "{{ fromJson(item.value).fix_sql }}"

          - id: reaudit
            type: io.kestra.plugin.jdbc.postgresql.Query
            url: "{{ inputs.jdbc_url }}"
            username: "{{ secret('POSTGRES_USERNAME') }}"
            password: "{{ secret('POSTGRES_PASSWORD') }}"
            fetchType: FETCH
            sql: "{{ render(vars.audit_sql) }}"

          - id: verify_result
            type: io.kestra.plugin.core.flow.If
            description: Every finding that had a fix must be gone from the second audit.
            condition: >-
              {{ {'before': outputs.audit.rows, 'after': outputs.reaudit.rows ?? []} | jq('[.before[] | select(.fix_sql != null) | .finding + "|" + .object] as $b
                 | [.after[] | .finding + "|" + .object] as $a | [$b[] | select(. as $x | $a | index($x))] | length') | first > 0 }}
            then:
              - id: remediation_failed
                type: io.kestra.plugin.core.execution.Fail
                errorMessage: >-
                  Some fixes did not take: {{ {'before': outputs.audit.rows, 'after': outputs.reaudit.rows ?? []} | jq('[.before[] | select(.fix_sql != null) | .finding + "|" + .object] as $b | [.after[] | .finding + "|" + .object] as $a | [$b[] | select(. as $x | $a | index($x))] | join(", ")') | first }}. Check the remediate logs: the connecting role may lack the privilege.
            else:
              - id: remediated
                type: io.kestra.plugin.core.log.Log
                message: >-
                  Fixed and verified: {{ outputs.audit.rows | jq('map(select(.fix_sql != null) | .fix_sql) | join("; ")') | first }}.
                  Still open (report only): {{ outputs.reaudit.size }}.
    else:
      - id: clean
        type: io.kestra.plugin.core.log.Log
        message: "No role or grant finding."

errors:
  - id: alert_flow_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {{ {'text': 'PostgreSQL role and grant audit failed on ' ~ inputs.jdbc_url ~ ' (execution ' ~ execution.id ~ '). Treat the database as unaudited.'} | toJson }}

triggers:
  - id: daily
    type: io.kestra.plugin.core.trigger.Schedule
    description: Shipped disabled, and always in safe mode.
    cron: "0 6 * * *"
    disabled: true
    inputs:
      auto_remediate: false
      dry_run: true

extend:
  title: PostgreSQL Role and Privilege Hygiene Guard
  shortDescription: Audit PostgreSQL roles and grants for expired logins, unexpected superusers and CREATEROLE, PUBLIC create on schemas and PUBLIC table grants, alert Slack, and optionally fix and re-audit.
  metaTitle: PostgreSQL Role and Privilege Hygiene Guard with Kestra
  metaDescription: Find expired logins, unexpected superusers, PUBLIC schema and table grants in PostgreSQL, alert Slack, apply quoted fixes and re-audit.
  description: |
    Security reviews of a PostgreSQL database keep finding the same things:
    - a contractor's login role whose `VALID UNTIL` passed months ago, still `LOGIN`;
    - a DBA's personal role that is superuser;
    - a migration bot with `CREATEROLE`;
    - `CREATE` on schema `public` still granted to `PUBLIC` (the search_path issue behind CVE-2018-1058) on databases created before PostgreSQL 15;
    - a table someone granted to `PUBLIC` while debugging.

    Each one takes one statement to fix, if anyone looks.

    This blueprint looks every day. It audits the catalog, alerts Slack, and can run the generated fix statements one by one. It then audits again, so a fix that did not take fails the run.

    This blueprint was created by [zkasuran](https://github.com/zkasuran).

    ## Findings

    | Finding | Severity | Rule | Fix |
    |---|---|---|---|
    | `EXPIRED_LOGIN` | High | Login role past `VALID UNTIL` | `ALTER ROLE ... NOLOGIN` |
    | `EXPIRING_LOGIN` | Low | Login expires within `expiring_days` | Report only |
    | `UNEXPECTED_SUPERUSER` | High | Superuser outside `privileged_allowlist` | `ALTER ROLE ... NOSUPERUSER` |
    | `UNEXPECTED_CREATEROLE` | High | `CREATEROLE` outside the allowlist | `ALTER ROLE ... NOCREATEROLE` |
    | `PUBLIC_CREATE_ON_SCHEMA` | High | `PUBLIC` can create in a user schema | `REVOKE CREATE ON SCHEMA ... FROM PUBLIC` |
    | `PUBLIC_TABLE_GRANT` | Medium | A table, view or materialized view has privileges granted to `PUBLIC` | `REVOKE ALL ON TABLE ... FROM PUBLIC` |

    Every fix statement is built inside PostgreSQL with `format('%I')` or `regclass`, so role and table names are quoted by the database itself. A role called `Ops "Admin"` is fixed as `ALTER ROLE "Ops ""Admin""" NOSUPERUSER`.

    ## How it works

    1. `audit` (`io.kestra.plugin.jdbc.postgresql.Query`, read-only) runs one catalog query over `pg_roles`, `pg_namespace` and `pg_class` ACLs. It returns each finding with its fix.
    2. `summary` logs every finding.
    3. `route` (`io.kestra.plugin.core.flow.If`):
       - **clean:** logs it.
       - **findings:** `alert` posts to Slack.
         - `remediate_gate` runs only when `auto_remediate` is true and `dry_run` is false.
         - `remediate` (`io.kestra.plugin.core.flow.Loop`) runs each fix in its own `Query`, so one failure does not stop the others.
         - `reaudit` runs the same audit again, and `verify_result` fails if any fixed finding is still there.
    4. `errors` alerts Slack when the audit cannot run.

    ## What you get

    - A daily audit of the role and grant findings security reviews ask about, with severity and a reason for each.
    - A fix statement per finding, quoted by PostgreSQL itself.
    - Fixes run one by one behind two gates, then a second audit that fails the run if a fix did not take.

    ## Who it's for

    - DBAs and platform teams responsible for many PostgreSQL databases.
    - Security and compliance teams who need evidence that expired accounts and broad grants are removed.
    - Teams evaluating the PostgreSQL plugin who want an example of catalog queries driving administrative statements.

    ## Why orchestrate this with Kestra

    The catalog query is easy to write once. Kestra runs it every day on every database, sends the result to Slack, runs the fixes with a gate and an audit trail, re-audits to prove them, and keeps the execution history as evidence for the next review.

    ## Tested end to end

    On Kestra 2.0.5 OSS against PostgreSQL 16, with a local HTTP sink standing in for Slack. Seeded with:
    - an expired contractor login and a login expiring in 11 days;
    - a superuser `dba_jane` and a `CREATEROLE` `migration_bot`;
    - `CREATE ON SCHEMA public TO PUBLIC`, and `ALL ON customers TO PUBLIC`.

    | Run | Inputs | Result |
    |---|---|---|
    | 1 | defaults | 6 findings, `postgres` not flagged (allowlisted). Alert sent |
    | 2 | `auto_remediate: true`, `dry_run: true` | Same report. `psql` shows `dba_jane` still superuser |
    | 3 | `auto_remediate: true`, `dry_run: false` | 5 fixes run, re-audit confirms each one. Only the expiring login stays open (report only). `psql` shows `NOLOGIN`, `NOSUPERUSER`, `NOCREATEROLE`, no `PUBLIC` create on `public`, and `customers` ACL `{postgres=arwdDxt/postgres}` |
    | 4 | a new superuser named `Ops "Admin"` | Fixed with the correctly quoted statement |
    | 5 | unreachable database | `errors` alert sent |

    ## Prerequisites

    - For the audit, a role that can read the catalog (any role can). For remediation, a role with `CREATEROLE` and ownership of, or `GRANT OPTION` on, the objects, usually the database owner.
    - Local testing: `docker run -d --name pg -p 5432:5432 -e POSTGRES_PASSWORD=pg postgres:16`.

    ### Secrets

    - `POSTGRES_USERNAME` / `POSTGRES_PASSWORD`: credentials used by every query.
    - `SLACK_WEBHOOK_URL`: used by `alert` and the `errors` block.
    - In Kestra OSS, provide each one as a base64-encoded environment variable prefixed `SECRET_`.

    ### Inputs

    | Input | Default | Purpose |
    |---|---|---|
    | `jdbc_url` | `jdbc:postgresql://localhost:5432/app` | Database |
    | `privileged_allowlist` | `[postgres]` | Roles allowed superuser or `CREATEROLE` |
    | `expiring_days` | `14` | Expiry warning window |
    | `auto_remediate` | `false` | Allow fixes |
    | `dry_run` | `true` | Must be `false` for a statement to run |

    Roles are cluster-wide, but schemas and tables are per database: run one execution per database. The `daily` trigger is shipped disabled and always runs in safe mode.

    ## Quick start

    1. Add the `POSTGRES_USERNAME`, `POSTGRES_PASSWORD` and `SLACK_WEBHOOK_URL` secrets.
    2. Import the flow and set `jdbc_url` and `privileged_allowlist`.
    3. Run it once and read the findings.
    4. Run it with `auto_remediate: true` and `dry_run: false` to apply the fixes.
    5. Enable the `daily` trigger, which always runs in safe mode.

    ## How to extend

    - Loop over a list of JDBC URLs to audit every database of a cluster in one execution.
    - Add rules: roles that never logged in (from your connection logs), `BYPASSRLS`, default privileges granted to `PUBLIC`.
    - Store each audit in a table to report how long findings stayed open.
    - Ask for approval with a `Pause` before running fixes on production.

    ## Links

    - PostgreSQL privileges: https://www.postgresql.org/docs/current/ddl-priv.html
    - PostgreSQL plugin: https://kestra.io/plugins/plugin-jdbc-postgres
  tags:
    - Data
    - Infrastructure
  subTags:
    - Policy & Compliance
    - Day 2 Operations
  ee: false
  demo: false
