id: redis-slowlog-top-command-digest
namespace: company.cache

description: Audits Redis slowlog commands to identify blocking operations and latency spikes, delivering an actionable performance digest to SRE teams.

concurrency:
  limit: 1

inputs:
  - id: redis_host
    type: STRING
    defaults: redis.internal
    description: Hostname or IP address of the target Redis server.

  - id: redis_port
    type: INT
    defaults: 6379
    description: Port number for Redis communication.

  - id: max_slow_duration_ms_warning
    type: FLOAT
    defaults: 10.0
    description: Execution duration in milliseconds above which commands trigger a performance alert.

  - id: slowlog_entry_limit
    type: INT
    defaults: 100
    description: Maximum number of recent slowlog entries to inspect.

  - id: slack_channel
    type: STRING
    defaults: "#redis-performance"
    description: Slack channel destination for Redis slowlog digests.

tasks:
  - id: inspect_redis_slowlog
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install redis
    env:
      REDIS_HOST: "{{ inputs.redis_host }}"
      REDIS_PORT: "{{ inputs.redis_port }}"
      REDIS_PASSWORD: "{{ secret('REDIS_PASSWORD') }}"
      LIMIT: "{{ inputs.slowlog_entry_limit }}"
      THRESHOLD_MS: "{{ inputs.max_slow_duration_ms_warning }}"
    script: |
      import os
      import json
      import redis
      from kestra import Kestra

      host = os.getenv('REDIS_HOST', '127.0.0.1')
      port = int(os.getenv('REDIS_PORT', 6379))
      password = os.getenv('REDIS_PASSWORD')
      limit = int(os.getenv('LIMIT', 100))
      threshold_ms = float(os.getenv('THRESHOLD_MS', 10.0))

      r = redis.Redis(host=host, port=port, password=password, socket_timeout=10, decode_responses=False)

      # Fetch slowlog entries: list of dicts with id, start_time, duration (in microseconds), command
      raw_slowlog = r.slowlog_get(limit)

      flagged_commands = []
      command_type_counts = {}

      for entry in raw_slowlog:
          duration_us = entry.get('duration', 0)
          duration_ms = duration_us / 1000.0

          cmd_parts = entry.get('command', [])
          cmd_str = " ".join([p.decode('utf-8', errors='replace') if isinstance(p, bytes) else str(p) for p in cmd_parts])
          cmd_name = cmd_parts[0].decode('utf-8', errors='replace').upper() if cmd_parts else "UNKNOWN"

          command_type_counts[cmd_name] = command_type_counts.get(cmd_name, 0) + 1

          if duration_ms >= threshold_ms:
              flagged_commands.append({
                  'id': entry.get('id'),
                  'command': cmd_str[:120],
                  'duration_ms': round(duration_ms, 2)
              })

      total_entries = len(raw_slowlog)
      flagged_count = len(flagged_commands)
      has_slow_spikes = flagged_count > 0
      max_duration_ms = max([c['duration_ms'] for c in flagged_commands], default=0.0)

      Kestra.outputs({
          'total_slowlog_entries': total_entries,
          'flagged_slow_commands_count': flagged_count,
          'has_latency_spikes': has_slow_spikes,
          'max_duration_ms': max_duration_ms,
          'top_command_types': sorted(command_type_counts.items(), key=lambda x: x[1], reverse=True)[:5]
      })

      report = {
          'server': f"{host}:{port}",
          'total_entries': total_entries,
          'flagged_count': flagged_count,
          'max_duration_ms': max_duration_ms,
          'command_distribution': command_type_counts,
          'slow_commands': flagged_commands[:20]
      }

      with open('redis_slowlog_report.json', 'w') as f:
          json.dump(report, f, indent=2)

    outputFiles:
      - redis_slowlog_report.json

  - id: check_latency_spikes
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.inspect_redis_slowlog.vars.has_latency_spikes }}"
    then:
      - id: notify_slack_cache
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "{{ inputs.slack_channel }}",
            "text": "Redis Slowlog Latency Alert: {{ outputs.inspect_redis_slowlog.vars.flagged_slow_commands_count }} slow command(s) exceeded {{ inputs.max_slow_duration_ms_warning }} ms on `{{ inputs.redis_host }}`.\n• Peak Execution Time: {{ outputs.inspect_redis_slowlog.vars.max_duration_ms }} ms\n• Top Command Types: {{ outputs.inspect_redis_slowlog.vars.top_command_types | string }}\n• Remediation: Replace full collection reads (e.g. KEYS, HGETALL) with incremental SCAN operations."
          }
    else:
      - id: log_cache_nominal
        type: io.kestra.plugin.core.log.Log
        message: "Redis slowlog on {{ inputs.redis_host }} is healthy. Zero commands exceeded {{ inputs.max_slow_duration_ms_warning }} ms."

  - id: export_cache_manifest
    type: io.kestra.plugin.core.execution.Labels
    labels:
      redis_host: "{{ inputs.redis_host }}"
      slow_commands_count: "{{ outputs.inspect_redis_slowlog.vars.flagged_slow_commands_count | string }}"
      performance_state: "{{ outputs.inspect_redis_slowlog.vars.has_latency_spikes ? 'LATENCY_SPIKE' : 'OPTIMAL' }}"

triggers:
  - id: hourly_slowlog_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 * * * *"

extend:
  title: Redis Slowlog Top Command Digest
  metaTitle: Redis Slowlog Top Command Digest
  shortDescription: Audits Redis slowlog commands to identify blocking operations and latency spikes.
  metaDescription: Audits Redis slowlog entries to detect blocking operations, latency spikes, and offending commands, dispatching digests to Slack.
  description: |
    This blueprint acts as an automated query performance profiler for Redis cache clusters. Scheduled hourly, it pulls recent entries from `SLOWLOG GET`, aggregates command execution durations in milliseconds, categorizes top offending Redis commands (such as unpaginated `KEYS *` or large `HGETALL`), and delivers an actionable diagnostic digest to Slack when latency limits are breached.

    ## How it works

    1. **Hourly Profile Trigger**: The `hourly_slowlog_audit` trigger (`io.kestra.plugin.core.trigger.Schedule`) fires at the top of every hour.
    2. **Redis SLOWLOG Extraction**: The `inspect_redis_slowlog` task (`io.kestra.plugin.scripts.python.Script`) connects to Redis via the Python driver, pulls the latest slowlog records, and computes duration statistics in milliseconds.
    3. **Threshold Gate**: The `check_latency_spikes` flowable task (`io.kestra.plugin.core.flow.If`) branches based on whether any slow commands exceeded the configured latency warning threshold.
    4. **Slack Alert Dispatch**: When blocking queries are detected, `notify_slack_cache` (`io.kestra.plugin.slack.notifications.SlackIncomingWebhook`) dispatches a structured incident report.
    5. **Nominal Confirmation**: When all queries execute within performance targets, `log_cache_nominal` records confirmed health.
    6. **Manifest Export**: The `export_cache_manifest` task tags the execution with searchable status labels.

    ## Architecture diagram

    ```mermaid
    flowchart TD
        A[Schedule: Hourly] --> B[inspect_redis_slowlog: Redis SLOWLOG GET]
        B --> C{Commands Exceeding Threshold?}
        C -- Yes --> D[notify_slack_cache: Slack Webhook]
        C -- No --> E[log_cache_nominal: Log]
        D --> F[export_cache_manifest: Execution Labels]
        E --> F
    ```

    ## Use cases

    - **Detect Blocking Single-Threaded Commands**: Prevent single long-running operations from blocking the Redis event loop and causing application timeouts.
    - **Anti-Pattern Query Detection**: Spot developer queries using O(N) commands like `KEYS`, `SMEMBERS`, or large `FLUSHDB` in production.
    - **SRE Cache Performance Auditing**: Track latency spikes across caching tiers supporting critical web APIs.

    ## Inputs

    | Name | Type | Default | Description |
    | :--- | :--- | :--- | :--- |
    | `redis_host` | STRING | `redis.internal` | Hostname or IP address of the target Redis server. |
    | `redis_port` | INT | `6379` | Port number for Redis communication. |
    | `max_slow_duration_ms_warning` | FLOAT | `10.0` | Execution duration in milliseconds above which commands trigger a performance alert. |
    | `slowlog_entry_limit` | INT | `100` | Maximum number of recent slowlog entries to inspect. |
    | `slack_channel` | STRING | `#redis-performance` | Slack channel destination for Redis slowlog digests. |

    ## Expected outputs

    - `{{ outputs.inspect_redis_slowlog.vars.total_slowlog_entries }}`: Total slowlog records evaluated.
    - `{{ outputs.inspect_redis_slowlog.vars.flagged_slow_commands_count }}`: Count of commands exceeding duration threshold.
    - `{{ outputs.inspect_redis_slowlog.vars.has_latency_spikes }}`: Boolean flag indicating performance degradation.
    - `{{ outputs.inspect_redis_slowlog.vars.max_duration_ms }}`: Peak command duration observed in milliseconds.
    - `{{ outputs.inspect_redis_slowlog.outputFiles['redis_slowlog_report.json'] }}`: Full JSON performance report.

    ## Prerequisites

    - Redis server credentials with access to execute `SLOWLOG GET`.
    - Incoming Webhook URL configured for your caching operations Slack channel.

    ### Secrets

    - `REDIS_PASSWORD`: Redis server authentication password.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook endpoint URL.

    ## Quick start

    1. Configure `REDIS_PASSWORD` and `SLACK_WEBHOOK_URL` in your Kestra namespace secrets.
    2. Import this flow YAML into your Kestra workspace.
    3. Specify your Redis server address in `redis_host`.
    4. Click **Execute** in the UI to perform an immediate slowlog query audit.

    ## Common pitfalls and troubleshooting

    - **Slowlog-Log-Slower-Than Setting**: If `slowlog-log-slower-than` is set too high (e.g. 10000 microseconds) in `redis.conf`, sub-10ms commands will not be logged by Redis; verify configuration via `CONFIG GET slowlog-log-slower-than`.
    - **Slowlog Ring Buffer Overflow**: High-volume workloads may cycle entries quickly; maintain `slowlog-max-len` at 128 or higher.

    ## How to extend

    - Add automated slowlog reset via `SLOWLOG RESET` after successfully recording the hourly audit payload.
    - Correlate slow commands with Redis client list (`CLIENT LIST`) to identify the originating microservice IP.
    - Export command frequency time-series metrics into Prometheus or InfluxDB.

    ## Links

    - Kestra Python Script Documentation: https://kestra.io/plugins/plugin-scripts-python/io.kestra.plugin.scripts.python.Script
    - Kestra Slack Plugin Documentation: https://kestra.io/plugins/plugin-notifications
    - Redis Slowlog Documentation: https://redis.io/commands/slowlog/
  tags:
    - Data
    - Infrastructure
  subTags:
    - Databases
    - Monitoring & Alerting
    - Day 2 Operations
  ee: false
  demo: false
