id: ceph-rbd-snapshot-protection-gate
namespace: company.team
description: |
  List every snapshot on a named RBD image via the Ceph Dashboard API and
  alert Slack on any snapshot that is not protected - unprotected means
  nothing stops a plain rbd snap rm from deleting it outright. Read-only:
  this flow has no Protect task to call, so it only ever reports, it
  never changes a snapshot's protection state itself.

triggers:
  - id: periodic_protection_check
    type: io.kestra.plugin.core.trigger.Schedule
    description: Check every 6 hours - an unprotected snapshot is usually a one-time oversight at creation time, not something that changes on its own between checks. Shipped disabled; enable it once ceph_host/pool_name/image_name point at a real cluster and a manual run has been verified.
    cron: "0 */6 * * *"
    disabled: true

inputs:
  - id: ceph_host
    type: STRING
    displayName: "Ceph Dashboard Host"
    defaults: "localhost"
    description: Hostname or IP of the Ceph Manager Dashboard, passed as host to io.kestra.plugin.ceph.rbd.snapshots.List.

  - id: ceph_port
    type: INT
    displayName: "Ceph Dashboard Port"
    defaults: 8443
    description: TCP port of the Ceph Manager Dashboard REST API. 8443 is the plugin's own default.

  - id: pool_name
    type: STRING
    displayName: "RBD Pool Name"
    defaults: "rbd"
    description: Pool the target image belongs to.

  - id: image_name
    type: STRING
    displayName: "RBD Image Name"
    defaults: "data-volume"
    description: Name of the RBD image whose snapshots are audited.

tasks:
  - id: list_image_snapshots
    type: io.kestra.plugin.ceph.rbd.snapshots.List
    description: "The Ceph Dashboard API has no dedicated snapshot-listing endpoint (verified from the plugin's own source): this task calls GET /api/block/image/{image_spec} and returns the embedded snapshots array. Each entry exposes id, name, size, timestamp, and is_protected - but timestamp is kept as the raw, Ceph-version-dependent string the API returns, explicitly not parsed into a typed instant, which is why this gate checks is_protected rather than snapshot age."
    host: "{{ inputs.ceph_host }}"
    port: "{{ inputs.ceph_port }}"
    username: "{{ secret('CEPH_USERNAME') }}"
    password: "{{ secret('CEPH_PASSWORD') }}"
    poolName: "{{ inputs.pool_name }}"
    imageName: "{{ inputs.image_name }}"
    fetchType: FETCH

  - id: evaluate_snapshot_protection
    type: io.kestra.plugin.core.flow.If
    description: AT_RISK when one or more snapshots on this image have is_protected false.
    condition: "{{ (outputs.list_image_snapshots.snapshots | jq('[.[] | select(.is_protected == false)] | length') | first) > 0 }}"
    then:
      - id: alert_unprotected_snapshots
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: "There is no Protect task in this plugin to call automatically - verified from the plugin's own source, rbd.snapshots only exposes Clone, Create, Delete, List, and Rollback - so this branch only alerts by name, it never changes protection state itself."
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "Ceph RBD snapshot protection gate: AT_RISK on {{ inputs.pool_name }}/{{ inputs.image_name }}. Unprotected snapshot(s): {{ outputs.list_image_snapshots.snapshots | jq('[.[] | select(.is_protected == false) | .name] | join(\", \")') | first }}. A plain rbd snap rm can delete any of these outright. Execution {{ execution.id }}."
          }
    else:
      - id: log_protection_healthy
        type: io.kestra.plugin.core.log.Log
        message: "HEALTHY: all {{ outputs.list_image_snapshots.total }} snapshot(s) on {{ inputs.pool_name }}/{{ inputs.image_name }} are protected."

  - id: log_audit_complete
    type: io.kestra.plugin.core.log.Log
    description: Final status line for every run, independent of which branch fired, so the execution history always shows the headline numbers.
    message: "Snapshot protection audit complete for {{ inputs.pool_name }}/{{ inputs.image_name }}. total_snapshots={{ outputs.list_image_snapshots.total }}."

errors:
  - id: alert_execution_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alert when the flow itself fails outright - an unreachable Dashboard host, bad credentials, or pool_name/image_name not existing (a 404 from the image-detail endpoint).
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "Ceph RBD snapshot protection gate FAILED in execution {{ execution.id }} for {{ inputs.pool_name }}/{{ inputs.image_name }}. The snapshot list did not complete - confirm the pool and image exist; investigate before trusting the last known protection status."
      }

extend:
  title: "Ceph RBD Snapshot Protection Gate"
  shortDescription: List an RBD image's snapshots via the Ceph Dashboard API and alert Slack on any that are not protected, read-only.
  metaTitle: Ceph RBD Snapshot Protection Gate with Kestra
  metaDescription: "Audit a Ceph RBD image's snapshots for unprotected ones via the Dashboard API and alert Slack, read-only."
  description: |
    An RBD snapshot without Ceph's own `protected` flag set is one `rbd snap rm` away
    from being gone - no confirmation, no recovery, whether that command runs by a
    typo, a careless cleanup script, or someone who did not realize that snapshot was
    the only backup of a volume. This blueprint lists every snapshot on a named RBD
    image through the Ceph Dashboard API and alerts Slack by name the moment any of
    them is not protected.

    ## How it works

    1. `periodic_protection_check` (`io.kestra.plugin.core.trigger.Schedule`) runs every 6 hours. Shipped disabled so you can validate a manual run first.
    2. `list_image_snapshots` (`io.kestra.plugin.ceph.rbd.snapshots.List`, `fetchType: FETCH`) calls `GET /api/block/image/{pool_name}/{image_name}` and returns the embedded `snapshots` array, each with `id`, `name`, `size`, `timestamp`, and `is_protected`.
    3. `evaluate_snapshot_protection` (`io.kestra.plugin.core.flow.If`) filters `snapshots` with a `jq` expression for `is_protected == false`, branching on whether that count is greater than zero.
       - `else` (HEALTHY): `log_protection_healthy` records a clean check.
       - `then` (AT_RISK): `alert_unprotected_snapshots` names every unprotected snapshot in the Slack message.
    4. `log_audit_complete` always runs last, printing the headline count regardless of which branch fired.
    5. The `errors` block alerts Slack separately if the flow itself fails outright - an unreachable Dashboard host, bad credentials, or a `pool_name`/`image_name` that does not exist must not read as "no risk".

    ## What you get

    - A direct read of Ceph's own `is_protected` flag per snapshot, the same signal `rbd snap protect`/`unprotect` controls - not a guess based on snapshot naming or age.
    - The exact snapshot names in the Slack alert, so remediation starts with a list, not a bare count.
    - A read-only design: this flow calls one list endpoint - it cannot create, delete, protect, clone, or roll back any snapshot or image.
    - A final status log every run, gap or not, so the execution history doubles as a protection-compliance trend for that image.

    ## Who it's for

    - Storage and platform teams running Ceph RBD who treat certain snapshots as de facto backups and need to know immediately if one of them is actually deletable by a plain command.
    - SREs auditing snapshot hygiene on volumes backing production data, where an accidental `rbd snap rm` would be a real incident, not an inconvenience.
    - Anyone evaluating the Ceph plugin who wants a third worked example beyond `cluster.GetHealth` and `pools.List`/`Update` - this one exercises the `rbd.snapshots` package, the plugin's third and final real feature area, none of which overlap with this repo's other two Ceph blueprints.

    ## Why orchestrate this with Kestra

    `rbd snap ls` run by hand, or the equivalent Dashboard API call, answers one moment in time; it does not decide a cadence, filter for the unprotected ones specifically, or notify anyone. Kestra supplies the schedule, the protection-state filter as a first-class branch, and an execution history that shows exactly when a snapshot went unprotected and for how long before anyone noticed.

    ## Prerequisites

    - A reachable Ceph cluster with the Dashboard Manager module enabled and at least one RBD image with snapshots.
    - A Dashboard account with permission to read `/api/block/image/{image_spec}`.
    - A Slack incoming webhook for alerts.

    Local testing: as with this repo's other Ceph blueprints, Ceph is a multi-daemon distributed system with no official single-container demo image (confirmed against Ceph's own containerized-deployment documentation). Use `cephadm bootstrap` to stand up a single-node cluster with the Dashboard enabled, create an RBD image, and take a snapshot with `rbd snap create` (left unprotected on purpose) to exercise this flow. The plugin's own default Dashboard port is `8443`, which does not collide with Kestra's own UI on `8080`.

    ### Secrets

    - `CEPH_USERNAME` / `CEPH_PASSWORD`: Dashboard account credentials used by `list_image_snapshots`.
    - `SLACK_WEBHOOK_URL`: Slack incoming webhook used by `alert_unprotected_snapshots` and the `errors` block.
    - In Kestra OSS (no Enterprise secrets backend), secrets are supplied as environment variables prefixed `SECRET_`, base64-encoded, and read back in flows with `{{ secret('NAME') }}` - for example `SECRET_CEPH_PASSWORD=$(echo -n '<your-local-password>' | base64)`. This keeps credentials out of the flow YAML but, per Kestra's own documentation, offers no encryption at rest or access control beyond the host environment; use the Enterprise secrets backend for stronger guarantees.

    ### Inputs

    - `ceph_host` (STRING, default `localhost`): Ceph Dashboard hostname or IP.
    - `ceph_port` (INT, default `8443`): Ceph Dashboard REST API port.
    - `pool_name` (STRING, default `rbd`): pool the target image belongs to.
    - `image_name` (STRING, default `data-volume`): RBD image audited.

    ### Outputs

    - `outputs.list_image_snapshots.snapshots` / `.total`: the full snapshot list and count for the image, every run.

    ## Quick start

    1. Stand up a Ceph cluster with the Dashboard module enabled, for example via `cephadm bootstrap`.
    2. Create an RBD image and a deliberately unprotected snapshot: `rbd create rbd/data-volume --size 1G` then `rbd snap create rbd/data-volume@test-snap`.
    3. Add the `CEPH_USERNAME`, `CEPH_PASSWORD`, and `SLACK_WEBHOOK_URL` secrets.
    4. Run the flow manually with the defaults and confirm `alert_unprotected_snapshots` fires, naming `test-snap`.
    5. Run `rbd snap protect rbd/data-volume@test-snap` and re-run to confirm `log_protection_healthy` fires instead.
    6. Enable `periodic_protection_check` once you trust the check.

    ## How to extend

    - Loop over several `(pool_name, image_name)` pairs with `io.kestra.plugin.core.flow.Loop` to run the same gate across every image a platform team considers backup-critical.
    - Use `io.kestra.plugin.ceph.rbd.images.List` first to discover every image in a pool automatically, instead of naming one `image_name` per flow run.
    - Parse `timestamp` on a best-effort basis (accepting the plugin's own documented caveat that its format is Ceph-version dependent) to add an age-based signal alongside protection state, clearly flagging it as approximate rather than authoritative.
    - Chain this flow after a backup or clone job (`io.kestra.plugin.ceph.rbd.snapshots.Clone`) as a verification step, confirming the snapshot it just depended on is still protected before trusting the clone.

    ## Pitfalls

    - **Snapshot `timestamp` is a raw, unparsed string by design.** Verified directly from the plugin's own source comment: the format is Ceph-version dependent, so this flow deliberately does not attempt date arithmetic on it - an age-based "stale snapshot" check would need its own, version-aware parsing this blueprint does not attempt.
    - **There is no Protect task in this plugin.** Verified from the plugin's own source: `rbd.snapshots` only exposes `Clone`, `Create`, `Delete`, `List`, `Rollback` - none of them sets `is_protected`, which is exactly why `alert_unprotected_snapshots` only reports, it has nothing safe to call to fix the gap itself.
    - **This only audits the one image you name.** `pool_name`/`image_name` target exactly one RBD image per run - a pool with many images needs a `Loop` (see How to extend) or one flow execution per image, not a single run covering the whole pool.
    - **`is_protected` guards against deletion, not against the image itself being deleted.** A protected snapshot still disappears if the parent image is deleted along with all its snapshots through a sufficiently privileged call - protection only blocks the specific `rbd snap rm` command on that one snapshot.
    - **This blueprint is UNTESTED against a live Ceph cluster.** `rbd.snapshots.List`'s properties and `SnapshotInfo`'s fields (`id`, `name`, `size`, `timestamp`, `is_protected`) are taken verbatim from the plugin's source on `main` - but no Docker/Ceph environment or Kestra engine was run to execute this flow end to end.

