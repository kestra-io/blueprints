id: namespacejanitor
namespace: company.team
description: Finds namespaces stuck Terminating past a threshold, clears their finalizers, and reports on Slack.

labels:
  project: namespacejanitor
  team: platform

inputs:
  - id: stuck_minutes
    type: INT
    displayName: "Stuck threshold (minutes)"
    description: namespaces Terminating longer than this count as stuck
    defaults: 30
  - id: dry_run
    type: BOOL
    displayName: "Dry run"
    description: when true, only reports what would be cleaned without touching anything
    defaults: true
  - id: slack_webhook
    type: STRING
    displayName: "Slack Webhook URL"
    description: Incoming webhook URL of the Slack channel for the cleanup report

triggers:
  - id: schedule
    type: io.kestra.plugin.core.trigger.Schedule
    description: cleans up stuck namespaces every Sunday morning
    cron: "0 8 * * 0"
    timezone: UTC
    inputs:
      stuck_minutes: 30
      dry_run: true
      slack_webhook: "{{ secret('SLACK_WEBHOOK') }}"

tasks:
  - id: list_namespaces
    type: io.kestra.plugin.scripts.shell.Commands
    description: lists all namespaces as JSON
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      user: "0"
    containerImage: bitnami/kubectl
    inputFiles:
      client.crt: "{{ secret('CLIENT_CRT') }}"
      client.key: "{{ secret('CLIENT_KEY') }}"
    commands:
      - kubectl get namespaces -o json --client-certificate=client.crt --client-key=client.key --server={{ secret('MASTERURL') }} --insecure-skip-tls-verify=true > namespaces.json
    outputFiles:
      - namespaces.json

  - id: find_stuck
    type: io.kestra.plugin.scripts.python.Script
    description: finds namespaces stuck Terminating past the threshold, never system ones
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      user: "0"
    containerImage: python:3.11
    dependencies:
      - kestra
    outputFiles:
      - stuck.txt
    script: |
      import json
      from datetime import datetime, timezone, timedelta
      from kestra import Kestra

      stuck_minutes = int("""{{ inputs.stuck_minutes }}""")
      dry_run = """{{ inputs.dry_run }}""".strip().lower() == "true"

      # system namespaces are never touched, no input overrides this
      protected = {'kube-system', 'kube-public', 'kube-node-lease'}

      with open("""{{ outputs.list_namespaces.outputFiles['namespaces.json'] }}""") as f:
          namespaces = json.load(f)['items']

      cutoff = datetime.now(timezone.utc) - timedelta(minutes=stuck_minutes)

      stuck = []
      for ns in namespaces:
          meta = ns.get('metadata', {})
          status = ns.get('status', {})
          name = meta['name']
          if name in protected:
              continue
          if status.get('phase') != 'Terminating':
              continue
          deleted_at_raw = meta.get('deletionTimestamp')
          if not deleted_at_raw:
              continue
          deleted_at = datetime.fromisoformat(deleted_at_raw.replace('Z', '+00:00'))
          if deleted_at < cutoff:
              age = int((datetime.now(timezone.utc) - deleted_at).total_seconds() // 60)
              finalizers = ns.get('spec', {}).get('finalizers', []) or []
              stuck.append({
                  'name': name,
                  'age_min': age,
                  'finalizers': finalizers,
              })

      # one name per line for the clean step to read
      with open('stuck.txt', 'w') as f:
          for s in stuck:
              f.write(s['name'] + '\n')

      if dry_run:
          title = "*NamespaceJanitor - dry run*"
          tail = "would clean {n} stuck namespace(s). set dry_run to false to actually clean."
      else:
          title = "*NamespaceJanitor - cleaned*"
          tail = "cleaned {n} stuck namespace(s)."
      lines = [title, ""]
      for s in stuck:
          fins = ', '.join(s['finalizers']) if s['finalizers'] else 'no finalizers listed'
          lines.append(f"- *{s['name']}*: Terminating for ~{s['age_min']}m (finalizers: {fins})")
      lines.append("")
      lines.append(tail.format(n=len(stuck)))
      summary_text = "\n".join(lines)

      Kestra.outputs({
          'stuck': stuck,
          'count': len(stuck),
          'summary_text': summary_text,
      })

  - id: maybe_clean
    type: io.kestra.plugin.core.flow.If
    description: only acts when something is stuck
    condition: "{{ outputs.find_stuck.vars.count > 0 }}"
    then:
      - id: do_clean
        type: io.kestra.plugin.core.flow.If
        description: clears the blocking finalizers, live mode only
        condition: "{{ inputs.dry_run == false }}"
        then:
          - id: clear_finalizers
            type: io.kestra.plugin.scripts.python.Script
            description: removes finalizers through the finalize subresource
            taskRunner:
              type: io.kestra.plugin.scripts.runner.docker.Docker
              user: "0"
            containerImage: python:3.11
            dependencies:
              - kestra
            inputFiles:
              client.crt: "{{ secret('CLIENT_CRT') }}"
              client.key: "{{ secret('CLIENT_KEY') }}"
            script: |
              import json
              import ssl
              import urllib.request

              server = """{{ secret('MASTERURL') }}""".rstrip('/')

              ctx = ssl.create_default_context()
              ctx.check_hostname = False
              ctx.verify_mode = ssl.CERT_NONE
              ctx.load_cert_chain('client.crt', 'client.key')

              def api(method, path, data=None):
                  req = urllib.request.Request(
                      f"{server}{path}",
                      data=json.dumps(data).encode() if data is not None else None,
                      method=method,
                      headers={'Content-Type': 'application/json'},
                  )
                  with urllib.request.urlopen(req, context=ctx) as resp:
                      body = resp.read().decode()
                      return json.loads(body) if body else None

              with open("""{{ outputs.find_stuck.outputFiles['stuck.txt'] }}""") as f:
                  names = [line.strip() for line in f if line.strip()]

              for name in names:
                  ns = api('GET', f'/api/v1/namespaces/{name}')
                  ns['spec']['finalizers'] = []
                  # the finalize subresource is the only write the API accepts here
                  api('PUT', f'/api/v1/namespaces/{name}/finalize', ns)
      - id: send_summary
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: posts the cleanup summary to Slack
        url: "{{ inputs.slack_webhook }}"
        messageText: "{{ outputs.find_stuck.vars.summary_text }}"

extend:
  title: "NamespaceJanitor - Kubernetes stuck namespace cleaner"
  shortDescription: "Clears finalizers on namespaces stuck Terminating and reports the cleanup on Slack."
  metaTitle: "NamespaceJanitor: Kubernetes stuck namespace cleaner blueprint for Kestra"
  metaDescription: "A Kestra blueprint that finds Kubernetes namespaces stuck in Terminating, clears their blocking finalizers, and posts a Slack summary, with a safe dry-run"
  tags:
    - Infrastructure
  subTags:
    - Kubernetes Operations
    - Infrastructure Automation
  ee: false
  demo: false
  description: |
    ## How it works

    1. `list_namespaces` (`io.kestra.plugin.scripts.shell.Commands`) dumps all namespaces as JSON with kubectl.
    2. `find_stuck` (`io.kestra.plugin.scripts.python.Script`) keeps only namespaces in `Terminating` phase whose deletion timestamp is older than `stuck_minutes`. System namespaces (`kube-system`, `kube-public`, `kube-node-lease`) are skipped unconditionally. The stuck names land in `stuck.txt`.
    3. `maybe_clean` (`io.kestra.plugin.core.flow.If`) runs only when something is stuck. Inside it, `do_clean` runs only in live mode (`dry_run: false`): `clear_finalizers` GETs each stuck namespace, empties its finalizer list, and PUTs it back through the `/finalize` subresource, which is the only write the API accepts for a Terminating namespace. `send_summary` always posts the report to Slack.
    4. There is no KV state in this flow, and that is deliberate. A janitor does not need memory: once the namespace is gone it is gone, and dry-run mode is a report, not an alert.

    ## What you get

    - Automatic recovery from the classic dead-finalizer hang, on a schedule, instead of the manual `kubectl replace --raw .../finalize` dance.
    - A Slack report every run that found something: which namespaces, how long they were stuck, and which finalizers were blocking.
    - Safety by default: `dry_run` is true unless you explicitly turn it off, and only namespaces already Terminating past the threshold are ever touched.
    - Quiet runs when nothing is stuck.

    ## Who it's for

    Anyone who has ever had `kubectl delete namespace` hang forever because a finalizer never cleared: operators, platform teams, and minikube experimenters alike.

    ## Why orchestrate this with Kestra

    The manual fix is a multi-step incantation people copy from Stack Overflow under pressure, which is exactly when mistakes happen. As a flow it is scheduled, audited, and safe by default: credentials stay in secrets, every run keeps its logs where you can see what was cleared, and the dry-run default means the first run can never surprise you.

    ## Prerequisites

    - A Kubernetes cluster where you can list namespaces and update them through the finalize subresource (cluster-admin covers it).
    - A kubeconfig client certificate and key with those permissions.
    - Kestra with the Docker task runner available (used for the kubectl and Python steps).
    - A Slack Incoming Webhook URL.

    ### Secrets

    | Secret | What it is |
    | --- | --- |
    | `CLIENT_CRT` | base64-encoded client certificate from your kubeconfig |
    | `CLIENT_KEY` | base64-encoded client key from your kubeconfig |
    | `MASTERURL` | base64-encoded Kubernetes API server URL, reachable from inside the Kestra container |
    | `SLACK_WEBHOOK` | base64-encoded Slack Incoming Webhook URL |

    In Kestra OSS, secrets come from environment variables prefixed with `SECRET_` and must be base64-encoded. If the API URL uses `127.0.0.1` or `localhost`, replace it with `host.docker.internal` so the Kestra container can reach it.

    ## Quick start

    1. Start Kestra with the four secrets above as `SECRET_` environment variables.
    2. Import this flow and run it with `dry_run: true`: the Slack report lists stuck namespaces, and nothing is touched.
    3. Check the list. If it looks right, run once with `dry_run: false`: the finalizers are cleared, the namespaces finish deleting, and the Slack report says so.
    4. Run again: quiet, nothing stuck left.

    ## How to extend

    - Lower `stuck_minutes` for dev clusters where you want faster recovery.
    - Alert PagerDuty instead of just Slack when a production namespace gets stuck.
    - Record which finalizer was blocking most often to find the misbehaving operator.
    - Run across multiple clusters by parameterizing the secrets per cluster.

    ## Inputs

    | Input | Type | Default | What it does |
    | --- | --- | --- | --- |
    | `stuck_minutes` | INT | `30` | namespaces Terminating longer than this count as stuck |
    | `dry_run` | BOOL | `true` | when true, only reports what would be cleaned without touching anything |
    | `slack_webhook` | STRING | (required) | Incoming webhook URL of the Slack channel for the cleanup report |

    ## Links

    - [Kestra blueprint catalog](https://kestra.io/blueprints)
    - [Kubernetes namespaces documentation](https://kubernetes.io/docs/concepts/overview/working-with-objects/namespaces/)
    - [Kestra secrets documentation](https://kestra.io/docs/concepts/secrets)

    ## Pitfalls

    - `dry_run` defaults to true for a reason. Flip it to false only after you have seen a dry-run report and you trust the list.
    - Clearing finalizers is a forceful act: anything the finalizer was protecting (like cloud resources provisioned by an operator) will not be cleaned up. Only run live mode when you understand why the namespace is stuck.
    - The protected system namespaces are hardcoded and no input overrides this. That is intentional.
    - A namespace stuck because the API server itself is unhealthy will not be fixed by clearing finalizers. Check control-plane health first.
