id: coingecko-crypto-market-cap-delta-loader
namespace: company.data

description: |
  Ingest live cryptocurrency digital asset market pricing, 24-hour volume, and market capitalization
  from the CoinGecko REST API, compute intraday volatility anomalies and asset rank changes into columnar Parquet
  using DuckDB, track portfolio high-watermark valuations in Kestra KV store, and emit alerts on sharp market corrections.

inputs:
  - id: target_currency
    type: STRING
    defaults: "usd"
    description: Fiat target reference currency for asset pricing (e.g., usd, eur, gbp).

  - id: asset_limit
    type: INT
    defaults: 50
    description: Number of top market-cap digital assets to track per execution cycle.

  - id: volatility_alert_percent
    type: DOUBLE
    defaults: 8.0
    description: Absolute 24-hour price change percentage triggering volatility alerts.

  - id: state_key
    type: STRING
    defaults: coingecko_crypto_market_cap_state
    description: Kestra KV store key maintaining the latest global market valuation snapshot.

concurrency:
  limit: 1
  behavior: CANCEL

triggers:
  - id: hourly_crypto_harvest
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 * * * *"
    description: Harvest cryptocurrency market metrics hourly.

tasks:
  - id: fetch_state
    type: io.kestra.plugin.core.kv.Get
    key: "{{ inputs.state_key }}"
    errorOnMissing: false

  - id: ingest_and_transform_markets
    type: io.kestra.plugin.scripts.shell.Commands
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install duckdb requests
    env:
      CURRENCY: "{{ inputs.target_currency }}"
      LIMIT: "{{ inputs.asset_limit }}"
      VOLATILITY_PCT: "{{ inputs.volatility_alert_percent }}"
      LAST_STATE: "{{ outputs.fetch_state.value ?? '{}' }}"
    commands:
      - |
        python3 - << 'EOF'
        import os
        import json
        import requests
        import duckdb

        currency = os.environ.get("CURRENCY", "usd").lower()
        limit = int(os.environ.get("LIMIT", 50))
        volatility_threshold = float(os.environ.get("VOLATILITY_PCT", 8.0))
        state = json.loads(os.environ.get("LAST_STATE", "{}"))

        url = f"https://api.coingecko.com/api/v3/coins/markets?vs_currency={currency}&order=market_cap_desc&per_page={limit}&page=1&sparkline=false"
        headers = {"User-Agent": "Kestra-DigitalAsset-Ingest/2.0 (contact@company.internal)"}

        response = requests.get(url, headers=headers, timeout=25)
        response.raise_for_status()
        raw_coins = response.json()

        records = []
        for c in raw_coins:
            symbol = str(c.get("symbol", "")).upper()
            name = c.get("name", symbol)
            price = c.get("current_price", 0.0)
            market_cap = c.get("market_cap", 0.0)
            rank = c.get("market_cap_rank", 0)
            volume_24h = c.get("total_volume", 0.0)
            price_change_24h_pct = c.get("price_change_percentage_24h", 0.0)
            ath = c.get("ath", 0.0)
            last_updated = c.get("last_updated", "")

            records.append({
                "symbol": symbol,
                "name": name,
                "currency": currency.upper(),
                "market_cap_rank": int(rank) if rank is not None else 9999,
                "current_price": float(price) if price is not None else 0.0,
                "market_cap": float(market_cap) if market_cap is not None else 0.0,
                "volume_24h": float(volume_24h) if volume_24h is not None else 0.0,
                "price_change_24h_pct": float(price_change_24h_pct) if price_change_24h_pct is not None else 0.0,
                "ath": float(ath) if ath is not None else 0.0,
                "last_updated": last_updated
            })

        with open("crypto_markets.json", "w", encoding="utf-8") as f:
            json.dump(records, f)

        con = duckdb.connect()
        if records:
            con.execute("CREATE TABLE crypto_assets AS SELECT * FROM read_json_auto('crypto_markets.json')")
            con.execute("COPY crypto_assets TO 'crypto_market_snapshot.parquet' (FORMAT PARQUET)")
            con.execute("COPY crypto_assets TO 'crypto_market_snapshot.csv' (HEADER, DELIMITER ',')")

            total_mcap = con.execute("SELECT SUM(market_cap) FROM crypto_assets").fetchone()[0]
            volatile_assets = con.execute(f"""
                SELECT symbol, name, current_price, price_change_24h_pct
                FROM crypto_assets
                WHERE ABS(price_change_24h_pct) >= {volatility_threshold}
                ORDER BY ABS(price_change_24h_pct) DESC
            """).df().to_dict(orient="records")
        else:
            con.execute("""
                CREATE TABLE crypto_assets (
                    symbol VARCHAR,
                    name VARCHAR,
                    currency VARCHAR,
                    market_cap_rank INT,
                    current_price DOUBLE,
                    market_cap DOUBLE,
                    volume_24h DOUBLE,
                    price_change_24h_pct DOUBLE,
                    ath DOUBLE,
                    last_updated VARCHAR
                )
            """)
            con.execute("COPY crypto_assets TO 'crypto_market_snapshot.parquet' (FORMAT PARQUET)")
            con.execute("COPY crypto_assets TO 'crypto_market_snapshot.csv' (HEADER, DELIMITER ',')")
            total_mcap = 0.0
            volatile_assets = []

        new_state = {
            "total_market_cap": total_mcap,
            "tracked_count": len(records),
            "top_asset": records[0]["symbol"] if records else ""
        }

        summary = {
            "assets_tracked": len(records),
            "total_market_cap_usd": total_mcap,
            "volatile_assets_count": len(volatile_assets),
            "volatile_assets": volatile_assets,
            "updated_state": new_state
        }

        print(f"::{{'outputs': {json.dumps(summary)}}}::")
        EOF
    outputFiles:
      - crypto_market_snapshot.parquet
      - crypto_market_snapshot.csv

  - id: persist_state
    type: io.kestra.plugin.core.kv.Set
    key: "{{ inputs.state_key }}"
    value: "{{ outputs.ingest_and_transform_markets.vars.updated_state | toJson }}"

  - id: check_volatility
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.ingest_and_transform_markets.vars.volatile_assets_count > 0 }}"
    then:
      - id: warn_volatility
        type: io.kestra.plugin.core.log.Log
        level: WARN
        message: "📈 Crypto Volatility Alert: Detected {{ outputs.ingest_and_transform_markets.vars.volatile_assets_count }} digital asset(s) with 24h price swing exceeding {{ inputs.volatility_alert_percent }}%."

outputs:
  - id: tracked_assets_count
    type: INT
    value: "{{ outputs.ingest_and_transform_markets.vars.assets_tracked }}"
  - id: volatile_assets_count
    type: INT
    value: "{{ outputs.ingest_and_transform_markets.vars.volatile_assets_count }}"
  - id: dataset_parquet
    type: FILE
    value: "{{ outputs.ingest_and_transform_markets.outputFiles['crypto_market_snapshot.parquet'] }}"

extend:
  title: CoinGecko Crypto Market Valuation Delta Loader with DuckDB
  metaTitle: CoinGecko Crypto Market Delta Loader | Kestra
  shortDescription: Ingests digital asset pricing, trading volumes, and market cap from CoinGecko into Parquet lakehouse storage via DuckDB.
  metaDescription: Harvest cryptocurrency market metrics from CoinGecko, calculate 24h price volatility into Parquet with DuckDB, and track state in KV store.
  tags:
    - Data
  subTags:
    - ELT & Warehouse Loading
    - File & Data Processing Basics
  ee: false
  demo: false
  description: |
    Orchestrate automated, reliable synchronization of live cryptocurrency asset pricing, 24-hour trading volumes,
    and market capitalization rankings from the official CoinGecko REST API into analytical Parquet storage using DuckDB.

    ## How it works

    1. **State Recovery**: Reads previous market cap totals from Kestra KV store (`coingecko_crypto_market_cap_state`) to maintain benchmark valuation continuity.
    2. **CoinGecko Market Ingestion**: Queries the CoinGecko Markets REST endpoint (`api.coingecko.com/api/v3/coins/markets`) for top digital assets by market cap.
    3. **DuckDB Analytical Modeling**: Unpacks pricing, 24-hour percentage variations, all-time-high benchmarks, and trading volumes inside an isolated Docker container.
    4. **Analytical Lake Export**: Exports normalized market snapshots into columnar Parquet and CSV files for quantitative algorithmic modeling.
    5. **Volatility Detection & State Commit**: Flags digital assets exhibiting price swings exceeding the configured volatility threshold and updates state in Kestra KV store.

    ## What you get

    - Automated hourly ingestion of live global digital asset metrics directly into columnar Parquet format.
    - Lakehouse datasets ready for financial time-series modeling, algorithmic backtesting, and portfolio tracking.
    - Built-in KV state management providing idempotent execution and historical valuation baselines.

    ## Who it's for

    - Fintech quantitative engineers building digital asset data feeds and feature stores.
    - Treasury and financial risk management teams monitoring corporate crypto holdings.
    - Analytics Engineers centralizing alternative financial market data.

    ## Why orchestrate this with Kestra

    - Built-in KV store maintains market valuation state across runs without external database infrastructure.
    - Ephemeral Docker execution guarantees isolated Python and DuckDB dependencies.
    - Declarative flow control provides transparent logging, automated error handling, and scheduled execution.

    ## Prerequisites

    - Docker runtime configured on the Kestra worker.
    - Outbound internet access to `api.coingecko.com`.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: (Optional) Webhook URL for forwarding high-volatility market alerts.

    ## Quick start

    1. Import this blueprint into your Kestra instance.
    2. Set `target_currency` (e.g. "usd", "eur") and `volatility_alert_percent` (e.g. 5.0, 10.0).
    3. Click **Execute** to run an immediate market pricing snapshot.
    4. Enable the `hourly_crypto_harvest` trigger for automated continuous updates.

    ## How to extend

    - Add an S3 or Google Cloud Storage upload task to archive daily Parquet snapshots into an analytical lake.
    - Connect downstream BI tools to visualize market share dominance shifts across major Layer 1 protocols.

    ## Links

    - [CoinGecko REST API Documentation](https://www.coingecko.com/en/api/documentation)
    - [DuckDB Parquet Export Guide](https://duckdb.org/docs/data/parquet/overview.html)
    - [Kestra Task Runners](https://kestra.io/docs/task-runners)
