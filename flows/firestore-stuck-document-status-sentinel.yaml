    - [Firestore TTL policy documentation](https://firebase.google.com/docs/firestore/ttl)
    - [Firestore emulator documentation](https://firebase.google.com/docs/emulator-suite)
    - [Kestra secrets (OSS vs Enterprise)](https://kestra.io/docs/concepts/secret)
