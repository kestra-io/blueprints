id: opentelemetry-lakehouse-analytics-bigquery
namespace: company.team
description: |
  Ingest OpenTelemetry GenAI trace spans, compact raw JSON batches into
  columnar Snappy Parquet using in-memory DuckDB, load into a day-partitioned
  and clustered BigQuery lakehouse table, and dispatch Slack alerts on token
  consumption anomalies or elevated error counts.

triggers:
  - id: batch_telemetry_webhook
    type: io.kestra.plugin.core.trigger.Webhook
    description: Webhook endpoint for event-driven invocation from OpenTelemetry collectors or telemetry forwarders.
    key: otel-trace-ingest

  - id: hourly_compaction_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    description: Scheduled batch ingestion and compaction run hourly. Shipped disabled by default.
    cron: "0 * * * *"
    disabled: true

inputs:
  - id: gcs_bucket
    type: STRING
    displayName: Telemetry GCS Bucket
    description: Google Cloud Storage bucket containing raw OpenTelemetry JSON trace batches.
    defaults: company-telemetry-lake

  - id: gcs_prefix
    type: STRING
    displayName: GCS Trace Prefix
    description: Object prefix path for incoming raw OpenTelemetry trace files.
    defaults: traces/raw/

  - id: bq_project
    type: STRING
    displayName: BigQuery Project ID
    description: Google Cloud project ID hosting the destination analytics dataset.
    defaults: company-analytics

  - id: bq_dataset
    type: STRING
    displayName: BigQuery Dataset
    description: Destination BigQuery dataset for telemetry lakehouse tables.
    defaults: observability

  - id: bq_table
    type: STRING
    displayName: BigQuery Table
    description: Destination BigQuery table name for compacted OpenTelemetry GenAI spans.
    defaults: otel_genai_spans

  - id: token_anomaly_threshold
    type: INT
    displayName: Token Anomaly Threshold
    description: Threshold for alerting on excessive GenAI token consumption.
    defaults: 50000

  - id: send_slack_alert
    type: BOOLEAN
    displayName: Send Slack Alert
    description: Toggle to dispatch Slack notifications for detected anomalies or failures.
    defaults: false

tasks:
  - id: ingest_otel_traces
    type: io.kestra.plugin.scripts.python.Script
    description: Ingest or synthesize OpenTelemetry GenAI trace spans conforming to OpenTelemetry semantic conventions.
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    outputFiles:
      - otel_traces.json
    script: |
      import json
      import uuid
      from datetime import datetime, timezone
      import random

      models = [
          "gpt-4o",
          "claude-3-5-sonnet",
          "gemini-1.5-pro",
          "mistral-large"
      ]
      services = [
          "customer-support-agent",
          "code-review-assistant",
          "rag-search-pipeline",
          "document-summarizer"
      ]
      finish_reasons_list = [["stop"], ["stop"], ["stop"], ["length"]]

      now = datetime.now(timezone.utc)
      records = []

      # Generate 50 realistic trace spans matching OTel GenAI semantic conventions
      for i in range(50):
          model = random.choice(models)
          service = random.choice(services)

          # Inject an occasional high-token span or error to exercise anomaly thresholds
          if i == 7:
              input_tokens = 42000
              output_tokens = 12500
              status_code = "OK"
              error_msg = None
          elif i == 19:
              input_tokens = 1800
              output_tokens = 250
              status_code = "ERROR"
              error_msg = "Upstream model quota exceeded (HTTP 429)"
          else:
              input_tokens = random.randint(350, 4200)
              output_tokens = random.randint(80, 1100)
              status_code = "OK"
              error_msg = None

          duration_ms = float(random.randint(220, 3800))
          total_tokens = input_tokens + output_tokens

          span = {
              "trace_id": uuid.uuid4().hex,
              "span_id": uuid.uuid4().hex[:16],
              "timestamp": now.isoformat(),
              "service_name": service,
              "duration_ms": duration_ms,
              "status_code": status_code,
              "error_message": error_msg,
              "gen_ai": {
                  "system": model.split("-")[0] if "-" in model else "openai",
                  "request": {
                      "model": model
                  },
                  "usage": {
                      "input_tokens": input_tokens,
                      "output_tokens": output_tokens
                  },
                  "response": {
                      "finish_reasons": random.choice(finish_reasons_list)
                  }
              }
          }
          records.append(span)

      with open("otel_traces.json", "w") as f:
          for r in records:
              f.write(json.dumps(r) + "\n")

      max_tokens = max(
          r["gen_ai"]["usage"]["input_tokens"] + r["gen_ai"]["usage"]["output_tokens"]
          for r in records
      )
      error_count = sum(1 for r in records if r["status_code"] != "OK")
      threshold = {{ inputs.token_anomaly_threshold }}

      print("::" + json.dumps({
          "outputs": {
              "total_spans": len(records),
              "max_tokens": max_tokens,
              "error_count": error_count,
              "token_anomaly_detected": max_tokens >= threshold,
              "high_error_count_detected": error_count > 0
          }
      }) + "::")

  - id: compact_traces_to_parquet
    type: io.kestra.plugin.duckdb.Query
    description: In-memory compaction and flattening from raw OTel JSON traces to Snappy Parquet.
    inputFiles:
      otel_traces.json: "{{ outputs.ingest_otel_traces.outputFiles['otel_traces.json'] }}"
    outputFiles:
      - otel_genai_spans.parquet
    sql: |
      COPY (
        SELECT
          trace_id::VARCHAR AS trace_id,
          span_id::VARCHAR AS span_id,
          timestamp::TIMESTAMP AS timestamp,
          service_name::VARCHAR AS service_name,
          gen_ai.system::VARCHAR AS gen_ai_system,
          gen_ai.request.model::VARCHAR AS model,
          gen_ai.usage.input_tokens::BIGINT AS input_tokens,
          gen_ai.usage.output_tokens::BIGINT AS output_tokens,
          (gen_ai.usage.input_tokens + gen_ai.usage.output_tokens)::BIGINT AS total_tokens,
          CAST(gen_ai.response.finish_reasons AS VARCHAR) AS finish_reasons,
          duration_ms::DOUBLE AS duration_ms,
          status_code::VARCHAR AS status_code,
          error_message::VARCHAR AS error_message
        FROM read_json_auto('{{ workingDir }}/otel_traces.json')
      ) TO '{{ workingDir }}/otel_genai_spans.parquet' (FORMAT PARQUET, CODEC 'SNAPPY');

  - id: load_parquet_to_bigquery
    type: io.kestra.plugin.gcp.bigquery.Load
    description: Load compacted Snappy Parquet into BigQuery with day-partitioning on timestamp and clustering on service_name and model.
    projectId: "{{ inputs.bq_project }}"
    serviceAccount: "{{ secret('GCP_SERVICE_ACCOUNT_JSON') }}"
    destinationTable: "{{ inputs.bq_project }}.{{ inputs.bq_dataset }}.{{ inputs.bq_table }}"
    from: "{{ outputs.compact_traces_to_parquet.outputFiles['otel_genai_spans.parquet'] }}"
    format: PARQUET
    timePartitioningField: "timestamp"
    timePartitioningType: "DAY"
    clusteringFields:
      - "service_name"
      - "model"
    autodetect: true
    createDisposition: CREATE_IF_NEEDED
    writeDisposition: WRITE_APPEND

  - id: evaluate_anomalies
    type: io.kestra.plugin.core.flow.If
    description: Check if token consumption exceeded the anomaly threshold or high error count was detected.
    condition: "{{ outputs.ingest_otel_traces.token_anomaly_detected or outputs.ingest_otel_traces.high_error_count_detected }}"
    then:
      - id: notify_slack_alert
        type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
        description: Dispatch Slack notification with markdown block layout detailing the anomaly.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        runIf: "{{ inputs.send_slack_alert }}"
        payload: |
          {
            "text": "ALERT: OpenTelemetry GenAI span anomaly detected in execution {{ execution.id }}",
            "blocks": [
              {
                "type": "header",
                "text": {
                  "type": "plain_text",
                  "text": "OpenTelemetry GenAI Anomaly Alert",
                  "emoji": false
                }
              },
              {
                "type": "section",
                "fields": [
                  {
                    "type": "mrkdwn",
                    "text": "*Flow ID:*\n`{{ flow.id }}`"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "*Execution ID:*\n`{{ execution.id }}`"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "*Total Spans Processed:*\n{{ outputs.ingest_otel_traces.total_spans }}"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "*Peak Span Tokens:*\n{{ outputs.ingest_otel_traces.max_tokens }} (Threshold: {{ inputs.token_anomaly_threshold }})"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "*Error Spans Count:*\n{{ outputs.ingest_otel_traces.error_count }}"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "*Destination Table:*\n`{{ inputs.bq_project }}.{{ inputs.bq_dataset }}.{{ inputs.bq_table }}`"
                  }
                ]
              },
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*Diagnostic Assessment:*\nOne or more OpenTelemetry GenAI spans exceeded the consumption threshold of {{ inputs.token_anomaly_threshold }} tokens or recorded non-OK status codes during trace batch processing. Compacted Parquet traces have been loaded into BigQuery for forensic analytics."
                }
              }
            ]
          }

errors:
  - id: log_pipeline_failure
    type: io.kestra.plugin.core.log.Log
    description: Record pipeline failure context and execution metadata.
    message: "Pipeline execution {{ execution.id }} failed in flow {{ flow.id }} under namespace {{ flow.namespace }}."

  - id: alert_pipeline_failure
    type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
    description: Dispatch critical alert to Slack when pipeline fails.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    runIf: "{{ inputs.send_slack_alert }}"
    payload: |
      {
        "text": "CRITICAL: OpenTelemetry Lakehouse Pipeline failed in flow {{ flow.id }} (execution {{ execution.id }}). Please inspect task logs in Kestra console."
      }

extend:
  shortDescription: "Compact raw OTel GenAI traces with in-memory DuckDB into Parquet and stream to BigQuery with token anomaly alerts."
  title: OpenTelemetry GenAI & Trace Telemetry Pipeline to BigQuery via DuckDB
  metaTitle: OpenTelemetry GenAI Trace Pipeline to BigQuery via DuckDB
  metaDescription: Compact raw OTel GenAI traces with in-memory DuckDB into Parquet and stream to BigQuery with token anomaly alerts.
  description: |
    Collect and compact raw OpenTelemetry JSON traces into columnar Snappy Parquet using in-memory DuckDB, ingest into a day-partitioned and clustered Google BigQuery lakehouse table, and evaluate GenAI token consumption against anomaly thresholds.

    Observability pipelines for Generative AI applications frequently generate massive volumes of detailed trace spans recording model identifiers, prompt lengths, completion tokens, latency, and error states. Ingesting raw JSON lines directly into analytical data warehouses incurs significant storage overhead and costly scan operations. This blueprint solves this by employing an embedded DuckDB engine to compact raw JSON telemetry into optimized Snappy-compressed Parquet files in memory before loading them into BigQuery with day-partitioning on `timestamp` and clustering on `(service_name, model)`.

    ## How it works

    1. **Trigger Options**:
       - The `batch_telemetry_webhook` trigger (`io.kestra.plugin.core.trigger.Webhook`) allows OpenTelemetry collectors, FluentBit, or forwarder proxies to POST trace batches via HTTP endpoint using authentication key `otel-trace-ingest`.
       - The `hourly_compaction_schedule` trigger (`io.kestra.plugin.core.trigger.Schedule`) enables scheduled recurring compaction every hour (shipped disabled by default).
    2. **Ingestion & Validation (`ingest_otel_traces`)**:
       - A lightweight Python task generates or processes OpenTelemetry trace spans formatted in accordance with OpenTelemetry GenAI semantic conventions (`gen_ai.request.model`, `gen_ai.usage.input_tokens`, `gen_ai.usage.output_tokens`, `gen_ai.response.finish_reasons`, `duration_ms`, `service_name`, `status_code`).
       - Calculates batch metrics including total spans, peak token consumption, and error counts, exposing them via Kestra outputs.
    3. **In-Memory Compaction (`compact_traces_to_parquet`)**:
       - Uses `io.kestra.plugin.duckdb.Query` to read the raw newline-delimited JSON traces using `read_json_auto()`.
       - Flattens nested JSON attributes and executes a `COPY ... TO ... (FORMAT PARQUET, CODEC 'SNAPPY')` statement directly in memory, exporting an optimized Parquet file to Kestra internal storage.
    4. **Warehouse Load (`load_parquet_to_bigquery`)**:
       - Uses `io.kestra.plugin.gcp.bigquery.Load` to append the Snappy Parquet file into the designated BigQuery table.
       - Enforces day-partitioning on the `timestamp` column (`timePartitioningField: "timestamp"`, `timePartitioningType: "DAY"`) and clusters by `["service_name", "model"]` to minimize downstream query scan costs.
    5. **Flow Control & Anomaly Alerting (`evaluate_anomalies`)**:
       - An `io.kestra.plugin.core.flow.If` task evaluates whether the maximum token consumption exceeded `token_anomaly_threshold` or if errors occurred in the batch.
       - When triggered and `send_slack_alert` is true, dispatches a Slack block kit message via `io.kestra.plugin.notifications.slack.SlackIncomingWebhook` summarizing the incident.
    6. **Error Handling (`errors`)**:
       - A flow-level error handler logs execution failures and delivers failure alerts to Slack if enabled.

    ## What you get

    - Substantial cloud storage and query cost reductions by converting JSON to Snappy Parquet before loading.
    - Day-partitioned and clustered BigQuery tables optimized for observability dashboards, cost attribution, and SRE incident triage.
    - Automated detection and Slack alerting for runaway LLM prompt loops, large context spills, and API rate-limiting spikes.
    - Full end-to-end execution lineage and audit history in Kestra.

    ## Who it's for

    - Platform Engineers and SREs monitoring production Generative AI deployments and microservice meshes.
    - FinOps teams tracking LLM token expenditure across models, teams, and services.
    - Data Engineers building lakehouse architectures on Google Cloud Platform without standing up permanent streaming infrastructure.

    ## Why orchestrate this with Kestra

    Building telemetry ingestion with custom microservices or standing up Spark/Flink clusters incurs significant operational maintenance and infrastructure costs. Kestra provides a serverless, declarative approach that couples event-driven webhooks, scheduled micro-batching, in-memory embedded query engines like DuckDB, and native BigQuery loader tasks with enterprise-grade error handling and secret governance.

    ## Prerequisites

    - A Google Cloud Platform (GCP) project with the BigQuery API enabled.
    - A BigQuery dataset created (or service account permissions to allow `createDisposition: CREATE_IF_NEEDED`).
    - An active Slack Incoming Webhook URL (if notifications are enabled).

    ### Secrets

    - `GCP_SERVICE_ACCOUNT_JSON`: Service account private key JSON with `roles/bigquery.dataEditor` and `roles/bigquery.jobUser` IAM roles.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL for alert delivery (required if `send_slack_alert` is set to `true`).

    ## Inputs

    | Name | Type | Default | Description |
    | :--- | :--- | :--- | :--- |
    | `gcs_bucket` | STRING | `company-telemetry-lake` | Google Cloud Storage bucket containing raw OpenTelemetry JSON traces. |
    | `gcs_prefix` | STRING | `traces/raw/` | Object prefix path for incoming raw trace files. |
    | `bq_project` | STRING | `company-analytics` | Google Cloud project ID hosting BigQuery. |
    | `bq_dataset` | STRING | `observability` | Target BigQuery dataset name. |
    | `bq_table` | STRING | `otel_genai_spans` | Target BigQuery table for compacted spans. |
    | `token_anomaly_threshold` | INT | `50000` | Token consumption ceiling above which alerts are raised. |
    | `send_slack_alert` | BOOLEAN | `false` | Enable or disable Slack alerting. |

    ## Quick start runbook

    1. Configure the `GCP_SERVICE_ACCOUNT_JSON` secret in your Kestra namespace with BigQuery permissions.
    2. (Optional) Configure `SLACK_WEBHOOK_URL` in your namespace secrets if alerting is desired.
    3. Run the workflow manually from the Kestra UI to verify trace generation, DuckDB Parquet compaction, and BigQuery loading.
    4. To enable scheduled batch execution, edit the workflow and set `disabled: false` on the `hourly_compaction_schedule` trigger.
    5. To ingest live traces from OpenTelemetry Collectors, configure an HTTP exporter in your `otel-collector-config.yaml` pointing to the Kestra webhook URL using header `key: otel-trace-ingest`.

    ## How to extend

    - Add a downstream dbt task (`io.kestra.plugin.dbt.cli.DbtCLI`) to transform raw spans into hourly cost-per-service aggregations.
    - Connect Grafana or Looker Studio to the clustered BigQuery table to visualize token latency P99 and token budget burn rates.
    - Incorporate data loss prevention or PII redaction rules within the DuckDB SQL compaction stage before writing Parquet files.

    ## Links

    - [Kestra BigQuery Plugin Documentation](https://kestra.io/plugins/plugin-gcp/bigquery)
    - [Kestra DuckDB Plugin Documentation](https://kestra.io/plugins/plugin-jdbc-duckdb)
    - [Kestra Slack Notifications Plugin](https://kestra.io/plugins/plugin-notifications)
    - [OpenTelemetry Semantic Conventions for GenAI](https://opentelemetry.io/docs/specs/semconv/gen-ai/)
  tags:
    - Data
    - AI
    - Cloud
  subTags:
    - ELT & Warehouse Loading
    - GCP Services
  ee: false
  demo: false
