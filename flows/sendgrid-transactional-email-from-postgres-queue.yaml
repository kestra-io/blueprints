id: sendgrid-transactional-email-from-postgres-queue
namespace: company.team

description: |
  Reads pending email jobs from a PostgreSQL queue table, dispatches each message
  through the SendGrid v3 Mail Send API in parallel, then marks every row
  as sent or failed and surfaces a per-run summary. Runs on a configurable
  schedule so no notification is delayed.

inputs:
  - id: batch_size
    type: INT
    displayName: Batch Size
    description: Maximum number of pending emails to process in one execution.
    defaults: 50
    min: 1
    max: 200

  - id: from_email
    type: STRING
    displayName: Sender Email
    description: Verified sender address registered in your SendGrid account.
    defaults: "notifications@example.com"

  - id: from_name
    type: STRING
    displayName: Sender Name
    description: Display name shown to recipients.
    defaults: "Acme Notifications"

variables:
  jdbc_url: "jdbc:postgresql://{{ secret('POSTGRES_HOST') }}:5432/{{ secret('POSTGRES_DB') }}"

tasks:
  - id: fetch_pending
    type: io.kestra.plugin.jdbc.postgresql.Query
    url: "{{ vars.jdbc_url }}"
    username: "{{ secret('POSTGRES_USER') }}"
    password: "{{ secret('POSTGRES_PASSWORD') }}"
    sql: |
      SELECT id, to_email, to_name, subject, body_text
      FROM email_queue
      WHERE status = 'pending'
      ORDER BY created_at ASC
      LIMIT {{ inputs.batch_size }};
    fetchType: FETCH
    store: true

  - id: send_batch
    type: io.kestra.plugin.core.flow.EachParallel
    value: "{{ outputs.fetch_pending.rows }}"
    tasks:
      - id: send_email
        type: io.kestra.plugin.core.http.Request
        uri: https://api.sendgrid.com/v3/mail/send
        method: POST
        headers:
          Authorization: "Bearer {{ secret('SENDGRID_API_KEY') }}"
          Content-Type: application/json
        body: |
          {
            "personalizations": [{
              "to": [{"email": "{{ taskrun.value.to_email }}", "name": "{{ taskrun.value.to_name }}"}]
            }],
            "from": {"email": "{{ inputs.from_email }}", "name": "{{ inputs.from_name }}"},
            "subject": "{{ taskrun.value.subject }}",
            "content": [{"type": "text/plain", "value": "{{ taskrun.value.body_text }}"}]
          }
        allowFailed: true

      - id: update_row
        type: io.kestra.plugin.jdbc.postgresql.Query
        url: "{{ vars.jdbc_url }}"
        username: "{{ secret('POSTGRES_USER') }}"
        password: "{{ secret('POSTGRES_PASSWORD') }}"
        sql: |
          UPDATE email_queue
          SET
            status      = CASE WHEN {{ outputs.send_email.code }} = 202 THEN 'sent' ELSE 'failed' END,
            http_status = {{ outputs.send_email.code }},
            processed_at = NOW()
          WHERE id = '{{ taskrun.value.id }}';

  - id: summarise
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.11-slim
    script: |
      import json

      rows = json.loads('{{ outputs.fetch_pending.rows | json }}')
      total = len(rows)
      print(f"Processed {total} email job(s) from the queue in this execution.")
      print(f"Check email_queue for per-row http_status codes.")

errors:
  - id: on_failure
    type: io.kestra.plugin.core.log.Log
    message: "sendgrid-transactional-email-from-postgres-queue failed: {{ errorLogs() }}"

triggers:
  - id: every_5_minutes
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/5 * * * *"
    disabled: true

extend:
  title: "Send Transactional Emails via SendGrid from a PostgreSQL Queue"
  metaTitle: "SendGrid Transactional Email Pipeline from PostgreSQL | Kestra"
  shortDescription: "Poll a PostgreSQL email_queue table, dispatch each pending message through the SendGrid v3 API in parallel, and mark each row sent or failed."
  metaDescription: "Automate transactional email delivery using Kestra, PostgreSQL, and SendGrid. Batch-processes pending rows, sends in parallel, and updates delivery status."
  description: |
    ## Overview
    This flow implements a reliable, queue-based transactional email pipeline.
    Application code inserts rows into a PostgreSQL `email_queue` table; Kestra
    drains the queue every 5 minutes, fans out to the SendGrid v3
    `POST /v3/mail/send` endpoint in parallel, then writes the HTTP response code
    and a `sent`/`failed` status back to every row. Nothing is lost: messages that
    receive a non-202 response stay in `failed` state and can be retried by
    re-setting their status to `pending`.

    ## How it works

    1. **fetch_pending** — `io.kestra.plugin.jdbc.postgresql.Query` selects up to
       `batch_size` rows from `email_queue` where `status = 'pending'`, ordered by
       `created_at` to guarantee first-in-first-out delivery.
    2. **send_batch** — `io.kestra.plugin.core.flow.EachParallel` iterates every
       fetched row concurrently. For each row:
       - **send_email** calls `POST https://api.sendgrid.com/v3/mail/send` with a
         JSON payload built from the row fields. `allowFailed: true` prevents a
         single bad address from aborting the whole batch.
       - **update_row** writes the HTTP status code back to `email_queue` and sets
         `status` to `sent` (HTTP 202) or `failed` (anything else).
    3. **summarise** — a short Python task logs the total rows processed.
    4. **on_failure** — an error handler logs the exception details so the on-call
       team can diagnose queue blockages.
    5. **every_5_minutes** — a Schedule trigger ships disabled; enable it once the
       table schema and secrets are configured.

    ## What you get

    - Reliable at-least-once delivery: rows that fail remain in `failed` state and
      are trivially retried by flipping `status` back to `pending`.
    - Zero cold-start latency: Kestra wakes up on schedule, no always-on worker
      process needed.
    - Per-message auditability: the HTTP status code is stored against every row.
    - Configurable throughput: adjust `batch_size` to match your SendGrid plan rate
      limits.

    ## Who it's for

    - Backend and Platform engineers who need reliable transactional email delivery
      without operating a dedicated email microservice.

    ## Why orchestrate this with Kestra

    - Eliminates the need for a long-running email worker process.
    - Execution history, retry logic, and alerting are built-in.
    - Secrets (API key, DB credentials) are masked in logs automatically.

    ## Prerequisites

    - A PostgreSQL database with an `email_queue` table:
      ```sql
      CREATE TABLE email_queue (
        id          UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        to_email    TEXT NOT NULL,
        to_name     TEXT NOT NULL DEFAULT '',
        subject     TEXT NOT NULL,
        body_text   TEXT NOT NULL,
        status      TEXT NOT NULL DEFAULT 'pending',
        http_status INT,
        created_at  TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        processed_at TIMESTAMPTZ
      );
      ```
    - A SendGrid account with a verified sender domain and an API key with **Mail Send** permission.

    ### Secrets

    - `POSTGRES_HOST`: PostgreSQL hostname.
    - `POSTGRES_DB`: Database name.
    - `POSTGRES_USER`: Database username.
    - `POSTGRES_PASSWORD`: Database password.
    - `SENDGRID_API_KEY`: SendGrid API key with Mail Send scope.

    ## Quick start

    1. Create the `email_queue` table and configure the secrets above.
    2. Import this blueprint, run once manually with a test row in the table.
    3. Enable the `every_5_minutes` trigger.

    ## How to extend

    - Add HTML content by extending the `content` array in the SendGrid payload.
    - Store SendGrid Message-ID from the response header for tracking opens/clicks.
    - Add a `max_retries` column and skip rows that have failed more than N times.

    ## Links

    - [SendGrid v3 Mail Send API](https://docs.sendgrid.com/api-reference/mail-send/mail-send)
    - [Kestra PostgreSQL Plugin](https://kestra.io/plugins/plugin-jdbc-postgresql)
    - [Kestra HTTP Plugin](https://kestra.io/plugins/plugin-core#io.kestra.plugin.core.http.Request)
  tags:
    - Data
    - Business
  subTags:
    - Notifications
    - Database Operations
  ee: false
  demo: false
