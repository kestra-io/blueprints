id: restcountries-geopolitical-lakehouse-loader
namespace: company.analytics
description: Ingests international sovereign country demographics, currencies, and land area from REST Countries into Parquet lakehouse storage via DuckDB, tracking demographic changes in Kestra KV store.

inputs:
  - id: region
    type: STRING
    description: Geographic world region to harvest.
    defaults: europe

  - id: population_outlier_threshold
    type: INT
    description: Population count threshold to classify sovereign nations as demographic hubs.
    defaults: 20000000

  - id: state_key
    type: STRING
    description: Kestra KV store key maintaining the latest known population state per country code.
    defaults: restcountries_monitored_population_state

variables:
  default_state: "{}"

triggers:
  - id: monthly_demographics_sync
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 4 1 * *"

tasks:
  - id: get_current_state
    type: io.kestra.plugin.core.kv.Get
    key: "{{ inputs.state_key }}"
    errorOnMissing: false

  - id: ingest_and_transform_countries
    type: io.kestra.plugin.scripts.python.Commands
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install requests duckdb
    commands:
      - |
        python3 - << 'EOF'
        import os
        import json
        import requests
        import duckdb
        from datetime import datetime

        raw_state = """{{ outputs.get_current_state.value ?? vars.default_state }}"""
        try:
            state = json.loads(raw_state) if raw_state else {}
        except Exception:
            state = {}

        region = "{{ inputs.region }}"
        threshold = int("{{ inputs.population_outlier_threshold }}")

        url = f"https://restcountries.com/v3.1/region/{region}?fields=name,capital,population,currencies,cca3,area,region,subregion"
        headers = {"User-Agent": "KestraCountriesLakehouse/1.0 (demographics-ops@kestra.io)"}

        records = []
        demographic_hubs = []
        new_state = dict(state)

        try:
            resp = requests.get(url, headers=headers, timeout=20)
            if resp.status_code == 200:
                countries = resp.json()
                for c in countries:
                    name_obj = c.get("name", {})
                    common_name = name_obj.get("common", "")
                    official_name = name_obj.get("official", common_name)
                    cca3 = c.get("cca3", "")
                    capitals = ", ".join(c.get("capital", []))
                    pop = int(c.get("population", 0))
                    area = float(c.get("area", 0.0))
                    subregion = c.get("subregion", "")

                    curr_map = c.get("currencies", {})
                    curr_codes = ", ".join(curr_map.keys())

                    is_hub = pop >= threshold
                    prev_pop = state.get(cca3, pop)
                    pop_drift = pop - prev_pop

                    records.append({
                        "country_code": cca3,
                        "common_name": common_name,
                        "official_name": official_name,
                        "capital": capitals,
                        "population": pop,
                        "area_sq_km": area,
                        "currency_codes": curr_codes,
                        "subregion": subregion,
                        "is_demographic_hub": is_hub,
                        "population_drift": pop_drift,
                        "harvest_time": datetime.utcnow().isoformat()
                    })

                    if is_hub:
                        demographic_hubs.append({"country": common_name, "population": pop})

                    new_state[cca3] = pop
        except Exception as e:
            print(f"Error fetching REST Countries demographic dataset: {e}")

        with open("countries_dataset.json", "w", encoding="utf-8") as f:
            json.dump(records, f)

        con = duckdb.connect()
        if records:
            con.execute("CREATE TABLE countries AS SELECT * FROM read_json_auto('countries_dataset.json')")
            con.execute("COPY countries TO 'country_demographics.parquet' (FORMAT PARQUET)")
            con.execute("COPY countries TO 'country_demographics.csv' (HEADER, DELIMITER ',')")
        else:
            con.execute("""
                CREATE TABLE countries (
                    country_code VARCHAR,
                    common_name VARCHAR,
                    official_name VARCHAR,
                    capital VARCHAR,
                    population BIGINT,
                    area_sq_km DOUBLE,
                    currency_codes VARCHAR,
                    subregion VARCHAR,
                    is_demographic_hub BOOLEAN,
                    population_drift BIGINT,
                    harvest_time VARCHAR
                )
            """)
            con.execute("COPY countries TO 'country_demographics.parquet' (FORMAT PARQUET)")
            con.execute("COPY countries TO 'country_demographics.csv' (HEADER, DELIMITER ',')")

        summary = {
            "monitored_countries": len(records),
            "demographic_hubs_count": len(demographic_hubs),
            "demographic_hubs": demographic_hubs[:5],
            "updated_state": new_state
        }

        print(f"::{{'outputs': {json.dumps(summary)}}}::")
        EOF
    outputFiles:
      - country_demographics.parquet
      - country_demographics.csv

  - id: persist_state
    type: io.kestra.plugin.core.kv.Set
    key: "{{ inputs.state_key }}"
    value: "{{ outputs.ingest_and_transform_countries.vars.updated_state | toJson }}"

  - id: check_demographic_hubs
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.ingest_and_transform_countries.vars.demographic_hubs_count > 0 }}"
    then:
      - id: notify_hubs
        type: io.kestra.plugin.core.log.Log
        level: INFO
        message: "🌍 Demographic Lakehouse Audit: Identified {{ outputs.ingest_and_transform_countries.vars.demographic_hubs_count }} sovereign state(s) exceeding {{ inputs.population_outlier_threshold }} citizens."

outputs:
  - id: total_countries
    type: INT
    value: "{{ outputs.ingest_and_transform_countries.vars.monitored_countries }}"
  - id: demographic_hubs_count
    type: INT
    value: "{{ outputs.ingest_and_transform_countries.vars.demographic_hubs_count }}"
  - id: dataset_parquet
    type: FILE
    value: "{{ outputs.ingest_and_transform_countries.outputFiles['country_demographics.parquet'] }}"

extend:
  title: REST Countries Geopolitical Demographics Lakehouse Loader with DuckDB
  metaTitle: REST Countries Demographics Lakehouse Loader | Kestra
  shortDescription: Ingests international sovereign country demographics, currencies, and land area from REST Countries into Parquet lakehouse storage via DuckDB.
  metaDescription: Poll REST Countries API for sovereign demographics and currencies, convert regional metrics into Parquet via DuckDB, and track state in KV store.
  tags:
    - Data
  subTags:
    - ELT & Warehouse Loading
    - File & Data Processing Basics
  ee: false
  demo: false
  description: |
    Automate the collection, geopolitical harmonization, and analytical persistence of sovereign nation
    demographics, administrative capitals, official currencies, and territory land areas from REST Countries into Parquet using DuckDB.

    ## How it works

    1. **State Recovery**: Queries the Kestra KV store (`restcountries_monitored_population_state`) for previous demographic snapshots per country code.
    2. **REST Countries Extraction**: Queries the REST Countries endpoint (`restcountries.com/v3.1/region/{region}`) across configured continental jurisdictions.
    3. **DuckDB Harmonization**: Normalizes country codes, currency mappings, land surface areas, and capital cities into a relational schema inside Docker.
    4. **Analytical Lake Export**: Exports normalized geopolitical records into columnar Parquet and CSV files for spatial modeling and macroeconomic research.
    5. **Threshold Evaluation & State Commitment**: Evaluates regional demographic hubs and commits updated census numbers to Kestra KV store.

    ## What you get

    - Automated, scheduled collection of global geopolitical reference datasets.
    - Columnar Parquet datasets queryable with DuckDB, ClickHouse, Snowflake, or Athena.
    - Built-in KV state management providing idempotent execution and zero database requirements.

    ## Who it's for

    - International Trade and Macroeconomic Analysts building demographic indexes.
    - GIS Engineers managing master reference location dimensions in data warehouses.
    - Analytics Engineers building reproducible multi-cloud lakehouse pipelines.

    ## Why orchestrate this with Kestra

    - Built-in KV store maintains historical demographic states across runs without database infrastructure.
    - Ephemeral Docker execution guarantees reproducible, clean Python and DuckDB runtimes.
    - Declarative scheduled execution with automated error recovery and conditional logging.

    ## Prerequisites

    - Docker runner configured on the Kestra worker.
    - Outbound internet access to `restcountries.com`.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: (Optional) Webhook URL for alerting teams on demographic changes.

    ## Quick start

    1. Import this blueprint into your Kestra instance.
    2. Set your target `region` (e.g. `europe`, `asia`, `americas`).
    3. Click **Execute** to run an immediate harvest and generate the Parquet table.
    4. Enable the `monthly_demographics_sync` schedule for automated monthly updates.

    ## How to extend

    - Add an S3 or Google Cloud Storage step to partition monthly country snapshots.
    - Connect a foreign exchange API step to calculate GDP and currency purchasing parity.

    ## Links

    - [REST Countries API Documentation](https://restcountries.com/)
    - [DuckDB Documentation](https://duckdb.org/)
    - [Kestra Task Runners](https://kestra.io/docs/task-runners)
