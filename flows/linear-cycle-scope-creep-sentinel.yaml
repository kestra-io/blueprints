id: linear-cycle-scope-creep-sentinel
namespace: company.operations

inputs:
  - id: team_key
    type: STRING
    displayName: Linear Team Key
    defaults: "ENG"
    description: Linear team key identifier (e.g. 'ENG', 'OPS', 'CORE') whose current cycle is audited.

  - id: max_injected_issues_allowed
    type: INT
    displayName: Scope Buffer Injected Issues Tolerance
    defaults: 3
    description: Maximum allowable unplanned mid-sprint issues added to the cycle before alerting.

  - id: issues_batch_limit
    type: INT
    displayName: Cycle Issues Evaluation Limit
    defaults: 50
    description: Maximum number of active cycle issues to inspect per execution.

triggers:
  - id: daily_cycle_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: Daily weekday audit at 11:00 UTC to surface scope creep and mid-cycle task injections. Shipped disabled by default.
    cron: "0 11 * * 1-5"
    disabled: true

tasks:
  - id: fetch_current_cycle_issues
    type: io.kestra.plugin.graphql.Request
    description: Query Linear GraphQL API for issues in the current active cycle including cycle start date and issue addition timestamp.
    uri: "https://api.linear.app/graphql"
    headers:
      Authorization: "{{ secret('LINEAR_API_KEY') }}"
      Content-Type: "application/json"
      User-Agent: "Kestra-Linear-ScopeCreep-Sentinel/1.0"
    failOnGraphQLErrors: false
    allowFailed: true
    query: |
      query GetCycleIssues {
        issues(filter: { team: { key: { eq: "{{ inputs.team_key }}" } }, cycle: { current: true } }, first: {{ inputs.issues_batch_limit }}) {
          nodes {
            id
            identifier
            title
            url
            addedToCycleAt
            assignee {
              name
            }
            cycle {
              number
              startsAt
            }
          }
        }
      }

  - id: evaluate_scope_creep
    type: io.kestra.plugin.scripts.python.Script
    description: Compare issue addedToCycleAt timestamps against cycle start time to detect unplanned sprint injections.
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    env:
      ISSUES_DATA: "{{ outputs.fetch_current_cycle_issues.body | toJson }}"
    script: |
      import os
      import json
      from datetime import datetime, timezone, timedelta

      raw_data = json.loads(os.environ.get("ISSUES_DATA", "{}"))
      issues = ((raw_data.get("issues") or {}).get("nodes") or [])

      injected = []
      cycle_number = "Current"

      for issue in issues:
          cycle_info = issue.get("cycle") or {}
          cycle_number = cycle_info.get("number") or cycle_number
          cycle_start_str = cycle_info.get("startsAt")
          added_str = issue.get("addedToCycleAt")

          if not cycle_start_str or not added_str:
              continue

          try:
              cycle_start_dt = datetime.fromisoformat(cycle_start_str.replace("Z", "+00:00"))
              added_dt = datetime.fromisoformat(added_str.replace("Z", "+00:00"))
          except Exception:
              continue

          # If added more than 24 hours after the sprint started, it is unplanned injection
          if added_dt > (cycle_start_dt + timedelta(hours=24)):
              hours_after_start = int((added_dt - cycle_start_dt).total_seconds() // 3600)
              injected.append({
                  "identifier": issue.get("identifier"),
                  "title": issue.get("title"),
                  "url": issue.get("url"),
                  "assignee": (issue.get("assignee") or {}).get("name") or "Unassigned",
                  "hours_after_start": hours_after_start,
                  "added_date": added_str[:10]
              })

      summary_lines = [
          f"• *{item['identifier']}*: {item['title']} (Assignee: {item['assignee']}, added {item['hours_after_start']}h into sprint on {item['added_date']}) - <{item['url']}|View Issue>"
          for item in injected
      ]
      summary_text = "\\n".join(summary_lines) if summary_lines else "Zero unplanned sprint injections detected."

      output_payload = {
          "cycle_number": cycle_number,
          "injected_count": len(injected),
          "injected_issues": injected,
          "summary_text": summary_text
      }

      print(f'::{"outputs": {json.dumps(output_payload)}}::')

  - id: evaluate_creep_threshold
    type: io.kestra.plugin.core.flow.If
    description: Check whether mid-sprint unplanned injected issues exceed the allowable scope buffer.
    condition: "{{ outputs.evaluate_scope_creep.vars.injected_count > inputs.max_injected_issues_allowed }}"
    then:
      - id: alert_scope_creep
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatch high-priority Slack notification itemizing unplanned scope additions to Scrum Master and Engineering Leads.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "📈 *LINEAR SPRINT ALERT: Mid-Cycle Scope Creep Detected* 📈\n\n*Team:* `{{ inputs.team_key }}` (Cycle #{{ outputs.evaluate_scope_creep.vars.cycle_number }})\n*Unplanned Injected Issues:* {{ outputs.evaluate_scope_creep.vars.injected_count }}\n*Buffer Threshold:* > {{ inputs.max_injected_issues_allowed }} issues\n\n*Issues Injected Mid-Sprint:*\n{{ outputs.evaluate_scope_creep.vars.summary_text }}\n\n*Execution ID:* {{ execution.id }}\n*Action Required:* Team Lead or Scrum Master please review injected tasks and adjust sprint commitments to avoid team burnout."
          }
    else:
      - id: log_cycle_healthy
        type: io.kestra.plugin.core.log.Log
        description: Log clean operational status when sprint scope remains stable within buffer.
        message: "HEALTHY: Sprint scope is stable. Unplanned injected issues count is within tolerance."

  - id: log_audit_summary
    type: io.kestra.plugin.core.log.Log
    description: Record final audit metrics for agile velocity governance.
    message: "Linear cycle scope creep audit finished for team {{ inputs.team_key }}. Total injected issues: {{ outputs.evaluate_scope_creep.vars.injected_count }}."

errors:
  - id: alert_on_linear_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alert Engineering Operations if Linear GraphQL API returns an error or authentication fails.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "⚠️ *Linear Scope Creep Sentinel Error*: Execution `{{ execution.id }}` failed to query Linear cycle issues. Verify LINEAR_API_KEY validity."
      }

outputs:
  - id: status
    type: STRING
    value: "{{ outputs.evaluate_scope_creep.vars.injected_count > inputs.max_injected_issues_allowed ? 'SCOPE_CREEP_DETECTED' : 'HEALTHY' }}"
  - id: injected_count
    type: INT
    value: "{{ outputs.evaluate_scope_creep.vars.injected_count }}"

extend:
  title: Linear cycle scope creep and mid-sprint injection sentinel
  metaTitle: Linear Cycle Scope Creep Sentinel | Kestra
  shortDescription: Automated agile engineering sentinel that queries Linear GraphQL API for mid-sprint injected issues, alerting leads to unplanned scope creep.
  metaDescription: Audit Linear active cycle issues via GraphQL API for mid-sprint unplanned injections and alert engineering leads in Slack to prevent sprint scope creep.
  description: |
    Maintain predictable agile delivery and protect software engineering teams from burnout caused by uncontrolled sprint scope creep. In modern product engineering teams using Linear, team members, product managers, or executives frequently insert newly discovered bugs, customer requests, or unplanned feature tickets into an active sprint cycle days after planning concluded. Without visibility into these mid-cycle injections, sprint velocity estimates fail, committed deliverables are dropped, and team retro data becomes skewed. This blueprint executes a daily audit via Linear's GraphQL API (`io.kestra.plugin.graphql.Request`), compares issue addition timestamps against cycle start dates using Python evaluation, and alerts team leads in Slack when unplanned injections exceed the sprint buffer.

    ## How it works
    1. A `Schedule` trigger initiates a cycle scope audit every weekday at 11:00 UTC (shipped disabled by default).
    2. Task `fetch_current_cycle_issues` queries `https://api.linear.app/graphql` authenticated with `LINEAR_API_KEY`. It fetches active issues for the team's current cycle, extracting issue identifiers, titles, URLs, assignees, `addedToCycleAt` timestamps, and cycle `startsAt` times.
    3. Task `evaluate_scope_creep` (`io.kestra.plugin.scripts.python.Script`) calculates the time delta between `startsAt` and `addedToCycleAt`:
       - Issues added more than 24 hours after the sprint cycle began are classified as unplanned injections.
       - The task formats an itemized summary list and emits structured metrics via Kestra's stdout protocol.
    4. Task `evaluate_creep_threshold` (`io.kestra.plugin.core.flow.If`) delivers an urgent Slack notification if injected issues exceed `inputs.max_injected_issues_allowed`, or logs a healthy message if scope is stable.
    5. Top-level `errors` handler catches network issues or API authentication errors.

    ## What you get
    - Objective daily tracking of mid-sprint scope creep across engineering teams.
    - Protection of committed sprint goals and team capacity estimates.
    - Clickable Slack digests displaying exactly which issues were injected, by whom, and when.
    - Rich empirical data for sprint retrospectives and capacity planning.

    ## Who it's for
    - Scrum Masters, Agile Coaches, and Engineering Managers managing sprint cycles in Linear.
    - Technical Leads protecting team focus and sprint commitments.
    - Product Managers seeking transparency into unplanned work impact.

    ## Why orchestrate this with Kestra
    Detecting mid-sprint scope creep manually requires tedious checking of individual issue activity histories in Linear. Kestra provides automated, scheduled orchestration that queries Linear's GraphQL schema directly, evaluates timestamp differences mathematically in Python, and alerts team channels in Slack with zero maintenance overhead.

    ## Prerequisites
    - A Linear workspace with active cycles enabled for the target team.
    - A Linear API Key with read permissions.
    - A Slack Incoming Webhook URL.

    ### Secrets
    - `LINEAR_API_KEY`: Linear API key passed in the `Authorization` header.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL used to post scope creep alerts.

    ## Quick start
    1. Store your Linear API key and Slack webhook in Kestra Secrets (`LINEAR_API_KEY` and `SLACK_WEBHOOK_URL`).
    2. Set `team_key` to your Linear team slug (e.g. `ENG`).
    3. Adjust `max_injected_issues_allowed` (e.g. `3` issues) based on your team's planned scope buffer.
    4. Execute the flow manually in Kestra to confirm that active cycle issues are retrieved.
    5. Enable the `daily_cycle_audit` schedule to activate daily scope creep monitoring.

    ## How to extend
    - Compare story point estimates (estimate sum) of injected issues against the total cycle capacity.
    - Automatically label injected issues with an `"unplanned"` tag using a Linear GraphQL mutation.
    - Track sprint injection percentages over quarterly cycles in a corporate data warehouse.

    ## Links
    - [Linear GraphQL API: Cycles](https://developers.linear.app/docs/graphql/working-with-the-graphql-api#cycles)
    - [Kestra GraphQL Plugin](https://kestra.io/plugins/plugin-graphql)
    - [Kestra Python Script Task](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Notification Plugin](https://kestra.io/plugins/plugin-slack)
  tags:
    - Business
    - Infrastructure
  subTags:
    - Reporting & Digests
    - Incident Response
  ee: false
  demo: false
