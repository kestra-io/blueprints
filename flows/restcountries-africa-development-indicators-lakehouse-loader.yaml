id: restcountries-africa-development-lakehouse-loader
namespace: company.analytics
description: Ingests African sovereign state registries, regional economic communities, populations, and capital coordinates from REST Countries Africa into DuckDB, exports Parquet and analytics datasets, and manages sync state with Kestra KV store.

inputs:
  - id: state_key
    type: STRING
    description: Kestra KV store key tracking processed unique entity identifiers.
    defaults: restcountries-africa-development-lakehouse-loader_state

variables:
  default_state: "[]"

triggers:
  - id: periodic_sync
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 4 * * 1"

tasks:
  - id: get_current_state
    type: io.kestra.plugin.core.kv.Get
    key: "{{ inputs.state_key }}"
    errorOnMissing: false

  - id: ingest_and_transform
    type: io.kestra.plugin.scripts.python.Commands
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install requests duckdb
    commands:
      - |
        python3 - << 'PYEOF'
        import os
        import json
        import requests
        import duckdb
        from datetime import datetime, timezone

        raw_state = """{{ outputs.get_current_state.value ?? vars.default_state }}"""
        try:
            seen_ids = set(json.loads(raw_state))
        except Exception:
            seen_ids = set()

        url = "https://restcountries.com/v3.1/region/africa"
        headers = {"User-Agent": "KestraLakehouseLoader/1.0 (kestra-data-pipeline; contact@company.internal)"}

        resp = requests.get(url, headers=headers, timeout=30)
        resp.raise_for_status()
        data = resp.json()
        root_key = ""
        items = data.get(root_key, data) if root_key else data

        records = []
        now_iso = datetime.now(timezone.utc).isoformat()
        current_ids = []

        
        for item in items:
            cca3 = str(item.get('cca3', 'UNKNOWN'))
            current_ids.append(cca3)
            cname = item.get('name', {}).get('common', 'Unknown')
            subreg = item.get('subregion', 'Africa')
            capitals = item.get('capital', [])
            cap_str = capitals[0] if isinstance(capitals, list) and capitals else 'None'
            try:
                pop = int(item.get('population', 0))
            except Exception:
                pop = 0
            try:
                area = float(item.get('area', 0.0))
            except Exception:
                area = 0.0

            records.append({
                'cca3': cca3,
                'common_name': str(cname),
                'subregion': str(subreg),
                'capital': str(cap_str),
                'population': pop,
                'area_sq_km': area,
                'is_new': bool(cca3 not in seen_ids),
                'ingestion_timestamp': now_iso
            })
        

        con = duckdb.connect(database=":memory:")
        con.execute("""
            CREATE TABLE african_nations (
                cca3 VARCHAR,
                common_name VARCHAR,
                subregion VARCHAR,
                capital VARCHAR,
                population BIGINT,
                area_sq_km DOUBLE,
                is_new BOOLEAN,
                ingestion_timestamp VARCHAR
            );
        """)

        if records:
            con.execute("INSERT INTO african_nations SELECT * FROM read_json_auto(?)", [json.dumps(records)])

        con.execute("COPY african_nations TO 'african_nations.parquet' (FORMAT PARQUET, COMPRESSION ZSTD);")
        con.execute("""
            COPY (
                SELECT
                    subregion,
                    COUNT(*) AS sovereign_nations,
                    SUM(population) AS total_population,
                    AVG(population) AS avg_population
                FROM african_nations
                GROUP BY 1
                ORDER BY total_population DESC
            ) TO 'africa_by_subregion.csv' (HEADER, DELIMITER ',');
        """)

        new_count = con.execute("SELECT count(*) FROM african_nations WHERE is_new = true").fetchone()[0]
        total_count = con.execute("SELECT count(*) FROM african_nations").fetchone()[0]

        updated_ids = list(seen_ids.union(current_ids))
        with open("updated_state.json", "w") as f:
            json.dump(updated_ids, f)

        metrics = {
            "total_extracted": total_count,
            "new_entities": new_count,
            "synced_at": now_iso
        }
        with open("metrics.json", "w") as f:
            json.dump(metrics, f)

        print(f"Lakehouse sync complete. Processed {total_count} records ({new_count} newly observed).")
        PYEOF
    outputFiles:
      - african_nations.parquet
      - africa_by_subregion.csv
      - updated_state.json
      - metrics.json

  - id: update_state
    type: io.kestra.plugin.core.kv.Set
    key: "{{ inputs.state_key }}"
    value: "{{ read(outputs.ingest_and_transform.outputFiles['updated_state.json']) }}"

  - id: analyze_and_notify
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.ingest_and_transform.outputFiles['african_nations.parquet'] != null }}"
    then:
      - id: log_metrics
        type: io.kestra.plugin.core.log.Log
        message: "REST Countries Africa Indicators sync succeeded. Metrics: {{ read(outputs.ingest_and_transform.outputFiles['metrics.json']) }}"
