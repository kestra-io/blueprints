id: kubernetes-configmap-sha-drift-sentinel
namespace: company.data

inputs:
  - id: namespace
    type: STRING
    defaults: "default"
    description: Kubernetes namespace to audit for pod configuration drift.

tasks:
  - id: check_config_drift
    type: io.kestra.plugin.scripts.shell.Commands
    containerImage: bitnami/kubectl:latest
    commands:
      - |
        kubectl get deployments -n "{{ inputs.namespace }}" -o json > /tmp/deployments.json
        
        DEPLOYMENTS_TOTAL=$(jq '.items | length // 0' /tmp/deployments.json)
        UNHASHED_COUNT=$(jq '[.items[]? | select(.spec.template.metadata.annotations == null or (.spec.template.metadata.annotations | to_entries | map(select(.key | test("checksum|hash"; "i"))) | length == 0))] | length' /tmp/deployments.json)
        
        echo "::set-output name=deployments_total::$DEPLOYMENTS_TOTAL::"
        echo "::set-output name=unhashed_count::$UNHASHED_COUNT::"

  - id: evaluate_configuration_drift
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.check_config_drift.vars.unhashed_count | int > 0 }}"
    then:
      - id: notify_platform_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#kubernetes-alerts",
            "attachments": [
              {
                "color": "warning",
                "title": "⚠️ Kubernetes Deployment Config Drift Risk",
                "text": "Namespace `{{ inputs.namespace }}` has *{{ outputs.check_config_drift.vars.unhashed_count }}* Deployments (out of *{{ outputs.check_config_drift.vars.deployments_total }}*) lacking config checksum annotations! Impact: When ConfigMaps or Secrets are updated, pods will NOT automatically restart, leading to silent configuration drift, stale credentials, or split-brain application behavior.",
                "footer": "Kestra Kubernetes Sentinel • Config Drift"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#kubernetes-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ Kubernetes ConfigMap and Secret Hash Drift Sentinel Pipeline Failure",
            "text": "Failed to inspect Kubernetes deployments for configuration drift. Check cluster access.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  title: Kubernetes ConfigMap and Secret Hash Drift Sentinel
  shortDescription: Audits Kubernetes Deployment annotations to detect unrolled ConfigMap/Secret changes and pod configuration drift.
  description: |
    ## How it works
    This workflow inspects Kubernetes Deployment pod templates (`spec.template.metadata.annotations`) for configuration hash annotations (such as `checksum/config`, `checksum/secret`, or Helm standard roll hashes). In Kubernetes, modifying a ConfigMap or Secret does not trigger a rolling restart of existing pods unless a pod template hash changes. Workloads lacking checksum annotations suffer from silent config drift and stale configurations. When unhashed deployments are found, Slack is alerted.

    ## What you get
    - Automated detection of Kubernetes Deployments vulnerable to silent configuration drift.
    - Ensures all microservices reload configuration changes reliably upon GitOps deployment.
    - Prevents split-brain environments where newly spawned pods have new config while older pods run stale config.

    ## Who it's for
    - SREs and Platform Engineers enforcing GitOps best practices across Kubernetes clusters.
    - DevOps engineers deploying Helm charts and Kustomize overlays.

    ## Why orchestrate this with Kestra
    - **GitOps Governance**: Enforce configuration reloading standards continuously.
    - **Native Kubectl Tooling**: Uses standard Kubernetes API primitives without custom admission controllers.
    - **Clear Actionable Guidance**: Pinpoints exactly which deployments need checksum annotations.

    ## Prerequisites
    - Kubernetes cluster with read permissions to Deployments in target namespace.
    - Secret `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import the blueprint into Kestra.
    2. Specify the target namespace.
    3. Run the workflow to inspect deployment annotations.

    ## How to extend
    - Automatically trigger `kubectl rollout restart deployment/<name>` when ConfigMap modifications are detected.
    - Expand audit across all cluster namespaces using EachParallel.

    ## Links
    - [Kubernetes Pod Template Annotations](https://kubernetes.io/docs/concepts/workloads/controllers/deployment/#pod-template-hash-label)
    - [Kestra Shell Plugin](https://kestra.io/plugins/plugin-scripts/commands/io.kestra.plugin.scripts.shell.commands)
  tags:
    - Infrastructure
    - Cloud
  ee: false
  demo: false
