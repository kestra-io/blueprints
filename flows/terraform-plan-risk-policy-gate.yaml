id: terraform-plan-risk-policy-gate
namespace: company.team
description: |
  Evaluate Terraform execution plans before deployment to classify infrastructure blast
  radius and detect destructive or stateful changes. Automatically post risk summaries
  to Slack and enforce policy gates to block high-risk plans from reaching production.

triggers:
  - id: on_iac_plan_request
    type: io.kestra.plugin.core.trigger.Webhook
    description: Webhook endpoint triggered by CI/CD pipelines (e.g., GitHub Actions, GitLab CI) on pull requests to evaluate Terraform plan risk.
    key: "{{ secret('TERRAFORM_PLAN_WEBHOOK_KEY') }}"

inputs:
  - id: environment
    type: STRING
    defaults: production
    description: Target deployment environment (e.g., production, staging, development).

  - id: max_allowed_deletions
    type: INT
    defaults: 0
    description: Maximum number of resource deletions (DELETE actions) permitted before escalating policy risk to CRITICAL.

  - id: fail_on_high_risk
    type: BOOL
    defaults: false
    description: Whether to fail pipeline execution when risk level is CRITICAL or HIGH (deployment policy gate). When false (default for safe out-of-the-box audit and demo runs), high-risk plans log a warning without failing the flow execution. Set to true in CI/CD pipelines to enforce automated deployment blocking.

  - id: notify_slack
    type: BOOL
    defaults: false
    description: Whether to send a risk alert to Slack when risk level is CRITICAL or HIGH.

  - id: terraform_code
    type: STRING
    defaults: |
      terraform {
        required_providers {
          local = {
            source  = "hashicorp/local"
            version = "2.5.2"
          }
          random = {
            source  = "hashicorp/random"
            version = "3.6.3"
          }
        }
      }

      resource "random_id" "server_id" {
        byte_length = 8
      }

      resource "local_file" "app_manifest" {
        filename = "app_manifest.json"
        content = jsonencode({
          service     = "order-processing"
          environment = "production"
          version     = "1.2.0"
        })
      }
    description: Terraform HCL configuration to evaluate. In CI/CD pipelines, this can be injected dynamically or mounted from a checked-out repository.

tasks:
  - id: terraform_workspace
    type: io.kestra.plugin.core.flow.WorkingDirectory
    description: Isolated workspace containing Terraform configuration and generated plan artifacts.
    inputFiles:
      main.tf: "{{ inputs.terraform_code }}"
    tasks:
      - id: plan_infrastructure
        type: io.kestra.plugin.terraform.cli.TerraformCLI
        description: Initialize Terraform and generate execution plan in binary and JSON formats.
        taskRunner:
          type: io.kestra.plugin.scripts.runner.docker.Docker
        containerImage: hashicorp/terraform:1.9.8
        beforeCommands:
          - terraform init -input=false -no-color
        commands:
          - terraform plan -input=false -no-color -out=tfplan
          - terraform show -json tfplan > plan.json
        outputFiles:
          - plan.json

      - id: analyze_plan_risk
        type: io.kestra.plugin.scripts.python.Script
        description: Parse plan.json to deterministically classify resource changes, stateful destruction, and blast radius.
        taskRunner:
          type: io.kestra.plugin.core.runner.Process
        env:
          MAX_ALLOWED_DELETIONS: "{{ inputs.max_allowed_deletions }}"
          ENVIRONMENT: "{{ inputs.environment }}"
        script: |
          import json
          import os
          import sys

          # Stateful resource suffixes and type patterns
          STATEFUL_KEYWORDS = [
              "db_instance", "rds_cluster", "dynamodb_table", "sql_database",
              "database_instance", "cosmosdb_", "mongodb_", "redis_instance",
              "elasticache_cluster", "s3_bucket", "storage_bucket", "storage_container",
              "gcs_bucket", "ebs_volume", "persistent_disk", "compute_disk",
              "managed_disk", "persistent_volume", "postgresql_server", "mysql_server",
              "mssql_database", "mssql_server", "mariadb_server"
          ]

          # Major compute and networking infrastructure types
          MAJOR_INFRA_TYPES = {
              "aws_instance", "aws_eks_cluster", "aws_ecs_cluster",
              "google_compute_instance", "google_container_cluster",
              "azurerm_linux_virtual_machine", "azurerm_windows_virtual_machine",
              "azurerm_kubernetes_cluster", "aws_vpc", "aws_subnet",
              "aws_nat_gateway", "aws_internet_gateway", "aws_route_table",
              "aws_security_group", "google_compute_network", "google_compute_subnetwork",
              "azurerm_virtual_network", "azurerm_subnet", "azurerm_network_security_group"
          }

          def is_stateful(res_type: str) -> bool:
              res_lower = res_type.lower()
              return any(kw in res_lower for kw in STATEFUL_KEYWORDS)

          def is_major_infra(res_type: str) -> bool:
              return res_type in MAJOR_INFRA_TYPES

          plan_file = "plan.json"
          if not os.path.exists(plan_file):
              print(f"[ERROR] Plan artifact '{plan_file}' not found.", file=sys.stderr)
              sys.exit(1)

          try:
              with open(plan_file, "r", encoding="utf-8") as f:
                  plan_data = json.load(f)
          except Exception as exc:
              print(f"[ERROR] Failed to parse {plan_file} as valid JSON: {exc}", file=sys.stderr)
              sys.exit(1)

          # In Terraform JSON plan format (version 1.0+), a valid plan must contain format_version and resource_changes
          if "format_version" not in plan_data:
              print("[ERROR] Invalid plan format: missing 'format_version' metadata.", file=sys.stderr)
              sys.exit(1)

          if "resource_changes" not in plan_data:
              print("[ERROR] Invalid plan format: missing required 'resource_changes' property.", file=sys.stderr)
              sys.exit(1)

          resource_changes = plan_data.get("resource_changes")
          if not isinstance(resource_changes, list):
              print(f"[ERROR] Invalid plan format: 'resource_changes' must be a list, got {type(resource_changes).__name__}.", file=sys.stderr)
              sys.exit(1)

          max_allowed_deletions = int(os.environ.get("MAX_ALLOWED_DELETIONS", 0))
          environment = os.environ.get("ENVIRONMENT", "unknown")

          created_count = 0
          updated_count = 0
          deleted_count = 0
          replaced_count = 0
          stateful_deletions = 0
          stateful_replacements = 0
          major_infra_deletions = 0
          major_infra_replacements = 0

          destructive_details = []

          # HashiCorp Terraform specification defines exactly these action primitives
          VALID_ACTIONS = {"no-op", "create", "read", "update", "delete"}
          VALID_ACTION_SETS = {
              ("no-op",),
              ("read",),
              ("create",),
              ("update",),
              ("delete",),
              ("delete", "create"),
              ("create", "delete")
          }

          for idx, rc in enumerate(resource_changes):
              if not isinstance(rc, dict):
                  print(f"[ERROR] Malformed resource change entry at index {idx}: expected dict, got {type(rc).__name__}.", file=sys.stderr)
                  sys.exit(1)

              addr = str(rc.get("address", f"unknown_resource_{idx}"))
              res_type = str(rc.get("type", "unknown"))

              change = rc.get("change")
              if not isinstance(change, dict):
                  print(f"[ERROR] Malformed resource change for '{addr}': missing or non-dict 'change' object.", file=sys.stderr)
                  sys.exit(1)

              actions = change.get("actions")
              if not isinstance(actions, list) or len(actions) == 0:
                  print(f"[ERROR] Malformed resource change for '{addr}': 'actions' must be a non-empty list.", file=sys.stderr)
                  sys.exit(1)

              for act in actions:
                  if not isinstance(act, str) or act not in VALID_ACTIONS:
                      print(f"[ERROR] Unsupported or invalid action '{act}' for '{addr}'.", file=sys.stderr)
                      sys.exit(1)

              actions_tuple = tuple(actions)
              if actions_tuple not in VALID_ACTION_SETS:
                  print(f"[ERROR] Unsupported action combination {actions} for '{addr}'.", file=sys.stderr)
                  sys.exit(1)

              # Safe no-op or data source read
              if actions_tuple in (("no-op",), ("read",)):
                  continue

              # Replacement: both delete and create actions present (regardless of order)
              if "delete" in actions and "create" in actions:
                  replaced_count += 1
                  if is_stateful(res_type):
                      stateful_replacements += 1
                      destructive_details.append(f"{addr} ({res_type}) [STATEFUL REPLACEMENT]")
                  elif is_major_infra(res_type):
                      major_infra_replacements += 1
                      destructive_details.append(f"{addr} ({res_type}) [MAJOR INFRA REPLACEMENT]")
                  else:
                      destructive_details.append(f"{addr} ({res_type}) [REPLACEMENT]")
              elif "delete" in actions:
                  deleted_count += 1
                  if is_stateful(res_type):
                      stateful_deletions += 1
                      destructive_details.append(f"{addr} ({res_type}) [STATEFUL DELETION]")
                  elif is_major_infra(res_type):
                      major_infra_deletions += 1
                      destructive_details.append(f"{addr} ({res_type}) [MAJOR INFRA DELETION]")
                  else:
                      destructive_details.append(f"{addr} ({res_type}) [DELETION]")
              elif "create" in actions:
                  created_count += 1
              elif "update" in actions:
                  updated_count += 1

          total_destructive_changes = deleted_count + replaced_count
          total_changes = created_count + updated_count + deleted_count + replaced_count

          # Classify risk level (Policy Severity)
          if stateful_deletions > 0 or stateful_replacements > 0:
              risk_level = "CRITICAL"
              reason = f"Plan contains {stateful_deletions} stateful deletion(s) and {stateful_replacements} stateful replacement(s)."
          elif deleted_count > max_allowed_deletions:
              risk_level = "CRITICAL"
              reason = f"Resource deletions ({deleted_count}) exceed max_allowed_deletions threshold ({max_allowed_deletions})."
          elif major_infra_deletions > 0 or major_infra_replacements > 0:
              risk_level = "HIGH"
              reason = f"Plan contains destructive changes to major infrastructure ({major_infra_deletions + major_infra_replacements} resource(s))."
          elif total_destructive_changes >= 3:
              risk_level = "HIGH"
              reason = f"Plan contains {total_destructive_changes} destructive changes (large blast radius)."
          elif total_destructive_changes > 0:
              risk_level = "MEDIUM"
              reason = f"Plan contains {total_destructive_changes} permitted destructive change(s) within max_allowed_deletions threshold ({max_allowed_deletions})."
          elif updated_count > 0:
              risk_level = "MEDIUM"
              reason = f"Plan updates {updated_count} existing resource(s) in-place with zero deletions."
          elif created_count >= 5:
              risk_level = "MEDIUM"
              reason = f"Plan creates {created_count} new resources."
          elif created_count > 0:
              risk_level = "LOW"
              reason = f"Plan is purely additive: {created_count} resource(s) created with zero deletions or updates."
          else:
              risk_level = "LOW"
              reason = "Plan proposes zero infrastructure changes."

          # Classify blast radius (Infrastructure Impact Scope)
          if stateful_deletions > 0 or stateful_replacements > 0 or total_destructive_changes >= 5:
              blast_radius = "CRITICAL"
          elif major_infra_deletions > 0 or major_infra_replacements > 0 or total_destructive_changes > 0 or (created_count + updated_count) >= 10:
              blast_radius = "HIGH"
          elif updated_count > 0 or (created_count + updated_count) >= 3:
              blast_radius = "MEDIUM"
          elif created_count > 0:
              blast_radius = "LOW"
          else:
              blast_radius = "NONE"

          verdict = "BLOCKED" if risk_level in ["CRITICAL", "HIGH"] else ("WARNING" if risk_level == "MEDIUM" else "APPROVED")

          summary = f"Verdict: {verdict} | Risk: {risk_level} | Blast Radius: {blast_radius} | {reason}"
          if destructive_details:
              top_findings = destructive_details[:3]
              summary += f" Impacted: {'; '.join(top_findings)}"
              if len(destructive_details) > 3:
                  summary += f" (and {len(destructive_details) - 3} more)"

          print(f"[INFO] Plan Risk Analysis Complete for '{environment}':")
          print(f"  Risk Level: {risk_level} | Verdict: {verdict} | Blast Radius: {blast_radius}")
          print(f"  Created: {created_count} | Updated: {updated_count} | Deleted: {deleted_count} | Replaced: {replaced_count}")
          print(f"  Stateful Deletions: {stateful_deletions} | Stateful Replacements: {stateful_replacements}")

          output_payload = {
              "risk_level": risk_level,
              "verdict": verdict,
              "blast_radius": blast_radius,
              "created_count": created_count,
              "updated_count": updated_count,
              "deleted_count": deleted_count,
              "replaced_count": replaced_count,
              "stateful_deletions": stateful_deletions,
              "stateful_replacements": stateful_replacements,
              "total_destructive_changes": total_destructive_changes,
              "total_changes": total_changes,
              "summary": summary
          }

          print("::" + json.dumps({"outputs": output_payload}) + "::")

  - id: evaluate_risk_gate
    type: io.kestra.plugin.core.flow.If
    description: Evaluate risk classification against policy gates, triggering Slack alerts and failure conditions.
    condition: "{{ outputs.analyze_plan_risk.vars.risk_level in ['CRITICAL', 'HIGH'] }}"
    then:
      - id: check_slack_notification
        type: io.kestra.plugin.core.flow.If
        description: Dispatch Slack alert when notify_slack is enabled.
        condition: "{{ inputs.notify_slack }}"
        then:
          - id: send_slack_alert
            type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
            description: Send structured risk assessment summary to Slack.
            url: "{{ secret('SLACK_WEBHOOK_URL') }}"
            payload: |
              {
                "text": ":warning: *Terraform Plan Risk Policy Alert - {{ inputs.environment }}*\n• *Verdict:* `{{ outputs.analyze_plan_risk.vars.verdict }}`\n• *Risk Level:* `{{ outputs.analyze_plan_risk.vars.risk_level }}`\n• *Blast Radius:* `{{ outputs.analyze_plan_risk.vars.blast_radius }}`\n• *Destructive Changes:* `{{ outputs.analyze_plan_risk.vars.total_destructive_changes }}` (Deleted: {{ outputs.analyze_plan_risk.vars.deleted_count }}, Replaced: {{ outputs.analyze_plan_risk.vars.replaced_count }})\n• *Stateful Deletions:* `{{ outputs.analyze_plan_risk.vars.stateful_deletions }}`\n• *Summary:* {{ outputs.analyze_plan_risk.vars.summary }}\n• *Execution ID:* `{{ execution.id }}`"
              }

      - id: check_fail_gate
        type: io.kestra.plugin.core.flow.If
        description: Fail the flow execution if fail_on_high_risk gate is enabled.
        condition: "{{ inputs.fail_on_high_risk }}"
        then:
          - id: fail_gate
            type: io.kestra.plugin.core.execution.Fail
            description: Halt pipeline execution to block high-risk infrastructure deployment.
            errorMessage: >-
              Terraform Plan Risk Policy Gate FAILED for '{{ inputs.environment }}':
              Risk level {{ outputs.analyze_plan_risk.vars.risk_level }} exceeds policy threshold.
              {{ outputs.analyze_plan_risk.vars.summary }}
        else:
          - id: log_high_risk_warning
            type: io.kestra.plugin.core.log.Log
            description: Log high risk warning when fail_on_high_risk gate is disabled.
            message: >-
              [WARN] High-risk Terraform plan detected for '{{ inputs.environment }}'
              (Risk: {{ outputs.analyze_plan_risk.vars.risk_level }}, Blast Radius: {{ outputs.analyze_plan_risk.vars.blast_radius }}),
              but fail_on_high_risk is disabled. Continuing pipeline execution.

    else:
      - id: log_plan_approved
        type: io.kestra.plugin.core.log.Log
        description: Log plan approval when risk is within acceptable thresholds.
        message: >-
          [SUCCESS] Terraform plan risk policy gate PASSED for '{{ inputs.environment }}'.
          Risk: {{ outputs.analyze_plan_risk.vars.risk_level }}, Blast Radius: {{ outputs.analyze_plan_risk.vars.blast_radius }},
          Verdict: {{ outputs.analyze_plan_risk.vars.verdict }}.
          Created: {{ outputs.analyze_plan_risk.vars.created_count }}, Updated: {{ outputs.analyze_plan_risk.vars.updated_count }},
          Deleted: {{ outputs.analyze_plan_risk.vars.deleted_count }}, Replaced: {{ outputs.analyze_plan_risk.vars.replaced_count }}.

outputs:
  - id: risk_level
    type: STRING
    description: Policy severity classification level (CRITICAL, HIGH, MEDIUM, LOW).
    value: "{{ outputs.analyze_plan_risk.vars.risk_level }}"
  - id: verdict
    type: STRING
    description: Policy gate verdict (BLOCKED, WARNING, APPROVED).
    value: "{{ outputs.analyze_plan_risk.vars.verdict }}"
  - id: blast_radius
    type: STRING
    description: Estimated infrastructure impact scope (CRITICAL, HIGH, MEDIUM, LOW, NONE).
    value: "{{ outputs.analyze_plan_risk.vars.blast_radius }}"
  - id: created_count
    type: INT
    description: Count of resources to be newly created.
    value: "{{ outputs.analyze_plan_risk.vars.created_count }}"
  - id: updated_count
    type: INT
    description: Count of resources to be updated in-place.
    value: "{{ outputs.analyze_plan_risk.vars.updated_count }}"
  - id: deleted_count
    type: INT
    description: Count of resources to be destroyed.
    value: "{{ outputs.analyze_plan_risk.vars.deleted_count }}"
  - id: replaced_count
    type: INT
    description: Count of resources to be destroyed and recreated (replacement).
    value: "{{ outputs.analyze_plan_risk.vars.replaced_count }}"
  - id: stateful_deletions
    type: INT
    description: Count of stateful resources (databases, storage, persistent disks) scheduled for deletion.
    value: "{{ outputs.analyze_plan_risk.vars.stateful_deletions }}"
  - id: stateful_replacements
    type: INT
    description: Count of stateful resources scheduled for replacement.
    value: "{{ outputs.analyze_plan_risk.vars.stateful_replacements }}"
  - id: total_destructive_changes
    type: INT
    description: Total count of destructive operations (deletions plus replacements).
    value: "{{ outputs.analyze_plan_risk.vars.total_destructive_changes }}"
  - id: summary
    type: STRING
    description: Sanitized summary of the plan risk assessment.
    value: "{{ outputs.analyze_plan_risk.vars.summary }}"

extend:
  title: Automated Terraform Plan Blast-Radius & Stateful Destruction Gate
  metaTitle: Terraform Plan Risk & Blast-Radius Policy Gate on Kestra
  shortDescription: Analyze Terraform plan JSON for stateful destruction and blast radius before deployment, alert Slack, and enforce automated policy gates.
  metaDescription: Automatically analyze Terraform execution plans for stateful destruction and blast radius, alert Slack, and gate deployments with Kestra.
  tags:
    - Infrastructure
    - Core
  subTags:
    - Policy & Compliance
    - Infrastructure Automation
  ee: false
  demo: false
  description: |
    Accidental destruction of stateful infrastructure (such as production databases, persistent volumes, or object storage)
    is one of the most catastrophic incidents that can occur in cloud operations. While CI/CD pipelines commonly automate
    `terraform plan`, raw plan text often spans thousands of lines, burying destructive actions (`["delete"]` or `["delete", "create"]`)
    beneath harmless property additions or tag changes.

    Unlike manual approval pauses that halt workflows for human review or Infracost gates that only calculate dollar expenditure,
    this blueprint automatically evaluates the actual Terraform execution plan (`terraform show -json`). It deterministically
    inspects planned resource operations, flags stateful infrastructure destruction, classifies blast radius, delivers actionable
    Slack notifications, and enforces an automated deployment gate before changes reach production.

    ## Architecture

    ```
    Webhook Trigger
           ↓
    WorkingDirectory (Terraform Workspace)
           ↓
    TerraformCLI (init & plan -out=tfplan)
           ↓
    TerraformCLI (show -json tfplan > plan.json)
           ↓
    Python Risk Analyzer (Deterministic Blast-Radius Classification)
           ↓
    If [CRITICAL / HIGH Risk]
        ├── If [notify_slack]: Slack Webhook Notification
        └── If [fail_on_high_risk]: Fail Task (Halt Deployment)
           ↓
    Outputs (Risk Level, Verdict, Counts, Sanitized Summary)
    ```

    ## Policy Severity vs. Infrastructure Impact Scope

    The risk analyzer separates policy compliance from operational blast radius:
    - **Policy Severity (`risk_level`)**: Evaluates policy adherence (`CRITICAL`, `HIGH`, `MEDIUM`, `LOW`) to determine the policy gate verdict (`BLOCKED`, `WARNING`, `APPROVED`). Stateful destruction/replacements and resource deletions exceeding `max_allowed_deletions` escalate policy severity to `CRITICAL`.
    - **Impact Scope (`blast_radius`)**: Quantifies the physical footprint of proposed changes across the target cloud estate (`CRITICAL`, `HIGH`, `MEDIUM`, `LOW`, `NONE`). Reflects total destructive volume, major infrastructure touchpoints, and change magnitude regardless of policy thresholds.

    ### Policy Risk Levels

    - **CRITICAL**:
      - Deletion or replacement of stateful resources (e.g., databases, RDS clusters, DynamoDB tables, S3 buckets, GCS buckets, persistent disks, EBS volumes).
      - Resource deletions (`["delete"]`) exceeding `max_allowed_deletions` (default: `0`). Pure DELETE actions are governed by this threshold.
    - **HIGH**:
      - Deletion or replacement of major compute (e.g., EC2 instances, EKS/GKE clusters) or networking infrastructure (VPCs, subnets, NAT gateways, route tables).
      - Plans with 3 or more total destructive changes (large blast radius).
    - **MEDIUM**:
      - In-place resource updates (`["update"]`) without destruction.
      - Large volume of additions (5 or more new resources).
    - **LOW**:
      - Purely additive changes (`["create"]`) with zero deletions or updates.
      - Zero infrastructure changes (no-op).

    ## Deployment Gate & Override Modes

    The flow supports two operational modes controlled by `fail_on_high_risk`:
    - **Audit & Advisory Mode (`fail_on_high_risk: false`, default)**: When high-risk or stateful destruction is detected, the flow logs a high-severity warning and dispatches Slack notifications without halting execution. This intentional default allows safe ad-hoc evaluation, demos, and visibility without prematurely failing unconfigured pipelines.
    - **Enforcing Policy Gate Mode (`fail_on_high_risk: true`)**: Any plan evaluated as `CRITICAL` or `HIGH` risk triggers the `fail_gate` task (`io.kestra.plugin.core.execution.Fail`), immediately terminating execution with a non-zero exit code to halt automated CI/CD deployment pipelines.

    ## Actions and Replacements

    Terraform plans express actions as arrays:
    - `["create"]`: New resource addition.
    - `["update"]`: In-place modification.
    - `["delete"]`: Resource destruction.
    - `["delete", "create"]` or `["create", "delete"]`: Resource replacement (destroy then recreate). Replacements of stateful resources are categorized as `CRITICAL` risk because data loss can occur during recreate cycles.

    ## Security & Sensitive Data Handling

    Terraform execution plans can contain sensitive state attributes, environment variables, or secrets.
    To adhere to security best practices:
    - Raw `plan.json` files are never dumped into execution logs or notifications.
    - The Python analyzer extracts only safe metadata (`type`, `address`, `actions`).
    - Slack notifications contain only the sanitized risk metrics and high-level summary.

    ## CI/CD Pipeline Integration

    Trigger this blueprint from GitHub Actions, GitLab CI, or Jenkins upon pull request creation:

    ```bash
    curl -X POST "https://<your-kestra-host>/api/v1/executions/webhook/company.team/terraform-plan-risk-policy-gate/<TERRAFORM_PLAN_WEBHOOK_KEY>" \
      -H "Content-Type: application/json" \
      -d '{
        "inputs": {
          "environment": "production",
          "max_allowed_deletions": 0,
          "fail_on_high_risk": true,
          "notify_slack": true
        }
      }'
    ```

    ## Prerequisites & Secrets

    - **Container Engine**: Docker or container runner accessible to Kestra to execute the pinned `hashicorp/terraform:1.9.8` container image.
    - **TERRAFORM_PLAN_WEBHOOK_KEY** *(required for Webhook trigger)*: Secret key securing the `on_iac_plan_request` Webhook trigger. Must be set in namespace secrets to authorize incoming CI/CD HTTP webhook calls.
    - **SLACK_WEBHOOK_URL** *(optional)*: Required only when `notify_slack: true` is enabled.
    - **Cloud Provider Credentials** *(optional)*: When evaluating cloud infrastructure configurations (e.g., AWS, GCP, Azure), provide provider environment variables (such as `AWS_ACCESS_KEY_ID`, `GOOGLE_APPLICATION_CREDENTIALS`) to the Terraform task.
