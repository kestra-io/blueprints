id: checkov-infrastructure-as-code-security-and-compliance-gate
namespace: company.security

extend:
  title: Checkov Infrastructure as Code Security and Compliance Gate
  metaTitle: Checkov Infrastructure as Code Security and Compliance Gate
  shortDescription: Audit Terraform and Kubernetes manifests with Checkov to block high-severity misconfigurations and enforce cloud security policy.
  metaDescription: Enforce IaC compliance with Checkov. Scan Terraform and Kubernetes configurations, block critical security flaws, and extract Bridgecrew fix guidelines.
  description: |
    ## How it works
    This blueprint implements an automated security and compliance deployment gate for Infrastructure as Code (IaC) using `checkov`, the industry-standard policy-as-code scanner by Bridgecrew and Palo Alto Networks. It scans Terraform templates, Kubernetes manifests, CloudFormation, and Dockerfiles to prevent misconfigured cloud infrastructure from reaching production environments.

    The workflow executes across four orchestrated stages:
    1. **Ingest and Scan**: Receives an archive of infrastructure configurations via CI/CD webhook or manual upload. In an isolated container running `bridgecrew/checkov:latest`, it inspects all manifests with framework filtering (`checkov -d . --output json`).
    2. **Multi-Framework Policy Triage**: Parses single-framework and multi-framework JSON results. Findings are categorized into critical/high severity flaws (such as open security groups, unencrypted storage, or privileged container execution) versus medium/low hygiene advisories.
    3. **Gate Classification**: If any critical or high severity policy violation is detected (or if strict mode is enabled and medium violations exist), the gate classifies as `BLOCK_CRITICAL_IAC_VIOLATION`. If only medium or low advisories exist, it classifies as `WARN_MEDIUM_IAC_VIOLATION`. Clean infrastructure configurations evaluate to `PASS_COMPLIANT`.
    4. **Enforcement and Alerting**: Routes through a flow Switch task. Critical violations post an urgent Slack alert containing the resource identifier, failed rule ID, and official Bridgecrew remediation guideline URL, then halt the pipeline with a Fail task to prevent `terraform apply` or `kubectl apply`. Medium advisories notify Slack for sprint backlog remediation without blocking deployment. Clean scans log confirmation and pass immediately.

    ## What you get
    - **Automated Cloud Misconfiguration Prevention**: Detects unencrypted databases, public S3 buckets, missing Kubernetes security contexts, and permissive IAM roles before deployment.
    - **Remediation Guideline Links**: Directly captures Bridgecrew documentation URLs for each failing check, empowering engineers to fix policy violations immediately.
    - **Multi-Framework Coverage**: Evaluates Terraform, Kubernetes YAML, Dockerfiles, and Helm charts in a single unified orchestration flow.
    - **Audit-Ready Compliance Archiving**: Stores complete scanner reports (`checkov-report.json`) and structured decision summaries (`checkov-summary.json`) in Kestra internal storage for SOC2, CIS Benchmark, and PCI-DSS compliance audits.

    ## Who it's for
    - **Platform & Cloud Engineers**: Ensuring Terraform and OpenTofu modules adhere to organizational security baselines before state changes are applied.
    - **DevSecOps Teams**: Establishing automated guardrails across microservice repositories without manual pull request review bottlenecks.
    - **Kubernetes Administrators**: Enforcing Pod Security Standards, resource quotas, and read-only root filesystems across workload manifests.

    ## Why orchestrate this with Kestra
    - **Zero-Host Footprint**: Executes Checkov within ephemeral Docker containers without requiring Python dependencies or security tools on CI runners.
    - **Stateful Flow Control**: Separates blocking security gates from advisory notifications using native Switch and Return tasks.
    - **Encrypted Secret Management**: Secures Slack incoming webhook tokens and webhook authentication keys using encrypted Kestra secrets.
    - **Centralized Compliance Records**: Retains full execution logs, container outputs, and structured findings directly in Kestra for auditable compliance histories.

    ## Prerequisites
    - Docker daemon or container runtime accessible to the Kestra worker executing container tasks.
    - Slack Incoming Webhook URL configured for the target security triage channel.
    - Infrastructure codebase packaged as a `.tar.gz` archive containing Terraform (`.tf`), Kubernetes (`.yaml`), or Dockerfile manifests.

    ### Secrets
    Configure the following secrets in your Kestra namespace or key-value store:
    - `SLACK_WEBHOOK_URL`: Full Incoming Webhook URL for the Slack channel receiving compliance notifications.
    - `CHECKOV_GATE_WEBHOOK_KEY`: Shared authentication key required by the inbound webhook trigger.
    - `BC_API_KEY`: Prisma Cloud / Bridgecrew access key (a free Prisma Cloud Community Edition account provides one). Checkov's open-source output has no `severity` field on failed checks without this key, which collapses every finding into the critical/high bucket since there is nothing to distinguish a medium/low advisory. Passing `--bc-api-key` with this key is what makes the critical/high vs. medium/low split in this gate real.

    ## Quick start
    1. Create the required secrets `SLACK_WEBHOOK_URL`, `CHECKOV_GATE_WEBHOOK_KEY`, and `BC_API_KEY` in your Kestra namespace.
    2. Package your infrastructure repository into an archive: `tar -czf iac-bundle.tar.gz ./terraform ./k8s`.
    3. In the Kestra UI, navigate to this flow and click **Execute**.
    4. Under **Inputs**, upload `iac-bundle.tar.gz` to `iac_project_bundle`.
    5. Review the execution topology: inspect `classify_compliance_gate` to view the compliance breakdown and check Slack for the generated triage card.

    ## How to extend
    - **Terraform Plan Scanning**: Configure Checkov to evaluate compiled `tfplan.json` files instead of static HCL for state-aware policy checks.
    - **Automated Pull Request Comments**: Add an HTTP task in the `BLOCK_CRITICAL_IAC_VIOLATION` branch to post inline review comments directly to the GitHub or GitLab pull request.
    - **Custom Policy Enforcement**: Mount a custom directory of organization-specific Python or YAML policies using Checkov's `--external-checks-dir` option.

    ## Links
    - [Checkov Official Documentation](https://www.checkov.io/)
    - [Bridgecrew Policy Guidelines Index](https://docs.bridgecrew.io/docs)
    - [Kestra Shell Plugin](https://kestra.io/plugins/plugin-scripts-shell)
    - [Kestra Slack Plugin](https://kestra.io/plugins/plugin-notifications)
  tags:
    - Infrastructure
  subTags:
    - CI/CD & Deployment
    - Approval Gates
  ee: false
  demo: false

inputs:
  - id: iac_project_bundle
    type: FILE
    displayName: IaC Repository Archive
    description: Tarball (.tar.gz) containing the Terraform configurations, Kubernetes manifests, or Dockerfiles. When triggered by CI webhook, this is passed directly from the build step.
    required: false

  - id: strict_mode
    type: BOOL
    displayName: Strict Compliance Mode
    description: When true, fail the deployment gate for any policy violation (including medium and low severity). When false (recommended), only block critical and high severity flaws.
    required: false
    defaults: false

  - id: framework_filter
    type: SELECT
    displayName: Checkov Framework Filter
    description: Specific framework to scan. Defaults to 'all'.
    required: false
    values:
      - "all"
      - "terraform"
      - "kubernetes"
      - "dockerfile"
      - "cloudformation"
      - "helm"
    defaults: "all"

  - id: slack_channel
    type: STRING
    displayName: Slack Notification Channel
    description: Slack channel for infrastructure compliance notifications.
    required: false
    defaults: "#devsecops-alerts"

triggers:
  - id: scan_on_pr_webhook
    type: io.kestra.plugin.core.trigger.Webhook
    description: Webhook endpoint for GitHub Actions, GitLab CI, or deployment orchestrators to trigger the IaC compliance scan with the repository tarball.
    key: "{{ secret('CHECKOV_GATE_WEBHOOK_KEY') }}"
    fetchType: STORE
    disabled: true

tasks:
  - id: scan_iac_compliance
    type: io.kestra.plugin.scripts.shell.Commands
    description: Execute Checkov policy-as-code analysis against infrastructure manifests in a container and parse JSON findings.
    containerImage: bridgecrew/checkov:latest
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    allowFailure: true
    outputFiles:
      - checkov-summary.json
      - checkov-report.json
    commands:
      - |
        set -euo pipefail

        echo "Initializing Checkov IaC security analysis environment..."
        BUNDLE_PATH="{{ trigger.uri is defined ? trigger.uri : (inputs.iac_project_bundle is defined ? inputs.iac_project_bundle : '') }}"

        if [ -z "${BUNDLE_PATH}" ] || [ ! -f "${BUNDLE_PATH}" ]; then
          echo "No valid IaC repository archive provided. Emitting UNREACHABLE diagnostic status."
          cat <<'EOF' > checkov-summary.json
        {
          "gate_status": "UNREACHABLE",
          "total_resources": 0,
          "passed_checks": 0,
          "failed_checks": 0,
          "critical_high_count": 0,
          "medium_low_count": 0,
          "critical_findings": [],
          "advisory_findings": [],
          "error_message": "Repository bundle was missing or could not be located."
        }
        EOF
          touch checkov-report.json
          exit 0
        fi

        ORIGINAL_DIR="$(pwd)"
        mkdir -p /build/iac
        tar -xzf "${BUNDLE_PATH}" -C /build/iac
        cd /build/iac

        FRAMEWORK_INPUT="{{ inputs.framework_filter }}"
        FRAMEWORK_ARG=""
        if [ -n "${FRAMEWORK_INPUT}" ] && [ "${FRAMEWORK_INPUT}" != "all" ]; then
          FRAMEWORK_ARG="--framework ${FRAMEWORK_INPUT}"
        fi

        echo "Executing Checkov policy-as-code evaluation..."
        checkov -d /build/iac ${FRAMEWORK_ARG} --bc-api-key "{{ secret('BC_API_KEY') }}" --output json > /build/iac/checkov-report.json 2> /build/iac/checkov.log || true
        cp /build/iac/checkov-report.json "${ORIGINAL_DIR}/checkov-report.json"

        echo "Parsing Checkov findings with compliance gate classifier..."
        python3 - <<'PYEOF'
        import json
        import os
        import sys

        report_path = "checkov-report.json"

        data = {}
        if os.path.exists(report_path):
            try:
                with open(report_path, "r", encoding="utf-8", errors="ignore") as f:
                    data = json.load(f)
            except Exception:
                pass

        strict_mode = "{{ inputs.strict_mode }}".lower() == "true"
        framework_runs = data if isinstance(data, list) else ([data] if data else [])

        all_failed = []
        total_passed = 0
        total_failed = 0
        total_resources = 0

        for run in framework_runs:
            summary = run.get("summary", {})
            total_passed += summary.get("passed", 0)
            total_failed += summary.get("failed", 0)
            total_resources += summary.get("resource_count", 0)

            results = run.get("results", {})
            failed_checks = results.get("failed_checks", []) if results else []
            for fc in failed_checks:
                sev = str(fc.get("severity") or "HIGH").upper()
                all_failed.append({
                    "check_id": str(fc.get("check_id", "UNKNOWN")),
                    "check_name": str(fc.get("check_name", "Policy violation")),
                    "severity": sev,
                    "resource": str(fc.get("resource", "unknown")),
                    "file_path": str(fc.get("file_path", "unknown")),
                    "guideline": str(fc.get("guideline") or "")
                })

        critical_high = [c for c in all_failed if c["severity"] in ["CRITICAL", "HIGH"]]
        medium_low = [c for c in all_failed if c["severity"] not in ["CRITICAL", "HIGH"]]

        if critical_high or (strict_mode and medium_low):
            gate_status = "BLOCK_CRITICAL_IAC_VIOLATION"
        elif medium_low:
            gate_status = "WARN_MEDIUM_IAC_VIOLATION"
        else:
            gate_status = "PASS_COMPLIANT"

        summary_data = {
            "gate_status": gate_status,
            "total_resources": total_resources,
            "passed_checks": total_passed,
            "failed_checks": total_failed,
            "critical_high_count": len(critical_high),
            "medium_low_count": len(medium_low),
            "critical_findings": critical_high,
            "advisory_findings": medium_low
        }

        with open("checkov-summary.json", "w", encoding="utf-8") as out:
            json.dump(summary_data, out, indent=2)

        print(f"Checkov scan complete: {len(critical_high)} critical/high, {len(medium_low)} medium/low. Gate status: {gate_status}")
        PYEOF

        cp checkov-summary.json "${ORIGINAL_DIR}/checkov-summary.json"

  - id: classify_compliance_gate
    type: io.kestra.plugin.core.debug.Return
    description: Classifies scan results into BLOCK_CRITICAL_IAC_VIOLATION, WARN_MEDIUM_IAC_VIOLATION, PASS_COMPLIANT, or UNREACHABLE.
    format: "{{ outputs.scan_iac_compliance.outputFiles is defined and outputs.scan_iac_compliance.outputFiles['checkov-summary.json'] is defined ? (read(outputs.scan_iac_compliance.outputFiles['checkov-summary.json']) | jq('.gate_status') | first) : 'UNREACHABLE' }}"

  - id: route_by_compliance_status
    type: io.kestra.plugin.core.flow.Switch
    description: Routes execution based on IaC security compliance classification.
    value: "{{ outputs.classify_compliance_gate.value }}"
    cases:
      "BLOCK_CRITICAL_IAC_VIOLATION":
        - id: alert_critical_violation_slack
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: Notify security and platform teams of critical IaC misconfigurations blocking deployment.
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "channel": "{{ inputs.slack_channel }}",
              "text": "*Checkov IaC Compliance Gate BLOCKED*\n*Status:* BLOCK_CRITICAL_IAC_VIOLATION\n*Critical/High Violations:* {{ read(outputs.scan_iac_compliance.outputFiles['checkov-summary.json']) | jq('.critical_high_count') | first }}\n*Medium/Low Advisories:* {{ read(outputs.scan_iac_compliance.outputFiles['checkov-summary.json']) | jq('.medium_low_count') | first }}\n*Total Resources:* {{ read(outputs.scan_iac_compliance.outputFiles['checkov-summary.json']) | jq('.total_resources') | first }}\n*Action:* Infrastructure deployment halted. High-severity misconfigurations detected in Terraform or Kubernetes manifests. Remediate flagged resources before applying changes.\n*Execution ID:* {{ execution.id }}"
            }

        - id: fail_critical_violation
          type: io.kestra.plugin.core.execution.Fail
          description: Block deployment pipeline due to high-severity IaC policy violations.
          errorMessage: "Checkov compliance gate BLOCKED: critical/high severity policy violations detected in infrastructure manifests. Remediate before applying."

      "WARN_MEDIUM_IAC_VIOLATION":
        - id: alert_medium_violation_slack
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: Notify team of medium or low severity IaC advisories without halting release.
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "channel": "{{ inputs.slack_channel }}",
              "text": "*Checkov IaC Compliance Advisory (Non-Blocking)*\n*Status:* WARN_MEDIUM_IAC_VIOLATION\n*Critical/High Violations:* 0\n*Medium/Low Advisories:* {{ read(outputs.scan_iac_compliance.outputFiles['checkov-summary.json']) | jq('.medium_low_count') | first }}\n*Total Resources:* {{ read(outputs.scan_iac_compliance.outputFiles['checkov-summary.json']) | jq('.total_resources') | first }}\n*Action:* Deployment allowed to proceed. Non-blocking hygiene advisories detected. Schedule remediation during regular sprint backlog.\n*Execution ID:* {{ execution.id }}"
            }

        - id: log_medium_violation_pass
          type: io.kestra.plugin.core.log.Log
          description: Record that deployment proceeds with non-blocking infrastructure advisories.
          message: "Checkov compliance gate PASSED with advisories: zero critical/high violations found; medium/low issues logged for backlog remediation."

      "PASS_COMPLIANT":
        - id: log_compliant_scan
          type: io.kestra.plugin.core.log.Log
          description: Record clean compliance scan with zero detected policy violations.
          message: "Checkov compliance gate PASSED: 100% policy compliance across all scanned infrastructure resources."

      "UNREACHABLE":
        - id: log_diagnostic_failure
          type: io.kestra.plugin.core.log.Log
          description: Record diagnostic failure when repository bundle was missing or invalid.
          message: "Checkov compliance gate diagnostic failure: repository bundle was not provided or could not be unpacked."

        - id: fail_unreachable
          type: io.kestra.plugin.core.execution.Fail
          description: Fail execution when infrastructure bundle could not be scanned.
          errorMessage: "Checkov compliance gate failed: repository archive was missing, corrupt, or invalid."
