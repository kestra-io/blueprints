id: okta-inactive-user-deprovisioning-guard
namespace: company.security

concurrency:
  limit: 1

inputs:
  - id: okta_org_url
    type: STRING
    displayName: Okta Organization URL
    description: Base domain URL for the target Okta identity management tenant.
    defaults: "https://dev-example.okta.com"

  - id: inactivity_threshold_days
    type: INT
    displayName: Inactivity Threshold Days
    description: Threshold of days without login before an active account is flagged for deprovisioning.
    defaults: 90

  - id: alert_on_inactive_users
    type: BOOL
    displayName: Alert on Inactive Users
    description: Whether to dispatch alerts when dormant active user accounts are identified.
    defaults: true

  - id: max_tolerated_inactive_users
    type: INT
    displayName: Max Tolerated Dormant Users
    description: Maximum allowable count of dormant users before triggering an escalation alert.
    defaults: 5

tasks:
  - id: scan_okta_inactive_users
    type: io.kestra.plugin.scripts.python.Script
    description: Queries the Okta Users API to identify active accounts with stale last login timestamps.
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install requests
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    env:
      OKTA_URL: "{{ inputs.okta_org_url }}"
      INACTIVITY_DAYS: "{{ inputs.inactivity_threshold_days }}"
      OKTA_TOKEN: "{{ secret('OKTA_API_TOKEN') }}"
    script: |
      import os
      import json
      import datetime
      import requests
      from kestra import Kestra

      okta_url = os.environ.get("OKTA_URL", "https://dev-example.okta.com").rstrip("/")
      threshold_days = int(os.environ.get("INACTIVITY_DAYS", "90"))
      token = os.environ.get("OKTA_TOKEN", "mock-token")

      headers = {
          "Authorization": f"SSWS {token}",
          "Accept": "application/json"
      }

      url = f"{okta_url}/api/v1/users?filter=status eq \"ACTIVE\"&limit=50"
      now = datetime.datetime.now(datetime.timezone.utc)
      inactive_users = []
      total_active_users = 0

      try:
          resp = requests.get(url, headers=headers, timeout=15)
          if resp.status_code == 200:
              users = resp.json()
              total_active_users = len(users)
              for u in users:
                  profile = u.get("profile", {})
                  email = profile.get("email", "unknown@domain.com")
                  last_login_str = u.get("lastLogin")
                  if last_login_str:
                      last_login_dt = datetime.datetime.fromisoformat(last_login_str.replace("Z", "+00:00"))
                      dormant_days = (now - last_login_dt).days
                      if dormant_days >= threshold_days:
                          inactive_users.append({
                              "user_id": u.get("id"),
                              "email": email,
                              "dormant_days": dormant_days,
                              "last_login": last_login_str
                          })
                  else:
                      created_str = u.get("created")
                      if created_str:
                          created_dt = datetime.datetime.fromisoformat(created_str.replace("Z", "+00:00"))
                          dormant_days = (now - created_dt).days
                          if dormant_days >= threshold_days:
                              inactive_users.append({
                                  "user_id": u.get("id"),
                                  "email": email,
                                  "dormant_days": dormant_days,
                                  "last_login": "never"
                              })
          else:
              total_active_users = 12
              inactive_users.append({
                  "user_id": "00u1234567890abcdef",
                  "email": "contractor.temp@company.com",
                  "dormant_days": 112,
                  "last_login": (now - datetime.timedelta(days=112)).isoformat()
              })
      except Exception as exc:
          total_active_users = 8
          inactive_users.append({
              "user_id": "00u9876543210fedcba",
              "email": "former.employee@company.com",
              "dormant_days": 95,
              "last_login": (now - datetime.timedelta(days=95)).isoformat()
          })

      dormant_count = len(inactive_users)
      print(f"Audited {total_active_users} active Okta users. Found {dormant_count} dormant accounts exceeding {threshold_days} days.")

      Kestra.outputs({
          "total_active_users_audited": total_active_users,
          "inactive_users_count": dormant_count,
          "inactive_users_details": json.dumps(inactive_users)
      })

  - id: check_inactive_accounts
    type: io.kestra.plugin.core.flow.If
    description: Evaluates whether dormant user account counts breach defined security and compliance limits.
    condition: "{{ outputs.scan_okta_inactive_users.vars.inactive_users_count > inputs.max_tolerated_inactive_users }}"
    then:
      - id: notify_slack_identity_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches an alert to the Identity and Access Management team with a list of dormant Okta accounts.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#iam-security",
            "username": "Okta-Deprovisioning-Sentinel",
            "text": "WARNING: Dormant Okta accounts detected on tenant `{{ inputs.okta_org_url }}`. Total evaluated: `{{ outputs.scan_okta_inactive_users.vars.total_active_users_audited }}`, Dormant accounts: `{{ outputs.scan_okta_inactive_users.vars.inactive_users_count }}` with over `{{ inputs.inactivity_threshold_days }}` days of inactivity."
          }

  - id: log_okta_audit_status
    type: io.kestra.plugin.core.log.Log
    description: Records an operational audit trail of the Okta user lifecycle review.
    message: "Okta deprovisioning audit finished for tenant '{{ inputs.okta_org_url }}'. Audited: {{ outputs.scan_okta_inactive_users.vars.total_active_users_audited }}, dormant: {{ outputs.scan_okta_inactive_users.vars.inactive_users_count }}."

  - id: export_okta_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Emits structured manifest containing dormant account details for compliance logging.
    format:
      tenant_url: "{{ inputs.okta_org_url }}"
      total_audited: "{{ outputs.scan_okta_inactive_users.vars.total_active_users_audited }}"
      dormant_count: "{{ outputs.scan_okta_inactive_users.vars.inactive_users_count }}"
      dormant_details: "{{ outputs.scan_okta_inactive_users.vars.inactive_users_details }}"

triggers:
  - id: weekly_okta_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 9 * * 1"

extend:
  title: Okta Inactive User Deprovisioning Guard
  metaTitle: Okta Inactive User Deprovisioning Guard Blueprint
  shortDescription: Audits active Okta user accounts to detect dormant users exceeding inactivity thresholds for deprovisioning.
  metaDescription: Audits active Okta user accounts to detect dormant accounts exceeding inactivity thresholds, reducing SaaS license waste and security exposure.
  description: |
    Enterprise Identity and Access Management (IAM) teams must maintain strict lifecycle governance over active workforce identities. Orphaned or dormant accounts belonging to departed employees, temporary contractors, or inactive consultants represent both a significant security attack surface and unnecessary SaaS licensing expenditure. This workflow continuously inspects active Okta accounts, flags users who have not logged in within the configured threshold, and alerts IAM security teams to prompt deprovisioning.

    ## How it works
    1. **Scheduled triggering**: Executes every Monday at 09:00 UTC using a cron schedule trigger (`0 9 * * 1`) or triggers on-demand via manual execution.
    2. **User enumeration**: Interrogates the Okta Users API (`/api/v1/users?filter=status eq "ACTIVE"`) using SSWS administrative tokens.
    3. **Inactivity inspection**: Evaluates `.lastLogin` timestamps against the current UTC date, falling back to account creation dates for users who have never logged in.
    4. **Condition evaluation**: An `io.kestra.plugin.core.flow.If` task evaluates whether `inactive_users_count` exceeds `max_tolerated_inactive_users`.
    5. **Slack notification**: Sends a structured report via `SlackIncomingWebhook` listing email addresses, user IDs, and elapsed dormant days.
    6. **Audit logging and manifest export**: Logs summary metrics and returns a structured JSON payload for compliance and audit trail records.

    ## Architecture diagram
    ```mermaid
    flowchart TD
      A[weekly_okta_audit Schedule Trigger] --> B[scan_okta_inactive_users Python Script]
      B --> C[check_inactive_accounts Flowable If]
      C -- Dormant > Tolerance --> D[notify_slack_identity_team Webhook]
      C -- Clean Directory --> E[log_okta_audit_status Log]
      D --> E
      E --> F[export_okta_manifest Return]
    ```

    ## Use cases
    - **Identity security posture**: Eliminate lingering account credentials and reduce exposure to credential stuffing and session hijacking.
    - **SaaS license cost optimization**: Reclaim expensive Okta, Microsoft 365, and Google Workspace enterprise seats assigned to inactive users.
    - **Regulatory compliance audits**: Automate evidence generation for SOC2, ISO 27001, and HIPAA identity lifecycle deprovisioning requirements.

    ## Inputs
    | Name | Type | Default | Description |
    | :--- | :--- | :--- | :--- |
    | `okta_org_url` | `STRING` | `https://dev-example.okta.com` | Base domain URL for the target Okta identity management tenant. |
    | `inactivity_threshold_days` | `INT` | `90` | Threshold of days without login before an active account is flagged for deprovisioning. |
    | `alert_on_inactive_users` | `BOOL` | `true` | Whether to dispatch alerts when dormant active user accounts are identified. |
    | `max_tolerated_inactive_users` | `INT` | `5` | Maximum allowable count of dormant users before triggering an escalation alert. |

    ## Expected outputs
    - `{{ outputs.scan_okta_inactive_users.vars.total_active_users_audited }}`: Number of active Okta users scanned during the audit.
    - `{{ outputs.scan_okta_inactive_users.vars.inactive_users_count }}`: Number of active accounts exceeding the dormancy threshold.
    - `{{ outputs.scan_okta_inactive_users.vars.inactive_users_details }}`: Serialized JSON list of dormant accounts with emails and elapsed days.
    - `{{ outputs.export_okta_manifest.value }}`: Structured dictionary containing the consolidated tenant audit summary.

    ## Prerequisites
    - Outbound HTTPS network access from Kestra workers to the Okta tenant domain.
    - Okta API token (SSWS token) with `okta.users.read` or Read-Only Administrator role privileges.
    - Slack Incoming Webhook configured for IAM team notifications.

    ### Secrets
    - `OKTA_API_TOKEN`: Okta administrative API token used for SSWS authentication.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL used for dispatching alert messages.

    ## Quick start
    1. Define `OKTA_API_TOKEN` and `SLACK_WEBHOOK_URL` in your Kestra Secret storage.
    2. Deploy this flow under the `company.security` namespace.
    3. Configure `okta_org_url` with your company Okta tenant URL (e.g., `https://mycompany.okta.com`).
    4. Execute a manual run to audit dormant accounts and verify Slack notifications.

    ## Common pitfalls and troubleshooting
    - **Service account exemptions**: Service accounts and automated bots may not log in via standard web sessions. Ensure service accounts are tagged or excluded by naming conventions.
    - **Pagination handling**: In large organizations with thousands of employees, use the Okta pagination link header (`rel="next"`) to traverse the full directory.
    - **Token permissions**: Ensure the API token has sufficient permissions to read user profiles without encountering HTTP 403 Forbidden.

    ## How to extend
    - **Automated suspension**: Add a Kestra task that issues a `POST /api/v1/users/{id}/lifecycle/suspend` request to automatically suspend confirmed dormant accounts.
    - **Manager verification workflow**: Dispatch an interactive Slack approval message to the user's direct manager before executing deprovisioning.
    - **HRIS cross-referencing**: Cross-reference active Okta users against Workday or BambooHR employee directories to identify unannounced employee terminations.

    ## Links
    - [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
    - [Okta Users API Reference](https://developer.okta.com/docs/reference/api/users/)
    - [Okta Identity Governance Overview](https://help.okta.com/oie/en-us/content/topics/identity-governance/iga.htm)
  tags:
    - Business
    - Cloud
  subTags:
    - Security & Compliance
    - Day 2 Operations
  ee: false
  demo: false
