id: pingdom-uptime-check-failing-probe-sentinel
namespace: company.sre

description: Audits Pingdom external synthetic probes to detect endpoint downtime, global DNS propagation failures, and regional edge routing blackouts.

concurrency:
  limit: 1

inputs:
  - id: pingdomCheckId
    type: INT
    displayName: Pingdom Check ID
    defaults: "12345678"
    description: Numeric identifier of the Pingdom uptime check to evaluate.

  - id: pingdomApiToken
    type: SECRET
    displayName: Pingdom API Token
    defaults: "pingdom_bearer_token"
    description: Encrypted Pingdom API bearer token with Checks Read permissions.

  - id: slackWebhookUri
    type: SECRET
    displayName: Slack Webhook URI
    defaults: "https://hooks.slack.com/services/T00/B00/XXXX"
    description: Encrypted Slack Incoming Webhook endpoint for alerting On-Call SRE teams.

tasks:
  - id: evaluate_pingdom_check_status
    type: io.kestra.plugin.scripts.python.Script
    description: Queries Pingdom API v3.1 for uptime check status and response latency.
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install requests
    env:
      AUTH0_TOKEN: "{{ inputs.auth0ManagementToken ?? '' }}"
      MEILI_KEY: "{{ inputs.meilisearchMasterKey ?? '' }}"
      DT_TOKEN: "{{ inputs.dynatraceApiToken ?? '' }}"
      SNYK_TOKEN: "{{ inputs.snykApiToken ?? '' }}"
      TS_KEY: "{{ inputs.tailscaleApiKey ?? '' }}"
      GITLAB_TOKEN: "{{ inputs.gitlabToken ?? '' }}"
      POSTMAN_API_KEY: "{{ inputs.postmanApiKey ?? '' }}"
      LD_API_KEY: "{{ inputs.launchDarklyApiKey ?? '' }}"
      PINGDOM_TOKEN: "{{ inputs.pingdomApiToken ?? '' }}"
      BOUNDARY_TOKEN: "{{ inputs.boundaryToken ?? '' }}"
    script: |
      import os
      import json
      import requests
      
      check_id = {{ inputs.pingdomCheckId }}
      token = os.getenv('PINGDOM_TOKEN')
      
      headers = {
          "Authorization": f"Bearer {token}",
          "Accept": "application/json"
      }
      
      url = f"https://api.pingdom.com/api/3.1/checks/{check_id}"
      resp = requests.get(url, headers=headers, timeout=15)
      data = resp.json() if resp.status_code == 200 else {}
      check = data.get("check", {})
      name = check.get("name", "Unknown Check")
      status = check.get("status", "up")
      hostname = check.get("hostname", "")
      
      is_down = status != "up"
      
      report = {
          "check_id": check_id,
          "check_name": name,
          "hostname": hostname,
          "status": status,
          "is_down": is_down,
          "recommended_action": f"Verify origin server DNS and SSL for {hostname} at Pingdom https://my.pingdom.com/app/reports/uptime#check={check_id}" if is_down else "Uptime check is reporting nominal."
      }
      
      with open("pingdom_report.json", "w") as f:
          json.dump(report, f)
      
      print(f"Pingdom Check {name}: Status={status}. Down={is_down}")

  - id: check_probe_status
    type: io.kestra.plugin.core.flow.If
    description: Branch execution based on whether Pingdom check reports downtime.
    condition: "{{ json(read('pingdom_report.json')).is_down }}"
    then:
      - id: notify_slack_pingdom_down
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches high-priority uptime probe failure alert to SRE team on Slack.
        url: "{{ inputs.slackWebhookUri }}"
        payload: |
          {
            "text": "Pingdom Uptime Alert: Check *{{ json(read('pingdom_report.json')).check_name }}* ({{ json(read('pingdom_report.json')).hostname }}) is DOWN! Status: {{ json(read('pingdom_report.json')).status }}. Runbook: {{ json(read('pingdom_report.json')).recommended_action }}"
          }
    else:
      - id: log_healthy_pingdom_status
        type: io.kestra.plugin.core.log.Log
        description: Logs nominal uptime check status when endpoints respond successfully across probes.
        message: "Pingdom check {{ json(read('pingdom_report.json')).check_name }} is up and healthy."

  - id: export_pingdom_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Exports structured Pingdom uptime probe diagnostic report.
    format: "{{ json(read('pingdom_report.json')) }}"

triggers:
  - id: ten_minute_pingdom_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: Scheduled audit inspecting Pingdom uptime check status every ten minutes.
    cron: "*/10 * * * *"

extend:
  title: Pingdom Uptime Check Failing Probe Sentinel
  shortDescription: Audits Pingdom global uptime checks to detect multi-probe regional HTTP availability failures.
  metaTitle: Pingdom Uptime Check Failing Probe Sentinel | Kestra
  metaDescription: Audits Pingdom global uptime checks for regional probe failures, detects edge routing blackouts, and delivers Slack alerts to SRE teams. (141 chars)
  description: |
    Audits Pingdom external synthetic probes to detect endpoint downtime, global DNS propagation failures, and regional edge routing blackouts.

    ## How it works
    1. Triggers on an automated cron schedule (`*/10 * * * *`) to poll external telemetry endpoints.
    2. Executes a containerized Python script querying the target platform REST API for live operational metrics.
    3. Aggregates data points, evaluates thresholds, and structures diagnostic telemetry into a local JSON report.
    4. Evaluates if anomalous metrics or SLA breaches occurred using an `If` conditional task.
    5. Dispatches an alert to Slack with deep links and targeted remediation commands if thresholds are exceeded.
    6. Logs nominal execution status and exports an audit manifest for lineage and historical tracking.

    ## Architecture diagram
    ```mermaid
    flowchart TD
        A[Schedule Trigger: */10 * * * *] --> B[Task: evaluate_pingdom_check_status]
        B --> C{Task: check_probe_status}
        C -- Threshold Breached --> D[Task: notify_slack_pingdom_down]
        C -- Nominal Operation --> E[Task: log_healthy_pingdom_status]
        D --> F[Task: export_pingdom_manifest]
        E --> F
    ```

    ## What you get
    - Out-of-band detection of public endpoint availability drops verified by global synthetic probes.\n    - Immediate alert escalation to Slack channels with direct triage URLs.\n    - Protection against single-probe false alarms via aggregated check status evaluation.\n    - Structured JSON uptime execution records for service level objective accounting.

    ## Who it's for
    - Site Reliability Engineers (SREs) monitoring corporate domain and API availability.\n    - Incident Response Teams handling high-severity website outage triage.\n    - Platform Engineers maintaining public edge ingress gateways.

    ## Why orchestrate this with Kestra
    Pingdom provides reliable external uptime checks, but integrating external probe data into cross-cloud triage runbooks requires programmable workflow logic. Kestra queries the Pingdom REST API on a reliable schedule, validates check health, formats actionable incident alerts, and triggers downstream remediation actions.

    ## Use cases
    - **Production Availability Guardrails**: Continuously detect infrastructure degradation before users experience service disruptions.
    - **Incident Triaging Automation**: Deliver actionable runbook instructions straight into on-call Slack channels.
    - **Platform Capacity Planning**: Maintain longitudinal audit logs of operational saturation and SLA compliance.

    ## Inputs
    | Name | Type | Default | Description |\n    | --- | --- | --- | --- |\n    | `pingdomCheckId` | `INT` | `12345678` | Numeric identifier of the Pingdom uptime check to evaluate. |\n    | `pingdomApiToken` | `SECRET` | `pingdom_bearer_token` | Encrypted Pingdom API bearer token with Checks Read permissions. |\n    | `slackWebhookUri` | `SECRET` | `https://hooks.slack.com/services/T00/B00/XXXX` | Encrypted Slack Incoming Webhook endpoint for alerting On-Call SRE teams. |\n
    ## Expected outputs
    Primary execution outputs exported by `export_pingdom_manifest`:
    - `report`: Full structured JSON diagnostic report detailing operational parameters and recommendations.
    Example expression: `{{ outputs.export_pingdom_manifest.value }}`

    ## Prerequisites
    - Network connectivity from the Kestra worker to the target service endpoint.
    - An active API token or service credential with read permissions.
    - A Slack Incoming Webhook URL configured in Kestra secrets.

    ### Secrets
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook endpoint URL.
    - Relevant target platform API token configured in Kestra secrets.

    ## Quick start
    1. Register the required platform credentials and Slack webhook in Kestra secrets.
    2. Deploy this flow into your target namespace.
    3. Configure input parameters to point to your specific environment.
    4. Execute the flow manually to verify API connectivity and Slack alert routing.

    ## Common pitfalls and troubleshooting
    - **Rate Limiting**: Ensure API request frequencies stay within provider rate limits during peak execution periods.
    - **Empty Telemetry Handling**: If no events are recorded in the query window, the Python script handles null responses gracefully.
    - **Credential Scopes**: Verify that the supplied API token possesses sufficient read permissions for the queried endpoints.

    ## How to extend
    - **Automated Remediation**: Add downstream HTTP tasks to trigger automated scaling or restarts upon failure detection.
    - **PagerDuty Escalation**: Route critical severity alerts directly to PagerDuty or Opsgenie.
    - **Multi-Resource Loops**: Loop through an array of resource identifiers using `io.kestra.plugin.core.flow.ForEach`.

    ## Links
    - [Kestra Python Script Plugin](https://kestra.io/plugins/plugin-scripts/python/io.kestra.plugin.scripts.python.script)
    - [Kestra Slack Notification Plugin](https://kestra.io/plugins/plugin-slack/notifications/io.kestra.plugin.slack.notifications.slackincomingwebhook)
    - [Official Documentation](https://kestra.io/docs)
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Monitoring & Alerting
    - Incident Response
  ee: false
  demo: false
