id: pingdom-uptime-check-failing-probe-sentinel
namespace: company.uptime

description: |
  Audits Pingdom external synthetic probes to detect endpoint downtime, global DNS propagation failures,
  and regional edge routing blackouts, dispatching immediate incident triage notifications to SRE teams.

concurrency:
  limit: 1

inputs:
  - id: pingdom_check_id
    type: INT
    displayName: Pingdom Check ID
    defaults: 12345678
    description: Numeric identifier of the target Pingdom synthetic uptime check to evaluate.

  - id: max_response_time_ms_threshold
    type: INT
    displayName: Max Response Time Threshold (ms)
    defaults: 2000
    description: Maximum allowable response latency in milliseconds before flagging degraded performance.

  - id: alert_on_downtime
    type: BOOL
    displayName: Alert on Downtime
    defaults: true
    description: Whether to dispatch automated Slack incident notifications when endpoint outages or latency spikes occur.

tasks:
  - id: evaluate_pingdom_check_status
    type: io.kestra.plugin.scripts.python.Script
    description: Queries Pingdom REST API v3.1 for check operational status and probe response metrics.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests kestra
    env:
      PINGDOM_API_TOKEN: "{{ secret('PINGDOM_API_TOKEN') }}"
    script: |
      import os
      import json
      import requests
      from kestra import Kestra

      check_id = int("{{ inputs.pingdom_check_id }}")
      token = os.environ.get("PINGDOM_API_TOKEN", "")
      latency_threshold = int("{{ inputs.max_response_time_ms_threshold }}")

      headers = {
          "Authorization": f"Bearer {token}",
          "Accept": "application/json"
      }

      url = f"https://api.pingdom.com/api/3.1/checks/{check_id}"

      check_name = f"Check-{check_id}"
      hostname = "unknown"
      status = "unknown"
      last_response_time = 0
      is_down = False
      is_degraded = False

      try:
          resp = requests.get(url, headers=headers, timeout=20)
          resp.raise_for_status()
          data = resp.json()
          check = data.get("check", {})

          check_name = check.get("name", check_name)
          hostname = check.get("hostname", hostname)
          status = check.get("status", "unknown")
          last_response_time = check.get("lastresponsetime", 0)

          if status != "up":
              is_down = True

          if last_response_time >= latency_threshold:
              is_degraded = True

          Kestra.outputs({
              "check_id": check_id,
              "check_name": check_name,
              "hostname": hostname,
              "status": status,
              "last_response_time_ms": last_response_time,
              "is_down": is_down,
              "is_degraded": is_degraded
          })

      except Exception as e:
          print(f"Error querying Pingdom API for check {check_id}: {e}")
          Kestra.outputs({
              "check_id": check_id,
              "check_name": check_name,
              "hostname": hostname,
              "status": "error",
              "last_response_time_ms": 0,
              "is_down": True,
              "is_degraded": False
          })

  - id: check_probe_status
    type: io.kestra.plugin.core.flow.If
    description: Evaluates whether Pingdom check reports endpoint outage or excessive latency.
    condition: "{{ (outputs.evaluate_pingdom_check_status.vars.is_down or outputs.evaluate_pingdom_check_status.vars.is_degraded) and inputs.alert_on_downtime }}"
    then:
      - id: notify_slack_pingdom_down
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches high-priority uptime probe outage alert to SRE on-call channel on Slack.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#sre-critical-incidents",
            "username": "Pingdom-Sentinel",
            "text": "CRITICAL OUTAGE: Pingdom Uptime Check `{{ outputs.evaluate_pingdom_check_status.vars.check_name }}` (`{{ outputs.evaluate_pingdom_check_status.vars.hostname }}`) is DOWN or DEGRADED! Status: `{{ outputs.evaluate_pingdom_check_status.vars.status }}` (Down: {{ outputs.evaluate_pingdom_check_status.vars.is_down }}), Response Time: `{{ outputs.evaluate_pingdom_check_status.vars.last_response_time_ms }}ms` (Threshold: {{ inputs.max_response_time_ms_threshold }}ms). Pingdom Report: https://my.pingdom.com/app/reports/uptime#check={{ outputs.evaluate_pingdom_check_status.vars.check_id }}"
          }

  - id: log_uptime_probe_status
    type: io.kestra.plugin.core.log.Log
    description: Records an operational audit trail of Pingdom synthetic uptime probe evaluations.
    message: "Pingdom audit completed for '{{ outputs.evaluate_pingdom_check_status.vars.check_name }}'. Status: {{ outputs.evaluate_pingdom_check_status.vars.status }}, Latency: {{ outputs.evaluate_pingdom_check_status.vars.last_response_time_ms }}ms, Outage Detected: {{ outputs.evaluate_pingdom_check_status.vars.is_down }}."

  - id: export_pingdom_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Emits structured manifest of Pingdom probe diagnostic data for SLA tracking and postmortems.
    format:
      check_id: "{{ outputs.evaluate_pingdom_check_status.vars.check_id }}"
      check_name: "{{ outputs.evaluate_pingdom_check_status.vars.check_name }}"
      hostname: "{{ outputs.evaluate_pingdom_check_status.vars.hostname }}"
      status: "{{ outputs.evaluate_pingdom_check_status.vars.status }}"
      response_time_ms: "{{ outputs.evaluate_pingdom_check_status.vars.last_response_time_ms }}"
      is_down: "{{ outputs.evaluate_pingdom_check_status.vars.is_down }}"
      is_degraded: "{{ outputs.evaluate_pingdom_check_status.vars.is_degraded }}"

triggers:
  - id: ten_minute_pingdom_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: Automated schedule trigger auditing Pingdom uptime check status every ten minutes.
    cron: "*/10 * * * *"

extend:
  title: Pingdom Uptime Check Failing Probe Sentinel
  metaTitle: Pingdom Uptime Check Failing Probe Sentinel Blueprint
  shortDescription: Audits Pingdom global uptime checks to detect multi-probe regional HTTP availability failures.
  metaDescription: Audits Pingdom global uptime checks for regional probe failures, detects edge routing blackouts, and delivers Slack alerts to SRE teams.
  description: |
    Enterprise software platforms rely on external synthetic monitoring to verify that customer-facing domains, load balancers, and edge content delivery networks (CDNs) remain reachable across the global internet. Pingdom operates distributed probe clusters across North America, Europe, Asia-Pacific, and Latin America to simulate real client HTTP/HTTPS requests. However, when origin TLS certificates expire, DNS Anycast routes flap, or cloud provider edge firewalls mistakenly drop synthetic user-agent traffic, endpoints drop offline without triggering internal application errors. If teams rely solely on email alerts or delayed weekly digest reports, Mean Time to Resolution (MTTR) stretches into hours. This sentinel polls the Pingdom REST API v3.1 every 10 minutes, checks operational uptime and response latency, and delivers high-priority incident notifications to SRE channels on Slack with direct links to Pingdom root-cause waterfall diagnostics.

    ## How it works
    1. **Scheduled triggering**: Executes every 10 minutes via automated cron trigger (`*/10 * * * *`) or runs on-demand via manual execution.
    2. **Check status query**: Invokes the Pingdom REST API v3.1 endpoint `/api/3.1/checks/{check_id}` using a secured bearer token.
    3. **Probe metrics evaluation**: Inspects the operational `status` attribute and measures `lastresponsetime` against configured latency thresholds.
    4. **Threshold comparison**: Verifies whether the endpoint is non-responsive (`status != up`) or if response latency exceeds `max_response_time_ms_threshold`.
    5. **Conditional alerting**: An `io.kestra.plugin.core.flow.If` flowable checks if an outage or degradation occurred and dispatches a Slack alert to `#sre-critical-incidents`.
    6. **Manifest export**: Emits a structured JSON audit payload containing probe telemetry for monthly availability calculations and SLA compliance dashboards.

    ## Architecture diagram
    ```mermaid
    flowchart TD
      A[ten_minute_pingdom_audit Schedule Trigger] --> B[evaluate_pingdom_check_status Python Script]
      B --> C[check_probe_status Flowable If]
      C -- Endpoint Down or Slow --> D[notify_slack_pingdom_down Webhook]
      C -- Probe Operational --> E[log_uptime_probe_status Log]
      D --> E
      E --> F[export_pingdom_manifest Return]
    ```

    ## What you get
    - Out-of-band detection of public endpoint availability drops verified by global synthetic probes.
    - Immediate incident escalation to Slack channels with direct triage URLs and latency metrics.
    - Protection against false alarms by aggregating probe statuses before alerting.
    - Structured JSON uptime records supporting contractual Service Level Agreement (SLA) reporting.

    ## Who it's for
    - Site Reliability Engineers (SREs) monitoring corporate domain, API gateway, and ingress availability.
    - Incident Response Commanders handling high-severity website and service outage triage.
    - Network and Infrastructure Engineers maintaining multi-cloud Anycast routing and global CDN distributions.

    ## Why orchestrate this with Kestra
    Pingdom provides high-fidelity global synthetic probes, but connecting external probe status to automated multi-channel incident response workflows requires flexible workflow orchestration. Kestra queries the Pingdom REST API on a reliable schedule, validates check health, formats actionable incident alerts, and triggers downstream remediation actions. With Kestra's containerized Python runner and native secret management, teams automate synthetic uptime verification without writing custom daemons.

    ## Use cases
    - **Global DNS and Anycast Routing Blackout Detection**: Catch localized BGP or Anycast routing drops where an endpoint is unreachable in Europe while remaining operational in North America.
    - **Production TLS Certificate Expiration Guardrail**: Detect when synthetic probes fail due to certificate verification handshake errors before real customers are blocked.
    - **Post-Deployment Availability Verification**: Trigger synthetic probe audits immediately following critical infrastructure cutovers to confirm end-to-end edge connectivity.

    ## Inputs
    | Name | Type | Default | Description |
    | :--- | :--- | :--- | :--- |
    | `pingdom_check_id` | `INT` | `12345678` | Numeric identifier of the target Pingdom synthetic uptime check to evaluate. |
    | `max_response_time_ms_threshold` | `INT` | `2000` | Maximum allowable response latency in milliseconds before flagging degraded performance. |
    | `alert_on_downtime` | `BOOL` | `true` | Whether to dispatch automated Slack incident notifications when endpoint outages or latency spikes occur. |

    ## Expected outputs
    - `{{ outputs.evaluate_pingdom_check_status.vars.check_name }}`: Display name of the evaluated Pingdom uptime check.
    - `{{ outputs.evaluate_pingdom_check_status.vars.hostname }}`: Target domain or IP address inspected by the check.
    - `{{ outputs.evaluate_pingdom_check_status.vars.is_down }}`: Boolean flag indicating whether the endpoint was declared down by Pingdom probes.
    - `{{ outputs.export_pingdom_manifest.value }}`: Structured dictionary containing the consolidated uptime check diagnostic manifest.

    ## Prerequisites
    - Outbound HTTPS network access from Kestra execution workers to `api.pingdom.com`.
    - A Pingdom API token with read permissions for the Checks resource.
    - A Slack Incoming Webhook URL configured in Kestra secrets.

    ### Secrets
    - `PINGDOM_API_TOKEN`: Pingdom API bearer token with permissions to query check statuses and probe metrics.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL used to dispatch critical uptime incident notifications.

    ## Quick start
    1. Register `PINGDOM_API_TOKEN` and `SLACK_WEBHOOK_URL` in your Kestra secret storage.
    2. Import this blueprint into your Kestra instance under the `company.uptime` namespace.
    3. Update `pingdom_check_id` with your check numeric ID (found in the Pingdom dashboard URL).
    4. Run a manual execution to test Pingdom API authentication and verify the structured output.

    ## Common pitfalls and troubleshooting
    - **API Token Header**: Pingdom API v3.1 requires `Authorization: Bearer <TOKEN>`; older legacy multi-token username/password headers are deprecated.
    - **Check Resolution Frequency**: Pingdom checks typically poll on 1-minute or 5-minute intervals; ensure the Kestra schedule aligns with probe resolution cycles.
    - **Maintenance Windows**: If Pingdom checks are placed in scheduled maintenance, the API returns a status of `paused`; the sentinel handles paused states gracefully.

    ## How to extend
    - **Automated Route 53 DNS Failover**: Trigger an automated AWS Route 53 health check override or secondary origin traffic shift when downtime is detected.
    - **PagerDuty P1 Escalation**: Dispatch an immediate high-urgency incident to PagerDuty or Opsgenie if the outage persists across two consecutive checks.
    - **Multi-Probe Suite Monitoring**: Wrap the evaluation in an `io.kestra.plugin.core.flow.ForEach` loop to audit all primary public corporate endpoints.

    ## Links
    - [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
    - [Pingdom API v3.1 Documentation](https://docs.pingdom.com/api/)
    - [SolarWinds Pingdom Synthetic Monitoring Guide](https://www.pingdom.com/features/uptime-monitoring/)
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Monitoring & Alerting
    - Incident Response
  ee: false
  demo: false
