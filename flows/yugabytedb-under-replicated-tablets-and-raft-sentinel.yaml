id: yugabytedb-under-replicated-tablets-and-raft-sentinel
namespace: company.sre

inputs:
  - id: master_host
    type: STRING
    required: true
    defaults: "yb-master.internal.company.com"
    description: "YugabyteDB active Master leader hostname or VIP"

  - id: master_port
    type: INT
    required: true
    defaults: 7000
    description: "YugabyteDB Master web UI / REST metrics port (default: 7000)"

  - id: max_heartbeat_delay_secs
    type: INT
    required: true
    defaults: 15
    description: "Maximum tolerated heartbeat delay in seconds before declaring a TServer unresponsive"

  - id: slack_channel
    type: STRING
    required: true
    defaults: "#database-alerts"
    description: "Destination Slack channel for YugabyteDB cluster health alerts"

triggers:
  - id: periodic_tablet_replication_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"

tasks:
  - id: probe_yugabyte_cluster_health
    type: io.kestra.plugin.scripts.python.Script
    description: "Queries YugabyteDB Master REST API to audit tablet replication factors, dead TServers, and Raft consensus health"
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install kestra
    env:
      MASTER_HOST: "{{ inputs.master_host }}"
      MASTER_PORT: "{{ inputs.master_port }}"
      MAX_HEARTBEAT_DELAY: "{{ inputs.max_heartbeat_delay_secs }}"
    script: |
      import os
      import sys
      import json
      import urllib.request
      import urllib.error
      from kestra import Kestra

      master_host = os.environ.get("MASTER_HOST", "localhost")
      master_port = int(os.environ.get("MASTER_PORT", 7000))
      max_heartbeat = int(os.environ.get("MAX_HEARTBEAT_DELAY", 15))

      base_url = f"http://{master_host}:{master_port}"

      def get_json(endpoint):
          url = f"{base_url}{endpoint}"
          req = urllib.request.Request(url, headers={"Accept": "application/json", "User-Agent": "Kestra-YugabyteDB-Sentinel"})
          with urllib.request.urlopen(req, timeout=15) as response:
              return json.loads(response.read().decode("utf-8"))

      under_replicated_count = 0
      live_tservers = 0
      dead_tservers = 0
      dead_tserver_ips = []
      cluster_state = "UNKNOWN"

      # 1. Query cluster health-check endpoint
      try:
          health_data = get_json("/api/v1/health-check")
          cluster_state = health_data.get("status", "UNKNOWN")
          under_replicated_count = int(health_data.get("under_replicated_tablets", 0))
      except Exception as ex:
          # Fallback probe to /api/v1/cluster-metrics or /dump-entities if health-check is unsupported
          try:
              metrics_data = get_json("/api/v1/cluster-metrics")
              cluster_state = "HEALTHY"
              under_replicated_count = int(metrics_data.get("num_tablets_under_replicated", 0))
          except Exception:
              cluster_state = "PROBE_PARTIAL_ERROR"

      # 2. Query tablet-servers endpoint to inspect node live/dead status
      try:
          tservers_data = get_json("/api/v1/tablet-servers")
          # tservers_data can be a dict keyed by server uuid or a list of server records
          servers_list = []
          if isinstance(tservers_data, dict):
              servers_list = list(tservers_data.values())
          elif isinstance(tservers_data, list):
              servers_list = tservers_data

          for srv in servers_list:
              is_alive = srv.get("is_alive", True)
              heartbeat_age = float(srv.get("time_since_hb_sec", 0.0))
              addr = srv.get("broadcast_address", srv.get("rpc_address", "unknown"))

              if is_alive and heartbeat_age <= max_heartbeat:
                  live_tservers += 1
              else:
                  dead_tservers += 1
                  dead_tserver_ips.append(f"{addr} (last hb: {heartbeat_age:.1f}s)")
      except Exception as ex:
          # If tablet-servers endpoint is not JSON formatted on older releases, query /api/v1/masters
          pass

      is_degraded = (under_replicated_count > 0) or (dead_tservers > 0)

      if under_replicated_count > 0 and dead_tservers > 0:
          status = "CRITICAL_CLUSTER_DEGRADED"
          runbook = (
              f"{under_replicated_count} tablets under-replicated and {dead_tservers} TServers unreachable: {', '.join(dead_tserver_ips)}. "
              "1. Inspect TServer logs and availability zone network connectivity. "
              "2. Run `yb-admin -master_addresses ... list_tablet_servers` to identify failed nodes. "
              "3. Allow YB-Master cluster balancer to trigger automatic remote bootstrap onto surviving healthy nodes."
          )
      elif under_replicated_count > 0:
          status = "CRITICAL_TABLETS_UNDER_REPLICATED"
          runbook = (
              f"{under_replicated_count} tablets have fewer Raft replicas than configured replication factor. "
              "1. Run `yb-admin -master_addresses ... list_tablets_for_table` to identify impacted keyspaces. "
              "2. Check disk utilization on remaining TServers to verify space for Raft replica creation."
          )
      elif dead_tservers > 0:
          status = "WARNING_DEAD_TSERVERS"
          runbook = (
              f"{dead_tservers} TServer(s) missed heartbeats ({', '.join(dead_tserver_ips)}). "
              "Restart failed yb-tserver services or provision replacement cloud instances to restore quorum capacity."
          )
      else:
          status = "HEALTHY"
          runbook = "All YugabyteDB tablets meet target replication factor and all TServers report active heartbeats."

      Kestra.outputs({
          "cluster_state": cluster_state,
          "under_replicated_count": under_replicated_count,
          "live_tservers": live_tservers,
          "dead_tservers": dead_tservers,
          "dead_tserver_summary": ", ".join(dead_tserver_ips) if dead_tserver_ips else "None",
          "is_degraded": is_degraded,
          "status": status,
          "runbook": runbook
      })

  - id: evaluate_cluster_health
    type: io.kestra.plugin.core.flow.If
    description: "Branches execution based on whether any tablets are under-replicated or TServers are unresponsive"
    condition: "{{ outputs.probe_yugabyte_cluster_health.vars.is_degraded == true }}"
    then:
      - id: notify_slack_yugabyte_alert
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: "Dispatches high-urgency Slack incident card with replication shortfall metrics and runbooks"
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "{{ inputs.slack_channel }}",
            "text": "⚠️ *YUGABYTEDB DISTRIBUTED REPLICATION ALERT*\n*Status:* `{{ outputs.probe_yugabyte_cluster_health.vars.status }}`\n*Target Master:* `{{ inputs.master_host }}:{{ inputs.master_port }}`\n*Under-Replicated Tablets:* {{ outputs.probe_yugabyte_cluster_health.vars.under_replicated_count }}\n*Dead TServers:* {{ outputs.probe_yugabyte_cluster_health.vars.dead_tservers }} (`{{ outputs.probe_yugabyte_cluster_health.vars.dead_tserver_summary }}`)\n*Live TServers:* {{ outputs.probe_yugabyte_cluster_health.vars.live_tservers }}\n*Remediation Runbook:* {{ outputs.probe_yugabyte_cluster_health.vars.runbook }}\n*Execution:* `{{ execution.id }}`"
          }

    else:
      - id: log_healthy_cluster
        type: io.kestra.plugin.core.log.Log
        description: "Logs verified healthy replication status across all distributed tablets and nodes"
        message: "YugabyteDB cluster at {{ inputs.master_host }}:{{ inputs.master_port }} is healthy. All tablets meet target replication factor across {{ outputs.probe_yugabyte_cluster_health.vars.live_tservers }} live TServers."

  - id: finalize_cluster_telemetry
    type: io.kestra.plugin.core.output.OutputValues
    description: "Exports structured cluster health telemetry for long-term SRE audit history and dashboards"
    values:
      execution_id: "{{ execution.id }}"
      target_master: "{{ inputs.master_host }}"
      under_replicated_tablets: "{{ outputs.probe_yugabyte_cluster_health.vars.under_replicated_count }}"
      live_tservers: "{{ outputs.probe_yugabyte_cluster_health.vars.live_tservers }}"
      dead_tservers: "{{ outputs.probe_yugabyte_cluster_health.vars.dead_tservers }}"
      status: "{{ outputs.probe_yugabyte_cluster_health.vars.status }}"

errors:
  - id: notify_probe_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: "Alerts database operators if the YB-Master REST API endpoint is unreachable"
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "{{ inputs.slack_channel }}",
        "text": "🚨 *YUGABYTEDB SENTINEL PROBE FAILED*\n*Target:* `{{ inputs.master_host }}:{{ inputs.master_port }}`\n*Failure:* Sentinel was unable to connect to YB-Master HTTP REST API `/api/v1/health-check`.\n*Execution ID:* `{{ execution.id }}`\n*Flow:* `{{ flow.id }}`"
      }

extend:
  title: YugabyteDB Distributed SQL Under-Replicated Tablets and Raft Sentinel
  metaTitle: YugabyteDB Distributed SQL Under-Replicated Tablets and Raft Sentinel
  shortDescription: Audits YugabyteDB distributed SQL clusters for under-replicated tablets and dead TServers, dispatching alerts to Slack.
  metaDescription: Audits YugabyteDB distributed SQL clusters for under-replicated tablets, dead TServers, and Raft leader health, routing remediation runbooks to Slack.
  description: |
    YugabyteDB is an open-source, high-performance distributed SQL database built for multi-cloud resiliency, featuring PostgreSQL wire-compatibility (YSQL) and Cassandra compatibility (YCQL). In YugabyteDB, tables are partitioned into horizontal shards called **tablets**, each backed by a distributed multi-Raft consensus group replicated across independent nodes (TServers) and availability zones.

    When a TServer node crashes, suffers disk saturation, or experiences network partition, tablets can drop below their target replication factor (`num_tablets_under_replicated > 0`). If secondary failures occur before Raft replicas recover, quorum consensus is permanently lost, leading to read/write unavailability or data loss.

    This blueprint implements continuous automated surveillance of YugabyteDB clusters by querying the native YB-Master REST API, monitoring tablet replication factors and TServer heartbeat health, and routing actionable SRE runbook remediation alerts to Slack.

    ## How it works

    1. **Scheduled Audit**: The `periodic_tablet_replication_audit` trigger (`io.kestra.plugin.core.trigger.Schedule`) initiates a cluster surveillance run every 15 minutes.
    2. **Cluster Health Extraction**: The `probe_yugabyte_cluster_health` task (`io.kestra.plugin.scripts.python.Script` inside Docker) connects to the YB-Master web interface (`/api/v1/health-check` and `/api/v1/tablet-servers`), evaluating:
       - Count of under-replicated tablets.
       - Count of active, live TServers vs dead or unresponsive nodes.
       - Heartbeat age in seconds against tolerated SLA thresholds.
    3. **Conditional Health Gate**: The `evaluate_cluster_health` task (`io.kestra.plugin.core.flow.If`) evaluates cluster degradation:
       - **Degraded Branch**: Emits a formatted Slack alert card via `notify_slack_yugabyte_alert` (`io.kestra.plugin.slack.notifications.SlackIncomingWebhook`) containing tablet shortfall counts, dead node IP addresses, and specific `yb-admin` recovery commands.
       - **Healthy Branch**: Emits confirmation logs via `log_healthy_cluster` (`io.kestra.plugin.core.log.Log`).
    4. **Telemetry Export**: The `finalize_cluster_telemetry` task (`io.kestra.plugin.core.output.OutputValues`) exposes structured outputs for historical metrics and compliance audits.
    5. **Pipeline Resilience**: An `errors` handler (`notify_probe_failure`) immediately triggers a Slack alert if the YB-Master endpoint cannot be reached over the network.

    ## What you get

    - Proactive alerts on under-replicated tablets before subsequent node failures breach Raft quorum.
    - Rapid detection of unresponsive TServers missing heartbeats beyond the SLA ceiling.
    - Contextual SRE runbooks embedded directly in Slack alert notifications.
    - Zero custom monitoring infrastructure required.

    ## Who it's for

    - Database Administrators (DBAs) managing production YugabyteDB clusters.
    - Site Reliability Engineers (SREs) responsible for distributed SQL database uptime and multi-AZ fault tolerance.
    - Platform Engineers building resilient backend data stores on Kubernetes or bare metal.

    ## Why orchestrate this with Kestra

    Kestra simplifies distributed systems monitoring by orchestrating periodic triggers, containerized Python probes, multi-branch conditional evaluations, and enterprise Slack webhooks without external monitoring agents. Kestra's execution history provides a verifiable audit trail of every health check and failover timeline.

    ## Prerequisites

    - A running YugabyteDB cluster with HTTP REST API access on the active YB-Master node (default port 7000).
    - A Slack Incoming Webhook URL with posting permission to the alert channel.
    - Docker enabled on Kestra workers to execute the Python script container.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Incoming Webhook URL for the target Slack channel.

    ## Quick start

    1. Store your `SLACK_WEBHOOK_URL` in your Kestra namespace secrets.
    2. Import this blueprint into your Kestra workspace under namespace `company.sre`.
    3. Run a test execution specifying your YB-Master host to verify REST API connectivity.
    4. Enable the `periodic_tablet_replication_audit` schedule for recurring 15-minute surveillance.

    ## How to extend

    - Add automated recovery: trigger an auto-scaling group scale-up or Kubernetes StatefulSet restart when dead TServers are detected.
    - Integrate with PagerDuty for high-priority incidents where more than 50% of tablets are under-replicated.
    - Query Prometheus metrics (`/prometheus-metrics`) for tablet leader distribution and disk write latency.

    ## Links

    - [YugabyteDB Master Architecture & API](https://docs.yugabyte.com/preview/architecture/yb-master/)
    - [YugabyteDB yb-admin CLI Reference](https://docs.yugabyte.com/preview/admin/yb-admin/)
    - [Kestra Python Script Documentation](https://kestra.io/plugins/plugin-scripts-python/io.kestra.plugin.scripts.python.script)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
    - This blueprint has been created by [Pranjulchaurasiya](https://github.com/Pranjulchaurasiya)
  tags:
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - Database & Storage
  ee: false
  demo: false
