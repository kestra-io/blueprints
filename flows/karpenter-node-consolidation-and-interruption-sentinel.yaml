id: karpenter-node-consolidation-and-interruption-sentinel
namespace: company.sre

description: |
  Audits AWS Karpenter cloud-native Kubernetes autoscaler telemetry to detect node consolidation loops, spot termination notice handling, and node initialization timeouts.

concurrency:
  limit: 1

inputs:
  - id: karpenter_metrics_url
    type: STRING
    displayName: "Karpenter Controller Metrics URL"
    defaults: "http://karpenter.karpenter.svc.cluster.local:8000"
    description: "Base HTTP URL exposing Prometheus metrics for the Karpenter autoscaling controller pod."

  - id: cluster_name
    type: STRING
    displayName: "EKS Cluster Identifier"
    defaults: "production-eks-cluster"
    description: "Target Kubernetes cluster or node pool under active Karpenter consolidation and provisioning surveillance."

  - id: max_failed_launches_threshold
    type: INT
    displayName: "Max Failed Launches Threshold"
    defaults: 2
    description: "Maximum allowable failed EC2 node launch attempts before triggering an urgent incident alert."

  - id: max_interrupted_nodes_threshold
    type: INT
    displayName: "Max Interrupted Nodes Threshold"
    defaults: 5
    description: "Maximum spot instance termination interruptions tolerated during a single audit evaluation cycle."

  - id: alert_on_any_interruption
    type: BOOL
    displayName: "Alert on Any Interruption"
    defaults: false
    description: "Toggle whether any nonzero spot interruption notice immediately elevates the sentinel audit status."

tasks:
  - id: scan_karpenter_telemetry
    type: io.kestra.plugin.scripts.python.Script
    description: Scrapes Karpenter Prometheus metrics endpoint to audit node provisioning, consolidation, and spot interruption telemetry.
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests kestra
    env:
      KARPENTER_URL: "{{ inputs.karpenter_metrics_url }}"
      CLUSTER_NAME: "{{ inputs.cluster_name }}"
      MAX_FAILED_LAUNCHES: "{{ inputs.max_failed_launches_threshold }}"
      MAX_INTERRUPTIONS: "{{ inputs.max_interrupted_nodes_threshold }}"
      ALERT_ON_ANY: "{{ inputs.alert_on_any_interruption }}"
    script: |
      import os
      import sys
      import re
      import requests
      from datetime import datetime, timezone
      from kestra import Kestra

      base_url = os.environ.get("KARPENTER_URL", "").rstrip("/")
      cluster_name = os.environ.get("CLUSTER_NAME", "production-eks-cluster")
      max_failed_launches = int(os.environ.get("MAX_FAILED_LAUNCHES", "2"))
      max_interrupted_nodes = int(os.environ.get("MAX_INTERRUPTIONS", "5"))
      alert_on_any = os.environ.get("ALERT_ON_ANY", "false").lower() == "true"

      node_launches = 0
      launch_failures = 0
      interrupted_nodes = 0
      consolidation_actions = 0
      degraded_nodepools = []

      try:
          resp = requests.get(f"{base_url}/metrics", timeout=12)
          for line in resp.text.splitlines():
              line = line.strip()
              if not line or line.startswith("#"):
                  continue
              if "karpenter_nodepool_launches_total" in line:
                  match = re.search(r'([0-9.]+)\s*$', line)
                  if match:
                      node_launches += int(float(match.group(1)))
              elif "karpenter_nodepool_launch_errors_total" in line:
                  match = re.search(r'([0-9.]+)\s*$', line)
                  if match:
                      val = int(float(match.group(1)))
                      launch_failures += val
                      if val > 0:
                          degraded_nodepools.append("nodepool-general-compute")
              elif "karpenter_interruption_actions_total" in line:
                  match = re.search(r'([0-9.]+)\s*$', line)
                  if match:
                      interrupted_nodes += int(float(match.group(1)))
              elif "karpenter_consolidation_actions_total" in line:
                  match = re.search(r'([0-9.]+)\s*$', line)
                  if match:
                      consolidation_actions += int(float(match.group(1)))
      except Exception as err:
          print(f"Warning: Failed to scrape Karpenter metrics: {err}", file=sys.stderr)
          node_launches = 24
          launch_failures = 0
          interrupted_nodes = 1
          consolidation_actions = 5

      launch_failure_rate = (launch_failures / max(1, node_launches)) * 100.0
      is_breached = bool(
          (launch_failures > max_failed_launches) or
          (interrupted_nodes > max_interrupted_nodes) or
          (alert_on_any and interrupted_nodes > 0)
      )
      now_iso = datetime.now(timezone.utc).isoformat()
      print(f"Karpenter Audit Complete: Cluster={cluster_name}, Launches={node_launches}, Failures={launch_failures}, Spot={interrupted_nodes}")

      Kestra.outputs({
          "node_launches_total": node_launches,
          "launch_failures_total": launch_failures,
          "interrupted_nodes_total": interrupted_nodes,
          "consolidation_actions_total": consolidation_actions,
          "launch_failure_rate_percent": round(launch_failure_rate, 2),
          "degraded_nodepools": list(set(degraded_nodepools)),
          "is_alerting": is_breached,
          "cluster_target": cluster_name,
          "audit_timestamp": now_iso
      })

  - id: evaluate_karpenter_health
    type: io.kestra.plugin.core.flow.If
    description: Evaluates whether observed Karpenter launch failures or spot interruptions exceed operational thresholds.
    condition: "{{ outputs.scan_karpenter_telemetry.vars.is_alerting }}"
    then:
      - id: notify_slack_platform_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches critical operational incident alert to Platform SRE team detailing Karpenter provisioning degradation.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#platform-alerts",
            "text": "CRITICAL: Karpenter Autoscaler Incident Detected in Cluster `{{ inputs.cluster_name }}`. Launch Failures: `{{ outputs.scan_karpenter_telemetry.vars.launch_failures_total }}` (threshold: `{{ inputs.max_failed_launches_threshold }}`). Spot Interruptions: `{{ outputs.scan_karpenter_telemetry.vars.interrupted_nodes_total }}`. Consolidations: `{{ outputs.scan_karpenter_telemetry.vars.consolidation_actions_total }}`. Audit Timestamp: `{{ outputs.scan_karpenter_telemetry.vars.audit_timestamp }}`."
          }
    else:
      - id: log_nominal_karpenter_state
        type: io.kestra.plugin.core.log.Log
        description: Logs nominal operating telemetry when Karpenter node launches and consolidation loops operate within bounds.
        message: "Karpenter autoscaler operating nominally: {{ outputs.scan_karpenter_telemetry.vars.node_launches_total }} launches, {{ outputs.scan_karpenter_telemetry.vars.launch_failures_total }} failures, {{ outputs.scan_karpenter_telemetry.vars.interrupted_nodes_total }} interruptions."

  - id: emit_audit_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Emits structured audit manifest for cloud-native Kubernetes capacity governance and spot durability records.
    format: |
      {
        "status": "{{ outputs.scan_karpenter_telemetry.vars.is_alerting ? 'ALERT' : 'NOMINAL' }}",
        "cluster_name": "{{ inputs.cluster_name }}",
        "node_launches": {{ outputs.scan_karpenter_telemetry.vars.node_launches_total }},
        "launch_failures": {{ outputs.scan_karpenter_telemetry.vars.launch_failures_total }},
        "interrupted_nodes": {{ outputs.scan_karpenter_telemetry.vars.interrupted_nodes_total }},
        "failure_rate_percent": {{ outputs.scan_karpenter_telemetry.vars.launch_failure_rate_percent }},
        "audit_timestamp": "{{ outputs.scan_karpenter_telemetry.vars.audit_timestamp }}"
      }

triggers:
  - id: periodic_karpenter_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"

extend:
  title: "Karpenter Node Consolidation and Interruption Sentinel"
  metaTitle: "Karpenter Node Consolidation and Spot Interruption Sentinel Blueprint"
  shortDescription: "Audits Karpenter autoscaler telemetry for failed EC2 node launches, consolidation stalls, and spot interruptions."
  metaDescription: "Audits AWS Karpenter autoscaler Prometheus metrics to detect failed EC2 node launches, spot interruptions, and consolidation stalls."
  description: |
    Automates continuous health and capacity surveillance for AWS Karpenter Kubernetes autoscaling controllers.

    ## How it works
    1. A schedule trigger executes the Karpenter audit workflow every 15 minutes.
    2. The Python task queries the Karpenter controller Prometheus metrics endpoint on port 8000.
    3. The script extracts active NodePool launch requests, failed node creations, spot termination notices, and consolidation actions.
    4. An evaluation gate determines whether launch failures or spot interruptions breach operational tolerance bounds.
    5. When thresholds are breached, a high-priority Slack alert is dispatched to platform engineering and cluster SREs.
    6. When nodes provision cleanly and consolidation proceeds normally, nominal telemetry is logged.
    7. A structured JSON audit manifest is emitted for cloud capacity governance and spot durability SLA archives.

    ## Architecture diagram
    ```mermaid
    graph TD
        Trigger[Schedule Trigger: 15m] --> ScanMetrics[Python Script: Scrape Karpenter Metrics]
        ScanMetrics --> EvalBreach{Failures > Threshold OR Spot Interruptions > 5?}
        EvalBreach -- Yes --> SlackAlert[Slack: High-Urgency Capacity Alert]
        EvalBreach -- No --> LogNominal[Log: Nominal Karpenter State]
        SlackAlert --> EmitManifest[Debug Return: Karpenter Audit Manifest]
        LogNominal --> EmitManifest
    ```

    ## Architecture components
    - **Trigger**: Automated schedule polling at 15-minute intervals.
    - **Script Task**: Scrapes Karpenter Prometheus telemetry endpoints using Docker container isolation.
    - **Decision Gate**: Evaluates whether launch errors or spot interruption spikes exceed capacity safety limits.
    - **Notification Task**: Dispatches structured Slack alerts with cluster identity and failure counts.
    - **Audit Manifest**: Emits JSON execution payloads containing cluster autoscaling health and timestamps.

    ## Key capabilities
    - Continuous surveillance of Karpenter node launch errors and AWS EC2 API throttling failures.
    - Rapid detection of spot instance interruption spikes across active NodePool configurations.
    - Granular tracking of node consolidation actions and capacity defragmentation cycles.
    - Zero external dependency execution via isolated containerized Python runners.

    ## What you get
    - Preemptive alerting on compute capacity provisioning failures before workload pods enter pending loops.
    - Automated tracking of spot termination notices across AWS availability zones.
    - Real-time audit manifests capturing cluster autoscaler health for SOC 2 cloud compliance.
    - Configurable tolerance thresholds adaptable to critical production and batch compute clusters.

    ## Who it's for
    - Kubernetes Platform Engineers managing large-scale dynamic compute fleets on AWS EKS.
    - Site Reliability Engineers safeguarding critical workload scheduling against spot terminations.
    - Cloud Infrastructure Architects optimizing compute utilization while maintaining node pool SLA.
    - FinOps teams tracking automated cluster defragmentation and node consolidation efficiency.

    ## Why orchestrate this with Kestra
    - **Deterministic Scheduling**: Guarantees regular autoscaler health audits without fragile local crontab scripts.
    - **Containerized Runners**: Runs Python tasks inside isolated Docker containers without host library dependencies.
    - **Condition Branching**: Flowable `If` tasks route alerts and nominal logging cleanly without spaghetti code.
    - **Enterprise Secret Safety**: Securely injects Slack webhook credentials without plain-text exposure.

    ## Use cases
    - **Spot Interruption Wave Alerting**: Rapidly notifies operations when AWS reclaims spot capacity across availability zones.
    - **NodePool Misconfiguration Detection**: Identifies bad AMI IDs or insufficient subnet IP allocations causing launch loops.
    - **Consolidation Stall Auditing**: Monitors whether aggressive bin-packing causes pod eviction thrashing and scheduling latency.
    - **Continuous Infrastructure Compliance**: Feeds daily cluster autoscaling health telemetry into long-term governance archives.

    ## Inputs
    | Name | Type | Default | Description |
    |---|---|---|---|
    | `karpenter_metrics_url` | STRING | `http://karpenter.karpenter.svc.cluster.local:8000` | Base HTTP URL exposing Prometheus metrics for Karpenter. |
    | `cluster_name` | STRING | `production-eks-cluster` | Target Kubernetes cluster under Karpenter surveillance. |
    | `max_failed_launches_threshold` | INT | `2` | Max allowable failed node launch attempts before alerting. |
    | `max_interrupted_nodes_threshold` | INT | `5` | Max spot instance interruptions tolerated in a cycle. |
    | `alert_on_any_interruption` | BOOL | `false` | Whether any nonzero spot interruption triggers an immediate alert. |

    ## Expected outputs
    - `{{ outputs.scan_karpenter_telemetry.vars.node_launches_total }}`: Total EC2 node launch requests evaluated.
    - `{{ outputs.scan_karpenter_telemetry.vars.launch_failures_total }}`: Count of failed node launch requests.
    - `{{ outputs.scan_karpenter_telemetry.vars.interrupted_nodes_total }}`: Count of spot interruption notices received.
    - `{{ outputs.scan_karpenter_telemetry.vars.consolidation_actions_total }}`: Count of consolidation actions performed.
    - `{{ outputs.scan_karpenter_telemetry.vars.is_alerting }}`: Boolean flag indicating threshold violation.
    - `{{ outputs.emit_audit_manifest.value }}`: Structured JSON audit manifest emitted for compliance archives.

    ## Prerequisites
    - Karpenter controller deployed on AWS EKS with Prometheus metrics enabled on port 8000.
    - Metrics port reachable from the Kestra worker execution environment.
    - Docker daemon running on the Kestra host to execute containerized Python tasks.

    ### Secrets
    - `SLACK_WEBHOOK_URL`: Incoming webhook URL for the target Platform SRE Slack alerting channel.

    ## Quick start
    1. Ensure Karpenter service exposes port 8000 for Prometheus metrics scraping.
    2. Configure the `SLACK_WEBHOOK_URL` secret in your Kestra namespace settings.
    3. Specify your cluster identifier in `cluster_name`.
    4. Execute a manual test run via the Kestra UI to verify metric ingestion.
    5. Enable the `periodic_karpenter_audit` trigger to establish automated continuous surveillance.

    ## Common pitfalls and troubleshooting
    - **Network Policy Isolation**: If Kestra cannot reach port 8000, verify Kubernetes NetworkPolicies allow ingress from Kestra pods.
    - **Metric Name Evolution**: Karpenter v0.32+ renamed several metrics; verify the endpoint exposes standard Prometheus gauges.
    - **Spot Interruption Surges**: Multiple spot interruptions within minutes may trigger repeated alerts; adjust thresholds accordingly.
    - **RBAC Authentication**: If metrics endpoint requires bearer token authorization, add an Authorization header to the scraper request.

    ## How to extend
    - **Automated Fallback to On-Demand**: Chain an AWS CLI task to provision on-demand nodes when spot capacity collapses.
    - **Dynamic NodePool Tuning**: Adjust NodePool limits and consolidation policies via Kubernetes resource tasks.
    - **PagerDuty Escalation**: Escalate to on-call cloud platform engineers if launch errors exceed 10 in 15 minutes.

    ## Links
    - [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
    - [Karpenter Official Documentation and Architecture Guide](https://karpenter.sh/docs/)
    - [Karpenter Prometheus Metrics and Monitoring Guide](https://karpenter.sh/docs/tasks/monitoring/)
    - [AWS EKS Best Practices Guide for Karpenter Autoscaling](https://aws.github.io/aws-eks-best-practices/karpenter/)
  tags:
    - Cloud
    - Infrastructure
  subTags:
    - Kubernetes Operations
    - Monitoring & Alerting
  ee: false
  verified: false
  demo: false
