id: zoho-books-overdue-receivables-sentinel
namespace: company.team
description: |
  Every morning, read overdue invoices from the Zoho Books API (read-only:
  no invoice, reminder or payment is created) and classify receivables as
  HEALTHY, WARNING, CRITICAL or UNREACHABLE. Log quiet runs and alert Slack
  when customers are late paying, and page when an invoice is badly
  overdue or the total overdue amount crosses your limit.

inputs:
  - id: warning_days
    type: INT
    defaults: 15
    displayName: "Warning Days Overdue"
    description: "An invoice overdue by at least this many days makes the run WARNING."
  - id: critical_days
    type: INT
    defaults: 60
    displayName: "Critical Days Overdue"
    description: "An invoice overdue by at least this many days makes the run CRITICAL."
  - id: critical_overdue_balance
    type: FLOAT
    defaults: 500000.0
    displayName: "Critical Overdue Balance"
    description: "If the total unpaid balance of overdue invoices reaches this amount (in your base currency), the run is CRITICAL."

variables:
  accounts_domain: https://accounts.zoho.in
  api_domain: https://www.zohoapis.in

triggers:
  - id: morning_check
    type: io.kestra.plugin.core.trigger.Schedule
    description: Check receivables every weekday at 09:30 IST. Shipped disabled; enable it once the Zoho secrets are set and a manual run has been verified.
    cron: "30 9 * * 1-5"
    timezone: Asia/Kolkata
    disabled: true

tasks:
  - id: refresh_access_token
    type: io.kestra.plugin.core.http.Request
    description: Exchange the long-lived refresh token for a short-lived access token at the Zoho Accounts server for your data centre.
    uri: "{{ vars.accounts_domain }}/oauth/v2/token?grant_type=refresh_token&refresh_token={{ secret('ZOHO_REFRESH_TOKEN') }}&client_id={{ secret('ZOHO_CLIENT_ID') }}&client_secret={{ secret('ZOHO_CLIENT_SECRET') }}"
    method: POST
    options:
      timeout:
        connectTimeout: PT10S
        readIdleTimeout: PT30S
    retry:
      type: constant
      interval: PT10S
      maxAttempts: 3
    allowFailure: true

  - id: list_overdue_invoices
    type: io.kestra.plugin.core.http.Request
    description: Read up to 200 overdue invoices, oldest due date first. This is a GET with the ZohoBooks.invoices.READ scope; nothing is created or changed.
    uri: "{{ vars.api_domain }}/books/v3/invoices?organization_id={{ secret('ZOHO_BOOKS_ORGANIZATION_ID') }}&status=overdue&per_page=200&sort_column=due_date&sort_order=A"
    method: GET
    headers:
      Authorization: "Zoho-oauthtoken {{ fromJson(outputs.refresh_access_token.body).access_token }}"
    options:
      allowFailed: true
      timeout:
        connectTimeout: PT10S
        readIdleTimeout: PT30S
    retry:
      type: constant
      interval: PT10S
      maxAttempts: 3
    allowFailure: true

  - id: summarize_receivables
    type: io.kestra.plugin.core.debug.Return
    description: Add up the unpaid balance of overdue invoices, count those past the warning and critical day limits (by comparing due_date with today's date), find the customer owing the most, and classify in one jq query. A failed token exchange, a non-200 response or a Zoho error code becomes UNREACHABLE.
    format: >-
      {{ (outputs.list_overdue_invoices.code is not defined or outputs.list_overdue_invoices.code != 200)
      ? '{"status":"UNREACHABLE","overdue":0,"overdue_balance":0,"past_warning":0,"past_critical":0,"top_customer":"none"}'
      : (fromJson(outputs.list_overdue_invoices.body) | jq('
      if (.code // 0) != 0 then {status: "UNREACHABLE", overdue: 0, overdue_balance: 0, past_warning: 0, past_critical: 0, top_customer: "none"} else
      (.invoices // []) as $i
      | ([$i[] | select(.due_date <= "' ~ (now() | dateAdd(-inputs.warning_days, 'DAYS') | date('yyyy-MM-dd')) ~ '")] | length) as $w
      | ([$i[] | select(.due_date <= "' ~ (now() | dateAdd(-inputs.critical_days, 'DAYS') | date('yyyy-MM-dd')) ~ '")] | length) as $c
      | (([$i[].balance] | add // 0) * 100 | round / 100) as $b
      | {overdue: ($i | length), overdue_balance: $b, past_warning: $w, past_critical: $c,
      top_customer: (if ($i | length) == 0 then "none" else ($i | group_by(.customer_name) | map({c: .[0].customer_name, b: ([.[].balance] | add)}) | max_by(.b) | (.c + " owes " + (.b | tostring))) end),
      status: (if $c > 0 or $b >= ' ~ inputs.critical_overdue_balance ~ ' then "CRITICAL" elif $w > 0 then "WARNING" else "HEALTHY" end)}
      end
      ') | first | toJson) }}

  - id: route_by_receivables_state
    type: io.kestra.plugin.core.flow.Switch
    description: Route to a quiet log when nothing is overdue past the warning limit, a Slack message when invoices are getting late, or a Slack page when an invoice is badly overdue, the total crosses the limit, or Zoho Books could not be read.
    value: "{{ fromJson(outputs.summarize_receivables.value).status }}"
    cases:
      "HEALTHY":
        - id: log_healthy
          type: io.kestra.plugin.core.log.Log
          message: "Zoho Books receivables healthy: {{ fromJson(outputs.summarize_receivables.value).overdue }} overdue invoice(s), none past {{ inputs.warning_days }} days, total overdue balance {{ fromJson(outputs.summarize_receivables.value).overdue_balance }}."
      "WARNING":
        - id: alert_warning_receivables
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: Post a Slack message when invoices are overdue past the warning limit.
          url: "{{ secret('SLACK_WEBHOOK') }}"
          payload: |
            {
              "text": "Zoho Books receivables WARNING: {{ fromJson(outputs.summarize_receivables.value).past_warning }} invoice(s) overdue by {{ inputs.warning_days }}+ days, {{ fromJson(outputs.summarize_receivables.value).overdue }} overdue in total with balance {{ fromJson(outputs.summarize_receivables.value).overdue_balance }}. Largest: {{ fromJson(outputs.summarize_receivables.value).top_customer }}. Execution {{ execution.id }}."
            }
      "CRITICAL":
        - id: alert_critical_receivables
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: Page Slack when an invoice is overdue past the critical limit or the overdue balance reaches the critical amount.
          url: "{{ secret('SLACK_WEBHOOK') }}"
          payload: |
            {
              "text": "Zoho Books receivables CRITICAL: {{ fromJson(outputs.summarize_receivables.value).past_critical }} invoice(s) overdue by {{ inputs.critical_days }}+ days, total overdue balance {{ fromJson(outputs.summarize_receivables.value).overdue_balance }} (limit {{ inputs.critical_overdue_balance }}). Largest: {{ fromJson(outputs.summarize_receivables.value).top_customer }}. Execution {{ execution.id }}."
            }
      "UNREACHABLE":
        - id: alert_unreachable_api
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: Page Slack when the token exchange or the Invoices API failed, usually a revoked refresh token, a wrong data centre domain or a wrong organization ID.
          url: "{{ secret('SLACK_WEBHOOK') }}"
          payload: |
            {
              "text": "Zoho Books receivables sentinel UNREACHABLE: token HTTP {{ outputs.refresh_access_token.code ?? 'no response' }}, invoices HTTP {{ outputs.list_overdue_invoices.code ?? 'no response' }}. Check the refresh token, the data centre domains and the organization ID. Execution {{ execution.id }}."
            }
    defaults:
      - id: log_unclassified
        type: io.kestra.plugin.core.log.Log
        message: "Zoho Books receivables sentinel completed with an unexpected classification: {{ outputs.summarize_receivables.value }}."

  - id: log_audit_result
    type: io.kestra.plugin.core.log.Log
    description: Record one audit line for every run, whichever branch fired, so receivables history stays queryable even if Slack delivery fails.
    message: "Zoho Books receivables sentinel audit: http={{ outputs.list_overdue_invoices.code ?? 'n/a' }} summary={{ outputs.summarize_receivables.value }} execution={{ execution.id }}."

errors:
  - id: alert_flow_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alert Slack when the sentinel flow itself fails, so a broken check is never mistaken for customers paying on time.
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "text": "Zoho Books receivables sentinel flow {{ flow.id }} FAILED (execution {{ execution.id }}). Overdue receivables are now unknown; check the task logs and Zoho Books."
      }

outputs:
  - id: status
    type: STRING
    value: "{{ fromJson(outputs.summarize_receivables.value).status }}"
  - id: overdue_balance
    type: STRING
    value: "{{ fromJson(outputs.summarize_receivables.value).overdue_balance }}"

extend:
  title: "Zoho Books Overdue Receivables Sentinel"
  shortDescription: Read overdue invoices from Zoho Books every morning and alert Slack when customers are late paying or the overdue total crosses a limit.
  metaTitle: Zoho Books Overdue Receivables Sentinel for Kestra
  metaDescription: "Read overdue Zoho Books invoices every morning, change nothing, and alert Slack when customers are late or the overdue total crosses a limit."
  description: |
    For a small business, cash flow depends on customers paying on time, and Zoho Books marks an invoice `overdue` the day after its due date. Nobody gets paged, though: the overdue list only matters when someone opens it, and by then an invoice can be two months late. This blueprint turns a scheduled, read-only call to the Zoho Books API into a receivables gate: two `io.kestra.plugin.core.http.Request` tasks refresh an OAuth token and read overdue invoices, one jq query adds up the overdue balance, counts invoices past your warning and critical limits and finds the customer owing the most, and the result routes to a quiet log or a Slack alert.

    ## How it works

    1. `refresh_access_token` (`io.kestra.plugin.core.http.Request`) exchanges the long-lived refresh token for a short-lived access token at the Zoho Accounts server (`/oauth/v2/token`, `grant_type=refresh_token`). Defaults use the India data centre; change `accounts_domain` and `api_domain` for `.com`, `.eu` and others.
    2. `list_overdue_invoices` (`io.kestra.plugin.core.http.Request`) calls `GET /books/v3/invoices` with `status=overdue`, `per_page=200` and `sort_column=due_date`, sending `Authorization: Zoho-oauthtoken <token>`. It needs only the `ZohoBooks.invoices.READ` scope and changes nothing. `allowFailed` plus `allowFailure` on both calls keep an API error from aborting the flow so it can be reported instead.
    3. `summarize_receivables` (`io.kestra.plugin.core.debug.Return`) first guards for a missing or non-200 response, then for a non-zero Zoho `code` (`UNREACHABLE`). Otherwise one jq query adds up `balance`, counts invoices whose `due_date` is at least `warning_days` and `critical_days` in the past, and finds the customer with the largest overdue balance. Any invoice past `critical_days`, or a total at or above `critical_overdue_balance`, is `CRITICAL`; any invoice past `warning_days` is `WARNING`; otherwise `HEALTHY`.
    4. `route_by_receivables_state` (`io.kestra.plugin.core.flow.Switch`) branches on that classification: `HEALTHY` logs quietly, `WARNING` posts a Slack note, `CRITICAL` and `UNREACHABLE` page Slack. A `defaults` fallback logs anything unexpected.
    5. `log_audit_result` (`io.kestra.plugin.core.log.Log`) writes one audit line per run with the HTTP status and the full summary.
    6. The flow-level `errors` block pages Slack if the flow itself fails, and the `morning_check` trigger runs at 09:30 IST on weekdays, shipped `disabled: true`.

    ## What you get

    - A daily, read-only receivables check with no custom scripting and no extra plugin to install.
    - A `status` output (`HEALTHY` / `WARNING` / `CRITICAL` / `UNREACHABLE`) and an `overdue_balance` output other flows can use.
    - Slack messages with the number of late invoices, the total owed and the customer owing the most, so the accounts team knows who to call first.
    - An audit line on every run, separate from Slack.

    ## Who it's for

    - Small and mid-size businesses in India and elsewhere that invoice customers from Zoho Books.
    - Accounts and finance teams who chase payments and want a morning signal instead of a monthly ageing report.
    - Founders who want to see cash stuck with customers before it becomes a problem.

    ## Why orchestrate this with Kestra

    Zoho Books can email payment reminders to customers, but it does not tell your own team when receivables are getting out of hand. Kestra handles the OAuth refresh, the read-only API call, the classification, retries, a failure path and an execution history in one flow, and the `status` output can hold back other spending flows while too much cash is overdue.

    ## Prerequisites

    - A Zoho Books organization (the free plan for small businesses includes API access) and its organization ID from Settings > Organization Profile.
    - A self client in the Zoho API Console for your data centre, with a refresh token generated for the `ZohoBooks.invoices.READ` scope.
    - A Slack incoming webhook for the WARNING, CRITICAL, UNREACHABLE and flow-failure alerts.

    ### Secrets

    - `ZOHO_CLIENT_ID` and `ZOHO_CLIENT_SECRET`: the self client's credentials.
    - `ZOHO_REFRESH_TOKEN`: refresh token for `ZohoBooks.invoices.READ`.
    - `ZOHO_BOOKS_ORGANIZATION_ID`: the Zoho Books organization ID.
    - `SLACK_WEBHOOK`: Slack incoming webhook used for every alert branch and the flow-failure alert.

    In Kestra OSS, secrets are supplied as environment variables prefixed `SECRET_` and base64-encoded, for example `SECRET_ZOHO_BOOKS_ORGANIZATION_ID=$(echo -n '60012345678' | base64)`, and read back with `{{ secret('ZOHO_BOOKS_ORGANIZATION_ID') }}`. Use the Enterprise secrets backend for encryption at rest and access control.

    ## Quick start

    1. In the Zoho API Console for your data centre (api-console.zoho.in for India), create a Self Client and generate a grant code with scope `ZohoBooks.invoices.READ`.
    2. Exchange the grant code for a refresh token once (`POST /oauth/v2/token` with `grant_type=authorization_code`) and store it with the client ID, client secret and organization ID as secrets.
    3. In Zoho Books, create a test invoice with a due date a few weeks in the past, then run the flow manually: `status` should be `WARNING`, or `CRITICAL` if it is older than `critical_days`.
    4. Enable `morning_check`.

    ## How to extend

    - Page through more than 200 overdue invoices with `page` while `page_context.has_more_page` is true.
    - Read `status=unpaid` as well to forecast what falls due this week.
    - Send a polite reminder through Zoho Books' own reminder endpoint for invoices past `warning_days`, behind an approval step.
    - Store the overdue balance in a KV store and chart it over time.

    ## Inputs

    - `warning_days`: type INT, default `15`.
    - `critical_days`: type INT, default `60`.
    - `critical_overdue_balance`: type FLOAT, default `500000.0`.

    ## Outputs

    - `status`: one of `HEALTHY`, `WARNING`, `CRITICAL`, `UNREACHABLE`.
    - `overdue_balance`: total unpaid balance of overdue invoices.
    - Example path: `{{ fromJson(outputs.summarize_receivables.value).top_customer }}` for the customer owing the most.

    ## Links

    - [Zoho Books API: list invoices](https://www.zoho.com/books/api/v3/invoices/#list-invoices)
    - [Zoho Books API: OAuth](https://www.zoho.com/books/api/v3/oauth/)
    - [Kestra HTTP Request task](https://kestra.io/plugins/core/tasks/http/io.kestra.plugin.core.http.request)
    - [Kestra Slack plugin](https://kestra.io/plugins/plugin-slack)

    ## Pitfalls

    - The API domain must match the organization's data centre (`.in`, `.com`, `.eu`, `.com.au`, ...); a mismatch shows up as `UNREACHABLE`.
    - Balances are added in each invoice's own currency; an organization that invoices in several currencies should compare `critical_overdue_balance` per currency or convert with `exchange_rate`.
    - `due_date` is compared with today's date in the Kestra server's time zone; run Kestra in IST or adjust the limits by a day if that matters.
    - This flow only reads; it never creates an invoice, a reminder or a payment.
  tags:
    - Business
  subTags:
    - Monitoring & Alerting
  ee: false
  demo: false
