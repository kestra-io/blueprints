    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
    - [Telegraf Internal Input Plugin Reference](https://github.com/influxdata/telegraf/tree/master/plugins/inputs/internal)
    - [Telegraf Buffer and Batch Sizing Architecture](https://docs.influxdata.com/telegraf/v1/administration/troubleshooting/)
    - [Telegraf Prometheus Client Output Guide](https://github.com/influxdata/telegraf/tree/master/plugins/outputs/prometheus_client)
