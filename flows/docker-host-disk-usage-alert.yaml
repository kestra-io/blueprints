id: docker-host-disk-usage-alert
namespace: company.team
description: |
  Check root filesystem usage on the worker host, and alert Slack before the
  disk fills up and takes pipelines down with it.

triggers:
  - id: hourly_disk_check
    type: io.kestra.plugin.core.trigger.Schedule
    description: Hourly check catches logs and build artifacts ballooning between cleanups.
    cron: "15 * * * *"

inputs:
  - id: threshold_percent
    type: INT
    defaults: 85
    description: Usage percentage that triggers the alert.
  - id: path
    type: STRING
    defaults: "/"
    description: Filesystem path to check.

tasks:
  - id: check_disk
    type: io.kestra.plugin.scripts.python.Script
    description: Inspects filesystem usage and alerts on critical disk consumption.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    env:
      CHECK_PATH: "{{ inputs.path }}"
    script: |
      import os
      import sys
      import json
      import shutil
      from kestra import Kestra

      path = os.environ.get("CHECK_PATH", "/")

      try:
          usage = shutil.disk_usage(path)
          used_percent = int((usage.used / usage.total) * 100)
          total_gb = round(usage.total / (1024**3), 2)
          free_gb = round(usage.free / (1024**3), 2)
      except Exception as e:
          print(f"CRITICAL: Failed to query disk usage for path '{path}': {e}", file=sys.stderr)
          sys.exit(1)

      report = {
          "path": path,
          "used_percent": used_percent,
          "total_gb": total_gb,
          "free_gb": free_gb
      }

      with open("disk_usage_report.json", "w") as f:
          json.dump(report, f, indent=2)

      Kestra.outputs({
          "used_percent": used_percent,
          "free_gb": free_gb
      })
      print(f"Disk check: path={path}, used={used_percent}%, free={free_gb} GB")
    outputFiles:
      - disk_usage_report.json

  - id: over_threshold
    type: io.kestra.plugin.core.flow.If
    description: Branch so only a real breach alerts; a passing check is logged for the trend.
    condition: "{{ outputs.check_disk.vars.used_percent >= inputs.threshold_percent }}"
    then:
      - id: alert_disk
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: State the numbers and the path so the on-call sees exactly which disk is in trouble.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": ":floppy_disk: Disk usage on {{ inputs.path }} is {{ outputs.check_disk.vars.used_percent }}% (threshold {{ inputs.threshold_percent }}%). Free space before a worker starts failing. Execution {{ execution.id }}."
          }

errors:
  - id: alert_on_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": ":warning: Docker Host Disk Usage Alert execution failed on {{ inputs.path }}. Execution ID: {{ execution.id }}."
      }

extend:
  title: Docker Host Disk Usage Alert
  metaTitle: Docker Host Disk Usage Alert Blueprint
  shortDescription: Audits worker filesystem usage and dispatches Slack notifications when storage exceeds safety thresholds.
  metaDescription: Monitors worker host filesystem utilization, prevents out-of-disk crashes, and notifies SREs via Slack.
  description: |
    Worker nodes and container runner hosts accumulate container image layers, dangling volumes, and execution logs over time. If available storage exhausts, scheduled workflows fail and container runtimes deadlock. This workflow checks disk usage on a recurring schedule and notifies operations when consumption exceeds configured thresholds.

    ## Architecture diagram
    ```mermaid
    flowchart TD
      A[hourly_disk_check Schedule Trigger] --> B[check_disk Python Script]
      B --> C{Used Percent >= Threshold?}
      C -- Yes --> D[alert_disk Slack Webhook]
      C -- No --> E[Disk Headroom Nominal]
    ```

    ## Prerequisites
    - Secret `SLACK_WEBHOOK_URL` configured in Kestra.

    ## Quick start
    1. Import the blueprint under the `company.team` namespace.
    2. Configure filesystem path and warning threshold.
    3. Run manually to check current disk capacity.

    ## Links
    - [Kestra Python Script Documentation](https://kestra.io/plugins/plugin-scripts-python)
  tags:
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - Day 2 Operations
  ee: false
  demo: false
