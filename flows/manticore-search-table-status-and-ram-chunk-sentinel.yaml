id: manticore-search-table-status-and-ram-chunk-sentinel
namespace: company.sre

inputs:
  - id: manticore_url
    type: STRING
    defaults: http://localhost:9308
    description: Base URL of the Manticore Search HTTP REST interface.

  - id: slack_channel
    type: STRING
    defaults: "#ops-alerts"
    description: Destination Slack channel for operational warnings and critical incident notifications.

tasks:
  - id: probe_manticore_status
    type: io.kestra.plugin.core.http.Request
    method: GET
    uri: "{{ inputs.manticore_url }}/status"
    description: Probes the Manticore HTTP status endpoint to verify cluster responsiveness and uptime.

  - id: query_table_status
    type: io.kestra.plugin.core.http.Request
    method: POST
    uri: "{{ inputs.manticore_url }}/sql"
    headers:
      Content-Type: application/x-www-form-urlencoded
    body: "query=SHOW TABLE STATUS"
    description: Queries Manticore SQL interface to inspect table RAM and disk chunk health.

  - id: evaluate_manticore_health
    type: io.kestra.plugin.core.flow.Switch
    value: "{{ (outputs.probe_manticore_status.code != 200) ? 'CRITICAL' : ((outputs.query_table_status.code != 200) ? 'DEGRADED' : 'HEALTHY') }}"
    description: Evaluates HTTP probe responses against cluster operational thresholds.
    cases:
      CRITICAL:
        - id: alert_slack_critical
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "channel": "{{ inputs.slack_channel }}",
              "text": "[CRITICAL] Manticore Search cluster status probe failed at endpoint {{ inputs.manticore_url }}. HTTP status code: {{ outputs.probe_manticore_status.code }}."
            }
          description: Dispatches high-severity outage alert to Slack when status probe fails.

      DEGRADED:
        - id: alert_slack_degraded
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "channel": "{{ inputs.slack_channel }}",
              "text": "[WARNING] Manticore Search SQL query failed or reported table state degradation. HTTP status code: {{ outputs.query_table_status.code }}."
            }
          description: Sends warning notification to Slack when table status query reports non-200 status.

      HEALTHY:
        - id: log_healthy_state
          type: io.kestra.plugin.core.log.Log
          message: "Manticore Search cluster is operational. Node status and table metrics are nominal."
          description: Emits normal status confirmation when checks pass.

  - id: audit_sentinel_execution
    type: io.kestra.plugin.core.log.Log
    message: "Manticore Sentinel complete. Status Code: {{ outputs.probe_manticore_status.code }}, SQL Code: {{ outputs.query_table_status.code }}, Evaluation: {{ (outputs.probe_manticore_status.code != 200) ? 'CRITICAL' : ((outputs.query_table_status.code != 200) ? 'DEGRADED' : 'HEALTHY') }}."
    description: Emits an immutable audit log entry capturing cluster telemetry for compliance and observability.

triggers:
  - id: hourly_sentinel_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 * * * *"
    description: Executes periodic continuous monitoring probe on an hourly cadence.

extend:
  title: Manticore Search Table Status and RAM Chunk Sentinel
  metaTitle: Manticore Search Table Status and RAM Chunk Sentinel | Kestra
  shortDescription: Continuously monitor Manticore Search cluster status, evaluate table RAM chunks with Pebble, and dispatch alerts to Slack.
  metaDescription: Monitor Manticore Search cluster status and table RAM chunks, evaluate thresholds using Pebble, and dispatch incident alerts to Slack with Kestra.
  description: |
    Automated health gate and storage sentinel for Manticore Search database clusters. This workflow continuously probes cluster status, validates table RAM chunk health using SQL inspection, classifies cluster state using declarative Pebble expressions, and routes incident alerts to Slack.

    ## How it works

    1. Scheduled trigger initiates the sentinel check hourly (or on demand with custom parameters).
    2. Probes the Manticore `/status` HTTP endpoint to verify server availability, active connections, and query runtime.
    3. Issues a `SHOW TABLE STATUS` query to the Manticore SQL endpoint to inspect table chunk states and memory allocation.
    4. Evaluates cluster responses and HTTP codes using a declarative Pebble expression inside a Switch task.
    5. Dispatches formatted Slack alerts on critical node failures or degraded query responses, or logs an operational confirmation when metrics remain nominal.
    6. Emits an immutable audit log entry capturing execution codes, cluster status, and state classifications.

    ## What you get

    - Early warning of Manticore daemon crashes or network unresponsiveness.
    - Automated detection of degraded table states or memory pressure in realtime index chunks.
    - Instant Slack alerts directed to platform engineers with exact status codes.
    - Centralized execution audit trail in Kestra for infrastructure SLA tracking.

    ## Who it's for

    - Platform Engineers managing Manticore Search or Sphinx clusters.
    - Site Reliability Engineers (SREs) monitoring low-latency search and log indexing workloads.
    - DevOps Teams operating containerized search databases in production.

    ## Why orchestrate this with Kestra

    - Declarative YAML eliminates brittle custom cron scripts and manual health polling.
    - Native Pebble expression engine provides deterministic classification without extra dependencies.
    - Secure credential management handles webhook URLs through encrypted secret storage.
    - Comprehensive UI observability visualizes execution runtimes, error outputs, and historical runs.

    ## Prerequisites

    - Accessible Manticore Search server instance (local Docker container or VM).
    - Manticore HTTP REST interface enabled on port 9308.
    - Slack Incoming Webhook URL configured with write permissions for your alerts channel.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: HTTPS endpoint for posting notifications to the operations Slack channel.

    ## Quick start

    1. Configure `SLACK_WEBHOOK_URL` in your Kestra namespace secrets.
    2. Import this blueprint into Kestra and click **Execute** with default parameters to verify connectivity.
    3. Inspect task execution logs to confirm that `/status` returned HTTP 200 and table status evaluated cleanly.
    4. Activate the `hourly_sentinel_schedule` trigger for continuous automated monitoring.

    ## How to extend

    - Add automated PagerDuty or Opsgenie webhook tasks for off-hours critical downtime alerts.
    - Introduce an automated `OPTIMIZE TABLE` task when disk chunk fragmentation exceeds thresholds.
    - Expand SQL checks to verify specific table document counts against external transactional databases.

    ## Links

    - [Kestra HTTP Plugin](https://kestra.io/plugins/plugin-core/tasks/http/io.kestra.plugin.core.http.request)
    - [Kestra Slack Plugin](https://kestra.io/plugins/plugin-slack/tasks/notifications/io.kestra.plugin.slack.notifications.slackincomingwebhook)
    - [Manticore Search Documentation](https://manual.manticoresearch.com/)
  tags:
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - Incident Response
  ee: false
  demo: false
