id: cloudflare-tunnel-health-sentinel
namespace: company.team

inputs:
  - id: cloudflare_account_id
    type: STRING
    defaults: 023e105f4ecef8ad9ca31a8372d0c353
    description: The 32-character Cloudflare Account ID.
  - id: cloudflare_tunnel_id
    type: STRING
    defaults: 12345678-1234-1234-1234-123456789abc
    description: The UUID of the Cloudflare Tunnel to monitor.

tasks:
  - id: inspect_tunnel_health
    type: io.kestra.plugin.scripts.shell.Commands
    containerImage: ghcr.io/kestra-io/tools:latest
    commands:
      - |
        set -euo pipefail
        python3 -c "
        import requests, json, sys

        account_id = '{{ inputs.cloudflare_account_id }}'
        tunnel_id = '{{ inputs.cloudflare_tunnel_id }}'
        token = '{{ secret('CLOUDFLARE_API_TOKEN') }}'

        headers = {
            'Authorization': f'Bearer {token}',
            'Content-Type': 'application/json'
        }
        url = f'https://api.cloudflare.com/client/v4/accounts/{account_id}/cfd_tunnel/{tunnel_id}'

        try:
            resp = requests.get(url, headers=headers, timeout=15)
            resp.raise_for_status()
            data = resp.json()
            result_data = data.get('result', {})
            status = result_data.get('status', 'unknown')
            conns = result_data.get('connections', [])
            is_healthy = (status == 'healthy') and (len(conns) > 0)
            output = {
                'tunnel_id': tunnel_id,
                'tunnel_name': result_data.get('name', 'unknown'),
                'status': status,
                'active_connectors': len(conns),
                'alert_triggered': not is_healthy
            }
            with open('tunnel_summary.json', 'w') as out:
                json.dump(output, out)
            print('Cloudflare Tunnel audit:', output)
        except Exception as err:
            sys.stderr.write(f'Cloudflare Tunnel query error: {err}\n')
            sys.exit(1)
        "
    outputFiles:
      - tunnel_summary.json

  - id: evaluate_tunnel_state
    type: io.kestra.plugin.core.flow.If
    condition: "{{ fromJson(read(outputs.inspect_tunnel_health.outputFiles['tunnel_summary.json'])).alert_triggered }}"
    then:
      - id: alert_netops_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "text": ":rotating_light: *Cloudflare Tunnel Down Alert*: Tunnel `{{ fromJson(read(outputs.inspect_tunnel_health.outputFiles['tunnel_summary.json'])).tunnel_name }}` (ID: {{ inputs.cloudflare_tunnel_id }}) is in `{{ fromJson(read(outputs.inspect_tunnel_health.outputFiles['tunnel_summary.json'])).status }}` state with {{ fromJson(read(outputs.inspect_tunnel_health.outputFiles['tunnel_summary.json'])).active_connectors }} active edge connectors. Internal ingress routing is compromised."
          }

errors:
  - id: notify_sentinel_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "text": ":warning: *Cloudflare Sentinel Failure*: Failed to query tunnel details for `{{ inputs.cloudflare_tunnel_id }}`."
      }

triggers:
  - id: scheduled_tunnel_check
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/5 * * * *"
    disabled: true

extend:
  metaDescription: "Audits Cloudflare Zero Trust Tunnels to detect connector dropouts, degraded routing, and edge connectivity outages."
  metaTitle: Cloudflare Tunnel Connector Status and Ingress Health Sentinel with Kestra
  title: Cloudflare Tunnel Connector Status and Ingress Health Sentinel
  shortDescription: Audits Cloudflare Zero Trust Tunnels to detect connector dropouts, degraded routing, and edge connectivity outages.
  description: |
    ## How it works
    This sentinel queries the Cloudflare Zero Trust Tunnels API to inspect the operational status and active edge connections of a named tunnel. It triggers instant alerts if `cloudflared` daemon processes crash or drop edge connections, ensuring that internal web application and SSH ingress routes remain accessible.

    ## What you get
    - Real-time detection of private network ingress failures without inbound firewall ports.
    - Early warning before developers or external users lose access to internal services.
    - Automated Slack delivery tracking tunnel name, ID, status, and active connector counts.

    ## Who it's for
    - Zero Trust network architects, security engineers, and DevOps leads.
    - SREs managing private microservice ingress via Cloudflare Tunnel.

    ## Why orchestrate this with Kestra
    Kestra automates distributed cloud observability, executing scheduled health checks with fine-grained error management and notification delivery.

    ## Prerequisites
    - Cloudflare API Token with `Account.Cloudflare_Tunnel:Read` permissions.
    - Secrets `CLOUDFLARE_API_TOKEN` and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import this blueprint into Kestra.
    2. Configure `cloudflare_account_id` and `cloudflare_tunnel_id`.
    3. Run manually to check current tunnel health.

    ## How to extend
    - Query individual connector daemon versions to enforce automated agent update policies.
    - Automatically restart `cloudflared` containers on Kubernetes via kubectl commands when degraded.
    - Forward tunnel health status to Datadog or Prometheus.

    ## Links
    - [Cloudflare Tunnels API Documentation](https://developers.cloudflare.com/api/operations/cloudflare-tunnel-get-a-cloudflare-tunnel)
    - [Kestra Slack Notifications](https://kestra.io/plugins/plugin-slack)
  tags:
    - Cloud
    - Infrastructure
  subTags:
    - Monitoring & Alerting
  ee: false
  demo: false
