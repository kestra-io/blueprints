id: kestra-docs-codeblock-and-link-verifier
namespace: company.documentation

description: |
  Automated documentation quality assurance pipeline that parses Kestra documentation markdown files,
  extracts all embedded YAML flow code blocks, validates their syntax and Kestra 2.0 primitives
  against schema rules to detect broken tutorial examples, checks documentation hyperlinks for 404
  dead links, and posts an itemized documentation health digest to DevRel and documentation teams.

inputs:
  - id: docs_github_repo
    type: STRING
    defaults: "kestra-io/docs"
    description: "GitHub repository (owner/repo) containing markdown documentation to audit."

  - id: docs_path
    type: STRING
    defaults: "content/docs"
    description: "Path inside the repository containing markdown documentation."

  - id: check_external_urls
    type: BOOL
    defaults: false
    description: "When true, verifies HTTP response status codes for external documentation hyperlinks."

  - id: max_broken_tolerated
    type: INT
    defaults: 0
    description: "Maximum number of broken code blocks tolerated before triggering an alert card."

tasks:
  - id: fetch_and_verify_docs
    type: io.kestra.plugin.scripts.python.Script
    description: Fetches documentation markdown files from repository, audits embedded YAML flow blocks, and checks hyperlinks.
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install requests pyyaml kestra
    script: |
      import sys
      import re
      import json
      import yaml
      import requests
      from kestra import Kestra

      repo = "{{ inputs.docs_github_repo }}"
      path = "{{ inputs.docs_path }}"
      check_external = {{ inputs.check_external_urls }}
      max_broken_tolerated = {{ inputs.max_broken_tolerated }}

      api_url = f"https://api.github.com/repos/{repo}/contents/{path}"
      print(f"Fetching docs from {api_url}...")
      
      headers = {"User-Agent": "Kestra-Docs-Verifier", "Accept": "application/vnd.github.v3+json"}
      try:
          resp = requests.get(api_url, headers=headers, timeout=15)
          resp.raise_for_status()
          items = resp.json()
      except Exception as e:
          print(f"ERROR: Failed to fetch docs from {api_url}: {e}", file=sys.stderr)
          sys.exit(1)

      doc_pages = []
      for it in (items if isinstance(items, list) else [items]):
          if it.get("type") == "file" and str(it.get("name", "")).endswith(".md"):
              try:
                  download_url = it.get("download_url")
                  if download_url:
                      fc = requests.get(download_url, headers=headers, timeout=10).text
                      doc_pages.append({"path": it.get("path"), "content": fc})
              except Exception as err:
                  print(f"Warning fetching {it.get('name')}: {err}")

      if not doc_pages:
          # If directory has subdirs or empty, fetch README or top-level file
          readme_url = f"https://raw.githubusercontent.com/{repo}/main/README.md"
          try:
              res = requests.get(readme_url, timeout=10)
              if res.status_code == 200:
                  doc_pages.append({"path": "README.md", "content": res.text})
          except Exception:
              pass

      if not doc_pages:
          print(f"ERROR: No markdown files found to audit in {repo}/{path}", file=sys.stderr)
          sys.exit(1)

      total_codeblocks = 0
      valid_codeblocks = 0
      broken_blocks = []
      broken_links = []

      yaml_block_regex = re.compile(r'```(?:yaml|yml)\n(.*?)```', re.DOTALL)
      link_regex = re.compile(r'\[([^\]]+)\]\((https?://[^\)]+)\)')

      for page in doc_pages:
          page_path = page.get("path", "unknown.md")
          content = page.get("content", "")

          blocks = yaml_block_regex.findall(content)
          for idx, snippet in enumerate(blocks, start=1):
              total_codeblocks += 1
              block_errors = []

              if re.search(r'\s+runner:\s+Docker', snippet):
                  block_errors.append("Uses deprecated 'runner: Docker' property (replace with 'taskRunner:').")
              if "pluginDefaults:" in snippet:
                  block_errors.append("Uses deprecated root 'pluginDefaults' block.")

              try:
                  parsed = yaml.safe_load(snippet)
                  if isinstance(parsed, dict):
                      if "id" in parsed and "tasks" not in parsed:
                          block_errors.append("Flow definition defines 'id' but lacks required 'tasks' mapping.")
                  else:
                      block_errors.append("Snippet does not parse to a valid YAML mapping.")
              except Exception as err:
                  block_errors.append(f"YAML Syntax Error: {str(err)}")

              if block_errors:
                  broken_blocks.append({
                      "file": page_path,
                      "block_index": idx,
                      "errors": block_errors
                  })
              else:
                  valid_codeblocks += 1

          if check_external:
              links = link_regex.findall(content)
              for anchor_text, url in links:
                  try:
                      r = requests.head(url, timeout=5, allow_redirects=True, headers=headers)
                      if r.status_code >= 400:
                          broken_links.append({
                              "file": page_path,
                              "anchor": anchor_text,
                              "url": url,
                              "reason": f"HTTP status {r.status_code}"
                          })
                  except Exception as err:
                      broken_links.append({
                          "file": page_path,
                          "anchor": anchor_text,
                          "url": url,
                          "reason": str(err)
                      })

      has_defects = len(broken_blocks) > max_broken_tolerated or len(broken_links) > 0
      print(f"Audited {len(doc_pages)} pages: {total_codeblocks} codeblocks ({len(broken_blocks)} broken), {len(broken_links)} broken links.")

      Kestra.outputs({
          "total_pages_scanned": len(doc_pages),
          "total_codeblocks_found": total_codeblocks,
          "valid_codeblocks": valid_codeblocks,
          "broken_codeblocks_count": len(broken_blocks),
          "broken_links_count": len(broken_links),
          "has_documentation_defects": has_defects,
          "broken_blocks_report": json.dumps(broken_blocks),
          "broken_links_report": json.dumps(broken_links)
      })

  - id: evaluate_documentation_health
    type: io.kestra.plugin.core.flow.If
    description: Routes execution based on whether broken code examples or dead links were detected.
    condition: "{{ outputs.fetch_and_verify_docs.vars.has_documentation_defects }}"
    then:
      - id: notify_devrel_defects
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches detailed documentation defect alert to DevRel and docs maintainers.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "📚 *Kestra Documentation QA Defect Alert*\n• *Pages Audited:* {{ outputs.fetch_and_verify_docs.vars.total_pages_scanned }}\n• *Code Blocks Found:* {{ outputs.fetch_and_verify_docs.vars.total_codeblocks_found }}\n• *Broken Code Blocks:* {{ outputs.fetch_and_verify_docs.vars.broken_codeblocks_count }}\n• *Dead Links Found:* {{ outputs.fetch_and_verify_docs.vars.broken_links_count }}\n• *Status:* Deprecated tasks or invalid YAML snippets detected in tutorial pages."
          }

      - id: log_documentation_audit
        type: io.kestra.plugin.core.log.Log
        description: Records itemized documentation defects in execution logs for triage.
        message: "Documentation defects detected: Code Blocks: {{ outputs.fetch_and_verify_docs.vars.broken_blocks_report }} | Links: {{ outputs.fetch_and_verify_docs.vars.broken_links_report }}"
    else:
      - id: notify_docs_clean
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches confirmation notice that documentation examples and hyperlinks are healthy.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "✅ *Kestra Documentation QA Passed*\n• *All embedded YAML flow snippets parse successfully and adhere to Kestra 2.0 standards.*"
          }

triggers:
  - id: scheduled_docs_sweep
    type: io.kestra.plugin.core.trigger.Schedule
    description: Weekly scheduled documentation audit sweep. Shipped disabled by default.
    cron: "0 6 * * 1"
    disabled: true

errors:
  - id: alert_docs_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Catches execution errors and notifies DevRel on-call.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "⚠️ Documentation QA pipeline execution {{ execution.id }} failed unexpectedly on flow {{ flow.id }}."
      }

outputs:
  - id: total_pages_scanned
    type: INT
    description: Total markdown documentation pages audited.
    value: "{{ outputs.fetch_and_verify_docs.vars.total_pages_scanned }}"
  - id: total_codeblocks_found
    type: INT
    description: Total embedded YAML code blocks extracted.
    value: "{{ outputs.fetch_and_verify_docs.vars.total_codeblocks_found }}"
  - id: broken_codeblocks_count
    type: INT
    description: Count of broken or non-compliant YAML code blocks.
    value: "{{ outputs.fetch_and_verify_docs.vars.broken_codeblocks_count }}"
  - id: broken_links_count
    type: INT
    description: Count of dead hyperlinks identified.
    value: "{{ outputs.fetch_and_verify_docs.vars.broken_links_count }}"
  - id: has_documentation_defects
    type: BOOLEAN
    description: True if defects exceeded tolerance, false otherwise.
    value: "{{ outputs.fetch_and_verify_docs.vars.has_documentation_defects }}"

extend:
  title: Kestra Documentation Codeblock and Link Verifier
  shortDescription: Validate embedded YAML flow examples and check hyperlinks across Kestra documentation to prevent broken tutorial snippets and dead links.
  metaTitle: Kestra Documentation Codeblock and Link Verifier
  metaDescription: Automated documentation QA pipeline. Parses markdown docs, validates embedded Kestra YAML code blocks against schemas, and audits links.
  description: |
    Technical documentation is the primary interface through which developers evaluate and adopt Kestra.
    However, as orchestrator features rapidly evolve across versions, documentation drift poses a constant
    challenge: embedded YAML tutorial snippets can reference deprecated 1.x task primitives (legacy `runner:`
    parameters), omit required task structures, or contain broken external URL hyperlinks.
    When developers encounter broken example code in tutorials, onboarding momentum stalls.

    This blueprint implements an automated continuous documentation quality assurance gate. It ingests markdown
    pages from documentation repositories, extracts all embedded ````yaml flow ```` code blocks, executes syntax
    and deprecation analysis, inspects markdown hyperlinks for invalid paths, and delivers an itemized defect report
    to DevRel and technical writing teams.

    ## How it works

    1. `fetch_and_verify_docs` (`io.kestra.plugin.scripts.python.Script` on Docker runner) ingests candidate documentation markdown files from the target repository, extracts embedded YAML blocks, validates syntax against Kestra schemas, and audits markdown hyperlinks.
    2. `evaluate_documentation_health` (`io.kestra.plugin.core.flow.If`) evaluates whether defect counts exceed configured tolerance thresholds. If broken snippets or dead links exist, it dispatches an incident card to the DevRel Slack channel and logs itemized error details; otherwise, it records an approved audit stamp.

    ## What you get

    - Automated continuous linting of embedded YAML flow code blocks across markdown documentation.
    - Detection of deprecated 1.x syntax in tutorials before community users experience onboarding friction.
    - Hyperlink audit to identify broken documentation cross-references and external dead links.

    ## Who it's for

    - Developer Relations (DevRel) teams maintaining official orchestrator documentation and quickstarts.
    - Technical Writers ensuring code snippet accuracy and link integrity across product documentation.
    - Open Source maintainers establishing automated PR documentation testing in CI/CD pipelines.

    ## Prerequisites
    - Internet or network route to access documentation repository.
    - Secret `SLACK_WEBHOOK_URL` configured in Kestra.

    ## Quick start
    1. Import this blueprint into your Kestra workspace.
    2. Configure `docs_github_repo` and `docs_path`.
    3. Run the workflow to verify code blocks and links.

    ## Links
    - [Kestra Documentation](https://kestra.io/docs)
    - [Kestra Python Plugin](https://kestra.io/plugins/plugin-scripts-python)
  tags:
    - Core
    - Infrastructure
    - Business
  subTags:
    - CI/CD & Deployment
    - Day 2 Operations
  ee: false
  demo: false
