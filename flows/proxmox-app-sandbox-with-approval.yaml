id: proxmox-app-sandbox-with-approval
namespace: company.team
description: |
  Create a short-lived Proxmox VE sandbox for a Git branch after a human approval,
  deploy the app with Ansible, run its smoke tests, and delete the sandbox with a
  usage report. Built to be started by an AI agent through the Kestra MCP Server.

inputs:
  - id: repository
    type: STRING
    defaults: https://github.com/MartinRst/shortly.git
    description: HTTPS URL of the Git repository to test.
  - id: branch
    type: STRING
    defaults: main
  - id: requested_by
    type: STRING
    defaults: developer
    description: Who asked for the sandbox.
  - id: ttl
    type: DURATION
    defaults: PT30M
    description: How long the sandbox stays up before it is deleted.

variables:
  template_id: "9000"
  first_id: 100
  last_id: 104
  bridge: vmbr1
  subnet: "10.10.10"
  gateway: "10.10.10.1"
  app_port: 8000
  ssh_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
  vcpu_hour_rate: 0.025
  gb_hour_rate: 0.004

tasks:
  - id: approve_sandbox
    type: io.kestra.plugin.core.flow.Approval
    timeout: PT2H
    commentRequired: ON_DENY
    onWait:
      - id: ping_approver
        type: io.kestra.plugin.slack.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "text": "Sandbox request from {{ inputs.requested_by }}",
            "blocks": [
              {"type": "section", "text": {"type": "mrkdwn", "text": "*Sandbox request*\n{{ inputs.requested_by }} wants a Proxmox sandbox to test an app."}},
              {"type": "section", "fields": [
                {"type": "mrkdwn", "text": "*Repository*\n{{ inputs.repository }}"},
                {"type": "mrkdwn", "text": "*Branch*\n{{ inputs.branch }}"},
                {"type": "mrkdwn", "text": "*Lifetime*\n{{ (inputs.ttl / 60) | numberFormat('#') }} minutes, then deleted"},
                {"type": "mrkdwn", "text": "*Execution*\n{{ execution.id }}"}
              ]},
              {"type": "actions", "elements": [
                {"type": "button", "style": "primary", "text": {"type": "plain_text", "text": "Review in Kestra"}, "url": "{{ kestra.url }}ui/main/executions/{{ flow.namespace }}/{{ flow.id }}/{{ execution.id }}"}
              ]}
            ]
          }
    onApprove:
      - id: list_containers
        type: io.kestra.plugin.proxmox.container.List
        host: "{{ secret('PROXMOX_HOST') }}"
        node: "{{ secret('PROXMOX_NODE') }}"
        tokenId: "{{ secret('PROXMOX_TOKEN_ID') }}"
        tokenSecret: "{{ secret('PROXMOX_TOKEN_SECRET') }}"
        verifySsl: false

      - id: pick_slot
        type: io.kestra.plugin.core.output.OutputValues
        values:
          vmid: "{{ outputs.list_containers.containers | jq('[range(' ~ vars.first_id ~ ';' ~ (vars.last_id + 1) ~ ')] - [.[].vmid | tostring | tonumber] | first') | first }}"
          approved_at: "{{ now() }}"

      - id: create_sandbox
        type: io.kestra.plugin.proxmox.container.Clone
        host: "{{ secret('PROXMOX_HOST') }}"
        node: "{{ secret('PROXMOX_NODE') }}"
        tokenId: "{{ secret('PROXMOX_TOKEN_ID') }}"
        tokenSecret: "{{ secret('PROXMOX_TOKEN_SECRET') }}"
        verifySsl: false
        vmName: "{{ vars.template_id }}"
        newId: "{{ outputs.pick_slot.values.vmid }}"
        newName: "sandbox-{{ outputs.pick_slot.values.vmid }}"

      - id: configure_sandbox
        type: io.kestra.plugin.proxmox.container.Update
        host: "{{ secret('PROXMOX_HOST') }}"
        node: "{{ secret('PROXMOX_NODE') }}"
        tokenId: "{{ secret('PROXMOX_TOKEN_ID') }}"
        tokenSecret: "{{ secret('PROXMOX_TOKEN_SECRET') }}"
        verifySsl: false
        vmName: "{{ outputs.pick_slot.values.vmid }}"
        memory: 1024
        cores: 2
        config:
          net0: "name=eth0,bridge={{ vars.bridge }},ip={{ vars.subnet }}.{{ outputs.pick_slot.values.vmid }}/24,gw={{ vars.gateway }}"
          description: "Sandbox for {{ inputs.repository }} ({{ inputs.branch }}), asked by {{ inputs.requested_by }}, execution {{ execution.id }}, expires {{ ((now() | timestamp) + inputs.ttl + 900) | numberFormat('#') }}"
          tags: "sandbox;kestra"

      - id: start_sandbox
        type: io.kestra.plugin.proxmox.container.Start
        host: "{{ secret('PROXMOX_HOST') }}"
        node: "{{ secret('PROXMOX_NODE') }}"
        tokenId: "{{ secret('PROXMOX_TOKEN_ID') }}"
        tokenSecret: "{{ secret('PROXMOX_TOKEN_SECRET') }}"
        verifySsl: false
        vmName: "{{ outputs.pick_slot.values.vmid }}"

      - id: deploy_app
        type: io.kestra.plugin.ansible.cli.AnsibleCLI
        inputFiles:
          id_sandbox: "{{ secret('SANDBOX_SSH_KEY') }}"
          inventory.ini: |
            [sandbox]
            {{ vars.subnet }}.{{ outputs.pick_slot.values.vmid }} ansible_user=root ansible_ssh_private_key_file=id_sandbox
            [sandbox:vars]
            ansible_ssh_common_args='{{ vars.ssh_args }}'
          deploy.yml: |
            - name: Deploy a Python web app branch into the sandbox
              hosts: sandbox
              gather_facts: false
              environment:
                GIT_TERMINAL_PROMPT: "0"
              vars:
                app_dir: /opt/app
              tasks:
                - name: Wait for the container to accept SSH
                  ansible.builtin.wait_for_connection:
                    timeout: 120
                - name: Install Python and Git
                  ansible.builtin.apt:
                    name: [python3, python3-venv, python3-pip, git]
                    update_cache: true
                - name: Clone the branch
                  ansible.builtin.git:
                    repo: "{{ inputs.repository }}"
                    version: "{{ inputs.branch }}"
                    dest: "{% raw %}{{ app_dir }}{% endraw %}"
                    depth: 1
                - name: Install the Python dependencies
                  ansible.builtin.pip:
                    requirements: "{% raw %}{{ app_dir }}{% endraw %}/requirements.txt"
                    virtualenv: "{% raw %}{{ app_dir }}{% endraw %}/.venv"
                    virtualenv_command: python3 -m venv
                - name: Install the systemd unit
                  ansible.builtin.copy:
                    dest: /etc/systemd/system/app.service
                    content: |
                      [Unit]
                      Description=Sandboxed app
                      After=network-online.target
                      [Service]
                      WorkingDirectory=/opt/app
                      ExecStart=/opt/app/.venv/bin/uvicorn app.main:app --host 0.0.0.0 --port {{ vars.app_port }}
                      Restart=on-failure
                      [Install]
                      WantedBy=multi-user.target
                - name: Start the app
                  ansible.builtin.systemd_service:
                    name: app
                    state: restarted
                    enabled: true
                    daemon_reload: true
                - name: Wait for the health check
                  ansible.builtin.uri:
                    url: "http://127.0.0.1:{{ vars.app_port }}/health"
                  register: health
                  until: health.status == 200
                  retries: 30
                  delay: 2
                - name: Run the smoke tests
                  ansible.builtin.shell: "/opt/app/.venv/bin/python /opt/app/tests/smoke_test.py http://127.0.0.1:{{ vars.app_port }} | tail -1 > /tmp/smoke.json"
                  changed_when: false
                  failed_when: false
                - name: Bring the results back to Kestra
                  ansible.builtin.fetch:
                    src: /tmp/smoke.json
                    dest: "{% raw %}{{ lookup('env', 'PWD') }}{% endraw %}/smoke.json"
                    flat: true
        beforeCommands:
          - chmod 600 id_sandbox
        commands:
          - ansible-playbook -i inventory.ini deploy.yml
        outputFiles:
          - smoke.json

      - id: report
        type: io.kestra.plugin.core.output.OutputValues
        values:
          app_url: "http://{{ vars.subnet }}.{{ outputs.pick_slot.values.vmid }}:{{ vars.app_port }}"
          ready_at: "{{ now() }}"
          smoke_tests: "{{ fromJson(read(outputs.deploy_app.outputFiles['smoke.json'])) }}"

      - id: keep_alive
        type: io.kestra.plugin.core.flow.Pause
        pauseDuration: "{{ inputs.ttl }}"
        behavior: RESUME

finally:
  - id: delete_sandbox
    type: io.kestra.plugin.core.flow.Sequential
    runIf: "{{ outputs.create_sandbox is defined }}"
    tasks:
      - id: measure_usage
        type: io.kestra.plugin.scripts.python.Script
        allowFailure: true
        env:
          PVE_URL: "https://{{ secret('PROXMOX_HOST') }}:8006/api2/json/nodes/{{ secret('PROXMOX_NODE') }}/lxc/{{ outputs.pick_slot.values.vmid }}"
          PVE_TOKEN: "{{ secret('PROXMOX_TOKEN_ID') }}={{ secret('PROXMOX_TOKEN_SECRET') }}"
        script: |
          import json, os, ssl, urllib.request
          from datetime import datetime

          ctx = ssl._create_unverified_context()

          def get(path):
              req = urllib.request.Request(os.environ["PVE_URL"] + path, headers={"Authorization": "PVEAPIToken=" + os.environ["PVE_TOKEN"]})
              return json.load(urllib.request.urlopen(req, context=ctx))["data"]

          now = get("/status/current")
          points = [p for p in get("/rrddata?timeframe=hour&cf=MAX") if p.get("mem") is not None]
          peak_mem = max([p["mem"] for p in points] + [now["mem"]])
          peak_cpu = max([p.get("cpu", 0) for p in points] + [now["cpu"]])

          lifetime = now["uptime"]
          approved = datetime.fromisoformat("{{ outputs.pick_slot.values.approved_at }}")
          ready_raw = "{{ outputs.report.values.ready_at ?? '' }}"
          ready = (datetime.fromisoformat(ready_raw) - approved).total_seconds() if ready_raw else None
          vcpu_hours = now["cpus"] * lifetime / 3600
          gb_hours = now["maxmem"] / 1024**3 * lifetime / 3600
          cost = vcpu_hours * {{ vars.vcpu_hour_rate }} + gb_hours * {{ vars.gb_hour_rate }}

          usage = {
              "sandbox": now["name"],
              "vcpus": now["cpus"],
              "memory_limit_mb": round(now["maxmem"] / 1024**2),
              "lifetime_seconds": lifetime,
              "ready_after_approval_seconds": round(ready) if ready is not None else None,
              "peak_memory_mb": round(peak_mem / 1024**2),
              "peak_cpu_percent": round(peak_cpu * 100, 1),
              "network_in_mb": round(now["netin"] / 1024**2, 1),
              "network_out_mb": round(now["netout"] / 1024**2, 1),
              "estimated_cost_usd": round(cost, 4),
          }
          metrics = [
              {"name": "sandbox.lifetime", "type": "timer", "value": lifetime},
              {"name": "sandbox.peak_memory_mb", "type": "counter", "value": usage["peak_memory_mb"]},
              {"name": "sandbox.network_in_mb", "type": "counter", "value": usage["network_in_mb"]},
              {"name": "sandbox.estimated_cost_usd", "type": "counter", "value": usage["estimated_cost_usd"]},
          ]
          if ready is not None:
              metrics.append({"name": "sandbox.ready_after_approval", "type": "timer", "value": ready})
          print("::" + json.dumps({"outputs": {"usage": usage}, "metrics": metrics}) + "::")

      - id: stop_sandbox
        type: io.kestra.plugin.proxmox.container.Stop
        allowFailure: true
        host: "{{ secret('PROXMOX_HOST') }}"
        node: "{{ secret('PROXMOX_NODE') }}"
        tokenId: "{{ secret('PROXMOX_TOKEN_ID') }}"
        tokenSecret: "{{ secret('PROXMOX_TOKEN_SECRET') }}"
        verifySsl: false
        vmName: "{{ outputs.pick_slot.values.vmid }}"

      - id: destroy_sandbox
        type: io.kestra.plugin.proxmox.container.Delete
        host: "{{ secret('PROXMOX_HOST') }}"
        node: "{{ secret('PROXMOX_NODE') }}"
        tokenId: "{{ secret('PROXMOX_TOKEN_ID') }}"
        tokenSecret: "{{ secret('PROXMOX_TOKEN_SECRET') }}"
        verifySsl: false
        vmName: "{{ outputs.pick_slot.values.vmid }}"

      - id: report_usage
        type: io.kestra.plugin.slack.SlackIncomingWebhook
        allowFailure: true
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {%- set u = outputs.measure_usage.vars.usage ?? {} -%}
          {
            "text": "Sandbox deleted",
            "blocks": [
              {"type": "section", "text": {"type": "mrkdwn", "text": "*Sandbox deleted*\n{{ u.sandbox ?? 'The sandbox' }} for {{ inputs.requested_by }} is gone."}},
              {"type": "section", "fields": [
                {"type": "mrkdwn", "text": "*Lifetime*\n{{ ((u.lifetime_seconds ?? 0) / 60) | numberFormat('0.0') }} minutes"},
                {"type": "mrkdwn", "text": "*Ready after approval*\n{{ u.ready_after_approval_seconds ?? '-' }} s"},
                {"type": "mrkdwn", "text": "*Peak memory*\n{{ u.peak_memory_mb ?? '-' }} MB of {{ u.memory_limit_mb ?? '-' }} MB"},
                {"type": "mrkdwn", "text": "*Estimated cost*\n${{ u.estimated_cost_usd ?? '-' }}"}
              ]}
            ]
          }

outputs:
  - id: app_url
    type: STRING
    value: "{{ outputs.report.values.app_url ?? '' }}"
  - id: smoke_tests
    type: JSON
    value: "{{ outputs.report.values.smoke_tests ?? {} }}"
  - id: usage
    type: JSON
    value: "{{ outputs.measure_usage.vars.usage ?? {} }}"

extend:
  title: Approved Proxmox VE Sandbox for AI Agents with Usage Report
  shortDescription: Let an AI agent request a Proxmox VE sandbox through the Kestra MCP Server, gate it with a human approval, deploy and test the app with Ansible, and delete it with a usage report.
  metaTitle: Approved Proxmox Sandboxes for AI Agents with Kestra
  metaDescription: Let an AI agent request a Proxmox VE sandbox through the Kestra MCP Server, gate it with an approval, deploy with Ansible, and delete it with a usage report.
  description: |
    Give coding agents a safe way to test an app on real infrastructure. An agent such as Claude Code or Cursor starts this flow through the Kestra MCP Server with a repository, a branch, and a lifetime. A person approves the request from Slack or the Kestra UI, and only then does Kestra clone a Proxmox VE container, deploy the branch with Ansible, and run the app's smoke tests. The sandbox stays up for the requested time and is deleted with a report of what it consumed. The agent never holds a hypervisor credential, and every step is an execution you can inspect.

    ## How it works
    1. `approve_sandbox` (`io.kestra.plugin.core.flow.Approval`) pauses the execution until a reviewer approves or denies it. Its `onWait` branch posts the request to Slack with a link to the execution. The MCP server cannot approve an Approval task, so the agent cannot approve its own request.
    2. `list_containers` and `pick_slot` find a free container ID between `first_id` and `last_id`.
    3. `create_sandbox`, `configure_sandbox`, and `start_sandbox` clone the template container, set its network, CPU, memory, tags, and notes, and start it. The notes carry the execution ID and an expiry, which the cleanup blueprint uses.
    4. `deploy_app` (`io.kestra.plugin.ansible.cli.AnsibleCLI`) runs an inline playbook that installs Python, clones the branch, installs the dependencies, starts the app under systemd, waits for `/health`, and runs `tests/smoke_test.py`. Each Ansible task shows up as its own task run.
    5. `report` publishes the app URL and the smoke test results as outputs, and `keep_alive` holds the sandbox for `ttl`.
    6. The `finally` block measures the container through the Proxmox API (lifetime, peak CPU and memory, network, estimated cost), stops and deletes it, and posts a summary to Slack. It runs after a failed deploy too, and is skipped when no container was created.

    ## What you get
    - Sandboxes that agents can request but only people can approve.
    - Automatic cleanup after the requested lifetime, or earlier when the agent resumes the paused execution. Pair it with the [sandbox cleanup](https://kestra.io/blueprints/proxmox-sandbox-cleanup) blueprint so a killed or failed run deletes its container too.
    - Usage of every sandbox as a flow output and as Kestra metrics, ready for chargeback.
    - A Slack trail of every request and every deletion.

    ## Who it's for
    - Platform teams that want to offer self-service test environments to developers and coding agents.
    - Infrastructure teams running Proxmox VE who want governed, short-lived environments.
    - Teams adopting AI coding agents that need a controlled path to real infrastructure.

    ## Why orchestrate this with Kestra
    The Kestra MCP Server gives agents a fixed set of tools instead of credentials: they start a flow, read its outputs, and resume its pause, while the Approval task keeps the decision with a person. The flow holds the Proxmox token, the SSH key, and the cleanup logic, so the same request runs the same way whether a person or an agent starts it.

    ## Prerequisites
    A Proxmox VE node with an LXC template container (`template_id`) that has an SSH key for root, a bridge (`bridge`) the Kestra worker can reach over SSH, and the Ansible, Proxmox, Python, and Slack plugins installed. The app is expected to be a Python web app with `requirements.txt`, an `app.main:app` ASGI entry point, a `/health` endpoint, and `tests/smoke_test.py`.

    ### Secrets
    - `PROXMOX_HOST`: Proxmox VE host or IP (no scheme, no port).
    - `PROXMOX_NODE`: Node name, for example `pve`.
    - `PROXMOX_TOKEN_ID`: API token ID, for example `kestra@pve!automation`.
    - `PROXMOX_TOKEN_SECRET`: API token secret.
    - `SANDBOX_SSH_KEY`: Private key that matches the template's authorized key.
    - `SLACK_WEBHOOK`: Incoming webhook for the approvers' channel.

    ## Quick start
    1. Create the secrets above and adjust `template_id`, `bridge`, `subnet`, and `gateway` to your network.
    2. Turn on the Kestra MCP Server and tell agents, in its `instructions`, to use this flow to test applications and to resume the execution to end a sandbox early. Import the [sandbox cleanup](https://kestra.io/blueprints/proxmox-sandbox-cleanup) blueprint alongside it.
    3. Ask your agent to test a branch. Approve the request from Slack or the Kestra UI.
    4. The agent reads `app_url` and `smoke_tests` from the outputs, and `usage` once the sandbox is deleted.

    ## How to extend
    - Swap the Proxmox tasks for `io.kestra.plugin.ee.vmware.vcenter.CloneTemplate` or `io.kestra.plugin.ee.nutanix.ahv.CloneTemplate` and the matching start, stop, and delete tasks to run sandboxes on VMware vSphere or Nutanix AHV.
    - In the Enterprise Edition, assign the Approval task to your platform team and give it a title.
    - Run `deploy_app` on a worker group inside the sandbox network.
    - Replace the cost rates in `variables` with your internal rates.

    ## Links
    - [Kestra MCP Server](https://kestra.io/docs/develop-with-ai/kestra-mcp-server)
    - [Approval task](https://kestra.io/docs/workflow-components/approvals)
    - [Proxmox plugin](https://kestra.io/plugins/plugin-proxmox)
    - [Ansible plugin](https://kestra.io/plugins/plugin-ansible)
    - [Sandbox cleanup blueprint](https://kestra.io/blueprints/proxmox-sandbox-cleanup)
  tags:
    - Infrastructure
    - AI
  subTags:
    - VM Provisioning
    - Approval Gates
    - FinOps & Cost Management
  ee: false
  demo: false
