id: github_job_opportunity_watcher
namespace: company.team

description: |
  Monitor a GitHub job repository, filter opportunities,
  detect new matching jobs, and send Discord notifications.

inputs:
  - id: github_owner
    type: STRING
    defaults: "YOUR_REPOSITORY_OWNER"

  - id: github_repository
    type: STRING
    defaults: "YOUR_REPOSITORY"

  - id: github_branch
    type: STRING
    defaults: "main"

  - id: job_keywords
    type: STRING
    defaults: "software engineer,sde,backend,developer"

  - id: preferred_locations
    type: STRING
    defaults: "remote"

  - id: job_type_keywords
    type: STRING
    defaults: "intern,internship"

triggers:
  - id: daily_job_check
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "@daily"
    timezone: UTC

tasks:
  - id: fetch_readme_html
    type: io.kestra.plugin.core.http.Request
    uri: "https://api.github.com/repos/{{ inputs.github_owner }}/{{ inputs.github_repository }}/readme?ref={{ inputs.github_branch }}"
    method: GET
    headers:
      Accept: application/vnd.github.html+json
      X-GitHub-Api-Version: "2022-11-28"

  - id: get_seen_jobs
    type: io.kestra.plugin.core.kv.Get
    key: seen_job_fingerprints
    errorOnMissing: false

  # Parse the HTML and filter matching jobs
  - id: parse_and_filter_jobs
    type: io.kestra.plugin.scripts.python.Script
    beforeCommands:
      - pip install beautifulsoup4
    outputFiles:
      - jobs.json
    script: |
      import json
      from bs4 import BeautifulSoup

      html = r'''{{ outputs.fetch_readme_html.body }}'''
      soup = BeautifulSoup(html, "html.parser")

      job_keywords = [
          x.strip().lower()
          for x in "{{ inputs.job_keywords }}".split(",")
          if x.strip()
      ]

      locations = [
          x.strip().lower()
          for x in "{{ inputs.preferred_locations }}".split(",")
          if x.strip()
      ]

      type_keywords = [
          x.strip().lower()
          for x in "{{ inputs.job_type_keywords }}".split(",")
          if x.strip()
      ]

      aliases = {
          "company": [
              "company", "organization", "organisation",
              "employer", "company name"
          ],
          "title": [
              "role", "position", "job title", "title",
              "opportunity"
          ],
          "location": [
              "location", "region", "workplace", "locations"
          ],
          "type": [
              "type", "category", "employment", "job type"
          ],
          "url": [
              "apply", "application", "link", "url"
          ]
      }

      def normalize_header(value):
          return " ".join(value.lower().strip().split())

      jobs = []

      for table in soup.find_all("table"):
          rows = table.find_all("tr")

          if len(rows) < 2:
              continue

          headers = [
              normalize_header(cell.get_text(" ", strip=True))
              for cell in rows[0].find_all(["th", "td"])
          ]

          mapping = {}

          for field, possible_names in aliases.items():
              for index, header in enumerate(headers):
                  if header in possible_names:
                      mapping[field] = index
                      break

          if "title" not in mapping:
              continue

          if not any(
              field in mapping
              for field in ["company", "location", "url"]
          ):
              continue

          for row in rows[1:]:
              cells = row.find_all(["td", "th"])

              if not cells:
                  continue

              def cell_text(field):
                  index = mapping.get(field)
                  if index is None or index >= len(cells):
                      return ""
                  return cells[index].get_text(" ", strip=True)

              def cell_url(field):
                  index = mapping.get(field)
                  if index is None or index >= len(cells):
                      return ""
                  link = cells[index].find("a", href=True)
                  return link["href"] if link else ""

              title = cell_text("title")
              company = cell_text("company")
              location = cell_text("location")
              job_type = cell_text("type")
              url = cell_url("url")

              if not title:
                  continue

              searchable = (
                  company + " " + title + " " + job_type
              ).lower()

              if job_keywords and not any(
                  keyword in searchable
                  for keyword in job_keywords
              ):
                  continue

              if locations and not any(
                  loc in location.lower()
                  for loc in locations
              ):
                  continue

              type_text = (job_type + " " + title).lower()

              if type_keywords and not any(
                  keyword in type_text
                  for keyword in type_keywords
              ):
                  continue

              jobs.append({
                  "company": company,
                  "title": title,
                  "location": location,
                  "type": job_type,
                  "url": url
              })

      with open("jobs.json", "w", encoding="utf-8") as f:
          json.dump(jobs, f, ensure_ascii=False, indent=2)

      print(f"Matching jobs found: {len(jobs)}")
      print(json.dumps(jobs, ensure_ascii=False, indent=2))


  - id: process_new_jobs
    type: io.kestra.plugin.core.flow.Sequential
    tasks:

      # Identify new jobs and prepare a Discord payload
      - id: notify_new_jobs
        type: io.kestra.plugin.scripts.python.Script
        beforeCommands:
          - pip install kestra
        inputFiles:
          jobs.json: "{{ outputs.parse_and_filter_jobs.outputFiles['jobs.json'] }}"
        script: |
          import json
          import hashlib
          from kestra import Kestra

          with open("jobs.json", "r", encoding="utf-8") as f:
              jobs = json.load(f)

          seen_raw = r'''{{ outputs.get_seen_jobs.value ?? "[]" }}'''

          try:
              old_fingerprints = set(json.loads(seen_raw))
          except (json.JSONDecodeError, TypeError):
              old_fingerprints = set()

          def fingerprint(job):
              identity = {
                  "company": job.get("company", "").strip().lower(),
                  "title": job.get("title", "").strip().lower(),
                  "location": job.get("location", "").strip().lower(),
                  "url": job.get("url", "").strip().lower()
              }

              raw = json.dumps(identity, sort_keys=True)
              return hashlib.sha256(raw.encode("utf-8")).hexdigest()

          new_jobs = []
          for job in jobs:
              job_id = fingerprint(job)

              if job_id not in old_fingerprints:
                  new_jobs.append((job, job_id))

          print(f"Matching jobs checked: {len(jobs)}")
          print(f"New matching jobs: {len(new_jobs)}")

          messages = []
          sent_fingerprints = set()
          current_length = 0

          for job, job_id in new_jobs:
              title = job.get("title") or "Untitled role"
              company = job.get("company") or "Company not listed"
              location = job.get("location") or "Not listed"
              url = job.get("url", "").strip()

              message = (
                  f"**New Job Opportunity: {title}**\n"
                  f"**Company:** {company}\n"
                  f"**Location:** {location}\n"
                  f"**Apply:** {url if url else 'No link provided'}"
              )

              separator = "\n\n" if messages else ""
              if current_length + len(separator) + len(message) > 1900:
                  break

              messages.append(message)
              sent_fingerprints.add(job_id)
              current_length += len(separator) + len(message)

          content = "\n\n".join(messages)

          payload = json.dumps({
              "content": content
          })

          all_fingerprints = old_fingerprints | sent_fingerprints

          Kestra.outputs({
              "discord_payload": payload,
              "seen_jobs_json": json.dumps(sorted(all_fingerprints)),
              "new_jobs_count": len(messages)
          })

          print(f"Jobs prepared for Discord: {len(messages)}")

          if len(messages) < len(new_jobs):
              print("Some jobs were left for the next execution because of the Discord message length limit.")

      - id: send_discord_notification
        type: io.kestra.plugin.discord.DiscordIncomingWebhook
        runIf: "{{ outputs.notify_new_jobs.vars.new_jobs_count > 0 }}"
        url: "{{ secret('DISCORD_WEBHOOK_URL') }}"
        payload: "{{ outputs.notify_new_jobs.vars.discord_payload }}"

      # Save fingerprints for the next daily execution
      - id: save_seen_jobs
        type: io.kestra.plugin.core.kv.Set
        key: seen_job_fingerprints
        value: "{{ outputs.notify_new_jobs.vars.seen_jobs_json }}"
        kvType: STRING

extend:
  title: GitHub Job Opportunity Watcher
  metaTitle: GitHub Job Opportunity Watcher | Kestra
  shortDescription: Automatically discover new job and internship listings from GitHub and receive Discord notifications.
  metaDescription: Monitor GitHub job listings, filter relevant opportunities, detect duplicates, and receive Discord alerts automatically.
  description: |
    GitHub Job Opportunity Watcher automates job and internship discovery by
    monitoring GitHub repositories, filtering relevant listings, and
    notifying users about newly discovered opportunities.

    ## How it works

    1. A daily Schedule trigger starts the workflow.
    2. The HTTP task fetches the selected GitHub repository README.
    3. Python and BeautifulSoup identify HTML tables and extract job details.
    4. Custom filters match job keywords, locations, and employment types.
    5. SHA256 fingerprints are compared against previously stored jobs
       using Kestra KV storage.
    6. Newly discovered opportunities are sent to Discord using the
       Discord Incoming Webhook plugin.
    7. Updated fingerprints are saved for future executions.

    ## What you get

    - Automated daily job and internship monitoring.
    - Customizable opportunity filters.
    - Duplicate detection to prevent repeated notifications.
    - Discord notifications containing application links.
    - Persistent tracking using Kestra KV storage.

    ## Who it's for

    - Students searching for internships.
    - Developers looking for software engineering opportunities.
    - Job seekers monitoring GitHub opportunity repositories.

    ## Why orchestrate this with Kestra

    - Declarative YAML-based workflow orchestration.
    - Scheduled and sequential task execution.
    - Integration of APIs, Python scripts, and external plugins.
    - Centralized execution logs and persistent state management.

    ## Prerequisites

    - A running Kestra instance.
    - Access to a public GitHub repository.
    - A configured Discord incoming webhook.

    ### Secrets

    - `DISCORD_WEBHOOK_URL`: Discord incoming webhook URL (required).

    ## Quick start

    1. Configure the `DISCORD_WEBHOOK_URL` secret in your Kestra namespace.
    2. Import the workflow and configure the GitHub repository inputs.
    3. Execute the workflow manually to test it.
    4. Verify the execution logs and Discord notifications.
    5. Enable the daily trigger.

    ## How to extend

    - Support multiple GitHub repositories.
    - Implement automatic batching for multiple Discord messages.
    - Add additional notification platforms such as Slack.
    - Store job history in a database for analysis.

    ## Links

    - [Kestra Plugin Directory](https://kestra.io/plugins)
    - [GitHub REST API Documentation](https://docs.github.com/en/rest?apiVersion=2022-11-28)

  tags:
    - Business
  subTags:
    - Scheduling
    - HR & Ops Automation
  ee: false
  demo: false