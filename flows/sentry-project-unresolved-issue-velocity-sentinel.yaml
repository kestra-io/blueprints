id: sentry-project-unresolved-issue-velocity-sentinel
namespace: company.sre

description: Audits Sentry projects for unresolved exception velocity surges and production crash loops.

concurrency:
  limit: 1

inputs:
  - id: sentryOrganizationSlug
    type: STRING
    displayName: Sentry Organization Slug
    defaults: acme-corp
    description: URL slug identifier of the Sentry organization.

  - id: sentryProjectSlug
    type: STRING
    displayName: Sentry Project Slug
    defaults: checkout-backend
    description: Name identifier of the Sentry project to audit.

  - id: maxIssueVelocityThreshold
    type: INT
    displayName: Max Issue Velocity Threshold
    defaults: 50
    description: Total events per hour across top unresolved issues before triggering surge alerts.

  - id: sentryAuthToken
    type: SECRET
    displayName: Sentry Auth Token
    defaults: sentry_auth_token_secret
    description: Encrypted Sentry user or integration authentication token with Issue Read permissions.

  - id: slackWebhookUri
    type: SECRET
    displayName: Slack Webhook URI
    defaults: https://hooks.slack.com/services/T00/B00/XXXX
    description: Encrypted Slack Incoming Webhook endpoint for alerting Software Engineering teams.

tasks:
  - id: evaluate_sentry_issue_velocity
    type: io.kestra.plugin.scripts.python.Script
    description: Queries Sentry API for unresolved issues and aggregates event occurrence velocity.
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install requests
    env:
      SENTRY_AUTH_TOKEN: "{{ inputs.sentryAuthToken }}"
      ORG_SLUG: "{{ inputs.sentryOrganizationSlug }}"
      PROJECT_SLUG: "{{ inputs.sentryProjectSlug }}"
    script: |
      import os
      import json
      import requests

      auth_token = os.getenv('SENTRY_AUTH_TOKEN')
      org_slug = os.getenv('ORG_SLUG')
      project_slug = os.getenv('PROJECT_SLUG')
      velocity_threshold = {{ inputs.maxIssueVelocityThreshold }}

      headers = {
          "Authorization": f"Bearer {auth_token}",
          "Content-Type": "application/json"
      }

      url = f"https://sentry.io/api/0/projects/{org_slug}/{project_slug}/issues/"
      params = {
          "query": "is:unresolved",
          "sort": "freq",
          "limit": 10
      }

      resp = requests.get(url, headers=headers, params=params, timeout=15)
      issues = resp.json() if resp.status_code == 200 and isinstance(resp.json(), list) else []

      total_events_recent = 0
      top_issues = []

      for issue in issues:
          issue_id = issue.get("id")
          title = issue.get("title", "Unknown Exception")
          count = int(issue.get("count", 0))
          permalink = issue.get("permalink", "")
          total_events_recent += count
          top_issues.append({
              "id": issue_id,
              "title": title,
              "event_count": count,
              "link": permalink
          })

      is_velocity_breached = total_events_recent >= velocity_threshold

      report = {
          "org_slug": org_slug,
          "project_slug": project_slug,
          "unresolved_issue_count": len(issues),
          "total_recent_events": total_events_recent,
          "threshold": velocity_threshold,
          "is_velocity_breached": is_velocity_breached,
          "top_issue": top_issues[0] if top_issues else None,
          "recommended_action": f"Review top Sentry issue at {top_issues[0]['link']} and initiate rollback or triage." if is_velocity_breached and top_issues else "Exception velocity is within acceptable bounds."
      }

      with open("sentry_report.json", "w") as f:
          json.dump(report, f)

      print(f"Sentry Project {project_slug}: {total_events_recent} total events across top {len(issues)} issues. Breached: {is_velocity_breached}")

  - id: check_issue_velocity
    type: io.kestra.plugin.core.flow.If
    description: Branch execution based on whether exception velocity exceeded configured threshold.
    condition: "{{ fromJson(read('sentry_report.json')).is_velocity_breached }}"
    then:
      - id: notify_slack_issue_surge
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches high-priority exception velocity surge alert to engineering Slack channel.
        url: "{{ inputs.slackWebhookUri }}"
        payload: |
          {
            "text": "Sentry Exception Surge Alert: Project *{{ fromJson(read('sentry_report.json')).project_slug }}* detected high error velocity! Total events: {{ fromJson(read('sentry_report.json')).total_recent_events }} (Threshold: {{ inputs.maxIssueVelocityThreshold }}). Top issue: *{{ fromJson(read('sentry_report.json')).top_issue.title }}*. Runbook: {{ fromJson(read('sentry_report.json')).recommended_action }}"
          }
    else:
      - id: log_healthy_sentry_state
        type: io.kestra.plugin.core.log.Log
        description: Logs nominal exception velocity metrics when application error rates remain low.
        message: "Sentry project {{ fromJson(read('sentry_report.json')).project_slug }} is nominal with total recent events {{ fromJson(read('sentry_report.json')).total_recent_events }}."

  - id: export_sentry_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Exports structured Sentry issue velocity diagnostic report.
    format: "{{ fromJson(read('sentry_report.json')) }}"

triggers:
  - id: hourly_sentry_velocity_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: Scheduled hourly audit monitoring Sentry issue velocity.
    cron: "0 * * * *"

extend:
  title: Sentry Project Unresolved Issue Velocity Sentinel
  shortDescription: Monitors Sentry projects for unresolved exception velocity surges to alert engineering on production crash loops.
  metaTitle: Sentry Project Unresolved Issue Velocity Sentinel | Kestra
  metaDescription: Audits Sentry projects for unresolved issue velocity surges, isolates rapid error spikes, and delivers actionable triaging runbooks via Slack.
  description: |
    Audits Sentry error tracking projects for rapid exception velocity surges, unhandled stack traces, and production crash loops.

    ## How it works
    1. Triggers hourly on schedule to poll Sentry issue trackers for production microservices.
    2. Runs a containerized Python script querying the Sentry REST API for top unresolved issues sorted by frequency.
    3. Aggregates event occurrences and identifies the primary recurring stack trace.
    4. Evaluates if aggregate exception volume exceeds threshold limits using an `If` conditional task.
    5. Dispatches an incident alert to Slack with direct Sentry issue permalinks and mitigation instructions when surges occur.
    6. Logs nominal exception counts and exports a structured diagnostic manifest for engineering retrospectives.

    ## Architecture diagram
    ```mermaid
    flowchart TD
        A[Schedule Trigger: Hourly 0 * * * *] --> B[Task: evaluate_sentry_issue_velocity]
        B --> C{Task: check_issue_velocity}
        C -- Velocity Threshold Breached --> D[Task: notify_slack_issue_surge]
        C -- Nominal Exception Volume --> E[Task: log_healthy_sentry_state]
        D --> F[Task: export_sentry_manifest]
        E --> F
    ```

    ## What you get
    - Real-time exception surge detection that flags production crash loops before customers complain.
    - Automated isolation of the top failing stack trace with event occurrence rates and direct Sentry permalinks.
    - Contextual Slack alerts directing on-call engineers straight to the offending release and line of code.
    - Exported JSON error manifest supporting automated canary deployment rollbacks and incident postmortems.

    ## Who it's for
    - Application Engineering Teams deploying frequent production releases and microservice updates.
    - On-call Site Reliability Engineers (SREs) triaging sudden exception surges and crash loops.
    - Incident Commanders managing high-priority Sev-1/Sev-2 software outage responses.

    ## Why orchestrate this with Kestra
    Sentry excels at capturing exception traces, but teams often get overwhelmed by hundreds of unprioritized notification emails or webhook pings. Kestra turns raw error tracking into an intelligent, scheduled audit: it sorts unresolved issues by frequency, computes velocity across rolling windows, filters out noisy low-volume bugs, and dispatches a single actionable Slack alert containing the root-cause issue permalink and mitigation runbook.

    ## Use cases
    - **Post-Deploy Crash Loop Detection**: Alert on sudden spikes in unhandled runtime exceptions immediately after a canary or blue-green deployment.
    - **Silent Failure Unmasking**: Catch backend database connection pool exhaustion or redis timeouts resulting in unhandled 500 errors.
    - **Regression Prioritization**: Surface the single most impactful recurring issue to on-call engineers without manual Sentry dashboard polling.

    ## Inputs
    | Name | Type | Default | Description |
    | --- | --- | --- | --- |
    | `sentryOrganizationSlug` | `STRING` | `acme-corp` | URL slug identifier of the Sentry organization. |
    | `sentryProjectSlug` | `STRING` | `checkout-backend` | Name identifier of the Sentry project to audit. |
    | `maxIssueVelocityThreshold` | `INT` | `50` | Total events per hour across top unresolved issues before triggering surge alerts. |
    | `sentryAuthToken` | `SECRET` | `None` | Encrypted Sentry user or integration authentication token with Issue Read permissions. |
    | `slackWebhookUri` | `SECRET` | `None` | Encrypted Slack Incoming Webhook endpoint for alerting Software Engineering teams. |

    ## Expected outputs
    Primary execution outputs exported by `export_sentry_manifest`:
    - `project_slug`: Target Sentry project name.
    - `unresolved_issue_count`: Count of active unresolved issues inspected.
    - `total_recent_events`: Sum of event occurrences across top issues.
    - `is_velocity_breached`: Boolean flag indicating whether error velocity breached threshold.
    - `recommended_action`: Direct permalink and immediate triage recommendation.

    Example expression: `{{ outputs.export_sentry_manifest.value.is_velocity_breached }}`

    ## Prerequisites
    - An active Sentry account with tracked application projects.
    - A Sentry internal integration or user auth token with `event:read` and `project:read` scopes.
    - A Slack Incoming Webhook URL stored in Kestra secrets.

    ### Secrets
    - `SENTRY_AUTH_TOKEN`: Sentry user or internal integration auth token.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL.

    ## Quick start
    1. Register your Sentry authentication token in Kestra secrets.
    2. Deploy this flow into your incident response namespace.
    3. Set `sentryOrganizationSlug` and `sentryProjectSlug` matching your application.
    4. Execute manual run to verify Sentry API communication and exception aggregation.

    ## Common pitfalls and troubleshooting
    - **Self-Hosted Sentry URL**: If utilizing a self-hosted Sentry instance, configure the API endpoint to your self-hosted domain rather than `sentry.io`.
    - **Resolved vs Unresolved Filter**: The sentinel query explicitly filters by `is:unresolved` so archived or previously resolved exceptions are excluded.
    - **Token Scope Permissions**: Ensure the Sentry auth token possesses `project:read` and `org:read` permissions; otherwise the API returns HTTP 403 Forbidden.

    ## How to extend
    - **Automated Canary Rollback**: Trigger a CI/CD pipeline rollback if exception velocity surges within 30 minutes of a release.
    - **Linear or GitHub Issue Creation**: Automatically open an issue on GitHub or Linear with the Sentry stack trace when velocity exceeds 100 events.
    - **Multi-Service Fleet Sweep**: Loop through an array of all microservice project slugs using `io.kestra.plugin.core.flow.ForEach`.

    ## Links
    - [Sentry API Issues Endpoint Documentation](https://docs.sentry.io/api/events/list-a-projects-issues/)
    - [Sentry Search Syntax Guide](https://docs.sentry.io/product/sentry-basics/search/)
    - [Kestra Python Script Plugin](https://kestra.io/plugins/plugin-scripts/python/io.kestra.plugin.scripts.python.script)
    - [Kestra Slack Notification Plugin](https://kestra.io/plugins/plugin-slack/notifications/io.kestra.plugin.slack.notifications.slackincomingwebhook)
  tags:
    - Infrastructure
    - Core
  subTags:
    - Monitoring & Alerting
    - Incident Response
  ee: false
  demo: false
