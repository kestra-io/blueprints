id: github-stale-branch-sentinel
namespace: company.team
description: Audits GitHub repositories for inactive feature branches and alerts engineering teams to maintain Git hygiene.

inputs:
  - id: github_org
    type: STRING
    defaults: kestra-io
    description: GitHub organization or owner name.
  - id: github_repo
    type: STRING
    defaults: kestra
    description: GitHub repository name.
  - id: staleness_days_threshold
    type: INT
    defaults: 60
    description: Days of inactivity before a branch is categorized as stale.

tasks:
  - id: audit_stale_branches
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    description: Fetch branches and audit commit age against staleness threshold
    env:
      GITHUB_TOKEN: "{{ secret('GITHUB_TOKEN') }}"
      GITHUB_ORG: "{{ inputs.github_org }}"
      GITHUB_REPO: "{{ inputs.github_repo }}"
      STALENESS_DAYS: "{{ inputs.staleness_days_threshold }}"
    script: |
      import os
      import sys
      import json
      import urllib.request
      import urllib.error
      from datetime import datetime, timezone
      from kestra import Kestra

      org = os.environ.get("GITHUB_ORG")
      repo = os.environ.get("GITHUB_REPO")
      token = os.environ.get("GITHUB_TOKEN")
      threshold = int(os.environ.get("STALENESS_DAYS", "60"))

      if not org or not repo:
          print("ERROR: github_org and github_repo must be provided", file=sys.stderr)
          sys.exit(1)

      headers = {
          "Accept": "application/vnd.github.v3+json",
          "User-Agent": "Kestra-Stale-Branch-Sentinel"
      }
      if token:
          headers["Authorization"] = f"Bearer {token}"

      url = f"https://api.github.com/repos/{org}/{repo}/branches?per_page=100"
      req = urllib.request.Request(url, headers=headers)

      try:
          with urllib.request.urlopen(req, timeout=30) as resp:
              branches = json.loads(resp.read().decode("utf-8"))
      except urllib.error.HTTPError as e:
          print(f"HTTP error listing branches: {e.code} {e.reason}", file=sys.stderr)
          sys.exit(1)
      except Exception as e:
          print(f"Unexpected error listing branches: {e}", file=sys.stderr)
          sys.exit(1)

      protected_names = {"main", "master", "develop", "release", "production"}
      stale_branches = []
      now = datetime.now(timezone.utc)

      for b in branches[:30]:
          name = b.get("name", "")
          if name in protected_names or b.get("protected", False):
              continue
          commit_url = b.get("commit", {}).get("url")
          if commit_url:
              c_req = urllib.request.Request(commit_url, headers=headers)
              try:
                  with urllib.request.urlopen(c_req, timeout=15) as c_resp:
                      c_data = json.loads(c_resp.read().decode("utf-8"))
                      date_str = c_data.get("commit", {}).get("committer", {}).get("date")
                      if date_str:
                          c_date = datetime.fromisoformat(date_str.replace("Z", "+00:00"))
                          age_days = (now - c_date).days
                          if age_days >= threshold:
                              stale_branches.append({"branch": name, "age_days": age_days})
              except Exception as e:
                  print(f"Warning: could not inspect commit for branch {name}: {e}", file=sys.stderr)

      result = {
          "total_inspected": len(branches),
          "stale_count": len(stale_branches),
          "stale_branches": stale_branches[:10],
          "alert_triggered": len(stale_branches) > 0
      }

      print("GitHub stale branch audit:", result)
      Kestra.outputs(result)

  - id: evaluate_branch_staleness
    type: io.kestra.plugin.core.flow.If
    description: Alert dev leads if stale branches were identified
    condition: "{{ outputs.audit_stale_branches.vars.alert_triggered == true }}"
    then:
      - id: alert_dev_leads
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "GitHub Repository Hygiene Alert: Detected {{ outputs.audit_stale_branches.vars.stale_count }} stale branches inactive for over {{ inputs.staleness_days_threshold }} days in `{{ inputs.github_org }}/{{ inputs.github_repo }}`."
          }

outputs:
  - id: total_inspected
    type: INT
    value: "{{ outputs.audit_stale_branches.vars.total_inspected }}"
  - id: stale_count
    type: INT
    value: "{{ outputs.audit_stale_branches.vars.stale_count }}"
  - id: alert_triggered
    type: BOOLEAN
    value: "{{ outputs.audit_stale_branches.vars.alert_triggered }}"

errors:
  - id: notify_sentinel_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "CRITICAL: GitHub Sentinel Execution Failure: Failed to query branches for `{{ inputs.github_org }}/{{ inputs.github_repo }}` on execution `{{ execution.id }}`."
      }

triggers:
  - id: weekly_branch_hygiene_check
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 10 * * 1"
    disabled: true

extend:
  metaDescription: Audits GitHub repositories for inactive feature branches and alerts engineering teams to maintain Git hygiene.
  metaTitle: GitHub Stale Unmerged Branch Hygiene and Governance Sentinel with Kestra
  title: GitHub Stale Unmerged Branch Hygiene and Governance Sentinel
  shortDescription: Audits GitHub repositories for inactive feature branches and alerts engineering teams to maintain Git hygiene.
  description: |
    ## How it works
    This flow calls the GitHub REST API to list active repository branches, queries individual commit dates to calculate branch age, filters out protected branches, and flags inactive development branches exceeding the configured staleness threshold.

    ## What you get
    - Continuous programmatic repository hygiene tracking across key microservices.
    - Automated detection of unmerged, forgotten feature branches.
    - Proactive alerts to development leads on Slack.

    ## Who it's for
    - DevOps Engineers, Team Leads, and Repository Maintainers.
    - Security and Governance teams tracking repository sprawl.

    ## Why orchestrate this with Kestra
    - Fully containerized Python execution with Docker runner.
    - Out-of-band audit schedule with centralized Slack notifications and audit trails.

    ## Prerequisites
    - GitHub token with `repo` read access.
    - Secret `GITHUB_TOKEN` and `SLACK_WEBHOOK_URL` configured in Kestra.
  tags:
    - Governance
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - Git
  ee: false
  demo: false
