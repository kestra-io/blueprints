id: github-stale-branch-sentinel
namespace: company.governance

inputs:
  - id: github_org
    type: STRING
    defaults: kestra-io
    description: GitHub organization or owner name.
  - id: github_repo
    type: STRING
    defaults: kestra
    description: GitHub repository name.
  - id: staleness_days_threshold
    type: INT
    defaults: 60
    description: Days of inactivity before a branch is categorized as stale.

tasks:
  - id: audit_stale_branches
    type: io.kestra.plugin.scripts.shell.Commands
    runner: PROCESS
    commands:
      - |
        curl -s -H "Authorization: Bearer {{ secret('GITHUB_TOKEN') }}"           -H "Accept: application/vnd.github.v3+json"           "https://api.github.com/repos/{{ inputs.github_org }}/{{ inputs.github_repo }}/branches?per_page=100" > branches.json
        python3 -c "
        import json, datetime, urllib.request
        with open('branches.json') as f:
            branches = json.load(f)
        protected_names = {'main', 'master', 'develop', 'release', 'production'}
        stale_branches = []
        now = datetime.datetime.utcnow()
        for b in branches[:30]:
            name = b.get('name', '')
            if name in protected_names or b.get('protected', False):
                continue
            commit_url = b.get('commit', {}).get('url')
            if commit_url:
                req = urllib.request.Request(commit_url, headers={'Authorization': 'Bearer {{ secret("GITHUB_TOKEN") }}', 'User-Agent': 'Kestra-Sentinel'})
                try:
                    with urllib.request.urlopen(req) as resp:
                        c_data = json.loads(resp.read().decode())
                        date_str = c_data.get('commit', {}).get('committer', {}).get('date')
                        if date_str:
                            c_date = datetime.datetime.strptime(date_str, '%Y-%m-%dT%H:%M:%SZ')
                            age_days = (now - c_date).days
                            if age_days >= {{ inputs.staleness_days_threshold }}:
                                stale_branches.append({'branch': name, 'age_days': age_days})
                except Exception:
                    pass
        result = {
            'total_inspected': len(branches),
            'stale_count': len(stale_branches),
            'stale_branches': stale_branches[:10],
            'alert_triggered': len(stale_branches) > 0
        }
        with open('stale_summary.json', 'w') as out:
            json.dump(result, out)
        print('GitHub stale branch audit:', result)
        "
    outputFiles:
      - stale_summary.json

  - id: evaluate_branch_staleness
    type: io.kestra.plugin.core.flow.If
    condition: "{{ json(read(outputs.audit_stale_branches.outputFiles['stale_summary.json'])).alert_triggered }}"
    then:
      - id: alert_dev_leads
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "text": ":seedling: *GitHub Repository Hygiene Alert*: Detected {{ json(read(outputs.audit_stale_branches.outputFiles['stale_summary.json'])).stale_count }} stale branches inactive for over {{ inputs.staleness_days_threshold }} days in `{{ inputs.github_org }}/{{ inputs.github_repo }}`."
          }

errors:
  - id: notify_sentinel_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "text": ":warning: *GitHub Sentinel Execution Failure*: Failed to query branches for `{{ inputs.github_org }}/{{ inputs.github_repo }}`."
      }

triggers:
  - id: weekly_branch_hygiene_check
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 10 * * 1"
    disabled: true

extend:
  title: GitHub Stale Unmerged Branch Hygiene and Governance Sentinel
  shortDescription: Audits GitHub repositories for inactive feature branches and alerts engineering teams to maintain Git hygiene.
  description: |
    ## How it works
    This flow calls the GitHub REST API to list active repository branches, queries individual commit dates to calculate branch age, filters out protected branches, and flags inactive development branches exceeding the configured staleness threshold.

    ## What you get
    - Continuous programmatic repository hygiene tracking across key microservices.
    - Prevention of repository bloat and confusing stale branch clutter.
    - Automated Slack notifications directing developers to merge or delete abandoned work.

    ## Who it's for
    - Engineering managers and DevOps leads enforcing clean Git workflows.
    - Developers managing shared monorepos and multi-contributor repositories.

    ## Why orchestrate this with Kestra
    Kestra simplifies scheduled developer productivity governance. Running repository audits as automated flows keeps source code repositories clean without dedicated CI/CD bot setups.

    ## Prerequisites
    - A GitHub Personal Access Token (PAT) with `repo` or `read:org` scopes.
    - Secrets `GITHUB_TOKEN` and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import this blueprint into Kestra.
    2. Set `github_org` and `github_repo` inputs.
    3. Run manually to discover existing stale branches.

    ## How to extend
    - Automate stale branch deletion after a grace period with interactive Slack approval buttons.
    - Notify individual commit authors directly via Slack or email.
    - Loop across all repositories within an entire GitHub organization.

    ## Links
    - [Kestra GitHub Plugin Documentation](https://kestra.io/plugins/plugin-github)
    - [GitHub Branches API Reference](https://docs.github.com/en/rest/branches/branches)
  tags:
    - Cloud
    - Business
  subTags:
    - Governance & Compliance
  ee: false
  demo: false
