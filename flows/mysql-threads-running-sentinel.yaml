id: mysql-threads-running-sentinel
namespace: company.dataops

inputs:
  - id: mysql_host
    type: STRING
    defaults: mysql.internal
    description: Hostname of the MySQL database instance.
  - id: mysql_port
    type: INT
    defaults: 3306
    description: TCP port of the MySQL database instance.
  - id: mysql_database
    type: STRING
    defaults: mysql
    description: Database name to connect to.
  - id: mysql_username
    type: STRING
    defaults: kestra_monitor
    description: MySQL monitoring username.
  - id: max_threads_running_threshold
    type: INT
    defaults: 20
    description: Maximum permissible active executing threads before alerting.

tasks:
  - id: query_threads_running
    type: io.kestra.plugin.jdbc.mysql.Query
    url: "jdbc:mysql://{{ inputs.mysql_host }}:{{ inputs.mysql_port }}/{{ inputs.mysql_database }}"
    username: "{{ inputs.mysql_username }}"
    password: "{{ secret('MYSQL_PASSWORD') }}"
    sql: |
      SELECT 
        VARIABLE_NAME, 
        CAST(VARIABLE_VALUE AS UNSIGNED) AS METRIC_VALUE 
      FROM performance_schema.global_status 
      WHERE VARIABLE_NAME IN ('Threads_running', 'Threads_connected');
    fetchType: FETCH

  - id: evaluate_thread_concurrency
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.query_threads_running.rows[1].METRIC_VALUE > inputs.max_threads_running_threshold }}"
    then:
      - id: alert_dba_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "text": ":fire: *MySQL Thread Concurrency Alert*: Database {{ inputs.mysql_host }} has {{ outputs.query_threads_running.rows[1].METRIC_VALUE }} active executing threads (threshold: {{ inputs.max_threads_running_threshold }}). Potential unindexed query lockup or thread pool saturation."
          }

errors:
  - id: notify_sentinel_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "text": ":warning: *MySQL Sentinel Execution Failure*: Failed to query thread status on {{ inputs.mysql_host }}."
      }

triggers:
  - id: scheduled_threads_check
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/5 * * * *"
    disabled: true

extend:
  title: MySQL Active Threads Running Concurrency Surge Sentinel
  shortDescription: Audits MySQL active running threads to detect concurrency spikes, query pileups, and CPU saturation before service disruption occurs.
  description: |
    ## How it works
    This sentinel evaluates MySQL concurrency health by querying `Threads_running` against `performance_schema.global_status`. It isolates active concurrent executions from idle sleep connections, firing high-priority alerts when slow queries stack up and exhaust database CPU cores.

    ## What you get
    - Real-time detection of database thread pool saturation.
    - Early warning against cascading connection pool collapse in application microservices.
    - Actionable Slack notifications directing engineers to inspect the processlist.

    ## Who it's for
    - Database administrators and backend performance engineers maintaining high-throughput OLTP systems.
    - On-call SREs triaging application latency spikes.

    ## Why orchestrate this with Kestra
    Kestra runs scheduled health checks with instant error handling and notification dispatching, allowing teams to catch query pileups before complete database lockouts occur.

    ## Prerequisites
    - MySQL database instance with `performance_schema` enabled.
    - Secrets `MYSQL_PASSWORD` and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import this blueprint into Kestra.
    2. Configure database host, port, and credentials.
    3. Trigger a manual run to test thread evaluation.

    ## How to extend
    - Query `information_schema.processlist` to automatically capture the longest-running queries during spikes.
    - Trigger an automated kill task for non-essential queries running longer than 60 seconds.
    - Archive thread spike incidents to an S3 audit bucket.

    ## Links
    - [Kestra MySQL Plugin Documentation](https://kestra.io/plugins/plugin-jdbc-mysql)
    - [MySQL Threads Running Status](https://dev.mysql.com/doc/refman/8.0/en/server-status-variables.html#statvar_Threads_running)
  tags:
    - Data
    - Infrastructure
  subTags:
    - Monitoring & Alerting
  ee: false
  demo: false
