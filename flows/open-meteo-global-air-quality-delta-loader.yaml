id: open-meteo-global-air-quality-delta-loader
namespace: company.data

description: |
  Ingest real-time atmospheric air quality indexes (US AQI, European AQI, PM2.5, PM10, ozone, and NO2)
  from the open-access Open-Meteo Air Quality API across regional campus locations,
  model environmental metrics into columnar Parquet using DuckDB, maintain state cursors in Kestra KV store,
  and trigger operational health alerts when regional pollution indexes exceed hazardous thresholds.

inputs:
  - id: locations
    type: JSON
    description: List of regional facilities and coordinates to monitor for atmospheric air quality.
    defaults: |
      [
        {"name": "Berlin Tech Hub", "lat": 52.5200, "lon": 13.4050},
        {"name": "London Operations Center", "lat": 51.5074, "lon": -0.1278},
        {"name": "New York Regional Office", "lat": 40.7128, "lon": -74.0060},
        {"name": "Tokyo Innovation Center", "lat": 35.6762, "lon": 139.6503},
        {"name": "New Delhi Facility", "lat": 28.6139, "lon": 77.2090}
      ]

  - id: aqi_warning_threshold
    type: INT
    defaults: 100
    description: US Air Quality Index (AQI) threshold triggering moderate to unhealthy environmental alerts.

  - id: state_key
    type: STRING
    defaults: open_meteo_air_quality_state
    description: Kestra KV store key maintaining the latest observation timestamp per location.

concurrency:
  limit: 1
  behavior: CANCEL

triggers:
  - id: hourly_air_quality_sync
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 * * * *"
    description: Poll atmospheric air quality metrics hourly across corporate sites.

tasks:
  - id: fetch_state
    type: io.kestra.plugin.core.kv.Get
    key: "{{ inputs.state_key }}"
    errorOnMissing: false

  - id: ingest_and_transform_aqi
    type: io.kestra.plugin.scripts.shell.Commands
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install duckdb requests
    env:
      LOCATIONS: "{{ inputs.locations }}"
      AQI_THRESHOLD: "{{ inputs.aqi_warning_threshold }}"
      LAST_STATE: "{{ outputs.fetch_state.value ?? '{}' }}"
    commands:
      - |
        python3 - << 'EOF'
        import os
        import json
        import requests
        import duckdb

        locations = json.loads(os.environ.get("LOCATIONS", "[]"))
        threshold = int(os.environ.get("AQI_THRESHOLD", 100))
        state = json.loads(os.environ.get("LAST_STATE", "{}"))

        headers = {"User-Agent": "Kestra-AirQuality-Ingest/2.0 (contact@company.internal)"}
        observations = []
        new_state = dict(state)

        for loc in locations:
            name = loc.get("name", "Unknown")
            lat = loc.get("lat")
            lon = loc.get("lon")

            url = f"https://air-quality-api.open-meteo.com/v1/air-quality?latitude={lat}&longitude={lon}&current=european_aqi,us_aqi,pm10,pm2_5,carbon_monoxide,nitrogen_dioxide,ozone"
            try:
                resp = requests.get(url, headers=headers, timeout=20)
                if resp.status_code == 200:
                    data = resp.json()
                    curr = data.get("current", {})
                    ts = curr.get("time")

                    us_aqi = curr.get("us_aqi")
                    eu_aqi = curr.get("european_aqi")
                    pm25 = curr.get("pm2_5")
                    pm10 = curr.get("pm10")
                    co = curr.get("carbon_monoxide")
                    no2 = curr.get("nitrogen_dioxide")
                    o3 = curr.get("ozone")

                    # Classification according to EPA standards
                    if us_aqi is not None:
                        if us_aqi <= 50:
                            category = "Good"
                        elif us_aqi <= 100:
                            category = "Moderate"
                        elif us_aqi <= 150:
                            category = "Unhealthy for Sensitive Groups"
                        elif us_aqi <= 200:
                            category = "Unhealthy"
                        else:
                            category = "Very Unhealthy / Hazardous"
                    else:
                        category = "Unknown"

                    observations.append({
                        "location_name": name,
                        "latitude": float(lat),
                        "longitude": float(lon),
                        "observation_time": ts,
                        "us_aqi": int(us_aqi) if us_aqi is not None else 0,
                        "european_aqi": int(eu_aqi) if eu_aqi is not None else 0,
                        "pm2_5": float(pm25) if pm25 is not None else 0.0,
                        "pm10": float(pm10) if pm10 is not None else 0.0,
                        "carbon_monoxide": float(co) if co is not None else 0.0,
                        "nitrogen_dioxide": float(no2) if no2 is not None else 0.0,
                        "ozone": float(o3) if o3 is not None else 0.0,
                        "health_category": category
                    })
                    new_state[name] = ts
            except Exception as e:
                print(f"Warning: Failed to fetch air quality for {name}: {e}")

        with open("aqi_observations.json", "w", encoding="utf-8") as f:
            json.dump(observations, f)

        con = duckdb.connect()
        if observations:
            con.execute("CREATE TABLE aqi_metrics AS SELECT * FROM read_json_auto('aqi_observations.json')")
            con.execute("COPY aqi_metrics TO 'air_quality_snapshot.parquet' (FORMAT PARQUET)")
            con.execute("COPY aqi_metrics TO 'air_quality_snapshot.csv' (HEADER, DELIMITER ',')")

            hazardous = con.execute(f"""
                SELECT location_name, us_aqi, health_category, pm2_5, pm10
                FROM aqi_metrics
                WHERE us_aqi >= {threshold}
                ORDER BY us_aqi DESC
            """).df().to_dict(orient="records")
        else:
            con.execute("""
                CREATE TABLE aqi_metrics (
                    location_name VARCHAR,
                    latitude DOUBLE,
                    longitude DOUBLE,
                    observation_time VARCHAR,
                    us_aqi INT,
                    european_aqi INT,
                    pm2_5 DOUBLE,
                    pm10 DOUBLE,
                    carbon_monoxide DOUBLE,
                    nitrogen_dioxide DOUBLE,
                    ozone DOUBLE,
                    health_category VARCHAR
                )
            """)
            con.execute("COPY aqi_metrics TO 'air_quality_snapshot.parquet' (FORMAT PARQUET)")
            con.execute("COPY aqi_metrics TO 'air_quality_snapshot.csv' (HEADER, DELIMITER ',')")
            hazardous = []

        summary = {
            "locations_monitored": len(observations),
            "hazardous_locations_count": len(hazardous),
            "hazardous_locations": hazardous,
            "updated_state": new_state
        }

        print(f"::{{'outputs': {json.dumps(summary)}}}::")
        EOF
    outputFiles:
      - air_quality_snapshot.parquet
      - air_quality_snapshot.csv

  - id: persist_state
    type: io.kestra.plugin.core.kv.Set
    key: "{{ inputs.state_key }}"
    value: "{{ outputs.ingest_and_transform_aqi.vars.updated_state | toJson }}"

  - id: check_hazardous_conditions
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.ingest_and_transform_aqi.vars.hazardous_locations_count > 0 }}"
    then:
      - id: warn_environmental_hazard
        type: io.kestra.plugin.core.log.Log
        level: WARN
        message: "⚠️ Environmental Quality Alert: {{ outputs.ingest_and_transform_aqi.vars.hazardous_locations_count }} regional site(s) recorded US AQI >= {{ inputs.aqi_warning_threshold }}."

outputs:
  - id: monitored_count
    type: INT
    value: "{{ outputs.ingest_and_transform_aqi.vars.locations_monitored }}"
  - id: hazardous_count
    type: INT
    value: "{{ outputs.ingest_and_transform_aqi.vars.hazardous_locations_count }}"
  - id: dataset_parquet
    type: FILE
    value: "{{ outputs.ingest_and_transform_aqi.outputFiles['air_quality_snapshot.parquet'] }}"

extend:
  title: Open-Meteo Global Air Quality Index Delta Loader with DuckDB
  metaTitle: Open-Meteo Air Quality Index Delta Loader | Kestra
  shortDescription: Ingests global atmospheric air quality metrics (AQI, PM2.5, PM10) from Open-Meteo into Parquet lakehouse storage via DuckDB.
  metaDescription: Harvest real-time air quality metrics from Open-Meteo, classify EPA health tiers into Parquet with DuckDB, and track state in KV store.
  tags:
    - Data
  subTags:
    - ELT & Warehouse Loading
    - File & Data Processing Basics
  ee: false
  demo: false
  description: |
    Orchestrate automated, reliable synchronization of global atmospheric air quality indexes (US AQI, European AQI,
    particulate matter PM2.5 and PM10, ozone, and nitrogen dioxide) directly from the open-access Open-Meteo
    Air Quality API into analytical Parquet storage using DuckDB.

    ## How it works

    1. **State Recovery**: Reads previous observation timestamps from Kestra KV store (`open_meteo_air_quality_state`) to maintain consistent temporal delta updates.
    2. **Atmospheric Ingestion**: Polls the Open-Meteo Air Quality REST endpoint (`air-quality-api.open-meteo.com/v1/air-quality`) across global regional campus coordinates.
    3. **DuckDB EPA Tier Classification**: Maps raw atmospheric pollutant concentrations to US EPA Air Quality Index health tiers inside an isolated Docker container.
    4. **Analytical Lake Export**: Exports normalized air quality metrics into columnar Parquet and CSV files for environmental analytics and historical compliance reporting.
    5. **Threshold Alerting & State Persistence**: Flags locations exceeding the configured air quality safety threshold and records timestamp state in Kestra KV store.

    ## What you get

    - Automated recurring environmental monitoring across worldwide facilities without API keys or query charges.
    - Columnar Parquet datasets structured for ESG environmental reporting, facility HVAC ventilation planning, and employee health safeguards.
    - Built-in KV state management providing idempotent execution and historical sensor tracking.

    ## Who it's for

    - Corporate environmental health, safety, and ESG compliance managers monitoring employee campus air quality.
    - Facility management engineers adjusting automated HVAC air filtration based on outdoor particulate matter.
    - Environmental data scientists tracking regional pollution trends.

    ## Why orchestrate this with Kestra

    - Built-in KV store maintains observation timestamps across geographic station networks without external databases.
    - Ephemeral Docker execution guarantees isolated Python and DuckDB dependencies cleanly.
    - Declarative flow control provides transparent logging, automated error handling, and scheduled execution.

    ## Prerequisites

    - Docker runtime configured on the Kestra worker.
    - Outbound internet access to `air-quality-api.open-meteo.com`.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: (Optional) Webhook URL for forwarding high-pollution environmental alerts.

    ## Quick start

    1. Import this blueprint into your Kestra instance.
    2. Adjust the `locations` input array with your corporate facility coordinates.
    3. Click **Execute** to run an immediate air quality evaluation.
    4. Enable the `hourly_air_quality_sync` trigger for continuous background monitoring.

    ## How to extend

    - Add an S3 or Google Cloud Storage upload task to archive daily air quality partitions into a long-term data lake.
    - Connect automated IoT webhook triggers to switch office HVAC intake to recirculated air when AQI exceeds 150.

    ## Links

    - [Open-Meteo Air Quality API Documentation](https://open-meteo.com/en/docs/air-quality-api)
    - [DuckDB Parquet Export Guide](https://duckdb.org/docs/data/parquet/overview.html)
    - [Kestra Task Runners](https://kestra.io/docs/task-runners)
