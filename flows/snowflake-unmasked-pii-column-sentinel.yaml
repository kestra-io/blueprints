id: snowflake-unmasked-pii-column-sentinel
namespace: company.governance

description: Audits Snowflake tables for unmasked Personally Identifiable Information (PII) columns lacking dynamic data masking policies, enforcing data protection standards.

concurrency:
  limit: 1

inputs:
  - id: snowflake_account
    type: STRING
    defaults: xy12345.us-east-1
    description: Snowflake account identifier.

  - id: snowflake_warehouse
    type: STRING
    defaults: COMPUTE_WH
    description: Snowflake virtual warehouse used for governance metadata auditing.

  - id: snowflake_database
    type: STRING
    defaults: PRODUCTION
    description: Target database to inspect for unmasked sensitive columns.

  - id: slack_channel
    type: STRING
    defaults: "#data-governance-alerts"
    description: Slack channel destination for unmasked PII notifications.

tasks:
  - id: audit_unmasked_columns
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install snowflake-connector-python
    env:
      SNOWFLAKE_ACCOUNT: "{{ inputs.snowflake_account }}"
      SNOWFLAKE_WAREHOUSE: "{{ inputs.snowflake_warehouse }}"
      SNOWFLAKE_DATABASE: "{{ inputs.snowflake_database }}"
      SNOWFLAKE_USER: "{{ secret('SNOWFLAKE_USER') }}"
      SNOWFLAKE_PASSWORD: "{{ secret('SNOWFLAKE_PASSWORD') }}"
    script: |
      import os
      import json
      import snowflake.connector
      from kestra import Kestra

      account = os.getenv('SNOWFLAKE_ACCOUNT')
      warehouse = os.getenv('SNOWFLAKE_WAREHOUSE')
      database = os.getenv('SNOWFLAKE_DATABASE')
      user = os.getenv('SNOWFLAKE_USER')
      password = os.getenv('SNOWFLAKE_PASSWORD')

      conn = snowflake.connector.connect(
          account=account,
          user=user,
          password=password,
          warehouse=warehouse,
          database=database
      )
      cursor = conn.cursor()

      # Query columns matching common PII patterns that lack masking policy references
      query = f"""
      WITH candidate_pii AS (
          SELECT 
              table_schema,
              table_name,
              column_name,
              data_type
          FROM {database}.INFORMATION_SCHEMA.COLUMNS
          WHERE table_schema != 'INFORMATION_SCHEMA'
            AND (
              LOWER(column_name) LIKE '%email%' OR
              LOWER(column_name) LIKE '%ssn%' OR
              LOWER(column_name) LIKE '%phone%' OR
              LOWER(column_name) LIKE '%credit_card%' OR
              LOWER(column_name) LIKE '%salary%'
            )
      ),
      masked_columns AS (
          SELECT 
              ref_schema_name as table_schema,
              ref_entity_name as table_name,
              ref_column_name as column_name
          FROM {database}.INFORMATION_SCHEMA.POLICY_REFERENCES
          WHERE policy_kind = 'MASKING_POLICY'
      )
      SELECT 
          c.table_schema,
          c.table_name,
          c.column_name,
          c.data_type
      FROM candidate_pii c
      LEFT JOIN masked_columns m
        ON c.table_schema = m.table_schema
       AND c.table_name = m.table_name
       AND c.column_name = m.column_name
      WHERE m.column_name IS NULL;
      """
      cursor.execute(query)
      rows = cursor.fetchall()
      conn.close()

      unmasked_columns = []
      for row in rows:
          unmasked_columns.append({
              'schema': row[0],
              'table': row[1],
              'column': row[2],
              'data_type': row[3]
          })

      total_unmasked = len(unmasked_columns)
      has_unmasked = total_unmasked > 0

      Kestra.outputs({
          'total_unmasked_pii_columns': total_unmasked,
          'has_unmasked_pii': has_unmasked,
          'unmasked_column_identifiers': [f"{c['schema']}.{c['table']}.{c['column']}" for c in unmasked_columns]
      })

      report = {
          'database': database,
          'total_unmasked': total_unmasked,
          'unmasked_columns': unmasked_columns
      }

      with open('snowflake_pii_audit_report.json', 'w') as f:
          json.dump(report, f, indent=2)

    outputFiles:
      - snowflake_pii_audit_report.json

  - id: check_pii_compliance
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.audit_unmasked_columns.vars.has_unmasked_pii }}"
    then:
      - id: notify_slack_governance
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "{{ inputs.slack_channel }}",
            "text": "Snowflake Data Governance Alert: Found {{ outputs.audit_unmasked_columns.vars.total_unmasked_pii_columns }} unmasked sensitive PII column(s) in `{{ inputs.snowflake_database }}`.\n• Exposed Columns: {{ outputs.audit_unmasked_columns.vars.unmasked_column_identifiers | join(', ') }}\n• Remediation: Apply dynamic masking policies to comply with privacy governance standards."
          }
    else:
      - id: log_pii_compliant
        type: io.kestra.plugin.core.log.Log
        message: "All sensitive columns in database {{ inputs.snowflake_database }} have active masking policies configured."

  - id: export_governance_manifest
    type: io.kestra.plugin.core.execution.Labels
    labels:
      snowflake_db: "{{ inputs.snowflake_database }}"
      unmasked_count: "{{ outputs.audit_unmasked_columns.vars.total_unmasked_pii_columns | string }}"
      governance_status: "{{ outputs.audit_unmasked_columns.vars.has_unmasked_pii ? 'EXPOSED_PII' : 'COMPLIANT' }}"

triggers:
  - id: weekly_pii_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 6 * * 1"

extend:
  title: Snowflake Unmasked PII Column Sentinel
  metaTitle: Snowflake Unmasked PII Column Sentinel
  shortDescription: Audits Snowflake tables for unmasked sensitive PII columns lacking dynamic data masking policies.
  metaDescription: Audits Snowflake tables for unmasked Personally Identifiable Information (PII) columns, alerting data governance teams on Slack.
  description: |
    This blueprint acts as an automated data privacy and compliance guard for Snowflake enterprise data clouds. Scheduled weekly, it queries Snowflake `INFORMATION_SCHEMA.COLUMNS` and `POLICY_REFERENCES` metadata to discover sensitive customer fields (such as email addresses, social security numbers, and phone records) lacking dynamic masking policies, dispatching detailed compliance warnings to Slack.

    ## How it works

    1. **Weekly Governance Trigger**: The `weekly_pii_audit` trigger (`io.kestra.plugin.core.trigger.Schedule`) fires every Monday at 06:00 UTC.
    2. **Metadata Policy Inspection**: The `audit_unmasked_columns` task (`io.kestra.plugin.scripts.python.Script`) executes analytical SQL joining column naming patterns against active masking policies within `INFORMATION_SCHEMA`.
    3. **Compliance Evaluation Gate**: The `check_pii_compliance` flowable task (`io.kestra.plugin.core.flow.If`) branches based on whether any unmasked sensitive columns were discovered.
    4. **Slack Alert Dispatch**: When unmasked columns are identified, `notify_slack_governance` (`io.kestra.plugin.slack.notifications.SlackIncomingWebhook`) delivers an actionable incident report with column identifiers.
    5. **Nominal Confirmation**: When all sensitive columns are protected, `log_pii_compliant` records verified status.
    6. **Manifest Export**: The `export_governance_manifest` task tags the execution with searchable status labels.

    ## Architecture diagram

    ```mermaid
    flowchart TD
        A[Schedule: Weekly Monday 06:00 UTC] --> B[audit_unmasked_columns: Snowflake Information Schema]
        B --> C{Unmasked PII Detected?}
        C -- Yes --> D[notify_slack_governance: Slack Webhook]
        C -- No --> E[log_pii_compliant: Log]
        D --> F[export_governance_manifest: Execution Labels]
        E --> F
    ```

    ## Use cases

    - **GDPR & CCPA Privacy Compliance**: Ensure that customer contact details and identity attributes cannot be accessed in cleartext by unauthorized analyst roles.
    - **Data Pipeline CI/CD Governance**: Catch newly added upstream staging columns before production schemas are queried by unauthorized users.
    - **SOC 2 Access Control Auditing**: Provide automated proof of periodic cryptographic and masking policy coverage across data warehouses.

    ## Inputs

    | Name | Type | Default | Description |
    | :--- | :--- | :--- | :--- |
    | `snowflake_account` | STRING | `xy12345.us-east-1` | Snowflake account identifier. |
    | `snowflake_warehouse` | STRING | `COMPUTE_WH` | Snowflake virtual warehouse used for governance metadata auditing. |
    | `snowflake_database` | STRING | `PRODUCTION` | Target database to inspect for unmasked sensitive columns. |
    | `slack_channel` | STRING | `#data-governance-alerts` | Slack channel destination for unmasked PII notifications. |

    ## Expected outputs

    - `{{ outputs.audit_unmasked_columns.vars.total_unmasked_pii_columns }}`: Count of unmasked candidate PII columns found.
    - `{{ outputs.audit_unmasked_columns.vars.has_unmasked_pii }}`: Boolean flag indicating compliance violation.
    - `{{ outputs.audit_unmasked_columns.vars.unmasked_column_identifiers }}`: List of fully qualified column paths (schema.table.column).
    - `{{ outputs.audit_unmasked_columns.outputFiles['snowflake_pii_audit_report.json'] }}`: Full JSON audit payload.

    ## Prerequisites

    - Snowflake service account with `ACCOUNT_ADMIN` or roles granted `GOVERNANCE_ADMIN` and read access to `INFORMATION_SCHEMA`.
    - Incoming Webhook URL configured for your data governance Slack channel.

    ### Secrets

    - `SNOWFLAKE_USER`: Snowflake authentication username.
    - `SNOWFLAKE_PASSWORD`: Snowflake authentication password.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook endpoint URL.

    ## Quick start

    1. Configure `SNOWFLAKE_USER`, `SNOWFLAKE_PASSWORD`, and `SLACK_WEBHOOK_URL` in your Kestra namespace secrets.
    2. Import this flow YAML into your Kestra workspace.
    3. Specify your Snowflake account, warehouse, and target database in inputs.
    4. Click **Execute** in the UI to perform an initial data privacy audit.

    ## Common pitfalls and troubleshooting

    - **Schema Scope**: `POLICY_REFERENCES` requires querying within the database context or granting access to `SNOWFLAKE.ACCOUNT_USAGE` for account-wide coverage.
    - **Virtual Warehouse Usage**: Using an `X-Small` warehouse is sufficient because information schema metadata queries execute within milliseconds.

    ## How to extend

    - Add automated creation of tagging policies (`TAG_REFERENCES`) to assign semantic confidentiality tags to unclassified columns.
    - Integrate with Collibra or Atlan data catalogs to sync data dictionary classifications.
    - Trigger automated Jira tickets assigned to data domain owners for policy remediation.

    ## Links

    - Kestra Python Script Documentation: https://kestra.io/plugins/plugin-scripts-python/io.kestra.plugin.scripts.python.Script
    - Kestra Slack Plugin Documentation: https://kestra.io/plugins/plugin-notifications
    - Snowflake Dynamic Data Masking: https://docs.snowflake.com/en/user-guide/security-column-ddm-use
  tags:
    - Data
    - Infrastructure
  subTags:
    - Data Quality & Governance
    - Security & Compliance
    - Policy & Compliance
  ee: false
  demo: false
