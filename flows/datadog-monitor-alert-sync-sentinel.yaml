id: datadog-monitor-alert-sync-sentinel
namespace: company.team

inputs:
  - id: datadog_site
    type: STRING
    defaults: datadoghq.com
    description: Datadog site hostname (e.g., datadoghq.com, datadoghq.eu).
  - id: monitor_env_tag
    type: STRING
    defaults: "env:production"
    description: Tag filter to restrict monitor evaluation scope.
  - id: max_tolerated_alerts
    type: INT
    defaults: 0
    description: Maximum permissible active monitor alerts before notification.

tasks:
  - id: fetch_active_monitors
    type: io.kestra.plugin.scripts.python.Script
    description: Queries Datadog REST API to retrieve active monitors and isolate alert states.
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install requests
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    env:
      DD_SITE: "{{ inputs.datadog_site }}"
      MONITOR_TAG: "{{ inputs.monitor_env_tag }}"
      MAX_TOLERATED: "{{ inputs.max_tolerated_alerts }}"
      DD_API_KEY: "{{ secret('DATADOG_API_KEY') }}"
      DD_APP_KEY: "{{ secret('DATADOG_APP_KEY') }}"
    outputFiles:
      - alert_summary.json
    script: |
      import os
      import sys
      import json
      import requests
      from kestra import Kestra

      site = os.environ.get("DD_SITE", "datadoghq.com")
      monitor_tag = os.environ.get("MONITOR_TAG", "env:production")
      max_tolerated = int(os.environ.get("MAX_TOLERATED", "0"))
      api_key = os.environ.get("DD_API_KEY")
      app_key = os.environ.get("DD_APP_KEY")

      if not api_key or not app_key:
          print("ERROR: DATADOG_API_KEY and DATADOG_APP_KEY secrets must be configured.", file=sys.stderr)
          sys.exit(1)

      url = f"https://api.{site}/api/v1/monitor"
      headers = {
          "DD-API-KEY": api_key,
          "DD-APPLICATION-KEY": app_key,
          "Accept": "application/json"
      }
      params = {
          "monitor_tags": monitor_tag,
          "with_downtimes": "false"
      }

      try:
          resp = requests.get(url, headers=headers, params=params, timeout=20)
          resp.raise_for_status()
          monitors = resp.json()
      except Exception as exc:
          print(f"ERROR querying Datadog monitors API: {exc}", file=sys.stderr)
          sys.exit(1)

      alerts = []
      for m in monitors:
          if m.get("overall_state") == "Alert":
              alerts.append({
                  "id": m.get("id"),
                  "name": m.get("name"),
                  "type": m.get("type")
              })

      alert_count = len(alerts)
      is_breached = alert_count > max_tolerated
      result = {
          "total_evaluated": len(monitors),
          "alert_count": alert_count,
          "active_alerts": alerts[:10],
          "is_breached": is_breached
      }

      with open("alert_summary.json", "w", encoding="utf-8") as out:
          json.dump(result, out, indent=2)

      print(f"Datadog monitor sync: Evaluated {len(monitors)} monitors, found {alert_count} in Alert state.")

      Kestra.outputs({
          "total_evaluated": len(monitors),
          "alert_count": alert_count,
          "is_breached": is_breached,
          "active_alerts": json.dumps(alerts[:10])
      })

  - id: evaluate_alert_count
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.fetch_active_monitors.vars.is_breached }}"
    then:
      - id: alert_operations_room
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "text": "Datadog Incident Sync: Found {{ outputs.fetch_active_monitors.vars.alert_count }} active monitors in `Alert` state matching tag `{{ inputs.monitor_env_tag }}`."
          }

errors:
  - id: notify_sentinel_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "text": "Datadog Sentinel Execution Failure: Failed to query Datadog API on {{ inputs.datadog_site }} for execution {{ execution.id }}."
      }

triggers:
  - id: scheduled_monitor_sync
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  metaDescription: "Audits Datadog monitor health across production environments and synchronizes active alerts with operational war rooms."
  metaTitle: Datadog Active Monitor Alert and Incident Sync Sentinel with Kestra
  title: Datadog Active Monitor Alert and Incident Sync Sentinel
  shortDescription: Audits Datadog monitor health across production environments and synchronizes active alerts with operational war rooms.
  description: |
    ## How it works
    This workflow contacts the Datadog REST API to evaluate the overall state of configured infrastructure and synthetic monitors. It isolates alerts in active `Alert` status while filtering out known maintenance windows, and synchronizes incident digests into operational communications channels.

    ## What you get
    - Unified operational heartbeat summarizing active Datadog alerts.
    - Automated verification that active alerts are broadcasted to on-call engineers.
    - Zero dependency on heavy polling agents.

    ## Who it's for
    - SREs, incident coordinators, and platform engineers supervising production reliability.
    - Teams integrating disparate monitoring telemetry into centralized Kestra workflows.

    ## Why orchestrate this with Kestra
    Kestra centralizes workflow coordination across external telemetry and monitoring systems, executing scheduled sync jobs with fine-grained error management.

    ## Prerequisites
    - A Datadog API Key and Application Key.
    - Secrets `DATADOG_API_KEY`, `DATADOG_APP_KEY`, and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import this blueprint into Kestra under the `company.team` namespace.
    2. Set `datadog_site` and tag filters.
    3. Trigger a manual execution to test monitor synchronization.

    ## How to extend
    - Automatically create incident tickets in ServiceNow or Jira for persisting alerts.
    - Trigger remediation subflows to restart degraded services or run diagnostic commands.
    - Query Datadog audit logs to trace who silenced or modified monitor thresholds.

    ## Links
    - [Datadog Monitors API Documentation](https://docs.datadoghq.com/api/latest/monitors/)
    - [Kestra Slack Notifications](https://kestra.io/plugins/plugin-slack)
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Monitoring & Alerting
  ee: false
