id: datadog-monitor-alert-sync-sentinel
namespace: company.observability

inputs:
  - id: datadog_site
    type: STRING
    defaults: datadoghq.com
    description: Datadog site hostname (e.g., datadoghq.com, datadoghq.eu).
  - id: monitor_env_tag
    type: STRING
    defaults: "env:production"
    description: Tag filter to restrict monitor evaluation scope.
  - id: max_tolerated_alerts
    type: INT
    defaults: 0
    description: Maximum permissible active monitor alerts before notification.

tasks:
  - id: fetch_active_monitors
    type: io.kestra.plugin.scripts.shell.Commands
    runner: PROCESS
    commands:
      - |
        curl -s -G "https://api.{{ inputs.datadog_site }}/api/v1/monitor"           -H "DD-API-KEY: {{ secret('DATADOG_API_KEY') }}"           -H "DD-APPLICATION-KEY: {{ secret('DATADOG_APP_KEY') }}"           --data-urlencode "monitor_tags={{ inputs.monitor_env_tag }}"           --data-urlencode "with_downtimes=false" > dd_monitors.json
        python3 -c "
        import json
        with open('dd_monitors.json') as f:
            monitors = json.load(f)
        alerts = []
        for m in monitors:
            if m.get('overall_state') == 'Alert':
                alerts.append({
                    'id': m.get('id'),
                    'name': m.get('name'),
                    'type': m.get('type')
                })
        result = {
            'total_evaluated': len(monitors),
            'alert_count': len(alerts),
            'active_alerts': alerts[:10],
            'is_breached': len(alerts) > {{ inputs.max_tolerated_alerts }}
        }
        with open('alert_summary.json', 'w') as out:
            json.dump(result, out)
        print('Datadog monitor sync:', result)
        "
    outputFiles:
      - alert_summary.json

  - id: evaluate_alert_count
    type: io.kestra.plugin.core.flow.If
    condition: "{{ json(read(outputs.fetch_active_monitors.outputFiles['alert_summary.json'])).is_breached }}"
    then:
      - id: alert_operations_room
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "text": ":rotating_light: *Datadog Incident Sync*: Found {{ json(read(outputs.fetch_active_monitors.outputFiles['alert_summary.json'])).alert_count }} active monitors in `Alert` state matching tag `{{ inputs.monitor_env_tag }}`."
          }

errors:
  - id: notify_sentinel_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "text": ":warning: *Datadog Sentinel Execution Failure*: Failed to query Datadog API on {{ inputs.datadog_site }}."
      }

triggers:
  - id: scheduled_monitor_sync
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  title: Datadog Active Monitor Alert and Incident Sync Sentinel
  shortDescription: Audits Datadog monitor health across production environments and synchronizes active alerts with operational war rooms.
  description: |
    ## How it works
    This workflow contacts the Datadog REST API to evaluate the overall state of configured infrastructure and synthetic monitors. It isolates alerts in active `Alert` status while filtering out known maintenance windows, and synchronizes incident digests into operational communications channels.

    ## What you get
    - Unified operational heartbeat summarizing active Datadog alerts.
    - Automated verification that active alerts are broadcasted to on-call engineers.
    - Zero dependency on heavy polling agents.

    ## Who it's for
    - SREs, incident coordinators, and platform engineers supervising production reliability.
    - Teams integrating disparate monitoring telemetry into centralized Kestra workflows.

    ## Why orchestrate this with Kestra
    Kestra centralizes workflow coordination across external telemetry and monitoring systems, executing scheduled sync jobs with fine-grained error management.

    ## Prerequisites
    - A Datadog API Key and Application Key.
    - Secrets `DATADOG_API_KEY`, `DATADOG_APP_KEY`, and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import this blueprint into Kestra.
    2. Set `datadog_site` and tag filters.
    3. Trigger a manual execution to test monitor synchronization.

    ## How to extend
    - Automatically create incident tickets in ServiceNow or Jira for persisting alerts.
    - Trigger remediation subflows to restart degraded services or run diagnostic commands.
    - Query Datadog audit logs to trace who silenced or modified monitor thresholds.

    ## Links
    - [Datadog Monitors API Documentation](https://docs.datadoghq.com/api/latest/monitors/)
    - [Kestra Slack Notifications](https://kestra.io/plugins/plugin-slack)
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Monitoring & Alerting
  ee: false
  demo: false
