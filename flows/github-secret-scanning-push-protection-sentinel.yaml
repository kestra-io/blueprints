id: github-secret-scanning-push-protection-sentinel
namespace: company.team
description: Audits GitHub organization repositories to detect active open secret scanning alerts and unmitigated credential leaks.

inputs:
  - id: github_org
    type: STRING
    description: GitHub organization name.
    defaults: kestra-io

  - id: alert_threshold
    type: INT
    defaults: 0
    description: Maximum acceptable count of open secret scanning alerts across repositories.

tasks:
  - id: audit_secret_scanning_alerts
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    description: Query GitHub Secret Scanning REST API for open credential leaks
    env:
      GITHUB_TOKEN: "{{ secret('GITHUB_TOKEN') }}"
      GITHUB_ORG: "{{ inputs.github_org }}"
    script: |
      import os
      import sys
      import json
      import urllib.request
      import urllib.error
      from kestra import Kestra

      org = os.environ.get("GITHUB_ORG")
      token = os.environ.get("GITHUB_TOKEN")

      if not org:
          print("ERROR: github_org must be provided", file=sys.stderr)
          sys.exit(1)

      url = f"https://api.github.com/orgs/{org}/secret-scanning/alerts?state=open&per_page=100"
      headers = {
          "Accept": "application/vnd.github+json",
          "User-Agent": "Kestra-Secret-Scanning-Sentinel"
      }
      if token:
          headers["Authorization"] = f"Bearer {token}"

      req = urllib.request.Request(url, headers=headers)
      try:
          with urllib.request.urlopen(req, timeout=30) as resp:
              alerts = json.loads(resp.read().decode("utf-8"))
      except urllib.error.HTTPError as e:
          print(f"HTTP error querying secret scanning alerts: {e.code} {e.reason}", file=sys.stderr)
          sys.exit(1)
      except Exception as e:
          print(f"Unexpected error querying secret scanning alerts: {e}", file=sys.stderr)
          sys.exit(1)

      alert_count = len(alerts)
      alert_summary = [
          {
              "repo": a.get("repository", {}).get("name", "unknown") if isinstance(a.get("repository"), dict) else str(a.get("repository")),
              "secret_type": a.get("secret_type"),
              "created_at": a.get("created_at"),
              "resolution": a.get("resolution")
          }
          for a in alerts
      ]

      Kestra.outputs({
          "alert_count": alert_count,
          "alert_summary": alert_summary
      })

  - id: evaluate_secret_leaks
    type: io.kestra.plugin.core.flow.If
    description: Alert security team if open secret leaks exceed threshold
    condition: "{{ outputs.audit_secret_scanning_alerts.vars.alert_count > inputs.alert_threshold }}"
    then:
      - id: notify_security_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#sec-ops-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 GitHub Organization Secret Scanning Leak Alert",
                "text": "Detected *{{ outputs.audit_secret_scanning_alerts.vars.alert_count }}* open secret scanning alert(s) across organization repositories exceeding threshold *{{ inputs.alert_threshold }}*. Alert summary: {{ outputs.audit_secret_scanning_alerts.vars.alert_summary }}. Impact: Exposed production credentials, cloud API keys, or private tokens pose immediate breach risks.",
                "footer": "Kestra Security Orchestrator • Secret Scanning Sentinel"
              }
            ]
          }

outputs:
  - id: alert_count
    type: INT
    value: "{{ outputs.audit_secret_scanning_alerts.vars.alert_count }}"
  - id: alert_summary
    type: JSON
    value: "{{ outputs.audit_secret_scanning_alerts.vars.alert_summary }}"

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/30 * * * *"
    disabled: true

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "#sec-ops-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ GitHub Secret Scanning Sentinel Execution Failed",
            "text": "The GitHub secret scanning audit workflow failed on execution `{{ execution.id }}`. Please verify organization permissions and GITHUB_TOKEN scope.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

extend:
  metaDescription: Audits GitHub organization repositories to detect active open secret scanning alerts and unmitigated credential leaks.
  metaTitle: GitHub Organization Secret Scanning Alert and Push Protection Sentinel with Kestra
  title: GitHub Organization Secret Scanning Alert and Push Protection Sentinel
  shortDescription: Audits GitHub organization repositories to detect active open secret scanning alerts and unmitigated credential leaks.
  description: |
    ## How it works
    This workflow connects to the GitHub REST API using an authorized personal access token or GitHub App installation token. It queries open secret scanning alerts across all repositories in the specified organization. If any active credential leaks are identified (such as AWS keys, Slack tokens, or private RSA keys) exceeding the threshold, an immediate high-priority alert is sent to Slack with repository names and token types.

    ## What you get
    - Continuous org-wide auditing of credential leaks in source code and git history.
    - Centralized visibility into unmitigated secrets across all private and internal repos.
    - Fast incident response routing to security engineers.

    ## Who it's for
    - Security Operations (SecOps) and Application Security (AppSec) teams.
    - Engineering Managers ensuring compliance with zero-hardcoded-secret standards.

    ## Why orchestrate this with Kestra
    - **Automated Cadence**: Regularly poll security endpoints without dedicated security daemon processes.
    - **Extensible Remediation**: Chain with automated PR creation to revoke tokens or rotate credentials via Vault.
    - **Secure Secrets**: Protect GitHub tokens using Kestra encrypted secrets management.

    ## Prerequisites
    - A GitHub personal access token or GitHub App token with `security_events:read` permissions for the organization.
    - Secrets `GITHUB_TOKEN` and `SLACK_WEBHOOK_URL` configured in Kestra.
  tags:
    - Security
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - Secrets Management
  ee: false
  demo: false
