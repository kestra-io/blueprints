id: github-secret-scanning-push-protection-sentinel
namespace: company.security

inputs:
  - id: github_org
    type: STRING
    description: GitHub organization name.
  - id: alert_threshold
    type: INT
    defaults: 0
    description: Maximum acceptable count of open secret scanning alerts across repositories.

tasks:
  - id: audit_secret_scanning_alerts
    type: io.kestra.plugin.scripts.shell.Commands
    containerImage: ghcr.io/kestra-io/tools:latest
    commands:
      - |
        curl -s -H "Authorization: Bearer {{ secret('GITHUB_TOKEN') }}"           -H "Accept: application/vnd.github+json"           "https://api.github.com/orgs/{{ inputs.github_org }}/secret-scanning/alerts?state=open&per_page=100" > /tmp/secret_alerts.json
        
        ALERT_COUNT=$(jq 'length' /tmp/secret_alerts.json)
        ALERT_SUMMARY=$(jq '[.[] | {repo: .repository.name, secret_type: .secret_type, created_at: .created_at, resolution: .resolution}]' /tmp/secret_alerts.json)
        
        echo "::set-output name=alert_count::$ALERT_COUNT::"
        echo "::set-output name=alert_summary::$ALERT_SUMMARY::"

  - id: evaluate_secret_leaks
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.audit_secret_scanning_alerts.vars.alert_count | int > inputs.alert_threshold }}"
    then:
      - id: notify_security_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#sec-ops-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 GitHub Organization Secret Scanning Leak Alert",
                "text": "Detected *{{ outputs.audit_secret_scanning_alerts.vars.alert_count }}* open secret scanning alert(s) across organization repositories exceeding threshold *{{ inputs.alert_threshold }}*. Alert summary: {{ outputs.audit_secret_scanning_alerts.vars.alert_summary }}. Impact: Exposed production credentials, cloud API keys, or private tokens pose immediate breach risks.",
                "footer": "Kestra Security Orchestrator • Secret Scanning Sentinel"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#sec-ops-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ GitHub Secret Scanning Sentinel Execution Failed",
            "text": "The GitHub secret scanning audit workflow failed unexpectedly. Please verify organization permissions and GITHUB_TOKEN scope.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/30 * * * *"
    disabled: true

extend:
  metaDescription: "Audits GitHub organization repositories to detect active open secret scanning alerts and unmitigated credential leaks."
  metaTitle: GitHub Organization Secret Scanning Alert and Push Protection Sentinel with Kestra
  title: GitHub Organization Secret Scanning Alert and Push Protection Sentinel
  shortDescription: Audits GitHub organization repositories to detect active open secret scanning alerts and unmitigated credential leaks.
  description: |
    ## How it works
    This workflow connects to the GitHub REST API using an authorized personal access token or GitHub App installation token. It queries open secret scanning alerts across all repositories in the specified organization. If any active credential leaks are identified (such as AWS keys, Slack tokens, or private RSA keys) exceeding the threshold, an immediate high-priority alert is sent to Slack with repository names and token types.

    ## What you get
    - Continuous org-wide auditing of credential leaks in source code and git history.
    - Centralized visibility into unmitigated secrets across all private and internal repos.
    - Fast incident response routing to security engineers.

    ## Who it's for
    - Security Operations (SecOps) and Application Security (AppSec) teams.
    - Engineering Managers ensuring compliance with zero-hardcoded-secret standards.

    ## Why orchestrate this with Kestra
    - **Automated Cadence**: Regularly poll security endpoints without dedicated security daemon processes.
    - **Extensible Remediation**: Chain with automated PR creation to revoke tokens or rotate credentials via Vault.
    - **Secure Secrets**: Protect GitHub tokens using Kestra encrypted secrets management.

    ## Prerequisites
    - A GitHub personal access token or GitHub App token with `security_events:read` permissions for the organization.
    - Secret `GITHUB_TOKEN` and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import this blueprint into your Kestra instance.
    2. Add `GITHUB_TOKEN` and `SLACK_WEBHOOK` secrets.
    3. Run the flow to audit open secret alerts across your organization.

    ## How to extend
    - Add automated Slack message threading with remediation guidelines for specific leaked token providers.
    - Integrate with Jira to automatically open tracking tickets for unresolved secrets.

    ## Links
    - [GitHub Secret Scanning REST API Documentation](https://docs.github.com/en/rest/secret-scanning/secret-scanning)
    - [Kestra Shell Plugin](https://kestra.io/plugins/plugin-scripts/commands/io.kestra.plugin.scripts.shell.commands)
  tags:
    - Cloud
    - Business
  subTags:
    - CI/CD & Deployment
    - Infrastructure Automation
  ee: false
  demo: false
