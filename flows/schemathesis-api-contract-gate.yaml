id: schemathesis-api-contract-gate
namespace: company.team
description: |
  Fuzz a running API against its own OpenAPI schema with Schemathesis
  (property-based tests generated from the schema), keep the JUnit and JSON
  reports, and fail the execution when a failure at or above the chosen
  severity is found, so a deploy or release flow can wait on it.

inputs:
  - id: schema_url
    type: STRING
    defaults: "https://staging.example.com/openapi.json"
    displayName: "OpenAPI Schema URL"
    description: "URL (or path inside the working directory) of the OpenAPI 2/3 schema to test against."
  - id: base_url
    type: STRING
    defaults: "https://staging.example.com"
    displayName: "API Base URL"
    description: "Base URL the generated requests are sent to. Point it at staging, never at production."
  - id: extra_header
    type: STRING
    defaults: "X-Request-Source: kestra-schemathesis"
    displayName: "Extra Request Header"
    description: "One `Name: value` header added to every request, for example a tenant or routing header."
  - id: max_examples
    type: INT
    defaults: 25
    displayName: "Max Examples per Operation"
    description: "Upper bound of generated test cases per API operation. Higher finds more, runs longer."
  - id: fail_on
    type: STRING
    defaults: "critical,high"
    displayName: "Blocking Severities"
    description: "Comma-separated Schemathesis severities that fail the execution (critical, high, medium, low). Others are reported only."

triggers:
  - id: after_staging_deploy
    type: io.kestra.plugin.core.trigger.Flow
    description: Run the contract gate every time the staging deploy flow succeeds. Shipped disabled; point it at your own deploy flow and enable it after a manual run.
    disabled: true
    dependsOn:
      - namespace: company.team
        flowId: deploy_staging
        states: [SUCCESS]

tasks:
  - id: fuzz_api
    type: io.kestra.plugin.scripts.python.Commands
    description: Install a pinned Schemathesis and run every check against every operation in the schema. Schemathesis exits non-zero when it finds failures; the exit code is recorded instead of failing the task, so the reports are always kept and judged in the next step.
    containerImage: python:3.12-slim
    beforeCommands:
      - pip install --quiet --disable-pip-version-check schemathesis==4.32.0
    commands:
      - >-
        rc=0; st run '{{ inputs.schema_url }}' --url '{{ inputs.base_url }}'
        --header '{{ inputs.extra_header }}'
        --checks all --max-examples {{ inputs.max_examples }} --no-color
        --report junit,json --report-junit-path junit.xml --report-json-path run.json
        || rc=$?; echo $rc > exit_code.txt; echo schemathesis exit code $rc
    outputFiles:
      - junit.xml
      - run.json
      - exit_code.txt
    timeout: PT30M

  - id: evaluate_report
    type: io.kestra.plugin.scripts.python.Script
    description: Read the Schemathesis JSON run report, count failures by severity, list the affected operations, and decide whether any failure is in a blocking severity. A missing report (schema unreachable, crash) is treated as blocking.
    containerImage: python:3.12-slim
    inputFiles:
      run.json: "{{ outputs.fuzz_api.outputFiles['run.json'] ?? '' }}"
    script: |
      import json, os
      blocking_levels = {s.strip().lower() for s in "{{ inputs.fail_on }}".split(",") if s.strip()}
      result = {"verdict": "NO_REPORT", "blocking": 1, "generated": 0, "unique_failures": 0,
                "by_severity": {}, "lines": ["No Schemathesis report was produced; check the fuzz_api logs."]}
      if os.path.exists("run.json") and os.path.getsize("run.json") > 0:
          run = json.load(open("run.json", encoding="utf-8"))
          failures = run.get("failures", [])
          by_sev, lines, blocking = {}, [], 0
          for f in failures:
              sev = f.get("severity", "unknown")
              by_sev[sev] = by_sev.get(sev, 0) + f.get("count", 1)
              if sev in blocking_levels:
                  blocking += f.get("count", 1)
              lines.append(f"{f.get('code')} {f.get('title')} [{sev}] x{f.get('count', 1)}: {', '.join(f.get('operations', []))}")
          result = {"verdict": "BLOCKED" if blocking else ("PASSED_WITH_FINDINGS" if failures else "PASSED"),
                    "blocking": blocking, "generated": run.get("test_cases", {}).get("generated", 0),
                    "unique_failures": run.get("test_cases", {}).get("unique_failures", 0),
                    "operations_tested": run.get("operations", {}).get("tested", 0),
                    "by_severity": by_sev, "lines": lines}
      print("::" + json.dumps({"outputs": result}) + "::")

  - id: log_findings
    type: io.kestra.plugin.core.log.Log
    description: Log the verdict, the counts and one line per failure type with the operations it hit, whatever the verdict.
    message: |
      Schemathesis contract gate for {{ inputs.base_url }}: {{ outputs.evaluate_report.vars.verdict }}
      operations tested={{ outputs.evaluate_report.vars.operations_tested ?? 0 }} test cases={{ outputs.evaluate_report.vars.generated }} unique failures={{ outputs.evaluate_report.vars.unique_failures }} blocking={{ outputs.evaluate_report.vars.blocking }} by severity={{ outputs.evaluate_report.vars.by_severity }}
      {% for line in outputs.evaluate_report.vars.lines %}- {{ line }}
      {% endfor %}

  - id: gate
    type: io.kestra.plugin.core.flow.If
    description: Fail the execution when any failure is in a blocking severity (or no report exists), so a parent or downstream flow stops the release; otherwise end green and keep the findings in the logs.
    condition: "{{ outputs.evaluate_report.vars.blocking > 0 }}"
    then:
      - id: block_release
        type: io.kestra.plugin.core.execution.Fail
        description: Stop here with the blocking count; the reports stay attached to the execution.
        errorMessage: "API contract gate BLOCKED: {{ outputs.evaluate_report.vars.blocking }} failure(s) at severity {{ inputs.fail_on }} against {{ inputs.base_url }}. See log_findings and the junit.xml / run.json outputs."
    else:
      - id: log_passed
        type: io.kestra.plugin.core.log.Log
        message: "API contract gate passed for {{ inputs.base_url }} ({{ outputs.evaluate_report.vars.verdict }})."

outputs:
  - id: verdict
    type: STRING
    value: "{{ outputs.evaluate_report.vars.verdict ?? 'NO_REPORT' }}"
  - id: junit_report
    type: FILE
    value: "{{ outputs.fuzz_api.outputFiles['junit.xml'] }}"

extend:
  title: "Schemathesis API Contract Gate"
  shortDescription: Fuzz a staging API against its own OpenAPI schema with Schemathesis and fail the execution on server errors or contract violations, keeping JUnit and JSON reports.
  metaTitle: Schemathesis API Contract Testing Gate | Kestra
  metaDescription: "Run Schemathesis property-based tests against your OpenAPI schema after each staging deploy and block releases on server errors or contract breaks."
  description: |
    An OpenAPI schema is a promise: these operations, these status codes, these response shapes. Hand-written tests cover the happy paths you thought of; the 500 on a long string or the undocumented 422 ships anyway. This blueprint runs [Schemathesis](https://schemathesis.io), which generates property-based test cases straight from the schema, against a running staging API, keeps its JUnit and JSON reports on the execution, and turns its findings into a pass/fail gate that release flows can wait on.

    ## How it works

    1. `after_staging_deploy` (`io.kestra.plugin.core.trigger.Flow`) starts the gate when the `deploy_staging` flow ends in `SUCCESS`. It ships `disabled: true`; you can also run the flow by hand.
    2. `fuzz_api` (`io.kestra.plugin.scripts.python.Commands`) installs a pinned `schemathesis==4.32.0` in a `python:3.12-slim` container and runs `st run` with `--checks all` (server errors, status-code, content-type, header and response-schema conformance, negative data rejection and more), at most `max_examples` cases per operation. Schemathesis exits non-zero when it finds failures, and script tasks stop on the first failing command, so the exit code is captured (`|| rc=$?`) and written to a file instead of failing the task; `junit.xml` and `run.json` are always kept as output files.
    3. `evaluate_report` (`io.kestra.plugin.scripts.python.Script`) reads `run.json`, counts failures by Schemathesis severity (`critical`, `high`, `medium`, `low`), lists each failure type with the operations it hit, and counts the ones in the `fail_on` severities as blocking. No report at all (schema unreachable, crash) counts as blocking.
    4. `log_findings` (`io.kestra.plugin.core.log.Log`) logs the verdict, the counts and one line per failure type, for example `ST101 Server error [critical] x1: POST /api/read`.
    5. `gate` (`io.kestra.plugin.core.flow.If`) fails the execution through `io.kestra.plugin.core.execution.Fail` when anything is blocking, otherwise logs a pass. The `verdict` and `junit_report` flow outputs expose the result.

    ## What you get

    - Hundreds of schema-derived requests per run against every operation, not just the cases someone wrote tests for.
    - A `BLOCKED` / `PASSED_WITH_FINDINGS` / `PASSED` / `NO_REPORT` verdict, and a failed execution when the release should stop.
    - The JUnit XML and the JSON run report attached to each execution, with Schemathesis' own `curl` reproduction for every failure.
    - A severity threshold you choose: block on server errors only, or on any contract drift.

    ## Who it's for

    - Backend and API teams that publish an OpenAPI schema (FastAPI, Spring, NestJS, Django REST and others generate one).
    - Platform and QA teams who own the release gates between staging and production.

    ## Why orchestrate this with Kestra

    The same `st run` in a laptop terminal is forgotten after the first week. In Kestra it runs on every staging deploy through a Flow trigger, the reports are versioned with the execution, the verdict is a typed output, and a failed gate stops the downstream release with a clear error and full logs instead of a red line in someone's terminal.

    ## Prerequisites

    - A running API you are allowed to fuzz (staging or a preview environment, never production), and its OpenAPI schema URL.
    - A Kestra worker that can run containers (Docker or Kubernetes task runner) and reach the API and PyPI.
    - Optional: a `deploy_staging` flow in `company.team` for the trigger, or change the trigger to your own deploy flow.

    ### Secrets

    - None are required for a public staging API. For an authenticated one, add a secret such as `API_TOKEN` and set `extra_header` to an `Authorization: Bearer` header whose value is the Pebble expression `secret('API_TOKEN')`, so the token stays masked in logs.

    ## Quick start

    1. Set `schema_url` and `base_url` to your staging API (and `extra_header` if it needs one).
    2. Execute the flow with the defaults and read `log_findings`; open `junit.xml` from the `fuzz_api` outputs to see each failure with its `curl` reproduction.
    3. Choose `fail_on` (keep `critical,high` to start, tighten later).
    4. Point `after_staging_deploy` at your deploy flow and enable it.

    ## How to extend

    - Add `--include-path-regex` or `--exclude-method` to `st run` to scope the gate to the operations a release touched.
    - Commit a Schemathesis `--baseline` file for known findings so only new failures block.
    - Post `log_findings` to Slack or open a ticket per new failure type with the issue tracker plugins.
    - Run one execution per service with a `ForEach` over a list of schema URLs.

    ## Links

    - [Schemathesis documentation](https://schemathesis.readthedocs.io/)
    - [Kestra Python Commands task](https://kestra.io/plugins/plugin-script-python/io.kestra.plugin.scripts.python.commands)
    - [Kestra Flow trigger](https://kestra.io/plugins/core/triggers/io.kestra.plugin.core.trigger.flow)
    - [Kestra Fail task](https://kestra.io/plugins/core/tasks/execution/io.kestra.plugin.core.execution.fail)
  tags:
    - Infrastructure
  subTags:
    - CI/CD & Deployment
    - Approval Gates
  ee: false
  demo: false
