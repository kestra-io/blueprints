id: milvus-segment-growing-memory-headroom-sentinel
namespace: company.ai

description: |
  Continuously monitors Milvus vector collection load status and row counts to ensure vector search readiness.

concurrency:
  limit: 1

inputs:
  - id: milvus_endpoint
    type: STRING
    defaults: "http://milvus.internal:19530"
    description: Base URL of the Milvus Vector Database REST/gRPC proxy.
  - id: collection_name
    type: STRING
    description: Target vector collection name to audit.

tasks:
  - id: inspect_collection_stats
    type: io.kestra.plugin.scripts.python.Script
    description: Queries Milvus collection statistics via REST API to inspect collection load status and row counts.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests kestra
    env:
      MILVUS_ENDPOINT: "{{ inputs.milvus_endpoint }}"
      COLLECTION_NAME: "{{ inputs.collection_name }}"
      MILVUS_TOKEN: "{{ secret('MILVUS_TOKEN') }}"
    script: |
      import os
      import sys
      import requests
      from kestra import Kestra

      endpoint = os.environ.get("MILVUS_ENDPOINT", "http://milvus:19530").rstrip("/")
      collection = os.environ.get("COLLECTION_NAME", "").strip()
      token = os.environ.get("MILVUS_TOKEN", "").strip()

      if not collection:
          print("ERROR: collection_name input is required.", file=sys.stderr)
          sys.exit(1)

      headers = {"Content-Type": "application/json"}
      if token:
          headers["Authorization"] = f"Bearer {token}"

      url = f"{endpoint}/v1/vector/collections/describe"
      print(f"Querying Milvus collection '{collection}' from {url}...")

      try:
          resp = requests.post(url, json={"collectionName": collection}, headers=headers, timeout=15)
          resp.raise_for_status()
          data = resp.json()
      except Exception as e:
          print(f"ERROR: Failed to query Milvus collection {collection} at {url}: {e}", file=sys.stderr)
          sys.exit(1)

      code = data.get("code", 0)
      coll = data.get("data", {})
      row_count = int(coll.get("rowCount", 0))
      is_loaded = bool(coll.get("loaded", False))
      is_breach = not is_loaded or code != 0

      print(f"Collection: {collection}, row count: {row_count}, loaded: {is_loaded}, breach: {is_breach}")

      Kestra.outputs({
          "is_breach": is_breach,
          "row_count": row_count,
          "is_loaded": is_loaded
      })

  - id: evaluate_vector_readiness
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.inspect_collection_stats.vars.is_breach }}"
    then:
      - id: notify_ai_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#ai-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 Milvus Vector Collection Unloaded Warning",
                "text": "Milvus collection {{ inputs.collection_name }} is currently not loaded into QueryNode memory (rows: {{ outputs.inspect_collection_stats.vars.row_count }}). Vector similarity searches will fail or fall back to brute-force scans.",
                "footer": "Kestra AI Sentinel • Milvus"
              }
            ]
          }
    else:
      - id: log_collection_healthy
        type: io.kestra.plugin.core.log.Log
        message: "Milvus collection {{ inputs.collection_name }} loaded and operational: {{ outputs.inspect_collection_stats.vars.row_count }} rows indexed."

outputs:
  - id: is_breach
    type: BOOLEAN
    value: "{{ outputs.inspect_collection_stats.vars.is_breach }}"
  - id: row_count
    type: INT
    value: "{{ outputs.inspect_collection_stats.vars.row_count }}"
  - id: is_loaded
    type: BOOLEAN
    value: "{{ outputs.inspect_collection_stats.vars.is_loaded }}"

triggers:
  - id: scheduled_vector_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 */2 * * *"
    disabled: true

extend:
  title: Milvus Vector Collection Growing Memory Headroom Sentinel
  metaTitle: Milvus Vector Collection Headroom Sentinel | Kestra Blueprint
  shortDescription: Monitors Milvus vector collection load status and row counts to ensure search readiness.
  metaDescription: Continuously monitors Milvus vector collection load status and row counts to ensure vector search readiness, alerting AI teams on Slack.
  description: |
    Continuously monitors Milvus vector collection load status and row counts to ensure vector search readiness, alerting AI teams on Slack.
  tags:
    - AI
    - Data
