id: ai-customer-feedback-triage
namespace: company.team

triggers:
  - id: feedback_webhook
    type: io.kestra.plugin.core.trigger.Webhook
    key: "{{ secret('WEBHOOK_KEY') }}"

  - id: hourly_polling
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 * * * *"
    disabled: true

inputs:
  - id: customer_id
    type: STRING
    displayName: Customer ID
    description: Unique identifier of the customer submitting feedback
    defaults: "CUST-9842"

  - id: customer_tier
    type: STRING
    displayName: Customer Tier
    description: Subscription tier of the user (Enterprise, Business, or Free)
    defaults: "Enterprise"

  - id: feedback_text
    type: STRING
    displayName: Feedback Content
    description: Raw customer feedback or support ticket text
    defaults: "The dashboard is constantly throwing 504 gateway timeout errors when exporting large reports. Our entire data team is blocked, and we need this resolved immediately!"

tasks:
  - id: analyze_sentiment_and_topics
    type: io.kestra.plugin.gemini.StructuredOutputCompletion
    description: Classify customer feedback sentiment, score urgency on a scale of 1 to 10, and extract actionable topics using Google Gemini structured output.
    apiKey: "{{ secret('GEMINI_API_KEY') }}"
    model: "gemini-3.5-flash-lite"
    prompt: |
      You are an expert customer success and incident triage AI.
      Analyze the following customer feedback:
      Customer Tier: {{ inputs.customer_tier }}
      Feedback: "{{ inputs.feedback_text }}"

      Evaluate sentiment, compute urgency score on a scale of 1 to 10, categorize the primary issue, and suggest an actionable response.
    jsonResponseSchema: |
      {
        "type": "object",
        "properties": {
          "sentiment": {
            "type": "string",
            "enum": ["POSITIVE", "NEUTRAL", "NEGATIVE"]
          },
          "urgency_score": {
            "type": "integer",
            "minimum": 1,
            "maximum": 10
          },
          "category": {
            "type": "string",
            "enum": ["PERFORMANCE", "BUG", "FEATURE_REQUEST", "BILLING", "GENERAL"]
          },
          "summary": {
            "type": "string"
          },
          "action_item": {
            "type": "string"
          }
        },
        "required": ["sentiment", "urgency_score", "category", "summary", "action_item"]
      }

  - id: process_and_persist
    type: io.kestra.plugin.core.flow.Parallel
    description: Concurrently persist the analyzed feedback into DuckDB and stream metrics to execution logs.
    tasks:
      - id: record_in_duckdb
        type: io.kestra.plugin.jdbc.duckdb.Queries
        description: Record customer attributes, AI sentiment, and urgency score into an embedded DuckDB analytics table.
        sql: |
          CREATE TABLE IF NOT EXISTS feedback_analytics (
            customer_id VARCHAR,
            tier VARCHAR,
            sentiment VARCHAR,
            urgency_score INTEGER,
            category VARCHAR,
            summary VARCHAR,
            recorded_at TIMESTAMP
          );

          INSERT INTO feedback_analytics VALUES (
            '{{ inputs.customer_id }}',
            '{{ inputs.customer_tier }}',
            '{{ outputs.analyze_sentiment_and_topics.predictions | first | jq(".sentiment") | first }}',
            {{ outputs.analyze_sentiment_and_topics.predictions | first | jq(".urgency_score") | first }},
            '{{ outputs.analyze_sentiment_and_topics.predictions | first | jq(".category") | first }}',
            '{{ outputs.analyze_sentiment_and_topics.predictions | first | jq(".summary") | first | replace("'", "''") }}',
            CURRENT_TIMESTAMP
          );

      - id: log_triage_metrics
        type: io.kestra.plugin.core.log.Log
        description: Log real-time incident triage metrics for operational observability.
        message: "Customer {{ inputs.customer_id }} ({{ inputs.customer_tier }}) triaged: Category={{ outputs.analyze_sentiment_and_topics.predictions | first | jq('.category') | first }}, Urgency={{ outputs.analyze_sentiment_and_topics.predictions | first | jq('.urgency_score') | first }}/10"

  - id: check_escalation
    type: io.kestra.plugin.core.flow.If
    description: Conditionally evaluate whether feedback urgency warrants immediate escalation to customer engineering.
    condition: "{{ (outputs.analyze_sentiment_and_topics.predictions | first | jq('.urgency_score') | first >= 7) or (inputs.customer_tier == 'Enterprise') }}"
    then:
      - id: escalate_to_slack
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatch a rich priority alert to the on-call team via Slack incoming webhook.
        url: "{{ secret('SLACK_WEBHOOK') }}"
        messageText: |
          🚨 *Urgent Customer Feedback Alert* 🚨
          • *Customer ID:* `{{ inputs.customer_id }}` (Tier: *{{ inputs.customer_tier }}*)
          • *Category:* {{ outputs.analyze_sentiment_and_topics.predictions | first | jq('.category') | first }}
          • *Urgency Score:* {{ outputs.analyze_sentiment_and_topics.predictions | first | jq('.urgency_score') | first }}/10
          • *Sentiment:* {{ outputs.analyze_sentiment_and_topics.predictions | first | jq('.sentiment') | first }}
          • *Summary:* {{ outputs.analyze_sentiment_and_topics.predictions | first | jq('.summary') | first }}
          • *Recommended Action:* {{ outputs.analyze_sentiment_and_topics.predictions | first | jq('.action_item') | first }}

extend:
  shortDescription: Classify customer feedback sentiment, store analytics in DuckDB, and escalate urgent issues to Slack with Google Gemini.
  title: Automate Customer Feedback Triage, Sentiment Analysis, and Escalation with Google Gemini and Slack
  metaTitle: Customer Feedback Triage with Gemini, DuckDB & Slack
  metaDescription: Triage customer feedback, classify sentiment with Google Gemini, store metrics in DuckDB, and escalate urgent issues to Slack automatically.
  tags:
    - AI
    - Business
    - Data
  subTags:
    - Classification & Moderation
    - Customer Success
  ee: false
  demo: false
  description: |
    Automate the end-to-end classification, analytics tracking, and escalation of incoming customer feedback. This blueprint uses Google Gemini structured output to extract sentiment, urgency, and categorization from unstructured user reviews or support tickets. It persists every evaluation to an embedded DuckDB database for historical analytics while immediately notifying customer success channels on Slack whenever an urgent issue or high-tier account requires attention.

    ## How it works

    1. **Trigger & Inputs**: The flow triggers either via a Webhook from your application/Zendesk/Typeform or through scheduled polling. Default inputs allow interactive testing directly from the Kestra UI.
    2. **AI Analysis**: The `analyze_sentiment_and_topics` task (`io.kestra.plugin.gemini.StructuredOutputCompletion`) prompts Google Gemini using a strict JSON Schema, ensuring output fields like `sentiment`, `urgency_score`, `category`, and `action_item` are returned as typed variables.
    3. **Parallel Persistence & Logging**: The `process_and_persist` task (`io.kestra.plugin.core.flow.Parallel`) concurrently writes the analytical record into DuckDB (`io.kestra.plugin.jdbc.duckdb.Queries`) and logs key metrics to the Kestra execution console (`io.kestra.plugin.core.log.Log`).
    4. **Smart Escalation Gate**: The `check_escalation` conditional task (`io.kestra.plugin.core.flow.If`) inspects the model's urgency score and account tier. If the urgency is 7 or higher, or if the customer is on an Enterprise plan, it immediately routes an alert to Slack (`io.kestra.plugin.slack.notifications.SlackIncomingWebhook`).

    ## What you get

    - Zero-friction sentiment analysis without maintaining separate microservices.
    - Guaranteed structured JSON output powered by Google Gemini schema enforcement.
    - Instant historical reporting in DuckDB with zero database configuration.
    - SLA-protecting escalations routed to on-call customer engineering teams via Slack.

    ## Who it's for

    - Customer Support and Success operations looking to automate high-priority ticket routing.
    - Product Managers tracking sentiment trends across releases and feature launches.
    - Data Engineers seeking a turnkey, event-driven sentiment pipeline.

    ## Why orchestrate this with Kestra

    Standalone LLMs cannot connect webhooks to databases or notify team channels. Kestra provides the orchestration backbone: reliable secrets management, parallel task execution, conditional routing, and granular execution lineage. If an external service is temporarily unavailable, Kestra handles retries automatically with full auditability.

    ## Inputs

    - `customer_id` (STRING, default: "CUST-9842"): Unique identifier of the customer submitting feedback.
    - `customer_tier` (STRING, default: "Enterprise"): Subscription tier of the user (Enterprise, Business, or Free).
    - `feedback_text` (STRING): Raw customer feedback or support ticket text.

    ## Expected outputs

    - `outputs.analyze_sentiment_and_topics.predictions`: Structured JSON array containing `sentiment`, `urgency_score`, `category`, `summary`, and `action_item`.
    - DuckDB table `feedback_analytics`: Persistent table populated with feedback metrics and timestamps.

    ## Prerequisites

    - A Google Gemini API key.
    - A Slack incoming webhook URL for notifications.

    ### Secrets

    - `GEMINI_API_KEY`: API key for Gemini inference.
    - `SLACK_WEBHOOK`: Incoming webhook URL for the destination Slack channel.
    - `WEBHOOK_KEY`: Secret authentication key for the Kestra webhook trigger.

    ## Quick start

    1. Set the required secrets (`GEMINI_API_KEY`, `SLACK_WEBHOOK`, `WEBHOOK_KEY`) in your Kestra namespace.
    2. Import or paste this blueprint flow into your Kestra instance.
    3. Execute the flow manually to test triage and verify persistence in DuckDB.
    4. Configure your feedback intake webhook or enable the schedule trigger for continuous processing.

    ## Links

    - [Google Gemini plugin documentation](https://kestra.io/plugins/plugin-gemini)
    - [DuckDB JDBC plugin documentation](https://kestra.io/plugins/plugin-jdbc-duckdb)
    - [Slack plugin documentation](https://kestra.io/plugins/plugin-notifications-slack)
    - This blueprint has been created by [krishnasarkar-dev](https://github.com/krishnasarkar-dev)
