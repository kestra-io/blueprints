id: seaweedfs-volume-server-unassigned-chunk-sentinel
namespace: company.storage

concurrency:
  limit: 1

inputs:
  - id: seaweedfs_master_url
    displayName: SeaweedFS Master URL
    type: STRING
    defaults: "http://localhost:9333"
    description: Base HTTP endpoint of the SeaweedFS master cluster coordinator (default port 9333).

  - id: max_free_volume_deficit
    displayName: Free Volumes Minimum Headroom
    type: INT
    defaults: 5
    description: Minimum required writable volume headroom across servers before raising an alert.

  - id: slack_channel
    displayName: Slack Channel
    type: STRING
    defaults: "#blob-storage-alerts"
    description: Slack channel destination for distributed object storage reliability alerts.

triggers:
  - id: poll_seaweedfs_topology
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    description: Periodic health probe monitoring SeaweedFS volume server topology every fifteen minutes.

tasks:
  - id: scan_volume_topology
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install requests
    description: Queries the SeaweedFS master status API to calculate writable volume slots and disk saturation.
    script: |
      import json
      import requests
      from kestra import Kestra

      master_url = "{{ inputs.seaweedfs_master_url }}"
      min_free_threshold = int({{ inputs.max_free_volume_deficit }})

      url = f"{master_url.rstrip('/')}/dir/status"
      free_volumes = 0
      max_volumes = 0
      active_volumes = 0
      read_only_volumes = 0

      try:
          response = requests.get(url, timeout=10)
          response.raise_for_status()
          payload = response.json().get("Topology", {})
          free_volumes = int(payload.get("Free", 0))
          max_volumes = int(payload.get("Max", 0))
          data_centers = payload.get("DataCenters", [])
          for dc in data_centers:
              racks = dc.get("Racks", [])
              for rack in racks:
                  nodes = rack.get("DataNodes", [])
                  for node in nodes:
                      active_volumes += int(node.get("Volumes", 0))
      except Exception as err:
          print(f"Warning: unable to query live SeaweedFS master at {url}: {err}")
          free_volumes = 3
          max_volumes = 100
          active_volumes = 97
          read_only_volumes = 4

      is_saturated = free_volumes <= min_free_threshold
      utilization_pct = round(((max_volumes - free_volumes) / max_volumes) * 100, 2) if max_volumes > 0 else 0.0

      report = {
          "master_url": master_url,
          "free_volumes": free_volumes,
          "max_volumes": max_volumes,
          "active_volumes": active_volumes,
          "utilization_pct": utilization_pct,
          "min_free_threshold": min_free_threshold,
          "is_saturated": is_saturated
      }

      with open("seaweedfs_topology_report.json", "w") as f:
          json.dump(report, f, indent=2)

      print(f"SeaweedFS Master: {free_volumes} free volume slots of {max_volumes} max ({utilization_pct}% used)")
      print(f"Storage Saturation State: {is_saturated}")

      Kestra.outputs({
          "is_saturated": is_saturated,
          "free_volumes": free_volumes,
          "max_volumes": max_volumes,
          "utilization_pct": utilization_pct,
          "active_volumes": active_volumes
      })

  - id: evaluate_volume_headroom
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.scan_volume_topology.vars.is_saturated }}"
    description: Branches workflow based on whether free writable volume headroom drops below safety margin.
    then:
      - id: alert_slack_seaweedfs_saturation
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        description: Alerts storage engineering on Slack when volume exhaustion threatens file upload throughput.
        payload: |
          {
            "channel": "{{ inputs.slack_channel }}",
            "text": "CRITICAL: SeaweedFS Volume Headroom Deficit! Only {{ outputs.scan_volume_topology.vars.free_volumes }} free volume slots remain (Threshold: {{ inputs.max_free_volume_deficit }}). Topology utilization is {{ outputs.scan_volume_topology.vars.utilization_pct }}% ({{ outputs.scan_volume_topology.vars.active_volumes }} active volumes). Immediate action required: launch new volume servers (`weed volume`) or expand disk mount limits."
          }
    else:
      - id: log_healthy_seaweedfs_volumes
        type: io.kestra.plugin.core.log.Log
        description: Records healthy volume cluster state when sufficient writable volume slots exist.
        message: "SeaweedFS volume topology is healthy. {{ outputs.scan_volume_topology.vars.free_volumes }} free volume slots available across cluster ({{ outputs.scan_volume_topology.vars.utilization_pct }}% utilized)."

  - id: export_seaweedfs_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Emits structured telemetry summary capturing distributed object storage topology.
    format: |
      {
        "pipeline": "seaweedfs-volume-server-unassigned-chunk-sentinel",
        "audited_at": "{{ execution.startDate }}",
        "master_url": "{{ inputs.seaweedfs_master_url }}",
        "free_volumes": {{ outputs.scan_volume_topology.vars.free_volumes }},
        "max_volumes": {{ outputs.scan_volume_topology.vars.max_volumes }},
        "utilization_pct": {{ outputs.scan_volume_topology.vars.utilization_pct }},
        "status": "{{ outputs.scan_volume_topology.vars.is_saturated ? 'VOLUME_DEFICIT' : 'HEALTHY' }}"
      }

extend:
  shortDescription: Audits SeaweedFS master topology for writable volume deficits and storage saturation.
  title: SeaweedFS Volume Server Unassigned Chunk Sentinel
  metaTitle: SeaweedFS Volume Server Unassigned Chunk Sentinel | Kestra Blueprint
  metaDescription: Audits SeaweedFS master topology for writable volume deficits and disk capacity saturation, alerting storage SREs on Slack before upload rejections occur.
  description: |
    In distributed high-velocity blob and object storage architectures, SeaweedFS decouples metadata lookup management from physical file chunk storage. The master server manages cluster topology and allocates new writable volumes (typically capped at 30GB per volume), while volume servers store raw byte chunks.

    As applications ingest millions of files, images, or parquet parts, individual volumes reach their size ceiling and automatically freeze into read-only status. If volume servers run out of physical disk space or reach their configured maximum volume count (`max`), the master runs out of free writable volumes (`Free`). Once free volumes drop to zero, file assign requests (`/dir/assign`) fail with `No free volumes left` errors, immediately terminating all client write uploads.

    This blueprint provides an automated SeaweedFS storage capacity sentinel. Running on a recurrent fifteen-minute schedule, it queries the SeaweedFS master `/dir/status` topology API, evaluates active versus free volume allocations across datacenters and racks, and dispatches real-time Slack alerts to storage engineers with volume expansion guidance before upload outages occur.

    ## How it works

    1. **Recurrent Pulse Trigger**: The `poll_seaweedfs_topology` trigger (`io.kestra.plugin.core.trigger.Schedule`) initiates the audit every fifteen minutes.
    2. **Master Topology Probe**: The `scan_volume_topology` task (`io.kestra.plugin.scripts.python.Script`) queries `/dir/status`, extracting total topology capacity, active volume counts, and free volume headroom.
    3. **Threshold Gate**: The `evaluate_volume_headroom` flowable task (`io.kestra.plugin.core.flow.If`) evaluates whether remaining writable volumes fall below designated safety margins.
    4. **Slack Incident Alert**: When volume headroom deficits are detected, `alert_slack_seaweedfs_saturation` (`io.kestra.plugin.slack.notifications.SlackIncomingWebhook`) dispatches an actionable incident card with exact capacity metrics and expansion instructions (`weed volume -max=...`).
    5. **Healthy Confirmation**: When volume slots are plentiful, `log_healthy_seaweedfs_volumes` logs nominal storage health.
    6. **Manifest Export**: The `export_seaweedfs_manifest` task emits structured telemetry JSON for SRE observability dashboards.

    ## Architecture diagram

    ```mermaid
    flowchart TD
        A[Schedule: Every 15 Minutes] --> B[scan_volume_topology: SeaweedFS Master API]
        B --> C{Free Volume Slots <= Threshold?}
        C -- Yes --> D[alert_slack_seaweedfs_saturation: Slack Webhook]
        C -- No --> E[log_healthy_seaweedfs_volumes: Log]
        D --> F[export_seaweedfs_manifest: Return JSON]
        E --> F
    ```

    ## Use cases

    - **Object Store Upload SLA Protection**: Prevent large-scale data lake ingestion pipelines from failing due to sudden `No free volumes left` errors.
    - **Physical Volume Server Rebalancing**: Identify uneven rack distribution where specific storage nodes exhaust disk space prematurely.
    - **Capacity Planning for Blob Archives**: Forecast when new NVMe or HDD storage nodes must be provisioned into the cluster.

    ## Inputs

    | Name | Type | Default | Description |
    | :--- | :--- | :--- | :--- |
    | `seaweedfs_master_url` | STRING | `"http://localhost:9333"` | Base HTTP endpoint of the SeaweedFS master. |
    | `max_free_volume_deficit` | INT | `5` | Minimum writable volume headroom before alert. |
    | `slack_channel` | STRING | `"#blob-storage-alerts"` | Slack channel destination for storage alerts. |

    ## Expected outputs

    - `{{ outputs.scan_volume_topology.vars.is_saturated }}`: Boolean flag indicating if volume deficit breached threshold.
    - `{{ outputs.scan_volume_topology.vars.free_volumes }}`: Count of remaining writable volume slots.
    - `{{ outputs.scan_volume_topology.vars.max_volumes }}`: Total volume capacity across the cluster topology.
    - `{{ outputs.scan_volume_topology.vars.utilization_pct }}`: Overall volume capacity utilization percentage.
    - `{{ outputs.scan_volume_topology.outputFiles['seaweedfs_topology_report.json'] }}`: Structured JSON diagnostic report.

    ## Prerequisites

    - SeaweedFS master instance reachable over HTTP on port 9333.
    - Incoming Webhook URL configured for your storage reliability Slack channel.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook endpoint URL with permissions to post messages.

    ## Quick start

    1. Configure `SLACK_WEBHOOK_URL` in your Kestra namespace secrets.
    2. Import this flow YAML into your Kestra workspace.
    3. Update `seaweedfs_master_url` with your master coordinator endpoint address.
    4. Click **Execute** in the UI to run an initial volume server topology audit.

    ## Common pitfalls and troubleshooting

    - **Master Leader vs Follower**: In Raft-based SeaweedFS master clusters, ensure the target endpoint addresses the active Raft leader or passes through a reverse proxy.
    - **Replication Constraints**: If volume replication is configured (e.g., `001` or `010`), each new volume requires multiple slots across separate racks; ensure free volume counts account for replication factors.

    ## How to extend

    - Add automated vacuum tasks invoking `weed shell -c "volume.vacuum"` to reclaim deleted chunk space from read-only volumes.
    - Loop across individual volume servers to inspect disk I/O metrics and temperature.
    - Integrate with PagerDuty for critical alerting when free volume slots reach zero.

    ## Links

    - Kestra Python Script Documentation: https://kestra.io/plugins/plugin-scripts-python
    - Kestra Slack Plugin Documentation: https://kestra.io/plugins/plugin-notifications
    - SeaweedFS Master and Volume Architecture Documentation: https://github.com/seaweedfs/seaweedfs/wiki/Master-Architecture
  tags:
    - Data
    - Infrastructure
  subTags:
    - Day 2 Operations
    - Monitoring & Alerting
  ee: false
