id: clickhouse-keeper-ddl-queue-stagnation-guard
namespace: company.team

inputs:
  - id: clickhouse_url
    type: STRING
    defaults: jdbc:clickhouse://localhost:8123/default
    description: ClickHouse JDBC URL for the cluster coordinator node. Example jdbc:clickhouse://clickhouse:8123/default.

  - id: use_secret_auth
    type: BOOL
    defaults: true
    description: When true, connection credentials read CLICKHOUSE_USERNAME and CLICKHOUSE_PASSWORD from namespace secrets. Set false only for disposable test runs with inline credentials.

  - id: clickhouse_username
    type: STRING
    defaults: default
    description: Username used only when use_secret_auth is false. Ignored in production.

  - id: clickhouse_password
    type: STRING
    defaults: ""
    description: Password used only when use_secret_auth is false. Ignored in production.

  - id: cluster
    type: STRING
    defaults: default
    description: Target ClickHouse cluster name (matching the ON CLUSTER clause). Leave empty to inspect DDL tasks across all clusters.

  - id: stale_ddl_age_minutes
    type: INT
    defaults: 30
    description: Threshold in minutes after which an unfinished or pending DDL task in the Keeper/ZooKeeper task queue is classified as stagnant.

  - id: check_conflicting_mutations
    type: BOOL
    defaults: true
    description: When true, query system.mutations for active or failing mutations that hold table locks and block DDL execution.

  - id: check_blocking_queries
    type: BOOL
    defaults: true
    description: When true, query system.processes for long-running or deadlocked queries on replicas exceeding stale_ddl_age_minutes that may block DDL execution locks.

  - id: fail_on_stagnant
    type: BOOL
    defaults: true
    description: When true, fail the Kestra execution if stagnant DDL tasks or conflicting mutations are detected, gating upstream deployment pipelines.

variables:
  ddl_queue_sql: |
    SELECT
        entry,
        cluster,
        query,
        if(settings['user'] != '', settings['user'], if(initiator_host != '', concat('host:', initiator_host), 'system')) AS initiator_user,
        initiator_host,
        toString(query_create_time) AS query_create_time,
        dateDiff('minute', query_create_time, now()) AS age_minutes,
        countIf(status != 'Finished' OR status IS NULL) AS lagging_node_count,
        groupArrayIf(concat(coalesce(host, 'unknown'), ' [', coalesce(status, 'Pending'), ']'), status != 'Finished' OR status IS NULL) AS lagging_replicas,
        groupArrayIf(concat(coalesce(host, 'unknown'), ': ', coalesce(exception_text, 'Unknown error')), exception_code != 0) AS node_errors
    FROM system.distributed_ddl_queue
    WHERE (status != 'Finished' OR status IS NULL)
      AND ('{{ inputs.cluster }}' = '' OR cluster = '{{ inputs.cluster }}')
      AND dateDiff('minute', query_create_time, now()) >= {{ inputs.stale_ddl_age_minutes }}
    GROUP BY entry, cluster, query, settings['user'], initiator_host, query_create_time
    ORDER BY query_create_time ASC

  mutations_sql: |
    SELECT
        database,
        table,
        mutation_id,
        command,
        toString(create_time) AS create_time,
        dateDiff('minute', create_time, now()) AS age_minutes,
        parts_to_do,
        is_done,
        latest_fail_reason
    FROM system.mutations
    WHERE is_done = 0
      AND {{ inputs.check_conflicting_mutations ? 1 : 0 }} = 1
      AND (
        latest_fail_reason != ''
        OR dateDiff('minute', create_time, now()) >= {{ inputs.stale_ddl_age_minutes }}
      )
    ORDER BY create_time ASC

  processes_sql: |
    SELECT
        query_id,
        user,
        elapsed,
        read_rows,
        formatReadableSize(memory_usage) AS memory_usage,
        query
    FROM system.processes
    WHERE is_cancelled = 0
      AND {{ inputs.check_blocking_queries ? 1 : 0 }} = 1
      AND elapsed >= {{ inputs.stale_ddl_age_minutes * 60 }}
      AND (query ILIKE '%ALTER%' OR query ILIKE '%OPTIMIZE%' OR query ILIKE '%INSERT%' OR query ILIKE '%CREATE%' OR query ILIKE '%DROP%')
    ORDER BY elapsed DESC
    LIMIT 10

triggers:
  - id: periodic_ddl_queue_check
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true
    description: Periodic sweep every 15 minutes to monitor ZooKeeper/Keeper DDL queue health and alert before schema migration deadlocks occur. Shipped disabled by default.

tasks:
  - id: check_ddl_queue
    type: io.kestra.plugin.jdbc.clickhouse.Query
    description: Query system.distributed_ddl_queue (which surfaces ZooKeeper/Keeper /clickhouse/task_queue/ddl tasks) to inspect unfinished ON CLUSTER DDL tasks and calculate task age against stale_ddl_age_minutes.
    url: "{{ inputs.clickhouse_url }}"
    username: "{{ inputs.use_secret_auth ? secret('CLICKHOUSE_USERNAME') : inputs.clickhouse_username }}"
    password: "{{ inputs.use_secret_auth ? secret('CLICKHOUSE_PASSWORD') : inputs.clickhouse_password }}"
    fetchType: FETCH
    sql: "{{ render(vars.ddl_queue_sql) }}"

  - id: check_conflicting_mutations
    type: io.kestra.plugin.jdbc.clickhouse.Query
    description: Query system.mutations to detect active or failing mutations (ALTER TABLE ... UPDATE/DELETE) that hold locks on replicated tables and prevent DDL tasks from acquiring exclusive locks.
    url: "{{ inputs.clickhouse_url }}"
    username: "{{ inputs.use_secret_auth ? secret('CLICKHOUSE_USERNAME') : inputs.clickhouse_username }}"
    password: "{{ inputs.use_secret_auth ? secret('CLICKHOUSE_PASSWORD') : inputs.clickhouse_password }}"
    fetchType: FETCH
    sql: "{{ render(vars.mutations_sql) }}"

  - id: check_blocking_queries
    type: io.kestra.plugin.jdbc.clickhouse.Query
    description: Query system.processes to detect long-running or deadlocked queries on replicas exceeding stale_ddl_age_minutes that may block DDL execution locks.
    url: "{{ inputs.clickhouse_url }}"
    username: "{{ inputs.use_secret_auth ? secret('CLICKHOUSE_USERNAME') : inputs.clickhouse_username }}"
    password: "{{ inputs.use_secret_auth ? secret('CLICKHOUSE_PASSWORD') : inputs.clickhouse_password }}"
    fetchType: FETCH
    sql: "{{ render(vars.processes_sql) }}"

  - id: summarize_findings
    type: io.kestra.plugin.core.output.OutputValues
    description: Consolidate health metrics, compile formatted lists of stagnant tasks, initiating users, lagging replicas, and determine overall cluster DDL queue status.
    values:
      stagnant_ddl_count: "{{ outputs.check_ddl_queue.size ?? 0 }}"
      conflicting_mutations_count: "{{ outputs.check_conflicting_mutations.size ?? 0 }}"
      blocking_queries_count: "{{ outputs.check_blocking_queries.size ?? 0 }}"
      is_stagnant: "{{ ((outputs.check_ddl_queue.size ?? 0) > 0) or ((outputs.check_conflicting_mutations.size ?? 0) > 0) }}"
      status: "{{ (((outputs.check_ddl_queue.size ?? 0) > 0) or ((outputs.check_conflicting_mutations.size ?? 0) > 0)) ? 'STAGNANT' : 'HEALTHY' }}"
      stagnant_entries: >-
        {{ (outputs.check_ddl_queue.rows ?? []) | jq('map(.entry) | join(", ")') | first | default('none', true) }}
      initiating_users: >-
        {{ (outputs.check_ddl_queue.rows ?? []) | jq('map(.initiator_user) | unique | join(", ")') | first | default('none', true) }}
      lagging_nodes_summary: >-
        {{ (outputs.check_ddl_queue.rows ?? []) | jq('map(.entry + ": [" + (.lagging_replicas | join(", ")) + "]") | join("; ")') | first | default('none', true) }}
      conflicting_mutations_summary: >-
        {{ (outputs.check_conflicting_mutations.rows ?? []) | jq('map(.database + "." + .table + " (mutation " + .mutation_id + ", age " + (.age_minutes|tostring) + "m): " + (if .latest_fail_reason != "" then .latest_fail_reason else "active" end)) | join("; ")') | first | default('none', true) }}

  - id: record_ddl_queue_status_kv
    type: io.kestra.plugin.core.kv.Set
    description: Persist DDL queue health state into Kestra Key-Value store under clickhouse_ddl_queue_status_{cluster} for downstream orchestration and monitoring dashboards.
    key: "clickhouse_ddl_queue_status_{{ inputs.cluster != '' ? (inputs.cluster | replace({'-': '_', '.': '_'})) : 'all' }}"
    kvType: JSON
    value: |
      {
        "cluster": "{{ inputs.cluster != '' ? inputs.cluster : 'all' }}",
        "status": "{{ outputs.summarize_findings.values.status }}",
        "is_stagnant": {{ outputs.summarize_findings.values.is_stagnant }},
        "stagnant_ddl_count": {{ outputs.summarize_findings.values.stagnant_ddl_count }},
        "conflicting_mutations_count": {{ outputs.summarize_findings.values.conflicting_mutations_count }},
        "blocking_queries_count": {{ outputs.summarize_findings.values.blocking_queries_count }},
        "stagnant_entries": "{{ outputs.summarize_findings.values.stagnant_entries }}",
        "initiating_users": "{{ outputs.summarize_findings.values.initiating_users }}",
        "lagging_nodes": "{{ outputs.summarize_findings.values.lagging_nodes_summary }}",
        "inspected_at": "{{ now() }}",
        "execution_id": "{{ execution.id }}"
      }

  - id: log_status
    type: io.kestra.plugin.core.log.Log
    description: Log overall inspection findings, counts of stagnant DDL tasks, and lagging replicas.
    message: |
      ClickHouse DDL Queue Stagnation Guard Results:
      Cluster: {{ inputs.cluster != '' ? inputs.cluster : 'all' }}
      Status: {{ outputs.summarize_findings.values.status }}
      Stagnant DDL Tasks (age >= {{ inputs.stale_ddl_age_minutes }}m): {{ outputs.summarize_findings.values.stagnant_ddl_count }}
      Conflicting Mutations: {{ outputs.summarize_findings.values.conflicting_mutations_count }}
      Blocking Queries: {{ outputs.summarize_findings.values.blocking_queries_count }}
      Lagging Replicas: {{ outputs.summarize_findings.values.lagging_nodes_summary }}
      Conflicting Mutations Details: {{ outputs.summarize_findings.values.conflicting_mutations_summary }}

  - id: guard_stagnation
    type: io.kestra.plugin.core.flow.If
    description: Branch based on whether stagnation or conflicting mutations were detected.
    condition: "{{ outputs.summarize_findings.values.is_stagnant }}"
    then:
      - id: alert_stagnant_ddl
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatch urgent Slack notification with blocked DDL query text, initiating user, and lagging replica nodes.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": ":warning: *ClickHouse Keeper / ZooKeeper DDL Queue Stagnation Alert*\n*Cluster:* `{{ inputs.cluster != '' ? inputs.cluster : 'all' }}`\n*Execution:* `{{ execution.id }}`\n*Stagnant DDL Tasks:* {{ outputs.summarize_findings.values.stagnant_ddl_count }} (threshold >= {{ inputs.stale_ddl_age_minutes }}m)\n*Initiating User(s):* {{ outputs.summarize_findings.values.initiating_users }}\n*Stagnant Entries:* `{{ outputs.summarize_findings.values.stagnant_entries }}`\n*Lagging Replicas:* {{ outputs.summarize_findings.values.lagging_nodes_summary }}\n*Conflicting Mutations:* {{ outputs.summarize_findings.values.conflicting_mutations_summary }}\n*Action Required:* Check ClickHouse Keeper/ZooKeeper `/clickhouse/task_queue/ddl`, inspect replica logs for errors, or clear blocking mutations using `KILL MUTATION`."
          }

      - id: gate_pipeline
        type: io.kestra.plugin.core.flow.If
        description: Gate upstream deployments by failing execution if fail_on_stagnant is true.
        condition: "{{ inputs.fail_on_stagnant }}"
        then:
          - id: fail_on_stagnant_queue
            type: io.kestra.plugin.core.execution.Fail
            description: Fail execution to halt CI/CD migrations and prevent queue deadlock.
            errorMessage: >-
              ClickHouse DDL queue stagnation detected on cluster '{{ inputs.cluster != '' ? inputs.cluster : 'all' }}'. {{ outputs.summarize_findings.values.stagnant_ddl_count }} DDL task(s) exceeded {{ inputs.stale_ddl_age_minutes }}m threshold. Blocked entries: {{ outputs.summarize_findings.values.stagnant_entries }}. Initiators: {{ outputs.summarize_findings.values.initiating_users }}. Lagging replicas: {{ outputs.summarize_findings.values.lagging_nodes_summary }}. Conflicting mutations: {{ outputs.summarize_findings.values.conflicting_mutations_count }}. Upstream deployment gated.
    else:
      - id: log_healthy
        type: io.kestra.plugin.core.log.Log
        message: "ClickHouse Keeper / ZooKeeper DDL queue is HEALTHY on cluster '{{ inputs.cluster != '' ? inputs.cluster : 'all' }}'. Zero stagnant DDL tasks older than {{ inputs.stale_ddl_age_minutes }}m and zero conflicting mutations."

errors:
  - id: alert_on_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Notify Slack if DDL queue inspection encounters connection errors or unexpected query failures.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": ":rotating_light: *ClickHouse DDL Queue Guard FAILED*\nExecution `{{ execution.id }}` failed while inspecting ClickHouse cluster `{{ inputs.cluster != '' ? inputs.cluster : 'all' }}`. Check ClickHouse connectivity, ZooKeeper/Keeper availability, and credentials."
      }

extend:
  title: ClickHouse Keeper & ZooKeeper Replicated DDL Queue Stagnation Guard
  shortDescription: Audit ClickHouse Keeper and ZooKeeper distributed DDL queues, detect stagnant DDL queries and conflicting mutations, record health in KV store, and alert on lagging replicas.
  metaTitle: ClickHouse Keeper & ZooKeeper Replicated DDL Queue Stagnation Guard | Kestra
  metaDescription: Guard ClickHouse Keeper and ZooKeeper DDL queues by detecting stagnant queries, alerting on lagging replicas, and gating migrations with Kestra.
  description: |
    ClickHouse relies on ClickHouse Keeper or Apache ZooKeeper to coordinate distributed DDL queries (`ALTER TABLE ... ON CLUSTER`, `CREATE TABLE ... ON CLUSTER`, `DROP TABLE ... ON CLUSTER`, etc.) across cluster replicas via the `/clickhouse/task_queue/ddl` coordination queue. Distributed DDL queries execute sequentially in strict FIFO order per cluster.

    When a cluster node experiences network partitioning, hardware saturation, unhandled schema exceptions, or long-running conflicting mutations (`ALTER TABLE ... UPDATE / DELETE`), the affected replica stalls. Because the distributed DDL queue is strictly sequential, a single lagging or failed replica prevents all subsequent distributed DDL operations from executing across the entire cluster. Upstream database migration scripts and CI/CD deployment pipelines then hang indefinitely until the coordination queue is cleared.

    This blueprint provides an automated watchdog guard that inspects `system.distributed_ddl_queue`, cross-references active table mutations in `system.mutations` and locking queries in `system.processes`, stores cluster queue health in Kestra's Key-Value store, alerts SRE and database teams via Slack with granular diagnostics, and optionally fails execution to safely gate upstream migration workflows.

    ## How it works

    1. **DDL Queue Inspection**: `check_ddl_queue` executes a native JDBC query via `io.kestra.plugin.jdbc.clickhouse.Query` against `system.distributed_ddl_queue` (which reflects the underlying Keeper/ZooKeeper path `/clickhouse/task_queue/ddl`). It calculates the elapsed age of pending tasks using ClickHouse's `dateDiff('minute', query_create_time, now())`, isolates tasks where `status != 'Finished'` older than `stale_ddl_age_minutes`, and identifies lagging replica hostnames and exception messages.
    2. **Conflicting Mutation Audit**: `check_conflicting_mutations` queries `system.mutations` for uncompleted mutations (`is_done = 0`) that either have a non-empty `latest_fail_reason` or exceed `stale_ddl_age_minutes`. In ClickHouse `ReplicatedMergeTree` engines, active mutations acquire exclusive part locks that block concurrent DDL modifications.
    3. **Blocking Process Detection**: `check_blocking_queries` checks `system.processes` on the coordinator node for long-running statements (such as heavy `OPTIMIZE TABLE` or bulk operations) that may be holding table locks.
    4. **Telemetry Aggregation**: `summarize_findings` (`io.kestra.plugin.core.output.OutputValues`) computes overall health metrics, compiles comma-separated lists of stagnant queue entries, initiating users, lagging cluster replicas, and sets the cluster status (`HEALTHY` vs `STAGNANT`).
    5. **KV Store Health Persistence**: `record_ddl_queue_status_kv` (`io.kestra.plugin.core.kv.Set`) stores the structured queue health payload into Kestra's Key-Value store under the key `clickhouse_ddl_queue_status_{cluster}`. Downstream deployment pipelines can query this key before applying schema migrations.
    6. **Log Output**: `log_status` prints an operational breakdown of queue health, stagnant task IDs, initiating users, and lagging replica nodes.
    7. **Slack Incident Escalation**: If `is_stagnant` is true, `alert_stagnant_ddl` dispatches a rich Slack webhook alert containing the blocked query text, initiating user, stalled cluster nodes, and remediation guidance.
    8. **Deployment Gating**: When `fail_on_stagnant` is enabled, `fail_on_stagnant_queue` (`io.kestra.plugin.core.execution.Fail`) fails the execution, preventing automated migration runners or CI/CD pipelines from piling more DDL queries onto a wedged queue.

    ## What you get

    - Native JDBC ClickHouse integration without external agents or python dependencies.
    - Early detection of wedged `ON CLUSTER` DDL operations before deployment pipelines fail.
    - Identification of the specific lagging replica nodes and initiating user causing the blockage.
    - Cross-table correlation between DDL queue stagnation and stuck background table mutations.
    - Built-in KV store snapshot for external pipeline validation and status checks.
    - Actionable Slack notifications with error details and recommended remediation steps.

    ## Who it's for

    - ClickHouse Database Administrators (DBAs) managing replicated clusters.
    - Site Reliability Engineers (SREs) responsible for analytics cluster uptime and migration pipelines.
    - Data Platform Engineers running automated continuous integration schema migrations (Flyway, Liquibase, or custom migration scripts).

    ## Why orchestrate this with Kestra

    ClickHouse Keeper and ZooKeeper do not natively monitor queue dwell time or trigger incident alerts when a replica drops out of the DDL queue. Managing this with ad-hoc cron scripts creates brittle monitoring silos without audit logs or credential management.

    Kestra centralizes ClickHouse cluster operations by providing:
    - Secret management for database credentials and notification webhooks.
    - Scheduled background sweeps with configurable operational thresholds.
    - Key-Value store persistence to decouple monitoring from deployment gates.
    - Flow-level error trapping and instant alert dispatch upon connectivity failures.

    ## Prerequisites

    - A running ClickHouse cluster (v21.8 or higher) with ClickHouse Keeper or Apache ZooKeeper configured for distributed DDL.
    - A database user with `SELECT` privileges on `system.distributed_ddl_queue`, `system.mutations`, and `system.processes`.
    - A Slack Incoming Webhook URL for alert routing.

    ### Secrets

    - `CLICKHOUSE_USERNAME`: ClickHouse database user (required when `use_secret_auth` is true).
    - `CLICKHOUSE_PASSWORD`: ClickHouse database password (required when `use_secret_auth` is true).
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL for incident notifications.

    ## Quick start

    1. Configure namespace secrets `CLICKHOUSE_USERNAME`, `CLICKHOUSE_PASSWORD`, and `SLACK_WEBHOOK_URL`.
    2. Deploy this flow to your Kestra instance.
    3. Run a manual execution with `cluster` set to your ClickHouse cluster name (e.g., `default` or `production`) and `fail_on_stagnant: false` to verify connectivity.
    4. Enable the `periodic_ddl_queue_check` schedule trigger to run automated sweeps every 15 minutes.
    5. In your upstream schema deployment workflow, check the KV store key `clickhouse_ddl_queue_status_{cluster}` prior to running migrations.

    ## How to extend

    - **Automated Replica Restart**: Add an approval gate and `SYSTEM RESTART REPLICA` command for replicas that have lost their Keeper session.
    - **Deadlock Query Termination**: Combine with `KILL QUERY` to terminate deadlocked queries that have blocked DDL operations past a critical SLA threshold.
    - **Multi-Cluster Federation**: Parameterize the flow with a list of clusters or wrap it in a parent flow using `io.kestra.plugin.core.flow.ForEach` to audit all regional clusters in parallel.
    - **PagerDuty Escalation**: Replace or augment the Slack notification task with `io.kestra.plugin.pagerduty.Incident` for high-severity out-of-hours on-call paging.

    ## Links

    - [ClickHouse Distributed DDL Documentation](https://clickhouse.com/docs/en/sql-reference/statements/alter#distributed-ddl-queries-on-cluster-clause)
    - [ClickHouse system.distributed_ddl_queue Table](https://clickhouse.com/docs/en/operations/system-tables/distributed_ddl_queue)
    - [ClickHouse JDBC Plugin for Kestra](https://kestra.io/plugins/plugin-jdbc-clickhouse)
    - [Kestra Key-Value Store Documentation](https://kestra.io/docs/workflow-components/kv-store)
  tags:
    - Data
    - Infrastructure
  subTags:
    - Day 2 Operations
    - Monitoring & Alerting
  ee: false
  demo: false
