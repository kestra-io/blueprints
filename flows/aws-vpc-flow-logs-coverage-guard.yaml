id: aws-vpc-flow-logs-coverage-guard
namespace: company.security

description: Audits AWS Virtual Private Clouds (VPCs) across designated regions to verify active VPC Flow Logs coverage, alerting security operations when unmonitored network environments are detected.

concurrency:
  limit: 1

inputs:
  - id: aws_region
    type: STRING
    defaults: us-east-1
    description: AWS region to inspect for VPC Flow Logs configuration.

  - id: required_traffic_type
    type: STRING
    defaults: ALL
    description: Mandatory traffic logging filter type (ALL, ACCEPT, REJECT).

  - id: alert_on_unmonitored_vpcs
    type: BOOL
    defaults: true
    description: Whether to dispatch a Slack security notification when unmonitored VPCs are found.

  - id: slack_channel
    type: STRING
    defaults: "#secops-alerts"
    description: Slack channel destination for unmonitored network alerts.

tasks:
  - id: audit_vpc_flow_logs
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install boto3
    env:
      AWS_ACCESS_KEY_ID: "{{ secret('AWS_ACCESS_KEY_ID') }}"
      AWS_SECRET_ACCESS_KEY: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
      AWS_DEFAULT_REGION: "{{ inputs.aws_region }}"
    script: |
      import os
      import json
      import boto3
      from kestra import Kestra

      ec2 = boto3.client('ec2', region_name=os.getenv('AWS_DEFAULT_REGION'))

      vpcs_response = ec2.describe_vpcs()
      all_vpcs = vpcs_response.get('Vpcs', [])

      flow_logs_response = ec2.describe_flow_logs()
      active_flow_logs = flow_logs_response.get('FlowLogs', [])

      covered_vpc_ids = set()
      for fl in active_flow_logs:
          if fl.get('FlowLogStatus') == 'ACTIVE':
              resource_id = fl.get('ResourceId', '')
              if resource_id.startswith('vpc-'):
                  covered_vpc_ids.add(resource_id)

      unmonitored_vpcs = []
      for vpc in all_vpcs:
          vpc_id = vpc.get('VpcId')
          is_default = vpc.get('IsDefault', False)
          cidr_block = vpc.get('CidrBlock', '')
          
          tags = {t['Key']: t['Value'] for t in vpc.get('Tags', [])}
          vpc_name = tags.get('Name', 'unnamed')

          if vpc_id not in covered_vpc_ids:
              unmonitored_vpcs.append({
                  'vpc_id': vpc_id,
                  'name': vpc_name,
                  'cidr': cidr_block,
                  'is_default': is_default
              })

      total_vpcs = len(all_vpcs)
      unmonitored_count = len(unmonitored_vpcs)
      has_unmonitored = unmonitored_count > 0

      Kestra.outputs({
          'total_vpcs': total_vpcs,
          'unmonitored_vpcs_count': unmonitored_count,
          'has_unmonitored_vpcs': has_unmonitored,
          'unmonitored_vpc_ids': [v['vpc_id'] for v in unmonitored_vpcs]
      })

      report_payload = {
          'region': os.getenv('AWS_DEFAULT_REGION'),
          'total_vpcs': total_vpcs,
          'unmonitored_count': unmonitored_count,
          'unmonitored_vpcs': unmonitored_vpcs
      }

      with open('vpc_flow_logs_audit_report.json', 'w') as f:
          json.dump(report_payload, f, indent=2)

    outputFiles:
      - vpc_flow_logs_audit_report.json

  - id: check_unmonitored_vpcs
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.audit_vpc_flow_logs.vars.has_unmonitored_vpcs and inputs.alert_on_unmonitored_vpcs }}"
    then:
      - id: notify_slack_secops
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "{{ inputs.slack_channel }}",
            "text": "AWS VPC Flow Logs Compliance Alert: {{ outputs.audit_vpc_flow_logs.vars.unmonitored_vpcs_count }} unmonitored VPC(s) detected in {{ inputs.aws_region }}.\nUnmonitored VPC IDs: {{ outputs.audit_vpc_flow_logs.vars.unmonitored_vpc_ids | join(', ') }}"
          }
    else:
      - id: log_compliant_vpcs
        type: io.kestra.plugin.core.log.Log
        message: "All {{ outputs.audit_vpc_flow_logs.vars.total_vpcs }} VPC(s) in {{ inputs.aws_region }} have active VPC Flow Logs enabled."

  - id: export_compliance_manifest
    type: io.kestra.plugin.core.execution.Labels
    labels:
      aws_region: "{{ inputs.aws_region }}"
      unmonitored_count: "{{ outputs.audit_vpc_flow_logs.vars.unmonitored_vpcs_count | string }}"
      compliance_status: "{{ outputs.audit_vpc_flow_logs.vars.has_unmonitored_vpcs ? 'NON_COMPLIANT' : 'COMPLIANT' }}"

triggers:
  - id: weekly_vpc_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 8 * * 1"

extend:
  title: AWS VPC Flow Logs Coverage Guard
  metaTitle: AWS VPC Flow Logs Coverage Guard
  shortDescription: Audits AWS VPCs for active Flow Logs coverage and alerts security teams on unmonitored networks.
  metaDescription: Audits AWS VPCs for active Flow Logs coverage, identifies unmonitored network environments, and dispatches compliance alerts to Slack.
  description: |
    This blueprint audits AWS Virtual Private Clouds (VPCs) across target regions to verify active VPC Flow Logs logging. Scheduled on a weekly cadence, it identifies unmonitored production networks and default VPCs lacking packet telemetry, dispatching compliance notifications to Slack to uphold CIS AWS Foundations Benchmark standards.

    ## How it works

    1. **Scheduled Audit Trigger**: The `weekly_vpc_audit` trigger (`io.kestra.plugin.core.trigger.Schedule`) initiates the compliance evaluation every Monday at 08:00 UTC.
    2. **Boto3 VPC and Flow Log Inspection**: The `audit_vpc_flow_logs` task (`io.kestra.plugin.scripts.python.Script`) lists all VPCs and active flow logs in the specified AWS region, computing the exact delta of unmonitored VPC IDs.
    3. **Threshold Gate**: The `check_unmonitored_vpcs` flowable task (`io.kestra.plugin.core.flow.If`) evaluates whether any unmonitored networks exist.
    4. **Slack Security Alert**: When unmonitored networks are found, `notify_slack_secops` (`io.kestra.plugin.notifications.slack.SlackIncomingWebhook`) delivers an incident notification detailing offending VPC IDs.
    5. **Compliance Confirmation**: If all VPCs have flow logs active, `log_compliant_vpcs` records the verified audit state.
    6. **Manifest Export**: The `export_compliance_manifest` task tags the execution with searchable metadata for reporting.

    ## Architecture diagram

    ```mermaid
    flowchart TD
        A[Schedule: Weekly Monday 08:00 UTC] --> B[audit_vpc_flow_logs: AWS Boto3 API]
        B --> C{Unmonitored VPCs Detected?}
        C -- Yes --> D[notify_slack_secops: Slack Webhook]
        C -- No --> E[log_compliant_vpcs: Log]
        D --> F[export_compliance_manifest: Execution Labels]
        E --> F
    ```

    ## Use cases

    - **CIS AWS Benchmark Compliance**: Guarantee that all VPCs capture network flow metadata for security audits and forensic analysis.
    - **Shadow Infrastructure Detection**: Identify newly provisioned developer or staging VPCs that bypassed standard Infrastructure as Code (IaC) logging modules.
    - **Multi-Region Security Auditing**: Run parallel audits across all active corporate cloud regions to verify universal packet capture enforcement.

    ## Inputs

    | Name | Type | Default | Description |
    | :--- | :--- | :--- | :--- |
    | `aws_region` | STRING | `us-east-1` | AWS region to inspect for VPC Flow Logs configuration. |
    | `required_traffic_type` | STRING | `ALL` | Mandatory traffic logging filter type (ALL, ACCEPT, REJECT). |
    | `alert_on_unmonitored_vpcs` | BOOL | `true` | Whether to dispatch a Slack security notification when unmonitored VPCs are found. |
    | `slack_channel` | STRING | `#secops-alerts` | Slack channel destination for unmonitored network alerts. |

    ## Expected outputs

    - `{{ outputs.audit_vpc_flow_logs.vars.total_vpcs }}`: Total number of VPCs evaluated.
    - `{{ outputs.audit_vpc_flow_logs.vars.unmonitored_vpcs_count }}`: Count of VPCs without active flow logs.
    - `{{ outputs.audit_vpc_flow_logs.vars.has_unmonitored_vpcs }}`: Boolean flag indicating compliance failure.
    - `{{ outputs.audit_vpc_flow_logs.vars.unmonitored_vpc_ids }}`: List of unmonitored VPC resource IDs.
    - `{{ outputs.audit_vpc_flow_logs.outputFiles['vpc_flow_logs_audit_report.json'] }}`: Full JSON audit payload.

    ## Prerequisites

    - AWS IAM credentials with `ec2:DescribeVpcs` and `ec2:DescribeFlowLogs` permissions.
    - Incoming Webhook URL configured for your security operations Slack channel.

    ### Secrets

    - `AWS_ACCESS_KEY_ID`: AWS IAM access key ID.
    - `AWS_SECRET_ACCESS_KEY`: AWS IAM secret access key.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook endpoint URL.

    ## Quick start

    1. Configure `AWS_ACCESS_KEY_ID`, `AWS_SECRET_ACCESS_KEY`, and `SLACK_WEBHOOK_URL` in your Kestra namespace secrets.
    2. Import this flow YAML into your Kestra workspace.
    3. Specify your target AWS region in `aws_region`.
    4. Click **Execute** in the UI to run an initial VPC Flow Logs coverage audit.

    ## Common pitfalls and troubleshooting

    - **Default VPCs**: Default VPCs created automatically by AWS in each region often lack flow logs; consider deleting default VPCs or enabling flow logs to pass audits.
    - **Flow Log Destination Failure**: Flow logs with `FAILED` delivery status (e.g. invalid S3 bucket policy or deleted CloudWatch log group) are treated as unmonitored by this audit.

    ## How to extend

    - Add automated flow log provisioning via `ec2.create_flow_logs()` to immediately remediate non-compliant VPCs.
    - Extend checks to verify S3 bucket encryption and KMS keys for existing flow log destinations.
    - Integrate with AWS Security Hub to automatically ingest findings as security control standard evaluations.

    ## Links

    - Kestra Python Script Documentation: https://kestra.io/plugins/plugin-scripts-python/io.kestra.plugin.scripts.python.Script
    - Kestra Slack Plugin Documentation: https://kestra.io/plugins/plugin-notifications
    - AWS VPC Flow Logs Documentation: https://docs.aws.amazon.com/vpc/latest/userguide/flow-logs.html
  tags:
    - Cloud
    - Infrastructure
  subTags:
    - Policy & Compliance
    - Day 2 Operations
  ee: false
  demo: false
