id: datadog-alert-incident-sync-sentinel
namespace: company.sre

description: |
  Polls Datadog monitors in Alert state via containerized Python script,
  evaluates critical production breaches, files a prioritized GitHub incident
  tracking issue, and dispatches rich triage alerts to on-call engineers via Slack.

inputs:
  - id: datadog_site
    type: STRING
    displayName: Datadog Site
    defaults: datadoghq.com

  - id: monitor_tags
    type: STRING
    displayName: Monitor Tags Filter
    defaults: "env:prod,service:backend"

  - id: github_repository
    type: STRING
    displayName: Incident Tracking GitHub Repository
    defaults: my-org/sre-incidents

triggers:
  - id: every_fifteen_minutes
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

tasks:
  - id: probe_datadog_alerts
    type: io.kestra.plugin.scripts.python.Script
    description: Queries the Datadog API for all monitors actively in Alert status
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install requests kestra
    script: |
      import os
      import requests
      from kestra import Kestra

      site = "{{ inputs.datadog_site }}"
      tags = "{{ inputs.monitor_tags }}"
      api_key = os.environ.get("DATADOG_API_KEY")
      app_key = os.environ.get("DATADOG_APP_KEY")

      headers = {
          "DD-API-KEY": api_key,
          "DD-APPLICATION-KEY": app_key,
          "Content-Type": "application/json"
      }

      url = f"https://api.{site}/api/v1/monitor"
      params = {
          "monitor_tags": tags,
          "group_states": "Alert"
      }

      response = requests.get(url, headers=headers, params=params, timeout=30)
      if response.status_code != 200:
          print(f"Datadog API returned status {response.status_code}: {response.text}")
          # Raise or emit safe probe failure
          response.raise_for_status()

      monitors = response.json()
      alerting_monitors = [m for m in monitors if m.get("overall_state") == "Alert"]

      summary = []
      for m in alerting_monitors:
          summary.append({
              "id": m.get("id"),
              "name": m.get("name"),
              "type": m.get("type"),
              "message": m.get("message", "")[:200]
          })

      alert_count = len(alerting_monitors)
      print(f"Found {alert_count} active monitors in Alert state.")

      Kestra.outputs({
          "alert_count": alert_count,
          "has_alerts": alert_count > 0,
          "alerting_monitors": summary
      })

  - id: branch_on_active_alerts
    type: io.kestra.plugin.core.flow.If
    description: Evaluates whether any Datadog monitors are actively in Alert state
    condition: "{{ outputs.probe_datadog_alerts.vars.has_alerts == true }}"
    then:
      - id: create_incident_github_issue
        type: io.kestra.plugin.github.issues.Create
        description: Creates a GitHub incident triage ticket for active Datadog alerts
        oauthToken: "{{ secret('GITHUB_TOKEN') }}"
        repository: "{{ inputs.github_repository }}"
        title: "[Incident] Active Datadog Monitor Alerts Detected ({{ outputs.probe_datadog_alerts.vars.alert_count }} Active)"
        body: |
          ## 🚨 Active Datadog Monitor Alert Incident

          The automated SRE sentinel detected **{{ outputs.probe_datadog_alerts.vars.alert_count }}** monitors in `Alert` state matching filter `{{ inputs.monitor_tags }}`.

          ### Alerting Monitors:
          {% for m in outputs.probe_datadog_alerts.vars.alerting_monitors %}
          - **Monitor ID:** `{{ m.id }}` - **{{ m.name }}** (Type: `{{ m.type }}`)
          {% endfor %}

          ---
          *Generated automatically by Kestra Datadog Alert Incident Sentinel.*

      - id: notify_sre_slack
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Alerts on-call SREs on Slack with incident details and ticket link
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {{ {
            "text": "🚨 *Datadog Active Monitor Alerts Detected*\n*Filter:* `" ~ inputs.monitor_tags ~ "`\n*Alert Count:* *" ~ outputs.probe_datadog_alerts.vars.alert_count ~ "*\n*Incident Ticket:* <" ~ (outputs.create_incident_github_issue.issueUrl ?? "#") ~ "|View GitHub Incident>"
          } | toJson }}

    else:
      - id: log_all_monitors_healthy
        type: io.kestra.plugin.core.log.Log
        message: "All Datadog monitors matching {{ inputs.monitor_tags }} are OK. Zero active alerts."

  - id: log_audit_complete
    type: io.kestra.plugin.core.log.Log
    description: Final status log recording the Datadog alert audit results
    message: "Datadog alert audit completed. active_alerts={{ outputs.probe_datadog_alerts.vars.alert_count }}."

errors:
  - id: alert_probe_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alerts Slack when the Datadog API probe or ticket creation fails
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {{ {
        "text": "⚠️ *Datadog Alert Sentinel Failed* in execution `" ~ execution.id ~ "`. Unable to query Datadog monitors or dispatch notifications."
      } | toJson }}

extend:
  title: "Datadog Active Monitor Alert and Incident Sync Sentinel"
  shortDescription: "Polls Datadog monitors in Alert state, detects critical infrastructure breaches, opens GitHub incident tickets, and alerts Slack."
  metaTitle: "Datadog Active Monitor Alert Sentinel with Kestra"
  metaDescription: "Monitor active Datadog alerts with Kestra. Automatically query alerting monitors, synchronize incident tickets on GitHub, and alert SRE teams on Slack."
  description: |
    Production incidents frequently trigger multiple cascading alerts across Datadog monitors. Without centralized orchestration, engineers must manually cross-reference dashboards, open tracking tickets, and ping response channels. This blueprint polls Datadog's API for monitors in an active `Alert` state matching service and environment tags, automatically creates a consolidated GitHub incident issue with full monitor metadata, and dispatches an actionable Slack notification.

    ## How it works

    1. `every_fifteen_minutes` (`io.kestra.plugin.core.trigger.Schedule`) executes the audit periodically (shipped disabled for safe manual testing).
    2. `probe_datadog_alerts` (`io.kestra.plugin.scripts.python.Script`) interrogates the Datadog API (`GET /api/v1/monitor`) with specified tag filters and extracts monitors in `overall_state: Alert`.
    3. `branch_on_active_alerts` (`io.kestra.plugin.core.flow.If`) evaluates whether `alert_count > 0`:
       - `then`: Automatically files a GitHub tracking issue via `create_incident_github_issue` (`io.kestra.plugin.github.issues.Create`) and dispatches a notification via `notify_sre_slack` (`io.kestra.plugin.slack.notifications.SlackIncomingWebhook`).
       - `else`: Emits an informational log entry (`log_all_monitors_healthy`) confirming all monitors are healthy.
    4. `log_audit_complete` (`io.kestra.plugin.core.log.Log`) prints an audit log recording the monitor count for the run.
    5. The `errors` block alerts Slack if API tokens are invalid or network connectivity fails.

    ## What you get

    - Automated, centralized tracking of Datadog monitor breaches.
    - Zero manual ticket creation when critical infrastructure alerts fire.
    - Consolidated GitHub incident tickets with monitor IDs, names, and alert summaries.
    - Instant Slack alerts with direct hyperlinks to GitHub incident tracking issues.

    ## Who it's for

    - SRE and DevOps teams managing production infrastructure monitored by Datadog.
    - Platform engineers establishing incident response and post-mortem tracking.
    - Incident commanders coordinating rapid outage triage.

    ## Why orchestrate this with Kestra

    Kestra bridges monitoring systems (Datadog), engineering issue trackers (GitHub), and team communication platforms (Slack) into a single declarative workflow. It manages API credentials securely, provides auditability for every inspection cycle, and simplifies incident alerting without custom cron daemons or fragile microservices.

    ## Prerequisites

    - A Datadog account with API and Application keys created under Organization Settings.
    - A GitHub Personal Access Token with repository issue creation permissions.
    - A Slack incoming webhook URL for SRE alerts.

    ### Secrets

    - `DATADOG_API_KEY`: Datadog API key for authentication.
    - `DATADOG_APP_KEY`: Datadog Application key for querying monitors.
    - `GITHUB_TOKEN`: GitHub token used to open incident issues.
    - `SLACK_WEBHOOK`: Slack incoming webhook URL for incident notifications.

    ## Inputs

    - `datadog_site` (STRING, default `datadoghq.com`): Datadog site domain (`datadoghq.com`, `datadoghq.eu`, `us3.datadoghq.com`, etc.).
    - `monitor_tags` (STRING, default `env:prod,service:backend`): Comma-separated tag filter used to restrict audited monitors.
    - `github_repository` (STRING, default `my-org/sre-incidents`): GitHub repository (`owner/repo`) where incident tickets are created.

    ## Outputs

    - `outputs.probe_datadog_alerts.vars.alert_count`: The number of monitors discovered in Alert status.
    - `outputs.probe_datadog_alerts.vars.has_alerts`: Boolean indicator if any active alerts exist.
    - `outputs.probe_datadog_alerts.vars.alerting_monitors`: List of monitor summary objects (`id`, `name`, `type`, `message`).

    ## Quick start

    1. Configure the `DATADOG_API_KEY`, `DATADOG_APP_KEY`, `GITHUB_TOKEN`, and `SLACK_WEBHOOK` secrets.
    2. Import this flow and set `datadog_site` and `monitor_tags` to match your environment.
    3. Trigger a manual execution to verify monitor polling and Slack message delivery.
    4. Enable the `every_fifteen_minutes` schedule trigger to establish automated continuous incident monitoring.

    ## How to extend

    - Add an automated incident mitigation task (e.g. restart a Kubernetes deployment or scale an autoscaling group).
    - Dispatch paging alerts to PagerDuty or Opsgenie alongside GitHub issue creation.
    - Filter monitors by severity priority tags (e.g., `priority:p1`) to route high-severity alerts to an urgent war room.

    ## Links

    - [Datadog Monitors API Documentation](https://docs.datadoghq.com/api/latest/monitors/)
    - [Kestra Python Script Plugin](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra GitHub Plugin](https://kestra.io/plugins/plugin-github)
    - [Kestra Slack Plugin](https://kestra.io/plugins/plugin-slack)

  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Monitoring & Alerting
  ee: false
  demo: false
