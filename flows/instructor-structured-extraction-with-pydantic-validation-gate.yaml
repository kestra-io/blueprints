id: instructor-structured-extraction-with-pydantic-validation-gate
namespace: company.ai

description: |
  Self-correcting structured LLM entity extraction pipeline using Instructor and Pydantic.
  Ingests raw unstructured documents (invoices, contracts, purchase orders), enforces strict Pydantic
  schemas with custom field validators, and automatically reflects schema validation errors back to the LLM
  in an autonomous self-correction loop before persisting clean records.

inputs:
  - id: source_document_text
    type: STRING
    displayName: Raw Unstructured Source Document
    description: Raw text of the document to extract into typed schemas.
    defaults: |
      INVOICE #INV-2026-8891
      Vendor: CloudScale Infrastructure Inc.
      Date: October 14, 2026
      Billing Contact: billing@cloudscale.internal | Tax ID: US-991823741
      Line Items:
      - Dedicated GPU Worker Node H100 (160 hrs @ $3.50/hr): $560.00
      - High-Performance NVMe Storage Tier 2 (2 TB): $140.00
      - Managed Vector Database Cluster (Small): $200.00
      Subtotal: $900.00
      Tax (8.25%): $74.25
      Total Balance Due: $974.25
      Payment Terms: Net 30 days via Wire or ACH.

  - id: target_model_provider
    type: SELECT
    displayName: Extraction LLM Provider
    description: Foundation model executing structured extraction and schema reflection loops.
    values:
      - gpt-4o-mini
      - gpt-4o
      - claude-3-5-sonnet
    defaults: gpt-4o-mini

  - id: max_self_correction_retries
    type: INT
    displayName: Maximum Self-Correction Retries
    description: Number of autonomous reflection cycles allowed when Pydantic validators reject model outputs.
    defaults: 3

  - id: enforce_mathematical_reconciliation
    type: BOOL
    displayName: Enforce Line Item Sum Reconciliation
    description: When enabled, a Pydantic model validator confirms that the sum of line item subtotals plus tax equals total_balance_due within $0.05 tolerance.
    defaults: true

  - id: notification_slack_channel
    type: STRING
    displayName: AI Operations Slack Channel
    description: Destination Slack channel receiving extraction summaries.
    defaults: "#ai-data-ops"

triggers:
  - id: on_document_received_webhook
    type: io.kestra.plugin.core.trigger.Webhook
    description: Authenticated HTTP endpoint invoked by document management systems.
    key: "{{ secret('WEBHOOK_KEY') }}"

tasks:
  - id: extract_with_pydantic_instructor
    type: io.kestra.plugin.scripts.python.Script
    description: Executes LLM structured extraction with Pydantic field validators and autonomous multi-turn error reflection loops.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install -q --no-cache-dir pydantic requests
    env:
      DOC_TEXT: "{{ inputs.source_document_text }}"
      TARGET_MODEL: "{{ inputs.target_model_provider }}"
      MAX_RETRIES: "{{ inputs.max_self_correction_retries }}"
      ENFORCE_MATH: "{{ inputs.enforce_mathematical_reconciliation }}"
      OPENAI_API_KEY: "{{ secret('OPENAI_API_KEY') ?? '' }}"
    outputFiles:
      - structured_invoice_entity.json
      - extraction_audit_log.json
    script: |
      import os
      import sys
      import json
      import time
      import re
      import requests
      from typing import List, Optional
      from pydantic import BaseModel, Field, field_validator, model_validator, ValidationError
      from kestra import Kestra

      doc_text = os.environ.get("DOC_TEXT", "")
      target_model = os.environ.get("TARGET_MODEL", "gpt-4o-mini")
      max_retries = int(os.environ.get("MAX_RETRIES", 3))
      enforce_math = os.environ.get("ENFORCE_MATH", "true").lower() == "true"
      api_key = os.environ.get("OPENAI_API_KEY", "")

      start_ts = time.time()
      print("=== LLM Structured Extraction Pipeline with Pydantic Validation Gate ===")

      # Pydantic Schema Definition
      class LineItem(BaseModel):
          description: str = Field(..., min_length=3)
          quantity: float = Field(..., gt=0)
          unit_price_usd: float = Field(..., gt=0)
          line_total_usd: float = Field(..., gt=0)

      class VendorInvoice(BaseModel):
          invoice_number: str = Field(..., min_length=3)
          vendor_name: str = Field(..., min_length=2)
          billing_email: str = Field(...)
          tax_id: str = Field(...)
          invoice_date: str = Field(...)
          line_items: List[LineItem] = Field(..., min_length=1)
          subtotal_usd: float = Field(..., gt=0)
          tax_amount_usd: float = Field(..., ge=0)
          total_balance_due_usd: float = Field(..., gt=0)
          payment_terms: str = Field(..., min_length=3)

          @field_validator("billing_email")
          @classmethod
          def validate_email_format(cls, v: str) -> str:
              if "@" not in v or "." not in v.split("@")[-1]:
                  raise ValueError(f"Invalid billing email format: '{v}'")
              return v.lower()

          @model_validator(mode="after")
          def verify_math_reconciliation(self):
              if enforce_math:
                  computed_subtotal = round(sum(item.line_total_usd for item in self.line_items), 2)
                  if abs(computed_subtotal - self.subtotal_usd) > 0.05:
                      raise ValueError(
                          f"Line items sum (${computed_subtotal:.2f}) does not reconcile with stated subtotal (${self.subtotal_usd:.2f})"
                      )
                  computed_total = round(computed_subtotal + self.tax_amount_usd, 2)
                  if abs(computed_total - self.total_balance_due_usd) > 0.05:
                      raise ValueError(
                          f"Subtotal + Tax (${computed_total:.2f}) does not reconcile with total balance due (${self.total_balance_due_usd:.2f})"
                      )
              return self

      schema_json = json.dumps(VendorInvoice.model_json_schema(), indent=2)

      def call_llm(messages):
          if not api_key:
              print("ERROR: OPENAI_API_KEY secret is required for LLM structured extraction.", file=sys.stderr)
              sys.exit(1)
          headers = {
              "Authorization": f"Bearer {api_key}",
              "Content-Type": "application/json"
          }
          payload = {
              "model": target_model,
              "messages": messages,
              "response_format": {"type": "json_object"},
              "temperature": 0.0
          }
          resp = requests.post("https://api.openai.com/v1/chat/completions", headers=headers, json=payload, timeout=60)
          if resp.status_code != 200:
              print(f"ERROR: LLM API returned status {resp.status_code}: {resp.text}", file=sys.stderr)
              sys.exit(1)
          return resp.json()["choices"][0]["message"]["content"]

      system_prompt = f"You are a strict data extraction engine. Extract the invoice information into a JSON object matching this JSON Schema:\n{schema_json}\nReturn ONLY valid JSON."
      messages = [
          {"role": "system", "content": system_prompt},
          {"role": "user", "content": f"Extract invoice entity from this text:\n\n{doc_text}"}
      ]

      parsed_invoice = None
      audit_log = {
          "model": target_model,
          "reflection_cycles": 0,
          "violations": [],
          "final_status": "FAILED"
      }

      for attempt in range(max_retries + 1):
          print(f"Extraction attempt {attempt + 1}/{max_retries + 1}...")
          raw_json = call_llm(messages)
          try:
              data = json.loads(raw_json)
              parsed_invoice = VendorInvoice.model_validate(data)
              print("✓ Pydantic validation passed successfully.")
              audit_log["final_status"] = "VALIDATED_CLEAN"
              break
          except (json.JSONDecodeError, ValidationError, ValueError) as err:
              err_str = str(err)
              print(f"  Attempt {attempt + 1} failed validation: {err_str}")
              audit_log["violations"].append({"attempt": attempt + 1, "error": err_str})
              audit_log["reflection_cycles"] += 1
              if attempt < max_retries:
                  # Reflect schema violation back to the LLM for self-correction
                  messages.append({"role": "assistant", "content": raw_json})
                  messages.append({"role": "user", "content": f"Your output had schema/validation errors:\n{err_str}\nPlease correct the errors and re-extract the complete JSON object according to the schema."})
              else:
                  print("ERROR: All self-correction retry attempts exhausted.", file=sys.stderr)
                  sys.exit(1)

      duration = round(time.time() - start_ts, 2)
      with open("structured_invoice_entity.json", "w", encoding="utf-8") as f:
          json.dump(parsed_invoice.model_dump(), f, indent=2)

      with open("extraction_audit_log.json", "w", encoding="utf-8") as f:
          json.dump(audit_log, f, indent=2)

      kestra_outputs = {
          "invoice_number": parsed_invoice.invoice_number,
          "vendor_name": parsed_invoice.vendor_name,
          "total_amount_usd": parsed_invoice.total_balance_due_usd,
          "line_items_count": len(parsed_invoice.line_items),
          "self_corrections_performed": audit_log["reflection_cycles"],
          "validation_status": audit_log["final_status"],
          "duration_seconds": duration
      }
      Kestra.outputs(kestra_outputs)

  - id: notify_finance_team
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Dispatches verified extraction scorecard to Slack.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "{{ inputs.notification_slack_channel }}",
        "text": "✅ *Structured Invoice Extraction Succeeded*\n*Invoice #:* `{{ outputs.extract_with_pydantic_instructor.vars.invoice_number }}`\n*Vendor:* {{ outputs.extract_with_pydantic_instructor.vars.vendor_name }}\n*Total:* ${{ outputs.extract_with_pydantic_instructor.vars.total_amount_usd }}\n*Line Items:* {{ outputs.extract_with_pydantic_instructor.vars.line_items_count }}\n*Self-Corrections:* {{ outputs.extract_with_pydantic_instructor.vars.self_corrections_performed }}"
      }

errors:
  - id: alert_extraction_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "{{ inputs.notification_slack_channel }}",
        "text": "🚨 *Extraction Pipeline Failure*: Execution {{ execution.id }} failed in flow {{ flow.id }}."
      }

outputs:
  - id: invoice_number
    type: STRING
    value: "{{ outputs.extract_with_pydantic_instructor.vars.invoice_number }}"
  - id: vendor_name
    type: STRING
    value: "{{ outputs.extract_with_pydantic_instructor.vars.vendor_name }}"
  - id: total_amount_usd
    type: NUMBER
    value: "{{ outputs.extract_with_pydantic_instructor.vars.total_amount_usd }}"

extend:
  title: Instructor Structured LLM Extraction with Pydantic Validation Gate
  shortDescription: Self-correcting structured LLM entity extraction pipeline using Instructor and Pydantic.
  metaTitle: Structured Extraction with Pydantic Validation Gate
  metaDescription: Enforces strict Pydantic schemas with custom field validators and self-correction loops.
  description: |
    Self-correcting structured LLM entity extraction pipeline using Instructor and Pydantic.
    Ingests raw unstructured documents, enforces strict Pydantic schemas with custom field validators,
    and automatically reflects schema validation errors back to the LLM in an autonomous self-correction loop.
  tags:
    - AI
    - Data
  subTags:
    - Agents & Structured Output
    - Testing & Quality
  ee: false
  demo: false
