id: github-repository-stats-report
namespace: company.team

description: |
  Fetches the most starred public repositories of a GitHub user or organization with the
  GitHub Search API, saves the statistics into a CSV file and summarizes them per language
  with DuckDB. No token, no account, no secrets.

inputs:
  - id: owner
    type: STRING
    defaults: kestra-io
    description: GitHub user or organization name.

  - id: top
    type: INT
    defaults: 10
    description: Number of most starred repositories to include (1 to 100).

triggers:
  - id: weekly_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    description: Every Monday at 08:00 UTC.
    cron: "0 8 * * 1"
    disabled: false

tasks:
  - id: fetch_repositories
    type: io.kestra.plugin.core.http.Request
    description: Gets the most starred public repositories of the owner.
    uri: "https://api.github.com/search/repositories?q=user:{{ inputs.owner }}&sort=stars&order=desc&per_page={{ inputs.top }}"
    method: GET
    options:
      allowFailed: true
    headers:
      Accept: application/vnd.github+json
      X-GitHub-Api-Version: "2022-11-28"
    retry:
      type: exponential
      interval: PT2S
      maxInterval: PT30S
      maxAttempts: 3

  - id: check_repositories_found
    type: io.kestra.plugin.core.flow.If
    description: Continues the report only when the owner exists and has public repositories.
    condition: "{{ outputs.fetch_repositories.code == 200 and fromJson(outputs.fetch_repositories.body).total_count > 0 }}"
    then:
      - id: save_csv
        type: io.kestra.plugin.core.storage.Write
        description: Saves one row per repository into a CSV file in internal storage.
        extension: .csv
        content: |
          repository,stars,forks,open_issues,language
          {%- for repo in fromJson(outputs.fetch_repositories.body).items %}
          {{ repo.name }},{{ repo.stargazers_count }},{{ repo.forks_count }},{{ repo.open_issues_count }},{{ repo.language ?? 'n/a' }}
          {%- endfor %}

      - id: summarize_languages
        type: io.kestra.plugin.jdbc.duckdb.Query
        description: Sums stars, forks and open issues per language with an in-memory DuckDB query.
        inputFiles:
          repositories.csv: "{{ outputs.save_csv.uri }}"
        sql: |
          SELECT
            language,
            count(*) AS repositories,
            sum(stars) AS stars,
            sum(forks) AS forks,
            sum(open_issues) AS open_issues
          FROM read_csv_auto('{{ workingDir }}/repositories.csv')
          GROUP BY language
          ORDER BY stars DESC;
        fetchType: FETCH

      - id: log_report
        type: io.kestra.plugin.core.log.Log
        description: Writes the ranking and the language summary into the execution log.
        message: |
          Top {{ inputs.top }} repositories of {{ inputs.owner }} ({{ fromJson(outputs.fetch_repositories.body).total_count }} public repositories in total)
          {%- for repo in fromJson(outputs.fetch_repositories.body).items %}
          #{{ loop.index + 1 }} {{ repo.name }}: {{ repo.stargazers_count }} stars, {{ repo.forks_count }} forks, {{ repo.open_issues_count }} open issues
          {%- endfor %}

          Stars per language
          {%- for row in outputs.summarize_languages.rows %}
          {{ row.language }}: {{ row.stars }} stars in {{ row.repositories }} repositories
          {%- endfor %}
    else:
      - id: log_no_repositories
        type: io.kestra.plugin.core.log.Log
        level: WARN
        message: "No public repositories found for '{{ inputs.owner }}' (HTTP {{ outputs.fetch_repositories.code }}). Check the owner input."

extend:
  title: Weekly GitHub Repository Stats Report with DuckDB
  shortDescription: Fetch the most starred repositories of a GitHub user or organization, save the stats as CSV and summarize them per language with DuckDB.
  metaTitle: GitHub Repository Stats Report with DuckDB in Kestra
  metaDescription: Fetch stars, forks and open issues of the most starred repositories of a GitHub user or organization with the GitHub Search API, save them as CSV and summarize them with DuckDB. No token needed.
  description: |
    Track the popularity of any GitHub user or organization without a token, account or secret. This blueprint calls the public GitHub Search API for the most starred repositories of an owner, saves stars, forks and open issues into a CSV file and sums them per programming language with an in-memory DuckDB query.

    ## How it works

    1. The `weekly_schedule` trigger (`io.kestra.plugin.core.trigger.Schedule`) runs the flow every Monday at 08:00 UTC.
    2. `fetch_repositories` (`io.kestra.plugin.core.http.Request`) calls the GitHub Search API for the `owner` and `top` inputs, with exponential retries.
    3. `check_repositories_found` (`io.kestra.plugin.core.flow.If`) continues only when the owner exists and has public repositories. Otherwise `log_no_repositories` logs a warning.
    4. `save_csv` (`io.kestra.plugin.core.storage.Write`) stores one row per repository as a CSV file in internal storage.
    5. `summarize_languages` (`io.kestra.plugin.jdbc.duckdb.Query`) reads the CSV in memory and sums stars, forks and open issues per language.
    6. `log_report` (`io.kestra.plugin.core.log.Log`) writes the ranking and the language summary into the execution log.

    ## What you get

    - A weekly ranking of the most starred repositories in the execution log.
    - A per-language summary of stars, forks and open issues.
    - A CSV file with the statistics, downloadable from the `save_csv` task outputs.
    - A clear warning instead of a confusing failure when the owner name is wrong.

    ## Who it's for

    - Open source maintainers who follow the growth of their projects.
    - Developer relations teams that compare organizations in the same space.
    - Anyone new to Kestra who wants an HTTP, DuckDB and conditional-branching example without any credentials.

    ## Why orchestrate this with Kestra

    A script with curl has no retries, no run history and no place to keep the CSV. Kestra gives the pipeline scheduling, retries, conditional branching, file outputs and a full execution history in one declarative flow.

    ## Prerequisites

    - No secrets are required. The unauthenticated GitHub Search API allows 10 requests per minute per IP address, which is plenty for a weekly report.
    - The `summarize_languages` task needs the DuckDB plugin (`io.kestra.plugin.jdbc.duckdb`), which is included in the Kestra full image.

    ### Inputs

    - `owner` (STRING, default `kestra-io`): GitHub user or organization name.
    - `top` (INT, default `10`): number of most starred repositories, from 1 to 100.

    ### Outputs

    - `save_csv`: CSV file with the statistics, available as `{{ outputs.save_csv.uri }}` in the task outputs.

    ## Quick start

    1. Save the flow in your Kestra instance.
    2. Click **Execute** and set `owner` to the user or organization you want to follow.
    3. Open the execution logs to see the ranking and download the CSV from the `save_csv` task outputs.
    4. Leave the `weekly_schedule` trigger enabled, or set `disabled: true` to run the flow manually only.

    ## How to extend

    - Add an `Authorization` header with a GitHub token secret to raise the API rate limit.
    - Send the ranking to Slack, Discord or email instead of only logging it.
    - Append each CSV to a warehouse table to build a star history.
    - Alert when a repository gains or loses more stars than a threshold since the previous week.

    ## Links

    - [GitHub REST API: Search repositories](https://docs.github.com/en/rest/search/search#search-repositories)
    - [Kestra DuckDB Plugin Documentation](https://kestra.io/plugins/plugin-jdbc-duckdb)
  tags:
    - Data
    - Core
  subTags:
    - Reporting & Digests
    - File & Data Processing Basics
  ee: false
  demo: false
