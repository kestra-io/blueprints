id: track-my-merged-fix
namespace: hacktober.blueprints
description: Polls a target GitHub repository on a schedule to check if a specific PR or issue fix has shipped in the latest tagged release, notifying a Discord/Slack channel.

inputs:
  - id: repository
    type: STRING
    defaults: "kestra-io/kestra"
    description: "GitHub owner/repo to monitor"

  - id: search_keyword
    type: STRING
    defaults: "#1234"
    description: "The issue or PR tag you want to track (e.g. #1234 or your GitHub handle)"

triggers:
  - id: daily-check
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 10 * * *"

tasks:
  - id: fetch-latest-release
    type: io.kestra.plugin.core.http.Request
    uri: "https://api.github.com/repos/{{ inputs.repository }}/releases/latest"
    method: GET
    allowFailure: true

  - id: check-release-notes
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs['fetch-latest-release'].code == 200 and (outputs['fetch-latest-release'].body contains inputs.search_keyword) }}"
    then:
      - id: send-release-alert
        type: io.kestra.plugin.notifications.discord.DiscordIncomingWebhook
        url: "{{ secret('DISCORD_WEBHOOK_URL') }}"
        payload: |
          {
            "content": "🎉 **Your fix is live!**\nRepository: `{{ inputs.repository }}`\nRelease: **{{ (outputs['fetch-latest-release'].body | fromJson).tag_name }}**\nNotes: {{ (outputs['fetch-latest-release'].body | fromJson).html_url }}"
          }

      - id: log-shipped
        type: io.kestra.plugin.core.log.Log
        message: "PR/Issue {{ inputs.search_keyword }} confirmed in release {{ (outputs['fetch-latest-release'].body | fromJson).tag_name }}."
    else:
      - id: log-still-waiting
        type: io.kestra.plugin.core.log.Log
        message: "Repository {{ inputs.repository }} either has no releases yet or the latest release does not include {{ inputs.search_keyword }}."