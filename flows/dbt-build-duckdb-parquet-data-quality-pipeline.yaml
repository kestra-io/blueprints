id: dbt-build-duckdb-parquet-data-quality-pipeline
namespace: company.analytics

description: |
  Automated dbt data pipeline executing models on DuckDB, enforcing data contract and freshness tests,
  compiling columnar Parquet marts, and dispatching analytics scorecards to Slack.

inputs:
  - id: git_repository
    type: STRING
    displayName: Git Repository URL
    description: Git repository containing the dbt project and models.
    defaults: "https://github.com/dbt-labs/jaffle_shop"

  - id: git_branch
    type: STRING
    displayName: Git Branch
    description: Target Git branch to check out and build.
    defaults: "main"

  - id: dbt_target
    type: STRING
    displayName: dbt Profile Target
    description: Target environment profile declared in profiles.yml (e.g. dev, prod).
    defaults: "prod"

  - id: slack_channel
    type: STRING
    displayName: Slack Channel
    description: Destination Slack channel for dbt build notifications.
    defaults: "#analytics-engineering"

tasks:
  - id: dbt_pipeline_workspace
    type: io.kestra.plugin.core.flow.WorkingDirectory
    description: Isolated shared workspace for git cloning, dbt model builds, and test reporting.
    tasks:
      - id: clone_dbt_repo
        type: io.kestra.plugin.git.Clone
        description: Pull dbt project configuration, seed data, and model definitions from Git.
        url: "{{ inputs.git_repository }}"
        branch: "{{ inputs.git_branch }}"

      - id: run_dbt_build_and_tests
        type: io.kestra.plugin.scripts.shell.Commands
        description: Execute dbt dependencies, compile SQL models against DuckDB, and execute quality tests.
        taskRunner:
          type: io.kestra.plugin.scripts.runner.docker.Docker
        containerImage: python:3.11-slim
        env:
          DBT_PROFILES_DIR: "{{ workingDir }}"
        commands:
          - pip install --no-cache-dir "dbt-duckdb>=1.8.0,<1.9.0"
          - |
            cat << 'EOF' > profiles.yml
            jaffle_shop:
              target: "{{ inputs.dbt_target }}"
              outputs:
                prod:
                  type: duckdb
                  path: "{{ workingDir }}/analytics.duckdb"
                  extensions:
                    - parquet
                    - httpfs
                dev:
                  type: duckdb
                  path: "{{ workingDir }}/dev.duckdb"
            EOF
          - dbt deps
          - dbt seed
          - dbt run
          - dbt test

      - id: export_curated_marts_to_parquet
        type: io.kestra.plugin.scripts.shell.Commands
        description: Export validated dbt dimensional marts into compressed Parquet files.
        taskRunner:
          type: io.kestra.plugin.scripts.runner.docker.Docker
        containerImage: python:3.11-slim
        commands:
          - pip install --no-cache-dir duckdb
          - |
            python3 - << 'PYEOF'
            import duckdb
            con = duckdb.connect("analytics.duckdb")
            con.execute("COPY (SELECT * FROM customers) TO 'customers_mart.parquet' (FORMAT PARQUET, COMPRESSION ZSTD);")
            con.execute("COPY (SELECT * FROM orders) TO 'orders_mart.parquet' (FORMAT PARQUET, COMPRESSION ZSTD);")
            print("Exported dimensional marts to Parquet.")
            PYEOF

      - id: parse_run_results
        type: io.kestra.plugin.scripts.python.Script
        description: Parse dbt run_results.json artifact to extract execution timing, model counts, and test passes.
        containerImage: python:3.11-slim
        script: |
          import json, os
          from kestra import Kestra

          results_path = os.path.join("target", "run_results.json")
          total_models = 0
          total_tests = 0
          passed_tests = 0

          if os.path.exists(results_path):
              with open(results_path) as f:
                  data = json.load(f)
              results = data.get("results", [])
              total_models = sum(1 for r in results if r.get("unique_id", "").startswith("model."))
              total_tests = sum(1 for r in results if r.get("unique_id", "").startswith("test."))
              passed_tests = sum(1 for r in results if r.get("unique_id", "").startswith("test.") and r.get("status") == "pass")

          Kestra.outputs({
              "total_models": total_models,
              "total_tests": total_tests,
              "passed_tests": passed_tests
          })

  - id: notify_dbt_success
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Post dbt build scorecard and test pass metrics to Slack.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "{{ inputs.slack_channel }}",
        "username": "dbt Data Pipeline",
        "icon_emoji": ":hammer_and_wrench:",
        "text": ":white_check_mark: *dbt DuckDB Pipeline Execution Complete*\n• *Repository:* `{{ inputs.git_repository }}` (`{{ inputs.git_branch }}`)\n• *Models Built:* `{{ outputs.parse_run_results.vars.total_models }}`\n• *Tests Passed:* `{{ outputs.parse_run_results.vars.passed_tests }}/{{ outputs.parse_run_results.vars.total_tests }}`\n• *Execution ID:* `{{ flow.executionId }}`"
      }

errors:
  - id: dead_letter_alert
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Route dbt build or test regression alerts directly to analytics engineering channels.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "{{ inputs.slack_channel }}",
        "username": "dbt Pipeline - Failure",
        "icon_emoji": ":rotating_light:",
        "text": ":rotating_light: *CRITICAL: dbt DuckDB Pipeline Build Failed*\n• *Flow:* `{{ flow.id }}`\n• *Failed Task:* `{{ task.id }}`\n• *Execution ID:* `{{ flow.executionId }}`"
      }

extend:
  title: "dbt Core Build & DuckDB Parquet Data Quality Pipeline"
  metaTitle: dbt Build & DuckDB Parquet Data Pipeline | Kestra
  shortDescription: Orchestrate dbt models on embedded DuckDB, execute data quality tests, export Parquet marts, and alert Slack.
  metaDescription: Orchestrate dbt models with DuckDB, run automated data quality tests, export compressed Parquet marts, and dispatch Slack analytics scorecards.
  description: |
    Running analytics transformations with zero cloud data warehouse compute costs has become an industry standard with dbt Core and DuckDB.

    This blueprint orchestrates a complete, isolated dbt analytics engineering lifecycle:
    1. Clones the dbt repository from version control using `io.kestra.plugin.git.Clone`.
    2. Dynamically generates a production-grade `profiles.yml` targeting an embedded DuckDB database inside a Docker container.
    3. Runs `dbt seed`, compiles and executes all SQL models, and runs complete schema and relationship test suites.
    4. Automatically exports validated dimensional marts into ZSTD-compressed Parquet files ready for cloud lakehouse consumption.
    5. Parses the `run_results.json` artifact to extract model metrics and broadcasts an operational scorecard to Slack.

    ## Prerequisites
    - A Git repository containing a valid dbt project.
    - Slack Incoming Webhook URL (`SLACK_WEBHOOK_URL`).
  tags:
    - Data
    - dbt
    - Database
    - ETL
  subTags:
    - dbt
    - DuckDB
    - Parquet
    - Slack
  ee: false
  demo: false
