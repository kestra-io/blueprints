id: kafka-active-controller-count-divergence-sentinel
namespace: company.data

inputs:
  - id: kafka_broker_host
    type: STRING
    defaults: "kafka-0.internal"
    description: Apache Kafka broker hostname or IP address.
  - id: kafka_jmx_exporter_port
    type: INT
    defaults: 9404
    description: Prometheus JMX Exporter port exposing Kafka broker metrics.

tasks:
  - id: scrape_controller_metrics
    type: io.kestra.plugin.scripts.shell.Commands
    containerImage: ghcr.io/kestra-io/tools:latest
    commands:
      - |
        curl -s "http://{{ inputs.kafka_broker_host }}:{{ inputs.kafka_jmx_exporter_port }}/metrics" > /tmp/kafka_ctrl.prom
        
        ACTIVE_CONTROLLER_COUNT=$(grep -E '^kafka_controller_kafkacontroller_activecontrollercount' /tmp/kafka_ctrl.prom | awk '{print $2}' | head -n1)
        ACTIVE_CONTROLLER_COUNT=${ACTIVE_CONTROLLER_COUNT:-0}
        
        OFFLINE_PARTITIONS=$(grep -E '^kafka_controller_kafkacontroller_offlinepartitionscount' /tmp/kafka_ctrl.prom | awk '{print $2}' | head -n1)
        OFFLINE_PARTITIONS=${OFFLINE_PARTITIONS:-0}
        
        echo "::set-output name=active_controller_count::$ACTIVE_CONTROLLER_COUNT::"
        echo "::set-output name=offline_partitions::$OFFLINE_PARTITIONS::"

  - id: evaluate_controller_state
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.scrape_controller_metrics.vars.offline_partitions | int > 0 }}"
    then:
      - id: notify_streaming_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#kafka-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 Kafka Controller Health & Offline Partitions Alert",
                "text": "Kafka broker `{{ inputs.kafka_broker_host }}` reported *{{ outputs.scrape_controller_metrics.vars.offline_partitions }}* offline partitions! (Active Controller Flag: {{ outputs.scrape_controller_metrics.vars.active_controller_count }}). Impact: Partitions without an elected leader are completely unavailable for reads and writes.",
                "footer": "Kestra Streaming Sentinel • Apache Kafka"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#kafka-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ Apache Kafka Active Controller Count Divergence Sentinel Pipeline Failure",
            "text": "Failed to scrape Kafka controller metrics. Please verify JMX exporter endpoint availability.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  title: Apache Kafka Active Controller Count Divergence Sentinel
  shortDescription: Audits Apache Kafka broker metrics to detect active controller count divergence and split-brain states.
  description: |
    ## How it works
    This workflow queries `kafka_controller_kafkacontroller_activecontrollercount` and `kafka_controller_kafkacontroller_offlinepartitionscount` from the broker's JMX Prometheus endpoint. In a healthy Kafka cluster, exactly one broker acts as the active controller. If controller communication fails or offline partitions emerge due to leader election failures, an urgent Slack alert is triggered.

    ## What you get
    - Continuous monitoring of Kafka cluster controller health and partition availability.
    - Instant alerting on offline partitions causing critical data read/write blackouts.
    - Visibility into active controller election status across broker nodes.

    ## Who it's for
    - Kafka SREs and Infrastructure Engineers maintaining mission-critical event backbones.
    - Data Platform teams supporting 24/7 streaming pipelines and microservices.

    ## Why orchestrate this with Kestra
    - **Native JMX/Prometheus Scrape**: Extract critical controller telemetry without external monitoring agents.
    - **Instant Incident Escalation**: Alert on-call teams immediately when partitions go offline.
    - **Self-Healing Integration**: Seamlessly chain automated controller election diagnostic flows.

    ## Prerequisites
    - Apache Kafka broker with Prometheus JMX exporter configured.
    - Secret `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import the blueprint.
    2. Configure broker host and JMX port.
    3. Run the workflow to verify controller state.

    ## How to extend
    - Query all brokers in the cluster and verify that the sum of ActiveControllerCount equals exactly 1.
    - Trigger automated partition reassignment flows for stuck offline partitions.

    ## Links
    - [Apache Kafka Controller Metrics Documentation](https://kafka.apache.org/documentation/#monitoring)
    - [Kestra Shell Plugin](https://kestra.io/plugins/plugin-scripts/commands/io.kestra.plugin.scripts.shell.commands)
  tags:
    - Data
    - Infrastructure
  ee: false
  demo: false
