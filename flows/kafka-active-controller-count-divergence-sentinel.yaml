id: kafka-active-controller-count-divergence-sentinel
namespace: company.team

inputs:
  - id: kafka_broker_host
    type: STRING
    defaults: "kafka-0.internal"
    description: Apache Kafka broker hostname or IP address.
  - id: kafka_jmx_exporter_port
    type: INT
    defaults: 9404
    description: Prometheus JMX Exporter port exposing Kafka broker metrics.

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

tasks:
  - id: scrape_controller_metrics
    type: io.kestra.plugin.scripts.python.Script
    description: Scrapes Kafka Prometheus JMX metrics to verify active controller count and offline partitions.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests
    env:
      BROKER_HOST: "{{ inputs.kafka_broker_host }}"
      JMX_PORT: "{{ inputs.kafka_jmx_exporter_port }}"
    outputFiles:
      - kafka_controller_metrics.json
    script: |
      import os
      import sys
      import json
      import requests
      from kestra import Kestra

      host = os.environ.get("BROKER_HOST", "kafka-0.internal")
      port = os.environ.get("JMX_PORT", "9404")
      url = f"http://{host}:{port}/metrics"

      print(f"Scraping Kafka controller metrics from {url}...")
      try:
          resp = requests.get(url, timeout=20)
          resp.raise_for_status()
          lines = resp.text.splitlines()
      except Exception as exc:
          print(f"ERROR: Failed to connect or scrape Kafka JMX metrics: {exc}", file=sys.stderr)
          sys.exit(1)

      active_controller = 0
      offline_partitions = 0

      for line in lines:
          if line.startswith("#"):
              continue
          if "kafka_controller_kafkacontroller_activecontrollercount" in line:
              parts = line.strip().split()
              if len(parts) >= 2:
                  active_controller = int(float(parts[-1]))
          elif "kafka_controller_kafkacontroller_offlinepartitionscount" in line:
              parts = line.strip().split()
              if len(parts) >= 2:
                  offline_partitions = int(float(parts[-1]))

      metrics = {
          "active_controller_count": active_controller,
          "offline_partitions": offline_partitions,
          "is_divergent": offline_partitions > 0 or active_controller not in (0, 1)
      }

      with open("kafka_controller_metrics.json", "w", encoding="utf-8") as f:
          json.dump(metrics, f, indent=2)

      print(f"Metrics audit complete: active_controller={active_controller}, offline_partitions={offline_partitions}")
      Kestra.outputs(metrics)

  - id: evaluate_controller_state
    type: io.kestra.plugin.core.flow.If
    description: Alert if offline partitions exist or active controller state is divergent.
    condition: "{{ outputs.scrape_controller_metrics.vars.offline_partitions > 0 }}"
    then:
      - id: notify_streaming_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#kafka-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 Kafka Controller Health & Offline Partitions Alert",
                "text": "Kafka broker `{{ inputs.kafka_broker_host }}` reported *{{ outputs.scrape_controller_metrics.vars.offline_partitions }}* offline partitions! (Active Controller Flag: {{ outputs.scrape_controller_metrics.vars.active_controller_count }}). Impact: Partitions without an elected leader are completely unavailable for reads and writes.",
                "footer": "Kestra Streaming Sentinel • Apache Kafka"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#kafka-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ Apache Kafka Active Controller Count Divergence Sentinel Pipeline Failure",
            "text": "Failed to scrape Kafka controller metrics from {{ inputs.kafka_broker_host }}.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

outputs:
  - id: active_controller_count
    type: INT
    value: "{{ outputs.scrape_controller_metrics.vars.active_controller_count }}"
  - id: offline_partitions
    type: INT
    value: "{{ outputs.scrape_controller_metrics.vars.offline_partitions }}"

extend:
  title: Apache Kafka Active Controller Count Divergence Sentinel
  shortDescription: Audits Apache Kafka broker metrics to detect active controller count divergence and split-brain states.
  metaTitle: Apache Kafka Active Controller Count Divergence Sentinel with Kestra
  metaDescription: Audits Apache Kafka broker metrics to detect active controller count divergence and split-brain states.
  description: |
    Audits Apache Kafka broker metrics to detect active controller count divergence and split-brain states.
  tags:
    - Data
    - Infrastructure
  subTags:
    - Realtime & Streaming
    - ELT & Data Landing
  ee: false
  demo: false
