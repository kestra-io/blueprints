id: elasticsearch-jvm-heap-memory-pressure-sentinel
namespace: company.team

inputs:
  - id: es_host
    type: STRING
    defaults: elasticsearch.internal
  - id: heap_threshold_percent
    type: INT
    defaults: 85

triggers:
  - id: schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

tasks:
  - id: fetch_jvm_stats
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests
    env:
      ES_HOST: "{{ inputs.es_host }}"
      ES_PASSWORD: "{{ secret('ES_PASSWORD') }}"
      HEAP_THRESHOLD: "{{ inputs.heap_threshold_percent }}"
    outputFiles:
      - jvm_stats.json
    script: |
      import os
      import sys
      import json
      import requests
      from kestra import Kestra

      host = os.environ.get("ES_HOST", "elasticsearch.internal")
      password = os.environ.get("ES_PASSWORD", "")
      threshold = int(os.environ.get("HEAP_THRESHOLD", 85))

      url = f"http://{host}:9200/_nodes/stats/jvm"
      auth = ("elastic", password) if password else None

      try:
          resp = requests.get(url, auth=auth, timeout=12)
          resp.raise_for_status()
          nodes_data = resp.json().get("nodes", {})
      except Exception as e:
          print(f"ERROR: Failed to query Elasticsearch JVM stats from {url}: {e}", file=sys.stderr)
          sys.exit(1)

      parsed_nodes = []
      breaching = []
      for node_id, n in nodes_data.items():
          name = n.get("name", node_id)
          jvm_mem = n.get("jvm", {}).get("mem", {})
          heap_used_pct = int(jvm_mem.get("heap_used_percent", 0))
          heap_used_mb = int(jvm_mem.get("heap_used_in_bytes", 0) / 1024 / 1024)
          node_summary = {
              "name": name,
              "heap_used_percent": heap_used_pct,
              "heap_used_mb": heap_used_mb
          }
          parsed_nodes.append(node_summary)
          if heap_used_pct >= threshold:
              breaching.append(f"{name}: {heap_used_pct}% ({heap_used_mb} MB)")

      with open("jvm_stats.json", "w", encoding="utf-8") as out:
          json.dump(parsed_nodes, out, indent=2)

      details = ", ".join(breaching) if breaching else "none"
      print(f"Elasticsearch JVM heap audit: {len(parsed_nodes)} nodes inspected, {len(breaching)} exceeding {threshold}%.")

      Kestra.outputs({
          "breaching_nodes": len(breaching),
          "breach_details": details
      })

  - id: evaluate_heap_pressure
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.fetch_jvm_stats.vars.breaching_nodes | default(0) | int > 0 }}"
    then:
      - id: alert_heap_pressure
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret(\"SLACK_WEBHOOK\") }}"
        payload: |
          {
            "text": ":fire: *Elasticsearch JVM Heap Pressure Alert*\n*Host:* {{ inputs.es_host }}\n*Threshold:* {{ inputs.heap_threshold_percent }}%\n*Breaching Nodes:* {{ outputs.fetch_jvm_stats.vars.breach_details | default('see logs') }}\nHigh heap usage can trigger aggressive GC pauses and node instability. Consider scaling or reducing index load."
          }
    else:
      - id: log_heap_healthy
        type: io.kestra.plugin.core.log.Log
        message: "Elasticsearch JVM heap is healthy on all nodes. No node exceeds {{ inputs.heap_threshold_percent }}%."

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret(\"SLACK_WEBHOOK\") }}"
    payload: |
      {
        "text": ":x: *Elasticsearch JVM Heap Sentinel Failed*\n*Flow:* {{ flow.id }}\n*Execution:* {{ execution.id }}\n*Error:* {{ execution.error.message | default('Unknown error') }}\nCheck Kestra UI for details."
      }

extend:
  title: Elasticsearch JVM Heap Memory Pressure and GC Sentinel
  shortDescription: Monitor Elasticsearch node JVM heap utilization and old-generation GC counts via the nodes stats API and alert Slack when any node exceeds the configured threshold.
  metaTitle: Elasticsearch JVM Heap Memory Pressure Sentinel, Kestra Blueprint
  metaDescription: Detect Elasticsearch nodes with high JVM heap utilization and elevated old-generation GC counts. Alert your team on Slack before heap pressure causes GC pauses or node instability.
  description: |
    Sustained JVM heap pressure above 85 % on an Elasticsearch node forces the JVM's old-generation garbage collector into frequent collection cycles. When the GC cannot keep pace, the node enters circuit-breaker rejection, begins refusing new indexing requests, and can trigger a split-brain or node eviction if the GC pause exceeds the cluster fault detection timeout. This sentinel checks every node's heap utilization in a single API call and alerts before the situation becomes critical.

    ## How it works

    1. The `fetch_jvm_stats` task (`io.kestra.plugin.scripts.shell.Commands`) calls `/_nodes/stats/jvm` authenticated with the `ES_PASSWORD` secret and pipes the response through `jq` to extract, for each node, its name, heap-used percentage, heap-used in megabytes, and old-generation GC collection count.
    2. The same script counts nodes whose `heap_used_percent` is at or above `inputs.heap_threshold_percent` (default `85`) and formats a comma-separated detail string for the Slack message.
    3. The `evaluate_heap_pressure` task (`io.kestra.plugin.core.flow.If`) branches on whether any breaching nodes were found. When one or more nodes are above the threshold the `alert_heap_pressure` step fires an `io.kestra.plugin.slack.notifications.SlackIncomingWebhook` message listing each affected node with its percentage and heap size in MB.
    4. The top-level `errors` block fires a separate Slack alert if the sentinel itself fails.

    ## What you get

    - Per-node heap utilization and GC metrics sampled directly from the Elasticsearch nodes stats API.
    - A Slack alert that names each offending node along with its heap percentage and absolute MB figure, giving on-call engineers a complete picture without requiring API access.
    - A configurable threshold input so the same blueprint can serve both development (90 %) and production (75 %) clusters with different tolerances.

    ## Who it's for

    - SRE and platform teams running self-managed Elasticsearch on bare metal, VMs, or Kubernetes.
    - Data engineers ingesting high-throughput event streams where heap pressure directly impacts indexing latency.
    - Operations teams that must keep search query latency within SLA bounds on heap-sensitive workloads.

    ## Why orchestrate this with Kestra

    The built-in Elasticsearch Watcher requires a Platinum license. Prometheus + Alertmanager covers the metric side but requires a running exporter, scrape config, and alert rule in addition to a notifier. Kestra replaces the entire stack with a single declarative YAML that runs authenticated API calls, applies threshold logic, and delivers Slack notifications, with full execution history and zero additional infrastructure.

    ## Prerequisites

    - A running Elasticsearch cluster reachable from the Kestra worker on port 9200.
    - `curl` and `jq` available on the Kestra worker host.
    - A Kestra secret named `ES_PASSWORD` containing the Elasticsearch `elastic` user password.
    - A Kestra secret named `SLACK_WEBHOOK` containing the Slack incoming webhook URL.

    ## Quick start

    1. Add the `ES_PASSWORD` secret in Kestra (Settings → Secrets).
    2. Add the `SLACK_WEBHOOK` secret with your Slack incoming webhook URL.
    3. Set `es_host` to the hostname or IP of your Elasticsearch cluster.
    4. Adjust `heap_threshold_percent` to match your alerting policy (default `85`).
    5. Enable the schedule and run a manual execution to confirm the JVM stats JSON is captured correctly.

    ## How to extend

    - Add a task that calls `/_nodes/hot_threads` for the breaching nodes to capture live thread activity alongside the alert.
    - Trend heap utilization over time by writing the per-node JSON to an S3 key or a time-series database.
    - Combine with the unassigned-shards sentinel to correlate GC pauses with shard allocation failures.
    - Trigger an automatic index force-merge or cache clear via the Elasticsearch API when heap exceeds 90 %.

    ## Links

    - [Elasticsearch Nodes Stats API](https://www.elastic.co/guide/en/elasticsearch/reference/current/cluster-nodes-stats.html)
    - [Elasticsearch JVM and Memory Settings](https://www.elastic.co/guide/en/elasticsearch/reference/current/heap-size.html)
    - [Kestra Shell Commands plugin](https://kestra.io/plugins/plugin-script-shell)
    - [Kestra Slack plugin](https://kestra.io/plugins/plugin-slack)
  tags:
    - Data
    - Infrastructure
  subTags:
    - ELT & Data Landing
    - Day 2 Operations
  ee: false
  demo: false
