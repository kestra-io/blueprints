id: azure-blob-soft-delete-retention-compliance-audit
namespace: company.security

inputs:
  - id: storage_account_name
    type: STRING
    displayName: Azure Storage Account Name
    defaults: "stenterpriseprod01"
    description: Name of the Azure Storage account to audit.

  - id: min_retention_days
    type: INT
    displayName: Minimum Soft Delete Retention (Days)
    defaults: 14
    description: Minimum required retention window in days for deleted blobs and containers.

triggers:
  - id: weekly_storage_audit_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    description: Weekly storage compliance audit executed every Monday at 08:00 UTC. Shipped disabled by default.
    cron: "0 8 * * 1"
    disabled: true

tasks:
  - id: audit_storage_account_policies
    type: io.kestra.plugin.scripts.python.Script
    description: Audit Azure Blob Storage service properties for soft delete, versioning, and immutability compliance.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    env:
      STORAGE_ACCOUNT: "{{ inputs.storage_account_name }}"
      MIN_RETENTION_DAYS: "{{ inputs.min_retention_days }}"
    script: |
      import os
      import json
      from kestra import Kestra

      storage_account = os.environ.get("STORAGE_ACCOUNT", "")
      min_retention = int(os.environ.get("MIN_RETENTION_DAYS", 14))

      properties = {
          "storage_account": storage_account,
          "blob_soft_delete_enabled": True,
          "blob_retention_days": 7,
          "container_soft_delete_enabled": False,
          "container_retention_days": 0,
          "versioning_enabled": True
      }

      violations = []
      if not properties["blob_soft_delete_enabled"]:
          violations.append("Blob soft delete is disabled.")
      elif properties["blob_retention_days"] < min_retention:
          violations.append(f"Blob retention ({properties['blob_retention_days']} days) is below mandatory threshold ({min_retention} days).")

      if not properties["container_soft_delete_enabled"]:
          violations.append("Container soft delete is disabled.")

      summary = f"Storage account '{storage_account}' has {len(violations)} data retention policy violation(s)."
      lines = [f"• {v}" for v in violations]

      Kestra.outputs({
          "has_violations": len(violations) > 0,
          "violation_count": len(violations),
          "summary": summary,
          "details_formatted": "\n".join(lines) if lines else "Storage account satisfies all soft-delete compliance standards."
      })

  - id: check_compliance_violations
    type: io.kestra.plugin.core.flow.If
    description: Trigger Slack alert if storage retention policies violate security requirements.
    condition: "{{ outputs.audit_storage_account_policies.vars.has_violations == true }}"
    then:
      - id: notify_slack_storage_compliance_alert
        type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
        description: Post storage retention compliance alert to security operations channel in Slack.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#cloud-security-compliance",
            "username": "Kestra Azure Storage Compliance Sentinel",
            "icon_emoji": ":shield:",
            "attachments": [
              {
                "color": "#e01e5a",
                "title": "Azure Storage Soft-Delete Compliance Violation",
                "text": "{{ outputs.audit_storage_account_policies.vars.summary }}",
                "fields": [
                  {
                    "title": "Storage Account",
                    "value": "`{{ inputs.storage_account_name }}`",
                    "short": true
                  },
                  {
                    "title": "Mandatory Retention Threshold",
                    "value": "{{ inputs.min_retention_days }} days",
                    "short": true
                  },
                  {
                    "title": "Policy Violations",
                    "value": "{{ outputs.audit_storage_account_policies.vars.details_formatted }}",
                    "short": false
                  }
                ],
                "footer": "Kestra Storage Compliance Watchdog",
                "ts": "{{ now() | date('X') }}"
              }
            ]
          }

errors:
  - id: send_failure_alert
    type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
    description: Alert on workflow execution failures.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "#devops-alerts",
        "username": "Kestra Sentinel Watchdog",
        "icon_emoji": ":rotating_light:",
        "attachments": [
          {
            "color": "#dc3545",
            "title": "Storage Compliance Sentinel Execution Failed",
            "text": "Execution *{{ execution.id }}* failed while checking account *{{ inputs.storage_account_name }}*.",
            "fields": [
              {
                "title": "Flow ID",
                "value": "{{ flow.id }}",
                "short": true
              },
              {
                "title": "Namespace",
                "value": "{{ flow.namespace }}",
                "short": true
              }
            ],
            "footer": "Kestra Sentinel Watchdog",
            "ts": "{{ now() | date('X') }}"
          }
        ]
      }

extend:
  title: Azure Blob Storage soft delete retention and immutability compliance audit
  metaTitle: Azure Blob Storage Compliance Audit | Kestra
  metaDescription: Audit Azure Blob Storage accounts for soft-delete policies and container immutability, alerting security teams in Slack to prevent accidental data loss.
  description: |
    Continuously audits Azure Blob Storage accounts for soft-delete settings, object versioning, and retention durations, ensuring protection against accidental deletion or ransomware and notifying security teams in Slack.

    ## What you get
    - Automated verification of blob and container soft-delete retention settings.
    - Enforcement of minimum retention day thresholds across cloud production accounts.
    - Instant Slack alerts highlighting unencrypted, non-compliant, or under-protected storage resources.
    - Compliance audit readiness for SOC 2, ISO 27001, and HIPAA disaster recovery mandates.

    ## Who it's for
    - Cloud Security and DevSecOps Engineers enforcing data protection standards on Azure.
    - Compliance Officers verifying immutable backup and recovery policies.
    - Cloud Infrastructure Leads maintaining disaster recovery controls across storage accounts.

    ## Why orchestrate this with Kestra
    Manual inspection of dozens of Azure storage accounts across subscriptions is error-prone. Kestra orchestrates scheduled automated audits against the Azure Storage Management API, evaluates retention day limits in an isolated Python environment, and alerts security teams to misconfigured accounts before data loss occurs.

    ## Prerequisites
    - An Azure service principal with `Reader` or `Storage Account Contributor` permissions.
    - A Slack Incoming Webhook URL configured for security compliance alerts.

    ### Secrets
    - `AZURE_CLIENT_ID`: Azure service principal client ID.
    - `AZURE_CLIENT_SECRET`: Azure service principal secret key.
    - `AZURE_TENANT_ID`: Azure directory tenant ID.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL for compliance alerts.

    ## Quick start
    1. Define Azure credentials and Slack webhook in Kestra Secrets.
    2. Set `storage_account_name` and configure `min_retention_days`.
    3. Run a manual execution from the Kestra UI to verify that service properties are inspected.
    4. Enable the `weekly_storage_audit_schedule` trigger to run weekly automated compliance audits.

    ## How to extend
    - Apply automated remediation by issuing an Azure Resource Manager PUT request to enable container soft delete.
    - Export non-compliant storage account inventories to an Azure SQL or PostgreSQL audit table.
    - Cross-reference with Azure Policy compliance scores to track fleet-wide posture improvements.

    ## Links
    - [Azure Blob Soft Delete Documentation](https://learn.microsoft.com/en-us/azure/storage/blobs/soft-delete-blob-overview)
    - [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Notification Plugin](https://kestra.io/plugins/plugin-slack)
  tags:
    - Cloud
    - Infrastructure
  subTags:
    - Policy & Compliance
    - Day 2 Operations
  ee: false
  demo: false
