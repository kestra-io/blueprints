id: poland-vat-whitelist-bank-account-payment-gate
namespace: company.team

description: |
  Gate a Polish payment run on the Ministry of Finance VAT white list (Wykaz podatnikow VAT). Every
  payee is looked up for the transfer date in batches of 30 NIPs, each bank account is matched against
  the accounts published for that payee, and payments over PLN 15,000 to an account that is not on the
  list are held. The register's requestId is kept per payment as proof of the check. Works without an
  API key.

inputs:
  - id: payments
    type: JSON
    description: |
      Payment run to verify, one object per payment with `payment_id`, `payee`, `nip`, `account` (Polish NRB, 26 digits,
      with or without `PL` and spaces), `amount_pln` and optionally `transaction_value_pln` (the whole invoice when it is paid
      in instalments). A Webhook call can send the same array as `payments` in its body. The defaults are SAMPLE payments;
      the NIPs and account numbers are real entries of the live register, picked to show a release, a hold and a data error.
    defaults:
      - {payment_id: PAY-1001, payee: Orange Polska, nip: "526-025-09-95", account: "PL58 1030 1508 0000 0005 0313 1332", amount_pln: 48900.00}
      - {payment_id: PAY-1002, payee: Orlen, nip: "7740001454", account: "30102010260000140203550589", amount_pln: 125000.00}
      - {payment_id: PAY-1003, payee: PKO Bank Polski, nip: "5250007738", account: "17105000861000009030362629", amount_pln: 15000.00}
      - {payment_id: PAY-1004, payee: PKO Bank Polski, nip: "5250007738", account: "50114010100000217063001199", amount_pln: 12000.00, transaction_value_pln: 36000.00}
      - {payment_id: PAY-1005, payee: Jeronimo Martins Polska, nip: "7791011327", account: "38124052821111001080047440", amount_pln: 64200.00}
      - {payment_id: PAY-1006, payee: Jeronimo Martins Polska, nip: "7791011327", account: "38124052821111001080047440", amount_pln: 9800.00}
      - {payment_id: PAY-1007, payee: Payee not on the list, nip: "5272525995", account: "02102010260000110204768299", amount_pln: 22000.00}
      - {payment_id: PAY-1008, payee: Typo in NIP, nip: "1234567890", account: "02102010260000110204768299", amount_pln: 18000.00}
      - {payment_id: PAY-1009, payee: Orange Polska, nip: "5260250995", account: "58103015080000000503131333", amount_pln: 31000.00}

  - id: check_date
    type: DATE
    required: false
    description: Date the register is queried for. Leave empty to use today in Europe/Warsaw, the day the transfer order is sent. The register rejects future dates.

  - id: threshold_pln
    type: FLOAT
    defaults: 15000
    description: Payments whose transaction value exceeds this amount are held when the account is not on the list (Art. 19 of the Polish Entrepreneurs' Law sets PLN 15,000).

  - id: hold_new_accounts
    type: BOOL
    defaults: false
    description: Also hold a listed payment when the account was never used for that payee in an earlier released run (an invoice-fraud signal). When false it is released with a warning.

  - id: state_key
    type: STRING
    defaults: pl_vat_whitelist_ledger
    description: KV key pointing at the Parquet audit ledger. Use one key per paying entity.

triggers:
  - id: payment_run
    type: io.kestra.plugin.core.trigger.Webhook
    key: "{{ secret('PL_WHITELIST_WEBHOOK_KEY') }}"
    description: The ERP or treasury system POSTs `{"payments":[...]}` when a payment run is ready to be sent to the bank.

tasks:
  - id: previous_ledger
    type: io.kestra.plugin.core.kv.Get
    key: "{{ inputs.state_key }}"
    errorOnMissing: false
    description: URI of the Parquet ledger of earlier checks. Missing on the first run, which is the baseline for the new-account check.

  - id: bootstrap
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.previous_ledger.value is not defined or outputs.previous_ledger.value is empty }}"
    then:
      - id: empty_ledger
        type: io.kestra.plugin.jdbc.duckdb.Queries
        url: "jdbc:duckdb:"
        fetchType: NONE
        outputFiles:
          - ledger_parquet
        sql: |
          CREATE TABLE ledger (check_date DATE, payment_id VARCHAR, nip VARCHAR, account VARCHAR, amount_pln DECIMAL(18,2),
            decision VARCHAR, reason VARCHAR, request_id VARCHAR, request_date_time VARCHAR, checked_at TIMESTAMP);
          COPY ledger TO '{{ outputFiles.ledger_parquet }}' (FORMAT PARQUET);

  - id: plan
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: |
      Normalises NIPs and accounts (drops `PL`, spaces and dashes), validates the NIP check digit and the NRB IBAN mod-97
      checksum locally so a typo is caught without spending a request, and splits the distinct valid NIPs into batches of 30,
      the maximum of `search/nips`. The register allows 100 search requests a day, so one run of up to 3,000 payees fits.
    url: "jdbc:duckdb:"
    fetchType: FETCH_ONE
    outputFiles:
      - payments_parquet
    parameters:
      payments: "{{ (trigger.body.payments ?? inputs.payments) | toJson }}"
      check_date: "{{ trigger.body.check_date ?? inputs.check_date ?? (now() | date('yyyy-MM-dd', timeZone='Europe/Warsaw')) }}"
      today: "{{ now() | date('yyyy-MM-dd', timeZone='Europe/Warsaw') }}"
    sql: |
      CREATE MACRO dg(s, i) AS CAST(substr(s, i, 1) AS INTEGER);
      CREATE MACRO nip_ok(n) AS regexp_matches(n, '^[0-9]{10}$') AND
        (6*dg(n,1) + 5*dg(n,2) + 7*dg(n,3) + 2*dg(n,4) + 3*dg(n,5) + 4*dg(n,6) + 5*dg(n,7) + 6*dg(n,8) + 7*dg(n,9)) % 11 = dg(n,10);
      CREATE MACRO nrb_ok(a) AS regexp_matches(a, '^[0-9]{26}$') AND CAST(substr(a, 3) || '2521' || substr(a, 1, 2) AS HUGEINT) % 97 = 1;

      CREATE TABLE date_check AS SELECT CASE WHEN CAST(:check_date AS DATE) > CAST(:today AS DATE)
        THEN error('check_date ' || :check_date || ' is in the future; the register only answers for today or earlier, run the gate on the transfer day.') END AS ok;

      CREATE TABLE raw AS SELECT row_number() OVER () AS line, j FROM (SELECT unnest(from_json(:payments, '["JSON"]')) AS j);

      CREATE TABLE payments AS
      SELECT line,
             coalesce(json_extract_string(j, '$.payment_id'), 'line ' || line) AS payment_id,
             json_extract_string(j, '$.payee') AS payee,
             regexp_replace(upper(coalesce(json_extract_string(j, '$.nip'), '')), '^PL|[ -]', '', 'g') AS nip,
             regexp_replace(upper(coalesce(json_extract_string(j, '$.account'), '')), '^PL|[ -]', '', 'g') AS account,
             TRY_CAST(json_extract_string(j, '$.amount_pln') AS DECIMAL(18,2)) AS amount_pln,
             TRY_CAST(json_extract_string(j, '$.transaction_value_pln') AS DECIMAL(18,2)) AS transaction_value_pln
      FROM raw;

      CREATE TABLE checked AS SELECT *, nip_ok(nip) AS nip_valid, nrb_ok(account) AS account_valid FROM payments;
      COPY checked TO '{{ outputFiles.payments_parquet }}' (FORMAT PARQUET);

      CREATE TABLE batches AS
      SELECT (rn - 1) // 30 AS b, string_agg(nip, ',' ORDER BY nip) AS nips, count(*) AS n
      FROM (SELECT nip, row_number() OVER (ORDER BY nip) AS rn FROM (SELECT DISTINCT nip FROM checked WHERE nip_valid)) GROUP BY b;

      SELECT :check_date AS check_date,
             (SELECT count(*) FROM checked) AS payments,
             (SELECT count(*) FILTER (WHERE NOT nip_valid OR NOT account_valid) FROM checked) AS invalid_rows,
             (SELECT count(*) FROM batches) AS requests,
             (SELECT CASE WHEN count(*) = 0 THEN error('No payment has a valid NIP, nothing to look up.') END FROM batches) AS guard,
             (SELECT CAST(json_group_array(json_object('nips', nips, 'date', :check_date)) AS VARCHAR) FROM batches) AS batches;

  - id: lookup
    type: io.kestra.plugin.core.flow.Loop
    description: One `search/nips` request per batch of up to 30 NIPs, one at a time, as the register blocks clients that query too fast.
    values: "{{ outputs.plan.outputs[0].row.batches }}"
    concurrencyLimit: 1
    tasks:
      - id: search
        type: io.kestra.plugin.core.http.Download
        description: Each NIP comes back as an entry with its subjects (status, accountNumbers, hasVirtualAccounts) or an error such as WL-115; 429 and 5xx are retried.
        uri: "https://wykazpodatnikowvat.mf.gov.pl/api/search/nips/{{ fromJson(item.value).nips }}"
        params:
          date: "{{ fromJson(item.value).date }}"
        headers:
          User-Agent: "kestra-poland-vat-whitelist-payment-gate/1.0 (https://kestra.io)"
          Accept: application/json
        options:
          retryOnStatusCodes: [429, 500, 502, 503, 504]
          retry:
            type: exponential
            interval: PT10S
            maxInterval: PT2M
            maxAttempts: 4
    outputs:
      - id: uri
        type: STRING
        value: "{{ outputs.search.uri }}"

  - id: collect
    type: io.kestra.plugin.core.storage.Concat
    files: "{{ outputs.lookup.outputs | jq('[.[].outputs.uri]') | first }}"
    separator: "\n"
    extension: .json

  - id: decide
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: |
      Matches each payment against the register entry of its NIP and decides RELEASE or HOLD. Over the threshold (the
      larger of the payment and the transaction value, so instalments of a big invoice count), a payee that is not on the
      list, not active or exempt, or an account that is not published is held. Payees with `hasVirtualAccounts` publish
      their virtual account masks only in the flat file, so an unlisted account there is held as "virtual account
      unconfirmed" instead of "not on list". Appends every decision with the batch requestId to the ledger.
    url: "jdbc:duckdb:"
    fetchType: FETCH_ONE
    inputFiles:
      responses.json: "{{ outputs.collect.uri }}"
      payments.parquet: "{{ outputs.plan.outputFiles.payments_parquet }}"
      ledger.parquet: "{{ outputs.previous_ledger.value ?? outputs.empty_ledger.outputFiles.ledger_parquet }}"
    outputFiles:
      - decisions_csv
      - release_csv
      - ledger_parquet
    parameters:
      check_date: "{{ outputs.plan.outputs[0].row.check_date }}"
      threshold: "{{ inputs.threshold_pln }}"
      hold_new_accounts: "{{ inputs.hold_new_accounts }}"
      run_started: "{{ execution.startDate }}"
      execution_url: "{{ kestra.url ?? '' }}/ui/main/executions/{{ flow.namespace }}/{{ flow.id }}/{{ execution.id }}"
    sql: |
      SET TimeZone = 'UTC';
      CREATE TABLE docs AS SELECT json AS doc FROM read_json_objects('responses.json', format = 'unstructured');
      CREATE TABLE entries AS
      SELECT json_extract_string(e, '$.identifier') AS nip,
             json_extract_string(e, '$.subjects[0].name') AS register_name,
             json_extract_string(e, '$.subjects[0].statusVat') AS status_vat,
             coalesce(CAST(json_extract_string(e, '$.subjects[0].hasVirtualAccounts') AS BOOLEAN), false) AS has_virtual,
             coalesce(json_extract_string(e, '$.subjects[*].accountNumbers[*]'), []) AS accounts,
             json_extract_string(e, '$.error.code') || ' ' || json_extract_string(e, '$.error.message') AS api_error,
             json_extract_string(d.doc, '$.result.requestId') AS request_id,
             json_extract_string(d.doc, '$.result.requestDateTime') AS request_date_time
      FROM docs d, unnest(from_json(json_extract(d.doc, '$.result.entries'), '["JSON"]')) AS t(e);

      CREATE TABLE ledger AS SELECT * FROM read_parquet('ledger.parquet');

      CREATE TABLE matched AS
      SELECT p.*, e.register_name, e.status_vat, e.has_virtual, e.api_error, e.request_id, e.request_date_time,
             e.nip IS NOT NULL AND e.status_vat IS NOT NULL AS on_list,
             list_contains(coalesce(e.accounts, []), p.account) AS account_listed,
             greatest(p.amount_pln, coalesce(p.transaction_value_pln, p.amount_pln)) > CAST(:threshold AS DECIMAL(18,2)) AS over_threshold,
             EXISTS (SELECT 1 FROM ledger l WHERE l.nip = p.nip AND l.payment_id <> p.payment_id AND l.decision = 'RELEASE') AND
               NOT EXISTS (SELECT 1 FROM ledger l WHERE l.nip = p.nip AND l.payment_id <> p.payment_id AND l.account = p.account AND l.decision = 'RELEASE') AS new_account
      FROM read_parquet('payments.parquet') p LEFT JOIN entries e ON e.nip = p.nip;

      CREATE TABLE decided AS
      SELECT *, CASE WHEN reason IN ('OK', 'BELOW_THRESHOLD_NOT_LISTED', 'NEW_ACCOUNT_FOR_PAYEE') THEN 'RELEASE' ELSE 'HOLD' END AS decision
      FROM (SELECT *, CASE
          WHEN amount_pln IS NULL OR amount_pln <= 0 THEN 'INVALID_AMOUNT'
          WHEN NOT nip_valid THEN 'INVALID_NIP'
          WHEN NOT account_valid THEN 'INVALID_ACCOUNT'
          WHEN api_error IS NOT NULL THEN 'REGISTER_ERROR'
          WHEN account_listed AND new_account AND CAST(:hold_new_accounts AS BOOLEAN) THEN 'NEW_ACCOUNT_HELD'
          WHEN account_listed AND new_account THEN 'NEW_ACCOUNT_FOR_PAYEE'
          WHEN account_listed THEN 'OK'
          WHEN NOT over_threshold THEN 'BELOW_THRESHOLD_NOT_LISTED'
          WHEN NOT on_list THEN 'PAYEE_NOT_ON_LIST'
          WHEN status_vat NOT IN ('Czynny', 'Zwolniony') THEN 'PAYEE_STATUS_' || upper(status_vat)
          WHEN has_virtual THEN 'VIRTUAL_ACCOUNT_UNCONFIRMED'
          ELSE 'ACCOUNT_NOT_ON_LIST' END AS reason FROM matched);

      COPY (SELECT payment_id, decision, reason, payee, register_name, nip, account, amount_pln, transaction_value_pln, status_vat,
                   has_virtual, api_error, CAST(:check_date AS DATE) AS check_date, request_id, request_date_time
            FROM decided ORDER BY decision, line) TO '{{ outputFiles.decisions_csv }}' (HEADER, DELIMITER ',');
      COPY (SELECT payment_id, payee, nip, account, amount_pln, request_id FROM decided WHERE decision = 'RELEASE' ORDER BY line)
        TO '{{ outputFiles.release_csv }}' (HEADER, DELIMITER ',');
      COPY (SELECT * FROM ledger WHERE NOT (check_date = CAST(:check_date AS DATE) AND payment_id IN (SELECT payment_id FROM decided))
            UNION ALL
            SELECT CAST(:check_date AS DATE), payment_id, nip, account, amount_pln, decision, reason, request_id, request_date_time,
                   CAST(:run_started AS TIMESTAMP) FROM decided) TO '{{ outputFiles.ledger_parquet }}' (FORMAT PARQUET);

      SELECT :check_date AS check_date,
             count(*) AS payments,
             count(*) FILTER (WHERE decision = 'RELEASE') AS released,
             count(*) FILTER (WHERE decision = 'HOLD') AS held,
             coalesce(sum(amount_pln) FILTER (WHERE decision = 'HOLD'), 0) AS held_pln,
             count(*) FILTER (WHERE reason = 'NEW_ACCOUNT_FOR_PAYEE') AS new_account_warnings,
             count(*) FILTER (WHERE reason = 'BELOW_THRESHOLD_NOT_LISTED') AS below_threshold_warnings,
             (SELECT count(*) FROM ledger) = 0 AS is_baseline,
             (SELECT count(*) FROM docs) AS requests,
             (SELECT string_agg(DISTINCT request_id, ', ') FROM entries) AS request_ids,
             coalesce(string_agg(payment_id || ' ' || reason || ' ' || coalesce(payee, nip) || ' PLN ' || amount_pln || ' to ' || account, chr(10) ORDER BY line)
               FILTER (WHERE decision = 'HOLD' OR reason <> 'OK'), '') AS exception_lines,
             CAST(json_object('text', '*VAT white list payment gate* - ' || count(*) FILTER (WHERE decision = 'HOLD') || ' of ' || count(*)
               || ' payment(s) held (PLN ' || coalesce(sum(amount_pln) FILTER (WHERE decision = 'HOLD'), 0) || ') for transfer date ' || :check_date || chr(10)
               || coalesce(string_agg('• `' || payment_id || '` *' || reason || '* ' || coalesce(payee, '') || ' (NIP ' || nip || ') PLN ' || amount_pln
                    || CASE WHEN register_name IS NOT NULL THEN ', register name ' || register_name ELSE '' END,
                    chr(10) ORDER BY line) FILTER (WHERE decision = 'HOLD'), '')
               || chr(10) || 'Execution ' || :execution_url) AS VARCHAR) AS slack_payload
      FROM decided;

  - id: save_ledger
    type: io.kestra.plugin.core.kv.Set
    key: "{{ inputs.state_key }}"
    value: "{{ outputs.decide.outputFiles.ledger_parquet }}"
    description: The ledger is the audit trail (date, account, decision, requestId) the tax office can ask for; keep the executions that wrote it.

  - id: route
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.decide.outputs[0].row.held > 0 }}"
    then:
      - id: notify
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        allowFailure: true
        description: allowFailure keeps the gate result when the webhook is not configured; the holds are still in the log and the CSV.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: "{{ outputs.decide.outputs[0].row.slack_payload }}"
      - id: log_holds
        type: io.kestra.plugin.core.log.Log
        level: WARN
        message: |
          {{ outputs.decide.outputs[0].row.held }} payment(s) held, PLN {{ outputs.decide.outputs[0].row.held_pln }}. Exceptions:
          {{ outputs.decide.outputs[0].row.exception_lines }}
    else:
      - id: all_clear
        type: io.kestra.plugin.core.log.Log
        message: "All {{ outputs.decide.outputs[0].row.payments }} payment(s) can be released.{{ outputs.decide.outputs[0].row.exception_lines is empty ? '' : ' Warnings: ' ~ outputs.decide.outputs[0].row.exception_lines }}"

  - id: summary
    type: io.kestra.plugin.core.log.Log
    message: |
      VAT white list check for {{ outputs.decide.outputs[0].row.check_date }}{{ outputs.decide.outputs[0].row.is_baseline ? ' (BASELINE, empty ledger)' : '' }}: {{ outputs.decide.outputs[0].row.payments }} payments, {{ outputs.decide.outputs[0].row.released }} released, {{ outputs.decide.outputs[0].row.held }} held, {{ outputs.decide.outputs[0].row.new_account_warnings }} new-account and {{ outputs.decide.outputs[0].row.below_threshold_warnings }} below-threshold warnings. {{ outputs.decide.outputs[0].row.requests }} register request(s), requestId {{ outputs.decide.outputs[0].row.request_ids }}.
      Decisions CSV: {{ outputs.decide.outputFiles.decisions_csv }}

outputs:
  - id: summary
    type: JSON
    value: "{{ outputs.decide.outputs[0].row }}"
  - id: decisions_csv
    type: FILE
    value: "{{ outputs.decide.outputFiles.decisions_csv }}"
  - id: release_csv
    type: FILE
    value: "{{ outputs.decide.outputFiles.release_csv }}"

extend:
  title: Gate Polish Payment Runs on the VAT White List with DuckDB and Slack
  metaTitle: Polish VAT White List Bank Account Payment Gate | Kestra
  shortDescription: Check every payee and bank account of a Polish payment run against the Ministry of Finance VAT white list for the transfer date, hold payments over PLN 15,000 to unlisted accounts and keep the register's requestId as proof.
  metaDescription: Verify payees and bank accounts against Poland's VAT white list before a payment run, hold risky transfers over PLN 15,000 and keep the requestId proof.
  description: |
    In Poland a B2B payment over PLN 15,000 to a bank account that is not on the Ministry of Finance VAT white list costs the payer the tax deduction and makes it jointly liable for the payee's VAT. The keyless register API answers for one date, instalments of one invoice count towards the threshold, virtual accounts are not published, and the answer must be kept as proof. This flow checks a whole payment run on the transfer day.

    ## How it works

    1. A `Webhook` trigger receives `{"payments":[...]}` from the ERP; a manual run uses the `payments` input. `previous_ledger` (KV Get) loads the audit ledger, `bootstrap` (If) creates it on the first run.
    2. `plan` (DuckDB) normalises NIPs and accounts, checks the NIP check digit and the IBAN mod-97 checksum locally, refuses a future `check_date` and splits the valid NIPs into batches of 30.
    3. `lookup` (Loop) calls `search/nips/{nips}?date=` once per batch, with retries on 429 and 5xx. Each NIP returns its VAT status, published accounts and `hasVirtualAccounts`, or an error code.
    4. `decide` (DuckDB) applies the threshold to the larger of the payment and `transaction_value_pln`. Over it, a payee not on the list, a status other than `Czynny` (active) or `Zwolniony` (exempt), or an unpublished account is held (`VIRTUAL_ACCOUNT_UNCONFIRMED` when the payee uses virtual accounts). Below it, an unlisted account is released with a warning. A listed account never paid before for that payee is flagged, or held with `hold_new_accounts`.
    5. `save_ledger` (KV Set) stores the Parquet ledger with each decision and `requestId`.
    6. `route` (If) posts holds to Slack and logs them at WARN.

    ## What you get

    - A decisions CSV (reason, register name, status, `requestId`) and a release CSV for the bank file.
    - A ledger that proves each account was checked on the transfer day.
    - One request per 30 payees; typos are caught before any request.
    - An account-change signal against invoice-fraud bank detail swaps.

    The default `payments` are SAMPLE data; the NIPs, names, statuses and account lists come from the live register on each run.

    ## Who it's for

    - Accounts payable, treasury and finance systems teams paying Polish suppliers.

    ## Why orchestrate this with Kestra

    - The Webhook plugs the check into the payment workflow; HTTP retries handle throttling.
    - The KV ledger keeps the audit trail without a database, and Slack `allowFailure` keeps the gate result without a webhook.

    ## Prerequisites

    - Kestra 2.0 with the DuckDB and Slack plugins, HTTPS to `wykazpodatnikowvat.mf.gov.pl`. No API key; 100 search requests (30 NIPs each) per day.

    ### Secrets

    - `PL_WHITELIST_WEBHOOK_KEY`: key of the Webhook URL the ERP calls (required for the trigger).
    - `SLACK_WEBHOOK_URL`: Slack incoming webhook for held payments (optional).

    ## Quick start

    1. Click **Execute** with the defaults: 4 payments are released (1 with a below-threshold warning) and 5 held (unlisted account on an instalment, unconfirmed virtual account, payee not on the list, invalid NIP, invalid account).
    2. Execute with Orlen paid to another of its listed accounts to see `NEW_ACCOUNT_FOR_PAYEE`, then set `hold_new_accounts`.
    3. Add the secrets and point your ERP at the Webhook URL.

    ## How to extend

    - Confirm `VIRTUAL_ACCOUNT_UNCONFIRMED` holds against the virtual account masks in the daily flat file.
    - Start the bank file export as a subflow with the release CSV.
    - Draft a ZAW-NR notification for payments released despite a hold.

    ## Links

    - [Webhook trigger](https://kestra.io/plugins/core/trigger/io.kestra.plugin.core.trigger.webhook) and [Loop](https://kestra.io/plugins/core/flow/io.kestra.plugin.core.flow.loop)
    - [DuckDB Queries](https://kestra.io/plugins/plugin-jdbc-duckdb/io.kestra.plugin.jdbc.duckdb.queries) and [Slack Incoming Webhook](https://kestra.io/plugins/plugin-notifications/slack/io.kestra.plugin.slack.notifications.slackincomingwebhook)
    - [VAT white list API documentation](https://wykazpodatnikowvat.mf.gov.pl/api/) and [API description and limits (KAS)](https://www.gov.pl/web/kas/api-wykazu-podatnikow-vat)
  tags:
    - Business
  subTags:
    - Approval Gates
    - Policy & Compliance
  ee: false
  demo: false
