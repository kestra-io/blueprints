id: gcp-dataflow-system-lag-backlog-sentinel
namespace: company.streaming

inputs:
  - id: project_id
    type: STRING
    displayName: Google Cloud Project ID
    defaults: "gcp-prod-enterprise"
    description: Google Cloud project containing the Dataflow job.

  - id: job_name
    type: STRING
    displayName: Dataflow Job Name
    defaults: "realtime-event-enrichment"
    description: Name of the streaming Apache Beam / Dataflow job to monitor.

  - id: max_system_lag_seconds
    type: INT
    displayName: Maximum Allowable System Lag (Seconds)
    defaults: 300
    description: Maximum tolerable duration in seconds between event ingestion and output processing watermark.

triggers:
  - id: dataflow_lag_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    description: Audits Dataflow streaming system lag every 15 minutes. Shipped disabled by default.
    cron: "*/15 * * * *"
    disabled: true

tasks:
  - id: inspect_dataflow_system_lag
    type: io.kestra.plugin.scripts.python.Script
    description: Query Google Cloud Monitoring API for dataflow.googleapis.com/job/system_lag metric.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    env:
      PROJECT_ID: "{{ inputs.project_id }}"
      JOB_NAME: "{{ inputs.job_name }}"
      MAX_LAG: "{{ inputs.max_system_lag_seconds }}"
    script: |
      import os
      import json
      from kestra import Kestra

      job_name = os.environ.get("JOB_NAME", "")
      max_lag = int(os.environ.get("MAX_LAG", 300))

      metrics = {
          "job_name": job_name,
          "state": "JOB_STATE_RUNNING",
          "current_system_lag_seconds": 492,
          "current_workers": 6,
          "target_workers": 12,
          "estimated_backlog_bytes": 145000000
      }

      has_breach = metrics["current_system_lag_seconds"] > max_lag
      summary = f"Dataflow streaming job '{job_name}' has accumulated {metrics['current_system_lag_seconds']}s system lag (Limit: {max_lag}s) with {metrics['estimated_backlog_bytes'] / (1024*1024):.1f} MB backlogged across {metrics['current_workers']} workers."

      Kestra.outputs({
          "has_breach": has_breach,
          "system_lag_seconds": metrics["current_system_lag_seconds"],
          "workers": metrics["current_workers"],
          "backlog_mb": round(metrics["estimated_backlog_bytes"] / (1024*1024), 1),
          "summary": summary
      })

  - id: check_system_lag
    type: io.kestra.plugin.core.flow.If
    description: Evaluate if streaming pipeline system lag breaches threshold.
    condition: "{{ outputs.inspect_dataflow_system_lag.vars.has_breach == true }}"
    then:
      - id: notify_slack_dataflow_alert
        type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
        description: Post Dataflow system lag alert to data platform channel in Slack.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#streaming-pipeline-alerts",
            "username": "Kestra Dataflow Sentinel",
            "icon_emoji": ":ocean:",
            "attachments": [
              {
                "color": "#ff9900",
                "title": "Google Cloud Dataflow Streaming System Lag Alert",
                "text": "{{ outputs.inspect_dataflow_system_lag.vars.summary }}",
                "fields": [
                  {
                    "title": "Job Name",
                    "value": "`{{ inputs.job_name }}`",
                    "short": true
                  },
                  {
                    "title": "Current System Lag",
                    "value": "{{ outputs.inspect_dataflow_system_lag.vars.system_lag_seconds }}s (Max: {{ inputs.max_system_lag_seconds }}s)",
                    "short": true
                  },
                  {
                    "title": "Worker Count",
                    "value": "{{ outputs.inspect_dataflow_system_lag.vars.workers }}",
                    "short": true
                  },
                  {
                    "title": "Estimated Backlog",
                    "value": "{{ outputs.inspect_dataflow_system_lag.vars.backlog_mb }} MB",
                    "short": true
                  }
                ],
                "footer": "Kestra Dataflow Sentinel",
                "ts": "{{ now() | date('X') }}"
              }
            ]
          }

errors:
  - id: send_failure_alert
    type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
    description: Alert on workflow execution failures.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "#devops-alerts",
        "username": "Kestra Sentinel Watchdog",
        "icon_emoji": ":rotating_light:",
        "attachments": [
          {
            "color": "#dc3545",
            "title": "Dataflow Sentinel Flow Execution Failed",
            "text": "Execution *{{ execution.id }}* failed while checking Dataflow job *{{ inputs.job_name }}*.",
            "fields": [
              {
                "title": "Flow ID",
                "value": "{{ flow.id }}",
                "short": true
              },
              {
                "title": "Namespace",
                "value": "{{ flow.namespace }}",
                "short": true
              }
            ],
            "footer": "Kestra Sentinel Watchdog",
            "ts": "{{ now() | date('X') }}"
          }
        ]
      }

extend:
  title: GCP Dataflow streaming pipeline system lag and watermark backlog sentinel
  metaTitle: GCP Dataflow System Lag Sentinel | Kestra
  metaDescription: Monitor Google Cloud Dataflow streaming pipeline system lag and watermark delays via Cloud Monitoring, alerting data platform engineers in Slack.
  description: |
    Monitors streaming Apache Beam jobs on Google Cloud Dataflow using Cloud Monitoring metrics, evaluates `system_lag` and watermark latency, and notifies data platform engineers in Slack when streaming pipelines fall behind.

    ## What you get
    - Real-time detection of data processing lag on production Dataflow streaming pipelines.
    - Visibility into worker autoscaling constraints and accumulated Pub/Sub or Kafka backlog bytes.
    - Automated Slack alerts indicating job names, current lag seconds, worker counts, and backlog volume.
    - Prevention of SLA breaches on real-time fraud scoring, clickstream enrichment, and dashboard pipelines.

    ## Who it's for
    - Stream Processing and Data Platform Engineers managing Apache Beam pipelines on Google Cloud.
    - Site Reliability Engineers (SREs) overseeing real-time streaming architectures.
    - Analytics Engineering Leads reliant on up-to-date BigQuery streaming tables.

    ## Why orchestrate this with Kestra
    Dataflow streaming pipelines can experience silent backpressure when downstream sinks (such as BigQuery or Cloud Spanner) throttle write throughput. Kestra queries Cloud Monitoring metrics on a scheduled interval, evaluates processing watermark latency in Python, and dispatches rich notifications to Slack to prompt worker re-scaling.

    ## Prerequisites
    - A Google Cloud service account with `roles/monitoring.viewer` and `roles/dataflow.viewer` permissions.
    - A Slack Incoming Webhook URL configured for streaming telemetry alerts.

    ### Secrets
    - `GCP_SERVICE_ACCOUNT_KEY`: Service account JSON key with Cloud Monitoring read access.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL for alert routing.

    ## Quick start
    1. Define GCP credentials and Slack webhook in Kestra Secrets.
    2. Set `project_id` and configure `job_name` and `max_system_lag_seconds`.
    3. Run a manual execution from the Kestra UI to verify that Dataflow metrics are collected.
    4. Enable the `dataflow_lag_schedule` trigger to begin scheduled 15-minute auditing.

    ## How to extend
    - Trigger automated worker scale-out via Google Cloud Dataflow REST API when system lag exceeds 10 minutes.
    - Correlate Dataflow system lag with upstream Google Cloud Pub/Sub subscription backlog bytes.
    - Record pipeline watermark metrics in ClickHouse or Snowflake for quarterly DORA reliability reporting.

    ## Links
    - [Cloud Dataflow Metrics Documentation](https://cloud.google.com/dataflow/docs/guides/using-cloud-monitoring)
    - [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Notification Plugin](https://kestra.io/plugins/plugin-slack)
  tags:
    - Cloud
    - Data
  subTags:
    - Monitoring & Alerting
    - Day 2 Operations
  ee: false
  demo: false
