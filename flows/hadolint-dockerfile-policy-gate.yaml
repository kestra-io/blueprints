id: hadolint-dockerfile-policy-gate
namespace: company.team
description: |
  Dockerfiles that carry policy violations, a floating latest tag, a root
  final user, unpinned apt packages, merge with nothing standing in the way,
  and the damage surfaces later as drifted production rebuilds. This flow
  starts when CI POSTs that a pull request was opened, lints the Dockerfile
  with hadolint inside its official container, grades every finding by
  severity against a configured fail level, and escalates a failing or
  unparsable report to a GitHub issue and a Slack alert while a clean run
  logs the all-clear. The verdict, the per-severity counts, the rule codes,
  and the raw report URI are published as flow outputs that any merge gate
  downstream can consume.

triggers:
  - id: pull_request_opened
    type: io.kestra.plugin.core.trigger.Webhook
    description: CI POSTs here when a pull request touches a Dockerfile, carrying the repository full name and PR number as webhook inputs.
    key: "{{ secret('HADOLINT_WEBHOOK_KEY') }}"
    inputs:
      github_repository: "{{ trigger.body.repository.full_name ?? 'your-org/container-images' }}"
      pull_request: "{{ trigger.body.pull_request.number ?? '412' }}"
  - id: nightly_policy_sweep
    type: io.kestra.plugin.core.trigger.Schedule
    description: Disabled nightly sweep that re-lints the bundled Dockerfile, a rehearsal net that stays dark until an operator switches it on.
    cron: "0 3 * * *"
    disabled: true

inputs:
  - id: github_repository
    type: STRING
    defaults: your-org/container-images
    description: Repository in owner/repo form that receives the failure issue when the gate trips.
  - id: pull_request
    type: STRING
    defaults: "412"
    description: Pull request number carried into the issue title, the issue body, and the Slack message.
  - id: fail_on_level
    type: STRING
    defaults: info
    description: Lowest severity that fails the gate (error, warning, info, or style), defaulting to the same threshold hadolint itself ships with.

tasks:
  # --- 1. lint the Dockerfile in the hadolint container ---
  - id: lint_workspace
    type: io.kestra.plugin.core.flow.WorkingDirectory
    description: One shared directory so the JSON report the linter writes and the parser that grades it read the same file.
    tasks:
      - id: run_hadolint
        type: io.kestra.plugin.scripts.shell.Commands
        description: Write the Dockerfile under review with a heredoc, run hadolint with JSON output, and absorb the tool exit code so only the parsed verdict below can fail the gate.
        taskRunner:
          type: io.kestra.plugin.scripts.runner.docker.Docker
          entryPoint: []
        containerImage: hadolint/hadolint:latest-alpine
        env:
          PR_NUMBER: "{{ inputs.pull_request }}"
        outputFiles:
          - hadolint-report.json
        commands:
          - |
            set -u
            cat > Dockerfile <<'DOCKERFILE'
            FROM ubuntu:latest
            MAINTAINER platform-team@example.com
            RUN apt-get update && apt-get install -y curl
            USER root
            ADD config.yml /etc/app/config.yml
            COPY dist/ /app/
            EXPOSE 8080
            CMD ["/app/entrypoint.sh"]
            DOCKERFILE

            if ! command -v hadolint > /dev/null 2>&1; then
              echo "hadolint is missing from the container image" >&2
              exit 1
            fi

            echo "linting the Dockerfile for pull request ${PR_NUMBER}"
            hadolint --format json Dockerfile > hadolint-report.json || true

            if [ ! -s hadolint-report.json ]; then
              echo "[]" > hadolint-report.json
              echo "hadolint returned no findings, recording an empty report"
            fi

            echo "report bytes $(wc -c < hadolint-report.json)"

      - id: parse_report
        type: io.kestra.plugin.scripts.python.Script
        description: Grade every finding against the fail level, count style, info, warning, and error hits, and emit the verdict through the outputs protocol.
        taskRunner:
          type: io.kestra.plugin.scripts.runner.docker.Docker
        containerImage: python:3.12-slim
        env:
          FAIL_ON_LEVEL: "{{ inputs.fail_on_level }}"
          PULL_REQUEST: "{{ inputs.pull_request }}"
          GITHUB_REPOSITORY: "{{ inputs.github_repository }}"
        script: |
          import json
          import os

          RANK = {"style": 0, "info": 1, "warning": 2, "error": 3}
          FALLBACK_LEVEL = {
              "DL3000": "error", "DL3002": "warning", "DL3006": "warning",
              "DL3007": "warning", "DL3008": "warning", "DL3009": "info",
              "DL3015": "info", "DL3020": "error", "DL4000": "error",
              "SC2086": "info",
          }
          ALIASES = {"warn": "warning", "err": "error", "failure": "error", "hint": "info"}

          def norm_level(value):
              level = str(value or "").strip().lower()
              level = ALIASES.get(level, level)
              return level if level in RANK else None

          fail_on = norm_level(os.environ.get("FAIL_ON_LEVEL")) or "info"
          report_path = "hadolint-report.json"
          findings = []
          parse_error = ""

          if not os.path.exists(report_path):
              parse_error = "hadolint report file is missing"
          elif os.path.getsize(report_path) == 0:
              parse_error = "hadolint report file is empty"
          else:
              with open(report_path, "r") as handle:
                  raw = handle.read()
              try:
                  doc = json.loads(raw)
              except ValueError as exc:
                  parse_error = "hadolint report is not valid JSON (%s)" % exc
              else:
                  if isinstance(doc, dict):
                      doc = doc.get("findings") or doc.get("results") or []
                  if not isinstance(doc, list):
                      parse_error = "hadolint report is neither a JSON array nor an object with a findings list"
                  elif any(not isinstance(entry, dict) for entry in doc):
                      parse_error = "hadolint report contains entries that are not objects"
                  else:
                      findings = doc

          counts = {"style": 0, "info": 0, "warning": 0, "error": 0}
          rule_codes = []
          for entry in findings:
              code = str(entry.get("code") or entry.get("rule") or "UNKNOWN")
              level = (norm_level(entry.get("level"))
                       or norm_level(entry.get("severity"))
                       or FALLBACK_LEVEL.get(code, "info"))
              counts[level] += 1
              if code not in rule_codes:
                  rule_codes.append(code)

          threshold = RANK[fail_on]
          over_threshold = sum(count for level, count in counts.items() if RANK[level] >= threshold)
          if parse_error:
              verdict = "SCAN_ERROR"
          elif over_threshold > 0:
              verdict = "FAIL"
          else:
              verdict = "PASS"

          pull_request = os.environ.get("PULL_REQUEST", "")
          payload = {"outputs": {
              "verdict": verdict,
              "error_count": counts["error"],
              "warning_count": counts["warning"],
              "info_count": counts["info"] + counts["style"],
              "total_findings": len(findings),
              "rule_codes": sorted(rule_codes),
              "fail_on_level": fail_on,
              "parse_error": parse_error,
              "repository": os.environ.get("GITHUB_REPOSITORY", ""),
              "pull_request": pull_request,
          }}
          print("hadolint %s for PR %s with %d finding(s) at fail level %s" % (
              verdict, pull_request, len(findings), fail_on))
          print("::" + json.dumps(payload) + "::")

  # --- 2. severity gate and escalation ---
  - id: gate_on_severity
    type: io.kestra.plugin.core.flow.If
    description: Escalate any Dockerfile whose findings reach the fail level or whose report could not be parsed, and record the all-clear otherwise.
    condition: "{{ outputs.parse_report.vars.verdict != 'PASS' }}"
    then:
      - id: open_dockerfile_issue
        type: io.kestra.plugin.github.issues.Create
        description: Open a labeled issue carrying the counts and every rule code so the fix lands in the backlog the team already works.
        jwtToken: "{{ secret('GITHUB_TOKEN') }}"
        repository: "{{ inputs.github_repository }}"
        title: "hadolint gate failed for PR #{{ inputs.pull_request }}"
        body: |
          ## hadolint Dockerfile policy gate

          Pull request **#{{ inputs.pull_request }}** in `{{ inputs.github_repository }}` lints as **{{ outputs.parse_report.vars.verdict }}** at fail level `{{ inputs.fail_on_level }}`.

          Counts: **{{ outputs.parse_report.vars.error_count }} error**, **{{ outputs.parse_report.vars.warning_count }} warning**, **{{ outputs.parse_report.vars.info_count }} info/style** findings out of {{ outputs.parse_report.vars.total_findings }}.

          Rule codes hit: `{{ outputs.parse_report.vars.rule_codes | toJson }}`

          Raw report: `{{ outputs.run_hadolint.outputFiles['hadolint-report.json'] }}`

          Execution {{ execution.id }}

          Pin the base image tag, pin the apt packages, swap ADD for COPY, drop MAINTAINER, run the final stage as a non-root user, then close this issue once hadolint reports clean.
        labels:
          - dockerfile
          - hadolint
          - policy-gate
      - id: alert_slack
        type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
        description: Tell the platform channel which verdict the gate reached and how many errors the Dockerfile carries.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "Dockerfile gate {{ outputs.parse_report.vars.verdict }} for PR #{{ inputs.pull_request }} in {{ inputs.github_repository }} - {{ outputs.parse_report.vars.error_count }} error, {{ outputs.parse_report.vars.warning_count }} warning, {{ outputs.parse_report.vars.info_count }} info/style finding(s) at fail level {{ inputs.fail_on_level }}. An issue is waiting in {{ inputs.github_repository }}. Execution {{ execution.id }}."
          }
    else:
      - id: log_clean
        type: io.kestra.plugin.core.log.Log
        description: Record the clean lint so the execution history doubles as merge evidence.
        message: "hadolint clean for PR #{{ inputs.pull_request }} in {{ inputs.github_repository }} at fail level {{ inputs.fail_on_level }}."

errors:
  - id: notify_failure
    type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
    description: Escalate any failure to the ops channel with the execution url.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {"text": "FAILED: {{ flow.id }} {{ execution.id }}"}

outputs:
  - id: verdict
    type: STRING
    value: "{{ outputs.parse_report.vars.verdict }}"
  - id: error_count
    type: INT
    value: "{{ outputs.parse_report.vars.error_count }}"
  - id: warning_count
    type: INT
    value: "{{ outputs.parse_report.vars.warning_count }}"
  - id: rule_codes
    type: ARRAY
    value: "{{ outputs.parse_report.vars.rule_codes | toJson }}"
  - id: report_uri
    type: STRING
    value: "{{ outputs.run_hadolint.outputFiles['hadolint-report.json'] }}"

extend:
  title: Gate Pull Request Merges on hadolint Dockerfile Violations
  metaTitle: hadolint Dockerfile Policy Gate for Pull Requests
  shortDescription: Run hadolint on every opened pull request, grade each finding by severity, and turn a failing Dockerfile into a GitHub issue and a Slack alert.
  metaDescription: Lint opened pull request Dockerfiles with hadolint, grade findings by severity, and escalate with a GitHub issue and a Slack alert.
  description: |
    ## How it works

    1. `pull_request_opened` (`io.kestra.plugin.core.trigger.Webhook`, keyed with `HADOLINT_WEBHOOK_KEY`) accepts the CI notification for an opened pull request and maps `repository.full_name` and `pull_request.number` from the payload onto the flow inputs, so the issue lands in the right repository without a second configuration. `nightly_policy_sweep` (`io.kestra.plugin.core.trigger.Schedule`, cron `0 3 * * *`) ships with `disabled: true`, a rehearsal net that stays dark until an operator switches it on.
    2. `lint_workspace` (`io.kestra.plugin.core.flow.WorkingDirectory`) opens one shared directory so the report the linter writes and the parser that grades it read the same file, a scratch directory outside a `WorkingDirectory` is purged between tasks and would break that hand-off.
    3. `run_hadolint` (`io.kestra.plugin.scripts.shell.Commands` on the `io.kestra.plugin.scripts.runner.docker.Docker` runner, image `hadolint/hadolint:latest-alpine`, the tag that ships a shell while the default tag is built `FROM scratch`) writes the Dockerfile under review with a heredoc, checks that the linter binary is actually present, then runs `hadolint --format json Dockerfile > hadolint-report.json || true`. The `|| true` absorbs hadolint's nonzero exit on findings so only the parsed verdict below can fail the gate, while a container missing the binary exits nonzero and lands in the `errors` alert instead of reading as a clean lint.
    4. `parse_report` (`io.kestra.plugin.scripts.python.Script` on `python:3.12-slim`) reads the JSON report, prefers the `level` each finding carries and falls back to a per-rule severity table, counts style, info, warning, and error findings, and grades the totals against the `fail_on_level` input. An unreadable or missing report becomes `SCAN_ERROR`, so a broken linter never reads as a passing Dockerfile.
    5. `gate_on_severity` (`io.kestra.plugin.core.flow.If`) branches when `verdict` is anything but `PASS`. Failing runs open `open_dockerfile_issue` (`io.kestra.plugin.github.issues.Create`) with the counts and rule codes, then `alert_slack` (`io.kestra.plugin.notifications.slack.SlackIncomingWebhook`) posts the summary; clean runs record `log_clean` so the execution history doubles as merge evidence.
    6. The `errors` block posts to Slack when the container or the parser itself breaks, because a dead gate looks exactly like a passing one.

    ## What you get

    - A gateable verdict, `verdict`, `error_count`, `warning_count`, `rule_codes`, and `report_uri` are flow outputs the merge pipeline can branch on.
    - A GitHub issue that names the pull request, the repository, the per-severity counts, and every rule code that fired, labeled for the platform backlog.
    - A Slack message with the verdict and the counts, so nobody opens the execution just to learn why CI went red.
    - The raw hadolint JSON kept in internal storage as lint evidence next to the pull request.

    ## Who it's for

    - Platform teams that own base images and want Dockerfile standards enforced before merge instead of in a post-merge sweep.
    - Security engineers who treat an unpinned package, a root final user, or a floating tag as a policy violation rather than a style opinion.
    - CI maintainers who want the linter version pinned in a flow file instead of scattered across pipeline scripts.

    ## Why orchestrate this with Kestra

    A lint script bolted onto a pipeline runs only where someone remembered to call it, hides its tool version in an image tag nobody reviews, and drops its findings into a log nobody reads. Kestra wraps the same hadolint run in a keyed webhook plus a disabled nightly schedule, pins the linter image in a versioned file, turns the parsed result into a branch that files an issue and pings Slack, and keeps execution history with the raw report attached, so the gate itself is auditable and can be retargeted at another repository through inputs alone.

    ## Prerequisites

    - A worker with Docker access, both the linter and the parser run in containers.
    - A GitHub token that can open issues in `github_repository` (classic PAT scope `repo`, or fine-grained Issues: write).
    - A Slack incoming webhook for the gate alert and for the failure alert.
    - A CI job that POSTs to the webhook when a pull request touches a Dockerfile.

    ### Secrets

    - `HADOLINT_WEBHOOK_KEY`: key segment guarding the webhook URL, anyone holding it can start the gate.
    - `GITHUB_TOKEN`: token used by `open_dockerfile_issue` to open the failure issue.
    - `SLACK_WEBHOOK_URL`: Slack incoming webhook URL used by `alert_slack` and by the `errors` block.

    ## Quick start

    1. Add the three secrets to the Kestra namespace and point `github_repository` at a repository where issues are welcome.
    2. Run the flow once with the default inputs. The bundled Dockerfile carries a latest tag, a MAINTAINER line, an unpinned apt-get install, a root final user, and an ADD of a plain file, so expect `verdict: FAIL`, an issue in `github_repository`, and a message in Slack.
    3. Fix the heredoc Dockerfile down to a pinned, non-root build (pin the apt packages, swap ADD for COPY, drop MAINTAINER) and re-run, expecting `verdict: PASS` and the `log_clean` branch.
    4. Point your CI webhook at `/api/v1/{tenant}/executions/webhook/{namespace}/hadolint-dockerfile-policy-gate/{HADOLINT_WEBHOOK_KEY}` and POST `{"repository": {"full_name": "your-org/container-images"}, "pull_request": {"number": 412}}` to watch both inputs flow through into the issue.
    5. Enable `nightly_policy_sweep` if you also want a nightly rehearsal of the gate against the bundled Dockerfile.

    ## How to extend

    - Replace the heredoc with `io.kestra.plugin.git.Clone` so the gate lints the real checkout from the pull request branch instead of the bundled fixture.
    - Fan out over every Dockerfile in the repository with `io.kestra.plugin.core.flow.Loop`, one hadolint run per file, then merge the counts before `gate_on_severity`.
    - Tighten `FALLBACK_LEVEL` inside `parse_report`, or raise `fail_on_level` to `error`, so only the worst findings block a merge.
    - Land the findings in a warehouse table with a JDBC query task to trend violations per team, release over release.

    ## Links

    - [hadolint](https://github.com/hadolint/hadolint)
    - [hadolint rules reference](https://github.com/hadolint/hadolint/wiki/Rules)
    - [Kestra Docker task runner](https://kestra.io/plugins/plugin-scripts-docker)
    - [Kestra GitHub plugin](https://kestra.io/plugins/plugin-github)
    - [Kestra Slack plugin](https://kestra.io/plugins/plugin-slack)
  tags:
    - Infrastructure
  subTags:
    - testing & quality
    - ci/cd & deployment
  ee: false
  demo: false
