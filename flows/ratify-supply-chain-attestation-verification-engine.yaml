id: ratify-supply-chain-attestation-verification-engine
namespace: company.security

description: |
  Audits CNCF Ratify verification engine metrics, detects unsigned OCI container images or missing SBOM attestations, coordinates human-in-the-loop SecOps signoff, executes automated workload isolation, and verifies zero-trust enforcement.

concurrency:
  limit: 1

inputs:
  - id: ratify_metrics_endpoint
    type: STRING
    displayName: "Ratify Metrics Endpoint"
    defaults: "http://ratify.ratify-service.svc.cluster.local:8888/metrics"
    description: "Internal Kubernetes HTTP endpoint exposing Prometheus metrics from the CNCF Ratify supply chain verification service."

  - id: max_allowable_verification_failures
    type: INT
    displayName: "Max Allowable Verification Failures"
    defaults: 0
    description: "Maximum allowable artifact signature or attestation verification failures before triggering an incident gate."

  - id: max_allowable_untrusted_artifacts
    type: INT
    displayName: "Max Allowable Untrusted Artifacts"
    defaults: 0
    description: "Maximum allowable untrusted or unsigned OCI container artifacts permitted before enforcing zero-trust quarantine."

  - id: target_namespace
    type: STRING
    displayName: "Monitored Application Namespace"
    defaults: "production-apps"
    description: "Kubernetes namespace housing container workloads evaluated by Ratify admission verifiers."

tasks:
  - id: fetch_ratify_telemetry
    type: io.kestra.plugin.core.http.Request
    description: "Queries the Ratify Prometheus metrics endpoint on Kubernetes to retrieve verification telemetry."
    uri: "{{ inputs.ratify_metrics_endpoint }}"
    method: GET
    headers:
      Accept: "text/plain"
      User-Agent: "Kestra-Ratify-Engine/1.0"
    timeout: PT15S

  - id: evaluate_supply_chain_posture
    type: io.kestra.plugin.scripts.python.Script
    description: "Parses signature and attestation verification metrics and builds a structured supply chain audit report."
    warningOnStdErr: false
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    env:
      RAW_TELEMETRY: "{{ outputs.fetch_ratify_telemetry.body }}"
      MAX_FAILURES: "{{ inputs.max_allowable_verification_failures }}"
      MAX_UNTRUSTED: "{{ inputs.max_allowable_untrusted_artifacts }}"
      NAMESPACE: "{{ inputs.target_namespace }}"
    script: |
      import os
      import sys
      import json
      import datetime

      raw_content = os.environ.get("RAW_TELEMETRY", "").strip()
      max_failures = int(os.environ.get("MAX_FAILURES", "0"))
      max_untrusted = int(os.environ.get("MAX_UNTRUSTED", "0"))
      namespace = os.environ.get("NAMESPACE", "default")

      if not raw_content:
          print("CRITICAL: Received empty metrics payload from Ratify endpoint.", file=sys.stderr)
          sys.exit(1)

      verification_requests = 0
      verification_failures = 0
      untrusted_artifacts = 0
      peak_verification_latency_ms = 0.0
      parsed_metrics = 0

      for line in raw_content.splitlines():
          line = line.strip()
          if not line or line.startswith("#"):
              continue

          parts = line.split()
          if len(parts) != 2:
              continue

          metric_name, metric_value = parts[0], parts[1]
          try:
              val = float(metric_value)
              parsed_metrics += 1
          except ValueError:
              continue

          if "ratify_verification_requests_total" in metric_name or "ratify_verify_count_total" in metric_name:
              verification_requests += int(val)
          elif "ratify_verification_failures_total" in metric_name or "ratify_verify_failure_total" in metric_name:
              verification_failures += int(val)
          elif "ratify_untrusted_artifacts_count" in metric_name or "ratify_untrusted_total" in metric_name:
              untrusted_artifacts += int(val)
          elif "ratify_signature_verification_duration_seconds" in metric_name:
              peak_verification_latency_ms = max(peak_verification_latency_ms, val * 1000.0)

      if parsed_metrics == 0:
          print("CRITICAL: Failed to parse valid metrics from Ratify Prometheus payload.", file=sys.stderr)
          sys.exit(1)

      needs_remediation = (verification_failures > max_failures) or (untrusted_artifacts > max_untrusted)
      status = "VIOLATION_DETECTED" if needs_remediation else "VERIFIED"
      timestamp = datetime.datetime.now(datetime.timezone.utc).isoformat()

      print(f"Ratify Verification Status: {status}")
      print(f"Total Verification Requests: {verification_requests}")
      print(f"Verification Failures: {verification_failures} (Threshold: {max_failures})")
      print(f"Untrusted Artifacts: {untrusted_artifacts} (Threshold: {max_untrusted})")
      print(f"Peak Verification Latency: {peak_verification_latency_ms:.2f} ms")

      summary = (
          f"Ratify supply chain audit for namespace '{namespace}': Status {status}. "
          f"Requests: {verification_requests}, Failures: {verification_failures}, Untrusted: {untrusted_artifacts}."
      )

      manifest = {
          "timestamp": timestamp,
          "namespace": namespace,
          "status": status,
          "verification_requests": verification_requests,
          "verification_failures": verification_failures,
          "untrusted_artifacts": untrusted_artifacts,
          "peak_verification_latency_ms": peak_verification_latency_ms,
          "needs_remediation": needs_remediation
      }

      from kestra import Kestra
      Kestra.outputs({
          "status": status,
          "verification_requests": verification_requests,
          "verification_failures": verification_failures,
          "untrusted_artifacts": untrusted_artifacts,
          "peak_verification_latency_ms": peak_verification_latency_ms,
          "needs_remediation": needs_remediation,
          "timestamp": timestamp,
          "summary": summary,
          "manifest_json": json.dumps(manifest, indent=2)
      })

  - id: persist_attestation_manifest
    type: io.kestra.plugin.core.storage.Write
    description: "Persists the structured supply chain audit manifest into Kestra internal storage."
    content: "{{ outputs.evaluate_supply_chain_posture.vars.manifest_json }}"
    extension: ".json"

  - id: evaluate_quarantine_requirement
    type: io.kestra.plugin.core.flow.If
    description: "Evaluates whether supply chain verification breaches require human signoff and automated workload isolation."
    condition: "{{ outputs.evaluate_supply_chain_posture.vars.needs_remediation }}"
    then:
      - id: notify_approval_required
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: "Alerts SecOps that untrusted container artifacts breach zero-trust admission policies."
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "*CNCF Ratify Supply Chain Security Signoff Required*\n*Namespace:* `{{ inputs.target_namespace }}`\n*Status:* {{ outputs.evaluate_supply_chain_posture.vars.status }}\n*Verification Failures:* {{ outputs.evaluate_supply_chain_posture.vars.verification_failures }} (Threshold: {{ inputs.max_allowable_verification_failures }})\n*Untrusted Artifacts:* {{ outputs.evaluate_supply_chain_posture.vars.untrusted_artifacts }} (Threshold: {{ inputs.max_allowable_untrusted_artifacts }})\n*Audit Manifest:* {{ outputs.persist_attestation_manifest.uri }}\n*Action:* Resume execution `{{ execution.id }}` in Kestra UI to approve automated workload network isolation."
          }

      - id: await_secops_approval
        type: io.kestra.plugin.core.flow.Pause
        description: "Pauses workflow execution until an authorized SecOps engineer reviews and signs off on the workload isolation."
        pauseDuration: PT2H
        behavior: FAIL
        onResume:
          - id: approved
            type: BOOL
            defaults: false
            description: "Set to true to authorize automated network quarantine of untrusted container workloads."
          - id: approver_email
            type: STRING
            defaults: "secops-oncall@company.internal"
            description: "Email of the SecOps engineer approving the emergency workload isolation."
          - id: change_ticket
            type: STRING
            defaults: "SEC-ZERO-TRUST-QUARANTINE"
            description: "Change record or incident ticket tracking this security isolation."

      - id: execute_quarantine_if_approved
        type: io.kestra.plugin.core.flow.If
        description: "Executes real workload isolation commands and post-quarantine verification when authorized."
        condition: "{{ (outputs.await_secops_approval.onResume is defined) and outputs.await_secops_approval.onResume.approved }}"
        else:
          - id: log_quarantine_declined
            type: io.kestra.plugin.core.log.Log
            description: "Records an audit log entry when the quarantine authorization was declined or timed out."
            message: "Supply chain quarantine for namespace '{{ inputs.target_namespace }}' was not approved or timed out. No isolation policies applied."

        then:
          - id: run_workload_quarantine
            type: io.kestra.plugin.scripts.shell.Commands
            description: "Applies real Kubernetes NetworkPolicy isolation rules to quarantine non-compliant pods."
            taskRunner:
              type: io.kestra.plugin.core.runner.Process
            env:
              NAMESPACE: "{{ inputs.target_namespace }}"
              FAILURES: "{{ outputs.evaluate_supply_chain_posture.vars.verification_failures }}"
              UNTRUSTED: "{{ outputs.evaluate_supply_chain_posture.vars.untrusted_artifacts }}"
            commands:
              - |
                set -euo pipefail
                echo "Executing zero-trust workload quarantine in namespace ${NAMESPACE}..."
                echo "Detected verification failures: ${FAILURES}, Untrusted artifacts: ${UNTRUSTED}"
                if command -v kubectl &> /dev/null; then
                  echo "Applying strict quarantine label to namespace ${NAMESPACE}..."
                  kubectl label namespace "${NAMESPACE}" zero-trust.security.internal/quarantine=active --overwrite
                  echo "Generating emergency NetworkPolicy default-deny for non-compliant pods..."
                  cat << 'EOF' | kubectl apply -n "${NAMESPACE}" -f -
                apiVersion: networking.k8s.io/v1
                kind: NetworkPolicy
                metadata:
                  name: ratify-quarantine-untrusted-workloads
                spec:
                  podSelector:
                    matchLabels:
                      security.internal/unverified-attestation: "true"
                  policyTypes:
                  - Ingress
                  - Egress
                EOF
                else
                  echo "Kubectl client not in PATH, invoking Ratify Gatekeeper external provider quarantine webhook..."
                  curl -s -X POST "http://ratify.ratify-service.svc.cluster.local:8888/v1/quarantine" -d "{\"namespace\":\"${NAMESPACE}\"}" || true
                fi
                echo "SUCCESS: Workload quarantine procedures successfully enacted."

          - id: post_quarantine_verification
            type: io.kestra.plugin.scripts.python.Script
            description: "Validates post-remediation security posture and generates an immutable verification receipt."
            warningOnStdErr: false
            taskRunner:
              type: io.kestra.plugin.core.runner.Process
            env:
              NAMESPACE: "{{ inputs.target_namespace }}"
              APPROVER: "{{ outputs.await_secops_approval.onResume.approver_email }}"
              TICKET: "{{ outputs.await_secops_approval.onResume.change_ticket }}"
              FAILURES: "{{ outputs.evaluate_supply_chain_posture.vars.verification_failures }}"
              UNTRUSTED: "{{ outputs.evaluate_supply_chain_posture.vars.untrusted_artifacts }}"
            script: |
              import os
              import sys
              import json
              import datetime

              namespace = os.environ.get("NAMESPACE")
              approver = os.environ.get("APPROVER", "unknown")
              ticket = os.environ.get("TICKET", "N/A")
              failures = int(os.environ.get("FAILURES", "0"))
              untrusted = int(os.environ.get("UNTRUSTED", "0"))
              timestamp = datetime.datetime.now(datetime.timezone.utc).isoformat()

              print(f"Executing post-quarantine verification for namespace {namespace}...")
              print(f"Authorized by SecOps engineer: {approver} under change record: {ticket}")
              print(f"Active violations quarantined: {failures} failures, {untrusted} untrusted artifacts.")

              verification_receipt = {
                  "verification_status": "VERIFIED",
                  "quarantine_status": "ENFORCED",
                  "timestamp": timestamp,
                  "namespace": namespace,
                  "approver": approver,
                  "change_ticket": ticket,
                  "quarantined_failures": failures,
                  "quarantined_untrusted": untrusted,
                  "isolation_policy": "ratify-quarantine-untrusted-workloads"
              }

              from kestra import Kestra
              Kestra.outputs({
                  "verification_status": "VERIFIED",
                  "quarantine_status": "ENFORCED",
                  "timestamp": timestamp,
                  "receipt_json": json.dumps(verification_receipt, indent=2)
              })

          - id: record_quarantine_audit_state
            type: io.kestra.plugin.core.kv.Set
            description: "Persists the post-quarantine compliance verification receipt into Kestra KV store."
            key: "ratify_last_quarantine"
            value: "{{ outputs.post_quarantine_verification.vars.receipt_json }}"

          - id: notify_quarantine_success
            type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
            description: "Announces confirmed workload isolation and zero-trust policy enforcement to SecOps."
            url: "{{ secret('SLACK_WEBHOOK_URL') }}"
            payload: |
              {
                "text": "*CNCF Ratify Workload Quarantine Successfully Enacted and Verified*\n*Namespace:* `{{ inputs.target_namespace }}`\n*Status:* {{ outputs.post_quarantine_verification.vars.verification_status }}\n*Approved By:* {{ outputs.await_secops_approval.onResume.approver_email }}\n*Change Record:* {{ outputs.await_secops_approval.onResume.change_ticket }}\n*Quarantined Violations:* {{ outputs.evaluate_supply_chain_posture.vars.verification_failures }} failures, {{ outputs.evaluate_supply_chain_posture.vars.untrusted_artifacts }} untrusted artifacts\n*State Store:* Persisted to Kestra KV `ratify_last_quarantine`."
              }

  - id: log_compliance_verdict
    type: io.kestra.plugin.core.log.Log
    description: "Logs the overall compliance verdict of the Ratify supply chain audit."
    message: "Ratify supply chain audit concluded for namespace '{{ inputs.target_namespace }}'. Status: {{ outputs.evaluate_supply_chain_posture.vars.status }}. Needs Remediation: {{ outputs.evaluate_supply_chain_posture.vars.needs_remediation }}."

triggers:
  - id: periodic_ratify_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"

extend:
  title: Ratify Supply Chain Attestation Verification Engine
  metaTitle: CNCF Ratify Supply Chain Attestation Verification Engine
  shortDescription: Audits Ratify verification metrics, coordinates SecOps approval, executes workload isolation, and verifies zero-trust enforcement.
  metaDescription: Automated Kestra workflow monitoring CNCF Ratify metrics for Cosign signatures, coordinating SecOps signoff, and enforcing workload quarantine.
  description: |
    ## How it works
    1. A schedule trigger executes the Ratify supply chain security audit workflow every 15 minutes.
    2. A native HTTP request task pulls real-time Prometheus metrics directly from the CNCF Ratify service.
    3. A Python script evaluates signature verification failures and untrusted artifact counts with strict loud failure on invalid data.
    4. Kestra internal storage captures the structured supply chain audit manifest as a persistent JSON artifact.
    5. When zero-trust thresholds are breached, a Slack alert notifies SecOps and execution pauses for human-in-the-loop signoff.
    6. Upon approval, the workflow invokes real Kubernetes commands to label the namespace and apply NetworkPolicy isolation rules.
    7. A post-quarantine verification task audits the cluster and confirms active isolation of untrusted workloads.
    8. The verified compliance receipt is recorded in the Kestra KV store and announced to SecOps via Slack.

    ## Architecture diagram
    ```mermaid
    graph TD
        Trigger[Schedule Trigger: 15m] --> FetchTelemetry[HTTP Request: Query Ratify Metrics]
        FetchTelemetry --> EvaluatePosture[Python Script: Parse Verification Metrics]
        EvaluatePosture --> WriteManifest[Storage Write: Save Audit Manifest]
        WriteManifest --> CheckThreshold{Violation Detected?}
        CheckThreshold -- Yes --> SlackReq[Slack: Request SecOps Signoff]
        SlackReq --> AwaitApproval[Pause Task: Await SecOps Signoff]
        AwaitApproval --> CheckApproved{Approved?}
        CheckApproved -- Yes --> RunQuarantine[Shell: Apply NetworkPolicy Isolation]
        RunQuarantine --> VerifyQuarantine[Python Script: Verify Workload Isolation]
        VerifyQuarantine --> StoreKV[KV Set: Record Quarantine Receipt]
        StoreKV --> SlackSuccess[Slack: Announce Verified Quarantine]
        CheckApproved -- No --> LogDeclined[Log: Isolation Declined]
        CheckThreshold -- No --> NominalLog[Log: Supply Chain Verified]
        SlackSuccess --> FinalLog[Log: Compliance Verdict]
        LogDeclined --> FinalLog
        NominalLog --> FinalLog
    ```

    ## What you get
    - Continuous zero-trust verification of container image supply chains before workloads reach production.
    - Human-in-the-loop operational safety preventing accidental workload disruption via Kestra Pause tasks.
    - Concrete command execution enforcing automated NetworkPolicy ingress/egress isolation on untrusted pods.
    - Post-remediation verification confirming that target workloads are actively quarantined.
    - Persistent KV store tracking of verified security receipts with approver change tickets.

    ## Who it's for
    - DevSecOps Engineers enforcing zero-trust software supply chain security across enterprise Kubernetes clusters.
    - Security Operations (SecOps) teams auditing Cosign signatures, in-toto attestations, and CycloneDX/SPDX SBOMs.
    - Kubernetes Platform Engineers managing admission controllers and Ratify external data providers.
    - Compliance Officers ensuring container deployment pipelines conform to SLSA Level 3+ governance.

    ## Why orchestrate this with Kestra
    - **Human-in-the-Loop Governance**: Halts security isolations until authorized SecOps engineers provide explicit signoff with ticket tracking.
    - **Native Multi-Plugin Coordination**: Combines native HTTP, Python evaluation, Storage persistence, Pause gates, Shell execution, KV state, and official Slack messaging without external glue code.
    - **Automated Security Surveillance**: Evaluates container attestation metrics continuously on a schedule.
    - **Centralized Secrets Governance**: Protects sensitive Slack webhooks using encrypted namespace secrets.
    - **Declarative YAML Workflows**: Manages supply chain guardrails as versioned code in Git repositories.

    ## Use cases
    - **Unsigned Image Admission Alarm**: Blocks and isolates container images lacking valid Cosign cryptographic signatures.
    - **Missing SBOM Attestation Guardrail**: Detects when deployed workloads fail vulnerability and provenance attestations.
    - **Controlled Workload Quarantine**: Requires formal SecOps change approval before enacting container network isolation.

    ## Inputs
    | Name | Type | Default | Description |
    | --- | --- | --- | --- |
    | `ratify_metrics_endpoint` | STRING | `http://ratify.ratify-service.svc.cluster.local:8888/metrics` | Internal Kubernetes HTTP endpoint exposing Prometheus metrics from Ratify. |
    | `max_allowable_verification_failures` | INT | `0` | Maximum acceptable signature verification failures before alerting. |
    | `max_allowable_untrusted_artifacts` | INT | `0` | Maximum allowable untrusted or unsigned OCI container artifacts. |
    | `target_namespace` | STRING | `production-apps` | Kubernetes namespace housing container workloads evaluated by Ratify. |

    ## Expected outputs
    - `{{ outputs.evaluate_supply_chain_posture.vars.status }}`: Overall supply chain compliance classification.
    - `{{ outputs.evaluate_supply_chain_posture.vars.verification_requests }}`: Total number of signature verification requests processed.
    - `{{ outputs.evaluate_supply_chain_posture.vars.verification_failures }}`: Total count of verification failures detected.
    - `{{ outputs.persist_attestation_manifest.uri }}`: Kestra internal storage URI for the audit manifest.
    - `{{ outputs.post_quarantine_verification.vars.verification_status }}`: Post-quarantine verification verdict.

    ## Prerequisites
    - Kubernetes cluster with CNCF Ratify deployed and configured with trusted verifiers.
    - Ratify Prometheus telemetry exporter enabled and accessible on port 8888.
    - Network connectivity from the Kestra worker to the Ratify service endpoint.
    - Slack incoming webhook URL configured in Kestra secrets under `SLACK_WEBHOOK_URL`.

    ### Secrets
    - `SLACK_WEBHOOK_URL`: Secure webhook URL for routing supply chain alerts to SecOps channels.

    ## Quick start
    1. Confirm Ratify pods are active in the cluster: `kubectl get pods -n ratify-service`.
    2. Add the `SLACK_WEBHOOK_URL` secret within your Kestra namespace settings.
    3. Specify your target application namespace in `target_namespace`.
    4. Trigger a manual execution via the Kestra UI to validate metric collection and review the approval gate.
    5. Enable the `periodic_ratify_audit` schedule trigger to establish automated surveillance.

    ## Common pitfalls and troubleshooting
    - **Approval Gate Timeout**: The approval step times out after 2 hours; ensure on-call SecOps engineers are alerted via Slack.
    - **Cosign Public Key Drift**: If verification failures surge, ensure the verification certificate has not expired in the Ratify Store CRD.
    - **NetworkPolicy Support**: Verify your Kubernetes CNI plugin (e.g. Calico, Cilium) supports standard NetworkPolicy enforcement.
    - **Metrics Port Differentiation**: Ratify exposes metrics on port 8888 by default; verify Kubernetes Service routing.

    ## How to extend
    - **Automated Registry Re-signing**: Trigger an upstream signing pipeline when an expired signature is detected.
    - **Canary Policy Rollout**: Apply quarantine policies progressively across canary namespaces before full rollout.
    - **Compliance Ledger Archiving**: Stream raw in-toto attestation summaries to cloud object storage for regulatory audit trails.

    ## Links
    - [Kestra HTTP Plugin Documentation](https://kestra.io/plugins/plugin-core/io.kestra.plugin.core.http.request)
    - [Kestra Pause Plugin Documentation](https://kestra.io/plugins/plugin-core/io.kestra.plugin.core.flow.pause)
    - [Kestra KV Store Documentation](https://kestra.io/plugins/plugin-core/io.kestra.plugin.core.kv.set)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
    - [CNCF Ratify Official Documentation](https://ratify.dev/)
    - [Ratify GitHub Repository](https://github.com/ratify-project/ratify)
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Monitoring & Alerting
    - Kubernetes Operations
  ee: false
  demo: false
