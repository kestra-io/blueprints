id: loki-compactor-retention-deletion-lag-sentinel
namespace: company.sentinel
description: Monitors Grafana Loki compactor Prometheus metrics to identify retention deletion table sweep failures and unpruned aged log chunks.

inputs:
  - id: loki_metrics_url
    type: STRING
    defaults: http://loki.internal:3100/metrics
    description: Prometheus metrics endpoint for the Grafana Loki compactor service.
  - id: max_pruning_errors_threshold
    type: INT
    defaults: 0
    description: Maximum permissible retention deletion operation failures before alerting.

tasks:
  - id: audit_loki
    type: io.kestra.plugin.scripts.python.Script
    description: Scrapes Loki compactor metrics and evaluates retention deletion error counts.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests kestra
    env:
      LOKI_METRICS_URL: "{{ inputs.loki_metrics_url }}"
    script: |
      import os
      import sys
      import requests
      from kestra import Kestra

      url = os.environ.get("LOKI_METRICS_URL", "http://loki.internal:3100/metrics").strip()
      print(f"Scraping Loki compactor metrics from {url}...")

      try:
          resp = requests.get(url, timeout=15)
          resp.raise_for_status()
      except Exception as e:
          print(f"ERROR: Failed to fetch Loki compactor metrics from {url}: {e}", file=sys.stderr)
          sys.exit(1)

      prune_errors = 0
      successful_sweeps = 0

      for line in resp.text.splitlines():
          line = line.strip()
          if line.startswith("#") or not line:
              continue
          if "loki_compactor_apply_retention_operations_total" in line:
              if 'status="failure"' in line:
                  prune_errors = int(float(line.split()[-1]))
              elif 'status="success"' in line:
                  successful_sweeps = int(float(line.split()[-1]))

      print(f"Loki Compactor: Prune Errors={prune_errors}, Successful Sweeps={successful_sweeps}")

      Kestra.outputs({
          "prune_errors": prune_errors,
          "successful_sweeps": successful_sweeps
      })

  - id: evaluate_and_alert
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.audit_loki.vars.prune_errors > inputs.max_pruning_errors_threshold }}"
    then:
      - id: notify_slack
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          :warning: *Grafana Loki Compactor Retention Sweep Errors*
          *Metrics URL:* {{ inputs.loki_metrics_url }}
          *Retention Deletion Failures:* {{ outputs.audit_loki.vars.prune_errors }}
          *Threshold:* {{ inputs.max_pruning_errors_threshold }}
          *Risk:* Object storage growth uncontrolled due to failed table expiration sweeps.

outputs:
  - id: prune_errors
    type: INT
    value: "{{ outputs.audit_loki.vars.prune_errors }}"
  - id: successful_sweeps
    type: INT
    value: "{{ outputs.audit_loki.vars.successful_sweeps }}"

errors:
  - id: handle_inspection_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      :rotating_light: *Execution Failure: Grafana Loki Compactor Retention Table Pruning Sentinel*
      *Execution ID:* `{{ execution.id }}`
      *State:* `{{ execution.state.current }}`
      *Error:* Sentinel inspection encountered an unhandled execution error.

triggers:
  - id: scheduled_monitor
    type: io.kestra.plugin.core.trigger.Schedule
    cron: 0 4 * * *
    disabled: true

extend:
  metaDescription: "Monitors Grafana Loki compactor Prometheus metrics to identify retention deletion table sweep failures and unpruned aged log chunks."
  metaTitle: Grafana Loki Compactor Retention Table Pruning Sentinel with Kestra
  title: Grafana Loki Compactor Retention Table Pruning Sentinel
  shortDescription: Monitors Grafana Loki compactor Prometheus metrics to identify retention deletion table sweep failures and unpruned aged log chunks.
  description: |
    Continuously audits Grafana Loki compactor metrics to identify retention deletion sweep errors and ensure automated object storage retention compliance.
  tags:
    - Data
    - Infrastructure
