id: gcp-create-vm-approval-gate
namespace: company.team
description: |
  Self-service VM ordering with a human approval gate. A requester fills a form,
  an approver gets a Slack message, the run pauses until approved, then Terraform
  provisions the Google Cloud VM, the inventory is updated, and Slack is notified.

inputs:
  - id: billingAccount
    type: SELECT
    displayName: Billing Account
    description: GCP project ID that owns the VM.
    values:
      - kestra-sandbox
      - kestra-dev
    defaults: kestra-sandbox

  - id: region
    type: SELECT
    displayName: Region
    values:
      - us-central1
      - us-east1
    defaults: us-central1

  - id: zone
    type: SELECT
    displayName: Zone
    values:
      - us-central1-a
      - us-central1-b
    dependsOn:
      inputs:
        - region
      condition: "{{ inputs.region == 'us-central1' }}"
    defaults: us-central1-a

  - id: osFlavor
    displayName: OS Image
    type: SELECT
    values:
      - ubuntu-os-cloud/ubuntu-2404-lts-amd64
      - ubuntu-os-cloud/ubuntu-2204-lts
    defaults: ubuntu-os-cloud/ubuntu-2204-lts

  - id: vmSize
    displayName: VM Size
    type: SELECT
    values:
      - n1-standard-1
      - n1-standard-2
      - n1-standard-4
    defaults: n1-standard-1

  - id: network
    displayName: Network
    type: STRING
    defaults: default

  - id: subnet
    displayName: Subnet
    type: STRING
    defaults: default

  - id: env
    type: SELECT
    displayName: Environment
    values:
      - dev
      - stg
      - prd
    defaults: dev

  - id: vmType
    type: SELECT
    displayName: Type of VM
    values:
      - app
      - db
      - srv
    defaults: app

tasks:
  - id: requestApproval
    type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
    description: Notify approvers that a VM order is waiting for review.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "A VM order has been placed (execution {{ execution.id }}).\nSize: {{ inputs.vmSize }} | Zone: {{ inputs.zone }} | Env: {{ inputs.env }}\nOpen the paused execution in the Kestra UI to approve or reject."
      }

  - id: waitForApproval
    type: io.kestra.plugin.core.flow.Pause
    description: Hold the order until an approver resumes the execution.
    onResume:
      - id: approved
        description: Whether to approve the request
        type: BOOL
        defaults: false
      - id: reason
        description: Reason for approval or rejection
        type: STRING
        defaults: Auto reject

  - id: proceedIfApproved
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.waitForApproval.onResume.approved == false }}"
    then:
      - id: isRejected
        type: io.kestra.plugin.core.execution.Fail
        errorMessage: "Request was not approved. Reason: {{ outputs.waitForApproval.onResume.reason }}"
    else:
      - id: generateHostname
        type: io.kestra.plugin.scripts.python.Script
        description: Build a standardized hostname from environment and VM type.
        beforeCommands:
          - pip install kestra
        script: |
          import random
          from kestra import Kestra

          # Replace with a lookup against your CMDB or IPAM to get the next free index
          index = random.randint(10, 99)
          hostname = f"gcp{{ inputs.env }}lnx{{ inputs.vmType }}{index:02d}"
          ip_address = f"10.128.10.{index}"
          Kestra.outputs({"hostname": hostname, "ipAddress": ip_address})

      - id: createVM
        type: io.kestra.plugin.terraform.cli.TerraformCLI
        description: Provision the approved VM with Terraform.
        env:
          GOOGLE_APPLICATION_CREDENTIALS: gcp-svc-account.json
        inputFiles:
          gcp-svc-account.json: "{{ secret('GCP_SERVICE_ACCOUNT_JSON') }}"
          main.tf: |
            # Replace with your real configuration; a remote backend such as GCS
            # is recommended so a later destroy can reuse the same state.
            resource "google_compute_instance" "default" {
              name         = "{{ outputs.generateHostname.vars.hostname }}"
              machine_type = "{{ inputs.vmSize }}"
              zone         = "{{ inputs.zone }}"
              project      = "{{ inputs.billingAccount }}"

              boot_disk {
                initialize_params {
                  image = "{{ inputs.osFlavor }}"
                }
              }

              network_interface {
                network            = "{{ inputs.network }}"
                subnetwork         = "{{ inputs.subnet }}"
                subnetwork_project = "{{ inputs.billingAccount }}"
                access_config {}
              }
            }

            output "external_ip" {
              value       = google_compute_instance.default.network_interface[0].access_config[0].nat_ip
              description = "The external IP address of the VM"
            }
        beforeCommands:
          - terraform init
        commands:
          - terraform plan
          - terraform apply -auto-approve -json
          - terraform output -raw external_ip > external_ip.txt
        outputFiles:
          - "*.txt"

      - id: updateInventory
        type: io.kestra.plugin.core.kv.Set
        description: Record the new VM in the KV-backed inventory.
        key: "vm_{{ outputs.generateHostname.vars.hostname }}"
        kvType: JSON
        value: |
          {
            "hostname": "{{ outputs.generateHostname.vars.hostname }}",
            "account": "{{ inputs.billingAccount }}",
            "region": "{{ inputs.region }}",
            "zone": "{{ inputs.zone }}",
            "size": "{{ inputs.vmSize }}",
            "os": "{{ inputs.osFlavor }}",
            "environment": "{{ inputs.env }}",
            "vmType": "{{ inputs.vmType }}",
            "ipAddress": "{{ outputs.generateHostname.vars.ipAddress }}",
            "externalIp": "{{ read(outputs.createVM.outputFiles['external_ip.txt']) }}"
          }

      - id: notifyChannel
        type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
        description: Confirm the VM creation to the requesting channel.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "{{ outputs.generateHostname.vars.hostname }} created successfully.\nExternal IP: {{ read(outputs.createVM.outputFiles['external_ip.txt']) }}\nZone: {{ inputs.zone }} | Size: {{ inputs.vmSize }} | Env: {{ inputs.env }}"
          }

outputs:
  - id: externalIPAddress
    type: STRING
    value: "{{ read(outputs.createVM.outputFiles['external_ip.txt']) ?? 'Failed' }}"

extend:
  shortDescription: Order a Google Cloud VM through a Slack-notified approval gate, provision it with Terraform, and register it in inventory.
  title: Self-Service VM Ordering with Approval Gate and Terraform on Google Cloud
  metaTitle: "GCP VM Ordering with Approval Gate: Terraform and Kestra"
  metaDescription: Self-service GCP VM ordering with Kestra. Slack notifies approvers, the run pauses for approval, Terraform provisions the VM, and inventory is updated.
  description: |
    Turn VM requests into a governed self-service workflow. A requester picks the account, zone, image, and size from dropdown inputs, an approver is pinged in Slack, and the execution pauses until someone explicitly approves. Only then does Terraform provision the Google Cloud instance, after which the VM is registered in a KV-backed inventory and the channel is notified with the external IP. Rejections fail the run with the recorded reason, so every decision is auditable.

    ## How it works
    1. Cascading `SELECT` inputs (`billingAccount`, `region`, `zone`, `osFlavor`, `vmSize`, `env`, `vmType`) present a controlled order form; `zone` uses `dependsOn` so only zones in the chosen region appear.
    2. The `requestApproval` task (`io.kestra.plugin.notifications.slack.SlackIncomingWebhook`) posts the order summary and execution id to Slack.
    3. The `waitForApproval` task (`io.kestra.plugin.core.flow.Pause`) suspends the run; on resume the approver provides `approved` (BOOL) and `reason` (STRING) via `onResume` inputs.
    4. The `proceedIfApproved` task (`io.kestra.plugin.core.flow.If`) fails the execution with the rejection reason, or continues.
    5. The `generateHostname` task (`io.kestra.plugin.scripts.python.Script`) builds a standardized hostname such as `gcpdevlnxapp42` and a candidate IP; swap the stub for your CMDB or IPAM lookup.
    6. The `createVM` task (`io.kestra.plugin.terraform.cli.TerraformCLI`) runs `terraform init`, `plan`, and `apply` against an inlined `main.tf`, authenticating with a service account key injected via `inputFiles`, then exports `external_ip.txt`.
    7. The `updateInventory` task (`io.kestra.plugin.core.kv.Set`) stores the full VM record as JSON in the KV store, and `notifyChannel` posts the result back to Slack.

    ## What you get
    - A single form-driven entry point for VM requests with constrained, dependent choices.
    - A human approval gate with a recorded approve/reject decision and reason.
    - Terraform provisioning with credentials pulled from secrets, never hardcoded.
    - An inventory record per VM and a Slack confirmation with the external IP.
    - The external IP exposed as a flow output for downstream flows.

    ## Who it's for
    - Platform teams offering VM self-service without giving out cloud console access.
    - Infrastructure engineers who want provisioning requests reviewed before spend happens.
    - IT organizations replacing ticket-driven VM requests with an auditable workflow.

    ## Why orchestrate this with Kestra
    Terraform alone cannot pause for a human decision, render an order form, or notify approvers. Kestra adds typed inputs with `dependsOn` cascading, a first-class `Pause` task with `onResume` inputs that capture who decided what and why, secrets management for the service account key, and full execution history linking the request, the approval, and the applied infrastructure.

    ## Prerequisites
    - A GCP project with the Compute Engine API enabled and a service account allowed to create instances.
    - A Slack incoming webhook for the approvals channel.
    - Docker available to the Kestra worker for the Terraform CLI task.

    ### Secrets
    - `GCP_SERVICE_ACCOUNT_JSON`: full JSON key of the GCP service account used by Terraform.
    - `SLACK_WEBHOOK_URL`: Slack incoming webhook used for approval requests and confirmations.

    ## Quick start
    1. Add the secrets above to your Kestra namespace.
    2. Adjust the `SELECT` input values to your real accounts, regions, networks, and sizes.
    3. Replace the stub hostname/IP generation with your CMDB or IPAM lookup.
    4. Execute the flow, review the Slack message, then resume the paused execution with `approved: true`.

    ## How to extend
    - Add a remote GCS backend to `main.tf` so a decommissioning flow can `terraform destroy` from the same state.
    - Replace the KV inventory with ServiceNow CMDB or NetBox API calls.
    - Chain a post-provisioning flow (compliance scan, user onboarding) with a `io.kestra.plugin.core.trigger.Flow` trigger on SUCCESS.
    - Auto-approve dev requests by wrapping `waitForApproval` in `runIf: {{ inputs.env != 'dev' }}`.
    - Track the VM as a governed asset with the EE Assets plugin (`io.kestra.plugin.ee.assets.VM`).

    ## Links
    - Terraform plugin docs: https://kestra.io/plugins/plugin-terraform
    - Pause task docs: https://kestra.io/plugins/core/tasks/flow/io.kestra.plugin.core.flow.pause
    - Terraform orchestration with Kestra: https://kestra.io/orchestration/terraform
  tags:
    - Infrastructure
  subtags:
    - GCP Services
    - Approval Gates
    - Customer Success
  ee: false
  demo: false
