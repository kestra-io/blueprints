id: lichess-top-classical-players-lakehouse-loader
namespace: company.analytics
description: Ingests top rated classical chess players, international titles, and rating progressions from Lichess into Parquet lakehouse storage via DuckDB, tracking rating benchmarks in Kestra KV store.

inputs:
  - id: top_limit
    type: INT
    description: Number of top classical players to harvest.
    defaults: 20

  - id: state_key
    type: STRING
    description: Kestra KV store key maintaining the latest known #1 classical player rating.
    defaults: lichess_monitored_top_rating_state

variables:
  default_state: "0"

triggers:
  - id: daily_lichess_sync
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 3 * * *"

tasks:
  - id: get_current_state
    type: io.kestra.plugin.core.kv.Get
    key: "{{ inputs.state_key }}"
    errorOnMissing: false

  - id: ingest_and_transform_lichess
    type: io.kestra.plugin.scripts.python.Commands
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install requests duckdb
    commands:
      - |
        python3 - << 'EOF'
        import os
        import json
        import requests
        import duckdb
        from datetime import datetime

        raw_state = """{{ outputs.get_current_state.value ?? vars.default_state }}"""
        try:
            prev_rating = int(json.loads(raw_state)) if raw_state else 0
        except Exception:
            prev_rating = 0

        limit = int("{{ inputs.top_limit }}")

        url = f"https://lichess.org/api/player/top/{limit}/classical"
        headers = {
            "Accept": "application/vnd.lichess.v3+json",
            "User-Agent": "KestraLichessLakehouse/1.0 (chess-analytics@kestra.io)"
        }

        records = []
        top_rating = 0
        top_username = ""

        try:
            resp = requests.get(url, headers=headers, timeout=20)
            if resp.status_code == 200:
                data = resp.json()
                users = data.get("users", [])

                for i, u in enumerate(users):
                    rank = i + 1
                    u_id = u.get("id", "")
                    username = u.get("username", "")
                    title = u.get("title") or "None"
                    rating = int(u.get("rating", 0))
                    patron = bool(u.get("patron", False))
                    online = bool(u.get("online", False))

                    if rank == 1:
                        top_rating = rating
                        top_username = username

                    records.append({
                        "rank": rank,
                        "player_id": u_id,
                        "username": username,
                        "fide_title": title,
                        "classical_rating": rating,
                        "is_patron": patron,
                        "is_online": online,
                        "harvest_time": datetime.utcnow().isoformat()
                    })
        except Exception as e:
            print(f"Error fetching Lichess classical leaderboard: {e}")

        with open("lichess_classical.json", "w", encoding="utf-8") as f:
            json.dump(records, f)

        con = duckdb.connect()
        if records:
            con.execute("CREATE TABLE lichess_rankings AS SELECT * FROM read_json_auto('lichess_classical.json')")
            con.execute("COPY lichess_rankings TO 'lichess_classical_leaderboard.parquet' (FORMAT PARQUET)")
            con.execute("COPY lichess_rankings TO 'lichess_classical_leaderboard.csv' (HEADER, DELIMITER ',')")
        else:
            con.execute("""
                CREATE TABLE lichess_rankings (
                    rank INTEGER,
                    player_id VARCHAR,
                    username VARCHAR,
                    fide_title VARCHAR,
                    classical_rating INTEGER,
                    is_patron BOOLEAN,
                    is_online BOOLEAN,
                    harvest_time VARCHAR
                )
            """)
            con.execute("COPY lichess_rankings TO 'lichess_classical_leaderboard.parquet' (FORMAT PARQUET)")
            con.execute("COPY lichess_rankings TO 'lichess_classical_leaderboard.csv' (HEADER, DELIMITER ',')")

        rating_drift = (top_rating - prev_rating) if prev_rating > 0 else 0

        summary = {
            "total_players_ranked": len(records),
            "top_player": top_username,
            "top_rating": top_rating,
            "rating_drift": rating_drift,
            "updated_state": top_rating
        }

        print(f"::{{'outputs': {json.dumps(summary)}}}::")
        EOF
    outputFiles:
      - lichess_classical_leaderboard.parquet
      - lichess_classical_leaderboard.csv

  - id: persist_state
    type: io.kestra.plugin.core.kv.Set
    key: "{{ inputs.state_key }}"
    value: "{{ outputs.ingest_and_transform_lichess.vars.updated_state | toJson }}"

  - id: log_top_player
    type: io.kestra.plugin.core.log.Log
    level: INFO
    message: "♟️ Lichess Classical Leaderboard: #1 Player {{ outputs.ingest_and_transform_lichess.vars.top_player }} holds rating {{ outputs.ingest_and_transform_lichess.vars.top_rating }}."

outputs:
  - id: total_players
    type: INT
    value: "{{ outputs.ingest_and_transform_lichess.vars.total_players_ranked }}"
  - id: top_player
    type: STRING
    value: "{{ outputs.ingest_and_transform_lichess.vars.top_player }}"
  - id: dataset_parquet
    type: FILE
    value: "{{ outputs.ingest_and_transform_lichess.outputFiles['lichess_classical_leaderboard.parquet'] }}"

extend:
  title: Lichess Classical Chess Leaderboard Lakehouse Loader with DuckDB
  metaTitle: Lichess Classical Leaderboard Lakehouse Loader | Kestra
  shortDescription: Ingests top rated classical chess players, international titles, and rating progressions from Lichess into Parquet lakehouse storage via DuckDB.
  metaDescription: Poll Lichess REST API for classical chess rankings, convert ELO rating distributions into Parquet via DuckDB, and track top rating in KV store.
  tags:
    - Data
  subTags:
    - ELT & Warehouse Loading
    - File & Data Processing Basics
  ee: false
  demo: false
  description: |
    Automate the collection, sports analytics harmonization, and analytical lakehouse persistence of top-rated
    classical chess players, international master titles, and ELO rating benchmarks from Lichess into Parquet using DuckDB.

    ## How it works

    1. **State Recovery**: Queries the Kestra KV store (`lichess_monitored_top_rating_state`) for the previously logged peak classical chess rating.
    2. **Lichess API Ingestion**: Queries the official Lichess REST API (`lichess.org/api/player/top/{nb}/classical`) across top ranked players.
    3. **DuckDB Performance Normalization**: Unpacks player ranks, usernames, master titles, ratings, and account status into a relational schema inside Docker.
    4. **Analytical Lake Export**: Exports normalized ranking records into columnar Parquet and CSV files for competitive sports analytics and rating progression models.
    5. **State Commitment**: Commits the updated peak rating benchmark to Kestra KV store for reliable, stateful incremental processing.

    ## What you get

    - Automated, scheduled collection of open-source global competitive chess leaderboards.
    - Columnar Parquet datasets queryable with DuckDB, ClickHouse, Snowflake, or Athena.
    - Built-in KV state management providing idempotent execution and zero database requirements.

    ## Who it's for

    - Sports Analytics Engineers modeling competitive matchmaking and rating distribution curves.
    - Chess Researchers tracking master-level classical tournament player performance.
    - Analytics Engineers building reproducible multi-cloud lakehouse pipelines.

    ## Why orchestrate this with Kestra

    - Built-in KV store maintains historical rating states across runs without database infrastructure.
    - Ephemeral Docker execution guarantees reproducible, clean Python and DuckDB runtimes.
    - Declarative scheduled execution with automated error recovery and conditional logging.

    ## Prerequisites

    - Docker runner configured on the Kestra worker.
    - Outbound internet access to `lichess.org`.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: (Optional) Webhook URL for alerting teams on rating milestone shifts.

    ## Quick start

    1. Import this blueprint into your Kestra instance.
    2. Adjust the `top_limit` parameter.
    3. Click **Execute** to run an immediate harvest and generate the Parquet archive.
    4. Enable the `daily_lichess_sync` schedule for automated daily updates.

    ## How to extend

    - Add an S3 or Google Cloud Storage step to partition daily classical rating archives.
    - Connect a Lichess opening explorer step in DuckDB to analyze winning opening lines.

    ## Links

    - [Lichess API Documentation](https://lichess.org/api#tag/Users/operation/usersTopClassical)
    - [DuckDB Documentation](https://duckdb.org/)
    - [Kestra Task Runners](https://kestra.io/docs/task-runners)
