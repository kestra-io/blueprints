id: publicrecords-eu-ted-notices-scraper
namespace: company.team

inputs:
  - id: max_items
    type: INT
    displayName: Max items
    defaults: 50

tasks:
  - id: run_actor
    type: io.kestra.plugin.apify.actor.Run
    actorId: publicrecords/eu-ted-notices-scraper
    apiToken: "{{ secret('APIFY_API_TOKEN') }}"
    maxItems: "{{ inputs.max_items }}"
    maxTotalChargeUsd: 5
    input:
      scope: "ALL"
      maxItems: 50

  - id: get_dataset
    type: io.kestra.plugin.apify.dataset.Get
    apiToken: "{{ secret('APIFY_API_TOKEN') }}"
    datasetId: "{{ outputs.run_actor.defaultDatasetId }}"

extend:
  title: Pull EU TED procurement notices
  metaTitle: Pull EU TED procurement notices with Kestra
  shortDescription: Run publicrecords/eu-ted-notices-scraper and fetch recent TED notices.
  description: |
    Run the **Public Records** Apify Actor `eu-ted-notices-scraper` on a schedule, using **your** Apify API token stored as the Kestra secret `APIFY_API_TOKEN`. Usage is billed to your Apify account (free tier available).

    Store page: https://apify.com/publicrecords/eu-ted-notices-scraper

    Disclosure: Public Records maintains this Actor.
  tags:
    - Data
  subTags:
    - Public data
  ee: false
  demo: false
  metaDescription: Schedule the Public Records EU TED Apify Actor and fetch procurement notices into Kestra.
