id: mysql-innodb-buffer-pool-dirty-pages-monitor
namespace: company.database

description: Monitors MySQL InnoDB buffer pool dirty page ratios, alerting database administrators before aggressive checkpoint flushing causes transaction latency spikes.

concurrency:
  limit: 1

inputs:
  - id: mysql_host
    type: STRING
    defaults: mysql-primary.internal
    description: Hostname or IP address of the MySQL database server.

  - id: mysql_port
    type: INT
    defaults: 3306
    description: MySQL communication port.

  - id: max_dirty_page_percent_warning
    type: FLOAT
    defaults: 75.0
    description: Percentage threshold of dirty buffer pool pages before triggering an alert.

  - id: slack_channel
    type: STRING
    defaults: "#mysql-dba-alerts"
    description: Slack channel destination for MySQL storage engine alerts.

tasks:
  - id: audit_buffer_pool_dirty_pages
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install pymysql
    env:
      MYSQL_HOST: "{{ inputs.mysql_host }}"
      MYSQL_PORT: "{{ inputs.mysql_port }}"
      MYSQL_USER: "{{ secret('MYSQL_USER') }}"
      MYSQL_PASSWORD: "{{ secret('MYSQL_PASSWORD') }}"
      DIRTY_LIMIT: "{{ inputs.max_dirty_page_percent_warning }}"
    script: |
      import os
      import json
      import pymysql
      from kestra import Kestra

      host = os.getenv('MYSQL_HOST', '127.0.0.1')
      port = int(os.getenv('MYSQL_PORT', 3306))
      user = os.getenv('MYSQL_USER')
      password = os.getenv('MYSQL_PASSWORD')
      dirty_limit = float(os.getenv('DIRTY_LIMIT', 75.0))

      conn = pymysql.connect(
          host=host,
          port=port,
          user=user,
          password=password,
          cursorclass=pymysql.cursors.DictCursor,
          connect_timeout=10
      )
      cursor = conn.cursor()

      # Fetch buffer pool global status variables
      query = """
      SHOW GLOBAL STATUS WHERE Variable_name IN (
          'Innodb_buffer_pool_pages_dirty',
          'Innodb_buffer_pool_pages_total',
          'Innodb_buffer_pool_pages_free',
          'Innodb_buffer_pool_pages_data'
      );
      """
      cursor.execute(query)
      rows = cursor.fetchall()
      conn.close()

      stats = {r['Variable_name']: int(r['Value']) for r in rows}
      dirty_pages = stats.get('Innodb_buffer_pool_pages_dirty', 0)
      total_pages = stats.get('Innodb_buffer_pool_pages_total', 1)
      free_pages = stats.get('Innodb_buffer_pool_pages_free', 0)

      dirty_ratio_percent = (dirty_pages / total_pages) * 100.0 if total_pages > 0 else 0.0
      has_high_dirty_ratio = dirty_ratio_percent >= dirty_limit

      Kestra.outputs({
          'total_buffer_pool_pages': total_pages,
          'dirty_pages_count': dirty_pages,
          'free_pages_count': free_pages,
          'dirty_page_ratio_percent': round(dirty_ratio_percent, 2),
          'has_high_dirty_ratio': has_high_dirty_ratio
      })

      report = {
          'server': f"{host}:{port}",
          'total_pages': total_pages,
          'dirty_pages': dirty_pages,
          'free_pages': free_pages,
          'dirty_ratio_percent': round(dirty_ratio_percent, 2),
          'threshold_percent': dirty_limit,
          'has_high_dirty_ratio': has_high_dirty_ratio
      }

      with open('mysql_buffer_pool_report.json', 'w') as f:
          json.dump(report, f, indent=2)

    outputFiles:
      - mysql_buffer_pool_report.json

  - id: check_dirty_page_threshold
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.audit_buffer_pool_dirty_pages.vars.has_high_dirty_ratio }}"
    then:
      - id: notify_slack_dba
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "{{ inputs.slack_channel }}",
            "text": "MySQL Buffer Pool Dirty Pages Alert: Dirty page ratio reached {{ outputs.audit_buffer_pool_dirty_pages.vars.dirty_page_ratio_percent }}% on `{{ inputs.mysql_host }}` (Threshold: {{ inputs.max_dirty_page_percent_warning }}%).\n• Dirty Pages: {{ outputs.audit_buffer_pool_dirty_pages.vars.dirty_pages_count }} / {{ outputs.audit_buffer_pool_dirty_pages.vars.total_buffer_pool_pages }}\n• Operational Risk: Aggressive synchronous checkpoint flushing will throttle write throughput.\n• Remediation: Increase `innodb_io_capacity` or `innodb_io_capacity_max` to accelerate background page flushing."
          }
    else:
      - id: log_buffer_pool_nominal
        type: io.kestra.plugin.core.log.Log
        message: "MySQL InnoDB buffer pool is healthy on {{ inputs.mysql_host }}. Dirty page ratio is {{ outputs.audit_buffer_pool_dirty_pages.vars.dirty_page_ratio_percent }}%."

  - id: export_buffer_pool_manifest
    type: io.kestra.plugin.core.execution.Labels
    labels:
      mysql_host: "{{ inputs.mysql_host }}"
      dirty_ratio: "{{ outputs.audit_buffer_pool_dirty_pages.vars.dirty_page_ratio_percent | string }}"
      flushing_state: "{{ outputs.audit_buffer_pool_dirty_pages.vars.has_high_dirty_ratio ? 'HIGH_DIRTY_PAGES' : 'HEALTHY' }}"

triggers:
  - id: periodic_buffer_pool_probe
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"

extend:
  title: MySQL InnoDB Buffer Pool Dirty Pages Monitor
  metaTitle: MySQL InnoDB Buffer Pool Dirty Pages Monitor
  shortDescription: Monitors MySQL InnoDB buffer pool dirty page ratios to prevent aggressive checkpoint flushing stalls.
  metaDescription: Monitors MySQL InnoDB buffer pool dirty page ratios, alerting database administrators on Slack before aggressive checkpoint flushing stalls transactions.
  description: |
    This blueprint acts as an automated storage engine health sentinel for MySQL production database clusters. Scheduled every 15 minutes, it inspects global status variables for the InnoDB buffer pool, computes the exact dirty-to-total page percentage, and alerts database administrators on Slack before dirty page accumulation triggers aggressive synchronous page flushing that causes write latency spikes.

    ## How it works

    1. **Recurring 15-Minute Probe**: The `periodic_buffer_pool_probe` trigger (`io.kestra.plugin.core.trigger.Schedule`) fires every 15 minutes.
    2. **InnoDB Status Query**: The `audit_buffer_pool_dirty_pages` task (`io.kestra.plugin.scripts.python.Script`) connects to MySQL via PyMySQL, queries `SHOW GLOBAL STATUS`, and calculates dirty page percentages against total allocated pages.
    3. **Threshold Gate**: The `check_dirty_page_threshold` flowable task (`io.kestra.plugin.core.flow.If`) branches based on whether the ratio exceeded the user-configured limit.
    4. **Slack Alert Dispatch**: When dirty pages accumulate dangerously, `notify_slack_dba` (`io.kestra.plugin.slack.notifications.SlackIncomingWebhook`) delivers an incident warning with `innodb_io_capacity` tuning recommendations.
    5. **Nominal Confirmation**: When the buffer pool flushes cleanly, `log_buffer_pool_nominal` records confirmed status.
    6. **Manifest Export**: The `export_buffer_pool_manifest` task tags the execution with searchable status labels.

    ## Architecture diagram

    ```mermaid
    flowchart TD
        A[Schedule: Every 15 Minutes] --> B[audit_buffer_pool_dirty_pages: MySQL SHOW GLOBAL STATUS]
        B --> C{Dirty Page Ratio > Threshold?}
        C -- Yes --> D[notify_slack_dba: Slack Webhook]
        C -- No --> E[log_buffer_pool_nominal: Log]
        D --> F[export_buffer_pool_manifest: Execution Labels]
        E --> F
    ```

    ## Use cases

    - **Prevent Write Latency Spikes (Furious Flushing)**: Catch write-intensive workloads before InnoDB's background page flusher gets overwhelmed and triggers synchronous page eviction that blocks all DML.
    - **Tuning I/O Capacity Parameters**: Verify that storage subsystems with NVMe or Provisioned IOPS disks are properly configured with sufficient `innodb_io_capacity` and `innodb_io_capacity_max`.
    - **Bulk Import Progress Monitoring**: Monitor dirty page flushing progress during high-volume ETL inserts or data migrations.

    ## Inputs

    | Name | Type | Default | Description |
    | :--- | :--- | :--- | :--- |
    | `mysql_host` | STRING | `mysql-primary.internal` | Hostname or IP address of the MySQL database server. |
    | `mysql_port` | INT | `3306` | MySQL communication port. |
    | `max_dirty_page_percent_warning` | FLOAT | `75.0` | Percentage threshold of dirty buffer pool pages before triggering an alert. |
    | `slack_channel` | STRING | `#mysql-dba-alerts` | Slack channel destination for MySQL storage engine alerts. |

    ## Expected outputs

    - `{{ outputs.audit_buffer_pool_dirty_pages.vars.total_buffer_pool_pages }}`: Total buffer pool pages allocated.
    - `{{ outputs.audit_buffer_pool_dirty_pages.vars.dirty_pages_count }}`: Number of modified unwritten pages currently in memory.
    - `{{ outputs.audit_buffer_pool_dirty_pages.vars.dirty_page_ratio_percent }}`: Computed dirty page percentage.
    - `{{ outputs.audit_buffer_pool_dirty_pages.vars.has_high_dirty_ratio }}`: Boolean flag indicating flushing risk.
    - `{{ outputs.audit_buffer_pool_dirty_pages.outputFiles['mysql_buffer_pool_report.json'] }}`: Full JSON buffer pool status report.

    ## Prerequisites

    - MySQL database user with `PROCESS` privileges to read `SHOW GLOBAL STATUS`.
    - Incoming Webhook URL configured for your database administrator Slack channel.

    ### Secrets

    - `MYSQL_USER`: MySQL authentication username.
    - `MYSQL_PASSWORD`: MySQL authentication password.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook endpoint URL.

    ## Quick start

    1. Configure `MYSQL_USER`, `MYSQL_PASSWORD`, and `SLACK_WEBHOOK_URL` in your Kestra namespace secrets.
    2. Import this flow YAML into your Kestra workspace.
    3. Specify your MySQL database hostname in `mysql_host`.
    4. Click **Execute** in the UI to perform an immediate buffer pool dirty page health probe.

    ## Common pitfalls and troubleshooting

    - **Adaptive Flushing Behavior**: InnoDB uses adaptive flushing (`innodb_adaptive_flushing = ON`) based on redo log checkpoint age; high dirty pages with low redo log usage might be normal during calm traffic, but ratios above 75% indicate flushing starvation.
    - **Buffer Pool Sizing**: On dedicated database servers, ensure `innodb_buffer_pool_size` is allocated between 60% and 80% of total physical RAM.

    ## How to extend

    - Correlate dirty page ratios with `Innodb_os_log_pending_writes` to detect underlying disk subsystem saturation.
    - Query `information_schema.innodb_buffer_pool_stats` across multi-instance buffer pools (`innodb_buffer_pool_instances > 1`).
    - Escalate sustained dirty page pressure to PagerDuty when dirty ratio exceeds 85% for 3 consecutive intervals.

    ## Links

    - Kestra Python Script Documentation: https://kestra.io/plugins/plugin-scripts-python/io.kestra.plugin.scripts.python.Script
    - Kestra Slack Plugin Documentation: https://kestra.io/plugins/plugin-notifications
    - MySQL InnoDB Buffer Pool Flushing: https://dev.mysql.com/doc/refman/8.0/en/innodb-buffer-pool-flushing.html
  tags:
    - Data
    - Infrastructure
  subTags:
    - Databases
    - Monitoring & Alerting
    - Day 2 Operations
  ee: false
  demo: false
