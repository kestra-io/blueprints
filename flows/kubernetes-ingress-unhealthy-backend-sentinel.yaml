id: kubernetes-ingress-unhealthy-backend-sentinel
namespace: company.sre

description: |
  Audits Kubernetes Ingress backend service endpoint readiness across production
  namespaces via Kubernetes API, identifies unready pods and blackholed routes,
  opens a prioritized GitHub SRE incident ticket, and alerts Slack.

inputs:
  - id: namespace
    type: STRING
    displayName: Target Kubernetes Namespace
    defaults: production

  - id: ingress_name
    type: STRING
    displayName: Ingress Resource Name
    defaults: primary-app-ingress

  - id: github_repository
    type: STRING
    displayName: SRE Incident Tracking Repository
    defaults: my-org/kubernetes-cluster-operations

triggers:
  - id: check_ingress_readiness_periodic
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/10 * * * *"
    disabled: true

tasks:
  - id: probe_ingress_backends
    type: io.kestra.plugin.scripts.python.Script
    description: Inspects Ingress rules and verifies backing Service endpoint pod readiness using kubernetes client
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install kubernetes kestra
    script: |
      import os
      from kubernetes import client, config
      from kestra import Kestra

      ns = "{{ inputs.namespace }}"
      ingress_name = "{{ inputs.ingress_name }}"

      # Load in-cluster or kubeconfig credentials
      try:
          config.load_incluster_config()
      except Exception:
          try:
              config.load_kube_config()
          except Exception as e:
              print(f"Kubernetes auth configuration error: {e}")

      networking_api = client.NetworkingV1Api()
      core_api = client.CoreV1Api()

      try:
          ing = networking_api.read_namespaced_ingress(name=ingress_name, namespace=ns)
      except Exception as e:
          print(f"Unable to read ingress {ingress_name}: {e}")
          raise

      unhealthy_backends = []
      total_backends = 0

      for rule in ing.spec.rules or []:
          for path in rule.http.paths or []:
              total_backends += 1
              svc_name = path.backend.service.name
              svc_port = path.backend.service.port.number or path.backend.service.port.name
              try:
                  ep = core_api.read_namespaced_endpoints(name=svc_name, namespace=ns)
                  ready_addresses = []
                  not_ready_addresses = []
                  for subset in ep.subsets or []:
                      if subset.addresses:
                          ready_addresses.extend(subset.addresses)
                      if subset.not_ready_addresses:
                          not_ready_addresses.extend(subset.not_ready_addresses)
                  
                  if not ready_addresses:
                      unhealthy_backends.append({
                          "path": path.path,
                          "service": svc_name,
                          "ready_endpoints": 0,
                          "not_ready_endpoints": len(not_ready_addresses)
                      })
              except Exception as err:
                  unhealthy_backends.append({
                      "path": path.path,
                      "service": svc_name,
                      "error": str(err)
                  })

      unhealthy_count = len(unhealthy_backends)
      print(f"Total backends: {total_backends}, Unhealthy backends: {unhealthy_count}")

      Kestra.outputs({
          "total_backends": total_backends,
          "unhealthy_count": unhealthy_count,
          "has_unhealthy": unhealthy_count > 0,
          "unhealthy_backends": unhealthy_backends
      })

  - id: branch_on_unhealthy_backends
    type: io.kestra.plugin.core.flow.If
    description: Branches based on whether any Ingress backend services lack ready endpoints
    condition: "{{ outputs.probe_ingress_backends.vars.has_unhealthy == true }}"
    then:
      - id: create_ingress_incident_issue
        type: io.kestra.plugin.github.issues.Create
        description: Logs a prioritized GitHub issue tracking Ingress routing blackholes
        oauthToken: "{{ secret('GITHUB_TOKEN') }}"
        repository: "{{ inputs.github_repository }}"
        title: "[SRE Alert] Kubernetes Ingress Unhealthy Backend Detected ({{ outputs.probe_ingress_backends.vars.unhealthy_count }} Paths Blackholed)"
        body: |
          ## 🚨 Kubernetes Ingress Traffic Blackhole Warning

          The cluster routing sentinel detected **{{ outputs.probe_ingress_backends.vars.unhealthy_count }}** Ingress paths with zero ready service endpoints in namespace `{{ inputs.namespace }}`.

          - **Ingress:** `{{ inputs.ingress_name }}`
          - **Namespace:** `{{ inputs.namespace }}`

          ### Impacted Services:
          {% for b in outputs.probe_ingress_backends.vars.unhealthy_backends %}
          - **Path:** `{{ b.path }}` $\rightarrow$ Service `{{ b.service }}` (Ready Pods: `{{ b.ready_endpoints }}`)
          {% endfor %}

          Please inspect pod crash loops and deployment replica health.
          *Generated automatically by Kestra Kubernetes Ingress Sentinel.*

      - id: alert_sre_slack
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches high-priority alert to SRE team on Slack with ticket link
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {{ {
            "text": "🚨 *Kubernetes Ingress Unhealthy Backend Detected*\n*Ingress:* `" ~ inputs.ingress_name ~ "` in `" ~ inputs.namespace ~ "`\n*Blackholed Paths:* *" ~ outputs.probe_ingress_backends.vars.unhealthy_count ~ "*\n*Triage Ticket:* <" ~ (outputs.create_ingress_incident_issue.issueUrl ?? "#") ~ "|View GitHub Issue>"
          } | toJson }}

    else:
      - id: log_ingress_healthy
        type: io.kestra.plugin.core.log.Log
        message: "All {{ outputs.probe_ingress_backends.vars.total_backends }} backends for Ingress {{ inputs.ingress_name }} have ready endpoints."

  - id: log_audit_summary
    type: io.kestra.plugin.core.log.Log
    description: Final status audit log recording Ingress backend health
    message: "Ingress health check complete for {{ inputs.ingress_name }}. Unhealthy backends: {{ outputs.probe_ingress_backends.vars.unhealthy_count }}."

errors:
  - id: alert_flow_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alerts Slack when the Ingress probe script or ticket creation encounters an error
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {{ {
        "text": "⚠️ *Kubernetes Ingress Sentinel Failed* in execution `" ~ execution.id ~ "`. Unable to query endpoints in namespace `" ~ inputs.namespace ~ "`."
      } | toJson }}

extend:
  title: "Kubernetes Ingress Unhealthy Backend and Blackhole Sentinel"
  shortDescription: "Audit Kubernetes Ingress routes, detect service endpoints with zero ready pods, file GitHub issues, and alert Slack."
  metaTitle: "Kubernetes Ingress Backend Health Sentinel with Kestra"
  metaDescription: "Monitor Kubernetes Ingress backends and prevent HTTP 502 routing blackholes with Kestra. Query endpoints, log GitHub issues, and alert SRE on Slack."
  description: |
    Kubernetes Ingress controllers route external HTTP/HTTPS traffic to internal microservices based on declarative hostname and path rules. However, when backing deployment pods fail readiness probes, crash repeatedly, or experience deployment rollout deadlocks, the backing Kubernetes Service has zero active endpoints, causing the Ingress controller to return immediate HTTP 502 or 503 errors to clients. This blueprint audits Kubernetes Ingress rules and verifies that backing Service endpoints have healthy, ready pods, logs an automated GitHub incident ticket, and alerts on-call SREs via Slack.

    ## How it works

    1. `check_ingress_readiness_periodic` (`io.kestra.plugin.core.trigger.Schedule`) initiates the audit every 10 minutes (shipped disabled for safe verification).
    2. `probe_ingress_backends` (`io.kestra.plugin.scripts.python.Script`) uses the official Kubernetes Python SDK to read Ingress routing rules and inspect corresponding `Endpoints` or `EndpointSlices` in the cluster.
    3. `branch_on_unhealthy_backends` (`io.kestra.plugin.core.flow.If`) evaluates whether any Ingress paths point to services with zero ready pod addresses (`has_unhealthy == true`):
       - `then`: Automatically files a GitHub tracking issue via `create_ingress_incident_issue` (`io.kestra.plugin.github.issues.Create`) and alerts the Slack channel via `alert_sre_slack` (`io.kestra.plugin.slack.notifications.SlackIncomingWebhook`).
       - `else`: Emits an informational log entry (`log_ingress_healthy`) confirming full backend readiness.
    4. `log_audit_summary` (`io.kestra.plugin.core.log.Log`) records the final health summary.
    5. The `errors` block alerts Slack if Kubernetes API credentials or network connectivity fails.

    ## What you get

    - Automated, scheduled auditing of Kubernetes ingress routing paths.
    - Immediate detection of silent traffic blackholes and broken upstream services.
    - Consolidated GitHub incident tickets with specific Ingress paths and service names.
    - Real-time Slack notifications with direct ticket hyperlinks.

    ## Who it's for

    - Platform Engineers and Kubernetes SREs managing cluster ingress controllers (Nginx, Traefik, AWS ALB).
    - DevOps engineers deploying microservices to production namespaces.
    - Cloud Infrastructure leads ensuring high service availability.

    ## Why orchestrate this with Kestra

    Kestra coordinates Kubernetes API interaction, multi-layer endpoint health validation, conditional incident escalation, and team alerting in a single declarative workflow. It manages cluster credentials securely, provides complete execution history, and eliminates the need for separate standalone monitoring daemons.

    ## Prerequisites

    - A Kubernetes cluster with an active Ingress controller.
    - A ServiceAccount, kubeconfig, or IAM role with read permissions on `ingresses` and `endpoints`.
    - A GitHub Personal Access Token with repository issue creation permissions.
    - A Slack incoming webhook URL for notifications.

    ### Secrets

    - `KUBECONFIG` (or in-cluster ServiceAccount): Authentication credentials for Kubernetes API.
    - `GITHUB_TOKEN`: GitHub token used to open incident issues.
    - `SLACK_WEBHOOK`: Incoming Webhook URL for alerting.

    ## Inputs

    - `namespace` (STRING, default `production`): Kubernetes namespace hosting the Ingress and services.
    - `ingress_name` (STRING, default `primary-app-ingress`): Name of the Ingress resource to audit.
    - `github_repository` (STRING, default `my-org/kubernetes-cluster-operations`): Target GitHub repository for logging incident issues.

    ## Outputs

    - `outputs.probe_ingress_backends.vars.total_backends`: Total number of Ingress routing paths inspected.
    - `outputs.probe_ingress_backends.vars.unhealthy_count`: Number of paths pointing to services without ready pods.
    - `outputs.probe_ingress_backends.vars.unhealthy_backends`: List of unhealthy backend objects (`path`, `service`, `ready_endpoints`).

    ## Quick start

    1. Configure `GITHUB_TOKEN` and `SLACK_WEBHOOK` in your Kestra namespace.
    2. Import this flow and set `namespace` and `ingress_name` to match an existing Ingress resource.
    3. Run the flow manually to verify Ingress inspection and Slack notification delivery.
    4. Enable the `check_ingress_readiness_periodic` trigger for continuous routing health monitoring.

    ## How to extend

    - Add an automated rollout restart task (`kubectl rollout restart deployment/<svc>`) to attempt automatic recovery.
    - Integrate with Prometheus metrics to cross-reference HTTP 502/503 error rates.
    - Loop over multiple Ingress resources across all production namespaces using `io.kestra.plugin.core.flow.ForEach`.

    ## Links

    - [Kubernetes Ingress Documentation](https://kubernetes.io/docs/concepts/services-networking/ingress/)
    - [Kestra Python Script Plugin](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra GitHub Plugin](https://kestra.io/plugins/plugin-github)
    - [Kestra Slack Plugin](https://kestra.io/plugins/plugin-slack)

  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Monitoring & Alerting
  ee: false
  demo: false
