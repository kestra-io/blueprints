id: idle-elb-finder
namespace: company.finops

description: |
  Finds idle load balancers burning money. An ALB/NLB costs ~$16-22/month before
  a single request is served, and forgotten test environments leave them running
  for months. This flow checks 14 days of CloudWatch traffic per load balancer
  across your regions and reports the idle ones with estimated savings.

inputs:
  - id: aws_regions
    type: ARRAY
    itemType: STRING
    defaults: ["us-east-1"]
    description: AWS regions to audit for idle load balancers.
  - id: traffic_window_days
    type: INT
    defaults: 14
    description: Lookback window in days for the traffic check.
  - id: monthly_cost_usd
    type: STRING
    defaults: "18.00"
    description: Monthly cost of one load balancer in USD (ALB/NLB base charge estimate).

tasks:
  - id: find_idle
    type: io.kestra.plugin.core.flow.ForEach
    description: Audit load balancers region by region.
    values: "{{ inputs.aws_regions }}"
    tasks:
      - id: audit_region
        type: io.kestra.plugin.aws.cli.AwsCLI
        description: List LBs and check CloudWatch request counts over the window.
        commands:
          - |
            REGION="{{ taskrun.value }}"
            DAYS={{ inputs.traffic_window_days }}
            PRICE="{{ inputs.monthly_cost_usd }}"
            END=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            START=$(date -u -d "$DAYS days ago" +%Y-%m-%dT%H:%M:%SZ)
            PERIOD=$((DAYS * 86400))
            echo "Checking load balancers in $REGION (traffic window: last $DAYS days)"
            aws elbv2 describe-load-balancers --region "$REGION" \
              --query 'LoadBalancers[].[LoadBalancerArn,DNSName,Type]' \
              --output text > /tmp/lbs.txt || true
            IDLE_COUNT=0
            IDLE_LIST=""
            while read -r ARN DNS TYPE; do
              [ -z "$ARN" ] && continue
              NAME=$(echo "$ARN" | cut -d'/' -f3)
              if [ "$TYPE" = "application" ]; then
                METRIC="RequestCount"
              else
                METRIC="ProcessedBytes"
              fi
              REQ=$(aws cloudwatch get-metric-statistics --region "$REGION" \
                --namespace AWS/ApplicationELB \
                --metric-name "$METRIC" \
                --dimensions Name=LoadBalancer,Value="$(echo "$ARN" | cut -d'/' -f2-)" \
                --start-time "$START" --end-time "$END" \
                --period "$PERIOD" --statistics Sum \
                --query 'Datapoints[0].Sum' --output text 2>/dev/null)
              case "$REQ" in ''|'None') REQ=0;; esac
              REQ_INT=${REQ%.*}
              echo "lb $NAME ($TYPE): ${REQ_INT} requests/bytes in ${DAYS}d"
              if [ "$REQ_INT" -eq 0 ]; then
                IDLE_LIST="${IDLE_LIST}${NAME} (${TYPE}), "
                IDLE_COUNT=$((IDLE_COUNT + 1))
              fi
            done < /tmp/lbs.txt
            SAVINGS=$(python3 -c "print('{:.2f}'.format($IDLE_COUNT * float('$PRICE')))")
            if [ "$IDLE_COUNT" -gt 0 ]; then HAS_IDLE=true; else HAS_IDLE=false; fi
            echo "HAS_IDLE=$HAS_IDLE"
            echo "IDLE_COUNT=$IDLE_COUNT"
            echo "IDLE_LBS=$IDLE_LIST"
            echo "EST_MONTHLY_SAVINGS=$SAVINGS"
            echo "REGION_DONE=$REGION"
        env:
          AWS_ACCESS_KEY_ID: "{{ secret('AWS_ACCESS_KEY_ID') }}"
          AWS_SECRET_ACCESS_KEY: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
          AWS_DEFAULT_REGION: "{{ taskrun.value }}"
      - id: notify_region
        type: io.kestra.plugin.core.flow.If
        description: Alert on idle load balancers, stay quiet when all serve traffic.
        condition: "{{ outputs.audit_region.vars.HAS_IDLE == 'true' }}"
        then:
          - id: slack_idle
            type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
            url: "{{ secret('SLACK_WEBHOOK_URL') }}"
            payload: |
              {
                "text": ":money_with_wings: Idle load balancers in `{{ outputs.audit_region.vars.REGION_DONE }}` — *{{ outputs.audit_region.vars.IDLE_COUNT }}* with zero traffic in 14 days, ~${{ outputs.audit_region.vars.EST_MONTHLY_SAVINGS }}/mo waste.\n`{{ outputs.audit_region.vars.IDLE_LBS }}`\nDelete them in the EC2 console (check target groups and DNS records pointing at them first!)."
              }
        else:
          - id: log_busy
            type: io.kestra.plugin.core.log.Log
            message: "No idle load balancers in {{ outputs.audit_region.vars.REGION_DONE }} — every LB served traffic in the window."

triggers:
  - id: weekly
    type: io.kestra.plugin.core.trigger.Schedule
    description: Weekly on Sunday at 02:00 UTC. Shipped disabled; enable after your first manual run.
    cron: "0 2 * * 0"
    disabled: true

extend:
  title: Idle Load Balancer Finder
  metaTitle: Find Idle Load Balancers Wasting Money | Kestra
  shortDescription: Audit ALB/NLB load balancers across regions, check 14 days of CloudWatch traffic per LB, and get a Slack report of the idle ones with estimated savings.
  metaDescription: Idle load balancers cost ~$16-22/mo each. This flow finds the zero-traffic ones via CloudWatch and reports the waste weekly.
  description: |
    An Application or Network Load Balancer costs roughly $16–22/month in base charges before serving a single request — and forgotten test environments, abandoned staging stacks, and migrated services leave them running for months. This blueprint finds them with real traffic data.

    ## How it works

    1. A Schedule trigger fires weekly on Sunday at 02:00 UTC (shipped disabled).
    2. A ForEach loop audits each region in `aws_regions`.
    3. Per region, the flow lists v2 load balancers, then pulls the full-window `RequestCount` (ALB) or `ProcessedBytes` (NLB) CloudWatch metric per LB.
    4. LBs with zero traffic in the window are flagged idle, and monthly waste is estimated at the LB base price.
    5. An `If` task posts a Slack alert with the idle LB names only when something is actually idle — no spam on clean weeks.

    ## What you get

    - A weekly list of load balancers serving zero traffic, with type and evidence.
    - A dollar estimate of the waste, so the cleanup gets prioritized.
    - Multi-region coverage in one run.
    - Silence when everything serves traffic — alerts only on real findings.

    ## Who it's for

    Platform engineers and FinOps teams with more than a handful of environments, where test LBs outlive the tests.

    ## Why orchestrate this with Kestra

    A one-off CLI session finds today's waste and is forgotten by next month. As a scheduled Kestra flow the audit runs itself, the traffic window is an input anyone can tune, every run is logged for audit, and adding a region is one list entry — not a new script.

    ## Prerequisites

    - AWS credentials with `elasticloadbalancing:DescribeLoadBalancers` and `cloudwatch:GetMetricStatistics` permissions.
    - A Slack incoming webhook URL.

    ### Secrets

    - `AWS_ACCESS_KEY_ID`: AWS access key for the ELB and CloudWatch API calls.
    - `AWS_SECRET_ACCESS_KEY`: AWS secret key for the ELB and CloudWatch API calls.
    - `SLACK_WEBHOOK_URL`: Incoming webhook URL for the idle-LB alert.

    ## Quick start

    1. Add the three secrets above to your Kestra namespace.
    2. Set `aws_regions` to the regions you run load balancers in.
    3. Run manually once and review the Slack report (or the clean log line).
    4. Enable the weekly schedule trigger.

    ## How to extend

    - Also cover Classic Load Balancers via `aws elb describe-load-balancers`.
    - Exclude LBs tagged `Keep=true` for known standby setups.
    - Check target-group health before flagging, to avoid noise from blue/green pairs.

    ## Links

    - [Kestra AWS plugins](https://kestra.io/plugins)
    - [Kestra Slack plugins](https://kestra.io/plugins)
    - [ELB pricing](https://aws.amazon.com/elasticloadbalancing/pricing/)
    - [CloudWatch get-metric-statistics API](https://docs.aws.amazon.com/cli/latest/reference/cloudwatch/get-metric-statistics.html)
  tags:
    - Infrastructure
  subTags:
    - FinOps & Cost Management
    - Monitoring & Alerting
  ee: false
  demo: false
