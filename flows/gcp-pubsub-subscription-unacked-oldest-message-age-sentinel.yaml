id: gcp-pubsub-subscription-unacked-oldest-message-age-sentinel
namespace: company.cloud

description: Audits Google Cloud Pub/Sub subscriptions for oldest unacknowledged message age spikes and consumer backlog.

concurrency:
  limit: 1

inputs:
  - id: gcpProjectId
    type: STRING
    displayName: GCP Project ID
    defaults: my-gcp-production-project
    description: Google Cloud project ID hosting the Pub/Sub subscription.

  - id: subscriptionId
    type: STRING
    displayName: Pub/Sub Subscription ID
    defaults: telemetry-events-processor-sub
    description: Name of the Pub/Sub subscription to audit.

  - id: maxOldestUnackedAgeSeconds
    type: INT
    displayName: Max Oldest Unacked Age (Seconds)
    defaults: 300
    description: Threshold in seconds for oldest unacknowledged message before alerting consumer lag.

  - id: serviceAccountKey
    type: SECRET
    displayName: GCP Service Account Key
    defaults: "{}"
    description: Encrypted Google Cloud service account JSON key with Monitoring Viewer permissions.

  - id: slackWebhookUri
    type: SECRET
    displayName: Slack Webhook URI
    defaults: https://hooks.slack.com/services/T00/B00/XXXX
    description: Encrypted Slack Incoming Webhook endpoint for alerting streaming operations teams.

tasks:
  - id: evaluate_unacked_message_age
    type: io.kestra.plugin.scripts.python.Script
    description: Queries Google Cloud Monitoring for subscription oldest unacked message age.
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install google-cloud-monitoring
    env:
      GCP_PROJECT_ID: "{{ inputs.gcpProjectId }}"
      GCP_SA_KEY: "{{ inputs.serviceAccountKey }}"
    script: |
      import os
      import json
      import time
      from google.cloud import monitoring_v3
      from google.oauth2 import service_account

      project_id = os.getenv('GCP_PROJECT_ID')
      subscription_id = "{{ inputs.subscriptionId }}"
      max_age_threshold = {{ inputs.maxOldestUnackedAgeSeconds }}

      sa_key_json = os.getenv('GCP_SA_KEY')
      if sa_key_json and sa_key_json != "{}":
          key_dict = json.loads(sa_key_json)
          creds = service_account.Credentials.from_service_account_info(key_dict)
          client = monitoring_v3.MetricServiceClient(credentials=creds)
      else:
          client = monitoring_v3.MetricServiceClient()

      project_name = f"projects/{project_id}"
      now = time.time()
      interval = monitoring_v3.TimeInterval(
          {
              "end_time": {"seconds": int(now)},
              "start_time": {"seconds": int(now - 600)},
          }
      )

      filter_str = (
          'metric.type = "pubsub.googleapis.com/subscription/oldest_unacked_message_age" '
          f'AND resource.labels.subscription_id = "{subscription_id}"'
      )

      results = client.list_time_series(
          request={
              "name": project_name,
              "filter": filter_str,
              "interval": interval,
              "view": monitoring_v3.ListTimeSeriesRequest.TimeSeriesView.FULL,
          }
      )

      oldest_age_seconds = 0
      for series in results:
          for point in series.points:
              val = point.value.int64_value
              if val > oldest_age_seconds:
                  oldest_age_seconds = val

      is_lagging = oldest_age_seconds >= max_age_threshold

      report = {
          'project_id': project_id,
          'subscription_id': subscription_id,
          'oldest_age_seconds': oldest_age_seconds,
          'threshold_seconds': max_age_threshold,
          'is_lagging': is_lagging,
          'recommended_action': f'gcloud pubsub subscriptions seek {subscription_id} --time=... or scale consumer workers' if is_lagging else 'Consumers processing in real-time.'
      }

      with open('pubsub_lag_report.json', 'w') as f:
          json.dump(report, f)

      print(f'Pub/Sub Subscription {subscription_id}: Oldest unacked age is {oldest_age_seconds}s (Threshold: {max_age_threshold}s).')

  - id: check_unacked_age_breach
    type: io.kestra.plugin.core.flow.If
    description: Branch execution based on whether oldest unacked message age breached threshold.
    condition: "{{ json(read('pubsub_lag_report.json')).is_lagging }}"
    then:
      - id: notify_slack_subscription_lag
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches consumer starvation alert to streaming operations team on Slack.
        url: "{{ inputs.slackWebhookUri }}"
        payload: |
          {
            "text": "GCP Pub/Sub Backlog Alert: Subscription *{{ json(read('pubsub_lag_report.json')).subscription_id }}* has lagging unacknowledged messages! Oldest message age: {{ json(read('pubsub_lag_report.json')).oldest_age_seconds }}s (Limit: {{ inputs.maxOldestUnackedAgeSeconds }}s). Recommended remediation: {{ json(read('pubsub_lag_report.json')).recommended_action }}"
          }
    else:
      - id: log_healthy_subscription
        type: io.kestra.plugin.core.log.Log
        description: Logs healthy processing telemetry when message age remains nominal.
        message: "Pub/Sub subscription {{ json(read('pubsub_lag_report.json')).subscription_id }} is healthy with oldest unacked age of {{ json(read('pubsub_lag_report.json')).oldest_age_seconds }}s."

  - id: export_subscription_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Exports structured Pub/Sub subscription health report.
    format: "{{ json(read('pubsub_lag_report.json')) }}"

triggers:
  - id: five_minute_pubsub_lag_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: Scheduled audit polling subscription lag every five minutes.
    cron: "*/5 * * * *"

extend:
  title: GCP Pub/Sub Subscription Unacked Oldest Message Age Sentinel
  shortDescription: Monitors Google Cloud Pub/Sub subscriptions for oldest unacknowledged message age spikes to prevent pipeline stall.
  metaTitle: GCP Pub/Sub Subscription Unacked Oldest Message Age Sentinel | Kestra
  metaDescription: Audits Google Cloud Pub/Sub subscriptions for oldest unacked message age spikes, evaluates consumer lag, and alerts streaming ops teams via Slack.
  description: |
    Audits Google Cloud Pub/Sub pull and push subscriptions for consumer starvation and unacknowledged message staleness.

    ## How it works
    1. Triggers every 5 minutes on schedule to monitor streaming event pipelines.
    2. Runs a containerized Python script querying Google Cloud Monitoring for metric `pubsub.googleapis.com/subscription/oldest_unacked_message_age`.
    3. Evaluates historical metric points over a 10-minute sliding window to identify peak message backlog duration.
    4. Evaluates if the oldest unacknowledged message age exceeds SLA limits using an `If` conditional task.
    5. Dispatches an incident alert to Slack with the subscription ID and remediation guidance if workers are lagging.
    6. Logs nominal latency and exports a telemetry manifest for compliance audit trails.

    ## Architecture diagram
    ```mermaid
    flowchart TD
        A[Schedule Trigger: Every 5 Minutes] --> B[Task: evaluate_unacked_message_age]
        B --> C{Task: check_unacked_age_breach}
        C -- Threshold Breached --> D[Task: notify_slack_subscription_lag]
        C -- Healthy Processing --> E[Task: log_healthy_subscription]
        D --> F[Task: export_subscription_manifest]
        E --> F
    ```

    ## What you get
    - Real-time detection of lagging or stalled consumers across Google Cloud Pub/Sub subscriptions.
    - Proactive isolation of poison-pill messages blocking FIFO or sequential processing queues.
    - Actionable Slack notifications including subscriber scaling recommendations and gcloud seek commands.
    - Exported JSON metrics enabling automated downstream subscriber autoscaling triggers.

    ## Who it's for
    - Data Engineers maintaining high-throughput Pub/Sub streaming ingestion into BigQuery or Snowflake.
    - Streaming Platform Engineers monitoring consumer subscriber health and message retention windows.
    - SRE teams responsible for real-time order processing, IoT telemetry, and event-driven architectures.

    ## Why orchestrate this with Kestra
    Google Cloud Monitoring alerts can notify on metric thresholds, but lack the capability to orchestrate multi-step triage workflows, correlate message age with subscriber counts, or format tailored Slack remediation payloads with contextual seek commands. Kestra delivers a lightweight, schedule-driven declarative pipeline with secure service account injection, conditional routing, and audit persistence without maintaining dedicated agent daemons.

    ## Use cases
    - **Dead Consumer Worker Detection**: Detect when downstream subscriber worker pods crash or lock up without acknowledging incoming messages.
    - **Poison Pill Message Quarantine**: Identify single corrupted messages blocking subscription progress in synchronous sequential processing queues.
    - **Autoscaling Inadequacy Alarming**: Catch consumer processing throughput deficiencies before message retention expires in Pub/Sub topics.

    ## Inputs
    | Name | Type | Default | Description |
    | --- | --- | --- | --- |
    | `gcpProjectId` | `STRING` | `my-gcp-production-project` | Google Cloud project ID hosting the Pub/Sub subscription. |
    | `subscriptionId` | `STRING` | `telemetry-events-processor-sub` | Name of the Pub/Sub subscription to audit. |
    | `maxOldestUnackedAgeSeconds` | `INT` | `300` | Threshold in seconds for oldest unacknowledged message before alerting consumer lag. |
    | `serviceAccountKey` | `SECRET` | `None` | Encrypted Google Cloud service account JSON key with Monitoring Viewer permissions. |
    | `slackWebhookUri` | `SECRET` | `None` | Encrypted Slack Incoming Webhook endpoint for alerting streaming operations teams. |

    ## Expected outputs
    Primary execution outputs exported by `export_subscription_manifest`:
    - `project_id`: Target Google Cloud project identifier.
    - `subscription_id`: Inspected Pub/Sub subscription name.
    - `oldest_age_seconds`: Age in seconds of the oldest unacknowledged message.
    - `is_lagging`: Boolean flag indicating if threshold was breached.
    - `recommended_action`: CLI remediation command or scaling recommendation.

    Example expression: `{{ outputs.export_subscription_manifest.value.is_lagging }}`

    ## Prerequisites
    - Google Cloud project with enabled Pub/Sub and Cloud Monitoring APIs.
    - Service account granted `roles/monitoring.viewer` permissions.
    - Slack Incoming Webhook URL stored in Kestra secrets.

    ### Secrets
    - `GCP_SA_KEY`: Service account credentials in JSON format.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL.

    ## Quick start
    1. Register your Google Cloud Service Account JSON key as a Kestra secret.
    2. Deploy this flow into your production Kestra namespace.
    3. Configure `gcpProjectId` and `subscriptionId` to match your streaming ingestion pipeline.
    4. Run the workflow manually to verify Cloud Monitoring metric extraction.

    ## Common pitfalls and troubleshooting
    - **Metric Ingestion Delay**: Cloud Monitoring time series data can have a 60 to 120-second ingestion lag. Ensure the query window covers at least 10 minutes.
    - **Zero Unacked Messages**: If the subscription queue is empty, Cloud Monitoring returns zero points. The script sets `oldest_age_seconds` to 0 to prevent false alarms.
    - **Push vs Pull Subscriptions**: This metric applies equally to both Pull subscriptions and Push subscriptions with failing HTTP endpoints.

    ## How to extend
    - **Automated Consumer Autoscaling**: Trigger an HTTP task calling Kubernetes API to scale subscriber replica deployments automatically.
    - **Dead Letter Topic Forwarding**: Initiate a workflow to move toxic messages to a dead-letter topic when lag persists.
    - **Multi-Subscription Auditing**: Loop through an array of critical subscriptions across topics using `io.kestra.plugin.core.flow.ForEach`.

    ## Links
    - [Google Cloud Pub/Sub Monitoring Metrics](https://cloud.google.com/pubsub/docs/monitoring)
    - [Google Cloud Monitoring Python Client](https://cloud.google.com/python/docs/reference/monitoring/latest)
    - [Kestra Python Script Plugin](https://kestra.io/plugins/plugin-scripts/python/io.kestra.plugin.scripts.python.script)
    - [Kestra Slack Notification Plugin](https://kestra.io/plugins/plugin-slack/notifications/io.kestra.plugin.slack.notifications.slackincomingwebhook)
  tags:
    - Cloud
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - Realtime & Streaming
  ee: false
  demo: false
