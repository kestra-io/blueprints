id: dailymed-drug-label-safety-change-watch
namespace: company.team

description: |
  Weekly watch on the safety sections of the drug labels on your formulary, using the keyless NLM DailyMed
  web services v2. Drug names, NDCs and set IDs are resolved to SPL set IDs, each set's version is kept in KV,
  and only labels whose version moved are downloaded as SPL XML. Python (standard-library xml) hashes the Boxed
  Warning, Contraindications, Warnings and Precautions and Recent Major Changes sections; DuckDB diffs the hashes,
  flags edits to safety sections as HIGH and other version bumps as INFO, and groups the labelers of each drug
  into safety-text variants so labels still carrying older wording stand out.

inputs:
  - id: watchlist
    type: ARRAY
    itemType: STRING
    defaults:
      - Eliquis
      - warfarin | Teva; Upsher-Smith; Amneal; Sun Pharmaceutical
      - Clozaril
      - isotretinoin | Mylan; Amneal; Teva
      - ndc=0169-4132-12
      - setid=9d1ff786-e577-410a-a273-c4d7d0e4e975
    description: |
      One entry per drug. A plain name is searched as `drug_name` (brand or generic), `ndc=` as an NDC (product or
      package code with dashes) and `setid=` as an SPL set ID. Add `| labeler; labeler` to keep only the labels whose
      labeler contains one of these words, e.g. the manufacturers you buy from instead of every repackager.

  - id: doctype
    type: STRING
    defaults: 34391-3
    description: LOINC document type applied to name searches. 34391-3 is Human Prescription Drug Label (OTC monographs and animal labels are skipped). Leave empty for all types.

  - id: max_pages
    type: INT
    defaults: 3
    min: 1
    max: 20
    description: Pages of 100 set IDs read per name. Common generics have 100 to 300 labels, most of them repackagers.

  - id: max_sets_per_entry
    type: INT
    defaults: 25
    min: 1
    max: 100
    description: Most recently published labels kept per entry after the labeler filter. Bounds the number of XML downloads on a first run.

  - id: notify_info
    type: BOOL
    defaults: false
    description: Also post a Slack message when only INFO changes happened (version bumps without a safety edit, new or delisted labels).

  - id: state_key
    type: STRING
    defaults: dailymed_label_watch
    description: KV key holding the per-setid versions and section hashes. Use one key per formulary.

triggers:
  - id: weekly
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 6 * * 1"
    description: Monday 06:00 UTC. DailyMed publishes label updates every day; a weekly pass fits a formulary or P&T review cycle.

tasks:
  - id: state
    type: io.kestra.plugin.core.kv.Get
    key: "{{ inputs.state_key }}"
    errorOnMissing: false
    description: Per-setid state from the previous run. Missing on the first run, which is a BASELINE run.

  - id: plan
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: |
      Parses the watchlist into DailyMed queries. Malformed NDCs or set IDs, names shorter than three characters and
      duplicates are skipped with a reason; an empty query would list every SPL in DailyMed, so it is never sent.
    url: "jdbc:duckdb:"
    fetchType: FETCH_ONE
    parameters:
      watchlist: "{{ inputs.watchlist | toJson }}"
      doctype: "{{ inputs.doctype ?? '' }}"
      max_pages: "{{ inputs.max_pages }}"
    sql: |
      CREATE TABLE raw AS
      SELECT i, trim(list_extract(l, i)) AS entry
      FROM (SELECT from_json(:watchlist, '["VARCHAR"]') AS l) AS w, generate_series(1, len(l)) AS g(i)
      WHERE trim(coalesce(list_extract(l, i), '')) <> '';

      CREATE TABLE parsed AS
      SELECT i, entry, head, labelers,
             CASE WHEN lower(head) LIKE 'ndc=%' THEN 'ndc' WHEN lower(head) LIKE 'setid=%' THEN 'setid' ELSE 'name' END AS kind,
             trim(CASE WHEN lower(head) LIKE 'ndc=%' OR lower(head) LIKE 'setid=%' OR lower(head) LIKE 'name=%'
                       THEN substr(head, strpos(head, '=') + 1) ELSE head END) AS value
      FROM (SELECT i, entry, trim(split_part(entry, '|', 1)) AS head,
                   list_filter(list_transform(string_split(split_part(entry, '|', 2), ';'), x -> lower(trim(x))), x -> x <> '') AS labelers
            FROM raw) AS t;

      CREATE TABLE checked AS
      SELECT *,
             CASE WHEN row_number() OVER (PARTITION BY lower(kind), lower(value), CAST(labelers AS VARCHAR) ORDER BY i) > 1 THEN 'duplicate entry'
                  WHEN kind = 'setid' AND NOT regexp_full_match(value, '[0-9A-Fa-f]{8}-([0-9A-Fa-f]{4}-){3}[0-9A-Fa-f]{12}') THEN 'set ID is not a UUID'
                  WHEN kind = 'ndc' AND NOT regexp_full_match(value, '[0-9]{4,5}-[0-9]{3,4}(-[0-9]{1,2})?') THEN 'NDC must look like 0169-4132 or 0169-4132-12'
                  WHEN kind = 'name' AND length(value) < 3 THEN 'name shorter than 3 characters'
             END AS invalid_reason
      FROM parsed;

      SELECT
        (SELECT count(*) FROM checked) AS entries,
        (SELECT count(*) FROM checked WHERE invalid_reason IS NOT NULL) AS invalid_entries,
        (SELECT coalesce(string_agg('"' || entry || '" (' || invalid_reason || ')', '; ' ORDER BY i), '') FROM checked WHERE invalid_reason IS NOT NULL) AS invalid_list,
        (SELECT CAST(coalesce(json_group_array(json_object(
            'i', i, 'entry', entry, 'kind', kind, 'labelers', labelers, 'max_pages', CAST(:max_pages AS INTEGER),
            'drug_name', CASE WHEN kind = 'name' THEN value ELSE '' END,
            'ndc', CASE WHEN kind = 'ndc' THEN value ELSE '' END,
            'setid', CASE WHEN kind = 'setid' THEN lower(value) ELSE '' END,
            'doctype', CASE WHEN kind = 'name' THEN :doctype ELSE '' END)), '[]') AS VARCHAR)
           FROM checked WHERE invalid_reason IS NULL) AS queries;

  - id: resolve
    type: io.kestra.plugin.core.flow.Loop
    description: |
      One `/spls.json` lookup per entry, one at a time. Each item carries its whole query because Loop iterations run in
      their own context. Only set ID, version, published date and title are kept from each page.
    values: "{{ outputs.plan.outputs[0].row.queries }}"
    concurrencyLimit: 1
    tasks:
      - id: first_page
        type: io.kestra.plugin.core.http.Download
        uri: https://dailymed.nlm.nih.gov/dailymed/services/v2/spls.json
        params:
          drug_name: "{{ fromJson(item.value).drug_name }}"
          doctype: "{{ fromJson(item.value).doctype }}"
          ndc: "{{ fromJson(item.value).ndc }}"
          setid: "{{ fromJson(item.value).setid }}"
          pagesize: "100"
          page: "1"
        headers:
          User-Agent: "kestra-dailymed-drug-label-safety-change-watch/1.0 (https://kestra.io)"
        options:
          retryOnStatusCodes: [429, 500, 502, 503, 504]
          retry:
            type: exponential
            interval: PT5S
            maxInterval: PT1M
            maxAttempts: 4

      - id: more_pages
        type: io.kestra.plugin.core.flow.If
        description: Names with more than 100 labels read the next pages, up to `max_pages`.
        condition: "{{ fromJson(read(outputs.first_page.uri)).metadata.total_pages > 1 and fromJson(item.value).max_pages > 1 }}"
        then:
          - id: pages
            type: io.kestra.plugin.core.flow.Loop
            values: "{{ range(2, min(fromJson(read(outputs.first_page.uri)).metadata.total_pages, fromJson(item.parent.value ?? item.value).max_pages)) }}"
            concurrencyLimit: 1
            tasks:
              - id: page
                type: io.kestra.plugin.core.http.Download
                uri: https://dailymed.nlm.nih.gov/dailymed/services/v2/spls.json
                params:
                  drug_name: "{{ fromJson(item.parent.value).drug_name }}"
                  doctype: "{{ fromJson(item.parent.value).doctype }}"
                  ndc: "{{ fromJson(item.parent.value).ndc }}"
                  setid: "{{ fromJson(item.parent.value).setid }}"
                  pagesize: "100"
                  page: "{{ item.value }}"
                headers:
                  User-Agent: "kestra-dailymed-drug-label-safety-change-watch/1.0 (https://kestra.io)"
                options:
                  retryOnStatusCodes: [429, 500, 502, 503, 504]
                  retry:
                    type: exponential
                    interval: PT5S
                    maxInterval: PT1M
                    maxAttempts: 4
            outputs:
              - id: rows
                type: JSON
                value: "{{ fromJson(read(outputs.page.uri)) | jq('[.data[] | [.setid, .spl_version, .published_date, .title]]') | first }}"
    outputs:
      - id: result
        type: JSON
        value: |
          {{ {
            'i': fromJson(item.value).i,
            'total': fromJson(read(outputs.first_page.uri)).metadata.total_elements ?? 0,
            'db_published': fromJson(read(outputs.first_page.uri)).metadata.db_published_date ?? '',
            'rows': (fromJson(read(outputs.first_page.uri)) | jq('[.data[] | [.setid, .spl_version, .published_date, .title]]') | first)
                    | merge((outputs.pages.outputs ?? []) | jq('[.[].outputs.rows[]]') | first)
          } | toJson }}

  - id: select
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: |
      Applies the labeler filter, keeps the newest `max_sets_per_entry` labels per entry, merges set IDs reached by more
      than one entry, and compares each set's `spl_version` with the stored one. Only new sets and sets whose version
      moved are downloaded. A stored set that is no longer listed for a fully read entry is reported as NOT_LISTED.
    url: "jdbc:duckdb:"
    fetchType: FETCH_ONE
    outputFiles:
      - sets_parquet
      - entries_parquet
      - prev_parquet
    parameters:
      queries: "{{ outputs.plan.outputs[0].row.queries }}"
      resolved: "{{ (outputs.resolve.outputs ?? []) | jq('[.[].outputs.result]') | first | toJson }}"
      state: "{{ (outputs.state.value ?? []) | toJson }}"
      max_sets: "{{ inputs.max_sets_per_entry }}"
    sql: |
      SET TimeZone = 'UTC';
      CREATE TABLE ent AS
      SELECT CAST(json_extract_string(q, '$.i') AS INTEGER) AS i, json_extract_string(q, '$.entry') AS entry,
             json_extract_string(q, '$.kind') AS kind, from_json(json_extract(q, '$.labelers'), '["VARCHAR"]') AS labelers
      FROM (SELECT unnest(from_json(:queries, '["JSON"]')) AS q);

      CREATE TABLE res AS
      SELECT CAST(json_extract_string(r, '$.i') AS INTEGER) AS i, CAST(json_extract_string(r, '$.total') AS INTEGER) AS total,
             json_extract_string(r, '$.db_published') AS db_published,
             from_json(json_extract(r, '$.rows'), '["JSON"]') AS rows
      FROM (SELECT unnest(from_json(:resolved, '["JSON"]')) AS r);

      CREATE TABLE listed AS
      SELECT e.i, e.entry, e.labelers, json_extract_string(x, '$[0]') AS setid, CAST(json_extract_string(x, '$[1]') AS INTEGER) AS version,
             CAST(strptime(json_extract_string(x, '$[2]'), '%b %d, %Y') AS DATE) AS published, json_extract_string(x, '$[3]') AS title,
             trim(regexp_extract(json_extract_string(x, '$[3]'), '\[([^\[]*)\]\s*$', 1)) AS labeler
      FROM ent e JOIN res r USING (i), unnest(r.rows) AS t(x);

      CREATE TABLE kept AS
      SELECT * FROM (
        SELECT *, row_number() OVER (PARTITION BY i ORDER BY published DESC, version DESC, setid) AS rn
        FROM listed
        WHERE len(labelers) = 0 OR len(list_filter(labelers, l -> contains(lower(labeler), l))) > 0)
      WHERE rn <= CAST(:max_sets AS INTEGER);

      CREATE TABLE entry_stats AS
      SELECT e.i, e.entry, e.kind, coalesce(r.total, 0) AS listed_total,
             (SELECT count(*) FROM listed l WHERE l.i = e.i) AS read_rows,
             (SELECT count(*) FROM listed l WHERE l.i = e.i AND (len(l.labelers) = 0 OR len(list_filter(l.labelers, x -> contains(lower(l.labeler), x))) > 0)) AS matched,
             (SELECT count(*) FROM kept k WHERE k.i = e.i) AS kept,
             coalesce(r.total, 0) <= (SELECT count(*) FROM listed l WHERE l.i = e.i) AS fully_read
      FROM ent e LEFT JOIN res r USING (i);

      CREATE TABLE sets AS
      SELECT setid, list(DISTINCT entry ORDER BY entry) AS entries, any_value(title) AS title, any_value(labeler) AS labeler,
             max(version) AS version, max(published) AS published
      FROM kept GROUP BY setid;

      CREATE TABLE prev AS
      SELECT unnest(from_json(:state, '[{"setid":"VARCHAR","entries":["VARCHAR"],"labeler":"VARCHAR","title":"VARCHAR","version":"INTEGER","published":"DATE","checked_at":"VARCHAR","label_format":"VARCHAR","boxed_warning_hash":"VARCHAR","boxed_warning_chars":"INTEGER","contraindications_hash":"VARCHAR","contraindications_chars":"INTEGER","warnings_precautions_hash":"VARCHAR","warnings_precautions_chars":"INTEGER","recent_major_changes_hash":"VARCHAR","recent_major_changes_text":"VARCHAR"}]'), recursive := true);

      CREATE TABLE to_fetch AS
      SELECT s.setid FROM sets s LEFT JOIN prev p USING (setid) WHERE p.setid IS NULL OR p.version IS DISTINCT FROM s.version;

      COPY (SELECT * FROM sets) TO '{{ outputFiles.sets_parquet }}' (FORMAT PARQUET);
      COPY (SELECT * FROM entry_stats) TO '{{ outputFiles.entries_parquet }}' (FORMAT PARQUET);
      COPY (SELECT * FROM prev) TO '{{ outputFiles.prev_parquet }}' (FORMAT PARQUET);

      SELECT
        (SELECT count(*) FROM prev) = 0 AS is_baseline,
        (SELECT max(db_published) FROM res) AS db_published,
        (SELECT count(*) FROM sets) AS sets,
        (SELECT count(*) FROM to_fetch) AS to_fetch_count,
        (SELECT CAST(coalesce(json_group_array(setid), '[]') AS VARCHAR) FROM to_fetch) AS to_fetch,
        (SELECT coalesce(string_agg('"' || entry || '"' || CASE WHEN listed_total = 0 THEN ' (no label in DailyMed)' ELSE ' (' || listed_total || ' labels, none from the listed labelers)' END, '; ' ORDER BY i), '') FROM entry_stats WHERE kept = 0) AS unresolved,
        (SELECT coalesce(string_agg('"' || entry || '" kept ' || kept || ' of ' || matched || ' matching labels (' || listed_total || ' listed, ' || read_rows || ' read)', '; ' ORDER BY i), '') FROM entry_stats WHERE kept < matched OR NOT fully_read) AS capped;

  - id: download_changed
    type: io.kestra.plugin.core.flow.If
    description: The SPL XML (0.2 to 1 MB per label) is only downloaded for new sets and sets with a new version.
    condition: "{{ outputs.select.outputs[0].row.to_fetch_count > 0 }}"
    then:
      - id: fetch_labels
        type: io.kestra.plugin.core.flow.Loop
        values: "{{ outputs.select.outputs[0].row.to_fetch }}"
        concurrencyLimit: 2
        tasks:
          - id: spl_xml
            type: io.kestra.plugin.core.http.Download
            description: 404 (a label withdrawn between the lookup and the download) lands an empty file, reported as FETCH_ERROR and retried next week.
            uri: "https://dailymed.nlm.nih.gov/dailymed/services/v2/spls/{{ item.value }}.xml"
            headers:
              User-Agent: "kestra-dailymed-drug-label-safety-change-watch/1.0 (https://kestra.io)"
            options:
              allowedResponseCodes: [200, 404]
              retryOnStatusCodes: [429, 500, 502, 503, 504]
              retry:
                type: exponential
                interval: PT5S
                maxInterval: PT1M
                maxAttempts: 4
        outputs:
          - id: file
            type: JSON
            value: "{{ {'name': item.value ~ '.xml', 'uri': outputs.spl_xml.uri} | toJson }}"

  - id: extract_sections
    type: io.kestra.plugin.scripts.python.Script
    description: |
      Standard-library `xml.etree` walk of each SPL body. Sections are found by LOINC code: 34066-1 Boxed Warning,
      34070-3 Contraindications, 43685-7 Warnings and Precautions (34071-1 Warnings plus 42232-9 Precautions on older
      non-PLR labels) and 43683-2 Recent Major Changes. The Highlights excerpt is left out of the hashed text, and the hash
      covers lower-cased words only, so re-typesetting by a repackager is not flagged as an edit.
    containerImage: python:3.13-slim
    inputFiles: "{{ (outputs.fetch_labels.outputs ?? []) | jq('map(.outputs.file) | map({(.name): .uri}) | add // {}') | first | toJson }}"
    outputFiles:
      - sections.json
    script: |
      import glob, hashlib, json, os, re, unicodedata
      import xml.etree.ElementTree as ET

      NS = "{urn:hl7-org:v3}"
      TRACKED = {"34066-1": "boxed_warning", "34070-3": "contraindications", "43685-7": "warnings_precautions",
                 "34071-1": "warnings_precautions", "42232-9": "warnings_precautions", "43683-2": "recent_major_changes"}

      def text_of(el, keep_excerpt):
          parts = []
          def walk(e):
              if e.tag == NS + "excerpt" and not keep_excerpt:
                  return
              if e.text:
                  parts.append(e.text)
              for c in e:
                  walk(c)
                  if c.tail:
                      parts.append(c.tail)
          walk(el)
          return re.sub(r"\s+", " ", unicodedata.normalize("NFKC", " ".join(parts))).strip()

      def collect(el, found):
          for comp in el.findall(NS + "component"):
              for sec in comp.findall(NS + "section"):
                  code = sec.find(NS + "code")
                  key = TRACKED.get(code.get("code") if code is not None else None)
                  if key:  # outermost match only: W&P subsections reuse the code
                      found.setdefault(key, []).append(text_of(sec, key == "recent_major_changes"))
                  else:
                      collect(sec, found)

      rows = []
      for path in sorted(glob.glob("*.xml")):
          row = {"setid": os.path.basename(path)[:-4], "parse_error": None}
          try:
              if os.path.getsize(path) == 0:
                  raise ValueError("empty response (label not found)")
              root = ET.parse(path).getroot()
              body = root.find(f"{NS}component/{NS}structuredBody")
              found = {}
              collect(body, found)
              row["xml_version"] = int(root.find(NS + "versionNumber").get("value"))
              row["label_format"] = "PLR" if "43685-7" in {c.get("code") for c in body.iter(NS + "code")} else "non-PLR"
              for key in ("boxed_warning", "contraindications", "warnings_precautions", "recent_major_changes"):
                  txt = " ".join(found.get(key, []))
                  words = " ".join(re.findall(r"[a-z0-9]+", txt.lower()))
                  row[key + "_hash"] = hashlib.sha256(words.encode()).hexdigest()[:16] if words else None
                  row[key + "_chars"] = len(txt)
              row["recent_major_changes_text"] = " ".join(found.get("recent_major_changes", []))[:300]
          except Exception as e:  # one broken label must not stop the others
              row["parse_error"] = f"{type(e).__name__}: {e}"[:200]
          rows.append(row)

      with open("sections.json", "w", encoding="utf-8") as f:
          json.dump(rows, f)
      print(f"parsed {len(rows)} SPL document(s), {sum(1 for r in rows if r['parse_error'])} error(s)")

  - id: classify
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: |
      Joins the listed sets, the stored state and the new section hashes. A changed, added or removed Boxed Warning,
      Contraindications or Warnings and Precautions text is SAFETY_EDIT (HIGH); any other new version is VERSION_BUMP
      (INFO), as are NEW_LABEL (a labeler new to an already-watched drug), NOT_LISTED and FETCH_ERROR. Writes the
      per-setid changes CSV, the per-drug CSV with the number of distinct section texts across labelers, and the new state.
    url: "jdbc:duckdb:"
    fetchType: FETCH_ONE
    inputFiles:
      sets.parquet: "{{ outputs.select.outputFiles.sets_parquet }}"
      entries.parquet: "{{ outputs.select.outputFiles.entries_parquet }}"
      prev.parquet: "{{ outputs.select.outputFiles.prev_parquet }}"
      sections.json: "{{ outputs.extract_sections.outputFiles['sections.json'] }}"
    outputFiles:
      - changes_csv
      - labels_csv
      - drugs_csv
    parameters:
      run_started: "{{ execution.startDate }}"
      is_baseline: "{{ outputs.select.outputs[0].row.is_baseline }}"
      execution_url: "{{ kestra.url ?? '' }}/ui/main/executions/{{ flow.namespace }}/{{ flow.id }}/{{ execution.id }}"
      label_url: https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=
    sql: |
      SET TimeZone = 'UTC';
      CREATE TABLE sets AS SELECT * FROM read_parquet('sets.parquet');
      CREATE TABLE prev AS SELECT * FROM read_parquet('prev.parquet');
      CREATE TABLE stats AS SELECT * FROM read_parquet('entries.parquet');
      CREATE TABLE x AS SELECT * FROM read_json('sections.json', format = 'array', columns = {
        setid: 'VARCHAR', parse_error: 'VARCHAR', xml_version: 'INTEGER', label_format: 'VARCHAR',
        boxed_warning_hash: 'VARCHAR', boxed_warning_chars: 'INTEGER', contraindications_hash: 'VARCHAR', contraindications_chars: 'INTEGER',
        warnings_precautions_hash: 'VARCHAR', warnings_precautions_chars: 'INTEGER', recent_major_changes_hash: 'VARCHAR',
        recent_major_changes_chars: 'INTEGER', recent_major_changes_text: 'VARCHAR'});
      CREATE TABLE known_entries AS SELECT DISTINCT unnest(entries) AS entry FROM prev;

      CREATE MACRO sec_change(label, old_h, new_h, old_c, new_c) AS
        CASE WHEN old_h IS NOT DISTINCT FROM new_h THEN NULL
             WHEN old_h IS NULL THEN label || ' added'
             WHEN new_h IS NULL THEN label || ' removed'
             ELSE label || ' edited (' || old_c || ' to ' || new_c || ' chars)' END;

      CREATE TABLE cur AS
      SELECT s.*, x.setid IS NOT NULL AS fetched, x.parse_error, p.setid IS NOT NULL AS known, p.version AS prev_version,
             x.setid IS NOT NULL AND x.parse_error IS NULL AS use_new,
             coalesce(x.xml_version, s.version) AS new_version, p.checked_at AS prev_checked_at,
             concat_ws('; ',
               sec_change('Boxed Warning', p.boxed_warning_hash, x.boxed_warning_hash, p.boxed_warning_chars, x.boxed_warning_chars),
               sec_change('Contraindications', p.contraindications_hash, x.contraindications_hash, p.contraindications_chars, x.contraindications_chars),
               sec_change('Warnings and Precautions', p.warnings_precautions_hash, x.warnings_precautions_hash, p.warnings_precautions_chars, x.warnings_precautions_chars)) AS safety_changes,
             p.recent_major_changes_hash IS DISTINCT FROM x.recent_major_changes_hash AS rmc_changed,
             CASE WHEN use_new THEN x.label_format ELSE p.label_format END AS label_format,
             CASE WHEN use_new THEN x.boxed_warning_hash ELSE p.boxed_warning_hash END AS bw_hash,
             CASE WHEN use_new THEN x.boxed_warning_chars ELSE p.boxed_warning_chars END AS bw_chars,
             CASE WHEN use_new THEN x.contraindications_hash ELSE p.contraindications_hash END AS ci_hash,
             CASE WHEN use_new THEN x.contraindications_chars ELSE p.contraindications_chars END AS ci_chars,
             CASE WHEN use_new THEN x.warnings_precautions_hash ELSE p.warnings_precautions_hash END AS wp_hash,
             CASE WHEN use_new THEN x.warnings_precautions_chars ELSE p.warnings_precautions_chars END AS wp_chars,
             CASE WHEN use_new THEN x.recent_major_changes_hash ELSE p.recent_major_changes_hash END AS rmc_hash,
             CASE WHEN use_new THEN x.recent_major_changes_text ELSE p.recent_major_changes_text END AS rmc_text
      FROM sets s LEFT JOIN x USING (setid) LEFT JOIN prev p USING (setid);

      CREATE TABLE judged AS
      SELECT *,
             CASE WHEN fetched AND parse_error IS NOT NULL THEN 'FETCH_ERROR'
                  WHEN NOT known AND (CAST(:is_baseline AS BOOLEAN) OR NOT coalesce(list_has_any(entries, (SELECT list(entry) FROM known_entries)), false)) THEN 'BASELINE'
                  WHEN NOT known THEN 'NEW_LABEL'
                  WHEN NOT fetched OR new_version = prev_version THEN 'UNCHANGED'
                  WHEN safety_changes <> '' THEN 'SAFETY_EDIT'
                  ELSE 'VERSION_BUMP' END AS change
      FROM cur;

      CREATE TABLE not_listed AS
      SELECT p.* FROM prev p
      WHERE p.setid NOT IN (SELECT setid FROM sets)
        AND coalesce(list_has_any(p.entries, (SELECT list(entry) FROM stats WHERE fully_read AND kept = matched)), false);

      CREATE TABLE changes AS
      SELECT CASE WHEN change = 'SAFETY_EDIT' THEN 'HIGH' ELSE 'INFO' END AS severity, change, array_to_string(entries, '; ') AS drugs,
             labeler, title, setid, prev_version, new_version AS version, strftime(published, '%Y-%m-%d') AS published,
             CASE WHEN change = 'SAFETY_EDIT' THEN safety_changes
                  WHEN change = 'VERSION_BUMP' THEN 'safety sections unchanged' || CASE WHEN rmc_changed THEN ', Recent Major Changes updated' ELSE '' END
                  WHEN change = 'NEW_LABEL' THEN 'new label for a watched drug' || CASE WHEN bw_hash IS NOT NULL THEN ', carries a Boxed Warning' ELSE '' END
                  ELSE parse_error END AS detail,
             coalesce(rmc_text, '') AS recent_major_changes, :label_url || setid AS dailymed_url
      FROM judged WHERE change IN ('SAFETY_EDIT', 'VERSION_BUMP', 'NEW_LABEL', 'FETCH_ERROR')
      UNION ALL
      SELECT 'INFO', 'NOT_LISTED', array_to_string(entries, '; '), labeler, title, setid, version, NULL, strftime(published, '%Y-%m-%d'),
             'no longer returned by DailyMed for this drug (archived, delisted or renamed)', '', :label_url || setid
      FROM not_listed;

      CREATE TABLE members AS
      SELECT m.entry, j.setid, j.labeler, j.published, j.version, j.change, j.bw_hash, j.ci_hash, j.wp_hash,
             concat_ws('|', coalesce(j.bw_hash, '-'), coalesce(j.ci_hash, '-'), coalesce(j.wp_hash, '-')) AS signature
      FROM judged j CROSS JOIN unnest(j.entries) AS m(entry);

      -- Labels of one drug that share the same three safety texts form a variant; A is the most common one.
      -- Repackagers copy the manufacturer's label and often lag behind it, so several variants usually mean
      -- that some labels in the group still carry older safety wording.
      CREATE TABLE variants AS
      SELECT entry, signature, count(*) AS n, string_agg(DISTINCT labeler, '; ' ORDER BY labeler) AS variant_labelers,
             chr(64 + CAST(row_number() OVER (PARTITION BY entry ORDER BY count(*) DESC, max(published) DESC) AS INTEGER)) AS variant
      FROM members GROUP BY entry, signature;

      CREATE TABLE groups AS
      SELECT st.i, st.entry, st.listed_total, st.kept AS labels,
             count(DISTINCT m.labeler) AS labelers,
             count(m.setid) FILTER (WHERE m.change = 'SAFETY_EDIT') AS safety_edits,
             count(m.setid) FILTER (WHERE m.change IN ('VERSION_BUMP', 'NEW_LABEL', 'FETCH_ERROR')) AS info_changes,
             count(m.setid) FILTER (WHERE m.bw_hash IS NOT NULL) AS with_boxed_warning,
             count(DISTINCT m.bw_hash) AS boxed_warning_texts,
             count(DISTINCT m.ci_hash) AS contraindication_texts,
             count(DISTINCT m.wp_hash) AS warnings_precautions_texts,
             (SELECT count(*) FROM variants v WHERE v.entry = st.entry) AS safety_text_variants,
             (SELECT coalesce(string_agg(v.variant || ' ' || v.n, ', ' ORDER BY v.variant), '') FROM variants v WHERE v.entry = st.entry) AS variant_sizes,
             strftime(max(m.published), '%Y-%m-%d') AS newest_published
      FROM stats st LEFT JOIN members m ON m.entry = st.entry
      GROUP BY st.i, st.entry, st.listed_total, st.kept;

      COPY (SELECT * FROM changes ORDER BY severity, change, drugs, labeler) TO '{{ outputFiles.changes_csv }}' (HEADER, DELIMITER ',');
      COPY (SELECT array_to_string(j.entries, '; ') AS drugs, j.labeler, j.title, j.setid, j.new_version AS version, strftime(j.published, '%Y-%m-%d') AS published,
                   j.change, v.variant AS safety_text_variant, j.label_format, j.bw_hash IS NOT NULL AS boxed_warning, j.bw_hash AS boxed_warning_hash,
                   j.ci_hash AS contraindications_hash, j.wp_hash AS warnings_precautions_hash, j.rmc_text AS recent_major_changes, :label_url || j.setid AS dailymed_url
            FROM judged j
            LEFT JOIN variants v ON v.entry = j.entries[1]
              AND v.signature = concat_ws('|', coalesce(j.bw_hash, '-'), coalesce(j.ci_hash, '-'), coalesce(j.wp_hash, '-'))
            ORDER BY drugs, safety_text_variant, j.published DESC) TO '{{ outputFiles.labels_csv }}' (HEADER, DELIMITER ',');
      COPY (SELECT * EXCLUDE (i) FROM groups ORDER BY i) TO '{{ outputFiles.drugs_csv }}' (HEADER, DELIMITER ',');

      CREATE TABLE new_state AS
      SELECT setid, entries, labeler, title, CASE WHEN use_new THEN new_version ELSE prev_version END AS version, published,
             CASE WHEN use_new THEN CAST(:run_started AS VARCHAR) ELSE prev_checked_at END AS checked_at, label_format,
             bw_hash AS boxed_warning_hash, bw_chars AS boxed_warning_chars, ci_hash AS contraindications_hash, ci_chars AS contraindications_chars,
             wp_hash AS warnings_precautions_hash, wp_chars AS warnings_precautions_chars, rmc_hash AS recent_major_changes_hash,
             rmc_text AS recent_major_changes_text
      FROM judged WHERE use_new OR known;

      CREATE TABLE alerts AS
      SELECT *, row_number() OVER (ORDER BY severity, change, drugs, labeler) AS rn,
             CASE WHEN prev_version IS NULL THEN 'v' || version WHEN version IS NULL THEN 'last v' || prev_version
                  ELSE 'v' || prev_version || ' to v' || version END AS versions
      FROM changes;


      SELECT
        CASE WHEN (SELECT count(*) FROM changes WHERE severity = 'HIGH') > 0 THEN 'HIGH'
             WHEN (SELECT count(*) FROM changes) > 0 THEN 'INFO'
             WHEN CAST(:is_baseline AS BOOLEAN) THEN 'BASELINE'
             ELSE 'NONE' END AS top_severity,
        (SELECT count(*) FROM judged) AS labels,
        (SELECT count(*) FROM x) AS downloaded,
        (SELECT count(*) FROM judged WHERE change = 'BASELINE') AS baselined,
        (SELECT count(*) FROM changes WHERE change = 'SAFETY_EDIT') AS safety_edits,
        (SELECT count(*) FROM changes WHERE change = 'VERSION_BUMP') AS version_bumps,
        (SELECT count(*) FROM changes WHERE change = 'NEW_LABEL') AS new_labels,
        (SELECT count(*) FROM changes WHERE change = 'NOT_LISTED') AS not_listed,
        (SELECT count(*) FROM changes WHERE change = 'FETCH_ERROR') AS fetch_errors,
        (SELECT count(*) FROM judged WHERE bw_hash IS NOT NULL) AS with_boxed_warning,
        (SELECT coalesce(string_agg('"' || entry || '" ' || labels || ' label(s) from ' || labelers || ' labeler(s), ' || safety_text_variants || ' safety-text variant(s) (' || variant_sizes || '), '
            || boxed_warning_texts || ' Boxed Warning / ' || contraindication_texts || ' Contraindications / ' || warnings_precautions_texts || ' W&P text(s), newest ' || newest_published, chr(10) ORDER BY i), '') FROM groups WHERE labels > 0) AS drug_lines,
        (SELECT count(*) FROM groups WHERE safety_text_variants > 1) AS drugs_with_variants,
        (SELECT coalesce(string_agg('[' || severity || '] ' || change || ' ' || drugs || ' / ' || labeler || ' ' || versions || ': ' || detail, chr(10) ORDER BY rn), '') FROM alerts) AS change_lines,
        (SELECT CAST(json_object('text',
            '*DailyMed label watch* - ' || count(*) FILTER (WHERE severity = 'HIGH') || ' safety section edit(s), ' || count(*) FILTER (WHERE severity = 'INFO') || ' other change(s)' || chr(10)
              || coalesce(string_agg(
                   '• *' || severity || ' ' || change || '* ' || drugs || ' - ' || labeler || ' ' || versions
                   || ' (' || coalesce(published, '') || ')' || chr(10) || '    ' || detail
                   || CASE WHEN recent_major_changes <> '' AND severity = 'HIGH' THEN chr(10) || '    _Recent Major Changes_ ' || left(recent_major_changes, 200) ELSE '' END
                   || chr(10) || '    <' || dailymed_url || '|DailyMed label>',
                   chr(10) ORDER BY rn) FILTER (WHERE rn <= 15), '')
              || CASE WHEN count(*) > 15 THEN chr(10) || '…and ' || (count(*) - 15) || ' more in the CSV.' ELSE '' END
              || chr(10) || 'Execution ' || :execution_url) AS VARCHAR) FROM alerts) AS slack_payload,
        (SELECT CAST(coalesce(to_json(list(n ORDER BY setid)), '[]') AS VARCHAR) FROM new_state n) AS state_json;

  - id: save_state
    type: io.kestra.plugin.core.kv.Set
    key: "{{ inputs.state_key }}"
    kvType: JSON
    value: "{{ outputs.classify.outputs[0].row.state_json }}"
    description: Versions and section hashes per setid, written only after a successful run. Sets that failed to download keep their previous entry so they are retried.

  - id: route
    type: io.kestra.plugin.core.flow.Switch
    value: "{{ outputs.classify.outputs[0].row.top_severity }}"
    cases:
      HIGH:
        - id: alert_high
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          allowFailure: true
          description: allowFailure keeps the run green when `SLACK_WEBHOOK_URL` is not set; the changes are still in the WARN log and the CSV.
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: "{{ outputs.classify.outputs[0].row.slack_payload }}"
        - id: log_high
          type: io.kestra.plugin.core.log.Log
          level: WARN
          message: |
            {{ outputs.classify.outputs[0].row.safety_edits }} safety section edit(s) on watched labels:
            {{ outputs.classify.outputs[0].row.change_lines }}
      INFO:
        - id: info_to_slack
          type: io.kestra.plugin.core.flow.If
          condition: "{{ inputs.notify_info }}"
          then:
            - id: alert_info
              type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
              allowFailure: true
              url: "{{ secret('SLACK_WEBHOOK_URL') }}"
              payload: "{{ outputs.classify.outputs[0].row.slack_payload }}"
        - id: log_info
          type: io.kestra.plugin.core.log.Log
          message: |
            No safety section edit. Other label changes:
            {{ outputs.classify.outputs[0].row.change_lines }}
      BASELINE:
        - id: log_baseline
          type: io.kestra.plugin.core.log.Log
          message: "BASELINE run: stored versions and section hashes for {{ outputs.classify.outputs[0].row.baselined }} label(s); changes are reported from the next run."
    defaults:
      - id: nothing_new
        type: io.kestra.plugin.core.log.Log
        message: "No label version changed among {{ outputs.classify.outputs[0].row.labels }} watched label(s) (DailyMed data of {{ outputs.select.outputs[0].row.db_published }})."

  - id: warn_inputs
    type: io.kestra.plugin.core.log.Log
    runIf: "{{ outputs.plan.outputs[0].row.invalid_entries > 0 or outputs.select.outputs[0].row.unresolved is not empty or outputs.select.outputs[0].row.capped is not empty }}"
    level: WARN
    message: |
      {{ outputs.plan.outputs[0].row.invalid_entries > 0 ? 'Skipped watchlist entries: ' ~ outputs.plan.outputs[0].row.invalid_list ~ '. ' : '' }}{{ outputs.select.outputs[0].row.unresolved is not empty ? 'No label kept for: ' ~ outputs.select.outputs[0].row.unresolved ~ '. ' : '' }}{{ outputs.select.outputs[0].row.capped is not empty ? 'Capped (raise max_pages or max_sets_per_entry, or add a labeler filter): ' ~ outputs.select.outputs[0].row.capped : '' }}

  - id: summary
    type: io.kestra.plugin.core.log.Log
    message: |
      DailyMed data of {{ outputs.select.outputs[0].row.db_published }}{{ outputs.select.outputs[0].row.is_baseline ? ' (BASELINE run)' : '' }}: {{ outputs.classify.outputs[0].row.labels }} label(s) watched, {{ outputs.classify.outputs[0].row.downloaded }} SPL XML downloaded, {{ outputs.classify.outputs[0].row.with_boxed_warning }} with a Boxed Warning.
      Safety edits {{ outputs.classify.outputs[0].row.safety_edits }}, version bumps {{ outputs.classify.outputs[0].row.version_bumps }}, new labels {{ outputs.classify.outputs[0].row.new_labels }}, not listed {{ outputs.classify.outputs[0].row.not_listed }}, fetch errors {{ outputs.classify.outputs[0].row.fetch_errors }}.
      Per drug:
      {{ outputs.classify.outputs[0].row.drug_lines }}

outputs:
  - id: summary
    type: JSON
    value: "{{ outputs.classify.outputs[0].row | jq('del(.state_json, .slack_payload)') | first }}"
  - id: changes_csv
    type: FILE
    value: "{{ outputs.classify.outputFiles.changes_csv }}"
  - id: labels_csv
    type: FILE
    value: "{{ outputs.classify.outputFiles.labels_csv }}"
  - id: drugs_csv
    type: FILE
    value: "{{ outputs.classify.outputFiles.drugs_csv }}"

extend:
  title: Watch DailyMed Drug Labels for Boxed Warning, Contraindication and Warnings Changes
  metaTitle: DailyMed Drug Label Safety Change Watch with Python, DuckDB and Slack | Kestra
  shortDescription: Resolve a formulary of drug names, NDCs and set IDs to DailyMed SPL labels every week, download only the labels whose version moved, hash their Boxed Warning, Contraindications and Warnings and Precautions sections and alert in Slack when the safety text itself changed.
  metaDescription: Weekly DailyMed label watch for your formulary. Hashes Boxed Warning, Contraindications and W&P sections per labeler and alerts on safety edits.
  description: |
    A new SPL version on DailyMed can be anything from a new package size to a new Boxed Warning, and a formulary
    has many labels per drug: the manufacturer's and a long tail of repackagers that copy it, often months later.
    Pharmacy, formulary (P&T) and pharmacovigilance teams need to know which version bumps actually touched safety
    wording. This flow uses the keyless NLM DailyMed web services v2 to track the version of every watched SPL set,
    downloads only the labels that changed, compares the Boxed Warning, Contraindications and Warnings and Precautions
    text with the previous version, and reports safety edits as HIGH and every other change as INFO. It watches label
    content, not recalls; pair it with an openFDA enforcement watch for those.

    ## How it works

    1. A weekly `Schedule` trigger (Monday 06:00 UTC) starts the run; `state` (KV Get) loads the per-setid versions and section hashes of the previous run. No state means a BASELINE run.
    2. `plan` (DuckDB) parses the `watchlist`: a name is searched as `drug_name`, `ndc=` as an NDC, `setid=` as a set ID, and `| Teva; Amneal` keeps only the labelers containing those words. Malformed NDCs or set IDs, very short names and duplicates are skipped with a reason. Name searches are restricted to `doctype` 34391-3, human prescription labels.
    3. `resolve` (Loop) calls `/spls.json` once per entry with `pagesize=100`; an `If` reads further pages up to `max_pages` only when the first page reports more. Only set ID, `spl_version`, published date and title are kept.
    4. `select` (DuckDB) applies the labeler filter, keeps the newest `max_sets_per_entry` labels, merges set IDs reached by several entries and compares each `spl_version` with the stored one.
    5. `download_changed` (If) runs `fetch_labels` (Loop) over new or changed sets only, downloading `/spls/{setid}.xml`. A 404 becomes FETCH_ERROR and is retried next week.
    6. `extract_sections` (Python, standard-library `xml.etree`) finds sections by LOINC code: 34066-1 Boxed Warning, 34070-3 Contraindications, 43685-7 Warnings and Precautions (34071-1 Warnings plus 42232-9 Precautions on older non-PLR labels) and 43683-2 Recent Major Changes. Subsections are counted once, the Highlights excerpt is left out, and the SHA-256 covers lower-cased words only, so re-typesetting is not an edit.
    7. `classify` (DuckDB) labels each set SAFETY_EDIT (HIGH, with the section and the size change), VERSION_BUMP, NEW_LABEL (new labeler for a watched drug), NOT_LISTED (set no longer returned) or FETCH_ERROR (INFO). It also groups each drug's labels into safety-text variants. `save_state` (KV Set) stores the new state.
    8. `route` (Switch) on the top severity: HIGH posts to Slack and logs at WARN, INFO logs and posts only when `notify_info` is on (If), BASELINE and no change just log. Slack tasks use `allowFailure`.

    ## What you get

    - `changes_csv`: severity, change, drug entry, labeler, versions, changed sections, Recent Major Changes text and DailyMed link.
    - `labels_csv`: the per-setid view with version, published date, label format, safety-text variant and section hashes.
    - `drugs_csv`: per drug, labels, labelers, distinct Boxed Warning, Contraindications and W&P texts, and variant sizes, which shows repackager labels still carrying older safety wording.
    - XML downloads only for changed versions, so a quiet week costs one listing request per drug.

    ## Who it's for

    - Hospital, health-system and retail pharmacy formulary teams.
    - Pharmacovigilance, medical information and regulatory affairs teams following competitor or in-licensed labels.
    - Health-tech teams keeping drug content and clinical decision support in step with the label.

    ## Why orchestrate this with Kestra

    - Listing, paging and XML downloads are `Download` tasks with HTTP retries; Loop and If keep requests proportional to what changed.
    - State lives in one KV key and is written only after a successful run, so an outage never wipes the baseline.
    - `Switch` routes by severity, Slack failures cannot break the watch, and every run keeps the three CSVs.

    ## Prerequisites

    - A Docker-capable worker for the `python:3.13-slim` image (standard library only, no packages). DailyMed is public and keyless.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack incoming webhook for the alerts (optional; without it the changes stay in the logs and CSVs).

    ## Quick start

    1. Add `SLACK_WEBHOOK_URL` to the namespace secrets, or skip it.
    2. Execute with the default watchlist (Eliquis, four warfarin manufacturers, Clozaril, three isotretinoin labelers, an Ozempic NDC and the Leqembi set ID). The first run is a BASELINE that downloads about 22 labels and shows the per-drug variants.
    3. Run it again: nothing is downloaded and the log says no label version changed. Then replace the watchlist with your formulary and keep the weekly trigger.

    ## How to extend

    - Track more sections by adding LOINC codes to `TRACKED`, for example 34073-7 Drug Interactions or 42228-7 Pregnancy.
    - Route HIGH changes to a ticketing system or to an approval task for the P&T committee.
    - Keep the section text in object storage to attach a word-level diff.

    ## Links

    - [DailyMed web services v2](https://dailymed.nlm.nih.gov/dailymed/app-support-web-services.cfm)
    - [DailyMed /spls endpoint](https://dailymed.nlm.nih.gov/dailymed/webservices-help/v2/spls_api.cfm)
    - [FDA SPL section LOINC codes](https://www.fda.gov/industry/structured-product-labeling-resources/section-headings-loinc)
    - [Kestra Loop task](https://kestra.io/plugins/core/flow/io.kestra.plugin.core.flow.loop)
    - [Kestra Switch task](https://kestra.io/plugins/core/flow/io.kestra.plugin.core.flow.switch)
    - [Kestra DuckDB Queries](https://kestra.io/plugins/plugin-jdbc-duckdb/io.kestra.plugin.jdbc.duckdb.queries)
    - [Kestra Python Script](https://kestra.io/plugins/plugin-script-python/io.kestra.plugin.scripts.python.script)
    - [Kestra Slack Incoming Webhook](https://kestra.io/plugins/plugin-slack/io.kestra.plugin.slack.notifications.slackincomingwebhook)
  tags:
    - Data
  subTags:
    - Monitoring & Alerting
    - Testing & Quality
  ee: false
  demo: false
