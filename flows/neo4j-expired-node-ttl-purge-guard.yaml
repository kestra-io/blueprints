id: neo4j-expired-node-ttl-purge-guard
namespace: company.team
description: Purge approved expired Neo4j session and event nodes in bounded transactions while preserving nodes with other
  labels or non-disposable relationships.
concurrency:
  limit: 1
  behavior: QUEUE
inputs:
- id: neo4j_url
  type: STRING
  defaults: "{{ secret('NEO4J_URL') }}"
  description: Bolt endpoint reachable by the worker.
- id: neo4j_username
  type: STRING
  defaults: neo4j
  description: User with complete graph visibility.
- id: neo4j_password
  type: SECRET
  defaults: "{{ secret('NEO4J_PASSWORD') }}"
  description: Database credential.
- id: database
  type: STRING
  defaults: neo4j
  description: Database containing the retention policy.
- id: retention_labels
  type: STRING
  defaults: Session,Event
  description: Comma-separated exact labels. Every label on a deletable node must be listed.
  validator: ^[^,\r\n]+(,[^,\r\n]+)*$
- id: expiry_property
  type: STRING
  defaults: expires_at
  description: Integer Unix seconds. Identifiers are bound as data.
  validator: ^[^\r\n]{1,128}$
- id: disposable_relationship_types
  type: STRING
  defaults: NEXT_EVENT
  description: Comma-separated exact relationship types whose edges may be deleted. Every other type protects the node.
  validator: ^[^,\r\n]+(,[^,\r\n]+)*$
- id: cutoff_epoch
  type: INT
  defaults: 0
  description: Strict expiry cutoff in Unix seconds. Zero uses database time. Future cutoffs are refused.
- id: max_nodes
  type: INT
  defaults: 500
  description: Hard run budget. Refuse the entire plan when exceeded.
  min: 1
  max: 1000
- id: batch_size
  type: INT
  defaults: 50
  description: Maximum nodes per transaction.
  min: 1
  max: 100
- id: max_degree
  type: INT
  defaults: 10
  description: Maximum incident relationships per eligible node.
  min: 0
  max: 20
- id: auto_remediate
  type: BOOL
  defaults: false
  description: Permit the approval path.
- id: dry_run
  type: BOOL
  defaults: true
  description: Must be false before approval or writes.
- id: slack_webhook_url
  type: STRING
  defaults: "{{ secret('SLACK_WEBHOOK_URL') }}"
  description: Webhook for execution failures.
variables:
  audit_cypher: |-
    UNWIND split($labels, ',') AS label
    OPTIONAL MATCH (n) WHERE label IN labels(n)
    RETURN label, count(n) AS nodes,
           count(CASE WHEN valueType(n[$expiry]) = 'INTEGER NOT NULL' AND n[$expiry] < toInteger($cutoff) THEN 1 END) AS expired,
           count(CASE WHEN valueType(n[$expiry]) = 'INTEGER NOT NULL' AND n[$expiry] < toInteger($cutoff)
    AND size(labels(n)) > 0
    AND all(l IN labels(n) WHERE l IN split($labels, ','))
    AND COUNT { (n)--() } <= toInteger($degree)
    AND NOT EXISTS { MATCH (n)-[r]-() WHERE NOT type(r) IN split($types, ',') } THEN 1 END) AS eligible
    ORDER BY label
  plan_cypher: |-
    MATCH (n)
    WHERE valueType(n[$expiry]) = 'INTEGER NOT NULL' AND n[$expiry] < toInteger($cutoff)
    AND size(labels(n)) > 0
    AND all(l IN labels(n) WHERE l IN split($labels, ','))
    AND COUNT { (n)--() } <= toInteger($degree)
    AND NOT EXISTS { MATCH (n)-[r]-() WHERE NOT type(r) IN split($types, ',') }
    WITH n ORDER BY elementId(n) LIMIT toInteger($maximum) + 1
    CALL {
      WITH n
      OPTIONAL MATCH (n)-[r]-()
      WITH DISTINCT elementId(r) AS rid ORDER BY rid
      RETURN collect(rid) AS rels
    }
    WITH elementId(n) + '|' + toString(n[$expiry]) + '|' +
         reduce(s = '', r IN rels | s + CASE WHEN s = '' THEN '' ELSE ',' END + r) AS token
    ORDER BY token
    WITH collect(token) AS tokens
    RETURN tokens,
           reduce(s = '', t IN tokens | s + CASE WHEN s = '' THEN '' ELSE ',' END + split(t, '|')[0]) AS ids,
           [i IN range(0, size(tokens) - 1, toInteger($batch)) |
             reduce(s = '', t IN tokens[i..i + toInteger($batch)] |
               s + CASE WHEN s = '' THEN '' ELSE '
    ' END + t)] AS batches
  census_cypher: |-
    CALL {
      MATCH (n) UNWIND labels(n) AS label
      WITH label, count(*) AS total WHERE NOT label IN split($labels, ',')
      RETURN 'label' AS kind, label AS name, total
      UNION ALL
      MATCH ()-[r]->() WITH type(r) AS name, count(*) AS total
      WHERE NOT name IN split($types, ',')
      RETURN 'relationship' AS kind, name, total
    }
    RETURN kind, name, total ORDER BY kind, name
tasks:
- id: clock
  type: io.kestra.plugin.neo4j.Query
  url: '{{ inputs.neo4j_url }}'
  username: '{{ inputs.neo4j_username }}'
  password: '{{ inputs.neo4j_password }}'
  database: '{{ inputs.database }}'
  timeout: PT1M
  storeType: FETCHONE
  parameters:
    requested: '{{ inputs.cutoff_epoch }}'
  query: |-
    WITH timestamp() / 1000 AS current, toInteger($requested) AS requested
    RETURN CASE WHEN requested = 0 THEN current ELSE requested END AS cutoff,
           requested >= 0 AND requested <= current AS valid
- id: valid_cutoff
  type: io.kestra.plugin.core.execution.Fail
  condition: '{{ not outputs.clock.row.valid }}'
  errorMessage: Use zero for database time or a non-negative past cutoff in Unix seconds.
- id: audit
  type: io.kestra.plugin.neo4j.Query
  url: '{{ inputs.neo4j_url }}'
  username: '{{ inputs.neo4j_username }}'
  password: '{{ inputs.neo4j_password }}'
  database: '{{ inputs.database }}'
  timeout: PT1M
  storeType: FETCH
  parameters:
    labels: '{{ inputs.retention_labels }}'
    expiry: '{{ inputs.expiry_property }}'
    types: '{{ inputs.disposable_relationship_types }}'
    cutoff: '{{ outputs.clock.row.cutoff }}'
    degree: '{{ inputs.max_degree }}'
    maximum: '{{ inputs.max_nodes }}'
    batch: '{{ inputs.batch_size }}'
  query: '{{ render(vars.audit_cypher) }}'
- id: plan
  type: io.kestra.plugin.neo4j.Query
  url: '{{ inputs.neo4j_url }}'
  username: '{{ inputs.neo4j_username }}'
  password: '{{ inputs.neo4j_password }}'
  database: '{{ inputs.database }}'
  timeout: PT1M
  storeType: FETCHONE
  parameters:
    labels: '{{ inputs.retention_labels }}'
    expiry: '{{ inputs.expiry_property }}'
    types: '{{ inputs.disposable_relationship_types }}'
    cutoff: '{{ outputs.clock.row.cutoff }}'
    degree: '{{ inputs.max_degree }}'
    maximum: '{{ inputs.max_nodes }}'
    batch: '{{ inputs.batch_size }}'
  query: '{{ render(vars.plan_cypher) }}'
- id: retention_report
  type: io.kestra.plugin.core.log.Log
  message: At cutoff {{ outputs.clock.row.cutoff }} the retention census is {{ outputs.audit.rows | toJson }}. Planned {{
    outputs.plan.row.tokens | length }} nodes; other expired nodes remain protected by labels, relationships or degree.
- id: within_budget
  type: io.kestra.plugin.core.execution.Fail
  condition: '{{ (outputs.plan.row.tokens | length) > inputs.max_nodes }}'
  errorMessage: Expired-node plan exceeds max_nodes. Nothing was deleted. Review the retention scope or raise the budget within
    its hard ceiling.
- id: purge_gate
  type: io.kestra.plugin.core.flow.If
  condition: '{{ inputs.auto_remediate and not inputs.dry_run and (outputs.plan.row.tokens | length) > 0 }}'
  then:
  - id: approval
    type: io.kestra.plugin.core.flow.Pause
    description: Permanently delete the planned expired nodes and their disposable edges. Confirm the policy and backup before
      approving.
    pauseDuration: PT20M
    behavior: FAIL
    onResume:
    - id: approved
      type: BOOL
      defaults: false
  - id: approved_purge
    type: io.kestra.plugin.core.flow.If
    condition: '{{ outputs.approval.onResume.approved ?? false }}'
    then:
    - id: fresh_plan
      type: io.kestra.plugin.neo4j.Query
      url: '{{ inputs.neo4j_url }}'
      username: '{{ inputs.neo4j_username }}'
      password: '{{ inputs.neo4j_password }}'
      database: '{{ inputs.database }}'
      timeout: PT1M
      storeType: FETCHONE
      parameters:
        labels: '{{ inputs.retention_labels }}'
        expiry: '{{ inputs.expiry_property }}'
        types: '{{ inputs.disposable_relationship_types }}'
        cutoff: '{{ outputs.clock.row.cutoff }}'
        degree: '{{ inputs.max_degree }}'
        maximum: '{{ inputs.max_nodes }}'
        batch: '{{ inputs.batch_size }}'
      query: '{{ render(vars.plan_cypher) }}'
    - id: unchanged_plan
      type: io.kestra.plugin.core.execution.Fail
      condition: '{{ (outputs.fresh_plan.row.tokens | toJson) != (outputs.plan.row.tokens | toJson) }}'
      errorMessage: The approved node, expiry or edge set changed. Nothing was deleted. Run detection again.
    - id: protected_before
      type: io.kestra.plugin.neo4j.Query
      url: '{{ inputs.neo4j_url }}'
      username: '{{ inputs.neo4j_username }}'
      password: '{{ inputs.neo4j_password }}'
      database: '{{ inputs.database }}'
      timeout: PT1M
      storeType: FETCH
      parameters:
        labels: '{{ inputs.retention_labels }}'
        expiry: '{{ inputs.expiry_property }}'
        types: '{{ inputs.disposable_relationship_types }}'
        cutoff: '{{ outputs.clock.row.cutoff }}'
        degree: '{{ inputs.max_degree }}'
        maximum: '{{ inputs.max_nodes }}'
        batch: '{{ inputs.batch_size }}'
      query: '{{ render(vars.census_cypher) }}'
    - id: batches
      type: io.kestra.plugin.core.flow.Loop
      concurrencyLimit: 1
      values: '{{ outputs.plan.row.batches | toJson }}'
      tasks:
      - id: delete_batch
        type: io.kestra.plugin.neo4j.Query
        url: '{{ inputs.neo4j_url }}'
        username: '{{ inputs.neo4j_username }}'
        password: '{{ inputs.neo4j_password }}'
        database: '{{ inputs.database }}'
        timeout: PT1M
        storeType: FETCHONE
        parameters:
          labels: '{{ inputs.retention_labels }}'
          expiry: '{{ inputs.expiry_property }}'
          types: '{{ inputs.disposable_relationship_types }}'
          cutoff: '{{ outputs.clock.row.cutoff }}'
          degree: '{{ inputs.max_degree }}'
          maximum: '{{ inputs.max_nodes }}'
          batch: '{{ inputs.batch_size }}'
          tokens: '{{ item.value }}'
        query: |-
          UNWIND split($tokens, '
          ') AS token
          WITH split(token, '|') AS t
          MATCH (n) WHERE elementId(n) = t[0]
          WITH n, t ORDER BY elementId(n)
          SET n[$expiry] = n[$expiry]
          WITH n, t
          WHERE valueType(n[$expiry]) = 'INTEGER NOT NULL' AND n[$expiry] < toInteger($cutoff)
          AND size(labels(n)) > 0
          AND all(l IN labels(n) WHERE l IN split($labels, ','))
          AND COUNT { (n)--() } <= toInteger($degree)
          AND NOT EXISTS { MATCH (n)-[r]-() WHERE NOT type(r) IN split($types, ',') } AND n[$expiry] = toInteger(t[1])
          CALL {
            WITH n
            OPTIONAL MATCH (n)-[r]-()
            WITH DISTINCT r ORDER BY elementId(r)
            RETURN collect(r) AS rels
          }
          WITH n, t, rels
          WHERE all(r IN rels WHERE elementId(r) IN CASE WHEN t[2] = '' THEN [] ELSE split(t[2], ',') END)
          WITH collect({node: n, rels: rels}) AS selected
          WITH selected, reduce(rs = [], x IN selected | rs + x.rels) AS rels,
               size(selected) = size(split($tokens, '
          ')) AS complete
          FOREACH (r IN CASE WHEN complete THEN rels ELSE [] END | DELETE r)
          FOREACH (n IN CASE WHEN complete THEN [x IN selected | x.node] ELSE [] END | DELETE n)
          RETURN CASE WHEN complete THEN size(selected) ELSE 0 END AS deleted,
                 NOT complete AS stale_batch
        description: Lock node expiry values then match the approved expiry and reject edges outside the approved set. A stale
          batch deletes nothing. Plain DELETE refuses an unexpected attached edge.
    - id: remaining
      type: io.kestra.plugin.neo4j.Query
      url: '{{ inputs.neo4j_url }}'
      username: '{{ inputs.neo4j_username }}'
      password: '{{ inputs.neo4j_password }}'
      database: '{{ inputs.database }}'
      timeout: PT1M
      storeType: FETCHONE
      parameters:
        labels: '{{ inputs.retention_labels }}'
        expiry: '{{ inputs.expiry_property }}'
        types: '{{ inputs.disposable_relationship_types }}'
        cutoff: '{{ outputs.clock.row.cutoff }}'
        degree: '{{ inputs.max_degree }}'
        maximum: '{{ inputs.max_nodes }}'
        batch: '{{ inputs.batch_size }}'
      query: '{{ render(vars.plan_cypher) }}'
    - id: approved_remaining
      type: io.kestra.plugin.neo4j.Query
      url: '{{ inputs.neo4j_url }}'
      username: '{{ inputs.neo4j_username }}'
      password: '{{ inputs.neo4j_password }}'
      database: '{{ inputs.database }}'
      timeout: PT1M
      storeType: FETCHONE
      parameters:
        ids: '{{ outputs.plan.row.ids }}'
      query: UNWIND split($ids, ',') AS id OPTIONAL MATCH (n) WHERE elementId(n) = id RETURN count(n) AS remaining
    - id: protected_after
      type: io.kestra.plugin.neo4j.Query
      url: '{{ inputs.neo4j_url }}'
      username: '{{ inputs.neo4j_username }}'
      password: '{{ inputs.neo4j_password }}'
      database: '{{ inputs.database }}'
      timeout: PT1M
      storeType: FETCH
      parameters:
        labels: '{{ inputs.retention_labels }}'
        expiry: '{{ inputs.expiry_property }}'
        types: '{{ inputs.disposable_relationship_types }}'
        cutoff: '{{ outputs.clock.row.cutoff }}'
        degree: '{{ inputs.max_degree }}'
        maximum: '{{ inputs.max_nodes }}'
        batch: '{{ inputs.batch_size }}'
      query: '{{ render(vars.census_cypher) }}'
    - id: verified
      type: io.kestra.plugin.core.execution.Fail
      condition: '{{ (outputs.remaining.row.tokens | length) != 0 or outputs.approved_remaining.row.remaining != 0 or (outputs.protected_before.rows
        | toJson) != (outputs.protected_after.rows | toJson) }}'
      errorMessage: Eligible expired nodes remain or protected label/relationship counts changed. Completed batches remain
        committed. Inspect the graph and run detection again.
    - id: after
      type: io.kestra.plugin.neo4j.Query
      url: '{{ inputs.neo4j_url }}'
      username: '{{ inputs.neo4j_username }}'
      password: '{{ inputs.neo4j_password }}'
      database: '{{ inputs.database }}'
      timeout: PT1M
      storeType: FETCH
      parameters:
        labels: '{{ inputs.retention_labels }}'
        expiry: '{{ inputs.expiry_property }}'
        types: '{{ inputs.disposable_relationship_types }}'
        cutoff: '{{ outputs.clock.row.cutoff }}'
        degree: '{{ inputs.max_degree }}'
        maximum: '{{ inputs.max_nodes }}'
        batch: '{{ inputs.batch_size }}'
      query: '{{ render(vars.audit_cypher) }}'
    - id: purged
      type: io.kestra.plugin.core.log.Log
      message: 'Eligible expired nodes cleared at cutoff {{ outputs.clock.row.cutoff }}. Before {{ outputs.audit.rows | toJson
        }}; after {{ outputs.after.rows | toJson }}. Protected census unchanged: {{ outputs.protected_after.rows | toJson
        }}.'
    else:
    - id: declined
      type: io.kestra.plugin.core.log.Log
      message: Approval declined or omitted. No retention write ran.
  else:
  - id: report_only
    type: io.kestra.plugin.core.log.Log
    message: Read-only run or no eligible expired nodes. No retention write ran.
errors:
- id: failure_alert
  type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
  url: '{{ inputs.slack_webhook_url }}'
  payload: '{{ {''text'': ''Neo4j retention purge failed: execution '' ~ execution.id ~ ''. Inspect stale plans, protected
    state and remaining expired nodes before retrying. Completed batches may remain committed.''} | toJson }}'
triggers:
- id: nightly_retention
  type: io.kestra.plugin.core.trigger.Schedule
  cron: 0 2 * * *
  disabled: true
  inputs:
    auto_remediate: false
    dry_run: true
extend:
  title: Purge expired Neo4j sessions in approved bounded batches
  shortDescription: Remove eligible expired Neo4j session and event nodes while preserving labels and relationships outside
    the retention policy.
  metaTitle: Approved Neo4j Expiry Retention Purge with Kestra
  metaDescription: Purge expired Neo4j session and event nodes with approval, bounded transactions and protected graph checks.
  description: |
    ## Safety

    An expiry property is a deletion contract. A wrong unit or an overbroad policy can destroy live graph data. Use integer Unix seconds, review the policy and keep a restorable backup.

    | Guard | What it stops |
    | --- | --- |
    | `dry_run: true`, `auto_remediate: false` and explicit approval | An unattended run deleting data |
    | Every node label and every attached relationship type must be allowed | Removing business nodes or edges outside the retention contract |
    | Fixed past cutoff, integer expiry and degree ceiling | Future timestamps, malformed expiry and high-degree deletes |
    | Whole-plan node budget and bounded transactions | Silent truncation and an oversized delete transaction |
    | Exact plan recheck after approval | Applying an approval after nodes, expiry values or edges changed |
    | Node property lock, approved edge subset and plain `DELETE` | Deleting an extended node or silently detaching an unexpected edge |
    | Recount, approved-id absence and protected census | Reporting success with targets remaining or protected counts changed |

    ## How it works

    1. `clock` (`io.kestra.plugin.neo4j.Query`) fixes the cutoff from database time or a supplied past value. `audit` counts expired and eligible nodes per policy label. Missing, non-integer and equal-to-cutoff expiry values are retained.
    2. `plan` (`io.kestra.plugin.neo4j.Query`) records element ids, expiry values and sorted incident edge ids. All labels on a target must belong to `retention_labels`; all edges must use `disposable_relationship_types`. High-degree nodes are excluded. `within_budget` (`io.kestra.plugin.core.execution.Fail`) refuses a plan over `max_nodes` before approval or writes.
    3. `purge_gate` (`io.kestra.plugin.core.flow.If`) requires both mutation inputs. `approval` (`io.kestra.plugin.core.flow.Pause`) waits up to 20 minutes. `approved_purge` reads `onResume.approved ?? false`; `fresh_plan` and `unchanged_plan` refuse a changed snapshot.
    4. `batches` (`io.kestra.plugin.core.flow.Loop`, `concurrencyLimit: 1`) runs native `delete_batch` queries. Each transaction locks node expiry values before rechecking them. A batch whose target lost eligibility, changed expiry or gained an unexpected edge deletes nothing. Approved edges already removed by an earlier batch are allowed to be absent. The query explicitly deletes the captured disposable edges then uses plain node `DELETE`; it never uses `DETACH DELETE`.
    5. `remaining`, `approved_remaining` and `protected_after` (`io.kestra.plugin.neo4j.Query`) check eligible backlog, target absence and counts of labels and relationship types outside the policy. `verified` fails on a mismatch. `failure_alert` (`io.kestra.plugin.slack.notifications.SlackIncomingWebhook`) reports errors.

    ## What you get

    A repeatable expiry sweep with per-label counts, protected lookalikes and bounded irreversible changes. Expired nodes excluded by the policy remain in the report; a successful purge clears eligible nodes at the original cutoff.

    ## Who it's for

    Platform teams whose Neo4j session or event loader writes an expiry property and needs an approved retention sweep that respects the rest of the graph.

    ## Why orchestrate this with Kestra

    Kestra keeps the database snapshot, approval, native writes and verification in one execution history. The disabled nightly schedule runs with safe inputs. A flow concurrency limit serializes executions of this flow id.

    ## Tested end to end

    Kestra 2.0.6 OSS with bundled plugin-neo4j 1.6.0 and Neo4j Community 5.26.32. Independent `cypher-shell` reads measured 6 eligible expired nodes before remediation and 0 afterward, using batches of 2. All 28 retained nodes, their identities and properties and all 3 non-disposable relationships survived. The disposable edge count fell by 1.

    | Case | Execution | Result |
    | --- | --- | --- |
    | healthy | `1mP5j2sbB6VzU5kvj5o8Yl` | SUCCESS |
    | degraded_dry_run | `5Yrl27k8m14J5TVvjXDNMk` | SUCCESS |
    | declined_approval | `5kucR85Ui26xwZvrpFDRSG` | SUCCESS |
    | remediation | `7Q6JyWKLHBnG9K3eA6hIul` | SUCCESS |
    | repeat | `5nSViB08gKHIGVTOL7u7C5` | SUCCESS |
    | ineffective_write | `3eubIx3YZ6QtxUY4l15gam` | FAILED |
    | race_or_partial | `7JnzhYRKJgXG7F3jFVHtoi` | FAILED |

    The refused write held database locks until the native transaction failed. No target was removed. Further cases cover budget equality and excess, cutoff equality, degree boundaries, an empty graph, 1001 candidates, quoted Unicode identifiers, a concurrent execution held by the flow limit, changes during approval, a disconnected service, partial recovery and a repeat run. Healthy, remediation and stale-approval cases were repeated on a fresh fixture.

    ## Prerequisites

    - Neo4j 5.26 Community reachable by the Kestra worker with the Neo4j plugin installed.
    - Complete read visibility of nodes, labels, expiry properties and incident relationships. Remediation also needs property writes for locks plus node and relationship deletes.
    - An integer Unix-seconds expiry contract and an explicit policy for disposable labels and relationship types. Names are case-sensitive; commas delimit policy entries and cannot occur inside a name.
    - A restorable backup and server transaction/lock timeouts suitable for the maintenance window. The native tasks have a one-minute task timeout and no configured write retries.

    ### Secrets

    | Secret | Purpose |
    | --- | --- |
    | `NEO4J_URL` | Default Bolt endpoint |
    | `NEO4J_PASSWORD` | Default Neo4j credential |
    | `SLACK_WEBHOOK_URL` | Default failure webhook through `secret('SLACK_WEBHOOK_URL')` |

    ### Inputs

    | Input | Default | Purpose |
    | --- | --- | --- |
    | `neo4j_url`, `neo4j_username`, `neo4j_password` | URL secret, `neo4j`, password secret | Connection and complete graph visibility |
    | `database` | `neo4j` | Target database |
    | `retention_labels` | `Session,Event` | All labels allowed on a deletable node |
    | `expiry_property` | `expires_at` | Integer Unix seconds, strictly below cutoff |
    | `disposable_relationship_types` | `NEXT_EVENT` | Edge types explicitly allowed to be deleted |
    | `cutoff_epoch` | `0` | Database time or an explicit past cutoff |
    | `max_nodes` | `500` | Whole-plan budget, at most 1000 |
    | `batch_size` | `50` | Nodes per transaction, at most 100 |
    | `max_degree` | `10` | Incident edge ceiling per target, at most 20 |
    | `auto_remediate`, `dry_run` | `false`, `true` | Both must permit mutation |
    | `slack_webhook_url` | Slack secret | Failure webhook |

    ## Quick start

    1. Configure the secrets and minimum database permissions.
    2. Set the labels, expiry property and disposable relationship types to your retention contract. Run with the safe defaults and inspect `retention_report`.
    3. Back up the graph. Run with `auto_remediate: true` and `dry_run: false`, review the snapshot then approve the Pause.
    4. Read the final per-label counts and protected census. If the run fails, inspect committed batches and run detection again before approving a new plan.
    5. Enable the nightly trigger only after reviewing its safe-mode inputs.

    ## How to extend

    Add an export-and-restore procedure before deletion if retention requires an archive. For a large graph, replace the dynamic scan with explicit indexed label/property branches and repeat the detector and race cases before increasing budgets.

    Limits: this is a logical retention purge. The dynamic queries scan the graph; node budgets bound selected output and writes, not scan cost. It does not compact store files or prove disk-space, cache or latency gains. Missing, malformed, future, non-disposable and high-degree records remain. Cross-flow copies and application writers have separate concurrency scopes. Concurrent unrelated changes can fail protected-census verification after earlier batches committed. A failed or interrupted run keeps completed transactions; the next run plans remaining eligible records without restoring deleted data. Use server timeouts to bound database work as well as the task timeout.

    ## Links

    - [Neo4j plugin](https://kestra.io/plugins/plugin-neo4j)
    - [Cypher DELETE](https://neo4j.com/docs/cypher-manual/current/clauses/delete/)
    - [Neo4j concurrent data access](https://neo4j.com/docs/operations-manual/current/database-internals/concurrent-data-access/)

    This blueprint was created by [zkasuran](https://github.com/zkasuran).
  tags:
  - Data
  - Infrastructure
  subTags:
  - Day 2 Operations
  - Monitoring & Alerting
  ee: false
  demo: false
