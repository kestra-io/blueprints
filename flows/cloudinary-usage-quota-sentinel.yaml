id: cloudinary-usage-quota-sentinel
namespace: company.team
description: |
  Every morning, read the Cloudinary Admin API usage report (read-only: no
  asset is uploaded, transformed or deleted) and classify plan usage as
  HEALTHY, WARNING, CRITICAL or UNREACHABLE. Log quiet runs and alert Slack
  before credits, storage, bandwidth or transformations run out, naming the
  metric closest to its limit.

inputs:
  - id: warning_percent
    type: FLOAT
    defaults: 75.0
    displayName: "Warning Usage (%)"
    description: "At or above this share of any plan limit (credits, storage, bandwidth or transformations), the check is WARNING."
  - id: critical_percent
    type: FLOAT
    defaults: 90.0
    displayName: "Critical Usage (%)"
    description: "At or above this share of any plan limit, the check is CRITICAL."

triggers:
  - id: daily_check
    type: io.kestra.plugin.core.trigger.Schedule
    description: Check plan usage every morning; Cloudinary updates the usage numbers periodically, so a daily check is enough. Shipped disabled; enable it once the Cloudinary secrets are set and a manual run has been verified.
    cron: "15 9 * * *"
    disabled: true

tasks:
  - id: get_usage
    type: io.kestra.plugin.core.http.Request
    description: Read the product environment usage report from the Cloudinary Admin API. This is a GET; nothing is uploaded, transformed or deleted.
    uri: "https://api.cloudinary.com/v1_1/{{ secret('CLOUDINARY_CLOUD_NAME') }}/usage"
    method: GET
    options:
      auth:
        type: BASIC
        username: "{{ secret('CLOUDINARY_API_KEY') }}"
        password: "{{ secret('CLOUDINARY_API_SECRET') }}"
      allowFailed: true
      timeout:
        connectTimeout: PT10S
        readIdleTimeout: PT60S
    retry:
      type: constant
      interval: PT10S
      maxAttempts: 3
    allowFailure: true

  - id: summarize_usage
    type: io.kestra.plugin.core.debug.Return
    description: Take the used percentage of each limited metric present in the report (credits, storage, bandwidth, transformations), find the one closest to its limit, and classify in one jq query. A missing or non-200 response becomes UNREACHABLE.
    format: >-
      {{ (outputs.get_usage.code is not defined or outputs.get_usage.code != 200)
      ? '{"status":"UNREACHABLE","plan":"unknown","top_metric":"none","top_percent":0,"credits_percent":null,"storage_percent":null,"bandwidth_percent":null,"transformations_percent":null,"last_updated":"unknown"}'
      : (fromJson(outputs.get_usage.body) | jq('
      . as $u
      | ["credits", "storage", "bandwidth", "transformations"]
      | map(. as $k | {metric: $k, pct: ($u[$k].used_percent // null)} | select(.pct != null)) as $m
      | ($m | sort_by(-.pct)) as $sorted
      | (if ($sorted | length) > 0 then $sorted[0] else {metric: "none", pct: 0} end) as $top
      | {plan: (($u.plan // "unknown") | tostring | split("\"") | join("")),
      last_updated: (($u.last_updated // "unknown") | tostring),
      top_metric: $top.metric, top_percent: $top.pct,
      credits_percent: ($u.credits.used_percent // null),
      storage_percent: ($u.storage.used_percent // null),
      bandwidth_percent: ($u.bandwidth.used_percent // null),
      transformations_percent: ($u.transformations.used_percent // null),
      status: (if ($m | length) == 0 then "UNREACHABLE"
      elif $top.pct >= ' ~ inputs.critical_percent ~ ' then "CRITICAL"
      elif $top.pct >= ' ~ inputs.warning_percent ~ ' then "WARNING"
      else "HEALTHY" end)}
      ') | first | toJson) }}

  - id: route_by_usage
    type: io.kestra.plugin.core.flow.Switch
    description: Route to a quiet log when every metric is below the warning line, a Slack message when one crosses it, or a Slack page when one crosses the critical line or Cloudinary could not be read.
    value: "{{ fromJson(outputs.summarize_usage.value).status }}"
    cases:
      "HEALTHY":
        - id: log_healthy
          type: io.kestra.plugin.core.log.Log
          description: Log a quiet line when plan usage is healthy; no Slack message is sent.
          message: "Cloudinary usage healthy on plan {{ fromJson(outputs.summarize_usage.value).plan }}: highest is {{ fromJson(outputs.summarize_usage.value).top_metric }} at {{ fromJson(outputs.summarize_usage.value).top_percent }}% (updated {{ fromJson(outputs.summarize_usage.value).last_updated }})."
      "WARNING":
        - id: alert_warning_usage
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: Post a Slack message when one metric is at or above the warning share of its plan limit.
          url: "{{ secret('SLACK_WEBHOOK') }}"
          payload: |
            {
              "text": "Cloudinary usage WARNING on plan {{ fromJson(outputs.summarize_usage.value).plan }}: {{ fromJson(outputs.summarize_usage.value).top_metric }} is at {{ fromJson(outputs.summarize_usage.value).top_percent }}% of its limit. Credits {{ fromJson(outputs.summarize_usage.value).credits_percent ?? 'n/a' }}%, storage {{ fromJson(outputs.summarize_usage.value).storage_percent ?? 'n/a' }}%, bandwidth {{ fromJson(outputs.summarize_usage.value).bandwidth_percent ?? 'n/a' }}%, transformations {{ fromJson(outputs.summarize_usage.value).transformations_percent ?? 'n/a' }}% (updated {{ fromJson(outputs.summarize_usage.value).last_updated }}). Execution {{ execution.id }}."
            }
      "CRITICAL":
        - id: alert_critical_usage
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: Page Slack when one metric is at or above the critical share of its plan limit, before images and videos stop being delivered or transformed.
          url: "{{ secret('SLACK_WEBHOOK') }}"
          payload: |
            {
              "text": "Cloudinary usage CRITICAL on plan {{ fromJson(outputs.summarize_usage.value).plan }}: {{ fromJson(outputs.summarize_usage.value).top_metric }} is at {{ fromJson(outputs.summarize_usage.value).top_percent }}% of its limit (updated {{ fromJson(outputs.summarize_usage.value).last_updated }}). Media delivery or new transformations may stop when it reaches 100%; upgrade the plan or cut usage now. Execution {{ execution.id }}."
            }
      "UNREACHABLE":
        - id: alert_unreachable_api
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: Page Slack when the usage report could not be read or contained no limited metric, indicating an outage or invalid credentials.
          url: "{{ secret('SLACK_WEBHOOK') }}"
          payload: |
            {
              "text": "Cloudinary usage sentinel UNREACHABLE: the Admin API usage report was not usable (HTTP {{ outputs.get_usage.code ?? 'no response' }}). Check the cloud name, API key and API secret. Execution {{ execution.id }}."
            }
    defaults:
      - id: log_unclassified
        type: io.kestra.plugin.core.log.Log
        description: Fallback for any classification the cases above do not cover, so an unexpected value is visible in the logs.
        message: "Cloudinary usage sentinel completed with an unexpected classification: {{ outputs.summarize_usage.value }}."

  - id: log_audit_result
    type: io.kestra.plugin.core.log.Log
    description: Record one audit line for every run, whichever branch fired, so the usage history stays queryable even if Slack delivery fails.
    message: "Cloudinary usage sentinel audit: http={{ outputs.get_usage.code ?? 'n/a' }} summary={{ outputs.summarize_usage.value }} execution={{ execution.id }}."

errors:
  - id: alert_flow_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alert Slack when the sentinel flow itself fails, so a broken check is never mistaken for healthy usage.
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "text": "Cloudinary usage sentinel flow {{ flow.id }} FAILED (execution {{ execution.id }}). Plan usage is now unknown; check the task logs and the Cloudinary console usage page."
      }

outputs:
  - id: status
    type: STRING
    value: "{{ fromJson(outputs.summarize_usage.value).status }}"

extend:
  title: "Cloudinary Usage Quota Sentinel"
  shortDescription: Read the Cloudinary usage report every morning and alert Slack before credits, storage, bandwidth or transformations hit the plan limit.
  metaTitle: Cloudinary Usage Quota Sentinel for Kestra
  metaDescription: "Read the Cloudinary usage report daily, change nothing, and alert Slack when credits, storage, bandwidth or transformations near the plan limit."
  description: |
    Product images, avatars and videos served through Cloudinary depend on the plan's monthly limits. A traffic spike, a new video feature or an unexpected transformation loop can burn through credits, bandwidth or transformations in days, and the first sign is often a warning email or degraded delivery. The console shows usage, but nobody checks it every morning. This blueprint turns a scheduled, read-only call to the Cloudinary Admin API usage report into a quota gate: `io.kestra.plugin.core.http.Request` reads the report, one jq query finds the metric closest to its limit, and the result routes to a quiet log or a Slack alert.

    ## How it works

    1. `get_usage` (`io.kestra.plugin.core.http.Request`) calls `GET https://api.cloudinary.com/v1_1/{cloud_name}/usage` with HTTP basic auth (API key and secret). It is a read: nothing is uploaded, transformed or deleted. Retries cover short network blips, and `allowFailed` plus `allowFailure` keep an API error from aborting the flow so it can be reported instead.
    2. `summarize_usage` (`io.kestra.plugin.core.debug.Return`) first guards for a missing or non-200 response (`UNREACHABLE`). Otherwise one jq query reads `used_percent` from each limited metric present in the report (`credits` on credit-based plans; `storage`, `bandwidth` and `transformations` on plans that report them), takes the highest, and classifies: at or above `critical_percent` is `CRITICAL`, at or above `warning_percent` is `WARNING`, otherwise `HEALTHY`. A report with no limited metric is treated as `UNREACHABLE` rather than healthy.
    3. `route_by_usage` (`io.kestra.plugin.core.flow.Switch`) branches on that classification: `HEALTHY` logs quietly, `WARNING` posts a Slack note, `CRITICAL` and `UNREACHABLE` page Slack. A `defaults` fallback logs anything unexpected.
    4. `log_audit_result` (`io.kestra.plugin.core.log.Log`) writes one audit line per run with the HTTP status and the full summary.
    5. The flow-level `errors` block pages Slack if the flow itself fails, and the `daily_check` trigger runs every morning at 09:15, shipped `disabled: true`.

    ## What you get

    - A daily, read-only check of Cloudinary plan usage with no custom scripting and no extra plugin to install.
    - A `status` output (`HEALTHY` / `WARNING` / `CRITICAL` / `UNREACHABLE`) other flows can gate on, for example to pause a bulk import or a video backfill while usage is critical.
    - Slack messages naming the metric closest to its limit, with every metric's percentage.
    - An audit line on every run, separate from Slack.

    ## Who it's for

    - Product and e-commerce teams serving images and video through Cloudinary.
    - Platform teams who own media costs and plan upgrades.
    - Teams that already run their alerting in Kestra.

    ## Why orchestrate this with Kestra

    Cloudinary's console shows usage when someone opens it. Kestra turns a plain, read-only API call into a scheduled, typed classification with retries, a failure path and an execution history, and the `status` output lets heavy media jobs wait when the plan is nearly used up.

    ## Prerequisites

    - A Cloudinary product environment, with its cloud name, API key and API secret from the console's API Keys page.
    - A Slack incoming webhook for the WARNING, CRITICAL, UNREACHABLE and flow-failure alerts.

    ### Secrets

    - `CLOUDINARY_CLOUD_NAME`: the cloud name used in the API URL.
    - `CLOUDINARY_API_KEY`: the API key (basic auth username).
    - `CLOUDINARY_API_SECRET`: the API secret (basic auth password).
    - `SLACK_WEBHOOK`: Slack incoming webhook used for every alert branch and the flow-failure alert.

    In Kestra OSS, secrets are supplied as environment variables prefixed `SECRET_` and base64-encoded, for example `SECRET_CLOUDINARY_API_KEY=$(echo -n 'xxxxxxxx' | base64)`, and read back with `{{ secret('CLOUDINARY_API_KEY') }}`. Use the Enterprise secrets backend for encryption at rest and access control.

    ## Quick start

    1. Copy the cloud name, API key and API secret from the Cloudinary console.
    2. Add `CLOUDINARY_CLOUD_NAME`, `CLOUDINARY_API_KEY`, `CLOUDINARY_API_SECRET` and `SLACK_WEBHOOK` as secrets.
    3. Run the flow manually with a low `warning_percent` and compare the percentages in the logs with the usage page of the console.
    4. Enable `daily_check`.

    ## How to extend

    - Add the add-on counters in the report (for example `remove_the_background`, `google_tagging`) with their own `usage` and `limit`.
    - Run it more often near the end of the billing cycle, or compare with the previous day's report (the `date` parameter) to alert on a sudden jump.
    - Store the last status in a KV store to alert only on changes.

    ## Inputs

    - `warning_percent`: type FLOAT, default `75.0` (percent).
    - `critical_percent`: type FLOAT, default `90.0` (percent).

    ## Outputs

    - `status`: one of `HEALTHY`, `WARNING`, `CRITICAL`, `UNREACHABLE`.
    - Example path: `{{ fromJson(outputs.summarize_usage.value).top_metric }}` for the metric closest to its limit.

    ## Links

    - [Cloudinary Admin API: usage](https://cloudinary.com/documentation/admin_api#usage)
    - [Kestra HTTP Request task](https://kestra.io/plugins/core/tasks/http/io.kestra.plugin.core.http.request)
    - [Kestra Slack plugin](https://kestra.io/plugins/plugin-slack)

    ## Pitfalls

    - Cloudinary updates the usage numbers periodically (`last_updated`), so the report can lag real traffic by up to a day.
    - Which metrics carry a `used_percent` depends on the plan; the flow uses whichever are present.
    - This flow only reads; it never uploads, transforms or deletes an asset.
  tags:
    - Infrastructure
  subTags:
    - Monitoring & Alerting
  ee: false
  demo: false
