id: qdrant-snapshot-retention-and-backup-staleness-sentinel
namespace: company.ai

description: |
  Audit Qdrant vector collection snapshots, detect backup staleness, trigger automated
  point-in-time snapshots, and enforce retention policies to reclaim node disk storage.

inputs:
  - id: qdrant_url
    type: STRING
    defaults: "http://localhost:6333"
    displayName: "Qdrant REST Base URL"
    description: "HTTP REST API base endpoint of the target Qdrant instance or cluster (default http://localhost:6333)."

  - id: collection_name
    type: STRING
    defaults: "enterprise-knowledge-base"
    displayName: "Collection Name"
    description: "Target Qdrant vector collection name to inspect for backup staleness and snapshot retention."

  - id: max_snapshot_age_hours
    type: INT
    defaults: 24
    displayName: "Max Snapshot Age (Hours)"
    description: "Maximum allowable age in hours of the newest snapshot before flagging backup staleness."

  - id: max_snapshots_to_keep
    type: INT
    defaults: 5
    displayName: "Max Snapshots Retention Count"
    description: "Maximum number of snapshots to retain per collection on the Qdrant storage volume before pruning the oldest ones."

  - id: min_retention_days
    type: INT
    defaults: 3
    displayName: "Min Retention Floor (Days)"
    description: "Safety retention floor in days: snapshots newer than this threshold are never pruned even if max_snapshots_to_keep is exceeded."

  - id: auto_create_snapshot
    type: BOOL
    defaults: true
    displayName: "Auto Create Snapshot If Stale"
    description: "When true, automatically trigger POST /collections/{name}/snapshots if the newest snapshot exceeds max_snapshot_age_hours or if no snapshot exists."

  - id: dry_run
    type: BOOL
    defaults: false
    displayName: "Dry Run Mode"
    description: "When true, evaluates staleness and identifies pruning candidates without creating or deleting snapshots."

  - id: open_github_issue
    type: BOOL
    defaults: false
    displayName: "Open GitHub Issue on Breach"
    description: "When true, automatically creates an issue in the designated repository when collection degradation or backup staleness occurs."

  - id: github_repository
    type: STRING
    defaults: "company/ai-platform-ops"
    displayName: "GitHub Incident Repository"
    description: "Target repository (owner/repo) where incident issues should be filed."

triggers:
  - id: daily_backup_and_retention_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 2 * * *"
    disabled: true
    description: "Daily automated snapshot audit and retention run scheduled at 02:00 UTC."
    inputs:
      qdrant_url: "http://localhost:6333"
      collection_name: "enterprise-knowledge-base"
      max_snapshot_age_hours: 24
      max_snapshots_to_keep: 5
      min_retention_days: 3
      auto_create_snapshot: true
      dry_run: false
      open_github_issue: false
      github_repository: "company/ai-platform-ops"

tasks:
  - id: get_collection_status
    type: io.kestra.plugin.core.http.Request
    description: "Fetch collection operational status, points count, and segment metadata from Qdrant REST API."
    uri: "{{ inputs.qdrant_url }}/collections/{{ inputs.collection_name }}"
    method: GET
    headers:
      api-key: "{{ secret('QDRANT_API_KEY') }}"
      Content-Type: "application/json"

  - id: list_collection_snapshots
    type: io.kestra.plugin.core.http.Request
    description: "Retrieve existing collection snapshots including timestamps, filenames, and byte sizes from Qdrant."
    uri: "{{ inputs.qdrant_url }}/collections/{{ inputs.collection_name }}/snapshots"
    method: GET
    headers:
      api-key: "{{ secret('QDRANT_API_KEY') }}"
      Content-Type: "application/json"

  - id: analyze_retention_and_staleness
    type: io.kestra.plugin.scripts.python.Script
    description: "Evaluate backup staleness, identify pruning candidates based on retention rules, and calculate storage metrics."
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: python:3.12-slim
    env:
      COLLECTION_JSON: "{{ outputs.get_collection_status.body }}"
      SNAPSHOTS_JSON: "{{ outputs.list_collection_snapshots.body }}"
      MAX_AGE_HOURS: "{{ inputs.max_snapshot_age_hours }}"
      MAX_KEEP: "{{ inputs.max_snapshots_to_keep }}"
      MIN_RETENTION_DAYS: "{{ inputs.min_retention_days }}"
      AUTO_CREATE: "{{ inputs.auto_create_snapshot }}"
      DRY_RUN: "{{ inputs.dry_run }}"
    script: |
      import os
      import json
      import re
      from datetime import datetime, timezone
      from kestra import Kestra

      collection_raw = os.environ.get("COLLECTION_JSON", "{}")
      snapshots_raw = os.environ.get("SNAPSHOTS_JSON", "{}")
      max_age_hours = float(os.environ.get("MAX_AGE_HOURS", 24))
      max_keep = int(os.environ.get("MAX_KEEP", 5))
      min_retention_days = float(os.environ.get("MIN_RETENTION_DAYS", 3))
      auto_create = os.environ.get("AUTO_CREATE", "true").lower() in ("true", "1", "yes")
      dry_run = os.environ.get("DRY_RUN", "false").lower() in ("true", "1", "yes")

      collection_data = json.loads(collection_raw).get("result", {})
      status = collection_data.get("status", "unknown").lower()
      points_count = collection_data.get("points_count", 0)
      indexed_vectors_count = collection_data.get("indexed_vectors_count", 0)
      segments_count = collection_data.get("segments_count", 0)

      snapshots_list = json.loads(snapshots_raw).get("result", [])
      total_snapshots = len(snapshots_list)

      def parse_snapshot_time(snap):
          created = snap.get("creation_time")
          if created:
              try:
                  if isinstance(created, (int, float)):
                      return datetime.fromtimestamp(created, tz=timezone.utc)
                  clean_str = str(created).replace("Z", "+00:00")
                  return datetime.fromisoformat(clean_str)
              except Exception:
                  pass
          # Fallback: extract timestamp from snapshot filename (e.g. coll-2026-10-18-02-00-01.snapshot)
          match = re.search(r"(\d{4})-(\d{2})-(\d{2})-(\d{2})-(\d{2})-(\d{2})", snap.get("name", ""))
          if match:
              try:
                  y, m, d, h, mi, s = map(int, match.groups())
                  return datetime(y, m, d, h, mi, s, tzinfo=timezone.utc)
              except Exception:
                  pass
          return datetime.fromtimestamp(0, tz=timezone.utc)

      parsed_snapshots = []
      total_bytes = 0
      for snap in snapshots_list:
          dt = parse_snapshot_time(snap)
          size = snap.get("size", 0) or 0
          total_bytes += size
          parsed_snapshots.append({
              "name": snap.get("name"),
              "datetime": dt,
              "size": size
          })

      # Sort descending (newest first)
      parsed_snapshots.sort(key=lambda x: x["datetime"], reverse=True)

      now = datetime.now(timezone.utc)
      latest_name = None
      latest_age_hours = 999999.0
      is_stale = False

      if parsed_snapshots:
          newest = parsed_snapshots[0]
          latest_name = newest["name"]
          age_sec = (now - newest["datetime"]).total_seconds()
          latest_age_hours = round(max(0.0, age_sec / 3600.0), 2)
          is_stale = latest_age_hours > max_age_hours
      else:
          is_stale = True

      # Pruning candidates: snapshots beyond max_keep position, respecting min_retention_days floor
      prune_candidates = []
      reclaimable_bytes = 0
      min_retention_seconds = min_retention_days * 86400.0

      if len(parsed_snapshots) > max_keep:
          excess_snapshots = parsed_snapshots[max_keep:]
          for snap in excess_snapshots:
              age_sec = (now - snap["datetime"]).total_seconds()
              if age_sec >= min_retention_seconds:
                  prune_candidates.append(snap["name"])
                  reclaimable_bytes += snap["size"]

      should_create = is_stale and auto_create and not dry_run

      # Verdict classification
      if status != "green":
          verdict = "BREACH_COLLECTION_DEGRADED"
      elif is_stale and not auto_create:
          verdict = "BREACH_SNAPSHOT_STALE"
      elif is_stale and auto_create and dry_run:
          verdict = "DRY_RUN_STALE_DETECTED"
      elif is_stale and auto_create and not dry_run:
          verdict = "ACTION_CREATE_SNAPSHOT"
      elif prune_candidates and dry_run:
          verdict = "DRY_RUN_PRUNE_IDENTIFIED"
      elif prune_candidates and not dry_run:
          verdict = "ACTION_PRUNE_EXCESS"
      else:
          verdict = "HEALTHY"

      total_storage_mb = round(total_bytes / (1024 * 1024), 2)
      reclaimable_storage_mb = round(reclaimable_bytes / (1024 * 1024), 2)

      print(f"Audit Result: status={status}, points={points_count}, snapshots={total_snapshots}")
      print(f"Latest Snapshot: name={latest_name}, age={latest_age_hours}h, is_stale={is_stale}")
      print(f"Prune Candidates: {prune_candidates} ({reclaimable_storage_mb} MB reclaimable)")
      print(f"Verdict: {verdict}")

      Kestra.outputs({
          "verdict": verdict,
          "collection_status": status,
          "points_count": points_count,
          "indexed_vectors_count": indexed_vectors_count,
          "segments_count": segments_count,
          "total_snapshots": total_snapshots,
          "latest_snapshot_name": latest_name or "NONE",
          "latest_snapshot_age_hours": latest_age_hours,
          "is_stale": is_stale,
          "should_create_snapshot": should_create,
          "prune_candidates": prune_candidates,
          "prune_count": len(prune_candidates),
          "total_storage_mb": total_storage_mb,
          "reclaimable_storage_mb": reclaimable_storage_mb
      })

  - id: conditional_create_snapshot
    type: io.kestra.plugin.core.flow.If
    description: "Trigger snapshot generation via Qdrant REST API when existing snapshots are stale or absent."
    condition: "{{ outputs.analyze_retention_and_staleness.vars.should_create_snapshot == true }}"
    then:
      - id: trigger_snapshot_api
        type: io.kestra.plugin.core.http.Request
        description: "Post snapshot creation request to Qdrant collection snapshots endpoint."
        uri: "{{ inputs.qdrant_url }}/collections/{{ inputs.collection_name }}/snapshots"
        method: POST
        headers:
          api-key: "{{ secret('QDRANT_API_KEY') }}"
          Content-Type: "application/json"

      - id: log_snapshot_created
        type: io.kestra.plugin.core.log.Log
        description: "Log newly created snapshot details."
        message: >-
          Created fresh Qdrant collection snapshot for '{{ inputs.collection_name }}':
          {{ outputs.trigger_snapshot_api.body }}

  - id: conditional_prune_snapshots
    type: io.kestra.plugin.core.flow.If
    description: "Iterate over pruning candidate list and delete expired snapshots from the Qdrant node filesystem."
    condition: "{{ outputs.analyze_retention_and_staleness.vars.prune_candidates != null and outputs.analyze_retention_and_staleness.vars.prune_candidates | length > 0 and inputs.dry_run == false }}"
    then:
      - id: prune_snapshots_loop
        type: io.kestra.plugin.core.flow.ForEach
        description: "Delete each eligible expired snapshot via Qdrant DELETE REST API."
        values: "{{ outputs.analyze_retention_and_staleness.vars.prune_candidates }}"
        tasks:
          - id: delete_snapshot_file
            type: io.kestra.plugin.core.http.Request
            description: "Issue HTTP DELETE request to remove snapshot file."
            uri: "{{ inputs.qdrant_url }}/collections/{{ inputs.collection_name }}/snapshots/{{ taskrun.value }}"
            method: DELETE
            headers:
              api-key: "{{ secret('QDRANT_API_KEY') }}"
              Content-Type: "application/json"

          - id: log_prune_action
            type: io.kestra.plugin.core.log.Log
            message: "Pruned expired Qdrant snapshot '{{ taskrun.value }}' from collection '{{ inputs.collection_name }}'."

  - id: route_by_audit_verdict
    type: io.kestra.plugin.core.flow.Switch
    description: "Route notification and escalation paths based on the audit verdict."
    value: "{{ outputs.analyze_retention_and_staleness.vars.verdict }}"
    cases:
      HEALTHY:
        - id: log_healthy_audit
          type: io.kestra.plugin.core.log.Log
          description: "Record healthy status when backup freshness and disk retention are compliant."
          message: >-
            Qdrant Collection '{{ inputs.collection_name }}' is HEALTHY.
            Points: {{ outputs.analyze_retention_and_staleness.vars.points_count }} |
            Latest Snapshot Age: {{ outputs.analyze_retention_and_staleness.vars.latest_snapshot_age_hours }}h |
            Retained Snapshots: {{ outputs.analyze_retention_and_staleness.vars.total_snapshots }} ({{ outputs.analyze_retention_and_staleness.vars.total_storage_mb }} MB).

      ACTION_CREATE_SNAPSHOT:
        - id: notify_snapshot_created_slack
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: "Post informational notification to Slack confirming automated snapshot generation."
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "channel": "#ai-platform-alerts",
              "attachments": [
                {
                  "color": "#36a64f",
                  "title": "📸 Qdrant Automated Backup Generated",
                  "text": "Stale snapshot detected for collection `{{ inputs.collection_name }}`. A fresh snapshot was automatically triggered and saved.",
                  "fields": [
                    {
                      "title": "Collection",
                      "value": "`{{ inputs.collection_name }}`",
                      "short": true
                    },
                    {
                      "title": "Previous Snapshot Age",
                      "value": "{{ outputs.analyze_retention_and_staleness.vars.latest_snapshot_age_hours }} hours",
                      "short": true
                    },
                    {
                      "title": "Total Points",
                      "value": "{{ outputs.analyze_retention_and_staleness.vars.points_count }}",
                      "short": true
                    },
                    {
                      "title": "Storage In Use",
                      "value": "{{ outputs.analyze_retention_and_staleness.vars.total_storage_mb }} MB",
                      "short": true
                    }
                  ],
                  "footer": "Kestra Vector Sentinel • Qdrant"
                }
              ]
            }

      ACTION_PRUNE_EXCESS:
        - id: notify_pruning_slack
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: "Post notification to Slack summarizing pruned snapshots and reclaimed disk capacity."
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "channel": "#ai-platform-alerts",
              "attachments": [
                {
                  "color": "#2eb886",
                  "title": "🧹 Qdrant Snapshot Retention Policy Enforced",
                  "text": "Pruned {{ outputs.analyze_retention_and_staleness.vars.prune_count }} expired snapshot(s) for collection `{{ inputs.collection_name }}`.",
                  "fields": [
                    {
                      "title": "Collection",
                      "value": "`{{ inputs.collection_name }}`",
                      "short": true
                    },
                    {
                      "title": "Snapshots Pruned",
                      "value": "{{ outputs.analyze_retention_and_staleness.vars.prune_count }}",
                      "short": true
                    },
                    {
                      "title": "Reclaimed Storage",
                      "value": "{{ outputs.analyze_retention_and_staleness.vars.reclaimable_storage_mb }} MB",
                      "short": true
                    },
                    {
                      "title": "Retained Snapshots",
                      "value": "{{ inputs.max_snapshots_to_keep }}",
                      "short": true
                    }
                  ],
                  "footer": "Kestra Vector Sentinel • Qdrant"
                }
              ]
            }

      BREACH_SNAPSHOT_STALE:
        - id: notify_staleness_slack
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: "Dispatch warning alert to Slack when snapshots exceed the freshness threshold and auto-creation is disabled."
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "channel": "#ai-platform-alerts",
              "attachments": [
                {
                  "color": "warning",
                  "title": "⚠️ Qdrant Backup Freshness SLA Breached",
                  "text": "Collection `{{ inputs.collection_name }}` has not been snapshotted in *{{ outputs.analyze_retention_and_staleness.vars.latest_snapshot_age_hours }} hours* (Threshold: {{ inputs.max_snapshot_age_hours }}h). Immediate backup required.",
                  "fields": [
                    {
                      "title": "Collection",
                      "value": "`{{ inputs.collection_name }}`",
                      "short": true
                    },
                    {
                      "title": "Points Count",
                      "value": "{{ outputs.analyze_retention_and_staleness.vars.points_count }}",
                      "short": true
                    }
                  ],
                  "footer": "Kestra Vector Sentinel • Qdrant"
                }
              ]
            }

        - id: conditional_github_staleness_issue
          type: io.kestra.plugin.core.flow.If
          description: "Open a tracking issue on GitHub if configured by the operator."
          condition: "{{ inputs.open_github_issue == true }}"
          then:
            - id: create_staleness_github_issue
              type: io.kestra.plugin.github.issues.Create
              description: "Open incident ticket for Qdrant backup staleness SLA breach."
              oauthToken: "{{ secret('GITHUB_TOKEN') }}"
              repository: "{{ inputs.github_repository }}"
              title: "Backup SLA Breach: Qdrant collection {{ inputs.collection_name }} snapshot is {{ outputs.analyze_retention_and_staleness.vars.latest_snapshot_age_hours }}h stale"
              body: |
                ## Incident Summary: Qdrant Snapshot Staleness SLA Breach

                The automated Kestra surveillance flow detected that collection `{{ inputs.collection_name }}` exceeds the recovery point objective (RPO) threshold.

                - **Collection**: `{{ inputs.collection_name }}`
                - **Cluster URL**: `{{ inputs.qdrant_url }}`
                - **Points Count**: `{{ outputs.analyze_retention_and_staleness.vars.points_count }}`
                - **Latest Snapshot**: `{{ outputs.analyze_retention_and_staleness.vars.latest_snapshot_name }}`
                - **Snapshot Age**: `{{ outputs.analyze_retention_and_staleness.vars.latest_snapshot_age_hours }} hours`
                - **SLA Threshold**: `{{ inputs.max_snapshot_age_hours }} hours`
                - **Auto-create Mode**: `{{ inputs.auto_create_snapshot }}`

                ### Remediation Runbook
                1. Inspect disk storage headroom on the Qdrant host or PVC.
                2. Manually trigger snapshot via REST:
                   ```bash
                   curl -X POST "{{ inputs.qdrant_url }}/collections/{{ inputs.collection_name }}/snapshots" -H "api-key: $QDRANT_API_KEY"
                   ```
                3. Enable `auto_create_snapshot: true` in the Kestra flow inputs.
              labels:
                - incident
                - storage
                - qdrant
                - rag-platform

      BREACH_COLLECTION_DEGRADED:
        - id: notify_collection_degraded_slack
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: "Dispatch critical alert to Slack when collection operational status is degraded."
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "channel": "#ai-platform-alerts",
              "attachments": [
                {
                  "color": "danger",
                  "title": "🚨 Qdrant Collection Status Degraded",
                  "text": "Collection `{{ inputs.collection_name }}` operational status is *{{ outputs.analyze_retention_and_staleness.vars.collection_status | upper }}*! Snapshot generation is blocked.",
                  "fields": [
                    {
                      "title": "Collection",
                      "value": "`{{ inputs.collection_name }}`",
                      "short": true
                    },
                    {
                      "title": "Status",
                      "value": "`{{ outputs.analyze_retention_and_staleness.vars.collection_status }}`",
                      "short": true
                    },
                    {
                      "title": "Indexed Vectors",
                      "value": "{{ outputs.analyze_retention_and_staleness.vars.indexed_vectors_count }}",
                      "short": true
                    },
                    {
                      "title": "Segments",
                      "value": "{{ outputs.analyze_retention_and_staleness.vars.segments_count }}",
                      "short": true
                    }
                  ],
                  "footer": "Kestra Vector Sentinel • Qdrant"
                }
              ]
            }

        - id: fail_on_degraded_collection
          type: io.kestra.plugin.core.execution.Fail
          description: "Fail execution to mark the audit run as degraded in the Kestra UI."

      DRY_RUN_STALE_DETECTED:
        - id: log_dry_run_stale
          type: io.kestra.plugin.core.log.Log
          message: >-
            [DRY RUN] Stale snapshot detected (age: {{ outputs.analyze_retention_and_staleness.vars.latest_snapshot_age_hours }}h).
            Snapshot creation skipped due to dry_run: true.

      DRY_RUN_PRUNE_IDENTIFIED:
        - id: log_dry_run_prune
          type: io.kestra.plugin.core.log.Log
          message: >-
            [DRY RUN] Identified {{ outputs.analyze_retention_and_staleness.vars.prune_count }} snapshot(s) for eviction:
            {{ outputs.analyze_retention_and_staleness.vars.prune_candidates }}.
            Reclaimable storage: {{ outputs.analyze_retention_and_staleness.vars.reclaimable_storage_mb }} MB.
            Pruning skipped due to dry_run: true.

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: "Notify Slack if audit API requests fail due to network timeout or auth error."
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "#ai-platform-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "💥 Qdrant Snapshot Sentinel Failed",
            "text": "Surveillance flow encountered an unhandled exception while auditing collection `{{ inputs.collection_name }}` on `{{ inputs.qdrant_url }}`. Check network connectivity or credentials.",
            "footer": "Kestra Execution Failure Guard"
          }
        ]
      }

outputs:
  - id: verdict
    type: STRING
    description: "Audit classification verdict (HEALTHY, ACTION_CREATE_SNAPSHOT, ACTION_PRUNE_EXCESS, BREACH_SNAPSHOT_STALE, BREACH_COLLECTION_DEGRADED)."
    value: "{{ outputs.analyze_retention_and_staleness.vars.verdict }}"

  - id: collection_status
    type: STRING
    description: "Reported operational status of the Qdrant collection (green, yellow, grey, red)."
    value: "{{ outputs.analyze_retention_and_staleness.vars.collection_status }}"

  - id: points_count
    type: INT
    description: "Total vector points stored in the audited collection."
    value: "{{ outputs.analyze_retention_and_staleness.vars.points_count }}"

  - id: total_snapshots
    type: INT
    description: "Total collection snapshots on disk prior to pruning actions."
    value: "{{ outputs.analyze_retention_and_staleness.vars.total_snapshots }}"

  - id: latest_snapshot_age_hours
    type: FLOAT
    description: "Age in hours of the newest snapshot detected at audit time."
    value: "{{ outputs.analyze_retention_and_staleness.vars.latest_snapshot_age_hours }}"

  - id: storage_reclaimed_mb
    type: FLOAT
    description: "Megabytes of disk storage reclaimed during automated snapshot pruning."
    value: "{{ outputs.analyze_retention_and_staleness.vars.reclaimable_storage_mb }}"

extend:
  title: Qdrant Collection Snapshot Retention & Backup Staleness Sentinel
  metaTitle: Qdrant Snapshot Retention & Backup Staleness Sentinel | Kestra
  shortDescription: Audit Qdrant vector collection snapshots, detect stale backups, trigger automated point-in-time snapshots, and prune aged snapshots to reclaim cluster disk.
  metaDescription: Audit Qdrant vector snapshots, detect stale backups, trigger automated point-in-time snapshots, and enforce disk retention policies via Kestra.
  description: |
    Automate enterprise backup compliance and disk capacity protection for Qdrant vector databases.
    This workflow regularly polls the Qdrant REST API to evaluate snapshot freshness, enforces recovery
    point objectives (RPO) by triggering automated collection snapshots, and prunes expired snapshots
    past the configured retention window to prevent node disk exhaustion.

    ## How it works

    1. **Collection Health Probe**: Queries `GET /collections/{collection_name}` over the Qdrant REST API to verify cluster status (`green`), total point counts, indexed vectors, and segment topology.
    2. **Snapshot Discovery**: Queries `GET /collections/{collection_name}/snapshots` to retrieve all existing collection snapshots, their creation timestamps, and individual byte sizes on disk.
    3. **Staleness and Retention Analysis**: Executes a Python analysis step inside Docker that parses ISO-8601 timestamps and filename dates, computes the exact age of the newest snapshot in hours, and determines whether RPO freshness SLAs have been breached.
    4. **Safety-Floor Retention Pruning**: Identifies snapshots exceeding `max_snapshots_to_keep` while strictly honoring `min_retention_days` so that recent recovery points are never prematurely deleted.
    5. **Automated Snapshot Creation**: When `auto_create_snapshot` is active and the latest snapshot is stale (or missing entirely), issues an HTTP `POST /collections/{collection_name}/snapshots` to generate a fresh point-in-time snapshot.
    6. **Automated Pruning Loop**: Iterates through identified candidate snapshots and deletes them via HTTP `DELETE /collections/{collection_name}/snapshots/{snapshot_name}` to reclaim storage volume capacity.
    7. **Verdict Routing & Incident Escalation**: Evaluates the outcome (`HEALTHY`, `ACTION_CREATE_SNAPSHOT`, `ACTION_PRUNE_EXCESS`, `BREACH_SNAPSHOT_STALE`, or `BREACH_COLLECTION_DEGRADED`), posts rich diagnostic cards to Slack, and optionally files a GitHub issue for sprint tracking.

    ## What you get

    - Guaranteed Recovery Point Objective (RPO) compliance without manual operator intervention.
    - Automatic reclamation of storage volumes, preventing silent node out-of-disk crashes.
    - Safe pruning mechanics that combine count-based retention ceilings with duration-based safety floors.
    - Zero-friction dry-run mode for auditing storage consumption and pruning candidates before mutation.
    - Real-time Slack notifications and automated GitHub tracking issues on SLA breaches.

    ## Who it's for

    - Platform Engineers and Site Reliability Engineers managing self-hosted or managed Qdrant clusters.
    - AI Practitioners and MLOps Engineers operating high-scale vector retrieval and RAG pipelines.
    - Compliance and Data Governance teams requiring demonstrable snapshot schedules and retention limits.

    ## Why orchestrate this with Kestra

    - **Declarative Resilience**: Unifies HTTP REST probes, Dockerized analytics, conditional branching, and incident alerting into a transparent YAML workflow.
    - **Native Secret Masking**: Securely passes `QDRANT_API_KEY` and webhook credentials without exposing tokens in logs or execution state.
    - **Auditable Execution History**: Retains exact execution telemetry showing which snapshots were created, retained, or deleted on every scheduled cycle.
    - **Flexible Triggers**: Run automatically on a cron schedule or trigger ad-hoc via Webhook following large-scale vector embedding ingestion batches.

    ## Prerequisites

    - A running Qdrant instance or cluster with HTTP REST API access on port 6333.
    - Docker container runtime enabled on the Kestra worker to run the Python analytics step.
    - Slack incoming webhook integration for alerting.
    - Optional: GitHub Personal Access Token if automated issue generation is enabled.

    ### Secrets

    - `QDRANT_API_KEY`: API key or Bearer token for authenticating to the Qdrant REST API (required for secured instances).
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL for posting audit status cards and escalation alerts.
    - `GITHUB_TOKEN`: GitHub Personal Access Token with `issues:write` permissions (required only if `open_github_issue: true`).

    ## Quick start

    1. Configure `QDRANT_API_KEY` and `SLACK_WEBHOOK_URL` in your Kestra namespace secrets.
    2. Import this blueprint into your Kestra instance.
    3. Run a test execution with default inputs and `dry_run: true` to verify connectivity and view candidate snapshots.
    4. Set `dry_run: false` and toggle `daily_backup_and_retention_schedule` to `disabled: false` to enable daily automated protection.

    ## How to extend

    - **S3 / Cloud Storage Offloading**: Add a downstream task using `io.kestra.plugin.aws.s3.Upload` or `io.kestra.plugin.gcp.gcs.Upload` to stream newly generated snapshots to cold object storage for off-site disaster recovery.
    - **Multi-Collection Fan-out**: Wrap the flow in a parent orchestrator using `io.kestra.plugin.core.flow.ForEach` to audit and snapshot every collection returned by `GET /collections`.
    - **PagerDuty Integration**: Add an `io.kestra.plugin.pagerduty.Trigger` in the `BREACH_COLLECTION_DEGRADED` case for P1 emergency escalation.

