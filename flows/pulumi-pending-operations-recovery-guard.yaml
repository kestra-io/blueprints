id: pulumi-pending-operations-recovery-guard
namespace: company.team

description: |
  Recover a Pulumi stack that an interrupted update left wedged. A killed CI job, a dropped
  connection or a crashed CLI stops `pulumi up` partway, so the stack keeps `pending_operations`
  in its deployment and often a held lock. Every later `pulumi up` then refuses with "the stack is
  currently locked", so deploys are blocked until a human steps in. This blueprint reads the stack
  with `pulumi stack export`, counts the pending operations and any lock, then behind a dry run and
  an approval runs `pulumi cancel` to drop the lock and `pulumi refresh --clear-pending-creates` to
  reconcile state and clear the stale operations. It exports the stack again and fails the run if
  any pending operation survived.

inputs:
  - id: project_name
    type: STRING
    displayName: Pulumi project name
    description: The project the stack belongs to, as written in Pulumi.yaml. Used to select the stack on the self-managed backend.
    defaults: recovery-demo

  - id: stack_name
    type: STRING
    displayName: Stack name
    description: The stack to inspect and recover, for example dev or prod. On a file backend the fully qualified name is organization/<project>/<stack>.
    defaults: dev

  - id: min_pending_operations
    type: INT
    displayName: Pending operation threshold
    description: Remediation is considered only when the stack carries at least this many pending operations or a lock is held. One is the right value for recovery, raise it to ignore a single transient operation.
    defaults: 1

  - id: backend_snapshot_b64
    type: STRING
    displayName: Backend snapshot (base64 tar.gz)
    description: Optional base64 of a tar.gz of the Pulumi project directory, including its .pulumi self-managed backend. The flow restores it, so recovery runs against a point in time snapshot and the approval pause never holds the live backend. Leave empty to inspect the backend already staged in the task working directory.
    defaults: ""

  - id: auto_remediate
    type: BOOL
    displayName: Auto remediate
    description: When false the flow only reports. Must be true, with dry_run false and the pause approved, before cancel or refresh runs.
    defaults: false

  - id: dry_run
    type: BOOL
    displayName: Dry run
    description: When true the plan is only logged. Must be false, with auto_remediate true, before anything is changed.
    defaults: true

tasks:
  - id: detect
    type: io.kestra.plugin.scripts.shell.Commands
    description: Read-only. Logs in to the self-managed backend, exports the stack and counts pending operations and any lock. Nothing is changed here.
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: pulumi/pulumi:latest
    env:
      PULUMI_CONFIG_PASSPHRASE: ""
      PULUMI_SKIP_UPDATE_CHECK: "true"
      PROJECT: "{{ inputs.project_name }}"
      STACK: "{{ inputs.stack_name }}"
      SEED_B64: "{{ inputs.backend_snapshot_b64 }}"
    outputFiles:
      - backend.tgz
      - export.json
    commands:
      - |
        set -eu
        mkdir -p proj
        if [ -n "${SEED_B64:-}" ]; then
          printf '%s' "$SEED_B64" | base64 -d > seed.tgz
          tar -xzf seed.tgz -C proj
        fi
        cd proj
        if [ ! -f Pulumi.yaml ]; then
          printf 'name: %s\nruntime: yaml\n' "$PROJECT" > Pulumi.yaml
        fi
        pulumi login "file://$PWD" >/dev/null 2>&1
        pulumi stack select "$STACK" 2>/dev/null || pulumi stack init "$STACK" >/dev/null 2>&1
        pulumi stack export --file ../export.json
        LOCKDIR=".pulumi/locks"
        LOCKS=0
        if [ -d "$LOCKDIR" ]; then
          LOCKS=$(find "$LOCKDIR" -name '*.json' 2>/dev/null | wc -l | tr -d ' ')
        fi
        tar -czf ../backend.tgz .
        LOCKS="$LOCKS" python3 - <<'PY'
        import json, os
        d = json.load(open("../export.json"))
        dep = d.get("deployment", {}) or {}
        pend = dep.get("pending_operations") or d.get("pending_operations") or []
        summ = []
        for op in pend:
            t = op.get("type", "op")
            urn = (op.get("resource") or {}).get("urn", "")
            summ.append(t + " " + urn.split("::")[-1])
        out = {
            "pending_count": str(len(pend)),
            "lock_count": os.environ.get("LOCKS", "0"),
            "ops_summary": ("; ".join(summ) or "none"),
        }
        print("::" + json.dumps({"outputs": out}) + "::")
        PY

  - id: summary
    type: io.kestra.plugin.core.log.Log
    message: >-
      Pulumi recovery check for {{ inputs.project_name }}/{{ inputs.stack_name }}:
      {{ outputs.detect.vars.pending_count }} pending operations, {{ outputs.detect.vars.lock_count }} lock files.
      Operations: {{ outputs.detect.vars.ops_summary }}.

  - id: route
    type: io.kestra.plugin.core.flow.If
    condition: "{{ (outputs.detect.vars.pending_count | number >= inputs.min_pending_operations) or (outputs.detect.vars.lock_count | number > 0) }}"
    then:
      - id: findings_alert
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {{ {'text': 'Pulumi stack ' ~ inputs.project_name ~ '/' ~ inputs.stack_name ~ ' is wedged: ' ~ outputs.detect.vars.pending_count ~ ' pending operations and ' ~ outputs.detect.vars.lock_count ~ ' lock files. ' ~ (inputs.auto_remediate and not inputs.dry_run ? 'Recovery waits for approval on this execution.' : 'Nothing changed (auto_remediate=' ~ inputs.auto_remediate ~ ', dry_run=' ~ inputs.dry_run ~ ').')} | toJson }}

      - id: remediate_gate
        type: io.kestra.plugin.core.flow.If
        description: cancel and refresh run only when auto_remediate is true, dry_run is false and the pause below is approved.
        condition: "{{ inputs.auto_remediate and not inputs.dry_run }}"
        then:
          - id: hold
            type: io.kestra.plugin.core.flow.Pause
            description: >-
              pulumi cancel drops the lock, it does not roll back a resource. pulumi refresh reconciles
              state with what the provider actually has, which can show resources the interrupted update
              really created. Read the exported state above and the pending operations, then resume with
              approved true to recover the stack.
            onResume:
              - id: approved
                type: BOOL
                required: false
                description: Set true to run cancel and refresh. Anything else leaves the stack untouched.

          - id: approval_gate
            type: io.kestra.plugin.core.flow.If
            condition: "{{ outputs.hold.onResume.approved ?? false }}"
            then:
              - id: remediate
                type: io.kestra.plugin.scripts.shell.Commands
                description: Drop the lock with pulumi cancel, then reconcile the stack with pulumi refresh so the stale pending operations clear. Both are logged with their exit codes.
                taskRunner:
                  type: io.kestra.plugin.scripts.runner.docker.Docker
                containerImage: pulumi/pulumi:latest
                env:
                  PULUMI_CONFIG_PASSPHRASE: ""
                  PULUMI_SKIP_UPDATE_CHECK: "true"
                  STACK: "{{ inputs.stack_name }}"
                inputFiles:
                  backend.tgz: "{{ outputs.detect.outputFiles['backend.tgz'] }}"
                outputFiles:
                  - backend.tgz
                commands:
                  - |
                    set -eu
                    mkdir -p proj
                    tar -xzf backend.tgz -C proj
                    cd proj
                    pulumi login "file://$PWD" >/dev/null 2>&1
                    pulumi stack select "$STACK"
                    set +e
                    pulumi cancel --yes; echo "cancel_rc=$?"
                    pulumi refresh --yes --skip-preview --clear-pending-creates; echo "refresh_rc=$?"
                    set -e
                    tar -czf ../backend.tgz .

              - id: reverify
                type: io.kestra.plugin.scripts.shell.Commands
                description: Export the stack again and count pending operations and any lock. This is the read that proves the recovery landed.
                taskRunner:
                  type: io.kestra.plugin.scripts.runner.docker.Docker
                containerImage: pulumi/pulumi:latest
                env:
                  PULUMI_CONFIG_PASSPHRASE: ""
                  PULUMI_SKIP_UPDATE_CHECK: "true"
                  STACK: "{{ inputs.stack_name }}"
                inputFiles:
                  backend.tgz: "{{ outputs.remediate.outputFiles['backend.tgz'] }}"
                outputFiles:
                  - export_after.json
                commands:
                  - |
                    set -eu
                    mkdir -p proj
                    tar -xzf backend.tgz -C proj
                    cd proj
                    pulumi login "file://$PWD" >/dev/null 2>&1
                    pulumi stack select "$STACK"
                    pulumi stack export --file ../export_after.json
                    LOCKS=0
                    if [ -d ".pulumi/locks" ]; then
                      LOCKS=$(find ".pulumi/locks" -name '*.json' 2>/dev/null | wc -l | tr -d ' ')
                    fi
                    LOCKS="$LOCKS" python3 - <<'PY'
                    import json, os
                    d = json.load(open("../export_after.json"))
                    dep = d.get("deployment", {}) or {}
                    pend = dep.get("pending_operations") or d.get("pending_operations") or []
                    out = {"pending_after": str(len(pend)), "lock_after": os.environ.get("LOCKS", "0")}
                    print("::" + json.dumps({"outputs": out}) + "::")
                    PY

              - id: verify
                type: io.kestra.plugin.core.flow.If
                description: The run fails when a pending operation or a lock survived the recovery. Reporting success without reading the stack again is what this gate prevents.
                condition: "{{ (outputs.reverify.vars.pending_after | number > 0) or (outputs.reverify.vars.lock_after | number > 0) }}"
                then:
                  - id: recovery_incomplete
                    type: io.kestra.plugin.core.execution.Fail
                    errorMessage: >-
                      Recovery did not land on {{ inputs.project_name }}/{{ inputs.stack_name }}.
                      Still {{ outputs.reverify.vars.pending_after }} pending operations and
                      {{ outputs.reverify.vars.lock_after }} lock files after cancel and refresh.
                      Read the refresh output and the exported state before the next deploy.
                else:
                  - id: recovered
                    type: io.kestra.plugin.core.log.Log
                    message: >-
                      Recovered {{ inputs.project_name }}/{{ inputs.stack_name }}:
                      {{ outputs.detect.vars.pending_count }} pending operations and
                      {{ outputs.detect.vars.lock_count }} lock files before, 0 and 0 after.
            else:
              - id: approval_declined
                type: io.kestra.plugin.core.log.Log
                message: "Approval not granted on execution {{ execution.id }}. Nothing was changed on {{ inputs.project_name }}/{{ inputs.stack_name }}."
        else:
          - id: report_only
            type: io.kestra.plugin.core.log.Log
            message: >-
              Report only, nothing changed (auto_remediate={{ inputs.auto_remediate }}, dry_run={{ inputs.dry_run }}).
              Run with auto_remediate true and dry_run false, then approve the pause, to recover
              {{ inputs.project_name }}/{{ inputs.stack_name }}.
    else:
      - id: nothing_pending
        type: io.kestra.plugin.core.log.Log
        message: >-
          {{ inputs.project_name }}/{{ inputs.stack_name }} is clean: {{ outputs.detect.vars.pending_count }}
          pending operations and {{ outputs.detect.vars.lock_count }} lock files, below the threshold. Nothing to recover.

errors:
  - id: alert_flow_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {{ {'text': 'Pulumi pending operations recovery failed on ' ~ inputs.project_name ~ '/' ~ inputs.stack_name ~ ' (execution ' ~ execution.id ~ '). Either the backend was unreachable or a pending operation survived the recovery. Check the execution logs.'} | toJson }}

triggers:
  - id: nightly
    type: io.kestra.plugin.core.trigger.Schedule
    description: Shipped disabled and in safe mode. Enabling it only reports until you change these inputs.
    cron: "40 2 * * *"
    disabled: true
    inputs:
      dry_run: true
      auto_remediate: false

extend:
  title: Recover a Pulumi Stack Wedged by an Interrupted Update
  shortDescription: Detect pending operations and a held lock on a Pulumi stack after an interrupted update, then clear them with pulumi cancel and pulumi refresh behind an approval, then verify the stack is clean.
  metaTitle: Recover a Pulumi Stack Wedged by an Interrupted Update with Kestra
  metaDescription: Detect Pulumi pending operations and a stale lock after an interrupted update, clear them with cancel and refresh behind an approval, then verify.
  description: |
    An interrupted `pulumi up`, from a killed CI job, a dropped connection or a crashed CLI, stops partway and leaves the stack with `pending_operations` recorded in its deployment and often a held lock. The next `pulumi up` then refuses with "the stack is currently locked", so every later deploy is blocked until a human intervenes.

    This blueprint reads the stack with `pulumi stack export`, counts the pending operations and any lock file, then reports. When you turn remediation on and approve the pause, it runs `pulumi cancel` to drop the lock and `pulumi refresh` to reconcile state with the provider, which clears the stale pending operations. Then it exports the stack again and fails the run if any pending operation or lock survived.

    This blueprint was created by [zkasuran](https://github.com/zkasuran).

    ## Safety

    Recovering a stack touches real state, so the flow is built so it cannot change anything by accident:

    - **Read-only by default.** The shipped inputs and the disabled schedule only export the stack and report. `cancel` and `refresh` need `auto_remediate` true, `dry_run` false and an approved pause, all three.
    - **cancel is not a rollback.** `pulumi cancel` removes the stack lock, it does not undo a resource. The flow states this at the pause so nobody expects a rollback.
    - **refresh reconciles, clearing pending creates drops them.** `pulumi refresh` reconciles state with what the provider actually has. Plain refresh does not clear a pending create for a resource that never finished, so the flow passes `--clear-pending-creates` to drop those records. If an interrupted create did reach the provider, import that resource instead of dropping it. The pause is where an operator reads the state and decides.
    - **A snapshot, not the live backend.** The flow operates on a snapshot of the project directory carried between steps, so the human approval pause never holds a lock on the live backend.
    - **Verify, do not trust.** After cancel and refresh the flow exports the stack again and fails the run if a pending operation or lock is still there, so a stuck stack cannot read as a recovered one.

    ## How it works

    1. `detect` (`io.kestra.plugin.scripts.shell.Commands` on a `pulumi/pulumi` task runner, read-only) logs in to the self-managed backend with `file://`, selects the stack, runs `pulumi stack export` and counts `pending_operations` and the lock files under `.pulumi/locks`. It emits the counts and carries the project directory forward as `backend.tgz`.
    2. `summary` logs the counts and a short list of the pending operations.
    3. `route` stops with a log line when the stack is below the threshold and holds no lock. Otherwise `findings_alert` posts the state to Slack and `remediate_gate` checks `auto_remediate` and `dry_run`.
    4. `hold` (`io.kestra.plugin.core.flow.Pause`) waits for approval. On approval `remediate` runs `pulumi cancel --yes` then `pulumi refresh --yes --clear-pending-creates` on the carried backend.
    5. `reverify` exports the stack again and counts pending operations and locks. `verify` fails the run when either is still above zero, otherwise `recovered` logs the before and after.
    6. `errors` alerts Slack when the flow fails, including when the verification gate fails.

    ## What you get

    - A single place that finds a stack wedged by an interrupted update and reports it, instead of a developer hitting "the stack is currently locked" on the next deploy.
    - A recovery that is gated and verified, so `cancel` and `refresh` run only after a human reads the state and approves.
    - A run that fails when the recovery did not clear the pending operations, so a stuck stack cannot pass as clean.

    ## Who it's for

    - Platform and DevOps teams running Pulumi from CI, where a cancelled or timed out job is the common cause of a wedged stack.
    - Anyone operating self-managed Pulumi backends (`file://`, S3, Azure Blob, GCS) who has had a deploy blocked by a stale lock or pending operations.

    ## Why orchestrate this with Kestra

    The manual fix is to SSH in, read the state, run `pulumi cancel` and `pulumi refresh` by hand and hope the operator understood that refresh is not a rollback. That is error prone and unaudited. Kestra reads the stack, posts the state, holds the change behind an approval where the operator reads the refresh implications, runs cancel and refresh, then reads the stack again and fails the execution when pending operations survived. The execution history is the record of what was wedged, who approved the recovery and whether it worked.

    ## Tested end to end

    On Kestra 2.0.5 OSS with the `pulumi/pulumi` task runner and a `file://` self-managed backend, with a local HTTP sink standing in for Slack. The stack was wedged by interrupting a real `pulumi up` so its deployment carried pending operations and a lock.

    | Run | Inputs | Result |
    |---|---|---|
    | 1 | clean stack, defaults | 0 pending operations, 0 locks, below threshold. Nothing changed |
    | 2 | wedged stack, defaults | pending operations and a lock detected, Slack alerted, nothing changed |
    | 3 | wedged, `auto_remediate: true` | same plan, nothing changed. The dry run blocks the change even with auto_remediate on |
    | 4 | wedged, `auto_remediate: true`, `dry_run: false`, pause approved | cancel dropped the lock, refresh cleared the pending operations, re-export confirmed 0 and 0 |
    | 5 | same, pause resumed with `approved: false` | nothing changed |
    | 6 | same, pause resumed with no answer | nothing changed, an unanswered pause does not read as approval |
    | 7 | a re-verify that still found a pending operation | `verify` failed the run and `errors` posted to Slack |
    | 8 | a backend snapshot that cannot be read | `errors` alert sent |

    ## Prerequisites

    - A Pulumi self-managed backend the task runner can read. This blueprint uses a `file://` backend carried as a snapshot, which needs no cloud credential. For a shared backend, point the login at your `s3://`, `azblob://` or `gs://` URL and add its credentials as secrets.
    - The `pulumi/pulumi` container image, pulled by the task runner on first use.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: used by `findings_alert` and the `errors` block. In Kestra OSS, provide it as the base64 encoded environment variable `SECRET_SLACK_WEBHOOK_URL`.

    ### Inputs

    | Input | Default | Purpose |
    |---|---|---|
    | `project_name` | `recovery-demo` | The Pulumi project the stack belongs to |
    | `stack_name` | `dev` | The stack to inspect and recover |
    | `min_pending_operations` | `1` | Detection threshold for pending operations |
    | `backend_snapshot_b64` | empty | Optional base64 tar.gz of the project directory and its backend |
    | `auto_remediate` | `false` | Must be true to run cancel and refresh |
    | `dry_run` | `true` | Must be false to run cancel and refresh |

    ## Quick start

    1. Add the `SLACK_WEBHOOK_URL` secret.
    2. Import the flow and run it with the defaults against a snapshot of a wedged stack. Read the pending operations and lock count in the summary.
    3. Run it with `auto_remediate: true` and `dry_run: false`, read the state in the paused execution, then resume it with `approved: true`.
    4. Enable the `nightly` trigger once the plans look right. Change its inputs when you want it to act.

    ## How to extend

    - Point the backend login at a shared `s3://`, `azblob://` or `gs://` URL and loop over several stacks in one run with `concurrencyLimit: 1`.
    - Trigger the flow from the CI job that runs `pulumi up`, so a cancelled deploy is recovered right after it fails.
    - Keep the exported state in object storage before refresh, so a failed recovery can be compared against the state as it was.
    - Replace the approval pause with a stricter rule, for example only auto recover a stack whose pending operations are all of type `creating`.

    ## Links

    - Interrupted updates: https://www.pulumi.com/docs/iac/operations/troubleshooting/interrupted-updates/
    - pulumi cancel: https://www.pulumi.com/docs/iac/cli/commands/pulumi_cancel/
    - pulumi refresh: https://www.pulumi.com/docs/iac/cli/commands/pulumi_refresh/
  tags:
    - Infrastructure
  subTags:
    - Infrastructure Automation
    - Day 2 Operations
  ee: false
  demo: false
