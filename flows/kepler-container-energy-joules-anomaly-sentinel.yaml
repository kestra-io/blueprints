id: kepler-container-energy-joules-anomaly-sentinel
namespace: company.sre

description: |
  Audits CNCF Kepler eBPF metrics to detect abnormal container energy consumption spikes, thermal throttling risks, and unallocated power draw.

concurrency:
  limit: 1

inputs:
  - id: kepler_metrics_url
    type: STRING
    displayName: "Kepler Metrics URL"
    defaults: "http://kepler.kepler.svc.cluster.local:8888"
    description: "Internal Kubernetes HTTP endpoint exposing Prometheus metrics from the CNCF Kepler eBPF power exporter."

  - id: cluster_name
    type: STRING
    displayName: "Kubernetes Cluster Identifier"
    defaults: "k8s-prod-us-central"
    description: "Identifier of the target Kubernetes cluster monitored for container power and green computing metrics."

  - id: max_pod_power_joules_rate
    type: INT
    displayName: "Max Pod Power Joules Rate"
    defaults: 120
    description: "Maximum allowable per-pod energy consumption rate in Joules per second before triggering an energy anomaly alert."

  - id: max_node_dram_power_joules
    type: INT
    displayName: "Max Node DRAM Power Joules"
    defaults: 45
    description: "Maximum allowable DRAM power consumption in Joules per second per node to detect runaway memory bus activity."

  - id: alert_on_unallocated_power
    type: BOOL
    displayName: "Alert on Unallocated Power"
    defaults: true
    description: "Toggle whether significant unallocated host power draw beyond container bounds triggers an investigation notification."

tasks:
  - id: scan_kepler_energy_telemetry
    type: io.kestra.plugin.scripts.python.Script
    description: Scrapes CNCF Kepler eBPF Prometheus metrics to audit container Joules consumption, DRAM power draw, and platform energy anomalies.
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests kestra
    env:
      METRICS_URL: "{{ inputs.kepler_metrics_url }}"
      CLUSTER_NAME: "{{ inputs.cluster_name }}"
      MAX_POD_JOULES: "{{ inputs.max_pod_power_joules_rate }}"
      MAX_DRAM_JOULES: "{{ inputs.max_node_dram_power_joules }}"
      ALERT_UNALLOCATED: "{{ inputs.alert_on_unallocated_power }}"
    script: |
      import os
      import sys
      import re
      import requests
      from datetime import datetime, timezone
      from kestra import Kestra

      base_url = os.environ.get("METRICS_URL", "").rstrip("/")
      cluster_name = os.environ.get("CLUSTER_NAME", "k8s-prod-us-central")
      max_pod_joules = float(os.environ.get("MAX_POD_JOULES", "120"))
      max_dram_joules = float(os.environ.get("MAX_DRAM_JOULES", "45"))
      alert_unallocated = os.environ.get("ALERT_UNALLOCATED", "true").lower() == "true"

      max_observed_pod_joules = 0.0
      peak_offending_pod = "none"
      peak_offending_namespace = "none"
      max_observed_dram_joules = 0.0
      total_platform_joules = 0.0
      energy_anomalies_detected = 0

      metrics_endpoint = f"{base_url}/metrics"
      try:
          resp = requests.get(metrics_endpoint, timeout=12)
          resp.raise_for_status()
          raw_lines = resp.text.splitlines()
      except Exception as err:
          print(f"Error: Unable to connect to Kepler metrics endpoint at {metrics_endpoint}: {err}", file=sys.stderr)
          sys.exit(1)

      for line in raw_lines:
          line = line.strip()
          if not line or line.startswith("#"):
              continue
          match = re.search(r'([0-9.eE+-]+)\s*$', line)
          if not match:
              continue
          val = float(match.group(1))

          if "kepler_container_joules_total" in line:
              pod_match = re.search(r'pod_name="([^"]+)"', line)
              ns_match = re.search(r'container_namespace="([^"]+)"', line)
              pod_name = pod_match.group(1) if pod_match else "unknown-pod"
              ns_name = ns_match.group(1) if ns_match else "default"
              if val > max_observed_pod_joules:
                  max_observed_pod_joules, peak_offending_pod, peak_offending_namespace = val, pod_name, ns_name
              if val > max_pod_joules:
                  energy_anomalies_detected += 1
          elif "kepler_node_dram_joules_total" in line and val > max_observed_dram_joules:
              max_observed_dram_joules = val
          elif "kepler_node_platform_joules_total" in line:
              total_platform_joules += val

      is_breached = bool((max_observed_pod_joules > max_pod_joules) or (max_observed_dram_joules > max_dram_joules) or (alert_unallocated and energy_anomalies_detected > 3))
      now_iso = datetime.now(timezone.utc).isoformat()
      print(f"Kepler Audit: cluster={cluster_name}, peak_pod={peak_offending_pod}:{max_observed_pod_joules:.2f}J, peak_dram={max_observed_dram_joules:.2f}J, anomalies={energy_anomalies_detected}, breached={is_breached}")

      Kestra.outputs({
          "peak_pod_joules_rate": round(max_observed_pod_joules, 2),
          "peak_offending_pod": peak_offending_pod,
          "peak_offending_namespace": peak_offending_namespace,
          "peak_dram_joules": round(max_observed_dram_joules, 2),
          "total_platform_joules": round(total_platform_joules, 2),
          "energy_anomalies_count": energy_anomalies_detected,
          "is_alerting": is_breached,
          "audit_timestamp": now_iso
      })

  - id: evaluate_kepler_energy_health
    type: io.kestra.plugin.core.flow.If
    description: Evaluates whether container Joules consumption rates or host DRAM power draw violate sustainable computing thresholds.
    condition: "{{ outputs.scan_kepler_energy_telemetry.vars.is_alerting }}"
    then:
      - id: notify_slack_kepler_energy_anomaly
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches high-urgency Slack notification when container energy consumption exceeds green computing bounds.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#platform-sre-alerts",
            "text": "CRITICAL: Kepler Container Energy Anomaly on Cluster `{{ inputs.cluster_name }}`. Peak Pod Rate: `{{ outputs.scan_kepler_energy_telemetry.vars.peak_pod_joules_rate }}` J/s (limit: `{{ inputs.max_pod_power_joules_rate }}` J/s) by `{{ outputs.scan_kepler_energy_telemetry.vars.peak_offending_namespace }}/{{ outputs.scan_kepler_energy_telemetry.vars.peak_offending_pod }}`. Peak DRAM: `{{ outputs.scan_kepler_energy_telemetry.vars.peak_dram_joules }}` J/s (limit: `{{ inputs.max_node_dram_power_joules }}` J/s). Anomalies: `{{ outputs.scan_kepler_energy_telemetry.vars.energy_anomalies_count }}`. Audit Timestamp: `{{ outputs.scan_kepler_energy_telemetry.vars.audit_timestamp }}`."
          }
    else:
      - id: log_nominal_kepler_energy_state
        type: io.kestra.plugin.core.log.Log
        description: Records nominal telemetry when container energy consumption and DRAM power remain well within sustainability guidelines.
        message: "Kepler energy consumption nominal for {{ inputs.cluster_name }}: Peak pod power is {{ outputs.scan_kepler_energy_telemetry.vars.peak_pod_joules_rate }} J/s, DRAM power {{ outputs.scan_kepler_energy_telemetry.vars.peak_dram_joules }} J/s."

  - id: emit_audit_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Emits structured audit manifest for green computing governance, FinOps energy accounting, and ESG sustainability reporting.
    format: |
      {
        "status": "{{ outputs.scan_kepler_energy_telemetry.vars.is_alerting ? 'ALERT' : 'NOMINAL' }}",
        "cluster_name": "{{ inputs.cluster_name }}",
        "peak_pod_joules_rate": {{ outputs.scan_kepler_energy_telemetry.vars.peak_pod_joules_rate }},
        "peak_offending_namespace": "{{ outputs.scan_kepler_energy_telemetry.vars.peak_offending_namespace }}",
        "peak_offending_pod": "{{ outputs.scan_kepler_energy_telemetry.vars.peak_offending_pod }}",
        "peak_dram_joules": {{ outputs.scan_kepler_energy_telemetry.vars.peak_dram_joules }},
        "total_platform_joules": {{ outputs.scan_kepler_energy_telemetry.vars.total_platform_joules }},
        "energy_anomalies_count": {{ outputs.scan_kepler_energy_telemetry.vars.energy_anomalies_count }},
        "audit_timestamp": "{{ outputs.scan_kepler_energy_telemetry.vars.audit_timestamp }}"
      }

triggers:
  - id: periodic_kepler_energy_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"

extend:
  title: "CNCF Kepler Container Energy Joules Anomaly Sentinel"
  metaTitle: "Kepler Container Energy Anomaly Sentinel Blueprint"
  shortDescription: "Audits CNCF Kepler eBPF power metrics to detect container energy consumption spikes and thermal risks."
  metaDescription: "Audits CNCF Kepler eBPF metrics to detect abnormal container energy consumption spikes, thermal throttling risks, and unallocated power draw."
  description: |
    Automates continuous energy consumption and power efficiency surveillance for Kubernetes workloads using CNCF Kepler eBPF telemetry.

    ## How it works
    1. A schedule trigger executes the Kepler energy health audit workflow every 15 minutes.
    2. The Python task queries the CNCF Kepler Prometheus metrics endpoint exposing real-time eBPF power counters.
    3. The script extracts per-container Joules consumption, node-level DRAM power draw, and platform package energy.
    4. An evaluation gate determines whether container power draw exceeds sustainability thresholds or runaway loops exist.
    5. When abnormal energy consumption is detected, a high-priority Slack incident alert is dispatched to the Platform team.
    6. When container power draw and host energy remain within sustainability bounds, nominal telemetry is logged.
    7. A structured JSON audit manifest is emitted for FinOps energy attribution and ESG compliance reporting.

    ## Architecture diagram
    ```mermaid
    graph TD
        Trigger[Schedule Trigger: 15m] --> ScanMetrics[Python Script: Scrape Kepler eBPF Metrics]
        ScanMetrics --> EvalBreach{Pod Joules > 120 OR DRAM > 45 OR Anomalies > 3?}
        EvalBreach -- Yes --> SlackAlert[Slack: High-Urgency Energy Alert]
        EvalBreach -- No --> LogNominal[Log: Nominal Energy State]
        SlackAlert --> EmitManifest[Debug Return: Energy Audit Manifest]
        LogNominal --> EmitManifest
    ```

    ## Architecture components
    - **Trigger**: Automated schedule polling at 15-minute recurring intervals.
    - **Script Task**: Scrapes CNCF Kepler eBPF Prometheus metrics endpoints using Docker container runners.
    - **Decision Gate**: Evaluates whether container Joules consumption rates or host DRAM power draw exceed limits.
    - **Notification Task**: Dispatches structured Slack alerts with cluster name, offending pod, and energy rate.
    - **Audit Manifest**: Emits JSON execution payloads containing container power draw and audit timestamps.

    ## Key capabilities
    - Real-time container-level power surveillance leveraging kernel-level eBPF instrumentation without application sidecars.
    - Early warning detection for CPU spinning loops and runaway GPU/crypto mining processes causing energy spikes.
    - Continuous tracking of DRAM memory bus saturation and platform package power draw across physical worker nodes.
    - Zero host dependency execution via isolated containerized Python runners.

    ## What you get
    - Real-time visibility into Kubernetes workload energy footprints and carbon intensity metrics.
    - Proactive alerts preventing server rack thermal throttling and unbudgeted cloud datacenter electricity bills.
    - Standardized audit manifests containing exact Joules measurements, offending namespace/pod details, and timestamps.
    - Seamless integration with ESG compliance dashboards, FinOps cost allocators, and green cloud initiatives.

    ## Who it's for
    - Site Reliability Engineers safeguarding node thermal stability and hardware longevity in high-density clusters.
    - FinOps leads optimizing datacenter energy costs and verifying green cloud sustainability targets.
    - Cloud Infrastructure architects establishing automated workload power throttling and green scheduling policies.
    - Platform engineers diagnosing CPU cache thrashing and memory bus saturation in containerized microservices.

    ## Why orchestrate this with Kestra
    - **Serverless Docker Isolation**: Executes telemetry scraping in ephemeral Docker environments without persistent workers.
    - **Centralized Secrets Governance**: Protects sensitive Slack webhooks using encrypted namespace secrets.
    - **Declarative YAML Workflows**: Manages cluster energy surveillance as versioned code in Git repositories.
    - **Comprehensive Audit History**: Preserves historical energy consumption metrics in searchable Kestra execution logs.

    ## Use cases
    - **Runaway Thread Energy Alarm**: Detects unconstrained worker threads spinning at 100% CPU and burning excess power.
    - **Thermal Throttling Prevention**: Alerts engineers before localized server blade overheating triggers CPU frequency drops.
    - **Green Cloud ESG Compliance**: Provides verifiable energy attribution data for corporate sustainability audits.

    ## Inputs
    | Name | Type | Default | Description |
    | --- | --- | --- | --- |
    | `kepler_metrics_url` | STRING | `http://kepler.kepler.svc.cluster.local:8888` | Internal Kubernetes HTTP endpoint exposing Prometheus metrics from Kepler. |
    | `cluster_name` | STRING | `k8s-prod-us-central` | Identifier of the target Kubernetes cluster monitored for power draw. |
    | `max_pod_power_joules_rate` | INT | `120` | Maximum allowable per-pod energy consumption rate in Joules per second. |
    | `max_node_dram_power_joules` | INT | `45` | Maximum allowable DRAM power consumption in Joules per second per node. |
    | `alert_on_unallocated_power` | BOOL | `true` | Toggle whether unallocated host power draw triggers an alert. |

    ## Expected outputs
    - `{{ outputs.scan_kepler_energy_telemetry.vars.peak_pod_joules_rate }}`: Peak observed container energy consumption rate.
    - `{{ outputs.scan_kepler_energy_telemetry.vars.peak_offending_pod }}`: Name of the pod consuming highest Joules rate.
    - `{{ outputs.scan_kepler_energy_telemetry.vars.peak_offending_namespace }}`: Namespace of the highest energy consuming pod.
    - `{{ outputs.scan_kepler_energy_telemetry.vars.peak_dram_joules }}`: Peak observed node DRAM power consumption in Joules.
    - `{{ outputs.scan_kepler_energy_telemetry.vars.energy_anomalies_count }}`: Count of container pods breaching energy thresholds.
    - `{{ outputs.scan_kepler_energy_telemetry.vars.is_alerting }}`: Boolean flag indicating if energy limits are breached.
    - `{{ outputs.scan_kepler_energy_telemetry.vars.audit_timestamp }}`: ISO-8601 UTC timestamp of the Kepler audit run.

    ## Prerequisites
    - CNCF Kepler deployed as a DaemonSet across target Kubernetes worker nodes with eBPF enabled.
    - Network connectivity from the Kestra worker to the Kepler service endpoint on port 8888.
    - Configured Slack incoming webhook URL with permissions to post in platform alert channels.

    ### Secrets
    - `SLACK_WEBHOOK_URL`: Secure webhook URL for routing energy anomaly alerts to the Platform Slack channel.

    ## Quick start
    1. Verify that Kepler DaemonSet pods are actively running and exposing metrics on port 8888.
    2. Add the `SLACK_WEBHOOK_URL` secret within your Kestra namespace settings.
    3. Specify your cluster identifier in `cluster_name`.
    4. Run a manual flow execution via the Kestra UI to validate metric ingestion.
    5. Enable the `periodic_kepler_energy_audit` schedule trigger to establish automated monitoring.

    ## Common pitfalls and troubleshooting
    - **Kernel Version Compatibility**: Kepler requires Linux kernel 5.4+ with BPF_PROG_TYPE_PERF_EVENT support.
    - **Hardware RAPL Access**: Virtualized nodes may lack access to hardware RAPL energy registers; Kepler falls back to ACPI.
    - **Metric Accumulation Units**: Kepler container metrics are cumulative Joules counters; rates reflect interval deltas.
    - **DaemonSet Scraping Topology**: In multi-node clusters, aggregate metrics via Prometheus or scrape the cluster service.

    ## How to extend
    - **Automated Workload Migration**: Evacuate high-energy pods to energy-efficient ARM nodes during peak electricity tariffs.
    - **Dynamic CPU Throttling**: Automatically adjust Kubernetes CPU limits downward when energy budgets are exceeded.
    - **Carbon Intensity Correlation**: Cross-reference Joules with regional grid carbon intensity to pause batch jobs.

    ## Links
    - [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
    - [CNCF Kepler Official Documentation](https://sustainable-computing-io.github.io/kepler-doc/)
    - [Kepler eBPF Metric Architecture Reference](https://github.com/sustainable-computing-io/kepler)
    - [Green Software Foundation Principles](https://greensoftware.foundation/)
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Monitoring & Alerting
    - Kubernetes Operations
  ee: false
  demo: false
