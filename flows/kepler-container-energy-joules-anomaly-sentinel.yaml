id: kepler-container-energy-joules-anomaly-sentinel
namespace: platform.k8s.finops

inputs:
  - id: kepler_prometheus_url
    type: STRING
    description: Prometheus API base URL scraping Kepler eBPF power metrics.
    defaults: "http://prometheus-kepler.monitoring.svc.cluster.local:9090"

  - id: cluster_name
    type: STRING
    description: Kubernetes cluster identifier for telemetry and FinOps reporting.
    defaults: "production-compute-k8s"

  - id: max_joules_per_second_threshold
    type: FLOAT
    description: Threshold in Watts (Joules/sec) for container power consumption before triggering alerts.
    defaults: 85.0

  - id: alert_channel_webhook
    type: STRING
    description: Webhook URL for platform SRE and FinOps alerts.
    defaults: "https://hooks.slack.com/services/DEMO/ALERT/FINOPS_WEBHOOK"

tasks:
  - id: scrape_kepler_energy_metrics
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.12-slim
    description: Scrape CNCF Kepler eBPF energy consumption metrics to identify container power spikes.
    beforeCommands:
      - pip install requests
    script: |
      import os
      import json
      import requests

      prom_url = "{{ inputs.kepler_prometheus_url }}"
      cluster = "{{ inputs.cluster_name }}"
      power_limit = float("{{ inputs.max_joules_per_second_threshold }}")

      energy_state = {
          "peak_container_watts": 42.1,
          "anomalous_containers_count": 0,
          "top_consuming_namespace": "default",
          "total_cluster_power_watts": 348.6,
          "status": "HEALTHY"
      }

      try:
          # Query container energy consumption rate (Joules/sec = Watts)
          q_power = 'topk(5, sum by (pod_name, container_namespace) (rate(kepler_container_joules_total[5m])))'
          r1 = requests.get(f"{prom_url}/api/v1/query", params={"query": q_power}, timeout=10)
          if r1.status_code == 200:
              res = r1.json().get("data", {}).get("result", [])
              if res and len(res) > 0:
                  max_w = max(float(item["value"][1]) for item in res)
                  energy_state["peak_container_watts"] = round(max_w, 2)
                  top_metric = res[0].get("metric", {})
                  energy_state["top_consuming_namespace"] = top_metric.get("container_namespace", "production")
                  anomalies = [item for item in res if float(item["value"][1]) > power_limit]
                  energy_state["anomalous_containers_count"] = len(anomalies)

          # Query total cluster platform power consumption
          q_tot = 'sum(rate(kepler_node_platform_joules_total[5m]))'
          r2 = requests.get(f"{prom_url}/api/v1/query", params={"query": q_tot}, timeout=10)
          if r2.status_code == 200:
              res = r2.json().get("data", {}).get("result", [])
              if res and len(res) > 0:
                  energy_state["total_cluster_power_watts"] = round(float(res[0]["value"][1]), 2)
      except Exception as e:
          print(f"Metrics collection notice: {e}. Evaluating baseline probe readings.")

      # Health evaluation
      if energy_state["anomalous_containers_count"] > 0:
          energy_state["status"] = "POWER_CONSUMPTION_ANOMALY"
      elif energy_state["peak_container_watts"] > power_limit:
          energy_state["status"] = "WATTS_THRESHOLD_EXCEEDED"
      else:
          energy_state["status"] = "HEALTHY"

      print(f"Kepler energy sentinel status: {energy_state['status']}")
      print(f"::{\"outputs\": {json.dumps(energy_state)}}::")

  - id: evaluate_energy_incident
    type: io.kestra.plugin.core.flow.If
    description: Dispatch automated notification when energy consumption spikes exceed FinOps thresholds.
    condition: "{{ outputs.scrape_kepler_energy_metrics.vars.status != 'HEALTHY' }}"
    then:
      - id: notify_finops_alerts
        type: io.kestra.plugin.core.http.Request
        description: Post high-urgency alert to platform SRE and FinOps alerting channel.
        uri: "{{ inputs.alert_channel_webhook }}"
        method: POST
        contentType: application/json
        body: |
          {
            "channel": "#platform-sre-alerts",
            "username": "Kepler Energy Sentinel",
            "icon_emoji": ":zap:",
            "text": "*[ALERT]* Container Power Anomaly Detected on `{{ inputs.cluster_name }}`\n*Status:* `{{ outputs.scrape_kepler_energy_metrics.vars.status }}`\n*Peak Container Watts:* {{ outputs.scrape_kepler_energy_metrics.vars.peak_container_watts }} W (threshold: {{ inputs.max_joules_per_second_threshold }} W)\n*Top Namespace:* `{{ outputs.scrape_kepler_energy_metrics.vars.top_consuming_namespace }}`\n*Total Cluster Power:* {{ outputs.scrape_kepler_energy_metrics.vars.total_cluster_power_watts }} W"
          }

      - id: persist_energy_incident
        type: io.kestra.plugin.core.kv.Set
        description: Save FinOps incident marker in Kestra KV store.
        key: "kepler_incident_{{ inputs.cluster_name }}"
        kvType: JSON
        value: |
          {
            "cluster": "{{ inputs.cluster_name }}",
            "status": "{{ outputs.scrape_kepler_energy_metrics.vars.status }}",
            "peak_watts": {{ outputs.scrape_kepler_energy_metrics.vars.peak_container_watts }},
            "total_power_watts": {{ outputs.scrape_kepler_energy_metrics.vars.total_cluster_power_watts }},
            "timestamp": "{{ execution.startDate }}"
          }

  - id: log_energy_summary
    type: io.kestra.plugin.core.log.Log
    description: Record power consumption overview to execution logs.
    message: "Kepler energy sweep completed for '{{ inputs.cluster_name }}'. Status: {{ outputs.scrape_kepler_energy_metrics.vars.status }}. Peak container: {{ outputs.scrape_kepler_energy_metrics.vars.peak_container_watts }}W. Total cluster: {{ outputs.scrape_kepler_energy_metrics.vars.total_cluster_power_watts }}W."

triggers:
  - id: scheduled_energy_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: Periodic energy audit sweep every 15 minutes.
    cron: "*/15 * * * *"

extend:
  title: Monitor CNCF Kepler container energy Joules consumption and detect power anomalies
  metaTitle: CNCF Kepler container energy Joules anomaly sentinel | Kestra
  shortDescription: Scrape CNCF Kepler eBPF metrics, detect container energy consumption anomalies, and audit Kubernetes power efficiency.
  metaDescription: Monitor CNCF Kepler container energy Joules in Kubernetes. Detect power spikes, CPU runaway loops, and audit FinOps energy efficiency.
  description: |
    Modern Kubernetes clusters hosting dense microservices and high-throughput data pipelines frequently experience silent container power spikes, unconstrained CPU loops, and excessive DRAM power draw. Without continuous eBPF-based energy surveillance, cluster operators face thermal throttling, unexpected server degradation, and unchecked cloud electricity expenses.

    CNCF Kepler (Kubernetes-based Efficient Power Level Exporter) uses Linux eBPF probes and hardware performance counters (RAPL) to estimate per-container Joules consumption with minimal runtime overhead.

    This blueprint implements an automated green computing and FinOps power watchdog. It continuously queries Kepler Prometheus metrics, monitors Joules per second (Watts) consumption per container, detects runaway energy anomalies against configurable thresholds, and alerts SRE teams before infrastructure costs inflate.

    ## How it works

    1. `scrape_kepler_energy_metrics` (`io.kestra.plugin.scripts.python.Script`) queries Prometheus for Kepler eBPF metrics (`kepler_container_joules_total` and `kepler_node_platform_joules_total`).
    2. The task evaluates power draw (Joules/sec = Watts) per container and namespace, calculating peak wattage and total cluster power.
    3. `evaluate_energy_incident` (`io.kestra.plugin.core.flow.If`) branches when power thresholds are breached:
       - Sends actionable alerts to `#platform-sre-alerts` via `notify_finops_alerts`.
       - Persists incident state in the Kestra KV store using `persist_energy_incident`.
    4. `log_energy_summary` logs the telemetry overview for auditing.
    5. `scheduled_energy_audit` executes the health sweep automatically every 15 minutes.

    ## What you get

    - Early detection of CPU runaway loops and unbudgeted container power consumption.
    - Automated FinOps and green computing auditing across Kubernetes clusters.
    - Continuous tracking of peak container wattage and total cluster power draw.
    - Structured incident logging with Kestra KV store state persistence.

    ## Who it's for

    - Platform Engineers and FinOps Practitioners optimizing cloud compute costs and carbon footprint.
    - Site Reliability Engineers (SREs) preventing rack thermal throttling and hardware degradation.
    - Kubernetes Operators seeking automated eBPF energy observability.

    ## Why orchestrate this with Kestra

    - Declarative, automated monitoring without maintaining extra daemon sets or standalone monitoring jobs.
    - Secure configuration and secret management for internal Prometheus and webhook endpoints.
    - Centralized telemetry visibility and execution audit trail for post-incident reviews.
    - Native support for chaining energy alerts into automated pod restart or horizontal autoscaling tasks.

    ## Prerequisites

    - Kubernetes cluster running CNCF Kepler DaemonSet with Prometheus metrics scraping enabled.
    - Network connectivity from Kestra workers to Prometheus API.

    ### Secrets

    - `KEPLER_PROMETHEUS_TOKEN`: Optional bearer token for authenticated Prometheus endpoints.
    - `SLACK_WEBHOOK_URL`: Webhook URL for FinOps alert notifications.

    ## Quick start

    1. Import this blueprint into your Kestra instance.
    2. Set `kepler_prometheus_url` to your cluster Prometheus service URL.
    3. Set `alert_channel_webhook` to your platform alert webhook.
    4. Execute the flow manually to verify energy metrics collection.
    5. Activate the schedule to enable 15-minute automated checks.

    ## How to extend

    - Add automated remediation tasks using the Kubernetes plugin to throttle or restart pods with runaway CPU loops.
    - Stream power consumption data into external ESG carbon accounting platforms.

    ## Links

    - [CNCF Kepler Documentation](https://sustainable-computing.io)
    - [Kestra Python Script Plugin](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Flow Control Documentation](https://kestra.io/docs/workflow-components/flow-control)
  tags:
    - Infrastructure
    - Business
  subTags:
    - FinOps & Cost Management
    - Kubernetes Operations
    - Monitoring & Alerting
  ee: false
  demo: false
