id: pgvector-ivfflat-lists-undersized-reindex-guard
namespace: company.team

inputs:
  - id: postgres_url
    type: STRING
    defaults: jdbc:postgresql://localhost:5432/postgres
    description: >-
      PostgreSQL JDBC URL for the database that holds the pgvector indexes. Example jdbc:postgresql://postgres:5432/app.

  - id: use_secret_auth
    type: BOOL
    defaults: true
    description: >-
      Leave true in production so the connection reads POSTGRES_USERNAME and POSTGRES_PASSWORD from secrets. Set false only to pass credentials inline in a disposable test environment.

  - id: postgres_username
    type: STRING
    defaults: postgres
    description: Username used only when use_secret_auth is false. Ignored in production.

  - id: postgres_password
    type: STRING
    defaults: ""
    description: Password used only when use_secret_auth is false. Ignored in production.

  - id: only_schema
    type: STRING
    defaults: ""
    description: >-
      Optional single schema to restrict the scan to. Leave empty to scan every user schema in the database.

  - id: min_table_rows
    type: INT
    defaults: 1000
    description: >-
      Smallest estimated row count that earns a rebuild. Below this an IVFFlat index probes almost the whole table whatever its lists value, so retuning it buys nothing.

  - id: undersize_factor
    type: FLOAT
    defaults: 4.0
    description: >-
      How far below guidance an index has to sit before it is reported. An index is a finding when the recommended lists is at least this many times its current lists. At the default of 4.0 a table has to have grown about fourfold since the index was built, which keeps normal growth out of the report.

  - id: max_lists
    type: INT
    defaults: 10000
    description: >-
      Ceiling on the recommended lists. The formula alone would ask for tens of thousands of lists on a very large table. Every list costs memory in the index and a probe at query time. This caps what the flow will ever build.

  - id: dry_run
    type: BOOL
    defaults: true
    description: When true, report the undersized indexes without rebuilding anything.

  - id: auto_remediate
    type: BOOL
    defaults: false
    description: >-
      When true and dry_run is false, rebuild each undersized index behind an approval gate, then re-read pg_class and fail if the lists value did not move.

variables:
  scan_sql: |
    WITH cfg AS (
      SELECT {{ inputs.min_table_rows }}::bigint AS min_rows,
             {{ inputs.undersize_factor }}::numeric AS factor,
             {{ inputs.max_lists }}::int AS max_lists,
             '{{ inputs.only_schema }}'::text AS only_schema
    ), ivf AS (
      SELECT n.nspname AS table_schema, t.relname AS table_name, ic.relname AS index_name,
             greatest(t.reltuples, 0)::bigint AS est_rows,
             (SELECT a.attname FROM unnest(i.indkey::int2[]) WITH ORDINALITY u(k, o)
                JOIN pg_attribute a ON a.attrelid = i.indrelid AND a.attnum = u.k
               WHERE o = 1) AS column_name,
             (SELECT op.opcname FROM unnest(i.indclass::oid[]) WITH ORDINALITY u(cls, o)
                JOIN pg_opclass op ON op.oid = u.cls WHERE o = 1) AS opclass,
             coalesce((SELECT substring(x FROM 'lists=([0-9]+)')::int
                         FROM unnest(coalesce(ic.reloptions, '{}'::text[])) x
                        WHERE x LIKE 'lists=%'), 100) AS current_lists,
             NOT EXISTS (SELECT 1 FROM unnest(coalesce(ic.reloptions, '{}'::text[])) x
                          WHERE x LIKE 'lists=%') AS lists_implicit,
             i.indisvalid, i.indnatts,
             (i.indpred IS NOT NULL) AS is_partial,
             (i.indexprs IS NOT NULL) AS is_expression,
             (ic.reltablespace <> 0) AS other_tablespace
        FROM pg_index i
        JOIN pg_class ic ON ic.oid = i.indexrelid
        JOIN pg_class t ON t.oid = i.indrelid
        JOIN pg_namespace n ON n.oid = t.relnamespace
        JOIN pg_am am ON am.oid = ic.relam
       WHERE am.amname = 'ivfflat'
         AND n.nspname NOT IN ('pg_catalog', 'information_schema')
    ), sized AS (
      SELECT v.*, cfg.min_rows, cfg.factor,
             least(cfg.max_lists, greatest(1, (CASE WHEN v.est_rows <= 1000000
                                                    THEN round(v.est_rows / 1000.0)
                                                    ELSE round(sqrt(v.est_rows)) END)::int)) AS recommended_lists,
             left(v.index_name, 59) || '_new' AS rebuild_name,
             CASE WHEN NOT v.indisvalid THEN 'index is invalid, REINDEX it before retuning lists'
                  WHEN v.indnatts > 1 THEN 'multi column index'
                  WHEN v.is_expression THEN 'index on an expression'
                  WHEN v.is_partial THEN 'partial index with a WHERE clause'
                  WHEN v.other_tablespace THEN 'index in a non default tablespace'
                  ELSE '' END AS skip_reason
        FROM ivf v CROSS JOIN cfg
       WHERE (cfg.only_schema = '' OR v.table_schema = cfg.only_schema)
    ), built AS (
      SELECT s.*,
             (s.table_schema || '.' || s.index_name) AS target,
             format('DROP INDEX IF EXISTS %I.%I;' || chr(10) ||
                    'CREATE INDEX %I ON %I.%I USING ivfflat (%I %I) WITH (lists = %s);' || chr(10) ||
                    'DROP INDEX %I.%I;' || chr(10) ||
                    'ALTER INDEX %I.%I RENAME TO %I;',
                    s.table_schema, s.rebuild_name,
                    s.rebuild_name, s.table_schema, s.table_name, s.column_name, s.opclass, s.recommended_lists,
                    s.table_schema, s.index_name,
                    s.table_schema, s.rebuild_name, s.index_name) AS fix_sql
        FROM sized s
    )
    SELECT target, table_schema, table_name, index_name, column_name, opclass, est_rows,
           current_lists, lists_implicit, recommended_lists, rebuild_name, skip_reason,
           min_rows, factor, fix_sql
      FROM built

tasks:
  - id: detect
    type: io.kestra.plugin.jdbc.postgresql.Query
    description: >-
      Read-only. Find every IVFFlat index, read its lists value out of the index reloptions, read the row count of the table it sits on, then compare the lists it has with the lists pgvector guidance asks for at that size. The operator class comes from indclass joined to pg_opclass and the first key column from indkey with ordinality, so the rebuild can preserve both exactly.
    url: "{{ inputs.postgres_url }}"
    username: "{{ inputs.use_secret_auth ? secret('POSTGRES_USERNAME') : inputs.postgres_username }}"
    password: "{{ inputs.use_secret_auth ? secret('POSTGRES_PASSWORD') : inputs.postgres_password }}"
    fetchType: FETCH
    sql: "{{ render(vars.scan_sql) }} WHERE skip_reason = '' AND est_rows >= min_rows AND recommended_lists >= current_lists * factor ORDER BY est_rows DESC, table_schema, index_name"

  - id: summarize
    type: io.kestra.plugin.core.output.OutputValues
    description: >-
      Build the readable target list once so the log, the alert and the rebuild loop all read the same set.
    values:
      names: >-
        {{ outputs.detect.rows | jq('map(.target + " [" + .column_name + " " + .opclass + ", " + (.est_rows | tostring) + " rows, lists " + (.current_lists | tostring) + (if .lists_implicit then " implicit" else "" end) + " wants " + (.recommended_lists | tostring) + "]") | join(" | ")') | first }}
      targets_json: "{{ outputs.detect.rows | toJson }}"

  - id: log_detect
    type: io.kestra.plugin.core.log.Log
    message: |
      IVFFlat indexes whose lists no longer fits the table: {{ outputs.detect.size }} found.
      Targets: {{ outputs.summarize.values.names }}
      Mode: dry_run={{ inputs.dry_run }} auto_remediate={{ inputs.auto_remediate }} min_table_rows={{ inputs.min_table_rows }} undersize_factor={{ inputs.undersize_factor }} max_lists={{ inputs.max_lists }}

  - id: guard
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.detect.size > 0 }}"
    then:
      - id: findings_alert
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: >-
          Alert on every detection, in dry run as well as in remediate mode, so a human sees the degraded recall even when nothing is rebuilt.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {"text": "pgvector IVFFlat lists guard: {{ outputs.detect.size }} index(es) partition their vectors into far fewer lists than the table size now warrants, so every probe scans a much larger slice than it should and recall drops. REINDEX cannot fix this because lists is a build parameter. Targets {{ outputs.summarize.values.names }}. dry_run={{ inputs.dry_run }} auto_remediate={{ inputs.auto_remediate }}."}

      - id: mode
        type: io.kestra.plugin.core.flow.If
        condition: "{{ inputs.auto_remediate and not inputs.dry_run and outputs.detect.size > 0 }}"
        then:
          - id: approval_gate
            type: io.kestra.plugin.core.flow.Pause
            description: >-
              Hold the run until a human approves the rebuilds. Each rebuild reads every vector in the table to train the new lists, so it costs as long as the original build did and holds a lock that blocks writes on that table for the whole time.
            pauseDuration: PT2H
            behavior: FAIL
            onResume:
              - id: approved
                type: BOOL
                defaults: false
                description: >-
                  Set true to rebuild the listed indexes. Anything else leaves them as they are. Read the Pause message first: it names every index and the write lock each rebuild takes.

          - id: apply
            type: io.kestra.plugin.core.flow.If
            condition: "{{ outputs.approval_gate.onResume.approved ?? false }}"
            then:
              - id: remediate_lists
                type: io.kestra.plugin.core.flow.Loop
                description: >-
                  Remediation loop. One rebuild per index, concurrencyLimit 1 so two builds never compete for maintenance_work_mem or for a lock on the same table. allowFailure so one rejected rebuild does not stop the pass, because the re-read of pg_class is the real gate.
                concurrencyLimit: 1
                values: "{{ outputs.summarize.values.targets_json }}"
                tasks:
                  - id: rebuild_one
                    type: io.kestra.plugin.jdbc.postgresql.Queries
                    description: >-
                      Build the replacement under a temporary name, drop the old index, then rename the new one into its place. transaction true runs all of it as one unit, so other sessions keep using the old index until the swap commits and there is never a moment when the column has no IVFFlat index. If any statement fails the whole swap rolls back and the original index is still there.
                    allowFailure: true
                    url: "{{ inputs.postgres_url }}"
                    username: "{{ inputs.use_secret_auth ? secret('POSTGRES_USERNAME') : inputs.postgres_username }}"
                    password: "{{ inputs.use_secret_auth ? secret('POSTGRES_PASSWORD') : inputs.postgres_password }}"
                    fetchType: NONE
                    transaction: true
                    sql: "{{ fromJson(item.value).fix_sql }}"

                  - id: rebuild_log
                    type: io.kestra.plugin.core.log.Log
                    message: "Swapped {{ fromJson(item.value).target }} from lists {{ fromJson(item.value).current_lists }} to {{ fromJson(item.value).recommended_lists }}, keeping column {{ fromJson(item.value).column_name }} and operator class {{ fromJson(item.value).opclass }}."

              - id: reverify
                type: io.kestra.plugin.jdbc.postgresql.Query
                description: >-
                  Read every IVFFlat index again, unfiltered, so the gate can compare each target against what is actually in the catalog now: the lists value, the operator class and whether the index is still there at all.
                url: "{{ inputs.postgres_url }}"
                username: "{{ inputs.use_secret_auth ? secret('POSTGRES_USERNAME') : inputs.postgres_username }}"
                password: "{{ inputs.use_secret_auth ? secret('POSTGRES_PASSWORD') : inputs.postgres_password }}"
                fetchType: FETCH
                sql: "{{ render(vars.scan_sql) }} ORDER BY table_schema, index_name"

              - id: verify_plan
                type: io.kestra.plugin.core.output.OutputValues
                description: >-
                  Compare every target with the catalog after the pass. A target fails if its index is gone, if its lists is still below the value the rebuild was meant to set or if the operator class is not the one it had before, because an index rebuilt for a different distance is an index the planner will never use.
                values:
                  still_json: >-
                    {{ {'t': outputs.detect.rows, 'r': outputs.reverify.rows} | toJson | jq('.t as $t | .r as $r | $t | map(. as $x | (($r | map(select(.target == $x.target)))[0]) as $a | {target: $x.target, reason: (if $a == null then "index is gone after the pass" elif $a.opclass != $x.opclass then ("operator class became " + $a.opclass + " instead of " + $x.opclass) elif ($a.current_lists | tonumber) < ($x.recommended_lists | tonumber) then ("lists is still " + ($a.current_lists | tostring) + " and not " + ($x.recommended_lists | tostring)) else null end)}) | map(select(.reason != null))') | first | toJson }}
                  still_names: >-
                    {{ {'t': outputs.detect.rows, 'r': outputs.reverify.rows} | toJson | jq('.t as $t | .r as $r | $t | map(. as $x | (($r | map(select(.target == $x.target)))[0]) as $a | {target: $x.target, reason: (if $a == null then "index is gone after the pass" elif $a.opclass != $x.opclass then ("operator class became " + $a.opclass + " instead of " + $x.opclass) elif ($a.current_lists | tonumber) < ($x.recommended_lists | tonumber) then ("lists is still " + ($a.current_lists | tostring) + " and not " + ($x.recommended_lists | tostring)) else null end)}) | map(select(.reason != null) | .target + ": " + .reason) | join(" | ")') | first }}
                  after_names: >-
                    {{ {'t': outputs.detect.rows, 'r': outputs.reverify.rows} | toJson | jq('.t as $t | .r as $r | $t | map(. as $x | (($r | map(select(.target == $x.target)))[0]) as $a | $x.target + " lists " + ($x.current_lists | tostring) + " to " + (if $a == null then "gone" else ($a.current_lists | tostring) end) + " opclass " + (if $a == null then "gone" else $a.opclass end)) | join(" | ")') | first }}

              - id: verify_result
                type: io.kestra.plugin.core.flow.If
                condition: "{{ (outputs.verify_plan.values.still_json | jq('length') | first) > 0 }}"
                then:
                  - id: remediation_failed
                    type: io.kestra.plugin.core.execution.Fail
                    errorMessage: >-
                      {{ outputs.verify_plan.values.still_json | jq('length') | first }} of {{ outputs.detect.size }} targeted IVFFlat index(es) did not come out of the pass retuned: {{ outputs.verify_plan.values.still_names }}. The connecting role may not own the table, maintenance_work_mem may have been too small or a statement in the swap failed and rolled the whole swap back, which leaves the original index in place.
                else:
                  - id: remediated
                    type: io.kestra.plugin.core.log.Log
                    message: "Retuned and verified. {{ outputs.detect.size }} index(es) were undersized before, 0 after. Each one kept its name, its column and its operator class: {{ outputs.verify_plan.values.after_names }}."
            else:
              - id: not_approved
                type: io.kestra.plugin.core.log.Log
                message: "Approval not granted, so nothing was rebuilt. {{ outputs.detect.size }} index(es) still probe far more vectors per query than they should."
        else:
          - id: report_only
            type: io.kestra.plugin.core.log.Log
            message: "Report only (dry_run={{ inputs.dry_run }}, auto_remediate={{ inputs.auto_remediate }}). {{ outputs.detect.size }} index(es) would be rebuilt: {{ outputs.summarize.values.names }}. No change made."
    else:
      - id: clean
        type: io.kestra.plugin.core.log.Log
        message: "Every IVFFlat index in scope partitions its vectors into enough lists for the rows its table now holds. Nothing to rebuild."

errors:
  - id: alert_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: >-
      Post to Slack on any failure, including a connection error, a rejected rebuild or a target that came out of the pass still undersized.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {"text": "pgvector IVFFlat undersized lists reindex guard FAILED (execution {{ execution.id }}). A connection error, a rejected rebuild or a target still undersized after the pass. Check the run."}

triggers:
  - id: monthly_ivfflat_lists_check
    type: io.kestra.plugin.core.trigger.Schedule
    disabled: true
    cron: "0 3 1 * *"
    description: >-
      Monthly sweep for IVFFlat indexes the table has outgrown. Disabled by default and pinned to safe mode, so it reports without rebuilding anything until an operator enables it.
    inputs:
      dry_run: true
      auto_remediate: false

extend:
  title: pgvector IVFFlat Undersized Lists Rebuild Guard
  shortDescription: Find pgvector IVFFlat indexes whose lists value no longer fits the row count, rebuild each one at the right lists in a single transaction that keeps the old index serving queries until the swap commits, then verify the catalog.
  metaTitle: pgvector IVFFlat Undersized Lists Rebuild Guard with Kestra
  metaDescription: Find pgvector IVFFlat indexes whose lists is too small for the table, rebuild them at the right lists with no index-free window, then verify.
  description: |
    `REINDEX` cannot fix an IVFFlat index whose `lists` is wrong. `lists` is a build parameter, baked into the index when it is created. `REINDEX` rebuilds the same index with the same parameters. The only repair is to drop the index and create it again with a different number.

    That matters because the right `lists` depends on how many rows the table holds. An IVFFlat index partitions the vectors into `lists` buckets and a query probes only a few of them, so the bucket count is what decides how much of the table a probe has to read. pgvector's guidance is about `rows / 1000` up to a million rows, then `sqrt(rows)`. An index built when the table held a few thousand rows keeps its original small `lists` after the table grows to millions. Each bucket is then enormous, each probe reads far more vectors than it should. Recall drops because a fixed number of probes now covers a smaller fraction of the data.

    Nothing reports it. The index is valid. `\d` shows it. Queries still return rows. They are just slower and less accurate. No `pg_stat` counter or log line says why.

    This blueprint was created by [zkasuran](https://github.com/zkasuran).

    ## Safety

    - Read-only by default. `dry_run` is true and `auto_remediate` is false, so a plain run reports and rebuilds nothing.
    - A rebuild happens only when `auto_remediate` is true and `dry_run` is false. It then waits for a human to resume the `Pause` with `approved` set true. An unanswered gate reads as not approved.
    - **There is no window without an index.** The naive repair is `DROP INDEX` then `CREATE INDEX`. Between those two statements the column has no approximate nearest neighbour index at all, so every similarity query falls back to a sequential scan with an exact distance per row. On a large table the rebuild is minutes to hours, which makes that window a real outage rather than a formality. This flow builds the replacement under a temporary name first, then drops the old index, then renames the new one into its place. All four statements run as one transaction. Other sessions keep using the old index until the swap commits.
    - Because the swap is one transaction, a failure anywhere in it rolls the whole thing back and the original index is still there, under its original name. A half-finished rebuild cannot leave the column unindexed.
    - The operator class is read from `pg_index.indclass` and replayed exactly. Rebuilding with a different distance would silently produce an index the planner never uses for the queries that relied on it, which looks like a successful repair and is not.
    - The index keeps its name, so nothing that references it by name has to change.
    - `undersize_factor` means normal growth is not a finding. At the default of 4.0 the table has to have grown about fourfold past what the index was built for.
    - The re-read of the catalog is the real gate. The run fails if any target is still below the `lists` it was meant to get, if its operator class changed or if the index is missing.

    ### What the rebuild costs

    The transaction is safe, not free. The `CREATE INDEX` holds a lock that blocks writes on that table for the whole build. The `DROP INDEX` takes a brief exclusive lock at the end that blocks reads for a moment. Both copies of the index exist on disk until the swap commits, so plan for the extra space. Run it in a maintenance window, which is what the `Pause` is for.

    ## How it works

    1. `detect` (`io.kestra.plugin.jdbc.postgresql.Query`, read-only) joins `pg_index` to `pg_class` and `pg_am` to find every `ivfflat` index, parses the `lists` value out of the index `reloptions` (falling back to pgvector's default of 100 when the index was created without one), reads the estimated row count of its table, derives the recommended `lists` from the row count then returns one row per index that sits at least `undersize_factor` times below it. Each row carries the first key column from `unnest(indkey) WITH ORDINALITY`, the operator class from `unnest(indclass) WITH ORDINALITY` joined to `pg_opclass` plus the exact rebuild script built inside PostgreSQL with `format('%I')`.
    2. `summarize` (`io.kestra.plugin.core.output.OutputValues`) builds the readable target list and the JSON the loop iterates, so the log, the alert and the loop read the same set.
    3. `log_detect` (`io.kestra.plugin.core.log.Log`) logs the count, the targets and the mode.
    4. `guard` (`io.kestra.plugin.core.flow.If`) branches on the count. With none found, `clean` logs and the run ends. Otherwise `findings_alert` posts the finding on every detection.
    5. `mode` (`io.kestra.plugin.core.flow.If`) enters the remediation branch only when `auto_remediate` is true and `dry_run` is false. Otherwise `report_only` lists what would be rebuilt and stops.
    6. `approval_gate` (`io.kestra.plugin.core.flow.Pause`) holds the run for a human. `remediate_lists` (`io.kestra.plugin.core.flow.Loop`, `concurrencyLimit: 1`) then runs one swap per index, in turn, through `io.kestra.plugin.jdbc.postgresql.Queries` with `transaction: true`: create under a temporary name, drop the old, rename the new into place.
    7. `reverify` reads every IVFFlat index again, `verify_plan` compares each target with the catalog. `verify_result` fails the run through `io.kestra.plugin.core.execution.Fail` if any target is still undersized, lost its operator class or is missing.

    ## What you get

    - Every IVFFlat index whose `lists` no longer fits its table, largest table first, with the value it has and the value it should have.
    - An index created without an explicit `lists` handled correctly, at pgvector's default of 100, which is undersized for anything past a few hundred thousand rows.
    - A rebuild that preserves the index name, the key column and the operator class, so queries that used the index keep using it.
    - A swap with no index-free window and no half-finished state, because it is one transaction.
    - A real verification step. The run passes only when the catalog shows every target at or above the `lists` it was meant to get, with the operator class it started with.
    - Slack alerts on the findings and on any failure.

    ## Who it's for

    - Teams running semantic search or retrieval augmented generation on PostgreSQL with pgvector, where the embedding table grows every day but the index was built once.
    - Platform engineers who inherited a pgvector schema and have no idea what `lists` any of its indexes were built with.
    - Anyone whose vector search got slower and less accurate after a backfill and who has already tried `REINDEX`.

    ## Why orchestrate this with Kestra

    The catalog query answers it once. Kestra runs it every month and after every backfill, so an index the table has outgrown is caught before the recall complaints arrive. The rebuild sits behind `auto_remediate`, `dry_run` and a `Pause`, which is what a lock taking rebuild needs. One index per loop iteration keeps a failure isolated. The re-read of the catalog decides whether the run passed. The execution history records which index was retuned, from what to what and when.

    ## Tested end to end

    On Kestra 2.0.5 OSS against `pgvector/pgvector:pg16` (pgvector 0.8.2, read from `vector.control`), with a local HTTP sink standing in for Slack. Seeded in one database:

    - `docs.embedding` `vector(3)`, an `ivfflat` index with `vector_cosine_ops` built with `lists = 1` while the table held 50 rows, then grown to 40,000 rows, where guidance asks for 40;
    - `docs.title_embedding` `vector(3)`, an `ivfflat` index with `lists = 40` on the same 40,000 rows, already at guidance;
    - `docs.body_embedding` `vector(3)`, an `hnsw` index, which has no `lists` at all;
    - `notes.summary` `vector(3)`, an `ivfflat` index with `lists = 1` on 500 rows, correct at that size;
    - `big.e` `vector(3)`, an `ivfflat` index created with no `lists` clause on 500,000 rows, so it carries pgvector's default of 100 where guidance asks for 500;
    - `plain_items`, no vector column.

    | Run | Inputs | Result |
    |---|---|---|
    | 1 | defaults, healthy state | 0 findings, `clean` logged |
    | 2 | defaults, degraded state | 1 finding, `public.docs_embedding_ivf_idx` at `lists = 1` against a recommended 40. The already sized index, the HNSW index and the small table are absent. Alert sent |
    | 3 | `auto_remediate: true`, `dry_run: true` | Same finding, nothing rebuilt, `report_only` |
    | 4 | `auto_remediate: true`, `dry_run: false`, approved | Index swapped to `lists = 40`, same name, same `vector_cosine_ops`, verified from `pg_class` and `pg_index` |
    | 5 | `auto_remediate: true`, `dry_run: false`, resumed without approval | nothing rebuilt, `not_approved` |
    | 6 | approved, but the connecting role does not own the table | the swap was rejected, the original index survived at `lists = 1` and the verify step failed the run |
    | 7 | unreachable database | run failed and the `errors` block posted to Slack |
    | 8 | two targets, approved | the loop ran both swaps in turn, `lists 100 to 500` on the 500,000 row table and `lists 1 to 40` on the other, both keeping `vector_cosine_ops` |

    The plan is the evidence. With `lists = 1` the index has one bucket, so `EXPLAIN (ANALYZE, BUFFERS)` on `SELECT id FROM docs ORDER BY embedding <=> '[0.1,0.2,0.3]' LIMIT 5` read every entry page of the index on a single probe (`shared hit=193`). After the swap to `lists = 40` the same query at `ivfflat.probes = 1` read about a fortieth of them (`shared hit=21`).

    The zero window was measured too. With one session holding an open transaction that had already built the replacement, a second session still planned `Index Scan using docs_embedding_ivf_idx` on the same column, so similarity queries never fell back to a sequential scan during the build.

    ## Prerequisites

    - pgvector installed in the database (`CREATE EXTENSION vector`) with at least one `ivfflat` index. Detection reads `pg_index`, `pg_class`, `pg_am`, `pg_opclass` and `pg_attribute`, which any role can read.
    - Remediation needs a role that owns the tables, since `CREATE INDEX` and `DROP INDEX` do.
    - Raise `maintenance_work_mem` for the session or the database before a large rebuild. A build that does not fit in memory falls back to a much slower path.
    - Space for both copies of the index until the swap commits.
    - Local testing:
      - `docker run -d --name pgvec -p 5432:5432 -e POSTGRES_PASSWORD=pg pgvector/pgvector:pg16`;
      - `CREATE EXTENSION vector`, a table with a `vector` column, an `ivfflat` index built with `WITH (lists = 1)` while the table is tiny, then a few tens of thousands of rows inserted after it.

    ### Secrets

    - `POSTGRES_USERNAME` and `POSTGRES_PASSWORD`: credentials used by every query.
    - `SLACK_WEBHOOK_URL`: used by `findings_alert` and the `errors` block.
    - In Kestra OSS, provide each one as a base64 encoded environment variable prefixed `SECRET_`.

    ### Inputs

    | Input | Default | Purpose |
    |---|---|---|
    | `postgres_url` | `jdbc:postgresql://localhost:5432/postgres` | Database to check |
    | `use_secret_auth` | `true` | Read credentials from secrets. Set false only in a disposable test |
    | `postgres_username` | `postgres` | Inline username when `use_secret_auth` is false |
    | `postgres_password` | empty | Inline password when `use_secret_auth` is false |
    | `only_schema` | empty | Restrict to one schema |
    | `min_table_rows` | `1000` | Smallest table worth retuning |
    | `undersize_factor` | `4.0` | How far below guidance an index has to sit to be reported |
    | `max_lists` | `10000` | Ceiling on the recommended `lists` |
    | `dry_run` | `true` | Must be `false` for a rebuild to run |
    | `auto_remediate` | `false` | Must be `true` for a rebuild to run |

    ## Quick start

    1. Add the `POSTGRES_USERNAME`, `POSTGRES_PASSWORD` and `SLACK_WEBHOOK_URL` secrets.
    2. Import the flow and set `postgres_url`.
    3. Run it once and read the findings. Each line gives the index, its column, its operator class, the rows the table holds, the `lists` it has and the `lists` it wants.
    4. Lower `undersize_factor` to 2.0 to see the indexes that are drifting rather than badly wrong.
    5. Pick a maintenance window, raise `maintenance_work_mem`, then run it with `auto_remediate: true` and `dry_run: false` and resume the `Pause` with `approved` set true.
    6. Raise `ivfflat.probes` afterwards. More lists with the same probes means each query reads a smaller share of the data, so recall needs the probes to come up with the lists. pgvector suggests about `sqrt(lists)`.
    7. Enable the `monthly_ivfflat_lists_check` trigger, which always runs in safe mode.

    ## How to extend

    - Swap `CREATE INDEX` for `CREATE INDEX CONCURRENTLY` where no write lock can be taken. It cannot run inside a transaction, so the swap stops being atomic and a failure can leave an invalid index under the temporary name, which the verify step already reports.
    - Set `ivfflat.probes` per database with `ALTER DATABASE ... SET ivfflat.probes` as part of the same change, so probes and lists move together.
    - Drive the recommendation from `count(*)` instead of `reltuples` where the table is not analyzed often. It is exact and much more expensive.
    - Add an HNSW branch for indexes whose `m` and `ef_construction` were left at defaults on a table that has since grown.
    - Loop over several JDBC URLs to sweep every database of a cluster.
    - Record each rebuild in a table so the next run can see how long the previous one took on that table.

