id: github-release-asset-integrity-gate
namespace: company.infrastructure
description: |
  Audit the latest published GitHub release for a public repository before promotion. The flow checks
  release metadata, prerelease policy, asset count, download URLs, zero-byte files, and the presence
  of a SHA-256/SHA-512 checksum manifest. It produces a machine-readable evidence report and can
  optionally archive that report to S3. A failed policy sends a Slack alert and fails the flow.

inputs:
  - id: repository
    type: STRING
    displayName: GitHub repository
    defaults: cli/cli
    description: Public GitHub repository in owner/name format.
  - id: minimum_asset_count
    type: INT
    displayName: Minimum release assets
    defaults: 2
    description: Minimum number of downloadable assets required for the latest published release.
  - id: checksum_asset_pattern
    type: STRING
    displayName: Checksum manifest filename pattern
    defaults: '(?i)(checksum|sha[-_]?256|sha[-_]?512)'
    description: Python regular expression matching an asset name that represents a SHA-256 or SHA-512 checksum manifest.
  - id: require_checksum_manifest
    type: BOOL
    displayName: Require checksum manifest
    defaults: true
    description: Block promotion if no release asset filename matches the configured checksum pattern.
  - id: reject_zero_byte_assets
    type: BOOL
    displayName: Reject zero-byte assets
    defaults: true
    description: Block promotion if GitHub reports any release asset with size zero.
  - id: allow_prerelease
    type: BOOL
    displayName: Allow prerelease
    defaults: false
    description: When false, a GitHub prerelease is a blocking finding.
  - id: archive_report
    type: BOOL
    displayName: Archive report to S3
    defaults: false
    description: Store the JSON evidence report in an S3 bucket. AWS secrets are required only when enabled.
  - id: evidence_bucket
    type: STRING
    displayName: S3 evidence bucket
    defaults: my-release-audit-evidence
    description: Existing S3 bucket used only when archive_report is enabled.
  - id: evidence_prefix
    type: STRING
    displayName: S3 evidence prefix
    defaults: github-release-audits
    description: Prefix for repository- and release-specific JSON audit reports.
  - id: aws_region
    type: STRING
    displayName: AWS region
    defaults: eu-west-1
    description: Region containing the evidence bucket.

triggers:
  - id: weekday_release_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: Recheck the latest release each weekday after the upstream project’s release activity. Enable after configuring alert secrets and policy inputs.
    cron: "0 9 * * 1-5"
    disabled: true

tasks:
  - id: validate_request
    type: io.kestra.plugin.scripts.python.Script
    description: Reject malformed repository names and policy inputs before contacting the GitHub API.
    containerImage: python:3.12-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    env:
      REPOSITORY: "{{ inputs.repository }}"
      MINIMUM_ASSET_COUNT: "{{ inputs.minimum_asset_count }}"
      CHECKSUM_ASSET_PATTERN: "{{ inputs.checksum_asset_pattern }}"
    script: |
      import os
      import re

      repository = os.environ.get("REPOSITORY", "").strip()
      minimum = os.environ.get("MINIMUM_ASSET_COUNT", "").strip()
      checksum_pattern = os.environ.get("CHECKSUM_ASSET_PATTERN", "")

      if not re.fullmatch(r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+", repository):
          raise ValueError("repository must be a public GitHub owner/name pair")
      try:
          minimum_count = int(minimum)
      except ValueError as exc:
          raise ValueError("minimum_asset_count must be an integer") from exc
      if minimum_count < 0:
          raise ValueError("minimum_asset_count cannot be negative")
      try:
          re.compile(checksum_pattern)
      except re.error as exc:
          raise ValueError(f"checksum_asset_pattern is not a valid Python regular expression: {exc}") from exc

      print(f"Validated repository={repository}, minimum_asset_count={minimum_count}, checksum pattern syntax.")

  - id: fetch_latest_release
    type: io.kestra.plugin.core.http.Request
    description: Fetch public release metadata, then audit the most recently published non-draft release by its published_at timestamp, including prereleases so policy can explicitly allow or block them. Release binaries are not downloaded.
    uri: "https://api.github.com/repos/{{ inputs.repository }}/releases?per_page=10"
    method: GET
    headers:
      Accept: application/vnd.github+json
      X-GitHub-Api-Version: "2022-11-28"
      User-Agent: Kestra-GitHub-Release-Asset-Integrity-Gate/1.0
    timeout: PT30S

  - id: audit_release_assets
    type: io.kestra.plugin.scripts.python.Script
    description: Evaluate release metadata, asset inventory, zero-byte sizes, HTTPS download URLs, and optional checksum-manifest policy. Produce JSON evidence; this checks manifest presence, not the cryptographic contents of the manifest.
    containerImage: python:3.12-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    dependencies:
      - kestra
    inputFiles:
      release.json: "{{ outputs.fetch_latest_release.body }}"
    env:
      REPOSITORY: "{{ inputs.repository }}"
      MINIMUM_ASSET_COUNT: "{{ inputs.minimum_asset_count }}"
      CHECKSUM_ASSET_PATTERN: "{{ inputs.checksum_asset_pattern }}"
      REQUIRE_CHECKSUM_MANIFEST: "{{ inputs.require_checksum_manifest }}"
      REJECT_ZERO_BYTE_ASSETS: "{{ inputs.reject_zero_byte_assets }}"
      ALLOW_PRERELEASE: "{{ inputs.allow_prerelease }}"
    outputFiles:
      - release-audit.json
    script: |
      import json
      import os
      import re
      from datetime import datetime, timezone

      from kestra import Kestra

      repository = os.environ["REPOSITORY"].strip()
      minimum_asset_count = int(os.environ.get("MINIMUM_ASSET_COUNT", "2"))
      checksum_pattern_text = os.environ.get("CHECKSUM_ASSET_PATTERN", "")
      require_checksum = os.environ.get("REQUIRE_CHECKSUM_MANIFEST", "true").lower() == "true"
      reject_zero_byte = os.environ.get("REJECT_ZERO_BYTE_ASSETS", "true").lower() == "true"
      allow_prerelease = os.environ.get("ALLOW_PRERELEASE", "false").lower() == "true"
      checksum_pattern = re.compile(checksum_pattern_text)

      with open("release.json", encoding="utf-8") as source:
          release_payload = json.load(source)
      if isinstance(release_payload, dict) and "message" in release_payload:
          raise ValueError(f"GitHub release API returned an error: {release_payload.get('message')}")
      if not isinstance(release_payload, list):
          raise ValueError("GitHub releases API response must be a JSON array")

      published_releases = [
          item for item in release_payload
          if isinstance(item, dict)
          and not bool(item.get("draft", False))
          and isinstance(item.get("published_at"), str)
          and item.get("published_at").strip()
      ]
      if not published_releases:
          raise ValueError("GitHub repository has no published, non-draft releases")
      release = max(published_releases, key=lambda item: item["published_at"])

      findings = []
      def add(code, severity, message):
          findings.append({"code": code, "severity": severity, "message": message})

      tag_name = str(release.get("tag_name") or "").strip()
      release_url = str(release.get("html_url") or "").strip()
      published_at = release.get("published_at")
      prerelease = bool(release.get("prerelease", False))
      draft = bool(release.get("draft", False))
      assets = release.get("assets") or []

      if not tag_name:
          add("RELEASE_TAG_MISSING", "BLOCK", "The GitHub API response does not contain a release tag.")
      if not release_url.startswith("https://github.com/"):
          add("RELEASE_URL_INVALID", "BLOCK", "The release page URL is missing or is not an HTTPS GitHub URL.")
      if not published_at:
          add("PUBLISHED_DATE_MISSING", "BLOCK", "The latest release has no published_at timestamp.")
      if draft:
          add("DRAFT_RELEASE", "BLOCK", "The selected release is marked as a draft.")
      if prerelease and not allow_prerelease:
          add("PRERELEASE_BLOCKED", "BLOCK", "The latest release is a prerelease and policy does not allow prereleases.")

      if not isinstance(assets, list):
          add("ASSET_INVENTORY_INVALID", "BLOCK", "GitHub returned a non-list asset inventory.")
          assets = []
      if len(assets) < minimum_asset_count:
          add("ASSET_COUNT_BELOW_MINIMUM", "BLOCK", f"Release has {len(assets)} asset(s), below the configured minimum of {minimum_asset_count}.")

      asset_names = []
      invalid_urls = []
      zero_byte_assets = []
      missing_names = []
      for asset in assets:
          if not isinstance(asset, dict):
              missing_names.append("<invalid asset entry>")
              continue
          name = str(asset.get("name") or "").strip()
          if not name:
              missing_names.append("<unnamed asset>")
              continue
          asset_names.append(name)
          size = asset.get("size")
          try:
              size_value = int(size)
          except (TypeError, ValueError):
              size_value = -1
          if size_value < 0:
              add("ASSET_SIZE_INVALID", "BLOCK", f"GitHub did not provide a valid non-negative size for asset '{name}'.")
          elif reject_zero_byte and size_value == 0:
              zero_byte_assets.append(name)
          url = str(asset.get("browser_download_url") or "")
          if not url.startswith("https://github.com/"):
              invalid_urls.append(name)

      if missing_names:
          add("ASSET_NAME_MISSING", "BLOCK", "Some release asset records do not have a valid name.")
      if zero_byte_assets:
          add("ZERO_BYTE_ASSETS", "BLOCK", "Zero-byte release assets detected: " + ", ".join(zero_byte_assets[:50]))
      if invalid_urls:
          add("ASSET_DOWNLOAD_URL_INVALID", "BLOCK", "Assets missing a GitHub HTTPS download URL: " + ", ".join(invalid_urls[:50]))

      duplicate_names = sorted({name for name in asset_names if asset_names.count(name) > 1})
      if duplicate_names:
          add("DUPLICATE_ASSET_NAMES", "WARN", "Duplicate asset names were returned: " + ", ".join(duplicate_names[:50]))

      checksum_assets = sorted({name for name in asset_names if checksum_pattern.search(name)})
      if require_checksum and not checksum_assets:
          add("CHECKSUM_MANIFEST_MISSING", "BLOCK", f"No asset filename matched checksum pattern '{checksum_pattern_text}'.")
      elif checksum_assets:
          add("CHECKSUM_MANIFEST_PRESENT", "INFO", "Checksum manifest filename(s) found: " + ", ".join(checksum_assets[:20]))

      blocking = [finding for finding in findings if finding["severity"] == "BLOCK"]
      warnings = [finding for finding in findings if finding["severity"] == "WARN"]
      verdict = "FAIL" if blocking else ("PASS_WITH_WARNINGS" if warnings else "PASS")
      report = {
          "schemaVersion": 1,
          "checkedAt": datetime.now(timezone.utc).isoformat(),
          "repository": repository,
          "tagName": tag_name or None,
          "releaseUrl": release_url or None,
          "publishedAt": published_at,
          "prerelease": prerelease,
          "draft": draft,
          "assetCount": len(assets),
          "minimumAssetCount": minimum_asset_count,
          "assetNames": asset_names,
          "checksumAssetPattern": checksum_pattern_text,
          "checksumManifestRequired": require_checksum,
          "checksumManifestPresent": bool(checksum_assets),
          "checksumManifestAssets": checksum_assets,
          "zeroByteAssetNames": zero_byte_assets,
          "invalidDownloadUrlAssetNames": invalid_urls,
          "findings": findings,
          "blockingFindingCount": len(blocking),
          "warningCount": len(warnings),
          "verdict": verdict,
          "scopeNote": "The gate validates GitHub release metadata and checksum-manifest presence. It does not download assets or verify each asset against checksum file contents.",
      }
      with open("release-audit.json", "w", encoding="utf-8") as target:
          json.dump(report, target, indent=2, ensure_ascii=False)

      print(f"GitHub release asset audit: {repository}@{tag_name} verdict={verdict}; assets={len(assets)}, blocking={len(blocking)}, warnings={len(warnings)}")
      Kestra.outputs({
          "repository": repository,
          "tag_name": tag_name,
          "release_url": release_url,
          "published_at": published_at or "",
          "prerelease": prerelease,
          "asset_count": len(assets),
          "checksum_manifest_present": bool(checksum_assets),
          "checksum_manifest_assets": checksum_assets,
          "blocking_finding_count": len(blocking),
          "warning_count": len(warnings),
          "verdict": verdict,
          "findings": findings,
      })

  - id: optionally_archive_report
    type: io.kestra.plugin.core.flow.If
    description: Optionally archive the policy evidence to S3 under a repository- and release-specific object key.
    condition: "{{ inputs.archive_report }}"
    then:
      - id: upload_release_audit
        type: io.kestra.plugin.aws.s3.Upload
        description: Store the JSON evidence report in the configured bucket. Release assets are not copied.
        accessKeyId: "{{ secret('AWS_ACCESS_KEY_ID') }}"
        secretKeyId: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
        region: "{{ inputs.aws_region }}"
        bucket: "{{ inputs.evidence_bucket }}"
        from: "{{ outputs.audit_release_assets.outputFiles['release-audit.json'] }}"
        key: "{{ inputs.evidence_prefix }}/{{ inputs.repository | replace('/', '_') }}/{{ outputs.audit_release_assets.vars.tag_name | replace('/', '_') }}/release-audit.json"

  - id: enforce_release_policy
    type: io.kestra.plugin.core.flow.If
    description: Fail closed when release metadata or the configured asset policy fails. A successful orchestration run must not be interpreted as a passing release audit unless the verdict passes.
    condition: "{{ outputs.audit_release_assets.vars.verdict == 'FAIL' }}"
    then:
      - id: alert_blocked_release
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Alert release owners with the exact policy findings and the release URL.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |-
          {{
            {
              "text": ":rotating_light: GitHub release asset gate BLOCKED\nRepository: " ~ outputs.audit_release_assets.vars.repository ~
                "\nTag: " ~ outputs.audit_release_assets.vars.tag_name ~
                "\nRelease: " ~ outputs.audit_release_assets.vars.release_url ~
                "\nFindings: " ~ (outputs.audit_release_assets.vars.findings | toJson) ~
                "\nExecution: " ~ execution.id ~
                "\nReview release-audit.json for full evidence."
            } | toJson
          }}
      - id: fail_release_gate
        type: io.kestra.plugin.core.execution.Fail
        description: Stop the promotion flow after alerting on a blocked release.
        errorMessage: "GitHub release asset policy failed for {{ outputs.audit_release_assets.vars.repository }} at tag {{ outputs.audit_release_assets.vars.tag_name }}. Review release-audit.json."
    else:
      - id: log_release_verdict
        type: io.kestra.plugin.core.log.Log
        level: INFO
        message: "GitHub release asset audit {{ outputs.audit_release_assets.vars.verdict }} for {{ outputs.audit_release_assets.vars.repository }}@{{ outputs.audit_release_assets.vars.tag_name }}; assets={{ outputs.audit_release_assets.vars.asset_count }}."

errors:
  - id: alert_audit_execution_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alert when the API call, script, or orchestration fails; execution failures are not treated as a passing release audit.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |-
      {{
        {
          "text": ":warning: GitHub release asset audit execution failed\nRepository: " ~ inputs.repository ~
            "\nExecution: " ~ execution.id ~
            "\nInspect Kestra logs. API, parsing, and plugin failures must not be interpreted as PASS."
        } | toJson
      }}

extend:
  title: GitHub Release Asset Integrity and Completeness Gate
  metaTitle: GitHub Release Asset Integrity Gate | Kestra
  shortDescription: Check public GitHub releases for complete assets, valid download URLs, non-empty files, and checksum manifests before promotion.
  metaDescription: Gate GitHub releases on published metadata, asset completeness, HTTPS downloads, non-empty artifacts and optional SHA-256/SHA-512 checksum manifests.
  description: |
    Audit the most recently published non-draft release of a public GitHub repository before it is promoted downstream, including prereleases so the flow can block them by default. The flow checks the release metadata and asset inventory, verifies that asset downloads use GitHub HTTPS URLs, detects missing or zero-byte assets, and optionally requires a checksum manifest. It outputs a JSON evidence report, alerts Slack on a blocked release, and can archive the report to S3 without downloading the release binaries.

    ## How it works

    1. The validation task checks the repository name, minimum asset count and checksum filename regular expression.
    2. An HTTP Request reads public release records; the Python audit selects the newest published release by timestamp, including prereleases so policy can block them; binary assets are not downloaded.
    3. The Python audit checks publication metadata, prerelease policy, asset names and sizes, download URLs, the asset-count threshold and checksum-manifest presence.
    4. An optional If branch saves JSON evidence to S3.
    5. The release-policy If routes a blocked verdict to Slack and a failing task, or logs the passing verdict.

    ## What you get

    - A report containing the release tag, URL, asset names, publication timestamp, findings and final verdict.
    - Fail-closed handling when release metadata is incomplete or asset policies fail.
    - Detection of missing/invalid download URLs, zero-byte assets and a missing checksum manifest.
    - Optional S3 evidence retention without transferring release binaries.

    ## Who it's for

    - Release engineers validating artifacts before publishing downstream.
    - Platform teams enforcing minimum release packaging requirements.
    - Security and compliance teams keeping evidence of release readiness.

    ## Why orchestrate this with Kestra

    Kestra makes the release policy visible in YAML, records each audit execution, supports scheduled rechecks, and routes a blocking result to an alert plus a failed task so downstream flows can require a passing execution.

    ## Prerequisites

    - A Kestra 2.x worker with Docker enabled for the Python Script task runner.
    - Network access to api.github.com; this blueprint targets public repositories and uses no GitHub token by default.
    - A Slack incoming webhook for alerts; S3 is optional and requires bucket write access.

    ### Secrets

    - SLACK_WEBHOOK_URL: Slack incoming webhook for policy-blocking alerts and execution failures.
    - AWS_ACCESS_KEY_ID: optional AWS access key used only when S3 report archival is enabled.
    - AWS_SECRET_ACCESS_KEY: optional AWS secret key used only when S3 report archival is enabled.

    ## Quick start

    1. Import the flow into Kestra and leave repository as kestra-io/kestra for a public example.
    2. Execute the flow manually and inspect release-audit.json and the release_audit output.
    3. Set minimum_asset_count and checksum_asset_pattern to match the repository's release policy.
    4. Configure SLACK_WEBHOOK_URL before relying on policy alerts.
    5. Enable weekday_release_audit after verifying the policy and alert channel. Enable S3 archival only after configuring its bucket and secrets.

    ## How to extend

    - Add repository-specific allowlists for required platform archives or signatures.
    - Compare release asset names against a platform matrix committed to Git.
    - Add verified provenance/attestation checks and cryptographically verify each downloaded asset against its checksum manifest.
    - Route a passing verdict to a downstream deployment or package-promotion flow.

    ## Links

    - [GitHub Releases REST API](https://docs.github.com/en/rest/releases/releases#get-the-latest-release)
    - [Kestra HTTP Request plugin](https://kestra.io/plugins/plugin-core/http/io.kestra.plugin.core.http.request)
    - [Kestra Python Script plugin](https://kestra.io/plugins/plugin-scripts/python)
    - [Kestra Slack plugin](https://kestra.io/plugins/plugin-slack/slackincomingwebhook)
    - [Kestra AWS S3 plugin](https://kestra.io/plugins/plugin-aws/s3)
  tags:
    - Infrastructure
  subTags:
    - Policy & Compliance
    - Monitoring & Alerting
  ee: false
  demo: false
