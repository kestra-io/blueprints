id: sqlite-freelist-bloat-and-incremental-vacuum-guard
namespace: company.team

inputs:
  - id: sqlite_db_path
    type: STRING
    displayName: SQLite Database Path
    description: Absolute filesystem path to the target SQLite database file on the worker or mounted volume.
    defaults: "/tmp/app.db"

  - id: bloat_threshold_pct
    type: FLOAT
    displayName: Freelist Bloat Threshold (%)
    description: Minimum percentage of unallocated freelist pages relative to total pages that triggers reclamation.
    defaults: 20.0
    min: 1.0
    max: 90.0

  - id: min_reclaimable_mb
    type: FLOAT
    displayName: Min Reclaimable Size (MiB)
    description: Minimum storage trapped in freelist pages required to initiate vacuum maintenance.
    defaults: 10.0
    min: 1.0

  - id: max_pages_per_incremental_step
    type: INT
    displayName: Max Incremental Vacuum Pages
    description: Maximum freelist pages to release per execution when the database is in incremental vacuum mode.
    defaults: 5000
    min: 100
    max: 50000

  - id: dry_run
    type: BOOL
    displayName: Dry Run Mode
    description: When true, inspects freelist allocation and evaluates safeguards without mutating the database file.
    defaults: true

  - id: notify_slack
    type: BOOL
    displayName: Notify Slack
    description: Dispatch an operational audit digest to Slack upon maintenance completion.
    defaults: false

  - id: slack_channel
    type: STRING
    displayName: Slack Notification Channel
    description: Target Slack channel for operational storage notifications.
    defaults: "#ops-database"

triggers:
  - id: scheduled_storage_sweep
    type: io.kestra.plugin.core.trigger.Schedule
    description: Recurring off-peak schedule for SQLite storage hygiene checks. Shipped disabled by default.
    cron: "0 3 * * 0"
    disabled: true

  - id: maintenance_webhook
    type: io.kestra.plugin.core.trigger.Webhook
    description: Secure webhook trigger for on-demand storage reclamation during maintenance windows.
    key: "{{ secret('SQLITE_GUARD_WEBHOOK_KEY') }}"

tasks:
  - id: probe_storage_allocation
    type: io.kestra.plugin.jdbc.sqlite.Query
    description: Query SQLite table-valued PRAGMA functions to inspect page count, freelist count, page size, and auto-vacuum mode.
    url: "jdbc:sqlite:{{ inputs.sqlite_db_path }}"
    fetchType: FETCH_ONE
    sql: |
      SELECT
        p.page_count,
        f.freelist_count,
        s.page_size,
        v.auto_vacuum,
        ROUND((p.page_count * s.page_size) / (1024.0 * 1024.0), 2) AS total_size_mb,
        ROUND((f.freelist_count * s.page_size) / (1024.0 * 1024.0), 2) AS freelist_size_mb,
        ROUND((f.freelist_count * 100.0) / (CASE WHEN p.page_count > 0 THEN p.page_count ELSE 1 END), 2) AS freelist_bloat_pct
      FROM
        pragma_page_count() p,
        pragma_freelist_count() f,
        pragma_page_size() s,
        pragma_auto_vacuum() v;

  - id: measure_disk_headroom
    type: io.kestra.plugin.scripts.shell.Commands
    description: Measure the real free space (MiB) on the volume that holds the SQLite file, since a full VACUUM can need up to twice the database size.
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    env:
      DB_PATH: "{{ inputs.sqlite_db_path }}"
    commands:
      - |
        set -eu
        disk_free_mb=$(df -Pm "$(dirname "$DB_PATH")" | awk 'NR==2 {print $4}')
        echo "::{\"outputs\":{\"disk_free_mb\":${disk_free_mb}}}::"

  - id: route_reclamation_decision
    type: io.kestra.plugin.core.flow.Switch
    description: Route action based on freelist bloat thresholds, auto-vacuum capabilities, and disk headroom safety limits.
    value: >-
      {%- if (outputs.probe_storage_allocation.row.freelist_size_mb | string | number('FLOAT')) < (inputs.min_reclaimable_mb | string | number('FLOAT')) or (outputs.probe_storage_allocation.row.freelist_bloat_pct | string | number('FLOAT')) < (inputs.bloat_threshold_pct | string | number('FLOAT')) -%}
      STORAGE_HEALTHY
      {%- elseif outputs.probe_storage_allocation.row.auto_vacuum == 2 -%}
      QUALIFIED_INCREMENTAL
      {%- elseif (outputs.measure_disk_headroom.vars.disk_free_mb | string | number('FLOAT')) < ((outputs.probe_storage_allocation.row.total_size_mb | string | number('FLOAT')) * 2) -%}
      INSUFFICIENT_DISK_HEADROOM
      {%- else -%}
      QUALIFIED_FULL_VACUUM
      {%- endif -%}
    cases:
      STORAGE_HEALTHY:
        - id: log_storage_healthy
          type: io.kestra.plugin.core.log.Log
          message: "NOMINAL: SQLite database '{{ inputs.sqlite_db_path }}' freelist bloat is {{ outputs.probe_storage_allocation.row.freelist_bloat_pct }}% ({{ outputs.probe_storage_allocation.row.freelist_size_mb }} MiB free across {{ outputs.probe_storage_allocation.row.freelist_count }} pages). Below maintenance threshold."

      QUALIFIED_INCREMENTAL:
        - id: branch_incremental_mode
          type: io.kestra.plugin.core.flow.If
          description: Execute progressive incremental vacuum when dry_run is false, otherwise log simulation details.
          condition: "{{ inputs.dry_run }}"
          then:
            - id: log_incremental_dry_run
              type: io.kestra.plugin.core.log.Log
              message: "[DRY-RUN] Incremental vacuum qualified: {{ outputs.probe_storage_allocation.row.freelist_count }} freelist pages available. Would release up to {{ inputs.max_pages_per_incremental_step }} pages without exclusive database locking."
          else:
            - id: execute_incremental_vacuum
              type: io.kestra.plugin.jdbc.sqlite.Query
              description: Progressively truncate freelist pages back to the operating system without rebuilding the database file.
              url: "jdbc:sqlite:{{ inputs.sqlite_db_path }}"
              fetchType: NONE
              sql: "PRAGMA incremental_vacuum({{ inputs.max_pages_per_incremental_step }});"

            - id: log_incremental_success
              type: io.kestra.plugin.core.log.Log
              message: "SUCCESS: Incremental vacuum completed for '{{ inputs.sqlite_db_path }}', releasing up to {{ inputs.max_pages_per_incremental_step }} unused pages back to the filesystem."

      INSUFFICIENT_DISK_HEADROOM:
        - id: log_headroom_circuit_breaker
          type: io.kestra.plugin.core.log.Log
          message: "CIRCUIT BREAKER TRIGGERED: Database total size is {{ outputs.probe_storage_allocation.row.total_size_mb }} MiB, but only {{ outputs.measure_disk_headroom.vars.disk_free_mb }} MiB is free on the volume (a full VACUUM needs up to 2x total size). Aborting full VACUUM to prevent SQLITE_FULL corruption."

      QUALIFIED_FULL_VACUUM:
        - id: branch_full_vacuum_mode
          type: io.kestra.plugin.core.flow.If
          description: Execute full VACUUM rebuild when dry_run is false, otherwise log simulation details.
          condition: "{{ inputs.dry_run }}"
          then:
            - id: log_full_vacuum_dry_run
              type: io.kestra.plugin.core.log.Log
              message: "[DRY-RUN] Full vacuum qualified: Database size is {{ outputs.probe_storage_allocation.row.total_size_mb }} MiB with {{ outputs.probe_storage_allocation.row.freelist_size_mb }} MiB trapped in freelist pages ({{ outputs.probe_storage_allocation.row.freelist_bloat_pct }}% bloat). Headroom safe ({{ outputs.measure_disk_headroom.vars.disk_free_mb }} MiB free). No mutations executed."
          else:
            - id: execute_full_vacuum
              type: io.kestra.plugin.jdbc.sqlite.Query
              description: Rebuild the SQLite database file in place to compact B-Trees and return unallocated space to the filesystem.
              url: "jdbc:sqlite:{{ inputs.sqlite_db_path }}"
              fetchType: NONE
              sql: "VACUUM;"

            - id: log_full_vacuum_success
              type: io.kestra.plugin.core.log.Log
              message: "SUCCESS: Full in-place VACUUM completed for '{{ inputs.sqlite_db_path }}', compacting all B-Tree pages and releasing {{ outputs.probe_storage_allocation.row.freelist_size_mb }} MiB back to the OS."

  - id: audit_summary_log
    type: io.kestra.plugin.core.log.Log
    description: Record comprehensive operational audit record of SQLite storage state and actions taken.
    message: |
      ===== SQLite Storage Allocation & Freelist Audit =====
      Database: {{ inputs.sqlite_db_path }}
      Total Size: {{ outputs.probe_storage_allocation.row.total_size_mb }} MiB ({{ outputs.probe_storage_allocation.row.page_count }} pages @ {{ outputs.probe_storage_allocation.row.page_size }} bytes/page)
      Freelist Storage: {{ outputs.probe_storage_allocation.row.freelist_size_mb }} MiB ({{ outputs.probe_storage_allocation.row.freelist_count }} pages, {{ outputs.probe_storage_allocation.row.freelist_bloat_pct }}% bloat)
      Auto-Vacuum Mode: {{ outputs.probe_storage_allocation.row.auto_vacuum == 0 ? '0 (NONE)' : (outputs.probe_storage_allocation.row.auto_vacuum == 1 ? '1 (FULL)' : '2 (INCREMENTAL)') }}
      Free Disk Space: {{ outputs.measure_disk_headroom.vars.disk_free_mb }} MiB
      Execution Mode: {{ inputs.dry_run ? 'DRY-RUN (Simulated)' : 'ACTIVE MAINTENANCE' }}
      ======================================================

  - id: notify_slack_summary
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    runIf: "{{ inputs.notify_slack }}"
    description: Dispatch structured Slack operational digest when notification flag is enabled.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "{{ inputs.slack_channel }}",
        "text": ":shield: *SQLite Freelist Bloat & Vacuum Guard*",
        "attachments": [
          {
            "color": "{{ (outputs.probe_storage_allocation.row.freelist_bloat_pct | string | number('FLOAT')) >= (inputs.bloat_threshold_pct | string | number('FLOAT')) ? '#E2B93B' : '#36A64F' }}",
            "title": "SQLite Storage Hygiene Digest",
            "fields": [
              {
                "title": "Database Path",
                "value": "`{{ inputs.sqlite_db_path }}`",
                "short": true
              },
              {
                "title": "Total Footprint",
                "value": "{{ outputs.probe_storage_allocation.row.total_size_mb }} MiB ({{ outputs.probe_storage_allocation.row.page_count }} pages)",
                "short": true
              },
              {
                "title": "Freelist Bloat",
                "value": "{{ outputs.probe_storage_allocation.row.freelist_size_mb }} MiB ({{ outputs.probe_storage_allocation.row.freelist_bloat_pct }}% free)",
                "short": true
              },
              {
                "title": "Auto-Vacuum Mode",
                "value": "{{ outputs.probe_storage_allocation.row.auto_vacuum == 2 ? 'INCREMENTAL' : (outputs.probe_storage_allocation.row.auto_vacuum == 1 ? 'FULL' : 'NONE') }}",
                "short": true
              }
            ]
          }
        ]
      }

extend:
  title: Audit SQLite Freelist Page Bloat and Reclaim Storage with Guarded Incremental Vacuum
  metaTitle: SQLite Freelist Bloat & Incremental Vacuum Guard | Kestra
  shortDescription: Audit SQLite freelist page bloat, verify disk headroom safeguards, and reclaim storage with guarded incremental or full vacuum without risk of disk exhaustion.
  metaDescription: Audit SQLite freelist page bloat, verify disk headroom safeguards, and reclaim storage with guarded incremental or full vacuum to prevent disk-full crashes.
  description: |
    Automate storage hygiene and page fragmentation reclamation for embedded, edge, and staging SQLite databases without risking filesystem exhaustion. In high-churn SQLite workloads (e.g., local application caches, message queuing tables, synchronization buffers, and staging datasets), frequent `UPDATE` and `DELETE` operations leave abandoned pages inside the database file's internal freelist. Because SQLite never truncates database files back to the operating system by default (`auto_vacuum = 0`), database files continuously expand on disk, wasting gigabytes of storage on unallocated space while fragmenting B-Tree indexes.

    Triggering a standard `VACUUM` naively via cron poses catastrophic production failure modes: SQLite reconstructs the entire database file into a secondary temporary file, requiring at least twice the database size in available disk space. On storage-constrained edge servers and persistent volumes, unmonitored vacuum operations cause sudden `SQLITE_FULL` (database or disk is full) crashes.

    This blueprint provides an autonomous operational storage guard that inspects SQLite storage allocation via table-valued `PRAGMA` functions (`pragma_page_count()`, `pragma_freelist_count()`, `pragma_page_size()`, `pragma_auto_vacuum()`). It computes exact freelist bloat percentages, measures the real free space on the database volume, and executes `PRAGMA incremental_vacuum` for databases in incremental mode or guarded full `VACUUM` when disk headroom is verified safe.

    ## How it works

    1. **Storage Allocation Probe**: `probe_storage_allocation` (`io.kestra.plugin.jdbc.sqlite.Query`, `fetchType: FETCH_ONE`) issues a single query across SQLite's table-valued pragma functions to capture `page_count`, `freelist_count`, `page_size`, and the active `auto_vacuum` configuration mode (0 = NONE, 1 = FULL, 2 = INCREMENTAL). It calculates total database size in MiB, reclaimable freelist size in MiB, and the freelist bloat percentage.
    2. **Disk Headroom Measurement**: `measure_disk_headroom` (`io.kestra.plugin.scripts.shell.Commands` on the Process runner) runs `df` against the directory that holds the database file and reports the free MiB on that volume.
    3. **Operational Safeguard Routing**: `route_reclamation_decision` (`io.kestra.plugin.core.flow.Switch`) evaluates storage telemetry against operational thresholds:
       - `STORAGE_HEALTHY`: Freelist bloat is below `inputs.bloat_threshold_pct` or reclaimable storage is below `inputs.min_reclaimable_mb`. Logs nominal status and exits cleanly without I/O thrashing.
       - `QUALIFIED_INCREMENTAL`: The database has `auto_vacuum = 2` (INCREMENTAL). It executes `PRAGMA incremental_vacuum` for up to `inputs.max_pages_per_incremental_step` pages, which releases free pages without rebuilding the database file.
       - `INSUFFICIENT_DISK_HEADROOM`: Measured free space on the volume is below twice the database size (`disk_free_mb < total_size_mb * 2`). A circuit breaker trips, logging an emergency warning and halting full vacuum execution to prevent `SQLITE_FULL` crashes.
       - `QUALIFIED_FULL_VACUUM`: Bloat exceeds limits, the database is in non-incremental mode, and disk headroom is safe. Branches to full vacuum maintenance.
    4. **Guarded Execution & Dry-Run**: Both incremental and full vacuum paths are gated behind `inputs.dry_run`. When enabled, simulation logs display exact pages and megabytes that would be reclaimed without mutating files. When `dry_run: false`, active maintenance commands execute.
    5. **Audit Trail & Observability**: `audit_summary_log` formats a structured operational report detailing total footprint, freelist percentage, auto-vacuum mode, and actions taken. If `inputs.notify_slack` is enabled, `notify_slack_summary` posts an operational card to Slack.

    ## What you get

    - **Disk Exhaustion Protection**: Full VACUUM only runs when the measured free space on the volume is at least twice the database file size.
    - **Progressive Incremental Compaction**: Native awareness of `auto_vacuum = 2` leverages `PRAGMA incremental_vacuum(N)` to release space in bounded chunks without duplicating the file on disk.
    - **Zero I/O Waste**: Skips maintenance when freelist bloat is below threshold, avoiding unnecessary flash memory and SSD wear.
    - **Safe Dry-Run Default**: Ships with `dry_run: true` so engineers can audit storage distribution and disk headroom before enabling live reclamation.

    ## Who it's for

    - **Platform Engineers & SREs**: Managing edge nodes, persistent container volumes, and embedded microservice datastores.
    - **IoT & Embedded Developers**: Maintaining storage hygiene on flash-constrained devices without risking `SQLITE_FULL` filesystem corruption.
    - **Analytics Engineers**: Optimizing staging SQLite databases and local caching files before large batch ETL runs.

    ## Why orchestrate this with Kestra

    Ad-hoc cron jobs running `sqlite3 db.sqlite "VACUUM"` fail silently or crash production systems when disks run low on space. Kestra provides declarative workflow orchestration where low-level database pragmas, disk headroom safety gates, conditional incremental vs full branching, and Slack notifications execute with full execution logs, audit trails, and deterministic error handling.

    ## Prerequisites

    - A SQLite database file (version 3.16.0 or higher) on the Kestra worker's local filesystem or a mounted volume, with a worker that allows the Process task runner and has `df` available.
    - Read and write filesystem permissions on the directory containing the SQLite database file (required for SQLite rollback journals and vacuum temporary files).

    ### Secrets

    - `SQLITE_GUARD_WEBHOOK_KEY`: Secret authentication key for the on-demand maintenance webhook (required).
    - `SLACK_WEBHOOK_URL`: Incoming webhook URL for Slack operational audit notifications (required only when `notify_slack: true`).

    ## Quick start

    1. Configure `SQLITE_GUARD_WEBHOOK_KEY` in your Kestra namespace secrets.
    2. Import this blueprint into your Kestra instance and execute with default inputs (`dry_run: true`) pointing to your target SQLite database path.
    3. Inspect the execution logs in the Kestra UI to review total database footprint, freelist bloat percentage, and auto-vacuum mode.
    4. Set `dry_run: false` and toggle `scheduled_storage_sweep` to enable autonomous periodic storage reclamation.

    ## How to extend

    - **Automated Incremental Conversion**: Add a one-time migration task (`PRAGMA auto_vacuum = INCREMENTAL; VACUUM;`) to convert legacy SQLite databases to incremental vacuum mode for future lock-free maintenance.
    - **Integrity Check Chaining**: Chain `PRAGMA integrity_check` directly into the `STORAGE_HEALTHY` branch to verify B-Tree consistency alongside storage auditing.
    - **Cloud Snapshot Backup**: Export the compacted SQLite database file to an S3 or MinIO bucket using `io.kestra.plugin.aws.s3.Upload` immediately following successful vacuum operations.

    ## Links

    - [Kestra SQLite Plugin Documentation](https://kestra.io/plugins/plugin-jdbc-sqlite)
    - [SQLite PRAGMA Documentation](https://www.sqlite.org/pragma.html)
    - [SQLite VACUUM Documentation](https://www.sqlite.org/lang_vacuum.html)
    - [SQLite Auto-Vacuum Architecture](https://www.sqlite.org/pragma.html#pragma_auto_vacuum)
  tags:
    - Data
  subTags:
    - Day 2 Operations
    - Monitoring & Alerting
  ee: false
  demo: false
