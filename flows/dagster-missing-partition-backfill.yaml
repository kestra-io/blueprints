id: dagster-missing-partition-backfill
namespace: company.team

description: >-
  Reconcile the materialized partitions of one Dagster asset. The flow reads the asset's
  materialization events through GraphQL, reports missing keys in safe mode and only launches
  one run per missing key after explicit approval. The final GraphQL read is the success gate.

inputs:
  - id: dagster_base_url
    type: STRING
    defaults: "{{ secret('DAGSTER_GRAPHQL_URL') }}"
    description: Dagster GraphQL endpoint reachable by the Kestra worker.
  - id: job_name
    type: STRING
    defaults: partition_backfill_job
    description: Dagster job that materializes one requested partition per run.
  - id: repository
    type: STRING
    defaults: repository_name
    description: Dagster repository containing job_name.
  - id: location
    type: STRING
    defaults: code_location
    description: Dagster code location containing repository.
  - id: asset_key
    type: STRING
    defaults: daily_orders
    description: Exact Dagster asset key whose partition coverage is reconciled.
  - id: partition_keys
    type: ARRAY
    itemType: STRING
    defaults:
      - "2026-10-14"
      - "2026-10-15"
      - "2026-10-16"
      - "2026-10-17"
    description: Expected partition keys for the bounded reconciliation window.
  - id: protected_partition_keys
    type: ARRAY
    itemType: STRING
    defaults: []
    description: Expected keys to report but never launch a run for.
  - id: partition_mode
    type: STRING
    defaults: materialize
    description: Job fixture mode. Production jobs can ignore this input; the local proof uses noop to prove an ineffective write.
  - id: auto_remediate
    type: BOOL
    defaults: false
    description: Arm the approved remediation branch.
  - id: dry_run
    type: BOOL
    defaults: true
    description: Keep true to report gaps without launching Dagster runs.

triggers:
  - id: daily_partition_reconciliation
    type: io.kestra.plugin.core.trigger.Schedule
    description: Disabled by default and pinned to safe mode until the asset and job have been verified manually.
    cron: "0 4 * * *"
    disabled: true
    inputs:
      auto_remediate: false
      dry_run: true

tasks:
  - id: read_status
    type: io.kestra.plugin.core.http.Request
    description: Read exact asset materialization events from Dagster's GraphQL API before planning.
    uri: "{{ inputs.dagster_base_url }}"
    method: POST
    contentType: application/json
    headers:
      Content-Type: application/json
    body: |
      {
        "query": "query Materializations($assetKey: AssetKeyInput!) { assetOrError(assetKey: $assetKey) { __typename ... on Asset { assetMaterializations(limit: 100) { partition runId } } } }",
        "variables": {"assetKey": {"path": ["{{ inputs.asset_key }}"]}}
      }
    options:
      timeout:
        connectTimeout: PT10S
        readIdleTimeout: PT30S

  - id: build_plan
    type: io.kestra.plugin.core.output.OutputValues
    description: Compute the target set from Dagster's response. Protected keys and an exact asset match stay out of the write plan.
    values:
      plan: >-
        {{ {'r': fromJson(outputs.read_status.body), 'expected': inputs.partition_keys, 'protected': inputs.protected_partition_keys,
            'armed': (inputs.auto_remediate and not inputs.dry_run)} | jq('
          .r.data.assetOrError as $a
          | ($a.assetMaterializations // [] | map(select(.partition != null) | .partition) | unique) as $have
          | (.expected // []) as $expected
          | (.protected // []) as $protected
          | [ $expected[] as $p | select(($protected | index($p)) == null) | $p ] as $scope
          | [ $scope[] as $p | select(($have | index($p)) == null) | $p ] as $missing
          | {typename: ($a.__typename // "UNKNOWN"), materialized: $have, expected: $expected,
             protected: $protected, scope: $scope, missing: $missing,
             spared: [ $expected[] as $p | select(($protected | index($p)) != null) | $p ],
             armed: .armed, count: ($missing | length)}
        ') | first | toJson }}

  - id: log_plan
    type: io.kestra.plugin.core.log.Log
    message: >-
      Dagster asset {{ inputs.asset_key }} coverage: {{ fromJson(outputs.build_plan.values.plan) | jq('.count') | first }} missing,
      {{ fromJson(outputs.build_plan.values.plan) | jq('.materialized | length') | first }} materialized,
      {{ fromJson(outputs.build_plan.values.plan) | jq('.spared | length') | first }} protected. Missing keys:
      {{ fromJson(outputs.build_plan.values.plan) | jq('if (.missing | length) == 0 then "none" else (.missing | join(", ")) end') | first }}.
      dry_run={{ inputs.dry_run }} auto_remediate={{ inputs.auto_remediate }}.

  - id: validate_asset
    type: io.kestra.plugin.core.flow.If
    condition: "{{ fromJson(outputs.build_plan.values.plan) | jq('.typename != \"Asset\"') | first }}"
    then:
      - id: asset_read_failed
        type: io.kestra.plugin.core.execution.Fail
        errorMessage: >-
          Dagster did not return the requested asset {{ inputs.asset_key }}. GraphQL typename was
          {{ fromJson(outputs.build_plan.values.plan) | jq('.typename') | first }}. No run was launched.

  - id: findings
    type: io.kestra.plugin.core.flow.If
    condition: "{{ fromJson(outputs.build_plan.values.plan) | jq('.count > 0') | first }}"
    then:
      - id: alert_findings
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Alert on every detected gap so a dry run is visible to the on-call team.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: >-
          {{ {'text': 'Dagster partition gap on ' ~ inputs.asset_key ~ ': ' ~ (fromJson(outputs.build_plan.values.plan) | jq('.missing | join(", ")') | first) ~ '. Protected: ' ~ (fromJson(outputs.build_plan.values.plan) | jq('if (.spared | length) == 0 then "none" else (.spared | join(", ")) end') | first) ~ '. dry_run=' ~ inputs.dry_run ~ ' auto_remediate=' ~ inputs.auto_remediate ~ '.'} | toJson }}

      - id: remediation_gate
        type: io.kestra.plugin.core.flow.If
        description: Only armed non-dry runs reach the approval gate.
        condition: "{{ inputs.auto_remediate and not inputs.dry_run }}"
        then:
          - id: approval
            type: io.kestra.plugin.core.flow.Pause
            description: A human must approve launching one Dagster run for each currently missing partition.
            pauseDuration: PT2H
            behavior: FAIL
            onResume:
              - id: approved
                type: BOOL
                defaults: false
                description: Approve the listed partition runs.
              - id: note
                type: STRING
                defaults: ""
                description: Optional approval note.

          - id: apply_if_approved
            type: io.kestra.plugin.core.flow.If
            condition: "{{ outputs.approval.onResume.approved ?? false }}"
            then:
              - id: reread_after_approval
                type: io.kestra.plugin.core.http.Request
                description: Re-read eligibility after approval so a stale plan cannot launch a duplicate or overwrite a recovered partition.
                uri: "{{ inputs.dagster_base_url }}"
                method: POST
                contentType: application/json
                headers:
                  Content-Type: application/json
                body: |
                  {
                    "query": "query Materializations($assetKey: AssetKeyInput!) { assetOrError(assetKey: $assetKey) { __typename ... on Asset { assetMaterializations(limit: 100) { partition runId } } } }",
                    "variables": {"assetKey": {"path": ["{{ inputs.asset_key }}"]}}
                  }
                options:
                  timeout:
                    connectTimeout: PT10S
                    readIdleTimeout: PT30S

              - id: recheck_plan
                type: io.kestra.plugin.core.output.OutputValues
                description: Skip keys filled during approval and fail before writing if an earlier materialization disappeared.
                values:
                  items: >-
                    {{ {'a': fromJson(outputs.build_plan.values.plan), 'r': fromJson(outputs.reread_after_approval.body)} | jq('
                      .a as $a
                      | (.r.data.assetOrError.assetMaterializations // [] | map(select(.partition != null) | .partition) | unique) as $now
                      | [ $a.materialized[] as $p | select(($now | index($p)) == null) | $p ] as $lost
                      | [ $a.missing[] as $p | select(($now | index($p)) == null) | $p ] as $eligible
                      | [ $a.missing[] as $p | select(($now | index($p)) != null) | $p ] as $skipped
                      | {now: $now, eligible: $eligible, skipped: $skipped, lost: $lost,
                         note: ("After approval, " + ($eligible | length | tostring) + " missing key(s) remain eligible; "
                           + (if ($skipped | length) == 0 then "none were filled during approval" else "skipped keys filled during approval: " + ($skipped | join(", ")) end)
                           + ". Previously materialized keys lost during approval: " + (if ($lost | length) == 0 then "none" else ($lost | join(", ")) end) + ".")}
                    ') | first | toJson }}

              - id: recheck_log
                type: io.kestra.plugin.core.log.Log
                message: "{{ fromJson(outputs.recheck_plan.values.items) | jq('.note') | first }}"

              - id: stale_plan
                type: io.kestra.plugin.core.flow.If
                condition: "{{ fromJson(outputs.recheck_plan.values.items) | jq('.lost | length > 0') | first }}"
                then:
                  - id: stale_plan_failed
                    type: io.kestra.plugin.core.execution.Fail
                    errorMessage: >-
                      Refusing to write because materialized partition(s) disappeared during approval:
                      {{ fromJson(outputs.recheck_plan.values.items) | jq('.lost | join(", ")') | first }}.

              - id: launch_missing
                type: io.kestra.plugin.core.flow.If
                condition: "{{ fromJson(outputs.recheck_plan.values.items) | jq('.eligible | length > 0') | first }}"
                then:
                  - id: launch_one_partition
                    type: io.kestra.plugin.core.flow.Loop
                    description: Launch each approved partition sequentially. The loop never runs two Dagster jobs at once.
                    concurrencyLimit: 1
                    values: "{{ fromJson(outputs.recheck_plan.values.items) | jq('.eligible') | first | toJson }}"
                    tasks:
                      - id: trigger_partition
                        type: io.kestra.plugin.dagster.TriggerRun
                        description: Trigger and wait for the Dagster job that materializes this one partition.
                        baseUrl: "{{ inputs.dagster_base_url }}"
                        jobName: "{{ inputs.job_name }}"
                        repository: "{{ inputs.repository }}"
                        location: "{{ inputs.location }}"
                        wait: true
                        pollFrequency: PT1S
                        maxDuration: PT10M
                        allowFailure: true
                        body:
                          runConfig:
                            ops:
                              materialize_partition:
                                config:
                                  partition_key: "{{ item.value }}"
                                  asset_key: "{{ inputs.asset_key }}"
                                  mode: "{{ inputs.partition_mode }}"

              - id: verify_status
                type: io.kestra.plugin.core.http.Request
                description: Query Dagster again after all launches. This read determines whether the gap really closed.
                uri: "{{ inputs.dagster_base_url }}"
                method: POST
                contentType: application/json
                headers:
                  Content-Type: application/json
                body: |
                  {
                    "query": "query Materializations($assetKey: AssetKeyInput!) { assetOrError(assetKey: $assetKey) { __typename ... on Asset { assetMaterializations(limit: 100) { partition runId } } } }",
                    "variables": {"assetKey": {"path": ["{{ inputs.asset_key }}"]}}
                  }
                options:
                  timeout:
                    connectTimeout: PT10S
                    readIdleTimeout: PT30S

              - id: verify_plan
                type: io.kestra.plugin.core.output.OutputValues
                values:
                  result: >-
                    {{ {'r': fromJson(outputs.verify_status.body), 'expected': inputs.partition_keys, 'protected': inputs.protected_partition_keys} | jq('
                      .r.data.assetOrError as $a
                      | ($a.assetMaterializations // [] | map(select(.partition != null) | .partition) | unique) as $have
                      | [ (.expected // [])[] as $p | select((.protected // []) | index($p) | not) | select(($have | index($p)) == null) | $p ] as $missing
                      | {typename: ($a.__typename // "UNKNOWN"), materialized: $have, missing: $missing, count: ($missing | length)}
                    ') | first | toJson }}

              - id: fail_if_gap_remains
                type: io.kestra.plugin.core.flow.If
                condition: "{{ fromJson(outputs.verify_plan.values.result) | jq('.count > 0') | first }}"
                then:
                  - id: ineffective_write
                    type: io.kestra.plugin.core.execution.Fail
                    errorMessage: >-
                      Dagster remediation did not close the partition gap. Still missing:
                      {{ fromJson(outputs.verify_plan.values.result) | jq('.missing | join(", ")') | first }}.
                else:
                  - id: remediated
                    type: io.kestra.plugin.core.log.Log
                    message: >-
                      Dagster partition coverage recovered. Final materialized count:
                      {{ fromJson(outputs.verify_plan.values.result) | jq('.materialized | length') | first }}.
            else:
              - id: declined
                type: io.kestra.plugin.core.log.Log
                message: "Approval declined{{ (outputs.approval.onResume.note ?? '') == '' ? '' : ': ' ~ outputs.approval.onResume.note }}. No Dagster run was launched and the detected gap remains."
        else:
          - id: dry_run_log
            type: io.kestra.plugin.core.log.Log
            message: "Dry run or auto remediation disabled. Would launch one Dagster run for each missing key: {{ fromJson(outputs.build_plan.values.plan) | jq('.missing | join(\", \")') | first }}."
    else:
      - id: healthy
        type: io.kestra.plugin.core.log.Log
        message: "Dagster asset {{ inputs.asset_key }} has complete coverage for the requested window. No run launched."

errors:
  - id: alert_flow_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alert when the reconciliation flow fails before proving coverage.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: >-
      {{ {'text': 'Dagster missing partition backfill failed for asset ' ~ inputs.asset_key ~ ' in execution ' ~ execution.id ~ '. Final coverage was not proven; inspect the execution before retrying.'} | toJson }}

extend:
  title: Backfill missing Dagster asset partitions safely
  shortDescription: Find missing Dagster asset partitions, approve one sequential run per gap and fail unless GraphQL proves coverage recovered.
  metaTitle: Dagster Missing Partition Backfill with Kestra
  metaDescription: Reconcile Dagster asset partitions in Kestra, backfill approved gaps one at a time and verify coverage through GraphQL.
  description: |
    ## Safety

    An upstream outage can leave a partitioned Dagster asset looking healthy while downstream models silently read incomplete history. This flow makes the target set explicit, keeps protected keys out of the write plan, asks for approval and verifies the asset after every remediation pass.

    | Guard | What it stops |
    | --- | --- |
    | Exact `asset_key` GraphQL selector | A similarly named asset being treated as the target |
    | `protected_partition_keys` filter | A known exception being launched accidentally |
    | `dry_run` and `auto_remediate` gates | A schedule making changes by default |
    | `Pause` approval | An unattended backfill starting during an incident |
    | GraphQL re-read after approval | Launching a stale plan after a partition recovered or disappeared |
    | `Loop` with `concurrencyLimit: 1` | Concurrent Dagster runs competing for the same upstream resources |
    | Final materialization query and `Fail` | Reporting success while a gap remains |

    ## How it works

    1. `read_status` (`io.kestra.plugin.core.http.Request`) asks Dagster GraphQL for materialization events of the exact `asset_key`.
    2. `build_plan` (`io.kestra.plugin.core.output.OutputValues`) compares those partitions with `partition_keys`, records protected keys and lists the gaps.
    3. `approval` (`io.kestra.plugin.core.flow.Pause`) is reached only when `auto_remediate` is true and `dry_run` is false. The schedule is shipped disabled and always supplies safe inputs.
    4. `reread_after_approval` (`io.kestra.plugin.core.http.Request`) refreshes the plan. A recovered missing key is skipped. A previously materialized key that disappeared fails the run before any write.
    5. `launch_one_partition` (`io.kestra.plugin.core.flow.Loop`, `concurrencyLimit: 1`) invokes `io.kestra.plugin.dagster.TriggerRun` with one partition in `runConfig` and waits for that run to finish.
    6. `verify_status` (`io.kestra.plugin.core.http.Request`) reads the asset again. `fail_if_gap_remains` (`io.kestra.plugin.core.execution.Fail`) makes an ineffective or partial backfill a failed execution.
    7. `alert_flow_failure` sends a Slack alert from the `errors` block whenever the flow cannot prove recovery.

    ## What you get

    - A dry-run inventory of exact missing partitions before any Dagster run starts.
    - Approval-gated sequential backfills with a fresh eligibility read.
    - A failure when a run refuses to materialize its partition or only partially repairs the set.
    - A repeatable reconciliation: a second run sees zero gaps and launches nothing.

    ## Who it's for

    - Platform teams operating Dagster assets whose downstream warehouse models require complete history.
    - Data engineers responding to a failed daily ingestion or asset materialization window.
    - On-call teams that need an auditable approval and a proof of recovery rather than a blind retry.

    ## Why orchestrate this with Kestra

    Dagster records materializations and can launch jobs, but the incident response still needs a bounded target list, an approval decision, serial execution and a post-change control. Kestra keeps those reads, the `TriggerRun` writes, the pause, alerts and the final failure decision in one execution with durable history.

    ## Tested end to end

    End-to-end tests use Dagster 1.11.16 with its webserver and daemon plus Kestra 2.0.5. The `partition_backfill_job` emits a real `AssetMaterialization` event for each configured partition. The evidence packet records healthy, dry-run, declined approval, remediation, repeat, ineffective write and approval-race executions with independent GraphQL assertions.

    | Case | Execution | Result |
    | --- | --- | --- |
    | Healthy control | `cHQO0R66C6uKyupm8vxAc` | SUCCESS, 0 gaps across 4 requested partitions, no run launched |
    | Degraded dry run | `6eLfqDyWLfIMuCKFUMrKSv` | SUCCESS, 1 gap listed, no write |
    | Protected key | `54mk9Z9JBTrOFCP9BDaclT` | SUCCESS, 1 protected key spared |
    | Declined approval | `3GW05RmfjfTiWXT4ljrDNP` | SUCCESS, 1 gap remained and no run launched |
    | Remediation | `12ZndKeNj95uc0qziG3uOL` | SUCCESS, 2 gaps to 0, 2 sequential Dagster runs |
    | Repeat | `1jqi9QnHDHHSXelJU6TlS8` | SUCCESS, 0 gaps and no duplicate run |
    | Ineffective write | `1mPLvqiGoIxQsuBETMJbMu` | FAILED, noop job left `2027-02-16` missing |
    | Approval race | `4z0fQjlJGLvF4XS0cn6mCe` | SUCCESS, external `2027-02-17` fill skipped and `2027-02-18` repaired |
    | Lookalike control | `26yYfmpHNRiaIpx3CgWq7o` | SUCCESS, exact target gap stayed visible despite `daily_orders_backup` materialization |

    ## Prerequisites

    - Kestra 2.0.5 with the Dagster plugin and a worker that can reach the Dagster GraphQL endpoint.
    - A Dagster job that accepts one partition key in its run configuration and emits a materialization for that key.
    - A service identity allowed to launch that job and read asset materializations.

    ### Secrets

    - `DAGSTER_GRAPHQL_URL`: Dagster GraphQL endpoint used as the default for `dagster_base_url`.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook used by findings and flow-failure alerts.

    ### Inputs

    | Input | Type | Purpose |
    | --- | --- | --- |
    | `dagster_base_url` | STRING | Dagster GraphQL endpoint |
    | `job_name`, `repository`, `location` | STRING | Dagster launch selector |
    | `asset_key` | STRING | Exact asset to inspect |
    | `partition_keys` | ARRAY | Bounded expected coverage window |
    | `protected_partition_keys` | ARRAY | Keys reported but never launched |
    | `partition_mode` | STRING | Optional job-specific run configuration |
    | `auto_remediate` | BOOL | Arm approval and writes |
    | `dry_run` | BOOL | Keep true to make no change |

    ## Quick start

    1. Configure the Dagster URL, launch selector, asset key and expected partition keys.
    2. Run with `auto_remediate: false` and `dry_run: true`; confirm the gap list matches Dagster's UI or GraphQL response.
    3. Set `auto_remediate: true` and `dry_run: false`, resume the `approval` task with `approved: true` and review the sequential `TriggerRun` tasks.
    4. Confirm the final read reports zero unprotected gaps before enabling the disabled schedule.

    ## How to extend

    - Replace the bounded `partition_keys` input with a list generated by the upstream calendar while retaining a maximum window size.
    - Add a second independent GraphQL assertion for downstream model freshness before declaring the incident closed.
    - Add a per-asset policy map when several assets need different protected keys or launch selectors.

    Limits: the flow reads at most 100 recent materialization events from Dagster and expects the requested window to fit that bound. It launches one job per partition and does not roll back a partition that was already materialized. A job that reports success without emitting the requested materialization is intentionally treated as an ineffective write and fails the execution.

    ## Links

    - [Dagster plugin documentation](https://kestra.io/plugins/plugin-dagster)
    - [Dagster TriggerRun task](https://kestra.io/plugins/plugin-dagster/io.kestra.plugin.dagster.triggerrun)
    - [Dagster GraphQL API](https://docs.dagster.io/api/graphql)

    This blueprint was created by [zkasuran](https://github.com/zkasuran).
