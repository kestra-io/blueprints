id: postgres-alternating-role-password-rotation-vault-cutover
namespace: company.team

description: |
  Rotate the password an application uses to reach Postgres without a connection failure. Two roles share the same
  grants and take turns: Vault always holds the credentials of the active role, the idle role gets a new password,
  Kestra proves it can log in, and only then does the Vault secret switch to it. The old role is switched off after a
  grace period, and only if no session is still using it.

concurrency:
  limit: 1
  behavior: CANCEL

variables:
  ledger_key: "pg_rotation_{{ (inputs.vault_mount ~ '_' ~ inputs.vault_secret_path) | slugify }}"

inputs:
  - id: vault_addr
    type: STRING
    displayName: Vault address
    description: Base URL of Vault, reachable from the Docker containers that run the script tasks.
    defaults: "http://host.docker.internal:8200"

  - id: vault_mount
    type: STRING
    displayName: KV v2 mount
    defaults: "secret"
    validator: '^[A-Za-z0-9_-]+$'

  - id: vault_secret_path
    type: STRING
    displayName: Secret path
    description: KV v2 path whose data holds `username` and `password`. It must already exist and name one of the two roles. A `-pending` sibling path is used while a rotation is in flight.
    defaults: "db/orders-app"
    validator: '^[A-Za-z0-9_/-]+$'

  - id: role_a
    type: STRING
    displayName: First role
    defaults: "orders_app_a"
    validator: '^[a-z_][a-z0-9_]*$'

  - id: role_b
    type: STRING
    displayName: Second role
    description: Must have exactly the same grants and group memberships as the first role.
    defaults: "orders_app_b"
    validator: '^[a-z_][a-z0-9_]*$'

  - id: pg_host
    type: STRING
    displayName: Postgres host
    defaults: "host.docker.internal"

  - id: pg_port
    type: INT
    defaults: 5432

  - id: pg_database
    type: STRING
    defaults: "orders"

  - id: pg_ssl
    type: BOOL
    displayName: Use TLS for Postgres
    defaults: false

  - id: pg_admin_username
    type: STRING
    description: Role that may ALTER both application roles and read pg_stat_activity (CREATEROLE plus pg_read_all_stats).
    defaults: "rotation_admin"

  - id: max_age_days
    type: INT
    displayName: Maximum secret age in days
    defaults: 30

  - id: grace_hours
    type: INT
    displayName: Grace period in hours
    description: How long the previous role keeps working after the cutover, so pods that cached the old credentials can restart.
    defaults: 24

  - id: force_rotation
    type: BOOL
    displayName: Rotate now
    description: Rotate even if the secret is younger than the maximum age.
    defaults: false

  - id: apply_after_approval
    type: BOOL
    displayName: Apply after approval
    description: When false the flow plans and reports only. When true it pauses for an operator before it changes Postgres or Vault.
    defaults: true

triggers:
  - id: daily_check
    type: io.kestra.plugin.core.trigger.Schedule
    description: Decide every day whether to rotate, wait out a grace period, or retire the previous role.
    cron: "0 3 * * *"
    disabled: true

tasks:
  - id: read_role_state
    type: io.kestra.plugin.jdbc.postgresql.Query
    description: Read both roles from the catalog together with their open sessions, so a retiring role that is still in use is noticed.
    url: "jdbc:postgresql://{{ inputs.pg_host }}:{{ inputs.pg_port }}/{{ inputs.pg_database }}"
    ssl: "{{ inputs.pg_ssl }}"
    username: "{{ inputs.pg_admin_username }}"
    password: "{{ secret('PG_ADMIN_PASSWORD') }}"
    fetchType: FETCH
    sql: |
      SELECT r.rolname,
             r.rolcanlogin,
             (SELECT count(*) FROM pg_stat_activity a WHERE a.usename = r.rolname) AS sessions,
             (SELECT coalesce(string_agg(DISTINCT coalesce(nullif(a.application_name, ''), 'unnamed') || '@' || coalesce(host(a.client_addr), 'local'), ', '), '')
                FROM pg_stat_activity a WHERE a.usename = r.rolname) AS clients
      FROM pg_roles r
      WHERE r.rolname IN ('{{ inputs.role_a }}', '{{ inputs.role_b }}')
      ORDER BY r.rolname

  - id: evaluate_rotation_state
    type: io.kestra.plugin.scripts.node.Script
    description: Read the live secret's metadata and username from Vault (the password is never emitted), combine it with the retirement ledger from KV, and decide ROTATE, RETIRE, BLOCKED or NONE.
    containerImage: node:20-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    inputFiles:
      roles.json: "{{ outputs.read_role_state.rows | toJson }}"
      ledger.json: "{{ (kv(vars.ledger_key, errorOnMissing=false) ?? '{}') | toJson }}"
    env:
      VAULT_ADDR: "{{ inputs.vault_addr }}"
      VAULT_TOKEN: "{{ secret('VAULT_TOKEN') }}"
      VAULT_MOUNT: "{{ inputs.vault_mount }}"
      VAULT_SECRET_PATH: "{{ inputs.vault_secret_path }}"
      ROLE_A: "{{ inputs.role_a }}"
      ROLE_B: "{{ inputs.role_b }}"
      MAX_AGE_DAYS: "{{ inputs.max_age_days }}"
      FORCE_ROTATION: "{{ inputs.force_rotation }}"
    script: |
      const fs = require('fs');

      const vault = async (method, path, body) => {
        const res = await fetch(`${process.env.VAULT_ADDR.replace(/\/$/, '')}/v1/${path}`, {
          method,
          headers: { 'X-Vault-Token': process.env.VAULT_TOKEN, 'Content-Type': 'application/json' },
          body: body ? JSON.stringify(body) : undefined,
        });
        const text = await res.text();
        if (!res.ok) throw new Error(`Vault ${method} /v1/${path} -> HTTP ${res.status}: ${text.slice(0, 300)}`);
        return text ? JSON.parse(text) : {};
      };
      const load = (p) => {
        let d = JSON.parse(fs.readFileSync(p, 'utf8'));
        while (typeof d === 'string') d = d.trim() ? JSON.parse(d) : {};
        return d;
      };
      const emit = (outputs) => console.log('::' + JSON.stringify({ outputs }) + '::');
      const { VAULT_MOUNT: MOUNT, VAULT_SECRET_PATH: SECRET } = process.env;

      (async () => {
        const roles = Object.fromEntries(load('roles.json').map((r) => [r.rolname, r]));
        const ledger = load('ledger.json') || {};
        const maxAgeDays = Number(process.env.MAX_AGE_DAYS);
        const force = process.env.FORCE_ROTATION === 'true';

        for (const r of [process.env.ROLE_A, process.env.ROLE_B]) {
          if (!roles[r]) throw new Error(`role ${r} does not exist in pg_roles`);
        }
        // Only the metadata and the username are used from the live secret; the password is never emitted.
        const live = await vault('GET', `${MOUNT}/data/${SECRET}`);
        const meta = live.data.metadata;
        if (meta.destroyed || meta.deletion_time) throw new Error('current version of the live secret is deleted or destroyed');
        const active = live.data.data.username;
        if (![process.env.ROLE_A, process.env.ROLE_B].includes(active)) {
          throw new Error(`live secret username "${active}" is neither ${process.env.ROLE_A} nor ${process.env.ROLE_B}`);
        }
        const inactive = active === process.env.ROLE_A ? process.env.ROLE_B : process.env.ROLE_A;
        const ageDays = (Date.now() - Date.parse(meta.created_time)) / 86400000;
        const sessions = (n) => Number(roles[n].sessions || 0);

        const retire = ledger.retire_role || '';
        const retirePending = retire !== '' && retire !== active && roles[retire] && roles[retire].rolcanlogin;
        let action = 'NONE';
        let reason = `secret is ${ageDays.toFixed(1)} days old, rotation window is ${maxAgeDays}`;
        if (retirePending) {
          if (Date.parse(ledger.retire_after) <= Date.now()) {
            action = 'RETIRE';
            reason = `grace period for ${retire} ended at ${ledger.retire_after}`;
          } else {
            reason = `waiting for the grace period of ${retire} to end at ${ledger.retire_after}`;
          }
        } else if (force || ageDays >= maxAgeDays) {
          if (sessions(inactive) > 0) {
            action = 'BLOCKED';
            reason = `${inactive} is due for a new password but still has ${sessions(inactive)} open session(s): ${roles[inactive].clients}`;
          } else {
            action = 'ROTATE';
            reason = force ? 'forced rotation' : `secret is ${ageDays.toFixed(1)} days old (limit ${maxAgeDays})`;
          }
        }
        emit({
          action,
          reason,
          active_role: active,
          inactive_role: inactive,
          live_version: meta.version,
          age_days: Math.round(ageDays * 10) / 10,
          retire_role: retirePending ? retire : '',
          retire_sessions: retirePending ? sessions(retire) : 0,
          retire_clients: retirePending ? roles[retire].clients || '' : '',
        });
      })().catch((e) => { console.error(e.message); process.exitCode = 1; });

  - id: dispatch_action
    type: io.kestra.plugin.core.flow.Switch
    description: Route on the decision. ROTATE changes the idle role and Vault, RETIRE switches off the previous role, BLOCKED and NONE only report.
    value: "{{ outputs.evaluate_rotation_state.vars.action }}"
    cases:
      ROTATE:
        - id: generate_candidate
          type: io.kestra.plugin.scripts.node.Script
          description: Generate a random password, store it in Vault under the pending path, and return only its SCRAM-SHA-256 verifier. The clear-text password never reaches SQL, statement logs or Kestra outputs.
          containerImage: node:20-slim
          taskRunner:
            type: io.kestra.plugin.scripts.runner.docker.Docker
          env:
            VAULT_ADDR: "{{ inputs.vault_addr }}"
            VAULT_TOKEN: "{{ secret('VAULT_TOKEN') }}"
            VAULT_MOUNT: "{{ inputs.vault_mount }}"
            VAULT_SECRET_PATH: "{{ inputs.vault_secret_path }}"
            INACTIVE_ROLE: "{{ outputs.evaluate_rotation_state.vars.inactive_role }}"
          script: |
            const fs = require('fs');

            const vault = async (method, path, body) => {
              const res = await fetch(`${process.env.VAULT_ADDR.replace(/\/$/, '')}/v1/${path}`, {
                method,
                headers: { 'X-Vault-Token': process.env.VAULT_TOKEN, 'Content-Type': 'application/json' },
                body: body ? JSON.stringify(body) : undefined,
              });
              const text = await res.text();
              if (!res.ok) throw new Error(`Vault ${method} /v1/${path} -> HTTP ${res.status}: ${text.slice(0, 300)}`);
              return text ? JSON.parse(text) : {};
            };
            const load = (p) => {
              let d = JSON.parse(fs.readFileSync(p, 'utf8'));
              while (typeof d === 'string') d = d.trim() ? JSON.parse(d) : {};
              return d;
            };
            const emit = (outputs) => console.log('::' + JSON.stringify({ outputs }) + '::');
            const { VAULT_MOUNT: MOUNT, VAULT_SECRET_PATH: SECRET } = process.env;

            const crypto = require('crypto');

            // Postgres accepts a pre-computed SCRAM-SHA-256 verifier in ALTER ROLE ... PASSWORD, so the
            // clear-text password never appears in SQL, statement logs or Kestra outputs.
            const scramVerifier = (password, iterations = 4096) => {
              const salt = crypto.randomBytes(16);
              const salted = crypto.pbkdf2Sync(password, salt, iterations, 32, 'sha256');
              const hmac = (key, data) => crypto.createHmac('sha256', key).update(data).digest();
              const storedKey = crypto.createHash('sha256').update(hmac(salted, 'Client Key')).digest();
              const serverKey = hmac(salted, 'Server Key');
              return `SCRAM-SHA-256$${iterations}:${salt.toString('base64')}$${storedKey.toString('base64')}:${serverKey.toString('base64')}`;
            };

            (async () => {
              const password = crypto.randomBytes(24).toString('base64url');
              const written = await vault('POST', `${MOUNT}/data/${SECRET}-pending`, {
                data: { username: process.env.INACTIVE_ROLE, password, generated_at: new Date().toISOString() },
              });
              emit({ verifier: scramVerifier(password), pending_version: written.data.version });
            })().catch((e) => { console.error(e.message); process.exitCode = 1; });

        - id: notify_rotation_plan
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          messageText: |
            Password rotation for `{{ inputs.vault_mount }}/{{ inputs.vault_secret_path }}`: {{ outputs.evaluate_rotation_state.vars.reason }}.
            `{{ outputs.evaluate_rotation_state.vars.active_role }}` stays live; `{{ outputs.evaluate_rotation_state.vars.inactive_role }}` gets a new password and takes over after a login check.
            {{ inputs.apply_after_approval ? 'Execution `' ~ execution.id ~ '` is waiting for approval.' : 'Report-only run, nothing was changed.' }}

        - id: gate_on_apply
          type: io.kestra.plugin.core.flow.If
          condition: "{{ inputs.apply_after_approval }}"
          then:
            - id: approval_gate
              type: io.kestra.plugin.core.flow.Pause
              description: Operator approves the cutover. Not approving within 4 hours cancels the run; the next tick plans again.
              pauseDuration: PT4H
              behavior: CANCEL
              onResume:
                - id: approved
                  type: BOOL
                  defaults: false
                  description: Set to true to change the idle role's password and switch the Vault secret to it.

            - id: gate_on_approval
              type: io.kestra.plugin.core.flow.If
              condition: "{{ outputs.approval_gate.onResume.approved == true or outputs.approval_gate.onResume.approved == 'true' }}"
              then:
                - id: set_inactive_role_password
                  type: io.kestra.plugin.jdbc.postgresql.Query
                  description: Set the idle role's password from the pre-computed verifier. The live role is not touched, so running applications are unaffected.
                  url: "jdbc:postgresql://{{ inputs.pg_host }}:{{ inputs.pg_port }}/{{ inputs.pg_database }}"
                  ssl: "{{ inputs.pg_ssl }}"
                  username: "{{ inputs.pg_admin_username }}"
                  password: "{{ secret('PG_ADMIN_PASSWORD') }}"
                  fetchType: NONE
                  sql: |
                    ALTER ROLE "{{ outputs.evaluate_rotation_state.vars.inactive_role }}" WITH LOGIN PASSWORD '{{ outputs.generate_candidate.vars.verifier }}'

                - id: verify_candidate_login
                  type: io.kestra.plugin.scripts.node.Script
                  description: Log in to Postgres as the idle role with the password stored in Vault. If this fails the run stops here and Vault still points at the live role.
                  containerImage: node:20-slim
                  taskRunner:
                    type: io.kestra.plugin.scripts.runner.docker.Docker
                  beforeCommands:
                    - npm install --silent --no-audit --no-fund pg@8.13.1
                  env:
                    VAULT_ADDR: "{{ inputs.vault_addr }}"
                    VAULT_TOKEN: "{{ secret('VAULT_TOKEN') }}"
                    VAULT_MOUNT: "{{ inputs.vault_mount }}"
                    VAULT_SECRET_PATH: "{{ inputs.vault_secret_path }}"
                    INACTIVE_ROLE: "{{ outputs.evaluate_rotation_state.vars.inactive_role }}"
                    PG_HOST: "{{ inputs.pg_host }}"
                    PG_PORT: "{{ inputs.pg_port }}"
                    PG_DATABASE: "{{ inputs.pg_database }}"
                    PG_SSL: "{{ inputs.pg_ssl }}"
                  script: |
                    const fs = require('fs');

                    const vault = async (method, path, body) => {
                      const res = await fetch(`${process.env.VAULT_ADDR.replace(/\/$/, '')}/v1/${path}`, {
                        method,
                        headers: { 'X-Vault-Token': process.env.VAULT_TOKEN, 'Content-Type': 'application/json' },
                        body: body ? JSON.stringify(body) : undefined,
                      });
                      const text = await res.text();
                      if (!res.ok) throw new Error(`Vault ${method} /v1/${path} -> HTTP ${res.status}: ${text.slice(0, 300)}`);
                      return text ? JSON.parse(text) : {};
                    };
                    const load = (p) => {
                      let d = JSON.parse(fs.readFileSync(p, 'utf8'));
                      while (typeof d === 'string') d = d.trim() ? JSON.parse(d) : {};
                      return d;
                    };
                    const emit = (outputs) => console.log('::' + JSON.stringify({ outputs }) + '::');
                    const { VAULT_MOUNT: MOUNT, VAULT_SECRET_PATH: SECRET } = process.env;

                    const { Client } = require('pg');

                    (async () => {
                      const pending = await vault('GET', `${MOUNT}/data/${SECRET}-pending`);
                      const client = new Client({
                        host: process.env.PG_HOST,
                        port: Number(process.env.PG_PORT),
                        database: process.env.PG_DATABASE,
                        user: pending.data.data.username,
                        password: pending.data.data.password,
                        ssl: process.env.PG_SSL === 'true',
                        connectionTimeoutMillis: 10000,
                      });
                      await client.connect();
                      const { rows } = await client.query('SELECT current_user AS who');
                      await client.end();
                      if (rows[0].who !== process.env.INACTIVE_ROLE) throw new Error(`logged in as ${rows[0].who}, expected ${process.env.INACTIVE_ROLE}`);
                      emit({ login_ok: true, role: rows[0].who });
                    })().catch((e) => { console.error('candidate login failed: ' + e.message); process.exitCode = 1; });

                - id: promote_secret_in_vault
                  type: io.kestra.plugin.scripts.node.Script
                  description: Write the new credentials to the live path with check-and-set against the version seen at planning time, read them back, delete the pending secret, and return the retirement ledger for the previous role.
                  containerImage: node:20-slim
                  taskRunner:
                    type: io.kestra.plugin.scripts.runner.docker.Docker
                  env:
                    VAULT_ADDR: "{{ inputs.vault_addr }}"
                    VAULT_TOKEN: "{{ secret('VAULT_TOKEN') }}"
                    VAULT_MOUNT: "{{ inputs.vault_mount }}"
                    VAULT_SECRET_PATH: "{{ inputs.vault_secret_path }}"
                    INACTIVE_ROLE: "{{ outputs.evaluate_rotation_state.vars.inactive_role }}"
                    ACTIVE_ROLE: "{{ outputs.evaluate_rotation_state.vars.active_role }}"
                    LIVE_VERSION: "{{ outputs.evaluate_rotation_state.vars.live_version }}"
                    GRACE_HOURS: "{{ inputs.grace_hours }}"
                  script: |
                    const fs = require('fs');

                    const vault = async (method, path, body) => {
                      const res = await fetch(`${process.env.VAULT_ADDR.replace(/\/$/, '')}/v1/${path}`, {
                        method,
                        headers: { 'X-Vault-Token': process.env.VAULT_TOKEN, 'Content-Type': 'application/json' },
                        body: body ? JSON.stringify(body) : undefined,
                      });
                      const text = await res.text();
                      if (!res.ok) throw new Error(`Vault ${method} /v1/${path} -> HTTP ${res.status}: ${text.slice(0, 300)}`);
                      return text ? JSON.parse(text) : {};
                    };
                    const load = (p) => {
                      let d = JSON.parse(fs.readFileSync(p, 'utf8'));
                      while (typeof d === 'string') d = d.trim() ? JSON.parse(d) : {};
                      return d;
                    };
                    const emit = (outputs) => console.log('::' + JSON.stringify({ outputs }) + '::');
                    const { VAULT_MOUNT: MOUNT, VAULT_SECRET_PATH: SECRET } = process.env;

                    (async () => {
                      const pending = await vault('GET', `${MOUNT}/data/${SECRET}-pending`);
                      const { username, password } = pending.data.data;
                      if (username !== process.env.INACTIVE_ROLE) throw new Error(`pending secret is for ${username}, expected ${process.env.INACTIVE_ROLE}`);

                      // check-and-set: Vault rejects the write if anyone changed the live secret while we waited for approval.
                      const written = await vault('POST', `${MOUNT}/data/${SECRET}`, {
                        options: { cas: Number(process.env.LIVE_VERSION) },
                        data: { username, password, rotated_at: new Date().toISOString(), rotated_from: process.env.ACTIVE_ROLE },
                      });
                      const newVersion = written.data.version;

                      const back = await vault('GET', `${MOUNT}/data/${SECRET}`);
                      if (back.data.metadata.version !== newVersion || back.data.data.username !== username || back.data.data.password !== password) {
                        throw new Error(`read-back of ${MOUNT}/${SECRET} does not match what was written (version ${newVersion})`);
                      }
                      try {
                        await vault('DELETE', `${MOUNT}/metadata/${SECRET}-pending`);
                      } catch (e) {
                        console.error('warning: could not delete the pending secret: ' + e.message);
                      }
                      const retireAfter = new Date(Date.now() + Number(process.env.GRACE_HOURS) * 3600000).toISOString();
                      emit({
                        new_version: newVersion,
                        ledger: { retire_role: process.env.ACTIVE_ROLE, retire_after: retireAfter, promoted_version: newVersion, promoted_at: new Date().toISOString() },
                      });
                    })().catch((e) => { console.error(e.message); process.exitCode = 1; });

                - id: record_retirement_ledger
                  type: io.kestra.plugin.core.kv.Set
                  description: Remember which role to switch off, and when, so a later run can retire it.
                  key: "{{ vars.ledger_key }}"
                  kvType: JSON
                  overwrite: true
                  value: "{{ outputs.promote_secret_in_vault.vars.ledger | toJson }}"

                - id: notify_rotated
                  type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
                  url: "{{ secret('SLACK_WEBHOOK_URL') }}"
                  messageText: "`{{ inputs.vault_mount }}/{{ inputs.vault_secret_path }}` now serves `{{ outputs.evaluate_rotation_state.vars.inactive_role }}` (Vault version {{ outputs.promote_secret_in_vault.vars.new_version }}). `{{ outputs.evaluate_rotation_state.vars.active_role }}` keeps working until {{ outputs.promote_secret_in_vault.vars.ledger.retire_after }}."
              else:
                - id: discard_declined_candidate
                  type: io.kestra.plugin.scripts.node.Script
                  description: Remove the unused pending secret from Vault.
                  containerImage: node:20-slim
                  taskRunner:
                    type: io.kestra.plugin.scripts.runner.docker.Docker
                  env:
                    VAULT_ADDR: "{{ inputs.vault_addr }}"
                    VAULT_TOKEN: "{{ secret('VAULT_TOKEN') }}"
                    VAULT_MOUNT: "{{ inputs.vault_mount }}"
                    VAULT_SECRET_PATH: "{{ inputs.vault_secret_path }}"
                  script: |
                    const fs = require('fs');

                    const vault = async (method, path, body) => {
                      const res = await fetch(`${process.env.VAULT_ADDR.replace(/\/$/, '')}/v1/${path}`, {
                        method,
                        headers: { 'X-Vault-Token': process.env.VAULT_TOKEN, 'Content-Type': 'application/json' },
                        body: body ? JSON.stringify(body) : undefined,
                      });
                      const text = await res.text();
                      if (!res.ok) throw new Error(`Vault ${method} /v1/${path} -> HTTP ${res.status}: ${text.slice(0, 300)}`);
                      return text ? JSON.parse(text) : {};
                    };
                    const load = (p) => {
                      let d = JSON.parse(fs.readFileSync(p, 'utf8'));
                      while (typeof d === 'string') d = d.trim() ? JSON.parse(d) : {};
                      return d;
                    };
                    const emit = (outputs) => console.log('::' + JSON.stringify({ outputs }) + '::');
                    const { VAULT_MOUNT: MOUNT, VAULT_SECRET_PATH: SECRET } = process.env;

                    vault('DELETE', `${MOUNT}/metadata/${SECRET}-pending`)
                      .then(() => emit({ discarded: true }))
                      .catch((e) => { console.error(e.message); process.exitCode = 1; });
          else:
            - id: discard_report_only_candidate
              type: io.kestra.plugin.scripts.node.Script
              description: Report-only run, so remove the pending secret that was written to produce the plan.
              containerImage: node:20-slim
              taskRunner:
                type: io.kestra.plugin.scripts.runner.docker.Docker
              env:
                VAULT_ADDR: "{{ inputs.vault_addr }}"
                VAULT_TOKEN: "{{ secret('VAULT_TOKEN') }}"
                VAULT_MOUNT: "{{ inputs.vault_mount }}"
                VAULT_SECRET_PATH: "{{ inputs.vault_secret_path }}"
              script: |
                const fs = require('fs');

                const vault = async (method, path, body) => {
                  const res = await fetch(`${process.env.VAULT_ADDR.replace(/\/$/, '')}/v1/${path}`, {
                    method,
                    headers: { 'X-Vault-Token': process.env.VAULT_TOKEN, 'Content-Type': 'application/json' },
                    body: body ? JSON.stringify(body) : undefined,
                  });
                  const text = await res.text();
                  if (!res.ok) throw new Error(`Vault ${method} /v1/${path} -> HTTP ${res.status}: ${text.slice(0, 300)}`);
                  return text ? JSON.parse(text) : {};
                };
                const load = (p) => {
                  let d = JSON.parse(fs.readFileSync(p, 'utf8'));
                  while (typeof d === 'string') d = d.trim() ? JSON.parse(d) : {};
                  return d;
                };
                const emit = (outputs) => console.log('::' + JSON.stringify({ outputs }) + '::');
                const { VAULT_MOUNT: MOUNT, VAULT_SECRET_PATH: SECRET } = process.env;

                vault('DELETE', `${MOUNT}/metadata/${SECRET}-pending`)
                  .then(() => emit({ discarded: true }))
                  .catch((e) => { console.error(e.message); process.exitCode = 1; });

      RETIRE:
        - id: gate_on_retire
          type: io.kestra.plugin.core.flow.If
          description: Retire only when nobody is connected as the previous role and approval is enabled. Otherwise report who is still using it.
          condition: "{{ inputs.apply_after_approval and outputs.evaluate_rotation_state.vars.retire_sessions == 0 }}"
          then:
            - id: retire_approval_gate
              type: io.kestra.plugin.core.flow.Pause
              description: Operator approves switching off the previous role.
              pauseDuration: PT4H
              behavior: CANCEL
              onResume:
                - id: approved
                  type: BOOL
                  defaults: false
                  description: Set to true to run ALTER ROLE ... NOLOGIN on the previous role.

            - id: gate_on_retire_approval
              type: io.kestra.plugin.core.flow.If
              condition: "{{ outputs.retire_approval_gate.onResume.approved == true or outputs.retire_approval_gate.onResume.approved == 'true' }}"
              then:
                - id: recheck_sessions
                  type: io.kestra.plugin.jdbc.postgresql.Query
                  description: Count sessions again, because hours may have passed while waiting for approval.
                  url: "jdbc:postgresql://{{ inputs.pg_host }}:{{ inputs.pg_port }}/{{ inputs.pg_database }}"
                  ssl: "{{ inputs.pg_ssl }}"
                  username: "{{ inputs.pg_admin_username }}"
                  password: "{{ secret('PG_ADMIN_PASSWORD') }}"
                  fetchType: FETCH_ONE
                  sql: |
                    SELECT count(*) AS sessions FROM pg_stat_activity WHERE usename = '{{ outputs.evaluate_rotation_state.vars.retire_role }}'

                - id: gate_on_clean_recheck
                  type: io.kestra.plugin.core.flow.If
                  condition: "{{ outputs.recheck_sessions.row.sessions == 0 }}"
                  then:
                    - id: disable_previous_role_login
                      type: io.kestra.plugin.jdbc.postgresql.Query
                      description: Switch off the previous role. Its password is replaced on the next rotation, when it becomes the idle role again.
                      url: "jdbc:postgresql://{{ inputs.pg_host }}:{{ inputs.pg_port }}/{{ inputs.pg_database }}"
                      ssl: "{{ inputs.pg_ssl }}"
                      username: "{{ inputs.pg_admin_username }}"
                      password: "{{ secret('PG_ADMIN_PASSWORD') }}"
                      fetchType: NONE
                      sql: |
                        ALTER ROLE "{{ outputs.evaluate_rotation_state.vars.retire_role }}" NOLOGIN

                    - id: read_role_after
                      type: io.kestra.plugin.jdbc.postgresql.Query
                      description: Read the role back from the catalog.
                      url: "jdbc:postgresql://{{ inputs.pg_host }}:{{ inputs.pg_port }}/{{ inputs.pg_database }}"
                      ssl: "{{ inputs.pg_ssl }}"
                      username: "{{ inputs.pg_admin_username }}"
                      password: "{{ secret('PG_ADMIN_PASSWORD') }}"
                      fetchType: FETCH_ONE
                      sql: |
                        SELECT rolcanlogin FROM pg_roles WHERE rolname = '{{ outputs.evaluate_rotation_state.vars.retire_role }}'

                    - id: assert_login_disabled
                      type: io.kestra.plugin.core.execution.Assert
                      conditions:
                        - "{{ outputs.read_role_after.row.rolcanlogin == false }}"
                      errorMessage: "Role {{ outputs.evaluate_rotation_state.vars.retire_role }} can still log in after ALTER ROLE ... NOLOGIN."

                    - id: clear_retirement_ledger
                      type: io.kestra.plugin.core.kv.Set
                      key: "{{ vars.ledger_key }}"
                      kvType: JSON
                      overwrite: true
                      value: "{{ {'retire_role': ''} | toJson }}"

                    - id: notify_retired
                      type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
                      url: "{{ secret('SLACK_WEBHOOK_URL') }}"
                      messageText: "`{{ outputs.evaluate_rotation_state.vars.retire_role }}` can no longer log in; `{{ outputs.evaluate_rotation_state.vars.active_role }}` is the only live role for `{{ inputs.vault_mount }}/{{ inputs.vault_secret_path }}`."
                  else:
                    - id: notify_sessions_appeared
                      type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
                      url: "{{ secret('SLACK_WEBHOOK_URL') }}"
                      messageText: "Retirement of `{{ outputs.evaluate_rotation_state.vars.retire_role }}` was approved but {{ outputs.recheck_sessions.row.sessions }} session(s) connected in the meantime. Nothing was changed; the next run retries."
              else:
                - id: log_retire_declined
                  type: io.kestra.plugin.core.log.Log
                  message: "Retirement was not approved; the previous role keeps working."
          else:
            - id: notify_retire_pending
              type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
              url: "{{ secret('SLACK_WEBHOOK_URL') }}"
              messageText: "`{{ outputs.evaluate_rotation_state.vars.retire_role }}` is past its grace period but was not retired: {{ outputs.evaluate_rotation_state.vars.retire_sessions }} open session(s) ({{ outputs.evaluate_rotation_state.vars.retire_clients }}), apply_after_approval={{ inputs.apply_after_approval }}. Those clients still use credentials Vault no longer serves."

      BLOCKED:
        - id: notify_blocked
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          messageText: "Rotation of `{{ inputs.vault_mount }}/{{ inputs.vault_secret_path }}` is due but blocked: {{ outputs.evaluate_rotation_state.vars.reason }}. Changing that role's password would lock those clients out on reconnect."
    defaults:
      - id: log_no_action
        type: io.kestra.plugin.core.log.Log
        message: "No action: {{ outputs.evaluate_rotation_state.vars.reason }}."

errors:
  - id: alert_on_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    messageText: "Password rotation for `{{ inputs.vault_mount }}/{{ inputs.vault_secret_path }}` failed (execution `{{ execution.id }}`). Vault still serves the credentials it served before unless the failure came after the promote step; a leftover `{{ inputs.vault_secret_path }}-pending` secret is overwritten by the next run."

extend:
  title: Rotate a Postgres App Password With Zero Downtime Using Alternating Roles and Vault
  metaTitle: Zero-Downtime Postgres Password Rotation With Vault | Kestra
  shortDescription: Give the idle Postgres role a new password, prove it can log in, switch the Vault secret to it after approval, then retire the old role once no session uses it.
  metaDescription: Rotate Postgres passwords with no dropped connections using alternating roles, SCRAM verifier, login check, Vault CAS cutover and safe retirement.
  description: |
    Changing a database password in place breaks every client still holding the old one, so rotation gets postponed. Here two roles with identical grants take turns and the live one is never altered.

    ## How it works

    1. `read_role_state` reads both roles and their open sessions from `pg_roles` and `pg_stat_activity`. `evaluate_rotation_state` reads the live secret's age and username from Vault KV v2 (never emitting the password) and the retirement ledger from Kestra KV, then decides `ROTATE`, `RETIRE`, `BLOCKED` or `NONE`. A due role that still has sessions is `BLOCKED`.
    2. `dispatch_action` (`Switch`) routes. For `ROTATE`, `generate_candidate` stores a random password in a Vault pending path and returns only its SCRAM-SHA-256 verifier, so no clear-text password reaches SQL or Kestra outputs.
    3. `approval_gate` (`Pause`) waits up to 4 hours. On approval, `set_inactive_role_password` applies the verifier to the idle role and `verify_candidate_login` logs in with the password from Vault.
    4. `promote_secret_in_vault` writes the live path with check-and-set against the version seen at planning, reads it back, deletes the pending secret, and `record_retirement_ledger` stores the previous role and its `retire_after` time in KV.
    5. After the grace period, `RETIRE` checks sessions again after a second approval, runs `ALTER ROLE ... NOLOGIN`, reads the catalog back, and clears the ledger. Roles that still have clients are reported with `application_name@address`.

    ## What you get

    - Rotation with no window of invalid credentials, because the active role is never altered.
    - No rollback needed: until the promote step, Vault still serves the old credentials.
    - Retirement that refuses to cut off clients, and names them.

    ## Who it's for

    - Platform and security teams that run Vault KV and Postgres and rotate application credentials on a schedule.

    ## Why orchestrate this with Kestra

    The cutover spans Postgres and Vault, waits for a human, and must remember days later what to retire. Kestra provides the approval, the KV ledger and the ordered checks in one flow.

    ## Prerequisites

    - Vault KV v2 with a secret holding `username` (one of the two roles) and `password`; Docker for the script tasks.
    - Two Postgres roles with identical grants. The admin role needs `CREATEROLE` with admin option on both, and `pg_read_all_stats`.

    ### Secrets

    - `VAULT_TOKEN`: token that can read and write the secret path, its `-pending` sibling, and delete the pending metadata.
    - `PG_ADMIN_PASSWORD`: password of the Postgres admin role.
    - `SLACK_WEBHOOK_URL`: Slack incoming webhook.

    ## Quick start

    1. Run `postgres:16` and `hashicorp/vault` in dev mode, create the two roles, and write `username=orders_app_a` plus a password to `secret/db/orders-app`.
    2. Create the three secrets, then execute with `force_rotation: true` and `apply_after_approval: false` to see the plan.
    3. Execute again with it true, resume the pause with `approved` set, and watch Vault move to `orders_app_b`.
    4. Execute after the grace period to retire `orders_app_a`, then enable `daily_check`.

    ## How to extend

    - Add a Kubernetes rollout task after `promote_secret_in_vault` to restart workloads at once.

    ## Links

    - [Vault KV v2 API](https://developer.hashicorp.com/vault/api-docs/secret/kv/kv-v2)
    - [Postgres ALTER ROLE](https://www.postgresql.org/docs/current/sql-alterrole.html)
    - [Kestra Pause task](https://kestra.io/plugins/core/flow/io.kestra.plugin.core.flow.pause)
  tags:
    - Infrastructure
    - Data
  subTags:
    - Day 2 Operations
    - Approval Gates
  ee: false
  demo: false
