
id: mutant-ai-autonomous-resilience
namespace: company.team

description: |
  Assess endpoint health, enforce a safety policy, simulate recovery,
  verify the result, and produce an audit report. No real infrastructure
  changes are performed.

triggers:
  - id: scheduled_health_check
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 */6 * * *"
inputs:
  - id: repository_url
    type: STRING
    displayName: Repository API URL
    defaults: https://api.github.com/repos/khanadil84/blueprints

  - id: safety_mode
    type: SELECT
    displayName: Safety mode
    values:
      - observe_only
      - simulation_only
    defaults: observe_only

  - id: recovery_authorized
    type: BOOL
    displayName: Authorize simulated recovery
    defaults: false

tasks:
  - id: mission_brief
    type: io.kestra.plugin.core.log.Log
    description: Establish the mission and safety boundary.
    message: "Mutant AI started. Target={{ inputs.repository_url }}. Mode={{ inputs.safety_mode }}. Real changes are disabled."

  - id: repository_probe
    type: io.kestra.plugin.scripts.python.Script
    description: Make a bounded, read-only HTTP request to inspect endpoint health.
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    env:
      TARGET_URL: "{{ inputs.repository_url }}"
    script: |
      import json
      import os
      import urllib.error
      import urllib.request

      url = os.environ["TARGET_URL"]
      result = {
          "url": url,
          "status_code": None,
          "probe_ok": False,
          "error": None
      }

      if not url.startswith(("https://", "http://")):
          result["error"] = "Only HTTP and HTTPS URLs are allowed"
      else:
          try:
              req = urllib.request.Request(
                  url,
                  headers={"User-Agent": "MutantAI-Resilience-Demo/1.0"},
                  method="GET"
              )
              with urllib.request.urlopen(req, timeout=8) as response:
                  result["status_code"] = response.status
                  result["probe_ok"] = 200 <= response.status < 300
          except urllib.error.HTTPError as exc:
              result["status_code"] = exc.code
              result["error"] = "HTTP error response"
          except Exception as exc:
              result["error"] = type(exc).__name__

      print("::" + json.dumps({"outputs": result}) + "::")

  - id: health_classifier
    type: io.kestra.plugin.scripts.python.Script
    description: Classify the observed endpoint result.
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    env:
      PROBE_OK: "{{ outputs.repository_probe.vars.probe_ok }}"
      STATUS_CODE: "{{ outputs.repository_probe.vars.status_code }}"
    script: |
      import json
      import os

      healthy = os.environ["PROBE_OK"].strip().lower() == "true"
      code = os.environ.get("STATUS_CODE", "").strip()

      result = {
          "health": "HEALTHY" if healthy else "DEGRADED",
          "status_code": code if code not in ("", "None", "null") else None,
          "recovery_candidate": not healthy
      }
      print("::" + json.dumps({"outputs": result}) + "::")

  - id: health_decision
    type: io.kestra.plugin.core.flow.If
    description: Branch according to the observed endpoint health.
    condition: "{{ outputs.health_classifier.vars.health == 'HEALTHY' }}"
    then:
      - id: healthy_path
        type: io.kestra.plugin.core.log.Log
        message: "Endpoint is healthy. No recovery is needed."
    else:
      - id: degraded_path
        type: io.kestra.plugin.core.log.Log
        message: "Endpoint is degraded. Continue to the safety policy."

  - id: safety_policy
    type: io.kestra.plugin.scripts.python.Script
    description: Fail-closed policy gate; recovery simulation needs explicit authorization.
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    env:
      SAFETY_MODE: "{{ inputs.safety_mode }}"
      AUTHORIZED: "{{ inputs.recovery_authorized }}"
      HEALTH: "{{ outputs.health_classifier.vars.health }}"
    script: |
      import json
      import os

      mode = os.environ["SAFETY_MODE"]
      authorized = os.environ["AUTHORIZED"].strip().lower() == "true"
      unhealthy = os.environ["HEALTH"] != "HEALTHY"

      permitted = (
          mode == "simulation_only"
          and authorized
          and unhealthy
      )

      result = {
          "permitted": permitted,
          "decision": "SIMULATION_PERMITTED" if permitted else "BLOCKED",
          "reason": (
              "Authorized simulation for degraded endpoint"
              if permitted else
              "Healthy endpoint, observe-only mode, or authorization missing"
          )
      }
      print("::" + json.dumps({"outputs": result}) + "::")

  - id: recovery_simulator
    type: io.kestra.plugin.scripts.python.Script
    description: Record a simulated recovery decision without executing remediation.
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    env:
      HEALTH: "{{ outputs.health_classifier.vars.health }}"
      PERMITTED: "{{ outputs.safety_policy.vars.permitted }}"
    script: |
      import json
      import os

      healthy = os.environ["HEALTH"] == "HEALTHY"
      permitted = os.environ["PERMITTED"].strip().lower() == "true"

      if healthy:
          action = "NO_ACTION_HEALTHY"
      elif permitted:
          action = "SIMULATED_RECOVERY"
      else:
          action = "RECOVERY_BLOCKED"

      result = {
          "action": action,
          "simulation_only": True,
          "real_changes_made": False
      }
      print("::" + json.dumps({"outputs": result}) + "::")

  - id: verification_check
    type: io.kestra.plugin.scripts.python.Script
    description: Verify the simulated action respects the safety decision.
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    env:
      ACTION: "{{ outputs.recovery_simulator.vars.action }}"
      PERMITTED: "{{ outputs.safety_policy.vars.permitted }}"
      HEALTH: "{{ outputs.health_classifier.vars.health }}"
      SIMULATION_ONLY: "{{ outputs.recovery_simulator.vars.simulation_only }}"
      REAL_CHANGES: "{{ outputs.recovery_simulator.vars.real_changes_made }}"
    script: |
      import json
      import os

      action = os.environ["ACTION"]
      permitted = os.environ["PERMITTED"].strip().lower() == "true"
      healthy = os.environ["HEALTH"] == "HEALTHY"
      simulation_only = os.environ["SIMULATION_ONLY"].strip().lower() == "true"
      real_changes = os.environ["REAL_CHANGES"].strip().lower() == "true"

      consistent = (
          simulation_only
          and not real_changes
          and (
              (action == "SIMULATED_RECOVERY" and permitted and not healthy)
              or (action == "RECOVERY_BLOCKED" and not permitted and not healthy)
              or (action == "NO_ACTION_HEALTHY" and healthy and not permitted)
          )
      )

      result = {
          "verification": "PASS" if consistent else "FAIL",
          "verified": consistent,
          "action": action
      }
      print("::" + json.dumps({"outputs": result}) + "::")

  - id: audit_record
    type: io.kestra.plugin.scripts.python.Script
    description: Emit a structured audit record in execution outputs.
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    env:
      TARGET_URL: "{{ inputs.repository_url }}"
      HEALTH: "{{ outputs.health_classifier.vars.health }}"
      POLICY: "{{ outputs.safety_policy.vars.decision }}"
      ACTION: "{{ outputs.recovery_simulator.vars.action }}"
      VERIFICATION: "{{ outputs.verification_check.vars.verification }}"
    script: |
      import json
      import os

      audit = {
          "target": os.environ["TARGET_URL"],
          "health": os.environ["HEALTH"],
          "policy_decision": os.environ["POLICY"],
          "recovery_action": os.environ["ACTION"],
          "verification": os.environ["VERIFICATION"],
          "simulation_only": True,
          "real_changes_made": False
      }

      print("::" + json.dumps({"outputs": {"audit": audit}}) + "::")

  - id: mission_report
    type: io.kestra.plugin.core.log.Log
    description: Report the final verified result.
    message: "Mutant AI complete. Health={{ outputs.health_classifier.vars.health }}. Policy={{ outputs.safety_policy.vars.decision }}. Action={{ outputs.recovery_simulator.vars.action }}. Verification={{ outputs.verification_check.vars.verification }}. Real infrastructure changes: none."

extend:
  shortDescription: Safety-gated endpoint health checks, simulated recovery, verification, and audit in Kestra.
  title: Mutant AI — Autonomous Infrastructure Resilience
  metaTitle: Mutant AI Infrastructure Resilience Workflow with Kestra
  metaDescription: A Kestra blueprint for read-only endpoint monitoring, explicit recovery authorization, simulation-only actions, verification, and audit.
  description: |
    Mutant AI demonstrates a safety-gated infrastructure resilience workflow.
    It checks an HTTP endpoint, classifies its health, evaluates recovery
    authorization, simulates a recovery decision, verifies policy compliance,
    and emits a structured audit record. No real infrastructure changes are made.

    ## How it works

    1. Probe the configured HTTP endpoint with a bounded timeout.
    2. Classify the endpoint as healthy or degraded.
    3. Evaluate the safety mode and explicit recovery authorization.
    4. Record a simulated recovery decision without applying remediation.
    5. Verify the decision and emit an audit record.

    ## What you get

    - Endpoint health and status outputs.
    - A fail-closed safety policy.
    - Simulation-only recovery decisions.
    - Verification results and structured audit data.

    ## Who it's for

    - Infrastructure engineers and SREs.
    - Automation developers learning Kestra.
    - Teams exploring auditable resilience workflows.

    ## Why orchestrate this with Kestra

    Kestra connects the health probe, safety policy, simulated action,
    verification, and audit into an ordered, inspectable workflow.

    ## Prerequisites

    - A running Kestra instance.
    - Python available to the Process task runner.
    - Network access to the configured HTTP endpoint.

    ### Secrets

    No secrets are required by this example.

    ## Quick start

    Import the flow into Kestra, validate it, and execute with the default inputs.
    To test the blocked path, use an unreachable HTTP endpoint in observe_only mode.
    To test the permitted simulation path, use a degraded endpoint with
    simulation_only mode and recovery_authorized set to true.

    ## How to extend

    Add additional endpoints, bounded retries, notifications, or verification
    checks. Keep real remediation disabled unless separately implemented
    with explicit authorization and appropriate safeguards.

    ## Links

    - [Kestra Blueprints](https://github.com/kestra-io/blueprints)
  tags:
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - Day 2 Operations
  ee: false
  demo: false
