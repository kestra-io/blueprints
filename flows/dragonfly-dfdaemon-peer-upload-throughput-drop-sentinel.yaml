id: dragonfly-dfdaemon-peer-upload-throughput-drop-sentinel
namespace: company.team

description: |
  Audits Dragonfly P2P peer daemon telemetry to detect upload throughput collapse, piece distribution stalls, and upstream registry fallback spikes.

concurrency:
  limit: 1

inputs:
  - id: dfdaemon_metrics_url
    type: STRING
    displayName: "Dfdaemon Metrics URL"
    defaults: "http://dfdaemon.dragonfly-system.svc.cluster.local:4001"
    description: "Internal HTTP endpoint exposing Prometheus metrics for the Dragonfly P2P client peer daemon service."

  - id: target_peer_cluster
    type: STRING
    displayName: "Target Peer Cluster"
    defaults: "dc-west-k8s"
    description: "Identifier for the target Dragonfly P2P peer cluster and scheduler pool monitored for image piece distribution."

  - id: min_upload_throughput_mb_threshold
    type: INT
    displayName: "Min Upload Throughput Threshold (MB/s)"
    defaults: 50
    description: "Minimum acceptable aggregate peer daemon upload throughput in megabytes per second during active artifact pulls."

  - id: max_failed_pieces_threshold
    type: INT
    displayName: "Max Failed Pieces Threshold"
    defaults: 15
    description: "Maximum allowable failed or corrupted piece downloads between peer nodes before triggering an incident."

  - id: alert_on_scheduler_disconnect
    type: BOOL
    displayName: "Alert on Scheduler Disconnect"
    defaults: true
    description: "Toggle whether peer disconnection from the central Dragonfly scheduler triggers an immediate high-urgency alert."

tasks:
  - id: scan_dragonfly_telemetry
    type: io.kestra.plugin.scripts.python.Script
    description: Scrapes Dragonfly dfdaemon Prometheus metrics to audit peer upload bandwidth, piece download failure totals, and active task counts.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests kestra
    env:
      METRICS_URL: "{{ inputs.dfdaemon_metrics_url }}"
      PEER_CLUSTER: "{{ inputs.target_peer_cluster }}"
      MIN_THROUGHPUT: "{{ inputs.min_upload_throughput_mb_threshold }}"
      MAX_FAILED_PIECES: "{{ inputs.max_failed_pieces_threshold }}"
      ALERT_DISCONNECT: "{{ inputs.alert_on_scheduler_disconnect }}"
    outputFiles:
      - dfdaemon_metrics.json
    script: |
      import os
      import sys
      import re
      import json
      import requests
      from datetime import datetime, timezone
      from kestra import Kestra

      base_url = os.environ.get("METRICS_URL", "").rstrip("/")
      peer_cluster = os.environ.get("PEER_CLUSTER", "dc-west-k8s")
      min_throughput = int(os.environ.get("MIN_THROUGHPUT", "50"))
      max_failed_pieces = int(os.environ.get("MAX_FAILED_PIECES", "15"))
      alert_disconnect = os.environ.get("ALERT_DISCONNECT", "true").lower() == "true"

      upload_bytes_rate = 0.0
      failed_pieces_total = 0
      active_tasks_count = 0
      scheduler_connected = 1
      degraded_clusters = []

      try:
          resp = requests.get(f"{base_url}/metrics", timeout=15)
          resp.raise_for_status()
          for line in resp.text.splitlines():
              line = line.strip()
              if not line or line.startswith("#"):
                  continue
              match = re.search(r'([0-9.]+)\s*$', line)
              if not match:
                  continue
              val = float(match.group(1))
              if "dfdaemon_peer_upload_traffic_bytes_total" in line:
                  upload_bytes_rate = max(upload_bytes_rate, val)
              elif "dfdaemon_piece_download_failures_total" in line:
                  failed_pieces_total += int(val)
              elif "dfdaemon_active_download_tasks" in line:
                  active_tasks_count = max(active_tasks_count, int(val))
              elif "dfdaemon_scheduler_connection_status" in line:
                  scheduler_connected = int(val)
      except Exception as err:
          print(f"ERROR: Failed to scrape Dragonfly dfdaemon metrics at '{base_url}': {err}", file=sys.stderr)
          sys.exit(1)

      upload_mb_rate = int(upload_bytes_rate / (1024 * 1024))
      if active_tasks_count > 0 and upload_mb_rate < min_throughput:
          degraded_clusters.append(f"{peer_cluster}-throughput-collapse")
      is_breached = bool(
          (active_tasks_count > 0 and upload_mb_rate < min_throughput) or
          (failed_pieces_total > max_failed_pieces) or
          (alert_disconnect and scheduler_connected == 0)
      )
      now_iso = datetime.now(timezone.utc).isoformat()
      summary = (
          f"Dragonfly cluster '{peer_cluster}' audit: {upload_mb_rate} MB/s upload rate, "
          f"{failed_pieces_total} failed pieces, {active_tasks_count} active tasks, "
          f"scheduler status {scheduler_connected}."
      )
      print(f"Dragonfly Telemetry Complete: {summary}")

      report = {
          "upload_mb_rate": upload_mb_rate,
          "failed_pieces_total": failed_pieces_total,
          "active_tasks_count": active_tasks_count,
          "scheduler_connected": bool(scheduler_connected == 1),
          "degraded_clusters": list(set(degraded_clusters)),
          "is_alerting": is_breached,
          "peer_cluster": peer_cluster,
          "audit_timestamp": now_iso
      }
      with open("dfdaemon_metrics.json", "w", encoding="utf-8") as f:
          json.dump(report, f, indent=2)

      Kestra.outputs(report)

  - id: evaluate_dragonfly_health
    type: io.kestra.plugin.core.flow.If
    description: Evaluates whether observed Dragonfly peer upload throughput, piece failures, or scheduler connections breach thresholds.
    condition: "{{ outputs.scan_dragonfly_telemetry.vars.is_alerting }}"
    then:
      - id: notify_slack_platform_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches high-urgency incident notification to SRE Platform Slack channel detailing Dragonfly P2P distribution failure.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#platform-distribution-alerts",
            "text": "CRITICAL: Dragonfly P2P Upload Throughput Drop in Cluster `{{ inputs.target_peer_cluster }}`. Observed Throughput: `{{ outputs.scan_dragonfly_telemetry.vars.upload_mb_rate }}` MB/s (min acceptable: `{{ inputs.min_upload_throughput_mb_threshold }}` MB/s). Failed Pieces: `{{ outputs.scan_dragonfly_telemetry.vars.failed_pieces_total }}` (threshold: `{{ inputs.max_failed_pieces_threshold }}`). Active Tasks: `{{ outputs.scan_dragonfly_telemetry.vars.active_tasks_count }}`. Scheduler Connected: `{{ outputs.scan_dragonfly_telemetry.vars.scheduler_connected }}`. Audit Timestamp: `{{ outputs.scan_dragonfly_telemetry.vars.audit_timestamp }}`."
          }
    else:
      - id: log_nominal_dragonfly_state
        type: io.kestra.plugin.core.log.Log
        description: Records nominal telemetry when Dragonfly P2P client nodes distribute container image pieces at healthy throughput.
        message: "Dragonfly P2P cluster {{ inputs.target_peer_cluster }} nominal. Upload rate {{ outputs.scan_dragonfly_telemetry.vars.upload_mb_rate }} MB/s satisfies threshold {{ inputs.min_upload_throughput_mb_threshold }} MB/s."

  - id: emit_audit_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Emits structured JSON telemetry manifest for infrastructure performance archives, cluster capacity dashboards, and audits.
    format: |
      {
        "sentinel_id": "dragonfly-dfdaemon-peer-upload-throughput-drop-sentinel",
        "peer_cluster": "{{ inputs.target_peer_cluster }}",
        "upload_throughput_mb": {{ outputs.scan_dragonfly_telemetry.vars.upload_mb_rate }},
        "failed_pieces": {{ outputs.scan_dragonfly_telemetry.vars.failed_pieces_total }},
        "active_tasks": {{ outputs.scan_dragonfly_telemetry.vars.active_tasks_count }},
        "scheduler_online": {{ outputs.scan_dragonfly_telemetry.vars.scheduler_connected }},
        "alerting": {{ outputs.scan_dragonfly_telemetry.vars.is_alerting }}
      }

errors:
  - id: notify_dfdaemon_sentinel_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Dispatches alert to Slack when Dragonfly dfdaemon Sentinel fails execution.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "#platform-distribution-alerts",
        "username": "Dragonfly P2P Sentinel",
        "icon_emoji": ":warning:",
        "text": "CRITICAL: Dragonfly P2P Sentinel execution failed for cluster `{{ inputs.target_peer_cluster }}` on execution `{{ execution.id }}`. Check dfdaemon metrics endpoint reachability."
      }

triggers:
  - id: periodic_p2p_throughput_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  title: Dragonfly P2P Daemon Upload Throughput & Piece Drop Sentinel
  metaTitle: Dragonfly P2P Daemon Throughput Sentinel Blueprint
  shortDescription: Audits Dragonfly dfdaemon client telemetry for P2P upload throughput collapse, failed piece downloads, and scheduler disconnects.
  metaDescription: Audits Dragonfly dfdaemon client telemetry for P2P upload throughput collapse, failed piece downloads, and scheduler disconnects with automated Slack alerting.
  description: |
    Dragonfly accelerates container image distribution across large Kubernetes clusters using peer-to-peer (P2P) piece sharing. When peer upload throughput collapses or piece download failures surge, nodes fall back to upstream container registries, saturating network transit and causing image pull throttling. This sentinel scrapes dfdaemon Prometheus endpoints, checks upload bandwidth and scheduler connectivity, and alerts platform SRE teams.

    ## How it works
    1. Scrapes Dragonfly dfdaemon Prometheus metrics using containerized Python.
    2. Measures `dfdaemon_peer_upload_traffic_bytes_total`, `dfdaemon_piece_download_failures_total`, and `dfdaemon_scheduler_connection_status`.
    3. Evaluates throughput floor and piece failure ceiling.
    4. Alerts on Slack and emits structured audit manifest.

    ## Prerequisites
    - Reachable dfdaemon Prometheus metrics endpoint.
    - Slack Incoming Webhook secret configured.
  tags:
    - Infrastructure
    - Network
  subTags:
    - Monitoring & Alerting
  ee: false
  demo: false
