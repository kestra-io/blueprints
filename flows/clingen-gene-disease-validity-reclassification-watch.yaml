id: clingen-gene-disease-validity-reclassification-watch
namespace: company.team

description: |
  Weekly check of a laboratory test menu against ClinGen gene-disease validity curations. Downloads the
  full ClinGen summary CSV once, keeps the latest curation per gene, disease and mode of inheritance, diffs
  it in DuckDB against the snapshot stored in KV and alerts Slack on downgrades and withdrawn curations.

concurrency:
  limit: 1

inputs:
  - id: test_menu_genes
    type: ARRAY
    itemType: STRING
    displayName: Genes on the test menu
    description: HGNC gene symbols on your panels, case-insensitive. A gene with no ClinGen curation is listed in the summary, not treated as an error. An entry with characters other than letters, digits, '-', '.' or '_' stops the run before the snapshot is touched.
    defaults:
      - BRCA1
      - BRCA2
      - PALB2
      - CHEK2
      - MUTYH
      - CDH1
      - MLH1
      - MSH2
      - TP53
      - MYH7
      - MYBPC3
      - TTN
      - MYOZ2
      - KCNH2
      - SCN5A
      - TTR
      - FOXE3
      - MUC16

  - id: min_classification
    type: SELECT
    displayName: Lowest classification accepted on the menu
    description: Current curations below this level are listed for review on every run, and downgrades that end below it are marked as crossing the threshold.
    values:
      - Definitive
      - Strong
      - Moderate
      - Limited
    defaults: Moderate

  - id: state_key
    type: STRING
    displayName: KV key of the snapshot
    description: Use one key per test menu.
    defaults: clingen_gene_validity_snapshot

triggers:
  - id: weekly
    type: io.kestra.plugin.core.trigger.Schedule
    description: ClinGen publishes new and re-curated assertions continuously; a weekly check fits a test-menu review cycle.
    cron: "0 6 * * 1"
    timezone: UTC

tasks:
  - id: read_snapshot
    type: io.kestra.plugin.core.kv.Get
    description: Snapshot of the previous run (menu genes plus their effective curations). Missing on the first run, which is then a baseline.
    key: "{{ inputs.state_key }}"
    errorOnMissing: false

  - id: download
    type: io.kestra.plugin.core.http.Download
    description: The full ClinGen gene-disease validity summary in one request (about 1.1 MB, 3,700 curations). Transient errors and 5xx are retried.
    uri: https://search.clinicalgenome.org/kb/gene-validity/download
    headers:
      User-Agent: "kestra-clingen-gene-validity-watch/1.0 (https://kestra.io)"
    options:
      retryOnStatusCodes: [429, 500, 502, 503, 504]
      retry:
        type: exponential
        interval: PT10S
        maxInterval: PT2M
        maxAttempts: 4

  - id: diff
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: |
      Skips the four banner rows and the "+++" separator rows of the ClinGen CSV, refuses a truncated or reshaped file
      (fewer than 1,000 curations or an unknown classification) so a bad download cannot overwrite the snapshot, keeps
      the most recent curation when a gene, disease and MOI was curated by more than one expert panel, and diffs the
      menu genes by HGNC ID so a symbol rename is not reported as a withdrawal.
    url: "jdbc:duckdb:"
    fetchType: FETCH_ONE
    inputFiles:
      gv.csv: "{{ outputs.download.uri }}"
    outputFiles:
      - changes_csv
      - menu_csv
    parameters:
      menu: "{{ inputs.test_menu_genes | toJson }}"
      prev: "{{ outputs.read_snapshot.value ?? '' }}"
      min_class: "{{ inputs.min_classification }}"
    sql: |
      SET TimeZone = 'UTC';
      CREATE MACRO class_rank(c) AS CASE c WHEN 'Definitive' THEN 6 WHEN 'Strong' THEN 5 WHEN 'Moderate' THEN 4
        WHEN 'Limited' THEN 3 WHEN 'No Known Disease Relationship' THEN 2 WHEN 'Disputed' THEN 1 WHEN 'Refuted' THEN 0 END;

      CREATE TABLE menu AS SELECT DISTINCT upper(trim(g)) AS symbol FROM unnest(from_json(:menu, '["VARCHAR"]')) AS t(g) WHERE trim(g) <> '';
      CREATE TABLE menu_check AS SELECT CASE WHEN count(*) FILTER (WHERE NOT regexp_full_match(symbol, '[A-Z0-9][A-Z0-9._-]*')) > 0
        THEN error('Invalid gene symbol(s) on the menu, nothing was changed. ' || string_agg(symbol, ', ') FILTER (WHERE NOT regexp_full_match(symbol, '[A-Z0-9][A-Z0-9._-]*')))
        WHEN count(*) = 0 THEN error('The test menu is empty.') END AS ok FROM menu;

      CREATE TABLE banner AS SELECT regexp_extract(content, 'FILE CREATED. ([0-9-]+)', 1) AS file_created FROM read_text('gv.csv');
      CREATE TABLE curations AS
      SELECT upper(trim("GENE SYMBOL")) AS gene_symbol, trim("GENE ID (HGNC)") AS hgnc_id, trim("DISEASE LABEL") AS disease_label,
             trim("DISEASE ID (MONDO)") AS mondo_id, trim("MOI") AS moi, trim("CLASSIFICATION") AS classification,
             CAST(left(trim("CLASSIFICATION DATE"), 10) AS DATE) AS classification_date, trim("GCEP") AS gcep, trim("ONLINE REPORT") AS report_url
      FROM read_csv('gv.csv', skip = 4, header = true, all_varchar = true, delim = ',', quote = '"')
      WHERE coalesce(trim("GENE SYMBOL"), '') <> '' AND "GENE SYMBOL" NOT LIKE '+%';
      CREATE TABLE file_check AS SELECT CASE
        WHEN count(*) < 1000 THEN error('ClinGen file has only ' || count(*) || ' curations, refusing to update the snapshot.')
        WHEN count(*) FILTER (WHERE class_rank(classification) IS NULL) > 0
          THEN error('Unknown ClinGen classification ' || string_agg(DISTINCT classification, ', ') FILTER (WHERE class_rank(classification) IS NULL))
        END AS ok FROM curations;

      CREATE TABLE effective AS
      SELECT * EXCLUDE (rn) FROM (
        SELECT *, row_number() OVER w AS rn, count(*) OVER (PARTITION BY hgnc_id, mondo_id, moi) - 1 AS superseded
        FROM curations WINDOW w AS (PARTITION BY hgnc_id, mondo_id, moi ORDER BY classification_date DESC, report_url DESC)
      ) WHERE rn = 1;

      CREATE TABLE prev_doc AS SELECT CAST(p AS JSON) AS doc FROM (SELECT :prev AS p) WHERE p <> '';
      CREATE TABLE prev_menu AS SELECT unnest(from_json(json_extract(doc, '$.menu'), '["VARCHAR"]')) AS symbol FROM prev_doc;
      CREATE TABLE prev AS SELECT unnest(c) FROM (SELECT unnest(from_json(json_extract(doc, '$.curations'),
        '[{"watched_as":"VARCHAR","hgnc_id":"VARCHAR","gene_symbol":"VARCHAR","disease_label":"VARCHAR","mondo_id":"VARCHAR","moi":"VARCHAR","classification":"VARCHAR","classification_date":"DATE","gcep":"VARCHAR","report_url":"VARCHAR"}]')) AS c FROM prev_doc);

      CREATE TABLE watched AS SELECT DISTINCT ON (hgnc_id) watched_as, hgnc_id FROM (
        SELECT m.symbol AS watched_as, e.hgnc_id FROM menu m JOIN effective e ON e.gene_symbol = m.symbol
        UNION SELECT p.watched_as, p.hgnc_id FROM prev p JOIN menu m ON m.symbol = p.watched_as
      ) ORDER BY hgnc_id, watched_as;
      CREATE TABLE cur AS SELECT w.watched_as, e.* FROM effective e JOIN watched w ON w.hgnc_id = e.hgnc_id;

      CREATE TABLE joined AS
      SELECT coalesce(c.watched_as, p.watched_as) AS watched_as, coalesce(c.hgnc_id, p.hgnc_id) AS hgnc_id,
             coalesce(c.gene_symbol, p.gene_symbol) AS gene_symbol, p.gene_symbol AS previous_symbol,
             coalesce(c.disease_label, p.disease_label) AS disease_label, coalesce(c.mondo_id, p.mondo_id) AS mondo_id,
             coalesce(c.moi, p.moi) AS moi, p.classification AS previous_classification, c.classification,
             p.classification_date AS previous_date, c.classification_date, p.gcep AS previous_gcep, c.gcep,
             coalesce(c.report_url, p.report_url) AS report_url,
             CASE WHEN p.hgnc_id IS NULL THEN 'NEW' WHEN c.hgnc_id IS NULL THEN 'REMOVED'
                  WHEN class_rank(c.classification) < class_rank(p.classification) THEN 'DOWNGRADE'
                  WHEN class_rank(c.classification) > class_rank(p.classification) THEN 'UPGRADE'
                  WHEN c.classification_date > p.classification_date THEN 'RECURATED' END AS change_type
      FROM (SELECT * FROM cur WHERE watched_as IN (SELECT symbol FROM prev_menu)) c
      FULL JOIN (SELECT * FROM prev WHERE watched_as IN (SELECT symbol FROM menu)) p
        ON c.hgnc_id = p.hgnc_id AND c.mondo_id = p.mondo_id AND c.moi = p.moi;

      CREATE TABLE changes AS
      SELECT change_type, change_type = 'DOWNGRADE' OR (change_type = 'REMOVED' AND NOT EXISTS (SELECT 1 FROM joined n WHERE n.change_type = 'NEW'
               AND n.hgnc_id = joined.hgnc_id AND n.moi = joined.moi AND class_rank(n.classification) >= class_rank(joined.previous_classification))) AS alert,
             change_type = 'DOWNGRADE' AND class_rank(classification) < class_rank(:min_class) AND class_rank(previous_classification) >= class_rank(:min_class) AS crossed_threshold,
             gene_symbol, disease_label, mondo_id, moi, previous_classification, classification, previous_date, classification_date,
             concat_ws('; ',
               CASE WHEN previous_symbol IS NOT NULL AND previous_symbol <> gene_symbol THEN 'symbol renamed from ' || previous_symbol END,
               CASE WHEN previous_gcep IS NOT NULL AND gcep IS NOT NULL AND previous_gcep <> gcep THEN 'now curated by ' || gcep END,
               CASE WHEN change_type = 'REMOVED' THEN (SELECT 'new curation(s) for this gene in the same run, likely a disease relabel or split. ' || string_agg(n.disease_label || ' ' || n.moi || ' ' || n.classification, ', ')
                 FROM joined n WHERE n.change_type = 'NEW' AND n.hgnc_id = joined.hgnc_id) END) AS note,
             gcep, report_url
      FROM joined WHERE change_type IS NOT NULL;

      COPY (SELECT * FROM changes ORDER BY alert DESC, gene_symbol, disease_label) TO '{{ outputFiles.changes_csv }}' (HEADER, DELIMITER ',');
      COPY (SELECT watched_as, gene_symbol, hgnc_id, disease_label, mondo_id, moi, classification, classification_date, gcep,
                   class_rank(classification) < class_rank(:min_class) AS below_threshold, disease_label LIKE 'obsolete %' AS obsolete_disease_term,
                   superseded AS older_curations_superseded, report_url
            FROM cur ORDER BY below_threshold DESC, gene_symbol, disease_label) TO '{{ outputFiles.menu_csv }}' (HEADER, DELIMITER ',');

      SELECT
        (SELECT file_created FROM banner) AS file_created,
        (SELECT count(*) FROM curations) AS clingen_curations,
        (SELECT count(*) FROM prev_doc) = 0 AS is_baseline,
        (SELECT count(*) FROM menu) AS menu_genes,
        (SELECT count(*) FROM menu WHERE symbol NOT IN (SELECT symbol FROM prev_menu)) AS genes_added,
        (SELECT coalesce(string_agg(symbol, ', ' ORDER BY symbol), 'none') FROM menu WHERE symbol NOT IN (SELECT watched_as FROM watched)) AS uncurated_genes,
        (SELECT count(*) FROM cur) AS menu_curations,
        (SELECT count(*) FROM cur WHERE class_rank(classification) < class_rank(:min_class)) AS below_threshold,
        (SELECT coalesce(string_agg(gene_symbol || ' ' || disease_label || ' ' || moi || ' (' || classification || ')', '; ' ORDER BY class_rank(classification), gene_symbol), 'none')
           FROM cur WHERE class_rank(classification) <= 1 OR disease_label LIKE 'obsolete %') AS disputed_refuted_or_obsolete,
        (SELECT count(*) FROM changes) AS changes,
        (SELECT coalesce(string_agg(change_type || ' ' || n, ', ' ORDER BY change_type), 'none') FROM (SELECT change_type, count(*) AS n FROM changes GROUP BY 1)) AS changes_by_type,
        (SELECT count(*) FROM changes WHERE alert) AS alerts,
        (SELECT coalesce(string_agg('- ' || change_type || CASE WHEN crossed_threshold THEN ' below threshold' ELSE '' END || ' | ' || gene_symbol || ' | ' || disease_label || ' ' || moi
              || ' | ' || coalesce(previous_classification, 'none') || ' -> ' || coalesce(classification, 'withdrawn') || CASE WHEN note <> '' THEN ' | ' || note ELSE '' END
              || ' | ' || report_url, chr(10) ORDER BY gene_symbol, disease_label), '')
           FROM (SELECT * FROM changes WHERE alert ORDER BY gene_symbol, disease_label LIMIT 25)) AS alert_lines,
        (SELECT CAST(json_object('file_created', (SELECT file_created FROM banner),
            'menu', (SELECT to_json(list(symbol ORDER BY symbol)) FROM menu),
            'curations', (SELECT coalesce(json_group_array(json_object('watched_as', watched_as, 'hgnc_id', hgnc_id, 'gene_symbol', gene_symbol,
               'disease_label', disease_label, 'mondo_id', mondo_id, 'moi', moi, 'classification', classification,
               'classification_date', classification_date, 'gcep', gcep, 'report_url', report_url)), CAST('[]' AS JSON)) FROM cur)) AS VARCHAR)) AS snapshot;

  - id: summary
    type: io.kestra.plugin.core.log.Log
    message: |
      ClinGen file {{ outputs.diff.outputs[0].row.file_created }}: {{ outputs.diff.outputs[0].row.clingen_curations }} curations.
      Menu: {{ outputs.diff.outputs[0].row.menu_genes }} genes, {{ outputs.diff.outputs[0].row.menu_curations }} effective curations, {{ outputs.diff.outputs[0].row.below_threshold }} below {{ inputs.min_classification }}. No ClinGen curation: {{ outputs.diff.outputs[0].row.uncurated_genes }}.
      Disputed, refuted or obsolete disease term: {{ outputs.diff.outputs[0].row.disputed_refuted_or_obsolete }}.
      {% if outputs.diff.outputs[0].row.is_baseline %}BASELINE run, snapshot created, no changes reported.{% else %}Changes since last run: {{ outputs.diff.outputs[0].row.changes_by_type }} ({{ outputs.diff.outputs[0].row.genes_added }} genes newly added to the menu were baselined).{% endif %}

  - id: route
    type: io.kestra.plugin.core.flow.If
    description: Slack only for downgrades and for withdrawn curations that were not replaced by an equal or stronger curation of the same gene and MOI (a disease relabel or split). Upgrades, new and re-curated assertions stay in the changes CSV.
    condition: "{{ outputs.diff.outputs[0].row.alerts > 0 }}"
    then:
      - id: slack_alert
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Fails softly when SLACK_WEBHOOK_URL is not configured, so the snapshot is still saved and the CSV output is the record.
        allowFailure: true
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        messageText: |
          :warning: ClinGen gene-disease validity changes on the test menu ({{ outputs.diff.outputs[0].row.alerts }} to review, file {{ outputs.diff.outputs[0].row.file_created }})
          {{ outputs.diff.outputs[0].row.alert_lines }}
          Execution {{ kestra.url ?? '' }}/ui/main/executions/{{ flow.namespace }}/{{ flow.id }}/{{ execution.id }}
    else:
      - id: no_alerts
        type: io.kestra.plugin.core.log.Log
        message: No downgraded or withdrawn curations on the test menu.

  - id: save_snapshot
    type: io.kestra.plugin.core.kv.Set
    description: Written last, so a failed download, parse or diff keeps the previous snapshot and the same changes are found again next run.
    key: "{{ inputs.state_key }}"
    kvType: STRING
    value: "{{ outputs.diff.outputs[0].row.snapshot }}"

errors:
  - id: log_failure
    type: io.kestra.plugin.core.log.Log
    level: ERROR
    message: "ClinGen validity watch failed in task {{ errorLogs()[0]['taskId'] ?? 'unknown' }}. The snapshot was not updated, so the next successful run reports the same changes. Do not read the missing alert as a clean result."

outputs:
  - id: summary
    type: JSON
    value:
      file_created: "{{ outputs.diff.outputs[0].row.file_created }}"
      baseline: "{{ outputs.diff.outputs[0].row.is_baseline }}"
      menu_curations: "{{ outputs.diff.outputs[0].row.menu_curations }}"
      below_threshold: "{{ outputs.diff.outputs[0].row.below_threshold }}"
      changes: "{{ outputs.diff.outputs[0].row.changes_by_type }}"
      alerts: "{{ outputs.diff.outputs[0].row.alerts }}"
  - id: changes_csv
    type: FILE
    value: "{{ outputs.diff.outputFiles.changes_csv }}"
  - id: menu_csv
    type: FILE
    value: "{{ outputs.diff.outputFiles.menu_csv }}"

extend:
  title: ClinGen Gene-Disease Validity Reclassification Watch for a Test Menu
  metaTitle: ClinGen Gene-Disease Validity Reclassification Watch | Kestra
  shortDescription: Diff the ClinGen gene-disease validity curations of the genes on your test menu every week and alert Slack when a gene-disease pair is downgraded, disputed, refuted or withdrawn.
  metaDescription: Weekly ClinGen gene-disease validity diff for a lab test menu in DuckDB with KV state. Slack alerts on downgrades and withdrawn curations.
  description: |
    A gene belongs on a diagnostic panel only while its gene-disease relationship is well supported. ClinGen
    expert panels classify that validity (Definitive to Refuted) and re-curate it as evidence changes. This flow
    diffs the ClinGen curations of the genes on your test menu every week. It works at gene-disease level, not
    on variants or panels.

    ## How it works

    1. A weekly **Schedule** trigger (Monday 06:00 UTC) starts the run.
    2. `read_snapshot` loads the previous snapshot from the KV store. Without one the run is a **baseline**: it
       stores the snapshot and reports nothing as changed.
    3. `download` fetches `https://search.clinicalgenome.org/kb/gene-validity/download`, the complete CSV (about
       3,700 curations, 1.1 MB) in one request, with retries on 429 and 5xx.
    4. `diff` (DuckDB) skips the banner and `+++` separator rows, refuses a file with fewer than 1,000 curations
       or an unknown classification, and keeps the latest curation per gene, MONDO disease and mode of
       inheritance. That matters because a pair can be listed twice when a newer expert panel re-curates it:
       FOXE3 and thoracic aortic aneurysm appear as Moderate (2016) and Limited (2026), and Limited applies.
    5. Menu genes are matched by symbol and tracked by HGNC ID, so a symbol rename is not reported as a
       withdrawal. Changes are `DOWNGRADE`, `UPGRADE`, `NEW`, `REMOVED` and `RECURATED` (same class, newer date).
       A removed curation that comes with a new one for the same gene and MOI is annotated as a likely disease
       relabel or split. Genes newly added to the menu are baselined, not reported as new.
    6. An **If** task sends one Slack message for downgrades and for removals that were not replaced by an equal
       or stronger curation. `save_snapshot` runs last, so a failed run never advances the state.

    ## What you get

    - `changes_csv`: every change with old and new classification, dates, expert panel and report link.
    - `menu_csv`: current curations of the menu, flagged when below `min_classification`, when the disease
      label is an obsolete MONDO term (TTR today) or when older curations were superseded.
    - A log summary of uncurated menu genes and all Disputed or Refuted pairs.

    ## Who it's for

    - Clinical laboratory directors and test-menu owners, variant scientists and genetic counsellors.

    ## Why orchestrate this with Kestra

    - Schedule, retries, KV state and outputs in one YAML file instead of a cron script and a spreadsheet.
    - Every run keeps its CSVs, which gives an audit trail for menu reviews.

    ## Prerequisites

    - Outbound HTTPS to search.clinicalgenome.org. No API key is needed.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack incoming webhook for alerts (optional; without it the Slack task fails softly,
      the run ends in WARNING and the snapshot is still saved).

    ## Quick start

    1. Optionally add the `SLACK_WEBHOOK_URL` secret.
    2. Put your panel genes in `test_menu_genes` and choose `min_classification` (default Moderate).
    3. Execute once for the baseline and read `menu_csv`; the defaults already show MYOZ2, MUTYH and CHEK2
       pairs that ClinGen disputes or refutes.
    4. Keep the weekly trigger enabled; use one `state_key` per test menu.

    ## How to extend

    - Open a ticket per downgrade, or join `menu_csv` with panel definitions to list affected tests.

    ## Links

    - [ClinGen Gene-Disease Validity](https://search.clinicalgenome.org/kb/gene-validity)
    - [ClinGen classification framework](https://clinicalgenome.org/curation-activities/gene-disease-validity/)
    - [DuckDB Queries task](https://kestra.io/plugins/plugin-jdbc-duckdb/io.kestra.plugin.jdbc.duckdb.queries)
    - [Slack Incoming Webhook task](https://kestra.io/plugins/plugin-slack/io.kestra.plugin.slack.notifications.slackincomingwebhook)
    - [KV store](https://kestra.io/docs/concepts/kv-store)
  tags:
    - Data
  subTags:
    - Monitoring & Alerting
    - Testing & Quality
  ee: false
  demo: false
