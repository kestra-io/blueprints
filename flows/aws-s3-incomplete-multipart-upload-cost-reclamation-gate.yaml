id: aws-s3-incomplete-multipart-upload-cost-reclamation-gate
namespace: company.cloud

description: |
  Audit Amazon S3 buckets for abandoned and incomplete multipart uploads, calculate
  wasted storage bytes and recurring monthly cost, pause for operator approval, safely
  abort stale uploads, and notify Slack.

inputs:
  - id: bucket_name
    type: STRING
    displayName: Target S3 Bucket
    description: Amazon S3 bucket name to audit for abandoned and incomplete multipart uploads.

  - id: aws_region
    type: STRING
    defaults: "us-east-1"
    displayName: AWS Region
    description: AWS region where the target Amazon S3 bucket is hosted.

  - id: older_than_days
    type: INT
    defaults: 7
    displayName: Age Cutoff Threshold (Days)
    description: Minimum age in days since multipart upload initiation before an upload is classified as abandoned.

  - id: max_aborts_per_run
    type: INT
    defaults: 50
    displayName: Maximum Aborts Per Run
    description: Safety limit on the maximum number of orphaned multipart uploads to abort in a single execution.

  - id: dry_run
    type: BOOL
    defaults: true
    displayName: Dry Run Mode
    description: When true, only inspects and reports abandoned multipart uploads without aborting anything.

  - id: storage_cost_per_gb_month
    type: FLOAT
    defaults: 0.023
    displayName: Storage Cost (USD/GB/Month)
    description: Standard S3 storage cost per gigabyte per month used to estimate recurring monthly financial waste.

triggers:
  - id: weekly_cost_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 9 * * 1"
    disabled: true
    description: Scheduled weekly cost reclamation scan every Monday at 09:00 UTC.

tasks:
  - id: validate_inputs
    type: io.kestra.plugin.core.execution.Assert
    description: Asserts that retention age and abort limit are strictly positive numbers.
    asserts:
      - condition: "{{ inputs.older_than_days > 0 }}"
        message: "older_than_days must be strictly positive."
      - condition: "{{ inputs.max_aborts_per_run > 0 }}"
        message: "max_aborts_per_run must be strictly positive."

  - id: audit_orphaned_multipart_uploads
    type: io.kestra.plugin.scripts.python.Script
    description: Discovers abandoned multipart uploads, tallies wasted part sizes, and calculates cost waste.
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install boto3 kestra
    env:
      AWS_REGION: "{{ inputs.aws_region }}"
      AWS_ACCESS_KEY_ID: "{{ secret('AWS_ACCESS_KEY_ID') }}"
      AWS_SECRET_ACCESS_KEY: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
      BUCKET_NAME: "{{ inputs.bucket_name }}"
      OLDER_THAN_DAYS: "{{ inputs.older_than_days }}"
      MAX_ABORTS: "{{ inputs.max_aborts_per_run }}"
      COST_PER_GB: "{{ inputs.storage_cost_per_gb_month }}"
    script: |
      import os
      import sys
      from datetime import datetime, timezone, timedelta
      import boto3
      from botocore.exceptions import ClientError
      from kestra import Kestra

      bucket_name = os.environ["BUCKET_NAME"]
      region = os.environ["AWS_REGION"]
      older_than_days = int(os.environ["OLDER_THAN_DAYS"])
      max_aborts = int(os.environ["MAX_ABORTS"])
      cost_per_gb = float(os.environ["COST_PER_GB"])

      s3 = boto3.client("s3", region_name=region)
      cutoff_date = datetime.now(timezone.utc) - timedelta(days=older_than_days)

      print(f"Auditing S3 bucket '{bucket_name}' for uploads initiated prior to {cutoff_date.isoformat()}...")

      orphaned_uploads = []
      total_wasted_bytes = 0

      paginator = s3.get_paginator("list_multipart_uploads")
      try:
          page_iterator = paginator.paginate(Bucket=bucket_name)
          for page in page_iterator:
              uploads = page.get("Uploads", [])
              for u in uploads:
                  initiated = u.get("Initiated")
                  if initiated and initiated < cutoff_date:
                      key = u.get("Key")
                      upload_id = u.get("UploadId")
                      
                      # Tally parts size for this upload
                      upload_bytes = 0
                      part_count = 0
                      try:
                          parts_page = s3.get_paginator("list_parts").paginate(Bucket=bucket_name, Key=key, UploadId=upload_id)
                          for p_page in parts_page:
                              for part in p_page.get("Parts", []):
                                  upload_bytes += part.get("Size", 0)
                                  part_count += 1
                      except ClientError as pe:
                          print(f"Warning: could not inspect parts for upload {upload_id}: {pe}")

                      age_days = (datetime.now(timezone.utc) - initiated).days
                      total_wasted_bytes += upload_bytes

                      orphaned_uploads.append({
                          "key": key,
                          "upload_id": upload_id,
                          "initiated": initiated.isoformat(),
                          "age_days": age_days,
                          "part_count": part_count,
                          "bytes": upload_bytes,
                          "size_mb": round(upload_bytes / (1024 * 1024), 2)
                      })

                      if len(orphaned_uploads) >= max_aborts:
                          print(f"Reached safety cap of {max_aborts} candidate uploads.")
                          break
              if len(orphaned_uploads) >= max_aborts:
                  break
      except ClientError as e:
          print(f"Fatal error querying S3 bucket '{bucket_name}': {e}", file=sys.stderr)
          sys.exit(1)

      total_wasted_gb = round(total_wasted_bytes / (1024 * 1024 * 1024), 4)
      estimated_monthly_cost = round(total_wasted_gb * cost_per_gb, 2)

      print(f"Scan complete: Found {len(orphaned_uploads)} orphaned uploads.")
      print(f"Total wasted storage: {total_wasted_gb} GB (~${estimated_monthly_cost}/month)")

      Kestra.outputs({
          "orphaned_count": len(orphaned_uploads),
          "orphaned_uploads": orphaned_uploads,
          "total_wasted_bytes": total_wasted_bytes,
          "total_wasted_gb": total_wasted_gb,
          "estimated_monthly_cost_usd": estimated_monthly_cost
      })

  - id: branch_on_orphaned_uploads
    type: io.kestra.plugin.core.flow.If
    description: Branch based on whether any abandoned multipart uploads were detected.
    condition: "{{ outputs.audit_orphaned_multipart_uploads.vars.orphaned_count > 0 }}"
    then:
      - id: persist_waste_telemetry
        type: io.kestra.plugin.core.kv.Set
        description: Store scan findings in Kestra KV store for historical FinOps auditing.
        key: "s3_multipart_cost_waste_last_scan"
        value: "{{ outputs.audit_orphaned_multipart_uploads.vars }}"

      - id: evaluate_remediation_mode
        type: io.kestra.plugin.core.flow.If
        description: Execute reclamation when dry run is disabled, otherwise log dry run notice.
        condition: "{{ inputs.dry_run == false }}"
        then:
          - id: pause_for_operator_approval
            type: io.kestra.plugin.core.flow.Pause
            description: Interactive human approval gate before aborting orphaned multipart uploads. Resume to abort uploads or cancel to preserve state.

          - id: abort_orphaned_uploads
            type: io.kestra.plugin.scripts.python.Script
            description: Safely aborts approved orphaned multipart uploads via S3 API and verifies reclamation.
            containerImage: python:3.11-slim
            beforeCommands:
              - pip install boto3 kestra
            env:
              AWS_REGION: "{{ inputs.aws_region }}"
              AWS_ACCESS_KEY_ID: "{{ secret('AWS_ACCESS_KEY_ID') }}"
              AWS_SECRET_ACCESS_KEY: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
              BUCKET_NAME: "{{ inputs.bucket_name }}"
              UPLOADS_JSON: "{{ outputs.audit_orphaned_multipart_uploads.vars.orphaned_uploads | json }}"
            script: |
              import os
              import sys
              import json
              import boto3
              from botocore.exceptions import ClientError
              from kestra import Kestra

              bucket_name = os.environ["BUCKET_NAME"]
              region = os.environ["AWS_REGION"]
              uploads = json.loads(os.environ["UPLOADS_JSON"])

              s3 = boto3.client("s3", region_name=region)
              aborted_count = 0
              reclaimed_bytes = 0
              failed_aborts = []

              for item in uploads:
                  key = item["key"]
                  upload_id = item["upload_id"]
                  item_bytes = item.get("bytes", 0)
                  try:
                      print(f"Aborting orphaned upload '{upload_id}' for key '{key}'...")
                      s3.abort_multipart_upload(Bucket=bucket_name, Key=key, UploadId=upload_id)
                      aborted_count += 1
                      reclaimed_bytes += item_bytes
                  except ClientError as e:
                      print(f"Failed to abort upload '{upload_id}': {e}", file=sys.stderr)
                      failed_aborts.append({"key": key, "upload_id": upload_id, "error": str(e)})

              reclaimed_gb = round(reclaimed_bytes / (1024 * 1024 * 1024), 4)
              print(f"Reclamation complete: Successfully aborted {aborted_count}/{len(uploads)} uploads.")
              print(f"Reclaimed {reclaimed_gb} GB.")

              if failed_aborts:
                  print(f"Encountered {len(failed_aborts)} errors during abort operations.", file=sys.stderr)

              Kestra.outputs({
                  "aborted_count": aborted_count,
                  "reclaimed_bytes": reclaimed_bytes,
                  "reclaimed_gb": reclaimed_gb,
                  "failed_count": len(failed_aborts)
              })

          - id: notify_slack_remediation_success
            type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
            description: Dispatches Slack confirmation detailing reclaimed storage and completed aborts.
            url: "{{ secret('SLACK_WEBHOOK_URL') }}"
            payload: |
              {
                "channel": "#finops-alerts",
                "text": ":white_check_mark: *AWS S3 Multipart Upload Cost Reclamation Complete*\nSuccessfully aborted {{ outputs.abort_orphaned_uploads.vars.aborted_count }} abandoned uploads in bucket `{{ inputs.bucket_name }}`.\n*Reclaimed Storage:* {{ outputs.abort_orphaned_uploads.vars.reclaimed_gb }} GB\n*Estimated Monthly Savings:* ${{ outputs.audit_orphaned_multipart_uploads.vars.estimated_monthly_cost_usd }}"
              }

        else:
          - id: log_dry_run_findings
            type: io.kestra.plugin.core.log.Log
            description: Logs detailed dry run summary when remediation is not armed.
            message: "DRY RUN COMPLETE: Found {{ outputs.audit_orphaned_multipart_uploads.vars.orphaned_count }} abandoned multipart uploads in bucket '{{ inputs.bucket_name }}' totaling {{ outputs.audit_orphaned_multipart_uploads.vars.total_wasted_gb }} GB (~${{ outputs.audit_orphaned_multipart_uploads.vars.estimated_monthly_cost_usd }}/month). Set dry_run to false to execute reclamation after approval."

          - id: notify_slack_dry_run_report
            type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
            description: Sends Slack cost alert alerting engineers of uncompleted multipart waste.
            url: "{{ secret('SLACK_WEBHOOK_URL') }}"
            payload: |
              {
                "channel": "#finops-alerts",
                "text": ":warning: *AWS S3 Abandoned Multipart Uploads Detected (Dry Run)*\nBucket `{{ inputs.bucket_name }}` contains {{ outputs.audit_orphaned_multipart_uploads.vars.orphaned_count }} stale multipart uploads older than {{ inputs.older_than_days }} days.\n*Wasted Storage:* {{ outputs.audit_orphaned_multipart_uploads.vars.total_wasted_gb }} GB\n*Potential Monthly Savings:* ${{ outputs.audit_orphaned_multipart_uploads.vars.estimated_monthly_cost_usd }}\nSet `dry_run: false` to reclaim storage via operator approval."
              }

    else:
      - id: log_clean_bucket
        type: io.kestra.plugin.core.log.Log
        description: Confirms that no stale multipart uploads were discovered.
        message: "S3 bucket '{{ inputs.bucket_name }}' is clean. No abandoned multipart uploads older than {{ inputs.older_than_days }} days were found."

extend:
  title: AWS S3 Incomplete Multipart Upload Cost Reclamation Gate
  metaTitle: AWS S3 Incomplete Multipart Upload Cost Reclamation Gate | Kestra
  shortDescription: Audit Amazon S3 buckets for abandoned multipart uploads, calculate storage cost waste, pause for operator approval, abort stale uploads, and notify Slack.
  metaDescription: Audit Amazon S3 buckets for abandoned multipart uploads, calculate cost waste, pause for approval, abort stale parts, and notify Slack.
  description: |
    Automated FinOps governance workflow that detects abandoned and incomplete Amazon S3
    multipart uploads, calculates accumulated storage bytes and monthly recurring costs,
    pauses for operator approval, safely aborts stale uploads, and notifies Slack.

    ## How it works

    1. The `validate_inputs` task (`io.kestra.plugin.core.execution.Assert`) verifies that age cutoff and abort limits are strictly positive values.
    2. The `audit_orphaned_multipart_uploads` task (`io.kestra.plugin.scripts.python.Script`) uses the AWS SDK to paginate through active multipart uploads in the target bucket, filters for uploads initiated before the cutoff date, and inspects parts to tally exact wasted bytes and recurring monthly financial cost.
    3. The `branch_on_orphaned_uploads` task (`io.kestra.plugin.core.flow.If`) checks whether any candidate uploads were detected. If none exist, the flow logs a confirmation and completes.
    4. When abandoned uploads are found, `persist_waste_telemetry` (`io.kestra.plugin.core.kv.Set`) stores audit findings in the Kestra KV store for historical compliance tracking.
    5. The `evaluate_remediation_mode` task (`io.kestra.plugin.core.flow.If`) checks the `dry_run` input:
       - If `dry_run` is true, the flow outputs the candidate list to execution logs and sends a dry-run summary alert to Slack.
       - If `dry_run` is false, the interactive `pause_for_operator_approval` task (`io.kestra.plugin.core.flow.Pause`) halts execution, allowing platform engineers to inspect detected keys and bytes before confirming the deletion.
       - Upon operator approval, `abort_orphaned_uploads` (`io.kestra.plugin.scripts.python.Script`) executes `AbortMultipartUpload` against each confirmed upload, tracks reclaimed storage, and reports errors.
       - The `notify_slack_remediation_success` task (`io.kestra.plugin.notifications.slack.SlackIncomingWebhook`) dispatches a completion alert to Slack detailing total reclaimed gigabytes.

    ## What you get

    - Automated discovery and categorization of abandoned S3 multipart uploads that standard object listings conceal.
    - Precise financial reporting calculating monthly recurring storage costs based on actual part sizes.
    - Interactive human-in-the-loop approval gate before executing any destructive abort operations.
    - Controlled batch remediation with safety thresholds preventing API rate limiting or accidental mass deletion.
    - Historical telemetry records stored in Kestra KV store for FinOps auditing and executive summaries.
    - Context-rich Slack notifications alerting cloud platform teams straight to storage waste.

    ## Who it's for

    - Cloud Platform Engineers and FinOps Practitioners seeking automated storage waste remediation.
    - Data Engineers running distributed Spark, Presto, or Athena pipelines that occasionally leave uncompleted staging writes.
    - Site Reliability Engineers ensuring compliance with organizational storage retention policies.

    ## Why orchestrate this with Kestra

    - Declarative YAML definition version-controlled in Git, eliminating brittle cron jobs and unmonitored bash scripts.
    - Built-in interactive Pause tasks enabling safe human-in-the-loop approvals without managing external callback endpoints.
    - Integrated secret management keeping AWS credentials secure and masked across execution logs.
    - Native KV storage enabling multi-run tracking of storage savings over time.

    ## Prerequisites

    - An AWS IAM user or role with `s3:ListBucketMultipartUploads`, `s3:ListMultipartUploadParts`, and `s3:AbortMultipartUpload` permissions on target buckets.
    - Container runner configured on the Kestra worker to execute the Python script tasks.

    ### Secrets

    - `AWS_ACCESS_KEY_ID`: AWS IAM access key ID with S3 permissions.
    - `AWS_SECRET_ACCESS_KEY`: AWS IAM secret access key.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL for operational alerting.

    ## Quick start

    1. Configure `AWS_ACCESS_KEY_ID`, `AWS_SECRET_ACCESS_KEY`, and `SLACK_WEBHOOK_URL` in your Kestra namespace secrets.
    2. Import this blueprint into your Kestra instance.
    3. Execute the flow with default inputs (`dry_run: true`) to audit your target S3 bucket safely.
    4. Review execution outputs and Slack notifications for detected storage waste.
    5. Re-run with `dry_run: false` to prompt the operator approval gate and abort abandoned uploads.
    6. Enable the `weekly_cost_audit` schedule trigger to automate recurring scans.

    ## How to extend

    - Add multi-bucket loop iteration to scan an entire AWS organization or data lake in a single pipeline execution.
    - Integrate with Datadog or Prometheus metrics to graph cumulative dollar savings on cloud engineering dashboards.
    - Add AWS S3 Lifecycle Rule creation tasks to automatically configure abort rules on buckets with chronic upload abandonment.

    ## Links

    - [Kestra Pause Task Documentation](https://kestra.io/plugins/core/flow/pause)
    - [Kestra Python Script Documentation](https://kestra.io/plugins/scripts/python/script)
    - [AWS S3 AbortMultipartUpload API Reference](https://docs.aws.amazon.com/AmazonS3/latest/API/API_AbortMultipartUpload.html)
