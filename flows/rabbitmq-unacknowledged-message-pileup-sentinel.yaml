id: rabbitmq-unacknowledged-message-pileup-sentinel
namespace: company.team

inputs:
  - id: rabbitmq_host
    type: STRING
    defaults: "rabbitmq.internal"
    description: Hostname of the RabbitMQ server.
  - id: rabbitmq_port
    type: INT
    defaults: 15672
    description: Port of the RabbitMQ Management HTTP API.
  - id: queue_name
    type: STRING
    description: Target RabbitMQ queue name to audit.
  - id: max_unacked_messages
    type: INT
    defaults: 1000
    description: "Maximum allowable unacknowledged in-flight messages before alerting (default 1000)."

tasks:
  - id: inspect_queue_status
    type: io.kestra.plugin.scripts.python.Script
    description: Scrapes RabbitMQ management HTTP API to inspect real-time unacknowledged in-flight and ready message counts.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests kestra
    script: |
      import os
      import sys
      import requests
      from kestra import Kestra

      host = "{{ inputs.rabbitmq_host }}"
      port = int("{{ inputs.rabbitmq_port }}")
      queue = "{{ inputs.queue_name }}"
      max_unacked = int("{{ inputs.max_unacked_messages }}")
      user = "{{ secret('RABBITMQ_USER') }}"
      password = "{{ secret('RABBITMQ_PASSWORD') }}"

      url = f"http://{host}:{port}/api/queues/%2F/{queue}"
      try:
          resp = requests.get(url, auth=(user, password), timeout=12)
          resp.raise_for_status()
          data = resp.json()
      except Exception as err:
          print(f"Error querying RabbitMQ management API: {err}", file=sys.stderr)
          sys.exit(1)

      unacked = int(data.get("messages_unacknowledged", 0))
      ready = int(data.get("messages_ready", 0))
      is_breach = bool(unacked > max_unacked)

      print(f"Queue '{queue}': unacked={unacked} (limit={max_unacked}), ready={ready}, breach={is_breach}")

      Kestra.outputs({
          "is_breach": is_breach,
          "unacked_count": unacked,
          "ready_count": ready
      })

  - id: evaluate_consumer_deadlock
    type: io.kestra.plugin.core.flow.If
    description: Verifies whether unacknowledged in-flight messages exceed tolerance threshold.
    condition: "{{ outputs.inspect_queue_status.vars.is_breach }}"
    then:
      - id: notify_streaming_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches critical alert to streaming operations Slack channel.
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#streaming-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 RabbitMQ Unacknowledged Message Pileup Alert",
                "text": "Queue `{{ inputs.queue_name }}` has *{{ outputs.inspect_queue_status.vars.unacked_count }}* unacknowledged in-flight messages (threshold `{{ inputs.max_unacked_messages }}`). Ready Messages: *{{ outputs.inspect_queue_status.vars.ready_count }}*. Worker instances may be deadlocked or hanging without acknowledging jobs.",
                "footer": "Kestra Messaging Sentinel • RabbitMQ"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#streaming-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ RabbitMQ Sentinel Failure",
            "text": "Failed to communicate with RabbitMQ management API on {{ inputs.rabbitmq_host }}.",
            "footer": "Kestra Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  metaDescription: "Audits RabbitMQ queues for unacknowledged message accumulation to detect consumer worker hangs."
  metaTitle: RabbitMQ Unacknowledged In-Flight Message Pileup Sentinel with Kestra
  ee: false
  demo: false
  title: RabbitMQ Unacknowledged In-Flight Message Pileup Sentinel
  shortDescription: Audits RabbitMQ queues for unacknowledged message accumulation to detect consumer worker hangs.
  description: |
    ## How it works
    This workflow connects to the RabbitMQ Management HTTP API (`/api/queues/{vhost}/{name}`) to inspect real-time queue message counters. In AMQP architectures, consumers pull messages and maintain in-flight locks until explicit acknowledgments (`basic.ack`) are sent. When worker microservices encounter unhandled exceptions, deadlock on downstream resources, or crash without closing TCP channels, messages accumulate in the `unacknowledged` state. Once prefetch limits are saturated, RabbitMQ halts message delivery entirely. This sentinel tracks unacknowledged metrics and dispatches alerts before queue consumers freeze.

    ## What you get
    - Real-time detection of hanging consumer processes and unacknowledged message surges.
    - Protection against queue dispatch stalls and worker starvation.
    - Automated Slack incident notifications with unacknowledged and ready message counts.

    ## Who it's for
    - Message Queue Administrators and SREs maintaining RabbitMQ clusters.
    - Backend Engineers building asynchronous job processing systems.
    - Platform Operations teams supporting microservice event brokers.

    ## Why orchestrate this with Kestra
    - **Scheduled Telemetry Surveillance**: Routinely monitors queue health without external monitoring agents.
    - **Encrypted Credential Protection**: Secures RabbitMQ management credentials inside Kestra secrets.
    - **Automated Incident Remediation**: Can trigger container restarts or purge dead-letter queues automatically.

    ## Prerequisites
    - RabbitMQ broker with enabled Management Plugin (`15672`).
    - Management credentials stored in `RABBITMQ_USER` and `RABBITMQ_PASSWORD` secrets.
    - Slack incoming webhook URL configured in `SLACK_WEBHOOK` secret.

    ## Quick start
    1. Import this blueprint into your Kestra instance.
    2. Add `RABBITMQ_USER`, `RABBITMQ_PASSWORD`, and `SLACK_WEBHOOK` secrets.
    3. Specify `rabbitmq_host`, `rabbitmq_port`, and `queue_name`.
    4. Enable the schedule trigger for continuous queue surveillance.

    ## How to extend
    - Inspect consumer channel counts and prefetch limits via `/api/channels`.
    - Trigger consumer pod rolling restarts via Kubernetes API upon prolonged unacked stalls.
    - Route critical alerts to PagerDuty or Opsgenie.

    ## Links
    - [RabbitMQ Management HTTP API](https://www.rabbitmq.com/docs/management)
    - [Kestra Shell Plugin](https://kestra.io/plugins/plugin-scripts-shell)
    - [Kestra Slack Notifications](https://kestra.io/plugins/plugin-slack)
  tags:
    - Data
    - Infrastructure
  subTags:
    - ELT & Data Landing
    - Day 2 Operations
