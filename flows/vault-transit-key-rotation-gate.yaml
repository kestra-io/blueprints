id: vault-transit-key-rotation-gate
namespace: company.security

description: |
  Audit HashiCorp Vault Transit Secrets Engine cryptographic keys on a recurring
  schedule to detect overdue key rotation, enforce maximum version age policies,
  and dispatch automated Slack alerts before compliance certification breaches occur.

inputs:
  - id: vault_addr
    type: STRING
    defaults: "http://localhost:8200"
    displayName: "Vault Server Address"
    description: "Base HTTP or HTTPS endpoint URL of the target HashiCorp Vault cluster."

  - id: key_name
    type: STRING
    defaults: "payment-encryption-key"
    displayName: "Transit Key Name"
    description: "Name of the cryptographic key in Vault Transit engine to audit for rotation staleness."

  - id: transit_mount
    type: STRING
    defaults: "transit"
    displayName: "Transit Engine Mount Path"
    description: "Mount path of the Vault Transit Secrets Engine (default: transit)."

  - id: max_key_age_days
    type: INT
    defaults: 90
    displayName: "Maximum Key Age (Days)"
    description: "Maximum allowable age in days for the latest key version before triggering rotation alerts."

  - id: auto_rotate
    type: SELECT
    values:
      - "true"
      - "false"
    defaults: "false"
    displayName: "Auto-Rotate Toggle"
    description: "When true and dry_run is false, automatically invokes the Transit key rotate endpoint upon SLA breach."

  - id: dry_run
    type: SELECT
    values:
      - "true"
      - "false"
    defaults: "true"
    displayName: "Dry Run Mode"
    description: "When set to true, safe remediation actions only simulate actions without mutating Vault key versions."

triggers:
  - id: schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 */6 * * *"
    disabled: true
    inputs:
      vault_addr: "http://localhost:8200"
      key_name: "payment-encryption-key"
      transit_mount: "transit"
      max_key_age_days: 90
      auto_rotate: "false"
      dry_run: "true"

tasks:
  - id: probe_key_metadata
    type: io.kestra.plugin.core.http.Request
    description: "Query HashiCorp Vault Transit API for key metadata, versions, and rotation timestamps."
    uri: "{{ inputs.vault_addr }}/v1/{{ inputs.transit_mount }}/keys/{{ inputs.key_name }}"
    method: GET
    headers:
      X-Vault-Token: "{{ secret('VAULT_TOKEN') }}"
    options:
      allowFailed: true

  - id: evaluate_key_age
    type: io.kestra.plugin.scripts.python.Script
    description: "Calculate current key version age and determine whether rotation SLA has been breached."
    containerImage: python:3.11-slim
    script: |
      import json
      from datetime import datetime, timezone
      from kestra import Kestra

      raw_body = '''{{ outputs.probe_key_metadata.body | default('{}') }}'''
      status_code = {{ outputs.probe_key_metadata.code | default(0) }}
      max_age_days = {{ inputs.max_key_age_days }}

      try:
          data = json.loads(raw_body) if isinstance(raw_body, str) and raw_body.strip().startswith("{") else {}
      except Exception:
          data = {}

      if status_code != 200 or not data.get("data"):
          Kestra.outputs({
              "verdict": "PROBE_FAILED",
              "reason": f"Vault API returned status {status_code}",
              "latest_version": 0,
              "age_days": 0
          })
      else:
          key_data = data.get("data", {})
          latest_version = key_data.get("latest_version", 1)
          keys_dict = key_data.get("keys", {})
          version_info = keys_dict.get(str(latest_version), {})
          creation_time_str = version_info.get("creation_time")

          if creation_time_str:
              try:
                  creation_dt = datetime.fromisoformat(creation_time_str.replace("Z", "+00:00"))
                  now_dt = datetime.now(timezone.utc)
                  age_days = (now_dt - creation_dt).days
              except Exception:
                  age_days = 0
          else:
              age_days = 0

          is_overdue = age_days > max_age_days
          Kestra.outputs({
              "verdict": "ROTATION_OVERDUE" if is_overdue else "COMPLIANT",
              "latest_version": latest_version,
              "age_days": age_days,
              "min_decryption_version": key_data.get("min_decryption_version", 1),
              "key_type": key_data.get("type", "unknown")
          })

  - id: route_by_compliance
    type: io.kestra.plugin.core.flow.Switch
    description: "Route workflow execution based on key rotation compliance verdict."
    value: "{{ outputs.evaluate_key_age.vars.verdict ?? 'PROBE_FAILED' }}"
    cases:
      "COMPLIANT":
        - id: log_compliant_status
          type: io.kestra.plugin.core.log.Log
          message: "Vault Transit key {{ inputs.key_name }} is compliant: version={{ outputs.evaluate_key_age.vars.latest_version }}, age={{ outputs.evaluate_key_age.vars.age_days }} days (SLA: {{ inputs.max_key_age_days }} days)."
      "ROTATION_OVERDUE":
        - id: alert_rotation_overdue
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: "Dispatch urgent Slack alert when cryptographic key exceeds rotation SLA."
          url: "{{ secret('SLACK_WEBHOOK') }}"
          payload: |
            {"text": "Vault Transit Key Rotation Alert: Key {{ inputs.key_name }} (v{{ outputs.evaluate_key_age.vars.latest_version }}) is {{ outputs.evaluate_key_age.vars.age_days }} days old, exceeding SLA limit of {{ inputs.max_key_age_days }} days. AutoRotate: {{ inputs.auto_rotate }}, DryRun: {{ inputs.dry_run }}."}
        - id: evaluate_remediation_gate
          type: io.kestra.plugin.core.flow.If
          description: "Execute key rotation remediation when auto_rotate is enabled and dry_run is disabled."
          condition: "{{ inputs.auto_rotate == 'true' and inputs.dry_run == 'false' }}"
          then:
            - id: rotate_transit_key
              type: io.kestra.plugin.core.http.Request
              description: "Call Vault Transit rotate endpoint to generate a new key version."
              uri: "{{ inputs.vault_addr }}/v1/{{ inputs.transit_mount }}/keys/{{ inputs.key_name }}/rotate"
              method: POST
              headers:
                X-Vault-Token: "{{ secret('VAULT_TOKEN') }}"
            - id: log_rotation_success
              type: io.kestra.plugin.core.log.Log
              message: "Automated rotation completed successfully for Vault Transit key {{ inputs.key_name }}."
          else:
            - id: log_dry_run_remediation
              type: io.kestra.plugin.core.log.Log
              message: "Remediation bypassed: auto_rotate={{ inputs.auto_rotate }}, dry_run={{ inputs.dry_run }}. Manual rotation recommended via: vault write -f {{ inputs.transit_mount }}/keys/{{ inputs.key_name }}/rotate."
      "PROBE_FAILED":
        - id: alert_probe_failed
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: "Dispatch alert to Slack when Vault Transit API is unreachable or returns an error."
          url: "{{ secret('SLACK_WEBHOOK') }}"
          payload: |
            {"text": "Vault Transit Probe Failure: Unable to fetch key metadata for {{ inputs.key_name }} from {{ inputs.vault_addr }}."}

  - id: log_audit_completion
    type: io.kestra.plugin.core.log.Log
    description: "Post-audit summary confirming completion of the Vault Transit key rotation audit cycle."
    message: "Vault Transit key audit cycle complete for {{ inputs.key_name }}. Outcome: {{ outputs.evaluate_key_age.vars.verdict ?? 'UNKNOWN' }}."

errors:
  - id: alert_on_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: "Dispatch urgent Slack notification if flow execution encounters an unexpected error."
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {"text": "Flow execution failed: vault-transit-key-rotation-gate failed during execution {{ execution.id }}."}

extend:
  title: "Audit HashiCorp Vault Transit Key Rotation and Version Staleness"
  metaTitle: "HashiCorp Vault Transit Key Rotation Gate | Kestra"
  shortDescription: "Audit HashiCorp Vault Transit encryption keys for overdue rotation and version staleness with automated Slack alerts."
  metaDescription: "Audit HashiCorp Vault Transit Engine encryption key rotation and version staleness with Kestra. Enforce cryptographic compliance with automated Slack alerts."
  description: |
    In enterprise security architectures utilizing HashiCorp Vault's Transit Secrets Engine for
    cryptography-as-a-service, encryption keys protect sensitive workloads across payment gateways,
    PII databases, and authentication tokens. Industry standards (including PCI-DSS, SOC 2, and HIPAA)
    strictly mandate cryptographic key rotation within defined lifespans (typically 90 days).
    Neglected key rotation elevates blast radiuses in the event of compromised credentials and
    risks immediate compliance certification revocation.

    This blueprint implements an automated Day 2 Operations governance gate that audits HashiCorp
    Vault Transit key metadata on a scheduled cadence. It inspects the creation timestamp of the latest
    key version, evaluates its age against organizational SLA thresholds, alerts security teams
    via Slack upon overdue staleness, and optionally executes an automated key rotation behind an
    explicit dry-run safety gate.

    ## How it works

    1. `schedule` (`io.kestra.plugin.core.trigger.Schedule`) initiates the audit cycle every 6 hours (disabled by default for initial setup).
    2. `probe_key_metadata` (`io.kestra.plugin.core.http.Request`) invokes the Vault Transit API `GET /v1/{mount}/keys/{key_name}` using the configured `VAULT_TOKEN` to retrieve version history, minimum decryption version, and timestamp metadata.
    3. `evaluate_key_age` (`io.kestra.plugin.scripts.python.Script`) parses the JSON response, determines the age of the latest key version in days, and outputs a typed compliance verdict (`COMPLIANT`, `ROTATION_OVERDUE`, or `PROBE_FAILED`).
    4. `route_by_compliance` (`io.kestra.plugin.core.flow.Switch`) branches based on the calculated verdict.
    5. When compliant (`COMPLIANT`), `log_compliant_status` logs verified version and age metrics.
    6. When rotation is overdue (`ROTATION_OVERDUE`), `alert_rotation_overdue` dispatches an operational alert to Slack using `io.kestra.plugin.slack.notifications.SlackIncomingWebhook`. If `auto_rotate` is enabled and `dry_run` is false, `rotate_transit_key` generates a fresh key version automatically.
    7. `log_audit_completion` writes a final audit recap for execution tracking and lineage.
    8. The flow-level `errors` block intercepts unexpected connection failures or authentication errors and alerts Slack.

    ## What you get

    - Automated cryptographic compliance monitoring preventing stale key certification failures.
    - Exact calculation of key version age against customizable organizational SLAs.
    - Optional zero-touch key rotation protected by a dual-safety gate (`auto_rotate` and `dry_run`).
    - Automated Slack incident notifications with key version context and remediation guidance.
    - Flow-level error alerting safeguarding security audit pipeline reliability.

    ## Who it's for

    - Security Engineers and DevSecOps Teams maintaining enterprise HashiCorp Vault clusters.
    - Compliance and Risk Officers responsible for enforcing PCI-DSS and SOC 2 key rotation policies.
    - Platform and Cloud Engineers managing cryptographic infrastructure across microservices.

    ## Why orchestrate this with Kestra

    Tracking Vault key rotation with manual calendar reminders or isolated cron scripts creates
    operational blind spots, lacks audit lineage, and increases the risk of unhandled secret rotation
    failures. Kestra provides a declarative workflow engine with centralized secret management,
    conditional flow branching, execution history, and native Slack alerting without writing or
    maintaining custom monitoring daemons.

    ## Prerequisites

    - A running HashiCorp Vault instance (v1.12+ or Vault Cloud HCP) with the Transit Secrets Engine enabled (`vault secrets enable transit`).
    - An existing Transit encryption key (e.g. `payment-encryption-key`).
    - A Vault token with read and update permissions on the transit key path (`sys/mounts`, `transit/keys/*`).
    - A Slack Incoming Webhook URL configured in Kestra secrets.

    ### Local Container Setup

    To run HashiCorp Vault locally in development mode while avoiding host port 8080 conflicts:

    ```bash
    docker run -d --name vault-dev -p 8200:8200 -e 'VAULT_DEV_ROOT_TOKEN_ID=root' hashicorp/vault:latest
    ```

    Initialize a transit key in the dev container:

    ```bash
    docker exec -it vault-dev vault secrets enable transit
    docker exec -it vault-dev vault write -f transit/keys/payment-encryption-key
    ```

    If Kestra is running inside a Docker network, connect the Vault container to Kestra network:

    ```bash
    docker network ls
    docker network connect YOUR_KESTRA_NETWORK vault-dev
    ```

    ### Secrets

    - `VAULT_TOKEN`: Vault administrative or service token with read permissions on the Transit engine.
    - `SLACK_WEBHOOK`: Incoming Webhook URL for Slack alerting.

    > Note for Kestra Open-Source (OSS): Secrets are provided as base64-encoded environment variables formatted as `SECRET_<NAME>` on the Kestra server or worker environment.

    ### Inputs

    | Name | Type | Default | Allowed Values | Description |
    | :--- | :--- | :--- | :--- | :--- |
    | `vault_addr` | STRING | `"http://localhost:8200"` | HTTP/HTTPS URL | Base endpoint URL of Vault server |
    | `key_name` | STRING | `"payment-encryption-key"` | Valid key name | Target Transit encryption key name |
    | `transit_mount` | STRING | `"transit"` | Valid mount path | Transit Secrets Engine mount path |
    | `max_key_age_days` | INT | `90` | Positive integer | Maximum key version age before alert |
    | `auto_rotate` | SELECT | `"false"` | `"true"`, `"false"` | Automated key rotation toggle |
    | `dry_run` | SELECT | `"true"` | `"true"`, `"false"` | Dry run simulation flag |

    ### Outputs

    - `{{ outputs.evaluate_key_age.vars.verdict }}`: Compliance verdict (`COMPLIANT`, `ROTATION_OVERDUE`, `PROBE_FAILED`).
    - `{{ outputs.evaluate_key_age.vars.latest_version }}`: Current active primary version of the Transit key.
    - `{{ outputs.evaluate_key_age.vars.age_days }}`: Calculated age in days of the latest key version.
    - `{{ outputs.evaluate_key_age.vars.key_type }}`: Cryptographic algorithm and key type (e.g. `aes256-gcm96`).

    ## Quick start

    1. Configure `VAULT_TOKEN` and `SLACK_WEBHOOK` in your Kestra namespace secrets.
    2. Import this blueprint into your Kestra instance.
    3. Run a manual execution with default inputs against your local or development Vault instance.
    4. Confirm execution logs show `COMPLIANT` with the key version and age printed.
    5. Enable the `schedule` trigger to audit key rotation periodically.

    ## How to extend

    - Add automated PagerDuty or Opsgenie escalations when a key exceeds 120 days without rotation.
    - Extend the Python script to audit all Transit keys by querying `LIST /v1/{mount}/keys`.
    - Chain a downstream re-encryption workflow (`POST /v1/{mount}/rewrap/{key_name}`) to update stored ciphertexts after key rotation.

    ## Pitfalls

    - **Token Capabilities**: Ensure the configured `VAULT_TOKEN` policy grants `read` capability on `transit/keys/{key_name}` and `update` on `transit/keys/{key_name}/rotate`.
    - **Port Conflicts**: Ensure Vault port 8200 does not collide with other local development services.
    - **Dry Run Protection**: Automated rotation only executes when both `auto_rotate: "true"` AND `dry_run: "false"` are explicitly supplied.

    ## Links

    - [HashiCorp Vault Transit Secrets Engine Documentation](https://developer.hashicorp.com/vault/docs/secrets/transit)
    - [Vault Transit HTTP API Reference](https://developer.hashicorp.com/vault/api-docs/secret/transit)
    - [Kestra HTTP Request Plugin Documentation](https://kestra.io/plugins/plugin-core/http/io.kestra.plugin.core.http.request)
    - [Kestra Slack Notification Plugin](https://kestra.io/plugins/plugin-slack/notifications/io.kestra.plugin.slack.notifications.slackincomingwebhook)
