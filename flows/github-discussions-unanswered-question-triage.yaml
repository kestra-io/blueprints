id: github-discussions-unanswered-question-triage
namespace: company.devrel

inputs:
  - id: github_owner
    type: STRING
    displayName: GitHub Organization / Owner
    defaults: "kestra-io"
    description: GitHub organization or username owning the repository.

  - id: github_repository
    type: STRING
    displayName: GitHub Repository
    defaults: "kestra"
    description: GitHub repository slug where Discussions are enabled.

  - id: max_unanswered_allowed
    type: INT
    displayName: Maximum Unanswered Tolerance
    defaults: 0
    description: Tolerance threshold for unanswered discussions before triggering a triage digest alert.

  - id: lookback_discussions_count
    type: INT
    displayName: Lookback Discussions Count
    defaults: 25
    description: Number of recent discussions to inspect in the repository.

triggers:
  - id: daily_triage_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    description: Weekday morning schedule at 09:00 UTC to generate a discussion triage digest. Shipped disabled by default.
    cron: "0 9 * * 1-5"
    disabled: true

tasks:
  - id: fetch_recent_discussions
    type: io.kestra.plugin.graphql.Request
    description: Query GitHub GraphQL API for recent discussions including answer status, category, and author.
    uri: "https://api.github.com/graphql"
    headers:
      Authorization: "Bearer {{ secret('GITHUB_TOKEN') }}"
      User-Agent: "Kestra-GitHub-Discussions-Triage/1.0"
    failOnGraphQLErrors: false
    allowFailed: true
    query: |
      query {
        repository(owner: "{{ inputs.github_owner }}", name: "{{ inputs.github_repository }}") {
          discussions(first: {{ inputs.lookback_discussions_count }}, orderBy: {field: CREATED_AT, direction: DESC}) {
            totalCount
            nodes {
              id
              title
              url
              createdAt
              isAnswered
              category {
                name
              }
              author {
                login
              }
            }
          }
        }
      }

  - id: evaluate_unanswered_discussions
    type: io.kestra.plugin.core.flow.If
    description: Check if unanswered discussions count exceeds the tolerance threshold.
    condition: "{{ outputs.fetch_recent_discussions.body is defined and outputs.fetch_recent_discussions.body.repository is defined and outputs.fetch_recent_discussions.body.repository.discussions is defined and (((outputs.fetch_recent_discussions.body.repository.discussions.nodes | jq('[.[] | select(.isAnswered == false)] | length') | first) | int) > inputs.max_unanswered_allowed) }}"
    then:
      - id: alert_unanswered_digest
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Post a morning digest to DevRel and community support channels with links to unanswered discussions.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "💬 *GitHub Discussions Morning Triage: Unanswered Questions* 💬\n\n*Repository:* `{{ inputs.github_owner }}/{{ inputs.github_repository }}`\n*Pending Unanswered Count:* {{ outputs.fetch_recent_discussions.body.repository.discussions.nodes | jq('[.[] | select(.isAnswered == false)] | length') | first }}\n\n*Threads Needing Answers:*\n{{ outputs.fetch_recent_discussions.body.repository.discussions.nodes | jq('[.[] | select(.isAnswered == false) | \"• *[\" + .category.name + \"]* <\" + .url + \"|\" + .title + \"> (by @\" + (.author.login // \"ghost\") + \")\"] | join(\"\\n\")') | first }}\n\n*Execution ID:* {{ execution.id }}\n*Action Required:* Community maintainers please triage and reply to outstanding threads."
          }
    else:
      - id: log_discussions_clean
        type: io.kestra.plugin.core.log.Log
        description: Log clean status when zero unanswered discussions exceed the tolerance threshold.
        message: "HEALTHY: All recent discussions in {{ inputs.github_owner }}/{{ inputs.github_repository }} are answered or within threshold."

  - id: log_triage_summary
    type: io.kestra.plugin.core.log.Log
    description: Record final audit metrics for developer community engagement.
    message: "GitHub discussions audit finished for {{ inputs.github_owner }}/{{ inputs.github_repository }}. Evaluated: {{ outputs.fetch_recent_discussions.body is defined and outputs.fetch_recent_discussions.body.repository is defined and outputs.fetch_recent_discussions.body.repository.discussions is defined ? (outputs.fetch_recent_discussions.body.repository.discussions.nodes | length) : 0 }}, Unanswered: {{ outputs.fetch_recent_discussions.body is defined and outputs.fetch_recent_discussions.body.repository is defined and outputs.fetch_recent_discussions.body.repository.discussions is defined ? (outputs.fetch_recent_discussions.body.repository.discussions.nodes | jq('[.[] | select(.isAnswered == false)] | length') | first) : 0 }}."

errors:
  - id: alert_on_query_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alert DevRel engineering if GitHub GraphQL API query fails or token lacks permissions.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "⚠️ *GitHub Discussions Triage Failed*: Execution `{{ execution.id }}` failed while querying repository `{{ inputs.github_owner }}/{{ inputs.github_repository }}`. Check GITHUB_TOKEN scope and API status."
      }

outputs:
  - id: status
    type: STRING
    value: "{{ outputs.fetch_recent_discussions.body is defined and outputs.fetch_recent_discussions.body.repository is defined and outputs.fetch_recent_discussions.body.repository.discussions is defined and (((outputs.fetch_recent_discussions.body.repository.discussions.nodes | jq('[.[] | select(.isAnswered == false)] | length') | first) | int) > inputs.max_unanswered_allowed) ? 'UNANSWERED_DETECTED' : 'HEALTHY' }}"
  - id: unanswered_count
    type: INT
    value: "{{ outputs.fetch_recent_discussions.body is defined and outputs.fetch_recent_discussions.body.repository is defined and outputs.fetch_recent_discussions.body.repository.discussions is defined ? ((outputs.fetch_recent_discussions.body.repository.discussions.nodes | jq('[.[] | select(.isAnswered == false)] | length') | first) | int) : 0 }}"
  - id: total_evaluated
    type: INT
    value: "{{ outputs.fetch_recent_discussions.body is defined and outputs.fetch_recent_discussions.body.repository is defined and outputs.fetch_recent_discussions.body.repository.discussions is defined ? (outputs.fetch_recent_discussions.body.repository.discussions.nodes | length) : 0 }}"

extend:
  title: GitHub discussions unanswered question daily triage
  metaTitle: GitHub Discussions Unanswered Question Triage | Kestra
  shortDescription: Daily triage workflow that queries GitHub GraphQL API for unanswered community discussions and dispatches a Slack digest with direct discussion links.
  metaDescription: Audit GitHub Discussions via GraphQL API for unanswered questions and send morning Slack digests to maintainers to prevent stale community threads.
  description: |
    Maintain high community responsiveness and prevent open-source or developer support discussions from going unanswered. Active developer communities on GitHub Discussions can quickly build up unanswered technical inquiries, leaving users frustrated and community engagement metrics degraded. This workflow runs on a weekday morning schedule, queries the GitHub GraphQL API for recent discussions, isolates threads in Q&A categories that lack marked answers, and delivers a formatted Slack digest directly to DevRel and community maintainers with direct discussion links and authors.

    ## How it works
    1. A `Schedule` trigger executes every weekday morning at 09:00 UTC (shipped disabled by default).
    2. Task `fetch_recent_discussions` uses `io.kestra.plugin.graphql.Request` to query the GitHub GraphQL API at `https://api.github.com/graphql` using a personal access token (`GITHUB_TOKEN`). The query fetches recent discussions with metadata including `title`, `url`, `createdAt`, `isAnswered`, `category`, and `author`.
    3. Task `evaluate_unanswered_discussions` (`io.kestra.plugin.core.flow.If`) filters the retrieved discussion nodes using `jq` to isolate discussions where `isAnswered == false`.
       - If unanswered questions exceed the tolerance threshold (`max_unanswered_allowed`), task `alert_unanswered_digest` dispatches a formatted Slack notification with thread links and question titles.
       - If all discussions are answered, task `log_discussions_clean` records a healthy status.
    4. Task `log_triage_summary` logs the total evaluated discussion count and unanswered count for operational metrics.
    5. Top-level `errors` handler alerts DevRel engineering if GitHub API rate limits or authentication failures occur.

    ## What you get
    - Automated morning triage of open GitHub Discussions across core repositories.
    - Zero unanswered questions slipping past developer support SLAs.
    - Clickable Slack digests enabling engineers to jump directly into unanswered threads.
    - Observability and tracking of community discussion health without manual dashboard checking.

    ## Who it's for
    - Developer Relations (DevRel) and Open Source Community Managers.
    - Engineering Leads maintaining popular open-source repositories.
    - Technical Support Engineers monitoring developer question forums.

    ## Why orchestrate this with Kestra
    Manual checking of GitHub Discussions is easily overlooked during busy engineering sprints. With Kestra, community triage becomes a scheduled, automated, and observable process. Kestra handles GitHub GraphQL querying, token secrets, jq list filtering, and multi-channel Slack notifications declaratively in YAML, ensuring community questions are consistently triaged.

    ## Prerequisites
    - A GitHub personal access token (classic or fine-grained) with `read:discussion` or repository read permissions.
    - A Slack Incoming Webhook URL for team triage alerts.

    ### Secrets
    - `GITHUB_TOKEN`: GitHub personal access token passed in the `Authorization: Bearer` header.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL for triage digests.

    ## Quick start
    1. Store your GitHub access token and Slack webhook in Kestra Secrets (`GITHUB_TOKEN` and `SLACK_WEBHOOK_URL`).
    2. Set `github_owner` and `github_repository` inputs to your target repository (e.g. `kestra-io` and `kestra`).
    3. Trigger a manual execution from the Kestra UI to verify that the GraphQL query retrieves discussions.
    4. Enable the `daily_triage_schedule` trigger to begin automated weekday morning triage digests.

    ## How to extend
    - Add automated auto-commenting using a GraphQL mutation to thank users and route inquiries to specific documentation guides.
    - Integrate with PagerDuty or Zendesk to create customer support tickets for unanswered inquiries older than 48 hours.
    - Group discussions by category (e.g., `Q&A`, `Ideas`, `Show and tell`) to route digests to specialized team channels.

    ## Links
    - [GitHub GraphQL API: Discussions](https://docs.github.com/en/graphql/reference/objects#discussion)
    - [Kestra GraphQL Plugin Documentation](https://kestra.io/plugins/plugin-graphql)
    - [Kestra Slack Notification Plugin](https://kestra.io/plugins/plugin-slack)
  tags:
    - Infrastructure
    - Business
  subTags:
    - Customer Success
    - Reporting & Digests
  ee: false
  demo: false
