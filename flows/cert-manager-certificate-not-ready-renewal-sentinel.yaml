id: cert-manager-certificate-not-ready-renewal-sentinel
namespace: company.security

inputs:
  - id: cert_manager_metrics_url
    type: STRING
    defaults: "http://cert-manager.cert-manager:9402/metrics"
    description: Prometheus scrape endpoint for cert-manager controller.

tasks:
  - id: query_cert_ready_status
    type: io.kestra.plugin.scripts.shell.Commands
    commands:
      - |
        curl -s -f "{{ inputs.cert_manager_metrics_url }}" > /tmp/cert_telemetry.txt
        
        # Scrape certmanager_certificate_ready_status metric where condition="False"
        NOT_READY=$(grep -E 'certmanager_certificate_ready_status\{.*condition="False".*\}' /tmp/cert_telemetry.txt | awk '{sum+=$2} END {print sum+0}')
        echo "::set-output name=not_ready_count::$NOT_READY::"

  - id: evaluate_cert_failures
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.query_cert_ready_status.vars.not_ready_count | int > 0 }}"
    then:
      - id: notify_security_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#security-ops",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 cert-manager TLS Certificate Failure Alert",
                "text": "cert-manager controller detected *{{ outputs.query_cert_ready_status.vars.not_ready_count }} certificate(s) in NOT READY state*! ACME HTTP-01/DNS-01 challenges or Vault issuer requests are failing, risking imminent HTTPS certificate expiration.",
                "footer": "Kestra Security Sentinel • cert-manager"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#security-ops",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ cert-manager Sentinel Failure",
            "text": "Failed to scrape cert-manager metrics endpoint. Verify cert-manager controller health.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 * * * *"
    disabled: true

extend:
  metaDescription: "Audits cert-manager for failed TLS/SSL certificate issuance and renewal cycles to prevent production HTTPS outages."
  metaTitle: Kubernetes cert-manager Certificate Renewal Failure and Expiration Sentinel with Kestra
  title: Kubernetes cert-manager Certificate Renewal Failure and Expiration Sentinel
  shortDescription: Audits cert-manager for failed TLS/SSL certificate issuance and renewal cycles to prevent production HTTPS outages.
  description: |
    ## How it works
    This workflow scrapes the controller metrics endpoint of Kubernetes `cert-manager` (default port `9402`) to inspect `certmanager_certificate_ready_status`. When Let's Encrypt ACME challenges fail due to DNS propagation delays, ingress routing misconfigurations, or Let's Encrypt rate limits, the certificate condition is marked `False`. If unresolved before existing TLS secrets expire, web applications and APIs throw fatal SSL certificate expired browser warnings. This blueprint flags unready certificates and alerts security teams ahead of expiration.

    ## What you get
    - Real-time visibility into failing Kubernetes TLS certificate renewals.
    - Prevents catastrophic HTTPS outages and browser security warnings.
    - Automated detection across all cluster namespaces.

    ## Who it's for
    - Kubernetes Platform Engineers and DevSecOps practitioners.
    - Site Reliability Engineers responsible for web and API certificate lifecycles.

    ## Why orchestrate this with Kestra
    - **Continuous Security Assurance**: Runs hourly audits across multi-tenant clusters.
    - **Decoupled Incident Escalation**: Dispatches alerts directly to security Slack channels.
    - **Zero Infrastructure Overhead**: Standard HTTP metric scraping with no custom binaries.

    ## Prerequisites
    - cert-manager installed with metrics port exposed (`--metrics-listen-address=0.0.0.0:9402`).
    - Secret `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import the blueprint.
    2. Input the cert-manager metrics endpoint.
    3. Run the workflow to inspect current certificate statuses.

    ## How to extend
    - Query `certmanager_certificate_expiration_timestamp_seconds` to calculate days remaining until expiration.
    - Re-trigger certificate issuance automatically via `cmctl renew`.

    ## Links
    - [cert-manager Metrics Documentation](https://cert-manager.io/docs/dev-ops/prometheus-metrics/)
    - [Kestra Documentation](https://kestra.io/docs)
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Day 2 Operations
    - Infrastructure Automation
  ee: false
  demo: false
