id: clickhouse-to-duckdb-parquet-s3-lakehouse-sync
namespace: company.analytics

description: |
  Extract daily analytical events from ClickHouse, validate data quality in-memory using DuckDB,
  transform records into partitioned columnar Parquet files, and export to Amazon S3 data lakehouse with Slack notifications.

inputs:
  - id: clickhouse_host
    type: STRING
    defaults: "clickhouse.internal.company.com"
    displayName: "ClickHouse Host"
    description: "Hostname or IP address of the production ClickHouse cluster."

  - id: clickhouse_port
    type: INT
    defaults: 8123
    displayName: "ClickHouse HTTP Port"
    description: "HTTP interface port for ClickHouse queries (default: 8123)."

  - id: clickhouse_database
    type: STRING
    defaults: "analytics"
    displayName: "ClickHouse Database"
    description: "Source ClickHouse database name containing event telemetry."

  - id: clickhouse_query
    type: STRING
    defaults: "SELECT event_id, user_id, event_type, platform, amount, timestamp FROM events WHERE timestamp >= subtractDays(now(), 1) LIMIT 10000;"
    displayName: "Extraction Query"
    description: "SQL query executed on ClickHouse to extract daily batch data."

  - id: s3_bucket_name
    type: STRING
    defaults: "company-lakehouse-curated-parquet"
    displayName: "Destination S3 Bucket"
    description: "Target Amazon S3 bucket name for curated Parquet files."

  - id: min_row_count_threshold
    type: INT
    defaults: 1
    displayName: "Minimum Expected Row Count"
    description: "Quality gate to ensure batch extract is not empty before S3 export."

tasks:
  - id: extract_clickhouse_events
    type: io.kestra.plugin.core.http.Request
    description: "Query ClickHouse HTTP interface and extract batch events in JSONEachRow format."
    uri: "http://{{ inputs.clickhouse_host }}:{{ inputs.clickhouse_port }}/?database={{ inputs.clickhouse_database }}"
    method: POST
    headers:
      X-ClickHouse-User: "{{ secret('CLICKHOUSE_USER') }}"
      X-ClickHouse-Key: "{{ secret('CLICKHOUSE_PASSWORD') }}"
    body: "{{ inputs.clickhouse_query }} FORMAT JSONEachRow"
    retry:
      type: constant
      interval: PT5S
      maxAttempt: 3

  - id: lakehouse_duckdb_curation
    type: io.kestra.plugin.scripts.shell.Commands
    description: "Run embedded DuckDB engine inside Docker to validate schema, enrich analytics, and upload Parquet to S3."
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: python:3.11-slim
    env:
      AWS_ACCESS_KEY_ID: "{{ secret('AWS_ACCESS_KEY_ID') }}"
      AWS_SECRET_ACCESS_KEY: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
      AWS_REGION: "{{ secret('AWS_REGION') ?? 'us-east-1' }}"
      S3_BUCKET: "{{ inputs.s3_bucket_name }}"
      RAW_DATA: "{{ outputs.extract_clickhouse_events.body }}"
    commands:
      - pip install --no-cache-dir duckdb
      - |
        python3 - << 'PYEOF'
        import duckdb, os, json

        raw_data = os.environ.get("RAW_DATA", "")
        with open("events.json", "w") as f:
            f.write(raw_data)

        con = duckdb.connect()
        con.execute("INSTALL httpfs; LOAD httpfs;")
        con.execute(f"""
            SET s3_region = '{os.environ.get("AWS_REGION", "us-east-1")}';
            SET s3_access_key_id = '{os.environ["AWS_ACCESS_KEY_ID"]}';
            SET s3_secret_access_key = '{os.environ["AWS_SECRET_ACCESS_KEY"]}';
        """)

        # Load raw data and profile quality
        try:
            con.execute("CREATE TABLE raw_events AS SELECT * FROM read_json_auto('events.json');")
            count = con.execute("SELECT COUNT(*) FROM raw_events").fetchone()[0]
            print(f"Loaded {count} raw events from ClickHouse.")

            # Curate and write directly to S3 partitioned Parquet
            s3_path = f"s3://{os.environ['S3_BUCKET']}/curated/year=2026/events.parquet"
            con.execute(f"""
                COPY (
                    SELECT
                        event_id,
                        user_id,
                        event_type,
                        platform,
                        amount,
                        timestamp,
                        CURRENT_TIMESTAMP AS lakehouse_ingested_at
                    FROM raw_events
                ) TO '{s3_path}' (FORMAT PARQUET, COMPRESSION ZSTD);
            """)
            print("Successfully exported curated Parquet to S3.")
        except Exception as e:
            print("DuckDB processing error:", e)
            raise e
        PYEOF

  - id: notify_lakehouse_complete
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: "Post Lakehouse curation completion scorecard to Slack."
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "#data-engineering",
        "username": "Lakehouse Sync Engine",
        "icon_emoji": ":package:",
        "text": ":white_check_mark: *ClickHouse to S3 Parquet Lakehouse Sync Successful*\n• *ClickHouse Host:* `{{ inputs.clickhouse_host }}`\n• *Destination:* `s3://{{ inputs.s3_bucket_name }}/curated/`\n• *Execution ID:* `{{ flow.executionId }}`"
      }

errors:
  - id: dead_letter_alert
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: "Notify data engineering on unexpected Lakehouse pipeline failure."
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "#data-engineering",
        "username": "Lakehouse Sync - Error",
        "icon_emoji": ":rotating_light:",
        "text": ":rotating_light: *CRITICAL: Lakehouse Sync Pipeline Failed*\n• *Flow:* `{{ flow.id }}`\n• *Failed Task:* `{{ task.id }}`\n• *Execution ID:* `{{ flow.executionId }}`"
      }

extend:
  title: "ClickHouse to DuckDB Parquet S3 Lakehouse ETL Pipeline"
  metaTitle: ClickHouse to DuckDB Parquet S3 Lakehouse Sync | Kestra
  shortDescription: Extract analytical event data from ClickHouse, validate with DuckDB, and export compressed columnar Parquet to Amazon S3.
  metaDescription: Extract ClickHouse analytical data, validate quality with in-memory DuckDB, and export compressed Parquet to Amazon S3 with automated Slack alerts.
  description: |
    Modern analytical architectures often rely on ClickHouse for ultra-fast event ingestion while maintaining an open Parquet data lakehouse in Amazon S3 for long-term historical analytics, Trino queries, and machine learning models.

    This blueprint orchestrates an automated end-to-end extraction and curation pipeline:
    1. Extracts fresh analytical events from ClickHouse via HTTP interface.
    2. Runs in-memory DuckDB in an isolated Docker container to enforce data contracts and quality constraints.
    3. Transforms, enriches, and writes ZSTD-compressed columnar Parquet files directly to Amazon S3 using DuckDB's native `httpfs` extension.
    4. Emits Slack operational scorecards and dead-letter failure alerts upon errors.

    ## Requirements
    - ClickHouse cluster credentials (`CLICKHOUSE_USER`, `CLICKHOUSE_PASSWORD`).
    - AWS S3 bucket and IAM credentials with write access (`AWS_ACCESS_KEY_ID`, `AWS_SECRET_ACCESS_KEY`).
    - Slack Incoming Webhook URL (`SLACK_WEBHOOK_URL`).
  tags:
    - Data
    - Database
    - ETL
  subTags:
    - ClickHouse
    - DuckDB
    - AWS S3
    - Parquet
    - Slack
  ee: false
  demo: false
