id: aws-eventbridge-dead-letter-queue-sentinel
namespace: company.cloudops

inputs:
  - id: aws_region
    type: STRING
    defaults: us-east-1
    description: AWS region where the EventBridge rule resides.
  - id: rule_name
    type: STRING
    defaults: order-event-router-rule
    description: Name of the EventBridge rule to monitor.
  - id: max_failed_invocations_threshold
    type: INT
    defaults: 0
    description: Maximum permissible failed target invocations in a 15-minute window before alerting.

tasks:
  - id: query_eventbridge_failures
    type: io.kestra.plugin.aws.cli.AwsCLI
    runner: PROCESS
    region: "{{ inputs.aws_region }}"
    accessKeyId: "{{ secret('AWS_ACCESS_KEY_ID') }}"
    secretKeyId: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
    commands:
      - |
        aws cloudwatch get-metric-statistics           --namespace AWS/Events           --metric-name FailedInvocations           --dimensions Name=RuleName,Value="{{ inputs.rule_name }}"           --start-time $(date -u -v-15m +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || date -u -d "15 minutes ago" +%Y-%m-%dT%H:%M:%SZ)           --end-time $(date -u +%Y-%m-%dT%H:%M:%SZ)           --period 900           --statistics Sum           --output json > eb_failures.json
        python3 -c "
        import json
        with open('eb_failures.json') as f:
            dps = json.load(f).get('Datapoints', [])
        total_failed = int(sum(dp.get('Sum', 0) for dp in dps))
        result = {
            'rule_name': '{{ inputs.rule_name }}',
            'failed_invocations': total_failed,
            'alert_triggered': total_failed > {{ inputs.max_failed_invocations_threshold }}
        }
        with open('eb_summary.json', 'w') as out:
            json.dump(result, out)
        print('EventBridge audit:', result)
        "
    outputFiles:
      - eb_summary.json

  - id: evaluate_invocation_failures
    type: io.kestra.plugin.core.flow.If
    condition: "{{ json(read(outputs.query_eventbridge_failures.outputFiles['eb_summary.json'])).alert_triggered }}"
    then:
      - id: alert_eda_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "text": ":warning: *AWS EventBridge Invocation Failure Alert*: Rule `{{ inputs.rule_name }}` recorded {{ json(read(outputs.query_eventbridge_failures.outputFiles['eb_summary.json'])).failed_invocations }} failed target invocations in the last 15 minutes. Check target permissions, concurrency limits, or DLQ delivery."
          }

errors:
  - id: notify_sentinel_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "text": ":warning: *EventBridge Sentinel Failure*: Failed to query CloudWatch metrics for rule `{{ inputs.rule_name }}`."
      }

triggers:
  - id: scheduled_eb_check
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  title: AWS EventBridge Rule Dead Letter Queue Invocation Error Sentinel
  shortDescription: Audits Amazon EventBridge metrics to detect target delivery failures and unhandled event routing errors.
  description: |
    ## How it works
    This sentinel leverages `AwsCLI` to query CloudWatch for the `FailedInvocations` metric on the specified EventBridge rule over rolling 15-minute intervals. It alerts event-driven architecture teams when events fail to deliver to downstream Lambda, SQS, or Step Functions targets due to permission errors or target outages.

    ## What you get
    - Real-time detection of failed asynchronous event dispatching.
    - Early warning before dropped events disrupt downstream business services.
    - Automated Slack delivery tracking rule name and failed invocation counts.

    ## Who it's for
    - Event-driven architecture (EDA) developers and integration engineers.
    - SREs supervising distributed messaging and pub/sub reliability.

    ## Why orchestrate this with Kestra
    Kestra runs automated scheduled operational health checks with native error handling, secret injection, and multi-channel alerting.

    ## Prerequisites
    - AWS IAM credentials with `cloudwatch:GetMetricStatistics` permissions.
    - Secrets `AWS_ACCESS_KEY_ID`, `AWS_SECRET_ACCESS_KEY`, and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import this blueprint into Kestra.
    2. Configure `rule_name`, `aws_region`, and credentials.
    3. Run manually to check current failed invocation counts.

    ## How to extend
    - Query `Invocations` and `MatchedEvents` concurrently for event throughput auditing.
    - Inspect rule target DLQs via SQS APIs to recover dropped payload samples.
    - Forward EventBridge error telemetry to Datadog or Prometheus.

    ## Links
    - [Kestra AWS Plugin](https://kestra.io/plugins/plugin-aws)
    - [EventBridge CloudWatch Metrics](https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-monitoring-cloudwatch-metrics.html)
  tags:
    - Cloud
    - Infrastructure
  subTags:
    - Monitoring & Alerting
  ee: false
  demo: false
