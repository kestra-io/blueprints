id: ebs-unattached-volume-waste-detector
namespace: company.team
description: |
  Detect EBS volumes in available (unattached) state that still bill for
  provisioned storage, and alert Slack with the reclaimable volume list.

triggers:
  - id: weekly_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: Weekly sweep catches volumes detached and forgotten. Shipped disabled; enable after a manual run verifies AWS credentials.
    cron: "0 8 * * 1"
    disabled: true

inputs:
  - id: region
    type: STRING
    defaults: "us-east-1"
    description: AWS region to audit.

tasks:
  - id: audit_volumes
    type: io.kestra.plugin.scripts.python.Script
    description: Queries AWS EC2 to isolate unattached EBS volumes incurring unnecessary storage costs.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install boto3
    env:
      AWS_DEFAULT_REGION: "{{ inputs.region }}"
      AWS_ACCESS_KEY_ID: "{{ secret('AWS_ACCESS_KEY_ID') }}"
      AWS_SECRET_ACCESS_KEY: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
    script: |
      import os
      import sys
      import json
      import boto3
      from kestra import Kestra

      region = os.environ.get("AWS_DEFAULT_REGION", "us-east-1")

      try:
          ec2 = boto3.client("ec2", region_name=region)
          paginator = ec2.get_paginator("describe_volumes")
          
          volumes = []
          for page in paginator.paginate():
              volumes.extend(page.get("Volumes", []))
      except Exception as e:
          print(f"CRITICAL: Failed to describe AWS EBS volumes in region {region}: {e}", file=sys.stderr)
          sys.exit(1)

      checked = len(volumes)
      unattached = [
          {"id": v.get("VolumeId"), "size_gib": v.get("Size", 0), "type": v.get("VolumeType")}
          for v in volumes if v.get("State") == "available"
      ]
      total_gib = sum(v["size_gib"] for v in unattached)
      unattached_summary = ", ".join(f"{v['id']}({v['size_gib']}GiB)" for v in unattached[:50])

      report = {
          "region": region,
          "checked_volumes": checked,
          "unattached_count": len(unattached),
          "total_reclaimable_gib": total_gib,
          "unattached_volumes": unattached
      }

      with open("unattached_ebs_report.json", "w") as f:
          json.dump(report, f, indent=2)

      Kestra.outputs({
          "checked": checked,
          "unattached": len(unattached),
          "gib": total_gib,
          "volumes": unattached_summary
      })
      print(f"EBS audit: checked={checked}, unattached={len(unattached)}, total_gib={total_gib} GiB")
    outputFiles:
      - unattached_ebs_report.json

  - id: waste_found
    type: io.kestra.plugin.core.flow.If
    description: One branch for waste - any unattached volume goes to Slack.
    condition: "{{ outputs.audit_volumes.vars.unattached > 0 }}"
    then:
      - id: alert_waste
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Name the unattached volumes so cleanup starts with exact ids.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": ":money_with_wings: AWS EBS waste detected in {{ inputs.region }}: {{ outputs.audit_volumes.vars.unattached }} unattached volume(s) totaling {{ outputs.audit_volumes.vars.gib }} GiB still billing. Volumes: {{ outputs.audit_volumes.vars.volumes }}. Snapshot and delete, or reattach. Execution {{ execution.id }}."
          }

errors:
  - id: alert_on_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": ":warning: EBS Unattached Volume Waste Detector failed in region {{ inputs.region }}. Execution ID: {{ execution.id }}."
      }

extend:
  title: AWS EBS Unattached Volume Waste Detector
  metaTitle: AWS EBS Unattached Volume Waste Detector Blueprint
  shortDescription: Audits unattached AWS EBS volumes incurring idle cloud storage charges and alerts FinOps on Slack.
  metaDescription: Identifies detached AWS EBS volumes billing for provisioned IOPS and storage, notifying FinOps on Slack.
  description: |
    When Amazon EC2 instances are terminated without the `DeleteOnTermination` flag, their attached EBS volumes remain in an `available` state and continue incurring hourly provisioned storage charges. This sentinel interrogates EC2 APIs across target regions on a weekly cadence, calculates reclaimable gigabytes, and notifies FinOps teams on Slack with volume IDs.

    ## Architecture diagram
    ```mermaid
    flowchart TD
      A[weekly_audit Schedule Trigger] --> B[audit_volumes Python Script]
      B --> C{Unattached Volumes > 0?}
      C -- Yes --> D[alert_waste Slack Webhook]
      C -- No --> E[All Volumes Attached]
    ```

    ## Prerequisites
    - AWS IAM credentials configured with `ec2:DescribeVolumes` permission.
    - Secret `SLACK_WEBHOOK_URL` configured in Kestra.

    ## Quick start
    1. Define `AWS_ACCESS_KEY_ID`, `AWS_SECRET_ACCESS_KEY`, and `SLACK_WEBHOOK_URL` in Kestra Secrets.
    2. Import the blueprint under the `company.team` namespace.
    3. Configure `region` input.
    4. Run manually to audit idle EBS volumes.

    ## Links
    - [AWS EC2 DescribeVolumes API](https://docs.aws.amazon.com/AWSEC2/latest/APIReference/API_DescribeVolumes.html)
    - [Kestra Python Script Documentation](https://kestra.io/plugins/plugin-scripts-python)
  tags:
    - Cloud
    - Infrastructure
  subTags:
    - Cost Optimization
    - Day 2 Operations
  ee: false
  demo: false
