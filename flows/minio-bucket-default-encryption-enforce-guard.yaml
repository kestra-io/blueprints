id: minio-bucket-default-encryption-enforce-guard
namespace: company.team

description: |
  A bucket with no default server side encryption stores every new object as plaintext on disk.
  Nothing errors. Every client still reads and writes normally. The gap shows up in an audit. It
  shows up again the week after somebody walks off with a drive. Turning the default on is one API call that nobody makes
  until it is already a finding.

  This flow finds the gap and closes it. The MinIO plugin inventories the bucket, the AWS CLI reads
  `get-bucket-encryption`, then the run classifies the bucket as encrypted with SSE-S3, encrypted
  with a KMS key, unencrypted or protected. Read-only is the default. With `auto_remediate` on and
  `dry_run` off it pauses for an operator, applies an SSE-S3 default, writes one small probe object,
  reads the probe back to confirm the default actually applies to a new write, deletes the probe,
  then fails the run if the configuration is not on the bucket afterwards.

  Be clear about what this buys, because the name "default encryption" oversells itself. It is a
  DEFAULT. It applies to objects written after it lands. Every object already in the bucket stays
  exactly as it was stored, in plaintext. This flow does not rewrite them. So the report counts
  them and names them before anybody approves anything. Closing that half is a copy of each object
  over itself, which rewrites real data, so it stays out of here on purpose.

variables:
  canary_key: ".kestra-encryption-probe/{{ execution.id }}.txt"

inputs:
  - id: dry_run
    type: BOOL
    defaults: true
    description: >-
      When true the flow prints the configuration it would apply then writes nothing. This is the
      default so a first run cannot change a bucket.

  - id: auto_remediate
    type: BOOL
    defaults: false
    description: >-
      When true (and dry_run is false) the flow applies the default after an operator approves the
      pause. Both switches have to be set, so either one alone is still safe mode.

  - id: bucket
    type: STRING
    description: The bucket to assess. One bucket per run, so one approval covers one blast radius.

  - id: protected_buckets
    type: STRING
    defaults: ""
    description: >-
      Comma separated bucket names this flow must never write to, whatever the other inputs say. A
      bucket named here is still inventoried and still reported, it is just never remediated.

  - id: max_keys
    type: INT
    defaults: 1000
    description: >-
      Ceiling on keys in the inventory listing. The inventory sizes the plaintext that default
      encryption will not fix, so on a very large bucket the report says the count is a floor.

  - id: minio_endpoint
    type: STRING
    defaults: http://minio.internal:9000
    description: S3 API endpoint. The MinIO plugin and the AWS CLI both connect to it.

  - id: minio_access_key
    type: STRING
    defaults: "{{ secret('MINIO_ACCESS_KEY_ID') }}"
    description: >-
      Access key. Needs s3:ListBucket, s3:GetEncryptionConfiguration plus, for the write,
      s3:PutEncryptionConfiguration, s3:PutObject and s3:DeleteObject for the probe object.

  - id: minio_secret_key
    type: STRING
    defaults: "{{ secret('MINIO_SECRET_KEY_ID') }}"
    description: Secret key for the access key above.

  - id: awscli_image
    type: STRING
    defaults: public.ecr.aws/aws-cli/aws-cli:latest
    description: >-
      Image carrying the AWS CLI plus python3. The MinIO plugin has no encryption task, so the
      configuration read, the configuration write plus the probe head request go through this client.

  - id: docker_network
    type: STRING
    defaults: bridge
    description: >-
      Docker network the client container joins so it can reach the endpoint. Set it to your own
      network when the endpoint is a container name.

triggers:
  - id: weekly_encryption_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: >-
      Weekly read-only audit. Safe mode is forced here, so a scheduled run reports the gap without
      touching the bucket.
    cron: "0 6 * * 1"
    disabled: true
    inputs:
      bucket: my-bucket
      dry_run: true
      auto_remediate: false

tasks:
  - id: inventory_objects
    type: io.kestra.plugin.minio.List
    description: >-
      Every current object in the bucket. This listing is the number the whole run turns on: these
      are the objects a default encryption rule will NOT protect. The oldest key here becomes the
      plaintext baseline the verification reads back.
    endpoint: "{{ inputs.minio_endpoint }}"
    accessKeyId: "{{ inputs.minio_access_key }}"
    secretKeyId: "{{ inputs.minio_secret_key }}"
    bucket: "{{ inputs.bucket }}"
    recursive: true
    includeVersions: false
    filter: FILES
    maxKeys: "{{ inputs.max_keys }}"

  - id: assess_encryption
    type: io.kestra.plugin.scripts.shell.Commands
    description: >-
      Read the bucket's encryption configuration, join it to the inventory, classify the bucket plus
      write the exact document the remediation would apply. The unset configuration answers with one
      specific error code, so that code is the finding. Any other read failure fails this task
      instead of reporting a clean bucket.
    containerImage: "{{ inputs.awscli_image }}"
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      networkMode: "{{ inputs.docker_network }}"
      entryPoint: []
    env:
      AWS_ACCESS_KEY_ID: "{{ inputs.minio_access_key }}"
      AWS_SECRET_ACCESS_KEY: "{{ inputs.minio_secret_key }}"
      AWS_DEFAULT_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: "true"
      ENDPOINT: "{{ inputs.minio_endpoint }}"
      BUCKET: "{{ inputs.bucket }}"
      PROTECTED: "{{ inputs.protected_buckets }}"
      MAX_KEYS: "{{ inputs.max_keys }}"
    inputFiles:
      objects.json: "{{ outputs.inventory_objects.objects | toJson }}"
    outputFiles:
      - encryption.json
      - canary.txt
    commands:
      - |
        set -eu
        set +e
        aws --endpoint-url "$ENDPOINT" s3api get-bucket-encryption --bucket "$BUCKET" > current.json 2> current.err
        ENC_RC=$?
        set -e
        export ENC_RC
        cat > assess.py <<'PY'
        import json, os, sys

        bucket = os.environ["BUCKET"]
        max_keys = int(os.environ["MAX_KEYS"])
        protected = [b.strip() for b in os.environ.get("PROTECTED", "").split(",") if b.strip()]
        enc_rc = int(os.environ["ENC_RC"])
        unset_codes = (
            "ServerSideEncryptionConfigurationNotFoundError",
            "NoSuchEncryptionConfiguration",
            "NoSuchServerSideEncryptionConfiguration",
        )

        def load(path):
            with open(path) as fh:
                raw = fh.read().strip()
            return json.loads(raw) if raw else []

        objects = load("objects.json") or []
        err = open("current.err").read()
        current = {}
        seen_code = ""
        if enc_rc == 0:
            current = load("current.json") or {}
        else:
            hit = [c for c in unset_codes if c in err]
            if not hit:
                sys.stderr.write("encryption read failed: " + err.strip()[:400] + "\n")
                sys.exit(1)
            seen_code = hit[0]

        rules = ((current.get("ServerSideEncryptionConfiguration") or {}).get("Rules") or [])

        def algorithm(rule):
            return ((rule.get("ApplyServerSideEncryptionByDefault") or {})
                    .get("SSEAlgorithm") or "")

        algorithms = [a for a in (algorithm(r) for r in rules) if a]
        kms_keys = [((r.get("ApplyServerSideEncryptionByDefault") or {}).get("KMSMasterKeyID") or "")
                    for r in rules]
        kms_keys = [k for k in kms_keys if k]

        if bucket in protected:
            status = "PROTECTED"
        elif not rules:
            status = "UNENCRYPTED"
        elif "aws:kms" in algorithms:
            status = "ENCRYPTED_KMS"
        elif "AES256" in algorithms:
            status = "ENCRYPTED_SSE_S3"
        else:
            status = "ENCRYPTED_OTHER"
        needs_rule = "yes" if status == "UNENCRYPTED" else "no"

        by_age = sorted(objects, key=lambda o: (o.get("lastModified") or ""))
        baseline = (by_age[0].get("key") if by_age else "")
        prefixes = sorted({(o.get("key") or "").split("/")[0] + "/"
                           for o in objects if "/" in (o.get("key") or "")})

        counts = {
            "status": status,
            "needs_rule": needs_rule,
            "algorithm": (algorithms[0] if algorithms else "none"),
            "existing_rules": len(rules),
            "unset_error_code": seen_code,
            "total_objects": len(objects),
            "total_bytes": sum(int(o.get("size") or 0) for o in objects),
            "baseline_key": baseline,
            "hit_ceiling": "yes" if len(objects) >= max_keys else "no",
        }

        rule = {"ApplyServerSideEncryptionByDefault": {"SSEAlgorithm": "AES256"}}
        proposed = {"Rules": rules + [rule]} if not rules else {"Rules": rules}
        with open("encryption.json", "w") as fh:
            json.dump(proposed, fh)
        with open("canary.txt", "w") as fh:
            fh.write("kestra default encryption probe for " + bucket + "\n")

        print("bucket " + bucket + " verdict " + status
              + " default algorithm " + counts["algorithm"])
        if seen_code:
            print("the bucket answered " + seen_code
                  + ", which is how S3 says no default encryption is configured")
        print("existing default rules " + str(counts["existing_rules"]))
        if kms_keys:
            print("existing KMS key reference " + kms_keys[0]
                  + ", stronger than SSE-S3, so this flow leaves it alone")
        print("objects already stored " + str(counts["total_objects"])
              + " holding " + str(counts["total_bytes"]) + " bytes")
        if status == "UNENCRYPTED":
            print("those " + str(counts["total_objects"])
                  + " objects are on disk as plaintext and a default rule does NOT touch them")
            print("prefixes carrying them: " + (", ".join(prefixes) or "the bucket root"))
            print("oldest key, read back later as the plaintext baseline: "
                  + (baseline or "the bucket is empty"))
        if counts["hit_ceiling"] == "yes":
            print("the listing hit the max_keys ceiling of " + str(max_keys)
                  + " so that object count is a floor, not a total")
        print("the configuration this run would apply:")
        print(json.dumps(proposed, indent=2))
        print("a put of this document REPLACES the bucket's whole encryption configuration, which is"
              " why the flow writes only when there is no configuration to replace")
        print("::" + json.dumps({"outputs": counts}) + "::")
        PY
        python3 assess.py

  - id: log_assessment
    type: io.kestra.plugin.core.log.Log
    description: One line that survives in the execution log whatever the gate decides next.
    message: >-
      bucket={{ inputs.bucket }} verdict={{ outputs.assess_encryption.vars.status }}
      algorithm={{ outputs.assess_encryption.vars.algorithm }}
      existing_rules={{ outputs.assess_encryption.vars.existing_rules }}
      stored_objects={{ outputs.assess_encryption.vars.total_objects }}
      needs_rule={{ outputs.assess_encryption.vars.needs_rule }}
      dry_run={{ inputs.dry_run }} auto_remediate={{ inputs.auto_remediate }}

  - id: remediation_gate
    type: io.kestra.plugin.core.flow.If
    description: >-
      The write happens only when the bucket has no encryption configuration, auto_remediate is on
      plus dry_run is off. A protected bucket, an SSE-S3 bucket and a KMS bucket all fail the first
      test, so none of them can be written by this flow.
    condition: "{{ inputs.auto_remediate and inputs.dry_run == false and outputs.assess_encryption.vars.needs_rule == 'yes' }}"
    then:
      - id: approve_encryption
        type: io.kestra.plugin.core.flow.Pause
        description: >-
          Hold for an operator. The log above already carries the configuration document, the object
          count that stays plaintext plus the key that will be read back to show it, so the approval
          is made against real numbers.
        onResume:
          - id: approved
            type: BOOL
            defaults: false
            description: >-
              Set true to apply the SSE-S3 default. Anything else, including resuming with no
              answer, leaves the bucket untouched.

      - id: apply_gate
        type: io.kestra.plugin.core.flow.If
        description: Only an explicit true applies the configuration.
        condition: "{{ (outputs.approve_encryption.onResume.approved ?? false) }}"
        then:
          - id: apply_encryption
            type: io.kestra.plugin.scripts.shell.Commands
            description: >-
              Apply the SSE-S3 default. First re-read the configuration and refuse the write if one
              appeared during the pause, because the put replaces the whole document. The exit status is recorded here but it decides nothing. A
              refused bucket configuration write can report success, so the read back is the gate.
            containerImage: "{{ inputs.awscli_image }}"
            taskRunner:
              type: io.kestra.plugin.scripts.runner.docker.Docker
              networkMode: "{{ inputs.docker_network }}"
              entryPoint: []
            env:
              AWS_ACCESS_KEY_ID: "{{ inputs.minio_access_key }}"
              AWS_SECRET_ACCESS_KEY: "{{ inputs.minio_secret_key }}"
              AWS_DEFAULT_REGION: us-east-1
              AWS_EC2_METADATA_DISABLED: "true"
              ENDPOINT: "{{ inputs.minio_endpoint }}"
              BUCKET: "{{ inputs.bucket }}"
            inputFiles:
              encryption.json: "{{ outputs.assess_encryption.outputFiles['encryption.json'] }}"
            commands:
              - |
                set -eu
                set +e
                aws --endpoint-url "$ENDPOINT" s3api get-bucket-encryption --bucket "$BUCKET" > pre.json 2> pre.err
                PRE_RC=$?
                set -e
                if [ "$PRE_RC" -eq 0 ]; then
                  echo "an encryption configuration appeared on $BUCKET while the pause was open, so nothing was written"
                  cat pre.json
                  exit 1
                fi
                if ! grep -qE 'ServerSideEncryptionConfigurationNotFoundError|NoSuchEncryptionConfiguration|NoSuchServerSideEncryptionConfiguration' pre.err; then
                  echo "the encryption configuration could not be re-read before the write, so nothing was written"
                  head -c 400 pre.err
                  exit 1
                fi
                echo "applying this encryption configuration to $BUCKET"
                cat encryption.json
                echo ""
                set +e
                aws --endpoint-url "$ENDPOINT" s3api put-bucket-encryption \
                  --bucket "$BUCKET" \
                  --server-side-encryption-configuration file://encryption.json > put.out 2> put.err
                PUT_RC=$?
                set -e
                echo "put exit status $PUT_RC"
                head -c 400 put.err || true
                echo ""
                echo "::{\"outputs\":{\"put_rc\":\"$PUT_RC\"}}::"
                echo "put_rc=$PUT_RC recorded, the read back is the gate"

          - id: write_probe_object
            type: io.kestra.plugin.minio.Upload
            description: >-
              Write one small object AFTER the configuration landed. A default only shows up on new
              writes, so writing something is the only honest way to test it. The verification
              deletes this object again.
            endpoint: "{{ inputs.minio_endpoint }}"
            accessKeyId: "{{ inputs.minio_access_key }}"
            secretKeyId: "{{ inputs.minio_secret_key }}"
            bucket: "{{ inputs.bucket }}"
            key: "{{ render(vars.canary_key) }}"
            from: "{{ outputs.assess_encryption.outputFiles['canary.txt'] }}"
            contentType: text/plain

          - id: reverify_encryption
            type: io.kestra.plugin.scripts.shell.Commands
            description: >-
              Read the configuration back, head the probe object to prove a new write now carries
              SSE-S3, head the oldest pre-existing object to show it still does not, delete the probe
              then fail the run unless the default is on the bucket. This is the only task allowed to
              call the remediation done.
            containerImage: "{{ inputs.awscli_image }}"
            taskRunner:
              type: io.kestra.plugin.scripts.runner.docker.Docker
              networkMode: "{{ inputs.docker_network }}"
              entryPoint: []
            env:
              AWS_ACCESS_KEY_ID: "{{ inputs.minio_access_key }}"
              AWS_SECRET_ACCESS_KEY: "{{ inputs.minio_secret_key }}"
              AWS_DEFAULT_REGION: us-east-1
              AWS_EC2_METADATA_DISABLED: "true"
              ENDPOINT: "{{ inputs.minio_endpoint }}"
              BUCKET: "{{ inputs.bucket }}"
              CANARY_KEY: "{{ render(vars.canary_key) }}"
              BASELINE_KEY: "{{ outputs.assess_encryption.vars.baseline_key }}"
              PUT_RC: "{{ outputs.apply_encryption.vars.put_rc }}"
            commands:
              - |
                set -eu
                set +e
                aws --endpoint-url "$ENDPOINT" s3api get-bucket-encryption --bucket "$BUCKET" > after.json 2> after.err
                GET_RC=$?
                aws --endpoint-url "$ENDPOINT" s3api head-object --bucket "$BUCKET" \
                  --key "$CANARY_KEY" > canary.json 2> canary.err
                CANARY_RC=$?
                if [ -n "$BASELINE_KEY" ]; then
                  aws --endpoint-url "$ENDPOINT" s3api head-object --bucket "$BUCKET" \
                    --key "$BASELINE_KEY" > baseline.json 2> baseline.err
                  BASELINE_RC=$?
                else
                  BASELINE_RC=99
                  echo '{}' > baseline.json
                fi
                aws --endpoint-url "$ENDPOINT" s3api delete-object --bucket "$BUCKET" \
                  --key "$CANARY_KEY" > /dev/null 2> delete.err
                DELETE_RC=$?
                set -e
                export GET_RC CANARY_RC BASELINE_RC DELETE_RC
                cat > verify.py <<'PY'
                import json, os, sys

                put_rc = os.environ.get("PUT_RC", "unknown")
                get_rc = int(os.environ["GET_RC"])
                canary_rc = int(os.environ["CANARY_RC"])
                baseline_rc = int(os.environ["BASELINE_RC"])
                delete_rc = int(os.environ["DELETE_RC"])
                canary_key = os.environ["CANARY_KEY"]
                baseline_key = os.environ.get("BASELINE_KEY", "")

                def load(path):
                    with open(path) as fh:
                        raw = fh.read().strip()
                    return json.loads(raw) if raw else {}

                if delete_rc != 0:
                    print("WARNING the probe object " + canary_key
                          + " could not be deleted, remove it by hand")
                    print(open("delete.err").read().strip()[:200])
                else:
                    print("probe object " + canary_key + " deleted")

                if get_rc != 0:
                    print("read back failed after a put that exited " + put_rc)
                    print(open("after.err").read().strip()[:400])
                    sys.exit(1)

                after = load("after.json")
                print("configuration now on the bucket:")
                print(json.dumps(after, indent=2))
                rules = ((after.get("ServerSideEncryptionConfiguration") or {}).get("Rules") or [])
                applied = [((r.get("ApplyServerSideEncryptionByDefault") or {}).get("SSEAlgorithm")
                            or "") for r in rules]
                print("default rules on the bucket " + str(len(rules))
                      + " algorithms " + (", ".join(a for a in applied if a) or "none"))

                canary_sse = ""
                if canary_rc == 0:
                    canary_sse = load("canary.json").get("ServerSideEncryption") or ""
                    print("the object written after the change reports ServerSideEncryption "
                          + (canary_sse or "nothing at all"))
                else:
                    print("the probe object could not be read back: "
                          + open("canary.err").read().strip()[:200])

                if baseline_rc == 0:
                    old_sse = load("baseline.json").get("ServerSideEncryption") or ""
                    print("the pre-existing object " + baseline_key
                          + " reports ServerSideEncryption " + (old_sse or "nothing at all"))
                    if not old_sse:
                        print("that is the limit of this fix, stated plainly: the default protects"
                              " new writes only. Objects already in the bucket stay as they were"
                              " stored. Copy each one over itself to re-encrypt it.")
                elif baseline_key:
                    print("the pre-existing baseline object could not be read: "
                          + open("baseline.err").read().strip()[:200])
                else:
                    print("the bucket held no objects, so there is no plaintext baseline to show")

                if "AES256" not in applied:
                    print("no SSE-S3 default landed on the bucket, so this run failed")
                    print("the put exited " + put_rc
                          + ", which tells you nothing on its own, which is why this check exists")
                    sys.exit(1)
                if canary_rc != 0 or canary_sse != "AES256":
                    print("the configuration is there but a fresh write did not come back encrypted,"
                          " so the default is not being applied and this run failed")
                    sys.exit(1)
                print("verified: the bucket carries an SSE-S3 default plus a new write came back"
                      " encrypted with AES256")
                PY
                python3 verify.py
        else:
          - id: log_declined
            type: io.kestra.plugin.core.log.Log
            description: The operator declined or resumed with no answer, so nothing was written.
            level: WARN
            message: >-
              approval not granted for {{ inputs.bucket }}, no encryption default applied, the bucket
              is still at verdict {{ outputs.assess_encryption.vars.status }} with
              {{ outputs.assess_encryption.vars.total_objects }} objects stored as plaintext
    else:
      - id: log_no_action
        type: io.kestra.plugin.core.log.Log
        description: >-
          Why this run wrote nothing. An SSE-S3 bucket, a KMS bucket, a protected bucket plus any
          safe-mode run all land here.
        message: >-
          no write for {{ inputs.bucket }}, verdict {{ outputs.assess_encryption.vars.status }},
          algorithm {{ outputs.assess_encryption.vars.algorithm }},
          needs_rule {{ outputs.assess_encryption.vars.needs_rule }},
          dry_run {{ inputs.dry_run }}, auto_remediate {{ inputs.auto_remediate }}.
          The configuration document is printed above for review.

errors:
  - id: alert_slack
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Post the failure to Slack. The webhook comes from a secret, never from the flow text.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "MinIO default encryption guard failed on bucket {{ inputs.bucket }}. Flow {{ flow.namespace }}.{{ flow.id }} execution {{ execution.id }}. Either the bucket could not be read or no SSE-S3 default was on it after the write. The bucket is unchanged unless the read back says otherwise."
      }

extend:
  title: Enforce default SSE-S3 encryption on a MinIO bucket
  description: |
    ## Findings

    Four verdicts come out of one run.

    | verdict | what it means | does the flow write |
    |---|---|---|
    | `UNENCRYPTED` | `get-bucket-encryption` answered `ServerSideEncryptionConfigurationNotFoundError`, so every new object lands as plaintext | yes, behind the gate plus the pause |
    | `ENCRYPTED_SSE_S3` | an `AES256` default is already there | no |
    | `ENCRYPTED_KMS` | an `aws:kms` default is there, stronger than what this flow would apply | no, the key reference is reported then left alone |
    | `PROTECTED` | the bucket is named in `protected_buckets` | no, it is still inventoried then reported |

    ## Safety

    Writing a bucket encryption configuration is a whole document PUT. It replaces whatever was
    there, it does not merge. So the flow writes only when there is nothing to replace. A bucket that
    already carries any default rule is reported then skipped, which is why an existing KMS setup
    cannot be downgraded to SSE-S3 by this flow.

    The remediation writes one object of its own, under `.kestra-encryption-probe/<execution id>`,
    then deletes it in the verification step. That object exists because a default is invisible until
    something new gets written: reading it back is the proof the setting took effect rather than just
    being stored. If the delete fails the log says so by name.

    ## How it works

    1. `inventory_objects` (`io.kestra.plugin.minio.List`) lists every current object with its size
       plus `lastModified`. These are the objects a default will not protect, so this listing is the
       number the approval is made against. Its oldest key becomes the plaintext baseline read back at
       the end.
    2. `assess_encryption` (`io.kestra.plugin.scripts.shell.Commands` on the AWS CLI image) runs
       `get-bucket-encryption`, treats the specific not-found error code as the finding, treats any
       other failure as an outage that fails the task, classifies the bucket then writes the exact
       configuration document a write would send.
    3. `log_assessment` (`io.kestra.plugin.core.log.Log`) puts the verdict plus the counts in the
       execution log whatever happens next.
    4. `remediation_gate` (`io.kestra.plugin.core.flow.If`) passes only when the verdict is
       `UNENCRYPTED`, `auto_remediate` is true plus `dry_run` is false.
       - `approve_encryption` (`io.kestra.plugin.core.flow.Pause`) waits for an operator. Resuming
         with no answer counts as a refusal.
       - `apply_encryption` runs `put-bucket-encryption` with an `AES256` default. Its exit status is
         logged then ignored.
       - `write_probe_object` (`io.kestra.plugin.minio.Upload`) writes the probe object.
       - `reverify_encryption` reads the configuration back, heads the probe object, heads the oldest
         pre-existing object, deletes the probe then exits non-zero unless the bucket carries an
         SSE-S3 default AND the fresh write came back as `AES256`.
    5. `errors` posts to Slack when any task fails, including a read back that found no default.

    ## What you get

    - A one-line verdict per bucket with the algorithm, the rule count plus the exact error code the
      bucket answered with.
    - The count plus the byte total of objects that stay plaintext after the fix, printed before the
      approval rather than discovered later.
    - A side by side read of one new object against one old object, which is the only direct evidence
      that a default is live.
    - A write that cannot happen by accident: two input switches, a pause, a verdict check plus an
      exclusion list all have to agree.
    - A run that FAILS when the configuration is not there afterwards, so a silently refused write
      cannot pass as a fix.

    ## Who it's for

    Platform teams running MinIO or S3 compatible storage who have to answer "is data at rest
    encrypted" with something better than a guess. It fits a compliance sweep, a post-incident
    hardening pass or a new bucket checklist, where the finding is cheap to produce plus the fix is
    one call that nobody has made yet.

    ## Why orchestrate this with Kestra

    A one-liner can turn encryption on. It cannot pause for the person who owns the data, record
    which objects stay plaintext, prove the setting applies to a new write, then fail loudly when the
    storage layer quietly ignored the call. Kestra holds the inputs that force safe mode, the pause
    that puts a human on the write, the typed MinIO tasks for the inventory plus the probe, the read
    back that decides the outcome plus the error path that reports it. The schedule turns the same
    file into a weekly read-only audit with no edit.

    ## Tested end to end

    Run against MinIO `DEVELOPMENT.2025-05-24T17-08-30Z` on Kestra 2.0.5 with plugin-minio 1.4.8.
    Buckets were seeded with 4 objects each under `logs/`, `staging/` plus the root, then every path
    was confirmed with `mc encrypt info` rather than with the Kestra log.

    - Bare bucket, safe mode: verdict `UNENCRYPTED`, error code
      `ServerSideEncryptionConfigurationNotFoundError`, 4 objects at 335 bytes reported as plaintext,
      nothing written.
    - Already encrypted bucket, identical inputs: verdict `ENCRYPTED_SSE_S3`, `needs_rule no`, zero
      action. Same flow, same switches, opposite answer, which is what makes the detector worth
      anything.
    - Bare bucket with `auto_remediate=true dry_run=false` plus an approved pause: the default landed
      (`mc encrypt info` went from the not-found error to `Auto encryption 'sse-s3' is enabled`), the
      probe object came back `ServerSideEncryption AES256`, the oldest pre-existing object
      `logs/day1.json` came back with no encryption header at all, the probe was deleted.
    - Declined pause on a second bare bucket: still no configuration afterwards per `mc`.
    - Protected bucket with both switches on: verdict `PROTECTED`, no write, configuration still
      unset.
    - Refused write: against a MinIO with no key source the put failed with `NotImplemented` at exit
      254 while the Kestra task still reported SUCCESS. The read back caught it, the run ended FAILED
      and the Slack error path posted. That is the whole reason the read back is the gate.

    ## Prerequisites

    ### Secrets

    | secret | why |
    |---|---|
    | `MINIO_ACCESS_KEY_ID` | access key for the inventory, the read plus the write |
    | `MINIO_SECRET_KEY_ID` | secret key for that access key |
    | `SLACK_WEBHOOK_URL` | incoming webhook for the failure alert |

    The key needs `s3:ListBucket` plus `s3:GetEncryptionConfiguration` for the audit, then
    `s3:PutEncryptionConfiguration`, `s3:PutObject` plus `s3:DeleteObject` for the remediation and its
    probe. Give the scheduled audit a read-only key if you want the write to be impossible.

    MinIO needs a key source configured before it will accept SSE-S3, either KES or the built-in
    `MINIO_KMS_SECRET_KEY`. Without one, `put-bucket-encryption` is rejected and the read back fails
    the run, which is the correct outcome. Real S3 needs nothing extra. The flow itself never names
    or manages a key.

    ### Inputs

    | input | default | why |
    |---|---|---|
    | `dry_run` | `true` | report the configuration, write nothing |
    | `auto_remediate` | `false` | second switch the write needs |
    | `bucket` | none | the bucket to assess, one per run |
    | `protected_buckets` | empty | comma separated names this flow may never write to |
    | `max_keys` | `1000` | ceiling on the inventory listing |
    | `minio_endpoint` | `http://minio.internal:9000` | S3 API endpoint |
    | `minio_access_key` | secret | access key |
    | `minio_secret_key` | secret | secret key |
    | `awscli_image` | `public.ecr.aws/aws-cli/aws-cli:latest` | AWS CLI plus python3 in one image |
    | `docker_network` | `bridge` | network the client container joins |

    ## Quick start

    1. Add the three secrets.
    2. Run with `bucket` set plus the defaults. You get the verdict, the error code the bucket
       answered with, the plaintext object count plus the configuration document, with nothing
       written.
    3. Read the plaintext count. That is the part this fix does not cover.
    4. To fix it, run again with `auto_remediate=true` plus `dry_run=false`, then approve the pause.
       The verification prints the new object encrypted next to the old one unencrypted.
    5. Enable the schedule for a weekly read-only audit. Its inputs force safe mode.

    ## How to extend

    - Point it at every bucket by wrapping the flow in a parent that loops over `aws s3api
      list-buckets` with `concurrencyLimit: 1`, so one approval still covers one bucket.
    - Swap `AES256` for `aws:kms` with a `KMSMasterKeyID` where you run KES plus want per-key
      control. The verdict logic already treats a KMS default as stronger.
    - Close the other half: after the default lands, copy each pre-existing object over itself so it
      gets rewritten through the new default. That rewrites real data, so gate it on its own pause
      plus an ETag check per object.
    - Send the verdict to your compliance store instead of Slack by adding a task after
      `log_assessment`.

