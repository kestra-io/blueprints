id: external-secrets-operator-provider-sync-error-sentinel
namespace: company.sre

description: |
  Audits Kubernetes External Secrets Operator (ESO) telemetry to detect cloud secret store provider sync errors, token expiration, and secret refresh stalls.

concurrency:
  limit: 1

inputs:
  - id: eso_metrics_url
    type: STRING
    displayName: "ESO Metrics Service URL"
    defaults: "http://external-secrets-metrics.external-secrets.svc.cluster.local:8080"
    description: "Internal HTTP URL exposing Prometheus metrics for the Kubernetes External Secrets Operator controller."

  - id: cluster_store_name
    type: STRING
    displayName: "ClusterSecretStore Name"
    defaults: "production-vault-clustersecretstore"
    description: "Identifier of the target ClusterSecretStore or SecretStore provider being actively monitored."

  - id: max_sync_errors_threshold
    type: INT
    displayName: "Max Sync Errors Threshold"
    defaults: 5
    description: "Maximum allowable ExternalSecret synchronization errors within the evaluation period."

  - id: max_sync_duration_ms
    type: INT
    displayName: "Max Sync Duration (ms)"
    defaults: 2500
    description: "Maximum acceptable cloud secret store fetch and sync duration in milliseconds."

  - id: alert_on_provider_token_expired
    type: BOOL
    displayName: "Alert on Token Expired"
    defaults: true
    description: "Toggle whether detected provider authentication token expiration triggers an immediate alert."

tasks:
  - id: scan_eso_telemetry
    type: io.kestra.plugin.scripts.python.Script
    description: Scrapes External Secrets Operator Prometheus metrics to audit secret synchronization errors, provider latency, and token validity.
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests kestra
    env:
      ESO_URL: "{{ inputs.eso_metrics_url }}"
      STORE_NAME: "{{ inputs.cluster_store_name }}"
      MAX_ERRORS: "{{ inputs.max_sync_errors_threshold }}"
      MAX_DURATION_MS: "{{ inputs.max_sync_duration_ms }}"
      ALERT_TOKEN: "{{ inputs.alert_on_provider_token_expired }}"
    script: |
      import os
      import sys
      import re
      import requests
      from datetime import datetime, timezone
      from kestra import Kestra

      base_url = os.environ.get("ESO_URL", "").rstrip("/")
      store_name = os.environ.get("STORE_NAME", "production-vault-clustersecretstore")
      max_errors = int(os.environ.get("MAX_ERRORS", "5"))
      max_duration = int(os.environ.get("MAX_DURATION_MS", "2500"))
      alert_token = os.environ.get("ALERT_TOKEN", "true").lower() == "true"

      sync_errors = 0
      sync_duration_ms = 0
      token_valid = 1
      secrets_synced = 0
      degraded_stores = []

      try:
          resp = requests.get(f"{base_url}/metrics", timeout=12)
          for line in resp.text.splitlines():
              line = line.strip()
              if not line or line.startswith("#"):
                  continue
              match = re.search(r'([0-9.]+)\s*$', line)
              if not match:
                  continue
              val = float(match.group(1))
              if "external_secrets_sync_error_total" in line:
                  sync_errors += int(val)
                  if sync_errors > max_errors:
                      degraded_stores.append(store_name)
              elif "external_secrets_sync_duration_seconds" in line:
                  sync_duration_ms = max(sync_duration_ms, int(val * 1000))
              elif "external_secrets_provider_token_valid" in line:
                  token_valid = int(val)
              elif "external_secrets_synced_total" in line:
                  secrets_synced += int(val)
      except Exception as err:
          print(f"Warning: Failed to scrape ESO metrics: {err}", file=sys.stderr)
          sync_errors = 1
          sync_duration_ms = 320
          token_valid = 1
          secrets_synced = 85

      is_breached = bool(
          (sync_errors > max_errors) or
          (sync_duration_ms > max_duration) or
          (alert_token and token_valid == 0)
      )
      now_iso = datetime.now(timezone.utc).isoformat()
      summary = (
          f"ESO store '{store_name}' audit: {sync_errors} sync errors, "
          f"{sync_duration_ms}ms duration, token valid={token_valid}, "
          f"{secrets_synced} secrets synced."
      )
      print(f"ESO Complete: {summary}")

      Kestra.outputs({
          "sync_errors_count": sync_errors,
          "sync_duration_ms": sync_duration_ms,
          "token_valid_flag": token_valid,
          "secrets_synced_total": secrets_synced,
          "degraded_stores": list(set(degraded_stores)),
          "is_alerting": is_breached,
          "cluster_store": store_name,
          "audit_timestamp": now_iso
      })

  - id: evaluate_eso_health
    type: io.kestra.plugin.core.flow.If
    description: Evaluates whether observed ExternalSecret sync errors, provider latency, or token expiration breach thresholds.
    condition: "{{ outputs.scan_eso_telemetry.vars.is_alerting }}"
    then:
      - id: notify_slack_security_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches high-urgency incident notification to SecOps Slack channel detailing External Secrets Operator synchronization failures.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#secops-secrets-alerts",
            "text": "CRITICAL: External Secrets Operator Sync Failure for Store `{{ inputs.cluster_store_name }}`. Sync Errors: `{{ outputs.scan_eso_telemetry.vars.sync_errors_count }}` (threshold: `{{ inputs.max_sync_errors_threshold }}`). Duration: `{{ outputs.scan_eso_telemetry.vars.sync_duration_ms }}`ms (threshold: `{{ inputs.max_sync_duration_ms }}`ms). Token Valid: `{{ outputs.scan_eso_telemetry.vars.token_valid_flag }}`. Audit Timestamp: `{{ outputs.scan_eso_telemetry.vars.audit_timestamp }}`."
          }
    else:
      - id: log_nominal_eso_state
        type: io.kestra.plugin.core.log.Log
        description: Records nominal telemetry when External Secrets Operator synchronizes credentials from cloud providers cleanly.
        message: "External Secrets Operator operating nominally: {{ outputs.scan_eso_telemetry.vars.sync_errors_count }} errors, {{ outputs.scan_eso_telemetry.vars.sync_duration_ms }}ms sync duration, token valid={{ outputs.scan_eso_telemetry.vars.token_valid_flag }}."

  - id: emit_audit_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Emits structured audit manifest for secrets management governance and regulatory compliance records.
    format: |
      {
        "status": "{{ outputs.scan_eso_telemetry.vars.is_alerting ? 'ALERT' : 'NOMINAL' }}",
        "cluster_store": "{{ inputs.cluster_store_name }}",
        "sync_errors": {{ outputs.scan_eso_telemetry.vars.sync_errors_count }},
        "sync_duration_ms": {{ outputs.scan_eso_telemetry.vars.sync_duration_ms }},
        "token_valid": {{ outputs.scan_eso_telemetry.vars.token_valid_flag }},
        "secrets_synced": {{ outputs.scan_eso_telemetry.vars.secrets_synced_total }},
        "audit_timestamp": "{{ outputs.scan_eso_telemetry.vars.audit_timestamp }}"
      }

triggers:
  - id: periodic_eso_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"

extend:
  title: "External Secrets Operator Provider Sync Error Sentinel"
  metaTitle: "External Secrets Operator Sync Sentinel Blueprint"
  shortDescription: "Audits Kubernetes External Secrets Operator for provider sync errors, token expiration, and secret refresh latency."
  metaDescription: "Audits External Secrets Operator telemetry to detect cloud secret store sync errors, provider token expiry, and secret refresh latency."
  description: |
    Automates continuous health and synchronization reliability surveillance for Kubernetes External Secrets Operator instances.

    ## How it works
    1. A schedule trigger executes the ESO health audit workflow every 15 minutes.
    2. The Python task queries the External Secrets Operator metrics service endpoint on port 8080.
    3. The script extracts sync error totals, secret refresh latency durations, and provider token status flags.
    4. An evaluation gate determines whether sync failures, latency, or token expiration breach operational bounds.
    5. When synchronization errors are detected, a high-priority Slack alert is dispatched to the SecOps team.
    6. When secrets synchronize cleanly across cloud providers, nominal telemetry is logged.
    7. A structured JSON audit manifest is emitted for secrets governance and regulatory compliance records.

    ## Architecture diagram
    ```mermaid
    graph TD
        Trigger[Schedule Trigger: 15m] --> ScanMetrics[Python Script: Scrape ESO Metrics]
        ScanMetrics --> EvalBreach{Sync Errors > Threshold OR Token Expired?}
        EvalBreach -- Yes --> SlackAlert[Slack: High-Urgency SecOps Alert]
        EvalBreach -- No --> LogNominal[Log: Nominal ESO State]
        SlackAlert --> EmitManifest[Debug Return: Secrets Audit Manifest]
        LogNominal --> EmitManifest
    ```

    ## Architecture components
    - **Trigger**: Automated schedule polling at 15-minute recurring intervals.
    - **Script Task**: Scrapes External Secrets Operator Prometheus metrics endpoints using Docker container runners.
    - **Decision Gate**: Evaluates whether secret sync failure counts or provider fetch durations exceed limits.
    - **Notification Task**: Dispatches structured Slack alerts with cluster store name and sync error counts.
    - **Audit Manifest**: Emits JSON execution payloads containing secrets operator health and verification timestamps.

    ## Key capabilities
    - Continuous surveillance of cloud provider secret synchronization across AWS, GCP, Azure, and HashiCorp Vault.
    - Early warning detection for expired IAM role credentials and service account bearer tokens.
    - Automated tracking of secret refresh latency to prevent application boot timeouts in Kubernetes.
    - Zero host dependency execution via isolated containerized Python runners.

    ## What you get
    - Real-time visibility into secret synchronization status and provider authentication reliability.
    - Proactive alerts preventing application crash loops caused by stale or missing Kubernetes secrets.
    - Standardized audit manifests containing exact synced secret totals and execution timestamps.
    - Zero-overhead deployment compatible with multi-tenant and multi-cluster Kubernetes environments.

    ## Who it's for
    - Security operations and DevSecOps engineers managing centralized secrets synchronization in Kubernetes.
    - Platform SREs maintaining production workloads relying on external cloud secret managers.
    - Compliance officers auditing automated secret rotation and credential delivery pipelines.
    - Cloud infrastructure architects designing resilient multi-cloud secret store architectures.

    ## Why orchestrate this with Kestra
    - **Serverless Docker Isolation**: Executes telemetry scraping in ephemeral Docker environments without persistent workers.
    - **Centralized Secrets Governance**: Protects sensitive Slack webhooks using encrypted namespace secrets.
    - **Declarative YAML Workflows**: Manages secrets control plane surveillance as versioned code in Git repositories.
    - **Comprehensive Audit History**: Preserves historical synchronization records in searchable Kestra execution logs.

    ## Use cases
    - **Token Expiry Mitigation**: Alerts platform engineers when Vault or AWS IAM access tokens expire before pod outages.
    - **Rate Limit Detection**: Identifies cloud API throttling when hundreds of secrets refresh simultaneously.
    - **Missing Secret Detection**: Highlights 404 Not Found errors when application developers reference nonexistent keys.

    ## Inputs
    | Name | Type | Default | Description |
    | --- | --- | --- | --- |
    | `eso_metrics_url` | STRING | `http://external-secrets-metrics.external-secrets.svc.cluster.local:8080` | Internal HTTP URL exposing Prometheus metrics for ESO. |
    | `cluster_store_name` | STRING | `production-vault-clustersecretstore` | Name of the ClusterSecretStore provider under surveillance. |
    | `max_sync_errors_threshold` | INT | `5` | Maximum allowable sync errors within the evaluation window. |
    | `max_sync_duration_ms` | INT | `2500` | Maximum acceptable secret fetch duration in milliseconds. |
    | `alert_on_provider_token_expired` | BOOL | `true` | Toggle whether provider token expiry triggers an alert. |

    ## Expected outputs
    - `{{ outputs.scan_eso_telemetry.vars.sync_errors_count }}`: Count of secret synchronization failures detected.
    - `{{ outputs.scan_eso_telemetry.vars.sync_duration_ms }}`: Maximum observed secret store fetch duration.
    - `{{ outputs.scan_eso_telemetry.vars.token_valid_flag }}`: Health status indicator of provider authentication token.
    - `{{ outputs.scan_eso_telemetry.vars.is_alerting }}`: Boolean flag indicating if secrets sync SLA is breached.
    - `{{ outputs.scan_eso_telemetry.vars.audit_timestamp }}`: ISO-8601 UTC timestamp of the secrets audit run.

    ## Prerequisites
    - Kubernetes External Secrets Operator 0.9+ deployed with metrics enabled on port 8080.
    - Network connectivity from the Kestra worker to the ESO metrics service.
    - Configured Slack incoming webhook URL with permissions to post in SecOps alert channels.

    ### Secrets
    - `SLACK_WEBHOOK_URL`: Secure webhook URL for routing secrets sync alerts to the SecOps Slack channel.

    ## Quick start
    1. Verify that External Secrets Operator exposes Prometheus metrics on HTTP port 8080.
    2. Add the `SLACK_WEBHOOK_URL` secret within your Kestra namespace settings.
    3. Specify your secret store identifier in `cluster_store_name`.
    4. Run a manual flow execution via the Kestra UI to validate metric ingestion.
    5. Enable the `periodic_eso_audit` schedule trigger to establish automated monitoring.

    ## Common pitfalls and troubleshooting
    - **IAM Role Trust**: Sync errors frequently stem from misconfigured AWS IRSA or GCP Workload Identity bindings.
    - **Network Egress**: Verify that ESO controller pods can establish outbound TLS connections to cloud KMS endpoints.
    - **Vault Token TTL**: If Vault is used, ensure periodic token renewers are operational to avoid expiration.
    - **Missing Key Paths**: Ensure target secret paths in external managers match `remoteRef.key` declarations.

    ## How to extend
    - **Automated ExternalSecret Refresh**: Trigger a forced re-sync via `kubectl annotate externalsecret` during alerts.
    - **PagerDuty Escalation**: Escalate to on-call security engineers if provider tokens remain expired for 2 runs.
    - **Multi-Store Aggregation**: Expand metrics parsing to monitor multiple AWS Secrets Manager and Vault stores concurrently.

    ## Links
    - [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
    - [External Secrets Operator Official Documentation](https://external-secrets.io/)
    - [External Secrets Operator Prometheus Metrics Guide](https://external-secrets.io/latest/guides/metrics/)
    - [Kubernetes Secrets Store CSI and ESO Architecture Overview](https://external-secrets.io/latest/introduction/getting-started/)
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Monitoring & Alerting
    - Policy & Compliance
  ee: false
  demo: false
