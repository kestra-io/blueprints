id: kubernetes-node-resource-pressure-sentinel
namespace: company.sre

description: Monitors Kubernetes cluster node conditions to proactively detect DiskPressure, MemoryPressure, and PIDPressure before pod evictions degrade cluster workloads.

concurrency:
  limit: 1

inputs:
  - id: cluster_name
    type: STRING
    defaults: production-eks-us-east-1
    description: Identifier name of the Kubernetes cluster being monitored.

  - id: alert_on_any_pressure
    type: BOOL
    defaults: true
    description: Whether to trigger an immediate Slack alert when any node reports resource pressure conditions.

  - id: slack_channel
    type: STRING
    defaults: "#k8s-platform-alerts"
    description: Slack channel destination for Kubernetes cluster node health alerts.

tasks:
  - id: inspect_node_conditions
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install kubernetes
    env:
      KUBE_CONFIG_DATA: "{{ secret('KUBE_CONFIG_DATA') }}"
      CLUSTER_NAME: "{{ inputs.cluster_name }}"
    script: |
      import os
      import json
      import tempfile
      from kubernetes import client, config
      from kestra import Kestra

      kubeconfig_str = os.getenv('KUBE_CONFIG_DATA')
      with tempfile.NamedTemporaryFile(mode='w', delete=False) as f:
          f.write(kubeconfig_str)
          kubeconfig_path = f.name

      try:
          config.load_kube_config(config_file=kubeconfig_path)
          v1 = client.CoreV1Api()
          nodes = v1.list_node().items
      finally:
          if os.path.exists(kubeconfig_path):
              os.remove(kubeconfig_path)

      pressure_conditions = ['MemoryPressure', 'DiskPressure', 'PIDPressure', 'NetworkUnavailable']
      degraded_nodes = []

      for node in nodes:
          node_name = node.metadata.name
          node_status = node.status
          conditions = node_status.conditions or []

          active_pressures = []
          for cond in conditions:
              if cond.type in pressure_conditions and cond.status == 'True':
                  active_pressures.append({
                      'condition': cond.type,
                      'reason': cond.reason,
                      'message': cond.message
                  })

          if active_pressures:
              degraded_nodes.append({
                  'node_name': node_name,
                  'active_pressures': active_pressures
              })

      total_nodes = len(nodes)
      degraded_count = len(degraded_nodes)
      has_pressure = degraded_count > 0

      Kestra.outputs({
          'total_nodes_inspected': total_nodes,
          'degraded_nodes_count': degraded_count,
          'has_node_pressure': has_pressure,
          'degraded_node_names': [n['node_name'] for n in degraded_nodes]
      })

      report_payload = {
          'cluster_name': os.getenv('CLUSTER_NAME'),
          'total_nodes': total_nodes,
          'degraded_nodes_count': degraded_count,
          'degraded_nodes': degraded_nodes
      }

      with open('k8s_node_pressure_report.json', 'w') as f:
          json.dump(report_payload, f, indent=2)

    outputFiles:
      - k8s_node_pressure_report.json

  - id: check_pressure_conditions
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.inspect_node_conditions.vars.has_node_pressure and inputs.alert_on_any_pressure }}"
    then:
      - id: notify_slack_sre
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "{{ inputs.slack_channel }}",
            "text": "Kubernetes Node Pressure Alert: {{ outputs.inspect_node_conditions.vars.degraded_nodes_count }} node(s) experiencing resource pressure in cluster {{ inputs.cluster_name }}.\nAffected Nodes: {{ outputs.inspect_node_conditions.vars.degraded_node_names | join(', ') }}\nImmediate risk of kubelet pod eviction."
          }
    else:
      - id: log_nodes_healthy
        type: io.kestra.plugin.core.log.Log
        message: "All {{ outputs.inspect_node_conditions.vars.total_nodes_inspected }} Kubernetes node(s) in cluster {{ inputs.cluster_name }} are operating within healthy resource thresholds."

  - id: export_node_manifest
    type: io.kestra.plugin.core.execution.Labels
    labels:
      cluster_name: "{{ inputs.cluster_name }}"
      degraded_count: "{{ outputs.inspect_node_conditions.vars.degraded_nodes_count | string }}"
      health_status: "{{ outputs.inspect_node_conditions.vars.has_node_pressure ? 'DEGRADED' : 'HEALTHY' }}"

triggers:
  - id: periodic_k8s_node_probe
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"

extend:
  title: Kubernetes Node Resource Pressure Sentinel
  metaTitle: Kubernetes Node Resource Pressure Sentinel
  shortDescription: Monitors Kubernetes node conditions to detect DiskPressure, MemoryPressure, and PIDPressure.
  metaDescription: Monitors Kubernetes cluster node conditions to proactively detect DiskPressure, MemoryPressure, and PIDPressure before pod evictions cascade.
  description: |
    This blueprint acts as a proactive reliability sentinel across Kubernetes clusters. Scheduled every 15 minutes, it queries the Kubernetes API to evaluate node condition flags (`MemoryPressure`, `DiskPressure`, `PIDPressure`, and `NetworkUnavailable`), alerting platform SRE teams to degrading nodes before the kubelet triggers disruptive workload evictions or enters a NotReady state.

    ## How it works

    1. **Recurring 15-Minute Probe**: The `periodic_k8s_node_probe` trigger (`io.kestra.plugin.core.trigger.Schedule`) initiates node inspections every 15 minutes.
    2. **Kubernetes API Node Inspection**: The `inspect_node_conditions` task (`io.kestra.plugin.scripts.python.Script`) connects to the cluster using credentials provided in `KUBE_CONFIG_DATA`, querying the CoreV1Api to parse each node's status conditions.
    3. **Condition Gate**: The `check_pressure_conditions` flowable task (`io.kestra.plugin.core.flow.If`) branches based on whether any nodes are actively flagging resource pressures.
    4. **Slack SRE Dispatch**: When degraded nodes are detected, `notify_slack_sre` (`io.kestra.plugin.notifications.slack.SlackIncomingWebhook`) dispatches an urgent incident notification with hostnames.
    5. **Healthy Confirmation**: When all nodes report healthy status, `log_nodes_healthy` records compliant cluster capacity.
    6. **Manifest Export**: The `export_node_manifest` task annotates the execution with searchable status labels.

    ## Architecture diagram

    ```mermaid
    flowchart TD
        A[Schedule: Every 15 Minutes] --> B[inspect_node_conditions: Kubernetes CoreV1Api]
        B --> C{Node Pressure Active?}
        C -- Yes --> D[notify_slack_sre: Slack Webhook]
        C -- No --> E[log_nodes_healthy: Log]
        D --> F[export_node_manifest: Execution Labels]
        E --> F
    ```

    ## Use cases

    - **Proactive Pod Eviction Prevention**: Address container runtime disk bloat or memory leaks before the kubelet evicts production databases or queues.
    - **PID Starvation Detection**: Catch fork-bombing workloads or thread pool leaks before node PID limits are exhausted.
    - **Fleet-Wide Cluster Health Auditing**: Run automated health probes across distributed multi-region Kubernetes clusters.

    ## Inputs

    | Name | Type | Default | Description |
    | :--- | :--- | :--- | :--- |
    | `cluster_name` | STRING | `production-eks-us-east-1` | Identifier name of the Kubernetes cluster being monitored. |
    | `alert_on_any_pressure` | BOOL | `true` | Whether to trigger an immediate Slack alert when any node reports resource pressure conditions. |
    | `slack_channel` | STRING | `#k8s-platform-alerts` | Slack channel destination for Kubernetes cluster node health alerts. |

    ## Expected outputs

    - `{{ outputs.inspect_node_conditions.vars.total_nodes_inspected }}`: Total nodes evaluated.
    - `{{ outputs.inspect_node_conditions.vars.degraded_nodes_count }}`: Number of nodes flagging resource pressure.
    - `{{ outputs.inspect_node_conditions.vars.has_node_pressure }}`: Boolean flag indicating cluster degradation.
    - `{{ outputs.inspect_node_conditions.vars.degraded_node_names }}`: List of affected node names.
    - `{{ outputs.inspect_node_conditions.outputFiles['k8s_node_pressure_report.json'] }}`: Full JSON node condition diagnostics.

    ## Prerequisites

    - Kubernetes cluster `kubeconfig` with read permissions on `nodes` (`get`, `list`).
    - Incoming Webhook URL configured for your platform operations Slack channel.

    ### Secrets

    - `KUBE_CONFIG_DATA`: Base64 or plain YAML kubeconfig configuration string.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook endpoint URL.

    ## Quick start

    1. Configure `KUBE_CONFIG_DATA` and `SLACK_WEBHOOK_URL` in your Kestra namespace secrets.
    2. Import this flow YAML into your Kestra workspace.
    3. Specify your cluster identifier in `cluster_name`.
    4. Click **Execute** in the UI to perform an initial node resource pressure probe.

    ## Common pitfalls and troubleshooting

    - **Transient Network Pressure**: Transient CNI flakiness can briefly trigger `NetworkUnavailable`; ensure nodes remain under observation before initiating manual cordoning.
    - **Kubeconfig Context**: Ensure your kubeconfig has `current-context` set properly if containing multi-cluster definitions.

    ## How to extend

    - Add automated node cordoning via `kubectl cordon <node>` to prevent the scheduler from placing new pods on under-pressure nodes.
    - Trigger automated container image cache pruning when `DiskPressure` is flagged.
    - Route critical memory pressure alerts to PagerDuty or Opsgenie for high-priority response.

    ## Links

    - Kestra Python Script Documentation: https://kestra.io/plugins/plugin-scripts-python/io.kestra.plugin.scripts.python.Script
    - Kestra Slack Plugin Documentation: https://kestra.io/plugins/plugin-notifications
    - Kubernetes Node Conditions: https://kubernetes.io/docs/concepts/architecture/nodes/#condition
  tags:
    - Infrastructure
    - Core
  subTags:
    - Kubernetes Operations
    - Monitoring & Alerting
  ee: false
  demo: false
