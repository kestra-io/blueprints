id: getting-started-elt-pipeline
namespace: tutorial
description: |
  # ELT pipeline example
  Downloads a public CSV, finds the top-selling product with DuckDB, and logs it.

labels:
  name: "Example: ELT Pipeline"

tasks:
  - id: extract
    type: io.kestra.plugin.core.http.Download
    uri: https://raw.githubusercontent.com/kestra-io/datasets/main/csv/orders.csv

  - id: transform
    type: io.kestra.plugin.jdbc.duckdb.Query
    inputFiles:
      orders.csv: "{{ outputs.extract.uri }}"
    sql: SELECT product_id, ROUND(SUM(total), 2) AS revenue FROM 'orders.csv' GROUP BY product_id ORDER BY revenue DESC LIMIT 1
    fetchType: FETCH_ONE

  - id: report
    type: io.kestra.plugin.core.log.Log
    message: "Top seller: product {{ outputs.transform.row.product_id }}, revenue {{ outputs.transform.row.revenue }}"

  - id: notify # create a SLACK_WEBHOOK secret, then enable this task
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    disabled: true
    url: "{{ secret('SLACK_WEBHOOK') }}"
    messageText: "Top seller: product {{ outputs.transform.row.product_id }}"

triggers:
  - id: every_morning
    type: io.kestra.plugin.core.trigger.Schedule
    disabled: true
    cron: "0 8 * * *"

extend:
  shortDescription: Download a public CSV, rank products by revenue in embedded DuckDB and log the top seller, then swap in your own data.
  title: "ELT pipeline example: Getting started with Kestra"
  metaTitle: Getting started ELT pipeline with DuckDB and Kestra
  metaDescription: "Download a public CSV, rank products by revenue in embedded DuckDB and log the top seller, then swap in your own data."
  description: |
    A getting started ELT pipeline that runs successfully on the very first execution with zero secrets. It downloads a public orders CSV, ranks products by revenue in in-process DuckDB, and logs the top seller. Once you have seen it run green, swap the source and the SQL for your own data and enable the Slack alert. It is the fastest way to see the Extract, Load, Transform pattern working end to end in Kestra before wiring in real credentials.

    ## How it works
    1. The `extract` task (`io.kestra.plugin.core.http.Download`) fetches a public sample `orders.csv` from the Kestra datasets repository. No authentication is required.
    2. The `transform` task (`io.kestra.plugin.jdbc.duckdb.Query`) loads that CSV into embedded DuckDB via `inputFiles` and runs a one-line `GROUP BY product_id` query that returns the top product by revenue, with `fetchType: FETCH_ONE`.
    3. The `report` task (`io.kestra.plugin.core.log.Log`) logs the top seller so the first run shows a real, human-readable result.
    4. The optional `notify` task posts a Slack summary once you enable it.

    ## What you get
    - A working ELT run on the first click, with no accounts or keys to configure.
    - A realistic aggregation in embedded DuckDB you can read and adapt.
    - A clear place to swap in your own source and SQL.
    - Optional Slack alerting and a schedule trigger.

    ## Who it's for
    - Data engineers evaluating Kestra for ELT and warehouse loading.
    - Anyone new to Kestra who wants a green first run before adding credentials.
    - Teams standardizing a reusable extract, transform, report skeleton.

    ## Why orchestrate this with Kestra
    A one-off script can download a CSV and run SQL, but it cannot version the pipeline, retry a failed load, track execution lineage, or swap the compute engine without a rewrite. Kestra models the whole flow as declarative YAML: the same `report` step reads `outputs.transform` no matter which warehouse produces it, so moving from DuckDB to Snowflake is a single task swap. You also get scheduling, event triggers, full logs, and replay out of the box.

    ## Prerequisites
    - A running Kestra instance with the DuckDB JDBC plugin available.
    - (Optional) A warehouse and its credentials if you query your own warehouse instead of DuckDB.
    - (Optional) A Slack incoming webhook for notifications.

    ### Secrets
    The default green path uses no secrets. Optional steps use:

    - `SLACK_WEBHOOK`: Slack incoming webhook URL for the `notify` task.

    ## Quick start
    1. Add this flow to your Kestra instance and Execute it. It runs green with no setup.
    2. To use your own data, change the `extract` URL and the SQL in `transform`. To query a warehouse instead, replace `transform` with that warehouse's Query task, keep `id: transform`, and update `report` to match your columns.
    3. Store any credentials as a secret in the `tutorial` namespace (Namespaces > tutorial > Secrets).
    4. (Optional) Add a `SLACK_WEBHOOK` secret, then remove `disabled: true` from `notify` and from the schedule trigger to alert and automate.

    ## How to extend
    - Replace the sample CSV with your own source (S3, GCS, an API).
    - Add data-quality checks (row counts, null checks) before `report`.
    - Fan out to multiple warehouses or add a dbt transformation step.
    - Enable the schedule trigger, or add a webhook trigger, to run it automatically.

    ## Links
    - [DuckDB plugin](https://kestra.io/plugins/plugin-jdbc-duckdb)
    - [HTTP Download task](https://kestra.io/plugins/core/http/io.kestra.plugin.core.http.download)
  tags:
    - Getting Started
    - Data
  subTags:
    - ELT & Data Landing
  ee: false
  demo: false
