id: postgres-orphaned-large-object-cleanup-guard
namespace: company.team

inputs:
  - id: postgres_url
    type: STRING
    defaults: jdbc:postgresql://localhost:5432/postgres
    description: PostgreSQL JDBC URL for the database whose large objects are checked. Example jdbc:postgresql://postgres:5432/app.

  - id: use_secret_auth
    type: BOOL
    defaults: true
    description: Leave true in production so the connection reads POSTGRES_USERNAME and POSTGRES_PASSWORD from secrets. Set false only to pass credentials inline in a disposable test environment.

  - id: postgres_username
    type: STRING
    defaults: postgres
    description: Username used only when use_secret_auth is false. Ignored in production.

  - id: postgres_password
    type: STRING
    defaults: ""
    description: Password used only when use_secret_auth is false. Ignored in production.

  - id: schema
    type: STRING
    defaults: ""
    description: Not used to narrow the scan. A large object belongs to the whole database, so a column in any user schema keeps it referenced. It only names the first-seen cursor.

  - id: min_age_minutes
    type: INT
    defaults: 60
    description: Minimum age in minutes. An orphan is unlinked only once this guard has seen it with no referencing row for at least this long. An orphan seen for the first time is reported but never unlinked on the same run, so a large object created moments before its owner row is spared.

  - id: dry_run
    type: BOOL
    defaults: true
    description: When true, report the orphaned large objects without unlinking anything.

  - id: auto_remediate
    type: BOOL
    defaults: false
    description: When true and dry_run is false, unlink the aged orphans behind an approval gate, then re-read pg_largeobject_metadata.

variables:
  cursor_key: "plo_firstseen_{{ inputs.postgres_url | slugify }}_{{ inputs.schema == '' ? 'all' : inputs.schema }}"
  now_sql: "SELECT extract(epoch FROM now())::bigint AS now_epoch"
  detect_sql: |
    WITH cols AS (
      SELECT quote_ident(n.nspname) AS s, quote_ident(c.relname) AS r, quote_ident(a.attname) AS col
      FROM pg_attribute a
      JOIN pg_class c ON c.oid = a.attrelid
      JOIN pg_namespace n ON n.oid = c.relnamespace
      JOIN pg_type t ON t.oid = a.atttypid
      WHERE c.relkind IN ('r','p','m')
        AND a.attnum > 0 AND NOT a.attisdropped
        AND n.nspname NOT IN ('pg_catalog','information_schema','pg_toast')
        AND t.typname IN ('oid','lo')
    ),
    gen AS (
      SELECT string_agg(
        'SELECT '||col||'::oid::text AS loid FROM '||s||'.'||r||' WHERE '||col||' IS NOT NULL',
        ' UNION '
      ) AS unionsql
      FROM cols
    ),
    refdoc AS (
      SELECT CASE WHEN unionsql IS NULL THEN NULL
             ELSE query_to_xml('SELECT DISTINCT loid FROM ('||unionsql||') u', false, false, '')
             END AS doc
      FROM gen
    ),
    referenced AS (
      SELECT (xpath('/table/row/loid/text()', doc))::text[] AS arr FROM refdoc
    ),
    ref_oids AS (
      SELECT NULLIF(x,'')::oid AS loid FROM referenced, unnest(coalesce(arr, ARRAY[]::text[])) AS x
    )
    SELECT m.oid::text AS loid, m.lomowner::regrole::text AS owner
    FROM pg_largeobject_metadata m
    WHERE NOT EXISTS (SELECT 1 FROM ref_oids r WHERE r.loid = m.oid)
    ORDER BY m.oid

triggers:
  - id: daily_orphan_lo_check
    type: io.kestra.plugin.core.trigger.Schedule
    disabled: true
    cron: "0 3 * * *"
    description: Daily orphaned large object sweep. Disabled by default and pinned to safe mode so it reports without unlinking until an operator enables it.
    inputs:
      dry_run: true
      auto_remediate: false

tasks:
  - id: now_probe
    type: io.kestra.plugin.jdbc.postgresql.Query
    description: Read the server clock as epoch seconds so the first-seen age is measured against the PostgreSQL clock, not the Kestra host clock.
    url: "{{ inputs.postgres_url }}"
    username: "{{ inputs.use_secret_auth ? secret('POSTGRES_USERNAME') : inputs.postgres_username }}"
    password: "{{ inputs.use_secret_auth ? secret('POSTGRES_PASSWORD') : inputs.postgres_password }}"
    fetchType: FETCH
    sql: "{{ vars.now_sql }}"

  - id: detect
    type: io.kestra.plugin.jdbc.postgresql.Query
    description: Scan every user column of type oid or lo, union the large object ids they hold and diff that referenced set against pg_largeobject_metadata. The rows that come back are large objects no column points at, which no delete reclaims and autovacuum never touches.
    url: "{{ inputs.postgres_url }}"
    username: "{{ inputs.use_secret_auth ? secret('POSTGRES_USERNAME') : inputs.postgres_username }}"
    password: "{{ inputs.use_secret_auth ? secret('POSTGRES_PASSWORD') : inputs.postgres_password }}"
    fetchType: FETCH
    sql: "{{ render(vars.detect_sql) }}"

  - id: read_cursor
    type: io.kestra.plugin.core.kv.Get
    description: Read the first-seen cursor, a KV map from large object id to the epoch second this guard first saw it orphaned. A missing key is the first run and returns null.
    key: "{{ render(vars.cursor_key) }}"
    errorOnMissing: false

  - id: compose
    type: io.kestra.plugin.core.output.OutputValues
    description: Build one JSON document holding the server clock, the minimum age in seconds, the stored cursor and the detected orphans, so every later step reads the same input.
    values:
      blob: >-
        {{ {'now': outputs.now_probe.rows[0].now_epoch, 'thr': (inputs.min_age_minutes * 60), 'old': (outputs.read_cursor.value ?? ''), 'orphans': outputs.detect.rows} | toJson }}

  - id: enrich
    type: io.kestra.plugin.core.output.OutputValues
    description: For each orphan, look up its first-seen epoch (or set it to now on first sight), compute its age and flag it a target once the age is at or past the minimum.
    values:
      all_json: >-
        {{ outputs.compose.values.blob | jq('(.now|tonumber) as $N | (.thr|tonumber) as $T | (.old | if type == "string" then (if . == "" then {} else fromjson end) elif . == null then {} else . end) as $old | [ .orphans[] | (.loid|tostring) as $k | {loid:.loid, owner:.owner, k:$k, first_seen:(($old[$k] // $N)|tonumber)} | . + {age:($N - .first_seen)} | . + {is_target:(.age >= $T)} ]') | first | toJson }}

  - id: plan
    type: io.kestra.plugin.core.output.OutputValues
    description: Split the enriched list into the unlink targets and the fresh orphans, build the pruned cursor and the human readable lists once so the logs, the alert and the failure message all agree.
    values:
      targets_json: >-
        {{ outputs.enrich.values.all_json | jq('map(select(.is_target)) | map({loid, owner, first_seen, age})') | first | toJson }}
      new_cursor_json: >-
        {{ outputs.enrich.values.all_json | jq('map({(.k): .first_seen}) | add // {}') | first | toJson }}
      targeted_names: >-
        {{ outputs.enrich.values.all_json | jq('map(select(.is_target)) | map("loid "+(.loid|tostring)+" (owner "+(.owner|tostring)+")") | join(", ")') | first }}
      fresh_names: >-
        {{ outputs.enrich.values.all_json | jq('map(select(.is_target | not)) | map("loid "+(.loid|tostring)+" (seen "+(.age|tostring)+"s ago)") | join(", ")') | first }}

  - id: write_cursor
    type: io.kestra.plugin.core.kv.Set
    description: Write the pruned first-seen cursor back. It keeps the first-seen epoch for orphans still present, records now for orphans seen for the first time and drops entries for ids that are no longer orphaned. No ttl, so a long lived orphan keeps its original first-seen time.
    key: "{{ render(vars.cursor_key) }}"
    value: "{{ outputs.plan.values.new_cursor_json }}"

  - id: log_detect
    type: io.kestra.plugin.core.log.Log
    message: |
      PostgreSQL orphaned large objects: {{ outputs.detect.size }} found. Targets past the {{ inputs.min_age_minutes }} minute minimum age: {{ outputs.plan.values.targets_json | jq('length') | first }}.
      Targeted: {{ outputs.plan.values.targeted_names }}
      Within minimum age (reported, not unlinked): {{ outputs.plan.values.fresh_names }}
      Mode: dry_run={{ inputs.dry_run }} auto_remediate={{ inputs.auto_remediate }}

  - id: guard
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.detect.size > 0 }}"
    then:
      - id: findings_alert
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Alert on every detection, in dry run and in remediate mode, so a human sees the orphaned large objects even when nothing is unlinked.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {"text": "PostgreSQL orphaned large object guard: {{ outputs.detect.size }} orphan(s), {{ outputs.plan.values.targets_json | jq('length') | first }} past the {{ inputs.min_age_minutes }}m minimum age. Targeted {{ outputs.plan.values.targeted_names }}. dry_run={{ inputs.dry_run }} auto_remediate={{ inputs.auto_remediate }}."}

      - id: mode
        type: io.kestra.plugin.core.flow.If
        condition: "{{ inputs.auto_remediate and not inputs.dry_run and (outputs.plan.values.targets_json | jq('length') | first) > 0 }}"
        then:
          - id: approval_gate
            type: io.kestra.plugin.core.flow.Pause
            description: Hold the run until a human approves the unlink. The destructive step never starts on its own.
            pauseDuration: PT2H
            behavior: FAIL
            onResume:
              - id: approved
                type: BOOL
                defaults: false
                description: Set true to unlink the listed orphaned large objects. Anything else leaves them in place.

          - id: apply
            type: io.kestra.plugin.core.flow.If
            condition: "{{ outputs.approval_gate.onResume.approved ?? false }}"
            then:
              - id: unlink_orphans
                type: io.kestra.plugin.core.flow.Loop
                description: Remediation loop. One lo_unlink per aged orphan, concurrencyLimit 1 so the statements run in turn and never race. allowFailure so one rejected unlink does not stop the pass and the re-read stays the real gate.
                concurrencyLimit: 1
                values: "{{ outputs.plan.values.targets_json }}"
                tasks:
                  - id: unlink_one
                    type: io.kestra.plugin.jdbc.postgresql.Query
                    description: Unlink one orphaned large object by its id, only if the same orphan query still lists it, so an object that gained a referencing row during the approval wait is kept. lo_unlink removes the metadata row and every data page.
                    allowFailure: true
                    url: "{{ inputs.postgres_url }}"
                    username: "{{ inputs.use_secret_auth ? secret('POSTGRES_USERNAME') : inputs.postgres_username }}"
                    password: "{{ inputs.use_secret_auth ? secret('POSTGRES_PASSWORD') : inputs.postgres_password }}"
                    fetchType: FETCH
                    sql: "SELECT lo_unlink(d.loid::oid) AS unlinked FROM ({{ render(vars.detect_sql) }}) d WHERE d.loid = '{{ fromJson(item.value).loid }}'"

                  - id: unlink_log
                    type: io.kestra.plugin.core.log.Log
                    message: "Checked loid {{ fromJson(item.value).loid }} again (owner {{ fromJson(item.value).owner }}) and issued lo_unlink if it was still unreferenced."

              - id: reverify
                type: io.kestra.plugin.jdbc.postgresql.Query
                description: Re-run the same orphan diff. The large objects still here are compared against the unlink targets, so a fresh orphan left inside its minimum age does not count as a failure.
                url: "{{ inputs.postgres_url }}"
                username: "{{ inputs.use_secret_auth ? secret('POSTGRES_USERNAME') : inputs.postgres_username }}"
                password: "{{ inputs.use_secret_auth ? secret('POSTGRES_PASSWORD') : inputs.postgres_password }}"
                fetchType: FETCH
                sql: "{{ render(vars.detect_sql) }}"

              - id: verify_plan
                type: io.kestra.plugin.core.output.OutputValues
                description: Keep only the unlink targets that are still present after the pass. The fresh orphans left in place are excluded by design.
                values:
                  still_json: >-
                    {{ {'targets': outputs.plan.values.targets_json, 'remaining': outputs.reverify.rows} | toJson | jq('(.remaining | map(.loid|tostring)) as $rem | (.targets | if type == "string" then fromjson else . end) | map(.loid as $l | select($rem | index($l|tostring)))') | first | toJson }}
                  still_names: >-
                    {{ {'targets': outputs.plan.values.targets_json, 'remaining': outputs.reverify.rows} | toJson | jq('(.remaining | map(.loid|tostring)) as $rem | (.targets | if type == "string" then fromjson else . end) | map(.loid as $l | select($rem | index($l|tostring)) | "loid "+(.loid|tostring)) | join(", ")') | first }}

              - id: verify_result
                type: io.kestra.plugin.core.flow.If
                condition: "{{ (outputs.verify_plan.values.still_json | jq('length') | first) > 0 }}"
                then:
                  - id: remediation_failed
                    type: io.kestra.plugin.core.execution.Fail
                    errorMessage: >-
                      {{ outputs.verify_plan.values.still_json | jq('length') | first }} targeted large object(s) still present after the unlink pass: {{ outputs.verify_plan.values.still_names }}. The connecting user may not own the large objects or a referencing row was removed during the run.
                else:
                  - id: remediated
                    type: io.kestra.plugin.core.log.Log
                    message: "Unlinked and verified. {{ outputs.plan.values.targets_json | jq('length') | first }} target(s) before, 0 of them remaining after."
            else:
              - id: not_approved
                type: io.kestra.plugin.core.log.Log
                message: "Approval not granted, so nothing was unlinked. {{ outputs.plan.values.targets_json | jq('length') | first }} aged orphan(s) still remain."
        else:
          - id: report_only
            type: io.kestra.plugin.core.log.Log
            message: "Report only (dry_run={{ inputs.dry_run }}, auto_remediate={{ inputs.auto_remediate }}). {{ outputs.plan.values.targets_json | jq('length') | first }} aged orphan(s) would be unlinked: {{ outputs.plan.values.targeted_names }}. No change made."
    else:
      - id: clean
        type: io.kestra.plugin.core.log.Log
        message: "No orphaned large objects found. Every large object in pg_largeobject_metadata is referenced by a live oid or lo column. Nothing to unlink."

errors:
  - id: alert_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Post to Slack on any failure, including a connection error or targeted large objects still present after an unlink pass.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {"text": "PostgreSQL orphaned large object guard FAILED (execution {{ execution.id }}). A connection error, an unlink error or targeted large objects still present after an unlink pass. Check the run."}

extend:
  title: PostgreSQL Orphaned Large Object Cleanup Guard
  shortDescription: Find PostgreSQL large objects that no oid or lo column points at, unlink the aged orphans behind a dry-run and approval gate with a first-seen minimum age, then re-read pg_largeobject_metadata and fail if any target remains.
  metaTitle: PostgreSQL Orphaned Large Object Cleanup Guard with Kestra
  metaDescription: Detect orphaned PostgreSQL large objects, unlink the aged ones behind an age window and approval gate, then re-read to confirm.
  description: |
    A PostgreSQL large object created with lo_from_bytea or lo_import lives in pg_largeobject and pg_largeobject_metadata. The owning row stores its id in an oid or lo column, but there is no foreign key between the two. Delete the row and the large object stays behind forever. No delete reclaims it and autovacuum never touches it, so the bytes leak until someone runs the unlink by hand. This guard finds those orphans, unlinks the aged ones under a gate and proves the unlink landed. It is the vacuumlo job done as a scheduled, gated, verified flow.

    This blueprint was created by [zkasuran](https://github.com/zkasuran).

    ## Safety

    - Read-only by default. `dry_run` is true and `auto_remediate` is false, so a plain run reports and never unlinks.
    - An unlink happens only when `auto_remediate` is true and `dry_run` is false. It then waits for a human to resume the `Pause` with `approved` set true. An unanswered gate reads as not approved.
    - A first-seen minimum age protects a fresh large object. An orphan is unlinked only once this guard has seen it with no referencing row for at least `min_age_minutes`, so a large object created moments before its owner row is inserted is reported but never unlinked on the same run.
    - The referenced set is the union of every oid and lo column value, so a value a non-reference oid column happens to hold still protects a matching id. The guard errs toward keeping, the same safe direction vacuumlo takes.
    - The re-read of pg_largeobject_metadata is the real gate, so an unlink the user is not allowed to run surfaces as a failed run rather than a false success.

    ## How it works

    1. `now_probe` (`io.kestra.plugin.jdbc.postgresql.Query`) reads the server clock as epoch seconds, so the first-seen age is measured against the PostgreSQL clock.
    2. `detect` (`io.kestra.plugin.jdbc.postgresql.Query`) finds every user column of type oid or lo from pg_attribute, unions the large object ids they hold through a generated query and returns the ids in pg_largeobject_metadata that no column points at.
    3. `read_cursor` (`io.kestra.plugin.core.kv.Get`) loads the first-seen cursor, a KV map from large object id to the epoch second this guard first saw it orphaned. A missing key is the first run.
    4. `compose` and `enrich` (`io.kestra.plugin.core.output.OutputValues`) merge the cursor with the detected orphans, set a first-seen time of now for an orphan seen for the first time, compute each orphan's age and flag a target once its age is at or past `min_age_minutes`.
    5. `plan` (`io.kestra.plugin.core.output.OutputValues`) splits the orphans into unlink targets and orphans still inside the minimum age, then builds the pruned cursor.
    6. `write_cursor` (`io.kestra.plugin.core.kv.Set`) writes the pruned cursor back with no ttl, so a long-lived orphan keeps its original first-seen time and an id that is no longer orphaned drops out.
    7. `guard` (`io.kestra.plugin.core.flow.If`) branches on the orphan count. With none found, `clean` logs and the run ends. Otherwise `findings_alert` posts the finding on every detection.
    8. `mode` (`io.kestra.plugin.core.flow.If`) enters the remediation branch only when `auto_remediate` is true, `dry_run` is false and at least one orphan is past the minimum age. Otherwise `report_only` lists what would be unlinked and stops.
    9. `approval_gate` (`io.kestra.plugin.core.flow.Pause`) holds the run until a human resumes it. `unlink_orphans` (`io.kestra.plugin.core.flow.Loop`, `concurrencyLimit: 1`) then runs `lo_unlink` once per target that is still unreferenced.
    10. `reverify` re-runs the orphan diff and `verify_result` fails the run through `io.kestra.plugin.core.execution.Fail` if any targeted id is still present. A fresh orphan left in place by design does not count.

    ## What you get

    - A check that reads the real orphan set from the catalog, so it catches the large objects that leak disk forever after their owner rows are gone.
    - A generic scan. It reads the referencing columns from pg_attribute at run time, so it covers every oid and lo column in the schema without a hand-written list.
    - A minimum age that holds back an unlink until the guard has seen an orphan for a set time, so a large object created just before its row is reported but kept.
    - A real verification step. The run passes only when the second read of pg_largeobject_metadata shows every target gone.
    - Slack alerts on the findings and on any failure.

    ## Who it's for

    - DBAs and platform engineers who store large objects and watch disk grow from rows that were deleted without an unlink.
    - Teams that use lo_from_bytea or lo_import without the lo_manage trigger, where a delete leaves the large object behind.
    - Teams evaluating the PostgreSQL plugin who want an example that reads the catalog, keeps a KV cursor and runs gated, verified SQL.

    ## Why orchestrate this with Kestra

    PostgreSQL has no scheduler, no age window, no approval step and no way to prove an unlink took effect. The vacuumlo utility unlinks in one shot with none of those guards. Kestra adds the missing pieces. It schedules the sweep, keeps a first-seen cursor in KV so a fresh orphan is held back, gates the destructive statement behind dry-run and approval, re-reads pg_largeobject_metadata to turn a hopeful unlink into a verified one and posts a Slack alert the moment a step fails.

    ## Tested end to end

    Run on Kestra 2.0.5 against a PostgreSQL 16 server. A table with an oid column and a table with a lo column were seeded with eight large objects through lo_from_bytea, all referenced. Five owner rows were then deleted to orphan five large objects. Counts were confirmed with psql.

    - Detector can fail: with all eight referenced the detector returned 0 orphans, after deleting five owner rows it returned exactly 5, confirmed with psql against pg_largeobject_metadata.
    - Dry run detected the five orphans, alerted and left pg_largeobject_metadata at eight rows.
    - Remediate with approval and an aged cursor unlinked the four aged orphans and the re-read reported 0 of them remaining. The three referenced large objects were never touched.
    - Minimum age: a large object orphaned moments earlier stayed inside the window and was reported but not unlinked.
    - A read-only user that could read the catalog but could not own the large objects turned every unlink into a no-op, the re-read found the targets still present and the run failed and alerted.
    - An unreachable host failed the first query and fired the Slack alert.

    ## Prerequisites

    A PostgreSQL server reachable over JDBC. The connecting user must be able to read pg_largeobject_metadata and the referencing tables and must own the large objects it unlinks.

    ### Secrets

    - `POSTGRES_USERNAME`: PostgreSQL user, read when `use_secret_auth` is true.
    - `POSTGRES_PASSWORD`: password for that user.
    - `SLACK_WEBHOOK_URL`: used by `findings_alert` and the `errors` block.
    - In Kestra OSS, provide each secret as a base64-encoded environment variable prefixed `SECRET_`.

    ### Inputs

    | Name | Type | Default | Description |
    | :--- | :--- | :--- | :--- |
    | `postgres_url` | STRING | `jdbc:postgresql://localhost:5432/postgres` | PostgreSQL JDBC URL for the target database. |
    | `use_secret_auth` | BOOL | `true` | Read credentials from secrets. Set false only for inline test credentials. |
    | `schema` | STRING | `""` | Only names the cursor. The scan always covers every user schema. |
    | `min_age_minutes` | INT | `60` | Minimum age. An orphan is unlinked only after it has been seen this long. |
    | `dry_run` | BOOL | `true` | Report without unlinking. |
    | `auto_remediate` | BOOL | `false` | Unlink behind the approval gate when dry_run is false. |

    ## Quick start

    1. Set `POSTGRES_USERNAME`, `POSTGRES_PASSWORD` and `SLACK_WEBHOOK_URL` as namespace secrets.
    2. Import this flow.
    3. Run it with `postgres_url` pointed at a database that uses large objects. The default dry run reports the orphans.
    4. To unlink, run again with `dry_run` false and `auto_remediate` true, then resume the paused execution with `approved` true.

    ## How to extend

    - Raise or lower `min_age_minutes` to widen or shorten the window before an orphan is eligible to unlink.
    - Add a size read from pg_largeobject per target for a report that shows the bytes reclaimed, where the connecting user may read pg_largeobject.
    - Fail the run as soon as detection finds anything, for a read-only drift check with no remediation.

    ## Links

    - PostgreSQL plugin: https://kestra.io/plugins/plugin-jdbc-postgres
    - Large object functions: https://www.postgresql.org/docs/current/lo-funcs.html
    - vacuumlo: https://www.postgresql.org/docs/current/vacuumlo.html
    - Schedule trigger: https://kestra.io/plugins/core/triggers/io.kestra.plugin.core.trigger.schedule
  tags:
    - Data
    - Infrastructure
  subTags:
    - Day 2 Operations
  ee: false
  demo: false


