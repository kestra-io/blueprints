id: grafana-dashboard-deploy-with-drift-guard-and-rollback
namespace: company.team

description: |
  Deploy Grafana dashboards from namespace files, which you keep in sync with Git, without overwriting what people
  changed in the Grafana UI. Each run compares three things per dashboard: the file, the live dashboard and the hash this
  flow recorded at its last deploy. A dashboard edited in Grafana since then is reported as drift and needs an approval.
  Approved writes carry the live id and version, are read back, and are rolled back through Grafana's version history
  when the read-back differs. A second, independent read verifies the result.

concurrency:
  limit: 1
  behavior: CANCEL

inputs:
  - id: dry_run
    type: BOOL
    defaults: true
    description: Plan and report only. Nothing is written to Grafana and no approval is requested.

  - id: auto_apply_clean
    type: BOOL
    defaults: false
    description: Skip the approval when every change is a new dashboard or a Git-only update. Drifted and unmanaged dashboards always need an approval. Off by default.

  - id: grafana_url
    type: STRING
    defaults: "http://host.docker.internal:3000"
    description: Base URL of Grafana as the Docker task runner sees it.

  - id: dashboards_dir
    type: STRING
    defaults: dashboards
    validator: ^[A-Za-z0-9_./-]+$
    description: Folder in the namespace files that holds the dashboard JSON. A file in dashboards/team-a/ is deployed into the Grafana folder whose uid is team-a, a file directly in dashboards/ into General.

  - id: approval_timeout
    type: DURATION
    defaults: PT12H
    description: How long a review waits. Without an answer nothing is written, and the next run plans again.

variables:
  state_scope: main
  state_key: "grafana_dashboard_deploy_state_{{ vars.state_scope }}"

triggers:
  - id: after_git_sync
    type: io.kestra.plugin.core.trigger.Webhook
    description: Call it when the namespace files were updated from Git, for example at the end of a sync job or CI pipeline.
    key: "{{ secret('GRAFANA_DEPLOY_WEBHOOK_KEY') }}"

  - id: weekly_drift_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: Shipped disabled. Plans against Grafana every Monday to surface dashboards edited in the UI.
    cron: "0 7 * * 1"
    disabled: true

tasks:
  - id: load_state
    type: io.kestra.plugin.core.kv.Get
    description: What this flow left in Grafana at its last deploy, per dashboard uid. Empty before the first deploy.
    key: "{{ render(vars.state_key) }}"
    errorOnMissing: false

  - id: plan
    type: io.kestra.plugin.scripts.node.Script
    description: Reads the dashboard files and live Grafana, classifies every dashboard as new, update, drifted, unmanaged, in sync, blocked or orphan, and writes the changes to apply. Writes nothing to Grafana.
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: node:22-alpine
    namespaceFiles:
      enabled: true
      include:
        - "{{ inputs.dashboards_dir }}/**"
    env:
      GRAFANA_URL: "{{ inputs.grafana_url }}"
      GRAFANA_TOKEN: "{{ secret('GRAFANA_API_TOKEN') }}"
      DASH_DIR: "{{ inputs.dashboards_dir }}"
      STATE_JSON: "{{ outputs.load_state.value is defined ? (outputs.load_state.value | toJson) : '{}' }}"
    outputFiles:
      - changes.json
      - state.json
    script: |
      // plan: compare desired dashboards (namespace files) with live Grafana and with what this flow left at its last deploy. Writes nothing to Grafana.
      const fs = require('fs'), path = require('path'), crypto = require('crypto');
      const GRAFANA = (process.env.GRAFANA_URL || '').replace(/\/+$/, '');
      const TOKEN = process.env.GRAFANA_TOKEN || '';
      const DIR = process.env.DASH_DIR || 'dashboards';
      const state = JSON.parse(process.env.STATE_JSON || '{}') || {};
      const fail = m => { console.error('DEPLOY GUARD FAILED: ' + m); process.exit(1); };

      async function api(method, p) {
        const r = await fetch(GRAFANA + p, { method, headers: { Authorization: 'Bearer ' + TOKEN, Accept: 'application/json' } });
        const text = await r.text(); let json = null; try { json = JSON.parse(text); } catch (e) { /* not JSON */ }
        return { status: r.status, json, text };
      }
      const canon = v => Array.isArray(v) ? v.map(canon) : (v && typeof v === 'object' ? Object.fromEntries(Object.keys(v).sort().map(k => [k, canon(v[k])])) : v);
      // id and version change on every save, so they are not part of what a dashboard "is".
      const hashOf = model => { const m = { ...model }; delete m.id; delete m.version; return crypto.createHash('sha256').update(JSON.stringify(canon(m))).digest('hex').slice(0, 16); };

      function walk(dir, rel = '') {
        let out = [];
        for (const e of fs.readdirSync(path.join(dir, rel), { withFileTypes: true })) {
          const r = path.join(rel, e.name);
          if (e.isDirectory()) out = out.concat(walk(dir, r)); else if (e.name.endsWith('.json')) out.push(r);
        }
        return out;
      }

      (async () => {
        if (!GRAFANA || !TOKEN) fail('GRAFANA_URL and GRAFANA_TOKEN are required');
        if (!fs.existsSync(DIR)) fail(`no ${DIR}/ folder in the namespace files; add the dashboard JSON files there`);
        // 1. read the desired dashboards. A broken source file stops the run before anything is compared.
        const desired = [], problems = [], seen = new Map();
        for (const rel of walk(DIR).sort()) {
          let model;
          try { model = JSON.parse(fs.readFileSync(path.join(DIR, rel), 'utf8')); } catch (e) { problems.push(`${rel}: not valid JSON (${e.message})`); continue; }
          if (!model || typeof model.uid !== 'string' || !/^[A-Za-z0-9_-]{1,40}$/.test(model.uid)) { problems.push(`${rel}: needs a "uid" of 1-40 letters, digits, - or _`); continue; }
          if (typeof model.title !== 'string' || !model.title) { problems.push(`${rel}: needs a "title"`); continue; }
          if (seen.has(model.uid)) { problems.push(`${rel}: uid ${model.uid} is also used by ${seen.get(model.uid)}`); continue; }
          seen.set(model.uid, rel);
          const parts = rel.split(path.sep);
          desired.push({ rel, model, folderUid: parts.length > 1 ? parts[0] : '' });
        }
        if (problems.length) fail(problems.join('; '));

        // 2. classify every dashboard against live Grafana and against the state this flow recorded.
        const items = [], light = [], adopt = [], folderOk = new Map();
        const counts = { NEW: 0, UPDATE: 0, DRIFTED: 0, UNMANAGED: 0, IN_SYNC: 0, BLOCKED: 0, ORPHAN: 0 };
        for (const d of desired) {
          const desiredHash = hashOf(d.model);
          const base = { uid: d.model.uid, title: d.model.title, folderUid: d.folderUid, desired_hash: desiredHash };
          if (d.folderUid && !folderOk.has(d.folderUid)) folderOk.set(d.folderUid, (await api('GET', '/api/folders/' + encodeURIComponent(d.folderUid))).status === 200);
          if (d.folderUid && !folderOk.get(d.folderUid)) { counts.BLOCKED++; light.push({ ...base, action: 'BLOCKED', reason: `folder ${d.folderUid} does not exist in Grafana` }); continue; }
          const res = await api('GET', '/api/dashboards/uid/' + encodeURIComponent(d.model.uid));
          if (res.status === 404) {
            // Missing, but this flow deployed it before: somebody deleted it in Grafana. Bringing it back needs a person, like any other drift.
            if (state[d.model.uid]) { counts.DRIFTED++; const reason = 'deleted in Grafana since the last deploy; this would create it again'; items.push({ ...base, action: 'DRIFTED', live_missing: true, reason, model: d.model }); light.push({ ...base, action: 'DRIFTED', reason }); continue; }
            counts.NEW++; items.push({ ...base, action: 'NEW', reason: 'not in Grafana yet', model: d.model }); light.push({ ...base, action: 'NEW', reason: 'not in Grafana yet' }); continue;
          }
          if (res.status !== 200 || !res.json || !res.json.dashboard) fail(`GET dashboard ${d.model.uid} returned HTTP ${res.status}: ${res.text.slice(0, 120)}`);
          const live = res.json.dashboard, meta = res.json.meta || {};
          const liveHash = hashOf(live), rec = state[d.model.uid];
          if (meta.provisioned) { counts.BLOCKED++; light.push({ ...base, action: 'BLOCKED', reason: 'provisioned from a file; the API cannot save it' }); continue; }
          const folderMoves = (meta.folderUid || '') !== d.folderUid;
          const common = { ...base, live_id: live.id, live_version: live.version, live_hash: liveHash, model: d.model };
          if (liveHash === desiredHash && !folderMoves) {
            counts.IN_SYNC++;
            if (!rec || rec.live_hash !== liveHash) adopt.push({ uid: d.model.uid, desired_hash: desiredHash, live_hash: liveHash, version: live.version });
            continue;
          }
          if (!rec) {
            counts.UNMANAGED++;
            const it = { ...common, action: 'UNMANAGED', reason: 'exists in Grafana but this flow never deployed it; overwriting replaces whatever is there' };
            items.push(it); light.push({ uid: it.uid, title: it.title, folderUid: it.folderUid, action: it.action, reason: it.reason }); continue;
          }
          if (rec.live_hash === liveHash) {
            counts.UPDATE++;
            const it = { ...common, action: 'UPDATE', reason: folderMoves && liveHash === desiredHash ? 'moves to folder ' + (d.folderUid || 'General') : 'Git changed since the last deploy' };
            items.push(it); light.push({ uid: it.uid, title: it.title, folderUid: it.folderUid, action: it.action, reason: it.reason }); continue;
          }
          // The live dashboard is not what this flow left: somebody saved it in Grafana after the last deploy. Name who and when.
          counts.DRIFTED++;
          let who = [];
          const vr = await api('GET', '/api/dashboards/uid/' + encodeURIComponent(d.model.uid) + '/versions?limit=10');
          if (vr.status === 200 && vr.json && Array.isArray(vr.json.versions)) {
            who = vr.json.versions.filter(v => v.version > (rec.version || 0)).map(v => ({ version: v.version, by: v.createdBy, at: v.created, message: v.message }));
          }
          const by = who.length ? who.map(w => `v${w.version} by ${w.by} (${w.message || 'no message'})`).join(', ') : 'versions unavailable';
          const it = { ...common, action: 'DRIFTED', reason: `edited in Grafana since the last deploy: ${by}`, drift: who };
          items.push(it); light.push({ uid: it.uid, title: it.title, folderUid: it.folderUid, action: it.action, reason: it.reason });
        }
        for (const uid of Object.keys(state)) if (!seen.has(uid)) { counts.ORPHAN++; light.push({ uid, title: '', folderUid: '', action: 'ORPHAN', reason: 'deployed before, no longer in the source; left in Grafana' }); }

        // 3. write the plan for the apply step, and the state with adoptions merged in.
        const next = { ...state };
        for (const a of adopt) next[a.uid] = { ...(next[a.uid] || {}), desired_hash: a.desired_hash, live_hash: a.live_hash, version: a.version, adopted: true };
        fs.writeFileSync('changes.json', JSON.stringify({ items }));
        fs.writeFileSync('state.json', JSON.stringify(next));
        const needsReview = counts.DRIFTED + counts.UNMANAGED;
        console.log(`plan: ${desired.length} dashboards - new ${counts.NEW}, update ${counts.UPDATE}, drifted ${counts.DRIFTED}, unmanaged ${counts.UNMANAGED}, in sync ${counts.IN_SYNC}, blocked ${counts.BLOCKED}, orphans ${counts.ORPHAN}`);
        console.log('::' + JSON.stringify({ outputs: { desired: desired.length, adopted: adopt.length, changes: items.length, needs_review: needsReview, auto_ok: counts.NEW + counts.UPDATE, counts, items: light } }) + '::');
      })().catch(e => fail(e.message));

  - id: announce_gate
    type: io.kestra.plugin.core.flow.If
    description: Nothing to say when every dashboard is already in sync.
    condition: "{{ outputs.plan.vars.changes > 0 or outputs.plan.vars.counts.BLOCKED > 0 or outputs.plan.vars.counts.ORPHAN > 0 }}"
    then:
      - id: announce_plan
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        messageText: |
          Grafana dashboard deploy plan ({% if inputs.dry_run %}dry run{% else %}live{% endif %}): {{ outputs.plan.vars.desired }} dashboard(s) in Git, {{ outputs.plan.vars.changes }} to write, {{ outputs.plan.vars.counts.IN_SYNC }} already in sync.
          {% for i in outputs.plan.vars.items %}- {{ i.action }} `{{ i.uid }}`{% if i.folderUid != '' %} (folder {{ i.folderUid }}){% endif %}: {{ i.reason }}
          {% endfor %}{% if outputs.plan.vars.needs_review > 0 %}Drifted and unmanaged dashboards are overwritten only after an approval.{% endif %}

  - id: record_adoptions
    type: io.kestra.plugin.core.flow.If
    description: A dashboard that already equals its file but was never recorded is recorded now, so a later change to it is an update and not an unmanaged overwrite. Only when nothing is written, since a deploy records it anyway.
    condition: "{{ outputs.plan.vars.adopted > 0 and outputs.plan.vars.changes == 0 and not inputs.dry_run }}"
    then:
      - id: save_adopted_state
        type: io.kestra.plugin.core.kv.Set
        key: "{{ render(vars.state_key) }}"
        kvType: JSON
        value: "{{ read(outputs.plan.outputFiles['state.json']) }}"

  - id: deploy_gate
    type: io.kestra.plugin.core.flow.If
    description: Only a live run with something to write goes on.
    condition: "{{ outputs.plan.vars.changes > 0 and not inputs.dry_run }}"
    then:
      - id: approval_gate
        type: io.kestra.plugin.core.flow.If
        description: A person approves unless every change is new or Git-only and auto_apply_clean is on.
        condition: "{{ outputs.plan.vars.needs_review > 0 or not inputs.auto_apply_clean }}"
        then:
          - id: approve_deploy
            type: io.kestra.plugin.core.flow.Pause
            description: Human gate. The default is false and a timeout resumes with the default, so silence never writes to Grafana.
            pauseDuration: "{{ inputs.approval_timeout }}"
            behavior: RESUME
            onResume:
              - id: approve
                type: BOOL
                displayName: Write these dashboards to Grafana?
                defaults: false
              - id: skip_uids
                type: STRING
                displayName: Dashboard uids to leave out, comma separated
                required: false

      - id: apply_gate
        type: io.kestra.plugin.core.flow.If
        description: Writes after an approval, or without one for a clean plan with auto_apply_clean on.
        condition: "{{ (outputs.plan.vars.needs_review == 0 and inputs.auto_apply_clean) or (outputs.approve_deploy.onResume.approve is defined and outputs.approve_deploy.onResume.approve == true) }}"
        then:
          - id: apply_changes
            type: io.kestra.plugin.scripts.node.Script
            description: Re-checks each dashboard against the plan, writes it with the live id and version, reads it back and undoes the write through the version history if the read-back differs. Dashboards that changed since the plan are skipped, not overwritten.
            taskRunner:
              type: io.kestra.plugin.scripts.runner.docker.Docker
            containerImage: node:22-alpine
            inputFiles:
              changes.json: "{{ outputs.plan.outputFiles['changes.json'] }}"
              state.json: "{{ outputs.plan.outputFiles['state.json'] }}"
            env:
              GRAFANA_URL: "{{ inputs.grafana_url }}"
              GRAFANA_TOKEN: "{{ secret('GRAFANA_API_TOKEN') }}"
              EXECUTION_ID: "{{ execution.id }}"
              SKIP_UIDS: "{{ outputs.approve_deploy.onResume.skip_uids is defined ? outputs.approve_deploy.onResume.skip_uids : '' }}"
            outputFiles:
              - results.json
              - state_next.json
            script: |
              // apply: write the approved changes. Each dashboard is re-checked against the plan, written with the live id and version,
              // read back, and rolled back through Grafana's own version history when the read-back is not what was deployed.
              const fs = require('fs'), crypto = require('crypto');
              const GRAFANA = (process.env.GRAFANA_URL || '').replace(/\/+$/, '');
              const TOKEN = process.env.GRAFANA_TOKEN || '';
              const EXEC = process.env.EXECUTION_ID || 'local';
              const SKIP = new Set((process.env.SKIP_UIDS || '').split(',').map(s => s.trim()).filter(Boolean));
              const state = JSON.parse(fs.readFileSync('state.json', 'utf8'));
              const { items } = JSON.parse(fs.readFileSync('changes.json', 'utf8'));

              async function api(method, p, body) {
                const r = await fetch(GRAFANA + p, { method, headers: { Authorization: 'Bearer ' + TOKEN, Accept: 'application/json', 'Content-Type': 'application/json' }, body: body === undefined ? undefined : JSON.stringify(body) });
                const text = await r.text(); let json = null; try { json = JSON.parse(text); } catch (e) { /* not JSON */ }
                return { status: r.status, json, text };
              }
              const canon = v => Array.isArray(v) ? v.map(canon) : (v && typeof v === 'object' ? Object.fromEntries(Object.keys(v).sort().map(k => [k, canon(v[k])])) : v);
              const hashOf = model => { const m = { ...model }; delete m.id; delete m.version; return crypto.createHash('sha256').update(JSON.stringify(canon(m))).digest('hex').slice(0, 16); };
              // Everything we deployed must be present and equal in what Grafana returns. Fields Grafana adds on its own do not count.
              const subset = (want, got) => {
                if (Array.isArray(want)) return Array.isArray(got) && want.length === got.length && want.every((w, i) => subset(w, got[i]));
                if (want && typeof want === 'object') return got && typeof got === 'object' && Object.keys(want).every(k => k === 'id' || k === 'version' || subset(want[k], got[k]));
                return want === got;
              };
              const get = uid => api('GET', '/api/dashboards/uid/' + encodeURIComponent(uid));

              (async () => {
                const results = [];
                for (const it of items) {
                  const out = { uid: it.uid, title: it.title, action: it.action };
                  const create = it.action === 'NEW' || it.live_missing === true;
                  if (SKIP.has(it.uid)) { results.push({ ...out, status: 'SKIPPED_BY_REVIEWER' }); continue; }
                  const cur = await get(it.uid);
                  // The plan was made before the approval. If the dashboard is no longer exactly what was planned against, do not write.
                  if (create) {
                    if (cur.status !== 404) { results.push({ ...out, status: 'SKIPPED_CHANGED', detail: 'it exists now' }); continue; }
                  } else if (cur.status !== 200 || cur.json.dashboard.version !== it.live_version || hashOf(cur.json.dashboard) !== it.live_hash) {
                    results.push({ ...out, status: 'SKIPPED_CHANGED', detail: cur.status === 200 ? `live is now version ${cur.json.dashboard.version}, the plan was made against ${it.live_version}` : `HTTP ${cur.status}` }); continue;
                  }
                  const dashboard = { ...it.model, id: create ? null : cur.json.dashboard.id };
                  if (create) delete dashboard.version; else dashboard.version = cur.json.dashboard.version;
                  const w = await api('POST', '/api/dashboards/db', { dashboard, folderUid: it.folderUid, overwrite: false, message: `Deployed by Kestra execution ${EXEC} (${it.action})` });
                  if (w.status !== 200 || !w.json || w.json.status !== 'success') { results.push({ ...out, status: 'FAILED_WRITE', detail: `HTTP ${w.status}: ${(w.json && w.json.message) || w.text.slice(0, 120)}` }); continue; }
                  const back = await get(it.uid);
                  const ok = back.status === 200 && subset(it.model, back.json.dashboard) && (back.json.meta.folderUid || '') === it.folderUid;
                  if (ok) {
                    state[it.uid] = { desired_hash: it.desired_hash, live_hash: hashOf(back.json.dashboard), version: back.json.dashboard.version, at: new Date().toISOString(), execution: EXEC };
                    results.push({ ...out, status: 'APPLIED', version: back.json.dashboard.version });
                    continue;
                  }
                  // The read-back is not what was written: undo it with Grafana's own history, then check the undo.
                  const undo = create ? await api('DELETE', '/api/dashboards/uid/' + encodeURIComponent(it.uid)) : await api('POST', '/api/dashboards/uid/' + encodeURIComponent(it.uid) + '/restore', { version: it.live_version });
                  const after = await get(it.uid);
                  const restored = create ? after.status === 404 : (after.status === 200 && hashOf(after.json.dashboard) === it.live_hash);
                  results.push({ ...out, status: restored ? 'ROLLED_BACK' : 'ROLLBACK_FAILED', detail: `read-back differed from the deployed model; undo HTTP ${undo.status}` });
                }
                fs.writeFileSync('state_next.json', JSON.stringify(state));
                fs.writeFileSync('results.json', JSON.stringify(results));
                const by = s => results.filter(r => r.status === s).length;
                const bad = results.filter(r => ['FAILED_WRITE', 'ROLLED_BACK', 'ROLLBACK_FAILED'].includes(r.status));
                console.log(`apply: applied ${by('APPLIED')}, skipped ${by('SKIPPED_CHANGED') + by('SKIPPED_BY_REVIEWER')}, rolled back ${by('ROLLED_BACK')}, failed ${by('FAILED_WRITE')}, rollback failed ${by('ROLLBACK_FAILED')}`);
                console.log('::' + JSON.stringify({ outputs: { applied: by('APPLIED'), skipped: by('SKIPPED_CHANGED') + by('SKIPPED_BY_REVIEWER'), problems: bad.length, results } }) + '::');
              })().catch(e => { console.error('DEPLOY GUARD FAILED: ' + e.message); process.exit(1); });

          - id: verify_deployment
            type: io.kestra.plugin.scripts.node.Script
            description: A second, independent read of every dashboard that was applied. It must still be at the version apply left and still contain what was deployed.
            taskRunner:
              type: io.kestra.plugin.scripts.runner.docker.Docker
            containerImage: node:22-alpine
            inputFiles:
              changes.json: "{{ outputs.plan.outputFiles['changes.json'] }}"
              results.json: "{{ outputs.apply_changes.outputFiles['results.json'] }}"
            env:
              GRAFANA_URL: "{{ inputs.grafana_url }}"
              GRAFANA_TOKEN: "{{ secret('GRAFANA_API_TOKEN') }}"
            script: |
              // verify: a second, independent read of every dashboard that apply reported as applied.
              const fs = require('fs');
              const GRAFANA = (process.env.GRAFANA_URL || '').replace(/\/+$/, '');
              const TOKEN = process.env.GRAFANA_TOKEN || '';
              const { items } = JSON.parse(fs.readFileSync('changes.json', 'utf8'));
              const results = JSON.parse(fs.readFileSync('results.json', 'utf8'));
              const subset = (want, got) => {
                if (Array.isArray(want)) return Array.isArray(got) && want.length === got.length && want.every((w, i) => subset(w, got[i]));
                if (want && typeof want === 'object') return got && typeof got === 'object' && Object.keys(want).every(k => k === 'id' || k === 'version' || subset(want[k], got[k]));
                return want === got;
              };
              (async () => {
                const failures = []; let checked = 0;
                for (const r of results.filter(x => x.status === 'APPLIED')) {
                  const it = items.find(i => i.uid === r.uid); checked++;
                  const res = await fetch(GRAFANA + '/api/dashboards/uid/' + encodeURIComponent(r.uid), { headers: { Authorization: 'Bearer ' + TOKEN, Accept: 'application/json' } });
                  const j = res.status === 200 ? await res.json() : null;
                  if (!j) { failures.push(`${r.uid}: HTTP ${res.status}`); continue; }
                  if (j.dashboard.version !== r.version) failures.push(`${r.uid}: version is ${j.dashboard.version}, apply left ${r.version}, so it was saved again after the deploy`);
                  else if (!subset(it.model, j.dashboard)) failures.push(`${r.uid}: live model differs from the deployed one`);
                  else if ((j.meta.folderUid || '') !== it.folderUid) failures.push(`${r.uid}: folder is ${j.meta.folderUid || 'General'}, expected ${it.folderUid || 'General'}`);
                }
                console.log(`verify: ${checked} dashboard(s) re-read, ${failures.length} problem(s)`);
                console.log('::' + JSON.stringify({ outputs: { checked, failures } }) + '::');
              })().catch(e => { console.error('DEPLOY GUARD FAILED: ' + e.message); process.exit(1); });

          - id: save_state
            type: io.kestra.plugin.core.kv.Set
            description: Records the hash of every dashboard this run left in Grafana. The next run reads a different hash as an edit made in the UI.
            key: "{{ render(vars.state_key) }}"
            kvType: JSON
            value: "{{ read(outputs.apply_changes.outputFiles['state_next.json']) }}"

          - id: deploy_outcome
            type: io.kestra.plugin.core.flow.If
            condition: "{{ outputs.apply_changes.vars.problems > 0 or (outputs.verify_deployment.vars.failures | length) > 0 }}"
            then:
              - id: report_problems
                type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
                url: "{{ secret('SLACK_WEBHOOK_URL') }}"
                messageText: |
                  Grafana dashboard deploy finished with problems (execution {{ execution.id }}): applied {{ outputs.apply_changes.vars.applied }}, skipped {{ outputs.apply_changes.vars.skipped }}.
                  {% for r in outputs.apply_changes.vars.results %}{% if r.status != 'APPLIED' %}- {{ r.status }} `{{ r.uid }}`: {% if r.detail is defined %}{{ r.detail }}{% else %}left out by the reviewer{% endif %}
                  {% endif %}{% endfor %}{% for f in outputs.verify_deployment.vars.failures %}- VERIFY {{ f }}
                  {% endfor %}Rolled back dashboards are back at the version they had before; every write is also in the dashboard's version history.

              - id: fail_deploy
                type: io.kestra.plugin.core.execution.Fail
                errorMessage: "Grafana dashboard deploy had {{ outputs.apply_changes.vars.problems }} write problem(s) and {{ outputs.verify_deployment.vars.failures | length }} verification failure(s); see the Slack report. Dashboards that were applied and verified are recorded in the state."
            else:
              - id: report_deployed
                type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
                url: "{{ secret('SLACK_WEBHOOK_URL') }}"
                messageText: |
                  Grafana dashboard deploy verified (execution {{ execution.id }}): applied {{ outputs.apply_changes.vars.applied }}, skipped {{ outputs.apply_changes.vars.skipped }}, {{ outputs.verify_deployment.vars.checked }} re-read.
                  {% for r in outputs.apply_changes.vars.results %}- {{ r.status }} `{{ r.uid }}`{% if r.version is defined %} (version {{ r.version }}){% endif %}{% if r.detail is defined %}: {{ r.detail }}{% endif %}
                  {% endfor %}
        else:
          - id: report_not_applied
            type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
            description: The review was declined or timed out.
            url: "{{ secret('SLACK_WEBHOOK_URL') }}"
            messageText: "Grafana dashboard deploy was not approved: {{ outputs.plan.vars.changes }} change(s) were not written. Grafana is unchanged."

errors:
  - id: alert_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    messageText: "Grafana dashboard deploy flow failed in execution {{ execution.id }}{% if errorLogs() | length > 0 %} at `{{ errorLogs()[0]['taskId'] }}`: {{ errorLogs()[0]['message'] | abbreviate(300) }}{% endif %}. If the failure is after apply_changes, check the dashboard versions in Grafana before running again."

extend:
  title: Grafana Dashboard Deploy with Drift Guard, Approval and Rollback
  metaTitle: Grafana Dashboard Deploy with Drift Guard and Rollback | Kestra
  shortDescription: Deploy dashboards from Git-synced files to Grafana without overwriting edits made in the UI. Detect drift, require approval, write by version, verify with a second read and roll back from history.
  metaDescription: Deploy Grafana dashboards from Git without losing UI edits. Detect drift, approve, write by version, verify with a second read and roll back from history.
  description: |
    Dashboards kept in Git and pushed to Grafana by a pipeline have a quiet failure: someone fixes a panel in the Grafana UI during an incident, and the next deploy overwrites the fix without anyone noticing. This blueprint deploys dashboards from namespace files, which you keep in sync with Git, and treats a dashboard edited in Grafana since the last deploy as drift that needs a person.

    ## How it works

    1. The `after_git_sync` webhook starts a run (`weekly_drift_audit` is a disabled schedule for audits only). `load_state` reads from KV the hash this flow recorded for each dashboard at its last deploy.
    2. `plan` (`io.kestra.plugin.scripts.node.Script`) reads `dashboards/**`; a file under `dashboards/team-a/` goes to the Grafana folder with uid `team-a`. It reads each live dashboard from `/api/dashboards/uid/<uid>` and hashes it without `id` and `version`, which change on every save. A dashboard is NEW, UPDATE (live is what the flow left, Git changed), DRIFTED (live differs from what the flow left, with the author taken from `/versions`), UNMANAGED (exists but was never deployed by the flow), IN_SYNC, BLOCKED (provisioned or missing folder) or ORPHAN.
    3. `announce_plan` posts the list. `approve_deploy` (`io.kestra.plugin.core.flow.Pause`) asks for approval unless every change is NEW or UPDATE and `auto_apply_clean` is on. Drifted and unmanaged dashboards always wait. The default answer is false, and `skip_uids` leaves chosen dashboards out.
    4. `apply_changes` re-checks each dashboard against the plan and skips any that changed during the wait. It writes with `POST /api/dashboards/db`, sending the live `id` and `version` and `overwrite: false`, then reads the dashboard back. If the read-back differs it undoes the write: `DELETE` for a new dashboard, `POST .../restore` with the previous version otherwise.
    5. `verify_deployment` reads every applied dashboard again and checks it is still at the version `apply_changes` left and still contains what was deployed. `save_state` records the new hashes, and `deploy_outcome` reports or fails.

    ## What you get

    - A deploy that cannot silently erase a fix made in the Grafana UI, with the author and version named in the plan.
    - Writes that fail instead of overwriting when the dashboard changed after the plan.
    - Rollback through Grafana's own version history, so every write and undo stays auditable.
    - State in KV: the flow knows what it left, so a UI edit is detected on the next run.

    ## Who it's for

    - Platform and SRE teams that manage Grafana dashboards as code.
    - Teams where both pipelines and people edit dashboards.

    ## Why orchestrate this with Kestra

    A pipeline step that POSTs JSON has no memory and no approval. Kestra keeps the last deployed hashes in KV, pauses for a person on drift, runs the plan, the write and the verification as separate steps with secrets, and starts from a webhook when Git changes.

    ## Prerequisites

    - Grafana 13.x (the dashboard, folder and version APIs used here are the stable ones) reachable from the Docker task runner, and a service account token that can write dashboards and read folders. The default `grafana_url` uses `host.docker.internal`, which Docker Desktop resolves. On a Linux host set `grafana_url` to an address the container can reach.
    - Dashboard JSON in the namespace files, each with a unique `uid` and a `title`. Do not run this together with a Grafana-to-Git backup on the same folders, since they pull in opposite directions.

    ### Secrets

    - `GRAFANA_API_TOKEN`: service account token with permission to read and write dashboards.
    - `GRAFANA_DEPLOY_WEBHOOK_KEY`: key for the webhook trigger.
    - `SLACK_WEBHOOK_URL`: Slack incoming webhook for plans and results.

    ## Quick start

    1. Run Grafana, for example `docker run -d --name grafana -p 3000:3000 grafana/grafana-oss:13.0.2`, create a service account with the Editor role and a token, and create a folder with uid `team-a`.
    2. Add the three secrets. In the namespace files of `company.team` add `dashboards/team-a/service-latency.json`, a dashboard model with `uid`, `title` and `panels`.
    3. Run with `dry_run: true` and read the plan: the dashboard is NEW.
    4. Run with `dry_run: false`, tick Approve, and open the dashboard in Grafana.
    5. Edit the dashboard in Grafana and change the JSON file, then run again: the plan shows DRIFTED with your name. Approve and look at the version history, where the edit is still there.
    6. Call the webhook after each Git sync.

    ## How to extend

    - Add `io.kestra.plugin.git.SyncNamespaceFiles` before `plan` to pull the files from your repository on every run.
    - Apply the same plan, approve, verify pattern to folders, data sources or alert rules.
    - Add a Loop over `outputs.apply_changes.vars.results` to open a ticket for each dashboard that was rolled back.

    ## Links

    - [Grafana dashboard HTTP API](https://grafana.com/docs/grafana/latest/developers/http_api/dashboard/)
    - [Grafana dashboard versions API](https://grafana.com/docs/grafana/latest/developers/http_api/dashboard_versions/)
    - [Kestra Node.js script plugin](https://kestra.io/plugins/plugin-script-node)
    - [Kestra namespace files](https://kestra.io/docs/concepts/namespace-files)
    - [Kestra Pause task](https://kestra.io/plugins/core/flow/io.kestra.plugin.core.flow.pause)
  tags:
    - Infrastructure
  subTags:
    - CI/CD & Deployment
    - Approval Gates
  ee: false
  demo: false
