id: github-actions-queued-run-sla-gate
namespace: company.team
description: Check the age of GitHub Actions runs that remain queued. Save evidence and block on stale or incomplete data.
inputs:
  - id: owner
    type: STRING
    defaults: example-org
    description: Exact GitHub repository owner.
  - id: repo
    type: STRING
    defaults: example-repo
    description: Exact repository name.
  - id: max_queue_minutes
    type: INT
    defaults: 30
    description: Block when a queued run was created more than this many minutes ago. Range 1-1440.
triggers:
  - id: check_every_10_minutes
    type: io.kestra.plugin.core.trigger.Schedule
    cron: '*/10 * * * *'
    disabled: true
    description: Enable after checking a real repository and both alert paths.
tasks:
  - id: validate_target
    type: io.kestra.plugin.scripts.node.Script
    containerImage: node:22-alpine
    description: Reject invalid repository names and queue limits before making an HTTP request.
    env:
      GH_OWNER: '{{ inputs.owner }}'
      GH_REPO: '{{ inputs.repo }}'
      MAX_QUEUE_MINUTES: '{{ inputs.max_queue_minutes }}'
    script: |
      const {GH_OWNER:owner,GH_REPO:repo,MAX_QUEUE_MINUTES:limit}=process.env;
      const valid=s=>typeof s==='string'&&s.length<=100&&/^[A-Za-z0-9][A-Za-z0-9_.-]*$/.test(s)&&s!=='.'&&s!=='..';
      if(!valid(owner)||!valid(repo)||!/^\d+$/.test(limit)||!Number.isSafeInteger(Number(limit))||Number(limit)<1||Number(limit)>1440)throw Error('Invalid repository or queue threshold');
      console.log('Queue check inputs accepted');
  - id: read_queued_runs
    type: io.kestra.plugin.core.http.Download
    description: Read up to 100 queued workflow runs. Reject redirects and failed HTTP responses.
    uri: 'https://api.github.com/repos/{{ inputs.owner }}/{{ inputs.repo }}/actions/runs'
    params:
      status: queued
      per_page: '100'
      page: '1'
    headers:
      Accept: application/vnd.github+json
      Authorization: "Bearer {{ secret('GITHUB_TOKEN') }}"
      X-GitHub-Api-Version: '2022-11-28'
    options:
      followRedirects: false
      allowFailed: false
    saveAs: queued-runs.json
  - id: check_queue
    type: io.kestra.plugin.scripts.node.Script
    containerImage: node:22-alpine
    description: Check queue age and completeness, then save a machine-readable report.
    env:
      MAX_QUEUE_MINUTES: '{{ inputs.max_queue_minutes }}'
      GH_OWNER: '{{ inputs.owner }}'
      GH_REPO: '{{ inputs.repo }}'
    inputFiles:
      queued-runs.json: '{{ outputs.read_queued_runs.uri }}'
    outputFiles:
      - queue-report.json
    script: |
      const fs=require('fs'),path=require('path');
      function evaluate(data,now,maxMinutes,owner,repo){
        const reasons=[];
        const obj=x=>x!==null&&typeof x==='object'&&!Array.isArray(x);
        if(!obj(data)||!Number.isSafeInteger(data.total_count)||data.total_count<0||!Array.isArray(data.workflow_runs)||data.workflow_runs.length>100||data.total_count<data.workflow_runs.length){
          return {status:'BLOCK',reasons:['Invalid GitHub workflow-run response'],queued_count:null,oldest_run_age_minutes:null,stale_runs:[]};
        }
        if(data.total_count>100)reasons.push('More than 100 queued runs; the first page is not a complete scan');
        else if(data.total_count!==data.workflow_runs.length)reasons.push('Queued run count does not match the returned page');
        const stale=[];let oldest=0;let queued=0;
        for(const run of data.workflow_runs){
          if(!obj(run)||!Number.isSafeInteger(run.id)||run.id<1||typeof run.status!=='string'||typeof run.created_at!=='string'||!Number.isSafeInteger(run.run_attempt)||run.run_attempt<1){
            reasons.push('A workflow run has invalid fields');continue;
          }
          if(run.status!=='queued'){reasons.push('API returned a run that is not queued');continue;}
          if(run.run_attempt>1){reasons.push('Rerun '+run.id+' cannot be aged by its original creation time');continue;}
          const started=Date.parse(run.created_at);
          if(!Number.isFinite(started)||started>now+120000){reasons.push('A queued run has an invalid creation time');continue;}
          queued++;
          const age=Math.max(0,(now-started)/60000);
          oldest=Math.max(oldest,age);
          if(age>maxMinutes)stale.push({id:run.id,workflow:typeof run.name==='string'?run.name.slice(0,120):null,age_since_creation_minutes:Math.floor(age)});
        }
        if(stale.length)reasons.push('One or more queued runs exceeded the wait limit');
        return {status:reasons.length?'BLOCK':'PASS',repository:owner+'/'+repo,run_age_limit_minutes:maxMinutes,reported_total:data.total_count,scanned:data.workflow_runs.length,queued_count:queued,oldest_run_age_minutes:Math.floor(oldest),stale_runs:stale,reasons};
      }
      const max=Number(process.env.MAX_QUEUE_MINUTES);
      if(!Number.isSafeInteger(max)||max<1||max>1440)throw Error('Invalid queue threshold');
      const work=process.env.WORKING_DIR;
      if(!work)throw Error('Kestra working directory is not set');
      const input=fs.readFileSync(path.join(work,'queued-runs.json'),'utf8');
      if(Buffer.byteLength(input)>2097152)throw Error('GitHub response exceeds 2 MiB');
      const report=evaluate(JSON.parse(input),Date.now(),max,process.env.GH_OWNER,process.env.GH_REPO);
      fs.writeFileSync(path.join(work,'queue-report.json'),JSON.stringify(report,null,2));
      console.log('::'+JSON.stringify({outputs:{status:report.status,reason_count:report.reasons.length,stale_count:report.stale_runs.length,oldest_run_age_minutes:report.oldest_run_age_minutes??-1}})+'::');
      console.log('GitHub Actions queued runs: '+report.status);
  - id: publish_report
    type: io.kestra.plugin.core.output.OutputValues
    description: Make the decision and saved report available to dependent flows.
    values:
      status: '{{ outputs.check_queue.vars.status }}'
      report_uri: "{{ outputs.check_queue.outputFiles['queue-report.json'] }}"
      stale_count: '{{ outputs.check_queue.vars.stale_count }}'
  - id: queue_gate
    type: io.kestra.plugin.core.flow.If
    description: Alert and fail if the queued runs exceed the limit or the scan is incomplete.
    condition: "{{ outputs.check_queue.vars.status == 'BLOCK' }}"
    then:
      - id: notify_queue_block
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: '{"text":"GitHub Actions queue BLOCK: {{ inputs.owner }}/{{ inputs.repo }}; stale={{ outputs.check_queue.vars.stale_count }}; oldest_run_age_minutes={{ outputs.check_queue.vars.oldest_run_age_minutes }}; findings={{ outputs.check_queue.vars.reason_count }}; execution={{ execution.id }}. Read queue-report.json."}'
      - id: stop_queue_gate
        type: io.kestra.plugin.core.execution.Fail
        errorMessage: GitHub Actions queue check blocked. Read queue-report.json.
    else:
      - id: log_queue_pass
        type: io.kestra.plugin.core.log.Log
        message: 'GitHub Actions queue PASS: {{ inputs.owner }}/{{ inputs.repo }}. This is a point-in-time result.'
errors:
  - id: log_queue_error
    type: io.kestra.plugin.core.log.Log
    message: 'GitHub Actions queue probe failed. No PASS result. Execution {{ execution.id }}.'
extend:
  title: Detect Aged GitHub Actions Queued Runs
  metaTitle: GitHub Actions Queued Run Age Gate
  shortDescription: Block on aged queued GitHub Actions runs, reruns with unknown queue duration, or incomplete API data.
  metaDescription: Detect queued GitHub Actions runs that exceed an age limit. Save audit evidence and block on incomplete results.
  description: |
    Check the time since creation for GitHub Actions workflow runs that are still queued. This does not measure the exact time spent in the queued state. This read-only flow does not cancel or rerun jobs.

    ## How it works

    1. validate_target checks the owner, repo, and maximum queue wait before any API call.
    2. read_queued_runs fetches up to 100 queued workflow runs from the GitHub REST API.
    3. check_queue checks the run creation time and run attempt, then writes queue-report.json. It blocks on reruns because the original creation time cannot measure the current attempt.
    4. publish_report exposes the decision and report URI. queue_gate posts to Slack and fails on BLOCK.

    ## Prerequisites

    - GitHub Actions enabled for the selected repository.
    - A GitHub token with Actions read permission for the target repo; repo scope for classic private-repo tokens.
    - Kestra Node Script and Slack plugins. A Node task runner that can start node:22-alpine.

    ### Secrets

    - GITHUB_TOKEN: GitHub token with Actions read permission. Do not use it in a URL.
    - SLACK_WEBHOOK_URL: Slack incoming webhook for blocked checks.

    ## Quick start

    1. Set the two secrets and set owner, repo, and max_queue_minutes (1-1440).
    2. Run manually. Read outputs.publish_report.values.report_uri for the full report.
    3. Test an old queued workflow run, a rerun, and an incomplete API response. Check the Slack alert and failed execution.
    4. Enable the disabled schedule after checking both paths.

    ## Output and limits

    - PASS means every returned queued run is on its first attempt, is within the creation-age limit, and the API response is complete.
    - BLOCK means an old queued run, a rerun with unknown current queue age, malformed response, invalid time, or incomplete scan.
    - If GitHub reports more than 100 queued runs, the flow blocks. It does not claim full coverage from one page.
    - GitHub Actions waiting for environment approval may not be in the queued state. This flow does not inspect waiting or pending runs.
    - An HTTP or token failure fails the execution before a PASS decision. The errors handler logs the failure. Configure standard Kestra execution-failure alerts separately.
    - This is a current queue view. Creation age is an upper bound on queue duration, not an exact queue-time metric. It does not inspect completed runs or runner types.

    ## Links

    - https://docs.github.com/en/rest/actions/workflow-runs#list-workflow-runs-for-a-repository
    - https://kestra.io/plugins/core/http/io.kestra.plugin.core.http.download
    - https://kestra.io/plugins/plugin-script-node/io.kestra.plugin.scripts.node.script
    - Created by [vivekyarra](https://github.com/vivekyarra).
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Monitoring & Alerting
    - DevOps & CI/CD
  ee: false
  demo: false
