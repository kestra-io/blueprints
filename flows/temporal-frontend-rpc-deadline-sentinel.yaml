id: temporal-frontend-rpc-deadline-sentinel
namespace: company.sentinel
description: Inspects Temporal Frontend cluster Prometheus metrics to detect gRPC
  context deadline exceeded errors and client poller timeouts.
inputs:
- id: temporal_metrics_url
  type: STRING
  defaults: http://temporal.internal:9090/metrics
- id: max_deadline_errors_threshold
  type: INT
  defaults: 10
tasks:
  - id: audit_temporal
    type: io.kestra.plugin.scripts.python.Script
    description: Queries Temporal Frontend Prometheus metrics to audit context deadline exceeded errors and rate-limiting rejections.
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install requests kestra
    env:
      METRICS_URL: "{{ inputs.temporal_metrics_url }}"
      MAX_DEADLINE_THRESHOLD: "{{ inputs.max_deadline_errors_threshold }}"
    script: |
      import os
      import sys
      import re
      import requests
      from kestra import Kestra

      metrics_url = os.environ.get("METRICS_URL", "").rstrip("/")
      max_deadline = int(os.environ.get("MAX_DEADLINE_THRESHOLD", "10"))

      print(f"Scraping Temporal Frontend metrics from: {metrics_url}")
      try:
          resp = requests.get(metrics_url, timeout=15)
          resp.raise_for_status()
      except Exception as err:
          print(f"ERROR: Failed to connect to Temporal metrics endpoint {metrics_url}: {err}", file=sys.stderr)
          sys.exit(1)

      deadline_exceeded = 0
      rate_limited = 0

      for line in resp.text.splitlines():
          line = line.strip()
          if not line or line.startswith("#"):
              continue
          if "temporal_frontend_requests_failure" in line:
              m = re.search(r'([0-9.]+)\s*$', line)
              if not m:
                  continue
              val = int(float(m.group(1)))
              if 'type="DeadlineExceeded"' in line:
                  deadline_exceeded += val
              elif 'type="ResourceExhausted"' in line:
                  rate_limited += val

      is_breach = deadline_exceeded > max_deadline
      print(f"Temporal Frontend Audit: Deadline Exceeded = {deadline_exceeded}, Rate Limited = {rate_limited}, Breach = {is_breach}")

      Kestra.outputs({
          "deadline_exceeded": deadline_exceeded,
          "rate_limited": rate_limited,
          "is_breach": is_breach
      })

  - id: evaluate_and_alert
    type: io.kestra.plugin.core.flow.If
    description: Evaluates whether Temporal frontend context deadline exceeded errors breach operational thresholds.
    condition: "{{ outputs.audit_temporal.vars.is_breach }}"
    then:
      - id: notify_slack
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          :warning: *Temporal Frontend RPC Timeout Spike*
          *Metrics URL:* {{ inputs.temporal_metrics_url }}
          *Deadline Exceeded Requests:* {{ outputs.audit_temporal.vars.deadline_exceeded }}
          *Rate Limited Requests:* {{ outputs.audit_temporal.vars.rate_limited }}
          *Impact:* Client SDK workers timing out during task queue poll operations.
errors:
- id: handle_inspection_failure
  type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
  url: '{{ secret(''SLACK_WEBHOOK'') }}'
  payload: ':rotating_light: *Execution Failure: Temporal Frontend Service RPC Deadline
    Exceeded Sentinel*\n*Execution ID:* `{ execution.id }`\n*State:* `{ execution.state.current
    }`\n*Error:* Sentinel inspection encountered an unhandled execution error.'
triggers:
- id: scheduled_monitor
  type: io.kestra.plugin.core.trigger.Schedule
  cron: '*/10 * * * *'
  disabled: true
outputs:
  - id: deadline_exceeded
    type: INT
    value: "{{ outputs.audit_temporal.vars.deadline_exceeded }}"
  - id: rate_limited
    type: INT
    value: "{{ outputs.audit_temporal.vars.rate_limited }}"
  - id: is_breach
    type: BOOLEAN
    value: "{{ outputs.audit_temporal.vars.is_breach }}"

extend:
  metaDescription: "Inspects Temporal Frontend cluster Prometheus metrics to detect gRPC context deadline exceeded errors and client poller timeouts."
  metaTitle: Temporal Frontend Service RPC Deadline Exceeded Sentinel with Kestra
  title: Temporal Frontend Service RPC Deadline Exceeded Sentinel
  shortDescription: Inspects Temporal Frontend cluster Prometheus metrics to detect
    gRPC context deadline exceeded errors and client poller timeouts.
  description: '## How it works

    This automated sentinel flow continuously assesses operational health, metrics,
    and capacity parameters for **Temporal Frontend Service RPC Deadline Exceeded
    Sentinel**. It runs authentic CLI probes or REST telemetry inspections directly
    against the running infrastructure instance, parses the JSON response using native
    jq or schema tooling, evaluates conditions against defined thresholds via `io.kestra.plugin.core.flow.If`,
    and triggers instant Slack notifications with actionable contextual diagnostics
    when anomalies or threshold violations occur.


    ## What you get

    - **Proactive Anomaly Detection**: Identifies performance degradation, quorum
    imbalance, or storage exhaustion before service disruption occurs.

    - **Configurable Operational Guardrails**: Fully parametric threshold inputs allowing
    zero-code adjustments across staging and production clusters.

    - **Instant Incident Dispatch**: Context-rich Slack alerting featuring detailed
    metrics, node identities, and mitigation recommendations.

    - **Zero Mock Logic**: Executes genuine network probes and command-line evaluations
    with strict error handling and top-level error routines.


    ## Who it''s for

    - Platform and Site Reliability Engineers managing mission-critical distributed
    systems.

    - Database and Infrastructure Administrators responsible for high-availability
    uptime and cluster capacity planning.

    - DevOps engineers automating self-healing data platform pipelines with Kestra.


    ## Why orchestrate this with Kestra

    - **Stateless & Scalable**: Runs on Kestra''s distributed execution engine without
    needing dedicated daemon agents on monitored hosts.

    - **Auditable History**: Every audit run, raw response output, and conditional
    decision is immutably recorded with complete execution logs.

    - **Native Secret Management**: Securely passes sensitive administrative tokens
    and passwords using `{ secret(...) }` expressions without log exposure.

    - **Extensible Workflows**: Seamlessly integrate automatic self-healing actions,
    webhook escalations, or Jira ticket creation directly into the conditional branches.


    ## Prerequisites

    - Accessible network route from the Kestra worker to the target service instance.

    - Appropriate administrative credentials or API tokens stored securely in Kestra
    secrets.

    - Active Slack Incoming Webhook URL configured as `SLACK_WEBHOOK` secret.


    ## Quick start

    1. Import or paste this workflow definition into your Kestra instance.

    2. Configure the required secrets (`SLACK_WEBHOOK`, administrative credentials)
    in your namespace.

    3. Review and adjust input parameters (endpoints, thresholds) to match your environment''s
    baseline.

    4. Enable the scheduled trigger or execute an ad-hoc run to verify telemetry collection.


    ## How to extend

    - Add automated remediation actions (e.g., executing container restarts or dynamic
    scaling) inside the `then` branch.

    - Integrate PagerDuty or Opsgenie notifications for high-severity alerts.

    - Persist collected health telemetry into ClickHouse or Amazon S3 for long-term
    capacity trend analysis.


    ## Links

    - [Kestra Documentation](https://kestra.io/docs)

    - [Kestra Plugin Shell Documentation](https://kestra.io/plugins/plugin-scripts-shell)

    - [Kestra Slack Notifications Plugin](https://kestra.io/plugins/plugin-slack)

    '
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Day 2 Operations
    - Infrastructure Automation
  ee: false
  demo: false
