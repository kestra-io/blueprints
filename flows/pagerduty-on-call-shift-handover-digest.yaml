id: pagerduty-on-call-shift-handover-digest
namespace: company.sre

description: |
  Compiles PagerDuty on-call shift incident digests and escalation metrics via REST API.
  Delivers structured shift transition summaries to Slack channels before incoming engineers take over.

concurrency:
  limit: 1

inputs:
  - id: pagerduty_service_id
    type: STRING
    displayName: PagerDuty Service ID
    defaults: "P123ABC"
    description: Target PagerDuty technical service identifier for incident digest compilation.

  - id: slack_channel
    type: STRING
    displayName: Slack Channel
    defaults: "#oncall-shift-handover"
    description: Slack channel destination for on-call transition and incident digest cards.

  - id: alert_on_unresolved_incidents
    type: BOOL
    displayName: Alert on Unresolved Incidents
    defaults: true
    description: Whether to emphasize active triggered incidents requiring immediate shift transition handover.

triggers:
  - id: daily_shift_handover_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    description: Executes daily at 09:00 UTC to align with engineering on-call shift handover rotations.
    cron: "0 9 * * *"
    disabled: true

tasks:
  - id: fetch_pagerduty_shift_metrics
    type: io.kestra.plugin.scripts.python.Script
    description: Interrogates PagerDuty REST API v2 for active triggered and acknowledged service incidents.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests kestra
    env:
      PD_TOKEN: "{{ secret('PAGERDUTY_API_TOKEN') }}"
      SERVICE_ID: "{{ inputs.pagerduty_service_id }}"
    script: |
      import os
      import sys
      import json
      import requests
      from kestra import Kestra

      token = os.getenv('PD_TOKEN')
      service_id = os.getenv('SERVICE_ID')

      headers = {
          'Authorization': f'Token token={token}',
          'Accept': 'application/vnd.pagerduty+json;version=2',
          'Content-Type': 'application/json'
      }

      base_url = 'https://api.pagerduty.com'
      try:
          params = {
              'service_ids[]': service_id,
              'statuses[]': ['triggered', 'acknowledged'],
              'limit': 25
          }
          resp = requests.get(f'{base_url}/incidents', headers=headers, params=params, timeout=10)
          resp.raise_for_status()
          incidents_data = resp.json().get('incidents', [])
      except Exception as err:
          print(f"Error querying PagerDuty REST API: {err}", file=sys.stderr)
          sys.exit(1)

      unresolved_count = len(incidents_data)
      high_urgency_count = sum(1 for inc in incidents_data if inc.get('urgency') == 'high')
      has_unresolved = unresolved_count > 0

      Kestra.outputs({
          'service_id': service_id,
          'unresolved_incident_count': unresolved_count,
          'high_urgency_incident_count': high_urgency_count,
          'has_unresolved_incidents': has_unresolved,
          'incidents': incidents_data
      })

      report = {
          'service_id': service_id,
          'unresolved_count': unresolved_count,
          'high_urgency_count': high_urgency_count,
          'has_unresolved': has_unresolved,
          'incidents': incidents_data
      }

      with open('pagerduty_handover_report.json', 'w') as f:
          json.dump(report, f, indent=2)

    outputFiles:
      - pagerduty_handover_report.json

  - id: check_unresolved_incidents
    type: io.kestra.plugin.core.flow.If
    description: Evaluates whether any open incidents require acknowledgment during the transition.
    condition: "{{ outputs.fetch_pagerduty_shift_metrics.vars.has_unresolved_incidents }}"
    then:
      - id: notify_slack_shift_handover
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches structured on-call handover briefing card to engineering team on Slack.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "{{ inputs.slack_channel }}",
            "text": "PagerDuty Shift Handover Notice: Unresolved incidents active for service `{{ inputs.pagerduty_service_id }}`.\n• Active Open Incidents: {{ outputs.fetch_pagerduty_shift_metrics.vars.unresolved_incident_count }}\n• High Urgency Incidents: {{ outputs.fetch_pagerduty_shift_metrics.vars.high_urgency_incident_count }}\n• Incoming Engineer Action: Review acknowledged incidents in PagerDuty mobile app or console before accepting shift handover."
          }
    else:
      - id: log_clean_shift_transition
        type: io.kestra.plugin.core.log.Log
        description: Records confirmed all-clear handover status when zero unresolved service incidents exist.
        message: "PagerDuty service {{ inputs.pagerduty_service_id }} is completely clear. Zero unresolved incidents for incoming on-call shift."

  - id: export_shift_manifest
    type: io.kestra.plugin.core.execution.Labels
    description: Tags execution with searchable incident counts and shift status labels.
    labels:
      pagerduty_service: "{{ inputs.pagerduty_service_id }}"
      open_incidents: "{{ outputs.fetch_pagerduty_shift_metrics.vars.unresolved_incident_count | string }}"
      shift_status: "{{ outputs.fetch_pagerduty_shift_metrics.vars.has_unresolved_incidents ? 'UNRESOLVED_HANDOVER' : 'CLEAN_HANDOVER' }}"

outputs:
  - id: unresolved_incident_count
    type: INT
    value: "{{ outputs.fetch_pagerduty_shift_metrics.vars.unresolved_incident_count }}"
  - id: high_urgency_incident_count
    type: INT
    value: "{{ outputs.fetch_pagerduty_shift_metrics.vars.high_urgency_incident_count }}"
  - id: has_unresolved_incidents
    type: BOOLEAN
    value: "{{ outputs.fetch_pagerduty_shift_metrics.vars.has_unresolved_incidents }}"

extend:
  title: PagerDuty On-Call Shift Handover Digest
  metaTitle: PagerDuty On-Call Shift Handover Digest
  shortDescription: Generates automated PagerDuty shift transition digests to summarize active incidents on Slack.
  metaDescription: Compiles PagerDuty on-call shift incident digests and escalation metrics via REST API, delivering structured transition summaries to Slack channels.
  description: |
    This blueprint automates Site Reliability Engineering (SRE) on-call shift transitions by integrating PagerDuty with Slack. Scheduled daily at shift handover intervals (09:00 UTC), it queries the PagerDuty REST API v2 to compile unresolved incidents, escalation statuses, and urgency levels, broadcasting a concise transition brief to engineering channels before incoming on-call engineers assume primary responsibilities.

    ## How it works
    1. **Scheduled Handover Trigger**: The `daily_shift_handover_schedule` trigger (`io.kestra.plugin.core.trigger.Schedule`) executes at 09:00 UTC daily to align with shift rotations.
    2. **PagerDuty Incident Ingestion**: The `fetch_pagerduty_shift_metrics` task (`io.kestra.plugin.scripts.python.Script`) interrogates PagerDuty `/incidents`, parsing active `triggered` and `acknowledged` items for the target technical service.
    3. **Handover Severity Gate**: The `check_unresolved_incidents` flowable task (`io.kestra.plugin.core.flow.If`) evaluates whether any open incidents require acknowledgment during the transition.
    4. **Slack Handover Card Dispatch**: When active incidents exist, `notify_slack_shift_handover` (`io.kestra.plugin.slack.notifications.SlackIncomingWebhook`) delivers an incident briefing card to the on-call channel.
    5. **Clean Transition Confirmation**: When zero unresolved incidents exist, `log_clean_shift_transition` records an all-clear message.
    6. **Manifest Export**: The `export_shift_manifest` task tags the execution with searchable status labels.

    ## Architecture diagram
    ```mermaid
    flowchart TD
        A[Schedule: Daily at 09:00 UTC] --> B[fetch_pagerduty_shift_metrics: Query PagerDuty REST API]
        B --> C{Active Incidents Exist?}
        C -- Yes --> D[notify_slack_shift_handover: Slack Webhook]
        C -- No --> E[log_clean_shift_transition: Log All Clear]
        D --> F[export_shift_manifest: Execution Labels]
        E --> F
    ```

    ## Inputs
    | Name | Type | Default | Description |
    | :--- | :--- | :--- | :--- |
    | `pagerduty_service_id` | STRING | `P123ABC` | Target PagerDuty technical service identifier for incident digest compilation. |
    | `slack_channel` | STRING | `#oncall-shift-handover` | Slack channel destination for on-call transition and incident digest cards. |
    | `alert_on_unresolved_incidents` | BOOL | `true` | Whether to emphasize active triggered incidents requiring immediate shift transition handover. |

    ## Expected outputs
    - `{{ outputs.fetch_pagerduty_shift_metrics.vars.unresolved_incident_count }}`: Count of active triggered and acknowledged incidents.
    - `{{ outputs.fetch_pagerduty_shift_metrics.vars.high_urgency_incident_count }}`: Number of unresolved incidents marked as high urgency.
    - `{{ outputs.fetch_pagerduty_shift_metrics.vars.has_unresolved_incidents }}`: Boolean flag indicating if any open incidents exist.
    - `{{ outputs.fetch_pagerduty_shift_metrics.outputFiles['pagerduty_handover_report.json'] }}`: Structured JSON report detailing incident titles and urgency levels.

    ## Prerequisites
    - PagerDuty technical service configured with on-call escalation policies.
    - PagerDuty REST API Token with read access to incidents and on-call schedules.
    - Slack Incoming Webhook endpoint URL.

    ### Secrets
    - `PAGERDUTY_API_TOKEN`: PagerDuty REST API v2 authentication token.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook endpoint URL.

    ## Quick start
    1. Configure `PAGERDUTY_API_TOKEN` and `SLACK_WEBHOOK_URL` in your Kestra namespace secrets.
    2. Import this flow YAML into your Kestra workspace.
    3. Specify your PagerDuty service identifier in `pagerduty_service_id`.
    4. Click **Execute** in the UI to perform an immediate shift handover incident digest compilation.

    ## Links
    - [Kestra Python Script Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-notifications)
    - [PagerDuty REST API v2 Incidents Reference](https://developer.pagerduty.com/api-reference/)
  tags:
    - Infrastructure
    - Core
  subTags:
    - CI/CD & Deployment
    - Day 2 Operations
  ee: false
  demo: false
