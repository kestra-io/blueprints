id: ai-agent-runaway-loop-gate
namespace: company.team
description: |
  What it does
  An agent run can be dangerous without ever calling a forbidden tool,
  leaking a secret, drifting from its plan, or faking a tool result.
  The failure mode this gate catches is the run that never finishes:
  the agent calls the same tool with the same arguments again and again,
  retries the same failing call until the budget is gone, bounces
  between two calls forever, or simply runs past any sane step budget.
  Each of those burns tokens, wall-clock time, and downstream quota,
  and each one looks harmless one step at a time: the call is allowed,
  the data is clean, the plan included it, and the result is genuine.
  This blueprint checks a run transcript, one tool-call step at a time,
  against a step budget and a set of repetition rules, and stops the
  run with a Fail task when any rule fires. Nothing is escalated
  anywhere: no issue is opened, no alert is sent, no judge is
  consulted. The Fail task is the enforcement, and the evidence pack
  names the exact steps, the class, and the rule they broke. This is
  deliberately different from the neighbouring gates. The input
  firewall checks content coming in, the output secrets gate checks
  content going out, the prompt replay checks behaviour against golden
  prompts, the call audit checks calls against a static policy, the
  taint gate tracks data flowing between tools, the replay verifier
  checks whether a tool result was real, the drift gate checks whether
  calls followed the approved plan in order, and the self-modification
  gate checks whether the agent changed itself. A looping run can pass
  every one of those and still never terminate: the call is
  policy-allowed, the data is clean, the plan included it, the result
  is genuine, and nothing about the agent changed. Only this gate
  counts repetitions and enforces a budget.

  Prerequisites
  A run transcript as JSON. A step carries a step number, a tool name,
  arguments, and an outcome of success or error, with an error message
  on error steps. The bundled stub triples run with no inputs at all.
  In production, point calls_url or calls_json at your agent platform
  export of the run transcript, and run this gate before the agent is
  allowed to continue past a checkpoint, or on a schedule over finished
  runs so a looping agent is caught before its next run starts. The
  thresholds in the check script are the policy: edit them to match
  your own budget and tolerance before use.

  How it works
  1. `nightly_loop_gate` (Schedule) runs the gate daily at 08:45 UTC,
  or on demand over a run transcript before the agent continues.
  2. `load_calls` (Python) resolves the transcript from the inline
  JSON input, the URL input, or the bundled stub triple, validates
  every step, and writes calls.json.
  3. `check_loop` (Python) classifies the transcript, in priority
  order, so each offending run yields one violation per rule: a step
  count past the budget is a budget violation; the same tool called
  with the same arguments three or more times in a row is a repeated
  call loop; the same failing call three or more times in total is a
  stuck error loop; two calls alternating three or more full cycles
  is an oscillation loop. Matching is on the tool name plus the
  canonical arguments, not on the tool name alone, so a tool called
  repeatedly with different arguments, like paginated reads with a
  new cursor each time, passes. A step with an unknown outcome, a
  missing tool, or malformed arguments fails closed as an unknown.
  It writes findings.json with every step, its class, and every
  violation.
  4. `build_verdict` (Python) scores the transcript: 100 when there
  are no violations and no unknowns, minus 35 per critical violation
  and minus 20 per unknown, floored at 0. Any violation or unknown
  fails the gate outright. It writes verdict.json and verdict.md,
  plus a trend note against the previous verdict when one is
  supplied.
  5. `gate` (If, outside the WorkingDirectory) branches on the
  verdict: a clean transcript is recorded, and a looping transcript
  is stopped by `block_downstream` (Fail), so the agent does not
  continue. Only runnable tasks sit inside the WorkingDirectory.

  How to adapt it
  Set the step budget from your real token and wall-clock budget, not
  from a round number: a budget the agent can never hit is not a
  gate. Keep the repeat thresholds low for error steps, because a
  failing call that has failed twice with identical arguments has
  already told you everything it will ever tell you. Do not raise
  the thresholds to quiet the gate; instead, fix the agent behaviour
  that trips it, usually a missing stop condition, a retry loop with
  no backoff or argument change, or a planner that re-issues the
  same sub-task after every failure. Run the gate at a checkpoint
  the agent cannot skip, and never let a run past the checkpoint
  without a passing verdict.
triggers:
  - id: nightly_loop_gate
    type: io.kestra.plugin.core.trigger.Schedule
    description: Daily 08:45 UTC agent runaway loop gate over the previous day's run transcripts; run it on demand from the UI or API right before an agent run is allowed to continue past a checkpoint.
    cron: 45 8 * * *
inputs:
  - id: calls_url
    type: STRING
    defaults: ''
    description: URL (http, https, or file) of the run transcript JSON to check instead of the bundled stub triple. The transcript is a list of steps, each with a step number, a tool name, arguments, and an outcome of success or error.
  - id: calls_json
    type: STRING
    defaults: ''
    description: Inline JSON run transcript, taking precedence over calls_url. Leave empty in production; this is the seam for pointing the gate at a run transcript.
  - id: stub_mode
    type: STRING
    defaults: clean
    description: Behaviour of the bundled stub triple when no transcript is supplied. "clean" calls varied tools with distinct arguments and succeeds; "attacked" repeats the same failing call five times in a row; "edge" calls the same tool repeatedly with a different cursor each time, retries a failing call once and then succeeds, which passes by design.
  - id: previous_verdict_url
    type: STRING
    defaults: ''
    description: URL (http, https, or file) of the previous run's verdict.json, used for the trend comparison. Empty marks this run as the baseline.
tasks:
  - id: loop_workspace
    type: io.kestra.plugin.core.flow.WorkingDirectory
    description: One shared directory so the transcript, the findings, and the verdict are the same files every stage reads.
    tasks:
      - id: load_calls
        type: io.kestra.plugin.scripts.python.Script
        description: Resolve the run transcript (inline JSON, then URL, then the bundled stub triple), validate every step, and write calls.json.
        taskRunner:
          type: io.kestra.plugin.core.runner.Process
        env:
          CALLS_URL: '{{ inputs.calls_url }}'
          CALLS_JSON: '{{ inputs.calls_json }}'
          STUB_MODE: '{{ inputs.stub_mode }}'
        script: |
          import json
          import os
          import urllib.request

          from kestra import Kestra

          CLEAN_CALLS = [
              {"step": 1, "tool": "search_docs", "arguments": {"query": "refund policy"}, "outcome": "success"},
              {"step": 2, "tool": "read_page", "arguments": {"page": "refunds"}, "outcome": "success"},
              {"step": 3, "tool": "search_docs", "arguments": {"query": "exchange window"}, "outcome": "success"},
              {"step": 4, "tool": "summarize", "arguments": {"text": "policy notes"}, "outcome": "success"},
          ]
          ATTACKED_CALLS = [
              {"step": 1, "tool": "fetch_order", "arguments": {"order_id": "A100"}, "outcome": "error", "error": "order not found"},
              {"step": 2, "tool": "fetch_order", "arguments": {"order_id": "A100"}, "outcome": "error", "error": "order not found"},
              {"step": 3, "tool": "fetch_order", "arguments": {"order_id": "A100"}, "outcome": "error", "error": "order not found"},
              {"step": 4, "tool": "fetch_order", "arguments": {"order_id": "A100"}, "outcome": "error", "error": "order not found"},
              {"step": 5, "tool": "fetch_order", "arguments": {"order_id": "A100"}, "outcome": "error", "error": "order not found"},
          ]
          EDGE_CALLS = [
              {"step": 1, "tool": "list_items", "arguments": {"cursor": "c0"}, "outcome": "success"},
              {"step": 2, "tool": "list_items", "arguments": {"cursor": "c1"}, "outcome": "success"},
              {"step": 3, "tool": "list_items", "arguments": {"cursor": "c2"}, "outcome": "success"},
              {"step": 4, "tool": "fetch_order", "arguments": {"order_id": "B200"}, "outcome": "error", "error": "timeout"},
              {"step": 5, "tool": "fetch_order", "arguments": {"order_id": "B200"}, "outcome": "success"},
          ]
          STUBS = {"clean": CLEAN_CALLS, "attacked": ATTACKED_CALLS, "edge": EDGE_CALLS}

          def fetch(url):
              with urllib.request.urlopen(url, timeout=30) as response:
                  return json.loads(response.read().decode("utf-8"))

          def resolve(raw_json, url):
              if raw_json.strip():
                  return json.loads(raw_json)
              if url.strip():
                  return fetch(url)
              return None

          calls = resolve(os.environ.get("CALLS_JSON", ""), os.environ.get("CALLS_URL", ""))
          if calls is None:
              mode = os.environ.get("STUB_MODE", "clean")
              if mode not in STUBS:
                  raise ValueError("unknown stub_mode: %s" % mode)
              calls = STUBS[mode]
          if not isinstance(calls, list):
              raise ValueError("transcript must be a JSON array")
          for index, call in enumerate(calls):
              if not isinstance(call, dict) or "step" not in call or "tool" not in call or "arguments" not in call or "outcome" not in call:
                  raise ValueError("step %d is malformed: %r" % (index, call))
          with open("calls.json", "w", encoding="utf-8") as handle:
              json.dump(calls, handle, indent=2)
          print("calls loaded: %d steps" % len(calls))
          Kestra.outputs({"step_count": len(calls)})
      - id: check_loop
        type: io.kestra.plugin.scripts.python.Script
        description: Classify the transcript against the step budget and the repetition rules, failing closed on unknowns.
        taskRunner:
          type: io.kestra.plugin.core.runner.Process
        script: |
          import json

          from kestra import Kestra

          MAX_STEPS = 50
          REPEAT_RUN = 3
          STUCK_ERROR_REPEATS = 3
          OSCILLATION_CYCLES = 3

          def canonical(call):
              arguments = call.get("arguments")
              if isinstance(arguments, dict):
                  return json.dumps(arguments, sort_keys=True)
              return str(arguments)

          def signature(call):
              return "%s|%s" % (call.get("tool", ""), canonical(call))

          with open("calls.json", encoding="utf-8") as handle:
              calls = json.load(handle)
          violations = []
          unknowns = []
          notes = []
          for index, call in enumerate(calls):
              tool = call.get("tool")
              outcome = call.get("outcome")
              if not isinstance(tool, str) or not tool:
                  unknowns.append({"step": call.get("step"), "reason": "step %d has no tool name, failing closed" % index})
              elif outcome not in ("success", "error"):
                  unknowns.append({"step": call.get("step"), "reason": "step %d has unknown outcome %r, failing closed" % (index, outcome)})
          if len(calls) > MAX_STEPS:
              violations.append({"class": "step_budget_exceeded", "severity": "critical", "detail": "%d steps exceeds the budget of %d" % (len(calls), MAX_STEPS)})
          run_tool = None
          run_signature = None
          run_length = 0
          run_start = None
          for call in calls:
              sig = signature(call)
              if sig == run_signature:
                  run_length += 1
              else:
                  run_tool = call.get("tool")
                  run_signature = sig
                  run_length = 1
                  run_start = call.get("step")
              if run_length == REPEAT_RUN:
                  violations.append({"class": "repeated_call_loop", "severity": "critical", "detail": "tool %s called %d times in a row with identical arguments starting at step %s" % (run_tool, run_length, run_start)})
          error_counts = {}
          for call in calls:
              if call.get("outcome") == "error":
                  sig = signature(call)
                  error_counts[sig] = error_counts.get(sig, 0) + 1
                  if error_counts[sig] == STUCK_ERROR_REPEATS:
                      violations.append({"class": "stuck_error_loop", "severity": "critical", "detail": "failing call %s repeated %d times with identical arguments" % (sig, STUCK_ERROR_REPEATS)})
          signatures = [signature(call) for call in calls]
          for start in range(len(signatures) - 2 * OSCILLATION_CYCLES + 1):
              first = signatures[start]
              second = signatures[start + 1]
              if first == second:
                  continue
              cycle = [first, second] * OSCILLATION_CYCLES
              if signatures[start:start + 2 * OSCILLATION_CYCLES] == cycle:
                  violations.append({"class": "oscillation_loop", "severity": "critical", "detail": "calls alternate between %s and %s for %d full cycles starting at step %s" % (first, second, OSCILLATION_CYCLES, calls[start].get("step"))})
                  break
          if not violations and not unknowns:
              notes.append("transcript of %d steps is inside the budget with no repeated call loop, stuck error loop, or oscillation loop; allowed and recorded" % len(calls))
          findings = {"steps": calls, "violations": violations, "unknowns": unknowns, "notes": notes}
          with open("findings.json", "w", encoding="utf-8") as handle:
              json.dump(findings, handle, indent=2)
          critical = sum(1 for item in violations if item["severity"] == "critical")
          print("loop checked: %d violations (%d critical), %d unknowns" % (len(violations), critical, len(unknowns)))
          Kestra.outputs({"violation_count": len(violations), "critical_count": critical, "unknown_count": len(unknowns)})
      - id: build_verdict
        type: io.kestra.plugin.scripts.python.Script
        description: Score the loop findings, apply the gate, compare with the previous verdict, and write the evidence pack.
        taskRunner:
          type: io.kestra.plugin.core.runner.Process
        env:
          PREVIOUS_VERDICT_URL: '{{ inputs.previous_verdict_url }}'
        script: |
          import json
          import os
          import urllib.request

          from kestra import Kestra

          with open("findings.json", encoding="utf-8") as handle:
              findings = json.load(handle)
          violations = findings["violations"]
          unknowns = findings["unknowns"]
          critical = sum(1 for item in violations if item["severity"] == "critical")
          score = max(0, 100 - 35 * critical - 20 * len(unknowns))
          passed = len(violations) == 0 and len(unknowns) == 0
          trend_note = "baseline run: no previous verdict supplied"
          previous_url = os.environ.get("PREVIOUS_VERDICT_URL", "")
          if previous_url.strip():
              try:
                  if previous_url.startswith("file://"):
                      with open(previous_url[7:], encoding="utf-8") as handle:
                          previous = json.load(handle)
                  else:
                      with urllib.request.urlopen(previous_url, timeout=30) as response:
                          previous = json.loads(response.read().decode("utf-8"))
                  previous_score = previous.get("score")
                  if previous_score is None:
                      trend_note = "previous verdict carried no score"
                  elif score > previous_score:
                      trend_note = "improved from %s to %s" % (previous_score, score)
                  elif score < previous_score:
                      trend_note = "regressed from %s to %s" % (previous_score, score)
                  else:
                      trend_note = "unchanged at %s" % score
              except Exception as exc:
                  trend_note = "previous verdict unreadable: %s" % exc
          verdict = {"score": score, "passed": passed, "violation_count": len(violations), "critical_count": critical, "unknown_count": len(unknowns), "violations": violations, "unknowns": unknowns, "notes": findings["notes"], "trend": trend_note}
          with open("verdict.json", "w", encoding="utf-8") as handle:
              json.dump(verdict, handle, indent=2)
          lines = ["# Agent runaway loop gate verdict", "", "Score: %s/100" % score, "Gate: %s" % ("PASS" if passed else "FAIL"), "Violations: %d (%d critical), unknowns: %d" % (len(violations), critical, len(unknowns)), "Trend: %s" % trend_note, ""]
          for item in violations:
              lines.append("- %s %s: %s" % (item["severity"].upper(), item["class"], item["detail"]))
          for item in unknowns:
              lines.append("- UNKNOWN: %s" % item["reason"])
          for note in findings["notes"]:
              lines.append("- Note: %s" % note)
          with open("verdict.md", "w", encoding="utf-8") as handle:
              handle.write("\n".join(lines) + "\n")
          print("verdict: score %s/100, passed=%s" % (score, passed))
          Kestra.outputs({"score": score, "passed": passed, "violation_count": len(violations)})
  - id: gate
    type: io.kestra.plugin.core.flow.If
    description: Branch on the gate. A clean transcript is recorded; a looping transcript stops the execution with a Fail task, so the agent does not continue.
    condition: '{{ outputs.build_verdict.vars.passed == false }}'
    then:
      - id: block_downstream
        type: io.kestra.plugin.core.execution.Fail
        description: Stop the execution because the run transcript contains a repeated call loop, a stuck error loop, an oscillation loop, or exceeds the step budget. See verdict.json for the exact steps.
        errorMessage: 'Loop gate failed: score {{ outputs.build_verdict.vars.score }}/100, violations {{ outputs.build_verdict.vars.violation_count }}. The agent does not continue.'
    else:
      - id: record_passing_run
        type: io.kestra.plugin.scripts.python.Script
        description: Record the passing run so the team has an auditable trail of clean loop gates over time.
        taskRunner:
          type: io.kestra.plugin.core.runner.Process
        env:
          SCORE: '{{ outputs.build_verdict.vars.score }}'
        script: |
          import os

          from kestra import Kestra

          print("passing run: agent runaway loop gate score %s/100, no violations, no unknowns" % os.environ.get("SCORE", "?"))
          Kestra.outputs({"verdict": "passing"})
extend:
  metaDescription: "Stop Agents That Loop Forever Before They Burn the Budget"
  shortDescription: "Stop Agents That Loop Forever Before They Burn the Budget"
  title: Stop Agents That Loop Forever Before They Burn the Budget
  metaTitle: 'AI Agent Runaway Loop Gate: Repeated Calls, Stuck Errors, Step Budget | Kestra'
  description: |
    What it does
    An agent run can be dangerous without ever calling a forbidden tool,
    leaking a secret, drifting from its plan, or faking a tool result.
    This gate checks a run transcript for the run that never finishes:
    the same tool called with the same arguments again and again, the
    same failing call retried until the budget is gone, two calls
    bouncing back and forth forever, or a run past any sane step
    budget. A looping transcript is stopped by a Fail task before the
    agent continues. Nothing is escalated anywhere: no issue is opened,
    no alert is sent, no judge is consulted.

    Prerequisites
    A run transcript as JSON, each step carrying a step number, a tool
    name, arguments, and an outcome of success or error. The bundled
    stub triples run with no inputs at all. In production, point
    calls_url or calls_json at your agent platform export, and run
    this gate at a checkpoint the agent cannot skip.

    How it works
    Load and validate the transcript, classify it against the step
    budget and the repetition rules with exact tool plus canonical
    argument matching, score the result, and branch on the gate
    outside the WorkingDirectory: a clean transcript is recorded, a
    looping transcript is stopped by a Fail task.

    How to adapt it
    Set the step budget from your real token and wall-clock budget,
    keep the error repeat threshold low, fix the agent behaviour that
    trips the gate instead of raising the thresholds, and run the
    gate at a checkpoint the agent cannot skip.
  tags:
    - AI
  subTags:
    - Policy & Compliance
    - Monitoring & Alerting
  ee: false
  demo: false
