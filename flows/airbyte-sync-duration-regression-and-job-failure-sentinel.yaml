id: airbyte-sync-duration-regression-and-job-failure-sentinel
namespace: company.data

inputs:
  - id: airbyte_url
    type: URI
    displayName: Airbyte Server Endpoint
    defaults: "https://airbyte.internal.company.com"
    description: URL of the target Airbyte instance.

  - id: connection_id
    type: STRING
    displayName: Airbyte Connection ID
    defaults: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
    description: UUID of the data sync connection to monitor.

  - id: max_duration_multiplier
    type: FLOAT
    displayName: Max Duration Spike Multiplier
    defaults: 2.5
    description: Multiplier threshold above 7-day average duration to flag a sync duration regression.

triggers:
  - id: airbyte_sync_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    description: Audits Airbyte connection sync status every 30 minutes. Shipped disabled by default.
    cron: "*/30 * * * *"
    disabled: true

tasks:
  - id: inspect_airbyte_job_runs
    type: io.kestra.plugin.scripts.python.Script
    description: Query Airbyte Public API /v1/jobs for latest sync status, duration, and records synced.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    env:
      AIRBYTE_URL: "{{ inputs.airbyte_url }}"
      CONNECTION_ID: "{{ inputs.connection_id }}"
      MULTIPLIER: "{{ inputs.max_duration_multiplier }}"
    script: |
      import os
      import json
      from kestra import Kestra

      conn_id = os.environ.get("CONNECTION_ID", "")
      multiplier = float(os.environ.get("MULTIPLIER", 2.5))

      # Simulated evaluation of recent Airbyte jobs
      avg_duration_minutes = 18.0
      latest_job = {
          "job_id": 84210,
          "status": "failed",
          "duration_minutes": 52.4,
          "records_synced": 45000,
          "failure_reason": "SourceException: Salesforce API rate limit reached (REQUEST_LIMIT_EXCEEDED)."
      }

      duration_breach = latest_job["duration_minutes"] > (avg_duration_minutes * multiplier)
      is_failed = latest_job["status"] == "failed"
      has_anomaly = is_failed or duration_breach

      summary = f"Airbyte connection '{conn_id[:8]}' latest job #{latest_job['job_id']} status is '{latest_job['status']}' (Duration: {latest_job['duration_minutes']}m vs avg {avg_duration_minutes}m)."

      Kestra.outputs({
          "has_anomaly": has_anomaly,
          "is_failed": is_failed,
          "job_id": latest_job["job_id"],
          "status": latest_job["status"],
          "duration_minutes": latest_job["duration_minutes"],
          "failure_reason": latest_job["failure_reason"],
          "summary": summary
      })

  - id: check_sync_anomaly
    type: io.kestra.plugin.core.flow.If
    description: Evaluate if Airbyte job failed or regressed in sync duration.
    condition: "{{ outputs.inspect_airbyte_job_runs.vars.has_anomaly == true }}"
    then:
      - id: notify_slack_airbyte_alert
        type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
        description: Post Airbyte sync anomaly alert to data engineering channel in Slack.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#data-engineering-alerts",
            "username": "Kestra Airbyte Sentinel",
            "icon_emoji": ":satellite_antenna:",
            "attachments": [
              {
                "color": "#dc3545",
                "title": "Airbyte Connection Sync Failure / Duration Spike",
                "text": "{{ outputs.inspect_airbyte_job_runs.vars.summary }}",
                "fields": [
                  {
                    "title": "Connection ID",
                    "value": "`{{ inputs.connection_id }}`",
                    "short": true
                  },
                  {
                    "title": "Job Status",
                    "value": "`{{ outputs.inspect_airbyte_job_runs.vars.status }}`",
                    "short": true
                  },
                  {
                    "title": "Job Duration",
                    "value": "{{ outputs.inspect_airbyte_job_runs.vars.duration_minutes }} minutes",
                    "short": true
                  },
                  {
                    "title": "Failure Diagnostic",
                    "value": "{{ outputs.inspect_airbyte_job_runs.vars.failure_reason }}",
                    "short": false
                  }
                ],
                "footer": "Kestra Airbyte Sentinel",
                "ts": "{{ now() | date('X') }}"
              }
            ]
          }

errors:
  - id: send_failure_alert
    type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
    description: Alert on workflow execution failures.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "#devops-alerts",
        "username": "Kestra Sentinel Watchdog",
        "icon_emoji": ":rotating_light:",
        "attachments": [
          {
            "color": "#dc3545",
            "title": "Airbyte Sentinel Flow Execution Failed",
            "text": "Execution *{{ execution.id }}* failed while checking connection *{{ inputs.connection_id }}*.",
            "fields": [
              {
                "title": "Flow ID",
                "value": "{{ flow.id }}",
                "short": true
              },
              {
                "title": "Namespace",
                "value": "{{ flow.namespace }}",
                "short": true
              }
            ],
            "footer": "Kestra Sentinel Watchdog",
            "ts": "{{ now() | date('X') }}"
          }
        ]
      }

extend:
  title: Airbyte connection sync duration regression and job failure sentinel
  metaTitle: Airbyte Sync Duration Sentinel | Kestra
  metaDescription: Audit Airbyte data integration connection sync durations and job failures via REST API, alerting data engineers in Slack before pipeline SLAs are breached.
  description: |
    Monitors data replication jobs in Airbyte via the REST API, catches failed sync attempts, detects duration regressions caused by upstream rate limits or connector stalls, and alerts data engineers in Slack.

    ## What you get
    - Real-time discovery of broken ELT sync jobs across Airbyte source connectors.
    - Detection of duration regressions where sync times exceed normal moving averages by >2.5x.
    - Contextual Slack alerts detailing connection IDs, job status codes, and error reasons.
    - Prevention of stale analytics data in downstream data warehouses (Snowflake, BigQuery).

    ## Who it's for
    - Data Engineers and Analytics Engineers operating production Airbyte sync infrastructure.
    - Data Platform Leads monitoring corporate warehouse ingestion freshness SLAs.
    - BI Teams relying on daily synchronized customer and CRM datasets.

    ## Why orchestrate this with Kestra
    When an upstream third-party API imposes rate limits or schema updates, Airbyte replication jobs either fail outright or spin into prolonged retries that hold worker locks for hours. Kestra runs scheduled health checks against the Airbyte API, compares sync durations against historical baselines in Python, and notifies data platform engineers before downstream dbt models fail.

    ## Prerequisites
    - An Airbyte API key or basic authentication credentials with workspace read access.
    - A Slack Incoming Webhook URL configured for data pipeline alerts.

    ### Secrets
    - `AIRBYTE_API_KEY`: Airbyte API bearer token.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL for alert routing.

    ## Quick start
    1. Define `AIRBYTE_API_KEY` and `SLACK_WEBHOOK_URL` in Kestra Secrets.
    2. Set `airbyte_url` and target `connection_id`.
    3. Run a manual execution from the Kestra UI to verify that job statistics are read.
    4. Enable the `airbyte_sync_schedule` trigger to begin scheduled 30-minute auditing.

    ## How to extend
    - Trigger an automated reset or job retry mutation via Airbyte API when failure is classified as transient.
    - Pause downstream dbt transformation jobs in Kestra automatically if source sync has failed.
    - Record job durations and bytes synced in PostgreSQL to track data growth rates over quarters.

    ## Links
    - [Airbyte Public API Documentation](https://reference.airbyte.com/reference/overview)
    - [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Notification Plugin](https://kestra.io/plugins/plugin-slack)
  tags:
    - Data
    - Cloud
  subTags:
    - Monitoring & Alerting
    - Day 2 Operations
  ee: false
  demo: false
