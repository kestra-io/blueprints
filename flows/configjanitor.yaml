id: configjanitor
namespace: company.team
description: Finds ConfigMaps and Secrets no pod references, deletes them, and reports the cleanup on Slack.

labels:
  project: configjanitor
  team: platform

inputs:
  - id: namespace
    type: STRING
    displayName: "Namespace"
    description: the namespace whose configs to clean
    defaults: default
  - id: dry_run
    type: BOOL
    displayName: "Dry run"
    description: when true, only reports what would be deleted without deleting anything
    defaults: true
  - id: slack_webhook
    type: STRING
    displayName: "Slack Webhook URL"
    description: Incoming webhook URL of the Slack channel for the cleanup report

triggers:
  - id: schedule
    type: io.kestra.plugin.core.trigger.Schedule
    description: cleans up unused configs every Sunday morning
    cron: "0 8 * * 0"
    timezone: UTC
    inputs:
      namespace: default
      dry_run: true
      slack_webhook: "{{ secret('SLACK_WEBHOOK') }}"

tasks:
  - id: list_resources
    type: io.kestra.plugin.scripts.shell.Commands
    description: lists configmaps, secrets, and pods in the namespace as JSON
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      user: "0"
    containerImage: bitnami/kubectl
    inputFiles:
      client.crt: "{{ secret('CLIENT_CRT') }}"
      client.key: "{{ secret('CLIENT_KEY') }}"
    commands:
      - kubectl get configmaps -n {{ inputs.namespace }} -o json --client-certificate=client.crt --client-key=client.key --server={{ secret('MASTERURL') }} --insecure-skip-tls-verify=true > configmaps.json
      - kubectl get secrets -n {{ inputs.namespace }} -o json --client-certificate=client.crt --client-key=client.key --server={{ secret('MASTERURL') }} --insecure-skip-tls-verify=true > secrets.json
      - kubectl get pods -n {{ inputs.namespace }} -o json --client-certificate=client.crt --client-key=client.key --server={{ secret('MASTERURL') }} --insecure-skip-tls-verify=true > pods.json
    outputFiles:
      - configmaps.json
      - secrets.json
      - pods.json

  - id: find_unused
    type: io.kestra.plugin.scripts.python.Script
    description: finds configs no pod references through env, volumes, or image pull secrets
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      user: "0"
    containerImage: python:3.11
    dependencies:
      - kestra
    outputFiles:
      - unused.txt
    script: |
      import json
      from kestra import Kestra

      namespace = """{{ inputs.namespace }}"""
      dry_run = """{{ inputs.dry_run }}""".strip().lower() == "true"

      with open("""{{ outputs.list_resources.outputFiles['configmaps.json'] }}""") as f:
          configmaps = json.load(f)['items']
      with open("""{{ outputs.list_resources.outputFiles['secrets.json'] }}""") as f:
          secrets = json.load(f)['items']
      with open("""{{ outputs.list_resources.outputFiles['pods.json'] }}""") as f:
          pods = json.load(f)['items']

      # every (kind, name) pair a pod actually references
      referenced = set()
      for pod in pods:
          spec = pod.get('spec', {})
          for container in spec.get('containers', []) + spec.get('initContainers', []):
              for ef in container.get('envFrom', []) or []:
                  if 'configMapRef' in ef:
                      referenced.add(('configmap', ef['configMapRef']['name']))
                  if 'secretRef' in ef:
                      referenced.add(('secret', ef['secretRef']['name']))
              for e in container.get('env', []) or []:
                  vf = e.get('valueFrom', {})
                  if 'configMapKeyRef' in vf:
                      referenced.add(('configmap', vf['configMapKeyRef']['name']))
                  if 'secretKeyRef' in vf:
                      referenced.add(('secret', vf['secretKeyRef']['name']))
          for vol in spec.get('volumes', []) or []:
              if 'configMap' in vol:
                  referenced.add(('configmap', vol['configMap']['name']))
              if 'secret' in vol:
                  referenced.add(('secret', vol['secret']['name']))
              if 'projected' in vol:
                  for src in vol['projected'].get('sources', []) or []:
                      if 'configMap' in src:
                          referenced.add(('configmap', src['configMap']['name']))
                      if 'secret' in src:
                          referenced.add(('secret', src['secret']['name']))
          for ips in spec.get('imagePullSecrets', []) or []:
              referenced.add(('secret', ips['name']))

      unused = []
      for cm in configmaps:
          name = cm['metadata']['name']
          if ('configmap', name) not in referenced:
              unused.append({'kind': 'configmap', 'name': name})
      for secret in secrets:
          name = secret['metadata']['name']
          if ('secret', name) not in referenced:
              unused.append({'kind': 'secret', 'name': name})

      # one kind/name per line for the delete step to read
      with open('unused.txt', 'w') as f:
          for u in unused:
              f.write(f"{u['kind']}/{u['name']}\n")

      if dry_run:
          title = f"*ConfigJanitor - dry run in '{namespace}'*"
          tail = "would delete {n} unused config(s). set dry_run to false to actually clean."
      else:
          title = f"*ConfigJanitor - cleaned '{namespace}'*"
          tail = "deleted {n} unused config(s)."
      lines = [title, ""]
      for u in sorted(unused, key=lambda x: (x['kind'], x['name'])):
          lines.append(f"- *{u['kind']}/{u['name']}*: not referenced by any pod")
      lines.append("")
      lines.append(tail.format(n=len(unused)))
      summary_text = "\n".join(lines)

      Kestra.outputs({
          'unused': unused,
          'count': len(unused),
          'summary_text': summary_text,
      })

  - id: maybe_clean
    type: io.kestra.plugin.core.flow.If
    description: only acts when there is something unused to report
    condition: "{{ outputs.find_unused.vars.count > 0 }}"
    then:
      - id: do_clean
        type: io.kestra.plugin.core.flow.If
        description: deletes the unused configs, live mode only
        condition: "{{ inputs.dry_run == false }}"
        then:
          - id: delete_unused
            type: io.kestra.plugin.scripts.shell.Commands
            description: deletes each unused configmap and secret
            taskRunner:
              type: io.kestra.plugin.scripts.runner.docker.Docker
              user: "0"
            containerImage: bitnami/kubectl
            inputFiles:
              client.crt: "{{ secret('CLIENT_CRT') }}"
              client.key: "{{ secret('CLIENT_KEY') }}"
            commands:
              - |
                while read -r line; do
                  if [ -n "$line" ]; then
                    kind=$(echo "$line" | cut -d/ -f1)
                    name=$(echo "$line" | cut -d/ -f2-)
                    kubectl delete "$kind" "$name" -n {{ inputs.namespace }} --client-certificate=client.crt --client-key=client.key --server={{ secret('MASTERURL') }} --insecure-skip-tls-verify=true
                  fi
                done < {{ outputs.find_unused.outputFiles['unused.txt'] }}
      - id: send_summary
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: posts the cleanup summary to Slack
        url: "{{ inputs.slack_webhook }}"
        messageText: "{{ outputs.find_unused.vars.summary_text }}"

extend:
  title: "ConfigJanitor - Kubernetes unused ConfigMap and Secret cleaner"
  shortDescription: "Deletes ConfigMaps and Secrets no pod references and reports the cleanup on Slack."
  metaTitle: "ConfigJanitor: Kubernetes unused config cleaner blueprint for Kestra"
  metaDescription: "A Kestra blueprint that finds ConfigMaps and Secrets no pod references, deletes them safely, and posts a Slack summary, with a safe dry-run default."
  tags:
    - Infrastructure
  subTags:
    - Kubernetes Operations
    - Infrastructure Automation
  ee: false
  demo: false
  description: |
    ## How it works

    1. `list_resources` (`io.kestra.plugin.scripts.shell.Commands`) dumps the namespace's ConfigMaps, Secrets, and Pods as JSON with kubectl.
    2. `find_unused` (`io.kestra.plugin.scripts.python.Script`) builds the set of every config a pod actually references: `envFrom`, `env.valueFrom`, volume mounts, projected volume sources, and `imagePullSecrets`. Anything not in that set is unused and lands in `unused.txt`.
    3. `maybe_clean` (`io.kestra.plugin.core.flow.If`) runs only when something is unused. Inside it, `do_clean` runs only in live mode (`dry_run: false`) and deletes each unused config with kubectl. `send_summary` always posts the report to Slack: what would be deleted in dry-run mode, what was deleted in live mode.
    4. There is no KV state in this flow, and that is deliberate. A janitor does not need memory: once a config is deleted it is gone, and dry-run mode is a report, not an alert.

    ## What you get

    - Automatic cleanup of config sprawl on a schedule: leftover ConfigMaps and Secrets from deleted or reworked workloads.
    - A Slack report every run that found something: which configs, and the fact that no pod references them.
    - Safety by default: `dry_run` is true unless you explicitly turn it off, and only unreferenced configs are ever deleted.
    - Quiet runs when everything is referenced.

    ## Who it's for

    Anyone running Kubernetes clusters where ConfigMaps and Secrets pile up: old app configs, rotated secrets nobody removed, experiment leftovers. Works in any namespace.

    ## Why orchestrate this with Kestra

    A shell script on a cron server can diff kubectl output, but then you need somewhere to hold the cluster credentials, a place to see the run history when a config got deleted that should not have been, and a safe dry-run mode you can trust. Kestra gives you all three: credentials stay in secrets out of the YAML, every run keeps its logs and outputs where you can audit them, and the dry-run default means the first run can never surprise you.

    ## Prerequisites

    - A Kubernetes cluster with ConfigMaps, Secrets, and Pods you can list and delete.
    - A kubeconfig client certificate and key with permissions to get, list, and delete ConfigMaps and Secrets in the target namespace.
    - Kestra with the Docker task runner available (used for the kubectl and Python steps).
    - A Slack Incoming Webhook URL.

    ### Secrets

    | Secret | What it is |
    | --- | --- |
    | `CLIENT_CRT` | base64-encoded client certificate from your kubeconfig |
    | `CLIENT_KEY` | base64-encoded client key from your kubeconfig |
    | `MASTERURL` | base64-encoded Kubernetes API server URL, reachable from inside the Kestra container |
    | `SLACK_WEBHOOK` | base64-encoded Slack Incoming Webhook URL |

    In Kestra OSS, secrets come from environment variables prefixed with `SECRET_` and must be base64-encoded. If the API URL uses `127.0.0.1` or `localhost`, replace it with `host.docker.internal` so the Kestra container can reach it.

    ## Quick start

    1. Start Kestra with the four secrets above as `SECRET_` environment variables.
    2. Import this flow and run it with your `namespace` and `dry_run: true`: the Slack report lists what would be deleted, and nothing is touched.
    3. Check the list. If it looks right, run once with `dry_run: false`: the unused configs are deleted and the Slack report says so.
    4. Run again: quiet, nothing unused left.

    ## How to extend

    - Exclude configs by name pattern (like `kube-*`) with a filter in the Python step.
    - Also check Deployments scaled to zero by listing workload specs, not just running pods.
    - Run across all namespaces by looping the namespace input with a ForEach task.
    - Route reports to PagerDuty or Opsgenie by swapping the Slack task for another notification task.

    ## Inputs

    | Input | Type | Default | What it does |
    | --- | --- | --- | --- |
    | `namespace` | STRING | `default` | the namespace whose configs to clean |
    | `dry_run` | BOOL | `true` | when true, only reports what would be deleted without deleting anything |
    | `slack_webhook` | STRING | (required) | Incoming webhook URL of the Slack channel for the cleanup report |

    ## Links

    - [Kestra blueprint catalog](https://kestra.io/blueprints)
    - [Kubernetes ConfigMaps documentation](https://kubernetes.io/docs/concepts/configuration/configmap/)
    - [Kestra secrets documentation](https://kestra.io/docs/concepts/secrets)

    ## Pitfalls

    - `dry_run` defaults to true for a reason. Flip it to false only after you have seen a dry-run report and you trust the list.
    - "Unused" means not referenced by any running pod. A config used by a Deployment scaled to zero, an external operator, or a CI pipeline counts as unused here. The dry-run report is your chance to catch those.
    - Secrets deserve an extra look before live mode. Deleting a Secret is easy to do and annoying to reconstruct if something outside the cluster needed it.
    - The flow lists pods, not workload definitions. If you want scaled-to-zero coverage, extend the Python step to also read Deployments, StatefulSets, and DaemonSets.
