id: postgres-deadlock-detection-frequency-sentinel
namespace: company.database
description: Audits PostgreSQL database statistics to detect deadlock storms and aborted transaction spikes impacting application reliability.

inputs:
  - id: db_host
    type: STRING
    defaults: "postgres.internal"
    description: PostgreSQL database server hostname or IP.
  - id: db_port
    type: INT
    defaults: 5432
    description: PostgreSQL server port.
  - id: db_name
    type: STRING
    defaults: "postgres"
    description: PostgreSQL database name.
  - id: db_user
    type: STRING
    defaults: "postgres"
    description: PostgreSQL administrative user.
  - id: deadlock_threshold
    type: INT
    defaults: 5
    description: Number of deadlocks detected in pg_stat_database requiring DBA intervention.

tasks:
  - id: query_deadlocks
    type: io.kestra.plugin.jdbc.postgresql.Query
    url: "jdbc:postgresql://{{ inputs.db_host }}:{{ inputs.db_port }}/{{ inputs.db_name }}"
    username: "{{ inputs.db_user }}"
    password: "{{ secret('POSTGRES_PASSWORD') }}"
    sql: |
      SELECT 
          datname,
          deadlocks,
          conflicts,
          xact_rollback,
          stats_reset
      FROM pg_stat_database
      WHERE deadlocks > {{ inputs.deadlock_threshold }}
        AND datname NOT IN ('template0', 'template1')
      ORDER BY deadlocks DESC;
    fetchType: FETCH

  - id: evaluate_deadlock_frequency
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.query_deadlocks.rows ? outputs.query_deadlocks.rows | length > 0 : false }}"
    then:
      - id: notify_dba_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#dba-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 PostgreSQL Database Deadlock Spike Alert",
                "text": "Detected *{{ outputs.query_deadlocks.rows | length }}* database(s) exceeding deadlock threshold *{{ inputs.deadlock_threshold }}*. Deadlock statistics: {{ outputs.query_deadlocks.rows }}. Impact: Applications are encountering aborted transactions (`40P01 deadlock_detected`), degrading user experience and checkout throughput.",
                "footer": "Kestra Database Sentinel • Postgres Deadlocks"
              }
            ]
          }

outputs:
  - id: deadlocked_databases_count
    type: INT
    value: "{{ outputs.query_deadlocks.rows ? outputs.query_deadlocks.rows | length : 0 }}"
  - id: is_alerting
    type: BOOLEAN
    value: "{{ outputs.query_deadlocks.rows ? outputs.query_deadlocks.rows | length > 0 : false }}"

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#dba-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ Postgres Deadlock Sentinel Execution Failure",
            "text": "The PostgreSQL deadlock audit workflow encountered a database query failure. Please check database reachability and credentials.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  metaDescription: Audits PostgreSQL database statistics to detect deadlock storms and aborted transaction spikes impacting application reliability.
  metaTitle: PostgreSQL Deadlock Detection Frequency and Transaction Rollback Sentinel with Kestra
  title: PostgreSQL Deadlock Detection Frequency and Transaction Rollback Sentinel
  shortDescription: Audits PostgreSQL database statistics to detect deadlock storms and aborted transaction spikes impacting application reliability.
  description: |
    ## How it works
    This workflow connects to PostgreSQL via the native JDBC plugin and samples `pg_stat_database`. It inspects cumulative `deadlocks` and `xact_rollback` metrics across all non-template databases. If the deadlock count exceeds the configured operational threshold, an automated Slack alert is immediately dispatched with database names, rollback volumes, and statistics reset timestamps.

    ## What you get
    - Proactive alerting on application concurrency bugs and improper lock acquisition ordering.
    - Contextual transaction rollback telemetry to assess customer impact.
    - Prevents cascading database connection exhaustion caused by deadlocked transactions.

    ## Who it's for
    - DBAs and Backend Software Engineers diagnosing concurrency conflicts in relational databases.
    - SREs tracking database stability and operational SLA compliance.

    ## Why orchestrate this with Kestra
    - **Native Connectivity**: Direct JDBC connection eliminates the need for external agents or psql binaries.
    - **Automated Workflow Orchestration**: Combine SQL sampling with notification and webhook integrations in a single declarative YAML flow.
    - **Flexible Parameters**: Easily override alert thresholds per database cluster or tier.

    ## Prerequisites
    - PostgreSQL database credentials with access to `pg_stat_database`.
    - Secrets `POSTGRES_PASSWORD` and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import this blueprint into Kestra.
    2. Set up connection inputs and secrets.
    3. Run the workflow or schedule it every 15 minutes.

    ## Links
    - [PostgreSQL Database Statistics](https://www.postgresql.org/docs/current/monitoring-stats.html#PG-STAT-DATABASE-VIEW)
    - [Kestra PostgreSQL Plugin](https://kestra.io/plugins/plugin-jdbc-postgres)
  tags:
    - Data
    - Infrastructure
  subTags:
    - ELT & Data Landing
    - Day 2 Operations
  ee: false
  demo: false
