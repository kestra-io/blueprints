id: budget-commitment-control
namespace: company.team

description: |
  Daily budget control on purchase requisitions: for every requisition waiting to become a
  purchase order, compute what is left of its cost centre's budget after actual spend and
  open commitments (encumbrances), spread multi-month commitments over the months they fall
  in, release commitments of closed or cancelled POs, approve what fits, route what does not
  to the budget owner with the transfer that would fund it, block requisitions split to stay
  under an approval limit, and report the forecast overrun per cost centre.

inputs:
  - id: as_of
    type: STRING
    displayName: As of
    defaults: "2026-09-15"
    validator: ^\d{4}-\d{2}-\d{2}$

  - id: scenario
    type: SELECT
    displayName: Demo scenario
    description: ISSUES adds a requisition for a cost centre with no budget and a requisition with a negative amount, which must stop the run.
    values:
      - CLEAN
      - ISSUES
    defaults: CLEAN

  - id: tolerance_pct
    type: FLOAT
    displayName: Over-budget tolerance (%)
    description: A requisition may take the cost centre this far over its annual budget and still be approved automatically.
    defaults: 2.0

  - id: approvals
    type: JSON
    displayName: Budget owner approvals
    description: >-
      Requisitions approved over budget by the budget owner, keyed by requisition,
      for example {"PR-1042": "J. Doe (Marketing)"}.
    defaults: "{}"

variables:
  state_key: budget_commitments
  pack_dir: "budget-control/{{ inputs.as_of }}"

concurrency:
  limit: 1

triggers:
  - id: every_morning
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 7 * * 1-5"
    disabled: true
    inputs:
      as_of: "{{ trigger.date | date('yyyy-MM-dd') }}"

tasks:
  - id: state
    type: io.kestra.plugin.core.output.OutputValues
    description: Requisitions already approved in earlier runs (now commitments).
    values:
      s: "{{ kv(vars.state_key, errorOnMissing=false) ?? {'approved': {}} | toJson }}"

  - id: control
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: >
      One DuckDB session: annual budgets by cost centre and account, actuals, purchase orders
      and receipts, and the requisition queue (demo generator or your ERP and procurement
      tool), committed spend, available budget, decisions in queue order, split detection,
      funding suggestions, the full-year forecast and the checks.
    outputFiles:
      - decisions
      - cost_centres
      - blockers
    fetchType: FETCH_ONE
    sql: |
      SET VARIABLE d = DATE '{{ inputs.as_of }}';
      SET VARIABLE y0 = make_date(year(DATE '{{ inputs.as_of }}'), 1, 1);
      SET VARIABLE y1 = make_date(year(DATE '{{ inputs.as_of }}'), 12, 31);

      -- =======================================================================
      -- Budgets, actuals and purchase orders. Replace with your ERP.
      -- =======================================================================
      CREATE TABLE budgets (cost_centre VARCHAR, owner VARCHAR, account VARCHAR, annual_budget DOUBLE);
      INSERT INTO budgets VALUES
        ('CC-100', 'Marketing director', 'Agencies and media', 900000), ('CC-100', 'Marketing director', 'Events', 300000),
        ('CC-200', 'CTO', 'Software subscriptions', 600000), ('CC-200', 'CTO', 'Contractors', 800000),
        ('CC-300', 'Operations director', 'Facilities', 450000), ('CC-300', 'Operations director', 'Maintenance', 250000),
        ('CC-400', 'CFO', 'Professional fees', 350000), ('CC-400', 'CFO', 'Software subscriptions', 120000);
      -- Spend so far this year at ~60-90% of the time elapsed, varying by line.
      CREATE TABLE actuals AS
      SELECT cost_centre, account, round(annual_budget * date_diff('day', getvariable('y0'), getvariable('d')) / 365.0
                                         * CASE cost_centre || account WHEN 'CC-100Events' THEN 1.25 WHEN 'CC-200Contractors' THEN 1.05 ELSE 0.6 + (hash(cost_centre || account) % 30)::INT / 100.0 END, 2) AS spent
      FROM budgets;
      -- Open POs: committed but not yet received. A PO spread over months commits only
      -- the months up to year end. Closed and cancelled POs release their commitment.
      CREATE TABLE purchase_orders (po VARCHAR, cost_centre VARCHAR, account VARCHAR, total DOUBLE, received DOUBLE, start_month DATE, months INT, status VARCHAR);
      INSERT INTO purchase_orders VALUES
        ('PO-501', 'CC-100', 'Agencies and media', 240000, 80000, DATE '2026-07-01', 12, 'OPEN'),
        ('PO-502', 'CC-100', 'Events', 60000, 0, DATE '2026-10-01', 1, 'OPEN'),
        ('PO-503', 'CC-200', 'Contractors', 180000, 60000, DATE '2026-08-01', 6, 'OPEN'),
        ('PO-504', 'CC-200', 'Software subscriptions', 96000, 0, DATE '2026-10-01', 12, 'OPEN'),
        ('PO-505', 'CC-300', 'Facilities', 40000, 40000, DATE '2026-05-01', 1, 'CLOSED'),
        ('PO-506', 'CC-300', 'Maintenance', 30000, 5000, DATE '2026-06-01', 1, 'CANCELLED'),
        ('PO-507', 'CC-400', 'Professional fees', 90000, 30000, DATE '2026-09-01', 3, 'OPEN');

      -- The requisition queue, in the order requisitions were raised.
      CREATE TABLE requisitions (pr VARCHAR, raised_at TIMESTAMP, requester VARCHAR, cost_centre VARCHAR, account VARCHAR, vendor VARCHAR, amount DOUBLE, start_month DATE, months INT);
      INSERT INTO requisitions VALUES
        ('PR-1040', getvariable('d') - INTERVAL 2 DAY, 'A. Rossi', 'CC-100', 'Agencies and media', 'Brightline Media', 45000, DATE '2026-10-01', 3),
        ('PR-1041', getvariable('d') - INTERVAL 2 DAY + INTERVAL 1 HOUR, 'A. Rossi', 'CC-100', 'Events', 'Expo Hall Lyon', 38000, DATE '2026-11-01', 1),
        ('PR-1042', getvariable('d') - INTERVAL 1 DAY, 'B. Chen', 'CC-200', 'Contractors', 'DevForce', 120000, DATE '2026-10-01', 3),
        ('PR-1043', getvariable('d') - INTERVAL 1 DAY, 'B. Chen', 'CC-200', 'Software subscriptions', 'ObserveIt', 24000, DATE '2026-10-01', 12),
        ('PR-1044', getvariable('d') - INTERVAL 20 HOUR, 'C. Diaz', 'CC-300', 'Maintenance', 'LiftCare', 9500, DATE '2026-09-01', 1),
        ('PR-1045', getvariable('d') - INTERVAL 19 HOUR, 'C. Diaz', 'CC-300', 'Maintenance', 'LiftCare', 9800, DATE '2026-09-01', 1),
        ('PR-1046', getvariable('d') - INTERVAL 18 HOUR, 'C. Diaz', 'CC-300', 'Maintenance', 'LiftCare', 9700, DATE '2026-09-01', 1),
        ('PR-1047', getvariable('d') - INTERVAL 4 HOUR, 'D. Kaur', 'CC-400', 'Professional fees', 'Audit Partners', 35000, DATE '2026-11-01', 2),
        ('PR-1048', getvariable('d') - INTERVAL 2 HOUR, 'E. Novak', 'CC-100', 'Agencies and media', 'Pixel Studio', 18000, DATE '2026-10-01', 1);
      {% if inputs.scenario == 'ISSUES' %}
      INSERT INTO requisitions VALUES
        ('PR-1050', getvariable('d') - INTERVAL 1 HOUR, 'F. Ali', 'CC-900', 'Travel', 'Air Co', 5000, DATE '2026-10-01', 1),
        ('PR-1051', getvariable('d') - INTERVAL 1 HOUR, 'F. Ali', 'CC-400', 'Professional fees', 'Credit note', -2000, DATE '2026-10-01', 1);
      {% endif %}
      -- Approval limit per requisition without the budget owner.
      SET VARIABLE approval_limit = 10000;

      -- =======================================================================
      -- Checks.
      -- =======================================================================
      CREATE TABLE blockers AS
      SELECT 'NO_BUDGET_LINE' AS code, pr AS ref, cost_centre || ' / ' || account || ' has no budget for the year' AS detail
        FROM requisitions r WHERE NOT EXISTS (SELECT 1 FROM budgets b WHERE b.cost_centre = r.cost_centre AND b.account = r.account)
      UNION ALL SELECT 'NON_POSITIVE_AMOUNT', pr, 'Amount ' || amount FROM requisitions WHERE amount <= 0;

      -- =======================================================================
      -- Commitments falling in this year: the unreceived part of each open PO
      -- spread evenly over its months, counting only months up to year end.
      -- =======================================================================
      CREATE MACRO in_year(total, start_month, months) AS
        total * greatest(least(months, date_diff('month', start_month, getvariable('y1')) + 1), 0) / months;
      CREATE TABLE commitments AS
      SELECT cost_centre, account, sum(in_year(total - received, start_month, months)) AS committed
      FROM purchase_orders WHERE status = 'OPEN' GROUP BY cost_centre, account;
      -- Requisitions approved in earlier runs and not yet on a PO count as commitments too.
      CREATE TABLE prior_approved AS
      SELECT r.cost_centre, r.account, sum(in_year(r.amount, r.start_month, r.months)) AS committed
      FROM requisitions r JOIN json_each('{{ outputs.state.values.s | jq(".approved") | first | toJson }}') a ON a.key = r.pr GROUP BY r.cost_centre, r.account;

      CREATE TABLE position AS
      SELECT b.cost_centre, b.owner, b.account, b.annual_budget, a.spent, coalesce(c.committed, 0) + coalesce(p.committed, 0) AS committed,
             b.annual_budget - a.spent - coalesce(c.committed, 0) - coalesce(p.committed, 0) AS available
      FROM budgets b JOIN actuals a USING (cost_centre, account) LEFT JOIN commitments c USING (cost_centre, account) LEFT JOIN prior_approved p USING (cost_centre, account);

      -- =======================================================================
      -- Decisions in queue order: each requisition consumes the budget left by
      -- the ones raised before it. Splits are judged on the group.
      -- =======================================================================
      CREATE TABLE queue AS
      SELECT r.*, in_year(r.amount, r.start_month, r.months) AS this_year,
             sum(in_year(r.amount, r.start_month, r.months)) OVER (PARTITION BY r.cost_centre, r.account ORDER BY r.raised_at, r.pr ROWS UNBOUNDED PRECEDING) AS cum_this_year,
             p.available, p.annual_budget, p.owner,
             (SELECT count(*) FROM requisitions x WHERE x.requester = r.requester AND x.vendor = r.vendor AND abs(date_diff('hour', x.raised_at, r.raised_at)) <= 48) AS same_vendor_48h,
             (SELECT sum(amount) FROM requisitions x WHERE x.requester = r.requester AND x.vendor = r.vendor AND abs(date_diff('hour', x.raised_at, r.raised_at)) <= 48) AS group_amount
      FROM requisitions r JOIN position p USING (cost_centre, account)
      WHERE r.pr NOT IN (SELECT key FROM json_each('{{ outputs.state.values.s | jq(".approved") | first | toJson }}')) AND r.amount > 0;

      CREATE TABLE given AS SELECT key AS pr, trim(value::VARCHAR, '"') AS approved_by FROM json_each('{{ inputs.approvals | toJson }}');
      CREATE TABLE decisions AS
      SELECT q.pr, q.requester, q.cost_centre, q.account, q.vendor, q.amount, round(q.this_year, 2) AS this_year,
             round(q.available - (q.cum_this_year - q.this_year), 2) AS available_before, round(q.available - q.cum_this_year, 2) AS available_after,
             CASE
               WHEN q.same_vendor_48h > 1 AND q.amount <= getvariable('approval_limit') AND q.group_amount > getvariable('approval_limit') THEN 'BLOCKED_SPLIT'
               WHEN q.available - q.cum_this_year >= -q.annual_budget * {{ inputs.tolerance_pct }} / 100 THEN 'APPROVED'
               WHEN g.approved_by IS NOT NULL THEN 'APPROVED_BY_OWNER'
               ELSE 'NEEDS_BUDGET_OWNER' END AS decision,
             g.approved_by, q.owner,
             CASE WHEN q.same_vendor_48h > 1 AND q.amount <= getvariable('approval_limit') AND q.group_amount > getvariable('approval_limit')
                  THEN q.same_vendor_48h || ' requisitions to ' || q.vendor || ' by ' || q.requester || ' within 48 hours total ' || q.group_amount || ', above the ' || getvariable('approval_limit') || ' limit. Raise one requisition' END AS split_detail
      FROM queue q LEFT JOIN given g USING (pr) ORDER BY q.raised_at;

      -- Funding suggestion for what needs the owner: the other budget lines of the same
      -- cost centre with unused budget after this run.
      CREATE TABLE after_run AS
      SELECT p.cost_centre, p.account, p.owner, p.annual_budget, p.spent, p.committed + coalesce(sum(d.this_year) FILTER (WHERE d.decision IN ('APPROVED', 'APPROVED_BY_OWNER')), 0) AS committed
      FROM position p LEFT JOIN decisions d USING (cost_centre, account) GROUP BY p.cost_centre, p.account, p.owner, p.annual_budget, p.spent, p.committed;
      ALTER TABLE after_run ADD COLUMN available DOUBLE; UPDATE after_run SET available = annual_budget - spent - committed;
      ALTER TABLE decisions ADD COLUMN funding_suggestion VARCHAR;
      UPDATE decisions SET funding_suggestion = (
        SELECT 'Transfer ' || round(-decisions.available_after) || ' from ' || a.account || ' (' || round(a.available) || ' unused)'
        FROM after_run a WHERE a.cost_centre = decisions.cost_centre AND a.account <> decisions.account AND a.available >= -decisions.available_after
        ORDER BY a.available DESC LIMIT 1)
      WHERE decision = 'NEEDS_BUDGET_OWNER';

      -- Full-year forecast per line: spend run-rate to year end + commitments.
      CREATE TABLE cost_centres AS
      SELECT cost_centre, account, owner, annual_budget, round(spent) AS spent, round(committed) AS committed, round(available) AS available,
             round(spent / (date_diff('day', getvariable('y0'), getvariable('d')) / 365.0)) AS run_rate_forecast,
             round(spent / (date_diff('day', getvariable('y0'), getvariable('d')) / 365.0) - annual_budget) AS forecast_variance
      FROM after_run ORDER BY forecast_variance DESC;

      COPY decisions TO '{{ outputFiles.decisions }}' (HEADER, DELIMITER ',');
      COPY cost_centres TO '{{ outputFiles.cost_centres }}' (HEADER, DELIMITER ',');
      COPY blockers TO '{{ outputFiles.blockers }}' (HEADER, DELIMITER ',');

      SELECT
        (SELECT count(*) FROM decisions)::INT AS requisitions,
        (SELECT string_agg(decision || ' ' || n, ', ' ORDER BY decision) FROM (SELECT decision, count(*) AS n FROM decisions GROUP BY decision)) AS by_decision,
        (SELECT round(coalesce(sum(amount), 0)) FROM decisions WHERE decision IN ('APPROVED', 'APPROVED_BY_OWNER'))::DOUBLE AS approved_amount,
        (SELECT coalesce(string_agg(pr || ' ' || vendor || ' ' || amount || ' (' || cost_centre || ' ' || account || ' short ' || round(-available_after) || '; ' || coalesce(funding_suggestion, 'no internal funding') || ')', '; '), '') FROM decisions WHERE decision = 'NEEDS_BUDGET_OWNER') AS needs_owner,
        (SELECT count(*) FROM decisions WHERE decision = 'NEEDS_BUDGET_OWNER')::INT AS needs_owner_count,
        (SELECT coalesce(string_agg(DISTINCT split_detail, '; '), '') FROM decisions WHERE decision = 'BLOCKED_SPLIT') AS splits,
        (SELECT coalesce(string_agg(cost_centre || ' ' || account || ' +' || forecast_variance, ', '), '') FROM cost_centres WHERE forecast_variance > 0) AS overruns,
        (SELECT round(sum(committed)) FROM after_run)::DOUBLE AS committed_total,
        (SELECT json_group_object(pr, coalesce(approved_by, 'AUTO'))::VARCHAR FROM decisions WHERE decision IN ('APPROVED', 'APPROVED_BY_OWNER')) AS newly_approved,
        (SELECT count(*) FROM blockers)::INT AS blockers,
        (SELECT coalesce(string_agg(code || ' ' || ref || ': ' || detail, '; ' ORDER BY code, ref), '') FROM blockers) AS blocker_detail;

  - id: result
    type: io.kestra.plugin.core.output.OutputValues
    values:
      r: "{{ (outputs.control.outputs | last).row | toJson }}"

  - id: log_control
    type: io.kestra.plugin.core.log.Log
    message: |
      Budget control {{ inputs.as_of }} ({{ inputs.scenario }}).
      {{ outputs.result.values.r | jq('"\(.requisitions) requisitions in the queue: \(.by_decision). Approved \(.approved_amount). Commitments after this run \(.committed_total)."') | first }}
      {{ outputs.result.values.r | jq('"Waiting for the budget owner: \(.needs_owner)."') | first }}
      {{ outputs.result.values.r | jq('"Split requisitions blocked: \(.splits). Forecast overrun by run-rate: \(.overruns)."') | first }}
      {{ outputs.result.values.r | jq('"Blockers: \(.blockers). \(.blocker_detail)"') | first }}

  - id: evidence
    type: io.kestra.plugin.core.namespace.UploadFiles
    namespace: "{{ flow.namespace }}"
    filesMap:
      "{{ render(vars.pack_dir) }}/decisions.csv": "{{ outputs.control.outputFiles.decisions }}"
      "{{ render(vars.pack_dir) }}/cost-centres.csv": "{{ outputs.control.outputFiles.cost_centres }}"
      "{{ render(vars.pack_dir) }}/blockers.csv": "{{ outputs.control.outputFiles.blockers }}"

  - id: gate
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.result.values.r | jq('.blockers > 0') | first }}"
    then:
      - id: blocked
        type: io.kestra.plugin.core.execution.Fail
        errorMessage: "Budget control did not run: {{ outputs.result.values.r | jq('.blocker_detail') | first }}"

  - id: save
    type: io.kestra.plugin.core.kv.Set
    description: Approved requisitions become commitments for the next run until they are on a PO.
    key: "{{ vars.state_key }}"
    kvType: JSON
    value: >-
      {{ {'old': fromJson(outputs.state.values.s), 'r': fromJson(outputs.result.values.r)}
         | jq('{approved: (.old.approved + ((.r.newly_approved // "{}") | fromjson))}') | first | toJson }}

  - id: owner_gate
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.result.values.r | jq('.needs_owner_count > 0') | first }}"
    then:
      - id: waiting_for_owner
        type: io.kestra.plugin.core.execution.Fail
        errorMessage: "Approved requisitions released to purchasing. Waiting for the budget owner: {{ outputs.result.values.r | jq('.needs_owner') | first }}"

extend:
  title: Check purchase requisitions against remaining budget and open commitments before they become POs
  metaTitle: Budget commitment control for purchase requisitions with Kestra and DuckDB
  shortDescription: Compute what each cost centre has left after spend and open commitments, approve requisitions that fit in queue order, route the rest to the budget owner with a funding suggestion, and block split requisitions.
  metaDescription: Daily budget control in Kestra and DuckDB. Available budget after commitments, queue-order approvals, owner routing, split detection and forecast.
  description: |
    Budgets are usually overspent because of commitments, not invoices. A purchase order signed in September for work in November doesn't show in the actuals until the invoice arrives, and by then the budget is gone. Requisitions get approved against the actuals they can see, and a large one gets split into three small ones to stay under an approval limit.

    This flow runs every morning on the requisition queue and computes the real remaining budget: budget minus spend minus open commitments, including the requisitions it approved earlier. It approves what fits, in the order requisitions were raised. Anything that doesn't fit goes to the budget owner, with a suggestion for where the money could come from.

    It runs with no setup and no network. The demo has:
    - four cost centres with eight budget lines;
    - spend to date, with one line already ahead of its run rate;
    - open, closed and cancelled purchase orders, some spread over months that run past year end;
    - a queue of nine requisitions, one of which needs more than its line has left, and three to the same vendor within hours to dodge the 10,000 approval limit.

    This blueprint was created by [zkasuran](https://github.com/zkasuran).

    ## How available budget is computed

    | Item | Rule |
    |---|---|
    | Spend | Actuals to date per cost centre and account |
    | Open PO commitments | Unreceived amount, spread evenly over the PO's months. Only months up to year end count against this year |
    | Released | Closed and cancelled POs commit nothing |
    | Earlier approvals | Requisitions approved in earlier runs, kept in KV, count as commitments until they are on a PO |
    | Available | Annual budget - spend - commitments |

    ## Decisions

    Requisitions are taken in the order they were raised, and each one consumes the budget the earlier ones left:

    | Decision | Rule |
    |---|---|
    | `APPROVED` | Fits within the line, or goes over by no more than `tolerance_pct` of the annual budget |
    | `APPROVED_BY_OWNER` | Over budget, approved by the budget owner in `approvals` |
    | `NEEDS_BUDGET_OWNER` | Over budget. The flow names the shortfall and, where one exists, a line of the same cost centre with enough unused budget to transfer from |
    | `BLOCKED_SPLIT` | Several requisitions by one requester to one vendor within 48 hours, each under the approval limit and together above it |

    It also reports the full-year forecast per line at the current run rate, against budget.

    ## How it works

    1. `state` loads the requisitions approved in earlier runs.
    2. `control` (`io.kestra.plugin.jdbc.duckdb.Queries`) holds the budgets, actuals, POs and the queue. It runs the checks, then computes commitments in-year, the position per line, the queue-order decisions, the split detection, the funding suggestions and the forecast.
    3. `log_control` prints the result. `evidence` stores `decisions.csv` (every requisition with available before and after, decision and reason), `cost-centres.csv` and `blockers.csv`.
    4. `gate` stops on data errors: a requisition for a line with no budget, or a non-positive amount.
    5. `save` (`io.kestra.plugin.core.kv.Set`) adds the newly approved requisitions to the commitments.
    6. `owner_gate` fails with the requisitions waiting for the owner, after the approved ones have been released.

    ## Tested end to end

    On Kestra 2.0.3 OSS.

    | Run | Inputs | Result |
    |---|---|---|
    | 1 | 2026-09-15 | 9 requisitions: 5 approved (242,000), 3 LiftCare requisitions blocked as a split (29,000 together), and the 38,000 trade show in CC-100 Events waiting for the owner. Events is short 62,041, with a suggested transfer from Agencies and media (332,422 unused). Commitments after the run 548,000. Forecast overrun: Events +75,000, Contractors +40,000 |
    | 2 | same, owner approves PR-1041 | Approved by the owner. The five earlier approvals are not decided again |
    | 3 | 2026-09-16 | Only the split requisitions remain. Commitments still 586,000, so the approvals carried over |
    | 4 | `ISSUES` | Blocked: a requisition for CC-900 / Travel, which has no budget; a requisition of -2,000 |

    I recomputed the commitments independently in Python:
    - the spread of each open PO over the months up to year end gives 324,000;
    - the approved requisitions add 224,000 in-year, totalling 548,000;
    - the Events shortfall comes out at 62,041.10.

    ## Problems found while testing

    - **`GROUP BY ALL` grouped by the measure.** DuckDB grouped by every non-aggregated column, including the one the macro aggregated, and refused to bind. The groupings are explicit now.

    ## Inputs

    | Input | Default | Purpose |
    |---|---|---|
    | `as_of` | `2026-09-15` | Run date |
    | `scenario` | `CLEAN` | Demo only |
    | `tolerance_pct` | `2.0` | Automatic over-budget tolerance |
    | `approvals` | `{}` | Budget owner approvals by requisition |

    ## Use it with your data

    - Replace `budgets`, `actuals`, `purchase_orders` and `requisitions` with your ERP and procurement tool.
    - Release the approved requisitions to purchasing from a task after `save`, and send `decisions.csv` back to the requisition tool.
    - Once an approved requisition becomes a PO, remove it from the KV key `budget_commitments`, so it is counted once, as a PO.

    ## Things to know

    - The forecast is a simple run rate. Use your latest forecast if you have one.
    - Multi-year budgets and capital projects need their own budget periods.

    ## Links

    - DuckDB window functions: https://duckdb.org/docs/sql/functions/window_functions
    - DuckDB plugin: https://kestra.io/plugins/plugin-jdbc-duckdb
  tags:
    - Business
    - Data
  subTags:
    - Policy & Compliance
    - Approval Gates
  ee: false
  demo: true
