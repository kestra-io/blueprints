id: jaeger-collector-dropped-spans-and-queue-saturation-sentinel
namespace: company.sentinel
description: Audits Jaeger distributed tracing collectors for dropped span spikes and memory queue saturation to prevent observability data loss.
inputs:
  - id: jaeger_metrics_url
    type: STRING
    defaults: http://jaeger-collector.internal:14269/metrics
  - id: max_dropped_spans_threshold
    type: INT
    defaults: 50
  - id: max_queue_percent_threshold
    type: INT
    defaults: 80
tasks:
  - id: probe_jaeger_collector_metrics
    type: io.kestra.plugin.scripts.shell.Commands
    containerImage: ghcr.io/kestra-io/tools:latest
    commands:
      - set -euo pipefail
      - |
        AUTH_HEADER=""
        if [ -n "{{ secret('JAEGER_AUTH_TOKEN') }}" ]; then
          AUTH_HEADER="-H Authorization:Bearer {{ secret('JAEGER_AUTH_TOKEN') }}"
        fi

        curl -sf -m 10 $AUTH_HEADER "{{ inputs.jaeger_metrics_url }}" > /tmp/jaeger_metrics.txt 2>/dev/null || echo "" > /tmp/jaeger_metrics.txt

        python3 - <<'PY' > /tmp/jaeger_health.json
        import os, sys, json

        metrics = {}
        try:
            with open("/tmp/jaeger_metrics.txt", "r") as f:
                for line in f:
                    line = line.strip()
                    if line and not line.startswith("#"):
                        parts = line.split()
                        if len(parts) >= 2:
                            try:
                                metrics[parts[0]] = float(parts[1])
                            except ValueError:
                                pass
        except Exception:
            pass

        dropped = int(metrics.get("jaeger_collector_spans_dropped_total", 0))
        queue_cap = int(metrics.get("jaeger_collector_queue_capacity", 0))
        in_queue = int(metrics.get("jaeger_collector_in_queue", 0))
        queue_pct = round((in_queue / queue_cap) * 100, 2) if queue_cap > 0 else 0.0
        spans_received = int(metrics.get("jaeger_collector_spans_received_total", 0))

        res = {
            "spans_dropped_total": dropped,
            "queue_capacity": queue_cap,
            "in_queue": in_queue,
            "queue_saturation_pct": queue_pct,
            "spans_received_total": spans_received
        }
        print(json.dumps(res))
        PY
    outputFiles:
      - "/tmp/jaeger_health.json"

  - id: evaluate_dropped_spans_and_queue
    type: io.kestra.plugin.core.flow.If
    condition: "{{ fromJson(read(outputs.probe_jaeger_collector_metrics.outputFiles['/tmp/jaeger_health.json'])).spans_dropped_total > inputs.max_dropped_spans_threshold or fromJson(read(outputs.probe_jaeger_collector_metrics.outputFiles['/tmp/jaeger_health.json'])).queue_saturation_pct > inputs.max_queue_percent_threshold }}"
    then:
      - id: notify_slack_alert
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          :warning: *Jaeger Tracing Collector Sentinel Alert*
          *Collector Metrics:* `{{ inputs.jaeger_metrics_url }}`
          *Dropped Spans Total:* `{{ fromJson(read(outputs.probe_jaeger_collector_metrics.outputFiles['/tmp/jaeger_health.json'])).spans_dropped_total }}` (Threshold: `{{ inputs.max_dropped_spans_threshold }}`)
          *Queue Saturation:* `{{ fromJson(read(outputs.probe_jaeger_collector_metrics.outputFiles['/tmp/jaeger_health.json'])).queue_saturation_pct }}%` (Threshold: `{{ inputs.max_queue_percent_threshold }}%`)
          *Spans in Queue:* `{{ fromJson(read(outputs.probe_jaeger_collector_metrics.outputFiles['/tmp/jaeger_health.json'])).in_queue }}` / Capacity: `{{ fromJson(read(outputs.probe_jaeger_collector_metrics.outputFiles['/tmp/jaeger_health.json'])).queue_capacity }}`
          *Action Required:* Scale Jaeger collector replica pods or tune downstream storage backend (Elasticsearch, OpenSearch, Cassandra) write throughput.

  - id: record_audit_summary
    type: io.kestra.plugin.core.log.Log
    message: "Jaeger audit completed for {{ inputs.jaeger_metrics_url }}. Dropped spans: {{ fromJson(read(outputs.probe_jaeger_collector_metrics.outputFiles['/tmp/jaeger_health.json'])).spans_dropped_total }}, Queue saturation: {{ fromJson(read(outputs.probe_jaeger_collector_metrics.outputFiles['/tmp/jaeger_health.json'])).queue_saturation_pct }}%."

errors:
  - id: handle_inspection_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      :rotating_light: *Sentinel Error: Jaeger Collector Health Monitor*
      *Execution ID:* `{{ execution.id }}`
      *State:* `{{ execution.state.current }}`
      *Details:* Failed to reach Jaeger Collector metrics endpoint at `{{ inputs.jaeger_metrics_url }}`.

triggers:
  - id: hourly_sentinel_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 * * * *"
    disabled: true

extend:
  title: Jaeger Collector Dropped Spans and Queue Saturation Sentinel
  metaTitle: Jaeger Collector Dropped Spans Sentinel | Kestra
  shortDescription: Audits Jaeger distributed tracing collectors for dropped span spikes and memory queue saturation to prevent data loss.
  metaDescription: Audits Jaeger distributed tracing collectors for dropped span spikes and memory queue saturation to prevent observability data loss.
  tags:
    - Infrastructure
    - Data
  subTags:
    - Monitoring & Alerting
    - Day 2 Operations
  ee: false
  demo: false
  description: |
    Automated sentinel flow that audits Jaeger distributed tracing collectors for trace span drops, queue capacity exhaustion, and downstream storage backpressure.

    ## How it works

    1. Scheduled trigger fires hourly (or on-demand) to execute the collector telemetry probe.
    2. Probes the Jaeger Collector administrative Prometheus endpoint (`/metrics` on port 14269).
    3. Python parser extracts cumulative dropped spans, in-memory buffer queue utilization, and total received trace spans.
    4. An `io.kestra.plugin.core.flow.If` condition checks if dropped spans or queue capacity saturation cross configured operational limits.
    5. Dispatches formatted Slack alerts containing actionable metrics if an anomaly is detected.
    6. Dedicated `errors` handler captures connection timeouts and network unreachable errors.

    ## What you get

    - Early detection of trace span sampling drops before critical microservice latency traces are lost.
    - Visibility into in-memory queue backpressure caused by slow Cassandra or OpenSearch storage clusters.
    - Automated execution audit trail recorded in Kestra execution artifacts for observability platform compliance.

    ## Who it's for

    - Platform Engineers and Observability SREs managing OpenTelemetry and Jaeger distributed tracing pipelines.
    - Cloud Infrastructure Teams ensuring end-to-end trace collection reliability across distributed microservices.

    ## Why orchestrate this with Kestra

    - Declarative tracing infrastructure monitoring without deploying external exporter sidecars.
    - Centralized secret management for authenticated monitoring endpoints via `{{ secret('JAEGER_AUTH_TOKEN') }}`.
    - Seamless alerting and automated remediation pipeline integration in declarative YAML workflows.

    ## Prerequisites

    - Network route from the Kestra worker to the Jaeger Collector metrics port 14269.
    - Metrics endpoint accessible on `/metrics`.

    ### Secrets

    - `JAEGER_AUTH_TOKEN`: Optional bearer token for secured Jaeger collector endpoints.
    - `SLACK_WEBHOOK`: Incoming webhook URL for operational alerts.

    ## Quick start

    1. Deploy this flow to your Kestra instance.
    2. Set `inputs.jaeger_metrics_url` to point to your Jaeger collector metrics endpoint.
    3. Add the `SLACK_WEBHOOK` secret under the target namespace.
    4. Execute a manual test run to verify telemetry collection.
    5. Enable the `hourly_sentinel_schedule` trigger for continuous monitoring.

    ## How to extend

    - Add automated horizontal pod autoscaling or collector replica scaling commands inside the `then` branch.
    - Forward historical span drop rates into ClickHouse or Grafana for tracing SLA dashboards.
    - Integrate with PagerDuty for severe trace ingestion drop spikes.

    ## Links

    - [Jaeger Monitoring Architecture](https://www.jaegertracing.io/docs/latest/monitoring/)
    - [Kestra Shell Plugin](https://kestra.io/plugins/plugin-scripts-shell)
    - [Kestra Slack Plugin](https://kestra.io/plugins/plugin-slack)
