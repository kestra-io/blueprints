id: feature-flag-progressive-delivery-slo-gate
namespace: company.team
description: |
  Ramp a feature flag through staged percentages with an SLO guard at every step:
  each stage sets the flag, waits for real traffic, queries Prometheus, and the
  moment the error rate breaches, the flag is disabled and an issue is filed.

inputs:
  - id: flag_api_url
    type: STRING
    displayName: Flag provider API endpoint
    description: Full URL for the JSON PATCH that changes the rollout (LaunchDarkly-style shown; adapt to Unleash/OpenFeature).
    defaults: https://api.launchdarkly.ai/api/v2/flags/my-project/new-checkout

  - id: flag_key
    type: STRING
    displayName: Flag key
    description: Key of the flag being ramped - also the metric label used in PromQL.
    defaults: new-checkout

  - id: flag_environment
    type: STRING
    displayName: Flag environment
    defaults: production

  - id: ramp_percentages
    type: JSON
    displayName: Rollout stages (%)
    description: Percentages to ramp through, one guard cycle per stage.
    defaults:
      - 10
      - 25
      - 50
      - 100

  - id: observation_minutes
    type: INT
    displayName: Observation window per stage (minutes)
    defaults: 10

  - id: max_error_rate
    type: FLOAT
    displayName: Maximum 5xx error rate
    description: Breach threshold checked after every stage - 0.01 means one percent.
    defaults: 0.01

  - id: repository
    type: STRING
    displayName: GitHub repository for abort issues
    defaults: your-org/your-repo

tasks:
  - id: ramp_stages
    type: io.kestra.plugin.core.flow.Loop
    description: One guard cycle per percentage - set the flag, observe real traffic, verify against the error-rate budget.
    values: "{{ inputs.ramp_percentages }}"
    tasks:
      - id: set_stage
        type: io.kestra.plugin.core.http.Request
        description: PATCH the flag provider to this stage's percentage (LaunchDarkly JSON-patch shape).
        uri: "{{ inputs.flag_api_url }}"
        method: PATCH
        contentType: application/json
        headers:
          Authorization: "Bearer {{ secret('FLAG_API_TOKEN') }}"
        body: |
          [
            {"op": "replace", "path": "/environments/{{ inputs.flag_environment }}/on", "value": true},
            {"op": "replace", "path": "/environments/{{ inputs.flag_environment }}/targets", "value": [{"percentage": {{ item.value }}, "values": ["all"]}]}
          ]

      - id: observe_stage
        type: io.kestra.plugin.core.flow.Sleep
        description: Let the stage accumulate real user traffic before judging it.
        duration: "PT{{ inputs.observation_minutes }}M"

      - id: error_rate_check
        type: io.kestra.plugin.prometheus.Query
        description: 5xx ratio for the flagged traffic over the last five minutes as a single scalar.
        url: "{{ secret('PROMETHEUS_URL') }}"
        query: 'sum(rate(http_requests_total{flag="{{ trigger.body.key ?? inputs.flag_key }}", status=~"5.."}[5m])) / sum(rate(http_requests_total{flag="{{ trigger.body.key ?? inputs.flag_key }}"}[5m]))'
        fetchType: FETCH_ONE

      - id: guard
        type: io.kestra.plugin.core.flow.If
        description: Breach at any stage disables the flag immediately, files an issue, and stops the ramp.
        condition: "{{ outputs.error_rate_check.metric.value | number > inputs.max_error_rate }}"
        then:
          - id: disable_flag
            type: io.kestra.plugin.core.http.Request
            description: Turn the flag off and zero the rollout - users leave through the safe path instantly.
            uri: "{{ inputs.flag_api_url }}"
            method: PATCH
            contentType: application/json
            headers:
              Authorization: "Bearer {{ secret('FLAG_API_TOKEN') }}"
            body: |
              [
                {"op": "replace", "path": "/environments/{{ inputs.flag_environment }}/on", "value": false},
                {"op": "replace", "path": "/environments/{{ inputs.flag_environment }}/targets", "value": [{"percentage": 0, "values": ["all"]}]}
              ]

          - id: open_issue
            type: io.kestra.plugin.github.issues.Create
            description: Assignable ticket for the team owning the flag, with the stage and measured rate.
            jwtToken: "{{ secret('GITHUB_TOKEN') }}"
            repository: "{{ inputs.repository }}"
            title: "Flag ramp aborted: {{ trigger.body.key ?? inputs.flag_key }} at {{ item.value }}% (error rate {{ outputs.error_rate_check.metric.value }})"
            labels:
              - progressive-delivery
              - rollback
            body: |
              ## Feature-flag ramp aborted

              | Field | Value |
              |---|---|
              | Flag | {{ trigger.body.key ?? inputs.flag_key }} |
              | Stage | {{ item.value }}% |
              | Error rate | {{ outputs.error_rate_check.metric.value }} |
              | Threshold | {{ inputs.max_error_rate }} |
              | Environment | {{ inputs.flag_environment }} |

              The flag was disabled automatically by execution `{{ execution.id }}` after {{ inputs.observation_minutes }} minutes of observation. Diagnose before re-enabling and re-running the ramp.

          - id: alert_slack
            type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
            url: "{{ secret('SLACK_WEBHOOK_URL') }}"
            messageText: |
              :no_entry: Flag ramp aborted for *{{ trigger.body.key ?? inputs.flag_key }}* at {{ item.value }}% - error rate {{ outputs.error_rate_check.metric.value }} exceeds {{ inputs.max_error_rate }}. Flag disabled, issue filed, execution stopping.

          - id: fail_ramp
            type: io.kestra.plugin.core.execution.Fail
            description: Fail so any release pipeline waiting on this ramp halts instead of continuing blind.
            errorMessage: "Flag {{ trigger.body.key ?? inputs.flag_key }} aborted at {{ item.value }}%: error rate {{ outputs.error_rate_check.metric.value }} > {{ inputs.max_error_rate }} - flag disabled."

  - id: announce_full_rollout
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Every stage held - the flag is fully rolled out with the guard history attached.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    messageText: |
      :white_check_mark: Flag *{{ trigger.body.key ?? inputs.flag_key }}* ramped through {{ inputs.ramp_percentages | json }} without breaching {{ inputs.max_error_rate }}. Full rollout complete (execution {{ execution.id }}).

outputs:
  - id: flag
    type: STRING
    value: "{{ trigger.body.key ?? inputs.flag_key }}"

  - id: stages_planned
    type: INT
    value: "{{ inputs.ramp_percentages | length }}"

  - id: ramp
    type: JSON
    value: "{{ inputs.ramp_percentages | json }}"

errors:
  - id: alert_on_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    messageText: ":rotating_light: Flag ramp {{ flow.id }} FAILED (execution {{ execution.id }}): {{ error.message }}"

triggers:
  - id: flag_change
    type: io.kestra.plugin.core.trigger.Webhook
    description: Fire this from your flag provider's webhook (LaunchDarkly/Unleash flag-change event) or manually. The payload key overrides the flag key. Replace with your own value.
    key: replace-with-a-random-key

extend:
  title: Feature-Flag Progressive Delivery with an Error-Rate Guard
  shortDescription: Ramp a feature flag through staged percentages, check Prometheus error rates after each stage, and auto-disable the flag and file an issue the moment it breaches.
  metaTitle: Feature-Flag Progressive Delivery Blueprint for Kestra
  metaDescription: "Ramp feature flags safely in Kestra: each rollout stage waits, checks Prometheus error rates, and auto-disables the flag and opens an issue on breach."
  description: |
    Feature flags give you a release switch, but a switch is not a rollout strategy. Someone flips the flag to 100 percent, the error rate climbs, and the rollback conversation happens in a channel while customers are already affected. Progressive delivery fixes the shape: small percentages, real observation, and an automatic stop. This blueprint makes the ramp itself a workflow - each stage is one loop iteration that sets the flag, waits for genuine traffic, measures the error rate, and either advances or kills the flag and opens a ticket.

    ## How it works

    1. `ramp_stages` (`io.kestra.plugin.core.flow.Loop`) iterates over your `ramp_percentages` input - by default 10, 25, 50, 100.
    2. `set_stage` (`io.kestra.plugin.core.http.Request`, PATCH with `Bearer {{ secret('FLAG_API_TOKEN') }}`) sends the LaunchDarkly-style JSON-patch that turns the flag on at that percentage; adapt the path and body to Unleash or any OpenFeature provider.
    3. `observe_stage` (`io.kestra.plugin.core.flow.Sleep`) holds for `observation_minutes` so the stage is judged on real user traffic, not on the deploy moment.
    4. `error_rate_check` (`io.kestra.plugin.prometheus.Query`, `FETCH_ONE`) computes the 5xx ratio for the flagged traffic over the last five minutes as a single scalar.
    5. `guard` (`io.kestra.plugin.core.flow.If`) compares it against `max_error_rate`. On breach: `disable_flag` PATCHes the flag off and to zero percent, `open_issue` (`io.kestra.plugin.github.issues.Create`) files a labeled ticket with the stage and the rate, `alert_slack` notifies, and `fail_ramp` (`core.execution.Fail`) stops the execution - the flow-level `errors` handler repeats the reason to Slack for anyone watching the release channel.
    6. If every stage holds, `announce_full_rollout` posts the completed ramp as a single green message.

    ## What you get

    - A ramp that stops itself: flag off, issue filed, pipeline halted - no human in the critical path of a bad release.
    - One guard cycle per stage with the measured rate recorded in the execution history.
    - Event-driven entry: the flag provider's own webhook starts the ramp.
    - `flag`, `stages_planned`, and `ramp` outputs for release dashboards.

    ## Who it's for

    - Platform teams standardizing how flags go from off to fully on across services.
    - SREs who want error budgets enforced during rollouts, not reviewed afterwards.
    - Product engineering teams shipping behind flags without a dedicated release engineer.

    ## Why orchestrate this with Kestra

    Ramps usually live in CI scripts that cannot wait an hour without burning runners, or in cron glue that hides its state. Kestra gives the ramp durable waits, an execution per rollout with every stage's verdict as history, native plugin tasks for Prometheus and the flag API, and a failure path that disables the flag instead of just turning red.

    ## Prerequisites

    - A flag provider with a REST API and webhook events (LaunchDarkly, Unleash, or an OpenFeature edge); the PATCH body shown is the LaunchDarkly JSON-patch shape.
    - Prometheus scraping your service with a `flag` label (or adapt the selector) exposing `http_requests_total`.
    - A Kestra instance and a GitHub repository for abort issues.

    ### Secrets

    - `FLAG_API_TOKEN`: token with flag-write access for the target environment.
    - `PROMETHEUS_URL`: base URL of the Prometheus server, e.g. `http://prometheus:9090`.
    - `SLACK_WEBHOOK_URL`: Slack incoming webhook for abort and success messages.
    - `GITHUB_TOKEN`: token with issue-write access to the `repository` input.

    ## Quick start

    1. Add the four secrets above and replace the webhook `key` with a strong random value.
    2. Point `flag_api_url` at your provider's flag endpoint and set `flag_key` / `flag_environment`.
    3. Adapt the PromQL selector to your `flag` label if it differs.
    4. Call the webhook from the flag provider (or curl it) and watch one full ramp - stage, sleep, query, verdict.
    5. Force a breach (point the query at a noisy service, or drop `max_error_rate` to 0) and confirm the flag disables, the issue appears, and the execution fails.

    ## How to extend

    - Guard latency too: add a second `prometheus.Query` on a p99 histogram and require both to pass in the `guard` condition.
    - Multi-flag release train: wrap this flow in a `Subflow` loop over a JSON list of flag keys.
    - Deployment-level rollback: in the `then` branch, add a Kubernetes `rollout undo` or Argo CD sync task before `fail_ramp` for flags that ship new binaries, not just config.
    - Gradual confidence: after the ramp, chain a disabled daily schedule that keeps the flag at 100 percent under the same error-rate guard until release sign-off.

    ## Links

    - Prometheus plugin: https://kestra.io/plugins/plugin-prometheus
    - Loop task: https://kestra.io/docs/concepts/tasks
    - Webhook trigger: https://kestra.io/docs/concepts/triggers
    - This blueprint has been created by [RudraMalvankar](https://github.com/RudraMalvankar)
  tags:
    - Infrastructure
  subTags:
    - CI/CD & Deployment
    - Monitoring & Alerting
  ee: false
  demo: false
