id: oceanbase-major-compaction-stall-sentinel
namespace: company.data

inputs:
  - id: oceanbase_host
    type: STRING
    displayName: OceanBase Host
    defaults: "oceanbase.internal"
    description: Hostname or IP address of the OBServer or ODP proxy exposing port 2881.

  - id: oceanbase_port
    type: INT
    displayName: OceanBase Port
    defaults: 2881
    description: Port number for the MySQL wire protocol interface on OceanBase (default 2881).

  - id: oceanbase_database
    type: STRING
    displayName: Database Name
    defaults: "oceanbase"
    description: Database name to establish the session against (default oceanbase).

  - id: slack_channel
    type: STRING
    displayName: Slack Channel
    defaults: "#data-platform-alerts"
    description: Slack channel destination for operational major compaction incident cards.

  - id: auto_resume
    type: BOOL
    displayName: Auto Resume Merge
    defaults: true
    description: Automatically dispatch ALTER SYSTEM RESUME MERGE when suspended compaction is detected.

  - id: dry_run
    type: BOOL
    displayName: Dry Run Mode
    defaults: false
    description: When true, audits compaction state and dispatches notifications but skips remediation commands.

triggers:
  - id: every_fifteen_minutes
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"

tasks:
  - id: probe_major_compaction_health
    type: io.kestra.plugin.jdbc.mysql.Query
    url: "jdbc:mysql://{{ inputs.oceanbase_host }}:{{ inputs.oceanbase_port }}/{{ inputs.oceanbase_database }}"
    username: "{{ secret('OCEANBASE_USERNAME') }}"
    password: "{{ secret('OCEANBASE_PASSWORD') }}"
    fetchType: FETCH
    allowFailure: true
    sql: |
      SELECT
        tenant_id,
        status,
        is_suspended,
        is_error,
        COALESCE(info, 'None') AS error_info
      FROM oceanbase.CDB_OB_MAJOR_COMPACTION
      WHERE is_suspended = 'YES' OR is_error = 'YES' OR status = 'SUSPENDED'
      ORDER BY tenant_id ASC;

  - id: route_by_compaction_health
    type: io.kestra.plugin.core.flow.Switch
    value: >-
      {% if outputs.probe_major_compaction_health.rows is null %}
      PROBE_FAILED
      {% else %}
        {% set error_count = 0 %}
        {% set suspended_count = 0 %}
        {% for row in outputs.probe_major_compaction_health.rows %}
          {% if row.is_error == 'YES' %}
            {% set error_count = error_count + 1 %}
          {% elseif row.is_suspended == 'YES' or row.status == 'SUSPENDED' %}
            {% set suspended_count = suspended_count + 1 %}
          {% endif %}
        {% endfor %}
        {% if error_count > 0 or suspended_count > 0 %}
        CRITICAL
        {% else %}
        HEALTHY
        {% endif %}
      {% endif %}
    cases:
      CRITICAL:
        - id: alert_critical_slack
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "channel": "{{ inputs.slack_channel }}",
              "text": "[CRITICAL] OceanBase Major Compaction Suspended or Error Detected - MemTable Exhaustion Risk",
              "attachments": [
                {
                  "color": "#D32F2F",
                  "title": "OceanBase Major Compaction Failure Incident",
                  "fields": [
                    {
                      "title": "Cluster Host",
                      "value": "{{ inputs.oceanbase_host }}:{{ inputs.oceanbase_port }}",
                      "short": true
                    },
                    {
                      "title": "Degraded Tenants Count",
                      "value": "{{ outputs.probe_major_compaction_health.size }}",
                      "short": true
                    },
                    {
                      "title": "Severity",
                      "value": "CRITICAL - LSM Compaction Halted",
                      "short": true
                    },
                    {
                      "title": "Remediation Status",
                      "value": "{{ (inputs.auto_resume and not inputs.dry_run) ? 'Dispatching ALTER SYSTEM RESUME MERGE' : 'Remediation Skipped (Dry Run or Disabled)' }}",
                      "short": true
                    }
                  ],
                  "footer": "Kestra OceanBase Sentinel | Execution ID: {{ execution.id }}"
                }
              ]
            }

        - id: check_remediation
          type: io.kestra.plugin.core.flow.If
          condition: "{{ inputs.auto_resume == true and inputs.dry_run == false }}"
          then:
            - id: execute_resume_merge
              type: io.kestra.plugin.jdbc.mysql.Query
              url: "jdbc:mysql://{{ inputs.oceanbase_host }}:{{ inputs.oceanbase_port }}/{{ inputs.oceanbase_database }}"
              username: "{{ secret('OCEANBASE_USERNAME') }}"
              password: "{{ secret('OCEANBASE_PASSWORD') }}"
              sql: "ALTER SYSTEM RESUME MERGE TENANT = all_user;"

            - id: notify_remediation_slack
              type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
              url: "{{ secret('SLACK_WEBHOOK_URL') }}"
              payload: |
                {
                  "channel": "{{ inputs.slack_channel }}",
                  "text": "[REMEDIATION] OceanBase ALTER SYSTEM RESUME MERGE TENANT = all_user command executed successfully."
                }

      PROBE_FAILED:
        - id: alert_probe_failure
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "channel": "{{ inputs.slack_channel }}",
              "text": "[CRITICAL] OceanBase Sentinel Probe Failed - Unable to query oceanbase.CDB_OB_MAJOR_COMPACTION. Verify port 2881 routing and user privileges."
            }

      HEALTHY:
        - id: log_compaction_healthy
          type: io.kestra.plugin.core.log.Log
          message: "OceanBase major compaction health is normal. No suspended or failed compactions detected across user tenants."

  - id: log_audit_summary
    type: io.kestra.plugin.core.log.Log
    message: "OceanBase major compaction audit completed. Status: {{ outputs.route_by_compaction_health.value ?? 'PROCESSED' }}. Evaluated degraded compaction count: {{ outputs.probe_major_compaction_health.size ?? 0 }}."

errors:
  - id: on_flow_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "{{ inputs.slack_channel }}",
        "text": "[ERROR] OceanBase Major Compaction Stall Sentinel execution aborted unexpectedly. Execution ID: {{ execution.id }}."
      }

extend:
  title: OceanBase Major Compaction Stall & Auto-Resume Sentinel
  metaTitle: OceanBase Major Compaction Stall Sentinel | Kestra
  shortDescription: Audits OceanBase CDB_OB_MAJOR_COMPACTION for suspended or errored merges and automates ALTER SYSTEM RESUME.
  metaDescription: Audit OceanBase CDB_OB_MAJOR_COMPACTION for suspended or errored merges, dispatch Slack incident alerts, and automate ALTER SYSTEM RESUME MERGE.
  description: |
    OceanBase is an enterprise distributed relational database featuring a hybrid LSM-tree storage architecture. Dynamic writes and transaction updates land continuously in active memory tables (MemTables). During scheduled or triggered daily major freezes, OceanBase compacts and merges in-memory data with static baseline SSTables via Major Compaction. If major compaction becomes suspended (`IS_SUSPENDED = 'YES'`) or encounters fatal errors (`IS_ERROR = 'YES'`), memory occupied by frozen MemTables cannot be recycled. If MemTable memory exhaustion occurs, write operations across all user tenants stall (`OB_ALLOCATE_MEMORY_FAILED -4013`), disrupting mission-critical transactional services. This blueprint provides automated continuous surveillance over `oceanbase.CDB_OB_MAJOR_COMPACTION`, detects suspended or degraded compactions, alerts operations via Slack, and automates safe remediation using `ALTER SYSTEM RESUME MERGE TENANT = all_user`.

    ## How it works

    1. Scheduled trigger (`every_fifteen_minutes`) initiates diagnostic health verification every 15 minutes, with manual runs supported via customizable inputs.
    2. Diagnostic probe (`probe_major_compaction_health`) connects to OceanBase over the MySQL wire protocol (`port 2881`) via `io.kestra.plugin.jdbc.mysql.Query` and queries `oceanbase.CDB_OB_MAJOR_COMPACTION` for any tenants where compaction is suspended, errored, or stalled.
    3. Classification logic evaluates query output using Pebble templating, discerning whether any tenant compactions are suspended or errored (`CRITICAL`), all operating normally (`HEALTHY`), or if the database connection failed (`PROBE_FAILED`).
    4. Routing task (`route_by_compaction_health`) switches execution along dedicated paths according to the classified severity.
    5. On `CRITICAL` state, structured Slack incident cards notify operations channels with impacted cluster endpoints, tenant counts, failure diagnostics, and remediation states.
    6. Guarded remediation (`check_remediation`) checks whether `auto_resume` is enabled and `dry_run` is disabled. If confirmed, `execute_resume_merge` dispatches `ALTER SYSTEM RESUME MERGE TENANT = all_user;` to unblock suspended merges across user tenants.
    7. On `PROBE_FAILED`, dedicated alerts notify administrators of unreachable ports or authentication failures.
    8. Audit log task (`log_audit_summary`) writes execution metadata and evaluated tenant counts to task logs.

    ## What you get

    - Automated continuous surveillance of OceanBase LSM-tree major compaction across all cluster tenants.
    - Early detection of suspended merges and error states before MemTable memory exhaustion triggers write stalls.
    - Automated self-healing cluster unfreeze capabilities executing `ALTER SYSTEM RESUME MERGE`.
    - Differentiated operational alerting directing DBAs straight to affected tenant IDs and error messages.
    - Full execution traceability and audit logging without leaking database credentials in logs or alert payloads.

    ## Who it's for

    - Database Administrators and SREs managing high-throughput production OceanBase clusters.
    - Platform Engineers responsible for distributed transactional database availability and SLA compliance.
    - Data Infrastructure Teams deploying large-scale OLTP and HTAP workloads on OceanBase.

    ## Why orchestrate this with Kestra

    - Declarative YAML definition unifies distributed storage maintenance, conditional severity triage, and automated self-healing into version-controlled GitOps workflows.
    - Native MySQL JDBC plugin connectivity communicates directly with OceanBase's native wire protocol without external agent daemons or Python container overhead.
    - Built-in conditional routing and dry-run safety gates isolate discovery from remediation commands.
    - Immutable execution history provides operational evidence documenting compaction recovery timelines and cluster maintenance cycles.
    - Cloud-native scheduling and flow-level error-trapping ensure continuous sentinel operation independent of external cron infrastructure.

    ## Prerequisites

    - OceanBase cluster running with MySQL wire compatibility enabled (default port 2881).
    - Database user with read permissions on `oceanbase.CDB_OB_MAJOR_COMPACTION` and administrative privileges to run `ALTER SYSTEM RESUME MERGE`.
    - Slack incoming webhook URL for operational incident dispatch.

    ### Secrets

    - `OCEANBASE_USERNAME`: Username for authenticating to the OceanBase MySQL wire interface (e.g. root@sys).
    - `OCEANBASE_PASSWORD`: Password for the OceanBase database user.
    - `SLACK_WEBHOOK_URL`: Incoming webhook URL for posting incident cards to Slack.

    ## Quick start

    1. Configure `OCEANBASE_USERNAME`, `OCEANBASE_PASSWORD`, and `SLACK_WEBHOOK_URL` in your Kestra namespace secrets.
    2. Deploy this blueprint to your Kestra instance and trigger an initial run with `dry_run: true` to verify connectivity against your OceanBase cluster.
    3. Review the execution log in the Kestra UI to verify major compaction query execution from `oceanbase.CDB_OB_MAJOR_COMPACTION`.
    4. Enable the `every_fifteen_minutes` schedule trigger to activate automated continuous monitoring and remediation.

    ## How to extend

    - Add OBServer node status checks via `oceanbase.GV$OB_SERVERS` to detect hardware disk faults causing compaction stalls.
    - Integrate PagerDuty alerting via `io.kestra.plugin.pagerduty.notifications.PagerDutyAlert` for immediate escalation during severe cluster-wide compaction freezes.
    - Attach tenant resource unit inspection via `oceanbase.DBA_OB_TENANTS` to detect memory watermark breaches.

    ## Links

    - [OceanBase Major Compaction Overview Documentation](https://en.oceanbase.com/docs/common-oceanbase-database-1000000000034614)
    - [OceanBase CDB_OB_MAJOR_COMPACTION Reference](https://en.oceanbase.com/docs/common-oceanbase-database-1000000000034825)
    - [OceanBase ALTER SYSTEM RESUME MERGE Reference](https://en.oceanbase.com/docs/common-oceanbase-database-1000000000034789)
    - [Kestra MySQL Plugin Documentation](https://kestra.io/plugins/plugin-jdbc-mysql)
    - [Kestra Slack Notification Plugin](https://kestra.io/plugins/plugin-notifications)
  tags:
    - Data
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - Infrastructure Automation
  ee: false
  demo: false
