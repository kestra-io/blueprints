id: guardduty-high-severity-finding-sentinel
namespace: company.team
description: |
  List Amazon GuardDuty findings filtered server-side to high severity
  and not archived, classify the result HEALTHY or
  ACTIVE_FINDINGS_DETECTED, and alert Slack with the exact finding
  titles, types, and severities when a real threat signal is active.

triggers:
  - id: periodic_finding_check
    type: io.kestra.plugin.core.trigger.Schedule
    description: "Checks every 30 minutes - GuardDuty generates findings continuously as it analyzes VPC Flow Logs, DNS logs, and CloudTrail events, so a security-relevant check benefits from a tighter cadence than a routine compliance sweep. Shipped disabled; enable it once aws_region and detector_id point at a real GuardDuty detector and a manual run has been verified."
    cron: "*/30 * * * *"
    disabled: true
    inputs:
      aws_region: "us-east-1"
      detector_id: "<your-guardduty-detector-id>"
      min_severity: 7

inputs:
  - id: aws_region
    type: STRING
    displayName: "AWS Region"
    defaults: "us-east-1"
    description: "Region passed to io.kestra.plugin.aws.cli.AwsCLI as AWS_DEFAULT_REGION. GuardDuty detectors are regional."

  - id: detector_id
    type: STRING
    displayName: "GuardDuty Detector ID"
    defaults: "<your-guardduty-detector-id>"
    description: "ID of the GuardDuty detector to query, obtainable via aws guardduty list-detectors. Must be replaced with a real detector ID - there is no safe universal default."

  - id: min_severity
    type: INT
    displayName: "Minimum Severity"
    defaults: 7
    description: "Findings with a severity score at or above this value are audited, passed into the server-side finding-criteria filter. GuardDuty's own documented severity bands are LOW (1.0-3.9), MEDIUM (4.0-6.9), and HIGH (7.0-8.9); the default of 7 audits HIGH-severity findings only."

tasks:
  - id: probe_high_severity_findings
    type: io.kestra.plugin.aws.cli.AwsCLI
    description: "list-findings's own --finding-criteria filter (verified from the AWS CLI's own command reference) does the severity and archived-status filtering server-side using GuardDuty's own Criterion syntax (severity.Gte, service.archived.Eq) - this task never receives or has to filter low-severity or already-archived findings at all. Only returns finding IDs, not full details; see the nested evaluation below for the detail fetch."
    accessKeyId: "{{ secret('AWS_ACCESS_KEY_ID') }}"
    secretKeyId: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
    region: "{{ inputs.aws_region }}"
    commands:
      - aws guardduty list-findings --detector-id {{ inputs.detector_id }} --finding-criteria '{"Criterion":{"severity":{"Gte":{{ inputs.min_severity }}},"service.archived":{"Eq":["false"]}}}' --output json | tr -d '\n' | xargs -0 -I {} echo '::{"outputs":{}}::'

  - id: evaluate_findings_presence
    type: io.kestra.plugin.core.flow.If
    description: "ACTIVE_FINDINGS_DETECTED whenever the FindingIds list (verified from GuardDuty's own ListFindings API reference) has at least one entry - since the server-side criteria already restrict it to severity >= min_severity and not archived, any entry at all means a real, active finding."
    condition: "{{ outputs.probe_high_severity_findings.vars.FindingIds is not empty }}"
    then:
      - id: get_finding_details
        type: io.kestra.plugin.aws.cli.AwsCLI
        description: "get-findings accepts a space-separated list of finding IDs (verified from its own CLI reference) and returns full Finding objects, read here for Title, Type, and Severity. GuardDuty's own documented maximum is 50 finding IDs per get-findings call - see Pitfalls for what happens past that."
        accessKeyId: "{{ secret('AWS_ACCESS_KEY_ID') }}"
        secretKeyId: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
        region: "{{ inputs.aws_region }}"
        commands:
          - aws guardduty get-findings --detector-id {{ inputs.detector_id }} --finding-ids {{ outputs.probe_high_severity_findings.vars.FindingIds | join(' ') }} --output json | tr -d '\n' | xargs -0 -I {} echo '::{"outputs":{}}::'
      - id: alert_active_findings
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: "Always alert on ACTIVE_FINDINGS_DETECTED so an on-call engineer sees the exact threat signal without opening the GuardDuty console."
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {{ {
            "text": "GuardDuty finding sentinel: ACTIVE_FINDINGS_DETECTED in " ~ inputs.aws_region ~ ". " ~ (outputs.probe_high_severity_findings.vars.FindingIds | length) ~ " finding(s) at severity >= " ~ inputs.min_severity ~ ": " ~ (outputs.get_finding_details.vars.Findings | jq('map("[\(.Severity)] \(.Title) (\(.Type))") | join("; ")')) ~ ". Execution " ~ execution.id ~ "."
          } | toJson }}
    else:
      - id: log_no_active_findings
        type: io.kestra.plugin.core.log.Log
        message: "HEALTHY: no GuardDuty findings in {{ inputs.aws_region }} at severity >= {{ inputs.min_severity }} that are not already archived."

  - id: log_audit_complete
    type: io.kestra.plugin.core.log.Log
    description: "Final status line for every run, independent of which branch fired."
    message: "Finding audit complete for detector {{ inputs.detector_id }}. active_finding_count={{ outputs.probe_high_severity_findings.vars.FindingIds | length }}."

errors:
  - id: alert_execution_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: "Alert when the flow itself fails outside the handled branches, for example an invalid detector ID, an unreachable GuardDuty API, or invalid credentials."
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {{ {
        "text": "GuardDuty finding sentinel FAILED in execution " ~ execution.id ~ " for detector " ~ inputs.detector_id ~ " in " ~ inputs.aws_region ~ ". list-findings or get-findings did not complete; investigate before trusting the last known HEALTHY/ACTIVE_FINDINGS_DETECTED status."
      } | toJson }}

extend:
  title: "Amazon GuardDuty High-Severity Active Finding Sentinel"
  shortDescription: "Audit GuardDuty for active high-severity findings with a server-side filter and alert Slack with the exact titles, types, and severities."
  metaTitle: "Amazon GuardDuty Finding Sentinel with Kestra"
  metaDescription: "Audit Amazon GuardDuty for active high-severity findings and alert Slack with the exact threat details, title, and severity."
  description: |
    GuardDuty continuously analyzes VPC Flow Logs, DNS logs, and CloudTrail
    events for threats, but it has no built-in way to say "notify this
    Slack channel the moment a HIGH-severity finding appears" without
    wiring an EventBridge rule and a notification target per account -
    a separate configuration surface from the flow that actually needs to
    react. This blueprint queries GuardDuty's own finding list, filtered
    server-side, fetches the full detail for anything found, and alerts
    Slack with the exact title, type, and severity.

    ## How it works

    1. `periodic_finding_check` (`io.kestra.plugin.core.trigger.Schedule`) runs every 30 minutes, explicitly passing `aws_region`, `detector_id`, and `min_severity` through its own `inputs:` block so the flow is self-contained when the trigger fires. Shipped disabled so a manual run can be verified first.
    2. `probe_high_severity_findings` (`io.kestra.plugin.aws.cli.AwsCLI`) runs `aws guardduty list-findings` with a `finding-criteria` JSON filter for `severity >= min_severity` and `service.archived == false`, capturing the result's `FindingIds` list as a named task output.
    3. `evaluate_findings_presence` (`io.kestra.plugin.core.flow.If`) branches on whether that list has any entries at all.
       - `then` (ACTIVE_FINDINGS_DETECTED): `get_finding_details` fetches the full `Findings` objects for those IDs, then `alert_active_findings` reports each finding's severity, title, and type to Slack.
       - `else` (HEALTHY): `log_no_active_findings` records a clean sweep.
    4. `log_audit_complete` always runs last, printing the active finding count regardless of which branch fired.
    5. The `errors` block alerts Slack separately if the flow itself fails outright - an invalid detector ID or bad credentials must not read as HEALTHY.

    ## What you get

    - A HEALTHY/ACTIVE_FINDINGS_DETECTED answer computed by GuardDuty's own server-side severity and archived-status filter, not by paging through every finding (low-severity and archived included) and filtering client-side.
    - The exact finding title, type, and severity score in the Slack alert itself, instead of requiring someone to open the GuardDuty console to see what was detected.
    - A two-step probe-then-detail pattern (`list-findings` for the cheap existence check, `get-findings` only when something is actually found) so a routine HEALTHY check never pays for the full detail fetch.
    - A worked example of `io.kestra.plugin.aws.cli.AwsCLI` chaining two read-only GuardDuty CLI calls, reusing the same corrected output-capture convention (newlines only, not spaces, stripped before the marker) as this repository's CloudFormation, AWS Config, and AWS Backup sentinel blueprints.

    ## Who it's for

    - Cloud security teams running GuardDuty who need an immediate signal when a real, active threat finding appears, without building and maintaining a separate EventBridge-to-notification pipeline.
    - On-call engineers who want one Slack alert with the exact finding title and type instead of opening the GuardDuty console to check manually.
    - Anyone evaluating the AWS plugin who wants a worked example of `AwsCLI` chaining a filtered list call into a conditional detail fetch, with an open GitHub issue (kestra-io/plugin-aws#796) confirming there is no dedicated GuardDuty task in the plugin to date.

    ## Why orchestrate this with Kestra

    GuardDuty itself has no cross-account "notify me the moment a HIGH-severity finding appears" primitive beyond what you wire up separately in EventBridge and SNS, configuration that then has to be kept in sync as detectors are added or removed. Kestra supplies the schedule, the HEALTHY/ACTIVE_FINDINGS_DETECTED classification as a first-class branch, and an execution history that shows exactly when a threat was detected and what GuardDuty's own analysis said about it.

    ## Prerequisites

    - An AWS account with GuardDuty enabled and a detector active in the target region (update `aws_region`, `detector_id` - obtain the detector ID via `aws guardduty list-detectors`).
    - AWS credentials with `guardduty:ListFindings` and `guardduty:GetFindings` permission - entirely read-only, cannot modify, archive, or suppress any finding.
    - A Slack incoming webhook for alerts.

    This blueprint has no local, account-free testing path. GuardDuty is not available in LocalStack Community at all (Pro tier only, per LocalStack's own documentation), and LocalStack now additionally requires its own account and auth token as of March 2026 regardless. A real AWS account with GuardDuty enabled is the only way to exercise this blueprint meaningfully - note that GuardDuty also takes time after enabling to generate its first findings from real traffic.

    ### Secrets

    - `AWS_ACCESS_KEY_ID` / `AWS_SECRET_ACCESS_KEY`: credentials for `io.kestra.plugin.aws.cli.AwsCLI`.
    - `SLACK_WEBHOOK_URL`: Slack incoming webhook used by `alert_active_findings` and the `errors` block.
    - In Kestra OSS (no Enterprise secrets backend), secrets are supplied as environment variables prefixed `SECRET_`, base64-encoded - for example `SECRET_AWS_SECRET_ACCESS_KEY=$(echo -n '<your-secret-key>' | base64)` - and read back in flows with `{{ secret('NAME') }}`.

    ### Inputs

    - `aws_region` (STRING, default `us-east-1`): region whose GuardDuty detector is audited.
    - `detector_id` (STRING, default `<your-guardduty-detector-id>`, must be replaced): detector to query.
    - `min_severity` (INT, default `7`): severity floor for the server-side filter, matching GuardDuty's own HIGH band.

    ### Outputs

    - `outputs.probe_high_severity_findings.vars.FindingIds`: the list of matching finding IDs (verified field from GuardDuty's own `ListFindings` API reference).
    - `outputs.get_finding_details.vars.Findings`: the full finding objects, only populated on the alert branch, each with `Id`, `Title`, `Type`, `Severity`, `AccountId`, `Description`, `CreatedAt`, `UpdatedAt` (verified fields from GuardDuty's own `GetFindings` API reference).

    ## Quick start

    1. Enable GuardDuty in a real AWS account and note the detector ID from `aws guardduty list-detectors`.
    2. Add the `AWS_ACCESS_KEY_ID`, `AWS_SECRET_ACCESS_KEY`, and `SLACK_WEBHOOK_URL` secrets.
    3. Run the flow manually against a quiet account and confirm `log_no_active_findings` fires.
    4. Use GuardDuty's own documented sample findings feature (`aws guardduty create-sample-findings`) to generate test findings, then re-run to confirm `alert_active_findings` fires with the real finding titles and types.
    5. Enable `periodic_finding_check` once you trust the check against your real detector.

    ## How to extend

    - Loop over several `detector_id` / `aws_region` combinations with `io.kestra.plugin.core.flow.Loop` to audit every region where GuardDuty is enabled in one run.
    - Add a remediation branch that archives a finding (`aws guardduty archive-findings`) once a human has reviewed and dismissed it as a false positive, behind an explicit approval gate - deliberately kept out of this sentinel so the monitoring path never changes any finding's state.
    - Batch `FindingIds` into groups of 50 before calling `get-findings` if `min_severity` is lowered enough that more than 50 active findings are realistic - see Pitfalls.

    ## Pitfalls

    - **`get-findings` accepts at most 50 finding IDs per call**, per GuardDuty's own API reference - if `probe_high_severity_findings` returns more than 50 matching IDs, `get_finding_details` fails outright rather than silently truncating, surfacing through the `errors` block.
    - **Lowering `min_severity` too far can produce a high-volume, noisy alert.** GuardDuty's MEDIUM band starts at 4.0; auditing that low will catch far more routine findings than the HIGH-only default.
    - **The output-capture convention (`tr -d '\n' | xargs -0 -I {} echo '::{"outputs":{}}::'`) deliberately does not strip spaces**, the same corrected pattern used in this repository's CloudFormation, AWS Config, and AWS Backup sentinel blueprints, since `Title` and `Description` are human-readable sentences that stripping spaces would corrupt.
    - **GuardDuty is not available in LocalStack Community at all**, on top of LocalStack now requiring its own account since March 2026 - neither issue is specific to this blueprint; both are disclosed here so they are not mistaken for a bug in it.
    - **This blueprint is UNTESTED against a live AWS account.** The `list-findings` / `get-findings` CLI syntax, the `finding-criteria` JSON structure, and the `FindingIds` / `Findings` / `Severity` / `Title` / `Type` output fields are taken verbatim from AWS's own CLI reference documentation - but no Kestra engine was run to execute this flow end to end.

    ## Links

    - [Kestra AWS plugin documentation](https://kestra.io/plugins/plugin-aws)
    - [Amazon GuardDuty ListFindings API reference](https://docs.aws.amazon.com/cli/latest/reference/guardduty/list-findings.html)
    - [Amazon GuardDuty GetFindings API reference](https://docs.aws.amazon.com/cli/latest/reference/guardduty/get-findings.html)
    - [Kestra secrets (OSS vs Enterprise)](https://kestra.io/docs/concepts/secret)
