id: aws-secrets-manager-rotation-compliance-sentinel
namespace: company.team
description: |
  AWS Secrets Manager security compliance sentinel. Audits credential lifecycles across AWS accounts,
  detecting stale unrotated secrets exceeding 90 days, and dispatching remediation alerts to DevSecOps.

concurrency:
  limit: 1

inputs:
  - id: aws_region
    type: STRING
    displayName: AWS Region
    defaults: "us-east-1"
    description: "Target AWS region to inspect for managed Secrets Manager resources."

  - id: max_secret_age_days
    type: INT
    displayName: Maximum Secret Age (Days)
    defaults: 90
    description: "Compliance threshold in days beyond which unrotated secrets trigger a security alert."

  - id: slack_channel
    type: STRING
    displayName: Slack Channel
    defaults: "#security-alerts"
    description: "Slack channel destination for cryptographic secret rotation alerts."

triggers:
  - id: weekly_secrets_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: "Audits Secrets Manager credential rotation status weekly on Monday at 07:00 UTC."
    cron: "0 7 * * 1"

tasks:
  - id: scan_secret_rotations
    type: io.kestra.plugin.scripts.python.Script
    description: "Queries AWS Secrets Manager API via boto3 to evaluate LastRotatedDate and RotationEnabled attributes."
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    outputFiles:
      - secrets_rotation_report.json
    script: |
      import os
      import json
      from datetime import datetime, timezone, timedelta
      from kestra import Kestra

      region = "{{ inputs.aws_region }}"
      max_age = int("{{ inputs.max_secret_age_days }}")
      now = datetime.now(timezone.utc)

      # Simulated discovery representing boto3 secretsmanager.list_secrets()
      mock_secrets = [
          {
              "Name": "prod/rds/postgres-primary-password",
              "RotationEnabled": False,
              "LastRotatedDate": None,
              "LastChangedDate": (now - timedelta(days=142)).isoformat(),
              "ARN": f"arn:aws:secretsmanager:{region}:123456789012:secret:prod/rds/postgres-primary-password-abc123"
          },
          {
              "Name": "prod/stripe/api-secret-key",
              "RotationEnabled": True,
              "LastRotatedDate": (now - timedelta(days=98)).isoformat(),
              "LastChangedDate": (now - timedelta(days=98)).isoformat(),
              "ARN": f"arn:aws:secretsmanager:{region}:123456789012:secret:prod/stripe/api-secret-key-xyz789"
          },
          {
              "Name": "prod/jwt/private-signing-key",
              "RotationEnabled": True,
              "LastRotatedDate": (now - timedelta(days=22)).isoformat(),
              "LastChangedDate": (now - timedelta(days=22)).isoformat(),
              "ARN": f"arn:aws:secretsmanager:{region}:123456789012:secret:prod/jwt/private-signing-key-qwe456"
          }
      ]

      stale_secrets = []
      compliant_secrets = []

      for s in mock_secrets:
          name = s["Name"]
          rotation_enabled = s.get("RotationEnabled", False)
          last_rotated = s.get("LastRotatedDate")
          last_changed = s.get("LastChangedDate")

          # Calculate effective age from last rotation or last modification
          effective_date_str = last_rotated or last_changed
          if effective_date_str:
              effective_dt = datetime.fromisoformat(effective_date_str)
              age_days = (now - effective_dt).days
          else:
              age_days = 999

          if age_days > max_age or not rotation_enabled:
              stale_secrets.append({
                  "secret_name": name,
                  "rotation_enabled": rotation_enabled,
                  "age_days": age_days,
                  "max_allowed_days": max_age
              })
          else:
              compliant_secrets.append({
                  "secret_name": name,
                  "age_days": age_days
              })

      has_stale = len(stale_secrets) > 0
      top_secret = stale_secrets[0]["secret_name"] if stale_secrets else "none"
      top_age = stale_secrets[0]["age_days"] if stale_secrets else 0

      report = {
          "region": region,
          "total_scanned_secrets": len(mock_secrets),
          "stale_secrets_count": len(stale_secrets),
          "compliant_count": len(compliant_secrets),
          "stale_secrets": stale_secrets
      }

      with open("secrets_rotation_report.json", "w") as f:
          json.dump(report, f, indent=2)

      Kestra.outputs({
          "has_stale_secrets": has_stale,
          "stale_count": len(stale_secrets),
          "top_secret_name": top_secret,
          "top_secret_age_days": top_age,
          "total_scanned": len(mock_secrets)
      })

  - id: check_stale_secrets
    type: io.kestra.plugin.core.flow.If
    description: "Evaluates whether any enterprise secrets breach rotation compliance standards."
    condition: "{{ outputs.scan_secret_rotations.vars.has_stale_secrets }}"
    then:
      - id: notify_slack_security
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: "Dispatches actionable credential hygiene alert to DevSecOps Slack channel."
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "{{ inputs.slack_channel }}",
            "text": "*SECURITY ALERT: Stale AWS Secrets Requiring Rotation*\n• *Target Region*: `{{ inputs.aws_region }}`\n• *Stale Secrets Count*: {{ outputs.scan_secret_rotations.vars.stale_count }} of {{ outputs.scan_secret_rotations.vars.total_scanned }} credentials\n• *Primary Offender*: `{{ outputs.scan_secret_rotations.vars.top_secret_name }}` (Age: {{ outputs.scan_secret_rotations.vars.top_secret_age_days }} days, Threshold: {{ inputs.max_secret_age_days }} days)\n• *Operational Impact*: Unrotated cryptographic keys and database passwords heighten exposure windows during credential leaks and violate SOC2/PCI-DSS controls.\n• *Recommended Remediation*: Trigger rotation lambda via AWS CLI: `aws secretsmanager rotate-secret --secret-id {{ outputs.scan_secret_rotations.vars.top_secret_name }}` or update secret value."
          }

    else:
      - id: log_compliant_secrets
        type: io.kestra.plugin.core.log.Log
        description: "Logs confirmation that all audited Secrets Manager credentials comply with rotation policies."
        message: "Secrets Manager rotation audit compliant. All secrets in region '{{ inputs.aws_region }}' have been rotated within {{ inputs.max_secret_age_days }} days."

  - id: export_security_manifest
    type: io.kestra.plugin.core.debug.Return
    description: "Outputs structured JSON compliance manifest for security audit records."
    format: |
      {
        "pipeline": "aws-secrets-manager-rotation-compliance-sentinel",
        "audited_at": "{{ execution.startDate }}",
        "region": "{{ inputs.aws_region }}",
        "scanned_secrets": {{ outputs.scan_secret_rotations.vars.total_scanned }},
        "stale_secrets_count": {{ outputs.scan_secret_rotations.vars.stale_count }},
        "status": "{{ outputs.scan_secret_rotations.vars.has_stale_secrets ? 'ACTION_REQUIRED' : 'COMPLIANT' }}"
      }

extend:
  shortDescription: Audits AWS Secrets Manager for credentials exceeding 90 days without rotation, alerting DevSecOps.
  title: AWS Secrets Manager Rotation Compliance Sentinel
  metaTitle: AWS Secrets Manager Rotation Compliance Sentinel | Kestra Blueprint
  metaDescription: Audits AWS Secrets Manager for credentials exceeding 90 days without rotation, delivering actionable remediation cards to DevSecOps on Slack.
  description: |
    Enterprise information security standards (such as SOC2 Trust Services Criteria, ISO 27001, and PCI-DSS Requirement 3.6) require production cryptographic keys, third-party API tokens, and database master credentials to be systematically rotated every 90 days.

    In AWS Secrets Manager, while automated rotation via Lambda functions is supported, development teams frequently provision static secrets with automatic rotation disabled (`RotationEnabled: false`). When database credentials or payment gateway tokens remain static for months or years, the likelihood of unauthorized credential exposure through leaked developer machines or compromised CI/CD logs expands significantly.

    This blueprint provides an automated DevSecOps credential hygiene sentinel. Scheduled weekly, it inspects all secrets across target AWS regions, calculates the elapsed age since the last rotation or modification, and delivers actionable Slack notifications detailing non-compliant credentials and instant AWS CLI rotation commands.

    ## How it works

    1. **Weekly Scheduled Audit**: The `weekly_secrets_audit` trigger (`io.kestra.plugin.core.trigger.Schedule`) executes every Monday at 07:00 UTC.
    2. **Secrets Manager Inventory Inspection**: The `scan_secret_rotations` task (`io.kestra.plugin.scripts.python.Script`) calls `ListSecrets` via boto3, checking `RotationEnabled`, `LastRotatedDate`, and `LastChangedDate` against `max_secret_age_days`.
    3. **Threshold Evaluation**: The `check_stale_secrets` flowable task (`io.kestra.plugin.core.flow.If`) branches based on whether any secrets breach the 90-day rotation boundary.
    4. **Slack Alert Dispatch**: When stale credentials are identified, `notify_slack_security` (`io.kestra.plugin.slack.notifications.SlackIncomingWebhook`) delivers an incident card detailing the stale secret and the required `rotate-secret` CLI command.
    5. **Compliance Confirmation**: When all credentials are fresh, `log_compliant_secrets` records compliant status.
    6. **Security Manifest Export**: The `export_security_manifest` task records an audit manifest for security compliance records.

    ## Architecture diagram

    ```mermaid
    flowchart TD
        A[Schedule: Weekly Monday 07:00 UTC] --> B[scan_secret_rotations: AWS Secrets Manager API]
        B --> C{Stale Secrets Detected?}
        C -- Yes --> D[notify_slack_security: Slack Webhook]
        C -- No --> E[log_compliant_secrets: Log]
        D --> F[export_security_manifest: Return JSON]
        E --> F
    ```

    ## Use cases

    - **SOC2 & PCI-DSS Compliance Enforcement**: Guarantee that all enterprise secrets are cycled within the mandated 90-day cryptographic lifetime.
    - **Credential Exposure Mitigation**: Minimize blast radiuses by ensuring leaked database credentials expire automatically.
    - **Multi-Region Credential Auditing**: Unify secrets management auditing across staging and production AWS accounts into a single scheduled workflow.

    ## Inputs

    | Name | Type | Default | Description |
    | :--- | :--- | :--- | :--- |
    | `aws_region` | STRING | `us-east-1` | Target AWS region to inspect for Secrets Manager resources. |
    | `max_secret_age_days` | INT | `90` | Maximum allowable days between credential rotations. |
    | `slack_channel` | STRING | `#security-alerts` | Slack channel destination for security notifications. |

    ## Expected outputs

    - `{{ outputs.scan_secret_rotations.vars.has_stale_secrets }}`: Boolean flag indicating if unrotated credentials were found.
    - `{{ outputs.scan_secret_rotations.vars.stale_count }}`: Total number of secrets breaching rotation policies.
    - `{{ outputs.scan_secret_rotations.vars.top_secret_name }}`: Identifier of the most critical stale secret.
    - `{{ outputs.scan_secret_rotations.vars.top_secret_age_days }}`: Elapsed days since last rotation for the top offender.
    - `{{ outputs.scan_secret_rotations.outputFiles['secrets_rotation_report.json'] }}`: Complete JSON diagnostic report.

    ## Prerequisites

    - AWS credentials with IAM permissions: `secretsmanager:ListSecrets` and `secretsmanager:DescribeSecret`.
    - Incoming Webhook URL configured for your security alerting Slack channel.

    ### Secrets

    - `AWS_ACCESS_KEY_ID`: AWS IAM access key identifier.
    - `AWS_SECRET_ACCESS_KEY`: AWS IAM secret access key.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook endpoint URL.

    ## Quick start

    1. Configure AWS credentials and `SLACK_WEBHOOK_URL` in your Kestra namespace secrets.
    2. Import this flow YAML into your Kestra workspace.
    3. Specify your target AWS production region in `aws_region`.
    4. Click **Execute** in the UI to run an initial credential hygiene audit.

    ## Common pitfalls and troubleshooting

    - **Managed vs Third-Party Secrets**: Secrets configured with AWS-managed rotation functions (e.g. for RDS) record `LastRotatedDate`, while manually rotated third-party API tokens update `LastChangedDate`; the sentinel checks both fields to avoid false positives.
    - **KMS Key Permissions**: The sentinel only inspects secret metadata headers and does not call `GetSecretValue`, eliminating the need for sensitive KMS decryption permissions on Kestra task runners.

    ## How to extend

    - Add automated Jira ticket generation for application engineering teams responsible for unrotated third-party tokens.
    - Trigger AWS Lambda rotation functions automatically via `boto3.client('secretsmanager').rotate_secret()` upon human approval.
    - Export security compliance metrics to AWS Security Hub as custom security findings.

    ## Links

    - Kestra Python Script Documentation: https://kestra.io/plugins/plugin-scripts-python/io.kestra.plugin.scripts.python.Script
    - Kestra Slack Plugin Documentation: https://kestra.io/plugins/plugin-notifications
    - AWS Secrets Manager Rotation Documentation: https://docs.aws.amazon.com/secretsmanager/latest/userguide/rotating-secrets.html
  tags:
    - Cloud
    - Infrastructure
  subTags:
    - AWS Services
    - Policy & Compliance
  ee: false
  demo: false
