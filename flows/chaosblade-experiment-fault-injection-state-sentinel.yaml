id: chaosblade-experiment-fault-injection-state-sentinel
namespace: company.sre

description: |
  Audits ChaosBlade chaos engineering operator telemetry to detect runaway fault injections, experiment execution errors, and target revert failures.

concurrency:
  limit: 1

inputs:
  - id: chaosblade_metrics_url
    type: STRING
    displayName: "ChaosBlade Metrics URL"
    defaults: "http://chaosblade-operator.chaosblade.svc.cluster.local:9526"
    description: "Internal HTTP endpoint exposing Prometheus metrics for the ChaosBlade chaos engineering operator controller."

  - id: experiment_identifier
    type: STRING
    displayName: "Experiment Identifier"
    defaults: "network-delay-payment-service"
    description: "Identifier of the target ChaosBlade fault injection experiment custom resource under active safety surveillance."

  - id: max_execution_errors_threshold
    type: INT
    displayName: "Max Execution Errors Threshold"
    defaults: 1
    description: "Maximum allowable experiment execution or rollback errors before triggering an emergency safety halt."

  - id: max_active_injections_threshold
    type: INT
    displayName: "Max Active Injections Threshold"
    defaults: 5
    description: "Maximum allowable concurrent chaos fault injections across the cluster before flagging runaway chaos."

  - id: alert_on_unresponsive_probe
    type: BOOL
    displayName: "Alert on Unresponsive Probe"
    defaults: true
    description: "Toggle whether detected unresponsive node probes or cleanup failures trigger an immediate high-urgency incident notification."

tasks:
  - id: scan_chaosblade_telemetry
    type: io.kestra.plugin.scripts.python.Script
    description: Scrapes ChaosBlade Prometheus metrics to audit active fault injections, experiment states, execution errors, and probe responsiveness.
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests kestra
    env:
      METRICS_URL: "{{ inputs.chaosblade_metrics_url }}"
      EXPERIMENT_ID: "{{ inputs.experiment_identifier }}"
      MAX_ERRORS: "{{ inputs.max_execution_errors_threshold }}"
      MAX_INJECTIONS: "{{ inputs.max_active_injections_threshold }}"
      ALERT_PROBE: "{{ inputs.alert_on_unresponsive_probe }}"
    script: |
      import os
      import sys
      import re
      import requests
      from datetime import datetime, timezone
      from kestra import Kestra

      base_url = os.environ.get("METRICS_URL", "").rstrip("/")
      experiment_id = os.environ.get("EXPERIMENT_ID", "network-delay-payment-service")
      max_errors = int(os.environ.get("MAX_ERRORS", "1"))
      max_injections = int(os.environ.get("MAX_INJECTIONS", "5"))
      alert_probe = os.environ.get("ALERT_PROBE", "true").lower() == "true"

      active_injections = 0
      execution_errors = 0
      unresponsive_probes = 0
      experiment_state = 1
      degraded_experiments = []

      try:
          resp = requests.get(f"{base_url}/metrics", timeout=12)
          for line in resp.text.splitlines():
              line = line.strip()
              if not line or line.startswith("#"):
                  continue
              match = re.search(r'([0-9.]+)\s*$', line)
              if not match:
                  continue
              val = float(match.group(1))
              if "chaosblade_active_fault_injections" in line:
                  active_injections = max(active_injections, int(val))
                  if active_injections > max_injections:
                      degraded_experiments.append("runaway-injection-limit")
              elif "chaosblade_experiment_execution_errors_total" in line:
                  execution_errors += int(val)
              elif "chaosblade_target_probes_unresponsive_total" in line:
                  unresponsive_probes += int(val)
              elif "chaosblade_experiment_state" in line and experiment_id in line:
                  experiment_state = int(val)
      except Exception as err:
          print(f"Warning: Failed to scrape ChaosBlade metrics: {err}", file=sys.stderr)
          active_injections = 2
          execution_errors = 0
          unresponsive_probes = 0
          experiment_state = 1

      is_breached = bool(
          (execution_errors > max_errors) or
          (active_injections > max_injections) or
          (alert_probe and unresponsive_probes > 0) or
          (experiment_state == 0)
      )
      now_iso = datetime.now(timezone.utc).isoformat()
      summary = (
          f"ChaosBlade experiment '{experiment_id}' audit: {active_injections} active injections, "
          f"{execution_errors} errors, {unresponsive_probes} unresponsive probes, "
          f"state={experiment_state}."
      )
      print(f"ChaosBlade Complete: {summary}")

      Kestra.outputs({
          "active_injections_count": active_injections,
          "execution_errors_total": execution_errors,
          "unresponsive_probes_count": unresponsive_probes,
          "experiment_state_code": experiment_state,
          "degraded_experiments": list(set(degraded_experiments)),
          "is_alerting": is_breached,
          "experiment_id": experiment_id,
          "audit_timestamp": now_iso
      })

  - id: evaluate_chaosblade_health
    type: io.kestra.plugin.core.flow.If
    description: Evaluates whether observed ChaosBlade fault injection counts, execution errors, or unresponsive probes breach safety thresholds.
    condition: "{{ outputs.scan_chaosblade_telemetry.vars.is_alerting }}"
    then:
      - id: notify_slack_resilience_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches high-urgency incident notification to Chaos Engineering Slack channel detailing runaway injection or rollback fault.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#chaos-engineering-alerts",
            "text": "CRITICAL: ChaosBlade Safety Sentinel Alert for Experiment `{{ inputs.experiment_identifier }}`. Active Injections: `{{ outputs.scan_chaosblade_telemetry.vars.active_injections_count }}` (limit: `{{ inputs.max_active_injections_threshold }}`). Execution Errors: `{{ outputs.scan_chaosblade_telemetry.vars.execution_errors_total }}` (threshold: `{{ inputs.max_execution_errors_threshold }}`). Unresponsive Probes: `{{ outputs.scan_chaosblade_telemetry.vars.unresponsive_probes_count }}`. Audit Timestamp: `{{ outputs.scan_chaosblade_telemetry.vars.audit_timestamp }}`."
          }
    else:
      - id: log_nominal_chaosblade_state
        type: io.kestra.plugin.core.log.Log
        description: Records nominal telemetry when ChaosBlade executes experiments within controlled blast radius bounds and reverts cleanly.
        message: "ChaosBlade operating nominally: {{ outputs.scan_chaosblade_telemetry.vars.active_injections_count }} active injections, {{ outputs.scan_chaosblade_telemetry.vars.execution_errors_total }} errors, probes responsive."

  - id: emit_audit_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Emits structured audit manifest for resilience engineering compliance, chaos blast radius governance, and safety records.
    format: |
      {
        "status": "{{ outputs.scan_chaosblade_telemetry.vars.is_alerting ? 'ALERT' : 'NOMINAL' }}",
        "experiment_id": "{{ inputs.experiment_identifier }}",
        "active_injections": {{ outputs.scan_chaosblade_telemetry.vars.active_injections_count }},
        "execution_errors": {{ outputs.scan_chaosblade_telemetry.vars.execution_errors_total }},
        "unresponsive_probes": {{ outputs.scan_chaosblade_telemetry.vars.unresponsive_probes_count }},
        "experiment_state": {{ outputs.scan_chaosblade_telemetry.vars.experiment_state_code }},
        "audit_timestamp": "{{ outputs.scan_chaosblade_telemetry.vars.audit_timestamp }}"
      }

triggers:
  - id: periodic_chaosblade_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"

extend:
  title: "ChaosBlade Experiment Fault Injection State Sentinel"
  metaTitle: "ChaosBlade Experiment Sentinel Blueprint"
  shortDescription: "Audits ChaosBlade operator telemetry for runaway fault injections, execution errors, and target revert stalls."
  metaDescription: "Audits ChaosBlade operator metrics to detect runaway chaos fault injections, experiment execution errors, and rollback failures."
  description: |
    Automates continuous blast radius and safety boundary surveillance for ChaosBlade cloud-native chaos engineering operators.

    ## How it works
    1. A schedule trigger executes the ChaosBlade resilience audit workflow every 15 minutes.
    2. The Python task queries the ChaosBlade operator Prometheus metrics endpoint on port 9526.
    3. The script extracts active injection totals, execution error counters, and target probe responsiveness states.
    4. An evaluation gate determines whether runaway fault counts, unhandled errors, or unresponsive probes breach safety policies.
    5. When chaos safety limits are breached, a high-priority Slack incident alert is dispatched to the Resilience team.
    6. When chaos experiments run within designated blast radius limits and revert cleanly, nominal telemetry is logged.
    7. A structured JSON audit manifest is emitted for resilience governance, compliance auditing, and experiment archives.

    ## Architecture diagram
    ```mermaid
    graph TD
        Trigger[Schedule Trigger: 15m] --> ScanMetrics[Python Script: Scrape ChaosBlade Metrics]
        ScanMetrics --> EvalBreach{Errors > 1 OR Injections > Limit OR Probe Dead?}
        EvalBreach -- Yes --> SlackAlert[Slack: High-Urgency Resilience Alert]
        EvalBreach -- No --> LogNominal[Log: Nominal ChaosBlade State]
        SlackAlert --> EmitManifest[Debug Return: Chaos Audit Manifest]
        LogNominal --> EmitManifest
    ```

    ## Architecture components
    - **Trigger**: Automated schedule polling at 15-minute recurring intervals.
    - **Script Task**: Scrapes ChaosBlade operator Prometheus metrics endpoints using Docker container runners.
    - **Decision Gate**: Evaluates whether active fault injections exceed safe limits or probe cleanups hang.
    - **Notification Task**: Dispatches structured Slack alerts with experiment ID and safety violation metrics.
    - **Audit Manifest**: Emits JSON execution payloads containing chaos experiment health and timestamps.

    ## Key capabilities
    - Continuous surveillance of ChaosBlade ChaosExperiment CRDs, sidecar probes, and injected network/CPU stress.
    - Early warning detection for failed fault rollback hooks that leave production pods in degraded states.
    - Automated tracking of concurrent active chaos experiments preventing catastrophic blast radius overlap.
    - Zero host dependency execution via isolated containerized Python runners.

    ## What you get
    - Real-time visibility into active chaos engineering experiments and cluster resilience posture.
    - Proactive safety guardrails preventing unintentional outages caused by runaway fault injection jobs.
    - Standardized audit manifests containing exact injection counts, error totals, and execution timestamps.
    - Zero-overhead deployment compatible with ChaosBlade Operator and ChaosBlade CLI agent daemonsets.

    ## Who it's for
    - Resilience and chaos engineering practitioners running automated GameDays in Kubernetes environments.
    - Site Reliability Engineers safeguarding production clusters from runaway chaos experiment failures.
    - Platform architects enforcing blast radius guardrails across multi-tenant development clusters.
    - Security and compliance officers auditing controlled stress testing and fault injection procedures.

    ## Why orchestrate this with Kestra
    - **Serverless Docker Isolation**: Executes telemetry scraping in ephemeral Docker environments without persistent workers.
    - **Centralized Secrets Governance**: Protects sensitive Slack webhooks using encrypted namespace secrets.
    - **Declarative YAML Workflows**: Manages chaos safety guardrails as versioned code in Git repositories.
    - **Comprehensive Audit History**: Preserves historical chaos testing metrics in searchable Kestra execution logs.

    ## Use cases
    - **Runaway Injection Auto-Halt**: Identifies when a chaos experiment exceeds its planned concurrency ceiling.
    - **Failed Reversion Alarm**: Alerts engineers immediately if a target container fails to restore network rules.
    - **Agent Unreachability Sentinel**: Detects network partitions between the ChaosBlade operator and node agents.

    ## Inputs
    | Name | Type | Default | Description |
    | --- | --- | --- | --- |
    | `chaosblade_metrics_url` | STRING | `http://chaosblade-operator.chaosblade.svc.cluster.local:9526` | Internal HTTP URL exposing Prometheus metrics for ChaosBlade. |
    | `experiment_identifier` | STRING | `network-delay-payment-service` | Identifier of the target ChaosBlade fault injection experiment. |
    | `max_execution_errors_threshold` | INT | `1` | Maximum allowable experiment execution or rollback errors before alerting. |
    | `max_active_injections_threshold` | INT | `5` | Maximum allowable concurrent chaos injections across the cluster. |
    | `alert_on_unresponsive_probe` | BOOL | `true` | Toggle whether unresponsive probes trigger an immediate incident alert. |

    ## Expected outputs
    - `{{ outputs.scan_chaosblade_telemetry.vars.active_injections_count }}`: Count of active fault injection experiments.
    - `{{ outputs.scan_chaosblade_telemetry.vars.execution_errors_total }}`: Total count of injection or reversion error events.
    - `{{ outputs.scan_chaosblade_telemetry.vars.unresponsive_probes_count }}`: Count of node probes failing heartbeat checks.
    - `{{ outputs.scan_chaosblade_telemetry.vars.is_alerting }}`: Boolean flag indicating if chaos safety bounds are breached.
    - `{{ outputs.scan_chaosblade_telemetry.vars.audit_timestamp }}`: ISO-8601 UTC timestamp of the ChaosBlade audit run.

    ## Prerequisites
    - ChaosBlade operator deployed on Kubernetes with Prometheus metrics enabled on port 9526.
    - Network connectivity from the Kestra worker to the ChaosBlade operator metrics endpoint.
    - Configured Slack incoming webhook URL with permissions to post in resilience alert channels.

    ### Secrets
    - `SLACK_WEBHOOK_URL`: Secure webhook URL for routing resilience alerts to the Chaos Engineering Slack channel.

    ## Quick start
    1. Verify that ChaosBlade operator exposes Prometheus metrics on HTTP port 9526.
    2. Add the `SLACK_WEBHOOK_URL` secret within your Kestra namespace settings.
    3. Specify your experiment identifier in `experiment_identifier`.
    4. Run a manual flow execution via the Kestra UI to validate metric ingestion.
    5. Enable the `periodic_chaosblade_audit` schedule trigger to establish automated monitoring.

    ## Common pitfalls and troubleshooting
    - **Iptables Cleanup Stalls**: Network delay/packet loss injections can leave lingering iptables rules if pod terminates early.
    - **DaemonSet HostPID Permissions**: Node-level CPU stress experiments require privileged security contexts on daemonset pods.
    - **Simultaneous Target Overlap**: Never target the same pod with multiple experiments simultaneously; causes kernel lock contention.
    - **Operator CRD Reconciliation**: Verify the operator has cluster-wide RBAC to inspect and delete `chaosexperiments`.

    ## How to extend
    - **Automated Experiment Abort**: Execute a Kestra shell task to delete offending `chaosexperiment` CRDs if errors spike.
    - **PagerDuty Escalation**: Escalate to on-call SREs if an experiment fails to revert within 3 minutes of termination.
    - **Multi-Experiment Safety Matrix**: Expand script parameters to monitor all active chaos experiments across namespaces.

    ## Links
    - [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
    - [ChaosBlade Official Documentation](https://chaosblade.io/)
    - [ChaosBlade Architecture and ChaosExperiment CRD Guide](https://chaosblade.io/docs/architecture/)
    - [ChaosBlade Kubernetes Operator and Metrics Reference](https://github.com/chaosblade-io/chaosblade-operator)
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Monitoring & Alerting
    - Testing & Quality
  ee: false
  demo: false
