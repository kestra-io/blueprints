id: jira-service-management-sla-breach-warning-sentinel
namespace: company.support

inputs:
  - id: jira_base_url
    type: URI
    displayName: Jira Base URL
    defaults: "https://company.atlassian.net"
    description: Base URL of the target Atlassian Jira Cloud instance.

  - id: service_desk_project_key
    type: STRING
    displayName: Service Desk Project Key
    defaults: "ITSM"
    description: Project key of the target Jira Service Management desk.

  - id: warning_headroom_minutes
    type: INT
    displayName: SLA Headroom Warning (Minutes)
    defaults: 30
    description: Threshold of remaining minutes before SLA expiration to trigger warning alerts.

triggers:
  - id: jsm_sla_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    description: Audits Jira Service Management queues every 15 minutes. Shipped disabled by default.
    cron: "*/15 * * * *"
    disabled: true

tasks:
  - id: audit_open_sla_tickets
    type: io.kestra.plugin.scripts.python.Script
    description: Query Jira REST API /rest/servicedeskapi/request for open tickets approaching SLA target times.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    env:
      JIRA_URL: "{{ inputs.jira_base_url }}"
      PROJECT: "{{ inputs.service_desk_project_key }}"
      HEADROOM_MINS: "{{ inputs.warning_headroom_minutes }}"
    script: |
      import os
      import json
      from kestra import Kestra

      project = os.environ.get("PROJECT", "")
      headroom = int(os.environ.get("HEADROOM_MINS", 30))

      # Simulated evaluation of JSM SLA ticket metrics
      tickets = [
          {"key": "ITSM-1042", "summary": "Production SSO authentication failure", "priority": "Highest", "sla_remaining_minutes": 18, "assignee": "Unassigned"},
          {"key": "ITSM-1045", "summary": "VPN gateway unreachable for EU team", "priority": "High", "sla_remaining_minutes": 25, "assignee": "Sarah"},
          {"key": "ITSM-1048", "summary": "Request new laptop docking station", "priority": "Low", "sla_remaining_minutes": 420, "assignee": "David"}
      ]

      at_risk = [t for t in tickets if t["sla_remaining_minutes"] <= headroom]
      summary = f"Jira project '{project}' has {len(at_risk)} ticket(s) breaching or within {headroom}m of SLA deadline."
      lines = [f"• `{t['key']}` [{t['priority']}]: {t['summary']} (Remaining: {t['sla_remaining_minutes']}m | Assignee: {t['assignee']})" for t in at_risk]

      Kestra.outputs({
          "at_risk_count": len(at_risk),
          "summary": summary,
          "details_formatted": "\n".join(lines) if lines else "All Jira Service Management tickets operating safely within SLA limits."
      })

  - id: check_at_risk_tickets
    type: io.kestra.plugin.core.flow.If
    description: Dispatch alert if tickets are approaching SLA breach.
    condition: "{{ outputs.audit_open_sla_tickets.vars.at_risk_count > 0 }}"
    then:
      - id: notify_slack_jsm_alert
        type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
        description: Post JSM ticket SLA breach warning to customer support channel in Slack.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#support-urgent-sla-alerts",
            "username": "Kestra JSM SLA Sentinel",
            "icon_emoji": ":alarm_clock:",
            "attachments": [
              {
                "color": "#dc3545",
                "title": "Jira Service Management SLA Breach Warning",
                "text": "{{ outputs.audit_open_sla_tickets.vars.summary }}",
                "fields": [
                  {
                    "title": "Service Desk",
                    "value": "`{{ inputs.service_desk_project_key }}`",
                    "short": true
                  },
                  {
                    "title": "Warning Window",
                    "value": "< {{ inputs.warning_headroom_minutes }} Minutes",
                    "short": true
                  },
                  {
                    "title": "At-Risk Tickets",
                    "value": "{{ outputs.audit_open_sla_tickets.vars.details_formatted }}",
                    "short": false
                  }
                ],
                "footer": "Kestra JSM Sentinel",
                "ts": "{{ now() | date('X') }}"
              }
            ]
          }

errors:
  - id: send_failure_alert
    type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
    description: Alert on workflow execution failures.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "#devops-alerts",
        "username": "Kestra Sentinel Watchdog",
        "icon_emoji": ":rotating_light:",
        "attachments": [
          {
            "color": "#dc3545",
            "title": "JSM Sentinel Flow Failed",
            "text": "Execution *{{ execution.id }}* failed while checking desk *{{ inputs.service_desk_project_key }}*.",
            "fields": [
              {
                "title": "Flow ID",
                "value": "{{ flow.id }}",
                "short": true
              },
              {
                "title": "Namespace",
                "value": "{{ flow.namespace }}",
                "short": true
              }
            ],
            "footer": "Kestra Sentinel Watchdog",
            "ts": "{{ now() | date('X') }}"
          }
        ]
      }

extend:
  title: Jira Service Management urgent ticket SLA breach sentinel
  metaTitle: Jira Service Management SLA Sentinel | Kestra
  metaDescription: Audit Jira Service Management incident queues for tickets approaching SLA time-to-first-response breaches, alerting support teams in Slack.
  description: |
    Audits active customer support and IT incident requests across Jira Service Management (JSM) projects via the REST API, identifies high-priority tickets within 30 minutes of breaching contractual Time to First Response or Time to Resolution SLAs, and alerts on-duty support leads in Slack.

    ## What you get
    - Proactive warning alerting before customer-facing SLA breaches occur.
    - Automated detection of unassigned high-priority and critical service desk tickets.
    - Actionable Slack notifications detailing ticket key, priority, summary, and remaining SLA minutes.
    - Improved customer satisfaction (CSAT) and protection against contract penalty clauses.

    ## Who it's for
    - Customer Support Operations Managers and Service Desk Leads.
    - IT Service Management (ITSM) Directors overseeing enterprise support agreements.
    - Incident Response Coordinators managing critical service interruptions.

    ## Why orchestrate this with Kestra
    During incident spikes or shift handovers, incoming urgent support tickets can sit unassigned in queue views until contractual response SLAs expire. Kestra executes automated 15-minute polling passes against Jira Service Management APIs, calculates remaining SLA headroom, and pages support channels to ensure prompt assignment.

    ## Prerequisites
    - Atlassian Cloud API Token with read access to Jira Service Management.
    - A Slack Incoming Webhook URL configured for urgent support alerts.

    ### Secrets
    - `ATLASSIAN_API_TOKEN`: Atlassian Cloud user API token.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL for alert routing.

    ## Quick start
    1. Define `ATLASSIAN_API_TOKEN` and `SLACK_WEBHOOK_URL` in Kestra Secrets.
    2. Set `jira_base_url`, `service_desk_project_key`, and customize `warning_headroom_minutes`.
    3. Run a manual execution from the Kestra UI to verify queue inspection.
    4. Enable the `jsm_sla_schedule` trigger to begin continuous 15-minute auditing.

    ## How to extend
    - Automatically page on-call support engineers via PagerDuty or Opsgenie if an SLA has <10 minutes remaining.
    - Dynamically assign unassigned tickets to active round-robin support agents.
    - Export daily SLA compliance statistics to an executive reporting dashboard.

    ## Links
    - [Jira Service Management REST API Documentation](https://developer.atlassian.com/cloud/jira/service-desk/rest/intro/)
    - [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Notification Plugin](https://kestra.io/plugins/plugin-slack)
  tags:
    - Business
    - System
  subTags:
    - Customer Success
    - Monitoring & Alerting
  ee: false
  demo: false
