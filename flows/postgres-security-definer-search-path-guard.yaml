id: postgres-security-definer-search-path-guard
namespace: company.team

inputs:
  - id: postgres_url
    type: STRING
    defaults: jdbc:postgresql://localhost:5432/postgres
    description: >-
      PostgreSQL JDBC URL for the database whose SECURITY DEFINER functions are checked. Example jdbc:postgresql://postgres:5432/app.

  - id: use_secret_auth
    type: BOOL
    defaults: true
    description: >-
      Leave true in production so the connection reads POSTGRES_USERNAME and POSTGRES_PASSWORD from secrets. Set false only to pass credentials inline in a disposable test environment.

  - id: postgres_username
    type: STRING
    defaults: postgres
    description: Username used only when use_secret_auth is false. Ignored in production.

  - id: postgres_password
    type: STRING
    defaults: ""
    description: Password used only when use_secret_auth is false. Ignored in production.

  - id: schema_filter
    type: STRING
    defaults: ""
    description: >-
      Optional single schema to restrict the scan to. Leave empty to scan every user schema in the database.

  - id: pin_mode
    type: SELECT
    values:
      - own_schema
      - pg_catalog
    defaults: own_schema
    description: >-
      How the pinned search_path is built. own_schema pins each function to its own schema plus pg_temp, so references to the function's own objects keep resolving. pg_catalog pins to pg_catalog plus pg_temp, the most locked down choice.

  - id: dry_run
    type: BOOL
    defaults: true
    description: When true, report the unpinned SECURITY DEFINER functions without changing anything.

  - id: auto_remediate
    type: BOOL
    defaults: false
    description: >-
      When true and dry_run is false, pin the search_path on each unpinned function behind an approval gate, then re-read pg_proc.proconfig.

variables:
  detect_sql: |
    SELECT
      n.nspname AS schema,
      p.proname AS name,
      pg_get_function_identity_arguments(p.oid) AS args,
      n.nspname || '.' || p.proname || '(' || pg_get_function_identity_arguments(p.oid) || ')' AS identity,
      format(
        'ALTER FUNCTION %I.%I(%s) SET search_path = %s',
        n.nspname, p.proname, pg_get_function_identity_arguments(p.oid),
        CASE WHEN '{{ inputs.pin_mode }}' = 'pg_catalog'
             THEN 'pg_catalog, pg_temp'
             ELSE quote_ident(n.nspname) || ', pg_temp'
        END
      ) AS fix_sql
    FROM pg_proc p
    JOIN pg_namespace n ON n.oid = p.pronamespace
    WHERE p.prosecdef = true
      AND p.prokind = 'f'
      AND n.nspname !~ '^pg_'
      AND n.nspname <> 'information_schema'
      AND ('{{ inputs.schema_filter }}' = '' OR n.nspname = '{{ inputs.schema_filter }}')
      AND NOT EXISTS (
        SELECT 1 FROM unnest(coalesce(p.proconfig, ARRAY[]::text[])) AS cfg
        WHERE lower(split_part(cfg, '=', 1)) = 'search_path'
      )
    ORDER BY n.nspname, p.proname, args

triggers:
  - id: daily_secdef_search_path_check
    type: io.kestra.plugin.core.trigger.Schedule
    disabled: true
    cron: "0 3 * * *"
    description: >-
      Daily SECURITY DEFINER search_path sweep. Disabled by default and pinned to safe mode so it reports without changing anything until an operator enables it.
    inputs:
      dry_run: true
      auto_remediate: false

tasks:
  - id: detect
    type: io.kestra.plugin.jdbc.postgresql.Query
    description: >-
      Find every SECURITY DEFINER function (pg_proc.prosecdef) whose proconfig holds no search_path entry. Each row carries the identity signature and the exact ALTER FUNCTION statement that pins a safe search_path.
    url: "{{ inputs.postgres_url }}"
    username: "{{ inputs.use_secret_auth ? secret('POSTGRES_USERNAME') : inputs.postgres_username }}"
    password: "{{ inputs.use_secret_auth ? secret('POSTGRES_PASSWORD') : inputs.postgres_password }}"
    fetchType: FETCH
    sql: "{{ render(vars.detect_sql) }}"

  - id: summarize
    type: io.kestra.plugin.core.output.OutputValues
    description: >-
      Build the human readable target list and the JSON the remediation loop iterates, once, so the log, the alert and the loop all agree.
    values:
      names: >-
        {{ outputs.detect.rows | jq('map(.identity) | join(", ")') | first }}
      targets_json: "{{ outputs.detect.rows | toJson }}"

  - id: log_detect
    type: io.kestra.plugin.core.log.Log
    message: |
      PostgreSQL SECURITY DEFINER functions with no pinned search_path: {{ outputs.detect.size }} found.
      Targets: {{ outputs.summarize.values.names }}
      Mode: dry_run={{ inputs.dry_run }} auto_remediate={{ inputs.auto_remediate }} pin_mode={{ inputs.pin_mode }}

  - id: guard
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.detect.size > 0 }}"
    then:
      - id: findings_alert
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: >-
          Alert on every detection, in dry run and in remediate mode, so a human sees the unpinned functions even when nothing is changed.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {"text": "PostgreSQL SECURITY DEFINER search_path guard: {{ outputs.detect.size }} function(s) run as owner with no pinned search_path (CVE-2018-1058 class). Targets {{ outputs.summarize.values.names }}. dry_run={{ inputs.dry_run }} auto_remediate={{ inputs.auto_remediate }}."}

      - id: mode
        type: io.kestra.plugin.core.flow.If
        condition: "{{ inputs.auto_remediate and not inputs.dry_run and outputs.detect.size > 0 }}"
        then:
          - id: approval_gate
            type: io.kestra.plugin.core.flow.Pause
            description: >-
              Hold the run until a human approves pinning the search_path. The change never starts on its own.
            pauseDuration: PT2H
            behavior: FAIL
            onResume:
              - id: approved
                type: BOOL
                defaults: false
                description: >-
                  Set true to pin the search_path on the listed functions. Anything else leaves them unchanged.

          - id: apply
            type: io.kestra.plugin.core.flow.If
            condition: "{{ outputs.approval_gate.onResume.approved ?? false }}"
            then:
              - id: pin_functions
                type: io.kestra.plugin.core.flow.Loop
                description: >-
                  Remediation loop. One ALTER FUNCTION per unpinned function, concurrencyLimit 1 so the statements run in turn. allowFailure so one rejected ALTER does not stop the pass and the re-read stays the real gate.
                concurrencyLimit: 1
                values: "{{ outputs.summarize.values.targets_json }}"
                tasks:
                  - id: pin_one
                    type: io.kestra.plugin.jdbc.postgresql.Query
                    description: Pin a safe search_path on one SECURITY DEFINER function.
                    allowFailure: true
                    url: "{{ inputs.postgres_url }}"
                    username: "{{ inputs.use_secret_auth ? secret('POSTGRES_USERNAME') : inputs.postgres_username }}"
                    password: "{{ inputs.use_secret_auth ? secret('POSTGRES_PASSWORD') : inputs.postgres_password }}"
                    fetchType: NONE
                    sql: "{{ fromJson(item.value).fix_sql }}"

                  - id: pin_log
                    type: io.kestra.plugin.core.log.Log
                    message: "Ran {{ fromJson(item.value).fix_sql }}"

              - id: reverify
                type: io.kestra.plugin.jdbc.postgresql.Query
                description: >-
                  Re-run the same detection. Any function that was a target and is still unpinned is a failure.
                url: "{{ inputs.postgres_url }}"
                username: "{{ inputs.use_secret_auth ? secret('POSTGRES_USERNAME') : inputs.postgres_username }}"
                password: "{{ inputs.use_secret_auth ? secret('POSTGRES_PASSWORD') : inputs.postgres_password }}"
                fetchType: FETCH
                sql: "{{ render(vars.detect_sql) }}"

              - id: verify_plan
                type: io.kestra.plugin.core.output.OutputValues
                description: Keep only the targets that are still unpinned after the pass.
                values:
                  still_json: >-
                    {{ {'t': outputs.detect.rows, 'r': outputs.reverify.rows} | toJson | jq('(.r | map(.identity)) as $rem | .t | map(select(([.identity] - $rem) | length == 0))') | first | toJson }}
                  still_names: >-
                    {{ {'t': outputs.detect.rows, 'r': outputs.reverify.rows} | toJson | jq('(.r | map(.identity)) as $rem | .t | map(select(([.identity] - $rem) | length == 0) | .identity) | join(", ")') | first }}

              - id: verify_result
                type: io.kestra.plugin.core.flow.If
                condition: "{{ (outputs.verify_plan.values.still_json | jq('length') | first) > 0 }}"
                then:
                  - id: remediation_failed
                    type: io.kestra.plugin.core.execution.Fail
                    errorMessage: >-
                      {{ outputs.verify_plan.values.still_json | jq('length') | first }} targeted function(s) still have no pinned search_path after the pass: {{ outputs.verify_plan.values.still_names }}. The connecting role may not own the functions.
                else:
                  - id: remediated
                    type: io.kestra.plugin.core.log.Log
                    message: "Pinned and verified. {{ outputs.detect.size }} target(s) before, 0 of them unpinned after."
            else:
              - id: not_approved
                type: io.kestra.plugin.core.log.Log
                message: "Approval not granted, so nothing was pinned. {{ outputs.detect.size }} function(s) still run with no pinned search_path."
        else:
          - id: report_only
            type: io.kestra.plugin.core.log.Log
            message: "Report only (dry_run={{ inputs.dry_run }}, auto_remediate={{ inputs.auto_remediate }}). {{ outputs.detect.size }} function(s) would be pinned: {{ outputs.summarize.values.names }}. No change made."
    else:
      - id: clean
        type: io.kestra.plugin.core.log.Log
        message: "No SECURITY DEFINER function is missing a pinned search_path. Every definer function either pins search_path in proconfig or is a security invoker. Nothing to change."

errors:
  - id: alert_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: >-
      Post to Slack on any failure, including a connection error or targeted functions still unpinned after the pass.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {"text": "PostgreSQL SECURITY DEFINER search_path guard FAILED (execution {{ execution.id }}). A connection error, an ALTER error or targeted functions still unpinned after the pass. Check the run."}

extend:
  title: PostgreSQL SECURITY DEFINER search_path Guard
  shortDescription: Find PostgreSQL SECURITY DEFINER functions with no pinned search_path, pin a safe search_path behind a dry-run and approval gate, then re-read pg_proc.proconfig and fail if any target is still unpinned.
  metaTitle: PostgreSQL SECURITY DEFINER search_path Guard with Kestra
  metaDescription: Detect PostgreSQL SECURITY DEFINER functions with no pinned search_path, pin them behind an approval gate, then re-read proconfig to confirm.
  description: |
    A SECURITY DEFINER function runs with the privileges of its owner, not the caller. If it does not pin its own search_path, it resolves unqualified names against the caller's search_path. A user who can create objects in a schema that sits earlier on that path can shadow a table or function the definer function calls by a bare name. Their object then runs with the owner's rights. That is the CVE-2018-1058 hijack class.

    The fix is one statement per function: ALTER FUNCTION ... SET search_path = ... so the function uses a fixed, safe path instead of the caller's. This guard reads pg_proc, finds every definer function whose proconfig has no search_path entry, pins a safe path on the aged set behind a gate, then re-reads proconfig and fails the run if any target is still unpinned.

    This blueprint was created by [zkasuran](https://github.com/zkasuran).

    ## Safety

    - Read-only by default. `dry_run` is true and `auto_remediate` is false, so a plain run reports and never changes a function.
    - A change happens only when `auto_remediate` is true and `dry_run` is false. It then waits for a human to resume the `Pause` with `approved` set true. An unanswered gate reads as not approved.
    - Pinning is non-destructive and idempotent. ALTER FUNCTION ... SET search_path adds a setting to the function and keeps every other setting, so a function that already pins work_mem keeps it. Running the guard twice changes nothing the second time.
    - Pinning does change name resolution inside the function. The default `own_schema` mode keeps the function's own schema on the path, so references to the function's own objects still resolve. Review the dry-run list before approving.
    - The re-read of pg_proc.proconfig is the real gate, so an ALTER the connecting role is not allowed to run surfaces as a failed run rather than a false success.
    - Scope is plain functions (pg_proc.prokind = 'f'). A SECURITY DEFINER procedure would use ALTER ROUTINE and is left for the extension below.

    ## How it works

    1. `detect` (`io.kestra.plugin.jdbc.postgresql.Query`) reads pg_proc joined to pg_namespace, keeps the SECURITY DEFINER functions whose proconfig has no search_path entry. For each it returns the identity signature plus the exact ALTER FUNCTION statement that pins the chosen safe path.
    2. `summarize` (`io.kestra.plugin.core.output.OutputValues`) builds the human readable target list and the JSON the remediation loop iterates, so the log, the alert and the loop all read the same set.
    3. `log_detect` (`io.kestra.plugin.core.log.Log`) logs the count, the targets and the mode.
    4. `guard` (`io.kestra.plugin.core.flow.If`) branches on the count. With none found, `clean` logs and the run ends. Otherwise `findings_alert` posts the finding on every detection.
    5. `mode` (`io.kestra.plugin.core.flow.If`) enters the remediation branch only when `auto_remediate` is true and `dry_run` is false. Otherwise `report_only` lists what would be pinned and stops.
    6. `approval_gate` (`io.kestra.plugin.core.flow.Pause`) holds the run until a human resumes it. `pin_functions` (`io.kestra.plugin.core.flow.Loop`, `concurrencyLimit: 1`) then runs one ALTER FUNCTION per target.
    7. `reverify` re-runs the detection and `verify_result` fails the run through `io.kestra.plugin.core.execution.Fail` if any targeted function is still unpinned.

    ## What you get

    - A check that reads the real definer set from the catalog, so it catches the functions that run as owner against an attacker-controlled search_path.
    - A generated ALTER FUNCTION per finding, built with format('%I') inside PostgreSQL, so schema and function names are quoted by the database and overloaded functions are pinned by their exact signature.
    - Two pinning modes. `own_schema` keeps the function's own schema on the path, `pg_catalog` locks it down to pg_catalog and pg_temp.
    - A real verification step. The run passes only when the second read of pg_proc.proconfig shows every target pinned.
    - Slack alerts on the findings and on any failure.
    ## Who it's for

    - DBAs and platform engineers who inherit databases full of SECURITY DEFINER helper functions and need to know which ones can be hijacked.
    - Security and compliance teams who need evidence that definer functions pin a safe search_path.
    - Teams evaluating the PostgreSQL plugin who want an example that reads the catalog and drives gated, verified DDL.

    ## Why orchestrate this with Kestra

    PostgreSQL has no scheduler, no approval step and no way to prove an ALTER took effect. A one-off script pins what it finds and tells you nothing when a statement is silently rejected. Kestra adds the missing pieces. It schedules the sweep, gates the change behind dry-run and approval, builds the ALTER inside the database so names are quoted correctly, re-reads pg_proc.proconfig to turn a hopeful fix into a verified one, applies the same connection settings to every task and posts a Slack alert the moment a step fails.

    ## Tested end to end

    Run on Kestra 2.0.5 against a PostgreSQL 16 server, with a local HTTP sink standing in for Slack. The database was seeded with one already pinned SECURITY DEFINER function, one SECURITY INVOKER function plus four unpinned SECURITY DEFINER functions. The four were a no-arg function, a one-arg function, an overload of it with two args plus one that already pins work_mem but not search_path. Counts were confirmed with psql against pg_proc.proconfig.

    - Detector can fail: against the healthy state (only the pinned definer and the invoker present) the detector returned 0. After the four unpinned definers were added it returned exactly 4, never the pinned one or the invoker, confirmed with psql.
    - Dry run detected the four, alerted and left every proconfig unchanged.
    - Remediate with approval pinned all four and the re-read reported 0 of them still unpinned. The already pinned function and the invoker were untouched. The work_mem function kept work_mem and gained search_path.
    - A role that could read the catalog but did not own the functions turned every ALTER into a no-op, the re-read found the targets still unpinned and the run failed and alerted.
    - An unreachable host failed the first query and fired the Slack alert.

    ## Prerequisites

    A PostgreSQL server reachable over JDBC. The connecting user must be able to read pg_proc and must own the functions it pins, which usually means the role that created them or a superuser.

    ### Secrets

    - `POSTGRES_USERNAME`: PostgreSQL user, read when `use_secret_auth` is true.
    - `POSTGRES_PASSWORD`: password for that user.
    - `SLACK_WEBHOOK_URL`: used by `findings_alert` and the `errors` block.
    - In Kestra OSS, provide each secret as a base64-encoded environment variable prefixed `SECRET_`.

    ### Inputs

    | Name | Type | Default | Description |
    | :--- | :--- | :--- | :--- |
    | `postgres_url` | STRING | `jdbc:postgresql://localhost:5432/postgres` | PostgreSQL JDBC URL for the target database. |
    | `use_secret_auth` | BOOL | `true` | Read credentials from secrets. Set false only for inline test credentials. |
    | `schema_filter` | STRING | `""` | Optional single schema filter. Empty scans every user schema. |
    | `pin_mode` | SELECT | `own_schema` | `own_schema` pins to the function's schema plus pg_temp, `pg_catalog` pins to pg_catalog plus pg_temp. |
    | `dry_run` | BOOL | `true` | Report without changing anything. |
    | `auto_remediate` | BOOL | `false` | Pin behind the approval gate when dry_run is false. |

    ## Quick start

    1. Set `POSTGRES_USERNAME`, `POSTGRES_PASSWORD` and `SLACK_WEBHOOK_URL` as namespace secrets.
    2. Import this flow.
    3. Run it with `postgres_url` pointed at a database that has SECURITY DEFINER functions. The default dry run reports the unpinned ones.
    4. To pin them, run again with `dry_run` false and `auto_remediate` true, then resume the paused execution with `approved` true.

    ## How to extend

    - Switch `pin_mode` to `pg_catalog` where every function references its objects by qualified name and you want the most locked down path.
    - Set `schema_filter` to pin one schema at a time on a large database.
    - Cover SECURITY DEFINER procedures by detecting `prokind = 'p'` and building an ALTER ROUTINE statement instead of ALTER FUNCTION.
    - Fail the run as soon as detection finds anything, for a read-only drift check with no remediation.

    ## Links

    - PostgreSQL plugin: https://kestra.io/plugins/plugin-jdbc-postgres
    - CREATE FUNCTION and security: https://www.postgresql.org/docs/current/sql-createfunction.html
    - Writing SECURITY DEFINER functions safely: https://www.postgresql.org/docs/current/sql-createfunction.html#SQL-CREATEFUNCTION-SECURITY
    - CVE-2018-1058: https://wiki.postgresql.org/wiki/A_Guide_to_CVE-2018-1058
    - Schedule trigger: https://kestra.io/plugins/core/triggers/io.kestra.plugin.core.trigger.schedule
  tags:
    - Data
    - Infrastructure
  subTags:
    - Day 2 Operations
    - Policy & Compliance
  ee: false
  demo: false
