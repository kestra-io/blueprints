id: kafka-under-replicated-partitions-sentinel
namespace: company.dataops

inputs:
  - id: kafka_bootstrap_servers
    type: STRING
    defaults: kafka:9092
    description: Host and port of the Kafka bootstrap servers.
  - id: max_tolerated_under_replicated_partitions
    type: INT
    defaults: 0
    description: Maximum allowed under-replicated partitions before alerting.

tasks:
  - id: inspect_under_replicated_partitions
    type: io.kestra.plugin.scripts.shell.Commands
    runner: PROCESS
    commands:
      - |
        kafka-topics.sh --bootstrap-server {{ inputs.kafka_bootstrap_servers }}           --describe --under-replicated-partitions > under_replicated.txt 2>/dev/null || true
        python3 -c "
        import json
        with open('under_replicated.txt') as f:
            lines = [line.strip() for line in f if line.strip() and not line.startswith('WARNING')]
        count = len(lines)
        result = {
            'under_replicated_count': count,
            'partition_details': lines[:10],
            'is_degraded': count > {{ inputs.max_tolerated_under_replicated_partitions }}
        }
        with open('kafka_health.json', 'w') as out:
            json.dump(result, out)
        print('Kafka partition audit:', result)
        "
    outputFiles:
      - kafka_health.json

  - id: evaluate_broker_health
    type: io.kestra.plugin.core.flow.If
    condition: "{{ json(read(outputs.inspect_under_replicated_partitions.outputFiles['kafka_health.json'])).is_degraded }}"
    then:
      - id: alert_kafka_administrators
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "text": ":fire: *Kafka Replication Alert*: Detected {{ json(read(outputs.inspect_under_replicated_partitions.outputFiles['kafka_health.json'])).under_replicated_count }} under-replicated partitions on {{ inputs.kafka_bootstrap_servers }}. Immediate broker inspection required."
          }

errors:
  - id: notify_sentinel_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "text": ":warning: *Kafka Sentinel Execution Failure*: Unable to connect to Kafka bootstrap servers at {{ inputs.kafka_bootstrap_servers }}."
      }

triggers:
  - id: scheduled_replication_check
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/10 * * * *"
    disabled: true

extend:
  title: Apache Kafka Under-Replicated Partitions Broker Health Sentinel
  shortDescription: Audits Kafka topic partitions and alerts immediately when replica lag threatens cluster fault tolerance.
  description: |
    ## How it works
    This sentinel runs `kafka-topics.sh` against the target bootstrap cluster to query topic partitions whose in-sync replica (ISR) set has fallen below the configured replication factor. It parses partition descriptions and triggers instant alerts when replication drift is discovered.

    ## What you get
    - Continuous programmatic validation of Kafka partition high availability.
    - Rapid alerting before broker offline events lead to unrecoverable data loss.
    - Specific partition diagnostic output forwarded directly to Slack incident channels.

    ## Who it's for
    - Event streaming engineers and SREs responsible for Apache Kafka cluster uptime.
    - Data platform engineers managing high-throughput pub/sub infrastructure.

    ## Why orchestrate this with Kestra
    Kestra schedules and monitors mission-critical streaming pipelines with end-to-end visibility. Incorporating health sentinels into your Kestra orchestration topology ensures infrastructure integrity alongside data workflows.

    ## Prerequisites
    - Network connectivity to the Kafka bootstrap servers from the Kestra worker environment.
    - Kafka CLI utilities installed in the runner container or host.
    - Secret `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import this blueprint into Kestra.
    2. Adjust `kafka_bootstrap_servers` to point to your cluster.
    3. Test the flow manually, then enable the 10-minute schedule.

    ## How to extend
    - Query Kafka consumer group lag for critical consumer groups using `kafka-consumer-groups.sh`.
    - Automatically trigger broker restart or rebalance automation when partition skews occur.
    - Integrate with PagerDuty for high-priority off-hours escalation.

    ## Links
    - [Kestra Kafka Plugin Documentation](https://kestra.io/plugins/plugin-kafka)
    - [Apache Kafka Documentation](https://kafka.apache.org/documentation/)
  tags:
    - Data
    - Infrastructure
  subTags:
    - Monitoring & Alerting
  ee: false
  demo: false
