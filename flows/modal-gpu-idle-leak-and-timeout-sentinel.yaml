id: modal-gpu-idle-leak-and-timeout-sentinel
namespace: company.aiops

description: |
  Audits Modal serverless AI inference applications to detect hung GPU containers, excessive runtime leaks, and costly cold-start idle drift.

concurrency:
  limit: 1

inputs:
  - id: app_name
    type: STRING
    displayName: Modal Application Name
    description: Name of the target Modal application running GPU workloads (e.g., llm-inference-service).
    defaults: "llm-inference-service"

  - id: max_runtime_minutes_threshold
    type: INT
    displayName: Max Container Runtime Threshold (minutes)
    description: Flag GPU containers running longer than this duration without scaling down.
    defaults: 30

  - id: max_active_gpu_containers_threshold
    type: INT
    displayName: Max Active GPU Containers Threshold
    description: Alert if total active GPU containers exceed this safety ceiling.
    defaults: 5

  - id: slack_channel
    type: STRING
    displayName: Slack FinOps Alerts Channel
    description: Slack channel for AI compute leak and hung GPU notifications.
    defaults: "#ai-finops"

tasks:
  - id: audit_modal_app_containers
    type: io.kestra.plugin.scripts.python.Script
    description: Inspects active Modal containers, measuring runtime duration and flagging potential hung GPU tasks.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests kestra
    env:
      MODAL_TOKEN_ID: "{{ secret('MODAL_TOKEN_ID') }}"
      MODAL_TOKEN_SECRET: "{{ secret('MODAL_TOKEN_SECRET') }}"
      APP_NAME: "{{ inputs.app_name }}"
      MAX_RUNTIME_MINUTES: "{{ inputs.max_runtime_minutes_threshold }}"
      MAX_GPU_COUNT: "{{ inputs.max_active_gpu_containers_threshold }}"
    script: |
      import os
      import sys
      import json
      import requests
      from kestra import Kestra

      token_id = os.environ.get("MODAL_TOKEN_ID", "").strip()
      token_secret = os.environ.get("MODAL_TOKEN_SECRET", "").strip()
      app_name = os.environ.get("APP_NAME", "").strip()
      max_runtime_min = int(os.environ.get("MAX_RUNTIME_MINUTES", 30))
      max_gpu_count = int(os.environ.get("MAX_GPU_COUNT", 5))

      if not token_id or not token_secret:
          print("ERROR: MODAL_TOKEN_ID and MODAL_TOKEN_SECRET secrets are required.", file=sys.stderr)
          sys.exit(1)

      url = "https://api.modal.com/v1/apps"
      headers = {
          "Authorization": f"Bearer {token_id}:{token_secret}",
          "Accept": "application/json"
      }

      print(f"Querying Modal applications from {url} for app '{app_name}'...")
      try:
          resp = requests.get(url, headers=headers, timeout=15)
          resp.raise_for_status()
          apps_data = resp.json()
      except Exception as e:
          print(f"ERROR: Failed to connect to Modal API: {e}", file=sys.stderr)
          sys.exit(1)

      containers = []
      for app in apps_data.get("apps", []):
          if app.get("name") == app_name:
              for c in app.get("active_containers", []):
                  containers.append({
                      "container_id": c.get("id", "unknown"),
                      "function_name": c.get("function_name", "unknown"),
                      "gpu_type": c.get("gpu", "none"),
                      "runtime_minutes": int(c.get("runtime_seconds", 0) / 60),
                      "status": c.get("status", "running")
                  })

      hung_containers = [c for c in containers if c.get("runtime_minutes", 0) > max_runtime_min]
      total_active_gpus = len(containers)
      is_runtime_breached = len(hung_containers) > 0
      is_capacity_breached = total_active_gpus > max_gpu_count
      has_breach = is_runtime_breached or is_capacity_breached

      summary = {
          "app_name": app_name,
          "total_active_gpus": total_active_gpus,
          "hung_containers_count": len(hung_containers),
          "hung_containers": hung_containers,
          "is_runtime_breached": is_runtime_breached,
          "is_capacity_breached": is_capacity_breached,
          "has_breach": has_breach
      }

      with open("modal_gpu_audit_metrics.json", "w") as f:
          json.dump(summary, f, indent=2)

      print(f"Modal audit complete for '{app_name}': active_gpus={total_active_gpus}, hung={len(hung_containers)}, breach={has_breach}")

      Kestra.outputs({
          "has_breach": has_breach,
          "total_active_gpus": total_active_gpus,
          "hung_containers_count": len(hung_containers),
          "is_runtime_breached": is_runtime_breached,
          "is_capacity_breached": is_capacity_breached
      })

    outputFiles:
      - modal_gpu_audit_metrics.json

  - id: evaluate_gpu_leak
    type: io.kestra.plugin.core.flow.If
    description: Evaluates whether active GPU container count or execution runtime breaches safety ceilings.
    condition: "{{ outputs.audit_modal_app_containers.vars.has_breach }}"
    then:
      - id: notify_slack_finops_leak
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches high-priority GPU compute leak alert to designated Slack channel.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "{{ inputs.slack_channel }}",
            "username": "Modal-GPU-Sentinel",
            "text": "CRITICAL: Modal GPU Compute Leak Detected in App `{{ inputs.app_name }}`!\nTotal Active GPU Containers: `{{ outputs.audit_modal_app_containers.vars.total_active_gpus }}` (Limit: `{{ inputs.max_active_gpu_containers_threshold }}`)\nHung GPU Containers (> {{ inputs.max_runtime_minutes_threshold }}m): `{{ outputs.audit_modal_app_containers.vars.hung_containers_count }}`."
          }
    else:
      - id: log_sentinel_summary
        type: io.kestra.plugin.core.log.Log
        description: Records nominal GPU workload status.
        message: "Modal application {{ inputs.app_name }} running nominally. Total active GPU containers: {{ outputs.audit_modal_app_containers.vars.total_active_gpus }}, hung containers: {{ outputs.audit_modal_app_containers.vars.hung_containers_count }}."

outputs:
  - id: has_breach
    type: BOOLEAN
    value: "{{ outputs.audit_modal_app_containers.vars.has_breach }}"
  - id: total_active_gpus
    type: INT
    value: "{{ outputs.audit_modal_app_containers.vars.total_active_gpus }}"
  - id: hung_containers_count
    type: INT
    value: "{{ outputs.audit_modal_app_containers.vars.hung_containers_count }}"
  - id: is_runtime_breached
    type: BOOLEAN
    value: "{{ outputs.audit_modal_app_containers.vars.is_runtime_breached }}"
  - id: is_capacity_breached
    type: BOOLEAN
    value: "{{ outputs.audit_modal_app_containers.vars.is_capacity_breached }}"

triggers:
  - id: periodic_gpu_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"

extend:
  title: Modal GPU Idle Leak and Timeout Sentinel
  metaTitle: Modal GPU Idle Leak and Timeout Sentinel Blueprint
  shortDescription: Audits Modal serverless AI applications to detect hung GPU containers and runtime leaks.
  metaDescription: Audits Modal serverless AI inference applications to detect hung GPU containers, excessive runtime leaks, and costly cold-start idle drift.
  description: |
    Audits Modal serverless AI inference applications to detect hung GPU containers, excessive runtime leaks, and costly cold-start idle drift before cloud billing overruns occur.
  tags:
    - AI
    - Cloud
