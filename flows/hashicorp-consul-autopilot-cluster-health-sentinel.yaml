id: hashicorp-consul-autopilot-cluster-health-sentinel
namespace: company.mesh

inputs:
  - id: consul_url
    type: STRING
    defaults: "http://consul.internal:8500"
    description: Base URL of Consul server.

tasks:
  - id: inspect_autopilot_health
    type: io.kestra.plugin.scripts.shell.Commands
    commands:
      - |
        # Query Consul Autopilot health API
        curl -s -H "X-Consul-Token: {{ secret('CONSUL_HTTP_TOKEN') }}"           "{{ inputs.consul_url }}/v1/operator/autopilot/health" > /tmp/consul_telemetry.json
        
        HEALTHY=$(jq -r '.Healthy // false' /tmp/consul_telemetry.json)
        FAILURE_TOLERANCE=$(jq '.FailureTolerance // 0' /tmp/consul_telemetry.json)
        
        echo "::set-output name=is_healthy::$HEALTHY::"
        echo "::set-output name=failure_tolerance::$FAILURE_TOLERANCE::"

  - id: evaluate_consul_health
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.inspect_autopilot_health.vars.is_healthy != 'true' }}"
    then:
      - id: notify_platform_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#service-mesh-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 HashiCorp Consul Cluster Unhealthy Alert",
                "text": "Consul cluster at `{{ inputs.consul_url }}` reported UNHEALTHY state (Healthy: false, Failure Tolerance: {{ outputs.inspect_autopilot_health.vars.failure_tolerance }})! Raft consensus quorum is degraded or server nodes are failing health checks.",
                "footer": "Kestra Service Mesh Sentinel • HashiCorp Consul"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#service-mesh-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ Consul Sentinel Failure",
            "text": "Failed to connect to Consul Autopilot API. Verify server URL and ACL token.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  metaDescription: "Audits HashiCorp Consul Autopilot for Raft quorum health and voter commit index synchronization to prevent cluster brain-split."
  metaTitle: HashiCorp Consul Autopilot Raft Quorum and Cluster Health Sentinel with Kestra
  title: HashiCorp Consul Autopilot Raft Quorum and Cluster Health Sentinel
  shortDescription: Audits HashiCorp Consul Autopilot for Raft quorum health and voter commit index synchronization to prevent cluster brain-split.
  description: |
    ## How it works
    This workflow connects to the HashiCorp Consul Operator API (`/v1/operator/autopilot/health`) using an ACL token to inspect cluster Autopilot health. Autopilot continuously assesses Raft consensus health, server member stability, voter synchronization, and cluster failure tolerance (how many server node failures the cluster can withstand before quorum loss). If `Healthy == false` or failure tolerance drops to 0, service registration, key-value lookups, and Connect service mesh routing are at imminent risk of total outage. This workflow triggers alerts before consensus collapses.

    ## What you get
    - Real-time detection of degraded Raft consensus in HashiCorp Consul clusters.
    - Prevents catastrophic cluster quorum loss and split-brain scenarios.
    - Clear visibility into failure tolerance and server node readiness.

    ## Who it's for
    - Platform Engineers and Infrastructure SREs operating HashiCorp Consul.
    - Network Architects managing service discovery and Connect service mesh.

    ## Why orchestrate this with Kestra
    - **Continuous Core Infrastructure Monitoring**: Proactively monitors critical consensus engines.
    - **Secure ACL Integration**: Automatically passes secret tokens using Kestra secret store.
    - **Instant Team Escalation**: Delivers incident notifications with quorum metrics directly to Slack.

    ## Prerequisites
    - Consul server with Autopilot enabled and operator read ACL token.
    - Secrets `CONSUL_HTTP_TOKEN` and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import the blueprint.
    2. Input Consul server URL.
    3. Run the workflow to inspect Autopilot health.

    ## How to extend
    - Query `/v1/operator/raft/configuration` to view specific server node IP addresses and voter statuses.
    - Alert when Raft commit index lag exceeds 100 transactions between leader and followers.

    ## Links
    - [Consul Autopilot Health API Documentation](https://developer.hashicorp.com/consul/api-docs/operator/autopilot#read-health)
    - [Kestra Documentation](https://kestra.io/docs)
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Day 2 Operations
    - Infrastructure Automation
  ee: false
  demo: false
