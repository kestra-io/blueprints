id: aws-dynamodb-unused-gsi-capacity-sentinel
namespace: company.dataops

inputs:
  - id: aws_region
    type: STRING
    defaults: us-east-1
    description: AWS region where DynamoDB tables reside.

tasks:
  - id: audit_dynamodb_gsis
    type: io.kestra.plugin.aws.cli.AwsCLI
    runner: PROCESS
    region: "{{ inputs.aws_region }}"
    accessKeyId: "{{ secret('AWS_ACCESS_KEY_ID') }}"
    secretKeyId: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
    commands:
      - |
        aws dynamodb list-tables --output json > tables.json
        python3 -c "
        import json, subprocess
        with open('tables.json') as f:
            tables = json.load(f).get('TableNames', [])
        gsi_report = []
        for tbl in tables[:20]:
            cmd = f'aws dynamodb describe-table --table-name {tbl} --output json'
            res = subprocess.run(cmd, shell=True, capture_output=True, text=True)
            if res.returncode == 0:
                tbl_info = json.loads(res.stdout).get('Table', {})
                gsis = tbl_info.get('GlobalSecondaryIndexes', [])
                for gsi in gsis:
                    gsi_report.append({
                        'table': tbl,
                        'gsi_name': gsi.get('IndexName'),
                        'status': gsi.get('IndexStatus'),
                        'item_count': gsi.get('ItemCount', 0)
                    })
        unused_gsis = [g for g in gsi_report if g['item_count'] == 0]
        output = {
            'total_gsis': len(gsi_report),
            'unused_count': len(unused_gsis),
            'unused_list': unused_gsis,
            'alert_triggered': len(unused_gsis) > 0
        }
        with open('gsi_summary.json', 'w') as out:
            json.dump(output, out)
        print('DynamoDB GSI audit:', output)
        "
    outputFiles:
      - gsi_summary.json

  - id: evaluate_unused_gsis
    type: io.kestra.plugin.core.flow.If
    condition: "{{ json(read(outputs.audit_dynamodb_gsis.outputFiles['gsi_summary.json'])).alert_triggered }}"
    then:
      - id: alert_data_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "text": ":bar_chart: *DynamoDB Capacity Alert*: Detected {{ json(read(outputs.audit_dynamodb_gsis.outputFiles['gsi_summary.json'])).unused_count }} unused Global Secondary Indexes with zero items in {{ inputs.aws_region }}."
          }

errors:
  - id: notify_sentinel_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "text": ":warning: *DynamoDB Sentinel Execution Failure*: Failed to audit DynamoDB tables in {{ inputs.aws_region }}."
      }

triggers:
  - id: scheduled_gsi_check
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 10 * * 1"
    disabled: true

extend:
  title: AWS DynamoDB Unused Global Secondary Index Capacity Sentinel
  shortDescription: Audits DynamoDB tables to identify dormant Global Secondary Indexes incurring idle storage and throughput costs.
  description: |
    ## How it works
    This workflow scans DynamoDB tables within an AWS region via `AwsCLI`. For each table, it inspects defined Global Secondary Indexes (GSIs), reviews their item counts and operational states, and flags dormant or empty indexes that continue to accrue provisioned capacity or storage overhead.

    ## What you get
    - Systematic auditing of DynamoDB indexes across your AWS microservices.
    - Early warning against dormant GSIs created for deprecated query patterns.
    - Automated Slack alerts summarizing affected tables and index names.

    ## Who it's for
    - Database administrators and backend engineers managing NoSQL database costs.
    - Cloud infrastructure teams driving AWS FinOps optimization initiatives.

    ## Why orchestrate this with Kestra
    Kestra coordinates multi-step database discovery logic using standard CLI tooling and declarative flow definitions. Scheduled execution ensures continuous visibility without relying on manual database audits.

    ## Prerequisites
    - AWS credentials with `dynamodb:ListTables` and `dynamodb:DescribeTable` IAM permissions.
    - Secrets `AWS_ACCESS_KEY_ID`, `AWS_SECRET_ACCESS_KEY`, and `SLACK_WEBHOOK`.

    ## Quick start
    1. Import this blueprint to your Kestra environment.
    2. Configure AWS credentials and Slack webhook secret.
    3. Trigger a manual execution to audit your DynamoDB fleet.

    ## How to extend
    - Query CloudWatch metrics (`ConsumedReadCapacityUnits`, `ConsumedWriteCapacityUnits`) over 14-day rolling windows.
    - Add automated index deletion proposals via human-in-the-loop approval subflows.
    - Group findings by AWS cost center tags.

    ## Links
    - [Kestra AWS Plugin](https://kestra.io/plugins/plugin-aws)
    - [AWS DynamoDB GSI Documentation](https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/GSI.html)
  tags:
    - Data
    - Cloud
  subTags:
    - Monitoring & Alerting
    - FinOps & Cost Management
  ee: false
  demo: false
