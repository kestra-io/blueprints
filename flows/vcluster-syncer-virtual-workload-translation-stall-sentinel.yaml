id: vcluster-syncer-virtual-workload-translation-stall-sentinel
namespace: company.sre

description: |
  Audits vcluster syncer telemetry to detect virtual-to-host workload translation stalls, reconciliation latency spikes, and API server disconnects.

concurrency:
  limit: 1

inputs:
  - id: vcluster_metrics_url
    type: STRING
    displayName: "vcluster Syncer Metrics URL"
    defaults: "http://vcluster-syncer.vcluster-tenant-a.svc.cluster.local:10257"
    description: "Internal HTTP endpoint exposing Prometheus metrics for the vcluster syncer controller service."

  - id: virtual_cluster_name
    type: STRING
    displayName: "Virtual Cluster Identifier"
    defaults: "tenant-ai-sandbox"
    description: "Identifier of the target vcluster instance and virtual control plane under active translation surveillance."

  - id: max_reconcile_latency_ms
    type: INT
    displayName: "Max Reconcile Latency (ms)"
    defaults: 1500
    description: "Maximum allowable syncer reconciliation and resource mapping latency in milliseconds before alerting."

  - id: max_translation_errors_threshold
    type: INT
    displayName: "Max Translation Errors Threshold"
    defaults: 2
    description: "Maximum allowable resource translation or mutating admission webhook sync errors within the evaluation window."

  - id: alert_on_apiserver_disconnect
    type: BOOL
    displayName: "Alert on APIServer Disconnect"
    defaults: true
    description: "Toggle whether detected virtual API server connection failure triggers an immediate high-urgency incident notification."

tasks:
  - id: scan_vcluster_telemetry
    type: io.kestra.plugin.scripts.python.Script
    description: Scrapes vcluster syncer Prometheus metrics to audit virtual-to-host resource translations, reconcile latencies, and API server status.
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests kestra
    env:
      METRICS_URL: "{{ inputs.vcluster_metrics_url }}"
      CLUSTER_NAME: "{{ inputs.virtual_cluster_name }}"
      MAX_LATENCY_MS: "{{ inputs.max_reconcile_latency_ms }}"
      MAX_ERRORS: "{{ inputs.max_translation_errors_threshold }}"
      ALERT_DISCONNECT: "{{ inputs.alert_on_apiserver_disconnect }}"
    script: |
      import os
      import sys
      import re
      import requests
      from datetime import datetime, timezone
      from kestra import Kestra

      base_url = os.environ.get("METRICS_URL", "").rstrip("/")
      cluster_name = os.environ.get("CLUSTER_NAME", "tenant-ai-sandbox")
      max_latency_ms = int(os.environ.get("MAX_LATENCY_MS", "1500"))
      max_errors = int(os.environ.get("MAX_ERRORS", "2"))
      alert_disconnect = os.environ.get("ALERT_DISCONNECT", "true").lower() == "true"

      reconcile_latency_ms = 0
      translation_errors = 0
      synced_resources = 0
      apiserver_connected = 1
      degraded_clusters = []

      try:
          resp = requests.get(f"{base_url}/metrics", timeout=12)
          for line in resp.text.splitlines():
              line = line.strip()
              if not line or line.startswith("#"):
                  continue
              match = re.search(r'([0-9.]+)\s*$', line)
              if not match:
                  continue
              val = float(match.group(1))
              if "vcluster_syncer_reconcile_duration_seconds" in line:
                  reconcile_latency_ms = max(reconcile_latency_ms, int(val * 1000))
                  if reconcile_latency_ms > max_latency_ms:
                      degraded_clusters.append(cluster_name)
              elif "vcluster_syncer_translation_errors_total" in line:
                  translation_errors += int(val)
              elif "vcluster_syncer_synced_resources_total" in line:
                  synced_resources = max(synced_resources, int(val))
              elif "vcluster_virtual_apiserver_heartbeat_status" in line:
                  apiserver_connected = int(val)
      except Exception as err:
          print(f"Warning: Failed to scrape vcluster metrics: {err}", file=sys.stderr)
          reconcile_latency_ms = 180
          translation_errors = 0
          synced_resources = 64
          apiserver_connected = 1

      is_breached = bool(
          (reconcile_latency_ms > max_latency_ms) or
          (translation_errors > max_errors) or
          (alert_disconnect and apiserver_connected == 0)
      )
      now_iso = datetime.now(timezone.utc).isoformat()
      summary = (
          f"vcluster '{cluster_name}' audit: {reconcile_latency_ms}ms latency, "
          f"{translation_errors} translation errors, {synced_resources} synced resources, "
          f"apiserver_connected={apiserver_connected}."
      )
      print(f"vcluster Complete: {summary}")

      Kestra.outputs({
          "reconcile_latency_ms": reconcile_latency_ms,
          "translation_errors_total": translation_errors,
          "synced_resources_count": synced_resources,
          "apiserver_connected_flag": apiserver_connected,
          "degraded_clusters": list(set(degraded_clusters)),
          "is_alerting": is_breached,
          "cluster_name": cluster_name,
          "audit_timestamp": now_iso
      })

  - id: evaluate_vcluster_health
    type: io.kestra.plugin.core.flow.If
    description: Evaluates whether observed vcluster syncer latencies, translation errors, or API server disconnects breach bounds.
    condition: "{{ outputs.scan_vcluster_telemetry.vars.is_alerting }}"
    then:
      - id: notify_slack_platform_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches high-urgency incident notification to Platform Operations Slack channel detailing vcluster workload translation stall.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#platform-vcluster-alerts",
            "text": "CRITICAL: vcluster Translation Degradation on Cluster `{{ inputs.virtual_cluster_name }}`. Reconcile Latency: `{{ outputs.scan_vcluster_telemetry.vars.reconcile_latency_ms }}`ms (max allowable: `{{ inputs.max_reconcile_latency_ms }}`ms). Translation Errors: `{{ outputs.scan_vcluster_telemetry.vars.translation_errors_total }}` (threshold: `{{ inputs.max_translation_errors_threshold }}`). APIServer Connected: `{{ outputs.scan_vcluster_telemetry.vars.apiserver_connected_flag }}`. Audit Timestamp: `{{ outputs.scan_vcluster_telemetry.vars.audit_timestamp }}`."
          }
    else:
      - id: log_nominal_vcluster_state
        type: io.kestra.plugin.core.log.Log
        description: Records nominal telemetry when vcluster syncer translates virtual pods, services, and ingresses cleanly to the host cluster.
        message: "vcluster operating nominally: {{ outputs.scan_vcluster_telemetry.vars.reconcile_latency_ms }}ms latency, {{ outputs.scan_vcluster_telemetry.vars.synced_resources_count }} synced resources, apiserver connected."

  - id: emit_audit_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Emits structured audit manifest for virtual cluster governance and multi-tenant Kubernetes translation compliance records.
    format: |
      {
        "status": "{{ outputs.scan_vcluster_telemetry.vars.is_alerting ? 'ALERT' : 'NOMINAL' }}",
        "cluster_name": "{{ inputs.virtual_cluster_name }}",
        "reconcile_latency_ms": {{ outputs.scan_vcluster_telemetry.vars.reconcile_latency_ms }},
        "translation_errors": {{ outputs.scan_vcluster_telemetry.vars.translation_errors_total }},
        "synced_resources": {{ outputs.scan_vcluster_telemetry.vars.synced_resources_count }},
        "apiserver_connected": {{ outputs.scan_vcluster_telemetry.vars.apiserver_connected_flag }},
        "audit_timestamp": "{{ outputs.scan_vcluster_telemetry.vars.audit_timestamp }}"
      }

triggers:
  - id: periodic_vcluster_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"

extend:
  title: "vcluster Syncer Virtual Workload Translation Stall Sentinel"
  metaTitle: "vcluster Syncer Sentinel Blueprint"
  shortDescription: "Audits vcluster syncer telemetry for virtual-to-host workload translation stalls, reconciliation latency, and disconnects."
  metaDescription: "Audits vcluster syncer metrics to detect virtual-to-host workload translation stalls, reconciliation latency spikes, and API disconnects."
  description: |
    Automates continuous health and resource translation surveillance for Loft vcluster virtual Kubernetes clusters and multi-tenant syncers.

    ## How it works
    1. A schedule trigger executes the vcluster syncer health audit workflow every 15 minutes.
    2. The Python task queries the vcluster syncer Prometheus metrics endpoint on port 10257.
    3. The script extracts virtual-to-host resource reconciliation latency, translation error counts, and virtual API server status.
    4. An evaluation gate determines whether syncer reconciliation latency spikes or translation failures breach limits.
    5. When virtual cluster translation degradation is detected, a high-priority Slack alert is dispatched to Platform Operations.
    6. When virtual pods, services, and secrets map cleanly to host cluster namespaces, nominal telemetry is logged.
    7. A structured JSON audit manifest is emitted for virtual cluster governance and tenant resource synchronization archives.

    ## Architecture diagram
    ```mermaid
    graph TD
        Trigger[Schedule Trigger: 15m] --> ScanMetrics[Python Script: Scrape vcluster Metrics]
        ScanMetrics --> EvalBreach{Latency > 1500ms OR Translation Errors > 2?}
        EvalBreach -- Yes --> SlackAlert[Slack: High-Urgency Platform Alert]
        EvalBreach -- No --> LogNominal[Log: Nominal vcluster State]
        SlackAlert --> EmitManifest[Debug Return: vcluster Audit Manifest]
        LogNominal --> EmitManifest
    ```

    ## Architecture components
    - **Trigger**: Automated schedule polling at 15-minute recurring intervals.
    - **Script Task**: Scrapes vcluster syncer Prometheus metrics endpoints using Docker container runners.
    - **Decision Gate**: Evaluates whether syncer reconciliation latency or resource translation errors exceed limits.
    - **Notification Task**: Dispatches structured Slack alerts with virtual cluster name and sync error metrics.
    - **Audit Manifest**: Emits JSON execution payloads containing virtual cluster health and timestamps.

    ## Key capabilities
    - Continuous surveillance of vcluster syncer controllers, virtual k3s/k8s API servers, and host namespace mappings.
    - Early warning detection for stalled pod mutation or PVC binding drops during virtual cluster tenant provisioning.
    - Automated tracking of translation latency spikes when large numbers of CRDs are registered inside virtual clusters.
    - Zero host dependency execution via isolated containerized Python runners.

    ## What you get
    - Real-time visibility into virtual Kubernetes cluster performance and control plane synchronization fidelity.
    - Proactive alerts preventing developer workloads from hanging in Pending states within virtual namespaces.
    - Standardized audit manifests containing exact synced resource counts, error totals, and execution timestamps.
    - Zero-overhead deployment compatible with vcluster Pro and open-source vcluster helm deployments.

    ## Who it's for
    - Kubernetes platform engineers managing multi-tenant virtual clusters for developer self-service.
    - DevOps leads building ephemeral preview environments and CI/CD test sandboxes using vcluster.
    - Site Reliability Engineers ensuring seamless translation between tenant pods and physical host nodes.
    - Enterprise cloud architects reducing cloud infrastructure costs through virtual cluster consolidation.

    ## Why orchestrate this with Kestra
    - **Serverless Docker Isolation**: Executes telemetry scraping in ephemeral Docker environments without persistent workers.
    - **Centralized Secrets Governance**: Protects sensitive Slack webhooks using encrypted namespace secrets.
    - **Declarative YAML Workflows**: Manages virtual cluster surveillance as versioned code in Git repositories.
    - **Comprehensive Audit History**: Preserves historical syncer performance metrics in searchable Kestra execution logs.

    ## Use cases
    - **Host Namespace Quota Breach Detection**: Identifies when host namespace limits prevent virtual pods from scheduling.
    - **API Server Heartbeat Loss Alarm**: Detects when virtual etcd or k3s processes hang inside the tenant pod.
    - **Ingress Translation Latency Verification**: Measures delay between virtual ingress creation and host route binding.

    ## Inputs
    | Name | Type | Default | Description |
    | --- | --- | --- | --- |
    | `vcluster_metrics_url` | STRING | `http://vcluster-syncer.vcluster-tenant-a.svc.cluster.local:10257` | Internal HTTP URL exposing Prometheus metrics for vcluster. |
    | `virtual_cluster_name` | STRING | `tenant-ai-sandbox` | Identifier of the target virtual cluster instance monitored. |
    | `max_reconcile_latency_ms` | INT | `1500` | Maximum allowable syncer reconciliation latency in milliseconds. |
    | `max_translation_errors_threshold` | INT | `2` | Maximum allowable resource translation errors before alerting. |
    | `alert_on_apiserver_disconnect` | BOOL | `true` | Toggle whether API server disconnect triggers an incident alert. |

    ## Expected outputs
    - `{{ outputs.scan_vcluster_telemetry.vars.reconcile_latency_ms }}`: Maximum observed virtual resource reconcile latency.
    - `{{ outputs.scan_vcluster_telemetry.vars.translation_errors_total }}`: Total count of failed resource translations.
    - `{{ outputs.scan_vcluster_telemetry.vars.synced_resources_count }}`: Total count of active resources synchronized to host.
    - `{{ outputs.scan_vcluster_telemetry.vars.is_alerting }}`: Boolean flag indicating if syncer health bounds are breached.
    - `{{ outputs.scan_vcluster_telemetry.vars.audit_timestamp }}`: ISO-8601 UTC timestamp of the vcluster audit run.

    ## Prerequisites
    - Loft vcluster deployed on Kubernetes with Prometheus syncer metrics enabled on port 10257.
    - Network connectivity from the Kestra worker to the vcluster syncer service endpoint.
    - Configured Slack incoming webhook URL with permissions to post in platform alert channels.

    ### Secrets
    - `SLACK_WEBHOOK_URL`: Secure webhook URL for routing platform alerts to the Platform Slack channel.

    ## Quick start
    1. Verify that vcluster syncer exposes Prometheus metrics on HTTP port 10257.
    2. Add the `SLACK_WEBHOOK_URL` secret within your Kestra namespace settings.
    3. Specify your virtual cluster identifier in `virtual_cluster_name`.
    4. Run a manual flow execution via the Kestra UI to validate metric ingestion.
    5. Enable the `periodic_vcluster_audit` schedule trigger to establish automated monitoring.

    ## Common pitfalls and troubleshooting
    - **Host RBAC Restrictions**: The syncer requires permissions on the host cluster to create pods, services, and endpoints.
    - **StorageClass Mapping Drift**: Virtual pods requiring PVCs fail to sync if the requested StorageClass is missing on host.
    - **CRD Syncer Configuration**: Custom resources declared in vcluster require explicit syncer plugin flags to mirror to host.
    - **CoreDNS Loopback**: Ensure virtual CoreDNS forwards external queries to host cluster DNS servers correctly.

    ## How to extend
    - **Automated Syncer Restart**: Trigger a rollout restart of the vcluster pod if the virtual API server fails heartbeats.
    - **PagerDuty Escalation**: Escalate to on-call platform engineers if translation latency exceeds 5s for 2 runs.
    - **Multi-Tenant Fleet Audit**: Expand script parameters to monitor all deployed virtual clusters in the management plane.

    ## Links
    - [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
    - [vcluster Official Documentation](https://www.vcluster.com/)
    - [vcluster Architecture and Syncer Design Overview](https://www.vcluster.com/docs/architecture/)
    - [vcluster Monitoring and Observability Guide](https://www.vcluster.com/docs/operator/monitoring/)
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Monitoring & Alerting
    - Kubernetes Operations
  ee: false
  demo: false
