id: aws-elastic-ip-unassociated-cost-sentinel
namespace: company.cloud

inputs:
  - id: aws_region
    type: STRING
    defaults: "us-east-1"
    description: Target AWS region.
  - id: unassociated_eip_threshold
    type: INT
    defaults: 0
    description: Maximum acceptable count of unallocated or unassociated Elastic IP addresses.

tasks:
  - id: audit_unassociated_eips
    type: io.kestra.plugin.aws.cli.AwsCLI
    region: "{{ inputs.aws_region }}"
    accessKeyId: "{{ secret('AWS_ACCESS_KEY_ID') }}"
    secretKeyId: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
    commands:
      - |
        aws ec2 describe-addresses --output json > /tmp/all_eips.json
        
        UNASSOCIATED_EIPS=$(jq '[.Addresses[] | select(.AssociationId == null) | {public_ip: .PublicIp, allocation_id: .AllocationId, domain: .Domain}]' /tmp/all_eips.json)
        UNASSOCIATED_COUNT=$(echo "$UNASSOCIATED_EIPS" | jq 'length')
        
        echo "::set-output name=unassociated_count::$UNASSOCIATED_COUNT::"
        echo "::set-output name=unassociated_list::$UNASSOCIATED_EIPS::"

  - id: evaluate_eip_waste
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.audit_unassociated_eips.vars.unassociated_count | int > inputs.unassociated_eip_threshold }}"
    then:
      - id: notify_finops_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#finops-cost-alerts",
            "attachments": [
              {
                "color": "warning",
                "title": "⚠️ AWS Unassociated Elastic IP Address Cost Leak Alert",
                "text": "Detected *{{ outputs.audit_unassociated_eips.vars.unassociated_count }}* unassociated Elastic IP(s) in `{{ inputs.aws_region }}`. Unallocated addresses: {{ outputs.audit_unassociated_eips.vars.unassociated_list }}. Impact: AWS bills an hourly idle penalty fee for allocated Elastic IPs that are not actively bound to running EC2 or NAT instances.",
                "footer": "Kestra FinOps Sentinel • AWS Elastic IP"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#finops-cost-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ AWS Elastic IP Sentinel Execution Failed",
            "text": "The Elastic IP audit workflow failed. Please verify AWS credentials and ec2:DescribeAddresses permissions.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 8 * * 1"
    disabled: true

extend:
  title: AWS Unassociated Elastic IP Address Idle Cost Leak Sentinel
  shortDescription: Audits AWS EC2 Elastic IP allocations to detect unassociated idle public IPv4 addresses incurring hourly penalty charges.
  description: |
    ## How it works
    This workflow uses the official AWS CLI plugin to query `aws ec2 describe-addresses` across the specified AWS region. It filters for Elastic IP allocations where `AssociationId` is null, indicating an allocated public IPv4 address sitting detached from any active EC2 instance or network interface. AWS charges an hourly penalty fee for every unassociated IPv4 address. When idle IPs exceed the threshold, an automated alert is sent to Slack.

    ## What you get
    - Proactive discovery of forgotten, orphaned public IPv4 addresses across AWS accounts.
    - Eliminates recurring idle cloud infrastructure expenses.
    - Inventory of idle public IP addresses and Allocation IDs for immediate release.

    ## Who it's for
    - Cloud Financial Operations (FinOps) specialists minimizing monthly AWS billing waste.
    - Cloud Infrastructure Engineers performing account hygiene across development and sandbox environments.

    ## Why orchestrate this with Kestra
    - **Native AWS Integration**: Uses official `io.kestra.plugin.aws.cli.AwsCLI` with secure credentials injection.
    - **Automated Cadence**: Run weekly or monthly cost hygiene sweeps without dedicated daemon servers.
    - **Safe Remediation Path**: Easily extend the workflow with `aws ec2 release-address` approval gates.

    ## Prerequisites
    - AWS IAM credentials with `ec2:DescribeAddresses` permissions.
    - Secrets `AWS_ACCESS_KEY_ID`, `AWS_SECRET_ACCESS_KEY`, and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import this blueprint into Kestra.
    2. Configure AWS credentials and Slack webhook.
    3. Run the workflow to identify idle Elastic IPs in your AWS account.

    ## How to extend
    - Add an automated branch to release unassociated Elastic IPs older than 7 days automatically.
    - Sweep across all active AWS regions in a parallel loop.

    ## Links
    - [Amazon EC2 Elastic IP Addresses Documentation](https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/elastic-ip-addresses-eip.html)
    - [Kestra AWS Plugin](https://kestra.io/plugins/plugin-aws)
  tags:
    - Cloud
    - Business
  ee: false
  demo: false
