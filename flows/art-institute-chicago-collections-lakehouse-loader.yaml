id: art-institute-chicago-collections-lakehouse-loader
namespace: company.analytics
description: Ingests museum fine art collections, artist attributions, artwork mediums, and provenance metadata from the Art Institute of Chicago into Parquet lakehouse storage via DuckDB, tracking artifact collections in Kestra KV store.

inputs:
  - id: limit
    type: INT
    description: Number of museum artwork objects to harvest.
    defaults: 25

  - id: state_key
    type: STRING
    description: Kestra KV store key maintaining the latest known museum artwork IDs.
    defaults: artic_monitored_artworks_state

variables:
  default_state: "[]"

triggers:
  - id: weekly_curation_sync
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 5 * * 0"

tasks:
  - id: get_current_state
    type: io.kestra.plugin.core.kv.Get
    key: "{{ inputs.state_key }}"
    errorOnMissing: false

  - id: ingest_and_transform_artworks
    type: io.kestra.plugin.scripts.python.Commands
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install requests duckdb
    commands:
      - |
        python3 - << 'EOF'
        import os
        import json
        import requests
        import duckdb
        from datetime import datetime

        raw_state = """{{ outputs.get_current_state.value ?? vars.default_state }}"""
        try:
            seen_artworks = set(json.loads(raw_state)) if raw_state else set()
        except Exception:
            seen_artworks = set()

        limit = int("{{ inputs.limit }}")

        url = f"https://api.artic.edu/api/v1/artworks?limit={limit}&fields=id,title,artist_display,date_display,medium_display,place_of_origin,department_title,is_public_domain"
        headers = {"User-Agent": "KestraArtInstituteLakehouse/1.0 (museum-curation@kestra.io)"}

        records = []
        new_artworks = []
        harvested_ids = []

        try:
            resp = requests.get(url, headers=headers, timeout=20)
            if resp.status_code == 200:
                data = resp.json()
                items = data.get("data", [])
                for a in items:
                    art_id = a.get("id")
                    title = a.get("title", "")
                    artist = (a.get("artist_display") or "")[:200]
                    date_disp = a.get("date_display", "")
                    medium = (a.get("medium_display") or "")[:150]
                    origin = a.get("place_of_origin", "")
                    dept = a.get("department_title", "")
                    is_public = bool(a.get("is_public_domain", False))

                    is_new = art_id not in seen_artworks
                    harvested_ids.append(art_id)

                    records.append({
                        "artwork_id": art_id,
                        "title": title,
                        "artist_display": artist,
                        "date_display": date_disp,
                        "medium": medium,
                        "place_of_origin": origin,
                        "department": dept,
                        "is_public_domain": is_public,
                        "is_new_catalog_entry": is_new,
                        "harvest_time": datetime.utcnow().isoformat()
                    })

                    if is_new:
                        new_artworks.append({"id": art_id, "title": title, "artist": artist})
        except Exception as e:
            print(f"Error fetching Art Institute Chicago collection: {e}")

        with open("artic_artworks.json", "w", encoding="utf-8") as f:
            json.dump(records, f)

        con = duckdb.connect()
        if records:
            con.execute("CREATE TABLE artic_collection AS SELECT * FROM read_json_auto('artic_artworks.json')")
            con.execute("COPY artic_collection TO 'art_institute_chicago_archive.parquet' (FORMAT PARQUET)")
            con.execute("COPY artic_collection TO 'art_institute_chicago_archive.csv' (HEADER, DELIMITER ',')")
        else:
            con.execute("""
                CREATE TABLE artic_collection (
                    artwork_id BIGINT,
                    title VARCHAR,
                    artist_display VARCHAR,
                    date_display VARCHAR,
                    medium VARCHAR,
                    place_of_origin VARCHAR,
                    department VARCHAR,
                    is_public_domain BOOLEAN,
                    is_new_catalog_entry BOOLEAN,
                    harvest_time VARCHAR
                )
            """)
            con.execute("COPY artic_collection TO 'art_institute_chicago_archive.parquet' (FORMAT PARQUET)")
            con.execute("COPY artic_collection TO 'art_institute_chicago_archive.csv' (HEADER, DELIMITER ',')")

        summary = {
            "total_harvested_artworks": len(records),
            "new_artworks_count": len(new_artworks),
            "new_artworks": new_artworks[:5],
            "updated_state": list(set(list(seen_artworks) + harvested_ids))[:500]
        }

        print(f"::{{'outputs': {json.dumps(summary)}}}::")
        EOF
    outputFiles:
      - art_institute_chicago_archive.parquet
      - art_institute_chicago_archive.csv

  - id: persist_state
    type: io.kestra.plugin.core.kv.Set
    key: "{{ inputs.state_key }}"
    value: "{{ outputs.ingest_and_transform_artworks.vars.updated_state | toJson }}"

  - id: check_new_artworks
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.ingest_and_transform_artworks.vars.new_artworks_count > 0 }}"
    then:
      - id: notify_new_artworks
        type: io.kestra.plugin.core.log.Log
        level: INFO
        message: "🎨 Museum Fine Art Catalog Sync: Discovered {{ outputs.ingest_and_transform_artworks.vars.new_artworks_count }} newly cataloged master artworks from the Art Institute of Chicago."

outputs:
  - id: total_artworks
    type: INT
    value: "{{ outputs.ingest_and_transform_artworks.vars.total_harvested_artworks }}"
  - id: new_artworks_count
    type: INT
    value: "{{ outputs.ingest_and_transform_artworks.vars.new_artworks_count }}"
  - id: dataset_parquet
    type: FILE
    value: "{{ outputs.ingest_and_transform_artworks.outputFiles['art_institute_chicago_archive.parquet'] }}"

extend:
  title: Art Institute of Chicago Fine Art Collections Lakehouse Loader with DuckDB
  metaTitle: Art Institute of Chicago Lakehouse Loader | Kestra
  shortDescription: Ingests museum fine art collections, artist attributions, artwork mediums, and provenance metadata from the Art Institute of Chicago into Parquet lakehouse storage via DuckDB.
  metaDescription: Poll Art Institute of Chicago API for museum collections, convert curatorial provenance into Parquet via DuckDB, and track state in KV store.
  tags:
    - Data
  subTags:
    - ELT & Warehouse Loading
    - File & Data Processing Basics
  ee: false
  demo: false
  description: |
    Automate the collection, curatorial harmonization, and analytical lakehouse persistence of museum fine art
    collections, artist biographies, historical mediums, and origin departments from the Art Institute of Chicago API into Parquet using DuckDB.

    ## How it works

    1. **State Recovery**: Queries the Kestra KV store (`artic_monitored_artworks_state`) for previously cataloged museum artwork identifiers.
    2. **Art Institute Ingestion**: Queries the official Art Institute of Chicago REST API (`api.artic.edu/api/v1/artworks`) across historical departments.
    3. **DuckDB Curatorial Normalization**: Unpacks artists, creation dates, mediums, places of origin, and public domain licenses into a relational schema inside Docker.
    4. **Analytical Lake Export**: Exports normalized cultural heritage records into columnar Parquet and CSV files for art history research and digital humanities analytics.
    5. **New Artwork Detection & State Commitment**: Identifies newly indexed masterpieces, logs curatorial summaries, and commits state to Kestra KV store.

    ## What you get

    - Automated, scheduled collection of institutional-grade cultural heritage archives.
    - Columnar Parquet datasets queryable with DuckDB, ClickHouse, Snowflake, or Athena.
    - Built-in KV state management providing idempotent execution and zero database requirements.

    ## Who it's for

    - Digital Humanities Researchers and Museum Curators analyzing collection provenance.
    - Art History Data Scientists building cultural recommendation algorithms.
    - Analytics Engineers building reproducible multi-cloud lakehouse pipelines.

    ## Why orchestrate this with Kestra

    - Built-in KV store maintains historical curation state across runs without database infrastructure.
    - Ephemeral Docker execution guarantees reproducible, clean Python and DuckDB runtimes.
    - Declarative scheduled execution with automated error recovery and conditional logging.

    ## Prerequisites

    - Docker runner configured on the Kestra worker.
    - Outbound internet access to `api.artic.edu`.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: (Optional) Webhook URL for alerting curatorial teams on new acquisitions.

    ## Quick start

    1. Import this blueprint into your Kestra instance.
    2. Adjust the `limit` input parameter.
    3. Click **Execute** to run an immediate harvest and generate the Parquet archive.
    4. Enable the `weekly_curation_sync` schedule for automated weekly updates.

    ## How to extend

    - Add an S3 or Google Cloud Storage step to partition weekly curatorial collection snapshots.
    - Connect an image embedding pipeline downstream to index artwork aesthetics.

    ## Links

    - [Art Institute of Chicago API Documentation](https://api.artic.edu/docs/)
    - [DuckDB Documentation](https://duckdb.org/)
    - [Kestra Task Runners](https://kestra.io/docs/task-runners)
