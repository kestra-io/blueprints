id: activemq-artemis-dead-letter-address-accumulation-sentinel
namespace: company.messaging

inputs:
  - id: artemis_jolokia_url
    type: STRING
    defaults: "http://artemis.internal:8161/console/jolokia"
    description: Base URL of ActiveMQ Artemis Jolokia JMX management endpoint.
  - id: dla_address
    type: STRING
    defaults: "DLQ"
    description: Dead Letter Queue (DLA) address name.
  - id: max_dla_messages
    type: INT
    defaults: 50
    description: "Maximum allowable dead letter messages before alerting (default 50)."

tasks:
  - id: query_dla_messages
    type: io.kestra.plugin.scripts.shell.Commands
    commands:
      - |
        # Query ActiveMQ Artemis Jolokia endpoint for Queue message count
        curl -s -u "{{ inputs.artemis_user }}:{{ secret('ARTEMIS_PASSWORD') }}"           "{{ inputs.artemis_jolokia_url }}/read/org.apache.activemq.artemis:broker=\"localhost\",component=addresses,address=\"{{ inputs.dla_address }}\",subcomponent=queues,routing-type=\"anycast\",queue=\"{{ inputs.dla_address }}\"/MessageCount" > /tmp/artemis_telemetry.json
        
        MSG_COUNT=$(jq '.value // 0' /tmp/artemis_telemetry.json)
        echo "::set-output name=msg_count::$MSG_COUNT::"

  - id: evaluate_dla_accumulation
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.query_dla_messages.vars.msg_count | int > inputs.max_dla_messages }}"
    then:
      - id: notify_messaging_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#messaging-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 Apache ActiveMQ Artemis DLA Poison Pill Alert",
                "text": "Dead Letter Address `{{ inputs.dla_address }}` has accumulated *{{ outputs.query_dla_messages.vars.msg_count }} dead messages* (threshold {{ inputs.max_dla_messages }})! Application consumers are repeatedly rejecting unparseable payloads or crashing on poison pill events.",
                "footer": "Kestra Messaging Sentinel • Apache ActiveMQ Artemis"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#messaging-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ ActiveMQ Artemis Sentinel Failure",
            "text": "Failed to query ActiveMQ Artemis Jolokia endpoint. Verify credentials and broker address.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/30 * * * *"
    disabled: true

extend:
  metaDescription: "Audits Apache ActiveMQ Artemis for poison pill message accumulation in Dead Letter Addresses (DLA)."
  metaTitle: Apache ActiveMQ Artemis Dead Letter Address (DLA) Message Accumulation Sentinel with Kestra
  title: Apache ActiveMQ Artemis Dead Letter Address (DLA) Message Accumulation Sentinel
  shortDescription: Audits Apache ActiveMQ Artemis for poison pill message accumulation in Dead Letter Addresses (DLA).
  description: |
    ## How it works
    This workflow connects to the Apache ActiveMQ Artemis Jolokia REST endpoint (`/console/jolokia/read/...`) to query the `MessageCount` of configured Dead Letter Addresses (DLAs / DLQs). When JMS or AMQP clients fail to process a message across configured redelivery attempts (`max-delivery-attempts`), Artemis routes the undeliverable payload to the Dead Letter Address. Accumulating messages in DLAs indicate serious application deserialization bugs, schema incompatibilities, or downstream database constraint rejections. This workflow monitors DLQ accumulation and alerts messaging teams.

    ## What you get
    - Real-time detection of failed and poison pill messages in ActiveMQ Artemis.
    - Prevents data loss by identifying failed transactions requiring manual replay.
    - Quantitative metrics on dead letter queue depth.

    ## Who it's for
    - Messaging Middleware Administrators and Enterprise Integration Architects.
    - SREs maintaining JMS/AMQP broker clusters.

    ## Why orchestrate this with Kestra
    - **Continuous Messaging Auditing**: Periodically polls broker queues without external agents.
    - **Secure Credential Injection**: Passes management credentials safely via Kestra secrets.
    - **Direct Team Alerts**: Escalates poison pill surges directly to integration teams.

    ## Prerequisites
    - ActiveMQ Artemis broker with Jolokia management interface enabled.
    - Secrets `ARTEMIS_PASSWORD` and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import the blueprint.
    2. Input Artemis Jolokia URL, user, and DLA queue name.
    3. Run the workflow to inspect dead letter message counts.

    ## How to extend
    - Trigger an automated message replay via Artemis management operation `retryMessages()`.
    - Dump failed message headers into an audit table for post-mortem analysis.

    ## Links
    - [ActiveMQ Artemis Management Documentation](https://activemq.apache.org/components/artemis/documentation/latest/management.html)
    - [Kestra Documentation](https://kestra.io/docs)
  tags:
    - Data
    - Infrastructure
  subTags:
    - ELT & Data Landing
    - Day 2 Operations
  ee: false
  demo: false
