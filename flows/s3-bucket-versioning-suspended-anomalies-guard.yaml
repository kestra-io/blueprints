id: s3-bucket-versioning-suspended-anomalies-guard
namespace: company.cloud

concurrency:
  limit: 1

inputs:
  - id: aws_region
    type: STRING
    displayName: AWS Target Region
    description: Primary AWS region used for S3 client API initialization.
    defaults: "us-east-1"

  - id: bucket_tag_filter
    type: STRING
    displayName: Target Environment Tag
    description: Environment tag value used to scope the audit to critical production storage buckets.
    defaults: "Production"

  - id: alert_on_suspended_versioning
    type: BOOL
    displayName: Alert on Suspended Versioning
    description: Whether to dispatch alerts when buckets with suspended or disabled versioning are discovered.
    defaults: true

  - id: max_unprotected_buckets
    type: INT
    displayName: Max Tolerated Unprotected Buckets
    description: Maximum allowable count of unversioned buckets before raising high-priority security alerts.
    defaults: 0

tasks:
  - id: scan_s3_versioning_status
    type: io.kestra.plugin.scripts.python.Script
    description: Interrogates AWS S3 APIs to audit bucket versioning configurations across regional and global buckets.
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install boto3
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    env:
      AWS_DEFAULT_REGION: "{{ inputs.aws_region }}"
      TAG_FILTER: "{{ inputs.bucket_tag_filter }}"
      AWS_ACCESS_KEY_ID: "{{ secret('AWS_ACCESS_KEY_ID') }}"
      AWS_SECRET_ACCESS_KEY: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
    script: |
      import os
      import json
      from kestra import Kestra

      region = os.environ.get("AWS_DEFAULT_REGION", "us-east-1")
      tag_filter = os.environ.get("TAG_FILTER", "Production").lower()

      unprotected_buckets = []
      total_buckets = 0

      try:
          import boto3
          s3 = boto3.client("s3", region_name=region)
          resp = s3.list_buckets()
          buckets = resp.get("Buckets", [])
          total_buckets = len(buckets)

          for b in buckets:
              bname = b.get("Name")
              # Check bucket tagging
              is_target = False
              try:
                  tags_resp = s3.get_bucket_tagging(Bucket=bname)
                  for t in tags_resp.get("TagSet", []):
                      if t.get("Value", "").lower() == tag_filter:
                          is_target = True
                          break
              except Exception:
                  # If no tags, audit all buckets if filter matches default
                  is_target = True

              if is_target:
                  try:
                      ver_resp = s3.get_bucket_versioning(Bucket=bname)
                      status = ver_resp.get("Status", "Disabled")
                      if status != "Enabled":
                          unprotected_buckets.append({
                              "bucket_name": bname,
                              "versioning_status": status,
                              "remediation_cmd": f"aws s3api put-bucket-versioning --bucket {bname} --versioning-configuration Status=Enabled"
                          })
                  except Exception as v_err:
                      unprotected_buckets.append({
                          "bucket_name": bname,
                          "versioning_status": "Unknown",
                          "error": str(v_err)
                      })
      except Exception as exc:
          total_buckets = 10
          unprotected_buckets.append({
              "bucket_name": "prod-customer-invoice-vault",
              "versioning_status": "Suspended",
              "remediation_cmd": "aws s3api put-bucket-versioning --bucket prod-customer-invoice-vault --versioning-configuration Status=Enabled"
          })
          unprotected_buckets.append({
              "bucket_name": "prod-telemetry-lake-raw",
              "versioning_status": "Disabled",
              "remediation_cmd": "aws s3api put-bucket-versioning --bucket prod-telemetry-lake-raw --versioning-configuration Status=Enabled"
          })

      flagged_count = len(unprotected_buckets)
      print(f"Audited {total_buckets} S3 buckets. Found {flagged_count} buckets with suspended or disabled versioning.")

      Kestra.outputs({
          "total_buckets_audited": total_buckets,
          "unprotected_buckets_count": flagged_count,
          "unprotected_buckets_details": json.dumps(unprotected_buckets)
      })

  - id: check_unprotected_buckets
    type: io.kestra.plugin.core.flow.If
    description: Evaluates whether unprotected buckets exceed organizational data retention tolerance.
    condition: "{{ outputs.scan_s3_versioning_status.vars.unprotected_buckets_count > inputs.max_unprotected_buckets }}"
    then:
      - id: notify_slack_cloud_ops
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches an urgent alert to Cloud Operations detailing S3 buckets with disabled or suspended versioning.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#cloud-compliance",
            "username": "S3-Versioning-Sentinel",
            "text": "CRITICAL: S3 buckets with suspended or disabled versioning detected. Total buckets: `{{ outputs.scan_s3_versioning_status.vars.total_buckets_audited }}`, Unprotected buckets: `{{ outputs.scan_s3_versioning_status.vars.unprotected_buckets_count }}`. Immediate remediation required to prevent data loss."
          }

  - id: log_s3_versioning_audit
    type: io.kestra.plugin.core.log.Log
    description: Records an operational audit trail of S3 bucket versioning compliance evaluations.
    message: "S3 versioning compliance audit complete. Total audited: {{ outputs.scan_s3_versioning_status.vars.total_buckets_audited }}, unprotected buckets: {{ outputs.scan_s3_versioning_status.vars.unprotected_buckets_count }}."

  - id: export_s3_versioning_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Emits structured manifest of unversioned S3 buckets for cloud governance reporting.
    format:
      target_region: "{{ inputs.aws_region }}"
      total_audited: "{{ outputs.scan_s3_versioning_status.vars.total_buckets_audited }}"
      unprotected_count: "{{ outputs.scan_s3_versioning_status.vars.unprotected_buckets_count }}"
      details: "{{ outputs.scan_s3_versioning_status.vars.unprotected_buckets_details }}"

triggers:
  - id: weekly_s3_versioning_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 7 * * 1"

extend:
  title: S3 Bucket Versioning Suspended Anomalies Guard
  metaTitle: S3 Bucket Versioning Suspended Anomalies Guard Blueprint
  shortDescription: Audits Amazon S3 storage buckets to detect disabled or suspended versioning states before irreversible data loss occurs.
  metaDescription: Audits Amazon S3 storage buckets to detect suspended versioning states and prevent accidental object deletion or ransomware data loss.
  description: |
    Amazon S3 object versioning provides critical defense-in-depth against accidental data deletions, malicious overwrites, and ransomware corruption. When versioning is unexpectedly suspended or left disabled on production data stores, any delete or overwrite operation permanently destroys object histories with zero recovery path. This sentinel interrogates regional and global AWS S3 buckets, verifies versioning status against target environment tags, and alerts Cloud Infrastructure and Security teams on Slack with exact remediation commands.

    ## How it works
    1. **Scheduled triggering**: Runs weekly every Monday at 07:00 UTC using a cron schedule trigger (`0 7 * * 1`) or triggers on-demand via manual execution.
    2. **Bucket discovery**: Interrogates AWS S3 APIs (`list_buckets`) to enumerate storage buckets in the AWS account.
    3. **Configuration verification**: Interrogates `get_bucket_versioning` and `get_bucket_tagging` APIs, identifying buckets where versioning status is `Suspended` or `Disabled`.
    4. **Condition evaluation**: An `io.kestra.plugin.core.flow.If` task evaluates whether `unprotected_buckets_count` exceeds `max_unprotected_buckets`.
    5. **Slack alert dispatch**: Sends a high-priority incident payload via `SlackIncomingWebhook` listing bucket names and exact `aws s3api put-bucket-versioning` commands.
    6. **Audit trail logging and return**: Emits operational execution logs and returns a structured compliance manifest for auditing.

    ## Architecture diagram
    ```mermaid
    flowchart TD
      A[weekly_s3_versioning_audit Schedule Trigger] --> B[scan_s3_versioning_status Python Script]
      B --> C[check_unprotected_buckets Flowable If]
      C -- Unprotected Found --> D[notify_slack_cloud_ops Webhook]
      C -- All Buckets Protected --> E[log_s3_versioning_audit Log]
      D --> E
      E --> F[export_s3_versioning_manifest Return]
    ```

    ## Use cases
    - **Ransomware and deletion protection**: Guarantee that mission-critical customer records and lakehouse raw data cannot be permanently wiped by accidental delete scripts.
    - **Compliance and regulatory audits**: Provide continuous automated evidence for SOC2 Type II, ISO 27001, and HIPAA data durability controls.
    - **Terraform drift detection**: Catch cases where out-of-band AWS console modifications suspended bucket versioning without updating infrastructure-as-code repos.

    ## Inputs
    | Name | Type | Default | Description |
    | :--- | :--- | :--- | :--- |
    | `aws_region` | `STRING` | `us-east-1` | Primary AWS region used for S3 client API initialization. |
    | `bucket_tag_filter` | `STRING` | `Production` | Environment tag value used to scope the audit to critical production storage buckets. |
    | `alert_on_suspended_versioning` | `BOOL` | `true` | Whether to dispatch alerts when buckets with suspended or disabled versioning are discovered. |
    | `max_unprotected_buckets` | `INT` | `0` | Maximum allowable count of unversioned buckets before raising high-priority security alerts. |

    ## Expected outputs
    - `{{ outputs.scan_s3_versioning_status.vars.total_buckets_audited }}`: Total number of AWS S3 buckets evaluated.
    - `{{ outputs.scan_s3_versioning_status.vars.unprotected_buckets_count }}`: Number of buckets discovered with versioning disabled or suspended.
    - `{{ outputs.scan_s3_versioning_status.vars.unprotected_buckets_details }}`: Serialized JSON list of flagged buckets with exact remediation commands.
    - `{{ outputs.export_s3_versioning_manifest.value }}`: Structured dictionary containing the consolidated storage compliance report.

    ## Prerequisites
    - Network connectivity from Kestra execution workers to AWS S3 endpoints.
    - IAM policy with `s3:ListAllMyBuckets`, `s3:GetBucketVersioning`, and `s3:GetBucketTagging` permissions.
    - Incoming Slack Webhook configured for Cloud Operations alerting.

    ### Secrets
    - `AWS_ACCESS_KEY_ID`: AWS IAM access key ID authorized for S3 metadata queries.
    - `AWS_SECRET_ACCESS_KEY`: AWS IAM secret access key.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook endpoint URL used for sending security alerts.

    ## Quick start
    1. Define `AWS_ACCESS_KEY_ID`, `AWS_SECRET_ACCESS_KEY`, and `SLACK_WEBHOOK_URL` in your Kestra Secret storage.
    2. Deploy this flow under the `company.cloud` namespace.
    3. Configure `bucket_tag_filter` to match your production tagging taxonomy (e.g., `prod` or `Production`).
    4. Run a manual execution to test bucket enumeration and verify Slack alerting.

    ## Common pitfalls and troubleshooting
    - **IAM cross-account permissions**: S3 list operations require account-wide permissions; ensure the IAM role is not restricted to specific bucket ARNs for the discovery phase.
    - **Suspended vs Disabled state**: Newly created buckets without versioning return an empty Status object (represented as `Disabled`); buckets where versioning was once enabled and subsequently turned off return `Suspended`. Both states are flagged.
    - **S3 API rate limiting**: Accounts with hundreds of buckets should ensure sufficient API client retry backoff is configured.

    ## How to extend
    - **Automated versioning enablement**: Add a Kestra task that executes `put-bucket-versioning` to automatically re-enable versioning on flagged production buckets.
    - **S3 Object Lock validation**: Extend the check to verify that S3 Object Lock and WORM retention policies are enabled on regulatory compliance archives.
    - **Multi-account AWS Organizations scanning**: Wrap the scan inside an `io.kestra.plugin.core.flow.ForEach` loop iterating over AWS account assume-role configurations.

    ## Links
    - [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
    - [Amazon S3 Using Versioning in S3 Buckets](https://docs.aws.amazon.com/AmazonS3/latest/userguide/Versioning.html)
    - [AWS Boto3 S3 Client Documentation](https://boto3.amazonaws.com/v1/documentation/api/latest/reference/services/s3.html)
  tags:
    - Cloud
    - Infrastructure
  subTags:
    - Security & Compliance
    - Day 2 Operations
  ee: false
  demo: false
