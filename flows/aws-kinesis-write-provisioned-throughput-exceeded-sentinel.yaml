id: aws-kinesis-write-provisioned-throughput-exceeded-sentinel
namespace: company.team

inputs:
  - id: aws_region
    type: STRING
    defaults: "us-east-1"
    description: AWS region where the Kinesis stream is hosted.
  - id: stream_name
    type: STRING
    description: AWS Kinesis Data Stream name to audit.
  - id: throttling_records_threshold
    type: INT
    defaults: 10
    description: Maximum acceptable count of throttled write records over the 15-minute evaluation window.

tasks:
  - id: query_kinesis_throttles
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install boto3
    env:
      AWS_ACCESS_KEY_ID: "{{ secret('AWS_ACCESS_KEY_ID') }}"
      AWS_SECRET_ACCESS_KEY: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
      AWS_DEFAULT_REGION: "{{ inputs.aws_region }}"
      STREAM_NAME: "{{ inputs.stream_name }}"
    outputFiles:
      - kinesis_telemetry.json
    script: |
      import os
      import sys
      import json
      from datetime import datetime, timezone, timedelta
      import boto3
      from kestra import Kestra

      region = os.environ.get("AWS_DEFAULT_REGION", "us-east-1")
      stream_name = os.environ.get("STREAM_NAME")

      if not stream_name:
          print("ERROR: STREAM_NAME environment variable is required", file=sys.stderr)
          sys.exit(1)

      now = datetime.now(timezone.utc)
      start_time = now - timedelta(minutes=15)

      try:
          cw = boto3.client("cloudwatch", region_name=region)
          response = cw.get_metric_data(
              MetricDataQueries=[
                  {
                      "Id": "m1",
                      "MetricStat": {
                          "Metric": {
                              "Namespace": "AWS/Kinesis",
                              "MetricName": "WriteProvisionedThroughputExceeded",
                              "Dimensions": [{"Name": "StreamName", "Value": stream_name}]
                          },
                          "Period": 900,
                          "Stat": "Sum"
                      }
                  }
              ],
              StartTime=start_time,
              EndTime=now
          )
      except Exception as e:
          print(f"ERROR: Failed to query CloudWatch metric data: {e}", file=sys.stderr)
          sys.exit(1)

      results = response.get("MetricDataResults", [])
      values = results[0].get("Values", []) if results else []
      throttled_records = int(sum(values))

      telemetry = {
          "stream_name": stream_name,
          "region": region,
          "throttled_records": throttled_records,
          "start_time": start_time.isoformat(),
          "end_time": now.isoformat()
      }

      with open("kinesis_telemetry.json", "w", encoding="utf-8") as f:
          json.dump(telemetry, f, indent=2)

      print(f"Audit completed: Stream '{stream_name}' had {throttled_records} throttled records in last 15m.")

      Kestra.outputs({
          "throttled_records": throttled_records
      })

  - id: evaluate_kinesis_throttling
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.query_kinesis_throttles.vars.throttled_records >= inputs.throttling_records_threshold }}"
    then:
      - id: notify_streaming_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#aws-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 AWS Kinesis Write Throughput Exceeded Alert",
                "text": "Kinesis Data Stream `{{ inputs.stream_name }}` in region `{{ inputs.aws_region }}` recorded *{{ outputs.query_kinesis_throttles.vars.throttled_records }}* throttled write records (`WriteProvisionedThroughputExceeded`) over the last 15 minutes! Impact: Producers are receiving `ProvisionedThroughputExceededException`, causing client-side buffer bloat, ingestion retries, and dropped events.",
                "footer": "Kestra Cloud Sentinel • AWS Kinesis"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#aws-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ AWS Kinesis Write Provisioned Throughput Exceeded Sentinel Pipeline Failure",
            "text": "Failed to query CloudWatch metrics for Kinesis stream. Verify stream name and AWS credentials.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

extend:
  title: AWS Kinesis Write Provisioned Throughput Exceeded Sentinel
  description: |
    Monitor AWS Kinesis data streams for write provisioned throughput exceeded metrics and notify engineers via Slack.
  tags:
    - Cloud
    - Infrastructure
  subTags:
    - AWS Services
    - Monitoring & Alerting
  ee: false
