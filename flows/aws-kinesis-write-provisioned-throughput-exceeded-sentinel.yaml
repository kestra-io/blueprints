id: aws-kinesis-write-provisioned-throughput-exceeded-sentinel
namespace: company.ops

inputs:
  - id: aws_region
    type: STRING
    defaults: "us-east-1"
    description: AWS region where the Kinesis stream is hosted.
  - id: stream_name
    type: STRING
    description: AWS Kinesis Data Stream name to audit.
  - id: throttling_records_threshold
    type: INT
    defaults: 10
    description: Maximum acceptable count of throttled write records over the 15-minute evaluation window.

tasks:
  - id: query_kinesis_throttles
    type: io.kestra.plugin.aws.cli.AwsCLI
    region: "{{ inputs.aws_region }}"
    accessKeyId: "{{ secret('AWS_ACCESS_KEY_ID') }}"
    secretKeyId: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
    commands:
      - |
        aws cloudwatch get-metric-data \
          --metric-data-queries '[{"Id":"m1","MetricStat":{"Metric":{"Namespace":"AWS/Kinesis","MetricName":"WriteProvisionedThroughputExceeded","Dimensions":[{"Name":"StreamName","Value":"{{ inputs.stream_name }}"}]},"Period":900,"Stat":"Sum"}}]' \
          --start-time "$(date -u -v-15M +%Y-%m-%dT%H:%M:%SZ)" \
          --end-time "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
          --output json > /tmp/kinesis_telemetry.json
        
        THROTTLED_RECORDS=$(jq '[.MetricDataResults[0].Values[]?] | add // 0' /tmp/kinesis_telemetry.json)
        
        echo "::set-output name=throttled_records::$THROTTLED_RECORDS::"

  - id: evaluate_kinesis_throttling
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.query_kinesis_throttles.vars.throttled_records | int >= inputs.throttling_records_threshold }}"
    then:
      - id: notify_streaming_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#aws-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 AWS Kinesis Write Throughput Exceeded Alert",
                "text": "Kinesis Data Stream `{{ inputs.stream_name }}` in region `{{ inputs.aws_region }}` recorded *{{ outputs.query_kinesis_throttles.vars.throttled_records }}* throttled write records (`WriteProvisionedThroughputExceeded`) over the last 15 minutes! Impact: Producers are receiving `ProvisionedThroughputExceededException`, causing client-side buffer bloat, ingestion retries, and dropped events.",
                "footer": "Kestra Cloud Sentinel • AWS Kinesis"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#aws-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ AWS Kinesis Write Provisioned Throughput Exceeded Sentinel Pipeline Failure",
            "text": "Failed to query CloudWatch metrics for Kinesis stream. Verify stream name and AWS credentials.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  metaDescription: "Monitors AWS Kinesis WriteProvisionedThroughputExceeded CloudWatch metrics to detect shard throttling and producer drops."
  metaTitle: AWS Kinesis Write Provisioned Throughput Exceeded Sentinel with Kestra
  title: AWS Kinesis Write Provisioned Throughput Exceeded Sentinel
  shortDescription: Monitors AWS Kinesis WriteProvisionedThroughputExceeded CloudWatch metrics to detect shard throttling and producer drops.
  description: |
    ## How it works
    This workflow executes `aws cloudwatch get-metric-data` via the AWS CLI to extract the `WriteProvisionedThroughputExceeded` metric for the target Kinesis Data Stream. In provisioned mode, each Kinesis shard supports up to 1 MB/sec or 1,000 records/sec write capacity. When hot partition keys or ingestion volume spikes exceed this quota, AWS throttles writes with HTTP 400 exceptions. When throttling occurs, Slack is notified immediately.

    ## What you get
    - Immediate detection of Kinesis shard write capacity exhaustion.
    - Prevents streaming data ingestion delays and producer memory buffer overflow.
    - Actionable metrics on total throttled records over 15-minute periods.

    ## Who it's for
    - Streaming Data Engineers and Cloud Infrastructure SREs operating AWS event pipelines.
    - Application teams publishing telemetry to Kinesis Data Streams.

    ## Why orchestrate this with Kestra
    - **Direct CloudWatch Telemetry**: Queries official CloudWatch metrics without external agent daemons.
    - **Configurable SLA Limits**: Set strict throttling thresholds per stream.
    - **Automated Stream Scaling**: Chain into automatic shard split workflows upon repeated breach.

    ## Prerequisites
    - AWS IAM credentials with `cloudwatch:GetMetricData` permissions.
    - Secrets `AWS_ACCESS_KEY_ID`, `AWS_SECRET_ACCESS_KEY`, and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import the blueprint into Kestra.
    2. Specify stream name and region.
    3. Run the workflow to inspect Kinesis write throughput health.

    ## How to extend
    - Automatically trigger `aws kinesis update-shard-count` to double stream shard capacity.
    - Check `ReadProvisionedThroughputExceeded` for consumer throttling.

    ## Links
    - [AWS Kinesis Monitoring Documentation](https://docs.aws.amazon.com/streams/latest/dev/monitoring-with-cloudwatch.html)
    - [Kestra AWS CLI Plugin](https://kestra.io/plugins/plugin-aws/io.kestra.plugin.aws.cli.awscli)
  tags:
    - Cloud
    - Infrastructure
  subTags:
    - AWS Services
    - Infrastructure Automation
  ee: false
  demo: false
