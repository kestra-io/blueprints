id: dragonfly-cache-memory-eviction-sentinel
namespace: company.caching

inputs:
  - id: dragonfly_host
    type: STRING
    defaults: "dragonfly.internal"
    description: Hostname of the Dragonfly in-memory database server.
  - id: dragonfly_port
    type: INT
    defaults: 6379
    description: Port of the Dragonfly server.
  - id: max_evicted_keys_rate
    type: INT
    defaults: 100
    description: "Maximum allowable evicted keys count before alerting (default 100)."

tasks:
  - id: inspect_eviction_metrics
    type: io.kestra.plugin.scripts.shell.Commands
    commands:
      - |
        # Query Dragonfly server info stats
        redis-cli -h "{{ inputs.dragonfly_host }}" -p {{ inputs.dragonfly_port }} -a "{{ secret('DRAGONFLY_PASSWORD') }}" INFO stats > /tmp/df_stats.txt

        python3 -c "
        try:
            with open('/tmp/df_stats.txt') as f:
                lines = f.readlines()
            evicted = 0
            for line in lines:
                if line.startswith('evicted_keys:'):
                    evicted = int(line.strip().split(':')[1])
            is_breach = 1 if evicted > {{ inputs.max_evicted_keys_rate }} else 0
            print(f'{is_breach}|{evicted}')
        except Exception:
            print('0|0')
        " > /tmp/df_summary.txt

        IS_BREACH=$(cut -d '|' -f 1 /tmp/df_summary.txt)
        EVICTED_KEYS=$(cut -d '|' -f 2 /tmp/df_summary.txt)
        
        echo "::set-output name=is_breach::${IS_BREACH:-0}::"
        echo "::set-output name=evicted_keys::$EVICTED_KEYS::"

  - id: evaluate_cache_pressure
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.inspect_eviction_metrics.vars.is_breach | int == 1 }}"
    then:
      - id: notify_caching_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#caching-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 Dragonfly In-Memory Cache Key Eviction Surge Warning",
                "text": "Dragonfly server at {{ inputs.dragonfly_host }} has evicted {{ outputs.inspect_eviction_metrics.vars.evicted_keys }} keys (threshold {{ inputs.max_evicted_keys_rate }}). Memory allocation limit reached; critical cache keys are prematurely evicted, causing cache thrashing.",
                "footer": "Kestra Caching Sentinel • Dragonfly"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#caching-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ Dragonfly Sentinel Failure",
            "text": "Failed to query stats on Dragonfly instance {{ inputs.dragonfly_host }}.",
            "footer": "Kestra Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/10 * * * *"
    disabled: true

extend:
  metaDescription: "Audits Dragonfly in-memory cache server statistics to detect high-frequency key eviction and cache thrashing."
  metaTitle: Dragonfly In-Memory Cache Memory Saturation and Key Eviction Sentinel with Kestra
  ee: false
  verified: false
  demo: false
  title: Dragonfly In-Memory Cache Memory Saturation and Key Eviction Sentinel
  shortDescription: Audits Dragonfly in-memory cache server statistics to detect high-frequency key eviction and cache thrashing.
  description: |
    ## How it works
    This workflow connects to a Dragonfly in-memory data store instance via standard Redis protocol (`redis-cli`) to query `INFO stats` for the `evicted_keys` counter. Dragonfly provides a multi-threaded, high-throughput drop-in replacement for Redis and Memcached. When memory limits configured by `maxmemory` are saturated, Dragonfly's DashTable cache engine forcibly evicts keys according to the configured eviction policy (e.g., volatile-lru, allkeys-lru). Sudden spikes in evicted keys indicate cache capacity exhaustion and cause severe cache penetration into primary databases. This sentinel tracks key evictions and alerts caching platform teams.

    ## What you get
    - Real-time tracking of Dragonfly in-memory cache key eviction rates.
    - Protection against cache thrashing and downstream database overload.
    - Automated Slack incident notifications detailing total evicted keys.

    ## Who it's for
    - Caching and Database Platform Engineers running high-throughput Dragonfly instances.
    - SREs safeguarding sub-millisecond API response latency.
    - Backend Architects managing multi-tenant key-value caching clusters.

    ## Why orchestrate this with Kestra
    - **Automated Metric Surveillance**: Periodically inspects cache performance without custom agents.
    - **Native Command Execution**: Interacts directly with Dragonfly using standard Redis CLI commands.
    - **Incident Orchestration**: Notifies platform engineers directly in team collaboration channels.

    ## Prerequisites
    - Dragonfly server accessible over network (`6379`).
    - Redis CLI tool installed in the runner container.
    - Secrets `DRAGONFLY_PASSWORD` and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import this blueprint into your Kestra workspace.
    2. Add `DRAGONFLY_PASSWORD` and `SLACK_WEBHOOK` secrets.
    3. Specify `dragonfly_host`, `dragonfly_port`, and `max_evicted_keys_rate`.
    4. Enable the schedule trigger for continuous eviction surveillance.

    ## How to extend
    - Query `INFO memory` to inspect `used_memory_human` and fragmentation ratios.
    - Trigger an automated memory capacity resize via cloud infrastructure APIs.
    - Route critical alerts to PagerDuty or Opsgenie.

    ## Links
    - [Dragonfly Documentation](https://www.dragonflydb.io/docs)
    - [Kestra Shell Plugin](https://kestra.io/plugins/plugin-scripts-shell)
    - [Kestra Slack Notifications](https://kestra.io/plugins/plugin-slack)
  tags:
    - Data
    - Infrastructure
  subTags:
    - ELT & Data Landing
    - Day 2 Operations
