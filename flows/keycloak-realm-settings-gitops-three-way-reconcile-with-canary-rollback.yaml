    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    messageText: "Keycloak reconcile for realm `{{ inputs.realm }}` failed (execution `{{ execution.id }}`). If it failed after approval, check the realm settings in the admin console."

extend:
  title: Reconcile Keycloak Realm Settings From Git Without Overwriting Hand Edits or Breaking Logins
  metaTitle: Keycloak Realm Settings GitOps With Canary and Rollback | Kestra
  shortDescription: Compare Git, the live realm and the last applied state, apply approved changes, prove logins still work with a canary client, and roll back on failure.
  metaDescription: Reconcile Keycloak realm settings from Git with a three-way diff that separates Git changes from hand edits, then canary-test and auto-rollback on failure.
  description: |
    Realm settings such as brute-force limits, token lifetimes and password policy drift when admins edit them in the console, and a naive sync from Git overwrites those edits or locks everyone out with one bad value. This blueprint reconciles from Git after a three-way comparison and an approval, then proves logins still work.

    ## How it works

    1. `clone_desired_state` clones the repository and `load_desired_state` validates the settings file: only allow-listed realm settings, correct types, path inside the repo.
    2. `read_live_realm` reads the same settings through the Admin REST API. `plan_reconcile` compares Git, live and the ledger of what was applied last time (Kestra KV) and labels each difference `GIT_CHANGE`, `DRIFT_REVERT`, `CONFLICT`, `FLAPPING`, `REJECTED` or `UNRESTORABLE`. Only the first two are applied.
    3. `notify_plan` posts the plan to Slack and `approval_gate` (`Pause`) waits up to 4 hours.
    4. `apply_changes` reads the full realm and PUTs it back with only the approved fields changed. `verify_and_canary` reads them back and logs in with a canary client, checking the token lifetime when it was changed.
    5. If healthy, `save_reconciled_ledger` records the new baseline. If not, `rollback_changes` restores the captured values, `verify_rollback` re-checks, `save_rejected_ledger` stops the bad value being retried, and the run fails.

    ## What you get

    - Hand edits are never mistaken for Git changes, and conflicts are never overwritten.
    - A setting reverted again and again is flagged `FLAPPING` instead of fought over.
    - A bad value costs one failed canary, not an outage.

    ## Who it's for

    - Platform and identity teams that manage Keycloak realm settings from a repository.

    ## Why orchestrate this with Kestra

    The comparison needs state kept between runs, the change needs an approval, and the rollback needs ordered checks. Kestra provides the KV ledger, `Pause` and branching in one flow.

    ## Prerequisites

    - Keycloak with the realm and a canary client (confidential, service accounts enabled); Docker for the script tasks.
    - An admin user allowed to manage the realm, and a Git repository with a JSON settings file.

    ### Secrets

    - `GIT_TOKEN`: token for cloning the repository (a read-only token is enough).
    - `KEYCLOAK_ADMIN_USERNAME`: Keycloak admin user name.
    - `KEYCLOAK_ADMIN_PASSWORD`: Keycloak admin password.
    - `KEYCLOAK_CANARY_CLIENT_SECRET`: secret of the canary client.
    - `KEYCLOAK_GITOPS_WEBHOOK_KEY`: key of the webhook trigger.
    - `SLACK_WEBHOOK_URL`: Slack incoming webhook.

    ## Quick start

    1. Run `quay.io/keycloak/keycloak` with `start-dev`, create realm `acme` and the canary client, and commit a settings file such as `{"failureFactor": 5, "accessTokenLifespan": 600}`.
    2. Create the secrets, execute with `apply_after_approval: false`, and read the plan.
    3. Execute again with it true, resume the pause with `approved` set, and check the realm and the Slack message.
    4. Edit a setting in the console and run again to see `DRIFT_REVERT`, then enable `periodic_drift_check`.

    ## How to extend

    - Open a Git issue when a setting is `FLAPPING` or `CONFLICT`.

