id: keycloak-realm-settings-gitops-three-way-reconcile-with-canary-rollback
namespace: company.team

description: |
  Keep a Keycloak realm's security settings in line with a JSON file in Git without overwriting hand edits blindly.
  Each run compares Git, the live realm and what this flow applied last time, so it can tell a deliberate Git change
  from a hand edit in the admin console. Approved changes are applied, proven with a real client login, and rolled
  back automatically if that login breaks.

concurrency:
  limit: 1
  behavior: CANCEL

variables:
  ledger_key: "keycloak_gitops_{{ (inputs.keycloak_url ~ '_' ~ inputs.realm) | slugify }}"

inputs:
  - id: git_url
    type: STRING
    displayName: Git repository URL
    description: Repository that holds the desired realm settings.
    defaults: "https://github.com/your-org/keycloak-config"

  - id: git_branch
    type: STRING
    defaults: "main"

  - id: git_username
    type: STRING
    description: User name that goes with the GIT_TOKEN secret.
    defaults: "x-access-token"

  - id: desired_file
    type: STRING
    displayName: Desired settings file
    description: Path inside the repository of a JSON object holding only the managed realm settings.
    defaults: "realms/acme-settings.json"

  - id: keycloak_url
    type: STRING
    displayName: Keycloak base URL
    description: Reachable from the Docker containers that run the script tasks.
    defaults: "http://host.docker.internal:8080"

  - id: realm
    type: STRING
    displayName: Realm to reconcile
    description: Never the master realm, because a bad setting there would lock out the administrator this flow depends on.
    defaults: "acme"
    validator: '^[A-Za-z0-9_-]+$'

  - id: canary_client_id
    type: STRING
    displayName: Canary client
    description: Confidential client in the realm with service accounts enabled. A client_credentials login with it proves the realm still issues tokens. It must not override the access token lifespan, because the flow compares the token's expires_in with the realm setting.
    defaults: "kestra-canary"

  - id: flap_limit
    type: INT
    displayName: Reverts before giving up
    description: After this many automatic reverts of the same setting within the window, stop reverting it and report that something keeps changing it.
    defaults: 2

  - id: flap_window_hours
    type: INT
    defaults: 24

  - id: apply_after_approval
    type: BOOL
    displayName: Apply after approval
    description: When false the flow reports only. When true it pauses for an operator before changing the realm.
    defaults: true

triggers:
  - id: git_push_webhook
    type: io.kestra.plugin.core.trigger.Webhook
    description: Call this from a push webhook or CI job when the settings file changes.
    key: "{{ secret('KEYCLOAK_GITOPS_WEBHOOK_KEY') }}"

  - id: periodic_drift_check
    type: io.kestra.plugin.core.trigger.Schedule
    description: Catch hand edits in the admin console between pushes.
    cron: "*/30 * * * *"
    disabled: true

tasks:
  - id: assert_realm_not_master
    type: io.kestra.plugin.core.execution.Assert
    conditions:
      - "{{ inputs.realm != 'master' }}"
    errorMessage: "Refusing to reconcile the master realm."

  - id: fetch_desired_state
    type: io.kestra.plugin.core.flow.WorkingDirectory
    tasks:
      - id: clone_desired_state
        type: io.kestra.plugin.git.Clone
        description: Clone the repository that holds the desired settings.
        url: "{{ inputs.git_url }}"
        branch: "{{ inputs.git_branch }}"
        directory: repo
        username: "{{ inputs.git_username }}"
        password: "{{ secret('GIT_TOKEN') }}"

      - id: load_desired_state
        type: io.kestra.plugin.scripts.node.Script
        description: Read the settings file and reject anything that is not an allow-listed realm setting, has the wrong type, or points outside the repository. Also records the commit.
        containerImage: node:20-slim
        taskRunner:
          type: io.kestra.plugin.scripts.runner.docker.Docker
        env:
          KEYCLOAK_URL: "{{ inputs.keycloak_url }}"
          KEYCLOAK_REALM: "{{ inputs.realm }}"
          REPO_DIR: repo
          DESIRED_FILE: "{{ inputs.desired_file }}"
        script: |
          const fs = require('fs');

          // Realm settings this flow may manage. Anything else in the desired file is rejected, so a typo or an
          // over-eager commit can never reach smtp, identity providers or the realm name.
          const MANAGED = {
            bruteForceProtected: 'bool', permanentLockout: 'bool', failureFactor: 'int', maxFailureWaitSeconds: 'int',
            waitIncrementSeconds: 'int', minimumQuickLoginWaitSeconds: 'int', quickLoginCheckMilliSeconds: 'int',
            maxDeltaTimeSeconds: 'int', passwordPolicy: 'string', accessTokenLifespan: 'int', ssoSessionIdleTimeout: 'int',
            ssoSessionMaxLifespan: 'int', accessCodeLifespan: 'int', sslRequired: 'string', registrationAllowed: 'bool',
            resetPasswordAllowed: 'bool', verifyEmail: 'bool', loginWithEmailAllowed: 'bool', duplicateEmailsAllowed: 'bool',
            eventsEnabled: 'bool', eventsExpiration: 'int', adminEventsEnabled: 'bool', adminEventsDetailsEnabled: 'bool',
            revokeRefreshToken: 'bool', refreshTokenMaxReuse: 'int',
          };
          const { KEYCLOAK_URL, KEYCLOAK_REALM: REALM } = process.env;
          const base = KEYCLOAK_URL.replace(/\/$/, '');

          const load = (p) => {
            let d = JSON.parse(fs.readFileSync(p, 'utf8'));
            while (typeof d === 'string') d = d.trim() ? JSON.parse(d) : {};
            return d;
          };
          const emit = (outputs) => console.log('::' + JSON.stringify({ outputs }) + '::');

          // Keycloak reports sslRequired in lower case and re-serializes password policies, so compare normalised values.
          const norm = (field, v) => {
            if (v === undefined || v === null) return field === 'passwordPolicy' ? '' : null;
            if (field === 'sslRequired') return String(v).toLowerCase();
            if (field === 'passwordPolicy') return String(v).split(' and ').map((s) => s.trim().replace(/\s+/g, '')).filter(Boolean).sort().join(' and ');
            return v;
          };
          const same = (field, a, b) => JSON.stringify(norm(field, a)) === JSON.stringify(norm(field, b));

          const adminToken = async () => {
            const res = await fetch(`${base}/realms/${process.env.ADMIN_REALM}/protocol/openid-connect/token`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
              body: new URLSearchParams({
                grant_type: 'password',
                client_id: process.env.ADMIN_CLIENT_ID,
                username: process.env.ADMIN_USERNAME,
                password: process.env.ADMIN_PASSWORD,
              }),
            });
            const json = await res.json().catch(() => ({}));
            if (!res.ok || !json.access_token) throw new Error(`admin token request failed: HTTP ${res.status} ${json.error || ''}`);
            return json.access_token;
          };
          const kc = async (token, method, body) => {
            const res = await fetch(`${base}/admin/realms/${REALM}`, {
              method,
              headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
              body: body ? JSON.stringify(body) : undefined,
            });
            const text = await res.text();
            if (!res.ok) throw new Error(`Keycloak ${method} /admin/realms/${REALM} -> HTTP ${res.status}: ${text.slice(0, 300)}`);
            return text ? JSON.parse(text) : {};
          };

          const path = require('path');

          const gitHead = (dir) => {
            try {
              const head = fs.readFileSync(`${dir}/.git/HEAD`, 'utf8').trim();
              if (!head.startsWith('ref:')) return head;
              const ref = head.slice(5).trim();
              try {
                return fs.readFileSync(`${dir}/.git/${ref}`, 'utf8').trim();
              } catch (e) {
                const line = fs.readFileSync(`${dir}/.git/packed-refs`, 'utf8').split('\n').find((l) => l.endsWith(' ' + ref));
                return line ? line.split(' ')[0] : 'unknown';
              }
            } catch (e) {
              return 'unknown';
            }
          };

          try {
            const repo = path.resolve(process.env.REPO_DIR);
            const file = path.resolve(repo, process.env.DESIRED_FILE);
            if (!file.startsWith(repo + path.sep)) throw new Error('desired_file must stay inside the cloned repository');
            const desired = JSON.parse(fs.readFileSync(file, 'utf8'));

            const problems = [];
            for (const [field, value] of Object.entries(desired)) {
              const type = MANAGED[field];
              if (!type) problems.push(`${field}: not a managed setting`);
              else if (type === 'bool' && typeof value !== 'boolean') problems.push(`${field}: expected true or false`);
              else if (type === 'int' && !(Number.isInteger(value) && value >= 0)) problems.push(`${field}: expected a non-negative integer`);
              else if (type === 'string' && typeof value !== 'string') problems.push(`${field}: expected a string`);
              else if (field === 'sslRequired' && !['none', 'external', 'all'].includes(value)) problems.push('sslRequired: expected none, external or all');
            }
            if (!Object.keys(desired).length) problems.push('the desired file is empty');
            if (problems.length) throw new Error('invalid desired state in ' + process.env.DESIRED_FILE + ': ' + problems.join('; '));

            emit({ desired, commit: gitHead(repo), field_count: Object.keys(desired).length });
          } catch (e) {
            console.error(e.message);
            process.exitCode = 1;
          }

  - id: read_live_realm
    type: io.kestra.plugin.scripts.node.Script
    description: Read the managed settings from the live realm through the Admin REST API.
    containerImage: node:20-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    inputFiles:
      desired.json: "{{ outputs.load_desired_state.vars.desired | toJson }}"
    env:
      KEYCLOAK_URL: "{{ inputs.keycloak_url }}"
      KEYCLOAK_REALM: "{{ inputs.realm }}"
      ADMIN_REALM: master
      ADMIN_CLIENT_ID: admin-cli
      ADMIN_USERNAME: "{{ secret('KEYCLOAK_ADMIN_USERNAME') }}"
      ADMIN_PASSWORD: "{{ secret('KEYCLOAK_ADMIN_PASSWORD') }}"
    script: |
      const fs = require('fs');

      // Realm settings this flow may manage. Anything else in the desired file is rejected, so a typo or an
      // over-eager commit can never reach smtp, identity providers or the realm name.
      const MANAGED = {
        bruteForceProtected: 'bool', permanentLockout: 'bool', failureFactor: 'int', maxFailureWaitSeconds: 'int',
        waitIncrementSeconds: 'int', minimumQuickLoginWaitSeconds: 'int', quickLoginCheckMilliSeconds: 'int',
        maxDeltaTimeSeconds: 'int', passwordPolicy: 'string', accessTokenLifespan: 'int', ssoSessionIdleTimeout: 'int',
        ssoSessionMaxLifespan: 'int', accessCodeLifespan: 'int', sslRequired: 'string', registrationAllowed: 'bool',
        resetPasswordAllowed: 'bool', verifyEmail: 'bool', loginWithEmailAllowed: 'bool', duplicateEmailsAllowed: 'bool',
        eventsEnabled: 'bool', eventsExpiration: 'int', adminEventsEnabled: 'bool', adminEventsDetailsEnabled: 'bool',
        revokeRefreshToken: 'bool', refreshTokenMaxReuse: 'int',
      };
      const { KEYCLOAK_URL, KEYCLOAK_REALM: REALM } = process.env;
      const base = KEYCLOAK_URL.replace(/\/$/, '');

      const load = (p) => {
        let d = JSON.parse(fs.readFileSync(p, 'utf8'));
        while (typeof d === 'string') d = d.trim() ? JSON.parse(d) : {};
        return d;
      };
      const emit = (outputs) => console.log('::' + JSON.stringify({ outputs }) + '::');

      // Keycloak reports sslRequired in lower case and re-serializes password policies, so compare normalised values.
      const norm = (field, v) => {
        if (v === undefined || v === null) return field === 'passwordPolicy' ? '' : null;
        if (field === 'sslRequired') return String(v).toLowerCase();
        if (field === 'passwordPolicy') return String(v).split(' and ').map((s) => s.trim().replace(/\s+/g, '')).filter(Boolean).sort().join(' and ');
        return v;
      };
      const same = (field, a, b) => JSON.stringify(norm(field, a)) === JSON.stringify(norm(field, b));

      const adminToken = async () => {
        const res = await fetch(`${base}/realms/${process.env.ADMIN_REALM}/protocol/openid-connect/token`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: new URLSearchParams({
            grant_type: 'password',
            client_id: process.env.ADMIN_CLIENT_ID,
            username: process.env.ADMIN_USERNAME,
            password: process.env.ADMIN_PASSWORD,
          }),
        });
        const json = await res.json().catch(() => ({}));
        if (!res.ok || !json.access_token) throw new Error(`admin token request failed: HTTP ${res.status} ${json.error || ''}`);
        return json.access_token;
      };
      const kc = async (token, method, body) => {
        const res = await fetch(`${base}/admin/realms/${REALM}`, {
          method,
          headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
          body: body ? JSON.stringify(body) : undefined,
        });
        const text = await res.text();
        if (!res.ok) throw new Error(`Keycloak ${method} /admin/realms/${REALM} -> HTTP ${res.status}: ${text.slice(0, 300)}`);
        return text ? JSON.parse(text) : {};
      };

      (async () => {
        const desired = load('desired.json');
        const realm = await kc(await adminToken(), 'GET');
        const live = {};
        for (const field of Object.keys(desired)) live[field] = realm[field] === undefined ? null : realm[field];
        emit({ live });
      })().catch((e) => { console.error(e.message); process.exitCode = 1; });

  - id: plan_reconcile
    type: io.kestra.plugin.scripts.node.Script
    description: Three-way comparison of Git, the live realm and the ledger of what was applied last time. Classifies each differing setting as GIT_CHANGE, DRIFT_REVERT, CONFLICT, FLAPPING, REJECTED or UNRESTORABLE, and only the first two are applied.
    containerImage: node:20-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    inputFiles:
      desired.json: "{{ outputs.load_desired_state.vars.desired | toJson }}"
      live.json: "{{ outputs.read_live_realm.vars.live | toJson }}"
      ledger.json: "{{ (kv(vars.ledger_key, errorOnMissing=false) ?? '{}') | toJson }}"
    env:
      KEYCLOAK_URL: "{{ inputs.keycloak_url }}"
      KEYCLOAK_REALM: "{{ inputs.realm }}"
      FLAP_LIMIT: "{{ inputs.flap_limit }}"
      FLAP_WINDOW_HOURS: "{{ inputs.flap_window_hours }}"
      COMMIT: "{{ outputs.load_desired_state.vars.commit }}"
    script: |
      const fs = require('fs');

      // Realm settings this flow may manage. Anything else in the desired file is rejected, so a typo or an
      // over-eager commit can never reach smtp, identity providers or the realm name.
      const MANAGED = {
        bruteForceProtected: 'bool', permanentLockout: 'bool', failureFactor: 'int', maxFailureWaitSeconds: 'int',
        waitIncrementSeconds: 'int', minimumQuickLoginWaitSeconds: 'int', quickLoginCheckMilliSeconds: 'int',
        maxDeltaTimeSeconds: 'int', passwordPolicy: 'string', accessTokenLifespan: 'int', ssoSessionIdleTimeout: 'int',
        ssoSessionMaxLifespan: 'int', accessCodeLifespan: 'int', sslRequired: 'string', registrationAllowed: 'bool',
        resetPasswordAllowed: 'bool', verifyEmail: 'bool', loginWithEmailAllowed: 'bool', duplicateEmailsAllowed: 'bool',
        eventsEnabled: 'bool', eventsExpiration: 'int', adminEventsEnabled: 'bool', adminEventsDetailsEnabled: 'bool',
        revokeRefreshToken: 'bool', refreshTokenMaxReuse: 'int',
      };
      const { KEYCLOAK_URL, KEYCLOAK_REALM: REALM } = process.env;
      const base = KEYCLOAK_URL.replace(/\/$/, '');

      const load = (p) => {
        let d = JSON.parse(fs.readFileSync(p, 'utf8'));
        while (typeof d === 'string') d = d.trim() ? JSON.parse(d) : {};
        return d;
      };
      const emit = (outputs) => console.log('::' + JSON.stringify({ outputs }) + '::');

      // Keycloak reports sslRequired in lower case and re-serializes password policies, so compare normalised values.
      const norm = (field, v) => {
        if (v === undefined || v === null) return field === 'passwordPolicy' ? '' : null;
        if (field === 'sslRequired') return String(v).toLowerCase();
        if (field === 'passwordPolicy') return String(v).split(' and ').map((s) => s.trim().replace(/\s+/g, '')).filter(Boolean).sort().join(' and ');
        return v;
      };
      const same = (field, a, b) => JSON.stringify(norm(field, a)) === JSON.stringify(norm(field, b));

      const adminToken = async () => {
        const res = await fetch(`${base}/realms/${process.env.ADMIN_REALM}/protocol/openid-connect/token`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: new URLSearchParams({
            grant_type: 'password',
            client_id: process.env.ADMIN_CLIENT_ID,
            username: process.env.ADMIN_USERNAME,
            password: process.env.ADMIN_PASSWORD,
          }),
        });
        const json = await res.json().catch(() => ({}));
        if (!res.ok || !json.access_token) throw new Error(`admin token request failed: HTTP ${res.status} ${json.error || ''}`);
        return json.access_token;
      };
      const kc = async (token, method, body) => {
        const res = await fetch(`${base}/admin/realms/${REALM}`, {
          method,
          headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
          body: body ? JSON.stringify(body) : undefined,
        });
        const text = await res.text();
        if (!res.ok) throw new Error(`Keycloak ${method} /admin/realms/${REALM} -> HTTP ${res.status}: ${text.slice(0, 300)}`);
        return text ? JSON.parse(text) : {};
      };

      const desired = load('desired.json');
      const live = load('live.json');
      const ledger = load('ledger.json') || {};
      const lastApplied = ledger.last_applied || {};
      const history = ledger.revert_history || {};
      const rejected = ledger.rejected || {};
      const flapLimit = Number(process.env.FLAP_LIMIT);
      const windowMs = Number(process.env.FLAP_WINDOW_HOURS) * 3600000;
      const now = Date.now();
      const has = (o, k) => Object.prototype.hasOwnProperty.call(o, k);

      const changes = [];
      const converged = [];
      const recentOf = (f) => (history[f] || []).filter((t) => now - Date.parse(t) < windowMs);

      for (const field of Object.keys(desired).sort()) {
        const d = desired[field];
        const l = live[field];
        if (same(field, l, d)) { converged.push(field); continue; }
        // Baseline for "did git change?" is what this flow last applied; on the first run it is the live value.
        const b = has(lastApplied, field) ? lastApplied[field] : l;
        let kind;
        if (same(field, d, b)) kind = recentOf(field).length >= flapLimit ? 'FLAPPING' : 'DRIFT_REVERT';
        else if (same(field, l, b)) kind = has(rejected, field) && same(field, rejected[field], d) ? 'REJECTED' : 'GIT_CHANGE';
        else kind = 'CONFLICT';
        // A realm with no value for a setting cannot be rolled back to "unset" through the Admin API (null fields are ignored on PUT).
        if ((kind === 'GIT_CHANGE' || kind === 'DRIFT_REVERT') && l === null && field !== 'passwordPolicy') kind = 'UNRESTORABLE';
        changes.push({ field, kind, desired: d, live: l, last_applied: has(lastApplied, field) ? lastApplied[field] : null, apply: kind === 'GIT_CHANGE' || kind === 'DRIFT_REVERT' });
      }

      const applied = changes.filter((c) => c.apply);
      const blocked = changes.filter((c) => !c.apply);
      const adopt = converged.filter((f) => !has(lastApplied, f) || !same(f, lastApplied[f], desired[f]));

      // Values that failed the canary and were rolled back stay rejected until git changes them, so a bad commit is not retried every run.
      const keptRejected = Object.fromEntries(Object.entries(rejected).filter(([f, v]) => has(desired, f) && same(f, v, desired[f]) && !applied.some((c) => c.field === f)));
      const nextApplied = { ...lastApplied };
      for (const f of converged) nextApplied[f] = desired[f];
      for (const c of applied) nextApplied[c.field] = c.desired;
      const nextHistory = {};
      for (const f of Object.keys({ ...history, ...desired })) {
        const kept = recentOf(f);
        if (applied.some((c) => c.field === f && c.kind === 'DRIFT_REVERT')) kept.push(new Date(now).toISOString());
        if (kept.length) nextHistory[f] = kept;
      }

      const show = (v) => (v === null ? 'unset' : JSON.stringify(v));
      const lines = changes.map((c) => {
        const why = {
          GIT_CHANGE: 'git changed it, live still has the last applied value',
          DRIFT_REVERT: 'live was edited by hand, git still wants the last applied value',
          CONFLICT: 'git and live both changed, nothing is overwritten',
          REJECTED: 'this value failed the canary earlier and was rolled back, change it in git to try again',
          FLAPPING: `reverted ${recentOf(c.field).length} time(s) in the last ${process.env.FLAP_WINDOW_HOURS} h, something keeps changing it`,
          UNRESTORABLE: 'the realm has no value for this setting yet, so a rollback could not restore it; set it once in the admin console first',
        }[c.kind];
        return `- \`${c.field}\` [${c.kind}]: live ${show(c.live)} -> git ${show(c.desired)} (${why})`;
      });

      emit({
        apply_count: applied.length,
        blocked_count: blocked.length,
        adopt_count: adopt.length,
        converged_count: converged.length,
        apply_payload: Object.fromEntries(applied.map((c) => [c.field, c.desired])),
        previous_values: Object.fromEntries(applied.map((c) => [c.field, c.live === null ? '' : c.live])),
        report: lines.length ? lines.join('\n') : 'Live realm matches git.',
        ledger_next: {
          last_applied: nextApplied,
          revert_history: nextHistory,
          rejected: keptRejected,
          last_commit: process.env.COMMIT,
          updated_at: new Date(now).toISOString(),
        },
        ledger_rejected: {
          ...ledger,
          rejected: { ...keptRejected, ...Object.fromEntries(applied.map((c) => [c.field, c.desired])) },
          updated_at: new Date(now).toISOString(),
        },
      });

  - id: gate_on_changes
    type: io.kestra.plugin.core.flow.If
    description: Act only when something differs or is blocked. Otherwise just keep the ledger current.
    condition: "{{ outputs.plan_reconcile.vars.apply_count > 0 or outputs.plan_reconcile.vars.blocked_count > 0 }}"
    then:
      - id: notify_plan
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        messageText: |
          Keycloak realm `{{ inputs.realm }}` vs `{{ inputs.git_url }}` at `{{ outputs.load_desired_state.vars.commit | slice(0, 8) }}`: {{ outputs.plan_reconcile.vars.apply_count }} change(s) to apply, {{ outputs.plan_reconcile.vars.blocked_count }} blocked.
          {{ outputs.plan_reconcile.vars.report }}
          {{ (inputs.apply_after_approval and outputs.plan_reconcile.vars.apply_count > 0) ? 'Execution `' ~ execution.id ~ '` is waiting for approval.' : 'Nothing will be changed in this run.' }}

      - id: gate_on_apply
        type: io.kestra.plugin.core.flow.If
        condition: "{{ inputs.apply_after_approval and outputs.plan_reconcile.vars.apply_count > 0 }}"
        then:
          - id: approval_gate
            type: io.kestra.plugin.core.flow.Pause
            description: Operator reviews the listed changes. Not approving within 4 hours cancels the run; the next run plans again from fresh state.
            pauseDuration: PT4H
            behavior: CANCEL
            onResume:
              - id: approved
                type: BOOL
                defaults: false
                description: Set to true to apply the listed changes to the live realm.

          - id: gate_on_approval
            type: io.kestra.plugin.core.flow.If
            condition: "{{ outputs.approval_gate.onResume.approved == true or outputs.approval_gate.onResume.approved == 'true' }}"
            then:
              - id: apply_changes
                type: io.kestra.plugin.scripts.node.Script
                description: Read the full realm, change only the approved settings and PUT it back. A partial PUT is not safe, because Keycloak resets the device-code, CIBA and PAR settings to their defaults when they are missing from the request.
                containerImage: node:20-slim
                taskRunner:
                  type: io.kestra.plugin.scripts.runner.docker.Docker
                inputFiles:
                  payload.json: "{{ outputs.plan_reconcile.vars.apply_payload | toJson }}"
                env:
                  KEYCLOAK_URL: "{{ inputs.keycloak_url }}"
                  KEYCLOAK_REALM: "{{ inputs.realm }}"
                  ADMIN_REALM: master
                  ADMIN_CLIENT_ID: admin-cli
                  ADMIN_USERNAME: "{{ secret('KEYCLOAK_ADMIN_USERNAME') }}"
                  ADMIN_PASSWORD: "{{ secret('KEYCLOAK_ADMIN_PASSWORD') }}"
                script: |
                  const fs = require('fs');

                  // Realm settings this flow may manage. Anything else in the desired file is rejected, so a typo or an
                  // over-eager commit can never reach smtp, identity providers or the realm name.
                  const MANAGED = {
                    bruteForceProtected: 'bool', permanentLockout: 'bool', failureFactor: 'int', maxFailureWaitSeconds: 'int',
