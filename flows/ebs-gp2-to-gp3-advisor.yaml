id: ebs-gp2-to-gp3-advisor
namespace: company.team

description: |
  Find gp2 EBS volumes that should be gp3. gp3 is ~20% cheaper per GB-month
  ($0.08 vs $0.10) with better baseline performance, and the migration is a
  live, no-downtime `modify-volume` call. This flow is advisory only: it
  lists every gp2 volume across your regions with the monthly savings per
  volume and ready-to-paste modify commands. Nothing is ever modified.

triggers:
  - id: weekly
    type: io.kestra.plugin.core.trigger.Schedule
    description: Weekly on Monday at 09:00 UTC. Shipped disabled; enable after your first manual run.
    cron: "0 9 * * 1"
    disabled: true

inputs:
  - id: aws_regions
    "type": ARRAY
    itemType: STRING
    defaults: ["us-east-1"]
    description: AWS regions to scan for gp2 volumes.
  - id: min_size_gb
    "type": INT
    defaults: 0
    description: Skip volumes smaller than this many GB. Set e.g. 100 to focus on the big wins.

tasks:
  - id: scan_regions
    type: io.kestra.plugin.core.flow.ForEach
    description: Scan for gp2 volumes region by region.
    values: "{{ inputs.aws_regions }}"
    tasks:
      - id: audit_region
        type: io.kestra.plugin.aws.cli.AwsCLI
        description: List gp2 volumes, compute gp2 vs gp3 monthly cost and savings per volume.
        region: "{{ taskrun.value }}"
        accessKeyId: "{{ secret('AWS_ACCESS_KEY_ID') }}"
        secretKeyId: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
        commands:
          - |
            REGION="{{ taskrun.value }}"
            export REGION
            export MIN_SIZE="{{ inputs.min_size_gb }}"
            echo "Scanning gp2 volumes in $REGION (min size ${MIN_SIZE}GB)"
            aws ec2 describe-volumes --region "$REGION" \
              --filters Name=volume-type,Values=gp2 \
              --query 'Volumes[].[VolumeId,Size,State,Attachments[0].InstanceId]' \
              --output json > /tmp/gp2.json
            python3 << 'PYEOF' > /tmp/gp2report.txt
            import json, os
            region = os.environ["REGION"]; min_size = int(os.environ["MIN_SIZE"])
            vols = json.load(open("/tmp/gp2.json")) or []
            rows = []
            for vid, size, state, inst in vols:
                if int(size) < min_size:
                    continue
                gp2_cost = size * 0.10
                gp3_cost = size * 0.08
                rows.append((gp2_cost - gp3_cost, vid, size, state, inst or "-", gp2_cost, gp3_cost))
            rows.sort(reverse=True)
            total = sum(r[0] for r in rows)
            print("GP2_COUNT=%d" % len(rows))
            print("TOTAL_SAVINGS_USD=%.2f" % total)
            top = " | ".join("%s %dGB save $%.2f/mo" % (r[1], r[2], r[0]) for r in rows[:8])
            print("TOP_VOLUMES=%s" % (top if top else "none"))
            for i, r in enumerate(rows[:3], start=1):
                print("CMD_%d=aws ec2 modify-volume --volume-id %s --volume-type gp3 --region %s" % (i, r[1], region))
            if rows:
                print("GP2_VOLUMES_FOUND")
            PYEOF
            cat /tmp/gp2report.txt
            echo "REGION_DONE=$REGION"
      - id: decide_notify
        type: io.kestra.plugin.core.flow.If
        description: Report gp2 savings opportunities, stay quiet when everything is already gp3.
        condition: "{{ outputs.audit_region.stdout contains 'GP2_VOLUMES_FOUND' }}"
        then:
          - id: slack_advisory
            type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
            description: Report gp2 volumes with savings and ready-to-paste migrate commands.
            url: "{{ secret('SLACK_WEBHOOK_URL') }}"
            payload: |
              {
                "text": ":floppy_disk: *gp2 → gp3 advisor* — `{{ outputs.audit_region.vars.REGION_DONE }}`: *{{ outputs.audit_region.vars.GP2_COUNT }}* gp2 volume(s), ~*${{ outputs.audit_region.vars.TOTAL_SAVINGS_USD }}/mo* savings by switching to gp3 (20% cheaper/GB, better baseline perf, no downtime).\n`{{ outputs.audit_region.vars.TOP_VOLUMES }}`\nMigrate with:\n`{{ outputs.audit_region.vars.CMD_1 }}`\n`{{ outputs.audit_region.vars.CMD_2 }}`\n`{{ outputs.audit_region.vars.CMD_3 }}`"
              }
        else:
          - id: log_clean
            type: io.kestra.plugin.core.log.Log
            message: "{{ outputs.audit_region.vars.REGION_DONE }} — no gp2 volumes found. Everything is already on gp3 or newer."

extend:
  title: EBS gp2 to gp3 Advisor
  metaTitle: Find gp2 EBS Volumes to Migrate to gp3 | Kestra
  shortDescription: Scan regions for gp2 EBS volumes, compute the monthly savings of switching to gp3, and get ready-to-paste migrate commands. Advisory only — nothing is modified.
  metaDescription: gp3 is 20% cheaper than gp2 with better performance. This flow finds your gp2 volumes and prices the switch weekly.
  description: |
    gp2 has been the EBS default for years, so most accounts are full of gp2 volumes created long before gp3 existed. gp3 costs $0.08/GB-month instead of $0.10 (a 20% cut), starts at a higher baseline performance, and lets you provision IOPS separately. Migrating is a single live API call with no downtime — yet teams never get around to auditing. This blueprint does the audit for you, weekly, and hands you the exact commands.

    ## How it works

    1. A Schedule trigger fires weekly on Monday at 09:00 UTC (shipped disabled).
    2. A ForEach loop scans each region in `aws_regions`.
    3. Per region, the flow lists all gp2 volumes via `describe-volumes`, skips volumes under `min_size_gb`, and computes gp2 vs gp3 monthly cost per volume at list price.
    4. It generates ready-to-paste `aws ec2 modify-volume --volume-type gp3` commands for the top offenders.
    5. An `If` task posts a Slack advisory with volume IDs, sizes, monthly savings, and the migrate commands — quiet on regions with no gp2 left.

    ## What you get

    - A weekly list of gp2 volumes with per-volume size and dollar savings, worst offenders first.
    - Ready-to-paste `modify-volume` commands — the migration itself is one copy-paste per volume.
    - A `min_size_gb` input to skip tiny volumes and focus on the big wins.
    - A strictly advisory flow: it never modifies anything, so it's safe to run anywhere.

    ## Who it's for

    Platform engineers sitting on fleets of gp2 volumes from the pre-gp3 era who want the savings without an afternoon of console clicking.

    ## Why orchestrate this with Kestra

    The gp2→gp3 win is well known and still unclaimed in most accounts because nobody schedules the audit. As a Kestra flow it runs weekly on its own, the savings math is in one place, and the output is actionable commands — not a spreadsheet someone has to translate.

    ## Prerequisites

    - AWS credentials with `ec2:DescribeVolumes` permission (read-only; no modify permission needed).
    - A Slack incoming webhook URL.

    ### Secrets

    - `AWS_ACCESS_KEY_ID`: AWS access key for the EC2 API calls.
    - `AWS_SECRET_ACCESS_KEY`: AWS secret key for the EC2 API calls.
    - `SLACK_WEBHOOK_URL`: Incoming webhook URL for the gp2 advisory report.

    ## Quick start

    1. Add the three secrets above to your Kestra namespace.
    2. Set `aws_regions` to the regions you run EC2/EBS in.
    3. Run manually once and review the Slack advisory.
    4. Paste the migrate commands for volumes you're comfortable switching, then enable the weekly schedule trigger.

    ## How to extend

    - Add an `enforce` input that runs `modify-volume` automatically for volumes under a savings threshold.
    - Include io1/io2 volumes in the audit with their own gp3/io2-Block-Express math.
    - Track savings realized over time by comparing week-over-week gp2 counts.

    ## Links

    - [Kestra AWS plugins](https://kestra.io/plugins)
    - [Kestra Slack plugins](https://kestra.io/plugins)
    - [EBS volume types and pricing](https://aws.amazon.com/ebs/pricing/)
    - [modify-volume API](https://docs.aws.amazon.com/cli/latest/reference/ec2/modify-volume.html)
  tags:
    - Infrastructure
  subTags:
    - FinOps & Cost Management
    - Day 2 Operations
  ee: false
  demo: false
