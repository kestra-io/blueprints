id: clickhouse-zookeeper-session-expiration-sentinel
namespace: company.team

inputs:
  - id: clickhouse_host
    type: STRING
    defaults: "clickhouse.internal"
    description: ClickHouse server hostname or IP address.
  - id: clickhouse_http_port
    type: INT
    defaults: 8123
    description: ClickHouse HTTP interface port.
  - id: clickhouse_user
    type: STRING
    defaults: "default"
    description: ClickHouse user name.

tasks:
  - id: query_zk_session_telemetry
    type: io.kestra.plugin.scripts.shell.Commands
    containerImage: ghcr.io/kestra-io/tools:latest
    commands:
      - |
        set -euo pipefail
        python3 -c "
        import requests, json, sys

        host = '{{ inputs.clickhouse_host }}'
        port = {{ inputs.clickhouse_http_port }}
        user = '{{ inputs.clickhouse_user }}'
        pwd = '{{ secret('CLICKHOUSE_PASSWORD') }}'
        query = \"SELECT sum(is_session_expired) as expired_tables, sum(is_readonly) as readonly_tables FROM system.replicas FORMAT JSON\"

        try:
            resp = requests.get(f'http://{host}:{port}/', params={'query': query}, auth=(user, pwd), timeout=15)
            resp.raise_for_status()
            data = resp.json().get('data', [{}])[0]
            expired = int(data.get('expired_tables', 0)) if data.get('expired_tables') is not None else 0
            readonly = int(data.get('readonly_tables', 0)) if data.get('readonly_tables') is not None else 0

            result = {
                'expired_tables': expired,
                'readonly_tables': readonly,
                'alert_triggered': expired > 0 or readonly > 0
            }
            with open('ch_zk_summary.json', 'w') as out:
                json.dump(result, out)
            print('ClickHouse ZK session metrics:', result)
        except Exception as err:
            sys.stderr.write(f'ClickHouse query error: {err}\n')
            sys.exit(1)
        "
    outputFiles:
      - ch_zk_summary.json

  - id: evaluate_zookeeper_session
    type: io.kestra.plugin.core.flow.If
    condition: "{{ fromJson(read(outputs.query_zk_session_telemetry.outputFiles['ch_zk_summary.json'])).alert_triggered }}"
    then:
      - id: notify_dba_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#clickhouse-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 ClickHouse ZooKeeper Session Expiration Alert",
                "text": "ClickHouse node `{{ inputs.clickhouse_host }}` reported *{{ fromJson(read(outputs.query_zk_session_telemetry.outputFiles['ch_zk_summary.json'])).expired_tables }}* tables with expired ZooKeeper sessions and *{{ fromJson(read(outputs.query_zk_session_telemetry.outputFiles['ch_zk_summary.json'])).readonly_tables }}* tables in read-only mode! Impact: ReplicatedMergeTree inserts are failing due to ZooKeeper/Keeper cluster disconnect or session timeout.",
                "footer": "Kestra Database Sentinel • ClickHouse"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#clickhouse-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ ClickHouse Keeper / ZooKeeper Session Expiration Sentinel Pipeline Failure",
            "text": "Failed to query ClickHouse ZooKeeper session telemetry. Please verify connection credentials and network routes.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  metaDescription: "Monitors ClickHouse system.events and system.replicas to detect Keeper/ZooKeeper session expirations and read-only table transitions."
  metaTitle: ClickHouse Keeper / ZooKeeper Session Expiration Sentinel with Kestra
  title: ClickHouse Keeper / ZooKeeper Session Expiration Sentinel
  shortDescription: Monitors ClickHouse system.events and system.replicas to detect Keeper/ZooKeeper session expirations and read-only table transitions.
  description: |
    ## How it works
    This workflow executes an analytical query against ClickHouse's `system.replicas` system catalog table, inspecting `is_session_expired` and `is_readonly`. When ClickHouse loses connection to ClickHouse Keeper or Apache ZooKeeper beyond the session timeout duration, tables become read-only and replication halts. If any tables report expired sessions, an alert is dispatched to Slack.

    ## What you get
    - Immediate alerting when ZooKeeper sessions expire or cluster communication drops.
    - Prevents silent replication stalls and query errors on ReplicatedMergeTree engines.
    - Exact counts of impacted tables and read-only partitions.

    ## Who it's for
    - Database Administrators (DBAs) managing distributed ClickHouse clusters.
    - Platform Engineers responsible for ClickHouse Keeper or ZooKeeper quorum health.

    ## Why orchestrate this with Kestra
    - **Continuous Cluster Validation**: Automate periodic quorum and coordination heartbeat checks.
    - **No Sidecars Required**: Direct HTTP query execution eliminates the need for heavyweight monitoring daemons.
    - **Rapid Incident Escalation**: Immediate Slack notifications accelerate failover actions.

    ## Prerequisites
    - ClickHouse server running with ZooKeeper or ClickHouse Keeper.
    - Secrets `CLICKHOUSE_PASSWORD` and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import the blueprint into Kestra.
    2. Configure ClickHouse endpoint parameters.
    3. Run the flow to audit replica session health.

    ## How to extend
    - Query `system.zookeeper` directly to verify coordination node latency.
    - Trigger automated keeper failover or container restart procedures upon persistent failure.

    ## Links
    - [ClickHouse ReplicatedMergeTree Documentation](https://clickhouse.com/docs/en/engines/table-engines/mergetree-family/replication)
    - [Kestra Slack Plugin](https://kestra.io/plugins/plugin-slack/io.kestra.plugin.slack.notifications.slackincomingwebhook)
  tags:
    - Data
    - Infrastructure
  subTags:
    - ELT & Data Landing
    - Day 2 Operations
  ee: false
  demo: false
