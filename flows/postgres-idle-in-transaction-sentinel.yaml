id: postgres-idle-in-transaction-sentinel
namespace: company.database
description: Audits PostgreSQL active sessions to detect abandoned idle-in-transaction connections holding row locks and stalling autovacuum.

inputs:
  - id: db_host
    type: STRING
    defaults: "postgres.internal"
    description: PostgreSQL database server hostname or IP.
  - id: db_port
    type: INT
    defaults: 5432
    description: PostgreSQL server port.
  - id: db_name
    type: STRING
    defaults: "postgres"
    description: PostgreSQL database name.
  - id: db_user
    type: STRING
    defaults: "postgres"
    description: PostgreSQL administrative user.
  - id: idle_seconds_threshold
    type: INT
    defaults: 300
    description: Maximum acceptable age in seconds for idle in transaction sessions (default 5 minutes).

tasks:
  - id: query_idle_transactions
    type: io.kestra.plugin.jdbc.postgresql.Query
    url: "jdbc:postgresql://{{ inputs.db_host }}:{{ inputs.db_port }}/{{ inputs.db_name }}"
    username: "{{ inputs.db_user }}"
    password: "{{ secret('POSTGRES_PASSWORD') }}"
    sql: |
      SELECT 
          pid,
          usename,
          client_addr::text AS client_ip,
          state,
          ROUND(EXTRACT(EPOCH FROM (now() - state_change))) AS idle_seconds,
          SUBSTRING(query, 1, 100) AS last_query
      FROM pg_stat_activity
      WHERE state = 'idle in transaction'
        AND (now() - state_change) > (interval '1 second' * {{ inputs.idle_seconds_threshold }})
      ORDER BY idle_seconds DESC;
    fetchType: FETCH

  - id: evaluate_idle_sessions
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.query_idle_transactions.rows ? outputs.query_idle_transactions.rows | length > 0 : false }}"
    then:
      - id: notify_dba_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#dba-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 PostgreSQL Long-Running Idle in Transaction Sentinel Alert",
                "text": "Detected *{{ outputs.query_idle_transactions.rows | length }}* session(s) stuck in *idle in transaction* state exceeding *{{ inputs.idle_seconds_threshold }}s*. Offending sessions: {{ outputs.query_idle_transactions.rows }}. Impact: Sessions hold table locks, block vacuum cleanup, cause table bloat, and prevent XID advancement.",
                "footer": "Kestra Database Sentinel • Postgres Idle Transactions"
              }
            ]
          }

outputs:
  - id: idle_sessions_count
    type: INT
    value: "{{ outputs.query_idle_transactions.rows ? outputs.query_idle_transactions.rows | length : 0 }}"
  - id: is_alerting
    type: BOOLEAN
    value: "{{ outputs.query_idle_transactions.rows ? outputs.query_idle_transactions.rows | length > 0 : false }}"

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#dba-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ Postgres Idle Transaction Sentinel Failed",
            "text": "The idle in transaction query workflow encountered an execution failure. Please verify database credentials and network reachability.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  metaDescription: Audits PostgreSQL active sessions to detect abandoned idle-in-transaction connections holding row locks and stalling autovacuum.
  metaTitle: PostgreSQL Long-Running Idle in Transaction and Lock Retention Sentinel with Kestra
  title: PostgreSQL Long-Running Idle in Transaction and Lock Retention Sentinel
  shortDescription: Audits PostgreSQL active sessions to detect abandoned idle-in-transaction connections holding row locks and stalling autovacuum.
  description: |
    ## How it works
    This workflow connects directly to PostgreSQL using the official JDBC PostgreSQL plugin to query `pg_stat_activity`. It identifies backend client sessions in the `idle in transaction` state where elapsed time since `state_change` exceeds the configured operational limit (e.g. 300 seconds). Idle transactions hold open snapshots and row/table locks, preventing autovacuum from cleaning dead tuples and causing severe table bloat. Any offending connections trigger an instant Slack alert.

    ## What you get
    - Proactive detection of unclosed application database connections.
    - Prevents catalog lock contention and transaction ID wraparound buildup.
    - Comprehensive session telemetry including PID, client IP, username, and last executed SQL fragment.

    ## Who it's for
    - Database Administrators (DBAs) and Backend Engineers troubleshooting locking conflicts and connection pool leaks.
    - SREs maintaining production database uptime and preventing query lock starvation.

    ## Why orchestrate this with Kestra
    - **Direct Database Connectivity**: Uses official `io.kestra.plugin.jdbc.postgresql.Query` without external CLI wrappers.
    - **Continuous Health Verification**: Automated 15-minute polling ensures rapid detection of leaked transactions.
    - **Extensible Auto-Remediation**: Can be configured to issue `SELECT pg_terminate_backend(pid)` on non-responsive connections.

    ## Prerequisites
    - PostgreSQL database credentials with access to `pg_stat_activity`.
    - Secrets `POSTGRES_PASSWORD` and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import this blueprint into Kestra.
    2. Configure database host and secrets.
    3. Run the workflow to inspect open transactions.

    ## Links
    - [PostgreSQL pg_stat_activity Documentation](https://www.postgresql.org/docs/current/monitoring-stats.html#PG-STAT-ACTIVITY-VIEW)
    - [Kestra PostgreSQL Plugin](https://kestra.io/plugins/plugin-jdbc-postgres)
  tags:
    - Data
    - Infrastructure
  subTags:
    - ELT & Data Landing
    - Day 2 Operations
  ee: false
  demo: false
