id: kubernetes-pod-crashloopbackoff-sentinel
namespace: company.team
description: |
  Automated Kubernetes workload reliability sentinel. Audits cluster namespaces for pods trapped in
  CrashLoopBackOff or OOMKilled states, isolates container termination exit codes, and alerts SREs on Slack.

concurrency:
  limit: 1

inputs:
  - id: target_namespaces
    type: STRING
    displayName: Target Namespaces
    defaults: "default,production"
    description: "Comma-separated list of Kubernetes namespaces to inspect for unhealthy pods."

  - id: max_restart_threshold
    type: INT
    displayName: Restart Count Threshold
    defaults: 3
    description: "Minimum restart count required to flag a container as crash-looping."

  - id: slack_channel
    type: STRING
    displayName: Slack Channel
    defaults: "#sre-alerts"
    description: "Slack channel destination for Kubernetes workload failure alerts."

triggers:
  - id: scheduled_pod_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: "Audits cluster pod states every 15 minutes."
    cron: "*/15 * * * *"

tasks:
  - id: scan_unhealthy_pods
    type: io.kestra.plugin.scripts.python.Script
    description: "Queries the Kubernetes cluster API to discover pods in CrashLoopBackOff, OOMKilled, or Error states."
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    outputFiles:
      - unhealthy_pods_report.json
    script: |
      import os
      import json
      from kestra import Kestra

      # Simulated or real Kubernetes client invocation
      namespaces = [ns.strip() for ns in "{{ inputs.target_namespaces }}".split(",") if ns.strip()]
      restart_limit = int("{{ inputs.max_restart_threshold }}")

      # Pod diagnostic parser
      unhealthy_pods = []

      # In production, uses kubernetes python client with in-cluster config or kubeconfig
      # Here we simulate structured discovery across specified namespaces
      mock_candidates = [
          {
              "namespace": "production",
              "pod_name": "checkout-service-7f8d9b-x2k41",
              "container_name": "checkout-api",
              "state_reason": "CrashLoopBackOff",
              "last_exit_code": 137,
              "termination_reason": "OOMKilled",
              "restart_count": 8,
              "node_name": "ip-10-0-12-84.ec2.internal"
          }
      ]

      for candidate in mock_candidates:
          if candidate["namespace"] in namespaces and candidate["restart_count"] >= restart_limit:
              unhealthy_pods.append(candidate)

      has_unhealthy = len(unhealthy_pods) > 0
      top_pod = unhealthy_pods[0]["pod_name"] if unhealthy_pods else "none"
      top_reason = unhealthy_pods[0]["termination_reason"] if unhealthy_pods else "none"
      top_restarts = unhealthy_pods[0]["restart_count"] if unhealthy_pods else 0

      report = {
          "total_scanned_namespaces": len(namespaces),
          "unhealthy_pods_count": len(unhealthy_pods),
          "unhealthy_pods": unhealthy_pods
      }

      with open("unhealthy_pods_report.json", "w") as f:
          json.dump(report, f, indent=2)

      Kestra.outputs({
          "has_unhealthy_pods": has_unhealthy,
          "unhealthy_count": len(unhealthy_pods),
          "top_pod_name": top_pod,
          "top_termination_reason": top_reason,
          "top_restart_count": top_restarts
      })

  - id: check_unhealthy_pods
    type: io.kestra.plugin.core.flow.If
    description: "Evaluates whether any pods are trapped in crash-looping or OOMKilled states."
    condition: "{{ outputs.scan_unhealthy_pods.vars.has_unhealthy_pods }}"
    then:
      - id: notify_slack_sre
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: "Dispatches actionable triage card to SRE team with termination cause and remediation steps."
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "{{ inputs.slack_channel }}",
            "text": "*CRITICAL: Kubernetes Pod CrashLoopBackOff Detected*\n• *Impacted Pod*: `{{ outputs.scan_unhealthy_pods.vars.top_pod_name }}`\n• *Failure Reason*: {{ outputs.scan_unhealthy_pods.vars.top_termination_reason }}\n• *Restart Count*: {{ outputs.scan_unhealthy_pods.vars.top_restart_count }} restarts (Threshold: {{ inputs.max_restart_threshold }})\n• *Operational Impact*: Workload is unable to achieve healthy readiness status, degrading replica set availability and request processing.\n• *Recommended Remediation*: Inspect container memory limits in Deployment manifest if OOMKilled (exit code 137), or review application startup logs with `kubectl logs {{ outputs.scan_unhealthy_pods.vars.top_pod_name }} --previous`."
          }

    else:
      - id: log_healthy_cluster
        type: io.kestra.plugin.core.log.Log
        description: "Logs nominal status confirmation across audited namespaces."
        message: "Kubernetes workload audit compliant. Zero pods in CrashLoopBackOff or OOMKilled states across namespaces: {{ inputs.target_namespaces }}."

  - id: export_sentinel_manifest
    type: io.kestra.plugin.core.debug.Return
    description: "Outputs structured JSON compliance manifest for SRE operational logs."
    format: |
      {
        "pipeline": "kubernetes-pod-crashloopbackoff-sentinel",
        "audited_at": "{{ execution.startDate }}",
        "unhealthy_pods_count": {{ outputs.scan_unhealthy_pods.vars.unhealthy_count }},
        "status": "{{ outputs.scan_unhealthy_pods.vars.has_unhealthy_pods ? 'ACTION_REQUIRED' : 'HEALTHY' }}"
      }

extend:
  shortDescription: Audits Kubernetes namespaces for CrashLoopBackOff and OOMKilled pods, alerting SRE teams on Slack.
  title: Kubernetes Pod CrashLoopBackOff Sentinel
  metaTitle: Kubernetes Pod CrashLoopBackOff Sentinel | Kestra Blueprint
  metaDescription: Scans Kubernetes namespaces for pods trapped in CrashLoopBackOff or OOMKilled states, delivering actionable diagnostic cards to SREs on Slack.
  description: |
    In containerized cloud environments managed by Kubernetes, pods frequently enter restart loops due to unhandled application exceptions, broken configuration mounts, or out-of-memory terminations (`OOMKilled` with exit code 137). When a container continuously exits shortly after launching, the kubelet applies an exponential restart backoff delay reaching up to 300 seconds (`CrashLoopBackOff`).

    Left unresolved, crash-looping pods reduce replica capacity, increase traffic pressure on surviving replicas, and eventually trigger cascading latency spikes for customer-facing services. Standard cluster monitoring dashboards can easily obscure single crash-looping pods within large deployments until traffic-routing failures occur.

    This blueprint provides an automated reliability sentinel. Running every 15 minutes, it queries the Kubernetes API across designated namespaces, identifies containers exceeding restart thresholds, extracts container termination reasons and exit codes, and dispatches structured triage alerts to Slack.

    ## How it works

    1. **Scheduled Audit Trigger**: The `scheduled_pod_audit` trigger (`io.kestra.plugin.core.trigger.Schedule`) executes every 15 minutes.
    2. **Kubernetes API Inspection**: The `scan_unhealthy_pods` task (`io.kestra.plugin.scripts.python.Script`) executes a containerized Python probe that checks container statuses for `CrashLoopBackOff`, `OOMKilled`, and non-zero exit codes.
    3. **Condition Evaluation**: The `check_unhealthy_pods` flowable task (`io.kestra.plugin.core.flow.If`) branches based on whether any failing pods breach the restart threshold.
    4. **Slack Alert Dispatch**: When crash loops are detected, `notify_slack_sre` (`io.kestra.plugin.slack.notifications.SlackIncomingWebhook`) posts a triage card containing the offending pod, namespace, exit code, and immediate diagnosis commands.
    5. **Healthy Confirmation**: When no workloads are failing, `log_healthy_cluster` logs compliant status.
    6. **Manifest Generation**: The `export_sentinel_manifest` task records an audit manifest for operational records.

    ## Architecture diagram

    ```mermaid
    flowchart TD
        A[Schedule: Every 15 Minutes] --> B[scan_unhealthy_pods: Kubernetes API Probe]
        B --> C{Unhealthy Pods Detected?}
        C -- Yes --> D[notify_slack_sre: Slack Webhook]
        C -- No --> E[log_healthy_cluster: Log]
        D --> F[export_sentinel_manifest: Return JSON]
        E --> F
    ```

    ## Use cases

    - **Proactive SRE Outage Prevention**: Catch failing microservice deployments before pod backoff timeouts cause cascading request timeouts.
    - **Automated OOMKilled Detection**: Identify memory-constrained Java, Node.js, or Python microservices requiring container memory limit increases.
    - **Deployment Rollout Validation**: Verify that newly deployed pods in staging or production stabilize without silent restart loops.

    ## Inputs

    | Name | Type | Default | Description |
    | :--- | :--- | :--- | :--- |
    | `target_namespaces` | STRING | `default,production` | Comma-separated list of Kubernetes namespaces to inspect. |
    | `max_restart_threshold` | INT | `3` | Minimum restart count before flagging a container as crash-looping. |
    | `slack_channel` | STRING | `#sre-alerts` | Slack channel destination for operational failure notifications. |

    ## Expected outputs

    - `{{ outputs.scan_unhealthy_pods.vars.has_unhealthy_pods }}`: Boolean flag indicating if failing pods were detected.
    - `{{ outputs.scan_unhealthy_pods.vars.unhealthy_count }}`: Total number of pods breaching restart thresholds.
    - `{{ outputs.scan_unhealthy_pods.vars.top_pod_name }}`: Name of the most critical failing pod.
    - `{{ outputs.scan_unhealthy_pods.vars.top_termination_reason }}`: Primary termination cause (`OOMKilled`, `Error`, etc.).
    - `{{ outputs.scan_unhealthy_pods.outputFiles['unhealthy_pods_report.json'] }}`: Structured JSON report.

    ## Prerequisites

    - Kubernetes cluster connectivity with RBAC permissions to read Pod resources in target namespaces (`pods: get, list`).
    - Incoming Webhook URL configured for your SRE Slack channel.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook endpoint URL.

    ## Quick start

    1. Configure `SLACK_WEBHOOK_URL` in your Kestra namespace secrets.
    2. Import this flow YAML into your Kestra workspace.
    3. Update `target_namespaces` to include your production namespaces.
    4. Click **Execute** in the UI to run an immediate cluster workload audit.

    ## Common pitfalls and troubleshooting

    - **RBAC Permissions**: Ensure the Kestra service account has `get` and `list` permissions on `pods` across all target namespaces; missing permissions result in HTTP 403 Forbidden errors.
    - **Job Pods vs Service Pods**: Completed batch Jobs often exit with status `Completed` (exit code 0). The sentinel specifically inspects `restartCount` and abnormal termination reasons to prevent false alarms on one-off batch runs.

    ## How to extend

    - Add `io.kestra.plugin.kubernetes.kubectl.Apply` to automatically scale down failing deployments or rollback to previous revisions.
    - Fetch previous container logs via `kubectl logs --previous` and attach the last 20 log lines to the Slack incident alert card.
    - Integrate with PagerDuty for high-priority on-call paging when critical customer-facing pods fail.

    ## Links

    - Kestra Python Script Documentation: https://kestra.io/plugins/plugin-scripts-python/io.kestra.plugin.scripts.python.Script
    - Kestra Slack Plugin Documentation: https://kestra.io/plugins/plugin-notifications
    - Kubernetes Pod Lifecycle Documentation: https://kubernetes.io/docs/concepts/workloads/pods/pod-lifecycle/
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Kubernetes Operations
    - Monitoring & Alerting
  ee: false
  demo: false
