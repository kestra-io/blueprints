id: github-codeql-sarif-gate
namespace: company.team
description: |
  Track CodeQL code-scanning alerts as regressions instead of a growing
  backlog: fetch open alerts from the GitHub code-scanning API, diff high
  and critical findings against a stored baseline, and when new findings
  appear open a labeled issue, alert Slack, and fail the run.

triggers:
  - id: on_analysis_webhook
    type: io.kestra.plugin.core.trigger.Webhook
    description: GitHub (or your CI) POSTs here when a CodeQL analysis completes or on push. Shipped with a keyed URL, treat the key as a secret.
    key: "{{ secret('CODEQL_WEBHOOK_KEY') }}"

  - id: daily_sweep
    type: io.kestra.plugin.core.trigger.Schedule
    description: Optional nightly sweep in case a webhook is missed. Ships disabled, enable it once the webhook is wired.
    cron: "0 6 * * *"
    disabled: true

inputs:
  - id: repository
    type: STRING
    defaults: your-org/your-repo
    description: GitHub repository to gate in owner/repo form, used for the code-scanning API calls and as the target for the issue it opens.
  - id: alert_threshold
    type: INT
    defaults: 0
    description: Number of new high or critical alerts tolerated before the gate fails. Zero means any new finding blocks.
  - id: branch
    type: STRING
    defaults: main
    description: Branch context recorded in the issue and Slack notice so triage starts at the right ref.

tasks:
  # --- 1. collect ---
  - id: fetch_open_alerts
    type: io.kestra.plugin.core.http.Request
    description: List every open code-scanning alert so the gate sees the full picture, not just the newest analysis run.
    method: GET
    uri: "https://api.github.com/repos/{{ inputs.repository }}/code-scanning/alerts?state=open&per_page=100"
    headers:
      Authorization: "Bearer {{ secret('GITHUB_TOKEN') }}"
      Accept: "application/vnd.github+json"
      X-GitHub-Api-Version: "2022-11-28"

  - id: fetch_latest_analysis
    type: io.kestra.plugin.core.http.Request
    description: Fetch the most recent code-scanning analysis for triage context. Allowed to fail so a missing analysis never blocks the alert check itself.
    allowFailure: true
    method: GET
    uri: "https://api.github.com/repos/{{ inputs.repository }}/code-scanning/analyses?per_page=1"
    headers:
      Authorization: "Bearer {{ secret('GITHUB_TOKEN') }}"
      Accept: "application/vnd.github+json"
      X-GitHub-Api-Version: "2022-11-28"

  - id: read_baseline
    type: io.kestra.plugin.core.kv.Get
    description: Load the alert numbers recorded by the last clean run. A first run has no baseline and every open high or critical alert counts as pre-existing.
    key: "codeql_alerts_{{ inputs.repository }}"
    errorOnMissing: false

  # --- 2. assess ---
  - id: assess
    type: io.kestra.plugin.scripts.python.Script
    description: Filter open alerts to high and critical severity, split them into new versus baseline-known, and emit a verdict through the outputs protocol.
    containerImage: python:3.12-slim
    inputFiles:
      alerts.json: "{{ outputs.fetch_open_alerts.body ?? '[]' }}"
      latest_analysis.json: "{{ outputs.fetch_latest_analysis.body ?? '[]' }}"
      baseline.json: "{{ outputs.read_baseline.value ?? '{}' }}"
      threshold.txt: "{{ inputs.alert_threshold }}"
    script: |
      import json

      def load_json(path, fallback):
          try:
              with open(path) as fh:
                  raw = fh.read().strip()
              if not raw:
                  return fallback
              return json.loads(raw)
          except Exception:
              return fallback

      alerts = load_json("alerts.json", [])
      if not isinstance(alerts, list):
          alerts = []
      baseline = load_json("baseline.json", {})
      if not isinstance(baseline, dict):
          baseline = {}
      analyses = load_json("latest_analysis.json", [])
      if not isinstance(analyses, list):
          analyses = []
      try:
          with open("threshold.txt") as fh:
              threshold = int(fh.read().strip())
      except Exception:
          threshold = 0

      known_raw = baseline.get("known_numbers")
      first_run = not isinstance(known_raw, list)
      known = set()
      if isinstance(known_raw, list):
          for n in known_raw:
              if isinstance(n, int):
                  known.add(n)
              else:
                  try:
                      known.add(int(n))
                  except Exception:
                      continue

      HIGH = {"critical", "high"}

      def is_high(alert):
          level = str(alert.get("security_severity_level") or "").lower()
          if level in HIGH:
              return True
          rule = alert.get("rule")
          if isinstance(rule, dict):
              rule_level = str(rule.get("security_severity_level") or "").lower()
              if rule_level in HIGH:
                  return True
          return False

      hc = []
      total_open = 0
      for alert in alerts:
          if not isinstance(alert, dict):
              continue
          total_open += 1
          state = str(alert.get("state") or "open").lower()
          if state != "open":
              continue
          if is_high(alert):
              hc.append(alert)

      current_numbers = []
      for a in hc:
          num = a.get("number")
          if isinstance(num, int):
              current_numbers.append(num)
      current_numbers = sorted(current_numbers)

      new_alerts = []
      if not first_run:
          for a in hc:
              num = a.get("number")
              if isinstance(num, int) and num not in known:
                  new_alerts.append(a)

      items = []
      for a in sorted(new_alerts, key=lambda x: x.get("number") or 0):
          rule = a.get("rule")
          rule_id = "unknown"
          if isinstance(rule, dict):
              rule_id = str(rule.get("id") or rule.get("name") or "unknown")
          path = ""
          instance = a.get("most_recent_instance")
          if isinstance(instance, dict):
              loc = instance.get("location")
              if isinstance(loc, dict):
                  path = str(loc.get("path") or "")
          severity = str(a.get("security_severity_level") or "").lower()
          if not severity and isinstance(rule, dict):
              severity = str(rule.get("security_severity_level") or "unknown").lower()
          if not severity:
              severity = "unknown"
          items.append({
              "number": a.get("number"),
              "severity": severity,
              "rule": rule_id,
              "path": path,
              "html_url": str(a.get("html_url") or ""),
          })

      new_count = len(items)
      blocked = new_count > threshold
      verdict = "regression" if blocked else "pass"

      def summarize(entries):
          if not entries:
              return "none"
          text = "; ".join(
              ("#%s %s (%s) %s" % (e["number"], e["rule"], e["severity"], e["path"])).strip()
              for e in entries
          )
          return text.replace('"', "'")

      analysis_tool = "unknown"
      analysis_ref = "unknown"
      if analyses and isinstance(analyses[0], dict):
          latest = analyses[0]
          tool = latest.get("tool")
          if isinstance(tool, dict):
              analysis_tool = str(tool.get("name") or "unknown")
          analysis_ref = str(latest.get("ref") or "unknown")

      payload = {"outputs": {
          "verdict": verdict,
          "blocked": blocked,
          "total_open": total_open,
          "open_high_critical": len(hc),
          "new_high_critical_count": new_count,
          "new_high_critical": items,
          "new_summary": summarize(items),
          "current_numbers": current_numbers,
          "analysis_tool": analysis_tool,
          "analysis_ref": analysis_ref,
          "first_run": first_run,
          "threshold": threshold,
      }}
      print("::" + json.dumps(payload) + "::")
      print("verdict=%s open=%d high_critical=%d new=%d first_run=%s" % (
          verdict, total_open, len(hc), new_count, first_run))

  # --- 3. gate ---
  - id: gate
    type: io.kestra.plugin.core.flow.If
    description: A new high or critical alert over the threshold stops the run. A clean run records the new baseline so the next comparison starts from today's position.
    condition: "{{ outputs.assess.vars.blocked }}"
    then:
      - id: open_issue
        type: io.kestra.plugin.github.issues.Create
        description: Open a labeled GitHub issue listing the new alerts with links, so triage lands in the same backlog engineers already work from.
        jwtToken: "{{ secret('GITHUB_TOKEN') }}"
        repository: "{{ inputs.repository }}"
        title: "CodeQL: {{ outputs.assess.vars.new_high_critical_count }} new high/critical alert(s) in {{ inputs.repository }}"
        body: |
          ## CodeQL regression

          **{{ outputs.assess.vars.new_high_critical_count }} new high or critical alert(s)** on branch `{{ inputs.branch }}`
          ({{ outputs.assess.vars.open_high_critical }} open high/critical of {{ outputs.assess.vars.total_open }} open total).

          Latest analysis tool: {{ outputs.assess.vars.analysis_tool }} (ref {{ outputs.assess.vars.analysis_ref }}).

          {% for a in outputs.assess.vars.new_high_critical %}
          - [#{{ a.number }}]({{ a.html_url }}) {{ a.rule }} ({{ a.severity }}) in `{{ a.path }}`
          {% endfor %}

          Execution: {{ execution.id }}

          Fix or dismiss the alerts, then close this issue. The gate baseline was not advanced, so the next run still sees these alerts as new.
        labels:
          - security
          - codeql
      - id: alert_slack
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Tell the team how many new high or critical alerts appeared and that a GitHub issue is waiting.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "CodeQL gate found {{ outputs.assess.vars.new_high_critical_count }} new high/critical alert(s) in {{ inputs.repository }} (branch {{ inputs.branch }}): {{ outputs.assess.vars.new_summary }}. A GitHub issue has been opened. Execution {{ execution.id }}."
          }
      - id: fail_the_run
        type: io.kestra.plugin.core.execution.Fail
        description: Fail the execution so whatever pipeline watches this gate sees red instead of a quiet success.
        errorMessage: "CodeQL gate found {{ outputs.assess.vars.new_high_critical_count }} new high/critical alert(s) in {{ inputs.repository }}."
    else:
      - id: advance_baseline
        type: io.kestra.plugin.core.kv.Set
        description: A clean run stores the current high and critical alert numbers, so only genuinely new findings count as regressions next time.
        key: "codeql_alerts_{{ inputs.repository }}"
        kvType: JSON
        overwrite: true
        value: |
          {
            "repository": "{{ inputs.repository }}",
            "recorded_at": "{{ now() }}",
            "known_numbers": {{ outputs.assess.vars.current_numbers | toJson }}
          }
      - id: log_clean
        type: io.kestra.plugin.core.log.Log
        description: Record the all-clear so the execution history doubles as an audit trail of gate runs.
        message: "CodeQL gate passed for {{ inputs.repository }}: {{ outputs.assess.vars.open_high_critical }} open high/critical, {{ outputs.assess.vars.new_high_critical_count }} new, first_run={{ outputs.assess.vars.first_run }}."

errors:
  - id: alert_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alert when the gate itself cannot run, because a dead gate is indistinguishable from a clean repository.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "CodeQL gate FAILED in flow {{ flow.id }} (execution {{ execution.id }}). Alerts were NOT assessed. Verify the GITHUB_TOKEN secret and code-scanning access on {{ inputs.repository }}."
      }

outputs:
  - id: verdict
    type: STRING
    description: Gate result, either pass or regression.
    value: "{{ outputs.assess.vars.verdict }}"
  - id: total_open
    type: INT
    description: Number of open code-scanning alerts of every severity.
    value: "{{ outputs.assess.vars.total_open }}"
  - id: new_high_critical
    type: INT
    description: Number of new high or critical alerts since the last clean baseline.
    value: "{{ outputs.assess.vars.new_high_critical_count }}"
  - id: new_alerts
    type: JSON
    description: Structured list of the new high and critical alerts with rule, severity, path, and link.
    value: "{{ outputs.assess.vars.new_high_critical }}"

extend:
  title: CodeQL Alert Regression Gate with Baseline Tracking
  metaTitle: CodeQL SARIF Alert Regression Gate in Kestra
  shortDescription: Fetch open CodeQL code-scanning alerts, diff high and critical findings against a stored baseline, and escalate regressions as a GitHub issue, a Slack alert, and a failed run.
  metaDescription: "Track CodeQL regressions in Kestra: diff open high/critical code-scanning alerts against a stored baseline and escalate new findings to GitHub and Slack."
  description: |
    CodeQL findings have a way of piling up: a repository turns on default setup, six months later the security tab holds hundreds of open alerts, and nobody can tell which of them shipped this week. This blueprint treats the alert list as a regression signal rather than a backlog. A webhook fires when an analysis completes, the GitHub code-scanning API returns every open alert, and a Python step filters those alerts to high and critical severity and compares them against the numbers recorded by the last clean run. New findings escalate three ways at once: a labeled GitHub issue with direct links to each alert, a Slack notice, and a failed execution. A clean run stores the current alert set in Kestra's KV store, so the baseline only moves when the gate is green and a regression can never quietly become the new normal.

    ## How it works

    1. The `on_analysis_webhook` trigger (`io.kestra.plugin.core.trigger.Webhook`) exposes a keyed URL for your GitHub hook or CI to POST to when an analysis completes or on push. The `daily_sweep` Schedule trigger ships disabled as a nightly safety net.
    2. `fetch_open_alerts` (`io.kestra.plugin.core.http.Request`) calls `GET /repos/{owner}/{repo}/code-scanning/alerts?state=open` with an `Authorization: Bearer` header built from the `GITHUB_TOKEN` secret and the `application/vnd.github+json` Accept header.
    3. `fetch_latest_analysis` (`io.kestra.plugin.core.http.Request`, `allowFailure: true`) pulls the newest entry from `/code-scanning/analyses` for triage context: which tool ran and on which ref.
    4. `read_baseline` (`io.kestra.plugin.core.kv.Get`) loads the alert numbers stored by the previous clean run with `errorOnMissing: false`, so the very first run absorbs existing alerts into the baseline instead of blocking the world.
    5. `assess` (`io.kestra.plugin.scripts.python.Script`) filters alerts to `security_severity_level` critical or high (checking the rule as a fallback), splits them into new versus baseline-known, and emits `verdict`, counts, and a structured `new_high_critical` list through the outputs protocol.
    6. `gate` (`io.kestra.plugin.core.flow.If`) branches on the blocked verdict. Over threshold, `open_issue` (`io.kestra.plugin.github.issues.Create`) opens an issue labeled `security` and `codeql` listing every new alert with its link, `alert_slack` posts the count and summary, and `fail_the_run` (`io.kestra.plugin.core.execution.Fail`) turns the execution red. Under threshold, `advance_baseline` (`io.kestra.plugin.core.kv.Set`) records the current high and critical numbers and `log_clean` writes the all-clear.
    7. The `errors` block alerts Slack when the gate itself breaks, because a dead gate looks exactly like a clean repository.

    ## What you get

    - New high and critical CodeQL findings caught the day they appear instead of at the next audit.
    - Regression semantics: pre-existing alerts are counted and reported but do not block, so the gate is adoptable on day one.
    - Escalation where engineers already work: a labeled GitHub issue with alert links, plus a Slack ping.
    - A baseline stored in Kestra KV that only advances on a green run.
    - Typed outputs (`verdict`, `total_open`, `new_high_critical`) a parent pipeline can branch on, and a dated execution history for every gate run.

    ## Who it's for

    - Security engineers who need a "no new high or critical findings" policy enforced on every push and every night.
    - Platform teams already running Kestra who want the security tab to stop being a surprise.
    - Repository owners adopting code scanning who need a gate that does not fail on day one for alerts that predate the gate.

    ## Why orchestrate this with Kestra

    Fetching a GitHub API list is easy; remembering what was there yesterday is the hard part. Kestra supplies the durable KV store for the baseline, the branch that only advances it on a green run, the keyed webhook that CI can call without extra infrastructure, and typed outputs a release pipeline can consume. The same gate written as a cron script becomes a state file nobody trusts, an alert channel nobody watches, and a check everyone bypasses after the first noisy week. Because every run is a dated execution with recorded inputs and outputs, answering when a given alert number appeared takes one look at the execution history.

    ## Prerequisites

    - A GitHub repository with code scanning enabled (default setup or Advanced setup), and a token that can read code-scanning alerts (classic PAT scope `security_events`, or fine-grained Code scanning alerts read plus Issues write for the escalation issue).
    - A Kestra KV store available to the namespace, since the baseline lives there.
    - A Slack incoming webhook for regression and failure alerts.
    - The `python:3.12-slim` image pullable by the worker for the assess step, or swap `containerImage` for a process task runner if Python is on the host.

    ### Secrets

    - `GITHUB_TOKEN`: token used to read the code-scanning alerts API and to open the escalation issue.
    - `CODEQL_WEBHOOK_KEY`: key segment guarding the webhook URL, anyone with it can trigger a gate run, so treat it as a secret.
    - `SLACK_WEBHOOK_URL`: Slack incoming webhook URL.

    ## Quick start

    1. Add the three secrets above to your Kestra namespace and make sure the KV store is enabled.
    2. Set `repository` to the `owner/repo` you want gated.
    3. Point your GitHub webhook (push events or code scanning analysis) at `/api/v1/{tenant}/executions/webhook/{namespace}/github-codeql-sarif-gate/CODEQL_WEBHOOK_KEY`, or trigger the webhook manually. For the nightly sweep, enable the shipped Schedule trigger (cron `0 6 * * *`).
    4. Run the flow once to record the starting baseline: the first run always passes and absorbs existing high or critical alerts.
    5. Introduce a new high or critical alert (or wait for one) and confirm the GitHub issue, the Slack notice, and the failed execution.

    ## How to extend

    - Fan the gate across every repository by wrapping this flow in a parent that calls it as a subflow per `owner/repo`.
    - Raise `alert_threshold` above zero to tolerate a small burn-down window while the existing backlog is fixed.
    - Mirror regressions into your ticket system with `io.kestra.plugin.jira.issues.Create` next to `open_issue`.
    - Derive `repository` from the webhook payload with `{{ fromJson(trigger.body).repository.full_name }}` for multi-repo setups.
    - Widen the severity set in the `assess` script to include medium alerts, or filter to one CodeQL query by rule id.
    - Snapshot each regression list to object storage with `io.kestra.plugin.aws.s3.Upload` for long-term trend reporting.

    ## Links

    - [GitHub code scanning documentation](https://docs.github.com/en/code-security/code-scanning)
    - [Kestra GitHub plugin](https://kestra.io/plugins/plugin-github)
    - [Kestra KV store](https://kestra.io/docs/concepts/kv-store)
  tags:
    - Infrastructure
    - Core
  subTags:
    - Policy & Compliance
    - CI/CD & Deployment
  ee: false
  demo: false
