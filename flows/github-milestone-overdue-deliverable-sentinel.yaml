id: github-milestone-overdue-deliverable-sentinel
namespace: company.devops

inputs:
  - id: github_owner
    type: STRING
    displayName: GitHub Organization / Owner
    defaults: "kestra-io"
    description: GitHub organization or username owning the repository.

  - id: github_repository
    type: STRING
    displayName: GitHub Repository
    defaults: "kestra"
    description: GitHub repository slug to monitor for overdue milestones.

  - id: max_overdue_milestones
    type: INT
    displayName: Maximum Tolerable Overdue Milestones
    defaults: 0
    description: Threshold of overdue open milestones permitted before triggering an alert.

  - id: milestone_batch_limit
    type: INT
    displayName: Milestone Batch Limit
    defaults: 15
    description: Maximum number of open milestones to retrieve and inspect per run.

triggers:
  - id: weekly_milestone_sweep
    type: io.kestra.plugin.core.trigger.Schedule
    description: Weekly Monday morning audit at 09:00 UTC to identify open milestones past their due date with unresolved issues. Shipped disabled by default.
    cron: "0 9 * * 1"
    disabled: true

tasks:
  - id: fetch_open_milestones
    type: io.kestra.plugin.graphql.Request
    description: Query GitHub GraphQL API for open milestones, due dates, and open issue counts.
    uri: "https://api.github.com/graphql"
    headers:
      Authorization: "Bearer {{ secret('GITHUB_TOKEN') }}"
      Content-Type: "application/json"
      User-Agent: "Kestra-GitHub-Milestone-Sentinel/1.0"
    failOnGraphQLErrors: false
    allowFailed: true
    query: |
      query {
        repository(owner: "{{ inputs.github_owner }}", name: "{{ inputs.github_repository }}") {
          milestones(states: OPEN, first: {{ inputs.milestone_batch_limit }}, orderBy: {field: DUE_DATE, direction: ASC}) {
            nodes {
              number
              title
              dueOn
              url
              issues(states: OPEN) {
                totalCount
              }
              closedIssues: issues(states: CLOSED) {
                totalCount
              }
            }
          }
        }
      }

  - id: evaluate_overdue_milestones
    type: io.kestra.plugin.scripts.python.Script
    description: Evaluate milestone target due dates against current UTC time and isolate overdue milestones with unresolved issues.
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    env:
      MILESTONES_DATA: "{{ outputs.fetch_open_milestones.body | toJson }}"
    script: |
      import os
      import json
      from datetime import datetime, timezone

      raw_data = json.loads(os.environ.get("MILESTONES_DATA", "{}"))
      milestones = ((raw_data.get("repository") or {}).get("milestones") or {}).get("nodes") or []
      now = datetime.now(timezone.utc)

      overdue = []
      for m in milestones:
          due_str = m.get("dueOn")
          if not due_str:
              continue

          try:
              due_dt = datetime.fromisoformat(due_str.replace("Z", "+00:00"))
          except Exception:
              continue

          open_count = ((m.get("issues") or {}).get("totalCount") or 0)
          closed_count = ((m.get("closedIssues") or {}).get("totalCount") or 0)
          total_count = open_count + closed_count
          completion_pct = int(round((closed_count / total_count) * 100)) if total_count > 0 else 0

          # Check if milestone is overdue and still has open issues
          if due_dt < now and open_count > 0:
              days_overdue = (now - due_dt).days
              overdue.append({
                  "number": m.get("number"),
                  "title": m.get("title"),
                  "url": m.get("url"),
                  "due_date": due_str[:10],
                  "days_overdue": days_overdue,
                  "open_issues": open_count,
                  "closed_issues": closed_count,
                  "completion_pct": completion_pct
              })

      summary_lines = [
          f"• *{m['title']}* (Overdue by {m['days_overdue']} days since {m['due_date']} - {m['open_issues']} issues unresolved, {m['completion_pct']}% complete) - <{m['url']}|View Milestone>"
          for m in overdue
      ]
      summary_text = "\\n".join(summary_lines) if summary_lines else "Zero overdue milestones detected."

      output_payload = {
          "overdue_count": len(overdue),
          "overdue_milestones": overdue,
          "summary_text": summary_text
      }

      print(f'::{"outputs": {json.dumps(output_payload)}}::')

  - id: evaluate_milestone_risk
    type: io.kestra.plugin.core.flow.If
    description: Check whether overdue milestones exceed tolerance threshold.
    condition: "{{ outputs.evaluate_overdue_milestones.vars.overdue_count > inputs.max_overdue_milestones }}"
    then:
      - id: alert_overdue_milestones
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatch high-priority Slack notification itemizing overdue milestones with remaining issue counts.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "📅 *GITHUB RELEASE RISK: Overdue Milestones with Unresolved Issues* 📅\n\n*Repository:* `{{ inputs.github_owner }}/{{ inputs.github_repository }}`\n*Overdue Milestones Count:* {{ outputs.evaluate_overdue_milestones.vars.overdue_count }}\n\n*Milestones Past Due Date:*\n{{ outputs.evaluate_overdue_milestones.vars.summary_text }}\n\n*Execution ID:* {{ execution.id }}\n*Action Required:* Maintainers please close completed items, reassign remaining issues, or adjust target delivery dates."
          }
    else:
      - id: log_milestones_clean
        type: io.kestra.plugin.core.log.Log
        description: Log clean operational status when zero milestones are overdue with open issues.
        message: "HEALTHY: All open milestones in {{ inputs.github_owner }}/{{ inputs.github_repository }} are within schedule."

  - id: log_audit_summary
    type: io.kestra.plugin.core.log.Log
    description: Record final audit metrics for milestone deliverable governance.
    message: "GitHub milestone audit finished for {{ inputs.github_owner }}/{{ inputs.github_repository }}. Overdue milestones count: {{ outputs.evaluate_overdue_milestones.vars.overdue_count }}."

errors:
  - id: alert_on_github_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alert Engineering Operations if GitHub GraphQL API returns an error or token expires.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "⚠️ *GitHub Milestone Sentinel Error*: Execution `{{ execution.id }}` failed to query repository `{{ inputs.github_owner }}/{{ inputs.github_repository }}`. Check GITHUB_TOKEN scope and validity."
      }

outputs:
  - id: status
    type: STRING
    value: "{{ outputs.evaluate_overdue_milestones.vars.overdue_count > inputs.max_overdue_milestones ? 'OVERDUE_MILESTONES_DETECTED' : 'HEALTHY' }}"
  - id: overdue_count
    type: INT
    value: "{{ outputs.evaluate_overdue_milestones.vars.overdue_count }}"

extend:
  title: GitHub milestone overdue deliverable and target date sentinel
  metaTitle: GitHub Milestone Overdue Sentinel | Kestra
  shortDescription: Weekly governance sentinel that queries GitHub GraphQL API for open milestones that have passed their due dates with unresolved issues.
  metaDescription: Audit GitHub milestones via GraphQL API for passed due dates with unresolved open issues and alert engineering teams in Slack to resolve sprint blockers.
  description: |
    Maintain high delivery discipline and ensure sprint or quarterly release commitments do not quietly slip past their target deadlines. In open-source and commercial development teams using GitHub Milestones, releases frequently reach and pass their scheduled `dueOn` date with multiple unresolved issues remaining because blockers, scope creep, or deferred bugs were not surfaced to the core maintainers. This blueprint executes a weekly Monday morning audit via the GitHub GraphQL API (`io.kestra.plugin.graphql.Request`), isolates milestones past their target date with remaining open issues, and dispatches an actionable Slack notification itemizing overdue iterations and completion percentages.

    ## How it works
    1. A `Schedule` trigger executes an audit every Monday morning at 09:00 UTC (shipped disabled by default).
    2. Task `fetch_open_milestones` queries `https://api.github.com/graphql` using a GitHub access token (`GITHUB_TOKEN`). The GraphQL query retrieves open milestones ordered by due date, requesting milestone titles, URLs, target due dates, and both open and closed issue counts.
    3. Task `evaluate_overdue_milestones` (`io.kestra.plugin.scripts.python.Script`) calculates date deltas between current UTC time and each milestone's `dueOn` timestamp:
       - Milestones where `dueOn < now` and `issues.totalCount > 0` are flagged as overdue.
       - The task formats a clickable digest and exports structured metrics via Kestra's stdout protocol.
    4. Task `evaluate_milestone_risk` (`io.kestra.plugin.core.flow.If`) posts an itemized Slack alert if any overdue milestones exist, or logs a healthy message if all milestones are on schedule.
    5. Top-level `errors` handler catches network issues or token authentication failures.

    ## What you get
    - Continuous weekly visibility into overdue release commitments across GitHub repositories.
    - Elimination of forgotten, lingering milestones with unresolved issues.
    - Direct Slack notifications linking maintainers straight to overdue iterations.
    - Automated progress tracking based on closed versus open issue ratios.

    ## Who it's for
    - Engineering Managers and Team Leads tracking sprint commitments on GitHub.
    - Open Source Maintainers coordinating versioned releases and roadmap milestones.
    - Release Managers monitoring cross-functional software deliverables.

    ## Why orchestrate this with Kestra
    Checking GitHub Milestones manually across multiple repositories is easily forgotten during busy sprints. Kestra provides automated, scheduled orchestration that queries GitHub's GraphQL API directly, evaluates target dates mathematically in Python, and posts rich Slack notifications with zero custom webhook infrastructure.

    ## Prerequisites
    - A GitHub personal access token (classic or fine-grained) with `repo` or `issues:read` permissions.
    - A Slack Incoming Webhook URL.

    ### Secrets
    - `GITHUB_TOKEN`: GitHub personal access token passed in the `Authorization: Bearer` header.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL used to receive overdue milestone alerts.

    ## Quick start
    1. Store your GitHub token and Slack webhook in Kestra Secrets (`GITHUB_TOKEN` and `SLACK_WEBHOOK_URL`).
    2. Set `github_owner` and `github_repository` inputs to your target repository (e.g. `kestra-io` and `kestra`).
    3. Run a manual execution from the Kestra UI to verify that the query successfully inspects milestones.
    4. Enable the `weekly_milestone_sweep` schedule to activate automated weekly milestone monitoring.

    ## How to extend
    - Add an automated comment to open milestone issues reminding assignees of the overdue release target.
    - Automatically reschedule remaining open issues to the next upcoming milestone using a GraphQL mutation.
    - Push milestone slip duration metrics to Datadog or Prometheus to track release predictability over time.

    ## Links
    - [GitHub GraphQL API: Milestone](https://docs.github.com/en/graphql/reference/objects#milestone)
    - [Kestra GraphQL Plugin](https://kestra.io/plugins/plugin-graphql)
    - [Kestra Python Script Task](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Notification Plugin](https://kestra.io/plugins/plugin-slack)
  tags:
    - Infrastructure
    - Business
  subTags:
    - CI/CD & Deployment
    - Reporting & Digests
  ee: false
  demo: false
