id: couchbase-slow-query-missing-index-advisor-guard
namespace: company.team

concurrency:
  limit: 1
  behavior: QUEUE

inputs:
  - id: connection_string
    type: STRING
    defaults: couchbase://localhost
  - id: username
    type: SECRET
    defaults: "{{ secret('COUCHBASE_USERNAME') }}"
  - id: password
    type: SECRET
    defaults: "{{ secret('COUCHBASE_PASSWORD') }}"
  - id: bucket
    type: STRING
    defaults: application
  - id: scope
    type: STRING
    defaults: _default
  - id: collection
    type: STRING
    defaults: _default
  - id: equality_field
    type: STRING
    defaults: country
  - id: projection_field
    type: STRING
    defaults: city
  - id: equality_value
    type: STRING
    defaults: France
  - id: result_limit
    type: INT
    defaults: 100
  - id: index_name
    type: STRING
    defaults: lookup_cover_guard
  - id: dry_run
    type: BOOL
    defaults: true
  - id: auto_remediate
    type: BOOL
    defaults: false

tasks:
  - id: validate_inputs
    type: io.kestra.plugin.core.flow.If
    condition: >-
      {{ inputs.bucket | length < 1 or inputs.bucket | length > 100
      or inputs.bucket | replace({'[A-Za-z0-9_-]': ''}, regexp=true) | length > 0
      or inputs.scope | length < 1 or inputs.scope | length > 100
      or inputs.scope | replace({'[A-Za-z0-9_-]': ''}, regexp=true) | length > 0
      or inputs.collection | length < 1 or inputs.collection | length > 100
      or inputs.collection | replace({'[A-Za-z0-9_-]': ''}, regexp=true) | length > 0
      or inputs.equality_field | length < 1 or inputs.equality_field | length > 64
      or inputs.equality_field | replace({'[A-Za-z0-9_]': ''}, regexp=true) | length > 0
      or inputs.projection_field | length < 1 or inputs.projection_field | length > 64
      or inputs.projection_field | replace({'[A-Za-z0-9_]': ''}, regexp=true) | length > 0
      or inputs.equality_field == inputs.projection_field
      or inputs.equality_value | length > 256
      or inputs.index_name | length < 1 or inputs.index_name | length > 64
      or inputs.index_name | replace({'[A-Za-z0-9_-]': ''}, regexp=true) | length > 0
      or inputs.index_name | slice(0, 1) | replace({'[A-Za-z]': ''}, regexp=true) | length > 0
      or inputs.result_limit < 1 or inputs.result_limit > 100 }}
    then:
      - id: invalid_inputs
        type: io.kestra.plugin.core.execution.Fail
        errorMessage: Invalid lookup contract. Use bounded plain identifiers, distinct fields, a value up to 256 characters and LIMIT 1 to 100.

  - id: explain_lookup
    type: io.kestra.plugin.couchbase.Query
    timeout: PT30S
    connectionString: "{{ inputs.connection_string }}"
    username: "{{ inputs.username }}"
    password: "{{ inputs.password }}"
    fetchType: FETCH
    query: >-
      EXPLAIN SELECT d.`{{ inputs.projection_field }}` AS result
      FROM `{{ inputs.bucket }}`.`{{ inputs.scope }}`.`{{ inputs.collection }}` AS d
      WHERE d.`{{ inputs.equality_field }}` = {{ inputs.equality_value | toJson }}
      AND d.`{{ inputs.projection_field }}` IS NOT MISSING LIMIT {{ inputs.result_limit }}

  - id: inspect_indexes
    type: io.kestra.plugin.couchbase.Query
    timeout: PT30S
    connectionString: "{{ inputs.connection_string }}"
    username: "{{ inputs.username }}"
    password: "{{ inputs.password }}"
    fetchType: FETCH
    query: >-
      SELECT idx.name, idx.state, idx.index_key,
      (idx.index_key = ["`{{ inputs.equality_field }}`", "`{{ inputs.projection_field }}`"]
      AND IFMISSING(idx.is_primary, false) = false AND idx.`using` = "gsi"
      AND IFMISSING(idx.`condition`, "") = "" AND IFMISSING(idx.`partition`, "") = "") AS compatible
      FROM system:indexes AS idx
      WHERE IFMISSING(idx.bucket_id, idx.keyspace_id) = {{ inputs.bucket | toJson }}
      AND IFMISSING(idx.scope_id, "_default") = {{ inputs.scope | toJson }}
      AND (CASE WHEN idx.bucket_id IS MISSING THEN "_default" ELSE idx.keyspace_id END) = {{ inputs.collection | toJson }}
      ORDER BY idx.name LIMIT 65

  - id: classify_plan
    type: io.kestra.plugin.core.output.OutputValues
    values:
      valid: >-
        {{ outputs.explain_lookup.rows | toJson | jq('length == 1 and (.[0].plan | type) == "object"') | first }}
      covered: >-
        {{ outputs.explain_lookup.rows | toJson | jq('[.[0].plan | .. | select(type == "object") | select(."#operator" == "IndexScan3" or ."#operator" == "IndexScan2") | select((.covers // [] | length) >= 2)] | length > 0') | first }}
      document_access: >-
        {{ outputs.explain_lookup.rows | toJson | jq('[.[0].plan | .. | select(type == "object") | select(."#operator" == "Fetch" or ."#operator" == "PrimaryScan3" or ."#operator" == "PrimaryScan2" or ."#operator" == "PrimaryScan" or ."#operator" == "SequentialScan")] | length > 0') | first }}

  - id: contract_guard
    type: io.kestra.plugin.core.flow.If
    condition: >-
      {{ not outputs.classify_plan.values.valid or outputs.inspect_indexes.rows | length > 64
      or (outputs.inspect_indexes.rows | toJson | jq('[.[] | select(.name == "' ~ inputs.index_name ~ '") | select(.compatible != true or (.state != "online" and .state != "building" and .state != "pending"))] | length') | first) > 0 }}
    then:
      - id: refuse_contract
        type: io.kestra.plugin.core.execution.Fail
        errorMessage: Plan unavailable, catalog exceeds 64 indexes or the reserved index name has an incompatible definition/state. No index was created.

  - id: report
    type: io.kestra.plugin.core.log.Log
    message: >-
      Lookup coverage={{ outputs.classify_plan.values.covered }} document_access={{ outputs.classify_plan.values.document_access }}.
      Proposed index {{ inputs.index_name }} on {{ inputs.bucket }}.{{ inputs.scope }}.{{ inputs.collection }}
      ({{ inputs.equality_field }}, {{ inputs.projection_field }}). dry_run={{ inputs.dry_run }} auto_remediate={{ inputs.auto_remediate }}.

  - id: repair_missing_coverage
    type: io.kestra.plugin.core.flow.If
    condition: "{{ (not outputs.classify_plan.values.covered or outputs.classify_plan.values.document_access) and inputs.auto_remediate and not inputs.dry_run }}"
    then:
      - id: approve_index
        type: io.kestra.plugin.core.flow.Pause
        onResume:
          - id: approved
            type: BOOL
            required: false
            description: Approve one additive composite index within the agreed index maintenance window.
      - id: approved_change
        type: io.kestra.plugin.core.flow.If
        condition: "{{ outputs.approve_index.onResume.approved ?? false }}"
        then:
          - id: reread_plan
            type: io.kestra.plugin.couchbase.Query
            timeout: PT30S
            connectionString: "{{ inputs.connection_string }}"
            username: "{{ inputs.username }}"
            password: "{{ inputs.password }}"
            fetchType: FETCH
            query: >-
              EXPLAIN SELECT d.`{{ inputs.projection_field }}` AS result
              FROM `{{ inputs.bucket }}`.`{{ inputs.scope }}`.`{{ inputs.collection }}` AS d
              WHERE d.`{{ inputs.equality_field }}` = {{ inputs.equality_value | toJson }}
              AND d.`{{ inputs.projection_field }}` IS NOT MISSING LIMIT {{ inputs.result_limit }}
          - id: reread_indexes
            type: io.kestra.plugin.couchbase.Query
            timeout: PT30S
            connectionString: "{{ inputs.connection_string }}"
            username: "{{ inputs.username }}"
            password: "{{ inputs.password }}"
            fetchType: FETCH
            query: >-
              SELECT idx.name, idx.state,
              (idx.index_key = ["`{{ inputs.equality_field }}`", "`{{ inputs.projection_field }}`"]
              AND IFMISSING(idx.is_primary, false) = false AND idx.`using` = "gsi"
              AND IFMISSING(idx.`condition`, "") = "" AND IFMISSING(idx.`partition`, "") = "") AS compatible
              FROM system:indexes AS idx
              WHERE IFMISSING(idx.bucket_id, idx.keyspace_id) = {{ inputs.bucket | toJson }}
              AND IFMISSING(idx.scope_id, "_default") = {{ inputs.scope | toJson }}
              AND (CASE WHEN idx.bucket_id IS MISSING THEN "_default" ELSE idx.keyspace_id END) = {{ inputs.collection | toJson }}
              ORDER BY idx.name LIMIT 65
          - id: stale_contract_guard
            type: io.kestra.plugin.core.flow.If
            condition: >-
              {{ outputs.reread_plan.rows | length != 1 or outputs.reread_indexes.rows | length > 64
              or (outputs.reread_indexes.rows | toJson | jq('[.[] | select(.name == "' ~ inputs.index_name ~ '") | select(.compatible != true or (.state != "online" and .state != "building" and .state != "pending"))] | length') | first) > 0 }}
            then:
              - id: stale_contract
                type: io.kestra.plugin.core.execution.Fail
                errorMessage: Catalog or index contract changed during approval. No index was created.
          - id: still_missing
            type: io.kestra.plugin.core.flow.If
            condition: >-
              {{ (outputs.reread_plan.rows | toJson | jq('[.[0].plan | .. | select(type == "object") | select(."#operator" == "IndexScan3" or ."#operator" == "IndexScan2") | select((.covers // [] | length) >= 2)] | length') | first) == 0
              or (outputs.reread_plan.rows | toJson | jq('[.[0].plan | .. | select(type == "object") | select(."#operator" == "Fetch" or ."#operator" == "PrimaryScan3" or ."#operator" == "PrimaryScan2" or ."#operator" == "PrimaryScan" or ."#operator" == "SequentialScan")] | length') | first) > 0 }}
            then:
              - id: create_if_absent
                type: io.kestra.plugin.core.flow.If
                condition: "{{ (outputs.reread_indexes.rows | toJson | jq('[.[] | select(.name == \"' ~ inputs.index_name ~ '\")] | length') | first) == 0 }}"
                then:
                  - id: create_covering_index
                    type: io.kestra.plugin.couchbase.Query
                    timeout: PT30S
                    connectionString: "{{ inputs.connection_string }}"
                    username: "{{ inputs.username }}"
                    password: "{{ inputs.password }}"
                    fetchType: NONE
                    query: >-
                      CREATE INDEX `{{ inputs.index_name }}` IF NOT EXISTS
                      ON `{{ inputs.bucket }}`.`{{ inputs.scope }}`.`{{ inputs.collection }}`
                      (`{{ inputs.equality_field }}`, `{{ inputs.projection_field }}`) USING GSI WITH {"defer_build":false}
              - id: wait_online
                type: io.kestra.plugin.core.flow.LoopUntil
                condition: "{{ outputs.poll_index.rows[0].ready == 1 }}"
                failOnMaxReached: true
                checkFrequency:
                  interval: PT3S
                  maxDuration: PT1M
                  maxIterations: 20
                tasks:
                  - id: poll_index
                    type: io.kestra.plugin.couchbase.Query
                    timeout: PT30S
                    connectionString: "{{ inputs.connection_string }}"
                    username: "{{ inputs.username }}"
                    password: "{{ inputs.password }}"
                    fetchType: FETCH
                    query: >-
                      SELECT COUNT(*) AS ready FROM system:indexes AS idx
                      WHERE IFMISSING(idx.bucket_id, idx.keyspace_id) = {{ inputs.bucket | toJson }}
                      AND IFMISSING(idx.scope_id, "_default") = {{ inputs.scope | toJson }}
                      AND (CASE WHEN idx.bucket_id IS MISSING THEN "_default" ELSE idx.keyspace_id END) = {{ inputs.collection | toJson }}
                      AND idx.name = {{ inputs.index_name | toJson }} AND idx.state = "online"
                      AND idx.index_key = ["`{{ inputs.equality_field }}`", "`{{ inputs.projection_field }}`"]
                      AND IFMISSING(idx.`condition`, "") = "" AND IFMISSING(idx.`partition`, "") = ""
                      AND idx.`using` = "gsi" AND IFMISSING(idx.is_primary, false) = false
          - id: verify_plan
            type: io.kestra.plugin.couchbase.Query
            timeout: PT30S
            connectionString: "{{ inputs.connection_string }}"
            username: "{{ inputs.username }}"
            password: "{{ inputs.password }}"
            fetchType: FETCH
            query: >-
              EXPLAIN SELECT d.`{{ inputs.projection_field }}` AS result
              FROM `{{ inputs.bucket }}`.`{{ inputs.scope }}`.`{{ inputs.collection }}` AS d
              WHERE d.`{{ inputs.equality_field }}` = {{ inputs.equality_value | toJson }}
              AND d.`{{ inputs.projection_field }}` IS NOT MISSING LIMIT {{ inputs.result_limit }}
          - id: recovery_gate
            type: io.kestra.plugin.core.flow.If
            condition: >-
              {{ outputs.verify_plan.rows | length != 1
              or (outputs.verify_plan.rows | toJson | jq('[.[0].plan | .. | select(type == "object") | select(."#operator" == "IndexScan3" or ."#operator" == "IndexScan2") | select((.covers // [] | length) >= 2)] | length') | first) == 0
              or (outputs.verify_plan.rows | toJson | jq('[.[0].plan | .. | select(type == "object") | select(."#operator" == "Fetch" or ."#operator" == "PrimaryScan3" or ."#operator" == "PrimaryScan2" or ."#operator" == "PrimaryScan" or ."#operator" == "SequentialScan")] | length') | first) > 0 }}
            then:
              - id: recovery_failed
                type: io.kestra.plugin.core.execution.Fail
                errorMessage: The lookup still lacks a covering plan without primary scan or document Fetch. Inspect the retained index and recover through the next read-first run.
            else:
              - id: coverage_restored
                type: io.kestra.plugin.core.log.Log
                message: The same unhinted lookup now uses a covering index without primary scan or document Fetch.
        else:
          - id: approval_declined
            type: io.kestra.plugin.core.log.Log
            message: Approval was not granted. No CREATE INDEX was issued.

triggers:
  - id: daily_safe_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 7 * * *"
    disabled: true
    inputs:
      dry_run: true
      auto_remediate: false

errors:
  - id: notify_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: >-
      {{ {"text": "Couchbase lookup coverage repair failed. Execution " ~ execution.id ~ ". Inspect the query contract, index state and recovery plan before retrying."} | toJson }}

extend:
  title: Repair missing Couchbase covering indexes for a known lookup
  metaTitle: Couchbase Lookup Covering Index Repair
  shortDescription: Explain one fixed equality lookup, approve a two-field GSI and fail unless the same lookup becomes covered without document Fetch.
  metaDescription: Repair a known Couchbase lookup with one approved composite GSI. Re-read the contract and require a covered query plan without document Fetch.
  tags:
    - Data
    - Infrastructure
  subTags:
    - Day 2 Operations
    - Monitoring & Alerting
  ee: false
  demo: false
  description: |
    ## Safety
    This Community Edition flow explains a reviewed equality lookup that projects one
    other field. It creates one composite GSI when the plan lacks coverage. It does not
    invoke Enterprise ADVISOR, replay logged SQL, execute the lookup or drop indexes.

    | Guard | What it stops |
    |---|---|
    | Plain identifiers, bounded string value and LIMIT | Executable SQL supplied as inputs |
    | Safe flags plus explicit approval | Unreviewed index creation |
    | Fresh plan and catalog | Acting on an already repaired or conflicting proposal |
    | Reserved name and IF NOT EXISTS | Duplicate same-name creation |
    | Final coverage gate | An online index passing while documents are still fetched |

    ## How it works
    Native Query explains a fixed SELECT filtering equality_field by a JSON-quoted
    string and projecting projection_field, excluding missing projected values.
    A covered IndexScan without Fetch or primary scan is healthy; latency is not a detector.

    After approval the flow re-reads both. It skips a newly covered plan and rejects
    incompatible names or catalogs over 64 entries. It creates `(equality_field,
    projection_field)` with defer_build false if absent. Building indexes are polled;
    deferred/offline names need separate lifecycle recovery. Polling is bounded by one
    minute and 20 iterations. Final EXPLAIN must show coverage without document access.

    ## What you get
    One approved additive repair with existing indexes and data retained. Errors go to Slack.

    ## Who it's for
    Operators with a reviewed two-field lookup that needs a covering path.

    ## Why orchestrate this with Kestra
    Approval, fresh eligibility and recovery are recorded together. Read-first retries
    retain completed additive work.

    ## Tested end to end
    Kestra 2.0.6 and 2.0.5 ran against CE 7.6.2, including a second fresh cluster.
    Independent reads showed 20,000 document fetches become zero, preserving 20 results
    and 20,000 documents (4,566,691 canonical bytes). Dry run, decline, repair, refused
    CREATE, retry, approval races, invalid inputs, empty lookups and a 65-index catalog
    were exercised. A refused CREATE failed; recovery succeeded after restoring write access.

    ## Prerequisites
    Query and Index services with a working GSI storage mode. Enforce a Query Service
    timeout at most 15 seconds: native Query has no request timeout option; tasks also
    have 30-second deadlines. CE tests use bucket_full_access on the target bucket,
    the minimum available role that supports these operations.

    ### Secrets
    COUCHBASE_USERNAME and COUCHBASE_PASSWORD back SECRET inputs. SLACK_WEBHOOK_URL is
    used by errors.

    ### Inputs
    connection_string; bucket/scope/collection (plain names, up to 100 characters);
    two distinct top-level fields (up to 64); equality_value (string, up to 256);
    result_limit (1 to 100); index_name (letter-led plain name, up to 64).
    dry_run defaults true and auto_remediate false.

    ## Quick start
    Configure secrets and timeout. Select the collection/fields and run dry. Reserve
    index_name and freeze other index DDL and collection replacement for the approved
    window. Rerun with dry_run false and auto_remediate true, then approve. The daily
    schedule ships disabled in safe mode.

    ## How to extend
    Extend the fixed query and index contract together for another reviewed lookup.
    Limits: no arbitrary SQL, joins, nested fields or workload-wide recommendations.
    Coverage does not promise a latency target. QUEUE limits active runs but Pause releases
    its slot; post-approval re-reads and idempotent names handle sequential approvals.
    Other DDL writers must honor the maintenance contract. A change after the re-read
    remains a race. Builds can continue after timeout; inspect state before retrying.

    ## Links
    - [Covering indexes](https://docs.couchbase.com/server/7.6/n1ql/n1ql-language-reference/covering-indexes.html)
    - [CREATE INDEX](https://docs.couchbase.com/server/7.6/n1ql/n1ql-language-reference/createindex.html)
    - [EXPLAIN](https://docs.couchbase.com/server/7.6/n1ql/n1ql-language-reference/explain.html)
