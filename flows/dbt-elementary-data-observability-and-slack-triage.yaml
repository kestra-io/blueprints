id: dbt-elementary-data-observability-and-slack-triage
namespace: company.analytics

description: |
  Automated dbt observability pipeline that executes dbt models and Elementary anomaly detection tests,
  generates a standalone HTML health report, and triages schema and volume anomalies to Slack.

inputs:
  - id: git_repository
    type: URI
    displayName: Git Repository URL
    description: Git repository containing the dbt project and packages.yml with Elementary.
    defaults: https://github.com/elementary-data/dbt-project-demo

  - id: git_branch
    type: STRING
    displayName: Git Branch
    description: Target Git branch to check out and test.
    defaults: main

  - id: dbt_target
    type: STRING
    displayName: dbt Profile Target
    description: Target database profile declared in profiles.yml (e.g., dev, prod, staging).
    defaults: prod

  - id: slack_channel
    type: STRING
    displayName: Slack Channel
    description: Destination Slack channel for data quality anomaly triage alerts.
    defaults: "#data-ops-alerts"

triggers:
  - id: daily_morning_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: Automated morning data observability audit scheduled before business dashboard refresh. Shipped disabled by default.
    cron: "0 6 * * 1-5"
    disabled: true

  - id: upstream_warehouse_sync
    type: io.kestra.plugin.core.trigger.Webhook
    description: Authenticated webhook trigger to run observability tests following upstream Fivetran or Airbyte loads.
    key: "{{ secret('WEBHOOK_KEY') }}"

tasks:
  - id: dbt_and_elementary_workspace
    type: io.kestra.plugin.core.flow.WorkingDirectory
    description: Isolated shared workspace for cloning repository, compiling dbt, and running Elementary CLI.
    tasks:
      - id: clone_repository
        type: io.kestra.plugin.git.Clone
        description: Pull dbt project models, configurations, and packages from version control.
        url: "{{ inputs.git_repository }}"
        branch: "{{ inputs.git_branch }}"

      - id: run_dbt_and_elementary
        type: io.kestra.plugin.scripts.shell.Commands
        description: Execute dbt dependencies, run Elementary anomaly tests, and compile the observability report.
        taskRunner:
          type: io.kestra.plugin.scripts.runner.docker.Docker
        containerImage: python:3.11-slim
        env:
          DBT_PROFILES_DIR: "{{ workingDir }}"
          POSTGRES_HOST: "{{ secret('POSTGRES_HOST') }}"
          POSTGRES_PORT: "{{ secret('POSTGRES_PORT') ?? '5432' }}"
          POSTGRES_DATABASE: "{{ secret('POSTGRES_DB') }}"
          POSTGRES_USER: "{{ secret('POSTGRES_USER') }}"
          POSTGRES_PASSWORD: "{{ secret('POSTGRES_PASSWORD') }}"
          POSTGRES_SCHEMA: "{{ secret('POSTGRES_SCHEMA') ?? 'analytics' }}"
        commands:
          - pip install --no-cache-dir "dbt-postgres>=1.8.0,<1.9.0" "elementary-data>=0.14.0"
          - |
            cat << 'EOF' > profiles.yml
            default:
              target: "{{ inputs.dbt_target }}"
              outputs:
                prod:
                  type: postgres
                  host: "{{ secret('POSTGRES_HOST') }}"
                  port: {{ secret('POSTGRES_PORT') ?? 5432 }}
                  user: "{{ secret('POSTGRES_USER') }}"
                  password: "{{ secret('POSTGRES_PASSWORD') }}"
                  dbname: "{{ secret('POSTGRES_DB') }}"
                  schema: "{{ secret('POSTGRES_SCHEMA') ?? 'analytics' }}"
                  threads: 4
                dev:
                  type: postgres
                  host: "{{ secret('POSTGRES_HOST') }}"
                  port: {{ secret('POSTGRES_PORT') ?? 5432 }}
                  user: "{{ secret('POSTGRES_USER') }}"
                  password: "{{ secret('POSTGRES_PASSWORD') }}"
                  dbname: "{{ secret('POSTGRES_DB') }}"
                  schema: "{{ secret('POSTGRES_SCHEMA') ?? 'analytics' }}_dev"
                  threads: 2
            EOF
          - dbt deps
          - dbt test --select tag:elementary || true
          - edr report --file-path elementary_report.html || true

      - id: parse_elementary_results
        type: io.kestra.plugin.scripts.python.Script
        description: Inspect dbt run results and Elementary test metadata to extract anomaly counts and status.
        containerImage: python:3.11-slim
        script: |
          import json
          import os
          import sys

          run_results_path = os.path.join("target", "run_results.json")
          has_anomalies = False
          failed_tests = []
          total_tested = 0

          if os.path.exists(run_results_path):
              with open(run_results_path, "r", encoding="utf-8") as f:
                  data = json.load(f)
                  results = data.get("results", [])
                  total_tested = len(results)
                  for r in results:
                      status = r.get("status", "").lower()
                      if status in ["fail", "error"]:
                          test_name = r.get("unique_id", "unknown_test")
                          message = r.get("message", "No message")
                          failed_tests.append({"test": test_name, "message": message})
                          has_anomalies = True

          outputs = {
              "has_anomalies": has_anomalies,
              "anomaly_count": len(failed_tests),
              "total_tests": total_tested,
              "failed_tests": failed_tests,
              "summary": f"{len(failed_tests)} anomalies detected out of {total_tested} tests executed."
          }

          print(f"Observability check completed: {outputs['summary']}")
          print("::" + json.dumps({"outputs": outputs}) + "::")

  - id: evaluate_anomalies
    type: io.kestra.plugin.core.flow.If
    description: Branch execution based on whether Elementary detected data quality anomalies.
    condition: "{{ outputs.parse_elementary_results.vars.has_anomalies }}"
    then:
      - id: notify_slack_anomalies
        type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
        description: Dispatch high-priority Slack Block Kit alert detailing failed dbt models and anomaly metrics.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "{{ inputs.slack_channel }}",
            "blocks": [
              {
                "type": "header",
                "text": {
                  "type": "plain_text",
                  "text": "🚨 dbt Data Observability Alert: Anomalies Detected"
                }
              },
              {
                "type": "section",
                "fields": [
                  {
                    "type": "mrkdwn",
                    "text": "*Execution ID:*\n<{{ (kestra.url ?? 'http://localhost:8080/') ~ 'ui/' ~ execution.namespace ~ '/executions/' ~ execution.id }}|{{ execution.id }}>"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "*Anomalies Found:*\n{{ outputs.parse_elementary_results.vars.anomaly_count }} of {{ outputs.parse_elementary_results.vars.total_tests }} tests"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "*Target Profile:*\n`{{ inputs.dbt_target }}`"
                  },
                  {
                    "type": "mrkdwn",
                    "text": "*Repository:*\n`{{ inputs.git_repository }}`"
                  }
                ]
              },
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*Failed Anomaly Tests:*\n```\n{% for item in outputs.parse_elementary_results.vars.failed_tests %}- {{ item.test }}: {{ item.message }}\n{% endfor %}```"
                }
              },
              {
                "type": "context",
                "elements": [
                  {
                    "type": "mrkdwn",
                    "text": "Generated by *Kestra dbt Elementary Observability Pipeline* • Inspect `elementary_report.html` in execution outputs."
                  }
                ]
              }
            ]
          }
    else:
      - id: log_clean_run
        type: io.kestra.plugin.core.log.Log
        description: Record passing audit status when all data quality and volume checks pass.
        message: "✅ All dbt models and Elementary anomaly detection tests passed with zero failures."

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
    description: Critical alert dispatched if the runner crashes or database connectivity drops.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "{{ inputs.slack_channel }}",
        "text": "🔥 *Fatal Crash in dbt Elementary Pipeline* for execution `<{{ (kestra.url ?? 'http://localhost:8080/') ~ 'ui/' ~ execution.namespace ~ '/executions/' ~ execution.id }}|{{ execution.id }}>`. The runner aborted before completing validation."
      }

extend:
  title: Automate dbt Anomaly Detection and Slack Triage with Elementary
  metaTitle: dbt Observability and Anomaly Alerting with Elementary | Kestra
  shortDescription: Run dbt tests with Elementary anomaly detection, generate standalone HTML observability reports, and triage data issues in Slack.
  metaDescription: Orchestrate dbt Core and Elementary tests in Kestra. Catch volume, freshness, and schema anomalies, generate reports, and alert Slack.
  description: |
    Silent data corruption, sudden row count drops, and breaking schema changes can cascade through business intelligence dashboards unnoticed until stakeholders complain. This blueprint orchestrates [Elementary](https://www.elementary-data.com), the open-source data observability and testing framework for dbt, directly inside Kestra. It monitors data models for volume deviations, column distribution anomalies, and freshness violations, compiles an interactive HTML health report, and routes actionable triage notifications to Slack.

    ## How it works

    1. A daily `Schedule` trigger (`daily_morning_audit`) launches the audit before morning reporting hours, while an authenticated `Webhook` trigger (`upstream_warehouse_sync`) enables upstream ingestion tools (such as Fivetran or Airbyte) to trigger checks upon data sync completion.
    2. A `WorkingDirectory` task (`dbt_and_elementary_workspace`) provisions a shared local filesystem for all test operations:
       - `clone_repository` (`io.kestra.plugin.git.Clone`) pulls the latest dbt models, configuration files, and `packages.yml`.
       - `run_dbt_and_elementary` (`io.kestra.plugin.scripts.shell.Commands`) spins up an isolated Docker container with `dbt-postgres` and `elementary-data`, generates an inline profile connecting to your data warehouse via secrets, installs required dbt packages (`dbt deps`), and executes Elementary tests (`dbt test --select tag:elementary`). It then runs `edr report` to build a self-contained HTML observability dashboard.
       - `parse_elementary_results` (`io.kestra.plugin.scripts.python.Script`) parses the compiled dbt test manifest and run results, outputting the total test count, detected anomaly count, and individual failure messages to Kestra variables.
    3. An `If` conditional task (`evaluate_anomalies`) routes downstream execution:
       - If anomalies are detected (`has_anomalies: true`), `notify_slack_anomalies` (`io.kestra.plugin.notifications.slack.SlackIncomingWebhook`) sends a structured Slack Block Kit message with the failing test identifiers and error descriptions.
       - If no anomalies are detected, `log_clean_run` records a confirmation log.
    4. An `errors` block intercepts fatal runner aborts or network dropouts, ensuring that pipeline infrastructure failures are never silent.

    ## What you get

    - Automated anomaly detection across table row counts, null rates, and column value distributions without writing custom SQL tests.
    - An isolated, containerized runtime preventing local package dependency conflicts.
    - A standalone `elementary_report.html` artifact capturing table lineages and historical test run timelines.
    - Formatted Slack alert cards directing analytics engineers straight to the offending dbt model and execution trace.

    ## Who it's for

    - Analytics Engineers responsible for production dbt transformation reliability.
    - Data Platform Engineers building automated data quality gates and observability pipelines.
    - Data Operations teams requiring automated incident triage before morning BI refreshes.

    ## Why orchestrate this with Kestra

    Elementary provides tests and reporting, but requires an external orchestrator to schedule runs, manage database secrets securely, handle retries, and route alerts. Kestra provides a containerized task runner, declarative Git-versioned flow definitions, unified secret masking (`{{ secret(...) }}`), and event-driven webhook triggers. If a runner crashes or database connectivity drops, Kestra's execution state engine captures logs and executes the `errors` safeguard.

    ## Prerequisites

    - A Kestra worker with Docker enabled to execute containerized dbt and Elementary tasks.
    - A dbt project configured with the `elementary-data/elementary` package in `packages.yml`.
    - A target data warehouse (PostgreSQL, Snowflake, BigQuery, or Redshift) with read and write permissions to the Elementary metadata schema.

    ### Secrets

    Configure the following secrets in your Kestra namespace:
    - `POSTGRES_HOST`: Hostname of the target data warehouse.
    - `POSTGRES_PORT`: Port number of the warehouse (default `5432`).
    - `POSTGRES_DB`: Name of the target database.
    - `POSTGRES_USER`: Database user authorized to execute transformations and write Elementary artifacts.
    - `POSTGRES_PASSWORD`: Database user password.
    - `POSTGRES_SCHEMA`: Primary schema housing dbt models and Elementary tables.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL for incident triage alerting.
    - `WEBHOOK_KEY`: Authentication key for triggering the pipeline via HTTP Webhook.

    ## Quick start

    1. Configure the required database and Slack secrets in your Kestra namespace settings.
    2. Import this blueprint into your Kestra instance.
    3. Click **Execute** with the default inputs to test connection and run initial validation.
    4. Inspect the execution logs to verify that `dbt deps` and Elementary test suites complete cleanly.
    5. Enable the `daily_morning_audit` schedule trigger to activate automated morning audits.

    ## How to extend

    - Swap the `dbt-postgres` adapter in `run_dbt_and_elementary` for `dbt-snowflake`, `dbt-bigquery`, or `dbt-redshift` to match your cloud data warehouse.
    - Upload the generated `elementary_report.html` to an Amazon S3 or Google Cloud Storage bucket with a presigned URL using `io.kestra.plugin.aws.s3.Upload`.
    - Add automated Jira or PagerDuty incident creation using Kestra's notification plugins when high-severity anomalies occur.
    - Connect downstream BI cache warming flows (such as Tableau or Looker refresh APIs) to execute only when `evaluate_anomalies` passes cleanly.

    ## Links

    - [Elementary Documentation](https://docs.elementary-data.com)
    - [Elementary GitHub Repository](https://github.com/elementary-data/elementary)
    - [Kestra dbt Plugin Documentation](https://kestra.io/plugins/plugin-dbt)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
    - [Kestra Docker Task Runner Documentation](https://kestra.io/docs/task-runners)
  tags:
    - Data
  subTags:
    - Testing & Quality
    - dbt Transformations
    - Monitoring & Alerting
  ee: false
  demo: false
