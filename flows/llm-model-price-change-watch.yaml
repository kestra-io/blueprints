id: llm-model-price-change-watch
namespace: company.team
description: |
  Track the public OpenRouter model catalog every day, detect new models, retired
  models, price changes and context-window changes for the providers you care about,
  and post a short AI-written briefing to Slack that calls out the models you
  actually run in production.

inputs:
  - id: providers
    type: ARRAY
    itemType: STRING
    displayName: Providers to watch
    description: OpenRouter provider prefixes (the part of the model id before the slash).
    defaults:
      - openai
      - anthropic
      - google
      - mistralai
      - deepseek
      - meta-llama
      - qwen
      - x-ai

  - id: models_in_use
    type: ARRAY
    itemType: STRING
    displayName: Models you use in production
    description: Exact OpenRouter model ids. Any change to these is flagged as needing action.
    defaults:
      - openai/gpt-5-mini
      - anthropic/claude-haiku-4.5
      - google/gemini-2.5-flash-lite

  - id: price_change_threshold_pct
    type: FLOAT
    displayName: Price change threshold (%)
    description: Ignore price moves smaller than this percentage, to avoid rounding noise.
    defaults: 5.0

  - id: include_variants
    type: BOOL
    displayName: Include variants
    description: Also track ":free", ":batch" and similar variants and "~" aliases. Off by default to keep the briefing short.
    defaults: false

  - id: model_name
    type: STRING
    displayName: Gemini model for the briefing
    defaults: gemini-2.5-flash

tasks:
  - id: download_catalog
    type: io.kestra.plugin.core.http.Download
    description: Download the public OpenRouter model catalog. No API key is needed.
    uri: https://openrouter.ai/api/v1/models
    headers:
      User-Agent: Kestra-LLM-Price-Watch

  - id: load_snapshot
    type: io.kestra.plugin.core.kv.Get
    description: Load the snapshot saved by the previous run. On the first run there is none, so this run becomes the baseline.
    key: llm_model_price_watch_snapshot
    errorOnMissing: false

  - id: diff_catalog
    type: io.kestra.plugin.scripts.python.Script
    description: Compare today's catalog with the previous snapshot and classify every change. All numbers in the Slack message come from this step, not from the LLM.
    containerImage: python:3.12-slim
    inputFiles:
      catalog.json: "{{ outputs.download_catalog.uri }}"
      previous.json: "{{ (outputs.load_snapshot.value ?? {}) | toJson }}"
    script: |
      import json

      PROVIDERS = set({{ inputs.providers | toJson }})
      IN_USE = set({{ inputs.models_in_use | toJson }})
      THRESHOLD = float("{{ inputs.price_change_threshold_pct }}")
      INCLUDE_VARIANTS = "{{ inputs.include_variants }}".lower() == "true"

      def per_million(value):
          # OpenRouter prices are USD per token, as strings. "-1" means variable pricing.
          try:
              price = float(value)
          except (TypeError, ValueError):
              return None
          return None if price < 0 else round(price * 1_000_000, 4)

      with open("catalog.json") as f:
          models = json.load(f)["data"]
      with open("previous.json") as f:
          previous = json.load(f) or {}
      if isinstance(previous, str):
          previous = json.loads(previous)

      current = {}
      names = {}
      for m in models:
          model_id = m["id"]
          if model_id.lstrip("~").split("/")[0] not in PROVIDERS:
              continue
          if not INCLUDE_VARIANTS and (model_id.startswith("~") or ":" in model_id):
              continue
          pricing = m.get("pricing") or {}
          current[model_id] = {
              "in": per_million(pricing.get("prompt")),
              "out": per_million(pricing.get("completion")),
              "ctx": m.get("context_length"),
          }
          names[model_id] = m.get("name", model_id)

      def pct(old, new):
          if old in (None, 0) or new is None:
              return None
          return round((new - old) / old * 100, 1)

      added, removed, price_changes, context_changes = [], [], [], []
      if previous:
          for model_id in sorted(set(current) - set(previous)):
              added.append({"id": model_id, "name": names[model_id], **current[model_id]})
          for model_id in sorted(set(previous) - set(current)):
              removed.append({"id": model_id, **previous[model_id]})
          for model_id in sorted(set(current) & set(previous)):
              old, new = previous[model_id], current[model_id]
              for side in ("in", "out"):
                  change = pct(old.get(side), new.get(side))
                  if change is not None and abs(change) >= THRESHOLD:
                      price_changes.append({"id": model_id, "side": side, "old": old[side], "new": new[side], "pct": change})
              if old.get("ctx") and new.get("ctx") and old["ctx"] != new["ctx"]:
                  context_changes.append({"id": model_id, "old": old["ctx"], "new": new["ctx"]})

      touched = {c["id"] for c in removed + price_changes + context_changes}
      in_use_alerts = sorted(touched & IN_USE)
      missing_in_use = sorted(IN_USE - set(current))
      change_count = len(added) + len(removed) + len(price_changes) + len(context_changes)

      if not previous:
          status = "BASELINE"
      elif change_count:
          status = "CHANGED"
      else:
          status = "UNCHANGED"

      def money(v):
          return "variable" if v is None else f"${v:g}"

      lines = []
      for c in price_changes:
          side = "input" if c["side"] == "in" else "output"
          arrow = "up" if c["pct"] > 0 else "down"
          flag = " (IN USE)" if c["id"] in IN_USE else ""
          lines.append(f"- `{c['id']}`{flag} {side} price {arrow} {abs(c['pct'])}%: {money(c['old'])} -> {money(c['new'])} per 1M tokens")
      for c in added:
          lines.append(f"- NEW `{c['id']}`: {money(c['in'])} in / {money(c['out'])} out per 1M tokens, {c['ctx']} token context")
      for c in removed:
          flag = " (IN USE)" if c["id"] in IN_USE else ""
          lines.append(f"- REMOVED `{c['id']}`{flag}")
      for c in context_changes:
          lines.append(f"- `{c['id']}` context window {c['old']} -> {c['new']} tokens")

      changes = {
          "added": added,
          "removed": removed,
          "price_changes": price_changes,
          "context_changes": context_changes,
          "in_use_alerts": in_use_alerts,
      }
      print(f"{status}: watching {len(current)} models, {change_count} changes, in-use alerts: {in_use_alerts or 'none'}")
      print("::" + json.dumps({"outputs": {
          "status": status,
          "watched_count": len(current),
          "change_count": change_count,
          "in_use_alerts": in_use_alerts,
          "missing_in_use": missing_in_use,
          "changes": changes,
          "changes_markdown": "\n".join(lines[:40]) + ("\n- ...and more, see the execution outputs" if len(lines) > 40 else ""),
          "snapshot": current,
      }}) + "::")

  - id: route_by_status
    type: io.kestra.plugin.core.flow.Switch
    description: First run stores a baseline, a changed catalog produces a briefing, an unchanged catalog only logs.
    value: "{{ outputs.diff_catalog.vars.status }}"
    cases:
      BASELINE:
        - id: log_baseline
          type: io.kestra.plugin.core.log.Log
          message: "Baseline captured for {{ outputs.diff_catalog.vars.watched_count }} models. Changes will be reported from the next run. In-use models not found in the catalog: {{ outputs.diff_catalog.vars.missing_in_use }}"
      CHANGED:
        - id: write_briefing
          type: io.kestra.plugin.ai.completion.ChatCompletion
          description: Turn the structured diff into a short, decision-oriented briefing for the engineering team.
          provider:
            type: io.kestra.plugin.ai.provider.GoogleGemini
            apiKey: "{{ secret('GEMINI_API_KEY') }}"
            modelName: "{{ inputs.model_name }}"
          configuration:
            temperature: 0.2
          messages:
            - type: SYSTEM
              content: |
                You write a short weekly-style briefing for an engineering team that pays for LLM APIs.
                Use only the facts in the JSON you are given. Never invent prices, models or percentages.
                Write plain Slack text, no headings, at most 6 bullet points, under 900 characters.
                Start with the changes that affect the models the team uses in production.
                For each relevant change, say what it means in practice (cost impact, a cheaper alternative
                worth testing, or a migration that is needed). If nothing affects production models, say so first.
            - type: USER
              content: |
                Models used in production: {{ inputs.models_in_use | toJson }}
                In-use models affected: {{ outputs.diff_catalog.vars.in_use_alerts | toJson }}
                In-use models missing from the catalog: {{ outputs.diff_catalog.vars.missing_in_use | toJson }}
                Changes since the last run (prices are USD per 1M tokens, "in" = input, "out" = output):
                {{ outputs.diff_catalog.vars.changes | toJson }}

        - id: notify_slack
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: Post the AI briefing followed by the exact list of changes computed by the diff step.
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          messageText: |
            {{ outputs.diff_catalog.vars.in_use_alerts | length > 0 ? ':rotating_light: *LLM catalog change affects models you use*' : ':bar_chart: *LLM model catalog changed*' }} ({{ outputs.diff_catalog.vars.change_count }} changes across {{ inputs.providers | join(', ') }})

            {{ outputs.write_briefing.textOutput }}

            *Exact changes*
            {{ outputs.diff_catalog.vars.changes_markdown }}
    defaults:
      - id: log_unchanged
        type: io.kestra.plugin.core.log.Log
        message: "No changes above {{ inputs.price_change_threshold_pct }}% across {{ outputs.diff_catalog.vars.watched_count }} watched models."

  - id: save_snapshot
    type: io.kestra.plugin.core.kv.Set
    description: Save today's catalog as the next comparison point. It only runs after the briefing was delivered, so a failed Slack post is retried with the same diff next time.
    key: llm_model_price_watch_snapshot
    kvType: JSON
    overwrite: true
    value: "{{ outputs.diff_catalog.vars.snapshot | toJson }}"

errors:
  - id: alert_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Make sure a broken watcher is noticed instead of looking like a quiet catalog.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    messageText: ":warning: LLM model price watch failed in execution {{ execution.id }} ({{ flow.namespace }}.{{ flow.id }}). Check the OpenRouter endpoint, GEMINI_API_KEY and SLACK_WEBHOOK_URL."

triggers:
  - id: daily
    type: io.kestra.plugin.core.trigger.Schedule
    description: Check the catalog every morning. Disabled until the secrets are set.
    cron: "0 7 * * *"
    disabled: true

  - id: on_demand
    type: io.kestra.plugin.core.trigger.Webhook
    description: Run a check on demand, for example from a chat command or before a cost review.
    key: llm-price-watch-change-me

outputs:
  - id: status
    type: STRING
    value: "{{ outputs.diff_catalog.vars.status }}"
  - id: change_count
    type: INT
    value: "{{ outputs.diff_catalog.vars.change_count }}"
  - id: in_use_alerts
    type: JSON
    value: "{{ outputs.diff_catalog.vars.in_use_alerts | toJson }}"

extend:
  title: Watch LLM Model Prices and Releases with an AI Briefing in Slack
  shortDescription: Diff the OpenRouter model catalog daily and get an AI briefing on price, release and context-window changes for the models you use.
  metaTitle: LLM Model Price and Release Change Watch
  metaDescription: Detect LLM price changes, new and retired models from the OpenRouter catalog and post an AI briefing to Slack that flags your production models.
  description: |
    LLM providers change prices, ship new models and retire old ones every week. If one
    of the models you run in production gets more expensive or disappears, you usually
    find out from the invoice or from an outage. This blueprint watches the public
    [OpenRouter model catalog](https://openrouter.ai/docs/api-reference/list-available-models),
    which lists hundreds of models from every major provider with their prices, and tells
    you what changed and whether it matters to you.

    ## How it works

    1. `download_catalog` downloads the public catalog (no API key).
    2. `load_snapshot` reads yesterday's snapshot from the Kestra KV store.
    3. `diff_catalog` filters the catalog to the providers you watch and computes new models,
       removed models, input and output price changes above a threshold, and context-window
       changes. Prices are converted to USD per 1M tokens.
    4. `route_by_status` (Switch) picks one of three paths:
       - `BASELINE`: first run, nothing to compare yet, so it only logs.
       - `CHANGED`: `write_briefing` asks Gemini for a short briefing that starts with the
         models you use in production, then `notify_slack` posts the briefing followed by the
         exact list of changes. The numbers in the message come from the diff step, so the
         LLM cannot misreport a price.
       - anything else: logs that nothing changed.
    5. `save_snapshot` stores today's catalog for the next run. It only runs after Slack was
       notified, so a failed notification does not silently swallow a change.
    6. The `errors` branch posts to Slack if any task fails.

    ## Prerequisites

    - A Google AI Studio API key for Gemini. The free tier is enough for one call a day.
    - A Slack Incoming Webhook.

    ### Secrets

    - `GEMINI_API_KEY`: Gemini API key used by `write_briefing`.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL used for the briefing and failure alerts.

    In the open-source edition, secrets are environment variables on the Kestra container,
    prefixed with `SECRET_` and base64-encoded, for example
    `SECRET_GEMINI_API_KEY=$(echo -n "your-key" | base64)`. See
    [how to manage secrets](https://kestra.io/docs/concepts/secret).

    ## Inputs

    - `providers` (ARRAY of STRING): provider prefixes to watch. Default: openai, anthropic,
      google, mistralai, deepseek, meta-llama, qwen, x-ai.
    - `models_in_use` (ARRAY of STRING): exact model ids you run in production. Changes to
      them are flagged as needing action.
    - `price_change_threshold_pct` (FLOAT, default `5.0`): ignore smaller price moves.
    - `include_variants` (BOOL, default `false`): also track `:free`/`:batch` variants and `~` aliases.
    - `model_name` (STRING, default `gemini-2.5-flash`): Gemini model used for the briefing.

    ## Quick start

    1. Add the two secrets.
    2. Set `models_in_use` to the OpenRouter ids of the models you actually use. The baseline
       log tells you if one of them is not in the catalog.
    3. Execute the flow once. The first run is a baseline and sends nothing.
    4. To see a briefing without waiting for a real price change, run the first execution with
       `providers` set to `openai` only, then run again with `openai` and `mistralai`: every
       Mistral model is reported as new. Delete the KV key afterwards to reset the baseline.
    5. Enable the `daily` trigger. Change the webhook `key` before using `on_demand`.

    ## Outputs

    - `{{ outputs.diff_catalog.vars.changes }}`: structured lists of added, removed, price and
      context-window changes.
    - `{{ outputs.write_briefing.textOutput }}`: the AI briefing.
    - Flow outputs `status`, `change_count` and `in_use_alerts`.
    - KV key `llm_model_price_watch_snapshot`: the latest snapshot (delete it to reset the baseline).

    ## How to extend

    - Open a GitHub issue when a production model is removed or gets more expensive.
    - Store every snapshot in a database to chart price history.
    - Swap the Gemini provider for any other provider supported by the AI plugin.

    ## Links

    - [OpenRouter list models API](https://openrouter.ai/docs/api-reference/list-available-models)
    - [Kestra AI plugin, ChatCompletion](https://kestra.io/plugins/plugin-ai/completion/io.kestra.plugin.ai.completion.chatcompletion)
    - [Kestra KV store](https://kestra.io/docs/concepts/kv-store)
    - [Slack Incoming Webhook task](https://kestra.io/plugins/plugin-slack/notifications/io.kestra.plugin.slack.notifications.slackincomingwebhook)
  tags:
    - AI
    - Business
  subTags:
    - Monitoring & Alerting
    - FinOps & Cost Management
  ee: false
  demo: false
