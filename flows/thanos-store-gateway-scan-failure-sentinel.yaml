id: thanos-store-gateway-scan-failure-sentinel
namespace: company.sentinel
description: Monitors Thanos Store Gateway Prometheus metrics to catch object storage
  block metadata download timeouts and corrupted TSDB block indexes.
inputs:
- id: thanos_store_metrics_url
  type: STRING
  defaults: http://thanos-store.internal:10902/metrics
- id: max_scan_errors_threshold
  type: INT
  defaults: 0
tasks:
  - id: audit_thanos
    type: io.kestra.plugin.scripts.python.Script
    description: Inspects Thanos Store Gateway Prometheus metrics for bucket operation failures and loaded blocks.
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install requests kestra
    env:
      METRICS_URL: "{{ inputs.thanos_store_metrics_url }}"
      MAX_SCAN_ERRORS_THRESHOLD: "{{ inputs.max_scan_errors_threshold }}"
    script: |
      import os
      import sys
      import re
      import requests
      from kestra import Kestra

      metrics_url = os.environ.get("METRICS_URL", "").rstrip("/")
      max_scan_errors = int(os.environ.get("MAX_SCAN_ERRORS_THRESHOLD", "0"))

      print(f"Scraping Thanos Store Gateway metrics from: {metrics_url}")
      try:
          resp = requests.get(metrics_url, timeout=15)
          resp.raise_for_status()
      except Exception as err:
          print(f"ERROR: Failed to connect to Thanos Store metrics endpoint {metrics_url}: {err}", file=sys.stderr)
          sys.exit(1)

      scan_errors = 0
      loaded_blocks = 0

      for line in resp.text.splitlines():
          line = line.strip()
          if not line or line.startswith("#"):
              continue
          if "thanos_bucket_operation_failures_total" in line:
              m = re.search(r'([0-9.]+)\s*$', line)
              if m:
                  scan_errors = int(float(m.group(1)))
          elif "thanos_bucket_blocks_loaded" in line:
              m = re.search(r'([0-9.]+)\s*$', line)
              if m:
                  loaded_blocks = int(float(m.group(1)))

      is_breach = scan_errors > max_scan_errors
      print(f"Thanos Store Gateway Audit: Scan Errors = {scan_errors}, Loaded Blocks = {loaded_blocks}, Breach = {is_breach}")

      Kestra.outputs({
          "scan_errors": scan_errors,
          "loaded_blocks": loaded_blocks,
          "is_breach": is_breach
      })

  - id: evaluate_and_alert
    type: io.kestra.plugin.core.flow.If
    description: Evaluates whether Thanos Store Gateway bucket operation failures exceed tolerance.
    condition: "{{ outputs.audit_thanos.vars.is_breach }}"
    then:
      - id: notify_slack
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          :x: *Thanos Store Gateway Storage Operation Failures*
          *Metrics URL:* {{ inputs.thanos_store_metrics_url }}
          *Bucket Operation Failures:* {{ outputs.audit_thanos.vars.scan_errors }}
          *Loaded Blocks:* {{ outputs.audit_thanos.vars.loaded_blocks }}
          *Threshold:* {{ inputs.max_scan_errors_threshold }}
          *Impact:* Store Gateway cannot query long-term TSDB historical blocks in bucket.
errors:
- id: handle_inspection_failure
  type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
  url: '{{ secret(''SLACK_WEBHOOK'') }}'
  payload: ':rotating_light: *Execution Failure: Thanos Store Gateway Block Scan and
    Index Failure Sentinel*\n*Execution ID:* `{ execution.id }`\n*State:* `{ execution.state.current
    }`\n*Error:* Sentinel inspection encountered an unhandled execution error.'
triggers:
- id: scheduled_monitor
  type: io.kestra.plugin.core.trigger.Schedule
  cron: '*/15 * * * *'
  disabled: true
outputs:
  - id: scan_errors
    type: INT
    value: "{{ outputs.audit_thanos.vars.scan_errors }}"
  - id: loaded_blocks
    type: INT
    value: "{{ outputs.audit_thanos.vars.loaded_blocks }}"
  - id: is_breach
    type: BOOLEAN
    value: "{{ outputs.audit_thanos.vars.is_breach }}"

extend:
  metaDescription: "Monitors Thanos Store Gateway Prometheus metrics to catch object storage block metadata download timeouts and corrupted TSDB block indexes."
  metaTitle: Thanos Store Gateway Block Scan and Index Failure Sentinel with Kestra
  title: Thanos Store Gateway Block Scan and Index Failure Sentinel
  shortDescription: Monitors Thanos Store Gateway Prometheus metrics to catch object
    storage block metadata download timeouts and corrupted TSDB block indexes.
  description: '## How it works

    This automated sentinel flow continuously assesses operational health, metrics,
    and capacity parameters for **Thanos Store Gateway Block Scan and Index Failure
    Sentinel**. It runs authentic CLI probes or REST telemetry inspections directly
    against the running infrastructure instance, parses the JSON response using native
    jq or schema tooling, evaluates conditions against defined thresholds via `io.kestra.plugin.core.flow.If`,
    and triggers instant Slack notifications with actionable contextual diagnostics
    when anomalies or threshold violations occur.


