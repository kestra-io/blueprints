id: gcp-pubsub-subscription-oldest-unacked-message-sentinel
namespace: company.cloud

inputs:
  - id: project_id
    type: STRING
    description: Google Cloud Project ID.
  - id: subscription_id
    type: STRING
    description: Cloud Pub/Sub subscription name to audit.
  - id: max_age_seconds_threshold
    type: INT
    defaults: 3600
    description: "Maximum acceptable age of oldest unacknowledged message in seconds (default 1 hour / 3600s)."

tasks:
  - id: query_pubsub_lag_metrics
    type: io.kestra.plugin.gcp.gcloud.GCloudCLI
    projectId: "{{ inputs.project_id }}"
    serviceAccount: "{{ secret('GCP_SERVICE_ACCOUNT') }}"
    commands:
      - |
        START_TIME=$(date -u -v-15M +%Y-%m-%dT%H:%M:%SZ)
        FILTER="metric.type="pubsub.googleapis.com/subscription/oldest_unacked_message_age" AND resource.labels.subscription_id="{{ inputs.subscription_id }}""
        
        gcloud monitoring timeseries list \
          --filter="$FILTER" \
          --interval-start-time="$START_TIME" \
          --format=json > /tmp/pubsub_lag.json
        
        MAX_AGE=$(jq '[.[]?.points[]?.value.int64Value // 0] | max // 0' /tmp/pubsub_lag.json)
        
        echo "::set-output name=max_age::$MAX_AGE::"

  - id: evaluate_message_lag
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.query_pubsub_lag_metrics.vars.max_age | int >= inputs.max_age_seconds_threshold }}"
    then:
      - id: notify_streaming_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#gcp-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 Google Cloud Pub/Sub Subscriber Lag Alert",
                "text": "Pub/Sub subscription `{{ inputs.subscription_id }}` in project `{{ inputs.project_id }}` has unacknowledged messages aging past *{{ outputs.query_pubsub_lag_metrics.vars.max_age }} seconds* (Threshold: {{ inputs.max_age_seconds_threshold }}s)! Impact: Downstream consumers (Dataflow, Cloud Functions, GKE workers) are lagging, crashed, or failing to acknowledge messages, threatening retention expiry data loss.",
                "footer": "Kestra Messaging Sentinel • Google Cloud Pub/Sub"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#gcp-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ Google Cloud Pub/Sub Subscription Oldest Unacked Message Sentinel Pipeline Failure",
            "text": "Failed to query Cloud Monitoring for Pub/Sub subscription metrics. Check credentials.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  title: Google Cloud Pub/Sub Subscription Oldest Unacked Message Sentinel
  shortDescription: Monitors Google Cloud Pub/Sub oldest_unacked_message_age to detect subscriber processing stalls and message backlog.
  description: |
    ## How it works
    This workflow executes `gcloud monitoring timeseries list` to evaluate `pubsub.googleapis.com/subscription/oldest_unacked_message_age`. In event-driven architectures, when subscriber applications crash, deadlock on external database calls, or encounter poison-pill messages, unacknowledged messages pile up in the subscription backlog. If messages remain unacked beyond the threshold, Slack is notified immediately before message retention deadlines expire.

    ## What you get
    - Real-time detection of stalled Pub/Sub streaming consumer pipelines.
    - Prevents message drops caused by subscription message retention deadlines (default 7 days).
    - Precise metrics on oldest unacknowledged message age in seconds.

    ## Who it's for
    - Streaming Data Engineers and SREs maintaining real-time event ingest architectures.
    - Backend Developers building microservices consuming from Google Cloud Pub/Sub.

    ## Why orchestrate this with Kestra
    - **Direct Cloud Monitoring Query**: Extract subscription latency metrics without custom exporter agents.
    - **Continuous Pipeline Assurance**: Guarantee message processing SLAs across enterprise topics.
    - **Self-Healing Integration**: Automate subscriber pod scaling or dead-letter topic routing.

    ## Prerequisites
    - Google Cloud Pub/Sub subscription with active event publishing.
    - Secrets `GCP_SERVICE_ACCOUNT` and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import the blueprint.
    2. Configure project ID and subscription name.
    3. Run the workflow to inspect message lag.

    ## How to extend
    - Query `num_undelivered_messages` to monitor backlog depth alongside message age.
    - Automatically scale consumer GKE deployments upon severe lag spikes.

    ## Links
    - [Google Cloud Pub/Sub Monitoring Documentation](https://cloud.google.com/pubsub/docs/monitoring)
    - [Kestra GCloud CLI Plugin](https://kestra.io/plugins/plugin-gcp/io.kestra.plugin.gcp.gcloud.gcloudcli)
  tags:
    - Cloud
    - Data
  ee: false
  demo: false
