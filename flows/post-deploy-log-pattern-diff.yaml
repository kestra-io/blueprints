id: post-deploy-log-pattern-diff
namespace: company.team

inputs:
  - id: service
    type: STRING
    defaults: checkout-api

  - id: scenario
    type: SELECT
    displayName: Demo scenario
    description: >
      CLEAN: the release logs the same patterns as before. NEW_ERROR: the release starts
      logging an error template nobody has seen before. SURGE: a known warning template
      becomes ten times more frequent.
    values:
      - CLEAN
      - NEW_ERROR
      - SURGE
    defaults: NEW_ERROR

  - id: surge_ratio
    type: FLOAT
    displayName: Surge ratio
    description: Flag a known template whose share of log lines grew by at least this factor after the deploy.
    defaults: 5.0

  - id: min_new_count
    type: INT
    displayName: Minimum count for a new pattern
    description: A new template must appear at least this many times after the deploy to count, so a single odd line does not block a release.
    defaults: 3

triggers:
  - id: after_deploy
    type: io.kestra.plugin.core.trigger.Webhook
    description: Call from the deploy pipeline about 15 minutes after a rollout. Replace the key first.
    key: replace-with-a-long-random-key

tasks:
  - id: diff_patterns
    type: io.kestra.plugin.scripts.python.Script
    description: >
      Mine log templates with Drain3 from the hour before the deploy, then feed the lines
      after the deploy into the same miner. Templates that appear only after the deploy are
      NEW. Known templates whose share of lines grew past surge_ratio are SURGING. Variable
      parts such as ids, durations and IPs are masked, so one message with different values
      is one template.
    containerImage: python:3.12-slim
    beforeCommands:
      - pip install -q --root-user-action=ignore drain3==0.9.11
    env:
      SCENARIO: "{{ inputs.scenario }}"
      SURGE: "{{ inputs.surge_ratio }}"
      MIN_NEW: "{{ inputs.min_new_count }}"
    outputFiles:
      - pattern_diff.md
    script: |
      import json, os, random
      from collections import Counter
      from drain3 import TemplateMiner
      from drain3.template_miner_config import TemplateMinerConfig
      from drain3.masking import MaskingInstruction

      random.seed(5)
      scenario, surge, min_new = os.environ["SCENARIO"], float(os.environ["SURGE"]), int(os.environ["MIN_NEW"])

      # Demo logs. Replace with an export from Loki, Elasticsearch or CloudWatch for the two windows.
      def ip(): return f"10.0.{random.randint(0, 255)}.{random.randint(1, 254)}"
      def normal_line():
          r = random.random()
          if r < 0.55: return f"GET /api/cart/{random.randint(1000, 99999)} 200 in {random.randint(3, 80)}ms from {ip()}"
          if r < 0.80: return f"POST /api/checkout order={random.randint(100000, 999999)} amount={random.randint(5, 900)}.{random.randint(0, 99):02d} status=ok"
          if r < 0.95: return f"cache hit ratio {random.randint(80, 99)}% for key cart:{random.randint(1000, 99999)}"
          return f"WARN payment provider slow response {random.randint(900, 3000)}ms for order={random.randint(100000, 999999)}"
      def after_line():
          if scenario == "NEW_ERROR" and random.random() < 0.02:
              return f"ERROR tax service returned null rate for region={random.choice(['EU-DE', 'EU-FR', 'US-CA'])} order={random.randint(100000, 999999)}"
          if scenario == "SURGE" and random.random() < 0.30:
              return f"WARN payment provider slow response {random.randint(900, 3000)}ms for order={random.randint(100000, 999999)}"
          return normal_line()
      before = [normal_line() for _ in range(6000)]
      after = [after_line() for _ in range(2000)]

      config = TemplateMinerConfig()
      config.drain_sim_th = 0.5
      config.masking_instructions = [
          MaskingInstruction(r"\d+\.\d+\.\d+\.\d+", "IP"),
          MaskingInstruction(r"(?<=[=/:])[A-Z]{2}-[A-Z]{2}\b", "REGION"),
          MaskingInstruction(r"\d+(\.\d+)?(ms|%)?", "NUM"),
      ]
      miner = TemplateMiner(config=config)
      seen_before = Counter(miner.add_log_message(l)["cluster_id"] for l in before)
      seen_after = Counter(miner.add_log_message(l)["cluster_id"] for l in after)
      templates = {c.cluster_id: c.get_template() for c in miner.drain.clusters}

      new, surging = [], []
      for cid, n in seen_after.most_common():
          share_after = n / len(after)
          if cid not in seen_before:
              if n >= min_new:
                  new.append((templates[cid], n))
          else:
              share_before = seen_before[cid] / len(before)
              if share_after / share_before >= surge:
                  surging.append((templates[cid], round(share_before * 100, 2), round(share_after * 100, 2)))

      verdict = "NEW_PATTERN" if new else ("SURGE" if surging else "CLEAN")
      lines = [f"# Log patterns after deploy: {verdict}", "",
               f"{len(before)} lines before, {len(after)} after, {len(templates)} templates.", "",
               "## New templates", *([f"- `{t}` ({n} lines)" for t, n in new] or ["- none"]), "",
               "## Surging templates", *([f"- `{t}`: {b}% to {a}% of lines" for t, b, a in surging] or ["- none"])]
      open("pattern_diff.md", "w").write("\n".join(lines) + "\n")
      print("\n".join(lines))
      print("::" + json.dumps({"outputs": {
          "verdict": verdict, "templates": len(templates), "new_count": len(new),
          "new": "; ".join(f"{t} ({n})" for t, n in new),
          "surging": "; ".join(f"{t} {b}% to {a}%" for t, b, a in surging)}}) + "::")

  - id: publish_diff
    type: io.kestra.plugin.core.namespace.UploadFiles
    namespace: "{{ flow.namespace }}"
    filesMap:
      "deploys/{{ inputs.service }}/log-patterns-{{ execution.id }}.md": "{{ outputs.diff_patterns.outputFiles['pattern_diff.md'] }}"

  - id: verdict
    type: io.kestra.plugin.core.flow.Switch
    value: "{{ outputs.diff_patterns.vars.verdict }}"
    cases:
      CLEAN:
        - id: clean
          type: io.kestra.plugin.core.log.Log
          message: "{{ inputs.service }}: no new or surging log pattern after the deploy ({{ outputs.diff_patterns.vars.templates }} templates)."
      SURGE:
        - id: surge_warning
          type: io.kestra.plugin.core.log.Log
          level: WARN
          message: "{{ inputs.service }}: known patterns surged after the deploy: {{ outputs.diff_patterns.vars.surging }}"
    defaults:
      - id: roll_back_signal
        type: io.kestra.plugin.core.execution.Fail
        description: A new error template right after a deploy is the strongest single signal that the release introduced it. Failing lets the deploy pipeline roll back.
        errorMessage: "{{ inputs.service }}: {{ outputs.diff_patterns.vars.new_count }} log pattern(s) appeared only after the deploy: {{ outputs.diff_patterns.vars.new }}"

extend:
  title: Catch new error patterns in the logs right after a deploy
  metaTitle: Post-deploy log pattern diff with Drain3 in Kestra
  shortDescription: Mine log templates with Drain3 before and after a deploy, flag templates that appear only after it and known ones that surge, then signal a rollback.
  metaDescription: Compare log patterns before and after a deploy with Drain3 in Kestra. Flag brand new error templates and surging warnings, signal a rollback.
  description: |
    After a deploy, error counts look normal more often than they should: the new failure is one message among thousands, or it is logged at INFO. What changes reliably is the **shape** of the logs, because a new code path logs a message that did not exist before. This flow uses [Drain3](https://github.com/logpai/Drain3) to turn raw lines into templates (`GET /api/cart/<NUM> 200 in <NUM> from <IP>`), then compares the hour before the deploy with the minutes after it:
    - **New templates**: seen only after the deploy, at least `min_new_count` times. These fail the run so the pipeline can roll back.
    - **Surging templates**: known templates whose share of lines grew by `surge_ratio` or more. These are logged as a warning.

    It needs no secrets. A demo generator writes 6,000 lines before and 2,000 after the deploy for three scenarios.


    ## How it works

    1. `diff_patterns` (`io.kestra.plugin.scripts.python.Script`, `drain3==0.9.11`) masks IPs, regions and numbers, mines templates from the before window, keeps mining on the after window and compares counts per template. It writes `pattern_diff.md` and outputs `verdict`, `new` and `surging`.
    2. `publish_diff` (`io.kestra.plugin.core.namespace.UploadFiles`) keeps the report under `deploys/<service>/`.
    3. `verdict` (`io.kestra.plugin.core.flow.Switch`): `CLEAN` logs, `SURGE` warns, and `NEW_PATTERN` fails with the templates.
    4. `after_deploy` (`io.kestra.plugin.core.trigger.Webhook`).

    ## Quick start

    | `scenario` | Templates | Result |
    |---|---|---|
    | `CLEAN` | 4 | No new or surging pattern |
    | `NEW_ERROR` (default) | 5 | Failed: `ERROR tax service returned null rate for region=<REGION> order=<NUM>` appeared 36 times, only after the deploy |
    | `SURGE` | 4 | Warning: `WARN payment provider slow response <NUM> for order=<NUM>` went from 4.9% to 33.4% of lines |

    The new error is 1.8% of the lines after the deploy, below most error-rate alerts. As a template, it stands out at once.

    ## Using it with your logs

    - Replace the generator with two exports, one window before the deploy and one after, from Loki (`logcli query`), Elasticsearch or CloudWatch Logs Insights.
    - Add masking rules for your own identifiers, such as UUIDs, emails or tenant ids. Without them, every value becomes its own template.
    - Persist the miner state (`drain3` supports file persistence) in namespace files to compare against a longer baseline.

    ## Inputs

    - `service` (STRING), `scenario` (SELECT, demo only).
    - `surge_ratio` (FLOAT, default `5.0`), `min_new_count` (INT, default `3`).

    ## Expected outputs

    - `outputs.diff_patterns.vars`: `verdict`, `templates`, `new_count`, `new`, `surging`.
    - Namespace file `deploys/<service>/log-patterns-<execution>.md`.

    ## Links

    - Drain3: https://github.com/logpai/Drain3
    - Python scripts plugin: https://kestra.io/plugins/plugin-script-python

    This blueprint was created by [zkasuran](https://github.com/zkasuran).
  tags:
    - Infrastructure
    - AI
  subTags:
    - Monitoring & Alerting
    - CI/CD & Deployment
  ee: false
  demo: false
