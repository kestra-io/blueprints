id: karmada-fleet-binding-reconciliation-latency-sentinel
namespace: company.sre

description: |
  Audits CNCF Karmada multi-cloud cluster manager metrics to detect ResourceBinding propagation delays, sync failure spikes, and disconnected member clusters.

concurrency:
  limit: 1

inputs:
  - id: karmada_metrics_url
    type: STRING
    displayName: "Karmada Metrics URL"
    defaults: "http://karmada-controller-manager.karmada-system.svc.cluster.local:8080"
    description: "Internal Kubernetes HTTP endpoint exposing Prometheus metrics from the Karmada controller manager or scheduler."

  - id: fleet_identifier
    type: STRING
    displayName: "Fleet Identifier"
    defaults: "karmada-global-fleet"
    description: "Identifier of the target multi-cluster fleet governed by Karmada propagation policies."

  - id: max_binding_reconcile_latency_ms
    type: INT
    displayName: "Max Reconcile Latency Milliseconds"
    defaults: 500
    description: "Maximum allowable latency for ResourceBinding reconciliation cycles across member clusters before alerting."

  - id: max_sync_errors_threshold
    type: INT
    displayName: "Max Sync Errors Threshold"
    defaults: 5
    description: "Maximum allowable count of resource propagation synchronization errors before flagging fleet degradation."

  - id: alert_on_unready_member_clusters
    type: BOOL
    displayName: "Alert on Unready Member Clusters"
    defaults: true
    description: "Toggle whether detected unready or partitioned member clusters immediately escalate to platform on-call."

tasks:
  - id: scan_karmada_fleet_telemetry
    type: io.kestra.plugin.scripts.python.Script
    description: Scrapes Karmada controller manager Prometheus metrics to audit ResourceBinding reconciliation latency, sync errors, and cluster health.
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests kestra
    env:
      METRICS_URL: "{{ inputs.karmada_metrics_url }}"
      FLEET_ID: "{{ inputs.fleet_identifier }}"
      MAX_LATENCY_MS: "{{ inputs.max_binding_reconcile_latency_ms }}"
      MAX_SYNC_ERRORS: "{{ inputs.max_sync_errors_threshold }}"
      ALERT_UNREADY: "{{ inputs.alert_on_unready_member_clusters }}"
    script: |
      import os
      import sys
      import re
      import requests
      from datetime import datetime, timezone
      from kestra import Kestra

      base_url = os.environ.get("METRICS_URL", "").rstrip("/")
      fleet_id = os.environ.get("FLEET_ID", "karmada-global-fleet")
      max_latency_ms = float(os.environ.get("MAX_LATENCY_MS", "500"))
      max_sync_errors = float(os.environ.get("MAX_SYNC_ERRORS", "5"))
      alert_unready = os.environ.get("ALERT_UNREADY", "true").lower() == "true"

      max_observed_latency_ms = 0.0
      worst_controller = "none"
      sync_errors_count = 0.0
      unready_clusters_count = 0
      total_reconcile_events = 0
      slow_reconcile_events = 0

      metrics_endpoint = f"{base_url}/metrics"
      try:
          resp = requests.get(metrics_endpoint, timeout=12)
          resp.raise_for_status()
          raw_lines = resp.text.splitlines()
      except Exception as err:
          print(f"Error: Unable to connect to Karmada metrics endpoint at {metrics_endpoint}: {err}", file=sys.stderr)
          sys.exit(1)

      for line in raw_lines:
          line = line.strip()
          if not line or line.startswith("#"):
              continue
          match = re.search(r'([0-9.eE+-]+)\s*$', line)
          if not match:
              continue
          val = float(match.group(1))

          if "karmada_binding_reconcile_latency_seconds" in line or "karmada_resource_binding_reconcile_duration_seconds" in line:
              total_reconcile_events += 1
              ctrl_match = re.search(r'controller="([^"]+)"', line)
              ctrl_name = ctrl_match.group(1) if ctrl_match else "binding-controller"
              latency_ms = val * 1000.0
              if latency_ms > max_observed_latency_ms:
                  max_observed_latency_ms, worst_controller = latency_ms, ctrl_name
              if latency_ms > max_latency_ms:
                  slow_reconcile_events += 1
          elif "karmada_resource_sync_errors_total" in line or "karmada_resource_binding_sync_errors_total" in line:
              sync_errors_count += val
          elif "karmada_cluster_unhealthy_count" in line:
              unready_clusters_count = int(val)
          elif "karmada_cluster_status" in line and 'status="unready"' in line and val > 0:
              unready_clusters_count += int(val)

      is_breached = bool((max_observed_latency_ms > max_latency_ms) or (sync_errors_count > max_sync_errors) or (alert_unready and unready_clusters_count > 0))
      now_iso = datetime.now(timezone.utc).isoformat()
      print(f"Karmada Audit: fleet={fleet_id}, worst_ctrl={worst_controller}:{max_observed_latency_ms:.2f}ms, sync_errors={sync_errors_count}, unready_clusters={unready_clusters_count}, breached={is_breached}")

      Kestra.outputs({
          "peak_reconcile_latency_ms": round(max_observed_latency_ms, 2),
          "worst_controller": worst_controller,
          "sync_errors_count": round(sync_errors_count, 0),
          "unready_clusters_count": unready_clusters_count,
          "total_reconcile_events": total_reconcile_events,
          "slow_reconcile_events": slow_reconcile_events,
          "is_alerting": is_breached,
          "audit_timestamp": now_iso
      })

  - id: evaluate_karmada_fleet_health
    type: io.kestra.plugin.core.flow.If
    description: Evaluates whether ResourceBinding reconciliation latencies, propagation sync errors, or member cluster states violate fleet policies.
    condition: "{{ outputs.scan_karmada_fleet_telemetry.vars.is_alerting }}"
    then:
      - id: notify_slack_karmada_fleet_stall
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches high-urgency Slack notification when Karmada fleet propagation stalls or member clusters disconnect.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#platform-fleet-alerts",
            "text": "CRITICAL: Karmada Multi-Cloud Fleet Propagation Degradation on Fleet `{{ inputs.fleet_identifier }}`. Worst Controller: `{{ outputs.scan_karmada_fleet_telemetry.vars.worst_controller }}` at `{{ outputs.scan_karmada_fleet_telemetry.vars.peak_reconcile_latency_ms }}` ms (limit: `{{ inputs.max_binding_reconcile_latency_ms }}` ms). Sync Errors: `{{ outputs.scan_karmada_fleet_telemetry.vars.sync_errors_count }}` (limit: `{{ inputs.max_sync_errors_threshold }}`). Unready Clusters: `{{ outputs.scan_karmada_fleet_telemetry.vars.unready_clusters_count }}`. Slow Events: `{{ outputs.scan_karmada_fleet_telemetry.vars.slow_reconcile_events }}`. Audit Timestamp: `{{ outputs.scan_karmada_fleet_telemetry.vars.audit_timestamp }}`."
          }
    else:
      - id: log_nominal_karmada_state
        type: io.kestra.plugin.core.log.Log
        description: Records nominal telemetry when multi-cluster ResourceBinding propagation cycles operate within target bounds.
        message: "Karmada fleet reconciliation nominal for {{ inputs.fleet_identifier }}: Peak latency is {{ outputs.scan_karmada_fleet_telemetry.vars.peak_reconcile_latency_ms }} ms, sync errors {{ outputs.scan_karmada_fleet_telemetry.vars.sync_errors_count }}."

  - id: emit_audit_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Emits structured audit manifest for multi-cloud governance, fleet compliance tracking, and deployment verification.
    format: |
      {
        "status": "{{ outputs.scan_karmada_fleet_telemetry.vars.is_alerting ? 'ALERT' : 'NOMINAL' }}",
        "fleet_identifier": "{{ inputs.fleet_identifier }}",
        "peak_reconcile_latency_ms": {{ outputs.scan_karmada_fleet_telemetry.vars.peak_reconcile_latency_ms }},
        "worst_controller": "{{ outputs.scan_karmada_fleet_telemetry.vars.worst_controller }}",
        "sync_errors_count": {{ outputs.scan_karmada_fleet_telemetry.vars.sync_errors_count }},
        "unready_clusters_count": {{ outputs.scan_karmada_fleet_telemetry.vars.unready_clusters_count }},
        "total_reconcile_events": {{ outputs.scan_karmada_fleet_telemetry.vars.total_reconcile_events }},
        "slow_reconcile_events": {{ outputs.scan_karmada_fleet_telemetry.vars.slow_reconcile_events }},
        "audit_timestamp": "{{ outputs.scan_karmada_fleet_telemetry.vars.audit_timestamp }}"
      }

triggers:
  - id: periodic_karmada_fleet_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"

extend:
  title: "CNCF Karmada Multi-Cloud Fleet Binding Reconciliation Latency Sentinel"
  metaTitle: "Karmada Fleet Binding Reconciliation Latency Sentinel Blueprint"
  shortDescription: "Audits CNCF Karmada multi-cluster metrics to detect ResourceBinding propagation stalls and cluster partitions."
  metaDescription: "Audits CNCF Karmada multi-cloud cluster manager metrics to detect ResourceBinding propagation delays, sync failure spikes, and disconnected member clusters."
  description: |
    Automates continuous health, reconciliation latency, and propagation error surveillance across multi-cloud and hybrid Kubernetes clusters governed by CNCF Karmada.

    ## How it works
    1. A schedule trigger executes the Karmada fleet health audit workflow every 15 minutes.
    2. The Python task queries the Karmada controller manager Prometheus metrics endpoint exposing fleet controller telemetry.
    3. The script extracts ResourceBinding reconciliation durations, propagation sync error counters, and member cluster ready states.
    4. An evaluation gate determines whether binding reconciliation latency exceeds operational thresholds or member clusters are unreachable.
    5. When fleet propagation stalls or sync errors exceed thresholds, a high-urgency Slack alert is dispatched to the Platform Fleet team.
    6. When propagation latencies and cluster connectivity remain within SLA parameters, nominal status is logged.
    7. A structured JSON audit manifest is emitted for multi-cluster GitOps tracking, audit compliance, and deployment verification.

    ## Architecture diagram
    ```mermaid
    graph TD
        Trigger[Schedule Trigger: 15m] --> ScanMetrics[Python Script: Scrape Karmada Controller Metrics]
        ScanMetrics --> EvalBreach{Latency > 500ms OR Sync Errors > 5 OR Unready Clusters > 0?}
        EvalBreach -- Yes --> SlackAlert[Slack: High-Urgency Fleet Alert]
        EvalBreach -- No --> LogNominal[Log: Nominal Fleet Performance]
        SlackAlert --> EmitManifest[Debug Return: Fleet Audit Manifest]
        LogNominal --> EmitManifest
    ```

    ## Architecture components
    - **Trigger**: Automated schedule polling at 15-minute recurring intervals.
    - **Script Task**: Scrapes Karmada controller manager Prometheus metrics endpoints using Docker container runners.
    - **Decision Gate**: Evaluates whether ResourceBinding reconciliation latencies or sync error rates violate fleet SLAs.
    - **Notification Task**: Dispatches structured Slack alerts with fleet identifier, offending controller, and latency metrics.
    - **Audit Manifest**: Emits JSON execution payloads containing reconciliation latency metrics, error totals, and timestamps.

    ## Key capabilities
    - Continuous surveillance of ResourceBinding and ClusterResourceBinding propagation latency across remote edge and cloud clusters.
    - Early warning detection for API server rate limiting, authorization failures, or network partitions affecting member clusters.
    - Automated detection of unready, disconnected, or throttled member clusters registered to the Karmada control plane.
    - Zero host dependency execution via isolated containerized Python runners.

    ## What you get
    - Proactive visibility into multi-cluster configuration drift and cross-region propagation bottlenecks before rollouts fail.
    - Immediate incident alerting when remote regional clusters lose connectivity or reject resource manifests.
    - Standardized audit manifests containing exact reconciliation timing, controller breakdown, and synchronization failure counts.
    - Direct integration with multi-cloud platform operations and GitOps delivery pipelines.

    ## Who it's for
    - Multi-cloud platform architects managing distributed Kubernetes fleets across AWS, Azure, GCP, and bare metal.
    - Site Reliability Engineers ensuring consistent workload availability and disaster recovery across regional clusters.
    - DevOps engineers deploying applications via Karmada PropagationPolicy and OverridePolicy configurations.
    - Edge computing operators monitoring hundreds of distributed edge worker clusters from a centralized control plane.

    ## Why orchestrate this with Kestra
    - **Serverless Docker Isolation**: Executes telemetry scraping in ephemeral Docker environments without persistent workers.
    - **Centralized Secrets Governance**: Protects sensitive Slack webhooks using encrypted namespace secrets.
    - **Declarative YAML Workflows**: Manages multi-cluster fleet surveillance as versioned code in Git repositories.
    - **Comprehensive Audit History**: Preserves historical fleet synchronization metrics in searchable Kestra execution logs.

    ## Use cases
    - **Global Canary Rollout Protection**: Catches stalled resource propagation to secondary regions before completing global promotions.
    - **Member Cluster Network Partition Alarms**: Immediately alerts when a remote datacenter loses connectivity to the central Karmada API.
    - **Fleet Policy Deserialization Drift**: Detects validation or schema incompatibilities when propagating newer CRDs to older member clusters.

    ## Inputs
    | Name | Type | Default | Description |
    | --- | --- | --- | --- |
    | `karmada_metrics_url` | STRING | `http://karmada-controller-manager.karmada-system.svc.cluster.local:8080` | Internal Kubernetes HTTP endpoint exposing Prometheus metrics from Karmada. |
    | `fleet_identifier` | STRING | `karmada-global-fleet` | Identifier of the target multi-cluster fleet monitored for propagation health. |
    | `max_binding_reconcile_latency_ms` | INT | `500` | Maximum acceptable latency for ResourceBinding reconciliation cycles in milliseconds. |
    | `max_sync_errors_threshold` | INT | `5` | Maximum allowable count of resource propagation synchronization errors. |
    | `alert_on_unready_member_clusters` | BOOL | `true` | Toggle whether detected unready member clusters trigger an immediate operational alert. |

    ## Expected outputs
    - `{{ outputs.scan_karmada_fleet_telemetry.vars.peak_reconcile_latency_ms }}`: Peak observed ResourceBinding reconciliation duration in milliseconds.
    - `{{ outputs.scan_karmada_fleet_telemetry.vars.worst_controller }}`: Name of the controller component exhibiting the highest latency.
    - `{{ outputs.scan_karmada_fleet_telemetry.vars.sync_errors_count }}`: Cumulative count of resource synchronization errors across the fleet.
    - `{{ outputs.scan_karmada_fleet_telemetry.vars.unready_clusters_count }}`: Total number of member clusters currently reporting unready or partitioned status.
    - `{{ outputs.scan_karmada_fleet_telemetry.vars.slow_reconcile_events }}`: Count of reconciliation events exceeding the latency threshold.
    - `{{ outputs.scan_karmada_fleet_telemetry.vars.is_alerting }}`: Boolean flag indicating if fleet propagation limits were breached.
    - `{{ outputs.scan_karmada_fleet_telemetry.vars.audit_timestamp }}`: ISO-8601 UTC timestamp of the Karmada audit execution.

    ## Prerequisites
    - CNCF Karmada control plane deployed with controller manager metrics enabled and accessible on port 8080.
    - Network connectivity from the Kestra worker to the Karmada controller manager service endpoint.
    - Configured Slack incoming webhook URL with permissions to post in platform fleet alert channels.

    ### Secrets
    - `SLACK_WEBHOOK_URL`: Secure webhook URL for routing fleet degradation alerts to the Platform Slack channel.

    ## Quick start
    1. Verify that the Karmada controller manager is actively running and exposing metrics on port 8080.
    2. Add the `SLACK_WEBHOOK_URL` secret within your Kestra namespace settings.
    3. Specify your fleet identifier in `fleet_identifier`.
    4. Run a manual flow execution via the Kestra UI to validate metric scraping.
    5. Enable the `periodic_karmada_fleet_audit` schedule trigger to establish automated monitoring.

    ## Common pitfalls and troubleshooting
    - **Karmada Component Scraping**: Ensure the target endpoint points to the controller manager or aggregated metrics service rather than etcd.
    - **RBAC Cluster Roles**: Ensure the Kestra runner has permission to reach the karmada-system namespace endpoints.
    - **Cross-Region WAN Latency**: Member clusters with high network latency naturally exhibit higher reconcile times; calibrate thresholds accordingly.
    - **Aggregated Metric Cardinality**: Multi-cluster metrics can produce large Prometheus scrape payloads; ensure adequate timeout limits.

    ## How to extend
    - **Automated Workload Evacuation**: Trigger automated Karmada failover policies to migrate workloads away from degraded member clusters.
    - **Dynamic Cluster Re-Registration**: Automatically trigger health re-probe tasks when a partitioned edge cluster reconnects.
    - **Propagation Retry Escalation**: Automatically invoke kubectl commands to re-trigger binding reconciliation for stalled manifests.

    ## Links
    - [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
    - [CNCF Karmada Official Documentation](https://karmada.io/docs/)
    - [Karmada Architecture and Controller Reference](https://karmada.io/docs/reference/components/karmada-controller-manager)
    - [CNCF Karmada GitHub Repository](https://github.com/karmada-io/karmada)
