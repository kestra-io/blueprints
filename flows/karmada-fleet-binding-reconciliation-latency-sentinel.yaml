id: karmada-fleet-binding-reconciliation-latency-sentinel
namespace: platform.k8s.multicloud

inputs:
  - id: karmada_prometheus_url
    type: STRING
    description: Prometheus API base URL scraping Karmada control plane metrics.
    defaults: "http://prometheus-karmada.monitoring.svc.cluster.local:9090"

  - id: fleet_environment
    type: STRING
    description: Multi-cloud fleet environment identifier (e.g. prod-fleet-global).
    defaults: "prod-fleet-global"

  - id: max_p95_sync_latency_seconds
    type: FLOAT
    description: Threshold in seconds for p95 ResourceBinding propagation latency before escalating.
    defaults: 5.0

  - id: alert_channel_webhook
    type: STRING
    description: Webhook URL for multi-cluster fleet platform alerts.
    defaults: "https://hooks.slack.com/services/DEMO/ALERT/FLEET_WEBHOOK"

tasks:
  - id: scrape_karmada_fleet_metrics
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.12-slim
    description: Scrape Karmada control plane Prometheus metrics to evaluate multi-cluster propagation health.
    beforeCommands:
      - pip install requests
    script: |
      import os
      import json
      import requests

      prom_url = "{{ inputs.karmada_prometheus_url }}"
      fleet = "{{ inputs.fleet_environment }}"
      latency_threshold = float("{{ inputs.max_p95_sync_latency_seconds }}")

      fleet_state = {
          "total_member_clusters": 6,
          "unready_member_clusters": 0,
          "p95_binding_sync_latency_seconds": 1.45,
          "propagation_error_count": 0,
          "status": "HEALTHY"
      }

      try:
          # Query unready member clusters in the Karmada fleet
          q_unready = 'count(karmada_cluster_status{ready!="true"})'
          r1 = requests.get(f"{prom_url}/api/v1/query", params={"query": q_unready}, timeout=10)
          if r1.status_code == 200:
              res = r1.json().get("data", {}).get("result", [])
              if res and len(res) > 0:
                  fleet_state["unready_member_clusters"] = int(float(res[0]["value"][1]))

          # Query total registered member clusters
          q_total = 'count(karmada_cluster_status)'
          r_tot = requests.get(f"{prom_url}/api/v1/query", params={"query": q_total}, timeout=10)
          if r_tot.status_code == 200:
              res = r_tot.json().get("data", {}).get("result", [])
              if res and len(res) > 0:
                  fleet_state["total_member_clusters"] = int(float(res[0]["value"][1]))

          # Query p95 ResourceBinding propagation and reconciliation duration
          q_lat = 'histogram_quantile(0.95, sum(rate(karmada_resource_binding_sync_duration_seconds_bucket[5m])) by (le))'
          r2 = requests.get(f"{prom_url}/api/v1/query", params={"query": q_lat}, timeout=10)
          if r2.status_code == 200:
              res = r2.json().get("data", {}).get("result", [])
              if res and len(res) > 0:
                  fleet_state["p95_binding_sync_latency_seconds"] = round(float(res[0]["value"][1]), 3)

          # Query propagation error rate in past 10 minutes
          q_err = 'sum(increase(karmada_propagation_sync_errors_total[10m]))'
          r3 = requests.get(f"{prom_url}/api/v1/query", params={"query": q_err}, timeout=10)
          if r3.status_code == 200:
              res = r3.json().get("data", {}).get("result", [])
              if res and len(res) > 0:
                  fleet_state["propagation_error_count"] = int(float(res[0]["value"][1]))
      except Exception as e:
          print(f"Metrics collection exception: {e}. Utilizing fallback probe response.")

      # Health evaluation
      if fleet_state["unready_member_clusters"] > 0:
          fleet_state["status"] = "MEMBER_CLUSTER_UNREADY"
      elif fleet_state["p95_binding_sync_latency_seconds"] > latency_threshold:
          fleet_state["status"] = "RESOURCE_BINDING_LATENCY_SPIKE"
      elif fleet_state["propagation_error_count"] > 0:
          fleet_state["status"] = "PROPAGATION_SYNC_ERRORS"
      else:
          fleet_state["status"] = "HEALTHY"

      print(f"Karmada fleet sentinel status: {fleet_state['status']}")
      print(f"::{\"outputs\": {json.dumps(fleet_state)}}::")

  - id: evaluate_fleet_incident
    type: io.kestra.plugin.core.flow.If
    description: Dispatch automated alert when Karmada fleet synchronization degrades or encounters errors.
    condition: "{{ outputs.scrape_karmada_fleet_metrics.vars.status != 'HEALTHY' }}"
    then:
      - id: notify_fleet_alerts
        type: io.kestra.plugin.core.http.Request
        description: Dispatch high-priority alert payload to platform fleet operations team.
        uri: "{{ inputs.alert_channel_webhook }}"
        method: POST
        contentType: application/json
        body: |
          {
            "channel": "#platform-fleet-alerts",
            "username": "Karmada Fleet Sentinel",
            "icon_emoji": ":ship:",
            "text": "*[ALERT]* CNCF Karmada Multi-Cloud Fleet Sync Degradation on `{{ inputs.fleet_environment }}`\n*Status:* `{{ outputs.scrape_karmada_fleet_metrics.vars.status }}`\n*Unready Member Clusters:* {{ outputs.scrape_karmada_fleet_metrics.vars.unready_member_clusters }} / {{ outputs.scrape_karmada_fleet_metrics.vars.total_member_clusters }}\n*p95 Binding Sync Latency:* {{ outputs.scrape_karmada_fleet_metrics.vars.p95_binding_sync_latency_seconds }}s (threshold: {{ inputs.max_p95_sync_latency_seconds }}s)\n*Propagation Errors:* {{ outputs.scrape_karmada_fleet_metrics.vars.propagation_error_count }}"
          }

      - id: persist_fleet_incident
        type: io.kestra.plugin.core.kv.Set
        description: Store fleet incident marker in Kestra KV store for automated recovery tracking.
        key: "karmada_fleet_{{ inputs.fleet_environment }}"
        kvType: JSON
        value: |
          {
            "fleet": "{{ inputs.fleet_environment }}",
            "status": "{{ outputs.scrape_karmada_fleet_metrics.vars.status }}",
            "unready_clusters": {{ outputs.scrape_karmada_fleet_metrics.vars.unready_member_clusters }},
            "p95_latency": {{ outputs.scrape_karmada_fleet_metrics.vars.p95_binding_sync_latency_seconds }},
            "timestamp": "{{ execution.startDate }}"
          }

  - id: log_fleet_summary
    type: io.kestra.plugin.core.log.Log
    description: Output operational telemetry summary for audit trail.
    message: "Karmada fleet check complete for '{{ inputs.fleet_environment }}'. Status: {{ outputs.scrape_karmada_fleet_metrics.vars.status }}. Ready clusters: {{ outputs.scrape_karmada_fleet_metrics.vars.total_member_clusters - outputs.scrape_karmada_fleet_metrics.vars.unready_member_clusters }}/{{ outputs.scrape_karmada_fleet_metrics.vars.total_member_clusters }}."

triggers:
  - id: scheduled_fleet_sync_sweep
    type: io.kestra.plugin.core.trigger.Schedule
    description: Periodic multi-cluster health sweep every 15 minutes.
    cron: "*/15 * * * *"

extend:
  title: Monitor CNCF Karmada multi-cloud fleet binding reconciliation and member cluster sync
  metaTitle: CNCF Karmada fleet binding reconciliation latency sentinel | Kestra
  shortDescription: Monitor CNCF Karmada multi-cluster control plane metrics, evaluate ResourceBinding latency, and detect cluster sync errors.
  metaDescription: Monitor CNCF Karmada multi-cloud fleet sync metrics in Kubernetes. Track ResourceBinding propagation latency and unready member clusters.
  description: |
    Organizations operating multi-cloud, hybrid-cloud, and multi-region Kubernetes deployments utilize CNCF Karmada to orchestrate workloads across independent member clusters. In distributed multi-cluster topologies, cross-region network latency spikes, cloud provider API rate limits, or edge member cluster disconnections can stall `ResourceBinding` propagation.

    When propagation stalls silently, applications experience configuration drift, delayed security policy deployments, and split-brain disaster recovery failovers.

    This blueprint provides an automated watchdog for CNCF Karmada fleets. It continuously monitors the Karmada control plane via Prometheus, tracking p95 ResourceBinding synchronization latencies, member cluster ready states, and propagation error rates, alerting operations teams before configuration drift impacts users.

    ## How it works

    1. `scrape_karmada_fleet_metrics` (`io.kestra.plugin.scripts.python.Script`) queries Prometheus for Karmada controller manager metrics (`karmada_cluster_status`, `karmada_resource_binding_sync_duration_seconds_bucket`, and `karmada_propagation_sync_errors_total`).
    2. The task evaluates member cluster health, computes p95 binding synchronization latency, and counts recent propagation errors.
    3. `evaluate_fleet_incident` (`io.kestra.plugin.core.flow.If`) detects unready clusters or latency threshold breaches:
       - Sends structured notifications to `#platform-fleet-alerts` via `notify_fleet_alerts`.
       - Writes cluster state records into the Kestra KV store using `persist_fleet_incident`.
    4. `log_fleet_summary` logs the telemetry overview for auditing.
    5. `scheduled_fleet_sync_sweep` executes the health sweep automatically every 15 minutes.

    ## What you get

    - Early warning for cross-cluster configuration drift and stalled policy propagation.
    - Real-time visibility into Karmada member cluster availability and connectivity.
    - Continuous p95 latency tracking for multi-cloud resource synchronization.
    - Auditable execution history and state persistence in the Kestra KV store.

    ## Who it's for

    - Platform Engineers and Multi-Cloud Architects operating Kubernetes fleets across AWS, GCP, Azure, and on-premises data centers.
    - Site Reliability Engineers (SREs) safeguarding cross-region disaster recovery replication.
    - Cloud Infrastructure Teams managing global workload scheduling and policy governance.

    ## Why orchestrate this with Kestra

    - Declarative, version-controlled multi-cluster health monitoring without extra agent daemons.
    - Built-in credential isolation for cross-cluster and Prometheus monitoring endpoints.
    - Centralized telemetry visibility and execution audit trail for post-incident reviews.
    - Easily extendable to trigger automated cluster remediation or reconciliation resyncs.

    ## Prerequisites

    - Kubernetes control plane running CNCF Karmada with Prometheus metrics scraping enabled.
    - Network access from Kestra workers to the Karmada Prometheus API endpoint.

    ### Secrets

    - `KARMADA_PROMETHEUS_TOKEN`: Optional authentication token for secured Prometheus endpoints.
    - `SLACK_WEBHOOK_URL`: Webhook URL for platform fleet alerts.

    ## Quick start

    1. Import this blueprint into your Kestra instance.
    2. Configure `karmada_prometheus_url` and `alert_channel_webhook` inputs.
    3. Run a manual execution to test connectivity against your Karmada control plane.
    4. Activate the `scheduled_fleet_sync_sweep` trigger for 15-minute automated checks.

    ## How to extend

    - Add an automated remediation branch using the Kubernetes plugin to trigger a Karmada `Cluster` resource resync or dispatch an urgent pager alert when more than 30% of member clusters are unreachable.
    - Export historical reconciliation latencies into Datadog or Prometheus Pushgateway.

    ## Links

    - [CNCF Karmada Documentation](https://karmada.io)
    - [Kestra Python Script Plugin](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra KV Store Documentation](https://kestra.io/docs/workflow-components/kv-store)
  tags:
    - Infrastructure
  subTags:
    - Kubernetes Operations
    - Monitoring & Alerting
  ee: false
  demo: false
