id: algolia-canary-search-availability-sentinel
namespace: company.team
description: |
  Run a canary search against an Algolia index on a schedule, classify the
  result as HEALTHY or INDEX_EMPTY_OR_DEGRADED based on the returned hit
  count, log clean passes, and alert Slack the moment a canary query that
  should always return results comes back empty or the index itself is
  unreachable.

triggers:
  - id: periodic_canary_search
    type: io.kestra.plugin.core.trigger.Schedule
    description: "Checks every 15 minutes - an index that silently goes empty or stops matching its own canary record is a search-down incident, worth catching well before a customer notices a blank results page. Shipped disabled; enable it once index_name and canary_query point at a real Algolia index and a manual run has been verified."
    cron: "*/15 * * * *"
    disabled: true
    inputs:
      index_name: "<your-algolia-index>"
      canary_query: ""
      min_expected_hits: 1

inputs:
  - id: index_name
    type: STRING
    displayName: "Algolia Index Name"
    defaults: "<your-algolia-index>"
    description: "Index passed to the Search task's own indexName property. Must be replaced with a real index name - there is no safe universal default."

  - id: canary_query
    type: STRING
    displayName: "Canary Search Query"
    defaults: ""
    description: "Query text expected to reliably match at least min_expected_hits records, for example a seeded heartbeat record's unique attribute value, or any term known to always exist in the catalog. An empty string (the Search task's own default behavior, per its Javadoc) matches every record in the index, which is the simplest canary - any result at all proves the index is reachable and non-empty."

  - id: min_expected_hits
    type: INT
    displayName: "Minimum Expected Hits"
    defaults: 1
    description: "Threshold below which the canary search is classified INDEX_EMPTY_OR_DEGRADED. Set this above 1 if you track a canary query that should always return a known minimum count (for example a seeded set of heartbeat records)."

tasks:
  - id: probe_canary_search
    type: io.kestra.plugin.algolia.Search
    description: "Runs a single read-only query against the target index (verified from the Algolia plugin's own Search task: internally calls SearchClient.searchSingleIndex, never writes or deletes). hitsPerPage is capped at 1 since only the total nbHits count is used for classification, not the page of result records themselves."
    applicationId: "{{ secret('ALGOLIA_APP_ID') }}"
    apiKey: "{{ secret('ALGOLIA_API_KEY') }}"
    indexName: "{{ inputs.index_name }}"
    params:
      query: "{{ inputs.canary_query }}"
      hitsPerPage: 1

  - id: evaluate_index_health
    type: io.kestra.plugin.core.flow.If
    description: "HEALTHY once nbHits (verified output field from the Search task, Algolia's own total match count) meets or exceeds min_expected_hits; anything less means the canary query that should always match came back short."
    condition: "{{ outputs.probe_canary_search.nbHits >= inputs.min_expected_hits }}"
    then:
      - id: log_index_healthy
        type: io.kestra.plugin.core.log.Log
        message: "HEALTHY: canary query on index {{ inputs.index_name }} returned {{ outputs.probe_canary_search.nbHits }} hits (>= {{ inputs.min_expected_hits }} expected)."
    else:
      - id: alert_index_unhealthy
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: "Alert the moment a canary query that should always match comes back under threshold - this is the signal a sync job silently wiped the index, a reindex left it empty, or an attribute/filter change broke matching, well before a customer-facing search returns nothing."
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {{ {
            "text": "Algolia canary search sentinel: INDEX_EMPTY_OR_DEGRADED on index " ~ inputs.index_name ~ ". Canary query " ~ (inputs.canary_query | length > 0 ? ('"'  ~ inputs.canary_query ~ '"') : "(empty, matches all)") ~ " returned " ~ outputs.probe_canary_search.nbHits ~ " hits, expected at least " ~ inputs.min_expected_hits ~ ". Execution " ~ execution.id ~ "."
          } | toJson }}

  - id: log_audit_complete
    type: io.kestra.plugin.core.log.Log
    description: "Final status line for every run, independent of which branch fired."
    message: "Canary search audit complete for index {{ inputs.index_name }}. nbHits={{ outputs.probe_canary_search.nbHits }}."

errors:
  - id: alert_execution_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: "Alert when the flow itself fails outside the handled HEALTHY/INDEX_EMPTY_OR_DEGRADED branches - for example the index does not exist at all, the application ID or API key is invalid, or Algolia's API is unreachable. Deliberately distinguished from an empty-but-existing index: a thrown exception here means the index target itself is gone or misconfigured, not merely short on matching records."
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {{ {
        "text": "Algolia canary search sentinel FAILED in execution " ~ execution.id ~ " for index " ~ inputs.index_name ~ ". The search call itself did not complete - check the index exists and the app ID/API key are valid before trusting the last known HEALTHY/INDEX_EMPTY_OR_DEGRADED status."
      } | toJson }}

extend:
  title: "Algolia Canary Search Availability Sentinel"
  shortDescription: "Run a canary search against an Algolia index on a schedule and alert Slack the moment it stops matching or the index itself becomes unreachable."
  metaTitle: "Algolia Canary Search Availability Sentinel with Kestra"
  metaDescription: "Run a canary search against Algolia and alert Slack the instant a query that should always match comes back empty."
  description: |
    An Algolia index that silently goes empty - a broken reindex job, an
    accidental bulk delete, a sync pipeline that stopped halfway - produces
    no error on its own; the search API still responds `200 OK`, it just
    returns zero hits. Customers see a blank results page long before anyone
    notices in a dashboard. This blueprint runs a canary search on a schedule
    and alerts Slack the moment a query that should reliably match comes back
    under a configured threshold, or the index target itself is unreachable.

    ## How it works

    1. `periodic_canary_search` (`io.kestra.plugin.core.trigger.Schedule`) runs every 15 minutes, explicitly passing `index_name`, `canary_query`, and `min_expected_hits` through its own `inputs:` block so the flow is self-contained when the trigger fires. Shipped disabled so a manual run can be verified first.
    2. `probe_canary_search` (`io.kestra.plugin.algolia.Search`) issues a single read-only query against the target index and captures Algolia's own `nbHits` total match count.
    3. `evaluate_index_health` (`io.kestra.plugin.core.flow.If`) branches on whether `nbHits` meets or exceeds `min_expected_hits`.
       - `then` (HEALTHY): `log_index_healthy` records the pass.
       - `else` (INDEX_EMPTY_OR_DEGRADED): `alert_index_unhealthy` reports the shortfall to Slack with the exact hit count and threshold.
    4. `log_audit_complete` always runs last, printing the final `nbHits` regardless of which branch fired.
    5. The `errors` block alerts Slack separately if the search call itself throws - a deleted index, an invalid application ID or API key, or an unreachable API - deliberately kept distinct from an empty-but-existing index, since the two failure modes need different fixes.

    ## What you get

    - A synthetic, customer's-eye-view check: the same kind of query a real user would run, rather than an internal record-count API that can stay accurate while search itself is broken.
    - A clean separation between "index exists but has nothing matching" (`INDEX_EMPTY_OR_DEGRADED`, handled by the `If` branch) and "index target itself is gone or credentials are wrong" (handled by the flow-level `errors` block) - two different incidents that call for different responses.
    - A configurable `min_expected_hits` threshold so a seeded heartbeat record (or any query known to always match at least N records) can be audited precisely, not just checked for "any result at all."
    - A worked example of `io.kestra.plugin.algolia.Search`, a plugin with no prior blueprint coverage of its read path in this repository (the one existing Algolia blueprint covers index *sync*, not search *availability*).

    ## Who it's for

    - Teams running Algolia-backed search or autocomplete who want to know the moment it silently stops returning results, instead of waiting for a support ticket about "search is broken."
    - Data/platform engineers who own the ingestion pipeline feeding an Algolia index and want an independent, pipeline-agnostic check that the index itself is still serving - one that keeps working even if the ingestion job's own success/failure status is misleading.
    - Anyone evaluating the Algolia plugin who wants a worked example of its read-only `Search` task used for monitoring rather than for building search UI.

    ## Why orchestrate this with Kestra

    Algolia has no built-in "alert me if this query stops matching" primitive - its own dashboard shows search analytics and index size, but nothing that proactively watches a specific query's hit count over time. Kestra supplies the schedule, the HEALTHY/INDEX_EMPTY_OR_DEGRADED classification as a first-class branch, the execution history showing exactly when the canary first failed, and a clear separation between "empty index" and "unreachable index" failure modes.

    ## Prerequisites

    - An Algolia account and index with at least one record (the Free plan requires no credit card and is permanently free, as of 2026 capped at 50,000 records and 10,000 search requests per month - more than sufficient for this sentinel's query volume).
    - An Algolia Application ID and Admin API Key (update `ALGOLIA_APP_ID` / `ALGOLIA_API_KEY` secrets).
    - A Slack incoming webhook for alerts.

    Local testing: Algolia is a hosted SaaS search service with no official self-hosted or Docker emulator - the `Search` task always calls the real Algolia API. A free, no-credit-card account is sufficient to exercise this blueprint end to end; no paid enterprise tier or portal account is required.

    ### Secrets

    - `ALGOLIA_APP_ID` / `ALGOLIA_API_KEY`: credentials for `io.kestra.plugin.algolia.Search`, matching the plugin's own documented example usage of `secret('ALGOLIA_APP_ID')` / `secret('ALGOLIA_API_KEY')`.
    - `SLACK_WEBHOOK_URL`: Slack incoming webhook used by `alert_index_unhealthy` and the `errors` block.
    - In Kestra OSS (no Enterprise secrets backend), secrets are supplied as environment variables prefixed `SECRET_`, base64-encoded - for example `SECRET_ALGOLIA_API_KEY=$(echo -n '<your-api-key>' | base64)` - and read back in flows with `{{ secret('NAME') }}`.

    ### Inputs

    - `index_name` (STRING, default `<your-algolia-index>`, must be replaced): the index audited.
    - `canary_query` (STRING, default `""`): the query text expected to reliably match. An empty string matches every record in the index (the `Search` task's own documented default behavior), making it the simplest possible canary - any result at all proves the index is reachable and non-empty.
    - `min_expected_hits` (INT, default `1`): the floor `nbHits` must meet or exceed to be classified HEALTHY.

    ### Outputs

    - `outputs.probe_canary_search.nbHits` (Integer): Algolia's own total match count for the query (verified field from the `Search` task's `Output` class).
    - `outputs.probe_canary_search.hits` (List): up to `hitsPerPage` matching records themselves, capped at 1 in this blueprint since only the count is used for classification.

    ## Quick start

    1. Create a free Algolia account and index, add at least one record.
    2. Add the `ALGOLIA_APP_ID`, `ALGOLIA_API_KEY`, and `SLACK_WEBHOOK_URL` secrets.
    3. Run the flow manually with `canary_query` left empty and confirm `log_index_healthy` fires with `nbHits` matching your record count.
    4. Temporarily set `canary_query` to a term you know does not exist, or `min_expected_hits` above your real record count, and re-run to confirm `alert_index_unhealthy` fires.
    5. Set `index_name` to a nonexistent index and re-run to confirm the `errors` block fires separately from the HEALTHY/INDEX_EMPTY_OR_DEGRADED branches.
    6. Enable `periodic_canary_search` once you trust the check against your real index.

    ## How to extend

    - Loop over several `index_name` / `canary_query` pairs with `io.kestra.plugin.core.flow.Loop` to audit every index in an Algolia application in one run.
    - If your records carry a numeric timestamp attribute, add a second `Search` task with a `numericFilters` param (for example `updatedAt > <N minutes ago>`) to additionally audit ingestion freshness, not just index non-emptiness - kept out of this sentinel since it depends on a schema attribute this blueprint cannot assume exists.
    - Add a remediation branch that re-triggers the upstream sync pipeline flow via `io.kestra.plugin.core.flow.Subflow` when `INDEX_EMPTY_OR_DEGRADED` fires, behind an explicit approval gate.

    ## Pitfalls

    - **`nbHits` reflects total matches across the whole index, not just the returned page.** `hitsPerPage: 1` keeps the response small without affecting the count used for classification - verified directly from the Search task's source, which reads `response.getNbHits()` independently of `hitsPerPage`.
    - **An empty `canary_query` matches everything, which is the weakest possible canary** - it only proves the index is non-empty, not that any particular record type is present. For a stronger check, seed a dedicated heartbeat record with a unique, stable attribute value and query for that instead.
    - **Algolia's API enforces rate and quota limits on the Free plan** (10,000 search requests/month as of 2026) - a 15-minute schedule uses roughly 2,880 requests/month from this sentinel alone, leaving headroom for normal application traffic on a Free-plan index, but this should be accounted for on a shared production index.
    - **This blueprint is UNTESTED against a live Algolia index.** The task class, its `nbHits`/`hits` output fields, and the empty-query-matches-all behavior are taken verbatim from the Algolia plugin's own source and Javadoc - but no Kestra engine was run to execute this flow end to end.

    ## Links

    - [Kestra Algolia plugin documentation](https://kestra.io/plugins/plugin-algolia)
    - [Algolia Free plan details](https://www.algolia.com/pricing/free-plan)
    - [Algolia Search API reference](https://www.algolia.com/doc/rest-api/search/#tag/Search/operation/searchSingleIndex)
    - [Kestra secrets (OSS vs Enterprise)](https://kestra.io/docs/concepts/secret)
  tags:
    - Data
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - Day 2 Operations
  ee: false
  demo: false
