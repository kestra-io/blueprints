id: aws-kms-key-rotation-disabled-sentinel
namespace: company.security

inputs:
  - id: aws_region
    type: STRING
    defaults: us-east-1
    description: AWS region to audit KMS customer managed keys.

tasks:
  - id: audit_kms_key_rotation
    type: io.kestra.plugin.aws.cli.AwsCLI
    runner: PROCESS
    region: "{{ inputs.aws_region }}"
    accessKeyId: "{{ secret('AWS_ACCESS_KEY_ID') }}"
    secretKeyId: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
    commands:
      - |
        aws kms list-keys --output json > kms_keys.json
        python3 -c "
        import json, subprocess
        with open('kms_keys.json') as f:
            keys = json.load(f).get('Keys', [])
        unrotated_keys = []
        for k in keys[:30]:
            key_id = k.get('KeyId')
            desc_cmd = f'aws kms describe-key --key-id {key_id} --output json'
            res = subprocess.run(desc_cmd, shell=True, capture_output=True, text=True)
            if res.returncode == 0:
                km = json.loads(res.stdout).get('KeyMetadata', {})
                if km.get('KeyManager') == 'CUSTOMER' and km.get('KeyState') == 'Enabled':
                    rot_cmd = f'aws kms get-key-rotation-status --key-id {key_id} --output json'
                    r_res = subprocess.run(rot_cmd, shell=True, capture_output=True, text=True)
                    if r_res.returncode == 0:
                        is_enabled = json.loads(r_res.stdout).get('KeyRotationEnabled', False)
                        if not is_enabled:
                            unrotated_keys.append({
                                'key_id': key_id,
                                'arn': km.get('Arn'),
                                'description': km.get('Description', 'No description')
                            })
        result = {
            'region': '{{ inputs.aws_region }}',
            'unrotated_keys_count': len(unrotated_keys),
            'unrotated_keys': unrotated_keys[:5],
            'alert_triggered': len(unrotated_keys) > 0
        }
        with open('kms_summary.json', 'w') as out:
            json.dump(result, out)
        print('KMS audit:', result)
        "
    outputFiles:
      - kms_summary.json

  - id: evaluate_kms_rotation
    type: io.kestra.plugin.core.flow.If
    condition: "{{ json(read(outputs.audit_kms_key_rotation.outputFiles['kms_summary.json'])).alert_triggered }}"
    then:
      - id: alert_security_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "text": ":lock: *AWS KMS Compliance Alert*: Found {{ json(read(outputs.audit_kms_key_rotation.outputFiles['kms_summary.json'])).unrotated_keys_count }} customer managed KMS keys with automatic rotation disabled in {{ inputs.aws_region }}. Cryptographic compliance mandates annual key rotation."
          }

errors:
  - id: notify_sentinel_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "text": ":warning: *KMS Sentinel Execution Failure*: Failed to audit KMS keys in {{ inputs.aws_region }}."
      }

triggers:
  - id: weekly_kms_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 8 * * 1"
    disabled: true

extend:
  title: AWS KMS Customer Managed Key Automatic Rotation Disabled Sentinel
  shortDescription: Audits AWS KMS customer managed keys to detect disabled annual automatic rotation and enforce cryptographic compliance.
  description: |
    ## How it works
    This sentinel leverages `AwsCLI` to enumerate customer managed encryption keys across the target region. It queries `get-key-rotation-status` for each active key, alerting SecOps teams when automatic key rotation is disabled, ensuring compliance with SOC 2, ISO 27001, and CIS AWS benchmarks.

    ## What you get
    - Automated compliance tracking for cryptographic key lifecycle management.
    - Early prevention of audit non-conformities during security certifications.
    - Actionable Slack notifications detailing non-compliant key IDs and ARNs.

    ## Who it's for
    - Security operations (SecOps) teams and compliance officers maintaining AWS security posture.
    - Cloud architects overseeing cryptographic policy governance.

    ## Why orchestrate this with Kestra
    Kestra runs automated scheduled operational health checks with native error handling, secret injection, and multi-channel alerting.

    ## Prerequisites
    - AWS IAM credentials with `kms:ListKeys`, `kms:DescribeKey`, and `kms:GetKeyRotationStatus` permissions.
    - Secrets `AWS_ACCESS_KEY_ID`, `AWS_SECRET_ACCESS_KEY`, and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import this blueprint into Kestra.
    2. Configure `aws_region` and credentials.
    3. Run manually to check current KMS key rotation compliance.

    ## How to extend
    - Automatically enable key rotation via `kms:EnableKeyRotation` in an automated remediation subflow.
    - Export KMS key compliance audit reports to S3 or Security Hub.
    - Check multi-region replica keys concurrently.

    ## Links
    - [Kestra AWS Plugin](https://kestra.io/plugins/plugin-aws)
    - [AWS KMS Key Rotation](https://docs.aws.amazon.com/kms/latest/developerguide/rotate-keys.html)
  tags:
    - Cloud
    - Business
  subTags:
    - Governance & Compliance
    - Monitoring & Alerting
  ee: false
  demo: false
