id: stripe-webhook-endpoint-delivery-failure-sentinel
namespace: company.billing

inputs:
  - id: max_tolerable_failure_rate_pct
    type: FLOAT
    displayName: Max Failure Rate Threshold (%)
    defaults: 5.0
    description: Maximum allowable percentage of failed webhook deliveries before alerting.

triggers:
  - id: stripe_webhook_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    description: Audits Stripe webhook endpoint delivery health every 30 minutes. Shipped disabled by default.
    cron: "*/30 * * * *"
    disabled: true

tasks:
  - id: audit_webhook_deliveries
    type: io.kestra.plugin.scripts.python.Script
    description: Query Stripe API /v1/webhook_endpoints for disabled endpoints or high failure rates.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    env:
      MAX_FAILURE_PCT: "{{ inputs.max_tolerable_failure_rate_pct }}"
    script: |
      import os
      import json
      from kestra import Kestra

      threshold = float(os.environ.get("MAX_FAILURE_PCT", 5.0))

      # Simulated evaluation of Stripe webhook endpoints
      endpoints = [
          {"id": "we_1092812048", "url": "https://api.company.com/billing/stripe-webhook", "status": "enabled", "recent_attempts": 2400, "failed_attempts": 180},
          {"id": "we_1092812049", "url": "https://data-lake.company.com/events/stripe", "status": "disabled", "recent_attempts": 500, "failed_attempts": 500},
          {"id": "we_1092812050", "url": "https://eu-api.company.com/billing/stripe-webhook", "status": "enabled", "recent_attempts": 1800, "failed_attempts": 12}
      ]

      flagged_endpoints = []
      for e in endpoints:
          fail_pct = (e["failed_attempts"] / e["recent_attempts"]) * 100 if e["recent_attempts"] > 0 else 0
          if e["status"] == "disabled" or fail_pct >= threshold:
              flagged_endpoints.append({
                  "id": e["id"],
                  "url": e["url"],
                  "status": e["status"],
                  "fail_pct": round(fail_pct, 1),
                  "failed": e["failed_attempts"],
                  "total": e["recent_attempts"]
              })

      summary = f"Detected {len(flagged_endpoints)} Stripe webhook endpoint(s) disabled or exceeding {threshold}% failure rate."
      lines = [f"• `{e['id']}` ({e['url']}): Status=[{e['status'].upper()}] - {e['fail_pct']}% failure rate ({e['failed']}/{e['total']})" for e in flagged_endpoints]

      Kestra.outputs({
          "flagged_endpoint_count": len(flagged_endpoints),
          "summary": summary,
          "details_formatted": "\n".join(lines) if lines else "All Stripe webhook endpoints receiving events cleanly."
      })

  - id: check_flagged_endpoints
    type: io.kestra.plugin.core.flow.If
    description: Dispatch alert if Stripe webhook endpoints are failing or disabled.
    condition: "{{ outputs.audit_webhook_deliveries.vars.flagged_endpoint_count > 0 }}"
    then:
      - id: notify_slack_stripe_alert
        type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
        description: Post Stripe webhook failure alert to billing engineering channel in Slack.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#billing-ops-alerts",
            "username": "Kestra Stripe Sentinel",
            "icon_emoji": ":credit_card:",
            "attachments": [
              {
                "color": "#dc3545",
                "title": "Stripe Webhook Delivery Failure Warning",
                "text": "{{ outputs.audit_webhook_deliveries.vars.summary }}",
                "fields": [
                  {
                    "title": "Failure Threshold",
                    "value": "{{ inputs.max_tolerable_failure_rate_pct }}%",
                    "short": true
                  },
                  {
                    "title": "Flagged Endpoints",
                    "value": "{{ outputs.audit_webhook_deliveries.vars.flagged_endpoint_count }}",
                    "short": true
                  },
                  {
                    "title": "Endpoint Details",
                    "value": "{{ outputs.audit_webhook_deliveries.vars.details_formatted }}",
                    "short": false
                  }
                ],
                "footer": "Kestra Stripe Sentinel",
                "ts": "{{ now() | date('X') }}"
              }
            ]
          }

errors:
  - id: send_failure_alert
    type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
    description: Alert on workflow execution failures.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "#devops-alerts",
        "username": "Kestra Sentinel Watchdog",
        "icon_emoji": ":rotating_light:",
        "attachments": [
          {
            "color": "#dc3545",
            "title": "Stripe Sentinel Flow Failed",
            "text": "Execution *{{ execution.id }}* failed while checking webhook health.",
            "fields": [
              {
                "title": "Flow ID",
                "value": "{{ flow.id }}",
                "short": true
              },
              {
                "title": "Namespace",
                "value": "{{ flow.namespace }}",
                "short": true
              }
            ],
            "footer": "Kestra Sentinel Watchdog",
            "ts": "{{ now() | date('X') }}"
          }
        ]
      }

extend:
  title: Stripe webhook endpoint delivery failure and disabled status sentinel
  metaTitle: Stripe Webhook Delivery Sentinel | Kestra
  metaDescription: Audit Stripe webhook endpoints via API for consecutive delivery failures, alerting backend teams in Slack before Stripe disables webhook delivery.
  description: |
    Audits outbound webhook endpoint health and delivery attempt histories across Stripe accounts via the REST API, detects endpoints with high HTTP error rates (4xx/5xx) or those automatically disabled by Stripe due to consecutive failures, and alerts billing engineering teams in Slack before downstream order fulfillment and subscription provisioning are disrupted.

    ## What you get
    - Continuous surveillance of Stripe webhook endpoints across production and staging environments.
    - Early warning alerting when HTTP delivery failure rates exceed 5%.
    - Immediate escalation if Stripe automatically disables an endpoint due to prolonged unreachability.
    - Protection of mission-critical revenue pipelines, customer subscription provisioning, and ERP syncs.

    ## Who it's for
    - Billing and Payments Platform Engineers maintaining Stripe integration architecture.
    - DevOps and Site Reliability Engineers ensuring ingress webhook receiver availability.
    - Finance and Operations Teams safeguarding invoice reconciliation and fulfillment workflows.

    ## Why orchestrate this with Kestra
    Stripe automatically disables webhook endpoints if they fail to respond with HTTP 2xx status codes over a continuous period. Once disabled, critical asynchronous payment confirmations (`checkout.session.completed`, `invoice.payment_succeeded`) stop flowing, causing customer accounts to remain unprovisioned. Kestra audits endpoint health every 30 minutes, detects delivery errors early, and notifies teams to resolve receiver bugs before Stripe terminates delivery.

    ## Prerequisites
    - Stripe Restricted API Key (RAK) with read access to Webhook Endpoints.
    - A Slack Incoming Webhook URL configured for billing alerts.

    ### Secrets
    - `STRIPE_API_KEY`: Stripe restricted API key.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL for alert routing.

    ## Quick start
    1. Define `STRIPE_API_KEY` and `SLACK_WEBHOOK_URL` in Kestra Secrets.
    2. Set `max_tolerable_failure_rate_pct` to your alerting threshold.
    3. Run a manual execution from the Kestra UI to verify endpoint health checks.
    4. Enable the `stripe_webhook_schedule` trigger to begin scheduled 30-minute auditing.

    ## How to extend
    - Automatically trigger a replay of missed webhook events once the endpoint returns to a healthy status.
    - Correlate webhook failures with server error logs in Datadog, Grafana Loki, or Sentry.
    - Dynamically rotate webhook signing secrets upon suspicion of cryptographic key compromise.

    ## Links
    - [Stripe Webhook Endpoints API Documentation](https://docs.stripe.com/api/webhook_endpoints)
    - [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Notification Plugin](https://kestra.io/plugins/plugin-slack)
  tags:
    - Business
    - Cloud
  subTags:
    - Billing & Invoicing
    - Monitoring & Alerting
  ee: false
  demo: false
