id: treasury-yield-curve-inversion-and-shift-alert
namespace: company.team

description: |
  Load the US Treasury daily par yield curve, track 2s10s, 3m10y and 5s30s inversions with a confirmation rule
  against whipsaw, and alert on new regime changes or large day-over-day moves at any tenor.

inputs:
  - id: spreads
    type: STRING
    displayName: Spreads to watch (CSV)
    description: >-
      Header `name,short_tenor,long_tenor`. Spread = long minus short yield, in basis points. Tenors use the
      Treasury column labels: 1 Mo, 1.5 Month, 2 Mo, 3 Mo, 4 Mo, 6 Mo, 1 Yr, 2 Yr, 3 Yr, 5 Yr, 7 Yr, 10 Yr, 20 Yr, 30 Yr.
    defaults: |
      name,short_tenor,long_tenor
      2s10s,2 Yr,10 Yr
      3m10y,3 Mo,10 Yr
      5s30s,5 Yr,30 Yr

  - id: confirm_days
    type: INT
    defaults: 3
    description: A spread must stay on the other side of zero for this many consecutive curve dates before an inversion or un-inversion counts. Filters the 1-day sign flips 3m10y produces near zero.

  - id: shift_threshold_bp
    type: INT
    defaults: 12
    description: Alert when any tenor moves at least this many basis points from the previous published curve.

triggers:
  - id: weekday_evening
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "30 18 * * 1-5"
    timezone: America/New_York
    description: Treasury publishes the day's par yield curve in the late afternoon New York time.

tasks:
  - id: fetch
    type: io.kestra.plugin.core.flow.Parallel
    description: The CSV endpoint serves one calendar year per request. Two years give enough history for regime dates and work across New Year.
    tasks:
      - id: fetch_previous_year
        type: io.kestra.plugin.core.http.Download
        uri: "https://home.treasury.gov/resource-center/data-chart-center/interest-rates/daily-treasury-rates.csv/{{ now() | dateAdd(-1, 'YEARS') | date('yyyy', timeZone='America/New_York') }}/all?type=daily_treasury_yield_curve&field_tdr_date_value={{ now() | dateAdd(-1, 'YEARS') | date('yyyy', timeZone='America/New_York') }}&page&_format=csv"
        headers:
          User-Agent: kestra-blueprint-treasury-yield-curve
        retry:
          type: constant
          interval: PT1M
          maxAttempts: 3

      - id: fetch_current_year
        type: io.kestra.plugin.core.http.Download
        description: In the first days of January the current-year file is empty (HTTP 200, 0 bytes), so an empty response is allowed and skipped.
        uri: "https://home.treasury.gov/resource-center/data-chart-center/interest-rates/daily-treasury-rates.csv/{{ now() | date('yyyy', timeZone='America/New_York') }}/all?type=daily_treasury_yield_curve&field_tdr_date_value={{ now() | date('yyyy', timeZone='America/New_York') }}&page&_format=csv"
        failOnEmptyResponse: false
        headers:
          User-Agent: kestra-blueprint-treasury-yield-curve
        retry:
          type: constant
          interval: PT1M
          maxAttempts: 3

  - id: last_processed
    type: io.kestra.plugin.core.kv.Get
    key: treasury_curve_last_date
    errorOnMissing: false
    description: Latest curve date already reported. Missing on the first run, which is a BASELINE run that reports history but alerts on nothing.

  - id: analyse
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: |
      Unpivots both year files into (date, tenor, yield); the files have different columns because Treasury added
      the 4-month (2022) and 1.5-month (2025) bills, so they are unioned by name and blank cells are dropped.
      Spreads are computed per date where both tenors exist. Consecutive dates with the same sign form a run;
      only runs of at least `confirm_days` dates are confirmed, and a regime change is a confirmed run whose sign
      differs from the previous confirmed run, dated on the day it became confirmed. Day-over-day moves compare
      each tenor with the previous published curve date only. Events after the KV date are new.
    url: "jdbc:duckdb:"
    timeZoneId: UTC
    fetchType: FETCH_ONE
    inputFiles:
      previous.csv: "{{ outputs.fetch_previous_year.uri }}"
      current.csv: "{{ outputs.fetch_current_year.uri }}"
      spreads.csv: "{{ inputs.spreads }}"
    outputFiles:
      - events_csv
      - spreads_csv
    parameters:
      cursor: "{{ outputs.last_processed.value ?? '' }}"
      confirm_days: "{{ inputs.confirm_days }}"
      threshold: "{{ inputs.shift_threshold_bp }}"
      today: "{{ now() | date('yyyy-MM-dd', timeZone='America/New_York') }}"
    sql: |
      CREATE TABLE raw AS
      SELECT * FROM read_csv([{{ outputs.fetch_current_year.length > 0 ? "'current.csv', " : '' }}'previous.csv'], header = true, all_varchar = true, union_by_name = true);

      CREATE TABLE curve AS
      SELECT DISTINCT CAST(strptime("Date", '%m/%d/%Y') AS DATE) AS d, tenor, TRY_CAST(y AS DOUBLE) AS y,
             CASE WHEN tenor LIKE '%Yr' THEN 12 ELSE 1 END * TRY_CAST(split_part(tenor, ' ', 1) AS DOUBLE) AS months
      FROM (UNPIVOT raw ON COLUMNS(* EXCLUDE ("Date")) INTO NAME tenor VALUE y)
      WHERE TRY_CAST(y AS DOUBLE) IS NOT NULL;

      CREATE TABLE dates AS SELECT d, lag(d) OVER (ORDER BY d) AS prev_d FROM (SELECT DISTINCT d FROM curve);
      CREATE TABLE tenors AS SELECT DISTINCT tenor, months FROM curve;

      CREATE TABLE spread_def AS
      SELECT s.*, ts.months AS short_m, tl.months AS long_m,
             CASE
               WHEN s.name IS NULL THEN 'missing name'
               WHEN count(*) OVER (PARTITION BY s.name) > 1 THEN 'duplicate name'
               WHEN ts.tenor IS NULL THEN 'unknown short_tenor ' || coalesce(s.short_tenor, '(blank)')
               WHEN tl.tenor IS NULL THEN 'unknown long_tenor ' || coalesce(s.long_tenor, '(blank)')
               WHEN ts.months >= tl.months THEN 'short_tenor must be shorter than long_tenor'
             END AS reject_reason
      FROM (SELECT nullif(trim(name), '') AS name, trim(short_tenor) AS short_tenor, trim(long_tenor) AS long_tenor
            FROM read_csv('spreads.csv', header = true, all_varchar = true)) s
      LEFT JOIN tenors ts ON ts.tenor = s.short_tenor
      LEFT JOIN tenors tl ON tl.tenor = s.long_tenor;

      CREATE TABLE series AS
      SELECT sd.name, cs.d, round((cl.y - cs.y) * 100, 1) AS spread_bp, (cl.y - cs.y) < 0 AS inverted
      FROM spread_def sd
      JOIN curve cs ON cs.tenor = sd.short_tenor
      JOIN curve cl ON cl.tenor = sd.long_tenor AND cl.d = cs.d
      WHERE sd.reject_reason IS NULL;

      CREATE TABLE runs AS
      SELECT name, inverted, min(d) AS start_d, max(d) AS end_d, count(*) AS len,
             list(d ORDER BY d)[CAST(:confirm_days AS INTEGER)] AS confirm_d
      FROM (SELECT *, row_number() OVER (PARTITION BY name ORDER BY d) - row_number() OVER (PARTITION BY name, inverted ORDER BY d) AS grp FROM series)
      GROUP BY name, inverted, grp;

      CREATE TABLE regime_changes AS
      SELECT * FROM (
        SELECT name, inverted, start_d, confirm_d, lag(inverted) OVER (PARTITION BY name ORDER BY start_d) AS prev_inverted
        FROM runs WHERE len >= CAST(:confirm_days AS INTEGER))
      WHERE prev_inverted IS NOT NULL AND inverted <> prev_inverted;

      CREATE TABLE shifts AS
      SELECT c.d, c.tenor, c.months, round((c.y - p.y) * 100, 1) AS change_bp
      FROM curve c JOIN dates dt ON dt.d = c.d JOIN curve p ON p.tenor = c.tenor AND p.d = dt.prev_d
      WHERE abs(c.y - p.y) * 100 >= CAST(:threshold AS DOUBLE) - 0.001;

      CREATE TABLE events AS
      SELECT confirm_d AS d, 'REGIME' AS kind, name AS subject,
             CASE WHEN inverted THEN 'INVERTED, below zero since ' ELSE 'UN-INVERTED, above zero since ' END || strftime(start_d, '%Y-%m-%d') || ' (confirmed after ' || :confirm_days || ' curve dates)' AS detail
      FROM regime_changes
      UNION ALL
      SELECT d, 'SHIFT', 'moves of ' || :threshold || 'bp or more',
             string_agg(tenor || ' ' || CASE WHEN change_bp > 0 THEN '+' ELSE '' END || change_bp || 'bp', ', ' ORDER BY months)
      FROM shifts GROUP BY d;

      CREATE TABLE flagged AS
      SELECT *, nullif(:cursor, '') IS NOT NULL AND d > CAST(nullif(:cursor, '') AS DATE) AS is_new FROM events;

      CREATE TABLE latest AS
      SELECT s.name, s.d, s.spread_bp, s.inverted, r.len AS run_len,
             (SELECT max(start_d) FROM regime_changes rc WHERE rc.name = s.name) AS regime_since
      FROM series s JOIN runs r ON r.name = s.name AND s.d BETWEEN r.start_d AND r.end_d
      WHERE s.d = (SELECT max(d) FROM series x WHERE x.name = s.name);

      -- Last confirmed regime per spread; a newer run that is still shorter than confirm_days is reported as pending.
      CREATE TABLE regime AS
      SELECT l.*, c.inverted AS confirmed_inverted
      FROM latest l
      LEFT JOIN (SELECT name, arg_max(inverted, start_d) AS inverted FROM runs WHERE len >= CAST(:confirm_days AS INTEGER) GROUP BY name) c ON c.name = l.name;

      CREATE TABLE move AS
      SELECT dt.d, round((c10.y - p10.y) * 100, 1) AS d10, round((c2.y - p2.y) * 100, 1) AS d2
      FROM dates dt
      JOIN curve c10 ON c10.d = dt.d AND c10.tenor = '10 Yr' JOIN curve p10 ON p10.d = dt.prev_d AND p10.tenor = '10 Yr'
      JOIN curve c2 ON c2.d = dt.d AND c2.tenor = '2 Yr' JOIN curve p2 ON p2.d = dt.prev_d AND p2.tenor = '2 Yr'
      WHERE dt.d = (SELECT max(d) FROM dates);

      COPY (SELECT d AS date, kind, subject, detail, is_new FROM flagged ORDER BY d DESC, kind) TO '{{ outputFiles.events_csv }}' (HEADER, DELIMITER ',');
      COPY (SELECT s.name, s.d AS date, s.spread_bp, s.inverted FROM series s ORDER BY s.name, s.d) TO '{{ outputFiles.spreads_csv }}' (HEADER, DELIMITER ',');

      SELECT *,
        'Treasury par yield curve ' || last_curve_date || chr(10) || spread_status || chr(10) || 'Latest move ' || coalesce(latest_move, 'n/a') || chr(10)
          || new_events || CASE WHEN rejected <> '' THEN chr(10) || 'Rejected spreads ' || rejected ELSE '' END || chr(10) AS slack_text
      FROM (SELECT
        nullif(:cursor, '') IS NULL AS is_baseline,
        strftime((SELECT min(d) FROM dates), '%Y-%m-%d') AS first_curve_date,
        strftime((SELECT max(d) FROM dates), '%Y-%m-%d') AS last_curve_date,
        strftime(greatest((SELECT max(d) FROM dates), coalesce(CAST(nullif(:cursor, '') AS DATE), DATE '1900-01-01')), '%Y-%m-%d') AS next_cursor,
        (SELECT count(*) FROM dates) AS curve_dates,
        datediff('day', (SELECT max(d) FROM dates), CAST(:today AS DATE)) > 4 AS stale,
        (SELECT string_agg(tenor || ' ' || printf('%.2f', y), ', ' ORDER BY months) FROM curve WHERE d = (SELECT max(d) FROM dates)) AS latest_curve,
        (SELECT string_agg(name || ' ' || CASE WHEN spread_bp > 0 THEN '+' ELSE '' END || spread_bp || 'bp '
                 || CASE WHEN confirmed_inverted THEN 'INVERTED' ELSE 'normal' END
                 || ' since ' || coalesce(strftime(regime_since, '%Y-%m-%d'), 'before ' || strftime((SELECT min(d) FROM dates), '%Y-%m-%d'))
                 || CASE WHEN inverted <> confirmed_inverted THEN ' (pending flip, ' || run_len || ' of ' || :confirm_days || ' dates)' ELSE '' END, '; ' ORDER BY name)
         FROM regime) AS spread_status,
        (SELECT CASE WHEN d10 < 0 AND d2 < 0 THEN 'bull ' WHEN d10 > 0 AND d2 > 0 THEN 'bear ' ELSE '' END
                || CASE WHEN d10 - d2 > 0 THEN 'steepener' WHEN d10 - d2 < 0 THEN 'flattener' ELSE 'unchanged slope' END
                || ' (2y ' || d2 || 'bp, 10y ' || d10 || 'bp)' FROM move) AS latest_move,
        (SELECT count(*) FROM regime_changes) AS regime_changes_in_window,
        (SELECT count(*) FROM events WHERE kind = 'SHIFT') AS shift_days_in_window,
        (SELECT count(*) FROM flagged WHERE is_new AND kind = 'REGIME') AS new_regime_changes,
        (SELECT count(*) FROM flagged WHERE is_new AND kind = 'SHIFT') AS new_shift_days,
        (SELECT coalesce(string_agg(strftime(d, '%Y-%m-%d') || ' ' || subject || ' ' || detail, chr(10) ORDER BY d, kind), '') FROM flagged WHERE is_new) AS new_events,
        (SELECT coalesce(string_agg(strftime(d, '%Y-%m-%d') || ' ' || subject || ' ' || detail, chr(10) ORDER BY d DESC), '') FROM (SELECT * FROM events WHERE kind = 'REGIME' ORDER BY d DESC LIMIT 3)) AS recent_regime_changes,
        (SELECT count(*) FROM spread_def WHERE reject_reason IS NOT NULL) AS spreads_rejected,
        (SELECT coalesce(string_agg(coalesce(name, '(blank)') || ' (' || reject_reason || ')', '; '), '') FROM spread_def WHERE reject_reason IS NOT NULL) AS rejected);

  - id: save_cursor
    type: io.kestra.plugin.core.kv.Set
    key: treasury_curve_last_date
    value: "{{ outputs.analyse.outputs[0].row.next_cursor }}"
    description: Never moves backwards, so a short or partial download cannot make old events look new on the next run.

  - id: alert_if_needed
    type: io.kestra.plugin.core.flow.If
    description: Alerts on a newly confirmed inversion or un-inversion, a new day with a tenor move above the threshold, a curve older than four days, or rejected spread rows.
    condition: "{{ outputs.analyse.outputs[0].row.new_regime_changes > 0 or outputs.analyse.outputs[0].row.new_shift_days > 0 or outputs.analyse.outputs[0].row.stale or outputs.analyse.outputs[0].row.spreads_rejected > 0 }}"
    then:
      - id: warn
        type: io.kestra.plugin.core.log.Log
        level: WARN
        message: |
          Yield curve alert for {{ outputs.analyse.outputs[0].row.last_curve_date }} (stale {{ outputs.analyse.outputs[0].row.stale }}): {{ outputs.analyse.outputs[0].row.new_regime_changes }} regime changes, {{ outputs.analyse.outputs[0].row.new_shift_days }} days with moves >= {{ inputs.shift_threshold_bp }}bp.
          {{ outputs.analyse.outputs[0].row.new_events }}
          Rejected spreads: {{ outputs.analyse.outputs[0].row.rejected is empty ? 'none' : outputs.analyse.outputs[0].row.rejected }}
      - id: notify
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        allowFailure: true
        description: allowFailure keeps the load green when the webhook is not configured.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": {{ (':chart_with_downwards_trend: ' ~ outputs.analyse.outputs[0].row.slack_text ~ ' Execution ' ~ (kestra.url ?? '') ~ '/ui/executions/' ~ flow.namespace ~ '/' ~ flow.id ~ '/' ~ execution.id) | toJson }}
          }

  - id: summary
    type: io.kestra.plugin.core.log.Log
    message: |
      Par yield curve {{ outputs.analyse.outputs[0].row.first_curve_date }} to {{ outputs.analyse.outputs[0].row.last_curve_date }}, {{ outputs.analyse.outputs[0].row.curve_dates }} curve dates{{ outputs.analyse.outputs[0].row.is_baseline ? ', BASELINE run (history only, no alerts)' : '' }}.
      Latest: {{ outputs.analyse.outputs[0].row.latest_curve }}
      Spreads: {{ outputs.analyse.outputs[0].row.spread_status }}
      Latest move: {{ outputs.analyse.outputs[0].row.latest_move }}
      In window: {{ outputs.analyse.outputs[0].row.regime_changes_in_window }} confirmed regime changes, {{ outputs.analyse.outputs[0].row.shift_days_in_window }} days with a tenor move >= {{ inputs.shift_threshold_bp }}bp. New since last run: {{ outputs.analyse.outputs[0].row.new_regime_changes }} regime changes, {{ outputs.analyse.outputs[0].row.new_shift_days }} shift days.
      Most recent regime changes:
      {{ outputs.analyse.outputs[0].row.recent_regime_changes }}

outputs:
  - id: summary
    type: JSON
    value: "{{ outputs.analyse.outputs[0].row }}"
  - id: events_csv
    type: FILE
    value: "{{ outputs.analyse.outputFiles.events_csv }}"
  - id: spreads_csv
    type: FILE
    value: "{{ outputs.analyse.outputFiles.spreads_csv }}"

extend:
  title: Treasury Yield Curve Inversion and Daily Shift Alert
  metaTitle: US Treasury Yield Curve Inversion and Shift Alert with DuckDB | Kestra
  shortDescription: Load the US Treasury daily par yield curve every weekday evening, track 2s10s, 3m10y and 5s30s inversions with a confirmation rule against whipsaw, and alert on new regime changes or large day-over-day moves at any tenor.
  metaDescription: Track US Treasury 2s10s and 3m10y inversions with a whipsaw filter and alert on large daily yield moves, using DuckDB and KV state in Kestra.
  description: |
    Yield-curve inversions and sharp daily moves drive hedging, ALM and funding decisions, but the raw signal is noisy: on January 2025 to October 2026 data, 3m10y changed sign 34 times day to day, but only 12 of those flips lasted three curve dates. This flow loads the official US Treasury par yield curve, applies a confirmation rule so only sustained inversions and un-inversions count, and alerts once per new event. All data comes from the live Treasury endpoint; no inputs are sample data.

    ## How it works

    1. A `Schedule` trigger runs at 18:30 New York time on weekdays, after Treasury publishes the day's curve.
    2. `fetch` (Parallel) downloads the previous and current calendar year as CSV from `home.treasury.gov`, one request each, with retries. An empty current-year file (first days of January) is allowed and skipped.
    3. `last_processed` reads the latest curve date already reported from KV. Without it the run is a `BASELINE`: it reports history but alerts on nothing.
    4. `analyse` (DuckDB) unpivots both files by column name (Treasury added the 4-month bill in 2022 and the 1.5-month bill in 2025, so columns differ by year) and validates the `spreads` input against the tenors actually published. Per spread it groups consecutive curve dates with the same sign into runs. A regime change is a run of at least `confirm_days` dates whose sign differs from the previous confirmed run, dated on the day it was confirmed. Tenor moves compare each curve with the previous published curve date only.
    5. `save_cursor` stores the newest curve date in KV; it never moves backwards.
    6. `alert_if_needed` (If) logs a WARN and posts to Slack on a new confirmed regime change, a new day with a tenor move of at least `shift_threshold_bp`, a curve older than four days, or rejected spread rows.

    ## What you get

    - Current status per spread (sign, level in bp, regime start date, pending flips that are not yet confirmed).
    - The latest 2y/10y move classified as bull or bear steepener or flattener.
    - `events_csv` (every regime change and shift day in the window, with an `is_new` flag) and `spreads_csv` (daily spread history).

    ## Who it's for

    - Treasury, ALM and risk teams that watch curve shape for hedging and funding.
    - Fixed-income analysts who want a clean inversion signal instead of daily noise.

    ## Why orchestrate this with Kestra

    - Two downloads run in parallel with retries, and the whole calculation is one reviewable SQL task.
    - A KV cursor makes re-runs idempotent: each event is alerted once.

    ## Prerequisites

    - Kestra 2.0 with the JDBC DuckDB plugin and the Slack plugin.
    - Outbound HTTPS to `home.treasury.gov` (no API key).

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack incoming webhook (optional; without it the WARN log still records the alert).

    ## Quick start

    1. Execute with the defaults: a `BASELINE` run over about 450 curve dates with the current status of 2s10s, 3m10y and 5s30s.
    2. Execute again: nothing new.
    3. Add the Slack secret and adjust `spreads`, `confirm_days` and `shift_threshold_bp`.

    ## How to extend

    - Add more spreads, for example `2s5s` or the 10y/30y, using the Treasury column labels.
    - Load the real yield curve (`daily_treasury_real_yield_curve`) the same way to track breakevens.
    - Trigger a hedge-revaluation flow with a Flow trigger when a regime change is confirmed.

    ## Links

    - [Treasury daily par yield curve rates](https://home.treasury.gov/resource-center/data-chart-center/interest-rates/TextView?type=daily_treasury_yield_curve)
    - [Interest rate data methodology](https://home.treasury.gov/policy-issues/financing-the-government/interest-rate-statistics/treasury-yield-curve-methodology)
    - [DuckDB Queries](https://kestra.io/plugins/plugin-jdbc-duckdb/io.kestra.plugin.jdbc.duckdb.queries)
    - [Parallel](https://kestra.io/plugins/core/flow/io.kestra.plugin.core.flow.parallel)
    - [Slack Incoming Webhook](https://kestra.io/plugins/plugin-notifications/slack/io.kestra.plugin.slack.notifications.slackincomingwebhook)
  tags:
    - Data
  subTags:
    - Monitoring & Alerting
  ee: false
  demo: false
