id: ssm-parameter-audit
namespace: company.finops

description: |
  Audits SSM Parameter Store for stale parameters, duplicates, and plaintext
  secrets. Parameter sprawl is a security and operability problem — this flow
  reports parameters untouched for 180+ days and String-typed values that look
  like secrets but aren't SecureStrings.

inputs:
  - id: aws_regions
    type: ARRAY
    itemType: STRING
    defaults: ["us-east-1"]
    description: AWS regions to audit Parameter Store in.
  - id: stale_days
    type: INT
    defaults: 180
    description: Parameters unmodified for this many days count as stale (default 180).

tasks:
  - id: check_params
    type: io.kestra.plugin.core.flow.ForEach
    description: Audit Parameter Store region by region.
    values: "{{ inputs.aws_regions }}"
    tasks:
      - id: audit_region
        type: io.kestra.plugin.aws.cli.AwsCLI
        description: Find stale params, duplicates, and plaintext secrets in Parameter Store.
        commands:
          - |
            REGION="{{ taskrun.value }}"
            STALE={{ inputs.stale_days }}
            CUTOFF_EPOCH=$(date -u -d "$STALE days ago" +%s)
            echo "Auditing SSM parameters in $REGION (stale threshold: $STALE days)"
            aws ssm describe-parameters --region "$REGION" \
              --query 'Parameters[].[Name,Type,LastModifiedDate,Version]' --output json > /tmp/params.json
            python3 -c "
            import json, datetime
            cutoff = $CUTOFF_EPOCH
            params = json.load(open('/tmp/params.json'))
            stale, plaintext, seen, dupes = [], [], set(), set()
            secret_words = ('password', 'secret', 'token', 'apikey', 'api_key', 'private')
            for name, ptype, modified, version in params:
                lname = name.lower()
                if name in seen:
                    dupes.add(name)
                seen.add(name)
                try:
                    epoch = int(datetime.datetime.fromisoformat(modified.replace('Z', '+00:00')).timestamp())
                except Exception:
                    continue
                age_days = (int(datetime.datetime.now(datetime.timezone.utc).timestamp()) - epoch) // 86400
                if epoch < cutoff:
                    stale.append(f'{name} ({age_days}d untouched)')
                if ptype == 'String' and any(w in lname for w in secret_words):
                    plaintext.append(f'{name} (String, not SecureString)')
                print(f'param {name}: type={ptype} age={age_days}d')
            open('/tmp/stale.txt', 'w').write('\n'.join(stale))
            open('/tmp/plain.txt', 'w').write('\n'.join(plaintext))
            open('/tmp/dupes.txt', 'w').write('\n'.join(sorted(dupes)))
            print(f'STALE_N={len(stale)} PLAIN_N={len(plaintext)} DUPE_N={len(dupes)}')
            "
            STALE_N=$(wc -l < /tmp/stale.txt | tr -d ' '); PLAIN_N=$(wc -l < /tmp/plain.txt | tr -d ' '); DUPE_N=$(wc -l < /tmp/dupes.txt | tr -d ' ')
            STALE_LIST=$(paste -sd' ' /tmp/stale.txt | head -c 800)
            PLAIN_LIST=$(paste -sd' ' /tmp/plain.txt | head -c 800)
            DUPE_LIST=$(paste -sd' ' /tmp/dupes.txt | head -c 800)
            TOTAL=$((STALE_N + PLAIN_N + DUPE_N))
            if [ "$TOTAL" -gt 0 ]; then HAS_ISSUES=true; else HAS_ISSUES=false; fi
            echo "HAS_ISSUES=$HAS_ISSUES"
            echo "STALE_N=$STALE_N"
            echo "PLAIN_N=$PLAIN_N"
            echo "DUPE_N=$DUPE_N"
            echo "STALE_LIST=$STALE_LIST"
            echo "PLAIN_LIST=$PLAIN_LIST"
            echo "DUPE_LIST=$DUPE_LIST"
            echo "REGION_DONE=$REGION"
        env:
          AWS_ACCESS_KEY_ID: "{{ secret('AWS_ACCESS_KEY_ID') }}"
          AWS_SECRET_ACCESS_KEY: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
          AWS_DEFAULT_REGION: "{{ taskrun.value }}"
      - id: notify_region
        type: io.kestra.plugin.core.flow.If
        description: Report parameter issues, stay quiet when the store is tidy.
        condition: "{{ outputs.audit_region.vars.HAS_ISSUES == 'true' }}"
        then:
          - id: slack_audit
            type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
            url: "{{ secret('SLACK_WEBHOOK_URL') }}"
            payload: |
              {
                "text": ":mag: SSM Parameter Store audit `{{ outputs.audit_region.vars.REGION_DONE }}` — *{{ outputs.audit_region.vars.STALE_N }}* stale, *{{ outputs.audit_region.vars.PLAIN_N }}* plaintext secrets, *{{ outputs.audit_region.vars.DUPE_N }}* duplicates.\nStale: `{{ outputs.audit_region.vars.STALE_LIST }}`\nPlaintext secrets: `{{ outputs.audit_region.vars.PLAIN_LIST }}`\nDuplicates: `{{ outputs.audit_region.vars.DUPE_LIST }}`\nMigrate plaintext secrets to SecureString and delete what nothing reads."
              }
        else:
          - id: log_clean
            type: io.kestra.plugin.core.log.Log
            message: "SSM Parameter Store is tidy in {{ outputs.audit_region.vars.REGION_DONE }} — no stale params, plaintext secrets, or duplicates."

triggers:
  - id: weekly
    type: io.kestra.plugin.core.trigger.Schedule
    description: Weekly on Sunday at 06:00 UTC. Shipped disabled; enable after your first manual run.
    cron: "0 6 * * 0"
    disabled: true

extend:
  title: SSM Parameter Audit
  metaTitle: Audit SSM Parameter Store Sprawl and Secrets | Kestra
  shortDescription: Audit SSM Parameter Store for stale parameters, duplicates, and plaintext secrets stored as String instead of SecureString.
  metaDescription: Parameter sprawl hides plaintext secrets. This flow audits SSM Parameter Store for stale, duplicate, and insecure params weekly.
  description: |
    Parameter Store accumulates cruft: parameters from deleted services, duplicated names across paths, and — worst of all — secrets stored as plaintext `String` instead of `SecureString`, visible to anyone with read access. This blueprint audits all three problems in one pass.

    ## How it works

    1. A Schedule trigger fires weekly on Sunday at 06:00 UTC (shipped disabled).
    2. A ForEach loop audits each region in `aws_regions`.
    3. Per region, the flow describes all parameters with their type, last-modified date, and version.
    4. Parameters unmodified for `stale_days` (default 180) are flagged stale; names seen twice are flagged duplicates; `String`-typed parameters whose names contain password/secret/token/apikey/private are flagged as plaintext secrets.
    5. An `If` task posts a Slack report with the three lists. No parameter values are ever read or logged.

    ## What you get

    - A weekly report of stale parameters, duplicate names, and plaintext secrets.
    - Security signal: secrets that should be SecureStrings, without ever exposing values.
    - Multi-region coverage in one run.
    - Silence when the store is tidy.

    ## Who it's for

    Platform and security teams doing cloud hygiene who suspect Parameter Store has grown beyond what anyone remembers.

    ## Why orchestrate this with Kestra

    This audit joins metadata across every parameter in every region on a schedule — tedious by hand, trivial as a flow. The stale threshold is an input, every run is logged, and the report lands in Slack where the cleanup gets owned.

    ## Prerequisites

    - AWS credentials with `ssm:DescribeParameters` permission (read-only metadata, values never fetched).
    - A Slack incoming webhook URL.

    ### Secrets

    - `AWS_ACCESS_KEY_ID`: AWS access key for the SSM API calls.
    - `AWS_SECRET_ACCESS_KEY`: AWS secret key for the SSM API calls.
    - `SLACK_WEBHOOK_URL`: Incoming webhook URL for the audit report.

    ## Quick start

    1. Add the three secrets above to your Kestra namespace.
    2. Set `aws_regions` to the regions where you store parameters.
    3. Run manually once and review the three lists.
    4. Enable the weekly schedule trigger.

    ## How to extend

    - Add an approval-gated step that deletes stale parameters after review.
    - Cross-reference parameters against CloudFormation/Terraform state to find orphaned ones.
    - Alert immediately (not weekly) when a new plaintext secret appears.

    ## Links

    - [Kestra AWS plugins](https://kestra.io/plugins)
    - [Kestra Slack plugins](https://kestra.io/plugins)
    - [SSM Parameter Store](https://docs.aws.amazon.com/systems-manager/latest/userguide/systems-manager-parameter-store.html)
    - [SecureString parameters](https://docs.aws.amazon.com/systems-manager/latest/userguide/sysman-paramstore-securestring.html)
  tags:
    - Infrastructure
  subTags:
    - Day 2 Operations
    - Monitoring & Alerting
  ee: false
  demo: false
