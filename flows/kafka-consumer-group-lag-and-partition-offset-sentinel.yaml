id: kafka-consumer-group-lag-and-partition-offset-sentinel
namespace: company.team

description: |
  Audits Kafka consumer group offsets against partition high-water marks to detect stalled consumers, partition skew, and message backlogs.

inputs:
  - id: bootstrap_servers
    type: STRING
    displayName: Kafka Bootstrap Servers
    defaults: "kafka.internal:9092"
    description: Host and port for Kafka cluster broker nodes.

  - id: consumer_group
    type: STRING
    displayName: Consumer Group ID
    defaults: "order-processing-group"
    description: Consumer group identifier to evaluate for partition offset lag.

  - id: topic
    type: STRING
    displayName: Topic Name
    defaults: "orders.v1"
    description: Target Kafka topic to audit partition distribution and offsets.

  - id: max_total_lag_threshold
    type: INT
    displayName: Max Total Lag Threshold
    defaults: 5000
    description: Cumulative message backlog across all partitions before triggering an alert.

  - id: max_partition_lag_threshold
    type: INT
    displayName: Max Partition Lag Threshold
    defaults: 1000
    description: Maximum permissible lag on any single partition before triggering a partition-level alert.

  - id: slack_channel
    type: STRING
    displayName: Slack Channel
    defaults: "#streaming-alerts"
    description: Destination Slack channel for streaming lag notifications.

triggers:
  - id: recurring_kafka_lag_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

tasks:
  - id: probe_kafka_lag
    type: io.kestra.plugin.scripts.python.Script
    description: Probes Kafka cluster metadata and partition offsets using confluent-kafka to compute partition lag and consumer health.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install confluent-kafka
    env:
      BOOTSTRAP_SERVERS: "{{ inputs.bootstrap_servers }}"
      CONSUMER_GROUP: "{{ inputs.consumer_group }}"
      TOPIC: "{{ inputs.topic }}"
      MAX_TOTAL_LAG: "{{ inputs.max_total_lag_threshold }}"
      MAX_PARTITION_LAG: "{{ inputs.max_partition_lag_threshold }}"
      SASL_USERNAME: "{{ secret('KAFKA_SASL_USERNAME') }}"
      SASL_PASSWORD: "{{ secret('KAFKA_SASL_PASSWORD') }}"
    outputFiles:
      - kafka_partition_lag.json
    script: |
      import os
      import sys
      import json
      from confluent_kafka import Consumer, TopicPartition
      from confluent_kafka.admin import AdminClient
      from kestra import Kestra

      bootstrap = os.environ.get("BOOTSTRAP_SERVERS", "localhost:9092")
      group_id = os.environ.get("CONSUMER_GROUP", "order-processing-group")
      topic_name = os.environ.get("TOPIC", "orders.v1")
      max_total_lag = int(os.environ.get("MAX_TOTAL_LAG", 5000))
      max_part_lag = int(os.environ.get("MAX_PARTITION_LAG", 1000))
      sasl_user = os.environ.get("SASL_USERNAME", "")
      sasl_pass = os.environ.get("SASL_PASSWORD", "")

      conf = {
          "bootstrap.servers": bootstrap,
          "group.id": f"kestra-sentinel-{group_id}",
          "enable.auto.commit": False,
          "auto.offset.reset": "latest"
      }
      if sasl_user and sasl_pass:
          conf["security.protocol"] = "SASL_SSL"
          conf["sasl.mechanism"] = "PLAIN"
          conf["sasl.username"] = sasl_user
          conf["sasl.password"] = sasl_pass

      try:
          consumer = Consumer(conf)
          admin = AdminClient({"bootstrap.servers": bootstrap})
          metadata = admin.list_topics(topic=topic_name, timeout=10)
          
          if topic_name not in metadata.topics:
              print(f"ERROR: Topic {topic_name} does not exist on cluster {bootstrap}", file=sys.stderr)
              sys.exit(1)

          topic_meta = metadata.topics[topic_name]
          partitions = [TopicPartition(topic_name, p) for p in topic_meta.partitions.keys()]
          partition_count = len(partitions)
          
          eval_conf = dict(conf)
          eval_conf["group.id"] = group_id
          target_consumer = Consumer(eval_conf)
          committed_offsets = target_consumer.committed(partitions, timeout=10)
          
          total_lag = 0
          max_lag_seen = 0
          worst_partition = 0
          partition_lags = {}

          for p, tp in zip(partitions, committed_offsets):
              low, high = consumer.get_watermark_offsets(p, timeout=10)
              committed = tp.offset if tp.offset >= 0 else low
              lag = max(0, high - committed)
              partition_lags[p.partition] = {
                  "high_watermark": high,
                  "committed_offset": committed,
                  "lag": lag
              }
              total_lag += lag
              if lag > max_lag_seen:
                  max_lag_seen = lag
                  worst_partition = p.partition

          target_consumer.close()
          consumer.close()
      except Exception as e:
          print(f"ERROR: Kafka probe connection failure: {e}", file=sys.stderr)
          sys.exit(1)

      is_total_breach = total_lag > max_total_lag
      is_partition_breach = max_lag_seen > max_part_lag

      result = {
          "total_lag": total_lag,
          "max_partition_lag": max_lag_seen,
          "worst_partition": worst_partition,
          "partition_count": partition_count,
          "is_total_breach": is_total_breach,
          "is_partition_breach": is_partition_breach,
          "partition_lags": partition_lags
      }

      with open("kafka_partition_lag.json", "w", encoding="utf-8") as f:
          json.dump(result, f, indent=2)

      print(f"Kafka lag audit complete: total_lag={total_lag}, max_partition_lag={max_lag_seen}")
      Kestra.outputs(result)

  - id: evaluate_lag
    type: io.kestra.plugin.core.flow.If
    description: Branch to Slack alert if lag threshold is breached.
    condition: "{{ outputs.probe_kafka_lag.vars.is_total_breach or outputs.probe_kafka_lag.vars.is_partition_breach }}"
    then:
      - id: notify_slack_lag_breach
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "{{ inputs.slack_channel }}",
            "text": "🚨 *Kafka Lag Alert*: Consumer group `{{ inputs.consumer_group }}` on topic `{{ inputs.topic }}` has total lag *{{ outputs.probe_kafka_lag.vars.total_lag }}* (worst partition {{ outputs.probe_kafka_lag.vars.worst_partition }}: {{ outputs.probe_kafka_lag.vars.max_partition_lag }})."
          }

errors:
  - id: alert_probe_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "{{ inputs.slack_channel }}",
        "text": "⚠️ *Kafka Lag Sentinel Failed*: Execution {{ execution.id }} on topic `{{ inputs.topic }}` encountered an error."
      }

outputs:
  - id: total_lag
    type: INT
    value: "{{ outputs.probe_kafka_lag.vars.total_lag }}"
  - id: max_partition_lag
    type: INT
    value: "{{ outputs.probe_kafka_lag.vars.max_partition_lag }}"
  - id: worst_partition
    type: INT
    value: "{{ outputs.probe_kafka_lag.vars.worst_partition }}"

extend:
  title: Kafka Consumer Group Lag and Partition Offset Sentinel
  shortDescription: Audits Kafka consumer group offsets against partition high-water marks to detect stalled consumers.
  metaTitle: Kafka Consumer Group Lag Sentinel with Kestra
  metaDescription: Audits Kafka consumer group offsets against partition high-water marks to detect stalled consumers.
  description: |
    Audits Kafka consumer group offsets against partition high-water marks to detect stalled consumers, partition skew, and message backlogs.
  tags:
    - Data
    - Infrastructure
  subTags:
    - Day 2 Operations
    - Monitoring & Alerting
  ee: false
  demo: false
