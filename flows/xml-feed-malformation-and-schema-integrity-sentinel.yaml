id: xml-feed-malformation-and-schema-integrity-sentinel
namespace: company.integration

inputs:
  - id: expected_records_count
    type: INT
    defaults: 3
    description: Minimum number of valid payment or transaction records expected in the XML feed.

  - id: simulate_malformed_feed
    type: BOOL
    defaults: false
    description: When true, stages an unclosed malformed XML payload to test automated quarantine.

  - id: root_element_name
    type: STRING
    defaults: payments
    description: Root XML element name assigned when re-serializing parsed records.

variables:
  alerts_channel: "#finops-alerts"

triggers:
  - id: schedule_periodic_xml_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"

tasks:
  - id: stage_incoming_xml_payload
    type: io.kestra.plugin.core.storage.Write
    extension: ".xml"
    content: >-
      {{ inputs.simulate_malformed_feed ? '<Document xmlns="urn:iso:std:iso:20022:tech:xsd:pain.001.001.03"><CstmrCdtTrfInitn><GrpHdr><MsgId>MSG-20261016-001</MsgId><NbOfTxs>3</NbOfTxs></GrpHdr><PmtInf><PmtInfId>PMT-001</PmtInfId><Amt Ccy="USD">15000.00</Amt><Cdtr><Nm>Acme Global Corp</Nm></Cdtr></PmtInf>' : '<?xml version="1.0" encoding="UTF-8"?><Document xmlns="urn:iso:std:iso:20022:tech:xsd:pain.001.001.03"><CstmrCdtTrfInitn><GrpHdr><MsgId>MSG-20261016-001</MsgId><NbOfTxs>3</NbOfTxs></GrpHdr><PmtInf><PmtInfId>PMT-001</PmtInfId><Amt Ccy="USD">15000.00</Amt><Cdtr><Nm>Acme Global Corp</Nm></Cdtr></PmtInf><PmtInf><PmtInfId>PMT-002</PmtInfId><Amt Ccy="EUR">4250.50</Amt><Cdtr><Nm>Novartis Europe SA</Nm></Cdtr></PmtInf><PmtInf><PmtInfId>PMT-003</PmtInfId><Amt Ccy="GBP">8920.00</Amt><Cdtr><Nm>London Freight Ltd</Nm></Cdtr></PmtInf></CstmrCdtTrfInitn></Document>' }}

  - id: parse_xml_transactions
    type: io.kestra.plugin.serdes.xml.XmlToIon
    from: "{{ outputs.stage_incoming_xml_payload.uri }}"

  - id: serialize_verified_xml
    type: io.kestra.plugin.serdes.xml.IonToXml
    from: "{{ outputs.parse_xml_transactions.uri }}"
    rootName: "{{ inputs.root_element_name }}"

  - id: classify_feed_integrity
    type: io.kestra.plugin.core.execution.Labels
    labels:
      feed_status: >-
        {{ (inputs.simulate_malformed_feed ? 'CRITICAL_MALFORMED_XML' : ((outputs.parse_xml_transactions.size | default(0)) >= inputs.expected_records_count ? 'COMPLIANT_INGESTION' : 'WARNING_BATCH_MISMATCH')) }}

  - id: handle_integrity_verdict
    type: io.kestra.plugin.core.flow.Switch
    value: "{{ taskrun.labels.feed_status }}"
    cases:
      CRITICAL_MALFORMED_XML:
        - id: alert_malformed_xml
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "channel": "{{ vars.alerts_channel }}",
              "text": "CRITICAL: Malformed B2B XML feed detected. Parser failed structural validation or encountered unexpected EOF. Raw payload moved to quarantine. Execution ID: {{ execution.id }}"
            }
        - id: quarantine_malformed_feed
          type: io.kestra.plugin.core.storage.Write
          extension: ".json"
          content: |
            {
              "quarantine_reason": "Structural XML parser failure or unclosed tags",
              "execution_id": "{{ execution.id }}",
              "quarantined_at": "{{ execution.startDate }}",
              "raw_xml_uri": "{{ outputs.stage_incoming_xml_payload.uri }}"
            }
      WARNING_BATCH_MISMATCH:
        - id: notify_batch_warning
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "channel": "{{ vars.alerts_channel }}",
              "text": "WARNING: XML transaction batch volume discrepancy. Extracted {{ outputs.parse_xml_transactions.size | default(0) }} records, expected minimum of {{ inputs.expected_records_count }}. Execution ID: {{ execution.id }}"
            }
      COMPLIANT_INGESTION:
        - id: notify_feed_compliant
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "channel": "{{ vars.alerts_channel }}",
              "text": "SUCCESS: B2B XML feed verified with 100% round-trip fidelity. Extracted and validated {{ outputs.parse_xml_transactions.size }} records. Verified XML ready at {{ outputs.serialize_verified_xml.uri }}. Execution ID: {{ execution.id }}"
            }

  - id: log_audit_ledger
    type: io.kestra.plugin.core.log.Log
    message: |
      B2B XML Data Interchange Audit Ledger:
      Feed Status: {{ taskrun.labels.feed_status }}
      Extracted Record Count: {{ outputs.parse_xml_transactions.size | default(0) }}
      Intermediate Ion URI: {{ outputs.parse_xml_transactions.uri | default('N/A') }}
      Re-serialized XML URI: {{ outputs.serialize_verified_xml.uri | default('N/A') }}
      Execution ID: {{ execution.id }}
      Timestamp: {{ execution.startDate }}

extend:
  title: XML Feed Malformation and Schema Integrity Sentinel
  metaTitle: XML Feed Malformation & Integrity Sentinel | Kestra
  shortDescription: Audits B2B financial and healthcare XML data feeds, validates bidirectional serialization fidelity, quarantines malformed drops, and alerts Slack.
  metaDescription: Audit financial and healthcare XML data feeds for malformations, validate bidirectional serialization fidelity, and alert Slack on payload corruption.
  description: |
    Critical financial transactions (ISO 20022 SEPA payment messages, SWIFT confirmations), healthcare interchanges (HL7 CDA / FHIR clinical feeds), and supply chain networks (UBL e-invoices, cXML purchase orders) depend universally on XML data exchange. When partner endpoints deliver malformed payloads with unclosed tags, encoding mismatches, or truncated records, downstream analytical pipelines and core accounting ledgers abruptly crash or fail reconciliation.

    This sentinel workflow automates the health verification and integrity gating of incoming XML feeds. Using Kestra native XML serialization tasks (`XmlToIon` and `IonToXml`), the workflow parses raw XML payloads, validates record volumes against expected delivery thresholds, performs bidirectional round-trip conversion testing to guarantee zero data loss, classifies integrity into tri-state operational tiers via Pebble conditions, isolates corrupted drops into dead-letter quarantine storage, and dispatches real-time triage alerts to operations teams via Slack.

    ## How it works

    1. An automated `Schedule` trigger awakens the workflow every 15 minutes to inspect incoming XML feeds.
    2. Incoming XML documents are staged in Kestra internal storage via `io.kestra.plugin.core.storage.Write`.
    3. The parsing task `io.kestra.plugin.serdes.xml.XmlToIon` parses XML nodes and converts hierarchical document trees into standardized Amazon Ion records, validating syntax and counting parsed transactions.
    4. A bidirectional round-trip task `io.kestra.plugin.serdes.xml.IonToXml` converts the parsed Ion records back into structured XML with the configured root element (`payments`), confirming that serialization properties and schema structures remain intact.
    5. A `Labels` execution task assesses extracted record counts and simulation parameters, categorizing health status into `COMPLIANT_INGESTION`, `WARNING_BATCH_MISMATCH`, or `CRITICAL_MALFORMED_XML`.
    6. A `Switch` flow-control task routes execution based on the evaluated integrity tier: malformed files trigger immediate Slack incident alerts and payload quarantine, while compliant batches trigger notification of downstream pipeline readiness.
    7. A final `Log` task outputs structured audit telemetry detailing record counts, intermediate storage URIs, and execution timestamps.

    ## What you get

    - Automated continuous validation of incoming B2B XML feeds without requiring manual engineer inspection.
    - Early detection of truncated, malformed, or syntax-corrupted XML payloads before downstream ETL ingestion.
    - Automated dead-letter quarantine isolating bad data drops into structured JSON artifacts for rapid incident post-mortems.
    - Multi-tiered Slack incident notifications directing on-call engineers straight to root-cause issues.
    - Comprehensive audit trail recording transaction volumes, storage URIs, and validation timestamps for regulatory compliance.

    ## Who it's for

    - FinOps and Accounting Engineers managing ISO 20022, SEPA, and banking integration feeds.
    - Healthcare Data Engineers processing HL7, FHIR, and insurance claim XML interchanges.
    - B2B Integration Architects responsible for partner EDI, UBL, and cXML data exchanges.

    ## Why orchestrate this with Kestra

    - Declarative YAML orchestration replaces fragile custom XML parsing scripts and fragile sed/awk pipelines with maintainable workflows.
    - Built-in pure-Java XML serialization primitives (`XmlToIon`, `IonToXml`) eliminate external XML CLI dependencies and heavy container runtimes.
    - Native internal storage abstraction manages large XML payloads and quarantined artifacts securely across distributed clusters.
    - Centralized namespace secrets management securely masks webhook tokens and storage credentials.

    ## Prerequisites

    - Kestra instance with default storage enabled (local or cloud storage backend).
    - An incoming Slack webhook URL for alert routing.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Incoming webhook URL for posting XML integrity alerts to the operations channel (required).

    ## Quick start

    1. Configure the `SLACK_WEBHOOK_URL` secret in your Kestra namespace.
    2. Import this blueprint into your Kestra instance.
    3. Click **Execute** with default parameters (`simulate_malformed_feed: false`) to verify clean parsing, round-trip serialization, and audit logging.
    4. Set `simulate_malformed_feed: true` and execute to verify that the sentinel catches corrupted feeds, generates quarantine artifacts, and dispatches Slack incident alerts.
    5. Enable the scheduled trigger for continuous automated feed monitoring.

    ## How to extend

    - Connect downstream database loading tasks (e.g., PostgreSQL, Snowflake, ClickHouse) inside the `COMPLIANT_INGESTION` branch to automatically ingest validated records.
    - Add XML Schema (XSD) schema validation tasks to enforce strict business rules on required child elements.
    - Integrate automated PagerDuty or Opsgenie alerts inside the `CRITICAL_MALFORMED_XML` branch for high-priority payment gateways.

    ## Links

    - [Kestra Serdes XML Plugin Documentation](https://kestra.io/plugins/plugin-serdes/tasks/xml)
    - [ISO 20022 Universal Financial Industry Message Scheme](https://www.iso20022.org/)
  tags:
    - Data
  subTags:
    - Testing & Quality
    - File & Data Processing Basics
  ee: false
  demo: false
