id: ensembl-vep-variant-annotation-enrichment
namespace: company.team

description: |
  Annotate variants with the Ensembl Variant Effect Predictor REST API: gene, consequence, impact, HGVSc/HGVSp,
  SIFT, PolyPhen, rsIDs, ClinVar significance and gnomAD frequencies on the MANE Select (or canonical) transcript.
  REF alleles are checked against the chosen assembly first, results are cached per variant in Parquet, and
  cached variants are re-annotated only when the Ensembl release changes. Pathogenic and HIGH-impact variants
  that are new or reclassified go to Slack.

inputs:
  - id: variants
    type: STRING
    description: |
      One variant per line: HGVS (`NM_000546.6:c.524G>A`), `chrom pos ref alt` (separated by spaces, `:`, `-` or `_`,
      VCF-style anchored indels), or tab-separated VCF data lines. `#` lines are comments. Ignored when `vcf_file`
      is uploaded. The defaults are well-known clinical variants on GRCh38, one duplicate written gnomAD-style, one
      TP53 variant typed with the transcript-strand base (REF_MISMATCH) and one HGVS with a transcript version that does not exist.
    defaults: |
      # BRAF V600E, then the same variant written gnomAD-style (deduplicated)
      7 140753336 A T
      chr7-140753336-A-T
      # CFTR F508del (VCF-style anchored deletion), HBB E6V sickle cell, BRCA1 c.68_69del
      7 117559590 ATCT A
      chr11:5227002:T:A
      17 43124027 ACT A
      # APOE e4 (rs429358), HFE C282Y, KRAS G12D, MTHFR C677T (common, benign)
      19 44908684 T C
      6 26092913 G A
      12 25245350 C T
      1 11796321 G A
      # TP53 R175H typed with the transcript-strand base by mistake
      17 7675088 G A
      # TP53 R175H and BRCA1 c.5266dup as HGVS, then a transcript version that does not exist
      NM_000546.6:c.524G>A
      NM_007294.4:c.5266dup
      NM_000546.99:c.524G>A

  - id: vcf_file
    type: FILE
    required: false
    description: Optional small uncompressed VCF (or a text file in the `variants` format). Takes precedence over `variants`. Multi-allelic ALTs are split; symbolic ALTs (`<DEL>`) and breakends are reported as UNSUPPORTED.

  - id: assembly
    type: SELECT
    values: [GRCh38, GRCh37]
    defaults: GRCh38
    description: GRCh38 uses rest.ensembl.org, GRCh37 uses grch37.rest.ensembl.org. The run stops if most new REF alleles match the other assembly or the VCF header declares it.

  - id: alert_flags
    type: MULTISELECT
    values: [PATHOGENIC, HIGH_IMPACT, CONFLICTING, SITE_PATHOGENIC]
    defaults: [PATHOGENIC, HIGH_IMPACT]
    description: |
      Flags that trigger a Slack alert. PATHOGENIC: ClinVar pathogenic or likely pathogenic for this allele.
      CONFLICTING: also benign for this allele. SITE_PATHOGENIC: pathogenic at the same rsID but Ensembl did not tie
      it to this allele (often another ALT or a shifted indel). HIGH_IMPACT: VEP impact HIGH on the chosen transcript.

  - id: include_cache
    type: BOOL
    defaults: false
    description: Also re-check every cached variant. Costs nothing on the same release; after a new Ensembl release all of them are re-annotated and reclassifications are alerted. The schedule sets it.

  - id: force_reannotate
    type: BOOL
    defaults: false
    description: Re-annotate the input even when it is cached with the current release.

  - id: cache_key
    type: STRING
    defaults: ensembl_vep_cache
    description: KV key prefix for the Parquet cache pointer; the assembly is appended, so GRCh37 and GRCh38 never mix.

triggers:
  - id: after_variant_calling
    type: io.kestra.plugin.core.trigger.Flow
    description: Annotates each new VCF from the upstream pipeline. Point it at your flow; it must expose a FILE output named `vcf`.
    inputs:
      vcf_file: "{{ trigger.outputs.vcf }}"
    dependsOn:
      - namespace: company.team
        flowId: variant-calling
        states: [SUCCESS]

  - id: weekly_release_check
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 7 * * 1"
    description: Ensembl ships about four releases a year. A weekly run serves everything from the cache while the release is unchanged and re-annotates it all once it changes.
    inputs:
      include_cache: true

tasks:
  - id: inline_variants
    type: io.kestra.plugin.core.storage.Write
    description: Puts the inline list in internal storage so it is read the same way as an uploaded file.
    content: "{{ inputs.variants }}"
    extension: .txt

  - id: ensembl_release
    type: io.kestra.plugin.core.http.Request
    uri: "{{ inputs.assembly == 'GRCh37' ? 'https://grch37.rest.ensembl.org' : 'https://rest.ensembl.org' }}/info/software"
    headers:
      Accept: application/json
      User-Agent: kestra-ensembl-vep-variant-annotation-enrichment/1.0 (+https://kestra.io/blueprints)
    description: Current Ensembl release, e.g. `{"release":116}`. Cache rows from another release are re-annotated.
    retry:
      type: exponential
      interval: PT10S
      maxInterval: PT2M
      maxAttempts: 4

  - id: previous_cache
    type: io.kestra.plugin.core.kv.Get
    key: "{{ inputs.cache_key }}_{{ inputs.assembly | lower }}"
    errorOnMissing: false
    description: JSON pointer to the Parquet cache written by the last run; missing on the first run.

  - id: bootstrap
    type: io.kestra.plugin.core.flow.If
    description: First run only. Writes an empty cache with the right schema so later tasks have one code path.
    condition: "{{ outputs.previous_cache.value is not defined or outputs.previous_cache.value is empty }}"
    then:
      - id: empty_cache
        type: io.kestra.plugin.jdbc.duckdb.Queries
        url: "jdbc:duckdb:"
        fetchType: NONE
        outputFiles:
          - cache
        sql: |
          CREATE TABLE cache (
            key VARCHAR, input_type VARCHAR, query VARCHAR, ensembl_release VARCHAR, chrom VARCHAR, start BIGINT,
            allele_string VARCHAR, variant_class VARCHAR, most_severe_consequence VARCHAR, gene_symbol VARCHAR,
            gene_id VARCHAR, transcript_id VARCHAR, transcript_source VARCHAR, mane_select VARCHAR, consequence VARCHAR,
            impact VARCHAR, worst_impact VARCHAR, hgvsc VARCHAR, hgvsp VARCHAR, sift VARCHAR, polyphen VARCHAR,
            rsids VARCHAR, clinvar_significance VARCHAR, clinvar_scope VARCHAR, somatic_classification VARCHAR,
            gnomade_af DOUBLE, gnomadg_af DOUBLE, gnomad_grpmax VARCHAR, gnomad_grpmax_af DOUBLE, flags VARCHAR,
            annotated_at TIMESTAMP
          );
          COPY cache TO '{{ outputFiles.cache }}' (FORMAT PARQUET);

  - id: cache_index
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: Hands the annotation step the cached keys with their release, so it only calls VEP for what is missing or stale.
    url: "jdbc:duckdb:"
    fetchType: NONE
    inputFiles:
      previous.parquet: "{{ outputs.previous_cache.value.cache ?? outputs.empty_cache.outputFiles.cache }}"
    outputFiles:
      - keys
    sql: |
      COPY (SELECT key, input_type, query, ensembl_release, CAST(annotated_at AS VARCHAR) AS annotated_at
            FROM read_parquet('previous.parquet')) TO '{{ outputFiles.keys }}' (HEADER, DELIMITER ',');

  - id: annotate
    type: io.kestra.plugin.scripts.python.Script
    description: |
      Standard-library Python. Parses and deduplicates the input, skips variants cached with the current release,
      checks REF alleles of never-seen variants with `POST /sequence/region` (50 per request; when most
      mismatch, the other assembly is checked too), then calls `POST /vep/homo_sapiens/region` and `/hgvs` with at most
      200 variants per request, paced under 15 requests per second and honouring 429 `Retry-After`. Variants VEP
      drops from a batch are re-sent alone to get the error reason; a batch rejected with HTTP 400 is split.
    containerImage: python:3.13-slim
    inputFiles:
      input.txt: "{{ inputs.vcf_file ?? outputs.inline_variants.uri }}"
      cache.csv: "{{ outputs.cache_index.outputFiles.keys }}"
    outputFiles:
      - annotations.ndjson
      - items.ndjson
    env:
      ASSEMBLY: "{{ inputs.assembly }}"
      RELEASE: "{{ fromJson(outputs.ensembl_release.body).release }}"
      FORCE: "{{ inputs.force_reannotate }}"
      INCLUDE_CACHE: "{{ inputs.include_cache }}"
    script: |
          import csv, json, os, re, sys, time, urllib.error, urllib.request

          HOSTS = {"GRCh38": "https://rest.ensembl.org", "GRCh37": "https://grch37.rest.ensembl.org"}
          ASSEMBLY, RELEASE = os.environ["ASSEMBLY"], os.environ["RELEASE"]
          OTHER = "GRCh37" if ASSEMBLY == "GRCh38" else "GRCh38"
          FORCE, INCLUDE_CACHE = os.environ["FORCE"] == "true", os.environ["INCLUDE_CACHE"] == "true"
          VEP_PARAMS = "canonical=1&mane=1&hgvs=1&variant_class=1&af_gnomade=1&af_gnomadg=1"
          HEADERS = {"Content-Type": "application/json", "Accept": "application/json",
                     "User-Agent": "kestra-ensembl-vep-variant-annotation-enrichment/1.0 (+https://kestra.io/blueprints)"}
          IMPACT = {"HIGH": 3, "MODERATE": 2, "LOW": 1, "MODIFIER": 0}
          REGION = re.compile(r"(?:chr)?([0-9]{1,2}|X|Y|M|MT)[\s:_-]+([0-9]+)[\s:_-]+([ACGTN]+)[\s:_/>-]+([ACGTN]+)", re.I)
          HGVS = re.compile(r"[A-Za-z0-9_.]+(?:\([A-Za-z0-9_.]+\))?:[cgmnr]\.\S+")
          stats = {"requests": 0, "retries": 0, "last": 0.0}

          def post(url, body):
              for attempt in range(6):
                  time.sleep(max(0, stats["last"] + 1 / 15 - time.time()))  # Ensembl allows 15 requests per second
                  stats["requests"] += 1
                  stats["last"] = time.time()
                  req = urllib.request.Request(url, data=json.dumps(body).encode(), headers=HEADERS, method="POST")
                  try:
                      with urllib.request.urlopen(req, timeout=180) as r:
                          return json.load(r)
                  except urllib.error.HTTPError as e:
                      if e.code == 400:
                          return {"error": e.read().decode("utf-8", "replace")[:300]}
                      if e.code not in (429, 500, 502, 503, 504) or attempt == 5:
                          raise
                      delay, why = float(e.headers.get("Retry-After") or 2 ** (attempt + 1)), f"HTTP {e.code}"
                  except urllib.error.URLError:
                      if attempt == 5:
                          raise
                      delay, why = 2 ** (attempt + 1), "network error"
                  stats["retries"] += 1
                  print(f"Ensembl {why}, retrying in {delay:.1f}s")
                  time.sleep(delay)

          # 1. Parse the inline list or VCF: one item per ALT allele, deduplicated on a normalised key
          items, header_assembly = {}, None
          with open("input.txt", encoding="utf-8", errors="replace") as f:
              for n, raw in enumerate(f, 1):
                  line, cols = raw.strip(), raw.rstrip("\r\n").split("\t")
                  if line.startswith("##"):
                      m = re.search(r"GRCh3[78]|hg19|hg38|b37", line) if re.search("reference|assembly", line) else None
                      header_assembly = header_assembly or (m and {"hg19": "GRCh37", "b37": "GRCh37", "hg38": "GRCh38"}.get(m.group(), m.group()))
                      continue
                  if not line or line.startswith("#"):
                      continue
                  if len(cols) >= 5 and cols[1].isdigit():
                      parsed = [("region", cols[0], cols[1], cols[3].upper(), alt) for alt in cols[4].upper().split(",")]
                  elif HGVS.fullmatch(line):
                      parsed = [("hgvs", line)]
                  elif REGION.fullmatch(line):
                      g = REGION.fullmatch(line).groups()
                      parsed = [("region", g[0], g[1], g[2].upper(), g[3].upper())]
                  else:
                      parsed = [("invalid",)]
                  for p in parsed:
                      item = {"line": n, "input": " ".join(line.split())[:200], "source": "input", "input_type": p[0]}
                      if p[0] == "hgvs":
                          item.update(key="hgvs|" + p[1], query=p[1])
                      elif p[0] == "invalid":
                          item.update(key=None, status="INVALID", detail="not HGVS, `chrom pos ref alt` or a VCF data line (rsIDs are not accepted)")
                      else:
                          chrom = {"M": "MT"}.get(p[1].upper().removeprefix("CHR"), p[1].upper().removeprefix("CHR"))
                          ref, alt = p[3], p[4]
                          item.update(key=f"{chrom}-{p[2]}-{ref}-{alt}", query=f"{chrom} {p[2]} {ref} {alt}")
                          if alt in (".", "*") or alt.startswith("<") or "[" in alt or "]" in alt:
                              item.update(key=None, status="UNSUPPORTED", detail=f"ALT {alt} is symbolic, a breakend or a spanning deletion")
                          elif not re.fullmatch(r"[ACGTN]+", ref + alt) or ref == alt:
                              item.update(key=None, status="INVALID", detail="REF and ALT must be different A/C/G/T/N alleles")
                      k = item["key"] or f"line-{n}-{len(items)}"
                      if k in items:
                          items[k]["duplicates"] = items[k].get("duplicates", 0) + 1
                      else:
                          items[k] = item
          if header_assembly and header_assembly != ASSEMBLY:
              sys.exit(f"The VCF header declares {header_assembly} but assembly={ASSEMBLY}. Re-run with assembly={header_assembly}.")

          # 2. Skip keys cached with the current Ensembl release; optionally re-check the whole cache
          with open("cache.csv", encoding="utf-8") as f:
              cache = {r["key"]: r for r in csv.DictReader(f)}
          if INCLUDE_CACHE:
              for k, r in cache.items():
                  items.setdefault(k, {"key": k, "input_type": r["input_type"], "query": r["query"], "line": None, "input": r["query"], "source": "cache"})
          todo = []
          for it in items.values():
              c = cache.get(it["key"])
              if it.get("status"):
                  continue
              if c and c["ensembl_release"] == RELEASE and not FORCE:
                  it.update(status="CACHED", detail=f"annotated with release {RELEASE} on {c['annotated_at'][:10]}")
              else:
                  it["reason"] = "new" if not c else ("forced" if FORCE else f"re-annotated, release {c['ensembl_release']} -> {RELEASE}")
                  todo.append(it)

          # 3. Check the REF allele of never-seen region variants against the chosen assembly (50 regions per request)
          def region(it):
              c, p, r, _ = it["query"].split()
              return f"{c}:{p}..{int(p) + len(r) - 1}:1", r

          def reference(host, its):
              seqs = {}
              for i in range(0, len(its), 50):
                  res = post(f"{host}/sequence/region/homo_sapiens", {"regions": [region(it)[0] for it in its[i:i + 50]]})
                  seqs.update({s["query"]: s["seq"].upper() for s in (res if isinstance(res, list) else [])})
              return seqs

          fresh = [it for it in todo if it["input_type"] == "region" and it["key"] not in cache]
          seqs, mismatched = reference(HOSTS[ASSEMBLY], fresh), []
          for it in fresh:
              q, ref = region(it)
              if q not in seqs:
                  it.update(status="UNKNOWN_REGION", detail=f"{q} is not on the {ASSEMBLY} reference")
              elif seqs[q] != ref:
                  it.update(status="REF_MISMATCH", detail=f"REF {ref} but {ASSEMBLY} has {seqs[q]} at {q}")
                  mismatched.append(it)
          if len(mismatched) >= 3 and len(mismatched) > len(fresh) / 2:  # mostly wrong: is the input on the other assembly?
              sample = mismatched[:50]
              other = reference(HOSTS[OTHER], sample)
              fits = [it for it in sample if other.get(region(it)[0]) == region(it)[1]]
              if len(fits) > len(sample) / 2:
                  sys.exit(f"REF matches {ASSEMBLY} for only {len(fresh) - len(mismatched)} of {len(fresh)} new variants but {OTHER} "
                           f"for {len(fits)} of {len(sample)} mismatches. Re-run with assembly={OTHER}.")
          todo = [it for it in todo if not it.get("status")]

          # 4. VEP in batches of 200; pick MANE Select > canonical > most severe transcript; read colocated variants
          def worst(tcs):
              return max((t.get("impact", "MODIFIER") for t in tcs), key=lambda i: IMPACT.get(i, 0), default=None)

          def pick(v):
              tcs = v.get("transcript_consequences") or []
              for label, test in (("MANE_SELECT", lambda t: t.get("mane_select")),
                                  ("CANONICAL", lambda t: t.get("canonical") and t.get("biotype") == "protein_coding"),
                                  ("CANONICAL", lambda t: t.get("canonical")),
                                  ("MOST_SEVERE", lambda t: v.get("most_severe_consequence") in t.get("consequence_terms", []))):
                  cands = [t for t in tcs if test(t)]
                  if cands:
                      return label, max(cands, key=lambda t: IMPACT.get(t.get("impact"), 0))
              return "NONE", {}

          def extract(v, it):
              source, t = pick(v)
              alleles = v.get("allele_string", "").split("/")
              allele = t.get("variant_allele") or (alleles[1] if len(alleles) > 1 else None)
              rsids, allele_sig, site_sig, somatic, freq = [], set(), set(), set(), {}
              for c in v.get("colocated_variants") or []:
                  if c.get("clinvar_somatic_classification"):
                      somatic.add(c["clinvar_somatic_classification"])
                  if not str(c.get("id", "")).startswith("rs"):
                      continue  # HGMD and COSMIC placeholders carry no allele data
                  rsids.append(c["id"])
                  site_sig.update(c.get("clin_sig") or [])
                  for entry in (c.get("clin_sig_allele") or "").split(";"):
                      a, _, sig = entry.rpartition(":")
                      if sig and (a or "-") == allele:
                          allele_sig.add(sig)
                  f = c.get("frequencies") or {}
                  for k, x in (f.get(allele) or (next(iter(f.values())) if len(f) == 1 else {})).items():
                      if k.startswith("gnomad") and x > freq.get(k, -1):
                          freq[k] = x
              terms = {p for s in (allele_sig or site_sig) for p in s.split("/")}
              flags = []
              if terms & {"pathogenic", "likely_pathogenic"}:
                  flags.append("SITE_PATHOGENIC" if not allele_sig else "CONFLICTING" if terms & {"benign", "likely_benign"} else "PATHOGENIC")
              if t.get("impact") == "HIGH":
                  flags.append("HIGH_IMPACT")
              grp = {k: x for k, x in freq.items() if k.count("_") == 1 and not k.endswith(("_remaining", "_ami", "_asj", "_fin", "_mid"))}
              top = max(grp, key=grp.get) if grp else None
              other = (v.get("regulatory_feature_consequences") or []) + (v.get("intergenic_consequences") or [])
              return {
                  "key": it["key"], "input_type": it["input_type"], "query": it["query"], "ensembl_release": RELEASE,
                  "chrom": v.get("seq_region_name"), "start": v.get("start"), "allele_string": v.get("allele_string"),
                  "variant_class": v.get("variant_class"), "most_severe_consequence": v.get("most_severe_consequence"),
                  "gene_symbol": t.get("gene_symbol"), "gene_id": t.get("gene_id"), "transcript_id": t.get("transcript_id"),
                  "transcript_source": source, "mane_select": t.get("mane_select"),
                  "consequence": "&".join(t.get("consequence_terms", [])) or v.get("most_severe_consequence"),
                  "impact": t.get("impact") or worst(other), "worst_impact": worst((v.get("transcript_consequences") or []) + other),
                  "hgvsc": t.get("hgvsc"), "hgvsp": (t.get("hgvsp") or "").replace("%3D", "=") or None,
                  "sift": f"{t['sift_prediction']}({t.get('sift_score')})" if t.get("sift_prediction") else None,
                  "polyphen": f"{t['polyphen_prediction']}({t.get('polyphen_score')})" if t.get("polyphen_prediction") else None,
                  "rsids": " ".join(dict.fromkeys(rsids)) or None, "clinvar_significance": "|".join(sorted(allele_sig or site_sig)) or None,
                  "clinvar_scope": "allele" if allele_sig else "site" if site_sig else None,
                  "somatic_classification": "; ".join(sorted(somatic))[:300] or None,
                  "gnomade_af": freq.get("gnomade"), "gnomadg_af": freq.get("gnomadg"), "gnomad_grpmax": top,
                  "gnomad_grpmax_af": grp.get(top), "flags": ",".join(flags) or None,
              }

          annotations = []

          def annotate(kind, batch):
              if kind == "region":
                  tokens = {f"v{i}": it for i, it in enumerate(batch)}  # VCF ID column carries a token to map results back
                  body = {"variants": [f"{c} {p} {tok} {r} {a} . . ." for tok, it in tokens.items() for c, p, r, a in [it["query"].split()]]}
              else:
                  tokens = {it["query"]: it for it in batch}
                  body = {"hgvs_notations": list(tokens)}
              res = post(f"{HOSTS[ASSEMBLY]}/vep/homo_sapiens/{kind}?{VEP_PARAMS}", body)
              if isinstance(res, dict):  # HTTP 400 rejects the whole batch: split it to isolate the bad item
                  if len(batch) == 1:
                      return batch[0].update(status="VEP_ERROR", detail=res["error"])
                  return [annotate(kind, part) for part in (batch[: len(batch) // 2], batch[len(batch) // 2:])]
              for v in res:
                  it = tokens.get(v.get("id")) or tokens.get(v.get("input"))
                  if it and not it.get("status"):
                      annotations.append(extract(v, it))
                      it.update(status="ANNOTATED", detail=it["reason"])
              for it in [it for it in batch if not it.get("status")]:
                  if len(batch) > 1:  # VEP silently drops bad items from a batch; alone, it answers 400 with the reason
                      annotate(kind, [it])
                  else:
                      it.update(status="NOT_RETURNED", detail="VEP returned no consequence for this variant")

          for kind in ("region", "hgvs"):
              group = [it for it in todo if it["input_type"] == kind]
              for i in range(0, len(group), 200):
                  annotate(kind, group[i:i + 200])

          with open("annotations.ndjson", "w", encoding="utf-8") as f:
              f.writelines(json.dumps(a) + "\n" for a in annotations)
          with open("items.ndjson", "w", encoding="utf-8") as f:
              f.writelines(json.dumps({k: it.get(k) for k in ("line", "input", "source", "key", "status", "detail", "duplicates")}) + "\n" for it in items.values())
          counts = {}
          for it in items.values():
              counts[it["status"]] = counts.get(it["status"], 0) + 1
          print(f"Ensembl {ASSEMBLY} release {RELEASE}: {len(items)} variant(s), {len(annotations)} sent to VEP and annotated, "
                f"{stats['requests']} request(s), {stats['retries']} retries, {counts}")
          print("::" + json.dumps({"outputs": {"requests": stats["requests"], "annotated": len(annotations)}}) + "::")

  - id: merge
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: |
      Replaces re-annotated rows in the cache, joins every input line to its annotation for the enriched CSV and
      compares re-annotated variants with their previous release (flags, ClinVar, consequence, HGVSp). Alerts cover
      variants that are new with an alert flag, and re-annotated variants that gained or lost one.
    url: "jdbc:duckdb:"
    fetchType: FETCH_ONE
    inputFiles:
      previous.parquet: "{{ outputs.previous_cache.value.cache ?? outputs.empty_cache.outputFiles.cache }}"
      annotations.ndjson: "{{ outputs.annotate.outputFiles['annotations.ndjson'] }}"
      items.ndjson: "{{ outputs.annotate.outputFiles['items.ndjson'] }}"
    outputFiles:
      - cache
      - enriched_csv
    parameters:
      run_at: "{{ execution.startDate }}"
      alert_flags: "{{ inputs.alert_flags | join(',') }}"
      execution_url: "{{ kestra.url ?? '' }}/ui/executions/{{ flow.namespace }}/{{ flow.id }}/{{ execution.id }}"
    sql: |
      SET TimeZone = 'UTC';
      CREATE TABLE prev AS SELECT * FROM read_parquet('previous.parquet');
      CREATE TABLE ann AS
      SELECT *, CAST(:run_at AS TIMESTAMP) AS annotated_at
      FROM read_json('annotations.ndjson', format = 'newline_delimited', columns = {
        'key': 'VARCHAR', 'input_type': 'VARCHAR', 'query': 'VARCHAR', 'ensembl_release': 'VARCHAR', 'chrom': 'VARCHAR',
        'start': 'BIGINT', 'allele_string': 'VARCHAR', 'variant_class': 'VARCHAR', 'most_severe_consequence': 'VARCHAR',
        'gene_symbol': 'VARCHAR', 'gene_id': 'VARCHAR', 'transcript_id': 'VARCHAR', 'transcript_source': 'VARCHAR',
        'mane_select': 'VARCHAR', 'consequence': 'VARCHAR', 'impact': 'VARCHAR', 'worst_impact': 'VARCHAR', 'hgvsc': 'VARCHAR',
        'hgvsp': 'VARCHAR', 'sift': 'VARCHAR', 'polyphen': 'VARCHAR', 'rsids': 'VARCHAR', 'clinvar_significance': 'VARCHAR',
        'clinvar_scope': 'VARCHAR', 'somatic_classification': 'VARCHAR', 'gnomade_af': 'DOUBLE', 'gnomadg_af': 'DOUBLE',
        'gnomad_grpmax': 'VARCHAR', 'gnomad_grpmax_af': 'DOUBLE', 'flags': 'VARCHAR'});
      CREATE TABLE items AS
      SELECT * FROM read_json('items.ndjson', format = 'newline_delimited', columns = {
        'line': 'BIGINT', 'input': 'VARCHAR', 'source': 'VARCHAR', 'key': 'VARCHAR', 'status': 'VARCHAR',
        'detail': 'VARCHAR', 'duplicates': 'BIGINT'});
      CREATE TABLE cache AS
      SELECT * FROM prev WHERE key NOT IN (SELECT key FROM ann) UNION ALL BY NAME SELECT * FROM ann;
      CREATE TABLE wanted AS SELECT unnest(string_split(CAST(:alert_flags AS VARCHAR), ',')) AS flag;

      CREATE TABLE enriched AS
      SELECT i.line, i.input, i.source, i.status, i.detail, coalesce(i.duplicates, 0) AS duplicates, c.* EXCLUDE (input_type, query),
             CASE WHEN p.key IS NOT NULL THEN nullif(concat_ws('; ',
               CASE WHEN c.flags IS DISTINCT FROM p.flags THEN 'flags ' || coalesce(p.flags, 'none') || ' -> ' || coalesce(c.flags, 'none') END,
               CASE WHEN c.clinvar_significance IS DISTINCT FROM p.clinvar_significance
                    THEN 'ClinVar ' || coalesce(p.clinvar_significance, 'none') || ' -> ' || coalesce(c.clinvar_significance, 'none') END,
               CASE WHEN c.consequence IS DISTINCT FROM p.consequence OR c.transcript_id IS DISTINCT FROM p.transcript_id
                    THEN 'consequence ' || coalesce(p.transcript_id || ' ' || p.consequence, 'none') || ' -> ' || coalesce(c.transcript_id || ' ' || c.consequence, 'none') END,
               CASE WHEN c.hgvsp IS DISTINCT FROM p.hgvsp THEN 'HGVSp ' || coalesce(p.hgvsp, 'none') || ' -> ' || coalesce(c.hgvsp, 'none') END), '') END AS change,
             p.ensembl_release AS previous_release, p.flags AS previous_flags,
             EXISTS (SELECT 1 FROM wanted WHERE list_contains(string_split(coalesce(c.flags, ''), ','), flag)) AS alert_now,
             EXISTS (SELECT 1 FROM wanted WHERE list_contains(string_split(coalesce(p.flags, ''), ','), flag)) AS alert_before
      FROM items i
      LEFT JOIN cache c ON c.key = i.key AND i.status IN ('ANNOTATED', 'CACHED')
      LEFT JOIN prev p ON p.key = i.key AND i.status = 'ANNOTATED';

      CREATE TABLE alerts AS
      SELECT *, CASE WHEN previous_release IS NULL THEN 'NEW' ELSE 'RECLASSIFIED' END AS alert_reason
      FROM enriched
      WHERE status = 'ANNOTATED'
        AND ((alert_now AND (previous_release IS NULL OR flags IS DISTINCT FROM previous_flags)) OR (alert_before AND NOT alert_now));

      COPY (SELECT * EXCLUDE (alert_now, alert_before) FROM enriched ORDER BY line NULLS LAST, key)
        TO '{{ outputFiles.enriched_csv }}' (HEADER, DELIMITER ',');
      COPY (SELECT * FROM cache ORDER BY key) TO '{{ outputFiles.cache }}' (FORMAT PARQUET);

      CREATE TABLE digest AS
      SELECT string_agg('• *' || coalesce(flags, 'flag removed') || '* ' || coalesce(gene_symbol, chrom || '-' || start) || ' '
                        || coalesce(regexp_replace(hgvsp, '^[^:]+[:]', ''), regexp_replace(hgvsc, '^[^:]+[:]', ''), most_severe_consequence)
                        || ' (' || key || ', ' || consequence || ', ' || impact || ')'
                        || coalesce(', ClinVar ' || clinvar_scope || ' ' || left(clinvar_significance, 80), '')
                        || coalesce(', gnomAD grpmax ' || CAST(round(gnomad_grpmax_af, 6) AS VARCHAR), '')
                        || ' [' || alert_reason || coalesce(' ' || change, '') || ']', chr(10) ORDER BY rank, key) AS lines
      FROM (SELECT *, CASE WHEN flags LIKE 'PATHOGENIC%' THEN 0 WHEN flags LIKE '%HIGH_IMPACT%' THEN 1 ELSE 2 END AS rank
            FROM alerts ORDER BY rank, key LIMIT 25);

      CREATE TABLE flag_counts AS
      SELECT f, count(*) AS n FROM (SELECT unnest(string_split(flags, ',')) AS f FROM enriched WHERE flags IS NOT NULL) GROUP BY 1;

      SELECT
        (SELECT count(*) FROM items) AS variants,
        (SELECT count(*) FROM ann) AS annotated,
        (SELECT count(*) FROM items WHERE status = 'CACHED') AS from_cache,
        (SELECT count(*) FROM ann a JOIN prev p USING (key)) AS reannotated,
        (SELECT count(*) FROM enriched WHERE change IS NOT NULL) AS changed,
        (SELECT coalesce(string_agg(status || ' ' || n, ', ' ORDER BY n DESC, status), '') FROM (SELECT status, count(*) AS n FROM items GROUP BY 1)) AS status_breakdown,
        (SELECT coalesce(string_agg(f || ' ' || n, ', ' ORDER BY n DESC, f), 'none') FROM flag_counts) AS flag_breakdown,
        (SELECT count(*) FROM alerts) AS alerts,
        (SELECT count(*) FROM cache) AS cache_size,
        (SELECT coalesce(string_agg(input || ' (' || status || ')', '; '), '') FROM items
           WHERE status NOT IN ('ANNOTATED', 'CACHED')) AS problems,
        CASE WHEN (SELECT count(*) FROM alerts) > 0 THEN 'ALERT'
             WHEN (SELECT count(*) FROM ann) = 0 THEN 'ALL_CACHED' ELSE 'NOTHING_TO_ALERT' END AS outcome,
        CAST(json_object('text',
          'Ensembl VEP: ' || (SELECT count(*) FROM alerts) || ' new or reclassified variant(s) to review'
          || CASE WHEN (SELECT count(*) FROM alerts) > 25 THEN ' (first 25 shown, all in the CSV)' ELSE '' END || chr(10)
          || coalesce((SELECT lines FROM digest), '') || chr(10) || 'Execution ' || :execution_url) AS VARCHAR) AS slack_payload;

  - id: save_cache
    type: io.kestra.plugin.core.flow.If
    description: Points the KV entry at the new cache only when something was annotated, so all-cached runs write no new file.
    condition: "{{ outputs.annotate.vars.annotated > 0 or outputs.previous_cache.value is not defined or outputs.previous_cache.value is empty }}"
    then:
      - id: set_cache_pointer
        type: io.kestra.plugin.core.kv.Set
        key: "{{ inputs.cache_key }}_{{ inputs.assembly | lower }}"
        kvType: JSON
        value: |
          {{ {'cache': outputs.merge.outputFiles.cache, 'release': fromJson(outputs.ensembl_release.body).release, 'variants': outputs.merge.outputs[0].row.cache_size, 'updated': execution.startDate} | toJson }}

  - id: triage
    type: io.kestra.plugin.core.flow.Switch
    value: "{{ outputs.merge.outputs[0].row.outcome }}"
    cases:
      ALERT:
        - id: notify
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          allowFailure: true
          description: allowFailure keeps the cache saved and the CSV available when the webhook is missing or down.
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: "{{ outputs.merge.outputs[0].row.slack_payload }}"
        - id: log_alerts
          type: io.kestra.plugin.core.log.Log
          level: WARN
          message: "{{ fromJson(outputs.merge.outputs[0].row.slack_payload).text }}"
      ALL_CACHED:
        - id: all_cached
          type: io.kestra.plugin.core.log.Log
          message: "Nothing new to annotate: {{ outputs.merge.outputs[0].row.from_cache }} variant(s) served from the release {{ fromJson(outputs.ensembl_release.body).release }} cache."
    defaults:
      - id: nothing_to_alert
        type: io.kestra.plugin.core.log.Log
        message: "{{ outputs.merge.outputs[0].row.annotated }} variant(s) annotated, none new or reclassified with a flag in {{ inputs.alert_flags | join(', ') }}."

  - id: summary
    type: io.kestra.plugin.core.log.Log
    message: |
      Ensembl {{ inputs.assembly }} release {{ fromJson(outputs.ensembl_release.body).release }} (cached under {{ outputs.previous_cache.value.release ?? 'none' }}): {{ outputs.merge.outputs[0].row.variants }} variant(s), {{ outputs.merge.outputs[0].row.annotated }} annotated in {{ outputs.annotate.vars.requests }} request(s) ({{ outputs.merge.outputs[0].row.reannotated }} re-annotated, {{ outputs.merge.outputs[0].row.changed }} changed), {{ outputs.merge.outputs[0].row.from_cache }} from cache, {{ outputs.merge.outputs[0].row.cache_size }} in the cache.
      Status: {{ outputs.merge.outputs[0].row.status_breakdown }}. Flags: {{ outputs.merge.outputs[0].row.flag_breakdown }}. Alerts: {{ outputs.merge.outputs[0].row.alerts }}.{{ outputs.merge.outputs[0].row.problems is not empty ? ' Not annotated: ' ~ outputs.merge.outputs[0].row.problems : '' }}

outputs:
  - id: ensembl_release
    type: STRING
    required: false
    value: "{{ outputs.ensembl_release.body is defined ? fromJson(outputs.ensembl_release.body).release : null }}"
  - id: summary
    type: JSON
    required: false
    value: "{{ outputs.merge.outputs[0].row ?? null }}"
  - id: enriched_csv
    type: FILE
    required: false
    value: "{{ outputs.merge.outputFiles.enriched_csv ?? null }}"

extend:
  title: Enrich Variants with Ensembl VEP, ClinVar and gnomAD, Cached per Release
  metaTitle: Ensembl VEP Variant Annotation with Parquet Cache | Kestra
  shortDescription: Annotate HGVS, chrom-pos-ref-alt or VCF variants with the Ensembl VEP REST API, cache results per Ensembl release in Parquet and alert Slack on new or reclassified pathogenic and HIGH-impact variants.
  metaDescription: Annotate variants with Ensembl VEP (MANE transcript, ClinVar, gnomAD), cache per release in Parquet and alert on new pathogenic or HIGH-impact hits.
  description: |
    Every variant needs the same answers: gene and transcript, consequence, protein change, rarity and ClinVar status. This flow gets them from the keyless Ensembl VEP REST API, checks that the input is on the chosen assembly, caches each answer in Parquet per variant and Ensembl release, and alerts Slack only on variants that are new or were reclassified.

    ## How it works

    1. A `Flow` trigger annotates each VCF produced by an upstream flow (`variant-calling`, FILE output `vcf`). A weekly `Schedule` sets `include_cache`, cheap until Ensembl ships a new release.
    2. `ensembl_release` (HTTP Request) reads `/info/software` from `rest.ensembl.org` (GRCh38) or `grch37.rest.ensembl.org` (GRCh37). `previous_cache` (KV Get) reads the assembly's cache pointer, `bootstrap` (If) writes an empty cache on the first run and `cache_index` (DuckDB) lists cached keys and releases.
    3. `annotate` (Python, standard library only) reads the inline list or the uploaded VCF. It accepts HGVS, `7 140753336 A T`, `chr7:140753336:A:T`, `7-140753336-A-T` and VCF lines, splits multi-allelic ALTs, drops duplicates, flags symbolic ALTs as UNSUPPORTED and skips variants cached with the current release.
    4. REF alleles of new variants are checked with `POST /sequence/region` (50 per request). Mismatches become REF_MISMATCH; when most fit the other assembly, or the VCF header names it, the run stops with a hint, since GRCh37 positions annotated on GRCh38 give confident, wrong results.
    5. `POST /vep/homo_sapiens/region` and `/hgvs` are called with `canonical`, `mane`, `hgvs`, `variant_class`, `af_gnomade` and `af_gnomadg`, at most 200 variants per request, under 15 requests per second, honouring 429 and `Retry-After`. Items VEP drops from a batch are re-sent alone to get the reason.
    6. It picks the MANE Select, else canonical, else most severe transcript and keeps gene, consequence, impact, HGVSc/HGVSp, SIFT, PolyPhen, rsIDs and gnomAD exome, genome and grpmax AF. ClinVar is matched to this allele via `clin_sig_allele`; when Ensembl ties it only to the rsID (another ALT, a shifted indel) its scope is `site`. Flags: PATHOGENIC, CONFLICTING, SITE_PATHOGENIC, HIGH_IMPACT.
    7. `merge` (DuckDB) replaces re-annotated rows in the cache, compares them with the previous release (flags, ClinVar, consequence, HGVSp) and writes the enriched CSV. `save_cache` (If) moves the KV pointer only when something was annotated.
    8. `triage` (Switch) posts to Slack (`allowFailure`) when a variant is new with an alert flag or gained or lost one, logs when everything came from the cache, and `summary` logs counts and lines that could not be annotated.

    ## What you get

    - `enriched_csv`: one row per input variant: status, annotation, flags and changes since the previous release.
    - A Slack digest of new and reclassified variants, pathogenic first.
    - VEP calls only for new variants; a new Ensembl release re-annotates the cache once.
    - Explicit REF_MISMATCH, UNSUPPORTED, INVALID and VEP_ERROR statuses instead of silent gaps.

    ## Who it's for

    - Clinical bioinformaticians triaging germline or tumour variant lists.
    - Genomics platform teams adding annotation after variant calling.
    - Research groups keeping a curated panel current with ClinVar.

    ## Why orchestrate this with Kestra

    - Cache in internal storage with its pointer in KV: no database, one cache per assembly.
    - A Flow trigger chains annotation to the calling pipeline; the schedule handles Ensembl releases.
    - Each execution keeps its CSV and logs; a Slack failure never loses the cache.

    ## Prerequisites

    - Kestra 2.0 with the Python script, JDBC DuckDB and Slack plugins.
    - Docker on the worker for `python:3.13-slim` (standard library only), or the `Process` task runner with `python3`.
    - Outbound HTTPS to `rest.ensembl.org` and `grch37.rest.ensembl.org`; no API key needed.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack incoming webhook for the digest (optional; without it the notify task ends in WARNING and the digest is still logged).

    ## Quick start

    1. Add `SLACK_WEBHOOK_URL` if you want the Slack digest.
    2. Execute with the defaults: 12 GRCh38 variants, 10 annotated in about five requests, the TP53 line with the wrong strand reported as REF_MISMATCH and the unknown transcript version as VEP_ERROR.
    3. Execute again: everything comes from the cache and nothing is alerted.
    4. Upload your own VCF in `vcf_file`, pick the assembly, and point the Flow trigger at your calling flow.

    ## How to extend

    - Add VEP plugins such as `CADD=1`, `SpliceAI=1` or `REVEL=1` to the query string and keep their scores.
    - Load the CSV into a warehouse or LIMS, or route PATHOGENIC hits to a review queue with an approval step.

    ## Links

    - [Python Script](https://kestra.io/plugins/plugin-script-python/io.kestra.plugin.scripts.python.script) and [HTTP Request](https://kestra.io/plugins/core/http/io.kestra.plugin.core.http.request)
    - [DuckDB Queries](https://kestra.io/plugins/plugin-jdbc-duckdb/io.kestra.plugin.jdbc.duckdb.queries)
    - [KV Get](https://kestra.io/plugins/core/kv/io.kestra.plugin.core.kv.get), [KV Set](https://kestra.io/plugins/core/kv/io.kestra.plugin.core.kv.set), [If](https://kestra.io/plugins/core/flow/io.kestra.plugin.core.flow.if), [Switch](https://kestra.io/plugins/core/flow/io.kestra.plugin.core.flow.switch), [Flow trigger](https://kestra.io/plugins/core/trigger/io.kestra.plugin.core.trigger.flow) and [Schedule](https://kestra.io/plugins/core/trigger/io.kestra.plugin.core.trigger.schedule)
    - [Slack Incoming Webhook](https://kestra.io/plugins/plugin-slack/io.kestra.plugin.slack.notifications.slackincomingwebhook)
    - [Ensembl REST VEP region](https://rest.ensembl.org/documentation/info/vep_region_post), [VEP HGVS](https://rest.ensembl.org/documentation/info/vep_hgvs_post), [sequence region](https://rest.ensembl.org/documentation/info/sequence_region_post) and [rate limits](https://github.com/Ensembl/ensembl-rest/wiki/Rate-Limits)
    - [MANE](https://www.ncbi.nlm.nih.gov/refseq/MANE/) and [gnomAD](https://gnomad.broadinstitute.org/)
  tags:
    - Data
  subTags:
    - ELT & Data Landing
    - Monitoring & Alerting
  ee: false
  demo: false
