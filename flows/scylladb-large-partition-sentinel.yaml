id: scylladb-large-partition-sentinel
namespace: company.team

description: |
  Query ScyllaDB's own system.large_partitions table, classify the cluster HEALTHY, WARNING,
  CRITICAL or PROBE_FAILED from the real partitions found and their real size, and alert
  Slack naming the exact keyspace, table, and byte size responsible, never an invented value.

inputs:
  - id: contact_points
    type: STRING
    displayName: Contact points
    description: Comma-separated host:port list, for example host1:9042,host2:9042. Split and passed to the Query task's connection.contactPoints field. The default CQL port is 9042.
    defaults: "localhost:9042"

  - id: local_datacenter
    type: STRING
    displayName: Local datacenter
    description: Datacenter name used by the driver's load balancing policy. Maps to connection.localDatacenter.
    defaults: "datacenter1"

  - id: critical_partition_size_bytes
    type: INT
    displayName: Critical partition size threshold
    description: Byte size at or above which a recorded large partition is classified CRITICAL instead of WARNING. Every row in system.large_partitions is already large by ScyllaDB's own compaction_large_partition_warning_threshold_mb (1000MB by default), this is a second, higher bar on top of that.
    defaults: 2147483648

tasks:
  - id: probe_large_partitions
    type: io.kestra.plugin.scylladb.Query
    description: Reads every row ScyllaDB has itself recorded in system.large_partitions, the cluster's own log of partitions that exceeded its compaction-time size or row-count threshold.
    allowFailure: true
    connection:
      contactPoints: "{{ inputs.contact_points | split(',') }}"
      localDatacenter: "{{ inputs.local_datacenter }}"
      username: "{{ secret('SCYLLADB_USERNAME') }}"
      password: "{{ secret('SCYLLADB_PASSWORD') }}"
    cql: "SELECT keyspace_name, table_name, sstable_name, partition_size, rows, compaction_time FROM system.large_partitions"
    fetchType: FETCH

  - id: classify_large_partition_status
    type: io.kestra.plugin.core.debug.Return
    description: PROBE_FAILED when the probe did not return at all, HEALTHY when system.large_partitions is empty, CRITICAL when the largest recorded partition is at or above critical_partition_size_bytes, WARNING otherwise.
    format: "{{ outputs.probe_large_partitions is not defined ? 'PROBE_FAILED' : ( (outputs.probe_large_partitions.rows | length) == 0 ? 'HEALTHY' : ( ((outputs.probe_large_partitions.rows | jq('[.[].partition_size] | max') | first) >= inputs.critical_partition_size_bytes) ? 'CRITICAL' : 'WARNING' ) ) }}"

  - id: route_by_large_partition_status
    type: io.kestra.plugin.core.flow.Switch
    description: Branch A logs an empty system.large_partitions table. Branch B alerts Slack naming the real largest offender, never an invented keyspace, table, or size.
    value: "{{ outputs.classify_large_partition_status.value }}"
    cases:
      "HEALTHY":
        - id: log_healthy
          type: io.kestra.plugin.core.log.Log
          message: "ScyllaDB cluster healthy, system.large_partitions is empty."
      "WARNING":
        - id: alert_warning
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK') }}"
          payload: |
            {{ {"text": "ScyllaDB large partition WARNING. " ~ (outputs.probe_large_partitions.rows | length) ~ " recorded, largest is " ~ (outputs.probe_large_partitions.rows | jq('max_by(.partition_size).keyspace_name') | first) ~ "." ~ (outputs.probe_large_partitions.rows | jq('max_by(.partition_size).table_name') | first) ~ " at " ~ (outputs.probe_large_partitions.rows | jq('max_by(.partition_size).partition_size') | first) ~ " bytes."} | toJson }}
      "CRITICAL":
        - id: alert_critical
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK') }}"
          payload: |
            {{ {"text": "ScyllaDB large partition CRITICAL. " ~ (outputs.probe_large_partitions.rows | length) ~ " recorded, largest is " ~ (outputs.probe_large_partitions.rows | jq('max_by(.partition_size).keyspace_name') | first) ~ "." ~ (outputs.probe_large_partitions.rows | jq('max_by(.partition_size).table_name') | first) ~ " at " ~ (outputs.probe_large_partitions.rows | jq('max_by(.partition_size).partition_size') | first) ~ " bytes, at or above the " ~ inputs.critical_partition_size_bytes ~ " byte critical threshold."} | toJson }}
      "PROBE_FAILED":
        - id: alert_probe_failed
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK') }}"
          payload: |
            {{ {"text": "ScyllaDB large partition probe did not return a result. Check contact_points, local_datacenter, and ScyllaDB credentials."} | toJson }}
    defaults:
      - id: log_unexpected_status
        type: io.kestra.plugin.core.log.Log
        message: "Unexpected classify_large_partition_status value: {{ outputs.classify_large_partition_status.value }}"

  - id: log_audit_summary
    type: io.kestra.plugin.core.log.Log
    description: Final audit log confirming the gate ran, regardless of the branch taken above.
    message: "ScyllaDB large partition sentinel completed. status={{ outputs.classify_large_partition_status.value }}"

errors:
  - id: alert_flow_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {{ {"text": "ScyllaDB large partition sentinel flow failed (execution " ~ execution.id ~ "). Check the execution logs."} | toJson }}

triggers:
  - id: every_30_minutes
    type: io.kestra.plugin.core.trigger.Schedule
    description: Shipped disabled.
    cron: "*/30 * * * *"
    disabled: true
    inputs:
      contact_points: "localhost:9042"
      local_datacenter: "datacenter1"
      critical_partition_size_bytes: 2147483648

extend:
  title: ScyllaDB Large Partition Sentinel
  shortDescription: Query ScyllaDB's own system.large_partitions table and alert Slack naming the real keyspace, table, and byte size of the largest offender, never an invented value.
  metaTitle: ScyllaDB Large Partition Sentinel with Kestra
  metaDescription: Query ScyllaDB's system.large_partitions table on a schedule and alert Slack naming the real keyspace, table, and size of oversized partitions.
  description: |
    A partition that grows past ScyllaDB's own compaction-time size or row-count threshold
    gets written to `system.large_partitions`, ScyllaDB's own standing record of exactly which
    keyspace, table, and partition key crossed the line. Nothing in ScyllaDB itself alerts on
    new entries in that table, so a large partition, a well known cause of hot spots, slow
    compactions, and timeout cascades, can sit there for weeks before anyone notices. This
    blueprint reads that table on a schedule, classifies the cluster from what is actually
    recorded, and alerts Slack naming the real offender, never a guess.

    ## How it works

    1. `probe_large_partitions` (`io.kestra.plugin.scylladb.Query`) runs `SELECT
       keyspace_name, table_name, sstable_name, partition_size, rows, compaction_time FROM
       system.large_partitions`, with `allowFailure: true` so a bad contact point or
       credential does not stop the flow before it can be classified as `PROBE_FAILED` below.
    2. `classify_large_partition_status` (`io.kestra.plugin.core.debug.Return`) returns
       `PROBE_FAILED` when the probe did not return at all, `HEALTHY` when the table is empty,
       `CRITICAL` when the largest recorded `partition_size` is at or above
       `critical_partition_size_bytes`, `WARNING` otherwise.
    3. `route_by_large_partition_status` (`io.kestra.plugin.core.flow.Switch`) branches on
       that status: `HEALTHY` logs it, the other three each alert Slack, the `WARNING` and
       `CRITICAL` alerts name the real `keyspace_name`, `table_name`, and `partition_size` of
       the single largest recorded partition, never an invented value. An unexpected value
       falls through to a `defaults` branch that logs it rather than being silently dropped.
    4. `log_audit_summary` always runs last and logs the final classification.
    5. The `errors` block posts to Slack if the flow itself fails outside the gate logic
       above.

    ## What you get

    - A real read of ScyllaDB's own large-partition log, not a guess from cluster load or
      latency graphs.
    - A Slack alert naming the actual keyspace, table, and byte size responsible, never an
      invented value.
    - A second, configurable severity tier above ScyllaDB's own built-in detection threshold,
      so routine, already-known-about large partitions can stay at WARNING while a genuinely
      oversized one pages as CRITICAL.
    - A fully local test path against the official ScyllaDB Docker image, no managed cluster
      needed.

    ## Who it's for

    - Database reliability and platform teams running ScyllaDB who want to know about a
      newly-recorded large partition without manually querying `system.large_partitions`.
    - Teams evaluating the ScyllaDB plugin who want a working example of
      `io.kestra.plugin.scylladb.Query` against a real system table, with native CQL
      authentication.

    ## Why orchestrate this with Kestra

    ScyllaDB records large partitions, it does not notify anyone about them, that gap usually
    gets filled by a cron job and a hand-rolled alerting script. Kestra replaces that script
    with a declarative flow: the schedule, the severity classification against your own
    second threshold, and the Slack alert naming the real offender are all one auditable
    execution history.

    ## Prerequisites

    - For local testing, the official ScyllaDB Docker image:

      ```
      docker run --name scylla -d -p 9042:9042 scylladb/scylla:latest --smp 1
      ```

      `--smp 1` limits ScyllaDB to one shard, recommended for a laptop-sized container. Wait
      for `docker exec -it scylla nodetool status` to report `UN` (up, normal) before
      connecting, ScyllaDB takes a little while to finish starting.
    - Authentication is disabled by default on a fresh ScyllaDB container. To test with
      `username`/`password` set, enable `authenticator: PasswordAuthenticator` in
      `scylla.yaml` and restart the container, then connect as the default `cassandra` /
      `cassandra` superuser account to create your own role.
    - To actually populate `system.large_partitions` for testing, lower
      `compaction_large_partition_warning_threshold_mb` well below its 1000MB default in
      `scylla.yaml`, then write and compact a partition past that lowered threshold.
    - A Slack incoming webhook for alerts.

    ### Secrets

    - `SCYLLADB_USERNAME`, `SCYLLADB_PASSWORD`: native CQL authentication credentials. Only
      required when the cluster has `PasswordAuthenticator` enabled.
    - `SLACK_WEBHOOK`: Slack incoming webhook URL used by the alert tasks and the `errors`
      block.

      In Kestra OSS, set these as base64-encoded environment variables, for example
      `SECRET_SCYLLADB_USERNAME`, `SECRET_SLACK_WEBHOOK`.

    ### Inputs

    | Input | Type | Default | Allowed values |
    |---|---|---|---|
    | `contact_points` | STRING | `localhost:9042` | comma-separated `host:port` list |
    | `local_datacenter` | STRING | `datacenter1` | any datacenter name known to the driver |
    | `critical_partition_size_bytes` | INT | `2147483648` | any positive integer, in bytes |

    ## Quick start

    1. Start the ScyllaDB container above.
    2. Lower `compaction_large_partition_warning_threshold_mb` and write a partition past it,
       per Prerequisites, so `system.large_partitions` has at least one row.
    3. Add the `SLACK_WEBHOOK` secret, and the ScyllaDB credentials if authentication is
       enabled.
    4. Run this flow manually with the defaults, it should report `WARNING` or `CRITICAL`
       naming the real keyspace, table, and size you just created.
    5. Enable the `every_30_minutes` trigger.

    ## How to extend

    - Add a second `Query` against `system.large_rows` or `system.large_cells`, ScyllaDB's
      equivalent logs for an oversized row or cell within an otherwise normal-sized partition.
    - Loop this flow with `io.kestra.plugin.core.flow.Loop` across `contact_points` per
      cluster if you operate more than one ScyllaDB cluster from one Kestra instance.
    - Join the alert against your own schema-ownership mapping to route the Slack message to
      the team that owns the specific keyspace found, instead of a single shared channel.

    ## Pitfalls

    - `system.large_partitions` is ScyllaDB's own standing log, this blueprint does not clear
      or TTL it. A repeated `WARNING`/`CRITICAL` across runs can mean the same historical
      entry is still being read, not that a new one just appeared. Manage this table's
      retention per ScyllaDB's own operational guidance if that distinction matters to you.
    - Every row already exceeded ScyllaDB's own `compaction_large_partition_warning_threshold_mb`
      (1000MB by default) before it was ever written to this table, `critical_partition_size_bytes`
      is a second bar on top of that, not the only line of defense.
    - This gate only reads and alerts, there is no CQL-level fix for an oversized partition,
      resolving one needs a data modeling change, which needs a human decision, not an
      automated task.
    - A fresh ScyllaDB container defaults to `AllowAllAuthenticator`, `username`/`password`
      are simply ignored until `PasswordAuthenticator` is explicitly enabled.

    ## Links

    - [ScyllaDB plugin documentation](https://kestra.io/plugins/plugin-scylladb)
    - [ScyllaDB Docker image](https://hub.docker.com/r/scylladb/scylla)
    - [ScyllaDB large partitions table](https://opensource.docs.scylladb.com/stable/troubleshooting/large-partition-table.html)
  tags:
    - Data
    - Infrastructure
  subTags:
    - Day 2 Operations
    - Monitoring & Alerting
  ee: false
  demo: false
