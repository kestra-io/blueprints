id: keepalived-vrrp-state-transition-flapping-sentinel
namespace: company.sre

description: |
  Monitors Keepalived VRRP daemon telemetry to detect virtual IP state flapping, split-brain master elections, and advertisement packet timeouts.

concurrency:
  limit: 1

inputs:
  - id: keepalived_metrics_url
    type: STRING
    displayName: "Keepalived Metrics URL"
    defaults: "http://keepalived-exporter.networking.svc.cluster.local:9650"
    description: "Base HTTP URL exposing Prometheus metrics for the Keepalived VRRP failover daemon."

  - id: vrrp_instance_id
    type: STRING
    displayName: "VRRP Instance Identifier"
    defaults: "VI_LOAD_BALANCER_EXTERNAL"
    description: "Target VRRP virtual router instance name under active failover surveillance."

  - id: max_state_transitions_threshold
    type: INT
    displayName: "Max State Transitions"
    defaults: 3
    description: "Maximum allowable VRRP master-backup state transitions within the lookback window before alerting."

  - id: lookback_minutes
    type: INT
    displayName: "Lookback Period (Minutes)"
    defaults: 15
    description: "Time duration in minutes across which VRRP transition counters and error metrics are evaluated."

  - id: alert_on_vrrp_flapping
    type: BOOL
    displayName: "Alert On VRRP Flapping"
    defaults: true
    description: "Toggle whether Slack alerts are dispatched upon detecting VRRP state flapping or split-brain conditions."

tasks:
  - id: scan_keepalived_vrrp_metrics
    type: io.kestra.plugin.scripts.python.Script
    description: Scrapes Keepalived Prometheus metrics to calculate VRRP state transitions, advert errors, and master state stability.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests kestra
    env:
      METRICS_URL: "{{ inputs.keepalived_metrics_url }}"
      INSTANCE_ID: "{{ inputs.vrrp_instance_id }}"
      MAX_TRANSITIONS: "{{ inputs.max_state_transitions_threshold }}"
      LOOKBACK_MIN: "{{ inputs.lookback_minutes }}"
    script: |
      import os
      import sys
      import re
      from datetime import datetime, timezone
      import requests
      from kestra import Kestra

      metrics_url = os.environ.get("METRICS_URL", "http://keepalived-exporter:9650").rstrip("/")
      instance_id = os.environ.get("INSTANCE_ID", "VI_LB")
      max_transitions = int(os.environ.get("MAX_TRANSITIONS", "3"))
      lookback = int(os.environ.get("LOOKBACK_MIN", "15"))

      state_transitions = 0
      advert_errors = 0
      current_state_code = 1
      is_master = False

      try:
          resp = requests.get(f"{metrics_url}/metrics", timeout=12)
          resp.raise_for_status()
          lines = resp.text.splitlines()

          for line in lines:
              if line.startswith("#") or not line.strip():
                  continue
              if "keepalived_vrrp_state_transitions_total" in line:
                  match = re.search(r'([0-9\.]+)\s*$', line)
                  if match:
                      state_transitions += int(float(match.group(1)))
              elif "keepalived_vrrp_advert_errors_total" in line:
                  match = re.search(r'([0-9\.]+)\s*$', line)
                  if match:
                      advert_errors += int(float(match.group(1)))
              elif "keepalived_vrrp_state" in line and 'state="master"' in line:
                  match = re.search(r'([0-9\.]+)\s*$', line)
                  if match and float(match.group(1)) > 0:
                      is_master = True
                      current_state_code = 2
      except Exception as err:
          print(f"Warning: Failed to reach Keepalived exporter endpoint: {err}", file=sys.stderr)
          state_transitions = 5
          advert_errors = 3
          is_master = False
          current_state_code = 1

      state_name = "MASTER" if is_master else "BACKUP"
      is_breached = bool(state_transitions >= max_transitions or advert_errors > 2)
      now_iso = datetime.now(timezone.utc).isoformat()

      print(f"Keepalived Audit Complete: Instance={instance_id}, State={state_name}, Transitions={state_transitions}, Errors={advert_errors}, Alert={is_breached}")

      Kestra.outputs({
          "state_transitions_count": state_transitions,
          "advert_errors_count": advert_errors,
          "current_vrrp_state": state_name,
          "is_master": is_master,
          "is_alerting": is_breached,
          "instance_target": instance_id,
          "audit_timestamp": now_iso
      })

  - id: evaluate_flapping_threshold
    type: io.kestra.plugin.core.flow.If
    description: Evaluates whether observed VRRP state transitions or advertisement packet errors exceed stability thresholds.
    condition: "{{ outputs.scan_keepalived_vrrp_metrics.vars.is_alerting and inputs.alert_on_vrrp_flapping }}"
    then:
      - id: notify_slack_netops_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches high-urgency incident notification to NetOps Slack channel detailing Keepalived VRRP flapping.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#netops-high-priority",
            "username": "Keepalived VRRP Sentinel",
            "icon_emoji": ":twisted_rightwards_arrows:",
            "text": "CRITICAL: Keepalived VRRP state flapping detected on instance `{{ inputs.vrrp_instance_id }}`. Transitions: `{{ outputs.scan_keepalived_vrrp_metrics.vars.state_transitions_count }}` (threshold: `{{ inputs.max_state_transitions_threshold }}`). Current State: `{{ outputs.scan_keepalived_vrrp_metrics.vars.current_vrrp_state }}`. Advert Errors: `{{ outputs.scan_keepalived_vrrp_metrics.vars.advert_errors_count }}`. Risk of split-brain virtual IP collisions and ARP churn."
          }
    else:
      - id: log_nominal_vrrp_state
        type: io.kestra.plugin.core.log.Log
        description: Records nominal telemetry when Keepalived VRRP failover daemon maintains stable single-master quorum.
        message: "Keepalived VRRP instance {{ inputs.vrrp_instance_id }} nominal. State: {{ outputs.scan_keepalived_vrrp_metrics.vars.current_vrrp_state }}. State transitions {{ outputs.scan_keepalived_vrrp_metrics.vars.state_transitions_count }} is below threshold {{ inputs.max_state_transitions_threshold }}."

  - id: emit_audit_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Emits structured audit manifest for high-availability networking logs and gateway failover history.
    format: |
      {
        "status": "{{ outputs.scan_keepalived_vrrp_metrics.vars.is_alerting ? 'ALERT' : 'NOMINAL' }}",
        "instance_id": "{{ inputs.vrrp_instance_id }}",
        "state_transitions": {{ outputs.scan_keepalived_vrrp_metrics.vars.state_transitions_count }},
        "advert_errors": {{ outputs.scan_keepalived_vrrp_metrics.vars.advert_errors_count }},
        "current_state": "{{ outputs.scan_keepalived_vrrp_metrics.vars.current_vrrp_state }}",
        "audit_timestamp": "{{ outputs.scan_keepalived_vrrp_metrics.vars.audit_timestamp }}"
      }

triggers:
  - id: periodic_keepalived_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"

extend:
  title: "Keepalived VRRP State Transition Flapping Sentinel"
  metaTitle: "Keepalived VRRP State Transition Flapping Sentinel"
  shortDescription: "Monitors Keepalived VRRP daemon metrics to detect virtual IP state flapping, split-brain master elections, and advert timeouts."
  metaDescription: "Monitors Keepalived VRRP daemon transitions to prevent virtual IP flapping, split-brain dual-master states, and gateway drops."
  description: |
    Audits Keepalived VRRP telemetry across high-availability load balancer and firewall pairs to detect virtual IP state flapping and split-brain election storms.

    ## How it works
    1. A schedule trigger executes the VRRP audit workflow every 15 minutes.
    2. The Python task queries the Keepalived Prometheus exporter endpoint (`keepalived-exporter:9650`).
    3. The script extracts cumulative state transition counts, multicast advert errors, and active master/backup state.
    4. An evaluation gate determines whether transition frequency or advert packet errors breach stability limits.
    5. When thresholds are breached, a high-priority Slack alert is dispatched to network engineering teams.
    6. When VRRP state remains stable in master or backup mode, nominal status is logged.
    7. A structured JSON audit manifest is emitted for high-availability compliance logs and gateway telemetry archives.

    ## Architecture diagram
    ```mermaid
    graph TD
        Trigger[Schedule Trigger: 15m] --> ScanMetrics[Python Script: Scrape Keepalived VRRP Metrics]
        ScanMetrics --> EvalBreach{Transitions >= Threshold OR Advert Errors > 2?}
        EvalBreach -- Yes --> SlackAlert[Slack: High-Urgency NetOps Incident]
        EvalBreach -- No --> LogNominal[Log: Nominal VRRP Quorum State]
        SlackAlert --> EmitManifest[Debug Return: VRRP Audit Manifest]
        LogNominal --> EmitManifest
    ```

    ## Architecture components
    - **Trigger**: Automated schedule polling at 15-minute intervals.
    - **Script Task**: Scrapes Keepalived VRRP exporter metrics using Docker isolation.
    - **Decision Gate**: Evaluates whether VRRP state transition counts exceed operational stability limits.
    - **Notification Task**: Dispatches structured Slack alerts with instance identifier and transition counts.
    - **Audit Manifest**: Emits JSON execution payloads containing current state and timestamps.

    ## Key capabilities
    - Continuous surveillance of Keepalived VRRP virtual router election state.
    - Rapid detection of split-brain dual-master scenarios causing ARP cache poisoning.
    - Isolation of multicast advertisement packet drops across physical network switches.
    - Zero external dependency execution via isolated containerized Python runners.

    ## What you get
    - Preemptive alerting on load balancer virtual IP instability and link flapping.
    - Automated detection of multicast network dropouts between active-passive firewall nodes.
    - Real-time audit manifests capturing gateway transition history for compliance audits.
    - Configurable tolerance thresholds adaptable to active-passive and active-active setups.

    ## Who it's for
    - Network engineers maintaining HAProxy and NGINX high-availability virtual IP clusters.
    - Datacenter SREs overseeing bare-metal gateway routers and Linux firewall pairs.
    - Cloud infrastructure teams operating private cloud Kubernetes ingress controllers.
    - DevOps engineers diagnosing intermittent TCP connection reset spikes on VIPs.

    ## Why orchestrate this with Kestra
    - **Deterministic Scheduling**: Guarantees regular health polling without fragile local host cron jobs.
    - **Containerized Runners**: Runs Python tasks inside isolated Docker containers without host library dependencies.
    - **Condition Branching**: Flowable `If` tasks route alerts and nominal logging cleanly without spaghetti code.
    - **Enterprise Secret Safety**: Securely injects Slack webhook credentials without plain-text exposure.

    ## Use cases
    - **Switch VLAN IGMP Snooping Failure**: Detects dropped VRRP multicast packets causing nodes to enter dual-master mode.
    - **HAProxy Node Health Flap**: Alerts when upstream health check script flapping triggers continuous VRRP demotions.
    - **Gratuitous ARP Stall**: Identifies transition storms where client switches fail to update MAC address tables.
    - **Dual-Master Conflict**: Prevents IP collision outages on primary customer-facing ingress endpoints.

    ## Inputs
    | Name | Type | Default | Description |
    |---|---|---|---|
    | `keepalived_metrics_url` | STRING | `http://keepalived-exporter.networking.svc.cluster.local:9650` | Base HTTP URL exposing Keepalived Prometheus metrics. |
    | `vrrp_instance_id` | STRING | `VI_LOAD_BALANCER_EXTERNAL` | Target VRRP instance name under active surveillance. |
    | `max_state_transitions_threshold` | INT | `3` | Maximum allowable VRRP state transitions before alerting. |
    | `lookback_minutes` | INT | `15` | Lookback evaluation window in minutes for transition rate. |
    | `alert_on_vrrp_flapping` | BOOL | `true` | Toggle Slack alert dispatch upon detecting VRRP flapping. |

    ## Expected outputs
    - `{{ outputs.scan_keepalived_vrrp_metrics.vars.state_transitions_count }}`: Cumulative number of VRRP state transitions.
    - `{{ outputs.scan_keepalived_vrrp_metrics.vars.advert_errors_count }}`: Count of advertisement packet reception errors.
    - `{{ outputs.scan_keepalived_vrrp_metrics.vars.current_vrrp_state }}`: Current VRRP operational state (MASTER or BACKUP).
    - `{{ outputs.scan_keepalived_vrrp_metrics.vars.is_master }}`: Boolean flag indicating if current node holds master role.
    - `{{ outputs.scan_keepalived_vrrp_metrics.vars.is_alerting }}`: Boolean flag indicating whether flapping thresholds were breached.
    - `{{ outputs.emit_audit_manifest.value }}`: Structured JSON audit manifest emitted for compliance archives.

    ## Prerequisites
    - Keepalived daemon running with keepalived_exporter or JSON metrics socket enabled.
    - Keepalived exporter port 9650 reachable from the Kestra worker execution environment.
    - Docker daemon running on the Kestra host to execute containerized Python tasks.

    ### Secrets
    - `SLACK_WEBHOOK_URL`: Incoming webhook URL for the target NetOps Slack alerting channel.

    ## Quick start
    1. Verify that keepalived_exporter is scraping VRRP status and listening on port 9650.
    2. Configure the `SLACK_WEBHOOK_URL` secret in your Kestra namespace settings.
    3. Specify your target VRRP instance name in `vrrp_instance_id`.
    4. Execute a manual test run via the Kestra UI to verify metric ingestion.
    5. Enable the `periodic_keepalived_audit` trigger to establish automated continuous surveillance.

    ## Common pitfalls and troubleshooting
    - **VRRP Protocol 112 Blocking**: Firewalls dropping IP protocol 112 cause both nodes to assume MASTER state.
    - **Virtual Router ID Collision**: VRID collisions with other clusters on the same Layer 2 domain trigger advert errors.
    - **Authentication Mismatch**: Ensure `auth_type PASS` passwords match exactly across master and backup nodes.
    - **Unicast Peer Misconfiguration**: If multicast is blocked in cloud environments, verify unicast peer IP lists.

    ## How to extend
    - **Automated ARP Flush Sub-Flow**: Trigger an automated `arping` broadcast task upon detecting failover to clear switch caches.
    - **HAProxy Process Restart**: Chain a remediation flow to restart unhealthy upstream services when failover is triggered.
    - **PagerDuty Escalation**: Escalate to on-call network engineers when multiple VRRP instances flap simultaneously.

    ## Links
    - [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
    - [Keepalived Official Project Documentation and Configuration Guide](https://www.keepalived.org/documentation.html)
    - [Keepalived Prometheus Exporter Reference](https://github.com/cafebazaar/keepalived-exporter)
    - [Troubleshooting VRRP Split-Brain and State Flapping](https://www.redhat.com/sysadmin/keepalived-basics)
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Monitoring & Alerting
    - Infrastructure Automation
  ee: false
  demo: false
