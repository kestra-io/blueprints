id: postgresql-table-bloat-dead-tuples-sentinel
namespace: company.database

inputs:
  - id: pg_host
    type: STRING
    defaults: "postgres.internal"
    description: Hostname of the PostgreSQL database server.
  - id: pg_port
    type: INT
    defaults: 5432
    description: Port of the PostgreSQL database server.
  - id: pg_database
    type: STRING
    defaults: "production"
    description: PostgreSQL database name to audit.
  - id: max_dead_tuple_percentage
    type: INT
    defaults: 30
    description: "Maximum allowable dead tuple percentage before alerting (default 30%)."

tasks:
  - id: inspect_dead_tuples
    type: io.kestra.plugin.jdbc.postgresql.Query
    url: "jdbc:postgresql://{{ inputs.pg_host }}:{{ inputs.pg_port }}/{{ inputs.pg_database }}"
    username: "{{ secret('PG_USER') }}"
    password: "{{ secret('PG_PASSWORD') }}"
    sql: |
      SELECT relname AS table_name, n_dead_tup, n_live_tup,
             ROUND(100.0 * n_dead_tup / NULLIF(n_live_tup + n_dead_tup, 0), 1) AS dead_percentage
      FROM pg_stat_user_tables
      WHERE (n_live_tup + n_dead_tup) > 10000
        AND ROUND(100.0 * n_dead_tup / NULLIF(n_live_tup + n_dead_tup, 0), 1) >= {{ inputs.max_dead_tuple_percentage }}
      ORDER BY n_dead_tup DESC
      LIMIT 5;
    fetchType: FETCH

  - id: evaluate_table_bloat
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.inspect_dead_tuples.size > 0 }}"
    then:
      - id: notify_dba_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#dba-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 PostgreSQL Table Bloat & Dead Tuples Alert",
                "text": "Detected {{ outputs.inspect_dead_tuples.size }} table(s) on {{ inputs.pg_host }} exceeding {{ inputs.max_dead_tuple_percentage }}% dead tuples. Autovacuum is lagging or blocked by long-running transactions.",
                "footer": "Kestra Database Sentinel • PostgreSQL"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#dba-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ PostgreSQL Sentinel Failure",
            "text": "Failed to query dead tuples on PostgreSQL instance {{ inputs.pg_host }}.",
            "footer": "Kestra Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 * * * *"
    disabled: true

extend:
  metaDescription: "Audits PostgreSQL user tables for excessive dead tuples to detect autovacuum starvation."
  metaTitle: PostgreSQL Table Bloat and Dead Tuples Sentinel with Kestra
  ee: false
  demo: false
  title: PostgreSQL Table Bloat and Dead Tuples Sentinel
  shortDescription: Audits PostgreSQL user tables for excessive dead tuples to detect autovacuum starvation.
  description: |
    ## How it works
    This workflow connects to a PostgreSQL database via JDBC (`io.kestra.plugin.jdbc.postgresql.Query`) to audit `pg_stat_user_tables` for accumulated dead row versions (dead tuples). In PostgreSQL's MVCC architecture, updates and deletes produce dead tuples that must be cleared by the autovacuum daemon. When long-running transactions, idle in transaction connections, or insufficient vacuum workers block cleanup, dead tuple percentages surge. This causes severe table bloat, degrades index scanning efficiency, and inflates I/O costs. This sentinel audits tables exceeding bloat thresholds and alerts DBAs before storage degrades.

    ## What you get
    - Real-time detection of PostgreSQL dead tuple accumulation and table bloat.
    - Identification of autovacuum starvation and blocked vacuum workers.
    - Actionable Slack notifications detailing bloated table names.

    ## Who it's for
    - Database Administrators managing production PostgreSQL clusters.
    - Backend Engineers maintaining high-throughput write-heavy tables.
    - SREs safeguarding database I/O performance and disk headroom.

    ## Why orchestrate this with Kestra
    - **Native JDBC Integration**: Connects securely without requiring external agent installation.
    - **Scheduled Surveillance**: Runs automated hourly audits across enterprise databases.
    - **Automated Remediation**: Can trigger targeted `VACUUM ANALYZE` operations during low-traffic windows.

    ## Prerequisites
    - PostgreSQL database accessible over network (`5432`).
    - Dedicated read-only monitoring user.
    - Secrets `PG_USER`, `PG_PASSWORD`, and `SLACK_WEBHOOK` configured.

    ## Quick start
    1. Import this blueprint into your Kestra workspace.
    2. Configure `PG_USER`, `PG_PASSWORD`, and `SLACK_WEBHOOK` secrets.
    3. Specify `pg_host`, `pg_port`, and `pg_database`.
    4. Enable the schedule trigger for continuous bloat monitoring.

    ## How to extend
    - Trigger an automated targeted `VACUUM` on the bloated tables.
    - Query `pg_stat_activity` to isolate old transactions holding back `xmin` horizon.
    - Route high-severity bloat alerts to PagerDuty or Opsgenie.

    ## Links
    - [PostgreSQL Autovacuum Documentation](https://www.postgresql.org/docs/current/routine-vacuuming.html)
    - [Kestra PostgreSQL Plugin](https://kestra.io/plugins/plugin-jdbc-postgresql)
    - [Kestra Slack Notifications](https://kestra.io/plugins/plugin-slack)
  tags:
    - Data
    - Infrastructure
  subTags:
    - ELT & Data Landing
    - Day 2 Operations
