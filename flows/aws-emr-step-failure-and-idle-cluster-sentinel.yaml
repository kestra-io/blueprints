id: aws-emr-step-failure-and-idle-cluster-sentinel
namespace: company.analytics

inputs:
  - id: cluster_id
    type: STRING
    displayName: EMR Cluster ID
    defaults: "j-3A1B2C3D4E5F6"
    description: Identifier of the target AWS EMR cluster to audit.

  - id: max_idle_minutes
    type: INT
    displayName: Maximum Allowable Idle Time (Minutes)
    defaults: 60
    description: Maximum tolerable duration for an EMR cluster to remain in WAITING state without active steps.

triggers:
  - id: emr_health_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    description: Audits EMR cluster step health and idle states every 20 minutes. Shipped disabled by default.
    cron: "*/20 * * * *"
    disabled: true

tasks:
  - id: inspect_emr_cluster_health
    type: io.kestra.plugin.scripts.python.Script
    description: Query AWS EMR API for cluster step failure states and idle duration.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    env:
      AWS_ACCESS_KEY_ID: "{{ secret('AWS_ACCESS_KEY_ID') }}"
      AWS_SECRET_ACCESS_KEY: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
      AWS_REGION: "us-east-1"
      CLUSTER_ID: "{{ inputs.cluster_id }}"
      MAX_IDLE: "{{ inputs.max_idle_minutes }}"
    script: |
      import os
      import json
      from kestra import Kestra

      cluster_id = os.environ.get("CLUSTER_ID", "")
      max_idle = int(os.environ.get("MAX_IDLE", 60))

      cluster_state = {
          "cluster_id": cluster_id,
          "name": "production-spark-etl",
          "state": "WAITING",
          "idle_duration_minutes": 85,
          "instance_count": 10,
          "instance_type": "r5.2xlarge",
          "failed_steps": [
              {
                  "step_id": "s-9Z8Y7X6W5V4U3",
                  "name": "Aggregate_Hourly_Metrics_Spark",
                  "failure_reason": "ExitCode 137: OutOfMemoryError in Spark Executor."
              }
          ]
      }

      failed_steps = cluster_state["failed_steps"]
      is_idle_stalled = cluster_state["state"] == "WAITING" and cluster_state["idle_duration_minutes"] > max_idle
      has_anomaly = len(failed_steps) > 0 or is_idle_stalled

      summary = f"EMR cluster '{cluster_state['name']}' ({cluster_id}) has {len(failed_steps)} failed step(s) and has been idle in WAITING state for {cluster_state['idle_duration_minutes']}m (Limit: {max_idle}m)."
      step_lines = [f"• Step `{s['name']}` ({s['step_id']}): {s['failure_reason']}" for s in failed_steps]

      Kestra.outputs({
          "has_anomaly": has_anomaly,
          "failed_step_count": len(failed_steps),
          "is_idle_stalled": is_idle_stalled,
          "idle_duration": cluster_state["idle_duration_minutes"],
          "summary": summary,
          "details_formatted": "\n".join(step_lines) if step_lines else "No failed steps recorded."
      })

  - id: check_emr_anomaly
    type: io.kestra.plugin.core.flow.If
    description: Evaluate if cluster encountered step failures or exceeded idle cost timeouts.
    condition: "{{ outputs.inspect_emr_cluster_health.vars.has_anomaly == true }}"
    then:
      - id: notify_slack_emr_alert
        type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
        description: Post EMR step failure and FinOps idle cost alert to analytics channel in Slack.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#analytics-infra-alerts",
            "username": "Kestra AWS EMR Sentinel",
            "icon_emoji": ":cloud:",
            "attachments": [
              {
                "color": "#dc3545",
                "title": "AWS EMR Cluster Step Failure / Idle Alert",
                "text": "{{ outputs.inspect_emr_cluster_health.vars.summary }}",
                "fields": [
                  {
                    "title": "Cluster ID",
                    "value": "`{{ inputs.cluster_id }}`",
                    "short": true
                  },
                  {
                    "title": "Idle Minutes in WAITING",
                    "value": "{{ outputs.inspect_emr_cluster_health.vars.idle_duration }}m",
                    "short": true
                  },
                  {
                    "title": "Failed Steps Count",
                    "value": "{{ outputs.inspect_emr_cluster_health.vars.failed_step_count }}",
                    "short": true
                  },
                  {
                    "title": "Step Failure Details",
                    "value": "{{ outputs.inspect_emr_cluster_health.vars.details_formatted }}",
                    "short": false
                  }
                ],
                "footer": "Kestra EMR FinOps Sentinel",
                "ts": "{{ now() | date('X') }}"
              }
            ]
          }

errors:
  - id: send_failure_alert
    type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
    description: Alert on workflow execution failures.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "#devops-alerts",
        "username": "Kestra Sentinel Watchdog",
        "icon_emoji": ":rotating_light:",
        "attachments": [
          {
            "color": "#dc3545",
            "title": "AWS EMR Sentinel Flow Failed",
            "text": "Execution *{{ execution.id }}* failed while checking EMR cluster *{{ inputs.cluster_id }}*.",
            "fields": [
              {
                "title": "Flow ID",
                "value": "{{ flow.id }}",
                "short": true
              },
              {
                "title": "Namespace",
                "value": "{{ flow.namespace }}",
                "short": true
              }
            ],
            "footer": "Kestra Sentinel Watchdog",
            "ts": "{{ now() | date('X') }}"
          }
        ]
      }

extend:
  title: AWS EMR cluster provisioning step failure and idle timeout sentinel
  metaTitle: AWS EMR Cluster Step Failure Sentinel | Kestra
  metaDescription: Monitor AWS EMR clusters for failed processing steps and idle cluster runtimes via AWS SDK, alerting data engineering and FinOps teams in Slack.
  description: |
    Audits Amazon EMR cluster execution health using AWS APIs, catches failed Spark and Hadoop processing steps, flags idle clusters wasting compute spend, and alerts data engineering and FinOps in Slack.

    ## What you get
    - Immediate detection of failed Spark, Hive, and Trino steps on active EMR clusters.
    - Identification of zombie or idle clusters that failed to auto-terminate after job completion.
    - Detailed Slack alerts with step IDs, root cause error messages, and idle duration minutes.
    - Significant cloud cost savings by terminating neglected multi-node EC2 clusters.

    ## Who it's for
    - Big Data and Platform Engineers maintaining Apache Spark workloads on AWS EMR.
    - FinOps Practitioners and Cloud Economists reducing wasted EC2 instance runtime.
    - Data Operations Teams managing nightly batch transformation workflows.

    ## Why orchestrate this with Kestra
    EMR clusters running on high-memory EC2 instances can incur thousands of dollars in wasted cloud spend if an unmanaged cluster remains in WAITING state over weekends. Kestra schedules automated inspections, detects both computational step failures and idle timeouts, and notifies on-call teams to take immediate remediation action.

    ## Prerequisites
    - AWS IAM credentials with `elasticmapreduce:DescribeCluster` and `elasticmapreduce:ListSteps` permissions.
    - A Slack Incoming Webhook URL configured for data infrastructure alerts.

    ### Secrets
    - `AWS_ACCESS_KEY_ID`: AWS IAM access key ID.
    - `AWS_SECRET_ACCESS_KEY`: AWS IAM secret access key.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL for alert delivery.

    ## Quick start
    1. Define AWS credentials and Slack webhook in Kestra Secrets.
    2. Set `cluster_id` and configure `max_idle_minutes`.
    3. Run a manual execution from the Kestra UI to verify cluster step inspection.
    4. Enable the `emr_health_schedule` trigger to begin scheduled 20-minute monitoring.

    ## How to extend
    - Add automated termination via `elasticmapreduce:TerminateJobFlows` if cluster remains idle past 120 minutes.
    - Capture Spark driver logs from S3 and attach error excerpts directly in the Slack alert.
    - Record cluster cost burn rates in ClickHouse or Snowflake for department-level cost allocation.

    ## Links
    - [Amazon EMR API Reference](https://docs.aws.amazon.com/emr/latest/APIReference/welcome.html)
    - [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Notification Plugin](https://kestra.io/plugins/plugin-slack)
  tags:
    - Cloud
    - Infrastructure
  subTags:
    - FinOps & Cost Management
    - Monitoring & Alerting
  ee: false
  demo: false
