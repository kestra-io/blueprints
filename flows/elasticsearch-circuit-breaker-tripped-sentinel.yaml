id: elasticsearch-circuit-breaker-tripped-sentinel
namespace: company.elasticsearch

description: Monitors Elasticsearch and OpenSearch cluster circuit breakers for tripped breaker events and high JVM heap memory pressure, alerting SREs before OutOfMemory crashes occur.

concurrency:
  limit: 1

inputs:
  - id: elasticsearch_endpoint
    type: STRING
    defaults: "https://elasticsearch-cluster.internal:9200"
    description: HTTP or HTTPS endpoint URL for the Elasticsearch or OpenSearch cluster.

  - id: max_tripped_count_warning
    type: INT
    defaults: 1
    description: Minimum number of circuit breaker trips across any node to trigger an alert.

  - id: slack_channel
    type: STRING
    defaults: "#elasticsearch-sre-alerts"
    description: Slack channel destination for cluster circuit breaker alerts.

tasks:
  - id: audit_circuit_breakers
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install requests
    env:
      ES_ENDPOINT: "{{ inputs.elasticsearch_endpoint }}"
      ES_USER: "{{ secret('ELASTICSEARCH_USER') }}"
      ES_PASSWORD: "{{ secret('ELASTICSEARCH_PASSWORD') }}"
      TRIP_LIMIT: "{{ inputs.max_tripped_count_warning }}"
    script: |
      import os
      import json
      import requests
      from kestra import Kestra

      endpoint = os.getenv('ES_ENDPOINT').rstrip('/')
      user = os.getenv('ES_USER')
      password = os.getenv('ES_PASSWORD')
      trip_limit = int(os.getenv('TRIP_LIMIT', 1))

      auth = (user, password) if user and password else None
      url = f"{endpoint}/_nodes/stats/breaker"

      response = requests.get(url, auth=auth, verify=False, timeout=15)
      data = response.json()
      nodes = data.get('nodes', {})

      flagged_breakers = []

      for node_id, node_data in nodes.items():
          node_name = node_data.get('name', node_id)
          breakers = node_data.get('breakers', {})

          for breaker_name, stats in breakers.items():
              tripped = stats.get('tripped', 0)
              est_size_bytes = stats.get('estimated_size_in_bytes', 0)
              est_size_mb = est_size_bytes / (1024 * 1024)

              if tripped >= trip_limit:
                  flagged_breakers.append({
                      'node_name': node_name,
                      'breaker': breaker_name,
                      'tripped_count': tripped,
                      'estimated_size_mb': round(est_size_mb, 2)
                  })

      total_nodes = len(nodes)
      flagged_count = len(flagged_breakers)
      has_tripped = flagged_count > 0

      Kestra.outputs({
          'total_nodes_inspected': total_nodes,
          'flagged_breakers_count': flagged_count,
          'has_tripped_breakers': has_tripped,
          'affected_nodes': list(set(b['node_name'] for b in flagged_breakers))
      })

      report = {
          'total_nodes': total_nodes,
          'flagged_count': flagged_count,
          'flagged_breakers': flagged_breakers
      }

      with open('elasticsearch_breaker_report.json', 'w') as f:
          json.dump(report, f, indent=2)

    outputFiles:
      - elasticsearch_breaker_report.json

  - id: check_breaker_status
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.audit_circuit_breakers.vars.has_tripped_breakers }}"
    then:
      - id: notify_slack_sre
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "{{ inputs.slack_channel }}",
            "text": "Elasticsearch Circuit Breaker Alert: {{ outputs.audit_circuit_breakers.vars.flagged_breakers_count }} tripped circuit breaker(s) detected across nodes.\n• Affected Nodes: {{ outputs.audit_circuit_breakers.vars.affected_nodes | join(', ') }}\n• Remediation: Investigate heavy aggregation queries and fielddata heap allocations before OutOfMemory crashes occur."
          }
    else:
      - id: log_breakers_nominal
        type: io.kestra.plugin.core.log.Log
        message: "All {{ outputs.audit_circuit_breakers.vars.total_nodes_inspected }} Elasticsearch nodes have zero tripped circuit breakers."

  - id: export_breaker_manifest
    type: io.kestra.plugin.core.execution.Labels
    labels:
      flagged_breakers: "{{ outputs.audit_circuit_breakers.vars.flagged_breakers_count | string }}"
      cluster_health: "{{ outputs.audit_circuit_breakers.vars.has_tripped_breakers ? 'MEMORY_PRESSURE' : 'HEALTHY' }}"

triggers:
  - id: periodic_breaker_probe
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"

extend:
  title: Elasticsearch Circuit Breaker Tripped Sentinel
  metaTitle: Elasticsearch Circuit Breaker Tripped Sentinel
  shortDescription: Monitors Elasticsearch and OpenSearch circuit breakers to detect JVM heap saturation before OutOfMemory crashes.
  metaDescription: Monitors Elasticsearch cluster circuit breakers for tripped breaker events and JVM memory pressure, alerting SREs on Slack before node crashes occur.
  description: |
    This blueprint acts as an automated cluster memory guardian for Elasticsearch and OpenSearch deployments. Scheduled every 15 minutes, it queries the `_nodes/stats/breaker` REST endpoint, inspects parent, fielddata, request, and in-flight circuit breaker statistics, and alerts platform SRE teams on Slack when breaker trip events signal imminent JVM heap exhaustion.

    ## How it works

    1. **Recurring 15-Minute Probe**: The `periodic_breaker_probe` trigger (`io.kestra.plugin.core.trigger.Schedule`) fires every 15 minutes.
    2. **Nodes Stats Breaker Query**: The `audit_circuit_breakers` task (`io.kestra.plugin.scripts.python.Script`) queries cluster breaker telemetry across all nodes via HTTP REST API and flags any non-zero tripped counters.
    3. **Condition Gate**: The `check_breaker_status` flowable task (`io.kestra.plugin.core.flow.If`) branches based on whether any circuit breakers were tripped.
    4. **Slack Alert Dispatch**: When circuit breakers trip, `notify_slack_sre` (`io.kestra.plugin.slack.notifications.SlackIncomingWebhook`) dispatches an urgent incident card with affected node names and memory statistics.
    5. **Nominal Confirmation**: When all breakers report nominal conditions, `log_breakers_nominal` records confirmed health.
    6. **Manifest Export**: The `export_breaker_manifest` task tags the execution with searchable status labels.

    ## Architecture diagram

    ```mermaid
    flowchart TD
        A[Schedule: Every 15 Minutes] --> B[audit_circuit_breakers: Elasticsearch REST API]
        B --> C{Circuit Breaker Tripped?}
        C -- Yes --> D[notify_slack_sre: Slack Webhook]
        C -- No --> E[log_breakers_nominal: Log]
        D --> F[export_breaker_manifest: Execution Labels]
        E --> F
    ```

    ## Use cases

    - **Prevent JVM OutOfMemory Crashes**: Detect fielddata or request memory spikes before the JVM runs out of heap and kernel OOM killers terminate the Elasticsearch process.
    - **Identify Runaway Search Queries**: Pinpoint nodes subjected to complex nested aggregations or massive wildcard queries.
    - **Fleet-Wide Cluster Health Auditing**: Maintain continuous visibility into cluster JVM heap headroom across distributed search tiers.

    ## Inputs

    | Name | Type | Default | Description |
    | :--- | :--- | :--- | :--- |
    | `elasticsearch_endpoint` | STRING | `https://elasticsearch-cluster.internal:9200` | HTTP or HTTPS endpoint URL for the Elasticsearch or OpenSearch cluster. |
    | `max_tripped_count_warning` | INT | `1` | Minimum number of circuit breaker trips across any node to trigger an alert. |
    | `slack_channel` | STRING | `#elasticsearch-sre-alerts` | Slack channel destination for cluster circuit breaker alerts. |

    ## Expected outputs

    - `{{ outputs.audit_circuit_breakers.vars.total_nodes_inspected }}`: Total nodes queried in cluster.
    - `{{ outputs.audit_circuit_breakers.vars.flagged_breakers_count }}`: Number of tripped circuit breaker instances.
    - `{{ outputs.audit_circuit_breakers.vars.has_tripped_breakers }}`: Boolean flag indicating cluster memory pressure.
    - `{{ outputs.audit_circuit_breakers.vars.affected_nodes }}`: List of unique node names with tripped breakers.
    - `{{ outputs.audit_circuit_breakers.outputFiles['elasticsearch_breaker_report.json'] }}`: Full JSON breaker telemetry report.

    ## Prerequisites

    - Elasticsearch or OpenSearch credentials with `monitor` cluster privileges.
    - Incoming Webhook URL configured for your platform operations Slack channel.

    ### Secrets

    - `ELASTICSEARCH_USER`: Elasticsearch authentication username.
    - `ELASTICSEARCH_PASSWORD`: Elasticsearch authentication password.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook endpoint URL.

    ## Quick start

    1. Configure `ELASTICSEARCH_USER`, `ELASTICSEARCH_PASSWORD`, and `SLACK_WEBHOOK_URL` in your Kestra namespace secrets.
    2. Import this flow YAML into your Kestra workspace.
    3. Specify your Elasticsearch cluster endpoint in `elasticsearch_endpoint`.
    4. Click **Execute** in the UI to perform an immediate cluster circuit breaker health probe.

    ## Common pitfalls and troubleshooting

    - **Cumulative Tripped Counters**: The `tripped` counter in node stats accumulates since node process startup; track deltas or clear caches after resolving query issues.
    - **Self-Signed Certificates**: When connecting to internal clusters with self-signed SSL/TLS certificates, ensure Python requests SSL verification parameters match your corporate CA configuration.

    ## How to extend

    - Add automated fielddata cache clearing via `POST /_cache/clear?fielddata=true` upon tripping parent breaker.
    - Correlate breaker trip events with `_nodes/hot_threads` to capture thread stack traces during memory spikes.
    - Route critical alerts to PagerDuty or Opsgenie for high-priority response.

    ## Links

    - Kestra Python Script Documentation: https://kestra.io/plugins/plugin-scripts-python/io.kestra.plugin.scripts.python.Script
    - Kestra Slack Plugin Documentation: https://kestra.io/plugins/plugin-notifications
    - Elasticsearch Circuit Breaker Settings: https://www.elastic.co/guide/en/elasticsearch/reference/current/circuit-breaker.html
  tags:
    - Data
    - Infrastructure
  subTags:
    - Databases
    - Monitoring & Alerting
    - Day 2 Operations
  ee: false
  demo: false
