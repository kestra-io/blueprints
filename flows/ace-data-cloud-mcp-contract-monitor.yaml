id: ace-data-cloud-mcp-contract-monitor
namespace: company.integrations
description: Detect changes to the hosted MCP interfaces used by audio, image, video, search and chat workflows.

variables:
  # Registry suffixes and hosted names can differ. Keep the two contracts independent.
  servers:
    acemusic:    {registry: acemusic,       required: [acemusic_list_models, acemusic_get_task]}
    suno:        {registry: suno,           required: [suno_generate_music, suno_get_task]}
    nanobanana:  {registry: nanobanana-pro, required: [nanobanana_generate_image, nanobanana_edit_image]}
    openai:      {registry: openai,         required: [openai_chat_completion, openai_generate_image]}
    seedance:    {registry: seedance,       required: [seedance_generate_video, seedance_get_task]}
    kling:       {registry: kling,          required: [kling_generate_video, kling_get_task]}
    veo:         {registry: veo,            required: [veo_text_to_video, veo_get_task]}
    serp:        {registry: serp,           required: [serp_google_search, serp_google_news]}
    aichat:      {registry: aichat,         required: [aichat_list_models, aichat_create_conversation_v2]}
    seedream:    {registry: seedream-pro,   required: [seedream_generate_image, seedream_edit_image]}
    flux:        {registry: flux-pro,       required: [flux_generate_image, flux_edit_image]}
    fish:        {registry: fish,           required: [fish_generate_audio, fish_get_task]}
    hailuo:      {registry: hailuo,         required: [hailuo_generate_video, hailuo_get_task]}

tasks:
  - id: collect
    type: io.kestra.plugin.core.flow.Loop
    values: "{{ vars.servers | keys }}"
    concurrencyLimit: 3
    outputs:
      - id: archive
        type: FILE
        value: "{{ outputs.snapshot.uri }}"
      - id: missing
        type: JSON
        value: "{{ {'required': vars.servers[item.value].required, 'tools': fromJson(outputs.card.body).tools} | jq('.required - [.tools[].name]') | first }}"
      - id: advertised
        type: BOOL
        value: >-
          {{ (outputs.registry.body | jq('[.server.remotes[]? | select(.type == "streamable-http") | .url]') | first)
          contains ('https://' ~ item.value ~ '.mcp.acedata.cloud/mcp') }}
    tasks:
      - id: registry
        type: io.kestra.plugin.core.http.Request
        uri: "https://registry.modelcontextprotocol.io/v0.1/servers/io.github.AceDataCloud%2Fmcp-{{ vars.servers[item.value].registry }}/versions/latest"

      - id: card
        type: io.kestra.plugin.core.http.Request
        uri: "https://{{ item.value }}.mcp.acedata.cloud/.well-known/mcp/server-card.json"

      - id: registry_file
        type: io.kestra.plugin.core.storage.Write
        extension: .json
        content: "{{ outputs.registry.body }}"

      - id: card_file
        type: io.kestra.plugin.core.storage.Write
        extension: .json
        content: "{{ outputs.card.body }}"

      - id: snapshot
        type: io.kestra.plugin.compress.ArchiveCompress
        algorithm: ZIP
        from:
          registry.json: "{{ outputs.registry_file.uri }}"
          server-card.json: "{{ outputs.card_file.uri }}"

  - id: compare
    type: io.kestra.plugin.core.output.OutputValues
    values:
      changes: >-
        {{ outputs.collect.outputs | jq('[.[] | select((.outputs.advertised == false) or ((.outputs.missing | length) > 0)) |
        {service: .item.value, expected_endpoint_present: .outputs.advertised, missing_tools: .outputs.missing}]') | first | toJson }}

  - id: check_contracts
    type: io.kestra.plugin.core.flow.If
    condition: "{{ fromJson(outputs.compare.values.changes) | length > 0 }}"
    then:
      - id: incompatible
        type: io.kestra.plugin.core.execution.Fail
        errorMessage: "MCP discovery changed. Inspect the corresponding snapshot archives. {{ outputs.compare.values.changes }}"

outputs:
  - id: archives
    type: JSON
    value: "{{ outputs.collect.outputs | jq('map({key: .item.value, value: .outputs.archive}) | from_entries') | first }}"

triggers:
  - id: daily
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "15 9 * * *"
    timezone: UTC
    disabled: true

extend:
  title: Monitor hosted Ace Data Cloud MCP tool contracts and archive discovery evidence
  metaTitle: Monitor Ace Data Cloud MCP discovery in Kestra
  shortDescription: Check the hosted MCP endpoint and the tools each integration uses, then save the registry entry and the server card together.
  metaDescription: Detect changes to audio, image, video, search and chat MCP discovery and archive both the public registry record and the server card for investigation.
  description: |
    ## How it works
    1. The loop reads the MCP Registry entry and public server card for each configured host. The registry name can differ from the DNS name.
    2. Each iteration archives the two original documents. It checks the Streamable HTTP endpoint and computes which required tool names are missing.
    3. Once collection completes, the flow reports every contract mismatch together. An HTTP failure instead identifies the request and service in the execution view.

    ## What you get
    - A service-to-ZIP map with the two discovery documents used in each comparison.
    - A failed execution with the affected service, missing tools and expected endpoint status on drift. New optional tools retain compatibility.

    ## Who it's for
    Integration engineers whose agents depend on music, image or video tools, Google Search, or chat. The OpenAI host entry covers both chat and GPT Image tools.

    ## Why orchestrate this with Kestra
    The loop limits concurrent requests to the registry. Retained per-service files let operators inspect the source of a change even after the public documents update.

    ## Prerequisites
    Install the Compress plugin and allow HTTPS to the MCP Registry and the configured public server-card hosts.

    ### Secrets
    None. This flow reads discovery documents. Calling the advertised tools requires a separate authenticated client.

    ## Quick start
    1. Keep the entries your downstream workflow depends on in the servers variable.
    2. Execute manually and open a ZIP from the archives output.
    3. Check both JSON files and enable the daily schedule.

    ## How to extend
    Add a server by recording its registry suffix, hosted name and required tool names. Add a failure notification to the operations channel responsible for the affected workflows.

    ## Links
    - [MCP Registry](https://registry.modelcontextprotocol.io)
    - [Ace Data Cloud MCP servers](https://github.com/AceDataCloud/MCPs)
    - [Kestra Compress plugin](https://kestra.io/plugins/plugin-compress)
  tags:
    - AI
  subTags:
    - Monitoring & Alerting
  ee: false
  demo: false
