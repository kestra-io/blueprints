    - [CrowdStrike Falcon Devices API Reference](https://falcon.crowdstrike.com/documentation/page/d998cb3b/devices-and-device-groups)
    - [Troubleshooting CrowdStrike Falcon Sensor Connectivity](https://supportportal.crowdstrike.com/s/article/ka16T000000s1BQQAY)
