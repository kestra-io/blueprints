id: redis-cluster-failover-state-audit-sentinel
namespace: company.caching

inputs:
  - id: redis_host
    type: STRING
    defaults: "redis-cluster.internal"
    description: Hostname of any node in the Redis Cluster.
  - id: redis_port
    type: INT
    defaults: 6379
    description: Port of the Redis Cluster node.

tasks:
  - id: inspect_cluster_state
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.12-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install redis kestra
    env:
      REDIS_HOST: "{{ inputs.redis_host }}"
      REDIS_PORT: "{{ inputs.redis_port }}"
      REDIS_PASSWORD: "{{ secret('REDIS_PASSWORD') }}"
    script: |
      import os
      import sys
      import redis
      from kestra import Kestra

      host = os.environ.get("REDIS_HOST", "redis-cluster.internal")
      port = int(os.environ.get("REDIS_PORT", "6379"))
      password = os.environ.get("REDIS_PASSWORD") or None

      try:
          r = redis.Redis(host=host, port=port, password=password, socket_connect_timeout=10, socket_timeout=10)
          info = r.cluster_info()
      except Exception as e:
          print(f"Error querying Redis cluster info at {host}:{port}: {e}", file=sys.stderr)
          sys.exit(1)

      state = info.get("cluster_state", "fail")
      slots_fail = int(info.get("cluster_slots_fail", 0))
      is_breach = 1 if state != "ok" or slots_fail > 0 else 0

      print(f"Redis cluster: state={state}, slots_fail={slots_fail}, is_breach={is_breach}")
      Kestra.outputs({
          "is_breach": is_breach,
          "cluster_state": state,
          "slots_fail": slots_fail
      })

  - id: evaluate_cluster_health
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.inspect_cluster_state.vars.is_breach | int == 1 }}"
    then:
      - id: notify_caching_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#caching-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 Redis Cluster Slot Degradation Alert",
                "text": "Redis Cluster at {{ inputs.redis_host }} has state {{ outputs.inspect_cluster_state.vars.cluster_state }} with {{ outputs.inspect_cluster_state.vars.slots_fail }} failed hash slots. Key-value operations for unassigned slots will throw CLUSTERDOWN errors.",
                "footer": "Kestra Caching Sentinel • Redis Cluster"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#caching-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ Redis Cluster Sentinel Failure",
            "text": "Failed to communicate with Redis Cluster node at {{ inputs.redis_host }}.",
            "footer": "Kestra Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/5 * * * *"
    disabled: true

outputs:
  - id: is_breach
    type: INT
    value: "{{ outputs.inspect_cluster_state.vars.is_breach }}"
  - id: cluster_state
    type: STRING
    value: "{{ outputs.inspect_cluster_state.vars.cluster_state }}"
  - id: slots_fail
    type: INT
    value: "{{ outputs.inspect_cluster_state.vars.slots_fail }}"

extend:
  metaDescription: "Audits Redis Cluster hash slot allocation and cluster state to prevent CLUSTERDOWN outages."
  metaTitle: Redis Cluster Hash Slot Availability and State Sentinel with Kestra
  ee: false
  demo: false
  title: Redis Cluster Hash Slot Availability and State Sentinel
  shortDescription: Audits Redis Cluster hash slot allocation and cluster state to prevent CLUSTERDOWN outages.
  description: |
    ## How it works
    This workflow connects to a Redis Cluster node via `redis-cli` to execute `CLUSTER INFO`. In Redis Cluster, all 16,384 hash slots must be actively bound to healthy master nodes. If an unhandled master failover fails, replica election times out, or network partition occurs, `cluster_state` transitions from `ok` to `fail`, and `cluster_slots_fail` increases. In this state, any client request mapped to failing slots is rejected with a `CLUSTERDOWN` error. This sentinel audits hash slot integrity and alerts the infrastructure team before application caching completely collapses.

    ## What you get
    - Continuous surveillance of Redis Cluster hash slot allocations.
    - Early warning for failed node failovers and unassigned hash slots.
    - Automated Slack incident notifications detailing cluster state and failed slots.

    ## Who it's for
    - Database Administrators and SREs maintaining distributed Redis clusters.
    - Backend Engineers relying on sub-millisecond Redis session caching.
    - Platform Operations teams managing distributed key-value infrastructure.

    ## Why orchestrate this with Kestra
    - **High-Frequency Health Checks**: Executes lightweight cluster audits every 5 minutes.
    - **Native Command Execution**: Queries standard Redis interfaces securely with encrypted password injection.
    - **Cross-Layer Telemetry**: Correlates caching health with web tier latency sentinels.

    ## Prerequisites
    - Redis Cluster with accessible client ports (`6379`).
    - Redis CLI tool installed in the runner container.
    - Secrets `REDIS_PASSWORD` and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import this blueprint into your Kestra instance.
    2. Add `REDIS_PASSWORD` and `SLACK_WEBHOOK` secrets.
    3. Specify `redis_host` and `redis_port`.
    4. Enable the schedule trigger to activate automatic hash slot surveillance.

    ## How to extend
    - Query `CLUSTER NODES` to extract specific IP addresses of failing replica or master nodes.
    - Trigger an automated cluster fix via `redis-cli --cluster fix`.
    - Route critical alerts to PagerDuty or Opsgenie.

    ## Links
    - [Redis Cluster Tutorial](https://redis.io/docs/management/scaling/)
    - [Kestra Python Plugin](https://kestra.io/plugins/plugin-scripts-shell)
    - [Kestra Slack Notifications](https://kestra.io/plugins/plugin-slack)
  tags:
    - Data
    - Infrastructure
  subTags:
    - Policy & Compliance
    - ELT & Data Landing
