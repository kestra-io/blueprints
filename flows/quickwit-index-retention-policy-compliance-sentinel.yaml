id: quickwit-index-retention-policy-compliance-sentinel
namespace: company.data

labels:
  env: production
  system: quickwit
  category: data-platform

inputs:
  - id: quickwit_url
    type: STRING
    displayName: Quickwit Base URL
    description: REST API endpoint of the Quickwit cluster (default http://localhost:7280).
    defaults: http://localhost:7280

  - id: index_id
    type: STRING
    displayName: Index ID
    description: ID of the Quickwit index to audit for retention policy compliance and search health.
    defaults: app-logs

  - id: approved_retention_period
    type: STRING
    displayName: Approved Retention Period
    description: Approved retention period string (e.g., "30 days", "60 days") that the index must adhere to under data governance policies.
    defaults: 30 days

  - id: enforce_strict_period
    type: BOOL
    displayName: Enforce Strict Period
    description: When true, classifies any retention period differing from approved_retention_period as non-compliant.
    defaults: true

  - id: max_query_latency_ms
    type: INT
    displayName: Max Query Latency (ms)
    description: Maximum acceptable canary search latency in milliseconds before flagging query degradation.
    defaults: 500

  - id: alert_on_warning
    type: BOOL
    displayName: Alert on Warning
    description: Whether to dispatch Slack alerts for non-critical policy warnings in addition to critical retention breaches.
    defaults: true

triggers:
  - id: periodic_retention_audit_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    description: Scheduled surveillance trigger auditing Quickwit index retention configuration every 6 hours.
    cron: "0 */6 * * *"
    disabled: true
    inputs:
      quickwit_url: "http://localhost:7280"
      index_id: "app-logs"
      approved_retention_period: "30 days"
      enforce_strict_period: true
      max_query_latency_ms: 500
      alert_on_warning: true

tasks:
  - id: probe_index_metadata
    type: io.kestra.plugin.quickwit.index.Get
    description: Fetch index configuration, document mappings, and effective retention policy definitions from the Quickwit cluster.
    url: "{{ inputs.quickwit_url }}"
    index: "{{ inputs.index_id }}"

  - id: probe_search_availability
    type: io.kestra.plugin.quickwit.search.Search
    description: Execute a lightweight canary search query to measure cluster query liveness and response latency.
    url: "{{ inputs.quickwit_url }}"
    index: "{{ inputs.index_id }}"
    query: "*"
    fetchType: FETCH

  - id: classify_retention_compliance
    type: io.kestra.plugin.core.log.Log
    description: Evaluate retrieved index metadata and search latency against organizational governance benchmarks.
    message: |
      Quickwit Retention Audit Evaluation for Index '{{ inputs.index_id }}':
      - Index UID: {{ outputs.probe_index_metadata.indexUid }}
      - Configured Retention: {{ outputs.probe_index_metadata.metadata.indexConfig.retention | json }}
      - Approved Retention Period: {{ inputs.approved_retention_period }}
      - Canary Hits Count: {{ outputs.probe_search_availability.numHits }}
      - Search Latency: {{ outputs.probe_search_availability.elapsedTimeMicros / 1000 }} ms (Threshold: {{ inputs.max_query_latency_ms }} ms)

  - id: route_by_compliance_status
    type: io.kestra.plugin.core.flow.Switch
    description: Branch flow execution based on Quickwit retention policy compliance and search health.
    value: "{{ (outputs.probe_index_metadata.metadata == null or outputs.probe_index_metadata.metadata.indexConfig == null or outputs.probe_index_metadata.metadata.indexConfig.retention == null) ? 'CRITICAL_RETENTION_UNCONFIGURED' : (inputs.enforce_strict_period and outputs.probe_index_metadata.metadata.indexConfig.retention.period != inputs.approved_retention_period ? 'POLICY_RETENTION_EXCEEDED' : 'COMPLIANT') }}"
    cases:
      CRITICAL_RETENTION_UNCONFIGURED:
        - id: log_critical_retention_breach
          type: io.kestra.plugin.core.log.Log
          level: ERROR
          message: "CRITICAL: Quickwit index '{{ inputs.index_id }}' has NO retention policy configured! Immutable splits will accumulate unbounded in object storage."

        - id: alert_slack_critical
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: Dispatch high-priority incident alert to Slack when an index lacks retention configuration.
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "text": "CRITICAL: Quickwit index '{{ inputs.index_id }}' has NO retention policy configured!",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "Quickwit Sentinel Alert: Missing Retention Policy",
                    "emoji": true
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Cluster URL:*\n{{ inputs.quickwit_url }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Index ID:*\n`{{ inputs.index_id }}`"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Index UID:*\n`{{ outputs.probe_index_metadata.indexUid }}`"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Retention Status:*\n*UNCONFIGURED / INFINITE*"
                    }
                  ]
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Remediation Required:* Update the index configuration to define a `retention` block with `period` (e.g. `\"30 days\"`) and `schedule` (`\"@daily\"`) to prevent runaway cloud storage billing."
                  }
                },
                {
                  "type": "context",
                  "elements": [
                    {
                      "type": "mrkdwn",
                      "text": "Execution: {{ execution.id }} | Flow: {{ flow.id }} | Namespace: {{ flow.namespace }}"
                    }
                  ]
                }
              ]
            }

      POLICY_RETENTION_EXCEEDED:
        - id: log_policy_warning
          type: io.kestra.plugin.core.log.Log
          level: WARN
          message: "WARNING: Quickwit index '{{ inputs.index_id }}' configured retention period '{{ outputs.probe_index_metadata.metadata.indexConfig.retention.period }}' does not match approved period '{{ inputs.approved_retention_period }}'."

        - id: alert_slack_warning
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: Dispatch warning alert to Slack when retention period drifts from approved governance baseline.
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          runIf: "{{ inputs.alert_on_warning }}"
          payload: |
            {
              "text": "WARNING: Quickwit index '{{ inputs.index_id }}' retention policy drift detected.",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "Quickwit Governance Warning: Retention Policy Drift",
                    "emoji": true
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Index:*\n`{{ inputs.index_id }}`"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Configured Period:*\n`{{ outputs.probe_index_metadata.metadata.indexConfig.retention.period }}`"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Approved Period:*\n`{{ inputs.approved_retention_period }}`"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Canary Search Latency:*\n{{ outputs.probe_search_availability.elapsedTimeMicros / 1000 }} ms"
                    }
                  ]
                },
                {
                  "type": "context",
                  "elements": [
                    {
                      "type": "mrkdwn",
                      "text": "Execution: {{ execution.id }} | Namespace: {{ flow.namespace }}"
                    }
                  ]
                }
              ]
            }

      COMPLIANT:
        - id: log_compliant_status
          type: io.kestra.plugin.core.log.Log
          message: "Quickwit index '{{ inputs.index_id }}' is COMPLIANT: retention period is '{{ outputs.probe_index_metadata.metadata.indexConfig.retention.period }}' on schedule '{{ outputs.probe_index_metadata.metadata.indexConfig.retention.schedule }}'. Canary query executed in {{ outputs.probe_search_availability.elapsedTimeMicros / 1000 }} ms."

  - id: log_audit_summary
    type: io.kestra.plugin.core.log.Log
    description: Record a permanent audit log entry summarizing index retention health and query metrics for governance history.
    message: |
      QUICKWIT INDEX RETENTION AUDIT SUMMARY:
      - Execution ID: {{ execution.id }}
      - Cluster: {{ inputs.quickwit_url }}
      - Index: {{ inputs.index_id }} (UID: {{ outputs.probe_index_metadata.indexUid }})
      - Retention Defined: {{ outputs.probe_index_metadata.metadata.indexConfig.retention != null }}
      - Retention Period: {{ outputs.probe_index_metadata.metadata.indexConfig.retention.period ?? 'NONE' }}
      - Status: {{ (outputs.probe_index_metadata.metadata == null or outputs.probe_index_metadata.metadata.indexConfig == null or outputs.probe_index_metadata.metadata.indexConfig.retention == null) ? 'CRITICAL_RETENTION_UNCONFIGURED' : (inputs.enforce_strict_period and outputs.probe_index_metadata.metadata.indexConfig.retention.period != inputs.approved_retention_period ? 'POLICY_RETENTION_EXCEEDED' : 'COMPLIANT') }}
      - Canary Hits: {{ outputs.probe_search_availability.numHits }}
      - Canary Latency Micros: {{ outputs.probe_search_availability.elapsedTimeMicros }}
      - Timestamp: {{ now() }}

errors:
  - id: alert_flow_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Dispatch emergency alert to Slack if Quickwit cluster connection or probe execution fails.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "ERROR: Quickwit Retention Sentinel failed during execution {{ execution.id }}. Check Kestra execution logs."
      }

  - id: log_failure_context
    type: io.kestra.plugin.core.log.Log
    level: ERROR
    message: "Quickwit Index Retention Sentinel failed during probe execution for index {{ inputs.index_id }} on cluster {{ inputs.quickwit_url }}."

extend:
  title: Quickwit Index Retention Policy and Cold Storage Headroom Sentinel
  metaTitle: Quickwit Index Retention Policy & Storage Sentinel | Kestra
  shortDescription: Continuously audit Quickwit search indexes for missing retention policies, verify canary query health, and alert Slack on storage governance drift.
  metaDescription: Audit Quickwit search indexes for missing retention policies and split accumulation, verify canary query liveness, and alert Slack on storage quota breaches.
  description: |
    Proactively audit Quickwit cloud-native search indexes to detect unconfigured or non-compliant document retention policies, verify search engine responsiveness via canary queries, and dispatch actionable Slack alerts before storage bloat or compliance violations occur.

    ## How it works

    1. **Automated Surveillance Trigger**: `periodic_retention_audit_schedule` (`io.kestra.plugin.core.trigger.Schedule`) initiates a periodic retention audit every 6 hours, with on-demand manual runs supported.
    2. **Multi-Stage Cluster Probes**:
       - `probe_index_metadata` (`io.kestra.plugin.quickwit.index.Get`) retrieves the effective configuration for `index_id`, inspecting document mappings, source checkpoints, and the `retention` specification block.
       - `probe_search_availability` (`io.kestra.plugin.quickwit.search.Search`) executes a lightweight canary search query (`*`) to verify query service liveness and capture query execution latency in microseconds.
    3. **Pebble Compliance Evaluation**: Evaluates whether a `retention` block exists and checks if `retention.period` aligns with organizational data governance rules (`approved_retention_period`), classifying index state as `COMPLIANT`, `POLICY_RETENTION_EXCEEDED`, or `CRITICAL_RETENTION_UNCONFIGURED`.
    4. **Switch Routing & Safe Remediation**:
       - `CRITICAL_RETENTION_UNCONFIGURED`: Emits an error log and dispatches a high-priority Slack incident alert with index UID and actionable guidance on adding a daily retention schedule.
       - `POLICY_RETENTION_EXCEEDED`: Emits a warning log and dispatches a Slack warning notification detailing the retention period drift.
       - `COMPLIANT`: Emits an operational verification log confirming retention schedules and search latency are within SLA bounds.
    5. **Audit Trail Logging**: `log_audit_summary` (`io.kestra.plugin.core.log.Log`) records a persistent telemetry summary in Kestra execution logs for compliance audits and historical capacity tracking.
    6. **Error Incident Fallback**: Dedicated `errors` tasks catch cluster unreachable errors or HTTP timeouts, notifying on-call engineers immediately.

    ## What you get

    - Automated retention policy governance across self-hosted or cloud Quickwit search clusters.
    - Early warning detection for missing retention policies that risk runaway cloud object storage (S3/MinIO/GCS) bills.
    - Real-time Slack notifications with rich block formatting and remediation recommendations.
    - Integrated canary query liveness testing to continuously validate search API availability.
    - Fully testable against standard open-source Quickwit Docker images.

    ## Who it's for

    - **Data Platform & FinOps Engineers**: Preventing cloud storage cost overruns caused by unpruned index split files.
    - **Site Reliability Engineers (SREs)**: Automating log cluster health monitoring and verifying search query response times.
    - **Security & Compliance Officers**: Enforcing mandatory data retention limits and GDPR log sanitization schedules.

    ## Why orchestrate this with Kestra

    Quickwit delegates storage garbage collection to an internal janitor loop, but cannot alert external teams if an index author forgets to define a retention block. Orchestrating this sentinel with Kestra provides declarative YAML workflows, secret isolation for webhook credentials, built-in retry handling for cluster maintenance windows, and comprehensive audit history.

    ## Prerequisites

    - A running Quickwit cluster reachable from the Kestra worker over HTTP (default port 7280).
    - At least one active Quickwit index created on the cluster.
    - An incoming Slack webhook URL for alert notifications.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL used to dispatch retention incident alerts.

    ## Quick start

    1. Start a local open-source Quickwit container for testing:
       ```bash
       docker run -d --name quickwit -p 7280:7280 quickwit/quickwit:latest run
       ```
    2. Add the `SLACK_WEBHOOK_URL` secret in your Kestra namespace.
    3. Import this blueprint into your Kestra instance.
    4. Execute the flow manually with default inputs to inspect the retention audit results.
    5. Enable the `periodic_retention_audit_schedule` trigger for automated background monitoring.

    ## How to extend

    - **Automated Retention Patching**: Add an `io.kestra.plugin.quickwit.index.Create` task in the remediation branch with `docMapping` and `retention` configured to automatically patch unconfigured indexes.
    - **Multi-Index Fleet Audit**: Use `io.kestra.plugin.quickwit.index.List` combined with a `Loop` flow task to iterate through and audit every index in the cluster in a single run.
    - **Prometheus Metrics Export**: Push canary latency and retention compliance gauges to an OpenTelemetry or Prometheus Pushgateway.
    - **PagerDuty Escalation**: Route critical missing-retention alerts to PagerDuty or Opsgenie during production deployments.

    ## Links

    - [Quickwit Documentation](https://quickwit.io/docs)
    - [Quickwit Retention Policy Reference](https://quickwit.io/docs/configuration/retention-policy)
    - [Kestra Quickwit Plugin Documentation](https://kestra.io/plugins/plugin-quickwit)
    - [Kestra Slack Notification Plugin](https://kestra.io/plugins/plugin-notifications/tasks/io.kestra.plugin.notifications.slack.slackincomingwebhook)
  tags:
    - Data
  subTags:
    - Monitoring & Alerting
    - Day 2 Operations
  ee: false
  verified: false
  demo: false
