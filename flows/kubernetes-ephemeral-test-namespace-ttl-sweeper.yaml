id: kubernetes-ephemeral-test-namespace-ttl-sweeper
namespace: company.team

description: |
  Discovers and deletes stale Kubernetes preview and ephemeral test namespaces whose
  pull requests have been closed or merged, or whose age exceeds max TTL, reporting
  summary actions to Slack with strict dry-run and blast radius safeguards.

concurrency:
  limit: 1
  behavior: QUEUE

inputs:
  - id: preview_label_selector
    type: STRING
    defaults: "preview=true"
    displayName: Preview Label Selector
    description: "Kubernetes label selector used to discover candidate ephemeral namespaces (server-side filter via kubectl -l)."

  - id: name_regex
    type: STRING
    defaults: "^pr-[0-9]+$"
    displayName: Namespace Name Regex
    description: "Regular expression pattern required for a namespace name to be considered for deletion."

  - id: github_repo
    type: STRING
    defaults: "kestra-io/blueprints"
    displayName: GitHub Repository
    description: "GitHub repository in owner/repo format whose pull requests correspond to ephemeral namespaces."

  - id: max_ttl_hours
    type: INT
    defaults: 72
    displayName: Maximum TTL (Hours)
    description: "Maximum allowable namespace age in hours before sweeping regardless of open pull request state."

  - id: min_age_hours
    type: INT
    defaults: 1
    displayName: Minimum Age Grace Period (Hours)
    description: "Minimum age required before a namespace can be swept, protecting newly created environments."

  - id: max_deletions_per_run
    type: INT
    defaults: 5
    displayName: Blast Radius Deletion Cap
    description: "Maximum number of namespaces to delete in a single sweep execution; remainder are deferred."

  - id: dry_run
    type: BOOL
    defaults: true
    displayName: Dry Run Mode
    description: "When true, discovers and evaluates real cluster state and logs planned actions without deleting."

  - id: slack_channel
    type: STRING
    defaults: "#devops-alerts"
    displayName: Slack Notification Channel
    description: "Target Slack channel for the sweep execution report."

triggers:
  - id: sweep_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    description: "Runs the namespace sweep periodically every 2 hours."
    cron: "0 */2 * * *"
    disabled: true

tasks:
  - id: list_namespaces
    type: io.kestra.plugin.scripts.shell.Commands
    description: "Lists cluster namespaces matching the preview label selector using kubectl (server-side label filter) and writes them to namespaces.json."
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: alpine/k8s:1.30.6
    env:
      K8S_MASTER_URL: "{{ secret('K8S_MASTER_URL') }}"
      K8S_TOKEN: "{{ secret('K8S_TOKEN') }}"
      K8S_CA_CERT_DATA: "{{ secret('K8S_CA_CERT_DATA') }}"
      LABEL_SELECTOR: "{{ inputs.preview_label_selector }}"
    outputFiles:
      - namespaces.json
    commands:
      - |
        set -eu
        printf '%s' "$K8S_CA_CERT_DATA" | base64 -d > ca.crt
        kubectl \
          --server="$K8S_MASTER_URL" \
          --token="$K8S_TOKEN" \
          --certificate-authority=ca.crt \
          get namespaces -l "$LABEL_SELECTOR" -o json \
          | jq '[.items[] | {name: .metadata.name, creationTimestamp: .metadata.creationTimestamp, deletionTimestamp: (.metadata.deletionTimestamp // null)}]' \
          > namespaces.json
        echo "Discovered $(jq length namespaces.json) namespace(s) matching '$LABEL_SELECTOR'"

  - id: filter_candidates
    type: io.kestra.plugin.core.output.OutputValues
    description: "Filters discovered namespaces by name regex, exclusion list, terminating phase, and minimum age grace period."
    values:
      candidates: >-
        {{
          fromJson(read(outputs.list_namespaces.outputFiles['namespaces.json'])) | jq(
            'map(select(' ~
              '(.name | test("' ~ inputs.name_regex ~ '")) and ' ~
              '(.name != "kube-system" and .name != "kube-public" and .name != "kube-node-lease" and .name != "default") and ' ~
              '(.deletionTimestamp == null or .deletionTimestamp == "") and ' ~
              '((now - (.creationTimestamp | fromdateiso8601)) >= (' ~ (inputs.min_age_hours * 3600) ~ '))' ~
            ')) | sort_by(.creationTimestamp | fromdateiso8601) | map({' ~
              'name: .name, ' ~
              'creationTimestamp: .creationTimestamp, ' ~
              'age_hours: (((now - (.creationTimestamp | fromdateiso8601)) / 3600) | floor), ' ~
              'pr_number: (if (.name | test("[0-9]+")) then (.name | capture("(?<pr>[0-9]+)") | .pr) else "" end)' ~
            '})'
          ) | first ?? []
        }}

  - id: evaluate_candidates_loop
    type: io.kestra.plugin.core.flow.Loop
    description: "Iterates sequentially through candidate namespaces to query GitHub pull request states and calculate verdicts."
    values: "{{ outputs.filter_candidates.values.candidates }}"
    concurrencyLimit: 1
    outputs:
      - id: verdict
        type: JSON
        value: "{{ outputs.record_verdict.values.verdict }}"
    tasks:
      - id: check_github_pr
        type: io.kestra.plugin.core.flow.If
        description: "Queries GitHub Pull Request API when the candidate namespace name contains a pull request number."
        condition: "{{ item.value.pr_number != '' }}"
        then:
          - id: get_pr
            type: io.kestra.plugin.core.http.Request
            description: "Fetches pull request details from the GitHub REST API."
            uri: "https://api.github.com/repos/{{ inputs.github_repo }}/pulls/{{ item.value.pr_number }}"
            method: GET
            headers:
              Accept: "application/vnd.github+json"
              Authorization: "Bearer {{ secret('GITHUB_TOKEN') }}"
              X-GitHub-Api-Version: "2022-11-28"
            options:
              allowFailed: true
            retry:
              type: constant
              interval: PT5S
              maxAttempts: 3

      - id: record_verdict
        type: io.kestra.plugin.core.output.OutputValues
        description: "Evaluates qualification status, reason, and any API errors for this candidate namespace."
        values:
          verdict: >-
            {{
              {
                "name": item.value.name,
                "age_hours": item.value.age_hours,
                "pr_number": (item.value.pr_number != "" ? item.value.pr_number : null),
                "pr_state": (
                  item.value.pr_number != "" and outputs.get_pr is defined ? (
                    outputs.get_pr.code == 200 ? (outputs.get_pr.body | jq('.state') | first) :
                    outputs.get_pr.code == 404 ? "not_found" : "error"
                  ) : "none"
                ),
                "qualifies": (
                  item.value.pr_number != "" and outputs.get_pr is defined ? (
                    outputs.get_pr.code == 200 ? (
                      ((outputs.get_pr.body | jq('.merged') | first) == true) or
                      ((outputs.get_pr.body | jq('.state') | first) == "closed") or
                      (item.value.age_hours > inputs.max_ttl_hours)
                    ) :
                    outputs.get_pr.code == 404 ? (item.value.age_hours > inputs.max_ttl_hours) :
                    false
                  ) :
                  (item.value.age_hours > inputs.max_ttl_hours)
                ),
                "reason": (
                  item.value.pr_number != "" and outputs.get_pr is defined ? (
                    outputs.get_pr.code == 200 ? (
                      ((outputs.get_pr.body | jq('.merged') | first) == true) ? "pr_merged" :
                      ((outputs.get_pr.body | jq('.state') | first) == "closed") ? "pr_closed" :
                      (item.value.age_hours > inputs.max_ttl_hours) ? "ttl_exceeded" : "active_pr_within_ttl"
                    ) :
                    outputs.get_pr.code == 404 ? (
                      (item.value.age_hours > inputs.max_ttl_hours) ? "ttl_exceeded" : "pr_not_found_within_ttl"
                    ) :
                    "github_api_error"
                  ) :
                  (
                    (item.value.age_hours > inputs.max_ttl_hours) ? "ttl_exceeded" : "within_ttl"
                  )
                ),
                "error": (
                  item.value.pr_number != "" and outputs.get_pr is defined and outputs.get_pr.code != 200 and outputs.get_pr.code != 404 ?
                  ("GitHub API returned HTTP " ~ outputs.get_pr.code ~ " for PR #" ~ item.value.pr_number) :
                  null
                )
              } | toJson
            }}

  - id: plan_actions
    type: io.kestra.plugin.core.output.OutputValues
    description: "Applies the blast radius cap to qualifying namespaces, partitioning into deletion targets, deferred items, and errors."
    values:
      to_delete: >-
        {{
          ((outputs.evaluate_candidates_loop.outputs is defined and outputs.evaluate_candidates_loop.outputs is not null) ? loopOutputs(outputs.evaluate_candidates_loop.outputs, 'verdict') : []) | jq(
            'map(select(.qualifies == true and .reason != "github_api_error"))[:' ~ inputs.max_deletions_per_run ~ ']'
          ) | first ?? []
        }}
      deferred: >-
        {{
          ((outputs.evaluate_candidates_loop.outputs is defined and outputs.evaluate_candidates_loop.outputs is not null) ? loopOutputs(outputs.evaluate_candidates_loop.outputs, 'verdict') : []) | jq(
            'map(select(.qualifies == true and .reason != "github_api_error"))[' ~ inputs.max_deletions_per_run ~ ':]'
          ) | first ?? []
        }}
      errors: >-
        {{
          ((outputs.evaluate_candidates_loop.outputs is defined and outputs.evaluate_candidates_loop.outputs is not null) ? loopOutputs(outputs.evaluate_candidates_loop.outputs, 'verdict') : []) | jq(
            'map(select(.reason == "github_api_error"))'
          ) | first ?? []
        }}

  - id: execute_cleanup
    type: io.kestra.plugin.core.flow.If
    description: "Executes planned namespace deletions or logs dry-run actions for namespaces qualifying under the cap."
    condition: "{{ (outputs.plan_actions.values.to_delete ?? []) | length > 0 }}"
    then:
      - id: check_dry_run_mode
        type: io.kestra.plugin.core.flow.If
        description: "Branches execution between dry-run reporting and live cluster deletion."
        condition: "{{ inputs.dry_run }}"
        then:
          - id: log_dry_run_plan
            type: io.kestra.plugin.core.flow.Loop
            description: "Logs planned namespace deletions without making cluster modifications."
            values: "{{ outputs.plan_actions.values.to_delete }}"
            concurrencyLimit: 1
            tasks:
              - id: log_dry_run_item
                type: io.kestra.plugin.core.log.Log
                message: "DRY RUN: would delete namespace {{ item.value.name }} (age: {{ item.value.age_hours }}h, PR: #{{ item.value.pr_number ?? 'none' }}, reason: {{ item.value.reason }})"
        else:
          - id: delete_qualifying_namespaces
            type: io.kestra.plugin.scripts.shell.Commands
            description: "Deletes qualifying namespaces up to the blast radius cap using kubectl, re-checking the opt-in label before each delete and ignoring namespaces that are already gone."
            taskRunner:
              type: io.kestra.plugin.scripts.runner.docker.Docker
            containerImage: alpine/k8s:1.30.6
            allowFailure: true
            env:
              K8S_MASTER_URL: "{{ secret('K8S_MASTER_URL') }}"
              K8S_TOKEN: "{{ secret('K8S_TOKEN') }}"
              K8S_CA_CERT_DATA: "{{ secret('K8S_CA_CERT_DATA') }}"
              LABEL_SELECTOR: "{{ inputs.preview_label_selector }}"
              TARGET_NAMESPACES: >-
                {{ outputs.plan_actions.values.to_delete | jq('map(.name) | join(" ")') | first }}
            commands:
              - |
                set -eu
                printf '%s' "$K8S_CA_CERT_DATA" | base64 -d > ca.crt
                KUBECTL="kubectl --server=$K8S_MASTER_URL --token=$K8S_TOKEN --certificate-authority=ca.crt"
                failed=0
                for ns in $TARGET_NAMESPACES; do
                  if [ -z "$($KUBECTL get namespace "$ns" -l "$LABEL_SELECTOR" -o name 2>/dev/null)" ]; then
                    echo "SKIP: namespace $ns no longer exists or no longer matches '$LABEL_SELECTOR'"
                    continue
                  fi
                  if $KUBECTL delete namespace "$ns" --ignore-not-found --wait=false; then
                    echo "LIVE: deleted namespace $ns"
                  else
                    echo "ERROR: failed to delete namespace $ns"
                    failed=1
                  fi
                done
                exit $failed

  - id: notify_slack_summary
    type: io.kestra.plugin.core.flow.If
    description: "Dispatches a single consolidated Slack report when namespaces were deleted, planned in dry run, deferred by cap, or errored."
    condition: "{{ ((outputs.plan_actions.values.to_delete ?? []) | length > 0) or ((outputs.plan_actions.values.deferred ?? []) | length > 0) or ((outputs.plan_actions.values.errors ?? []) | length > 0) }}"
    then:
      - id: send_slack_report
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: "Posts sweep outcome details to the configured Slack incoming webhook."
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        retry:
          type: constant
          interval: PT5S
          maxAttempts: 3
        payload: |
          {{
            {
              "channel": inputs.slack_channel,
              "text": (inputs.dry_run ? ":mag: *Kubernetes Ephemeral Namespace Sweeper (DRY RUN)*" : ":broom: *Kubernetes Ephemeral Namespace Sweeper (LIVE)*"),
              "attachments": [
                {
                  "color": (
                    ((outputs.plan_actions.values.errors ?? []) | length > 0) ? "#E24A4A" :
                    inputs.dry_run ? "#3AA3E3" : "#36A64F"
                  ),
                  "blocks": [
                    {
                      "type": "section",
                      "text": {
                        "type": "mrkdwn",
                        "text": (inputs.dry_run ? "*Kubernetes Namespace Sweeper (DRY RUN)*" : "*Kubernetes Namespace Sweeper (LIVE)*") ~ "\n" ~
                                "*Execution ID:* `" ~ execution.id ~ "`\n" ~
                                "*Action Summary:* " ~
                                ((outputs.plan_actions.values.to_delete ?? []) | length) ~ (inputs.dry_run ? " planned for deletion" : " deleted") ~
                                ", " ~ ((outputs.plan_actions.values.deferred ?? []) | length) ~ " deferred by cap (max " ~ inputs.max_deletions_per_run ~ ")" ~
                                ", " ~ ((outputs.plan_actions.values.errors ?? []) | length) ~ " error(s)."
                      }
                    },
                    {
                      "type": "section",
                      "text": {
                        "type": "mrkdwn",
                        "text": "*Target Namespaces:*\n" ~ (
                          ((outputs.plan_actions.values.to_delete ?? []) | length > 0) ?
                          ((outputs.plan_actions.values.to_delete ?? []) | jq('map("• `" + .name + "`: age " + (.age_hours | tostring) + "h | PR #" + (.pr_number // "none") + " (" + .pr_state + ") | reason: " + .reason + " | action: " + (if ' ~ inputs.dry_run ~ ' then "WOULD_DELETE" else "DELETED" end)) | join("\n")') | first) :
                          "None"
                        )
                      }
                    },
                    (
                      ((outputs.plan_actions.values.deferred ?? []) | length > 0) ?
                      {
                        "type": "section",
                        "text": {
                          "type": "mrkdwn",
                          "text": "*Deferred by Cap (max " ~ inputs.max_deletions_per_run ~ " per sweep):*\n" ~
                                  ((outputs.plan_actions.values.deferred ?? []) | jq('map("• `" + .name + "`: age " + (.age_hours | tostring) + "h | PR #" + (.pr_number // "none") + " (" + .pr_state + ") | reason: " + .reason + " | action: DEFERRED") | join("\n")') | first)
                        }
                      } :
                      null
                    ),
                    (
                      ((outputs.plan_actions.values.errors ?? []) | length > 0) ?
                      {
                        "type": "section",
                        "text": {
                          "type": "mrkdwn",
                          "text": "*GitHub API Errors (Namespace skipped):*\n" ~
                                  ((outputs.plan_actions.values.errors ?? []) | jq('map("• `" + .name + "`: " + .error) | join("\n")') | first)
                        }
                      } :
                      null
                    )
                  ] | jq('map(select(. != null))') | first
                }
              ]
            } | toJson
          }}

  - id: fail_on_github_errors
    type: io.kestra.plugin.core.flow.If
    description: "Fails the workflow execution if any GitHub API queries failed, preventing silent failures while preserving the Slack summary."
    condition: "{{ (outputs.plan_actions.values.errors ?? []) | length > 0 }}"
    then:
      - id: abort_on_errors
        type: io.kestra.plugin.core.execution.Fail
        errorMessage: "One or more GitHub PR lookups failed during namespace evaluation: {{ outputs.plan_actions.values.errors | toJson }}"

extend:
  title: Sweep Ephemeral Test and Preview Namespaces by Pull Request Status and TTL
  metaTitle: Kubernetes Ephemeral Namespace TTL Sweeper | Kestra
  shortDescription: Automatically discover and delete stale Kubernetes preview and test namespaces when pull requests close or max TTL expires, with Slack notifications.
  metaDescription: Delete stale Kubernetes preview namespaces when pull requests close or TTL expires, with dry-run safety, blast radius caps, and Slack notifications.
  description: |
    Orchestrates cluster-wide FinOps hygiene and resource reclamation for Kubernetes dynamic preview and ephemeral test environments. Pull request preview namespaces often accumulate when pull requests are merged, closed, or abandoned without triggering CI cleanup hooks. Lingering preview namespaces continuously consume cluster CPU and memory reservations, block PersistentVolumeClaims, hold cloud LoadBalancer IP allocations, and inflate cloud infrastructure costs.

    This workflow runs `kubectl` to discover labeled preview namespaces, queries the GitHub Pull Request REST API to inspect pull request lifecycle states, enforces a minimum age grace period and maximum TTL, serializes evaluation, caps deletions per run, supports dry-run inspection, and publishes an aggregated Slack report.

    ## How it works

    1. `sweep_schedule` (`io.kestra.plugin.core.trigger.Schedule`) triggers the workflow on a recurring 2-hour schedule (`0 */2 * * *`). The trigger ships disabled by default for safe initial manual testing. Flow-level concurrency is configured with `limit: 1` and `behavior: QUEUE` so concurrent runs never conflict.
    2. `list_namespaces` (`io.kestra.plugin.scripts.shell.Commands`) runs `kubectl get namespaces -l <selector>` inside an `alpine/k8s` container, authenticating with the ServiceAccount token and CA data from secrets. The label selector (default `preview=true`) is applied server-side by the Kubernetes API, and the result is written to `namespaces.json` as a compact list of `name`, `creationTimestamp`, and `deletionTimestamp`. A script task is used because namespaces are cluster-scoped and the native `kubectl.Get` and `kubectl.Delete` tasks neither support label selectors nor cluster-scoped resources.
    3. `filter_candidates` (`io.kestra.plugin.core.output.OutputValues`) reads `namespaces.json` and applies client-side safety filters using Pebble and jq:
       - Requires the namespace name to match `inputs.name_regex` (default `^pr-[0-9]+$`).
       - Hard-excludes core system namespaces (`kube-system`, `kube-public`, `kube-node-lease`, and `default`) even if labels or regex match.
       - Discards namespaces currently in `Terminating` phase (`deletionTimestamp != null`).
       - Enforces `inputs.min_age_hours` (default 1 hour) so freshly provisioned preview namespaces are never touched before testing begins.
       - Calculates age in hours and extracts the pull request number, sorting candidates oldest first.
    4. `evaluate_candidates_loop` (`io.kestra.plugin.core.flow.Loop`, `concurrencyLimit: 1`) processes each candidate sequentially:
       - If the namespace name contains pull request digits, `check_github_pr` (`io.kestra.plugin.core.flow.If`) executes `get_pr` (`io.kestra.plugin.core.http.Request`) against the GitHub API (`GET /repos/{owner}/{repo}/pulls/{number}`) with `allowFailed: true` and transient error retries.
       - `record_verdict` evaluates qualifications: pull request merged (`pr_merged`) or closed (`pr_closed`) qualifies for immediate deletion. Active open pull requests older than `inputs.max_ttl_hours` (default 72 hours) qualify under `ttl_exceeded`. Missing pull requests (HTTP 404) fall back to the TTL rule. Transient or authentication API errors (non-200, non-404) mark the namespace with `github_api_error` and prevent deletion. Namespaces without pull request numbers evaluate against TTL only.
    5. `plan_actions` (`io.kestra.plugin.core.output.OutputValues`) collects loop outputs via `loopOutputs()`. It partitions qualifying namespaces into `to_delete` (up to `inputs.max_deletions_per_run`, default 5) and `deferred` (any qualifying namespaces exceeding the cap).
    6. `execute_cleanup` (`io.kestra.plugin.core.flow.If`) branches on `inputs.dry_run` (default `true`):
       - When `dry_run` is true, `log_dry_run_plan` logs each namespace that would be deleted, along with its age and reason, making zero cluster modifications.
       - When `dry_run` is false, `delete_qualifying_namespaces` (`io.kestra.plugin.scripts.shell.Commands`) runs `kubectl delete namespace` for each target. Before each delete it re-checks that the namespace still exists and still matches the label selector, and `--ignore-not-found` ensures namespaces removed concurrently do not fail the flow. `allowFailure: true` lets the Slack summary still be delivered if a delete fails.
    7. `notify_slack_summary` (`io.kestra.plugin.core.flow.If`) evaluates whether any namespaces qualified for deletion, were planned in dry run, were deferred by cap, or encountered API errors. If so, `send_slack_report` (`io.kestra.plugin.slack.notifications.SlackIncomingWebhook`) dispatches a single comprehensive Slack message detailing target namespaces, ages, pull request states, reasons, and cap deferrals. When no namespaces qualify, the workflow remains completely quiet.
    8. `fail_on_github_errors` (`io.kestra.plugin.core.execution.Fail`) fails the execution after the Slack notification if any GitHub API calls failed, alerting on-call engineers to credential or rate-limit issues while ensuring the summary is delivered.

    ## What you get

    - Automated FinOps reclamation of idle preview environments, eliminating stranded compute, memory, load balancers, and volumes.
    - Opt-in protection: only namespaces carrying the configured preview label and matching the regex pattern can ever be evaluated, and the label is re-verified immediately before each delete.
    - Blast radius limit: `max_deletions_per_run` prevents accidental bulk deletion if an upstream Git repository changes state unexpectedly.
    - Grace period safety: `min_age_hours` guarantees newly created preview environments are protected against early sweep.
    - Correct handling of cluster-scoped resources: uses real `kubectl` so label selectors and namespace deletion work as documented by Kubernetes.
    - Transparent Slack summaries that explain exact reasons (`pr_closed`, `pr_merged`, `ttl_exceeded`) and deferred items.

    ## Who it's for

    - Platform Engineers and DevOps teams managing shared development and staging Kubernetes clusters.
    - FinOps Practitioners looking to automate non-production resource cleanup and curtail cloud spend.
    - SREs managing ephemeral CI/CD test environments across multiple engineering squads.

    ## Why orchestrate this with Kestra

    - **Declarative and Auditable**: Captures discovery, external Git API evaluation, rate limiting, and Kubernetes deletion in declarative version-controlled YAML.
    - **Safe Dry-Run by Default**: Ships with `dry_run: true` so platform engineers can test against real clusters and inspect proposed actions before enabling live deletions.
    - **Single Notification Overhead**: Aggregates all evaluations across the loop into one Slack digest instead of sending noisy per-namespace alerts.
    - **Built-in Secret Masking**: Credentials for cluster authentication and GitHub tokens are securely resolved and masked in execution logs.

    ## Prerequisites

    - A reachable Kubernetes cluster (in-cluster or external API endpoint).
    - A Kestra worker able to run the Docker task runner (the flow uses the `alpine/k8s` image). To run on Kubernetes instead, swap the `taskRunner` for `io.kestra.plugin.kubernetes.runner.Kubernetes`.
    - A Kubernetes ServiceAccount with least-privilege permissions to get, list, and delete namespaces.
    - A GitHub Personal Access Token or GitHub App token with `pull_requests:read` permission.
    - A Slack Incoming Webhook URL.

    Apply this least-privilege ClusterRole and ClusterRoleBinding for the sweeper ServiceAccount:

    ```yaml
    apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRole
    metadata:
      name: kestra-namespace-sweeper
    rules:
      - apiGroups: [""]
        resources: ["namespaces"]
        verbs: ["get", "list", "delete"]
    ---
    apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRoleBinding
    metadata:
      name: kestra-namespace-sweeper-binding
    subjects:
      - kind: ServiceAccount
        name: kestra-sweeper-sa
        namespace: default
    roleRef:
      kind: ClusterRole
      name: kestra-namespace-sweeper
      apiGroup: rbac.authorization.k8s.io
    ```

    ### Secrets

    - `K8S_MASTER_URL`: Kubernetes API server endpoint (e.g. `https://kubernetes.default.svc` or `https://k8s.example.com:6443`).
    - `K8S_TOKEN`: Bearer token for the sweeper ServiceAccount.
    - `K8S_CA_CERT_DATA`: Base64-encoded cluster certificate authority data.
    - `GITHUB_TOKEN`: GitHub token with read access to repository pull requests.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL for cleanup digests.

    ## Quick start

    1. Add `K8S_MASTER_URL`, `K8S_TOKEN`, `K8S_CA_CERT_DATA`, `GITHUB_TOKEN`, and `SLACK_WEBHOOK_URL` to your Kestra namespace secrets.
    2. Label a test namespace to opt into sweeping:
       ```bash
       kubectl create namespace pr-999
       kubectl label namespace pr-999 preview=true
       ```
    3. Run this flow with default inputs (`dry_run: true`).
    4. Review execution logs and the Slack summary to verify that `pr-999` is identified and marked with the expected reason.
    5. Execute with `dry_run: false` to perform live deletion, and confirm that the namespace and its resources are removed.
    6. Enable the `sweep_schedule` trigger to run automated sweeps every 2 hours.

    ## How to extend

    - **Custom Naming Conventions**: Adjust `name_regex` to match custom environment prefixes such as `^test-feature-[0-9]+$`.
    - **GitLab or Bitbucket Integration**: Replace the GitHub HTTP request task with GitLab Merge Request API endpoints.
    - **Cost Reporting**: Integrate with Kubecost API before deletion to record estimated dollar savings per deleted namespace.
    - **Approval Gate**: Add an `io.kestra.plugin.core.flow.Pause` task between `plan_actions` and `execute_cleanup` for human-in-the-loop review of deletions in critical clusters.

    ## Limits and Operational Considerations

    - **Cascade Scope**: Deleting a Kubernetes namespace terminates all namespaced objects within it, including Pods, ReplicaSets, Services, and PVCs. Cloud controller managers will deprovision associated external LoadBalancers. The sweeper does not perform node cordoning because cordoning applies to worker nodes, not namespaces.
    - **Asynchronous Deletion**: Namespace deletion runs with `--wait=false`, so a namespace may remain in `Terminating` for a while (for example when finalizers are pending). Terminating namespaces are ignored on the next sweep.
    - **PersistentVolume Retention**: PersistentVolumes configured with a `reclaimPolicy` of `Retain` will transition to `Released` upon PVC deletion and will remain on storage until manually reclaimed.
    - **Static Schedule**: The trigger runs on a fixed cron schedule; namespace deletion occurs on the next sweep following pull request closure.
    - **GitHub Rate Limits**: Authenticated GitHub API requests permit up to 5,000 requests per hour per token. The blast radius cap and concurrency limit prevent rate-limit exhaustion.
    - **Difference from Single-Environment Lifecycle Gate**: This flow differs fundamentally from `helm-preview-environment-lifecycle-and-ephemeral-teardown-gate.yaml`. That blueprint deploys, tests, and uninstalls a single preview environment within one continuous CI-triggered run. This blueprint is an autonomous, cluster-wide FinOps sweeper that periodically cleans up abandoned or unmanaged preview namespaces across teams.

