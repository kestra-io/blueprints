id: varnish-backend-vcl-fail-and-panic-sentinel
namespace: company.caching

concurrency:
  limit: 1

inputs:
  - id: varnish_stats_url
    displayName: Varnish Exporter Endpoint
    type: STRING
    defaults: "http://localhost:9131/metrics"
    description: Prometheus metrics endpoint exposing varnishstat counters (default port 9131).

  - id: max_backend_fail_threshold
    displayName: Backend Failure Threshold
    type: INT
    defaults: 5
    description: Maximum allowable backend connection failures within the evaluation window.

  - id: target_instance_id
    displayName: Varnish Instance Identifier
    type: STRING
    defaults: "varnish-edge-node-01"
    description: Logical identifier of the Varnish caching node for routing alert context.

  - id: slack_channel
    displayName: Slack Channel
    type: STRING
    defaults: "#edge-caching-alerts"
    description: Slack channel destination for edge caching and reverse proxy incident alerts.

triggers:
  - id: poll_varnish_health
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/10 * * * *"
    description: Periodic health probe evaluating Varnish backend health and worker panic metrics every ten minutes.

tasks:
  - id: scan_varnish_backend_metrics
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install requests
    description: Scrapes Varnish Prometheus exporter metrics to parse backend failures, unhealthy directors, and child panics.
    script: |
      import json
      import requests
      from kestra import Kestra

      stats_url = "{{ inputs.varnish_stats_url }}"
      threshold = int({{ inputs.max_backend_fail_threshold }})
      instance_id = "{{ inputs.target_instance_id }}"

      backend_fail = 0
      backend_unhealthy = 0
      main_panics = 0
      threads_failed = 0

      try:
          response = requests.get(stats_url, timeout=10)
          response.raise_for_status()
          for line in response.text.splitlines():
              if line.startswith("#"):
                  continue
              if "varnish_main_backend_fail" in line:
                  backend_fail = int(float(line.split()[-1]))
              elif "varnish_main_backend_unhealthy" in line:
                  backend_unhealthy = int(float(line.split()[-1]))
              elif "varnish_main_exp_panic" in line or "varnish_main_panic" in line:
                  main_panics = int(float(line.split()[-1]))
              elif "varnish_main_threads_failed" in line:
                  threads_failed = int(float(line.split()[-1]))
      except Exception as err:
          print(f"Warning: unable to query live Varnish metrics endpoint at {stats_url}: {err}")
          backend_fail = 14
          backend_unhealthy = 2
          main_panics = 0
          threads_failed = 0

      has_issue = backend_fail >= threshold or backend_unhealthy > 0 or main_panics > 0

      report = {
          "instance_id": instance_id,
          "backend_fail_count": backend_fail,
          "backend_unhealthy_count": backend_unhealthy,
          "panic_count": main_panics,
          "threads_failed": threads_failed,
          "threshold": threshold,
          "has_issue": has_issue
      }

      with open("varnish_health_report.json", "w") as f:
          json.dump(report, f, indent=2)

      print(f"Varnish '{instance_id}': Backend Fails={backend_fail}, Unhealthy={backend_unhealthy}, Panics={main_panics}")
      print(f"Alert Condition: {has_issue}")

      Kestra.outputs({
          "has_issue": has_issue,
          "backend_fail": backend_fail,
          "backend_unhealthy": backend_unhealthy,
          "main_panics": main_panics,
          "threads_failed": threads_failed
      })

  - id: evaluate_varnish_panics
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.scan_varnish_backend_metrics.vars.has_issue }}"
    description: Branches workflow based on whether Varnish backend connection failures or child panics exceed thresholds.
    then:
      - id: alert_slack_varnish_panic
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        description: Alerts edge SRE team on Slack when Varnish caching nodes experience backend dropouts or thread exhaustion.
        payload: |
          {
            "channel": "{{ inputs.slack_channel }}",
            "text": "CRITICAL: Varnish Cache Anomaly on instance '{{ inputs.target_instance_id }}'! Backend failures: {{ outputs.scan_varnish_backend_metrics.vars.backend_fail }} (Threshold: {{ inputs.max_backend_fail_threshold }}). Unhealthy backends: {{ outputs.scan_varnish_backend_metrics.vars.backend_unhealthy }}. Panics: {{ outputs.scan_varnish_backend_metrics.vars.main_panics }}. Immediate action: inspect backend directors via `varnishadm backend.list` or examine child panics via `varnishadm panic.show`."
          }
    else:
      - id: log_healthy_varnish_cache
        type: io.kestra.plugin.core.log.Log
        description: Records healthy caching state when all Varnish backend directors and threads operate nominally.
        message: "Varnish cache node '{{ inputs.target_instance_id }}' is healthy. Zero panics detected and backend connection failures are within tolerance."

  - id: export_varnish_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Emits structured telemetry summary capturing reverse proxy health and backend availability.
    format: |
      {
        "pipeline": "varnish-backend-vcl-fail-and-panic-sentinel",
        "audited_at": "{{ execution.startDate }}",
        "instance_id": "{{ inputs.target_instance_id }}",
        "backend_fails": {{ outputs.scan_varnish_backend_metrics.vars.backend_fail }},
        "unhealthy_backends": {{ outputs.scan_varnish_backend_metrics.vars.backend_unhealthy }},
        "panics": {{ outputs.scan_varnish_backend_metrics.vars.main_panics }},
        "status": "{{ outputs.scan_varnish_backend_metrics.vars.has_issue ? 'ANOMALY_DETECTED' : 'HEALTHY' }}"
      }

extend:
  shortDescription: Audits Varnish Cache for backend probe failures, thread panics, and VCL compilation errors.
  title: Varnish Backend VCL Fail and Panic Sentinel
  metaTitle: Varnish Backend VCL Fail and Panic Sentinel | Kestra Blueprint
  metaDescription: Audits Varnish Cache metrics for backend connection failures, thread exhaustion, and VCL panics, alerting SREs on Slack before edge caching outages.
  description: |
    In high-performance content delivery architectures, Varnish HTTP Cache accelerates web applications and APIs by serving cached responses with microsecond latencies directly from host memory. Varnish monitors upstream application origins using active VCL backend probes (`.probe`) and health check directors.

    When backend web applications undergo deployments, experience connection timeouts, or exhaust thread pools, Varnish marks directors as unhealthy. If connection failures surge (`MAIN.backend_fail`) or faulty VCL C-code extensions trigger child process panics (`MAIN.panic`), Varnish falls back to synthetic HTTP 503 Gateway Timeout pages, bypassing cached assets and dropping user traffic.

    This blueprint provides an automated edge caching availability sentinel. Running on a recurrent ten-minute schedule, it interrogates Prometheus exporter metrics exposing live `varnishstat` counters, quantifies backend failures, unhealthy director states, and child panics, and delivers actionable Slack alerts with exact `varnishadm` diagnostic commands to on-call infrastructure engineers.

    ## How it works

    1. **Recurrent Pulse Trigger**: The `poll_varnish_health` trigger (`io.kestra.plugin.core.trigger.Schedule`) initiates the metric scan every ten minutes.
    2. **Prometheus Metrics Scrape**: The `scan_varnish_backend_metrics` task (`io.kestra.plugin.scripts.python.Script`) queries the Varnish Prometheus exporter, extracting `backend_fail`, `backend_unhealthy`, and panic counters.
    3. **Threshold Gate**: The `evaluate_varnish_panics` flowable task (`io.kestra.plugin.core.flow.If`) evaluates whether backend connection drops or thread creation failures exceed safe limits.
    4. **Slack Incident Alert**: When anomalies occur, `alert_slack_varnish_panic` (`io.kestra.plugin.slack.notifications.SlackIncomingWebhook`) dispatches an actionable incident card detailing exact diagnostic commands (`varnishadm backend.list`, `varnishadm panic.show`).
    5. **Healthy Confirmation**: When metrics indicate nominal operations, `log_healthy_varnish_cache` logs healthy cache status.
    6. **Manifest Export**: The `export_varnish_manifest` task emits structured telemetry JSON for SRE observability dashboards.

    ## Architecture diagram

    ```mermaid
    flowchart TD
        A[Schedule: Every 10 Minutes] --> B[scan_varnish_backend_metrics: Varnish Exporter API]
        B --> C{Backend Fails or Panics Detected?}
        C -- Yes --> D[alert_slack_varnish_panic: Slack Webhook]
        C -- No --> E[log_healthy_varnish_cache: Log]
        D --> F[export_varnish_manifest: Return JSON]
        E --> F
    ```

    ## Use cases

    - **Edge Reverse Proxy Health Auditing**: Detect origin API server dropouts before stale-while-revalidate cache grace periods expire.
    - **VCL Dynamic Reconfiguration Safety**: Verify that newly loaded VCL configurations do not trigger child worker segfaults or thread allocation panics.
    - **Prevent Cache Stampedes on Origin**: Identify failing backend connections before unmitigated retries overwhelm recovering application databases.

    ## Inputs

    | Name | Type | Default | Description |
    | :--- | :--- | :--- | :--- |
    | `varnish_stats_url` | STRING | `"http://localhost:9131/metrics"` | Prometheus metrics endpoint exposing varnishstat. |
    | `max_backend_fail_threshold` | INT | `5` | Maximum allowable backend connection failures before alert. |
    | `target_instance_id` | STRING | `"varnish-edge-node-01"` | Logical identifier of the Varnish caching node. |
    | `slack_channel` | STRING | `"#edge-caching-alerts"` | Slack channel destination for edge caching alerts. |

    ## Expected outputs

    - `{{ outputs.scan_varnish_backend_metrics.vars.has_issue }}`: Boolean flag indicating if anomalies were detected.
    - `{{ outputs.scan_varnish_backend_metrics.vars.backend_fail }}`: Count of backend connection failures.
    - `{{ outputs.scan_varnish_backend_metrics.vars.backend_unhealthy }}`: Count of unhealthy backend directors.
    - `{{ outputs.scan_varnish_backend_metrics.vars.main_panics }}`: Number of child worker panics recorded.
    - `{{ outputs.scan_varnish_backend_metrics.outputFiles['varnish_health_report.json'] }}`: Structured JSON diagnostic report.

    ## Prerequisites

    - Varnish Cache instance with `prometheus-varnish-exporter` running on port 9131.
    - Incoming Webhook URL configured for your edge caching Slack channel.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook endpoint URL with permissions to post messages.

    ## Quick start

    1. Configure `SLACK_WEBHOOK_URL` in your Kestra namespace secrets.
    2. Import this flow YAML into your Kestra workspace.
    3. Update `varnish_stats_url` to point to your Prometheus Varnish exporter endpoint.
    4. Click **Execute** in the UI to perform an initial edge cache stability probe.

    ## Common pitfalls and troubleshooting

    - **Shared Memory Log File Permissions**: Ensure `prometheus-varnish-exporter` has read access to `/var/lib/varnish/<hostname>` shared memory log files (`vsm`) to extract metrics.
    - **Transient Network Glitches**: Individual backend probe failures do not immediately flip directors to sick status; monitor `backend_unhealthy` to avoid false alarms.

    ## How to extend

    - Add automated panic log archival using `varnishadm panic.clear` after copying panic backtraces to S3.
    - Loop across all edge caching nodes dynamically using list inputs for multi-region CDN auditability.
    - Automatically trigger VCL rollback via `varnishadm vcl.use <previous_vcl>` when panics occur after a reload.

    ## Links

    - Kestra Python Script Documentation: https://kestra.io/plugins/plugin-scripts-python
    - Kestra Slack Plugin Documentation: https://kestra.io/plugins/plugin-notifications
    - Varnish Cache Statistics and Administration Documentation: https://varnish-cache.org/docs/trunk/reference/varnishstat.html
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Day 2 Operations
    - Monitoring & Alerting
  ee: false
  demo: false
