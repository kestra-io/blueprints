id: datacircle-linkedin-profiles-to-postgres
namespace: company.team
description: |
  Every week, refresh the LinkedIn profiles listed in a Postgres table through
  the Datacircle API, the oldest first, and store each answer as JSONB.

inputs:
  - id: max_profiles
    type: INT
    displayName: Profiles per run
    description: The number of profiles to refresh in one run, oldest refresh first. Up2Data takes $1 a day per account (421 profiles).
    defaults: 400

tasks:
  - id: create_table
    type: io.kestra.plugin.jdbc.postgresql.Query
    description: Create the profile table if it doesn't exist. You add the URLs to refresh in `linkedin_url`.
    url: "jdbc:postgresql://{{ secret('POSTGRES_HOST') }}:5432/postgres"
    username: "{{ secret('POSTGRES_USERNAME') }}"
    password: "{{ secret('POSTGRES_PASSWORD') }}"
    sql: |
      CREATE TABLE IF NOT EXISTS public.linkedin_profiles (
          linkedin_url     VARCHAR PRIMARY KEY,
          profile          JSONB,
          headline         TEXT,
          company          TEXT,
          country          TEXT,
          provider         VARCHAR,
          cost_usd         NUMERIC,
          status           INT,
          refreshed_at     TIMESTAMPTZ
      );

  - id: get_urls
    type: io.kestra.plugin.jdbc.postgresql.Query
    description: Pick the profiles refreshed longest ago, never refreshed first.
    url: "jdbc:postgresql://{{ secret('POSTGRES_HOST') }}:5432/postgres"
    username: "{{ secret('POSTGRES_USERNAME') }}"
    password: "{{ secret('POSTGRES_PASSWORD') }}"
    fetchType: STORE
    sql: |
      SELECT linkedin_url
      FROM public.linkedin_profiles
      ORDER BY refreshed_at ASC NULLS FIRST
      LIMIT {{ inputs.max_profiles }}

  - id: any_to_refresh
    type: io.kestra.plugin.core.flow.If
    description: Skip the loop when the table has no URL.
    condition: "{{ outputs.get_urls.size > 0 }}"
    then:
      - id: refresh_each
        type: io.kestra.plugin.core.flow.Loop
        description: One call per profile, one at a time.
        values: "{{ outputs.get_urls.uri }}"
        concurrencyLimit: 1
        tasks:
          - id: fetch_profile
            type: io.kestra.plugin.core.http.Request
            description: Send Up2Data's own request to api.datacircle.dev, with a Datacircle key and the X-Data-Provider header.
            uri: https://api.datacircle.dev/v1/profiles/enrich
            method: POST
            contentType: application/json
            headers:
              Authorization: "Token {{ secret('DATACIRCLE_API_KEY') }}"
              X-Data-Provider: up2data
            body: |
              {"url": "{{ fromJson(item.value).linkedin_url }}"}
            options:
              allowFailed: true

          - id: route_answer
            type: io.kestra.plugin.core.flow.Switch
            description: Save a 200, move a 422 to the back of the line, stop on a 402, and leave any other answer for the next run.
            value: "{{ outputs.fetch_profile.code }}"
            cases:
              "200":
                - id: save_profile
                  type: io.kestra.plugin.jdbc.postgresql.Query
                  description: Store the whole profile as JSONB, a few fields as columns, and what the call cost.
                  url: "jdbc:postgresql://{{ secret('POSTGRES_HOST') }}:5432/postgres"
                  username: "{{ secret('POSTGRES_USERNAME') }}"
                  password: "{{ secret('POSTGRES_PASSWORD') }}"
                  sql: |
                    UPDATE public.linkedin_profiles
                    SET profile      = CAST(:profile AS JSONB),
                        headline     = CAST(:profile AS JSONB) ->> 'headline',
                        company      = CAST(:profile AS JSONB) -> 'current_company' ->> 'name',
                        country      = CAST(:profile AS JSONB) -> 'location' ->> 'country',
                        provider     = :provider,
                        cost_usd     = CAST(:cost_usd AS NUMERIC),
                        status       = 200,
                        refreshed_at = now()
                    WHERE linkedin_url = :linkedin_url
                  parameters:
                    profile: "{{ fromJson(outputs.fetch_profile.body).data | toJson }}"
                    provider: "{{ fromJson(outputs.fetch_profile.body).datacircle_meta.provider }}"
                    cost_usd: "{{ fromJson(outputs.fetch_profile.body).datacircle_meta.cost_usd }}"
                    linkedin_url: "{{ fromJson(item.value).linkedin_url }}"
              "422":
                - id: mark_unavailable
                  type: io.kestra.plugin.jdbc.postgresql.Query
                  description: Up2Data couldn't reach this profile, at no cost. Keep the saved profile and move the row to the back of the line.
                  url: "jdbc:postgresql://{{ secret('POSTGRES_HOST') }}:5432/postgres"
                  username: "{{ secret('POSTGRES_USERNAME') }}"
                  password: "{{ secret('POSTGRES_PASSWORD') }}"
                  sql: |
                    UPDATE public.linkedin_profiles
                    SET status = 422, refreshed_at = now()
                    WHERE linkedin_url = :linkedin_url
                  parameters:
                    linkedin_url: "{{ fromJson(item.value).linkedin_url }}"
              "402":
                - id: stop_on_balance
                  type: io.kestra.plugin.core.execution.Fail
                  errorMessage: "A call your balance can't cover answers 402. Add funds, from $5, on your dashboard at datacircle.dev, then run the flow again."
            defaults:
              - id: log_skipped
                type: io.kestra.plugin.core.log.Log
                level: WARN
                message: "{{ fromJson(item.value).linkedin_url }} answered {{ outputs.fetch_profile.code }}. It keeps its place for the next run."

  - id: count_refreshed
    type: io.kestra.plugin.jdbc.postgresql.Query
    description: Count the profiles this run refreshed and what they cost.
    url: "jdbc:postgresql://{{ secret('POSTGRES_HOST') }}:5432/postgres"
    username: "{{ secret('POSTGRES_USERNAME') }}"
    password: "{{ secret('POSTGRES_PASSWORD') }}"
    fetchType: FETCH_ONE
    sql: |
      SELECT count(*) AS refreshed, coalesce(sum(cost_usd), 0) AS cost_usd
      FROM public.linkedin_profiles
      WHERE refreshed_at >= '{{ execution.startDate }}' AND status = 200

  - id: log_summary
    type: io.kestra.plugin.core.log.Log
    message: "Refreshed {{ outputs.count_refreshed.row.refreshed }} profiles for ${{ outputs.count_refreshed.row.cost_usd }}."

triggers:
  - id: weekly
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 6 * * 1"

extend:
  title: Refresh LinkedIn profiles in Postgres every week with Datacircle
  metaTitle: Weekly LinkedIn profile refresh to Postgres with Datacircle and Kestra
  shortDescription: Every week, call the Datacircle API for each LinkedIn profile URL in a Postgres table, oldest refresh first, and store the live profile as JSONB.
  metaDescription: Every week, call the Datacircle API for each LinkedIn profile URL in a Postgres table, oldest refresh first, and store the live profile as JSONB.
  description: |
    You list LinkedIn profile URLs in a Postgres table. Every Monday, this flow
    gets each profile from the Datacircle API and saves it next to its URL, with
    what the call cost.
    Each request goes to the provider and gets the profile as it is today.

    Datacircle is a data co-op. You send the provider's own request to
    api.datacircle.dev, with your Datacircle key. That's the only change. Right
    now we have 3 live LinkedIn profile APIs that we trust: Up2Data, HarvestAPI
    and Fetchin. This flow sends Up2Data's request.

    ## How it works
    1. `weekly` (`io.kestra.plugin.core.trigger.Schedule`) starts the flow every
       Monday at 06:00 UTC.
    2. `create_table` (`io.kestra.plugin.jdbc.postgresql.Query`) creates
       `public.linkedin_profiles` on the first run.
    3. `get_urls` (`io.kestra.plugin.jdbc.postgresql.Query`) picks up to
       `max_profiles` URLs, starting with URLs never refreshed, then the URLs refreshed longest ago.
    4. `any_to_refresh` (`io.kestra.plugin.core.flow.If`) stops if the table
       has no URL. Then `refresh_each` (`io.kestra.plugin.core.flow.Loop`)
       runs one URL at a time:
       - `fetch_profile` (`io.kestra.plugin.core.http.Request`) sends
         `POST https://api.datacircle.dev/v1/profiles/enrich` with
         `{"url": "<the profile URL>"}`, your key in `Authorization` and
         `X-Data-Provider: up2data`.
       - `route_answer` (`io.kestra.plugin.core.flow.Switch`) branches on the
         HTTP status code. A `200` goes to `save_profile`, which writes `data`
         to the `profile` column, the profile's headline, current company and
         country to their own
         columns, and `datacircle_meta.cost_usd` to `cost_usd`. A `422`, a
         profile Up2Data couldn't reach, costs nothing: `mark_unavailable`
         keeps the saved profile and moves the row to the back of the line. A call your
         balance can't cover answers `402`, and `stop_on_balance` stops the run. Any
         other answer, such as a `429` at Up2Data's daily limit, is logged by
         `log_skipped`, and the profile stays first in line for the next run.
    5. `count_refreshed` (`io.kestra.plugin.jdbc.postgresql.Query`) and
       `log_summary` (`io.kestra.plugin.core.log.Log`) log how many profiles
       this run refreshed and what they cost.

    ## Prerequisites
    - A Kestra instance with the PostgreSQL JDBC plugin.
    - A reachable PostgreSQL database.
    - A Datacircle API key. Log in at datacircle.dev/login with your work
      email. Your API key is on the page once you're in. Sign up at
      datacircle.dev with your work email: a $5 credit, that's 2,105 LinkedIn
      profiles at $2.375 per 1,000.

    ### Secrets
    - `DATACIRCLE_API_KEY`: your Datacircle API key, sent as
      `Authorization: Token <key>`. Never put it in the flow's YAML.
    - `POSTGRES_HOST`: the PostgreSQL server's hostname or IP address.
    - `POSTGRES_USERNAME`: the PostgreSQL user.
    - `POSTGRES_PASSWORD`: that user's password.

    ## Inputs
    - `max_profiles` (`INT`, default `400`): the number of profiles to refresh
      in one run. Up2Data takes $1 a day per account (421 profiles), with a shared
      daily limit for all customers, then answers `429` until 00:00 UTC.

    ## Quick start
    1. Store the four secrets in your Kestra instance.
    2. Run the flow once to create `public.linkedin_profiles`.
    3. Add the profiles to keep fresh:
       `INSERT INTO public.linkedin_profiles (linkedin_url) VALUES ('https://www.linkedin.com/in/<their-id>');`
    4. Run it again, or let the Monday schedule do it, then query
       `public.linkedin_profiles`.

    ## Expected outputs
    - `{{ outputs.get_urls.uri }}`: the stored file of URLs this run picked.
    - `{{ outputs.fetch_profile.code }}` and `{{ outputs.fetch_profile.body }}`
      in each iteration: Datacircle's status code and Up2Data's answer, with
      `datacircle_meta` (`provider`, `cost_usd`, `balance_usd`).
    - `{{ outputs.count_refreshed.row.refreshed }}`: the number of profiles this
      run refreshed.

    ## Common pitfalls
    - Send the full profile URL (`https://www.linkedin.com/in/<id>`): Up2Data
      answers `400` to a bare identifier, and we don't charge you.
    - To refresh more profiles a day than Up2Data's limit allows, use
      HarvestAPI or Fetchin (see the docs below).

    ## Links
    - [Datacircle API: Enrich one LinkedIn profile through Up2Data](https://docs.datacircle.dev/api-reference/up2data/enrich-one-linkedin-profile)
    - [Datacircle: the three providers' requests and status codes](https://docs.datacircle.dev/linkedin-profile)
    - [Datacircle pricing](https://docs.datacircle.dev/pricing)
    - [Kestra PostgreSQL plugin](https://kestra.io/plugins/plugin-jdbc-postgres)
    - [Kestra HTTP Request task](https://kestra.io/plugins/core/http/io.kestra.plugin.core.http.request)
  tags:
    - Data
    - Business
  subTags:
    - ELT & Data Landing
    - Scheduling
  ee: false
  demo: false
