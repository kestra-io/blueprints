id: duckdb-database-checkpoint-and-wal-growth-sentinel
namespace: company.analytics

inputs:
  - id: database_path
    type: STRING
    defaults: "/data/analytics.duckdb"
    description: Absolute file path to the persistent DuckDB database file.
  - id: wal_threshold_mb
    type: INT
    defaults: 50
    description: Threshold in megabytes where WAL file accumulation triggers automated compaction.
  - id: auto_checkpoint
    type: BOOL
    defaults: true
    description: Whether to request operator approval and trigger an automated CHECKPOINT when WAL bloat is detected.
  - id: slack_channel
    type: STRING
    defaults: "#analytics-alerts"
    description: Slack notification channel for WAL bloat, compaction outcomes, and lock warnings.

tasks:
  - id: inspect_storage_footprint
    type: io.kestra.plugin.scripts.shell.Commands
    commands:
      - |
        python3 -c "
        import os

        db_path = '{{ inputs.database_path }}'
        wal_path = db_path + '.wal'
        threshold = int('{{ inputs.wal_threshold_mb }}')

        db_size_mb = 0.0
        wal_size_mb = 0.0
        wal_exists = 0
        needs_checkpoint = 0

        if os.path.exists(db_path):
            db_size_mb = round(os.path.getsize(db_path) / (1024 * 1024), 2)

        if os.path.exists(wal_path):
            wal_exists = 1
            wal_size_mb = round(os.path.getsize(wal_path) / (1024 * 1024), 2)
            if wal_size_mb >= threshold:
                needs_checkpoint = 1

        print(f'{db_size_mb}|{wal_size_mb}|{wal_exists}|{needs_checkpoint}')
        " > /tmp/duckdb_metrics.txt

        DB_SIZE=$(cut -d '|' -f 1 /tmp/duckdb_metrics.txt)
        WAL_SIZE=$(cut -d '|' -f 2 /tmp/duckdb_metrics.txt)
        WAL_EXISTS=$(cut -d '|' -f 3 /tmp/duckdb_metrics.txt)
        NEEDS_CHECKPOINT=$(cut -d '|' -f 4 /tmp/duckdb_metrics.txt)

        echo "::set-output name=db_size_mb::${DB_SIZE:-0.0}::"
        echo "::set-output name=wal_size_mb::${WAL_SIZE:-0.0}::"
        echo "::set-output name=wal_exists::${WAL_EXISTS:-0}::"
        echo "::set-output name=needs_checkpoint::${NEEDS_CHECKPOINT:-0}::"

  - id: check_wal_bloat_and_remediate
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.inspect_storage_footprint.vars.needs_checkpoint | int == 1 }}"
    then:
      - id: notify_wal_bloat_detected
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "{{ inputs.slack_channel }}",
            "attachments": [
              {
                "color": "warning",
                "title": "DuckDB WAL File Accumulation Alert",
                "text": "Persistent DuckDB database at `{{ inputs.database_path }}` has exceeded the WAL threshold.\n\n- Current DB Size: {{ outputs.inspect_storage_footprint.vars.db_size_mb }} MB\n- Current WAL Size: {{ outputs.inspect_storage_footprint.vars.wal_size_mb }} MB\n- Threshold: {{ inputs.wal_threshold_mb }} MB\n\nInitiating operator approval gate for database compaction.",
                "footer": "Kestra Storage Sentinel • DuckDB"
              }
            ]
          }

      - id: evaluate_remediation_approval
        type: io.kestra.plugin.core.flow.If
        condition: "{{ inputs.auto_checkpoint }}"
        then:
          - id: pause_for_operator_approval
            type: io.kestra.plugin.core.flow.Pause
            pauseDuration: PT15M
            behavior: CANCEL

          - id: execute_duckdb_checkpoint
            type: io.kestra.plugin.scripts.shell.Commands
            commands:
              - |
                python3 -c "
                import duckdb
                import os

                db_path = '{{ inputs.database_path }}'
                wal_path = db_path + '.wal'

                pre_wal_size = round(os.path.getsize(wal_path) / (1024 * 1024), 2) if os.path.exists(wal_path) else 0.0

                try:
                    con = duckdb.connect(db_path)
                    con.execute('CHECKPOINT;')
                    con.close()
                    checkpoint_success = 1
                except Exception as e:
                    print('Checkpoint failed:', e)
                    checkpoint_success = 0

                post_wal_size = round(os.path.getsize(wal_path) / (1024 * 1024), 2) if os.path.exists(wal_path) else 0.0
                truncated = 1 if post_wal_size < 5.0 else 0
                reclaimed_mb = max(0.0, round(pre_wal_size - post_wal_size, 2))

                print(f'{checkpoint_success}|{post_wal_size}|{truncated}|{reclaimed_mb}')
                " > /tmp/checkpoint_result.txt

                SUCCESS=$(cut -d '|' -f 1 /tmp/checkpoint_result.txt)
                POST_WAL=$(cut -d '|' -f 2 /tmp/checkpoint_result.txt)
                TRUNCATED=$(cut -d '|' -f 3 /tmp/checkpoint_result.txt)
                RECLAIMED=$(cut -d '|' -f 4 /tmp/checkpoint_result.txt)

                echo "::set-output name=checkpoint_success::${SUCCESS:-0}::"
                echo "::set-output name=post_wal_size_mb::${POST_WAL:-0.0}::"
                echo "::set-output name=truncated::${TRUNCATED:-0}::"
                echo "::set-output name=reclaimed_mb::${RECLAIMED:-0.0}::"

          - id: evaluate_truncation_outcome
            type: io.kestra.plugin.core.flow.If
            condition: "{{ outputs.execute_duckdb_checkpoint.vars.truncated | int == 1 }}"
            then:
              - id: notify_compaction_success
                type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
                url: "{{ secret('SLACK_WEBHOOK') }}"
                payload: |
                  {
                    "channel": "{{ inputs.slack_channel }}",
                    "attachments": [
                      {
                        "color": "good",
                        "title": "DuckDB WAL Compaction Succeeded",
                        "text": "Automated CHECKPOINT completed successfully on `{{ inputs.database_path }}`.\n\n- Storage Reclaimed: {{ outputs.execute_duckdb_checkpoint.vars.reclaimed_mb }} MB\n- Post-Checkpoint WAL Size: {{ outputs.execute_duckdb_checkpoint.vars.post_wal_size_mb }} MB",
                        "footer": "Kestra Storage Sentinel • DuckDB"
                      }
                    ]
                  }
            else:
              - id: notify_wal_lock_warning
                type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
                url: "{{ secret('SLACK_WEBHOOK') }}"
                payload: |
                  {
                    "channel": "{{ inputs.slack_channel }}",
                    "attachments": [
                      {
                        "color": "warning",
                        "title": "DuckDB WAL Truncation Blocked by Open Transaction",
                        "text": "Automated CHECKPOINT on `{{ inputs.database_path }}` was executed, but the Write-Ahead Log remains at {{ outputs.execute_duckdb_checkpoint.vars.post_wal_size_mb }} MB.\n\nRoot Cause: An active connection or uncommitted read/write transaction holds an open transaction lock, preventing DuckDB from flushing WAL entries into primary data blocks.\n\nAction Required: Terminate long-running idle reader connections to allow automatic WAL truncation.",
                        "footer": "Kestra Storage Sentinel • DuckDB"
                      }
                    ]
                  }

errors:
  - id: alert_storage_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "{{ inputs.slack_channel }}",
        "attachments": [
          {
            "color": "danger",
            "title": "DuckDB Storage Sentinel Execution Failure",
            "text": "Failed to inspect or compact DuckDB database at `{{ inputs.database_path }}`. Verify file path and filesystem permissions.",
            "footer": "Kestra Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_storage_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 */2 * * *"
    disabled: true

extend:
  metaDescription: "Audits persistent DuckDB databases for Write-Ahead Log (.wal) accumulation, pauses for operator approval, and executes automated CHECKPOINT compaction."
  metaTitle: DuckDB Database Checkpoint and WAL Growth Sentinel
  ee: false
  demo: false
  title: DuckDB Database Checkpoint and WAL Growth Sentinel
  shortDescription: Audits persistent DuckDB databases for Write-Ahead Log (.wal) accumulation, pauses for operator approval, and executes automated CHECKPOINT compaction.
  description: |
    ## How it works
    This workflow monitors persistent on-disk DuckDB database files (`.duckdb`) and their associated Write-Ahead Log files (`.duckdb.wal`) to prevent unbounded storage growth and memory bloat. In embedded analytics architectures, continuous ingestion pipelines and ad-hoc query workloads append delta rows to the database. DuckDB writes pending changes to the WAL file and flushes them to primary storage blocks during a checkpoint. If long-running analytical connections remain open or automated checkpoints fail to trigger, the WAL file can grow into gigabytes, causing severe startup latency and memory pressure during database restart. This sentinel measures WAL accumulation, alerts on bloat, pauses for operator approval, executes an automated `CHECKPOINT;`, validates truncation, and alerts engineering teams if open transaction locks block compaction.

    ## What you get
    - Automated surveillance of DuckDB base file size and WAL accumulation metrics.
    - Operator-governed database compaction via `CHECKPOINT;` with automated cancellation timeouts (`behavior: CANCEL`).
    - Detection of dangling transactions and open reader connection locks that block file truncation.
    - Slack incident notifications with precise file sizing metrics and storage reclaimed.

    ## Who it's for
    - Analytics Engineers operating local DuckDB embedded databases in production.
    - Data Platform Teams running lightweight columnar lakehouse caches.
    - SREs maintaining disk utilization and service restarts on analytics worker nodes.

    ## Why orchestrate this with Kestra
    - **Zero-Daemon Maintenance**: Runs on a scheduled cadence without requiring standing background cron scripts.
    - **Operator in the Loop**: Pauses for human confirmation before modifying database state, safely timing out if unattended.
    - **Lineage and Visibility**: Tracks reclaimed storage megabytes across every execution.

    ## Prerequisites
    - Persistent DuckDB database file accessible on the worker filesystem or mounted shared volume.
    - Slack incoming webhook URL configured in `SLACK_WEBHOOK` secret.

    ## Quick start
    1. Import this blueprint into your Kestra workspace.
    2. Add `SLACK_WEBHOOK` secret to your namespace.
    3. Specify your persistent `database_path` and target `wal_threshold_mb`.
    4. Enable the schedule trigger for continuous storage surveillance.

    ## How to extend
    - Add automated database backup to Amazon S3 or MinIO following successful compaction.
    - Chain database maintenance before daily batch transformation flows.
    - Route lock warnings to PagerDuty or Opsgenie.

    ## Links
    - [DuckDB Checkpoint and Storage Documentation](https://duckdb.org/docs/internals/storage.html)
    - [Kestra Shell Plugin](https://kestra.io/plugins/plugin-scripts-shell)
    - [Kestra Slack Notifications](https://kestra.io/plugins/plugin-slack)
  tags:
    - Data
    - Infrastructure
  subTags:
    - File & Data Processing Basics
    - Day 2 Operations
