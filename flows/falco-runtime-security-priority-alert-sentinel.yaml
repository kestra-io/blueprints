id: falco-runtime-security-priority-alert-sentinel
namespace: company.security

inputs:
  - id: falcosidekick_url
    type: STRING
    defaults: "http://falcosidekick.falco:2801"
    description: Base URL of Falcosidekick REST service.

tasks:
  - id: query_falco_events
    type: io.kestra.plugin.scripts.shell.Commands
    commands:
      - |
        # Query Falcosidekick health and metrics
        curl -s "{{ inputs.falcosidekick_url }}/ping" > /dev/null
        
        # Scrape metrics endpoint for emergency and critical priority event counters
        curl -s -f "{{ inputs.falcosidekick_url }}/metrics" > /tmp/falco_telemetry.txt
        
        CRITICAL_EVENTS=$(grep -E 'falco_events\{.*priority="Critical".*\}|falco_events\{.*priority="Emergency".*\}' /tmp/falco_telemetry.txt | awk '{sum+=$2} END {print sum+0}')
        echo "::set-output name=critical_events::$CRITICAL_EVENTS::"

  - id: evaluate_threat_events
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.query_falco_events.vars.critical_events | int > 0 }}"
    then:
      - id: notify_soc_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#soc-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 Falco Critical Runtime Threat Detected",
                "text": "Falco runtime security daemon detected *{{ outputs.query_falco_events.vars.critical_events }} Critical/Emergency threat events*! Potential shell spawned in container, privilege escalation, or unauthorized namespace mount detected.",
                "footer": "Kestra Security Sentinel • Falco"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#soc-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ Falco Sentinel Failure",
            "text": "Failed to scrape Falcosidekick metrics endpoint. Verify Falco daemonset and sidekick status.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/10 * * * *"
    disabled: true

extend:
  metaDescription: "Monitors Falco runtime security for Emergency and Critical kernel syscall threat events to detect active cluster intrusions."
  metaTitle: Falco Cloud Native Runtime Threat and Security Priority Event Sentinel with Kestra
  title: Falco Cloud Native Runtime Threat and Security Priority Event Sentinel
  shortDescription: Monitors Falco runtime security for Emergency and Critical kernel syscall threat events to detect active cluster intrusions.
  description: |
    ## How it works
    This workflow connects to Falcosidekick's Prometheus endpoint (`/metrics`) to audit runtime security event counters tagged with `Critical` and `Emergency` priorities. Falco inspects Linux kernel system calls using eBPF probes to catch runtime anomalies such as terminal shells spawned inside production containers, sensitive file access (`/etc/shadow`), unauthorized binary execution from `/tmp`, and container breakout attempts. This workflow queries event counters and escalates threat spikes directly to Security Operations Centers (SOC).

    ## What you get
    - Real-time detection of high-severity runtime container security intrusions.
    - Prevents silent compromise of Kubernetes worker nodes and production workloads.
    - Automated event counter aggregation across cluster nodes.

    ## Who it's for
    - Security Operations Center (SOC) Analysts and Threat Responders.
    - DevSecOps Engineers maintaining runtime security in Kubernetes.

    ## Why orchestrate this with Kestra
    - **Continuous Threat Verification**: Periodically polls runtime security engines without manual checks.
    - **Standardized Incident Escalation**: Delivers structured incident alerts directly to Slack.
    - **Decoupled Architecture**: Audits security events without adding kernel overhead.

    ## Prerequisites
    - Falco and Falcosidekick deployed in Kubernetes with metrics exposed.
    - Secret `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import the blueprint.
    2. Input Falcosidekick URL.
    3. Run the workflow to inspect current threat counters.

    ## How to extend
    - Automatically isolate or cordon the compromised node using `kubectl cordon` upon Critical event detection.
    - Export threat forensics into an external SIEM index.

    ## Links
    - [Falco Runtime Security Documentation](https://falco.org/docs/)
    - [Kestra Documentation](https://kestra.io/docs)
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Policy & Compliance
    - Monitoring & Alerting
  ee: false
  demo: false
