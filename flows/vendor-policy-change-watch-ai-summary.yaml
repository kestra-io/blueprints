id: vendor-policy-change-watch-ai-summary
namespace: company.team
description: |
  Watch the terms of service and privacy policies of the vendors you depend on. When a
  page changes, compute the exact text diff, ask Gemini whether the change is material
  and what it means for your company, and alert Slack only for material changes.

inputs:
  - id: pages
    type: JSON
    displayName: Policy pages to watch
    description: List of objects with a unique key (letters, digits, - and _), a display name and a public URL.
    defaults: |
      [
        {"key": "github-terms", "name": "GitHub Terms of Service", "url": "https://docs.github.com/en/site-policy/github-terms/github-terms-of-service"},
        {"key": "github-privacy", "name": "GitHub General Privacy Statement", "url": "https://docs.github.com/en/site-policy/privacy-policies/github-general-privacy-statement"},
        {"key": "slack-user-terms", "name": "Slack User Terms of Service", "url": "https://slack.com/terms-of-service/user"},
        {"key": "atlassian-customer-agreement", "name": "Atlassian Customer Agreement", "url": "https://www.atlassian.com/legal/atlassian-customer-agreement"}
      ]

  - id: company_context
    type: STRING
    displayName: Company context
    description: A few sentences about how you use these vendors. The LLM uses it to judge impact.
    defaults: |
      We are a 50-person B2B SaaS company in the EU. We store customer source code on GitHub,
      use Slack for internal and customer communication, and Jira/Confluence Cloud for planning.
      We care about data processing locations, AI training on our data, liability, fees and termination.

  - id: model_name
    type: STRING
    displayName: Gemini model
    defaults: gemini-2.5-flash

tasks:
  - id: for_each_page
    type: io.kestra.plugin.core.flow.Loop
    description: Process every page independently, two at a time.
    values: "{{ inputs.pages }}"
    concurrencyLimit: 2
    tasks:
      - id: fetch_page
        type: io.kestra.plugin.core.http.Download
        description: Download the current version of the policy page.
        uri: "{{ fromJson(item.value).url }}"
        headers:
          User-Agent: Kestra-Vendor-Policy-Watch

      - id: load_previous
        type: io.kestra.plugin.core.kv.Get
        description: Load the text saved for this page by the previous run. Missing on the first run.
        key: "policy_watch_{{ fromJson(item.value).key }}"
        errorOnMissing: false

      - id: compare_text
        type: io.kestra.plugin.scripts.python.Script
        description: Extract the readable text from the main content of the page and diff it against the previous version.
        containerImage: python:3.12-slim
        inputFiles:
          page.html: "{{ outputs.fetch_page.uri }}"
          previous.json: "{{ (outputs.load_previous.value ?? '') | toJson }}"
        outputFiles:
          - current.txt
        script: |
          import difflib
          import json
          from html.parser import HTMLParser

          SKIP = {"script", "style", "noscript", "svg", "nav", "header", "footer", "form", "button"}
          BLOCK = {"p", "li", "h1", "h2", "h3", "h4", "h5", "h6", "tr", "div", "section", "br"}

          class TextExtractor(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.skip_depth = 0
                  self.main_depth = 0
                  self.all_text, self.main_text = [], []

              def handle_starttag(self, tag, attrs):
                  if tag in SKIP:
                      self.skip_depth += 1
                  if tag in ("main", "article"):
                      self.main_depth += 1
                  if tag in BLOCK:
                      self.all_text.append("\n")
                      if self.main_depth:
                          self.main_text.append("\n")

              def handle_endtag(self, tag):
                  if tag in SKIP and self.skip_depth:
                      self.skip_depth -= 1
                  if tag in ("main", "article") and self.main_depth:
                      self.main_depth -= 1

              def handle_data(self, data):
                  if self.skip_depth:
                      return
                  self.all_text.append(data)
                  if self.main_depth:
                      self.main_text.append(data)

          def normalise(chunks):
              lines = (" ".join(line.split()) for line in "".join(chunks).splitlines())
              return "\n".join(line for line in lines if line)

          with open("page.html", encoding="utf-8", errors="replace") as f:
              parser = TextExtractor()
              parser.feed(f.read())
          # Prefer <main>/<article> so navigation or cookie banners do not create false changes.
          current = normalise(parser.main_text) or normalise(parser.all_text)

          with open("previous.json") as f:
              previous = json.load(f) or ""

          if not current:
              raise ValueError("No readable text found on the page; it may need JavaScript to render.")

          diff = list(difflib.unified_diff(previous.splitlines(), current.splitlines(), "previous", "current", n=1, lineterm=""))
          added = sum(1 for l in diff if l.startswith("+") and not l.startswith("+++"))
          removed = sum(1 for l in diff if l.startswith("-") and not l.startswith("---"))
          status = "BASELINE" if not previous else ("CHANGED" if diff else "UNCHANGED")

          with open("current.txt", "w", encoding="utf-8") as f:
              f.write(current)

          diff_text = "\n".join(diff)
          print(f"{status}: {len(current)} characters, +{added}/-{removed} lines")
          print("::" + json.dumps({"outputs": {
              "status": status,
              "lines_added": added,
              "lines_removed": removed,
              "diff": diff_text[:12000],
              "diff_truncated": len(diff_text) > 12000,
          }}) + "::")

      - id: if_changed
        type: io.kestra.plugin.core.flow.If
        description: Only call the LLM when the text actually changed.
        condition: "{{ outputs.compare_text.vars.status == 'CHANGED' }}"
        then:
          - id: assess_change
            type: io.kestra.plugin.ai.completion.ChatCompletion
            description: Classify the change and explain its impact in plain language, as structured JSON.
            provider:
              type: io.kestra.plugin.ai.provider.GoogleGemini
              apiKey: "{{ secret('GEMINI_API_KEY') }}"
              modelName: "{{ inputs.model_name }}"
            configuration:
              temperature: 0.1
              responseFormat:
                type: JSON
                jsonSchema:
                  type: object
                  properties:
                    material:
                      type: boolean
                    impact:
                      type: string
                      enum:
                        - LOW
                        - MEDIUM
                        - HIGH
                    summary:
                      type: string
                    action:
                      type: string
                  required:
                    - material
                    - impact
                    - summary
                    - action
            messages:
              - type: SYSTEM
                content: |
                  You review changes to vendor legal documents for a company. You receive a unified diff
                  ("-" lines were removed, "+" lines were added). Decide whether the change is material:
                  it changes rights, obligations, fees, data use, AI training, data location, liability,
                  termination or dispute resolution. Typo fixes, formatting, dates alone and link changes
                  are not material. Base everything on the diff only and do not speculate beyond it.
                  summary: at most 3 sentences on what changed. action: one concrete next step for the company,
                  or "No action needed". This is not legal advice.
              - type: USER
                content: |
                  Company context:
                  {{ inputs.company_context }}

                  Document: {{ fromJson(item.value).name }} ({{ fromJson(item.value).url }})
                  Diff{{ outputs.compare_text.vars.diff_truncated ? ' (truncated)' : '' }}:
                  {{ outputs.compare_text.vars.diff }}

          - id: if_material
            type: io.kestra.plugin.core.flow.If
            description: Alert only for material changes; log the rest.
            condition: "{{ outputs.assess_change.jsonOutput.material == true }}"
            then:
              - id: alert_slack
                type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
                description: Send the assessment with a link to the page and the size of the change.
                url: "{{ secret('SLACK_WEBHOOK_URL') }}"
                messageText: |
                  :scroll: *{{ fromJson(item.value).name }} changed* (impact: {{ outputs.assess_change.jsonOutput.impact }}, +{{ outputs.compare_text.vars.lines_added }}/-{{ outputs.compare_text.vars.lines_removed }} lines)
                  {{ outputs.assess_change.jsonOutput.summary }}
                  *Suggested action:* {{ outputs.assess_change.jsonOutput.action }}
                  <{{ fromJson(item.value).url }}|Open the document> | Execution {{ execution.id }}
            else:
              - id: log_minor
                type: io.kestra.plugin.core.log.Log
                message: "{{ fromJson(item.value).name }} changed, but not materially: {{ outputs.assess_change.jsonOutput.summary }}"

      - id: save_text
        type: io.kestra.plugin.core.kv.Set
        description: Save the current text as the next comparison point. Runs after the alert, so a failed alert is retried next time.
        key: "policy_watch_{{ fromJson(item.value).key }}"
        kvType: STRING
        overwrite: true
        value: "{{ read(outputs.compare_text.outputFiles['current.txt']) }}"

errors:
  - id: alert_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: A page that cannot be fetched must not look like an unchanged page.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    messageText: ":warning: Vendor policy watch failed in execution {{ execution.id }} ({{ flow.namespace }}.{{ flow.id }}). Open the failed loop iteration: a page may have moved or blocked the request, or GEMINI_API_KEY may be invalid."

triggers:
  - id: weekly
    type: io.kestra.plugin.core.trigger.Schedule
    description: Check every Monday morning. Disabled until the secrets are set.
    cron: "0 7 * * 1"
    disabled: true

  - id: on_demand
    type: io.kestra.plugin.core.trigger.Webhook
    description: Run a check on demand, for example when a vendor emails about updated terms.
    key: vendor-policy-watch-change-me

extend:
  title: Watch Vendor Terms and Privacy Policies with an AI Change Assessment
  shortDescription: Diff vendor terms of service and privacy policies weekly, let Gemini judge whether a change is material and alert Slack.
  metaTitle: Vendor Terms and Privacy Policy Change Watch
  metaDescription: Detect changes to vendor terms and privacy policies, assess materiality with Gemini and alert Slack only when a change affects you.
  description: |
    Vendors update their terms of service and privacy policies regularly, often with a
    short notice email that nobody reads. Some updates matter: new rights to train AI on
    your data, new data locations, price changes or reduced liability. This blueprint
    watches a list of public policy pages, computes the exact text diff each week, and
    asks Gemini whether the change is material for your company.

    ## How it works

    For each page in `pages` (Loop, two at a time):

    1. `fetch_page` downloads the page.
    2. `load_previous` reads the text saved last time from the Kestra KV store.
    3. `compare_text` extracts the readable text of the main content with the Python standard
       library and builds a unified diff. The first run is a baseline.
    4. `if_changed` skips the LLM when nothing changed.
    5. `assess_change` sends the diff and your company context to Gemini and gets structured
       JSON back: `material`, `impact`, `summary` and `action`.
    6. `if_material` posts material changes to Slack and logs minor ones.
    7. `save_text` stores the current text for next time, after the alert.

    The `errors` branch posts to Slack if a page cannot be fetched or parsed.

    ## Prerequisites

    - A Google AI Studio API key for Gemini (the free tier is enough).
    - A Slack Incoming Webhook.
    - Policy pages that render their text server-side. Pages that need JavaScript produce an
      explicit error instead of an empty diff.

    ### Secrets

    - `GEMINI_API_KEY`: Gemini API key used by `assess_change`.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL for alerts and failures.

    In the open-source edition, secrets are environment variables on the Kestra container,
    prefixed with `SECRET_` and base64-encoded. See
    [how to manage secrets](https://kestra.io/docs/concepts/secret).

    ## Inputs

    - `pages` (JSON): list of `{"key", "name", "url"}` objects. `key` names the KV entry
      (`policy_watch_<key>`) and must be unique.
    - `company_context` (STRING): how you use these vendors and what you care about.
    - `model_name` (STRING, default `gemini-2.5-flash`).

    ## Quick start

    1. Add the two secrets and edit `pages` and `company_context`.
    2. Execute the flow once to store the baseline.
    3. To test the alert path, edit one KV entry `policy_watch_<key>` in the namespace KV store
       (remove a paragraph) and execute again.
    4. Enable the `weekly` trigger. Change the webhook `key` before using `on_demand`.

    ## Outputs

    - `{{ outputs.compare_text.vars.diff }}`: the unified diff per page.
    - `{{ outputs.assess_change.jsonOutput }}`: the assessment per changed page.
    - KV entries `policy_watch_<key>`: the last saved text of every page.

    This blueprint helps you notice changes. It is not legal advice; route material changes
    to your legal or procurement team.

    ## Links

    - [Kestra Loop task](https://kestra.io/plugins/core/flow/io.kestra.plugin.core.flow.loop)
    - [Kestra AI plugin, ChatCompletion](https://kestra.io/plugins/plugin-ai/completion/io.kestra.plugin.ai.completion.chatcompletion)
    - [Kestra KV store](https://kestra.io/docs/concepts/kv-store)
    - [Slack Incoming Webhook task](https://kestra.io/plugins/plugin-slack/notifications/io.kestra.plugin.slack.notifications.slackincomingwebhook)
  tags:
    - AI
    - Business
  subTags:
    - Policy & Compliance
    - Monitoring & Alerting
  ee: false
  demo: false
