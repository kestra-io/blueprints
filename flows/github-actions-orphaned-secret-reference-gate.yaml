id: github-actions-orphaned-secret-reference-gate
namespace: company.team

description: |
  Reconcile what a repository's GitHub Actions workflows actually reference against what
  secrets are actually configured in that repository's own settings. A workflow that references
  `secrets.SOME_TOKEN` when that secret was renamed or deleted does not fail to parse, it just
  silently resolves to an empty string, breaking a step in a way nobody notices until something
  downstream fails for no obvious reason. This blueprint finds those orphaned references before
  they bite, and separately flags configured secrets no workflow references at all.

inputs:
  - id: repository
    type: STRING
    displayName: Repository
    description: owner/repo whose .github/workflows files and configured Actions secrets are reconciled.
    defaults: kestra-io/kestra

  - id: confirm_file_issue
    type: BOOL
    displayName: Confirm issue filing
    description: When true, this flow is authorized to open a tracking issue on findings in addition to the Slack alert. When false, findings only alert Slack.
    defaults: false

tasks:
  - id: search_workflow_files
    type: io.kestra.plugin.github.code.Search
    description: Finds every file under .github/workflows in the target repository; each hit's download_url is fetched directly in the next task to read the actual YAML content, since code search only returns file metadata, not file bodies.
    oauthToken: "{{ secret('GITHUB_ACCESS_TOKEN') }}"
    query: "path:.github/workflows"
    repository: "{{ inputs.repository }}"
    fetchType: FETCH

  - id: list_configured_secrets
    type: io.kestra.plugin.core.http.Request
    description: GitHub's REST API only ever returns configured secret names, never values, which is exactly what this reconciliation needs and all it should ever have access to.
    uri: "https://api.github.com/repos/{{ inputs.repository }}/actions/secrets"
    method: GET
    headers:
      Authorization: "Bearer {{ secret('GITHUB_ACCESS_TOKEN') }}"
      Accept: "application/vnd.github+json"
    options:
      allowFailed: true

  - id: extract_and_reconcile
    type: io.kestra.plugin.scripts.python.Script
    description: Downloads every matched workflow file's raw content, regex-extracts every secrets.NAME reference, and diffs the referenced-name set against the configured-name set from list_configured_secrets to find orphaned references and unused secrets.
    env:
      GITHUB_TOKEN: "{{ secret('GITHUB_ACCESS_TOKEN') }}"
      WORKFLOW_FILES_JSON: "{{ outputs.search_workflow_files.rows | toJson }}"
      CONFIGURED_SECRETS_BODY: "{{ outputs.list_configured_secrets.code == 200 ? outputs.list_configured_secrets.body : '{}' }}"
    script: |
      import json
      import os
      import re
      import urllib.request

      github_token = os.environ["GITHUB_TOKEN"]
      workflow_files = json.loads(os.environ.get("WORKFLOW_FILES_JSON") or "[]")

      try:
          configured_secrets_raw = json.loads(os.environ["CONFIGURED_SECRETS_BODY"])
          configured_names = set(s["name"] for s in configured_secrets_raw.get("secrets", []))
      except Exception:
          configured_names = set()

      secret_pattern = re.compile(r"secrets\.([A-Za-z0-9_]+)")
      secret_to_files = {}

      for f in workflow_files:
          download_url = f.get("download_url")
          path = f.get("path") or f.get("name") or "unknown"
          if not download_url:
              continue
          req = urllib.request.Request(
              download_url,
              headers={"Authorization": f"Bearer {github_token}"}
          )
          try:
              with urllib.request.urlopen(req, timeout=15) as resp:
                  content = resp.read().decode("utf-8", errors="replace")
          except Exception:
              continue
          for name in set(secret_pattern.findall(content)):
              secret_to_files.setdefault(name, set()).add(path)

      referenced_names = set(secret_to_files.keys())
      orphaned = sorted(referenced_names - configured_names)
      unused = sorted(configured_names - referenced_names)

      orphaned_detail = "; ".join(
          f"{name} (referenced in {', '.join(sorted(secret_to_files[name]))})" for name in orphaned
      )

      if orphaned:
          severity = "ORPHANED_REFERENCES_FOUND"
      elif unused:
          severity = "UNUSED_SECRETS_FOUND"
      else:
          severity = "HEALTHY"

      from kestra import Kestra
      Kestra.outputs({
          "severity": severity,
          "orphaned": orphaned,
          "orphaned_detail": orphaned_detail,
          "unused": unused,
          "unused_count": len(unused),
          "orphaned_count": len(orphaned),
          "referenced_count": len(referenced_names),
          "configured_count": len(configured_names),
      })

  - id: route
    type: io.kestra.plugin.core.flow.Switch
    description: ORPHANED_REFERENCES_FOUND outranks UNUSED_SECRETS_FOUND, since a missing secret breaks a workflow on its next run while an unused one is only cleanup. Both alert Slack immediately; filing a tracking issue is a separate, explicitly authorized action in either branch.
    value: "{{ outputs.extract_and_reconcile.vars.severity }}"
    cases:
      "HEALTHY":
        - id: log_healthy
          type: io.kestra.plugin.core.log.Log
          message: "{{ inputs.repository }}: every secrets.* reference in .github/workflows matches a configured secret, and every configured secret is referenced somewhere."
      "UNUSED_SECRETS_FOUND":
        - id: alert_unused
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {{ {'text': 'UNUSED_SECRETS_FOUND in ' ~ inputs.repository ~ ': ' ~ outputs.extract_and_reconcile.vars.unused_count ~ ' configured secret(s) are never referenced in any workflow under .github/workflows: ' ~ (outputs.extract_and_reconcile.vars.unused | join(", ")) ~ ". No workflow will break if they stay, but they're worth a look before someone assumes they do something."} | toJson }}
        - id: file_unused_issue
          type: io.kestra.plugin.core.flow.If
          condition: "{{ inputs.confirm_file_issue }}"
          then:
            - id: create_unused_issue
              type: io.kestra.plugin.github.issues.Create
              oauthToken: "{{ secret('GITHUB_ACCESS_TOKEN') }}"
              repository: "{{ inputs.repository }}"
              title: "Secret hygiene: {{ outputs.extract_and_reconcile.vars.unused_count }} configured Actions secret(s) never referenced"
              labels:
                - secret-hygiene
              body: |
                Configured in repository settings but not referenced by `secrets.NAME` in any workflow under `.github/workflows`:

                {{ outputs.extract_and_reconcile.vars.unused | join("\n") }}

                Filed automatically by the GitHub Actions orphaned secret reference gate (execution {{ execution.id }}). Confirm each one is genuinely unused (not read by a non-Actions integration) before removing it.
      "ORPHANED_REFERENCES_FOUND":
        - id: alert_orphaned
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {{ {'text': 'ORPHANED_REFERENCES_FOUND in ' ~ inputs.repository ~ ': ' ~ outputs.extract_and_reconcile.vars.orphaned_count ~ ' secrets.* reference(s) in .github/workflows point at a secret that is not configured on this repository, so it resolves to an empty string on the next run: ' ~ outputs.extract_and_reconcile.vars.orphaned_detail ~ ". Execution " ~ execution.id ~ "."} | toJson }}
        - id: file_orphaned_issue
          type: io.kestra.plugin.core.flow.If
          condition: "{{ inputs.confirm_file_issue }}"
          then:
            - id: create_orphaned_issue
              type: io.kestra.plugin.github.issues.Create
              oauthToken: "{{ secret('GITHUB_ACCESS_TOKEN') }}"
              repository: "{{ inputs.repository }}"
              title: "Secret hygiene: {{ outputs.extract_and_reconcile.vars.orphaned_count }} workflow secret reference(s) have no matching configured secret"
              labels:
                - secret-hygiene
                - bug
              body: |
                These `secrets.NAME` references in `.github/workflows` resolve to an empty string today, because no secret by that name is configured on this repository:

                {{ outputs.extract_and_reconcile.vars.orphaned_detail }}

                Filed automatically by the GitHub Actions orphaned secret reference gate (execution {{ execution.id }}). Either configure the missing secret or remove the dead reference.

  - id: summary
    type: io.kestra.plugin.core.log.Log
    message: "Secret reference reconciliation for {{ inputs.repository }} complete: severity {{ outputs.extract_and_reconcile.vars.severity }}, {{ outputs.extract_and_reconcile.vars.referenced_count }} referenced / {{ outputs.extract_and_reconcile.vars.configured_count }} configured."

errors:
  - id: alert_flow_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {{ {'text': 'GitHub Actions orphaned secret reference gate failed (execution ' ~ execution.id ~ '). Check the logs.'} | toJson }}

triggers:
  - id: daily_sweep
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 6 * * *"

extend:
  title: GitHub Actions Orphaned Secret Reference Gate
  metaTitle: GitHub Actions Orphaned Secret Reference Gate with Kestra
  shortDescription: Diff what secrets.* a repository's workflows actually reference against what secrets are configured, catching orphaned references before they silently break a run.
  metaDescription: Reconcile GitHub Actions workflow secret references against configured repository secrets to catch silent breakage before it happens.
  description: |
    GitHub Actions has a quiet footgun: reference `secrets.SOME_TOKEN` in a workflow step, and if
    that secret was renamed, deleted, or never configured, the expression does not fail to parse
    and does not error at trigger time, it just silently evaluates to an empty string. The step
    runs anyway, often failing somewhere downstream with a confusing error that has nothing
    obviously to do with a missing secret. Nobody finds out until that step actually executes,
    which can be days after the secret was removed. This blueprint closes that gap by reading
    every workflow file's actual content, extracting every `secrets.NAME` reference with a regex,
    and diffing that set against the secrets GitHub's own API says are configured on the
    repository, in both directions.

    This blueprint was created by [Mohit Jeswani](https://github.com/mohitjeswani01).

    ## How it works

    1. `daily_sweep` (`io.kestra.plugin.core.trigger.Schedule`) runs the reconciliation once a day.
    2. `search_workflow_files` (`io.kestra.plugin.github.code.Search`) finds every file under
       `.github/workflows` in the target repository, returning each hit's path and
       `download_url`, since GitHub's code search API returns file metadata, not file content.
    3. `list_configured_secrets` (`io.kestra.plugin.core.http.Request`) calls GitHub's REST API
       for the repository's configured Actions secret names (never values, GitHub's API does not
       expose those), with `allowFailed: true` so a token without secrets-read access reports
       zero configured secrets instead of crashing the execution.
    4. `extract_and_reconcile` (`io.kestra.plugin.scripts.python.Script`) downloads every matched
       workflow file's raw content, regex-extracts every `secrets.NAME` reference (recording
       which file referenced it), and diffs the referenced-name set against the configured-name
       set to classify the repository as `HEALTHY`, `UNUSED_SECRETS_FOUND` (configured but never
       referenced), or `ORPHANED_REFERENCES_FOUND` (referenced but not configured, the one that
       actually breaks something).
    5. `route` (`io.kestra.plugin.core.flow.Switch`) alerts Slack for either finding, naming the
       exact secret names and, for orphaned references, which workflow file referenced each one.
       Filing a GitHub tracking issue is a separate, explicitly authorized action behind
       `confirm_file_issue` in both branches, not tied to the Slack alert.
    6. `summary` logs the final severity and the referenced/configured counts.
    7. `errors` alerts Slack if the flow itself fails, for example a repository that does not exist.

    ## What you get

    - A true reconciliation between what workflows declare they need and what the repository
      actually has configured, catching the exact class of bug that normally surfaces as a
      confusing downstream failure days after a secret was renamed or removed.
    - Every orphaned reference named alongside the specific workflow file that uses it, so there
      is no second search step before someone can fix it.
    - A separate, lower-urgency signal for secrets nobody's workflow references anymore, worth
      pruning but not breaking anything today.

    ## Who it's for

    - Platform and DevOps teams who own a repository's CI secrets and want to know about a
      naming mismatch before a scheduled job trips over it, not after.
    - Teams doing a secret rotation or rename who want one check that confirms every workflow
      reference was updated to match.

    ## Why orchestrate this with Kestra

    GitHub has no built-in check that cross-references a workflow's `secrets.*` expressions
    against what is actually configured; the platform will happily run a workflow with a
    reference that resolves to nothing. Kestra runs this reconciliation on a schedule, keeps
    `repository` and `confirm_file_issue` as flow inputs so the same flow audits any repository
    without edits, and keeps a full execution history of every sweep, what it found, and whether
    it filed a tracking issue.

    ## Prerequisites

    - A GitHub personal access token (classic, `repo` scope, or fine-grained with `Secrets:
      read-only` and `Issues: read and write` repository permissions) for the target repository.
    - A Slack incoming webhook URL.

    This blueprint only calls GitHub's hosted API; nothing needs to run locally to test it beyond
    a repository you can point it at and a token with the permissions above. Point `repository`
    at any public repo with workflows to see `search_workflow_files` and `list_configured_secrets`
    run end to end (a token without secrets-read access still exercises the orphaned-reference
    path, since `list_configured_secrets` degrades to an empty configured set via `allowFailed`).

    ### Secrets

    - `GITHUB_ACCESS_TOKEN`: used by `search_workflow_files`, `list_configured_secrets`, the
      per-file content fetch inside `extract_and_reconcile`, and `issues.Create`. In Kestra OSS,
      provide it as the base64-encoded environment variable `SECRET_GITHUB_ACCESS_TOKEN`.
    - `SLACK_WEBHOOK_URL`: used by both Slack alert cases and the `errors` block. In Kestra OSS,
      provide it as `SECRET_SLACK_WEBHOOK_URL`.

    ### Inputs

    | Input | Default | Purpose |
    |---|---|---|
    | `repository` | `kestra-io/kestra` | owner/repo to reconcile |
    | `confirm_file_issue` | `false` | Authorizes `create_unused_issue` / `create_orphaned_issue` to actually fire |

    ### Outputs

    - `{{ outputs.extract_and_reconcile.vars.severity }}`: `HEALTHY`, `UNUSED_SECRETS_FOUND`, or
      `ORPHANED_REFERENCES_FOUND`.
    - `{{ outputs.extract_and_reconcile.vars.orphaned }}` / `.orphaned_detail`: the secret names
      referenced with no matching configured secret, and which workflow file referenced each one.
    - `{{ outputs.extract_and_reconcile.vars.unused }}`: configured secret names no workflow
      references at all.

    ### Pitfalls

    - The regex matches the dot-notation form `secrets.NAME`. A workflow using the bracket form
      (`secrets['NAME']`) or building the secret name dynamically from an expression is not
      detected; this covers the overwhelmingly common case, not every syntactically valid one.
    - `list_configured_secrets` requires a token with permission to read repository secret
      metadata; without it the call still returns 200 with zero secrets for personal-repo tokens
      that lack the scope, which this blueprint cannot tell apart from a repository that
      genuinely has none configured, and reports every reference as orphaned in that case.
    - Organization-level and environment-level secrets (configured above the repository) are
      invisible to the repository-scoped `actions/secrets` endpoint used here, so a reference to
      one of those will be reported as an orphaned reference even though it resolves correctly
      at runtime. If your workflows lean on org or environment secrets, treat `orphaned` as a
      shortlist to check manually rather than a final verdict.

    ## Quick start

    1. Add the `GITHUB_ACCESS_TOKEN` and `SLACK_WEBHOOK_URL` secrets.
    2. Point `repository` at a repo you own with at least one workflow under `.github/workflows`.
    3. Run the flow once with the defaults; confirm it reaches `HEALTHY` or correctly names any
       existing drift.
    4. Rename a secret in repository settings without updating the workflow that references the
       old name; re-run and confirm `alert_orphaned` names it.
    5. Set `confirm_file_issue: true` and re-run; confirm a tracking issue is opened with the
       same detail.

    ## How to extend

    - Extend the regex to also catch `secrets['NAME']` and interpolated names, trading simplicity
      for completeness.
    - Pull organization-level secret names via the org-scoped secrets endpoint too, so org
      secrets stop appearing as false-positive orphaned references.
    - Add a second pass over reusable workflow calls (`uses: ./.github/workflows/x.yml` with
      `secrets: inherit` or explicit `secrets:` mappings) to catch references passed through a
      caller workflow rather than read directly.

    ## Links

    - GitHub plugin (Kestra): https://kestra.io/plugins/plugin-github
    - GitHub Actions secrets REST API: https://docs.github.com/en/rest/actions/secrets
    - GitHub Actions secrets in workflows: https://docs.github.com/en/actions/security-guides/using-secrets-in-github-actions
  tags:
    - Infrastructure
  subTags:
    - CI/CD & Deployment
    - Monitoring & Alerting
  ee: false
  demo: false
