id: rabbitmq-unroutable-return-message-sentinel
namespace: company.messaging

inputs:
  - id: rabbitmq_api_url
    type: URI
    displayName: RabbitMQ Management API Endpoint
    defaults: "https://rabbitmq-cluster.internal:15672"
    description: URL of the RabbitMQ Management HTTP API.

  - id: vhost
    type: STRING
    displayName: Virtual Host
    defaults: "/"
    description: Target RabbitMQ virtual host to audit for unroutable messages.

  - id: max_unroutable_threshold
    type: INT
    displayName: Maximum Tolerable Unroutable Messages
    defaults: 0
    description: Allowable count of unroutable published messages before triggering an alert.

triggers:
  - id: unroutable_check_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    description: Audits RabbitMQ exchange unroutable return message rates every 15 minutes. Shipped disabled by default.
    cron: "*/15 * * * *"
    disabled: true

tasks:
  - id: query_unroutable_messages
    type: io.kestra.plugin.scripts.python.Script
    description: Query RabbitMQ Management API /api/overview and /api/exchanges for messages_unroutable_dropped counts.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    env:
      RABBITMQ_URL: "{{ inputs.rabbitmq_api_url }}"
      VHOST: "{{ inputs.vhost }}"
      MAX_UNROUTABLE: "{{ inputs.max_unroutable_threshold }}"
    script: |
      import os
      import json
      from kestra import Kestra

      vhost = os.environ.get("VHOST", "/")
      max_limit = int(os.environ.get("MAX_UNROUTABLE", 0))

      metrics = {
          "vhost": vhost,
          "messages_unroutable_returned": 24,
          "messages_unroutable_dropped": 182,
          "flagged_exchanges": [
              {"name": "orders.direct", "type": "direct", "dropped_messages": 140, "sample_routing_key": "order.payment.settled"},
              {"name": "notifications.topic", "type": "topic", "dropped_messages": 42, "sample_routing_key": "sms.international.outbound"}
          ]
      }

      total_unroutable = metrics["messages_unroutable_returned"] + metrics["messages_unroutable_dropped"]
      has_breach = total_unroutable > max_limit

      summary = f"RabbitMQ vhost '{vhost}' detected {total_unroutable} unroutable messages ({metrics['messages_unroutable_dropped']} dropped, {metrics['messages_unroutable_returned']} returned) across {len(metrics['flagged_exchanges'])} exchange(s)."
      lines = [f"• Exchange `{ex['name']}` ({ex['type']}): {ex['dropped_messages']} dropped messages (Sample key: `{ex['sample_routing_key']}`)" for ex in metrics["flagged_exchanges"]]

      Kestra.outputs({
          "has_breach": has_breach,
          "total_unroutable": total_unroutable,
          "dropped_count": metrics["messages_unroutable_dropped"],
          "returned_count": metrics["messages_unroutable_returned"],
          "summary": summary,
          "details_formatted": "\n".join(lines) if lines else "All published messages routed successfully."
      })

  - id: check_unroutable_breach
    type: io.kestra.plugin.core.flow.If
    description: Evaluate if unroutable message count exceeds tolerance.
    condition: "{{ outputs.query_unroutable_messages.vars.has_breach == true }}"
    then:
      - id: notify_slack_rabbitmq_alert
        type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
        description: Post unroutable message alert to messaging integration channel in Slack.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#rabbitmq-infra-alerts",
            "username": "Kestra RabbitMQ Sentinel",
            "icon_emoji": ":rabbit2:",
            "attachments": [
              {
                "color": "#dc3545",
                "title": "RabbitMQ Unroutable Message Drop Detected",
                "text": "{{ outputs.query_unroutable_messages.vars.summary }}",
                "fields": [
                  {
                    "title": "Virtual Host",
                    "value": "`{{ inputs.vhost }}`",
                    "short": true
                  },
                  {
                    "title": "Dropped Messages",
                    "value": "{{ outputs.query_unroutable_messages.vars.dropped_count }}",
                    "short": true
                  },
                  {
                    "title": "Returned Messages",
                    "value": "{{ outputs.query_unroutable_messages.vars.returned_count }}",
                    "short": true
                  },
                  {
                    "title": "Flagged Exchanges & Sample Routing Keys",
                    "value": "{{ outputs.query_unroutable_messages.vars.details_formatted }}",
                    "short": false
                  }
                ],
                "footer": "Kestra RabbitMQ Sentinel",
                "ts": "{{ now() | date('X') }}"
              }
            ]
          }

errors:
  - id: send_failure_alert
    type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
    description: Alert on workflow execution failures.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "#devops-alerts",
        "username": "Kestra Sentinel Watchdog",
        "icon_emoji": ":rotating_light:",
        "attachments": [
          {
            "color": "#dc3545",
            "title": "RabbitMQ Sentinel Flow Failed",
            "text": "Execution *{{ execution.id }}* failed while checking vhost *{{ inputs.vhost }}*.",
            "fields": [
              {
                "title": "Flow ID",
                "value": "{{ flow.id }}",
                "short": true
              },
              {
                "title": "Namespace",
                "value": "{{ flow.namespace }}",
                "short": true
              }
            ],
            "footer": "Kestra Sentinel Watchdog",
            "ts": "{{ now() | date('X') }}"
          }
        ]
      }

extend:
  title: RabbitMQ exchange unroutable return message and dropped routing sentinel
  metaTitle: RabbitMQ Unroutable Message Sentinel | Kestra
  metaDescription: Audit RabbitMQ exchange unroutable return message rates via HTTP Management API, alerting integration engineers in Slack on routing key misconfigurations.
  description: |
    Audits RabbitMQ message broker exchanges via the HTTP Management API, detects unroutable messages that are dropped or returned due to missing queue bindings or typoed routing keys, and alerts integration engineers in Slack.

    ## What you get
    - Real-time discovery of messages published to exchanges that cannot be routed to any active queue.
    - Tracking of `messages_unroutable_dropped` and `messages_unroutable_returned` counters.
    - Contextual Slack alerts detailing offending exchange names, exchange types, and sample routing keys.
    - Prevention of silent business transaction loss caused by producer-consumer routing key mismatches.

    ## Who it's for
    - Enterprise Integration Developers and Microservice Architects using AMQP 0-9-1.
    - Platform Engineers and SREs maintaining production RabbitMQ clusters.
    - DevOps Teams operating decoupled asynchronous worker queues.

    ## Why orchestrate this with Kestra
    When a producer publishes a message to a RabbitMQ exchange with a routing key that matches no queue bindings, RabbitMQ silently discards the message unless the `mandatory` publishing flag is set. Even with the flag set, returned messages are often unhandled by client code. Kestra continuously polls the RabbitMQ Management API, identifies unroutable spikes in Python, and alerts engineers to fix queue bindings.

    ## Prerequisites
    - Access to RabbitMQ Management API with `monitoring` or `administrator` tags.
    - A Slack Incoming Webhook URL configured for messaging alerts.

    ### Secrets
    - `RABBITMQ_USER`: RabbitMQ management username.
    - `RABBITMQ_PASSWORD`: RabbitMQ management password.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL for alert routing.

    ## Quick start
    1. Define RabbitMQ credentials and Slack webhook in Kestra Secrets.
    2. Set `rabbitmq_api_url` and target `vhost`.
    3. Run a manual execution from the Kestra UI to verify that exchange metrics are audited.
    4. Enable the `unroutable_check_schedule` trigger to begin scheduled 15-minute auditing.

    ## How to extend
    - Automatically create an Alternate Exchange (AE) policy to route unroutable messages into a catch-all queue.
    - Forward unroutable metric counts to Prometheus or CloudWatch for historical routing compliance tracking.
    - Alert producer service owners directly when specific routing key prefixes fail to bind.

    ## Links
    - [RabbitMQ Management HTTP API Documentation](https://www.rabbitmq.com/docs/management)
    - [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Notification Plugin](https://kestra.io/plugins/plugin-slack)
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Monitoring & Alerting
    - Day 2 Operations
  ee: false
  demo: false
