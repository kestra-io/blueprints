id: fbi-wanted-fugitives-telemetry-lakehouse-loader
namespace: company.analytics
description: Ingests public law enforcement alerts, fugitive profiles, and field office classifications from FBI Wanted API into DuckDB, exports Parquet and analytics datasets, and manages sync state with Kestra KV store.

inputs:
  - id: state_key
    type: STRING
    description: Kestra KV store key tracking processed unique entity identifiers.
    defaults: fbi-wanted-fugitives-telemetry-lakehouse-loader_state

variables:
  default_state: "[]"

triggers:
  - id: periodic_sync
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 4 * * 1"

tasks:
  - id: get_current_state
    type: io.kestra.plugin.core.kv.Get
    key: "{{ inputs.state_key }}"
    errorOnMissing: false

  - id: ingest_and_transform
    type: io.kestra.plugin.scripts.python.Commands
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install requests duckdb
    commands:
      - |
        python3 - << 'PYEOF'
        import os
        import json
        import requests
        import duckdb
        from datetime import datetime, timezone

        raw_state = """{{ outputs.get_current_state.value ?? vars.default_state }}"""
        try:
            seen_ids = set(json.loads(raw_state))
        except Exception:
            seen_ids = set()

        url = "https://api.fbi.gov/wanted/v1/list?pageSize=50"
        headers = {"User-Agent": "KestraLakehouseLoader/1.0 (kestra-data-pipeline; contact@company.internal)"}

        resp = requests.get(url, headers=headers, timeout=30)
        resp.raise_for_status()
        data = resp.json()
        root_key = "items"
        items = data.get(root_key, data) if root_key else data

        records = []
        now_iso = datetime.now(timezone.utc).isoformat()
        current_ids = []

        
        for item in items:
            uid = str(item.get('uid', 'UNKNOWN'))
            current_ids.append(uid)
            title = item.get('title', 'Unknown')
            warning = item.get('warning_message', 'None')
            sex = item.get('sex', 'Unknown')
            race = item.get('race_raw', item.get('race', 'Unknown'))
            status = item.get('status', 'na')

            records.append({
                'fugitive_id': uid,
                'title': str(title),
                'warning_message': str(warning),
                'sex': str(sex),
                'race': str(race),
                'status': str(status),
                'is_new': bool(uid not in seen_ids),
                'ingestion_timestamp': now_iso
            })
        

        con = duckdb.connect(database=":memory:")
        con.execute("""
            CREATE TABLE fbi_wanted (
                fugitive_id VARCHAR,
                title VARCHAR,
                warning_message VARCHAR,
                sex VARCHAR,
                race VARCHAR,
                status VARCHAR,
                is_new BOOLEAN,
                ingestion_timestamp VARCHAR
            );
        """)

        if records:
            con.execute("INSERT INTO fbi_wanted SELECT * FROM read_json_auto(?)", [json.dumps(records)])

        con.execute("COPY fbi_wanted TO 'fbi_wanted_profiles.parquet' (FORMAT PARQUET, COMPRESSION ZSTD);")
        con.execute("""
            COPY (
                SELECT
                    race,
                    sex,
                    COUNT(*) AS count
                FROM fbi_wanted
                GROUP BY 1, 2
                ORDER BY count DESC
            ) TO 'wanted_summary_by_demographics.csv' (HEADER, DELIMITER ',');
        """)

        new_count = con.execute("SELECT count(*) FROM fbi_wanted WHERE is_new = true").fetchone()[0]
        total_count = con.execute("SELECT count(*) FROM fbi_wanted").fetchone()[0]

        updated_ids = list(seen_ids.union(current_ids))
        with open("updated_state.json", "w") as f:
            json.dump(updated_ids, f)

        metrics = {
            "total_extracted": total_count,
            "new_entities": new_count,
            "synced_at": now_iso
        }
        with open("metrics.json", "w") as f:
            json.dump(metrics, f)

        print(f"Lakehouse sync complete. Processed {total_count} records ({new_count} newly observed).")
        PYEOF
    outputFiles:
      - fbi_wanted_profiles.parquet
      - wanted_summary_by_demographics.csv
      - updated_state.json
      - metrics.json

  - id: update_state
    type: io.kestra.plugin.core.kv.Set
    key: "{{ inputs.state_key }}"
    value: "{{ read(outputs.ingest_and_transform.outputFiles['updated_state.json']) }}"

  - id: analyze_and_notify
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.ingest_and_transform.outputFiles['fbi_wanted_profiles.parquet'] != null }}"
    then:
      - id: log_metrics
        type: io.kestra.plugin.core.log.Log
        message: "FBI Wanted Public Telemetry sync succeeded. Metrics: {{ read(outputs.ingest_and_transform.outputFiles['metrics.json']) }}"
