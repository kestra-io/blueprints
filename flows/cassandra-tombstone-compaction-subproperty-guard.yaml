id: cassandra-tombstone-compaction-subproperty-guard
namespace: company.team

description: >-
  Find Cassandra tables in the keyspaces you name whose compaction map carries a tombstone_threshold
  above a ceiling you set while unchecked_tombstone_compaction is not true. A high tombstone_threshold
  means a single SSTable has to be almost all tombstones before Cassandra will compact it on its own to
  purge them. With unchecked_tombstone_compaction off the engine also skips a run it judges
  unproductive, so on a delete heavy table tombstones pile up and reads that scan past them slow down or
  hit TombstoneOverwhelmingException. The guard reads system_schema.tables for those keyspaces, flags
  every table above the ceiling and alerts Slack. When you allow it, it rewrites only the two tombstone
  subproperties with ALTER TABLE one table at a time behind a human approval, keeping the table's
  existing compaction class and every other option, then reads the schema again and fails the run if any
  flagged table still reads above the ceiling.

inputs:
  - id: cassandra_host
    type: STRING
    defaults: "cassandra"
    displayName: Cassandra Host
    description: Hostname or IP of one Cassandra contact point reachable from the Kestra Worker.

  - id: cassandra_port
    type: INT
    defaults: 9042
    displayName: Cassandra CQL Port
    description: Native CQL port the contact point listens on.

  - id: cassandra_datacenter
    type: STRING
    defaults: "datacenter1"
    displayName: Local Datacenter
    description: Datacenter the driver treats as local for its load balancing policy. A default Cassandra install uses datacenter1.

  - id: target_keyspaces
    type: ARRAY
    itemType: STRING
    displayName: Target keyspaces
    description: Keyspaces to audit. Any name starting with system is dropped from the list before the query runs, so the built in keyspaces are never in scope.
    defaults:
      - app

  - id: tombstone_threshold_ceiling
    type: FLOAT
    displayName: tombstone_threshold ceiling
    description: Highest tombstone_threshold a table may carry before it is flagged. The Cassandra engine default is 0.2, so a table that never set the option reads as 0.2 and stays well under a sensible ceiling. A value near 1.0 is the dangerous case because single SSTable tombstone compaction then almost never triggers. Keep the remediation value at or below this number.
    defaults: 0.6

  - id: remediation_tombstone_threshold
    type: SELECT
    displayName: Remediation tombstone_threshold
    description: Value written into the compaction map for each flagged table. 0.2 restores the engine default, the ratio at which Cassandra considers a single SSTable tombstone compaction. The fix also sets unchecked_tombstone_compaction to true so the engine stops skipping a run it would otherwise judge unproductive.
    values:
      - "0.1"
      - "0.2"
      - "0.3"
    defaults: "0.2"

  - id: auto_remediate
    type: BOOL
    displayName: Auto remediate
    defaults: false

  - id: dry_run
    type: BOOL
    displayName: Dry run
    description: Must be false, together with auto_remediate true, before the approval step is even reached.
    defaults: true

variables:
  scoped_keyspaces: >-
    {{ inputs.target_keyspaces | jq('map(select(startswith("system") | not)) | if length == 0 then "none" else join(", ") end') | first }}
  scan_cql: >-
    SELECT keyspace_name, table_name, compaction FROM system_schema.tables WHERE keyspace_name IN ({{ inputs.target_keyspaces | jq('map(select(startswith("system") | not)) | if length == 0 then "\u0027 \u0027" else map("\u0027" + gsub("\u0027"; "\u0027\u0027") + "\u0027") | join(",") end') | first }})
  flag_count_jq: >-
    [.[] | select((.compaction.class != null) and (((.compaction.tombstone_threshold // "0.2") | tonumber) > {{ inputs.tombstone_threshold_ceiling }}) and ((.compaction.unchecked_tombstone_compaction // "false") != "true"))] | length
  flag_names_jq: >-
    [.[] | select((.compaction.class != null) and (((.compaction.tombstone_threshold // "0.2") | tonumber) > {{ inputs.tombstone_threshold_ceiling }}) and ((.compaction.unchecked_tombstone_compaction // "false") != "true")) | .keyspace_name + "." + .table_name + " (class=" + (.compaction.class // "?") + ", tombstone_threshold=" + (.compaction.tombstone_threshold // "0.2 engine default") + ", unchecked_tombstone_compaction=" + (.compaction.unchecked_tombstone_compaction // "false engine default") + ")"] | join(", ")
  fix_jq: >-
    [.[] | select((.compaction.class != null) and (((.compaction.tombstone_threshold // "0.2") | tonumber) > {{ inputs.tombstone_threshold_ceiling }}) and ((.compaction.unchecked_tombstone_compaction // "false") != "true")) | "ALTER TABLE \"" + (.keyspace_name | gsub("\"";"\"\"")) + "\".\"" + (.table_name | gsub("\"";"\"\"")) + "\" WITH compaction = {" + ((.compaction + {"tombstone_threshold": "{{ inputs.remediation_tombstone_threshold }}", "unchecked_tombstone_compaction": "true"}) | to_entries | map("'" + .key + "': '" + (.value | gsub("'"; "''")) + "'") | join(", ")) + "}"]

tasks:
  - id: scan_tables
    type: io.kestra.plugin.cassandra.standard.Query
    description: Read only. Lists each table's compaction option for the target keyspaces from system_schema.tables, restricted on the keyspace_name partition key so no ALLOW FILTERING is needed.
    session:
      endpoints:
        - hostname: "{{ inputs.cassandra_host }}"
          port: "{{ inputs.cassandra_port }}"
      localDatacenter: "{{ inputs.cassandra_datacenter }}"
    cql: "{{ render(vars.scan_cql) }}"
    fetchType: FETCH

  - id: flagged
    type: io.kestra.plugin.core.output.OutputValues
    description: Keep the tables above the ceiling, merge the two tombstone subproperties into each table's existing compaction map and build one ALTER TABLE per table plus a readable name list.
    values:
      fix_sql: "{{ outputs.scan_tables.rows | jq(render(vars.fix_jq)) | first | toJson }}"
      names: "{{ outputs.scan_tables.rows | jq(render(vars.flag_names_jq)) | first }}"

  - id: summary
    type: io.kestra.plugin.core.log.Log
    message: >-
      Tombstone compaction guard on {{ inputs.cassandra_host }}: scanned {{ outputs.scan_tables.size }} tables in {{ render(vars.scoped_keyspaces) }}, {{ outputs.scan_tables.rows | jq(render(vars.flag_count_jq)) | first }} carry a tombstone_threshold above {{ inputs.tombstone_threshold_ceiling }} with unchecked_tombstone_compaction off.

  - id: route
    type: io.kestra.plugin.core.flow.If
    condition: "{{ (outputs.scan_tables.rows | jq(render(vars.flag_count_jq)) | first) > 0 }}"
    then:
      - id: alert
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {{ {'text': 'Cassandra ' ~ inputs.cassandra_host ~ ': tables whose compaction tombstone_threshold is above the ceiling of ' ~ inputs.tombstone_threshold_ceiling ~ ' with unchecked_tombstone_compaction off, so single SSTable tombstone compaction almost never runs on them: ' ~ outputs.flagged.values.names ~ '. ' ~ (inputs.auto_remediate and not inputs.dry_run ? 'Asking for approval to set tombstone_threshold to ' ~ inputs.remediation_tombstone_threshold ~ ' and unchecked_tombstone_compaction to true, keeping each table compaction class.' : 'No change applied (auto_remediate=' ~ inputs.auto_remediate ~ ' dry_run=' ~ inputs.dry_run ~ ').')} | toJson }}

      - id: remediate_gate
        type: io.kestra.plugin.core.flow.If
        condition: "{{ inputs.auto_remediate and not inputs.dry_run }}"
        then:
          - id: hold
            type: io.kestra.plugin.core.flow.Pause
            description: Human approval before the schema changes. A high tombstone_threshold is occasionally set on purpose for an append only table that never deletes, so a person confirms the list first.
            onResume:
              - id: approved
                type: BOOL
                required: false
                description: Set true to rewrite the two tombstone subproperties on the listed tables. Anything else leaves the schema alone.

          - id: approval_gate
            type: io.kestra.plugin.core.flow.If
            condition: "{{ outputs.hold.onResume.approved ?? false }}"
            then:
              - id: remediate
                type: io.kestra.plugin.core.flow.Loop
                description: Sequential remediation on purpose. Concurrent schema changes race Cassandra schema agreement and can leave nodes disagreeing on the schema.
                concurrencyLimit: 1
                values: "{{ outputs.flagged.values.fix_sql }}"
                tasks:
                  - id: apply_compaction
                    type: io.kestra.plugin.cassandra.standard.Query
                    description: One ALTER TABLE ... WITH compaction per flagged table. The statement carries the table's whole existing compaction map with only tombstone_threshold and unchecked_tombstone_compaction changed, so the compaction class and every other option are preserved.
                    allowFailure: true
                    session:
                      endpoints:
                        - hostname: "{{ inputs.cassandra_host }}"
                          port: "{{ inputs.cassandra_port }}"
                      localDatacenter: "{{ inputs.cassandra_datacenter }}"
                    cql: "{{ item.value }}"

              - id: settle
                type: io.kestra.plugin.core.flow.Sleep
                description: Give the cluster a moment to reach schema agreement before the re-read, so a slow propagating ALTER does not read back as a false failure.
                duration: PT5S

              - id: reverify
                type: io.kestra.plugin.cassandra.standard.Query
                description: Read system_schema.tables again for the same keyspaces to confirm no table is left above the ceiling.
                session:
                  endpoints:
                    - hostname: "{{ inputs.cassandra_host }}"
                      port: "{{ inputs.cassandra_port }}"
                  localDatacenter: "{{ inputs.cassandra_datacenter }}"
                cql: "{{ render(vars.scan_cql) }}"
                fetchType: FETCH

              - id: verify_result
                type: io.kestra.plugin.core.flow.If
                condition: "{{ (outputs.reverify.rows | jq(render(vars.flag_count_jq)) | first) > 0 }}"
                then:
                  - id: remediation_failed
                    type: io.kestra.plugin.core.execution.Fail
                    errorMessage: "Tables still carry a tombstone_threshold above the ceiling after ALTER TABLE: {{ outputs.reverify.rows | jq(render(vars.flag_names_jq)) | first }}. Possible causes: the role lacks ALTER on these tables; a table was created above the ceiling while the run waited for approval; remediation_tombstone_threshold is set above tombstone_threshold_ceiling."
                else:
                  - id: remediated
                    type: io.kestra.plugin.core.log.Log
                    message: "Set and verified tombstone_threshold = {{ inputs.remediation_tombstone_threshold }} and unchecked_tombstone_compaction = true on {{ outputs.flagged.values.names }}. Each table kept its existing compaction class and every other option. This changes the schema only. It does not force a compaction or drop tombstones that gc_grace_seconds or overlapping SSTables still protect."
            else:
              - id: declined
                type: io.kestra.plugin.core.log.Log
                message: "Approval was not given, so the compaction option was left as it is on {{ outputs.flagged.values.names }}."
    else:
      - id: clean
        type: io.kestra.plugin.core.log.Log
        message: "Every table in {{ render(vars.scoped_keyspaces) }} either keeps tombstone_threshold at or below {{ inputs.tombstone_threshold_ceiling }} or has unchecked_tombstone_compaction turned on, so single SSTable tombstone compaction can run."

errors:
  - id: alert_flow_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alert Slack when the guard itself fails, for example an unreachable cluster or a role without ALTER rights, so a broken run never reads as a clean one.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {{ {'text': 'Cassandra tombstone compaction guard failed on ' ~ inputs.cassandra_host ~ ' (execution ' ~ execution.id ~ '). The tombstone compaction posture is now unknown. Check the task logs.'} | toJson }}

triggers:
  - id: daily
    type: io.kestra.plugin.core.trigger.Schedule
    description: Shipped disabled and always in safe mode (auto_remediate false, dry_run true) regardless of this flow's own defaults.
    cron: "10 4 * * *"
    disabled: true
    inputs:
      auto_remediate: false
      dry_run: true

extend:
  title: "Cassandra Tombstone Compaction Subproperty Guard"
  shortDescription: Flag Cassandra tables whose compaction tombstone_threshold is too high to purge tombstones while unchecked_tombstone_compaction is off, alert Slack, then tune both subproperties with ALTER TABLE behind an approval while keeping the compaction class and re-read the schema.
  metaTitle: Cassandra Tombstone Compaction Subproperty Guard with Kestra
  metaDescription: Flag Cassandra tables where a high compaction tombstone_threshold stops tombstone purging, alert Slack, tune the subproperties with ALTER TABLE and verify.
  description: |
    A delete heavy Cassandra table writes a tombstone for every deleted or expired row. Those tombstones only leave disk when compaction purges them. Two compaction subproperties decide how eagerly that happens. `tombstone_threshold` is the fraction of a single SSTable that must be tombstones before Cassandra will compact that one SSTable on its own to purge them. Its engine default is `0.2`. Set it near `1.0` and the SSTable has to be almost all tombstones before anything triggers, so in practice single SSTable tombstone compaction never runs. `unchecked_tombstone_compaction` decides whether the engine still runs that compaction when it judges the run unproductive. Its default is `false`, which means a borderline SSTable is skipped. Put a high `tombstone_threshold` next to the default `false` and a table that deletes a lot keeps its tombstones. Reads that scan past them get slow. A partition with enough of them answers with `TombstoneOverwhelmingException`.

    This blueprint reads `system_schema.tables` for the keyspaces you name, flags every table whose `tombstone_threshold` is above a ceiling you set while `unchecked_tombstone_compaction` is not `true` and alerts Slack. When you allow it, it rewrites only those two subproperties with `ALTER TABLE ... WITH compaction`, one table at a time, behind a human approval, then reads the schema again and fails the run if any flagged table still reads above the ceiling.

    This blueprint was created by [zkasuran](https://github.com/zkasuran).

    ## Findings

    Two honest notes, because the useful version of this guard is narrower than the scary version.

    First, an absent `tombstone_threshold` is not a problem. A table that never set the option reads as the engine default `0.2`, which is a low, purge friendly value, so this guard treats absent as safe and never flags it. The dangerous table is the one where somebody wrote a high value on purpose and moved on. That is why the detector reads the real value from the schema rather than assuming a default.

    Second, raising `unchecked_tombstone_compaction` makes single SSTable tombstone compaction eligible more often. It does not force a tombstone to drop. Cassandra still only drops a tombstone when it is safe, which means the tombstone is older than `gc_grace_seconds` and no overlapping SSTable still needs it. So this flow fixes the setting that was stopping the compaction from being considered. It does not promise that every tombstone leaves disk on the next pass. The honest claim is exact and checkable from the schema: these tables carried a configuration that suppressed single SSTable tombstone compaction. Now they do not.

    ## Safety

    The precision rule is the point of this blueprint. A table's compaction map holds its strategy `class` (SizeTieredCompactionStrategy, LeveledCompactionStrategy, TimeWindowCompactionStrategy and so on) plus the options that strategy was tuned with. A naive `ALTER TABLE ... WITH compaction = {'class': 'SizeTieredCompactionStrategy', ...}` would overwrite all of that and could silently change the table's real strategy, which is a far worse change than the one it set out to make. So the guard reads the current compaction map first, merges only `tombstone_threshold` and `unchecked_tombstone_compaction` into it and writes the whole merged map back. The `class` and every other option are preserved exactly. The re-verify step reads `system_schema.tables` again and the PR description shows the compaction map before and after, including the unchanged class.

    The remediation loop runs one `ALTER TABLE` at a time (`concurrencyLimit: 1`). Concurrent schema changes race Cassandra schema agreement and can leave nodes disagreeing on the schema. Both write gates (`auto_remediate` true with `dry_run` false) plus a human approval must line up before any `ALTER TABLE` runs.

    ## How it works

    1. `scan_tables` (`io.kestra.plugin.cassandra.standard.Query`, read only) runs `SELECT keyspace_name, table_name, compaction FROM system_schema.tables WHERE keyspace_name IN (...)` for the `target_keyspaces` you pass. Any name starting with `system` is dropped from the list first, so the built in keyspaces are never in scope. The restriction is on the `keyspace_name` partition key, so the read needs no `ALLOW FILTERING`.
    2. `flagged` (`io.kestra.plugin.core.output.OutputValues`) keeps the rows whose `tombstone_threshold` is above `tombstone_threshold_ceiling` while `unchecked_tombstone_compaction` is not `true`, merges the two subproperties into each table's existing compaction map and builds one `ALTER TABLE` per table plus a readable name list. `summary` logs the counts.
    3. `route` (`io.kestra.plugin.core.flow.If`) branches on whether any table is above the ceiling:
       - **clean:** `clean` logs that every table in the target keyspaces can run single SSTable tombstone compaction.
       - **flagged:** `alert` posts the table list to Slack.
         - `remediate_gate` runs only when `auto_remediate` is true with `dry_run` false.
         - `hold` (`io.kestra.plugin.core.flow.Pause`) waits for a person to approve the list.
         - `remediate` (`io.kestra.plugin.core.flow.Loop`, `concurrencyLimit: 1`) runs each merged `ALTER TABLE ... WITH compaction` through `io.kestra.plugin.cassandra.standard.Query` in turn.
         - `settle` waits a few seconds for schema agreement, then `reverify` re-reads `system_schema.tables`. `verify_result` fails the run through `io.kestra.plugin.core.execution.Fail` if any table still reads above the ceiling.
    4. The `errors` block alerts Slack when the flow itself fails, for example an unreachable cluster or a role without `ALTER` rights.
    5. The `daily` `Schedule` trigger ships `disabled: true` and always forces safe mode.

    ## What you get

    - A standing answer to which tables carry a compaction configuration that suppresses single SSTable tombstone compaction, read from Cassandra's own schema rather than from the `CREATE TABLE` somebody committed two years ago.
    - A fix that changes only the two tombstone subproperties, one table at a time, behind two input gates plus a human approval, with a re-read of the schema as proof.
    - The compaction `class` and every other option left exactly as they were, so a Leveled or TimeWindow table stays on its strategy.
    - A Slack page listing the tables, plus a separate failure channel when the guard cannot run.

    ## Who it's for

    - Platform and database reliability teams running delete heavy or TTL heavy Cassandra tables who want tombstone purging to be a setting they can see rather than an incident they discover.
    - Teams inheriting keyspaces where a high `tombstone_threshold` was copied between `CREATE TABLE` statements without anyone noticing.
    - Anyone who has met `TombstoneOverwhelmingException` on a read path and wants the compaction side of the fix enforced on a schedule.

    ## Why orchestrate this with Kestra

    A `DESCRIBE TABLE` in cqlsh answers this for one table at one moment and changes nothing. Kestra reads the whole set on a schedule, turns it into a Slack page and an execution history, merges the fix into each table's existing compaction map only behind `auto_remediate` with `dry_run` plus a human approval, one statement at a time, then verifies by reading the schema back. A table created with a high `tombstone_threshold` next month is caught by the next scheduled run instead of by a read timeout.

    ## Tested end to end

    On Kestra 2.0.5 against `cassandra:5` (5.0) on the same Docker network, with a local HTTP sink standing in for Slack. Seeded keyspace `app`: `events` created `WITH compaction = {'class': 'SizeTieredCompactionStrategy', 'tombstone_threshold': '0.99', 'unchecked_tombstone_compaction': 'false'}`; `logs_lcs` created on `LeveledCompactionStrategy` with `tombstone_threshold: '0.95'` to prove the class survives the ALTER; `metrics_tuned` left on STCS with `unchecked_tombstone_compaction: 'true'` so it is never flagged; `plain_default` created with no tombstone options so it reads the engine default `0.2`. Keyspace `app_clean` holds one table at the defaults.

    | Run | Inputs | Result |
    |---|---|---|
    | 1 | `target_keyspaces: [app_clean]`, ceiling 0.6 | Clean. 1 table scanned, 0 flagged. No alert, no change |
    | 2 | `target_keyspaces: [app]` | 4 scanned, 2 flagged (`app.events` at 0.99, `app.logs_lcs` at 0.95). Alert sent. `metrics_tuned` and `plain_default` not flagged. Schema unchanged |
    | 3 | run 2 plus `auto_remediate: true`, `dry_run: true` | Same report. cqlsh confirms all 4 unchanged. No ALTER ran, the Pause was never reached |
    | 4 | `auto_remediate: true`, `dry_run: false`, resumed with no answer | Pause reached, `declined` branch taken, schema untouched |
    | 5 | same, approved | 2 ALTER TABLE ran one at a time, `reverify` found 0 above the ceiling. cqlsh: `events` now `0.2` with `unchecked_tombstone_compaction true` and class still SizeTieredCompactionStrategy, `logs_lcs` now `0.2`/true with class still LeveledCompactionStrategy and `sstable_size_in_mb` kept |
    | 6 | same, with `app.hotpath` created at `0.99` while the run waited for approval | The 2 known tables were fixed, `reverify` found `app.hotpath`, the run FAILED and the `errors` block posted |
    | 7 | `target_keyspaces: [system, system_schema, app_clean]` | 1 table scanned. The system names are dropped before the query runs |
    | 8 | `cassandra_host` pointed at an unreachable name | `scan_tables` failed, the `errors` block posted to the sink, execution FAILED |

    Before and after compaction maps from `cqlsh` are in the PR description, including the proof that each table kept its compaction class.

    ## Prerequisites

    - A reachable Cassandra cluster with its native CQL port open to the Kestra Worker. For the audit, a role that can read `system_schema.tables`. For remediation, a role with `ALTER` on the target tables.
    - The bundled Cassandra plugin (`io.kestra.plugin.cassandra.standard.Query`), which ships with Kestra.
    - Local testing: `docker run -d --name cassandra --network <kestra-network> -e MAX_HEAP_SIZE=1G -e HEAP_NEWSIZE=256M cassandra:5`, then create a keyspace and a table `WITH compaction = {'class': 'SizeTieredCompactionStrategy', 'tombstone_threshold': '0.99', 'unchecked_tombstone_compaction': 'false'}`. Allow a minute or two before the node accepts CQL.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack incoming webhook used by `alert` and the `errors` block.
    - This flow connects without a username or password, which matches a local single node Cassandra. For an authenticated cluster, add a `username` plus a `password: {{ secret('CASSANDRA_PASSWORD') }}` to each task's `session` rather than hardcoding them. The driver needs both or neither.
    - In Kestra OSS, provide a secret as a base64-encoded environment variable prefixed `SECRET_`, for example `SECRET_SLACK_WEBHOOK_URL`.

    ### Inputs

    | Input | Default | Purpose |
    |---|---|---|
    | `cassandra_host` | `cassandra` | Contact point hostname or IP |
    | `cassandra_port` | `9042` | Native CQL port |
    | `cassandra_datacenter` | `datacenter1` | Local datacenter for the driver |
    | `target_keyspaces` | `[app]` | Keyspaces to audit. Names starting with `system` are dropped |
    | `tombstone_threshold_ceiling` | `0.6` | Highest `tombstone_threshold` allowed before a table is flagged |
    | `remediation_tombstone_threshold` | `0.2` | Value written by the fix. Keep it at or below the ceiling |
    | `auto_remediate` | `false` | Allow `ALTER TABLE` |
    | `dry_run` | `true` | Must be `false` before the approval step is reached |

    ## Quick start

    1. Add the `SLACK_WEBHOOK_URL` secret. The Cassandra plugin ships with Kestra, so there is nothing extra to install.
    2. Import the flow and set `target_keyspaces` to your application keyspaces.
    3. Run it once with the defaults and read which tables carry a high `tombstone_threshold`.
    4. Agree the list with the table owners, then run with `auto_remediate: true` and `dry_run: false` and approve the Pause.
    5. Enable the `daily` trigger, which always runs in safe mode.

    ## How to extend

    - Set a different ceiling per keyspace from a map, for example a higher allowance for an append only keyspace that never deletes.
    - Keep an allowlist of tables that are meant to carry a high `tombstone_threshold`, then skip them in `flagged`.
    - Also tune `tombstone_compaction_interval` on the same tables, the minimum age before a single SSTable is eligible for a tombstone compaction.
    - Pair with the `scylladb-gc-grace-seconds-floor-guard` or a scheduled repair, so the retention side of the tombstone lifecycle is covered as well as the purge side.

    ## Links

    - [Cassandra compaction subproperties](https://cassandra.apache.org/doc/stable/cassandra/managing/operating/compaction/overview.html)
    - [Cassandra CQL table options](https://cassandra.apache.org/doc/stable/cassandra/developing/cql/ddl.html#create-table-options)
    - [plugin-cassandra documentation](https://kestra.io/plugins/plugin-cassandra)
    - [Slack plugin](https://kestra.io/plugins/plugin-slack)
  tags:
    - Infrastructure
    - Data
  subTags:
    - Day 2 Operations
  ee: false
  demo: false
