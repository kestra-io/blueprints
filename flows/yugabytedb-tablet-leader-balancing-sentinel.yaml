id: yugabytedb-tablet-leader-balancing-sentinel
namespace: company.database

inputs:
  - id: yb_master_url
    type: STRING
    defaults: "http://yb-master.internal:7000"
    description: Base URL of the YugabyteDB YB-Master web management UI / API.

tasks:
  - id: inspect_tablet_servers
    type: io.kestra.plugin.scripts.shell.Commands
    commands:
      - |
        # Query YB-Master tablet-servers JSON endpoint
        curl -s "{{ inputs.yb_master_url }}/api/v1/tablet-servers" > /tmp/yb_servers.json

        python3 -c "
        import json
        try:
            with open('/tmp/yb_servers.json') as f:
                data = json.load(f)
            servers = list(data.values()) if isinstance(data, dict) else []
            alive_count = 0
            dead_count = 0
            for s in servers:
                status = s.get('status', 'ALIVE')
                if status == 'ALIVE':
                    alive_count += 1
                else:
                    dead_count += 1
            is_breach = 1 if dead_count > 0 or alive_count < 3 else 0
            print(f'{is_breach}|{alive_count}|{dead_count}')
        except Exception:
            print('1|0|0')
        " > /tmp/yb_summary.txt

        IS_BREACH=$(cut -d '|' -f 1 /tmp/yb_summary.txt)
        ALIVE_COUNT=$(cut -d '|' -f 2 /tmp/yb_summary.txt)
        DEAD_COUNT=$(cut -d '|' -f 3 /tmp/yb_summary.txt)
        
        echo "::set-output name=is_breach::${IS_BREACH:-0}::"
        echo "::set-output name=alive_count::$ALIVE_COUNT::"
        echo "::set-output name=dead_count::$DEAD_COUNT::"

  - id: evaluate_cluster_topology
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.inspect_tablet_servers.vars.is_breach | int == 1 }}"
    then:
      - id: notify_dba_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#dba-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 YugabyteDB Tablet Server Degradation Alert",
                "text": "YugabyteDB cluster at {{ inputs.yb_master_url }} has {{ outputs.inspect_tablet_servers.vars.dead_count }} unreachable tablet server(s) (Alive: {{ outputs.inspect_tablet_servers.vars.alive_count }}). Tablet replication and distributed SQL transactions are degraded.",
                "footer": "Kestra Distributed SQL Sentinel • YugabyteDB"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#dba-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ YugabyteDB Sentinel Failure",
            "text": "Failed to communicate with YugabyteDB master at {{ inputs.yb_master_url }}.",
            "footer": "Kestra Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  ee: false
  demo: false
  title: YugabyteDB Distributed Tablet Server Node Availability Sentinel
  shortDescription: Audits YugabyteDB cluster tablet servers to detect unreachable nodes and tablet rebalancing failures.
  description: |
    ## How it works
    This workflow connects to the YugabyteDB YB-Master administrative API (`/api/v1/tablet-servers`) to audit the live state of all tablet server (YB-TServer) nodes. In YugabyteDB's distributed architecture, data is split into tablets that use Raft consensus across tablet servers. When a node experiences hardware failure, OOM kills, or network partition, YB-Master must detect the heartbeat loss and coordinate automatic tablet leader failover. If multiple nodes drop or total alive nodes fall below quorum, transaction read-write paths freeze. This sentinel audits node health and dispatches alerts before cluster quorum degrades.

    ## What you get
    - Real-time tracking of YugabyteDB tablet server availability and cluster quorum.
    - Early warning before distributed transactions and Raft consensus fail.
    - Automated Slack incident notifications with live and dead node counts.

    ## Who it's for
    - Database Administrators operating distributed PostgreSQL-compatible YugabyteDB clusters.
    - SREs safeguarding high-availability distributed transactional backends.
    - Platform Engineers managing multi-zone cloud database topologies.

    ## Why orchestrate this with Kestra
    - **Automated Cluster Surveillance**: Periodically inspects master cluster topology without deploying external monitoring agents.
    - **Native API Capabilities**: Interacts directly with YB-Master REST endpoints from ephemeral runners.
    - **Incident Orchestration**: Notifies platform engineers directly in team collaboration channels.

    ## Prerequisites
    - YugabyteDB cluster with accessible YB-Master HTTP port (`7000`).
    - Slack incoming webhook URL configured in `SLACK_WEBHOOK` secret.

    ## Quick start
    1. Import this blueprint into your Kestra workspace.
    2. Add `SLACK_WEBHOOK` secret to your namespace.
    3. Specify `yb_master_url`.
    4. Enable the schedule trigger for continuous node availability surveillance.

    ## How to extend
    - Query tablet leader distributions to detect hotspot tablet skew.
    - Trigger automated cloud node provisioning via Terraform or Kubernetes operator.
    - Route critical alerts to PagerDuty or Opsgenie.

    ## Links
    - [YugabyteDB Admin API Reference](https://docs.yugabyte.com/preview/admin/troubleshooting/admin-endpoints/)
    - [Kestra Shell Plugin](https://kestra.io/plugins/plugin-scripts-shell)
    - [Kestra Slack Notifications](https://kestra.io/plugins/plugin-slack)
  tags:
    - Data
    - Infrastructure
