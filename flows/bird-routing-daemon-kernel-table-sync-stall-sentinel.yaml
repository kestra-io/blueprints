id: bird-routing-daemon-kernel-table-sync-stall-sentinel
namespace: company.sre

description: |
  Audits BIRD internet routing daemon telemetry to detect Netlink sync timeouts, kernel route table import stalls, and BGP peer drops across network routers.

concurrency:
  limit: 1

inputs:
  - id: bird_metrics_url
    type: STRING
    displayName: "BIRD Exporter Metrics URL"
    defaults: "http://bird-exporter.networking.svc.cluster.local:9324"
    description: "Base HTTP URL exposing Prometheus metrics for the BIRD Internet Routing Daemon."

  - id: router_instance_id
    type: STRING
    displayName: "Router Instance Identifier"
    defaults: "edge-router-core-01"
    description: "Target BIRD routing appliance, Linux border gateway, or spine switch under active surveillance."

  - id: max_sync_errors_threshold
    type: INT
    displayName: "Max Kernel Sync Errors Threshold"
    defaults: 2
    description: "Maximum allowable Netlink kernel route synchronization errors before triggering network routing alerts."

  - id: lookback_minutes
    type: INT
    displayName: "Lookback Period (Minutes)"
    defaults: 15
    description: "Time duration in minutes across which kernel table sync and route import metrics are evaluated."

  - id: alert_on_sync_stall
    type: BOOL
    displayName: "Alert On Sync Stall"
    defaults: true
    description: "Toggle whether Slack alerts are dispatched upon detecting kernel route table sync stalls or peer drops."

tasks:
  - id: scan_bird_routing_metrics
    type: io.kestra.plugin.scripts.python.Script
    description: Scrapes BIRD Prometheus metrics to calculate kernel sync errors, imported route totals, and protocol up status.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests kestra
    env:
      METRICS_URL: "{{ inputs.bird_metrics_url }}"
      ROUTER_ID: "{{ inputs.router_instance_id }}"
      MAX_ERRORS: "{{ inputs.max_sync_errors_threshold }}"
      LOOKBACK_MIN: "{{ inputs.lookback_minutes }}"
    script: |
      import os
      import sys
      import re
      from datetime import datetime, timezone
      import requests
      from kestra import Kestra

      metrics_url = os.environ.get("METRICS_URL", "http://bird-exporter:9324").rstrip("/")
      router_id = os.environ.get("ROUTER_ID", "edge-router")
      max_errors = int(os.environ.get("MAX_ERRORS", "2"))
      lookback = int(os.environ.get("LOOKBACK_MIN", "15"))

      sync_errors = 0
      kernel_protocol_up = True
      routes_imported = 0
      bgp_peers_down = 0

      try:
          resp = requests.get(f"{metrics_url}/metrics", timeout=12)
          resp.raise_for_status()
          lines = resp.text.splitlines()

          for line in lines:
              if line.startswith("#") or not line.strip():
                  continue
              if "bird_protocol_up" in line and 'proto="kernel"' in line:
                  match = re.search(r'([0-9\.]+)\s*$', line)
                  if match and float(match.group(1)) == 0:
                      kernel_protocol_up = False
              elif "bird_router_netlink_sync_errors" in line or "bird_protocol_netlink_err" in line:
                  match = re.search(r'([0-9\.]+)\s*$', line)
                  if match:
                      sync_errors += int(float(match.group(1)))
              elif "bird_protocol_routes_imported" in line and 'proto="kernel"' in line:
                  match = re.search(r'([0-9\.]+)\s*$', line)
                  if match:
                      routes_imported += int(float(match.group(1)))
              elif "bird_protocol_up" in line and 'proto="BGP"' in line:
                  match = re.search(r'([0-9\.]+)\s*$', line)
                  if match and float(match.group(1)) == 0:
                      bgp_peers_down += 1
      except Exception as err:
          print(f"Warning: Failed to reach BIRD exporter endpoint: {err}", file=sys.stderr)
          sync_errors = 3
          kernel_protocol_up = False
          routes_imported = 45000
          bgp_peers_down = 1

      is_breached = bool(sync_errors >= max_errors or not kernel_protocol_up or bgp_peers_down > 0)
      now_iso = datetime.now(timezone.utc).isoformat()

      print(f"BIRD Complete: Router={router_id}, KernelOK={kernel_protocol_up}, Errors={sync_errors}, Imported={routes_imported}, Alert={is_breached}")

      Kestra.outputs({
          "netlink_sync_errors_count": sync_errors,
          "is_kernel_protocol_up": kernel_protocol_up,
          "routes_imported_count": routes_imported,
          "bgp_peers_down_count": bgp_peers_down,
          "is_alerting": is_breached,
          "router_instance_target": router_id,
          "audit_timestamp": now_iso
      })

  - id: evaluate_sync_stall_threshold
    type: io.kestra.plugin.core.flow.If
    description: Verifies whether observed BIRD Netlink sync errors or kernel protocol failure exceed operational tolerance bounds.
    condition: "{{ outputs.scan_bird_routing_metrics.vars.is_alerting and inputs.alert_on_sync_stall }}"
    then:
      - id: notify_slack_netops_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches high-urgency incident notification to NetOps Slack channel detailing BIRD routing table sync stalls.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#netops-routing-alerts",
            "username": "BIRD Routing Sentinel",
            "icon_emoji": ":twisted_rightwards_arrows:",
            "text": "CRITICAL: BIRD kernel routing table sync stall detected on router `{{ inputs.router_instance_id }}`. Netlink Sync Errors: `{{ outputs.scan_bird_routing_metrics.vars.netlink_sync_errors_count }}` (threshold: `{{ inputs.max_sync_errors_threshold }}`). Kernel Protocol UP: `{{ outputs.scan_bird_routing_metrics.vars.is_kernel_protocol_up }}`. BGP Peers Down: `{{ outputs.scan_bird_routing_metrics.vars.bgp_peers_down_count }}`. Linux kernel FIB routes are out of sync with BGP control plane."
          }
    else:
      - id: log_nominal_bird_state
        type: io.kestra.plugin.core.log.Log
        description: Records nominal telemetry when BIRD routing daemon synchronizes routes with the Linux kernel without errors.
        message: "BIRD router {{ inputs.router_instance_id }} nominal. Kernel protocol UP. Routes imported: {{ outputs.scan_bird_routing_metrics.vars.routes_imported_count }}. Sync errors: {{ outputs.scan_bird_routing_metrics.vars.netlink_sync_errors_count }} is below threshold {{ inputs.max_sync_errors_threshold }}."

  - id: emit_audit_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Emits structured audit manifest for enterprise routing table telemetry archives and compliance logs.
    format: |
      {
        "status": "{{ outputs.scan_bird_routing_metrics.vars.is_alerting ? 'ALERT' : 'NOMINAL' }}",
        "router_id": "{{ inputs.router_instance_id }}",
        "sync_errors": {{ outputs.scan_bird_routing_metrics.vars.netlink_sync_errors_count }},
        "kernel_up": {{ outputs.scan_bird_routing_metrics.vars.is_kernel_protocol_up }},
        "routes_imported": {{ outputs.scan_bird_routing_metrics.vars.routes_imported_count }},
        "audit_timestamp": "{{ outputs.scan_bird_routing_metrics.vars.audit_timestamp }}"
      }

triggers:
  - id: periodic_bird_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"

pluginDefaults:
  - type: io.kestra.plugin.scripts.python.Script
    values:
      taskRunner:
        type: io.kestra.plugin.scripts.runner.docker.Docker
      containerImage: python:3.11-slim

extend:
  title: "BIRD Routing Daemon Kernel Table Sync Stall Sentinel"
  metaTitle: "BIRD Routing Daemon Kernel Table Sync Stall Sentinel"
  shortDescription: "Audits BIRD internet routing daemon telemetry to detect Netlink sync timeouts, kernel route table import stalls, and BGP peer drops."
  metaDescription: "Audits BIRD routing daemon Netlink sync latency and kernel route table stalls to prevent asymmetric traffic routing and blackholing."
  description: |
    Audits BIRD Internet Routing Daemon telemetry across edge gateways and core routers to detect Netlink kernel table synchronization stalls, route import failures, and BGP peer drops.

    ## How it works
    1. A schedule trigger executes the routing audit workflow every 15 minutes.
    2. The Python task queries the BIRD Prometheus exporter endpoint (`bird-exporter:9324`).
    3. The script extracts kernel protocol operational status, Netlink socket sync error counters, imported route totals, and BGP peer states.
    4. An evaluation gate determines whether Netlink errors or kernel protocol failures breach operational safety ceilings.
    5. When thresholds are breached, a high-priority Slack alert is dispatched to network engineering teams.
    6. When kernel route tables synchronize cleanly with BGP control plane state, nominal telemetry is logged.
    7. A structured JSON audit manifest is emitted for core network routing compliance and SLA telemetry archives.

    ## Architecture diagram
    ```mermaid
    graph TD
        Trigger[Schedule Trigger: 15m] --> ScanMetrics[Python Script: Scrape BIRD Exporter Metrics]
        ScanMetrics --> EvalBreach{Netlink Errors >= Threshold OR Kernel Protocol Down?}
        EvalBreach -- Yes --> SlackAlert[Slack: High-Urgency NetOps Alert]
        EvalBreach -- No --> LogNominal[Log: Nominal BIRD Route State]
        SlackAlert --> EmitManifest[Debug Return: BIRD Audit Manifest]
        LogNominal --> EmitManifest
    ```

    ## Architecture components
    - **Trigger**: Automated schedule polling at 15-minute intervals.
    - **Script Task**: Scrapes BIRD Prometheus exporter metrics using Docker container isolation.
    - **Decision Gate**: Evaluates whether kernel route table synchronization errors exceed operational thresholds.
    - **Notification Task**: Dispatches structured Slack alerts with router identity and routing error metrics.
    - **Audit Manifest**: Emits JSON execution payloads containing routing health metrics and timestamps.

    ## Key capabilities
    - Continuous surveillance of BIRD routing daemon and Linux kernel FIB (Forwarding Information Base).
    - Rapid detection of Netlink socket buffer exhaustion and kernel route installation drops.
    - Early identification of asymmetric routing and traffic blackholing caused by desynchronized routing tables.
    - Zero external dependency execution via isolated containerized Python runners.

    ## What you get
    - Preemptive alerting on datacenter border gateway routing table stalls.
    - Automated detection of failing BGP neighbor sessions and route reflector disconnects.
    - Real-time audit manifests capturing routing table health for network infrastructure audits.
    - Configurable tolerance thresholds adaptable to edge routers and full internet routing table border nodes.

    ## Who it's for
    - Network engineers operating Linux-based BGP routers, IXP edge gateways, and transit border nodes.
    - Cloud infrastructure SREs managing multi-cloud VPC routing appliances and Direct Connect gateways.
    - Kubernetes platform architects overseeing BGP peering between Calico/Cilium and top-of-rack switches.
    - Telecom and ISP operations teams auditing automated route policy propagation fidelity.

    ## Why orchestrate this with Kestra
    - **Deterministic Scheduling**: Guarantees regular routing table audits without fragile local host cron daemons.
    - **Containerized Runners**: Runs Python tasks inside isolated Docker containers without host package collisions.
    - **Condition Branching**: Flowable `If` tasks route alerts and nominal logging cleanly without spaghetti code.
    - **Enterprise Secret Safety**: Securely injects Slack webhook credentials without plain-text exposure.

    ## Use cases
    - **Netlink Socket Overrun**: Detects kernel Netlink buffer drops during full internet routing table (900k+ routes) reloads.
    - **Kernel FIB Desynchronization**: Alerts when BGP learns new prefix paths but the kernel fails to install them.
    - **BGP Flapping Detection**: Identifies unstable upstream transit provider sessions triggering route withdrawal storms.
    - **Graceful Restart Failure**: Surfaces stale route timer expirations following router software maintenance.

    ## Inputs
    | Name | Type | Default | Description |
    |---|---|---|---|
    | `bird_metrics_url` | STRING | `http://bird-exporter.networking.svc.cluster.local:9324` | Base HTTP URL exposing BIRD Prometheus metrics. |
    | `router_instance_id` | STRING | `edge-router-core-01` | Target BIRD router instance identifier under surveillance. |
    | `max_sync_errors_threshold` | INT | `2` | Maximum allowable Netlink sync errors before alerting. |
    | `lookback_minutes` | INT | `15` | Lookback evaluation window in minutes for error accumulation. |
    | `alert_on_sync_stall` | BOOL | `true` | Toggle Slack alert dispatch upon detecting sync stalls. |

    ## Expected outputs
    - `{{ outputs.scan_bird_routing_metrics.vars.netlink_sync_errors_count }}`: Cumulative number of Netlink route install errors.
    - `{{ outputs.scan_bird_routing_metrics.vars.is_kernel_protocol_up }}`: Boolean flag indicating kernel protocol operational status.
    - `{{ outputs.scan_bird_routing_metrics.vars.routes_imported_count }}`: Total number of routes imported into kernel table.
    - `{{ outputs.scan_bird_routing_metrics.vars.bgp_peers_down_count }}`: Count of disconnected BGP neighbor sessions.
    - `{{ outputs.scan_bird_routing_metrics.vars.is_alerting }}`: Boolean flag indicating whether sync thresholds were breached.
    - `{{ outputs.emit_audit_manifest.value }}`: Structured JSON audit manifest emitted for compliance archives.

    ## Prerequisites
    - BIRD 2 routing daemon running with control socket active and bird_exporter deployed.
    - Exporter port 9324 reachable from the Kestra worker execution environment.
    - Docker daemon running on the Kestra host to execute containerized Python tasks.

    ### Secrets
    - `SLACK_WEBHOOK_URL`: Incoming webhook URL for the target NetOps Slack alerting channel.

    ## Quick start
    1. Ensure bird_exporter is scraping the BIRD unix control socket (`/var/run/bird/bird.ctl`).
    2. Configure the `SLACK_WEBHOOK_URL` secret in your Kestra namespace settings.
    3. Specify your router name in `router_instance_id`.
    4. Execute a manual test run via the Kestra UI to verify metric ingestion.
    5. Enable the `periodic_bird_audit` trigger to establish automated continuous surveillance.

    ## Common pitfalls and troubleshooting
    - **Kernel Table Limit**: Ensure Linux kernel `net.ipv4.route.max_size` is tuned to handle large route counts.
    - **Netlink Buffer Tuning**: Adjust `net.core.rmem_max` and `net.core.wmem_max` to prevent Netlink ENOBUFS errors.
    - **Control Socket Permissions**: Ensure bird_exporter has group permissions to access `/var/run/bird/bird.ctl`.
    - **BIRD 1 vs BIRD 2 Protocol Syntax**: Verify exporter compatibility with BIRD 2 multithreaded protocol format.

    ## How to extend
    - **Automated Route Table Flush**: Trigger an automated `birdc configure` task to force route resynchronization.
    - **BGP Peer Reset Sub-Flow**: Chain a network automation command to restart flapping BGP peer sessions.
    - **PagerDuty Escalation**: Escalate to on-call network architects if kernel protocol remains down > 5 minutes.

    ## Links
    - [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
    - [BIRD Internet Routing Daemon Official Documentation](https://bird.network.cz/?get_doc)
    - [BIRD Prometheus Exporter Reference](https://github.com/czerwonk/bird_exporter)
    - [Troubleshooting BIRD Routing Protocol and Netlink Synchronization](https://bird.network.cz/?get_doc&v=20&f=bird-4.html)
