id: tika-document-quality-gate
namespace: company.team
description: |
  Audit web documents with Apache Tika, normalize Content-Type MIME metadata,
  enforce character length thresholds, and send Slack alerts for quality failures.

inputs:
  - id: document_urls
    type: ARRAY
    itemType: STRING
    displayName: Document URLs to audit
    description: List of public document URLs (PDF, TXT, HTML) to parse and evaluate.
    defaults:
      - "https://huggingface.co/datasets/kestra/datasets/resolve/main/pdf/app_store.pdf"
      - "https://www.rfc-editor.org/rfc/rfc2324.txt"
      - "https://docs.python.org/3/license.html"
      - "https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf"

  - id: min_chars
    type: SELECT
    displayName: Minimum character count threshold
    description: Minimum number of extracted text characters required for a document to pass quality audit.
    values:
      - "500"
      - "1000"
      - "5000"
    defaults: "1000"

triggers:
  - id: weekly_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 8 * * 1"
    disabled: true

tasks:
  - id: process_documents
    type: io.kestra.plugin.core.flow.Loop
    description: Iterate through input document URLs, extract text with Tika, and enforce quality criteria.
    values: "{{ inputs.document_urls }}"
    tasks:
      - id: download_document
        type: io.kestra.plugin.core.http.Download
        description: Stream document from web source into internal storage.
        uri: "{{ item.value }}"

      - id: parse_document
        type: io.kestra.plugin.tika.Parse
        description: Parse document text and metadata with Apache Tika.
        from: "{{ outputs.download_document.uri }}"
        contentType: TEXT
        store: false

      - id: normalize_mime
        type: io.kestra.plugin.core.debug.Return
        description: Normalize Tika Content-Type metadata header by stripping parameters.
        format: "{{ ((outputs.parse_document.result.metadata['Content-Type'] ?? '') | string) | split(';') | first | trim }}"

      - id: check_quality
        type: io.kestra.plugin.core.flow.If
        description: Validate character count threshold and normalized MIME type.
        condition: "{{ ((outputs.parse_document.result.content ?? '') | length) < (inputs.min_chars | int) or not (['application/pdf', 'text/plain', 'text/html'] contains outputs.normalize_mime.value) }}"
        then:
          - id: alert_quality_failure
            type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
            url: "{{ secret('SLACK_WEBHOOK_URL') }}"
            payload: |
              {
                "text": "Document Quality Gate Failure Alert\nURL: {{ item.value }}\nExtracted Characters: {{ (outputs.parse_document.result.content ?? '') | length }} (Threshold: {{ inputs.min_chars }})\nDetected MIME: {{ outputs.normalize_mime.value }}\nStatus: FAILED quality gate inspection (character threshold or MIME boundary violation)."
              }
        else:
          - id: log_quality_pass
            type: io.kestra.plugin.core.log.Log
            message: "PASS: Document {{ item.value }} passed quality audit ({{ (outputs.parse_document.result.content ?? '') | length }} chars, MIME: {{ outputs.normalize_mime.value }})."

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "Document Quality Pipeline Execution Error\nFlow tika-document-quality-gate encountered an uncaught exception during execution. Please inspect run logs."
      }

extend:
  title: Document Ingestion Quality Gate with Apache Tika and Slack Alerts
  shortDescription: Audit web documents with Apache Tika, enforce character count and MIME quality gates, and fire Slack alerts on failure.
  metaTitle: Document Quality Gate with Tika and Slack in Kestra
  metaDescription: Automatically extract text with Apache Tika, validate MIME type and character thresholds, and send Slack alerts for failing documents.
  description: |
    Automate pre-ingestion document quality validation before downstream vector embedding or LLM pipelines. This blueprint streams documents from web URLs into internal storage, extracts text and metadata via embedded Apache Tika, normalizes Content-Type headers, and applies quality gates for character length and MIME type. When a document fails validation, an alert is posted to Slack.

    ## How it works
    1. `weekly_schedule` (`io.kestra.plugin.core.trigger.Schedule`) triggers weekly execution (`disabled: true`).
    2. `process_documents` (`io.kestra.plugin.core.flow.Loop`) loops over target document URLs.
    3. `download_document` (`io.kestra.plugin.core.http.Download`) streams each document into internal storage.
    4. `parse_document` (`io.kestra.plugin.tika.Parse`) extracts text and metadata inline with `contentType: TEXT`.
    5. `normalize_mime` (`io.kestra.plugin.core.debug.Return`) strips parameters from Tika's Content-Type metadata header.
    6. `check_quality` (`io.kestra.plugin.core.flow.If`) evaluates character length against `inputs.min_chars` and checks MIME against allowed types (`application/pdf`, `text/plain`, `text/html`).
    7. Failing documents trigger `alert_quality_failure` (`SlackIncomingWebhook`), while passing files emit `log_quality_pass`.

    ## What you get
    - Pre-ingestion validation preventing empty or corrupt files from entering vector stores.
    - Embedded Tika parsing for PDFs, HTML, and plain text with zero extra containers.
    - Automated Slack incident notifications detailing URL, character count, and MIME type.

    ## Who it's for
    - Data engineers building RAG or LLM document ingestion pipelines.
    - Content operations teams auditing document publishing pipelines.

    ## Why orchestrate this with Kestra
    Manual document scripts lack state management and retry resilience. Kestra orchestrates fetch, parse, normalization, and conditional branching declaratively with full execution logging and secret management.

    ## Prerequisites
    - Outbound HTTP access to document source URLs.
    - Slack Incoming Webhook URL configured as a secret.

    ### Secrets
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL. Open-source deployments configure `SECRET_SLACK_WEBHOOK_URL` in environment variables.

    ## Quick start
    1. Add `SLACK_WEBHOOK_URL` secret to your Kestra namespace.
    2. Run flow with default inputs to process sample documents.
    3. Inspect execution logs and verify Slack alert for `dummy.pdf`.

    ## Inputs
    - `document_urls` (ARRAY of STRING): List of target document URLs. Default: the Hugging Face app_store.pdf, RFC 2324 text, Python license HTML, and the W3C dummy.pdf (deliberate failing case).
    - `min_chars` (SELECT): Minimum character threshold (`500`, `1000`, `5000`; default `"1000"`).

    ## Outputs
    - `download_document.uri`: Internal storage URI at `{{ outputs.download_document.uri }}`.
    - `parse_document.result.content`: Extracted string inline text at `{{ outputs.parse_document.result.content }}`.
    - `normalize_mime.value`: Cleaned MIME string at `{{ outputs.normalize_mime.value }}`.

    ## Pitfalls
    - A network failure or HTTP 404 on `download_document` aborts the flow and invokes the `errors` block.
    - MIME validation uses Tika parser metadata rather than raw HTTP server response headers.
    - Scanned PDFs without an OCR text layer fail the character threshold (OCR is disabled).

    ## How to extend
    - Route passing documents to vector database embedding tasks or S3 storage.
    - Add custom MIME types to the allowed list in `check_quality`.

    ## Links
    - Apache Tika plugin docs: https://kestra.io/plugins/plugin-tika
    - Slack plugin docs: https://kestra.io/plugins/plugin-slack
  tags:
    - Core
    - Data
  subTags:
    - File & Data Processing Basics
    - Monitoring & Alerting
  ee: false
  demo: false
