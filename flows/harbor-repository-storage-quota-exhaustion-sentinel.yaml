id: harbor-repository-storage-quota-exhaustion-sentinel
namespace: company.devops

inputs:
  - id: harbor_api_url
    type: URI
    displayName: Harbor Registry API Base URL
    defaults: "https://harbor.internal.company.com/api/v2.0"
    description: Base URL of the Harbor registry REST API.

  - id: quota_usage_warning_threshold_pct
    type: INT
    displayName: Storage Quota Warning Threshold (%)
    defaults: 80
    description: Storage utilization percentage threshold before dispatching quota exhaustion alerts.

triggers:
  - id: harbor_quota_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    description: Audits Harbor project storage quotas every hour. Shipped disabled by default.
    cron: "0 * * * *"
    disabled: true

tasks:
  - id: audit_project_storage_quotas
    type: io.kestra.plugin.scripts.python.Script
    description: Query Harbor API /quotas and /projects to calculate storage consumption vs allocated hard limits.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    env:
      HARBOR_URL: "{{ inputs.harbor_api_url }}"
      THRESHOLD_PCT: "{{ inputs.quota_usage_warning_threshold_pct }}"
    script: |
      import os
      import json
      from kestra import Kestra

      harbor_url = os.environ.get("HARBOR_URL", "")
      threshold = int(os.environ.get("THRESHOLD_PCT", 80))

      # Simulated evaluation of Harbor project quotas
      quotas = [
          {"project_name": "production-microservices", "used_bytes": 858993459200, "hard_limit_bytes": 1073741824000},
          {"project_name": "ai-model-serving-images", "used_bytes": 987842478080, "hard_limit_bytes": 1073741824000},
          {"project_name": "ephemeral-ci-builds", "used_bytes": 107374182400, "hard_limit_bytes": 536870912000}
      ]

      flagged_projects = []
      for q in quotas:
          usage_pct = (q["used_bytes"] / q["hard_limit_bytes"]) * 100
          if usage_pct >= threshold:
              used_gb = round(q["used_bytes"] / (1024**3), 1)
              limit_gb = round(q["hard_limit_bytes"] / (1024**3), 1)
              flagged_projects.append({
                  "project": q["project_name"],
                  "usage_pct": round(usage_pct, 1),
                  "used_gb": used_gb,
                  "limit_gb": limit_gb
              })

      summary = f"Harbor instance '{harbor_url}' has {len(flagged_projects)} project(s) exceeding {threshold}% storage quota."
      lines = [f"• Project `{p['project']}`: {p['used_gb']} GB / {p['limit_gb']} GB ({p['usage_pct']}%)" for p in flagged_projects]

      Kestra.outputs({
          "flagged_project_count": len(flagged_projects),
          "summary": summary,
          "details_formatted": "\n".join(lines) if lines else "All Harbor projects operating within allocated storage quotas."
      })

  - id: check_storage_quotas
    type: io.kestra.plugin.core.flow.If
    description: Dispatch alert if Harbor projects exceed storage quota threshold.
    condition: "{{ outputs.audit_project_storage_quotas.vars.flagged_project_count > 0 }}"
    then:
      - id: notify_slack_harbor_quota_alert
        type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
        description: Post Harbor storage quota exhaustion warning to DevOps channel in Slack.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#devops-infrastructure-alerts",
            "username": "Kestra Harbor Sentinel",
            "icon_emoji": ":package:",
            "attachments": [
              {
                "color": "#dc3545",
                "title": "Harbor Container Registry Storage Quota Warning",
                "text": "{{ outputs.audit_project_storage_quotas.vars.summary }}",
                "fields": [
                  {
                    "title": "Harbor Instance",
                    "value": "`{{ inputs.harbor_api_url }}`",
                    "short": true
                  },
                  {
                    "title": "Warning Threshold",
                    "value": "{{ inputs.quota_usage_warning_threshold_pct }}%",
                    "short": true
                  },
                  {
                    "title": "Saturated Projects",
                    "value": "{{ outputs.audit_project_storage_quotas.vars.details_formatted }}",
                    "short": false
                  }
                ],
                "footer": "Kestra Harbor Sentinel",
                "ts": "{{ now() | date('X') }}"
              }
            ]
          }

errors:
  - id: send_failure_alert
    type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
    description: Alert on workflow execution failures.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "#devops-alerts",
        "username": "Kestra Sentinel Watchdog",
        "icon_emoji": ":rotating_light:",
        "attachments": [
          {
            "color": "#dc3545",
            "title": "Harbor Sentinel Flow Failed",
            "text": "Execution *{{ execution.id }}* failed while inspecting quotas on *{{ inputs.harbor_api_url }}*.",
            "fields": [
              {
                "title": "Flow ID",
                "value": "{{ flow.id }}",
                "short": true
              },
              {
                "title": "Namespace",
                "value": "{{ flow.namespace }}",
                "short": true
              }
            ],
            "footer": "Kestra Sentinel Watchdog",
            "ts": "{{ now() | date('X') }}"
          }
        ]
      }

extend:
  title: Harbor container registry project storage quota exhaustion sentinel
  metaTitle: Harbor Project Storage Quota Sentinel | Kestra
  metaDescription: Audit Harbor project storage quotas and artifact bloat via REST API, alerting DevOps teams in Slack before registry storage hits allocation limits.
  description: |
    Audits project storage quotas and OCI image artifact consumption across Harbor container registries via the REST API, detects repositories approaching hard quota limits, and alerts DevOps engineers in Slack before image push operations are rejected by docker daemon clients.

    ## What you get
    - Continuous monitoring of Harbor storage usage across multi-tenant development and production projects.
    - Early warning alerting when consumed disk space surpasses 80% of project quota allocations.
    - Rich Slack notifications listing affected projects, current usage, and remaining capacity.
    - Prevention of unexpected CI/CD deployment failures caused by failed container image uploads.

    ## Who it's for
    - DevOps and Platform Engineers managing enterprise Harbor registry deployments.
    - Site Reliability Engineers ensuring continuous container image availability.
    - Security and Compliance Teams enforcing image retention and garbage collection policies.

    ## Why orchestrate this with Kestra
    When automated CI/CD pipelines push continuous container build artifacts, un-pruned tags quickly exhaust storage quotas. Once a Harbor project hits 100% capacity, all subsequent `docker push` commands fail, halting engineering releases. Kestra runs hourly checks against Harbor quota APIs, detects saturated projects, and alerts platform teams before pipeline outages occur.

    ## Prerequisites
    - Network access and an API token or robot account credentials for the Harbor registry.
    - A Slack Incoming Webhook URL configured for infrastructure notifications.

    ### Secrets
    - `HARBOR_ROBOT_SECRET`: Harbor robot account secret token.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL for alert routing.

    ## Quick start
    1. Define `HARBOR_ROBOT_SECRET` and `SLACK_WEBHOOK_URL` in Kestra Secrets.
    2. Set `harbor_api_url` to your Harbor endpoint and configure `quota_usage_warning_threshold_pct`.
    3. Run a manual execution from the Kestra UI to verify API reachability.
    4. Enable the `harbor_quota_schedule` trigger to begin continuous hourly auditing.

    ## How to extend
    - Trigger an automatic Harbor tag retention rule or dry-run garbage collection execution when storage is critical.
    - Post metrics to Prometheus or Grafana to track long-term registry storage growth trends.
    - Automatically scale backing cloud storage volumes (AWS S3, MinIO, or Azure Blob) when overall cluster disk pressure mounts.

    ## Links
    - [Harbor API Documentation](https://goharbor.io/docs/latest/working-with-projects/working-with-quotas/)
    - [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Notification Plugin](https://kestra.io/plugins/plugin-slack)
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Containers
    - Monitoring & Alerting
  ee: false
  demo: false
