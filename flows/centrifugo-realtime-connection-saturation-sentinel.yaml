id: centrifugo-realtime-connection-saturation-sentinel
namespace: company.team

description: |
  Call Centrifugo's own server API on a schedule, sum the connected
  client count across every node in the cluster, classify the
  deployment as HEALTHY, AT_RISK, CRITICAL, or UNREACHABLE against two
  capacity thresholds, log clean checks, and alert Slack the moment
  real-time connections approach or exceed the capacity you have
  planned for.

inputs:
  - id: centrifugo_url
    type: STRING
    defaults: "http://localhost:8000"
    displayName: "Centrifugo Base URL"
    description: "Base URL of the Centrifugo server API, no trailing slash."
  - id: max_clients_capacity
    type: INT
    defaults: 10000
    displayName: "Max Clients Capacity"
    description: "Total connected clients across every node at or above this number is classified CRITICAL."
  - id: warning_ratio
    type: FLOAT
    defaults: 0.8
    displayName: "Warning Ratio"
    description: "Total connected clients at or above this fraction of max_clients_capacity is classified AT_RISK."

triggers:
  - id: connection_saturation_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    description: "Check cluster-wide connection counts every 5 minutes."
    cron: "*/5 * * * *"
    disabled: true
    inputs:
      centrifugo_url: "http://localhost:8000"
      max_clients_capacity: 10000
      warning_ratio: 0.8

tasks:
  - id: check_centrifugo_info
    type: io.kestra.plugin.core.http.Request
    description: "Call Centrifugo's server API info method to get every node's connected client, channel, and user counts."
    uri: "{{ inputs.centrifugo_url }}/api/info"
    method: POST
    contentType: application/json
    headers:
      X-API-Key: "{{ secret('CENTRIFUGO_API_KEY') }}"
    body: "{}"
    allowFailure: true

  - id: classify_connection_saturation
    type: io.kestra.plugin.core.debug.Return
    description: "Classify UNREACHABLE when the info call failed, CRITICAL when total connected clients across every node are at or above max_clients_capacity, AT_RISK when at or above warning_ratio of that capacity, otherwise HEALTHY."
    format: "{{ outputs.check_centrifugo_info.body is defined ? (((outputs.check_centrifugo_info.body | jq('[.result.nodes[].num_clients] | add // 0') | first | default(0)) >= inputs.max_clients_capacity) ? 'CRITICAL' : (((outputs.check_centrifugo_info.body | jq('[.result.nodes[].num_clients] | add // 0') | first | default(0)) >= (inputs.max_clients_capacity * inputs.warning_ratio)) ? 'AT_RISK' : 'HEALTHY')) : 'UNREACHABLE' }}"

  - id: route_by_saturation
    type: io.kestra.plugin.core.flow.Switch
    description: "Log a quiet confirmation when connections are well within capacity, page Slack when they approach or exceed it, or page Slack when Centrifugo could not be reached."
    value: "{{ outputs.classify_connection_saturation.value }}"
    cases:
      "HEALTHY":
        - id: log_healthy
          type: io.kestra.plugin.core.log.Log
          message: "Centrifugo cluster is healthy: {{ outputs.check_centrifugo_info.body | jq('[.result.nodes[].num_clients] | add // 0') | first }} total client(s) across {{ outputs.check_centrifugo_info.body | jq('.result.nodes | length') | first }} node(s), below {{ inputs.warning_ratio }} of capacity {{ inputs.max_clients_capacity }}."
      "AT_RISK":
        - id: alert_at_risk
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "text": "Centrifugo sentinel AT_RISK: {{ outputs.check_centrifugo_info.body | jq('[.result.nodes[].num_clients] | add // 0') | first }} total client(s) across {{ outputs.check_centrifugo_info.body | jq('.result.nodes | length') | first }} node(s), at or above {{ inputs.warning_ratio }} of capacity {{ inputs.max_clients_capacity }}. Execution {{ execution.id }}."
            }
      "CRITICAL":
        - id: alert_critical
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "text": "Centrifugo sentinel CRITICAL: {{ outputs.check_centrifugo_info.body | jq('[.result.nodes[].num_clients] | add // 0') | first }} total client(s) across {{ outputs.check_centrifugo_info.body | jq('.result.nodes | length') | first }} node(s), at or above planned capacity {{ inputs.max_clients_capacity }}. New connections may start being rejected. Execution {{ execution.id }}."
            }
      "UNREACHABLE":
        - id: alert_unreachable
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "text": "Centrifugo sentinel UNREACHABLE: the server API info call failed (invalid API key, or Centrifugo is down). Execution {{ execution.id }}."
            }
    defaults:
      - id: log_unclassified
        type: io.kestra.plugin.core.log.Log
        message: "Completed Centrifugo connection saturation check with status: {{ outputs.classify_connection_saturation.value }}"

  - id: log_audit_status
    type: io.kestra.plugin.core.log.Log
    description: "Post-check status line recorded on every run regardless of branch, for a continuous connection-saturation trend in the execution history."
    message: "Centrifugo audit: capacity={{ inputs.max_clients_capacity }}, warningRatio={{ inputs.warning_ratio }}, status={{ outputs.classify_connection_saturation.value }}, execution={{ execution.id }}."

errors:
  - id: alert_flow_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: "Alert Slack when the sentinel flow itself fails, so a broken check never silently stops monitoring connection capacity."
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "Centrifugo realtime connection saturation sentinel flow {{ flow.id }} FAILED (execution {{ execution.id }}). Connection capacity status is now unknown; check the task logs and the Centrifugo admin panel manually."
      }

outputs:
  - id: status
    type: STRING
    value: "{{ outputs.classify_connection_saturation.value }}"

extend:
  title: "Centrifugo Realtime Connection Saturation Sentinel"
  metaTitle: Centrifugo Realtime Connection Saturation Sentinel for Kestra
  shortDescription: Poll Centrifugo's own server API on a schedule, sum connected clients across every node, and alert Slack before real-time connection capacity is exhausted.
  metaDescription: Monitor Centrifugo realtime connection counts and alert Slack when capacity is approaching or exceeded.
  description: |
    A Centrifugo node silently approaching its planned connection capacity does not raise an error until clients start getting rejected or the node falls over under load. This blueprint calls Centrifugo's own server API on a schedule, sums connected clients across every node in the cluster, and pages Slack the moment that total approaches or exceeds the capacity you planned for, or the server cannot be reached at all.

    ## How it works

    1. `check_centrifugo_info` (`io.kestra.plugin.core.http.Request`) calls `POST /api/info` with an empty JSON body and the `X-API-Key` header, returning `result.nodes`, an array with one entry per node carrying `num_clients`, `num_channels`, and `num_users`. `allowFailure: true` lets the flow continue into classification instead of aborting on a bad key or an unreachable server.
    2. `classify_connection_saturation` (`io.kestra.plugin.core.debug.Return`) checks whether the response body is defined; if not, `UNREACHABLE`. Otherwise it sums `num_clients` across every node with `jq` and compares that total against `max_clients_capacity` and `max_clients_capacity * warning_ratio`, returning `CRITICAL`, `AT_RISK`, or `HEALTHY`.
    3. `route_by_saturation` (`io.kestra.plugin.core.flow.Switch`) branches on that string: `HEALTHY` logs a quiet confirmation with the current totals, `AT_RISK` and `CRITICAL` each page Slack with the exact client and node counts, `UNREACHABLE` pages Slack separately, and `defaults` logs the raw outcome.
    4. `log_audit_status` records a status line on every run regardless of branch, so the execution history is a continuous connection-saturation trend.
    5. The `errors` block pages Slack separately if the flow itself fails outright.
    6. The `connection_saturation_schedule` trigger polls every 5 minutes with explicit input overrides, shipped `disabled: true` until you point it at a real Centrifugo deployment.

    ## What you get

    - A scheduled, cluster-wide real-time connection capacity check with zero custom Centrifugo client code.
    - A four-way `status` output (`HEALTHY` / `AT_RISK` / `CRITICAL` / `UNREACHABLE`) you can chart or gate other flows on.
    - A Slack page with the exact connected-client total and node count behind an AT_RISK or CRITICAL classification.
    - A separate failure channel for the sentinel flow itself, plus a standing audit log line per run.

    ## Who it's for

    - Platform teams running self-hosted Centrifugo for chat, live notifications, or collaborative features who need to know about connection growth before it becomes an outage.
    - SRE and on-call teams who want capacity-based paging instead of discovering saturation only after clients start disconnecting.

    ## Why orchestrate this with Kestra

    A metrics dashboard tells you the current number but pages no one. This flow keeps every info call and every saturation classification in the execution history, turns the check into a typed output other flows can depend on, and gives you a Switch branch to grow into real remediation (triggering autoscaling for a new node, disconnecting idle clients via the admin API) without rewriting the check itself.

    ## Prerequisites

    - A Centrifugo instance reachable at `centrifugo_url` with the server API enabled. The free, official Docker image (`centrifugo/centrifugo`) run with an `api_key` configured is enough to fully test this blueprint locally.
    - The configured API key for the server API.
    - A Slack incoming webhook for the AT_RISK, CRITICAL, and unreachable alerts.

    ### Secrets

    - `CENTRIFUGO_API_KEY`: Centrifugo server API key, sent as the `X-API-Key` header.
    - `SLACK_WEBHOOK_URL`: Slack incoming webhook used for the AT_RISK alert, the CRITICAL alert, the unreachable alert, and the flow-failure alert.
    - OSS note: if your Kestra instance reads secrets from environment variables instead of a secrets backend, set `SECRET_CENTRIFUGO_API_KEY` and `SECRET_SLACK_WEBHOOK_URL` as base64, for example `echo -n "<your-value>" | base64`.

    ## Quick start

    1. Add the `CENTRIFUGO_API_KEY` and `SLACK_WEBHOOK_URL` secrets.
    2. Set `centrifugo_url` and tune `max_clients_capacity`/`warning_ratio` to your deployment's planned capacity.
    3. Connect a few test clients, run the flow once, and confirm `status` reads `HEALTHY`.
    4. Enable `connection_saturation_schedule`.

    ## How to extend

    - Call the `channels` server API method as a follow-up task to also surface the single largest channel by subscriber count in the Slack alert.
    - Classify per node instead of cluster-wide, by iterating `result.nodes` with a `Loop` task and alerting on the specific node closest to capacity.
    - Store each run's total in a KV store to build a longer connection-growth trend than the execution history alone provides.

    ## Links

    - [Centrifugo server API reference](https://centrifugal.dev/docs/server/server_api)
    - [Centrifugo self-hosting with Docker](https://centrifugal.dev/docs/getting-started/installation)
    - [Kestra Switch task](https://kestra.io/plugins/core/tasks/flow/io.kestra.plugin.core.flow.switch)
  tags:
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - Day 2 Operations
  ee: false
  demo: false
