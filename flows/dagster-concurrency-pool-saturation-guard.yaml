id: dagster-concurrency-pool-saturation-guard
namespace: company.dataengineering

description: >-
  Audit Dagster instance concurrency limits and slot utilization via GraphQL, detect queue
  bottlenecks, and dynamically adjust pool limits with safe dry-run controls.

inputs:
  - id: dagster_graphql_url
    type: URI
    displayName: Dagster GraphQL Endpoint
    defaults: "http://dagster-webserver:3000/graphql"
    description: URL of the Dagster GraphQL webserver endpoint.

  - id: saturation_threshold_pct
    type: INT
    displayName: Saturation Threshold (%)
    defaults: 85
    description: Concurrency slot utilization percentage threshold above which a pool is flagged as saturated.

  - id: auto_scale_limit
    type: SELECT
    displayName: Auto Scale Limit
    defaults: "false"
    values:
      - "false"
      - "true"
    description: If true and dry-run is false, automatically adjust saturated concurrency pool limits.

  - id: headroom_boost_slots
    type: INT
    displayName: Headroom Boost Slots
    defaults: 2
    description: Number of slots to add to a saturated pool's limit when auto-scaling is armed.

  - id: dry_run
    type: SELECT
    displayName: Dry Run
    defaults: "true"
    values:
      - "true"
      - "false"
    description: When true, report saturated pools without modifying concurrency limits.

triggers:
  - id: concurrency_pool_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    description: Audits Dagster concurrency pool limits every 15 minutes. Shipped disabled by default.
    cron: "*/15 * * * *"
    disabled: true

tasks:
  - id: query_concurrency_limits
    type: io.kestra.plugin.core.http.Request
    description: Query Dagster GraphQL API for all configured concurrency keys, limits, and active slots.
    uri: "{{ inputs.dagster_graphql_url }}"
    method: POST
    contentType: application/json
    headers:
      Content-Type: application/json
      Authorization: "Bearer {{ secret('DAGSTER_TOKEN') }}"
    body: |
      {
        "query": "query ConcurrencyLimitsQuery { instance { concurrencyLimits { concurrencyKey limit activeSlotCount activeRunIds } } }"
      }

  - id: evaluate_pool_saturation
    type: io.kestra.plugin.scripts.python.Script
    description: Compute utilization percentage for each concurrency pool and flag saturated keys.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    env:
      RESPONSE_BODY: "{{ outputs.query_concurrency_limits.body }}"
      THRESHOLD_PCT: "{{ inputs.saturation_threshold_pct }}"
      BOOST_SLOTS: "{{ inputs.headroom_boost_slots }}"
    script: |
      import os
      import json
      from kestra import Kestra

      raw = os.environ.get("RESPONSE_BODY", "{}")
      threshold = float(os.environ.get("THRESHOLD_PCT", 85))
      boost = int(os.environ.get("BOOST_SLOTS", 2))
      data = json.loads(raw)

      limits_data = data.get("data", {}).get("instance", {}).get("concurrencyLimits", [])

      saturated_pools = []
      healthy_pools = []

      for item in limits_data:
          key = item.get("concurrencyKey", "unknown")
          limit = item.get("limit") or 0
          active = item.get("activeSlotCount") or 0
          active_runs = item.get("activeRunIds", [])

          pct = (active / limit * 100.0) if limit > 0 else 0.0

          pool_entry = {
              "key": key,
              "limit": limit,
              "active": active,
              "utilization_pct": round(pct, 1),
              "recommended_new_limit": limit + boost,
              "active_run_count": len(active_runs)
          }

          if pct >= threshold and limit > 0:
              saturated_pools.append(pool_entry)
          else:
              healthy_pools.append(pool_entry)

      summary = f"Dagster instance has {len(saturated_pools)} concurrency pool(s) exceeding {threshold}% utilization."
      lines = [f"• Pool `{p['key']}`: {p['active']}/{p['limit']} slots ({p['utilization_pct']}%) - Active runs: {p['active_run_count']}" for p in saturated_pools]

      Kestra.outputs({
          "saturated_pool_count": len(saturated_pools),
          "saturated_pools": saturated_pools,
          "healthy_pool_count": len(healthy_pools),
          "summary": summary,
          "details_formatted": "\n".join(lines) if lines else f"All concurrency pools within {threshold}% utilization limits."
      })

  - id: route_by_saturation_level
    type: io.kestra.plugin.core.flow.Switch
    description: Branch based on whether any concurrency pools are saturated.
    value: "{{ outputs.evaluate_pool_saturation.vars.saturated_pool_count > 0 ? 'SATURATED' : 'BALANCED' }}"
    cases:
      "BALANCED":
        - id: log_pools_balanced
          type: io.kestra.plugin.core.log.Log
          message: "All Dagster concurrency pools are operating within limits (below {{ inputs.saturation_threshold_pct }}% threshold)."

      "SATURATED":
        - id: evaluate_remediation_gate
          type: io.kestra.plugin.core.flow.If
          description: Check if auto-scaling is armed and dry-run is turned off.
          condition: "{{ inputs.auto_scale_limit == 'true' and inputs.dry_run == 'false' }}"
          then:
            - id: auto_scale_saturated_pools
              type: io.kestra.plugin.core.flow.ForEach
              description: Adjust concurrency limit for each saturated pool.
              values: "{{ outputs.evaluate_pool_saturation.vars.saturated_pools }}"
              tasks:
                - id: set_new_concurrency_limit
                  type: io.kestra.plugin.core.http.Request
                  description: Execute GraphQL mutation to increase concurrency limit.
                  uri: "{{ inputs.dagster_graphql_url }}"
                  method: POST
                  contentType: application/json
                  headers:
                    Content-Type: application/json
                    Authorization: "Bearer {{ secret('DAGSTER_TOKEN') }}"
                  body: |
                    {
                      "query": "mutation UpdateConcurrencyLimit($concurrencyKey: String!, $limit: Int!) { setConcurrencyLimit(concurrencyKey: $concurrencyKey, limit: $limit) }",
                      "variables": {
                        "concurrencyKey": "{{ taskrun.value.key }}",
                        "limit": "{{ taskrun.value.recommended_new_limit }}"
                      }
                    }

                - id: log_scaled_pool
                  type: io.kestra.plugin.core.log.Log
                  message: "Auto-scaled concurrency pool '{{ taskrun.value.key }}' from {{ taskrun.value.limit }} to {{ taskrun.value.recommended_new_limit }} slots."

            - id: verify_scaled_limits
              type: io.kestra.plugin.core.http.Request
              description: Re-query concurrency limits to confirm updated capacity.
              uri: "{{ inputs.dagster_graphql_url }}"
              method: POST
              contentType: application/json
              headers:
                Content-Type: application/json
                Authorization: "Bearer {{ secret('DAGSTER_TOKEN') }}"
              body: |
                {
                  "query": "query VerifyConcurrencyLimits { instance { concurrencyLimits { concurrencyKey limit activeSlotCount } } }"
                }
          else:
            - id: notify_slack_saturation_alert
              type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
              description: Dispatch advisory notification to Slack when pools are saturated in dry-run mode.
              url: "{{ secret('SLACK_WEBHOOK_URL') }}"
              payload: |
                {
                  "channel": "#data-platform-alerts",
                  "username": "Kestra Concurrency Sentinel",
                  "icon_emoji": ":gauge:",
                  "attachments": [
                    {
                      "color": "#e0a800",
                      "title": "Dagster Concurrency Pool Saturation Warning",
                      "text": "{{ outputs.evaluate_pool_saturation.vars.summary }}\n\n{{ outputs.evaluate_pool_saturation.vars.details_formatted }}",
                      "fields": [
                        {
                          "title": "Threshold",
                          "value": "{{ inputs.saturation_threshold_pct }}%",
                          "short": true
                        },
                        {
                          "title": "Auto Scale Armed",
                          "value": "{{ inputs.auto_scale_limit == 'true' and inputs.dry_run == 'false' }}",
                          "short": true
                        }
                      ],
                      "footer": "Kestra Orchestrator",
                      "ts": "{{ now() | date('X') }}"
                    }
                  ]
                }

errors:
  - id: alert_on_flow_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alert when the concurrency pool monitoring flow itself fails.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "#data-platform-alerts",
        "username": "Kestra Orchestrator Alert",
        "icon_emoji": ":rotating_light:",
        "text": "Execution *{{ execution.id }}* of *{{ flow.id }}* failed while checking Dagster concurrency pool limits."
      }

outputs:
  - id: saturated_pool_count
    type: INT
    value: "{{ outputs.evaluate_pool_saturation.vars.saturated_pool_count }}"
  - id: summary
    type: STRING
    value: "{{ outputs.evaluate_pool_saturation.vars.summary }}"

extend:
  title: Dagster Concurrency Pool Saturation Guard
  metaTitle: Dagster Concurrency Pool Saturation Guard | Kestra
  shortDescription: Audit Dagster concurrency pool limits via GraphQL and auto-scale saturated pools.
  metaDescription: Audit Dagster concurrency pool saturation via GraphQL, detect queue bottlenecks, and auto-scale limits with safe dry-run controls.
  description: |
    Audits active slot utilization across Dagster instance concurrency pools via the Dagster GraphQL API. When jobs contend for shared resources—such as data warehouse query slots, third-party API rate limits, or heavy compute partitions—pools reach capacity, causing dependent runs to queue up and breach execution SLAs. This blueprint identifies saturated pools, calculates utilization ratios, and provides automated headroom expansion with dry-run protection.

    ## How it works
    1. Sends a `ConcurrencyLimitsQuery` to Dagster's GraphQL API to inspect all configured concurrency keys, limits, and active slots.
    2. Runs an isolated Python task runner to compute slot utilization percentages and identify pools exceeding `saturation_threshold_pct`.
    3. Branches execution using `io.kestra.plugin.core.flow.Switch`: balanced pools log status and terminate cleanly.
    4. Evaluates `auto_scale_limit` and `dry_run` safety gates when saturated pools are detected.
    5. Dynamically expands pool capacity using the `setConcurrencyLimit` GraphQL mutation via `io.kestra.plugin.core.flow.ForEach`.
    6. Re-queries the instance to verify new limits, or dispatches Slack alerts if running in dry-run mode.

    ## What you get
    - Elimination of silent run queue bottlenecks caused by saturated concurrency keys.
    - Automated visibility into active slot counts and in-flight run IDs per resource pool.
    - Two-phase execution control: advisory monitoring vs. autonomous headroom scaling.
    - Protection against warehouse connection exhaustion and API quota overages.

    ## Who it's for
    - Data Platform Engineers managing shared Dagster instance compute resources.
    - Analytics Engineers scheduling high-concurrency warehouse transformation jobs.
    - SREs maintaining infrastructure throughput and queue health.

    ## Why orchestrate this with Kestra
    While Dagster enforces concurrency limits to protect downstream systems, static limits frequently cause queue pileups during peak processing windows. Kestra provides adaptive external governance: continuously evaluating resource pressure, auto-scaling pool limits during spikes, and coordinating inbound traffic to prevent system-wide lockups.

    ## Prerequisites
    - Dagster GraphQL webserver reachable over HTTP/HTTPS.
    - A configured Slack incoming webhook for notification delivery.

    ### Secrets
    - `DAGSTER_TOKEN`: Dagster webserver authentication token.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL.

    ## Quick start
    1. Define `DAGSTER_TOKEN` and `SLACK_WEBHOOK_URL` in Kestra Secrets.
    2. Set `saturation_threshold_pct` (default: 85%) and `headroom_boost_slots` (default: 2).
    3. Run a manual execution with `dry_run: true` to view current pool utilization.
    4. Configure `auto_scale_limit: true` and `dry_run: false` to enable autonomous capacity scaling.
    5. Enable `concurrency_pool_schedule` to begin continuous 15-minute monitoring.

    ## How to extend
    - Add schedule-based limit scaling (e.g., expand limits during nightly batch windows and constrict during business hours).
    - Send pool saturation telemetry to Datadog or Prometheus for capacity planning.
    - Trigger downstream queue prioritization flows when critical pools become unblocked.

    ## Links
    - [Dagster Concurrency Limits Documentation](https://docs.dagster.io/guides/limiting-concurrency-in-data-pipelines)
    - [Dagster GraphQL API Reference](https://docs.dagster.io/deployment/apis/graphql)
    - [Kestra HTTP Request Plugin Documentation](https://kestra.io/plugins/plugin-core/io.kestra.plugin.core.http.request)
  tags:
    - Infrastructure
    - Data
  subTags:
    - Day 2 Operations
    - Infrastructure Automation
  ee: false
  demo: false
