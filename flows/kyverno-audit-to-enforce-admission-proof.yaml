id: kyverno-audit-to-enforce-admission-proof
namespace: company.platform
description: Approve a namespace-scoped Kyverno rollout and prove live admission decisions without persisting probe Pods.
labels:
  team: platform
  use-case: policy-rollout
concurrency:
  limit: 1
  behavior: QUEUE
inputs:
- id: mode
  type: SELECT
  values:
  - PREVIEW
  - ROLLOUT
  defaults: PREVIEW
- id: target_namespace
  type: STRING
  defaults: policy-rollout-demo
- id: policy_name
  type: STRING
  defaults: require-team-label
- id: notify_slack
  type: BOOL
  defaults: false
- id: kestra_url
  type: STRING
  defaults: http://localhost:8080
variables:
  client: |-
    import base64, hashlib, json, os, re, ssl, time
    from urllib.request import Request, urlopen
    from urllib.error import HTTPError, URLError

    namespace = os.environ['NAMESPACE']
    policy_name = os.environ['POLICY_NAME']
    assert re.fullmatch(r'[a-z0-9]([-a-z0-9]*[a-z0-9])?', namespace)
    assert namespace not in ('default', 'kube-system', 'kube-public', 'kyverno')
    assert re.fullmatch(r'[a-z0-9]([-a-z0-9]*[a-z0-9])?', policy_name)
    base = '/apis/policies.kyverno.io/v1/namespaces/' + namespace + '/namespacedvalidatingpolicies/' + policy_name
    marker = 'blueprints.kestra.io/rollout-id'
    message = 'kestra-team-label-required'
    context = ssl.create_default_context(cadata=base64.b64decode(os.environ['CA']).decode())

    def api(path, method='GET', data=None):
        headers = {'Authorization': 'Bearer ' + os.environ['TOKEN'], 'Content-Type': 'application/json'}
        for attempt in range(3):
            try:
                req = Request(os.environ['SERVER'].rstrip('/') + path, headers=headers,
                              method=method, data=None if data is None else json.dumps(data).encode())
                with urlopen(req, context=context, timeout=20) as response:
                    return response.status, json.load(response)
            except HTTPError as error:
                body = json.loads(error.read())
                if error.code not in (429, 500, 502, 503, 504) or attempt == 2:
                    return error.code, body
            except (URLError, TimeoutError):
                if attempt == 2:
                    raise
            time.sleep(2 ** attempt)

    def get(path):
        code, body = api(path)
        assert code == 200, f'GET {path}: {code}: {body}'
        return body

    def digest(value):
        return hashlib.sha256(json.dumps(value, sort_keys=True, separators=(',', ':')).encode()).hexdigest()

    def expected_spec(action):
        return {
            'validationActions': [action], 'failurePolicy': 'Fail',
            'evaluation': {'admission': {'enabled': True}, 'background': {'enabled': True}, 'mode': 'Kubernetes'},
            'autogen': {'podControllers': {'controllers': []}, 'validatingAdmissionPolicy': {'enabled': False}},
            'matchConstraints': {'resourceRules': [{'apiGroups': [''], 'apiVersions': ['v1'],
                                 'operations': ['CREATE'], 'resources': ['pods']}], 'matchPolicy': 'Exact'},
            'validations': [{'expression': "has(object.metadata.labels) && 'team' in object.metadata.labels && object.metadata.labels['team'] != ''",
                             'message': message}]
        }

    def snapshot():
        ns = get('/api/v1/namespaces/' + namespace)
        policy = get(base)
        assert policy.get('status', {}).get('conditionStatus', {}).get('ready'), 'Kyverno policy is not ready'
        action = policy['spec']['validationActions'][0]
        assert action in ('Audit', 'Deny') and policy['spec'] == expected_spec(action), 'Unsupported policy: use the documented template exactly'
        assert marker in policy['metadata'].get('annotations', {}), 'Policy is not opted into Kestra management'
        inventory, violations = [], []
        kinds = [('/api/v1', 'pods'), ('/apis/apps/v1', 'deployments'), ('/apis/apps/v1', 'statefulsets'),
                 ('/apis/apps/v1', 'daemonsets'), ('/apis/apps/v1', 'replicasets'),
                 ('/apis/batch/v1', 'jobs'), ('/apis/batch/v1', 'cronjobs')]
        for prefix, kind in kinds:
            page = get(f'{prefix}/namespaces/{namespace}/{kind}?limit=501')
            assert not page.get('metadata', {}).get('continue'), 'Inventory is paginated; narrow the namespace'
            for item in page['items']:
                meta = item['metadata']
                template = item if kind == 'pods' else (item['spec']['jobTemplate']['spec']['template'] if kind == 'cronjobs' else item['spec']['template'])
                labels = template.get('metadata', {}).get('labels', {})
                row = {'kind': kind, 'name': meta['name'], 'uid': meta['uid'], 'labels': labels}
                inventory.append(row)
                if not labels.get('team', '').strip():
                    violations.append(row)
        assert len(inventory) <= 500, 'Inventory exceeds 500 objects; narrow the namespace'
        inventory.sort(key=lambda row: (row['kind'], row['name']))
        plan = {'namespace_uid': ns['metadata']['uid'], 'policy_uid': policy['metadata']['uid'],
                'spec': policy['spec'], 'owner': policy['metadata']['annotations'][marker], 'inventory': inventory}
        return {'plan': plan, 'sha256': digest(plan), 'resource_version': policy['metadata']['resourceVersion'],
                'violations': violations, 'action': action}

    def save(name, value):
        with open(name, 'w') as output:
            json.dump(value, output, indent=2)
tasks:
- id: assess
  type: io.kestra.plugin.scripts.python.Script
  description: Read the exact policy and Pod/controller labels; preview never changes Kubernetes.
  script: |-
    from client import *
    from kestra import Kestra
    report = snapshot()
    save('impact.json', report)
    Kestra.outputs({'action': report['action'], 'violations': len(report['violations']), 'sha256': report['sha256']})
    print(json.dumps({'policy_action': report['action'], 'violations': report['violations'], 'plan_sha256': report['sha256']}, indent=2))
    if '{{ inputs.mode }}' == 'ROLLOUT':
        assert not report['violations'], 'Promotion blocked: repair the listed Pod and controller labels first'
  outputFiles:
  - impact.json
  containerImage: python:3.13-slim
  dependencies:
  - kestra==1.1.0
  env:
    SERVER: '{{ secret(''K8S_MASTER_URL'') }}'
    TOKEN: '{{ secret(''K8S_TOKEN'') }}'
    CA: '{{ secret(''K8S_CA_CERT'') }}'
    NAMESPACE: '{{ inputs.target_namespace }}'
    POLICY_NAME: '{{ inputs.policy_name }}'
    EXECUTION: '{{ execution.id }}'
  inputFiles:
    client.py: '{{ render(vars.client) }}'
- id: request_rollout
  type: io.kestra.plugin.core.flow.If
  condition: '{{ inputs.mode == ''ROLLOUT'' and outputs.assess.vars.action == ''Audit'' }}'
  then:
  - id: review
    type: io.kestra.plugin.core.flow.Pause
    description: Review impact.json and its fingerprint before changing admission. Expiry fails without promotion.
    pauseDuration: PT24H
    behavior: FAIL
    onResume:
    - id: approved
      type: BOOL
      defaults: false
    - id: plan_sha256
      type: STRING
      defaults: ''
      description: Copy the SHA-256 from impact.json to bind approval to this plan.
    - id: note
      type: STRING
      defaults: ''
  - id: approved
    type: io.kestra.plugin.core.flow.If
    condition: '{{ outputs.review.onResume.approved }}'
    then:
    - id: recheck
      type: io.kestra.plugin.scripts.python.Script
      description: Reject stale approval and prepare a compare-and-swap patch for only the reviewed policy.
      script: |-
        from client import *
        from kestra import Kestra
        previous = json.load(open('impact.json'))
        current = snapshot()
        assert open('approval.txt').read() == previous['sha256'], 'Wrong approval fingerprint'
        assert current['sha256'] == previous['sha256'], 'Policy or workload inventory changed; run a fresh preview'
        assert not current['violations'], 'New violations block promotion'
        patch = [{'op':'test','path':'/metadata/uid','value':current['plan']['policy_uid']},
                 {'op':'test','path':'/metadata/resourceVersion','value':current['resource_version']},
                 {'op':'test','path':'/spec/validationActions','value':['Audit']},
                 {'op':'replace','path':'/spec/validationActions','value':['Deny']},
                 {'op':'replace','path':'/metadata/annotations/blueprints.kestra.io~1rollout-id','value':os.environ['EXECUTION']}]
        Kestra.outputs({'patch': json.dumps(patch)})
      containerImage: python:3.13-slim
      dependencies:
      - kestra==1.1.0
      env:
        SERVER: '{{ secret(''K8S_MASTER_URL'') }}'
        TOKEN: '{{ secret(''K8S_TOKEN'') }}'
        CA: '{{ secret(''K8S_CA_CERT'') }}'
        NAMESPACE: '{{ inputs.target_namespace }}'
        POLICY_NAME: '{{ inputs.policy_name }}'
        EXECUTION: '{{ execution.id }}'
      inputFiles:
        client.py: '{{ render(vars.client) }}'
        impact.json: '{{ outputs.assess.outputFiles[''impact.json''] }}'
        approval.txt: '{{ outputs.review.onResume.plan_sha256 }}'
    - id: promote
      type: io.kestra.plugin.kubernetes.kubectl.Patch
      description: Atomically change Audit to Deny, only if the reviewed policy revision still matches.
      patch: '{{ outputs.recheck.vars.patch }}'
      connection:
        masterUrl: '{{ secret(''K8S_MASTER_URL'') }}'
        oauthToken: '{{ secret(''K8S_TOKEN'') }}'
        caCertData: '{{ secret(''K8S_CA_CERT'') }}'
      namespace: '{{ inputs.target_namespace }}'
      resourceType: namespacedvalidatingpolicies
      resourceName: '{{ inputs.policy_name }}'
      apiGroup: policies.kyverno.io
      apiVersion: v1
      patchStrategy: JSON_PATCH
      retry:
        type: constant
        interval: PT2S
        maxAttempts: 2
- id: verify_rollout
  type: io.kestra.plugin.core.flow.If
  condition: '{{ inputs.mode == ''ROLLOUT'' and (outputs.assess.vars.action == ''Deny'' or (outputs.review.onResume.approved
    ?? false)) }}'
  then:
  - id: prove_admission
    type: io.kestra.plugin.scripts.python.Script
    description: Exercise the live API server with valid and invalid server-side dry-run Pod creates; require the intended
      denial.
    script: |-
      from client import *
      from kestra import Kestra
      initial = json.load(open('impact.json'))
      proof = {'outcome':'FAILED', 'execution': os.environ['EXECUTION'], 'namespace': namespace, 'policy': policy_name, 'attempts': []}
      try:
          for attempt in range(12):
              policy = get(base)
              assert policy['metadata']['uid'] == initial['plan']['policy_uid'], 'Policy was replaced after assessment'
              assert policy['spec'] == expected_spec('Deny'), 'Policy no longer matches the enforced plan'
              decisions = {}
              for case in ('valid', 'invalid'):
                  labels = {'team':'platform'} if case == 'valid' else {}
                  pod = {'apiVersion':'v1','kind':'Pod','metadata':{'generateName':'kestra-proof-','labels':labels},
                         'spec':{'restartPolicy':'Never','containers':[{'name':'probe','image':'registry.k8s.io/pause:3.10'}]}}
                  code, body = api('/api/v1/namespaces/' + namespace + '/pods?dryRun=All', 'POST', pod)
                  response = {key:body[key] for key in ('kind','status','reason','message','code') if key in body}
                  decisions[case] = {'code':code, 'response':response, 'labels':labels,
                                     'name':body.get('metadata', {}).get('name'), 'dry_run':'All'}
              proof['attempts'].append(decisions)
              denied = decisions['invalid']
              denial = denied['response'].get('message', '')
              success = (decisions['valid']['code'] == 201 and denied['code'] in (400, 403)
                         and policy_name in denial and message in denial and 'kyverno' in denial.lower())
              if success:
                  proof.update({'policy_uid':policy['metadata']['uid'], 'spec_sha256':digest(policy['spec'])})
                  break
              assert decisions['valid']['code'] == 201, 'Valid probe failed: API/RBAC/other policy errors are not proof'
              assert denied['code'] == 201, 'Unexpected denial or API error: not the intended policy decision'
              time.sleep(2)
          assert success, 'Admission proof failed: expected valid=201 and an identified Kyverno denial (400/403)'
          final = get(base)
          assert final['metadata']['uid'] == policy['metadata']['uid'] and final['spec'] == policy['spec'], 'Policy changed during verification'
          proof['outcome'] = 'ENFORCED'
          Kestra.outputs({'outcome':'ENFORCED'})
      finally:
          save('admission-proof.json', proof)
          print(json.dumps(proof, indent=2))
    outputFiles:
    - admission-proof.json
    containerImage: python:3.13-slim
    dependencies:
    - kestra==1.1.0
    env:
      SERVER: '{{ secret(''K8S_MASTER_URL'') }}'
      TOKEN: '{{ secret(''K8S_TOKEN'') }}'
      CA: '{{ secret(''K8S_CA_CERT'') }}'
      NAMESPACE: '{{ inputs.target_namespace }}'
      POLICY_NAME: '{{ inputs.policy_name }}'
      EXECUTION: '{{ execution.id }}'
    inputFiles:
      client.py: '{{ render(vars.client) }}'
      impact.json: '{{ outputs.assess.outputFiles[''impact.json''] }}'
- id: summary
  type: io.kestra.plugin.scripts.python.Script
  description: Publish whether this run previewed, rejected, or verified enforcement.
  script: |-
    import json
    from kestra import Kestra
    mode = '{{ inputs.mode }}'
    verified = '{{ outputs.prove_admission.vars.outcome ?? "" }}'
    outcome = verified or ('PREVIEWED' if mode == 'PREVIEW' else 'REJECTED')
    report = {'outcome':outcome, 'plan_sha256':'{{ outputs.assess.vars.sha256 }}',
              'violations':{{ outputs.assess.vars.violations }}, 'execution':'{{ execution.id }}'}
    open('outcome.json','w').write(json.dumps(report,indent=2))
    Kestra.outputs({'outcome':outcome})
    print(json.dumps(report,indent=2))
  outputFiles:
  - outcome.json
  containerImage: python:3.13-slim
  dependencies:
  - kestra==1.1.0
  env:
    SERVER: '{{ secret(''K8S_MASTER_URL'') }}'
    TOKEN: '{{ secret(''K8S_TOKEN'') }}'
    CA: '{{ secret(''K8S_CA_CERT'') }}'
    NAMESPACE: '{{ inputs.target_namespace }}'
    POLICY_NAME: '{{ inputs.policy_name }}'
    EXECUTION: '{{ execution.id }}'
  inputFiles:
    client.py: '{{ render(vars.client) }}'
errors:
- id: alert_if_enabled
  type: io.kestra.plugin.core.flow.If
  condition: '{{ inputs.notify_slack }}'
  then:
  - id: alert
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    allowFailure: true
    description: An unavailable alert destination must not prevent policy recovery.
    url: '{{ secret(''SLACK_WEBHOOK'') }}'
    retry:
      type: constant
      interval: PT2S
      maxAttempts: 3
    messageText: 'Kyverno rollout failed: {{ flow.namespace }}.{{ flow.id }}, execution {{ execution.id }}, task {{ (errorLogs()
      | length) > 0 ? errorLogs()[0].taskId : ''approval/flow'' }}. Inspect recovery: {{ inputs.kestra_url }}/ui/main/executions/{{
      flow.namespace }}/{{ flow.id }}/{{ execution.id }}'
- id: recover_if_owned
  type: io.kestra.plugin.core.flow.If
  condition: '{{ outputs.assess.outputFiles[''impact.json''] is defined and outputs.assess.vars.action == ''Audit'' }}'
  then:
  - id: recovery_plan
    type: io.kestra.plugin.scripts.python.Script
    description: Only roll back a policy still owned by this execution and matching its expected enforced spec.
    script: |-
      from client import *
      from kestra import Kestra
      before = json.load(open('impact.json'))
      current = get(base)
      metadata = current['metadata']
      owned = metadata['uid'] == before['plan']['policy_uid'] and metadata.get('annotations', {}).get(marker) == os.environ['EXECUTION']
      safe = owned and current['spec'] == expected_spec('Deny')
      patch = [{'op':'test','path':'/metadata/uid','value':metadata['uid']},
               {'op':'test','path':'/metadata/resourceVersion','value':metadata['resourceVersion']},
               {'op':'test','path':'/spec/validationActions','value':['Deny']},
               {'op':'test','path':'/metadata/annotations/blueprints.kestra.io~1rollout-id','value':os.environ['EXECUTION']},
               {'op':'replace','path':'/spec/validationActions','value':['Audit']},
               {'op':'replace','path':'/metadata/annotations/blueprints.kestra.io~1rollout-id','value':before['plan']['owner']}]
      outcome = 'ROLLBACK_PLANNED' if safe else ('CONFLICT_REQUIRES_REVIEW' if owned else 'NO_OWNED_CHANGE')
      save('recovery.json', {'outcome':outcome, 'policy_uid':metadata['uid'], 'observed_action':current['spec'].get('validationActions')})
      Kestra.outputs({'safe':safe, 'patch':json.dumps(patch)})
      print(outcome)
    outputFiles:
    - recovery.json
    containerImage: python:3.13-slim
    dependencies:
    - kestra==1.1.0
    env:
      SERVER: '{{ secret(''K8S_MASTER_URL'') }}'
      TOKEN: '{{ secret(''K8S_TOKEN'') }}'
      CA: '{{ secret(''K8S_CA_CERT'') }}'
      NAMESPACE: '{{ inputs.target_namespace }}'
      POLICY_NAME: '{{ inputs.policy_name }}'
      EXECUTION: '{{ execution.id }}'
    inputFiles:
      client.py: '{{ render(vars.client) }}'
      impact.json: '{{ outputs.assess.outputFiles[''impact.json''] }}'
  - id: rollback_if_safe
    type: io.kestra.plugin.core.flow.If
    condition: '{{ outputs.recovery_plan.vars.safe }}'
    then:
    - id: rollback
      type: io.kestra.plugin.kubernetes.kubectl.Patch
      description: Return only this execution’s unchanged policy to Audit; conflicts remain failures.
      patch: '{{ outputs.recovery_plan.vars.patch }}'
      connection:
        masterUrl: '{{ secret(''K8S_MASTER_URL'') }}'
        oauthToken: '{{ secret(''K8S_TOKEN'') }}'
        caCertData: '{{ secret(''K8S_CA_CERT'') }}'
      namespace: '{{ inputs.target_namespace }}'
      resourceType: namespacedvalidatingpolicies
      resourceName: '{{ inputs.policy_name }}'
      apiGroup: policies.kyverno.io
      apiVersion: v1
      patchStrategy: JSON_PATCH
      retry:
        type: constant
        interval: PT2S
        maxAttempts: 2
    - id: confirm_rollback
      type: io.kestra.plugin.scripts.python.Script
      description: Read back Audit mode; never report rollback from an attempted write alone.
      script: |-
        from client import *
        before = json.load(open('impact.json'))['plan']
        current = get(base)
        assert current['metadata']['uid'] == before['policy_uid'] and current['spec'] == expected_spec('Audit'), 'Rollback did not restore the original policy to Audit'
        assert current['metadata']['annotations'][marker] == before['owner'], 'Policy ownership changed during rollback'
        save('rollback.json', {'outcome':'ROLLED_BACK', 'policy_uid':current['metadata']['uid']})
        print('ROLLED_BACK: policy is Audit; execution remains failed')
      outputFiles:
      - rollback.json
      containerImage: python:3.13-slim
      dependencies:
      - kestra==1.1.0
      env:
        SERVER: '{{ secret(''K8S_MASTER_URL'') }}'
        TOKEN: '{{ secret(''K8S_TOKEN'') }}'
        CA: '{{ secret(''K8S_CA_CERT'') }}'
        NAMESPACE: '{{ inputs.target_namespace }}'
        POLICY_NAME: '{{ inputs.policy_name }}'
        EXECUTION: '{{ execution.id }}'
      inputFiles:
        client.py: '{{ render(vars.client) }}'
        impact.json: '{{ outputs.assess.outputFiles[''impact.json''] }}'
triggers:
- id: preview_webhook
  type: io.kestra.plugin.core.trigger.Webhook
  key: '{{ secret(''KYVERNO_PREVIEW_WEBHOOK_KEY'') }}'
outputs:
- id: impact
  type: STRING
  value: '{{ outputs.assess.outputFiles[''impact.json''] ?? '''' }}'
- id: admission_proof
  type: STRING
  value: '{{ outputs.prove_admission.outputFiles[''admission-proof.json''] ?? '''' }}'
- id: outcome
  type: STRING
  value: '{{ outputs.summary.vars.outcome ?? ''FAILED'' }}'
extend:
  title: Promote a Kyverno policy from audit to enforcement with admission proof
  metaTitle: Approve and verify Kyverno policy enforcement | Kestra
  shortDescription: Assess Pod and controller labels, approve a namespace-scoped Kyverno rollout, and prove real admission
    decisions with server-side dry-run requests.
  metaDescription: Promote a Kyverno policy from Audit to Deny with workload impact checks, human approval, live admission
    proof, and guarded rollback.
  description: |
    Approve a namespace-scoped team-label policy rollout and prove live Kubernetes admission decisions.

    ## How it works

    1. Manual runs and preview webhooks inventory Pods and controller templates (maximum 500 objects).
    2. PREVIEW changes nothing. ROLLOUT blocks violations, pauses for approval, then rechecks the plan.
    3. A conditional Kubernetes patch switches Audit to Deny. Server-side dry-run must admit a labeled Pod and reject an unlabeled Pod with the intended policy message.
    4. Failed verification conditionally restores only this execution's unchanged policy. Already enforced policies are verified without taking ownership.

    ## What you get

    - Inventory/fingerprint: `{{ outputs.assess.outputFiles['impact.json'] }}`.
    - Admission decisions: `{{ outputs.prove_admission.outputFiles['admission-proof.json'] }}`.
    - Outcome: `{{ outputs.summary.outputFiles['outcome.json'] }}`; failures retain recovery artifacts.
    - Approval expires after 24 hours; changed plans/revisions block promotion.

    ## Who it's for

    Platform and Kubernetes security engineers.

    ## Why orchestrate this with Kestra

    Separate review, promotion, live verification and recovery with retained evidence.

    ## Prerequisites

    Kyverno 1.19.2 (tested), Kubernetes, Docker on the worker, and a dedicated namespace. Grant namespace get, workload list, Pod create (also required for dry-run), and policy get/patch. Use exactly the opted-in policy below.

    ### Secrets

    - `K8S_MASTER_URL`: reachable HTTPS API URL.
    - `K8S_TOKEN`: service-account token.
    - `K8S_CA_CERT`: base64 PEM CA, not a path.
    - `KYVERNO_PREVIEW_WEBHOOK_KEY`: preview endpoint key.
    - `SLACK_WEBHOOK`: optional failure destination.

    ## Quick start

    1. Create policy-rollout-demo; apply this JSON with kubectl. Wait for status.conditionStatus.ready=true.

       ```json
       {"apiVersion":"policies.kyverno.io/v1","kind":"NamespacedValidatingPolicy",
        "metadata":{"name":"require-team-label","namespace":"policy-rollout-demo","annotations":{"blueprints.kestra.io/rollout-id":""}},
        "spec":{"validationActions":["Audit"],"failurePolicy":"Fail",
          "evaluation":{"admission":{"enabled":true},"background":{"enabled":true},"mode":"Kubernetes"},
          "autogen":{"podControllers":{"controllers":[]},"validatingAdmissionPolicy":{"enabled":false}},
          "matchConstraints":{"matchPolicy":"Exact","resourceRules":[{"apiGroups":[""],"apiVersions":["v1"],"operations":["CREATE"],"resources":["pods"]}]},
          "validations":[{"expression":"has(object.metadata.labels) && 'team' in object.metadata.labels && object.metadata.labels['team'] != ''","message":"kestra-team-label-required"}]}}
       ```
    2. Set secrets. Inputs: SELECT mode=PREVIEW (or ROLLOUT); STRING target_namespace=policy-rollout-demo, policy_name=require-team-label, kestra_url=http://localhost:8080; BOOL notify_slack=false.
    3. Preview; repair every listed label, including controller templates. Run ROLLOUT; approve with impact.json's SHA-256. Rejection leaves Audit unchanged.
    4. Verify ENFORCED, valid=201 and the intended denial (400/403). No probe Pods persist; enforcement stays active.
    5. Use the trigger panel's webhook URL for PREVIEW with defaults; promote manually.

    ## How to extend

    Adapt the rule with matching impact checks/probes. Snapshots cannot guarantee future compliance. Hard termination may leave Deny active; inspect before manual recovery. Keep evidence and remove test resources after contributing.

    ## Links

    - [Kubernetes Patch](https://kestra.io/plugins/plugin-kubernetes/kubernetes-api-kubectl/io.kestra.plugin.kubernetes.kubectl.patch)
    - [Python Script](https://kestra.io/plugins/plugin-script-python/io.kestra.plugin.scripts.python.script)
    - [Kyverno ValidatingPolicy](https://kyverno.io/docs/policy-types/validating-policy/)
    - [Kubernetes dry-run](https://kubernetes.io/docs/reference/using-api/api-concepts/#dry-run)
    - This blueprint has been created by [Biplab Bera](https://github.com/blbera)
  tags:
  - Infrastructure
  subTags:
  - Kubernetes Operations
  - Approval Gates
  ee: false
  demo: false
