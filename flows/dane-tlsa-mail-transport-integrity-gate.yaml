id: dane-tlsa-mail-transport-integrity-gate
namespace: company.infrastructure
description: |
  Audit a mail domain's MX records and the TLSA records advertised for each SMTP host.
  Query DNS-over-HTTPS for MX and TLSA data, record DNSSEC authenticated-data status,
  validate TLSA field ranges and association-data encoding, and report MX hosts that
  lack TLSA records. Strict mode can block mail-transport readiness when the domain's
  declared DANE policy is not met. This checks DNS metadata and does not perform a
  complete SMTP TLS handshake or independently validate certificate associations.

inputs:
  - id: mail_domain
    type: STRING
    displayName: Mail domain
    defaults: mailbox.org
    description: Domain whose MX hosts and DANE TLSA metadata should be audited.
  - id: require_tlsa_for_all_mx
    type: BOOL
    displayName: Require TLSA for every MX host
    defaults: false
    description: When true, report a blocking finding for each MX host without TLSA records.
  - id: require_dnssec_authenticated
    type: BOOL
    displayName: Require DNSSEC authenticated data
    defaults: false
    description: When true, block when Cloudflare DNS-over-HTTPS does not mark MX/TLSA answers as authenticated data.
  - id: strict_mode
    type: BOOL
    displayName: Enforce DANE metadata policy
    defaults: false
    description: When true, DNSSEC and missing-TLSA findings become blocking and a failed verdict stops the flow.
  - id: notify_slack
    type: BOOL
    displayName: Send Slack alerts
    defaults: false
    description: Enable only after configuring SLACK_WEBHOOK_URL in the Kestra namespace.
  - id: archive_report
    type: BOOL
    displayName: Archive report to S3
    defaults: false
    description: Store the JSON audit report in S3. AWS credentials are required only when enabled.
  - id: evidence_bucket
    type: STRING
    displayName: S3 evidence bucket
    defaults: my-dane-tlsa-evidence
    description: Existing S3 bucket used only when report archival is enabled.
  - id: evidence_prefix
    type: STRING
    displayName: S3 evidence prefix
    defaults: dane-tlsa-audits
    description: Prefix for domain-specific DANE/TLSA reports.
  - id: aws_region
    type: STRING
    displayName: AWS region
    defaults: eu-west-1
    description: Region containing the evidence bucket.

triggers:
  - id: weekday_dane_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: Recheck MX and TLSA DNS metadata every weekday. Enable after confirming the domain and chosen DANE enforcement policy.
    cron: "0 7 * * 1-5"
    disabled: true

tasks:
  - id: validate_mail_domain
    type: io.kestra.plugin.scripts.python.Script
    description: Validate the mail domain before making DNS-over-HTTPS queries.
    containerImage: python:3.12-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    env:
      MAIL_DOMAIN: "{{ inputs.mail_domain }}"
    script: |
      import os
      import re

      domain = os.environ.get("MAIL_DOMAIN", "").strip().lower().rstrip(".")
      if len(domain) > 253 or not re.fullmatch(r"(?=.{1,253}$)(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.)*[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?", domain):
          raise ValueError("mail_domain must be a valid DNS hostname without a scheme or path")
      if "." not in domain:
          raise ValueError("mail_domain must be a fully qualified DNS domain")
      print(f"Validated mail domain: {domain}")

  - id: audit_dane_tlsa
    type: io.kestra.plugin.scripts.python.Script
    description: Query MX and TLSA records through Cloudflare DNS-over-HTTPS, inspect DNSSEC authenticated-data status and TLSA syntax, and produce a per-MX audit report.
    containerImage: python:3.12-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    dependencies:
      - kestra
    env:
      MAIL_DOMAIN: "{{ inputs.mail_domain }}"
      REQUIRE_TLSA_FOR_ALL_MX: "{{ inputs.require_tlsa_for_all_mx }}"
      REQUIRE_DNSSEC_AUTHENTICATED: "{{ inputs.require_dnssec_authenticated }}"
      STRICT_MODE: "{{ inputs.strict_mode }}"
    outputFiles:
      - dane-tlsa-audit.json
    script: |
      import json
      import os
      import re
      from datetime import datetime, timezone
      from urllib.parse import urlencode
      from urllib.request import Request, urlopen
      from kestra import Kestra

      domain = os.environ["MAIL_DOMAIN"].strip().lower().rstrip(".")
      require_tlsa = os.environ.get("REQUIRE_TLSA_FOR_ALL_MX", "false").lower() == "true"
      require_dnssec = os.environ.get("REQUIRE_DNSSEC_AUTHENTICATED", "false").lower() == "true"
      strict_mode = os.environ.get("STRICT_MODE", "false").lower() == "true"
      findings = []
      mx_records = []
      host_results = []

      def add(code, severity, message, host=None):
          finding = {"code": code, "severity": severity, "message": message}
          if host:
              finding["host"] = host
          findings.append(finding)

      def query_dns(name, record_type):
          params = urlencode({"name": name, "type": record_type})
          url = "https://cloudflare-dns.com/dns-query?" + params
          request = Request(url, headers={
              "Accept": "application/dns-json",
              "User-Agent": "Kestra-DANE-TLSA-Mail-Transport-Audit/1.0",
          })
          with urlopen(request, timeout=25) as response:
              if not 200 <= response.status < 300:
                  raise RuntimeError(f"DNS-over-HTTPS query returned HTTP {response.status}: {name} {record_type}")
              payload = json.load(response)
          if not isinstance(payload, dict):
              raise ValueError(f"Invalid DNS-over-HTTPS response for {name} {record_type}")
          return payload

      mx_response = query_dns(domain, "MX")
      mx_dnssec_authenticated = bool(mx_response.get("AD", False))
      if mx_response.get("Status") not in {0, None}:
          add("MX_LOOKUP_FAILED", "BLOCK", f"MX DNS query returned status {mx_response.get('Status')}.")
      for answer in mx_response.get("Answer") or []:
          if answer.get("type") != 15:
              continue
          data = str(answer.get("data") or "").strip()
          parts = data.split()
          if len(parts) >= 2:
              try:
                  preference = int(parts[0])
              except ValueError:
                  continue
              host = parts[1].rstrip(".").lower()
              if host and host != ".":
                  mx_records.append({"preference": preference, "host": host, "ttl": answer.get("TTL")})

      if not mx_records:
          add("MX_RECORDS_MISSING", "BLOCK", f"No usable MX records were returned for {domain}.")

      if not mx_dnssec_authenticated:
          severity = "BLOCK" if (strict_mode and require_dnssec) else "WARN"
          add("MX_DNSSEC_NOT_AUTHENTICATED", severity, "Cloudflare DoH did not set the authenticated-data flag for the MX answer.")

      mx_records = sorted({(entry["preference"], entry["host"]): entry for entry in mx_records}.values(),
                          key=lambda entry: (entry["preference"], entry["host"]))

      for mx in mx_records:
          host = mx["host"]
          owner = f"_25._tcp.{host}"
          result = {
              "preference": mx["preference"],
              "mxHost": host,
              "mxTtl": mx.get("ttl"),
              "tlsaOwnerName": owner,
              "tlsaDnssecAuthenticated": False,
              "tlsaRecords": [],
          }
          try:
              response = query_dns(owner, "TLSA")
              result["tlsaDnssecAuthenticated"] = bool(response.get("AD", False))
              if response.get("Status") not in {0, None}:
                  add("TLSA_LOOKUP_FAILED", "BLOCK" if strict_mode else "WARN", f"TLSA DNS query returned status {response.get('Status')}.", host)
              for answer in response.get("Answer") or []:
                  if answer.get("type") != 52:
                      continue
                  data = str(answer.get("data") or "").strip()
                  parts = data.split()
                  record = {"raw": data, "ttl": answer.get("TTL"), "valid": False}
                  if len(parts) != 4:
                      add("TLSA_RECORD_FORMAT_INVALID", "BLOCK" if strict_mode else "WARN", f"TLSA record for {owner} does not have four fields.", host)
                      result["tlsaRecords"].append(record)
                      continue
                  try:
                      usage, selector, matching_type = map(int, parts[:3])
                  except ValueError:
                      add("TLSA_RECORD_FORMAT_INVALID", "BLOCK" if strict_mode else "WARN", f"TLSA record for {owner} has non-integer fields.", host)
                      result["tlsaRecords"].append(record)
                      continue
                  association = parts[3].lower()
                  valid = usage in {0, 1, 2, 3} and selector in {0, 1} and matching_type in {0, 1, 2}
                  valid = valid and bool(re.fullmatch(r"[0-9a-f]+", association)) and len(association) % 2 == 0
                  if matching_type == 1:
                      valid = valid and len(association) == 64
                  elif matching_type == 2:
                      valid = valid and len(association) == 128
                  record.update({
                      "certificateUsage": usage,
                      "selector": selector,
                      "matchingType": matching_type,
                      "associationDataLengthHex": len(association),
                      "valid": valid,
                  })
                  if not valid:
                      add("TLSA_RECORD_FIELDS_INVALID", "BLOCK" if strict_mode else "WARN", f"TLSA record for {owner} has invalid field values or association-data length.", host)
                  result["tlsaRecords"].append(record)

              if not result["tlsaRecords"]:
                  severity = "BLOCK" if (strict_mode and require_tlsa) else "WARN"
                  add("TLSA_RECORDS_MISSING", severity, f"No TLSA record was returned for SMTP MX host {host}.", host)
              if not result["tlsaDnssecAuthenticated"]:
                  severity = "BLOCK" if (strict_mode and require_dnssec) else "WARN"
                  add("TLSA_DNSSEC_NOT_AUTHENTICATED", severity, f"Cloudflare DoH did not set the authenticated-data flag for {owner}.", host)
          except Exception as exc:
              add("TLSA_LOOKUP_FAILED", "BLOCK" if strict_mode else "WARN", f"Could not inspect TLSA metadata for {owner}: {exc}", host)
          host_results.append(result)

      blocking = [item for item in findings if item["severity"] == "BLOCK"]
      warnings = [item for item in findings if item["severity"] == "WARN"]
      verdict = "FAIL" if blocking else ("PASS_WITH_WARNINGS" if warnings else "PASS")
      report = {
          "schemaVersion": 1,
          "checkedAt": datetime.now(timezone.utc).isoformat(),
          "mailDomain": domain,
          "mxDnssecAuthenticated": mx_dnssec_authenticated,
          "mxHosts": host_results,
          "requireTlsaForAllMx": require_tlsa,
          "requireDnssecAuthenticated": require_dnssec,
          "strictMode": strict_mode,
          "findings": findings,
          "blockingFindingCount": len(blocking),
          "warningCount": len(warnings),
          "verdict": verdict,
          "scopeNote": "This flow inspects MX/TLSA DNS metadata via Cloudflare DoH and validates TLSA syntax. It does not perform SMTP STARTTLS, validate certificate associations against live certificates, or replace a full DANE-aware mail transport validator.",
      }
      with open("dane-tlsa-audit.json", "w", encoding="utf-8") as target:
          json.dump(report, target, indent=2, ensure_ascii=False)

      tlsa_count = sum(len(host.get("tlsaRecords") or []) for host in host_results)
      print(f"DANE/TLSA audit: domain={domain}, mx_hosts={len(mx_records)}, tlsa_records={tlsa_count}, strict={strict_mode}, verdict={verdict}, blocking={len(blocking)}, warnings={len(warnings)}")
      print("DANE/TLSA findings: " + json.dumps(findings, ensure_ascii=False))
      Kestra.outputs({
          "mail_domain": domain,
          "mx_dnssec_authenticated": mx_dnssec_authenticated,
          "mx_host_count": len(mx_records),
          "tlsa_record_count": tlsa_count,
          "blocking_finding_count": len(blocking),
          "warning_count": len(warnings),
          "verdict": verdict,
          "findings": findings,
      })

  - id: optionally_archive_report
    type: io.kestra.plugin.core.flow.If
    description: Optionally archive the DANE/TLSA metadata report to S3.
    condition: "{{ inputs.archive_report }}"
    then:
      - id: upload_dane_report
        type: io.kestra.plugin.aws.s3.Upload
        description: Store the JSON DNS/TLSA audit report.
        accessKeyId: "{{ secret('AWS_ACCESS_KEY_ID') }}"
        secretKeyId: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
        region: "{{ inputs.aws_region }}"
        bucket: "{{ inputs.evidence_bucket }}"
        from: "{{ outputs.audit_dane_tlsa.outputFiles['dane-tlsa-audit.json'] }}"
        key: "{{ inputs.evidence_prefix }}/{{ inputs.mail_domain }}/dane-tlsa-{{ execution.id }}.json"

  - id: enforce_dane_policy
    type: io.kestra.plugin.core.flow.If
    description: Fail only when strict mode is enabled and the audit contains blocking findings.
    condition: "{{ inputs.strict_mode and outputs.audit_dane_tlsa.vars.verdict == 'FAIL' }}"
    then:
      - id: optionally_alert_dane_failure
        type: io.kestra.plugin.core.flow.If
        description: Send an alert only when enabled and the webhook secret is configured.
        condition: "{{ inputs.notify_slack }}"
        then:
          - id: alert_dane_failure
            type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
            description: Alert mail-domain owners about DANE/TLSA policy findings.
            url: "{{ secret('SLACK_WEBHOOK_URL') }}"
            payload: |-
              {{
                {
                  "text": ":warning: DANE/TLSA policy BLOCKED\nMail domain: " ~ inputs.mail_domain ~
                    "\nFindings: " ~ (outputs.audit_dane_tlsa.vars.findings | toJson) ~
                    "\nExecution: " ~ execution.id ~
                    "\nReview dane-tlsa-audit.json and confirm DNSSEC/TLSA publication."
                } | toJson
              }}
      - id: fail_dane_gate
        type: io.kestra.plugin.core.execution.Fail
        description: Stop downstream mail-delivery promotion after strict DANE policy violations.
        errorMessage: "DANE/TLSA policy failed for {{ inputs.mail_domain }}. Review dane-tlsa-audit.json."
    else:
      - id: log_dane_verdict
        type: io.kestra.plugin.core.log.Log
        level: INFO
        message: "DANE/TLSA audit {{ outputs.audit_dane_tlsa.vars.verdict }} for {{ inputs.mail_domain }}; MX hosts={{ outputs.audit_dane_tlsa.vars.mx_host_count }}, TLSA records={{ outputs.audit_dane_tlsa.vars.tlsa_record_count }}."

errors:
  - id: optionally_alert_execution_failure
    type: io.kestra.plugin.core.flow.If
    description: Send technical execution failure notifications only when enabled.
    condition: "{{ inputs.notify_slack }}"
    then:
      - id: alert_execution_failure
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Alert when DNS-over-HTTPS or orchestration failures prevent an audit.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |-
          {{
            {
              "text": ":warning: DANE/TLSA audit execution failed\nMail domain: " ~ inputs.mail_domain ~
                "\nExecution: " ~ execution.id ~
                "\nInspect Kestra logs; execution failure is not a passing DANE result."
            } | toJson
          }}

outputs:
  - id: dane_tlsa_audit
    type: JSON
    description: Machine-readable MX hosts, DNSSEC authentication flags, TLSA record metadata, findings, and policy verdict.
    value: "{{ outputs.audit_dane_tlsa.vars | toJson }}"

extend:
  title: DANE TLSA Mail Transport Integrity Gate
  metaTitle: DANE TLSA Mail Transport Integrity Gate | Kestra
  shortDescription: Audit MX hosts for DNSSEC-authenticated TLSA records and valid TLSA fields before adopting a strict DANE policy for outbound email.
  metaDescription: Check mail-domain MX hosts for TLSA records, DNSSEC authenticated data, valid TLSA fields and optional strict DANE policy enforcement.
  description: |
    Inspect a mail domain's DNS mail exchangers and their TLSA records through a public DNS-over-HTTPS resolver. The flow records MX preferences, queries the TLSA owner name for each SMTP server, inspects the resolver's authenticated-data flag, validates TLSA usage/selector/matching fields and association-data shape, and reports missing records. Audit mode records findings without blocking; strict mode can require TLSA publication and DNSSEC-authenticated answers.

    ## How it works

    1. Validate the mail domain name.
    2. Query Cloudflare DNS-over-HTTPS for MX records and record the authenticated-data flag.
    3. For each MX host, query the TLSA owner name _25._tcp.MX-HOST and collect TLSA records.
    4. Validate TLSA usage, selector, matching type and association-data encoding/length.
    5. Record missing TLSA records or unauthenticated answers as findings, then optionally archive the report and enforce the configured policy.

    ## What you get

    - MX preference and host inventory.
    - TLSA record values and field-level validation results.
    - DNSSEC authenticated-data status for MX and TLSA DNS responses.
    - Detection of missing TLSA records and invalid record syntax/length.
    - Optional S3 evidence retention, Slack alerting and strict-mode policy enforcement.

    ## Who it's for

    - Email platform teams implementing DANE for SMTP.
    - Security teams validating DNSSEC/TLSA publication posture for mail domains.
    - Infrastructure engineers preparing a domain for stronger transport authenticity controls.

    ## Why orchestrate this with Kestra

    Kestra gives the DNS checks repeatability, per-domain inputs, detailed task logs, JSON evidence and optional schedule/alert routing. Teams can first collect telemetry and then enable enforcement after verifying their mail transport requirements.

    ## Prerequisites

    - Kestra 2.x workers with Docker enabled for the Python Script task runner.
    - Network access to Cloudflare DNS-over-HTTPS.
    - Optional Slack incoming webhook and optional S3 bucket with write access.
    - A chosen mail domain and an agreed policy for missing TLSA records and DNSSEC authentication.

    ### Secrets

    - SLACK_WEBHOOK_URL: optional Slack incoming webhook; required only when notify_slack is true.
    - AWS_ACCESS_KEY_ID: optional AWS access key used only when report archival is enabled.
    - AWS_SECRET_ACCESS_KEY: optional AWS secret key used only when report archival is enabled.

    ## Quick start

    1. Import the flow and start with mailbox.org as a real public mail-domain example.
    2. Execute it and inspect dane_tlsa_audit and dane-tlsa-audit.json.
    3. Review MX hosts, TLSA records and authenticated-data flags before enabling strict checks.
    4. Set require_tlsa_for_all_mx and require_dnssec_authenticated to true where they reflect the intended DANE policy.
    5. Enable schedule/alerts only after reviewing the initial report and configuring the corresponding secrets.

    ## How to extend

    - Add SMTP STARTTLS handshakes and verify each TLSA association against the live certificate chain.
    - Compare observed MX/TLSA state against an approved policy stored in Git.
    - Report TTL changes and TLSA record rollover events over time.
    - Combine with MTA-STS and SPF/DKIM/DMARC audits for a broader email security posture report.

    ## Links

    - [RFC 7671: DANE for SMTP](https://www.rfc-editor.org/rfc/rfc7671)
    - [RFC 6698: TLSA DNS records](https://www.rfc-editor.org/rfc/rfc6698)
    - [Cloudflare DNS-over-HTTPS JSON API](https://developers.cloudflare.com/1.1.1.1/encryption/dns-over-https/make-api-requests/dns-json/)
    - [Kestra Python Script plugin](https://kestra.io/plugins/plugin-scripts/python)
    - [Kestra Slack Incoming Webhook plugin](https://kestra.io/plugins/plugin-slack/slackincomingwebhook)
    - [Kestra AWS S3 plugin](https://kestra.io/plugins/plugin-aws/s3)
  tags:
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - Policy & Compliance
  ee: false
  demo: false
