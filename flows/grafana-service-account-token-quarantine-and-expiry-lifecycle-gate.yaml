id: grafana-service-account-token-quarantine-and-expiry-lifecycle-gate
namespace: company.team

description: |
  Retire forgotten Grafana service accounts without breaking anyone. A service account with no active
  token is tracked in Kestra KV, disabled (reversible) after a grace window, and deleted only after a
  quarantine period in which nobody re-enabled it. Expired and revoked tokens are cleaned up. Every change
  is approved with a typed count, re-checked against live state, and verified through the Grafana API.

concurrency:
  limit: 1
  behavior: QUEUE

inputs:
  - id: grafana_url
    type: STRING
    displayName: Grafana URL
    description: Base URL such as http://host.docker.internal:3000, reachable from the Docker task runner.
    defaults: "http://host.docker.internal:3000"

  - id: grafana_org_id
    type: STRING
    displayName: Organization ID
    description: Service accounts belong to an organization; sent as X-Grafana-Org-Id.
    defaults: "1"

  - id: protected_name_regex
    type: STRING
    displayName: Protected service accounts
    description: Names matching this regular expression are never changed. Include the account whose token Kestra uses.
    defaults: "^kestra"

  - id: never_used_days
    type: INT
    displayName: Days before a never-used token counts as unused
    defaults: 30

  - id: unused_days
    type: INT
    displayName: Days of inactivity before a used token counts as unused
    defaults: 90

  - id: dormant_grace_hours
    type: INT
    displayName: Dormant grace window in hours
    description: A service account must stay dormant this long before it is disabled.
    defaults: 72

  - id: quarantine_days
    type: INT
    displayName: Quarantine days before deletion
    description: Only accounts this flow disabled are ever deleted, and only after this many days.
    defaults: 14

  - id: exempt_days
    type: INT
    displayName: Exemption days after an owner re-enables an account
    defaults: 180

  - id: delete_expired_tokens
    type: BOOL
    displayName: Delete expired and revoked tokens
    defaults: true

  - id: max_ops_per_run
    type: INT
    displayName: Max operations per run
    defaults: 20

  - id: max_disable_pct
    type: INT
    displayName: Max share of accounts disabled in one run
    description: Above this share the run refuses to disable anything, because the usage data is probably wrong.
    defaults: 50

  - id: dry_run
    type: BOOL
    displayName: Dry run
    description: When true the plan is reported and tracked, but no approval is requested and nothing is changed.
    defaults: true

variables:
  state_key: "grafana_sa_lifecycle_state_{{ (inputs.grafana_url ~ '-' ~ inputs.grafana_org_id) | slugify }}"
  audit_key: "grafana_sa_lifecycle_audit_{{ (inputs.grafana_url ~ '-' ~ inputs.grafana_org_id) | slugify }}"
  lib_js: |
    const DAY = 864e5;
    const YEAR_FLOOR = Date.parse("2000-01-01T00:00:00Z");

    function client({ url, token, orgId }) {
      const base = url.replace(/\/+$/, "");
      return async function call(method, path, body) {
        const headers = { Authorization: `Bearer ${token}`, "Content-Type": "application/json", Accept: "application/json" };
        if (orgId) headers["X-Grafana-Org-Id"] = String(orgId);
        const res = await fetch(`${base}${path}`, { method, headers, body: body === undefined ? undefined : JSON.stringify(body) });
        const text = await res.text();
        let json = null;
        try { json = text ? JSON.parse(text) : null; } catch (e) { /* non-JSON error body */ }
        return { status: res.status, json, text };
      };
    }

    // Grafana only reports a token's expiry in secondsUntilExpiration when it is within 7 days, so expiry is judged
    // from hasExpired and the expiration timestamp, never from that counter.
    function parseToken(t, saId) {
      if (typeof t.id !== "number" || typeof t.name !== "string" || typeof t.hasExpired !== "boolean" || typeof t.created !== "string") {
        throw new Error(`Unexpected token shape for service account ${saId}: expected id, name, created and hasExpired`);
      }
      const ts = (v) => { if (v === null || v === undefined) return null; const n = Date.parse(v); return Number.isNaN(n) || n < YEAR_FLOOR ? null : n; };
      return { id: t.id, name: t.name, created: ts(t.created), lastUsedAt: ts(t.lastUsedAt), expiration: ts(t.expiration), hasExpired: t.hasExpired, revoked: t.isRevoked === true };
    }

    async function listServiceAccounts(call) {
      const out = [];
      for (let page = 1; page < 500; page++) {
        const r = await call("GET", `/api/serviceaccounts/search?perpage=100&page=${page}`);
        if (r.status !== 200 || !r.json || !Array.isArray(r.json.serviceAccounts) || typeof r.json.totalCount !== "number") {
          throw new Error(`service account search failed (HTTP ${r.status}): ${r.text.slice(0, 160)}`);
        }
        for (const s of r.json.serviceAccounts) {
          if (typeof s.id !== "number" || typeof s.name !== "string" || typeof s.isDisabled !== "boolean" || typeof s.tokens !== "number") {
            throw new Error("Unexpected service account shape: expected id, name, isDisabled and tokens");
          }
          out.push({ id: s.id, name: s.name, login: s.login || "", role: s.role || "", isDisabled: s.isDisabled, tokens: s.tokens });
        }
        if (!r.json.serviceAccounts.length || out.length >= r.json.totalCount) break;
      }
      return out;
    }

    async function listTokens(call, saId) {
      const r = await call("GET", `/api/serviceaccounts/${saId}/tokens`);
      if (r.status === 404) return null;
      if (r.status !== 200 || !Array.isArray(r.json)) throw new Error(`listing tokens of service account ${saId} failed (HTTP ${r.status}): ${r.text.slice(0, 160)}`);
      return r.json.map((t) => parseToken(t, saId));
    }

    function classifyToken(t, now, cfg) {
      if (t.hasExpired || t.revoked) return { state: "expired", reason: t.revoked ? "revoked" : "expired" };
      if (t.lastUsedAt === null) {
        const age = t.created === null ? 0 : (now - t.created) / DAY;
        return age >= cfg.neverUsedDays ? { state: "unused", reason: `never used in ${Math.floor(age)} days` } : { state: "active", reason: "new" };
      }
      const idle = (now - t.lastUsedAt) / DAY;
      return idle >= cfg.unusedDays ? { state: "unused", reason: `idle for ${Math.floor(idle)} days` } : { state: "active", reason: "recently used" };
    }

    module.exports = { DAY, client, listServiceAccounts, listTokens, classifyToken };

triggers:
  - id: nightly_lifecycle_run
    type: io.kestra.plugin.core.trigger.Schedule
    description: Advance the dormant, disabled and deleted stages every night. Shipped disabled until grafana_url points at your Grafana.
    cron: "40 3 * * *"
    disabled: true

  - id: on_demand_webhook
    type: io.kestra.plugin.core.trigger.Webhook
    description: Start a run from a security review or offboarding pipeline.
    key: "{{ secret('GRAFANA_SA_GUARD_WEBHOOK_KEY') }}"

tasks:
  - id: scan_service_accounts
    type: io.kestra.plugin.scripts.node.Script
    description: List every service account and its tokens, classify tokens as active, unused or expired, and advance each account through the dormant, disabled and deleted stages kept in KV.
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: node:20-slim
    inputFiles:
      lib.js: "{{ vars.lib_js }}"
      state.json: "{{ kv(key=render(vars.state_key), errorOnMissing=false) | default('{}') }}"
    env:
      GRAFANA_URL: "{{ inputs.grafana_url }}"
      GRAFANA_TOKEN: "{{ secret('GRAFANA_TOKEN') }}"
      GRAFANA_ORG_ID: "{{ inputs.grafana_org_id }}"
      PROTECTED_NAME_REGEX: "{{ inputs.protected_name_regex }}"
      NEVER_USED_DAYS: "{{ inputs.never_used_days }}"
      UNUSED_DAYS: "{{ inputs.unused_days }}"
      DORMANT_GRACE_HOURS: "{{ inputs.dormant_grace_hours }}"
      QUARANTINE_DAYS: "{{ inputs.quarantine_days }}"
      EXEMPT_DAYS: "{{ inputs.exempt_days }}"
      DELETE_EXPIRED_TOKENS: "{{ inputs.delete_expired_tokens }}"
      MAX_OPS_PER_RUN: "{{ inputs.max_ops_per_run }}"
      MAX_DISABLE_PCT: "{{ inputs.max_disable_pct }}"
    outputFiles:
      - ops.json
      - snapshot.json
      - state.json
      - findings.json
    script: |
      const fs = require("fs");
      const lib = require("./lib.js");

      const env = (key, fallback) => (process.env[key] !== undefined && process.env[key] !== "" ? process.env[key] : fallback);
      const num = (key, fallback) => {
        const value = Number(env(key, fallback));
        if (!Number.isFinite(value) || value < 0) throw new Error(`Invalid numeric setting ${key}`);
        return value;
      };
      const cfg = {
        neverUsedDays: num("NEVER_USED_DAYS", "30"),
        unusedDays: num("UNUSED_DAYS", "90"),
        dormantGraceHours: num("DORMANT_GRACE_HOURS", "72"),
        quarantineDays: num("QUARANTINE_DAYS", "14"),
        exemptDays: num("EXEMPT_DAYS", "180"),
        maxOps: num("MAX_OPS_PER_RUN", "20"),
        maxDisablePct: num("MAX_DISABLE_PCT", "50"),
        deleteExpired: env("DELETE_EXPIRED_TOKENS", "true") === "true",
        protectedRe: new RegExp(env("PROTECTED_NAME_REGEX", "^kestra")),
      };
      if (!env("GRAFANA_URL", "") || !env("GRAFANA_TOKEN", "")) throw new Error("GRAFANA_URL and GRAFANA_TOKEN are required");
      const call = lib.client({ url: env("GRAFANA_URL", ""), token: env("GRAFANA_TOKEN", ""), orgId: env("GRAFANA_ORG_ID", "") });

      const readJson = (file, fallback) => {
        const text = fs.readFileSync(file, "utf8").trim();
        return text === "" || text === "null" ? fallback : JSON.parse(text);
      };
      const iso = (ms) => new Date(ms).toISOString();

      (async () => {
        const now = Date.now();
        const nowIso = iso(now);
        // The account behind GRAFANA_TOKEN can never be disabled or deleted by this flow: Kestra could not undo it.
        const self = await call("GET", "/api/user");
        if (self.status !== 200 || !self.json || typeof self.json.id !== "number") throw new Error(`cannot identify the account behind GRAFANA_TOKEN (HTTP ${self.status}): ${self.text.slice(0, 160)}`);
        const selfId = self.json.id;
        const prev = (readJson("state.json", {}) || {}).sas || {};
        const accounts = await lib.listServiceAccounts(call);
        const findings = [];
        const ops = [];
        const newState = {};
        const snapshot = {};
        let eligible = 0;
        let activeTokens = 0, neverUsedTokens = 0, totalLiveTokens = 0;
        const disableOps = [];

        for (const sa of accounts) {
          const key = String(sa.id);
          const entry = { ...(prev[key] || {}) };
          snapshot[key] = { name: sa.name, isDisabled: sa.isDisabled, tokens: sa.tokens };
          if (sa.id === selfId) { findings.push({ kind: "SELF_PROTECTED", severity: "info", sa: sa.name, detail: `${sa.name} is the account behind GRAFANA_TOKEN and is never changed` }); if (prev[key]) newState[key] = entry; continue; }
          if (cfg.protectedRe.test(sa.name)) { findings.push({ kind: "PROTECTED", severity: "info", sa: sa.name, detail: `${sa.name} matches protected_name_regex and is never changed` }); if (prev[key]) newState[key] = entry; continue; }

          const tokens = sa.tokens > 0 || !sa.isDisabled ? (await lib.listTokens(call, sa.id)) || [] : [];
          const classes = tokens.map((t) => ({ t, c: lib.classifyToken(t, now, cfg) }));
          for (const { t, c } of classes) if (c.state !== "expired") { totalLiveTokens++; if (t.lastUsedAt === null) neverUsedTokens++; if (c.state === "active") activeTokens++; }
          const hasActive = classes.some(({ c }) => c.state === "active");
          const dormant = !sa.isDisabled && classes.length > 0 && !hasActive;
          const exempt = entry.exempt_until && Date.parse(entry.exempt_until) > now;

          if (sa.isDisabled) {
            if (entry.disabled_by_guard) {
              const days = (now - Date.parse(entry.disabled_at)) / lib.DAY;
              if (days >= cfg.quarantineDays) ops.push({ op: "delete_sa", sa_id: sa.id, sa_name: sa.name, reason: `disabled by this guard ${Math.floor(days)} days ago and still disabled`, detail: { role: sa.role, tokens: classes.map(({ t }) => ({ id: t.id, name: t.name, expiration: t.expiration ? iso(t.expiration) : null })) } });
              newState[key] = entry;
            } else if (prev[key]) { newState[key] = { name: sa.name }; }
            continue;
          }

          // Enabled service account.
          if (entry.disabled_by_guard) {
            entry.exempt_until = iso(now + cfg.exemptDays * lib.DAY);
            delete entry.disabled_by_guard; delete entry.disabled_at; delete entry.dormant_since;
            findings.push({ kind: "REINSTATED_BY_OWNER", severity: "info", sa: sa.name, detail: `${sa.name} was disabled by this guard and has been re-enabled, so it is in use; exempt from automatic changes for ${cfg.exemptDays} days` });
          } else if (exempt && dormant) {
            findings.push({ kind: "EXEMPT_DORMANT", severity: "info", sa: sa.name, detail: `${sa.name} looks dormant but is exempt until ${entry.exempt_until.slice(0, 10)}` });
          }
          const isExempt = entry.exempt_until && Date.parse(entry.exempt_until) > now;
          eligible++;

          if (dormant && !isExempt) {
            entry.dormant_since = entry.dormant_since || nowIso;
            const aged = now - Date.parse(entry.dormant_since) >= cfg.dormantGraceHours * 36e5;
            if (aged) disableOps.push({ op: "disable_sa", sa_id: sa.id, sa_name: sa.name, reason: `no active token since ${entry.dormant_since.slice(0, 10)}: ${classes.map(({ c }) => c.reason).join(", ")}` });
          } else {
            delete entry.dormant_since;
          }
          if (!dormant && cfg.deleteExpired) {
            for (const { t, c } of classes) if (c.state === "expired") ops.push({ op: "delete_token", sa_id: sa.id, sa_name: sa.name, token_id: t.id, token_name: t.name, reason: `${c.reason} token` });
          }
          if (Object.keys(entry).length) newState[key] = { ...entry, name: sa.name };
        }

        // Circuit breakers: refuse to disable accounts when the usage data cannot be trusted or the share is implausible.
        let blocked = "";
        if (totalLiveTokens >= 5 && neverUsedTokens === totalLiveTokens) blocked = `none of ${totalLiveTokens} live tokens reports a lastUsedAt, so usage tracking looks unavailable`;
        else if (eligible >= 3 && (disableOps.length * 100) / eligible > cfg.maxDisablePct) blocked = `${disableOps.length} of ${eligible} service accounts would be disabled (more than ${cfg.maxDisablePct}%)`;
        if (blocked) findings.push({ kind: "BLOCKED", severity: "warning", detail: `Disabling is blocked: ${blocked}` });
        else ops.push(...disableOps);

        const order = { delete_token: 0, disable_sa: 1, delete_sa: 2 };
        ops.sort((a, b) => order[a.op] - order[b.op] || a.sa_id - b.sa_id);
        const capped = ops.slice(0, cfg.maxOps);
        const label = { delete_token: "DELETE TOKEN", disable_sa: "DISABLE", delete_sa: "DELETE (irreversible)" };
        const lines = [
          ...capped.map((o) => `• ${label[o.op]} ${o.sa_name}${o.token_name ? " / token " + o.token_name : ""}: ${o.reason}`),
          ...findings.filter((f) => f.severity !== "info" || f.kind === "REINSTATED_BY_OWNER").map((f) => `• [${f.kind}] ${f.detail}`),
          ...(ops.length > capped.length ? [`• ${ops.length - capped.length} more operation(s) wait for the next run (max_ops_per_run)`] : []),
        ];

        fs.writeFileSync("ops.json", JSON.stringify(capped));
        fs.writeFileSync("snapshot.json", JSON.stringify(snapshot));
        fs.writeFileSync("state.json", JSON.stringify({ version: 1, sas: newState }));
        fs.writeFileSync("findings.json", JSON.stringify(findings));
        const attention = findings.filter((f) => f.severity !== "info" || f.kind === "REINSTATED_BY_OWNER").length;
        console.log("::" + JSON.stringify({ outputs: {
          service_accounts: accounts.length,
          ops_count: capped.length,
          token_deletes: capped.filter((o) => o.op === "delete_token").length,
          disables: capped.filter((o) => o.op === "disable_sa").length,
          sa_deletes: capped.filter((o) => o.op === "delete_sa").length,
          findings_count: attention,
          has_ops: capped.length > 0,
          has_attention: capped.length > 0 || attention > 0,
          summary: lines.join("\n"),
        } }) + "::");
      })().catch((err) => { console.error(err.stack || String(err)); process.exit(1); });

  - id: gate_attention
    type: io.kestra.plugin.core.flow.If
    description: Only alert when an operation is planned or a finding such as a blocked run or an owner re-enabling an account needs attention.
    condition: "{{ outputs.scan_service_accounts.vars.has_attention }}"
    then:
      - id: notify_plan
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Post the plan and every finding.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: >-
          {{ {
            "text": ":key: *Grafana service account lifecycle* (execution `" ~ execution.id ~ "`, dry_run=" ~ inputs.dry_run ~ "): " ~ outputs.scan_service_accounts.vars.token_deletes ~ " token delete(s), " ~ outputs.scan_service_accounts.vars.disables ~ " disable(s), " ~ outputs.scan_service_accounts.vars.sa_deletes ~ " account delete(s).",
            "attachments": [ { "color": "#E2B93B", "text": outputs.scan_service_accounts.vars.summary } ]
          } | toJson }}

      - id: gate_ops
        type: io.kestra.plugin.core.flow.If
        description: Findings without an operation end here.
        condition: "{{ outputs.scan_service_accounts.vars.has_ops }}"
        then:
          - id: gate_dry_run
            type: io.kestra.plugin.core.flow.If
            description: Dry runs stop after reporting so the plan can be reviewed for several nights before changes are enabled.
            condition: "{{ inputs.dry_run }}"
            then:
              - id: log_dry_run
                type: io.kestra.plugin.core.log.Log
                description: Record what a real run would do.
                message: "Dry run: {{ outputs.scan_service_accounts.vars.ops_count }} operation(s) would be applied. Set dry_run to false to enable the lifecycle."
            else:
              - id: pause_for_approval
                type: io.kestra.plugin.core.flow.Pause
                description: Hold the plan for an operator. Unapproved plans fail after 12 hours and the state is not advanced.
                pauseDuration: PT12H
                behavior: FAIL
                onResume:
                  - id: confirm_count
                    type: INT
                    defaults: 0
                    description: Type the number of operations listed in the Slack plan. A different number aborts the run.
                  - id: approver_note
                    type: STRING
                    defaults: ""
                    description: Change ticket or reason recorded in the audit entry.

              - id: check_confirmation
                type: io.kestra.plugin.core.flow.If
                description: The operator must have read the plan well enough to repeat its size.
                condition: "{{ (outputs.pause_for_approval.onResume.confirm_count ~ '') != (outputs.scan_service_accounts.vars.ops_count ~ '') }}"
                then:
                  - id: fail_confirmation
                    type: io.kestra.plugin.core.execution.Fail
                    description: Abort before anything is changed.
                    errorMessage: "Confirmation mismatch: the plan has {{ outputs.scan_service_accounts.vars.ops_count }} operation(s) but {{ outputs.pause_for_approval.onResume.confirm_count }} was entered."

              - id: recheck_ops
                type: io.kestra.plugin.scripts.node.Script
                description: Approval can take hours. Re-read Grafana and keep only the operations whose premise still holds, so a token used or an account re-enabled in the meantime is left alone.
                taskRunner:
                  type: io.kestra.plugin.scripts.runner.docker.Docker
                containerImage: node:20-slim
                inputFiles:
                  lib.js: "{{ vars.lib_js }}"
                  ops.json: "{{ outputs.scan_service_accounts.outputFiles['ops.json'] }}"
                env:
                  GRAFANA_URL: "{{ inputs.grafana_url }}"
                  GRAFANA_TOKEN: "{{ secret('GRAFANA_TOKEN') }}"
                  GRAFANA_ORG_ID: "{{ inputs.grafana_org_id }}"
                  NEVER_USED_DAYS: "{{ inputs.never_used_days }}"
                  UNUSED_DAYS: "{{ inputs.unused_days }}"
                outputFiles:
                  - ops_fresh.json
                script: |
                  const fs = require("fs");
                  const lib = require("./lib.js");

                  const env = (key, fallback) => (process.env[key] !== undefined && process.env[key] !== "" ? process.env[key] : fallback);
                  const num = (key, fallback) => Number(env(key, fallback));
                  const cfg = { neverUsedDays: num("NEVER_USED_DAYS", "30"), unusedDays: num("UNUSED_DAYS", "90") };
                  if (!env("GRAFANA_URL", "") || !env("GRAFANA_TOKEN", "")) throw new Error("GRAFANA_URL and GRAFANA_TOKEN are required");
                  const call = lib.client({ url: env("GRAFANA_URL", ""), token: env("GRAFANA_TOKEN", ""), orgId: env("GRAFANA_ORG_ID", "") });

                  // Approval can take hours. Re-evaluate every planned operation against the live state and keep only the ones whose premise still holds.
                  (async () => {
                    const now = Date.now();
                    const ops = JSON.parse(fs.readFileSync("ops.json", "utf8"));
                    const accounts = new Map((await lib.listServiceAccounts(call)).map((s) => [s.id, s]));
                    const tokenCache = new Map();
                    const tokensOf = async (id) => { if (!tokenCache.has(id)) tokenCache.set(id, await lib.listTokens(call, id)); return tokenCache.get(id); };

                    const fresh = [];
                    const dropped = [];
                    for (const op of ops) {
                      const sa = accounts.get(op.sa_id);
                      if (!sa) { dropped.push(`${op.op} ${op.sa_name}: service account no longer exists`); continue; }
                      const tokens = (await tokensOf(op.sa_id)) || [];
                      if (op.op === "delete_token") {
                        const t = tokens.find((x) => x.id === op.token_id);
                        if (!t) dropped.push(`delete_token ${op.sa_name}/${op.token_name}: token already gone`);
                        else if (lib.classifyToken(t, now, cfg).state !== "expired") dropped.push(`delete_token ${op.sa_name}/${op.token_name}: token is no longer expired`);
                        else fresh.push(op);
                      } else if (op.op === "disable_sa") {
                        if (sa.isDisabled) dropped.push(`disable_sa ${op.sa_name}: already disabled by someone else`);
                        else if (tokens.some((t) => lib.classifyToken(t, now, cfg).state === "active")) dropped.push(`disable_sa ${op.sa_name}: a token was used or created during approval`);
                        else fresh.push(op);
                      } else if (op.op === "delete_sa") {
                        if (!sa.isDisabled) dropped.push(`delete_sa ${op.sa_name}: it was re-enabled during approval`);
                        else fresh.push(op);
                      }
                    }
                    fs.writeFileSync("ops_fresh.json", JSON.stringify(fresh));
                    console.log("::" + JSON.stringify({ outputs: { fresh, fresh_count: fresh.length, dropped_count: dropped.length, has_fresh: fresh.length > 0, dropped_summary: dropped.join("; ") } }) + "::");
                  })().catch((err) => { console.error(err.stack || String(err)); process.exit(1); });

              - id: gate_fresh
                type: io.kestra.plugin.core.flow.If
                description: Nothing left after the re-check means nothing to change.
                condition: "{{ outputs.recheck_ops.vars.has_fresh }}"
                then:
                  - id: apply_operations
                    type: io.kestra.plugin.core.flow.Loop
                    description: Apply one operation at a time so a rejected call stops the rollout.
                    values: "{{ outputs.recheck_ops.vars.fresh }}"
                    concurrencyLimit: 1
                    tasks:
                      - id: route_operation
                        type: io.kestra.plugin.core.flow.If
                        description: Expired tokens are deleted directly; accounts are disabled first and deleted only from quarantine.
                        condition: "{{ item.value.op == 'delete_token' }}"
                        then:
                          - id: delete_token
                            type: io.kestra.plugin.core.http.Request
                            description: Delete one expired or revoked service account token.
                            uri: "{{ inputs.grafana_url }}/api/serviceaccounts/{{ item.value.sa_id }}/tokens/{{ item.value.token_id }}"
                            method: DELETE
                            headers:
                              Authorization: "Bearer {{ secret('GRAFANA_TOKEN') }}"
                              X-Grafana-Org-Id: "{{ inputs.grafana_org_id }}"
                            options:
                              allowedResponseCodes:
                                - 200
                        else:
                          - id: route_account_operation
                            type: io.kestra.plugin.core.flow.If
                            description: Disable is reversible; delete is not.
                            condition: "{{ item.value.op == 'disable_sa' }}"
                            then:
                              - id: disable_service_account
                                type: io.kestra.plugin.core.http.Request
                                description: Disable the service account so its tokens stop authenticating. The owner can re-enable it.
                                uri: "{{ inputs.grafana_url }}/api/serviceaccounts/{{ item.value.sa_id }}"
                                method: PATCH
                                headers:
                                  Authorization: "Bearer {{ secret('GRAFANA_TOKEN') }}"
                                  X-Grafana-Org-Id: "{{ inputs.grafana_org_id }}"
                                body: '{"isDisabled": true}'
                                options:
                                  allowedResponseCodes:
                                    - 200
                            else:
                              - id: delete_service_account
                                type: io.kestra.plugin.core.http.Request
                                description: Delete a service account that this flow disabled and nobody re-enabled during quarantine.
                                uri: "{{ inputs.grafana_url }}/api/serviceaccounts/{{ item.value.sa_id }}"
                                method: DELETE
                                headers:
                                  Authorization: "Bearer {{ secret('GRAFANA_TOKEN') }}"
                                  X-Grafana-Org-Id: "{{ inputs.grafana_org_id }}"
                                options:
                                  allowedResponseCodes:
                                    - 200

                  - id: verify_operations
                    type: io.kestra.plugin.scripts.node.Script
                    description: Read Grafana again. Disabled accounts must be disabled, deleted ones gone, deleted tokens absent, and nothing outside the plan may have changed.
                    taskRunner:
                      type: io.kestra.plugin.scripts.runner.docker.Docker
                    containerImage: node:20-slim
                    inputFiles:
                      lib.js: "{{ vars.lib_js }}"
                      ops_fresh.json: "{{ outputs.recheck_ops.outputFiles['ops_fresh.json'] }}"
                      snapshot.json: "{{ outputs.scan_service_accounts.outputFiles['snapshot.json'] }}"
                      state.json: "{{ outputs.scan_service_accounts.outputFiles['state.json'] }}"
                    env:
                      GRAFANA_URL: "{{ inputs.grafana_url }}"
                      GRAFANA_TOKEN: "{{ secret('GRAFANA_TOKEN') }}"
                      GRAFANA_ORG_ID: "{{ inputs.grafana_org_id }}"
                      EXECUTION_ID: "{{ execution.id }}"
                      APPROVER_NOTE: "{{ outputs.pause_for_approval.onResume.approver_note }}"
                    outputFiles:
                      - audit.json
                      - state.json
                    script: |
                      const fs = require("fs");
                      const lib = require("./lib.js");

                      const env = (key, fallback) => (process.env[key] !== undefined && process.env[key] !== "" ? process.env[key] : fallback);
                      if (!env("GRAFANA_URL", "") || !env("GRAFANA_TOKEN", "")) throw new Error("GRAFANA_URL and GRAFANA_TOKEN are required");
                      const call = lib.client({ url: env("GRAFANA_URL", ""), token: env("GRAFANA_TOKEN", ""), orgId: env("GRAFANA_ORG_ID", "") });

                      (async () => {
                        const nowIso = new Date().toISOString();
                        const ops = JSON.parse(fs.readFileSync("ops_fresh.json", "utf8"));
                        const snapshot = JSON.parse(fs.readFileSync("snapshot.json", "utf8"));
                        const state = JSON.parse(fs.readFileSync("state.json", "utf8"));
                        const sas = state.sas || {};
                        const accounts = new Map((await lib.listServiceAccounts(call)).map((s) => [s.id, s]));
                        const mismatches = [];
                        const confirmed = [];
                        const touched = new Set(ops.map((o) => o.sa_id));

                        for (const op of ops) {
                          const sa = accounts.get(op.sa_id);
                          if (op.op === "delete_sa") {
                            if (sa) mismatches.push(`${op.sa_name}: still exists after the delete step`);
                            else { confirmed.push(`delete_sa:${op.sa_name}`); delete sas[String(op.sa_id)]; }
                          } else if (op.op === "disable_sa") {
                            if (!sa) mismatches.push(`${op.sa_name}: disappeared instead of being disabled`);
                            else if (!sa.isDisabled) mismatches.push(`${op.sa_name}: still enabled after the disable step`);
                            else { confirmed.push(`disable_sa:${op.sa_name}`); sas[String(op.sa_id)] = { ...(sas[String(op.sa_id)] || {}), name: op.sa_name, disabled_by_guard: true, disabled_at: nowIso }; delete sas[String(op.sa_id)].dormant_since; }
                          } else if (op.op === "delete_token") {
                            const tokens = sa ? await lib.listTokens(call, op.sa_id) : [];
                            if (tokens && tokens.some((t) => t.id === op.token_id)) mismatches.push(`${op.sa_name}/${op.token_name}: token still exists after the delete step`);
                            else confirmed.push(`delete_token:${op.sa_name}/${op.token_name}`);
                          }
                        }
                        // Collateral check: nothing outside the plan may have been disabled, deleted or lost tokens.
                        for (const [id, snap] of Object.entries(snapshot)) {
                          if (touched.has(Number(id))) continue;
                          const now = accounts.get(Number(id));
                          if (!now) mismatches.push(`${snap.name}: disappeared although it was not in the plan`);
                          else if (now.isDisabled !== snap.isDisabled) mismatches.push(`${snap.name}: enabled state changed although it was not in the plan`);
                          else if (now.tokens < snap.tokens) mismatches.push(`${snap.name}: lost tokens although it was not in the plan`);
                        }

                        const verified = mismatches.length === 0;
                        const audit = {
                          executed_at: nowIso,
                          execution_id: process.env.EXECUTION_ID || "",
                          verified,
                          confirmed,
                          approver_note: process.env.APPROVER_NOTE || "",
                          mismatches,
                          // Rollback and forensics: a disable is reversed with PATCH isDisabled=false; deleted accounts are recorded as they were.
                          operations: ops,
                        };
                        fs.writeFileSync("audit.json", JSON.stringify(audit));
                        fs.writeFileSync("state.json", JSON.stringify({ version: 1, sas }));
                        console.log("::" + JSON.stringify({ outputs: { verified, confirmed: confirmed.length, mismatch_summary: mismatches.slice(0, 10).join("; ") } }) + "::");
                      })().catch((err) => { console.error(err.stack || String(err)); process.exit(1); });

                  - id: check_verification
                    type: io.kestra.plugin.core.flow.If
                    description: A Grafana that does not match the plan is an incident, not a success.
                    condition: "{{ not outputs.verify_operations.vars.verified }}"
                    then:
                      - id: fail_verification
                        type: io.kestra.plugin.core.execution.Fail
                        description: Stop before the lifecycle state is advanced.
                        errorMessage: "Grafana does not match the plan after the changes: {{ outputs.verify_operations.vars.mismatch_summary }}"

                  - id: record_audit
                    type: io.kestra.plugin.core.kv.Set
                    description: Keep the last verified change set, including what was deleted and how to reverse a disable.
                    key: "{{ render(vars.audit_key) }}"
                    kvType: JSON
                    value: "{{ read(outputs.verify_operations.outputFiles['audit.json']) }}"

                  - id: persist_state_after_apply
                    type: io.kestra.plugin.core.kv.Set
                    description: Store the dormant, quarantine and exemption timers after the verified changes.
                    key: "{{ render(vars.state_key) }}"
                    kvType: STRING
                    value: "{{ read(outputs.verify_operations.outputFiles['state.json']) }}"

                  - id: notify_result
                    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
                    description: Confirm the verified result and say how many operations the re-check dropped.
                    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
                    payload: >-
                      {{ {
                        "text": ":white_check_mark: *Grafana service account lifecycle* verified: " ~ outputs.verify_operations.vars.confirmed ~ " operation(s) confirmed, " ~ outputs.recheck_ops.vars.dropped_count ~ " dropped by the re-check (execution `" ~ execution.id ~ "`)."
                      } | toJson }}
                else:
                  - id: persist_state_nothing_fresh
                    type: io.kestra.plugin.core.kv.Set
                    description: Every operation became stale during approval; keep the timers and change nothing.
                    key: "{{ render(vars.state_key) }}"
                    kvType: STRING
                    value: "{{ read(outputs.scan_service_accounts.outputFiles['state.json']) }}"
        else:
          - id: log_findings_only
            type: io.kestra.plugin.core.log.Log
            description: Findings such as a blocked run need a human, not an automated change.
            message: "No operation planned. {{ outputs.scan_service_accounts.vars.findings_count }} finding(s) reported."
    else:
      - id: log_nothing_due
        type: io.kestra.plugin.core.log.Log
        description: Every service account is active, protected or still inside a grace window.
        message: "Checked {{ outputs.scan_service_accounts.vars.service_accounts }} service account(s): nothing due."

  - id: gate_persist
    type: io.kestra.plugin.core.flow.If
    description: Runs that changed nothing store their timers here; runs that applied changes stored them after verification.
    condition: "{{ (not outputs.scan_service_accounts.vars.has_ops) or inputs.dry_run }}"
    then:
      - id: persist_state
        type: io.kestra.plugin.core.kv.Set
        description: Advance the dormant and quarantine timers only after the run finished cleanly.
        key: "{{ render(vars.state_key) }}"
        kvType: STRING
        value: "{{ read(outputs.scan_service_accounts.outputFiles['state.json']) }}"

errors:
  - id: alert_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Page the channel when Grafana returns an unexpected shape, approval times out, confirmation is wrong or verification finds a mismatch.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: >-
      {{ {
        "text": ":rotating_light: *Grafana service account lifecycle failed* (execution `" ~ execution.id ~ "`). The timers were not advanced; check disabled accounts before the next run."
      } | toJson }}

extend:
  title: Grafana Service Account Token Quarantine and Expiry Lifecycle Gate
  metaTitle: Grafana Service Account Token Lifecycle with Quarantine | Kestra
  shortDescription: Finds dormant Grafana service accounts, disables them after a grace window, deletes them only after quarantine, cleans expired tokens, and verifies every change after approval.
  metaDescription: Disable dormant Grafana service accounts, delete after quarantine, clean expired tokens, with count-confirmed approval, re-check and API verification.
  description: |
    Service accounts and tokens outlive the people and pipelines that created them, and deleting a live one breaks production. This blueprint retires them in reversible stages instead: observe, disable, then delete only after quarantine.

    ## How it works

    1. A nightly schedule or a webhook starts the flow; `concurrency` allows one run at a time.
    2. `scan_service_accounts` pages through `/api/serviceaccounts/search` and reads each account's tokens. Expiry is judged from `hasExpired`, because `secondsUntilExpiration` is only filled within 7 days. A token is unused when it was never used for `never_used_days` or idle for `unused_days`.
    3. An enabled account with tokens but none active is dormant. The KV state records when it became dormant; after `dormant_grace_hours` it is planned for disable. Only accounts this flow disabled are planned for delete, after `quarantine_days`.
    4. An account the flow disabled that someone re-enables is treated as in use and exempted for `exempt_days`. Disabling is refused when no token reports `lastUsedAt` or the share is implausible.
    5. `pause_for_approval` holds the plan and the operator types the operation count.
    6. `recheck_ops` re-reads Grafana and drops operations whose premise changed during approval.
    7. `apply_operations` loops over the rest with `io.kestra.plugin.core.http.Request` (PATCH `isDisabled`, DELETE account, DELETE token).
    8. `verify_operations` confirms every result and that nothing else changed.

    ## What you get

    - Reversible retirement with a quarantine period and learning from owners who re-enable an account.
    - Protection against trusting broken usage data.
    - An audit entry with the reverse action for each disable.

    ## Who it's for

    - Platform and security teams that own a shared Grafana.

    ## Why orchestrate this with Kestra

    The lifecycle spans weeks, needs a human decision and must re-check reality before acting. KV, `Pause`, `Loop` and verification are one flow.

    ## Prerequisites

    - Grafana 10 or later with service accounts, Docker on the worker and a Slack webhook.
    - A service account token with the Admin role to manage service accounts. The account behind this token is never changed, whatever it is called.

    ### Secrets

    - `GRAFANA_TOKEN`: service account token used for all calls.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook.
    - `GRAFANA_SA_GUARD_WEBHOOK_KEY`: key protecting the webhook trigger.

    ## Quick start

    1. Run `docker run -d -p 3000:3000 grafana/grafana:12.4.11`, then create a `kestra` service account with a token in the UI and store it as `GRAFANA_TOKEN`.
    2. Create a few service accounts with tokens, leave one unused, and execute with `dry_run: true` and `never_used_days: 0`.
    3. Execute with `dry_run: false`, `dormant_grace_hours: 0`, resume the pause with the planned count and check the verified message.
    4. Re-run with `quarantine_days: 0` to see the delete stage.

    ## How to extend

    - Notify the token owner in Slack before the disable stage.
    - Add rotation by creating a replacement token before deleting an old one.

    ## Links

    - [Grafana service accounts](https://grafana.com/docs/grafana/latest/administration/service-accounts/)
    - [Grafana service account HTTP API](https://grafana.com/docs/grafana/latest/developers/http_api/serviceaccount/)
    - [Kestra HTTP Request](https://kestra.io/plugins/core/http/io.kestra.plugin.core.http.request)
    - [Kestra Pause](https://kestra.io/plugins/core/flow/io.kestra.plugin.core.flow.pause)

  tags:
    - Infrastructure
  subTags:
    - Approval Gates
    - Day 2 Operations
  ee: false
  demo: false
