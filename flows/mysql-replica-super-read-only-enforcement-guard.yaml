id: mysql-replica-super-read-only-enforcement-guard
namespace: company.team

inputs:
  - id: target_url
    type: STRING
    defaults: jdbc:mysql://localhost:3306/
    description: JDBC URL of the MySQL instance to check. Point this at a replica. An instance with no replication configured is reported and left untouched, so a source pointed at by mistake is never frozen.

  - id: use_secret_auth
    type: BOOL
    defaults: true
    description: Leave true in production so the connection reads MYSQL_USERNAME and MYSQL_PASSWORD from secrets. Set false only to pass credentials inline in a disposable test environment.

  - id: mysql_username
    type: STRING
    defaults: root
    description: Username used only when use_secret_auth is false. Ignored in production.

  - id: mysql_password
    type: STRING
    defaults: ""
    description: Password used only when use_secret_auth is false. Ignored in production.

  - id: dry_run
    type: BOOL
    defaults: true
    description: When true, report the read-only state of the instance without changing it.

  - id: auto_remediate
    type: BOOL
    defaults: false
    description: When true and dry_run is false, set super_read_only ON behind an approval gate, then re-read the state and fail if the instance is still writable.

triggers:
  - id: schedule
    type: io.kestra.plugin.core.trigger.Schedule
    disabled: true
    cron: "*/15 * * * *"
    description: Check replica write protection every fifteen minutes. Disabled by default and pinned to safe mode so it reports without changing anything until an operator enables it.
    inputs:
      dry_run: true
      auto_remediate: false

tasks:
  - id: detect_replication
    type: io.kestra.plugin.jdbc.mysql.Query
    description: Read SHOW REPLICA STATUS. A returned row is the only proof that this instance is a replica. Zero rows means replication is not configured, which is how a source is recognised and left alone.
    url: "{{ inputs.target_url }}"
    username: "{{ inputs.use_secret_auth ? secret('MYSQL_USERNAME') : inputs.mysql_username }}"
    password: "{{ inputs.use_secret_auth ? secret('MYSQL_PASSWORD') : inputs.mysql_password }}"
    fetchType: FETCH
    sql: SHOW REPLICA STATUS

  - id: detect_state
    type: io.kestra.plugin.jdbc.mysql.Query
    description: Read the global write protection and the GTID set the instance has executed. super_read_only blocks writes from every client including a user holding CONNECTION_ADMIN, which is what a replica needs.
    url: "{{ inputs.target_url }}"
    username: "{{ inputs.use_secret_auth ? secret('MYSQL_USERNAME') : inputs.mysql_username }}"
    password: "{{ inputs.use_secret_auth ? secret('MYSQL_PASSWORD') : inputs.mysql_password }}"
    fetchType: FETCH_ONE
    sql: >-
      SELECT IF(@@global.super_read_only, 'ON', 'OFF') AS sro_state, IF(@@global.read_only, 'ON', 'OFF') AS ro_state, @@global.server_id AS server_id, @@global.hostname AS host_name, REPLACE(@@global.gtid_executed, CHAR(10), ' ') AS gtid_executed

  - id: classify
    type: io.kestra.plugin.core.output.OutputValues
    description: >-
      Sort the instance into one state. NOT_A_REPLICA is zero SHOW REPLICA STATUS rows. COMPLIANT is a replica that already has super_read_only ON. WRITABLE_REPLICA is a replica with super_read_only OFF, which accepts a stray client write that only ever exists on that replica.
    values:
      classification: >-
        {{ {'repl_rows': (outputs.detect_replication.size ?? 0), 'sro': outputs.detect_state.row.sro_state} | jq('if .repl_rows == 0 then "NOT_A_REPLICA" elif .sro == "ON" then "COMPLIANT" else "WRITABLE_REPLICA" end') | first }}
      sro_before: "{{ outputs.detect_state.row.sro_state }}"
      ro_before: "{{ outputs.detect_state.row.ro_state }}"
      server_id: "{{ outputs.detect_state.row.server_id }}"
      host_name: "{{ outputs.detect_state.row.host_name }}"
      gtid_executed: "{{ outputs.detect_state.row.gtid_executed }}"
      replica_rows: "{{ outputs.detect_replication.size ?? 0 }}"
      source_host: >-
        {{ (outputs.detect_replication.rows ?? []) | jq('if length == 0 then "none" else (.[0].Source_Host // "unknown") end') | first }}
      io_running: >-
        {{ (outputs.detect_replication.rows ?? []) | jq('if length == 0 then "n/a" else (.[0].Replica_IO_Running // "No") end') | first }}
      sql_running: >-
        {{ (outputs.detect_replication.rows ?? []) | jq('if length == 0 then "n/a" else (.[0].Replica_SQL_Running // "No") end') | first }}

  - id: log_status
    type: io.kestra.plugin.core.log.Log
    message: |
      MySQL instance {{ outputs.classify.values.host_name }} (server_id {{ outputs.classify.values.server_id }}) at {{ inputs.target_url }} classified {{ outputs.classify.values.classification }}.
      super_read_only={{ outputs.classify.values.sro_before }} read_only={{ outputs.classify.values.ro_before }}. SHOW REPLICA STATUS rows={{ outputs.classify.values.replica_rows }} source_host={{ outputs.classify.values.source_host }} Replica_IO_Running={{ outputs.classify.values.io_running }} Replica_SQL_Running={{ outputs.classify.values.sql_running }}.
      Executed GTID set: {{ outputs.classify.values.gtid_executed }}
      Mode dry_run={{ inputs.dry_run }} auto_remediate={{ inputs.auto_remediate }}.

  - id: route
    type: io.kestra.plugin.core.flow.Switch
    value: "{{ outputs.classify.values.classification }}"
    cases:
      COMPLIANT:
        - id: compliant_log
          type: io.kestra.plugin.core.log.Log
          message: "Replica {{ outputs.classify.values.host_name }} already has super_read_only ON and read_only {{ outputs.classify.values.ro_before }}. A client write is refused, so no errant transaction can be created here. Nothing to do."
      NOT_A_REPLICA:
        - id: not_a_replica_alert
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: The target returned no SHOW REPLICA STATUS row, so it is not a replica. Nothing is changed on it. Setting read_only on a source would stop application writes.
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {"text": "MySQL super_read_only guard: {{ inputs.target_url }} (host {{ outputs.classify.values.host_name }}, server_id {{ outputs.classify.values.server_id }}) returned no SHOW REPLICA STATUS row, so it is not a replica. No change was made. It is still super_read_only {{ outputs.classify.values.sro_before }} and read_only {{ outputs.classify.values.ro_before }}. Point target_url at a replica. Execution {{ execution.id }}."}
        - id: not_a_replica_fail
          type: io.kestra.plugin.core.execution.Fail
          errorMessage: >-
            Target {{ inputs.target_url }} (host {{ outputs.classify.values.host_name }}, server_id {{ outputs.classify.values.server_id }}) returned no SHOW REPLICA STATUS row, so replication is not configured on it. The guard refused to touch it and left super_read_only {{ outputs.classify.values.sro_before }} with read_only {{ outputs.classify.values.ro_before }}. Enforcing read-only on a source would stop every application write. Point target_url at a replica.
      WRITABLE_REPLICA:
        - id: writable_alert
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: Alert on every writable replica, in dry run as well as in remediate mode, so a human sees the exposure even when nothing is changed.
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {"text": "MySQL super_read_only guard: replica {{ outputs.classify.values.host_name }} (server_id {{ outputs.classify.values.server_id }}) at {{ inputs.target_url }} is replicating from {{ outputs.classify.values.source_host }} with super_read_only OFF and read_only {{ outputs.classify.values.ro_before }}. A stray client write lands only here and becomes an errant transaction that diverges the GTID set from the source. dry_run={{ inputs.dry_run }} auto_remediate={{ inputs.auto_remediate }}. Execution {{ execution.id }}."}
        - id: mode
          type: io.kestra.plugin.core.flow.If
          condition: "{{ inputs.auto_remediate and not inputs.dry_run }}"
          then:
            - id: approval_gate
              type: io.kestra.plugin.core.flow.Pause
              description: Hold the run until a human approves the change. SET GLOBAL super_read_only never runs on its own.
              pauseDuration: PT1H
              behavior: FAIL
              onResume:
                - id: approved
                  type: BOOL
                  defaults: false
                  description: Set true to run SET GLOBAL super_read_only = ON on this replica. Anything else leaves the replica writable.
            - id: apply
              type: io.kestra.plugin.core.flow.If
              condition: "{{ outputs.approval_gate.onResume.approved ?? false }}"
              then:
                - id: enforce_super_read_only
                  type: io.kestra.plugin.jdbc.mysql.Query
                  description: Set super_read_only ON, which also sets read_only ON. allowFailure so a rejected statement does not end the pass and the re-read stays the real gate. Replication applier threads are not affected by either variable, so the replica keeps applying from the source.
                  allowFailure: true
                  url: "{{ inputs.target_url }}"
                  username: "{{ inputs.use_secret_auth ? secret('MYSQL_USERNAME') : inputs.mysql_username }}"
                  password: "{{ inputs.use_secret_auth ? secret('MYSQL_PASSWORD') : inputs.mysql_password }}"
                  fetchType: NONE
                  sql: SET GLOBAL super_read_only = ON
                - id: settle
                  type: io.kestra.plugin.core.flow.Sleep
                  duration: PT3S
                - id: reverify_state
                  type: io.kestra.plugin.jdbc.mysql.Query
                  description: Re-read both variables. This read is the proof, not the SET GLOBAL call.
                  url: "{{ inputs.target_url }}"
                  username: "{{ inputs.use_secret_auth ? secret('MYSQL_USERNAME') : inputs.mysql_username }}"
                  password: "{{ inputs.use_secret_auth ? secret('MYSQL_PASSWORD') : inputs.mysql_password }}"
                  fetchType: FETCH_ONE
                  sql: >-
                    SELECT IF(@@global.super_read_only, 'ON', 'OFF') AS sro_state, IF(@@global.read_only, 'ON', 'OFF') AS ro_state, REPLACE(@@global.gtid_executed, CHAR(10), ' ') AS gtid_executed
                - id: reverify_replication
                  type: io.kestra.plugin.jdbc.mysql.Query
                  description: Re-read SHOW REPLICA STATUS so the run also proves the change did not disturb the replication threads.
                  url: "{{ inputs.target_url }}"
                  username: "{{ inputs.use_secret_auth ? secret('MYSQL_USERNAME') : inputs.mysql_username }}"
                  password: "{{ inputs.use_secret_auth ? secret('MYSQL_PASSWORD') : inputs.mysql_password }}"
                  fetchType: FETCH
                  sql: SHOW REPLICA STATUS
                - id: verify
                  type: io.kestra.plugin.core.output.OutputValues
                  values:
                    enforced: >-
                      {{ {'sro': outputs.reverify_state.row.sro_state, 'ro': outputs.reverify_state.row.ro_state} | jq('.sro == "ON" and .ro == "ON"') | first }}
                    sro_after: "{{ outputs.reverify_state.row.sro_state }}"
                    ro_after: "{{ outputs.reverify_state.row.ro_state }}"
                    gtid_after: "{{ outputs.reverify_state.row.gtid_executed }}"
                    io_after: >-
                      {{ (outputs.reverify_replication.rows ?? []) | jq('if length == 0 then "n/a" else (.[0].Replica_IO_Running // "No") end') | first }}
                    sql_after: >-
                      {{ (outputs.reverify_replication.rows ?? []) | jq('if length == 0 then "n/a" else (.[0].Replica_SQL_Running // "No") end') | first }}
                - id: verify_result
                  type: io.kestra.plugin.core.flow.If
                  condition: "{{ outputs.verify.values.enforced == 'true' }}"
                  then:
                    - id: remediated
                      type: io.kestra.plugin.core.log.Log
                      message: |
                        Write protection confirmed on {{ outputs.classify.values.host_name }}. Before: super_read_only={{ outputs.classify.values.sro_before }} read_only={{ outputs.classify.values.ro_before }}. After: super_read_only={{ outputs.verify.values.sro_after }} read_only={{ outputs.verify.values.ro_after }}.
                        Replication still running: Replica_IO_Running={{ outputs.verify.values.io_after }} Replica_SQL_Running={{ outputs.verify.values.sql_after }}. Executed GTID set after the change: {{ outputs.verify.values.gtid_after }}
                  else:
                    - id: remediation_failed
                      type: io.kestra.plugin.core.execution.Fail
                      errorMessage: >-
                        Replica {{ outputs.classify.values.host_name }} at {{ inputs.target_url }} is still writable after the change. The re-read reports super_read_only {{ outputs.verify.values.sro_after }} and read_only {{ outputs.verify.values.ro_after }}. The connecting user probably lacks SYSTEM_VARIABLES_ADMIN. Something may also have set the variable back. The replica still accepts client writes, so a stray write can still become an errant transaction.
              else:
                - id: not_approved
                  type: io.kestra.plugin.core.log.Log
                  message: "Approval not granted, so SET GLOBAL super_read_only was not run. Replica {{ outputs.classify.values.host_name }} is still writable with super_read_only {{ outputs.classify.values.sro_before }}."
          else:
            - id: report_only
              type: io.kestra.plugin.core.log.Log
              message: "Report only (dry_run={{ inputs.dry_run }}, auto_remediate={{ inputs.auto_remediate }}). Replica {{ outputs.classify.values.host_name }} has super_read_only {{ outputs.classify.values.sro_before }} and read_only {{ outputs.classify.values.ro_before }}. SET GLOBAL super_read_only = ON would be run here. No change made."
    defaults:
      - id: unexpected_fail
        type: io.kestra.plugin.core.execution.Fail
        errorMessage: "Unexpected classification {{ outputs.classify.values.classification }} for {{ inputs.target_url }}."

errors:
  - id: alert_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Post to Slack on any failure, including an unreachable instance, a target that is not a replica or a replica that is still writable after the change.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {"text": "MySQL super_read_only guard FAILED for {{ inputs.target_url }} (execution {{ execution.id }}). Either the instance is unreachable, it is not a replica or it is still writable after the change. Check the run."}

extend:
  title: MySQL Replica super_read_only Enforcement Guard
  shortDescription: Find a MySQL replica that accepts client writes because super_read_only is OFF, set it ON behind a dry-run and approval gate, then re-read both variables and fail if the replica is still writable. An instance with no replication configured is never touched.
  metaTitle: MySQL Replica super_read_only Enforcement Guard with Kestra
  metaDescription: Detect a MySQL replica with super_read_only OFF, enforce it behind a dry-run and approval gate, then re-read and fail if the replica is still writable.
  description: |
    A read replica with `super_read_only` OFF accepts a stray write from any client that reaches it. That write exists only on the replica, so it becomes an errant transaction: the replica's GTID set diverges from the source. The moment that replica is promoted the data is wrong in a way no backup catches. The failover plan quietly stops being safe. This guard finds a replica that is still writable, sets `super_read_only` ON behind an approval gate, then proves the protection landed.

    This blueprint was created by [zkasuran](https://github.com/zkasuran).

    ## Safety

    - The whole remediation is gated on `SHOW REPLICA STATUS` returning a row. An instance with no replication configured is reported and left exactly as it was, so a source pointed at by mistake is never frozen. That refusal is the most important behaviour in this flow, because enforcing read-only on a source stops every application write.
    - Read-only by default. `dry_run` is true and `auto_remediate` is false, so a plain run reports and changes nothing.
    - A change happens only when `auto_remediate` is true and `dry_run` is false. It then waits for a human to resume the `Pause` with `approved` set true. An unanswered gate reads as not approved.
    - `SET GLOBAL super_read_only = ON` does not affect the replication applier threads, so the replica keeps applying from the source. The run re-reads `SHOW REPLICA STATUS` to show that.
    - The change is not persisted to `mysqld-auto.cnf` and survives only until restart. Put `super_read_only=ON` in the replica config as well so a restart comes back protected.

    ## How it works

    1. `detect_replication` (`io.kestra.plugin.jdbc.mysql.Query`) reads `SHOW REPLICA STATUS`. A returned row is the only proof that the instance is a replica.
    2. `detect_state` (`io.kestra.plugin.jdbc.mysql.Query`) reads `@@global.super_read_only`, `@@global.read_only`, the server id, the hostname and the executed GTID set.
    3. `classify` (`io.kestra.plugin.core.output.OutputValues`) sorts the instance into one state. NOT_A_REPLICA is zero status rows. COMPLIANT is a replica with `super_read_only` already ON. WRITABLE_REPLICA is a replica with `super_read_only` OFF.
    4. `log_status` (`io.kestra.plugin.core.log.Log`) records both variables, the replication threads and the GTID set.
    5. `route` (`io.kestra.plugin.core.flow.Switch`) branches on the classification. COMPLIANT logs and ends. NOT_A_REPLICA alerts, fails and changes nothing.
    6. For WRITABLE_REPLICA, `writable_alert` posts the exposure. `mode` (`io.kestra.plugin.core.flow.If`) enters remediation only when `auto_remediate` is true and `dry_run` is false. Otherwise `report_only` logs what would run.
    7. `approval_gate` (`io.kestra.plugin.core.flow.Pause`) holds the run until a human resumes it with `approved`. `enforce_super_read_only` then runs `SET GLOBAL super_read_only = ON`, which also sets `read_only` ON.
    8. `reverify_state` re-reads both variables and `reverify_replication` re-reads `SHOW REPLICA STATUS`. `verify_result` fails the run through `io.kestra.plugin.core.execution.Fail` unless both variables come back ON.

    ## What you get

    - A check that tells a replica apart from a source before it changes anything, so the guard is safe to schedule across a fleet.
    - An enforcement step that only ever runs after a dry run, an explicit mode switch and a human approval.
    - Real proof. The run passes only when a second read shows `super_read_only` and `read_only` both ON, with the replication threads still running.
    - Slack alerts on a writable replica, on a target that is not a replica and on any failure.

    ## Who it's for

    - Platform engineers who keep MySQL read replicas behind a failover plan and need the write protection to be true rather than assumed.
    - DBAs who have had to clean an errant transaction out of a replica's GTID set after a stray write.
    - Teams running a fleet of replicas where one rebuilt or restarted node comes back without the read-only settings.

    ## Why orchestrate this with Kestra

    MySQL has no scheduler, no approval step and no way to prove a variable change landed. Kestra adds all of it. It polls each instance, refuses to act on anything that is not a replica, gates the change behind dry run and human approval, re-reads the server to turn a hopeful `SET GLOBAL` into a verified one, shares one connection definition across every task and posts to Slack the moment a replica is found writable or a step fails.

    ## Tested end to end

    Run on Kestra 2.0.5 against a MySQL 8.0 source and replica pair with GTID replication.

    - Detector can fail: the same replica returned COMPLIANT with `super_read_only` ON, then WRITABLE_REPLICA after `SET GLOBAL super_read_only = OFF`.
    - Dry run on a writable replica detected it, alerted and changed nothing (`@@super_read_only` still 0 in the mysql client).
    - Remediate with approval moved the replica from `super_read_only` 0 and `read_only` 0 to 1 and 1, confirmed in the mysql client, with both replication threads still Yes.
    - The approval gate held. A run resumed with `approved` false ran no statement and left the replica writable.
    - Pointed at the source, the flow classified NOT_A_REPLICA, refused to act and failed. The source stayed `super_read_only` 0 and `read_only` 0, verified in the mysql client after the run.
    - A connecting user without SYSTEM_VARIABLES_ADMIN had its `SET GLOBAL` rejected. The re-read reported OFF and the run failed instead of reporting success.
    - An unreachable instance failed the first read and fired the Slack alert from the `errors` block.

    ## Prerequisites

    A MySQL replica reachable over JDBC. The connecting user needs REPLICATION CLIENT to read `SHOW REPLICA STATUS` and SYSTEM_VARIABLES_ADMIN to set `super_read_only`. Without the second privilege the flow still detects and reports. The re-read then fails the run rather than claiming success.

    ### Secrets

    - `MYSQL_USERNAME`: MySQL user, read when `use_secret_auth` is true.
    - `MYSQL_PASSWORD`: password for that user.
    - `SLACK_WEBHOOK_URL`: used by the alerts and the `errors` block.
    - In Kestra OSS, provide each secret as a base64-encoded environment variable prefixed `SECRET_`.

    ### Inputs

    | Name | Type | Default | Description |
    | :--- | :--- | :--- | :--- |
    | `target_url` | STRING | `jdbc:mysql://localhost:3306/` | JDBC URL of the instance to check. |
    | `use_secret_auth` | BOOL | `true` | Read credentials from secrets. Set false only for inline test credentials. |
    | `mysql_username` | STRING | `root` | Username used only when use_secret_auth is false. |
    | `mysql_password` | STRING | `` | Password used only when use_secret_auth is false. |
    | `dry_run` | BOOL | `true` | Report without changing the variables. |
    | `auto_remediate` | BOOL | `false` | Enforce behind the approval gate when dry_run is false. |

    ## Quick start

    1. Set `MYSQL_USERNAME`, `MYSQL_PASSWORD` and `SLACK_WEBHOOK_URL` as namespace secrets.
    2. Import this flow.
    3. Run it with `target_url` pointed at a replica. The default dry run reports both variables and the replication state.
    4. To enforce, run again with `dry_run` false and `auto_remediate` true, then resume the paused execution with `approved` true.

    ## How to extend

    - Check a fleet from one flow by moving the two reads and the enforcement into a loop over replica URLs with `concurrencyLimit: 1`.
    - Compare `@@global.gtid_executed` against the source's `gtid_executed` with `GTID_SUBTRACT` to report an errant transaction that was already written.
    - Add `read_only_admin_check` style gates for `innodb_read_only` or for a proxy that still routes writes to the replica.
    - Fail the run as soon as a writable replica is found, for a compliance check with no remediation at all.
    - Write the finding to a ticket so the config fix that makes the setting survive a restart is tracked.

    ## Links

    - MySQL plugin: https://kestra.io/plugins/plugin-jdbc-mysql
    - super_read_only: https://dev.mysql.com/doc/refman/8.0/en/server-system-variables.html#sysvar_super_read_only
    - Errant transactions and GTID: https://dev.mysql.com/doc/refman/8.0/en/replication-mode-change-online-concepts.html
    - Schedule trigger: https://kestra.io/plugins/core/triggers/io.kestra.plugin.core.trigger.schedule
  tags:
    - Data
    - Infrastructure
  subTags:
    - Day 2 Operations
    - Monitoring & Alerting
  ee: false
  demo: false
