id: openfda-recall-enforcement-watch
namespace: company.team

description: |
  Watch FDA drug, device and food recalls for the firms, product keywords and NDCs you care about.
  Each run queries the openFDA enforcement endpoints for the report-date window since the last
  run (with an overlap for late publication), pages through the results with limit/skip, treats
  openFDA's 404 "No matches found!" as zero results, lands every recall of the window in Parquet
  with DuckDB, diffs the recall numbers against the ones already seen and alerts in Slack on new
  or reclassified Class I and Class II recalls. Works without an API key.

inputs:
  - id: firms
    type: ARRAY
    itemType: STRING
    defaults:
      - Baxter
      - B. Braun
      - Fresenius Kabi
      - Medtronic
    description: Recalling firm names, matched as a phrase against `recalling_firm` ("Baxter" matches "Baxter Healthcare Corporation"). Applied to every endpoint.

  - id: product_keywords
    type: ARRAY
    itemType: STRING
    defaults:
      - insulin
      - heparin
    description: Phrases matched against `product_description` on every endpoint. The default `heparin` has no recall in the last six months, so the first run also shows a term with zero hits.

  - id: ndcs
    type: ARRAY
    itemType: STRING
    defaults:
      - 0536-1261
      - 0409-4888
    description: NDC labeler-product codes (with dashes, as printed on the label). Searched in the drug endpoint only, in `product_description` and `openfda.product_ndc`. One of the defaults is a real recalled product, the other is clean.

  - id: endpoints
    type: ARRAY
    itemType: STRING
    defaults:
      - drug
      - device
    description: openFDA enforcement endpoints to query, any of `drug`, `device`, `food`. Leave all three watch lists empty to watch every recall of these endpoints.

  - id: alert_classes
    type: ARRAY
    itemType: STRING
    defaults:
      - Class I
      - Class II
    description: Recall classifications that alert. Recalls of other classes are landed and listed in the CSV but do not alert.

  - id: lookback_days
    type: INT
    defaults: 180
    description: Size of the first (baseline) window. Later runs start from the last checked date minus `overlap_days`.

  - id: overlap_days
    type: INT
    defaults: 14
    description: Days re-read before the last checked date. openFDA publishes the weekly enforcement report with a lag of one to two weeks, so recalls can appear with a report_date already behind the previous run; the recall-number diff keeps the overlap from alerting twice.

  - id: since
    type: DATE
    required: false
    description: Optional window start to backfill or re-read a period. Overrides the stored state for this run.

  - id: page_size
    type: INT
    defaults: 100
    min: 10
    max: 1000
    description: openFDA `limit` per request (max 1000). Pages are fetched with `skip` until the reported total is reached; openFDA caps `skip` at 25,000.

  - id: use_api_key
    type: BOOL
    defaults: false
    description: Send the `OPENFDA_API_KEY` secret as `api_key`. Keyless access allows 240 requests per minute and 1,000 per day per IP, which is plenty for a daily watchlist.

  - id: state_key
    type: STRING
    defaults: openfda_recall_watch
    description: Prefix of the two KV keys holding the state. Use one prefix per watchlist.

triggers:
  - id: daily
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 7 * * *"
    description: openFDA refreshes the enforcement data weekly, on varying days; a daily check picks up each refresh within a day.

tasks:
  - id: checked_through
    type: io.kestra.plugin.core.kv.Get
    key: "{{ inputs.state_key }}_checked_through"
    errorOnMissing: false
    description: Last window end (YYYY-MM-DD). Missing on the first run, which then reads `lookback_days`.

  - id: previous_seen
    type: io.kestra.plugin.core.kv.Get
    key: "{{ inputs.state_key }}_seen"
    errorOnMissing: false
    description: URI of the Parquet file with every recall number reported so far.

  - id: bootstrap
    type: io.kestra.plugin.core.flow.If
    description: First run only. Writes an empty seen set with the right schema so every later task has one code path.
    condition: "{{ outputs.previous_seen.value is not defined or outputs.previous_seen.value is empty }}"
    then:
      - id: empty_seen
        type: io.kestra.plugin.jdbc.duckdb.Queries
        url: "jdbc:duckdb:"
        fetchType: NONE
        outputFiles:
          - seen_parquet
        sql: |
          CREATE TABLE seen (
            recall_number VARCHAR, endpoint VARCHAR, event_id VARCHAR, classification VARCHAR, status VARCHAR,
            report_date DATE, recalling_firm VARCHAR, first_seen_at TIMESTAMP, last_seen_at TIMESTAMP
          );
          COPY seen TO '{{ outputFiles.seen_parquet }}' (FORMAT PARQUET);

  - id: plan
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: |
      Builds the report_date window and one openFDA search per endpoint. Firms become `recalling_firm:"..."` phrases,
      keywords `product_description:"..."`, NDCs `product_description:"..." OR openfda.product_ndc:"..."` (drug only).
      Double quotes are stripped from terms so a term cannot break the query. An endpoint with no applicable term
      (for example `device` with only NDCs) is skipped; with no terms at all every recall of the window is fetched.
    url: "jdbc:duckdb:"
    fetchType: FETCH_ONE
    parameters:
      firms: "{{ inputs.firms | toJson }}"
      keywords: "{{ inputs.product_keywords | toJson }}"
      ndcs: "{{ inputs.ndcs | toJson }}"
      endpoints: "{{ inputs.endpoints | toJson }}"
      checked_through: "{{ outputs.checked_through.value ?? '' }}"
      since: "{{ inputs.since ?? '' }}"
      lookback_days: "{{ inputs.lookback_days }}"
      overlap_days: "{{ inputs.overlap_days }}"
      page_size: "{{ inputs.page_size }}"
      use_api_key: "{{ inputs.use_api_key }}"
    sql: |
      CREATE MACRO phrase(s) AS '"' || trim(replace(s, '"', '')) || '"';

      CREATE TABLE terms AS
      SELECT 'firm' AS kind, trim(t) AS term FROM unnest(from_json(:firms, '["VARCHAR"]')) AS x(t) WHERE trim(replace(t, '"', '')) <> ''
      UNION ALL SELECT 'keyword', trim(t) FROM unnest(from_json(:keywords, '["VARCHAR"]')) AS x(t) WHERE trim(replace(t, '"', '')) <> ''
      UNION ALL SELECT 'ndc', trim(t) FROM unnest(from_json(:ndcs, '["VARCHAR"]')) AS x(t) WHERE trim(replace(t, '"', '')) <> '';

      CREATE TABLE eps AS
      SELECT DISTINCT lower(trim(e)) AS endpoint FROM unnest(from_json(:endpoints, '["VARCHAR"]')) AS x(e);

      CREATE TABLE endpoint_check AS SELECT CASE WHEN count(*) FILTER (WHERE endpoint NOT IN ('drug', 'device', 'food')) > 0
                  THEN error('Unknown openFDA endpoint: ' || string_agg(endpoint, ', ') FILTER (WHERE endpoint NOT IN ('drug', 'device', 'food')) || '. Use drug, device or food.')
             END AS ok FROM eps;

      CREATE TABLE win AS
      SELECT CASE WHEN :since <> '' THEN CAST(:since AS DATE)
                  WHEN :checked_through <> '' THEN CAST(:checked_through AS DATE) - CAST(:overlap_days AS INTEGER)
                  ELSE current_date - CAST(:lookback_days AS INTEGER) END AS d_from,
             current_date AS d_to;

      CREATE TABLE queries AS
      SELECT e.endpoint,
             'report_date:[' || strftime(w.d_from, '%Y%m%d') || ' TO ' || strftime(w.d_to, '%Y%m%d') || ']'
               || CASE WHEN (SELECT count(*) FROM terms) = 0 THEN ''
                       ELSE ' AND (' || string_agg(
                              CASE t.kind
                                WHEN 'firm' THEN 'recalling_firm:' || phrase(t.term)
                                WHEN 'keyword' THEN 'product_description:' || phrase(t.term)
                                ELSE 'product_description:' || phrase(t.term) || ' OR openfda.product_ndc:' || phrase(t.term)
                              END, ' OR ' ORDER BY t.kind, t.term) || ')' END AS search,
             count(t.term) AS terms
      FROM eps e
      CROSS JOIN win w
      LEFT JOIN terms t ON t.kind <> 'ndc' OR e.endpoint = 'drug'
      GROUP BY e.endpoint, w.d_from, w.d_to;

      SELECT
        (SELECT strftime(d_from, '%Y-%m-%d') FROM win) AS window_from,
        (SELECT strftime(d_to, '%Y-%m-%d') FROM win) AS window_to,
        :checked_through = '' AS is_baseline,
        (SELECT count(*) FROM terms) AS watch_terms,
        (SELECT coalesce(string_agg(endpoint, ', '), '') FROM queries WHERE terms = 0 AND (SELECT count(*) FROM terms) > 0) AS skipped_endpoints,
        (SELECT CAST(json_group_array(json_object('endpoint', endpoint, 'search', search, 'page_size', CAST(:page_size AS INTEGER), 'use_api_key', CAST(:use_api_key AS BOOLEAN))) AS VARCHAR)
           FROM queries WHERE terms > 0 OR (SELECT count(*) FROM terms) = 0) AS queries;

  - id: fetch
    type: io.kestra.plugin.core.flow.Loop
    description: |
      One iteration per endpoint, one at a time to stay polite with the keyless rate limit. Each item carries the search,
      the page size and the API key switch, because Loop iterations run in their own context.
    values: "{{ outputs.plan.outputs[0].row.queries }}"
    concurrencyLimit: 1
    tasks:
      - id: pages
        type: io.kestra.plugin.core.flow.Loop
        description: |
          Pagination with `limit` and `skip`, sorted on `recall_number.exact` so pages are stable. The loop breaks as soon
          as `skip + limit` reaches the total reported by the first page (or the page was a 404 with no matches); the
          `values` range only sets the ceiling of openFDA's 25,000 skip cap.
        values: "{{ range(0, 25000, fromJson(item.parent.value ?? item.value).page_size) }}"
        concurrencyLimit: 1
        breakWhen: "{{ iteration.outputs.done }}"
        tasks:
          - id: page
            type: io.kestra.plugin.core.http.Download
            description: 404 is openFDA's "No matches found!" (also returned for a skip past the end) and is landed as an empty page; 429 and 5xx are retried with backoff; anything else, such as 403 for an invalid key, fails the run.
            uri: "https://api.fda.gov/{{ fromJson(item.parent.value).endpoint }}/enforcement.json"
            params:
              search: "{{ fromJson(item.parent.value).search }}"
              limit: "{{ fromJson(item.parent.value).page_size }}"
              skip: "{{ item.value }}"
              sort: recall_number.exact:asc
              api_key: "{{ fromJson(item.parent.value).use_api_key ? secret('OPENFDA_API_KEY') : '' }}"
            headers:
              User-Agent: "kestra-openfda-recall-enforcement-watch/1.0 (https://kestra.io)"
              Accept: application/json
            options:
              allowedResponseCodes: [200, 404]
              retryOnStatusCodes: [429, 500, 502, 503, 504]
              retry:
                type: exponential
                interval: PT5S
                maxInterval: PT1M
                maxAttempts: 4

          - id: page_total
            type: io.kestra.plugin.core.debug.Return
            description: Total matches reported by openFDA for this search; 0 when the page is a no-match 404.
            format: "{{ fromJson(read(outputs.page.uri)).meta.results.total ?? 0 }}"
        outputs:
          - id: uri
            type: STRING
            value: "{{ outputs.page.uri }}"
          - id: total
            type: INT
            value: "{{ outputs.page_total.value }}"
          - id: done
            type: BOOL
            value: "{{ (item.value | number) + fromJson(item.parent.value).page_size >= (outputs.page_total.value | number) }}"
    outputs:
      - id: endpoint
        type: STRING
        value: "{{ fromJson(item.value).endpoint }}"
      - id: pages
        type: JSON
        value: "{{ outputs.pages.outputs }}"

  - id: collect_pages
    type: io.kestra.plugin.core.storage.Concat
    description: Every page of every endpoint in one file, one JSON document after the other, for a single DuckDB read.
    files: "{{ outputs.fetch.outputs | jq('[.[].outputs.pages[].outputs.uri]') | first }}"
    separator: "\n"
    extension: .json

  - id: land_and_diff
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: |
      Parses the pages (no-match documents yield no rows), deduplicates by recall number, lands the window in Parquet,
      tags each recall with the watch terms it matches, anti-joins against the seen set and flags new and reclassified
      recalls of the alert classes. Also checks that the rows fetched add up to the totals openFDA reported.
    url: "jdbc:duckdb:"
    fetchType: FETCH_ONE
    inputFiles:
      pages.json: "{{ outputs.collect_pages.uri }}"
      seen.parquet: "{{ outputs.previous_seen.value ?? outputs.empty_seen.outputFiles.seen_parquet }}"
    outputFiles:
      - recalls_parquet
      - new_recalls_csv
      - terms_csv
      - seen_parquet
    parameters:
      firms: "{{ inputs.firms | toJson }}"
      keywords: "{{ inputs.product_keywords | toJson }}"
      ndcs: "{{ inputs.ndcs | toJson }}"
      alert_classes: "{{ inputs.alert_classes | toJson }}"
      totals: "{{ outputs.fetch.outputs | jq('[.[] | {endpoint: .outputs.endpoint, total: (.outputs.pages[0].outputs.total // 0)}]') | first | toJson }}"
      run_started: "{{ execution.startDate }}"
      window_from: "{{ outputs.plan.outputs[0].row.window_from }}"
      window_to: "{{ outputs.plan.outputs[0].row.window_to }}"
      is_baseline: "{{ outputs.plan.outputs[0].row.is_baseline }}"
      execution_url: "{{ kestra.url ?? '' }}/ui/main/executions/{{ flow.namespace }}/{{ flow.id }}/{{ execution.id }}"
    sql: |
      CREATE MACRO norm(s) AS ' ' || trim(regexp_replace(lower(coalesce(s, '')), '[^a-z0-9]+', ' ', 'g')) || ' ';
      CREATE MACRO d(s) AS CAST(try_strptime(nullif(s, ''), '%Y%m%d') AS DATE);

      CREATE TABLE docs AS SELECT json AS doc FROM read_json_objects('pages.json', format = 'unstructured');

      CREATE TABLE error_check AS SELECT CASE WHEN count(*) FILTER (WHERE json_extract_string(doc, '$.error.code') IS NOT NULL AND json_extract_string(doc, '$.error.code') <> 'NOT_FOUND') > 0
                  THEN error('openFDA error: ' || string_agg(json_extract_string(doc, '$.error.code') || ' ' || (json_extract_string(doc, '$.error.message')), '; '))
             END AS ok FROM docs;

      CREATE TABLE fetched AS
      SELECT CASE json_extract_string(r, '$.product_type') WHEN 'Drugs' THEN 'drug' WHEN 'Devices' THEN 'device' WHEN 'Food' THEN 'food' ELSE lower(json_extract_string(r, '$.product_type')) END AS endpoint,
             json_extract_string(r, '$.recall_number') AS recall_number,
             json_extract_string(r, '$.event_id') AS event_id,
             json_extract_string(r, '$.classification') AS classification,
             json_extract_string(r, '$.status') AS status,
             d(json_extract_string(r, '$.report_date')) AS report_date,
             d(json_extract_string(r, '$.recall_initiation_date')) AS recall_initiation_date,
             d(json_extract_string(r, '$.center_classification_date')) AS center_classification_date,
             d(json_extract_string(r, '$.termination_date')) AS termination_date,
             json_extract_string(r, '$.recalling_firm') AS recalling_firm,
             json_extract_string(r, '$.city') AS city, json_extract_string(r, '$.state') AS state, json_extract_string(r, '$.country') AS country,
             json_extract_string(r, '$.voluntary_mandated') AS voluntary_mandated,
             json_extract_string(r, '$.distribution_pattern') AS distribution_pattern,
             json_extract_string(r, '$.product_description') AS product_description,
             json_extract_string(r, '$.product_quantity') AS product_quantity,
             json_extract_string(r, '$.reason_for_recall') AS reason_for_recall,
             json_extract_string(r, '$.code_info') AS code_info
      FROM docs, unnest(from_json(json_extract(doc, '$.results'), '["JSON"]')) AS t(r);

      CREATE TABLE recalls AS SELECT DISTINCT ON (recall_number) * FROM fetched ORDER BY recall_number;

      CREATE TABLE terms AS
      SELECT 'firm' AS kind, trim(t) AS term FROM unnest(from_json(:firms, '["VARCHAR"]')) AS x(t) WHERE trim(replace(t, '"', '')) <> ''
      UNION ALL SELECT 'keyword', trim(t) FROM unnest(from_json(:keywords, '["VARCHAR"]')) AS x(t) WHERE trim(replace(t, '"', '')) <> ''
      UNION ALL SELECT 'ndc', trim(t) FROM unnest(from_json(:ndcs, '["VARCHAR"]')) AS x(t) WHERE trim(replace(t, '"', '')) <> '';

      CREATE TABLE matches AS
      SELECT r.recall_number, r.endpoint, t.kind, t.term
      FROM recalls r JOIN terms t ON
           (t.kind = 'firm' AND contains(norm(r.recalling_firm), norm(t.term)))
        OR (t.kind = 'keyword' AND contains(norm(r.product_description), norm(t.term)))
        OR (t.kind = 'ndc' AND r.endpoint = 'drug' AND (contains(norm(r.product_description), norm(t.term)) OR contains(norm(r.code_info), norm(t.term))));

      CREATE TABLE seen AS SELECT * FROM read_parquet('seen.parquet');

      CREATE TABLE tagged AS
      SELECT r.*,
             coalesce((SELECT string_agg(DISTINCT m.term, '; ' ORDER BY m.term) FROM matches m WHERE m.recall_number = r.recall_number), '') AS matched_terms,
             s.recall_number IS NULL AS is_new,
             s.recall_number IS NOT NULL AND s.classification IS DISTINCT FROM r.classification AS is_reclassified,
             s.classification AS previous_classification,
             r.classification IN (SELECT unnest(from_json(:alert_classes, '["VARCHAR"]'))) AS alert_class
      FROM recalls r LEFT JOIN seen s ON s.recall_number = r.recall_number;

      CREATE TABLE changes AS
      SELECT CASE WHEN is_new THEN 'NEW' ELSE 'RECLASSIFIED' END AS change_type, alert_class AS alert, *
      FROM tagged WHERE is_new OR is_reclassified;

      COPY (SELECT * EXCLUDE (is_new, is_reclassified) FROM tagged ORDER BY report_date DESC, recall_number) TO '{{ outputFiles.recalls_parquet }}' (FORMAT PARQUET);

      COPY (SELECT change_type, alert, classification, previous_classification, endpoint, recall_number, event_id, report_date,
                   recall_initiation_date, status, recalling_firm, city, state, country, matched_terms, product_description,
                   reason_for_recall, product_quantity, distribution_pattern, code_info
            FROM changes ORDER BY alert DESC, classification, report_date DESC, recall_number)
        TO '{{ outputFiles.new_recalls_csv }}' (HEADER, DELIMITER ',');

      CREATE TABLE term_hits AS
      SELECT t.kind, t.term,
             count(m.recall_number) FILTER (WHERE m.endpoint = 'drug') AS drug_recalls,
             count(m.recall_number) FILTER (WHERE m.endpoint = 'device') AS device_recalls,
             count(m.recall_number) FILTER (WHERE m.endpoint = 'food') AS food_recalls,
             count(m.recall_number) FILTER (WHERE c.recall_number IS NOT NULL) AS new_or_reclassified
      FROM terms t
      LEFT JOIN matches m ON m.kind = t.kind AND m.term = t.term
      LEFT JOIN changes c ON c.recall_number = m.recall_number
      GROUP BY t.kind, t.term;

      COPY (SELECT * FROM term_hits ORDER BY kind, term) TO '{{ outputFiles.terms_csv }}' (HEADER, DELIMITER ',');

      COPY (
        SELECT s.recall_number, s.endpoint, s.event_id,
               coalesce(r.classification, s.classification) AS classification, coalesce(r.status, s.status) AS status,
               s.report_date, s.recalling_firm, s.first_seen_at,
               CASE WHEN r.recall_number IS NOT NULL THEN CAST(:run_started AS TIMESTAMP) ELSE s.last_seen_at END AS last_seen_at
        FROM seen s LEFT JOIN recalls r ON r.recall_number = s.recall_number
        UNION ALL
        SELECT recall_number, endpoint, event_id, classification, status, report_date, recalling_firm,
               CAST(:run_started AS TIMESTAMP), CAST(:run_started AS TIMESTAMP)
        FROM tagged WHERE is_new
      ) TO '{{ outputFiles.seen_parquet }}' (FORMAT PARQUET);

      CREATE TABLE totals AS
      SELECT json_extract_string(t, '$.endpoint') AS endpoint, CAST(json_extract_string(t, '$.total') AS INTEGER) AS reported
      FROM (SELECT unnest(from_json(:totals, '["JSON"]')) AS t);

      CREATE TABLE alerts AS
      SELECT * FROM changes WHERE alert ORDER BY classification, report_date DESC, recall_number;

      SELECT
        :window_from AS window_from,
        :window_to AS window_to,
        strftime(least(coalesce(try_cast((SELECT max(json_extract_string(doc, '$.meta.last_updated')) FROM docs) AS DATE), CAST(:window_to AS DATE)), CAST(:window_to AS DATE)), '%Y-%m-%d') AS checked_through,
        CAST(:is_baseline AS BOOLEAN) AS is_baseline,
        (SELECT max(json_extract_string(doc, '$.meta.last_updated')) FROM docs) AS openfda_last_updated,
        (SELECT count(*) FROM docs) AS requests,
        (SELECT count(*) FROM recalls) AS recalls_in_window,
        (SELECT count(*) FILTER (WHERE endpoint = 'drug') FROM recalls) AS drug_recalls,
        (SELECT count(*) FILTER (WHERE endpoint = 'device') FROM recalls) AS device_recalls,
        (SELECT count(*) FILTER (WHERE endpoint = 'food') FROM recalls) AS food_recalls,
        (SELECT count(*) FILTER (WHERE classification = 'Class I') FROM recalls) AS class_i,
        (SELECT count(*) FILTER (WHERE classification = 'Class II') FROM recalls) AS class_ii,
        (SELECT count(*) FILTER (WHERE classification = 'Class III') FROM recalls) AS class_iii,
        (SELECT count(DISTINCT event_id) FROM recalls) AS recall_events,
        (SELECT count(*) FILTER (WHERE status = 'Terminated') FROM recalls) AS terminated,
        (SELECT coalesce(sum(reported), 0) FROM totals) AS reported_total,
        (SELECT coalesce(sum(reported), 0) FROM totals) <> (SELECT count(*) FROM fetched) AS count_mismatch,
        (SELECT coalesce(max(reported), 0) FROM totals) > 25000 AS truncated,
        (SELECT count(*) FILTER (WHERE change_type = 'NEW') FROM changes) AS new_recalls,
        (SELECT count(*) FILTER (WHERE change_type = 'RECLASSIFIED') FROM changes) AS reclassified,
        (SELECT count(*) FROM alerts) AS new_alerts,
        (SELECT count(*) FILTER (WHERE classification = 'Class I') FROM alerts) AS alert_class_i,
        (SELECT count(*) FILTER (WHERE classification = 'Class II') FROM alerts) AS alert_class_ii,
        (SELECT count(DISTINCT event_id) FROM alerts) AS alert_events,
        (SELECT coalesce(string_agg(kind || ' ' || term, '; ' ORDER BY kind, term), '') FROM term_hits WHERE drug_recalls + device_recalls + food_recalls = 0) AS zero_hit_terms,
        (SELECT count(*) FROM seen) + (SELECT count(*) FILTER (WHERE is_new) FROM tagged) AS seen_size,
        (SELECT coalesce(string_agg(
            '[' || classification || '] ' || recall_number || CASE WHEN change_type = 'RECLASSIFIED' THEN ' (reclassified from ' || previous_classification || ')' ELSE '' END || ' ' || recalling_firm || ': ' || left(product_description, 90) || ' (' || left(reason_for_recall, 90) || ')',
            chr(10) ORDER BY classification, report_date DESC, recall_number), '')
           FROM (SELECT * FROM alerts LIMIT 25)) AS alert_lines,
        (SELECT CAST(json_object('text',
            '*openFDA recall watch* - ' || count(*) || ' new or reclassified recall(s) for your watchlist'
              || ' (' || count(*) FILTER (WHERE classification = 'Class I') || ' Class I, '
              || count(*) FILTER (WHERE classification = 'Class II') || ' Class II), report dates ' || :window_from || ' to ' || :window_to
              || CASE WHEN CAST(:is_baseline AS BOOLEAN) THEN ' (baseline run)' ELSE '' END || chr(10)
              || coalesce(string_agg(
                   '• *' || classification || '* `' || recall_number || '` ' || CASE WHEN change_type = 'RECLASSIFIED' THEN '(reclassified from ' || previous_classification || ') ' ELSE '' END
                   || recalling_firm || ' (' || endpoint || ', ' || strftime(report_date, '%Y-%m-%d') || ', ' || status || ')' || chr(10)
                   || '    ' || left(product_description, 140) || chr(10)
                   || '    _' || left(reason_for_recall, 160) || '_'
                   || CASE WHEN matched_terms <> '' THEN chr(10) || '    watch terms: ' || matched_terms ELSE '' END,
                   chr(10) ORDER BY classification, report_date DESC, recall_number) FILTER (WHERE rn <= 15), '')
              || CASE WHEN count(*) > 15 THEN chr(10) || '…and ' || (count(*) - 15) || ' more in the CSV.' ELSE '' END
              || chr(10) || 'Execution: ' || :execution_url) AS VARCHAR)
           FROM (SELECT *, row_number() OVER (ORDER BY classification, report_date DESC, recall_number) AS rn FROM alerts)) AS slack_payload;

  - id: save_seen
    type: io.kestra.plugin.core.kv.Set
    key: "{{ inputs.state_key }}_seen"
    value: "{{ outputs.land_and_diff.outputFiles.seen_parquet }}"
    description: Points the KV key at the merged seen set. The Parquet file stays in the execution's storage folder.

  - id: save_checked_through
    type: io.kestra.plugin.core.kv.Set
    key: "{{ inputs.state_key }}_checked_through"
    value: "{{ outputs.land_and_diff.outputs[0].row.checked_through }}"
    description: |
      The openFDA `meta.last_updated` date (or today if no page carried one). openFDA publishes with a lag, so the next window
      starts from the data refresh date minus `overlap_days`, not from the run date. Saved only after a successful fetch and diff.

  - id: report
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.land_and_diff.outputs[0].row.new_alerts > 0 }}"
    then:
      - id: notify
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        allowFailure: true
        description: One digest per run (the first 15 recalls, the rest are in the CSV). allowFailure keeps the watch running when the webhook secret is not set; the recalls are still in the logs and the outputs.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: "{{ outputs.land_and_diff.outputs[0].row.slack_payload }}"

      - id: log_alerts
        type: io.kestra.plugin.core.log.Log
        level: WARN
        message: |
          {{ outputs.land_and_diff.outputs[0].row.new_alerts }} new or reclassified {{ inputs.alert_classes | join(' / ') }} recall(s) ({{ outputs.land_and_diff.outputs[0].row.alert_class_i }} Class I, {{ outputs.land_and_diff.outputs[0].row.alert_class_ii }} Class II, {{ outputs.land_and_diff.outputs[0].row.alert_events }} recall events):
          {{ outputs.land_and_diff.outputs[0].row.alert_lines }}
    else:
      - id: nothing_new
        type: io.kestra.plugin.core.log.Log
        message: "No new {{ inputs.alert_classes | join(' or ') }} recalls for the watchlist between {{ outputs.plan.outputs[0].row.window_from }} and {{ outputs.plan.outputs[0].row.window_to }} ({{ outputs.land_and_diff.outputs[0].row.recalls_in_window == 0 ? 'no recall matched the watchlist' : outputs.land_and_diff.outputs[0].row.recalls_in_window ~ ' recalls in the window, ' ~ (outputs.land_and_diff.outputs[0].row.new_recalls > 0 ? outputs.land_and_diff.outputs[0].row.new_recalls ~ ' new below the alert classes, the rest already seen' : 'all already seen') }})."

  - id: warn_data_quality
    type: io.kestra.plugin.core.log.Log
    runIf: "{{ outputs.land_and_diff.outputs[0].row.count_mismatch or outputs.land_and_diff.outputs[0].row.truncated or outputs.plan.outputs[0].row.skipped_endpoints is not empty }}"
    level: WARN
    message: |
      {{ outputs.land_and_diff.outputs[0].row.truncated ? 'A search matched more than 25,000 recalls; openFDA cannot page past skip 25,000, narrow the window or the watchlist. ' : '' }}{{ outputs.land_and_diff.outputs[0].row.count_mismatch ? 'openFDA reported ' ~ outputs.land_and_diff.outputs[0].row.reported_total ~ ' matches but the pages returned a different count (data refreshed during the run?); the next run re-reads the overlap. ' : '' }}{{ outputs.plan.outputs[0].row.skipped_endpoints is not empty ? 'Skipped endpoint(s) with no applicable watch term: ' ~ outputs.plan.outputs[0].row.skipped_endpoints ~ ' (NDCs only apply to drug).' : '' }}

  - id: warn_zero_hit_terms
    type: io.kestra.plugin.core.log.Log
    runIf: "{{ outputs.land_and_diff.outputs[0].row.zero_hit_terms is not empty }}"
    level: INFO
    message: "Watch terms with no recall in this window (clean, or check the spelling): {{ outputs.land_and_diff.outputs[0].row.zero_hit_terms }}"

  - id: summary
    type: io.kestra.plugin.core.log.Log
    message: |
      openFDA enforcement, report dates {{ outputs.plan.outputs[0].row.window_from }} to {{ outputs.plan.outputs[0].row.window_to }}{{ outputs.land_and_diff.outputs[0].row.is_baseline ? ' (BASELINE run)' : '' }}, data last updated {{ outputs.land_and_diff.outputs[0].row.openfda_last_updated ?? 'n/a' }}, {{ outputs.land_and_diff.outputs[0].row.requests }} request(s), {{ outputs.plan.outputs[0].row.watch_terms }} watch terms.
      {{ outputs.land_and_diff.outputs[0].row.recalls_in_window }} recalls in the window ({{ outputs.land_and_diff.outputs[0].row.drug_recalls }} drug, {{ outputs.land_and_diff.outputs[0].row.device_recalls }} device, {{ outputs.land_and_diff.outputs[0].row.food_recalls }} food; {{ outputs.land_and_diff.outputs[0].row.class_i }} Class I, {{ outputs.land_and_diff.outputs[0].row.class_ii }} Class II, {{ outputs.land_and_diff.outputs[0].row.class_iii }} Class III; {{ outputs.land_and_diff.outputs[0].row.recall_events }} events, {{ outputs.land_and_diff.outputs[0].row.terminated }} terminated).
      New: {{ outputs.land_and_diff.outputs[0].row.new_recalls }}, reclassified: {{ outputs.land_and_diff.outputs[0].row.reclassified }}, alerted: {{ outputs.land_and_diff.outputs[0].row.new_alerts }}. Seen set: {{ outputs.land_and_diff.outputs[0].row.seen_size }} recall numbers.
      Changes CSV: {{ outputs.land_and_diff.outputFiles.new_recalls_csv }}
      Watch terms CSV: {{ outputs.land_and_diff.outputFiles.terms_csv }}

outputs:
  - id: summary
    type: JSON
    value: "{{ outputs.land_and_diff.outputs[0].row }}"
  - id: new_recalls_csv
    type: FILE
    value: "{{ outputs.land_and_diff.outputFiles.new_recalls_csv }}"
  - id: terms_csv
    type: FILE
    value: "{{ outputs.land_and_diff.outputFiles.terms_csv }}"
  - id: recalls_parquet
    type: FILE
    value: "{{ outputs.land_and_diff.outputFiles.recalls_parquet }}"

extend:
  title: Watch openFDA Drug and Device Recalls for Your Firms, Products and NDCs with DuckDB and Slack
  metaTitle: openFDA Recall Enforcement Watch with DuckDB and Slack | Kestra
  shortDescription: Query the openFDA drug, device and food enforcement endpoints every day for a watchlist of firms, product keywords and NDCs, page through the results, land them in Parquet, diff the recall numbers against what was already seen and alert in Slack on new or reclassified Class I and Class II recalls.
  metaDescription: Daily openFDA recall watch for your firms, products and NDCs, with paging, 404-safe queries, DuckDB diff by recall number, CSV output and Slack alerts.
  description: |
    Pharmacy, quality and procurement teams need to know when a product they buy, sell or administer is recalled, and the FDA Enforcement Report is where every classified drug, device and food recall lands. openFDA serves it as JSON at `api.fda.gov/{drug,device,food}/enforcement.json`, but reading it reliably takes more than one request: the search returns a 404 when nothing matches, results come in pages of at most 1,000, the weekly report is published with a lag, and the same recall shows up again on every run that covers its report date. This flow handles all of that and reports each recall once.

    ## How it works

    1. A daily `Schedule` trigger (07:00 UTC) runs the watch. `checked_through` and `previous_seen` (KV Get, `errorOnMissing: false`) read the state; `bootstrap` (If) writes an empty seen set on the first run.
    2. `plan` (DuckDB Queries) builds the report-date window: `lookback_days` on the first run, then the last checked date minus `overlap_days`, or `since` to backfill. It turns the watchlist into one openFDA search per endpoint: firms become `recalling_firm:"..."`, keywords `product_description:"..."`, NDCs `product_description:"..." OR openfda.product_ndc:"..."` (drug only), all ORed and ANDed with `report_date:[from TO to]`. Quotes are stripped from terms, unknown endpoints fail the run, an endpoint with no applicable term is skipped, and an empty watchlist watches every recall.
    3. `fetch` (Loop, one endpoint at a time) runs `pages` (Loop with `breakWhen`), which calls `Download` with `limit`, `skip` and a stable `sort=recall_number.exact:asc` until `skip + limit` reaches the reported total. `allowedResponseCodes: [200, 404]` lands openFDA's `NOT_FOUND` "No matches found!" as an empty page, 429 and 5xx are retried with exponential backoff, and any other status (403 for a bad key) fails the run. `api_key` is only sent when `use_api_key` is true.
    4. `collect_pages` (Storage Concat) joins every page into one file and `land_and_diff` (DuckDB Queries) parses it, deduplicates by recall number, tags each recall with the watch terms it matches, anti-joins against the seen set and marks recalls as `NEW` or `RECLASSIFIED` (class changed since last seen). Recalls of `alert_classes` alert. It writes the window to Parquet, the changes and the per-term hit counts to CSV, the merged seen set to Parquet, and checks that the rows fetched add up to openFDA's totals.
    5. `save_seen` and `save_checked_through` (KV Set) store the new state; the checked date is openFDA's `meta.last_updated`, not the run date, so a late weekly refresh is still inside the next window.
    6. `report` (If) posts one Slack digest with the first 15 alerts (`allowFailure`, so a missing webhook warns instead of failing) and logs every alert at WARN; otherwise `nothing_new` logs the window. `warn_data_quality` flags skipped endpoints, count mismatches or the 25,000 skip cap; `warn_zero_hit_terms` lists terms with no recall, which catches typos.

    ## What you get

    - A changes CSV per run: change type, class, previous class, recall number, event, firm, matched watch terms, product, reason, distribution and lot codes.
    - A Parquet file with every recall in the window and a CSV with hit counts per watch term and endpoint.
    - Each recall reported once, plus a second alert if FDA later reclassifies it into an alert class.
    - Zero-match searches, empty pages and skips past the end handled as zero results, not failures.
    - Works keyless; state is two KV keys per watchlist.

    ## Who it's for

    - Hospital and retail pharmacy teams tracking the drugs and NDCs on their formulary.
    - Medical device quality, regulatory affairs and procurement teams watching suppliers and competitors.
    - Distributors, GPOs and health-tech data teams who feed recall data into their own systems.

    ## Why orchestrate this with Kestra

    - `Download` with `allowedResponseCodes` and HTTP `retry` covers openFDA's 404 and rate limits without a script; `Loop` with `breakWhen` paginates declaratively.
    - DuckDB `inputFiles` and `outputFiles` carry pages, the seen set and the reports between tasks; the diff is SQL you can read in the flow.
    - The KV store keeps the window and the seen set, so several watchlists share the flow under different `state_key` values.
    - Secrets stay masked, and the Slack step's `allowFailure` keeps the watch running when the webhook is not configured.

    ## Prerequisites

    - Kestra 2.0 with the JDBC DuckDB plugin and the Slack plugin (`io.kestra.plugin.slack.notifications.SlackIncomingWebhook`).
    - Outbound HTTPS to `api.fda.gov`. No account is needed: keyless access allows 240 requests per minute and 1,000 per day per IP.
    - The Parquet seen set lives in the execution folder of the run that wrote it; if you purge executions, keep the latest successful one.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack incoming webhook for the digest (optional; without it `notify` warns and the watch still runs).
    - `OPENFDA_API_KEY`: openFDA API key for 120,000 requests per day (optional; only read when `use_api_key` is true).

    ## Quick start

    1. Import the flow and click **Execute** with the defaults (Baxter, B. Braun, Fresenius Kabi and Medtronic, the keywords insulin and heparin, two NDCs). The first run is a baseline over 180 days: it lands about a hundred recalls, alerts on the Class I and II ones and lists `heparin` and NDC `0409-4888` as terms with no recall.
    2. Execute again: the window starts two weeks before openFDA's last refresh, every recall in it is already seen and `nothing_new` runs.
    3. Set `page_size` to 25 with a new `state_key`: the same recalls arrive in more requests.
    4. Replace the watch lists with your own firms, keywords and NDCs, add `SLACK_WEBHOOK_URL` as a secret and leave the daily schedule on.

    ## How to extend

    - Add `food` to `endpoints` to watch food and dietary supplement recalls (allergen, Listeria, Salmonella).
    - Read the watchlist from a namespace file or your formulary database instead of inputs.
    - Load the window Parquet into Postgres, Snowflake or BigQuery to keep a recall history table.
    - Open a Jira or ServiceNow ticket per Class I recall, or route alerts by matched term to the right team channel.

    ## Links

    - [HTTP Download](https://kestra.io/plugins/core/http/io.kestra.plugin.core.http.download) and [Storage Concat](https://kestra.io/plugins/core/storage/io.kestra.plugin.core.storage.concat)
    - [Loop](https://kestra.io/plugins/core/flow/io.kestra.plugin.core.flow.loop) and [If](https://kestra.io/plugins/core/flow/io.kestra.plugin.core.flow.if)
    - [KV Get](https://kestra.io/plugins/core/kv/io.kestra.plugin.core.kv.get) and [KV Set](https://kestra.io/plugins/core/kv/io.kestra.plugin.core.kv.set)
    - [DuckDB Queries](https://kestra.io/plugins/plugin-jdbc-duckdb/io.kestra.plugin.jdbc.duckdb.queries)
    - [Slack Incoming Webhook](https://kestra.io/plugins/plugin-notifications/slack/io.kestra.plugin.slack.notifications.slackincomingwebhook)
    - [openFDA drug enforcement API](https://open.fda.gov/apis/drug/enforcement/), [device enforcement API](https://open.fda.gov/apis/device/enforcement/) and [food enforcement API](https://open.fda.gov/apis/food/enforcement/)
    - [openFDA query syntax](https://open.fda.gov/apis/query-syntax/), [paging](https://open.fda.gov/apis/paging/) and [authentication and rate limits](https://open.fda.gov/apis/authentication/)
    - [FDA Enforcement Report](https://www.accessdata.fda.gov/scripts/ires/index.cfm)
  tags:
    - Data
  subTags:
    - Monitoring & Alerting
    - ELT & Data Landing
    - Day 2 Operations
  ee: false
  demo: false
