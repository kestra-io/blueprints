id: github-fork-upstream-sync-conflict-gate
namespace: company.team

concurrency:
  limit: 1
  behavior: QUEUE

inputs:
  - id: fork_repository
    type: STRING
    displayName: Fork Repository
    defaults: "harshitsaxena214/blueprints"
    description: GitHub fork to keep in sync, in owner/repo format. The upstream repository is read from the fork's parent, so it is never typed in by hand.
    validator: "^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$"

  - id: branch
    type: STRING
    displayName: Branch to Sync
    defaults: "main"
    description: Branch of the fork that is brought up to date with the same branch of the upstream repository.
    validator: "^[A-Za-z0-9._/-]+$"

  - id: dry_run
    type: BOOL
    displayName: Dry Run
    defaults: false
    description: When true, only report how many upstream commits the fork is missing. Nothing is merged and no issue is opened.

  - id: issue_repository
    type: STRING
    displayName: Conflict Issue Repository
    defaults: "harshitsaxena214/blueprints"
    description: Repository where the sync conflict issue is opened. Forks have Issues turned off by default, in which case the issue step is skipped with a warning and Slack carries the alert.
    validator: "^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$"

  - id: issue_label
    type: STRING
    displayName: Conflict Issue Label
    defaults: "upstream-sync-conflict"
    description: Label put on the conflict issue.
    validator: "^[A-Za-z0-9 _.-]+$"

  - id: max_commits_listed
    type: INT
    displayName: Max Commits Listed
    defaults: 10
    min: 1
    max: 50
    description: Maximum number of missing upstream commits listed in the issue and the Slack message.

  - id: slack_channel
    type: STRING
    displayName: Slack Alert Channel
    defaults: "#devops-alerts"
    description: Destination channel for the optional Slack notification.
    validator: "^#[a-z0-9_-]+$"

variables:
  github_api: "https://api.github.com"

triggers:
  - id: daily_sync
    type: io.kestra.plugin.core.trigger.Schedule
    description: Check the fork every day at 06:00 UTC. Shipped disabled; enable it once a dry run looks right for your fork.
    cron: "0 6 * * *"
    disabled: true

tasks:
  - id: get_fork
    type: io.kestra.plugin.core.http.Request
    description: Read the fork from the GitHub REST API to confirm it is a fork and to find its parent repository.
    method: GET
    uri: "{{ vars.github_api }}/repos/{{ inputs.fork_repository }}"
    headers:
      Authorization: "Bearer {{ secret('GITHUB_TOKEN') }}"
      Accept: "application/vnd.github+json"
      X-GitHub-Api-Version: "2022-11-28"
      User-Agent: "Kestra-Fork-Sync-Gate"
    retry:
      type: exponential
      interval: PT2S
      maxInterval: PT15S
      maxAttempts: 3

  - id: require_fork
    type: io.kestra.plugin.core.flow.If
    description: Stop when the repository is not a fork, because there is no upstream to sync from.
    condition: "{{ outputs.get_fork.body.fork != true }}"
    then:
      - id: reject_non_fork
        type: io.kestra.plugin.core.execution.Fail
        description: End the execution because the repository has no parent.
        errorMessage: "{{ inputs.fork_repository }} is not a fork, so there is no upstream repository to sync from."

  - id: resolve_upstream
    type: io.kestra.plugin.core.output.OutputValues
    description: Take the upstream repository and its owner from the fork's parent.
    values:
      upstream_repository: "{{ outputs.get_fork.body.parent.full_name }}"
      upstream_owner: "{{ outputs.get_fork.body.parent.owner.login }}"

  - id: compare_with_upstream
    type: io.kestra.plugin.core.http.Request
    description: Compare the fork branch with the same branch of the upstream repository. In this response ahead_by counts upstream commits the fork is missing and behind_by counts commits that exist only on the fork.
    method: GET
    uri: "{{ vars.github_api }}/repos/{{ inputs.fork_repository }}/compare/{{ inputs.branch }}...{{ outputs.resolve_upstream.values.upstream_owner }}:{{ inputs.branch }}"
    headers:
      Authorization: "Bearer {{ secret('GITHUB_TOKEN') }}"
      Accept: "application/vnd.github+json"
      X-GitHub-Api-Version: "2022-11-28"
      User-Agent: "Kestra-Fork-Sync-Gate"
    retry:
      type: exponential
      interval: PT2S
      maxInterval: PT15S
      maxAttempts: 3

  - id: measure_lag
    type: io.kestra.plugin.core.output.OutputValues
    description: Extract the commit counts and build a short list of the missing upstream commits. Commit messages are shortened and mentions are neutralized so the report never pings anyone.
    values:
      missing_from_fork: "{{ outputs.compare_with_upstream.body.ahead_by }}"
      fork_only_commits: "{{ outputs.compare_with_upstream.body.behind_by }}"
      compare_url: "{{ outputs.compare_with_upstream.body.html_url }}"
      commit_list: >-
        {{ ({'commits': (outputs.compare_with_upstream.body.commits ?? []), 'max': inputs.max_commits_listed} | jq('.max as $m | [.commits[:$m][]? | "- `" + .sha[:7] + "` " + (.commit.message | split("\n")[0] | if length > 72 then .[:69] + "..." else . end | gsub("@"; "@ "))] | join("\n")') | first) }}

  - id: sync_if_behind
    type: io.kestra.plugin.core.flow.If
    description: Do nothing when the fork already has every upstream commit, otherwise report or merge.
    condition: "{{ (outputs.measure_lag.values.missing_from_fork | number) > 0 }}"
    then:
      - id: dry_run_or_sync
        type: io.kestra.plugin.core.flow.If
        description: In a dry run only log the lag. Otherwise ask GitHub to merge the upstream branch into the fork.
        condition: "{{ inputs.dry_run }}"
        then:
          - id: log_dry_run
            type: io.kestra.plugin.core.log.Log
            level: WARN
            description: Report the lag without changing the fork.
            message: |
              Dry run: {{ inputs.fork_repository }}@{{ inputs.branch }} is missing {{ outputs.measure_lag.values.missing_from_fork }} commit(s) from {{ outputs.resolve_upstream.values.upstream_repository }}.
              {{ outputs.measure_lag.values.commit_list }}
              Compare: {{ outputs.measure_lag.values.compare_url }}
        else:
          - id: merge_upstream
            type: io.kestra.plugin.core.http.Request
            description: Call the merge-upstream endpoint. GitHub answers 200 when the branch was fast-forwarded or merged and 409 when there is a merge conflict. A conflict must not abort the flow, because it is handled below.
            method: POST
            uri: "{{ vars.github_api }}/repos/{{ inputs.fork_repository }}/merge-upstream"
            contentType: application/json
            body: "{{ {'branch': inputs.branch} | toJson }}"
            options:
              allowFailed: true
            headers:
              Authorization: "Bearer {{ secret('GITHUB_TOKEN') }}"
              Accept: "application/vnd.github+json"
              X-GitHub-Api-Version: "2022-11-28"
              User-Agent: "Kestra-Fork-Sync-Gate"

          - id: check_merge_result
            type: io.kestra.plugin.core.flow.If
            description: Verify a successful merge against the upstream, or handle the conflict.
            condition: "{{ outputs.merge_upstream.code == 200 }}"
            then:
              - id: compare_after_sync
                type: io.kestra.plugin.core.http.Request
                description: Compare again so the gate only reports success when the fork really has every upstream commit.
                method: GET
                uri: "{{ vars.github_api }}/repos/{{ inputs.fork_repository }}/compare/{{ inputs.branch }}...{{ outputs.resolve_upstream.values.upstream_owner }}:{{ inputs.branch }}"
                headers:
                  Authorization: "Bearer {{ secret('GITHUB_TOKEN') }}"
                  Accept: "application/vnd.github+json"
                  X-GitHub-Api-Version: "2022-11-28"
                  User-Agent: "Kestra-Fork-Sync-Gate"
                retry:
                  type: exponential
                  interval: PT2S
                  maxInterval: PT15S
                  maxAttempts: 3

              - id: verify_sync
                type: io.kestra.plugin.core.flow.If
                description: Fail when GitHub reported success but the fork is still behind the upstream.
                condition: "{{ outputs.compare_after_sync.body.ahead_by > 0 }}"
                then:
                  - id: fail_still_behind
                    type: io.kestra.plugin.core.execution.Fail
                    description: End the execution because the merge did not bring the fork up to date.
                    errorMessage: "merge-upstream returned 200 but {{ inputs.fork_repository }}@{{ inputs.branch }} is still missing {{ outputs.compare_after_sync.body.ahead_by }} commit(s) from {{ outputs.resolve_upstream.values.upstream_repository }}."

              - id: log_synced
                type: io.kestra.plugin.core.log.Log
                description: Record the successful sync.
                message: "Synced {{ inputs.fork_repository }}@{{ inputs.branch }} with {{ outputs.resolve_upstream.values.upstream_repository }}: {{ outputs.measure_lag.values.missing_from_fork }} commit(s) brought in by a {{ outputs.merge_upstream.body.merge_type ?? 'merge' }}."
            else:
              - id: find_open_issue
                type: io.kestra.plugin.github.issues.Search
                description: Look for an open conflict issue for this fork and branch so repeated runs do not open duplicates. A repository with Issues turned off is tolerated.
                allowFailure: true
                oauthToken: "{{ secret('GITHUB_TOKEN') }}"
                repository: "{{ inputs.issue_repository }}"
                query: "is:open in:title \"Upstream sync conflict: {{ inputs.fork_repository }}@{{ inputs.branch }}\""
                fetchType: FETCH_ONE

              - id: create_issue_if_absent
                type: io.kestra.plugin.core.flow.If
                description: Open the conflict issue only when no open one exists.
                condition: "{{ (outputs.find_open_issue.size ?? 0) == 0 }}"
                then:
                  - id: open_conflict_issue
                    type: io.kestra.plugin.github.issues.Create
                    description: Open an issue describing the conflict. If the repository has Issues turned off this step is skipped with a warning.
                    allowFailure: true
                    oauthToken: "{{ secret('GITHUB_TOKEN') }}"
                    repository: "{{ inputs.issue_repository }}"
                    title: "Upstream sync conflict: {{ inputs.fork_repository }}@{{ inputs.branch }}"
                    labels:
                      - "{{ inputs.issue_label }}"
                    body: |
                      ## Fork could not be synced

                      `{{ inputs.fork_repository }}@{{ inputs.branch }}` could not be brought up to date with `{{ outputs.resolve_upstream.values.upstream_repository }}`.

                      - GitHub answer: HTTP {{ outputs.merge_upstream.code }}, {{ outputs.merge_upstream.body.message ?? 'no message' }}
                      - Upstream commits missing from the fork: {{ outputs.measure_lag.values.missing_from_fork }}
                      - Commits that exist only on the fork: {{ outputs.measure_lag.values.fork_only_commits }}
                      - Compare: {{ outputs.measure_lag.values.compare_url }}

                      Missing upstream commits (newest last):

                      {{ outputs.measure_lag.values.commit_list }}

                      Resolve the conflict by merging or rebasing the upstream branch into the fork locally and pushing the result. This issue was opened by Kestra execution `{{ execution.id }}`.

              - id: send_slack_notification
                type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
                description: Optional Slack message about the conflict. A Slack failure never hides the gate result.
                allowFailure: true
                url: "{{ secret('SLACK_WEBHOOK_URL') }}"
                payload: "{{ {'channel': inputs.slack_channel, 'text': ':warning: *Fork sync conflict* for `' ~ inputs.fork_repository ~ '@' ~ inputs.branch ~ '`\nUpstream `' ~ outputs.resolve_upstream.values.upstream_repository ~ '` is ' ~ outputs.measure_lag.values.missing_from_fork ~ ' commit(s) ahead and GitHub answered HTTP ' ~ outputs.merge_upstream.code ~ ': ' ~ (outputs.merge_upstream.body.message ?? 'no message') ~ '\n' ~ outputs.measure_lag.values.commit_list ~ '\n<' ~ outputs.measure_lag.values.compare_url ~ '|Compare on GitHub>'} | toJson }}"

              - id: fail_gate
                type: io.kestra.plugin.core.execution.Fail
                description: End the execution as FAILED so the unsynced fork shows up in monitoring and downstream automation.
                errorMessage: "{{ inputs.fork_repository }}@{{ inputs.branch }} could not be synced with {{ outputs.resolve_upstream.values.upstream_repository }}: HTTP {{ outputs.merge_upstream.code }}, {{ outputs.merge_upstream.body.message ?? 'no message' }}."
    else:
      - id: log_in_sync
        type: io.kestra.plugin.core.log.Log
        description: Record that nothing needed to be merged.
        message: "{{ inputs.fork_repository }}@{{ inputs.branch }} already contains every commit of {{ outputs.resolve_upstream.values.upstream_repository }}. Fork-only commits: {{ outputs.measure_lag.values.fork_only_commits }}."

errors:
  - id: alert_sync_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Optional Slack alert when the flow hits an API or network error. Not sent for a deliberate conflict failure, which already sent its own message.
    runIf: "{{ (outputs.merge_upstream.code ?? null) is null or outputs.merge_upstream.code == 200 }}"
    allowFailure: true
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: "{{ {'channel': inputs.slack_channel, 'text': ':x: *Fork sync error*\nFlow `' ~ flow.id ~ '` execution `' ~ execution.id ~ '` failed unexpectedly for `' ~ inputs.fork_repository ~ '@' ~ inputs.branch ~ '`. Check the task logs for details.'} | toJson }}"

extend:
  title: Sync a GitHub Fork With Its Upstream and Open an Issue on Conflicts
  metaTitle: Sync a GitHub Fork With Upstream and Gate on Conflicts | Kestra
  shortDescription: Daily check that compares a fork with its upstream, merges the missing commits through the GitHub API and fails with an issue and Slack alert when the sync conflicts.
  metaDescription: Keep a GitHub fork in sync with upstream. Kestra compares branches, calls merge-upstream, verifies the result and opens an issue on merge conflicts.
  tags:
    - Infrastructure
  subTags:
    - GitOps & Flow Sync
    - Day 2 Operations
    - Monitoring & Alerting
  ee: false
  demo: false
  description: |
    A fork that drifts away from its upstream turns every contribution into a merge-conflict exercise. Branches are cut from stale code, pull requests show unrelated changes, and nobody notices until a sync is painful. This blueprint keeps a fork's branch current and makes the failure visible when GitHub cannot merge it on its own.

    It compares the fork with the parent repository, asks GitHub to merge the missing commits, checks that the fork is really up to date afterwards, and otherwise opens one issue, sends a Slack message and ends the execution as FAILED.

    ## How it works

    1. `daily_sync` (`io.kestra.plugin.core.trigger.Schedule`) runs every day at 06:00 UTC. It is shipped disabled; manual runs work with the default inputs.
    2. `get_fork` reads the repository with `io.kestra.plugin.core.http.Request`. `require_fork` fails the execution when it is not a fork, and `resolve_upstream` takes the parent repository from the response.
    3. `compare_with_upstream` calls `GET /repos/{fork}/compare/{branch}...{upstream_owner}:{branch}`. `measure_lag` extracts how many upstream commits the fork is missing and builds a short commit list.
    4. `sync_if_behind` (`io.kestra.plugin.core.flow.If`) ends quietly when nothing is missing. In dry run mode it only logs the lag.
    5. Otherwise `merge_upstream` calls `POST /repos/{fork}/merge-upstream`. It uses `allowFailed` so a 409 conflict does not abort the flow.
    6. On 200, `compare_after_sync` repeats the comparison and `verify_sync` fails if the fork is still behind.
    7. On any other answer, `find_open_issue` and `open_conflict_issue` (`io.kestra.plugin.github.issues`) open a single conflict issue, `send_slack_notification` alerts the channel and `fail_gate` ends the run as FAILED.

    ## What you get

    - A fork that stays current without manual `git pull upstream` work.
    - A deliberate FAILED execution, an issue and a Slack message when the sync conflicts, instead of a silently stale fork.
    - No duplicate issues, because an open issue for the same fork and branch is reused.
    - A post-merge check, so a reported success is never trusted blindly.
    - A dry run mode for the first test.

    ## Who it's for

    - Open source contributors who maintain forks of busy repositories.
    - Platform teams that mirror upstream projects into an organization.

    ## Why orchestrate this with Kestra

    A cron job running `git pull` gives no retries, no conflict handling and no history. Kestra retries transient API errors, branches on the real HTTP answer, keeps the token in a secret and records every sync decision as an execution you can audit.

    ## Prerequisites

    - A GitHub fork and a token that may update it.
    - Issues enabled on the repository named in `issue_repository`, if you want the issue. Forks have Issues turned off by default.

    ### Secrets

    - `GITHUB_TOKEN`: token with write access to the fork contents and, for the issue, to Issues. Classic token scope `repo`, or a fine-grained token with `Contents: Read and write` and `Issues: Read and write` (required).
    - `SLACK_WEBHOOK_URL`: Slack incoming webhook URL for the optional notifications (optional).

    ## Quick start

    1. Add `GITHUB_TOKEN` and `SLACK_WEBHOOK_URL` to the namespace secrets.
    2. Import the blueprint and run it with `dry_run` set to true to see how far behind the fork is.
    3. Run it again with `dry_run` set to false and confirm the fork branch now matches the upstream.
    4. To test the conflict path, commit a change to the same lines on the fork and upstream, then run it again.
    5. Remove `disabled: true` from `daily_sync` to start the daily schedule.

    ## How to extend

    - Loop over several forks with `io.kestra.plugin.core.flow.ForEach`.
    - Add a `io.kestra.plugin.core.flow.Pause` step so a person approves the merge before it runs.
    - Trigger a rebuild with `io.kestra.plugin.github.actions.RunWorkflow` after each successful sync.

    ## Links

    - [Kestra HTTP Plugin](https://kestra.io/plugins/core/http/io.kestra.plugin.core.http.request)
    - [Kestra GitHub Plugin](https://kestra.io/plugins/plugin-github)
    - [Kestra Slack Plugin](https://kestra.io/plugins/plugin-slack)
    - [GitHub REST API: Sync a fork branch with the upstream repository](https://docs.github.com/en/rest/branches/branches#sync-a-fork-branch-with-the-upstream-repository)
    - [GitHub REST API: Compare two commits](https://docs.github.com/en/rest/commits/commits#compare-two-commits)
