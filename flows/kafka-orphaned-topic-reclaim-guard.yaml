id: kafka-orphaned-topic-reclaim-guard
namespace: company.team

description: |
  Find Kafka topics that nothing reads and nothing has committed an offset against, hold them
  until they have looked abandoned for a whole grace window, then delete only those behind an
  approval gate and re-list to prove each one is gone. A decommissioned service leaves its topics
  on the cluster. A producer typo plus auto-create leaves a topic nobody asked for. Both hold
  partitions, replicas and disk for good, because nothing in a normal Kafka workflow removes a
  topic. Internal topics, topics with a committed consumer group offset, protected topics and
  topics whose size or layout changed since the last run are never touched.

inputs:
  - id: bootstrap_servers
    type: STRING
    displayName: Kafka bootstrap servers
    defaults: "localhost:9092"

  - id: min_idle_minutes
    type: INT
    displayName: Minutes a topic must look abandoned before it can be deleted
    description: Measured from the first run that saw the topic unused with its current size and layout. A topic seen for less than this is reported but never deleted.
    defaults: 10080

  - id: protected_topics
    type: ARRAY
    itemType: STRING
    displayName: Topics never deleted
    description: Topic names always kept even when nothing reads them, for example a landing topic that a batch job drains once a quarter.
    defaults: []

  - id: verify_delay
    type: DURATION
    displayName: Wait before the re-list
    description: Kafka marks a topic for deletion and removes it shortly after, so the re-list waits this long before deciding whether the delete landed.
    defaults: PT5S

  - id: auto_remediate
    type: BOOL
    displayName: Auto remediate
    defaults: false

  - id: dry_run
    type: BOOL
    displayName: Dry run
    description: Must be false, together with auto_remediate, for TopicDelete to run.
    defaults: true

variables:
  kv_key: "kafka_orphan_topics_{{ inputs.bootstrap_servers | slugify }}"

tasks:
  - id: freeze
    type: io.kestra.plugin.core.output.OutputValues
    description: One timestamp for the whole run, so the detect, the cursor and the age check agree.
    values:
      now_iso: >-
        {{ execution.startDate | date("yyyy-MM-dd'T'HH:mm:ss.SSS'Z'", timeZone="UTC") }}
      cutoff_iso: >-
        {{ execution.startDate | dateAdd(-1 * inputs.min_idle_minutes, 'MINUTES') | date("yyyy-MM-dd'T'HH:mm:ss.SSS'Z'", timeZone="UTC") }}

  - id: list_all
    type: io.kestra.plugin.kafka.TopicList
    description: Read-only. Every topic on the cluster, internal ones included, so the count of what was excluded is visible in the report.
    includeInternal: true
    properties:
      bootstrap.servers: "{{ inputs.bootstrap_servers }}"

  - id: list_groups
    type: io.kestra.plugin.kafka.ConsumerGroupList
    description: Read-only. Every consumer group, whatever its state, because a group that is Empty today still holds the offsets that prove its topic is in use.
    properties:
      bootstrap.servers: "{{ inputs.bootstrap_servers }}"

  - id: log_dirs
    type: io.kestra.plugin.kafka.DescribeLogDirs
    description: Read-only. Bytes on disk per topic. Used both to report what the orphans cost and to notice a topic that is still being written to.
    properties:
      bootstrap.servers: "{{ inputs.bootstrap_servers }}"

  - id: groups_present
    type: io.kestra.plugin.core.flow.If
    description: ConsumerGroupDescribe rejects an empty groupIds list, so a cluster with no groups skips the describe.
    condition: "{{ outputs.list_groups.groups | length > 0 }}"
    then:
      - id: describe_groups
        type: io.kestra.plugin.kafka.ConsumerGroupDescribe
        description: Read-only. Members and committed offsets of every group, which is what marks a topic as in use.
        groupIds: "{{ outputs.list_groups.groups | jq('[.[].groupId]') | first }}"
        properties:
          bootstrap.servers: "{{ inputs.bootstrap_servers }}"

  - id: analyze
    type: io.kestra.plugin.core.output.OutputValues
    description: >-
      A topic is a candidate only when it survives every exclusion: not internal, no committed
      offset from any group, not assigned to a live member, not on the protect list.
    values:
      result: >-
        {{ {'all': outputs.list_all.topics, 'g': ((outputs.describe_groups is defined) ? outputs.describe_groups.groups : []), 'prot': inputs.protected_topics, 'sizes': (outputs.log_dirs.topicSizes ?? {})} | jq('.all as $all | .g as $g | .prot as $prot | .sizes as $sizes | ([$all[] | select(startswith("_"))] | sort) as $internal | (([$g[] | (.offsets // [])[] | .topic] + [$g[] | (.members // [])[] | (.assignedPartitions // [])[] | sub("-[0-9]+$";"")]) | unique) as $consumed | ([$all[] | select(startswith("_") | not) | select(([.] - $consumed) | length > 0) | select(([.] - $prot) | length > 0)] | sort) as $cand | {internal: $internal, consumed: ([$consumed[] | select(startswith("_") | not)] | sort), protected_present: ([$all[] | select(([.] - $prot) | length == 0)] | sort), candidates: $cand, orphan_bytes: ([$cand[] | ($sizes[.] // 0)] | add // 0)}') | first | toJson }}

  - id: route
    type: io.kestra.plugin.core.flow.If
    condition: "{{ fromJson(outputs.analyze.values.result).candidates | length > 0 }}"
    then:
      - id: describe_candidates
        type: io.kestra.plugin.core.flow.Loop
        description: Read-only. Partition count and replication factor of each candidate, which is what the topic is actually holding.
        values: "{{ fromJson(outputs.analyze.values.result).candidates | toJson }}"
        concurrencyLimit: 4
        outputs:
          - id: info
            type: STRING
            value: >-
              {{ {'topic': item.value, 'partitions': outputs.describe_one.partitionCount, 'replicas': outputs.describe_one.replicationFactor} | toJson }}
        tasks:
          - id: describe_one
            type: io.kestra.plugin.kafka.TopicDescribe
            topic: "{{ item.value }}"
            properties:
              bootstrap.servers: "{{ inputs.bootstrap_servers }}"

      - id: fingerprint
        type: io.kestra.plugin.core.output.OutputValues
        description: The state a topic has to hold still in. Any change to bytes, partitions or replicas restarts its grace window.
        values:
          now_map: >-
            {{ {'l': outputs.describe_candidates.outputs, 'sizes': (outputs.log_dirs.topicSizes ?? {})} | jq('.sizes as $s | ((.l | map(.outputs.info | fromjson) | map({(.topic): {size: ($s[.topic] // 0), partitions: .partitions, replicas: .replicas}}) | add) // {})') | first | toJson }}

      - id: cursor_merge
        type: io.kestra.plugin.core.output.OutputValues
        description: Keep the first time each candidate was seen in its current state. A candidate that is new gets now. So does one whose state moved. A topic that is no longer a candidate is dropped.
        values:
          merged: >-
            {{ {'cur': (kv(render(vars.kv_key), errorOnMissing=false) ?? ''), 'f': fromJson(outputs.fingerprint.values.now_map), 'now': outputs.freeze.values.now_iso} | jq('(.cur | if type=="string" then (if . == "" then {} else fromjson end) else . end) as $c | .now as $n | .f as $f | reduce ($f | keys_unsorted[]) as $t ({}; . + {($t): (if ($c[$t] != null and $c[$t].size == $f[$t].size and $c[$t].partitions == $f[$t].partitions and $c[$t].replicas == $f[$t].replicas) then $c[$t] else ($f[$t] + {first_seen: $n}) end)})') | first | toJson }}

      - id: save_cursor
        type: io.kestra.plugin.core.kv.Set
        description: No ttl. This is a first-seen record that must not expire out from under the age check.
        key: "{{ render(vars.kv_key) }}"
        kvType: JSON
        value: "{{ outputs.cursor_merge.values.merged }}"

      - id: split
        type: io.kestra.plugin.core.output.OutputValues
        values:
          target_ids: >-
            {{ {'cur': fromJson(outputs.cursor_merge.values.merged), 'cutoff': outputs.freeze.values.cutoff_iso} | jq('.cutoff as $cut | [.cur | to_entries[] | select(.value.first_seen <= $cut) | .key] | sort') | first | toJson }}
          held_ids: >-
            {{ {'cur': fromJson(outputs.cursor_merge.values.merged), 'cutoff': outputs.freeze.values.cutoff_iso} | jq('.cutoff as $cut | [.cur | to_entries[] | select(.value.first_seen > $cut) | .key] | sort') | first | toJson }}
          target_bytes: >-
            {{ {'cur': fromJson(outputs.cursor_merge.values.merged), 'cutoff': outputs.freeze.values.cutoff_iso} | jq('.cutoff as $cut | ([.cur | to_entries[] | select(.value.first_seen <= $cut) | .value.size] | add // 0)') | first }}
          detail: >-
            {{ {'cur': fromJson(outputs.cursor_merge.values.merged)} | jq('[.cur | to_entries[] | "\(.key): \(.value.partitions) partitions x \(.value.replicas) replicas, \(.value.size) bytes, unused since \(.value.first_seen)"] | join(" | ")') | first }}

      - id: log_findings
        type: io.kestra.plugin.core.log.Log
        message: >-
          Orphaned topic scan on {{ inputs.bootstrap_servers }}: {{ outputs.list_all.topics | length }} topics on the cluster, {{ fromJson(outputs.analyze.values.result).internal | length }} internal skipped, {{ fromJson(outputs.analyze.values.result).consumed | length }} in use by a consumer group, {{ fromJson(outputs.analyze.values.result).protected_present | length }} on the protect list. {{ fromJson(outputs.analyze.values.result).candidates | length }} unused ({{ outputs.analyze.values.result | jq('.candidates | join(", ")') | first }}) holding {{ fromJson(outputs.analyze.values.result).orphan_bytes }} bytes. {{ fromJson(outputs.split.values.target_ids) | length }} past the {{ inputs.min_idle_minutes }} minute grace window ({{ outputs.split.values.target_ids | jq('join(", ")') | first }}) holding {{ outputs.split.values.target_bytes }} bytes. {{ fromJson(outputs.split.values.held_ids) | length }} held as too recent or recently changed ({{ outputs.split.values.held_ids | jq('join(", ")') | first }}). Detail: {{ outputs.split.values.detail }}. auto_remediate={{ inputs.auto_remediate }} dry_run={{ inputs.dry_run }}.

      - id: alert
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: >-
          {{ {'text': 'Kafka ' ~ inputs.bootstrap_servers ~ ': ' ~ (fromJson(outputs.analyze.values.result).candidates | length) ~ ' orphaned topics holding ' ~ fromJson(outputs.analyze.values.result).orphan_bytes ~ ' bytes, ' ~ (fromJson(outputs.split.values.target_ids) | length) ~ ' past the ' ~ inputs.min_idle_minutes ~ ' minute grace window (' ~ (outputs.split.values.target_ids | jq('join(", ")') | first) ~ '). Deleting a topic is irreversible. auto_remediate=' ~ inputs.auto_remediate ~ ' dry_run=' ~ inputs.dry_run ~ '.'} | toJson }}

      - id: remediate_gate
        type: io.kestra.plugin.core.flow.If
        condition: "{{ inputs.auto_remediate and not inputs.dry_run and (fromJson(outputs.split.values.target_ids) | length > 0) }}"
        then:
          - id: approve
            type: io.kestra.plugin.core.flow.Pause
            description: >-
              Deleting a Kafka topic is irreversible. Its log segments, its partitions and every
              message still inside them go for good. No Kafka command brings them back. Read
              the topic list in log_findings first, then resume with approved=true to delete
              exactly those topics. Resume with no answer or kill the execution to cancel.
            onResume:
              - id: approved
                type: BOOL
                displayName: Approve the irreversible delete of the listed orphaned topics
                required: false

          - id: do_delete
            type: io.kestra.plugin.core.flow.If
            condition: "{{ outputs.approve.onResume.approved ?? false }}"
            then:
              - id: remediate_delete
                type: io.kestra.plugin.core.flow.Loop
                description: One topic per iteration and one iteration at a time, so a refusal is attributable to a single topic instead of sinking the batch.
                values: "{{ outputs.split.values.target_ids }}"
                concurrencyLimit: 1
                tasks:
                  - id: delete_topic
                    type: io.kestra.plugin.kafka.TopicDelete
                    description: allowFailure keeps the re-list as the authority on what actually went.
                    allowFailure: true
                    topics:
                      - "{{ item.value }}"
                    properties:
                      bootstrap.servers: "{{ inputs.bootstrap_servers }}"

              - id: settle
                type: io.kestra.plugin.core.flow.Sleep
                description: Kafka marks a topic for deletion, then removes it. Give the controller that long before reading back.
                duration: "{{ inputs.verify_delay }}"

              - id: reverify
                type: io.kestra.plugin.kafka.TopicList
                description: Read-only re-list after the delete. This is the gate.
                includeInternal: true
                properties:
                  bootstrap.servers: "{{ inputs.bootstrap_servers }}"

              - id: verify_result
                type: io.kestra.plugin.core.flow.If
                condition: >-
                  {{ {'now': outputs.reverify.topics, 'targets': fromJson(outputs.split.values.target_ids)} | jq('[.now[]] as $present | [.targets[] | select(([.] - $present) | length == 0)] | length') | first > 0 }}
                then:
                  - id: delete_failed
                    type: io.kestra.plugin.core.execution.Fail
                    errorMessage: >-
                      TopicDelete ran, but a re-list still shows a targeted topic. Remaining: {{ {'now': outputs.reverify.topics, 'targets': fromJson(outputs.split.values.target_ids)} | jq('[.now[]] as $present | [.targets[] | select(([.] - $present) | length == 0)] | join(", ")') | first }}. Either the delete was refused (delete.topic.enable false on the broker, the principal missing Delete on the topic) or a client wrote to the topic and auto-create brought it straight back, which means it was not abandoned after all.
                else:
                  - id: prune_cursor
                    type: io.kestra.plugin.core.kv.Set
                    description: Drop the deleted topics from the first-seen record, so a topic later recreated under the same name starts a fresh grace window instead of inheriting the old one.
                    key: "{{ render(vars.kv_key) }}"
                    kvType: JSON
                    value: >-
                      {{ {'cur': fromJson(outputs.cursor_merge.values.merged), 'gone': fromJson(outputs.split.values.target_ids)} | jq('.gone as $g | (.cur | with_entries(select(([.key] - $g) | length > 0)))') | first | toJson }}

                  - id: deleted_ok
                    type: io.kestra.plugin.core.log.Log
                    message: >-
                      Deleted {{ fromJson(outputs.split.values.target_ids) | length }} orphaned topics ({{ outputs.split.values.target_ids | jq('join(", ")') | first }}) and reclaimed {{ outputs.split.values.target_bytes }} bytes of log data. A re-list confirms none of them remain. Cluster now holds {{ outputs.reverify.topics | length }} topics.
            else:
              - id: not_approved
                type: io.kestra.plugin.core.log.Log
                message: "Pause resumed without approval or killed. No topic was deleted."
    else:
      - id: clear_cursor
        type: io.kestra.plugin.core.kv.Set
        description: Nothing unused, so reset the first-seen record.
        key: "{{ render(vars.kv_key) }}"
        kvType: JSON
        value: "{}"

      - id: all_in_use
        type: io.kestra.plugin.core.log.Log
        message: >-
          Every topic on {{ inputs.bootstrap_servers }} is internal, in use by a consumer group or on the protect list. {{ outputs.list_all.topics | length }} topics checked, nothing to reclaim.

errors:
  - id: alert_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: >-
      {{ {'text': 'Kafka orphaned topic reclaim guard failed on ' ~ inputs.bootstrap_servers ~ ' (execution ' ~ execution.id ~ '). No topic was deleted unless a log line says deleted. Check the logs.'} | toJson }}

triggers:
  - id: weekly_scan
    type: io.kestra.plugin.core.trigger.Schedule
    description: Shipped disabled and always in safe mode.
    cron: "0 4 * * 1"
    disabled: true
    inputs:
      auto_remediate: false
      dry_run: true

extend:
  title: Kafka Orphaned Topic Reclaim Guard
  shortDescription: Find Kafka topics with no consumer group and no committed offsets, hold them through a grace window, delete them behind an approval gate, then re-list and fail if any remains.
  metaTitle: Kafka Orphaned Topic Reclaim Guard with Kestra
  metaDescription: Detect Kafka topics nothing reads, delete them with TopicDelete behind an approval gate, then re-list and fail if a targeted topic still exists.
  description: |
    A service gets decommissioned. Its topics stay. A producer ships a typo in a topic name, auto-create obliges and now the cluster carries `ordres` next to `orders` for good. Neither case has an owner who comes back to clean up, because deleting a topic is the one Kafka operation nobody wants to be the person who ran. So the topics stay. Each one keeps its partitions, its replicas on every broker, its log segments on disk and a row in every metadata scan the cluster does.

    Doing it by hand is the problem. `kafka-topics.sh --delete` is instant and final. There is no undo, no recycle bin and no way to tell from the topic list alone whether a topic with no consumers right now is abandoned or just quiet between batches. Get it wrong and you have destroyed data that only existed there.

    This blueprint makes that call with evidence instead of nerve. It lists every topic, then removes from the list anything internal, anything with a committed consumer group offset, anything assigned to a live consumer and anything on a protect list. What is left gets recorded in a KV snapshot with its byte size, partition count and replication factor. A topic becomes eligible only once that snapshot has held still for the whole grace window, so a topic that got written to, grew, shrank or was repartitioned since the last run starts its clock again. Deleting still needs `auto_remediate` true, `dry_run` false and a human resuming a paused execution. After the delete it re-lists the cluster and fails the run if a targeted topic is still there.

    This blueprint was created by [zkasuran](https://github.com/zkasuran).

    ## Safety

    - Read-only by default. With the shipped inputs it lists, reports and alerts. It changes nothing.
    - A delete needs three things at once: `auto_remediate` true, `dry_run` false and a human resuming the `Pause` with `approved=true`. An unanswered resume reads as not approved.
    - Internal topics are never candidates. Anything whose name starts with `_` is excluded, which covers `__consumer_offsets`, `_schemas` and the Confluent internal topics.
    - A topic with a committed offset from any consumer group is never a candidate, whatever that group's state. An Empty group still holds the offsets that prove the topic is in use.
    - A topic assigned to a live consumer group member is never a candidate, even if that member has not committed yet.
    - `protected_topics` are never candidates.
    - A topic whose bytes, partition count or replication factor moved since the last run has its grace window reset, so an active topic can never age into eligibility.
    - The KV cursor carries no ttl, so the window cannot quietly expire and hand a fresh topic an old first-seen date. After a confirmed delete the deleted names are pruned from the cursor, so a topic later recreated under the same name starts its own window instead of inheriting the dead one.
    - The re-list after the delete is the real gate. If a targeted topic survives, the run fails and alerts rather than reporting success. That covers a refused delete and the case where a client was still writing and auto-create put the topic straight back.

    ## How it works

    1. `freeze` captures one timestamp for the run, so detect, cursor and age all agree on now.
    2. `list_all` (`io.kestra.plugin.kafka.TopicList`, read-only) returns every topic including the internal ones, so the report can say how many were skipped.
    3. `list_groups` (`io.kestra.plugin.kafka.ConsumerGroupList`, read-only) returns every consumer group whatever its state.
    4. `log_dirs` (`io.kestra.plugin.kafka.DescribeLogDirs`, read-only) returns bytes on disk per topic.
    5. `groups_present` guards `describe_groups` (`io.kestra.plugin.kafka.ConsumerGroupDescribe`, read-only), which reads each group's members and committed offsets. The describe is skipped on a cluster with no groups, because it rejects an empty list.
    6. `analyze` builds the candidate set: every topic that is not internal, has no committed offset, is not assigned to a live member and is not protected. It also totals the bytes those topics hold.
    7. `route` (`io.kestra.plugin.core.flow.If`) branches on whether any candidate exists.
       - When none exist, `clear_cursor` resets the first-seen record and `all_in_use` logs that there is nothing to reclaim. No alert.
       - When some exist:
         - `describe_candidates` (`io.kestra.plugin.core.flow.Loop` over `io.kestra.plugin.kafka.TopicDescribe`, read-only) reads each candidate's partition count and replication factor.
         - `fingerprint` combines that with the byte sizes into the state each topic has to hold still in.
         - `cursor_merge` and `save_cursor` keep the first-seen date per topic in the KV key `kafka_orphan_topics_<cluster>`, resetting any topic whose fingerprint moved.
         - `split` separates the candidates past `min_idle_minutes` from the ones held back, then builds the per-topic detail line.
         - `log_findings` logs the whole picture and `alert` posts it to Slack.
         - `remediate_gate` runs only when `auto_remediate` is true, `dry_run` is false and at least one topic is past the window.
           - `approve` (`io.kestra.plugin.core.flow.Pause`) waits for a resume carrying `approved`, with the irreversibility spelled out in its description.
           - When approved, `remediate_delete` deletes one topic per iteration with `io.kestra.plugin.kafka.TopicDelete` at `concurrencyLimit: 1`, `settle` waits for the controller, `reverify` re-lists and `verify_result` fails the run if any targeted topic is still present. On a clean result `prune_cursor` drops the deleted topics from the KV record.
           - When not approved, `not_approved` logs that nothing was deleted.
    8. `errors` posts to Slack on any failure, for example an unreachable broker or a topic that survived the delete.

    ## What you get

    - An inventory of the topics on a cluster that nothing reads, with what each one costs in partitions, replicas and bytes.
    - A grace window that resets itself whenever a topic shows any sign of life, so a quiet topic between batches is never mistaken for a dead one.
    - A delete that is off by default and needs a named human to approve it, with the irreversibility stated at the point of approval.
    - Proof the reclaim landed: a re-list that fails the run when a targeted topic survives.

    ## Who it's for

    - Platform teams running a shared Kafka cluster where every retired service leaves topics behind.
    - Anyone who has found a typo topic sitting next to the real one and had nobody willing to delete it.
    - Teams running close to a partition or disk ceiling who need the unused capacity back rather than more brokers.
    - Teams evaluating the Kafka plugin who want a worked example of `TopicList`, `TopicDescribe`, `DescribeLogDirs`, `ConsumerGroupDescribe` and `TopicDelete` with real gates around the delete.

    ## Why orchestrate this with Kestra

    Every signal this decision needs sits in a different admin call. The one that matters most, how long a topic has looked dead, does not exist on the cluster at all. Kafka can tell you a topic has no consumers right now. It cannot tell you it had none last week. Kestra supplies the schedule that keeps looking, the KV snapshot that turns a series of observations into an age, the `Pause` that puts a person between a measurement and an irreversible delete, the re-list that proves the result and a run history that says who approved which delete and when.

    ## Tested end to end

    On Kestra 2.0.5 OSS against Apache Kafka 3.9.1 (KRaft, single node), with a local HTTP sink standing in for Slack. The cluster carried `orders` (20 messages, a live `orders-processor` consumer), `legacy-exports` and `abandoned-clickstream` (messages, no consumer), `ordres-typo` and `decommissioned-billing` (empty, no consumer, the auto-create typo case), `brand-new-topic` (created minutes before the run), `keep-me-forever` (passed in `protected_topics`), `_schemas` and `__consumer_offsets`. Topic and group state was read with `kafka-topics.sh --list` and `kafka-consumer-groups.sh` before and after every run.

    | Run | Inputs | Result |
    |---|---|---|
    | 1 | defaults, every junk topic given a committed offset | 0 candidates, `all_in_use` logged, no alert, nothing deleted |
    | 2 | defaults, those throwaway groups deleted | 3 orphans found. `orders` excluded on its live group, `keep-me-forever` on the protect list, both internal topics skipped. Nothing deleted (`dry_run` true). `--list` unchanged |
    | 3 | `auto_remediate: true`, `dry_run: true`, `min_idle_minutes: 1` | 3 past the window, no `Pause`, nothing deleted. `--list` unchanged |
    | 4 | `auto_remediate: true`, `dry_run: false`, `min_idle_minutes: 60` | 3 reported, all held as too recent, 0 past the window, no `Pause`. `--list` unchanged |
    | 5 | 8 messages produced to one orphan, then rerun | Its bytes moved 182 to 323, first-seen reset to now, dropped from 3 targets to 2 |
    | 6 | `min_idle_minutes: 1`, resumed with no answer | Paused, `not_approved` logged, nothing deleted. `--list` unchanged |
    | 7 | `min_idle_minutes: 1`, resumed with `approved=true` | 2 topics deleted, re-list confirmed gone, `--list` went 7 topics to 5 |
    | 8 | `min_idle_minutes: 1440` against a planted first-seen cursor | 5 unused, 4 deleted and 488 bytes reclaimed, `brand-new-topic` held as too recent. `--list` went 9 topics to 5, leaving only the protected, consumed and internal topics. Cursor pruned to the held topic |
    | 9 | same, with a producer writing to the target through the `Pause` | Delete landed, auto-create put the topic straight back, re-list caught it, run FAILED and the `errors` alert fired |
    | 10 | unreachable broker | Run failed on `list_all`, `errors` alert sent |

    ## Prerequisites

    - A Kafka cluster reachable from the Kestra worker, with a principal allowed to describe topics, groups and log dirs and, for remediation, to delete topics.
    - `delete.topic.enable` true on the brokers. It is the default. With it false the delete is refused and the re-verify fails the run, which is the honest outcome.
    - Auto-create off on the brokers. Leave it on and a client still writing to a targeted topic will have that topic recreated right after the delete. The re-verify catches that and fails the run, so it is reported rather than silently reversed.
    - Run it read-only for at least as long as your grace window before you trust the target list. The age comes from the flow's own observations, so a first run has nothing behind it.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: used by `alert` and the `errors` block. In Kestra OSS, provide it as the base64-encoded environment variable `SECRET_SLACK_WEBHOOK_URL`.

    ### Inputs

    | Input | Default | Purpose |
    |---|---|---|
    | `bootstrap_servers` | `localhost:9092` | Brokers |
    | `min_idle_minutes` | `10080` | How long a topic must look abandoned before it can be deleted |
    | `protected_topics` | `[]` | Topic names never deleted |
    | `verify_delay` | `PT5S` | How long to wait before the re-list |
    | `auto_remediate` | `false` | Allow `TopicDelete` |
    | `dry_run` | `true` | Must be `false` for a delete to apply |

    ## Quick start

    1. Add the `SLACK_WEBHOOK_URL` secret.
    2. Import the flow and set `bootstrap_servers`.
    3. Run it with the defaults and read `log_findings`. Nothing is touched.
    4. Add anything that is quiet by design to `protected_topics`, for example a topic a quarterly job drains.
    5. Leave the `weekly_scan` trigger enabled in safe mode for a few windows so the first-seen dates are real.
    6. When the target list looks right, run it with `auto_remediate: true` and `dry_run: false`, then resume the paused execution with `approved=true`.

    ## How to extend

    - Dump each targeted topic to object storage with a Kafka consume step before the delete, so a wrong call is recoverable.
    - Treat a topic with bytes on disk differently from an empty one: raise the window for the ones that still hold data, drop it for the empty auto-created ones.
    - Add a produce-rate check through `DescribeLogDirs` deltas across runs and report the growth rate beside each orphan.
    - Post the Slack message to a channel with a link to the paused execution, so the approval happens from chat.
    - Point `bootstrap_servers` at a different cluster from the one scheduling the flow, so one Kestra instance can sweep several clusters.

