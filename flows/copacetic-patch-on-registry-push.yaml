id: copacetic-patch-on-registry-push
namespace: company.security

inputs:
  - id: repository
    type: STRING
    displayName: Repository
    description: Repository in the registry, without the registry host, as the push event reports it in `target.repository`.
    defaults: demo/nginx

  - id: tag
    type: STRING
    displayName: Tag
    defaults: 1.29.0-alpine

  - id: digest
    type: STRING
    displayName: Digest
    description: Manifest digest from the push event. Leave empty on a manual run to patch whatever the tag points to now.
    required: false

variables:
  registry: localhost:5000
  registry_tls: disabled
  staging_prefix: copa-staging
  patched_suffix: -patched
  buildkit_addr: tcp://localhost:1234
  trivy_server: http://localhost:4954
  approval_window: P7D
  trivy_image: aquasec/trivy:0.76.0
  copa_image: ghcr.io/project-copacetic/copa-action:v0.15.0
  regctl_image: ghcr.io/regclient/regctl:v0.11.6-alpine

tasks:
  - id: target
    type: io.kestra.plugin.core.output.OutputValues
    description: A push event carries the digest, so the scan reads exactly the pushed image. The patched image goes to a staging repository first and only reaches the source repository once verified.
    values:
      source: "{{ vars.registry }}/{{ inputs.repository }}{{ (inputs.digest ?? '') == '' ? (':' ~ inputs.tag) : ('@' ~ inputs.digest) }}"
      staging: "{{ vars.registry }}/{{ vars.staging_prefix }}/{{ inputs.repository }}:{{ inputs.tag }}{{ vars.patched_suffix }}"
      published: "{{ vars.registry }}/{{ inputs.repository }}:{{ inputs.tag }}{{ vars.patched_suffix }}"

  - id: label_image
    type: io.kestra.plugin.core.execution.Labels
    labels:
      image: "{{ inputs.repository }}:{{ inputs.tag }}"

  - id: scan_source
    type: io.kestra.plugin.scripts.shell.Commands
    description: Trivy runs in client mode, so the vulnerability database lives on the Trivy server and is not downloaded on every run. `--ignore-unfixed` keeps only vulnerabilities that have a fixed package version, which are the ones Copacetic can patch.
    containerImage: "{{ vars.trivy_image }}"
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      networkMode: host
    outputFiles:
      - report.json
    commands:
      - >-
        trivy image --server {{ vars.trivy_server }} --image-src remote
        --pkg-types os --ignore-unfixed --disable-telemetry --skip-version-check --quiet
        --format json --output report.json {{ outputs.target.values.source }}

  - id: before
    type: io.kestra.plugin.core.output.OutputValues
    values:
      fixable: >-
        {{ read(outputs.scan_source.outputFiles['report.json']) | jq('[.Results[]? | select(.Class == "os-pkgs") | .Vulnerabilities[]?] | length') | first }}
      cves: >-
        {{ read(outputs.scan_source.outputFiles['report.json']) | jq('[.Results[]? | select(.Class == "os-pkgs") | .Vulnerabilities[]? | .VulnerabilityID] | unique | length') | first }}
      packages: >-
        {{ read(outputs.scan_source.outputFiles['report.json']) | jq('[.Results[]? | select(.Class == "os-pkgs") | .Vulnerabilities[]? | .PkgName] | unique | join(", ")') | first }}
      package_count: >-
        {{ read(outputs.scan_source.outputFiles['report.json']) | jq('[.Results[]? | select(.Class == "os-pkgs") | .Vulnerabilities[]? | .PkgName] | unique | length') | first }}
      severities: >-
        {{ read(outputs.scan_source.outputFiles['report.json']) | jq('[.Results[]? | select(.Class == "os-pkgs") | .Vulnerabilities[]?] as $v | ["CRITICAL", "HIGH", "MEDIUM", "LOW", "UNKNOWN"] | map(. as $s | {s: $s, n: ($v | map(select(.Severity == $s)) | length)}) | map(select(.n > 0) | .s + " " + (.n | tostring)) | join(", ")') | first }}
      os: >-
        {{ read(outputs.scan_source.outputFiles['report.json']) | jq('((.Metadata.OS.Family // "unknown") + " " + (.Metadata.OS.Name // "")) + (if .Metadata.OS.EOSL then " (end of life)" else "" end)') | first }}
      digest: >-
        {{ read(outputs.scan_source.outputFiles['report.json']) | jq('(.Metadata.RepoDigests // [])[0] // "" | split("@") | last') | first }}
      findings: >-
        {{ read(outputs.scan_source.outputFiles['report.json']) | jq('[.Results[]? | select(.Class == "os-pkgs") | .Vulnerabilities[]? | . + {rank: (if .Severity == "CRITICAL" then 0 elif .Severity == "HIGH" then 1 elif .Severity == "MEDIUM" then 2 elif .Severity == "LOW" then 3 else 4 end)}] | sort_by(.rank, .PkgName, .VulnerabilityID) | map(.Severity + "  " + .VulnerabilityID + "  " + .PkgName + " " + .InstalledVersion + " -> " + .FixedVersion) | join("\n")') | first }}

  - id: nothing_to_patch
    type: io.kestra.plugin.core.flow.If
    condition: "{{ (outputs.before.values.fixable | number) == 0 }}"
    then:
      - id: label_clean
        type: io.kestra.plugin.core.execution.Labels
        labels:
          outcome: nothing-to-patch
          fixable_before: "0"

      - id: log_clean
        type: io.kestra.plugin.core.log.Log
        message: "{{ inputs.repository }}:{{ inputs.tag }} ({{ outputs.before.values.os }}) has no OS package vulnerability with a fix available. Nothing to patch."

      - id: stop_clean
        type: io.kestra.plugin.core.execution.Exit
        state: SUCCESS

  - id: label_pending
    type: io.kestra.plugin.core.execution.Labels
    labels:
      outcome: awaiting-approval
      fixable_before: "{{ outputs.before.values.fixable }}"

  - id: show_findings
    type: io.kestra.plugin.core.log.Log
    message: |
      {{ outputs.target.values.source }} ({{ outputs.before.values.os }})
      Fixable OS package vulnerabilities: {{ outputs.before.values.fixable }} ({{ outputs.before.values.cves }} CVEs; {{ outputs.before.values.severities }}) in {{ outputs.before.values.packages }}.
      {{ outputs.before.values.findings }}
      Resume with PATCH to update these packages with Copacetic and publish {{ outputs.target.values.published }} once a re-scan confirms the fix, or REJECT to leave the registry unchanged.

  - id: approve
    type: io.kestra.plugin.core.flow.Pause
    description: Nothing is built or pushed before someone resumes this execution. If nobody answers within `approval_window`, the execution is cancelled.
    pauseDuration: "{{ vars.approval_window }}"
    behavior: CANCEL
    onResume:
      - id: decision
        type: SELECT
        displayName: Decision
        description: PATCH runs Copacetic and publishes the patched tag only if a re-scan shows fewer fixable vulnerabilities. REJECT changes nothing.
        isRadio: true
        expression: >-
          {{ [
          {'label': 'PATCH: fix ' ~ outputs.before.values.fixable ~ ' vulnerabilities (' ~ outputs.before.values.cves ~ ' CVEs) in ' ~ outputs.before.values.package_count ~ ' packages', 'value': 'PATCH'},
          {'label': 'REJECT: leave ' ~ inputs.repository ~ ':' ~ inputs.tag ~ ' as it is', 'value': 'REJECT'}
          ] }}

      - id: note
        type: STRING
        displayName: Note
        description: Why you decided this (a change ticket, for example). Kept in the execution.
        required: false

  - id: rejected
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.approve.onResume.decision == 'REJECT' }}"
    then:
      - id: label_rejected
        type: io.kestra.plugin.core.execution.Labels
        labels:
          outcome: rejected

      - id: log_rejected
        type: io.kestra.plugin.core.log.Log
        level: WARN
        message: "Patching {{ inputs.repository }}:{{ inputs.tag }} was rejected{{ (outputs.approve.onResume.note ?? '') == '' ? '' : ': ' ~ outputs.approve.onResume.note }}. Nothing was built or pushed; fixable vulnerabilities left in the image: {{ outputs.before.values.fixable }}."

      - id: stop_rejected
        type: io.kestra.plugin.core.execution.Exit
        state: WARNING

  - id: patch
    type: io.kestra.plugin.scripts.shell.Commands
    description: |
      Copacetic patches the digest Trivy scanned, so a tag moved while the approval waited changes nothing. It reads the Trivy report, has BuildKit upgrade only the listed packages on top of the original layers, and pushes the result to the staging repository. It fails if a package cannot be brought to its fixed version.
      The OpenVEX document lists every vulnerability the patch addresses. Copacetic logs to stderr, which Kestra records as errors, so `2>&1` keeps a successful patch at INFO.
    containerImage: "{{ vars.copa_image }}"
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      networkMode: host
    inputFiles:
      report.json: "{{ outputs.scan_source.outputFiles['report.json'] }}"
    outputFiles:
      - vex.json
    commands:
      - >-
        copa patch --image {{ vars.registry }}/{{ inputs.repository }}@{{ outputs.before.values.digest }} --report report.json
        --tag {{ outputs.target.values.staging }} --addr {{ vars.buildkit_addr }} --push
        --timeout 20m --progress plain --format openvex --output vex.json 2>&1

  - id: scan_patched
    type: io.kestra.plugin.scripts.shell.Commands
    containerImage: "{{ vars.trivy_image }}"
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      networkMode: host
    outputFiles:
      - report.json
    commands:
      - >-
        trivy image --server {{ vars.trivy_server }} --image-src remote
        --pkg-types os --ignore-unfixed --disable-telemetry --skip-version-check --quiet
        --format json --output report.json {{ outputs.target.values.staging }}

  - id: after
    type: io.kestra.plugin.core.output.OutputValues
    values:
      fixable: >-
        {{ read(outputs.scan_patched.outputFiles['report.json']) | jq('[.Results[]? | select(.Class == "os-pkgs") | .Vulnerabilities[]?] | length') | first }}
      digest: >-
        {{ read(outputs.scan_patched.outputFiles['report.json']) | jq('(.Metadata.RepoDigests // [])[0] // "" | split("@") | last') | first }}
      remaining: >-
        {{ read(outputs.scan_patched.outputFiles['report.json']) | jq('[.Results[]? | select(.Class == "os-pkgs") | .Vulnerabilities[]? | .Severity + "  " + .VulnerabilityID + "  " + .PkgName + " " + .InstalledVersion + " -> " + .FixedVersion] | join("\n")') | first }}

  - id: verify
    type: io.kestra.plugin.core.execution.Assert
    description: The staged image must be a new image with fewer fixable vulnerabilities than the original. Otherwise the flow fails here and nothing is published.
    conditions:
      - "{{ outputs.after.values.digest != '' and outputs.after.values.digest != outputs.before.values.digest }}"
      - "{{ (outputs.after.values.fixable | number) < (outputs.before.values.fixable | number) }}"
    errorMessage: "The patched image {{ outputs.target.values.staging }} still has {{ outputs.after.values.fixable }} fixable vulnerabilities (the original had {{ outputs.before.values.fixable }}), so it was not published."

  - id: publish
    type: io.kestra.plugin.scripts.shell.Commands
    description: Copies the verified digest, not the staging tag, so the published image is byte for byte the one that was scanned. Within one registry only the manifest is written; the layers are mounted.
    containerImage: "{{ vars.regctl_image }}"
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      networkMode: host
    env:
      REGCTL_HOST: "reg={{ vars.registry }},tls={{ vars.registry_tls }}"
      VERIFIED: "{{ vars.registry }}/{{ vars.staging_prefix }}/{{ inputs.repository }}@{{ outputs.after.values.digest }}"
      PUBLISHED: "{{ outputs.target.values.published }}"
      EXPECTED_DIGEST: "{{ outputs.after.values.digest }}"
    commands:
      - regctl --host "$REGCTL_HOST" image copy "$VERIFIED" "$PUBLISHED"
      - DIGEST=$(regctl --host "$REGCTL_HOST" image digest "$PUBLISHED")
      - test "$DIGEST" = "$EXPECTED_DIGEST" || { echo "$PUBLISHED resolves to $DIGEST, expected $EXPECTED_DIGEST"; exit 1; }
      - echo "::{\"outputs\":{\"digest\":\"$DIGEST\"}}::"

  - id: label_patched
    type: io.kestra.plugin.core.execution.Labels
    labels:
      outcome: patched
      fixable_after: "{{ outputs.after.values.fixable }}"

  - id: log_summary
    type: io.kestra.plugin.core.log.Log
    message: |
      Published {{ outputs.target.values.published }} ({{ outputs.publish.vars.digest }}), approved{{ (outputs.approve.onResume.note ?? '') == '' ? '' : ' with the note "' ~ outputs.approve.onResume.note ~ '"' }}.
      Fixable OS package vulnerabilities: {{ outputs.before.values.fixable }} before, {{ outputs.after.values.fixable }} after.
      {% if (outputs.after.values.fixable | number) == 0 %}None remain.{% else %}Still open:
      {{ outputs.after.values.remaining }}{% endif %}

errors:
  - id: label_failed
    type: io.kestra.plugin.core.execution.Labels
    labels:
      outcome: failed

  - id: log_failure
    type: io.kestra.plugin.core.log.Log
    level: ERROR
    message: "Patching {{ inputs.repository }}:{{ inputs.tag }} failed in {{ (errorLogs() | last).taskId ?? 'an unknown task' }}: {{ (errorLogs() | last).message ?? 'see the execution logs' }}. {{ outputs.target.values.published ?? 'The patched tag' }} was not published."

outputs:
  - id: fixable_before
    type: STRING
    value: "{{ outputs.before.values.fixable ?? '' }}"

  - id: fixable_after
    type: STRING
    value: "{{ outputs.after.values.fixable ?? '' }}"

  - id: patched_image
    type: STRING
    value: "{{ (outputs.publish.vars.digest ?? '') == '' ? '' : outputs.target.values.published ~ '@' ~ outputs.publish.vars.digest }}"

triggers:
  - id: on_push
    type: io.kestra.plugin.core.trigger.Webhook
    description: The registry posts one event per request. Only pushes of a tagged single-platform manifest start an execution; the flow's own pushes (staging repository, patched suffix) are ignored, and the registry gets a 204 for them.
    key: "{{ secret('REGISTRY_WEBHOOK_KEY') }}"
    when: >-
      {%- set event = trigger.body.events[0] -%}
      {{ event.action == 'push'
      and (event.target.tag ?? '') != ''
      and (['application/vnd.oci.image.manifest.v1+json', 'application/vnd.docker.distribution.manifest.v2+json'] contains event.target.mediaType)
      and not (event.target.repository | startsWith(vars.staging_prefix ~ '/'))
      and not (event.target.tag | endsWith(vars.patched_suffix)) }}
    inputs:
      repository: "{{ trigger.body.events[0].target.repository }}"
      tag: "{{ trigger.body.events[0].target.tag }}"
      digest: "{{ trigger.body.events[0].target.digest }}"

extend:
  title: Patch container images with Copacetic on registry push, after approval and a Trivy re-scan
  metaTitle: Copacetic image patching on registry push with approval and Trivy verification | Kestra
  shortDescription: Every image pushed to your registry is scanned with Trivy. When OS packages have fixes, the execution waits for approval, Copacetic patches the image, Trivy scans it again, and the patched tag is published only if fewer fixable vulnerabilities remain.
  metaDescription: Scan each pushed image with Trivy, approve the fix, patch it with Copacetic and BuildKit, re-scan, and publish the patched tag only when the re-scan improved.
  description: |
    Fixing the vulnerabilities a scanner finds in an image usually means waiting for whoever owns the Dockerfile to rebuild it. [Copacetic](https://project-copacetic.github.io/copacetic/website/) (`copa`, a CNCF project) patches the existing image instead, upgrading only the vulnerable OS packages in one new layer. This flow runs it on every push to your registry: Trivy scans the image, a person approves the list of fixes, Copacetic patches it through BuildKit, Trivy scans the result, and `<tag>-patched` is published next to the original only if the re-scan found fewer fixable vulnerabilities.

    This blueprint was created by [kruxarth](https://github.com/kruxarth).

    ## How it differs from the Copacetic hotpatch engine blueprint

    `copacetic-container-vulnerability-hotpatch-engine` runs every 6 hours for one image set in its inputs, and decides from severity counts read from a scanner metrics endpoint. This flow:

    - **Starts from the registry.** The push notification is the trigger, so each pushed image gets its own execution within seconds. There is no schedule and no list of images to keep up to date.
    - **Patches what it scanned.** Trivy scans the pushed digest, Copacetic gets that Trivy report, and `copa patch` runs on the digest rather than the tag.
    - **Publishes only after a re-scan.** The patched image goes to a staging repository first. Trivy scans it again, and `<tag>-patched` is published only when the re-scan finds a new digest with fewer fixable vulnerabilities.

    ## How it works

    1. `on_push` (`io.kestra.plugin.core.trigger.Webhook`) receives the registry's push notification. Only a tagged single-platform manifest starts an execution; the flow's own pushes get a 204 and start nothing. You can also execute it by hand with a repository and tag.
    2. `scan_source` (`io.kestra.plugin.scripts.shell.Commands` in the Trivy image) scans the image against a Trivy server, keeping OS package vulnerabilities that have a fixed version. `before` counts them by severity and package.
    3. Nothing fixable: the execution ends with `outcome: nothing-to-patch`.
    4. Otherwise `show_findings` logs each vulnerability with its installed and fixed version, and `approve` (`Pause`) waits for **PATCH** or **REJECT** and a note. The form shows the counts. Without an answer within `approval_window` (7 days), the execution is cancelled.
    5. **REJECT** ends in `WARNING` with `outcome: rejected`. Nothing is built or pushed.
    6. **PATCH**: `patch` runs `copa patch` on the scanned digest. BuildKit upgrades the reported packages and pushes the result to `copa-staging/<repository>:<tag>-patched`, with an OpenVEX document of the fixes.
    7. `scan_patched` scans the staged image, and `verify` (`Assert`) fails the execution unless it is a new digest with fewer fixable vulnerabilities.
    8. `publish` copies that digest to `<repository>:<tag>-patched` with `regctl` and checks the tag resolves to it. The original tag is never touched.

    ## What you get

    - The fix is applied, not suggested, and only after someone approved it with a note.
    - The published image is byte for byte the one that passed the re-scan; a patch that did not help is never published.
    - In a test, `nginx:1.29.0-alpine` went from 221 fixable vulnerabilities (147 CVEs, 3 critical) to 0: Copacetic upgraded 20 packages in 9 seconds, the tag was published 11 seconds after approval, and `nginx -t` still passed in the patched image.
    - Both Trivy reports and the OpenVEX file stay with the execution, and the labels `outcome`, `fixable_before` and `fixable_after` make every image's history searchable.

    ## Who it's for

    - Platform and security teams that run a registry and use images they don't build: vendor images, base images, internal images whose owners have moved on.
    - Teams that need a fix today and a record of the decision, while the proper rebuild goes through the normal pipeline.

    ## Why orchestrate this with Kestra

    - The registry calls Kestra directly, so a push is scanned within seconds without a poller.
    - `Pause` with `onResume` inputs gives an approval form in the UI and an API endpoint, and each image is its own execution with logs, labels and outputs.
    - Each tool runs in its own pinned container through the Docker task runner, and the whole process is one readable YAML file instead of a CI script.

    ## Prerequisites

    - Docker on the Kestra host, with its socket available to Kestra. The task containers use the host network, so `localhost` is the Docker host.
    - A registry that sends push notifications. With [Distribution](https://distribution.github.io/distribution/about/notifications/) (`registry:3`), add this to its `config.yml`:

      ```yaml
      notifications:
        endpoints:
          - name: kestra
            url: http://localhost:8080/api/v1/main/executions/webhook/company.security/copacetic-patch-on-registry-push/<REGISTRY_WEBHOOK_KEY>
            timeout: 5s
            threshold: 3
            backoff: 10s
            ignore:
              mediatypes: [application/octet-stream]
              actions: [pull]
      ```

      ```bash
      docker run -d --name registry --network host -v $PWD/config.yml:/etc/distribution/config.yml:ro registry:3.1.2
      ```

    - A BuildKit daemon told that the registry speaks plain HTTP, and a Trivy server, which keeps the vulnerability database:

      ```bash
      printf '[registry."localhost:5000"]\n  http = true\n' > buildkitd.toml
      docker run -d --name buildkitd --network host --privileged -v $PWD/buildkitd.toml:/etc/buildkit/buildkitd.toml:ro moby/buildkit:v0.34.1 --addr tcp://127.0.0.1:1234
      docker run -d --name trivy-server --network host -v trivy-cache:/root/.cache/trivy aquasec/trivy:0.76.0 server --listen 127.0.0.1:4954
      ```

    - Network access from BuildKit to the distribution's package mirrors (for example `dl-cdn.alpinelinux.org`).

    ### Secrets

    - `REGISTRY_WEBHOOK_KEY`: the key in the notification URL. Anyone who knows it can start a scan.

    ## Quick start

    1. Start the registry, BuildKit and the Trivy server, add the secret, and save the flow.
    2. Push an old image: `docker pull nginx:1.29.0-alpine && docker tag nginx:1.29.0-alpine localhost:5000/demo/nginx:1.29.0-alpine && docker push localhost:5000/demo/nginx:1.29.0-alpine`.
    3. An execution starts and pauses. Read the list in its logs, click **Resume**, choose **PATCH** and add a note.
    4. When it succeeds, `localhost:5000/demo/nginx:1.29.0-alpine-patched` exists and the flow outputs give its digest and both counts. The original tag still points to the original image.

    ## Things to know

    - Copacetic patches OS packages (apk, apt, yum/dnf). Application dependencies are left out of the scans and still need a rebuild.
    - A multi-platform index does not start an execution (its per-platform manifests are pushed untagged). Push single-platform tags, or extend the flow with Copacetic's `--platform`.
    - Kestra keeps the decision, the note and when it was made. Put the approver or the change ticket in the note.
    - Flow outputs are set when an image is published; for the other outcomes, read the labels.
    - Running the flow again for a tag replaces `<tag>-patched`. The staging repository keeps the last candidate for when `verify` fails.
    - For a registry with authentication or HTTPS, give the three tool containers credentials (for example a mounted Docker `config.json`) and set `registry_tls: enabled`. BuildKit and the Trivy server run here without TLS or a token, so keep them on localhost.

    ## How to extend

    - Notify the approvers from `onPause` on `approve`, with a link to the execution.
    - Sign the published digest with cosign, or roll it out to a Kubernetes deployment, after `publish`.
    - Add a nightly `Schedule` that runs the flow for the tags you deploy, so images are re-checked when new CVEs are published, not only on push.

    ## Links

    - [Copacetic](https://project-copacetic.github.io/copacetic/website/)
    - [Trivy client/server mode](https://trivy.dev/latest/docs/references/modes/client-server/)
    - [Registry notifications](https://distribution.github.io/distribution/about/notifications/)
    - [regctl](https://regclient.org/cli/regctl/image/)
    - [Webhook trigger](https://kestra.io/plugins/core/trigger/io.kestra.plugin.core.trigger.webhook), [Pause task](https://kestra.io/plugins/core/flow/io.kestra.plugin.core.flow.pause) and [Docker task runner](https://kestra.io/docs/task-runners/types/docker-task-runner)
  tags:
    - Infrastructure
  subTags:
    - Approval Gates
    - CI/CD & Deployment
  ee: false
  demo: false
