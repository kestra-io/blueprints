id: llm-token-budget-cost-guardrail
namespace: company.team
description: |
  Enforce per-team LLM spend limits: every gateway usage event lands in Postgres,
  one query flags teams that reached their daily dollar cap, and over-budget teams
  get KV-quarantined, alerted in Slack, and filed as a GitHub issue.

inputs:
  - id: budgets
    type: JSON
    displayName: Per-team daily budgets
    description: One entry per team - team name, model filter (* matches all models), and the daily USD cap.
    defaults:
      - team: research
        model: "*"
        daily_limit_usd: 50
      - team: support
        model: "*"
        daily_limit_usd: 25
      - team: data
        model: gpt-4o
        daily_limit_usd: 15

  - id: repository
    type: STRING
    displayName: GitHub repository for budget issues
    description: owner/repo where over-budget teams get an issue, e.g. your-org/platform.
    defaults: your-org/your-repo

tasks:
  - id: record_usage
    type: io.kestra.plugin.jdbc.postgresql.Queries
    description: Persist the usage event posted by the LLM gateway or proxy.
    url: "{{ secret('POSTGRES_JDBC_URL') }}"
    username: "{{ secret('POSTGRES_USERNAME') }}"
    password: "{{ secret('POSTGRES_PASSWORD') }}"
    fetchType: NONE
    sql: |
      INSERT INTO llm_usage (team, model, prompt_tokens, completion_tokens, cost_usd, occurred_at)
      VALUES (
        '{{ trigger.body.team ?? "unknown" }}',
        '{{ trigger.body.model ?? "unknown" }}',
        {{ trigger.body.prompt_tokens ?? 0 }},
        {{ trigger.body.completion_tokens ?? 0 }},
        {{ trigger.body.cost_usd ?? 0 }},
        now()
      );

  - id: daily_spend_check
    type: io.kestra.plugin.jdbc.postgresql.Query
    description: Teams whose spend today reached their cap - budgets rendered as VALUES, joined against today's rollup.
    url: "{{ secret('POSTGRES_JDBC_URL') }}"
    username: "{{ secret('POSTGRES_USERNAME') }}"
    password: "{{ secret('POSTGRES_PASSWORD') }}"
    fetchType: FETCH
    sql: |
      WITH budgets(team, model, daily_limit_usd) AS (
        VALUES
        {% for b in inputs.budgets %}
          ('{{ b.team }}', '{{ b.model }}', {{ b.daily_limit_usd }}){% if not loop.last %},{% endif %}
        {% endfor %}
      ),
      spend AS (
        SELECT team, model,
               round(sum(cost_usd)::numeric, 2) AS spent_usd,
               sum(prompt_tokens + completion_tokens) AS tokens
        FROM llm_usage
        WHERE occurred_at >= date_trunc('day', now())
        GROUP BY team, model
      ),
      team_totals AS (
        SELECT team,
               round(sum(cost_usd)::numeric, 2) AS team_spent_usd,
               sum(prompt_tokens + completion_tokens) AS team_tokens
        FROM llm_usage
        WHERE occurred_at >= date_trunc('day', now())
        GROUP BY team
      )
      SELECT b.team,
             CASE WHEN b.model = '*' THEN 'all models' ELSE b.model END AS model,
             b.daily_limit_usd,
             CASE WHEN b.model = '*'
                  THEN coalesce(tt.team_spent_usd, 0)
                  ELSE coalesce(s.spent_usd, 0) END AS spent_usd,
             CASE WHEN b.model = '*'
                  THEN coalesce(tt.team_tokens, 0)
                  ELSE coalesce(s.tokens, 0) END AS tokens
      FROM budgets b
      LEFT JOIN team_totals tt ON b.model = '*' AND tt.team = b.team
      LEFT JOIN spend s ON b.model <> '*' AND s.team = b.team AND s.model = b.model
      WHERE CASE WHEN b.model = '*'
                 THEN coalesce(tt.team_spent_usd, 0)
                 ELSE coalesce(s.spent_usd, 0) END >= b.daily_limit_usd
      ORDER BY spent_usd DESC;

  - id: budget_gate
    type: io.kestra.plugin.core.flow.If
    description: Quarantine and notify per over-budget team, open a tracking issue, log an all-clear otherwise.
    condition: "{{ outputs.daily_spend_check.rows | length > 0 }}"
    then:
      - id: quarantine_offenders
        type: io.kestra.plugin.core.flow.Loop
        description: Set a KV budget-lock per offending team and alert its channel numbers.
        values: "{{ outputs.daily_spend_check.rows }}"
        tasks:
          - id: set_budget_lock
            type: io.kestra.plugin.core.kv.Set
            description: Store the breach row under llm_budget_lock/<team> so gateways or guard flows can refuse new calls.
            key: "llm_budget_lock/{{ item.value.team }}"
            value: "{{ item.value | json }}"
            kvType: JSON

          - id: alert_team
            type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
            url: "{{ secret('SLACK_WEBHOOK_URL') }}"
            messageText: |
              :money_with_wings: LLM daily budget hit for *{{ item.value.team }}* ({{ item.value.model }}): ${{ item.value.spent_usd }} of ${{ item.value.daily_limit_usd }} spent today ({{ item.value.tokens }} tokens). Route or pause new calls until tomorrow's reset.

      - id: open_issue
        type: io.kestra.plugin.github.issues.Create
        description: One labeled issue listing every offending team with the numbers.
        jwtToken: "{{ secret('GITHUB_TOKEN') }}"
        repository: "{{ inputs.repository }}"
        title: "LLM budget exceeded: {{ outputs.daily_spend_check.rows | length }} team(s) over daily cap"
        labels:
          - finops
          - llm-budget
        body: |
          ## Daily LLM budget breach

          | Team | Model | Spent (USD) | Cap (USD) | Tokens |
          |---|---|---|---|---|
          {% for r in outputs.daily_spend_check.rows %}
          | {{ r.team }} | {{ r.model }} | {{ r.spent_usd }} | {{ r.daily_limit_usd }} | {{ r.tokens }} |
          {% endfor %}

          Execution `{{ execution.id }}` recorded the breach at {{ execution.startDate }}.
          Each offending team is marked with a `llm_budget_lock/<team>` KV key until tomorrow's reset.

    else:
      - id: log_within_budget
        type: io.kestra.plugin.core.log.Log
        message: "All {{ inputs.budgets | length }} budgeted team(s) are within their daily LLM caps - {{ outputs.daily_spend_check.rows | length }} breach(es)."

outputs:
  - id: over_budget_count
    type: INT
    value: "{{ outputs.daily_spend_check.rows | length }}"

  - id: offenders
    type: JSON
    value: "{{ outputs.daily_spend_check.rows | json }}"

errors:
  - id: alert_on_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    messageText: ":rotating_light: LLM budget guard {{ flow.id }} FAILED (execution {{ execution.id }}). Spend is unmeasured while this fails. Error: {{ error.message }}"

triggers:
  - id: usage_events
    type: io.kestra.plugin.core.trigger.Webhook
    description: Every completed LLM call posts its usage record here - wire your gateway or proxy to this URL. Replace the key with your own value.
    key: replace-with-a-random-key

extend:
  title: LLM Token and Dollar Budget Guardrail for Teams
  shortDescription: Track every LLM gateway usage event in Postgres, lock and alert teams that hit their daily dollar cap, and open a GitHub issue with the offenders.
  metaTitle: LLM Cost Budget Guardrail Blueprint for Kestra
  metaDescription: "Stop runaway LLM bills in Kestra: gateway usage events land in Postgres, over-budget teams get locked, alerted in Slack, and filed as GitHub issues."
  description: |
    LLM spend rarely explodes in one call - it explodes one small charge at a time, across hundreds of calls, until the invoice arrives. A team wires up a new agent, another leaves a loop running, and nobody notices because per-call costs look trivial in isolation. This blueprint turns budget enforcement into an event-driven workflow: the gateway posts every usage record, a single query compares today's spend against per-team caps, and the moment a team crosses its limit it is locked, notified, and tracked to closure.

    ## How it works

    1. `record_usage` (`io.kestra.plugin.jdbc.postgresql.Queries`, `fetchType: NONE`) receives the usage event from your LLM gateway webhook - team, model, prompt and completion tokens, and the cost of that call - and appends it to the `llm_usage` table.
    2. `daily_spend_check` (`io.kestra.plugin.jdbc.postgresql.Query`, `FETCH`) renders your `budgets` input as SQL `VALUES`, aggregates today's spend per team (all models) or per team-and-model (specific model caps), and returns only the rows at or over their limit.
    3. `budget_gate` (`io.kestra.plugin.core.flow.If`) branches on the breach. Inside a `Loop` over the offending teams, `set_budget_lock` (`io.kestra.plugin.core.kv.Set`) writes a `llm_budget_lock/<team>` KV key that a gateway sidecar or a parent flow can read to refuse new calls, and `alert_team` posts the exact numbers to Slack - spent, cap, tokens.
    4. `open_issue` (`io.kestra.plugin.github.issues.Create`) opens one labeled issue with a table of every offending team, so budget breaches get worked like any other engineering ticket instead of vanishing into a chat channel.
    5. The flow-level `errors` handler alerts Slack when the guard itself fails, because unmeasured spend is worse than measured spend.

    ## What you get

    - Per-team daily dollar caps with optional per-model precision - one JSON input, no SQL edits.
    - A durable usage ledger in Postgres you can slice by team, model, or day.
    - Automatic quarantine keys (`llm_budget_lock/<team>`) for downstream enforcement.
    - `over_budget_count` and the full offender list as flow outputs for dashboards.
    - A GitHub issue trail - budget breaches become assignable, closable work.

    ## Who it's for

    - Platform teams running shared LLM gateways (LiteLLM, OpenRouter, custom proxies) across many product teams.
    - FinOps owners who need per-team chargeback and hard stops instead of retrospective invoices.
    - Engineering leads who want an agent experiment to pause at $50, not surface at $5,000.

    ## Why orchestrate this with Kestra

    Budget logic embedded in a gateway dies when the gateway changes, and a cron script that checks costs alerts nobody at 2 a.m. Kestra gives you a webhook trigger on every usage event, a failure path that pages instead of hiding, KV state for the lock, and a loop that fans out alerts per team - all visible in an execution history you can audit when a team disputes its bill.

    ## Prerequisites

    - PostgreSQL 12 or reachable from Kestra with the usage table:

      ```sql
      CREATE TABLE llm_usage (
        id BIGSERIAL PRIMARY KEY,
        team TEXT NOT NULL,
        model TEXT NOT NULL,
        prompt_tokens BIGINT NOT NULL DEFAULT 0,
        completion_tokens BIGINT NOT NULL DEFAULT 0,
        cost_usd NUMERIC(12,6) NOT NULL,
        occurred_at TIMESTAMPTZ NOT NULL DEFAULT now()
      );
      ```

    - An LLM gateway, proxy, or SDK wrapper that can POST a JSON usage record per completed call.
    - A Kestra instance.

    ### Secrets

    - `POSTGRES_JDBC_URL`: JDBC URL for the usage database (for example `jdbc:postgresql://host:5432/llmops`).
    - `POSTGRES_USERNAME`: database username.
    - `POSTGRES_PASSWORD`: database password.
    - `SLACK_WEBHOOK_URL`: Slack incoming webhook for breach and failure alerts.
    - `GITHUB_TOKEN`: token with issue-write access to the `repository` input.

    ## Quick start

    1. Add the five secrets above and create the `llm_usage` table.
    2. Set the `budgets` input to your real teams and caps, and point `repository` at your ops repo.
    3. Point your gateway's usage/cost webhook at the `usage_events` trigger URL.
    4. Fire a test event (`{"team":"research","model":"gpt-4o","prompt_tokens":1200,"completion_tokens":400,"cost_usd":0.02}`) and confirm the row lands.
    5. Lower a cap below your test spend and fire again - expect the KV lock, the Slack alert, and the GitHub issue.

    ## How to extend

    - Enforce the lock: have your gateway read `llm_budget_lock/<team>` from KV and reject or queue calls while the key exists (keys are naturally reset daily - clear them with a scheduled flow at midnight).
    - Add a disabled daily schedule and gate `record_usage` behind an `If` on `trigger.body`, so a sweep re-checks spend even when a gateway batches its webhooks.
    - Escalate repeated breaches: chain a PagerDuty or Squadcast task after `alert_team` for teams that breach on consecutive days.
    - Feed chargeback: copy `llm_usage` daily aggregates into your billing warehouse with a `Flow` trigger chained from this one.

    ## Links

    - Plugin docs: https://kestra.io/plugins/plugin-jdbc-postgres
    - KV storage in Kestra: https://kestra.io/docs/concepts/kv-store
    - Webhook trigger: https://kestra.io/docs/concepts/triggers
    - This blueprint has been created by [RudraMalvankar](https://github.com/RudraMalvankar)
  tags:
    - AI
  subTags:
    - LLMOps
    - Cost Management
  ee: false
  demo: false
