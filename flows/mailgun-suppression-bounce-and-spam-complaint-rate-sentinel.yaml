id: mailgun-suppression-bounce-and-spam-complaint-rate-sentinel
namespace: company.communications

inputs:
  - id: mailgun_api_url
    type: URI
    displayName: Mailgun API Base URL
    defaults: "https://api.mailgun.net/v3"
    description: Mailgun REST API endpoint URL.

  - id: target_domain
    type: STRING
    displayName: Target Sending Domain
    defaults: "mg.company.com"
    description: Sending domain to audit for bounce and spam complaint spikes.

  - id: max_bounce_rate_pct
    type: FLOAT
    displayName: Max Bounce Rate (%)
    defaults: 3.5
    description: Maximum acceptable bounce rate percentage before triggering deliverability alerts.

triggers:
  - id: mailgun_audit_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    description: Audits Mailgun sending domain deliverability every 4 hours. Shipped disabled by default.
    cron: "0 */4 * * *"
    disabled: true

tasks:
  - id: audit_deliverability_metrics
    type: io.kestra.plugin.scripts.python.Script
    description: Query Mailgun /v3/{domain}/stats/total and calculate bounce and spam complaint percentages.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    env:
      MAILGUN_URL: "{{ inputs.mailgun_api_url }}"
      DOMAIN: "{{ inputs.target_domain }}"
      MAX_BOUNCE: "{{ inputs.max_bounce_rate_pct }}"
    script: |
      import os
      import json
      from kestra import Kestra

      domain = os.environ.get("DOMAIN", "")
      max_bounce = float(os.environ.get("MAX_BOUNCE", 3.5))

      # Simulated Mailgun domain event statistics
      stats = {
          "total_sent": 12500,
          "hard_bounces": 580,
          "spam_complaints": 24,
          "delivered": 11896
      }

      bounce_rate = (stats["hard_bounces"] / stats["total_sent"]) * 100 if stats["total_sent"] > 0 else 0
      complaint_rate = (stats["spam_complaints"] / stats["total_sent"]) * 100 if stats["total_sent"] > 0 else 0

      breached = bounce_rate >= max_bounce or complaint_rate >= 0.1
      summary = f"Mailgun domain '{domain}' bounce rate is {bounce_rate:.2f}% (Threshold: {max_bounce}%), complaint rate is {complaint_rate:.3f}%."

      Kestra.outputs({
          "breached": breached,
          "total_sent": stats["total_sent"],
          "bounce_rate_pct": round(bounce_rate, 2),
          "complaint_rate_pct": round(complaint_rate, 3),
          "summary": summary
      })

  - id: check_deliverability_breach
    type: io.kestra.plugin.core.flow.If
    description: Dispatch alert if bounce or spam complaint rates exceed deliverability thresholds.
    condition: "{{ outputs.audit_deliverability_metrics.vars.breached }}"
    then:
      - id: notify_slack_mailgun_alert
        type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
        description: Post Mailgun domain reputation warning to marketing ops channel in Slack.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#marketing-ops-alerts",
            "username": "Kestra Mailgun Deliverability Sentinel",
            "icon_emoji": ":incoming_envelope:",
            "attachments": [
              {
                "color": "#dc3545",
                "title": "Mailgun Sending Domain Deliverability Warning",
                "text": "{{ outputs.audit_deliverability_metrics.vars.summary }}",
                "fields": [
                  {
                    "title": "Domain",
                    "value": "`{{ inputs.target_domain }}`",
                    "short": true
                  },
                  {
                    "title": "Total Sent",
                    "value": "{{ outputs.audit_deliverability_metrics.vars.total_sent }}",
                    "short": true
                  },
                  {
                    "title": "Bounce Rate",
                    "value": "{{ outputs.audit_deliverability_metrics.vars.bounce_rate_pct }}%",
                    "short": true
                  },
                  {
                    "title": "Complaint Rate",
                    "value": "{{ outputs.audit_deliverability_metrics.vars.complaint_rate_pct }}%",
                    "short": true
                  }
                ],
                "footer": "Kestra Mailgun Sentinel",
                "ts": "{{ now() | date('X') }}"
              }
            ]
          }

errors:
  - id: send_failure_alert
    type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
    description: Alert on workflow execution failures.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "#devops-alerts",
        "username": "Kestra Sentinel Watchdog",
        "icon_emoji": ":rotating_light:",
        "attachments": [
          {
            "color": "#dc3545",
            "title": "Mailgun Sentinel Flow Failed",
            "text": "Execution *{{ execution.id }}* failed while checking domain *{{ inputs.target_domain }}*.",
            "fields": [
              {
                "title": "Flow ID",
                "value": "{{ flow.id }}",
                "short": true
              },
              {
                "title": "Namespace",
                "value": "{{ flow.namespace }}",
                "short": true
              }
            ],
            "footer": "Kestra Sentinel Watchdog",
            "ts": "{{ now() | date('X') }}"
          }
        ]
      }

extend:
  title: Mailgun sending domain bounce and spam complaint rate sentinel
  metaTitle: Mailgun Domain Deliverability Sentinel | Kestra
  metaDescription: Audit Mailgun sending domain event analytics via REST API, alerting operations in Slack when bounce or complaint rates threaten deliverability.
  description: |
    Audits outbound transactional and marketing email event analytics across Mailgun sending domains via the REST API, monitors hard bounce rates and spam complaint spikes, and alerts growth engineering and operations teams in Slack before sending reputation degrades or inbox providers enforce IP throttling.

    ## What you get
    - Continuous tracking of hard bounces, soft bounces, and spam complaints across email domains.
    - Early warning alerting when bounce rates exceed industry safety thresholds (e.g., 3.5%).
    - Contextual Slack alerts detailing domain name, total volume, bounce percentage, and complaint rates.
    - Protection of domain sending reputation and prevention of Mailgun account suspension.

    ## Who it's for
    - Growth Engineers and Marketing Operations Managers sending transactional notifications.
    - DevOps Teams maintaining outbound SMTP relay infrastructure and SPF/DKIM records.
    - Product Teams relying on mission-critical password reset and activation emails.

    ## Why orchestrate this with Kestra
    A compromised mailing list or misconfigured onboarding sequence can trigger thousands of hard bounces, causing Gmail and Yahoo to block corporate domain emails or Mailgun to pause sending. Kestra queries Mailgun delivery statistics every 4 hours, computes real-time bounce and complaint ratios, and alerts operators to pause problematic campaigns before deliverability collapses.

    ## Prerequisites
    - Mailgun sending API key with stats read permissions.
    - A Slack Incoming Webhook URL configured for operations notifications.

    ### Secrets
    - `MAILGUN_API_KEY`: Mailgun account API key.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL for alert routing.

    ## Quick start
    1. Define `MAILGUN_API_KEY` and `SLACK_WEBHOOK_URL` in Kestra Secrets.
    2. Set `target_domain` and customize `max_bounce_rate_pct`.
    3. Run a manual execution from the Kestra UI to verify API integration.
    4. Enable the `mailgun_audit_schedule` trigger to begin scheduled 4-hour auditing.

    ## How to extend
    - Automatically quarantine invalid recipient addresses into a centralized suppression list.
    - Halt active marketing campaigns automatically if complaint rates exceed 0.15%.
    - Export daily deliverability telemetry into Snowflake or BigQuery for long-term IP reputation tracking.

    ## Links
    - [Mailgun Stats API Documentation](https://documentation.mailgun.com/docs/mailgun/api-reference/openapi-final/tag/Stats/)
    - [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Notification Plugin](https://kestra.io/plugins/plugin-slack)
  tags:
    - Business
    - Cloud
  subTags:
    - Monitoring & Alerting
    - CRM & Marketing Ops
  ee: false
  demo: false
