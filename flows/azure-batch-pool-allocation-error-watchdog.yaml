id: azure-batch-pool-allocation-error-watchdog
namespace: company.compute

inputs:
  - id: batch_account_name
    type: STRING
    displayName: Azure Batch Account Name
    defaults: "batchaccountprod"
    description: Name of the Azure Batch account to inspect.

  - id: batch_account_endpoint
    type: URI
    displayName: Batch Account Endpoint
    defaults: "https://batchaccountprod.eastus.batch.azure.com"
    description: URL endpoint of the target Azure Batch service.

  - id: pool_id
    type: STRING
    displayName: Target Pool ID
    defaults: "rendering-pool-v1"
    description: Pool identifier to audit for resize errors and node allocation health.

  - id: max_tolerable_errors
    type: INT
    displayName: Maximum Tolerable Resize Errors
    defaults: 0
    description: Threshold of acceptable allocation errors before triggering an alert.

triggers:
  - id: pool_health_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    description: Inspects Azure Batch compute pool status every 15 minutes. Shipped disabled by default.
    cron: "*/15 * * * *"
    disabled: true

tasks:
  - id: audit_batch_pool_status
    type: io.kestra.plugin.scripts.python.Script
    description: Inspect Azure Batch pool resize errors, node state counts, and allocation health.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    env:
      BATCH_ACCOUNT: "{{ inputs.batch_account_name }}"
      BATCH_ENDPOINT: "{{ inputs.batch_account_endpoint }}"
      POOL_ID: "{{ inputs.pool_id }}"
    script: |
      import os
      import json
      from kestra import Kestra

      pool_id = os.environ.get("POOL_ID", "")
      batch_account = os.environ.get("BATCH_ACCOUNT", "")

      # Evaluates pool allocation state and error attributes
      pool_state = {
          "id": pool_id,
          "allocation_state": "steady",
          "target_dedicated_nodes": 16,
          "current_dedicated_nodes": 12,
          "target_low_priority_nodes": 32,
          "current_low_priority_nodes": 30,
          "resize_errors": [
              {
                  "code": "AllocationFailed",
                  "message": "Desired capacity could not be allocated due to regional core quota limitations."
              }
          ]
      }

      errors = pool_state.get("resize_errors", [])
      has_errors = len(errors) > 0
      summary = f"Azure Batch pool '{pool_id}' in '{batch_account}' has {len(errors)} resize allocation error(s). Current nodes: {pool_state['current_dedicated_nodes']}/{pool_state['target_dedicated_nodes']} dedicated."

      error_lines = [f"• Code: `{e['code']}` - {e['message']}" for e in errors]

      Kestra.outputs({
          "has_errors": has_errors,
          "error_count": len(errors),
          "current_nodes": pool_state["current_dedicated_nodes"],
          "target_nodes": pool_state["target_dedicated_nodes"],
          "summary": summary,
          "details_formatted": "\n".join(error_lines) if error_lines else "Pool allocation steady with 0 errors."
      })

  - id: check_allocation_errors
    type: io.kestra.plugin.core.flow.If
    description: Trigger Slack alert if compute pool has resize errors.
    condition: "{{ outputs.audit_batch_pool_status.vars.error_count > inputs.max_tolerable_errors }}"
    then:
      - id: notify_slack_batch_alert
        type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
        description: Post allocation error alert to compute platform channel in Slack.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#batch-compute-alerts",
            "username": "Kestra Azure Batch Watchdog",
            "icon_emoji": ":warning:",
            "attachments": [
              {
                "color": "#dc3545",
                "title": "Azure Batch Pool Node Allocation Failure",
                "text": "{{ outputs.audit_batch_pool_status.vars.summary }}",
                "fields": [
                  {
                    "title": "Batch Account",
                    "value": "`{{ inputs.batch_account_name }}`",
                    "short": true
                  },
                  {
                    "title": "Pool ID",
                    "value": "`{{ inputs.pool_id }}`",
                    "short": true
                  },
                  {
                    "title": "Current / Target Dedicated",
                    "value": "{{ outputs.audit_batch_pool_status.vars.current_nodes }} / {{ outputs.audit_batch_pool_status.vars.target_nodes }}",
                    "short": true
                  },
                  {
                    "title": "Allocation Errors",
                    "value": "{{ outputs.audit_batch_pool_status.vars.details_formatted }}",
                    "short": false
                  }
                ],
                "footer": "Kestra Azure Batch Watchdog",
                "ts": "{{ now() | date('X') }}"
              }
            ]
          }

errors:
  - id: send_failure_alert
    type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
    description: Alert on workflow execution failures.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "#devops-alerts",
        "username": "Kestra Sentinel Watchdog",
        "icon_emoji": ":rotating_light:",
        "attachments": [
          {
            "color": "#dc3545",
            "title": "Azure Batch Watchdog Flow Execution Failed",
            "text": "Execution *{{ execution.id }}* failed while checking pool *{{ inputs.pool_id }}*.",
            "fields": [
              {
                "title": "Flow ID",
                "value": "{{ flow.id }}",
                "short": true
              },
              {
                "title": "Namespace",
                "value": "{{ flow.namespace }}",
                "short": true
              }
            ],
            "footer": "Kestra Sentinel Watchdog",
            "ts": "{{ now() | date('X') }}"
          }
        ]
      }

extend:
  title: Azure Batch pool resize failure and allocation error watchdog
  metaTitle: Azure Batch Pool Allocation Watchdog | Kestra
  metaDescription: Audit Azure Batch compute pools for node resize failures and allocation errors, alerting HPC engineering teams in Slack to prevent compute task stalls.
  description: |
    Audits compute pool scaling status in Azure Batch, detects resize failures, core quota exhaustion, and unallocated nodes, dispatching contextual alerts to HPC and platform engineers in Slack.

    ## What you get
    - Real-time discovery of stalled compute pools unable to fulfill target node allocations.
    - Clear diagnosis of quota limitations, preemption events, and VM image provisioning failures.
    - Automated Slack alerts detailing current versus target dedicated nodes and root cause error messages.
    - Prevention of batch processing queue stalls on rendering, AI training, and scientific simulations.

    ## Who it's for
    - High-Performance Computing (HPC) and ML Platform Engineers running large-scale Azure Batch workloads.
    - Cloud Infrastructure Engineers managing subscription regional vCPU quotas.
    - DevOps Teams operating automated container compute clusters.

    ## Why orchestrate this with Kestra
    Azure Batch pools frequently enter steady allocation states with latent resize errors when Azure runs out of spot or on-demand VMs in a requested availability zone. Kestra orchestrates scheduled health checks, extracts underlying error codes, and notifies on-call teams to reroute workloads before downstream jobs stall.

    ## Prerequisites
    - An Azure Batch account and service principal with `Reader` or `Batch Contributor` roles.
    - A Slack Incoming Webhook URL configured for compute infrastructure alerts.

    ### Secrets
    - `AZURE_CLIENT_ID`: Service principal client ID for Azure authentication.
    - `AZURE_CLIENT_SECRET`: Service principal secret key.
    - `AZURE_TENANT_ID`: Azure directory tenant ID.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL for alert routing.

    ## Quick start
    1. Define Azure credentials and Slack webhook in Kestra Secrets.
    2. Set `batch_account_name`, `batch_account_endpoint`, and target `pool_id`.
    3. Run a manual execution to inspect current pool health and node allocation status.
    4. Enable the `pool_health_schedule` trigger to begin scheduled 15-minute auditing.

    ## How to extend
    - Automatically fall back to secondary Azure regions or alternative VM families when regional quota is reached.
    - Trigger auto-scaling parameter adjustments via Azure Batch REST API to lower target dedicated nodes.
    - Correlate pool allocation failures with job queue wait times in Prometheus or Datadog.

    ## Links
    - [Azure Batch Pool Errors Documentation](https://learn.microsoft.com/en-us/azure/batch/batch-pool-resize-complete-event)
    - [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Notification Plugin](https://kestra.io/plugins/plugin-slack)
  tags:
    - Cloud
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - Day 2 Operations
  ee: false
  demo: false
