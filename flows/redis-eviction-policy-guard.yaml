id: redis-eviction-policy-guard
namespace: company.team

description: |
  Check that each Redis instance's maxmemory and maxmemory-policy match what it is used for.
  A cache needs a maxmemory and an allkeys or volatile eviction policy, otherwise it rejects
  writes with OOM once full. A store (sessions, queues, locks) needs noeviction, otherwise Redis
  silently deletes data under memory pressure. Report rejected writes and evicted keys from
  INFO, alert Slack, and optionally set the policy and maxmemory with CONFIG SET, then read the
  configuration back to verify.

inputs:
  - id: instances
    type: JSON
    displayName: Instances and their role
    description: >-
      Host to role. CACHE instances may lose keys, STORE instances must not. Example
      {"cache-1": "CACHE", "sessions-1": "STORE"}.
    defaults: '{"redis-cache": "CACHE", "redis-sessions": "STORE"}'

  - id: port
    type: INT
    displayName: Port
    defaults: 6379

  - id: cache_policy
    type: SELECT
    displayName: Policy applied to caches
    values:
      - allkeys-lru
      - allkeys-lfu
      - volatile-lru
      - volatile-lfu
      - volatile-ttl
    defaults: allkeys-lru

  - id: cache_maxmemory
    type: STRING
    displayName: maxmemory applied to caches with none
    description: A Redis memory value, for example 256mb. Only set when the cache has no limit at all.
    defaults: "256mb"

  - id: network
    type: STRING
    displayName: Docker network for redis-cli
    defaults: ""

  - id: auto_remediate
    type: BOOL
    displayName: Auto remediate
    defaults: false

  - id: dry_run
    type: BOOL
    displayName: Dry run
    description: Must be false, together with auto_remediate, for CONFIG SET to run.
    defaults: true

variables:
  mismatch: >-
    [.r[] | (.policy | split("\\n") | .[1]) as $p | (.max | split("\\n") | .[1] | tonumber) as $m
     | select((.role == "STORE" and $p != "noeviction") or (.role == "CACHE" and ($p == "noeviction" or $m == 0)))] | length
  after: >-
    [.r[] | "\(.host) (\(.role)) policy \(.policy | split("\\n") | .[1]), maxmemory \(.max | split("\\n") | .[1])"] | join("; ")

tasks:
  - id: read
    type: io.kestra.plugin.core.flow.Loop
    description: Read-only. maxmemory, policy and the eviction and rejection counters of every instance.
    values: "{{ inputs.instances | keys | toJson }}"
    outputs:
      - id: state
        type: STRING
        value: >-
          {{ {'host': item.value, 'role': inputs.instances[item.value], 'policy': outputs.policy.vars.command_1 ?? '', 'max': outputs.maxmem.vars.command_1 ?? '', 'stats': outputs.stats.vars.command_1 ?? ''} | toJson }}
    tasks:
      - id: one
        type: io.kestra.plugin.core.flow.Sequential
        allowFailure: true
        tasks:
          - id: policy
            type: io.kestra.plugin.redis.cli.RedisCLI
            host: "{{ item.value }}"
            port: "{{ inputs.port }}"
            taskRunner:
              type: io.kestra.plugin.scripts.runner.docker.Docker
              networkMode: "{{ inputs.network }}"
            commands:
              - CONFIG GET maxmemory-policy
          - id: maxmem
            type: io.kestra.plugin.redis.cli.RedisCLI
            host: "{{ item.value }}"
            port: "{{ inputs.port }}"
            taskRunner:
              type: io.kestra.plugin.scripts.runner.docker.Docker
              networkMode: "{{ inputs.network }}"
            commands:
              - CONFIG GET maxmemory
          - id: stats
            type: io.kestra.plugin.redis.cli.RedisCLI
            host: "{{ item.value }}"
            port: "{{ inputs.port }}"
            taskRunner:
              type: io.kestra.plugin.scripts.runner.docker.Docker
              networkMode: "{{ inputs.network }}"
            commands:
              - INFO stats

  - id: findings
    type: io.kestra.plugin.core.output.OutputValues
    values:
      items: >-
        {{ {'r': outputs.read.outputs | jq('map(.outputs.state | fromjson)') | first, 'cp': inputs.cache_policy, 'cm': inputs.cache_maxmemory} | jq('
           .cp as $cp | .cm as $cm
           | [.r[] | . as $x
              | ($x.policy | split("\\n") | .[1] // "") as $pol
              | ($x.max | split("\\n") | .[1] // "" | if . == "" then null else tonumber end) as $max
              | ($x.stats | split("\\n") | map(select(contains(":")) | gsub("\\r"; "") | split(":")) | map({(.[0]): .[1]}) | add // {}) as $s
              | ($s.evicted_keys // "0" | tonumber) as $ev
              | ($s.total_error_replies // "0" | tonumber) as $err
              | if $pol == "" then {host: $x.host, role: $x.role, code: "UNREACHABLE", severity: "HIGH", detail: "no CONFIG reply"}
                elif $x.role == "STORE" then
                  (if $pol != "noeviction" then {host: $x.host, role: $x.role, code: "STORE_EVICTS", severity: "CRITICAL",
                     detail: "policy \($pol): Redis deletes stored data under memory pressure, \($ev) keys evicted so far",
                     fix: ["CONFIG SET maxmemory-policy noeviction"]} else empty end)
                else
                  ( (if $pol == "noeviction" then {host: $x.host, role: $x.role, code: "CACHE_REJECTS_WRITES", severity: "HIGH",
                       detail: "policy noeviction: once full, writes fail with OOM (\($err) error replies so far)", fix: ["CONFIG SET maxmemory-policy \($cp)"]} else empty end),
                    (if $max == 0 then {host: $x.host, role: $x.role, code: "CACHE_UNBOUNDED", severity: "HIGH",
                       detail: "maxmemory 0: the cache grows until the host runs out of memory", fix: ["CONFIG SET maxmemory \($cm)"]} else empty end),
                    (if ($pol | startswith("volatile")) and $pol != $cp then {host: $x.host, role: $x.role, code: "CACHE_VOLATILE_POLICY", severity: "MEDIUM",
                       detail: "policy \($pol) only evicts keys with a TTL", fix: null} else empty end) )
                end]') | first | toJson }}

  - id: summary
    type: io.kestra.plugin.core.log.Log
    message: >-
      Redis eviction policy check on {{ inputs.instances | keys | length }} instances: {{ fromJson(outputs.findings.values.items) | length }} findings.
      {{ fromJson(outputs.findings.values.items) | jq('map("\(.severity) \(.code) \(.host) (\(.role)): \(.detail)") | join("; ")') | first }}

  - id: route
    type: io.kestra.plugin.core.flow.If
    condition: "{{ fromJson(outputs.findings.values.items) | length > 0 }}"
    then:
      - id: alert
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {{ {'text': 'Redis eviction settings: ' ~ (fromJson(outputs.findings.values.items) | jq('map("\(.severity) \(.code) \(.host): \(.detail)") | join("; ")') | first) ~ '.' ~ (inputs.auto_remediate and not inputs.dry_run ? ' Applying the policy now.' : ' No change applied (auto_remediate=' ~ inputs.auto_remediate ~ ', dry_run=' ~ inputs.dry_run ~ ').')} | toJson }}

      - id: remediate_gate
        type: io.kestra.plugin.core.flow.If
        condition: "{{ inputs.auto_remediate and not inputs.dry_run and fromJson(outputs.findings.values.items) | jq('map(select(.fix != null)) | length') | first > 0 }}"
        then:
          - id: remediate
            type: io.kestra.plugin.core.flow.Loop
            concurrencyLimit: 1
            values: "{{ fromJson(outputs.findings.values.items) | jq('[.[] | select(.fix != null) | .host as $h | .fix[] | {host: $h, cmd: .}]') | first | toJson }}"
            tasks:
              - id: config_set
                type: io.kestra.plugin.redis.cli.RedisCLI
                host: "{{ fromJson(item.value).host }}"
                port: "{{ inputs.port }}"
                taskRunner:
                  type: io.kestra.plugin.scripts.runner.docker.Docker
                  networkMode: "{{ inputs.network }}"
                commands:
                  - "{{ fromJson(item.value).cmd }}"

          - id: reread
            type: io.kestra.plugin.core.flow.Loop
            values: "{{ fromJson(outputs.findings.values.items) | jq('map(select(.fix != null) | .host) | unique') | first | toJson }}"
            outputs:
              - id: state
                type: STRING
                value: "{{ {'host': item.value, 'role': inputs.instances[item.value], 'policy': outputs.policy2.vars.command_1 ?? '', 'max': outputs.maxmem2.vars.command_1 ?? ''} | toJson }}"
            tasks:
              - id: policy2
                type: io.kestra.plugin.redis.cli.RedisCLI
                host: "{{ item.value }}"
                port: "{{ inputs.port }}"
                taskRunner:
                  type: io.kestra.plugin.scripts.runner.docker.Docker
                  networkMode: "{{ inputs.network }}"
                commands:
                  - CONFIG GET maxmemory-policy
              - id: maxmem2
                type: io.kestra.plugin.redis.cli.RedisCLI
                host: "{{ item.value }}"
                port: "{{ inputs.port }}"
                taskRunner:
                  type: io.kestra.plugin.scripts.runner.docker.Docker
                  networkMode: "{{ inputs.network }}"
                commands:
                  - CONFIG GET maxmemory

          - id: verify_result
            type: io.kestra.plugin.core.flow.If
            description: Stores must be noeviction, caches must evict and have a maxmemory.
            condition: "{{ {'r': outputs.reread.outputs | jq('map(.outputs.state | fromjson)') | first} | jq(vars.mismatch) | first > 0 }}"
            then:
              - id: remediation_failed
                type: io.kestra.plugin.core.execution.Fail
                errorMessage: "CONFIG SET ran, but some instances still do not match their role."
            else:
              - id: remediated
                type: io.kestra.plugin.core.log.Log
                message: >-
                  Applied and verified: {{ {'r': outputs.reread.outputs | jq('map(.outputs.state | fromjson)') | first} | jq(vars.after) | first }}.
                  CONFIG SET is lost on restart: persist it in redis.conf or with CONFIG REWRITE.
    else:
      - id: matching
        type: io.kestra.plugin.core.log.Log
        message: "Every instance has the eviction settings its role needs."

errors:
  - id: alert_flow_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {{ {'text': 'Redis eviction policy guard failed (execution ' ~ execution.id ~ '). Check the logs.'} | toJson }}

triggers:
  - id: hourly
    type: io.kestra.plugin.core.trigger.Schedule
    description: Shipped disabled, and always in safe mode.
    cron: "20 * * * *"
    disabled: true
    inputs:
      auto_remediate: false
      dry_run: true

extend:
  title: Redis Eviction Policy Guard
  shortDescription: Check that each Redis instance's maxmemory and eviction policy fit its role, caches that must evict and stores that must never lose keys, alert Slack, and optionally fix them with CONFIG SET and verify.
  metaTitle: Redis Eviction Policy Guard with Kestra
  metaDescription: Catch Redis caches that reject writes with OOM and stores that silently evict data, alert Slack, set maxmemory-policy with CONFIG SET and verify.
  description: |
    The right `maxmemory-policy` depends entirely on what an instance holds, and the wrong one fails in two opposite ways:
    - **A cache with `noeviction`**, the default, stops accepting writes once it reaches `maxmemory`: every `SET` fails with `OOM command not allowed`, and the application sees errors instead of a cache miss.
    - **A cache with no `maxmemory`** at all grows until the host runs out of memory.
    - **A store with an eviction policy** quietly deletes data under memory pressure. Typical stores are sessions, job queues, rate-limit counters and locks.

    This blueprint reads `maxmemory`, `maxmemory-policy` and the eviction and error counters of every instance, and checks them against the role you declare. It alerts Slack, and can apply the right setting with `CONFIG SET`, then read it back to verify.

    This blueprint was created by [zkasuran](https://github.com/zkasuran).

    ## Findings

    | Finding | Role | Severity | Rule | Fix |
    |---|---|---|---|---|
    | `STORE_EVICTS` | `STORE` | Critical | Any policy other than `noeviction`, with the keys already evicted | `maxmemory-policy noeviction` |
    | `CACHE_REJECTS_WRITES` | `CACHE` | High | `noeviction`, with the error replies so far | `maxmemory-policy <cache_policy>` |
    | `CACHE_UNBOUNDED` | `CACHE` | High | `maxmemory 0` | `maxmemory <cache_maxmemory>` |
    | `CACHE_VOLATILE_POLICY` | `CACHE` | Medium | A `volatile-*` policy, which only evicts keys with a TTL | Report only |
    | `UNREACHABLE` | any | High | No `CONFIG` reply | Report only |

    ## How it works

    1. `read` (`io.kestra.plugin.core.flow.Loop`) runs `CONFIG GET maxmemory-policy`, `CONFIG GET maxmemory` and `INFO stats` on each instance with `io.kestra.plugin.redis.cli.RedisCLI`, read-only. An unreachable instance does not stop the others.
    2. `findings` applies the rules per role in one jq expression. `summary` logs the result.
    3. `route` (`io.kestra.plugin.core.flow.If`):
       - **matching:** logs it.
       - **findings:** `alert` posts to Slack.
         - `remediate_gate` runs only when `auto_remediate` is true and `dry_run` is false.
         - `remediate` (`concurrencyLimit: 1`) runs each `CONFIG SET` in its own task.
         - `reread` reads the settings again, and `verify_result` fails if any instance still does not match its role.
    4. `errors` alerts Slack when the flow fails.

    ## What you get

    - One view of the eviction settings of all your Redis instances, judged by what each one holds.
    - The cost so far: keys already evicted from stores, write errors already returned by caches.
    - The setting each role needs, applied and verified, with a reminder to persist it.

    ## Who it's for

    - Teams that run Redis both as a cache and as a store for sessions, queues or locks.
    - SREs who have seen `OOM command not allowed` errors from a full cache, or lost sessions after a traffic spike.
    - Teams evaluating the Redis plugin who want an example of `RedisCLI` reading and changing configuration across instances.

    ## Why orchestrate this with Kestra

    The eviction policy is set once, often by a Helm chart default, and nobody checks it against the instance's role. Kestra keeps the role of every instance next to the flow and checks them on a schedule. It sends mismatches to Slack with their impact, applies the fix behind `auto_remediate` and `dry_run`, verifies it, and keeps a history of every change.

    ## Tested end to end

    On Kestra 2.0.5 OSS against three Redis 7 containers, with a local HTTP sink standing in for Slack:
    - cache `bp-rcache`: `maxmemory 4mb`, `noeviction`. Filling it, 992 of 3,000 `SET` failed with `OOM command not allowed`;
    - store `bp-rqueue`: `maxmemory 64mb`, `allkeys-lru`. Filling it, Redis evicted 4,853 session keys;
    - cache `bp-rnolimit`: no `maxmemory`.

    | Run | Inputs | Result |
    |---|---|---|
    | 1 | defaults | 4 findings, with the 992 error replies and 4,853 evicted keys. Alert sent |
    | 2 | `auto_remediate: true`, `dry_run: true` | Same report. The cache is still `noeviction` |
    | 3 | `auto_remediate: true`, `dry_run: false` | 4 `CONFIG SET` applied and verified. Then in Redis: a `SET` on the full cache returns `OK` and evicts old keys. 2,000 more writes to the full store are rejected with `OOM` and no key is evicted, so the application gets an error instead of losing data |
    | 4 | defaults | Every instance matches its role |
    | 5 | unknown host | `UNREACHABLE` reported |

    ## Prerequisites

    - Redis instances reachable from the Docker containers the `RedisCLI` tasks start. `CONFIG` must be allowed for remediation.
    - Decide the role of each instance: `CACHE` if losing a key is acceptable, `STORE` if not.
    - Local testing:
      - `docker run -d --name redis-cache redis:7-alpine redis-server --maxmemory 4mb --maxmemory-policy noeviction`;
      - fill it with `SET` until writes fail.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: used by `alert` and the `errors` block. In Kestra OSS, provide it as the base64-encoded environment variable `SECRET_SLACK_WEBHOOK_URL`.

    ### Inputs

    | Input | Default | Purpose |
    |---|---|---|
    | `instances` | 2 example hosts | Host to role, `CACHE` or `STORE` |
    | `port` | `6379` | Port on every instance |
    | `cache_policy` | `allkeys-lru` | Policy applied to caches |
    | `cache_maxmemory` | `256mb` | Limit applied to caches with none |
    | `network` | empty | Docker network for the `redis-cli` containers |
    | `auto_remediate` | `false` | Allow `CONFIG SET` |
    | `dry_run` | `true` | Must be `false` for a change to apply |

    ## Quick start

    1. Add the `SLACK_WEBHOOK_URL` secret.
    2. Import the flow and list your instances with their role in `instances`.
    3. Run it once and read the findings.
    4. Run it with `auto_remediate: true` and `dry_run: false`, then persist the settings in `redis.conf` or with `CONFIG REWRITE`.
    5. Enable the `hourly` trigger, which always runs in safe mode.

    ## How to extend

    - Read the role from a label or tag in your inventory instead of a static map.
    - Alert when `evicted_keys` grows between two runs on a cache, a sign it is undersized.
    - Add password support with `password: "{{ secret('REDIS_PASSWORD') }}"` on each `RedisCLI` task.
    - Run `CONFIG REWRITE` after `verify_result` when your instances use a writable config file.

    ## Links

    - Redis key eviction: https://redis.io/docs/latest/develop/reference/eviction/
    - Redis plugin: https://kestra.io/plugins/plugin-redis
  tags:
    - Data
    - Infrastructure
  subTags:
    - Day 2 Operations
    - Monitoring & Alerting
  ee: false
  demo: false
