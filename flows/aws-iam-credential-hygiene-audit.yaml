id: aws-iam-credential-hygiene-audit
namespace: company.team
description: |
  Audit IAM credential hygiene from the AWS credential report: keys older than
  the rotation policy, credentials nobody has used, console passwords without
  MFA - one Slack advisory with every finding, weekly or on demand.

inputs:
  - id: aws_region
    type: STRING
    displayName: AWS region
    description: IAM is a global service - any valid region works for the API call.
    defaults: us-east-1

  - id: max_key_age_days
    type: INT
    displayName: Maximum key age (days)
    description: Access keys and passwords older than this are reported as overdue for rotation.
    defaults: 90

  - id: max_unused_days
    type: INT
    displayName: Maximum unused days (days)
    description: Active credentials unused for longer than this are reported, as is any never used.
    defaults: 45

  - id: require_mfa
    type: BOOL
    displayName: Require MFA
    description: Report console users without MFA active when true.
    defaults: true

tasks:
  - id: generate_report
    type: io.kestra.plugin.aws.cli.AwsCLI
    description: Build the account credential report - AWS generates it asynchronously, so this is a separate step.
    accessKeyId: "{{ secret('AWS_ACCESS_KEY_ID') }}"
    secretKeyId: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
    region: "{{ inputs.aws_region }}"
    commands:
      - aws iam generate-credential-report

  - id: fetch_report
    type: io.kestra.plugin.aws.cli.AwsCLI
    description: Pull the base64-encoded CSV of every user's credential state.
    accessKeyId: "{{ secret('AWS_ACCESS_KEY_ID') }}"
    secretKeyId: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
    region: "{{ inputs.aws_region }}"
    commands:
      - aws iam get-credential-report --query Content --output text

  - id: analyze_credentials
    type: io.kestra.plugin.scripts.python.Script
    description: Apply the rotation, usage, and MFA rules to every row of the credential report.
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    env:
      REPORT_B64: "{{ outputs.fetch_report.stdOut }}"
    script: |
      import base64
      import csv
      import io
      import json
      import os
      from datetime import date

      MAX_KEY_AGE = int({{ inputs.max_key_age_days }})
      MAX_UNUSED = int({{ inputs.max_unused_days }})
      REQUIRE_MFA = "{{ inputs.require_mfa }}" == "true"

      today = date.today()
      findings = []
      scanned = 0


      def parse_date(value):
          if not value or value in ("N/A", "no_information", "not_supported"):
              return None
          try:
              return date.fromisoformat(value[:10])
          except ValueError:
              return None


      def age_days(value):
          parsed = parse_date(value)
          return None if parsed is None else (today - parsed).days


      def add(user, kind, detail):
          findings.append({"user": user, "kind": kind, "detail": detail})


      raw = base64.b64decode(os.environ["REPORT_B64"].strip()).decode("utf-8")
      for row in csv.DictReader(io.StringIO(raw)):
          user = row.get("user", "")
          scanned += 1

          for slot in ("1", "2"):
              active = row.get("access_key_%s_active" % slot) == "true"
              if not active:
                  continue
              rotated = age_days(row.get("access_key_%s_last_rotated" % slot))
              if rotated is not None and rotated > MAX_KEY_AGE:
                  add(user, "stale_key", "access key %s is %d days old (policy %d)" % (slot, rotated, MAX_KEY_AGE))
              used = age_days(row.get("access_key_%s_last_used_date" % slot))
              if used is None:
                  add(user, "unused_key", "access key %s has never been used" % slot)
              elif used > MAX_UNUSED:
                  add(user, "unused_key", "access key %s unused for %d days (policy %d)" % (slot, used, MAX_UNUSED))

          password_on = row.get("password_enabled") == "true"
          if password_on:
              changed = age_days(row.get("password_last_changed"))
              if changed is not None and changed > MAX_KEY_AGE:
                  add(user, "stale_password", "console password unchanged for %d days (policy %d)" % (changed, MAX_KEY_AGE))
              if REQUIRE_MFA and row.get("mfa_active") != "true":
                  add(user, "missing_mfa", "console password enabled without MFA")

      print("Scanned %d user(s), %d finding(s)" % (scanned, len(findings)))
      print("::" + json.dumps({"outputs": {
          "finding_count": len(findings),
          "scanned_users": scanned,
          "findings": findings[:25],
      }}) + "::")

  - id: credential_gate
    type: io.kestra.plugin.core.flow.If
    description: Alert Slack with every finding, log a quiet all-clear when the account is clean.
    condition: "{{ outputs.analyze_credentials.vars.finding_count > 0 }}"
    then:
      - id: alert_slack
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        messageText: |
          :key: IAM credential audit found {{ outputs.analyze_credentials.vars.finding_count }} finding(s) across {{ outputs.analyze_credentials.vars.scanned_users }} user(s).
          {% for f in outputs.analyze_credentials.vars.findings %}- {{ f.user }}: {{ f.kind }} - {{ f.detail }}
          {% endfor %}
          Rotate or delete the flagged credentials in the IAM console.
    else:
      - id: log_clean
        type: io.kestra.plugin.core.log.Log
        message: "IAM credential audit clean: {{ outputs.analyze_credentials.vars.scanned_users }} user(s) scanned, 0 findings."

outputs:
  - id: finding_count
    type: INT
    value: "{{ outputs.analyze_credentials.vars.finding_count }}"
  - id: scanned_users
    type: INT
    value: "{{ outputs.analyze_credentials.vars.scanned_users }}"
  - id: findings
    type: JSON
    value: "{{ outputs.analyze_credentials.vars.findings | json }}"

errors:
  - id: alert_on_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    messageText: ":rotating_light: IAM credential audit {{ flow.id }} FAILED (execution {{ execution.id }}). The account was NOT checked - verify IAM read permissions (iam:GenerateCredentialReport, iam:GetCredentialReport) and the credentials. Error: {{ error.message }}"

triggers:
  - id: weekly
    type: io.kestra.plugin.core.trigger.Schedule
    description: Weekly hygiene audit on Monday morning. Enable when ready.
    cron: "0 7 * * 1"
    disabled: true

  - id: on_demand
    type: io.kestra.plugin.core.trigger.Webhook
    description: Audit after an offboarding or incident. Replace the key with your own value.
    key: replace-with-a-random-key

extend:
  title: AWS IAM Credential Hygiene Audit with Kestra
  shortDescription: Audit the AWS credential report for overdue key rotation, unused credentials, and console users without MFA, then alert Slack with every finding.
  metaTitle: AWS IAM Credential Rotation and MFA Audit Blueprint for Kestra
  metaDescription: Audit AWS IAM credentials in Kestra. Flag keys past rotation, never-used credentials, and missing MFA from the credential report, then alert Slack weekly.
  description: |
    Every security checklist says rotate access keys every 90 days. Almost no account does, because nothing fails when a key turns two years old, and the person who created it left the company in March. The AWS credential report already contains the evidence - key ages, last-used timestamps, MFA state - but it is a CSV you have to remember to download. This blueprint runs the report on a cadence and turns each hygiene violation into a named finding in the team channel.

    ## How it works

    1. `generate_report` (`io.kestra.plugin.aws.cli.AwsCLI`) calls `iam generate-credential-report` - AWS builds the report asynchronously, so it is a separate step from reading it.
    2. `fetch_report` (same plugin) pulls `iam get-credential-report --query Content --output text`, leaving the base64-encoded CSV in `stdOut`, with credentials from `{{ secret('AWS_ACCESS_KEY_ID') }}` / `{{ secret('AWS_SECRET_ACCESS_KEY') }}`.
    3. `analyze_credentials` (`io.kestra.plugin.scripts.python.Script` on the `Process` runner, stdlib only) decodes the CSV and applies four rules per user: active key older than `max_key_age_days` (`stale_key`), active key never used or idle past `max_unused_days` (`unused_key`), console password unchanged past the same age (`stale_password`), and password enabled without MFA when `require_mfa` is on (`missing_mfa`). Findings are capped at 25 for the alert, with the full count always reported.
    4. `credential_gate` (`io.kestra.plugin.core.flow.If`) posts the per-user findings to Slack; a clean account logs a one-line all-clear.
    5. The flow-level `errors` handler alerts Slack when the audit itself breaks - a missing IAM permission must never read as a clean account.

    ## What you get

    - Every overdue key, idle credential, and MFA gap as a named, actionable line.
    - Thresholds as inputs, so your rotation policy is the configuration, not a code edit.
    - `finding_count`, `scanned_users`, and the findings list as outputs for tracking hygiene over time.
    - A weekly cadence plus a webhook for the moment after an offboarding.

    ## Who it's for

    - Security and platform teams running CIS AWS Foundations-style benchmarks who want the credential section automated.
    - Companies with employee turnover where key ownership outlives employment.
    - Anyone who has seen `Access key ... active ... last used: N/A` in a quarterly review.

    ## Why orchestrate this with Kestra

    The credential report is a manual export: someone logs in, downloads, greps, and emails. Skip one quarter and the rotation policy is fiction. Kestra schedules the audit, retries transient API failures, alerts when the audit itself cannot run (the failure that matters most for a security control), keeps execution history as evidence for auditors, and exposes the findings as outputs the next workflow can act on - a Jira ticket task is three lines away.

    ## Prerequisites

    - IAM permissions `iam:GenerateCredentialReport` and `iam:GetCredentialReport` on the credentials running the flow.
    - A Kestra instance with outbound access to the AWS IAM API (global endpoint).

    ### Secrets

    - `AWS_ACCESS_KEY_ID`: AWS key with IAM credential report read access.
    - `AWS_SECRET_ACCESS_KEY`: matching AWS secret.
    - `SLACK_WEBHOOK_URL`: Slack incoming webhook URL for findings and failure alerts.

    ## Quick start

    1. Add the three secrets above to your Kestra instance.
    2. Adjust `max_key_age_days`, `max_unused_days`, and `require_mfa` to your policy.
    3. Run once manually and read the `analyze_credentials` outputs before enabling the schedule.
    4. Enable the `weekly` schedule, or wire the `on_demand` webhook into your offboarding runbook.

    ## How to extend

    - Open a GitHub issue from the same findings with `github.issues.Create`, so each violation lands in the backlog with an owner.
    - Split the `then` branch with a `Switch` on `f.kind` so missing MFA reaches a different channel than stale keys.
    - Load `findings` into a table to chart credential hygiene over quarters for audit evidence.
    - Add `cert_1_active` / `cert_2_active` checks for accounts still using signing certificates.

    ## Links

    - AWS CLI credential report: https://docs.aws.amazon.com/cli/latest/reference/iam/get-credential-report.html
    - Kestra AWS CLI plugin: https://kestra.io/plugins/plugin-aws
    - CIS AWS Foundations - credential management: https://www.cisecurity.org/benchmark/aws
    - This blueprint has been created by [RudraMalvankar](https://github.com/RudraMalvankar)
  tags:
    - Cloud
  subTags:
    - AWS Services
  ee: false
  demo: false
