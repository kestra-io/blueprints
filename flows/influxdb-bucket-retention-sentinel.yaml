id: influxdb-bucket-retention-sentinel
namespace: company.team
description: |
  Run Flux's buckets() function against an InfluxDB organization, flag any
  bucket with retentionPeriod == 0 (infinite retention - InfluxDB's own
  documented convention for "never expires"), alert Slack on breach, and
  conditionally bound that bucket's retention via the InfluxDB v2 REST
  API. auto_remediate and dry_run are two independent gates; no measurement
  data is ever deleted - only the retention window is shortened going
  forward.

triggers:
  - id: periodic_retention_check
    type: io.kestra.plugin.core.trigger.Schedule
    description: Check every 6 hours. Shipped disabled; enable it once influxdb_org points at a real organization and a manual run has been verified. Always fires in safe mode (auto_remediate false, dry_run true) regardless of this flow's own defaults.
    cron: "0 */6 * * *"
    disabled: true
    inputs:
      auto_remediate: "false"
      dry_run: "true"

inputs:
  - id: influxdb_org
    type: STRING
    displayName: "InfluxDB Organization"
    defaults: "my-org"
    description: Organization whose buckets are audited, matching this plugin's own documented org property (see influxdb-load-query-data.yaml).

  - id: max_infinite_retention_buckets
    type: INT
    displayName: "Max Allowed Infinite-Retention Buckets"
    defaults: 0
    description: Breach when the count of buckets with retentionPeriod == 0 exceeds this number. Default 0 means any infinite-retention bucket at all is a breach.

  - id: remediation_retention_days
    type: INT
    displayName: "Remediation Retention (days)"
    defaults: 90
    description: Bounded retention applied to a flagged bucket when remediation runs, converted to InfluxDB's everySeconds field.

  - id: auto_remediate
    type: SELECT
    displayName: "Auto Remediate"
    defaults: "false"
    values:
      - "false"
      - "true"
    description: If "true" and infinite-retention buckets are found, PATCH each one to remediation_retention_days via the InfluxDB v2 REST API (still gated by dry_run below). If "false", the risk is only reported.

  - id: dry_run
    type: SELECT
    displayName: "Dry Run"
    defaults: "true"
    values:
      - "true"
      - "false"
    description: If "true", remediation is only logged, no bucket is patched. Must be explicitly "false", together with auto_remediate "true", for the retention rule to actually change.

tasks:
  - id: audit_bucket_retention
    type: io.kestra.plugin.influxdb.FluxQuery
    description: Runs Flux's own buckets() function, which returns name, id, organizationID, retentionPolicy, and retentionPeriod (nanoseconds) for every bucket in influxdb_org - verified from Flux's documented stdlib. fetchType STORE is used because this plugin's own in-repo example (influxdb-load-query-data.yaml) documents the connection/org property pattern this task reuses.
    connection:
      url: "{{ secret('INFLUXDB_URL') }}"
      token: "{{ secret('INFLUXDB_TOKEN') }}"
    org: "{{ inputs.influxdb_org }}"
    query: "buckets()"
    fetchType: STORE

  - id: evaluate_retention_risk
    type: io.kestra.plugin.scripts.python.Script
    description: Reads the stored buckets() result and flags any bucket whose retentionPeriod is exactly 0 - InfluxDB's own documented value for infinite retention (confirmed from the InfluxDB v2 API's equivalent everySeconds field, "0 represents infinite retention"). The exact JSON shape this task's STORE output wraps the result in was not confirmed against a live instance, so the script handles both a bare row list and a dict-wrapped rows field defensively; see this blueprint's Pitfalls.
    inputFiles:
      buckets.json: "{{ outputs.audit_bucket_retention.uri }}"
    script: |
      import json
      from kestra import Kestra

      with open("buckets.json") as f:
          raw = json.load(f)

      rows = raw.get("rows", []) if isinstance(raw, dict) else raw

      infinite_buckets = [
          {"id": row.get("id"), "name": row.get("name")}
          for row in rows
          if row.get("retentionPeriod") == 0
      ]

      Kestra.outputs({
          "infinite_count": len(infinite_buckets),
          "infinite_buckets": infinite_buckets,
      })

  - id: evaluate_retention_gate
    type: io.kestra.plugin.core.flow.If
    description: Breach when at least one bucket has infinite retention.
    condition: "{{ outputs.evaluate_retention_risk.vars.infinite_count > inputs.max_infinite_retention_buckets }}"
    then:
      - id: route_remediation
        type: io.kestra.plugin.core.flow.Switch
        description: auto_remediate only decides whether remediation is considered at all; dry_run, checked separately below, decides whether the bucket is actually patched.
        value: "{{ inputs.auto_remediate }}"
        cases:
          "true":
            - id: check_dry_run
              type: io.kestra.plugin.core.flow.If
              condition: "{{ inputs.dry_run == \"false\" }}"
              then:
                - id: bound_bucket_retention
                  type: io.kestra.plugin.core.flow.Loop
                  description: Patch each flagged bucket's retention one at a time, so one failed request never blocks the rest of the batch. There is no structured bucket-management task in this plugin, so remediation calls InfluxDB's own documented REST API directly through the core Request task.
                  values: "{{ outputs.evaluate_retention_risk.vars.infinite_buckets }}"
                  concurrencyLimit: 4
                  tasks:
                    - id: patch_bucket_retention
                      type: io.kestra.plugin.core.http.Request
                      description: PATCH /api/v2/buckets/{bucketID}, InfluxDB's own documented endpoint for updating retention rules, authenticated with the Token scheme its own API reference specifies (not Bearer).
                      uri: "{{ secret('INFLUXDB_URL') }}/api/v2/buckets/{{ item.value | jq('.id') | first }}"
                      method: PATCH
                      contentType: application/json
                      headers:
                        Authorization: "Token {{ secret('INFLUXDB_TOKEN') }}"
                      body: |
                        {
                          "retentionRules": [
                            {
                              "type": "expire",
                              "everySeconds": {{ inputs.remediation_retention_days * 86400 }}
                            }
                          ]
                        }
                - id: log_remediation_applied
                  type: io.kestra.plugin.core.log.Log
                  message: "Bounded retention to {{ inputs.remediation_retention_days }} day(s) on {{ outputs.evaluate_retention_risk.vars.infinite_count }} bucket(s) in {{ inputs.influxdb_org }}."
              else:
                - id: log_dry_run_remediation
                  type: io.kestra.plugin.core.log.Log
                  message: "DRY RUN: would bound retention to {{ inputs.remediation_retention_days }} day(s) on {{ outputs.evaluate_retention_risk.vars.infinite_count }} bucket(s) in {{ inputs.influxdb_org }} (dry_run is true). No change made."
          "false":
            - id: log_remediation_disabled
              type: io.kestra.plugin.core.log.Log
              message: "auto_remediate is false: {{ outputs.evaluate_retention_risk.vars.infinite_count }} bucket(s) in {{ inputs.influxdb_org }} have infinite retention, but no patch was attempted."
      - id: alert_retention_risk
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Always alert on any breach, independent of whether it was remediated.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "InfluxDB bucket retention sentinel: {{ outputs.evaluate_retention_risk.vars.infinite_count }} bucket(s) in organization {{ inputs.influxdb_org }} have infinite retention (retentionPeriod == 0). auto_remediate: {{ inputs.auto_remediate }}. dry_run: {{ inputs.dry_run }}. Remediated: {{ inputs.auto_remediate == \"true\" and inputs.dry_run == \"false\" }}. Execution {{ execution.id }}."
          }
    else:
      - id: log_retention_healthy
        type: io.kestra.plugin.core.log.Log
        message: "{{ inputs.influxdb_org }} is healthy: 0 buckets have infinite retention."

  - id: log_audit_complete
    type: io.kestra.plugin.core.log.Log
    description: Final status line for every run, independent of which branch fired, so the execution history always shows the headline numbers.
    message: "Retention audit complete for {{ inputs.influxdb_org }}. infinite_count={{ outputs.evaluate_retention_risk.vars.infinite_count }}. threshold={{ inputs.max_infinite_retention_buckets }}. auto_remediate={{ inputs.auto_remediate }}. dry_run={{ inputs.dry_run }}."

errors:
  - id: alert_execution_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alert when the flow itself fails outside the handled branches, for example an unreachable InfluxDB instance or an invalid token.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "InfluxDB bucket retention sentinel FAILED in execution {{ execution.id }} for organization {{ inputs.influxdb_org }}. The retention audit did not complete; investigate before trusting the last known retention status."
      }

extend:
  title: "InfluxDB Bucket Retention Sentinel"
  shortDescription: Audit InfluxDB buckets for infinite retention via Flux's buckets() function, alert Slack on breach, and optionally bound retention through the InfluxDB REST API.
  metaTitle: InfluxDB Bucket Retention Sentinel with Kestra
  metaDescription: "Audit InfluxDB buckets for infinite retention with Flux buckets(), alert on breach, and optionally bound retention via the REST API."
  description: |
    InfluxDB documents retention period 0 as a deliberate, named setting: infinite
    retention, data kept forever. That is sometimes exactly what you want - and
    sometimes a bucket created for a quick test that nobody ever bounded, quietly
    accumulating data and cost indefinitely. Nothing in InfluxDB itself flags that for
    you. This blueprint runs Flux's own `buckets()` introspection function, finds every
    bucket with `retentionPeriod == 0`, alerts Slack on breach, and can bound that
    bucket's retention to a configured number of days through InfluxDB's own REST API -
    never deleting existing data, only shortening the window going forward.

    ## How it works

    1. `periodic_retention_check` (`io.kestra.plugin.core.trigger.Schedule`) runs every 6 hours, always forcing `auto_remediate: "false"` and `dry_run: "true"` through its own `inputs:` override regardless of this flow's defaults. Shipped disabled so you can validate a manual run first.
    2. `audit_bucket_retention` (`io.kestra.plugin.influxdb.FluxQuery`) runs `buckets()` with `fetchType: STORE`, returning a `uri` to the stored result - each row carrying `name`, `id`, `organizationID`, `retentionPolicy`, and `retentionPeriod` (nanoseconds).
    3. `evaluate_retention_risk` (`io.kestra.plugin.scripts.python.Script`) reads that stored result and collects every bucket whose `retentionPeriod` is exactly `0`, emitting `infinite_count` and `infinite_buckets` through `Kestra.outputs`.
    4. `evaluate_retention_gate` (`io.kestra.plugin.core.flow.If`) flags a breach whenever `infinite_count > max_infinite_retention_buckets`.
       - `then` (breach): `route_remediation` (`io.kestra.plugin.core.flow.Switch` on `auto_remediate`) either considers remediation (`"true"`, gated again by `dry_run` through `check_dry_run`) or only logs that remediation is disabled (`"false"`). When both gates allow it, `bound_bucket_retention` (`io.kestra.plugin.core.flow.Loop`) runs `patch_bucket_retention` (`io.kestra.plugin.core.http.Request`, `PATCH /api/v2/buckets/{id}`) for each flagged bucket, setting `retentionRules` to `remediation_retention_days`. `alert_retention_risk` always fires to Slack regardless of which path ran.
       - `else` (compliant): `log_retention_healthy` records a clean check.
    5. `log_audit_complete` always runs last, printing the headline numbers regardless of which branch fired.
    6. The `errors` block alerts Slack separately if the flow itself fails - an unreachable instance or an invalid token must not read as "no breach".

    ## What you get

    - A concrete, named list of infinite-retention buckets, computed from InfluxDB's own `buckets()` function, not inferred from dashboards or configuration files.
    - Remediation that only ever shortens the retention window going forward through InfluxDB's own documented API; no existing data point is deleted by this flow.
    - Two independent gates (`auto_remediate`, `dry_run`) between "breach detected" and "retention actually bounded".
    - A final status log every run, breach or not, so the execution history doubles as a retention-posture trend for the organization.

    ## Who it's for

    - Platform and observability teams running self-hosted InfluxDB who need to catch a bucket nobody ever bounded before storage cost or a compliance review catches it instead.
    - SREs standing up a new InfluxDB organization who want this as a pre-production gate.
    - Anyone evaluating the InfluxDB plugin who wants a worked example of `FluxQuery` against Flux's own introspection functions, beyond writing and reading measurement data.

    ## Why orchestrate this with Kestra

    `buckets()` is a live, read-only snapshot; running it by hand in the InfluxDB UI answers one moment in time and fixes nothing. Kestra supplies the schedule, the risk classification as a first-class branch, two independent authorization gates before anything is patched, and an execution history that shows exactly when a bucket was created with infinite retention and whether it was bounded.

    ## Prerequisites

    - A reachable InfluxDB v2 instance and a token with rights to query buckets and, if remediation runs, patch them.
    - A Slack incoming webhook for alerts.

    Local testing:
    `docker run -d --name influxdb-retention-sentinel -p 8087:8086 influxdb:2`
    `docker network connect YOUR_KESTRA_NETWORK influxdb-retention-sentinel` (only needed if the Kestra Worker runs in a separate Docker network than this container; set `INFLUXDB_URL` to `http://influxdb-retention-sentinel:8086` from inside that network, or `http://localhost:8087` from the host). Complete the container's first-run setup (org, bucket, token) via `influx setup` or the UI before running this flow; a freshly-created bucket with no retention flag set is exactly the infinite-retention case this blueprint audits.

    ### Secrets

    - `INFLUXDB_URL`: InfluxDB base URL, matching this plugin's own documented connection pattern (see `influxdb-load-query-data.yaml`).
    - `INFLUXDB_TOKEN`: InfluxDB API token used both by `FluxQuery` and, if remediation runs, the REST API patch - must have read access to buckets and, for remediation, write/admin access.
    - `SLACK_WEBHOOK_URL`: Slack incoming webhook used by `alert_retention_risk` and the `errors` block.
    - In Kestra OSS (no Enterprise secrets backend), secrets are supplied as environment variables prefixed `SECRET_`, base64-encoded, and read back in flows with `{{ secret('NAME') }}` - for example `SECRET_INFLUXDB_TOKEN=$(echo -n '<your-influxdb-token>' | base64)`. This keeps credentials out of the flow YAML but, per Kestra's own documentation, offers no encryption at rest or access control beyond the host environment; use the Enterprise secrets backend for stronger guarantees.

    ### Inputs

    - `influxdb_org` (STRING, default `my-org`): organization whose buckets are audited.
    - `max_infinite_retention_buckets` (INT, default `0`): breach threshold; `0` means any infinite-retention bucket at all breaches.
    - `remediation_retention_days` (INT, default `90`): bounded retention applied when remediation runs.
    - `auto_remediate` (SELECT: `"false"`, `"true"`; default `"false"`): must be `"true"` for the patch to even be considered.
    - `dry_run` (SELECT: `"true"`, `"false"`; default `"true"`): must be explicitly `"false"`, together with `auto_remediate: "true"`, for the bucket to actually be patched.

    ### Outputs

    - `outputs.audit_bucket_retention.uri`: the raw stored `buckets()` result for every run.
    - `outputs.evaluate_retention_risk.vars.infinite_count` / `.infinite_buckets`: the computed risk result for every run.

    ## Quick start

    1. Start InfluxDB locally with the command above and complete first-run setup, leaving the created bucket's retention unbounded (the default for a fresh bucket created without specifying one).
    2. Add the `INFLUXDB_URL`, `INFLUXDB_TOKEN`, and `SLACK_WEBHOOK_URL` secrets.
    3. Run the flow manually with the defaults (`auto_remediate: "false"`) and confirm `alert_retention_risk` fires naming the expected bucket, and that `log_remediation_disabled` logs without patching anything.
    4. Run once with `auto_remediate: "true"` and `dry_run: "true"` and confirm `log_dry_run_remediation` describes the patch without applying it.
    5. Run once with `auto_remediate: "true"` and `dry_run: "false"` and confirm via the InfluxDB UI or `GET /api/v2/buckets/{id}` that the bucket's `retentionRules` now shows `everySeconds` matching `remediation_retention_days * 86400`.
    6. Enable `periodic_retention_check` once you trust the check; it always runs in the safe `auto_remediate: "false"` / `dry_run: "true"` mode regardless of what you leave the flow's own defaults set to.

    ## How to extend

    - Loop over several `influxdb_org` values with `io.kestra.plugin.core.flow.Loop` (`ForEach` is deprecated) to sweep a multi-org instance in one run.
    - Extend `evaluate_retention_risk` to also flag buckets above a maximum retention ceiling, not just infinite ones, for organizations with an upper-bound compliance policy instead of (or in addition to) a lower bound.
    - Route the remediation branch through a `Pause` approval task instead of (or alongside) the static `auto_remediate` input, for a human-reviewed patch on production organizations.
    - Exclude InfluxDB's own system buckets (`_monitoring`, `_tasks`) from the audit by filtering on `name` in `evaluate_retention_risk`, if your organization's policy only targets user-created buckets.

    ## Pitfalls

    - **This plugin has no structured bucket-management task.** Verified task list: `FluxQuery`, `InfluxQLQuery`, `Load`, `Write` (plus a `FluxTrigger` trigger) - none expose bucket retention as a settable property. Remediation calls InfluxDB's own documented `PATCH /api/v2/buckets/{id}` REST endpoint directly through the core `io.kestra.plugin.core.http.Request` task instead.
    - **The API token header scheme is `Authorization: Token <token>`, not `Bearer`.** Verified from InfluxDB's own API authentication documentation; using `Bearer` here would authenticate against the wrong scheme and fail.
    - **The exact JSON shape of `FluxQuery`'s `STORE` output was not confirmed against a live instance.** `evaluate_retention_risk`'s script defensively handles both a bare row list and a `{"rows": [...]}`-wrapped shape, but this has not been exercised against a running InfluxDB server in this environment.
    - **`retentionPeriod == 0` is InfluxDB's own documented meaning for infinite retention**, confirmed from the InfluxDB v2 API reference's equivalent `everySeconds` field ("0 represents infinite retention") - this is not an assumption invented for this blueprint.
    - **`auto_remediate` and `dry_run` are independent gates, not a single boolean.** Both must be `"true"`/`"false"` respectively for the patch `Loop` to run; setting only one leaves the other still blocking.
    - **`Switch` case keys `"true"`/`"false"` are quoted strings.** `auto_remediate` renders as the literal string `"true"` or `"false"`; unquoted `true:`/`false:` YAML map keys would parse as booleans instead and would not match.

    ## Links

    - [plugin-influxdb documentation](https://kestra.io/plugins/plugin-influxdb)
    - [InfluxDB Flux buckets() function reference](https://docs.influxdata.com/flux/v0/stdlib/influxdata/influxdb/buckets/)
    - [InfluxDB v2 Buckets API reference](https://docs.influxdata.com/influxdb/v2/api/buckets/)
    - [Kestra secrets (OSS vs Enterprise)](https://kestra.io/docs/concepts/secret)
  tags:
    - Infrastructure
    - Data
  subTags:
    - Policy & Compliance
  ee: false
  demo: false
