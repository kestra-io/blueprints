    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
    - [EMQX Official Documentation and Architecture Guide](https://docs.emqx.com/en/enterprise/latest/)
    - [EMQX Prometheus Metrics and Observability Configuration](https://docs.emqx.com/en/enterprise/latest/observability/prometheus.html)
    - [Tuning EMQX Shared Subscriptions and Message Queues](https://docs.emqx.com/en/enterprise/latest/messaging/shared-subscription.html)
