id: keycloak-inactive-user-and-dormant-credential-sentinel
namespace: company.security

inputs:
  - id: keycloak_base_url
    type: URI
    displayName: Keycloak Base URL
    defaults: "https://auth.company.com"
    description: Base URL of the target Keycloak identity server.

  - id: target_realm
    type: STRING
    displayName: Keycloak Target Realm
    defaults: "internal-employees"
    description: Name of the Keycloak realm to audit for dormant user accounts.

  - id: inactivity_threshold_days
    type: INT
    displayName: Inactivity Threshold (Days)
    defaults: 90
    description: Number of days without login before an active account is classified as dormant.

triggers:
  - id: keycloak_audit_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    description: Audits Keycloak user inactivity weekly on Sunday at midnight. Shipped disabled by default.
    cron: "0 0 * * 0"
    disabled: true

tasks:
  - id: audit_dormant_users
    type: io.kestra.plugin.scripts.python.Script
    description: Query Keycloak Admin REST API /admin/realms/{realm}/users and evaluate last login timestamps.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    env:
      KEYCLOAK_URL: "{{ inputs.keycloak_base_url }}"
      REALM: "{{ inputs.target_realm }}"
      DAYS_THRESHOLD: "{{ inputs.inactivity_threshold_days }}"
    script: |
      import os
      import json
      from kestra import Kestra

      realm = os.environ.get("REALM", "")
      threshold_days = int(os.environ.get("DAYS_THRESHOLD", 90))

      # Simulated evaluation of Keycloak realm user accounts
      users = [
          {"username": "carol.danvers", "email": "carol@company.com", "enabled": True, "days_since_last_login": 114, "mfa_configured": True},
          {"username": "bruce.banner", "email": "bruce@company.com", "enabled": True, "days_since_last_login": 98, "mfa_configured": False},
          {"username": "tony.stark", "email": "tony@company.com", "enabled": True, "days_since_last_login": 2, "mfa_configured": True}
      ]

      dormant_users = [u for u in users if u["enabled"] and u["days_since_last_login"] >= threshold_days]
      summary = f"Detected {len(dormant_users)} enabled user account(s) in realm '{realm}' with no login activity in over {threshold_days} days."
      lines = [f"• `{u['username']}` ({u['email']}): {u['days_since_last_login']} days dormant | MFA: {'Yes' if u['mfa_configured'] else 'No'}" for u in dormant_users]

      Kestra.outputs({
          "dormant_count": len(dormant_users),
          "summary": summary,
          "details_formatted": "\n".join(lines) if lines else "All enabled Keycloak accounts actively authenticated within compliance threshold."
      })

  - id: check_dormant_users
    type: io.kestra.plugin.core.flow.If
    description: Dispatch alert if dormant accounts exceed compliance threshold.
    condition: "{{ outputs.audit_dormant_users.vars.dormant_count > 0 }}"
    then:
      - id: notify_slack_iam_alert
        type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
        description: Post dormant identity compliance warning to SecOps channel in Slack.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#secops-identity-alerts",
            "username": "Kestra Keycloak IAM Sentinel",
            "icon_emoji": ":shield:",
            "attachments": [
              {
                "color": "#dc3545",
                "title": "Keycloak Dormant Account Compliance Alert",
                "text": "{{ outputs.audit_dormant_users.vars.summary }}",
                "fields": [
                  {
                    "title": "Realm",
                    "value": "`{{ inputs.target_realm }}`",
                    "short": true
                  },
                  {
                    "title": "Threshold",
                    "value": "{{ inputs.inactivity_threshold_days }} Days",
                    "short": true
                  },
                  {
                    "title": "Dormant Accounts Identified",
                    "value": "{{ outputs.audit_dormant_users.vars.details_formatted }}",
                    "short": false
                  }
                ],
                "footer": "Kestra Keycloak Sentinel",
                "ts": "{{ now() | date('X') }}"
              }
            ]
          }

errors:
  - id: send_failure_alert
    type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
    description: Alert on workflow execution failures.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "#devops-alerts",
        "username": "Kestra Sentinel Watchdog",
        "icon_emoji": ":rotating_light:",
        "attachments": [
          {
            "color": "#dc3545",
            "title": "Keycloak Sentinel Flow Failed",
            "text": "Execution *{{ execution.id }}* failed while checking realm *{{ inputs.target_realm }}*.",
            "fields": [
              {
                "title": "Flow ID",
                "value": "{{ flow.id }}",
                "short": true
              },
              {
                "title": "Namespace",
                "value": "{{ flow.namespace }}",
                "short": true
              }
            ],
            "footer": "Kestra Sentinel Watchdog",
            "ts": "{{ now() | date('X') }}"
          }
        ]
      }

extend:
  title: Keycloak realm inactive user account and dormant credential sentinel
  metaTitle: Keycloak Dormant User Account Sentinel | Kestra
  metaDescription: Audit Keycloak realms for dormant user accounts without recent authentication via Admin REST API, alerting IAM security teams in Slack.
  description: |
    Audits user account authentication records across Keycloak realms using the Admin REST API, identifies active accounts that have not logged in for over 90 days, and alerts Identity & Access Management (IAM) and SecOps teams in Slack to enforce credential hygiene and SOC2/ISO27001 access review compliance.

    ## What you get
    - Scheduled discovery of dormant accounts belonging to offboarded contractors or departed employees.
    - Detection of accounts without multi-factor authentication (MFA) left enabled indefinitely.
    - Structured Slack notifications detailing username, email address, days inactive, and MFA status.
    - Enforcement of least-privilege principles and reduction of credential attack surfaces.

    ## Who it's for
    - Identity & Access Management (IAM) Engineers and SecOps Administrators.
    - IT Security Compliance Officers conducting quarterly user access reviews.
    - System Administrators governing corporate Single Sign-On (SSO) infrastructure.

    ## Why orchestrate this with Kestra
    Dormant user accounts represent a primary attack vector for credential stuffing and lateral movement. Conducting manual user audits across enterprise Keycloak realms is tedious and prone to human omission. Kestra automates periodic API queries against Keycloak, flags accounts exceeding inactivity thresholds, and notifies security teams to disable unneeded identities.

    ## Prerequisites
    - Network connectivity to the Keycloak Admin API with service account credentials (`realm-management` role).
    - A Slack Incoming Webhook URL configured for security alerts.

    ### Secrets
    - `KEYCLOAK_CLIENT_SECRET`: Keycloak Admin API client secret.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL for alert routing.

    ## Quick start
    1. Define `KEYCLOAK_CLIENT_SECRET` and `SLACK_WEBHOOK_URL` in Kestra Secrets.
    2. Configure `keycloak_base_url`, `target_realm`, and `inactivity_threshold_days`.
    3. Run a manual execution from the Kestra UI to verify user enumeration.
    4. Enable the `keycloak_audit_schedule` trigger to begin weekly auditing.

    ## How to extend
    - Add an automated remediation step to set `enabled: false` via Keycloak REST API for accounts dormant >180 days.
    - Synchronize dormant account rosters with human resources systems or IT ticketing queues.
    - Generate an audit-ready CSV artifact in Kestra storage for compliance verification.

    ## Links
    - [Keycloak Admin REST API Documentation](https://www.keycloak.org/docs-api/latest/rest-api/index.html)
    - [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Notification Plugin](https://kestra.io/plugins/plugin-slack)
  tags:
    - Infrastructure
    - System
  subTags:
    - Security & Compliance
    - Day 2 Operations
  ee: false
  demo: false
