    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
    - [Redis Official Documentation on Replication and Synchronization](https://redis.io/docs/latest/operate/oss_and_stack/management/replication/)
    - [Prometheus Redis Exporter Metric Reference and Configuration](https://github.com/oliver006/redis_exporter)
    - [Redis Replication Troubleshooting and PSYNC Architecture Guide](https://redis.io/docs/latest/operate/oss_and_stack/management/persistence/)
