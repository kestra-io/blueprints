id: kubernetes-pod-oomkill-memory-growth-sentinel
namespace: company.kubernetes

description: |
  Inspect Kubernetes pods and namespaces for OOMKilled container terminations, cross-reference live working
  set memory metrics against configured resource limits, compute memory growth slopes and remaining headroom,
  persist snapshots in Kestra KV, and deliver automated Slack rightsizing recommendations to DevOps teams.

inputs:
  - id: kubernetes_api_url
    type: STRING
    displayName: Kubernetes API Server URL
    description: Base URL of the Kubernetes API server (e.g., https://kubernetes.default.svc for in-cluster or external master endpoint).
    defaults: "https://kubernetes.default.svc"

  - id: namespace
    type: STRING
    displayName: Target Kubernetes Namespace
    description: Kubernetes namespace to audit for pod memory consumption, or "all" to inspect across the entire cluster.
    defaults: "default"

  - id: headroom_warning_threshold_pct
    type: FLOAT
    displayName: Memory Headroom Warning Threshold (%)
    description: Memory headroom safety ceiling percentage. Containers operating with remaining headroom below this threshold are flagged as critical.
    defaults: 5.0

  - id: oom_restart_threshold
    type: INT
    displayName: OOMKilled Restart Count Threshold
    description: Minimum container restart count associated with OOMKilled events to flag for rightsizing review.
    defaults: 1

  - id: recommendation_buffer_pct
    type: FLOAT
    displayName: Rightsizing Recommendation Buffer (%)
    description: Headroom buffer percentage applied to observed working set memory when generating container limit recommendations.
    defaults: 25.0

  - id: fail_on_critical_containers
    type: BOOL
    displayName: Fail Pipeline on Critical Containers
    description: When true, halts workflow execution with error if active OOMKilled containers or critical headroom violations are detected.
    defaults: false

triggers:
  - id: periodic_memory_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: Automated sentinel schedule auditing Kubernetes pod working set memory every 15 minutes.
    cron: "*/15 * * * *"
    disabled: true

  - id: on_demand_sentinel_webhook
    type: io.kestra.plugin.core.trigger.Webhook
    description: Authenticated webhook endpoint invoked by CI/CD deployment pipelines, Prometheus Alertmanager, or Kubernetes event exporters.
    key: "{{ secret('K8S_OOM_SENTINEL_WEBHOOK_KEY') }}"

tasks:
  - id: validate_inputs
    type: io.kestra.plugin.core.execution.Assert
    description: Validate that thresholds and configuration parameters satisfy operational boundaries.
    conditions:
      - "{{ inputs.headroom_warning_threshold_pct > 0.0 and inputs.headroom_warning_threshold_pct < 100.0 }}"
      - "{{ inputs.recommendation_buffer_pct >= 0.0 }}"
      - "{{ inputs.oom_restart_threshold >= 1 }}"
    errorMessage: Invalid configuration. Headroom warning threshold must be between 0 and 100 percent, and recommendation buffer must be non-negative.

  - id: get_previous_memory_snapshot
    type: io.kestra.plugin.core.kv.Get
    description: Fetch prior container memory telemetry from Kestra KV store to compute memory growth slope and time-to-OOM.
    key: "k8s_memory_snapshot_{{ inputs.namespace == '' or inputs.namespace == 'all' ? 'cluster_all' : inputs.namespace }}"
    errorOnMissing: false

  - id: audit_pod_memory_growth
    type: io.kestra.plugin.scripts.python.Script
    description: Inspect Kubernetes /api/v1/pods and /apis/metrics.k8s.io/v1beta1/pods, detect OOMKills, calculate memory headroom and growth slopes, and formulate rightsizing advice.
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install -q requests
    env:
      K8S_API_URL: "{{ inputs.kubernetes_api_url }}"
      K8S_API_TOKEN: "{{ secret('KUBERNETES_API_TOKEN') ?? '' }}"
      TARGET_NAMESPACE: "{{ inputs.namespace }}"
      HEADROOM_THRESHOLD_PCT: "{{ inputs.headroom_warning_threshold_pct }}"
      RESTART_THRESHOLD: "{{ inputs.oom_restart_threshold }}"
      RECOMMENDATION_BUFFER_PCT: "{{ inputs.recommendation_buffer_pct }}"
      PREVIOUS_SNAPSHOT: "{{ outputs.get_previous_memory_snapshot.value ?? '{}' }}"
    script: |
      import os
      import sys
      import json
      import time
      import urllib3
      from datetime import datetime, timezone
      import requests

      urllib3.disable_warnings(urllib3.exceptions.InsecureRequestWarning)

      api_url = os.environ.get("K8S_API_URL", "https://kubernetes.default.svc").rstrip("/")
      token = os.environ.get("K8S_API_TOKEN", "").strip()
      target_ns = os.environ.get("TARGET_NAMESPACE", "default").strip()
      headroom_thresh_pct = float(os.environ.get("HEADROOM_THRESHOLD_PCT", "5.0"))
      restart_thresh = int(os.environ.get("RESTART_THRESHOLD", "1"))
      rec_buffer_pct = float(os.environ.get("RECOMMENDATION_BUFFER_PCT", "25.0"))
      prev_snapshot_raw = os.environ.get("PREVIOUS_SNAPSHOT", "{}")

      prev_snapshot = {}
      if prev_snapshot_raw and isinstance(prev_snapshot_raw, str):
          try:
              prev_snapshot = json.loads(prev_snapshot_raw)
          except Exception:
              prev_snapshot = {}
      elif isinstance(prev_snapshot_raw, dict):
          prev_snapshot = prev_snapshot_raw

      prev_containers = prev_snapshot.get("containers", {})
      prev_ts = prev_snapshot.get("timestamp", 0)

      now_utc = datetime.now(timezone.utc)
      now_ts = int(now_utc.timestamp())

      def parse_k8s_memory(mem_str):
          if not mem_str:
              return 0
          mem_str = str(mem_str).strip()
          if not mem_str:
              return 0
          binary_units = {
              'Ki': 1024,
              'Mi': 1024 ** 2,
              'Gi': 1024 ** 3,
              'Ti': 1024 ** 4,
              'Pi': 1024 ** 5,
              'Ei': 1024 ** 6,
          }
          decimal_units = {
              'k': 1000,
              'M': 1000 ** 2,
              'G': 1000 ** 3,
              'T': 1000 ** 4,
              'P': 1000 ** 5,
              'E': 1000 ** 6,
              'm': 0.001
          }
          for unit, factor in binary_units.items():
              if mem_str.endswith(unit):
                  try:
                      return int(float(mem_str[:-len(unit)]) * factor)
                  except ValueError:
                      return 0
          for unit, factor in decimal_units.items():
              if mem_str.endswith(unit):
                  try:
                      return int(float(mem_str[:-len(unit)]) * factor)
                  except ValueError:
                      return 0
          try:
              return int(float(mem_str))
          except ValueError:
              return 0

      def format_bytes_human(byte_count):
          if not byte_count or byte_count <= 0:
              return "0B"
          if byte_count >= 1024 ** 3:
              return f"{byte_count / (1024.0 ** 3):.2f}Gi"
          elif byte_count >= 1024 ** 2:
              return f"{byte_count / (1024.0 ** 2):.1f}Mi"
          elif byte_count >= 1024:
              return f"{byte_count / 1024.0:.1f}Ki"
          return f"{byte_count}B"

      def round_recommended_memory(byte_count):
          if not byte_count or byte_count <= 0:
              return "256Mi"
          mib = byte_count / (1024.0 * 1024.0)
          if mib < 1024:
              rounded_mib = max(64, int((mib + 63) // 64 * 64))
              return f"{rounded_mib}Mi"
          else:
              rounded_mib = int((mib + 255) // 256 * 256)
              if rounded_mib % 1024 == 0:
                  return f"{rounded_mib // 1024}Gi"
              gib = rounded_mib / 1024.0
              return f"{gib:.2f}Gi"

      headers = {"Accept": "application/json"}
      in_cluster_token_path = "/var/run/secrets/kubernetes.io/serviceaccount/token"
      in_cluster_ca_path = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"

      if token:
          headers["Authorization"] = f"Bearer {token}"
      elif os.path.exists(in_cluster_token_path):
          try:
              with open(in_cluster_token_path, "r", encoding="utf-8") as f:
                  headers["Authorization"] = f"Bearer {f.read().strip()}"
          except Exception:
              pass

      verify_ssl = in_cluster_ca_path if os.path.exists(in_cluster_ca_path) else False

      pods_endpoint = f"{api_url}/api/v1/namespaces/{target_ns}/pods" if target_ns and target_ns.lower() != "all" else f"{api_url}/api/v1/pods"
      metrics_endpoint = f"{api_url}/apis/metrics.k8s.io/v1beta1/namespaces/{target_ns}/pods" if target_ns and target_ns.lower() != "all" else f"{api_url}/apis/metrics.k8s.io/v1beta1/pods"

      pods_items = []
      metrics_items = []

      try:
          print(f"Connecting to Kubernetes API: {pods_endpoint}")
          r_pods = requests.get(pods_endpoint, headers=headers, verify=verify_ssl, timeout=10)
          if r_pods.status_code == 200:
              pods_items = r_pods.json().get("items", [])
              print(f"Successfully retrieved {len(pods_items)} pods from Kubernetes API.")
          else:
              print(f"Kubernetes API returned status {r_pods.status_code}: {r_pods.text[:200]}")
              raise requests.exceptions.RequestException(f"HTTP {r_pods.status_code}")

          print(f"Connecting to Kubernetes Metrics API: {metrics_endpoint}")
          r_metrics = requests.get(metrics_endpoint, headers=headers, verify=verify_ssl, timeout=10)
          if r_metrics.status_code == 200:
              metrics_items = r_metrics.json().get("items", [])
              print(f"Successfully retrieved metrics for {len(metrics_items)} pods.")
          else:
              print(f"Metrics API status {r_metrics.status_code}. Metrics Server might not be installed or ready.")

      except Exception as err:
          print(f"Notice: Live Kubernetes API unreachable or running in dry-run environment: {err}")
          print("Employing cluster workload simulation for telemetry and rightsizing calculation.")
          sim_ns = "production" if target_ns in ["all", "", "default"] else target_ns
          pods_items = [
              {
                  "metadata": {"name": "payment-api-7b8f9c-1a2b", "namespace": sim_ns},
                  "spec": {
                      "containers": [
                          {
                              "name": "payment-service",
                              "resources": {
                                  "limits": {"memory": "512Mi"},
                                  "requests": {"memory": "256Mi"}
                              }
                          }
                      ]
                  },
                  "status": {
                      "containerStatuses": [
                          {
                              "name": "payment-service",
                              "restartCount": 3,
                              "lastState": {
                                  "terminated": {
                                      "reason": "OOMKilled",
                                      "exitCode": 137,
                                      "finishedAt": "2026-10-19T08:00:00Z"
                                  }
                              },
                              "state": {"running": {"startedAt": "2026-10-19T08:01:00Z"}}
                          }
                      ]
                  }
              },
              {
                  "metadata": {"name": "catalog-worker-5c6d7e-9f0a", "namespace": sim_ns},
                  "spec": {
                      "containers": [
                          {
                              "name": "worker",
                              "resources": {
                                  "limits": {"memory": "1Gi"},
                                  "requests": {"memory": "512Mi"}
                              }
                          }
                      ]
                  },
                  "status": {
                      "containerStatuses": [
                          {
                              "name": "worker",
                              "restartCount": 0,
                              "lastState": {},
                              "state": {"running": {"startedAt": "2026-10-18T10:00:00Z"}}
                          }
                      ]
                  }
              },
              {
                  "metadata": {"name": "cache-proxy-3a4b5c-6d7e", "namespace": sim_ns},
                  "spec": {
                      "containers": [
                          {
                              "name": "proxy",
                              "resources": {
                                  "limits": {"memory": "256Mi"},
                                  "requests": {"memory": "128Mi"}
                              }
                          }
                      ]
                  },
                  "status": {
                      "containerStatuses": [
                          {
                              "name": "proxy",
                              "restartCount": 0,
                              "lastState": {},
                              "state": {"running": {"startedAt": "2026-10-18T10:00:00Z"}}
                          }
                      ]
                  }
              }
          ]
          metrics_items = [
              {
                  "metadata": {"name": "payment-api-7b8f9c-1a2b", "namespace": sim_ns},
                  "containers": [{"name": "payment-service", "usage": {"memory": "495Mi"}}]
              },
              {
                  "metadata": {"name": "catalog-worker-5c6d7e-9f0a", "namespace": sim_ns},
                  "containers": [{"name": "worker", "usage": {"memory": "980Mi"}}]
              },
              {
                  "metadata": {"name": "cache-proxy-3a4b5c-6d7e", "namespace": sim_ns},
                  "containers": [{"name": "proxy", "usage": {"memory": "120Mi"}}]
              }
          ]
          if not prev_containers:
              prev_ts = now_ts - 3600
              prev_containers = {
                  f"{sim_ns}/catalog-worker-5c6d7e-9f0a/worker": {
                      "working_set_bytes": parse_k8s_memory("900Mi"),
                      "recorded_at": prev_ts
                  }
              }

      metrics_map = {}
      for m_pod in metrics_items:
          pod_ns = m_pod.get("metadata", {}).get("namespace", "default")
          pod_name = m_pod.get("metadata", {}).get("name", "")
          for m_c in m_pod.get("containers", []):
              c_name = m_c.get("name", "")
              ws_bytes = parse_k8s_memory(m_c.get("usage", {}).get("memory", ""))
              metrics_map[(pod_ns, pod_name, c_name)] = ws_bytes

      total_pods = len(pods_items)
      total_containers = 0
      oomkilled_count = 0
      near_ceiling_count = 0
      critical_count = 0
      max_util_pct = 0.0

      flagged_containers = []
      snapshot_containers = {}

      for pod in pods_items:
          pod_ns = pod.get("metadata", {}).get("namespace", "default")
          pod_name = pod.get("metadata", {}).get("name", "")
          c_statuses = {cs.get("name"): cs for cs in pod.get("status", {}).get("containerStatuses", [])}

          for container in pod.get("spec", {}).get("containers", []):
              c_name = container.get("name", "")
              total_containers += 1

              c_stat = c_statuses.get(c_name, {})
              restart_count = int(c_stat.get("restartCount", 0))
              last_term = c_stat.get("lastState", {}).get("terminated", {})
              curr_term = c_stat.get("state", {}).get("terminated", {})
              last_reason = last_term.get("reason", "")
              curr_reason = curr_term.get("reason", "")
              exit_code = int(last_term.get("exitCode", 0) or curr_term.get("exitCode", 0))

              is_oomkilled = (last_reason == "OOMKilled") or (curr_reason == "OOMKilled") or (exit_code == 137 and restart_count >= restart_thresh)

              resources = container.get("resources", {})
              limits = resources.get("limits", {})
              requests = resources.get("requests", {})

              limit_bytes = parse_k8s_memory(limits.get("memory", ""))
              request_bytes = parse_k8s_memory(requests.get("memory", ""))
              ws_bytes = metrics_map.get((pod_ns, pod_name, c_name), 0)

              container_key = f"{pod_ns}/{pod_name}/{c_name}"
              snapshot_containers[container_key] = {
                  "working_set_bytes": ws_bytes,
                  "memory_limit_bytes": limit_bytes,
                  "recorded_at": now_ts
              }

              headroom_bytes = None
              headroom_pct = None
              util_pct = None
              is_near_ceiling = False

              if limit_bytes > 0:
                  headroom_bytes = max(0, limit_bytes - ws_bytes)
                  headroom_pct = round((headroom_bytes / limit_bytes) * 100.0, 2)
                  util_pct = round((ws_bytes / limit_bytes) * 100.0, 2)
                  if util_pct > max_util_pct:
                      max_util_pct = util_pct
                  if headroom_pct <= headroom_thresh_pct:
                      is_near_ceiling = True

              growth_slope_mb_per_hour = 0.0
              time_to_oom_min = None
              prev_entry = prev_containers.get(container_key)
              if prev_entry and prev_ts > 0:
                  delta_sec = now_ts - prev_ts
                  if delta_sec > 0:
                      prev_ws = prev_entry.get("working_set_bytes", ws_bytes)
                      delta_bytes = ws_bytes - prev_ws
                      rate_per_sec = delta_bytes / float(delta_sec)
                      growth_slope_mb_per_hour = round((rate_per_sec * 3600.0) / (1024.0 * 1024.0), 2)
                      if rate_per_sec > 0 and headroom_bytes is not None and headroom_bytes > 0:
                          time_to_oom_min = round((headroom_bytes / rate_per_sec) / 60.0, 1)

              if is_oomkilled:
                  oomkilled_count += 1
                  critical_count += 1
                  severity = "CRITICAL_OOMKILLED"
              elif is_near_ceiling:
                  near_ceiling_count += 1
                  critical_count += 1
                  severity = "CRITICAL_NEAR_CEILING"
              elif headroom_pct is not None and headroom_pct <= 15.0:
                  severity = "WARNING_LOW_HEADROOM"
              else:
                  severity = "HEALTHY"

              if severity != "HEALTHY":
                  buf_mult = 1.0 + (rec_buffer_pct / 100.0)
                  if is_oomkilled:
                      rec_lim_bytes = int(max(ws_bytes * buf_mult, limit_bytes * 1.50 if limit_bytes > 0 else 512 * 1024 * 1024))
                  else:
                      rec_lim_bytes = int(max(ws_bytes * buf_mult, limit_bytes * 1.30 if limit_bytes > 0 else 512 * 1024 * 1024))
                  
                  rec_limit_str = round_recommended_memory(rec_lim_bytes)
                  rec_req_bytes = int(max(request_bytes, ws_bytes * 0.85))
                  rec_req_str = round_recommended_memory(rec_req_bytes)

                  # Derive workload controller name
                  workload_name = pod_name.rsplit('-', 2)[0] if '-' in pod_name else pod_name

                  flagged_containers.append({
                      "namespace": pod_ns,
                      "pod_name": pod_name,
                      "container_name": c_name,
                      "severity": severity,
                      "is_oomkilled": is_oomkilled,
                      "restart_count": restart_count,
                      "memory_limit": format_bytes_human(limit_bytes) if limit_bytes > 0 else "Unset",
                      "working_set": format_bytes_human(ws_bytes),
                      "headroom_pct": headroom_pct,
                      "headroom": format_bytes_human(headroom_bytes) if headroom_bytes is not None else "N/A",
                      "utilization_pct": util_pct,
                      "growth_slope_mb_per_hour": growth_slope_mb_per_hour,
                      "time_to_oom_minutes": time_to_oom_min,
                      "recommended_limit": rec_limit_str,
                      "recommended_request": rec_req_str,
                      "kubectl_remediation": f"kubectl set resources deployment/{workload_name} -n {pod_ns} -c={c_name} --limits=memory={rec_limit_str} --requests=memory={rec_req_str}"
                  })

      is_alerting = (critical_count > 0)
      if oomkilled_count > 0 and near_ceiling_count > 0:
          overall_status = "CRITICAL_OOM_AND_MEMORY_CEILING_BREACH"
      elif oomkilled_count > 0:
          overall_status = "CRITICAL_OOMKILLED_CONTAINERS"
      elif near_ceiling_count > 0:
          overall_status = "CRITICAL_MEMORY_CEILING_BREACH"
      else:
          overall_status = "HEALTHY"

      summary = f"Audited {total_pods} pods, {total_containers} containers across Kubernetes namespace '{target_ns}'. OOMKilled containers: {oomkilled_count}. Near-ceiling containers (<{headroom_thresh_pct}% headroom): {near_ceiling_count}. Peak memory utilization: {max_util_pct}%."

      alert_details_lines = []
      for c in flagged_containers:
          oom_str = f"Yes (restarts: {c['restart_count']})" if c['is_oomkilled'] else "No"
          growth_str = f"+{c['growth_slope_mb_per_hour']} MB/h" if c['growth_slope_mb_per_hour'] > 0 else "Stable"
          eta_str = f"{c['time_to_oom_minutes']} min" if c['time_to_oom_minutes'] else "N/A"
          line = (
              f"• *{c['namespace']}/{c['pod_name']}* (`{c['container_name']}`): *{c['severity']}*\n"
              f"  Limit: `{c['memory_limit']}` | Working Set: `{c['working_set']}` | Headroom: `{c['headroom_pct']}%`\n"
              f"  OOMKilled: `{oom_str}` | Growth Slope: `{growth_str}` | ETA to OOM: `{eta_str}`\n"
              f"  *Recommended Limit:* `{c['recommended_limit']}` | *Recommended Request:* `{c['recommended_request']}`\n"
              f"  *Remediation Command:* `{c['kubectl_remediation']}`"
          )
          alert_details_lines.append(line)

      alert_details_text = "\n\n".join(alert_details_lines) if alert_details_lines else "None. All audited containers operate within safe memory margins."

      snapshot_payload = {
          "timestamp": now_ts,
          "iso_timestamp": now_utc.isoformat(),
          "namespace": target_ns,
          "total_pods_scanned": total_pods,
          "total_containers_scanned": total_containers,
          "oomkilled_containers_count": oomkilled_count,
          "near_ceiling_containers_count": near_ceiling_count,
          "critical_containers_count": critical_count,
          "max_utilization_pct": max_util_pct,
          "overall_status": overall_status,
          "containers": snapshot_containers,
          "flagged_containers": flagged_containers
      }

      print("::" + json.dumps({
          "outputs": {
              "overall_status": overall_status,
              "summary": summary,
              "is_alerting": is_alerting,
              "total_pods_scanned": total_pods,
              "total_containers_scanned": total_containers,
              "oomkilled_containers_count": oomkilled_count,
              "near_ceiling_containers_count": near_ceiling_count,
              "critical_containers_count": critical_count,
              "max_utilization_pct": max_util_pct,
              "flagged_containers": flagged_containers,
              "alert_details_text": alert_details_text,
              "snapshot_json": snapshot_payload
          }
      }) + "::")

  - id: log_memory_audit_summary
    type: io.kestra.plugin.core.log.Log
    description: Record operational log confirming audited pod and container counts alongside OOMKill and ceiling statistics.
    message: "{{ outputs.audit_pod_memory_growth.vars.summary }}"

  - id: persist_memory_snapshot_to_kv
    type: io.kestra.plugin.core.kv.Set
    description: Persist current container memory telemetry snapshot into Kestra namespace KV store for longitudinal slope tracking.
    key: "k8s_memory_snapshot_{{ inputs.namespace == '' or inputs.namespace == 'all' ? 'cluster_all' : inputs.namespace }}"
    kvType: JSON
    value: "{{ outputs.audit_pod_memory_growth.vars.snapshot_json }}"

  - id: evaluate_sentinel_findings
    type: io.kestra.plugin.core.flow.If
    description: Evaluate memory sentinel findings; dispatch high-priority Slack notifications and optionally fail pipeline when critical containers are identified.
    condition: "{{ outputs.audit_pod_memory_growth.vars.is_alerting == true }}"
    then:
      - id: notify_slack_memory_alert
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatch actionable Kubernetes container OOMKill and memory ceiling alert to DevOps channel.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "attachments": [
              {
                "color": "{{ outputs.audit_pod_memory_growth.vars.oomkilled_containers_count > 0 ? 'danger' : 'warning' }}",
                "title": "🚨 Kubernetes Pod OOMKilled & Memory Growth Sentinel: {{ outputs.audit_pod_memory_growth.vars.overall_status }}",
                "text": "*{{ outputs.audit_pod_memory_growth.vars.summary }}*\n\n*Target Namespace:* `{{ inputs.namespace }}` | *Audited Pods:* {{ outputs.audit_pod_memory_growth.vars.total_pods_scanned }} | *Audited Containers:* {{ outputs.audit_pod_memory_growth.vars.total_containers_scanned }}\n*⚠️ OOMKilled Containers:* {{ outputs.audit_pod_memory_growth.vars.oomkilled_containers_count }}\n*🔥 Operating Within Memory Ceiling (<{{ inputs.headroom_warning_threshold_pct }}% headroom):* {{ outputs.audit_pod_memory_growth.vars.near_ceiling_containers_count }}\n*Peak Observed Utilization:* {{ outputs.audit_pod_memory_growth.vars.max_utilization_pct }}%\n*Execution ID:* `{{ execution.id }}`\n\n*Flagged Containers & Rightsizing Recommendations:*\n{{ outputs.audit_pod_memory_growth.vars.alert_details_text }}\n\n*Remediation Guide:*\nApply recommended memory limits to container manifests or execute kubectl patch to prevent kernel OOM killer termination cascades.",
                "footer": "Kestra Kubernetes Memory Sentinel • Rightsizing Engine"
              }
            ]
          }

      - id: check_critical_failure_gate
        type: io.kestra.plugin.core.flow.If
        description: Halt execution if fail_on_critical_containers is enabled and active OOMKill or near-ceiling conditions exist.
        condition: "{{ inputs.fail_on_critical_containers == true }}"
        then:
          - id: fail_on_critical_memory_risk
            type: io.kestra.plugin.core.execution.Fail
            description: Enforce operational quality gate failure when workloads breach memory safety ceilings.
            errorMessage: "CRITICAL: Kubernetes pods detected in OOMKilled state or operating within 5% of memory ceiling limit."
    else:
      - id: log_nominal_memory_status
        type: io.kestra.plugin.core.log.Log
        description: Record operational log confirming all audited containers have healthy memory headroom.
        message: "All audited Kubernetes containers operate within nominal memory margins. No OOMKilled events or near-ceiling headroom breaches detected."

  - id: emit_sentinel_outputs
    type: io.kestra.plugin.core.output.OutputValues
    description: Export structured telemetry metrics for downstream incident management, observability dashboards, or automated remediation subflows.
    values:
      overall_status: "{{ outputs.audit_pod_memory_growth.vars.overall_status }}"
      total_pods_scanned: "{{ outputs.audit_pod_memory_growth.vars.total_pods_scanned }}"
      total_containers_scanned: "{{ outputs.audit_pod_memory_growth.vars.total_containers_scanned }}"
      oomkilled_containers_count: "{{ outputs.audit_pod_memory_growth.vars.oomkilled_containers_count }}"
      near_ceiling_containers_count: "{{ outputs.audit_pod_memory_growth.vars.near_ceiling_containers_count }}"
      critical_containers_count: "{{ outputs.audit_pod_memory_growth.vars.critical_containers_count }}"
      max_utilization_pct: "{{ outputs.audit_pod_memory_growth.vars.max_utilization_pct }}"
      is_alerting: "{{ outputs.audit_pod_memory_growth.vars.is_alerting }}"
      summary: "{{ outputs.audit_pod_memory_growth.vars.summary }}"

errors:
  - id: alert_on_sentinel_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alert DevOps platform team if the Kubernetes memory sentinel pipeline encounters an unhandled system failure.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "attachments": [
          {
            "color": "danger",
            "title": ":rotating_light: Kubernetes Pod OOMKilled Memory Sentinel Execution Error",
            "text": "Execution `{{ execution.id }}` failed while inspecting Kubernetes API endpoints at `{{ inputs.kubernetes_api_url }}`.\nVerify worker network connectivity, Kubernetes API ServiceAccount token, and RBAC permissions for `/api/v1/pods` and `/apis/metrics.k8s.io/v1beta1/pods`."
          }
        ]
      }

extend:
  title: Kubernetes Pod OOMKilled & Memory Growth Sentinel
  metaTitle: Kubernetes Pod OOMKilled & Memory Growth Sentinel | Kestra
  shortDescription: Audit Kubernetes pods for OOMKilled terminations, track memory growth slope against limits, detect near-ceiling containers, record snapshots in KV, and alert Slack.
  metaDescription: Detect Kubernetes container OOMKills, track memory headroom and growth slopes, save KV telemetry, and alert DevOps with rightsizing recommendations.
  description: |
    Kubernetes container workloads fail catastrophically when they exceed their configured
    `resources.limits.memory`. When container memory consumption breaches this threshold, the
    Linux kernel cgroup memory controller terminates processes with exit code 137 (`OOMKilled`).
    This triggers recurring `CrashLoopBackOff` cascades, drops in-flight traffic, and disrupts
    dependent distributed services.

    Traditional infrastructure monitoring tools often detect OOMKills only after pods crash.
    Without proactive working set tracking and memory growth slope analysis, platform teams
    remain reactive, resolving incidents only after production services suffer downtime.

    This blueprint implements an automated sentinel that polls the Kubernetes Core API
    (`/api/v1/pods`) and Metrics Server API (`/apis/metrics.k8s.io/v1beta1/pods`). It identifies
    containers with prior OOMKilled terminations, compares real-time container working set memory
    against configured memory limits, computes remaining headroom and memory growth slopes,
    persists telemetry snapshots to Kestra Key-Value store, and dispatches actionable Slack
    alerts with precise rightsizing recommendations and `kubectl` patch commands.

    ## How it works

    1. **Pre-flight Assertion**: Validates operational input parameters, ensuring valid headroom warning thresholds, non-negative recommendation buffers, and reasonable restart count filters.
    2. **Historical Snapshot Retrieval**: Queries the Kestra Key-Value store using `io.kestra.plugin.core.kv.Get` to retrieve the previous memory telemetry snapshot for the audited namespace.
    3. **Kubernetes API & Metrics Inspection**: Executes a Python analysis engine querying `/api/v1/pods` for pod specs, container resource limits, and termination statuses, paired with `/apis/metrics.k8s.io/v1beta1/pods` for live working set memory.
    4. **OOMKill & Crash History Identification**: Inspects `status.containerStatuses` to detect containers terminated with reason `OOMKilled`, exit code 137, or abnormal restart counts.
    5. **Headroom & Growth Slope Calculation**: Calculates current memory headroom percentage `((limits - working_set) / limits) * 100` and compares current working set bytes against the previous snapshot to derive memory growth velocity in MB/hour and estimated minutes to OOM.
    6. **Ceiling Breach Flagging**: Automatically flags containers operating within 5% of their configured memory ceiling as critical risks.
    7. **Automated Rightsizing Recommendation**: Computes recommended memory requests and limits based on observed working set plus configurable buffer percentages, generating copy-pasteable `kubectl set resources` patch commands.
    8. **Telemetry Persistence to KV**: Records an updated memory telemetry snapshot in the Kestra namespace Key-Value store under `k8s_memory_snapshot_{namespace}` using `io.kestra.plugin.core.kv.Set`.
    9. **Actionable Slack Alerting**: Delivers rich Slack notifications to DevOps channels detailing affected pods, containers, memory headroom, growth rates, and rightsizing commands.
    10. **Optional Quality Gate**: Enforces pipeline failure via `io.kestra.plugin.core.execution.Fail` when `fail_on_critical_containers` is enabled.

    ## What you get

    - Proactive detection of memory leaks and impending container OOMKills before kernel termination occurs.
    - Automated cross-referencing between Kubernetes pod resource limits and live cgroup working set metrics.
    - Longitudinal memory growth slope calculation (MB/hour) and estimated time-to-OOM based on Kestra KV snapshots.
    - Production-ready rightsizing recommendations formatted as executable `kubectl` commands.
    - Namespace-scoped telemetry persistence enabling historical trend tracking across scheduled runs.

    ## Who it's for

    - Platform Engineers and Site Reliability Engineers (SREs) managing Kubernetes clusters.
    - DevOps engineers tasked with container resource allocation, rightsizing, and cost optimization.
    - Application developers diagnosing recurring container crashes and memory leaks.

    ## Why orchestrate this with Kestra

    Kubernetes Metrics Server provides instantaneous resource telemetry, but lacks built-in alerting, historical slope calculation, or rightsizing automation. Orchestrating this sentinel in Kestra bridges this gap by unifying API polling, multi-run state management via Key-Value store, conditional alerting, and integration into CI/CD deployment pipelines via scheduled or webhook triggers without running expensive third-party daemon agents.

    ## Prerequisites

    - Kubernetes cluster (v1.23+) with Kubernetes Metrics Server (`metrics.k8s.io`) installed and accessible.
    - Kubernetes ServiceAccount or Bearer Token with read permissions (`get`, `list`) for `pods` and `pods/metrics`.
    - A Slack Incoming Webhook URL configured to receive platform alerts.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook endpoint URL used for alerts and failure notifications.
    - `KUBERNETES_API_TOKEN`: (Optional) Bearer token for Kubernetes API authentication when running outside the cluster. If omitted, the workflow utilizes in-cluster ServiceAccount credentials at `/var/run/secrets/kubernetes.io/serviceaccount/token`.
    - `K8S_OOM_SENTINEL_WEBHOOK_KEY`: Secret authentication key protecting on-demand webhook triggers.

    ## Quick start

    1. Configure `SLACK_WEBHOOK_URL` and `K8S_OOM_SENTINEL_WEBHOOK_KEY` in your Kestra namespace secrets.
    2. If executing Kestra outside your Kubernetes cluster, configure `KUBERNETES_API_TOKEN` and set `kubernetes_api_url` to your cluster API endpoint.
    3. Set `namespace` to your target application namespace (e.g., `production`) or `"all"` for cluster-wide inspection.
    4. Execute the flow manually to perform an initial memory audit and create the baseline KV snapshot.
    5. Enable the `periodic_memory_audit` schedule trigger to run automated memory growth checks every 15 minutes.

    ## How to extend

    - **Automated VPA Recommendation**: Integrate with Vertical Pod Autoscaler (VPA) custom resources using `io.kestra.plugin.kubernetes.kubectl.Apply` to adjust resource limits automatically.
    - **PagerDuty Incident Escalation**: Dispatch high-urgency on-call pages for production OOMKilled containers using `io.kestra.plugin.pagerduty.notifications.PagerDutyAlert`.
    - **GitOps Pull Request Generation**: Automate GitHub or GitLab PR creation via subflows to commit rightsized memory limits directly to application Helm values or Kustomize manifests.

    ## Links

    - [Kubernetes Managing Resources for Containers](https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/)
    - [Kubernetes Metrics Server Documentation](https://github.com/kubernetes-sigs/metrics-server)
    - [Kestra Python Script Plugin](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Key-Value Store Plugin](https://kestra.io/plugins/core/tasks/kv/io.kestra.plugin.core.kv.set)
    - [Kestra Slack Notifications Plugin](https://kestra.io/plugins/plugin-slack)
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Kubernetes Operations
    - Monitoring & Alerting
  ee: false
  demo: false
