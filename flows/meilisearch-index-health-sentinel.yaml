id: meilisearch-index-health-sentinel
namespace: company.team

description: |
  Monitor Meilisearch search index health, execute document search probing, evaluate query throughput hits, and send automated alerts on search degradation.

inputs:
  - id: meilisearch_url
    type: STRING
    defaults: "http://meilisearch:7700"
    displayName: "Meilisearch Instance URL"
    description: "HTTP endpoint URL of the target Meilisearch instance."

  - id: index_name
    type: STRING
    defaults: "products"
    displayName: "Target Index Name"
    description: "Target Meilisearch index name to monitor and probe."

  - id: search_query
    type: STRING
    defaults: "laptop"
    displayName: "Search Probe Query"
    description: "Query string used to probe search availability and hit counts."

  - id: min_document_count
    type: SELECT
    defaults: "500"
    displayName: "Minimum Document Count Threshold"
    values:
      - "100"
      - "500"
      - "1000"
      - "5000"
    description: "Minimum expected document count in the index before flagging low-volume state."

  - id: alert_on_zero_hits
    type: SELECT
    defaults: "true"
    displayName: "Alert On Zero Hits Toggle"
    values:
      - "true"
      - "false"
    description: "Whether to trigger a Slack alert if the probe search returns zero hits."

triggers:
  - id: scheduled_check
    type: io.kestra.plugin.core.trigger.Schedule
    description: "Periodically audit Meilisearch index availability and search performance."
    cron: "0 */6 * * *"
    disabled: true
    inputs:
      meilisearch_url: "http://meilisearch:7700"
      index_name: "products"
      search_query: "laptop"
      min_document_count: "500"
      alert_on_zero_hits: "true"

tasks:
  - id: fetch_index_stats
    type: io.kestra.plugin.core.http.Request
    description: "Fetch real-time index metrics and status from Meilisearch API."
    uri: "{{ inputs.meilisearch_url }}/indexes/{{ inputs.index_name }}/stats"
    headers:
      Authorization: "Bearer {{ secret('MEILISEARCH_MASTER_KEY') }}"
    allowFailure: true

  - id: probe_search
    type: io.kestra.plugin.meilisearch.Search
    description: "Probe search execution against the target Meilisearch index."
    url: "{{ inputs.meilisearch_url }}"
    key: "{{ secret('MEILISEARCH_MASTER_KEY') }}"
    index: "{{ inputs.index_name }}"
    query: "{{ inputs.search_query }}"

  - id: evaluate_health
    type: io.kestra.plugin.core.flow.Switch
    description: "Evaluate probe hits against threshold rules to determine cluster health."
    value: "{{ (outputs.probe_search.totalHits | default(0) == 0 and inputs.alert_on_zero_hits == 'true') ? 'ALERT' : 'HEALTHY' }}"
    cases:
      "HEALTHY":
        - id: log_healthy
          type: io.kestra.plugin.core.log.Log
          message: "Meilisearch index '{{ inputs.index_name }}' is healthy. Probe search returned {{ outputs.probe_search.totalHits }} total hits."
      "ALERT":
        - id: send_alert
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK') }}"
          payload: |
            {
              "text": "ALERT: Meilisearch index search probe returned 0 hits for index '{{ inputs.index_name }}' with query '{{ inputs.search_query }}'."
            }

  - id: audit_summary
    type: io.kestra.plugin.core.log.Log
    description: "Emit final audit status summary for the Meilisearch monitoring run."
    message: "Completed Day 2 Meilisearch index health sentinel check for index '{{ inputs.index_name }}'. Probe search hits: {{ outputs.probe_search.totalHits }}."

errors:
  - id: notify_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "text": "CRITICAL: Meilisearch index health sentinel flow execution failed for index '{{ inputs.index_name }}'."
      }

extend:
  title: Meilisearch Index Health Sentinel and Search Audit
  shortDescription: Periodically audit Meilisearch index stats, probe search query availability, evaluate hit thresholds, and dispatch Slack alerts.
  metaTitle: "Meilisearch Index Health Sentinel and Search Latency Audit"
  metaDescription: "Automate Meilisearch index stats monitoring and search query probing with Slack alerting for Day 2 operations."
  description: |
    Automate Meilisearch index health auditing, search query probing, and threshold evaluation with automated Slack notifications.

    ## How it works

    - **Index Stats Retrieval**: Queries the Meilisearch REST API to fetch real-time index metrics including document counts and indexing status.
    - **Search Probing**: Executes a test search query against the target Meilisearch index using the official Meilisearch plugin task.
    - **Health Evaluation**: Evaluates total hit counts against predefined threshold inputs using flow switch logic.
    - **Alert Routing**: Dispatches structured Slack alerts when zero hits are detected or execution errors occur.
    - **Audit Log Emission**: Produces structured log outputs summarizing index health and query response metrics.

    ## What you get

    - Automated Day 2 observability for Meilisearch search indexes without third-party monitoring agents.
    - Configurable search query probing with automated Slack alerts on zero-hit or degraded search responses.
    - Centralized flow-level error catching to notify operations teams immediately upon engine or connection failure.

    ## Who it's for

    - Search Engineers managing Meilisearch production workloads.
    - DevOps and Reliability Engineers monitoring search cluster availability and API health.

    ## Why orchestrate this with Kestra

    - Direct integration with native Meilisearch tasks avoiding shell script boilerplate.
    - Declarative trigger schedules for continuous background index auditing.
    - Built-in failure handling and notification integration for instant incident dispatch.

    ## Prerequisites

    - A running Meilisearch server reachable by Kestra network host or container.
    - A valid Meilisearch API master key or search-enabled API key stored as a Kestra secret.
    - A Slack Incoming Webhook URL stored as a secret for alerting.

    ## Quick start

    1. Deploy a local Meilisearch container:
       ```bash
       docker run -d --name meilisearch -p 7700:7700 -e MEILI_MASTER_KEY=masterKey123 getmeili/meilisearch:v1.6
       ```
    2. Connect the Meilisearch container to your Kestra Docker network:
       ```bash
       docker network connect YOUR_KESTRA_NETWORK meilisearch
       ```
       Note: Run `docker network ls` to identify your active Kestra network name.
    3. Configure Kestra secrets:
       - Set `MEILISEARCH_MASTER_KEY` to `masterKey123`.
       - Set `SLACK_WEBHOOK` to your Slack webhook URL.
       Note for OSS Kestra setups: Store secrets as base64-encoded environment variables formatted as `SECRET_MEILISEARCH_MASTER_KEY` and `SECRET_SLACK_WEBHOOK`.
    4. Execute the flow manually or enable the schedule trigger.

    ## How to extend

    - **Index Auto-Compaction**: Add a task to trigger index task pruning or snapshot creation when document counts exceed max limits.
    - **Multi-Index Loop**: Wrap the probe task in a loop to monitor multiple search indexes in a single run.
    - **PagerDuty Integration**: Swap or append PagerDuty notification tasks for high-priority outage alerting.

    ## Secrets

    - `MEILISEARCH_MASTER_KEY`: API key with read/search access to Meilisearch indexes.
    - `SLACK_WEBHOOK`: Webhook URL for Slack channel alert delivery.

    ## Inputs

    | Parameter | Type | Default | Allowed Values | Description |
    | --- | --- | --- | --- | --- |
    | `meilisearch_url` | STRING | `http://meilisearch:7700` | Any valid URL | HTTP endpoint URL of target Meilisearch instance. |
    | `index_name` | STRING | `products` | Any valid index name | Target index name to monitor and probe. |
    | `search_query` | STRING | `laptop` | Any query string | Query string used to probe search availability. |
    | `min_document_count` | SELECT | `500` | `100`, `500`, `1000`, `5000` | Minimum expected document count. |
    | `alert_on_zero_hits` | SELECT | `true` | `true`, `false` | Whether to trigger alert on zero search hits. |

    ## Outputs

    - `{{ outputs.probe_search.totalHits }}`: Total hits returned by the search probe task.
    - `{{ outputs.probe_search.uri }}`: Kestra storage URI containing search result payload in Ion format.
    - `{{ outputs.fetch_index_stats.body }}`: Raw JSON response body containing index statistics.

    ## Links

    - [Kestra Meilisearch Plugin Documentation](https://kestra.io/plugins/plugin-meilisearch)
    - [Meilisearch REST API Reference](https://www.meilisearch.com/docs/reference/api/overview)

    ## Pitfalls

    - **Port Conflicts**: Ensure port 7700 does not conflict with local host services. Do not use port 8080.
    - **Network Isolation**: Ensure Kestra containers can resolve the `meilisearch` container hostname across Docker networks.
    - **Authentication Failures**: Missing or invalid `MEILISEARCH_MASTER_KEY` will result in HTTP 401 Unauthorized errors during probe execution.

  tags:
    - Data
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - Day 2 Operations
  ee: false
  demo: false
