id: github-actions-minutes-usage-tracker
namespace: company.team

description: |
  Tally GitHub Actions minutes consumed by the org over the last week and
  alert Slack when usage approaches the plan budget.

triggers:
  - id: weekly_usage_report
    type: io.kestra.plugin.core.trigger.Schedule
    description: Weekly tally so plan-minute burn is visible before the bill lands.
    cron: "0 8 * * 1"
    disabled: true

inputs:
  - id: github_owner
    type: STRING
    defaults: "kestra-io"
    description: GitHub org or user to read usage for.
  - id: monthly_budget_minutes
    type: INT
    defaults: 3000
    description: Minutes budget for the month; the weekly alert fires when projected monthly burn exceeds it.

outputs:
  - id: minutes_used
    type: INT
    description: Total Actions minutes used this month.
    value: "{{ outputs.tally_minutes.vars.minutes_used }}"
  - id: over_budget
    type: BOOLEAN
    value: "{{ outputs.tally_minutes.vars.over_budget }}"

tasks:
  - id: tally_minutes
    type: io.kestra.plugin.scripts.python.Script
    description: Query the GitHub Actions billing endpoint, count used minutes, and evaluate budget.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests kestra
    env:
      OWNER: "{{ inputs.github_owner }}"
      BUDGET: "{{ inputs.monthly_budget_minutes }}"
      GITHUB_TOKEN: "{{ secret('GITHUB_TOKEN') }}"
    script: |
      import os
      import sys
      import requests
      from kestra import Kestra

      owner = os.environ.get("OWNER", "kestra-io")
      budget = int(os.environ.get("BUDGET", "3000"))
      token = os.environ.get("GITHUB_TOKEN", "")

      headers = {
          "Accept": "application/vnd.github.v3+json",
          "User-Agent": "Kestra-Minutes-Tracker"
      }
      if token:
          headers["Authorization"] = f"Bearer {token}"

      url = f"https://api.github.com/orgs/{owner}/settings/billing/actions"
      try:
          resp = requests.get(url, headers=headers, timeout=15)
          resp.raise_for_status()
          data = resp.json()
      except Exception as err:
          print(f"ERROR: Failed to query Actions billing: {err}", file=sys.stderr)
          sys.exit(1)

      used = data.get("total_minutes_used", 0)
      breach = used >= budget
      print(f"{owner} used {used} minutes (budget {budget}, breach={breach})")

      Kestra.outputs({
          "minutes_used": used,
          "over_budget": breach
      })

  - id: over_budget
    type: io.kestra.plugin.core.flow.If
    description: Only alert when the meter is past budget; otherwise log the reading.
    condition: "{{ outputs.tally_minutes.vars.over_budget }}"
    then:
      - id: alert_over_budget
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: State the real number against the budget.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "GitHub Actions minutes on {{ inputs.github_owner }} are at {{ outputs.tally_minutes.vars.minutes_used }} of {{ inputs.monthly_budget_minutes }} for the month. Trim long jobs or bump the plan. Execution {{ execution.id }}."
          }
    else:
      - id: log_ok
        type: io.kestra.plugin.core.log.Log
        description: Record the weekly reading for the cost trend.
        message: "{{ inputs.github_owner }} at {{ outputs.tally_minutes.vars.minutes_used }} minutes this month, under the {{ inputs.monthly_budget_minutes }} budget."

errors:
  - id: alert_tally_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alert when the tally fails - a dead API call must not read as zero spend.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "Actions minutes tally FAILED in flow {{ flow.id }} (execution {{ execution.id }}). Check GITHUB_TOKEN scopes and org admin rights."
      }

extend:
  title: Track GitHub Actions Minutes Usage
  shortDescription: Weekly tally of org Actions minutes with a Slack alert when the budget is breached.
  metaTitle: GitHub Actions Minutes Usage Tracker
  metaDescription: Report GitHub Actions minutes used this month and alert Slack when the budget is exceeded.
  description: |
    Reads the org billing endpoint weekly and alerts Slack when usage crosses the budget.
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - GitHub
    - FinOps
  ee: false
  demo: false
