id: github-actions-minutes-usage-tracker
namespace: company.team
description: |
  Tally GitHub Actions minutes consumed by the org over the last week and
  alert Slack when usage approaches the plan budget.

triggers:
  - id: weekly_usage_report
    type: io.kestra.plugin.core.trigger.Schedule
    description: Weekly tally so plan-minute burn is visible before the bill lands.
    cron: "0 8 * * 1"
    disabled: true

inputs:
  - id: github_owner
    type: STRING
    defaults: "my-org"
    description: GitHub org or user to read usage for.
  - id: monthly_budget_minutes
    type: INT
    defaults: 3000
    description: Minutes budget for the month; the weekly alert fires when projected monthly burn exceeds it.

tasks:
  - id: tally_minutes
    type: io.kestra.plugin.scripts.shell.Commands
    description: Query the GitHub Actions billing endpoint with gh, count the used minutes, and emit them plus a simple projection via the stdout outputs protocol. API failure reports worst case.
    containerImage: alpine:3.20
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    commands:
      - |
        apk add --no-cache gh python3 >/dev/null 2>&1
        cat > tally.py <<'PYEOF'
        import os, json, subprocess
        owner = os.environ.get("OWNER", "")
        try:
            out = subprocess.run(["gh", "api", f"/orgs/{owner}/settings/billing/actions"], capture_output=True, text=True, timeout=30, env={**os.environ, "GH_TOKEN": os.environ.get("GH_TOKEN", "")}).stdout
            data = json.loads(out or "{}")
            used = data.get("total_minutes_used", 0)
        except Exception:
            used = -1
        budget = int(os.environ.get("BUDGET", "3000"))
        breach = used >= budget or used < 0
        print(f"{owner} used {used} minutes (budget {budget})")
        print("::" + json.dumps({"outputs": {"minutes_used": max(used, 0), "over_budget": breach}}) + "::")
        PYEOF
        python3 tally.py
    env:
      OWNER: "{{ inputs.github_owner }}"
      BUDGET: "{{ inputs.monthly_budget_minutes }}"
      GH_TOKEN: "{{ secret('GITHUB_TOKEN') }}"

  - id: over_budget
    type: io.kestra.plugin.core.flow.If
    description: Only alert when the meter is past budget; otherwise log the reading.
    condition: "{{ outputs.tally_minutes.vars.over_budget == true }}"
    then:
      - id: alert_over_budget
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: State the real number against the budget.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": ":stopwatch: GitHub Actions minutes on {{ inputs.github_owner }} are at {{ outputs.tally_minutes.vars.minutes_used }} of {{ inputs.monthly_budget_minutes }} for the month. Trim long jobs or bump the plan. Execution {{ execution.id }}."
          }
    else:
      - id: log_ok
        type: io.kestra.plugin.core.log.Log
        description: Record the weekly reading for the cost trend.
        message: "{{ inputs.github_owner }} at {{ outputs.tally_minutes.vars.minutes_used }} minutes this month, under the {{ inputs.monthly_budget_minutes }} budget."

errors:
  - id: alert_tally_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alert when the tally fails - a dead API call must not read as zero spend.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "Actions minutes tally FAILED in flow {{ flow.id }} (execution {{ execution.id }}). Check GITHUB_TOKEN scopes and org admin rights."
      }

outputs:
  - id: minutes_used
    type: INT
    description: 'Total Actions minutes used this month, e.g. 1240.'
    value: "{{ outputs.tally_minutes.vars.minutes_used }}"

extend:
  title: Track GitHub Actions Minutes Usage
  shortDescription: Weekly tally of org Actions minutes with a Slack alert when the budget is breached.
  metaTitle: GitHub Actions Minutes Usage Tracker
  metaDescription: Report GitHub Actions minutes used this month and alert Slack when the budget is exceeded.
  description: |
    Minute burn is a surprise until the bill. This blueprint reads the org billing endpoint weekly and alerts Slack when usage crosses the budget.

    ## How it works

    1. `tally_minutes` (`io.kestra.plugin.scripts.shell.Commands` on Alpine with gh) calls the billing API and emits minutes plus an over-budget flag via the `::{"outputs": ...}::` protocol.
    2. `over_budget` (`io.kestra.plugin.core.flow.If`) branches to `alert_over_budget` or `log_ok`.
    3. The `errors` block alerts on failure.
    4. Trigger: a disabled weekly `Schedule`.

    ## What you get

    - A weekly visibility ping on Actions spend.
    - Early warning before the monthly bill.

    ## Who it's for

    - Teams burning plan minutes faster than planned.
    - Engineering managers who own the bill.

    ## Why orchestrate this with Kestra

    gh prints JSON; the flow makes it a scheduled decision with alerts and history. The next step (disable a workflow, right-size a runner, alert finance) is one task away.

    ## Prerequisites

    - Docker available on the Kestra Worker.
    - A GitHub token with org billing read access.
    - A Slack webhook.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: webhook for budget and failure alerts.
    - `GITHUB_TOKEN`: token for the billing endpoint.

    ## Quick start

    1. Add the Slack webhook and `GITHUB_TOKEN` secrets.
    2. Set `github_owner` and `monthly_budget_minutes`.
    3. Run once and read `minutes_used`.
    4. Enable the weekly schedule.

    ## How to extend

    - Break down spend per workflow with the usage endpoints.
    - Trend the weekly readings in KV.
    - Alert at 80% as well as 100%.

    ## Links

    - [GitHub Actions billing API](https://docs.github.com/en/rest/billing/actions)
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - GitHub
    - FinOps
  ee: false
  demo: false
