id: minio-public-bucket-anonymous-policy-lockdown-guard
namespace: company.team

description: |
  Find MinIO buckets that serve their objects to anyone on the internet through an anonymous
  download, upload or public policy, then lock them down. The scan reads every bucket's anonymous
  policy with the MinIO client, the native MinIO plugin inventories the objects each exposed bucket
  is handing out with no credentials. A gated remediation runs mc anonymous set none behind an
  approval before re-reading the policy and failing the run if any targeted bucket is still open.
  A bucket you keep public on purpose stays public when you add it to the allowlist.

inputs:
  - id: dry_run
    type: BOOL
    defaults: true
    description: When true the flow only reports exposed buckets and never changes a policy.

  - id: auto_remediate
    type: BOOL
    defaults: false
    description: When true (and dry_run is false) the flow locks exposed buckets down after approval.

  - id: minio_endpoint
    type: STRING
    defaults: http://minio.internal:9000
    description: MinIO S3 API endpoint URL. Both the native plugin and the mc client connect to it.

  - id: minio_access_key
    type: STRING
    defaults: "{{ secret('MINIO_ACCESS_KEY_ID') }}"
    description: MinIO access key. Defaults to the MINIO_ACCESS_KEY_ID secret and needs rights to read and set bucket policies.

  - id: minio_secret_key
    type: STRING
    defaults: "{{ secret('MINIO_SECRET_KEY_ID') }}"
    description: MinIO secret key. Defaults to the MINIO_SECRET_KEY_ID secret.

  - id: allowlist
    type: ARRAY
    itemType: STRING
    defaults: []
    description: Buckets that are public on purpose, such as a static site bucket. They are reported as spared and never changed. Empty by default so nothing public is ignored by accident.

  - id: max_lockdowns
    type: INT
    defaults: 25
    description: Ceiling on how many buckets one run may lock down. More flagged than this looks like a mis-scoped run or a wrong endpoint, so the flow refuses to write and alerts instead.

  - id: mc_image
    type: STRING
    defaults: minio/mc:latest
    description: Container image carrying the mc client. Override to pin a version or point at an internal mirror.

  - id: docker_network
    type: STRING
    defaults: bridge
    description: Docker network the mc client container joins so it can reach the MinIO endpoint. Default bridge reaches any routable address. Set it to the user-defined network your MinIO container is on when the endpoint is a container name.

triggers:
  - id: daily
    type: io.kestra.plugin.core.trigger.Schedule
    description: Audit anonymous bucket policies daily. Safe mode is forced here, so a scheduled run only reports.
    cron: "0 6 * * *"
    disabled: true
    inputs:
      dry_run: true
      auto_remediate: false

tasks:
  - id: scan_policies
    type: io.kestra.plugin.scripts.shell.Commands
    description: >-
      List every bucket with the mc client and read each one's anonymous policy. A bucket whose
      policy is anything other than private is exposed. Exposed buckets that are not on the allowlist
      are flagged. A connection or credential failure fails the task so an unreachable endpoint can
      never read as a clean result.
    containerImage: "{{ inputs.mc_image }}"
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      networkMode: "{{ inputs.docker_network }}"
    env:
      MC_CONFIG_DIR: /tmp/.mc
      HOME: /tmp
      ENDPOINT: "{{ inputs.minio_endpoint }}"
      ACCESS: "{{ inputs.minio_access_key }}"
      SECRET: "{{ inputs.minio_secret_key }}"
      ALLOW_JSON: "{{ inputs.allowlist | toJson }}"
    commands:
      - |
        set -e
        mc alias set audit "$ENDPOINT" "$ACCESS" "$SECRET" >/dev/null
        if ! mc ls audit >/dev/null 2>&1; then
          echo "cannot reach MinIO at $ENDPOINT or credentials rejected" >&2
          exit 1
        fi
        mc ls --json audit 2>/dev/null | jq -r 'select(.key != null) | .key | rtrimstr("/")' > /tmp/buckets.txt
        : > /tmp/rows.jsonl
        while IFS= read -r b; do
          [ -z "$b" ] && continue
          perm=$(mc --json anonymous get audit/"$b" 2>/dev/null | jq -r '.permission // "unknown"')
          jq -nc --arg b "$b" --arg p "$perm" '{bucket:$b, permission:$p}' >> /tmp/rows.jsonl
        done < /tmp/buckets.txt
        jq -sc --arg allow_json "$ALLOW_JSON" '
          ($allow_json | fromjson) as $al
          | map(. + {exposed: (.permission != "private" and .permission != "unknown")})
          | map(. + {allowlisted: (.bucket as $b | ($al | index($b)) != null)})
          | {
              scanned: length,
              buckets: .,
              flagged: (map(select(.exposed and (.allowlisted | not)))),
              flagged_names: (map(select(.exposed and (.allowlisted | not)) | .bucket)),
              spared_names: (map(select(.exposed and .allowlisted) | .bucket)),
              flagged_count: (map(select(.exposed and (.allowlisted | not))) | length),
              flagged_csv: (map(select(.exposed and (.allowlisted | not)) | .bucket) | join(", ")),
              spared_count: (map(select(.exposed and .allowlisted)) | length),
              exposed_count: (map(select(.exposed)) | length)
            }
        ' /tmp/rows.jsonl > /tmp/out.json
        echo "scanned=$(jq -r .scanned /tmp/out.json) exposed=$(jq -r .exposed_count /tmp/out.json) flagged=$(jq -r .flagged_count /tmp/out.json) spared=$(jq -rc .spared_names /tmp/out.json)"
        jq -c '{outputs: .}' /tmp/out.json | sed 's/^/::/; s/$/::/'

  - id: inventory_exposed
    type: io.kestra.plugin.core.flow.Loop
    description: For each flagged bucket, read the objects it is handing out to anonymous callers, so the blast radius is on the record before anything is changed.
    values: "{{ outputs.scan_policies.vars.flagged_names }}"
    concurrencyLimit: 4
    tasks:
      - id: list_objects
        type: io.kestra.plugin.minio.List
        description: List the objects an unauthenticated client can read from this exposed bucket.
        endpoint: "{{ inputs.minio_endpoint }}"
        accessKeyId: "{{ inputs.minio_access_key }}"
        secretKeyId: "{{ inputs.minio_secret_key }}"
        bucket: "{{ item.value }}"
        recursive: true
        filter: FILES
      - id: log_exposure
        type: io.kestra.plugin.core.log.Log
        message: "Exposed bucket {{ item.value }} is readable with no credentials and holds {{ (outputs.list_objects.objects ?? []) | length }} object(s)."

  - id: gate
    type: io.kestra.plugin.core.flow.If
    description: Lock buckets down only when auto_remediate is true, dry_run is false and something is actually flagged. Any other combination reports and stops.
    condition: "{{ inputs.auto_remediate and (inputs.dry_run == false) and ((outputs.scan_policies.vars.flagged_names | length) > 0) }}"
    then:
      - id: ceiling_check
        type: io.kestra.plugin.core.flow.If
        description: Refuse to mass-change policies when the flagged count is over the ceiling, which usually means a wrong endpoint or a mis-scoped run.
        condition: "{{ (outputs.scan_policies.vars.flagged_names | length) <= inputs.max_lockdowns }}"
        then:
          - id: confirm
            type: io.kestra.plugin.core.flow.Pause
            description: >-
              Hold for a human before any policy is changed. Approving removes anonymous access from
              every flagged bucket. That breaks any anonymous client currently reading from those
              buckets, which is the whole point of the lockdown, so the decision is a person's to make.
            onResume:
              - id: approved
                type: BOOL
                description: Set true to remove anonymous access from the flagged buckets. Leave false or unset to make no change.
          - id: apply
            type: io.kestra.plugin.core.flow.If
            description: Only proceed past the pause when it was explicitly approved. An unanswered pause never reads as approval.
            condition: "{{ outputs.confirm.onResume.approved ?? false }}"
            then:
              - id: remediate_buckets
                type: io.kestra.plugin.core.flow.Loop
                description: Lock each flagged bucket down and prove it. Serial, because concurrent policy writes on one endpoint race.
                values: "{{ outputs.scan_policies.vars.flagged_names }}"
                concurrencyLimit: 1
                tasks:
                  - id: set_none
                    type: io.kestra.plugin.scripts.shell.Commands
                    description: Remove the anonymous policy from this bucket with mc anonymous set none.
                    containerImage: "{{ inputs.mc_image }}"
                    taskRunner:
                      type: io.kestra.plugin.scripts.runner.docker.Docker
                      networkMode: "{{ inputs.docker_network }}"
                    env:
                      MC_CONFIG_DIR: /tmp/.mc
                      HOME: /tmp
                      ENDPOINT: "{{ inputs.minio_endpoint }}"
                      ACCESS: "{{ inputs.minio_access_key }}"
                      SECRET: "{{ inputs.minio_secret_key }}"
                      BUCKET: "{{ item.value }}"
                    commands:
                      - |
                        set -e
                        mc alias set audit "$ENDPOINT" "$ACCESS" "$SECRET" >/dev/null
                        mc anonymous set none audit/"$BUCKET"
                  - id: reverify_bucket
                    type: io.kestra.plugin.scripts.shell.Commands
                    description: Read the anonymous policy again. This is the authoritative proof the lockdown landed.
                    containerImage: "{{ inputs.mc_image }}"
                    taskRunner:
                      type: io.kestra.plugin.scripts.runner.docker.Docker
                      networkMode: "{{ inputs.docker_network }}"
                    env:
                      MC_CONFIG_DIR: /tmp/.mc
                      HOME: /tmp
                      ENDPOINT: "{{ inputs.minio_endpoint }}"
                      ACCESS: "{{ inputs.minio_access_key }}"
                      SECRET: "{{ inputs.minio_secret_key }}"
                      BUCKET: "{{ item.value }}"
                    commands:
                      - |
                        set -e
                        mc alias set audit "$ENDPOINT" "$ACCESS" "$SECRET" >/dev/null
                        perm=$(mc --json anonymous get audit/"$BUCKET" 2>/dev/null | jq -r '.permission // "unknown"')
                        echo "reverify $BUCKET -> $perm"
                        echo "::{\"outputs\":{\"perm\":\"$perm\"}}::"
                  - id: assert_locked
                    type: io.kestra.plugin.core.flow.If
                    description: Fail the run if the bucket is still exposed after the lockdown, so a change that did not land is never reported as success.
                    condition: "{{ outputs.reverify_bucket.vars.perm == 'private' }}"
                    then:
                      - id: locked_ok
                        type: io.kestra.plugin.core.log.Log
                        message: "Bucket {{ item.value }} is now private."
                    else:
                      - id: still_exposed
                        type: io.kestra.plugin.core.execution.Fail
                        errorMessage: "Bucket {{ item.value }} still has anonymous policy '{{ outputs.reverify_bucket.vars.perm }}' after lockdown."
            else:
              - id: declined
                type: io.kestra.plugin.core.log.Log
                message: "Approval was declined, so {{ outputs.scan_policies.vars.flagged_count }} exposed bucket(s) were left unchanged."
        else:
          - id: too_many
            type: io.kestra.plugin.core.execution.Fail
            errorMessage: "{{ outputs.scan_policies.vars.flagged_count }} flagged bucket(s) exceeds max_lockdowns ({{ inputs.max_lockdowns }}). Refusing to mass-change policies. Check the endpoint and the scope."
    else:
      - id: no_write
        type: io.kestra.plugin.core.log.Log
        message: >-
          No policy was changed. dry_run={{ inputs.dry_run }}, auto_remediate={{ inputs.auto_remediate }},
          flagged={{ outputs.scan_policies.vars.flagged_count }}
          ({{ outputs.scan_policies.vars.flagged_names }}), spared={{ outputs.scan_policies.vars.spared_names }}.
          Set dry_run=false and auto_remediate=true to lock the flagged buckets down.

  - id: report
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Post a run summary to Slack.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "MinIO anonymous policy guard: scanned {{ outputs.scan_policies.vars.scanned }} bucket(s), {{ outputs.scan_policies.vars.flagged_count }} flagged ({{ outputs.scan_policies.vars.flagged_csv }}), {{ outputs.scan_policies.vars.spared_count }} spared by allowlist. dry_run={{ inputs.dry_run }}, auto_remediate={{ inputs.auto_remediate }} (execution {{ execution.id }})."
      }

errors:
  - id: alert_on_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alert Slack when the scan fails, a lockdown errors or a bucket is still exposed after remediation.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "MinIO anonymous policy guard FAILED (execution {{ execution.id }}). A bucket may still be exposed or the endpoint was unreachable. Check the logs."
      }

extend:
  title: Lock down MinIO buckets left open to anonymous access
  shortDescription: Find MinIO buckets whose anonymous policy exposes their objects to the public internet, inventory what is exposed, then remove the policy behind an approval and prove the bucket is private again.
  metaTitle: Lock down public MinIO buckets with Kestra
  metaDescription: Find MinIO buckets exposed by an anonymous download, upload or public policy, then run mc anonymous set none behind an approval and re-verify.
  description: |
    A MinIO bucket left with an anonymous `download`, `upload` or `public` policy serves its objects to anyone on the internet with no credentials. It is the classic public bucket data exposure. It usually comes from a quick "just make it work" during setup that nobody walks back. This blueprint finds those buckets, records exactly what each one is handing out, then removes the anonymous policy behind an approval and proves the bucket is private again.

    This blueprint was created by [zkasuran](https://github.com/zkasuran).

    ## Safety

    Locking a bucket down removes anonymous access, which breaks any anonymous client currently reading from it. That is the point of the fix, not a side effect, so the destructive step sits behind a `Pause`: a person approves the exact set of buckets before any policy changes. Read-only is the default (`dry_run: true`, `auto_remediate: false`), the allowlist spares buckets that are public on purpose. A ceiling refuses a run that would change more buckets than you expect.

    ## How it works

    1. `scan_policies` (`io.kestra.plugin.scripts.shell.Commands` on the mc image) lists every bucket and reads each one's anonymous policy with `mc anonymous get`. A policy other than `private` means the bucket is exposed. Exposed buckets that are not on the allowlist are flagged. A connection or credential failure fails the task, so an unreachable endpoint never reads as a clean result.
    2. `inventory_exposed` (`io.kestra.plugin.core.flow.Loop`) runs `list_objects` (`io.kestra.plugin.minio.List`) on each flagged bucket to record the objects an unauthenticated caller can read right now. This is the blast radius, captured before anything changes.
    3. `gate` (`io.kestra.plugin.core.flow.If`) changes a policy only when `auto_remediate` is true, `dry_run` is false and at least one bucket is flagged. `ceiling_check` refuses a run that would exceed `max_lockdowns`.
    4. `confirm` (`io.kestra.plugin.core.flow.Pause`) holds for a human. On approval, `remediate_buckets` (`io.kestra.plugin.core.flow.Loop`, `concurrencyLimit: 1`) runs `set_none` (`mc anonymous set none`) on each flagged bucket, then `reverify_bucket` reads the policy again and `assert_locked` fails the run if the bucket is still exposed.
    5. `report` posts a summary to Slack. The `errors` block posts a separate alert if the scan fails, a lockdown errors or a bucket is still exposed after remediation.

    ## What you get

    - A conservative detector that treats any anonymous policy other than `private` as exposed, so an unusual or custom grant is caught rather than skipped.
    - An inventory of exactly which objects each exposed bucket is serving, recorded before the fix.
    - A fix that is read-only by default and runs the real `mc anonymous set none` only after a person approves the exact buckets.
    - A re-read of every policy after the change that fails the run if a bucket is still open, so a lockdown that did not land is never reported green.

    ## Who it's for

    - Platform teams running self-hosted MinIO (or any S3-compatible store that mc speaks to) who need to keep anonymous access off by default.
    - Security engineers auditing object storage for public exposure on a schedule.
    - Teams on on-prem or air-gapped infrastructure with no cloud provider block-public-access control to lean on.

    ## Why orchestrate this with Kestra

    Finding a public bucket is one plugin call. Fixing it is another. Proving the fix landed is a third. Kestra ties them into one audited run: the native MinIO plugin inventories the exposure, the mc client reads and sets the policy, the `Pause` puts a person between detection and a change that breaks live clients. The re-verify step makes the whole thing fail loudly rather than quietly leaving a bucket open. The policy lives in version-controlled YAML, not in a one-off script somebody ran once.

    ## Tested end to end

    Run against a MinIO server with four buckets: one anonymous `download`, one anonymous `upload`, one `private` and one `download` bucket on the allowlist. The scan flags the two exposed non-allowlisted buckets and spares the allowlisted one. A dry run reports them without changing anything. With `auto_remediate: true`, `dry_run: false` and an approval, both are set to `private`, an unauthenticated read that worked before the run is refused after it. The private bucket is never touched. A re-verify against a bucket a concurrent writer keeps re-opening fails the run as designed. An unreachable endpoint routes to the Slack alert.

    ## Prerequisites

    ### Secrets

    - `MINIO_ACCESS_KEY_ID`: MinIO access key with rights to read and set bucket policies.
    - `MINIO_SECRET_KEY_ID`: MinIO secret key.
    - `SLACK_WEBHOOK_URL`: Slack incoming webhook for the summary and the failure alert.

    ### Inputs

    - `dry_run` (BOOL, default `true`): report only when true.
    - `auto_remediate` (BOOL, default `false`): lock exposed buckets down when true and `dry_run` is false.
    - `minio_endpoint` (STRING): the MinIO S3 API endpoint URL.
    - `minio_access_key` (STRING, default `secret('MINIO_ACCESS_KEY_ID')`), `minio_secret_key` (STRING, default `secret('MINIO_SECRET_KEY_ID')`).
    - `allowlist` (ARRAY of STRING, default empty): buckets that are public on purpose and are never changed.
    - `max_lockdowns` (INT, default `25`): ceiling on how many buckets one run may change.
    - `mc_image` (STRING, default `minio/mc:latest`): the mc client image.
    - `docker_network` (STRING, default `bridge`): the Docker network the mc client joins to reach the endpoint. Set it to your MinIO container's network when the endpoint is a container name.

    ## Quick start

    1. Add the three secrets to your Kestra namespace and set `minio_endpoint`.
    2. Run it. It lists every bucket, flags the exposed ones, inventories them and changes nothing.
    3. Put any bucket that is public on purpose into `allowlist` and run again. It is reported as spared.
    4. Run with `auto_remediate: true` and `dry_run: false`. Approve the pause. The flagged buckets are set to `private` and the run fails if any is still open.
    5. Set `disabled: false` on the `daily` trigger once you are happy with a report-only schedule.

    ## How to extend

    - Point `allowlist` at a flow input or a namespace KV so the public-by-design set is managed outside the flow.
    - Narrow the scan to a prefix of buckets by filtering the `mc ls` output, for a very large MinIO.
    - Replace `mc anonymous set none` with a custom policy via `mc anonymous set-json` to grant scoped access instead of removing it.
    - Add an object-level check with `io.kestra.plugin.minio.List` to flag world-readable objects inside an otherwise private bucket.

    ## Links

    - MinIO plugin: https://kestra.io/plugins/plugin-minio
    - mc anonymous: https://min.io/docs/minio/linux/reference/minio-mc/mc-anonymous.html
  tags:
    - Data
    - Infrastructure
  subTags:
    - Day 2 Operations
    - Monitoring & Alerting
  ee: false
  demo: false
