id: camunda-job-worker-contract-and-retry-backoff-gate
namespace: company.team

description: |
  Act as a resilient external job worker for Camunda 8 (Zeebe) BPMN service tasks.
  Validates incoming job payloads against required schema contracts, completes valid tasks
  with enriched output variables, applies exponential retry backoff on transient failures,
  and raises immediate incidents in Camunda Operate when retries are exhausted.

inputs:
  - id: camunda_rest_address
    type: STRING
    displayName: Camunda REST Address
    description: Base URL of the Camunda 8 Zeebe gateway REST API (e.g., http://localhost:8080 for local Zeebe or SaaS endpoint).
    defaults: "http://localhost:8080"

  - id: camunda_grpc_address
    type: STRING
    displayName: Camunda gRPC Address
    description: Host and port of the Camunda Zeebe gRPC gateway (e.g., localhost:26500).
    defaults: "localhost:26500"

  - id: job_type
    type: STRING
    displayName: BPMN Service Task Job Type
    description: The task definition type configured on the Camunda BPMN Service Task element.
    defaults: "process-order"

  - id: worker_name
    type: STRING
    displayName: Worker Name
    description: Client identifier registered with Zeebe when activating job locks.
    defaults: "kestra-camunda-worker"

  - id: lock_timeout
    type: DURATION
    displayName: Job Lock Timeout
    description: Maximum duration the job lock is held by Kestra before Zeebe makes it available to other workers.
    defaults: "PT5M"

  - id: retry_backoff
    type: DURATION
    displayName: Retry Backoff Duration
    description: ISO-8601 duration Camunda waits before re-activating a transiently failed job.
    defaults: "PT30S"

triggers:
  - id: camunda_job_stream
    type: io.kestra.plugin.camunda.Trigger
    description: "External job worker listening for activated BPMN service tasks of type jobType via REST long polling. Shipped disabled so connection parameters and secrets can be configured first."
    restAddress: "{{ inputs.camunda_rest_address }}"
    grpcAddress: "{{ inputs.camunda_grpc_address }}"
    jobType: "{{ inputs.job_type }}"
    workerName: "{{ inputs.worker_name }}"
    timeout: PT5M
    streamEnabled: false
    disabled: true

tasks:
  - id: validate_payload_contract
    type: io.kestra.plugin.core.debug.Return
    description: "Validate that the incoming Camunda job variables contain the mandatory business fields (order_id, customer_id, and positive amount)."
    format: "{{ trigger.variables.order_id is defined and trigger.variables.customer_id is defined and trigger.variables.amount is defined and trigger.variables.amount > 0 ? 'VALID_CONTRACT' : 'INVALID_SCHEMA' }}"

  - id: route_by_contract_evaluation
    type: io.kestra.plugin.core.flow.If
    description: "Branch on payload validity: execute business fulfillment and complete the job, or immediately fail with zero retries on invalid contract."
    condition: "{{ outputs.validate_payload_contract.value == 'VALID_CONTRACT' }}"
    then:
      - id: log_job_processing
        type: io.kestra.plugin.core.log.Log
        description: "Log validated job processing with process instance and element keys."
        message: "Processing Camunda jobKey={{ trigger.jobKey }} for processInstance={{ trigger.processInstanceKey }}, bpmnProcess={{ trigger.bpmnProcessId }}, elementId={{ trigger.elementId }}."

      - id: complete_service_task
        type: io.kestra.plugin.camunda.CompleteJob
        description: "Report the job as successfully completed back to Camunda Zeebe, merging enriched variables into the process instance."
        restAddress: "{{ inputs.camunda_rest_address }}"
        jobKey: "{{ trigger.jobKey }}"
        variables:
          fulfillment_status: "SUCCESS"
          processed_by: "kestra-worker"
          processed_at: "{{ now() }}"

      - id: log_job_completed
        type: io.kestra.plugin.core.log.Log
        message: "Successfully completed Camunda job {{ trigger.jobKey }} and released lock."

    else:
      - id: fail_job_permanent_invalid_schema
        type: io.kestra.plugin.camunda.FailJob
        description: "Explicitly fail the job with 0 retries so Camunda Operate raises an immediate actionable Incident rather than letting the lock expire silently into a zombie loop."
        restAddress: "{{ inputs.camunda_rest_address }}"
        jobKey: "{{ trigger.jobKey }}"
        retries: 0
        errorMessage: "Schema validation contract violated: missing or invalid order_id, customer_id, or non-positive amount. Variables received: {{ trigger.variables }}."
        variables:
          failure_reason: "CONTRACT_VIOLATION"

      - id: alert_invalid_contract_incident
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: "Notify on-call team in Slack that an unrecoverable contract violation occurred and an incident was created in Operate."
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "CRITICAL: Camunda Job {{ trigger.jobKey }} in process {{ trigger.bpmnProcessId }} (instance {{ trigger.processInstanceKey }}) failed schema validation contract. Job failed with 0 retries; incident created in Camunda Operate. Execution: {{ execution.id }}."
          }

  - id: log_worker_audit
    type: io.kestra.plugin.core.log.Log
    description: "Record immutable audit line for operational visibility."
    message: "Camunda Worker Audit: jobKey={{ trigger.jobKey }}, bpmnProcess={{ trigger.bpmnProcessId }}, contractStatus={{ outputs.validate_payload_contract.value }}, executionId={{ execution.id }}."

errors:
  - id: fail_job_transient_error
    type: io.kestra.plugin.camunda.FailJob
    description: "Safely decrement job retries and set retry backoff in Camunda when an unexpected worker error occurs. If retries hit 0, Camunda raises an incident."
    restAddress: "{{ inputs.camunda_rest_address }}"
    jobKey: "{{ trigger.jobKey }}"
    retries: "{{ trigger.retries is defined and trigger.retries > 1 ? trigger.retries - 1 : 0 }}"
    retryBackoff: "{{ inputs.retry_backoff }}"
    errorMessage: "Kestra execution {{ execution.id }} encountered an unexpected worker error while executing job {{ trigger.jobKey }}."

  - id: alert_worker_execution_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: "Alert Slack when an unexpected worker failure occurs."
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "ALERT: Kestra Camunda worker execution {{ execution.id }} failed on job {{ trigger.jobKey }}. Remaining retries: {{ trigger.retries is defined and trigger.retries > 1 ? trigger.retries - 1 : 0 }}."
      }

outputs:
  - id: job_key
    type: STRING
    value: "{{ trigger.jobKey }}"

  - id: process_instance_key
    type: STRING
    value: "{{ trigger.processInstanceKey }}"

  - id: contract_evaluation
    type: STRING
    value: "{{ outputs.validate_payload_contract.value }}"

extend:
  title: Camunda 8 Service Task Contract & Retry Backoff Gate
  metaTitle: Camunda 8 Service Task Contract & Retry Backoff Gate | Kestra
  shortDescription: Execute Camunda 8 BPMN service tasks as a resilient job worker, enforcing payload contract validation, graduated retry backoff, and instant incident escalation.
  metaDescription: Enforce contract validation, retry backoffs, and incident escalation on Camunda 8 service tasks with Kestra.
  description: |
    In Camunda 8 (Zeebe), distributed business processes rely on external job workers to execute Service Tasks. When an external worker crashes or encounters an unhandled exception without explicitly notifying the Zeebe gateway, the job lock simply expires. Camunda re-delivers the locked job indefinitely without decrementing retries, resulting in a silent zombie loop where no incident is ever raised in Camunda Operate.

    This blueprint implements a production-grade Camunda 8 Job Worker and Resilience Gate. It activates service task jobs in real time, validates incoming payload contracts, completes successful tasks with enriched execution variables, applies graduated retry backoffs on transient errors, and explicitly fails invalid jobs with zero retries so operators receive instant incident visibility.

    ## How it works

    1. `camunda_job_stream` (`io.kestra.plugin.camunda.Trigger`) acts as an external Zeebe job worker, activating jobs for the specified `job_type` and acquiring an execution lock for `lock_timeout`.
    2. `validate_payload_contract` (`io.kestra.plugin.core.debug.Return`) verifies that the job's variables fulfill the required business contract (`order_id`, `customer_id`, and `amount > 0`).
    3. `route_by_contract_evaluation` (`io.kestra.plugin.core.flow.If`) evaluates the contract result:
       - **Valid Contract**: Runs fulfillment steps and calls `complete_service_task` (`io.kestra.plugin.camunda.CompleteJob`) to report success back to Zeebe with merged variables (`fulfillment_status`, `processed_at`), allowing the BPMN token to advance.
       - **Invalid Schema**: Calls `fail_job_permanent_invalid_schema` (`io.kestra.plugin.camunda.FailJob`) with `retries: 0`. This stops wasteful re-polling and forces Camunda to immediately raise an Incident in Camunda Operate, while alerting Slack.
    4. `log_worker_audit` (`io.kestra.plugin.core.log.Log`) logs an immutable record of the job key, process instance key, and outcome.
    5. The flow-level `errors` block catches unexpected runtime errors and executes `fail_job_transient_error` (`io.kestra.plugin.camunda.FailJob`), decrementing retries (`retries: trigger.retries - 1`) and applying `retryBackoff: PT30S` so the job cools down before re-activation.

    ## What you get

    - Resilient external worker execution for Camunda 8 BPMN Service Tasks.
    - Automated payload contract validation preventing corrupted state from propagating down the process.
    - Zero-zombie guarantee: locks are never left to expire silently without reporting completion or failure.
    - Exponential / graduated backoff on transient failures to avoid hammer-polling downstream services.
    - Instant incident creation in Camunda Operate when retries are exhausted or data contracts are breached.
    - Real-time Slack notifications directing SREs to the exact job key and process instance key.

    ## Who it's for

    - Platform Engineers and SREs managing Camunda 8 / Zeebe orchestration clusters in production.
    - BPMN Process Developers integrating microservices and third-party APIs via external workers.
    - Integration Teams who need guaranteed error handling and incident visibility for mission-critical workflows.

    ## Why orchestrate this with Kestra

    Building external workers as standalone microservices requires writing boilerplate gRPC polling loops, heartbeat handlers, retry state trackers, and error notification hooks. With Kestra, Camunda service tasks become first-class declarative workflows with native secret management, visual execution logs, and automated incident escalation.

    ## Prerequisites

    - A running Camunda 8 / Zeebe cluster (Self-Managed or Camunda SaaS) reachable from Kestra.
    - A BPMN process definition containing a Service Task with task definition type matching `job_type` (default `process-order`).
    - A Slack incoming webhook URL for incident alerting.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack incoming webhook URL used for incident notifications and unhandled worker failures.
    - For Camunda SaaS authentication, optionally configure `CAMUNDA_CLIENT_ID` and `CAMUNDA_CLIENT_SECRET`.

    ## Quick start

    1. Configure `SLACK_WEBHOOK_URL` in your Kestra namespace secrets.
    2. Start a local Camunda 8 Zeebe instance for testing:
       `docker run -d --name zeebe -p 26500:26500 -p 8080:8080 camunda/zeebe:latest`
    3. Deploy a sample BPMN process with a Service Task typed `process-order`.
    4. Start a process instance from the Camunda Modeler or Zeebe CLI with variables:
       `{"order_id": "ORD-1234", "customer_id": "CUST-987", "amount": 250.00}`
    5. Enable `triggers.camunda_job_stream` and verify the job completes and the process advances.

    ## How to extend

    - Add downstream API calls or database updates within the `then` block before calling `CompleteJob`.
    - Use `io.kestra.plugin.camunda.PublishMessage` to correlate messages with other waiting BPMN catch events.
    - Map custom BPMN error codes using Camunda BPMN error events instead of generic failures.

    ## Links

    - [Kestra Camunda Plugin Documentation](https://kestra.io/plugins/plugin-camunda)
    - [Camunda 8 Job Workers Documentation](https://docs.camunda.io/docs/components/concepts/job-workers/)
    - [Camunda 8 Incidents Concepts](https://docs.camunda.io/docs/components/concepts/incidents/)
  tags:
    - Infrastructure
    - Business
  subTags:
    - Incident Response
    - Day 2 Operations
  ee: false
  verified: false
  demo: false
