id: osquery-endpoint-config-drift-audit
namespace: company.team
description: |
  Endpoint osquery configs drift away from the blessed baseline one hotfix at
  a time, and the compliance evidence goes stale with them. A keyed webhook
  accepts the endpoint config snapshot JSON, a WorkingDirectory materializes it
  for a Python diff against the blessed baseline kept in the flow, and every
  changed, missing or unexpected key is collected as drift. Drifted endpoints
  open a labeled GitHub issue and alert Slack, unreadable snapshots escalate
  through their own branch, and the verdict, the drifted keys and the summary
  are published as outputs.

triggers:
  - id: post_config_snapshot
    type: io.kestra.plugin.core.trigger.Webhook
    description: POST the endpoint osquery configuration snapshot JSON here from the fleet collector after each config pull.
    key: "{{ secret('OSQUERY_WEBHOOK_KEY') }}"
  - id: daily_drift_sweep
    type: io.kestra.plugin.core.trigger.Schedule
    description: Fallback net, a daily drift sweep at 04:00 UTC, shipped disabled until an operator switches it on.
    cron: "0 4 * * *"
    disabled: true

inputs:
  - id: config_snapshot
    type: JSON
    defaults:
      schedule:
        system_info:
          interval: 60
          query: select uuid, hostname from system_info
        pack_events:
          interval: 60
      decorators:
        load:
          - select uid, username from users where uid < 500
      file_paths:
        system_binaries:
          - /usr/bin/%
      packs:
        incident-response:
          queries:
            process_hash: select hash from hashing where path like '/usr/bin/%%'
    description: osquery configuration snapshot the diff grades when no webhook body is posted, shaped as the config sections osqueryd reports.
  - id: endpoint_id
    type: STRING
    defaults: win-eng-042
    description: Endpoint name the snapshot was collected from, used in the issue title and the Slack alert.
  - id: github_repository
    type: STRING
    defaults: your-org/endpoint-baselines
    description: Repository in owner slash name form that receives the drift issue when the snapshot leaves the baseline.

tasks:
  # --- 1. snapshot grade ---
  - id: config_workspace
    type: io.kestra.plugin.core.flow.WorkingDirectory
    description: One shared directory so the shell step that writes the snapshot and the Python step that diffs it read the same file.
    tasks:
      - id: write_snapshot
        type: io.kestra.plugin.scripts.shell.Commands
        description: Materialize the posted snapshot, or the input default on manual runs, into the shared workspace with a quoted heredoc and size it for the log.
        taskRunner:
          type: io.kestra.plugin.scripts.runner.docker.Docker
          entryPoint: []
        containerImage: python:3.12-slim
        commands:
          - |
            set -u
            cat > config_snapshot.json <<'SNAPSHOT_EOF'
            {{ (trigger.body ?? inputs.config_snapshot) | toJson }}
            SNAPSHOT_EOF
            echo "wrote $(wc -c < config_snapshot.json) bytes of osquery config to the shared workspace"

      - id: diff_against_baseline
        type: io.kestra.plugin.scripts.python.Script
        description: Flatten the snapshot to dot paths, compare every blessed baseline key plus every unexpected extra, and emit the drift verdict through the outputs protocol.
        taskRunner:
          type: io.kestra.plugin.scripts.runner.docker.Docker
        containerImage: python:3.12-slim
        script: |
          import json
          import os

          SNAPSHOT_FILE = "config_snapshot.json"

          BASELINE = {
              "schedule.system_info.interval": 300,
              "schedule.system_info.query": "select uuid, hostname from system_info",
              "schedule.pack_events.interval": 60,
              "options.logger_plugin": "syslog",
              "decorators.load": ["select uid, username from users where uid < 500"],
              "file_paths.system_binaries": ["/usr/bin/%", "/bin/%"],
          }

          def flatten(node, prefix, out):
              if isinstance(node, dict):
                  if not node and prefix:
                      out[prefix] = {}
                      return
                  for key in node:
                      child = prefix + "." + str(key) if prefix else str(key)
                      flatten(node[key], child, out)
              else:
                  out[prefix] = node

          def load_snapshot(path):
              try:
                  if not os.path.exists(path) or os.path.getsize(path) == 0:
                      return None, "config snapshot file is missing or empty"
                  with open(path, "r", encoding="utf-8") as handle:
                      document = json.load(handle)
                  document = json.loads(document) if isinstance(document, str) else document
                  if not isinstance(document, dict):
                      return None, "config snapshot is not a JSON object"
                  return document, ""
              except ValueError:
                  return None, "config snapshot is not valid JSON"

          def clean(value):
              return str(value).replace('"', "'")

          snapshot, problem = load_snapshot(SNAPSHOT_FILE)

          verdict = "error"
          error = problem
          drift_keys = []
          drift_bits = []
          baseline_checked = 0
          compliant = False

          if snapshot is not None:
              flat = {}
              flatten(snapshot, "", flat)
              for key in sorted(BASELINE):
                  if key not in flat:
                      drift_keys.append(key)
                      drift_bits.append(key + " missing from snapshot")
                  elif flat[key] != BASELINE[key]:
                      drift_keys.append(key)
                      drift_bits.append(key + " changed (baseline " + clean(BASELINE[key])
                                        + " vs snapshot " + clean(flat[key]) + ")")
              for key in sorted(flat):
                  if key not in BASELINE:
                      drift_keys.append(key)
                      drift_bits.append(key + " not in baseline")
              baseline_checked = len(BASELINE)
              drift_keys = sorted(set(drift_keys))
              compliant = not drift_keys
              error = ""
              verdict = "compliant" if compliant else "drift"

          payload = {
              "verdict": verdict,
              "compliant": compliant,
              "drift_count": len(drift_keys),
              "drift_keys": drift_keys,
              "drift_summary": "; ".join(drift_bits)[:500],
              "baseline_keys_checked": baseline_checked,
              "error": error,
          }
          print("checked=%d drift=%d verdict=%s" % (baseline_checked, len(drift_keys), verdict))
          print("::" + json.dumps({"outputs": payload}) + "::")

  # --- 2. verdict gate ---
  - id: gate_config_drift
    type: io.kestra.plugin.core.flow.If
    description: Escalate drifted endpoints into a tracked issue and a Slack alert, and route unreadable snapshots through their own branch instead of calling them compliant.
    condition: "{{ outputs.diff_against_baseline.vars.verdict == 'drift' }}"
    then:
      - id: open_drift_issue
        type: io.kestra.plugin.github.issues.Create
        description: Open a labeled issue listing every drifted key so the drift has an owner and a thread instead of a screenshot.
        oauthToken: "{{ secret('GITHUB_TOKEN') }}"
        repository: "{{ inputs.github_repository }}"
        title: "osquery config drift on {{ inputs.endpoint_id }}"
        body: |
          ## Endpoint osquery config drift

          Endpoint **{{ inputs.endpoint_id }}** reports **{{ outputs.diff_against_baseline.vars.drift_count }}** drifted key(s) against the blessed baseline.

          ```json
          {"drift_keys": {{ outputs.diff_against_baseline.vars.drift_keys | toJson }}}
          ```

          {{ outputs.diff_against_baseline.vars.drift_summary }}

          Execution {{ execution.id }}

          Restore the listed keys to the baseline or promote the change through config review, then re-run the audit.
        labels:
          - osquery
          - config-drift
      - id: alert_drift
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Tell the platform channel which endpoint drifted and how many keys left the baseline.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "osquery config drift on {{ inputs.endpoint_id }} - {{ outputs.diff_against_baseline.vars.drift_count }} key(s) off baseline - {{ outputs.diff_against_baseline.vars.drift_summary }}. Issue opened in {{ inputs.github_repository }}. Execution {{ execution.id }}."
          }
    else:
      - id: check_snapshot_error
        type: io.kestra.plugin.core.flow.If
        description: Surface an unreadable snapshot as its own branch so a broken payload never reads as compliance evidence.
        condition: "{{ outputs.diff_against_baseline.vars.verdict == 'error' }}"
        then:
          - id: alert_unreadable_snapshot
            type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
            description: Tell the platform channel the snapshot could not be diffed and name the load problem.
            url: "{{ secret('SLACK_WEBHOOK_URL') }}"
            payload: |
              {
                "text": "osquery snapshot unreadable for {{ inputs.endpoint_id }} - {{ outputs.diff_against_baseline.vars.error }}. Execution {{ execution.id }}."
              }
        else:
          - id: log_compliant
            type: io.kestra.plugin.core.log.Log
            description: Record the compliant result with the baseline key count so the history doubles as the evidence pack.
            message: "osquery config compliant on {{ inputs.endpoint_id }} - all {{ outputs.diff_against_baseline.vars.baseline_keys_checked }} baseline key(s) match, no unexpected keys"

errors:
  - id: notify_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Escalate any failure to the ops channel with the execution url.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {"text": "FAILED: {{ flow.id }} {{ execution.id }}"}

outputs:
  - id: verdict
    type: STRING
    description: compliant when every baseline key matches, drift when any key changed, went missing or appeared, error when the snapshot could not be read.
    value: "{{ outputs.diff_against_baseline.vars.verdict }}"
  - id: compliant
    type: BOOL
    description: TRUE when the snapshot matches the blessed baseline exactly.
    value: "{{ outputs.diff_against_baseline.vars.compliant }}"
  - id: drift_count
    type: INT
    description: Number of drifted keys, changed, missing or unexpected, for example 4.
    value: "{{ outputs.diff_against_baseline.vars.drift_count }}"
  - id: drift_keys
    type: ARRAY
    description: 'Drifted dot paths, for example ["schedule.system_info.interval"].'
    value: "{{ outputs.diff_against_baseline.vars.drift_keys | toJson }}"
  - id: drift_summary
    type: STRING
    description: Human summary of every drift, truncated so it fits an issue body and a Slack alert.
    value: "{{ outputs.diff_against_baseline.vars.drift_summary }}"
  - id: baseline_keys_checked
    type: INT
    description: Number of blessed baseline keys the snapshot was compared against, for example 6.
    value: "{{ outputs.diff_against_baseline.vars.baseline_keys_checked }}"

extend:
  title: Diff Endpoint osquery Configs Against the Blessed Baseline
  metaTitle: Endpoint osquery Config Drift Audits
  shortDescription: "Grade a posted osquery config snapshot against the blessed baseline, file a GitHub issue listing every drifted key, and alert Slack."
  metaDescription: "Diff an endpoint osquery configuration snapshot against the blessed baseline, file a GitHub issue listing every drifted key, and keep evidence fresh."
  description: |
    An endpoint tightens its schedule interval, drops a file path glob or picks
    up a hand edited pack, and the osquery config walks away from the blessed
    baseline with nothing to catch it. This blueprint takes one config snapshot
    from the fleet collector, diffs it key by key against the baseline kept in
    the flow inside a shared workspace, and turns every changed, missing or
    unexpected key into a tracked issue, a Slack alert and a dated execution
    record that doubles as the compliance evidence.

    ## How it works

    1. `post_config_snapshot` (`io.kestra.plugin.core.trigger.Webhook`, keyed with the `OSQUERY_WEBHOOK_KEY` secret) accepts the snapshot after each config pull; `daily_drift_sweep` (`io.kestra.plugin.core.trigger.Schedule`, cron `0 4 * * *`) ships `disabled: true` until an operator switches it on.
    2. `config_workspace` (`io.kestra.plugin.core.flow.WorkingDirectory`) opens one shared directory. `write_snapshot` (`io.kestra.plugin.scripts.shell.Commands` on the Docker runner, image `python:3.12-slim`) writes the posted body, or the `config_snapshot` input default on manual runs, into `config_snapshot.json` with a quoted heredoc, and `diff_against_baseline` (`io.kestra.plugin.scripts.python.Script`) reads exactly that file. Both children are scripts inside the workspace and every notification sits after the block, because default tasks are stateless and a temp dir is purged when a task completes.
    3. `diff_against_baseline` flattens the snapshot into dot paths, compares every blessed baseline key such as `schedule.system_info.interval` and `file_paths.system_binaries`, flags baseline keys that went missing and snapshot keys that are not in the baseline, and prints `compliant`, `drift`, or `error` as one `::{"outputs": ...}::` line.
    4. `gate_config_drift` (`io.kestra.plugin.core.flow.If`) escalates `drift` into `open_drift_issue` (`io.kestra.plugin.github.issues.Create`) and `alert_drift` (`io.kestra.plugin.slack.notifications.SlackIncomingWebhook`), an `error` run routes through `check_snapshot_error` and `alert_unreadable_snapshot`, and a clean endpoint lands in `log_compliant`. The flow level `errors` handler reports any workspace or script failure with the execution id.

    ## What you get

    - One gateable verdict, `compliant`, `drift`, or `error`, that any config management pipeline can branch on.
    - The drifted dot paths and a human summary as typed outputs, ready for evidence packs and dashboards.
    - Escalation where engineers already work, a labeled GitHub issue listing every drifted key plus a Slack alert naming the endpoint.
    - A fail safe posture, an unreadable snapshot escalates instead of reading as compliance.
    - An execution history that keeps the exact snapshot diff run after run, not a screenshot in a ticket.

    ## Who it's for

    - Endpoint and platform operators who own the blessed osquery config across a mixed fleet.
    - Security and compliance engineers who need dated evidence that endpoints still match the baseline.
    - IT administrators who want drifted configs tracked as issues instead of discovered during an audit.

    ## Why orchestrate this with Kestra

    osquery can dump what an endpoint runs but never says whether that still matches the blessed config, so drift waits for an auditor with a spreadsheet. Kestra supplies the keyed webhook for the collector, the baseline living next to the diff in one file, a shared workspace where the snapshot and the comparison agree on one path, a branch that separates drift from unreadable from clean, GitHub and Slack routing from a single definition, and an execution history per endpoint. A scheduled script on the collector gives you none of that, it only diffs the endpoints someone remembers to point it at.

    ## Prerequisites

    - A worker with Docker access, both workspace children run in `python:3.12-slim`.
    - A collector step that POSTs the endpoint's effective osquery config as a JSON object, for example assembled from Fleet or a scheduled osqueryi dump of the loaded config.
    - A GitHub token that can open issues in `github_repository`, classic `repo` scope or fine grained Issues write.
    - A Slack incoming webhook for the drift alert, the unreadable snapshot alert and the failure handler.

    ### Secrets

    - `OSQUERY_WEBHOOK_KEY`: key guarding the snapshot webhook URL, anyone holding it can post endpoint config.
    - `GITHUB_TOKEN`: token used to open the drift issue.
    - `SLACK_WEBHOOK_URL`: Slack incoming webhook URL used by the drift alert and the `errors` handler.

    ## Quick start

    1. Add the three secrets and point `github_repository` at a repository where issues are welcome.
    2. Run the flow once with the default inputs and confirm `verdict` is `drift` with `drift_count` at 4, the fixture tightens the interval, drops a glob, leaves `options.logger_plugin` out and adds a hand rolled pack.
    3. POST a snapshot that matches the baseline and watch `verdict` flip to `compliant` with `drift_keys` empty in the outputs.

       ```
       curl -X POST -H "Content-Type: application/json" -d '{"schedule":{"system_info":{"interval":300,"query":"select uuid, hostname from system_info"},"pack_events":{"interval":60}},"options":{"logger_plugin":"syslog"},"decorators":{"load":["select uid, username from users where uid < 500"]},"file_paths":{"system_binaries":["/usr/bin/%","/bin/%"]}}' "https://<kestra>/api/v1/<tenant>/executions/webhook/<namespace>/osquery-endpoint-config-drift-audit/<OSQUERY_WEBHOOK_KEY>"
       ```

    4. Point the fleet collector at the webhook and enable `daily_drift_sweep` once every endpoint reports through it.

    ## How to extend

    - Grade a second estate by adding a `baseline_file` input written next to the snapshot, so staging and production keep their own blessed configs.
    - Fan the audit across endpoints with `io.kestra.plugin.core.flow.ForEachItem` over an endpoint list, each subflow posting its own snapshot.
    - Keep the last drift keys in the Kestra KV store and open the issue only for keys that are new since the previous run, so a standing exception does not re-file every night.
    - Stop the endpoint's config pipeline by adding `io.kestra.plugin.core.execution.Fail` under `gate_config_drift`.

    ## Links

    - [osquery configuration](https://osquery.readthedocs.io)
    - [Kestra webhook trigger](https://kestra.io/plugins/triggers/webhook)
    - [Kestra GitHub plugin](https://kestra.io/plugins/plugin-github)
    - [Kestra Slack plugin](https://kestra.io/plugins/plugin-slack)
    - [Kestra Docker task runner](https://kestra.io/plugins/plugin-scripts-docker)
  tags:
    - Infrastructure
  subTags:
    - Day 2 Operations
    - Policy & Compliance
    - Reporting & Digests
  ee: false
  demo: false
