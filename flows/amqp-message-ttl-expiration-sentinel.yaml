id: amqp-message-ttl-expiration-sentinel
namespace: company.team

description: |
  Audit RabbitMQ and AMQP message TTL expiration and dead-letter backlog
  accumulation on a recurring schedule to catch head-of-line blocking and
  unhandled expired message spikes before broker memory exhaustion.

inputs:
  - id: queue_name
    type: STRING
    defaults: "orders.queue"
    displayName: "Target AMQP Queue Name"
    description: "The primary AMQP or RabbitMQ queue configured with per-message or queue-level TTL."

  - id: dlq_queue_name
    type: STRING
    defaults: "orders.dlq"
    displayName: "Dead-Letter Queue Name"
    description: "The designated dead-letter queue capturing expired messages routed by x-dead-letter-exchange."

  - id: expired_threshold
    type: INT
    defaults: 5
    displayName: "Expired Message Threshold"
    description: "Threshold of expired or dead-lettered messages in the DLQ above which an alert is triggered."

  - id: remediation_mode
    type: SELECT
    values:
      - "ALERT_ONLY"
      - "QUARANTINE_LOG"
    defaults: "ALERT_ONLY"
    displayName: "Remediation Mode"
    description: "Operational response mode when expired threshold is exceeded: dispatch Slack alert only or generate forensic log."

  - id: dry_run
    type: SELECT
    values:
      - "true"
      - "false"
    defaults: "true"
    displayName: "Dry Run Mode"
    description: "When set to true, safe remediation actions only log planned mutations without altering broker state."

triggers:
  - id: schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 */6 * * *"
    disabled: true
    inputs:
      queue_name: "orders.queue"
      dlq_queue_name: "orders.dlq"
      expired_threshold: 5
      remediation_mode: "ALERT_ONLY"
      dry_run: "true"

tasks:
  - id: probe_dlq_backlog
    type: io.kestra.plugin.core.http.Request
    description: "Read the DLQ depth (messages_ready) from the RabbitMQ management API. An AMQP Consume would take the dead-lettered messages off the DLQ and acknowledge them, so the audit only reads the broker's counters."
    uri: "http://{{ secret('RABBITMQ_HOST') }}:{{ secret('RABBITMQ_MANAGEMENT_PORT') }}/api/queues/{{ secret('RABBITMQ_VHOST') | urlencode | replace({'+': '%20'}) }}/{{ inputs.dlq_queue_name | urlencode | replace({'+': '%20'}) }}"
    method: GET
    headers:
      Accept: application/json
    options:
      auth:
        type: BASIC
        username: "{{ secret('RABBITMQ_USERNAME') }}"
        password: "{{ secret('RABBITMQ_PASSWORD') }}"

  - id: evaluate_threshold
    type: io.kestra.plugin.core.flow.Switch
    description: "Classify audit outcome into HEALTHY or BREACH based on the number of dead-lettered messages waiting in the DLQ."
    value: "{{ (fromJson(outputs.probe_dlq_backlog.body).messages_ready > inputs.expired_threshold) ? 'BREACH' : 'HEALTHY' }}"
    cases:
      "HEALTHY":
        - id: log_healthy_status
          type: io.kestra.plugin.core.log.Log
          message: "AMQP TTL audit healthy: DLQ {{ inputs.dlq_queue_name }} has {{ fromJson(outputs.probe_dlq_backlog.body).messages_ready }} expired records, below threshold of {{ inputs.expired_threshold }}."
      "BREACH":
        - id: alert_threshold_breach
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: "Dispatch structured Slack alert when dead-lettered or expired message accumulation exceeds threshold."
          url: "{{ secret('SLACK_WEBHOOK') }}"
          payload: |
            {"text": "AMQP Message TTL Alert: Queue {{ inputs.queue_name }} DLQ {{ inputs.dlq_queue_name }} accumulated {{ fromJson(outputs.probe_dlq_backlog.body).messages_ready }} expired messages (threshold: {{ inputs.expired_threshold }}). Mode: {{ inputs.remediation_mode }}, DryRun: {{ inputs.dry_run }}."}
        - id: log_remediation_action
          type: io.kestra.plugin.core.log.Log
          message: "Remediation action initiated: mode={{ inputs.remediation_mode }}, dry_run={{ inputs.dry_run }}. Investigate consumer latency and head-of-line blocking."
    defaults:
      - id: log_default_status
        type: io.kestra.plugin.core.log.Log
        message: "AMQP TTL sentinel audit encountered unclassified status for DLQ {{ inputs.dlq_queue_name }}."

  - id: log_audit_completion
    type: io.kestra.plugin.core.log.Log
    description: "Post-audit summary confirming completion of the AMQP message TTL expiration evaluation cycle."
    message: "AMQP TTL expiration sentinel cycle complete for queue {{ inputs.queue_name }}. DLQ depth: {{ fromJson(outputs.probe_dlq_backlog.body).messages_ready }}."

errors:
  - id: alert_on_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: "Dispatch urgent Slack notification if flow execution encounters an unexpected error."
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {"text": "Flow execution failed: amqp-message-ttl-expiration-sentinel failed during execution {{ execution.id }}."}

extend:
  title: "Audit RabbitMQ AMQP Message TTL Expiration and Dead-Letter Backlog"
  metaTitle: "RabbitMQ AMQP Message TTL Expiration Sentinel | Kestra"
  shortDescription: "Audit AMQP queues for expired message accumulation and dead-letter backlog with automated Slack alerts."
  metaDescription: "Audit RabbitMQ AMQP message TTL expiration and dead-letter backlog with Kestra. Detect head-of-line blocking and dispatch automated alerts."
  description: |
    In RabbitMQ and AMQP architectures, messages published with per-message Time-To-Live (TTL)
    or queues configured with message expiration are intended to be processed or dropped within
    a deterministic timeframe. However, RabbitMQ only evaluates per-message TTL when a message
    reaches the head of the queue. If an unexpired or stuck message blocks the head, newer expired
    messages remain accumulated behind it, silently consuming broker memory. Furthermore, when
    messages finally expire and route to a Dead-Letter Queue (DLQ), consumer drop-offs can cause
    unmonitored DLQ backlog spikes.

    This blueprint provides an automated Day 2 Operations sentinel flow that reads DLQ backlog
    depth from the RabbitMQ management API on a scheduled cadence, without consuming any message. It classifies queue health against
    configurable warning thresholds, alerts on-call engineers via Slack upon backlog accumulation,
    and logs actionable diagnostic remediation telemetry.

    ## How it works

    1. `schedule` (`io.kestra.plugin.core.trigger.Schedule`) initiates the audit cycle every 6 hours (disabled by default for safe initial setup).
    2. `probe_dlq_backlog` (`io.kestra.plugin.core.http.Request`) reads `dlq_queue_name` from the RabbitMQ management API (`GET /api/queues/{vhost}/{queue}`). It only reads the queue's counters, so the dead-lettered messages stay on the broker for inspection or replay.
    3. `evaluate_threshold` (`io.kestra.plugin.core.flow.Switch`) evaluates whether the DLQ's `messages_ready` exceeds `inputs.expired_threshold`.
    4. When within normal limits (`HEALTHY`), `log_healthy_status` records the successful pass.
    5. When the limit is exceeded (`BREACH`), `alert_threshold_breach` dispatches an operational alert to Slack using `io.kestra.plugin.slack.notifications.SlackIncomingWebhook`, and `log_remediation_action` logs the chosen remediation mode.
    6. `log_audit_completion` writes a final audit recap for execution tracking and observability.
    7. The flow-level `errors` block intercepts broker connectivity failures or authentication errors and notifies Slack.

    ## What you get

    - Early detection of expired message accumulation before broker memory exhaustion.
    - Identification of head-of-line queue blocking and lagging consumer groups.
    - Zero message disruption: the DLQ depth comes from the management API, so no message is consumed or acknowledged.
    - Automated Slack incident notifications with execution context and queue metadata.
    - Flow-level error alerting safeguarding audit pipeline reliability.

    ## Who it's for

    - Platform Engineers and Site Reliability Engineers managing RabbitMQ or AMQP message brokers.
    - Event-Driven Architecture (EDA) teams building asynchronous order or event streaming systems.
    - DevOps engineers tasked with broker observability and DLQ backlog hygiene.

    ## Why orchestrate this with Kestra

    Monitoring RabbitMQ TTL and DLQ accumulation with standalone cron scripts requires managing
    custom credentials, error handling, retry logic, and webhook clients in isolated codebases.
    Kestra provides a declarative workflow engine with native AMQP consumption, centralized secret
    management, conditional branching, execution history, and integrated Slack alerting without
    writing or maintaining custom polling daemons.

    ## Prerequisites

    - A running RabbitMQ broker (3.8+) with the management plugin enabled (the `rabbitmq:*-management` images have it), reachable from Kestra.
    - An AMQP queue configured with a Dead-Letter Exchange (`x-dead-letter-exchange`) and DLQ.
    - A Slack Incoming Webhook URL configured in Kestra secrets.

    ### Local Docker Container Setup

    To run RabbitMQ locally for development and testing while avoiding host port 8080 conflicts:

    ```bash
    docker run -d --name rabbitmq-dev -p 5672:5672 -p 15672:15672 -e RABBITMQ_DEFAULT_USER=guest -e RABBITMQ_DEFAULT_PASS=guest rabbitmq:3-management
    ```

    If Kestra is running inside a Docker network, connect the RabbitMQ container to Kestra network:

    ```bash
    docker network ls
    docker network connect YOUR_KESTRA_NETWORK rabbitmq-dev
    ```

    ### Secrets

    - `RABBITMQ_HOST`: Hostname or container name of the RabbitMQ broker (e.g. `rabbitmq-dev` or `localhost`).
    - `RABBITMQ_MANAGEMENT_PORT`: Management HTTP API port (e.g. `15672`).
    - `RABBITMQ_USERNAME`: RabbitMQ user with the `management` or `monitoring` tag.
    - `RABBITMQ_PASSWORD`: Password for the RabbitMQ user.
    - `RABBITMQ_VHOST`: Virtual host name (default `/`).
    - `SLACK_WEBHOOK`: Incoming Webhook URL for Slack alerting.

    > Note for Kestra Open-Source (OSS): Secrets are provided as base64-encoded environment variables formatted as `SECRET_<NAME>` on the Kestra server or worker environment.

    ### Inputs

    | Name | Type | Default | Allowed Values | Description |
    | :--- | :--- | :--- | :--- | :--- |
    | `queue_name` | STRING | `"orders.queue"` | Any valid queue name | Primary AMQP queue configured with TTL |
    | `dlq_queue_name` | STRING | `"orders.dlq"` | Any valid queue name | Dead-letter queue capturing expired messages |
    | `expired_threshold` | INT | `5` | Positive integer | Threshold of expired messages triggering alert |
    | `remediation_mode` | SELECT | `"ALERT_ONLY"` | `"ALERT_ONLY"`, `"QUARANTINE_LOG"` | Operational remediation action mode |
    | `dry_run` | SELECT | `"true"` | `"true"`, `"false"` | Dry run simulation flag |

    ### Outputs

    - `{{ outputs.probe_dlq_backlog.body }}`: The DLQ's details from the management API, including `messages_ready`, `messages_unacknowledged` and `consumers`.

    ## Quick start

    1. Configure `RABBITMQ_HOST`, `RABBITMQ_MANAGEMENT_PORT`, `RABBITMQ_USERNAME`, `RABBITMQ_PASSWORD`, `RABBITMQ_VHOST`, and `SLACK_WEBHOOK` in your Kestra namespace.
    2. Import this blueprint into your Kestra instance.
    3. Run a manual execution with `dry_run: "true"` to verify connectivity and the DLQ depth read.
    4. Enable the `schedule` trigger to run automated recurring audits.

    ## How to extend

    - Add automated queue dead-letter routing reconfiguration using `io.kestra.plugin.amqp.CreateQueue` or `QueueBind`.
    - Integrate with PagerDuty or Opsgenie using additional notification tasks in the `BREACH` branch.
    - Archive expired message payloads to object storage (Amazon S3 or MinIO) for regulatory compliance before queue purge.

    ## Pitfalls

    - **Head-of-Line Blocking**: Per-message TTL does not drop expired messages if an unexpired message precedes them at the queue head. Always monitor both the primary queue and the DLQ.
    - **Port Conflicts**: Ensure RabbitMQ management port (15672) and AMQP port (5672) do not conflict with other local services.
    - **Credential Scope**: The management API rejects users without a management tag. Give the Kestra user the `management` or `monitoring` tag and access to the virtual host; it doesn't need consume permissions.
    - **Stats Interval**: The management API refreshes queue counters every 5 seconds by default, so the DLQ depth can lag the broker by a few seconds.

    ## Links

    - [Kestra HTTP Request task](https://kestra.io/plugins/core/http/io.kestra.plugin.core.http.request)
    - [RabbitMQ management HTTP API](https://www.rabbitmq.com/docs/http-api-reference)
    - [RabbitMQ Time-To-Live (TTL) Guide](https://www.rabbitmq.com/docs/ttl)
    - [RabbitMQ Dead Letter Exchanges](https://www.rabbitmq.com/docs/dlx)
    - [Kestra Slack Notification Plugin](https://kestra.io/plugins/plugin-slack/notifications/io.kestra.plugin.slack.notifications.slackincomingwebhook)
