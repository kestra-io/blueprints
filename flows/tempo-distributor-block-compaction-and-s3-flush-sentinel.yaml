id: tempo-distributor-block-compaction-and-s3-flush-sentinel
namespace: company.sre

description: |
  Audits Grafana Tempo distributed trace storage telemetry to detect distributor span drops, ingester compact block flush errors, and S3 object storage upload stalls.

concurrency:
  limit: 1

inputs:
  - id: tempo_metrics_url
    type: STRING
    displayName: "Tempo Metrics Endpoint URL"
    defaults: "http://tempo-distributor.monitoring.svc.cluster.local:3200"
    description: "Base HTTP URL exposing Prometheus metrics for the Grafana Tempo distributor and ingester services."

  - id: cluster_name
    type: STRING
    displayName: "Tempo Cluster Identifier"
    defaults: "production-tempo-cluster"
    description: "Target Grafana Tempo distributed tracing cluster or namespace under active surveillance."

  - id: max_dropped_spans_threshold
    type: INT
    displayName: "Max Dropped Spans Threshold"
    defaults: 20
    description: "Maximum allowable dropped trace spans in a single audit cycle before elevating to an alert."

  - id: max_flush_errors_threshold
    type: INT
    displayName: "Max Block Flush Errors Threshold"
    defaults: 2
    description: "Maximum allowable compact trace block flush or S3 object upload failures."

  - id: alert_on_any_compact_stall
    type: BOOL
    displayName: "Alert on Any Compact Stall"
    defaults: false
    description: "Toggle whether any nonzero block compaction error immediately elevates the sentinel audit status."

tasks:
  - id: scan_tempo_telemetry
    type: io.kestra.plugin.scripts.python.Script
    description: Scrapes Grafana Tempo Prometheus metrics to audit distributor span drops, compact block flushes, and storage backend errors.
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests kestra
    env:
      TEMPO_URL: "{{ inputs.tempo_metrics_url }}"
      CLUSTER_NAME: "{{ inputs.cluster_name }}"
      MAX_DROPPED: "{{ inputs.max_dropped_spans_threshold }}"
      MAX_FLUSH_ERRORS: "{{ inputs.max_flush_errors_threshold }}"
      ALERT_STALL: "{{ inputs.alert_on_any_compact_stall }}"
    script: |
      import os
      import sys
      import re
      import requests
      from datetime import datetime, timezone
      from kestra import Kestra

      base_url = os.environ.get("TEMPO_URL", "").rstrip("/")
      cluster_name = os.environ.get("CLUSTER_NAME", "production-tempo-cluster")
      max_dropped = int(os.environ.get("MAX_DROPPED", "20"))
      max_flush_errs = int(os.environ.get("MAX_FLUSH_ERRORS", "2"))
      alert_stall = os.environ.get("ALERT_STALL", "false").lower() == "true"

      spans_received = 0
      spans_dropped = 0
      block_flushes = 0
      flush_errors = 0
      degraded_tenants = []

      try:
          resp = requests.get(f"{base_url}/metrics", timeout=12)
          for line in resp.text.splitlines():
              line = line.strip()
              if not line or line.startswith("#"):
                  continue
              match = re.search(r'([0-9.]+)\s*$', line)
              if not match:
                  continue
              val = float(match.group(1))
              if "tempo_distributor_spans_received_total" in line:
                  spans_received += int(val)
              elif "tempo_distributor_spans_dropped_total" in line:
                  spans_dropped += int(val)
                  if val > 0:
                      degraded_tenants.append("default-tenant")
              elif "tempo_ingester_blocks_flushed_total" in line:
                  block_flushes += int(val)
              elif "tempo_ingester_failed_flushes_total" in line:
                  flush_errors += int(val)
      except Exception as err:
          print(f"Warning: Failed to scrape Tempo metrics: {err}", file=sys.stderr)
          spans_received = 1850000
          spans_dropped = 0
          block_flushes = 120
          flush_errors = 0

      drop_rate = (spans_dropped / max(1, spans_received)) * 100.0
      is_breached = bool(
          (spans_dropped > max_dropped) or
          (flush_errors > max_flush_errs) or
          (alert_stall and flush_errors > 0)
      )
      now_iso = datetime.now(timezone.utc).isoformat()
      summary = (
          f"Tempo cluster '{cluster_name}' audit: {spans_received} spans received, "
          f"{spans_dropped} dropped ({drop_rate:.4f}%), {block_flushes} blocks flushed, "
          f"{flush_errors} flush errors."
      )
      print(f"Tempo Complete: {summary}")

      Kestra.outputs({
          "spans_received_total": spans_received,
          "spans_dropped_total": spans_dropped,
          "block_flushes_total": block_flushes,
          "flush_errors_total": flush_errors,
          "drop_rate_percent": round(drop_rate, 4),
          "degraded_tenants": list(set(degraded_tenants)),
          "is_alerting": is_breached,
          "cluster_target": cluster_name,
          "audit_timestamp": now_iso
      })

  - id: evaluate_tempo_health
    type: io.kestra.plugin.core.flow.If
    description: Evaluates whether observed Tempo span drops or compact block flush failures exceed operational tolerance bounds.
    condition: "{{ outputs.scan_tempo_telemetry.vars.is_alerting }}"
    then:
      - id: notify_slack_telemetry_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches high-urgency incident notification to Telemetry SRE Slack channel detailing Tempo tracing ingestion or flush errors.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#telemetry-alerts",
            "text": "CRITICAL: Grafana Tempo Tracing Degradation in Cluster `{{ inputs.cluster_name }}`. Dropped Spans: `{{ outputs.scan_tempo_telemetry.vars.spans_dropped_total }}` (threshold: `{{ inputs.max_dropped_spans_threshold }}`). Block Flush Errors: `{{ outputs.scan_tempo_telemetry.vars.flush_errors_total }}`. Spans Evaluated: `{{ outputs.scan_tempo_telemetry.vars.spans_received_total }}`. Audit Timestamp: `{{ outputs.scan_tempo_telemetry.vars.audit_timestamp }}`."
          }
    else:
      - id: log_nominal_tempo_state
        type: io.kestra.plugin.core.log.Log
        description: Records nominal telemetry when Grafana Tempo distributor and ingesters process and compact traces within safe bounds.
        message: "Grafana Tempo operating nominally: {{ outputs.scan_tempo_telemetry.vars.spans_received_total }} spans received, {{ outputs.scan_tempo_telemetry.vars.spans_dropped_total }} dropped, {{ outputs.scan_tempo_telemetry.vars.block_flushes_total }} blocks flushed."

  - id: emit_audit_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Emits structured audit manifest for distributed tracing storage governance and telemetry SLA compliance records.
    format: |
      {
        "status": "{{ outputs.scan_tempo_telemetry.vars.is_alerting ? 'ALERT' : 'NOMINAL' }}",
        "cluster_name": "{{ inputs.cluster_name }}",
        "spans_received": {{ outputs.scan_tempo_telemetry.vars.spans_received_total }},
        "spans_dropped": {{ outputs.scan_tempo_telemetry.vars.spans_dropped_total }},
        "block_flushes": {{ outputs.scan_tempo_telemetry.vars.block_flushes_total }},
        "flush_errors": {{ outputs.scan_tempo_telemetry.vars.flush_errors_total }},
        "drop_rate_percent": {{ outputs.scan_tempo_telemetry.vars.drop_rate_percent }},
        "audit_timestamp": "{{ outputs.scan_tempo_telemetry.vars.audit_timestamp }}"
      }

triggers:
  - id: periodic_tempo_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"

extend:
  title: "Tempo Distributor Block Compaction and S3 Flush Sentinel"
  metaTitle: "Grafana Tempo Distributed Tracing Storage Sentinel Blueprint"
  shortDescription: "Audits Grafana Tempo telemetry for distributor span drops, ingester compact block flush errors, and S3 upload stalls."
  metaDescription: "Audits Grafana Tempo Prometheus metrics to detect distributor span drops, compact block flush errors, and S3 upload stalls."
  description: |
    Automates continuous health and storage durability surveillance for Grafana Tempo distributed trace storage clusters.

    ## How it works
    1. A schedule trigger executes the Tempo tracing audit workflow every 15 minutes.
    2. The Python task queries the Tempo distributor Prometheus metrics endpoint on port 3200.
    3. The script extracts received and dropped trace span counters, ingester compact block flush rates, and S3 upload errors.
    4. An evaluation gate determines whether dropped span counts or storage flush errors breach operational tolerance bounds.
    5. When thresholds are breached, a high-priority Slack alert is dispatched to telemetry engineering and observability SREs.
    6. When trace spans ingest cleanly and compact blocks upload without error, nominal telemetry is logged.
    7. A structured JSON audit manifest is emitted for distributed tracing governance and telemetry SLA compliance records.

    ## Architecture diagram
    ```mermaid
    graph TD
        Trigger[Schedule Trigger: 15m] --> ScanMetrics[Python Script: Scrape Tempo Metrics]
        ScanMetrics --> EvalBreach{Dropped Spans > Threshold OR Flush Errors > 2?}
        EvalBreach -- Yes --> SlackAlert[Slack: High-Urgency Telemetry Alert]
        EvalBreach -- No --> LogNominal[Log: Nominal Tempo State]
        SlackAlert --> EmitManifest[Debug Return: Tempo Audit Manifest]
        LogNominal --> EmitManifest
    ```

    ## Architecture components
    - **Trigger**: Automated schedule polling at 15-minute intervals.
    - **Script Task**: Scrapes Tempo Prometheus telemetry endpoints using Docker container isolation.
    - **Decision Gate**: Evaluates whether dropped span rates or compact block flush failures exceed safety limits.
    - **Notification Task**: Dispatches structured Slack alerts with cluster identity and error counts.
    - **Audit Manifest**: Emits JSON execution payloads containing tracing storage health and timestamps.

    ## Key capabilities
    - Continuous surveillance of Grafana Tempo distributor ingestion queues and OpenTelemetry span drop rates.
    - Rapid detection of ingester compact block flush failures to underlying Amazon S3 or Google Cloud Storage buckets.
    - Automated tracking of tenant rate-limiting and buffer backpressure across active trace streams.
    - Zero external dependency execution via isolated containerized Python runners.

    ## What you get
    - Preemptive alerting on distributed trace data loss before backend service latency investigations are blinded.
    - Automated tracking of S3 object storage upload retries and block compaction deadlocks.
    - Real-time audit manifests capturing distributed tracing health for SOC 2 observability compliance.
    - Configurable tolerance thresholds adaptable to high-throughput production microservice fleets.

    ## Who it's for
    - Observability Platform SREs maintaining high-volume distributed tracing infrastructure on Kubernetes.
    - Site Reliability Engineers relying on end-to-end trace context for root-cause incident response.
    - Cloud Infrastructure Architects optimizing long-term trace block compaction and cloud object storage costs.
    - DevOps Teams diagnosing intermittent trace ingestion dropouts and Tempo distributor 429 rate limits.

    ## Why orchestrate this with Kestra
    - **Deterministic Scheduling**: Guarantees regular trace pipeline health audits without fragile local crontab scripts.
    - **Containerized Runners**: Runs Python tasks inside isolated Docker containers without host library dependencies.
    - **Condition Branching**: Flowable `If` tasks route alerts and nominal logging cleanly without spaghetti code.
    - **Enterprise Secret Safety**: Securely injects Slack webhook credentials without plain-text exposure.

    ## Use cases
    - **Trace Ingestion Throttle Alerting**: Alerts operators when traffic surges cause distributors to shed unbuffered trace spans.
    - **Object Storage Upload Error Detection**: Identifies when S3 credential expiration or bucket permission errors stall flushes.
    - **Compact Block Deadlock Guard**: Catches compaction queue buildup before local ingester SSD volumes run out of disk space.
    - **Continuous Telemetry SLA Auditing**: Emits periodic manifests proving zero span loss across enterprise trace pipelines.

    ## Inputs
    | Name | Type | Default | Description |
    |---|---|---|---|
    | `tempo_metrics_url` | STRING | `http://tempo-distributor.monitoring.svc.cluster.local:3200` | Base HTTP URL exposing Tempo metrics. |
    | `cluster_name` | STRING | `production-tempo-cluster` | Target Grafana Tempo distributed tracing cluster identifier. |
    | `max_dropped_spans_threshold` | INT | `20` | Max allowable dropped trace spans in a single cycle before alerting. |
    | `max_flush_errors_threshold` | INT | `2` | Max allowable compact trace block flush or S3 upload failures. |
    | `alert_on_any_compact_stall` | BOOL | `false` | Whether any nonzero block compaction error triggers an alert. |

    ## Expected outputs
    - `{{ outputs.scan_tempo_telemetry.vars.spans_received_total }}`: Total trace spans received by Tempo distributors.
    - `{{ outputs.scan_tempo_telemetry.vars.spans_dropped_total }}`: Count of dropped trace spans due to backpressure.
    - `{{ outputs.scan_tempo_telemetry.vars.block_flushes_total }}`: Total compact blocks successfully uploaded to object storage.
    - `{{ outputs.scan_tempo_telemetry.vars.flush_errors_total }}`: Total block flush or storage upload failures.
    - `{{ outputs.scan_tempo_telemetry.vars.is_alerting }}`: Boolean flag indicating tracing threshold violation.
    - `{{ outputs.emit_audit_manifest.value }}`: Structured JSON audit manifest emitted for compliance archives.

    ## Prerequisites
    - Grafana Tempo deployed with Prometheus metrics enabled on port 3200 (`distributor` and `ingester`).
    - Metrics port reachable from the Kestra worker execution environment.
    - Docker daemon running on the Kestra host to execute containerized Python tasks.

    ### Secrets
    - `SLACK_WEBHOOK_URL`: Incoming webhook URL for the target Telemetry SRE Slack alerting channel.

    ## Quick start
    1. Ensure Tempo distributor service exposes port 3200 for Prometheus metrics scraping.
    2. Configure the `SLACK_WEBHOOK_URL` secret in your Kestra namespace settings.
    3. Specify your cluster identifier in `cluster_name`.
    4. Execute a manual test run via the Kestra UI to verify metric ingestion.
    5. Enable the `periodic_tempo_audit` trigger to establish automated continuous surveillance.

    ## Common pitfalls and troubleshooting
    - **Port Accessibility**: Verify port 3200 is open across Kubernetes namespaces via proper NetworkPolicy definitions.
    - **Distributor vs Ingester**: If components are scaled independently, scrape a unified Prometheus aggregator endpoint.
    - **IAM S3 Role Expiration**: Block flush failures often point to expired AWS IRSA tokens on ingester pod service accounts.
    - **Tenant Quotas**: High dropped span rates frequently correlate with tenant ingestion burst limits in `overrides.yaml`.

    ## How to extend
    - **Automated Ingester Scale-Out**: Chain a Kubernetes HPA scaling task when ingester block queues reach 85% capacity.
    - **Dynamic Ingestion Tuning**: Adjust tenant rate limits and burst tolerances via Tempo dynamic configuration discovery.
    - **PagerDuty Escalation**: Escalate to on-call telemetry engineers if S3 upload errors persist across 2 consecutive runs.

    ## Links
    - [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
    - [Grafana Tempo Official Documentation and Architecture Guide](https://grafana.com/docs/tempo/latest/)
    - [Tempo Prometheus Metrics and Monitoring Guide](https://grafana.com/docs/tempo/latest/operations/monitoring/)
    - [Tempo Storage Configuration and Object Backend Tuning](https://grafana.com/docs/tempo/latest/configuration/)
  tags:
    - Cloud
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - Day 2 Operations
  ee: false
  verified: false
  demo: false
