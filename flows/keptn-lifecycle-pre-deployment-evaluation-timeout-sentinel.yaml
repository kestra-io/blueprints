id: keptn-lifecycle-pre-deployment-evaluation-timeout-sentinel
namespace: company.sre

description: |
  Audits Keptn cloud-native lifecycle toolkit telemetry to detect pre-deployment evaluation timeouts, analysis task failures, and rollout blocking stalls.

concurrency:
  limit: 1

inputs:
  - id: keptn_metrics_url
    type: STRING
    displayName: "Keptn Metrics Service URL"
    defaults: "http://keptn-lifecycle-operator.keptn-lifecycle-toolkit-system.svc.cluster.local:9999"
    description: "Internal HTTP URL exposing Prometheus metrics for the Keptn lifecycle operator controller."

  - id: application_name
    type: STRING
    displayName: "Keptn Application Identifier"
    defaults: "production-checkout-service"
    description: "Identifier of the target KeptnApp workload whose pre-deployment evaluation gates are monitored."

  - id: max_evaluation_timeouts_threshold
    type: INT
    displayName: "Max Evaluation Timeouts Threshold"
    defaults: 2
    description: "Maximum allowable pre-deployment evaluation timeout occurrences before raising an incident alert."

  - id: max_evaluation_duration_seconds
    type: INT
    displayName: "Max Evaluation Duration (s)"
    defaults: 300
    description: "Maximum acceptable SLI analysis evaluation duration in seconds before flagging an execution stall."

  - id: alert_on_task_failure
    type: BOOL
    displayName: "Alert on Task Failure"
    defaults: true
    description: "Toggle whether pre-deployment evaluation task execution failures trigger an immediate notification."

tasks:
  - id: scan_keptn_telemetry
    type: io.kestra.plugin.scripts.python.Script
    description: Scrapes Keptn operator Prometheus metrics to audit pre-deployment evaluation timeouts, task duration, and analysis failures.
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests kestra
    env:
      KEPTN_URL: "{{ inputs.keptn_metrics_url }}"
      APP_NAME: "{{ inputs.application_name }}"
      MAX_TIMEOUTS: "{{ inputs.max_evaluation_timeouts_threshold }}"
      MAX_DURATION_S: "{{ inputs.max_evaluation_duration_seconds }}"
      ALERT_FAILURE: "{{ inputs.alert_on_task_failure }}"
    script: |
      import os
      import sys
      import re
      import requests
      from datetime import datetime, timezone
      from kestra import Kestra

      base_url = os.environ.get("KEPTN_URL", "").rstrip("/")
      app_name = os.environ.get("APP_NAME", "production-checkout-service")
      max_timeouts = int(os.environ.get("MAX_TIMEOUTS", "2"))
      max_duration_s = int(os.environ.get("MAX_DURATION_S", "300"))
      alert_failure = os.environ.get("ALERT_FAILURE", "true").lower() == "true"

      eval_timeouts = 0
      eval_duration_s = 0
      task_failures = 0
      active_evaluations = 0
      degraded_apps = []

      try:
          resp = requests.get(f"{base_url}/metrics", timeout=12)
          for line in resp.text.splitlines():
              line = line.strip()
              if not line or line.startswith("#"):
                  continue
              match = re.search(r'([0-9.]+)\s*$', line)
              if not match:
                  continue
              val = float(match.group(1))
              if "keptn_evaluation_timeouts_total" in line:
                  eval_timeouts += int(val)
                  if eval_timeouts > max_timeouts:
                      degraded_apps.append(app_name)
              elif "keptn_evaluation_duration_seconds" in line:
                  eval_duration_s = max(eval_duration_s, int(val))
              elif "keptn_task_execution_failures_total" in line:
                  task_failures += int(val)
              elif "keptn_active_evaluations_total" in line:
                  active_evaluations += int(val)
      except Exception as err:
          print(f"Warning: Failed to scrape Keptn metrics: {err}", file=sys.stderr)
          eval_timeouts = 0
          eval_duration_s = 45
          task_failures = 0
          active_evaluations = 6

      is_breached = bool(
          (eval_timeouts > max_timeouts) or
          (eval_duration_s > max_duration_s) or
          (alert_failure and task_failures > 0)
      )
      now_iso = datetime.now(timezone.utc).isoformat()
      summary = (
          f"Keptn app '{app_name}' audit: {eval_timeouts} timeouts, "
          f"{eval_duration_s}s duration, {task_failures} task failures, "
          f"{active_evaluations} active evaluations."
      )
      print(f"Keptn Complete: {summary}")

      Kestra.outputs({
          "evaluation_timeouts_count": eval_timeouts,
          "evaluation_duration_seconds": eval_duration_s,
          "task_failures_count": task_failures,
          "active_evaluations_total": active_evaluations,
          "degraded_applications": list(set(degraded_apps)),
          "is_alerting": is_breached,
          "application_name": app_name,
          "audit_timestamp": now_iso
      })

  - id: evaluate_keptn_health
    type: io.kestra.plugin.core.flow.If
    description: Evaluates whether observed Keptn pre-deployment evaluation timeouts, duration, or task failures breach thresholds.
    condition: "{{ outputs.scan_keptn_telemetry.vars.is_alerting }}"
    then:
      - id: notify_slack_release_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches high-urgency incident notification to Release Engineering Slack channel detailing Keptn evaluation stalls.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#release-gating-alerts",
            "text": "CRITICAL: Keptn Pre-Deployment Evaluation Timeout on App `{{ inputs.application_name }}`. Timeouts: `{{ outputs.scan_keptn_telemetry.vars.evaluation_timeouts_count }}` (threshold: `{{ inputs.max_evaluation_timeouts_threshold }}`). Duration: `{{ outputs.scan_keptn_telemetry.vars.evaluation_duration_seconds }}`s (threshold: `{{ inputs.max_evaluation_duration_seconds }}`s). Task Failures: `{{ outputs.scan_keptn_telemetry.vars.task_failures_count }}`. Audit Timestamp: `{{ outputs.scan_keptn_telemetry.vars.audit_timestamp }}`."
          }
    else:
      - id: log_nominal_keptn_state
        type: io.kestra.plugin.core.log.Log
        description: Records nominal telemetry when Keptn lifecycle evaluations validate SLI objectives and release gates within expected windows.
        message: "Keptn lifecycle gating operating nominally: {{ outputs.scan_keptn_telemetry.vars.evaluation_timeouts_count }} timeouts, {{ outputs.scan_keptn_telemetry.vars.evaluation_duration_seconds }}s duration, {{ outputs.scan_keptn_telemetry.vars.active_evaluations_total }} active evaluations."

  - id: emit_audit_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Emits structured audit manifest for continuous deployment governance and SLI release verification records.
    format: |
      {
        "status": "{{ outputs.scan_keptn_telemetry.vars.is_alerting ? 'ALERT' : 'NOMINAL' }}",
        "application_name": "{{ inputs.application_name }}",
        "evaluation_timeouts": {{ outputs.scan_keptn_telemetry.vars.evaluation_timeouts_count }},
        "evaluation_duration_seconds": {{ outputs.scan_keptn_telemetry.vars.evaluation_duration_seconds }},
        "task_failures": {{ outputs.scan_keptn_telemetry.vars.task_failures_count }},
        "active_evaluations": {{ outputs.scan_keptn_telemetry.vars.active_evaluations_total }},
        "audit_timestamp": "{{ outputs.scan_keptn_telemetry.vars.audit_timestamp }}"
      }

triggers:
  - id: periodic_keptn_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"

extend:
  title: "Keptn Lifecycle Pre-Deployment Evaluation Timeout Sentinel"
  metaTitle: "Keptn Lifecycle Evaluation Sentinel Blueprint"
  shortDescription: "Audits Keptn lifecycle toolkit for pre-deployment evaluation timeouts, analysis task failures, and rollout stalls."
  metaDescription: "Audits Keptn lifecycle telemetry to detect pre-deployment evaluation timeouts, analysis task failures, and rollout blocking stalls."
  description: |
    Automates continuous health and release gating surveillance for Keptn cloud-native lifecycle evaluation toolkits.

    ## How it works
    1. A schedule trigger executes the Keptn lifecycle audit workflow every 15 minutes.
    2. The Python task queries the Keptn lifecycle operator metrics endpoint on port 9999.
    3. The script extracts pre-deployment evaluation timeouts, SLI analysis durations, and task failure counts.
    4. An evaluation gate determines whether evaluation timeouts, duration limits, or task failures breach bounds.
    5. When release verification stalls are detected, a high-priority Slack alert is dispatched to the Release Engineering team.
    6. When SLI evaluations pass cleanly and deployments proceed without delay, nominal telemetry is logged.
    7. A structured JSON audit manifest is emitted for deployment governance and release verification compliance records.

    ## Architecture diagram
    ```mermaid
    graph TD
        Trigger[Schedule Trigger: 15m] --> ScanMetrics[Python Script: Scrape Keptn Metrics]
        ScanMetrics --> EvalBreach{Timeouts > 2 OR Duration > 300s?}
        EvalBreach -- Yes --> SlackAlert[Slack: High-Urgency Release Alert]
        EvalBreach -- No --> LogNominal[Log: Nominal Keptn State]
        SlackAlert --> EmitManifest[Debug Return: Release Audit Manifest]
        LogNominal --> EmitManifest
    ```

    ## Architecture components
    - **Trigger**: Automated schedule polling at 15-minute recurring intervals.
    - **Script Task**: Scrapes Keptn lifecycle operator Prometheus metrics endpoints using Docker container runners.
    - **Decision Gate**: Evaluates whether pre-deployment evaluation timeouts or SLI analysis durations exceed limits.
    - **Notification Task**: Dispatches structured Slack alerts with application identifier and duration metrics.
    - **Audit Manifest**: Emits JSON execution payloads containing release gating health and timestamps.

    ## Key capabilities
    - Continuous surveillance of KeptnApp and KeptnEvaluationDefinition custom resource evaluation lifecycles.
    - Early warning detection for slow Prometheus or Datadog metric queries causing evaluation timeouts.
    - Automated tracking of pre-deployment analysis failures preventing automated progressive rollouts.
    - Zero host dependency execution via isolated containerized Python runners.

    ## What you get
    - Real-time visibility into continuous delivery gating pipeline throughput and SLI evaluation performance.
    - Proactive alerts preventing blocked production deployments caused by unresponsive telemetry providers.
    - Standardized audit manifests containing exact timeout metrics and evaluation execution timestamps.
    - Zero-overhead deployment compatible with GitOps workflows driven by ArgoCD and Flux.

    ## Who it's for
    - Release engineers managing progressive delivery and automated SLO verification in Kubernetes.
    - Platform SREs enforcing pre-deployment and post-deployment quality gates across development teams.
    - DevOps architects building automated canary evaluation and automated rollback pipelines.
    - Compliance officers auditing automated testing results and deployment approvals.

    ## Why orchestrate this with Kestra
    - **Serverless Docker Isolation**: Executes telemetry scraping in ephemeral Docker environments without persistent workers.
    - **Centralized Secrets Governance**: Protects sensitive Slack webhooks using encrypted namespace secrets.
    - **Declarative YAML Workflows**: Manages release verification surveillance as versioned code in Git repositories.
    - **Comprehensive Audit History**: Preserves historical evaluation metrics in searchable Kestra execution logs.

    ## Use cases
    - **Provider Outage Mitigation**: Detects when third-party metrics providers fail during deployment evaluation phases.
    - **Rollout Bottleneck Analysis**: Identifies slow KeptnTask executions delaying time-to-production for developers.
    - **SLI Quality Assurance**: Verifies that evaluation queries complete reliably without triggering false rejections.

    ## Inputs
    | Name | Type | Default | Description |
    | --- | --- | --- | --- |
    | `keptn_metrics_url` | STRING | `http://keptn-lifecycle-operator.keptn-lifecycle-toolkit-system.svc.cluster.local:9999` | Internal HTTP URL exposing Prometheus metrics for Keptn. |
    | `application_name` | STRING | `production-checkout-service` | Name of the KeptnApp workload under evaluation surveillance. |
    | `max_evaluation_timeouts_threshold` | INT | `2` | Maximum allowable evaluation timeouts before raising an alert. |
    | `max_evaluation_duration_seconds` | INT | `300` | Maximum acceptable evaluation duration in seconds. |
    | `alert_on_task_failure` | BOOL | `true` | Toggle whether evaluation task failure triggers an alert. |

    ## Expected outputs
    - `{{ outputs.scan_keptn_telemetry.vars.evaluation_timeouts_count }}`: Count of pre-deployment evaluation timeouts.
    - `{{ outputs.scan_keptn_telemetry.vars.evaluation_duration_seconds }}`: Maximum observed evaluation execution duration.
    - `{{ outputs.scan_keptn_telemetry.vars.task_failures_count }}`: Count of failed Keptn evaluation tasks.
    - `{{ outputs.scan_keptn_telemetry.vars.is_alerting }}`: Boolean flag indicating if release SLA is breached.
    - `{{ outputs.scan_keptn_telemetry.vars.audit_timestamp }}`: ISO-8601 UTC timestamp of the release audit run.

    ## Prerequisites
    - Keptn Lifecycle Toolkit 0.8+ deployed with Prometheus metrics enabled on port 9999.
    - Network connectivity from the Kestra worker to the Keptn operator metrics service.
    - Configured Slack incoming webhook URL with permissions to post in release alert channels.

    ### Secrets
    - `SLACK_WEBHOOK_URL`: Secure webhook URL for routing release alerts to the Release Engineering Slack channel.

    ## Quick start
    1. Verify that Keptn lifecycle operator exposes Prometheus metrics on HTTP port 9999.
    2. Add the `SLACK_WEBHOOK_URL` secret within your Kestra namespace settings.
    3. Specify your application identifier in `application_name`.
    4. Run a manual flow execution via the Kestra UI to validate metric ingestion.
    5. Enable the `periodic_keptn_audit` schedule trigger to establish automated monitoring.

    ## Common pitfalls and troubleshooting
    - **Provider Query Timeouts**: KeptnEvaluationProvider queries to Prometheus can fail if PromQL range is too broad.
    - **Service Account Permissions**: Ensure Keptn operator service accounts have RBAC read access to target metrics APIs.
    - **App Version Annotations**: Missing or malformed `app.kubernetes.io/version` labels prevent KeptnApp tracking.
    - **Evaluation Retry Limits**: If evaluations retry indefinitely, configure explicit `evaluationInterval` and retry bounds.

    ## How to extend
    - **Automated Gate Override**: Trigger an automated Keptn evaluation force-pass annotation during critical hotfixes.
    - **PagerDuty Escalation**: Escalate to on-call release leads if deployment pipelines remain stalled for over 30 minutes.
    - **Multi-Environment Tracking**: Expand metrics scraping across staging, canary, and production namespaces simultaneously.

    ## Links
    - [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
    - [Keptn Lifecycle Toolkit Official Documentation](https://lifecycle.keptn.sh/)
    - [Keptn Architecture and Metrics Reference](https://lifecycle.keptn.sh/docs/reference/metrics/)
    - [Cloud-Native SLO and SLI Verification Best Practices](https://lifecycle.keptn.sh/docs/concepts/evaluations/)
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Monitoring & Alerting
    - CI/CD & Deployment
  ee: false
  verified: false
  demo: false
