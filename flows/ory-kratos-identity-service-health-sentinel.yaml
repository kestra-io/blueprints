id: ory-kratos-identity-service-health-sentinel
namespace: company.team
description: |
  Audits standalone or cluster Ory Kratos identity management instances on a
  schedule, verifying admin readiness probes and identity querying capabilities
  to catch database pool exhaustion, migration locks, or trait schema errors,
  and dispatching actionable operational Slack alerts.

triggers:
  - id: periodic_kratos_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: "Periodically asserts Ory Kratos admin readiness and identity retrieval operations. Shipped disabled by default; enable once kratos_host and kratos_admin_port point to a running Ory Kratos instance."
    cron: "*/15 * * * *"
    disabled: true
    inputs:
      kratos_host: "localhost"
      kratos_admin_port: 4434
      alert_channel: "#identity-ops"

inputs:
  - id: kratos_host
    type: STRING
    displayName: "Ory Kratos Host"
    defaults: "localhost"
    description: "Hostname or IP address of the Ory Kratos server instance."

  - id: kratos_admin_port
    type: INT
    displayName: "Kratos Admin Port"
    defaults: 4434
    description: "HTTP port exposed by Ory Kratos for its administrative API (default: 4434)."

  - id: alert_channel
    type: STRING
    displayName: "Slack Alert Channel"
    defaults: "#identity-ops"
    description: "Slack channel where operational identity engine alerts are posted."

tasks:
  - id: probe_kratos_readiness
    type: io.kestra.plugin.core.http.Request
    description: "Queries Ory Kratos GET /admin/health/ready endpoint to verify database connectivity, schema migrations, and cryptographic cipher readiness."
    uri: "http://{{ inputs.kratos_host }}:{{ inputs.kratos_admin_port }}/admin/health/ready"
    method: GET
    headers:
      Accept: "application/json"
    options:
      allowFailed: true

  - id: probe_identity_query
    type: io.kestra.plugin.core.http.Request
    description: "Executes synthetic admin identity query via GET /admin/identities asserting SQL read capability and traits schema deserialization."
    uri: "http://{{ inputs.kratos_host }}:{{ inputs.kratos_admin_port }}/admin/identities?per_page=1"
    method: GET
    headers:
      Accept: "application/json"
    options:
      allowFailed: true

  - id: classify_kratos_status
    type: io.kestra.plugin.core.flow.Switch
    description: "Evaluates readiness status and identity query response code to classify operational health."
    value: >-
      {% if (fromJson(outputs.probe_kratos_readiness.body).status ?? '') != 'ok' %}
      ENGINE_UNREADY
      {% elif outputs.probe_identity_query.code >= 400 %}
      IDENTITY_QUERY_FAILED
      {% else %}
      HEALTHY
      {% endif %}
    cases:
      ENGINE_UNREADY:
        - id: alert_engine_unready
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: "Dispatches critical operational alert when Ory Kratos readiness probe reports degraded or unready status."
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "channel": "{{ inputs.alert_channel }}",
              "text": ":rotating_light: *Ory Kratos Identity Engine Unready*",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":rotating_light: *Ory Kratos Readiness Check Failed*\n*Host:* `{{ inputs.kratos_host }}:{{ inputs.kratos_admin_port }}`\n*Readiness Status:* `{{ fromJson(outputs.probe_kratos_readiness.body).status ?? 'unreachable' }}`\n*HTTP Code:* `{{ outputs.probe_kratos_readiness.code }}`\n*Impact:* The identity engine is rejecting traffic. Database connection pool may be exhausted, migration locks unresolved, or encryption secrets misconfigured."
                  }
                }
              ]
            }

      IDENTITY_QUERY_FAILED:
        - id: alert_query_failed
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: "Dispatches warning alert when Kratos returns an HTTP error during administrative identity retrieval."
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "channel": "{{ inputs.alert_channel }}",
              "text": ":warning: *Ory Kratos Identity Query Degradation*",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":warning: *Identity Deserialization or Query Failure*\n*Host:* `{{ inputs.kratos_host }}:{{ inputs.kratos_admin_port }}`\n*HTTP Code:* `{{ outputs.probe_identity_query.code }}`\n*Impact:* Admin API failed to query or deserialize user identity records. Identity traits JSON schema may have drifted or SQL read replicas are timing out."
                  }
                }
              ]
            }

      HEALTHY:
        - id: log_healthy_state
          type: io.kestra.plugin.core.log.Log
          message: "Ory Kratos identity service verified healthy on {{ inputs.kratos_host }}:{{ inputs.kratos_admin_port }}. Readiness status: ok, identity query HTTP code: {{ outputs.probe_identity_query.code }}."

  - id: log_audit_complete
    type: io.kestra.plugin.core.log.Log
    description: "Persists final execution audit entry with endpoint host and response verification metadata for compliance lineage."
    message: "Ory Kratos sentinel audit completed for host {{ inputs.kratos_host }}:{{ inputs.kratos_admin_port }}."

errors:
  - id: alert_kratos_unreachable
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: "Dispatches out-of-band notification if Ory Kratos server cannot be reached."
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "{{ inputs.alert_channel }}",
        "text": ":rotating_light: *Ory Kratos Server Unreachable*",
        "blocks": [
          {
            "type": "section",
            "text": {
              "type": "mrkdwn",
              "text": ":rotating_light: *Ory Kratos Connectivity Outage*\nFailed to connect to Ory Kratos Admin API at `http://{{ inputs.kratos_host }}:{{ inputs.kratos_admin_port }}`. The server container may be down, network routing severed, or firewall rules blocking port."
            }
          }
        ]
      }

extend:
  title: Ory Kratos Identity Service Readiness & Health Sentinel
  metaTitle: Ory Kratos Readiness & Health Sentinel | Kestra
  shortDescription: Audit Ory Kratos identity engine readiness, assert database query health, and dispatch operational Slack alerts on failure.
  metaDescription: Audit Ory Kratos identity engine readiness, assert database query health, and dispatch operational Slack alerts on failure.
  description: |
    Continuously monitors Ory Kratos headless identity and authentication deployments, asserting readiness probe health and administrative identity querying capabilities to detect database connection pool exhaustion, schema migration blocks, or identity trait deserialization failures before user authentication outages occur.

    ## How it works

    1. `periodic_kratos_audit` (`io.kestra.plugin.core.trigger.Schedule`) executes every 15 minutes, passing target host, admin port, and notification channel inputs. Shipped disabled by default to facilitate initial verification.
    2. `probe_kratos_readiness` (`io.kestra.plugin.core.http.Request`) invokes the administrative endpoint `GET /admin/health/ready` to verify that the database connection pool is healthy, pending SQL migrations are applied, and cryptographic secrets are decryptable.
    3. `probe_identity_query` (`io.kestra.plugin.core.http.Request`) invokes `GET /admin/identities?per_page=1` to confirm that Kratos can read from the persistent data store and successfully parse user traits against registered JSON schemas.
    4. `classify_kratos_status` (`io.kestra.plugin.core.flow.Switch`) evaluates the probe responses:
       - `ENGINE_UNREADY`: Triggers if `/admin/health/ready` returns a status other than `ok` (e.g. 503 during database disconnection), dispatching an urgent alert to `#identity-ops` via `io.kestra.plugin.slack.notifications.SlackIncomingWebhook`.
       - `IDENTITY_QUERY_FAILED`: Triggers if the identity query returns an HTTP error code (>= 400), alerting on trait schema validation bugs or database read timeouts.
       - `HEALTHY`: Confirms operational readiness and nominal query performance, logging state via `io.kestra.plugin.core.log.Log`.
    5. `log_audit_complete` always records execution completion and target endpoint metadata for regulatory compliance history.
    6. The global `errors` block intercepts network timeouts and connection drops to immediately notify on-call engineers when the Kratos container is unreachable.

    ## What you get

    - Early detection of database connection exhaustion or schema migration stalls affecting user authentication.
    - Continuous validation that administrative APIs can retrieve and deserialize identity records without schema conflicts.
    - Zero external dependency monitoring: probes standard Kratos admin REST endpoints natively supported in all open-source deployments.
    - Clean audit records providing a verifiable operational trail of authentication service availability.

    ## Who it's for

    - Identity and Access Management (IAM) Engineers operating open-source authentication backends.
    - Platform and SRE teams running Ory Kratos as an authentication microservice in Kubernetes or Docker.
    - Security teams requiring independent uptime and health verification of identity data stores.

    ## Why orchestrate this with Kestra

    Ory Kratos provides dedicated readiness and identity APIs, but relies on external orchestrators to execute recurring health assertions, evaluate multiple probe signals, and alert on-call teams across collaboration platforms. Kestra provides declarative scheduling, robust error handling, secret masking, and structured Slack integration without custom sidecar code.

    ## Prerequisites

    - A running Ory Kratos instance (version 1.0+), with its administrative port exposed and reachable over HTTP. Ory publishes an official open-source Docker image (`oryd/kratos:latest`) requiring no commercial license or account.
    - A Slack incoming webhook URL configured for operational alerts.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack incoming webhook URL used by `alert_engine_unready`, `alert_query_failed`, and the global `errors` block.

    ## Quick start

    1. Start a local Ory Kratos container with in-memory SQLite storage:
       ```bash
       docker run -d --name kratos-test -p 4433:4433 -p 4434:4434 -e DSN=memory -e DEV=true oryd/kratos:latest serve --dev
       ```
    2. Configure the `SLACK_WEBHOOK_URL` secret in your Kestra namespace.
    3. Import this blueprint into Kestra and trigger an execution with default inputs.
    4. Confirm that `log_healthy_state` logs nominal readiness (`status: ok`).
    5. Temporarily point `kratos_admin_port` at an unused port and re-run to confirm that `alert_kratos_unreachable` fires.
    6. Enable `periodic_kratos_audit` once verified.

    ## How to extend

    - Add an identity creation canary task (`POST /admin/identities`) that creates and immediately deletes a synthetic test user to validate end-to-end write path availability.
    - Wire a downstream PagerDuty escalation via `io.kestra.plugin.pagerduty.notifications.PagerDutyAlert` when `ENGINE_UNREADY` fires in production environments.
    - Query Kratos Prometheus metrics (`GET /admin/prometheus/metrics`) to alert on authentication session creation velocity and error rates.

    ## Links

    - [Ory Kratos Official Documentation](https://www.ory.sh/docs/kratos)
    - [Ory Kratos Admin API Reference](https://www.ory.sh/docs/kratos/reference/api)
    - [Ory Kratos GitHub Repository](https://github.com/ory/kratos)
    - [Kestra HTTP Request Plugin Documentation](https://kestra.io/plugins/plugin-core/tasks/http/io.kestra.plugin.core.http.request)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack/notifications/io.kestra.plugin.slack.notifications.slackincomingwebhook)
  tags:
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - Day 2 Operations
  ee: false
  demo: false
