id: postgres-index-cache-hit-ratio-sentinel
namespace: company.database

inputs:
  - id: db_host
    type: STRING
    defaults: "postgres.internal"
    description: PostgreSQL database server hostname or IP.
  - id: db_port
    type: INT
    defaults: 5432
    description: PostgreSQL server port.
  - id: db_name
    type: STRING
    defaults: "postgres"
    description: PostgreSQL database name.
  - id: db_user
    type: STRING
    defaults: "postgres"
    description: PostgreSQL administrative user.
  - id: min_activity_blocks
    type: INT
    defaults: 1000
    description: Minimum total index blocks accessed before evaluating hit ratio.
  - id: min_cache_hit_pct
    type: FLOAT
    defaults: 95.0
    description: Minimum acceptable index cache hit ratio percentage.

tasks:
  - id: query_index_cache_ratio
    type: io.kestra.plugin.jdbc.postgresql.Query
    url: "jdbc:postgresql://{{ inputs.db_host }}:{{ inputs.db_port }}/{{ inputs.db_name }}"
    username: "{{ inputs.db_user }}"
    password: "{{ secret('POSTGRES_PASSWORD') }}"
    sql: |
      SELECT 
          relname,
          idx_blks_read,
          idx_blks_hit,
          ROUND(100.0 * idx_blks_hit / NULLIF(idx_blks_hit + idx_blks_read, 0), 2) AS index_cache_hit_ratio
      FROM pg_statio_user_tables
      WHERE (idx_blks_hit + idx_blks_read) >= {{ inputs.min_activity_blocks }}
        AND ROUND(100.0 * idx_blks_hit / NULLIF(idx_blks_hit + idx_blks_read, 0), 2) < {{ inputs.min_cache_hit_pct }}
      ORDER BY index_cache_hit_ratio ASC
      LIMIT 10;
    fetchType: FETCH

  - id: evaluate_cache_efficiency
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.query_index_cache_ratio.rows | length > 0 }}"
    then:
      - id: notify_dba_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#dba-alerts",
            "attachments": [
              {
                "color": "warning",
                "title": "⚠️ PostgreSQL Index Cache Hit Ratio Degradation Alert",
                "text": "Detected *{{ outputs.query_index_cache_ratio.rows | length }}* table(s) with index cache hit ratio below *{{ inputs.min_cache_hit_pct }}%*. Degraded tables: {{ outputs.query_index_cache_ratio.rows }}. Impact: Severe disk read I/O bottlenecks and query latency spikes caused by index pages falling out of `shared_buffers`.",
                "footer": "Kestra Database Sentinel • Postgres Cache Ratio"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#dba-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ Postgres Index Cache Sentinel Execution Failure",
            "text": "The index cache ratio audit query failed. Please verify PostgreSQL database credentials and network reachability.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/30 * * * *"
    disabled: true

extend:
  title: PostgreSQL Index Cache Hit Ratio and Buffer Pool Efficiency Sentinel
  shortDescription: Audits PostgreSQL index I/O telemetry to detect degraded cache hit ratios and storage I/O read bottlenecks.
  description: |
    ## How it works
    This workflow uses the native Kestra PostgreSQL JDBC plugin to inspect `pg_statio_user_tables`. It calculates the index cache hit ratio (`100.0 * idx_blks_hit / (idx_blks_hit + idx_blks_read)`) across active application tables. When a table's ratio drops below the configured percentage (typically 95-99%), it indicates that index pages are continually being read from physical disk rather than cached in `shared_buffers` or the OS page cache. A Slack notification is immediately dispatched to the database team.

    ## What you get
    - Actionable visibility into RAM sizing and `shared_buffers` configuration.
    - Pinpoints specific tables causing high disk read IOPS.
    - Prevents sudden query performance degradation during peak traffic hours.

    ## Who it's for
    - Database Administrators (DBAs) and SREs optimizing PostgreSQL query performance.
    - Infrastructure teams sizing cloud database instances (AWS RDS, Aurora, Google Cloud SQL).

    ## Why orchestrate this with Kestra
    - **Zero Agent Requirement**: Connects directly via standard JDBC without deploying proprietary monitoring agents.
    - **Scheduled Auditing**: Perform periodic buffer pool telemetry snapshots automatically.
    - **Customizable Thresholds**: Fine-tune minimum activity blocks and cache hit percentage per environment.

    ## Prerequisites
    - PostgreSQL database with read access to `pg_statio_user_tables`.
    - Secrets `POSTGRES_PASSWORD` and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import this blueprint into Kestra.
    2. Configure the database host, user, and `POSTGRES_PASSWORD` secret.
    3. Run the flow to evaluate index cache efficiency across your tables.

    ## How to extend
    - Add a step to cross-reference table cache hit ratios (`heap_blks_hit` vs `heap_blks_read`).
    - Generate an index defragmentation (`REINDEX CONCURRENTLY`) recommendation workflow.

    ## Links
    - [PostgreSQL Viewing Statistics](https://www.postgresql.org/docs/current/monitoring-stats.html#PG-STATIO-ALL-TABLES-VIEW)
    - [Kestra PostgreSQL Plugin](https://kestra.io/plugins/plugin-jdbc-postgres)
  tags:
    - Data
    - Infrastructure
  ee: false
  demo: false
