id: nomad-job-allocation-client-drain-sentinel
namespace: company.infra

inputs:
  - id: nomad_addr
    type: STRING
    defaults: "http://nomad.internal:4646"
    description: Host and port of the HashiCorp Nomad server API.
  - id: target_namespace
    type: STRING
    defaults: "default"
    description: Nomad namespace to audit.

tasks:
  - id: inspect_nomad_allocations
    type: io.kestra.plugin.scripts.shell.Commands
    commands:
      - |
        # Query Nomad REST API for allocations in target namespace
        curl -s -H "X-Nomad-Token: {{ secret('NOMAD_TOKEN') }}" \
          "{{ inputs.nomad_addr }}/v1/allocations?namespace={{ inputs.target_namespace }}" > /tmp/nomad_allocs.json

        python3 -c "
        import json
        try:
            with open('/tmp/nomad_allocs.json') as f:
                allocs = json.load(f)
            failed = []
            for alloc in allocs:
                status = alloc.get('ClientStatus', '')
                desired = alloc.get('DesiredStatus', '')
                job_id = alloc.get('JobID', '')
                if status == 'failed' or (status == 'lost' and desired == 'run'):
                    failed.append(job_id)
            is_breach = 1 if len(failed) > 0 else 0
            print(f'{is_breach}|{len(failed)}|{\", \".join(failed[:5])}')
        except Exception:
            print('0|0|')
        " > /tmp/nomad_summary.txt

        IS_BREACH=$(cut -d '|' -f 1 /tmp/nomad_summary.txt)
        FAILED_COUNT=$(cut -d '|' -f 2 /tmp/nomad_summary.txt)
        FAILED_SAMPLES=$(cut -d '|' -f 3 /tmp/nomad_summary.txt)
        
        echo "::set-output name=is_breach::${IS_BREACH:-0}::"
        echo "::set-output name=failed_count::${FAILED_COUNT:-0}::"
        echo "::set-output name=failed_samples::$FAILED_SAMPLES::"

  - id: evaluate_nomad_health
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.inspect_nomad_allocations.vars.is_breach | int == 1 }}"
    then:
      - id: notify_infra_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#infra-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 HashiCorp Nomad Allocation Failure Alert",
                "text": "Detected {{ outputs.inspect_nomad_allocations.vars.failed_count }} failed or lost task allocation(s) in Nomad namespace {{ inputs.target_namespace }}. Affected Job IDs: {{ outputs.inspect_nomad_allocations.vars.failed_samples }}.",
                "footer": "Kestra Workload Sentinel • HashiCorp Nomad"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#infra-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ HashiCorp Nomad Sentinel Failure",
            "text": "Failed to communicate with Nomad server at {{ inputs.nomad_addr }}.",
            "footer": "Kestra Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  ee: false
  demo: false
  title: HashiCorp Nomad Failed Allocation and Node Drain Sentinel
  shortDescription: Audits HashiCorp Nomad cluster jobs for failed task allocations and degraded node capacity.
  description: |
    ## How it works
    This workflow connects to the HashiCorp Nomad HTTP API (`/v1/allocations`) using an ACL management token to audit task allocations across target namespaces. In Nomad, jobs request compute, memory, and networking resources across client nodes. When Docker or exec drivers crash, host disks fill up, or nodes unexpectedly disconnect from the raft cluster, allocations transition into `failed` or `lost` client status. This sentinel audits active allocations, identifies failing jobs, and dispatches incident notifications with job IDs.

    ## What you get
    - Real-time detection of failed and lost task allocations in HashiCorp Nomad.
    - Identification of cluster node resource exhaustion and driver failures.
    - Automated Slack incident notifications with sample job names.

    ## Who it's for
    - Infrastructure engineers orchestrating container and microVM workloads on Nomad.
    - DevOps teams maintaining bare-metal and hybrid cloud compute clusters.
    - SREs responsible for HashiCorp stack reliability and workload scheduling.

    ## Why orchestrate this with Kestra
    - **Centralized Workload Telemetry**: Monitors Nomad services alongside Kubernetes and cloud native instances.
    - **Proactive Remediation**: Automatically triggers job restarts or scales client node pools.
    - **Enterprise Security**: Stores Nomad ACL tokens securely inside Kestra's encrypted vault.

    ## Prerequisites
    - Nomad server cluster with accessible HTTP API (`4646`).
    - Nomad ACL token configured in `NOMAD_TOKEN` secret.
    - Slack incoming webhook configured in `SLACK_WEBHOOK` secret.

    ## Quick start
    1. Import this blueprint into your Kestra instance.
    2. Configure `NOMAD_TOKEN` and `SLACK_WEBHOOK` secrets.
    3. Provide your Nomad address in `nomad_addr`.
    4. Enable the schedule trigger to activate automatic allocation monitoring.

    ## How to extend
    - Add a remediation task to trigger a job evaluation restart (`PUT /v1/job/{job}/evaluate`).
    - Query `/v1/nodes` to audit draining or ineligible client nodes.
    - Alert to Microsoft Teams or Opsgenie on production namespace allocation failures.

    ## Links
    - [HashiCorp Nomad HTTP API](https://developer.hashicorp.com/nomad/api-docs)
    - [Kestra Shell Plugin](https://kestra.io/plugins/plugin-scripts-shell)
    - [Kestra Slack Notifications](https://kestra.io/plugins/plugin-slack)
  tags:
    - Data
    - Infrastructure
