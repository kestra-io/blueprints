id: nomad-job-allocation-client-drain-sentinel
namespace: company.infra
inputs:
- id: nomad_addr
  type: STRING
  defaults: http://nomad.internal:4646
  description: Host and port of the HashiCorp Nomad server API.
- id: target_namespace
  type: STRING
  defaults: default
  description: Nomad namespace to audit.
tasks:
- id: inspect_nomad_allocations
  type: io.kestra.plugin.scripts.python.Script
  containerImage: python:3.11-slim
  taskRunner:
    type: io.kestra.plugin.scripts.runner.docker.Docker
  beforeCommands:
  - pip install requests kestra
  env:
    NOMAD_ADDR: '{{ inputs.nomad_addr }}'
    TARGET_NAMESPACE: '{{ inputs.target_namespace }}'
    NOMAD_TOKEN: '{{ secret(''NOMAD_TOKEN'') }}'
  script: "import os\nimport sys\nimport requests\nfrom kestra import Kestra\n\nnomad_addr\
    \ = os.environ.get(\"NOMAD_ADDR\", \"http://nomad.internal:4646\").rstrip(\"/\"\
    )\nnamespace = os.environ.get(\"TARGET_NAMESPACE\", \"default\")\ntoken = os.environ.get(\"\
    NOMAD_TOKEN\", \"\")\n\nheaders = {\"X-Nomad-Token\": token} if token else {}\n\
    url = f\"{nomad_addr}/v1/allocations?namespace={namespace}\"\n\ntry:\n    resp\
    \ = requests.get(url, headers=headers, timeout=10)\n    resp.raise_for_status()\n\
    \    allocs = resp.json()\nexcept Exception as err:\n    sys.stderr.write(f\"\
    Failed to query Nomad allocations from {url}: {err}\\n\")\n    sys.exit(1)\n\n\
    failed = []\nfor alloc in allocs:\n    status = alloc.get(\"ClientStatus\", \"\
    \")\n    desired = alloc.get(\"DesiredStatus\", \"\")\n    job_id = alloc.get(\"\
    JobID\", \"\")\n    if status == \"failed\" or (status == \"lost\" and desired\
    \ == \"run\"):\n        failed.append(job_id)\n\nfailed_count = len(failed)\n\
    is_breach = failed_count > 0\nfailed_samples = \", \".join(failed[:5])\n\nKestra.outputs({\n\
    \    \"is_breach\": is_breach,\n    \"failed_count\": failed_count,\n    \"failed_samples\"\
    : failed_samples\n})\n"
- id: evaluate_nomad_health
  type: io.kestra.plugin.core.flow.If
  condition: '{{ outputs.inspect_nomad_allocations.vars.is_breach }}'
  then:
  - id: notify_infra_team
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: '{{ secret(''SLACK_WEBHOOK'') }}'
    payload: "{\n  \"channel\": \"#infra-alerts\",\n  \"attachments\": [\n    {\n\
      \      \"color\": \"danger\",\n      \"title\": \"\U0001F6A8 HashiCorp Nomad\
      \ Allocation Failure Alert\",\n      \"text\": \"Detected {{ outputs.inspect_nomad_allocations.vars.failed_count\
      \ }} failed or lost task allocation(s) in Nomad namespace {{ inputs.target_namespace\
      \ }}. Affected Job IDs: {{ outputs.inspect_nomad_allocations.vars.failed_samples\
      \ }}.\",\n      \"footer\": \"Kestra Workload Sentinel \u2022 HashiCorp Nomad\"\
      \n    }\n  ]\n}"
errors:
- id: alert_pipeline_failure
  type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
  url: '{{ secret(''SLACK_WEBHOOK'') }}'
  payload: "{\n  \"channel\": \"#infra-alerts\",\n  \"attachments\": [\n    {\n  \
    \    \"color\": \"danger\",\n      \"title\": \"\u26A0\uFE0F HashiCorp Nomad Sentinel\
    \ Failure\",\n      \"text\": \"Failed to communicate with Nomad server at {{\
    \ inputs.nomad_addr }}.\",\n      \"footer\": \"Kestra Failure Sentinel\"\n  \
    \  }\n  ]\n}\n"
triggers:
- id: periodic_schedule
  type: io.kestra.plugin.core.trigger.Schedule
  cron: '*/15 * * * *'
  disabled: true
extend:
  metaDescription: Audits HashiCorp Nomad cluster jobs for failed task allocations
    and degraded node capacity.
  metaTitle: HashiCorp Nomad Failed Allocation and Node Drain Sentinel with Kestra
  ee: false
  demo: false
  title: HashiCorp Nomad Failed Allocation and Node Drain Sentinel
  shortDescription: Audits HashiCorp Nomad cluster jobs for failed task allocations
    and degraded node capacity.
  description: '## How it works

    This workflow connects to the HashiCorp Nomad HTTP API (`/v1/allocations`) using
    an ACL management token to audit task allocations across target namespaces. In
    Nomad, jobs request compute, memory, and networking resources across client nodes.
    When Docker or exec drivers crash, host disks fill up, or nodes unexpectedly disconnect
    from the raft cluster, allocations transition into `failed` or `lost` client status.
    This sentinel audits active allocations, identifies failing jobs, and dispatches
    incident notifications with job IDs.


    ## What you get

    - Real-time detection of failed and lost task allocations in HashiCorp Nomad.

    - Identification of cluster node resource exhaustion and driver failures.

    - Automated Slack incident notifications with sample job names.


    ## Who it''s for

    - Infrastructure engineers orchestrating container and microVM workloads on Nomad.

    - DevOps teams maintaining bare-metal and hybrid cloud compute clusters.

    - SREs responsible for HashiCorp stack reliability and workload scheduling.


    ## Why orchestrate this with Kestra

    - **Centralized Workload Telemetry**: Monitors Nomad services alongside Kubernetes
    and cloud native instances.

    - **Proactive Remediation**: Automatically triggers job restarts or scales client
    node pools.

    - **Enterprise Security**: Stores Nomad ACL tokens securely inside Kestra''s encrypted
    vault.


    ## Prerequisites

    - Nomad server cluster with accessible HTTP API (`4646`).

    - Nomad ACL token configured in `NOMAD_TOKEN` secret.

    - Slack incoming webhook configured in `SLACK_WEBHOOK` secret.


    ## Quick start

    1. Import this blueprint into your Kestra instance.

    2. Configure `NOMAD_TOKEN` and `SLACK_WEBHOOK` secrets.

    3. Provide your Nomad address in `nomad_addr`.

    4. Enable the schedule trigger to activate automatic allocation monitoring.


    ## How to extend

    - Add a remediation task to trigger a job evaluation restart (`PUT /v1/job/{job}/evaluate`).

    - Query `/v1/nodes` to audit draining or ineligible client nodes.

    - Alert to Microsoft Teams or Opsgenie on production namespace allocation failures.


    ## Links

    - [HashiCorp Nomad HTTP API](https://developer.hashicorp.com/nomad/api-docs)

    - [Kestra Shell Plugin](https://kestra.io/plugins/plugin-scripts-shell)

    - [Kestra Slack Notifications](https://kestra.io/plugins/plugin-slack)

    '
  tags:
  - Data
  - Infrastructure
  subTags:
  - ELT & Data Landing
  - Day 2 Operations
outputs:
- id: is_breach
  type: BOOLEAN
  value: '{{ outputs.inspect_nomad_allocations.vars.is_breach }}'
- id: failed_count
  type: INT
  value: '{{ outputs.inspect_nomad_allocations.vars.failed_count }}'
- id: failed_samples
  type: STRING
  value: '{{ outputs.inspect_nomad_allocations.vars.failed_samples }}'
