id: otel-collector-pipeline-integrity-gate
namespace: company.observability
description: |
  Audit an OpenTelemetry Collector YAML configuration before deployment. The flow inventories receivers,
  processors, exporters, connectors and extensions, verifies that service pipelines only reference defined
  components, and checks whether TLS options disable peer verification. It catches a common class of
  telemetry incidents where a pipeline references a component removed or renamed during configuration
  changes. It validates internal configuration structure and does not replace the collector's own version-
  specific binary validator.

inputs:
  - id: config_url
    type: STRING
    displayName: Collector configuration URL
    defaults: https://raw.githubusercontent.com/open-telemetry/opentelemetry-demo/main/src/otel-collector/otelcol-config.yml
    description: Public URL to the standalone OpenTelemetry Collector YAML configuration.
  - id: minimum_pipeline_count
    type: INT
    displayName: Minimum pipeline count
    defaults: 1
    description: Minimum number of service pipelines required.
  - id: require_receivers_and_exporters
    type: BOOL
    displayName: Require receivers and exporters
    defaults: true
    description: Block pipelines with an empty receiver or exporter list.
  - id: block_insecure_tls
    type: BOOL
    displayName: Block insecure TLS options
    defaults: false
    description: Block if tls.insecure or tls.insecure_skip_verify is true. By default these settings are warnings.
  - id: archive_report
    type: BOOL
    displayName: Archive report to S3
    defaults: false
    description: Store the JSON report in S3. AWS secrets are needed only when enabled.
  - id: evidence_bucket
    type: STRING
    displayName: Evidence bucket
    defaults: my-observability-evidence
    description: Existing S3 bucket for optional report archival.
  - id: evidence_prefix
    type: STRING
    displayName: Evidence prefix
    defaults: otel-collector-config-audits
    description: Prefix for Collector configuration reports.
  - id: aws_region
    type: STRING
    displayName: AWS region
    defaults: eu-west-1
    description: Region containing the evidence bucket.

triggers:
  - id: weekly_collector_config_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: Recheck collector pipeline wiring weekly. Enable after reviewing the source URL and initial findings.
    cron: "0 8 * * 1"
    disabled: true

tasks:
  - id: validate_request
    type: io.kestra.plugin.scripts.python.Script
    description: Validate the public HTTPS URL and pipeline threshold before fetching the configuration.
    containerImage: python:3.12-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    env:
      CONFIG_URL: "{{ inputs.config_url }}"
      MINIMUM_PIPELINES: "{{ inputs.minimum_pipeline_count }}"
    script: |
      import os
      from urllib.parse import urlsplit

      url = os.environ.get("CONFIG_URL", "").strip()
      try:
          minimum = int(os.environ.get("MINIMUM_PIPELINES", "1"))
      except ValueError as exc:
          raise ValueError("minimum_pipeline_count must be an integer") from exc
      parsed = urlsplit(url)
      if parsed.scheme.lower() != "https" or not parsed.hostname:
          raise ValueError("config_url must be an absolute HTTPS URL")
      if parsed.username or parsed.password:
          raise ValueError("config_url must not contain embedded credentials")
      if minimum < 1:
          raise ValueError("minimum_pipeline_count must be at least 1")
      print(f"Validated collector URL; minimum_pipeline_count={minimum}")

  - id: fetch_collector_config
    type: io.kestra.plugin.core.http.Request
    description: Fetch the actual public Collector YAML to audit rather than using a hard-coded sample.
    uri: "{{ inputs.config_url }}"
    method: GET
    headers:
      Accept: application/yaml, text/yaml, text/plain, */*
      User-Agent: Kestra-OTel-Collector-Pipeline-Integrity-Gate/1.0
    timeout: PT45S

  - id: audit_pipeline_integrity
    type: io.kestra.plugin.scripts.python.Script
    description: Parse component maps, validate pipeline references, check extension declarations and report TLS verification bypass settings.
    containerImage: python:3.12-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install pyyaml kestra
    inputFiles:
      collector-config.yaml: "{{ outputs.fetch_collector_config.body }}"
    env:
      CONFIG_URL: "{{ inputs.config_url }}"
      MINIMUM_PIPELINES: "{{ inputs.minimum_pipeline_count }}"
      REQUIRE_RECEIVERS_EXPORTERS: "{{ inputs.require_receivers_and_exporters }}"
      BLOCK_INSECURE_TLS: "{{ inputs.block_insecure_tls }}"
    outputFiles:
      - otel-collector-config-audit.json
    script: |
      import json
      import os
      from datetime import datetime, timezone

      import yaml
      from kestra import Kestra

      config_url = os.environ["CONFIG_URL"].strip()
      minimum_pipelines = int(os.environ.get("MINIMUM_PIPELINES", "1"))
      require_receivers_exporters = os.environ.get("REQUIRE_RECEIVERS_EXPORTERS", "true").lower() == "true"
      block_insecure_tls = os.environ.get("BLOCK_INSECURE_TLS", "false").lower() == "true"

      with open("collector-config.yaml", encoding="utf-8") as source:
          raw_config = source.read()
      try:
          config = yaml.safe_load(raw_config)
      except yaml.YAMLError as exc:
          raise ValueError(f"Collector config is not valid YAML: {exc}") from exc
      if not isinstance(config, dict):
          raise ValueError("Collector config must be a YAML mapping")

      findings = []
      def add(code, severity, message, location=None, component=None):
          findings.append({
              "code": code,
              "severity": severity,
              "message": message,
              "location": location,
              "component": component,
          })

      sections = {
          "receivers": config.get("receivers") or {},
          "processors": config.get("processors") or {},
          "exporters": config.get("exporters") or {},
          "connectors": config.get("connectors") or {},
          "extensions": config.get("extensions") or {},
      }
      for section_name, entries in sections.items():
          if not isinstance(entries, dict):
              add("COMPONENT_SECTION_INVALID", "BLOCK", f"Top-level {section_name} section must be a mapping.", section_name)
              sections[section_name] = {}

      service = config.get("service") or {}
      if not isinstance(service, dict):
          raise ValueError("Collector service section must be a YAML mapping")
      pipelines = service.get("pipelines") or {}
      if not isinstance(pipelines, dict):
          add("PIPELINES_SECTION_INVALID", "BLOCK", "service.pipelines must be a mapping.", "service.pipelines")
          pipelines = {}
      if len(pipelines) < minimum_pipelines:
          add("PIPELINE_COUNT_BELOW_MINIMUM", "BLOCK", f"Found {len(pipelines)} pipeline(s), below minimum {minimum_pipelines}.", "service.pipelines")

      reference_counts = {"receivers": 0, "processors": 0, "exporters": 0, "extensions": 0}
      missing_references = []
      for pipeline_name, pipeline in pipelines.items():
          location = f"service.pipelines.{pipeline_name}"
          if not isinstance(pipeline, dict):
              add("PIPELINE_ENTRY_INVALID", "BLOCK", "Pipeline configuration must be a mapping.", location)
              continue
          for role, section in (("receivers", "receivers"), ("processors", "processors"), ("exporters", "exporters")):
              refs = pipeline.get(role) or []
              if not isinstance(refs, list):
                  add("PIPELINE_REFERENCE_LIST_INVALID", "BLOCK", f"{role} must be a list.", f"{location}.{role}")
                  continue
              if require_receivers_exporters and role in {"receivers", "exporters"} and not refs:
                  add("PIPELINE_ROLE_EMPTY", "BLOCK", f"Pipeline {pipeline_name!r} has no {role}.", f"{location}.{role}")
              valid_names = set(sections[section])
              if role in {"receivers", "exporters"}:
                  valid_names |= set(sections["connectors"])
              for ref in refs:
                  if not isinstance(ref, str) or not ref.strip():
                      add("PIPELINE_COMPONENT_REFERENCE_INVALID", "BLOCK", f"{role} contains an empty or non-string component reference.", f"{location}.{role}")
                      continue
                  reference_counts[role] += 1
                  if ref not in valid_names:
                      missing_references.append({"pipeline": pipeline_name, "role": role, "reference": ref})
                      add("PIPELINE_COMPONENT_UNDEFINED", "BLOCK", f"Pipeline {pipeline_name!r} references undefined {role[:-1]} {ref!r}.", f"{location}.{role}", ref)

      service_extensions = service.get("extensions") or []
      if not isinstance(service_extensions, list):
          add("SERVICE_EXTENSIONS_INVALID", "BLOCK", "service.extensions must be a list.", "service.extensions")
          service_extensions = []
      for extension in service_extensions:
          if not isinstance(extension, str) or extension not in sections["extensions"]:
              add("SERVICE_EXTENSION_UNDEFINED", "BLOCK", f"service.extensions references undefined extension {extension!r}.", "service.extensions", str(extension))
          else:
              reference_counts["extensions"] += 1

      insecure_tls = []
      def scan_tls(value, location):
          if isinstance(value, dict):
              tls = value.get("tls")
              if isinstance(tls, dict):
                  for option in ("insecure", "insecure_skip_verify"):
                      if tls.get(option) is True:
                          insecure_tls.append({"location": location + ".tls." + option, "option": option})
              for key, child in value.items():
                  scan_tls(child, f"{location}.{key}")
          elif isinstance(value, list):
              for index, child in enumerate(value):
                  scan_tls(child, f"{location}[{index}]")

      for section_name, entries in sections.items():
          scan_tls(entries, section_name)
      for setting in insecure_tls:
          severity = "BLOCK" if block_insecure_tls else "WARN"
          add("TLS_VERIFICATION_BYPASSED", severity, f"TLS setting {setting['option']} is true; peer verification may be weakened.", setting["location"])

      blocking = [finding for finding in findings if finding["severity"] == "BLOCK"]
      warnings = [finding for finding in findings if finding["severity"] == "WARN"]
      verdict = "FAIL" if blocking else ("PASS_WITH_WARNINGS" if warnings else "PASS")
      component_counts = {name: len(entries) for name, entries in sections.items()}
      report = {
          "schemaVersion": 1,
          "checkedAt": datetime.now(timezone.utc).isoformat(),
          "configUrl": config_url,
          "fileFormat": config.get("file_format"),
          "logLevel": config.get("log_level"),
          "componentCounts": component_counts,
          "pipelineCount": len(pipelines),
          "pipelineNames": list(pipelines),
          "referenceCounts": reference_counts,
          "missingReferences": missing_references,
          "insecureTlsSettings": insecure_tls,
          "findings": findings,
          "blockingFindingCount": len(blocking),
          "warningCount": len(warnings),
          "verdict": verdict,
          "scopeNote": "This validates component references and selected TLS options. It is not a substitute for running the exact Collector distribution and version against this configuration.",
      }
      with open("otel-collector-config-audit.json", "w", encoding="utf-8") as target:
          json.dump(report, target, indent=2, ensure_ascii=False)

      print(f"OpenTelemetry Collector config audit: verdict={verdict}; pipelines={len(pipelines)}, components={component_counts}, missing_references={len(missing_references)}, insecure_tls={len(insecure_tls)}, blocking={len(blocking)}")
      print(json.dumps({"missingReferences": missing_references, "insecureTlsSettings": insecure_tls}, indent=2))
      Kestra.outputs({
          "config_url": config_url,
          "file_format": str(config.get("file_format") or ""),
          "component_counts": component_counts,
          "pipeline_count": len(pipelines),
          "pipeline_names": list(pipelines),
          "reference_counts": reference_counts,
          "missing_reference_count": len(missing_references),
          "insecure_tls_count": len(insecure_tls),
          "blocking_finding_count": len(blocking),
          "warning_count": len(warnings),
          "findings": findings,
          "verdict": verdict,
      })

  - id: optionally_archive_report
    type: io.kestra.plugin.core.flow.If
    description: Optionally archive the Collector configuration audit report in S3.
    condition: "{{ inputs.archive_report }}"
    then:
      - id: upload_collector_audit
        type: io.kestra.plugin.aws.s3.Upload
        description: Store the pipeline audit report without copying raw deployment secrets.
        accessKeyId: "{{ secret('AWS_ACCESS_KEY_ID') }}"
        secretKeyId: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
        region: "{{ inputs.aws_region }}"
        bucket: "{{ inputs.evidence_bucket }}"
        from: "{{ outputs.audit_pipeline_integrity.outputFiles['otel-collector-config-audit.json'] }}"
        key: "{{ inputs.evidence_prefix }}/otel-collector-config-audit.json"

  - id: enforce_pipeline_integrity
    type: io.kestra.plugin.core.flow.If
    description: Fail closed if a service pipeline references an undefined component or selected TLS policy is violated.
    condition: "{{ outputs.audit_pipeline_integrity.vars.verdict == 'FAIL' }}"
    then:
      - id: alert_collector_config_failure
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Notify observability owners about undefined pipeline references or TLS verification bypasses.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |-
          {{
            {
              "text": ":rotating_light: OpenTelemetry Collector configuration gate BLOCKED\\nConfig: " ~ outputs.audit_pipeline_integrity.vars.config_url ~
                "\\nFindings: " ~ (outputs.audit_pipeline_integrity.vars.findings | toJson) ~
                "\\nExecution: " ~ execution.id ~
                "\\nReview otel-collector-config-audit.json for details."
            } | toJson
          }}
      - id: fail_collector_config
        type: io.kestra.plugin.core.execution.Fail
        description: Stop deployment when component references or TLS policy violate requirements.
        errorMessage: "OpenTelemetry Collector configuration failed policy checks for {{ outputs.audit_pipeline_integrity.vars.config_url }}."
    else:
      - id: log_collector_verdict
        type: io.kestra.plugin.core.log.Log
        level: INFO
        message: "OpenTelemetry Collector audit {{ outputs.audit_pipeline_integrity.vars.verdict }}: pipelines={{ outputs.audit_pipeline_integrity.vars.pipeline_count }}, unresolved references={{ outputs.audit_pipeline_integrity.vars.missing_reference_count }}."

errors:
  - id: alert_collector_audit_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alert if the config cannot be fetched or parsed so an incomplete audit is not mistaken for a pass.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |-
      {{
        {
          "text": ":warning: OpenTelemetry Collector config audit execution failed\\nConfig: " ~ inputs.config_url ~
            "\\nExecution: " ~ execution.id ~
            "\\nInspect Kestra logs; fetch or parsing failures must not be interpreted as PASS."
        } | toJson
      }}

outputs:
  - id: collector_integrity_audit
    type: JSON
    description: Machine-readable component inventory, pipeline names, undefined references and TLS policy findings.
    value: "{{ outputs.audit_pipeline_integrity.vars | toJson }}"

extend:
  title: OpenTelemetry Collector Pipeline Integrity Gate
  metaTitle: OpenTelemetry Collector Pipeline Integrity Gate | Kestra
  shortDescription: Validate Collector receiver, processor, exporter, connector and extension references in service pipelines and report TLS settings that disable verification.
  metaDescription: Audit OpenTelemetry Collector YAML for undefined pipeline components, empty signal paths and TLS verification bypass settings before deployment.
  description: |
    Validate an OpenTelemetry Collector YAML configuration before deploying it. The workflow parses the selected file, inventories receivers, processors, exporters, connectors and extensions, checks that every service pipeline reference resolves, and reports TLS settings that turn off certificate verification. It creates a machine-readable report, supports optional S3 evidence retention, and blocks when component wiring or selected TLS policy requirements fail.

    ## How it works

    1. Validate the public config URL and minimum pipeline threshold.
    2. Fetch the actual Collector YAML document from the configured source.
    3. Parse component sections and inspect each service pipeline, validating receiver, processor and exporter references.
    4. Validate service extension references and locate TLS settings that disable peer verification.
    5. Optionally archive the report to S3 and block downstream deployment when unresolved references or selected TLS policy violations exist.

    ## What you get

    - A component inventory and list of service pipelines.
    - Detection of undefined pipeline component references and empty receiver/exporter lists.
    - Detection of service extensions referenced but not declared.
    - Warnings for TLS verification bypasses, with an optional fail-closed policy.
    - Optional S3 evidence and a blocking deployment gate.

    ## Who it's for

    - Observability platform engineers maintaining OpenTelemetry Collector configurations.
    - Platform teams debugging collectors that start but fail to export telemetry.
    - Reliability engineers reviewing config changes before deploying gateways and agents.

    ## Why orchestrate this with Kestra

    Kestra captures the source URL, policy result and report as part of a reproducible run, enabling scheduled drift checks and a blocking deployment step without requiring secrets in the audit process.

    ## Prerequisites

    - A Kestra 2.x worker with Docker enabled for the Python Script task runner.
    - Network access to the public Collector config URL.
    - A Slack incoming webhook for alerts; S3 archival is optional.

    ### Secrets

    - SLACK_WEBHOOK_URL: Slack incoming webhook for blocking pipeline findings and execution failures.
    - AWS_ACCESS_KEY_ID: optional AWS access key used only when report archival is enabled.
    - AWS_SECRET_ACCESS_KEY: optional AWS secret key used only when report archival is enabled.

    ## Quick start

    1. Import the flow with the OpenTelemetry Demo Collector base config URL.
    2. Execute once and inspect otel-collector-config-audit.json and the collector_integrity_audit output.
    3. Review component names and missing reference findings before deployment.
    4. Set block_insecure_tls to true only when the deployment requires every component TLS configuration to keep peer verification enabled.
    5. Configure Slack and optional S3, then enable weekly_collector_config_audit after reviewing the initial report.

    ## How to extend

    - Validate the config with the exact Collector distribution's own validate command.
    - Add allowlists for expected internal collector and exporter endpoints.
    - Compare component names and versions against a deployed Collector image digest.
    - Add pipeline-specific policies for required batch and memory-limiter processors.

    ## Links

    - [OpenTelemetry Collector configuration](https://opentelemetry.io/docs/collector/configuration/)
    - [OpenTelemetry Collector components](https://opentelemetry.io/docs/collector/components/)
    - [OpenTelemetry Demo Collector config](https://github.com/open-telemetry/opentelemetry-demo/blob/main/src/otel-collector/otelcol-config.yml)
    - [Kestra HTTP Request plugin](https://kestra.io/plugins/plugin-core/http/io.kestra.plugin.core.http.request)
    - [Kestra Python Script plugin](https://kestra.io/plugins/plugin-scripts/python)
    - [Kestra Slack plugin](https://kestra.io/plugins/plugin-slack/slackincomingwebhook)
    - [Kestra AWS S3 plugin](https://kestra.io/plugins/plugin-aws/s3)
  tags:
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - Infrastructure Automation
  ee: false
  demo: false
