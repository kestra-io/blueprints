id: postgres-dead-tuples-autovacuum-lag-sentinel
namespace: company.database
description: Audits PostgreSQL user tables for excessive dead tuples and autovacuum lag to prevent table bloat and sequential scan stalls.

inputs:
  - id: db_host
    type: STRING
    defaults: "postgres.internal"
    description: Hostname of PostgreSQL database.
  - id: db_port
    type: INT
    defaults: 5432
    description: PostgreSQL port.
  - id: db_name
    type: STRING
    defaults: "postgres"
    description: Database name.
  - id: db_user
    type: STRING
    defaults: "postgres"
    description: Database user.

tasks:
  - id: query_dead_tuples
    type: io.kestra.plugin.jdbc.postgresql.Query
    url: "jdbc:postgresql://{{ inputs.db_host }}:{{ inputs.db_port }}/{{ inputs.db_name }}"
    username: "{{ inputs.db_user }}"
    password: "{{ secret('POSTGRES_PASSWORD') }}"
    sql: |
      SELECT 
        schemaname || '.' || relname AS table_name,
        n_dead_tup AS dead_tuples,
        n_live_tup AS live_tuples,
        ROUND(100.0 * n_dead_tup / GREATEST(n_live_tup + n_dead_tup, 1), 2) AS dead_ratio
      FROM pg_stat_user_tables
      WHERE n_dead_tup > 50000 AND (100.0 * n_dead_tup / GREATEST(n_live_tup + n_dead_tup, 1)) > 30.0
      ORDER BY n_dead_tup DESC
      LIMIT 1;
    fetchType: FETCH_ONE

  - id: evaluate_bloat
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.query_dead_tuples.row is defined and outputs.query_dead_tuples.row != null and outputs.query_dead_tuples.row.table_name is defined }}"
    then:
      - id: notify_dba_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#dba-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 PostgreSQL Table Bloat & Dead Tuples Alert",
                "text": "Table `{{ outputs.query_dead_tuples.row.table_name }}` has accumulated *{{ outputs.query_dead_tuples.row.dead_tuples }} dead tuples* ({{ outputs.query_dead_tuples.row.dead_ratio }}% dead tuple ratio)! Autovacuum is starving or blocked by long-running transactions, causing severe index and table bloat.",
                "footer": "Kestra Database Sentinel • PostgreSQL"
              }
            ]
          }

outputs:
  - id: bloated_table
    type: STRING
    value: "{{ outputs.query_dead_tuples.row ? outputs.query_dead_tuples.row.table_name : '' }}"
  - id: dead_tuples
    type: INT
    value: "{{ outputs.query_dead_tuples.row ? outputs.query_dead_tuples.row.dead_tuples : 0 }}"
  - id: dead_ratio
    type: FLOAT
    value: "{{ outputs.query_dead_tuples.row ? outputs.query_dead_tuples.row.dead_ratio : 0.0 }}"

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#dba-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ PostgreSQL Dead Tuples Sentinel Failure",
            "text": "Failed to query pg_stat_user_tables. Verify database credentials and network reachability.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 * * * *"
    disabled: true

extend:
  metaDescription: Audits PostgreSQL user tables for excessive dead tuples and autovacuum lag to prevent table bloat and sequential scan stalls.
  metaTitle: PostgreSQL Dead Tuples Accumulation and Autovacuum Starvation Sentinel with Kestra
  title: PostgreSQL Dead Tuples Accumulation and Autovacuum Starvation Sentinel
  shortDescription: Audits PostgreSQL user tables for excessive dead tuples and autovacuum lag to prevent table bloat and sequential scan stalls.
  description: |
    ## How it works
    This workflow connects directly to PostgreSQL via the JDBC PostgreSQL plugin to query `pg_stat_user_tables` for tables with high dead tuple counts (`n_dead_tup > 50000`) and dead tuple ratios exceeding 30%. In PostgreSQL's MVCC model, UPDATE and DELETE operations leave old row versions (dead tuples) in the data pages until autovacuum reclaims them. If autovacuum workers are starved, throttled by `autovacuum_vacuum_cost_limit`, or blocked by orphaned transactions, dead tuples accumulate, causing disk storage bloat and forcing sequential scans to read millions of dead pages. This workflow detects dead tuple bloat and alerts DBAs.

    ## What you get
    - Real-time detection of table bloat and autovacuum starvation in PostgreSQL.
    - Prevents query performance degradation caused by dead page scanning.
    - Actionable identification of the most bloated table and dead tuple ratios.

    ## Who it's for
    - PostgreSQL Database Administrators and Data Platform Engineers.
    - Backend Architects managing high-churn transactional databases.

    ## Why orchestrate this with Kestra
    - **Native JDBC Automation**: Direct SQL querying without wrapper scripts.
    - **Continuous Health Auditing**: Regularly checks table bloat on an hourly schedule.
    - **Targeted Notification**: Delivers actionable alerts directly to DBA Slack channels.

    ## Prerequisites
    - PostgreSQL database with read permissions on `pg_stat_user_tables`.
    - Secrets `POSTGRES_PASSWORD` and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import the blueprint.
    2. Input PostgreSQL host, database, and user.
    3. Run the workflow to inspect table dead tuple bloat.

    ## Links
    - [PostgreSQL Autovacuum Documentation](https://www.postgresql.org/docs/current/routine-vacuuming.html#AUTOVACUUM)
    - [Kestra Documentation](https://kestra.io/docs)
  tags:
    - Data
    - Infrastructure
  subTags:
    - ELT & Data Landing
    - Day 2 Operations
  ee: false
  demo: false
