id: ratify-supply-chain-attestation-verification-guardrail
namespace: company.security

description: |
  Audits CNCF Ratify verification engine metrics to detect unverified OCI container image signatures, missing SBOM attestations, and supply chain admission failures.

concurrency:
  limit: 1

inputs:
  - id: ratify_metrics_endpoint
    type: STRING
    displayName: "Ratify Metrics Endpoint"
    defaults: "http://ratify.ratify-service.svc.cluster.local:8888/metrics"
    description: "HTTP endpoint exposing Prometheus telemetry from the CNCF Ratify supply chain verification service."

  - id: max_allowable_verification_failures
    type: INT
    displayName: "Max Allowable Verification Failures"
    defaults: 0
    description: "Maximum allowable artifact signature or attestation verification failures before triggering an urgent security incident alert."

  - id: max_allowable_untrusted_artifacts
    type: INT
    displayName: "Max Allowable Untrusted Artifacts"
    defaults: 0
    description: "Maximum allowable untrusted or unsigned OCI container artifacts detected during admission evaluation."

  - id: lookback_minutes
    type: INT
    displayName: "Lookback Window (Minutes)"
    defaults: 15
    description: "Time window in minutes over which supply chain verification failure velocity is evaluated."

tasks:
  - id: fetch_ratify_telemetry
    type: io.kestra.plugin.core.http.Request
    description: "Queries the Ratify Prometheus metrics endpoint on Kubernetes to retrieve verification telemetry."
    uri: "{{ inputs.ratify_metrics_endpoint }}"
    method: GET
    headers:
      Accept: "text/plain"
      User-Agent: "Kestra-Ratify-Guardrail/1.0"
    timeout: PT15S

  - id: evaluate_supply_chain_posture
    type: io.kestra.plugin.scripts.python.Script
    description: "Parses signature and attestation verification metrics and classifies compliance posture."
    warningOnStdErr: false
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    env:
      RAW_TELEMETRY: "{{ outputs.fetch_ratify_telemetry.body }}"
      MAX_FAILURES: "{{ inputs.max_allowable_verification_failures }}"
      MAX_UNTRUSTED: "{{ inputs.max_allowable_untrusted_artifacts }}"
      LOOKBACK: "{{ inputs.lookback_minutes }}"
    script: |
      import os
      import sys
      import json
      import datetime

      raw_content = os.environ.get("RAW_TELEMETRY", "").strip()
      max_failures = int(os.environ.get("MAX_FAILURES", "0"))
      max_untrusted = int(os.environ.get("MAX_UNTRUSTED", "0"))
      lookback = int(os.environ.get("LOOKBACK", "15"))

      if not raw_content:
          print("CRITICAL: Received empty metrics payload from Ratify endpoint.", file=sys.stderr)
          sys.exit(1)

      verification_requests = 0
      verification_failures = 0
      untrusted_artifacts = 0
      peak_verification_latency_ms = 0.0
      parsed_metrics = 0

      for line in raw_content.splitlines():
          line = line.strip()
          if not line or line.startswith("#"):
              continue

          parts = line.split()
          if len(parts) != 2:
              continue

          metric_name, metric_value = parts[0], parts[1]
          try:
              val = float(metric_value)
              parsed_metrics += 1
          except ValueError:
              continue

          if "ratify_verification_requests_total" in metric_name or "ratify_verify_count_total" in metric_name:
              verification_requests += int(val)
          elif "ratify_verification_failures_total" in metric_name or "ratify_verify_failure_total" in metric_name:
              verification_failures += int(val)
          elif "ratify_untrusted_artifacts_count" in metric_name or "ratify_untrusted_total" in metric_name:
              untrusted_artifacts += int(val)
          elif "ratify_signature_verification_duration_seconds" in metric_name:
              peak_verification_latency_ms = max(peak_verification_latency_ms, val * 1000.0)

      if parsed_metrics == 0:
          print("CRITICAL: Failed to parse valid metrics from Ratify Prometheus payload.", file=sys.stderr)
          sys.exit(1)

      if (verification_failures > max_failures) or (untrusted_artifacts > max_untrusted):
          compliance_level = "VIOLATION"
      elif peak_verification_latency_ms > 500.0:
          compliance_level = "DEGRADED"
      else:
          compliance_level = "COMPLIANT"

      timestamp = datetime.datetime.now(datetime.timezone.utc).isoformat()

      print(f"Ratify Compliance Level: {compliance_level}")
      print(f"Total Verification Requests: {verification_requests}")
      print(f"Verification Failures: {verification_failures} (Threshold: {max_failures})")
      print(f"Untrusted Artifacts: {untrusted_artifacts} (Threshold: {max_untrusted})")
      print(f"Peak Verification Latency: {peak_verification_latency_ms:.2f} ms")

      summary = (
          f"Ratify supply chain audit completed across {lookback}-minute window. "
          f"Compliance: {compliance_level}. Requests: {verification_requests}, "
          f"Failures: {verification_failures}, Untrusted: {untrusted_artifacts}."
      )

      from kestra import Kestra
      Kestra.outputs({
          "compliance_level": compliance_level,
          "verification_requests": verification_requests,
          "verification_failures": verification_failures,
          "untrusted_artifacts": untrusted_artifacts,
          "peak_verification_latency_ms": peak_verification_latency_ms,
          "timestamp": timestamp,
          "summary": summary
      })

  - id: enforce_zero_trust_policy
    type: io.kestra.plugin.core.flow.Switch
    description: "Routes operational actions dynamically based on supply chain compliance classification."
    value: "{{ outputs.evaluate_supply_chain_posture.vars.compliance_level }}"
    cases:
      VIOLATION:
        - id: quarantine_untrusted_workload
          type: io.kestra.plugin.scripts.shell.Commands
          description: "Initiates automated quarantine remediation procedures for non-compliant container artifacts."
          taskRunner:
            type: io.kestra.plugin.core.runner.Process
          commands:
            - 'echo "Quarantine procedure initiated for untrusted OCI artifacts"'
            - 'echo "Total Failures: {{ outputs.evaluate_supply_chain_posture.vars.verification_failures }}"'
            - 'echo "Untrusted Artifacts: {{ outputs.evaluate_supply_chain_posture.vars.untrusted_artifacts }}"'

        - id: notify_security_violation
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: "Dispatches high-severity incident notification via official Slack plugin."
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "text": "*CNCF Ratify Supply Chain Security Violation*\n*Status:* {{ outputs.evaluate_supply_chain_posture.vars.compliance_level }}\n*Summary:* {{ outputs.evaluate_supply_chain_posture.vars.summary }}\n*Total Requests:* {{ outputs.evaluate_supply_chain_posture.vars.verification_requests }}\n*Verification Failures:* {{ outputs.evaluate_supply_chain_posture.vars.verification_failures }} (Threshold: {{ inputs.max_allowable_verification_failures }})\n*Untrusted Artifacts:* {{ outputs.evaluate_supply_chain_posture.vars.untrusted_artifacts }} (Threshold: {{ inputs.max_allowable_untrusted_artifacts }})\n*Remediation:* Inspect Cosign and Notary v2 certificate chains in Ratify Store CRDs."
            }

      DEGRADED:
        - id: notify_performance_degradation
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: "Dispatches performance warning when signature verification latency breaches SLA."
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "text": "*CNCF Ratify Performance Degradation Warning*\n*Peak Latency:* {{ outputs.evaluate_supply_chain_posture.vars.peak_verification_latency_ms }} ms\n*Summary:* {{ outputs.evaluate_supply_chain_posture.vars.summary }}\n*Notice:* Verification latency exceeded acceptable limits. Check upstream OCI registry connectivity."
            }

      COMPLIANT:
        - id: record_compliance_streak
          type: io.kestra.plugin.core.kv.Set
          description: "Records the verified audit timestamp in Kestra KV store to track zero-trust health streak."
          key: "ratify_last_verified_timestamp"
          value: "{{ outputs.evaluate_supply_chain_posture.vars.timestamp }}"

  - id: log_guardrail_outcome
    type: io.kestra.plugin.core.log.Log
    description: "Logs the final summary of the supply chain verification audit."
    message: "Ratify guardrail audit complete. Compliance: {{ outputs.evaluate_supply_chain_posture.vars.compliance_level }}. Requests: {{ outputs.evaluate_supply_chain_posture.vars.verification_requests }}, Failures: {{ outputs.evaluate_supply_chain_posture.vars.verification_failures }}."

triggers:
  - id: periodic_ratify_verification_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"

extend:
  title: Ratify Supply Chain Attestation Verification Guardrail
  metaTitle: CNCF Ratify Supply Chain Attestation Verification Guardrail
  shortDescription: Audits Ratify verification metrics to detect unsigned images, missing SBOM attestations, and supply chain failures.
  metaDescription: Automated Kestra guardrail workflow monitoring CNCF Ratify metrics for Cosign signature verification, SBOM attestations, and admission failures.
  description: |
    ## How it works
    1. A schedule trigger executes the Ratify supply chain security audit workflow every 15 minutes.
    2. A native HTTP request task pulls Prometheus metrics directly from the CNCF Ratify service.
    3. A Python script evaluates verification counters and classifies posture into VIOLATION, DEGRADED, or COMPLIANT.
    4. A multi-case switch task routes execution dynamically based on the compliance classification.
    5. Violations trigger automated quarantine commands and high-severity Slack notifications.
    6. Performance degradations send operational warnings, while nominal checks record a compliance timestamp in the Kestra KV store.
    7. A final log task captures the complete audit verdict in execution logs.

    ## Architecture diagram
    ```mermaid
    graph TD
        Trigger[Schedule Trigger: 15m] --> FetchTelemetry[HTTP Request: Query Ratify Metrics]
        FetchTelemetry --> EvaluatePosture[Python Script: Parse Metrics & Classify]
        EvaluatePosture --> SwitchCompliance{Switch: Compliance Level}
        SwitchCompliance -- VIOLATION --> Quarantine[Shell: Quarantine Actions]
        Quarantine --> SlackViolation[SlackIncomingWebhook: High Severity Alert]
        SwitchCompliance -- DEGRADED --> SlackDegraded[SlackIncomingWebhook: Performance Warning]
        SwitchCompliance -- COMPLIANT --> RecordKV[KV Set: Record Compliance Timestamp]
        SlackViolation --> FinalLog[Log: Audit Verdict]
        SlackDegraded --> FinalLog
        RecordKV --> FinalLog
    ```

    ## What you get
    - Continuous zero-trust verification of container image supply chains before workloads reach production.
    - Multi-way operational branching separating severe security violations from transient latency warnings.
    - Proactive alerts when cryptographic Cosign or Notary v2 signatures fail verification against trusted root stores.
    - KV store tracking of verified compliance streaks across Kubernetes clusters.
    - Standardized audit metrics tracking signature evaluation latency and attestation failure velocity.

    ## Who it's for
    - DevSecOps Engineers enforcing zero-trust software supply chain security across enterprise Kubernetes clusters.
    - Security Operations (SecOps) teams auditing Cosign signatures, in-toto attestations, and CycloneDX/SPDX SBOMs.
    - Kubernetes Platform Engineers managing admission controllers and Ratify external data providers.
    - Compliance Officers ensuring container deployment pipelines conform to SLSA Level 3+ governance.

    ## Why orchestrate this with Kestra
    - **Dynamic Flow Control**: Utilizes native multi-case Switch branching to handle violations and latency degradations with dedicated remediation pipelines.
    - **Native Multi-Plugin Ecosystem**: Orchestrates HTTP, Python, Shell, KV store, and official Slack messaging without external middleware.
    - **Automated Security Surveillance**: Evaluates container attestation metrics continuously on a schedule.
    - **Centralized Secrets Governance**: Protects sensitive Slack webhooks using encrypted namespace secrets.
    - **Declarative YAML Workflows**: Manages supply chain guardrails as versioned code in Git repositories.

    ## Use cases
    - **Unsigned Image Admission Alarm**: Blocks and alerts on container images lacking valid Cosign cryptographic signatures.
    - **Missing SBOM Attestation Guardrail**: Detects when deployed workloads fail vulnerability and provenance attestations.
    - **Cosign Key Rotation Verification**: Validates that new cryptographic signing keys are recognized across the cluster without downtime.

    ## Inputs
    | Name | Type | Default | Description |
    | --- | --- | --- | --- |
    | `ratify_metrics_endpoint` | STRING | `http://ratify.ratify-service.svc.cluster.local:8888/metrics` | Internal Kubernetes HTTP endpoint exposing Prometheus metrics from Ratify. |
    | `max_allowable_verification_failures` | INT | `0` | Maximum acceptable signature verification failures before alerting. |
    | `max_allowable_untrusted_artifacts` | INT | `0` | Maximum allowable untrusted or unsigned OCI container artifacts. |
    | `lookback_minutes` | INT | `15` | Time window in minutes over which verification velocity is evaluated. |

    ## Expected outputs
    - `{{ outputs.evaluate_supply_chain_posture.vars.compliance_level }}`: Overall supply chain compliance classification (VIOLATION, DEGRADED, COMPLIANT).
    - `{{ outputs.evaluate_supply_chain_posture.vars.verification_requests }}`: Total number of signature verification requests processed.
    - `{{ outputs.evaluate_supply_chain_posture.vars.verification_failures }}`: Total count of verification failures detected.
    - `{{ outputs.evaluate_supply_chain_posture.vars.untrusted_artifacts }}`: Number of untrusted container artifacts identified.
    - `{{ outputs.evaluate_supply_chain_posture.vars.peak_verification_latency_ms }}`: Peak signature verification latency in milliseconds.
    - `{{ outputs.evaluate_supply_chain_posture.vars.summary }}`: Textual summary of the Ratify audit execution.

    ## Prerequisites
    - Kubernetes cluster with CNCF Ratify deployed and configured with trusted verifiers.
    - Ratify Prometheus telemetry exporter enabled and accessible on port 8888.
    - Network connectivity from the Kestra worker to the Ratify service endpoint.
    - Slack incoming webhook URL configured in Kestra secrets under `SLACK_WEBHOOK_URL`.

    ### Secrets
    - `SLACK_WEBHOOK_URL`: Secure webhook URL for routing supply chain alerts to SecOps channels.

    ## Quick start
    1. Confirm Ratify pods are active in the cluster: `kubectl get pods -n ratify-service`.
    2. Add the `SLACK_WEBHOOK_URL` secret within your Kestra namespace settings.
    3. Trigger a manual execution via the Kestra UI to validate metric collection.
    4. Enable the `periodic_ratify_verification_audit` schedule trigger to establish automated surveillance.

    ## Common pitfalls and troubleshooting
    - **Cosign Public Key Drift**: If verification failures surge, ensure the verification certificate has not expired in the Ratify Store CRD.
    - **Network Latency on OCI Registries**: Ratify queries remote OCI registries for `.sig` and `.att` blobs; ensure high network throughput.
    - **Metrics Port Differentiation**: Ratify exposes metrics on port 8888 by default; verify Kubernetes Service routing.
    - **Gatekeeper Webhook Timeout**: If admission requests time out, adjust Gatekeeper's `failurePolicy` and timeout seconds to accommodate blob fetching.

    ## How to extend
    - **Automated Workload Quarantine**: Expand shell remediation commands to apply Kubernetes NetworkPolicies isolating non-compliant pods.
    - **Registry Re-signing Trigger**: Dispatch an event to an automated signing pipeline when an expired signature is detected.
    - **Provenance Audit Ledger**: Archive raw in-toto attestation summaries into persistent compliance storage.

