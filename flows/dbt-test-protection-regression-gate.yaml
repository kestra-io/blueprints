id: dbt-test-protection-regression-gate
namespace: company.data

description: >-
  Run a baseline and a candidate revision of a dbt test suite against identical, deliberately
  corrupted DuckDB copies, and block the change when the candidate stops detecting a defect the
  baseline detected. The comparison engine is embedded in the `engine` task.

inputs:
  - id: repository_url
    type: STRING
    defaults: https://github.com/bunnyyxtan/dbt-protection-gate-demo
    description: Git URL of the trusted dbt project (DuckDB adapter, singular data tests under tests/).
  - id: base_sha
    type: STRING
    defaults: a8aa5e45de2926a305e5d6b1f84b8d882d73ed87
    description: Accepted test suite revision (full 40-character commit SHA).
  - id: candidate_sha
    type: STRING
    defaults: c039a86a2ffef94c40bd3810312c14d13e583f61
    description: Proposed test suite revision (full 40-character commit SHA).
  - id: catalog
    type: JSON
    description: >-
      Trusted obligation and mutation catalog. Each obligation lists the dbt test names that evidence it;
      each case is a mutation of the built fixture plus a witness query proving the defect exists.
    defaults: |-
      {
        "obligations": [
          {
            "id": "order_id_present",
            "description": "Every order has an id",
            "required": true,
            "tests": [
              "id_present"
            ]
          },
          {
            "id": "order_id_unique",
            "description": "Order ids are unique",
            "required": true,
            "tests": [
              "id_unique"
            ]
          },
          {
            "id": "order_amount_nonnegative",
            "description": "Order amounts are non-negative",
            "required": true,
            "tests": [
              "amount_nonnegative",
              "amount_not_negative"
            ]
          },
          {
            "id": "orders_not_empty",
            "description": "The orders table has at least one row",
            "required": true,
            "tests": [
              "orders_not_empty"
            ]
          },
          {
            "id": "order_customer_exists",
            "description": "Every order references an existing customer",
            "required": true,
            "tests": [
              "customer_exists"
            ]
          },
          {
            "id": "order_status_valid",
            "description": "Order status is in the approved set",
            "required": true,
            "tests": [
              "status_valid"
            ]
          }
        ],
        "cases": [
          {
            "id": "null_order_id",
            "obligation": "order_id_present",
            "kind": "defect",
            "required": true,
            "relation": "orders",
            "mutation_sql": "update orders set order_id = null where order_id = 1",
            "witness_sql": "select count(*) from orders where order_id is null"
          },
          {
            "id": "duplicate_order_id",
            "obligation": "order_id_unique",
            "kind": "defect",
            "required": true,
            "relation": "orders",
            "mutation_sql": "insert into orders select * from orders where order_id = 1",
            "witness_sql": "select count(*) from (select order_id from orders group by order_id having count(*) > 1)"
          },
          {
            "id": "negative_amount_order_1",
            "obligation": "order_amount_nonnegative",
            "kind": "defect",
            "required": true,
            "relation": "orders",
            "mutation_sql": "update orders set amount = -1 where order_id = 1",
            "witness_sql": "select count(*) from orders where order_id = 1 and amount = -1"
          },
          {
            "id": "empty_orders",
            "obligation": "orders_not_empty",
            "kind": "defect",
            "required": true,
            "relation": "orders",
            "mutation_sql": "delete from orders",
            "witness_sql": "select case when count(*) = 0 then 1 else 0 end from orders"
          },
          {
            "id": "orphan_customer",
            "obligation": "order_customer_exists",
            "kind": "defect",
            "required": true,
            "relation": "orders",
            "mutation_sql": "update orders set customer_id = 999 where order_id = 1",
            "witness_sql": "select count(*) from orders o left join customers c using (customer_id) where c.customer_id is null"
          },
          {
            "id": "invalid_status",
            "obligation": "order_status_valid",
            "kind": "defect",
            "required": true,
            "relation": "orders",
            "mutation_sql": "update orders set status = 'teleported' where order_id = 1",
            "witness_sql": "select count(*) from orders where status = 'teleported'"
          },
          {
            "id": "benign_amount_change",
            "obligation": null,
            "kind": "control",
            "required": true,
            "relation": "orders",
            "mutation_sql": "update orders set amount = 101 where order_id = 1",
            "witness_sql": "select count(*) from orders where order_id = 1 and amount = 101"
          }
        ]
      }

variables:
  base_sha: "{{ trigger.body.base_sha ?? inputs.base_sha }}"
  candidate_sha: "{{ trigger.body.candidate_sha ?? inputs.candidate_sha }}"
  gate: python gate.py --work state
  # Every archive produced so far, as an inputFiles map. Tasks that never ran are skipped, so the
  # same map serves the normal report and the failure report.
  collected: >-
    { "gate.py": "{{ outputs.engine.uri }}"
    {% if outputs.prepare is defined %}{% if outputs.prepare.outputFiles is defined %}{% if outputs.prepare.outputFiles['prepared.tar.gz'] is defined %}, "prepared.tar.gz": "{{ outputs.prepare.outputFiles['prepared.tar.gz'] }}"{% endif %}{% endif %}{% endif %}
    {% if outputs.clean_base is defined %}{% if outputs.clean_base.outputFiles is defined %}{% if outputs.clean_base.outputFiles['clean_base.tar.gz'] is defined %}, "clean_base.tar.gz": "{{ outputs.clean_base.outputFiles['clean_base.tar.gz'] }}"{% endif %}{% endif %}{% endif %}
    {% if outputs.clean_candidate is defined %}{% if outputs.clean_candidate.outputFiles is defined %}{% if outputs.clean_candidate.outputFiles['clean_candidate.tar.gz'] is defined %}, "clean_candidate.tar.gz": "{{ outputs.clean_candidate.outputFiles['clean_candidate.tar.gz'] }}"{% endif %}{% endif %}{% endif %}
    {% if outputs.cases is defined %}{% if outputs.cases.outputs is defined %}{% for o in outputs.cases.outputs %}{% if o.outputs is defined %}{% if o.outputs.archive is defined %}, "case_{{ o.item.value }}.tar.gz": "{{ o.outputs.archive }}"{% endif %}{% endif %}{% endfor %}{% endif %}{% endif %} }

tasks:
  # The engine source is part of the flow so the blueprint is a single self-contained file.
  - id: engine
    type: io.kestra.plugin.core.storage.Write
    extension: .py
    content: |
      {% verbatim %}
      """dbt Test Protection Regression Gate engine.

      Each subcommand is one orchestration step so Kestra can schedule, parallelise and
      inspect them individually. Every step writes its result as JSON under the work
      directory and exits 0 when it produced a result, whatever the verdict. A nonzero
      exit means the step itself could not produce a trustworthy result.

          --work W prepare  --repo R --base REF --candidate REF --catalog C
                            (or --base-dir D --candidate-dir D instead of --repo)
          --work W clean    --version base|candidate
          --work W mutate   --case ID --version base|candidate
          --work W measure  --case ID --version base|candidate
          --work W compare  --case ID
          --work W report
      """
      import argparse
      import hashlib
      import importlib.metadata
      import io
      import json
      import os
      import re
      import shutil
      import subprocess
      import sys
      import tarfile
      from collections import Counter
      from pathlib import Path

      import duckdb
      import yaml

      VERSIONS = ("base", "candidate")
      TEST_DIR = "tests/"
      DETECTED, UNDETECTED, INCONCLUSIVE = "DETECTED", "UNDETECTED", "INCONCLUSIVE"
      DBT_TIMEOUT_SECONDS = 600
      MAX_WITNESS_ROWS = 20
      FULL_SHA = re.compile(r"[0-9a-f]{40}")
      CASE_ID = re.compile(r"[A-Za-z0-9_-]+")
      DBT_ENV = {
          **os.environ,
          "DBT_SEND_ANONYMOUS_USAGE_STATS": "false",
          "DBT_USE_COLORS": "false",
          "PYTHONUTF8": "1",
      }


      # ---------- small helpers ----------

      def read_json(path):
          return json.loads(Path(path).read_text(encoding="utf-8"))


      def write_json(path, data):
          path = Path(path)
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(data, indent=2, default=str), encoding="utf-8")
          return data


      def sha256_bytes(data):
          return hashlib.sha256(data).hexdigest()


      def sha256_file(path):
          return sha256_bytes(Path(path).read_bytes())


      def git(repo, *args, binary=False):
          out = subprocess.run(["git", "-C", str(repo), *args], check=True, capture_output=True)
          return out.stdout if binary else out.stdout.decode().strip()


      def dbt_executable():
          explicit = os.environ.get("DBT_EXECUTABLE")
          if explicit:
              return explicit
          found = shutil.which("dbt")
          if found:
              return found
          local = Path(sys.executable).parent / ("dbt.exe" if os.name == "nt" else "dbt")
          if local.exists():
              return str(local)
          sys.exit("dbt executable not found; set DBT_EXECUTABLE")


      def obligation_tests(work, obligation_id):
          """Test names the trusted catalog accepts as evidence for an obligation (aliases allow renames)."""
          for ob in read_json(Path(work) / "catalog.json")["obligations"]:
              if ob["id"] == obligation_id:
                  return set(ob["tests"])
          sys.exit(f"obligation {obligation_id!r} is not in the trusted catalog")


      def catalog_case(work, case_id):
          for case in read_json(Path(work) / "catalog.json")["cases"]:
              if case["id"] == case_id:
                  return case
          sys.exit(f"case {case_id!r} is not in the trusted catalog")


      # ---------- dbt invocation ----------

      def write_profile(project_dir, out_dir, db_path):
          """The profile is generated by the gate, never taken from the repository under test."""
          profile = yaml.safe_load((Path(project_dir) / "dbt_project.yml").read_text(encoding="utf-8"))["profile"]
          config = {profile: {"target": "gate", "outputs": {"gate": {
              "type": "duckdb", "path": Path(db_path).as_posix(), "schema": "main", "threads": 1}}}}
          (Path(out_dir) / "profiles.yml").write_text(yaml.safe_dump(config), encoding="utf-8")


      def run_dbt(command, project_dir, out_dir, db_path):
          """Run one dbt command with its own profile, target and log paths.

          The target directory is created fresh, so a run_results.json found afterwards
          can only come from this invocation."""
          out_dir = Path(out_dir)
          for sub in ("target", "logs"):
              shutil.rmtree(out_dir / sub, ignore_errors=True)
          out_dir.mkdir(parents=True, exist_ok=True)
          write_profile(project_dir, out_dir, db_path)
          args = [dbt_executable(), command,
                  "--project-dir", str(project_dir), "--profiles-dir", str(out_dir),
                  "--target-path", str(out_dir / "target"), "--log-path", str(out_dir / "logs"),
                  "--no-use-colors"]
          try:
              proc = subprocess.run(args, cwd=project_dir, env=DBT_ENV, capture_output=True,
                                    text=True, encoding="utf-8", errors="replace", timeout=DBT_TIMEOUT_SECONDS)
              exit_code, output = proc.returncode, proc.stdout + "\n" + proc.stderr
          except subprocess.TimeoutExpired as exc:
              exit_code, output = None, f"dbt timed out after {DBT_TIMEOUT_SECONDS}s\n{exc.stdout or ''}"
          (out_dir / "dbt.log").write_text(output, encoding="utf-8")
          results_path = out_dir / "target" / "run_results.json"
          run_results = read_json(results_path) if results_path.exists() else None
          manifest_path = out_dir / "target" / "manifest.json"
          manifest = read_json(manifest_path) if manifest_path.exists() else None
          # dbt can drop a test it cannot resolve (e.g. a ref to a missing model) with only a warning,
          # so the tests the project defines are taken from the manifest, not from what happened to run.
          manifest_tests = ({k: n["name"] for k, n in manifest["nodes"].items() if n.get("resource_type") == "test"}
                            if manifest else None)
          return {
              "command": command,
              "exit_code": exit_code,
              "manifest_tests": manifest_tests,
              "manifest_invocation_id": manifest["metadata"]["invocation_id"] if manifest else None,
              "invocation_id": run_results["metadata"]["invocation_id"] if run_results else None,
              "dbt_version": run_results["metadata"]["dbt_version"] if run_results else None,
              "results": [{"unique_id": r["unique_id"], "status": r["status"], "failures": r.get("failures"),
                           "message": r.get("message")} for r in run_results["results"]] if run_results else None,
              "run_results_path": str(results_path) if run_results else None,
              "log_path": str(out_dir / "dbt.log"),
          }


      # ---------- relation state ----------

      def relation_rows(db_path, relation):
          with duckdb.connect(str(db_path), read_only=True) as con:
              cols = [d[0] for d in con.execute(f"select * from {relation} limit 0").description]
              rows = con.execute(f"select * from {relation} order by all").fetchall()
          return cols, [tuple(json.loads(json.dumps(r, default=str))) for r in rows]


      def relation_state(db_path, relation):
          cols, rows = relation_rows(db_path, relation)
          return {"rows": len(rows), "sha256": sha256_bytes(json.dumps([cols, rows]).encode())}


      def row_diff(before_rows, after_rows):
          removed = Counter(before_rows) - Counter(after_rows)
          added = Counter(after_rows) - Counter(before_rows)
          return (list(removed.elements())[:MAX_WITNESS_ROWS], list(added.elements())[:MAX_WITNESS_ROWS])


      # ---------- steps ----------

      def checkout(repo, sha, dest):
          archive = git(repo, "archive", "--format=tar", sha, binary=True)
          with tarfile.open(fileobj=io.BytesIO(archive)) as tar:
              tar.extractall(dest, filter="data")


      def file_tree(root):
          """Content hash of every file under root, ignoring .git."""
          root = Path(root)
          return {p.relative_to(root).as_posix(): sha256_file(p) for p in sorted(root.rglob("*"))
                  if p.is_file() and ".git" not in p.relative_to(root).parts}


      def drop_nulls(value):
          if isinstance(value, dict):
              return {k: drop_nulls(v) for k, v in value.items() if v is not None}
          if isinstance(value, list):
              return [drop_nulls(v) for v in value]
          return value


      def kestra_outputs(**values):
          """Kestra script tasks read `::{"outputs": ...}::` lines into the task's `vars` outputs."""
          print("::" + json.dumps({"outputs": values}) + "::")


      def prepare(args):
          work = Path(args.work).resolve()
          if work.exists() and any(work.iterdir()):
              sys.exit(f"work directory {work} is not empty; refusing to reuse it")
          if args.repo:
              repo = Path(args.repo).resolve()
              shas = {"base": git(repo, "rev-parse", "--verify", f"{args.base}^{{commit}}"),
                      "candidate": git(repo, "rev-parse", "--verify", f"{args.candidate}^{{commit}}")}
              for version in VERSIONS:
                  checkout(repo, shas[version], work / "versions" / version / "project")
          else:
              # Checkouts made by the orchestrator (one git.Clone per revision). The refs may come from
              # a webhook body, so only full commit SHAs are accepted.
              refs = {"base": args.base, "candidate": args.candidate}
              bad = [v for v in VERSIONS if not FULL_SHA.fullmatch(refs[v])]
              if bad:
                  sys.exit(f"{bad} must be full 40-character lowercase hex commit SHAs")
              dirs = {"base": Path(args.base_dir), "candidate": Path(args.candidate_dir)}
              shas = {}
              for version in VERSIONS:
                  shas[version] = git(dirs[version], "rev-parse", "--verify", "HEAD^{commit}")
                  if shas[version] != refs[version]:
                      sys.exit(f"{version} checkout is at {shas[version]}, not the requested {refs[version]}")
                  shutil.copytree(dirs[version], work / "versions" / version / "project",
                                  ignore=shutil.ignore_patterns(".git"))

          catalog = json.loads(Path(args.catalog).read_bytes())
          if isinstance(catalog, str):
              # A webhook execution has no inputs, so the flow passes the catalog default as a JSON string.
              catalog = json.loads(catalog)
          if not isinstance(catalog, dict):
              sys.exit("catalog must be a JSON object")
          # Canonical form, so the same catalog has the same hash however it reached the flow. Kestra's JSON
          # input drops null fields while a raw default keeps them; nulls are dropped here too (reads use .get).
          catalog = drop_nulls(catalog)
          catalog_bytes = json.dumps(catalog, sort_keys=True, separators=(",", ":")).encode()
          ids = [c["id"] for c in catalog["cases"]]
          if not ids or len(ids) != len(set(ids)):
              sys.exit("catalog must list at least one case with unique ids")
          if not all(CASE_ID.fullmatch(i) for i in ids):
              sys.exit("case ids may only contain letters, digits, '_' and '-' (they are used in commands and paths)")
          obligations = {o["id"]: o for o in catalog["obligations"]}
          for ob in obligations.values():
              if not ob.get("tests") or not all(isinstance(t, str) and t for t in ob["tests"]):
                  sys.exit(f"obligation {ob['id']!r} must list the test names that evidence it")
          for case in catalog["cases"]:
              if case["kind"] not in ("defect", "control"):
                  sys.exit(f"case {case['id']!r}: kind must be 'defect' or 'control'")
              if case["kind"] == "defect" and case.get("obligation") not in obligations:
                  sys.exit(f"case {case['id']!r} references unknown obligation {case.get('obligation')!r}")
          work.mkdir(parents=True, exist_ok=True)
          (work / "catalog.json").write_bytes(catalog_bytes)

          base_tree = file_tree(work / "versions" / "base" / "project")
          cand_tree = file_tree(work / "versions" / "candidate" / "project")
          changed = sorted(p for p in set(base_tree) | set(cand_tree) if base_tree.get(p) != cand_tree.get(p))
          out_of_scope = [p for p in changed if not p.startswith(TEST_DIR)]

          pair = {
              "repo": args.repo,
              "refs": {"base": args.base, "candidate": args.candidate},
              "shas": shas,
              "scope": {"supported": not out_of_scope, "changed_test_files": [p for p in changed if p.startswith(TEST_DIR)],
                        "out_of_scope_files": out_of_scope},
              "catalog_sha256": sha256_bytes(catalog_bytes),
              "engine_versions": {p: importlib.metadata.version(p) for p in ("dbt-core", "dbt-duckdb", "duckdb")},
          }
          if out_of_scope:
              write_json(work / "pair.json", {**pair, "fixture": None})
              print(json.dumps({"step": "prepare", "supported": False, "out_of_scope_files": out_of_scope}))
              kestra_outputs(ready=False, case_ids=[])
              return

          # Models are identical in both revisions (scope check above), so either can build the fixture.
          fixture_dir = work / "fixture"
          db = fixture_dir / "fixture.duckdb"
          build = run_dbt("run", work / "versions" / "base" / "project", fixture_dir, db)
          if build["exit_code"] != 0 or not build["results"] or any(r["status"] != "success" for r in build["results"]):
              write_json(work / "pair.json", {**pair, "fixture": {"build": build, "ok": False}})
              print(json.dumps({"step": "prepare", "supported": True, "fixture_ok": False}))
              kestra_outputs(ready=False, case_ids=[])
              return
          relations = sorted({c["relation"] for c in catalog["cases"]})
          # Relative to the work directory: later steps may unpack the state somewhere else.
          pair["fixture"] = {"ok": True, "path": "fixture/fixture.duckdb", "file_sha256": sha256_file(db), "build": build,
                             "relations": {r: relation_state(db, r) for r in relations}}
          write_json(work / "pair.json", pair)
          print(json.dumps({"step": "prepare", "supported": True, "fixture_ok": True, "shas": shas}))
          kestra_outputs(ready=True, case_ids=ids, base_sha=shas["base"], candidate_sha=shas["candidate"])


      def run_health(run, expected_ids):
          """Reason the invocation cannot be trusted as a measurement, or None when it can."""
          results = run["results"]
          if run["exit_code"] is None:
              return "dbt timed out"
          if results is None:
              return "no run_results.json from this invocation"
          if run["manifest_tests"] is None:
              return "no manifest.json from this invocation"
          if run["manifest_invocation_id"] != run["invocation_id"]:
              return "manifest.json and run_results.json come from different invocations"
          ids = [r["unique_id"] for r in results]
          if not ids:
              return "no tests executed"
          if len(ids) != len(set(ids)):
              return f"duplicate results: {sorted({i for i in ids if ids.count(i) > 1})}"
          not_run = sorted(set(run["manifest_tests"]) - set(ids))
          if not_run:
              return f"tests defined in the project but not executed: {not_run}"
          if expected_ids is not None and set(ids) != set(expected_ids):
              return f"executed tests differ from the clean run: {sorted(set(ids) ^ set(expected_ids))}"
          odd = [(r["unique_id"], r["status"]) for r in results if r["status"] not in ("pass", "fail")]
          if odd:
              return f"non pass/fail statuses: {odd}"
          bad_fail = [r["unique_id"] for r in results if r["status"] == "fail" and not (r["failures"] or 0) > 0]
          if bad_fail:
              return f"failing tests without a positive failure count: {bad_fail}"
          any_fail = any(r["status"] == "fail" for r in results)
          if run["exit_code"] != (1 if any_fail else 0):
              return f"dbt exit code {run['exit_code']} inconsistent with test statuses"
          return None


      def classify_tests(run, expected_ids):
          """Suite-level verdict: used for clean runs and benign controls (any failing test counts)."""
          problem = run_health(run, expected_ids)
          if problem:
              return INCONCLUSIVE, problem
          failed = [r["unique_id"] for r in run["results"] if r["status"] == "fail"]
          return (DETECTED, f"failing tests: {failed}") if failed else (UNDETECTED, "all tests passed")


      def classify_obligation(run, expected_ids, test_names):
          """Obligation-level verdict: only the tests the trusted catalog maps to the obligation count.

          A failing test that is not mapped to the obligation is reported but never counts as detection."""
          problem = run_health(run, expected_ids)
          if problem:
              return INCONCLUSIVE, problem, []
          mapped = sorted(uid for uid, name in run["manifest_tests"].items() if name in test_names)
          failed = {r["unique_id"] for r in run["results"] if r["status"] == "fail"}
          unrelated = sorted(failed - set(mapped))
          note = f"; unrelated failing tests ignored: {unrelated}" if unrelated else ""
          if not mapped:
              return UNDETECTED, f"no test in this revision is mapped to the obligation {sorted(test_names)}{note}", mapped
          hits = [uid for uid in mapped if uid in failed]
          if hits:
              return DETECTED, f"obligation test failed: {hits}{note}", mapped
          return UNDETECTED, f"obligation tests passed: {mapped}{note}", mapped


      def clean(args):
          work = Path(args.work)
          pair = read_json(work / "pair.json")
          out = work / "clean" / args.version
          db = out / "db.duckdb"
          out.mkdir(parents=True, exist_ok=True)
          shutil.copyfile(work / pair["fixture"]["path"], db)
          run = run_dbt("test", work / "versions" / args.version / "project", out, db)
          verdict, reason = classify_tests(run, None)
          green = verdict == UNDETECTED
          result = write_json(out / "clean.json", {
              "version": args.version, "sha": pair["shas"][args.version],
              "status": "GREEN" if green else INCONCLUSIVE,
              "reason": "all tests passed on the clean fixture" if green else f"clean run is not green: {reason}",
              "expected_tests": sorted(r["unique_id"] for r in run["results"]) if green else None,
              "dbt": run})
          print(json.dumps({"step": "clean", "version": args.version, "status": result["status"]}))


      def mutate(args):
          work = Path(args.work)
          pair = read_json(work / "pair.json")
          case = catalog_case(work, args.case)
          out = work / "cases" / args.case / args.version
          out.mkdir(parents=True, exist_ok=True)
          db = out / "db.duckdb"
          shutil.copyfile(work / pair["fixture"]["path"], db)
          cols, before_rows = relation_rows(db, case["relation"])
          with duckdb.connect(str(db)) as con:
              con.execute(case["mutation_sql"])
              witness = con.execute(case["witness_sql"]).fetchone()[0]
          _, after_rows = relation_rows(db, case["relation"])
          removed, added = row_diff(before_rows, after_rows)
          before = {"rows": len(before_rows), "sha256": sha256_bytes(json.dumps([cols, before_rows]).encode())}
          after = relation_state(db, case["relation"])
          changed = before["sha256"] != after["sha256"]
          result = write_json(out / "mutation.json", {
              "case": args.case, "version": args.version, "relation": case["relation"],
              "mutation_sql": case["mutation_sql"], "witness_sql": case["witness_sql"],
              "witness_count": witness, "before": before, "after": after, "changed": changed,
              "applied": bool(changed and witness and witness > 0),
              "columns": cols, "rows_removed": removed, "rows_added": added})
          print(json.dumps({"step": "mutate", "case": args.case, "version": args.version, "applied": result["applied"]}))


      def measure(args):
          work = Path(args.work)
          case = catalog_case(work, args.case)
          out = work / "cases" / args.case / args.version
          if not (out / "mutation.json").exists():
              # The mutate step failed; record that instead of measuring an unmutated copy.
              write_json(out / "measure.json", {"case": args.case, "version": args.version, "verdict": INCONCLUSIVE,
                                                "reason": "mutation step produced no result", "obligation_tests": [],
                                                "post_test_state": None, "defect_retained": False, "dbt": None})
              print(json.dumps({"step": "measure", "case": args.case, "version": args.version, "verdict": INCONCLUSIVE}))
              return
          mutation = read_json(out / "mutation.json")
          clean_result = read_json(work / "clean" / args.version / "clean.json")
          db = out / "db.duckdb"
          run = run_dbt("test", work / "versions" / args.version / "project", out, db)
          post = relation_state(db, case["relation"])
          mapped = []
          if case["kind"] == "control":
              verdict, reason = classify_tests(run, clean_result["expected_tests"])
          else:
              verdict, reason, mapped = classify_obligation(run, clean_result["expected_tests"],
                                                            obligation_tests(work, case["obligation"]))
          if clean_result["status"] != "GREEN":
              verdict, reason = INCONCLUSIVE, "clean run for this version was not green"
          elif not mutation["applied"]:
              verdict, reason = INCONCLUSIVE, "mutation did not change the relation"
          elif post["sha256"] != mutation["after"]["sha256"]:
              verdict, reason = INCONCLUSIVE, "relation changed during dbt test; defect not retained"
          result = write_json(out / "measure.json", {
              "case": args.case, "version": args.version, "verdict": verdict, "reason": reason,
              "obligation_tests": mapped, "post_test_state": post, "defect_retained": post["sha256"] == mutation["after"]["sha256"],
              "dbt": run})
          print(json.dumps({"step": "measure", "case": args.case, "version": args.version, "verdict": result["verdict"]}))


      PAIR_OUTCOMES = {
          (DETECTED, UNDETECTED): "LOST_PROTECTION",
          (DETECTED, DETECTED): "RETAINED",
          (UNDETECTED, DETECTED): "GAINED",
          (UNDETECTED, UNDETECTED): "EXISTING_GAP",
      }


      def compare(args):
          work = Path(args.work)
          case = catalog_case(work, args.case)
          base_dir = work / "cases" / args.case
          missing = [f"{v}/{name}" for v in VERSIONS for name in ("mutation.json", "measure.json")
                     if not (base_dir / v / name).exists()]
          if missing:
              write_json(base_dir / "compare.json", {
                  "case": args.case, "obligation": case.get("obligation"), "kind": case["kind"],
                  "required": case.get("required", True), "outcome": INCONCLUSIVE,
                  "reason": f"step results missing (a task failed): {missing}",
                  "base_verdict": None, "candidate_verdict": None})
              print(json.dumps({"step": "compare", "case": args.case, "outcome": INCONCLUSIVE}))
              return
          mutations = {v: read_json(base_dir / v / "mutation.json") for v in VERSIONS}
          measures = {v: read_json(base_dir / v / "measure.json") for v in VERSIONS}
          verdicts = (measures["base"]["verdict"], measures["candidate"]["verdict"])
          if not all(m["applied"] for m in mutations.values()):
              outcome, reason = "NO_OP", "mutation did not change the relation"
          elif mutations["base"]["after"]["sha256"] != mutations["candidate"]["after"]["sha256"]:
              outcome, reason = INCONCLUSIVE, "the two versions were not tested against the same corrupted state"
          elif INCONCLUSIVE in verdicts:
              outcome, reason = INCONCLUSIVE, "; ".join(f"{v}: {measures[v]['reason']}" for v in VERSIONS
                                                        if measures[v]["verdict"] == INCONCLUSIVE)
          elif case["kind"] == "control":
              ok = verdicts == (UNDETECTED, UNDETECTED)
              outcome = "CONTROL_OK" if ok else "CONTROL_FLAGGED"
              reason = "benign change accepted by both suites" if ok else "a suite rejected a benign change"
          else:
              outcome, reason = PAIR_OUTCOMES[verdicts], f"base {verdicts[0]}, candidate {verdicts[1]}"
          write_json(base_dir / "compare.json", {
              "case": args.case, "obligation": case.get("obligation"), "kind": case["kind"],
              "required": case.get("required", True), "outcome": outcome, "reason": reason,
              "base_verdict": verdicts[0], "candidate_verdict": verdicts[1]})
          print(json.dumps({"step": "compare", "case": args.case, "outcome": outcome}))


      # ---------- report ----------

      BLOCKING = {"LOST_PROTECTION": "BLOCK", "EXISTING_GAP": "BLOCK"}


      def decide(pair, cleans, compares):
          if not pair["scope"]["supported"]:
              return "UNSUPPORTED", f"files outside {TEST_DIR} changed: {pair['scope']['out_of_scope_files']}"
          if not pair["fixture"]["ok"]:
              return INCONCLUSIVE, "fixture build failed"
          not_green = [v for v in VERSIONS if not cleans.get(v) or cleans[v]["status"] != "GREEN"]
          if not_green:
              return INCONCLUSIVE, f"clean run not green for: {not_green}"
          required = [c for c in compares if c["kind"] == "defect" and c["required"]]
          lost = [c["case"] for c in required if c["outcome"] == "LOST_PROTECTION"]
          if lost:
              return "BLOCK", f"LOST_PROTECTION in {lost}"
          gaps = [c["case"] for c in required if c["outcome"] == "EXISTING_GAP"]
          if gaps:
              return "BLOCK", f"EXISTING_GAP: required defect missed by both suites in {gaps}"
          bad = [c["case"] for c in compares if c["outcome"] in (INCONCLUSIVE, "NO_OP", "CONTROL_FLAGGED", "MISSING")]
          if bad:
              return INCONCLUSIVE, f"invalid or incomplete experiments: {bad}"
          return "PASS", "candidate detected every required defect and accepted every control"


      EVIDENCE_FILES = ("target/run_results.json", "target/manifest.json", "dbt.log",
                        "clean.json", "mutation.json", "measure.json")


      def collect_evidence(src_dir, dest_dir):
          """Copy whatever artifacts a step left, by layout (absolute paths recorded earlier may be stale)."""
          copied = []
          for rel in EVIDENCE_FILES:
              if (src_dir / rel).exists():
                  (dest_dir / rel).parent.mkdir(parents=True, exist_ok=True)
                  shutil.copyfile(src_dir / rel, dest_dir / rel)
                  copied.append(rel)
          return copied


      def partial_result(work, note):
          """Result for a run that stopped before prepare finished: nothing measured, nothing inferred."""
          result = {"decision": INCONCLUSIVE, "reason": f"run stopped before preparation completed. {note}".strip(),
                    "gate_passed": False, "partial": True,
                    "requested_base_sha": os.environ.get("BASE_SHA"),
                    "requested_candidate_sha": os.environ.get("CANDIDATE_SHA"),
                    "base_sha": None, "candidate_sha": None, "cases": []}
          evidence = work / "evidence"
          write_json(evidence / "result.json", result)
          (evidence / "report.md").write_text(f"# dbt test protection gate: {INCONCLUSIVE}\n\n{result['reason']}\n\n"
                                              "No comparison was performed; no protection result exists for this run.\n",
                                              encoding="utf-8")
          return result


      def report(args):
          work = Path(args.work)
          evidence = work / "evidence"
          note = f"Execution failure: {' '.join(dict.fromkeys(args.partial.split()))}" if args.partial else ""
          if not (work / "pair.json").exists():
              result = partial_result(work, note)
              print(json.dumps({"step": "report", "decision": result["decision"], "reason": result["reason"]}))
              kestra_outputs(decision=result["decision"], reason=result["reason"], base_sha=None, candidate_sha=None)
              return
          pair = read_json(work / "pair.json")
          catalog = read_json(work / "catalog.json")
          cleans, compares, cases = {}, [], []
          available = {}
          for v in VERSIONS:
              available[f"clean/{v}"] = collect_evidence(work / "clean" / v, evidence / "clean" / v)
              p = work / "clean" / v / "clean.json"
              if p.exists():
                  cleans[v] = read_json(p)
          ran_cases = pair["scope"]["supported"] and pair["fixture"] and pair["fixture"]["ok"]
          for case in catalog["cases"] if ran_cases else []:
              cdir = work / "cases" / case["id"]
              for v in VERSIONS:
                  available[f"cases/{case['id']}/{v}"] = collect_evidence(cdir / v, evidence / "cases" / case["id"] / v)
              if not (cdir / "compare.json").exists():
                  compares.append({"case": case["id"], "kind": case["kind"], "required": case.get("required", True),
                                   "obligation": case.get("obligation"), "outcome": "MISSING",
                                   "reason": "no comparison result for this case"})
                  continue
              comp = read_json(cdir / "compare.json")
              compares.append(comp)
              files = [cdir / v / n for v in VERSIONS for n in ("mutation.json", "measure.json")]
              if not all(f.exists() for f in files):
                  continue  # outcome already INCONCLUSIVE; no witness to render
              detail = {"compare": comp}
              for v in VERSIONS:
                  detail[v] = {"mutation": read_json(cdir / v / "mutation.json"),
                               "measure": read_json(cdir / v / "measure.json")}
              if all(detail[v]["measure"]["dbt"] for v in VERSIONS):
                  cases.append(detail)

          fixture_intact = None
          if pair["fixture"] and pair["fixture"].get("ok"):
              fixture_intact = sha256_file(work / pair["fixture"]["path"]) == pair["fixture"]["file_sha256"]
          decision, reason = decide(pair, cleans, compares)
          if fixture_intact is False:
              decision, reason = INCONCLUSIVE, "source fixture changed during the run"
          if args.partial:
              # A failed execution can still prove a loss it measured, but can never pass.
              if decision == "PASS":
                  decision = INCONCLUSIVE
              reason = f"{reason}. {note}"
          result = write_json(evidence / "result.json", {
              "decision": decision, "reason": reason, "gate_passed": decision == "PASS",
              "partial": bool(args.partial), "artifacts_available": available,
              "base_sha": pair["shas"]["base"], "candidate_sha": pair["shas"]["candidate"],
              "scope": pair["scope"], "catalog_sha256": pair["catalog_sha256"],
              "fixture_file_sha256": pair["fixture"]["file_sha256"] if pair["fixture"] and pair["fixture"].get("ok") else None,
              "fixture_unchanged": fixture_intact, "engine_versions": pair["engine_versions"],
              "clean": {v: {k: c[k] for k in ("status", "reason", "expected_tests")} | {"invocation_id": c["dbt"]["invocation_id"]}
                        for v, c in cleans.items()},
              "cases": [{**c, "base_invocation_id": _inv(cases, c["case"], "base"),
                         "candidate_invocation_id": _inv(cases, c["case"], "candidate")} for c in compares]})
          (evidence / "report.md").write_text(render_markdown(result, cases), encoding="utf-8")
          print(json.dumps({"step": "report", "decision": decision, "reason": reason}))
          kestra_outputs(decision=decision, reason=reason, base_sha=result["base_sha"],
                         candidate_sha=result["candidate_sha"])


      def _inv(cases, case_id, version):
          for d in cases:
              if d["compare"]["case"] == case_id:
                  return d[version]["measure"]["dbt"]["invocation_id"]
          return None


      def render_markdown(result, cases):
          lines = [f"# dbt test protection gate: {result['decision']}", "", result["reason"], "",
                   f"- Base: `{result['base_sha']}`", f"- Candidate: `{result['candidate_sha']}`",
                   f"- Changed test files: {', '.join(result['scope']['changed_test_files']) or 'none'}",
                   f"- Catalog sha256: `{result['catalog_sha256']}`",
                   f"- Fixture sha256: `{result['fixture_file_sha256']}` (unchanged after run: {result['fixture_unchanged']})",
                   f"- Engines: {', '.join(f'{k} {v}' for k, v in result['engine_versions'].items())}", "",
                   "## Clean fixture", ""]
          for v, c in result["clean"].items():
              n = len(c["expected_tests"] or [])
              lines.append(f"- {v}: {c['status']}, {n} tests ({c['reason']}), invocation `{c['invocation_id']}`")
          lines += ["", "## Cases", "", "| Case | Kind | Base | Candidate | Outcome |", "|---|---|---|---|---|"]
          for c in result["cases"]:
              lines.append(f"| {c['case']} | {c['kind']} | {c.get('base_verdict', '-')} | "
                           f"{c.get('candidate_verdict', '-')} | **{c['outcome']}** |")
          for d in cases:
              comp, mut = d["compare"], d["base"]["mutation"]
              lines += ["", f"### {comp['case']}: {comp['outcome']}", "", comp["reason"], "",
                        f"Mutation on `{mut['relation']}`: `{mut['mutation_sql']}`",
                        f"Witness `{mut['witness_sql']}` = {mut['witness_count']}; relation changed: {mut['changed']}", "",
                        f"Columns: {mut['columns']}", f"Rows removed: {mut['rows_removed']}", f"Rows added: {mut['rows_added']}", ""]
              for v in VERSIONS:
                  meas = d[v]["measure"]
                  failing = [r["unique_id"] for r in meas["dbt"]["results"] or [] if r["status"] == "fail"]
                  lines.append(f"- {v}: {meas['verdict']} ({meas['reason']}); dbt exit {meas['dbt']['exit_code']}; "
                               f"failing: {failing or 'none'}; defect retained after test: {meas['defect_retained']}; "
                               f"invocation `{meas['dbt']['invocation_id']}`")
          lines += ["", "A PASS means only that the candidate detected every required defect in this catalog "
                    "and accepted every control on this fixture. It is not a claim of complete coverage.", ""]
          return "\n".join(lines)


      def main():
          parser = argparse.ArgumentParser(description=__doc__, formatter_class=argparse.RawDescriptionHelpFormatter)
          parser.add_argument("--work", required=True, help="run directory shared by every step")
          sub = parser.add_subparsers(dest="step", required=True)
          p = sub.add_parser("prepare", help="give either --repo, or --base-dir and --candidate-dir")
          for flag in ("--base", "--candidate", "--catalog"):
              p.add_argument(flag, required=True)
          for flag in ("--repo", "--base-dir", "--candidate-dir"):
              p.add_argument(flag)
          for name in ("clean", "mutate", "measure", "compare", "report"):
              p = sub.add_parser(name)
              if name in ("mutate", "measure", "compare"):
                  p.add_argument("--case", required=True)
              if name in ("clean", "mutate", "measure"):
                  p.add_argument("--version", required=True, choices=VERSIONS)
              if name == "report":
                  p.add_argument("--partial", help="the execution failed; describe how (never yields PASS)")
          args = parser.parse_args()
          args.work = str(Path(args.work).resolve())  # dbt runs with cwd=project, so relative paths would break
          globals()[args.step](args)


      if __name__ == "__main__":
          main()
      {% endverbatim %}

  - id: checkout
    type: io.kestra.plugin.core.flow.WorkingDirectory
    tasks:
      - id: clone_base
        type: io.kestra.plugin.git.Clone
        url: "{{ inputs.repository_url }}"
        commit: "{{ render(vars.base_sha) }}"
        directory: base
      - id: clone_candidate
        type: io.kestra.plugin.git.Clone
        url: "{{ inputs.repository_url }}"
        commit: "{{ render(vars.candidate_sha) }}"
        directory: candidate
      - id: prepare
        type: io.kestra.plugin.scripts.shell.Commands
        taskRunner:
          type: io.kestra.plugin.scripts.runner.docker.Docker
        containerImage: ghcr.io/kestra-io/dbt-duckdb@sha256:0ef4e767f4555478615dfc39131a3d8c6f0365caebeb99927961f076406fa745
        description: Check the change is test-only, build the fixture once, validate the catalog.
        inputFiles:
          gate.py: "{{ outputs.engine.uri }}"
          catalog.json: "{{ inputs.catalog | toJson }}"
        # Webhook-supplied revisions travel as environment variables, never spliced into the
        # command line; gate.py rejects anything that is not a full hex SHA.
        env:
          BASE_SHA: "{{ render(vars.base_sha) }}"
          CANDIDATE_SHA: "{{ render(vars.candidate_sha) }}"
        commands:
          - >-
            {{ vars.gate }} prepare --base "$BASE_SHA" --candidate "$CANDIDATE_SHA"
            --base-dir base --candidate-dir candidate --catalog catalog.json
          - tar -czf prepared.tar.gz state
        outputFiles:
          - prepared.tar.gz

  - id: comparable
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.prepare.vars.ready }}"
    then:
      - id: clean_suites
        type: io.kestra.plugin.core.flow.Parallel
        tasks:
          - id: clean_base
            type: io.kestra.plugin.scripts.shell.Commands
            taskRunner:
              type: io.kestra.plugin.scripts.runner.docker.Docker
            containerImage: ghcr.io/kestra-io/dbt-duckdb@sha256:0ef4e767f4555478615dfc39131a3d8c6f0365caebeb99927961f076406fa745
            description: Baseline suite must pass every test on the clean fixture.
            inputFiles:
              gate.py: "{{ outputs.engine.uri }}"
              prepared.tar.gz: "{{ outputs.prepare.outputFiles['prepared.tar.gz'] }}"
            commands:
              - tar -xzf prepared.tar.gz
              - "{{ vars.gate }} clean --version base"
              - tar -czf clean_base.tar.gz --exclude='*.duckdb' state/clean/base
            outputFiles:
              - clean_base.tar.gz
          - id: clean_candidate
            type: io.kestra.plugin.scripts.shell.Commands
            taskRunner:
              type: io.kestra.plugin.scripts.runner.docker.Docker
            containerImage: ghcr.io/kestra-io/dbt-duckdb@sha256:0ef4e767f4555478615dfc39131a3d8c6f0365caebeb99927961f076406fa745
            description: Candidate suite must pass every test on the clean fixture.
            inputFiles:
              gate.py: "{{ outputs.engine.uri }}"
              prepared.tar.gz: "{{ outputs.prepare.outputFiles['prepared.tar.gz'] }}"
            commands:
              - tar -xzf prepared.tar.gz
              - "{{ vars.gate }} clean --version candidate"
              - tar -czf clean_candidate.tar.gz --exclude='*.duckdb' state/clean/candidate
            outputFiles:
              - clean_candidate.tar.gz

      - id: cases
        type: io.kestra.plugin.core.flow.Loop
        values: "{{ outputs.prepare.vars.case_ids }}"
        concurrencyLimit: 2
        outputs:
          - id: archive
            type: STRING
            value: "{{ outputs.compare.outputFiles['case.tar.gz'] }}"
        tasks:
          - id: both_versions
            type: io.kestra.plugin.core.flow.Parallel
            tasks:
              - id: base_case
                type: io.kestra.plugin.core.flow.Sequential
                tasks:
                  - id: mutate_base
                    type: io.kestra.plugin.scripts.shell.Commands
                    taskRunner:
                      type: io.kestra.plugin.scripts.runner.docker.Docker
                    containerImage: ghcr.io/kestra-io/dbt-duckdb@sha256:0ef4e767f4555478615dfc39131a3d8c6f0365caebeb99927961f076406fa745
                    description: Corrupt a private copy of the fixture and prove the defect exists.
                    # A crashing case must not hide the evidence of the other cases: the failure is
                    # recorded as INCONCLUSIVE by measure/compare instead of failing the whole Loop.
                    allowFailure: true
                    inputFiles:
                      gate.py: "{{ outputs.engine.uri }}"
                      prepared.tar.gz: "{{ outputs.prepare.outputFiles['prepared.tar.gz'] }}"
                    commands:
                      - tar -xzf prepared.tar.gz
                      - "{{ vars.gate }} mutate --case {{ item.value }} --version base"
                      - tar -czf mutated.tar.gz state/cases/{{ item.value }}/base
                    outputFiles:
                      - mutated.tar.gz
                  - id: measure_base
                    type: io.kestra.plugin.scripts.shell.Commands
                    taskRunner:
                      type: io.kestra.plugin.scripts.runner.docker.Docker
                    containerImage: ghcr.io/kestra-io/dbt-duckdb@sha256:0ef4e767f4555478615dfc39131a3d8c6f0365caebeb99927961f076406fa745
                    description: Run the baseline dbt tests on the corrupted copy, without rebuilding.
                    allowFailure: true
                    inputFiles: >-
                      { "gate.py": "{{ outputs.engine.uri }}",
                        "prepared.tar.gz": "{{ outputs.prepare.outputFiles['prepared.tar.gz'] }}",
                        "clean.tar.gz": "{{ outputs.clean_base.outputFiles['clean_base.tar.gz'] }}"
                        {% if outputs.mutate_base is defined %}{% if outputs.mutate_base.outputFiles is defined %}{% if outputs.mutate_base.outputFiles['mutated.tar.gz'] is defined %}, "mutated.tar.gz": "{{ outputs.mutate_base.outputFiles['mutated.tar.gz'] }}"{% endif %}{% endif %}{% endif %} }
                    commands:
                      - for f in *.tar.gz; do tar -xzf "$f"; done
                      - "{{ vars.gate }} measure --case {{ item.value }} --version base"
                      - tar -czf measured.tar.gz --exclude='*.duckdb' state/cases/{{ item.value }}/base
                    outputFiles:
                      - measured.tar.gz
              - id: candidate_case
                type: io.kestra.plugin.core.flow.Sequential
                tasks:
                  - id: mutate_candidate
                    type: io.kestra.plugin.scripts.shell.Commands
                    taskRunner:
                      type: io.kestra.plugin.scripts.runner.docker.Docker
                    containerImage: ghcr.io/kestra-io/dbt-duckdb@sha256:0ef4e767f4555478615dfc39131a3d8c6f0365caebeb99927961f076406fa745
                    description: Same corruption on a separate copy for the candidate suite.
                    allowFailure: true
                    inputFiles:
                      gate.py: "{{ outputs.engine.uri }}"
                      prepared.tar.gz: "{{ outputs.prepare.outputFiles['prepared.tar.gz'] }}"
                    commands:
                      - tar -xzf prepared.tar.gz
                      - "{{ vars.gate }} mutate --case {{ item.value }} --version candidate"
                      - tar -czf mutated.tar.gz state/cases/{{ item.value }}/candidate
                    outputFiles:
                      - mutated.tar.gz
                  - id: measure_candidate
                    type: io.kestra.plugin.scripts.shell.Commands
                    taskRunner:
                      type: io.kestra.plugin.scripts.runner.docker.Docker
                    containerImage: ghcr.io/kestra-io/dbt-duckdb@sha256:0ef4e767f4555478615dfc39131a3d8c6f0365caebeb99927961f076406fa745
                    description: Run the candidate dbt tests on the corrupted copy, without rebuilding.
                    allowFailure: true
                    inputFiles: >-
                      { "gate.py": "{{ outputs.engine.uri }}",
                        "prepared.tar.gz": "{{ outputs.prepare.outputFiles['prepared.tar.gz'] }}",
                        "clean.tar.gz": "{{ outputs.clean_candidate.outputFiles['clean_candidate.tar.gz'] }}"
                        {% if outputs.mutate_candidate is defined %}{% if outputs.mutate_candidate.outputFiles is defined %}{% if outputs.mutate_candidate.outputFiles['mutated.tar.gz'] is defined %}, "mutated.tar.gz": "{{ outputs.mutate_candidate.outputFiles['mutated.tar.gz'] }}"{% endif %}{% endif %}{% endif %} }
                    commands:
                      - for f in *.tar.gz; do tar -xzf "$f"; done
                      - "{{ vars.gate }} measure --case {{ item.value }} --version candidate"
                      - tar -czf measured.tar.gz --exclude='*.duckdb' state/cases/{{ item.value }}/candidate
                    outputFiles:
                      - measured.tar.gz
          - id: compare
            type: io.kestra.plugin.scripts.shell.Commands
            taskRunner:
              type: io.kestra.plugin.scripts.runner.docker.Docker
            containerImage: ghcr.io/kestra-io/dbt-duckdb@sha256:0ef4e767f4555478615dfc39131a3d8c6f0365caebeb99927961f076406fa745
            description: Classify the pair; a missing step result is INCONCLUSIVE, never a pass.
            inputFiles: >-
              { "gate.py": "{{ outputs.engine.uri }}",
                "prepared.tar.gz": "{{ outputs.prepare.outputFiles['prepared.tar.gz'] }}"
                {% if outputs.measure_base is defined %}{% if outputs.measure_base.outputFiles is defined %}{% if outputs.measure_base.outputFiles['measured.tar.gz'] is defined %}, "base.tar.gz": "{{ outputs.measure_base.outputFiles['measured.tar.gz'] }}"{% endif %}{% endif %}{% endif %}
                {% if outputs.measure_candidate is defined %}{% if outputs.measure_candidate.outputFiles is defined %}{% if outputs.measure_candidate.outputFiles['measured.tar.gz'] is defined %}, "candidate.tar.gz": "{{ outputs.measure_candidate.outputFiles['measured.tar.gz'] }}"{% endif %}{% endif %}{% endif %} }
            commands:
              - for f in *.tar.gz; do tar -xzf "$f"; done
              - "{{ vars.gate }} compare --case {{ item.value }}"
              - tar -czf case.tar.gz state/cases/{{ item.value }}
            outputFiles:
              - case.tar.gz

  - id: report
    type: io.kestra.plugin.scripts.shell.Commands
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: ghcr.io/kestra-io/dbt-duckdb@sha256:0ef4e767f4555478615dfc39131a3d8c6f0365caebeb99927961f076406fa745
    description: Write result.json and report.md with the original dbt artifacts before deciding.
    inputFiles: "{{ render(vars.collected) }}"
    commands:
      - for f in *.tar.gz; do tar -xzf "$f"; done
      - "{{ vars.gate }} report"
      - cp state/evidence/result.json state/evidence/report.md .
      - tar -czf evidence.tar.gz -C state evidence
    outputFiles:
      - result.json
      - report.md
      - evidence.tar.gz

  - id: release_gate
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.report.vars.decision != 'PASS' }}"
    then:
      - id: block
        type: io.kestra.plugin.core.execution.Fail
        errorMessage: "{{ outputs.report.vars.decision }}: {{ outputs.report.vars.reason }}"

errors:
  # When anything fails before the normal report ran, still write a report from whatever
  # artifacts exist. It can only be INCONCLUSIVE or BLOCK, never PASS.
  - id: failure_evidence
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.report is not defined }}"
    then:
      - id: partial_report
        type: io.kestra.plugin.scripts.shell.Commands
        taskRunner:
          type: io.kestra.plugin.scripts.runner.docker.Docker
        containerImage: ghcr.io/kestra-io/dbt-duckdb@sha256:0ef4e767f4555478615dfc39131a3d8c6f0365caebeb99927961f076406fa745
        inputFiles: "{{ render(vars.collected) }}"
        env:
          BASE_SHA: "{{ render(vars.base_sha) }}"
          CANDIDATE_SHA: "{{ render(vars.candidate_sha) }}"
          FAILED_TASKS: "{% for l in errorLogs() %}{{ l.taskId }} {% endfor %}"
        commands:
          - for f in *.tar.gz; do [ -e "$f" ] && tar -xzf "$f"; done; true
          - "{{ vars.gate }} report --partial \"failed tasks: $FAILED_TASKS\""
          - cp state/evidence/result.json state/evidence/report.md .
          - tar -czf evidence.tar.gz -C state evidence
        outputFiles:
          - result.json
          - report.md
          - evidence.tar.gz

outputs:
  - id: decision
    type: STRING
    value: "{{ outputs.report.vars.decision }}"
  - id: report
    type: FILE
    value: "{{ outputs.report.outputFiles['report.md'] }}"

triggers:
  - id: on_test_change
    type: io.kestra.plugin.core.trigger.Webhook
    key: "{{ secret('PROTECTION_GATE_WEBHOOK_KEY') }}"

extend:
  title: dbt Test Protection Regression Gate with Reproducible Defect Witnesses
  metaTitle: dbt Test Protection Regression Gate | Kestra
  shortDescription: >-
    Run the old and the proposed dbt test suites against the same deliberately corrupted DuckDB data and block
    the change when the new suite stops catching a defect the old one caught.
  metaDescription: >-
    Catch dbt test changes that silently lose protection: replay required defects on DuckDB copies and block with
    a reproducible witness.
  description: |
    A dbt test change can weaken the suite while every build stays green: relaxing `amount < 0` to
    `amount < -1000`, deleting a check, or a typo that makes dbt skip a test. This flow corrupts identical fixture
    copies with the defects your team declared required, runs both suites on them, and blocks when the baseline
    caught a defect the candidate misses. You get the defective row and both dbt results, not a score.

    ## How it works

    1. A Webhook or manual run supplies two full commit SHAs (passed to scripts only as environment variables).
    2. `git.Clone` checks out both revisions; `prepare` refuses changes outside `tests/` and builds the DuckDB
       fixture once.
    3. `clean_suites` runs both suites in parallel on clean copies; every test in `manifest.json` must pass.
    4. `cases` loops over the catalog: two private corrupted copies per case, a witness query proving the defect,
       `dbt test` without rebuilding, and a check that the defect survived the test run.
    5. Detection counts only a `fail` with failures > 0 from a test mapped to that obligation, in the same dbt
       invocation as its manifest. Unrelated failures never count; errors, skips and missing results are INCONCLUSIVE.
    6. `report` stores the evidence, then `release_gate` fails the run unless the decision is PASS. An `errors`
       branch still writes a report if a task fails; it never yields PASS.

    ## What you get

    - PASS, BLOCK (LOST_PROTECTION or EXISTING_GAP), INCONCLUSIVE or UNSUPPORTED per execution.
    - `report.md`, `result.json` and `evidence.tar.gz` with every `run_results.json`, `manifest.json` and dbt log used.
    - A benign control case that turns a suite rejecting valid data into INCONCLUSIVE.

    ## Who it's for

    - Analytics engineers reviewing changes to dbt tests, including changes made by coding agents.

    ## Why orchestrate this with Kestra

    - Each case and suite is a visible task; a crashing case becomes INCONCLUSIVE while the others keep evidence.
    - State moves only as per-execution output files, so concurrent runs stay isolated and auditable.

    ## Prerequisites

    - Kestra with the Docker task runner; steps run in a digest-pinned `ghcr.io/kestra-io/dbt-duckdb` image
      (dbt-core 1.11.7, dbt-duckdb 1.10.1).
    - A trusted Git repository with a DuckDB dbt project and singular tests under `tests/`. Its code is executed.
    - A catalog of obligations, the test names that evidence each, and SQL mutations (the default fits the demo).

    ### Secrets

    - `PROTECTION_GATE_WEBHOOK_KEY`: webhook URL key; anyone holding it can start runs.

    ## Quick start

    1. Add the `PROTECTION_GATE_WEBHOOK_KEY` secret.
    2. Execute with the defaults: the demo candidate weakens the amount test and the run ends BLOCK.
    3. Set the candidate to the repaired commit to see PASS, then point the inputs at your repository.
    4. From CI, POST `{"base_sha": "...", "candidate_sha": "..."}` to the webhook and require success.

    ## How to extend

    - Add obligations and cases for your own invariants; list old and new test names to allow renames.
    - Post `report.md` to the pull request or Slack after `report`.

    ## Links

    - [Loop task](https://kestra.io/plugins/core/flow/io.kestra.plugin.core.flow.loop)
    - [Git Clone task](https://kestra.io/plugins/plugin-git/io.kestra.plugin.git.clone)
    - [dbt run_results.json](https://docs.getdbt.com/reference/artifacts/run-results-json)
  tags:
    - Data
  subTags:
    - Testing & Quality
    - dbt Transformations
  ee: false
  demo: false
