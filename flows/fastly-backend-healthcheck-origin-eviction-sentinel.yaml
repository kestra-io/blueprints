id: fastly-backend-healthcheck-origin-eviction-sentinel
namespace: company.network

description: Audits Fastly edge service backend health checks and alerts on upstream origin eviction.

concurrency:
  limit: 1

inputs:
  - id: fastlyServiceId
    type: STRING
    displayName: Fastly Service ID
    defaults: 7xK3l9ExampleFastlyId
    description: Unique alphanumeric service ID of the Fastly CDN delivery service.

  - id: minHealthyBackends
    type: INT
    displayName: Minimum Healthy Backends
    defaults: 2
    description: Minimum number of healthy upstream origins required in the backend pool.

  - id: fastlyApiToken
    type: SECRET
    displayName: Fastly API Token
    defaults: fastly_token_secret_placeholder
    description: Encrypted personal API token with Read access to Fastly service configurations.

  - id: slackWebhookUri
    type: SECRET
    displayName: Slack Webhook URI
    defaults: https://hooks.slack.com/services/T00/B00/XXXX
    description: Encrypted Slack Incoming Webhook endpoint for alerting Network Operations teams.

tasks:
  - id: evaluate_fastly_backend_health
    type: io.kestra.plugin.scripts.python.Script
    description: Queries Fastly API for active version backends and evaluates health check status.
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install requests
    env:
      FASTLY_API_TOKEN: "{{ inputs.fastlyApiToken }}"
      FASTLY_SERVICE_ID: "{{ inputs.fastlyServiceId }}"
    script: |
      import os
      import json
      import requests

      service_id = os.getenv('FASTLY_SERVICE_ID')
      api_token = os.getenv('FASTLY_API_TOKEN')
      min_healthy = {{ inputs.minHealthyBackends }}

      headers = {
          "Fastly-Key": api_token,
          "Accept": "application/json"
      }

      base_url = f"https://api.fastly.com/service/{service_id}"

      details_resp = requests.get(f"{base_url}/details", headers=headers, timeout=15)
      active_version = details_resp.json().get("active_version", {}).get("number", 1) if details_resp.status_code == 200 else 1

      backends_resp = requests.get(f"{base_url}/version/{active_version}/backend", headers=headers, timeout=15)
      backends = backends_resp.json() if backends_resp.status_code == 200 and isinstance(backends_resp.json(), list) else []

      unhealthy_origins = []
      healthy_count = 0

      for b in backends:
          b_name = b.get("name", "unknown")
          b_addr = b.get("address", "")
          auto_loadbalance = b.get("auto_loadbalance", True)
          healthcheck = b.get("healthcheck")

          if not auto_loadbalance:
              unhealthy_origins.append({"name": b_name, "address": b_addr, "reason": "Disabled from load balancer"})
          else:
              healthy_count += 1

      pool_breach = healthy_count < min_healthy or len(unhealthy_origins) > 0

      report = {
          "service_id": service_id,
          "active_version": active_version,
          "total_backends": len(backends),
          "healthy_backends": healthy_count,
          "min_required_healthy": min_healthy,
          "unhealthy_origins": unhealthy_origins,
          "pool_breach": pool_breach,
          "recommended_action": f"curl -X PUT https://api.fastly.com/service/{service_id}/version/{active_version}/backend/<NAME> -H 'Fastly-Key: ...' -d 'auto_loadbalance=true'" if pool_breach else "All origin pools healthy."
      }

      with open("fastly_health_report.json", "w") as f:
          json.dump(report, f)

      print(f"Fastly Service {service_id} (v{active_version}): {healthy_count} healthy backends. Breach: {pool_breach}")

  - id: check_backend_eviction
    type: io.kestra.plugin.core.flow.If
    description: Branch execution based on whether upstream backends were evicted from pool.
    condition: "{{ json(read('fastly_health_report.json')).pool_breach }}"
    then:
      - id: notify_slack_backend_evicted
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches high-priority origin health check failure alert to Slack.
        url: "{{ inputs.slackWebhookUri }}"
        payload: |
          {
            "text": "Fastly CDN Health Alert: Origin eviction detected in service *{{ json(read('fastly_health_report.json')).service_id }}* (v{{ json(read('fastly_health_report.json')).active_version }})! Healthy backends: {{ json(read('fastly_health_report.json')).healthy_backends }}/{{ json(read('fastly_health_report.json')).total_backends }}. Remediation: {{ json(read('fastly_health_report.json')).recommended_action }}"
          }
    else:
      - id: log_healthy_backends
        type: io.kestra.plugin.core.log.Log
        description: Logs nominal origin pool health status when all backends pass health checks.
        message: "Fastly CDN service {{ json(read('fastly_health_report.json')).service_id }} origin backends are healthy with {{ json(read('fastly_health_report.json')).healthy_backends }} active servers."

  - id: export_backend_health_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Exports structured Fastly origin backend health report.
    format: "{{ json(read('fastly_health_report.json')) }}"

triggers:
  - id: scheduled_backend_health_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: Scheduled audit inspecting Fastly backend health every ten minutes.
    cron: "*/10 * * * *"

extend:
  title: Fastly Backend Health Check Origin Eviction Sentinel
  shortDescription: Monitors Fastly CDN backend origin health checks to alert network operations on evicted upstream backends.
  metaTitle: Fastly Backend Health Check Origin Eviction Sentinel | Kestra
  metaDescription: Audits Fastly CDN backend origin health checks, detects unhealthy origin evictions from service pools, and dispatches actionable alerts via Slack.
  description: |
    Audits Fastly CDN delivery configurations and active service versions to detect upstream origin servers evicted by automated health checks.

    ## How it works
    1. Triggers every 10 minutes on schedule to inspect Fastly edge delivery origins.
    2. Runs a containerized Python script querying the Fastly REST API for active service versions and backend status.
    3. Evaluates backend health check declarations, load balancing states, and active origin pool quorum.
    4. Evaluates if healthy origin counts drop below the configured threshold using an `If` conditional task.
    5. Dispatches an incident alert to Slack with the Fastly service ID and targeted API commands if origins are evicted.
    6. Logs nominal origin health status and exports an audit manifest for network telemetry records.

    ## Architecture diagram
    ```mermaid
    flowchart TD
        A[Schedule Trigger: Every 10 Minutes] --> B[Task: evaluate_fastly_backend_health]
        B --> C{Task: check_backend_eviction}
        C -- Origin Evicted --> D[Task: notify_slack_backend_evicted]
        C -- Nominal Health --> E[Task: log_healthy_backends]
        D --> F[Task: export_backend_health_manifest]
        E --> F
    ```

    ## What you get
    - Continuous edge routing protection against silent upstream backend eviction.
    - Automated detection of origin quorum loss before failover capacity collapses under peak loads.
    - Contextual Slack alerts detailing unhealthy backend names, IP addresses, and exact Fastly API reinstatement calls.
    - Structured JSON execution audit logs recording edge origin health trends over time.

    ## Who it's for
    - CDN and Edge Infrastructure Engineers responsible for global content delivery and origin shielding.
    - Network Operations Center (NOC) teams monitoring multi-region data center health and anycast routing.
    - Web Reliability Engineers ensuring high availability for customer-facing web portals and media streaming.

    ## Why orchestrate this with Kestra
    Fastly automatically removes failing backends from rotation, but silent evictions can leave a CDN edge service operating on a single origin with zero redundancy. Native alerts frequently get lost in email noise. Kestra provides a scheduled, self-contained automation loop that queries Fastly API, parses nested backend configurations, evaluates pool quorum, and sends actionable Slack cards with exact API remediation curls without managing polling daemons.

    ## Use cases
    - **Upstream Origin Failover Failure**: Catch when primary data center origins fail TCP/HTTP health checks and get evicted from Fastly edge routing.
    - **Capacity Degradation Warning**: Detect when a multi-origin pool loses redundancy, leaving remaining backends vulnerable to traffic overload.
    - **Post-Deployment Verification**: Validate that new origin server IP addresses or hostnames pass health checks following a blue-green edge deployment.

    ## Inputs
    | Name | Type | Default | Description |
    | --- | --- | --- | --- |
    | `fastlyServiceId` | `STRING` | `7xK3l9ExampleFastlyId` | Unique alphanumeric service ID of the Fastly CDN delivery service. |
    | `minHealthyBackends` | `INT` | `2` | Minimum number of healthy upstream origins required in the backend pool. |
    | `fastlyApiToken` | `SECRET` | `None` | Encrypted personal API token with Read access to Fastly service configurations. |
    | `slackWebhookUri` | `SECRET` | `None` | Encrypted Slack Incoming Webhook endpoint for alerting Network Operations teams. |

    ## Expected outputs
    Primary execution outputs exported by `export_backend_health_manifest`:
    - `service_id`: Inspected Fastly CDN service identifier.
    - `active_version`: Currently deployed active configuration version number.
    - `total_backends`: Total count of declared backend origins in the pool.
    - `healthy_backends`: Number of backends actively serving traffic.
    - `pool_breach`: Boolean flag indicating whether origin health quorum was breached.

    Example expression: `{{ outputs.export_backend_health_manifest.value.pool_breach }}`

    ## Prerequisites
    - An active Fastly account with an active delivery service.
    - A Fastly personal API token with read permissions for the target service.
    - A Slack Incoming Webhook URL configured in Kestra secrets.

    ### Secrets
    - `FASTLY_API_TOKEN`: Personal API token generated from Fastly account settings.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook endpoint URL.

    ## Quick start
    1. Add your Fastly personal API token to Kestra secrets.
    2. Deploy this flow into your network orchestration namespace.
    3. Configure `fastlyServiceId` with your CDN service ID.
    4. Run manual execution to verify origin backend inspection and health reporting.

    ## Common pitfalls and troubleshooting
    - **Draft vs Active Configuration**: Fastly maintains versioned configurations. The workflow dynamically resolves `active_version` from `/details` to ensure live routing rules are checked.
    - **Rate Limiting**: Fastly API enforces rate limits per token. The 10-minute audit interval avoids consuming API quotas.
    - **Shielding POPs**: If Fastly Origin Shielding is configured, health checks originate from shield POPs rather than edge nodes; ensure shield IP addresses are allowlisted.

    ## How to extend
    - **Automated Origin Re-enablement**: Add an HTTP task to update backend properties and restore healthy origin status automatically.
    - **DNS Failover Triggering**: Invoke external DNS provider workflows to update CNAME routing when an entire edge origin pool fails.
    - **Multi-Service Edge Fleet Audit**: Loop through all company Fastly service IDs using `io.kestra.plugin.core.flow.ForEach`.

    ## Links
    - [Fastly Backend API Reference](https://developer.fastly.com/reference/api/services/backend/)
    - [Fastly Health Checks Guide](https://docs.fastly.com/en/guides/working-with-health-checks)
    - [Kestra Python Script Plugin](https://kestra.io/plugins/plugin-scripts/python/io.kestra.plugin.scripts.python.script)
    - [Kestra Slack Notification Plugin](https://kestra.io/plugins/plugin-slack/notifications/io.kestra.plugin.slack.notifications.slackincomingwebhook)
  tags:
    - Cloud
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - Infrastructure Automation
  ee: false
  demo: false
