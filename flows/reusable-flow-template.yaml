id: reusable-flow-template
namespace: company.team
description: |
  Reusable starting point: fetch data over HTTP, then fan out into parallel
  branches that log the result, post-process it with a shell command and
  build a summary exposed as a flow output.

inputs:
  - id: source_url
    type: URI
    defaults: https://dummyjson.com/products
    description: Endpoint to fetch. Replace with your own API.

  - id: report_title
    type: STRING
    defaults: Reusable flow template run
    description: Title used in the generated summary.

tasks:
  - id: fetch_data
    type: io.kestra.plugin.core.http.Request
    description: Fetch the source URL with an HTTP GET request.
    uri: "{{ inputs.source_url }}"
    method: GET

  - id: parallel_processing
    type: io.kestra.plugin.core.flow.Parallel
    description: Run the three branches below concurrently. Replace them with your own logic.
    tasks:
      - id: log_response
        type: io.kestra.plugin.core.log.Log
        description: Log the HTTP status code of the fetch.
        message: "Fetched {{ inputs.source_url }} with status {{ outputs.fetch_data.code }}"

      - id: shell_summary
        type: io.kestra.plugin.scripts.shell.Commands
        description: Post-process the response size with a shell command. The Process runner needs no Docker.
        taskRunner:
          type: io.kestra.plugin.core.runner.Process
        env:
          TITLE: "{{ inputs.report_title }}"
          PAYLOAD_SIZE: "{{ outputs.fetch_data.body | length }}"
        commands:
          - echo "$TITLE - received $PAYLOAD_SIZE characters"

      - id: build_summary
        type: io.kestra.plugin.core.debug.Return
        description: Build the one-line summary exposed as the flow output.
        format: "{{ inputs.report_title }}: HTTP {{ outputs.fetch_data.code }}, {{ outputs.fetch_data.body | length }} characters received"

outputs:
  - id: summary
    type: STRING
    value: "{{ outputs.build_summary.value }}"

triggers:
  - id: weekday_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    description: "Weekdays at 08:00 UTC. Disabled by default; set `disabled: false` to enable."
    cron: "0 8 * * 1-5"
    disabled: true

extend:
  title: Reusable Flow Template with HTTP Fetch, Parallel Branches and a Schedule
  shortDescription: A self-contained starter flow that fetches data over HTTP, fans out into parallel log, shell and summary branches, and runs on a schedule.
  metaTitle: Reusable Kestra Flow Template with Parallel Tasks and Schedule
  metaDescription: Starter Kestra flow that fetches data over HTTP, processes it in parallel with log, shell and summary tasks, and runs on a cron schedule. No secrets needed.
  description: |
    Every new workflow starts with the same skeleton: pull some data, process it in several ways at once, expose a result, and run on a schedule. This blueprint is that skeleton in one self-contained flow. It fetches an HTTP endpoint, fans out into three parallel branches that log the response, post-process its size with a shell command and build a one-line summary, then exposes that summary as a flow output. A disabled `Schedule` trigger shows how to run it on weekdays. It needs no secrets and no Docker, so you can run it in seconds and then swap the pieces for your own logic.

    ## How it works

    1. `fetch_data` (`io.kestra.plugin.core.http.Request`) sends a GET request to the `source_url` input. It defaults to the public DummyJSON products API.
    2. `parallel_processing` (`io.kestra.plugin.core.flow.Parallel`) runs three branches concurrently:
       - `log_response` (`io.kestra.plugin.core.log.Log`) logs the URL and HTTP status code.
       - `shell_summary` (`io.kestra.plugin.scripts.shell.Commands`) runs a shell command with the `io.kestra.plugin.core.runner.Process` task runner, so it runs directly on the worker without Docker. The title and response size are passed as environment variables.
       - `build_summary` (`io.kestra.plugin.core.debug.Return`) builds a one-line summary from the title, status code and response size.
    3. The flow `outputs` block exposes that line as `summary`, so a parent flow or an API client can read it.
    4. `weekday_schedule` (`io.kestra.plugin.core.trigger.Schedule`) is set to run at 08:00 UTC on weekdays with the cron `0 8 * * 1-5`. It ships disabled so nothing runs until you opt in.

    ## What you get

    - A runnable skeleton with an HTTP task, a flowable `Parallel` task, a non-core plugin task and a trigger.
    - A pattern for branching work in parallel and collecting a single flow output.
    - A shell task that runs without Docker, handy for local and lightweight workers.
    - A schedule you can enable by changing one property.

    ## Who it's for

    - Engineers writing their first Kestra flow who want a clean starting point.
    - Teams that want a shared template for HTTP-driven jobs with parallel post-processing.
    - Anyone learning how triggers, flowable tasks, plugins and outputs fit together.

    ## Why orchestrate this with Kestra

    A cron job and a script can call an API, but they do not give you parallel branches, per-task logs, typed inputs and outputs, retries and a UI to re-run failed pieces. Kestra provides all of that declaratively in one YAML file you can version-control, and the `Schedule` trigger means the same file runs on demand or on a timetable.

    ## Prerequisites

    - A Kestra instance with the `io.kestra.plugin.scripts.shell` plugin available (included in the standard Kestra Docker image).
    - A POSIX shell (`sh` or `bash`) on the worker that runs the `shell_summary` task.
    - Outbound HTTPS access to the endpoint set in `source_url`.

    ### Secrets

    None. If your endpoint needs authentication, add a secret and reference it with `{{ secret('NAME') }}` in the `headers` of `fetch_data`.

    ## Inputs

    - `source_url` (`URI`, default `https://dummyjson.com/products`): endpoint fetched by `fetch_data`.
    - `report_title` (`STRING`, default `Reusable flow template run`): title used in the shell output and the summary.

    ## Expected outputs

    - `{{ outputs.fetch_data.body }}`: raw HTTP response body.
    - `{{ outputs.build_summary.value }}`: the one-line summary, also exposed as the flow output `summary`.

    ## Quick start

    1. Create the flow in your namespace and click **Execute**.
    2. Open the **Outputs** tab to read `summary`, and the **Logs** tab to see the three parallel branches.
    3. Replace `source_url` with your own endpoint and rewrite the branches with your logic.
    4. To run it on a schedule, set `disabled: false` on `weekday_schedule`.

    ## How to extend

    - Adjust the cron expression on `weekday_schedule` to change when the flow runs.
    - Add more branches under `parallel_processing`, or wrap them in `ForEach` to process each item of the response.
    - Swap `shell_summary` for a Python script task to transform the data.
    - Send the summary to Slack or email by adding a notification task after the `Parallel` task.

    ## Links

    - [Parallel task documentation](https://kestra.io/plugins/core/flow/io.kestra.plugin.core.flow.parallel)
    - [Schedule trigger documentation](https://kestra.io/docs/workflow-components/triggers/schedule-trigger)
    - [Shell Commands plugin documentation](https://kestra.io/plugins/plugin-script-shell)
    - [DummyJSON products API](https://dummyjson.com/docs/products)
  tags:
    - Core
  subTags:
    - Flow Control & Conditions
    - Scheduling
  ee: false
  demo: true
