id: openfda-faers-disproportionality-signal-check
namespace: company.team

description: |
  Screen FDA adverse event reports (FAERS) for disproportionality signals on a drug watchlist.
  After each FAERS refresh, openFDA `count=` queries return the reaction counts for every
  drug and for the whole database in the same receive-date window. DuckDB builds the 2x2
  table per drug and reaction and computes PRR, ROR with its 95% CI and the Yates
  chi-square. Pairs that pass the Evans criteria are signals, and Slack only gets the ones
  not reported before. A signal is a statistical hint for case review, not proof of causation.

inputs:
  - id: drugs
    type: ARRAY
    itemType: STRING
    defaults:
      - SEMAGLUTIDE
      - ATORVASTATIN
      - MONTELUKAST
    description: Active substance names as FAERS records them (`patient.drug.activesubstance.activesubstancename`), matched exactly after upper-casing. Use the plain substance (ATORVASTATIN has about twice the reports of ATORVASTATIN CALCIUM); a name with no reports is listed as not found.

  - id: lookback_years
    type: INT
    defaults: 5
    min: 1
    max: 30
    description: Receive-date window, in years back from today. The same window applies to the drug counts and to the background.

  - id: min_cases
    type: INT
    defaults: 25
    min: 3
    description: Minimum number of reports with both the drug and the reaction (cell `a`). Evans et al. use 3; a higher floor keeps the list short for well-reported drugs.

  - id: min_prr
    type: FLOAT
    defaults: 2.0
    description: Minimum proportional reporting ratio.

  - id: min_chi_square
    type: FLOAT
    defaults: 4.0
    description: Minimum Yates-corrected chi-square (1 degree of freedom; 4 is roughly p < 0.05).

  - id: exclude_terms
    type: STRING
    defaults: "^(DRUG INEFFECTIVE|OFF LABEL USE|PRODUCT .*|.*ADMINISTRATION.*|.*DOSE.*|WRONG .*|INCORRECT .*|.*EXPOSURE.*|.*USE ISSUE|.*ERROR|INTERCEPTED .*|THERAPEUTIC RESPONSE .*|NO ADVERSE EVENT|DRUG INTERACTION)$"
    description: Regular expression of MedDRA preferred terms to drop before scoring. The default removes medication-error, product and efficacy terms that are not adverse reactions.

  - id: force
    type: BOOL
    defaults: false
    description: Score even if openFDA's `last_updated` date matches the one already processed.

  - id: state_key
    type: STRING
    defaults: faers_signal_check
    description: Prefix of the KV keys holding the processed FAERS release and the signals already reported.

triggers:
  - id: weekly
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 6 * * 1"
    description: FAERS is refreshed about once a quarter. A weekly check notices the refresh within a few days and exits early otherwise.

tasks:
  - id: plan
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: Upper-cases and deduplicates the drug names, strips double quotes so a name cannot break the search, and computes the receive-date window. Each loop item carries its window because Loop iterations run in their own context.
    url: "jdbc:duckdb:"
    timeZoneId: UTC
    fetchType: FETCH_ONE
    parameters:
      drugs: "{{ inputs.drugs | toJson }}"
      years: "{{ inputs.lookback_years }}"
    sql: |
      SET TimeZone = 'UTC';
      CREATE TABLE w AS SELECT strftime(current_date - to_years(CAST(:years AS INTEGER)), '%Y%m%d') AS d_from, strftime(current_date, '%Y%m%d') AS d_to;
      CREATE TABLE d AS SELECT DISTINCT upper(trim(replace(x, '"', ''))) AS drug FROM unnest(from_json(:drugs, '["VARCHAR"]')) AS t(x) WHERE trim(replace(x, '"', '')) <> '';
      CREATE TABLE drug_check AS SELECT CASE WHEN count(*) = 0 THEN error('The drugs input is empty.') END AS ok FROM d;
      SELECT (SELECT d_from FROM w) AS window_from, (SELECT d_to FROM w) AS window_to, (SELECT count(*) FROM d) AS drug_count,
             CAST((SELECT json_group_array(json_object('idx', i, 'drug', drug, 'from', w.d_from, 'to', w.d_to))
                   FROM (SELECT row_number() OVER (ORDER BY drug) AS i, drug FROM d), w) AS VARCHAR) AS items;

  - id: release
    type: io.kestra.plugin.core.http.Request
    description: One-record query for the window. Returns the FAERS `last_updated` date and N, the number of reports in the window.
    uri: https://api.fda.gov/drug/event.json
    params:
      search: "receivedate:[{{ outputs.plan.outputs[0].row.window_from }} TO {{ outputs.plan.outputs[0].row.window_to }}]"
      limit: "0"
    headers:
      User-Agent: "kestra-openfda-faers-signal-check/1.0 (https://kestra.io)"
    options:
      retryOnStatusCodes: [429, 500, 502, 503, 504]
      retry:
        type: exponential
        interval: PT5S
        maxInterval: PT1M
        maxAttempts: 4

  - id: processed_release
    type: io.kestra.plugin.core.kv.Get
    key: "{{ inputs.state_key }}_release"
    errorOnMissing: false

  - id: new_release
    type: io.kestra.plugin.core.flow.If
    description: Scores only when FAERS has a new `last_updated` date (or `force` is set). Otherwise the run ends after two KV and one HTTP call.
    condition: "{{ inputs.force or (outputs.processed_release.value ?? '') != fromJson(outputs.release.body).meta.last_updated }}"
    then:
      - id: background
        type: io.kestra.plugin.core.http.Download
        description: Reaction counts for all reports in the window, the top 999 preferred terms (keyless requests are capped at 999; 1000 needs an API key).
        uri: https://api.fda.gov/drug/event.json
        params:
          search: "receivedate:[{{ outputs.plan.outputs[0].row.window_from }} TO {{ outputs.plan.outputs[0].row.window_to }}]"
          count: patient.reaction.reactionmeddrapt.exact
          limit: "999"
        headers:
          User-Agent: "kestra-openfda-faers-signal-check/1.0 (https://kestra.io)"
        options:
          retryOnStatusCodes: [429, 500, 502, 503, 504]
          retry:
            type: exponential
            interval: PT5S
            maxInterval: PT1M
            maxAttempts: 4

      - id: per_drug
        type: io.kestra.plugin.core.flow.Loop
        description: Two requests per drug, one at a time. 404 is openFDA's "No matches found!" and becomes a NOT_FOUND drug instead of a failure.
        values: "{{ outputs.plan.outputs[0].row.items }}"
        concurrencyLimit: 1
        tasks:
          - id: drug_total
            type: io.kestra.plugin.core.http.Request
            uri: https://api.fda.gov/drug/event.json
            params:
              search: 'patient.drug.activesubstance.activesubstancename.exact:"{{ fromJson(item.value).drug }}" AND receivedate:[{{ fromJson(item.value).from }} TO {{ fromJson(item.value).to }}]'
              limit: "0"
            headers:
              User-Agent: "kestra-openfda-faers-signal-check/1.0 (https://kestra.io)"
            options:
              allowedResponseCodes: [200, 404]
              retryOnStatusCodes: [429, 500, 502, 503, 504]
              retry:
                type: exponential
                interval: PT5S
                maxInterval: PT1M
                maxAttempts: 4
          - id: drug_reactions
            type: io.kestra.plugin.core.http.Download
            uri: https://api.fda.gov/drug/event.json
            params:
              search: 'patient.drug.activesubstance.activesubstancename.exact:"{{ fromJson(item.value).drug }}" AND receivedate:[{{ fromJson(item.value).from }} TO {{ fromJson(item.value).to }}]'
              count: patient.reaction.reactionmeddrapt.exact
              limit: "999"
            headers:
              User-Agent: "kestra-openfda-faers-signal-check/1.0 (https://kestra.io)"
            options:
              allowedResponseCodes: [200, 404]
              retryOnStatusCodes: [429, 500, 502, 503, 504]
              retry:
                type: exponential
                interval: PT5S
                maxInterval: PT1M
                maxAttempts: 4
        outputs:
          - id: idx
            type: INT
            value: "{{ fromJson(item.value).idx }}"
          - id: drug
            type: STRING
            value: "{{ fromJson(item.value).drug }}"
          - id: total
            type: INT
            value: "{{ fromJson(outputs.drug_total.body).meta.results.total ?? 0 }}"
          - id: uri
            type: STRING
            value: "{{ outputs.drug_reactions.uri }}"

      - id: reported_signals
        type: io.kestra.plugin.core.kv.Get
        key: "{{ inputs.state_key }}_signals"
        errorOnMissing: false

      - id: score
        type: io.kestra.plugin.jdbc.duckdb.Queries
        description: |
          Builds the 2x2 table per drug and reaction: a = drug and reaction, b = drug without the reaction,
          c = reaction without the drug, d = neither. PRR = (a/(a+b)) / (c/(c+d)), ROR = ad/bc with a log-normal
          95% CI, chi-square with Yates correction. A reaction missing from the 999-term background is rarer than the
          last background term, so that term's count is used as an upper bound for its reports; c is then overstated
          and PRR/ROR are conservative (flagged `background_bound`).
        url: "jdbc:duckdb:"
        timeZoneId: UTC
        fetchType: FETCH_ONE
        inputFiles: "{{ outputs.per_drug.outputs | jq('[.[].outputs | {key: (\"drug_\" + (.idx | tostring) + \".json\"), value: .uri}] | from_entries') | first | toJson }}"
        outputFiles:
          - signals_csv
        parameters:
          background: "{{ read(outputs.background.uri) }}"
          drugs: "{{ outputs.per_drug.outputs | jq('[.[].outputs | {idx, drug, total}]') | first | toJson }}"
          n_total: "{{ fromJson(outputs.release.body).meta.results.total }}"
          exclude: "{{ inputs.exclude_terms }}"
          min_cases: "{{ inputs.min_cases }}"
          min_prr: "{{ inputs.min_prr }}"
          min_chi: "{{ inputs.min_chi_square }}"
          seen: "{{ outputs.reported_signals.value ?? [] | toJson }}"
          baseline: "{{ outputs.reported_signals.value is not defined }}"
        sql: |
          CREATE TABLE bg AS SELECT r.term, CAST(r.count AS DOUBLE) AS n_e
            FROM (SELECT unnest(from_json(json_extract(CAST(:background AS JSON), '$.results'), '[{"term":"VARCHAR","count":"BIGINT"}]')) AS r);
          CREATE TABLE floor AS SELECT CASE WHEN count(*) >= 999 THEN min(n_e) END AS n_e FROM bg;
          CREATE TABLE drugs AS SELECT * FROM (SELECT unnest(from_json(:drugs, '[{"idx":"INTEGER","drug":"VARCHAR","total":"BIGINT"}]'), recursive := true));
          CREATE TABLE docs AS SELECT CAST(regexp_extract(filename, 'drug_([0-9]+)', 1) AS INTEGER) AS idx, json AS doc
            FROM read_json_objects('drug_*.json', format = 'unstructured', filename = true);
          CREATE TABLE pairs AS
          SELECT dr.drug, r.term AS reaction, CAST(r.count AS DOUBLE) AS a, CAST(dr.total AS DOUBLE) AS n_d,
                 coalesce(bg.n_e, (SELECT n_e FROM floor)) AS n_e, bg.n_e IS NULL AS background_bound,
                 CAST(:n_total AS DOUBLE) AS n
          FROM docs JOIN drugs dr USING (idx),
               (SELECT unnest(from_json(json_extract(doc, '$.results'), '[{"term":"VARCHAR","count":"BIGINT"}]')) AS r) AS x
          LEFT JOIN bg ON bg.term = r.term
          WHERE NOT regexp_full_match(r.term, :exclude);
          CREATE TABLE cells AS SELECT drug, reaction, background_bound, a, n_d - a AS b, n_e - a AS c, n - n_d - n_e + a AS d, n_d, n_e FROM pairs WHERE n_e IS NOT NULL;
          CREATE TABLE stats AS
          SELECT *, (a / (a + b)) / nullif(c / (c + d), 0) AS prr,
                 (a * d) / nullif(b * c, 0) AS ror,
                 exp(ln((a * d) / nullif(b * c, 0)) - 1.96 * sqrt(1 / a + 1 / nullif(b, 0) + 1 / nullif(c, 0) + 1 / d)) AS ror_lci,
                 exp(ln((a * d) / nullif(b * c, 0)) + 1.96 * sqrt(1 / a + 1 / nullif(b, 0) + 1 / nullif(c, 0) + 1 / d)) AS ror_uci,
                 (a + b + c + d) * power(greatest(abs(a * d - b * c) - (a + b + c + d) / 2, 0), 2) / ((a + b) * (c + d) * (a + c) * (b + d)) AS chi_square
          FROM cells;
          CREATE TABLE scored AS
          SELECT s.*, a >= CAST(:min_cases AS INTEGER) AND prr >= CAST(:min_prr AS DOUBLE) AND chi_square >= CAST(:min_chi AS DOUBLE) AND ror_lci > 1 AS is_signal,
                 (drug || '|' || reaction) NOT IN (SELECT unnest(from_json(:seen, '["VARCHAR"]'))) AS is_new
          FROM stats s;
          COPY (SELECT drug, reaction, CAST(a AS BIGINT) AS a, CAST(b AS BIGINT) AS b, CAST(c AS BIGINT) AS c, CAST(d AS BIGINT) AS d,
                       round(prr, 2) AS prr, round(ror, 2) AS ror, round(ror_lci, 2) AS ror_lci, round(ror_uci, 2) AS ror_uci,
                       round(chi_square, 1) AS chi_square, background_bound, is_signal, is_signal AND is_new AS new_signal
                FROM scored ORDER BY is_signal DESC, drug, prr DESC) TO '{{ outputFiles.signals_csv }}' (HEADER, DELIMITER ',');
          SELECT (SELECT count(*) FROM drugs) AS drugs,
                 (SELECT coalesce(string_agg(drug, ', '), '') FROM drugs WHERE total = 0) AS not_found,
                 (SELECT count(*) FROM scored) AS pairs_scored,
                 (SELECT count(*) FROM scored WHERE is_signal) AS signals,
                 (SELECT count(*) FROM scored WHERE is_signal AND is_new) AS new_signals,
                 CAST(:baseline AS BOOLEAN) AS baseline,
                 (SELECT coalesce(string_agg(drug || ' (' || n || ')', ', ' ORDER BY drug), '') FROM (SELECT drug, count(*) AS n FROM scored WHERE is_signal GROUP BY drug)) AS per_drug,
                 (SELECT coalesce(string_agg(line, chr(10)), '') FROM (
                    SELECT drug || ' / ' || reaction || ': a=' || CAST(a AS BIGINT) || ', PRR ' || round(prr, 2) || ', ROR ' || round(ror, 2)
                           || ' (95% CI ' || round(ror_lci, 2) || '-' || round(ror_uci, 2) || '), chi2 ' || round(chi_square, 1) AS line
                    FROM scored WHERE is_signal AND is_new ORDER BY prr * ln(a) DESC LIMIT 15)) AS top_new,
                 CAST((SELECT json_group_array(k) FROM (SELECT unnest(from_json(:seen, '["VARCHAR"]')) AS k
                        UNION SELECT drug || '|' || reaction FROM scored WHERE is_signal)) AS VARCHAR) AS seen_after;

      - id: notify
        type: io.kestra.plugin.core.flow.If
        condition: "{{ outputs.score.outputs[0].row.new_signals > 0 }}"
        then:
          - id: log_signals
            type: io.kestra.plugin.core.log.Log
            level: WARN
            message: "{{ outputs.score.outputs[0].row.baseline ? 'BASELINE: ' : '' }}{{ outputs.score.outputs[0].row.new_signals }} new disproportionality signal(s), FAERS {{ fromJson(outputs.release.body).meta.last_updated }}. Top by PRR x ln(a):\n{{ outputs.score.outputs[0].row.top_new }}"
          - id: slack
            type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
            allowFailure: true
            description: allowFailure keeps the run green when the webhook secret is not configured.
            url: "{{ secret('SLACK_WEBHOOK_URL') }}"
            payload: "{{ {'text': (outputs.score.outputs[0].row.baseline ? '*Baseline* ' : '') ~ '*' ~ outputs.score.outputs[0].row.new_signals ~ ' new FAERS disproportionality signals* (data to ' ~ fromJson(outputs.release.body).meta.last_updated ~ ', reports received ' ~ outputs.plan.outputs[0].row.window_from ~ '-' ~ outputs.plan.outputs[0].row.window_to ~ ')\n' ~ outputs.score.outputs[0].row.top_new ~ '\nA signal is a statistical reporting imbalance to review, not evidence that the drug causes the reaction.'} | toJson }}"

      - id: save_signals
        type: io.kestra.plugin.core.kv.Set
        key: "{{ inputs.state_key }}_signals"
        kvType: JSON
        value: "{{ outputs.score.outputs[0].row.seen_after }}"

      - id: save_release
        type: io.kestra.plugin.core.kv.Set
        key: "{{ inputs.state_key }}_release"
        value: "{{ fromJson(outputs.release.body).meta.last_updated }}"

      - id: summary
        type: io.kestra.plugin.core.log.Log
        message: "FAERS {{ fromJson(outputs.release.body).meta.last_updated }}, {{ fromJson(outputs.release.body).meta.results.total }} reports {{ outputs.plan.outputs[0].row.window_from }}-{{ outputs.plan.outputs[0].row.window_to }}: {{ outputs.score.outputs[0].row.drugs }} drugs, {{ outputs.score.outputs[0].row.pairs_scored }} pairs scored, {{ outputs.score.outputs[0].row.signals }} signals ({{ outputs.score.outputs[0].row.per_drug }}), {{ outputs.score.outputs[0].row.new_signals }} new. Not found: {{ outputs.score.outputs[0].row.not_found is empty ? 'none' : outputs.score.outputs[0].row.not_found }}"
    else:
      - id: unchanged
        type: io.kestra.plugin.core.log.Log
        message: "FAERS last_updated is still {{ fromJson(outputs.release.body).meta.last_updated }}, already scored. Nothing to do (set force to re-score)."

outputs:
  - id: summary
    type: JSON
    value: "{{ outputs.score.outputs[0].row ?? {} }}"
  - id: signals_csv
    type: STRING
    value: "{{ outputs.score.outputFiles.signals_csv ?? '' }}"

extend:
  title: openFDA FAERS Disproportionality Signal Check (PRR, ROR, Chi-Square)
  metaTitle: FAERS Drug Safety Signal Detection with openFDA, DuckDB and Slack | Kestra
  shortDescription: After each FAERS refresh, compute PRR, ROR with 95% CI and Yates chi-square for every reaction reported with a watchlist of drugs, using openFDA count queries, and alert in Slack on signals not reported before.
  metaDescription: Quarterly FAERS disproportionality screen with openFDA count queries, PRR, ROR and chi-square in DuckDB, KV dedupe and Slack alerts on new signals.
  description: |
    Screen the FDA Adverse Event Reporting System (FAERS) for drug-reaction pairs reported more often than expected, without downloading the quarterly FAERS files. openFDA `count=` queries return the reaction counts per drug and for the whole database, DuckDB computes the disproportionality statistics, and the KV store reports each signal once.

    **A signal is a statistical hint, not causation.** FAERS is spontaneous reporting: reports are unverified, duplicates exist, the drug's own indication shows up as a reaction (montelukast and ASTHMA), and media attention inflates counts. A signal means "review these cases", never "this drug causes this reaction".

    ## How it works

    1. A weekly `Schedule` runs the check. `plan` (DuckDB) normalises the drug names and computes the receive-date window.
    2. `release` asks openFDA for the window total with `limit=0`, which returns only `meta` (one FAERS record can be megabytes). If `meta.last_updated` matches KV, `new_release` (If) stops the run unless `force` is set.
    3. `background` downloads the reaction counts of all reports in the window (`count=patient.reaction.reactionmeddrapt.exact`, `limit=999`, the keyless maximum).
    4. `per_drug` (Loop) gets each drug's report total and reaction counts by `activesubstancename.exact`. openFDA's 404 "No matches found!" is accepted, so a misspelt name is listed as not found instead of failing.
    5. `score` (DuckDB) builds a = drug and reaction, b = drug without it, c = reaction without the drug, d = neither, then PRR, ROR with its 95% CI and the Yates chi-square. A pair is a signal when a >= `min_cases`, PRR >= `min_prr`, chi-square >= `min_chi_square` and the lower ROR bound is above 1. `exclude_terms` drops medication-error and product terms. A reaction outside the top 999 background terms uses the last term's count as an upper bound, so its PRR is conservative (`background_bound`).
    6. New signals are logged and posted to Slack (top 15); signal keys and the release date go to KV.

    ## What you get

    - A CSV of every scored pair with the four cells, PRR, ROR and CI, chi-square and flags.
    - One alert per new drug-reaction signal. Adding a drug alerts only on that drug's signals.
    - Eight API calls for three drugs, no API key, and an early exit between releases.

    ## Who it's for

    - Pharmacovigilance, drug safety and regulatory affairs teams, and data scientists building a screening baseline.

    ## Why orchestrate this with Kestra

    - Release gate, retries on 429/5xx and KV state instead of a cron script and a state file; thresholds are UI inputs.

    ## Prerequisites

    - Kestra 2.0 with the DuckDB and Slack plugins, and HTTPS to `api.fda.gov` (keyless: 240 requests/minute, 1,000/day).

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack incoming webhook (optional; without it the `slack` task warns and the run still succeeds).

    ## Quick start

    1. Execute with the defaults. The first run is a baseline that reports every current signal (atorvastatin and RHABDOMYOLYSIS, semaglutide and PANCREATITIS, montelukast and NIGHTMARE) and stores them.
    2. Execute again: FAERS has not changed, so the run ends after the release check.
    3. Add a drug and set `force`: only the new drug's signals alert.
    4. Add `SLACK_WEBHOOK_URL` and leave the weekly schedule on.

    ## How to extend

    - Add `serious:1` to the searches to screen serious cases only.
    - Add an Information Component (BCPNN) or EBGM column, or open a case-review ticket per signal.

    ## Links

    - [openFDA drug adverse event API](https://open.fda.gov/apis/drug/event/) and [count queries](https://open.fda.gov/apis/query-syntax/)
    - [DuckDB Queries](https://kestra.io/plugins/plugin-jdbc-duckdb/io.kestra.plugin.jdbc.duckdb.queries), [Loop](https://kestra.io/plugins/core/flow/io.kestra.plugin.core.flow.loop) and [KV Store](https://kestra.io/docs/concepts/kv-store)
    - [Slack Incoming Webhook](https://kestra.io/plugins/plugin-notifications/slack/io.kestra.plugin.slack.notifications.slackincomingwebhook)
    - [Evans et al. 2001, use of PRRs for signal generation](https://doi.org/10.1002/pds.677)
  tags:
    - Data
  subTags:
    - Monitoring & Alerting
    - Testing & Quality
  ee: false
  demo: false
