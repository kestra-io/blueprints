id: victorialogs-log-ingestion-and-storage-sentinel
namespace: company.sre

inputs:
  - id: victorialogs_url
    type: STRING
    defaults: http://localhost:9428
    description: Base URL of the VictoriaLogs service instance.

  - id: error_threshold
    type: INT
    defaults: 20
    description: Maximum allowable error log records in the 15-minute evaluation window before triggering an alert.

  - id: slack_channel
    type: STRING
    defaults: "#ops-alerts"
    description: Destination Slack channel for operational warnings and critical incident notifications.

tasks:
  - id: probe_victorialogs_health
    type: io.kestra.plugin.core.http.Request
    method: GET
    uri: "{{ inputs.victorialogs_url }}/health"
    description: Probes VictoriaLogs cluster node health endpoint to verify availability.

  - id: query_error_logs
    type: io.kestra.plugin.core.http.Request
    method: POST
    uri: "{{ inputs.victorialogs_url }}/select/logsql/hits"
    headers:
      Authorization: "Bearer {{ secret('VICTORIALOGS_AUTH_TOKEN') }}"
      Content-Type: application/x-www-form-urlencoded
    body: "query=_time:15m AND (level:error OR level:critical)"
    description: Executes LogSQL query to measure error log occurrences over the last 15 minutes.

  - id: evaluate_sentinel_state
    type: io.kestra.plugin.core.flow.Switch
    value: "{{ (outputs.probe_victorialogs_health.code != 200) ? 'CRITICAL' : ((outputs.query_error_logs.body.total ?? 0) > inputs.error_threshold ? 'ELEVATED' : 'HEALTHY') }}"
    description: Evaluates HTTP probe code and LogSQL error frequency against defined operational thresholds.
    cases:
      CRITICAL:
        - id: alert_slack_critical
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "channel": "{{ inputs.slack_channel }}",
              "text": "[CRITICAL] VictoriaLogs cluster health probe failed at endpoint {{ inputs.victorialogs_url }}. HTTP status code: {{ outputs.probe_victorialogs_health.code }}."
            }
          description: Dispatches high-severity outage alert to Slack when health probe fails.

      ELEVATED:
        - id: alert_slack_elevated
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "channel": "{{ inputs.slack_channel }}",
              "text": "[WARNING] VictoriaLogs error surge detected. Observed errors in last 15 minutes: {{ outputs.query_error_logs.body.total ?? 0 }} (Threshold: {{ inputs.error_threshold }})."
            }
          description: Sends warning notification to Slack when error volume exceeds threshold.

      HEALTHY:
        - id: log_healthy_status
          type: io.kestra.plugin.core.log.Log
          message: "VictoriaLogs cluster is operational. Error log count is within nominal limits."
          description: Emits normal status confirmation when checks pass.

  - id: audit_sentinel_execution
    type: io.kestra.plugin.core.log.Log
    message: "VictoriaLogs Sentinel complete. Health Code: {{ outputs.probe_victorialogs_health.code }}, Errors: {{ outputs.query_error_logs.body.total ?? 0 }}, Classification: {{ (outputs.probe_victorialogs_health.code != 200) ? 'CRITICAL' : ((outputs.query_error_logs.body.total ?? 0) > inputs.error_threshold ? 'ELEVATED' : 'HEALTHY') }}."
    description: Emits an immutable audit log entry capturing cluster telemetry for compliance and observability.

triggers:
  - id: hourly_sentinel_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 * * * *"
    description: Executes periodic continuous monitoring probe on an hourly cadence.

extend:
  title: VictoriaLogs Log Ingestion and Storage Sentinel
  metaTitle: VictoriaLogs Log Ingestion and Storage Sentinel | Kestra
  shortDescription: Continuously probe VictoriaLogs cluster health, inspect error log frequency using LogSQL, and dispatch incident alerts to Slack.
  metaDescription: Monitor VictoriaLogs cluster node health and error log surges with LogSQL, evaluate thresholds using Pebble, and route alerts to Slack with Kestra.
  description: |
    Automated health gate and error surge sentinel for VictoriaLogs high-throughput log management clusters. This workflow continuously validates node availability, executes LogSQL queries to detect application error bursts, evaluates operational thresholds using declarative Pebble expressions, and dispatches incident notifications to Slack.

    ## How it works

    1. Scheduled trigger initiates the sentinel check hourly (or manually on demand with custom parameters).
    2. Probes the VictoriaLogs `/health` HTTP endpoint to ensure the storage node is accessible and responsive.
    3. Issues a LogSQL query via the VictoriaLogs `/select/logsql/hits` API endpoint to calculate the volume of error-level logs over the preceding 15-minute window.
    4. Evaluates cluster responsiveness and error thresholds via a declarative Pebble expression inside a Switch task.
    5. Dispatches formatted Slack alerts on critical node outages or elevated error surges, or logs an operational confirmation when metrics remain nominal.
    6. Emits an immutable audit log entry recording probe response codes, error frequencies, and state classifications.

    ## What you get

    - Continuous verification of VictoriaLogs ingestion engine readiness and node liveness.
    - Automated detection of critical log spikes across microservices before they cascade.
    - Real-time Slack incident notifications containing exact error counts and endpoint details.
    - Structured audit logs stored within Kestra for long-term reliability and compliance tracking.

    ## Who it's for

    - Platform Engineers maintaining high-throughput logging infrastructure.
    - Site Reliability Engineers (SREs) managing distributed observability clusters.
    - DevOps Teams operating VictoriaMetrics and VictoriaLogs in Kubernetes or cloud environments.

    ## Why orchestrate this with Kestra

    - Declarative YAML definition replaces bespoke Python monitoring scripts and brittle crontabs.
    - Native Pebble expression engine provides deterministic status classification without external runtime overhead.
    - Centralized secret management protects authentication tokens and webhook endpoints with end-to-end encryption.
    - Built-in audit trail and visual topology deliver instant execution transparency across all tasks.

    ## Prerequisites

    - Accessible VictoriaLogs server instance (local Docker container, virtual machine, or Kubernetes cluster).
    - Valid read credentials or bearer token for VictoriaLogs query endpoints.
    - Slack Incoming Webhook URL configured with write permissions for your alerts channel.

    ### Secrets

    - `VICTORIALOGS_AUTH_TOKEN`: Bearer token or API key for authenticating HTTP requests to VictoriaLogs.
    - `SLACK_WEBHOOK_URL`: HTTPS endpoint for posting notifications to the operations Slack channel.

    ## Quick start

    1. Configure `VICTORIALOGS_AUTH_TOKEN` and `SLACK_WEBHOOK_URL` in your Kestra namespace secrets.
    2. Import this blueprint into Kestra and run **Execute** with default parameters to test cluster connectivity.
    3. Verify in the execution logs that `/health` returned HTTP 200 and the LogSQL query evaluated cleanly.
    4. Activate the `hourly_sentinel_schedule` trigger for continuous unattended monitoring.

    ## How to extend

    - Add automated PagerDuty or Opsgenie escalation paths for off-hours critical downtime alerts.
    - Chain Kubernetes or Docker restart tasks to automatically recycle unresponsive VictoriaLogs pods.
    - Parameterize queries to scan specific application streams or tenant namespaces in parallel.

    ## Links

    - [Kestra HTTP Plugin](https://kestra.io/plugins/plugin-core/tasks/http/io.kestra.plugin.core.http.request)
    - [Kestra Slack Plugin](https://kestra.io/plugins/plugin-slack/tasks/notifications/io.kestra.plugin.slack.notifications.slackincomingwebhook)
    - [VictoriaLogs Documentation](https://docs.victoriametrics.com/victorialogs/)
  tags:
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - Incident Response
  ee: false
  verified: false
  demo: false
