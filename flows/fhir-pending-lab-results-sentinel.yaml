id: fhir-pending-lab-results-sentinel
namespace: company.team
description: |
  On a schedule, read-only search a FHIR R4 server for lab reports that are
  still registered, partial or preliminary long after the specimen was
  collected (nothing is created, updated or deleted), and classify the
  backlog as HEALTHY, WARNING, CRITICAL or UNREACHABLE. Log quiet runs and
  page Slack when results are stuck before they reach clinicians.

inputs:
  - id: fhir_base_url
    type: STRING
    defaults: "https://fhir.example.org/fhir"
    displayName: "FHIR Base URL"
    description: "FHIR R4 service base URL, without a trailing slash (the URL that /metadata is served under)."
  - id: category
    type: STRING
    defaults: "LAB"
    displayName: "Report Category"
    description: "DiagnosticReport category code to watch (HL7 v2-0074), for example LAB, MB (microbiology) or HM (hematology)."
  - id: stale_hours
    type: INT
    defaults: 24
    displayName: "Stale After (hours)"
    description: "A report that is still registered, partial or preliminary this many hours after its clinically relevant time (specimen collection) counts as stale."
  - id: critical_hours
    type: INT
    defaults: 72
    displayName: "Critical After (hours)"
    description: "If any report is still not final this many hours after collection, the check is classified CRITICAL."
  - id: critical_stale_count
    type: INT
    defaults: 10
    displayName: "Critical Stale Count"
    description: "At or above this many stale reports, the check is classified CRITICAL even if none has reached critical_hours."

variables:
  pending_search: "{{ inputs.fhir_base_url }}/DiagnosticReport?status=registered,partial,preliminary&category={{ inputs.category }}"

triggers:
  - id: hourly_results_check
    type: io.kestra.plugin.core.trigger.Schedule
    description: Check the results backlog every hour. Shipped disabled; enable it once fhir_base_url and the FHIR_ACCESS_TOKEN secret point at a real server and a manual run has been verified.
    cron: "15 * * * *"
    disabled: true
    inputs:
      fhir_base_url: "https://fhir.example.org/fhir"

tasks:
  - id: read_capability_statement
    type: io.kestra.plugin.core.http.Request
    description: Read the server's CapabilityStatement from /metadata, limited with _elements to the FHIR version, software and kind (a full CapabilityStatement can be several megabytes), to confirm the endpoint is a reachable FHIR server before trusting any search result. This is a GET; nothing is changed.
    uri: "{{ inputs.fhir_base_url }}/metadata?_elements=fhirVersion,software,kind"
    method: GET
    headers:
      Accept: application/fhir+json
      Authorization: "Bearer {{ secret('FHIR_ACCESS_TOKEN') }}"
      Cache-Control: no-cache
    options:
      allowFailed: true
      timeout:
        connectTimeout: PT10S
        readIdleTimeout: PT30S
    retry:
      type: constant
      interval: PT15S
      maxAttempts: 3
    allowFailure: true

  - id: search_pending_reports
    type: io.kestra.plugin.core.http.Request
    description: Search DiagnosticReport for reports in the category that are not final yet, sorted by clinically relevant date, returning the accurate total and only the oldest report.
    runIf: "{{ outputs.read_capability_statement.code is defined and outputs.read_capability_statement.code == 200 and (outputs.read_capability_statement.body | trim | startsWith('{')) }}"
    uri: "{{ render(vars.pending_search) }}&_sort=date&_count=1&_total=accurate&_elements=code,status,effective"
    method: GET
    headers:
      Accept: application/fhir+json
      Authorization: "Bearer {{ secret('FHIR_ACCESS_TOKEN') }}"
      Cache-Control: no-cache
    options:
      allowFailed: true
      timeout:
        connectTimeout: PT10S
        readIdleTimeout: PT60S
    retry:
      type: constant
      interval: PT15S
      maxAttempts: 3
    allowFailure: true

  - id: count_stale_reports
    type: io.kestra.plugin.core.http.Request
    description: Count the same reports whose clinically relevant date is older than stale_hours, with _summary=count so no clinical data is returned.
    runIf: "{{ outputs.read_capability_statement.code is defined and outputs.read_capability_statement.code == 200 and (outputs.read_capability_statement.body | trim | startsWith('{')) }}"
    uri: "{{ render(vars.pending_search) }}&date=lt{{ now() | dateAdd(-inputs.stale_hours, 'HOURS') | date(\"yyyy-MM-dd'T'HH:mm:ss'Z'\", timeZone='UTC') }}&_summary=count"
    method: GET
    headers:
      Accept: application/fhir+json
      Authorization: "Bearer {{ secret('FHIR_ACCESS_TOKEN') }}"
      Cache-Control: no-cache
    options:
      allowFailed: true
      timeout:
        connectTimeout: PT10S
        readIdleTimeout: PT60S
    retry:
      type: constant
      interval: PT15S
      maxAttempts: 3
    allowFailure: true

  - id: count_critical_reports
    type: io.kestra.plugin.core.http.Request
    description: Count the reports whose clinically relevant date is older than critical_hours, with _summary=count.
    runIf: "{{ outputs.read_capability_statement.code is defined and outputs.read_capability_statement.code == 200 and (outputs.read_capability_statement.body | trim | startsWith('{')) }}"
    uri: "{{ render(vars.pending_search) }}&date=lt{{ now() | dateAdd(-inputs.critical_hours, 'HOURS') | date(\"yyyy-MM-dd'T'HH:mm:ss'Z'\", timeZone='UTC') }}&_summary=count"
    method: GET
    headers:
      Accept: application/fhir+json
      Authorization: "Bearer {{ secret('FHIR_ACCESS_TOKEN') }}"
      Cache-Control: no-cache
    options:
      allowFailed: true
      timeout:
        connectTimeout: PT10S
        readIdleTimeout: PT60S
    retry:
      type: constant
      interval: PT15S
      maxAttempts: 3
    allowFailure: true

  - id: classify_results_backlog
    type: io.kestra.plugin.core.debug.Return
    description: Combine the four responses in one jq query. Anything other than a CapabilityStatement from /metadata and a searchset Bundle with a total from each search (a missing response, a non-200 code, a body that is not JSON such as an HTML login page, an OperationOutcome) becomes UNREACHABLE instead of looking like an empty backlog.
    format: >-
      {{ (outputs.read_capability_statement.code is not defined or outputs.read_capability_statement.code != 200
      or outputs.search_pending_reports is not defined or outputs.search_pending_reports.code is not defined or outputs.search_pending_reports.code != 200
      or outputs.count_stale_reports is not defined or outputs.count_stale_reports.code is not defined or outputs.count_stale_reports.code != 200
      or outputs.count_critical_reports is not defined or outputs.count_critical_reports.code is not defined or outputs.count_critical_reports.code != 200
      or not (outputs.read_capability_statement.body | trim | startsWith('{')) or not (outputs.search_pending_reports.body | trim | startsWith('{'))
      or not (outputs.count_stale_reports.body | trim | startsWith('{')) or not (outputs.count_critical_reports.body | trim | startsWith('{')))
      ? '{"status":"UNREACHABLE","pending":0,"stale":0,"critical":0,"oldest":"none"}'
      : ({'m': fromJson(outputs.read_capability_statement.body), 'p': fromJson(outputs.search_pending_reports.body), 's': fromJson(outputs.count_stale_reports.body), 'c': fromJson(outputs.count_critical_reports.body)} | jq('
      if .m.resourceType != "CapabilityStatement"
      or .p.resourceType != "Bundle" or .s.resourceType != "Bundle" or .c.resourceType != "Bundle"
      or (.p.total | type) != "number" or (.s.total | type) != "number" or (.c.total | type) != "number"
      then {status: "UNREACHABLE", pending: 0, stale: 0, critical: 0, oldest: "none"}
      else
      (.p.entry[0].resource // null) as $o
      | {fhir_version: .m.fhirVersion, pending: .p.total, stale: .s.total, critical: .c.total,
      oldest: (if $o == null then "none" else (($o.code.text // $o.code.coding[0].display // $o.code.coding[0].code // "report") + " (" + $o.status + ", collected " + ($o.effectiveDateTime // $o.effectivePeriod.start // "unknown") + ", DiagnosticReport/" + $o.id + ")") end),
      status: (if .c.total > 0 or .s.total >= ' ~ inputs.critical_stale_count ~ ' then "CRITICAL"
      elif .s.total > 0 then "WARNING"
      else "HEALTHY" end)}
      end
      ') | first | toJson) }}

  - id: route_by_backlog
    type: io.kestra.plugin.core.flow.Switch
    description: Route to a quiet log when no report is stale, an informational Slack message when some are, or a Slack page when reports are critically late or the FHIR server could not be read.
    value: "{{ fromJson(outputs.classify_results_backlog.value).status }}"
    cases:
      "HEALTHY":
        - id: log_healthy
          type: io.kestra.plugin.core.log.Log
          description: Log a quiet confirmation when no pending report is older than stale_hours.
          message: "FHIR {{ inputs.category }} results healthy: {{ fromJson(outputs.classify_results_backlog.value).pending }} report(s) not final yet, none older than {{ inputs.stale_hours }} hour(s)."
      "WARNING":
        - id: alert_warning_backlog
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: Post an informational Slack message when some reports are still not final after stale_hours.
          url: "{{ secret('SLACK_WEBHOOK') }}"
          payload: |
            {
              "text": "FHIR {{ inputs.category }} results WARNING: {{ fromJson(outputs.classify_results_backlog.value).stale }} of {{ fromJson(outputs.classify_results_backlog.value).pending }} unfinished report(s) are older than {{ inputs.stale_hours }} hour(s). Oldest: {{ fromJson(outputs.classify_results_backlog.value).oldest }}. Execution {{ execution.id }}."
            }
      "CRITICAL":
        - id: alert_critical_backlog
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: Page Slack when reports are still not final after critical_hours, or too many are stale, which usually means an interface, analyzer or validation queue is stuck.
          url: "{{ secret('SLACK_WEBHOOK') }}"
          payload: |
            {
              "text": "FHIR {{ inputs.category }} results CRITICAL: {{ fromJson(outputs.classify_results_backlog.value).critical }} report(s) still not final after {{ inputs.critical_hours }} hour(s), {{ fromJson(outputs.classify_results_backlog.value).stale }} after {{ inputs.stale_hours }} hour(s). Oldest: {{ fromJson(outputs.classify_results_backlog.value).oldest }}. Results may not be reaching clinicians. Execution {{ execution.id }}."
            }
      "UNREACHABLE":
        - id: alert_unreachable_server
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: Page Slack when the FHIR server could not be read, did not answer like a FHIR server, or rejected the search.
          url: "{{ secret('SLACK_WEBHOOK') }}"
          payload: |
            {
              "text": "FHIR {{ inputs.category }} results UNREACHABLE: {{ inputs.fhir_base_url }} did not return a CapabilityStatement and searchset Bundles (server down, expired access token, wrong base URL, or search rejected). The results backlog is unknown. Execution {{ execution.id }}."
            }
    defaults:
      - id: log_unclassified
        type: io.kestra.plugin.core.log.Log
        description: Log any classification outside the four known values, so a change in the jq query never fails silently.
        message: "FHIR pending lab results sentinel completed with an unexpected classification: {{ outputs.classify_results_backlog.value }}."

  - id: log_audit_result
    type: io.kestra.plugin.core.log.Log
    description: Record one audit line for every run, whichever branch fired, with the HTTP codes and the classification, so the check's own history stays queryable even if Slack delivery fails.
    message: "FHIR pending lab results audit: server={{ inputs.fhir_base_url }} category={{ inputs.category }} metadata_http={{ outputs.read_capability_statement.code ?? 'n/a' }} pending_http={{ outputs.search_pending_reports.code ?? 'n/a' }} stale_http={{ outputs.count_stale_reports.code ?? 'n/a' }} critical_http={{ outputs.count_critical_reports.code ?? 'n/a' }} result={{ outputs.classify_results_backlog.value }} execution={{ execution.id }}."

errors:
  - id: alert_flow_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alert Slack when the sentinel flow itself fails outright, so a broken check is never mistaken for an empty results backlog.
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "text": "FHIR pending lab results sentinel flow {{ flow.id }} FAILED (execution {{ execution.id }}). The {{ inputs.category }} results backlog at {{ inputs.fhir_base_url }} is unknown; check the task logs and the FHIR server manually."
      }

outputs:
  - id: status
    type: STRING
    value: "{{ outputs.classify_results_backlog is defined ? fromJson(outputs.classify_results_backlog.value).status : 'UNREACHABLE' }}"
  - id: backlog
    type: JSON
    value: "{{ outputs.classify_results_backlog is defined ? outputs.classify_results_backlog.value : '{\"status\":\"UNREACHABLE\"}' }}"

extend:
  title: "FHIR Pending Lab Results Sentinel"
  shortDescription: Read-only search of a FHIR R4 server on a schedule, paging Slack when lab reports stay registered, partial or preliminary too long after collection.
  metaTitle: FHIR Pending Lab Results Sentinel for Kestra
  metaDescription: Search a FHIR R4 server on a schedule, change nothing, and alert Slack when lab reports stay unfinished too long after collection or the server is down.
  description: |
    A lab result that is stuck as `registered` or `preliminary` is a result a clinician is not acting on. It happens when an analyzer interface stops, a validation queue backs up, or a message fails between the laboratory system and the EHR, and nothing pages anyone: the report simply never becomes `final`. This blueprint turns standard FHIR R4 searches into a scheduled results backlog gate: `/metadata` proves the server is really answering, `DiagnosticReport` searches return how many reports in the category are not final, how many are older than `stale_hours` and `critical_hours` after collection, and the oldest one, and the result routes to a quiet log, an informational Slack note or a Slack page.

    ## How it works

    1. `read_capability_statement` (`io.kestra.plugin.core.http.Request`) reads `/metadata?_elements=fhirVersion,software,kind`. Only a `CapabilityStatement` counts as a working FHIR server. Every request is a GET with a bearer token, `Cache-Control: no-cache`, a timeout, three retries, `allowFailed: true` and `allowFailure: true`, so an outage never aborts the flow.
    2. `search_pending_reports` searches `DiagnosticReport?status=registered,partial,preliminary&category=<category>` sorted by `date` with `_count=1`, `_total=accurate` and `_elements=code,status,effective`: the total pending, and only the oldest report.
    3. `count_stale_reports` and `count_critical_reports` run the same search with `date=lt<now minus stale_hours>` and `date=lt<now minus critical_hours>` and `_summary=count`, so they return a count and no clinical data. The three searches only run when `/metadata` answered.
    4. `classify_results_backlog` (`io.kestra.plugin.core.debug.Return`) checks every response in one jq query: a missing response, a non-200 code, anything other than a `CapabilityStatement` and searchset `Bundle`s with a numeric `total` (for example an `OperationOutcome` or an HTML login page) becomes `UNREACHABLE`. Otherwise any report past `critical_hours`, or at least `critical_stale_count` past `stale_hours`, is `CRITICAL`; any report past `stale_hours` is `WARNING`; otherwise `HEALTHY`.
    5. `route_by_backlog` (`io.kestra.plugin.core.flow.Switch`) logs `HEALTHY` quietly, posts a Slack note for `WARNING`, pages Slack for `CRITICAL` and `UNREACHABLE`, and logs any unexpected value in `defaults`.
    6. `log_audit_result` writes one audit line per run with all four HTTP codes and the classification. The flow-level `errors` block alerts Slack if the flow fails outright, and the `hourly_results_check` trigger ships `disabled: true`.

    ## What you get

    - A scheduled, read-only results backlog check against any FHIR R4 server (HAPI FHIR, Microsoft Azure Health Data Services, Google Cloud Healthcare API, AWS HealthLake, an EHR's FHIR endpoint) with no vendor plugin.
    - A `status` output (`HEALTHY` / `WARNING` / `CRITICAL` / `UNREACHABLE`) other flows can gate on, and a `backlog` JSON output with `pending`, `stale`, `critical`, `fhir_version` and `oldest`.
    - Slack messages that name the oldest unfinished report by test, status, collection time and resource id, for example `Potassium [Moles/volume] in Serum or Plasma (preliminary, collected 2026-10-10T08:00:00Z, DiagnosticReport/1003)`, without patient identifiers.
    - An audit log line on every run, so the backlog's history survives a Slack outage.

    ## Who it's for

    - Laboratory and clinical informatics teams who run or feed a FHIR server and need to know when results stop flowing.
    - Integration and interface engineers responsible for analyzer, LIS and EHR feeds.
    - Data platform teams already using Kestra who want the same alerting for their health data platform.

    ## Why orchestrate this with Kestra

    Interface engines alert when a message fails, but not when a report quietly stays preliminary for three days. Kestra runs the same standard FHIR searches on a schedule against any server, classifies the result in one typed status, keeps every run in the execution history, and routes it to the right channel, while the Switch branches are ready to grow into real follow-up (a ticket for the interface team, a per-department digest) without changing the check.

    ## Prerequisites

    - A FHIR R4 server that supports `DiagnosticReport` search by `status`, `category` and `date`, plus `_sort`, `_total` and `_summary=count` (HAPI FHIR does).
    - A read-only access token for a system account (for example a SMART Backend Services client with `system/DiagnosticReport.read`). For a server without authentication, any value works.
    - A Slack incoming webhook for the WARNING, CRITICAL, UNREACHABLE and flow-failure alerts.

    ### Secrets

    - `FHIR_ACCESS_TOKEN`: bearer token sent in the `Authorization` header.
    - `SLACK_WEBHOOK`: Slack incoming webhook used for every alert branch and the flow-failure alert.

    In Kestra OSS (no Enterprise secrets backend), secrets are supplied as environment variables prefixed `SECRET_` and base64-encoded, then read in flows with `{{ secret('NAME') }}`, for example `SECRET_FHIR_ACCESS_TOKEN=$(echo -n '<token>' | base64)`.

    ## Quick start

    1. To try it without a production server, run the open-source HAPI FHIR JPA server locally (the `hapiproject/hapi` image or the `hapi-fhir-jpaserver-starter` project), and load a few `DiagnosticReport` resources with `category` `LAB`, different `status` values and `effectiveDateTime` values hours or days in the past.
    2. Add `FHIR_ACCESS_TOKEN` and `SLACK_WEBHOOK` as secrets, set `fhir_base_url` (for example `http://localhost:8080/fhir`), and run the flow once. Reports that are still `preliminary` more than 24 hours after collection make the status `WARNING`, more than 72 hours `CRITICAL`.
    3. Update those reports to `final` and run again: the status becomes `HEALTHY`.
    4. Enable `hourly_results_check` once pointed at the real server.

    ## How to extend

    - Add `code=` to the searches to watch only critical tests (for example potassium or troponin) with a tighter `stale_hours`.
    - Run the flow once per `category` (LAB, MB, HM) with a `ForEach`, each with its own thresholds.
    - Add `_has` or `subject:Patient.organization=` filters to watch one hospital site in a shared server.
    - Store `status` and `stale` in the KV store and alert only when the backlog grows.

    ## Inputs

    - `fhir_base_url`: type STRING, default `"https://fhir.example.org/fhir"`.
    - `category`: type STRING, default `"LAB"`.
    - `stale_hours`: type INT, default `24`.
    - `critical_hours`: type INT, default `72`.
    - `critical_stale_count`: type INT, default `10`.

    ## Outputs

    - `status`: one of `HEALTHY`, `WARNING`, `CRITICAL`, `UNREACHABLE`.
    - `backlog`: the full classification as JSON, for example `{"fhir_version":"4.0.1","pending":9,"stale":7,"critical":2,"oldest":"...","status":"CRITICAL"}`.

    ## Links

    - [FHIR R4 DiagnosticReport and its search parameters](https://hl7.org/fhir/R4/diagnosticreport.html)
    - [FHIR R4 search (_sort, _total, _summary)](https://hl7.org/fhir/R4/search.html)
    - [HAPI FHIR JPA server starter](https://github.com/hapifhir/hapi-fhir-jpaserver-starter)
    - [Kestra HTTP Request task](https://kestra.io/plugins/core/tasks/http/io.kestra.plugin.core.http.request)
    - [Kestra Switch task](https://kestra.io/plugins/core/tasks/flow/io.kestra.plugin.core.flow.switch)

    ## Pitfalls

    - FHIR `date` on `DiagnosticReport` is the clinically relevant time (`effective[x]`, usually specimen collection), not when the report was created. Reports without `effective[x]` are not matched by the stale searches; they still count in `pending`.
    - Some servers do not support `_total=accurate` or `_summary=count` and leave `total` out. The flow reports `UNREACHABLE` rather than treating a missing total as zero; check your server's CapabilityStatement.
    - Category codes differ between systems (`LAB` from HL7 v2-0074 is the most common). Run one search by hand first to confirm your reports are tagged the way you expect.
    - The search response names the oldest report's test and id only (`_elements=code,status,effective`), and the Slack messages carry no patient data. Keep the audit logs and Slack channel inside your organisation anyway.
    - Some FHIR servers cache identical searches for a short time (HAPI FHIR reuses results for 60 seconds by default), which would report an old total. Every request sends `Cache-Control: no-cache` to get a fresh result; keep it if you add searches.
    - A full CapabilityStatement can be several megabytes (about 2 MB on HAPI FHIR), more than Kestra's default 1 MB limit for a task output, which is why `/metadata` is read with `_elements`. If your server ignores `_elements` there, use `_summary=true` instead or raise `kestra.task.outputs.limit`.
    - The check only reads. It never changes a report's status or contacts patients.
  tags:
    - Data
    - Business
  subTags:
    - Monitoring & Alerting
    - Day 2 Operations
  ee: false
  demo: false
