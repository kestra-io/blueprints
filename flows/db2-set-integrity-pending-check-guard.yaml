id: db2-set-integrity-pending-check-guard
namespace: company.team

description: |
  Find DB2 tables stuck in check-pending state and bring them back online. After a LOAD or after
  a constraint is added, DB2 can leave a table with SYSCAT.TABLES.STATUS set to 'C'. In that state the
  table rejects every SELECT and every DML statement with SQL0668N, so an application that reads it
  is simply down. It stays down until somebody runs SET INTEGRITY. This flow reads
  SYSCAT.TABLES.STATUS for a schema, orders the pending tables parents first from SYSCAT.REFERENCES
  because a child cannot be checked while its parent is still pending, then behind a dry run and a
  Pause runs SET INTEGRITY FOR ... IMMEDIATE CHECKED one table at a time. It reads STATUS again and
  fails the run if any target is still not 'N', then counts rows through the tables it cleared to
  prove they answer queries again. Read-only by default.

inputs:
  - id: jdbc_url
    type: STRING
    displayName: JDBC URL
    defaults: "jdbc:db2://localhost:50000/testdb"

  - id: jdbc_username
    type: STRING
    displayName: Database user
    defaults: "db2inst1"

  - id: jdbc_password
    type: STRING
    displayName: Database password
    description: Defaults to the DB2_PASSWORD secret. Override per run only for local testing.
    defaults: "{{ secret('DB2_PASSWORD') }}"

  - id: table_schema
    type: STRING
    displayName: Schema to scan
    description: Schema whose tables are read from SYSCAT.TABLES. Folded to upper case before the query runs.
    defaults: "DB2INST1"

  - id: violation_handling
    type: SELECT
    displayName: What to do with rows that break the constraint
    description: >-
      fail lets SET INTEGRITY fail the statement on the first bad row so nothing is moved and the
      table stays pending. divert_to_exception_tables adds FOR EXCEPTION IN, which moves each bad row
      into a per table exception table and brings the table online. Rows are never discarded either way.
    values:
      - fail
      - divert_to_exception_tables
    defaults: fail

  - id: exception_table_suffix
    type: STRING
    displayName: Exception table suffix
    description: Appended to the table name to name its exception table in divert mode. ORDERS becomes ORDERS_EXCEPTIONS.
    defaults: "_EXCEPTIONS"

  - id: max_tables
    type: INT
    displayName: Tables to check per run
    description: >-
      Ceiling on how many tables one run brings back. SET INTEGRITY reads every row of the table to
      validate it, so a wide run can hold the schema for a long time. The lowest dependency depth is
      taken first, which means parents, so a truncated run leaves children for the next one.
    defaults: 10

  - id: auto_remediate
    type: BOOL
    displayName: Auto remediate
    defaults: false

  - id: dry_run
    type: BOOL
    displayName: Dry run
    description: Must be false, together with auto_remediate, before SET INTEGRITY runs.
    defaults: true

variables:
  detect_sql: |
    WITH PEND AS (
      SELECT TABSCHEMA, TABNAME, STATUS, CONST_CHECKED
      FROM SYSCAT.TABLES
      WHERE TABSCHEMA = UPPER(CAST(:schema AS VARCHAR(128)))
        AND TYPE = 'T' AND STATUS <> 'N'
    ),
    EDGE AS (
      SELECT R.TABSCHEMA AS CS, R.TABNAME AS CT, R.REFTABSCHEMA AS PS, R.REFTABNAME AS PT
      FROM SYSCAT.REFERENCES R
      WHERE (R.TABSCHEMA, R.TABNAME) IN (SELECT TABSCHEMA, TABNAME FROM PEND)
        AND (R.REFTABSCHEMA, R.REFTABNAME) IN (SELECT TABSCHEMA, TABNAME FROM PEND)
        AND (R.TABSCHEMA <> R.REFTABSCHEMA OR R.TABNAME <> R.REFTABNAME)
    ),
    LVL (TABSCHEMA, TABNAME, DEPTH) AS (
      SELECT TABSCHEMA, TABNAME, CAST(0 AS INTEGER) FROM PEND
      UNION ALL
      SELECT E.CS, E.CT, L.DEPTH + 1
      FROM LVL L, EDGE E
      WHERE E.PS = L.TABSCHEMA AND E.PT = L.TABNAME AND L.DEPTH < 8
    )
    SELECT RTRIM(P.TABSCHEMA) AS TABSCHEMA, RTRIM(P.TABNAME) AS TABNAME, P.STATUS AS STATUS,
           RTRIM(P.CONST_CHECKED) AS CONST_CHECKED,
           (SELECT MAX(L.DEPTH) FROM LVL L
             WHERE L.TABSCHEMA = P.TABSCHEMA AND L.TABNAME = P.TABNAME) AS DEPTH,
           COALESCE((SELECT LISTAGG(RTRIM(E.PS) CONCAT '.' CONCAT RTRIM(E.PT), ', ')
                     FROM EDGE E WHERE E.CS = P.TABSCHEMA AND E.CT = P.TABNAME), '') AS PENDING_PARENTS,
           (SELECT COUNT(*) FROM SYSCAT.TABLES X
             WHERE X.TABSCHEMA = P.TABSCHEMA
               AND X.TABNAME = RTRIM(P.TABNAME) CONCAT UPPER(CAST(:sfx AS VARCHAR(128)))) AS EXC_EXISTS
    FROM PEND P
    ORDER BY 5, 1, 2

  verify_sql: |
    SELECT RTRIM(TABSCHEMA) AS TABSCHEMA, RTRIM(TABNAME) AS TABNAME, STATUS
    FROM SYSCAT.TABLES
    WHERE TABSCHEMA = UPPER(CAST(:schema AS VARCHAR(128)))
      AND TYPE = 'T' AND STATUS <> 'N'

tasks:
  - id: detect
    type: io.kestra.plugin.jdbc.db2.Query
    description: >-
      Read-only. Lists every table in the schema whose STATUS is not 'N', with its dependency depth
      from SYSCAT.REFERENCES, the pending parents that must be checked first and whether an exception
      table exists for it.
    url: "{{ inputs.jdbc_url }}"
    username: "{{ inputs.jdbc_username }}"
    password: "{{ inputs.jdbc_password }}"
    fetchType: FETCH
    sql: "{{ render(vars.detect_sql) }}"
    parameters:
      schema: "{{ inputs.table_schema }}"
      sfx: "{{ inputs.exception_table_suffix }}"

  - id: assess
    type: io.kestra.plugin.core.output.OutputValues
    description: >-
      Split check-pending tables from inoperative ones, order them parents first, apply the per run
      ceiling, build one SET INTEGRITY statement per target and the row count query that proves the
      tables answer reads again.
    values:
      items: >-
        {{ {'pend': outputs.detect.rows, 'schema': (inputs.table_schema | upper), 'mode': inputs.violation_handling,
            'sfx': (inputs.exception_table_suffix | upper), 'max': inputs.max_tables,
            'ar': inputs.auto_remediate, 'dr': inputs.dry_run,
            'armed': (inputs.auto_remediate and not inputs.dry_run), 'url': inputs.jdbc_url} | jq('
          . as $i
          | [ ($i.pend // [])[] | {schema: .TABSCHEMA, table: .TABNAME, status: .STATUS,
              const_checked: (.CONST_CHECKED // ""), depth: ((.DEPTH // 0) | tonumber),
              parents: (.PENDING_PARENTS // ""), exc: (((.EXC_EXISTS // 0) | tonumber) > 0),
              name: (.TABSCHEMA + "." + .TABNAME),
              qname: ("\"" + .TABSCHEMA + "\".\"" + .TABNAME + "\""),
              exc_name: (.TABSCHEMA + "." + .TABNAME + $i.sfx),
              exc_qname: ("\"" + .TABSCHEMA + "\".\"" + .TABNAME + $i.sfx + "\"")} ] as $all
          | ($i.mode == "divert_to_exception_tables") as $divert
          | [ $all[] | select(.status == "C") ] as $cp
          | [ $all[] | select(.status != "C") ] as $other
          | ($cp | sort_by(.depth)) as $ord
          | ($ord | length) as $cpn
          | ($ord[0:$i.max]) as $sel
          | ($cpn > ($sel | length)) as $truncated
          | [ $sel[] | select($divert and (.exc | not)) | .exc_name ] as $missing
          | [ $sel[] | . + {stmt: ("SET INTEGRITY FOR " + .qname + " IMMEDIATE CHECKED"
              + (if $divert then " FOR EXCEPTION IN " + .qname + " USE " + .exc_qname else "" end))} ] as $tg
          | [ $tg[] | .stmt ] as $stmts
          | [ $tg[] | .name ] as $names
          | ($names + (if $divert then [ $tg[] | .exc_name ] else [] end)) as $labels
          | ([ $tg[] | .qname ] + (if $divert then [ $tg[] | .exc_qname ] else [] end)) as $qall
          | (($qall | to_entries | map("SELECT " + ((.key + 1) | tostring) + " AS SEQ, COUNT(*) AS ROW_COUNT FROM " + .value) | join(" UNION ALL "))
             + (if ($qall | length) > 0 then " ORDER BY 1" else "" end)) as $count_sql
          | (if ($all | length) == 0 then "OK" elif ($missing | length) > 0 then "BLOCKED" elif $cpn == 0 then "BLOCKED" else "ACTION" end) as $verdict
          | ($verdict == "ACTION" and $i.armed) as $will_change
          | ($verdict != "OK") as $attention
          | ("DB2 check-pending scan of " + $i.schema + " on " + $i.url + ": \($all | length) table(s) with STATUS not N, \($cpn) of them check pending."
             + (if $cpn > 0 then " Check pending: " + ([ $ord[] | "\(.name) (depth \(.depth)\(if .parents == "" then "" else ", after \(.parents)" end))" ] | join("; ")) + "." else "" end)
             + (if ($other | length) > 0 then " Not fixable by SET INTEGRITY: " + ([ $other[] | "\(.name) STATUS \(.status)" ] | join("; ")) + "." else "" end)
             + (if $truncated then " Only the first \($tg | length) are in scope this run (max_tables \($i.max)), lowest dependency depth first." else "" end)) as $core
          | (if ($missing | length) > 0 then "Blocked: divert mode needs an exception table per target and these are missing: " + ($missing | join(", ")) + ". Create one per target first. The other option is violation_handling fail."
             elif $verdict == "BLOCKED" then "Nothing SET INTEGRITY can fix here. An inoperative table has to be dropped and recreated."
             elif $will_change then "Running " + ($tg | length | tostring) + " SET INTEGRITY statement(s) now, parents first, one table at a time."
             elif $verdict == "ACTION" then "Fix available: " + ($stmts | join("; ")) + ". No change applied (auto_remediate=\($i.ar) dry_run=\($i.dr))."
             else "Every table in " + $i.schema + " reads STATUS N." end) as $action
          | {verdict: $verdict, pending_total: ($all | length), check_pending: $cpn,
             other_count: ($other | length), target_count: ($tg | length), truncated: $truncated,
             divert: $divert, missing_exception_tables: $missing, stmts: $stmts, names: $names,
             labels: $labels, count_sql: $count_sql, will_change: $will_change, attention: $attention,
             targets: [ $tg[] | {name: .name, depth: .depth, parents: .parents, status: .status, const_checked: .const_checked} ],
             report: ($core + " Verdict " + $verdict + ". " + $action),
             slack: ($core + " Verdict " + $verdict + ". " + $action)}
          ') | first | toJson }}

  - id: summary
    type: io.kestra.plugin.core.log.Log
    message: "{{ fromJson(outputs.assess.values.items).report }}"

  - id: route
    type: io.kestra.plugin.core.flow.If
    description: Alert and consider remediation when a table is not in STATUS N. Otherwise log and stop.
    condition: "{{ fromJson(outputs.assess.values.items) | jq('if .attention then 1 else 0 end') | first > 0 }}"
    then:
      - id: alert
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {{ {'text': fromJson(outputs.assess.values.items).slack} | toJson }}

      - id: planned
        type: io.kestra.plugin.core.log.Log
        description: The exact statements a remediation run would execute, printed on every finding including a dry one.
        message: >-
          {{ {'s': fromJson(outputs.assess.values.items).stmts, 'w': fromJson(outputs.assess.values.items).will_change} | jq('
            if (.s | length) == 0 then "No SET INTEGRITY statement to run."
            else "Statements in order: " + (.s | join("; ")) + ". " + (if .w then "Running them now." else "Not running them this run. The verdict line above says why." end) end') | first }}

      - id: remediate_gate
        type: io.kestra.plugin.core.flow.If
        description: SET INTEGRITY runs only on verdict ACTION with auto_remediate true and dry_run false.
        condition: "{{ fromJson(outputs.assess.values.items) | jq('if .will_change then 1 else 0 end') | first > 0 }}"
        then:
          - id: hold
            type: io.kestra.plugin.core.flow.Pause
            description: >-
              SET INTEGRITY reads every row of the table to validate it, so on a large table it is a
              long scan that holds the table. A human approves the window before it starts.
            onResume:
              - id: approved
                type: BOOL
                displayName: Approve SET INTEGRITY on the tables listed above
                required: false

          - id: approval_gate
            type: io.kestra.plugin.core.flow.If
            description: An unanswered resume leaves approved null, which is read as a refusal.
            condition: "{{ outputs.hold.onResume.approved ?? false }}"
            then:
              - id: remediate
                type: io.kestra.plugin.core.flow.Loop
                description: >-
                  Sequential remediation (concurrencyLimit 1). One table at a time, parents before
                  children, because a child cannot be checked while its parent is still pending.
                concurrencyLimit: 1
                values: "{{ fromJson(outputs.assess.values.items).stmts | toJson }}"
                tasks:
                  - id: log_statement
                    type: io.kestra.plugin.core.log.Log
                    message: "Running {{ item.value }}"

                  - id: set_integrity
                    type: io.kestra.plugin.jdbc.db2.Query
                    description: >-
                      Validates every row of the table and takes it out of check-pending state. In
                      fail mode a row that breaks the constraint fails this statement and the table
                      stays pending, which the re-verify step turns into a failed run.
                    url: "{{ inputs.jdbc_url }}"
                    username: "{{ inputs.jdbc_username }}"
                    password: "{{ inputs.jdbc_password }}"
                    fetchType: NONE
                    sql: "{{ item.value }}"
                    allowFailure: true

              - id: reverify
                type: io.kestra.plugin.jdbc.db2.Query
                description: Read SYSCAT.TABLES.STATUS again for the whole schema. The run fails if a target is still not 'N'.
                url: "{{ inputs.jdbc_url }}"
                username: "{{ inputs.jdbc_username }}"
                password: "{{ inputs.jdbc_password }}"
                fetchType: FETCH
                sql: "{{ render(vars.verify_sql) }}"
                parameters:
                  schema: "{{ inputs.table_schema }}"

              - id: verify_result
                type: io.kestra.plugin.core.flow.If
                condition: >-
                  {{ {'rows': (outputs.reverify.rows ?? []), 'names': fromJson(outputs.assess.values.items).names} | jq('
                    [ (.rows // [])[] | .TABSCHEMA + "." + .TABNAME ] as $left
                    | [ .names[] | select((([.] - $left) | length) == 0) ] | length') | first > 0 }}
                then:
                  - id: remediation_failed
                    type: io.kestra.plugin.core.execution.Fail
                    errorMessage: >-
                      {{ {'rows': (outputs.reverify.rows ?? []), 'names': fromJson(outputs.assess.values.items).names} | jq('
                        [ (.rows // [])[] | {n: (.TABSCHEMA + "." + .TABNAME), s: .STATUS} ] as $left
                        | [ .names[] as $n | $left[] | select(.n == $n) | "\(.n) STATUS \(.s)" ] as $stuck
                        | "Still not in STATUS N after SET INTEGRITY: " + ($stuck | join("; "))
                          + ". A row that breaks the constraint fails the statement in fail mode, so either delete the offending rows or rerun with violation_handling divert_to_exception_tables. A table whose parent is still pending cannot be checked, so clear the parent first."') | first }}
                else:
                  - id: prove_reads
                    type: io.kestra.plugin.jdbc.db2.Query
                    description: >-
                      Count rows through every table that was cleared, which is the proof it serves
                      queries again rather than rejecting them with SQL0668N. In divert mode the
                      exception tables are counted too, so diverted rows are reported and not lost.
                    url: "{{ inputs.jdbc_url }}"
                    username: "{{ inputs.jdbc_username }}"
                    password: "{{ inputs.jdbc_password }}"
                    fetchType: FETCH
                    sql: "{{ fromJson(outputs.assess.values.items).count_sql }}"

                  - id: remediated
                    type: io.kestra.plugin.core.log.Log
                    message: >-
                      {{ {'rows': outputs.prove_reads.rows, 'labels': fromJson(outputs.assess.values.items).labels, 'd': fromJson(outputs.assess.values.items).divert} | jq('
                        . as $i
                        | [ ($i.rows // [])[] | {seq: ((.SEQ // 0) | tonumber), c: ((.ROW_COUNT // 0) | tonumber)} ] as $r
                        | [ $r[] | "\($i.labels[.seq - 1]) \(.c) row(s)" ] as $lines
                        | "Every target reads STATUS N again and answers queries: " + ($lines | join("; "))
                          + (if $i.d then ". Counts for the _EXCEPTIONS tables are the rows diverted out of the base tables." else "" end)') | first }}
            else:
              - id: declined
                type: io.kestra.plugin.core.log.Log
                message: "SET INTEGRITY was not approved at the pause, so no table was changed. The schema is still reporting {{ fromJson(outputs.assess.values.items).check_pending }} check-pending table(s)."
    else:
      - id: clean
        type: io.kestra.plugin.core.log.Log
        message: "{{ fromJson(outputs.assess.values.items).report }}"

errors:
  - id: alert_flow_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {{ {'text': 'DB2 check-pending guard failed on ' ~ inputs.jdbc_url ~ ' schema ' ~ inputs.table_schema ~ ' (execution ' ~ execution.id ~ '). Check the logs.'} | toJson }}

triggers:
  - id: every_15_minutes
    type: io.kestra.plugin.core.trigger.Schedule
    description: >-
      Shipped disabled. Always runs in safe mode. A check-pending table is an outage, so a short
      interval matters more here than it does for a performance check.
    cron: "*/15 * * * *"
    disabled: true
    inputs:
      auto_remediate: false
      dry_run: true

extend:
  title: DB2 Check-Pending Table Recovery Guard
  shortDescription: Find DB2 tables whose SYSCAT.TABLES.STATUS is not 'N' and that therefore reject every read, order them parents first, clear them with SET INTEGRITY IMMEDIATE CHECKED behind a Pause, then prove each one answers queries again.
  metaTitle: DB2 Check-Pending Table Recovery Guard with Kestra
  metaDescription: Detect DB2 tables stuck in check-pending state and rejecting reads, then clear them with SET INTEGRITY and prove they answer queries again.
  description: |
    A DB2 table in check-pending state is an outage, not a slow query. After a `LOAD` or after
    a constraint is added with `SET INTEGRITY ... OFF`, `SYSCAT.TABLES.STATUS` goes to `'C'` and from
    that moment the table rejects every `SELECT` and every `INSERT`, `UPDATE` or `DELETE` with
    `SQL0668N` reason code 1. The application reading it is down. Nothing times out, nothing degrades,
    the table simply refuses. The fix is one statement, `SET INTEGRITY FOR <table> IMMEDIATE CHECKED`,
    and the table stays broken until somebody runs it.

    This blueprint reads `SYSCAT.TABLES.STATUS` for a schema, orders the pending tables parents first
    using `SYSCAT.REFERENCES`, then behind a dry run and a `Pause` runs `SET INTEGRITY` one table at a
    time. It reads `STATUS` again and fails the run if any target is still not `'N'`, then counts rows
    through each cleared table so the proof is a working query and not only a catalog flag.

    This blueprint was created by [zkasuran](https://github.com/zkasuran).

    ## Findings

    | Verdict | Rule | Fix |
    |---|---|---|
    | `ACTION` | At least one table in the schema has `STATUS = 'C'` | `SET INTEGRITY ... IMMEDIATE CHECKED`, parents before children |
    | `BLOCKED` | Divert mode is on but a target has no exception table. Alternatively the only tables found are inoperative (`STATUS = 'X'`) | Create the exception tables. An inoperative table has to be dropped then recreated. The guard reports and stops |
    | `OK` | Every table in the schema reads `STATUS = 'N'` | None |

    ## Safety

    - Read-only by default. `SET INTEGRITY` runs only when `auto_remediate` is true, `dry_run` is
      false, the verdict is `ACTION` and a human approves the `Pause`. An unanswered resume leaves
      `approved` null, which the gate reads as a refusal.
    - Order is enforced, not hoped for. A child table cannot be checked while its parent is still
      pending, so the dependency depth comes from `SYSCAT.REFERENCES` and the loop runs lowest depth
      first with `concurrencyLimit: 1`.
    - `max_tables` caps one run. `SET INTEGRITY` reads every row of the table to validate it, so a
      wide run is a long scan. Truncation takes the lowest depth first, which means parents, so the
      children are still checkable on the next run.
    - Rows that break the constraint are never discarded. In `fail` mode the statement fails and the
      table stays pending, which the re-verify step turns into a failed run. In
      `divert_to_exception_tables` mode each bad row is moved to that table's exception table and the
      final step counts those rows so they are reported.
    - A table with `STATUS = 'X'` (inoperative) is reported and never touched. `SET INTEGRITY` cannot
      fix it.

    ## How it works

    1. `detect` (`io.kestra.plugin.jdbc.db2.Query`, read-only) selects every table in the schema whose
       `STATUS` is not `'N'`. One recursive query over `SYSCAT.REFERENCES` gives each pending table its
       dependency depth and the pending parents that must be cleared first. It also reports whether an
       exception table exists for each target.
    2. `assess` (`io.kestra.plugin.core.output.OutputValues`) splits check-pending from inoperative,
       sorts parents first, applies `max_tables`, builds one `SET INTEGRITY` statement per target and
       the row count query used later as proof.
    3. `summary` logs the report. `route` (`io.kestra.plugin.core.flow.If`) stops with a log when every
       table reads `'N'`.
    4. On a finding, `alert` posts to Slack and `planned` prints the exact statements a remediation run
       would execute, so a dry run is a readable plan.
       - `remediate_gate` opens only on `ACTION` with `auto_remediate` true and `dry_run` false.
         `hold` (`io.kestra.plugin.core.flow.Pause`) waits for approval.
       - `remediate` (`io.kestra.plugin.core.flow.Loop`, `concurrencyLimit: 1`) runs the statements in
         order, one table per iteration.
       - `reverify` reads `SYSCAT.TABLES.STATUS` again. `verify_result` fails the run when a target is
         still not `'N'`, naming it and why it can stay stuck.
       - `prove_reads` counts rows through every cleared table, which only works if the table really
         accepts reads again, then `remediated` logs the counts. In divert mode the exception tables
         are counted in the same query.
    5. `errors` posts a Slack alert when the flow fails, for example when the database is unreachable.

    ## What you get

    - The list of tables that are refusing reads right now, with the dependency order they have to be
      cleared in.
    - A dry run that prints the exact statements, so the plan can be read before anything runs.
    - A one step recovery behind an approval gate, with two kinds of proof after it: `STATUS` back to
      `'N'` and a real row count through the table.
    - A clear report of diverted rows when violations are moved to exception tables, so nothing is
      quietly dropped.

    ## Who it's for

    - Teams whose nightly `LOAD` can leave a table unreadable, where the next working day starts with
      an application that cannot query a table nobody changed.
    - DBAs adding constraints to large tables, which is the other way a table lands in check-pending.
    - Platform teams who want the recovery statement run under an approval gate with evidence, rather
      than typed into a shell at 03:00.

    ## Why orchestrate this with Kestra

    The detection needs the catalog. The fix needs a dependency order. The order needs a loop that
    cannot run in parallel. All of it needs an approval, because the fix is a full table scan.
    Kestra holds all four in one flow: the `If` gates on `auto_remediate` plus `dry_run`, the `Pause`
    holds for a human, the `Loop` with `concurrencyLimit: 1` keeps parents before children. A re-verify that fails
    the run means a partial recovery can never be reported as a success.

    ## Tested end to end

    On Kestra 2.0.5 OSS against DB2 Community Edition 12.1.5 (`icr.io/db2_community/db2`), database
    `testdb`, with a local HTTP sink standing in for Slack. Check-pending was created for real with
    `SET INTEGRITY FOR <table> OFF` and confirmed with the DB2 CLI: `SYSCAT.TABLES.STATUS` read `'C'`
    while `SELECT COUNT(*)` on the same table returned
    `SQL0668N Operation not allowed for reason code "1"`, `SQLSTATE 57007`. After the fix the same
    `SELECT` returned 5 rows. A second table in the schema stayed at `STATUS = 'N'` and readable the
    whole time.

    | Run | Inputs | Result |
    |---|---|---|
    | 1 | one table pending, defaults | Verdict `ACTION`. `DB2INST1.ORDERS` reported at depth 0, alert sent, no change |
    | 2 | `auto_remediate: true`, `dry_run: false`, pause declined | No change. Schema still reporting 1 check-pending table |
    | 3 | same, pause approved | `SET INTEGRITY` ran. `STATUS` `'C'` to `'N'`, 5 rows counted through the table. CLI agreed |
    | 4 | healthy schema, defaults | Verdict `OK`. 0 tables reported |
    | 5 | parent and child both pending, approved | Ordered `PARENT_T` depth 0 then `CHILD_T` depth 1, both cleared, 2 rows each |
    | 6 | `max_tables: 1` with 2 pending | Only `PARENT_T` in scope, child left for the next run |
    | 7 | a row breaking a CHECK constraint, `fail` mode, approved | Statement failed, table stayed `'C'`, the run FAILED at the re-verify |
    | 8 | `divert_to_exception_tables` with no exception table, armed | Verdict `BLOCKED`. Nothing ran |
    | 9 | `divert_to_exception_tables` with the exception table in place, approved | 2 violating rows moved to `BADROWS_EXCEPTIONS`, base table back to `'N'` with 2 readable rows, diverted count reported |
    | 10 | unreachable port | `detect` failed, the `errors` block posted to Slack, the execution is FAILED |

    Ordering is not a theory. Checking the child first by hand returned
    `SQL3608N Cannot check a dependent table ... while the parent table ... is in the Set Integrity
    Pending state`, `SQLSTATE 428A8`, which is what run 5 avoids by sorting on dependency depth.

    ## Prerequisites

    - A DB2 user that can read `SYSCAT.TABLES` and `SYSCAT.REFERENCES`, plus `CONTROL` or the
      `LOAD` authority needed to run `SET INTEGRITY` on the target tables for remediation. The instance
      owner has all of these.
    - For `divert_to_exception_tables`, an exception table per target. Build it with
      `CREATE TABLE <base>_EXCEPTIONS LIKE <base>` then
      `ALTER TABLE <base>_EXCEPTIONS ADD COLUMN TS TIMESTAMP ADD COLUMN MSG CLOB(32K)`. A hand written
      table with the same column types is not enough: DB2 rejected one with
      `SQL3604N ... Reason code: "2"`, while the `LIKE` form was accepted and returned `SQL3602W` with
      the bad rows moved.
    - Local testing:
      - `docker run -d --name db2 --privileged -p 50000:50000 -e LICENSE=accept -e DB2INST1_PASSWORD=... -e DBNAME=testdb icr.io/db2_community/db2:latest`;
      - create a table, then run `SET INTEGRITY FOR <table> OFF` to put it into check-pending state.

    ### Secrets

    - `DB2_PASSWORD`: the database password, used as the default for the `jdbc_password` input.
    - `SLACK_WEBHOOK_URL`: used by `alert` and the `errors` block.
    - In Kestra OSS, provide each one as a base64-encoded environment variable prefixed `SECRET_`.

    ### Inputs

    | Input | Default | Purpose |
    |---|---|---|
    | `jdbc_url` | `jdbc:db2://localhost:50000/testdb` | Database to read |
    | `jdbc_username` | `db2inst1` | Database user |
    | `jdbc_password` | `{{ secret('DB2_PASSWORD') }}` | Database password |
    | `table_schema` | `DB2INST1` | Schema whose tables are scanned |
    | `violation_handling` | `fail` | `fail` stops on a bad row. `divert_to_exception_tables` moves bad rows to exception tables |
    | `exception_table_suffix` | `_EXCEPTIONS` | Names the exception table in divert mode |
    | `max_tables` | `10` | Tables checked per run, lowest dependency depth first |
    | `auto_remediate` | `false` | Allow `SET INTEGRITY` to run |
    | `dry_run` | `true` | Must be `false` for anything to change |

    ## Quick start

    1. Add the `DB2_PASSWORD` and `SLACK_WEBHOOK_URL` secrets.
    2. Import the flow, set `jdbc_url`, `jdbc_username` and `table_schema`, then run it with the
       defaults. The log names any table that is refusing reads.
    3. Read the `planned` log to see the exact statements and the order they would run in.
    4. When you are ready, run with `auto_remediate: true` and `dry_run: false`, then approve the
       pause. The last log carries the row count through each recovered table.
    5. Enable the `every_15_minutes` trigger, which always runs in safe mode.

    ## How to extend

    - Point it at several schemas by running it once per schema from a parent flow.
    - Swap `IMMEDIATE CHECKED` for `IMMEDIATE UNCHECKED` in a controlled window when the data is known
      good and the full scan is not affordable. That skips validation, so it belongs behind its own gate.
    - Create the exception tables automatically from the base table layout before a divert run.
    - Add `FULL ACCESS` handling for tables that come out of check-pending into no-access state after a
      partial check.
    - Send the diverted row counts to a data quality dashboard instead of only to the log.

