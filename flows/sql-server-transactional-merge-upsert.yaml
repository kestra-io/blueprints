id: sql-server-transactional-merge-upsert
namespace: company.team
description: |
  Stage new rows, MERGE them into a target table with dedup, and advance a watermark,
  all as one transaction. A failed MERGE rolls back everything, so the target never
  holds a half-applied batch and a rerun always resumes cleanly from the last commit.

tasks:
  - id: read_watermark
    type: io.kestra.plugin.core.kv.Get
    description: Read the last committed watermark; falls through to the epoch on first run.
    key: inventory_merge_watermark
    errorOnMissing: false

  - id: stage_new_rows
    type: io.kestra.plugin.jdbc.sqlserver.Query
    description: Pull only the rows changed since the last watermark into a staging result set.
    sql: |
      SELECT sku, warehouse_id, quantity, updated_at
      FROM dbo.inventory_updates
      WHERE updated_at > :watermark
      ORDER BY updated_at ASC;
    parameters:
      watermark: "{{ outputs.read_watermark.value ?? '1900-01-01T00:00:00' }}"
    fetchType: STORE

  - id: merge_and_advance_watermark
    type: io.kestra.plugin.jdbc.sqlserver.Queries
    description: >
      MERGE the staged rows into the target with dedup on the merge key, then advance
      the watermark, both in one transaction (transaction defaults to true), so a
      failed MERGE rolls back and the watermark is never advanced past what committed.
    sql: |
      MERGE dbo.inventory_current AS target
      USING dbo.inventory_staging AS source
      ON target.sku = source.sku AND target.warehouse_id = source.warehouse_id
      WHEN MATCHED THEN
        UPDATE SET quantity = source.quantity, updated_at = source.updated_at
      WHEN NOT MATCHED THEN
        INSERT (sku, warehouse_id, quantity, updated_at)
        VALUES (source.sku, source.warehouse_id, source.quantity, source.updated_at);
    afterSQL: |
      UPDATE dbo.merge_watermarks
      SET watermark = (SELECT MAX(updated_at) FROM dbo.inventory_staging)
      WHERE job_name = 'inventory_merge';

  - id: row_check
    type: io.kestra.plugin.core.flow.If
    description: Sanity-check that the merge actually touched rows when the stage extracted some.
    condition: "{{ outputs.stage_new_rows.size > 0 and (outputs.merge_and_advance_watermark.outputs | length) == 0 }}"
    then:
      - id: alert_no_op_merge
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Flag a suspicious run where rows were staged but the MERGE reported no output.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "SQL Server merge upsert staged {{ outputs.stage_new_rows.size }} rows but the MERGE step reported no output. Check dbo.inventory_staging for a schema mismatch."
          }

  - id: advance_watermark
    type: io.kestra.plugin.core.kv.Set
    description: Persist the new watermark in the KV Store only after the transactional MERGE has committed.
    key: inventory_merge_watermark
    value: "{{ outputs.stage_new_rows.rows | length > 0 and (outputs.stage_new_rows.rows | last).updated_at or (outputs.read_watermark.value ?? '1900-01-01T00:00:00') }}"

  - id: notify
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Confirm the merge completed with the row count and new watermark.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "SQL Server transactional merge staged {{ outputs.stage_new_rows.size }} rows. Watermark advanced to {{ outputs.advance_watermark.value }}."
      }

pluginDefaults:
  - type: io.kestra.plugin.jdbc.sqlserver.Query
    values:
      url: "{{ secret('SQLSERVER_URL') }}"
      username: "{{ secret('SQLSERVER_USERNAME') }}"
      password: "{{ secret('SQLSERVER_PASSWORD') }}"
      trustServerCertificate: true
  - type: io.kestra.plugin.jdbc.sqlserver.Queries
    values:
      url: "{{ secret('SQLSERVER_URL') }}"
      username: "{{ secret('SQLSERVER_USERNAME') }}"
      password: "{{ secret('SQLSERVER_PASSWORD') }}"
      trustServerCertificate: true

triggers:
  - id: every_15_minutes
    type: io.kestra.plugin.core.trigger.Schedule
    description: Run the incremental MERGE every 15 minutes. Adjust to match how fresh the target table needs to be.
    cron: "*/15 * * * *"
    disabled: true

errors:
  - id: alert_on_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alert Slack if the stage or MERGE step fails; the watermark is not advanced so the next run retries the same window.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "SQL Server transactional merge failed and did not advance the watermark (execution {{ execution.id }})."
      }

extend:
  title: SQL Server Transactional MERGE Upsert with Watermark
  shortDescription: Stage changed rows since a KV-tracked watermark, MERGE them into a target table with dedup, and advance the watermark, all inside one SQL Server transaction.
  metaTitle: SQL Server Transactional MERGE Upsert with Kestra
  metaDescription: Orchestrate an idempotent, transactional MERGE upsert into SQL Server with Kestra. Stage changed rows, MERGE with dedup, and advance a watermark atomically.
  description: |
    An incremental load into SQL Server is rarely one statement. It is stage the delta, dedupe it, MERGE it into the target, then move the watermark forward, and if any one of those steps fails partway, the target table needs to end up exactly where it started. This blueprint runs the MERGE and the watermark update inside a single `io.kestra.plugin.jdbc.sqlserver.Queries` transaction, so a failure anywhere in that block rolls back completely instead of leaving a half-applied batch or a watermark that has drifted ahead of what actually committed.

    ## How it works

    1. `read_watermark` (`io.kestra.plugin.core.kv.Get`) reads the `inventory_merge_watermark` key, falling through to the epoch on the first run.
    2. `stage_new_rows` (`io.kestra.plugin.jdbc.sqlserver.Query`) selects every row from `dbo.inventory_updates` changed since the watermark and stores it with `fetchType: STORE`.
    3. `merge_and_advance_watermark` (`io.kestra.plugin.jdbc.sqlserver.Queries`) runs a `MERGE` statement that updates matched rows and inserts new ones by `sku` and `warehouse_id`, then an `afterSQL` statement advances a watermark tracking table, both inside the same transaction (`transaction` defaults to `true`), so a failed MERGE rolls back the watermark update too.
    4. `row_check` (`io.kestra.plugin.core.flow.If`) flags the unusual case where rows were staged but the MERGE reported no output, which usually means a schema mismatch between the staging and target tables.
    5. `advance_watermark` (`io.kestra.plugin.core.kv.Set`) persists the new watermark to the KV Store only after the transactional MERGE has already committed downstream.
    6. `notify` confirms the row count and watermark; the `errors` block alerts separately on any failure.

    ## What you get

    - A single-transaction MERGE and watermark update, so a partial failure never leaves the target half-updated.
    - Dedup on the merge key (`sku`, `warehouse_id`), collapsing late or duplicate rows instead of letting them accumulate downstream.
    - A watermark that only advances after the transaction commits, making every rerun idempotent.
    - A built-in sanity check that catches a silent schema mismatch between staging and target.

    ## Who it's for

    - Data engineers running incremental loads into a SQL Server reporting or operational table.
    - Platform teams who need transactional guarantees a plain `INSERT` loop cannot provide.
    - Teams replacing a stored procedure and <a href="https://kestra.io/orchestration/sql-server">SQL Server Agent</a> job with a version-controlled, retryable flow.

    ## Why orchestrate this with Kestra

    A stored procedure can run a MERGE, but coordinating the watermark update, the failure rollback, and the alerting all inside one transaction usually means hand-writing `TRY`/`CATCH` and `XACT_ABORT` logic in T-SQL, with no execution history outside the database itself. Kestra wraps the MERGE and the watermark advance in one `Queries` transaction, gives the whole run a versioned YAML definition and full execution history, and separates the success and failure notification paths declaratively instead of embedding them in the stored procedure.

    ## Prerequisites

    - A SQL Server database with a source table (`dbo.inventory_updates`), a staging table (`dbo.inventory_staging`), a target table (`dbo.inventory_current`), and a watermark tracking table (`dbo.merge_watermarks`).
    - A Slack incoming webhook for notifications.

    ### Secrets

    - `SQLSERVER_URL`: JDBC URL, for example `jdbc:sqlserver://your-host:1433;trustServerCertificate=true`.
    - `SQLSERVER_USERNAME` / `SQLSERVER_PASSWORD`: database credentials.
    - `SLACK_WEBHOOK_URL`: Slack incoming webhook URL.

    ## Quick start

    1. Add the secrets above to your Kestra namespace.
    2. Confirm the source, staging, target, and watermark tables exist with matching columns.
    3. Run the flow once manually to seed the watermark, then enable the `every_15_minutes` schedule.
    4. Check the KV Store for the `inventory_merge_watermark` key after each run to confirm it advances.

    ## How to extend

    - Replace the `MERGE` statement's match keys with your own natural or surrogate key.
    - Chain a downstream <a href="https://kestra.io/orchestration/snowflake">Snowflake</a> or reporting refresh after `merge_and_advance_watermark` succeeds.
    - Add a row-count threshold to `row_check` to catch an unexpectedly large batch before it commits.
    - Swap the `Schedule` trigger for a `Flow` trigger so the merge fires the moment an upstream load finishes instead of on a fixed interval.

    ## Links

    - Plugin docs: https://kestra.io/plugins/plugin-jdbc-sqlserver
    - SQL Server orchestration with Kestra: https://kestra.io/orchestration/sql-server
  tags:
    - Data
  ee: false
  demo: false
