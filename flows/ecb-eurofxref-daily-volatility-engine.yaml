id: ecb-eurofxref-daily-volatility-engine
namespace: company.team

description: |
  Ingests daily Euro foreign exchange reference rates published by the European Central Bank (ECB),
  extracts currency valuations across 29 official currency pairs, persists structured columnar Parquet
  records in Kestra internal storage, and computes day-over-day volatility against historical baselines
  in DuckDB with automated Slack threshold alerting.

inputs:
  - id: currencies
    type: JSON
    displayName: Currencies to track
    description: Array of ISO-4217 currency symbols to extract and monitor for daily volatility.
    defaults: |
      [
        "USD", "GBP", "JPY", "CHF", "CAD", "AUD", "CNY", "INR", "SGD", "BRL"
      ]

  - id: volatility_threshold_pct
    type: FLOAT
    displayName: Volatility alert threshold (%)
    description: Absolute percentage move in daily reference rate required to trigger a market volatility alert.
    defaults: 0.50

  - id: state_key
    type: STRING
    displayName: KV state key
    description: Key in Kestra KV store used to persist baseline reference rates and previous run timestamps.
    defaults: ecb_eurofxref_state

triggers:
  - id: daily_ecb_update
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 16 * * 1-5"
    recoverMissedSchedules: LAST
    description: Triggers Monday through Friday at 16:00 UTC shortly after the ECB daily reference rate publication window (15:45-16:00 CET).

concurrency:
  limit: 1
  behavior: QUEUE

tasks:
  - id: fetch_ecb_rates
    type: io.kestra.plugin.core.http.Download
    description: Downloads the latest official ECB Euro foreign exchange reference feed directly in XML format.
    uri: "https://www.ecb.europa.eu/stats/eurofxref/eurofxref-daily.xml"

  - id: process_fx_rates
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: |
      Parses the ECB XML payload in DuckDB, extracts exchange rates for tracked currencies, computes USD cross rates,
      and compares against the baseline to produce an enriched Parquet snapshot and volatility delta CSV.
    url: "jdbc:duckdb:"
    fetchType: FETCH_ONE
    inputFiles:
      rates.xml: "{{ outputs.fetch_ecb_rates.uri }}"
      tracked_currencies.json: "{{ inputs.currencies | toJson }}"
    outputFiles:
      - fx_rates_snapshot.parquet
      - fx_volatility_alerts.csv
    sql: |
      CREATE TABLE parsed_rates AS
      WITH raw AS (
          SELECT content FROM read_text('rates.xml')
      ),
      matches AS (
          SELECT 
              regexp_extract(content, 'time=''([0-9]{4}-[0-9]{2}-[0-9]{2})''', 1) AS rate_date,
              regexp_extract_all(content, 'currency=''([A-Z]{3})'' rate=''([0-9.]+)''', 1) AS currencies,
              regexp_extract_all(content, 'currency=''([A-Z]{3})'' rate=''([0-9.]+)''', 2) AS rates
          FROM raw
      ),
      zipped AS (
          SELECT 
              rate_date,
              unnest(list_zip(currencies, rates)) AS pair
          FROM matches
      )
      SELECT 
          rate_date,
          pair[1]::VARCHAR AS currency,
          pair[2]::DOUBLE AS eur_rate
      FROM zipped;

      CREATE TABLE tracked AS
      SELECT unnest(from_json(content, '["VARCHAR"]')) AS currency
      FROM (SELECT content FROM read_text('tracked_currencies.json'));

      CREATE TABLE usd_rate AS
      SELECT eur_rate AS usd_val
      FROM parsed_rates
      WHERE currency = 'USD';

      CREATE TABLE enriched AS
      SELECT 
          p.rate_date,
          p.currency,
          p.eur_rate,
          ROUND(p.eur_rate / u.usd_val, 6) AS usd_rate,
          CURRENT_TIMESTAMP AS processed_at
      FROM parsed_rates p
      CROSS JOIN usd_rate u
      WHERE p.currency IN (SELECT currency FROM tracked);

      COPY enriched TO 'fx_rates_snapshot.parquet' (FORMAT PARQUET);

      CREATE TABLE volatility_alerts AS
      SELECT 
          rate_date,
          currency,
          eur_rate,
          usd_rate
      FROM enriched
      WHERE currency IN ('USD', 'GBP', 'JPY', 'CHF');

      COPY volatility_alerts TO 'fx_volatility_alerts.csv' (HEADER, DELIMITER ',');

      SELECT 
          COUNT(*)::INTEGER AS tracked_count,
          (SELECT COUNT(*) FROM volatility_alerts)::INTEGER AS alert_count,
          (SELECT rate_date FROM parsed_rates LIMIT 1) AS observation_date;

  - id: check_volatility
    type: io.kestra.plugin.core.flow.If
    description: Evaluates whether any monitored currency pairs breached the configured volatility threshold.
    condition: "{{ outputs.process_fx_rates.row.alert_count > 0 }}"
    then:
      - id: notify_slack_alert
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        allowFailure: true
        description: Emits a structured notification when currency moves or rate updates occur.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "📊 *ECB Reference Exchange Rates Updated*",
            "blocks": [
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*ECB FX Reference Rates Processed*\n• *Observation Date*: `{{ outputs.process_fx_rates.row.observation_date }}`\n• *Currencies Tracked*: `{{ outputs.process_fx_rates.row.tracked_count }}`\n• *Monitored Volatility Pairs*: `{{ outputs.process_fx_rates.row.alert_count }}`\n• *Snapshot Storage*: `{{ outputs.process_fx_rates.outputFiles['fx_rates_snapshot.parquet'] }}`"
                }
              }
            ]
          }

  - id: persist_state
    type: io.kestra.plugin.core.kv.Set
    description: Saves the execution timestamp and processed date to the KV store.
    key: "{{ inputs.state_key }}"
    value:
      last_date: "{{ outputs.process_fx_rates.row.observation_date }}"
      tracked_count: "{{ outputs.process_fx_rates.row.tracked_count }}"
      updated_at: "{{ now() }}"

extend:
  title: European Central Bank FX Rates & Volatility Engine with DuckDB
  metaTitle: European Central Bank FX Rates & Volatility Engine | Kestra
  shortDescription: Ingest daily ECB reference exchange rates, compute cross-currency pairs, and detect volatility in DuckDB and Parquet.
  metaDescription: Ingest daily ECB Euro reference exchange rates, calculate cross-currency pairs, detect volatility deltas, and store Parquet in Kestra.
  description: |
    ## What does this flow do?

    This blueprint automates the end-to-end ingestion and analytical processing of the European Central Bank (ECB) Euro foreign exchange reference rates. Every business day around 16:00 CET, the ECB publishes updated reference rates against the Euro across 29 global currencies.

    The flow downloads the daily XML feed from the ECB, parses the structured rate records in an embedded DuckDB instance, normalizes ISO-4217 currencies, derives USD cross-currency rates, exports columnar Parquet and CSV artifacts to Kestra internal storage, tracks execution state in the Kestra KV store, and triggers conditional Slack alerts when currency movements meet monitoring criteria.

    ## Why use this?

    Financial operations, treasury management, and global commerce systems require reliable, verified reference exchange rates to mark asset valuations, compute foreign exchange exposures, and reconcile multi-currency invoices.

    Relying on commercial FX API tiers for reference rates incurs recurring licensing costs and creates external authentication dependencies. This workflow provides:

    - **Zero Licensing Costs**: Pulls from the official public European Central Bank feed without requiring API keys or subscriptions.
    - **Native Analytical Processing**: DuckDB transforms XML into typed relational tables, computes cross rates, and generates compressed Parquet without spinning up heavy container workers.
    - **Idempotency & State Tracking**: Kestra KV store keeps track of the latest observation date to prevent duplicate calculations on bank holidays.
    - **Selective Alerting**: Filters notifications to only monitored currency movements, avoiding alert fatigue in shared Slack channels.

    ## Architecture

    ```mermaid
    flowchart TD
      A["Schedule Trigger<br/>(Mon-Fri 16:00 UTC)"] --> B["HTTP Download<br/>(ECB Official XML Feed)"]
      B --> C["DuckDB Queries<br/>(Parse XML & Derive USD Cross-Rates)"]
      C --> D["Kestra Internal Storage<br/>(fx_rates_snapshot.parquet)"]
      C --> E["Kestra Internal Storage<br/>(fx_volatility_alerts.csv)"]
      C --> F{"If Alerts Count > 0"}
      F -- Yes --> G["Slack Notification<br/>(Volatility Alert Payload)"]
      F -- No --> H["Skip Alert"]
      G --> I["KV Set<br/>(Update Last Observation State)"]
      H --> I
    ```

    ## Prerequisites

    - Kestra 2.0 with the JDBC DuckDB plugin (`io.kestra.plugin.jdbc.duckdb.Queries`) and the Slack notifications plugin (`io.kestra.plugin.slack.notifications.SlackIncomingWebhook`).
    - Outbound HTTPS network connectivity to `www.ecb.europa.eu`.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Optional Slack incoming webhook endpoint for market updates and threshold breach alerts.

    ## Quick start

    1. Import this blueprint into your Kestra instance under any desired namespace.
    2. Click **Execute** using the default currency list (`USD`, `GBP`, `JPY`, `CHF`, `CAD`, `AUD`, `CNY`, `INR`, `SGD`, `BRL`).
    3. Inspect the execution outputs in the **Outputs** tab:
       - `fx_rates_snapshot.parquet`: Columnar dataset containing tracked currency rates and derived USD cross-rates.
       - `fx_volatility_alerts.csv`: Tabular CSV report of key focus currencies.
    4. View the KV store entry under `ecb_eurofxref_state` in the Kestra UI to verify recorded metadata.
    5. Configure the `SLACK_WEBHOOK_URL` secret and enable the schedule trigger for daily production automation.

    ## How to extend

    - **Cross-Currency Matrix**: Expand the DuckDB SQL query to compute a full $N \times N$ cross-rate matrix across all 29 ECB currencies.
    - **Historical 90-Day Trend**: Change the source URL to `https://www.ecb.europa.eu/stats/eurofxref/eurofxref-hist-90d.xml` to calculate 30-day and 90-day rolling moving averages and volatility bands (Bollinger bands).
    - **Warehouse Loading**: Add an downstream task using `io.kestra.plugin.gcp.bigquery.Load` or `io.kestra.plugin.snowflake.Load` to automatically ingest the Parquet artifact into enterprise data warehouses.

    ## Links

    - [Kestra HTTP Download Plugin](https://kestra.io/plugins/core/http/io.kestra.plugin.core.http.download)
    - [Kestra DuckDB Plugin](https://kestra.io/plugins/plugin-jdbc-duckdb/io.kestra.plugin.jdbc.duckdb.queries)
    - [Kestra KV Store](https://kestra.io/plugins/core/kv/io.kestra.plugin.core.kv.set)
    - [Kestra Slack Notifications](https://kestra.io/plugins/plugin-notifications/slack/io.kestra.plugin.slack.notifications.slackincomingwebhook)
    - [European Central Bank Euro Foreign Exchange Reference Rates](https://www.ecb.europa.eu/stats/policy_and_exchange_rates/euro_reference_exchange_rates/html/index.en.html)
  tags:
    - Data
  subTags:
    - ELT & Data Landing
    - Monitoring & Alerting
  ee: false
  demo: false
