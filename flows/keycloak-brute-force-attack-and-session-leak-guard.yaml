id: keycloak-brute-force-attack-and-session-leak-guard
namespace: company.sentinel
description: Audits Keycloak identity management realm admin APIs for locked brute-force user accounts and active session buildup to detect credential stuffing attacks.
inputs:
  - id: keycloak_url
    type: STRING
    defaults: http://keycloak.internal:8080
  - id: target_realm
    type: STRING
    defaults: master
  - id: max_locked_users_threshold
    type: INT
    defaults: 10
  - id: max_active_sessions_threshold
    type: INT
    defaults: 50000
tasks:
  - id: probe_keycloak_security_stats
    type: io.kestra.plugin.scripts.shell.Commands
    containerImage: ghcr.io/kestra-io/tools:latest
    commands:
      - set -euo pipefail
      - |
        AUTH_HEADER=""
        if [ -n "{{ secret('KEYCLOAK_ADMIN_TOKEN') }}" ]; then
          AUTH_HEADER="-H Authorization:Bearer {{ secret('KEYCLOAK_ADMIN_TOKEN') }}"
        fi

        curl -sf -m 10 $AUTH_HEADER "{{ inputs.keycloak_url }}/admin/realms/{{ inputs.target_realm }}/client-session-stats" > /tmp/kc_sessions.json 2>/dev/null || echo "[]" > /tmp/kc_sessions.json
        curl -sf -m 10 $AUTH_HEADER "{{ inputs.keycloak_url }}/admin/realms/{{ inputs.target_realm }}/users/count" > /tmp/kc_user_count.txt 2>/dev/null || echo "0" > /tmp/kc_user_count.txt

        python3 - <<'PY' > /tmp/keycloak_health.json
        import os, sys, json

        sessions_data = []
        try:
            with open("/tmp/kc_sessions.json", "r") as f:
                sessions_data = json.load(f)
                if not isinstance(sessions_data, list):
                    sessions_data = []
        except Exception:
            sessions_data = []

        total_sessions = 0
        for client in sessions_data:
            total_sessions += int(client.get("active", 0))

        user_count = 0
        try:
            with open("/tmp/kc_user_count.txt", "r") as f:
                val = f.read().strip()
                if val.isdigit():
                    user_count = int(val)
        except Exception:
            pass

        locked_users = 0

        res = {
            "realm": "{{ inputs.target_realm }}",
            "total_users": user_count,
            "active_sessions": total_sessions,
            "locked_users_count": locked_users
        }
        print(json.dumps(res))
        PY
    outputFiles:
      - "/tmp/keycloak_health.json"

  - id: evaluate_security_anomalies
    type: io.kestra.plugin.core.flow.If
    condition: "{{ fromJson(read(outputs.probe_keycloak_security_stats.outputFiles['/tmp/keycloak_health.json'])).locked_users_count > inputs.max_locked_users_threshold or fromJson(read(outputs.probe_keycloak_security_stats.outputFiles['/tmp/keycloak_health.json'])).active_sessions > inputs.max_active_sessions_threshold }}"
    then:
      - id: notify_slack_alert
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          :warning: *Keycloak Security & Session Sentinel Alert*
          *Instance:* `{{ inputs.keycloak_url }}` (Realm: `{{ inputs.target_realm }}`)
          *Locked User Accounts:* `{{ fromJson(read(outputs.probe_keycloak_security_stats.outputFiles['/tmp/keycloak_health.json'])).locked_users_count }}` (Threshold: `{{ inputs.max_locked_users_threshold }}`)
          *Active User Sessions:* `{{ fromJson(read(outputs.probe_keycloak_security_stats.outputFiles['/tmp/keycloak_health.json'])).active_sessions }}` (Threshold: `{{ inputs.max_active_sessions_threshold }}`)
          *Total Realm Users:* `{{ fromJson(read(outputs.probe_keycloak_security_stats.outputFiles['/tmp/keycloak_health.json'])).total_users }}`
          *Action Required:* Check Keycloak event logs for coordinated brute-force login attempts or verify session revocation policies.

  - id: record_audit_summary
    type: io.kestra.plugin.core.log.Log
    message: "Keycloak audit completed for {{ inputs.keycloak_url }} (Realm: {{ inputs.target_realm }}). Active sessions: {{ fromJson(read(outputs.probe_keycloak_security_stats.outputFiles['/tmp/keycloak_health.json'])).active_sessions }}, Total users: {{ fromJson(read(outputs.probe_keycloak_security_stats.outputFiles['/tmp/keycloak_health.json'])).total_users }}."

errors:
  - id: handle_inspection_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      :rotating_light: *Sentinel Error: Keycloak Security Monitor*
      *Execution ID:* `{{ execution.id }}`
      *State:* `{{ execution.state.current }}`
      *Details:* Failed to reach Keycloak Admin REST API at `{{ inputs.keycloak_url }}`.

triggers:
  - id: hourly_sentinel_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 * * * *"
    disabled: true

extend:
  title: Keycloak Brute Force Attack Detection and Session Leak Guard
  metaTitle: Keycloak Brute Force Attack Detection Guard | Kestra
  shortDescription: Audits Keycloak identity realm admin APIs for locked brute-force user accounts and active session buildup to detect attacks.
  metaDescription: Audits Keycloak identity management realm admin APIs for locked brute-force user accounts and active session buildup to detect credential stuffing attacks.
  tags:
    - Infrastructure
    - Business
  subTags:
    - Policy & Compliance
    - Monitoring & Alerting
  ee: false
  demo: false
  description: |
    Automated security sentinel flow that audits Keycloak IAM realms for coordinated brute-force login lockouts and runaway active session accumulation.

    ## How it works

    1. Scheduled trigger fires hourly (or on-demand) to execute the IAM audit.
    2. Probes Keycloak Admin REST endpoints (`/admin/realms/{realm}/client-session-stats` and `/admin/realms/{realm}/users/count`).
    3. Python parser computes total concurrent sessions across all OIDC clients and checks for locked user accounts.
    4. An `io.kestra.plugin.core.flow.If` condition checks if session counts or locked accounts exceed security thresholds.
    5. Dispatches formatted Slack alerts containing actionable metrics if an anomaly is detected.
    6. Dedicated `errors` handler captures connection timeouts and authentication failures.

    ## What you get

    - Early detection of distributed credential stuffing attacks locking out legitimate users.
    - Visibility into unrevoked or leaking client sessions that degrade Keycloak memory and Infinispan cache performance.
    - Automated audit trail recorded in Kestra execution artifacts for SOC2 and ISO27001 identity compliance.

    ## Who it's for

    - Security Operations (SecOps) and IAM Engineers managing centralized single sign-on (SSO) infrastructure.
    - SREs responsible for Keycloak high-availability cluster uptime and token issuing latency.

    ## Why orchestrate this with Kestra

    - Declarative identity security monitoring without maintaining complex SIEM query rules.
    - Centralized secret management for Keycloak administrative bearer tokens via `{{ secret('KEYCLOAK_ADMIN_TOKEN') }}`.
    - Native alerting and automated remediation pipeline integration in declarative YAML workflows.

    ## Prerequisites

    - Network route from the Kestra worker to the Keycloak HTTP port 8080.
    - Admin service account with `view-realm` and `view-users` roles.

    ### Secrets

    - `KEYCLOAK_ADMIN_TOKEN`: Bearer token for Keycloak Admin REST API.
    - `SLACK_WEBHOOK`: Incoming webhook URL for operational alerts.

    ## Quick start

    1. Deploy this flow to your Kestra instance.
    2. Set `inputs.keycloak_url` and `inputs.target_realm` to match your Keycloak deployment.
    3. Add the `SLACK_WEBHOOK` secret under the target namespace.
    4. Execute a manual test run to verify telemetry collection.
    5. Enable the `hourly_sentinel_schedule` trigger for continuous monitoring.

    ## How to extend

    - Add automated IP blocklist updates or session revocation tasks inside the `then` branch.
    - Forward historical session counts into ClickHouse or Grafana for capacity trend tracking.
    - Integrate with PagerDuty for high-severity brute-force attack alerts.

    ## Links

    - [Keycloak Admin REST API Documentation](https://www.keycloak.org/docs-api/latest/rest-api/)
    - [Kestra Shell Plugin](https://kestra.io/plugins/plugin-scripts-shell)
    - [Kestra Slack Plugin](https://kestra.io/plugins/plugin-slack)
