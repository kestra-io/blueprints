id: aws-vpc-flow-logs-rejected-traffic-spike-sentinel
namespace: company.ops

inputs:
  - id: aws_region
    type: STRING
    defaults: "us-east-1"
    description: AWS region where the VPC flow logs log group resides.
  - id: log_group_name
    type: STRING
    defaults: "/aws/vpc/flow-logs"
    description: CloudWatch Log Group containing VPC Flow Logs.
  - id: rejected_packets_threshold
    type: INT
    defaults: 1000
    description: Maximum acceptable count of rejected network packets over the 15-minute window.

tasks:
  - id: query_vpc_rejected_traffic
    type: io.kestra.plugin.aws.cli.AwsCLI
    region: "{{ inputs.aws_region }}"
    accessKeyId: "{{ secret('AWS_ACCESS_KEY_ID') }}"
    secretKeyId: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
    commands:
      - |
        QUERY_STRING="filter action = 'REJECT' | stats sum(packets) as total_rejected_packets by srcAddr, dstPort | sort total_rejected_packets desc | limit 5"
        
        QUERY_ID=$(aws logs start-query \
          --log-group-name "{{ inputs.log_group_name }}" \
          --start-time $(date -u -v-15M +%s) \
          --end-time $(date -u +%s) \
          --query-string "$QUERY_STRING" \
          --query queryId --output text)
        
        sleep 5
        
        aws logs get-query-results --query-id "$QUERY_ID" --output json > /tmp/vpc_results.json
        
        TOTAL_REJECTED=$(jq '[.results[][] | select(.field == "total_rejected_packets") | .value | tonumber] | add // 0' /tmp/vpc_results.json)
        
        echo "::set-output name=total_rejected::$TOTAL_REJECTED::"

  - id: evaluate_rejected_traffic
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.query_vpc_rejected_traffic.vars.total_rejected | int >= inputs.rejected_packets_threshold }}"
    then:
      - id: notify_security_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#security-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 AWS VPC Rejected Traffic Spike Alert",
                "text": "VPC Flow Logs in `{{ inputs.log_group_name }}` recorded *{{ outputs.query_vpc_rejected_traffic.vars.total_rejected }}* rejected packets over the last 15 minutes! Impact: High volume of security group/NACL drops indicates port scanning, lateral traversal attempts, or misconfigured security group egress rules.",
                "footer": "Kestra Security Sentinel • AWS VPC"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#security-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ AWS VPC Flow Logs Rejected Traffic Anomaly Sentinel Pipeline Failure",
            "text": "Failed to query CloudWatch Logs Insights for VPC flow logs. Verify log group name and IAM permissions.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  title: AWS VPC Flow Logs Rejected Traffic Anomaly Sentinel
  shortDescription: Queries CloudWatch Logs Insights on VPC Flow Logs to detect security group rejections and unauthorized network scans.
  description: |
    ## How it works
    This workflow executes a CloudWatch Logs Insights query against AWS VPC Flow Logs, filtering for `action = 'REJECT'` and aggregating packet counts by source IP and destination port. When external attackers scan public subnets or compromised instances attempt lateral movement across private VPCs, NACLs and Security Groups reject the packets. When rejected traffic exceeds the threshold, an incident alert is sent to Slack.

    ## What you get
    - Immediate detection of port scanning, lateral traversal, and misconfigured firewall rules.
    - Direct visibility into source IP addresses and destination ports generating rejected traffic.
    - Prevents undetected reconnaissance on internal cloud VPC assets.

    ## Who it's for
    - Cloud Security Architects and SOC Analysts monitoring AWS environments.
    - Network Engineers maintaining AWS VPC Security Groups and Network ACLs.

    ## Why orchestrate this with Kestra
    - **Native CloudWatch Insights Query**: Powerful log analytics executed server-side in AWS.
    - **Automated Security Guardrails**: Continuous 15-minute evaluation without SIEM license overhead.
    - **Context-Rich Alerts**: Dispatches specific source IPs and packet counts directly to Slack.

    ## Prerequisites
    - VPC Flow Logs published to a CloudWatch Logs log group.
    - AWS IAM credentials with `logs:StartQuery` and `logs:GetQueryResults`.
    - Secrets `AWS_ACCESS_KEY_ID`, `AWS_SECRET_ACCESS_KEY`, and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import the blueprint.
    2. Set `log_group_name` and `aws_region`.
    3. Run the workflow to inspect rejected traffic patterns.

    ## How to extend
    - Automatically block abusive public IP addresses via AWS WAF IP set or NACL update.
    - Correlate with AWS GuardDuty finding IDs.

    ## Links
    - [AWS VPC Flow Logs Documentation](https://docs.aws.amazon.com/vpc/latest/userguide/flow-logs.html)
    - [Kestra AWS CLI Plugin](https://kestra.io/plugins/plugin-aws/io.kestra.plugin.aws.cli.awscli)
  tags:
    - Cloud
    - Infrastructure
  ee: false
  demo: false
