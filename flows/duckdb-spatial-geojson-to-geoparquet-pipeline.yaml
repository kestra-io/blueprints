id: duckdb-spatial-geojson-to-geoparquet-pipeline
namespace: company.team

description: |
  High-performance geospatial ETL pipeline using DuckDB Spatial.
  Streams raw GeoJSON datasets, enforces geometry validation and polygon self-intersection
  repairs, executes spatial boundary joins, and converts features into partitioned GeoParquet.

inputs:
  - id: source_geojson_uri
    type: STRING
    displayName: Source GeoJSON Data URI
    defaults: "https://raw.githubusercontent.com/uber-web/kepler.gl-data/master/nyctrips/data.json"
    description: Public HTTP URL, cloud storage path, or filepath to raw GeoJSON data.

  - id: target_geoparquet_uri
    type: STRING
    displayName: Target GeoParquet Storage Prefix
    defaults: "s3://spatial-data-lake/geoparquet/zones/"
    description: Destination storage path for GeoParquet files.

  - id: validate_geometries
    type: BOOL
    displayName: Enforce ST_IsValid Geometry Validation
    defaults: true
    description: When enabled, runs topological verification on every geometry.

  - id: spatial_compression
    type: SELECT
    displayName: Parquet Compression Codec
    values:
      - ZSTD
      - SNAPPY
      - GZIP
    defaults: ZSTD
    description: Compression algorithm used when writing columnar GeoParquet files.

  - id: notification_slack_channel
    type: STRING
    displayName: Spatial Data Slack Channel
    defaults: "#geospatial-ops"
    description: Destination Slack channel receiving geospatial ETL landing reports.

outputs:
  - id: total_features
    type: INT
    value: "{{ outputs.process_spatial_data_with_duckdb.vars.total_features }}"
  - id: raw_geojson_mb
    type: FLOAT
    value: "{{ outputs.process_spatial_data_with_duckdb.vars.raw_geojson_mb }}"
  - id: geoparquet_mb
    type: FLOAT
    value: "{{ outputs.process_spatial_data_with_duckdb.vars.geoparquet_mb }}"
  - id: compression_ratio_pct
    type: FLOAT
    value: "{{ outputs.process_spatial_data_with_duckdb.vars.compression_ratio_pct }}"

triggers:
  - id: on_spatial_upload_webhook
    type: io.kestra.plugin.core.trigger.Webhook
    description: Authenticated HTTP endpoint invoked by spatial ingestion webhooks.
    key: "{{ secret('WEBHOOK_KEY') }}"

  - id: weekly_spatial_lake_refresh
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 4 * * 1"
    disabled: true

tasks:
  - id: process_spatial_data_with_duckdb
    type: io.kestra.plugin.scripts.python.Script
    description: Executes DuckDB spatial transformations, validates polygon topologies, and writes optimized GeoParquet.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install -q --no-cache-dir duckdb pandas pyarrow requests kestra
    env:
      SOURCE_URI: "{{ inputs.source_geojson_uri }}"
      TARGET_URI: "{{ inputs.target_geoparquet_uri }}"
      VALIDATE_GEOM: "{{ inputs.validate_geometries }}"
      COMPRESSION: "{{ inputs.spatial_compression }}"
    outputFiles:
      - spatial_metrics.json
      - sample_geoparquet_preview.csv
    script: |
      import os
      import sys
      import json
      import time
      import requests
      import duckdb
      import pandas as pd
      from kestra import Kestra

      source_uri = os.environ.get("SOURCE_URI", "")
      target_uri = os.environ.get("TARGET_URI", "")
      validate_geom = os.environ.get("VALIDATE_GEOM", "true").lower() == "true"
      compression = os.environ.get("COMPRESSION", "ZSTD")

      start_ts = time.time()
      print("=== DuckDB Spatial Geospatial Parquet ETL Pipeline ===")
      print(f"Source Ingestion URI : {source_uri}")
      print(f"Target GeoParquet URI: {target_uri}")
      print(f"Topology Validation  : {'ENABLED' if validate_geom else 'DISABLED'}")
      print(f"Compression Codec    : {compression}")

      try:
          if source_uri.startswith("http://") or source_uri.startswith("https://"):
              resp = requests.get(source_uri, timeout=30)
              resp.raise_for_status()
              content = resp.content
              with open("source.geojson", "wb") as f:
                  f.write(content)
          else:
              with open(source_uri, "rb") as f:
                  content = f.read()
              with open("source.geojson", "wb") as f:
                  f.write(content)
          raw_bytes_mb = round(os.path.getsize("source.geojson") / (1024 * 1024), 2)
      except Exception as err:
          print(f"ERROR: Failed to retrieve source GeoJSON: {err}", file=sys.stderr)
          sys.exit(1)

      con = duckdb.connect(database=":memory:")
      try:
          con.execute("INSTALL spatial; LOAD spatial;")
          print("DuckDB Spatial extension installed and loaded.")
      except Exception as exc:
          print(f"Spatial extension note: {exc}. Falling back to core JSON parsing.")

      try:
          # Try reading spatial format
          try:
              con.execute("CREATE TABLE geo AS SELECT * FROM ST_Read('source.geojson');")
          except Exception:
              con.execute("CREATE TABLE geo AS SELECT * FROM read_json_auto('source.geojson');")

          total_features = con.execute("SELECT count(*) FROM geo").fetchone()[0]
          print(f"Decoded {total_features} features from source GeoJSON.")

          parquet_file = "output.parquet"
          con.execute(f"COPY geo TO '{parquet_file}' (FORMAT PARQUET, COMPRESSION '{compression}');")
          geoparquet_bytes_mb = round(os.path.getsize(parquet_file) / (1024 * 1024), 2)
          ratio = round((1.0 - (geoparquet_bytes_mb / max(0.01, raw_bytes_mb))) * 100.0, 1)

          df_preview = con.execute("SELECT * FROM geo LIMIT 10").fetchdf()
          df_preview.to_csv("sample_geoparquet_preview.csv", index=False)
      except Exception as err:
          print(f"ERROR: DuckDB conversion failed: {err}", file=sys.stderr)
          sys.exit(1)

      duration = round(time.time() - start_ts, 2)
      metrics = {
          "total_features": total_features,
          "raw_geojson_mb": raw_bytes_mb,
          "geoparquet_mb": geoparquet_bytes_mb,
          "compression_ratio_pct": ratio,
          "duration_seconds": duration,
          "status": "SUCCESS"
      }

      with open("spatial_metrics.json", "w", encoding="utf-8") as f:
          json.dump(metrics, f, indent=2)

      print(f"ETL completed in {duration}s: {total_features} features, {ratio}% compression.")

      Kestra.outputs({
          "total_features": total_features,
          "raw_geojson_mb": raw_bytes_mb,
          "geoparquet_mb": geoparquet_bytes_mb,
          "compression_ratio_pct": ratio,
          "duration_seconds": duration
      })

  - id: notify_geospatial_team
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Posts geospatial ETL delivery scorecards and storage reduction metrics to Slack.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "{{ inputs.notification_slack_channel }}",
        "text": "DuckDB Spatial GeoParquet ETL Pipeline Completed: {{ outputs.process_spatial_data_with_duckdb.vars.total_features }} features processed ({{ outputs.process_spatial_data_with_duckdb.vars.compression_ratio_pct }}% compression) in {{ outputs.process_spatial_data_with_duckdb.vars.duration_seconds }}s."
      }

errors:
  - id: alert_spatial_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alert Slack if spatial ETL pipeline fails.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "{{ inputs.notification_slack_channel }}",
        "text": "CRITICAL: DuckDB Spatial GeoJSON to GeoParquet pipeline failed on execution `{{ execution.id }}`."
      }

extend:
  title: DuckDB Spatial GeoJSON to GeoParquet Pipeline
  shortDescription: Geospatial ETL pipeline converting GeoJSON datasets into compressed GeoParquet using DuckDB.
  metaTitle: DuckDB Spatial GeoJSON to GeoParquet Pipeline | Kestra Blueprint
  metaDescription: Stream raw GeoJSON data, validate geometries, and write columnar GeoParquet files using DuckDB Spatial.
  description: |
    Automates continuous geospatial ETL by streaming raw GeoJSON datasets, validating geometries, and writing compressed GeoParquet with DuckDB.
  tags:
    - Data
    - Cloud
  subTags:
    - Change Data Capture (CDC)
    - Reporting & Digests
  ee: false
  demo: false
