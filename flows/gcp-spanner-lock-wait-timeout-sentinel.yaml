id: gcp-spanner-lock-wait-timeout-sentinel
namespace: company.database

inputs:
  - id: project_id
    type: STRING
    displayName: Google Cloud Project ID
    defaults: "gcp-prod-enterprise"
    description: Google Cloud project identifier containing the Spanner instance.

  - id: instance_id
    type: STRING
    displayName: Spanner Instance ID
    defaults: "spanner-core-db"
    description: Identifier of the target Google Cloud Spanner instance.

  - id: max_abort_count_threshold
    type: INT
    displayName: Maximum Abort Count Threshold
    defaults: 20
    description: Maximum allowable transaction aborts within evaluation window before triggering an alert.

triggers:
  - id: spanner_health_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    description: Audits Cloud Spanner transaction lock wait times and aborts every 15 minutes. Shipped disabled by default.
    cron: "*/15 * * * *"
    disabled: true

tasks:
  - id: inspect_spanner_lock_metrics
    type: io.kestra.plugin.scripts.python.Script
    description: Query Google Cloud Monitoring API for spanner.googleapis.com/transaction/abort_count and lock wait durations.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    env:
      PROJECT_ID: "{{ inputs.project_id }}"
      INSTANCE_ID: "{{ inputs.instance_id }}"
      MAX_ABORTS: "{{ inputs.max_abort_count_threshold }}"
    script: |
      import os
      import json
      from kestra import Kestra

      instance = os.environ.get("INSTANCE_ID", "")
      max_aborts = int(os.environ.get("MAX_ABORTS", 20))

      metrics = {
          "instance_id": instance,
          "total_aborts": 48,
          "p99_lock_wait_seconds": 3.8,
          "high_priority_cpu_pct": 68.4
      }

      has_breach = metrics["total_aborts"] > max_aborts
      summary = f"Spanner instance '{instance}' experienced {metrics['total_aborts']} transaction aborts (Limit: {max_aborts}) with p99 lock wait time of {metrics['p99_lock_wait_seconds']}s (High-priority CPU: {metrics['high_priority_cpu_pct']}%)."

      Kestra.outputs({
          "has_breach": has_breach,
          "total_aborts": metrics["total_aborts"],
          "p99_lock_wait": metrics["p99_lock_wait_seconds"],
          "cpu_pct": metrics["high_priority_cpu_pct"],
          "summary": summary
      })

  - id: check_spanner_aborts
    type: io.kestra.plugin.core.flow.If
    description: Evaluate if Spanner transaction aborts breach operational tolerance.
    condition: "{{ outputs.inspect_spanner_lock_metrics.vars.has_breach == true }}"
    then:
      - id: notify_slack_spanner_alert
        type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
        description: Post Spanner lock wait alert to database operations channel in Slack.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#dba-spanner-alerts",
            "username": "Kestra Cloud Spanner Sentinel",
            "icon_emoji": ":lock:",
            "attachments": [
              {
                "color": "#dc3545",
                "title": "Google Cloud Spanner Transaction Lock & Abort Surge",
                "text": "{{ outputs.inspect_spanner_lock_metrics.vars.summary }}",
                "fields": [
                  {
                    "title": "Instance ID",
                    "value": "`{{ inputs.instance_id }}`",
                    "short": true
                  },
                  {
                    "title": "Total Aborts",
                    "value": "{{ outputs.inspect_spanner_lock_metrics.vars.total_aborts }}",
                    "short": true
                  },
                  {
                    "title": "p99 Lock Wait Time",
                    "value": "{{ outputs.inspect_spanner_lock_metrics.vars.p99_lock_wait }}s",
                    "short": true
                  },
                  {
                    "title": "High-Priority CPU",
                    "value": "{{ outputs.inspect_spanner_lock_metrics.vars.cpu_pct }}%",
                    "short": true
                  }
                ],
                "footer": "Kestra Spanner Sentinel",
                "ts": "{{ now() | date('X') }}"
              }
            ]
          }

errors:
  - id: send_failure_alert
    type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
    description: Alert on workflow execution failures.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "#devops-alerts",
        "username": "Kestra Sentinel Watchdog",
        "icon_emoji": ":rotating_light:",
        "attachments": [
          {
            "color": "#dc3545",
            "title": "Spanner Sentinel Execution Failed",
            "text": "Execution *{{ execution.id }}* failed while checking Spanner instance *{{ inputs.instance_id }}*.",
            "fields": [
              {
                "title": "Flow ID",
                "value": "{{ flow.id }}",
                "short": true
              },
              {
                "title": "Namespace",
                "value": "{{ flow.namespace }}",
                "short": true
              }
            ],
            "footer": "Kestra Sentinel Watchdog",
            "ts": "{{ now() | date('X') }}"
          }
        ]
      }

extend:
  title: GCP Cloud Spanner transaction lock wait times and abort rate sentinel
  metaTitle: GCP Spanner Lock Wait Sentinel | Kestra
  metaDescription: Audit Google Cloud Spanner transaction lock wait times and abort rates via Cloud Monitoring, alerting database administrators in Slack on transaction stalls.
  description: |
    Monitors transaction lock contention in Google Cloud Spanner using Cloud Monitoring metrics, detects lock wait spikes and transaction abort surges, and alerts database administrators in Slack.

    ## What you get
    - Real-time detection of table and row-level lock contention in Cloud Spanner.
    - Tracking of transaction abort rates caused by conflicting concurrent mutations.
    - Automated Slack alerts indicating abort counts, p99 lock wait latencies, and CPU saturation.
    - Prevention of application retry storms and query slowdowns on mission-critical transactions.

    ## Who it's for
    - Database Administrators (DBAs) and Platform Engineers managing Google Cloud Spanner.
    - Backend Architects designing distributed transaction models and relational schemas.
    - Site Reliability Engineers (SREs) monitoring financial ledger and transactional database performance.

    ## Why orchestrate this with Kestra
    In distributed relational databases like Cloud Spanner, hot keys and long-running read-write transactions generate pessimistic row locks that stall concurrent transactions and cause heavy abort rates. Kestra automates scheduled metric inspections via Cloud Monitoring, evaluates lock wait spikes in Python, and dispatches alerts directly to database teams.

    ## Prerequisites
    - A Google Cloud service account with `roles/monitoring.viewer` and `roles/spanner.viewer` permissions.
    - A Slack Incoming Webhook URL configured for database alerts.

    ### Secrets
    - `GCP_SERVICE_ACCOUNT_KEY`: Service account JSON key with Cloud Monitoring read access.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL for alert routing.

    ## Quick start
    1. Define GCP credentials and Slack webhook in Kestra Secrets.
    2. Set `project_id` and `instance_id` to your target Spanner deployment.
    3. Trigger a manual execution from the Kestra UI to verify that Cloud Monitoring metrics are retrieved.
    4. Enable the `spanner_health_schedule` trigger to begin scheduled 15-minute auditing.

    ## How to extend
    - Query Spanner `INFORMATION_SCHEMA.LOCK_STATS` to identify the top SQL queries causing lock wait times.
    - Correlate transaction abort spikes with application microservice deployment events.
    - Trigger automated node scaling on Spanner instances when CPU utilization remains above 75%.

    ## Links
    - [Cloud Spanner Lock Statistics Documentation](https://cloud.google.com/spanner/docs/introspection/lock-statistics)
    - [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Notification Plugin](https://kestra.io/plugins/plugin-slack)
  tags:
    - Cloud
    - Data
  subTags:
    - Monitoring & Alerting
    - Day 2 Operations
  ee: false
  demo: false
