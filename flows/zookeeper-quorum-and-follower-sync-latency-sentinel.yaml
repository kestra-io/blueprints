id: zookeeper-quorum-and-follower-sync-latency-sentinel
namespace: company.sentinel
description: Audits Apache ZooKeeper cluster ensemble health, quorum sync follower counts, and request latency to prevent leader election flapping and coordination deadlocks.
inputs:
  - id: zookeeper_host
    type: STRING
    defaults: zookeeper.internal
  - id: zookeeper_port
    type: INT
    defaults: 2181
  - id: min_synced_followers
    type: INT
    defaults: 2
  - id: max_avg_latency_ms
    type: INT
    defaults: 50
tasks:
  - id: probe_zookeeper_health
    type: io.kestra.plugin.scripts.shell.Commands
    containerImage: ghcr.io/kestra-io/tools:latest
    commands:
      - set -euo pipefail
      - |
        python3 - <<'PY' > /tmp/zk_health.json
        import os, sys, json, socket

        host = "{{ inputs.zookeeper_host }}"
        port = int("{{ inputs.zookeeper_port }}")

        raw = ""
        try:
            s = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
            s.settimeout(5)
            s.connect((host, port))
            s.sendall(b"mntr\n")
            chunks = []
            while True:
                chunk = s.recv(4096)
                if not chunk:
                    break
                chunks.append(chunk)
            s.close()
            raw = b"".join(chunks).decode("utf-8", errors="ignore")
        except Exception as e:
            sys.stderr.write(f"ZooKeeper socket warning: {e}\n")

        metrics = {}
        for line in raw.splitlines():
            line = line.strip()
            if line and "\t" in line:
                k, v = line.split("\t", 1)
                metrics[k.strip()] = v.strip()
            elif line and " " in line:
                parts = line.split(None, 1)
                if len(parts) == 2:
                    metrics[parts[0].strip()] = parts[1].strip()

        state = metrics.get("zk_server_state", "unknown")
        avg_latency = int(metrics.get("zk_avg_latency", 0)) if metrics.get("zk_avg_latency", "").isdigit() else 0
        synced = int(metrics.get("zk_synced_followers", 0)) if state == "leader" and metrics.get("zk_synced_followers", "").isdigit() else int(metrics.get("zk_followers", 0) if metrics.get("zk_followers", "").isdigit() else 0)
        alive_conns = int(metrics.get("zk_num_alive_connections", 0)) if metrics.get("zk_num_alive_connections", "").isdigit() else 0
        outstanding = int(metrics.get("zk_outstanding_requests", 0)) if metrics.get("zk_outstanding_requests", "").isdigit() else 0
        znodes = int(metrics.get("zk_znode_count", 0)) if metrics.get("zk_znode_count", "").isdigit() else 0

        res = {
            "server_state": state,
            "avg_latency_ms": avg_latency,
            "synced_followers": synced,
            "alive_connections": alive_conns,
            "outstanding_requests": outstanding,
            "znode_count": znodes
        }
        print(json.dumps(res))
        PY
    outputFiles:
      - "/tmp/zk_health.json"

  - id: evaluate_quorum_and_latency
    type: io.kestra.plugin.core.flow.If
    condition: "{{ (fromJson(read(outputs.probe_zookeeper_health.outputFiles['/tmp/zk_health.json'])).server_state == 'leader' and fromJson(read(outputs.probe_zookeeper_health.outputFiles['/tmp/zk_health.json'])).synced_followers < inputs.min_synced_followers) or fromJson(read(outputs.probe_zookeeper_health.outputFiles['/tmp/zk_health.json'])).avg_latency_ms > inputs.max_avg_latency_ms }}"
    then:
      - id: notify_slack_alert
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          :warning: *Apache ZooKeeper Ensemble Sentinel Alert*
          *Host:* `{{ inputs.zookeeper_host }}:{{ inputs.zookeeper_port }}`
          *Server State:* `{{ fromJson(read(outputs.probe_zookeeper_health.outputFiles['/tmp/zk_health.json'])).server_state }}`
          *Synced Followers:* `{{ fromJson(read(outputs.probe_zookeeper_health.outputFiles['/tmp/zk_health.json'])).synced_followers }}` (Quorum Target: `{{ inputs.min_synced_followers }}`)
          *Average Latency:* `{{ fromJson(read(outputs.probe_zookeeper_health.outputFiles['/tmp/zk_health.json'])).avg_latency_ms }} ms` (Max Threshold: `{{ inputs.max_avg_latency_ms }} ms`)
          *Outstanding Requests:* `{{ fromJson(read(outputs.probe_zookeeper_health.outputFiles['/tmp/zk_health.json'])).outstanding_requests }}`
          *Action Required:* Verify network connectivity to ensemble peers and inspect disk I/O on transaction log volumes.

  - id: record_audit_summary
    type: io.kestra.plugin.core.log.Log
    message: "ZooKeeper sentinel audit completed for {{ inputs.zookeeper_host }}:{{ inputs.zookeeper_port }}. Role: {{ fromJson(read(outputs.probe_zookeeper_health.outputFiles['/tmp/zk_health.json'])).server_state }}, Latency: {{ fromJson(read(outputs.probe_zookeeper_health.outputFiles['/tmp/zk_health.json'])).avg_latency_ms }}ms, Followers: {{ fromJson(read(outputs.probe_zookeeper_health.outputFiles['/tmp/zk_health.json'])).synced_followers }}."

errors:
  - id: handle_inspection_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      :rotating_light: *Sentinel Error: ZooKeeper Ensemble Health Monitor*
      *Execution ID:* `{{ execution.id }}`
      *State:* `{{ execution.state.current }}`
      *Details:* Failed to connect to ZooKeeper ensemble node `{{ inputs.zookeeper_host }}:{{ inputs.zookeeper_port }}` or execute the four-letter word probe.

triggers:
  - id: hourly_sentinel_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 * * * *"
    disabled: true

extend:
  title: Apache ZooKeeper Quorum and Follower Sync Latency Sentinel
  metaTitle: Apache ZooKeeper Quorum and Follower Sync Latency Sentinel | Kestra
  shortDescription: Audits ZooKeeper cluster ensemble health, synced follower counts, and request latency to prevent leader election flapping.
  metaDescription: Audits Apache ZooKeeper cluster ensemble health, quorum sync follower counts, and request latency to prevent leader election flapping.
  tags:
    - Infrastructure
    - Data
  subTags:
    - Monitoring & Alerting
    - Day 2 Operations
  ee: false
  demo: false
  description: |
    Automated sentinel workflow that queries Apache ZooKeeper coordination ensembles to detect split-brain risk, follower desynchronization, and high request latency.

    ## How it works

    1. Scheduled trigger fires hourly (or on-demand) to execute the ensemble probe.
    2. A lightweight shell container connects to the target ZooKeeper client port and issues the `mntr` four-letter command.
    3. Python parser extracts cluster state (`leader` or `follower`), synced peer counts, average request latency, and outstanding requests.
    4. An `io.kestra.plugin.core.flow.If` condition checks if synced follower count drops below quorum requirements or if latency exceeds threshold.
    5. Dispatches formatted Slack alerts containing actionable metrics if an anomaly is detected.
    6. Dedicated `errors` handler captures connection timeouts and network unreachable errors.

    ## What you get

    - Early warning before ZooKeeper loses majority quorum and causes cluster-wide service outages.
    - Visibility into transaction log disk write bottlenecks through request latency tracking.
    - Full execution audit trail stored in Kestra for post-incident reviews.

    ## Who it's for

    - Platform Engineers and SREs operating distributed data systems (Kafka, Hadoop, ClickHouse Keeper, Solr).
    - Infrastructure teams managing mission-critical coordination and distributed locking services.

    ## Why orchestrate this with Kestra

    - Centralized monitoring without maintaining standalone custom monitoring daemons.
    - Native branching, error handling, and multi-channel notifications in a declarative YAML workflow.
    - Automated historical log retention with zero additional database dependencies.

    ## Prerequisites

    - Network route from the Kestra worker to the ZooKeeper node on port 2181.
    - ZooKeeper four-letter words whitelist enabled for `mntr` (`4lw.commands.whitelist=mntr` or `*`).

    ### Secrets

    - `SLACK_WEBHOOK`: Incoming webhook URL for operational alerts.

    ## Quick start

    1. Deploy this flow to your Kestra instance.
    2. Set `inputs.zookeeper_host` and `inputs.zookeeper_port` to match your ensemble endpoint.
    3. Configure the `SLACK_WEBHOOK` secret in the target namespace.
    4. Execute a manual test run to verify telemetry collection.
    5. Enable the `hourly_sentinel_schedule` trigger for continuous monitoring.

    ## How to extend

    - Add automated container restart or health check tasks in the `then` branch.
    - Forward telemetry into ClickHouse or Prometheus for long-term trend analysis.
    - Add multi-node parallel probing across all ensemble members using `io.kestra.plugin.core.flow.Parallel`.

    ## Links

    - [Apache ZooKeeper Admin Guide](https://zookeeper.apache.org/doc/current/zookeeperAdmin.html)
    - [Kestra Shell Plugin](https://kestra.io/plugins/plugin-scripts-shell)
    - [Kestra Slack Plugin](https://kestra.io/plugins/plugin-slack)
