id: dynamodb-idle-tables-finder
namespace: company.team

description: |
  Finds DynamoDB tables billing for provisioned capacity they never use. A
  provisioned table reserves RCU/WCU around the clock whether it serves a
  million requests or zero. (On-demand tables have no idle cost, so the flow
  skips them entirely.) This flow checks consumed capacity over your idle
  window and reports provisioned tables with zero traffic, so you can switch
  them to on-demand or delete them.

inputs:
  - id: aws_regions
    type : ARRAY
    itemType: STRING
    defaults: ["us-east-1"]
    description: AWS regions to audit for idle DynamoDB tables.
  - id: idle_days
    type : INT
    defaults: 14
    description: Tables with zero consumed read AND write capacity over this many days count as idle.

tasks:
  - id: check_tables
    type: io.kestra.plugin.core.flow.ForEach
    description: Audit DynamoDB tables region by region.
    values: "{{ inputs.aws_regions }}"
    tasks:
      - id: audit_region
        type: io.kestra.plugin.aws.cli.AwsCLI
        description: List tables, check billing mode, and pull consumed-capacity metrics per table.
        region: "{{ taskrun.value }}"
        accessKeyId: "{{ secret('AWS_ACCESS_KEY_ID') }}"
        secretKeyId: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
        commands:
          - |
            REGION="{{ taskrun.value }}"
            DAYS={{ inputs.idle_days }}
            END=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            START=$(date -u -d "$DAYS days ago" +%Y-%m-%dT%H:%M:%SZ)
            PERIOD=$((DAYS * 86400))
            echo "Auditing DynamoDB tables in $REGION (traffic window: last $DAYS days)"
            IDLE_COUNT=0
            IDLE_LIST=""
            for T in $(aws dynamodb list-tables --region "$REGION" --query 'TableNames' --output text | tr '\t' '\n'); do
              MODE=$(aws dynamodb describe-table --region "$REGION" --table-name "$T" \
                --query 'Table.BillingModeSummary.BillingMode' --output text 2>/dev/null)
              case "$MODE" in ''|'None') MODE=PROVISIONED;; esac
              if [ "$MODE" = "PAY_PER_REQUEST" ]; then
                echo "table $T: on-demand — no idle cost, skipped"
                continue
              fi
              READ=$(aws cloudwatch get-metric-statistics --region "$REGION" \
                --namespace AWS/DynamoDB --metric-name ConsumedReadCapacityUnits \
                --dimensions Name=TableName,Value="$T" \
                --start-time "$START" --end-time "$END" \
                --period "$PERIOD" --statistics Sum \
                --query 'Datapoints[0].Sum' --output text 2>/dev/null)
              WRITE=$(aws cloudwatch get-metric-statistics --region "$REGION" \
                --namespace AWS/DynamoDB --metric-name ConsumedWriteCapacityUnits \
                --dimensions Name=TableName,Value="$T" \
                --start-time "$START" --end-time "$END" \
                --period "$PERIOD" --statistics Sum \
                --query 'Datapoints[0].Sum' --output text 2>/dev/null)
              case "$READ" in ''|'None') READ=0;; esac
              case "$WRITE" in ''|'None') WRITE=0;; esac
              RINT=${READ%.*}
              WINT=${WRITE%.*}
              echo "table $T (provisioned): ${RINT} reads + ${WINT} writes consumed in ${DAYS}d"
              if [ "$RINT" -eq 0 ] && [ "$WINT" -eq 0 ]; then
                IDLE_LIST="${IDLE_LIST}${T}, "
                IDLE_COUNT=$((IDLE_COUNT + 1))
              fi
            done
            echo "IDLE_COUNT=$IDLE_COUNT"
            echo "IDLE_TABLES=$IDLE_LIST"
            echo "REGION_DONE=$REGION"
            if [ "$IDLE_COUNT" -gt 0 ]; then
              echo "WASTE_FOUND"
            fi
      - id: notify_region
        type: io.kestra.plugin.core.flow.If
        description: Alert on idle provisioned tables, stay quiet when everything serves traffic.
        condition: "{{ outputs.audit_region.stdout contains 'WASTE_FOUND' }}"
        then:
          - id: slack_idle
            type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
            url: "{{ secret('SLACK_WEBHOOK_URL') }}"
            payload: |
              {
                "text": ":money_with_wings: DynamoDB idle check `{{ outputs.audit_region.vars.REGION_DONE }}` — *{{ outputs.audit_region.vars.IDLE_COUNT }}* provisioned table(s) with zero traffic in {{ inputs.idle_days }} days.\n`{{ outputs.audit_region.vars.IDLE_TABLES }}`\nSwitch them to on-demand billing or delete them to stop paying for reserved capacity."
              }
        else:
          - id: log_busy
            type: io.kestra.plugin.core.log.Log
            message: "No idle DynamoDB tables in {{ outputs.audit_region.vars.REGION_DONE }} — every provisioned table served traffic in the last {{ inputs.idle_days }} days."

triggers:
  - id: weekly
    type: io.kestra.plugin.core.trigger.Schedule
    description: Weekly on Monday at 09:00 UTC. Shipped disabled; enable after your first manual run.
    cron: "0 9 * * 1"
    disabled: true

extend:
  title: DynamoDB Idle Tables Finder
  metaTitle: Find Idle DynamoDB Tables Burning Provisioned Capacity | Kestra
  shortDescription: Scan DynamoDB tables across regions, check 14 days of consumed read/write capacity, and flag provisioned tables with zero traffic.
  metaDescription: Idle provisioned DynamoDB tables bill for RCU/WCU doing nothing. This flow flags zero-traffic tables via CloudWatch and reports them weekly.
  description: |
    Provisioned DynamoDB capacity is reserved — and billed — whether your table serves a million requests or zero. Abandoned tables from old projects, test tables nobody dropped, and tables whose workloads moved elsewhere keep charging for RCU/WCU month after month. (On-demand tables only bill for what they use, so this flow skips them entirely — there is no idle cost to find.)

    ## How it works

    1. A Schedule trigger fires weekly on Monday at 09:00 UTC (shipped disabled).
    2. A ForEach loop audits each region in `aws_regions`.
    3. Per region, the flow lists every table, then checks `BillingModeSummary.BillingMode` via `describe-table` — on-demand tables are skipped with a log line.
    4. For each provisioned table, one CloudWatch call sums `ConsumedReadCapacityUnits` and one sums `ConsumedWriteCapacityUnits` over the `idle_days` window.
    5. An `If` task posts a Slack alert with the idle table names only when both sums are zero — no spam on clean weeks.

    ## What you get

    - A weekly list of provisioned tables with zero consumed capacity, with per-table read/write evidence.
    - A concrete remediation for each finding: switch to on-demand billing or delete the table.
    - Multi-region coverage in one run, with the idle window tunable via `idle_days`.
    - Silence when everything serves traffic — alerts only on real findings.

    ## Who it's for

    Platform engineers and FinOps-minded teams who suspect their DynamoDB bill includes tables nobody queries anymore.

    ## Why orchestrate this with Kestra

    A one-off CLI session finds today's idle tables and is forgotten by next month. As a scheduled Kestra flow the audit runs itself, the idle window is an input anyone can tune, every run is logged for audit, and adding a region is one list entry — not a new script.

    ## Prerequisites

    - AWS credentials with `dynamodb:ListTables`, `dynamodb:DescribeTable` and `cloudwatch:GetMetricStatistics` permissions.
    - A Slack incoming webhook URL.

    ### Secrets

    - `AWS_ACCESS_KEY_ID`: AWS access key for the DynamoDB and CloudWatch API calls.
    - `AWS_SECRET_ACCESS_KEY`: AWS secret key for the DynamoDB and CloudWatch API calls.
    - `SLACK_WEBHOOK_URL`: Incoming webhook URL for the idle-table alert.

    ## Quick start

    1. Add the three secrets above to your Kestra namespace.
    2. Set `aws_regions` to the regions you run DynamoDB in.
    3. Run manually once and review the Slack report (or the clean log line).
    4. Enable the weekly schedule trigger.

    ## How to extend

    - Also check provisioned RCU/WCU settings to size the savings per table.
    - Auto-switch confirmed-idle tables to on-demand billing for a remediation flow.
    - Exclude tables tagged `Keep=true` for known standby tables.

    ## Links

    - [Kestra AWS plugins](https://kestra.io/plugins)
    - [Kestra Slack plugins](https://kestra.io/plugins)
    - [DynamoDB on-demand vs provisioned](https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/HowItWorks.ReadWriteCapacityMode.html)
    - [DynamoDB CloudWatch metrics](https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/metrics-dimensions.html)
  tags:
    - Infrastructure
  subTags:
    - FinOps & Cost Management
    - Monitoring & Alerting
  ee: false
  demo: false
