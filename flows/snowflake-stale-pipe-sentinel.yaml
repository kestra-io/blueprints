id: snowflake-stale-pipe-sentinel
namespace: company.dataops

inputs:
  - id: snowflake_account
    type: STRING
    defaults: xy12345.us-east-1
    description: Snowflake account identifier.
  - id: snowflake_username
    type: STRING
    defaults: kestra_monitor
    description: Snowflake service user.
  - id: pipe_name
    type: STRING
    defaults: ANALYTICS.PUBLIC.RAW_EVENTS_PIPE
    description: Fully qualified name of the Snowpipe to inspect.

tasks:
  - id: query_pipe_status
    type: io.kestra.plugin.jdbc.snowflake.Query
    url: "jdbc:snowflake://{{ inputs.snowflake_account }}.snowflakecomputing.com"
    username: "{{ inputs.snowflake_username }}"
    password: "{{ secret('SNOWFLAKE_PASSWORD') }}"
    sql: |
      SELECT SYSTEM$PIPE_STATUS('{{ inputs.pipe_name }}') AS STATUS_JSON;
    fetchType: FETCH_ONE

  - id: evaluate_pipe_health
    type: io.kestra.plugin.core.flow.If
    condition: "{{ fromJson(outputs.query_pipe_status.row.STATUS_JSON).executionState != 'RUNNING' or fromJson(outputs.query_pipe_status.row.STATUS_JSON).pendingFileCount > 50 }}"
    then:
      - id: alert_data_pipeline_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "text": ":warning: *Snowflake Snowpipe Stalled Alert*: Pipe `{{ inputs.pipe_name }}` is not in RUNNING state or has accumulated pending files (Execution State: {{ fromJson(outputs.query_pipe_status.row.STATUS_JSON).executionState }}, Pending Files: {{ fromJson(outputs.query_pipe_status.row.STATUS_JSON).pendingFileCount }}). Real-time streaming ingestion is stalled."
          }

errors:
  - id: notify_sentinel_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "text": ":warning: *Snowpipe Sentinel Execution Failure*: Failed to query status for pipe `{{ inputs.pipe_name }}`."
      }

outputs:
  - id: status_json
    type: JSON
    value: "{{ outputs.query_pipe_status.row.STATUS_JSON }}"
  - id: execution_state
    type: STRING
    value: "{{ fromJson(outputs.query_pipe_status.row.STATUS_JSON).executionState }}"
  - id: pending_file_count
    type: INT
    value: "{{ fromJson(outputs.query_pipe_status.row.STATUS_JSON).pendingFileCount }}"

triggers:
  - id: scheduled_pipe_check
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  metaDescription: "Audits Snowflake Snowpipe execution states to detect paused, stalled, or backlogged continuous ingestion streams."
  metaTitle: Snowflake Snowpipe Execution Status and Stalled Ingestion Sentinel with Kestra
  title: Snowflake Snowpipe Execution Status and Stalled Ingestion Sentinel
  shortDescription: Audits Snowflake Snowpipe execution states to detect paused, stalled, or backlogged continuous ingestion streams.
  description: |
    ## How it works
    This sentinel leverages the JDBC Snowflake plugin to query `SYSTEM$PIPE_STATUS` for the specified Snowpipe. It parses the resulting JSON payload to evaluate `executionState` and `pendingFileCount`, alerting data engineers when pipes stall due to SQS notification disconnects, cloud storage permissions, or warehouse limits.

    ## What you get
    - Real-time detection of silent continuous ingestion stalls in Snowflake.
    - Early warning before downstream data freshness SLAs breach.
    - Automated Slack delivery tracking pipe execution state and pending file backlogs.

    ## Who it's for
    - Data engineers and analytics platform engineers managing continuous ingestion into Snowflake.
    - SREs supervising real-time ELT pipeline SLAs.

    ## Why orchestrate this with Kestra
    Kestra runs automated scheduled analytical health checks natively using the Snowflake JDBC plugin suite, combining SQL telemetry with declarative conditional logic and notification dispatching.

    ## Prerequisites
    - Snowflake account access with permissions to call `SYSTEM$PIPE_STATUS`.
    - Secrets `SNOWFLAKE_PASSWORD` and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import this blueprint into Kestra.
    2. Configure `pipe_name`, account details, and credentials.
    3. Run manually to check current pipe status.

    ## How to extend
    - Query `SNOWFLAKE.ACCOUNT_USAGE.PIPE_USAGE_HISTORY` to monitor pipe compute credit consumption.
    - Trigger an automated resume task via `ALTER PIPE ... RESUME` when pipes pause unexpectedly.
    - Export Snowpipe health metrics to Prometheus or Datadog.

    ## Links
    - [Kestra Snowflake Plugin](https://kestra.io/plugins/plugin-jdbc-snowflake)
    - [Snowflake Pipe Status Function](https://docs.snowflake.com/en/sql-reference/functions/pipe_status)
  tags:
    - Data
    - Cloud
  subTags:
    - Monitoring & Alerting
  ee: false
  demo: false
