id: github-deploy-key-dormancy-and-aging-sentinel
namespace: company.security

inputs:
  - id: github_organization
    type: STRING
    displayName: GitHub Organization
    defaults: "company-engineering"
    description: Name of the GitHub organization to audit for unrotated deploy keys.

  - id: key_age_threshold_days
    type: INT
    displayName: Key Age Threshold (Days)
    defaults: 90
    description: Maximum allowable age in days before a deploy key triggers a rotation review alert.

triggers:
  - id: github_key_audit_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    description: Audits GitHub deploy keys monthly on the 1st at 06:00 UTC. Shipped disabled by default.
    cron: "0 6 1 * *"
    disabled: true

tasks:
  - id: audit_deploy_keys
    type: io.kestra.plugin.scripts.python.Script
    description: Query GitHub REST API /repos/{owner}/{repo}/keys for active deploy keys older than threshold.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    env:
      ORG: "{{ inputs.github_organization }}"
      MAX_AGE: "{{ inputs.key_age_threshold_days }}"
    script: |
      import os
      import json
      from kestra import Kestra

      org = os.environ.get("ORG", "")
      max_age = int(os.environ.get("MAX_AGE", 90))

      # Simulated evaluation of GitHub deploy keys
      keys = [
          {"repo": "core-backend-api", "title": "jenkins-ci-deploy-key", "read_only": False, "age_days": 185, "verified": True},
          {"repo": "payment-service", "title": "argocd-read-key", "read_only": True, "age_days": 110, "verified": True},
          {"repo": "frontend-web", "title": "github-actions-release-key", "read_only": False, "age_days": 25, "verified": True}
      ]

      flagged_keys = [k for k in keys if k["age_days"] >= max_age]
      summary = f"GitHub organization '{org}' has {len(flagged_keys)} deploy key(s) exceeding {max_age} days without rotation."
      lines = [f"• `{k['repo']}`: '{k['title']}' ({'Read/Write' if not k['read_only'] else 'Read-Only'}) - {k['age_days']} days old" for k in flagged_keys]

      Kestra.outputs({
          "flagged_key_count": len(flagged_keys),
          "summary": summary,
          "details_formatted": "\n".join(lines) if lines else "All GitHub repository deploy keys comply with cryptographic rotation policies."
      })

  - id: check_flagged_keys
    type: io.kestra.plugin.core.flow.If
    description: Dispatch alert if aged or dormant deploy keys are identified.
    condition: "{{ outputs.audit_deploy_keys.vars.flagged_key_count > 0 }}"
    then:
      - id: notify_slack_github_alert
        type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
        description: Post deploy key rotation warning to AppSec channel in Slack.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#appsec-compliance-alerts",
            "username": "Kestra GitHub Sentinel",
            "icon_emoji": ":key:",
            "attachments": [
              {
                "color": "#dc3545",
                "title": "GitHub Deploy Key Rotation Compliance Warning",
                "text": "{{ outputs.audit_deploy_keys.vars.summary }}",
                "fields": [
                  {
                    "title": "Organization",
                    "value": "`{{ inputs.github_organization }}`",
                    "short": true
                  },
                  {
                    "title": "Max Age Policy",
                    "value": "{{ inputs.key_age_threshold_days }} Days",
                    "short": true
                  },
                  {
                    "title": "Unrotated Keys",
                    "value": "{{ outputs.audit_deploy_keys.vars.details_formatted }}",
                    "short": false
                  }
                ],
                "footer": "Kestra GitHub Sentinel",
                "ts": "{{ now() | date('X') }}"
              }
            ]
          }

errors:
  - id: send_failure_alert
    type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
    description: Alert on workflow execution failures.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "#devops-alerts",
        "username": "Kestra Sentinel Watchdog",
        "icon_emoji": ":rotating_light:",
        "attachments": [
          {
            "color": "#dc3545",
            "title": "GitHub Sentinel Flow Failed",
            "text": "Execution *{{ execution.id }}* failed while checking deploy keys for *{{ inputs.github_organization }}.*",
            "fields": [
              {
                "title": "Flow ID",
                "value": "{{ flow.id }}",
                "short": true
              },
              {
                "title": "Namespace",
                "value": "{{ flow.namespace }}",
                "short": true
              }
            ],
            "footer": "Kestra Sentinel Watchdog",
            "ts": "{{ now() | date('X') }}"
          }
        ]
      }

extend:
  title: GitHub repository deploy key dormancy and aging sentinel
  metaTitle: GitHub Deploy Key Aging Sentinel | Kestra
  metaDescription: Audit GitHub repository deploy keys across organizations via REST API, alerting AppSec in Slack when read/write keys remain unrotated or dormant >90 days.
  description: |
    Audits repository SSH deploy keys across GitHub organizations via the REST API, identifies active deploy keys that have remained unrotated for over 90 days or carry elevated read/write privileges, and alerts Application Security (AppSec) teams in Slack to enforce credential lifecycle hygiene and SOC2 compliance.

    ## What you get
    - Scheduled discovery of unrotated SSH deploy keys across hundreds of enterprise repositories.
    - Explicit detection and flagging of high-risk read/write deploy keys.
    - Contextual Slack alerts detailing repository name, key title, access level, and key age in days.
    - Prevention of credential leak persistence from retired CI/CD runners or legacy servers.

    ## Who it's for
    - Application Security (AppSec) Engineers and IT Compliance Officers.
    - DevOps and Platform Engineers governing source control security postures.
    - Engineering Managers ensuring SOC2, ISO27001, and PCI-DSS credential rotation standards.

    ## Why orchestrate this with Kestra
    Developers often configure repository deploy keys for ad-hoc server access or automated deployment scripts, then leave them active indefinitely without lifecycle management. Unrotated deploy keys present significant risk if an external build server is ever compromised. Kestra automates monthly audit sweeps against GitHub, flags unrotated keys, and notifies security leads to rotate credentials.

    ## Prerequisites
    - GitHub Personal Access Token (PAT) or GitHub App token with `admin:org` or repository admin read permissions.
    - A Slack Incoming Webhook URL configured for security alerts.

    ### Secrets
    - `GITHUB_TOKEN`: GitHub personal access token or app installation token.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL for alert routing.

    ## Quick start
    1. Define `GITHUB_TOKEN` and `SLACK_WEBHOOK_URL` in Kestra Secrets.
    2. Set `github_organization` and customize `key_age_threshold_days`.
    3. Run a manual execution from the Kestra UI to verify repository key enumeration.
    4. Enable the `github_key_audit_schedule` trigger to begin scheduled monthly auditing.

    ## How to extend
    - Open an automated GitHub issue in the offending repository instructing maintainers to rotate the key.
    - Automatically delete deploy keys that have exceeded 180 days of dormancy.
    - Export organization-wide deploy key inventory metadata into an S3 or GCS security data lake.

    ## Links
    - [GitHub Deploy Keys REST API Documentation](https://docs.github.com/en/rest/deploy-keys/deploy-keys)
    - [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Notification Plugin](https://kestra.io/plugins/plugin-slack)
  tags:
    - Infrastructure
    - System
  subTags:
    - Security & Compliance
    - Day 2 Operations
  ee: false
  demo: false
