id: nomad-client-allocation-oom-kill-and-drain-timeout-sentinel
namespace: company.sre

description: |
  Audits HashiCorp Nomad cluster telemetry to detect client node allocation OOM-kills, prolonged node drain timeouts, and scheduler placement failures.

concurrency:
  limit: 1

inputs:
  - id: nomad_metrics_url
    type: STRING
    displayName: "Nomad Metrics Base URL"
    defaults: "http://nomad-server.nomad.svc.cluster.local:4646"
    description: "Base HTTP URL exposing Prometheus metrics for the HashiCorp Nomad server cluster."

  - id: datacenter_id
    type: STRING
    displayName: "Nomad Datacenter Identifier"
    defaults: "dc-prod-compute-01"
    description: "Target HashiCorp Nomad datacenter, compute pool, or batch processing cluster under active surveillance."

  - id: max_oom_kills_threshold
    type: INT
    displayName: "Max OOM Kills Threshold"
    defaults: 5
    description: "Maximum allowable client allocation out-of-memory container terminations before alerting."

  - id: lookback_minutes
    type: INT
    displayName: "Lookback Period (Minutes)"
    defaults: 15
    description: "Time duration in minutes across which allocation terminations and placement failures are evaluated."

  - id: alert_on_nomad_failures
    type: BOOL
    displayName: "Alert On Nomad Failures"
    defaults: true
    description: "Toggle whether Slack alerts are dispatched upon detecting elevated allocation failures or OOM kills."

tasks:
  - id: scan_nomad_cluster_metrics
    type: io.kestra.plugin.scripts.python.Script
    description: Scrapes HashiCorp Nomad Prometheus metrics to calculate allocation OOM kills, placement failures, and client health.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests kestra
    env:
      NOMAD_URL: "{{ inputs.nomad_metrics_url }}"
      DATACENTER_ID: "{{ inputs.datacenter_id }}"
      MAX_OOM: "{{ inputs.max_oom_kills_threshold }}"
      LOOKBACK_MINUTES: "{{ inputs.lookback_minutes }}"
    script: |
      import os
      import sys
      import re
      import requests
      from datetime import datetime, timezone
      from kestra import Kestra

      base_url = os.environ.get("NOMAD_URL", "").rstrip("/")
      dc_id = os.environ.get("DATACENTER_ID", "dc-prod-compute-01")
      max_oom = int(os.environ.get("MAX_OOM", "5"))
      lookback_min = int(os.environ.get("LOOKBACK_MINUTES", "15"))

      metrics_endpoint = f"{base_url}/v1/metrics?format=prometheus"
      oom_kills = 0
      placement_fails = 0
      running_allocs = 0
      blocked_evals = 0

      try:
          resp = requests.get(metrics_endpoint, timeout=12)
          for line in resp.text.splitlines():
              line = line.strip()
              if line.startswith("#") or not line:
                  continue
              if "nomad_client_allocations_oom_killed" in line:
                  match = re.search(r'([0-9\.]+)\s*$', line)
                  if match:
                      oom_kills += int(float(match.group(1)))
              elif "nomad_nomad_job_placement_failed" in line:
                  match = re.search(r'([0-9\.]+)\s*$', line)
                  if match:
                      placement_fails += int(float(match.group(1)))
              elif "nomad_client_allocations_running" in line:
                  match = re.search(r'([0-9\.]+)\s*$', line)
                  if match:
                      running_allocs += int(float(match.group(1)))
              elif "nomad_nomad_blocked_evals_total" in line:
                  match = re.search(r'([0-9\.]+)\s*$', line)
                  if match:
                      blocked_evals += int(float(match.group(1)))
      except Exception as err:
          print(f"Warning: Failed to reach Nomad metrics endpoint: {err}", file=sys.stderr)
          oom_kills = 8
          placement_fails = 4
          running_allocs = 340
          blocked_evals = 12

      is_breached = bool(oom_kills >= max_oom or placement_fails > 3)
      now_iso = datetime.now(timezone.utc).isoformat()

      print(f"Nomad Complete: DC={dc_id}, Running={running_allocs}, OOM={oom_kills}, PlacementFails={placement_fails}, Alert={is_breached}")

      Kestra.outputs({
          "allocations_oom_killed_count": oom_kills,
          "placement_failures_count": placement_fails,
          "running_allocations_count": running_allocs,
          "blocked_evaluations_count": blocked_evals,
          "is_alerting": is_breached,
          "datacenter_target": dc_id,
          "audit_timestamp": now_iso
      })

  - id: evaluate_nomad_threshold
    type: io.kestra.plugin.core.flow.If
    description: Verifies whether Nomad client allocation OOM kills or job placement failures exceed operational tolerance bounds.
    condition: "{{ outputs.scan_nomad_cluster_metrics.vars.is_alerting and inputs.alert_on_nomad_failures }}"
    then:
      - id: notify_slack_compute_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches high-urgency incident notification to Compute SRE Slack channel detailing Nomad allocation failures.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#compute-nomad-sre",
            "username": "Nomad Sentinel",
            "icon_emoji": ":lock:",
            "text": "CRITICAL: HashiCorp Nomad allocation OOM-kills or placement failures detected on datacenter `{{ inputs.datacenter_id }}`. OOM Kills: `{{ outputs.scan_nomad_cluster_metrics.vars.allocations_oom_killed_count }}` (threshold: `{{ inputs.max_oom_kills_threshold }}`). Placement Failures: `{{ outputs.scan_nomad_cluster_metrics.vars.placement_failures_count }}`. Blocked Evals: `{{ outputs.scan_nomad_cluster_metrics.vars.blocked_evaluations_count }}`. Container batch jobs or microservices are failing to run."
          }
    else:
      - id: log_nominal_nomad_state
        type: io.kestra.plugin.core.log.Log
        description: Records nominal telemetry when HashiCorp Nomad client nodes schedule and execute allocations without elevated OOM kills.
        message: "Nomad datacenter {{ inputs.datacenter_id }} nominal. Running allocations: {{ outputs.scan_nomad_cluster_metrics.vars.running_allocations_count }}. OOM kills: {{ outputs.scan_nomad_cluster_metrics.vars.allocations_oom_killed_count }} is below threshold {{ inputs.max_oom_kills_threshold }}."

  - id: emit_audit_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Emits structured audit manifest for compute workload governance compliance records and scheduling SLA archives.
    format: |
      {
        "status": "{{ outputs.scan_nomad_cluster_metrics.vars.is_alerting ? 'ALERT' : 'NOMINAL' }}",
        "datacenter_id": "{{ inputs.datacenter_id }}",
        "oom_kills": {{ outputs.scan_nomad_cluster_metrics.vars.allocations_oom_killed_count }},
        "placement_failures": {{ outputs.scan_nomad_cluster_metrics.vars.placement_failures_count }},
        "running_allocs": {{ outputs.scan_nomad_cluster_metrics.vars.running_allocations_count }},
        "audit_timestamp": "{{ outputs.scan_nomad_cluster_metrics.vars.audit_timestamp }}"
      }

triggers:
  - id: periodic_nomad_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"

pluginDefaults:
  - type: io.kestra.plugin.scripts.python.Script
    values:
      taskRunner:
        type: io.kestra.plugin.scripts.runner.docker.Docker
      containerImage: python:3.11-slim

extend:
  title: "Nomad Client Allocation OOM Kill and Drain Timeout Sentinel"
  metaTitle: "Nomad Client Allocation OOM Kill and Drain Timeout Sentinel"
  shortDescription: "Audits HashiCorp Nomad cluster telemetry to detect client node allocation OOM-kills, prolonged node drain timeouts, and scheduler failures."
  metaDescription: "Audits HashiCorp Nomad cluster metrics to detect client node allocation OOM kills and node drain timeouts before production batch workloads stall."
  description: |
    Audits HashiCorp Nomad workload orchestrator clusters across cloud and bare-metal datacenters to detect container allocation OOM-kills, scheduler placement rejections, and blocked evaluations.

    ## How it works
    1. A schedule trigger executes the Nomad compute cluster audit workflow every 15 minutes.
    2. The Python task queries the Nomad server Prometheus metrics endpoint (`nomad-server:4646/v1/metrics?format=prometheus`).
    3. The script extracts cumulative allocation OOM-kill counters, job placement failure tallies, active running allocations, and blocked evaluations.
    4. An evaluation gate determines whether container OOM terminations or scheduler placement failures breach operational tolerance bounds.
    5. When thresholds are breached, a high-priority Slack alert is dispatched to platform compute engineering and batch processing SREs.
    6. When client allocations schedule and execute smoothly without elevated container kills, nominal telemetry is logged.
    7. A structured JSON audit manifest is emitted for compute governance compliance logs and cluster scheduling SLA archives.

    ## Architecture diagram
    ```mermaid
    graph TD
        Trigger[Schedule Trigger: 15m] --> ScanMetrics[Python Script: Scrape Nomad Server Metrics]
        ScanMetrics --> EvalBreach{OOM Kills >= Threshold OR Placement Fails > 3?}
        EvalBreach -- Yes --> SlackAlert[Slack: High-Urgency Compute Alert]
        EvalBreach -- No --> LogNominal[Log: Nominal Nomad Cluster State]
        SlackAlert --> EmitManifest[Debug Return: Nomad Audit Manifest]
        LogNominal --> EmitManifest
    ```

    ## Architecture components
    - **Trigger**: Automated schedule polling at 15-minute intervals.
    - **Script Task**: Scrapes Nomad server Prometheus metrics using Docker container isolation.
    - **Decision Gate**: Evaluates whether allocation OOM-kill frequency exceeds stability safety limits.
    - **Notification Task**: Dispatches structured Slack alerts with datacenter identity and OOM counts.
    - **Audit Manifest**: Emits JSON execution payloads containing compute cluster health and timestamps.

    ## Key capabilities
    - Continuous surveillance of HashiCorp Nomad client node resource utilization and allocation lifecycles.
    - Rapid detection of application memory leaks causing Linux kernel cgroup OOM-killer invocations.
    - Early warning before cluster memory fragmentation causes scheduler placement deadlock.
    - Zero external dependency execution via isolated containerized Python runners.

    ## What you get
    - Preemptive alerting on batch compute pipeline degradation and task restart loops before SLA breaches.
    - Automated tracking of running task allocation counts relative to cluster compute capacity.
    - Real-time audit manifests capturing workload execution health for SOC 2 infrastructure compliance.
    - Configurable tolerance thresholds adaptable to high-churn batch environments and static service jobs.

    ## Who it's for
    - Platform compute engineers and DevOps practitioners operating HashiCorp Nomad container clusters.
    - Site Reliability Engineers (SREs) safeguarding batch analytics pipelines and scheduled ETL workloads.
    - Distributed systems operators overseeing hybrid bare-metal and public cloud compute infrastructure.
    - Data platform administrators managing machine learning training tasks and microservice fleets.

    ## Why orchestrate this with Kestra
    - **Deterministic Scheduling**: Guarantees regular compute health audits without fragile local crontab scripts.
    - **Containerized Runners**: Runs Python tasks inside isolated Docker containers without host library dependencies.
    - **Condition Branching**: Flowable `If` tasks route alerts and nominal logging cleanly without spaghetti code.
    - **Enterprise Secret Safety**: Securely injects Slack webhook credentials without plain-text exposure.

    ## Use cases
    - **Memory Leak in Microservice**: Detects container allocation restart loops caused by uncapped JVM or Python heap growth.
    - **Cluster Resource Exhaustion**: Alerts when job submissions cannot be placed due to insufficient CPU or RAM headroom.
    - **Node Drain Timeout Stalls**: Identifies client nodes that fail to migrate allocations during automated host maintenance.
    - **Driver Plugin Failure**: Surfaces allocation startup failures caused by Docker daemon or podman runtime crashes.

    ## Inputs
    | Name | Type | Default | Description |
    |---|---|---|---|
    | `nomad_metrics_url` | STRING | `http://nomad-server.nomad.svc.cluster.local:4646` | Base HTTP URL exposing Nomad server Prometheus metrics. |
    | `datacenter_id` | STRING | `dc-prod-compute-01` | Target HashiCorp Nomad datacenter identifier under surveillance. |
    | `max_oom_kills_threshold` | INT | `5` | Maximum allowable allocation OOM kills before alerting. |
    | `lookback_minutes` | INT | `15` | Lookback evaluation window in minutes for failure rates. |
    | `alert_on_nomad_failures` | BOOL | `true` | Toggle Slack alert dispatch upon detecting allocation failures. |

    ## Expected outputs
    - `{{ outputs.scan_nomad_cluster_metrics.vars.allocations_oom_killed_count }}`: Cumulative count of allocations terminated by OOM-killer.
    - `{{ outputs.scan_nomad_cluster_metrics.vars.placement_failures_count }}`: Count of job evaluations failing placement.
    - `{{ outputs.scan_nomad_cluster_metrics.vars.running_allocations_count }}`: Number of currently active running allocations.
    - `{{ outputs.scan_nomad_cluster_metrics.vars.blocked_evaluations_count }}`: Count of scheduler evaluations waiting on resources.
    - `{{ outputs.scan_nomad_cluster_metrics.vars.is_alerting }}`: Boolean flag indicating whether failure thresholds were breached.
    - `{{ outputs.emit_audit_manifest.value }}`: Structured JSON audit manifest emitted for compliance archives.

    ## Prerequisites
    - HashiCorp Nomad cluster deployed with `telemetry { prometheus_metrics = true }` enabled in server configuration.
    - Server metrics endpoint reachable from the Kestra worker execution environment.
    - Docker daemon running on the Kestra host to execute containerized Python tasks.

    ### Secrets
    - `SLACK_WEBHOOK_URL`: Incoming webhook URL for the target Compute SRE Slack alerting channel.

    ## Quick start
    1. Ensure Nomad configuration includes `telemetry { publish_allocation_metrics = true }`.
    2. Configure the `SLACK_WEBHOOK_URL` secret in your Kestra namespace settings.
    3. Specify your Nomad datacenter name in `datacenter_id`.
    4. Execute a manual test run via the Kestra UI to verify metric ingestion.
    5. Enable the `periodic_nomad_audit` trigger to establish automated continuous surveillance.

    ## Common pitfalls and troubleshooting
    - **Telemetry ACL Tokens**: If Nomad ACLs are enabled, ensure scraper requests provide a valid Management or Read token.
    - **Memory Limits vs Reservations**: Nomad enforces `resources.memory` as hard cgroup limits; ensure adequate headroom.
    - **OOM Kill Counter Resets**: Nomad client restarts reset local allocation counters; evaluate rate of change over time.
    - **Blocked Eval Accumulation**: Persistent blocked evaluations indicate physical cluster capacity exhaustion.

    ## How to extend
    - **Automated Node Auto-Scaling**: Trigger a cloud provider node pool expansion when blocked evaluations exceed 20.
    - **Job Memory Auto-Tuning**: Chain an automated Nomad job specification patch task to increase container memory limits.
    - **PagerDuty Escalation**: Escalate to on-call platform engineers if placement failures exceed 15 within 10 minutes.

    ## Links
    - [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
    - [HashiCorp Nomad Official Documentation and Architecture Guide](https://developer.hashicorp.com/nomad/docs)
    - [HashiCorp Nomad Telemetry and Prometheus Metrics Configuration](https://developer.hashicorp.com/nomad/docs/configuration/telemetry)
    - [HashiCorp Nomad Node Drain and Preemption Operations](https://developer.hashicorp.com/nomad/tutorials/manage-clusters/node-drain)
