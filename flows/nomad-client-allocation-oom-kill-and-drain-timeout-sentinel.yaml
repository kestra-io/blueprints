id: nomad-client-allocation-oom-kill-and-drain-timeout-sentinel
namespace: company.sre
description: 'Audits HashiCorp Nomad cluster telemetry to detect client node allocation
  OOM-kills, prolonged node drain timeouts, and scheduler placement failures.

  '
concurrency:
  limit: 1
inputs:
- id: nomad_metrics_url
  type: STRING
  displayName: Nomad Metrics Base URL
  defaults: http://nomad-server.nomad.svc.cluster.local:4646
  description: Base HTTP URL exposing Prometheus metrics for the HashiCorp Nomad server
    cluster.
- id: datacenter_id
  type: STRING
  displayName: Nomad Datacenter Identifier
  defaults: dc-prod-compute-01
  description: Target HashiCorp Nomad datacenter, compute pool, or batch processing
    cluster under active surveillance.
- id: max_oom_kills_threshold
  type: INT
  displayName: Max OOM Kills Threshold
  defaults: 5
  description: Maximum allowable client allocation out-of-memory container terminations
    before alerting.
- id: lookback_minutes
  type: INT
  displayName: Lookback Period (Minutes)
  defaults: 15
  description: Time duration in minutes across which allocation terminations and placement
    failures are evaluated.
- id: alert_on_nomad_failures
  type: BOOL
  displayName: Alert On Nomad Failures
  defaults: true
  description: Toggle whether Slack alerts are dispatched upon detecting elevated
    allocation failures or OOM kills.
tasks:
- id: scan_nomad_cluster_metrics
  type: io.kestra.plugin.scripts.python.Script
  description: Scrapes HashiCorp Nomad Prometheus metrics to calculate allocation
    OOM kills, placement failures, and client health.
  containerImage: python:3.11-slim
  taskRunner:
    type: io.kestra.plugin.scripts.runner.docker.Docker
  beforeCommands:
  - pip install requests kestra
  env:
    NOMAD_URL: '{{ inputs.nomad_metrics_url }}'
    DATACENTER_ID: '{{ inputs.datacenter_id }}'
    MAX_OOM: '{{ inputs.max_oom_kills_threshold }}'
    LOOKBACK_MINUTES: '{{ inputs.lookback_minutes }}'
  script: "import os\nimport sys\nimport re\nimport requests\nfrom datetime import\
    \ datetime, timezone\nfrom kestra import Kestra\n\nbase_url = os.environ.get(\"\
    NOMAD_URL\", \"\").rstrip(\"/\")\ndc_id = os.environ.get(\"DATACENTER_ID\", \"\
    dc-prod-compute-01\")\nmax_oom = int(os.environ.get(\"MAX_OOM\", \"5\"))\nlookback_min\
    \ = int(os.environ.get(\"LOOKBACK_MINUTES\", \"15\"))\n\nmetrics_endpoint = f\"\
    {base_url}/v1/metrics?format=prometheus\"\ntry:\n    resp = requests.get(metrics_endpoint,\
    \ timeout=12)\n    resp.raise_for_status()\nexcept Exception as err:\n    sys.stderr.write(f\"\
    Failed to query Nomad metrics from {metrics_endpoint}: {err}\\n\")\n    sys.exit(1)\n\
    \noom_kills = 0\nplacement_fails = 0\nrunning_allocs = 0\nblocked_evals = 0\n\n\
    for line in resp.text.splitlines():\n    line = line.strip()\n    if line.startswith(\"\
    #\") or not line:\n        continue\n    if \"nomad_client_allocations_oom_killed\"\
    \ in line:\n        match = re.search(r'([0-9\\.]+)\\s*$', line)\n        if match:\n\
    \            oom_kills += int(float(match.group(1)))\n    elif \"nomad_nomad_job_placement_failed\"\
    \ in line:\n        match = re.search(r'([0-9\\.]+)\\s*$', line)\n        if match:\n\
    \            placement_fails += int(float(match.group(1)))\n    elif \"nomad_client_allocations_running\"\
    \ in line:\n        match = re.search(r'([0-9\\.]+)\\s*$', line)\n        if match:\n\
    \            running_allocs += int(float(match.group(1)))\n    elif \"nomad_nomad_blocked_evals_total\"\
    \ in line:\n        match = re.search(r'([0-9\\.]+)\\s*$', line)\n        if match:\n\
    \            blocked_evals += int(float(match.group(1)))\n\nis_breached = bool(oom_kills\
    \ >= max_oom or placement_fails > 3)\nnow_iso = datetime.now(timezone.utc).isoformat()\n\
    \nKestra.outputs({\n    \"allocations_oom_killed_count\": oom_kills,\n    \"placement_failures_count\"\
    : placement_fails,\n    \"running_allocations_count\": running_allocs,\n    \"\
    blocked_evaluations_count\": blocked_evals,\n    \"is_alerting\": is_breached,\n\
    \    \"datacenter_target\": dc_id,\n    \"audit_timestamp\": now_iso\n})\n"
- id: evaluate_nomad_threshold
  type: io.kestra.plugin.core.flow.If
  description: Verifies whether Nomad client allocation OOM kills or job placement
    failures exceed operational tolerance bounds.
  condition: '{{ outputs.scan_nomad_cluster_metrics.vars.is_alerting and inputs.alert_on_nomad_failures
    }}'
  then:
  - id: notify_slack_compute_team
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Dispatches high-urgency incident notification to Compute SRE Slack
      channel detailing Nomad allocation failures.
    url: '{{ secret(''SLACK_WEBHOOK_URL'') }}'
    payload: "{\n  \"channel\": \"#compute-nomad-sre\",\n  \"username\": \"Nomad Sentinel\"\
      ,\n  \"icon_emoji\": \":lock:\",\n  \"text\": \"CRITICAL: HashiCorp Nomad allocation\
      \ OOM-kills or placement failures detected on datacenter `{{ inputs.datacenter_id\
      \ }}`. OOM Kills: `{{ outputs.scan_nomad_cluster_metrics.vars.allocations_oom_killed_count\
      \ }}` (threshold: `{{ inputs.max_oom_kills_threshold }}`). Placement Failures:\
      \ `{{ outputs.scan_nomad_cluster_metrics.vars.placement_failures_count }}`.\
      \ Blocked Evals: `{{ outputs.scan_nomad_cluster_metrics.vars.blocked_evaluations_count\
      \ }}`. Container batch jobs or microservices are failing to run.\"\n}\n"
  else:
  - id: log_nominal_nomad_state
    type: io.kestra.plugin.core.log.Log
    description: Records nominal telemetry when HashiCorp Nomad client nodes schedule
      and execute allocations without elevated OOM kills.
    message: 'Nomad datacenter {{ inputs.datacenter_id }} nominal. Running allocations:
      {{ outputs.scan_nomad_cluster_metrics.vars.running_allocations_count }}. OOM
      kills: {{ outputs.scan_nomad_cluster_metrics.vars.allocations_oom_killed_count
      }} is below threshold {{ inputs.max_oom_kills_threshold }}.'
- id: emit_audit_manifest
  type: io.kestra.plugin.core.debug.Return
  description: Emits structured audit manifest for compute workload governance compliance
    records and scheduling SLA archives.
  format: "{\n  \"status\": \"{{ outputs.scan_nomad_cluster_metrics.vars.is_alerting\
    \ ? 'ALERT' : 'NOMINAL' }}\",\n  \"datacenter_id\": \"{{ inputs.datacenter_id\
    \ }}\",\n  \"oom_kills\": {{ outputs.scan_nomad_cluster_metrics.vars.allocations_oom_killed_count\
    \ }},\n  \"placement_failures\": {{ outputs.scan_nomad_cluster_metrics.vars.placement_failures_count\
    \ }},\n  \"running_allocs\": {{ outputs.scan_nomad_cluster_metrics.vars.running_allocations_count\
    \ }},\n  \"audit_timestamp\": \"{{ outputs.scan_nomad_cluster_metrics.vars.audit_timestamp\
    \ }}\"\n}\n"
triggers:
- id: periodic_nomad_audit
  type: io.kestra.plugin.core.trigger.Schedule
  cron: '*/15 * * * *'
  disabled: true
extend:
  title: Nomad Client Allocation OOM Kill and Drain Timeout Sentinel
  metaTitle: Nomad Client Allocation OOM Kill and Drain Timeout Sentinel
  shortDescription: Audits HashiCorp Nomad cluster telemetry to detect client node
    allocation OOM-kills, prolonged node drain timeouts, and scheduler failures.
  metaDescription: Audits HashiCorp Nomad cluster metrics to detect client node allocation
    OOM kills and node drain timeouts before production batch workloads stall.
  description: "Audits HashiCorp Nomad workload orchestrator clusters across cloud\
    \ and bare-metal datacenters to detect container allocation OOM-kills, scheduler\
    \ placement rejections, and blocked evaluations.\n\n## How it works\n1. A schedule\
    \ trigger executes the Nomad compute cluster audit workflow every 15 minutes.\n\
    2. The Python task queries the Nomad server Prometheus metrics endpoint (`nomad-server:4646/v1/metrics?format=prometheus`).\n\
    3. The script extracts cumulative allocation OOM-kill counters, job placement\
    \ failure tallies, active running allocations, and blocked evaluations.\n4. An\
    \ evaluation gate determines whether container OOM terminations or scheduler placement\
    \ failures breach operational tolerance bounds.\n5. When thresholds are breached,\
    \ a high-priority Slack alert is dispatched to platform compute engineering and\
    \ batch processing SREs.\n6. When client allocations schedule and execute smoothly\
    \ without elevated container kills, nominal telemetry is logged.\n7. A structured\
    \ JSON audit manifest is emitted for compute governance compliance logs and cluster\
    \ scheduling SLA archives.\n\n## Architecture diagram\n```mermaid\ngraph TD\n\
    \    Trigger[Schedule Trigger: 15m] --> ScanMetrics[Python Script: Scrape Nomad\
    \ Server Metrics]\n    ScanMetrics --> EvalBreach{OOM Kills >= Threshold OR Placement\
    \ Fails > 3?}\n    EvalBreach -- Yes --> SlackAlert[Slack: High-Urgency Compute\
    \ Alert]\n    EvalBreach -- No --> LogNominal[Log: Nominal Nomad Cluster State]\n\
    \    SlackAlert --> EmitManifest[Debug Return: Nomad Audit Manifest]\n    LogNominal\
    \ --> EmitManifest\n```\n\n## Architecture components\n- **Trigger**: Automated\
    \ schedule polling at 15-minute intervals.\n- **Script Task**: Scrapes Nomad server\
    \ Prometheus metrics using Docker container isolation.\n- **Decision Gate**: Evaluates\
    \ whether allocation OOM-kill frequency exceeds stability safety limits.\n- **Notification\
    \ Task**: Dispatches structured Slack alerts with datacenter identity and OOM\
    \ counts.\n- **Audit Manifest**: Emits JSON execution payloads containing compute\
    \ cluster health and timestamps.\n\n## Key capabilities\n- Continuous surveillance\
    \ of HashiCorp Nomad client node resource utilization and allocation lifecycles.\n\
    - Rapid detection of application memory leaks causing Linux kernel cgroup OOM-killer\
    \ invocations.\n- Early warning before cluster memory fragmentation causes scheduler\
    \ placement deadlock.\n- Zero external dependency execution via isolated containerized\
    \ Python runners.\n\n## What you get\n- Preemptive alerting on batch compute pipeline\
    \ degradation and task restart loops before SLA breaches.\n- Automated tracking\
    \ of running task allocation counts relative to cluster compute capacity.\n- Real-time\
    \ audit manifests capturing workload execution health for SOC 2 infrastructure\
    \ compliance.\n- Configurable tolerance thresholds adaptable to high-churn batch\
    \ environments and static service jobs.\n\n## Who it's for\n- Platform compute\
    \ engineers and DevOps practitioners operating HashiCorp Nomad container clusters.\n\
    - Site Reliability Engineers (SREs) safeguarding batch analytics pipelines and\
    \ scheduled ETL workloads.\n- Distributed systems operators overseeing hybrid\
    \ bare-metal and public cloud compute infrastructure.\n- Data platform administrators\
    \ managing machine learning training tasks and microservice fleets.\n\n## Why\
    \ orchestrate this with Kestra\n- **Deterministic Scheduling**: Guarantees regular\
    \ compute health audits without fragile local crontab scripts.\n- **Containerized\
    \ Runners**: Runs Python tasks inside isolated Docker containers without host\
    \ library dependencies.\n- **Condition Branching**: Flowable `If` tasks route\
    \ alerts and nominal logging cleanly without spaghetti code.\n- **Enterprise Secret\
    \ Safety**: Securely injects Slack webhook credentials without plain-text exposure.\n\
    \n## Use cases\n- **Memory Leak in Microservice**: Detects container allocation\
    \ restart loops caused by uncapped JVM or Python heap growth.\n- **Cluster Resource\
    \ Exhaustion**: Alerts when job submissions cannot be placed due to insufficient\
    \ CPU or RAM headroom.\n- **Node Drain Timeout Stalls**: Identifies client nodes\
    \ that fail to migrate allocations during automated host maintenance.\n- **Driver\
    \ Plugin Failure**: Surfaces allocation startup failures caused by Docker daemon\
    \ or podman runtime crashes.\n\n## Inputs\n| Name | Type | Default | Description\
    \ |\n|---|---|---|---|\n| `nomad_metrics_url` | STRING | `http://nomad-server.nomad.svc.cluster.local:4646`\
    \ | Base HTTP URL exposing Nomad server Prometheus metrics. |\n| `datacenter_id`\
    \ | STRING | `dc-prod-compute-01` | Target HashiCorp Nomad datacenter identifier\
    \ under surveillance. |\n| `max_oom_kills_threshold` | INT | `5` | Maximum allowable\
    \ allocation OOM kills before alerting. |\n| `lookback_minutes` | INT | `15` |\
    \ Lookback evaluation window in minutes for failure rates. |\n| `alert_on_nomad_failures`\
    \ | BOOL | `true` | Toggle Slack alert dispatch upon detecting allocation failures.\
    \ |\n\n## Expected outputs\n- `{{ outputs.scan_nomad_cluster_metrics.vars.allocations_oom_killed_count\
    \ }}`: Cumulative count of allocations terminated by OOM-killer.\n- `{{ outputs.scan_nomad_cluster_metrics.vars.placement_failures_count\
    \ }}`: Count of job evaluations failing placement.\n- `{{ outputs.scan_nomad_cluster_metrics.vars.running_allocations_count\
    \ }}`: Number of currently active running allocations.\n- `{{ outputs.scan_nomad_cluster_metrics.vars.blocked_evaluations_count\
    \ }}`: Count of scheduler evaluations waiting on resources.\n- `{{ outputs.scan_nomad_cluster_metrics.vars.is_alerting\
    \ }}`: Boolean flag indicating whether failure thresholds were breached.\n- `{{\
    \ outputs.emit_audit_manifest.value }}`: Structured JSON audit manifest emitted\
    \ for compliance archives.\n\n## Prerequisites\n- HashiCorp Nomad cluster deployed\
    \ with `telemetry { prometheus_metrics = true }` enabled in server configuration.\n\
    - Server metrics endpoint reachable from the Kestra worker execution environment.\n\
    - Docker daemon running on the Kestra host to execute containerized Python tasks.\n\
    \n### Secrets\n- `SLACK_WEBHOOK_URL`: Incoming webhook URL for the target Compute\
    \ SRE Slack alerting channel.\n\n## Quick start\n1. Ensure Nomad configuration\
    \ includes `telemetry { publish_allocation_metrics = true }`.\n2. Configure the\
    \ `SLACK_WEBHOOK_URL` secret in your Kestra namespace settings.\n3. Specify your\
    \ Nomad datacenter name in `datacenter_id`.\n4. Execute a manual test run via\
    \ the Kestra UI to verify metric ingestion.\n5. Enable the `periodic_nomad_audit`\
    \ trigger to establish automated continuous surveillance.\n\n## Common pitfalls\
    \ and troubleshooting\n- **Telemetry ACL Tokens**: If Nomad ACLs are enabled,\
    \ ensure scraper requests provide a valid Management or Read token.\n- **Memory\
    \ Limits vs Reservations**: Nomad enforces `resources.memory` as hard cgroup limits;\
    \ ensure adequate headroom.\n- **OOM Kill Counter Resets**: Nomad client restarts\
    \ reset local allocation counters; evaluate rate of change over time.\n- **Blocked\
    \ Eval Accumulation**: Persistent blocked evaluations indicate physical cluster\
    \ capacity exhaustion.\n\n## How to extend\n- **Automated Node Auto-Scaling**:\
    \ Trigger a cloud provider node pool expansion when blocked evaluations exceed\
    \ 20.\n- **Job Memory Auto-Tuning**: Chain an automated Nomad job specification\
    \ patch task to increase container memory limits.\n- **PagerDuty Escalation**:\
    \ Escalate to on-call platform engineers if placement failures exceed 15 within\
    \ 10 minutes.\n\n## Links\n- [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)\n\
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)\n\
    - [HashiCorp Nomad Official Documentation and Architecture Guide](https://developer.hashicorp.com/nomad/docs)\n\
    - [HashiCorp Nomad Telemetry and Prometheus Metrics Configuration](https://developer.hashicorp.com/nomad/docs/configuration/telemetry)\n\
    - [HashiCorp Nomad Node Drain and Preemption Operations](https://developer.hashicorp.com/nomad/tutorials/manage-clusters/node-drain)\n"
  tags:
  - Cloud
  - Infrastructure
  subTags:
  - Monitoring & Alerting
  - Infrastructure Automation
  ee: false
  demo: false
outputs:
- id: allocations_oom_killed_count
  type: INT
  value: '{{ outputs.scan_nomad_cluster_metrics.vars.allocations_oom_killed_count
    }}'
- id: placement_failures_count
  type: INT
  value: '{{ outputs.scan_nomad_cluster_metrics.vars.placement_failures_count }}'
- id: running_allocations_count
  type: INT
  value: '{{ outputs.scan_nomad_cluster_metrics.vars.running_allocations_count }}'
- id: blocked_evaluations_count
  type: INT
  value: '{{ outputs.scan_nomad_cluster_metrics.vars.blocked_evaluations_count }}'
- id: is_alerting
  type: BOOLEAN
  value: '{{ outputs.scan_nomad_cluster_metrics.vars.is_alerting }}'
