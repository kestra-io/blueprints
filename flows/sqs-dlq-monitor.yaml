id: sqs-dlq-monitor
namespace: company.finops

description: |
  Scans SQS queues to find dead-letter queues with a growing backlog of visible
  messages and alerts on Slack. A DLQ filling up means failures are being
  swallowed silently — this flow makes them loud.

inputs:
  - id: aws_regions
    type: ARRAY
    itemType: STRING
    defaults: ["us-east-1"]
    description: AWS regions to scan for DLQ backlogs.
  - id: backlog_threshold
    type: INT
    defaults: 100
    description: DLQs with more visible messages than this trigger an alert (default 100).

tasks:
  - id: check_queues
    type: io.kestra.plugin.core.flow.ForEach
    description: Scan SQS queues region by region.
    values: "{{ inputs.aws_regions }}"
    tasks:
      - id: audit_region
        type: io.kestra.plugin.aws.cli.AwsCLI
        description: Identify DLQs and check their visible message backlog.
        commands:
          - |
            REGION="{{ taskrun.value }}"
            THRESHOLD={{ inputs.backlog_threshold }}
            echo "Scanning SQS queues in $REGION (backlog threshold: $THRESHOLD)"
            aws sqs list-queues --region "$REGION" \
              --query 'QueueUrls' --output text | tr '\t' '\n' | grep -v '^$' > /tmp/queues.txt || true
            # collect every dead-letter target ARN referenced by redrive policies
            > /tmp/dlq_arns.txt
            for Q in $(cat /tmp/queues.txt); do
              RP=$(aws sqs get-queue-attributes --region "$REGION" --queue-url "$Q" \
                --attribute-names RedrivePolicy --query 'Attributes.RedrivePolicy' --output text 2>/dev/null)
              if [ -n "$RP" ] && [ "$RP" != "None" ]; then
                echo "$RP" | python3 -c "import json,sys; print(json.load(sys.stdin).get('deadLetterTargetArn',''))" >> /tmp/dlq_arns.txt 2>/dev/null || true
              fi
            done
            sort -u /tmp/dlq_arns.txt | grep -v '^$' > /tmp/dlqs.txt || true
            BACKLOG_COUNT=0
            BACKLOG_LIST=""
            while read -r DLQ_ARN; do
              [ -z "$DLQ_ARN" ] && continue
              QNAME=$(basename "$DLQ_ARN")
              QURL=$(aws sqs get-queue-url --region "$REGION" --queue-name "$QNAME" --query 'QueueUrl' --output text 2>/dev/null)
              [ -z "$QURL" ] || [ "$QURL" = "None" ] && continue
              VIS=$(aws sqs get-queue-attributes --region "$REGION" --queue-url "$QURL" \
                --attribute-names ApproximateNumberOfMessagesVisible \
                --query 'Attributes.ApproximateNumberOfMessagesVisible' --output text 2>/dev/null)
              case "$VIS" in ''|'None') VIS=0;; esac
              echo "DLQ $QNAME: ${VIS} visible messages"
              if [ "$VIS" -gt "$THRESHOLD" ]; then
                BACKLOG_LIST="${BACKLOG_LIST}${QNAME} (${VIS} visible), "
                BACKLOG_COUNT=$((BACKLOG_COUNT + 1))
              fi
            done < /tmp/dlqs.txt
            if [ "$BACKLOG_COUNT" -gt 0 ]; then HAS_BACKLOG=true; else HAS_BACKLOG=false; fi
            echo "HAS_BACKLOG=$HAS_BACKLOG"
            echo "BACKLOG_COUNT=$BACKLOG_COUNT"
            echo "BACKLOG_DLQS=$BACKLOG_LIST"
            echo "REGION_DONE=$REGION"
        env:
          AWS_ACCESS_KEY_ID: "{{ secret('AWS_ACCESS_KEY_ID') }}"
          AWS_SECRET_ACCESS_KEY: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
          AWS_DEFAULT_REGION: "{{ taskrun.value }}"
      - id: notify_region
        type: io.kestra.plugin.core.flow.If
        description: Alert on DLQ backlogs, stay quiet when dead letters are being handled.
        condition: "{{ outputs.audit_region.vars.HAS_BACKLOG == 'true' }}"
        then:
          - id: slack_backlog
            type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
            url: "{{ secret('SLACK_WEBHOOK_URL') }}"
            payload: |
              {
                "text": ":rotating_light: SQS DLQ monitor `{{ outputs.audit_region.vars.REGION_DONE }}` — *{{ outputs.audit_region.vars.BACKLOG_COUNT }}* dead-letter queue(s) over the backlog threshold ({{ inputs.backlog_threshold }} visible messages).\n`{{ outputs.audit_region.vars.BACKLOG_DLQS }}`\nFailures are piling up unprocessed — investigate the source queue's consumers."
              }
        else:
          - id: log_clean
            type: io.kestra.plugin.core.log.Log
            message: "SQS DLQs look healthy in {{ outputs.audit_region.vars.REGION_DONE }} — no dead-letter queue over the backlog threshold."

triggers:
  - id: weekly
    type: io.kestra.plugin.core.trigger.Schedule
    description: Weekly on Sunday at 04:30 UTC. Shipped disabled; enable after your first manual run.
    cron: "30 4 * * 0"
    disabled: true

extend:
  title: SQS DLQ Monitor
  metaTitle: Monitor SQS Dead-Letter Queue Backlogs | Kestra
  shortDescription: Scan SQS queues to find dead-letter queues with a growing backlog of visible messages and get a Slack alert before failures pile up silently.
  metaDescription: DLQs filling up means swallowed failures. This flow scans SQS weekly and alerts on backlogged dead-letter queues.
  description: |
    Dead-letter queues exist so failed messages don't vanish — but a DLQ nobody watches is just a slower way to lose them. When the DLQ backlog grows, it means consumers are failing and nobody is replaying or triaging. This blueprint makes DLQ backlogs loud.

    ## How it works

    1. A Schedule trigger fires weekly on Sunday at 04:30 UTC (shipped disabled).
    2. A ForEach loop scans each region in `aws_regions`.
    3. Per region, the flow lists SQS queues and reads every `RedrivePolicy` to discover which queues are dead-letter targets.
    4. Each DLQ's `ApproximateNumberOfMessagesVisible` is checked against `backlog_threshold` (default 100).
    5. An `If` task posts a Slack alert naming the backlogged DLQs and their visible counts.

    ## What you get

    - A weekly report of dead-letter queues over the backlog threshold, with message counts.
    - Automatic DLQ discovery via redrive policies — no hardcoded queue names.
    - Multi-region coverage in one run.
    - Silence when dead letters are being handled.

    ## Who it's for

    Backend teams running SQS-based architectures who want to know about consumer failures before the DLQ becomes an archive.

    ## Why orchestrate this with Kestra

    DLQ depth is a metric that matters on a schedule, not in a dashboard nobody opens. As a Kestra flow the scan runs weekly across regions, the threshold is an input, every run is logged, and the alert lands in Slack where on-call actually sees it.

    ## Prerequisites

    - AWS credentials with `sqs:ListQueues`, `sqs:GetQueueUrl`, and `sqs:GetQueueAttributes` permissions.
    - A Slack incoming webhook URL.

    ### Secrets

    - `AWS_ACCESS_KEY_ID`: AWS access key for the SQS API calls.
    - `AWS_SECRET_ACCESS_KEY`: AWS secret key for the SQS API calls.
    - `SLACK_WEBHOOK_URL`: Incoming webhook URL for the DLQ backlog alert.

    ## Quick start

    1. Add the three secrets above to your Kestra namespace.
    2. Set `aws_regions` and tune `backlog_threshold` to your traffic.
    3. Run manually once and review the DLQ inventory.
    4. Enable the weekly schedule trigger.

    ## How to extend

    - Track backlog deltas between runs (store last count in Kestra KV) to alert on *growth rate*, not just depth.
    - Add a redrive step that moves DLQ messages back to the source queue after approval.
    - Alert on DLQs with *zero* messages for 30 days too — they may be misconfigured and never receiving.

    ## Links

    - [Kestra AWS plugins](https://kestra.io/plugins)
    - [Kestra Slack plugins](https://kestra.io/plugins)
    - [SQS dead-letter queues](https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-dead-letter-queues.html)
    - [SQS GetQueueAttributes API](https://docs.aws.amazon.com/cli/latest/reference/sqs/get-queue-attributes.html)
  tags:
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - Day 2 Operations
  ee: false
  demo: false
