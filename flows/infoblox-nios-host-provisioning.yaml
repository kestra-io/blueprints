id: infoblox-nios-host-provisioning
namespace: company.team
description: |
  Provision a DNS host record in Infoblox NIOS from a ServiceNow ticket. The flow reserves the next free
  IP in a network, checks from a worker with network reach that nobody answers on it, creates or updates
  the host record with the ticket number as an extensible attribute, and writes the result back to the ticket.
  When the host record already exists, its IPv4 addresses (and their DHCP bindings) are replaced by the newly
  allocated address: the flow moves the host to a new IP.

inputs:
  - id: fqdn
    type: STRING
    description: Fully qualified name of the host record to create or update.
    defaults: app01.example.com
    validator: ^[A-Za-z0-9]([A-Za-z0-9.-]*[A-Za-z0-9])?$
  - id: network
    type: STRING
    description: Network to allocate the address from, in CIDR notation.
    defaults: 10.20.0.0/24
    validator: ^\d{1,3}(\.\d{1,3}){3}/\d{1,2}$
  - id: mac
    type: STRING
    description: MAC address of the machine, used to configure DHCP on the host record.
    defaults: "aa:bb:cc:dd:ee:ff"
    validator: ^([0-9A-Fa-f]{2}[:-]){5}[0-9A-Fa-f]{2}$
  - id: ticket_number
    type: STRING
    description: Number of the ServiceNow ticket that requested the host.
    defaults: INC0012345
    validator: ^[A-Za-z0-9]+$
  - id: ticket_table
    type: STRING
    description: ServiceNow table holding the ticket.
    defaults: incident

triggers:
  - id: provisioning_request
    type: io.kestra.plugin.core.trigger.Webhook
    description: Start the flow from a ServiceNow business rule or any HTTP client.
    key: "{{ secret('INFOBLOX_WEBHOOK_KEY') }}"
    inputs:
      fqdn: "{{ trigger.body.fqdn }}"
      network: "{{ trigger.body.network }}"
      mac: "{{ trigger.body.mac }}"
      ticket_number: "{{ trigger.body.ticket_number }}"

tasks:
  - id: find_ticket
    type: io.kestra.plugin.servicenow.Get
    description: Resolve the ticket number to its sys_id.
    domain: "{{ secret('SN_DOMAIN') }}"
    username: "{{ secret('SN_USERNAME') }}"
    password: "{{ secret('SN_PASSWORD') }}"
    table: "{{ inputs.ticket_table }}"
    query: "number={{ inputs.ticket_number }}"
    fields:
      - sys_id
      - number
    fetchType: FETCH_ONE

  - id: fail_unknown_ticket
    type: io.kestra.plugin.core.execution.Fail
    description: Stop before any Infoblox change when the ticket number matches nothing.
    condition: "{{ outputs.find_ticket.size == 0 }}"
    errorMessage: "No ticket {{ inputs.ticket_number }} found in the ServiceNow table {{ inputs.ticket_table }}. Nothing was provisioned."

  - id: check_existing
    type: io.kestra.plugin.ee.infoblox.ipam.dns.hostrecord.List
    description: Look for an existing host record by name. An empty result is the normal answer for a new host and does not fail the flow, while a real lookup error does.
    url: "{{ secret('INFOBLOX_URL') }}"
    username: "{{ secret('INFOBLOX_USERNAME') }}"
    password: "{{ secret('INFOBLOX_PASSWORD') }}"
    filters:
      name: "{{ inputs.fqdn }}"
    fetchType: FETCH_ONE

  - id: allocate_ip
    type: io.kestra.plugin.ee.infoblox.ipam.address.AllocateNextAvailable
    description: Reserve the next free address of the network.
    url: "{{ secret('INFOBLOX_URL') }}"
    username: "{{ secret('INFOBLOX_USERNAME') }}"
    password: "{{ secret('INFOBLOX_PASSWORD') }}"
    networkRef: "{{ inputs.network }}"

  - id: ping_candidate
    type: io.kestra.plugin.scripts.shell.Script
    description: |
      Reachability check, run on workers that can reach the network. The plugin itself does not probe
      addresses. An address that answers is already in use, even though Infoblox considers it free.
    workerSelector:
      tags:
        - network-reach
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    env:
      CANDIDATE_IP: "{{ outputs.allocate_ip.ip }}"
    script: |
      if ping -c 3 -W 2 "$CANDIDATE_IP" > /dev/null 2>&1; then
        echo '::{"outputs":{"reachable":true}}::'
      else
        echo '::{"outputs":{"reachable":false}}::'
      fi

  - id: check_address_is_free
    type: io.kestra.plugin.core.flow.If
    description: Give the address back and stop when something already answers on it.
    condition: "{{ outputs.ping_candidate.vars.reachable }}"
    then:
      - id: release_in_use_address
        type: io.kestra.plugin.ee.infoblox.ipam.address.Release
        url: "{{ secret('INFOBLOX_URL') }}"
        username: "{{ secret('INFOBLOX_USERNAME') }}"
        password: "{{ secret('INFOBLOX_PASSWORD') }}"
        ref: "{{ outputs.allocate_ip.ref }}"

      - id: fail_address_in_use
        type: io.kestra.plugin.core.execution.Fail
        errorMessage: "{{ outputs.allocate_ip.ip }} answers to ping, it is already in use. The reservation was released, run the flow again to get another address."

  - id: release_reservation
    type: io.kestra.plugin.ee.infoblox.ipam.address.Release
    description: A host record cannot take an address that is held by a reserved fixed address, so release the placeholder just before creating the record.
    url: "{{ secret('INFOBLOX_URL') }}"
    username: "{{ secret('INFOBLOX_USERNAME') }}"
    password: "{{ secret('INFOBLOX_PASSWORD') }}"
    ref: "{{ outputs.allocate_ip.ref }}"

  - id: upsert_host_record
    type: io.kestra.plugin.core.flow.If
    description: Update the host record when it exists, create it otherwise.
    condition: "{{ outputs.check_existing.size > 0 }}"
    then:
      - id: warn_address_replacement
        type: io.kestra.plugin.core.log.Log
        level: WARN
        message: "Host record {{ inputs.fqdn }} already exists: its current IPv4 addresses and their DHCP bindings are replaced by {{ outputs.allocate_ip.ip }}."

      - id: update_host_record
        type: io.kestra.plugin.ee.infoblox.ipam.dns.hostrecord.Update
        url: "{{ secret('INFOBLOX_URL') }}"
        username: "{{ secret('INFOBLOX_USERNAME') }}"
        password: "{{ secret('INFOBLOX_PASSWORD') }}"
        ref: "{{ outputs.check_existing.row._ref }}"
        ipv4Addrs:
          - ipv4addr: "{{ outputs.allocate_ip.ip }}"
            mac: "{{ inputs.mac }}"
            configure_for_dhcp: true
        extensibleAttributes:
          Ticket: "{{ inputs.ticket_number }}"
    else:
      - id: create_host_record
        type: io.kestra.plugin.ee.infoblox.ipam.dns.hostrecord.Create
        url: "{{ secret('INFOBLOX_URL') }}"
        username: "{{ secret('INFOBLOX_USERNAME') }}"
        password: "{{ secret('INFOBLOX_PASSWORD') }}"
        name: "{{ inputs.fqdn }}"
        ipv4Addrs:
          - ipv4addr: "{{ outputs.allocate_ip.ip }}"
            mac: "{{ inputs.mac }}"
            configure_for_dhcp: true
        extensibleAttributes:
          Ticket: "{{ inputs.ticket_number }}"

  - id: update_ticket
    type: io.kestra.plugin.servicenow.Update
    description: Report the result on the ticket.
    domain: "{{ secret('SN_DOMAIN') }}"
    username: "{{ secret('SN_USERNAME') }}"
    password: "{{ secret('SN_PASSWORD') }}"
    table: "{{ inputs.ticket_table }}"
    sysId: "{{ outputs.find_ticket.results[0].sys_id }}"
    data:
      work_notes: "Host {{ inputs.fqdn }} provisioned in Infoblox with address {{ outputs.allocate_ip.ip }} by Kestra execution {{ execution.id }}."

extend:
  shortDescription: Reserve an IP in Infoblox NIOS, verify it is free from the target network, create the DNS host record and report back on the ServiceNow ticket.
  title: Provision a DNS Host Record in Infoblox NIOS from a ServiceNow Ticket
  metaTitle: Infoblox NIOS Host Provisioning from ServiceNow with Kestra
  metaDescription: "Automate Infoblox NIOS host provisioning: allocate the next free IP, ping-check it, create the host record with a ticket attribute and update ServiceNow."
  description: |
    Turn a ServiceNow request into a ready-to-use DNS host record. The flow reserves the next free address of a network in Infoblox NIOS, checks from a worker that can reach that network that nothing already answers on it, creates (or updates) the host record with the ticket number stored as an extensible attribute, and writes the outcome back to the ticket. IP allocation, DNS registration and ticket bookkeeping happen in one auditable run instead of three manual steps in three tools.

    ## How it works

    1. The `io.kestra.plugin.core.trigger.Webhook` trigger (`provisioning_request`) accepts `fqdn`, `network`, `mac` and `ticket_number` in the request body. The same four values are flow inputs for manual runs.
    2. `find_ticket` (`io.kestra.plugin.servicenow.Get`) resolves the ticket number to its `sys_id`, and `fail_unknown_ticket` stops the run before any Infoblox change if no ticket matches.
    3. `check_existing` (`io.kestra.plugin.ee.infoblox.ipam.dns.hostrecord.List` with `fetchType: FETCH_ONE`) looks the host record up by name. An empty result is the normal answer for a new host and the run still ends in SUCCESS, while a real lookup error fails it.
    4. `allocate_ip` (`io.kestra.plugin.ee.infoblox.ipam.address.AllocateNextAvailable`) reserves the next free address of `network` and outputs its `ip` and the `ref` of the reservation.
    5. `ping_candidate` runs `ping` on workers selected by the `network-reach` tag (`workerSelector`). The plugin does not probe addresses itself, because a Java reachability check needs raw-socket privileges and would probe from the wrong network. If the address answers, `check_address_is_free` releases the reservation with `ipam.address.Release` and fails the run.
    6. `release_reservation` releases the placeholder reservation, because a host record cannot take an address that a reserved fixed address still holds. There is a short window between this step and the record creation where another client could take the address.
    7. `upsert_host_record` creates the host record (`ipam.dns.hostrecord.Create`) or, when it already exists, updates it in place (`ipam.dns.hostrecord.Update`, with the `ref` returned by `check_existing`). Both set the `Ticket` extensible attribute to the ticket number. Be aware that `Update` replaces the whole IPv4 address list: for an existing host the old addresses and their DHCP bindings are replaced by the newly allocated one, which moves the host to a new IP. The flow logs a warning when it does this.
    8. `update_ticket` (`io.kestra.plugin.servicenow.Update`) adds a work note with the host name, the address and the execution id.

    ## What you get

    - A host record with the allocated address, the MAC address configured for DHCP and the ticket number as an extensible attribute.
    - Fewer duplicate addresses: a candidate that answers to ping from the target network is released and the run fails before the record is created. A firewalled host that ignores ping is not detected.
    - The ServiceNow ticket updated with what was provisioned.

    ## Who it's for

    - Network teams that serve host requests from ServiceNow tickets.
    - Platform teams that want self-service DNS and IP allocation without giving out Infoblox access.

    ## Why orchestrate this with Kestra

    Infoblox allocates addresses and ServiceNow tracks requests, but neither checks the network or ties the two together. Kestra adds the checks that run on your own workers (here, the ping), the branching between create and update, and the end-to-end trace from ticket to record.

    ## Prerequisites

    - An Infoblox NIOS Grid Manager with WAPI access (Enterprise Edition of Kestra, as this plugin is EE only), and workers tagged `network-reach` that can reach the target network and have `ping` installed. Change the tag in the `workerSelector` of `ping_candidate` if yours differs.
    - An extensible attribute named `Ticket` defined in the Grid. WAPI rejects attributes that do not exist.
    - A ServiceNow instance with API access to the ticket table (`incident` by default).

    ### Secrets

    - `INFOBLOX_URL`: Grid Manager base URL, for example `https://infoblox.example.com`.
    - `INFOBLOX_USERNAME` and `INFOBLOX_PASSWORD`: WAPI credentials.
    - `SN_DOMAIN`, `SN_USERNAME` and `SN_PASSWORD`: ServiceNow instance domain and API credentials.
    - `INFOBLOX_WEBHOOK_KEY`: key guarding the webhook trigger.

    ## Quick start

    1. Add the secrets above to your Kestra namespace and create the `Ticket` extensible attribute in the Grid.
    2. Upload the flow and run it manually with your own `fqdn`, `network`, `mac` and `ticket_number`.
    3. Optionally call the webhook from a ServiceNow business rule with a JSON body holding the same four fields.

    ## How to extend

    - Replace `ticket_table` with `change_request` or a catalog request table.
    - Add an `errors` block that releases the reservation when a step after the allocation fails, so no address stays reserved.
    - Add a DNS view with `dnsView` on the host record tasks if your Grid uses several views.

    ## Links

    - [Infoblox plugin docs](https://kestra.io/plugins/plugin-ee-infoblox)
    - [ServiceNow plugin docs](https://kestra.io/plugins/plugin-servicenow)
  tags:
    - Infrastructure
    - Business
  subTags:
    - Infrastructure Automation
    - ServiceNow & ITSM
  ee: true
  demo: false
