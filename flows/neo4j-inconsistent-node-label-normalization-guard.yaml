id: neo4j-inconsistent-node-label-normalization-guard
namespace: company.team
description: Restore explicitly declared Neo4j label case variants while preserving node data and edges.
concurrency:
  limit: 1
  behavior: QUEUE
inputs:
  - id: neo4j_url
    type: STRING
    defaults: bolt://localhost:7687
  - id: neo4j_username
    type: STRING
    defaults: "{{ secret('NEO4J_USERNAME') }}"
  - id: neo4j_password
    type: SECRET
    defaults: "{{ secret('NEO4J_PASSWORD') }}"
  - id: canonical_label
    type: STRING
    defaults: Customer
  - id: variant_label
    type: STRING
    defaults: customer
  - id: identity_property
    type: STRING
    defaults: customer_id
    description: Nonempty string property on each selected node, preserved while acquiring its write lock.
  - id: max_nodes
    type: INT
    defaults: 20
    min: 1
    max: 100
  - id: dry_run
    type: BOOL
    defaults: true
  - id: auto_remediate
    type: BOOL
    defaults: false
  - id: slack_webhook_url
    type: SECRET
    defaults: "{{ secret('SLACK_WEBHOOK_URL') }}"
tasks:
  - id: validate_mapping
    type: io.kestra.plugin.core.execution.Assert
    conditions:
      - "{{ inputs.canonical_label | length > 0 and inputs.canonical_label | length <= 64 and inputs.canonical_label | replace({'[A-Za-z0-9_]': ''}, regexp=true) | length == 0 }}"
      - "{{ inputs.variant_label | length > 0 and inputs.variant_label | length <= 64 and inputs.variant_label | replace({'[A-Za-z0-9_]': ''}, regexp=true) | length == 0 }}"
      - "{{ inputs.identity_property | length > 0 and inputs.identity_property | length <= 64 and inputs.identity_property | replace({'[A-Za-z0-9_]': ''}, regexp=true) | length == 0 }}"
      - "{{ inputs.canonical_label != inputs.variant_label and inputs.canonical_label | lower == inputs.variant_label | lower }}"
    errorMessage: Declare one distinct case-only label mapping and ASCII identifier property. No automatic label inference.
  - id: timeout_settings
    type: io.kestra.plugin.neo4j.Query
    timeout: PT40S
    url: "{{ inputs.neo4j_url }}"
    username: "{{ inputs.neo4j_username }}"
    password: "{{ inputs.neo4j_password }}"
    storeType: FETCHONE
    query: |
      SHOW SETTINGS YIELD name,value
      WHERE name IN ['db.lock.acquisition.timeout','db.transaction.timeout']
      RETURN count(*) AS settings_count,
        sum(CASE WHEN name='db.lock.acquisition.timeout' AND value IN [i IN range(1,10) | toString(i)+'s'] THEN 1
          WHEN name='db.transaction.timeout' AND value IN [i IN range(1,30) | toString(i)+'s'] THEN 1 ELSE 0 END) AS bounded_settings
  - id: require_timeouts
    type: io.kestra.plugin.core.execution.Assert
    conditions:
      - "{{ outputs.timeout_settings.row.settings_count == 2 and outputs.timeout_settings.row.bounded_settings == 2 }}"
    errorMessage: Require effective lock timeout 1s to 10s and transaction timeout 1s to 30s. Missing, zero or other formats are refused.
  - id: audit
    type: io.kestra.plugin.neo4j.Query
    timeout: PT40S
    url: "{{ inputs.neo4j_url }}"
    username: "{{ inputs.neo4j_username }}"
    password: "{{ inputs.neo4j_password }}"
    storeType: FETCH
    query: |
      MATCH(n:`{{ inputs.variant_label }}`)
      RETURN elementId(n) AS node_id, labels(n) AS observed_labels,
        n.`{{ inputs.identity_property }}` AS identity,
        n.`{{ inputs.identity_property }}` IS :: STRING AND size(n.`{{ inputs.identity_property }}`) > 0
          AND size(n.`{{ inputs.identity_property }}`) <= 128 AS eligible
      ORDER BY elementId(n) LIMIT 101
  - id: bounded_plan
    type: io.kestra.plugin.core.execution.Assert
    conditions:
      - "{{ outputs.audit.size <= inputs.max_nodes }}"
      - "{{ (outputs.audit.rows | toJson | jq('[.[] | select(.eligible != true)] | length') | first) == 0 }}"
    errorMessage: Variant set exceeds the cap or contains a node without a bounded string identity. Narrow scope or correct the data first.
  - id: report
    type: io.kestra.plugin.core.log.Log
    message: "Declared label mapping {{ inputs.variant_label }} to {{ inputs.canonical_label }}. Exact node plan: {{ outputs.audit.rows | toJson }}. No nodes are merged or deleted."
  - id: findings
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.audit.size > 0 }}"
    then:
      - id: notify_findings
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ inputs.slack_webhook_url }}"
        payload: "{{ {'text': 'Neo4j case-variant nodes found. Review declared mapping and node plan in execution ' ~ execution.id} | toJson }}"
      - id: live_mode
        type: io.kestra.plugin.core.flow.If
        condition: "{{ inputs.auto_remediate and not inputs.dry_run }}"
        then:
          - id: approval
            type: io.kestra.plugin.core.flow.Pause
            pauseDuration: PT1H
            behavior: FAIL
            description: Confirm both labels mean the same entity. Canonical-label constraints can reject a node. Approved nodes are relabelled individually, without merging data.
            onResume:
              - id: approved
                type: BOOL
                required: false
          - id: approved_only
            type: io.kestra.plugin.core.flow.If
            condition: "{{ outputs.approval.onResume.approved ?? false }}"
            then:
              - id: recheck_timeouts
                type: io.kestra.plugin.neo4j.Query
                timeout: PT40S
                url: "{{ inputs.neo4j_url }}"
                username: "{{ inputs.neo4j_username }}"
                password: "{{ inputs.neo4j_password }}"
                storeType: FETCHONE
                query: |
                  SHOW SETTINGS YIELD name,value
                  WHERE name IN ['db.lock.acquisition.timeout','db.transaction.timeout']
                  RETURN count(*) AS settings_count,
                    sum(CASE WHEN name='db.lock.acquisition.timeout' AND value IN [i IN range(1,10) | toString(i)+'s'] THEN 1
                      WHEN name='db.transaction.timeout' AND value IN [i IN range(1,30) | toString(i)+'s'] THEN 1 ELSE 0 END) AS bounded_settings
              - id: require_current_timeouts
                type: io.kestra.plugin.core.execution.Assert
                conditions:
                  - "{{ outputs.recheck_timeouts.row.settings_count == 2 and outputs.recheck_timeouts.row.bounded_settings == 2 }}"
                errorMessage: Effective timeout ceilings changed during approval. Refusing repair.
              - id: current_plan
                type: io.kestra.plugin.neo4j.Query
                timeout: PT40S
                url: "{{ inputs.neo4j_url }}"
                username: "{{ inputs.neo4j_username }}"
                password: "{{ inputs.neo4j_password }}"
                storeType: FETCH
                query: |
                  MATCH(n:`{{ inputs.variant_label }}`)
                  RETURN elementId(n) AS node_id, labels(n) AS observed_labels,
                    n.`{{ inputs.identity_property }}` AS identity,
                    n.`{{ inputs.identity_property }}` IS :: STRING AND size(n.`{{ inputs.identity_property }}`) > 0
                      AND size(n.`{{ inputs.identity_property }}`) <= 128 AS eligible
                  ORDER BY elementId(n) LIMIT 101
              - id: require_same_plan
                type: io.kestra.plugin.core.execution.Assert
                conditions:
                  - "{{ outputs.current_plan.size <= inputs.max_nodes }}"
                  - "{{ (outputs.current_plan.rows | toJson | jq('map(.observed_labels |= sort) | sort_by(.node_id)') | first | toJson) == (outputs.audit.rows | toJson | jq('map(.observed_labels |= sort) | sort_by(.node_id)') | first | toJson) }}"
                errorMessage: Variant set or cap changed during approval. Re-audit before any repair.
              - id: remediate_nodes
                type: io.kestra.plugin.core.flow.Loop
                concurrencyLimit: 1
                values: "{{ outputs.audit.rows | toJson }}"
                tasks:
                  - id: relabel_one
                    type: io.kestra.plugin.neo4j.Query
                    timeout: PT40S
                    url: "{{ inputs.neo4j_url }}"
                    username: "{{ inputs.neo4j_username }}"
                    password: "{{ inputs.neo4j_password }}"
                    storeType: FETCHONE
                    query: |
                      WITH {{ fromJson(item.value).node_id | toJson }} AS node_id,
                        {{ fromJson(item.value).identity | toJson }} AS identity,
                        {{ fromJson(item.value).observed_labels | toJson }} AS observed_labels
                      MATCH(n) WHERE elementId(n)=node_id
                      SET n.`{{ inputs.identity_property }}` = coalesce(n.`{{ inputs.identity_property }}`,null)
                      WITH n,identity,observed_labels WHERE n.`{{ inputs.identity_property }}`=identity
                        AND size(labels(n))=size(observed_labels) AND all(l IN labels(n) WHERE l IN observed_labels)
                      SET n:`{{ inputs.canonical_label }}` REMOVE n:`{{ inputs.variant_label }}`
                      RETURN count(n) AS repaired
                  - id: require_relabelled
                    type: io.kestra.plugin.core.execution.Assert
                    conditions:
                      - "{{ outputs.relabel_one.row.repaired == 1 }}"
                    errorMessage: Approved node was deleted or its identity or labels changed. Replan before further repair.
              - id: verify
                type: io.kestra.plugin.neo4j.Query
                timeout: PT40S
                url: "{{ inputs.neo4j_url }}"
                username: "{{ inputs.neo4j_username }}"
                password: "{{ inputs.neo4j_password }}"
                storeType: FETCHONE
                query: |
                  WITH {{ outputs.audit.rows | toJson | jq('[.[] | [.node_id,.identity,.observed_labels]]') | first | toJson }} AS plan
                  UNWIND plan AS p OPTIONAL MATCH(n:`{{ inputs.canonical_label }}`) WHERE elementId(n)=p[0]
                  WITH n,p,[l IN p[2] WHERE l <> '{{ inputs.variant_label }}' AND l <> '{{ inputs.canonical_label }}'] + ['{{ inputs.canonical_label }}'] AS expected_labels
                  WITH sum(CASE WHEN n IS NOT NULL AND n.`{{ inputs.identity_property }}`=p[1]
                    AND size(labels(n))=size(expected_labels) AND all(l IN labels(n) WHERE l IN expected_labels) THEN 0 ELSE 1 END) AS unrecovered
                  OPTIONAL MATCH(v:`{{ inputs.variant_label }}`)
                  RETURN unrecovered,count(v) AS remaining_variants
              - id: require_recovered
                type: io.kestra.plugin.core.execution.Assert
                conditions:
                  - "{{ outputs.verify.row.unrecovered == 0 }}"
                  - "{{ outputs.verify.row.remaining_variants == 0 }}"
                errorMessage: An approved node is missing or its canonical label recovery did not persist.
            else:
              - id: declined
                type: io.kestra.plugin.core.log.Log
                message: Mapping approval declined. The graph was not changed.
errors:
  - id: notify_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ inputs.slack_webhook_url }}"
    payload: "{{ {'text': 'Neo4j label recovery failed in execution ' ~ execution.id ~ '. Re-audit actual labels before retrying; completed nodes stay repaired.'} | toJson }}"
triggers:
  - id: daily_check
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 5 * * *"
    disabled: true
    inputs:
      dry_run: true
      auto_remediate: false
extend:
  title: Restore Neo4j label case variants without merging nodes
  metaTitle: Restore declared Neo4j label case variants | Kestra
  shortDescription: Recover nodes hidden from canonical-label queries with explicit mapping, bounded approval and native node locks.
  metaDescription: Restore declared Neo4j label case variants with bounded approval and node locks. Preserve properties and edges then verify canonical visibility.
  tags: [Data]
  subTags: [Testing & Quality, Day 2 Operations]
  ee: false
  demo: false
  description: |
    ## How it works
    1. `validate_mapping` accepts one declared ASCII case-only mapping. `timeout_settings` reads effective server ceilings and refuses missing or disabled values.
    2. `audit` reads at most 101 variant nodes. `bounded_plan` requires at most max_nodes and nonempty string identities up to 128 characters. Safe mode reports the plan without graph writes.
    3. Live mode needs both input gates and typed approval. `current_plan` compares the full bounded set after approval and refuses changed plans.
    4. Sequential `relabel_one` transactions use `coalesce(identity,null)` to lock before reading identity, check identity and exact labels then add the canonical label and remove only the variant. Concurrent values and absent properties are preserved.
    5. `verify` matches approved IDs under the canonical label, checks exact expected labels and counts remaining variants. A missing node, changed identity or residual variant fails recovery.

    ## What you get
    Wrong-case nodes become visible to canonical-label queries. No nodes are merged and no edge writes are issued. Canonical constraints can reject conflicts. Native checks compare node properties plus edge IDs, endpoints, types and properties.

    ## Who it's for
    Graph operators correcting customer instead of Customer. Similar spelling does not establish equal business meaning; the operator declares the mapping.

    ## Why orchestrate this with Kestra
    Keep the plan, approval and failed rechecks together. Every graph operation uses Query. The queue serializes this flow; native node locks protect each repair.

    ## Tested end to end
    70 final-runtime cases passed: 48 on Kestra 2.0.6, 12 on 2.0.5 and 10 on a second Neo4j 5.26.32 Community fixture. Plugins were 1.6.0 and 1.4.9. The repair changed canonical visibility from 1 to 3 and variants from 2 to 0 while conserving four nodes and two property-bearing edges. A distinct fresh reproduction conserved three edges. Actual flow lock probes preserved changed string, numeric and removed identities plus concurrent payload updates. Coverage includes quotes, backslashes, Unicode, controls, empty and oversized sets, stale approval, changed ceilings, partial recovery and queued executions. Full parent and Loop-child executions, all logs and namespace KV values were scanned for plaintext SECRET inputs.

    | Case | Execution | Result |
    | --- | --- | --- |
    | Dry run | 4LS9pIULpe8JVtUWV1f6uH | SUCCESS, unchanged |
    | Repair | 5VTRD0sgDTRaD0vukcHpbv | SUCCESS |
    | Constraint refusal | 6923WWqTEpoZvQs8k4xM2I | FAILED |
    | Expanded approval set | 6QvEil016R6cdN2K8nkydF | FAILED, no repair |
    | Older repair | 7LNvZO3mqGhipQwCEpA8LO | SUCCESS |
    | Fresh independent repair | 7bavgjcWwpCswsNRdxLPeE | SUCCESS |

    ## Prerequisites
    Neo4j 5.26 reachable over Bolt. Require effective `db.lock.acquisition.timeout` of 1s to 10s and `db.transaction.timeout` of 1s to 30s, in whole seconds. Other formats are refused. Lock timeout needs startup configuration. The account needs SHOW SETTINGS, node/property reads and writes to the identity property and both labels. Community tests used the administrative account; narrower Enterprise roles were not tested. Plugin 1.4.9 uses the account's default database and has no database or parameters property. Query tasks have a 40-second ceiling.

    ### Secrets
    NEO4J_USERNAME and NEO4J_PASSWORD authenticate. SLACK_WEBHOOK_URL receives alerts. Password and webhook overrides are SECRET inputs.

    ### Inputs
    neo4j_url selects the server. Identifiers allow 64 ASCII characters. max_nodes is 1 to 100. Defaults: dry_run=true, auto_remediate=false.

    ## Quick start
    1. Set ceilings, secrets and mapping. Run read-only.
    2. Review identities, labels and canonical constraints.
    3. Set dry_run=false and auto_remediate=true then approve. Re-audit after failure.

    ## How to extend
    Add importer checks before future loads.
    Limits: one mapping per execution. The batch is not atomic; completed repairs survive later failures. The approval recheck does not fence future inserts. New variants remain outside the approved write set and fail final verification. Writers can change state after a check; identical replacement nodes are not distinguished by a generation token. No entity deduplication or schema repair.

    ## Links
    - [Neo4j concurrent data access](https://neo4j.com/docs/operations-manual/5/database-internals/concurrent-data-access/)
    - [Kestra Neo4j plugin](https://kestra.io/plugins/plugin-neo4j)

    This blueprint was created by [zkasuran](https://github.com/zkasuran).
