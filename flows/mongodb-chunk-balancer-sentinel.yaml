id: mongodb-chunk-balancer-sentinel
namespace: company.dataops

inputs:
  - id: mongo_mongos_uri
    type: STRING
    defaults: mongodb://mongos.internal:27017/config
    description: MongoDB mongos router connection URI to inspect balancer state.

tasks:
  - id: inspect_balancer_state
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    dependencies:
      - pymongo==4.15.3
      - kestra==2.0.0
    script: |
      from pymongo import MongoClient
      import sys
      from kestra import Kestra

      mongo_uri = "{{ inputs.mongo_mongos_uri }}"
      try:
          client = MongoClient(mongo_uri, serverSelectionTimeoutMS=5000)
          config_db = client["config"]

          # Inspect balancer settings
          settings = config_db["settings"].find_one({"_id": "balancer"})
          balancer_stopped = bool(settings and (settings.get("stopped") is True or settings.get("mode") == "off"))
          balancer_enabled = not balancer_stopped

          # Inspect balancer lock state
          lock = config_db["locks"].find_one({"_id": "balancer"})
          balancer_state = lock.get("state", 0) if lock else 0

          # Inspect recent chunk migration failures
          recent_changelogs = list(config_db["changelog"].find({"what": {"$regex": "moveChunk"}}).sort("time", -1).limit(5))
          failures = [c for c in recent_changelogs if c.get("details", {}).get("errmsg")]
          recent_failures_count = len(failures)

          alert_triggered = (not balancer_enabled) or (recent_failures_count > 0)

          print(f"Balancer enabled: {balancer_enabled}, lock state: {balancer_state}, recent failures: {recent_failures_count}, alert triggered: {alert_triggered}")

          Kestra.outputs({
              "balancer_enabled": balancer_enabled,
              "balancer_state": balancer_state,
              "recent_failures": recent_failures_count,
              "alert_triggered": alert_triggered
          })
      except Exception as e:
          print(f"Error inspecting MongoDB balancer state: {e}", file=sys.stderr)
          sys.exit(1)

  - id: evaluate_balancer_health
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.inspect_balancer_state.vars.alert_triggered }}"
    then:
      - id: alert_dba_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "text": ":warning: *MongoDB Balancer Alert*: Sharded cluster balancer issue detected on {{ inputs.mongo_mongos_uri }}. Balancer enabled: {{ outputs.inspect_balancer_state.vars.balancer_enabled }}, Recent migration failures: {{ outputs.inspect_balancer_state.vars.recent_failures }}."
          }

errors:
  - id: notify_sentinel_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "text": ":warning: *MongoDB Sentinel Execution Failure*: Failed to query balancer state on {{ inputs.mongo_mongos_uri }}."
      }

triggers:
  - id: scheduled_balancer_check
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 * * * *"
    disabled: true

outputs:
  - id: balancer_enabled
    type: BOOLEAN
    value: "{{ outputs.inspect_balancer_state.vars.balancer_enabled }}"
  - id: balancer_state
    type: INT
    value: "{{ outputs.inspect_balancer_state.vars.balancer_state }}"
  - id: recent_failures
    type: INT
    value: "{{ outputs.inspect_balancer_state.vars.recent_failures }}"
  - id: alert_triggered
    type: BOOLEAN
    value: "{{ outputs.inspect_balancer_state.vars.alert_triggered }}"

extend:
  metaDescription: "Audits MongoDB sharded cluster balancer states to detect disabled balancers, stuck chunk migrations, and round failures."
  metaTitle: MongoDB Sharded Cluster Chunk Balancer Health Sentinel with Kestra
  title: MongoDB Sharded Cluster Chunk Balancer Health Sentinel
  shortDescription: Audits MongoDB sharded cluster balancer states to detect disabled balancers, stuck chunk migrations, and round failures.
  description: |
    ## How it works
    This sentinel runs a Python script in Docker against the `mongos` query router to evaluate balancer configuration and inspect the `config.changelog` collection for chunk migration errors. It alerts administrators when chunk migrations fail repeatedly or when the balancer is inadvertently disabled.

    ## What you get
    - Continuous validation of data distribution health across MongoDB sharded clusters.
    - Early warning before chunk imbalance leads to hot-shard disk saturation.
    - Automated Slack incident delivery indicating balancer status and recent migration failure counts.

    ## Who it's for
    - Database administrators managing distributed sharded MongoDB deployments.
    - SREs overseeing high-throughput horizontal database scaling.

    ## Why orchestrate this with Kestra
    Kestra automates database maintenance and health verifications, running scheduled diagnostic scripts with built-in credential management and alerting.

    ## Prerequisites
    - MongoDB mongos router access with monitoring credentials.
    - Secret `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import this blueprint into Kestra.
    2. Set `mongo_mongos_uri` to point to your router.
    3. Run manually to check current balancer state.

    ## How to extend
    - Query `config.chunks` to calculate exact chunk skew across individual shards.
    - Re-enable balancer automatically via `sh.enableBalancing()` in an automated remediation subflow.
    - Export chunk migration duration metrics to CloudWatch or Datadog.

    ## Links
    - [MongoDB Balancer Operations Documentation](https://www.mongodb.com/docs/manual/core/sharding-balancer-administration/)
    - [Kestra Python Plugin](https://kestra.io/plugins/plugin-script-python)
  tags:
    - Data
    - Infrastructure
  subTags:
    - Monitoring & Alerting
  ee: false
  demo: false
