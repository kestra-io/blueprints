id: mongodb-chunk-balancer-sentinel
namespace: company.dataops

inputs:
  - id: mongo_mongos_uri
    type: STRING
    defaults: mongodb://mongos.internal:27017/config
    description: MongoDB mongos router connection URI to inspect balancer state.

tasks:
  - id: inspect_balancer_state
    type: io.kestra.plugin.scripts.shell.Commands
    runner: PROCESS
    commands:
      - |
        mongosh --quiet "{{ inputs.mongo_mongos_uri }}" --eval '
        const isEnabled = sh.getBalancerState();
        const lock = db.getSiblingDB("config").locks.findOne({_id: "balancer"});
        const changelog = db.getSiblingDB("config").changelog.find({what: /moveChunk/}).sort({time: -1}).limit(5).toArray();
        const failures = changelog.filter(c => c.details && c.details.errmsg);
        print(JSON.stringify({
          balancer_enabled: isEnabled,
          balancer_state: lock ? lock.state : 0,
          recent_failures: failures.length,
          alert_triggered: (!isEnabled) || (failures.length > 0)
        }));
        ' > balancer_stats.json
        python3 -c "
        import json
        with open('balancer_stats.json') as f:
            lines = [l.strip() for l in f if l.strip().startswith('{')]
            data = json.loads(lines[-1]) if lines else {'balancer_enabled': True, 'alert_triggered': False}
        with open('balancer_summary.json', 'w') as out:
            json.dump(data, out)
        print('MongoDB balancer audit:', data)
        "
    outputFiles:
      - balancer_summary.json

  - id: evaluate_balancer_health
    type: io.kestra.plugin.core.flow.If
    condition: "{{ json(read(outputs.inspect_balancer_state.outputFiles['balancer_summary.json'])).alert_triggered }}"
    then:
      - id: alert_dba_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "text": ":warning: *MongoDB Balancer Alert*: Sharded cluster balancer issue detected on {{ inputs.mongo_mongos_uri }}. Balancer enabled: {{ json(read(outputs.inspect_balancer_state.outputFiles['balancer_summary.json'])).balancer_enabled }}, Recent migration failures: {{ json(read(outputs.inspect_balancer_state.outputFiles['balancer_summary.json'])).recent_failures }}."
          }

errors:
  - id: notify_sentinel_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "text": ":warning: *MongoDB Sentinel Execution Failure*: Failed to query balancer state on {{ inputs.mongo_mongos_uri }}."
      }

triggers:
  - id: scheduled_balancer_check
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 * * * *"
    disabled: true

extend:
  title: MongoDB Sharded Cluster Chunk Balancer Health Sentinel
  shortDescription: Audits MongoDB sharded cluster balancer states to detect disabled balancers, stuck chunk migrations, and round failures.
  description: |
    ## How it works
    This sentinel runs `mongosh` against the `mongos` query router to evaluate `sh.getBalancerState()` and inspect the `config.changelog` collection for chunk migration errors. It alerts administrators when chunk migrations fail repeatedly or when the balancer is inadvertently disabled.

    ## What you get
    - Continuous validation of data distribution health across MongoDB sharded clusters.
    - Early warning before chunk imbalance leads to hot-shard disk saturation.
    - Automated Slack incident delivery indicating balancer status and recent migration failure counts.

    ## Who it's for
    - Database administrators managing distributed sharded MongoDB deployments.
    - SREs overseeing high-throughput horizontal database scaling.

    ## Why orchestrate this with Kestra
    Kestra automates database maintenance and health verifications, running scheduled diagnostic scripts with built-in credential management and alerting.

    ## Prerequisites
    - MongoDB mongos router access with monitoring credentials.
    - Secret `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import this blueprint into Kestra.
    2. Set `mongo_mongos_uri` to point to your router.
    3. Run manually to check current balancer state.

    ## How to extend
    - Query `config.chunks` to calculate exact chunk skew across individual shards.
    - Re-enable balancer automatically via `sh.enableBalancing()` in an automated remediation subflow.
    - Export chunk migration duration metrics to CloudWatch or Datadog.

    ## Links
    - [MongoDB Balancer Operations Documentation](https://www.mongodb.com/docs/manual/core/sharding-balancer-administration/)
    - [Kestra Slack Notifications](https://kestra.io/plugins/plugin-slack)
  tags:
    - Data
    - Infrastructure
  subTags:
    - Monitoring & Alerting
  ee: false
  demo: false
