id: dashboard-sample-data-seeder
namespace: company.team
description: |
  Seed a dashboard with meaningful sample executions: plan combinations of
  service and environment labels, fan out child executions carrying those
  labels through a Subflow loop — with a deliberate mix of passing and
  failing runs — then report what was created, so a fresh dashboard shows
  real charts instead of empty states.

triggers:
  - id: seed_on_demand
    type: io.kestra.plugin.core.trigger.Webhook
    description: POST to the keyed webhook URL to seed sample data on demand; the flow also runs manually from the UI.
    key: "{{ secret('SEED_WEBHOOK_KEY') }}"

inputs:
  - id: mode
    type: STRING
    defaults: parent
    description: Internal switch. Leave on parent to seed; the Subflow task re-invokes this flow as child to create each sample execution.
  - id: services
    type: STRING
    defaults: api,web,worker
    description: Comma-separated service names spread across the sample executions.
  - id: environments
    type: STRING
    defaults: staging,prod
    description: Comma-separated environment names spread across the sample executions.
  - id: samples_per_combination
    type: INT
    defaults: 2
    description: Sample executions per service × environment combination (3 services × 2 environments × 2 = 12 by default).
  - id: service
    type: STRING
    defaults: api
    description: Service label for a child sample execution; set by the parent loop.
  - id: environment
    type: STRING
    defaults: staging
    description: Environment label for a child sample execution; set by the parent loop.
  - id: should_fail
    type: BOOL
    defaults: false
    description: When true the child sample fails on purpose so dashboards show a state mix; set by the parent loop.
  - id: sleep_seconds
    type: INT
    defaults: 2
    description: Seconds a child sample burns before finishing, so duration charts have variety; set by the parent loop.

tasks:
  - id: plan_samples
    type: io.kestra.plugin.scripts.python.Script
    description: Turn the services × environments matrix into a deterministic sample list — every fourth run fails on purpose and sleep varies — so both modes share one plan and outputs always resolve.
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    env:
      SERVICES: "{{ inputs.services }}"
      ENVIRONMENTS: "{{ inputs.environments }}"
      SAMPLES_PER_COMBO: "{{ inputs.samples_per_combination }}"
    script: |
      import json
      import os

      services = [s.strip() for s in os.environ["SERVICES"].split(",") if s.strip()]
      environments = [e.strip() for e in os.environ["ENVIRONMENTS"].split(",") if e.strip()]
      per_combo = int(os.environ["SAMPLES_PER_COMBO"])

      items = []
      idx = 0
      for service in services:
          for environment in environments:
              for _ in range(per_combo):
                  items.append({
                      "service": service,
                      "environment": environment,
                      "should_fail": idx % 4 == 3,
                      "sleep_seconds": 2 + idx % 5,
                  })
                  idx += 1

      failures = sum(1 for i in items if i["should_fail"])
      print(f"Planned {len(items)} sample executions ({failures} failing on purpose)")
      print("::" + json.dumps({"outputs": {
          "items": items,
          "total": len(items),
          "failing": failures,
      }}) + "::")

  - id: is_parent
    type: io.kestra.plugin.core.flow.If
    description: Parent mode fans out the samples; child mode (invoked through Subflow) produces one labeled sample execution and stops.
    condition: "{{ inputs.mode != 'child' }}"
    then:
      - id: seed_executions
        type: io.kestra.plugin.core.flow.Loop
        description: One sample execution per planned combination, each a child execution of this flow carrying its service and environment labels.
        values: "{{ outputs.plan_samples.vars.items }}"
        tasks:
          - id: run_sample
            type: io.kestra.plugin.core.flow.Subflow
            description: Re-invoke this flow in child mode with the sample's labels; transmitFailed stays false so the planned failures never fail the seeder itself.
            namespace: "{{ flow.namespace }}"
            flowId: "{{ flow.id }}"
            wait: true
            transmitFailed: false
            inputs:
              mode: child
              service: "{{ item.value.service }}"
              environment: "{{ item.value.environment }}"
              should_fail: "{{ item.value.should_fail }}"
              sleep_seconds: "{{ item.value.sleep_seconds }}"
            labels:
              service: "{{ item.value.service }}"
              environment: "{{ item.value.environment }}"
              dashboard_sample: "true"

      - id: report_seeding
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Summarize how many labeled sample executions now exist so the dashboard can be opened with expectations set.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "Dashboard sample data seeded: {{ outputs.plan_samples.vars.total }} executions across services [{{ inputs.services }}] and environments [{{ inputs.environments }}] ({{ outputs.plan_samples.vars.failing }} failing on purpose), labels service/environment/dashboard_sample applied. Open the pipeline-health dashboard — parent execution {{ execution.id }}."
          }
    else:
      - id: sample_work
        type: io.kestra.plugin.core.debug.Return
        description: Stand-in work for the sample execution; replace with your own flow's real tasks when repointing the seeder.
        format: "sample {{ inputs.service }}/{{ inputs.environment }} run {{ execution.id }}"

      - id: sample_burn_time
        type: io.kestra.plugin.core.flow.Sleep
        description: Burn a few seconds so duration charts show variety between samples.
        duration: "PT{{ inputs.sleep_seconds }}S"

      - id: maybe_fail
        type: io.kestra.plugin.core.flow.If
        description: Fail a deliberate share of samples so state breakdowns on the dashboard look realistic.
        condition: "{{ inputs.should_fail }}"
        then:
          - id: mark_sample_failed
            type: io.kestra.plugin.core.execution.Fail
            description: End this sample execution in FAILED on purpose.
            errorMessage: "Planned sample failure for dashboard realism (service {{ inputs.service }}, environment {{ inputs.environment }})."
        else:
          - id: sample_done
            type: io.kestra.plugin.core.log.Log
            description: Record the healthy sample.
            message: "Sample execution for {{ inputs.service }}/{{ inputs.environment }} completed."

errors:
  - id: alert_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alert when seeding itself fails, since a half-seeded dashboard looks exactly like missing data.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "Dashboard sample seeder FAILED in flow {{ flow.id }} (execution {{ execution.id }}). The dashboard may be partially seeded — check the plan step and re-run."
      }

outputs:
  - id: seed_summary
    type: JSON
    description: 'Planned sample executions and failing share — e.g. {"total": 12, "failing": 3, "items": [...]}.'
    value: "{{ outputs.plan_samples.vars | toJson }}"

extend:
  title: Seed Dashboard Sample Data with Labeled Executions
  shortDescription: Webhook- or manually-triggered flow that fans out labeled child executions — a realistic mix of passing and failing runs — so dashboard blueprints open with real charts instead of empty states.
  metaTitle: Seed Sample Execution Data for Kestra Dashboards with Kestra
  metaDescription: "Populate Kestra dashboards with realistic sample executions: labeled child runs and a pass/fail mix, so new dashboards show real charts instead of empty states."
  description: |
    A dashboard blueprint opened on a fresh instance shows nothing: no executions, no labels, no states, no durations — just empty frames that hide what the dashboard can do. This flow fixes that by generating the data itself. It plans a matrix of service and environment combinations, then loops a `Subflow` call that re-invokes this same flow in child mode, stamping every child execution with `service`, `environment`, and `dashboard_sample` labels. A deliberate mix passes and fails, and each child sleeps for a varied few seconds, so state and duration charts look like real traffic. It ships as a matched pair with the `pipeline-health` dashboard blueprint.

    ## How it works

    1. `plan_samples` (`io.kestra.plugin.scripts.python.Script` on the `io.kestra.plugin.core.runner.Process` runner) expands `services` × `environments` × `samples_per_combination` into a deterministic list: every fourth sample is marked to fail and sleep varies from 2 to 6 seconds, so both the parent plan and child outputs always resolve from the same step.
    2. `is_parent` (`io.kestra.plugin.core.flow.If`) splits the two modes on the `mode` input: the parent fans out, the child produces exactly one sample and stops.
    3. In parent mode, `seed_executions` (`io.kestra.plugin.core.flow.Loop`) walks the plan and `run_sample` (`io.kestra.plugin.core.flow.Subflow`) re-invokes this flow with `mode: child`, binding the sample's values as inputs and setting `service`, `environment`, and `dashboard_sample` labels on the child execution. `wait: true` with `transmitFailed: false` keeps the seeder green even when a child fails on purpose.
    4. `report_seeding` posts the totals to Slack through `io.kestra.plugin.slack.notifications.SlackIncomingWebhook`.
    5. In child mode, `sample_work` (`io.kestra.plugin.core.debug.Return`) stands in for real work, `sample_burn_time` (`io.kestra.plugin.core.flow.Sleep`) varies the duration, and `maybe_fail` (`io.kestra.plugin.core.flow.If`) ends a deliberate share of samples through `io.kestra.plugin.core.execution.Fail`.
    6. The `errors` block alerts Slack if seeding itself breaks, and the `seed_on_demand` trigger (`io.kestra.plugin.core.trigger.Webhook`, keyed URL) lets CI or a button POST start a seeding run.

    ## What you get

    - A dashboard that opens with realistic charts: per-service executions over time, success and failure KPIs, per-environment tables, and log counts.
    - Labels (`service`, `environment`, `dashboard_sample`) on every seeded execution, ready for any label-driven chart you build next.
    - A controllable failure ratio and duration spread from plain inputs — no data generators or SQL inserts.
    - One self-contained flow: no companion child flow to install, because the seeder re-invokes itself in child mode.

    ## Who it's for

    - Authors of dashboard and App blueprints who need demo data that makes the UI tell a story.
    - Teams evaluating Kestra dashboards who want to see state mixes and label splits before wiring real pipelines.
    - Solution engineers preparing demos and workshops on fresh instances.

    ## Why orchestrate this with Kestra

    Creating dozens of labeled executions is exactly what orchestration is for: a loop of subflow calls gives each sample its own execution id, state, labels, logs, and lineage — the very rows dashboards query. Doing this with the API by hand means twenty curl calls and manual label maps; doing it as a flow means one trigger, an execution history proving what was seeded, inputs that change the shape of the data, and a repeatable fixture for demos. Because the flow re-invokes itself, there is no second blueprint to keep in sync.

    ## Prerequisites

    - A running Kestra instance with the `pipeline-health` dashboard blueprint deployed (or your own dashboard grouping by the same labels).
    - Permission to create executions of this flow in its namespace.
    - A Slack incoming webhook for the seeding summary and failure alerts.

    ### Secrets

    - `SEED_WEBHOOK_KEY`: key guarding the webhook trigger URL; pick any random string.
    - `SLACK_WEBHOOK_URL`: Slack incoming webhook URL for seeding summary and failure alerts.

    ## Quick start

    1. Add both secrets to the Kestra namespace.
    2. Deploy this flow together with `dashboards/pipeline-health.yaml`.
    3. Execute the flow once with the defaults (12 samples, 3 failing on purpose) or POST to the webhook URL.
    4. Open the pipeline-health dashboard — time series, KPIs, and tables should already show the service/environment mix.
    5. Adjust `services`, `environments`, and `samples_per_combination` to change the shape of the data, then re-seed.

    ## How to extend

    - Repoint `run_sample` at a different flow (`flowId`) to seed with real pipeline executions instead of the built-in child mode.
    - Seed historical data by adding a `scheduleDate` offset per iteration so charts cover past days, not just "now".
    - Emit additional label dimensions — `team`, `region`, `tier` — by extending the plan items and the `labels` map.
    - Swap the Slack summary for a Discord webhook or drop it entirely in demo environments.

    ## Links

    - [Subflow task documentation](https://kestra.io/plugins/core/flow/io.kestra.plugin.core.flow.subflow)
    - [Execution labels documentation](https://kestra.io/docs/workflow-components/execution#labels)
    - [Dashboards documentation](https://kestra.io/docs/dashboards)
    - This blueprint has been created by [RudraMalvankar](https://github.com/RudraMalvankar)
  tags:
    - Getting Started
  subTags:
    - Flow Control & Conditions
    - Monitoring & Alerting
  ee: false
  demo: false
