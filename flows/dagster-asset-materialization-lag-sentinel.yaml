id: dagster-asset-materialization-lag-sentinel
namespace: company.dataops

inputs:
  - id: dagster_graphql_url
    type: STRING
    defaults: "http://dagster-webserver.internal:3000/graphql"
    description: URL of the Dagster webserver GraphQL endpoint.
  - id: asset_key_path
    type: STRING
    description: "Asset key path to inspect (e.g. analytics_fct_daily_revenue)."
  - id: max_staleness_hours
    type: INT
    defaults: 24
    description: "Maximum allowable hours since last successful asset materialization (default 24)."

tasks:
  - id: query_asset_freshness
    type: io.kestra.plugin.scripts.shell.Commands
    commands:
      - |
        # Query Dagster GraphQL API for asset materialization timestamp
        curl -s -X POST "{{ inputs.dagster_graphql_url }}" \
          -H "Content-Type: application/json" \
          --data '{"query": "query AssetCheck { assetOrError(assetKey: {path: [\"{{ inputs.asset_key_path }}\"]}) { ... on Asset { assetMaterializations(limit: 1) { timestamp } } } }"}' > /tmp/dagster_res.json

        python3 -c "
        import json, time
        try:
            with open('/tmp/dagster_res.json') as f:
                res = json.load(f)
            mats = res.get('data', {}).get('assetOrError', {}).get('assetMaterializations', [])
            if not mats:
                print('1|NEVER_MATERIALIZED|999999')
            else:
                last_ts = int(mats[0]['timestamp']) / 1000.0
                age_hours = (time.time() - last_ts) / 3600.0
                is_stale = 1 if age_hours > {{ inputs.max_staleness_hours }} else 0
                print(f'{is_stale}|{age_hours:.1f}|{int(last_ts)}')
        except Exception:
            print('0|ERROR|0')
        " > /tmp/dagster_parsed.txt

        IS_STALE=$(cut -d '|' -f 1 /tmp/dagster_parsed.txt)
        AGE_HOURS=$(cut -d '|' -f 2 /tmp/dagster_parsed.txt)
        
        echo "::set-output name=is_stale::${IS_STALE:-0}::"
        echo "::set-output name=age_hours::$AGE_HOURS::"

  - id: evaluate_asset_sla
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.query_asset_freshness.vars.is_stale | int == 1 }}"
    then:
      - id: notify_dataops_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#dataops-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 Dagster Asset Freshness SLA Breach",
                "text": "Asset {{ inputs.asset_key_path }} has not materialized in {{ outputs.query_asset_freshness.vars.age_hours }} hours (threshold {{ inputs.max_staleness_hours }} hours). Downstream analytics models may be consuming stale data.",
                "footer": "Kestra Data Governance • Dagster"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#dataops-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ Dagster Sentinel Failure",
            "text": "Failed to query Dagster GraphQL endpoint at {{ inputs.dagster_graphql_url }}.",
            "footer": "Kestra Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/30 * * * *"
    disabled: true

extend:
  ee: false
  demo: false
  title: Dagster Software-Defined Asset Materialization Freshness Sentinel
  shortDescription: Audits Dagster GraphQL endpoints to detect stale software-defined assets exceeding freshness SLA thresholds.
  description: |
    ## How it works
    This workflow connects to the Dagster webserver GraphQL API (`/graphql`) to inspect the latest materialization event for a designated software-defined asset. It queries `assetMaterializations(limit: 1)` to extract the event timestamp, computes the duration since last materialization, and compares it against the configured `max_staleness_hours`. If the asset is missing recent materialization events due to failed upstream sensor triggers, unhandled exceptions in compute ops, or scheduler stagnation, an automated alert is dispatched.

    ## What you get
    - Real-time data freshness and asset SLA monitoring.
    - Early detection of stalled sensor schedules and failed data transformation runs.
    - Actionable Slack notifications detailing exact materialization age.

    ## Who it's for
    - Data Engineers overseeing critical transformation pipelines in Dagster.
    - Analytics Engineers delivering warehouse tables to BI stakeholders.
    - Data Governance teams tracking organizational data freshness SLAs.

    ## Why orchestrate this with Kestra
    - **Cross-Platform Supervision**: Monitors Dagster pipelines alongside dbt, Snowflake, and Spark workflows.
    - **Decoupled Monitoring**: Operates independently of the Dagster daemon to detect silent orchestrator outages.
    - **Automated Remediation**: Can trigger Dagster run launches or Kestra fallback pipelines when staleness is detected.

    ## Prerequisites
    - Dagster webserver with accessible GraphQL interface.
    - Target asset key registered in Dagster asset catalog.
    - Slack incoming webhook stored as `SLACK_WEBHOOK` secret.

    ## Quick start
    1. Import this blueprint into your Kestra workspace.
    2. Store your Slack webhook in `SLACK_WEBHOOK`.
    3. Set `dagster_graphql_url` and the target `asset_key_path`.
    4. Enable the schedule trigger to activate continuous freshness monitoring.

    ## How to extend
    - Extend the `If` block with an automated GraphQL mutation to launch a backfill run (`launchPipelineExecution`).
    - Parameterize multiple asset keys in a loop task to audit complete asset groups.
    - Route critical revenue asset SLA breaches directly to incident management tooling.

    ## Links
    - [Dagster GraphQL API](https://docs.dagster.io/concepts/webserver/graphql)
    - [Kestra Shell Plugin](https://kestra.io/plugins/plugin-scripts-shell)
    - [Kestra Slack Notifications](https://kestra.io/plugins/plugin-slack)
  tags:
    - Data
    - Infrastructure
