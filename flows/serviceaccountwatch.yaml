id: serviceaccountwatch
namespace: company.team
description: Audits ServiceAccounts no pod uses and reports the unused ones on Slack. Report-only by design, it never deletes.

labels:
  project: serviceaccountwatch
  team: platform

inputs:
  - id: namespace
    type: STRING
    displayName: "Namespace"
    description: the namespace whose ServiceAccounts to audit
    defaults: default
  - id: slack_webhook
    type: STRING
    displayName: "Slack Webhook URL"
    description: Incoming webhook URL of the Slack channel for the report

triggers:
  - id: schedule
    type: io.kestra.plugin.core.trigger.Schedule
    description: audits unused ServiceAccounts every morning
    cron: "30 8 * * *"
    timezone: UTC
    inputs:
      namespace: default
      slack_webhook: "{{ secret('SLACK_WEBHOOK') }}"

tasks:
  - id: list_state
    type: io.kestra.plugin.scripts.shell.Commands
    description: lists the namespace's ServiceAccounts and pods as JSON
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      user: "0"
    containerImage: bitnami/kubectl
    inputFiles:
      client.crt: "{{ secret('CLIENT_CRT') }}"
      client.key: "{{ secret('CLIENT_KEY') }}"
    commands:
      - kubectl get serviceaccounts -n {{ inputs.namespace }} -o json --client-certificate=client.crt --client-key=client.key --server={{ secret('MASTERURL') }} --insecure-skip-tls-verify=true > sas.json
      - kubectl get pods -n {{ inputs.namespace }} -o json --client-certificate=client.crt --client-key=client.key --server={{ secret('MASTERURL') }} --insecure-skip-tls-verify=true > pods.json
    outputFiles:
      - sas.json
      - pods.json

  - id: find_unused
    type: io.kestra.plugin.scripts.python.Script
    description: cross-references ServiceAccounts against the pods that use them
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      user: "0"
    containerImage: python:3.11
    dependencies:
      - kestra
    inputFiles:
      sas.json: "{{ outputs.list_state.outputFiles['sas.json'] }}"
      pods.json: "{{ outputs.list_state.outputFiles['pods.json'] }}"
    script: |
      import json
      from kestra import Kestra

      namespace = """{{ inputs.namespace }}"""

      with open('sas.json') as f:
          sas = json.load(f)['items']
      with open('pods.json') as f:
          pods = json.load(f)['items']

      # ServiceAccount names we already reported, from the KV store (null on first run -> empty)
      raw_state = """{{ kv('serviceaccountwatch-state-' ~ inputs.namespace, errorOnMissing=false) }}"""
      already = set(json.loads(raw_state) if raw_state.strip() else [])

      # every pod counts as a reference, whatever its phase: a completed job's
      # account is still provisioned for the next run. a pod with no explicit
      # serviceAccountName runs as 'default'.
      used = set()
      for pod in pods:
          used.add(pod.get('spec', {}).get('serviceAccountName') or 'default')

      unused = []
      for sa in sas:
          name = sa['metadata']['name']
          if name not in used:
              unused.append(name)
      unused.sort()

      new = [n for n in unused if n not in already]

      lines = [f"*ServiceAccountWatch - unused ServiceAccounts in '{namespace}'*", ""]
      for n in new:
          lines.append(f"- *{n}*: no pod in this namespace runs as it")
      lines.append("")
      lines.append("an account nothing uses is attack surface with no owner. if it has bindings, deleting it blind can break whoever still holds its token, so deleting one stays a human call.")
      alert_text = "\n".join(lines)

      Kestra.outputs({
          'new_unused': new,
          'count': len(new),
          'alert_text': alert_text,
          'new_state_json': json.dumps(unused),
      })

  - id: maybe_alert
    type: io.kestra.plugin.core.flow.If
    description: reports only newly found unused ServiceAccounts
    condition: "{{ outputs.find_unused.vars.count > 0 }}"
    then:
      - id: send_alert
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: posts the unused ServiceAccount report to Slack
        url: "{{ inputs.slack_webhook }}"
        messageText: "{{ outputs.find_unused.vars.alert_text }}"

  - id: save_state
    type: io.kestra.plugin.core.kv.Set
    description: remembers who was reported, so cleaned-up accounts drop out quietly
    key: "serviceaccountwatch-state-{{ inputs.namespace }}"
    value: "{{ outputs.find_unused.vars.new_state_json }}"
    overwrite: true

extend:
  title: "ServiceAccountWatch - Kubernetes unused ServiceAccount auditor"
  shortDescription: "Reports ServiceAccounts that no pod in the namespace uses, on Slack. Report-only, it never deletes."
  metaTitle: "ServiceAccountWatch: Kubernetes unused ServiceAccount auditor blueprint for Kestra"
  metaDescription: "A Kestra blueprint that cross-references Kubernetes ServiceAccounts against the pods using them and reports the unused ones on Slack, without spamming."
  tags:
    - Infrastructure
  subTags:
    - Kubernetes Operations
    - Infrastructure Automation
  ee: false
  demo: false
  description: |
    ## How it works

    1. `list_state` (`io.kestra.plugin.scripts.shell.Commands`) dumps the namespace's ServiceAccounts and pods as JSON with kubectl.
    2. `find_unused` (`io.kestra.plugin.scripts.python.Script`) builds the set of accounts pods actually run as (a pod with no explicit `serviceAccountName` runs as `default`) and flags every ServiceAccount outside that set. It compares against the KV state so only newly found unused accounts are reported.
    3. `maybe_alert` (`io.kestra.plugin.core.flow.If`) posts the Slack report only when there is someone new to name.
    4. `save_state` (`io.kestra.plugin.core.kv.Set`) writes back the current unused list. Deleted accounts drop out on their own, so a reappearing unused account reports again, and steady-state reruns stay quiet.

    ## What you get

    - A daily audit of ServiceAccounts nothing runs as: stale accounts left behind by removed workloads and renamed deploys.
    - Slack reports naming each unused account, once, until the list changes.
    - Quiet runs when every account in the namespace has a pod behind it.
    - The full cross-reference logic in one readable Python step, no cluster-side agents.

    ## Who it's for

    Anyone whose namespaces have accumulated ServiceAccounts over months of deploys and wants the cleanup list without handing a bot delete rights over identity objects. Pairs with RBACWatch: this one covers unused accounts, that one covers over-powerful bindings.

    ## Why orchestrate this with Kestra

    `kubectl get sa` never told you which accounts are dead. As a flow it audits on a schedule, keeps every run's findings where you can review them, and only bothers you when a new unused account appears. Kestra holds the cluster credentials as secrets out of the YAML.

    ## Prerequisites

    - A Kubernetes cluster with ServiceAccounts and pods you can list.
    - A kubeconfig client certificate and key with permission to list ServiceAccounts and pods in the target namespace.
    - Kestra with the Docker task runner available (used for the kubectl and Python steps).
    - A Slack Incoming Webhook URL.

    ### Secrets

    | Secret | What it is |
    | --- | --- |
    | `CLIENT_CRT` | base64-encoded client certificate from your kubeconfig |
    | `CLIENT_KEY` | base64-encoded client key from your kubeconfig |
    | `MASTERURL` | base64-encoded Kubernetes API server URL, reachable from inside the Kestra container |
    | `SLACK_WEBHOOK` | base64-encoded Slack Incoming Webhook URL |

    In Kestra OSS, secrets come from environment variables prefixed with `SECRET_` and must be base64-encoded. If the API URL uses `127.0.0.1` or `localhost`, replace it with `host.docker.internal` so the Kestra container can reach it.

    ## Quick start

    1. Start Kestra with the secrets above as `SECRET_` environment variables. If minikube restarted since your last run, regenerate `SECRET_MASTERURL` first: the API port changes on every `minikube start`.
    2. Import this flow and create two ServiceAccounts: `kubectl create sa orphan-sa` (nothing uses it) and `kubectl create sa used-sa`, plus a pod that runs as `used-sa`. Run the flow: the Slack report names only `orphan-sa`.
    3. Run again: quiet, already reported.
    4. `kubectl delete sa orphan-sa` and run again: quiet, it dropped out of state.

    ## How to extend

    - Cross-reference RoleBindings too, and split the report into accounts with bindings (risky) and accounts with none (safe cleanup).
    - Audit every namespace by wrapping the flow in a ForEach over a namespace list.
    - Age the findings: only report accounts unused for more than N days using creationTimestamp.
    - Open a ticket instead of a Slack message by swapping the notification task.

    ## Inputs

    | Input | Type | Default | What it does |
    | --- | --- | --- | --- |
    | `namespace` | STRING | `default` | the namespace whose ServiceAccounts to audit |
    | `slack_webhook` | STRING | (required) | Incoming webhook URL of the Slack channel for the report |

    ## Links

    - [Kestra blueprint catalog](https://kestra.io/blueprints)
    - [Kubernetes ServiceAccounts documentation](https://kubernetes.io/docs/tasks/configure-pod-container/configure-service-account/)
    - [Kestra secrets documentation](https://kestra.io/docs/concepts/secrets)

    ## Pitfalls

    - This flow deliberately never deletes a ServiceAccount. An account that looks stale might belong to a CI job that runs monthly, and deleting it breaks that pipeline silently weeks later. The report informs the human; the human deletes.
    - Every pod counts as a reference, including completed Job pods. Conservative on purpose: an account a finished job used is provisioned for its next run.
    - The `default` ServiceAccount is flagged when no pod runs as it. That is correct, and on a fresh namespace it may be the only finding.
    - The flow is strictly read-only. It lists ServiceAccounts and pods and reports; it never patches or deletes anything.
    - Minikube's API server port changes on every `minikube start`. Regenerate `SECRET_MASTERURL` and restart the Kestra container, or the kubectl step fails to connect.
