id: cosign-container-image-signature-verification-sentinel
namespace: company.team

inputs:
  - id: container_image
    type: STRING
    defaults: "ghcr.io/myorg/api:v1.2.3"
    description: "Full container image reference to verify (e.g. ghcr.io/myorg/api:v1.2.3)."

tasks:
  - id: verify_signature
    type: io.kestra.plugin.scripts.shell.Commands
    containerImage: gcr.io/projectsigstore/cosign:latest
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    commands:
      - |
        if cosign verify --key "{{ secret('COSIGN_PUBLIC_KEY') }}" "{{ inputs.container_image }}" > cosign_telemetry.json 2>&1; then
          echo '{"exit_code": 0, "status": "VERIFIED"}' > cosign_result.json
        else
          echo '{"exit_code": 1, "status": "FAILED"}' > cosign_result.json
        fi
    outputFiles:
      - cosign_result.json
      - cosign_telemetry.json

  - id: evaluate_signature
    type: io.kestra.plugin.core.flow.If
    condition: "{{ fromJson(read(outputs.verify_signature.outputFiles['cosign_result.json'])).exit_code != 0 }}"
    then:
      - id: notify_security_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#security-ops",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 Cosign Container Signature Verification FAILED Alert",
                "text": "Container image `{{ inputs.container_image }}` failed Sigstore Cosign cryptographic signature verification! Image may be unsigned, tampered with, or produced by an unauthorized build pipeline.",
                "footer": "Kestra Security Sentinel • Sigstore Cosign"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "#security-ops",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ Cosign Sentinel Failure",
            "text": "Failed to execute Cosign verification on `{{ inputs.container_image }}`. Verify public key and container registry access. Execution ID: {{ execution.id }}",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 */6 * * *"
    disabled: true

extend:
  metaDescription: "Verifies Sigstore Cosign container image cryptographic signatures before production deployment."
  metaTitle: Cosign Container Image Signature Verification Sentinel with Kestra
  title: Cosign Container Image Signature Verification Sentinel
  shortDescription: Verifies Sigstore Cosign container image cryptographic signatures before production deployment.
  description: |
    ## How it works
    This workflow invokes `cosign verify` using the official Sigstore Cosign container against your configured container image. Cosign validates the cryptographic signature attached to the OCI image artifact in the registry against your trusted public key. If the signature is absent, invalid, or corrupted, the security operations team is immediately notified via Slack.

    ## Architecture diagram
    ```mermaid
    flowchart TD
      A[periodic_schedule Schedule Trigger] --> B[verify_signature Cosign Shell Commands]
      B --> C{Exit Code != 0?}
      C -- Yes --> D[notify_security_team Slack Webhook]
      C -- No --> E[Signature Verified Valid]
    ```

    ## Prerequisites
    - Network access to container registries (GHCR, Docker Hub, ECR, GCR, GAR).
    - Secrets `COSIGN_PUBLIC_KEY` and `SLACK_WEBHOOK_URL` configured in Kestra.

    ## Quick start
    1. Import the blueprint under the `company.team` namespace.
    2. Configure `container_image` input.
    3. Run manually to verify image signature.

    ## Links
    - [Sigstore Cosign Documentation](https://docs.sigstore.dev/cosign/overview/)
    - [Kestra Shell Plugin](https://kestra.io/plugins/plugin-scripts)
  tags:
    - Infrastructure
  subTags:
    - Day 2 Operations
    - Monitoring & Alerting
    - Security
  ee: false
  demo: false
