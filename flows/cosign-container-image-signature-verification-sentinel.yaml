id: cosign-container-image-signature-verification-sentinel
namespace: company.security

inputs:
  - id: container_image
    type: STRING
    description: "Full container image reference to verify (e.g. ghcr.io/myorg/api:v1.2.3)."

tasks:
  - id: verify_signature
    type: io.kestra.plugin.scripts.shell.Commands
    containerImage: gcr.io/projectsigstore/cosign:latest
    commands:
      - |
        # Verify container image signature using Sigstore Cosign
        cosign verify --key "{{ secret('COSIGN_PUBLIC_KEY') }}" "{{ inputs.container_image }}" > /tmp/cosign_telemetry.json 2>&1
        VERIFY_CODE=$?
        
        echo "::set-output name=exit_code::$VERIFY_CODE::"

  - id: evaluate_signature
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.verify_signature.vars.exit_code | int != 0 }}"
    then:
      - id: notify_security_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#security-ops",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 Cosign Container Signature Verification FAILED Alert",
                "text": "Container image `{{ inputs.container_image }}` failed Sigstore Cosign cryptographic signature verification! Image may be unsigned, tampered with, or produced by an unauthorized build pipeline.",
                "footer": "Kestra Security Sentinel • Sigstore Cosign"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#security-ops",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ Cosign Sentinel Failure",
            "text": "Failed to execute Cosign verification. Verify public key and container registry access.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 6 * * *"
    disabled: true

extend:
  title: Sigstore Cosign Container Supply Chain Signature Verification Sentinel
  shortDescription: Verifies cryptographic container image signatures via Sigstore Cosign to prevent untrusted supply chain tampering.
  description: |
    ## How it works
    This workflow runs the Sigstore Cosign official container (`projectsigstore/cosign:latest`) to cryptographically verify digital signatures on production container images. Supply chain attacks compromise build systems or inject malicious dependencies into container registries. By verifying ECDSA public key signatures against container digests stored in the registry, this workflow guarantees that only authentic, certified binaries built by verified CI pipelines are admitted into production environments.

    ## What you get
    - Cryptographic verification of container software supply chain integrity.
    - Prevents unauthorized or tampered container binaries from entering production.
    - Automated compliance auditing against organizational supply chain standards.

    ## Who it's for
    - DevSecOps Engineers and Software Supply Chain Security Specialists.
    - Kubernetes Administrators enforcing zero-trust admission control.

    ## Why orchestrate this with Kestra
    - **Containerized Verification**: Executes cosign commands directly in container tasks without host setups.
    - **Pre-Deployment Gate**: Easily chain this blueprint before Kubernetes rollout flows.
    - **Instant Team Escalation**: Delivers notifications immediately when unverified images are discovered.

    ## Prerequisites
    - Container registry access and Cosign public key.
    - Secrets `COSIGN_PUBLIC_KEY` and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import the blueprint.
    2. Input target container image reference.
    3. Run the workflow to verify cryptographic signature.

    ## How to extend
    - Verify attestations such as SLSA provenance or SBOMs via `cosign verify-attestation`.
    - Automatically delete unsigned container images from staging registries.

    ## Links
    - [Sigstore Cosign Documentation](https://docs.sigstore.dev/cosign/overview/)
    - [Kestra Documentation](https://kestra.io/docs)
  tags:
    - Infrastructure
    - Cloud
  ee: false
  demo: false
