id: qdrant-memory-pressure-unindexed-filter-sentinel
namespace: company.ai

inputs:
  - id: qdrant_host
    type: STRING
    defaults: "qdrant.internal"
    description: Hostname or IP of the Qdrant vector database instance.
  - id: qdrant_port
    type: INT
    defaults: 6333
    description: HTTP API port for Qdrant.
  - id: collection_name
    type: STRING
    description: Name of the vector collection to audit.

tasks:
  - id: inspect_collection_status
    type: io.kestra.plugin.scripts.shell.Commands
    commands:
      - |
        # Query Qdrant collection detailed info
        curl -s -f "http://{{ inputs.qdrant_host }}:{{ inputs.qdrant_port }}/collections/{{ inputs.collection_name }}" > /tmp/qdrant_telemetry.json
        
        STATUS=$(jq -r '.result.status // "unknown"' /tmp/qdrant_telemetry.json)
        VECTORS_COUNT=$(jq '.result.vectors_count // 0' /tmp/qdrant_telemetry.json)
        INDEXED_COUNT=$(jq '.result.indexed_vectors_count // 0' /tmp/qdrant_telemetry.json)
        
        echo "::set-output name=status::$STATUS::"
        echo "::set-output name=vectors_count::$VECTORS_COUNT::"
        echo "::set-output name=indexed_count::$INDEXED_COUNT::"

  - id: evaluate_collection_health
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.inspect_collection_status.vars.status != 'green' and outputs.inspect_collection_status.vars.status != 'yellow' }}"
    then:
      - id: notify_ai_engineering
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#ai-platform",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 Qdrant Vector Collection Degraded Alert",
                "text": "Qdrant Collection `{{ inputs.collection_name }}` at `{{ inputs.qdrant_host }}` reported abnormal status *{{ outputs.inspect_collection_status.vars.status }}*! Vector count: *{{ outputs.inspect_collection_status.vars.vectors_count }}*, Indexed: *{{ outputs.inspect_collection_status.vars.indexed_count }}*. HNSW indexing may be stalled or memory limits reached.",
                "footer": "Kestra AI Sentinel • Qdrant"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#ai-platform",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ Qdrant Sentinel Failure",
            "text": "Failed to connect to Qdrant vector database HTTP API. Verify hostname and port reachability.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  title: Qdrant Vector Database Memory Pressure and Collection Health Sentinel
  shortDescription: Monitors Qdrant vector database memory consumption and collection indexing status to prevent vector search degradation.
  description: |
    ## How it works
    This workflow connects directly to the Qdrant REST API (`/collections/{collection_name}`) to audit the operational health, vector point volume, and HNSW graph indexing state of high-dimensional vector embeddings. In RAG (Retrieval-Augmented Generation) and semantic search architectures, when collections run low on RAM or background HNSW indexing threads lag behind incoming upserts, vector query latency degrades dramatically or falls back to brute-force flat searches. This workflow checks the collection status and alerts AI infrastructure teams immediately if degradation occurs.

    ## What you get
    - Continuous validation of Qdrant vector collection health and indexing readiness.
    - Prevents sudden latency spikes and query timeouts in LLM retrieval pipelines.
    - Actionable visibility into vector count and indexing progress.

    ## Who it's for
    - AI Infrastructure Engineers and MLOps Teams operating vector search engines.
    - Software Architects managing production RAG pipelines and semantic search services.

    ## Why orchestrate this with Kestra
    - **Native AI Stack Orchestration**: Monitor vector databases alongside embedding ingestion and fine-tuning flows.
    - **Zero External Agents**: Interacts directly with standard REST endpoints using lightweight shell commands.
    - **Proactive Incident Prevention**: Catch collection indexing stalls before user queries fail.

    ## Prerequisites
    - Running Qdrant vector database instance with HTTP API accessible.
    - Secret `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import the blueprint.
    2. Enter Qdrant host, port, and collection name.
    3. Run the workflow to inspect collection indexing state.

    ## How to extend
    - Trigger an automatic index optimization call (`POST /collections/{collection_name}/index`) when unindexed vectors accumulate.
    - Correlate with Qdrant `/telemetry` memory usage statistics.

    ## Links
    - [Qdrant Collections API Documentation](https://qdrant.tech/documentation/concepts/collections/)
    - [Kestra Documentation](https://kestra.io/docs)
  tags:
    - AI
    - Data
  ee: false
  demo: false
