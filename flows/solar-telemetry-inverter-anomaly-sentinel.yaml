    description: JSON array containing string/central inverter electrical and thermal telemetry.

tasks:
  - id: stage_telemetry_data
    type: io.kestra.plugin.scripts.python.Script
    description: Parse and stage inverter telemetry and environmental weather metrics into CSV tables for DuckDB analysis.
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      containerImage: python:3.11-slim
    inputFiles:
      inverters_raw.json: "{{ inputs.inverter_telemetry_batch | toJson }}"
      weather_raw.json: "{{ inputs.weather_sensor_data | toJson }}"
    outputFiles:
      - inverters.csv
      - weather.csv
    env:
      INJECT_ANOMALIES: "{{ inputs.inject_anomalies }}"
    script: |
      import json
      import csv
      import os

      inject_anomalies = os.environ.get("INJECT_ANOMALIES", "true").lower() in ("true", "1", "yes")

      with open("inverters_raw.json", "r", encoding="utf-8") as f:
          inverters = json.load(f)

      with open("weather_raw.json", "r", encoding="utf-8") as f:
          weather = json.load(f)

      # If simulating clean baseline, normalize all units to nominal operating values
      if not inject_anomalies:
          clean_inverters = []
          for inv in inverters:
              clean_inv = dict(inv)
              clean_inv["dc_voltage_v"] = 755.0
              clean_inv["dc_current_a"] = 1645.0
              clean_inv["dc_power_kw"] = 1242.0
              clean_inv["ac_power_kw"] = 1218.0
              clean_inv["internal_temp_c"] = 48.0
              clean_inverters.append(clean_inv)
          inverters = clean_inverters

      with open("inverters.csv", "w", newline="", encoding="utf-8") as f:
          writer = csv.DictWriter(f, fieldnames=list(inverters[0].keys()))
          writer.writeheader()
          writer.writerows(inverters)

      with open("weather.csv", "w", newline="", encoding="utf-8") as f:
          writer = csv.DictWriter(f, fieldnames=list(weather[0].keys()))
          writer.writeheader()
          writer.writerows(weather)

      print(f"Staged {len(inverters)} inverter records and {len(weather)} weather records (inject_anomalies={inject_anomalies}).")

  - id: compute_inverter_analytics
    type: io.kestra.plugin.jdbc.duckdb.Query
    description: Execute DuckDB SQL analytics to compute temperature-adjusted expected yield, peer fleet baselines, anomaly classifications, and hourly revenue leakage.
    inputFiles:
      inverters.csv: "{{ outputs.stage_telemetry_data.outputFiles['inverters.csv'] }}"
      weather.csv: "{{ outputs.stage_telemetry_data.outputFiles['weather.csv'] }}"
    outputFiles:
      - inverter_performance_analysis.csv
    sql: |
      COPY (
        WITH raw_telemetry AS (
          SELECT
            inv.inverter_id,
            inv.plant_id,
            inv.zone,
            inv.rated_capacity_kw,
            inv.dc_voltage_v,
            inv.dc_current_a,
            inv.dc_power_kw,
            inv.ac_power_kw,
            inv.internal_temp_c,
            met.poa_irradiance_w_m2,
            met.ambient_temp_c,
            ROUND(CASE WHEN inv.dc_power_kw > 0 THEN (inv.ac_power_kw / inv.dc_power_kw) * 100.0 ELSE 0.0 END, 2) AS conversion_efficiency_pct,
            -- Expected AC power output under current POA irradiance with PV cell temperature coefficient (-0.35%/C above 25C STC)
            ROUND(inv.rated_capacity_kw * (met.poa_irradiance_w_m2 / 1000.0) * (1.0 - (0.0035 * GREATEST(0.0, met.ambient_temp_c - 25.0))), 2) AS expected_power_kw
          FROM read_csv_auto('inverters.csv') inv
          CROSS JOIN read_csv_auto('weather.csv') met
        ),
        performance_calculations AS (
          SELECT
            *,
            -- Generation deficit percentage compared to temperature-compensated expected power
            ROUND(CASE
              WHEN expected_power_kw > 0
              THEN ((expected_power_kw - ac_power_kw) / expected_power_kw) * 100.0
              ELSE 0.0
            END, 2) AS expected_deficit_pct
          FROM raw_telemetry
        ),
        classified_anomalies AS (
          SELECT
            inverter_id,
            plant_id,
            zone,
            poa_irradiance_w_m2,
            rated_capacity_kw,
            dc_voltage_v,
            dc_current_a,
            dc_power_kw,
            ac_power_kw,
            internal_temp_c,
            conversion_efficiency_pct,
            expected_power_kw,
            expected_deficit_pct,
            CASE
              -- 1. Complete zero-output trip / breaker open during full daylight
              WHEN poa_irradiance_w_m2 >= {{ inputs.irradiance_threshold_w_m2 }} AND ac_power_kw <= 5.0
                THEN 'INVERTER_TRIP_OFFLINE'
              -- 2. Thermal Derating: Heatsink core temperature exceeding threshold with generation drop or severe efficiency throttling
              WHEN internal_temp_c >= {{ inputs.temp_derate_threshold_c }} AND (conversion_efficiency_pct < 85.0 OR expected_deficit_pct >= 15.0)
                THEN 'THERMAL_DERATING'
              -- 3. MPPT Tracking Fault: Abnormal low DC voltage under load
              WHEN dc_voltage_v < 550.0 AND expected_deficit_pct >= 20.0
                THEN 'MPPT_TRACKER_FAULT'
              -- 4. Soiling / Module Degradation: Normal efficiency, but output deficit exceeds threshold
              WHEN expected_deficit_pct >= {{ inputs.soiling_deficit_threshold_pct }} AND conversion_efficiency_pct >= 95.0
                THEN 'SOILING_DEGRADATION'
              ELSE 'NOMINAL'
            END AS anomaly_classification,
            CASE
              WHEN poa_irradiance_w_m2 >= {{ inputs.irradiance_threshold_w_m2 }} AND ac_power_kw <= 5.0 THEN 'CRITICAL'
              WHEN internal_temp_c >= {{ inputs.temp_derate_threshold_c }} AND (conversion_efficiency_pct < 85.0 OR expected_deficit_pct >= 15.0) THEN 'HIGH'
              WHEN dc_voltage_v < 550.0 AND expected_deficit_pct >= 20.0 THEN 'HIGH'
              WHEN expected_deficit_pct >= {{ inputs.soiling_deficit_threshold_pct }} AND conversion_efficiency_pct >= 95.0 THEN 'MEDIUM'
              ELSE 'INFO'
            END AS severity_level,
            -- Lost generation energy in 1 hour (kWh)
            ROUND(GREATEST(0.0, expected_power_kw - ac_power_kw), 2) AS lost_energy_kwh_1h,
            -- Estimated revenue loss in USD for this hour based on PPA tariff
            ROUND(GREATEST(0.0, expected_power_kw - ac_power_kw) * ({{ inputs.ppa_energy_tariff_usd_mwh }} / 1000.0), 2) AS revenue_loss_usd_1h,
            CASE
              WHEN poa_irradiance_w_m2 >= {{ inputs.irradiance_threshold_w_m2 }} AND ac_power_kw <= 5.0
                THEN 'Inverter zero-output trip under ' || CAST(ROUND(poa_irradiance_w_m2, 0) AS VARCHAR) || ' W/m2 irradiance. Inspect AC breaker, DC contactors, and protection relays.'
              WHEN internal_temp_c >= {{ inputs.temp_derate_threshold_c }} AND (conversion_efficiency_pct < 85.0 OR expected_deficit_pct >= 15.0)
                THEN 'Core IGBT temperature (' || CAST(ROUND(internal_temp_c, 1) AS VARCHAR) || ' C) exceeds ' || CAST({{ inputs.temp_derate_threshold_c }} AS VARCHAR) || ' C limit. Clean heatsink dust filters and check cooling fan operation.'
              WHEN dc_voltage_v < 550.0 AND expected_deficit_pct >= 20.0
                THEN 'Abnormal DC string voltage (' || CAST(ROUND(dc_voltage_v, 1) AS VARCHAR) || ' V). Inspect combiner box string fuses and check for blown diodes or disconnected strings.'
              WHEN expected_deficit_pct >= {{ inputs.soiling_deficit_threshold_pct }} AND conversion_efficiency_pct >= 95.0
                THEN 'Generation is ' || CAST(ROUND(expected_deficit_pct, 1) AS VARCHAR) || '% below expected yield despite nominal conversion efficiency. Schedule robotic or manual module washing.'
              ELSE 'Operating within nominal operating parameters.'
            END AS recommended_action
          FROM performance_calculations
        )
        SELECT * FROM classified_anomalies ORDER BY lost_energy_kwh_1h DESC
      ) TO 'inverter_performance_analysis.csv' (HEADER, DELIMITER ',');

  - id: generate_work_orders_and_report
    type: io.kestra.plugin.scripts.python.Script
    description: Split analyzed telemetry into actionable CMMS work order tickets, build executive Markdown health report, and emit structured Kestra metrics.
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      containerImage: python:3.11-slim
    inputFiles:
      inverter_performance_analysis.csv: "{{ outputs.compute_inverter_analytics.outputFiles['inverter_performance_analysis.csv'] }}"
    outputFiles:
      - priority_maintenance_tickets.csv
      - nominal_inverters_report.csv
      - fleet_summary_metrics.json
      - solar_fleet_health_report.md
    script: |
      import csv
      import json

      with open("inverter_performance_analysis.csv", "r", encoding="utf-8") as f:
          reader = list(csv.DictReader(f))

      tickets = []
      nominal = []
      total_inverters = len(reader)
      critical_trips = 0
      high_anomalies = 0
      medium_anomalies = 0
      total_lost_kwh = 0.0
      total_revenue_loss_usd = 0.0

      for row in reader:
          classification = row.get("anomaly_classification")
          severity = row.get("severity_level")
          lost_kwh = float(row.get("lost_energy_kwh_1h", 0.0))
          loss_usd = float(row.get("revenue_loss_usd_1h", 0.0))

          if classification != "NOMINAL":
              tickets.append(row)
              total_lost_kwh += lost_kwh
              total_revenue_loss_usd += loss_usd
              if severity == "CRITICAL":
                  critical_trips += 1
              elif severity == "HIGH":
                  high_anomalies += 1
              elif severity == "MEDIUM":
                  medium_anomalies += 1
          else:
              nominal.append(row)

      # 1. Write priority maintenance tickets
      ticket_fieldnames = [
          "inverter_id", "plant_id", "zone", "severity_level",
          "anomaly_classification", "lost_energy_kwh_1h", "revenue_loss_usd_1h",
          "internal_temp_c", "dc_voltage_v", "ac_power_kw", "expected_power_kw", "recommended_action"
      ]
      with open("priority_maintenance_tickets.csv", "w", newline="", encoding="utf-8") as f:
          writer = csv.DictWriter(f, fieldnames=ticket_fieldnames, extrasaction="ignore")
          writer.writeheader()
          writer.writerows(tickets)

      # 2. Write nominal units
      with open("nominal_inverters_report.csv", "w", newline="", encoding="utf-8") as f:
          if nominal:
              writer = csv.DictWriter(f, fieldnames=list(nominal[0].keys()))
              writer.writeheader()
              writer.writerows(nominal)
          else:
              f.write("inverter_id,plant_id,zone,status\n")

      # 3. Write JSON metrics
      metrics = {
          "total_inverters": total_inverters,
          "nominal_inverters": len(nominal),
          "anomalies_detected": len(tickets),
          "critical_trips": critical_trips,
          "high_anomalies": high_anomalies,
          "medium_anomalies": medium_anomalies,
          "total_lost_energy_kwh_1h": round(total_lost_kwh, 2),
          "total_revenue_loss_usd_1h": round(total_revenue_loss_usd, 2),
          "projected_daily_revenue_loss_usd": round(total_revenue_loss_usd * 24.0, 2)
      }
      with open("fleet_summary_metrics.json", "w", encoding="utf-8") as f:
          json.dump(metrics, f, indent=2)

      # 4. Generate Executive Markdown Audit Report
      md = []
      md.append("# ☀️ Solar Fleet Telemetry & Inverter Health Audit Report")
      md.append(f"**Plant ID:** `SOLARIA-01` | **Status:** {'⚠️ ACTION REQUIRED' if tickets else '✅ FLEET NOMINAL'}\n")
      md.append("## Executive Fleet Summary\n")
      md.append("| Metric | Value |")
      md.append("| :--- | :--- |")
      md.append(f"| **Total Monitored Inverters** | `{total_inverters}` |")
      md.append(f"| **Nominal Inverters** | `{len(nominal)}` |")
      md.append(f"| **Anomalous Inverters** | `{len(tickets)}` |")
      md.append(f"| **Critical Breaker Trips** | `{critical_trips}` |")
      md.append(f"| **Hourly Generation Deficit** | `{total_lost_kwh:,.2f} kWh` |")
      md.append(f"| **Hourly Revenue Loss** | `${total_revenue_loss_usd:,.2f} USD` |")
      md.append(f"| **Projected 24h Revenue Exposure** | `${total_revenue_loss_usd * 24.0:,.2f} USD` |\n")

      if tickets:
          md.append("## Priority Maintenance Tickets\n")
          md.append("| Inverter ID | Severity | Fault Classification | Actual / Expected kW | Deficit (kWh) | Revenue Loss (1h) | Recommended Field Action |")
          md.append("| :--- | :--- | :--- | :--- | :--- | :--- | :--- |")
          for t in tickets:
              actual_exp = f"{float(t['ac_power_kw']):,.0f} / {float(t['expected_power_kw']):,.0f}"
              md.append(f"| **{t['inverter_id']}** | `{t['severity_level']}` | `{t['anomaly_classification']}` | {actual_exp} | `{float(t['lost_energy_kwh_1h']):,.1f}` | `${float(t['revenue_loss_usd_1h']):,.2f}` | {t['recommended_action']} |")
      else:
          md.append("## Fleet Status\n")
          md.append("All inverters are performing within expected temperature-compensated irradiance baselines. No work orders required.")

      with open("solar_fleet_health_report.md", "w", encoding="utf-8") as f:
          f.write("\n".join(md))

      # 5. Emit Kestra outputs
      print(f"::{{'outputs': {json.dumps(metrics)}}}::")

  - id: expose_fleet_metrics
    type: io.kestra.plugin.core.output.OutputValues
    description: Expose key generation and revenue risk metrics to Kestra execution outputs and downstream monitoring.
    values:
      total_inverters: "{{ outputs.generate_work_orders_and_report.total_inverters }}"
      nominal_inverters: "{{ outputs.generate_work_orders_and_report.nominal_inverters }}"
      anomalies_detected: "{{ outputs.generate_work_orders_and_report.anomalies_detected }}"
      critical_trips: "{{ outputs.generate_work_orders_and_report.critical_trips }}"
      total_lost_energy_kwh_1h: "{{ outputs.generate_work_orders_and_report.total_lost_energy_kwh_1h }}"
      total_revenue_loss_usd_1h: "{{ outputs.generate_work_orders_and_report.total_revenue_loss_usd_1h }}"
      projected_daily_revenue_loss_usd: "{{ outputs.generate_work_orders_and_report.projected_daily_revenue_loss_usd }}"

  - id: route_incident_escalation
    type: io.kestra.plugin.core.flow.If
    description: Branch on detected anomalies. Escalate maintenance dispatch, optional AI root-cause analysis, and notification alerts when faults exist.
    condition: "{{ outputs.expose_fleet_metrics.values.anomalies_detected > 0 }}"
    then:
      - id: log_anomaly_alert
        type: io.kestra.plugin.core.log.Log
        message: >
          [INCIDENT ESCALATION] {{ outputs.expose_fleet_metrics.values.anomalies_detected }} solar inverters flagged with performance anomalies.
          Critical Trips: {{ outputs.expose_fleet_metrics.values.critical_trips }} | Hourly Revenue Loss: ${{ outputs.expose_fleet_metrics.values.total_revenue_loss_usd_1h }} USD.

      - id: check_slack_notification_enabled
        type: io.kestra.plugin.core.flow.If
        description: Dispatch Slack incident alert card when send_slack_alert input is true.
        condition: "{{ inputs.send_slack_alert }}"
        then:
          - id: send_slack_incident_alert
            type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
            url: "{{ secret('SLACK_WEBHOOK_URL') }}"
            payload: |
              {
                "channel": "#solar-operations-center",
                "text": "⚠️ *Solar PV Fleet Incident Alert - Plant SOLARIA-01*",
                "attachments": [
                  {
                    "color": "#D32F2F",
                    "fields": [
                      {"title": "Anomalies Detected", "value": "{{ outputs.expose_fleet_metrics.values.anomalies_detected }}", "short": true},
                      {"title": "Critical Trips", "value": "{{ outputs.expose_fleet_metrics.values.critical_trips }}", "short": true},
                      {"title": "Hourly Generation Loss", "value": "{{ outputs.expose_fleet_metrics.values.total_lost_energy_kwh_1h }} kWh", "short": true},
                      {"title": "Hourly Revenue Leakage", "value": "${{ outputs.expose_fleet_metrics.values.total_revenue_loss_usd_1h }} USD", "short": true}
                    ],
                    "footer": "Kestra Solar Telemetry Sentinel"
                  }
                ]
              }

      - id: check_cmms_dispatch_enabled
        type: io.kestra.plugin.core.flow.If
        description: Automatically dispatch priority work orders to field engineering CMMS when dispatch_work_order input is true.
        condition: "{{ inputs.dispatch_work_order }}"
        then:
          - id: log_cmms_dispatch
            type: io.kestra.plugin.core.log.Log
            message: "Dispatched priority work orders from priority_maintenance_tickets.csv to CMMS operations endpoint."

      - id: check_ai_diagnostics_enabled
        type: io.kestra.plugin.core.flow.If
        description: Invoke Google Gemini to synthesize root-cause diagnostics and technician field safety instructions.
        condition: "{{ inputs.enable_ai_diagnostics }}"
        then:
          - id: generate_ai_field_troubleshooting_guide
            type: io.kestra.plugin.ai.completion.ChatCompletion
            apiKey: "{{ secret('GEMINI_API_KEY') }}"
            modelName: "{{ inputs.model_name }}"
            messages:
              - role: system
                content: You are a senior solar PV field operations and electrical engineering specialist. Analyze inverter telemetry faults and write clear, concise step-by-step troubleshooting instructions for field technicians.
              - role: user
                content: |
                  Review the following flagged solar inverter telemetry tickets from Plant SOLARIA-01:
                  {{ outputs.generate_work_orders_and_report.outputFiles['priority_maintenance_tickets.csv'] }}

                  Please provide:
                  1. Root-cause diagnosis for each flagged inverter (Trip, Thermal Derating, MPPT Fault, Soiling).
                  2. Priority sequence for field technician dispatch based on revenue leakage.
                  3. Key electrical safety precautions (DC lock-out / tag-out, thermal cooling times).

          - id: save_ai_diagnostics_guide
            type: io.kestra.plugin.core.storage.Write
            content: "{{ outputs.generate_ai_field_troubleshooting_guide.choices[0].message.content }}"
            fileName: ai_field_troubleshooting_guide.md

    else:
      - id: log_fleet_nominal
        type: io.kestra.plugin.core.log.Log
        message: "All {{ outputs.expose_fleet_metrics.values.total_inverters }} monitored inverters operating nominally within expected irradiance baselines."

extend:
  title: Solar Telemetry Inverter Anomaly Sentinel and Maintenance Dispatch
  metaTitle: Solar PV Inverter Anomaly Sentinel & Maintenance Dispatch | Kestra
  shortDescription: Ingest solar PV SCADA telemetry, detect inverter clipping and soiling anomalies via DuckDB, and trigger maintenance escalation.
  metaDescription: Automate solar PV inverter degradation and soiling anomaly detection using DuckDB SQL, generate maintenance work orders, and trigger AI/Slack escalation.
  description: |
    Automate solar photovoltaic (PV) generation fleet monitoring and predictive maintenance escalation.
    This workflow ingests inverter electrical telemetry (DC voltage, current, AC power, core temperature)
    and environmental weather station readings (Plane of Array irradiance, ambient temperature),
    computes temperature-corrected expected power output and peer-fleet baselines using DuckDB SQL,
    and isolates four high-impact solar generation failure modes:

    1. **Inverter Trip / Disconnect (`INVERTER_TRIP_OFFLINE`)**: Inverter producing zero or negligible power (< 5 kW) despite high daylight irradiance (> 100 W/m2).
    2. **Thermal Derating (`THERMAL_DERATING`)**: IGBT heatsink temperature exceeding 65°C, causing automated inverter curtailment and output loss.
    3. **MPPT String Fault (`MPPT_TRACKER_FAULT`)**: Abnormal DC string voltage (< 550V compared to nominal ~750V) signaling blown combiner fuses or disconnected strings.
    4. **Soiling Degradation (`SOILING_DEGRADATION`)**: Efficiency is normal (> 95%), but string output is consistently 15%+ below expected yield, indicating module dust or soiling buildup.

    ## Key Features

    - **Zero-Credential Default Run**: Built-in 6-inverter SCADA test fleet and weather sensor dataset allows immediate one-click execution without any API keys or external services.
    - **In-Memory Analytical Engine**: Fast vector processing using Kestra's DuckDB plugin (`io.kestra.plugin.jdbc.duckdb.Query`) with expected yield temperature coefficient baselining (`rated_capacity_kw * (poa / 1000) * (1 - 0.0035 * deltaT)`).
    - **Financial Risk Quantification**: Calculates hourly energy deficit ($kWh$) and revenue leakage ($USD$) based on contract PPA rates ($/MWh).
    - **Actionable Outputs**: Automatically produces `priority_maintenance_tickets.csv`, `nominal_inverters_report.csv`, `fleet_summary_metrics.json`, and an executive Markdown audit table (`solar_fleet_health_report.md`).
    - **Modular Incident Escalation**: Flowable routing (`If`) triggers optional CMMS maintenance dispatch, Slack operational alerts, and Google Gemini AI troubleshooting guidance (`ai_field_troubleshooting_guide.md`).

    ## How it works

    1. `stage_telemetry_data` (`io.kestra.plugin.scripts.python.Script`) stages raw telemetry and environmental sensor arrays into normalized CSV tables. If `inject_anomalies` is `false`, it normalizes all records to simulate a clean 100% nominal baseline fleet.
    2. `compute_inverter_analytics` (`io.kestra.plugin.jdbc.duckdb.Query`) joins weather metrics with inverter electrical data, applies PV cell temperature derating coefficients, calculates generation deficits, classifies faults, and calculates revenue loss.
    3. `generate_work_orders_and_report` (`io.kestra.plugin.scripts.python.Script`) segregates records into `priority_maintenance_tickets.csv` and `nominal_inverters_report.csv`, writes `fleet_summary_metrics.json`, compiles `solar_fleet_health_report.md`, and emits structured metrics via Kestra output protocol.
    4. `expose_fleet_metrics` (`io.kestra.plugin.core.output.OutputValues`) exposes key generation and revenue risk metrics to Kestra execution outputs.
    5. `route_incident_escalation` (`io.kestra.plugin.core.flow.If`) branches on `anomalies_detected > 0`:
       - Dispatches Slack alert card if `send_slack_alert: true`.
       - Logs CMMS dispatch confirmation if `dispatch_work_order: true`.
       - Calls Google Gemini (`io.kestra.plugin.ai.completion.ChatCompletion`) to generate a field technician troubleshooting guide if `enable_ai_diagnostics: true`.

    ## What you get

    - **Priority Maintenance Tickets** (`{{ outputs.generate_work_orders_and_report.outputFiles['priority_maintenance_tickets.csv'] }}`): Formatted work orders ready for CMMS import with exact fault classification, revenue loss, and recommended field action.
    - **Executive Fleet Health Report** (`{{ outputs.generate_work_orders_and_report.outputFiles['solar_fleet_health_report.md'] }}`): Formatted Markdown summary tables for plant managers and operations reviews.
    - **Structured Execution Metrics** (`{{ outputs.expose_fleet_metrics.values }}`): `total_inverters`, `anomalies_detected`, `critical_trips`, `total_lost_energy_kwh_1h`, and `total_revenue_loss_usd_1h`.
    - **Optional AI Technician Guide** (`{{ outputs.save_ai_diagnostics_guide.uri }}`): Generated when `enable_ai_diagnostics` is set to `true`.

    ## Who it's for

    - Solar Plant Operations and Asset Managers overseeing commercial and utility-scale PV generation.
    - Renewable Energy Data Engineers building automated SCADA monitoring pipelines.
    - Field Maintenance Engineers looking for automated ticket triage and root-cause dispatch.

    ## Prerequisites

    - **Default dry-run mode requires zero external credentials or services.** Click **Execute** immediately with the built-in datasets.
    - To enable optional integrations, configure the corresponding namespace secrets:

    ### Secrets

    - `SOLAR_WEBHOOK_KEY`: Authentication key for the `scada_telemetry_webhook` trigger.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL (required only when `send_slack_alert` is set to `true`).
    - `GEMINI_API_KEY`: Google Gemini API key (required only when `enable_ai_diagnostics` is set to `true`).
    - `CMMS_API_KEY`: Maintenance management system API key (required only when `dispatch_work_order` is set to `true`).

    ## Quick start

    1. Click **Execute** with default inputs (`inject_anomalies: true`) to run the 6-inverter analysis.
    2. Open the **Outputs** tab to review `priority_maintenance_tickets.csv` (4 anomalous inverters, $139.64/hr revenue leakage) and `solar_fleet_health_report.md`.
    3. Re-run with `inject_anomalies: false` to verify the nominal fleet branch where 100% of inverters pass without work orders.
    4. Optionally set `send_slack_alert: true` or `enable_ai_diagnostics: true` with your secrets to test operational escalation.

