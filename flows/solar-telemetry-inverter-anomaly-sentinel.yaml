id: solar-telemetry-inverter-anomaly-sentinel
namespace: company.energy

description: |
  Ingest utility and commercial solar photovoltaic (PV) SCADA telemetry, calculate
  plane-of-array (POA) temperature-corrected performance baselines using DuckDB SQL,
  detect thermal derating, string MPPT faults, soiling, and offline inverter trips,
  generate prioritized CMMS work orders, and route incidents through optional AI
  technician triage and Slack alerts.

triggers:
  - id: hourly_telemetry_sweep
    type: io.kestra.plugin.core.trigger.Schedule
    description: Hourly SCADA telemetry reconciliation sweep during generation daylight hours. Shipped disabled by default.
    cron: "0 6-19 * * *"
    disabled: true

  - id: scada_telemetry_webhook
    type: io.kestra.plugin.core.trigger.Webhook
    description: Webhook trigger for event-driven IoT edge gateways or plant SCADA batch payloads.
    key: "{{ secret('SOLAR_WEBHOOK_KEY') }}"

inputs:
  - id: inject_anomalies
    type: BOOL
    defaults: true
    description: When true, evaluates the full 6-inverter demo fleet including 4 realistic operational faults (trip, thermal derating, soiling, MPPT fault). Set to false to simulate a 100% healthy baseline fleet.

  - id: irradiance_threshold_w_m2
    type: FLOAT
    defaults: 100.0
    description: Minimum plane-of-array (POA) solar irradiance in W/m2 required to evaluate generation performance (filters low-light dawn/dusk transients).

  - id: soiling_deficit_threshold_pct
    type: FLOAT
    defaults: 15.0
    description: Efficiency deficit percentage below the expected yield before flagging panel soiling and module washing requirements.

  - id: temp_derate_threshold_c
    type: FLOAT
    defaults: 65.0
    description: Core IGBT/heatsink internal temperature in Celsius triggering thermal curtailment warnings.

  - id: ppa_energy_tariff_usd_mwh
    type: FLOAT
    defaults: 65.0
    description: Power Purchase Agreement (PPA) energy export rate in USD per MWh used to quantify hourly revenue leakage.

  - id: send_slack_alert
    type: BOOL
    defaults: false
    description: Enable optional Slack notification to the Solar Operations Center channel when critical or high anomalies are detected (requires SLACK_WEBHOOK_URL secret).

  - id: dispatch_work_order
    type: BOOL
    defaults: false
    description: Automatically dispatch prioritized maintenance tickets to the field engineering CMMS API endpoint (requires CMMS_API_KEY secret).

  - id: enable_ai_diagnostics
    type: BOOL
    defaults: false
    description: Enable Google Gemini AI to analyze raw inverter metrics and formulate step-by-step field technician troubleshooting instructions (requires GEMINI_API_KEY secret).

  - id: model_name
    type: STRING
    defaults: gemini-2.5-flash
    description: Google Gemini model used when enable_ai_diagnostics is set to true.

  - id: weather_sensor_data
    type: JSON
    defaults: |
      [
        {
          "sensor_id": "MET-01",
          "plant_id": "SOLARIA-01",
          "timestamp": "2026-10-14T11:00:00Z",
          "poa_irradiance_w_m2": 850.0,
          "ambient_temp_c": 31.5,
          "wind_speed_m_s": 3.2
        }
      ]
    description: JSON array containing weather station metrics (Plane of Array irradiance, ambient temperature, wind speed).

  - id: inverter_telemetry_batch
    type: JSON
    defaults: |
      [
        {
          "inverter_id": "INV-01",
          "plant_id": "SOLARIA-01",
          "zone": "Zone-A",
          "dc_voltage_v": 755.0,
          "dc_current_a": 1642.0,
          "dc_power_kw": 1239.7,
          "ac_power_kw": 1215.0,
          "internal_temp_c": 48.2,
          "rated_capacity_kw": 1250.0
        },
        {
          "inverter_id": "INV-02",
          "plant_id": "SOLARIA-01",
          "zone": "Zone-A",
          "dc_voltage_v": 810.0,
          "dc_current_a": 0.0,
          "dc_power_kw": 0.0,
          "ac_power_kw": 0.0,
          "internal_temp_c": 28.1,
          "rated_capacity_kw": 1250.0
        },
        {
