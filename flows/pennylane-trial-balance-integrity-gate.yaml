id: pennylane-trial-balance-integrity-gate
namespace: company.team

description: |
  Fetch a Pennylane trial balance for an accounting period, sum debits against credits, alert
  Slack when they do not balance within a tolerance, and log a governance audit trail either
  way. Read-only: this flow never writes to Pennylane.

inputs:
  - id: period_start
    type: STRING
    displayName: Period start
    description: Start of the accounting period, YYYY-MM-DD.
    defaults: "2026-01-01"

  - id: period_end
    type: STRING
    displayName: Period end
    description: End of the accounting period, YYYY-MM-DD.
    defaults: "2026-01-31"

  - id: max_imbalance
    type: FLOAT
    displayName: Max allowed imbalance
    description: Absolute difference between total debits and total credits above which the trial balance is reported out of balance, in the company's currency unit. A small nonzero value absorbs rounding.
    defaults: 0.01

  - id: max_records
    type: INT
    displayName: Max records
    description: Safety cap on the total number of trial balance rows retrieved across all pages. Leave generous, a real imbalance must be computed over every ledger account, not a partial page.
    defaults: 5000

tasks:
  - id: get_trial_balance
    type: io.kestra.plugin.pennylane.accounting.trialbalance.Get
    description: Read-only. Retrieves every ledger account's debits and credits for the period.
    allowFailure: true
    apiToken: "{{ secret('PENNYLANE_API_TOKEN') }}"
    periodStart: "{{ inputs.period_start }}"
    periodEnd: "{{ inputs.period_end }}"
    maxRecords: "{{ inputs.max_records }}"
    fetchType: FETCH

  - id: evaluate
    type: io.kestra.plugin.core.output.OutputValues
    description: Sums debits and credits across every returned row. A trial balance that does not net to zero within max_imbalance is a bookkeeping integrity problem, not a rounding artifact.
    values:
      account_count: "{{ (outputs.get_trial_balance is defined and outputs.get_trial_balance.count is defined) ? outputs.get_trial_balance.count : 0 }}"
      total_debits: "{{ (outputs.get_trial_balance is not defined or outputs.get_trial_balance.rows is not defined or outputs.get_trial_balance.rows is null) ? 0 : (({'rows': outputs.get_trial_balance.rows} | jq('[(.rows // [])[] | (.debits // 0 | tonumber)] | add // 0')) | first) }}"
      total_credits: "{{ (outputs.get_trial_balance is not defined or outputs.get_trial_balance.rows is not defined or outputs.get_trial_balance.rows is null) ? 0 : (({'rows': outputs.get_trial_balance.rows} | jq('[(.rows // [])[] | (.credits // 0 | tonumber)] | add // 0')) | first) }}"
      imbalance: "{{ (outputs.get_trial_balance is not defined or outputs.get_trial_balance.rows is not defined or outputs.get_trial_balance.rows is null) ? 0 : (({'rows': outputs.get_trial_balance.rows} | jq('([(.rows // [])[] | (.debits // 0 | tonumber)] | add // 0) - ([(.rows // [])[] | (.credits // 0 | tonumber)] | add // 0)')) | first) }}"
      severity: "{{ (outputs.get_trial_balance is not defined or outputs.get_trial_balance.rows is not defined or outputs.get_trial_balance.rows is null) ? 'CRITICAL' : (((({'rows': outputs.get_trial_balance.rows} | jq('(([(.rows // [])[] | (.debits // 0 | tonumber)] | add // 0) - ([(.rows // [])[] | (.credits // 0 | tonumber)] | add // 0)) | if . < 0 then -. else . end')) | first)) > inputs.max_imbalance ? 'OUT_OF_BALANCE' : 'OK') }}"

  - id: route
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.evaluate.values.severity != 'OK' }}"
    then:
      - id: alert
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {{ {'text': outputs.evaluate.values.severity ~ ': Pennylane trial balance for ' ~ inputs.period_start ~ ' to ' ~ inputs.period_end ~ ' does not balance. debits=' ~ outputs.evaluate.values.total_debits ~ ', credits=' ~ outputs.evaluate.values.total_credits ~ ', imbalance=' ~ outputs.evaluate.values.imbalance ~ ' (tolerance ' ~ inputs.max_imbalance ~ '), across ' ~ outputs.evaluate.values.account_count ~ ' account(s).'} | toJson }}
    else:
      - id: compliant
        type: io.kestra.plugin.core.log.Log
        message: "Trial balance for {{ inputs.period_start }} to {{ inputs.period_end }} balances: debits={{ outputs.evaluate.values.total_debits }}, credits={{ outputs.evaluate.values.total_credits }}, across {{ outputs.evaluate.values.account_count }} account(s)."

  - id: summary
    type: io.kestra.plugin.core.log.Log
    message: "Pennylane trial balance integrity gate complete for {{ inputs.period_start }} to {{ inputs.period_end }}: imbalance={{ outputs.evaluate.values.imbalance }}, severity {{ outputs.evaluate.values.severity }}."

errors:
  - id: alert_flow_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {{ {'text': 'Pennylane trial balance integrity gate failed (execution ' ~ execution.id ~ '). Check the logs.'} | toJson }}

triggers:
  - id: monthly
    type: io.kestra.plugin.core.trigger.Schedule
    description: Shipped disabled. Enable once PENNYLANE_API_TOKEN and SLACK_WEBHOOK_URL are set and the period inputs are mapped to a real closing cadence.
    cron: "0 6 1 * *"
    disabled: true
    inputs:
      period_start: "{{ trigger.date | dateAdd(-1, 'MONTHS') | date('yyyy-MM-01') }}"
      period_end: "{{ trigger.date | date('yyyy-MM-01') | dateAdd(-1, 'DAYS') | date('yyyy-MM-dd') }}"
      max_imbalance: 0.01
      max_records: 5000

extend:
  title: Pennylane Trial Balance Integrity Gate
  shortDescription: Fetch a Pennylane trial balance, sum debits against credits, alert Slack when the period does not balance, and log a governance audit trail.
  metaTitle: Pennylane Trial Balance Integrity Gate with Kestra
  metaDescription: Fetch a Pennylane trial balance, sum debits versus credits, alert Slack if the period does not balance, and log the result.
  description: |
    A trial balance that does not net to zero means something is wrong in the books, a missing
    entry, a sync error from an upstream integration, a manual journal entry that only hit one
    side of the ledger. Pennylane's own interface shows the trial balance on request; it does not
    page anyone when debits and credits stop matching. This blueprint fetches the trial balance
    for a period, sums both sides, and alerts the moment they diverge past a tolerance you set.

    This blueprint was created by [Mohit Jeswani](https://github.com/mohitjeswani01).

    ## How it works

    1. `get_trial_balance` (`io.kestra.plugin.pennylane.accounting.trialbalance.Get`) retrieves
       every ledger account's `debits` and `credits` for `period_start` to `period_end`, paginating
       up to `max_records`. Read-only; nothing in Pennylane is written. `allowFailure: true`
       covers an API or auth error without failing the flow outright.
    2. `evaluate` (`io.kestra.plugin.core.output.OutputValues`) sums `debits` and `credits` across
       every row with a `jq` filter (`debits`/`credits` are typed loosely by the API, so each value
       is coerced with `tonumber` before summing), and compares the absolute difference to
       `max_imbalance`. `get_trial_balance` failing outright is also `CRITICAL`.
    3. `route` (`io.kestra.plugin.core.flow.If`):
       - **compliant:** logs the totals and account count.
       - **alert:** posts the imbalance, both totals, and the account count to Slack.
    4. `summary` logs the imbalance and severity, closing the governance cycle.
    5. `errors` alerts Slack if the flow itself fails, for example an expired API token.

    ## What you get

    - A direct answer to "do the books balance for this period", computed from the same numbers
      Pennylane itself reports, not a derived estimate.
    - A tolerance you control, so routine rounding on a large ledger does not page anyone, only a
      real divergence does.
    - A read-only check with zero risk of touching a real ledger entry.

    ## Who it's for

    - Finance and accounting teams closing the books in Pennylane who want an automated sanity
      check before a period is reported as closed.
    - Teams evaluating the Pennylane plugin who want a worked example of
      `accounting.trialbalance.Get` used for a governance check rather than a data export.

    ## Why orchestrate this with Kestra

    Pennylane computes the trial balance; it does not decide a cadence, compare the two sides, or
    notify anyone when they stop matching. Kestra keeps `max_imbalance` as a flow input instead of
    a one-off spreadsheet check, turns the comparison into a Slack page naming the exact imbalance,
    and keeps a full execution history of every period checked.

    ## Prerequisites

    - A Pennylane account (or firm account) with a company or firm API token scoped
      `trial_balance:readonly`.
    - At least one closed accounting period with ledger activity, to confirm the totals are
      nonzero and actually balance.
    - A Slack incoming webhook URL.

    This flow calls the Pennylane API directly over HTTPS; there is no official local Pennylane
    emulator, so `get_trial_balance` cannot be exercised against a local Docker container. Use a
    Pennylane sandbox or test company to validate this end to end.

    ### Secrets

    - `PENNYLANE_API_TOKEN`: the company or firm API token used by `get_trial_balance`. In Kestra
      OSS, provide it as the base64-encoded environment variable `SECRET_PENNYLANE_API_TOKEN`.
    - `SLACK_WEBHOOK_URL`: used by `alert` and the `errors` block. In Kestra OSS, provide it as the
      base64-encoded environment variable `SECRET_SLACK_WEBHOOK_URL`.

    ### Inputs

    | Input | Default | Purpose |
    |---|---|---|
    | `period_start` | `2026-01-01` | Start of the accounting period |
    | `period_end` | `2026-01-31` | End of the accounting period |
    | `max_imbalance` | `0.01` | Absolute debits-minus-credits tolerance before alerting |
    | `max_records` | `5000` | Safety cap on rows retrieved across all pages |

    ### Outputs

    - `{{ outputs.get_trial_balance.rows }}`: every ledger account row (`number`,
      `formatted_number`, `label`, `debits`, `credits`).
    - `{{ outputs.evaluate.values.total_debits }}` / `.total_credits` / `.imbalance`: the computed
      sums and their signed difference.
    - `{{ outputs.evaluate.values.severity }}`: `OK`, `OUT_OF_BALANCE`, or `CRITICAL`.

    ### Pitfalls

    - `debits`/`credits` are typed loosely by the Pennylane API and may arrive as strings; the
      `jq` filter coerces every value with `tonumber` before summing. A ledger account whose
      values are not numeric strings would fail that coercion rather than being silently skipped.
    - `Get` does not paginate past `max_records`; a trial balance with more accounts than that cap
      is only partially summed, and a true imbalance could be masked by rows that were never
      fetched. Set `max_records` well above the company's actual chart-of-accounts size.
    - A trial balance with zero rows (an empty or never-opened period) sums to 0 debits and 0
      credits, which reads as perfectly balanced. This blueprint does not distinguish "balanced"
      from "empty"; check `account_count` in the Slack alert or summary log if that matters to you.

    ## Quick start

    1. Add the `PENNYLANE_API_TOKEN` and `SLACK_WEBHOOK_URL` secrets.
    2. Set `period_start`/`period_end` to a real closed period and run the flow manually.
    3. Confirm `compliant` logs matching totals.
    4. Lower `max_imbalance` below the real rounding noise on a large ledger to confirm `alert`
       fires, then restore it.
    5. Enable the `monthly` trigger once the period inputs match your actual closing cadence.

    ## How to extend

    - Loop over several consecutive periods with `io.kestra.plugin.core.flow.Loop` to re-check
      prior months whenever a new integration or import touches historical data.
    - Break the alert down by `label` (ledger account) instead of a single total, to name which
      account is driving the imbalance rather than just the aggregate.
    - Chain this after a reconciliation flow that imports bank or supplier data, so a sync error
      is caught the same day it lands rather than at month-end close.

    ## Links

    - Pennylane plugin: https://kestra.io/plugins/plugin-pennylane
    - Pennylane API reference: https://pennylane.readme.io/reference
    - Slack incoming webhooks: https://api.slack.com/messaging/webhooks
  tags:
    - Business
    - Core
  subTags:
    - Data Quality
    - Day 2 Operations
  ee: false
  demo: false
