id: fullstack_health_sentinel_rollback
namespace: devops.monitoring
description: "Monitors web application and database health endpoints, checks response status and latency, and automatically dispatches a GitHub Actions rollback workflow upon failure."

triggers:
  - id: 5min_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/5 * * * *"

variables:
  targetApiUrl: "https://api.example.com/health"
  githubOwner: "your-org"
  githubRepo: "your-repo"
  workflowId: "rollback.yml"
  slackWebhook: "{{ secret('SLACK_WEBHOOK_URL') }}"

tasks:
  - id: check_health_endpoint
    type: io.kestra.plugin.core.http.Request
    uri: "{{ vars.targetApiUrl }}"
    method: GET
    timeout: PT10S

  - id: evaluate_health_status
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.check_health_endpoint.statusCode != 200 }}"
    then:
      - id: notify_failure
        type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
        url: "{{ vars.slackWebhook }}"
        payload: |
          {
            "text": ":alert: *Health Sentinel Triggered!* API check returned status {{ outputs.check_health_endpoint.statusCode }}. Initiating automated rollback workflow..."
          }

      - id: trigger_github_rollback
        type: io.kestra.plugin.github.actions.RunWorkflow
        token: "{{ secret('GITHUB_TOKEN') }}"
        owner: "{{ vars.githubOwner }}"
        repo: "{{ vars.githubRepo }}"
        workflowId: "{{ vars.workflowId }}"
        ref: "main"