id: milvus-collection-index-and-load-readiness-drift-guard
namespace: company.ai
description: Audits Milvus vector collections for missing indexes or unloaded states, pauses for operator review or auto-loads, and verifies settlement via LoopUntil.

concurrency:
  limit: 1
  behavior: CANCEL

inputs:
  - id: milvus_endpoint
    type: STRING
    defaults: "http://milvus.internal:19530"
    description: Milvus v2.4+ REST API base endpoint.

  - id: database_name
    type: STRING
    defaults: "default"
    description: Target Milvus database name.

  - id: collection_name
    type: STRING
    defaults: "rag_knowledge_base"
    description: Target Milvus collection to audit and remediate.

  - id: slack_channel
    type: STRING
    defaults: "#ai-platform"
    description: Slack channel for operational alerts.

  - id: dry_run
    type: BOOL
    defaults: true
    description: When true, evaluates and logs readiness findings without invoking load or build commands.

  - id: auto_remediate
    type: BOOL
    defaults: false
    description: When true, automatically loads the collection into memory without operator approval.

tasks:
  - id: inspect_collection_state
    type: io.kestra.plugin.core.http.Request
    description: Queries Milvus REST API to retrieve collection status and load state.
    uri: "{{ inputs.milvus_endpoint }}/v2/vectordb/collections/describe"
    method: POST
    contentType: application/json
    headers:
      Authorization: "Bearer {{ secret('MILVUS_API_KEY') }}"
    body: >-
      {{ {"collectionName": inputs.collection_name, "dbName": inputs.database_name} | toJson }}

  - id: inspect_index_state
    type: io.kestra.plugin.core.http.Request
    description: Inspects vector index state and metric configuration for the collection.
    uri: "{{ inputs.milvus_endpoint }}/v2/vectordb/indexes/describe"
    method: POST
    contentType: application/json
    headers:
      Authorization: "Bearer {{ secret('MILVUS_API_KEY') }}"
    body: >-
      {{ {"collectionName": inputs.collection_name, "dbName": inputs.database_name} | toJson }}

  - id: evaluate_health_state
    type: io.kestra.plugin.core.output.OutputValues
    description: Evaluates whether the collection is indexed, in-memory, or degraded.
    values:
      load_state: >-
        {{ ((outputs.inspect_collection_state.body | json).data.load ?? 'NotLoaded') }}
      has_index: >-
        {{ (((outputs.inspect_index_state.body | json).data ?? []) | length) > 0 }}
      health_status: >-
        {{ ((outputs.inspect_collection_state.body | json).data.load ?? 'NotLoaded') == 'Loaded' and ((((outputs.inspect_index_state.body | json).data ?? []) | length) > 0) ? 'HEALTHY' : (((outputs.inspect_collection_state.body | json).data.load ?? 'NotLoaded') != 'Loaded' ? 'UNLOADED' : 'UNINDEXED') }}

  - id: route_readiness_decision
    type: io.kestra.plugin.core.flow.Switch
    description: Routes workflow execution based on the detected collection operational state.
    value: "{{ outputs.evaluate_health_state.values.health_status }}"
    cases:
      "HEALTHY":
        - id: log_collection_healthy
          type: io.kestra.plugin.core.log.Log
          description: Logs confirmation that collection is indexed and loaded in memory.
          message: "Milvus collection '{{ inputs.collection_name }}' in database '{{ inputs.database_name }}' is fully loaded ({{ outputs.evaluate_health_state.values.load_state }}) with active vector index."

      "UNLOADED":
        - id: handle_unloaded_collection
          type: io.kestra.plugin.core.flow.If
          description: Handles remediation for collections that are not loaded in memory.
          condition: "{{ inputs.dry_run == false }}"
          then:
            - id: check_approval_gate
              type: io.kestra.plugin.core.flow.If
              description: Pauses for operator review unless auto-remediation is enabled.
              condition: "{{ inputs.auto_remediate == false }}"
              then:
                - id: alert_approval_required
                  type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
                  description: Alerts operators that collection is unloaded and awaiting approval to load.
                  url: "{{ secret('SLACK_WEBHOOK_URL') }}"
                  payload: >-
                    {{ {"channel": inputs.slack_channel, "text": ":warning: *Milvus Collection Unloaded Alert* — `" ~ inputs.database_name ~ "." ~ inputs.collection_name ~ "`\nCollection current state: `" ~ outputs.evaluate_health_state.values.load_state ~ "`.\nVector search queries will fail. Resume execution to approve memory loading: " ~ (kestra.url ?? 'http://localhost:8080') ~ "/ui/executions/" ~ execution.id} | toJson }}

                - id: await_operator_decision
                  type: io.kestra.plugin.core.flow.Pause
                  description: Pauses execution until an operator confirms collection load.
                  timeout: PT2H
                  onResume:
                    - id: confirm_load
                      type: BOOL
                      defaults: true
                      description: Confirm loading the collection into Milvus QueryNode memory.

            - id: trigger_collection_load
              type: io.kestra.plugin.core.http.Request
              description: Issues load collection command to Milvus QueryCoord.
              uri: "{{ inputs.milvus_endpoint }}/v2/vectordb/collections/load"
              method: POST
              contentType: application/json
              headers:
                Authorization: "Bearer {{ secret('MILVUS_API_KEY') }}"
              body: >-
                {{ {"collectionName": inputs.collection_name, "dbName": inputs.database_name} | toJson }}

            - id: wait_for_load_settlement
              type: io.kestra.plugin.core.flow.LoopUntil
              description: Polls Milvus until the collection transition finishes or timeout expires.
              condition: "{{ ((outputs.poll_load_state.body | json).data.load ?? 'NotLoaded') == 'Loaded' }}"
              checkFrequency:
                interval: PT5S
                maxDuration: PT2M
              failOnMaxReached: false
              tasks:
                - id: poll_load_state
                  type: io.kestra.plugin.core.http.Request
                  description: Polls collection description to check if load status reached Loaded.
                  uri: "{{ inputs.milvus_endpoint }}/v2/vectordb/collections/describe"
                  method: POST
                  contentType: application/json
                  headers:
                    Authorization: "Bearer {{ secret('MILVUS_API_KEY') }}"
                  body: >-
                    {{ {"collectionName": inputs.collection_name, "dbName": inputs.database_name} | toJson }}

            - id: verify_post_remediation
              type: io.kestra.plugin.core.http.Request
              description: Re-reads final collection state to confirm it settled in Loaded status.
              uri: "{{ inputs.milvus_endpoint }}/v2/vectordb/collections/describe"
              method: POST
              contentType: application/json
              headers:
                Authorization: "Bearer {{ secret('MILVUS_API_KEY') }}"
              body: >-
                {{ {"collectionName": inputs.collection_name, "dbName": inputs.database_name} | toJson }}

            - id: check_final_settlement
              type: io.kestra.plugin.core.flow.If
              description: Validates whether the collection successfully transitioned to Loaded.
              condition: "{{ ((outputs.verify_post_remediation.body | json).data.load ?? 'NotLoaded') != 'Loaded' }}"
              then:
                - id: alert_load_timeout
                  type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
                  description: Alerts engineering team if collection failed to settle into Loaded status.
                  url: "{{ secret('SLACK_WEBHOOK_URL') }}"
                  payload: >-
                    {{ {"channel": inputs.slack_channel, "text": ":rotating_light: *Milvus Load Remediation Incomplete* — `" ~ inputs.database_name ~ "." ~ inputs.collection_name ~ "`\nCollection remains in state `" ~ ((outputs.verify_post_remediation.body | json).data.load ?? 'Unknown') ~ "` after load attempt. Check QueryNode memory headroom: " ~ (kestra.url ?? 'http://localhost:8080') ~ "/ui/executions/" ~ execution.id} | toJson }}
              else:
                - id: log_load_successful
                  type: io.kestra.plugin.core.log.Log
                  description: Logs successful collection load confirmation.
                  message: "Milvus collection '{{ inputs.collection_name }}' successfully loaded into memory and ready for vector search."
          else:
            - id: log_dry_run_unloaded
              type: io.kestra.plugin.core.log.Log
              description: Logs dry run findings for unloaded collection.
              message: "[DRY RUN] Milvus collection '{{ inputs.collection_name }}' is currently in state '{{ outputs.evaluate_health_state.values.load_state }}'. Set dry_run to false to execute automated loading."

      "UNINDEXED":
        - id: handle_unindexed_collection
          type: io.kestra.plugin.core.flow.If
          description: Dispatches alert for collection missing a vector index.
          condition: "{{ inputs.dry_run == false }}"
          then:
            - id: alert_missing_index
              type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
              description: Alerts Slack channel that vector search performance will degrade due to missing index.
              url: "{{ secret('SLACK_WEBHOOK_URL') }}"
              payload: >-
                {{ {"channel": inputs.slack_channel, "text": ":warning: *Milvus Missing Vector Index Alert* — `" ~ inputs.database_name ~ "." ~ inputs.collection_name ~ "`\nCollection has no active vector index. Queries are falling back to brute-force full table scans. Triage execution: " ~ (kestra.url ?? 'http://localhost:8080') ~ "/ui/executions/" ~ execution.id} | toJson }}
          else:
            - id: log_dry_run_unindexed
              type: io.kestra.plugin.core.log.Log
              description: Logs dry run finding for unindexed collection.
              message: "[DRY RUN] Milvus collection '{{ inputs.collection_name }}' has no vector index defined. Flat brute-force scan in effect."

  - id: persist_audit_snapshot
    type: io.kestra.plugin.core.kv.Set
    description: Persists audit findings into Kestra KV store for telemetry and audit compliance.
    key: "milvus_readiness_{{ inputs.collection_name }}"
    value: "{{ outputs.evaluate_health_state.values | toJson }}"
    kvType: JSON

triggers:
  - id: hourly_readiness_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 * * * *"
    disabled: true

errors:
  - id: alert_pipeline_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Dispatches alert if Milvus endpoint is unreachable or API request fails.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: >-
      {{ {"channel": inputs.slack_channel, "text": ":x: *Milvus Readiness Guard Execution Failed* — `" ~ inputs.database_name ~ "." ~ inputs.collection_name ~ "`\nExecution error encountered. Inspect execution logs: " ~ (kestra.url ?? 'http://localhost:8080') ~ "/ui/executions/" ~ execution.id} | toJson }}

extend:
  metaDescription: Audit Milvus vector collections for unindexed entities and unloaded states, manage human-in-the-loop review, and verify settlement via LoopUntil.
  metaTitle: Milvus Vector Database Index and Load Readiness Drift Guard
  title: Milvus Vector Database Index and Load Readiness Drift Guard
  shortDescription: Audit Milvus vector collections for unindexed entities and unloaded states, manage human-in-the-loop review, and verify settlement via LoopUntil.
  description: |
    ## How it works
    In distributed Milvus vector databases, collections must have an active vector index (e.g. HNSW, IVF_FLAT, SCaNN) and be loaded into QueryNode memory before they can serve high-throughput approximate nearest neighbor (ANN) search queries. If a QueryNode restarts, encounters OOM pressure, or an ingestion pipeline inserts unindexed vectors, collections fall into `NotLoaded`, `Loading`, or unindexed states. When unloaded, search calls fail immediately; when unindexed, queries fall back to costly brute-force flat scans that exhaust cluster CPU.

    This workflow automates collection readiness governance:
    1. **Catalog Inspection**: Queries the Milvus REST API v2 endpoints (`/v2/vectordb/collections/describe` and `/v2/vectordb/indexes/describe`) to inspect real-time load state and index metadata.
    2. **State Evaluation**: Evaluates whether the collection is healthy (`Loaded` with index), unloaded, or missing vector indexes.
    3. **Human-in-the-Loop Governance**: When degraded and not running in dry-run mode, alerts the engineering team on Slack and pauses execution (`Pause`) allowing operators to approve memory loading, or executes immediately if `auto_remediate` is enabled.
    4. **Settlement Polling via `LoopUntil`**: After dispatching the load command (`/v2/vectordb/collections/load`), polls the describe endpoint every 5 seconds up to 2 minutes until the collection settles into `Loaded` state.
    5. **Post-Remediation Verification**: Confirms operational readiness and alerts if loading timed out or QueryNodes rejected the request.
    6. **KV Audit Logging**: Records execution findings and transition timestamps in Kestra KV store for historical compliance reporting.

    ## What you get
    - Continuous validation of Milvus vector collection in-memory readiness.
    - Automatic detection of unindexed collections to prevent brute-force query performance degradation.
    - Safe operational remediation with dry-run support, interactive operator approvals, and `LoopUntil` settlement polling.
    - Slack incident notifications with direct triage links to the Kestra execution interface.

    ## Who it's for
    - AI & ML Platform Engineers maintaining Milvus clusters for production RAG and vector retrieval systems.
    - Data Engineers deploying LLM embeddings and automated semantic search pipelines.
    - SREs managing vector database memory availability and query latency SLAs.

    ## Why orchestrate this with Kestra
    - **Native Polling Constructs**: Uses `io.kestra.plugin.core.flow.LoopUntil` to await asynchronous collection loading without fragile shell sleep hacks.
    - **Interactive Pause & Resume**: Allows operators to safely review cluster memory headroom before triggering memory-intensive load operations.
    - **Single Control Plane**: Integrates vector database health surveillance directly alongside scheduled ETL ingestion pipelines.

    ## Prerequisites
    - Milvus cluster v2.4+ with REST API accessible.
    - Secret `MILVUS_API_KEY` configured in Kestra (or empty string for unauthenticated clusters).
    - Secret `SLACK_WEBHOOK_URL` configured in Kestra for Slack notifications.

    ## Quick start
    1. Import this blueprint into your Kestra instance.
    2. Configure `milvus_endpoint`, `database_name`, and `collection_name`.
    3. Run with `dry_run: true` to inspect collection load and index status safely.
    4. Set `dry_run: false` to enable interactive or automated memory loading.

    ## How to extend
    - Add dynamic partition loading checks for partitioned collections (`/v2/vectordb/partitions/describe`).
    - Integrate QueryNode Prometheus metrics (`milvus_querynode_memory_usage_ratio`) before triggering load requests.

    ## Links
    - [Milvus REST API v2 Documentation](https://milvus.io/docs/v2.4.x/restful_overview.md)
    - [Milvus Collection Load Architecture](https://milvus.io/docs/load_collection.md)
    - [Kestra LoopUntil Plugin Documentation](https://kestra.io/plugins/core/tasks/flows/io.kestra.plugin.core.flow.loopuntil)
  tags:
    - AI
    - Infrastructure
  subTags:
    - Vector Databases
    - Anomaly Detection
  ee: false
  demo: false
