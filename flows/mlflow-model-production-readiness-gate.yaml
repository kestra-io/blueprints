id: mlflow-model-production-readiness-gate
namespace: company.team

inputs:
  - id: mlflow_tracking_uri
    type: STRING
    displayName: MLflow Tracking URI
    description: "Base URL of the MLflow tracking server, e.g. http://mlflow:5000"
    defaults: "http://mlflow:5000"

  - id: model_name
    type: STRING
    displayName: Registered model name
    description: Name of the model in the MLflow Model Registry to promote
    defaults: "fraud-detector"

  - id: candidate_version
    type: STRING
    displayName: Candidate model version
    description: Version number in the registry to evaluate for production promotion
    defaults: "3"

  - id: reference_dataset_uri
    type: STRING
    displayName: Reference dataset URI (training baseline)
    description: Internal-storage URI of the Parquet file with training-time feature statistics (output of the registration pipeline)
    defaults: "kestra:///company/team/executions/mlflow-register/latest/reference_stats.parquet"

  - id: production_dataset_uri
    type: STRING
    displayName: Production sample URI
    description: Internal-storage URI of a recent Parquet file sampled from the live serving population
    defaults: "kestra:///company/team/executions/mlflow-serve-sample/latest/production_sample.parquet"

  - id: psi_threshold
    type: FLOAT
    displayName: PSI drift threshold
    description: "Population Stability Index above which a feature is flagged as drifted. 0.2 is the standard 'significant change' cutoff."
    defaults: 0.2

  - id: ks_alpha
    type: FLOAT
    displayName: KS test significance level (alpha)
    description: "p-value floor for the Kolmogorov-Smirnov test. Features with p < alpha are flagged. Default 0.05."
    defaults: 0.05

  - id: max_drifted_features
    type: INT
    displayName: Max drifted features before blocking
    description: Promotion is blocked if more than this many features fail either drift test
    defaults: 2

  - id: target_stage
    type: STRING
    displayName: Target MLflow stage
    description: "Registry stage to transition the model to on pass: Production or Staging"
    defaults: "Production"

  - id: notify_slack
    type: BOOL
    displayName: Notify Slack
    description: Send a Slack alert whether the gate passes or blocks
    defaults: false

  - id: dry_run
    type: BOOL
    displayName: Dry run
    description: "Run the full gate but skip the actual registry transition on pass. Useful in CI."
    defaults: false

variables:
  kv_prefix: "mlflow_gate_{{ inputs.model_name }}_v{{ inputs.candidate_version }}"
  gate_result_key: "{{ vars.kv_prefix }}_result"
  run_ts: "{{ execution.startDate | date('yyyy-MM-dd HH:mm:ss') }}"

tasks:
  # â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  # 1. FETCH MODEL METADATA FROM MLFLOW REGISTRY
  # â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  - id: fetch_model_version
    type: io.kestra.plugin.core.http.Request
    description: "Pull the candidate version metadata from the MLflow registry REST API."
    uri: "{{ inputs.mlflow_tracking_uri }}/api/2.0/mlflow/model-versions/get?name={{ inputs.model_name }}&version={{ inputs.candidate_version }}"
    method: GET

  - id: fetch_run_metrics
    type: io.kestra.plugin.core.http.Request
    description: "Fetch the training run that produced this model version to get its logged metrics."
    uri: "{{ inputs.mlflow_tracking_uri }}/api/2.0/mlflow/runs/get?run_id={{ (outputs.fetch_model_version.body | fromJson).model_version.run_id }}"
    method: GET

  - id: parse_model_info
    type: io.kestra.plugin.core.output.OutputValues
    description: "Flatten the fields we need downstream into named outputs."
    values:
      model_name: "{{ (outputs.fetch_model_version.body | fromJson).model_version.name }}"
      model_version: "{{ (outputs.fetch_model_version.body | fromJson).model_version.version }}"
      current_stage: "{{ (outputs.fetch_model_version.body | fromJson).model_version.current_stage }}"
      run_id: "{{ (outputs.fetch_model_version.body | fromJson).model_version.run_id }}"
      source_path: "{{ (outputs.fetch_model_version.body | fromJson).model_version.source }}"
      creation_timestamp: "{{ (outputs.fetch_model_version.body | fromJson).model_version.creation_timestamp }}"
      metrics_json: "{{ (outputs.fetch_run_metrics.body | fromJson).run.data.metrics | toJson }}"
      tags_json: "{{ (outputs.fetch_run_metrics.body | fromJson).run.data.tags | toJson }}"

  # â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  # 2. STATISTICAL FEATURE DRIFT DETECTION
  # â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  - id: compute_drift
    type: io.kestra.plugin.scripts.python.Script
    description: >-
      Compare training-time reference statistics against a recent production
      sample using PSI (Population Stability Index) for all numeric features
      and the KS test for continuous ones. Any feature that exceeds the PSI
      threshold OR falls below the KS p-value floor is flagged as drifted.
    containerImage: python:3.12-slim
    beforeCommands:
      - pip install --quiet pandas pyarrow scipy numpy 2>&1 | tail -1
    inputFiles:
      reference.parquet: "{{ inputs.reference_dataset_uri }}"
      production.parquet: "{{ inputs.production_dataset_uri }}"
    outputFiles:
      - drift_report.json
    script: |
      import json, math, sys
      import numpy as np
      import pandas as pd
      from scipy import stats

      PSI_THRESHOLD = {{ inputs.psi_threshold }}
      KS_ALPHA      = {{ inputs.ks_alpha }}

      ref = pd.read_parquet("reference.parquet")
      prod = pd.read_parquet("production.parquet")

      # Keep only shared numeric columns; skip label/target columns by convention
      # (columns whose name ends with _label, _target, or equals 'y').
      SKIP = {"y", "label", "target"}
      shared = [
          c for c in ref.columns
          if c in prod.columns
          and pd.api.types.is_numeric_dtype(ref[c])
          and c.lower() not in SKIP
          and not c.lower().endswith(("_label", "_target"))
      ]

      def psi(expected: np.ndarray, actual: np.ndarray, buckets: int = 10) -> float:
          """Population Stability Index. Returns float('inf') on degenerate input."""
          breakpoints = np.percentile(expected, np.linspace(0, 100, buckets + 1))
          breakpoints[0]  = -np.inf
          breakpoints[-1] =  np.inf
          e = np.histogram(expected, bins=breakpoints)[0] / len(expected)
          a = np.histogram(actual,   bins=breakpoints)[0] / len(actual)
          # Clip to avoid log(0)
          e = np.clip(e, 1e-6, None)
          a = np.clip(a, 1e-6, None)
          return float(np.sum((a - e) * np.log(a / e)))

      results = []
      for col in shared:
          r = ref[col].dropna().values.astype(float)
          p = prod[col].dropna().values.astype(float)
          if len(r) < 10 or len(p) < 10:
              results.append({
                  "feature": col,
                  "status":  "SKIP",
                  "reason":  f"too few rows (ref={len(r)}, prod={len(p)})",
                  "psi":     None,
                  "ks_stat": None,
                  "ks_p":    None,
              })
              continue

          psi_val = psi(r, p)
          ks_stat, ks_p = stats.ks_2samp(r, p)

          psi_flag = psi_val >= PSI_THRESHOLD
          ks_flag  = ks_p   <  KS_ALPHA

          if psi_flag and ks_flag:
              status = "DRIFTED"
          elif psi_flag or ks_flag:
              status = "WARNING"
          else:
              status = "STABLE"

          results.append({
              "feature": col,
              "status":  status,
              "psi":     round(psi_val, 4),
              "ks_stat": round(float(ks_stat), 4),
              "ks_p":    round(float(ks_p), 4),
          })

      drifted  = [r for r in results if r["status"] == "DRIFTED"]
      warnings = [r for r in results if r["status"] == "WARNING"]
      stable   = [r for r in results if r["status"] == "STABLE"]
      skipped  = [r for r in results if r["status"] == "SKIP"]

      report = {
          "total_features":    len(results),
          "drifted_count":     len(drifted),
          "warning_count":     len(warnings),
          "stable_count":      len(stable),
          "skipped_count":     len(skipped),
          "psi_threshold":     PSI_THRESHOLD,
          "ks_alpha":          KS_ALPHA,
          "drifted_features":  drifted,
          "warning_features":  warnings,
          "stable_features":   stable,
          "skipped_features":  skipped,
          "ref_rows":          int(len(ref)),
          "prod_rows":         int(len(prod)),
      }

      with open("drift_report.json", "w") as f:
          json.dump(report, f, indent=2)

      print(json.dumps({
          "drifted_count": len(drifted),
          "warning_count": len(warnings),
          "stable_count":  len(stable),
          "top_drifted":   [f["feature"] for f in sorted(drifted, key=lambda x: x["psi"] or 0, reverse=True)[:5]],
      }))

  - id: parse_drift_verdict
    type: io.kestra.plugin.core.output.OutputValues
    description: "Surface drift counts and the gate decision as named outputs."
    values:
      drifted_count: "{{ (outputs.compute_drift.outputFiles['drift_report.json'] | fromJson).drifted_count }}"
      warning_count: "{{ (outputs.compute_drift.outputFiles['drift_report.json'] | fromJson).warning_count }}"
      total_features: "{{ (outputs.compute_drift.outputFiles['drift_report.json'] | fromJson).total_features }}"
      gate_pass: "{{ (outputs.compute_drift.outputFiles['drift_report.json'] | fromJson).drifted_count <= inputs.max_drifted_features }}"

  # â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  # 3. TRAINING METRICS REGRESSION CHECK
  # â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  - id: check_metric_regression
    type: io.kestra.plugin.scripts.python.Script
    description: >-
      Compare the candidate's logged training metrics (e.g. f1, precision, recall,
      auc) against the metrics stored in KV for the currently promoted version.
      If no KV baseline exists the check passes unconditionally (first deploy).
    containerImage: python:3.12-slim
    env:
      MLFLOW_URI: "{{ inputs.mlflow_tracking_uri }}"
      MODEL_NAME: "{{ inputs.model_name }}"
      METRICS_JSON: "{{ outputs.parse_model_info.values.metrics_json }}"
      KV_BASELINE: "{{ kv('mlflow_baseline_metrics_' + inputs.model_name) | default('{}') }}"
    script: |
      import json, os, sys

      candidate = {m["key"]: m["value"] for m in json.loads(os.environ["METRICS_JSON"])}
      baseline  = json.loads(os.environ.get("KV_BASELINE", "{}"))

      HIGHER_BETTER = {"f1", "precision", "recall", "roc_auc", "pr_auc", "accuracy", "auc"}
      LOWER_BETTER  = {"log_loss", "logloss", "rmse", "mae", "mse", "error_rate"}
      TOLERANCE     = 0.01  # allow up to 1 pp regression before flagging

      regressions = []
      for k, baseline_val in baseline.items():
          if k not in candidate:
              continue
          cand_val = candidate[k]
          if k.lower() in HIGHER_BETTER:
              if baseline_val - cand_val > TOLERANCE:
                  regressions.append({"metric": k, "baseline": baseline_val, "candidate": cand_val, "delta": round(cand_val - baseline_val, 4)})
          elif k.lower() in LOWER_BETTER:
              if cand_val - baseline_val > TOLERANCE:
                  regressions.append({"metric": k, "baseline": baseline_val, "candidate": cand_val, "delta": round(cand_val - baseline_val, 4)})

      result = {
          "has_baseline": bool(baseline),
          "candidate_metrics": candidate,
          "regressions": regressions,
          "regression_count": len(regressions),
          "pass": len(regressions) == 0,
      }
      print(json.dumps(result))

  - id: parse_metric_verdict
    type: io.kestra.plugin.core.output.OutputValues
    values:
      regression_count: "{{ (outputs.check_metric_regression.vars | fromJson).regression_count }}"
      metrics_pass: "{{ (outputs.check_metric_regression.vars | fromJson).pass }}"

  # â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  # 4. COMBINED GATE DECISION
  # â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  - id: gate_decision
    type: io.kestra.plugin.core.flow.If
    description: "Branch on the combined drift + metric verdict."
    condition: "{{ outputs.parse_drift_verdict.values.gate_pass == 'true' and outputs.parse_metric_verdict.values.metrics_pass == 'true' }}"
    then:
      # â”€â”€ PASS BRANCH â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
      - id: log_gate_pass
        type: io.kestra.plugin.core.log.Log
        message: >-
          Gate PASSED: {{ outputs.parse_drift_verdict.values.drifted_count }} drifted features
          (threshold {{ inputs.max_drifted_features }}),
          {{ outputs.parse_metric_verdict.values.regression_count }} metric regressions.
          Promoting {{ inputs.model_name }} v{{ inputs.candidate_version }} â†’ {{ inputs.target_stage }}.

      - id: promote_model
        type: io.kestra.plugin.core.http.Request
        description: "Transition the model version to the target stage in the MLflow registry."
        runIf: "{{ inputs.dry_run == false }}"
        uri: "{{ inputs.mlflow_tracking_uri }}/api/2.0/mlflow/model-versions/transition-stage"
        method: POST
        contentType: application/json
        body: |
          {
            "name":    "{{ inputs.model_name }}",
            "version": "{{ inputs.candidate_version }}",
            "stage":   "{{ inputs.target_stage }}",
            "archive_existing_versions": true
          }

      - id: store_new_baseline_metrics
        type: io.kestra.plugin.core.kv.Set
        description: "Record the newly promoted model's metrics as the baseline for future gate runs."
        runIf: "{{ inputs.dry_run == false }}"
        key: "mlflow_baseline_metrics_{{ inputs.model_name }}"
        value: "{{ outputs.parse_model_info.values.metrics_json }}"
        overwrite: true

      - id: store_gate_result_pass
        type: io.kestra.plugin.core.kv.Set
        key: "{{ vars.gate_result_key }}"
        value: |
          {
            "result": "PASS",
            "timestamp": "{{ vars.run_ts }}",
            "drifted_count": {{ outputs.parse_drift_verdict.values.drifted_count }},
            "regression_count": {{ outputs.parse_metric_verdict.values.regression_count }},
            "promoted_to": "{{ inputs.target_stage }}",
            "dry_run": {{ inputs.dry_run }}
          }
        overwrite: true

      - id: slack_pass
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: "Notify on successful promotion."
        runIf: "{{ inputs.notify_slack }}"
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": ":white_check_mark: *MLflow gate PASSED* â€” `{{ inputs.model_name }} v{{ inputs.candidate_version }}` promoted to *{{ inputs.target_stage }}*.\nâ€¢ Drifted features: {{ outputs.parse_drift_verdict.values.drifted_count }} / {{ outputs.parse_drift_verdict.values.total_features }}\nâ€¢ Metric regressions: {{ outputs.parse_metric_verdict.values.regression_count }}\nâ€¢ Execution: `{{ execution.id }}`{{ inputs.dry_run ? ' _(dry run â€” no actual transition)_' : '' }}"
          }

    else:
      # â”€â”€ BLOCK BRANCH â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
      - id: log_gate_block
        type: io.kestra.plugin.core.log.Log
        level: WARN
        message: >-
          Gate BLOCKED: {{ outputs.parse_drift_verdict.values.drifted_count }} drifted features
          (max {{ inputs.max_drifted_features }}) and
          {{ outputs.parse_metric_verdict.values.regression_count }} metric regressions.
          {{ inputs.model_name }} v{{ inputs.candidate_version }} will NOT be promoted.

      - id: store_gate_result_block
        type: io.kestra.plugin.core.kv.Set
        key: "{{ vars.gate_result_key }}"
        value: |
          {
            "result": "BLOCK",
            "timestamp": "{{ vars.run_ts }}",
            "drifted_count": {{ outputs.parse_drift_verdict.values.drifted_count }},
            "regression_count": {{ outputs.parse_metric_verdict.values.regression_count }},
            "promoted_to": null
          }
        overwrite: true

      - id: slack_block
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: "Notify team that promotion was blocked with actionable detail."
        runIf: "{{ inputs.notify_slack }}"
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": ":no_entry: *MLflow gate BLOCKED* â€” `{{ inputs.model_name }} v{{ inputs.candidate_version }}` will NOT be promoted to *{{ inputs.target_stage }}*.\nâ€¢ Drifted features: *{{ outputs.parse_drift_verdict.values.drifted_count }}* / {{ outputs.parse_drift_verdict.values.total_features }} (threshold: {{ inputs.max_drifted_features }})\nâ€¢ Metric regressions: *{{ outputs.parse_metric_verdict.values.regression_count }}*\nâ€¢ Execution: `{{ execution.id }}`\nReview the drift report attached to this execution."
          }

      - id: fail_execution
        type: io.kestra.plugin.core.execution.Fail
        errorMessage: >-
          MLflow gate blocked {{ inputs.model_name }} v{{ inputs.candidate_version }}:
          {{ outputs.parse_drift_verdict.values.drifted_count }} features drifted
          (max {{ inputs.max_drifted_features }}),
          {{ outputs.parse_metric_verdict.values.regression_count }} metric regressions.

errors:
  - id: alert_gate_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    runIf: "{{ inputs.notify_slack }}"
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": ":x: *MLflow gate errored* â€” `{{ inputs.model_name }} v{{ inputs.candidate_version }}` gate did not complete. Execution `{{ execution.id }}` failed at task `{{ errorLogs() | length > 0 ? errorLogs()[0].taskId : 'unknown' }}`: {{ errorLogs() | length > 0 ? errorLogs()[0].message : '' }}"
      }

triggers:
  - id: on_new_candidate
    type: io.kestra.plugin.core.trigger.Webhook
    description: >-
      CI / the model registration pipeline POSTs here immediately after pushing
      a new version to the registry. The payload should contain model_name and
      candidate_version at minimum.
    key: "{{ secret('MLFLOW_GATE_WEBHOOK_KEY') }}"
    disabled: true

extend:
  title: Gate MLflow model promotion with statistical drift detection
  metaTitle: MLflow model production readiness gate with PSI and KS drift detection | Kestra
  shortDescription: Block or promote an MLflow registered model based on feature drift (PSI + KS) and training metric regression before it reaches Production.
  metaDescription: Gate MLflow model promotion using PSI and KS feature drift tests, check metric regression against KV baselines, and promote or block with Slack alerts.
  description: |
    Getting a model into the registry is the easy part. Knowing whether it is
    safe to actually serve is harder â€” especially when the production population
    has shifted since training. This flow puts a deterministic gate between the
    MLflow registry and Production: it checks feature drift and metric regression
    on every promotion attempt, promotes on pass, and blocks with a FAILED
    execution on failure so CI pipelines get a non-zero exit code automatically.

    ## How it works

    1. `fetch_model_version` and `fetch_run_metrics` pull the candidate version's
       metadata and its training run metrics from the MLflow REST API. No MLflow
       Python client is needed â€” Kestra's HTTP task calls the `/api/2.0` endpoints
       directly, which works with any MLflow deployment (OSS, Databricks, AWS
       SageMaker Experiments).

    2. `compute_drift` loads a training-time reference Parquet and a recent
       production sample Parquet, then runs two independent drift tests on every
       shared numeric feature:
       - **PSI (Population Stability Index)**: the standard industry metric for
         population shift. PSI < 0.1 = stable, 0.1â€“0.2 = warning, > 0.2 = drifted.
         The threshold is an input so you can tighten or loosen it per model.
       - **KS test**: a distribution-free two-sample test that catches shape
         changes PSI can miss when bin sizes are poorly distributed. A p-value
         below `ks_alpha` (default 0.05) flags drift.
       A feature is called DRIFTED only when both tests agree, which dramatically
       cuts false positives from binning artefacts. The full per-feature report
       lands in `drift_report.json` and is attached to the execution for review.

    3. `check_metric_regression` compares the candidate's logged training metrics
       against the metrics stored in the KV store from the last promoted version.
       A 1 pp tolerance window prevents noise from triggering false regressions.
       If no KV baseline exists â€” first ever deploy â€” the check passes
       unconditionally.

    4. `gate_decision` branches:
       - **PASS**: `promote_model` transitions the version to `target_stage` via
         `PATCH /model-versions/transition-stage` with `archive_existing_versions: true`,
         so the previous Production version is automatically archived.
         The candidate's metrics are written back to KV as the new baseline.
         A Slack message names the feature and metric counts.
       - **BLOCK**: `fail_execution` ends the run as FAILED so downstream CI jobs
         receive a non-zero exit code without any extra curl or wrapper. Slack
         gets the drifted feature count and regression count. The execution is
         left intact for post-mortem â€” the drift report is attached as an output
         file.

    5. The gate result (PASS or BLOCK with timestamp and counts) is written to the
       KV store on every run, so a scheduled audit flow can query the history
       across all models without parsing execution logs.

    ## What you get

    - A single Kestra execution that is the authoritative promotion record: inputs,
      drift report, metric comparison, and the registry API response are all
      attached and queryable.
    - A FAILED execution that stops CI without any extra scripting, identical to
      how `dbt-core-approval-gate` blocks on test failures.
    - An audit trail in KV (`mlflow_gate_<model>_v<version>_result`) that survives
      execution pruning.
    - An updated metrics baseline in KV after every successful promotion so the
      next candidate is compared to the freshest bar, not the original training run.
    - A `dry_run` input for CI preview runs that compute the verdict but skip the
      actual registry transition and KV writes.

    ## Who it's for

    - ML platform teams who own the MLflow registry and need a programmatic gate
      that their model training pipelines can call without writing bespoke Python.
    - Data scientists who want to understand why a model was blocked before
      retraining â€” the drift report names the exact features and their PSI/KS
      values.
    - Platform engineers standardising multi-team model promotion with a single
      configurable flow rather than per-team scripts.

    ## Why orchestrate this with Kestra

    MLflow provides no built-in promotion gate. The common alternative is a Python
    script in a GitHub Action that calls the MLflow client and exits non-zero on
    failure. That approach has no retry semantics (transient API errors become hard
    failures), no execution history, and no integration with a secrets backend.
    Kestra replaces the script with a declarative flow: the schedule, retries, KV
    baseline, Slack alerts, and HTTP calls are all first-class concerns with a full
    audit trail and no separate service to run.

    The drift computation and metric regression live in a pinned Docker container
    (`python:3.12-slim`) so the gate result is reproducible across environments.
    Adding a second gate â€” for example a canary traffic split check â€” is a new
    task in the same flow, not a new script in a new repo.

    ## Prerequisites

    - A running MLflow Tracking Server reachable from the Kestra worker.
    - A model registered in the MLflow Model Registry with at least one version.
    - The model training pipeline must write:
      1. A reference Parquet with training-time feature statistics to Kestra internal
         storage (or any URI the worker can read as a file input). Column names
         must match the production sample. Target/label columns should be named
         `y`, `label`, `target`, or end with `_label` / `_target` â€” they are skipped
         automatically.
      2. A production sample Parquet from the serving population.
    - Workers must be able to pull `python:3.12-slim` from Docker Hub, or replace
      `containerImage` with a prebuilt image that already has `pandas pyarrow scipy`.

    ### Secrets

    - `MLFLOW_GATE_WEBHOOK_KEY`: key for the inbound webhook trigger (only needed
      when CI calls the gate via webhook rather than scheduled execution).
    - `SLACK_WEBHOOK_URL`: Slack incoming webhook for pass/block/error alerts.
      Only needed when `notify_slack` is `true`.

    If your MLflow server requires authentication (Databricks PAT, basic auth),
    add the `Authorization` header to `fetch_model_version` and `fetch_run_metrics`
    via `headers`, sourced from `{{ secret('MLFLOW_TOKEN') }}`.

    ## Quick start

    1. Start MLflow and register a model:
       ```bash
       pip install mlflow scikit-learn
       mlflow server --host 0.0.0.0 --port 5000 &
       python - <<'EOF'
       import mlflow, numpy as np
       from sklearn.datasets import make_classification
       from sklearn.linear_model import LogisticRegression
       from sklearn.metrics import f1_score

       X, y = make_classification(n_samples=1000, n_features=8, random_state=42)
       mlflow.set_experiment("fraud-detector")
       with mlflow.start_run():
           model = LogisticRegression().fit(X, y)
           mlflow.log_metric("f1",        f1_score(y, model.predict(X)))
           mlflow.log_metric("precision", 0.87)
           mlflow.log_metric("recall",    0.84)
           mlflow.sklearn.log_model(model, "model",
               registered_model_name="fraud-detector")
       EOF
       ```
    2. Produce a reference Parquet (training data) and a production sample Parquet
       and upload them to Kestra's internal storage via the namespace file UI or
       the API. For a demo, generate two DataFrames with the same 8 columns:
       one from the same `make_classification` call (reference) and one with
       slightly shifted means (production).
    3. Add the flow, set `mlflow_tracking_uri` to `http://localhost:5000` (or your
       host), and run it with `candidate_version: 1` and `dry_run: true`.
    4. The gate computes drift and metrics, logs the verdict, but does not call the
       registry. Check `outputs.parse_drift_verdict.values.drifted_count`.
    5. Set `dry_run: false` and run again. The version is promoted to Production and
       the metrics baseline is stored in KV.
    6. Re-run with a second version trained on heavily shifted data. The gate blocks
       and the execution is FAILED.

    ## How to extend

    - **Per-model thresholds**: store `psi_threshold` and `max_drifted_features`
      per model name in the KV store and read them with `{{ kv('mlflow_psi_' + inputs.model_name) | default(0.2) }}` so different model families have different sensitivity.
    - **Shadow score**: before promoting, deploy the candidate as a Shadow stage
      and capture its predictions on live traffic for N minutes; add a task that
      reads those shadow metrics from a table and gates on calibration before the
      actual transition.
    - **Multi-model**: wrap `fetch_model_version` + `compute_drift` in a
      `io.kestra.plugin.core.flow.Loop` over a list of model names to gate an
      entire model family in one execution.
    - **PagerDuty**: replace the Slack task with `io.kestra.plugin.pagerduty.CreateIncident`
      when the gate blocks on a model that owns an SLA.
    - **Schedule**: add `io.kestra.plugin.core.trigger.Schedule` with a nightly
      cron to re-run the gate against the currently Production version â€” this
      catches population shift that happened after promotion without a new candidate.

