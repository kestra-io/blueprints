id: weaviate-meta-engine-modules-sentinel
namespace: company.sentinel
description: Probes Weaviate vector engine meta endpoint to verify vectorizer module
  operational readiness and schema compatibility.
inputs:
- id: weaviate_url
  type: STRING
  defaults: http://weaviate.internal:8080
outputs:
  - id: modules_count
    type: INT
    value: "{{ outputs.audit_weaviate.vars.modules_count }}"
  - id: version
    type: STRING
    value: "{{ outputs.audit_weaviate.vars.version }}"


tasks:
- id: audit_weaviate
  type: io.kestra.plugin.scripts.python.Script
  description: Audits Weaviate meta endpoint for active modules and engine version.
  containerImage: python:3.11-slim
  taskRunner:
    type: io.kestra.plugin.scripts.runner.docker.Docker
  beforeCommands:
    - pip install requests kestra
  env:
    WEAVIATE_URL: "{{ inputs.weaviate_url }}"
    WEAVIATE_API_KEY: "{{ secret('WEAVIATE_API_KEY') }}"
  script: |
    import os
    import sys
    import json
    import requests
    from kestra import Kestra

    base_url = os.environ.get("WEAVIATE_URL", "").rstrip("/")
    url = f"{base_url}/v1/meta"
    token = os.environ.get("WEAVIATE_API_KEY", "")
    headers = {}
    if token:
        headers["Authorization"] = f"Bearer {token}"

    try:
        resp = requests.get(url, headers=headers, timeout=15)
        resp.raise_for_status()
        data = resp.json()
    except Exception as e:
        print(f"Error fetching Weaviate meta endpoint: {e}", file=sys.stderr)
        sys.exit(1)

    modules = data.get("modules", {})
    modules_count = len(modules) if isinstance(modules, dict) else 0
    version = str(data.get("version", "unknown"))

    audit_payload = {
        "modules_count": modules_count,
        "version": version
    }

    with open("weaviate_meta_health.json", "w") as f:
        json.dump(audit_payload, f)

    Kestra.outputs({
        "modules_count": modules_count,
        "version": version
    })
  outputFiles:
    - weaviate_meta_health.json
- id: evaluate_and_alert
  type: io.kestra.plugin.core.flow.If
  condition: '{{ fromJson(outputs.audit_weaviate.outputFiles[''weaviate_meta_health.json'']).modules_count
    == 0 }}'
  then:
  - id: notify_slack
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: '{{ secret(''SLACK_WEBHOOK'') }}'
    payload: ':warning: *Weaviate Semantic Modules Missing*\n*Endpoint:* {{ inputs.weaviate_url
      }}\n*Version:* {{ fromJson(outputs.audit_weaviate.outputFiles[''weaviate_meta_health.json'']).version
      }}\n*Active Vectorizer Modules:* {{ fromJson(outputs.audit_weaviate.outputFiles[''weaviate_meta_health.json'']).modules_count
      }}\n*Impact:* Text2vec and generative query modules are not loaded.'
errors:
- id: handle_inspection_failure
  type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
  url: '{{ secret(''SLACK_WEBHOOK'') }}'
  payload: ':rotating_light: *Execution Failure: Weaviate Vector Engine Semantic Modules
    Status Sentinel*\n*Execution ID:* `{ execution.id }`\n*State:* `{ execution.state.current
    }`\n*Error:* Sentinel inspection encountered an unhandled execution error.'
triggers:
- id: scheduled_monitor
  type: io.kestra.plugin.core.trigger.Schedule
  cron: 0 8 * * *
  disabled: true
extend:
  metaDescription: "Probes Weaviate vector engine meta endpoint to verify vectorizer module operational readiness and schema compatibility."
  metaTitle: Weaviate Vector Engine Semantic Modules Status Sentinel with Kestra
  title: Weaviate Vector Engine Semantic Modules Status Sentinel
  shortDescription: Probes Weaviate vector engine meta endpoint to verify vectorizer
    module operational readiness and schema compatibility.
  description: '## How it works

    This automated sentinel flow continuously assesses operational health, metrics,
    and capacity parameters for **Weaviate Vector Engine Semantic Modules Status Sentinel**.
    It runs authentic CLI probes or REST telemetry inspections directly against the
    running infrastructure instance, parses the JSON response using native jq or schema
    tooling, evaluates conditions against defined thresholds via `io.kestra.plugin.core.flow.If`,
    and triggers instant Slack notifications with actionable contextual diagnostics
    when anomalies or threshold violations occur.


    ## What you get

    - **Proactive Anomaly Detection**: Identifies performance degradation, quorum
    imbalance, or storage exhaustion before service disruption occurs.

    - **Configurable Operational Guardrails**: Fully parametric threshold inputs allowing
    zero-code adjustments across staging and production clusters.

    - **Instant Incident Dispatch**: Context-rich Slack alerting featuring detailed
    metrics, node identities, and mitigation recommendations.

    - **Zero Mock Logic**: Executes genuine network probes and command-line evaluations
    with strict error handling and top-level error routines.


    ## Who it''s for

    - Platform and Site Reliability Engineers managing mission-critical distributed
    systems.

    - Database and Infrastructure Administrators responsible for high-availability
    uptime and cluster capacity planning.

    - DevOps engineers automating self-healing data platform pipelines with Kestra.


    ## Why orchestrate this with Kestra

    - **Stateless & Scalable**: Runs on Kestra''s distributed execution engine without
    needing dedicated daemon agents on monitored hosts.

    - **Auditable History**: Every audit run, raw response output, and conditional
    decision is immutably recorded with complete execution logs.

    - **Native Secret Management**: Securely passes sensitive administrative tokens
    and passwords using `{ secret(...) }` expressions without log exposure.

    - **Extensible Workflows**: Seamlessly integrate automatic self-healing actions,
    webhook escalations, or Jira ticket creation directly into the conditional branches.


    ## Prerequisites

    - Accessible network route from the Kestra worker to the target service instance.

    - Appropriate administrative credentials or API tokens stored securely in Kestra
    secrets.

    - Active Slack Incoming Webhook URL configured as `SLACK_WEBHOOK` secret.


    ## Quick start

    1. Import or paste this workflow definition into your Kestra instance.

    2. Configure the required secrets (`SLACK_WEBHOOK`, administrative credentials)
