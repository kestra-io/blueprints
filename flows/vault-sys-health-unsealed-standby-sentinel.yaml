id: vault-sys-health-unsealed-standby-sentinel
namespace: company.security

inputs:
  - id: vault_addr
    type: STRING
    defaults: "http://vault.internal:8200"
    description: Host and port of the HashiCorp Vault server.

tasks:
  - id: inspect_vault_health
    type: io.kestra.plugin.scripts.shell.Commands
    commands:
      - |
        # Query HashiCorp Vault sys health endpoint
        curl -s "{{ inputs.vault_addr }}/v1/sys/health" > /tmp/vault_health.json

        python3 -c "
        import json
        try:
            with open('/tmp/vault_health.json') as f:
                data = json.load(f)
            initialized = data.get('initialized', False)
            sealed = data.get('sealed', True)
            standby = data.get('standby', False)
            version = data.get('version', 'unknown')
            is_breach = 1 if sealed or not initialized else 0
            print(f'{is_breach}|{initialized}|{sealed}|{version}')
        except Exception:
            print('1|False|True|unknown')
        " > /tmp/vault_summary.txt

        IS_BREACH=
        IS_INIT=
        IS_SEALED=
        VERSION=
        
        echo "::set-output name=is_breach::0::"
        echo "::set-output name=is_init::::"
        echo "::set-output name=is_sealed::::"
        echo "::set-output name=version::::"

  - id: evaluate_vault_state
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.inspect_vault_health.vars.is_breach | int == 1 }}"
    then:
      - id: notify_security_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#security-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 HashiCorp Vault Sealed / Uninitialized Alert",
                "text": "Vault instance at {{ inputs.vault_addr }} is in an unready state (Sealed: {{ outputs.inspect_vault_health.vars.is_sealed }}, Initialized: {{ outputs.inspect_vault_health.vars.is_init }}). All application secret decryption and token issuance is blocked.",
                "footer": "Kestra Security Sentinel • HashiCorp Vault"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#security-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ Vault Sentinel Failure",
            "text": "Failed to query health endpoint on HashiCorp Vault at {{ inputs.vault_addr }}.",
            "footer": "Kestra Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/5 * * * *"
    disabled: true

extend:
  ee: false
  demo: false
  title: HashiCorp Vault Sealed Status and Readiness Sentinel
  shortDescription: Audits HashiCorp Vault cluster health to detect sealed state, uninitialized storage, and unready standby nodes.
  description: |
    ## How it works
    This workflow connects to the HashiCorp Vault sys health HTTP API () to audit operational readiness. In high-security enterprise environments, Vault provides centralized secrets management, dynamic database credential leasing, and PKI certificate authority issuance. Following node reboots, maintenance restarts, or unseal key quota resets, Vault nodes return to an unsealed state where master keys are encrypted in memory. This sentinel audits sealed status and dispatches high-priority incident notifications before dependent microservices fail secret lookups.

    ## What you get
    - Real-time detection of sealed or uninitialized HashiCorp Vault nodes.
    - Early warning before enterprise secret injection pipelines fail.
    - Contextual Slack alerts detailing initialization and sealed state.

    ## Who it's for
    - Security Engineers and SREs maintaining production HashiCorp Vault clusters.
    - Platform Operations teams managing automated cloud secret delivery.
    - Compliance officers ensuring 99.99% availability of IAM key management.

    ## Why orchestrate this with Kestra
    - **High-Frequency Surveillance**: Executes lightweight health checks every 5 minutes.
    - **Native API Capabilities**: Interacts directly with Vault health endpoints without requiring active client tokens.
    - **Cross-Layer Telemetry**: Alerts engineering teams across standard communication channels.

    ## Prerequisites
    - HashiCorp Vault server with accessible HTTP API ().
    - Slack incoming webhook URL configured in  secret.

    ## Quick start
    1. Import this blueprint into your Kestra instance.
    2. Add  to your namespace secrets.
    3. Specify .
    4. Enable the schedule trigger for continuous seal state monitoring.

    ## How to extend
    - Trigger an automated auto-unseal workflow using AWS KMS or Azure Key Vault unseal keys.
    - Query  to verify high-availability raft leader election.
    - Route critical alerts to PagerDuty or Opsgenie.

    ## Links
    - [HashiCorp Vault Sys Health Documentation](https://developer.hashicorp.com/vault/api-docs/system/health)
    - [Kestra Shell Plugin](https://kestra.io/plugins/plugin-scripts-shell)
    - [Kestra Slack Notifications](https://kestra.io/plugins/plugin-slack)
  tags:
    - Infrastructure
    - Cloud
