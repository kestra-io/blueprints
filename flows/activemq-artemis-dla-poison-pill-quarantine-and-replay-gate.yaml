id: activemq-artemis-dla-poison-pill-quarantine-and-replay-gate
namespace: company.messaging

description: |
  Inspect Apache ActiveMQ Artemis Dead Letter Address (DLA) message accumulation via the Jolokia JMX API,
  differentiate between permanent poison pills and transient redeliveries against historical KV state,
  pause for operator approval, safely route poison records to an isolated quarantine queue while replaying
  transient messages back to their originating addresses, and verify post-remediation queue depths.

inputs:
  - id: artemis_jolokia_url
    type: STRING
    displayName: Artemis Jolokia Management URL
    description: Base HTTP endpoint for the ActiveMQ Artemis Jolokia JMX REST interface.
    defaults: "http://localhost:8161/console/jolokia"

  - id: broker_name
    type: STRING
    displayName: Artemis Broker Name
    description: Name of the target ActiveMQ Artemis broker instance in the JMX domain.
    defaults: "localhost"

  - id: dla_address
    type: STRING
    displayName: Dead Letter Address (DLA)
    description: Target Dead Letter Address to audit and triage.
    defaults: "DLQ"

  - id: dla_queue
    type: STRING
    displayName: Dead Letter Queue Name
    description: Anycast queue bound to the Dead Letter Address.
    defaults: "DLQ"

  - id: quarantine_queue
    type: STRING
    displayName: Poison Pill Quarantine Queue
    description: Isolated destination queue for permanent poison pills and invalid payloads.
    defaults: "QUARANTINE.orders"

  - id: routing_type
    type: SELECT
    displayName: Routing Type
    description: Artemis routing type for target queues.
    values:
      - "anycast"
      - "multicast"
    defaults: "anycast"

  - id: max_dla_threshold
    type: INT
    displayName: DLA Accumulation Warning Threshold
    description: Dead-letter message count threshold triggering immediate escalation and remediation.
    defaults: 10

  - id: max_batch_size
    type: INT
    displayName: Max Inspection Batch Size
    description: Maximum number of dead-letter messages to inspect and triage in a single execution run.
    defaults: 50

  - id: dry_run
    type: BOOL
    displayName: Dry Run Mode
    description: When true, classifies messages and plans recovery without moving or retrying messages in Artemis.
    defaults: true

triggers:
  - id: periodic_dla_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: Run automated ActiveMQ Artemis dead-letter triage and poison pill inspection every 15 minutes.
    cron: "*/15 * * * *"
    disabled: true

  - id: on_demand_dla_webhook
    type: io.kestra.plugin.core.trigger.Webhook
    description: Authenticated HTTP webhook endpoint triggered by broker alarms, Prometheus Alertmanager, or SRE runbooks.
    key: "{{ secret('ARTEMIS_DLA_WEBHOOK_KEY') }}"

tasks:
  - id: validate_inputs
    type: io.kestra.plugin.core.execution.Assert
    description: Assert configuration parameters satisfy sanity constraints.
    conditions:
      - "{{ inputs.artemis_jolokia_url | length > 0 }}"
      - "{{ inputs.dla_address | length > 0 }}"
      - "{{ inputs.dla_queue | length > 0 }}"
      - "{{ inputs.quarantine_queue | length > 0 }}"
      - "{{ inputs.max_dla_threshold >= 1 }}"
      - "{{ inputs.max_batch_size >= 1 }}"
    errorMessage: "Invalid inputs. Provide valid broker URLs, queue names, and positive inspection thresholds."

  - id: get_dla_message_count
    type: io.kestra.plugin.core.http.Request
    description: Query Artemis Jolokia endpoint for current message count on the Dead Letter Queue.
    uri: "{{ inputs.artemis_jolokia_url }}/read/org.apache.activemq.artemis:broker=%22{{ inputs.broker_name }}%22,component=addresses,address=%22{{ inputs.dla_address }}%22,subcomponent=queues,routing-type=%22{{ inputs.routing_type }}%22,queue=%22{{ inputs.dla_queue }}%22/MessageCount"
    method: GET
    headers:
      Accept: application/json
    contentType: application/json
    options:
      timeout: PT15S

  - id: list_dla_messages
    type: io.kestra.plugin.core.http.Request
    description: Retrieve dead-letter message metadata, original destinations, and exception attributes via Artemis QueueControl JMX.
    uri: "{{ inputs.artemis_jolokia_url }}/exec/org.apache.activemq.artemis:broker=%22{{ inputs.broker_name }}%22,component=addresses,address=%22{{ inputs.dla_address }}%22,subcomponent=queues,routing-type=%22{{ inputs.routing_type }}%22,queue=%22{{ inputs.dla_queue }}%22/listMessages(java.lang.String)"
    method: POST
    headers:
      Accept: application/json
      Content-Type: application/json
    contentType: application/json
    body: '[""]'
    options:
      timeout: PT30S

  - id: inspect_and_classify_dla
    type: io.kestra.plugin.scripts.python.Script
    description: Classify dead-letter records into poison pills versus transient retryable messages, diffing against previous KV state.
    containerImage: python:3.11-slim
    env:
      DLA_QUEUE: "{{ inputs.dla_queue }}"
      QUARANTINE_QUEUE: "{{ inputs.quarantine_queue }}"
      MAX_DLA_THRESHOLD: "{{ inputs.max_dla_threshold }}"
      MAX_BATCH_SIZE: "{{ inputs.max_batch_size }}"
      DRY_RUN: "{{ inputs.dry_run }}"
      COUNT_RESPONSE_JSON: "{{ outputs.get_dla_message_count.body }}"
      LIST_RESPONSE_JSON: "{{ outputs.list_dla_messages.body }}"
      PREVIOUS_STATE_JSON: "{{ kv('artemis_dla_tracker_' ~ (inputs.dla_queue | slugify), errorOnMissing=false) ?? '{}' }}"
      EXECUTION_ID: "{{ execution.id }}"
    script: |
      import os
      import sys
      import json
      from datetime import datetime, timezone

      now_utc = datetime.now(timezone.utc)
      now_iso = now_utc.isoformat()

      dla_queue = os.environ.get("DLA_QUEUE", "DLQ").strip()
      quarantine_queue = os.environ.get("QUARANTINE_QUEUE", "QUARANTINE.orders").strip()
      max_dla_threshold = int(os.environ.get("MAX_DLA_THRESHOLD", "10"))
      max_batch_size = int(os.environ.get("MAX_BATCH_SIZE", "50"))
      dry_run = os.environ.get("DRY_RUN", "true").lower() == "true"
      execution_id = os.environ.get("EXECUTION_ID", "local-test")

      # Parse current message count from Jolokia read output
      count_resp_raw = os.environ.get("COUNT_RESPONSE_JSON", "{}")
      try:
          count_data = json.loads(count_resp_raw) if count_resp_raw.strip() else {}
          current_message_count = int(count_data.get("value", 0))
      except Exception:
          current_message_count = 0

      # Parse listMessages response from Jolokia exec output
      list_resp_raw = os.environ.get("LIST_RESPONSE_JSON", "{}")
      raw_messages = []
      try:
          list_data = json.loads(list_resp_raw) if list_resp_raw.strip() else {}
          val = list_data.get("value", [])
          if isinstance(val, str):
              raw_messages = json.loads(val)
          elif isinstance(val, list):
              raw_messages = val
      except Exception as exc:
          print(f"Warning parsing listMessages response: {exc}")
          raw_messages = []

      # Parse historical KV tracker
      prev_state_raw = os.environ.get("PREVIOUS_STATE_JSON", "{}")
      try:
          prev_state = json.loads(prev_state_raw) if prev_state_raw.strip() else {}
      except Exception:
          prev_state = {}

      prev_count = int(prev_state.get("message_count", 0))
      prev_stuck_counts = prev_state.get("message_stuck_counts", {})
      count_delta = current_message_count - prev_count

      # Apache Artemis never exposes a per-message redelivery/delivery-count attribute via
      # QueueControl#listMessages (it is tracked on the transient MessageReference, not the
      # message itself, so it cannot appear in this JMX payload). Fatal classification instead
      # relies on (a) known fatal exception signatures set as message properties by the
      # consumer's error handler, or (b) a message remaining stuck in the DLA across multiple
      # consecutive audit cycles with no such signature, tracked via Kestra KV below.
      STUCK_CYCLES_THRESHOLD = 3

      poison_signatures = [
          "jsonparseexception",
          "nullpointerexception",
          "illegalargumentexception",
          "classcastexception",
          "schemavalidation",
          "deserialization",
          "unsupportedoperationexception",
          "badrequest"
      ]

      quarantine_messages = []
      replay_messages = []
      observed_message_ids = []
      message_stuck_counts = {}

      for msg in raw_messages[:max_batch_size]:
          msg_id = msg.get("messageID")
          if msg_id is None:
              continue
          msg_id_key = str(msg_id)

          observed_message_ids.append(msg_id)
          # Artemis's QueueControl#listMessages returns a FLAT map per message (messageID,
          # address, durable, timestamp, priority, plus every custom/broker-set property
          # merged at the top level) -- there is no nested "properties" object.
          orig_address = msg.get("_AMQ_ORIG_ADDRESS", "unknown")
          orig_queue = msg.get("_AMQ_ORIG_QUEUE", orig_address)
          exc_class = str(msg.get("exception_class", msg.get("exceptionClass", ""))).lower()
          exc_message = str(msg.get("exception_message", msg.get("exceptionMessage", "")))

          stuck_cycles = int(prev_stuck_counts.get(msg_id_key, 0)) + 1
          message_stuck_counts[msg_id_key] = stuck_cycles

          has_fatal_signature = any(sig in exc_class for sig in poison_signatures)
          is_poison = has_fatal_signature or stuck_cycles >= STUCK_CYCLES_THRESHOLD

          if is_poison:
              if has_fatal_signature:
                  reason = f"Fatal exception signature ({exc_class})."
              else:
                  reason = f"Stuck in DLA across {stuck_cycles} consecutive audit cycles with no resolution."
              if exc_message:
                  reason += f" Detail: {exc_message}"
              quarantine_messages.append({
                  "message_id": msg_id,
                  "orig_address": orig_address,
                  "orig_queue": orig_queue,
                  "classification": "POISON_PILL",
                  "stuck_cycles": stuck_cycles,
                  "reason": reason + " Routed to quarantine.",
                  "target_queue": quarantine_queue
              })
          else:
              replay_messages.append({
                  "message_id": msg_id,
                  "orig_address": orig_address,
                  "orig_queue": orig_queue,
                  "classification": "TRANSIENT_RETRYABLE",
                  "stuck_cycles": stuck_cycles,
                  "reason": f"Transient error signature ({exc_class or 'unspecified'}), observed {stuck_cycles} cycle(s). Eligible for replay.",
                  "target_address": orig_address
              })

      total_actionable = len(quarantine_messages) + len(replay_messages)
      threshold_exceeded = current_message_count >= max_dla_threshold
      has_remediation = total_actionable > 0

      status = "CRITICAL" if (len(quarantine_messages) > 0 or threshold_exceeded) else ("WARNING" if current_message_count > 0 else "HEALTHY")

      summary = (
          f"ActiveMQ Artemis DLA Triage: {status} | Queue '{dla_queue}' has {current_message_count} messages (delta: {count_delta:+d}). "
          f"Inspected: {len(observed_message_ids)} | Poison pills: {len(quarantine_messages)} | Retryable transient: {len(replay_messages)} | "
          f"Dry run: {dry_run}."
      )
      print(summary)

      new_state_snapshot = {
          "dla_queue": dla_queue,
          "message_count": current_message_count,
          "observed_message_ids": observed_message_ids,
          "message_stuck_counts": message_stuck_counts,
          "quarantine_count": len(quarantine_messages),
          "replay_count": len(replay_messages),
          "last_evaluated_at": now_iso,
          "execution_id": execution_id
      }

      print("::" + json.dumps({
          "outputs": {
              "status": status,
              "current_message_count": current_message_count,
              "count_delta": count_delta,
              "threshold_exceeded": threshold_exceeded,
              "has_remediation": has_remediation,
              "quarantine_count": len(quarantine_messages),
              "replay_count": len(replay_messages),
              "quarantine_messages": quarantine_messages,
              "replay_messages": replay_messages,
              "new_state_snapshot": new_state_snapshot,
              "summary": summary
          }
      }) + "::")

  - id: save_dla_state_tracker_kv
    type: io.kestra.plugin.core.kv.Set
    description: Persist dead-letter queue depth and observed message identifiers in Kestra KV for differential trend tracking.
    key: "artemis_dla_tracker_{{ inputs.dla_queue | slugify }}"
    value: "{{ outputs.inspect_and_classify_dla.vars.new_state_snapshot | toJson }}"
    kvType: JSON

  - id: evaluate_dla_findings
    type: io.kestra.plugin.core.flow.If
    description: Branch execution when dead-letter messages or poison pills are detected.
    condition: "{{ outputs.inspect_and_classify_dla.vars.has_remediation == true }}"
    then:
      - id: notify_messaging_triage
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatch incident notification with classified poison pills and retryable message telemetry.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#messaging-ops",
            "attachments": [
              {
                "color": "{{ outputs.inspect_and_classify_dla.vars.status == 'CRITICAL' ? 'danger' : 'warning' }}",
                "title": ":warning: ActiveMQ Artemis Dead Letter Queue Triage Triggered",
                "text": "*Queue:* `{{ inputs.dla_queue }}`\n*Current DLA Count:* `{{ outputs.inspect_and_classify_dla.vars.current_message_count }}` (Delta: `{{ outputs.inspect_and_classify_dla.vars.count_delta }}`)\n*Poison Pills for Quarantine:* `{{ outputs.inspect_and_classify_dla.vars.quarantine_count }}`\n*Transient Messages for Replay:* `{{ outputs.inspect_and_classify_dla.vars.replay_count }}`\n*Dry Run:* `{{ inputs.dry_run }}`",
                "footer": "Kestra Artemis DLA Sentinel • Execution {{ execution.id }}"
              }
            ]
          }

      - id: execute_remediation_gate
        type: io.kestra.plugin.core.flow.If
        description: Execute poison message quarantine and transient replay when dry_run is disabled.
        condition: "{{ not inputs.dry_run }}"
        then:
          - id: pause_for_remediation_approval
            type: io.kestra.plugin.core.flow.Pause
            description: Pause workflow execution for operator verification before moving messages in the Artemis broker. Resume to apply or kill to abort.

          - id: quarantine_poison_pills
            type: io.kestra.plugin.core.flow.Loop
            description: Move classified poison pill messages to the dedicated quarantine queue via Artemis QueueControl JMX.
            values: "{{ outputs.inspect_and_classify_dla.vars.quarantine_messages }}"
            tasks:
              - id: move_poison_to_quarantine
                type: io.kestra.plugin.core.http.Request
                description: Invoke Artemis moveMessage(long,String) JMX operation, targeted by exact message ID, to isolate the poison message.
                uri: "{{ inputs.artemis_jolokia_url }}/exec/org.apache.activemq.artemis:broker=%22{{ inputs.broker_name }}%22,component=addresses,address=%22{{ inputs.dla_address }}%22,subcomponent=queues,routing-type=%22{{ inputs.routing_type }}%22,queue=%22{{ inputs.dla_queue }}%22/moveMessage(long,java.lang.String)"
                method: POST
                headers:
                  Accept: application/json
                  Content-Type: application/json
                contentType: application/json
                body: "[{{ fromJson(item.value).message_id }}, \"{{ inputs.quarantine_queue }}\"]"

          - id: replay_transient_messages
            type: io.kestra.plugin.core.flow.Loop
            description: Replay validated transient messages back to their originating destination address.
            values: "{{ outputs.inspect_and_classify_dla.vars.replay_messages }}"
            tasks:
              - id: retry_message_to_origin
                type: io.kestra.plugin.core.http.Request
                description: Invoke Artemis retryMessage(long) JMX operation, targeted by exact message ID, to return the transient message to its originating queue.
                uri: "{{ inputs.artemis_jolokia_url }}/exec/org.apache.activemq.artemis:broker=%22{{ inputs.broker_name }}%22,component=addresses,address=%22{{ inputs.dla_address }}%22,subcomponent=queues,routing-type=%22{{ inputs.routing_type }}%22,queue=%22{{ inputs.dla_queue }}%22/retryMessage(long)"
                method: POST
                headers:
                  Accept: application/json
                  Content-Type: application/json
                contentType: application/json
                body: "[{{ fromJson(item.value).message_id }}]"

          - id: verify_post_remediation_dla_count
            type: io.kestra.plugin.core.http.Request
            description: Post-remediation verification re-querying DLA message count to confirm queue drain.
            uri: "{{ inputs.artemis_jolokia_url }}/read/org.apache.activemq.artemis:broker=%22{{ inputs.broker_name }}%22,component=addresses,address=%22{{ inputs.dla_address }}%22,subcomponent=queues,routing-type=%22{{ inputs.routing_type }}%22,queue=%22{{ inputs.dla_queue }}%22/MessageCount"
            method: GET
            headers:
              Accept: application/json
            contentType: application/json

          - id: assert_dla_depth_reduced
            type: io.kestra.plugin.core.execution.Assert
            description: Assert post-remediation DLA message count decreased as expected.
            conditions:
              - "{{ fromJson(outputs.verify_post_remediation_dla_count.body).value <= outputs.inspect_and_classify_dla.vars.current_message_count }}"
            errorMessage: "Post-remediation verification failed: DLA message count did not decrease after executing quarantine and replay."

          - id: log_remediation_success
            type: io.kestra.plugin.core.log.Log
            description: Log verified remediation results.
            message: "Successfully quarantined {{ outputs.inspect_and_classify_dla.vars.quarantine_count }} poison message(s) and replayed {{ outputs.inspect_and_classify_dla.vars.replay_count }} transient message(s). Post-remediation DLA count: {{ fromJson(outputs.verify_post_remediation_dla_count.body).value }}."

        else:
          - id: log_dry_run_summary
            type: io.kestra.plugin.core.log.Log
            description: Log planned quarantine and replay actions in dry-run mode.
            message: "Dry run mode active. No messages moved. Planned: {{ outputs.inspect_and_classify_dla.vars.quarantine_count }} to quarantine ('{{ inputs.quarantine_queue }}'), {{ outputs.inspect_and_classify_dla.vars.replay_count }} to replay."

errors:
  - id: alert_flow_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Dispatch failure notification if broker communication or triage fails.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "#messaging-ops",
        "attachments": [
          {
            "color": "danger",
            "title": ":rotating_light: ActiveMQ Artemis DLA Triage Flow Failed",
            "text": "Execution `{{ execution.id }}` failed while inspecting queue `{{ inputs.dla_queue }}` on broker `{{ inputs.broker_name }}` (`{{ inputs.artemis_jolokia_url }}`). Check Jolokia credentials and broker connectivity."
          }
        ]
      }

extend:
  title: Apache ActiveMQ Artemis DLA Poison Pill Quarantine and Replay Gate
  metaTitle: Apache ActiveMQ Artemis DLA Poison Pill Quarantine & Replay Gate | Kestra
  shortDescription: Audit ActiveMQ Artemis Dead Letter Addresses, isolate poison pills to quarantine queues, safely replay transient messages with approval gates, and verify recovery.
  metaDescription: Audit ActiveMQ Artemis DLQ, isolate poison pills to quarantine queues, safely replay transient messages with approval gates, and verify recovery in Kestra.
  description: |
    Production messaging backbones powered by Apache ActiveMQ Artemis often experience message
    delivery failures when consumer services crash or reject unprocessable records. When an
    application consumer fails repeatedly and exceeds the broker's configured `max-delivery-attempts`
    threshold, Artemis moves the unacknowledged payload into a Dead Letter Address (DLA), typically `DLQ`.

    In high-throughput enterprise pipelines, blind batch replay of dead-letter messages causes
    severe incident escalation: if an unhandled poison pill record (such as a malformed JSON payload,
    broken schema, or unsupported payload class) is replayed back to the active queue, it immediately
    crashes consumer pods again in an infinite redelivery loop. Conversely, leaving transiently failed
    messages stranded in the DLA indefinitely causes data loss, payment stalls, and customer ticket escalations.

    This blueprint provides an automated dead-letter triage and recovery gate. It inspects Artemis
    dead-letter messages via the Jolokia JMX management endpoint, diffs queue depth and message progression
    against historical snapshots in Kestra KV, differentiates between fatal poison pills and transient
    redeliveries, pauses for human operator approval, routes poison pills to an isolated quarantine queue,
    replays retryable messages back to their originating addresses, and verifies post-remediation queue depth.

    ## How it works

    1. **Pre-flight Assertion**: The workflow asserts that connection endpoints, queue names, and inspection thresholds meet sanity limits.
    2. **Telemetry Query**: `io.kestra.plugin.core.http.Request` queries the Artemis Jolokia endpoint to retrieve the current `MessageCount` of the designated Dead Letter Queue.
    3. **Message Inspection**: A secondary HTTP request invokes the Artemis `QueueControl` JMX operation `listMessages(java.lang.String)` to pull each message's broker-set `_AMQ_ORIG_ADDRESS` / `_AMQ_ORIG_QUEUE` headers plus any application-set exception properties (e.g. `exception_class`/`exception_message`, if your consumer's error handler sets them before the message lands on the DLA). Artemis does not expose a per-message redelivery count via this call, since it lives on the transient message reference rather than the message itself.
    4. **Differential Classification**: An isolated Python inspection task compares current messages against historical snapshots stored in Kestra KV under `artemis_dla_tracker_{dla_queue}`. Messages are classified into:
       - `POISON_PILL`: Payloads exhibiting fatal deserialization/schema-validation exception signatures, or messages observed stuck in the DLA across 3+ consecutive audit cycles with no resolution.
       - `TRANSIENT_RETRYABLE`: Everything else - messages failing due to temporary socket timeouts or downstream service unavailability, not yet stuck long enough to be treated as permanent.
    5. **State Tracking**: `io.kestra.plugin.core.kv.Set` persists the updated queue depth and a per-message consecutive-stuck-cycle counter in Kestra KV for sequential differential trend detection.
    6. **Team Escalation**: `io.kestra.plugin.slack.notifications.SlackIncomingWebhook` dispatches an operational triage alert with current DLA depth, count deltas, and planned actions.
    7. **Safe Remediation with Approval Gate**: When `dry_run` is disabled:
       - Execution pauses (`io.kestra.plugin.core.flow.Pause`) for operator review of classified items.
       - `io.kestra.plugin.core.flow.Loop` iterates over poison pill records and moves each one, by exact message ID, to the quarantine queue (`QUARANTINE.orders`) using the Artemis JMX `moveMessage(long, String)` operation.
       - A second loop invokes `retryMessage(long)`, by exact message ID, to return transient messages to their originating address.
    8. **Post-Remediation Verification**: The flow re-queries the DLA message count via Jolokia and executes `io.kestra.plugin.core.execution.Assert` to verify that queue depth has decreased as planned.

    ## What you get

    - Automated triage of accumulated dead-letter messages in ActiveMQ Artemis without manual JMX console browsing.
    - Protection against recursive consumer crashes by isolating poison pill payloads to a dedicated quarantine queue.
    - Safe automated replay of transiently failed messages back to their originating queues.
    - Operator approval gates and dry-run simulation to prevent unintended bulk message moves.
    - Differential trend tracking across runs using Kestra KV store.
    - Verified post-remediation assertions confirming queue depth reduction.

    ## Who it's for

    - Messaging Middleware Administrators managing Apache ActiveMQ Artemis clusters.
    - Event-Driven Architecture and Streaming Engineers operating asynchronous microservice backbones.
    - Site Reliability Engineers (SREs) triaging dead-letter queues and incident queues.

    ## Why orchestrate this with Kestra

    ActiveMQ Artemis provides CLI commands and a Jolokia web console, but neither provides cross-run historical diffing, automated payload classification, human approval workflows, or multi-step verification.
    Building ad-hoc shell scripts or cron jobs creates unmonitored scripts that lack audit logs, credential masking, and automated Slack notifications.

    Orchestrating this guard with Kestra provides a declarative workflow with integrated KV state tracking, native HTTP/JMX execution, pause-and-resume approval gates, structured Slack notifications, and post-action verification.

    ## Prerequisites

    - An accessible Apache ActiveMQ Artemis broker (version 2.18 or higher) with the Jolokia JMX management endpoint enabled.
    - Target queues created on the broker (`DLQ`, source queues, and destination quarantine queue `QUARANTINE.orders`).
    - A Slack Incoming Webhook URL for incident notification.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook endpoint URL used for triage notifications and failure alerts.
    - `ARTEMIS_DLA_WEBHOOK_KEY`: Secret authentication key protecting the on-demand webhook trigger.

    ## Quick start

    1. Configure `SLACK_WEBHOOK_URL` and `ARTEMIS_DLA_WEBHOOK_KEY` in your Kestra namespace secrets.
    2. Import this blueprint and set `artemis_jolokia_url`, `broker_name`, `dla_queue`, and `quarantine_queue` to match your Artemis environment.
    3. Run a manual execution with `dry_run: true` to record an initial baseline and review planned message classifications.
    4. When ready to remediate live messages, run with `dry_run: false` and approve the paused execution.
    5. Enable the `periodic_dla_audit` schedule trigger to monitor Dead Letter Queues automatically every 15 minutes.

    ## How to extend

    - **Dead-Letter Payload Storage**: Add an `io.kestra.plugin.aws.s3.Upload` or `io.kestra.plugin.core.storage.Write` task to archive full poison pill JSON payloads to object storage before moving them.
    - **Consumer Container Restart**: Add an `io.kestra.plugin.kubernetes.pod.Delete` task to restart consumer pods after transient messages are replayed.
    - **PagerDuty Incident Trigger**: Integrate `io.kestra.plugin.pagerduty.notifications.PagerDutyAlert` to trigger high-priority on-call alerts if DLA depth exceeds emergency watermarks.

    ## Links

