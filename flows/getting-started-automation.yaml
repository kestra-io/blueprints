id: getting-started-automation
namespace: tutorial
description: |
  # Automation example
  Checks that an API is up and logs the result.

labels:
  name: "Example: Automation"

tasks:
  - id: check
    type: io.kestra.plugin.core.http.Request
    uri: https://dummyjson.com/test

  - id: report
    type: io.kestra.plugin.core.log.Log
    message: "API is up (HTTP {{ outputs.check.code }})"

errors:
  - id: alert # create a SLACK_WEBHOOK secret, then enable this task
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    disabled: true
    url: "{{ secret('SLACK_WEBHOOK') }}"
    messageText: "{{ flow.id }} failed: the API is down"

triggers:
  - id: every_morning
    type: io.kestra.plugin.core.trigger.Schedule
    disabled: true
    cron: "0 8 * * *"

extend:
  shortDescription: Check that an API is up and log the result, then enable a Slack alert for when it fails and a schedule to run the check every day.
  title: "Automation example: Getting started with Kestra"
  metaTitle: Getting started automation flow with Kestra
  metaDescription: "Check that an API is up and log the result, then enable a Slack alert for when it fails and a schedule to run the check every day."
  description: |
    A getting started automation flow that runs successfully on the very first execution with zero secrets. It calls a public health endpoint and logs that the API is up, so a new user sees a real result immediately. To make it yours, point it at your own API, enable the Slack alert that fires when the check fails, and turn on the daily schedule. It is the simplest way to see the check, then alert pattern working in Kestra before connecting your own services.

    ## How it works
    1. The `check` task (`io.kestra.plugin.core.http.Request`) calls a public health endpoint. No authentication is required. Any response other than 2xx fails the task.
    2. The `report` task (`io.kestra.plugin.core.log.Log`) logs the HTTP status so the first run shows a real result.
    3. The optional `alert` task (`io.kestra.plugin.slack.notifications.SlackIncomingWebhook`) sits in the flow's [`errors`](https://kestra.io/docs/workflow-components/errors) block, so it runs only when a task fails, and posts to Slack once you enable it.
    4. An optional `Schedule` trigger runs the check every day at 08:00.

    ## What you get
    - A working automation run on the first click, with no accounts or keys to configure.
    - A health check you can point at your own endpoint by changing one URL.
    - Failure alerting through the `errors` block, ready to enable with one secret.
    - A ready-to-enable schedule trigger.

    ## Who it's for
    - Ops and platform teams evaluating Kestra for automation and alerting.
    - Anyone new to Kestra who wants a green first run before connecting services.
    - Engineers building check and alert workflows on their own APIs.

    ## Why orchestrate this with Kestra
    A curl command in a cron job can hit an API, but it cannot retry on failure, alert only when something breaks, keep secrets out of the code, or record every run for audit. Kestra models the whole automation as declarative YAML with triggers, retries, an `errors` block for alerting, secret management, and full execution history. The same flow that checks one API today can, with a small change, open a ticket, page someone, or start a downstream pipeline.

    ## Prerequisites
    - A running Kestra instance.
    - (Optional) A Slack incoming webhook for alerts.

    ### Secrets
    The default green path uses no secrets. Optional steps use:

    - `SLACK_WEBHOOK`: Slack incoming webhook URL for the `alert` task.

    ## Quick start
    1. Add this flow to your Kestra instance and Execute it. It runs green with no setup.
    2. To check your own API, change the `check` URL.
    3. To get alerts, add a `SLACK_WEBHOOK` secret in the `tutorial` namespace (Namespaces > tutorial > Secrets) and remove `disabled: true` from the `alert` task.
    4. To run the check every day, remove `disabled: true` from the schedule trigger.

    ## How to extend
    - Check several endpoints, or branch on the response with `If` conditions.
    - Swap the Slack alert for email, Discord, PagerDuty, or a ticket.
    - Add `retry` to `check` so a single network error does not send an alert.
    - Add a `Webhook` trigger so another system can start the check.

    ## Links
    - [HTTP Request task](https://kestra.io/plugins/core/http/io.kestra.plugin.core.http.request)
    - [Errors block](https://kestra.io/docs/workflow-components/errors)
    - [Slack plugin](https://kestra.io/plugins/plugin-slack/slack-notifications/io.kestra.plugin.slack.notifications.slackincomingwebhook)
  tags:
    - Core
    - Business
  subTags:
    - Failure Alerting
    - Realtime Events
  ee: false
  demo: false
