id: simulate-machine-stops
namespace: company.team

description: |
  Test helper flow that publishes sample MQTT stop events to `plant/filler1/stops`.
  Use this to test downtime-root-cause-triage without a real PLC.

tasks:
  - id: long_stop
    type: io.kestra.plugin.mqtt.Publish
    server: tcp://host.docker.internal:1883
    topic: plant/filler1/stops
    serdeType: JSON
    from:
      - payload:
          machine_id: filler1
          line: CSD3
          reason_code: LOW_PRESSURE
          duration_min: 7

  - id: micro_stop
    type: io.kestra.plugin.mqtt.Publish
    server: tcp://host.docker.internal:1883
    topic: plant/filler1/stops
    serdeType: JSON
    from:
      - payload:
          machine_id: filler1
          line: CSD3
          reason_code: SENSOR_BLIP
          duration_min: 1

extend:
  shortDescription: "Publish sample MQTT events to test the downtime-root-cause-triage flow."
  title: "Machine Stop Event Simulator"
  description: |
    A helper flow that publishes two sample MQTT stop events to test the downtime-root-cause-triage blueprint.

    ## Events published

    1. **Long Stop (7 minutes):** Triggers the full AI analysis and Slack alert pathway.
       - Machine: `filler1`
       - Line: `CSD3`
       - Reason: `LOW_PRESSURE`
       - Duration: 7 minutes

    2. **Micro Stop (1 minute):** Triggers the short-stop log pathway (no AI, no Slack).
       - Machine: `filler1`
       - Line: `CSD3`
       - Reason: `SENSOR_BLIP`
       - Duration: 1 minute

    ## How to use

    1. Ensure your MQTT broker is running on `tcp://host.docker.internal:1883` (or update the server URL).
    2. Set up the `downtime-root-cause-triage` flow first.
    3. Run this flow to publish both events.
    4. Watch the triage flow execute: you should see 2 branch evaluations in the If task, with only the 7-minute event triggering AI analysis and Slack alerts.
    5. Verify Postgres has 2 new rows in `downtime_log`, and Slack received 1 alert.

    ## Customization

    Edit the MQTT payload fields to match your schema:
    - `machine_id`: Equipment identifier (e.g., "filler1", "capper2")
    - `line`: Production line (e.g., "CSD3", "BOTTLING_A")
    - `reason_code`: Freeform reason or code (e.g., "LOW_PRESSURE", "SENSOR_ERROR")
    - `duration_min`: Stop duration in minutes

    To publish more events, duplicate the task blocks with different payload values.
