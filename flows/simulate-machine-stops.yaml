id: simulate-machine-stops
namespace: company.team

description: |
  Test helper flow that publishes sample MQTT stop events to `plant/filler1/stops`.
  Use this to test downtime-root-cause-triage without a real PLC.

tasks:
  - id: long_stop
    type: io.kestra.plugin.mqtt.Publish
    server: tcp://host.docker.internal:1883
    clientId: kestra-downtime-simulator-long
    topic: plant/filler1/stops
    serdeType: JSON
    qos: 1
    from:
      machine_id: filler1
      line: CSD3
      reason_code: LOW_PRESSURE
      duration_min: 7

  - id: micro_stop
    type: io.kestra.plugin.mqtt.Publish
    server: tcp://host.docker.internal:1883
    clientId: kestra-downtime-simulator-micro
    topic: plant/filler1/stops
    serdeType: JSON
    qos: 1
    from:
      machine_id: filler1
      line: CSD3
      reason_code: SENSOR_BLIP
      duration_min: 1

extend:
  shortDescription: "Publish sample MQTT events to test the downtime-root-cause-triage flow."
  title: "Machine Stop Event Simulator"
  metaTitle: "MQTT Machine Stop Event Simulator for Kestra"
  metaDescription: "Publish long-stop and micro-stop JSON events over MQTT to test the manufacturing downtime triage flow without a PLC."
  description: |
    Publish a long stop and a micro-stop to the MQTT topic consumed by the downtime-root-cause-triage flow. This companion flow lets teams test both conditional paths without a PLC or production equipment.

    ## How it works

    1. `long_stop` publishes a JSON event to `plant/filler1/stops` with a 7-minute duration. The triage flow should run AI analysis and send a Slack alert.
    2. `micro_stop` publishes a JSON event to the same topic with a 1-minute duration. The triage flow should log the event without running AI or sending an alert.
    3. Both tasks use QoS 1 so the broker acknowledges delivery.

    ## What you get

    - Two representative MQTT payloads covering the long-stop and micro-stop branches.
    - A repeatable test path for the companion triage flow without a machine connection.
    - Separate client IDs and acknowledged MQTT publishes for the two events.

    ## Who it's for

    - Teams setting up or reviewing the downtime-root-cause-triage blueprint.
    - Reliability engineers who want to verify MQTT integration before connecting production equipment.

    ## Why orchestrate this with Kestra

    The simulator uses the same Kestra MQTT task as the production flow's event-driven architecture, so operators can inspect each publish in execution history and reproduce test events without a separate script or PLC.

    ## Prerequisites

    - A running MQTT broker reachable from the Kestra worker at `tcp://host.docker.internal:1883`, or update both task server values.
    - The `downtime-root-cause-triage` flow saved and listening on `plant/+/stops`.

    ### Secrets

    This simulator requires no secrets when used with the included local Mosquitto broker. Configure broker credentials in each MQTT task if your broker requires authentication.

    ## Quick start

    1. Start the local broker with `docker compose up -d` from the `kestra-dev` directory.
    2. Save the triage flow in the `company.team` namespace and confirm its MQTT trigger is active.
    3. Execute this simulator flow.
    4. Confirm two triage executions arrive, the 7-minute event runs AI and sends one Slack alert, and the 1-minute event takes the logging branch.
    5. Check the `downtime_log` table for both events.

    ## How to extend

    - Change the machine, line, reason code, or duration in either `from` map to match your event schema.
    - Add more publish tasks to exercise additional duration thresholds or machine topics.
    - Update the server and topic when using a different broker or triage-flow subscription.

    ## Links

    - [MQTT plugin documentation](https://kestra.io/plugins/plugin-mqtt)
    - [Downtime Root-Cause Triage blueprint](downtime-root-cause-triage)
  tags:
    - Infrastructure
  subTags:
    - Testing & Quality
    - Realtime Events
    - Monitoring & Alerting
  ee: false
  demo: false
