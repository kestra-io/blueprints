id: locust-load-test-slo-gate
namespace: company.team
description: |
  Run a headless Locust load test against a staging API after each deploy,
  keep the per-endpoint statistics, and fail the execution when the p95
  latency or the failure rate breaks the service-level objective, so a
  release flow can wait on it.

inputs:
  - id: host
    type: STRING
    defaults: "https://staging.example.com"
    displayName: "Target Host"
    description: "Base URL of the API under test. Point it at staging or a preview environment, never at production."
  - id: paths
    type: STRING
    defaults: "/health,/api/items"
    displayName: "Endpoints (GET, comma-separated)"
    description: "GET paths every simulated user calls in turn, for example `/health,/api/items`."
  - id: extra_header
    type: STRING
    defaults: "X-Request-Source: kestra-locust"
    displayName: "Extra Request Header"
    description: "One `Name: value` header sent with every request, for example a tenant or routing header."
  - id: users
    type: INT
    defaults: 20
    displayName: "Concurrent Users"
    description: "Peak number of simulated users."
  - id: spawn_rate
    type: INT
    defaults: 5
    displayName: "Spawn Rate (users/s)"
    description: "How many users start per second until the peak is reached."
  - id: run_time
    type: STRING
    defaults: "60s"
    displayName: "Run Time"
    description: "Test duration in Locust syntax, for example `60s`, `5m`."
  - id: p95_limit_ms
    type: INT
    defaults: 500
    displayName: "p95 Latency Limit (ms)"
    description: "The run fails when the aggregated 95th percentile response time is above this."
  - id: max_failure_pct
    type: FLOAT
    defaults: 1.0
    displayName: "Max Failure Rate (%)"
    description: "The run fails when more than this share of requests failed (HTTP errors, timeouts, connection errors)."

triggers:
  - id: after_staging_deploy
    type: io.kestra.plugin.core.trigger.Flow
    description: Run the load test every time the staging deploy flow succeeds. Shipped disabled; point it at your own deploy flow and enable it after a manual run.
    disabled: true
    dependsOn:
      - namespace: company.team
        flowId: deploy_staging
        states: [SUCCESS]

tasks:
  - id: load_test
    type: io.kestra.plugin.scripts.python.Commands
    description: Install a pinned Locust, write a small locustfile that calls the configured GET paths with the extra header, and run it headless with CSV output. Locust exits non-zero when any request fails, so the exit code is recorded instead of failing the task and the statistics are always kept.
    containerImage: python:3.12-slim
    env:
      TARGET_PATHS: "{{ inputs.paths }}"
      EXTRA_HEADER: "{{ inputs.extra_header }}"
    inputFiles:
      locustfile.py: |
        import os
        from locust import HttpUser, between, task

        PATHS = [p.strip() for p in os.environ.get("TARGET_PATHS", "/").split(",") if p.strip()]
        HEADER = os.environ.get("EXTRA_HEADER", "")


        class ApiUser(HttpUser):
            wait_time = between(0.5, 1.5)

            def on_start(self):
                if ":" in HEADER:
                    name, value = HEADER.split(":", 1)
                    self.client.headers[name.strip()] = value.strip()

            @task
            def get_paths(self):
                for path in PATHS:
                    self.client.get(path, name=path)
    beforeCommands:
      - pip install --quiet --disable-pip-version-check locust==2.46.7
    commands:
      - >-
        rc=0; locust -f locustfile.py --headless
        --users {{ inputs.users }} --spawn-rate {{ inputs.spawn_rate }} --run-time {{ inputs.run_time }}
        --host '{{ inputs.host }}' --csv run --only-summary
        || rc=$?; echo $rc > exit_code.txt; echo locust exit code $rc
    outputFiles:
      - run_stats.csv
      - run_failures.csv
      - exit_code.txt
    timeout: PT30M

  - id: evaluate_slo
    type: io.kestra.plugin.scripts.python.Script
    description: Read Locust's statistics CSV, take the Aggregated row for request count, failures, requests per second and p95, list each endpoint with its own p95 and failures, and decide whether the run breaks the SLO. No statistics, or zero requests, counts as a breach.
    containerImage: python:3.12-slim
    inputFiles:
      run_stats.csv: "{{ outputs.load_test.outputFiles['run_stats.csv'] ?? '' }}"
      run_failures.csv: "{{ outputs.load_test.outputFiles['run_failures.csv'] ?? '' }}"
    script: |
      import csv, json, os

      p95_limit = {{ inputs.p95_limit_ms }}
      max_failure_pct = {{ inputs.max_failure_pct }}

      def num(value):
          try:
              return float(value)
          except (TypeError, ValueError):
              return None

      result = {"verdict": "NO_DATA", "breached": True, "requests": 0, "failures": 0,
                "failure_pct": 0, "p95_ms": None, "rps": 0, "endpoints": [], "errors": [],
                "reasons": ["Locust produced no statistics; check the load_test logs."]}
      if os.path.exists("run_stats.csv") and os.path.getsize("run_stats.csv") > 0:
          rows = list(csv.DictReader(open("run_stats.csv", encoding="utf-8")))
          agg = next((r for r in rows if r["Name"] == "Aggregated"), None)
          requests = int(agg["Request Count"]) if agg else 0
          failures = int(agg["Failure Count"]) if agg else 0
          failure_pct = round(100 * failures / requests, 2) if requests else 0
          p95 = num(agg["95%"]) if agg else None
          reasons = []
          if requests == 0:
              reasons.append("no request was completed")
          if p95 is not None and p95 > p95_limit:
              reasons.append(f"p95 {p95:.0f} ms is above the {p95_limit} ms limit")
          if failure_pct > max_failure_pct:
              reasons.append(f"failure rate {failure_pct}% is above the {max_failure_pct}% limit")
          errors = []
          if os.path.exists("run_failures.csv") and os.path.getsize("run_failures.csv") > 0:
              errors = [f"{r['Method']} {r['Name']}: {r['Error'][:160]} x{r['Occurrences']}"
                        for r in csv.DictReader(open("run_failures.csv", encoding="utf-8"))]
          result = {"verdict": "BREACHED" if reasons else "PASSED", "breached": bool(reasons),
                    "requests": requests, "failures": failures, "failure_pct": failure_pct,
                    "p95_ms": p95, "rps": round(num(agg["Requests/s"]) or 0, 1) if agg else 0,
                    "endpoints": [f"{r['Type']} {r['Name']}: {r['Request Count']} req, {r['Failure Count']} failed, p95 {r['95%']} ms"
                                  for r in rows if r["Name"] != "Aggregated"],
                    "errors": errors, "reasons": reasons or ["within the SLO"]}
      print("::" + json.dumps({"outputs": result}) + "::")

  - id: log_results
    type: io.kestra.plugin.core.log.Log
    description: Log the verdict, the aggregated numbers, one line per endpoint and one line per error type, whatever the verdict.
    message: |
      Locust SLO gate for {{ inputs.host }}: {{ outputs.evaluate_slo.vars.verdict }} ({{ outputs.evaluate_slo.vars.reasons | join('; ') }})
      requests={{ outputs.evaluate_slo.vars.requests }} failures={{ outputs.evaluate_slo.vars.failures }} ({{ outputs.evaluate_slo.vars.failure_pct }}%) p95={{ outputs.evaluate_slo.vars.p95_ms }} ms rps={{ outputs.evaluate_slo.vars.rps }} users={{ inputs.users }} run_time={{ inputs.run_time }}
      {% for line in outputs.evaluate_slo.vars.endpoints %}- {{ line }}
      {% endfor %}{% for line in outputs.evaluate_slo.vars.errors %}! {{ line }}
      {% endfor %}

  - id: gate
    type: io.kestra.plugin.core.flow.If
    description: Fail the execution when the SLO is breached (or no statistics exist), so a parent or downstream release flow stops; otherwise end green.
    condition: "{{ outputs.evaluate_slo.vars.breached }}"
    then:
      - id: block_release
        type: io.kestra.plugin.core.execution.Fail
        description: Stop here with the reasons; the statistics CSVs stay attached to the execution.
        errorMessage: "Load test SLO BREACHED for {{ inputs.host }}: {{ outputs.evaluate_slo.vars.reasons | join('; ') }}. See log_results and the run_stats.csv output."
    else:
      - id: log_passed
        type: io.kestra.plugin.core.log.Log
        message: "Load test SLO met for {{ inputs.host }}: p95 {{ outputs.evaluate_slo.vars.p95_ms }} ms, {{ outputs.evaluate_slo.vars.failure_pct }}% failed."

outputs:
  - id: verdict
    type: STRING
    value: "{{ outputs.evaluate_slo.vars.verdict ?? 'NO_DATA' }}"

extend:
  title: "Locust Load Test SLO Gate"
  shortDescription: Run a headless Locust load test against staging after each deploy and fail the execution when p95 latency or the failure rate breaks your SLO.
  metaTitle: Locust Load Test SLO Gate for Releases | Kestra
  metaDescription: "Run a Locust load test after every staging deploy, keep per-endpoint stats, and block the release when p95 latency or the error rate breaks your SLO."
  description: |
    Functional tests pass with one user; production has hundreds. Latency regressions and errors that only appear under concurrency (a lock, a missing index, a race when two requests write the same record) slip through until real traffic finds them. This blueprint runs [Locust](https://locust.io) headless against a staging API after every deploy, keeps the per-endpoint statistics on the execution, and turns them into a pass/fail gate on p95 latency and failure rate that a release flow can wait on.

    ## How it works

    1. `after_staging_deploy` (`io.kestra.plugin.core.trigger.Flow`) starts the test when the `deploy_staging` flow ends in `SUCCESS`. It ships `disabled: true`; you can also run the flow by hand.
    2. `load_test` (`io.kestra.plugin.scripts.python.Commands`) installs a pinned `locust==2.46.7` in a `python:3.12-slim` container, writes a small locustfile from `inputFiles` (each simulated user calls every path in `paths` with the `extra_header`, pausing 0.5 to 1.5 s), and runs `locust --headless` for `run_time` at up to `users` users. Locust exits non-zero as soon as one request fails, so the exit code is captured and `run_stats.csv` and `run_failures.csv` are always kept as output files.
    3. `evaluate_slo` (`io.kestra.plugin.scripts.python.Script`) reads the `Aggregated` row for the request count, failures, requests per second and the 95th percentile, builds one line per endpoint and per error type, and marks the run `BREACHED` when the p95 is above `p95_limit_ms`, the failure rate is above `max_failure_pct`, or no request completed.
    4. `log_results` (`io.kestra.plugin.core.log.Log`) logs the verdict, the numbers, each endpoint and each error, for example `GET /api/state: 187 req, 4 failed, p95 15 ms`.
    5. `gate` (`io.kestra.plugin.core.flow.If`) fails the execution through `io.kestra.plugin.core.execution.Fail` when the SLO is breached, otherwise logs a pass. The `verdict` flow output exposes the result.

    ## What you get

    - A repeatable load test on every staging deploy, with the same users, ramp-up and duration each time.
    - A `PASSED` / `BREACHED` / `NO_DATA` verdict and a failed execution with the exact reason when the release should stop.
    - Locust's statistics and failure CSVs attached to every execution, so results can be compared deploy to deploy.
    - Errors grouped by endpoint and type, which points straight at the endpoint that breaks under concurrency.

    ## Who it's for

    - Backend and platform teams that want a performance check between staging and production.
    - SRE teams who own latency and error-rate SLOs.

    ## Why orchestrate this with Kestra

    A load test run from a laptop is run once, before launch, and never again. In Kestra it runs on every staging deploy through a Flow trigger, the statistics are kept with the execution history, the thresholds are typed inputs, and a breached SLO stops the downstream release with a clear error instead of a chart nobody opened.

    ## Prerequisites

    - A staging or preview API you are allowed to load test, and the GET endpoints to exercise.
    - A Kestra worker that can run containers (Docker or Kubernetes task runner) and reach the API and PyPI.
    - Optional: a `deploy_staging` flow in `company.team` for the trigger, or point the trigger at your own deploy flow.

    ### Secrets

    - None are required for a public staging API. For an authenticated one, add a secret such as `API_TOKEN` and set `extra_header` to an `Authorization: Bearer` header whose value is the Pebble expression `secret('API_TOKEN')`, so the token stays masked in logs.

    ## Quick start

    1. Set `host`, `paths` and, if needed, `extra_header`.
    2. Execute the flow with a small load (`users: 5`, `run_time: 20s`) and read `log_results`.
    3. Set `p95_limit_ms` and `max_failure_pct` from that baseline, then raise `users` and `run_time` to your real target.
    4. Point `after_staging_deploy` at your deploy flow and enable it.

    ## How to extend

    - Replace the generated locustfile with your own from a namespace file to add POST requests, login and weighted tasks.
    - Add a per-endpoint p95 limit for critical paths such as checkout or login.
    - Store each run's p95 in a KV entry and fail on a regression of more than a set percentage against the last green run.
    - Post `log_results` to Slack or open an incident with the notification plugins.

    ## Links

    - [Locust documentation](https://docs.locust.io/)
    - [Locust command-line and headless options](https://docs.locust.io/en/stable/configuration.html)
    - [Kestra Python Commands task](https://kestra.io/plugins/plugin-script-python/io.kestra.plugin.scripts.python.commands)
    - [Kestra Flow trigger](https://kestra.io/plugins/core/triggers/io.kestra.plugin.core.trigger.flow)
    - [Kestra Fail task](https://kestra.io/plugins/core/tasks/execution/io.kestra.plugin.core.execution.fail)
  tags:
    - Infrastructure
  subTags:
    - CI/CD & Deployment
    - Approval Gates
  ee: false
  verified: false
  demo: false
