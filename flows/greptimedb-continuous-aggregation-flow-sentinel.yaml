id: greptimedb-continuous-aggregation-flow-sentinel
namespace: company.data

inputs:
  - id: jdbc_url
    type: STRING
    description: JDBC connection URL for the GreptimeDB MySQL wire protocol interface (default port 4002)
    defaults: "jdbc:mysql://greptimedb-server:4002/public"

  - id: auto_flush
    type: BOOL
    description: Whether to automatically trigger ADMIN flush_table for affected destination tables
    defaults: false

  - id: dry_run
    type: BOOL
    description: When true, audits flow assignments without executing administrative flush operations
    defaults: true

  - id: slack_channel
    type: STRING
    description: Slack notification channel for real-time pipeline alerts and operational audit records
    defaults: "#data-ops"

triggers:
  - id: every_fifteen_minutes
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

tasks:
  - id: probe_flows
    type: io.kestra.plugin.jdbc.mysql.Query
    description: Queries GreptimeDB information schema to inspect continuous aggregation flows and compute node allocations
    url: "{{ inputs.jdbc_url }}"
    username: "{{ secret('GREPTIMEDB_USERNAME') }}"
    password: "{{ secret('GREPTIMEDB_PASSWORD') }}"
    fetchType: FETCH
    allowFailure: true
    sql: |
      SELECT
        COALESCE(flow_name, '') AS flow_name,
        COALESCE(sink_table_name, '') AS sink_table,
        COALESCE(flownode_ids, '') AS flownode_ids,
        COALESCE(expire_after, 0) AS expire_after
      FROM information_schema.flows;

  - id: classify_flow_health
    type: io.kestra.plugin.core.debug.Return
    description: Evaluates flow metadata into standardized operational health tiers
    format: |
      {% if outputs.probe_flows.rows is null %}
      PROBE_FAILED
      {% elseif outputs.probe_flows.rows | length == 0 %}
      WARNING
      {% else %}
        {% set unassigned_flows = [] %}
        {% for row in outputs.probe_flows.rows %}
          {% if row.flownode_ids == '' or row.flownode_ids == '[]' %}
            {% set unassigned_flows = unassigned_flows | concat([row]) %}
          {% endif %}
        {% endfor %}
        {% if unassigned_flows | length > 0 %}
        CRITICAL
        {% else %}
        HEALTHY
        {% endif %}
      {% endif %}

  - id: route_by_flow_status
    type: io.kestra.plugin.core.flow.Switch
    description: Routes downstream alerting and remediation actions based on evaluated flow health
    value: "{{ outputs.classify_flow_health.value | trim }}"
    cases:
      CRITICAL:
        - id: alert_critical_slack
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: Dispatches high-urgency alert to Slack with unassigned continuous aggregation flows
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "channel": "{{ inputs.slack_channel }}",
              "text": "🚨 *GREPTIMEDB CONTINUOUS AGGREGATION FLOW ALERT*\n*Status:* `CRITICAL`\n*Target Cluster:* `{{ inputs.jdbc_url }}`\n*Total Flows:* `{{ outputs.probe_flows.rows | length }}`\n*Auto-Flush Enabled:* `{{ inputs.auto_flush }}` (Dry-run: `{{ inputs.dry_run }}`)\n*Details:* Continuous aggregation flows have no active flownodes assigned. Downsampled time-series tables are stalling.\n*Execution ID:* `{{ execution.id }}`"
            }

        - id: check_remediation
          type: io.kestra.plugin.core.flow.If
          description: Evaluates whether administrative table flushes are permitted
          condition: "{{ inputs.auto_flush == true and inputs.dry_run == false }}"
          then:
            - id: flush_sink_tables
              type: io.kestra.plugin.core.flow.Loop
              description: Iterates through affected sink tables to issue table flush commands
              values: "{{ outputs.probe_flows.rows | filter(f -> f.flownode_ids == '' or f.flownode_ids == '[]') }}"
              tasks:
                - id: flush_table
                  type: io.kestra.plugin.jdbc.mysql.Query
                  description: Flushes in-memory memtables into immutable storage for the destination table
                  url: "{{ inputs.jdbc_url }}"
                  username: "{{ secret('GREPTIMEDB_USERNAME') }}"
                  password: "{{ secret('GREPTIMEDB_PASSWORD') }}"
                  fetchType: NONE
                  sql: "ADMIN flush_table('{{ item.value.sink_table }}');"

            - id: log_flush_executed
              type: io.kestra.plugin.core.log.Log
              message: "Executed administrative table flush across destination tables for stalled flows."
          else:
            - id: log_remediation_skipped
              type: io.kestra.plugin.core.log.Log
              message: "Administrative flush skipped (auto_flush={{ inputs.auto_flush }}, dry_run={{ inputs.dry_run }}). Stalled flows require manual node reassignment."

      WARNING:
        - id: alert_warning_slack
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: Warns team when no continuous aggregation flows are detected in the catalog
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "channel": "{{ inputs.slack_channel }}",
              "text": "⚠️ *GREPTIMEDB FLOW WARNING*\n*Status:* `WARNING`\n*Target Cluster:* `{{ inputs.jdbc_url }}`\n*Details:* Zero continuous aggregation flows found in information_schema.flows.\n*Execution ID:* `{{ execution.id }}`"
            }

      PROBE_FAILED:
        - id: alert_probe_failed
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: Alerts SRE team when connectivity to GreptimeDB MySQL interface fails
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "channel": "{{ inputs.slack_channel }}",
              "text": "🔥 *GREPTIMEDB SENTINEL PROBE FAILED*\n*Target:* `{{ inputs.jdbc_url }}`\n*Failure:* Unable to connect or authenticate to GreptimeDB MySQL interface.\n*Execution ID:* `{{ execution.id }}`"
            }

      HEALTHY:
        - id: log_healthy
          type: io.kestra.plugin.core.log.Log
          message: "All GreptimeDB continuous aggregation flows are actively assigned to flownodes and running nominally."

  - id: log_audit_summary
    type: io.kestra.plugin.core.log.Log
    description: Emits immutable execution audit record detailing monitored flows and health outcome
    message: "GreptimeDB sentinel completed. Result: {{ outputs.classify_flow_health.value | trim }} | Evaluated Flows: {{ outputs.probe_flows.rows | length if outputs.probe_flows.rows is not null else 0 }} | Execution: {{ execution.id }}"

errors:
  - id: alert_flow_crash
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Intercepts unhandled flow execution errors
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "{{ inputs.slack_channel }}",
        "text": "💥 *GREPTIMEDB SENTINEL EXECUTION CRASH*\n*Flow ID:* `{{ flow.id }}`\n*Execution ID:* `{{ execution.id }}`\n*Namespace:* `{{ flow.namespace }}`\n*Error:* Unexpected failure halted workflow execution."
      }

extend:
  title: GreptimeDB Continuous Aggregation Flow & Pipeline Sentinel
  metaTitle: GreptimeDB Continuous Aggregation Flow Sentinel | Kestra
  shortDescription: Audits GreptimeDB continuous aggregation flows for orphan tasks without active flownodes and automates guarded table flushes.
  metaDescription: Audit GreptimeDB continuous aggregation flow tasks, alert Slack on unassigned flownodes, and safely trigger table flushes for streaming time-series.
  description: |
    GreptimeDB is an open-source, cloud-native distributed time-series database designed for metrics, logs, and events. Its native Flow engine powers continuous aggregation pipelines, computing real-time downsampling, rolling averages, and windowed analytics as data streams into the cluster. In production deployments, node migrations, network partitions, or compute node failures can leave continuous aggregation flows in an orphan state with no active flownode IDs assigned. When a flow loses its compute workers, real-time downsampling halts, sink tables stop receiving fresh aggregates, and operational dashboards present stale metrics without throwing query-level errors. This blueprint provides an automated sentinel that continuously audits `information_schema.flows`, verifies flownode allocations, routes incident alerts to Slack, and triggers guarded table flushes when enabled.

    ## How it works

    1. Scheduled trigger (`every_fifteen_minutes`) initiates diagnostic flow verification every 15 minutes, with manual execution supported via flow inputs.
    2. Diagnostic probe (`probe_flows`) connects to the GreptimeDB MySQL wire protocol interface (`port 4002`) via `io.kestra.plugin.jdbc.mysql.Query` and queries `information_schema.flows`.
    3. Classification step (`classify_flow_health`) parses the flow metadata using Pebble conditionals, grouping the cluster status into `HEALTHY`, `WARNING`, `CRITICAL`, or `PROBE_FAILED`.
    4. Flow router (`route_by_flow_status`) switches downstream execution paths according to the classified health state.
    5. On `CRITICAL` state, `alert_critical_slack` dispatches an incident notification to the configured Slack channel with affected flow names and sink tables.
    6. Guarded remediation (`check_remediation`) checks whether `auto_flush` is enabled and `dry_run` is disabled. If confirmed, `flush_sink_tables` iterates over affected destination tables and executes `ADMIN flush_table('sink_table')` to write buffered memtables to physical SST storage.
    7. On `PROBE_FAILED` or network errors, dedicated alerts notify administrators of database interface reachability failure or invalid credentials.
    8. Audit log task (`log_audit_summary`) outputs a structured record documenting evaluated flow counts, status, and execution lineage.

    ## What you get

    - Automated continuous surveillance of streaming continuous aggregation flows across all GreptimeDB catalogs.
    - Rapid detection of orphan flows lacking compute flownode assignments before metric freshness SLAs breach.
    - Actionable incident notifications dispatched to Slack detailing affected flow names and destination sink tables.
    - Guarded administrative table flush capability that forces persistence of buffered time-series states during degradation.
    - Zero-credential-leak architecture keeping database usernames and passwords masked in execution logs and UI traces.

    ## Who it's for

    - Platform Engineers and SREs operating production GreptimeDB clusters for metrics and observability.
    - Real-Time Analytics Teams managing continuous aggregation, downsampling, and rolling window computations.
    - Database Administrators overseeing time-series storage health and LSM-tree persistence.

    ## Why orchestrate this with Kestra

    - Declarative YAML definition unifies streaming pipeline monitoring, conditional health routing, and remediation into version-controlled GitOps workflows.
    - Native MySQL JDBC plugin connectivity eliminates custom Python worker container dependencies and credentials leakage.
    - Built-in conditional routing and looping isolate discovery, dry-run safety gates, and administrative maintenance calls without external monitoring agents.
    - Immutable execution timelines in Kestra provide historical verification evidence for pipeline reliability audits.
    - Cloud-native scheduling and flow-level error-trapping ensure continuous sentinel operation independent of external cron infrastructure.

    ## Prerequisites

    - GreptimeDB instance (v0.8+) running with MySQL wire compatibility enabled (default port 4002).
    - Database user with read permissions on `information_schema.flows` and administrative privileges for `ADMIN flush_table`.
    - Slack incoming webhook URL for operational notification delivery.

    ### Secrets

    - `GREPTIMEDB_USERNAME`: Username for authenticating to the GreptimeDB MySQL wire protocol port.
    - `GREPTIMEDB_PASSWORD`: Password for the GreptimeDB database user.
    - `SLACK_WEBHOOK_URL`: HTTPS incoming webhook URL for the target Slack channel.

    ## Quick start

    1. Configure `GREPTIMEDB_USERNAME`, `GREPTIMEDB_PASSWORD`, and `SLACK_WEBHOOK_URL` in your Kestra namespace secrets.
    2. Deploy this flow to your Kestra instance and execute an initial manual run with `dry_run: true` to confirm connectivity against your GreptimeDB server.
    3. Review the execution logs in the Kestra UI to verify flow metadata from `information_schema.flows` is parsed successfully.
    4. Enable the `every_fifteen_minutes` schedule trigger to establish automated continuous surveillance.

    ## How to extend

    - Add Prometheus exporter checks via `io.kestra.plugin.prometheus` to correlate flow stalls with Datanode write latency and disk I/O.
    - Integrate PagerDuty alerting via `io.kestra.plugin.pagerduty.notifications.PagerDutyAlert` for high-priority production metric pipeline halts.
    - Attach downstream compaction checks using `ADMIN compact_table` for high-throughput time-series tables with deep LSM levels.

    ## Links

    - [GreptimeDB Continuous Aggregation Flow Documentation](https://docs.greptime.com/user-guide/flow-computation/overview)
    - [GreptimeDB Administration SQL Commands](https://docs.greptime.com/reference/sql/admin)
    - [Kestra MySQL Plugin Documentation](https://kestra.io/plugins/plugin-jdbc-mysql)
    - [Kestra Slack Notification Plugin](https://kestra.io/plugins/plugin-notifications)
  tags:
    - Data
  subTags:
    - Monitoring & Alerting
    - Realtime & Streaming
  ee: false
  demo: false
