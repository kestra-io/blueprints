id: clickhouse-async-insert-buffer-sentinel
namespace: company.data

description: |
  Monitor ClickHouse asynchronous insert buffer memory and queue saturation using system.asynchronous_inserts.
  Detects delayed buffer flushes and ingestion backpressure, exports a downloadable CSV diagnostic report,
  gates operator-approved queue flushing via Pause, verifies buffer drain status, records telemetry snapshots
  in Kestra KV store, and dispatches automated Slack incident alerts to Data SREs.

concurrency:
  limit: 1
  behavior: QUEUE

inputs:
  - id: max_buffer_memory_mb
    type: FLOAT
    displayName: Maximum In-Memory Buffer Threshold (MB)
    description: Cumulative unwritten data threshold in megabytes held across asynchronous insert buffers. Exceeding this threshold signals disk flush bottlenecks.
    defaults: 250.0
    min: 10.0
    max: 100000.0

  - id: max_flush_delay_ms
    type: INT
    displayName: Maximum Flush Delay Threshold (ms)
    description: Maximum acceptable age in milliseconds of the oldest pending asynchronous batch waiting to flush to disk.
    defaults: 5000
    min: 500
    max: 600000

  - id: max_reported_tables
    type: INT
    displayName: Maximum Tables to Report
    description: Maximum number of congested tables to extract into the detailed diagnostic CSV summary.
    defaults: 25
    min: 1
    max: 100

  - id: clickhouse_database
    type: STRING
    displayName: ClickHouse Target Database
    description: Target database name to scope asynchronous insert buffer monitoring.
    defaults: default
    validator: ^[A-Za-z_][A-Za-z0-9_]{0,63}$

  - id: auto_flush_queue
    type: BOOL
    displayName: Enable Remediation Approval Gate
    description: When true, prompts an operator for manual approval before executing SYSTEM FLUSH ASYNC INSERT QUEUE to drain backpressured buffers to disk.
    defaults: true

tasks:
  - id: evaluate_buffer_saturation
    type: io.kestra.plugin.jdbc.clickhouse.Query
    description: Query ClickHouse system.asynchronous_inserts to evaluate global buffer memory and pending batch latencies.
    url: "{{ secret('CLICKHOUSE_JDBC_URL') }}"
    username: "{{ secret('CLICKHOUSE_USERNAME') }}"
    password: "{{ secret('CLICKHOUSE_PASSWORD') }}"
    timeZoneId: UTC
    fetchType: FETCH_ONE
    sql: |
      SELECT
        count(*) AS pending_batches_count,
        COALESCE(round(sum(bytes) / (1024 * 1024), 2), 0.0) AS total_buffered_mb,
        COALESCE(round(sum(bytes) / (1024 * 1024 * 1024), 3), 0.0) AS total_buffered_gb,
        COALESCE(sum(entries), 0) AS total_buffered_entries,
        COALESCE(max(dateDiff('millisecond', first_update, now())), 0) AS peak_flush_delay_ms,
        CASE
          WHEN (COALESCE(sum(bytes) / (1024 * 1024), 0.0) >= {{ inputs.max_buffer_memory_mb }})
            OR (COALESCE(max(dateDiff('millisecond', first_update, now())), 0) >= {{ inputs.max_flush_delay_ms }})
          THEN true
          ELSE false
        END AS is_saturated
      FROM system.asynchronous_inserts
      WHERE database = '{{ inputs.clickhouse_database }}';

  - id: fetch_saturated_tables_telemetry
    type: io.kestra.plugin.jdbc.clickhouse.Query
    description: Stream detailed table-level buffer metrics and pending flush ages to internal storage.
    url: "{{ secret('CLICKHOUSE_JDBC_URL') }}"
    username: "{{ secret('CLICKHOUSE_USERNAME') }}"
    password: "{{ secret('CLICKHOUSE_PASSWORD') }}"
    timeZoneId: UTC
    fetchType: STORE
    sql: |
      SELECT
        database,
        table,
        format,
        query_id,
        entries AS pending_rows,
        round(bytes / (1024 * 1024), 2) AS buffered_mb,
        first_update AS batch_opened_at,
        dateDiff('millisecond', first_update, now()) AS age_ms
      FROM system.asynchronous_inserts
      WHERE database = '{{ inputs.clickhouse_database }}'
      ORDER BY bytes DESC
      LIMIT {{ inputs.max_reported_tables }};

  - id: export_diagnostic_csv
    type: io.kestra.plugin.serdes.csv.IonToCsv
    description: Serialize the asynchronous insert telemetry into a downloadable CSV artifact.
    from: "{{ outputs.fetch_saturated_tables_telemetry.uri }}"

  - id: check_backpressure_and_alert
    type: io.kestra.plugin.core.flow.If
    description: Evaluate buffer health metrics, notify Slack on congestion, and gate operator-approved queue flush remediation.
    condition: "{{ outputs.evaluate_buffer_saturation.row.is_saturated }}"
    then:
      - id: log_backpressure_warning
        type: io.kestra.plugin.core.log.Log
        message: >-
          ClickHouse Ingestion Backpressure Warning on database '{{ inputs.clickhouse_database }}':
          Total Buffered Memory: {{ outputs.evaluate_buffer_saturation.row.total_buffered_mb }} MB (Threshold: {{ inputs.max_buffer_memory_mb }} MB).
          Pending Batches: {{ outputs.evaluate_buffer_saturation.row.pending_batches_count }} batches ({{ outputs.evaluate_buffer_saturation.row.total_buffered_entries }} rows).
          Peak Flush Delay: {{ outputs.evaluate_buffer_saturation.row.peak_flush_delay_ms }} ms (Threshold: {{ inputs.max_flush_delay_ms }} ms).
          Diagnostic CSV Report URI: {{ outputs.export_diagnostic_csv.uri }}

      - id: notify_slack_alert
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Send incident alert to Slack with buffer metrics and report artifact.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        messageText: >-
          [INGESTION BACKPRESSURE] *ClickHouse Asynchronous Insert Buffer Saturation Alert*
          *Database:* `{{ inputs.clickhouse_database }}`
          *Buffered In-Memory Data:* `{{ outputs.evaluate_buffer_saturation.row.total_buffered_mb }} MB` (Threshold: `{{ inputs.max_buffer_memory_mb }} MB`)
          *Pending Batches:* `{{ outputs.evaluate_buffer_saturation.row.pending_batches_count }}` (`{{ outputs.evaluate_buffer_saturation.row.total_buffered_entries }} rows`)
          *Oldest Batch Flush Delay:* `{{ outputs.evaluate_buffer_saturation.row.peak_flush_delay_ms }} ms` (SLA: <= `{{ inputs.max_flush_delay_ms }} ms`)
          *Diagnostic CSV Report:* `{{ outputs.export_diagnostic_csv.uri }}`
          *Execution ID:* `{{ execution.id }}`

      - id: execute_queue_remediation
        type: io.kestra.plugin.core.flow.If
        description: Operator-approved queue flush remediation gate triggered when buffer backpressure is detected.
        condition: "{{ inputs.auto_flush_queue }}"
        then:
          - id: pause_for_operator_approval
            type: io.kestra.plugin.core.flow.Pause
            description: Pause workflow execution for operator review before flushing the asynchronous insert queue. Resume in the Kestra UI to flush, or cancel the execution to skip.
            pauseDuration: PT10M
            behavior: CANCEL

          - id: flush_async_insert_queue
            type: io.kestra.plugin.jdbc.clickhouse.Query
            description: Force synchronous flush of all accumulated asynchronous insert buffers to disk across the cluster.
            url: "{{ secret('CLICKHOUSE_JDBC_URL') }}"
            username: "{{ secret('CLICKHOUSE_USERNAME') }}"
            password: "{{ secret('CLICKHOUSE_PASSWORD') }}"
            timeZoneId: UTC
            sql: SYSTEM FLUSH ASYNC INSERT QUEUE;

          - id: verify_queue_drained
            type: io.kestra.plugin.jdbc.clickhouse.Query
            description: Query system.asynchronous_inserts post-flush to verify buffered entries and unwritten bytes drained.
            url: "{{ secret('CLICKHOUSE_JDBC_URL') }}"
            username: "{{ secret('CLICKHOUSE_USERNAME') }}"
            password: "{{ secret('CLICKHOUSE_PASSWORD') }}"
            timeZoneId: UTC
            fetchType: FETCH_ONE
            sql: |
              SELECT
                count(*) AS remaining_batches_count,
                COALESCE(round(sum(bytes) / (1024 * 1024), 2), 0.0) AS remaining_buffered_mb,
                COALESCE(sum(entries), 0) AS remaining_buffered_entries
              FROM system.asynchronous_inserts
              WHERE database = '{{ inputs.clickhouse_database }}';

          - id: log_remediation_summary
            type: io.kestra.plugin.core.log.Log
            message: >-
              ClickHouse Async Insert Queue Remediation Complete on database '{{ inputs.clickhouse_database }}':
              Remaining Batches: {{ outputs.verify_queue_drained.row.remaining_batches_count }}.
              Remaining Buffered Memory: {{ outputs.verify_queue_drained.row.remaining_buffered_mb }} MB ({{ outputs.verify_queue_drained.row.remaining_buffered_entries }} rows).

          - id: notify_remediation_success
            type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
            description: Send queue flush resolution notification to Slack with post-remediation metrics.
            url: "{{ secret('SLACK_WEBHOOK_URL') }}"
            messageText: >-
              [REMEDIATION SUCCESS] *ClickHouse Async Insert Queue Flushed*
              *Database:* `{{ inputs.clickhouse_database }}`
              *Remaining Batches:* `{{ outputs.verify_queue_drained.row.remaining_batches_count }}`
              *Remaining Buffered Memory:* `{{ outputs.verify_queue_drained.row.remaining_buffered_mb }} MB` (`{{ outputs.verify_queue_drained.row.remaining_buffered_entries }} rows`)
              *Status:* Asynchronous insert buffer drained to disk successfully.
    else:
      - id: log_healthy_state
        type: io.kestra.plugin.core.log.Log
        message: >-
          ClickHouse asynchronous insert buffers on database '{{ inputs.clickhouse_database }}' are healthy.
          Total buffered memory is {{ outputs.evaluate_buffer_saturation.row.total_buffered_mb }} MB (< {{ inputs.max_buffer_memory_mb }} MB)
          and peak flush delay is {{ outputs.evaluate_buffer_saturation.row.peak_flush_delay_ms }} ms (< {{ inputs.max_flush_delay_ms }} ms).

  - id: update_telemetry_watermark
    type: io.kestra.plugin.core.kv.Set
    description: Record telemetry snapshot in Kestra KV store for historical capacity and flush trend tracking.
    key: "clickhouse_async_insert_audit_{{ inputs.clickhouse_database }}"
    value:
      last_audit_timestamp: "{{ now() }}"
      pending_batches_count: "{{ outputs.evaluate_buffer_saturation.row.pending_batches_count }}"
      total_buffered_mb: "{{ outputs.evaluate_buffer_saturation.row.total_buffered_mb }}"
      peak_flush_delay_ms: "{{ outputs.evaluate_buffer_saturation.row.peak_flush_delay_ms }}"
      is_saturated: "{{ outputs.evaluate_buffer_saturation.row.is_saturated }}"
      diagnostic_csv_uri: "{{ outputs.export_diagnostic_csv.uri }}"

errors:
  - id: alert_audit_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Notify on task failure if database connectivity or query execution fails.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    messageText: >-
      [ERROR] ClickHouse Asynchronous Insert Audit failed in execution `{{ execution.id }}` on database `{{ inputs.clickhouse_database }}`.
      Failed task: `{{ (errorLogs() | length) > 0 ? errorLogs()[0].taskId : 'unknown' }}`.
      Error message: `{{ (errorLogs() | length) > 0 ? errorLogs()[0].message : 'inspect execution logs' }}`.

triggers:
  - id: periodic_buffer_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"

extend:
  title: ClickHouse Asynchronous Insert Buffer Queue and Backpressure Sentinel
  metaTitle: ClickHouse Asynchronous Insert Buffer Sentinel | Kestra
  shortDescription: Audit ClickHouse asynchronous insert buffer memory and flush delays via system.asynchronous_inserts, gate operator queue flushes, and alert on backpressure.
  metaDescription: Monitor ClickHouse async insert buffer memory and flush lag using system.asynchronous_inserts, gate operator queue flushes via Pause, and alert on ingestion backpressure.
  description: |
    ClickHouse's asynchronous insert engine (`async_insert = 1`) optimizes high-frequency ingestion by grouping small, real-time client inserts into in-memory buffers before writing consolidated columnar data parts to disk. However, when upstream ingestion rates surge or storage I/O throttles, unwritten data accumulates in RAM. Once memory limits or timeout boundaries (`wait_for_async_insert_timeout`) are exceeded, client queries fail with timeout exceptions, creating cascading data ingestion backpressure across message queues like Kafka and RabbitMQ. This workflow continuously queries ClickHouse's `system.asynchronous_inserts` catalog table, monitors memory saturation and flush latencies against configurable SLAs, exports a downloadable CSV diagnostic report, provides an operator-in-the-loop approval gate to flush saturated queues to disk, verifies queue draining, persists telemetry history in Kestra's Key-Value store, and dispatches incident alerts to Slack when ingestion congestion is detected.

    ## How it works

    1. The `Schedule` trigger initiates the workflow every 15 minutes, or engineers can trigger executions on-demand from the UI.
    2. `evaluate_buffer_saturation` aggregates active buffer metrics from `system.asynchronous_inserts`, computing total buffered megabytes, pending batch counts, and the age in milliseconds of the oldest unwritten batch.
    3. `fetch_saturated_tables_telemetry` streams detailed table-level buffer metrics (database, table, pending rows, memory, format, and open batch age) into internal storage (`STORE` fetch type).
    4. `export_diagnostic_csv` transforms raw buffer telemetry into a downloadable CSV artifact using `IonToCsv`.
    5. `check_backpressure_and_alert` (`If` condition) verifies whether buffered memory or flush age exceeds configured SLA boundaries.
    6. If backpressure is detected, `notify_slack_alert` posts an alert with buffer saturation metrics and the direct CSV report link for fast triage.
    7. When `auto_flush_queue` is enabled, `execute_queue_remediation` pauses execution (`io.kestra.plugin.core.flow.Pause`, `pauseDuration: PT10M`, `behavior: CANCEL`) for operator review before executing `SYSTEM FLUSH ASYNC INSERT QUEUE;` to safely force unwritten data to disk, canceling automatically on timeout to prevent unapproved flushes, followed by `verify_queue_drained` confirming the remaining batch count and memory dropped to healthy levels.
    8. `update_telemetry_watermark` updates the `clickhouse_async_insert_audit_<database>` key in Kestra's KV store for historical capacity trending.
    9. The `errors` block intercepts connection or query failures and immediately alerts the on-call engineering channel.

    ## What you get

    - Early detection of ClickHouse ingestion bottlenecks before client applications experience timeout failures.
    - Real-time visibility into unwritten in-memory data accumulation across all MergeTree tables.
    - Automated export of congested tables and pending batch ages into downloadable CSV artifacts.
    - Operator-in-the-loop remediation gate pausing for confirmation before flushing the asynchronous insert queue.
    - Post-remediation verification ensuring unwritten buffers drained completely.
    - Persistent state tracking via Kestra KV store without third-party monitoring infrastructure.
    - Actionable incident alerts delivered directly to Slack with report links.

    ## Who it's for

    - Data Platform Engineers operating high-throughput ClickHouse real-time ingestion pipelines.
    - Site Reliability Engineers (SREs) monitoring analytical database SLAs and memory limits.
    - Backend Engineers seeking visibility into asynchronous write buffer latencies.

    ## Why orchestrate this with Kestra

    Monitoring asynchronous insert buffers directly through declarative Kestra workflows eliminates the need for heavyweight proprietary APM agents. Kestra natively handles database retries, credential isolation via secrets, conditional branching, human approval gates (`io.kestra.plugin.core.flow.Pause`), artifact generation, and key-value state persistence in a single audited YAML pipeline.

    ## Prerequisites

    - ClickHouse 21.11 or newer with asynchronous inserts enabled (`async_insert = 1`).
    - Database user with `SELECT` permissions on `system.asynchronous_inserts` and `SYSTEM FLUSH ASYNC INSERT QUEUE` privileges.
    - Incoming Slack Webhook URL for alerting notifications.

    ### Secrets

    - `CLICKHOUSE_JDBC_URL`: JDBC connection string (e.g., `jdbc:clickhouse://clickhouse.company.internal:8123/default`).
    - `CLICKHOUSE_USERNAME`: Database username with read and flush permissions.
    - `CLICKHOUSE_PASSWORD`: Database user password.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook endpoint for alerting.

    ## Quick start

    1. Configure the `CLICKHOUSE_JDBC_URL`, `CLICKHOUSE_USERNAME`, `CLICKHOUSE_PASSWORD`, and `SLACK_WEBHOOK_URL` secrets in your Kestra namespace.
    2. Import this blueprint into your Kestra workspace.
    3. Click **Execute** with default inputs to perform an initial audit.
    4. Verify the generated output logs, download the generated CSV report from the **Outputs** tab, and inspect the stored record in the **KV Store** tab.
    5. Enable the 15-minute schedule trigger for continuous monitoring.

    ## How to extend

    - Configure automated writer throttling or backpressure webhooks to upstream microservices when buffer saturation persists post-flush.
    - Archive periodic buffer congestion reports to Amazon S3 or Google Cloud Storage using `io.kestra.plugin.aws.s3.Upload`.
    - Integrate with PagerDuty or Opsgenie using Kestra's notification plugins for high-severity memory spikes.

    ## Links

    - [ClickHouse JDBC Plugin](https://kestra.io/plugins/plugin-jdbc-clickhouse)
    - [Serdes Plugin](https://kestra.io/plugins/plugin-serdes)
    - [Slack Notification Plugin](https://kestra.io/plugins/plugin-slack)
    - [Kestra Key-Value Store](https://kestra.io/docs/concepts/kv)
    - [ClickHouse Asynchronous Inserts Documentation](https://clickhouse.com/docs/en/optimize/asynchronous-inserts)
  tags:
    - Data
  subTags:
    - Day 2 Operations
    - Streaming & Messaging
    - Monitoring & Alerting
  ee: false
