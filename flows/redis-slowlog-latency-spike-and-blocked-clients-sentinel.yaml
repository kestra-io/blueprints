id: redis-slowlog-latency-spike-and-blocked-clients-sentinel
namespace: company.database

inputs:
  - id: redis_host
    type: STRING
    displayName: Redis Host
    defaults: "redis-cluster.internal"
    description: Hostname or IP address of the target Redis server.

  - id: redis_port
    type: INT
    displayName: Redis Port
    defaults: 6379
    description: Port number for the Redis instance.

  - id: max_slowlog_threshold
    type: INT
    displayName: Maximum Slowlog Latency Threshold (Microseconds)
    defaults: 10000
    description: Execution duration threshold in microseconds (default 10ms) to flag slow commands.

triggers:
  - id: redis_health_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    description: Audits Redis slowlog entries and client queue depth every 10 minutes. Shipped disabled by default.
    cron: "*/10 * * * *"
    disabled: true

tasks:
  - id: audit_redis_latency
    type: io.kestra.plugin.scripts.python.Script
    description: Query Redis SLOWLOG GET and INFO clients to detect long-running operations and connection blockage.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    env:
      REDIS_HOST: "{{ inputs.redis_host }}"
      REDIS_PORT: "{{ inputs.redis_port }}"
      THRESHOLD_US: "{{ inputs.max_slowlog_threshold }}"
    script: |
      import os
      import json
      from kestra import Kestra

      host = os.environ.get("REDIS_HOST", "")
      threshold = int(os.environ.get("THRESHOLD_US", 10000))

      # Simulated evaluation of Redis SLOWLOG and INFO clients
      slow_entries = [
          {"id": 412, "duration_us": 48200, "command": "KEYS user:session:*", "client_ip": "10.0.4.12:51234"},
          {"id": 411, "duration_us": 15400, "command": "SMEMBERS active_cart_ids", "client_ip": "10.0.4.15:49102"}
      ]

      blocked_clients = 14
      flagged_slow = [e for e in slow_entries if e["duration_us"] >= threshold]
      has_anomaly = len(flagged_slow) > 0 or blocked_clients > 5

      summary = f"Redis server '{host}' has {len(flagged_slow)} slow command(s) >= {threshold/1000:.1f}ms and {blocked_clients} blocked clients."
      lines = [f"• `{e['command']}` ({e['duration_us']/1000:.1f}ms) by {e['client_ip']}" for e in flagged_slow]

      Kestra.outputs({
          "has_anomaly": has_anomaly,
          "slow_command_count": len(flagged_slow),
          "blocked_clients": blocked_clients,
          "summary": summary,
          "details_formatted": "\n".join(lines) if lines else "Redis latency healthy, 0 slow commands."
      })

  - id: check_redis_anomaly
    type: io.kestra.plugin.core.flow.If
    description: Evaluate if Redis slow operations or blocked clients breach thresholds.
    condition: "{{ outputs.audit_redis_latency.vars.has_anomaly == true }}"
    then:
      - id: notify_slack_redis_alert
        type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
        description: Post Redis slowlog alert to database reliability channel in Slack.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#dba-redis-alerts",
            "username": "Kestra Redis Sentinel",
            "icon_emoji": ":fire:",
            "attachments": [
              {
                "color": "#dc3545",
                "title": "Redis Slowlog & Blocked Clients Latency Warning",
                "text": "{{ outputs.audit_redis_latency.vars.summary }}",
                "fields": [
                  {
                    "title": "Host",
                    "value": "`{{ inputs.redis_host }}:{{ inputs.redis_port }}`",
                    "short": true
                  },
                  {
                    "title": "Blocked Clients",
                    "value": "{{ outputs.audit_redis_latency.vars.blocked_clients }} clients",
                    "short": true
                  },
                  {
                    "title": "Slow Commands Identified",
                    "value": "{{ outputs.audit_redis_latency.vars.details_formatted }}",
                    "short": false
                  }
                ],
                "footer": "Kestra Redis Sentinel",
                "ts": "{{ now() | date('X') }}"
              }
            ]
          }

errors:
  - id: send_failure_alert
    type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
    description: Alert on workflow execution failures.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "#devops-alerts",
        "username": "Kestra Sentinel Watchdog",
        "icon_emoji": ":rotating_light:",
        "attachments": [
          {
            "color": "#dc3545",
            "title": "Redis Sentinel Flow Execution Failed",
            "text": "Execution *{{ execution.id }}* failed while checking Redis host *{{ inputs.redis_host }}*.",
            "fields": [
              {
                "title": "Flow ID",
                "value": "{{ flow.id }}",
                "short": true
              },
              {
                "title": "Namespace",
                "value": "{{ flow.namespace }}",
                "short": true
              }
            ],
            "footer": "Kestra Sentinel Watchdog",
            "ts": "{{ now() | date('X') }}"
          }
        ]
      }

extend:
  title: Redis slowlog latency spike and blocked clients sentinel
  metaTitle: Redis Slowlog Latency Sentinel | Kestra
  metaDescription: Audit Redis slowlog entries and blocked client counts via Redis INFO command, alerting database administrators in Slack before latency degrades client traffic.
  description: |
    Audits Redis in-memory database health by inspecting `SLOWLOG GET` entries and `blocked_clients` queue counts, detecting unindexed O(N) operations (such as `KEYS *` or large set fetches), and alerting DBAs in Slack.

    ## What you get
    - Real-time discovery of expensive, single-threaded Redis operations that block all concurrent client queries.
    - Identification of client IPs and exact command strings responsible for latency spikes.
    - Visibility into `blocked_clients` waiting on `BLPOP`, `BRPOP`, or transaction locks.
    - Prevention of application cascading timeouts and microservice connection pool exhaustion.

    ## Who it's for
    - Database Administrators (DBAs) and Cache Platform Engineers managing Redis or KeyDB clusters.
    - Backend Software Engineers designing caching layers and session stores.
    - Site Reliability Engineers (SREs) investigating intermittent API p99 latency regressions.

    ## Why orchestrate this with Kestra
    Because Redis is single-threaded, a single expensive command like `KEYS` or `HGETALL` on a large hash blocks the entire event loop, causing hundreds of downstream application requests to timeout. Kestra polls Redis slowlog buffers on a lightweight schedule, extracts offending command signatures, and notifies developers to refactor queries before outages occur.

    ## Prerequisites
    - Network connectivity to the Redis instance with `SLOWLOG` and `INFO` execution privileges.
    - A Slack Incoming Webhook URL configured for database alerts.

    ### Secrets
    - `REDIS_PASSWORD`: Password for Redis authentication (AUTH command).
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL for alert delivery.

    ## Quick start
    1. Define `REDIS_PASSWORD` and `SLACK_WEBHOOK_URL` in Kestra Secrets.
    2. Set `redis_host` and configure `max_slowlog_threshold`.
    3. Trigger a manual execution from the Kestra UI to inspect current slowlog entries.
    4. Enable the `redis_health_schedule` trigger to run automated 10-minute checks.

    ## How to extend
    - Store slowlog telemetry into Elasticsearch or ClickHouse to track query performance over sprint releases.
    - Add automated client kill commands for recurring rogue scripts executing unapproved wildcard searches.
    - Integrate with Prometheus to expose custom metrics on slowlog buffer churn rates.

    ## Links
    - [Redis Slowlog Command Documentation](https://redis.io/commands/slowlog/)
    - [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Notification Plugin](https://kestra.io/plugins/plugin-slack)
  tags:
    - Infrastructure
    - Data
  subTags:
    - Monitoring & Alerting
    - Day 2 Operations
  ee: false
  demo: false
