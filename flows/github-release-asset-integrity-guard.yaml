id: github-release-asset-integrity-guard
namespace: company.team
description: Download a public GitHub release artifact, verify its SHA-256 against an independently supplied expected hash, save evidence, and alert Slack on mismatch.

inputs:
  - id: repository
    type: STRING
    defaults: cli/cli
    description: Public GitHub repository in owner/repo form.
  - id: release_tag
    type: STRING
    description: Exact published release tag. Supply an existing tag.
  - id: asset_name
    type: STRING
    description: Exact release asset filename to verify.
  - id: expected_sha256
    type: STRING
    description: Trusted 64-hex-character SHA-256 from your build system or separately authenticated release manifest. Do not copy it from the asset being verified.
  - id: max_asset_mib
    type: INT
    defaults: 256
    description: Reject larger assets before download and while streaming. Allowed range is 1-1024.

triggers:
  - id: weekday_integrity_check
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 9 * * 1-5"
    disabled: true
    description: Enable only after confirming a successful manual check.

concurrency:
  limit: 1

tasks:
  - id: get_release
    type: io.kestra.plugin.core.http.Request
    description: Get release metadata from GitHub's public REST API; no token or private-repository access is used.
    uri: "https://api.github.com/repos/{{ inputs.repository }}/releases/tags/{{ inputs.release_tag }}"
    method: GET
    headers:
      Accept: application/vnd.github+json
      User-Agent: Kestra-Release-Integrity-Guard

  - id: verify_asset
    type: io.kestra.plugin.scripts.python.Script
    description: Validate release metadata, download the selected asset with a bounded stream, hash the bytes, and write a report. A hash mismatch returns FAIL.
    containerImage: python:3.11-slim
    env:
      REPOSITORY: "{{ inputs.repository }}"
      RELEASE_TAG: "{{ inputs.release_tag }}"
      ASSET_NAME: "{{ inputs.asset_name }}"
      EXPECTED_SHA256: "{{ inputs.expected_sha256 }}"
      MAX_ASSET_MIB: "{{ inputs.max_asset_mib }}"
    inputFiles:
      release-metadata.json: "{{ outputs.get_release.body | toJson }}"
    outputFiles:
      - release-integrity-report.json
    script: |
      """Verify a public GitHub release asset against an externally trusted digest."""
      import hashlib
      import json
      import os
      import re
      from urllib.parse import unquote, urlsplit
      from urllib.request import HTTPRedirectHandler, Request, build_opener

      REPO_RE = re.compile(r'^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$')
      TAG_RE = re.compile(r'^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$')
      ASSET_RE = re.compile(r'^[A-Za-z0-9][A-Za-z0-9._+()-]{0,199}$')
      SHA_RE = re.compile(r'^[0-9a-fA-F]{64}$')
      ALLOWED_HOSTS = {'github.com', 'release-assets.githubusercontent.com', 'objects.githubusercontent.com'}
      CHUNK_SIZE = 65536

      class GitHubOnlyRedirects(HTTPRedirectHandler):
          def redirect_request(self, request, fp, code, msg, headers, newurl):
              parts = urlsplit(newurl)
              if parts.scheme != 'https' or parts.hostname not in ALLOWED_HOSTS or parts.port not in (None, 443):
                  raise ValueError('Release download redirected outside GitHub-controlled HTTPS hosts')
              return super().redirect_request(request, fp, code, msg, headers, newurl)

      def validate_inputs(repository, tag, asset_name, expected_sha256, limit_mib):
          if not REPO_RE.fullmatch(repository) or any(p in ('.', '..') for p in repository.split('/')):
              raise ValueError('repository must be a valid owner/repo')
          if not TAG_RE.fullmatch(tag):
              raise ValueError('release_tag must be a simple tag without path characters')
          if not ASSET_RE.fullmatch(asset_name):
              raise ValueError('asset_name must be a filename without path characters')
          if not SHA_RE.fullmatch(expected_sha256):
              raise ValueError('expected_sha256 must be an independently trusted SHA-256 hex digest')
          try:
              limit = int(limit_mib)
          except (ValueError, TypeError):
              raise ValueError('max_asset_mib must be an integer') from None
          if not 1 <= limit <= 1024:
              raise ValueError('max_asset_mib must be from 1 through 1024')
          return limit * 1024 * 1024

      def load_release(path='release-metadata.json'):
          with open(path, encoding='utf-8') as file:
              payload = json.load(file)
          if isinstance(payload, str):
              payload = json.loads(payload)
          if not isinstance(payload, dict):
              raise ValueError('GitHub release metadata is not an object')
          return payload

      def select_asset(release, repository, tag, name, max_bytes):
          if release.get('tag_name') != tag or release.get('draft') is True:
              raise ValueError('Release tag mismatch or draft release')
          if release.get('immutable') is False:
              # Mutability does not imply failure: an external digest still pins bytes.
              pass
          assets = release.get('assets')
          if not isinstance(assets, list) or len(assets) > 1000:
              raise ValueError('Invalid release asset list')
          matching = [item for item in assets if isinstance(item, dict) and item.get('name') == name]
          if len(matching) != 1:
              raise ValueError('Expected exactly one matching asset in the release')
          asset = matching[0]
          size = asset.get('size')
          if type(size) is not int or size < 1 or size > max_bytes:
              raise ValueError('Declared asset size is invalid or exceeds configured limit')
          url = asset.get('browser_download_url')
          if not isinstance(url, str):
              raise ValueError('Asset has no download URL')
          parts = urlsplit(url)
          prefix = '/' + repository + '/releases/download/'
          if parts.scheme != 'https' or parts.hostname != 'github.com' or parts.port not in (None, 443):
              raise ValueError('Release URL is not HTTPS github.com')
          if parts.username or parts.password or parts.query or parts.fragment or not parts.path.startswith(prefix):
              raise ValueError('Unexpected release asset URL')
          suffix = unquote(parts.path[len(prefix):])
          if suffix != tag + '/' + name:
              raise ValueError('Release asset URL does not match the requested tag and filename')
          digest = asset.get('digest')
          if digest is not None and digest != '':
              if not isinstance(digest, str) or not digest.startswith('sha256:') or not SHA_RE.fullmatch(digest[7:]):
                  raise ValueError('Unsupported release asset digest format')
          else:
              digest = None
          return {'url': url, 'size': size, 'api_digest': digest}

      def hash_download(url, declared_size, max_bytes, opener=None):
          opener = opener or build_opener(GitHubOnlyRedirects())
          request = Request(url, headers={'User-Agent': 'Kestra-Release-Integrity-Guard/1.0'})
          hashed = hashlib.sha256()
          total = 0
          with opener.open(request, timeout=30) as response:
              location = urlsplit(response.geturl())
              if location.scheme != 'https' or location.hostname not in ALLOWED_HOSTS:
                  raise ValueError('Final download host is not approved')
              while True:
                  data = response.read(CHUNK_SIZE)
                  if not data:
                      break
                  if not isinstance(data, bytes):
                      raise ValueError('Download did not return binary data')
                  total += len(data)
                  if total > max_bytes:
                      raise ValueError('Downloaded artifact exceeds the byte limit')
                  hashed.update(data)
          if total != declared_size:
              raise ValueError('Download length does not match release metadata')
          return hashed.hexdigest(), total

      def evaluate(expected, actual, api_digest):
          problems = []
          if actual.lower() != expected.lower():
              problems.append('Downloaded bytes do not match the independent expected SHA-256')
          if api_digest and actual.lower() != api_digest[7:].lower():
              problems.append('Downloaded bytes do not match the GitHub release asset digest')
          return {'status': 'FAIL' if problems else 'PASS', 'problems': problems}

      def audit(release, repository, tag, asset_name, expected, max_bytes, downloader=hash_download):
          asset = select_asset(release, repository, tag, asset_name, max_bytes)
          actual, byte_count = downloader(asset['url'], asset['size'], max_bytes)
          verdict = evaluate(expected, actual, asset['api_digest'])
          return {
              'repository': repository, 'release_tag': tag, 'asset_name': asset_name,
              'expected_sha256': expected.lower(), 'actual_sha256': actual.lower(),
              'github_asset_digest': asset['api_digest'], 'bytes_verified': byte_count,
              'trust_model': 'expected_sha256 must come from an independent trusted channel',
              **verdict
          }

      def main():
          repo = os.environ['REPOSITORY']
          tag = os.environ['RELEASE_TAG']
          name = os.environ['ASSET_NAME']
          expected = os.environ['EXPECTED_SHA256']
          max_bytes = validate_inputs(repo, tag, name, expected, os.environ['MAX_ASSET_MIB'])
          report = audit(load_release(), repo, tag, name, expected, max_bytes)
          with open('release-integrity-report.json', 'w', encoding='utf-8') as f:
              json.dump(report, f, indent=2, sort_keys=True)
          print('::' + json.dumps({'outputs': {
              'status': report['status'],
              'bytes_verified': report['bytes_verified'],
              'actual_sha256': report['actual_sha256'],
              'problem_count': len(report['problems'])
          }}, separators=(',', ':')) + '::')
          print('Release integrity: ' + report['status'] + ' for ' + repo + '@' + tag + '/' + name)

      if __name__ == '__main__':
          main()

  - id: report_location
    type: io.kestra.plugin.core.output.OutputValues
    description: Publish the verification verdict and downloadable evidence artifact.
    values:
      status: "{{ outputs.verify_asset.vars.status }}"
      report_uri: "{{ outputs.verify_asset.outputFiles['release-integrity-report.json'] }}"
      actual_sha256: "{{ outputs.verify_asset.vars.actual_sha256 }}"
      bytes_verified: "{{ outputs.verify_asset.vars.bytes_verified }}"


  - id: integrity_result
    type: io.kestra.plugin.core.flow.If
    description: Route a completed integrity check to an alert only when verification fails.
    condition: "{{ outputs.verify_asset.vars.status == 'FAIL' }}"
    then:
      - id: alert_integrity_failure
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        description: Report a mismatch without claiming the release is trusted.
        payload: |
          {
            "text": "Release asset SHA-256 mismatch: {{ inputs.repository }} at {{ inputs.release_tag }}, asset {{ inputs.asset_name }}. Execution {{ execution.id }}. Review the report."
          }
      - id: log_mismatch
        type: io.kestra.plugin.core.log.Log
        message: "Release asset checksum mismatch: {{ inputs.repository }} / {{ inputs.release_tag }} / {{ inputs.asset_name }}"
      - id: stop_untrusted_release
        type: io.kestra.plugin.core.execution.Fail
        description: Stop the execution so downstream deployment tasks cannot accept a mismatched artifact.
        errorMessage: "Release integrity failed: downloaded asset differs from the trusted SHA-256 for {{ inputs.repository }} / {{ inputs.release_tag }} / {{ inputs.asset_name }}"
    else:
      - id: log_verified
        type: io.kestra.plugin.core.log.Log
        message: "Release asset matched independent SHA-256: {{ inputs.repository }} / {{ inputs.release_tag }} / {{ inputs.asset_name }}"

errors:
  - id: log_verification_error
    type: io.kestra.plugin.core.log.Log
    message: "Release verification failed or could not finish for {{ inputs.repository }} at {{ inputs.release_tag }}. Execution {{ execution.id }} is NOT a PASS."

extend:
  title: Verify GitHub Release Asset SHA-256 Before Deployment
  shortDescription: Stream and hash a public GitHub release asset, compare it to a trusted digest, and alert on mismatch.
  metaTitle: GitHub Release Asset Integrity Check and Slack Alert
  metaDescription: Check a GitHub release artifact against an independent SHA-256 before deployment. Save a JSON report and notify Slack.
  description: |
    Verify the actual bytes of a public GitHub release artifact against a
    SHA-256 digest obtained from a trusted, independent source. A hash copied
    from the same untrusted artifact is not an independent trust anchor.

    ## How it works

    1. get_release reads public release metadata from the GitHub REST API.
    2. verify_asset validates the exact tag and asset, follows only approved
       GitHub-controlled HTTPS download hosts, and streams the selected file
       through SHA-256 under a strict byte limit. It also compares GitHub's
       own digest field when provided.
    3. report_location publishes a JSON report and SHA-256 before the gate.
    4. integrity_result logs a PASS or alerts Slack for a completed FAIL,
       then fails the execution so deployment jobs cannot continue.
       API, metadata, and network errors also fail; they never mean PASS.

    ## What you get

    - Downloaded-byte checksum verification, not just release metadata.
    - A report with requested digest, computed digest, size, and verdict.
    - A Slack alert and a failed execution if the computed digest mismatches.
    - A disabled weekday schedule you can enable after a successful manual run.

    ## Who it's for

    - Platform engineers pinning external binary dependencies.
    - Security teams verifying third-party releases before installation.
    - CI/CD owners who need an inspectable release integrity gate.

    ## Why orchestrate this with Kestra

    Turn a manual download-and-hash command into a scheduled workflow with
    explicit failure branching, saved evidence, and an alert integration.

    ## Prerequisites

    - Public GitHub repository and released binary asset.
    - A separately trusted expected SHA-256 (for example, from your signed
      build manifest or independently authenticated CI output).
    - Kestra worker with Python Script plugin and outbound HTTPS access to
      api.github.com, github.com, and GitHub release asset hosts.
    - A Slack webhook for checksum mismatches.

    ### Secrets

    - SLACK_WEBHOOK_URL: Slack incoming webhook for a checksum mismatch.
      Store it as a Kestra secret, not in the YAML.

    ## Quick start

    1. Configure SLACK_WEBHOOK_URL in Kestra.
    2. Set repository to a public owner/repo, release_tag to its exact tag,
       and asset_name to the exact published release filename.
    3. Provide expected_sha256 from an independently trusted channel.
       Never treat an unverified digest downloaded alongside the asset
       as cryptographic proof of provenance.
    4. Run manually. Read outputs.report_location.values.status and
       outputs.report_location.values.report_uri.
    5. Deliberately change one hex digit in expected_sha256 and confirm
       a saved FAIL report, Slack alert, and failed Kestra execution.
       Then restore the trusted value.
    6. Before enabling the weekday schedule, set stable defaults for all
       required inputs (release_tag, asset_name, expected_sha256); a scheduled
       run cannot use the values from an earlier manual execution.
       Enable the schedule only after verifying both branches.

    ## How to extend

    - Attach a deployment task after the gate: it runs only when verification passes.
    - Write verification reports to permanent artifact storage.
    - Add SLSA / Sigstore signature verification for authenticity.
    - Read expected digests from a signed manifest or trusted KV record.

    ## Limits

    - Supports public GitHub release artifacts, not private releases.
    - The public GitHub REST API has request limits. Frequent scheduled
      checks may hit rate limits without authenticated API requests.
    - Hash matching verifies integrity relative to the supplied digest;
      it does not establish publisher identity or signature provenance.
    - Only filenames and simple release tags are supported.
    - Large assets are rejected with a configurable 1-1024 MiB bound.
    - If a download or API call fails, the execution fails, not PASS.

    ## Links

    - [GitHub REST Releases API](https://docs.github.com/en/rest/releases/releases)
    - [GitHub Release Assets API](https://docs.github.com/en/rest/releases/assets)
    - [Python hashlib](https://docs.python.org/3/library/hashlib.html)
    - [Kestra scripts plugin](https://kestra.io/plugins/plugin-scripts)
    - [Kestra Slack plugin](https://kestra.io/plugins/plugin-slack)
    - Created by [vivekyarra](https://github.com/vivekyarra).
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Policy & Compliance
    - Infrastructure Automation
  ee: false
  demo: false
