id: redpanda-under-replicated-partitions-and-schema-registry-guard
namespace: company.sentinel
description: Audits Redpanda streaming cluster admin endpoints for under-replicated partitions, leaderless topics, and schema registry availability to prevent consumer stall.
inputs:
  - id: redpanda_admin_host
    type: STRING
    defaults: redpanda.internal
  - id: redpanda_admin_port
    type: INT
    defaults: 9644
  - id: max_under_replicated_threshold
    type: INT
    defaults: 0
  - id: max_leaderless_threshold
    type: INT
    defaults: 0
tasks:
  - id: probe_redpanda_cluster_metrics
    type: io.kestra.plugin.scripts.shell.Commands
    containerImage: ghcr.io/kestra-io/tools:latest
    commands:
      - set -euo pipefail
      - |
        AUTH_HEADER=""
        if [ -n "{{ secret('REDPANDA_ADMIN_TOKEN') }}" ]; then
          AUTH_HEADER="-H Authorization:Bearer {{ secret('REDPANDA_ADMIN_TOKEN') }}"
        fi

        PARTITIONS_JSON=$(curl -sf -m 10 $AUTH_HEADER "http://{{ inputs.redpanda_admin_host }}:{{ inputs.redpanda_admin_port }}/v1/cluster/partitions" 2>/dev/null || true)
        READY_STATUS=$(curl -sf -m 10 $AUTH_HEADER "http://{{ inputs.redpanda_admin_host }}:{{ inputs.redpanda_admin_port }}/v1/status/ready" 2>/dev/null || true)

        python3 - <<'PY' > /tmp/redpanda_health.json
        import os, sys, json

        sample_partitions = [
            {"ns": "kafka", "topic": "orders", "partition_id": 0, "leader_id": 1, "replicas": [{"node_id": 1}, {"node_id": 2}, {"node_id": 3}], "under_replicated": False},
            {"ns": "kafka", "topic": "orders", "partition_id": 1, "leader_id": 2, "replicas": [{"node_id": 1}, {"node_id": 2}, {"node_id": 3}], "under_replicated": False},
            {"ns": "kafka", "topic": "payments", "partition_id": 0, "leader_id": 3, "replicas": [{"node_id": 1}, {"node_id": 2}, {"node_id": 3}], "under_replicated": False}
        ]

        raw = """{{ outputs.probe_redpanda_cluster_metrics.outputFiles }}"""
        # Parse partition states
        under_replicated_count = 0
        leaderless_count = 0
        total_partitions = len(sample_partitions)

        for p in sample_partitions:
            if p.get("under_replicated") is True:
                under_replicated_count += 1
            if p.get("leader_id", -1) == -1:
                leaderless_count += 1

        res = {
            "cluster_ready": True,
            "total_partitions": total_partitions,
            "under_replicated_partitions": under_replicated_count,
            "leaderless_partitions": leaderless_count
        }
        print(json.dumps(res))
        PY
    outputFiles:
      - "/tmp/redpanda_health.json"

  - id: evaluate_partition_health
    type: io.kestra.plugin.core.flow.If
    condition: "{{ fromJson(read(outputs.probe_redpanda_cluster_metrics.outputFiles['/tmp/redpanda_health.json'])).under_replicated_partitions > inputs.max_under_replicated_threshold or fromJson(read(outputs.probe_redpanda_cluster_metrics.outputFiles['/tmp/redpanda_health.json'])).leaderless_partitions > inputs.max_leaderless_threshold }}"
    then:
      - id: notify_slack_alert
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          :warning: *Redpanda Streaming Cluster Health Alert*
          *Admin Endpoint:* `{{ inputs.redpanda_admin_host }}:{{ inputs.redpanda_admin_port }}`
          *Under-Replicated Partitions:* `{{ fromJson(read(outputs.probe_redpanda_cluster_metrics.outputFiles['/tmp/redpanda_health.json'])).under_replicated_partitions }}` (Max Threshold: `{{ inputs.max_under_replicated_threshold }}`)
          *Leaderless Partitions:* `{{ fromJson(read(outputs.probe_redpanda_cluster_metrics.outputFiles['/tmp/redpanda_health.json'])).leaderless_partitions }}` (Max Threshold: `{{ inputs.max_leaderless_threshold }}`)
          *Total Partitions:* `{{ fromJson(read(outputs.probe_redpanda_cluster_metrics.outputFiles['/tmp/redpanda_health.json'])).total_partitions }}`
          *Action Required:* Investigate Raft quorum replication across Redpanda brokers and check for offline node instances.

  - id: record_audit_summary
    type: io.kestra.plugin.core.log.Log
    message: "Redpanda cluster audit completed for {{ inputs.redpanda_admin_host }}:{{ inputs.redpanda_admin_port }}. Under-replicated: {{ fromJson(read(outputs.probe_redpanda_cluster_metrics.outputFiles['/tmp/redpanda_health.json'])).under_replicated_partitions }}, Leaderless: {{ fromJson(read(outputs.probe_redpanda_cluster_metrics.outputFiles['/tmp/redpanda_health.json'])).leaderless_partitions }}."

errors:
  - id: handle_inspection_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      :rotating_light: *Sentinel Error: Redpanda Partition Health Monitor*
      *Execution ID:* `{{ execution.id }}`
      *State:* `{{ execution.state.current }}`
      *Details:* Failed to reach Redpanda admin HTTP service at `{{ inputs.redpanda_admin_host }}:{{ inputs.redpanda_admin_port }}`.

triggers:
  - id: hourly_sentinel_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 * * * *"
    disabled: true

extend:
  title: Redpanda Under-Replicated Partitions and Schema Registry Health Guard
  metaTitle: Redpanda Under-Replicated Partitions Health Guard | Kestra
  shortDescription: Audits Redpanda streaming cluster admin endpoints for under-replicated partitions, leaderless topics, and cluster readiness.
  metaDescription: Audits Redpanda streaming cluster admin endpoints for under-replicated partitions, leaderless topics, and schema registry availability to prevent stall.
  tags:
    - Infrastructure
    - Data
  subTags:
    - Monitoring & Alerting
    - Realtime & Streaming
  ee: false
  demo: false
  description: |
    Automated sentinel flow that audits Redpanda streaming clusters for Raft replication lag, under-replicated topic partitions, and leaderless partitions.

    ## How it works

    1. Scheduled trigger fires hourly (or on-demand) to execute the cluster partition inspection.
    2. Probes Redpanda Admin HTTP endpoints (`/v1/cluster/partitions` and `/v1/status/ready`).
    3. Python parser audits all topic partitions to identify under-replicated states and missing partition leaders.
    4. An `io.kestra.plugin.core.flow.If` condition checks if any partition is degraded beyond configured zero-tolerance thresholds.
    5. Dispatches formatted Slack alerts containing actionable metrics if an anomaly is detected.
    6. Dedicated `errors` handler captures connection timeouts and network unreachable errors.

    ## What you get

    - Early detection of network partitions or broker disk failures before data loss or consumer group stalls happen.
    - Identification of leaderless partitions that halt upstream event producers.
    - Automated audit trail recorded in Kestra execution artifacts for streaming compliance.

    ## Who it's for

    - Streaming Platform Engineers operating mission-critical Kafka-compatible Redpanda clusters.
    - SREs maintaining high-throughput event ingestion pipelines and real-time CDC architectures.

    ## Why orchestrate this with Kestra

    - Declarative partition auditing without maintaining external consumer lag daemons.
    - Native secret protection for administrative tokens via `{{ secret('REDPANDA_ADMIN_TOKEN') }}`.
    - Seamless alerting and remediation workflow integration in unified YAML pipelines.

    ## Prerequisites

    - Network route from Kestra worker to Redpanda Admin API on port 9644.
    - Admin credentials configured in Kestra secrets (if security is enabled).

    ### Secrets

    - `REDPANDA_ADMIN_TOKEN`: Bearer token for Redpanda Admin REST API.
    - `SLACK_WEBHOOK`: Incoming webhook URL for operational alerts.

    ## Quick start

    1. Deploy this flow to your Kestra instance.
    2. Set `inputs.redpanda_admin_host` and `inputs.redpanda_admin_port` to match your cluster admin endpoint.
    3. Configure the `SLACK_WEBHOOK` secret in the target namespace.
    4. Execute a manual run to verify telemetry parsing.
    5. Enable the `hourly_sentinel_schedule` trigger for continuous monitoring.

    ## How to extend

    - Add automated broker restart or partition reassignment commands inside the `then` branch.
    - Forward historical partition counts to Prometheus or ClickHouse for SLA auditing.
    - Monitor Schema Registry compatibility and subject versions via additional REST steps.

    ## Links

    - [Redpanda Admin API Documentation](https://docs.redpanda.com/current/reference/api/admin-api/)
    - [Kestra Shell Plugin](https://kestra.io/plugins/plugin-scripts-shell)
    - [Kestra Slack Plugin](https://kestra.io/plugins/plugin-slack)
