id: clickhouse-keeper-quorum-consensus-sentinel
namespace: company.clickhouse

inputs:
  - id: keeper_host
    type: STRING
    required: true
    defaults: "clickhouse-keeper.internal.company.com"
    description: "ClickHouse Keeper leader or coordinator node hostname"

  - id: keeper_port
    type: INT
    required: true
    defaults: 9181
    description: "ClickHouse Keeper coordination client port (default: 9181 or 2181)"

  - id: min_synced_followers_threshold
    type: INT
    required: true
    defaults: 2
    description: "Minimum number of active synchronized followers required to maintain healthy Raft quorum"

  - id: slack_channel
    type: STRING
    required: true
    defaults: "#clickhouse-alerts"
    description: "Destination Slack channel for ClickHouse Keeper quorum alerts"

triggers:
  - id: periodic_quorum_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/10 * * * *"

tasks:
  - id: probe_keeper_health
    type: io.kestra.plugin.scripts.python.Script
    description: "Connects to ClickHouse Keeper via 4-letter mntr command, extracting Raft state, synced followers, and quorum metrics"
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install kestra
    env:
      KEEPER_HOST: "{{ inputs.keeper_host }}"
      KEEPER_PORT: "{{ inputs.keeper_port }}"
      MIN_SYNCED_FOLLOWERS: "{{ inputs.min_synced_followers_threshold }}"
    script: |
      import os
      import sys
      import socket
      from kestra import Kestra

      host = os.environ.get("KEEPER_HOST", "localhost")
      port = int(os.environ.get("KEEPER_PORT", 9181))
      min_synced = int(os.environ.get("MIN_SYNCED_FOLLOWERS", 2))

      # Send 4-letter mntr command over TCP
      s = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
      s.settimeout(10)
      s.connect((host, port))
      s.sendall(b"mntr\n")

      response = b""
      while True:
          data = s.recv(4096)
          if not data:
              break
          response += data
      s.close()

      text = response.decode("utf-8", errors="replace")
      metrics = {}
      for line in text.strip().splitlines():
          parts = line.split(None, 1)
          if len(parts) == 2:
              metrics[parts[0].strip()] = parts[1].strip()

      server_state = metrics.get("zk_server_state", "unknown")
      synced_followers = int(metrics.get("zk_synced_followers", 0))
      total_followers = int(metrics.get("zk_followers", 0))
      outstanding_requests = int(metrics.get("zk_outstanding_requests", 0))
      version = metrics.get("zk_version", "unknown")
      uptime = int(metrics.get("zk_uptime", 0))

      is_leader = server_state == "leader"
      is_follower = server_state == "follower"
      is_standalone = server_state == "standalone"

      # Quorum risk evaluation
      quorum_degraded = False
      if is_leader and synced_followers < min_synced:
          quorum_degraded = True

      if server_state == "unknown":
          status = "CRITICAL_NODE_UNRESPONSIVE"
          runbook = (
              "ClickHouse Keeper did not return a valid server state. "
              "1. Check Keeper daemon logs for out-of-disk or crash events. "
              "2. Verify inter-node Raft communication on port 9234. "
              "3. Inspect cluster status with 'system.zookeeper_connection'."
          )
      elif quorum_degraded:
          status = "CRITICAL_QUORUM_DEGRADATION"
          runbook = (
              f"Keeper leader has only {synced_followers} synced followers (minimum required: {min_synced}). "
              "Quorum loss is imminent! Replicated table DDL and inserts will freeze. "
              "Check offline Keeper nodes and network partitions immediately."
          )
      else:
          status = "HEALTHY"
          runbook = "ClickHouse Keeper consensus is healthy with active Raft quorum."

      Kestra.outputs({
          "server_state": server_state,
          "is_leader": is_leader,
          "synced_followers": synced_followers,
          "total_followers": total_followers,
          "outstanding_requests": outstanding_requests,
          "version": version,
          "uptime_seconds": uptime,
          "quorum_degraded": quorum_degraded,
          "status": status,
          "runbook": runbook
      })

  - id: evaluate_quorum_state
    type: io.kestra.plugin.core.flow.If
    description: "Evaluates whether Raft quorum is degraded or Keeper state is compromised"
    condition: "{{ outputs.probe_keeper_health.vars.quorum_degraded == true or outputs.probe_keeper_health.vars.server_state == 'unknown' }}"
    then:
      - id: notify_slack_keeper_alert
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: "Dispatches high-urgency alert to Slack with Keeper quorum metrics and recovery runbook"
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "{{ inputs.slack_channel }}",
            "text": "⚠️ *CLICKHOUSE KEEPER QUORUM ALERT*\n*Status:* `{{ outputs.probe_keeper_health.vars.status }}`\n*Target:* `{{ inputs.keeper_host }}:{{ inputs.keeper_port }}`\n*Server State:* `{{ outputs.probe_keeper_health.vars.server_state }}` (v{{ outputs.probe_keeper_health.vars.version }})\n*Synced Followers:* {{ outputs.probe_keeper_health.vars.synced_followers }}/{{ outputs.probe_keeper_health.vars.total_followers }} (Min required: {{ inputs.min_synced_followers_threshold }})\n*Outstanding Requests:* {{ outputs.probe_keeper_health.vars.outstanding_requests }}\n*Runbook Action:* {{ outputs.probe_keeper_health.vars.runbook }}\n*Execution:* `{{ execution.id }}`"
          }

    else:
      - id: log_healthy_quorum
        type: io.kestra.plugin.core.log.Log
        description: "Logs verified healthy quorum state when Raft consensus is operating normally"
        message: "ClickHouse Keeper at {{ inputs.keeper_host }}:{{ inputs.keeper_port }} is healthy. State: {{ outputs.probe_keeper_health.vars.server_state }}. Synced followers: {{ outputs.probe_keeper_health.vars.synced_followers }}. Outstanding requests: {{ outputs.probe_keeper_health.vars.outstanding_requests }}."

  - id: finalize_quorum_telemetry
    type: io.kestra.plugin.core.output.OutputValues
    description: "Publishes final structured telemetry for audit history and ClickHouse cluster health"
    values:
      execution_id: "{{ execution.id }}"
      target: "{{ inputs.keeper_host }}"
      server_state: "{{ outputs.probe_keeper_health.vars.server_state }}"
      synced_followers: "{{ outputs.probe_keeper_health.vars.synced_followers }}"
      quorum_degraded: "{{ outputs.probe_keeper_health.vars.quorum_degraded }}"
      status: "{{ outputs.probe_keeper_health.vars.status }}"

errors:
  - id: notify_probe_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: "Alerts SRE team if the ClickHouse Keeper port is unreachable over TCP"
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "{{ inputs.slack_channel }}",
        "text": "🚨 *CLICKHOUSE KEEPER PROBE FAILED*\n*Target:* `{{ inputs.keeper_host }}:{{ inputs.keeper_port }}`\n*Failure:* Sentinel was unable to open TCP socket connection or query the `mntr` command.\n*Execution ID:* `{{ execution.id }}`\n*Flow:* `{{ flow.id }}`"
      }

extend:
  title: ClickHouse Keeper Raft Quorum and Consensus Health Sentinel
  metaTitle: ClickHouse Keeper Raft Quorum and Consensus Health Sentinel
  shortDescription: Audits ClickHouse Keeper Raft quorum, tracks synchronized followers via mntr protocol, and alerts Slack upon consensus drift.
  metaDescription: Audits ClickHouse Keeper Raft quorum and synchronized follower counts via mntr protocol, routing alerts and recovery runbooks to Slack.
  description: |
    ClickHouse Keeper is a C++ Raft-based consensus system that acts as a drop-in replacement for Apache ZooKeeper in ClickHouse clusters, managing replicated table metadata, distributed DDL mutations, and part locks. If Raft follower nodes desynchronize or fail, quorum consensus degrades, threatening split-brain conditions or freezing all replicated table write operations.

    This blueprint provides automated continuous surveillance for ClickHouse Keeper by querying the native 4-letter `mntr` command over TCP, monitoring active server roles (`leader` vs `follower`), auditing the count of synchronized followers against safe quorum floors, and dispatching actionable SRE runbook alerts to Slack before cluster write operations stall.

    ## How it works

    1. **Scheduled Probing**: The `periodic_quorum_audit` trigger (`io.kestra.plugin.core.trigger.Schedule`) executes every 10 minutes.
    2. **Mntr Telemetry Extraction**: The `probe_keeper_health` task (`io.kestra.plugin.scripts.python.Script` inside Docker) opens a TCP socket to the Keeper coordination port, executes the 4-letter `mntr` command, and extracts `zk_server_state`, `zk_synced_followers`, and queue depths.
    3. **Quorum Evaluation**: The `evaluate_quorum_state` flowable task (`io.kestra.plugin.core.flow.If`) evaluates consensus safety:
       - **Degraded Path**: Dispatches a high-urgency Slack incident card via `notify_slack_keeper_alert` (`io.kestra.plugin.slack.notifications.SlackIncomingWebhook`) specifying follower count shortfalls, queue congestion, and `rpk` / `system.zookeeper_connection` troubleshooting runbooks.
       - **Healthy Path**: Records healthy quorum confirmation in execution logs through `log_healthy_quorum` (`io.kestra.plugin.core.log.Log`).
    4. **Telemetry Export**: The `finalize_quorum_telemetry` task (`io.kestra.plugin.core.output.OutputValues`) exposes clean outputs for observability dashboards and audit compliance.
    5. **Pipeline Resilience**: An `errors` handler (`notify_probe_failure`) ensures immediate Slack alerting if the Keeper TCP socket is unreachable or network partitions occur.

    ## What you get

    - Early warning of Raft follower desynchronization before ClickHouse replicated table DDL mutations freeze.
    - Visibility into Keeper leader health and outstanding coordination request queues.
    - Direct Slack notifications enriched with synchronized follower ratios and recovery runbooks.
    - Complete execution audit history in Kestra.

    ## Who it's for

    - Database Administrators (DBAs) and Site Reliability Engineers (SREs) operating production ClickHouse clusters.
    - Data Platform Engineers migrating from legacy ZooKeeper to ClickHouse Keeper.
    - DevOps teams maintaining real-time analytical data warehouse availability.

    ## Why orchestrate this with Kestra

    Kestra simplifies coordination infrastructure monitoring by combining recurring schedules, isolated containerized script execution, conditional evaluation logic, and enterprise Slack webhooks into a unified, auditable execution graph. If a query fails or network connectivity drops, Kestra captures complete execution logs and executes automated fallback alerts without requiring custom monitoring daemons.

    ## Prerequisites

    - A running ClickHouse Keeper cluster with coordination port enabled (default 9181 or 2181) allowing 4-letter commands.
    - A Slack Incoming Webhook URL configured with permission to post to the alert channel.
    - Docker enabled on Kestra workers to run the Python script container.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Incoming Webhook URL for the target Slack workspace.

    ## Quick start

    1. Store your `SLACK_WEBHOOK_URL` in your Kestra namespace secrets.
    2. Import this blueprint into your Kestra workspace under namespace `company.clickhouse`.
    3. Trigger a manual execution with your Keeper host and port to verify connectivity and telemetry outputs.
    4. Enable the `periodic_quorum_audit` trigger to begin continuous 10-minute consensus surveillance.

    ## How to extend

    - Add automated recovery: trigger rolling node restarts via Kubernetes API or Ansible tasks on confirmed desynchronized followers.
    - Integrate with PagerDuty for critical leaderless consensus failures.
    - Query ClickHouse `system.zookeeper_connection` directly to correlate Keeper server metrics with client session health.

    ## Links

    - [ClickHouse Keeper Official Documentation](https://clickhouse.com/docs/en/operations/clickhouse-keeper)
    - [Kestra Python Script Documentation](https://kestra.io/plugins/plugin-scripts-python/io.kestra.plugin.scripts.python.script)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
    - [ClickHouse Keeper 4-Letter Commands Reference](https://clickhouse.com/docs/en/operations/clickhouse-keeper#four-letter-commands)
    - This blueprint has been created by [Pranjulchaurasiya](https://github.com/Pranjulchaurasiya)
  tags:
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - Database & Storage
  ee: false
  demo: false
