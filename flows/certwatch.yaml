id: certwatch
namespace: company.team
description: Watches TLS certificates in a namespace and alerts on Slack before they expire.

labels:
  project: certwatch
  team: platform

inputs:
  - id: namespace
    type: STRING
    displayName: "Namespace"
    description: the namespace whose TLS secrets to watch
    defaults: default
  - id: expiry_days
    type: INT
    displayName: "Expiry threshold (days)"
    description: a certificate expiring within this many days counts as troubled
    defaults: 14
  - id: slack_webhook
    type: STRING
    displayName: "Slack Webhook URL"
    description: Incoming webhook URL of the Slack channel for the alerts

triggers:
  - id: schedule
    type: io.kestra.plugin.core.trigger.Schedule
    description: checks certificate expiry every morning
    cron: "0 8 * * *"
    timezone: UTC
    inputs:
      namespace: default
      expiry_days: 14
      slack_webhook: "{{ secret('SLACK_WEBHOOK') }}"

tasks:
  - id: list_secrets
    type: io.kestra.plugin.scripts.shell.Commands
    description: lists all secrets in the namespace as JSON
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      user: "0"
    containerImage: bitnami/kubectl
    inputFiles:
      client.crt: "{{ secret('CLIENT_CRT') }}"
      client.key: "{{ secret('CLIENT_KEY') }}"
    commands:
      - kubectl get secrets -n {{ inputs.namespace }} -o json --client-certificate=client.crt --client-key=client.key --server={{ secret('MASTERURL') }} --insecure-skip-tls-verify=true > secrets.json
    outputFiles:
      - secrets.json

  - id: find_trouble
    type: io.kestra.plugin.scripts.python.Script
    description: finds certificates expiring soon, drops ones already alerted on
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      user: "0"
    containerImage: python:3.11
    dependencies:
      - kestra
    script: |
      import base64
      import json
      import subprocess
      import tempfile
      from datetime import datetime, timezone
      from kestra import Kestra

      threshold = int("""{{ inputs.expiry_days }}""")
      namespace = """{{ inputs.namespace }}"""

      with open("""{{ outputs.list_secrets.outputFiles['secrets.json'] }}""") as f:
          secrets = json.load(f)['items']

      # names we already alerted on, from the KV store (null on first run -> empty)
      raw_state = """{{ kv('certwatch-state-' ~ inputs.namespace, errorOnMissing=false) }}"""
      already = set(json.loads(raw_state) if raw_state.strip() else [])

      def days_left(pem_bytes):
          # ask openssl for the expiry date, it is on the image already
          with tempfile.NamedTemporaryFile(suffix='.crt') as tmp:
              tmp.write(pem_bytes)
              tmp.flush()
              out = subprocess.run(
                  ['openssl', 'x509', '-enddate', '-noout', '-in', tmp.name],
                  capture_output=True, text=True, check=True,
              ).stdout.strip()
          # out looks like: notAfter=Nov  1 12:00:00 2026 GMT
          expiry = datetime.strptime(out.split('=', 1)[1], '%b %d %H:%M:%S %Y %Z')
          expiry = expiry.replace(tzinfo=timezone.utc)
          return (expiry - datetime.now(timezone.utc)).days

      troubled = []
      for secret in secrets:
          if secret.get('type') != 'kubernetes.io/tls':
              continue  # only TLS secrets carry certificates
          name = secret['metadata']['name']
          pem = base64.b64decode(secret['data']['tls.crt'])
          left = days_left(pem)
          if left <= threshold:
              troubled.append({'name': name, 'days_left': left})

      troubled_names = set(t['name'] for t in troubled)
      new_trouble = [t for t in troubled if t['name'] not in already]
      # the new state is simply who is troubled right now;
      # renewed certs drop out on their own, so a future expiry alerts again

      lines = [f"*CertWatch - expiring certificates in '{namespace}'*", ""]
      for t in new_trouble:
          lines.append(f"- *{t['name']}*: expires in {t['days_left']} days (threshold {threshold})")
          lines.append(f"  inspect: `kubectl describe secret {t['name']} -n {namespace}`")
      lines.append("")
      alert_text = "\n".join(lines)

      Kestra.outputs({
          'troubled': new_trouble,
          'count': len(new_trouble),
          'new_state_json': json.dumps(sorted(troubled_names)),
          'alert_text': alert_text,
      })

  - id: maybe_alert
    type: io.kestra.plugin.core.flow.If
    description: only alerts when there is something new to report
    condition: "{{ outputs.find_trouble.vars.count > 0 }}"
    then:
      - id: send_alert
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: posts the expiring certificates to Slack
        url: "{{ inputs.slack_webhook }}"
        messageText: "{{ outputs.find_trouble.vars.alert_text }}"

  - id: save_state
    type: io.kestra.plugin.core.kv.Set
    description: remembers who is troubled now, so renewed certs alert again next time
    key: "certwatch-state-{{ inputs.namespace }}"
    value: "{{ outputs.find_trouble.vars.new_state_json }}"
    overwrite: true

extend:
  title: "CertWatch - Kubernetes TLS certificate expiry watcher"
  shortDescription: "Watches TLS certificates in a namespace and alerts on Slack before they expire."
  metaTitle: "CertWatch: Kubernetes TLS certificate expiry watcher blueprint for Kestra"
  metaDescription: "A Kestra blueprint that watches Kubernetes TLS secrets, detects certificates expiring soon, and alerts on Slack without spamming."
  tags:
    - Infrastructure
  subTags:
    - Kubernetes Operations
    - Monitoring & Alerting
  ee: false
  demo: false
  description: |
    ## How it works

    1. `list_secrets` (`io.kestra.plugin.scripts.shell.Commands`) runs `kubectl get secrets` in the target namespace and saves the full secret list as JSON. It authenticates with a client certificate and key passed as Kestra secrets, the same pattern the Kubernetes gallery blueprints use.
    2. `find_trouble` (`io.kestra.plugin.scripts.python.Script`) reads the remembered state from the KV store, then checks every secret of type `kubernetes.io/tls`. Each certificate is decoded and passed to `openssl`, which reports its expiry date. Anything expiring within the `expiry_days` input counts as troubled. Anything already alerted on is dropped.
    3. `maybe_alert` (`io.kestra.plugin.core.flow.If`) runs only when there is something new to report, and `send_alert` posts the expiring certificates to Slack with the days left and a kubectl command to inspect each one.
    4. `save_state` (`io.kestra.plugin.core.kv.Set`) writes back the new list of troubled secret names as one JSON value. Renewed certificates drop out on their own, so a future expiry alerts again.

    ## What you get

    - A daily certificate expiry check for any namespace, no agent to install inside the cluster.
    - Slack alerts only for new trouble: which certificate, how many days are left, and the kubectl command to look at it.
    - No alert spam: the KV-backed memory remembers who was already reported, and forgets certificates that got renewed.
    - Quiet runs when nothing is expiring soon.

    ## Who it's for

    Anyone running TLS-terminated workloads on Kubernetes who has been bitten by an expired certificate at 2am. Works on any cluster you can reach with a client certificate: minikube, kind, managed clusters, and cert-manager managed secrets.

    ## Why orchestrate this with Kestra

    A shell script on a cron server can check expiry dates, but then you need somewhere to keep the "already alerted" state, somewhere to hold the secrets, and a place to see the run history when an alert looks wrong. Kestra gives you all three: the KV store is the memory, secrets stay out of the YAML, and every run keeps its logs and outputs where you can inspect them.

    ## Prerequisites

    - A Kubernetes cluster reachable from where Kestra runs, with a client certificate and key for authentication.
    - Kestra with the Docker task runner available (used for the kubectl and Python steps).
    - A Slack Incoming Webhook URL.

    ### Secrets

    | Secret | What it is |
    | --- | --- |
    | `CLIENT_CRT` | base64-encoded client certificate for the cluster |
    | `CLIENT_KEY` | base64-encoded client key for the cluster |
    | `MASTERURL` | base64-encoded Kubernetes API server URL, reachable from inside the Kestra container |
    | `SLACK_WEBHOOK` | base64-encoded Slack Incoming Webhook URL |

    In Kestra OSS, secrets come from environment variables prefixed with `SECRET_` and must be base64-encoded.

    ## Quick start

    1. Start Kestra with the four secrets above as `SECRET_` environment variables.
    2. Import this flow and run it with the `namespace` you want to watch.
    3. Create a test TLS secret with a short-lived certificate and run again: the Slack alert lists the secret and the days left.
    4. Run once more without changing anything: no second alert. Renew the certificate and run again: quiet, and the state is cleared.

    ## How to extend

    - Watch ingress hostnames too by resolving TLS secrets referenced from Ingress objects.
    - Lower the schedule to every hour for faster detection by changing the `cron` trigger.
    - Deploy one copy of the flow per namespace you want to watch, changing only the `namespace` input.
    - Route alerts to PagerDuty or Opsgenie by swapping the Slack task for another notification task.

    ## Inputs

    | Input | Type | Default | What it does |
    | --- | --- | --- | --- |
    | `namespace` | STRING | `default` | the namespace whose TLS secrets to watch |
    | `expiry_days` | INT | `14` | a certificate expiring within this many days counts as troubled |
    | `slack_webhook` | STRING | (required) | Incoming webhook URL of the Slack channel for the alerts |

    ## Links

    - [Kestra blueprint catalog](https://kestra.io/blueprints)
    - [Kubernetes TLS secrets documentation](https://kubernetes.io/docs/concepts/configuration/secret/#tls-secrets)
    - [Kestra KV store documentation](https://kestra.io/docs/concepts/kv-store)

    ## Pitfalls

    - Only secrets of type `kubernetes.io/tls` are checked. Certificates stored as opaque secrets or outside Kubernetes are invisible to this flow.
    - The expiry check reads the `tls.crt` field only. If a secret has a full chain, the leaf certificate's date is what counts.
    - Make sure the `MASTERURL` is reachable from inside the Kestra container. `localhost` inside the container is not your host: use `host.docker.internal` when Kestra runs in Docker on the same machine as the cluster.
