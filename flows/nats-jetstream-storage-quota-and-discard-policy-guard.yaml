id: nats-jetstream-storage-quota-and-discard-policy-guard
namespace: company.streaming

description: |
  Inspect NATS JetStream stream byte storage utilization and discard policies, track consecutive
  saturation runs in Kestra KV, gate configuration changes behind a human approval Pause, safely
  expand byte quotas or switch discard policy to DiscardOld via native JetStream management APIs,
  and verify post-remediation storage headroom.

inputs:
  - id: nats_url
    type: STRING
    displayName: NATS Server URL
    description: URL of the target NATS broker with JetStream enabled.
    defaults: "nats://localhost:4222"

  - id: stream_name
    type: STRING
    displayName: Stream Name
    description: Name of the NATS JetStream stream to audit for storage saturation and discard policy.
    defaults: "ORDERS"

  - id: saturation_threshold_percent
    type: FLOAT
    displayName: Saturation Threshold (%)
    description: Storage utilization percentage of max_bytes required to flag a stream as saturated.
    defaults: 85.0

  - id: min_consecutive_saturated_runs
    type: INT
    displayName: Minimum Consecutive Saturated Runs
    description: Number of consecutive audit runs a stream must remain saturated before triggering automated remediation.
    defaults: 2

  - id: remediation_action
    type: SELECT
    displayName: Remediation Action
    description: Corrective action to execute when a stream reaches storage saturation or risks write rejection.
    values:
      - EXPAND_STORAGE_QUOTA
      - SET_DISCARD_OLD
      - AUDIT_ONLY
    defaults: EXPAND_STORAGE_QUOTA

  - id: quota_expansion_percent
    type: FLOAT
    displayName: Quota Expansion Percentage (%)
    description: Percentage increase applied to max_bytes when remediation_action is set to EXPAND_STORAGE_QUOTA.
    defaults: 50.0

  - id: max_quota_bytes_ceiling
    type: INT
    displayName: Maximum Quota Ceiling (Bytes)
    description: Upper safety ceiling for max_bytes to prevent unbounded storage expansion (default 10 GiB).
    defaults: 10737418240

  - id: dry_run
    type: BOOL
    displayName: Dry Run Mode
    description: When true, audits stream storage and logs planned alterations without updating stream configuration.
    defaults: true

triggers:
  - id: periodic_storage_guard
    type: io.kestra.plugin.core.trigger.Schedule
    description: Run automated NATS JetStream stream storage quota and discard policy audit every 15 minutes.
    cron: "*/15 * * * *"
    disabled: true

  - id: on_demand_storage_guard_webhook
    type: io.kestra.plugin.core.trigger.Webhook
    description: Authenticated HTTP endpoint invoked by NATS monitoring alerts, Prometheus Alertmanager, or SRE runbooks.
    key: "{{ secret('NATS_STORAGE_GUARD_WEBHOOK_KEY') }}"

tasks:
  - id: validate_inputs
    type: io.kestra.plugin.core.execution.Assert
    description: Assert operational inputs satisfy threshold and sanity constraints.
    conditions:
      - "{{ inputs.stream_name | length > 0 }}"
      - "{{ inputs.saturation_threshold_percent > 0.0 and inputs.saturation_threshold_percent <= 100.0 }}"
      - "{{ inputs.min_consecutive_saturated_runs >= 1 }}"
      - "{{ inputs.quota_expansion_percent > 0.0 }}"
      - "{{ inputs.max_quota_bytes_ceiling > 0 }}"
    errorMessage: "Invalid configuration inputs. Provide a valid stream name, saturation threshold between 0 and 100, consecutive runs >= 1, expansion percent > 0, and quota ceiling > 0."

  - id: get_stream_info
    type: io.kestra.plugin.nats.core.Request
    description: Query NATS JetStream management API for stream configuration, current sequence bounds, and byte usage.
    url: "{{ inputs.nats_url }}"
    subject: "$JS.API.STREAM.INFO.{{ inputs.stream_name }}"
    from:
      data: "{}"
    requestTimeout: PT5S
    retry:
      type: exponential
      interval: PT2S
      maxInterval: PT30S
      maxAttempts: 3

  - id: get_previous_audit_state
    type: io.kestra.plugin.core.kv.Get
    description: Retrieve historical storage telemetry from Kestra KV store to identify consecutive saturation trends.
    key: "nats_stream_storage_guard_{{ inputs.stream_name | slugify }}"
    errorOnMissing: false

  - id: evaluate_storage_and_policy
    type: io.kestra.plugin.scripts.python.Script
    description: Analyze stream byte consumption against quota limits, check discard policy write-rejection risk, and compute remediation plan.
    containerImage: python:3.11-slim
    env:
      STREAM_INFO: "{{ outputs.get_stream_info.response }}"
      PREVIOUS_STATE: "{{ (outputs.get_previous_audit_state.value ?? {}) | toJson }}"
      STREAM_NAME: "{{ inputs.stream_name }}"
      SATURATION_THRESHOLD_PERCENT: "{{ inputs.saturation_threshold_percent }}"
      MIN_CONSECUTIVE_RUNS: "{{ inputs.min_consecutive_saturated_runs }}"
      REMEDIATION_ACTION: "{{ inputs.remediation_action }}"
      QUOTA_EXPANSION_PERCENT: "{{ inputs.quota_expansion_percent }}"
      MAX_QUOTA_BYTES_CEILING: "{{ inputs.max_quota_bytes_ceiling }}"
      DRY_RUN: "{{ inputs.dry_run }}"
      EXECUTION_ID: "{{ execution.id }}"
    script: |
      import os
      import sys
      import json
      from datetime import datetime, timezone

      now_utc = datetime.now(timezone.utc)
      now_iso = now_utc.isoformat()

      stream_info_raw = os.getenv("STREAM_INFO", "{}")
      previous_state_raw = os.getenv("PREVIOUS_STATE", "{}")
      stream_name = os.getenv("STREAM_NAME", "ORDERS").strip()
      saturation_threshold_pct = float(os.getenv("SATURATION_THRESHOLD_PERCENT", "85.0"))
      min_consecutive_runs = int(os.getenv("MIN_CONSECUTIVE_RUNS", "2"))
      remediation_action = os.getenv("REMEDIATION_ACTION", "EXPAND_STORAGE_QUOTA").strip()
      quota_expansion_pct = float(os.getenv("QUOTA_EXPANSION_PERCENT", "50.0"))
      max_quota_ceiling = int(os.getenv("MAX_QUOTA_BYTES_CEILING", "10737418240"))
      dry_run = os.getenv("DRY_RUN", "true").lower() == "true"
      execution_id = os.getenv("EXECUTION_ID", "local-execution")

      try:
          stream_info = json.loads(stream_info_raw) if stream_info_raw.strip() else {}
          if not isinstance(stream_info, dict):
              stream_info = {}
      except Exception as exc:
          print(f"Error parsing stream info JSON: {exc}", file=sys.stderr)
          sys.exit(1)

      if "error" in stream_info:
          err_desc = stream_info["error"].get("description", "Unknown NATS JetStream error")
          err_code = stream_info["error"].get("err_code", "UNKNOWN")
          print(f"NATS JetStream API returned error {err_code}: {err_desc}", file=sys.stderr)
          sys.exit(1)

      try:
          prev_state = json.loads(previous_state_raw) if previous_state_raw.strip() else {}
          if not isinstance(prev_state, dict):
              prev_state = {}
      except Exception:
          prev_state = {}

      config = stream_info.get("config", {})
      state = stream_info.get("state", {})

      current_bytes = int(state.get("bytes", 0))
      current_messages = int(state.get("messages", 0))
      first_seq = int(state.get("first_seq", 0))
      last_seq = int(state.get("last_seq", 0))
      max_bytes = int(config.get("max_bytes", -1))
      discard_policy = str(config.get("discard", "old")).lower()
      retention_policy = str(config.get("retention", "limits")).lower()
      storage_type = str(config.get("storage", "file")).lower()

      if max_bytes > 0:
          storage_pct = round((current_bytes / max_bytes) * 100.0, 2)
          is_saturated = storage_pct >= saturation_threshold_pct
      else:
          storage_pct = 0.0
          is_saturated = False

      prev_bytes = int(prev_state.get("current_bytes", current_bytes))
      prev_consecutive = int(prev_state.get("consecutive_saturated_runs", 0))
      bytes_growth_delta = current_bytes - prev_bytes

      if is_saturated:
          consecutive_saturated_runs = prev_consecutive + 1
      else:
          consecutive_saturated_runs = 0

      # Rejection risk occurs when stream approaches quota while configured with discard=new
      has_rejection_risk = (discard_policy == "new") and is_saturated
      remediation_eligible = (consecutive_saturated_runs >= min_consecutive_runs) or (storage_pct >= 98.0) or (has_rejection_risk and storage_pct >= 90.0)

      remediation_config = dict(config)
      target_max_bytes = max_bytes
      target_discard = discard_policy
      action_description = ""

      if remediation_action == "EXPAND_STORAGE_QUOTA":
          if max_bytes > 0:
              expansion_factor = 1.0 + (quota_expansion_pct / 100.0)
              computed_bytes = int(max_bytes * expansion_factor)
              target_max_bytes = min(computed_bytes, max_quota_ceiling)
              if target_max_bytes <= max_bytes:
                  target_max_bytes = max_bytes
                  action_description = f"Storage quota already at safety ceiling ({max_quota_ceiling} bytes). Cannot expand further."
              else:
                  remediation_config["max_bytes"] = target_max_bytes
                  action_description = f"Expand stream max_bytes from {max_bytes} to {target_max_bytes} (+{quota_expansion_pct}% headroom, ceiling {max_quota_ceiling} bytes)."
          else:
              action_description = "Stream max_bytes is unlimited (-1). Quota expansion not required."

      elif remediation_action == "SET_DISCARD_OLD":
          if discard_policy != "old":
              target_discard = "old"
              remediation_config["discard"] = "old"
              action_description = "Switch discard policy from 'new' to 'old' to eliminate producer write rejection deadlock."
          else:
              action_description = "Stream discard policy is already 'old'. No policy update needed."

      else: # AUDIT_ONLY
          action_description = f"Audit only mode active. Stream evaluated at {storage_pct}% storage quota with discard={discard_policy}."

      overall_status = "CRITICAL" if has_rejection_risk else ("WARNING" if is_saturated else "HEALTHY")

      summary_text = (
          f"NATS JetStream Storage Guard: {overall_status} | Stream '{stream_name}' "
          f"(storage: {current_bytes} / {max_bytes if max_bytes > 0 else 'unlimited'} bytes, {storage_pct}% utilized). "
          f"Discard policy: '{discard_policy}'. Consecutive saturated runs: {consecutive_saturated_runs}. "
          f"Remediation: {remediation_action} (Dry Run: {dry_run}). Action: {action_description}"
      )
      print(summary_text)

      new_state_snapshot = {
          "stream_name": stream_name,
          "current_bytes": current_bytes,
          "max_bytes": max_bytes,
          "storage_pct": storage_pct,
          "discard_policy": discard_policy,
          "consecutive_saturated_runs": consecutive_saturated_runs,
          "bytes_growth_delta": bytes_growth_delta,
          "last_seq": last_seq,
          "first_seq": first_seq,
          "last_evaluated_at": now_iso,
          "execution_id": execution_id,
          "overall_status": overall_status
      }

      audit_manifest = {
          "overall_status": overall_status,
          "stream_name": stream_name,
          "current_bytes": current_bytes,
          "max_bytes": max_bytes,
          "storage_pct": storage_pct,
          "discard_policy": discard_policy,
          "retention_policy": retention_policy,
          "storage_type": storage_type,
          "current_messages": current_messages,
          "first_seq": first_seq,
          "last_seq": last_seq,
          "is_saturated": is_saturated,
          "has_rejection_risk": has_rejection_risk,
          "consecutive_saturated_runs": consecutive_saturated_runs,
          "bytes_growth_delta": bytes_growth_delta,
          "remediation_action": remediation_action,
          "remediation_eligible": remediation_eligible,
          "target_max_bytes": target_max_bytes,
          "target_discard": target_discard,
          "action_description": action_description,
          "dry_run": dry_run,
          "evaluated_at": now_iso,
          "execution_id": execution_id,
          "summary": summary_text
      }

      print("::" + json.dumps({
          "outputs": {
              "overall_status": overall_status,
              "has_saturation": is_saturated,
              "has_rejection_risk": has_rejection_risk,
              "storage_pct": storage_pct,
              "current_bytes": current_bytes,
              "max_bytes": max_bytes,
              "discard_policy": discard_policy,
              "consecutive_saturated_runs": consecutive_saturated_runs,
              "remediation_eligible": remediation_eligible,
              "target_max_bytes": target_max_bytes,
              "target_discard": target_discard,
              "action_description": action_description,
              "remediation_payload_json": json.dumps(remediation_config),
              "new_state_snapshot": new_state_snapshot,
              "audit_manifest": audit_manifest,
              "summary_text": summary_text
          }
      }) + "::")

  - id: save_audit_state
    type: io.kestra.plugin.core.kv.Set
    description: Persist updated stream storage metrics and consecutive saturation counters in Kestra KV store for sequential trend analysis.
    key: "nats_stream_storage_guard_{{ inputs.stream_name | slugify }}"
    value: "{{ outputs.evaluate_storage_and_policy.vars.new_state_snapshot | toJson }}"
    kvType: JSON

  - id: evaluate_storage_findings
    type: io.kestra.plugin.core.flow.If
    description: Branch workflow execution based on whether storage saturation or write-rejection risk was identified.
    condition: "{{ outputs.evaluate_storage_and_policy.vars.has_saturation == true or outputs.evaluate_storage_and_policy.vars.has_rejection_risk == true }}"
    then:
      - id: remediation_gate
        type: io.kestra.plugin.core.flow.If
        description: Execute automated stream quota expansion or discard policy remediation when dry_run is disabled and saturation persists.
        condition: "{{ not inputs.dry_run and outputs.evaluate_storage_and_policy.vars.remediation_eligible == true and inputs.remediation_action != 'AUDIT_ONLY' }}"
        then:
          - id: pause_for_remediation_approval
            type: io.kestra.plugin.core.flow.Pause
            description: Pause workflow execution for operator review before updating live stream storage configuration. Resume to apply or kill to abort.

          - id: update_stream_configuration
            type: io.kestra.plugin.nats.core.Request
            description: Send JetStream stream update management request with revised storage quota or discard policy.
            url: "{{ inputs.nats_url }}"
            subject: "$JS.API.STREAM.UPDATE.{{ inputs.stream_name }}"
            from:
              data: "{{ outputs.evaluate_storage_and_policy.vars.remediation_payload_json }}"
            requestTimeout: PT5S
            retry:
              type: exponential
              interval: PT2S
              maxInterval: PT30S
              maxAttempts: 3

          - id: verify_updated_stream
            type: io.kestra.plugin.nats.core.Request
            description: Post-remediation verification querying JetStream management API to verify updated quota or discard policy application.
            url: "{{ inputs.nats_url }}"
            subject: "$JS.API.STREAM.INFO.{{ inputs.stream_name }}"
            from:
              data: "{}"
            requestTimeout: PT5S
            retry:
              type: exponential
              interval: PT2S
              maxInterval: PT30S
              maxAttempts: 3

          - id: verify_remediation_outcome
            type: io.kestra.plugin.scripts.python.Script
            description: Validate that the updated stream configuration was applied by the NATS cluster and verify post-remediation headroom.
            containerImage: python:3.11-slim
            env:
              VERIFY_RESPONSE: "{{ outputs.verify_updated_stream.response }}"
              STREAM_NAME: "{{ inputs.stream_name }}"
              TARGET_MAX_BYTES: "{{ outputs.evaluate_storage_and_policy.vars.target_max_bytes }}"
              TARGET_DISCARD: "{{ outputs.evaluate_storage_and_policy.vars.target_discard }}"
              REMEDIATION_ACTION: "{{ inputs.remediation_action }}"
            script: |
              import os
              import sys
              import json

              verify_raw = os.getenv("VERIFY_RESPONSE", "{}")
              stream_name = os.getenv("STREAM_NAME", "ORDERS")
              target_max_bytes = int(os.getenv("TARGET_MAX_BYTES", "-1"))
              target_discard = os.getenv("TARGET_DISCARD", "old").lower()
              remediation_action = os.getenv("REMEDIATION_ACTION", "EXPAND_STORAGE_QUOTA")

              try:
                  verify_info = json.loads(verify_raw) if verify_raw.strip() else {}
              except Exception as exc:
                  print(f"Failed to parse verification response JSON: {exc}", file=sys.stderr)
                  sys.exit(1)

              if "error" in verify_info:
                  err = verify_info["error"].get("description", "Unknown error")
                  print(f"Post-remediation verification failed with NATS error: {err}", file=sys.stderr)
                  sys.exit(1)

              cfg = verify_info.get("config", {})
              applied_max_bytes = int(cfg.get("max_bytes", -1))
              applied_discard = str(cfg.get("discard", "old")).lower()

              print(f"Post-Remediation Verification for Stream '{stream_name}':")
              print(f"  Applied max_bytes: {applied_max_bytes} (target: {target_max_bytes})")
              print(f"  Applied discard: '{applied_discard}' (target: '{target_discard}')")

              if remediation_action == "EXPAND_STORAGE_QUOTA" and target_max_bytes > 0:
                  if applied_max_bytes < target_max_bytes:
                      print(f"Verification failure: applied max_bytes ({applied_max_bytes}) does not meet target ({target_max_bytes})", file=sys.stderr)
                      sys.exit(1)

              if remediation_action == "SET_DISCARD_OLD":
                  if applied_discard != "old":
                      print(f"Verification failure: applied discard ('{applied_discard}') is not 'old'", file=sys.stderr)
                      sys.exit(1)

              print("Post-remediation verification SUCCESSFUL. Stream configuration confirmed active on NATS cluster.")

          - id: log_remediation_success
            type: io.kestra.plugin.core.log.Log
            description: Log successful verification and operational recovery details.
            message: "Successfully remediated NATS JetStream stream '{{ inputs.stream_name }}'. Action: {{ outputs.evaluate_storage_and_policy.vars.action_description }}."

        else:
          - id: log_dry_run_remediation
            type: io.kestra.plugin.core.log.Log
            description: Log proposed remediation plan in dry-run mode or when consecutive threshold is not yet met.
            message: "Remediation bypassed (dry_run: {{ inputs.dry_run }}, eligible: {{ outputs.evaluate_storage_and_policy.vars.remediation_eligible }}). Planned action: {{ outputs.evaluate_storage_and_policy.vars.action_description }}."

      - id: save_recovery_audit_kv
        type: io.kestra.plugin.core.kv.Set
        description: Record complete recovery audit manifest and incident forensics into Kestra KV store.
        key: "nats_stream_storage_audit_{{ inputs.stream_name | slugify }}"
        value: "{{ outputs.evaluate_storage_and_policy.vars.audit_manifest | toJson }}"
        kvType: JSON

      - id: notify_slack_storage_alert
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Deliver actionable incident notification to Slack with stream storage utilization and recovery details.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "attachments": [
              {
                "color": "{{ outputs.evaluate_storage_and_policy.vars.overall_status == 'CRITICAL' ? '#E01E5A' : '#ECB22E' }}",
                "title": ":warning: NATS JetStream Storage Saturation & Quota Guard Alert",
                "text": "{{ outputs.evaluate_storage_and_policy.vars.summary_text }}",
                "fields": [
                  {
                    "title": "Stream Name",
                    "value": "`{{ inputs.stream_name }}`",
                    "short": true
                  },
                  {
                    "title": "Overall Status",
                    "value": "*{{ outputs.evaluate_storage_and_policy.vars.overall_status }}*",
                    "short": true
                  },
                  {
                    "title": "Storage Utilization",
                    "value": "{{ outputs.evaluate_storage_and_policy.vars.storage_pct }}%",
                    "short": true
                  },
                  {
                    "title": "Discard Policy",
                    "value": "`{{ outputs.evaluate_storage_and_policy.vars.discard_policy }}`",
                    "short": true
                  },
                  {
                    "title": "Consecutive Saturated Runs",
                    "value": "{{ outputs.evaluate_storage_and_policy.vars.consecutive_saturated_runs }}",
                    "short": true
                  },
                  {
                    "title": "Remediation Action",
                    "value": "`{{ inputs.remediation_action }}` (Dry Run: `{{ inputs.dry_run }}`)",
                    "short": true
                  }
                ]
              }
            ]
          }

    else:
      - id: log_healthy_state
        type: io.kestra.plugin.core.log.Log
        description: Log healthy stream storage status when utilization remains below the saturation watermark.
        message: "NATS JetStream stream '{{ inputs.stream_name }}' storage is healthy ({{ outputs.evaluate_storage_and_policy.vars.storage_pct }}% of quota utilized, discard policy: {{ outputs.evaluate_storage_and_policy.vars.discard_policy }})."

errors:
  - id: alert_on_flow_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Dispatch emergency alert to Slack if an unexpected execution error occurs during NATS storage audit.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "attachments": [
          {
            "color": "#E01E5A",
            "title": ":rotating_light: NATS JetStream Storage Guard Execution Failed",
            "text": "Failed execution `{{ execution.id }}` while auditing stream `{{ inputs.stream_name }}` on `{{ inputs.nats_url }}`.\nCheck NATS cluster connectivity, credentials, or worker logs."
          }
        ]
      }

extend:
  title: NATS JetStream Storage Quota and Discard Policy Auto-Remediation Guard
  metaTitle: NATS JetStream Storage Quota & Discard Policy Guard | Kestra
  shortDescription: Audit NATS JetStream stream byte quota and discard policy, track saturation trends in KV, gate remediation with approval, and auto-expand quota or flip discard policy safely.
  metaDescription: Remediate NATS JetStream storage saturation. Audit byte quotas and discard policies, track trends in KV, gate updates with Pause, and verify headroom.
  description: |
    Production NATS JetStream message streams often experience storage exhaustion when write volumes
    surge or consumer processing slows down. When a stream is provisioned with a fixed `max_bytes`
    storage quota and the `discard: new` (DiscardNew) policy, reaching the byte ceiling causes the broker
    to reject all new publishes with error `10077: stream maximum bytes reached`. Upstream microservices
    fail to publish events, creating widespread cascading ingestion outages while existing messages
    remain locked in storage.

    Conversely, streams configured with `discard: old` (DiscardOld) avoid write-rejection deadlocks by
    silently evicting the oldest unacknowledged records, which can lead to catastrophic data loss if
    slow consumers fall behind. Detecting persistent storage saturation across consecutive runs,
    evaluating discard policy trade-offs, expanding storage limits safely, and providing automated
    recovery with human oversight is critical to maintaining reliable streaming architectures.

    This blueprint provides an automated storage quota and discard policy guard that queries the NATS
    JetStream management API, correlates byte consumption against previous snapshots in Kestra KV,
    identifies consecutive saturation trends, pauses for operator sign-off before modifying cluster
    state, safely expands stream quotas or switches discard policies via native JetStream update APIs,
    and verifies post-remediation storage headroom.

    ## How it works

    1. **Pre-flight Assertion**: The `validate_inputs` task (`io.kestra.plugin.core.execution.Assert`) validates input thresholds, ensuring valid stream names, saturation percentages between 0 and 100, positive consecutive run counts, and non-zero quota ceilings.
    2. **Stream Telemetry Discovery**: The `get_stream_info` task (`io.kestra.plugin.nats.core.Request`) queries the NATS JetStream management API at `$JS.API.STREAM.INFO.<stream>` to retrieve effective storage bounds, current byte usage, message counts, discard policy, and retention modes.
    3. **Historical State Retrieval**: The `get_previous_audit_state` task (`io.kestra.plugin.core.kv.Get`) retrieves the previous execution snapshot from the Kestra KV store under `nats_stream_storage_guard_{stream_name}` to calculate growth deltas and consecutive saturation counts.
    4. **Differential Saturation Analysis**: A Python script (`evaluate_storage_and_policy`) calculates the stream storage percentage against `max_bytes`. It flags streams exceeding `saturation_threshold_percent` across `min_consecutive_saturated_runs`, evaluates publisher rejection risk when `discard: new` is active, and prepares an updated `StreamConfig` payload based on the selected remediation policy (`EXPAND_STORAGE_QUOTA` or `SET_DISCARD_OLD`).
    5. **Cross-Run State Tracking**: The `save_audit_state` task (`io.kestra.plugin.core.kv.Set`) writes the updated storage snapshot, byte growth delta, and saturation counter to Kestra KV.
    6. **Approval-Gated Remediation**: When storage saturation or write-rejection risk is detected and `dry_run` is disabled, the workflow enters `pause_for_remediation_approval` (`io.kestra.plugin.core.flow.Pause`) for human verification.
    7. **Write-Path Configuration Update**: Upon operator resumption, `update_stream_configuration` (`io.kestra.plugin.nats.core.Request`) transmits the updated configuration payload to `$JS.API.STREAM.UPDATE.<stream>` on the NATS broker.
    8. **Post-Remediation Verification**: The `verify_updated_stream` task re-queries `$JS.API.STREAM.INFO.<stream>`, and `verify_remediation_outcome` asserts that the new `max_bytes` quota or `discard` policy was applied and is actively enforced by the cluster.
    9. **Incident Forensics and Notifications**: The complete audit manifest is archived in Kestra KV under `nats_stream_storage_audit_{stream_name}`, and structured Slack notifications are dispatched with diagnostic metrics and recovery status.

    ## What you get

    - Continuous monitoring of NATS JetStream stream byte storage utilization and discard policies.
    - Early warning detection of publisher write-rejection deadlocks caused by `discard: new` saturation.
    - Differential trend tracking in Kestra KV preventing false alarms on transient traffic spikes.
    - Dual remediation strategies supporting automated storage quota expansion (`EXPAND_STORAGE_QUOTA`) or emergency write-unblocking (`SET_DISCARD_OLD`).
    - Operator approval gates and dry-run verification to prevent accidental cluster misconfiguration.
    - Post-remediation verification confirming that quota updates took effect on the live broker.
    - Comprehensive KV store audit manifests for compliance tracking and capacity planning.

    ## Who it's for

    - Streaming Platform Engineers and Site Reliability Engineers (SREs) managing NATS JetStream clusters.
    - Event-Driven Architecture (EDA) teams maintaining mission-critical microservice message streams.
    - DevOps and Data Platform teams seeking automated capacity management and day-2 operations.

    ## Why orchestrate this with Kestra

    NATS provides native management APIs over request-reply subjects, but lacks built-in mechanisms to track multi-run trend velocity, enforce human approval gates, or coordinate multi-channel incident notifications.
    Writing ad-hoc shell scripts or external cron daemons introduces unmonitored failure points without execution history, secret encryption, or post-change verification.

    Orchestrating this guard with Kestra delivers a declarative workflow with native NATS protocol integration, atomic state tracking in Kestra KV, human-in-the-loop pause-and-resume gates, encrypted secrets management, and automated Slack escalation.

    ## Prerequisites

    - An accessible NATS broker (version 2.2 or higher) with JetStream enabled, reachable from the Kestra worker.
    - Target JetStream stream created on the NATS broker (e.g. `ORDERS`).
    - A Slack Incoming Webhook URL to receive storage alerts and incident notifications.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook endpoint URL used for storage saturation and error alerts.
    - `NATS_STORAGE_GUARD_WEBHOOK_KEY`: Secret authentication token protecting the on-demand webhook trigger.

    ## Quick start

    1. Configure `SLACK_WEBHOOK_URL` and `NATS_STORAGE_GUARD_WEBHOOK_KEY` in your Kestra namespace secrets.
    2. Import this blueprint and set `nats_url` and `stream_name` to match your target NATS environment.
    3. Run a manual execution with `dry_run: true` to record an initial storage baseline and review detected metrics.
    4. Set `dry_run: false` and `remediation_action: EXPAND_STORAGE_QUOTA` to enable approval-gated auto-expansion.
    5. Enable the `periodic_storage_guard` schedule trigger to monitor stream storage continuously every 15 minutes.

    ## How to extend

    - **Multi-Stream Fleet Auditing**: Wrap the stream evaluation in an `io.kestra.plugin.core.flow.Loop` over `$JS.API.STREAM.NAMES` to audit all streams across the NATS cluster.
    - **PagerDuty Incident Escalation**: Integrate `io.kestra.plugin.pagerduty.notifications.PagerDutyAlert` to page on-call SREs when a stream exceeds 95% capacity with `discard: new`.
    - **Stream Retention Aging**: Configure `max_age` adjustments during remediation to evict stale historical messages while preserving recent transaction events.

