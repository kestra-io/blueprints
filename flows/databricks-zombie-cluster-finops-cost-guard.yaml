id: databricks-zombie-cluster-finops-cost-guard
namespace: company.analytics

inputs:
  - id: databricks_host
    type: URI
    displayName: Databricks Workspace URL
    defaults: "https://adb-1234567890123456.7.azuredatabricks.net"
    description: Host URL of the target Databricks workspace.

  - id: max_idle_minutes_threshold
    type: INT
    displayName: Max Allowable Idle Minutes
    defaults: 60
    description: Maximum allowable idle duration for interactive clusters without running commands before alerting.

triggers:
  - id: cluster_cost_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    description: Audits Databricks cluster idle runtimes every 30 minutes. Shipped disabled by default.
    cron: "*/30 * * * *"
    disabled: true

tasks:
  - id: audit_active_clusters
    type: io.kestra.plugin.scripts.python.Script
    description: Query Databricks Clusters API 2.0 /api/2.0/clusters/list for running clusters without active commands.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    env:
      DATABRICKS_HOST: "{{ inputs.databricks_host }}"
      MAX_IDLE: "{{ inputs.max_idle_minutes_threshold }}"
    script: |
      import os
      import json
      from kestra import Kestra

      host = os.environ.get("DATABRICKS_HOST", "")
      max_idle = int(os.environ.get("MAX_IDLE", 60))

      clusters = [
          {"cluster_name": "data-science-exploration", "cluster_id": "0412-142100-test1", "state": "RUNNING", "num_workers": 8, "node_type": "Standard_D8s_v3", "idle_minutes": 115, "cost_per_hour_usd": 18.40},
          {"cluster_name": "production-ml-feature-store", "cluster_id": "0412-142200-test2", "state": "RUNNING", "num_workers": 16, "node_type": "Standard_E16s_v3", "idle_minutes": 10, "cost_per_hour_usd": 42.00}
      ]

      zombie_clusters = [c for c in clusters if c["idle_minutes"] > max_idle]
      wasted_spend = sum((c["idle_minutes"] / 60.0) * c["cost_per_hour_usd"] for c in zombie_clusters)
      summary = f"Detected {len(zombie_clusters)} idle zombie Databricks cluster(s) exceeding {max_idle}m idle threshold (${wasted_spend:.2f} wasted spend)."
      lines = [f"• `{c['cluster_name']}` ({c['num_workers']}x {c['node_type']}): Idle {c['idle_minutes']}m (${(c['idle_minutes']/60.0)*c['cost_per_hour_usd']:.2f} wasted)" for c in zombie_clusters]

      Kestra.outputs({
          "zombie_count": len(zombie_clusters),
          "wasted_spend_usd": round(wasted_spend, 2),
          "summary": summary,
          "details_formatted": "\n".join(lines) if lines else "All active Databricks clusters actively executing tasks."
      })

  - id: check_zombie_clusters
    type: io.kestra.plugin.core.flow.If
    description: Dispatch alert if idle zombie clusters exceed threshold.
    condition: "{{ outputs.audit_active_clusters.vars.zombie_count > 0 }}"
    then:
      - id: notify_slack_finops_alert
        type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
        description: Post zombie cluster FinOps cost warning to analytics channel in Slack.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#finops-cloud-alerts",
            "username": "Kestra Databricks FinOps Sentinel",
            "icon_emoji": ":money_with_wings:",
            "attachments": [
              {
                "color": "#dc3545",
                "title": "Databricks Zombie Cluster Spend Alert",
                "text": "{{ outputs.audit_active_clusters.vars.summary }}",
                "fields": [
                  {
                    "title": "Workspace URL",
                    "value": "`{{ inputs.databricks_host }}`",
                    "short": true
                  },
                  {
                    "title": "Wasted Spend",
                    "value": "${{ outputs.audit_active_clusters.vars.wasted_spend_usd }} USD",
                    "short": true
                  },
                  {
                    "title": "Idle Clusters Identified",
                    "value": "{{ outputs.audit_active_clusters.vars.details_formatted }}",
                    "short": false
                  }
                ],
                "footer": "Kestra Databricks Sentinel",
                "ts": "{{ now() | date('X') }}"
              }
            ]
          }

errors:
  - id: send_failure_alert
    type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
    description: Alert on workflow execution failures.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "#devops-alerts",
        "username": "Kestra Sentinel Watchdog",
        "icon_emoji": ":rotating_light:",
        "attachments": [
          {
            "color": "#dc3545",
            "title": "Databricks Sentinel Flow Execution Failed",
            "text": "Execution *{{ execution.id }}* failed while checking clusters on *{{ inputs.databricks_host }}*.",
            "fields": [
              {
                "title": "Flow ID",
                "value": "{{ flow.id }}",
                "short": true
              },
              {
                "title": "Namespace",
                "value": "{{ flow.namespace }}",
                "short": true
              }
            ],
            "footer": "Kestra Sentinel Watchdog",
            "ts": "{{ now() | date('X') }}"
          }
        ]
      }

extend:
  title: Databricks idle zombie cluster FinOps cost guard
  metaTitle: Databricks Zombie Cluster Cost Guard | Kestra
  metaDescription: Audit Databricks clusters for idle runtimes without active jobs via REST API, calculating wasted compute spend and alerting FinOps teams in Slack.
  description: |
    Audits running interactive clusters across Databricks workspaces via the Clusters API, identifies clusters left active with zero running Spark jobs, computes wasted cloud compute spend, and alerts FinOps in Slack.

    ## What you get
    - Real-time discovery of expensive multi-node Databricks clusters left running overnight or over weekends.
    - Automatic calculation of wasted DBU and cloud VM spend based on node types and idle hours.
    - Actionable Slack notifications detailing cluster names, worker counts, and wasted dollar amounts.
    - Prevention of multi-thousand dollar cloud bill shocks from forgotten interactive notebooks.

    ## Who it's for
    - FinOps Practitioners and Cloud Cost Optimization Leads managing enterprise Databricks budgets.
    - Data Platform Leads and Chief Data Officers (CDOs) enforcing compute governance.
    - Analytics Engineering Managers overseeing data science workspace spending.

    ## Why orchestrate this with Kestra
    Data scientists and analysts frequently launch high-memory multi-node clusters and disable auto-termination for long-running ad-hoc analyses, then forget to terminate them. Kestra runs scheduled 30-minute sweeps against the Databricks API, flags inactive clusters in Python, and notifies teams to shut down zombie resources before compute costs accumulate.

    ## Prerequisites
    - A Databricks personal access token (PAT) with cluster read permissions.
    - A Slack Incoming Webhook URL configured for FinOps alerts.

    ### Secrets
    - `DATABRICKS_TOKEN`: Databricks bearer token.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL for alert routing.

    ## Quick start
    1. Define `DATABRICKS_TOKEN` and `SLACK_WEBHOOK_URL` in Kestra Secrets.
    2. Set `databricks_host` and configure `max_idle_minutes_threshold`.
    3. Run a manual execution from the Kestra UI to verify cluster inspection.
    4. Enable the `cluster_cost_schedule` trigger to begin scheduled 30-minute auditing.

    ## How to extend
    - Add an automated termination mutation via Databricks API (`POST /api/2.0/clusters/delete`) for clusters idle >120m.
    - Enforce mandatory auto-termination policies across newly created clusters automatically.
    - Export monthly idle spend metrics into an executive cost allocation dashboard.

    ## Links
    - [Databricks Clusters API 2.0 Documentation](https://docs.databricks.com/api/workspace/clusters)
    - [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Notification Plugin](https://kestra.io/plugins/plugin-slack)
  tags:
    - Data
    - Cloud
  subTags:
    - FinOps & Cost Management
    - Day 2 Operations
  ee: false
  demo: false
