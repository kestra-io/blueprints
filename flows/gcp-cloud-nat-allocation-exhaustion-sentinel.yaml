id: gcp-cloud-nat-allocation-exhaustion-sentinel
namespace: company.cloud

inputs:
  - id: project_id
    type: STRING
    description: Google Cloud Project ID.
  - id: gateway_name
    type: STRING
    description: Cloud NAT gateway name to audit.
  - id: dropped_connections_threshold
    type: INT
    defaults: 10
    description: Maximum acceptable dropped outbound connections over the 15-minute evaluation window.

tasks:
  - id: query_nat_metrics
    type: io.kestra.plugin.gcp.cli.GCloudCLI
    projectId: "{{ inputs.project_id }}"
    serviceAccount: "{{ secret('GCP_SERVICE_ACCOUNT') }}"
    commands:
      - |
        START_TIME=$(date -u -v-15M +%Y-%m-%dT%H:%M:%SZ)
        FILTER="metric.type="router.googleapis.com/nat/dropped_sent_packets_count" AND resource.labels.nat_gateway_name="{{ inputs.gateway_name }}""
        
        gcloud monitoring timeseries list \
          --filter="$FILTER" \
          --interval-start-time="$START_TIME" \
          --format=json > /tmp/nat_dropped.json
        
        DROPPED_COUNT=$(jq '[.[]?.points[]?.value.int64Value // 0] | add // 0' /tmp/nat_dropped.json)
        
        echo "::set-output name=dropped_count::$DROPPED_COUNT::"

  - id: evaluate_nat_health
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.query_nat_metrics.vars.dropped_count | int >= inputs.dropped_connections_threshold }}"
    then:
      - id: notify_network_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#gcp-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 Google Cloud NAT Port Exhaustion Alert",
                "text": "Cloud NAT gateway `{{ inputs.gateway_name }}` in project `{{ inputs.project_id }}` dropped *{{ outputs.query_nat_metrics.vars.dropped_count }} packets* due to SNAT port exhaustion! Impact: Private GKE pods and Compute Engine VMs cannot establish outbound connections to external APIs, package mirrors, and cloud services.",
                "footer": "Kestra Network Sentinel • Google Cloud NAT"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#gcp-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ Google Cloud NAT Port Allocation and Dropped Connection Sentinel Pipeline Failure",
            "text": "Failed to query Cloud Monitoring for Cloud NAT metrics. Verify gateway name and IAM permissions.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true
    inputs:
      project_id: replace-with-your-project-id
      gateway_name: replace-with-your-gateway-name

extend:
  metaDescription: "Monitors Google Cloud NAT gateway port exhaustion metrics to detect outbound TCP connection drops."
  metaTitle: Google Cloud NAT Port Allocation and Dropped Connection Sentinel with Kestra
  title: Google Cloud NAT Port Allocation and Dropped Connection Sentinel
  shortDescription: Monitors Google Cloud NAT gateway port exhaustion metrics to detect outbound TCP connection drops.
  description: |
    ## How it works
    This workflow executes `gcloud monitoring timeseries list` to inspect `router.googleapis.com/nat/dropped_sent_packets_count` for the specified Cloud NAT gateway. When workloads on private subnets generate high volumes of outbound connections and dynamic port allocation reaches quota limits, the gateway cannot allocate source NAT ports. Outbound SYN packets are dropped, breaking external API requests. Slack is alerted when drops occur.

    ## What you get
    - Immediate detection of Cloud NAT gateway SNAT port exhaustion.
    - Prevents silent outbound connection timeouts on private GKE and Compute workloads.
    - Actionable metrics on dropped packet volumes.

    ## Who it's for
    - Cloud Network Engineers and SREs maintaining GCP VPC network egress.
    - Platform teams operating high-traffic private Kubernetes clusters on GKE.

    ## Why orchestrate this with Kestra
    - **Native Cloud Monitoring Extraction**: Inspects network router telemetry without external monitoring agents.
    - **Continuous Egress Health Assurance**: Guarantees outbound connectivity reliability for microservices.
    - **Automated IP Allocation**: Chain into workflows that assign additional static IP addresses to the gateway.

    ## Prerequisites
    - Google Cloud project with Cloud NAT gateway and Cloud Router configured.
    - Secrets `GCP_SERVICE_ACCOUNT` and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import the blueprint.
    2. Configure project ID and NAT gateway name.
    3. Run the workflow to inspect NAT port allocation health.

    ## How to extend
    - Automatically add additional external IP addresses to the NAT gateway via gcloud.
    - Monitor `allocated_ports` utilization percentage per VM instance.

    ## Links
    - [Google Cloud NAT Monitoring Documentation](https://cloud.google.com/nat/docs/monitoring)
    - [Kestra GCloud CLI Plugin](https://kestra.io/plugins/plugin-gcp/io.kestra.plugin.gcp.gcloud.gcloudcli)
  tags:
    - Cloud
    - Infrastructure
  subTags:
    - GCP Services
    - Infrastructure Automation
  ee: false
  demo: false
