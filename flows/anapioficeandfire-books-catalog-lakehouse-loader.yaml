id: anapioficeandfire-books-catalog-lakehouse-loader
namespace: company.analytics
description: Ingests fantasy literature bibliographic metadata, publication dates, and ISBN registries from An API of Ice and Fire into DuckDB, exports Parquet and analytics datasets, and manages sync state with Kestra KV store.

inputs:
  - id: state_key
    type: STRING
    description: Kestra KV store key tracking processed unique entity identifiers.
    defaults: anapioficeandfire-books-catalog-lakehouse-loader_state

variables:
  default_state: "[]"

triggers:
  - id: periodic_sync
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 4 * * 1"

tasks:
  - id: get_current_state
    type: io.kestra.plugin.core.kv.Get
    key: "{{ inputs.state_key }}"
    errorOnMissing: false

  - id: ingest_and_transform
    type: io.kestra.plugin.scripts.python.Commands
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install requests duckdb
    commands:
      - |
        python3 - << 'PYEOF'
        import os
        import json
        import requests
        import duckdb
        from datetime import datetime, timezone

        raw_state = """{{ outputs.get_current_state.value ?? vars.default_state }}"""
        try:
            seen_ids = set(json.loads(raw_state))
        except Exception:
            seen_ids = set()

        url = "https://anapioficeandfire.com/api/books"
        headers = {"User-Agent": "KestraLakehouseLoader/1.0 (kestra-data-pipeline; contact@company.internal)"}

        resp = requests.get(url, headers=headers, timeout=30)
        resp.raise_for_status()
        data = resp.json()
        root_key = ""
        items = data.get(root_key, data) if root_key else data

        records = []
        now_iso = datetime.now(timezone.utc).isoformat()
        current_ids = []

        
        for item in items:
            isbn = str(item.get('isbn', 'UNKNOWN'))
            current_ids.append(isbn)
            name = item.get('name', 'Unknown')
            pub = item.get('publisher', 'Unknown')
            country = item.get('country', 'Unknown')
            try:
                pages = int(item.get('numberOfPages', 0))
            except Exception:
                pages = 0
            rel = item.get('released', 'UNKNOWN')

            records.append({
                'isbn': isbn,
                'name': str(name),
                'publisher': str(pub),
                'country': str(country),
                'number_of_pages': pages,
                'released': str(rel),
                'is_new': bool(isbn not in seen_ids),
                'ingestion_timestamp': now_iso
            })
        

        con = duckdb.connect(database=":memory:")
        con.execute("""
            CREATE TABLE asoiaf_books (
                isbn VARCHAR,
                name VARCHAR,
                publisher VARCHAR,
                country VARCHAR,
                number_of_pages INTEGER,
                released VARCHAR,
                is_new BOOLEAN,
                ingestion_timestamp VARCHAR
            );
        """)

        if records:
            con.execute("INSERT INTO asoiaf_books SELECT * FROM read_json_auto(?)", [json.dumps(records)])

        con.execute("COPY asoiaf_books TO 'asoiaf_books.parquet' (FORMAT PARQUET, COMPRESSION ZSTD);")
        con.execute("""
            COPY (
                SELECT
                    publisher,
                    COUNT(*) AS book_count,
                    SUM(number_of_pages) AS total_pages
                FROM asoiaf_books
                GROUP BY 1
                ORDER BY book_count DESC
            ) TO 'books_by_publisher.csv' (HEADER, DELIMITER ',');
        """)

        new_count = con.execute("SELECT count(*) FROM asoiaf_books WHERE is_new = true").fetchone()[0]
        total_count = con.execute("SELECT count(*) FROM asoiaf_books").fetchone()[0]

        updated_ids = list(seen_ids.union(current_ids))
        with open("updated_state.json", "w") as f:
            json.dump(updated_ids, f)

        metrics = {
            "total_extracted": total_count,
            "new_entities": new_count,
            "synced_at": now_iso
        }
        with open("metrics.json", "w") as f:
            json.dump(metrics, f)

        print(f"Lakehouse sync complete. Processed {total_count} records ({new_count} newly observed).")
        PYEOF
    outputFiles:
      - asoiaf_books.parquet
      - books_by_publisher.csv
      - updated_state.json
      - metrics.json

  - id: update_state
    type: io.kestra.plugin.core.kv.Set
    key: "{{ inputs.state_key }}"
    value: "{{ read(outputs.ingest_and_transform.outputFiles['updated_state.json']) }}"

  - id: analyze_and_notify
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.ingest_and_transform.outputFiles['asoiaf_books.parquet'] != null }}"
    then:
      - id: log_metrics
        type: io.kestra.plugin.core.log.Log
        message: "An API of Ice and Fire Literary Catalog sync succeeded. Metrics: {{ read(outputs.ingest_and_transform.outputFiles['metrics.json']) }}"
