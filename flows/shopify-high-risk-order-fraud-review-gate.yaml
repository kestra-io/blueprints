id: shopify-high-risk-order-fraud-review-gate
namespace: company.ecommerce

inputs:
  - id: shopify_shop_name
    type: STRING
    displayName: Shopify Shop Name
    defaults: "my-ecommerce-store"
    description: Shopify store domain slug (e.g. 'my-ecommerce-store' for my-ecommerce-store.myshopify.com).

  - id: api_version
    type: STRING
    displayName: Shopify Admin API Version
    defaults: "2024-07"
    description: Supported Shopify GraphQL Admin API version string (e.g. '2024-07' or '2024-10').

  - id: max_allowed_high_risk_orders
    type: INT
    displayName: Maximum Allowed High-Risk Orders
    defaults: 0
    description: Tolerance threshold for high-risk unfulfilled orders before triggering an alert. Defaults to 0 to catch every fraudulent attempt.

  - id: fail_on_detected_fraud
    type: BOOL
    displayName: Fail on Detected Fraud
    defaults: true
    description: Whether to fail execution when high-risk orders are detected to block downstream 3PL warehouse fulfillment pipelines.

triggers:
  - id: recurring_fraud_sweep
    type: io.kestra.plugin.core.trigger.Schedule
    description: Frequent 15-minute fraud inspection sweep to intercept high-risk orders before fulfillment. Shipped disabled by default.
    cron: "*/15 * * * *"
    disabled: true
    inputs:
      shopify_shop_name: "my-ecommerce-store"
      max_allowed_high_risk_orders: 0

tasks:
  - id: fetch_high_risk_orders
    type: io.kestra.plugin.graphql.Request
    description: Query Shopify Admin GraphQL API for unfulfilled orders evaluated as high fraud risk by Shopify Fraud Analysis.
    uri: "https://{{ inputs.shopify_shop_name }}.myshopify.com/admin/api/{{ inputs.api_version }}/graphql.json"
    headers:
      X-Shopify-Access-Token: "{{ secret('SHOPIFY_ACCESS_TOKEN') }}"
      User-Agent: "Kestra-Shopify-Fraud-Sentinel/1.0"
    failOnGraphQLErrors: false
    allowFailed: true
    query: |
      query HighRiskUnfulfilledOrders {
        orders(first: 25, query: "fulfillment_status:unfulfilled risk_level:high") {
          edges {
            node {
              id
              name
              createdAt
              totalPriceSet {
                shopMoney {
                  amount
                  currencyCode
                }
              }
              customer {
                displayName
                email
              }
              riskLevel
            }
          }
        }
      }

  - id: evaluate_fraud_risk
    type: io.kestra.plugin.core.flow.If
    description: Evaluate whether active unfulfilled high-risk orders exceed the tolerance threshold.
    condition: "{{ outputs.fetch_high_risk_orders.body is defined and outputs.fetch_high_risk_orders.body.orders is defined and ((outputs.fetch_high_risk_orders.body.orders.edges | length) > inputs.max_allowed_high_risk_orders) }}"
    then:
      - id: alert_fraud_incident
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatch urgent Slack notification to Merchant Fraud Operations with order IDs, totals, and customer details.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "🚨 *SHOPIFY FRAUD ALERT: High-Risk Unfulfilled Orders Intercepted* 🚨\n\n*Store:* `{{ inputs.shopify_shop_name }}`\n*Flagged Orders Count:* {{ outputs.fetch_high_risk_orders.body.orders.edges | length }}\n\n*Orders Requiring Review:*\n{{ outputs.fetch_high_risk_orders.body.orders.edges | jq('[.[].node | \"• Order *\" + .name + \"* (\" + .totalPriceSet.shopMoney.amount + \" \" + .totalPriceSet.shopMoney.currencyCode + \") - Customer: \" + (.customer.displayName // \"Guest\") + \" (\" + (.customer.email // \"no email\") + \")\"] | join(\"\\n\")') | first }}\n\n*Execution ID:* {{ execution.id }}\n*Action Required:* Review fraud indicators in Shopify Admin before releasing fulfillment."
          }

      - id: check_fail_policy
        type: io.kestra.plugin.core.flow.If
        description: Halt pipeline when fail_on_detected_fraud is enabled to prevent warehouse fulfillment.
        condition: "{{ inputs.fail_on_detected_fraud }}"
        then:
          - id: halt_fulfillment_gate
            type: io.kestra.plugin.core.execution.Fail
            description: Fail execution to gate downstream automated 3PL shipping integrations.
    else:
      - id: log_orders_clean
        type: io.kestra.plugin.core.log.Log
        description: Log clean status when zero high-risk unfulfilled orders are present.
        message: "HEALTHY: Zero unfulfilled high-risk orders detected on store {{ inputs.shopify_shop_name }}."

  - id: log_audit_summary
    type: io.kestra.plugin.core.log.Log
    description: Record final audit metrics for merchant security compliance.
    message: "Shopify fraud audit completed for {{ inputs.shopify_shop_name }}. Total high-risk orders intercepted: {{ outputs.fetch_high_risk_orders.body is defined and outputs.fetch_high_risk_orders.body.orders is defined ? (outputs.fetch_high_risk_orders.body.orders.edges | length) : 0 }}."

errors:
  - id: alert_on_audit_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alert E-commerce Ops channel if Shopify Admin API request fails or credentials expire.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "⚠️ *Shopify Fraud Sentinel Error*: Execution `{{ execution.id }}` failed to query store `{{ inputs.shopify_shop_name }}`. Verify SHOPIFY_ACCESS_TOKEN validity."
      }

outputs:
  - id: status
    type: STRING
    value: "{{ outputs.fetch_high_risk_orders.body is defined and outputs.fetch_high_risk_orders.body.orders is defined and ((outputs.fetch_high_risk_orders.body.orders.edges | length) > inputs.max_allowed_high_risk_orders) ? 'FRAUD_DETECTED' : 'HEALTHY' }}"
  - id: high_risk_orders_count
    type: INT
    value: "{{ outputs.fetch_high_risk_orders.body is defined and outputs.fetch_high_risk_orders.body.orders is defined ? (outputs.fetch_high_risk_orders.body.orders.edges | length) : 0 }}"

extend:
  title: Shopify unfulfilled high-risk order fraud review gate
  metaTitle: Shopify High-Risk Fraud Order Gate | Kestra
  shortDescription: Audit Shopify unfulfilled orders for high fraud risk via GraphQL Admin API, trigger urgent Slack alerts, and pause automated fulfillment.
  metaDescription: Audit Shopify unfulfilled orders for high fraud risk via GraphQL Admin API, send urgent Slack alerts, and gate fulfillment pipelines to prevent chargebacks.
  description: |
    Protect e-commerce stores against costly chargebacks, shipping fraud, and inventory loss by automatically intercepting high-risk orders before warehouse fulfillment. In high-volume e-commerce stores, automated 3PL warehouse pipelines often fulfill purchases within minutes of placement, leaving merchant fraud teams insufficient time to manually inspect suspicious orders. This sentinel runs on a recurring 15-minute schedule, queries the Shopify Admin GraphQL API for unfulfilled orders flagged with `risk_level:high`, evaluates fraud exposure, posts an immediate Slack alert detailing customer identities and order values, and fails the execution to act as a hard gate preventing automated warehouse release.

    ## How it works
    1. A `Schedule` trigger initiates a fraud inspection sweep every 15 minutes (shipped disabled by default).
    2. Task `fetch_high_risk_orders` uses `io.kestra.plugin.graphql.Request` to query the Shopify Admin GraphQL API endpoint (`https://<shop>.myshopify.com/admin/api/<version>/graphql.json`) authenticating via `X-Shopify-Access-Token`. It requests unfulfilled orders with high fraud risk (`fulfillment_status:unfulfilled risk_level:high`) capturing order IDs, order names, creation timestamps, monetary totals, and customer emails.
    3. Task `evaluate_fraud_risk` (`io.kestra.plugin.core.flow.If`) counts discovered high-risk orders:
       - If any exist: Task `alert_fraud_incident` transmits a high-priority Slack notification itemizing order numbers, totals, and customer contact information. If `inputs.fail_on_detected_fraud` is true, task `halt_fulfillment_gate` (`io.kestra.plugin.core.execution.Fail`) terminates the run with an error, ensuring downstream automated fulfillment flows abort.
       - If none exist: Task `log_orders_clean` records that all unfulfilled orders are clean.
    4. Task `log_audit_summary` records total evaluated high-risk counts.
    5. Top-level `errors` handler catches API authentication errors or network timeouts.

    ## What you get
    - Real-time interception of fraudulent orders before packages leave the warehouse.
    - Automated protection against friendly fraud, stolen credit cards, and chargeback fee spikes.
    - Itemized Slack notifications containing direct order identifiers and customer emails for immediate manual review.
    - Strict fulfillment gating that seamlessly protects automated shipping and ERP integrations.

    ## Who it's for
    - E-commerce Operations and Merchant Fraud teams managing high-volume Shopify stores.
    - Logistics and Warehouse Fulfillment managers integrating automated 3PL fulfillment.
    - FinOps and Risk teams tasked with reducing payment processor chargeback ratios.

    ## Why orchestrate this with Kestra
    Standalone webhooks or manual dashboard checking often fail under high transaction volume or holiday sales spikes. Kestra provides declarative, observable orchestration with native GraphQL request handling, secrets management, dynamic jq payload parsing, and immediate multi-channel alerting. With Kestra, order fraud risk evaluation becomes an automated, version-controlled quality gate embedded directly into your supply chain workflows.

    ## Prerequisites
    - A Shopify store with access to the Shopify Admin API (Custom App or Private App).
    - API scopes including `read_orders` enabled on the access token.

    ### Secrets
    - `SHOPIFY_ACCESS_TOKEN`: Shopify Admin API access token (e.g. `shpat_...`) passed in the `X-Shopify-Access-Token` header.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL used to post fraud incident alerts.

    ## Quick start
    1. Create a Custom App in Shopify Admin under **Settings > Apps and sales channels > Develop apps** with `read_orders` scope.
    2. Store your access token and Slack webhook in Kestra Secrets (`SHOPIFY_ACCESS_TOKEN` and `SLACK_WEBHOOK_URL`).
    3. Configure `shopify_shop_name` with your store domain slug (e.g. `brand-store`).
    4. Trigger a manual execution from the Kestra UI to verify that the query successfully connects to your store.
    5. Enable the `recurring_fraud_sweep` trigger to establish automated 15-minute fraud interception.

    ## How to extend
    - Chain an automated tagging mutation (`orderUpdate`) via GraphQL to apply a `"Needs Fraud Review"` tag directly inside Shopify.
    - Place order fulfillment holds via Shopify's FulfillmentOrders API when high-risk indicators match specific geographic regions.
    - Cross-reference customer email addresses with external fraud scoring APIs (such as Sift or MaxMind) for multi-factor risk assessment.

    ## Links
    - [Shopify GraphQL Admin API: Orders](https://shopify.dev/docs/api/admin-graphql/latest/queries/orders)
    - [Shopify Fraud Analysis Guide](https://help.shopify.com/en/manual/orders/fraud-analysis)
    - [Kestra GraphQL Plugin Documentation](https://kestra.io/plugins/plugin-graphql)
    - [Kestra Slack Notification Plugin](https://kestra.io/plugins/plugin-slack)
  tags:
    - Business
    - Infrastructure
  subTags:
    - Incident Response
    - Monitoring & Alerting
  ee: false
  demo: false
