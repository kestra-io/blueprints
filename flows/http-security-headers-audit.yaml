id: http-security-headers-audit
namespace: company.team
description: |
  Probe endpoints for missing security headers (HSTS, CSP, X-Frame-Options,
  X-Content-Type-Options, Referrer-Policy) and alert Slack on gaps.

triggers:
  - id: weekly_header_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: Weekly sweep catches header regressions shipped during the week.
    cron: "0 5 * * 2"
    disabled: true

inputs:
  - id: urls
    type: STRING
    defaults: "https://example.com,https://api.example.com"
    description: Comma-separated URLs to probe.

tasks:
  - id: probe_headers
    type: io.kestra.plugin.scripts.shell.Commands
    description: curl -sI each URL, check the required headers, and emit per-URL missing lists via the stdout outputs protocol. Network failure reports all-missing so a broken probe cannot read as a pass.
    containerImage: alpine:3.20
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    commands:
      - |
        apk add --no-cache curl python3 >/dev/null 2>&1
        cat > audit.py <<'PYEOF'
        import os, json, subprocess
        required = ["strict-transport-security", "content-security-policy", "x-frame-options", "x-content-type-options", "referrer-policy"]
        rows = []
        bad = 0
        for url in [u.strip() for u in os.environ.get("URLS", "").split(",") if u.strip()]:
            try:
                out = subprocess.run(["curl", "-sI", "--max-time", "20", url], capture_output=True, text=True, timeout=30).stdout.lower()
                missing = [h for h in required if h not in out]
            except Exception:
                missing = required[:]
            if missing:
                bad += 1
            rows.append({"url": url, "missing": missing})
        print(f"probed {len(rows)} url(s), {bad} with gaps")
        print("::" + json.dumps({"outputs": {"probed": len(rows), "with_gaps": bad, "details": json.dumps(rows)}}) + "::")
        PYEOF
        python3 audit.py
    env:
      URLS: "{{ inputs.urls }}"

  - id: gaps_found
    type: io.kestra.plugin.core.flow.If
    description: Any missing header means an alert; otherwise log the clean pass.
    condition: "{{ outputs.probe_headers.vars.with_gaps > 0 }}"
    then:
      - id: alert_gaps
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Say which URLs lack which headers so the fix is obvious.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": ":shield: Header audit: {{ outputs.probe_headers.vars.with_gaps }} of {{ outputs.probe_headers.vars.probed }} URL(s) miss security headers. {{ outputs.probe_headers.vars.details }}"
          }
    else:
      - id: log_clean
        type: io.kestra.plugin.core.log.Log
        description: Record the pass for the trend.
        message: "All probed URLs send the full security header set."

errors:
  - id: alert_probe_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alert when the probe itself fails - no result must ever look like "all headers present".
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "Header audit FAILED in flow {{ flow.id }} (execution {{ execution.id }}). Check the task logs."
      }

outputs:
  - id: header_gaps
    type: JSON
    description: 'Per-URL missing headers, e.g. [{"url": "https://example.com", "missing": ["content-security-policy"]}]'
    value: "{{ outputs.probe_headers.vars.details }}"

extend:
  title: Audit HTTP Security Headers Across URLs
  shortDescription: Probe URLs for HSTS, CSP, X-Frame-Options and friends, alert Slack on gaps.
  metaTitle: HTTP Security Headers Audit
  metaDescription: Regularly check your endpoints for missing security headers and alert Slack.
  description: |
    Security headers are silent infrastructure - they either help or they are absent, and nobody notices. This blueprint probes each URL weekly, reports exactly which headers are missing per URL, and alerts Slack. Enable the schedule after a first manual run.

    ## How it works

    1. `probe_headers` (`io.kestra.plugin.scripts.shell.Commands` on Alpine) curls each URL, lowercases the response headers, and diffs against the required set via the `::{"outputs": ...}::` protocol.
    2. `gaps_found` (`io.kestra.plugin.core.flow.If`) branches to `alert_gaps` or `log_clean`.
    3. The `errors` block alerts on probe failure.
    4. Trigger: a disabled weekly `Schedule`.

    ## What you get

    - Per-URL header gap list in every alert.
    - Execution-history audit trail of the probe.
    - A failure alert so a dead check is visible.

    ## Who it's for

    - Platform teams who ship headers via CDN/infra and want proof.
    - Security champions chasing silent regressions.

    ## Why orchestrate this with Kestra

    curl prints headers; the flow turns them into a decision on a schedule, with history and alerts. The next step (ticket, PR to the CDN config, header scorecard) is one task away.

    ## Prerequisites

    - Docker available on the Kestra Worker.
    - A Slack webhook.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: webhook for gap and failure alerts.

    ## Quick start

    1. Add the Slack webhook secret.
    2. Set `urls`.
    3. Run once and read `header_gaps`.
    4. Enable the weekly schedule.

    ## How to extend

    - Fail the execution when gaps exist for pipeline gating.
    - Add headers like `permissions-policy` or a strict CSP.
    - Store results in KV and trend over time.

    ## Links

    - [OWASP Secure Headers](https://owasp.org/www-project-secure-headers/)
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Security
    - Web
  ee: false
  demo: false
