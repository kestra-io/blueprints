id: http-security-headers-audit
namespace: company.team
description: |
  Probe endpoints for missing security headers (HSTS, CSP, X-Frame-Options,
  X-Content-Type-Options, Referrer-Policy) and alert Slack on gaps.

triggers:
  - id: weekly_header_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: Weekly sweep catches header regressions shipped during the week.
    cron: "0 5 * * 2"
    disabled: true

inputs:
  - id: urls
    type: STRING
    defaults: "https://example.com,https://api.example.com"
    description: Comma-separated URLs to probe.

tasks:
  - id: probe_headers
    type: io.kestra.plugin.scripts.python.Script
    description: Probe each URL, check required security headers, and emit missing lists.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests
    env:
      URLS: "{{ inputs.urls }}"
    outputFiles:
      - security_headers_audit.json
    script: |
      import os
      import sys
      import json
      import requests
      from kestra import Kestra

      required_headers = [
          "strict-transport-security",
          "content-security-policy",
          "x-frame-options",
          "x-content-type-options",
          "referrer-policy"
      ]

      urls = [u.strip() for u in os.environ.get("URLS", "").split(",") if u.strip()]
      if not urls:
          print("ERROR: No URLs specified to probe", file=sys.stderr)
          sys.exit(1)

      rows = []
      bad = 0

      for url in urls:
          try:
              resp = requests.head(url, timeout=20, allow_redirects=True, headers={"User-Agent": "Kestra-Security-Headers-Guard"})
              headers_lower = {k.lower(): v for k, v in resp.headers.items()}
              missing = [h for h in required_headers if h not in headers_lower]
              status_code = resp.status_code
          except Exception as exc:
              missing = required_headers[:]
              status_code = None

          if missing:
              bad += 1
          rows.append({
              "url": url,
              "status_code": status_code,
              "missing": missing,
              "compliant": len(missing) == 0
          })

      summary = {
          "probed": len(rows),
          "with_gaps": bad,
          "details": rows
      }

      with open("security_headers_audit.json", "w", encoding="utf-8") as f:
          json.dump(summary, f, indent=2)

      print(f"Probed {len(rows)} url(s), {bad} with gaps.")

      Kestra.outputs({
          "probed": len(rows),
          "with_gaps": bad,
          "details": rows
      })

  - id: gaps_found
    type: io.kestra.plugin.core.flow.If
    description: Any missing header means an alert; otherwise log the clean pass.
    condition: "{{ outputs.probe_headers.vars.with_gaps > 0 }}"
    then:
      - id: alert_gaps
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Say which URLs lack which headers so the fix is obvious.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "🛡️ *Security Header Audit Alert*: {{ outputs.probe_headers.vars.with_gaps }} of {{ outputs.probe_headers.vars.probed }} URL(s) miss security headers.\nDetails: {{ outputs.probe_headers.vars.details | toJson }}"
          }
    else:
      - id: log_clean
        type: io.kestra.plugin.core.log.Log
        description: Record the pass for the trend.
        message: "All probed URLs send the full security header set."

errors:
  - id: alert_probe_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alert when the probe itself fails.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "⚠️ *Header Audit FAILED* in flow {{ flow.id }} (execution {{ execution.id }}). Check the task logs."
      }

outputs:
  - id: probed
    type: INT
    value: "{{ outputs.probe_headers.vars.probed }}"
  - id: with_gaps
    type: INT
    value: "{{ outputs.probe_headers.vars.with_gaps }}"
  - id: header_gaps
    type: JSON
    description: 'Per-URL missing headers, e.g. [{"url": "https://example.com", "missing": ["content-security-policy"]}]'
    value: "{{ outputs.probe_headers.vars.details }}"

extend:
  title: Audit HTTP Security Headers Across URLs
  shortDescription: Probe URLs for HSTS, CSP, X-Frame-Options and friends, alert Slack on gaps.
  metaTitle: HTTP Security Headers Audit
  metaDescription: Regularly check your endpoints for missing security headers and alert Slack.
  description: |
    Security headers are silent infrastructure - they either help or they are absent, and nobody notices. This blueprint probes each URL weekly, reports exactly which headers are missing per URL, and alerts Slack. Enable the schedule after a first manual run.

    ## How it works

    1. `probe_headers` (`io.kestra.plugin.scripts.python.Script` on Python 3.11 with Docker runner) probes each URL, inspects response headers, and diffs against the required set.
    2. `gaps_found` (`io.kestra.plugin.core.flow.If`) branches to `alert_gaps` or `log_clean`.
    3. The `errors` block alerts on probe failure.
    4. Trigger: a disabled weekly `Schedule`.

    ## What you get

    - Per-URL header gap list in every alert.
    - Execution-history audit trail of the probe.
    - A failure alert so a dead check is visible.

    ## Prerequisites

    - Docker available on the Kestra Worker.
    - A Slack webhook.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: webhook for gap and failure alerts.

    ## Links

    - [OWASP Secure Headers](https://owasp.org/www-project-secure-headers/)
    - This blueprint has been created by [yashspidey](https://github.com/yashspidey)
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Security
    - Monitoring & Alerting
  ee: false
  demo: false
