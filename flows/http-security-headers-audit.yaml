id: http-security-headers-audit
namespace: company.team

description: >
  Fetch each site you list over the real network, check the response security headers (HSTS,
  CSP, clickjacking, MIME sniffing, referrer policy, cookie flags) and whether plain HTTP
  redirects to HTTPS, grade each site and alert Slack when a site falls below your minimum grade.

inputs:
  - id: sites
    type: ARRAY
    itemType: STRING
    displayName: Sites to audit
    description: Hostnames or URLs to check. A bare hostname is checked as https://hostname/.
    defaults:
      - github.com
      - example.com
      - kestra.io

  - id: min_grade
    type: SELECT
    displayName: Minimum acceptable grade
    description: Alert when a site scores below this grade.
    values: [A, B, C, D]
    defaults: B

tasks:
  - id: check_headers
    type: io.kestra.plugin.scripts.python.Script
    description: >
      Request each site over HTTPS and over HTTP, read the response headers and score them. A site
      that cannot be reached is graded UNREACHABLE, never as passing. Python standard library only.
    containerImage: python:3.12-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    outputFiles:
      - headers-report.md
      - headers-report.json
    script: |
      import http.client
      import json
      import ssl
      import urllib.parse

      sites = json.loads(r'''{{ inputs.sites | toJson }}''')
      min_grade = "{{ inputs.min_grade }}"
      ORDER = {"A": 4, "B": 3, "C": 2, "D": 1, "F": 0}

      def fetch(scheme, host, path="/", timeout=15):
          cls = http.client.HTTPSConnection if scheme == "https" else http.client.HTTPConnection
          kwargs = {"context": ssl.create_default_context()} if scheme == "https" else {}
          conn = cls(host, timeout=timeout, **kwargs)
          try:
              conn.request("GET", path, headers={"User-Agent": "kestra-security-headers-audit", "Accept": "*/*"})
              resp = conn.getresponse()
              resp.read(1)
              headers = {k.lower(): v for k, v in resp.getheaders()}
              cookies = [v for k, v in resp.getheaders() if k.lower() == "set-cookie"]
              return resp.status, headers, cookies
          finally:
              conn.close()

      def follow(host):
          """Follow same-site redirects over HTTPS (max 5) and return the final response."""
          scheme, path, current = "https", "/", host
          for _ in range(5):
              status, headers, cookies = fetch(scheme, current, path)
              loc = headers.get("location")
              if status in (301, 302, 303, 307, 308) and loc:
                  target = urllib.parse.urlparse(urllib.parse.urljoin(f"{scheme}://{current}{path}", loc))
                  if target.scheme != "https" or not target.hostname:
                      break
                  scheme, current, path = target.scheme, target.netloc, (target.path or "/") + (f"?{target.query}" if target.query else "")
                  continue
              return status, headers, cookies, current
          return status, headers, cookies, current

      def grade(points, total):
          pct = points / total
          return "A" if pct >= 0.9 else "B" if pct >= 0.75 else "C" if pct >= 0.55 else "D" if pct >= 0.35 else "F"

      results = []
      for raw in sites:
          host = urllib.parse.urlparse(raw if "://" in raw else f"https://{raw}").netloc
          row = {"site": host, "grade": "UNREACHABLE", "missing": [], "notes": []}
          try:
              status, h, cookies, final_host = follow(host)
          except Exception as exc:
              row["notes"].append(f"HTTPS request failed: {type(exc).__name__}: {exc}")
              results.append(row)
              continue
          checks = []  # (description, passed, weight)

          hsts = h.get("strict-transport-security", "")
          max_age = 0
          for part in hsts.split(";"):
              part = part.strip().lower()
              if part.startswith("max-age="):
                  try:
                      max_age = int(part.split("=", 1)[1])
                  except ValueError:
                      pass
          checks.append(("Strict-Transport-Security (max-age of at least 6 months)", max_age >= 15552000, 2))
          csp = h.get("content-security-policy", "")
          checks.append(("Content-Security-Policy", bool(csp), 2))
          checks.append(("Clickjacking protection (X-Frame-Options or CSP frame-ancestors)",
                         bool(h.get("x-frame-options")) or "frame-ancestors" in csp.lower(), 1))
          checks.append(("X-Content-Type-Options: nosniff", h.get("x-content-type-options", "").lower() == "nosniff", 1))
          checks.append(("Referrer-Policy", bool(h.get("referrer-policy")), 1))
          checks.append(("Permissions-Policy", bool(h.get("permissions-policy")), 1))
          bad_cookies = []
          for c in cookies:
              low = c.lower()
              if "secure" not in low or "httponly" not in low or "samesite" not in low:
                  bad_cookies.append(c.split("=", 1)[0])
          if cookies:
              checks.append(("Cookie flags (Secure, HttpOnly, SameSite) on: " + ", ".join(bad_cookies), not bad_cookies, 1))
          try:
              hs, hh, _ = fetch("http", host)
              loc = hh.get("location", "")
              checks.append(("Plain HTTP redirects to HTTPS", hs in (301, 302, 307, 308) and loc.lower().startswith("https://"), 1))
          except Exception as exc:
              row["notes"].append(f"HTTP request failed ({type(exc).__name__}); redirect not checked")
          missing = [name for name, ok, _ in checks if not ok]
          points = sum(w for _, ok, w in checks if ok)
          row.update(grade=grade(points, sum(w for _, _, w in checks)), missing=missing, status=status)
          results.append(row)

      failing = [r for r in results if r["grade"] == "UNREACHABLE" or ORDER.get(r["grade"], 0) < ORDER[min_grade]]
      lines = ["| Site | Grade | Missing or weak |", "|---|---|---|"]
      for r in results:
          detail = "; ".join(r["missing"] + r["notes"]) or "none"
          lines.append(f"| {r['site']} | {r['grade']} | {detail} |")
      with open("headers-report.md", "w") as fh:
          fh.write("\n".join(lines) + "\n")
      with open("headers-report.json", "w") as fh:
          json.dump(results, fh, indent=2)

      summary = "; ".join(f"{r['site']}: {r['grade']}" + (f" (missing: {', '.join(r['missing'])})" if r["missing"] else "") for r in failing)
      print("::" + json.dumps({"outputs": {
          "failing": len(failing),
          "attention": bool(failing),
          "summary": f"Below grade {min_grade}: " + summary if failing else f"Every site is at grade {min_grade} or better.",
      }}) + "::")

  - id: needs_attention
    type: io.kestra.plugin.core.flow.If
    description: Alert only when a site is below the minimum grade or could not be reached.
    condition: "{{ outputs.check_headers.vars.attention }}"
    then:
      - id: alert_slack
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": ":warning: Security headers audit - {{ outputs.check_headers.vars.summary }} (execution {{ execution.id }})"
          }
    else:
      - id: log_all_pass
        type: io.kestra.plugin.core.log.Log
        message: "{{ outputs.check_headers.vars.summary }}"

errors:
  - id: alert_audit_failed
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "Security headers audit FAILED in flow {{ flow.id }} (execution {{ execution.id }}). Check the task logs."
      }

outputs:
  - id: report
    type: FILE
    value: "{{ outputs.check_headers.outputFiles['headers-report.md'] }}"

triggers:
  - id: weekly_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 8 * * 1"
    disabled: true

extend:
  title: Audit HTTP Security Headers and HTTPS Redirects Across Your Sites
  shortDescription: Requests each site over HTTPS and HTTP, grades its security headers and cookie flags, and alerts Slack when a site falls below your minimum grade.
  metaTitle: HTTP Security Headers Audit with Kestra
  metaDescription: Fetch your sites, check HSTS, CSP, clickjacking, MIME sniffing, referrer policy, cookie flags and the HTTP to HTTPS redirect, then alert Slack on weak grades.
  description: |
    Security headers are the cheapest hardening a web site can have, and they quietly disappear when a proxy, CDN rule or framework upgrade changes. This blueprint requests each site you list over the real network, reads the response headers, grades them from A to F and tells Slack when a site drops below the grade you set.

    It checks live responses, not configuration files, so it catches headers that a CDN or load balancer strips after your application sets them.

    ## How it works

    1. `check_headers` (`io.kestra.plugin.scripts.python.Script`) runs in a Python container. For every site it requests the page over HTTPS, following same-site redirects, and then requests plain HTTP to see whether it redirects to HTTPS.
    2. It scores Strict-Transport-Security (at least six months), Content-Security-Policy, clickjacking protection (X-Frame-Options or CSP frame-ancestors), X-Content-Type-Options, Referrer-Policy, Permissions-Policy, the Secure, HttpOnly and SameSite flags on cookies, and the HTTP to HTTPS redirect.
    3. A site that cannot be reached, or whose certificate fails verification, is graded UNREACHABLE and treated as failing, never as passing.
    4. `needs_attention` (`io.kestra.plugin.core.flow.If`) sends a Slack message only when a site is below the minimum grade. Otherwise it logs a one-line summary.
    5. The Markdown report is returned as the flow output, and a disabled weekly schedule is included.

    ## What you get

    - A graded table per site listing exactly which headers are missing or weak.
    - A Slack alert only when something is below your bar, with the missing headers named.
    - A failure alert if the audit itself breaks.

    ## Who it's for

    Platform and security teams that own several public sites and want an early warning when a header regression ships.

    ## Why orchestrate this with Kestra

    A cron job with curl gives you no history, no retries and no alert routing. Kestra gives you a schedule, a per-run report file, a clear failure path and the same flow for staging and production through inputs.

    ## Prerequisites

    - A worker that can run Docker task runners and reach the sites you list.
    - Outbound HTTPS and HTTP access from the container.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack incoming webhook that receives the alerts.

    ## Quick start

    1. Add the `SLACK_WEBHOOK_URL` secret.
    2. Replace the `sites` input with your own hostnames and pick a minimum grade.
    3. Run the flow once and read the `report` output.
    4. Remove `disabled: true` from the `weekly_audit` trigger to run it every Monday.

    ## How to extend

    - Read the site list from a KV store or your service catalog.
    - Open a Jira or GitHub issue per failing site instead of a Slack message.
    - Add a `Fail` task on UNREACHABLE to turn this into a release gate after a deploy.

    ## Links

    - [Kestra Python script plugin](https://kestra.io/plugins/plugin-script-python)
    - [Kestra Slack plugin](https://kestra.io/plugins/plugin-notifications)
    - [OWASP HTTP Security Response Headers Cheat Sheet](https://cheatsheetseries.owasp.org/cheatsheets/HTTP_Headers_Cheat_Sheet.html)
    - [MDN Strict-Transport-Security](https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Headers/Strict-Transport-Security)
  tags:
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - Day 2 Operations
  ee: false
  demo: false
