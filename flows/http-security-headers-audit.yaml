id: http-security-headers-audit
namespace: company.team
description: |
  Inspect a website's HTTP response headers, verify a configurable security
  policy, persist the evidence, and alert Slack when required headers are absent.
triggers:
  - id: weekly
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 9 * * 1"
    disabled: true
inputs:
  - id: url
    type: STRING
    description: HTTPS URL to audit.
    defaults: https://example.com
    required: true
  - id: required_headers
    type: JSON
    description: Lowercase header names that must be present.
    defaults: '["strict-transport-security", "content-security-policy", "x-content-type-options", "referrer-policy"]'
    required: true
  - id: notify_slack
    type: BOOL
    description: Alert Slack when the policy fails.
    defaults: true
tasks:
  - id: audit_headers
    type: io.kestra.plugin.scripts.python.Script
    description: Fetch response headers and compare them with the required policy.
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    env:
      URL: "{{ inputs.url }}"
      REQUIRED: "{{ inputs.required_headers | toJson }}"
    script: |
      import json, os, time, urllib.request
      url = os.environ["URL"]
      required = [str(value).lower() for value in json.loads(os.environ["REQUIRED"])]
      request = urllib.request.Request(url, headers={"User-Agent": "kestra-security-header-audit"})
      started = time.perf_counter()
      with urllib.request.urlopen(request, timeout=20) as response:
          headers = {key.lower(): value for key, value in response.headers.items()}
          status = response.status
      missing = [name for name in required if name not in headers]
      report = {"url": url, "status": status, "latency_ms": round((time.perf_counter() - started) * 1000, 1), "missing": missing, "headers": headers, "passed": not missing}
      print("::" + json.dumps({"outputs": {"report": report, "failed_count": len(missing)}}) + "::")
  - id: write_report
    type: io.kestra.plugin.core.storage.Write
    description: Store the header evidence for audit history.
    content: "{{ outputs.audit_headers.vars.report | toJson }}"
    extension: ".json"
  - id: alert_if_failed
    type: io.kestra.plugin.core.flow.If
    description: Alert only when required security headers are missing.
    condition: "{{ outputs.audit_headers.vars.failed_count > 0 and inputs.notify_slack }}"
    then:
      - id: alert_slack
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: '{"text":"Security header audit failed for {{ inputs.url }}. Missing: {{ outputs.audit_headers.vars.report.missing | join(\", \") }}. Evidence: {{ outputs.write_report.uri }}"}'
outputs:
  - id: report
    type: URI
    value: "{{ outputs.write_report.uri }}"
  - id: missing_count
    type: INT
    value: "{{ outputs.audit_headers.vars.failed_count }}"
extend:
  title: HTTP Security Headers Audit
  shortDescription: Verify security response headers, save evidence, and alert on policy drift.
  metaTitle: Scheduled HTTP Security Headers Audit
  metaDescription: Audit HTTP security headers against a policy, save JSON evidence, and alert Slack when headers are missing.
  description: |
    Check a public HTTPS endpoint for required security headers such as HSTS,
    CSP, Referrer-Policy, and X-Content-Type-Options. The schedule is disabled
    by default so you can run it manually first.

    Prerequisites: a Kestra worker with outbound HTTPS access and the
    `SLACK_WEBHOOK_URL` secret when notifications are enabled.

    Set `url`, customize the `required_headers` JSON array, run once, and then
    enable `weekly`. The `report` output is a JSON URI containing all observed
    headers, status, latency, and missing policy entries.

    Links: [Python Script](https://kestra.io/plugins/plugin-script-python),
    [Slack](https://kestra.io/plugins/plugin-notifications-slack).
  tags: [Infrastructure, Core]
  ee: false
  demo: true
