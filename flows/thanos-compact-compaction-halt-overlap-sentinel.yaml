id: thanos-compact-compaction-halt-overlap-sentinel
namespace: company.observability

inputs:
  - id: thanos_compact_metrics_url
    type: STRING
    defaults: "http://thanos-compact.observability:10902/metrics"
    description: Prometheus scrape endpoint for Thanos Compact component.

tasks:
  - id: query_thanos_halt_status
    type: io.kestra.plugin.scripts.shell.Commands
    commands:
      - |
        curl -s -f "{{ inputs.thanos_compact_metrics_url }}" > /tmp/thanos_metrics.txt
        
        # Scrape thanos_compact_halted metric (1 = halted, 0 = operational)
        HALTED=$(grep -E "^thanos_compact_halted" /tmp/thanos_metrics.txt | awk '{print $2+0}' | head -n 1)
        echo "::set-output name=is_halted::${HALTED:-0}::"

  - id: evaluate_thanos_halt
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.query_thanos_halt_status.vars.is_halted | int == 1 }}"
    then:
      - id: notify_storage_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#observability-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 Thanos Compact Compaction HALTED Alert",
                "text": "Thanos Compact at `{{ inputs.thanos_compact_metrics_url }}` is *HALTED (`thanos_compact_halted == 1`)*! Overlapping TSDB blocks or corrupted object storage chunks have frozen long-term compaction and downsampling.",
                "footer": "Kestra Observability Sentinel • Thanos"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#observability-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ Thanos Compact Sentinel Failure",
            "text": "Failed to scrape Thanos Compact metrics endpoint. Verify pod health and network access.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/30 * * * *"
    disabled: true

extend:
  metaDescription: "Monitors Thanos Compact for halted compaction cycles and overlapping TSDB block errors to prevent query inconsistencies."
  metaTitle: Thanos Compact Compaction Halt and Overlapping Block Sentinel with Kestra
  title: Thanos Compact Compaction Halt and Overlapping Block Sentinel
  shortDescription: Monitors Thanos Compact for halted compaction cycles and overlapping TSDB block errors to prevent query inconsistencies.
  description: |
    ## How it works
    This workflow monitors the Prometheus `/metrics` endpoint of the Thanos Compact component to audit the critical `thanos_compact_halted` metric. Thanos Compact is responsible for downsampling (5m and 1h resolutions) and merging 2-hour Prometheus TSDB blocks stored in cloud object storage (S3, GCS, Azure Blob). When it discovers overlapping blocks or corrupt meta files, it immediately halts processing to avoid corrupting global time-series data. This workflow detects halted states and raises critical alerts before historical queries fail.

    ## What you get
    - Real-time detection of halted compaction cycles in Thanos storage.
    - Prevents historical time-series query slowdowns and failed downsampling.
    - Immediate awareness of corrupted or overlapping blocks in object storage.

    ## Who it's for
    - SREs and Infrastructure Engineers maintaining multi-cluster Thanos architectures.
    - Cloud Storage Administrators overseeing long-term Prometheus metrics retention.

    ## Why orchestrate this with Kestra
    - **Automated Health Verification**: Polls component health continuously without manual intervention.
    - **Critical Incident Escalation**: Immediately alerts the storage operations channel when compaction freezes.
    - **Resilient Execution**: Top-level error blocks guarantee notification delivery even if scraping encounters network timeouts.

    ## Prerequisites
    - Thanos Compact running with `/metrics` port exposed.
    - Secret `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import the blueprint.
    2. Provide your Thanos Compact metrics endpoint.
    3. Run the workflow to inspect compaction state.

    ## How to extend
    - Add an automated diagnostic step to run `thanos tools bucket inspect` to identify specific overlapping block ULIDs.
    - Notify PagerDuty for critical long-term storage halts.

    ## Links
    - [Thanos Compact Documentation](https://thanos.io/tip/components/compact.md/)
    - [Kestra Documentation](https://kestra.io/docs)
  tags:
    - Infrastructure
    - Data
  subTags:
    - Day 2 Operations
    - ELT & Data Landing
  ee: false
  verified: false
  demo: false
