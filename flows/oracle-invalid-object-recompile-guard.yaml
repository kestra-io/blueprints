id: oracle-invalid-object-recompile-guard
namespace: company.team

description: |
  Find Oracle schema objects left INVALID after a dependency DDL change (views,
  procedures, functions, packages, package bodies, triggers, types), recompile them
  with ALTER ... COMPILE, then read dba_objects again and fail if any are still INVALID.

inputs:
  - id: jdbc_url
    type: STRING
    displayName: Oracle JDBC URL
    defaults: "jdbc:oracle:thin:@//localhost:1521/FREEPDB1"

  - id: username
    type: STRING
    displayName: Database user
    description: A user that can read dba_objects (SELECT_CATALOG_ROLE or SELECT ANY DICTIONARY) and compile the objects it finds. A DBA role covers both. A user recompiling only its own schema needs no extra privilege.
    defaults: SYSTEM

  - id: password
    type: STRING
    displayName: Database password
    defaults: "{{ secret('ORACLE_PASSWORD') }}"

  - id: object_owners
    type: ARRAY
    itemType: STRING
    displayName: Schema owners to check
    description: Application schema owners whose objects are checked. System schemas are left out so a stray SYS or ORDS invalid object is never touched.
    defaults:
      - APP

  - id: auto_remediate
    type: BOOL
    displayName: Auto remediate
    description: Allow ALTER ... COMPILE to run. Off by default.
    defaults: false

  - id: dry_run
    type: BOOL
    displayName: Dry run
    description: Must be false, together with auto_remediate, for any recompile to run.
    defaults: true

variables:
  audit_sql: |
    SELECT owner, object_name, object_type, status,
           CASE
             WHEN object_type = 'PACKAGE BODY' THEN 'ALTER PACKAGE "' || owner || '"."' || object_name || '" COMPILE BODY'
             WHEN object_type = 'TYPE BODY'    THEN 'ALTER TYPE "'    || owner || '"."' || object_name || '" COMPILE BODY'
             ELSE 'ALTER ' || object_type || ' "' || owner || '"."' || object_name || '" COMPILE'
           END AS fix_sql
      FROM dba_objects
     WHERE status = 'INVALID'
       AND owner IN ('{{ inputs.object_owners | join("','") | upper }}')
       AND object_type IN ('VIEW','PROCEDURE','FUNCTION','PACKAGE','PACKAGE BODY','TRIGGER','TYPE','TYPE BODY','MATERIALIZED VIEW')
     ORDER BY owner, object_type, object_name

tasks:
  - id: audit
    type: io.kestra.plugin.jdbc.oracle.Query
    description: Read-only. Lists recompilable objects in the checked schemas whose dba_objects status is INVALID, with the exact ALTER ... COMPILE for each.
    url: "{{ inputs.jdbc_url }}"
    username: "{{ inputs.username }}"
    password: "{{ inputs.password }}"
    fetchType: FETCH
    sql: "{{ render(vars.audit_sql) }}"

  - id: fixes
    type: io.kestra.plugin.core.output.OutputValues
    description: The deduplicated ALTER ... COMPILE statements for the invalid objects.
    values:
      sql: "{{ outputs.audit.rows | jq('map(.FIX_SQL) | unique') | first | toJson }}"

  - id: summary
    type: io.kestra.plugin.core.log.Log
    message: >-
      Invalid object audit on {{ inputs.jdbc_url }}: {{ outputs.audit.size }} invalid object(s) in schemas {{ inputs.object_owners | jq('map(ascii_upcase) | join(", ")') | first }}.
      {{ outputs.audit.rows | jq('map(.OWNER + "." + .OBJECT_NAME + " [" + .OBJECT_TYPE + "]") | join(", ")') | first }}

  - id: route
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.audit.size > 0 }}"
    then:
      - id: alert
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {{ {'text': 'Oracle ' ~ inputs.jdbc_url ~ ': ' ~ outputs.audit.size ~ ' invalid schema object(s) found: ' ~ (outputs.audit.rows | jq('map(.OWNER + "." + .OBJECT_NAME + " (" + .OBJECT_TYPE + ")") | join(", ")') | first) ~ '.' ~ (inputs.auto_remediate and not inputs.dry_run ? ' Recompiling now.' : ' No change applied (auto_remediate=' ~ inputs.auto_remediate ~ ', dry_run=' ~ inputs.dry_run ~ ').')} | toJson }}

      - id: remediate_gate
        type: io.kestra.plugin.core.flow.If
        condition: "{{ inputs.auto_remediate and not inputs.dry_run }}"
        then:
          - id: remediate
            type: io.kestra.plugin.core.flow.Loop
            description: First recompile pass. Sequential on purpose, so interdependent objects do not compile against each other in parallel.
            concurrencyLimit: 1
            values: "{{ outputs.fixes.values.sql }}"
            tasks:
              - id: recompile
                type: io.kestra.plugin.jdbc.oracle.Query
                description: ALTER ... COMPILE for one object. allowFailure, so an object that cannot compile yet does not stop the pass.
                allowFailure: true
                url: "{{ inputs.jdbc_url }}"
                username: "{{ inputs.username }}"
                password: "{{ inputs.password }}"
                fetchType: NONE
                sql: "{{ item.value }}"

          - id: remediate_second
            type: io.kestra.plugin.core.flow.Loop
            description: Second recompile pass over the same set. A dependency compiled in the first pass can validate an object that failed earlier only because its order was wrong.
            concurrencyLimit: 1
            values: "{{ outputs.fixes.values.sql }}"
            tasks:
              - id: recompile_retry
                type: io.kestra.plugin.jdbc.oracle.Query
                description: Re-run of ALTER ... COMPILE. Recompiling an already valid object is a no-op.
                allowFailure: true
                url: "{{ inputs.jdbc_url }}"
                username: "{{ inputs.username }}"
                password: "{{ inputs.password }}"
                fetchType: NONE
                sql: "{{ item.value }}"

          - id: reaudit
            type: io.kestra.plugin.jdbc.oracle.Query
            description: Read dba_objects again after both passes.
            url: "{{ inputs.jdbc_url }}"
            username: "{{ inputs.username }}"
            password: "{{ inputs.password }}"
            fetchType: FETCH
            sql: "{{ render(vars.audit_sql) }}"

          - id: verify_result
            type: io.kestra.plugin.core.flow.If
            condition: "{{ outputs.reaudit.size > 0 }}"
            then:
              - id: remediation_failed
                type: io.kestra.plugin.core.execution.Fail
                errorMessage: >-
                  {{ outputs.reaudit.size }} object(s) still INVALID after two recompile passes: {{ outputs.reaudit.rows | jq('map(.OWNER + "." + .OBJECT_NAME + " (" + .OBJECT_TYPE + ")") | join(", ")') | first }}. A recompile cannot fix an object whose dependency is gone or renamed, so the underlying DDL needs a code change.
            else:
              - id: remediated
                type: io.kestra.plugin.core.log.Log
                message: "Recompiled and verified: {{ fromJson(outputs.fixes.values.sql) | length }} object(s) back to VALID."
    else:
      - id: clean
        type: io.kestra.plugin.core.log.Log
        message: "No INVALID objects in the checked schemas. Nothing to recompile."

errors:
  - id: alert_flow_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {{ {'text': 'Oracle invalid-object recompile guard failed on ' ~ inputs.jdbc_url ~ ' (execution ' ~ execution.id ~ '). Objects may still be INVALID. Check the logs.'} | toJson }}

triggers:
  - id: daily
    type: io.kestra.plugin.core.trigger.Schedule
    description: Shipped disabled and always in safe mode (report only).
    cron: "0 6 * * *"
    disabled: true
    inputs:
      auto_remediate: false
      dry_run: true

extend:
  title: Oracle Invalid Object Recompile Guard
  shortDescription: Find Oracle schema objects left INVALID after a dependency DDL change, recompile them with ALTER COMPILE in a serial loop behind a dry-run gate, then read dba_objects again to confirm they are VALID.
  metaTitle: Oracle Invalid Object Recompile Guard with Kestra
  metaDescription: Find Oracle objects left INVALID after a dependency change, recompile them with ALTER COMPILE behind a dry-run gate, then re-read dba_objects to confirm.
  description: |
    Oracle marks a schema object INVALID when something it depends on changes. Alter a
    table, replace a view, change a type. Every view, package, procedure, function or
    trigger built on top of it is flagged INVALID in dba_objects. Oracle recompiles an
    invalid object on first use, but that first use can be a user request that pays the
    compile cost or hits a genuine break hidden since the DDL ran.

    This blueprint finds those objects before a user does. It reads dba_objects for the
    schemas you name, recompiles each flagged object with ALTER ... COMPILE, then reads
    dba_objects again and fails the run if anything is still INVALID.

    This blueprint was created by [zkasuran](https://github.com/zkasuran).

    ## Findings

    | Object type in dba_objects | Statement used to recompile |
    |---|---|
    | `VIEW`, `PROCEDURE`, `FUNCTION`, `TRIGGER`, `PACKAGE`, `TYPE`, `MATERIALIZED VIEW` | `ALTER <type> "owner"."name" COMPILE` |
    | `PACKAGE BODY` | `ALTER PACKAGE "owner"."name" COMPILE BODY` |
    | `TYPE BODY` | `ALTER TYPE "owner"."name" COMPILE BODY` |

    Recompile runs in two passes. A package body can stay invalid on the first pass only
    because its spec compiled later in the same pass, so a second pass over the same set
    clears anything whose failure was ordering. An object still invalid after both passes
    has a real break, usually a column or dependency that was dropped or renamed. The run
    fails so a human looks at it.
    ## How it works

    1. `audit` (`io.kestra.plugin.jdbc.oracle.Query`, read-only) reads dba_objects for the
       owners in `object_owners` where status is INVALID, limited to recompilable object
       types. It returns the exact ALTER ... COMPILE for each.
    2. `fixes` (`io.kestra.plugin.core.output.OutputValues`) deduplicates those statements.
       `summary` logs the invalid objects.
    3. `route` (`io.kestra.plugin.core.flow.If`):
       - **clean:** nothing INVALID, so it logs and stops.
       - **findings:** `alert` posts the list to Slack.
         - `remediate_gate` runs only when `auto_remediate` is true and `dry_run` is false.
         - `remediate` and `remediate_second` (`io.kestra.plugin.core.flow.Loop`,
           `concurrencyLimit: 1`) run each ALTER ... COMPILE in turn, twice. Serial on
           purpose, so interdependent objects do not compile against each other at once.
         - `reaudit` reads dba_objects again. `verify_result` fails the run through
           `remediation_failed` if any object is still INVALID, otherwise `remediated`
           logs the count returned to VALID.
    4. `errors` posts to Slack if the flow fails for any reason, including an object that
       could not be recompiled.

    ## What you get

    - A scheduled check that catches invalid objects after a release instead of a user hitting one.
    - A recompile that is safe to re-run. Recompiling a valid object is a no-op.
    - A real verification step. The run passes only when dba_objects reports every object VALID.
    - Slack alerts on the findings and on any failure.

    ## Who it's for

    - DBAs who run DDL during a release and want the dependent objects validated before traffic.
    - Platform teams that recompile schemas after a patch or an import.
    - Teams evaluating the Oracle plugin who want an example that reads the data dictionary then changes state behind a gate.
    ## Why orchestrate this with Kestra

    The usual recompile is a one-off script a DBA keeps in a drawer. Kestra runs it on a
    schedule, scopes it to the schemas you own, posts the invalid objects to Slack, applies
    the recompile only behind `auto_remediate` and `dry_run`, one statement at a time, then
    proves the result by reading dba_objects again. Every run keeps its logs, so you can see
    when objects went invalid and what fixed them.

    ## Tested end to end

    On Kestra 2.0.5 OSS against Oracle Database Free 23ai (`gvenzl/oracle-free`, service
    FREEPDB1), with a local HTTP sink standing in for Slack. The test schema `APP` held a
    table `T1` and four objects built on its `name` column: a view `V1`, a procedure `P1`, a
    package body `PKG1` and a trigger `TRG1`.

    | Run | Setup and inputs | Result |
    |---|---|---|
    | 1 | all objects VALID, defaults | 0 invalid, clean branch, SUCCESS |
    | 2 | `ALTER TABLE T1 MODIFY name`, defaults (`dry_run: true`) | 4 invalid detected and posted to Slack, no change, SUCCESS. dba_objects still showed 4 |
    | 3 | same break, `auto_remediate: true`, `dry_run: true` | Same report, Slack said no change applied, dba_objects still 4. The dry_run gate held |
    | 4 | same break, `auto_remediate: true`, `dry_run: false` | Recompiled, reaudit found 0, SUCCESS. dba_objects went from 4 to 0 |
    | 5 | `ALTER TABLE T1 DROP COLUMN name`, `auto_remediate: true`, `dry_run: false` | 4 objects could not compile against the dropped column, reaudit still 4, the run FAILED and the errors block alerted Slack |

    Runs 1 and 2 are the proof the check can fail: the same audit returned 0 against the
    healthy schema and 4 against the broken one. Run 4 is the before and after, 4 down to 0,
    read from dba_objects by sqlplus not only from the Kestra log.
    ## Prerequisites

    - An Oracle Database reachable over the thin JDBC driver (`jdbc:oracle:thin:@//host:1521/service`).
    - A database user that can read `dba_objects` (`SELECT_CATALOG_ROLE` or `SELECT ANY
      DICTIONARY`) and recompile the objects it finds. Recompiling another schema's objects
      needs `ALTER ANY PROCEDURE`, `ALTER ANY TRIGGER` and the matching privileges, which a
      DBA role already carries. A user recompiling only its own objects needs none of those.

    ### Secrets

    - `ORACLE_PASSWORD`: the database password. It is the default for the `password` input.
    - `SLACK_WEBHOOK_URL`: used by `alert` and the `errors` block.
    - In Kestra OSS, provide each one as a base64-encoded environment variable prefixed `SECRET_`.

    ### Inputs

    | Input | Default | Purpose |
    |---|---|---|
    | `jdbc_url` | `jdbc:oracle:thin:@//localhost:1521/FREEPDB1` | The Oracle instance to check |
    | `username` | `SYSTEM` | The database user |
    | `password` | `{{ secret('ORACLE_PASSWORD') }}` | The database password |
    | `object_owners` | `[APP]` | Schema owners whose objects are checked |
    | `auto_remediate` | `false` | Allow ALTER ... COMPILE |
    | `dry_run` | `true` | Must be false for a recompile to run |
    ## Quick start

    1. Add the `ORACLE_PASSWORD` and `SLACK_WEBHOOK_URL` secrets.
    2. Import the flow, set `jdbc_url` and `username`, then list the schemas to check in `object_owners`.
    3. Run it once with the defaults and read the invalid objects per schema.
    4. When you want it to fix them, run with `auto_remediate: true` and `dry_run: false`.
    5. Enable the `daily` trigger, which always runs in safe mode.

    ## How to extend

    - Narrow or widen the object types checked, for example to leave materialized views out.
    - Replace the two fixed passes with `UTL_RECOMP.RECOMP_SERIAL` for large schemas.
    - Fail the run as soon as the first audit finds anything, for a read-only drift check with no recompile.
    - Loop over several instances to check every database from one flow.

    ## Links

    - Oracle plugin: https://kestra.io/plugins/plugin-jdbc-oracle
    - PL/SQL ALTER COMPILE: https://docs.oracle.com/en/database/oracle/oracle-database/23/lnpls/ALTER-PROCEDURE-statement.html
    - Schedule trigger: https://kestra.io/plugins/core/triggers/io.kestra.plugin.core.trigger.schedule
  tags:
    - Infrastructure
    - Data
  subTags:
    - Databases
    - Maintenance & Optimization
    - Day 2 Operations
  ee: false
  demo: false
