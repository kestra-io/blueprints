id: grafana-loki-ingestion-rate-limit-dropped-streams-sentinel
namespace: company.observability

inputs:
  - id: loki_metrics_url
    type: STRING
    defaults: "http://loki.observability:3100/metrics"
    description: Prometheus scrape endpoint for Grafana Loki distributor metrics.
  - id: discard_threshold
    type: INT
    defaults: 0
    description: "Maximum allowable discarded log entries before alerting (default 0)."

tasks:
  - id: query_loki_discarded_samples
    type: io.kestra.plugin.scripts.shell.Commands
    commands:
      - |
        curl -s -f "{{ inputs.loki_metrics_url }}" > /tmp/loki_metrics.txt
        
        # Scrape loki_discarded_samples_total metric
        DISCARDED=$(grep -E "^loki_discarded_samples_total" /tmp/loki_metrics.txt | awk '{sum+=$2} END {print sum+0}')
        echo "::set-output name=discarded_samples::$DISCARDED::"

  - id: evaluate_discarded_samples
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.query_loki_discarded_samples.vars.discarded_samples | int > inputs.discard_threshold }}"
    then:
      - id: notify_platform_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#observability-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 Grafana Loki Log Streams Dropped Alert",
                "text": "Grafana Loki at `{{ inputs.loki_metrics_url }}` discarded *{{ outputs.query_loki_discarded_samples.vars.discarded_samples }} log samples*! Ingestion rate limits (`ingestion_rate_mb`) or max streams per user caps have been breached.",
                "footer": "Kestra Observability Sentinel • Grafana Loki"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#observability-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ Grafana Loki Sentinel Failure",
            "text": "Failed to scrape Grafana Loki metrics endpoint. Verify distributor pod connectivity.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  title: Grafana Loki Ingestion Rate Limit and Discarded Log Streams Sentinel
  shortDescription: Monitors Grafana Loki for discarded log entries and stream limit rejections caused by tenant ingestion throttling.
  description: |
    ## How it works
    This workflow queries the distributor metrics endpoint of Grafana Loki (`/metrics`) to inspect `loki_discarded_samples_total`. In high-throughput distributed microservice clusters, log forwarding agents (Promtail, Fluentbit, Vector) send bursts of logs to Loki. If a tenant exceeds configured limits such as `ingestion_rate_mb`, `ingestion_burst_size_mb`, or `max_streams_per_user`, Loki distributors reject payloads with HTTP 429 and discard logs. This workflow continuously evaluates dropped sample metrics to alert platform engineers before audit and debug log visibility is compromised.

    ## What you get
    - Real-time notification when central logging infrastructure drops log batches.
    - Prevents log loss during critical incident investigations and debug cycles.
    - Actionable capacity alerts identifying when tenant limits need tuning.

    ## Who it's for
    - Platform Engineers and Kubernetes Operators managing Grafana Loki logging clusters.
    - Security and Compliance teams requiring complete, gapless audit log ingestion.

    ## Why orchestrate this with Kestra
    - **Automated Telemetry Polling**: Scrapes Loki distributor metrics on a scheduled cadence.
    - **Decoupled Architecture**: Operates independently of the logging pipeline itself.
    - **Instant Team Escalation**: Sends formatted Slack alerts directly to the logging operations channel.

    ## Prerequisites
    - Grafana Loki cluster with distributor `/metrics` endpoint reachable.
    - Secret `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import the blueprint.
    2. Enter your Loki metrics endpoint.
    3. Run the workflow to inspect log discard counters.

    ## How to extend
    - Parse the `reason` label on `loki_discarded_samples_total` to distinguish rate-limiting from stream limit saturation.
    - Automatically scale Loki distributor replicas via Kubernetes API when ingestion pressure increases.

    ## Links
    - [Grafana Loki Limits and Configuration](https://grafana.com/docs/loki/latest/configure/#limits_config)
    - [Kestra Documentation](https://kestra.io/docs)
  tags:
    - Infrastructure
    - Data
  ee: false
  demo: false
