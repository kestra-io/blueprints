id: grafana-loki-ingestion-rate-limit-dropped-streams-sentinel
namespace: company.team
description: Monitors Grafana Loki for discarded log entries and stream limit rejections caused by tenant ingestion throttling.

inputs:
  - id: loki_metrics_url
    type: STRING
    defaults: "http://loki.observability:3100/metrics"
    description: Prometheus scrape endpoint for Grafana Loki distributor metrics.
  - id: discard_threshold
    type: INT
    defaults: 0
    description: "Maximum allowable discarded log entries before alerting (default 0)."

tasks:
  - id: query_loki_discarded_samples
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    description: Scrape Grafana Loki distributor metrics and parse dropped log counters
    env:
      LOKI_METRICS_URL: "{{ inputs.loki_metrics_url }}"
    script: |
      import os
      import sys
      import re
      import urllib.request
      import urllib.error
      from kestra import Kestra

      metrics_url = os.environ.get("LOKI_METRICS_URL", "http://loki.observability:3100/metrics")

      req = urllib.request.Request(metrics_url, headers={"User-Agent": "Kestra-Loki-Sentinel"})
      try:
          with urllib.request.urlopen(req, timeout=20) as resp:
              raw = resp.read().decode("utf-8")
      except Exception as e:
          print(f"CRITICAL: Failed to scrape Grafana Loki metrics from {metrics_url}: {e}", file=sys.stderr)
          sys.exit(1)

      discarded = 0
      for line in raw.splitlines():
          line = line.strip()
          if line.startswith("#") or not line:
              continue
          if "loki_discarded_samples_total" in line:
              parts = line.split()
              if len(parts) >= 2:
                  try:
                      discarded += int(float(parts[-1]))
                  except ValueError:
                      pass

      Kestra.outputs({
          "discarded_samples": discarded
      })

  - id: evaluate_discarded_samples
    type: io.kestra.plugin.core.flow.If
    description: Send Slack alert if discarded log entries exceed threshold
    condition: "{{ outputs.query_loki_discarded_samples.vars.discarded_samples > inputs.discard_threshold }}"
    then:
      - id: notify_platform_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#observability-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 Grafana Loki Log Streams Dropped Alert",
                "text": "Grafana Loki at `{{ inputs.loki_metrics_url }}` discarded *{{ outputs.query_loki_discarded_samples.vars.discarded_samples }} log samples*! Ingestion rate limits (`ingestion_rate_mb`) or max streams per user caps have been breached.",
                "footer": "Kestra Observability Sentinel • Grafana Loki"
              }
            ]
          }

outputs:
  - id: discarded_samples
    type: INT
    value: "{{ outputs.query_loki_discarded_samples.vars.discarded_samples }}"

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "#observability-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ Grafana Loki Sentinel Failure",
            "text": "Failed to scrape Grafana Loki metrics endpoint on execution `{{ execution.id }}`. Verify distributor pod connectivity.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  metaDescription: Monitors Grafana Loki for discarded log entries and stream limit rejections caused by tenant ingestion throttling.
  metaTitle: Grafana Loki Ingestion Rate Limit and Discarded Log Streams Sentinel with Kestra
  title: Grafana Loki Ingestion Rate Limit and Discarded Log Streams Sentinel
  shortDescription: Monitors Grafana Loki for discarded log entries and stream limit rejections caused by tenant ingestion throttling.
  description: |
    ## How it works
    This workflow queries the distributor metrics endpoint of Grafana Loki (`/metrics`) to inspect `loki_discarded_samples_total`. If a tenant exceeds configured ingestion limits, Loki rejects payloads and discards log streams. This sentinel continuously alerts engineers before critical debug visibility is lost.

    ## What you get
    - Real-time notification when central logging infrastructure drops log batches.
    - Prevents log loss during critical incident investigations.
    - Actionable capacity alerts identifying when tenant limits need tuning.

    ## Who it's for
    - Platform Engineers and Kubernetes Operators managing Grafana Loki logging clusters.
    - Security and Compliance teams requiring complete audit log ingestion.

    ## Prerequisites
    - Grafana Loki cluster with distributor `/metrics` endpoint reachable.
    - Secret `SLACK_WEBHOOK_URL` configured in Kestra.
  tags:
    - Observability
    - Infrastructure
  subTags:
    - Monitoring & Alerting
  ee: false
  demo: false
