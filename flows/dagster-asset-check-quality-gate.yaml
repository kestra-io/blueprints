id: dagster-asset-check-quality-gate
namespace: company.dataengineering

description: >-
  Audit Dagster Asset Check evaluations via GraphQL and enforce data quality gates before
  permitting downstream warehouse transformations, isolating corrupted partitions with safe dry-run controls.

inputs:
  - id: dagster_graphql_url
    type: URI
    displayName: Dagster GraphQL Endpoint
    defaults: "http://dagster-webserver:3000/graphql"
    description: URL of the Dagster GraphQL webserver endpoint.

  - id: target_asset_key
    type: STRING
    displayName: Target Asset Key Path
    defaults: "analytics/fct_daily_orders"
    description: Slash-delimited path of the Dagster asset key whose quality checks are audited.

  - id: block_downstream
    type: SELECT
    displayName: Block Downstream On Error
    defaults: "true"
    values:
      - "true"
      - "false"
    description: If true, halt pipeline execution and prevent downstream tasks when checks have ERROR severity.

  - id: dry_run
    type: SELECT
    displayName: Dry Run
    defaults: "true"
    values:
      - "true"
      - "false"
    description: When true, log quality evaluation results without blocking downstream task execution.

triggers:
  - id: asset_check_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    description: Audits Dagster asset data quality checks every 30 minutes. Shipped disabled by default.
    cron: "*/30 * * * *"
    disabled: true

tasks:
  - id: query_asset_checks
    type: io.kestra.plugin.core.http.Request
    description: Query Dagster GraphQL API for asset check results on the latest asset materialization.
    uri: "{{ inputs.dagster_graphql_url }}"
    method: POST
    contentType: application/json
    headers:
      Content-Type: application/json
      Authorization: "Bearer {{ secret('DAGSTER_TOKEN') }}"
    body: |
      {
        "query": "query AssetChecksQuery($assetKey: AssetKeyInput!) { assetOrError(assetKey: $assetKey) { __typename ... on Asset { assetChecks { name executionForLatestMaterialization { status evaluation { severity description } } } } ... on PythonError { message stack } } }",
        "variables": {
          "assetKey": {
            "path": "{{ inputs.target_asset_key.split('/') }}"
          }
        }
      }

  - id: evaluate_check_severities
    type: io.kestra.plugin.scripts.python.Script
    description: Parse asset check evaluations, separating checks into passed, warnings, and severe errors.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    env:
      RESPONSE_BODY: "{{ outputs.query_asset_checks.body }}"
      ASSET_KEY: "{{ inputs.target_asset_key }}"
    script: |
      import os
      import json
      from kestra import Kestra

      raw = os.environ.get("RESPONSE_BODY", "{}")
      asset_key = os.environ.get("ASSET_KEY", "")
      data = json.loads(raw)

      asset = data.get("data", {}).get("assetOrError", {})
      checks = asset.get("assetChecks", [])

      passed_checks = []
      warn_checks = []
      error_checks = []

      for c in checks:
          name = c.get("name", "unnamed_check")
          exec_data = c.get("executionForLatestMaterialization") or {}
          status = exec_data.get("status")
          eval_data = exec_data.get("evaluation") or {}
          severity = eval_data.get("severity", "ERROR")
          desc = eval_data.get("description", "No description provided")

          entry = {"name": name, "severity": severity, "description": desc, "status": status}
          if status == "SUCCESS" and severity != "ERROR":
              passed_checks.append(entry)
          elif severity == "WARN":
              warn_checks.append(entry)
          else:
              error_checks.append(entry)

      gate_status = "FAILED" if len(error_checks) > 0 else "PASSED"
      summary = f"Dagster asset '{asset_key}' check audit: {len(passed_checks)} passed, {len(warn_checks)} warnings, {len(error_checks)} critical errors."
      error_lines = [f"• Check `{e['name']}` [{e['severity']}]: {e['description']}" for e in error_checks]

      Kestra.outputs({
          "gate_status": gate_status,
          "error_check_count": len(error_checks),
          "warn_check_count": len(warn_checks),
          "passed_check_count": len(passed_checks),
          "summary": summary,
          "error_details": "\n".join(error_lines) if error_lines else "All data quality checks satisfied."
      })

  - id: route_by_quality_gate
    type: io.kestra.plugin.core.flow.Switch
    description: Route based on whether all asset checks passed or critical errors were identified.
    value: "{{ outputs.evaluate_check_severities.vars.gate_status }}"
    cases:
      "PASSED":
        - id: log_gate_passed
          type: io.kestra.plugin.core.log.Log
          message: "Data quality gate passed for '{{ inputs.target_asset_key }}'. Proceeding with downstream orchestration."

        - id: execute_downstream_step
          type: io.kestra.plugin.core.log.Log
          message: "Triggering validated downstream data pipeline for verified asset '{{ inputs.target_asset_key }}'."

      "FAILED":
        - id: evaluate_blocking_condition
          type: io.kestra.plugin.core.flow.If
          description: Verify whether hard blocking is active and dry-run is turned off.
          condition: "{{ inputs.block_downstream == 'true' and inputs.dry_run == 'false' }}"
          then:
            - id: notify_slack_quality_failure
              type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
              description: Alert team of blocked pipeline due to data quality gate failure.
              url: "{{ secret('SLACK_WEBHOOK_URL') }}"
              payload: |
                {
                  "channel": "#data-quality-alerts",
                  "username": "Kestra Quality Gate",
                  "icon_emoji": ":octagonal_sign:",
                  "attachments": [
                    {
                      "color": "#dc3545",
                      "title": "Data Quality Gate Failed: Pipeline Blocked",
                      "text": "Asset *{{ inputs.target_asset_key }}* failed data quality checks.\nDownstream warehouse ingestion halted.\n\n*Errors:*\n{{ outputs.evaluate_check_severities.vars.error_details }}",
                      "footer": "Kestra Orchestrator",
                      "ts": "{{ now() | date('X') }}"
                    }
                  ]
                }

            - id: halt_pipeline_on_error
              type: io.kestra.plugin.core.execution.Fail
              description: Explicitly fail the execution to block any subsequent downstream tasks in this pipeline.
          else:
            - id: notify_slack_quality_warning
              type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
              description: Dispatch advisory notification when quality gate fails under dry-run mode.
              url: "{{ secret('SLACK_WEBHOOK_URL') }}"
              payload: |
                {
                  "channel": "#data-quality-alerts",
                  "username": "Kestra Quality Gate",
                  "icon_emoji": ":warning:",
                  "attachments": [
                    {
                      "color": "#ffc107",
                      "title": "Data Quality Gate Advisory (Dry Run Active)",
                      "text": "Asset *{{ inputs.target_asset_key }}* encountered check errors but pipeline was not blocked because dry-run is active.\n\n*Errors:*\n{{ outputs.evaluate_check_severities.vars.error_details }}",
                      "footer": "Kestra Orchestrator",
                      "ts": "{{ now() | date('X') }}"
                    }
                  ]
                }

errors:
  - id: alert_on_flow_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alert when the quality gate evaluation workflow itself fails.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "#data-platform-alerts",
        "username": "Kestra Orchestrator Alert",
        "icon_emoji": ":rotating_light:",
        "text": "Execution *{{ execution.id }}* of *{{ flow.id }}* encountered an error auditing asset *{{ inputs.target_asset_key }}*."
      }

outputs:
  - id: gate_status
    type: STRING
    value: "{{ outputs.evaluate_check_severities.vars.gate_status }}"
  - id: error_check_count
    type: INT
    value: "{{ outputs.evaluate_check_severities.vars.error_check_count }}"

extend:
  title: Dagster Asset Check Quality Gate
  metaTitle: Dagster Asset Check Quality Gate | Kestra
  shortDescription: Audit Dagster Asset Checks via GraphQL and enforce quality gates on downstream pipelines.
  metaDescription: Audit Dagster Asset Check evaluations via GraphQL and halt downstream warehouse pipelines when critical data quality assertions fail.
  description: |
    Audits execution outcomes and severity evaluations of Dagster Asset Checks (declarative data quality tests) across software-defined assets via the Dagster GraphQL API. When an asset check fails with `ERROR` severity or unhandled assertion failures, this flow halts downstream warehouse loading or analytics refreshes, isolating corrupt data before it propagates to production reporting layers.

    ## How it works
    1. Sends a GraphQL `AssetChecksQuery` targeted at a specific slash-delimited asset key.
    2. Runs an isolated Python task runner to classify check executions into passed, warnings, and severe errors.
    3. Evaluates flow branching via `io.kestra.plugin.core.flow.Switch`: assets passing all checks proceed to downstream steps.
    4. Evaluates `block_downstream` and `dry_run` safety gates when errors are detected.
    5. Dispatches contextual Slack alerts detailing failing check names, severities, and error descriptions.
    6. Halts pipeline execution using `io.kestra.plugin.core.execution.Fail` if blocking is armed and dry-run is disabled.

    ## What you get
    - Strict data contract and quality enforcement between Dagster asset materializations and external consumers.
    - Contextual alerting detailing exact failing assertions, schema anomalies, and row count drops.
    - Two-phase execution control: advisory dry-run monitoring vs. hard pipeline blocking.
    - Prevention of bad data entering production analytics dashboards and machine learning models.

    ## Who it's for
    - Analytics Engineers and Data Quality Leads building reliable data pipelines.
    - Data Platform Teams implementing automated quality gates across distributed tools.
    - BI Engineers safeguarding enterprise metrics and reporting accuracy.

    ## Why orchestrate this with Kestra
    Dagster allows data quality checks to execute alongside asset materializations. However, halting cross-system pipelines (such as a subsequent dbt run, DuckDB ingestion, or Snowflake transformation orchestrated externally) requires platform-level orchestration. Kestra inspects check evaluations, prevents downstream step execution upon failure, and notifies engineering teams.

    ## Prerequisites
    - Dagster GraphQL API endpoint reachable by Kestra workers.
    - A configured Slack incoming webhook for notification delivery.

    ### Secrets
    - `DAGSTER_TOKEN`: Dagster webserver bearer authentication token.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL.

    ## Quick start
    1. Define `DAGSTER_TOKEN` and `SLACK_WEBHOOK_URL` in Kestra Secrets.
    2. Set `target_asset_key` to your Dagster asset path (e.g., `analytics/fct_daily_orders`).
    3. Run a manual execution with `dry_run: true` to inspect existing check evaluations.
    4. Set `block_downstream: true` and `dry_run: false` to arm the quality gate.
    5. Enable `asset_check_schedule` for continuous 30-minute validation.

    ## How to extend
    - Chain downstream warehouse tasks (e.g., dbt Cloud or BigQuery SQL scripts) in the `PASSED` branch.
    - Open an automated GitHub issue or Jira incident when checks fail with `ERROR` severity.
    - Export test pass rates to ClickHouse or PostgreSQL for data quality SLA dashboarding.

    ## Links
    - [Dagster Asset Checks Documentation](https://docs.dagster.io/concepts/assets/asset-checks)
    - [Dagster GraphQL API Reference](https://docs.dagster.io/deployment/apis/graphql)
    - [Kestra Fail Plugin Documentation](https://kestra.io/plugins/plugin-core/io.kestra.plugin.core.execution.fail)
  tags:
    - Data
    - Infrastructure
  subTags:
    - Testing & Quality
    - Day 2 Operations
  ee: false
  demo: false
