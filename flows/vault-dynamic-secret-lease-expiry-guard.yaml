id: vault-dynamic-secret-lease-expiry-guard
namespace: company.security

description: |
  Enumerate HashiCorp Vault dynamic secret leases across database and cloud engines,
  auto-renew approaching expirations, detect non-renewable orphaned credentials,
  record compliance audit trails in Kestra KV, and alert SecOps on Slack.

inputs:
  - id: vault_address
    type: STRING
    displayName: Vault API Address
    description: Base HTTP or HTTPS endpoint URL of the target HashiCorp Vault cluster.
    defaults: "http://127.0.0.1:8200"

  - id: lease_prefixes
    type: ARRAY
    itemType: STRING
    displayName: Dynamic Secret Lease Prefixes
    description: Vault lease hierarchy paths to scan for dynamic database and cloud credentials.
    defaults:
      - "database/creds"
      - "aws/creds"

  - id: expiry_threshold_hours
    type: INT
    displayName: Expiration Warning Threshold (Hours)
    description: Warning threshold window; leases expiring sooner than this window are flagged or renewed.
    defaults: 24

  - id: renewal_increment_seconds
    type: INT
    displayName: Renewal Extension Increment (Seconds)
    description: Requested TTL extension increment when issuing lease renewal requests (default 86400s / 24 hours).
    defaults: 86400

  - id: auto_renew
    type: BOOL
    displayName: Auto-Renew Renewable Leases
    description: When true, automatically issues lease renewal requests for renewable leases within the expiration window.
    defaults: true

  - id: fail_on_orphaned_breach
    type: BOOL
    displayName: Fail on Orphaned Leases
    description: When true, marks the workflow execution as failed if non-renewable orphaned leases are approaching expiration.
    defaults: false

triggers:
  - id: periodic_lease_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: Audit dynamic secret lease health every 4 hours.
    cron: "0 */4 * * *"
    disabled: true

  - id: on_demand_audit_webhook
    type: io.kestra.plugin.core.trigger.Webhook
    description: On-demand dynamic lease audit webhook triggered by CI/CD pipelines or incident response.
    key: "{{ secret('VAULT_GUARD_WEBHOOK_KEY') }}"

tasks:
  - id: validate_inputs
    type: io.kestra.plugin.core.execution.Assert
    description: Assert configuration parameters meet basic sanity criteria before querying Vault.
    conditions:
      - "{{ inputs.vault_address | regexMatch('^https?://.+$') }}"
      - "{{ inputs.lease_prefixes | length > 0 }}"
      - "{{ inputs.expiry_threshold_hours > 0 }}"
      - "{{ inputs.renewal_increment_seconds > 0 }}"
    errorMessage: Invalid configuration parameters. Provide a valid HTTP/HTTPS vault_address and positive threshold values.

  - id: probe_vault_health
    type: io.kestra.plugin.core.http.Request
    description: Verify target HashiCorp Vault cluster is reachable, initialized, and unsealed before issuing lease requests.
    uri: "{{ inputs.vault_address }}/v1/sys/health"
    method: GET
    headers:
      X-Vault-Token: "{{ secret('VAULT_TOKEN') }}"
    options:
      allowFailed: true

  - id: require_unsealed_vault
    type: io.kestra.plugin.core.execution.Assert
    description: Halt execution immediately if Vault is sealed or uninitialized.
    conditions:
      - "{{ outputs.probe_vault_health.code == 200 or outputs.probe_vault_health.code == 429 }}"
      - "{{ fromJson(outputs.probe_vault_health.body).sealed == false }}"
      - "{{ fromJson(outputs.probe_vault_health.body).initialized == true }}"
    errorMessage: HashiCorp Vault cluster is sealed, uninitialized, or unreachable. Aborting lease guard scan.

  - id: audit_and_renew_leases
    type: io.kestra.plugin.scripts.python.Script
    description: Recursively inspect dynamic secret leases, renew renewable credentials, and identify orphaned leases.
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install requests
    script: |
      import os
      import sys
      import json
      from datetime import datetime, timezone
      import requests

      vault_addr = "{{ inputs.vault_address }}".rstrip("/")
      token = os.environ.get("SECRET_VAULT_TOKEN") or "{{ secret('VAULT_TOKEN') }}"
      prefixes = {{ inputs.lease_prefixes | toJson }}
      threshold_hours = int("{{ inputs.expiry_threshold_hours }}")
      threshold_seconds = threshold_hours * 3600
      increment_seconds = int("{{ inputs.renewal_increment_seconds }}")
      auto_renew = ("{{ inputs.auto_renew }}" == "true")

      headers = {
          "X-Vault-Token": token,
          "Content-Type": "application/json"
      }

      def enumerate_leases(prefix):
          clean_prefix = prefix.strip("/")
          url = f"{vault_addr}/v1/sys/leases/lookup/{clean_prefix}"
          try:
              resp = requests.request("LIST", url, headers=headers, timeout=20)
              if resp.status_code == 404:
                  return []
              resp.raise_for_status()
              data = resp.json().get("data", {})
              keys = data.get("keys", [])
          except Exception as exc:
              print(f"Warning: Failed to list leases at {clean_prefix}: {exc}")
              return []

          found = []
          for key in keys:
              full_key = f"{clean_prefix}/{key}"
              if key.endswith("/"):
                  found.extend(enumerate_leases(full_key.rstrip("/")))
              else:
                  found.append(full_key)
          return found

      all_lease_ids = []
      for p in prefixes:
          discovered = enumerate_leases(p)
          all_lease_ids.extend(discovered)
          print(f"Discovered {len(discovered)} lease(s) under prefix '{p}'")

      unique_lease_ids = sorted(list(set(all_lease_ids)))
      total_scanned = len(unique_lease_ids)

      renewed_leases = []
      unrenewed_expiring_leases = []
      orphaned_leases = []
      healthy_leases = []

      for lease_id in unique_lease_ids:
          lookup_url = f"{vault_addr}/v1/sys/leases/lookup"
          try:
              lookup_resp = requests.put(lookup_url, headers=headers, json={"lease_id": lease_id}, timeout=20)
              if lookup_resp.status_code == 404:
                  print(f"Lease {lease_id} no longer exists (already expired or revoked)")
                  continue
              lookup_resp.raise_for_status()
              lease_data = lookup_resp.json().get("data", {})
          except Exception as exc:
              print(f"Error looking up lease {lease_id}: {exc}")
              continue

          ttl = lease_data.get("ttl", 0)
          renewable = lease_data.get("renewable", False)
          expire_time = lease_data.get("expire_time")
          issue_time = lease_data.get("issue_time")
          last_renewal = lease_data.get("last_renewal")
          ttl_hours = round(ttl / 3600.0, 2)

          record = {
              "lease_id": lease_id,
              "ttl_seconds": ttl,
              "ttl_hours": ttl_hours,
              "expire_time": expire_time,
              "issue_time": issue_time,
              "last_renewal": last_renewal,
              "renewable": renewable
          }

          if ttl <= threshold_seconds:
              if not renewable:
                  record["orphaned"] = True
                  record["risk"] = "Non-renewable dynamic credential approaching expiration; service rotation required"
                  orphaned_leases.append(record)
                  print(f"CRITICAL ORPHANED LEASE: {lease_id} ({ttl_hours}h left, renewable=false)")
              elif auto_renew:
                  renew_url = f"{vault_addr}/v1/sys/leases/renew"
                  try:
                      renew_resp = requests.put(
                          renew_url,
                          headers=headers,
                          json={"lease_id": lease_id, "increment": increment_seconds},
                          timeout=20
                      )
                      if renew_resp.status_code == 200:
                          renew_body = renew_resp.json()
                          new_duration = renew_body.get("lease_duration", increment_seconds)
                          record["renewed"] = True
                          record["new_duration_seconds"] = new_duration
                          record["new_duration_hours"] = round(new_duration / 3600.0, 2)

                          warnings = renew_body.get("warnings") or []
                          is_max_ttl_capped = any("max_ttl" in str(w).lower() for w in warnings)
                          if is_max_ttl_capped and new_duration <= threshold_seconds:
                              record["orphaned"] = True
                              record["risk"] = "Dynamic lease reached max_ttl ceiling; cannot be extended further. Application restart required"
                              orphaned_leases.append(record)
                              print(f"CRITICAL: {lease_id} reached max_ttl ceiling ({record['new_duration_hours']}h left)")
                          else:
                              renewed_leases.append(record)
                              print(f"RENEWED: {lease_id} (extended to {record['new_duration_hours']}h)")
                      else:
                          record["orphaned"] = True
                          record["renewal_status_code"] = renew_resp.status_code
                          record["risk"] = f"Renewal rejected with HTTP {renew_resp.status_code}; application restart required"
                          orphaned_leases.append(record)
                          print(f"CRITICAL ORPHANED (renewal rejected): {lease_id} status={renew_resp.status_code}")
                  except Exception as ren_err:
                      record["orphaned"] = True
                      record["renewal_error"] = str(ren_err)
                      record["risk"] = "Renewal request failed; application restart required"
                      orphaned_leases.append(record)
                      print(f"CRITICAL ORPHANED (renewal error): {lease_id} error={ren_err}")
              else:
                  record["renewed"] = False
                  unrenewed_expiring_leases.append(record)
                  print(f"EXPIRING (renewable): {lease_id} ({ttl_hours}h left, auto_renew=false)")
          else:
              healthy_leases.append(record)
              print(f"HEALTHY: {lease_id} ({ttl_hours}h left)")

      orphaned_count = len(orphaned_leases)
      renewed_count = len(renewed_leases)
      unrenewed_count = len(unrenewed_expiring_leases)
      healthy_count = len(healthy_leases)

      if orphaned_count > 0:
          status = "CRITICAL"
      elif unrenewed_count > 0:
          status = "WARNING"
      else:
          status = "HEALTHY"

      summary = (
          f"Vault Dynamic Lease Guard: {status} | Scanned {total_scanned} lease(s). "
          f"Renewed: {renewed_count}, Orphaned Expiring: {orphaned_count}, "
          f"Unrenewed Expiring: {unrenewed_count}, Healthy: {healthy_count}."
      )
      print(summary)

      manifest = {
          "status": status,
          "summary": summary,
          "total_scanned_count": total_scanned,
          "renewed_count": renewed_count,
          "unrenewed_count": unrenewed_count,
          "orphaned_count": orphaned_count,
          "healthy_count": healthy_count,
          "renewed_leases": renewed_leases,
          "unrenewed_leases": unrenewed_expiring_leases,
          "orphaned_leases": orphaned_leases,
          "scanned_at": datetime.now(timezone.utc).isoformat()
      }

      print("::" + json.dumps({
          "outputs": {
              "status": status,
              "summary": summary,
              "total_scanned_count": total_scanned,
              "renewed_count": renewed_count,
              "unrenewed_count": unrenewed_count,
              "orphaned_count": orphaned_count,
              "healthy_count": healthy_count,
              "audit_manifest": manifest
          }
      }) + "::")

  - id: record_audit_to_kv
    type: io.kestra.plugin.core.kv.Set
    description: Record lease guard audit metrics in Kestra namespace KV store for historical compliance reporting.
    key: vault_dynamic_lease_guard_audit
    value: "{{ outputs.audit_and_renew_leases.vars.audit_manifest | toJson }}"
    kvType: JSON

  - id: evaluate_findings
    type: io.kestra.plugin.core.flow.If
    description: Branch based on scan outcomes; post Slack alerts if action was taken or orphaned leases were flagged.
    condition: "{{ outputs.audit_and_renew_leases.vars.orphaned_count > 0 or outputs.audit_and_renew_leases.vars.renewed_count > 0 or outputs.audit_and_renew_leases.vars.unrenewed_count > 0 }}"
    then:
      - id: notify_slack_inventory
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Post structured dynamic lease inventory and alerts to SecOps and Platform team channels.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "attachments": [
              {
                "color": "{{ outputs.audit_and_renew_leases.vars.orphaned_count > 0 ? 'danger' : (outputs.audit_and_renew_leases.vars.unrenewed_count > 0 ? 'warning' : 'good') }}",
                "title": ":shield: Vault Dynamic Secret Lease Guard: {{ outputs.audit_and_renew_leases.vars.status }}",
                "text": "*{{ outputs.audit_and_renew_leases.vars.summary }}*\n\n*Vault Address:* `{{ inputs.vault_address }}`\n*Total Scanned:* {{ outputs.audit_and_renew_leases.vars.total_scanned_count }}\n*Auto-Renewed Leases:* {{ outputs.audit_and_renew_leases.vars.renewed_count }}\n*⚠️ Orphaned Non-Renewable Expiring:* {{ outputs.audit_and_renew_leases.vars.orphaned_count }}\n*Unrenewed Expiring:* {{ outputs.audit_and_renew_leases.vars.unrenewed_count }}\n*Execution:* `{{ execution.id }}`\n\n{% if outputs.audit_and_renew_leases.vars.orphaned_count > 0 %}*Action Required:* Non-renewable dynamic leases have reached max TTL or do not permit renewal. Dependent applications must restart or obtain fresh credentials before lease expiration to prevent outage.{% endif %}"
              }
            ]
          }

      - id: check_orphaned_gate
        type: io.kestra.plugin.core.flow.If
        description: Enforce pipeline failure gate if non-renewable orphaned leases are detected and fail_on_orphaned_breach is enabled.
        condition: "{{ outputs.audit_and_renew_leases.vars.orphaned_count > 0 and inputs.fail_on_orphaned_breach == true }}"
        then:
          - id: fail_on_orphaned_leases
            type: io.kestra.plugin.core.execution.Fail
            description: Fail execution to trigger incident escalation for imminent orphaned dynamic credential expiry.
            errorMessage: "CRITICAL: Detected {{ outputs.audit_and_renew_leases.vars.orphaned_count }} non-renewable dynamic secret lease(s) approaching expiration. Remediate credentials immediately."
    else:
      - id: log_healthy_state
        type: io.kestra.plugin.core.log.Log
        description: Log nominal confirmation when all dynamic secret leases have healthy TTL countdowns.
        message: "{{ outputs.audit_and_renew_leases.vars.summary }}"

  - id: emit_guard_metrics
    type: io.kestra.plugin.core.output.OutputValues
    description: Export aggregated lease metrics for audit logs, telemetry, and downstream orchestrations.
    values:
      total_scanned: "{{ outputs.audit_and_renew_leases.vars.total_scanned_count }}"
      renewed_count: "{{ outputs.audit_and_renew_leases.vars.renewed_count }}"
      unrenewed_count: "{{ outputs.audit_and_renew_leases.vars.unrenewed_count }}"
      orphaned_count: "{{ outputs.audit_and_renew_leases.vars.orphaned_count }}"
      healthy_count: "{{ outputs.audit_and_renew_leases.vars.healthy_count }}"
      status: "{{ outputs.audit_and_renew_leases.vars.status }}"

errors:
  - id: alert_guard_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alert on-call response team if the dynamic secret lease guard fails unexpectedly.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "attachments": [
          {
            "color": "danger",
            "title": ":rotating_light: Vault Dynamic Secret Lease Guard FAILED",
            "text": "Failed to audit or renew dynamic secret leases at `{{ inputs.vault_address }}`.\nCheck `VAULT_TOKEN` permissions on `sys/leases/*` and worker connectivity.\nExecution: `{{ execution.id }}`"
          }
        ]
      }

extend:
  title: HashiCorp Vault Dynamic Secret Lease Expiry & Renewal Guard
  metaTitle: HashiCorp Vault Dynamic Secret Lease Expiry & Renewal Guard | Kestra
  shortDescription: Audit and renew expiring dynamic Vault database and cloud leases, flag non-renewable orphans, and alert Slack.
  metaDescription: Enumerate HashiCorp Vault dynamic secret leases, extend renewable credentials before expiration, detect orphaned leases, and log audit trails in Kestra KV.
  description: |
    Dynamic database credentials and cloud IAM roles generated by HashiCorp Vault
    prevent credential reuse and limit blast radiuses. However, long-running services
    frequently suffer production outages when dynamic leases reach their time-to-live
    (TTL) without automated renewal, or when non-renewable credentials hit their
    hard max TTL without an application restart.

    This blueprint provides an enterprise guard that scans Vault dynamic secret
    lease hierarchies, verifies cluster seal status, extends renewable leases
    before expiration, detects orphaned credentials requiring application restarts,
    records historical audit trails in Kestra KV, and alerts operations teams on Slack.

    ## How it works

    1. **Pre-flight Health Gate**: Validates input parameters and queries `GET /v1/sys/health` to ensure the HashiCorp Vault cluster is initialized, unsealed, and operational.
    2. **Recursive Lease Enumeration**: Scans configurable lease prefixes (e.g., `database/creds`, `aws/creds`) using Vault's `LIST /v1/sys/leases/lookup/<prefix>` API to locate all active dynamic leases.
    3. **TTL Inspection & Auto-Renewal**: Queries `PUT /v1/sys/leases/lookup` for each discovered lease ID. If a lease's remaining TTL falls below `expiry_threshold_hours` and `renewable` is true, an advisory extension is requested via `PUT /v1/sys/leases/renew` with `renewal_increment_seconds`.
    4. **Orphaned Lease Detection**: Leases with remaining TTL below the threshold where `renewable` is false are flagged as critical orphans. These represent credentials that have reached their configured engine `max_ttl` or were created non-renewable, requiring application restart or role re-authentication.
    5. **Compliance Audit Trail in KV**: Stores an atomic evaluation manifest in Kestra's namespace Key-Value store with key `vault_dynamic_lease_guard_audit`, including scan timestamps, counts, and per-lease details.
    6. **Actionable Slack Alerts**: Dispatches rich Slack attachments detailing renewed leases, healthy counts, and prioritized warnings directing engineers to applications at risk of credential revocation.
    7. **Policy Enforcement Gate**: Optionally triggers a pipeline failure if orphaned non-renewable leases are discovered and `fail_on_orphaned_breach` is enabled.

    ## What you get

    - Automated renewal of expiring dynamic database and cloud credentials before service disruption.
    - Early warning detection of non-renewable orphaned leases approaching hard expiration.
    - Persistent audit trail in Kestra KV tracking lease renewals and expiration countdowns.
    - Multi-engine visibility across PostgreSQL, MySQL, AWS STS, and cloud identity dynamic secrets.
    - Emergency notifications on Slack with actionable remediation steps.

    ## Who it's for

    - Platform Engineers and SREs operating production HashiCorp Vault clusters.
    - Security Operations (SecOps) teams enforcing dynamic secret lifecycle policies.
    - Database Administrators managing automated credential rotation for stateful services.

    ## Why orchestrate this with Kestra

    Managing lease renewal loops inside client applications increases microservice code complexity and creates failure points when processes restart. Centralizing lease lifecycle management in Kestra provides declarative visibility, scheduled verification runs, centralized secret protection, historical audit state in KV, and incident escalation without writing bespoke daemon cron jobs.

    ## Prerequisites

    - A running HashiCorp Vault cluster (open-source or Enterprise) with dynamic secret engines enabled (e.g., Database, AWS, Azure, GCP).
    - A Vault token with `read` and `update` capabilities on `sys/leases/*` and `read` on `sys/health`.
    - A Slack Incoming Webhook URL for operational notifications.

    ### Secrets

    - `VAULT_TOKEN`: Vault authentication token with permissions to list, lookup, and renew leases under `/sys/leases/*`.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL to deliver lease guard digests and alerts.
    - `VAULT_GUARD_WEBHOOK_KEY`: Secret authentication key protecting the on-demand webhook trigger.

    ## Quick start

    1. Configure `VAULT_TOKEN`, `SLACK_WEBHOOK_URL`, and `VAULT_GUARD_WEBHOOK_KEY` in your Kestra namespace secrets.
    2. Import this blueprint and set `vault_address` to your Vault cluster endpoint (e.g., `https://vault.internal.example.com:8200`).
    3. Execute the workflow manually to perform a dry scan of active dynamic leases.
    4. Enable the `periodic_lease_audit` trigger to establish automated 4-hour lease lifecycle guard scans.

    ## How to extend

    - **Automated Service Restarts**: Connect the orphaned lease branch to a Kubernetes plugin task (`io.kestra.plugin.kubernetes.pod.Delete` or rollout restart) to recycle pods holding unrenewable credentials before expiration.
    - **PagerDuty Integration**: Add an on-call escalation task to notify database administrators if a critical production database role lease cannot be renewed.
    - **Custom Mount Paths**: Add cloud identity prefixes like `gcp/key` or `azure/creds` to `inputs.lease_prefixes` to encompass multi-cloud dynamic secrets.

    ## Links

    - [HashiCorp Vault Leases API](https://developer.hashicorp.com/vault/api-docs/system/leases)
    - [Kestra HTTP Request Plugin](https://kestra.io/plugins/core/tasks/http/io.kestra.plugin.core.http.request)
    - [Kestra KV Store Plugin](https://kestra.io/plugins/core/tasks/kv/io.kestra.plugin.core.kv.set)
    - [Kestra Slack Plugin](https://kestra.io/plugins/plugin-slack)
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Policy & Compliance
    - Day 2 Operations
  ee: false
  demo: false
