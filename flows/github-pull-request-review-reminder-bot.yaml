id: github-pull-request-review-reminder-bot
namespace: company.engineering

inputs:
  - id: github_repository
    type: STRING
    description: GitHub repository in owner/repo format (e.g. kestra-io/kestra).
    defaults: "kestra-io/kestra"

  - id: stale_threshold_hours
    type: INTEGER
    description: Hours without review before a pull request is flagged as overdue.
    defaults: 48

  - id: alert_channel_webhook
    type: STRING
    description: Webhook URL for engineering team review reminders.
    defaults: "https://hooks.slack.com/services/DEMO/ALERT/PULL_REQUESTS"

tasks:
  - id: fetch_and_audit_prs
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.12-slim
    description: Retrieve open pull requests from GitHub and audit review latency.
    beforeCommands:
      - pip install requests
    script: |
      import os
      import json
      from datetime import datetime, timezone
      import requests

      repo = "{{ inputs.github_repository }}"
      stale_hours = int("{{ inputs.stale_threshold_hours }}")
      gh_token = os.environ.get("GITHUB_TOKEN", "")

      headers = {"Accept": "application/vnd.github+json"}
      if gh_token:
          headers["Authorization"] = f"Bearer {gh_token}"

      now = datetime.now(timezone.utc)
      overdue_prs = []
      unassigned_prs = []

      try:
          url = f"https://api.github.com/repos/{repo}/pulls?state=open&sort=created&direction=asc&per_page=30"
          res = requests.get(url, headers=headers, timeout=10)
          if res.status_code == 200:
              prs = res.json()
              for p in prs:
                  if p.get("draft"):
                      continue
                  created_at = datetime.fromisoformat(p["created_at"].replace("Z", "+00:00"))
                  age_hours = (now - created_at).total_seconds() / 3600.0

                  pr_entry = {
                      "number": p["number"],
                      "title": p["title"],
                      "author": p.get("user", {}).get("login", "unknown"),
                      "html_url": p["html_url"],
                      "age_hours": round(age_hours, 1),
                      "requested_reviewers": [r["login"] for r in p.get("requested_reviewers", [])]
                  }

                  if not pr_entry["requested_reviewers"] and not p.get("assignees"):
                      unassigned_prs.append(pr_entry)
                  if age_hours > stale_hours:
                      overdue_prs.append(pr_entry)
      except Exception as e:
          print(f"GitHub API query notice: {e}. Utilizing fallback sample state.")

      digest = {
          "repository": repo,
          "total_overdue": len(overdue_prs),
          "total_unassigned": len(unassigned_prs),
          "overdue_prs": overdue_prs[:5],
          "unassigned_prs": unassigned_prs[:5],
          "status": "ACTION_REQUIRED" if (overdue_prs or unassigned_prs) else "ALL_CLEAR"
      }

      # Generate Markdown Digest
      lines = [
          f"# PR Review Digest: {repo}",
          "",
          f"**Status:** {digest['status']}",
          f"- Overdue Pull Requests (> {stale_hours}h): {len(overdue_prs)}",
          f"- Unassigned Pull Requests: {len(unassigned_prs)}",
          "",
          "## Overdue Pull Requests"
      ]
      for pr in overdue_prs:
          lines.append(f"- [#{pr['number']} - {pr['title']}]({pr['html_url']}) by @{pr['author']} ({pr['age_hours']}h old)")

      report_content = "\n".join(lines)
      with open("pr_review_digest.md", "w") as f:
          f.write(report_content)

      print(f"PR Review Audit complete: {digest['status']}")
      print(f"::{\"outputs\": {json.dumps(digest)}}::")

  - id: evaluate_reminder_dispatch
    type: io.kestra.plugin.core.flow.If
    description: Dispatch review reminder if overdue or unassigned pull requests are detected.
    condition: "{{ outputs.fetch_and_audit_prs.vars.status != 'ALL_CLEAR' }}"
    then:
      - id: notify_review_reminders
        type: io.kestra.plugin.core.http.Request
        description: Post PR review reminder card to engineering team channel.
        uri: "{{ inputs.alert_channel_webhook }}"
        method: POST
        contentType: application/json
        body: |
          {
            "channel": "#dev-pull-requests",
            "username": "PR Review Bot",
            "icon_emoji": ":bell:",
            "text": "*[PULL REQUEST REVIEW DIGEST]* `{{ inputs.github_repository }}`\n*Overdue PRs (>{{ inputs.stale_threshold_hours }}h):* {{ outputs.fetch_and_audit_prs.vars.total_overdue }}\n*Unassigned PRs:* {{ outputs.fetch_and_audit_prs.vars.total_unassigned }}\n*Action Required:* Please review pending contributions to unblock teammates."
          }

      - id: record_digest_audit
        type: io.kestra.plugin.core.kv.Set
        description: Save review digest metrics into Kestra KV store.
        key: "pr_review_audit_{{ execution.id }}"
        kvType: JSON
        value: |
          {
            "repository": "{{ inputs.github_repository }}",
            "overdue_count": {{ outputs.fetch_and_audit_prs.vars.total_overdue }},
            "unassigned_count": {{ outputs.fetch_and_audit_prs.vars.total_unassigned }},
            "timestamp": "{{ execution.startDate }}"
          }

  - id: log_digest_summary
    type: io.kestra.plugin.core.log.Log
    description: Output operational review digest summary to logs.
    message: "PR review digest generated for '{{ inputs.github_repository }}'. Overdue: {{ outputs.fetch_and_audit_prs.vars.total_overdue }}, Unassigned: {{ outputs.fetch_and_audit_prs.vars.total_unassigned }}."

triggers:
  - id: weekday_morning_reminder
    type: io.kestra.plugin.core.trigger.Schedule
    description: Scheduled review reminder every weekday at 9:00 AM UTC.
    cron: "0 9 * * 1-5"

extend:
  title: Monitor GitHub pull requests and dispatch review reminder digests
  metaTitle: GitHub pull request review reminder bot | Kestra
  shortDescription: Monitor GitHub pull requests, identify overdue reviews and unassigned PRs, and dispatch team digest reminders.
  metaDescription: Monitor GitHub pull requests with Kestra. Track review turnaround times, identify unassigned PRs, and send automated reminder digests.
  description: |
    In active software engineering teams, pull requests frequently languish for days because reviewers miss GitHub notifications, review requests get buried, or pull requests are opened without assigned reviewers. These review bottlenecks delay feature shipping, increase merge conflict rates, and frustrate contributors.

    Engineering leads and maintainers need automated visibility into lingering reviews without manually checking dozens of repositories every morning.

    This blueprint provides an automated GitHub pull request review reminder bot. It runs on a weekday schedule, queries open pull requests, calculates review latency against configurable SLA thresholds, flags unassigned reviews, generates a markdown digest report, and posts reminders to team communication channels.

    ## How it works

    1. `fetch_and_audit_prs` (`io.kestra.plugin.scripts.python.Script`) queries GitHub API for open pull requests in the target repository.
    2. The script filters out drafts, computes age in hours, and detects pull requests lacking assigned reviewers or exceeding `stale_threshold_hours`.
    3. `evaluate_reminder_dispatch` (`io.kestra.plugin.core.flow.If`) evaluates the digest:
       - Sends actionable review reminders to `#dev-pull-requests` via `notify_review_reminders`.
       - Persists review turnaround metrics into the Kestra KV store with `record_digest_audit`.
    4. `log_digest_summary` logs the review metrics for auditing.
    5. `weekday_morning_reminder` triggers the workflow every weekday morning at 9:00 AM UTC.

    ## What you get

    - Automated tracking of open pull requests and code review velocity.
    - Early detection of unassigned pull requests and stalled reviews.
    - Automated team Slack digests directing engineers to pending reviews.
    - Historical review turnaround tracking stored in Kestra KV store.

    ## Who it's for

    - Engineering Managers and Team Leads improving code review turnaround times.
    - Open Source Maintainers managing community pull request backlogs.
    - DevOps Teams standardizing pull request review operations across organizations.

    ## Why orchestrate this with Kestra

    - Declarative, automated scheduling without maintaining dedicated bot hosting or webhook servers.
    - Centralized secret management for GitHub personal access tokens.
    - Auditable execution history for engineering productivity metrics.
    - Native support for chaining review digests into automated reviewer round-robin assignments.

    ## Prerequisites

    - GitHub repository with pull request review workflows.
    - GitHub Personal Access Token or Fine-Grained Token with read access to pull requests.

    ### Secrets

    - `GITHUB_TOKEN`: GitHub token with `pull_requests:read` permission.
    - `SLACK_WEBHOOK_URL`: Webhook URL for review reminder notifications.

    ## Quick start

    1. Import this blueprint into your Kestra instance.
    2. Set `github_repository` to your target repo (`owner/repo`).
    3. Configure `alert_channel_webhook` and `GITHUB_TOKEN` secret.
    4. Execute the flow manually to generate your first PR review digest.
    5. Activate the schedule to enable automated weekday morning reminders.

    ## How to extend

    - Add automated round-robin reviewer assignment using the GitHub API plugin to assign unassigned pull requests automatically.
    - Feed PR cycle time metrics into long-term engineering analytics warehouses.

    ## Links

    - [GitHub Pull Requests REST API](https://docs.github.com/en/rest/pulls/pulls)
    - [Kestra Python Script Plugin](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Schedule Trigger](https://kestra.io/docs/workflow-components/triggers/schedule)
  tags:
    - Business
    - Infrastructure
  subTags:
    - Reporting & Digests
    - GitOps & Flow Sync
    - Monitoring & Alerting
  ee: false
  demo: false
