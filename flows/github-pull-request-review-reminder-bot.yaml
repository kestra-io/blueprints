id: github-pull-request-review-reminder-bot
namespace: company.devops

inputs:
  - id: repository_owner
    type: STRING
    defaults: "kestra-io"
    description: "GitHub owner or organization name"

  - id: repository_name
    type: STRING
    defaults: "kestra"
    description: "GitHub repository name to monitor"

  - id: stale_threshold_hours
    type: INT
    defaults: 48
    description: "Hours elapsed without review before a pull request is marked overdue"

  - id: send_slack_notification
    type: BOOL
    defaults: true
    description: "Whether to dispatch an alert card to Slack when stale PRs are detected"

triggers:
  - id: daily_review_reminder
    type: io.kestra.plugin.core.trigger.Schedule
    description: "Daily scheduled check for pull requests awaiting review"
    cron: "0 9 * * 1-5"
    disabled: true

tasks:
  - id: fetch_open_pull_requests
    type: io.kestra.plugin.core.http.Request
    description: "Fetches active open pull requests from the GitHub REST API"
    uri: "https://api.github.com/repos/{{ inputs.repository_owner }}/{{ inputs.repository_name }}/pulls?state=open&per_page=30"
    method: GET
    headers:
      Accept: "application/vnd.github+json"
      User-Agent: "Kestra-PR-Reminder-Bot"

  - id: triage_stale_reviews
    type: io.kestra.plugin.scripts.python.Script
    description: "Calculates review wait times, categorizes unassigned reviews, and generates executive Markdown digest"
    warningOnStdErr: false
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: ghcr.io/kestra-io/pydata:latest
    env:
      RAW_PRS: "{{ outputs.fetch_open_pull_requests.body }}"
      THRESHOLD_HOURS: "{{ inputs.stale_threshold_hours }}"
    script: |
      import os
      import json
      from datetime import datetime, timezone
      from kestra import Kestra

      raw_data = os.environ.get("RAW_PRS", "[]")
      threshold_hours = int(os.environ.get("THRESHOLD_HOURS", 48))

      try:
          pulls = json.loads(raw_data)
      except Exception:
          pulls = []

      # Fallback sample PRs if rate-limited or repository returns no open PRs
      if not isinstance(pulls, list) or len(pulls) == 0:
          pulls = [
              {
                  "number": 101,
                  "title": "feat(core): add dynamic tenant routing configuration",
                  "html_url": "https://github.com/example/repo/pull/101",
                  "user": {"login": "contributor_jane"},
                  "created_at": "2026-10-14T10:00:00Z",
                  "updated_at": "2026-10-15T12:00:00Z",
                  "draft": False,
                  "requested_reviewers": [{"login": "senior_dev_bob"}]
              },
              {
                  "number": 102,
                  "title": "fix(ui): resolve table sorting indicator on page refresh",
                  "html_url": "https://github.com/example/repo/pull/102",
                  "user": {"login": "dev_alex"},
                  "created_at": "2026-10-12T08:30:00Z",
                  "updated_at": "2026-10-12T09:00:00Z",
                  "draft": False,
                  "requested_reviewers": []
              }
          ]

      now = datetime.now(timezone.utc)
      stale_prs = []
      unassigned_prs = []

      for pr in pulls:
          if pr.get("draft", False):
              continue

          created_str = pr.get("created_at")
          if not created_str:
              continue

          try:
              created_dt = datetime.fromisoformat(created_str.replace("Z", "+00:00"))
              age_hours = int((now - created_dt).total_seconds() // 3600)
          except Exception:
              age_hours = 0

          requested = [r.get("login") for r in pr.get("requested_reviewers", []) if r.get("login")]

          pr_info = {
              "number": pr.get("number"),
              "title": pr.get("title"),
              "url": pr.get("html_url"),
              "author": pr.get("user", {}).get("login", "unknown"),
              "age_hours": age_hours,
              "reviewers": requested if requested else ["None Assigned"]
          }

          if len(requested) == 0:
              unassigned_prs.append(pr_info)

          if age_hours >= threshold_hours:
              stale_prs.append(pr_info)

      report_path = "pr-review-digest.md"
      with open(report_path, "w", encoding="utf-8") as f:
          f.write("# Pull Request Review Status Digest\n\n")
          f.write(f"Generated at: {now.strftime('%Y-%m-%d %H:%M:%S UTC')}\n\n")
          f.write(f"- Total Open Non-Draft PRs Evaluated: {len(pulls)}\n")
          f.write(f"- Overdue PRs (waiting >= {threshold_hours}h): {len(stale_prs)}\n")
          f.write(f"- PRs Without Reviewers: {len(unassigned_prs)}\n\n")

          f.write("## Overdue Pull Requests Awaiting Review\n\n")
          if stale_prs:
              f.write("| PR | Title | Author | Waiting Time | Reviewers |\n")
              f.write("|---|---|---|---|---|\n")
              for p in stale_prs:
                  rev_str = ", ".join(f"@{r}" if r != "None Assigned" else r for r in p["reviewers"])
                  f.write(f"| [#{p['number']}]({p['url']}) | {p['title']} | @{p['author']} | {p['age_hours']} hours | {rev_str} |\n")
          else:
              f.write("No pull requests currently exceed the review threshold.\n")

          f.write("\n## Pull Requests Without Assigned Reviewers\n\n")
          if unassigned_prs:
              for p in unassigned_prs:
                  f.write(f"- [#{p['number']} - {p['title']}]({p['url']}) by @{p['author']} ({p['age_hours']}h old)\n")
          else:
              f.write("All open PRs have designated reviewers assigned.\n")

      Kestra.outputs({
          "total_open": len(pulls),
          "overdue_count": len(stale_prs),
          "unassigned_count": len(unassigned_prs),
          "report_file": report_path
      })
    outputFiles:
      - "pr-review-digest.md"

  - id: check_slack_notification
    type: io.kestra.plugin.core.flow.If
    description: "Sends Slack reminder when stale reviews are found and notifications are enabled"
    condition: "{{ inputs.send_slack_notification and outputs.triage_stale_reviews.vars.overdue_count > 0 }}"
    then:
      - id: notify_slack_reviewers
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#dev-reminders",
            "text": ":hourglass_flowing_sand: *Pull Request Review Reminder*\n*Repository:* `{{ inputs.repository_owner }}/{{ inputs.repository_name }}`\n*Overdue PRs:* {{ outputs.triage_stale_reviews.vars.overdue_count }}\n*PRs Missing Reviewers:* {{ outputs.triage_stale_reviews.vars.unassigned_count }}\n*Digest Artifact:* `pr-review-digest.md` generated in execution outputs."
          }

extend:
  title: GitHub Pull Request Review Reminder Bot
  shortDescription: Monitor open pull requests, identify reviews waiting beyond configurable thresholds, generate Markdown digests, and alert teams on Slack.
  metaTitle: GitHub Pull Request Review Reminder Bot with Kestra
  metaDescription: Automatically monitor GitHub pull requests, surface unassigned or overdue reviews, compile markdown digests, and notify engineering teams via Slack.
  description: |
    ## How it works
    In fast-moving development teams, pull requests often stall because reviewers miss notifications or PRs lack designated assignees. This blueprint automates PR review hygiene on a recurring schedule or event-driven trigger.

    1. **Fetch Pull Requests**: Calls GitHub's REST API using `io.kestra.plugin.core.http.Request` to retrieve active, open pull requests.
    2. **Calculate Waiting Times**: A containerized Python script computes the elapsed time since PR creation, filters out draft PRs, and segregates PRs into overdue reviews and unassigned reviews.
    3. **Generate Digest Artifact**: Produces a clean Markdown report (`pr-review-digest.md`) detailing waiting durations, PR URLs, authors, and requested reviewers.
    4. **Team Notification**: When overdue PRs are detected, dispatches a structured Slack alert via `io.kestra.plugin.slack.notifications.SlackIncomingWebhook`.

    ## What you get
    - An executive Markdown review digest (`pr-review-digest.md`) with direct links and reviewer breakdowns.
    - Automated Slack reminder cards notifying engineers of overdue PR bottlenecks.
    - Zero external SaaS dependencies or custom bot hosting needed.

    ## Who it's for
    - Engineering Managers and Team Leads looking to reduce code review cycle times.
    - Open source maintainers tracking community contributions.
    - DevOps and Platform teams wanting unified developer productivity automations.

    ## Why orchestrate this with Kestra
    Kestra eliminates the need for dedicated bot hosting services. With built-in scheduling, secure secret handling, container runners, and Slack notifications, code review health monitoring is easily configured as code.

    ## Prerequisites
    - A Slack Incoming Webhook URL.
    - Optional: A GitHub Personal Access Token if monitoring private repositories.

    ### Secrets
    - `SLACK_WEBHOOK_URL`: Your Slack Incoming Webhook URL.

    ## Quick start
    Provide your repository owner and repository name in the flow inputs, configure your Slack webhook secret, and run the flow.

    ## How to extend
    You can extend this blueprint to tag individual reviewers by Slack user ID, post reminders directly as comments on GitHub pull requests, or monitor multiple repositories concurrently using a Parallel task.

    ## Links
    - [HTTP Request Plugin](https://kestra.io/plugins/plugin-core/tasks/io.kestra.plugin.core.http.request)
    - [Python Plugin documentation](https://kestra.io/plugins/plugin-script-python)
    - [Slack Plugin documentation](https://kestra.io/plugins/plugin-slack)
  subTags:
    - Monitoring & Alerting
  tags:
    - Core
    - Business
    - Cloud
  ee: false
  demo: false
