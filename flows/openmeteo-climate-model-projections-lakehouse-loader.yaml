id: openmeteo-climate-change-projections-lakehouse-loader
namespace: company.analytics
description: Ingests ensemble climate model projections, historical warming simulations, and temperature extremes from Open-Meteo Climate API into DuckDB, exports Parquet and analytics datasets, and manages sync state with Kestra KV store.

inputs:
  - id: state_key
    type: STRING
    description: Kestra KV store key tracking processed unique entity identifiers.
    defaults: openmeteo-climate-change-projections-lakehouse-loader_state

variables:
  default_state: "[]"

triggers:
  - id: periodic_sync
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 4 * * 1"

tasks:
  - id: get_current_state
    type: io.kestra.plugin.core.kv.Get
    key: "{{ inputs.state_key }}"
    errorOnMissing: false

  - id: ingest_and_transform
    type: io.kestra.plugin.scripts.python.Commands
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install requests duckdb
    commands:
      - |
        python3 - << 'PYEOF'
        import os
        import json
        import requests
        import duckdb
        from datetime import datetime, timezone

        raw_state = """{{ outputs.get_current_state.value ?? vars.default_state }}"""
        try:
            seen_ids = set(json.loads(raw_state))
        except Exception:
            seen_ids = set()

        url = "https://climate-api.open-meteo.com/v1/climate?latitude=52.52&longitude=13.41&models=EC_Earth3P_HR&daily=temperature_2m_max&start_date=2026-01-01&end_date=2026-01-31"
        headers = {"User-Agent": "KestraLakehouseLoader/1.0 (kestra-data-pipeline; contact@company.internal)"}

        resp = requests.get(url, headers=headers, timeout=30)
        resp.raise_for_status()
        data = resp.json()
        root_key = "daily"
        items = data.get(root_key, data) if root_key else data

        records = []
        now_iso = datetime.now(timezone.utc).isoformat()
        current_ids = []

        
        dates = items.get('time', [])
        temps = items.get('temperature_2m_max', [])
        for i in range(len(dates)):
            dt = str(dates[i])
            current_ids.append(dt)
            try:
                tmax = float(temps[i]) if temps[i] is not None else 0.0
            except Exception:
                tmax = 0.0

            records.append({
                'projection_date': dt,
                'temperature_2m_max': tmax,
                'is_new': bool(dt not in seen_ids),
                'ingestion_timestamp': now_iso
            })
        

        con = duckdb.connect(database=":memory:")
        con.execute("""
            CREATE TABLE climate_projections (
                projection_date VARCHAR,
                temperature_2m_max DOUBLE,
                is_new BOOLEAN,
                ingestion_timestamp VARCHAR
            );
        """)

        if records:
            con.execute("INSERT INTO climate_projections SELECT * FROM read_json_auto(?)", [json.dumps(records)])

        con.execute("COPY climate_projections TO 'climate_model_projections.parquet' (FORMAT PARQUET, COMPRESSION ZSTD);")
        con.execute("""
            COPY (
                SELECT
                    SUBSTRING(projection_date, 1, 7) AS projection_month,
                    AVG(temperature_2m_max) AS avg_max_temp,
                    MAX(temperature_2m_max) AS absolute_max_temp,
                    MIN(temperature_2m_max) AS absolute_min_temp
                FROM climate_projections
                GROUP BY 1
            ) TO 'monthly_climate_summary.csv' (HEADER, DELIMITER ',');
        """)

        new_count = con.execute("SELECT count(*) FROM climate_projections WHERE is_new = true").fetchone()[0]
        total_count = con.execute("SELECT count(*) FROM climate_projections").fetchone()[0]

        updated_ids = list(seen_ids.union(current_ids))
        with open("updated_state.json", "w") as f:
            json.dump(updated_ids, f)

        metrics = {
            "total_extracted": total_count,
            "new_entities": new_count,
            "synced_at": now_iso
        }
        with open("metrics.json", "w") as f:
            json.dump(metrics, f)

        print(f"Lakehouse sync complete. Processed {total_count} records ({new_count} newly observed).")
        PYEOF
    outputFiles:
      - climate_model_projections.parquet
      - monthly_climate_summary.csv
      - updated_state.json
      - metrics.json

  - id: update_state
    type: io.kestra.plugin.core.kv.Set
    key: "{{ inputs.state_key }}"
    value: "{{ read(outputs.ingest_and_transform.outputFiles['updated_state.json']) }}"

  - id: analyze_and_notify
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.ingest_and_transform.outputFiles['climate_model_projections.parquet'] != null }}"
    then:
      - id: log_metrics
        type: io.kestra.plugin.core.log.Log
        message: "Open-Meteo Climate Model Projections sync succeeded. Metrics: {{ read(outputs.ingest_and_transform.outputFiles['metrics.json']) }}"
