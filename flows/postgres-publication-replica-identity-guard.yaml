id: postgres-publication-replica-identity-guard
namespace: company.team

description: |
  Find tables in a PostgreSQL logical replication publication that publishes UPDATE or DELETE
  but have no usable replica identity (no primary key and REPLICA IDENTITY DEFAULT, or NOTHING).
  On such a table every UPDATE and DELETE fails with "cannot update table because it does not
  have a replica identity", which breaks the application, not only the replication. Alert Slack,
  and optionally set REPLICA IDENTITY USING INDEX on a unique not-null index when one exists,
  or FULL otherwise, then audit again to verify. Tables already on FULL that could use an
  index are reported.

inputs:
  - id: jdbc_url
    type: STRING
    displayName: JDBC URL
    defaults: "jdbc:postgresql://localhost:5432/app"

  - id: allow_full
    type: BOOL
    displayName: Allow REPLICA IDENTITY FULL as a fix
    description: When a table has no unique not-null index, FULL logs the whole old row on every UPDATE and DELETE. Set false to only report those tables.
    defaults: true

  - id: auto_remediate
    type: BOOL
    displayName: Auto remediate
    defaults: false

  - id: dry_run
    type: BOOL
    displayName: Dry run
    description: Must be false, together with auto_remediate, for ALTER TABLE to run.
    defaults: true

variables:
  audit_sql: |
    WITH pub AS (
      SELECT c.oid, string_agg(DISTINCT p.pubname, ', ' ORDER BY p.pubname) AS publications,
             bool_or(p.pubupdate) AS pub_update, bool_or(p.pubdelete) AS pub_delete
        FROM pg_publication p
        JOIN pg_publication_tables pt ON pt.pubname = p.pubname
        JOIN pg_class c ON c.relname = pt.tablename
        JOIN pg_namespace n ON n.oid = c.relnamespace AND n.nspname = pt.schemaname
       GROUP BY c.oid
    ), cand AS (
      SELECT DISTINCT ON (i.indrelid) i.indrelid, i.indexrelid
        FROM pg_index i
       WHERE i.indisunique AND i.indisvalid AND i.indimmediate AND i.indpred IS NULL AND i.indexprs IS NULL
         AND NOT EXISTS (SELECT 1 FROM unnest(i.indkey::int2[]) k(attnum)
                          JOIN pg_attribute a ON a.attrelid = i.indrelid AND a.attnum = k.attnum WHERE NOT a.attnotnull)
       ORDER BY i.indrelid, i.indisprimary DESC, array_length(i.indkey::int2[], 1), i.indexrelid
    )
    SELECT c.oid::regclass::text AS table_name, pub.publications,
           CASE c.relreplident WHEN 'd' THEN 'DEFAULT' WHEN 'n' THEN 'NOTHING' WHEN 'f' THEN 'FULL' WHEN 'i' THEN 'INDEX' END AS replica_identity,
           cand.indexrelid::regclass::text AS candidate_index,
           greatest(c.reltuples, 0)::bigint AS rows,
           CASE WHEN c.relreplident = 'f' THEN 'FULL_WITH_KEY' ELSE 'NO_REPLICA_IDENTITY' END AS finding,
           CASE WHEN c.relreplident = 'f' THEN 'MEDIUM' ELSE 'HIGH' END AS severity,
           CASE WHEN c.relreplident = 'f' THEN NULL
                WHEN cand.indexrelid IS NOT NULL THEN format('ALTER TABLE %s REPLICA IDENTITY USING INDEX %I', c.oid::regclass, (SELECT relname FROM pg_class WHERE oid = cand.indexrelid))
                WHEN {{ inputs.allow_full }} THEN format('ALTER TABLE %s REPLICA IDENTITY FULL', c.oid::regclass) END AS fix_sql
      FROM pub
      JOIN pg_class c ON c.oid = pub.oid
      LEFT JOIN cand ON cand.indrelid = c.oid
     WHERE (pub.pub_update OR pub.pub_delete)
       AND ((c.relreplident = 'd' AND NOT EXISTS (SELECT 1 FROM pg_index pk WHERE pk.indrelid = c.oid AND pk.indisprimary))
            OR c.relreplident = 'n'
            OR (c.relreplident = 'f' AND cand.indexrelid IS NOT NULL))
     ORDER BY severity, table_name

tasks:
  - id: audit
    type: io.kestra.plugin.jdbc.postgresql.Query
    description: Read-only. Statements are built with regclass and format('%I').
    url: "{{ inputs.jdbc_url }}"
    username: "{{ secret('POSTGRES_USERNAME') }}"
    password: "{{ secret('POSTGRES_PASSWORD') }}"
    fetchType: FETCH
    sql: "{{ render(vars.audit_sql) }}"

  - id: summary
    type: io.kestra.plugin.core.log.Log
    message: >-
      Replica identity audit on {{ inputs.jdbc_url }}: {{ outputs.audit.size }} findings.
      {% for r in outputs.audit.rows %}{{ r.severity }} {{ r.finding }} {{ r.table_name }} in {{ r.publications }}, identity {{ r.replica_identity }}, {{ r.rows }} rows, fix: {{ r.fix_sql ?? 'report only' }}. {% endfor %}

  - id: route
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.audit.size > 0 }}"
    then:
      - id: alert
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {{ {'text': 'PostgreSQL ' ~ inputs.jdbc_url ~ ': ' ~ (outputs.audit.rows | jq('map(select(.severity == "HIGH")) | length') | first) ~ ' published tables reject every UPDATE and DELETE (no replica identity): ' ~ (outputs.audit.rows | jq('map("\(.severity) \(.table_name) (\(.publications))") | join(", ")') | first) ~ '.' ~ (inputs.auto_remediate and not inputs.dry_run ? ' Setting replica identity now.' : ' No change applied (auto_remediate=' ~ inputs.auto_remediate ~ ', dry_run=' ~ inputs.dry_run ~ ').')} | toJson }}

      - id: remediate_gate
        type: io.kestra.plugin.core.flow.If
        condition: "{{ inputs.auto_remediate and not inputs.dry_run and outputs.audit.rows | jq('map(select(.fix_sql != null)) | length') | first > 0 }}"
        then:
          - id: remediate
            type: io.kestra.plugin.core.flow.Loop
            concurrencyLimit: 1
            values: "{{ outputs.audit.rows | jq('map(select(.fix_sql != null) | .fix_sql)') | first | toJson }}"
            tasks:
              - id: fix
                type: io.kestra.plugin.jdbc.postgresql.Query
                allowFailure: true
                url: "{{ inputs.jdbc_url }}"
                username: "{{ secret('POSTGRES_USERNAME') }}"
                password: "{{ secret('POSTGRES_PASSWORD') }}"
                fetchType: NONE
                sql: "{{ item.value }}"

          - id: reaudit
            type: io.kestra.plugin.jdbc.postgresql.Query
            url: "{{ inputs.jdbc_url }}"
            username: "{{ secret('POSTGRES_USERNAME') }}"
            password: "{{ secret('POSTGRES_PASSWORD') }}"
            fetchType: FETCH
            sql: "{{ render(vars.audit_sql) }}"

          - id: verify_result
            type: io.kestra.plugin.core.flow.If
            condition: >-
              {{ {'b': outputs.audit.rows, 'a': outputs.reaudit.rows ?? []} | jq('([.a[] | select(.finding == "NO_REPLICA_IDENTITY") | .table_name]) as $a
                 | [.b[] | select(.fix_sql != null) | .table_name | select(. as $x | $a | index($x))] | length') | first > 0 }}
            then:
              - id: remediation_failed
                type: io.kestra.plugin.core.execution.Fail
                errorMessage: "Some published tables still have no replica identity: {{ outputs.reaudit.rows | jq('map(select(.finding == \"NO_REPLICA_IDENTITY\") | .table_name) | join(\", \")') | first }}. The connecting role must own them."
            else:
              - id: remediated
                type: io.kestra.plugin.core.log.Log
                message: >-
                  Fixed and verified: {{ outputs.audit.rows | jq('map(select(.fix_sql != null) | .fix_sql) | join("; ")') | first }}.
                  Left for review: {{ outputs.reaudit.rows | jq('if length == 0 then "none" else map("\(.finding) \(.table_name)") | join(", ") end') | first }}.
    else:
      - id: clean
        type: io.kestra.plugin.core.log.Log
        message: "Every published table has a usable replica identity."

errors:
  - id: alert_flow_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {{ {'text': 'PostgreSQL replica identity guard failed on ' ~ inputs.jdbc_url ~ ' (execution ' ~ execution.id ~ '). Check the logs.'} | toJson }}

triggers:
  - id: hourly
    type: io.kestra.plugin.core.trigger.Schedule
    description: Shipped disabled, and always in safe mode.
    cron: "10 * * * *"
    disabled: true
    inputs:
      auto_remediate: false
      dry_run: true

extend:
  title: PostgreSQL Publication Replica Identity Guard
  shortDescription: Find tables in a PostgreSQL logical replication publication that reject UPDATE and DELETE for lack of a replica identity, alert Slack, and optionally set REPLICA IDENTITY USING INDEX or FULL and verify.
  metaTitle: PostgreSQL Publication Replica Identity Guard with Kestra
  metaDescription: Find published PostgreSQL tables with no replica identity, which reject UPDATE and DELETE, alert Slack, set USING INDEX or FULL and verify.
  description: |
    Adding a table to a logical replication publication, for CDC with Debezium, a read replica or a migration, has a sharp edge. If the publication publishes updates or deletes and the table has no primary key, every `UPDATE` and `DELETE` on it starts failing. PostgreSQL raises `cannot update table because it does not have a replica identity and publishes updates`. It is the application that breaks, not the replication, and usually right after someone ran `CREATE PUBLICATION ... FOR ALL TABLES`.

    This blueprint finds the published tables that are in that state, or about to be. It alerts Slack, and can set the right replica identity:
    - `USING INDEX` on a unique index whose columns are all `NOT NULL`, when one exists;
    - `FULL` otherwise.

    A second audit verifies the result.

    This blueprint was created by [zkasuran](https://github.com/zkasuran).

    ## Findings

    | Finding | Severity | Rule | Fix |
    |---|---|---|---|
    | `NO_REPLICA_IDENTITY` | High | In a publication that publishes `UPDATE` or `DELETE`, with no primary key and identity `DEFAULT`, or identity `NOTHING` | `REPLICA IDENTITY USING INDEX` on the best unique not-null index, else `FULL` (if `allow_full`) |
    | `FULL_WITH_KEY` | Medium | Identity `FULL`, although a unique not-null index exists | Report only: `USING INDEX` would write much less WAL |

    Tables in insert-only publications are never flagged: they are not affected.

    ## How it works

    1. `audit` (`io.kestra.plugin.jdbc.postgresql.Query`, read-only) joins `pg_publication`, `pg_publication_tables` and `pg_class`, and looks for a candidate index:
       - unique, valid, immediate, not partial, no expressions;
       - all its columns `NOT NULL`.

       It returns each finding with its fix, built with `regclass` and `format('%I')`.
    2. `summary` logs every finding with its publications, current identity and row count.
    3. `route` (`io.kestra.plugin.core.flow.If`):
       - **clean:** logs it.
       - **findings:** `alert` posts to Slack.
         - `remediate_gate` runs only when `auto_remediate` is true and `dry_run` is false.
         - `remediate` (`io.kestra.plugin.core.flow.Loop`) runs each `ALTER TABLE ... REPLICA IDENTITY` in its own task.
         - `reaudit` and `verify_result` fail if a fixed table still has no replica identity.
    4. `errors` alerts Slack when the audit cannot run.

    ## What you get

    - Early warning, before or right after a publication change, of every table whose writes will fail.
    - The lightest fix available per table: an existing unique index first, `FULL` only as a fallback.
    - A second audit as proof, and a report of tables paying for `FULL` when they do not need to.

    ## Who it's for

    - Teams running Debezium or other CDC tools on PostgreSQL.
    - Teams using logical replication for read replicas, zero-downtime upgrades or migrations.
    - Teams evaluating the PostgreSQL plugin who want an example of catalog queries driving `ALTER TABLE`.

    ## Why orchestrate this with Kestra

    The failure shows up as application errors, not as a replication alert. Kestra checks the publications every hour or after each schema change, and turns findings into a Slack alert naming the tables and publications. It applies the fix only behind `auto_remediate` and `dry_run`, verifies it, and keeps a history of every identity change.

    ## Tested end to end

    On Kestra 2.0.5 OSS against PostgreSQL 16, with a local HTTP sink standing in for Slack. The publication `cdc_pub` holds:
    - `cdc_events` (50,000 rows, no key at all);
    - `cdc_tags` (20,000 rows, no primary key but a unique index on two `NOT NULL` columns);
    - `cdc_users` (primary key);
    - `cdc_ledger` (`FULL`, with a unique not-null index).

    An insert-only publication holds `cdc_audit`, with no key.

    Before the fix, `UPDATE cdc_events` and `DELETE FROM cdc_tags` failed with the replica identity error.

    | Run | Inputs | Result |
    |---|---|---|
    | 1 | defaults | 2 high findings: `cdc_events` with fix `FULL`, `cdc_tags` with fix `USING INDEX cdc_tags_uq`. `cdc_ledger` medium. `cdc_users` and `cdc_audit` not flagged. Alert sent |
    | 2 | `auto_remediate: true`, `dry_run: true` | Same report, nothing changed |
    | 3 | `auto_remediate: true`, `dry_run: false` | Both fixes applied and verified. `pg_class.relreplident` shows `f` and `i`, and the same `UPDATE` and `DELETE` now succeed |
    | 4 | defaults | Only the `FULL_WITH_KEY` report left |
    | 5 | `cdc_ledger` switched to `USING INDEX` by hand | Clean |
    | 6 | unreachable database | `errors` alert sent |

    ## Prerequisites

    - For the audit, any role can read the catalog. For remediation, the owner of the tables. `ALTER TABLE ... REPLICA IDENTITY` takes a brief lock.
    - Local testing:
      - `docker run -d --name pg -p 5432:5432 -e POSTGRES_PASSWORD=pg postgres:16`;
      - create a table with no primary key, then `CREATE PUBLICATION p FOR TABLE t` and try an `UPDATE`.

    ### Secrets

    - `POSTGRES_USERNAME` / `POSTGRES_PASSWORD`: credentials used by every query.
    - `SLACK_WEBHOOK_URL`: used by `alert` and the `errors` block.
    - In Kestra OSS, provide each one as a base64-encoded environment variable prefixed `SECRET_`.

    ### Inputs

    | Input | Default | Purpose |
    |---|---|---|
    | `jdbc_url` | `jdbc:postgresql://localhost:5432/app` | Database |
    | `allow_full` | `true` | Use `FULL` when no index fits |
    | `auto_remediate` | `false` | Allow `ALTER TABLE` |
    | `dry_run` | `true` | Must be `false` for a statement to run |

    ## Quick start

    1. Add the `POSTGRES_USERNAME`, `POSTGRES_PASSWORD` and `SLACK_WEBHOOK_URL` secrets.
    2. Import the flow and set `jdbc_url`.
    3. Run it once and read the findings.
    4. Run it with `auto_remediate: true` and `dry_run: false`.
    5. Enable the `hourly` trigger, which always runs in safe mode, or call the flow after each migration.

    ## How to extend

    - Run the flow before `ALTER PUBLICATION ... ADD TABLE` in your migration pipeline, and stop the pipeline on a finding.
    - Add a primary key instead of `FULL` when a column is unique in practice, after a duplicate check.
    - Loop over a list of JDBC URLs to check every publisher.
    - Report the WAL volume of `FULL` tables from `pg_stat_replication_slots`.

    ## Links

    - Logical replication publications: https://www.postgresql.org/docs/current/logical-replication-publication.html
    - PostgreSQL plugin: https://kestra.io/plugins/plugin-jdbc-postgres
  tags:
    - Data
    - Infrastructure
  subTags:
    - Day 2 Operations
    - Monitoring & Alerting
  ee: false
  demo: false
