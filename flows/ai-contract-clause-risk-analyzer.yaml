id: ai-contract-clause-risk-analyzer
namespace: company.legal

description: |
  Automates legal risk analysis across enterprise vendor agreements and SaaS master services agreements (MSAs),
  using Google Gemini to extract high-risk clauses such as uncapped liability, broad indemnification,
  and harsh SLA penalties, enforcing Slack review gates.

triggers:
  - id: scheduled_sweep
    type: io.kestra.plugin.core.trigger.Schedule
    description: Weekly intake sweep for pending procurement contracts. Shipped disabled by default.
    cron: "0 8 * * 1"
    disabled: true

  - id: webhook_contract_submitted
    type: io.kestra.plugin.core.trigger.Webhook
    description: Authenticated webhook for legal contract management systems (Ironclad, DocuSign, CobbleStone).
    key: "{{ secret('WEBHOOK_KEY') }}"

inputs:
  - id: contract_id
    type: STRING
    defaults: CTR-2026-8821
    description: Unique legal agreement tracking identifier.

  - id: vendor_name
    type: STRING
    defaults: Apex Infrastructure Solutions LLC
    description: Name of the counterparty or vendor entity.

  - id: contract_text
    type: STRING
    defaults: |
      SECTION 8: LIMITATION OF LIABILITY
      Except for breaches of confidentiality or gross negligence, neither party's liability under this Agreement shall exceed twelve (12) months of fees paid. Notwithstanding the foregoing, Customer's indemnity obligations under Section 9 shall be uncapped and without limitation.

      SECTION 9: INDEMNIFICATION
      Customer shall defend, indemnify, and hold harmless Vendor against any third-party claims, damages, liabilities, and legal expenses arising out of Customer's use of the Hosted Platform, including any indirect, incidental, or consequential damages claimed by third parties.

      SECTION 12: TERM AND RENEWAL
      This Agreement shall automatically renew for successive three (3) year periods unless either party provides written notice of non-renewal at least ninety (90) days prior to the expiration of the initial term. Early termination shall incur an immediate acceleration of all remaining fees through the term.
    description: Raw legal contract text or clause excerpts under review.

tasks:
  - id: audit_contract_clauses
    type: io.kestra.plugin.ai.agent.AIAgent
    description: Uses Gemini 2.5 Flash to inspect contractual language for uncapped liability, asymmetric indemnification, and restrictive renewal terms.
    provider:
      type: io.kestra.plugin.ai.provider.GoogleGemini
      apiKey: "{{ secret('GEMINI_API_KEY') }}"
      modelName: gemini-2.5-flash
    configuration:
      temperature: 0.1
      maxToken: 4096
      responseFormat:
        type: JSON
        jsonSchema:
          type: object
          required:
            - contract_id
            - vendor_name
            - risk_tier
            - liability_capped
            - uncapped_indemnity_detected
            - auto_renewal_lockin_detected
            - high_risk_clauses
            - counsel_summary
          properties:
            contract_id:
              type: string
            vendor_name:
              type: string
            risk_tier:
              type: string
              enum:
                - HIGH
                - MEDIUM
                - LOW
            liability_capped:
              type: boolean
            uncapped_indemnity_detected:
              type: boolean
            auto_renewal_lockin_detected:
              type: boolean
            high_risk_clauses:
              type: array
              items:
                type: object
                required:
                  - clause_name
                  - excerpt
                  - risk_explanation
                  - fallback_recommendation
                properties:
                  clause_name:
                    type: string
                  excerpt:
                    type: string
                  risk_explanation:
                    type: string
                  fallback_recommendation:
                    type: string
            counsel_summary:
              type: string
    prompt: |
      You are an expert Senior Commercial Technology Counsel reviewing an enterprise vendor agreement.
      Analyze the contract text below for commercial hazards, asymmetric liabilities, and aggressive terms:

      Contract ID: {{ inputs.contract_id }}
      Vendor: {{ inputs.vendor_name }}

      Agreement Text:
      \"\"\"
      {{ inputs.contract_text }}
      \"\"\"

      Audit Checklist:
      1. Limitation of Liability: Is liability mutual and capped, or are there asymmetric carved-out indemnities?
      2. Indemnification: Does the customer accept broad or uncapped indemnification for indirect/consequential damages?
      3. Term & Auto-Renewal: Are there multi-year automatic renewals with strict advance notice windows (>=60 days) or early termination fee acceleration?
      4. Assign an objective risk_tier:
         - HIGH: Uncapped customer indemnity, asymmetric liability carve-outs, or multi-year fee acceleration.
         - MEDIUM: Ambiguous renewal windows or non-standard governing law.
         - LOW: Standard mutual liability caps, balanced indemnification, and flexible termination.

  - id: render_legal_risk_brief
    type: io.kestra.plugin.scripts.python.Script
    description: Formats structured contract risk metrics into an executive legal assessment brief stored in execution artifacts.
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    script: |
      import json

      raw_response = """{{ outputs.audit_contract_clauses.text }}"""
      data = json.loads(raw_response, strict=False)

      cid = data.get("contract_id", "{{ inputs.contract_id }}")
      vendor = data.get("vendor_name", "{{ inputs.vendor_name }}")
      tier = data.get("risk_tier", "HIGH")
      capped = "YES" if data.get("liability_capped") else "NO (ASYMMETRIC)"
      indemnity = "FLAGGED (UNCAPPED)" if data.get("uncapped_indemnity_detected") else "Standard"
      renewal = "FLAGGED (AUTO-LOCKIN)" if data.get("auto_renewal_lockin_detected") else "Standard"
      summary = data.get("counsel_summary", "")

      clauses_md = []
      for c in data.get("high_risk_clauses", []):
          clauses_md.append(f"""### {c.get('clause_name')}
          - **Language**: *\"{c.get('excerpt')}\"*
          - **Legal Risk**: {c.get('risk_explanation')}
          - **Recommended Redline**: {c.get('fallback_recommendation')}
          """)

      clauses_section = "\n".join(clauses_md) or "No high-risk clauses identified."

      markdown = f"""# CONTRACT CLAUSE LEGAL RISK ASSESSMENT
      ## Executive Summary
      - **Contract ID**: `{cid}`
      - **Counterparty**: **{vendor}**
      - **Overall Risk Classification**: **{tier}**
      - **Liability Capped**: {capped}
      - **Indemnity Exposure**: {indemnity}
      - **Renewal Lock-in**: {renewal}

      ### Legal Counsel Assessment
      {summary}

      ## High-Risk Clause Analysis & Redline Guidance
      {clauses_section}
      """

      with open("contract-risk-assessment.md", "w") as f:
          f.write(markdown)
      print("Generated contract-risk-assessment.md")
    outputFiles:
      - contract-risk-assessment.md

  - id: legal_signoff_gate
    type: io.kestra.plugin.core.flow.If
    description: Routes contracts with high-risk clauses directly to general counsel review channels in Slack.
    condition: "{{ json(outputs.audit_contract_clauses.text).risk_tier == 'HIGH' }}"
    then:
      - id: alert_general_counsel
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Alerts general counsel channel with contract risk breakdown and redline guidance.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#legal-contract-review",
            "text": "🚨 *High-Risk Contract Trapped at Gate*: `{{ inputs.contract_id }}` ({{ inputs.vendor_name }})\n*Risk Tier*: *HIGH*\n*Uncapped Indemnity*: {{ json(outputs.audit_contract_clauses.text).uncapped_indemnity_detected }}\n*Renewal Lock-in*: {{ json(outputs.audit_contract_clauses.text).auto_renewal_lockin_detected }}\n*Counsel Summary*: {{ json(outputs.audit_contract_clauses.text).counsel_summary }}\nRedline brief generated in Kestra storage."
          }
    else:
      - id: notify_procurement_standard
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches standard approval notice to procurement operations channel.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#procurement-feed",
            "text": "✅ *Contract Passed Routine Review*: `{{ inputs.contract_id }}` ({{ inputs.vendor_name }}). Risk tier: {{ json(outputs.audit_contract_clauses.text).risk_tier }}. Standard legal terms confirmed."
          }

errors:
  - id: alert_on_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alerts on-call engineering channel if contract analysis encounters an unhandled error.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "#legalops-alerts",
        "text": "⚠️ *Pipeline Error*: Contract risk analyzer `{{ flow.id }}` failed on execution `{{ execution.id }}`."
      }

extend:
  title: AI Contract Clause Risk Analyzer and Legal Sign-Off Gate
  shortDescription: Audits vendor MSAs and contracts for uncapped liability, harsh SLAs, and auto-renewal traps using Gemini.
  metaTitle: AI Contract Clause Risk Analyzer | Kestra
  metaDescription: Audit enterprise vendor contracts and MSAs with Gemini AI. Extract uncapped liability, indemnity risks, and SLA traps with automated Slack escalation.
  description: |
    Enterprise procurement and vendor onboarding processes involve reviewing dozens of Master Services Agreements (MSAs), Statements of Work (SOWs), and Service Level Agreements (SLAs) each month. When legal teams face heavy backlogs, subtle contractual traps slip through: asymmetric liability carve-outs, uncapped indemnities for indirect damages, or aggressive multi-year auto-renewals with fee acceleration clauses.

    Missing these clauses during initial contracting exposes organizations to unlimited financial exposure during service disputes or data breaches.

    This blueprint automates contractual risk triage. When an agreement is uploaded or submitted via webhook from a contract lifecycle management (CLM) tool, an AI agent powered by Google Gemini analyzes the text against institutional risk checklists. The model determines whether liability is mutually capped, flags broad indemnification clauses, detects restrictive renewal terms, and categorizes overall risk. High-risk agreements immediately generate a detailed `contract-risk-assessment.md` redline brief and alert in-house counsel in Slack.

    ## How it works

    1. `audit_contract_clauses` (`ai.agent.AIAgent`): Ingests the raw contract clauses, using `gemini-2.5-flash` with a strict JSON schema to evaluate liability caps, indemnity scopes, and auto-renewal lock-ins, returning specific excerpts and recommended redline fallbacks.
    2. `render_legal_risk_brief` (`scripts.python.Script`): Transforms the structured analysis into an executive `contract-risk-assessment.md` brief containing clause-by-clause commentary and negotiation guidance.
    3. `legal_signoff_gate` (`core.flow.If`):
       - **High Risk:** Delivers an urgent alert card to `#legal-contract-review` in Slack with specific risk highlights for attorney review.
       - **Low / Medium Risk:** Routes the agreement to `#procurement-feed` for routine signature processing.
    4. `alert_on_failure` (`errors` block): Catches unexpected script execution errors and alerts the legal operations team.
    5. Triggers: Weekly pending contract sweep schedule (`disabled: true` by default) plus an authenticated `Webhook` trigger for CLM platforms (Ironclad, DocuSign, CobbleStone).

    ## What you get

    - Automated detection of asymmetric liabilities, uncapped indemnities, and termination traps.
    - Standardized redline guidance ready for commercial contract negotiations.
    - Zero human triage overhead for low-risk standard vendor terms.

    ## Who it's for

    - In-House Legal Counsel, Corporate Attorneys, and Legal Operations managers.
    - Procurement, Vendor Management, and Strategic Sourcing teams.
    - Finance and Risk Management executives evaluating commercial liabilities.

    ## Why orchestrate this with Kestra

    Hardcoding legal analysis inside ad-hoc scripts or disconnected bot webhooks creates data security risks and provides no execution lineage. Kestra provides declarative DAG orchestration, secure secret storage, persistent execution artifacts, and automated Slack review gates.

    ## Prerequisites

    - Google Gemini API key with access to `gemini-2.5-flash`.
    - Slack incoming webhook endpoint for legal alerts.

    ### Secrets

    - `GEMINI_API_KEY`: API key for Google Gemini model inference.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL for legal review channels.
    - `WEBHOOK_KEY`: Authentication secret for event-driven webhook invocation.

    ## Quick start

    1. Set `GEMINI_API_KEY`, `SLACK_WEBHOOK_URL`, and `WEBHOOK_KEY` in your Kestra namespace secrets.
    2. Click **Execute** in the Kestra UI to run the blueprint against the sample uncapped indemnity clause.
    3. Download `contract-risk-assessment.md` from the Outputs tab and review the Slack card.

    ## How to extend

    - Connect document parsing tasks (such as Apache Tika or AWS Textract) upstream to parse PDF and DOCX agreements directly from cloud buckets.
    - Connect `io.kestra.plugin.core.http.Request` tasks inside `legal_signoff_gate` to update contract status in Ironclad or Salesforce CPQ.

    ## Links

    - [Kestra AI Plugin](https://kestra.io/plugins/plugin-ai)
    - [Kestra Slack Plugin](https://kestra.io/plugins/plugin-slack)
    - [Kestra Python Script Plugin](https://kestra.io/plugins/plugin-scripts/python)
    - This blueprint has been created by [sheikhlimon](https://github.com/sheikhlimon)
  tags:
    - AI
    - Business
    - Core
  subTags:
    - Classification & Moderation
    - Approval Gates
  ee: false
  demo: false
