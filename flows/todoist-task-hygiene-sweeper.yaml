id: todoist-task-hygiene-sweeper
namespace: company.team
description: |
  Declare bankruptcy on the guilt list, under supervision. A monthly
  sweep finds Todoist tasks created more than 90 days ago and deletes
  them, but only when a human sets the confirm input to true. Slack
  gets the audit count either way.

inputs:
  - id: confirm
    type: BOOL
    defaults: false
    description: Set to true to allow the sweep to delete the matched tasks. When false the execution fails before anything is listed or deleted.

tasks:
  - id: require_confirmation
    type: io.kestra.plugin.core.flow.If
    description: Refuse to run destructively unless a human explicitly confirmed the sweep.
    condition: "{{ inputs.confirm == false }}"
    then:
      - id: refuse
        type: io.kestra.plugin.core.execution.Fail
        description: Fail fast with a clear message demanding explicit confirmation.
        errorMessage: Task hygiene sweep requires confirm=true. Re-run the execution with the confirm input set to true to delete tasks created more than 90 days ago.

  - id: list_stale
    type: io.kestra.plugin.todoist.ListTasks
    description: Fetch every task created more than 90 days ago using a Todoist filter query.
    apiToken: "{{ secret('TODOIST_API_TOKEN') }}"
    filter: "created before: -90 days"
    fetchType: FETCH

  - id: delete_each
    type: io.kestra.plugin.core.flow.ForEach
    description: Iterate over the stale tasks and delete each one individually.
    values: "{{ outputs.list_stale.rows }}"
    tasks:
      - id: delete_task
        type: io.kestra.plugin.todoist.DeleteTask
        description: Permanently delete one stale task by id.
        apiToken: "{{ secret('TODOIST_API_TOKEN') }}"
        taskId: "{{ fromJson(taskrun.value).id }}"

  - id: audit
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Post the audit count to Slack so every sweep leaves a visible record of how much was removed.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "Todoist hygiene sweep completed: {{ outputs.list_stale.size }} tasks created more than 90 days ago were deleted (execution {{ execution.id }})."
      }

errors:
  - id: alert_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Report failures, including the intentional refusal when confirm is false, so an unconfirmed or broken sweep is always visible.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "Todoist hygiene sweep did not complete in flow {{ flow.id }} (execution {{ execution.id }}). Either confirmation was missing (confirm=false) or a task failed; check the execution logs."
      }

triggers:
  - id: monthly
    type: io.kestra.plugin.core.trigger.Schedule
    description: Propose the sweep on the first of every month. With the default confirm=false the scheduled run fails at the guard, acting as a monthly reminder until a human re-runs it with confirm=true.
    cron: "0 9 1 * *"
    disabled: true

extend:
  title: Supervised Deletion of Stale Todoist Tasks Older Than 90 Days
  shortDescription: A monthly sweep lists Todoist tasks created over 90 days ago and deletes them, gated by an explicit confirm input and audited to Slack.
  metaTitle: Todoist Stale Task Cleanup with Kestra
  metaDescription: Delete stale Todoist tasks older than 90 days with Kestra. A confirm input gates the sweep, ForEach deletes each task, and Slack gets the audit count.
  description: |
    Every task list accumulates a guilt layer: items created a quarter ago that will never be done and only add noise. This blueprint performs list bankruptcy as a supervised, audited flow. A Todoist filter query matches tasks created more than 90 days ago, a `ForEach` deletes each one through `io.kestra.plugin.todoist.DeleteTask`, and the whole thing is gated by a boolean `confirm` input: when it is false, the flow fails immediately with a message demanding explicit confirmation, and nothing is listed or deleted.

    ## How it works

    1. `require_confirmation` (`io.kestra.plugin.core.flow.If`) checks the `confirm` input. When it is false, the nested `io.kestra.plugin.core.execution.Fail` task stops the execution with an instructive error before any Todoist call is made.
    2. `list_stale` (`io.kestra.plugin.todoist.ListTasks`) runs the Todoist filter query `created before: -90 days` with `fetchType: FETCH`. The matches are exposed as `{{ outputs.list_stale.rows }}` and the count as `{{ outputs.list_stale.size }}`. Adjust the window by editing the filter string.
    3. `delete_each` (`io.kestra.plugin.core.flow.ForEach`) iterates over the rows, and `delete_task` removes each task by `fromJson(taskrun.value).id`. Deletion is permanent, which is exactly why the guard exists.
    4. `audit` posts the deleted count to Slack, and the `errors` block reports both real failures and the intentional refusal when confirmation is missing.
    5. A disabled-by-default monthly `Schedule` runs on the first of the month. With the default `confirm: false` it fails at the guard on purpose, turning the schedule into a monthly reminder that a human must re-run with `confirm: true`.

    ## What you get

    - A destructive operation that is impossible to run by accident: no confirmation, no deletion, no API calls.
    - A Todoist-native definition of stale through the `created before:` filter, tunable to any window.
    - Per-task deletions inside the ForEach, so one failing delete does not hide how far the sweep got.
    - A Slack audit line for every sweep, building a paper trail of what was removed and when.

    ## Who it's for

    - Long-time Todoist users whose list has become an archive of good intentions.
    - Ops teams enforcing a retention policy on shared task projects.
    - Anyone who wants periodic cleanup with a human sign-off rather than a silent cron job.

    ## Why orchestrate this with Kestra

    A cleanup script with a delete loop is one typo away from disaster and leaves no trace. Kestra adds the guard rail as a first-class flow structure, records every execution including refused ones, isolates each deletion, and posts an audit trail to Slack, all without writing a line of imperative code.

    ## Prerequisites

    - A Todoist account and a personal API token.
    - A Slack incoming webhook for audit messages and failure alerts.
    - The `created before: -90 days` filter uses Todoist's filter query syntax; verify it returns what you expect in the Todoist app before enabling deletions.

    ### Secrets

    - `TODOIST_API_TOKEN`: Todoist personal API token.
    - `SLACK_WEBHOOK_URL`: Slack incoming webhook URL.

    ## Quick start

    1. Add the two secrets to your Kestra namespace.
    2. Test the filter `created before: -90 days` in Todoist to preview exactly what would be deleted.
    3. Execute the flow with `confirm: false` and watch it refuse, then re-run with `confirm: true` on a test account or narrow project.
    4. Check the Slack audit count, then set `disabled: false` on the `monthly` trigger if you want the monthly reminder behavior.

    ## How to extend

    - Scope the sweep to one project by adding `projectId` to `list_stale`, a safer default for a first rollout.
    - Soften the bankruptcy: swap DeleteTask for `io.kestra.plugin.todoist.UpdateTask` and demote instead of delete.
    - Export `{{ outputs.list_stale.rows }}` to storage before deleting, creating a recoverable archive of what was swept.
    - Tighten or loosen the staleness window by editing the number of days in the filter.

    ## Links

    - [Todoist plugin documentation](https://kestra.io/plugins/plugin-todoist)
    - [Todoist filter query documentation](https://todoist.com/help/articles/introduction-to-filters-V98wIH)
  tags:
    - Business
  subTags:
    - Policy & Compliance
    - Scheduling
  ee: false
  demo: false
