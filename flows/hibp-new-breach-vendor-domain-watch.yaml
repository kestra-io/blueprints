id: hibp-new-breach-vendor-domain-watch
namespace: company.team

description: |
  Watch Have I Been Pwned for data breaches at your vendors and SaaS providers. One keyless
  request downloads the full HIBP breach catalogue, DuckDB matches each breach's domain (and its
  subdomains) against your vendor domain list, rates the exposed data classes, and a KV memory
  makes sure each breach alerts once, plus once more if HIBP later adds data classes or accounts
  to it. Alerts go to Slack with the account count, the data exposed and a link to the breach page.

inputs:
  - id: vendor_domains
    type: ARRAY
    itemType: STRING
    defaults:
      - crunchbase.com
      - cyrusone.com
      - mckesson.com
      - linkedin.com
      - adobe.com
      - trello.com
      - paytm.com
      - stripe.com
      - okta.com
    description: Registered domains of your vendors. `https://www.vendor.com/login` is reduced to `vendor.com`, and a breach on `shop.vendor.com` matches `vendor.com`. The defaults include three vendors breached in the last six weeks, historical breaches, a fabricated one and clean domains.

  - id: lookback_days
    type: INT
    defaults: 45
    description: A breach not seen before alerts only if HIBP added it within this many days. Older breaches (first run, or a vendor added to the list later) are recorded as HISTORICAL without an alert.

triggers:
  - id: daily_check
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 7 * * *"
    description: HIBP loads a few breaches a week and caches the list for five minutes; once a day is enough.

tasks:
  - id: fetch_breaches
    type: io.kestra.plugin.core.http.Download
    description: The whole breach catalogue (about 1,000 breaches, 1 MB) in one request. No API key is needed for this endpoint, but HIBP requires a User-Agent.
    uri: https://haveibeenpwned.com/api/v3/breaches
    headers:
      User-Agent: "kestra-hibp-vendor-breach-watch/1.0 (https://kestra.io)"
      Accept: application/json

  - id: previous_state
    type: io.kestra.plugin.core.kv.Get
    key: hibp_vendor_breaches_seen
    errorOnMissing: false
    description: JSON array of the matched breaches already reported, with ModifiedDate, PwnCount and data classes. Missing on the first run.

  - id: match
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: |
      Normalises and validates the vendor list, matches breaches on exact domain or subdomain,
      rates severity from the data classes, labels HIBP flags (unverified, fabricated, spam list,
      stealer log, malware, retired) and compares with the KV state. Fabricated breaches never alert.
      An UPDATED alert needs a changed ModifiedDate and new data classes or a new account count,
      because HIBP also bumps ModifiedDate for description edits.
    url: "jdbc:duckdb:"
    fetchType: FETCH_ONE
    inputFiles:
      breaches.json: "{{ outputs.fetch_breaches.uri }}"
      seen.json: "{{ outputs.previous_state.value ?? '[]' }}"
    outputFiles:
      - matches_csv
    parameters:
      watchlist: "{{ inputs.vendor_domains | join(',') }}"
      lookback: "{{ inputs.lookback_days }}"
    sql: |
      SET TimeZone = 'UTC';

      CREATE TABLE watch AS
      SELECT domain, string_agg(DISTINCT raw, ' | ') AS raw,
             regexp_full_match(domain, '([a-z0-9]([a-z0-9-]*[a-z0-9])?[.])+[a-z]{2,63}') AS valid
      FROM (SELECT trim(d) AS raw,
                   regexp_replace(regexp_replace(regexp_replace(lower(trim(d)), '^[a-z]+://', ''), '[/#].*$', ''), '^www[.]', '') AS domain
            FROM unnest(string_split(CAST(:watchlist AS VARCHAR), ',')) AS t(d)
            WHERE trim(d) <> '')
      GROUP BY domain;

      CREATE TABLE breaches AS
      SELECT Name AS name, Title AS title, lower(Domain) AS domain,
             CAST(BreachDate AS VARCHAR) AS breach_date,
             CAST(AddedDate AS TIMESTAMP) AS added_at,
             CAST(ModifiedDate AS VARCHAR) AS modified,
             CAST(PwnCount AS BIGINT) AS pwn,
             CAST(DataClasses AS VARCHAR[]) AS classes,
             concat_ws(', ',
               CASE WHEN NOT coalesce(IsVerified, true) THEN 'unverified' END,
               CASE WHEN coalesce(IsFabricated, false) THEN 'fabricated' END,
               CASE WHEN coalesce(IsSpamList, false) THEN 'spam list' END,
               CASE WHEN coalesce(IsStealerLog, false) THEN 'stealer log' END,
               CASE WHEN coalesce(IsMalware, false) THEN 'malware' END,
               CASE WHEN coalesce(IsRetired, false) THEN 'retired' END) AS flags,
             coalesce(IsFabricated, false) AS fabricated
      FROM read_json('breaches.json', format = 'array')
      WHERE coalesce(Domain, '') <> '';

      CREATE TABLE seen AS
      SELECT s->>'$.name' AS name, s->>'$.modified' AS modified,
             CAST(s->>'$.pwn' AS BIGINT) AS pwn,
             CAST(from_json(json_extract(s, '$.classes'), '["VARCHAR"]') AS VARCHAR[]) AS classes
      FROM (SELECT unnest(from_json(content, '["JSON"]')) AS s FROM read_text('seen.json'));

      CREATE TABLE matched AS
      SELECT w.domain AS vendor, b.*,
             list_intersect(b.classes, ['Passwords', 'Historical passwords', 'Credit cards', 'Credit card CVV',
               'Partial credit card data', 'Bank account numbers', 'Auth tokens', 'Encrypted keys', 'Mnemonic phrases',
               'PINs', 'Security questions and answers', 'Government issued IDs', 'Passport numbers',
               'Social security numbers', 'Driver''s licenses', 'Personal health data', 'Health insurance information',
               'Biometric data']) AS sensitive,
             s.name IS NOT NULL AS was_seen, s.pwn AS prev_pwn,
             CASE WHEN s.name IS NULL THEN [] ELSE list_filter(b.classes, c -> NOT list_contains(s.classes, c)) END AS added_classes,
             s.modified AS prev_modified
      FROM breaches b
      JOIN watch w ON w.valid AND (b.domain = w.domain OR b.domain LIKE '%.' || w.domain)
      LEFT JOIN seen s ON s.name = b.name;

      CREATE TABLE classified AS
      SELECT *,
             CASE WHEN len(sensitive) > 0 THEN 'HIGH' ELSE 'MEDIUM' END AS severity,
             CASE WHEN fabricated THEN 'FABRICATED'
                  WHEN NOT was_seen AND CAST(added_at AS DATE) >= current_date - CAST(:lookback AS INTEGER) THEN 'NEW'
                  WHEN NOT was_seen THEN 'HISTORICAL'
                  WHEN modified <> prev_modified AND (len(added_classes) > 0 OR pwn <> prev_pwn) THEN 'UPDATED'
                  ELSE 'KNOWN' END AS status
      FROM matched;

      COPY (
        SELECT w.raw AS input, w.domain AS vendor,
               CASE WHEN NOT w.valid THEN 'INVALID_DOMAIN' WHEN c.name IS NULL THEN 'NO_BREACH' ELSE c.status END AS status,
               c.name AS breach, c.domain AS breach_domain, c.breach_date, CAST(c.added_at AS DATE) AS added_to_hibp,
               c.pwn AS accounts, c.severity, array_to_string(c.sensitive, '; ') AS sensitive_classes,
               array_to_string(c.classes, '; ') AS data_classes, c.flags
        FROM watch w LEFT JOIN classified c ON c.vendor = w.domain
        ORDER BY status, vendor, c.added_at DESC
      ) TO '{{ outputFiles.matches_csv }}' (HEADER, DELIMITER ',');

      SELECT
        (SELECT count(*) FROM breaches) AS catalogue_breaches,
        (SELECT count(*) FILTER (WHERE valid) FROM watch) AS vendors_watched,
        (SELECT count(*) FROM seen) = 0 AS is_baseline,
        (SELECT count(DISTINCT vendor) FROM classified) AS vendors_breached,
        (SELECT count(*) FROM watch w WHERE valid AND NOT EXISTS (SELECT 1 FROM classified c WHERE c.vendor = w.domain)) AS vendors_clean,
        (SELECT count(*) FROM classified) AS matched_breaches,
        (SELECT count(*) FILTER (WHERE status = 'HISTORICAL') FROM classified) AS historical,
        (SELECT count(*) FILTER (WHERE status = 'FABRICATED') FROM classified) AS fabricated,
        (SELECT count(*) FILTER (WHERE status = 'NEW') FROM classified) AS new_breaches,
        (SELECT count(*) FILTER (WHERE status = 'UPDATED') FROM classified) AS updated_breaches,
        (SELECT count(*) FILTER (WHERE status IN ('NEW', 'UPDATED')) FROM classified) AS alerts,
        (SELECT coalesce(string_agg(raw, ', '), '') FROM watch WHERE NOT valid) AS invalid_inputs,
        (SELECT coalesce(CAST(json_group_array(json_object(
            'status', status, 'vendor', vendor, 'name', name, 'title', title, 'domain', domain,
            'breach_date', breach_date, 'added', CAST(CAST(added_at AS DATE) AS VARCHAR), 'pwn', pwn, 'prev_pwn', prev_pwn,
            'severity', severity, 'classes', array_to_string(classes, ', '), 'sensitive', array_to_string(sensitive, ', '),
            'added_classes', array_to_string(added_classes, ', '), 'flags', flags,
            'details', chr(10) || concat_ws(chr(10),
              'Breached ' || breach_date || ', added to HIBP ' || CAST(CAST(added_at AS DATE) AS VARCHAR),
              CASE WHEN status = 'UPDATED' THEN 'New data classes: ' || coalesce(nullif(array_to_string(added_classes, ', '), ''), 'none') || ' (accounts before: ' || prev_pwn || ')' END,
              'Data exposed: ' || array_to_string(classes, ', '),
              CASE WHEN len(sensitive) > 0 THEN '*Sensitive:* ' || array_to_string(sensitive, ', ') END,
              CASE WHEN flags <> '' THEN 'HIBP flags: ' || flags END,
              'https://haveibeenpwned.com/Breach/' || name))) AS VARCHAR), '[]')
           FROM (SELECT * FROM classified WHERE status IN ('NEW', 'UPDATED') ORDER BY added_at DESC)) AS alert_list,
        (SELECT coalesce(CAST(json_group_array(json_object('name', name, 'modified', modified, 'pwn', pwn, 'classes', classes)) AS VARCHAR), '[]')
           FROM (SELECT name, modified, pwn, classes FROM classified
                 UNION ALL SELECT name, modified, pwn, classes FROM seen WHERE name NOT IN (SELECT name FROM classified))) AS state;

  - id: save_state
    type: io.kestra.plugin.core.kv.Set
    description: Matched breaches with their current version. Breaches of vendors removed from the list are kept, so re-adding a vendor does not re-alert.
    key: hibp_vendor_breaches_seen
    value: "{{ outputs.match.outputs[0].row.state }}"

  - id: report
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.match.outputs[0].row.alerts > 0 }}"
    then:
      - id: log_alerts
        type: io.kestra.plugin.core.log.Log
        level: WARN
        message: |-
          {{ outputs.match.outputs[0].row.alerts }} vendor breach alert(s):
          {%- for a in fromJson(outputs.match.outputs[0].row.alert_list) %}
          {{ a.status }} {{ a.severity }}: {{ a.title }} ({{ a.domain }}, vendor {{ a.vendor }}) {{ a.pwn | numberFormat('#,##0') }} accounts, breached {{ a.breach_date }}, added to HIBP {{ a.added }}{{ a.status == 'UPDATED' ? ', new data classes: ' ~ (a.added_classes is empty ? 'none' : a.added_classes) ~ ', accounts before: ' ~ (a.prev_pwn | numberFormat('#,##0')) : '' }}. Sensitive: {{ a.sensitive is empty ? 'none' : a.sensitive }}.{{ a.flags is empty ? '' : ' Flags: ' ~ a.flags ~ '.' }}
          {%- endfor %}

      - id: each_alert
        type: io.kestra.plugin.core.flow.Loop
        values: "{{ outputs.match.outputs[0].row.alert_list }}"
        tasks:
          - id: notify
            type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
            allowFailure: true
            description: allowFailure keeps the check green when the webhook is not configured; the alert is still in the WARN log and the CSV.
            url: "{{ secret('SLACK_WEBHOOK_URL') }}"
            payload: |
              {{ {"text": (fromJson(item.value).severity == 'HIGH' ? ':rotating_light: ' : ':warning: ') ~ '*' ~ fromJson(item.value).status ~ ' vendor breach* ' ~ fromJson(item.value).title ~ ' (' ~ fromJson(item.value).domain ~ '), ' ~ (fromJson(item.value).pwn | numberFormat('#,##0')) ~ ' accounts' ~ fromJson(item.value).details} | toJson }}
    else:
      - id: nothing_new
        type: io.kestra.plugin.core.log.Log
        message: "No new or updated vendor breaches: {{ outputs.match.outputs[0].row.matched_breaches }} known breaches across {{ outputs.match.outputs[0].row.vendors_breached }} vendors, {{ outputs.match.outputs[0].row.vendors_clean }} vendors clean."

  - id: warn_invalid
    type: io.kestra.plugin.core.log.Log
    runIf: "{{ outputs.match.outputs[0].row.invalid_inputs is not empty }}"
    level: WARN
    message: "Skipped vendor entries that are not a domain name: {{ outputs.match.outputs[0].row.invalid_inputs }}"

  - id: summary
    type: io.kestra.plugin.core.log.Log
    message: |-
      HIBP catalogue: {{ outputs.match.outputs[0].row.catalogue_breaches }} breaches with a domain{{ outputs.match.outputs[0].row.is_baseline ? ' (BASELINE run)' : '' }}.
      Vendors watched {{ outputs.match.outputs[0].row.vendors_watched }}: {{ outputs.match.outputs[0].row.vendors_breached }} with breaches, {{ outputs.match.outputs[0].row.vendors_clean }} clean.
      Matched breaches {{ outputs.match.outputs[0].row.matched_breaches }}: new {{ outputs.match.outputs[0].row.new_breaches }}, updated {{ outputs.match.outputs[0].row.updated_breaches }}, historical {{ outputs.match.outputs[0].row.historical }}, fabricated {{ outputs.match.outputs[0].row.fabricated }}.

outputs:
  - id: summary
    type: JSON
    value: "{{ outputs.match.outputs[0].row | jq('del(.state)') | first }}"
  - id: matches_csv
    type: FILE
    value: "{{ outputs.match.outputFiles.matches_csv }}"

extend:
  title: Watch Have I Been Pwned for New Data Breaches at Your Vendors
  metaTitle: Vendor Breach Watch with Have I Been Pwned, DuckDB and Slack | Kestra
  shortDescription: Download the Have I Been Pwned breach catalogue each day, match it against your vendor and SaaS domains with DuckDB, rate the exposed data, and alert in Slack once per new breach and again when HIBP adds data classes or accounts to it.
  metaDescription: Daily Have I Been Pwned check of vendor domains for new or updated data breaches, deduplicated in the KV store, with a CSV report and Slack alerts.
  description: |
    Vendor breaches often reach third-party risk teams weeks after Have I Been Pwned (HIBP) loaded them. HIBP publishes its breach catalogue (domain, account count, data classes) on a free, keyless endpoint. This flow checks it daily against your vendor domains and alerts once per new breach, and again when HIBP adds data classes or accounts to one.

    ## How it works

    1. A daily `Schedule` trigger (07:00 UTC) starts the run.
    2. `fetch_breaches` (HTTP Download) gets `haveibeenpwned.com/api/v3/breaches` in one request (about 1,000 breaches, 1 MB).
    3. `previous_state` (KV Get) reads the breaches already reported, with `ModifiedDate`, `PwnCount` and data classes.
    4. `match` (DuckDB) normalises `vendor_domains` (URLs reduced to the domain, duplicates merged, non-domains reported), matches the exact domain or a subdomain, rates HIGH when passwords, card or bank data, IDs or health data were exposed, and labels HIBP flags (unverified, fabricated, spam list, stealer log, malware). Status per match: `NEW` (unseen, added within `lookback_days`), `HISTORICAL` (unseen but older, e.g. first run or a vendor added later), `UPDATED` (`ModifiedDate` changed and data classes or account count changed; description edits are ignored), `FABRICATED` (never alerts) or `KNOWN`.
    5. `save_state` (KV Set) stores the matches, keeping the history of removed vendors.
    6. `report` (If) logs the alerts at WARN and `each_alert` (Loop) posts one Slack message per alert.
    7. `warn_invalid` and `summary` log skipped entries and counts. Outputs: summary JSON and a CSV per vendor and breach (`NO_BREACH` / `INVALID_DOMAIN` included).

    ## What you get

    - One alert per new vendor breach, plus a follow-up when HIBP adds data such as passwords.
    - Severity from the data exposed and HIBP's flags, so a scraped spam list or a fabricated breach is not treated as a confirmed incident.
    - A per-vendor CSV for risk reviews, including clean vendors.

    ## Who it's for

    - Third-party risk, vendor management and GRC teams.
    - Security operations and privacy teams that rotate credentials or contact a breached supplier.

    ## Why orchestrate this with Kestra

    - The matching rules are readable SQL in one DuckDB task.
    - The KV store gives once-only alerts and change detection without a database.
    - `If` and `Loop` keep quiet days quiet, and `allowFailure` keeps the run green without Slack.

    ## Prerequisites

    - Kestra 2.0 with the DuckDB and Slack plugins, and outbound HTTPS to `haveibeenpwned.com`. No API key is needed. HIBP data is CC BY 4.0, so credit HIBP when you share it.
    - The default vendor list is sample data (real domains); every breach comes from the live API.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack incoming webhook (optional; without it the alerts stay in the log and the CSV).

    ## Quick start

    1. Execute with the defaults. The first run reports Crunchbase, CyrusOne and McKesson as `NEW`, the LinkedIn, Adobe and Trello breaches as `HISTORICAL`, Paytm as `FABRICATED`, and Stripe and Okta as `NO_BREACH`.
    2. Execute again: nothing is new.
    3. Put your vendor inventory in `vendor_domains`, add `SLACK_WEBHOOK_URL` and keep the daily schedule.

    ## How to extend

    - Open a vendor-risk ticket for HIGH alerts with the Jira or ServiceNow plugins.
    - With an HIBP API key, add the domain search API to see which employee addresses were exposed.

    ## Links

    - [HTTP Download](https://kestra.io/plugins/core/http/io.kestra.plugin.core.http.download), [KV Get](https://kestra.io/plugins/core/kv/io.kestra.plugin.core.kv.get) and [KV Set](https://kestra.io/plugins/core/kv/io.kestra.plugin.core.kv.set)
    - [DuckDB Queries](https://kestra.io/plugins/plugin-jdbc-duckdb/io.kestra.plugin.jdbc.duckdb.queries)
    - [If](https://kestra.io/plugins/core/flow/io.kestra.plugin.core.flow.if) and [Loop](https://kestra.io/plugins/core/flow/io.kestra.plugin.core.flow.loop)
    - [Slack Incoming Webhook](https://kestra.io/plugins/plugin-notifications/slack/io.kestra.plugin.slack.notifications.slackincomingwebhook)
    - [Have I Been Pwned API v3](https://haveibeenpwned.com/API/v3)
  tags:
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - Incident Response
  ee: false
  demo: false
