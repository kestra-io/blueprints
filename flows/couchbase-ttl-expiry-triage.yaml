    - [Couchbase META() function reference](https://docs.couchbase.com/server/current/n1ql/n1ql-language-reference/metafun.html)
    - [Couchbase date/time functions (NOW_MILLIS, NOW_STR)](https://docs.couchbase.com/server/current/n1ql/n1ql-language-reference/datefun.html)
    - [Couchbase FROM clause / keyspace reference](https://docs.couchbase.com/server/current/n1ql/n1ql-language-reference/from.html)
    - [Kestra secrets (OSS vs Enterprise)](https://kestra.io/docs/concepts/secret)
    - [Sibling blueprint: couchbase-to-pandas](https://github.com/kestra-io/blueprints/blob/main/flows/couchbase-to-pandas.yaml)
  tags:
    - Infrastructure
    - Data
  subTags:
    - Monitoring & Alerting
    - Day 2 Operations
  ee: false
  demo: false
