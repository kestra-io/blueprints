id: kafka-under-replicated-partition-auto-recovery
namespace: company.team

description: |
  Detect Kafka under-replicated partitions, trigger preferred-leader election to restore
  full replication, wait for stabilisation, verify the fix held, and notify Slack on success
  or escalate if partitions remain under-replicated after remediation.

inputs:
  - id: bootstrap_servers
    type: STRING
    displayName: Kafka Bootstrap Servers
    description: Comma-separated host:port list of Kafka broker endpoints reachable from the Kestra worker.
    defaults: "localhost:9092"

  - id: kafka_bin_dir
    type: STRING
    displayName: Kafka Scripts Directory
    description: Absolute path to the directory containing kafka-topics.sh and kafka-leader-election.sh.
    defaults: "/opt/kafka/bin"

  - id: election_wait_seconds
    type: INT
    displayName: Post-Election Wait (seconds)
    description: Seconds to wait after triggering preferred-leader election before re-checking partition state.
    defaults: 30
    min: 10
    max: 300

variables:
  slack_webhook: "{{ secret('SLACK_WEBHOOK_URL') }}"

tasks:
  - id: detect_under_replicated
    type: io.kestra.plugin.scripts.shell.Commands
    description: Count partitions whose ISR set is smaller than the configured replica set.
    commands:
      - |
        set -e
        COUNT=$("{{ inputs.kafka_bin_dir }}"/kafka-topics.sh \
          --bootstrap-server "{{ inputs.bootstrap_servers }}" \
          --describe 2>/dev/null \
          | awk -F'\t' '$0 ~ /UnderReplicatedPartitions/ {
              split($0, fields, "\t");
              for (i in fields) {
                if (fields[i] ~ /^UnderReplicatedPartitions:/) {
                  split(fields[i], kv, ":");
                  if (kv[2]+0 > 0) count++;
                }
              }
            } END { print count+0 }')
        echo "under_replicated_count=${COUNT}"
    outputFiles:
      - "*.txt"

  - id: parse_detect
    type: io.kestra.plugin.scripts.shell.Commands
    description: Emit the count as a Kestra output variable for the If branch.
    commands:
      - |
        COUNT=$(grep -oP '(?<=under_replicated_count=)\d+' \
          "{{ outputs.detect_under_replicated.outputFiles['*.txt'] }}" 2>/dev/null || echo "0")
        echo "::{ \"outputs\": { \"under_replicated_count\": ${COUNT} } }::"

  - id: check_remediation_needed
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.parse_detect.vars.under_replicated_count | int > 0 }}"
    then:
      - id: trigger_leader_election
        type: io.kestra.plugin.scripts.shell.Commands
        description: Run preferred-leader election across all topic-partitions to restore replication.
        commands:
          - |
            "{{ inputs.kafka_bin_dir }}"/kafka-leader-election.sh \
              --bootstrap-server "{{ inputs.bootstrap_servers }}" \
              --election-type PREFERRED \
              --all-topic-partitions
            echo "Leader election submitted for all topic-partitions."

      - id: wait_for_replication
        type: io.kestra.plugin.core.flow.Sleep
        duration: "PT{{ inputs.election_wait_seconds }}S"

      - id: verify_recovery
        type: io.kestra.plugin.scripts.shell.Commands
        description: Re-count under-replicated partitions after the election wait.
        commands:
          - |
            set -e
            COUNT=$("{{ inputs.kafka_bin_dir }}"/kafka-topics.sh \
              --bootstrap-server "{{ inputs.bootstrap_servers }}" \
              --describe 2>/dev/null \
              | awk -F'\t' '$0 ~ /UnderReplicatedPartitions/ {
                  split($0, fields, "\t");
                  for (i in fields) {
                    if (fields[i] ~ /^UnderReplicatedPartitions:/) {
                      split(fields[i], kv, ":");
                      if (kv[2]+0 > 0) count++;
                    }
                  }
                } END { print count+0 }')
            echo "::{ \"outputs\": { \"remaining_count\": ${COUNT} } }::"

      - id: notify_result
        type: io.kestra.plugin.core.flow.If
        condition: "{{ outputs.verify_recovery.vars.remaining_count | int == 0 }}"
        then:
          - id: notify_success
            type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
            url: "{{ vars.slack_webhook }}"
            payload: |
              {"text": "✅ *Kafka self-healing succeeded* — preferred-leader election resolved all under-replicated partitions on `{{ inputs.bootstrap_servers }}`. Replication factor fully restored."}
        else:
          - id: notify_escalation
            type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
            url: "{{ vars.slack_webhook }}"
            payload: |
              {"text": "🔴 *Kafka escalation required* — `{{ outputs.verify_recovery.vars.remaining_count }}` partition(s) remain under-replicated on `{{ inputs.bootstrap_servers }}` after preferred-leader election. Manual broker inspection needed."}
    else:
      - id: notify_healthy
        type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
        url: "{{ vars.slack_webhook }}"
        payload: |
          {"text": "✅ *Kafka replication healthy* — no under-replicated partitions detected on `{{ inputs.bootstrap_servers }}`."}

errors:
  - id: alert_flow_failure
    type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
    url: "{{ vars.slack_webhook }}"
    payload: |
      {"text": "🔴 *Kafka auto-recovery flow failed* — execution `{{ execution.id }}` on `{{ inputs.bootstrap_servers }}` encountered an unexpected error. Check Kestra logs for details."}

triggers:
  - id: schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  title: "Kafka Under-Replicated Partition Auto-Recovery"
  description: |
    Detects Kafka topics with under-replicated partitions and automatically triggers
    preferred-leader election to restore the full replication factor, then verifies
    the fix held and notifies Slack with the outcome.

    ## How it works

    1. `detect_under_replicated` runs `kafka-topics.sh --describe` and counts partitions
       whose `UnderReplicatedPartitions` value is greater than zero.
    2. `check_remediation_needed` branches on the count.
       - **Count > 0**: `trigger_leader_election` calls `kafka-leader-election.sh` with
         `--election-type PREFERRED --all-topic-partitions`, then `wait_for_replication`
         pauses for the configured number of seconds.
       - **Count == 0**: `notify_healthy` posts a clean-pass message and exits.
    3. `verify_recovery` re-runs the describe scan after the wait.
    4. `notify_result` branches again:
       - Remaining count is 0: `notify_success` posts a success alert.
       - Remaining count > 0: `notify_escalation` posts an escalation alert.
    5. The `errors` block catches unexpected flow failures and posts a separate Slack alert.
    6. `schedule` fires every 15 minutes; ship it disabled and enable once verified.

    ## What you get

    - Automated partition-leader rebalancing without manual intervention, reducing MTTR
      for replication-lag events that would otherwise page an on-call engineer.
    - A post-remediation verification step that distinguishes a genuinely resolved incident
      from one that needs human escalation.
    - A worked example of `io.kestra.plugin.core.flow.If` nesting, `Sleep`, and
      `SlackIncomingWebhook` composing a complete detect-fix-verify-notify loop.

    ## Prerequisites

    - Kafka cluster reachable from the Kestra worker network.
    - `kafka-topics.sh` and `kafka-leader-election.sh` present at `kafka_bin_dir`.
    - The worker process must have permission to execute those scripts.
    - A Slack incoming webhook stored as the `SLACK_WEBHOOK_URL` secret.

    ## Secrets required

    - `SLACK_WEBHOOK_URL`: Slack incoming webhook URL for success and escalation alerts.

    ## Troubleshooting

    - If `kafka-topics.sh` exits non-zero, confirm the worker can reach every broker in
      `bootstrap_servers` and that `kafka_bin_dir` is correct.
    - If leader election runs but partitions remain under-replicated, a broker may be
      down; inspect broker logs and increase `election_wait_seconds`.
    - In Kestra OSS, supply secrets as environment variables prefixed `SECRET_` and
      base64-encoded: `SECRET_SLACK_WEBHOOK_URL=$(echo -n '<url>' | base64)`.

    ## References

    - [Kafka preferred leader election](https://kafka.apache.org/documentation/#basic_ops_leader_balancing)
    - [Kestra Shell Commands plugin](https://kestra.io/plugins/plugin-script-shell)
    - [Kestra Slack plugin](https://kestra.io/plugins/plugin-notifications)

  tags:
    - Kafka
    - Infrastructure
  subTags:
    - Self-Healing
    - Monitoring & Alerting
  ee: false
  demo: false
