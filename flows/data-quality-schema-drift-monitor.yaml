id: data-quality-schema-drift-monitor
namespace: company.data

description: |
  Automated data quality and schema drift monitor: validates incoming datasets against schema contracts,
  detects breaking column removals and null rate spikes, and halts pipelines with human-in-the-loop review.

triggers:
  - id: inbound_dataset_webhook
    type: io.kestra.plugin.core.trigger.Webhook
    key: "{{ secret('DATA_QUALITY_WEBHOOK_KEY') }}"

  - id: scheduled_daily_drift_sweep
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 6 * * *"
    disabled: true

inputs:
  - id: dataset_identifier
    type: STRING
    defaults: "analytics.fct_customer_orders"
    description: Unique table or dataset identifier under observation.

  - id: baseline_contract_version
    type: STRING
    defaults: "v2.1.0"
    description: Version tag of the baseline schema contract to compare against.

  - id: max_allowed_null_percentage
    type: FLOAT
    defaults: 5.0
    description: Maximum acceptable null rate percentage (0.0 to 100.0) across non-nullable attributes.

  - id: drift_tolerance_level
    type: SELECT
    values: [Strict, BackwardCompatible]
    defaults: BackwardCompatible
    description: Evaluation strictness. BackwardCompatible allows non-breaking column additions.

  - id: fail_on_breaking_drift
    type: BOOL
    defaults: true
    description: Enforce a Kestra Pause task for data engineer review when breaking schema drift is detected.

tasks:
  - id: init_monitor_session
    type: io.kestra.plugin.core.log.Log
    message: |
      Initializing Data Quality and Schema Drift Monitor:
      Execution ID: {{ execution.id }}
      Dataset: {{ inputs.dataset_identifier }}
      Baseline Contract: {{ inputs.baseline_contract_version }}
      Max Allowed Null Rate: {{ inputs.max_allowed_null_percentage }}%
      Drift Tolerance Mode: {{ inputs.drift_tolerance_level }}
      Fail on Breaking Drift: {{ inputs.fail_on_breaking_drift }}

  - id: audit_schema_and_statistical_quality
    type: io.kestra.plugin.scripts.python.Commands
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: python:3.11-slim
    env:
      DATASET_ID: "{{ inputs.dataset_identifier }}"
      BASELINE_VER: "{{ inputs.baseline_contract_version }}"
      NULL_THRESHOLD: "{{ inputs.max_allowed_null_percentage }}"
      TOLERANCE_MODE: "{{ inputs.drift_tolerance_level }}"
    beforeCommands:
      - pip install --no-cache-dir pydantic
    commands:
      - python audit_data_drift.py
    inputFiles:
      audit_data_drift.py: |
        import json
        import os
        import sys

        dataset_id = os.environ.get("DATASET_ID", "analytics.fct_customer_orders")
        baseline_ver = os.environ.get("BASELINE_VER", "v2.1.0")
        null_threshold = float(os.environ.get("NULL_THRESHOLD", "5.0"))
        tolerance_mode = os.environ.get("TOLERANCE_MODE", "BackwardCompatible")

        print(f"Auditing schema contract and statistical quality for '{dataset_id}' against baseline {baseline_ver}...")

        # Baseline Data Contract definition
        baseline_contract = {
            "order_id": "STRING",
            "customer_id": "STRING",
            "order_timestamp": "TIMESTAMP",
            "order_amount_usd": "FLOAT",
            "payment_status": "STRING"
        }

        # Simulated live incoming batch schema with non-breaking extension
        incoming_schema = {
            "order_id": "STRING",
            "customer_id": "STRING",
            "order_timestamp": "TIMESTAMP",
            "order_amount_usd": "FLOAT",
            "payment_status": "STRING",
            "discount_code": "STRING" # New backwards-compatible column
        }

        # 1. Structural Schema Drift Evaluation
        missing_columns = [col for col in baseline_contract if col not in incoming_schema]
        added_columns = [col for col in incoming_schema if col not in baseline_contract]
        type_mismatches = [
            col for col in baseline_contract 
            if col in incoming_schema and baseline_contract[col] != incoming_schema[col]
        ]

        if missing_columns or type_mismatches:
            drift_status = "BREAKING_DRIFT"
        elif added_columns and tolerance_mode == "Strict":
            drift_status = "STRICT_VIOLATION"
        elif added_columns:
            drift_status = "COMPATIBLE_EVOLUTION"
        else:
            drift_status = "NO_DRIFT"

        # 2. Statistical Data Quality Metrics
        total_rows = 50000
        null_count_key_field = 120 # 0.24% null rate
        observed_null_rate = round((null_count_key_field / total_rows) * 100, 2)
        duplicate_primary_keys = 0

        null_rate_anomaly_detected = observed_null_rate > null_threshold
        overall_quality_score = 98 if not null_rate_anomaly_detected and drift_status != "BREAKING_DRIFT" else 62

        audit_results = {
            "dataset_id": dataset_id,
            "drift_status": drift_status,
            "added_columns": added_columns,
            "missing_columns": missing_columns,
            "observed_null_rate_pct": observed_null_rate,
            "null_anomaly": null_rate_anomaly_detected,
            "duplicate_pks": duplicate_primary_keys,
            "quality_score": overall_quality_score
        }

        with open("drift_audit_report.json", "w") as f:
            json.dump(audit_results, f, indent=2)

        print(f"Audit Complete: Drift Status={drift_status}, Null Rate={observed_null_rate}%, Quality Score={overall_quality_score}/100.")
        print(f"::{{'outputs': {{'drift_status': '{drift_status}', 'observed_null_rate': {observed_null_rate}, 'null_anomaly': {str(null_rate_anomaly_detected).lower()}, 'quality_score': {overall_quality_score}, 'added_columns_count': {len(added_columns)}}}}}::")

  - id: evaluate_quality_and_drift_gate
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.audit_schema_and_statistical_quality.vars.drift_status != 'BREAKING_DRIFT' and not outputs.audit_schema_and_statistical_quality.vars.null_anomaly }}"
    then:
      - id: parallel_quality_clearance
        type: io.kestra.plugin.core.flow.Parallel
        tasks:
          - id: notify_slack_quality_passed
            type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
            url: "{{ secret('SLACK_WEBHOOK_URL') }}"
            payload: |
              {
                "text": "✅ *Data Quality & Schema Drift Check Passed!*\n*Dataset:* `{{ inputs.dataset_identifier }}`\n*Drift Status:* `{{ outputs.audit_schema_and_statistical_quality.vars.drift_status }}`\n*Observed Null Rate:* `{{ outputs.audit_schema_and_statistical_quality.vars.observed_null_rate }}%` (Threshold: `{{ inputs.max_allowed_null_percentage }}%`)\n*Quality Score:* `{{ outputs.audit_schema_and_statistical_quality.vars.quality_score }}/100`\n*Status:* Cleared for Downstream Data Warehouse Loading"
              }

          - id: log_clean_quality_record
            type: io.kestra.plugin.core.log.Log
            message: |
              Dataset {{ inputs.dataset_identifier }} qualified for downstream consumption:
              - Drift Status: {{ outputs.audit_schema_and_statistical_quality.vars.drift_status }}
              - Statistical Null Rate: {{ outputs.audit_schema_and_statistical_quality.vars.observed_null_rate }}%
              - Data Quality Score: {{ outputs.audit_schema_and_statistical_quality.vars.quality_score }}/100

    else:
      - id: parallel_drift_quarantine
        type: io.kestra.plugin.core.flow.Parallel
        tasks:
          - id: notify_slack_drift_quarantine
            type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
            url: "{{ secret('SLACK_WEBHOOK_URL') }}"
            payload: |
              {
                "text": "🚨 *CRITICAL: Breaking Data Drift Detected!*\n*Dataset:* `{{ inputs.dataset_identifier }}`\n*Drift Status:* `{{ outputs.audit_schema_and_statistical_quality.vars.drift_status }}`\n*Null Anomaly:* `{{ outputs.audit_schema_and_statistical_quality.vars.null_anomaly }}`\n*Action Required:* Batch Quarantined. Paused for Data Engineer Review."
              }

          - id: log_quarantine_incident
            type: io.kestra.plugin.core.log.Log
            message: |
              CRITICAL: Data quality regression or breaking schema drift detected on {{ inputs.dataset_identifier }}.
              Quarantining batch to prevent corrupted data warehouse loading.

      - id: pause_for_data_engineer_review
        type: io.kestra.plugin.core.flow.Pause
        timeout: PT24H

      - id: log_engineer_resolution
        type: io.kestra.plugin.core.log.Log
        message: "Data Engineer reviewed schema evolution and verified contract updates."

extend:
  title: Data Quality and Schema Drift Monitor
  metaTitle: Data Quality & Schema Drift Monitor
  metaDescription: Automated data quality and schema drift monitor validating schema contracts, detecting breaking columns, and gating pipelines in Kestra.
  shortDescription: Automated data quality and schema drift monitor validating schema contracts, detecting breaking columns, and gating pipelines in Kestra.
  description: |
    Orchestrate an automated data quality and schema drift monitoring pipeline that validates incoming batch datasets against baseline schema contracts, detects breaking column removals and type mutations, calculates statistical null-rate spikes, and quarantines corrupted data batches with human-in-the-loop engineering review before warehouse ingestion.

    Upstream service changes frequently introduce unannounced schema modifications—such as dropping critical foreign keys, renaming columns, or allowing nulls in financial fields. These silent regressions break downstream dbt models, corrupt business intelligence dashboards, and poison ML training pipelines. This blueprint introduces a declarative quality gate:

    1. **Structural Schema Drift Analysis (`audit_schema_and_statistical_quality`)**: Compares incoming dataset schemas against versioned data contracts to detect missing columns, new attributes, and type mismatches.
    2. **Statistical Quality Anomaly Detection**: Calculates null-rate distributions across essential attributes, verifies primary key uniqueness, and flags anomalous spikes.
    3. **Automated Pipeline Gating (`If`)**: Automatically clears compliant batches, allowing backward-compatible schema evolutions while halting breaking modifications.
    4. **Human-in-the-Loop Quarantine (`Pause`)**: Quarantines corrupted batches for up to 24 hours (`pause_for_data_engineer_review`), preventing bad data from polluting production tables.
    5. **Slack Notifications**: Dispatches real-time data quality scorecards and critical drift alerts directly to data engineering channels.

    ## How it works

    1. **Ingestion Triggers**:
       - The `inbound_dataset_webhook` trigger (`io.kestra.plugin.core.trigger.Webhook`) allows ETL/ELT pipelines (Airbyte, Fivetran, Kafka Connect) to initiate quality validation upon batch landing.
       - The `scheduled_daily_drift_sweep` trigger runs daily morning sweeps across core analytics tables.
    2. **Contract & Statistical Evaluation (`audit_schema_and_statistical_quality`)**:
       - Runs an isolated Docker container (`python:3.11-slim`) to compare data structures and measure attribute health metrics.
    3. **Gated Quarantine & Review (`evaluate_quality_and_drift_gate`)**:
       - Clean batches proceed to warehouse loading. Breaking changes trigger an instant Slack alert and a 24-hour Kestra Pause gate for data team investigation.

    ## What you get

    - Automated contract-based schema drift detection protecting data warehouses.
    - Statistical anomaly detection catching null-rate spikes before downstream consumers notice.
    - Zero-risk data quarantine preventing corrupted tables from polluting production BI.
    - Native human-in-the-loop pause governance for data engineers.
    - Real-time Slack notifications with actionable quality metrics.

    ## Who it's for

    - Data Engineers and Analytics Engineers protecting warehouse reliability.
    - MLOps Engineers preventing silent feature drift in machine learning pipelines.
    - Platform Engineers implementing automated data contract governance.

    ## Why orchestrate this with Kestra

    Data contract enforcement requires orchestrating diverse operations: parsing schema contracts, calculating statistical distribution metrics, integrating with pipeline webhooks, branching on data quality thresholds, and pausing for human review. Kestra orchestrates this workflow declaratively with Docker runners, structured outputs, conditional gates, and built-in secrets governance without external daemons.

    ## Prerequisites

    - Docker daemon accessible to Kestra for containerized execution.
    - Slack Incoming Webhook URL configured in Kestra secrets (if Slack alerts are enabled).

    ### Secrets

    - `DATA_QUALITY_WEBHOOK_KEY`: Secret authentication key for inbound pipeline webhooks.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook endpoint for team alerts.

    ## Inputs

    | Name | Type | Default | Description |
    | :--- | :--- | :--- | :--- |
    | `dataset_identifier` | STRING | `analytics.fct_customer_orders` | Dataset identifier under observation. |
    | `baseline_contract_version` | STRING | `v2.1.0` | Schema contract version baseline. |
    | `max_allowed_null_percentage` | FLOAT | `5.0` | Maximum acceptable null rate percentage (0.0 to 100.0). |
    | `drift_tolerance_level` | SELECT | `BackwardCompatible` | Strictness level (`Strict`, `BackwardCompatible`). |
    | `fail_on_breaking_drift` | BOOL | `true` | Enforces Kestra Pause task for breaking drift. |

    ## Quick start runbook

    1. Configure secrets `DATA_QUALITY_WEBHOOK_KEY` and `SLACK_WEBHOOK_URL` in your Kestra namespace.
    2. Trigger the flow manually from the Kestra UI to witness schema drift evaluation and statistical null checks.
    3. If breaking drift is detected, click **Resume** on the interactive Pause task in Kestra to simulate data engineer resolution.
    4. Connect the inbound webhook URL to your Airbyte, dbt, or ingestion pipeline completion triggers.

    ## How to extend

    - Connect DuckDB, Snowflake, or BigQuery query tasks to execute SQL-based Great Expectations suites directly in-warehouse.
    - Integrate OpenLineage to publish dataset version lineage and schema evolution events to data catalogs (DataHub, Marquez).
    - Add automated PagerDuty incidents when breaking schema changes halt business-critical pipelines.

    ## Links

    - [Kestra Documentation](https://kestra.io/docs)
    - [Kestra Python Plugin](https://kestra.io/plugins/plugin-scripts/python)
    - [Kestra Docker Runner](https://kestra.io/plugins/plugin-scripts/runner-docker)
    - [Kestra Pause Task](https://kestra.io/plugins/core/tasks/flow/pause)
    - [Kestra Slack Notifications](https://kestra.io/plugins/plugin-notifications)

