id: data-quality-schema-drift-monitor
namespace: company.team

description: |
  Automated data quality and schema drift monitor: validates incoming datasets against schema contracts,
  detects breaking column removals and null rate spikes, and alerts data engineers on Slack.

triggers:
  - id: inbound_dataset_webhook
    type: io.kestra.plugin.core.trigger.Webhook
    key: "{{ secret('DATA_QUALITY_WEBHOOK_KEY') }}"

  - id: scheduled_daily_drift_sweep
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 6 * * *"
    disabled: true

inputs:
  - id: dataset_identifier
    type: STRING
    defaults: "analytics.fct_customer_orders"
    description: Unique table or dataset identifier under observation.

  - id: baseline_contract_version
    type: STRING
    defaults: "v2.1.0"
    description: Version tag of the baseline schema contract to compare against.

  - id: max_allowed_null_percentage
    type: FLOAT
    defaults: 5.0
    description: Maximum acceptable null rate percentage (0.0 to 100.0) across non-nullable attributes.

  - id: drift_tolerance_level
    type: SELECT
    values: [Strict, BackwardCompatible]
    defaults: BackwardCompatible
    description: Evaluation strictness. BackwardCompatible allows non-breaking column additions.

tasks:
  - id: audit_schema_and_statistical_quality
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install pydantic requests
    env:
      DATASET_ID: "{{ inputs.dataset_identifier }}"
      BASELINE_VER: "{{ inputs.baseline_contract_version }}"
      NULL_THRESHOLD: "{{ inputs.max_allowed_null_percentage }}"
      TOLERANCE_MODE: "{{ inputs.drift_tolerance_level }}"
    script: |
      import os
      import sys
      import json
      from kestra import Kestra

      dataset_id = os.environ.get("DATASET_ID", "analytics.fct_customer_orders")
      baseline_ver = os.environ.get("BASELINE_VER", "v2.1.0")
      null_threshold = float(os.environ.get("NULL_THRESHOLD", "5.0"))
      tolerance_mode = os.environ.get("TOLERANCE_MODE", "BackwardCompatible")

      baseline_contract = {
          "order_id": "STRING",
          "customer_id": "STRING",
          "order_timestamp": "TIMESTAMP",
          "order_amount_usd": "FLOAT",
          "payment_status": "STRING"
      }

      incoming_schema = {
          "order_id": "STRING",
          "customer_id": "STRING",
          "order_timestamp": "TIMESTAMP",
          "order_amount_usd": "FLOAT",
          "payment_status": "STRING",
          "discount_code": "STRING"
      }

      missing_columns = [col for col in baseline_contract if col not in incoming_schema]
      added_columns = [col for col in incoming_schema if col not in baseline_contract]
      type_mismatches = [
          col for col in baseline_contract 
          if col in incoming_schema and baseline_contract[col] != incoming_schema[col]
      ]

      is_breaking = len(missing_columns) > 0 or len(type_mismatches) > 0
      if tolerance_mode == "Strict" and len(added_columns) > 0:
          is_breaking = True

      report = {
          "dataset_id": dataset_id,
          "baseline_version": baseline_ver,
          "missing_columns": missing_columns,
          "added_columns": added_columns,
          "type_mismatches": type_mismatches,
          "is_breaking": is_breaking
      }

      with open("schema_drift_report.json", "w") as f:
          json.dump(report, f, indent=2)

      Kestra.outputs({
          "is_breaking_drift": is_breaking,
          "missing_columns_count": len(missing_columns),
          "added_columns_count": len(added_columns)
      })
      print(f"Schema audit: breaking={is_breaking}, missing={missing_columns}, added={added_columns}")
    outputFiles:
      - schema_drift_report.json

  - id: evaluate_drift_severity
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.audit_schema_and_statistical_quality.vars.is_breaking_drift }}"
    then:
      - id: notify_dataops_slack
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#data-quality-alerts",
            "text": "CRITICAL: Breaking schema drift detected in dataset `{{ inputs.dataset_identifier }}` against baseline contract `{{ inputs.baseline_contract_version }}`! Execution ID: `{{ execution.id }}`."
          }

errors:
  - id: alert_on_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "#data-quality-alerts",
        "text": "CRITICAL: Data Quality Schema Drift Monitor execution failed on dataset `{{ inputs.dataset_identifier }}`. Execution ID: `{{ execution.id }}`."
      }

extend:
  title: Data Quality and Schema Drift Monitor
  metaTitle: Data Quality and Schema Drift Monitor Blueprint
  shortDescription: Audits datasets against baseline schema contracts to detect breaking changes and null spikes.
  metaDescription: Validates datasets against schema contracts, catches missing columns and type drift, and alerts data engineering.
  description: |
    Data pipelines frequently break when upstream teams introduce unannounced schema changes, drop critical columns, or mutate data types. This monitor validates schema contracts and statistical null rate distributions, isolating contract breaches before corrupted records propagate to downstream warehouses.

    ## Architecture diagram
    ```mermaid
    flowchart TD
      A[scheduled_daily_drift_sweep Schedule Trigger] --> B[audit_schema_and_statistical_quality Python Script]
      B --> C{Breaking Drift Detected?}
      C -- Yes --> D[notify_dataops_slack Webhook]
      C -- No --> E[Contract Validated]
    ```

    ## Prerequisites
    - Secret `DATA_QUALITY_WEBHOOK_KEY` configured in Kestra.
    - Secret `SLACK_WEBHOOK_URL` configured in Kestra.

    ## Quick start
    1. Import the blueprint under the `company.team` namespace.
    2. Configure `dataset_identifier` and `baseline_contract_version`.
    3. Run manually to test schema validation.

    ## Links
    - [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
  tags:
    - Data
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - Day 2 Operations
  ee: false
  demo: false
