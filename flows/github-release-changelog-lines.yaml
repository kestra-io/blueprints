id: github-release-changelog-lines
namespace: company.team
description: |
  A GitHub release webhook starts this flow. Prereleases are dropped.
  Each remaining changelog line is posted on its own.

inputs:
  - id: repository
    type: STRING
    defaults: octocat/Hello-World
    description: owner/name used to confirm the tag against the GitHub releases API.

triggers:
  - id: github_release
    type: io.kestra.plugin.core.trigger.Webhook
    description: |
      GitHub repository webhook for the release event. The payload is
      GitHub's own release body, not a custom CI summary.
    key: "{{ secret('GITHUB_RELEASE_WEBHOOK_KEY') }}"

tasks:
  - id: only_stable_releases
    type: io.kestra.plugin.core.flow.If
    description: Drop anything that is not a published stable release.
    condition: "{{ trigger.body.action == 'published' and trigger.body.release.prerelease == false }}"
    then:
      - id: confirm_release
        type: io.kestra.plugin.core.http.Request
        description: Confirm the tag exists on the GitHub releases API before posting any line.
        uri: "https://api.github.com/repos/{{ inputs.repository }}/releases/tags/{{ trigger.body.release.tag_name }}"
        method: GET
        headers:
          Accept: application/vnd.github+json
          User-Agent: kestra-github-release-changelog-lines

      - id: note_tag
        type: io.kestra.plugin.core.log.Log
        message: "Posting changelog lines for {{ trigger.body.release.tag_name }} (HTTP {{ outputs.confirm_release.code }})."

      - id: each_changelog_line
        type: io.kestra.plugin.core.flow.ForEach
        description: One iteration per line of release.body.
        values: "{{ trigger.body.release.body | split('\n') }}"
        tasks:
          - id: post_line
            type: io.kestra.plugin.discord.DiscordIncomingWebhook
            description: Post this changelog line. Blank lines are skipped.
            runIf: "{{ taskrun.value | trim != '' }}"
            url: "{{ secret('DISCORD_WEBHOOK_URL') }}"
            payload: |
              {
                "content": "{{ trigger.body.release.tag_name }}: {{ taskrun.value }}"
              }
    else:
      - id: skip_prerelease
        type: io.kestra.plugin.core.log.Log
        message: "Skipped. action={{ trigger.body.action }} prerelease={{ trigger.body.release.prerelease }}."

extend:
  title: Skip prereleases and post one changelog line at a time
  shortDescription: A GitHub release webhook starts the flow, an If drops prereleases, and a loop posts each changelog line to Discord.
  metaTitle: Post GitHub Changelog Lines from a Release Webhook
  metaDescription: Kestra flow for a GitHub release webhook that skips prereleases and posts each changelog line on its own.
  description: |
    `bluesky-release-notes-post` and `x-release-announcement` already post one announcement when a CI job sends a custom payload. This flow is the other shape. GitHub's own release webhook starts it. An `If` drops prereleases and any event that is not `published`. A loop sends each line of `release.body` on its own.

    ## How it works

    1. `github_release` (`io.kestra.plugin.core.trigger.Webhook`) receives the GitHub `release` event.
    2. `only_stable_releases` (`io.kestra.plugin.core.flow.If`) continues only when `action` is `published` and `release.prerelease` is false.
    3. `confirm_release` (`io.kestra.plugin.core.http.Request`) checks the tag on the GitHub releases API.
    4. `each_changelog_line` (`io.kestra.plugin.core.flow.ForEach`) walks `release.body` split on newlines.
    5. `post_line` (`io.kestra.plugin.discord.DiscordIncomingWebhook`) posts that line. Blank lines are skipped.

    ## Track requirements

    Three runnable tasks (`confirm_release`, `note_tag`, `post_line`), one flowable `If`, one `ForEach`, one trigger, and one non-core plugin (`plugin-discord`). Secrets stay in `{{ secret('NAME') }}` placeholders.

    ## Prerequisites

    - A GitHub repository webhook for the `release` event, aimed at this flow.
    - A Discord incoming webhook.

    ### Secrets

    - `GITHUB_RELEASE_WEBHOOK_KEY`: key guarding the Kestra webhook URL.
    - `DISCORD_WEBHOOK_URL`: Discord incoming webhook URL.
  tags:
    - Business
  subTags:
    - Realtime Events
  ee: false
  demo: false
