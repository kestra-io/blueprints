id: kestra-failed-execution-dlq-replay-engine
namespace: company.team

description: |
  Find failed workflow executions in a namespace, alert Slack with the details,
  and optionally restart them one by one behind a Pause approval gate.

inputs:
  - id: kestra_url
    type: STRING
    displayName: Target Kestra API URL
    description: Base URL of the Kestra cluster whose failed executions are triaged and replayed.
    defaults: "http://localhost:8080"

  - id: namespace
    type: STRING
    displayName: Target Namespace
    description: Namespace scope to inspect for failed executions.
    defaults: company.team

  - id: max_replays
    type: INT
    displayName: Maximum Replays Per Run
    description: Upper bound on the number of failed executions to restart in a single execution.
    defaults: 5

  - id: auto_replay
    type: BOOL
    displayName: Enable Auto-Replay
    description: When true and dry run is false, prompts for human approval and restarts candidates.
    defaults: false

  - id: dry_run
    type: BOOL
    displayName: Dry Run Mode
    description: When true, discovers and reports failed executions without triggering restarts.
    defaults: true

  - id: exclude_flows
    type: ARRAY
    itemType: STRING
    displayName: Excluded Flow IDs
    description: List of flow IDs to skip during triage, preventing automated restarts of known flaky tasks.
    defaults: []

  - id: api_token
    type: STRING
    displayName: Kestra API Token / Authorization Header
    description: Optional bearer token or credentials for authenticating against secured Kestra clusters. Leave empty for unauthenticated local instances.
    defaults: ""

tasks:
  - id: query_failed_executions
    type: io.kestra.plugin.core.http.Request
    description: Queries the Kestra 2.0 REST API for executions currently in FAILED state within the namespace.
    uri: "{{ inputs.kestra_url }}/api/v1/executions/search"
    method: GET
    headers: "{{ (inputs.api_token is not empty) ? {'Authorization': (inputs.api_token contains ' ' ? inputs.api_token : 'Bearer ' ~ inputs.api_token)} : {} }}"
    params:
      "filters[state][EQUALS]": "FAILED"
      "filters[namespace][EQUALS]": "{{ inputs.namespace }}"
      "size": "25"

  - id: triage_failures
    type: io.kestra.plugin.core.output.OutputValues
    description: Evaluates API results, excludes self-runs and ignored flows, and caps candidates to max_replays.
    values:
      candidates: >-
        {{
          outputs.query_failed_executions.body
          | jq('[.results[]? | select(.id != "' ~ execution.id ~ '" and .flowId != "' ~ flow.id ~ '") | select(.flowId as $f | ' ~ (inputs.exclude_flows | toJson) ~ ' | index($f) | not)] | .[0:' ~ inputs.max_replays ~ '] | map({id: .id, flowId: .flowId, namespace: .namespace, startDate: .state.startDate})')
        }}

  - id: check_candidate_count
    type: io.kestra.plugin.core.flow.If
    description: Branches based on whether eligible failed executions were discovered.
    condition: "{{ (outputs.triage_failures.values.candidates | length) > 0 }}"
    then:
      - id: notify_triage_slack
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Sends failure details to Slack.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        messageText: |
          :warning: *Kestra Failed Executions Alert*
          *Namespace:* `{{ inputs.namespace }}`
          *Failed Candidates Found:* `{{ outputs.triage_failures.values.candidates | length }}` (capped at {{ inputs.max_replays }})
          *Mode:* `{{ inputs.auto_replay ? (inputs.dry_run ? 'Dry Run (Simulation)' : 'Active Replay Armed') : 'Audit Only' }}`
          *Executions:*
          {{ outputs.triage_failures.values.candidates | jq('.[] | "• `" + .flowId + "` (ID: `" + .id + "`, Started: " + .startDate + ")"') | join('\n') }}

      - id: evaluate_replay_permission
        type: io.kestra.plugin.core.flow.If
        description: Checks whether auto_replay is enabled and dry run is disabled.
        condition: "{{ inputs.auto_replay and not inputs.dry_run }}"
        then:
          - id: approve_replay
            type: io.kestra.plugin.core.flow.Pause
            description: Pauses for approval before restarting executions.
            onResume:
              - id: approved
                type: BOOL
                description: Confirm restart of all triaged candidate executions.
                defaults: true

          - id: restart_candidates
            type: io.kestra.plugin.core.flow.Loop
            description: Restarts failed executions one at a time.
            values: "{{ outputs.triage_failures.values.candidates }}"
            concurrencyLimit: 1
            tasks:
              - id: call_restart_api
                type: io.kestra.plugin.core.http.Request
                description: Calls Kestra restart endpoint to re-execute failed task runs.
                uri: "{{ inputs.kestra_url }}/api/v1/executions/{{ item.value.id }}/actions/restart"
                method: POST
                headers: "{{ (inputs.api_token is not empty) ? {'Authorization': (inputs.api_token contains ' ' ? inputs.api_token : 'Bearer ' ~ inputs.api_token)} : {} }}"

          - id: settling_delay
            type: io.kestra.plugin.core.flow.Sleep
            description: Waits 15 seconds for restarted executions to initialize.
            duration: PT15S

          - id: verify_post_restart_states
            type: io.kestra.plugin.core.http.Request
            description: Queries the executions API to check if any runs are still failed.
            uri: "{{ inputs.kestra_url }}/api/v1/executions/search"
            method: GET
            headers: "{{ (inputs.api_token is not empty) ? {'Authorization': (inputs.api_token contains ' ' ? inputs.api_token : 'Bearer ' ~ inputs.api_token)} : {} }}"
            params:
              "filters[state][EQUALS]": "FAILED"
              "filters[namespace][EQUALS]": "{{ inputs.namespace }}"
              "size": "25"

          - id: notify_resolution_slack
            type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
            description: Sends restart summary to Slack with remaining failure count.
            url: "{{ secret('SLACK_WEBHOOK_URL') }}"
            messageText: |
              :white_check_mark: *Kestra Restart Summary*
              *Namespace:* `{{ inputs.namespace }}`
              *Restarted Count:* `{{ outputs.triage_failures.values.candidates | length }}`
              *Remaining Failures in Namespace:* `{{ outputs.verify_post_restart_states.body | jq('.total // 0') }}`
              *Verification:* Completed sequential replay run.
    else:
      - id: log_clean_state
        type: io.kestra.plugin.core.log.Log
        description: Logs when no failed executions are detected.
        message: "No failed executions found in namespace {{ inputs.namespace }}."

triggers:
  - id: hourly_failure_sweep
    type: io.kestra.plugin.core.trigger.Schedule
    description: Periodic hourly check. Disabled by default.
    cron: "0 * * * *"
    disabled: true

errors:
  - id: alert_on_flow_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alerts Slack if this workflow encounters an error.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    messageText: |
      :x: *Kestra Replay Flow Failed*
      *Execution:* `{{ execution.id }}`
      *Flow:* `{{ flow.id }}`
      *Namespace:* `{{ flow.namespace }}`
      Check task execution logs in Kestra UI.

extend:
  title: Triage and Replay Failed Kestra Executions
  metaTitle: Kestra Failed Execution DLQ Replay Engine
  shortDescription: Find failed Kestra executions, send details to Slack, and restart them behind an approval gate.
  metaDescription: Find failed Kestra executions, send details to Slack, and safely restart them behind an approval gate.
  description: |
    When a batch of workflows fails overnight from a network drop or a downstream API timeout,
    an alert tells you something broke, but someone still has to open the UI and restart each run.
    If thirty runs failed, doing that by hand is slow and easy to lose track of.

    This flow scans a namespace for failed executions, lists them in a dry run, and behind a Pause
    approval restarts them one by one through Kestra's restart API. After restarting, it queries the
    API again to check which runs cleared and which failed again.

    ## Safety

    Restarting workflows has side effects, so this flow includes safeguards:

    - Scope: Only executions in the chosen `namespace` are considered.
    - Self-exclusion: It never restarts itself or any run of this flow.
    - Ignored flows: `exclude_flows` lists flows that should not be automatically restarted.
    - Batch limit: `max_replays` caps how many executions are restarted in a single run.
    - Two flags required: Replay only runs when `auto_replay` is true and `dry_run` is false.
    - Human approval: A `Pause` task waits for an operator to confirm before any restart call runs.
    - Rate limit: The `Loop` uses `concurrencyLimit: 1` so executions restart one by one.

    ## How it works

    1. `query_failed_executions` (`io.kestra.plugin.core.http.Request`) calls `GET /api/v1/executions/search` with `filters[state][EQUALS]=FAILED` and `filters[namespace][EQUALS]`.
    2. `triage_failures` (`io.kestra.plugin.core.output.OutputValues`) filters out self-runs and flows listed in `exclude_flows`, then caps the list to `max_replays`.
    3. `check_candidate_count` (`io.kestra.plugin.core.flow.If`) branches: logs clean if no runs failed, or sends a Slack alert with the failing executions and start times.
    4. `evaluate_replay_permission` (`io.kestra.plugin.core.flow.If`) checks whether `auto_replay` is true and `dry_run` is false.
    5. `approve_replay` (`io.kestra.plugin.core.flow.Pause`) waits for confirmation before issuing restarts.
    6. `restart_candidates` (`io.kestra.plugin.core.flow.Loop`) calls `POST /api/v1/executions/{id}/actions/restart` for each execution one at a time.
    7. `settling_delay` (`io.kestra.plugin.core.flow.Sleep`) waits 15 seconds to give restarted executions time to initialize.
    8. `verify_post_restart_states` re-queries the API and `notify_resolution_slack` posts the final count of remaining failures.

    ## What you get

    - A list of failed executions in the namespace without opening each flow page.
    - A Slack summary showing which flows failed and when they started.
    - Safe-by-default execution that changes nothing unless both flags are set and approved.
    - A readback check that shows whether the restarted runs succeeded or stayed failed.

    ## Who it's for

    - Platform Engineers and SRE teams managing shared Kestra clusters.
    - Data Operations teams monitoring nightly ETL and batch orchestration pipelines.
    - Teams that want to restart transient failed executions without manually opening every run in the UI.

    ## Why orchestrate this with Kestra

    Running this as a Kestra flow means you don't need external monitoring scripts or cron jobs to check your cluster. Native HTTP tasks and Pause gates handle the API calls and human approval directly.

    ## Pitfalls

    - Deterministic bugs: An execution that failed from a syntax error or a bad schema will fail again when restarted. Use `exclude_flows` to keep those out of the replay queue.
    - Worker load: Restarting heavy data pipelines all at once can spike worker memory. The flow runs restarts sequentially (`concurrencyLimit: 1`) and caps batch size with `max_replays`.
    - Authentication: If your cluster requires authentication, pass your token in `api_token` so the HTTP requests include the authorization header.

    ## Prerequisites

    - Running Kestra 2.0+ cluster with accessible webserver API.
    - Slack incoming webhook URL for notifications.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Webhook URL for posting triage alerts and resolution summaries.

    ## Quick start

    1. Deploy the blueprint into your administrative namespace (e.g., `company.team`).
    2. Run a manual execution with `dry_run: true` to discover failed executions without triggering restarts.
    3. Review the Slack triage alert to verify identified candidate executions.
    4. When ready to restart, execute with `dry_run: false` and `auto_replay: true`, then approve the Pause task.
    5. Enable `hourly_failure_sweep` for continuous automated dead-letter monitoring.

    ## How to extend

    - Swap `notify_triage_slack` for Microsoft Teams or PagerDuty incident triggers.
    - Parse task run error logs with `/api/v1/logs/{executionId}` to distinguish network timeouts from bad input errors.
    - Add automated notifications to specific team channels based on the failed flow's namespace.

    ## Links

    - [Kestra Executions API Documentation](https://kestra.io/docs/api-reference)
    - [Kestra Loop Task Reference](https://kestra.io/plugins/core/tasks/flows/io.kestra.plugin.core.flow.loop)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
  tags:
    - Core
    - Infrastructure
  subTags:
    - Incident Response
    - Monitoring & Alerting
  ee: false
  demo: false
