id: inventory-cycle-count-abc
namespace: company.team

description: |
  Daily warehouse cycle counting with ABC classification. PLAN ranks the items by annual
  usage value into A, B and C, picks the items due for counting (A monthly, B quarterly,
  C twice a year, plus exception counts for negative or suspicious stock) within the day's
  capacity, and issues a blind count sheet. RECONCILE compares the counts with the system:
  inside the class tolerance the stock is adjusted, outside it a recount is required, and
  a confirmed variance above the approval limit waits for the controller. Inventory record
  accuracy is tracked per class.

inputs:
  - id: count_date
    type: STRING
    displayName: Count date
    defaults: "2026-10-01"
    validator: ^\d{4}-\d{2}-\d{2}$

  - id: phase
    type: SELECT
    displayName: Phase
    description: PLAN issues the count sheet for the day. RECONCILE takes the counts, and the recounts if any.
    values:
      - PLAN
      - RECONCILE
    defaults: PLAN

  - id: counts
    type: JSON
    displayName: Counts
    description: >-
      Quantities counted, by SKU, for example {"SKU-0007": 118}. Leave empty in the demo to use
      the simulated counts of the day.
    defaults: "{}"

  - id: recounts
    type: JSON
    displayName: Recounts
    description: Second counts, by SKU, for the items sent back for recount.
    defaults: "{}"

  - id: approved
    type: ARRAY
    itemType: STRING
    displayName: Adjustments approved
    description: SKUs whose adjustment above the approval limit the controller approved.
    defaults: []

  - id: daily_capacity
    type: INT
    displayName: Counts per day
    defaults: 25

  - id: approval_limit
    type: FLOAT
    displayName: Approval limit
    description: Adjustments worth more than this, either way, need the controller's approval.
    defaults: 500.0

  - id: scenario
    type: SELECT
    displayName: Demo scenario
    description: ISSUES adds a count for an item not on the plan and a negative count, which must stop the reconciliation.
    values:
      - CLEAN
      - ISSUES
    defaults: CLEAN

variables:
  state_key: cycle_counts
  pack_dir: "cycle-count/{{ inputs.count_date }}"

concurrency:
  limit: 1

tasks:
  - id: state
    type: io.kestra.plugin.core.output.OutputValues
    values:
      s: "{{ (kv(vars.state_key, errorOnMissing=false) ?? {'last_counted': {}, 'plans': {}, 'posted': {}}) | toJson }}"

  - id: count
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: >
      One DuckDB session: item master with cost and annual usage, on-hand stock and the last
      count dates (demo generator or your WMS/ERP), then the ABC ranking, the plan, and on
      RECONCILE the variances, tolerances, recounts, approvals and accuracy.
    outputFiles:
      - count_sheet
      - variances
      - adjustments
      - accuracy
      - blockers
    fetchType: FETCH_ONE
    sql: |
      SET VARIABLE d = DATE '{{ inputs.count_date }}';
      -- The demo stock is fixed, so PLAN and RECONCILE see the same warehouse.
      SET VARIABLE anchor = DATE '2026-10-01';
      CREATE TABLE st AS SELECT '{{ outputs.state.values.s | replace({"'": "''"}) }}'::JSON AS j;

      -- =======================================================================
      -- Item master and stock. Replace with your WMS or ERP.
      -- =======================================================================
      CREATE TABLE items AS
      SELECT 'SKU-' || lpad(i::VARCHAR, 4, '0') AS sku,
             'Item ' || i AS description,
             'A' || lpad((1 + i % 12)::VARCHAR, 2, '0') || '-' || (1 + i % 5) AS bin,
             round(CASE WHEN i <= 12 THEN 180 + i * 37 WHEN i <= 40 THEN 25 + i % 30 ELSE 2 + (hash(i) % 900) / 100.0 END, 2) AS unit_cost,
             (CASE WHEN i <= 12 THEN 900 + 75 * i WHEN i <= 40 THEN 1500 + 40 * i ELSE 200 + hash(i * 7) % 2500 END)::INT AS annual_units,
             (CASE WHEN i <= 12 THEN 60 + i * 5 WHEN i <= 40 THEN 120 + i ELSE 30 + hash(i * 3) % 400 END)::INT AS on_hand,
             -- Last count date before the demo started: spread so every class has items due.
             getvariable('anchor') - (CASE WHEN i <= 12 THEN 20 + (i * 3) % 18 WHEN i <= 40 THEN 40 + (i * 7) % 70 ELSE 60 + (i * 11) % 150 END)::INT AS seed_last_count
      FROM range(1, 201) t(i);
      -- Exceptions the system knows about: a negative balance and a zero-cost item.
      UPDATE items SET on_hand = -6 WHERE sku = 'SKU-0077';
      UPDATE items SET unit_cost = 0 WHERE sku = 'SKU-0150';

      -- =======================================================================
      -- ABC: A = items making 80% of the annual usage value, B = the next 15%.
      -- =======================================================================
      CREATE TABLE abc AS
      SELECT *, CASE WHEN cum_before < 0.80 THEN 'A' WHEN cum_before < 0.95 THEN 'B' ELSE 'C' END AS class
      FROM (SELECT *, annual_units * unit_cost AS usage_value,
                   coalesce(sum(annual_units * unit_cost) OVER (ORDER BY annual_units * unit_cost DESC, sku ROWS BETWEEN UNBOUNDED PRECEDING AND 1 PRECEDING), 0)
                     / sum(annual_units * unit_cost) OVER () AS cum_before
            FROM items);
      CREATE TABLE cadence (class VARCHAR, every_days INT, tolerance_pct DOUBLE, tolerance_value DOUBLE);
      INSERT INTO cadence VALUES ('A', 30, 0.5, 50), ('B', 90, 2.0, 100), ('C', 180, 5.0, 250);

      -- Last count: from KV once the flow has counted the item, else the seed date.
      CREATE TABLE last AS SELECT key AS sku, (value ->> '$')::DATE AS last_counted FROM json_each((SELECT j->'last_counted' FROM st));
      CREATE TABLE status AS
      SELECT a.*, c.every_days, c.tolerance_pct, c.tolerance_value, coalesce(l.last_counted, a.seed_last_count) AS last_counted,
             coalesce(l.last_counted, a.seed_last_count) + c.every_days AS due_on,
             CASE WHEN a.on_hand < 0 THEN 'NEGATIVE_STOCK' WHEN a.unit_cost = 0 THEN 'ZERO_COST' END AS exception
      FROM abc a JOIN cadence c USING (class) LEFT JOIN last l USING (sku);

      -- =======================================================================
      -- PLAN: exceptions first (at most once a week), then the most overdue items, A before B before C on the same date.
      -- On RECONCILE the plan stored at PLAN time is used, never a new one.
      -- =======================================================================
      CREATE TABLE planned AS
      SELECT sku FROM (
        SELECT sku, row_number() OVER (ORDER BY exception IS NULL, due_on, class, sku) AS rk
        FROM status WHERE (exception IS NOT NULL OR due_on <= getvariable('d')) AND '{{ inputs.phase }}' = 'PLAN'
          AND (exception IS NULL OR last_counted < getvariable('d') - 7)
      ) WHERE rk <= {{ inputs.daily_capacity }}
      UNION ALL
      SELECT unnest(from_json((SELECT j->'plans'->'{{ inputs.count_date }}' FROM st), '["VARCHAR"]')) WHERE '{{ inputs.phase }}' = 'RECONCILE';
      CREATE TABLE plan AS SELECT s.* FROM status s JOIN planned USING (sku);

      -- =======================================================================
      -- Counts. In the demo, empty counts are simulated: most items match, some
      -- are a little off, a few are far off and change on recount.
      -- =======================================================================
      CREATE TABLE given AS SELECT key AS sku, (value ->> '$')::DOUBLE AS qty FROM json_each('{{ inputs.counts | toJson }}');
      CREATE TABLE counted AS
      SELECT sku, qty FROM given
      UNION ALL
      SELECT sku, greatest(0, on_hand + CASE hash(sku || 'c') % 16 WHEN 0 THEN -(1 + on_hand // 8) WHEN 1 THEN 1 WHEN 2 THEN -1 WHEN 3 THEN 12 ELSE 0 END)
             + CASE WHEN sku = 'SKU-0077' THEN 6 ELSE 0 END
      FROM plan WHERE (SELECT count(*) FROM given) = 0;
      {% if inputs.scenario == 'ISSUES' %}
      INSERT INTO counted VALUES ('SKU-0199', 40), ('SKU-0003', -5);
      {% endif %}
      CREATE TABLE re AS SELECT key AS sku, (value ->> '$')::DOUBLE AS qty FROM json_each('{{ inputs.recounts | toJson }}');
      CREATE TABLE posted AS SELECT unnest(from_json((SELECT j->'posted'->'{{ inputs.count_date }}' FROM st), '["VARCHAR"]')) AS sku;

      CREATE TABLE blockers AS
      SELECT 'NO_PLAN' AS code, '{{ inputs.count_date }}' AS ref, 'No count plan for this date: run PLAN first' AS detail
        WHERE '{{ inputs.phase }}' = 'RECONCILE' AND NOT EXISTS (SELECT 1 FROM plan)
      UNION ALL SELECT 'NOT_ON_PLAN', sku, 'Counted but not on the plan: a count of an item chosen by the counter is not a cycle count'
        FROM counted WHERE '{{ inputs.phase }}' = 'RECONCILE' AND sku NOT IN (SELECT sku FROM plan)
      UNION ALL SELECT 'NEGATIVE_COUNT', sku, 'Counted ' || qty FROM counted WHERE qty < 0
      UNION ALL SELECT 'NEGATIVE_COUNT', sku, 'Recounted ' || qty FROM re WHERE qty < 0;

      -- =======================================================================
      -- RECONCILE. Tolerance: the class percentage of the system quantity, or the
      -- class value, whichever is larger. A recount confirms a variance when it
      -- lands within tolerance of the first count.
      -- =======================================================================
      CREATE TABLE v AS
      SELECT p.sku, p.description, p.bin, p.class, p.exception, p.unit_cost, p.on_hand AS system_qty, c.qty AS counted_qty, r.qty AS recount_qty,
             c.qty - p.on_hand AS variance_qty, round((c.qty - p.on_hand) * p.unit_cost, 2) AS variance_value,
             greatest(abs(p.on_hand) * p.tolerance_pct / 100, p.tolerance_value / nullif(p.unit_cost, 0), 0) AS tol_qty,
             p.sku IN (SELECT sku FROM posted) AS already_posted
      FROM plan p LEFT JOIN counted c USING (sku) LEFT JOIN re r USING (sku)
      WHERE '{{ inputs.phase }}' = 'RECONCILE';
      ALTER TABLE v ADD COLUMN final_qty DOUBLE; ALTER TABLE v ADD COLUMN outcome VARCHAR; ALTER TABLE v ADD COLUMN within_tolerance BOOLEAN;
      UPDATE v SET within_tolerance = abs(variance_qty) <= tol_qty;
      UPDATE v SET
        final_qty = CASE WHEN recount_qty IS NOT NULL THEN recount_qty ELSE counted_qty END,
        outcome = CASE
          WHEN already_posted THEN 'ALREADY_POSTED'
          WHEN counted_qty IS NULL THEN 'NOT_COUNTED'
          WHEN variance_qty = 0 THEN 'MATCH'
          WHEN within_tolerance THEN 'ADJUSTED'
          WHEN recount_qty IS NULL THEN 'RECOUNT_REQUIRED'
          WHEN abs(recount_qty - system_qty) <= tol_qty THEN 'ADJUSTED_AFTER_RECOUNT'
          WHEN abs(recount_qty - counted_qty) > tol_qty THEN 'RECOUNT_DISAGREES'
          WHEN abs((recount_qty - system_qty) * unit_cost) > {{ inputs.approval_limit }} AND sku NOT IN (SELECT unnest(from_json('{{ inputs.approved | toJson }}', '["VARCHAR"]'))) THEN 'NEEDS_APPROVAL'
          ELSE 'ADJUSTED_AFTER_RECOUNT' END;
      -- After a recount, the adjustment is against the recount.
      UPDATE v SET variance_qty = final_qty - system_qty, variance_value = round((final_qty - system_qty) * unit_cost, 2) WHERE recount_qty IS NOT NULL;

      CREATE TABLE adjustments AS
      SELECT sku, bin, class, system_qty, final_qty AS new_qty, variance_qty, variance_value, outcome FROM v
      WHERE outcome IN ('ADJUSTED', 'ADJUSTED_AFTER_RECOUNT') AND variance_qty <> 0 ORDER BY abs(variance_value) DESC;
      -- Record accuracy on the first count, per class: the share of items counted within tolerance.
      -- Items posted by an earlier run of the day are left out, so a rerun does not count them twice.
      CREATE TABLE accuracy AS
      SELECT class, count(*) AS counted, count(*) FILTER (WHERE within_tolerance) AS accurate,
             round(100.0 * count(*) FILTER (WHERE within_tolerance) / count(*), 1) AS ira_pct,
             round(sum(abs(variance_value)) FILTER (WHERE outcome IN ('ADJUSTED', 'ADJUSTED_AFTER_RECOUNT')), 2) AS abs_adjusted_value
      FROM v WHERE counted_qty IS NOT NULL AND NOT already_posted GROUP BY class ORDER BY class;

      -- Count sheet: blind, no system quantity, in walking order.
      COPY (SELECT bin, sku, description, class, coalesce(exception, '') AS reason, '' AS counted_qty FROM plan ORDER BY bin, sku) TO '{{ outputFiles.count_sheet }}' (HEADER, DELIMITER ',');
      COPY (SELECT * EXCLUDE (tol_qty, already_posted), round(tol_qty, 2) AS tolerance_qty FROM v ORDER BY outcome, abs(variance_value) DESC) TO '{{ outputFiles.variances }}' (HEADER, DELIMITER ',');
      COPY adjustments TO '{{ outputFiles.adjustments }}' (HEADER, DELIMITER ',');
      COPY accuracy TO '{{ outputFiles.accuracy }}' (HEADER, DELIMITER ',');
      COPY blockers TO '{{ outputFiles.blockers }}' (HEADER, DELIMITER ',');

      SELECT
        (SELECT string_agg(class || ' ' || n || ' items (' || round(100 * val / (SELECT sum(usage_value) FROM abc), 1) || '% of value)', ', ' ORDER BY class)
           FROM (SELECT class, count(*) AS n, sum(usage_value) AS val FROM abc GROUP BY class)) AS abc,
        (SELECT count(*) FROM status WHERE due_on <= getvariable('d') OR exception IS NOT NULL)::INT AS due,
        (SELECT count(*) FROM plan)::INT AS planned,
        (SELECT coalesce(string_agg(class || ' ' || n, ', ' ORDER BY class), '') FROM (SELECT class, count(*) AS n FROM plan GROUP BY class)) AS planned_by_class,
        (SELECT coalesce(string_agg(sku || ' ' || exception, ', '), '') FROM plan WHERE exception IS NOT NULL) AS exceptions,
        (SELECT to_json(list(sku ORDER BY sku)) FROM plan)::VARCHAR AS plan_skus,
        (SELECT coalesce(string_agg(outcome || ' ' || n, ', ' ORDER BY outcome), '') FROM (SELECT outcome, count(*) AS n FROM v GROUP BY outcome)) AS outcomes,
        (SELECT coalesce(string_agg(sku || ' (' || class || ', ' || variance_qty || ' units, ' || variance_value || ')', '; ' ORDER BY sku), '') FROM v WHERE outcome = 'RECOUNT_REQUIRED') AS recount_list,
        (SELECT coalesce(string_agg(sku || ' ' || variance_value, ', ' ORDER BY sku), '') FROM v WHERE outcome = 'NEEDS_APPROVAL') AS approval_list,
        (SELECT coalesce(string_agg(sku, ', ' ORDER BY sku), '') FROM v WHERE outcome = 'RECOUNT_DISAGREES') AS disagree_list,
        (SELECT count(*) FROM v WHERE outcome IN ('RECOUNT_REQUIRED', 'NEEDS_APPROVAL', 'RECOUNT_DISAGREES', 'NOT_COUNTED'))::INT AS open_items,
        (SELECT coalesce(round(sum(variance_value), 2), 0) FROM adjustments) AS net_adjustment,
        (SELECT coalesce(string_agg(class || ' ' || ira_pct || '%', ', ' ORDER BY class), 'no new count') FROM accuracy) AS ira,
        (SELECT to_json(coalesce(list(sku ORDER BY sku), [])) FROM v WHERE outcome IN ('MATCH', 'ADJUSTED', 'ADJUSTED_AFTER_RECOUNT'))::VARCHAR AS done_skus,
        (SELECT count(*) FROM blockers)::INT AS blockers,
        (SELECT coalesce(string_agg(code || ' ' || ref, ', ' ORDER BY code, ref), '') FROM blockers) AS blocker_detail;

  - id: result
    type: io.kestra.plugin.core.output.OutputValues
    values:
      r: "{{ (outputs.count.outputs | last).row | toJson }}"

  - id: log_count
    type: io.kestra.plugin.core.log.Log
    message: |
      Cycle count {{ inputs.count_date }}, {{ inputs.phase }} ({{ inputs.scenario }}). ABC: {{ outputs.result.values.r | jq('.abc') | first }}.
      {{ outputs.result.values.r | jq('"\(.due) items due, \(.planned) on the plan (\(.planned_by_class)). Exceptions: \(if .exceptions == "" then "none" else .exceptions end)."') | first }}
      {{ outputs.result.values.r | jq('if .outcomes == "" then "" else "Outcomes: \(.outcomes). Net adjustment \(.net_adjustment). Record accuracy of the items reconciled in this run: \(.ira)." end') | first }}
      {{ outputs.result.values.r | jq('if .recount_list == "" then "" else "Recount: \(.recount_list)" end') | first }}
      {{ outputs.result.values.r | jq('if .approval_list == "" then "" else "Needs approval: \(.approval_list)" end') | first }}
      {{ outputs.result.values.r | jq('if .disagree_list == "" then "" else "Recount disagrees with the count, count a third time: \(.disagree_list)" end') | first }}
      Blockers: {{ outputs.result.values.r | jq('.blockers') | first }} {{ outputs.result.values.r | jq('.blocker_detail') | first }}

  - id: evidence_blockers
    type: io.kestra.plugin.core.namespace.UploadFiles
    namespace: "{{ flow.namespace }}"
    filesMap:
      "{{ render(vars.pack_dir) }}/{{ inputs.phase | lower }}/blockers.csv": "{{ outputs.count.outputFiles.blockers }}"

  - id: gate
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.result.values.r | jq('.blockers > 0') | first }}"
    then:
      - id: blocked
        type: io.kestra.plugin.core.execution.Fail
        errorMessage: "Cycle count stopped: {{ outputs.result.values.r | jq('.blocker_detail') | first }}"

  - id: phase
    type: io.kestra.plugin.core.flow.Switch
    value: "{{ inputs.phase }}"
    cases:
      PLAN:
        - id: sheet
          type: io.kestra.plugin.core.namespace.UploadFiles
          namespace: "{{ flow.namespace }}"
          filesMap:
            "{{ render(vars.pack_dir) }}/count-sheet.csv": "{{ outputs.count.outputFiles.count_sheet }}"
        - id: save_plan
          type: io.kestra.plugin.core.kv.Set
          key: "{{ vars.state_key }}"
          kvType: JSON
          value: >-
            {{ {'s': fromJson(outputs.state.values.s), 'd': inputs.count_date, 'p': fromJson(fromJson(outputs.result.values.r).plan_skus)}
               | jq('.s + {plans: (.s.plans + {(.d): .p})}') | first | toJson }}
      RECONCILE:
        - id: reports
          type: io.kestra.plugin.core.namespace.UploadFiles
          namespace: "{{ flow.namespace }}"
          filesMap:
            "{{ render(vars.pack_dir) }}/reconcile/variances.csv": "{{ outputs.count.outputFiles.variances }}"
            "{{ render(vars.pack_dir) }}/reconcile/adjustments.csv": "{{ outputs.count.outputFiles.adjustments }}"
            "{{ render(vars.pack_dir) }}/reconcile/accuracy.csv": "{{ outputs.count.outputFiles.accuracy }}"
        - id: save_counts
          type: io.kestra.plugin.core.kv.Set
          description: Items matched or adjusted are counted for today and their adjustment is posted once. The rest stay on the plan.
          key: "{{ vars.state_key }}"
          kvType: JSON
          value: >-
            {{ {'s': fromJson(outputs.state.values.s), 'd': inputs.count_date, 'done': fromJson(fromJson(outputs.result.values.r).done_skus)}
               | jq('.s + {last_counted: (.s.last_counted + (.done | map({(.): $d}) | add // {}) ), posted: (.s.posted + {(.d): ((.s.posted[.d] // []) + .done | unique)})}' | replace({'$d': '"' ~ inputs.count_date ~ '"'})) | first | toJson }}
        - id: open_gate
          type: io.kestra.plugin.core.flow.If
          condition: "{{ outputs.result.values.r | jq('.open_items > 0') | first }}"
          then:
            - id: open_items
              type: io.kestra.plugin.core.execution.Fail
              errorMessage: "{{ outputs.result.values.r | jq('.open_items') | first }} items still open for {{ inputs.count_date }}: recount or approve them and run RECONCILE again. The adjustments already decided are posted."

triggers:
  - id: morning_plan
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 6 * * 1-5"
    disabled: true
    inputs:
      count_date: "{{ trigger.date | date('yyyy-MM-dd') }}"
      phase: PLAN

extend:
  title: Plan daily warehouse cycle counts by ABC class and reconcile variances with recounts and approvals
  metaTitle: Inventory cycle counting with ABC classification using Kestra and DuckDB
  shortDescription: Rank items into A, B and C by usage value, plan the day's blind count sheet within capacity, then adjust variances inside tolerance, require recounts outside it and hold large adjustments for approval, posting each one once.
  metaDescription: Cycle counting in Kestra and DuckDB. ABC classes, daily count plan, blind sheets, tolerances, recounts, approval limit, record accuracy and safe reruns.
  description: |
    Most warehouses stopped closing for a full annual stocktake long ago. They count a few items every day instead, the expensive and fast-moving ones more often than the rest. Auditors accept it when they can see the method: a class per item, a frequency per class, tolerances, recounts before an adjustment, and approval of large write-offs. Without a tool, the count plan is a spreadsheet, the same cheap items get counted while the A items go months without a count, and an adjustment entered twice doubles a write-off.

    This flow runs the programme in two phases a day. `PLAN` issues the morning's blind count sheet. `RECONCILE` takes the counts, then any recounts and approvals, as many times as needed.

    It runs with no setup and no network. The demo has 200 items, one with a negative balance and one with a zero cost. Simulated counts mostly match, some are a unit off, and a few are far off.

    This blueprint was created by [zkasuran](https://github.com/zkasuran).

    ## ABC and cadence

    Items are ranked by annual usage value (annual units × unit cost). A covers the first 80% of the value, B the next 15%, C the rest.

    | Class | Counted every | Tolerance |
    |---|---|---|
    | A | 30 days | 0.5% of the system quantity, or 50 in value |
    | B | 90 days | 2%, or 100 in value |
    | C | 180 days | 5%, or 250 in value |

    The tolerance is the larger of the two, so a slow C item is not recounted for one unit.

    ## The plan

    - Exception counts come first, at most once a week: negative stock and zero-cost items.
    - Then the most overdue items, A before B before C on the same due date, up to `daily_capacity`.
    - The count sheet is blind (no system quantity) and sorted by bin, in walking order.
    - The plan is stored in KV. `RECONCILE` uses that plan, never a new one.

    ## Reconciliation

    | Outcome | Rule |
    |---|---|
    | `MATCH` | Count equals the system |
    | `ADJUSTED` | Variance within tolerance: the stock is adjusted |
    | `RECOUNT_REQUIRED` | Variance outside tolerance: someone else counts again |
    | `ADJUSTED_AFTER_RECOUNT` | The recount lands near the system (a counting error), or confirms the first count and is under `approval_limit` or approved |
    | `NEEDS_APPROVAL` | Confirmed variance worth more than `approval_limit`, either way: the controller approves it in `approved` |
    | `RECOUNT_DISAGREES` | The recount is far from both the system and the first count: count a third time |
    | `ALREADY_POSTED` | Adjusted or matched by an earlier run of the day: never posted twice |

    Record accuracy is the share of first counts within tolerance, per class. It is computed on the items reconciled in the run.

    ## How it works

    1. `state` loads the last count dates, the plans and the items posted, per date.
    2. `count` (`io.kestra.plugin.jdbc.duckdb.Queries`) holds the items and stock. It ranks them, plans the day or reconciles the counts, and computes accuracy.
    3. `log_count` prints the classes, the plan, the outcomes, the recounts and the approvals. `evidence_blockers` stores `blockers.csv`.
    4. `gate` stops on blockers before anything is written: `RECONCILE` for a date with no plan, a count for an item not on the plan (a count chosen by the counter is not a cycle count), a negative count.
    5. On `PLAN`, `sheet` stores `count-sheet.csv` and `save_plan` stores the plan.
    6. On `RECONCILE`:
       - `reports` stores `variances.csv`, `adjustments.csv` and `accuracy.csv`;
       - `save_counts` records the items done, for the cadence and against double posting;
       - `open_gate` fails while items still need a recount or an approval.

    ## Tested end to end

    On Kestra 2.0.5 OSS.

    | Run | Inputs | Result |
    |---|---|---|
    | 1 | `PLAN` 2026-10-01 | A 31 items (80.2% of value), B 66, C 103. 90 due, 25 planned (A 3, B 20, C 2) including the two exceptions |
    | 2 | `RECONCILE` | 16 match, 7 adjusted (net +98.27), 2 recounts: SKU-0019 (A, -18 units, -792) and SKU-0109 (B, +12 units). Accuracy A 66.7%, B 95.0%, C 100%. Fails with 2 items open |
    | 3 | Recounts | SKU-0109 recount equals the system: no adjustment. SKU-0019 confirmed at -792, above the 500 limit: `NEEDS_APPROVAL`. The 23 posted earlier are `ALREADY_POSTED` |
    | 4 | Approved `SKU-0019` | Adjusted by -792. Succeeds |
    | 5 | `RECONCILE` again | All 25 `ALREADY_POSTED`, nothing posted twice |
    | 6 | `PLAN` 2026-10-02 | 25 new items, none counted the day before |
    | 7 | `RECONCILE` 2026-10-05 | Blocked: no plan for that date |
    | 8 | `ISSUES` | Blocked: a count for SKU-0199, not on the plan, and a negative count |

    I recomputed the tolerance and outcome of the 25 first counts independently in Python from `variances.csv`, and the net adjustment of 98.27. Every value matches.

    ## Inputs

    | Input | Default | Purpose |
    |---|---|---|
    | `count_date` | `2026-10-01` | Count day |
    | `phase` | `PLAN` | `PLAN` or `RECONCILE` |
    | `counts` | `{}` | Counted quantities by SKU. Empty uses the demo counts |
    | `recounts` | `{}` | Second counts |
    | `approved` | `[]` | Adjustments approved by the controller |
    | `daily_capacity` | `25` | Counts per day |
    | `approval_limit` | `500.0` | Value above which an adjustment needs approval |
    | `scenario` | `CLEAN` | Demo only |

    ## Use it with your data

    - Replace `items` with your WMS or ERP item master and on-hand stock, and remove the simulated counts.
    - Enable the `morning_plan` trigger. Send `count-sheet.csv` to the counters' handhelds, and run `RECONCILE` with their counts from your scanner app or a webhook.
    - Post `adjustments.csv` to the ERP from a task after `save_counts`.

    ## Things to know

    - Count when the bin is not moving, or freeze the system quantity at the start of the count. Otherwise picks during the count show up as variances.
    - Re-run `PLAN` after a reclassification: the class is computed each time from the last 12 months of usage you load.

    ## Links

    - DuckDB window functions: https://duckdb.org/docs/sql/functions/window_functions
    - KV store: https://kestra.io/docs/concepts/kv-store
  tags:
    - Business
    - Data
  subTags:
