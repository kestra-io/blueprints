id: aws-sqs-fifo-message-group-blocking-sentinel
namespace: company.cloud

inputs:
  - id: aws_region
    type: STRING
    defaults: "us-east-1"
    description: AWS Region where SQS FIFO queue is hosted.
  - id: queue_url
    type: STRING
    description: Full URL of AWS SQS FIFO queue.
  - id: max_in_flight
    type: INT
    defaults: 100
    description: "Maximum allowable in-flight unacknowledged messages before alerting (default 100)."

tasks:
  - id: inspect_queue_attributes
    type: io.kestra.plugin.aws.cli.AwsCLI
    accessKeyId: "{{ secret('AWS_ACCESS_KEY_ID') }}"
    secretKeyId: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
    region: "{{ inputs.aws_region }}"
    commands:
      - |
        # Query SQS queue attributes
        aws sqs get-queue-attributes           --queue-url "{{ inputs.queue_url }}"           --attribute-names ApproximateNumberOfMessagesNotVisible ApproximateNumberOfMessagesDelayed           --output json > /tmp/sqs_telemetry.json
        
        IN_FLIGHT=$(jq -r '.Attributes.ApproximateNumberOfMessagesNotVisible // "0"' /tmp/sqs_telemetry.json)
        DELAYED=$(jq -r '.Attributes.ApproximateNumberOfMessagesDelayed // "0"' /tmp/sqs_telemetry.json)
        
        echo "::set-output name=in_flight::$IN_FLIGHT::"
        echo "::set-output name=delayed::$DELAYED::"

  - id: evaluate_fifo_blocking
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.inspect_queue_attributes.vars.in_flight | int > inputs.max_in_flight }}"
    then:
      - id: notify_platform_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#cloud-ops",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 AWS SQS FIFO Head-of-Line Blocking Alert",
                "text": "SQS FIFO Queue `{{ inputs.queue_url }}` has *{{ outputs.inspect_queue_attributes.vars.in_flight }} in-flight unacknowledged messages*! Poison pill messages or slow consumers are blocking entire MessageGroupID partitions from progressing.",
                "footer": "Kestra Cloud Sentinel • Amazon SQS FIFO"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#cloud-ops",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ AWS SQS FIFO Sentinel Failure",
            "text": "Failed to query SQS queue attributes. Verify queue URL and AWS credentials.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  title: AWS SQS FIFO Queue In-Flight Message Group Head-of-Line Blocking Sentinel
  shortDescription: Audits AWS SQS FIFO queues for high in-flight message counts indicating poisoned message group head-of-line blocking.
  description: |
    ## How it works
    This workflow uses the Kestra AWS CLI plugin to inspect `ApproximateNumberOfMessagesNotVisible` on Amazon SQS FIFO queues (`.fifo`). In SQS FIFO queues, messages within the same `MessageGroupId` are strictly delivered in order. If a downstream consumer fails or crashes while processing a message, that message remains in-flight until the visibility timeout expires. Crucially, until that message is deleted or expires, SQS blocks all subsequent messages in that same MessageGroupId. When in-flight message counts accumulate, head-of-line blocking has paralyzed message partitions. This workflow alerts operators immediately.

    ## What you get
    - Real-time detection of head-of-line blocking in AWS SQS FIFO queues.
    - Prevents silent stalling of ordered event processing partitions.
    - Quantitative tracking of in-flight and delayed queue messages.

    ## Who it's for
    - Event-Driven Architecture Specialists and Backend Microservice Leads.
    - Cloud Infrastructure and SRE teams managing AWS serverless messaging.

    ## Why orchestrate this with Kestra
    - **Native AWS CLI Automation**: Executes authentic AWS CLI commands using Kestra IAM secrets.
    - **Continuous Health Auditing**: Periodically polls queue attributes without standalone monitoring agents.
    - **Instant Team Escalation**: Delivers incident alerts directly to Slack with queue URLs.

    ## Prerequisites
    - AWS IAM User or Role with `sqs:GetQueueAttributes` permissions.
    - Secrets `AWS_ACCESS_KEY_ID`, `AWS_SECRET_ACCESS_KEY`, and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import the blueprint.
    2. Input AWS region, SQS queue URL, and in-flight threshold.
    3. Run the workflow to inspect FIFO queue attributes.

    ## How to extend
    - Route blocked messages automatically to an SQS Dead Letter Queue (DLQ).
    - Correlate with consumer Lambda or ECS worker error logs.

    ## Links
    - [Amazon SQS FIFO Queues Documentation](https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/FIFO-queues.html)
    - [Kestra AWS CLI Plugin](https://kestra.io/plugins/plugin-aws/io.kestra.plugin.aws.cli.awscli)
  tags:
    - Cloud
    - Infrastructure
  ee: false
  demo: false
