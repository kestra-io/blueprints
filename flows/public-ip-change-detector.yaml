id: public-ip-change-detector
namespace: company.team
description: |
  Fetch the public IP your Kestra worker egresses from, compare it with the last
  saved value, and log and remember it whenever it changes.

triggers:
  - id: every_15_minutes
    type: io.kestra.plugin.core.trigger.Schedule
    description: Check the egress IP every 15 minutes; shipped disabled so it does not run until you enable it.
    cron: "*/15 * * * *"
    disabled: true
  - id: manual_webhook
    type: io.kestra.plugin.core.trigger.Webhook
    description: Call on demand, for example after a VPN or NAT gateway change, to re-check right away.
    key: public-ip-check

inputs:
  - id: ip_service_url
    type: URI
    defaults: https://api.ipify.org?format=json
    description: Endpoint that returns the caller's public IP as JSON like {"ip":"203.0.113.7"}.
  - id: kv_key
    type: STRING
    defaults: public_ip_last
    description: Key in the Kestra KV store where the last seen IP is saved.

tasks:
  - id: fetch_ip
    type: io.kestra.plugin.core.http.Request
    description: Ask the IP service which address this worker's traffic comes from.
    uri: "{{ inputs.ip_service_url }}"
    method: GET

  - id: read_last_ip
    type: io.kestra.plugin.core.kv.Get
    description: Load the IP saved by the previous run. Missing on the very first run, which is fine.
    key: "{{ inputs.kv_key }}"
    errorOnMissing: false

  - id: compare_ip
    type: io.kestra.plugin.scripts.shell.Commands
    description: Validate the response looks like an IP address, then classify the run as first_run, unchanged or changed and emit it through the stdout outputs protocol. A malformed response fails the task instead of being saved as an IP.
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    env:
      CURRENT_IP: "{{ fromJson(outputs.fetch_ip.body).ip }}"
      PREVIOUS_IP: "{{ outputs.read_last_ip.value ?? '' }}"
    commands:
      - |
        set -eu
        if ! echo "$CURRENT_IP" | grep -Eq '^([0-9]{1,3}\.){3}[0-9]{1,3}$|^[0-9a-fA-F:]+:[0-9a-fA-F:]*$'; then
          echo "Unexpected response from the IP service: '$CURRENT_IP'" >&2
          exit 1
        fi
        if [ -z "$PREVIOUS_IP" ]; then status=first_run
        elif [ "$PREVIOUS_IP" = "$CURRENT_IP" ]; then status=unchanged
        else status=changed
        fi
        echo "current=$CURRENT_IP previous=${PREVIOUS_IP:-none} status=$status"
        echo "::{\"outputs\":{\"status\":\"$status\"}}::"

  - id: handle_result
    type: io.kestra.plugin.core.flow.If
    description: Do something only when the IP is new or changed; otherwise just record that nothing moved.
    condition: "{{ outputs.compare_ip.vars.status != 'unchanged' }}"
    then:
      - id: save_ip
        type: io.kestra.plugin.core.kv.Set
        description: Remember the new IP so the next run compares against it.
        key: "{{ inputs.kv_key }}"
        value: "{{ fromJson(outputs.fetch_ip.body).ip }}"

      - id: log_change
        type: io.kestra.plugin.core.log.Log
        level: WARN
        description: Surface the change at WARN level. Replace with a Slack, email or ticket task to notify your team.
        message: "Public IP {{ outputs.compare_ip.vars.status }}: {{ outputs.read_last_ip.value ?? 'none' }} -> {{ fromJson(outputs.fetch_ip.body).ip }}. Allow-lists that reference the old address may need updating."
    else:
      - id: log_unchanged
        type: io.kestra.plugin.core.log.Log
        description: Leave a trail so the execution history shows the check ran and the IP held steady.
        message: "Public IP unchanged: {{ fromJson(outputs.fetch_ip.body).ip }}."

outputs:
  - id: current_ip
    type: STRING
    description: The public IP seen by this run.
    value: "{{ fromJson(outputs.fetch_ip.body).ip }}"
  - id: status
    type: STRING
    description: first_run, unchanged or changed.
    value: "{{ outputs.compare_ip.vars.status }}"

extend:
  title: Detect Public IP Changes with the KV Store
  shortDescription: Check your egress IP on a schedule, compare it with the last saved value, and flag any change.
  metaTitle: Public IP Change Detector
  metaDescription: Fetch your public IP, compare it with the last value in the KV store, and flag changes. Schedule and webhook triggers, no secrets or Docker needed.
  description: |
    Home labs, VPNs and NAT gateways change their public IP without telling you, and then allow-lists and firewall rules quietly stop matching. This blueprint checks the egress IP, remembers it, and flags the moment it changes.

    ## How it works

    1. `fetch_ip` (`io.kestra.plugin.core.http.Request`) asks an IP service for the address your worker's traffic comes from.
    2. `read_last_ip` (`io.kestra.plugin.core.kv.Get`) loads the IP saved by the previous run.
    3. `compare_ip` (`io.kestra.plugin.scripts.shell.Commands`, Process runner) validates the response looks like an IP, then reports `first_run`, `unchanged` or `changed` through the `::{"outputs": ...}::` protocol.
    4. `handle_result` (`io.kestra.plugin.core.flow.If`) saves the new IP and logs a WARN when it is new or changed, otherwise logs that it held steady.
    5. Triggers: a `Schedule` every 15 minutes (shipped disabled) and a `Webhook` (`public-ip-check`) for on-demand checks.

    ## What you get

    - A saved record of the last known egress IP in the KV store.
    - A WARN log, with the old and new address, the moment it changes.
    - `current_ip` and `status` outputs you can reuse from a subflow.

    ## Who it's for

    - Home-lab and self-hosting users on a dynamic IP.
    - Teams whose partners allow-list their NAT or VPN address.
    - Anyone debugging "it worked yesterday" firewall problems.

    ## Why orchestrate this with Kestra

    The check itself is one HTTP call. Kestra supplies the memory between runs (the KV store), the schedule, the branch on change, and an execution history that shows exactly when the address moved.

    ## Prerequisites

    - No secrets, Docker or extra services.
    - The Kestra worker needs outbound HTTPS access to the IP service.
    - A `sh` shell and `grep` on the worker, which any Linux Kestra image has.

    ### Inputs

    - `ip_service_url` (URI, default `https://api.ipify.org?format=json`): any endpoint that returns `{"ip": "..."}`.
    - `kv_key` (STRING, default `public_ip_last`): KV key where the last IP is stored.

    ## Quick start

    1. Save the flow and click Execute. The first run reports `first_run` and stores your IP.
    2. Execute again. It should report `unchanged`.
    3. To see a change, edit the `public_ip_last` value in the namespace KV store to a different IP and run again. It reports `changed`.
    4. Enable the `every_15_minutes` trigger when you are happy.

    ## Example outputs

    - `outputs.current_ip`: `203.0.113.7`
    - `outputs.status`: `unchanged`

    ## How to extend

    - Replace `log_change` with a Slack, email or Jira task to notify your team.
    - Add a call to your DNS provider to update a record when the IP changes.
    - Keep a history by also writing each change to a KV key with a timestamp.

    ## Links

    - [Kestra KV store](https://kestra.io/docs/concepts/kv-store)
    - [ipify public IP API](https://www.ipify.org/)
    - This blueprint has been created by [UdayaKrishnanM](https://github.com/UdayaKrishnanM)
  tags:
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - Infrastructure Automation
  ee: false
  demo: false
