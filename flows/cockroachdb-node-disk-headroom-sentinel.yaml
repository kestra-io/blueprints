id: cockroachdb-node-disk-headroom-sentinel
namespace: company.database

inputs:
  - id: crdb_host
    type: STRING
    defaults: "cockroachdb.internal"
    description: Hostname of the CockroachDB cluster node.
  - id: crdb_port
    type: INT
    defaults: 26257
    description: Port of the CockroachDB cluster node.
  - id: crdb_database
    type: STRING
    defaults: "system"
    description: CockroachDB database name.
  - id: max_disk_utilization_pct
    type: INT
    defaults: 85
    description: "Maximum allowable node disk utilization percentage before alerting (default 85%)."

tasks:
  - id: inspect_node_capacity
    type: io.kestra.plugin.jdbc.postgresql.Query
    url: "jdbc:postgresql://{{ inputs.crdb_host }}:{{ inputs.crdb_port }}/{{ inputs.crdb_database }}?sslmode=disable"
    username: "{{ secret('CRDB_USER') }}"
    password: "{{ secret('CRDB_PASSWORD') }}"
    sql: |
      SELECT node_id,
             ROUND(100.0 * (capacity - available) / NULLIF(capacity, 0), 1) AS used_percentage,
             (capacity - available) / (1024*1024*1024) AS used_gb,
             capacity / (1024*1024*1024) AS capacity_gb
      FROM crdb_internal.kv_node_status
      WHERE capacity > 0
        AND ROUND(100.0 * (capacity - available) / NULLIF(capacity, 0), 1) >= {{ inputs.max_disk_utilization_pct }}
      ORDER BY used_percentage DESC;
    fetchType: FETCH

  - id: evaluate_storage_saturation
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.inspect_node_capacity.size > 0 }}"
    then:
      - id: notify_dba_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#dba-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 CockroachDB Node Disk Capacity Alert",
                "text": "Detected {{ outputs.inspect_node_capacity.size }} CockroachDB node(s) exceeding {{ inputs.max_disk_utilization_pct }}% disk capacity. Nodes near capacity will reject range rebalancing and write operations.",
                "footer": "Kestra Database Sentinel • CockroachDB"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#dba-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ CockroachDB Sentinel Failure",
            "text": "Failed to query node status table on CockroachDB cluster {{ inputs.crdb_host }}.",
            "footer": "Kestra Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 * * * *"
    disabled: true

extend:
  ee: false
  demo: false
  title: CockroachDB Storage Capacity and Node Headroom Sentinel
  shortDescription: Audits CockroachDB cluster nodes for disk storage saturation to prevent range write rejection.
  description: |
    ## How it works
    This workflow connects directly to CockroachDB via PostgreSQL JDBC (`io.kestra.plugin.jdbc.postgresql.Query`) to audit internal node storage metrics in `crdb_internal.kv_node_status`. In distributed SQL architectures like CockroachDB, Raft ranges are continuously rebalanced across storage nodes. When individual nodes reach disk capacity thresholds, CockroachDB halts range replication and read-write transactions to prevent Pebble storage engine corruption. This sentinel calculates disk utilization percentages for each cluster node and alerts DBAs before nodes mark themselves read-only.

    ## What you get
    - Real-time visibility into per-node disk capacity in CockroachDB clusters.
    - Early warning before cluster range rebalancing fails and writes abort.
    - Actionable Slack notifications detailing node counts exceeding capacity thresholds.

    ## Who it's for
    - Database Administrators operating distributed SQL clusters.
    - SREs maintaining mission-critical transactional storage backends.
    - Platform Engineers sizing cloud persistent disks for Kubernetes stateful sets.

    ## Why orchestrate this with Kestra
    - **Native PostgreSQL Wire Compatibility**: Uses standard JDBC driver with encrypted credential injection.
    - **Scheduled Surveillance**: Periodically inspects storage health without Prometheus dependencies.
    - **Automated Remediation**: Can trigger Kubernetes PersistentVolume expansion or scale out worker stateful sets.

    ## Prerequisites
    - CockroachDB cluster with accessible SQL port (`26257`).
    - Dedicated read-only monitoring user with access to `crdb_internal`.
    - Secrets `CRDB_USER`, `CRDB_PASSWORD`, and `SLACK_WEBHOOK` configured.

    ## Quick start
    1. Import this blueprint into your Kestra workspace.
    2. Add `CRDB_USER`, `CRDB_PASSWORD`, and `SLACK_WEBHOOK` secrets.
    3. Specify `crdb_host`, `crdb_port`, and `max_disk_utilization_pct`.
    4. Enable the schedule trigger for continuous storage surveillance.

    ## How to extend
    - Inspect under-replicated range counts via `crdb_internal.ranges`.
    - Trigger automated cloud volume resize operations when utilization exceeds 85%.
    - Route critical alerts to PagerDuty or Opsgenie.

    ## Links
    - [CockroachDB Monitoring Documentation](https://www.cockroachlabs.com/docs/stable/monitoring-and-alerting)
    - [Kestra PostgreSQL Plugin](https://kestra.io/plugins/plugin-jdbc-postgresql)
    - [Kestra Slack Notifications](https://kestra.io/plugins/plugin-slack)
  tags:
    - Data
    - Infrastructure
