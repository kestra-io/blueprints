id: db2-cdc-stream-and-change-table-backlog-sentinel
namespace: company.dataops

inputs:
  - id: db2_hostname
    type: STRING
    defaults: "localhost"
    description: Hostname or IP address of the IBM Db2 LUW database server.

  - id: db2_port
    type: STRING
    defaults: "50000"
    description: Port number for the Db2 database instance (standard default 50000).

  - id: db2_database
    type: STRING
    defaults: "sample"
    description: Name of the Db2 database to inspect for active Change Data Capture (CDC) events.

  - id: max_backlog_threshold
    type: INT
    defaults: 250
    description: Threshold of unconsumed change records within a single audit probe before signaling an ingestion backlog surge.

  - id: probe_max_records
    type: INT
    defaults: 500
    description: Maximum number of CDC change records to drain during the diagnostic probe cycle.

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 */3 * * *"
    disabled: true
    inputs:
      db2_hostname: "localhost"
      db2_port: "50000"
      db2_database: "sample"
      max_backlog_threshold: 250
      probe_max_records: 500

tasks:
  - id: probe_cdc_stream
    type: io.kestra.plugin.debezium.db2.Capture
    hostname: "{{ inputs.db2_hostname }}"
    port: "{{ inputs.db2_port }}"
    username: "{{ secret('DB2_USERNAME') }}"
    password: "{{ secret('DB2_PASSWORD') }}"
    database: "{{ inputs.db2_database }}"
    snapshotMode: INITIAL
    maxRecords: "{{ inputs.probe_max_records }}"
    allowFailure: true
    description: Connects to Db2 transaction logs via Debezium engine to sample active change records and verify capture pipeline throughput.

  - id: classify_cdc_posture
    type: io.kestra.plugin.core.debug.Return
    format: >-
      {{
        (outputs.probe_cdc_stream is not defined or outputs.probe_cdc_stream.size is not defined) ? 'DB2_CONNECTION_FAILED' :
        (outputs.probe_cdc_stream.size >= inputs.max_backlog_threshold) ? 'HIGH_BACKLOG_SURGE' :
        (outputs.probe_cdc_stream.size == 0) ? 'ZERO_EVENT_IDLE' :
        'HEALTHY'
      }}
    description: Evaluates captured event volume against operational thresholds using Pebble logic to determine CDC pipeline health.

  - id: route_posture_action
    type: io.kestra.plugin.core.flow.Switch
    value: "{{ outputs.classify_cdc_posture.value }}"
    cases:
      HIGH_BACKLOG_SURGE:
        - id: alert_backlog_surge
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: "{{ {'text': '🚨 *CRITICAL: IBM Db2 CDC Event Backlog Surge Detected*\n• *Database:* `' ~ inputs.db2_database ~ '`\n• *Endpoint:* `' ~ inputs.db2_hostname ~ ':' ~ inputs.db2_port ~ '`\n• *Captured Records:* ' ~ outputs.probe_cdc_stream.size ~ ' (Threshold: ' ~ inputs.max_backlog_threshold ~ ')\n• *Execution ID:* `' ~ execution.id ~ '`\n*Action Required:* Downstream CDC consumer lag or uncommitted transaction spikes detected; inspect Db2 transaction log archive headroom.'} | toJson }}"

      ZERO_EVENT_IDLE:
        - id: log_cdc_idle
          type: io.kestra.plugin.core.log.Log
          message: "Db2 CDC stream on '{{ inputs.db2_database }}' returned 0 records. System is idle or current offset is fully caught up."

      DB2_CONNECTION_FAILED:
        - id: alert_connection_failure
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: "{{ {'text': '🔥 *ALERT: IBM Db2 Instance Unreachable*\n• *Endpoint:* `' ~ inputs.db2_hostname ~ ':' ~ inputs.db2_port ~ '`\n• *Database:* `' ~ inputs.db2_database ~ '`\n• *Error:* Unable to establish connection to Db2 server or initialize Debezium capture engine.\n• *Execution ID:* `' ~ execution.id ~ '`'} | toJson }}"

      HEALTHY:
        - id: log_cdc_healthy
          type: io.kestra.plugin.core.log.Log
          message: "Db2 CDC stream for '{{ inputs.db2_database }}' is healthy. Processed {{ outputs.probe_cdc_stream.size }} events within normal operating headroom."
    description: Routes Slack incident notifications or diagnostic logs depending on evaluated change data capture health.

  - id: audit_sentinel_run
    type: io.kestra.plugin.core.log.Log
    message: "Db2 CDC sentinel cycle complete for execution {{ execution.id }}. Verdict: {{ outputs.classify_cdc_posture.value }}, Total Events Captured: {{ outputs.probe_cdc_stream.size ?? 0 }}, Storage Key: {{ outputs.probe_cdc_stream.stateOffsetKey ?? 'N/A' }}."
    description: Emits an immutable audit log entry capturing CDC record counts and cycle verdicts.

errors:
  - id: alert_flow_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: "{{ {'text': '❌ *Db2 CDC Sentinel Execution Error*\nFlow failed during execution `' ~ execution.id ~ '` against `' ~ inputs.db2_hostname ~ ':' ~ inputs.db2_port ~ '`. Inspect Kestra run logs for details.'} | toJson }}"

extend:
  title: IBM Db2 CDC Stream and Change Table Backlog Sentinel
  metaTitle: IBM Db2 CDC Stream & Backlog Sentinel | Kestra
  shortDescription: Audit IBM Db2 Change Data Capture streams using Debezium, detect unconsumed transaction backlogs, and alert Slack.
  metaDescription: Audit IBM Db2 CDC streams using Debezium, sample change event throughput, detect unconsumed transaction backlogs, and dispatch Slack alerts.
  description: |
    In enterprise architectures relying on IBM Db2 LUW or mainframe data platforms for core transactional operations, Change Data Capture (CDC) via Debezium provides the critical backbone for real-time data replication into event hubs, streaming pipelines, and analytical data warehouses. When sudden batch workloads generate spikes in change events or downstream consumers experience network throttling, unconsumed CDC events accumulate in Db2 transaction log buffers. Left unmonitored, log archives exhaust disk space and replication pipelines experience severe data drift.

    This blueprint implements an automated Day 2 operations sentinel for IBM Db2 CDC pipelines. On a scheduled cadence, it executes a bounded diagnostic capture cycle (`io.kestra.plugin.debezium.db2.Capture`) with strict limits, samples active change records, calculates throughput health against SLA thresholds, and alerts data platform engineers via Slack before consumer lag impacts production downstream systems.

    ## How it works

    1. The `periodic_schedule` trigger runs the flow on a 3-hour cadence with default connection parameters, configured in a disabled state for safe deployment.
    2. `probe_cdc_stream` (`io.kestra.plugin.debezium.db2.Capture`) initializes the Debezium Db2 connector, connects to the target server, and reads a sample batch of change events up to `probe_max_records`.
    3. `classify_cdc_posture` (`io.kestra.plugin.core.debug.Return`) evaluates query outputs against configured warning and critical thresholds via Pebble, classifying state into `DB2_CONNECTION_FAILED`, `HIGH_BACKLOG_SURGE`, `ZERO_EVENT_IDLE`, or `HEALTHY`.
    4. `route_posture_action` (`io.kestra.plugin.core.flow.Switch`) directs subsequent steps: high backlog surges and connection drops dispatch high-urgency Slack incident alerts, while idle and normal throughput states emit diagnostic logs.
    5. `audit_sentinel_run` (`io.kestra.plugin.core.log.Log`) writes an immutable summary entry capturing the execution ID, evaluated verdict, and total event count for compliance auditing.
    6. A flow-level `errors` handler catches uncaught connection drops or authentication timeouts and dispatches an incident alert to Slack.

    ## What you get

    - Automated, continuous validation of IBM Db2 CDC streaming pipeline health and connectivity.
    - Early warning detection of transaction log backlog accumulation and consumer lag.
    - Strict SLA verification on change event batch sizes before downstream replication drifts.
    - Actionable Slack notifications pinpointing target database endpoints, captured event counts, and observed thresholds.
    - Full execution audit history tracking CDC event volumes over time.

    ## Who it's for

    - Data Platform Engineers and Database Administrators managing IBM Db2 core transactional systems.
    - Data Integration Engineers operating Debezium and Kafka streaming CDC architectures.
    - Site Reliability Engineers (SREs) monitoring enterprise data pipeline throughput and replication reliability.

    ## Why orchestrate this with Kestra

    Monitoring CDC pipelines with disparate shell scripts creates unmanaged infrastructure, plain-text credential leaks, and silent script failures. Kestra delivers certified Debezium Db2 integration, centralized secret masking, declarative scheduling, robust failure retries, and unified alerting without installing or maintaining specialized host monitoring daemons.

    ## Prerequisites

    - A running IBM Db2 LUW instance (version 10.5+ or 11.5+) with CDC / ASN capture tables enabled, reachable from the Kestra worker environment.
    - Database user credentials with permissions to read target tables and Db2 CDC control tables.
    - An incoming Slack Webhook URL configured in Kestra namespace secrets.

    ### Secrets

    - `DB2_USERNAME`: Database user login authorized to connect to the Db2 instance.
    - `DB2_PASSWORD`: Password for the designated Db2 database user.
    - `SLACK_WEBHOOK_URL`: The destination Slack webhook URL for operational incident dispatching.

    ## Quick start

    1. Configure `DB2_USERNAME`, `DB2_PASSWORD`, and `SLACK_WEBHOOK_URL` in your Kestra namespace secrets.
    2. Start a local IBM Db2 Community Edition container for testing:
       ```bash
       docker run -d --name db2-sentinel \
         -p 50000:50000 \
         -e DB2INST1_PASSWORD=my_secret_pass \
         -e LICENSE=accept \
         icr.io/db2_community/db2:latest
       ```
    3. Connect the container to your local Kestra network:
       ```bash
       docker network connect YOUR_KESTRA_NETWORK db2-sentinel
       ```
    4. Execute a manual test run in the Kestra UI with `db2_hostname: "db2-sentinel"`.
    5. Verify execution logs confirm successful event sampling and pipeline classification (`HEALTHY` or `ZERO_EVENT_IDLE`).
    6. Enable the `periodic_schedule` trigger to activate autonomous background monitoring.

    ## How to extend

    - Add downstream offset commits by storing `stateOffsetKey` into Kestra namespace KV storage for continuous incremental replication.
    - Route critical backlog alerts to PagerDuty via `io.kestra.plugin.pagerduty` when unconsumed records exceed 1,000 events.
    - Chaining an `io.kestra.plugin.core.flow.If` condition to trigger downstream warehouse refresh jobs only when new CDC events are detected.

    ## Links

    - [Kestra Debezium Db2 Plugin Documentation](https://kestra.io/plugins/plugin-debezium/db2)
    - [Debezium Db2 Connector Documentation](https://debezium.io/documentation/reference/stable/connectors/db2.html)
    - [IBM Db2 Change Data Capture Architecture](https://www.ibm.com/docs/en/db2/)
