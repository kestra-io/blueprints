# Preserve supported HTTP CloudEvents while routing valid and rejected events to Kafka.
id: cloudevents-http-to-kafka-bridge
namespace: company.streaming
description: Receive single CloudEvents over HTTP, preserve their payloads in structured JSON, and publish invalid requests to a separate Kafka topic.

inputs:
  - id: bootstrap_servers
    type: STRING
    defaults: kafka:9092
    description: Kafka brokers reachable from the Kestra server; the default matches a local Docker service named kafka.
  - id: accepted_topic
    type: STRING
    defaults: cloudevents.accepted
  - id: quarantine_topic
    type: STRING
    defaults: cloudevents.quarantine

checks:
  - when: "{{ trigger.headers is defined }}"
    message: Send an HTTP POST to the webhook; this flow requires its request headers.
    style: ERROR
    behavior: BLOCK_EXECUTION

tasks:
  - id: check_topics
    type: io.kestra.plugin.core.execution.Assert
    description: Require separate accepted and quarantine destinations on every webhook execution.
    conditions:
      - "{{ inputs.accepted_topic != inputs.quarantine_topic }}"

  - id: normalize
    type: io.kestra.plugin.scripts.python.Script
    timeout: PT2M
    description: Validate CloudEvents 1.0 without generating missing attributes or losing empty and binary payloads.
    containerImage: python:3.12.12-slim@sha256:f3fa41d74a768c2fce8016b98c191ae8c1bacd8f1152870a3f9f87d350920b7c
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - python -m pip install --disable-pip-version-check --no-cache-dir cloudevents==1.12.0
    inputFiles:
      body.bin: "{{ trigger.uri ?? '' }}"
    env:
      HEADERS_JSON: "{{ trigger.headers | toJson }}"
    outputFiles: [message.txt, record.ion, validation.json]
    script: |
      import base64
      import hashlib
      import json
      import os
      import re
      from datetime import datetime
      from pathlib import Path
      from urllib.parse import unquote_to_bytes, urlsplit

      from cloudevents.exceptions import GenericException
      from cloudevents.http import from_http

      def unique_object(pairs):
          """Reject duplicate JSON members rather than silently choosing one value."""
          result = {}
          for key, value in pairs:
              if key in result:
                  raise ValueError('Duplicate JSON member: ' + key)
              result[key] = value
          return result

      def parse_json(raw):
          """Read strict UTF-8 JSON, rejecting nonfinite numbers and duplicate members."""
          def invalid_constant(value):
              """Reject JavaScript constants that are not JSON numbers."""
              raise ValueError('Invalid JSON constant: ' + value)

          value = json.loads(raw.decode('utf-8'), object_pairs_hook=unique_object,
                             parse_constant=invalid_constant)
          # Escaped lone surrogates and overflowing floats are not valid UTF-8 JSON output.
          json.dumps(value, ensure_ascii=False, allow_nan=False).encode('utf-8')
          return value

      def normalize(headers, body):
          """Validate one supported HTTP event and retain its original data representation."""
          media_type = headers.get('content-type', '').split(';', 1)[0].strip().lower()
          if headers.get('content-encoding', 'identity').lower() != 'identity':
              raise ValueError('Compressed HTTP bodies are not supported')
          if media_type == 'application/cloudevents+json':
              event = parse_json(body)
              if not isinstance(event, dict):
                  raise ValueError('Structured CloudEvent must be a JSON object')
          else:
              if media_type.startswith('application/cloudevents'):
                  raise ValueError('Only single structured JSON and HTTP binary events are supported')
              if 'ce-datacontenttype' in headers:
                  raise ValueError('Binary mode uses Content-Type, not ce-datacontenttype')
              if 'ce-data' in headers or 'ce-data_base64' in headers:
                  raise ValueError('Payload fields cannot be HTTP context attributes')
              event = {key[3:]: decode_attribute(value) for key, value in headers.items() if key.startswith('ce-')}
              if 'content-type' in headers:
                  event['datacontenttype'] = headers['content-type']
              if media_type == 'application/json' or media_type.endswith('+json'):
                  event['data'] = parse_json(body)
              else:
                  # Base64 retains arbitrary bytes, including an explicitly empty body.
                  event['data_base64'] = base64.b64encode(body).decode('ascii')
          for field in ['specversion', 'id', 'source', 'type']:
              if not isinstance(event.get(field), str) or not event[field].strip():
                  raise ValueError('Missing or invalid required attribute: ' + field)
          if event['specversion'] != '1.0':
              raise ValueError('Only specversion 1.0 is supported')
          for name, value in event.items():
              if name != 'data_base64' and not re.fullmatch(r'[a-z][a-z0-9]*', name):
                  raise ValueError('Invalid attribute name: ' + name)
              if name not in {'data', 'data_base64'} and type(value) not in {str, int, bool}:
                  raise ValueError('Context attributes must be strings, integers or booleans')
              if name not in {'data', 'data_base64'}:
                  if isinstance(value, str) and any(ord(c) < 32 or 127 <= ord(c) <= 159
                          or 0xFDD0 <= ord(c) <= 0xFDEF or (ord(c) & 0xFFFF) in {0xFFFE, 0xFFFF} for c in value):
                      raise ValueError('Context strings cannot contain controls or Unicode noncharacters')
                  if type(value) is int and not -(2 ** 31) <= value < 2 ** 31:
                      raise ValueError('Context integers must fit signed 32 bits')
          for field in ['subject', 'datacontenttype', 'dataschema', 'time']:
              if field in event and not isinstance(event[field], str):
                  raise ValueError(field + ' must be a string')
              if field in event and not event[field]:
                  raise ValueError(field + ' must be nonempty when present')
          for field in ['source', 'dataschema']:
              if field in event:
                  value = event[field]
                  if not value or re.search(r'[\s\x00-\x1f\x7f<>"{}|\\^`]|%(?![0-9a-fA-F]{2})', value) or not value.isascii():
                      raise ValueError(field + ' must be a valid ASCII URI reference; percent-encode non-ASCII text')
                  parsed = urlsplit(value)
                  if field == 'dataschema' and not parsed.scheme:
                      raise ValueError('dataschema must be an absolute URI')
          if 'time' in event:
              if not re.fullmatch(r'\d{4}-\d\d-\d\d[Tt]\d\d:\d\d:\d\d(?:\.\d+)?(?:[Zz]|[+-]\d\d:\d\d)', event['time']):
                  raise ValueError('time must be an RFC3339 timestamp')
              datetime.fromisoformat(event['time'].upper().replace('Z', '+00:00'))
          if 'data' in event and 'data_base64' in event:
              raise ValueError('data and data_base64 are mutually exclusive')
          if 'data_base64' in event:
              value = event['data_base64']
              if not isinstance(value, str):
                  raise ValueError('data_base64 must be a string')
              base64.b64decode(value, validate=True)
          # The SDK adds time and drops empty data on serialization. Validate with it,
          # but publish the checked envelope so those values remain unchanged.
          from_http({'content-type': 'application/cloudevents+json'},
                    json.dumps(event, allow_nan=False).encode('utf-8'))
          return event

      def decode_attribute(value):
          """Unquote and percent-decode one HTTP context attribute exactly once."""
          if value.startswith('"'):
              if not re.fullmatch(r'"(?:[^"\\]|\\.)*"', value):
                  raise ValueError('Malformed quoted CloudEvents header')
              value = re.sub(r'\\(.)', r'\1', value[1:-1])
          if re.search(r'%(?![0-9a-fA-F]{2})', value):
              raise ValueError('Malformed percent escape in CloudEvents header')
          return unquote_to_bytes(value).decode('utf-8')

      body = Path('body.bin').read_bytes()
      digest = hashlib.sha256(body).hexdigest()
      headers = {}
      reason = None
      try:
          for name, values in json.loads(os.environ['HEADERS_JSON']).items():
              name = name.lower()
              if not (name.startswith('ce-') or name in {'content-type', 'content-encoding'}):
                  continue
              values = values if isinstance(values, list) else [values]
              if name in headers or len(values) != 1 or not isinstance(values[0], str):
                  raise ValueError('Ambiguous HTTP header: ' + name)
              headers[name] = values[0]
          if len(body) > 262144:
              raise ValueError('Body exceeds the supported 262144-byte limit')
          event = normalize(headers, body)
          key = hashlib.sha256((event['source'] + '\x00' + event['id']).encode('utf-8')).hexdigest()
          message = event
      except (ValueError, TypeError, UnicodeError, RecursionError, GenericException) as error:
          reason = str(error)
          key = digest
          # Oversized requests retain a bounded prefix plus the full body's digest.
          message = {'reason': reason, 'body_sha256': digest, 'body_size': len(body),
                     'body_base64': base64.b64encode(body[:262144]).decode('ascii'),
                     'body_truncated': len(body) > 262144, 'event_headers': headers}
      content = json.dumps(message, ensure_ascii=False, allow_nan=False).encode('utf-8')
      Path('message.txt').write_bytes(content)
      media_type = 'application/cloudevents+json' if reason is None else 'application/json'
      # An ION blob becomes byte[] in Kafka Produce, so payload text is never rendered as a template.
      record = '{"key":' + json.dumps(key) + ',"value":' + '{' * 2 + base64.b64encode(content).decode('ascii')
      record += '}' * 2 + ',"headers":{"content-type":' + json.dumps(media_type) + '}}\n'
      Path('record.ion').write_text(record, encoding='utf-8')
      verdict = {'accepted': reason is None, 'reason': reason, 'body_sha256': digest, 'key': key}
      Path('validation.json').write_text(json.dumps(verdict, indent=2), encoding='utf-8')
      print('::' + json.dumps({'outputs': verdict}) + '::')

  - id: route
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.normalize.vars.accepted }}"
    then:
      - id: publish_event
        type: io.kestra.plugin.kafka.Produce
        timeout: PT30S
        description: Publish structured JSON as UTF-8 bytes from an ION blob, keeping event text outside template rendering.
        properties:
          bootstrap.servers: "{{ inputs.bootstrap_servers }}"
          max.block.ms: "10000"
          delivery.timeout.ms: "15000"
          request.timeout.ms: "10000"
          acks: all
        transactional: false
        topic: "{{ inputs.accepted_topic }}"
        keySerializer: STRING
        valueSerializer: BYTE_ARRAY
        from: "{{ outputs.normalize.outputFiles['record.ion'] }}"
    else:
      - id: publish_quarantine
        type: io.kestra.plugin.kafka.Produce
        timeout: PT30S
        properties:
          bootstrap.servers: "{{ inputs.bootstrap_servers }}"
          max.block.ms: "10000"
          delivery.timeout.ms: "15000"
          request.timeout.ms: "10000"
          acks: all
        transactional: false
        topic: "{{ inputs.quarantine_topic }}"
        keySerializer: STRING
        valueSerializer: BYTE_ARRAY
        from: "{{ outputs.normalize.outputFiles['record.ion'] }}"

  - id: assert_published
    type: io.kestra.plugin.core.execution.Assert
    conditions:
      - "{{ (outputs.publish_event.messagesCount ?? outputs.publish_quarantine.messagesCount) == 1 }}"

  - id: receipt
    type: io.kestra.plugin.core.storage.Write
    description: Save the outcome only after Kafka has acknowledged the single publication.
    extension: .json
    content: |
      {"execution_id":"{{ execution.id }}","accepted":{{ outputs.normalize.vars.accepted }},"body_sha256":"{{ outputs.normalize.vars.body_sha256 }}","messages":1}

triggers:
  - id: events
    type: io.kestra.plugin.core.trigger.Webhook
    description: Store exact request bytes; the HTTP response acknowledges intake, not Kafka delivery. Inspect the execution receipt for delivery.
    key: "{{ secret('CLOUDEVENTS_WEBHOOK_KEY') }}"
    fetchType: STORE

outputs:
  - id: receipt
    type: FILE
    required: false
    value: "{{ outputs.receipt.uri ?? null }}"

extend:
  title: Bridge HTTP CloudEvents to Kafka with Invalid Event Quarantine
  metaTitle: HTTP CloudEvents to Kafka Bridge with Quarantine | Kestra
  shortDescription: Accept CloudEvents 1.0 in HTTP structured JSON or binary mode, preserve their data, and publish valid and rejected requests to separate Kafka topics.
  metaDescription: Bridge single HTTP CloudEvents to Kafka as structured JSON, preserve binary data and extensions, and quarantine invalid requests with diagnostic evidence.
  description: |
    Bridge HTTP CloudEvents to Kafka while retaining extensions, binary payloads and empty values. Invalid requests go to a separate topic.

    ## How it works
    1. A keyed Webhook stores the raw HTTP body and headers.
    2. Python checks one CloudEvent 1.0 with the pinned SDK and strict validation. Structured JSON is retained; binary-mode JSON becomes `data`, other bytes become `data_base64`.
    3. If selects a native Kafka Produce task. Accepted records use `content-type: application/cloudevents+json`; quarantine uses `application/json`.
    4. Assertions require distinct topics and one publication before storage.Write saves a receipt.

    ## What you get
    - Structured CloudEvents in `accepted_topic`; the Kafka key hashes source, a NUL separator and id.
    - Quarantine records with reason, event headers, body hash and base64 body. Above 256 KiB, only the first 256 KiB is retained and `body_truncated` is true.
    - Validation at `outputs.normalize.outputFiles['validation.json']`; receipt at `outputs.receipt.uri`.

    ## Who it's for
    Platform teams connecting HTTP event producers to Kafka consumers.

    ## Why orchestrate this with Kestra
    Intake, validation, routing, publication and receipts remain visible stages with retained evidence.

    ## Prerequisites
    Kestra 2.0, Kafka/Python plugins, Docker workers, PyPI access for cloudevents 1.12.0, and precreated topics. `bootstrap_servers` defaults to `kafka:9092`. The example uses plaintext Kafka; configure TLS/SASL on both Produce tasks for secured clusters. Payloads are retained data.

    ### Secrets
    `CLOUDEVENTS_WEBHOOK_KEY`: private intake URL key. Kafka credentials, if needed, belong in secret-backed plugin properties.

    ## Quick start
    1. Configure the secret and topics, import the flow, and update broker/topic defaults.
    2. POST with Content-Type `application/cloudevents+json` to `/api/v1/main/executions/webhook/company.streaming/cloudevents-http-to-kafka-bridge/KEY`. Supply `specversion: "1.0"`, nonempty `id`, `source`, `type`, and optional `data`.
    3. Consume the record and inspect the receipt. Remove `id` to test quarantine.
    4. Binary mode uses `ce-specversion`, `ce-id`, `ce-source`, `ce-type` and Content-Type. Batch, compression, other structured formats and leap-second timestamps are unsupported.

    ## How to extend
    Add schema validation or downstream consumers. The HTTP response acknowledges intake; inspect the receipt for delivery. Producer failure fails the execution. Retries can duplicate records: the key controls partitioning, not deduplication.

    ## Links
    - [CloudEvents HTTP binding](https://github.com/cloudevents/spec/blob/v1.0.2/cloudevents/bindings/http-protocol-binding.md)
    - [CloudEvents Kafka binding](https://github.com/cloudevents/spec/blob/v1.0.2/cloudevents/bindings/kafka-protocol-binding.md)
    - [Kafka Produce](https://kestra.io/plugins/plugin-kafka/io.kestra.plugin.kafka.produce)
    - [Webhook](https://kestra.io/plugins/core/trigger/io.kestra.plugin.core.trigger.webhook)
  tags: [Data]
  subTags: [Realtime & Streaming, Testing & Quality]
  ee: false
  demo: false
