id: kwasm-containerd-shim-wasm-runtime-fault-sentinel
namespace: company.sre

description: |
  Audits KWasm operator and containerd-shim-wasm runtime metrics to detect WebAssembly node initialization faults, execution crashes, and startup latency degradation.

concurrency:
  limit: 1

inputs:
  - id: kwasm_metrics_url
    type: STRING
    displayName: "KWasm Metrics URL"
    defaults: "http://kwasm-operator.kwasm.svc.cluster.local:8080"
    description: "Internal Kubernetes HTTP endpoint exposing Prometheus metrics from the KWasm operator or node daemon."

  - id: cluster_name
    type: STRING
    displayName: "Kubernetes Cluster Identifier"
    defaults: "k8s-prod-us-central"
    description: "Identifier of the target Kubernetes cluster running WebAssembly microservices via KWasm containerd shims."

  - id: max_shim_startup_latency_ms
    type: INT
    displayName: "Max Shim Startup Latency Milliseconds"
    defaults: 150
    description: "Maximum allowable startup latency in milliseconds for containerd Wasm runtime shims before alerting on node degradation."

  - id: max_shim_failures_threshold
    type: INT
    displayName: "Max Shim Failures Threshold"
    defaults: 3
    description: "Maximum allowable threshold for Wasm runtime shim execution faults before escalating to platform on-call."

  - id: alert_on_unprovisioned_nodes
    type: BOOL
    displayName: "Alert on Unprovisioned Nodes"
    defaults: true
    description: "Toggle whether worker nodes with failed or incomplete Wasm shim installations immediately trigger operational alerts."

tasks:
  - id: scan_kwasm_runtime_telemetry
    type: io.kestra.plugin.scripts.python.Script
    description: Scrapes KWasm Prometheus metrics to audit containerd-shim-wasm execution errors, runtime startup durations, and node provisioning status.
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests kestra
    env:
      METRICS_URL: "{{ inputs.kwasm_metrics_url }}"
      CLUSTER_NAME: "{{ inputs.cluster_name }}"
      MAX_LATENCY_MS: "{{ inputs.max_shim_startup_latency_ms }}"
      MAX_FAILURES: "{{ inputs.max_shim_failures_threshold }}"
      ALERT_UNPROVISIONED: "{{ inputs.alert_on_unprovisioned_nodes }}"
    script: |
      import os
      import sys
      import re
      import requests
      from datetime import datetime, timezone
      from kestra import Kestra

      base_url = os.environ.get("METRICS_URL", "").rstrip("/")
      cluster_name = os.environ.get("CLUSTER_NAME", "k8s-prod-us-central")
      max_latency_ms = float(os.environ.get("MAX_LATENCY_MS", "150"))
      max_failures = float(os.environ.get("MAX_FAILURES", "3"))
      alert_unprovisioned = os.environ.get("ALERT_UNPROVISIONED", "true").lower() == "true"

      max_observed_latency_ms = 0.0
      worst_runtime_shim = "none"
      shim_failures_count = 0.0
      unprovisioned_nodes_count = 0
      reconcile_errors_count = 0.0
      total_wasm_pods_active = 0

      metrics_endpoint = f"{base_url}/metrics"
      try:
          resp = requests.get(metrics_endpoint, timeout=12)
          resp.raise_for_status()
          raw_lines = resp.text.splitlines()
      except Exception as err:
          print(f"Error: Unable to connect to KWasm metrics endpoint at {metrics_endpoint}: {err}", file=sys.stderr)
          sys.exit(1)

      for line in raw_lines:
          line = line.strip()
          if not line or line.startswith("#"):
              continue
          match = re.search(r'([0-9.eE+-]+)\s*$', line)
          if not match:
              continue
          val = float(match.group(1))

          if "kwasm_runtime_startup_latency_ms" in line or "kwasm_shim_startup_duration_ms" in line:
              shim_match = re.search(r'runtime="([^"]+)"', line)
              shim_name = shim_match.group(1) if shim_match else "wasm-shim"
              if val > max_observed_latency_ms:
                  max_observed_latency_ms, worst_runtime_shim = val, shim_name
          elif "kwasm_node_shim_failures_total" in line or "kwasm_shim_execution_errors_total" in line:
              shim_failures_count += val
          elif "kwasm_nodes_unprovisioned_count" in line:
              unprovisioned_nodes_count = int(val)
          elif "kwasm_node_installed_status" in line and 'status="failed"' in line and val > 0:
              unprovisioned_nodes_count += int(val)
          elif "kwasm_operator_reconcile_errors_total" in line:
              reconcile_errors_count += val
          elif "kwasm_active_wasm_pods_count" in line:
              total_wasm_pods_active = int(val)

      is_breached = bool((max_observed_latency_ms > max_latency_ms) or (shim_failures_count > max_failures) or (alert_unprovisioned and unprovisioned_nodes_count > 0))
      now_iso = datetime.now(timezone.utc).isoformat()
      print(f"KWasm Audit: cluster={cluster_name}, worst_shim={worst_runtime_shim}:{max_observed_latency_ms:.2f}ms, failures={shim_failures_count}, unprovisioned_nodes={unprovisioned_nodes_count}, active_pods={total_wasm_pods_active}, breached={is_breached}")

      Kestra.outputs({
          "peak_startup_latency_ms": round(max_observed_latency_ms, 2),
          "worst_runtime_shim": worst_runtime_shim,
          "shim_failures_count": round(shim_failures_count, 0),
          "unprovisioned_nodes_count": unprovisioned_nodes_count,
          "reconcile_errors_count": round(reconcile_errors_count, 0),
          "active_wasm_pods_count": total_wasm_pods_active,
          "is_alerting": is_breached,
          "audit_timestamp": now_iso
      })

  - id: evaluate_kwasm_runtime_health
    type: io.kestra.plugin.core.flow.If
    description: Evaluates whether containerd Wasm runtime startup latencies, execution crashes, or unprovisioned node states violate cluster policies.
    condition: "{{ outputs.scan_kwasm_runtime_telemetry.vars.is_alerting }}"
    then:
      - id: notify_slack_kwasm_runtime_fault
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches high-urgency Slack notification when KWasm node runtime faults or execution crashes degrade Wasm workloads.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#platform-runtime-alerts",
            "text": "CRITICAL: KWasm WebAssembly Runtime Fault on Cluster `{{ inputs.cluster_name }}`. Worst Shim: `{{ outputs.scan_kwasm_runtime_telemetry.vars.worst_runtime_shim }}` at `{{ outputs.scan_kwasm_runtime_telemetry.vars.peak_startup_latency_ms }}` ms (limit: `{{ inputs.max_shim_startup_latency_ms }}` ms). Shim Failures: `{{ outputs.scan_kwasm_runtime_telemetry.vars.shim_failures_count }}` (limit: `{{ inputs.max_shim_failures_threshold }}`). Unprovisioned Nodes: `{{ outputs.scan_kwasm_runtime_telemetry.vars.unprovisioned_nodes_count }}`. Active Wasm Pods: `{{ outputs.scan_kwasm_runtime_telemetry.vars.active_wasm_pods_count }}`. Audit Timestamp: `{{ outputs.scan_kwasm_runtime_telemetry.vars.audit_timestamp }}`."
          }
    else:
      - id: log_nominal_kwasm_state
        type: io.kestra.plugin.core.log.Log
        description: Records nominal telemetry when containerd WebAssembly runtime shims and node provisioning operate normally.
        message: "KWasm WebAssembly node runtime nominal for {{ inputs.cluster_name }}: Peak startup latency is {{ outputs.scan_kwasm_runtime_telemetry.vars.peak_startup_latency_ms }} ms, shim failures {{ outputs.scan_kwasm_runtime_telemetry.vars.shim_failures_count }}."

  - id: emit_audit_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Emits structured audit manifest for WebAssembly runtime governance, node fleet verification, and edge computing reliability.
    format: |
      {
        "status": "{{ outputs.scan_kwasm_runtime_telemetry.vars.is_alerting ? 'ALERT' : 'NOMINAL' }}",
        "cluster_name": "{{ inputs.cluster_name }}",
        "peak_startup_latency_ms": {{ outputs.scan_kwasm_runtime_telemetry.vars.peak_startup_latency_ms }},
        "worst_runtime_shim": "{{ outputs.scan_kwasm_runtime_telemetry.vars.worst_runtime_shim }}",
        "shim_failures_count": {{ outputs.scan_kwasm_runtime_telemetry.vars.shim_failures_count }},
        "unprovisioned_nodes_count": {{ outputs.scan_kwasm_runtime_telemetry.vars.unprovisioned_nodes_count }},
        "reconcile_errors_count": {{ outputs.scan_kwasm_runtime_telemetry.vars.reconcile_errors_count }},
        "active_wasm_pods_count": {{ outputs.scan_kwasm_runtime_telemetry.vars.active_wasm_pods_count }},
        "audit_timestamp": "{{ outputs.scan_kwasm_runtime_telemetry.vars.audit_timestamp }}"
      }

triggers:
  - id: periodic_kwasm_runtime_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"

extend:
  title: "KWasm Containerd Shim WebAssembly Runtime Fault Sentinel"
  metaTitle: "KWasm Wasm Runtime Fault Sentinel Blueprint"
  shortDescription: "Audits KWasm and containerd Wasm runtime metrics to detect node shim faults and execution crashes."
  metaDescription: "Audits KWasm and containerd Wasm runtime metrics to detect node initialization faults, execution crashes, and startup latency degradation."
  description: |
    Automates continuous health, execution error, and node provisioning surveillance for WebAssembly workloads managed by KWasm in Kubernetes clusters.

    ## How it works
    1. A schedule trigger executes the KWasm node runtime audit workflow every 15 minutes.
    2. The Python task queries the KWasm operator Prometheus metrics endpoint exposing node shim and provisioning counters.
    3. The script extracts containerd Wasm runtime startup latencies, shim execution failure counters, and unprovisioned node states.
    4. An evaluation gate determines whether Wasm shim startup latency exceeds limits or worker nodes fail runtime initialization.
    5. When Wasm runtime faults or node provisioning errors are detected, a high-urgency Slack incident alert is dispatched.
    6. When containerd Wasm shims and node provisioners operate within normal parameters, nominal status is logged.
    7. A structured JSON audit manifest is emitted for cloud-native runtime governance and edge computing reliability tracking.

    ## Architecture diagram
    ```mermaid
    graph TD
        Trigger[Schedule Trigger: 15m] --> ScanMetrics[Python Script: Scrape KWasm Operator Metrics]
        ScanMetrics --> EvalBreach{Latency > 150ms OR Failures > 3 OR Unprovisioned Nodes > 0?}
        EvalBreach -- Yes --> SlackAlert[Slack: High-Urgency Wasm Alert]
        EvalBreach -- No --> LogNominal[Log: Nominal Wasm Runtime Performance]
        SlackAlert --> EmitManifest[Debug Return: Wasm Audit Manifest]
        LogNominal --> EmitManifest
    ```

    ## Architecture components
    - **Trigger**: Automated schedule polling at 15-minute recurring intervals.
    - **Script Task**: Scrapes KWasm Prometheus metrics endpoints using Docker container runners.
    - **Decision Gate**: Evaluates whether containerd Wasm runtime startup latencies or execution errors breach cluster SLAs.
    - **Notification Task**: Dispatches structured Slack alerts with cluster name, offending shim, and unprovisioned node metrics.
    - **Audit Manifest**: Emits JSON execution payloads containing startup latency metrics, failure counts, and timestamps.

    ## Key capabilities
    - Real-time surveillance of WebAssembly container runtime shims including WasmEdge, Wasmtime, and Spin.
    - Early warning detection for node-level containerd configuration failures and incompatible Linux kernel architectures.
    - Automated detection of worker nodes stuck in unprovisioned states or missing Wasm runtime libraries.
    - Zero host dependency execution via isolated containerized Python runners.

    ## What you get
    - Proactive visibility into WebAssembly microservice execution failures before pod CrashLoopBackOff events escalate.
    - Immediate incident alerts when worker nodes fail automated containerd shim provisioning or node cordoning is required.
    - Standardized audit manifests containing exact startup latency measurements, failure counts, and active pod totals.
    - Actionable operational alerts routed directly to Runtime and Platform SRE channels with complete diagnostic context.

    ## Who it's for
    - Platform engineers deploying high-density WebAssembly microservices and serverless functions on Kubernetes.
    - Site Reliability Engineers ensuring ultra-fast cold start times and hardware isolation for Wasm runtimes.
    - Edge computing architects running lightweight WebAssembly workloads across resource-constrained edge clusters.
    - DevOps engineers diagnosing containerd-shim-wasm-v1 execution faults and library linkage errors.

    ## Why orchestrate this with Kestra
    - **Serverless Docker Isolation**: Executes telemetry scraping in ephemeral Docker environments without persistent workers.
    - **Centralized Secrets Governance**: Protects sensitive Slack webhooks using encrypted namespace secrets.
    - **Declarative YAML Workflows**: Manages WebAssembly runtime surveillance as versioned code in Git repositories.
    - **Comprehensive Audit History**: Preserves historical runtime execution metrics in searchable Kestra execution logs.

    ## Use cases
    - **Edge Node Wasm Provisioning Watchdog**: Detects when edge worker nodes fail containerd shim installation during fleet rollouts.
    - **Wasm Microsecond Cold Start SLA Guard**: Flags increases in shim instantiation latency before serverless function latency degrades.
    - **Binary Architecture Incompatibility Alarm**: Identifies ARM64 vs AMD64 runtime library mismatches across heterogeneous nodes.

    ## Inputs
    | Name | Type | Default | Description |
    | --- | --- | --- | --- |
    | `kwasm_metrics_url` | STRING | `http://kwasm-operator.kwasm.svc.cluster.local:8080` | Internal Kubernetes HTTP endpoint exposing Prometheus metrics from KWasm. |
    | `cluster_name` | STRING | `k8s-prod-us-central` | Identifier of the target Kubernetes cluster monitored for Wasm runtime health. |
    | `max_shim_startup_latency_ms` | INT | `150` | Maximum acceptable startup latency in milliseconds for containerd Wasm runtime shims. |
    | `max_shim_failures_threshold` | INT | `3` | Maximum allowable threshold for Wasm runtime shim execution faults. |
    | `alert_on_unprovisioned_nodes` | BOOL | `true` | Toggle whether worker nodes with failed Wasm provisioning trigger an operational alert. |

    ## Expected outputs
    - `{{ outputs.scan_kwasm_runtime_telemetry.vars.peak_startup_latency_ms }}`: Peak observed containerd Wasm runtime startup latency in milliseconds.
    - `{{ outputs.scan_kwasm_runtime_telemetry.vars.worst_runtime_shim }}`: Name of the Wasm runtime shim exhibiting the highest startup latency.
    - `{{ outputs.scan_kwasm_runtime_telemetry.vars.shim_failures_count }}`: Cumulative count of Wasm runtime shim execution errors.
    - `{{ outputs.scan_kwasm_runtime_telemetry.vars.unprovisioned_nodes_count }}`: Total number of worker nodes failing Wasm runtime provisioning.
    - `{{ outputs.scan_kwasm_runtime_telemetry.vars.active_wasm_pods_count }}`: Current count of active WebAssembly pods running on the cluster.
    - `{{ outputs.scan_kwasm_runtime_telemetry.vars.is_alerting }}`: Boolean flag indicating if Wasm runtime performance limits were breached.
    - `{{ outputs.scan_kwasm_runtime_telemetry.vars.audit_timestamp }}`: ISO-8601 UTC timestamp of the KWasm audit execution.

    ## Prerequisites
    - KWasm operator deployed in the cluster with metrics enabled and containerd shims configured.
    - Network connectivity from the Kestra worker to the KWasm operator metrics service endpoint.
    - Configured Slack incoming webhook URL with permissions to post in platform runtime alert channels.

    ### Secrets
    - `SLACK_WEBHOOK_URL`: Secure webhook URL for routing WebAssembly runtime alerts to the Platform Slack channel.

    ## Quick start
    1. Confirm that KWasm operator pods are actively running and exposing metrics on port 8080.
    2. Add the `SLACK_WEBHOOK_URL` secret within your Kestra namespace settings.
    3. Specify your cluster identifier in `cluster_name`.
    4. Run a manual flow execution via the Kestra UI to validate metric scraping.
    5. Enable the `periodic_kwasm_runtime_audit` schedule trigger to establish automated monitoring.

    ## Common pitfalls and troubleshooting
    - **Containerd Socket Accessibility**: KWasm requires access to the host containerd socket `/run/containerd/containerd.sock` to register shims.
    - **SELinux and AppArmor Constraints**: Strict security profiles on worker nodes can block runtime shim binary execution.
    - **Kernel Version Dependencies**: WebAssembly shims require Linux kernel features like seccomp and cgroups v2 for proper isolation.
    - **Node Label Selectors**: Ensure nodes intended for Wasm workloads are properly tagged with `kwasm.sh/kwasm-node=true`.

    ## How to extend
    - **Automated Node Re-Provisioning**: Automatically delete and restart KWasm provisioner pods on nodes exhibiting shim errors.
    - **Dynamic Workload Tainting**: Apply Kubernetes taints to unprovisioned nodes to prevent Wasm pods from scheduling prematurely.
    - **Wasm Runtime Benchmark Reporting**: Export historical startup latency trends to Grafana or Snowflake for runtime comparison.

    ## Links
    - [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
    - [KWasm Official Documentation](https://kwasm.sh/)
    - [KWasm Kubernetes Operator Repository](https://github.com/KWasm/kwasm-operator)
    - [WasmEdge WebAssembly Runtime Reference](https://wasmedge.org/docs/)
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Monitoring & Alerting
    - Kubernetes Operations
  ee: false
  demo: false
