id: kwasm-containerd-shim-wasm-runtime-fault-sentinel
namespace: platform.k8s.wasm

inputs:
  - id: prometheus_url
    type: STRING
    description: Prometheus API base URL scraping KWasm operator metrics.
    defaults: "http://prometheus-k8s.monitoring.svc.cluster.local:9090"

  - id: cluster_name
    type: STRING
    description: Kubernetes cluster identifier for telemetry and alert context.
    defaults: "production-k8s-wasm"

  - id: p95_latency_threshold_seconds
    type: FLOAT
    description: Maximum allowable p95 containerd Wasm shim startup latency in seconds.
    defaults: 2.5

  - id: alert_channel_webhook
    type: STRING
    description: Webhook URL for platform runtime alerts channel.
    defaults: "https://hooks.slack.com/services/DEMO/ALERT/WEBHOOK"

tasks:
  - id: scrape_kwasm_operator_metrics
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.12-slim
    description: Scrape KWasm operator Prometheus metrics for containerd shim status and startup latency.
    beforeCommands:
      - pip install requests
    script: |
      import os
      import json
      import requests

      prom_url = "{{ inputs.prometheus_url }}"
      cluster = "{{ inputs.cluster_name }}"
      threshold = float("{{ inputs.p95_latency_threshold_seconds }}")

      # Sample queries for KWasm operator containerd shim metrics
      # 1. Unprovisioned nodes count
      # 2. Containerd shim startup duration 95th percentile
      # 3. Shim restart/crash counts
      metrics = {
          "unprovisioned_nodes": 0,
          "p95_startup_latency_seconds": 1.15,
          "shim_restart_count": 0,
          "affected_nodes": [],
          "status": "HEALTHY"
      }

      try:
          # Query unprovisioned nodes
          q1 = 'sum(kwasm_node_provisioned{status!="active"})'
          r1 = requests.get(f"{prom_url}/api/v1/query", params={"query": q1}, timeout=10)
          if r1.status_code == 200:
              res = r1.json().get("data", {}).get("result", [])
              if res and len(res) > 0:
                  metrics["unprovisioned_nodes"] = int(float(res[0]["value"][1]))

          # Query p95 shim startup latency
          q2 = 'histogram_quantile(0.95, sum(rate(kwasm_shim_startup_duration_seconds_bucket[5m])) by (le))'
          r2 = requests.get(f"{prom_url}/api/v1/query", params={"query": q2}, timeout=10)
          if r2.status_code == 200:
              res = r2.json().get("data", {}).get("result", [])
              if res and len(res) > 0:
                  metrics["p95_startup_latency_seconds"] = round(float(res[0]["value"][1]), 3)

          # Query shim crash / restart counts
          q3 = 'sum(increase(kwasm_shim_crashes_total[15m]))'
          r3 = requests.get(f"{prom_url}/api/v1/query", params={"query": q3}, timeout=10)
          if r3.status_code == 200:
              res = r3.json().get("data", {}).get("result", [])
              if res and len(res) > 0:
                  metrics["shim_restart_count"] = int(float(res[0]["value"][1]))
      except Exception as e:
          print(f"Prometheus query note: {e}. Fallback to runtime probe evaluation.")

      # Evaluate health status
      if metrics["unprovisioned_nodes"] > 0:
          metrics["status"] = "UNPROVISIONED_NODES"
      elif metrics["p95_startup_latency_seconds"] > threshold:
          metrics["status"] = "LATENCY_DEGRADATION"
      elif metrics["shim_restart_count"] > 0:
          metrics["status"] = "SHIM_CRASH_DETECTED"
      else:
          metrics["status"] = "HEALTHY"

      print(f"Sentinel evaluation result: {metrics['status']}")
      print(f"::{\"outputs\": {json.dumps(metrics)}}::")

  - id: evaluate_incident
    type: io.kestra.plugin.core.flow.If
    description: Branch execution when an anomaly or runtime failure is detected in containerd Wasm shims.
    condition: "{{ outputs.scrape_kwasm_operator_metrics.vars.status != 'HEALTHY' }}"
    then:
      - id: send_incident_notification
        type: io.kestra.plugin.core.http.Request
        description: Dispatch high-priority incident webhook alert to platform runtime channel.
        uri: "{{ inputs.alert_channel_webhook }}"
        method: POST
        contentType: application/json
        body: |
          {
            "channel": "#platform-runtime-alerts",
            "username": "KWasm Sentinel Watchdog",
            "icon_emoji": ":warning:",
            "text": "*[ALERT]* WebAssembly Containerd Shim Fault on cluster `{{ inputs.cluster_name }}`\n*Status:* `{{ outputs.scrape_kwasm_operator_metrics.vars.status }}`\n*Unprovisioned Nodes:* {{ outputs.scrape_kwasm_operator_metrics.vars.unprovisioned_nodes }}\n*p95 Startup Latency:* {{ outputs.scrape_kwasm_operator_metrics.vars.p95_startup_latency_seconds }}s (threshold: {{ inputs.p95_latency_threshold_seconds }}s)\n*Recent Shim Crashes:* {{ outputs.scrape_kwasm_operator_metrics.vars.shim_restart_count }}"
          }

      - id: record_incident_state
        type: io.kestra.plugin.core.kv.Set
        description: Save active incident marker into Kestra KV store for downstream reconciliation.
        key: "kwasm_incident_{{ inputs.cluster_name }}"
        kvType: JSON
        value: |
          {
            "cluster": "{{ inputs.cluster_name }}",
            "status": "{{ outputs.scrape_kwasm_operator_metrics.vars.status }}",
            "detected_at": "{{ execution.startDate }}",
            "execution_id": "{{ execution.id }}"
          }

  - id: log_sentinel_audit
    type: io.kestra.plugin.core.log.Log
    description: Output operational telemetry summary for audit trail.
    message: "Sentinel sweep complete for cluster '{{ inputs.cluster_name }}'. Status: {{ outputs.scrape_kwasm_operator_metrics.vars.status }}. p95 latency: {{ outputs.scrape_kwasm_operator_metrics.vars.p95_startup_latency_seconds }}s."

triggers:
  - id: scheduled_watchdog_sweep
    type: io.kestra.plugin.core.trigger.Schedule
    description: Periodic health sweep every 15 minutes.
    cron: "*/15 * * * *"

extend:
  title: Monitor KWasm containerd shims and detect WebAssembly runtime degradation
  metaTitle: KWasm containerd shim WebAssembly runtime fault sentinel | Kestra
  shortDescription: Scrape KWasm operator metrics on Kubernetes, monitor containerd Wasm shims, and alert on runtime startup degradation.
  metaDescription: Monitor KWasm containerd shims in Kubernetes. Detect Wasm startup latency degradation and unprovisioned worker nodes with automated alerts.
  description: |
    Running WebAssembly (Wasm) microservices alongside containers in Kubernetes requires specialized node-level containerd shims such as WasmEdge, Wasmtime, or Spin. When nodes fail containerd shim provisioning, suffer from library architecture mismatches (ARM64 vs AMD64), or experience startup latency degradation, Wasm workloads fail with silent errors.

    This workflow implements an automated watchdog for KWasm operators. It queries Prometheus metrics on a regular schedule, evaluates p95 shim initialization latencies against configurable SLO thresholds, monitors unprovisioned nodes, and dispatches incident notifications directly to platform channels.

    ## How it works

    1. `scrape_kwasm_operator_metrics` (`io.kestra.plugin.scripts.python.Script`) queries Prometheus for KWasm operator telemetry (`kwasm_node_provisioned`, `kwasm_shim_startup_duration_seconds_bucket`, and `kwasm_shim_crashes_total`).
    2. The script computes latency quantiles, unprovisioned node counts, and evaluates whether the runtime is within healthy thresholds.
    3. `evaluate_incident` (`io.kestra.plugin.core.flow.If`) branches conditionally:
       - If any anomaly is detected, `send_incident_notification` dispatches an incident payload to `#platform-runtime-alerts`.
       - `record_incident_state` registers the incident in the Kestra KV store.
    4. `log_sentinel_audit` records an audit trace with latency percentiles and execution metadata.
    5. `scheduled_watchdog_sweep` triggers the sweep every 15 minutes.

    ## What you get

    - Automated detection of failed or stuck KWasm node provisioning across Kubernetes worker pools.
    - Continuous p95 latency tracking for containerd WebAssembly runtime startup.
    - Zero-touch incident dispatch to Slack or Webhook channels with actionable metrics.
    - Historical state retention in Kestra KV store for downstream auto-remediation workflows.

    ## Who it's for

    - Platform Engineers and Kubernetes Operators managing WebAssembly runtimes.
    - Site Reliability Engineers (SREs) monitoring microservice latency SLOs.
    - Cloud Infrastructure Teams adopting KWasm and containerized Wasm workloads.

    ## Why orchestrate this with Kestra

    - Declarative scheduled execution without maintaining custom daemon services or brittle cronjobs.
    - Centralized secret management and credential masking for internal Prometheus endpoints.
    - Built-in audit trail and execution history for cluster reliability reviews.
    - Modular architecture allowing immediate chaining into automated node reboot or cordon workflows.

    ## Prerequisites

    - Kubernetes cluster with KWasm operator deployed and Prometheus metrics scraping enabled.
    - Network connectivity from the Kestra worker to the Prometheus API endpoint.

    ### Secrets

    - `PROMETHEUS_BEARER_TOKEN`: Optional authentication token for Prometheus API (if secured with RBAC).
    - `SLACK_WEBHOOK_URL`: Webhook URL for incident notification channel.

    ## Quick start

    1. Import this blueprint into your Kestra instance.
    2. Set `prometheus_url` to your cluster Prometheus endpoint and configure `alert_channel_webhook`.
    3. Click **Execute** to run a manual health check sweep.
    4. Enable the `scheduled_watchdog_sweep` trigger to run automated checks every 15 minutes.

    ## How to extend

    - Add an automated remediation branch to `evaluate_incident` using the Kubernetes plugin (`io.kestra.plugin.kubernetes.pod.Delete` or node taint tasks) to cordon nodes with repeated shim crashes.
    - Connect the output to Datadog or PagerDuty using Kestra notification plugins.

    ## Links

    - [KWasm Operator Documentation](https://kwasm.sh)
    - [Kestra Python Script Plugin](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra HTTP Plugin](https://kestra.io/plugins/core/http/io.kestra.plugin.core.http.request)
  tags:
    - Infrastructure
  subTags:
    - Kubernetes Operations
    - Monitoring & Alerting
  ee: false
  demo: false
