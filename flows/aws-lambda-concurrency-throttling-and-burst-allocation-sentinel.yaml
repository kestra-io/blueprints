id: aws-lambda-concurrency-throttling-and-burst-allocation-sentinel
namespace: company.serverless
description: |
  Audits AWS Lambda regional unreserved concurrency utilization and invocation throttling across all functions in an AWS region.
  Cross-references account-level concurrency limits with CloudWatch metrics to detect burst concurrency exhaustion and dispatches
  contextual Slack alerts before microservices encounter HTTP 429 throttling errors.

inputs:
  - id: aws_region
    type: STRING
    displayName: AWS Region
    description: Target AWS region hosting the serverless Lambda workload.
    defaults: us-east-1

  - id: lookback_minutes
    type: INT
    displayName: Lookback Period (Minutes)
    description: Duration in minutes of historical CloudWatch metrics to inspect.
    defaults: 60

  - id: concurrency_utilization_threshold_percent
    type: FLOAT
    displayName: Concurrency Utilization Threshold (%)
    description: Maximum acceptable percentage of regional concurrency capacity before raising a warning alert.
    defaults: 80.0

  - id: max_acceptable_throttles
    type: INT
    displayName: Max Acceptable Throttles
    description: Threshold of invocation throttles within the lookback window above which an alert is triggered.
    defaults: 0

triggers:
  - id: hourly_concurrency_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: Hourly audit of Lambda regional concurrency and throttling metrics.
    cron: "0 * * * *"

tasks:
  - id: audit_lambda_concurrency_and_throttles
    type: io.kestra.plugin.aws.cli.AwsCLI
    description: Queries AWS Lambda account settings and CloudWatch metrics to calculate regional concurrency utilization and throttles.
    accessKeyId: "{{ secret('AWS_ACCESS_KEY_ID') }}"
    secretKeyId: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
    region: "{{ inputs.aws_region }}"
    commands:
      - |
        set -euo pipefail

        LOOKBACK_MINUTES="{{ inputs.lookback_minutes }}"
        REGION="{{ inputs.aws_region }}"

        # 1. Fetch account-level concurrency limits
        ACCOUNT_SETTINGS=$(aws lambda get-account-settings --output json)
        TOTAL_CONCURRENCY=$(echo "$ACCOUNT_SETTINGS" | jq -r '.AccountLimit.TotalConcurrentExecutions // 1000')
        UNRESERVED_CONCURRENCY=$(echo "$ACCOUNT_SETTINGS" | jq -r '.AccountLimit.UnreservedConcurrentExecutions // 1000')

        # 2. Compute ISO-8601 timestamps for CloudWatch metric query
        START_TIME=$(date -u -d "${LOOKBACK_MINUTES} minutes ago" +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || date -u -v-${LOOKBACK_MINUTES}M +%Y-%m-%dT%H:%M:%SZ)
        END_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)

        # 3. Query regional ConcurrentExecutions and Throttles
        METRIC_DATA=$(aws cloudwatch get-metric-data \
          --metric-data-queries '[
            {"Id":"m_concurrent","MetricStat":{"Metric":{"Namespace":"AWS/Lambda","MetricName":"ConcurrentExecutions"},"Period":300,"Stat":"Maximum"},"ReturnData":true},
            {"Id":"m_throttles","MetricStat":{"Metric":{"Namespace":"AWS/Lambda","MetricName":"Throttles"},"Period":300,"Stat":"Sum"},"ReturnData":true}
          ]' \
          --start-time "$START_TIME" \
          --end-time "$END_TIME" \
          --output json)

        PEAK_CONCURRENT=$(echo "$METRIC_DATA" | jq '[.MetricDataResults[] | select(.Id=="m_concurrent") | .Values[]] | max // 0')
        TOTAL_THROTTLES=$(echo "$METRIC_DATA" | jq '[.MetricDataResults[] | select(.Id=="m_throttles") | .Values[]] | add // 0')

        # 4. Calculate utilization and headroom
        if [ "$TOTAL_CONCURRENCY" -gt 0 ]; then
          UTILIZATION_PERCENT=$(awk "BEGIN {printf \"%.2f\", ($PEAK_CONCURRENT / $TOTAL_CONCURRENCY) * 100}")
        else
          UTILIZATION_PERCENT="0.00"
        fi
        HEADROOM_REMAINING=$(awk "BEGIN {val = $TOTAL_CONCURRENCY - $PEAK_CONCURRENT; print (val < 0 ? 0 : val)}")

        # 5. Check if threshold breached
        UTIL_THRESHOLD="{{ inputs.concurrency_utilization_threshold_percent }}"
        MAX_THROTTLES="{{ inputs.max_acceptable_throttles }}"

        IS_UTIL_CRITICAL=$(awk "BEGIN {print ($UTILIZATION_PERCENT >= $UTIL_THRESHOLD ? 1 : 0)}")
        IS_THROTTLE_CRITICAL=$(awk "BEGIN {print ($TOTAL_THROTTLES > $MAX_THROTTLES ? 1 : 0)}")

        if [ "$IS_UTIL_CRITICAL" -eq 1 ] || [ "$IS_THROTTLE_CRITICAL" -eq 1 ]; then
          ALERT_REQUIRED="true"
        else
          ALERT_REQUIRED="false"
        fi

        # 6. Format Kestra task outputs
        echo "::{\"outputs\":{\"total_concurrency\":$TOTAL_CONCURRENCY,\"unreserved_concurrency\":$UNRESERVED_CONCURRENCY,\"peak_concurrent\":$PEAK_CONCURRENT,\"total_throttles\":$TOTAL_THROTTLES,\"utilization_percent\":$UTILIZATION_PERCENT,\"headroom_remaining\":$HEADROOM_REMAINING,\"alert_required\":\"$ALERT_REQUIRED\",\"is_util_critical\":$IS_UTIL_CRITICAL,\"is_throttle_critical\":$IS_THROTTLE_CRITICAL}}::"

  - id: evaluate_concurrency_headroom
    type: io.kestra.plugin.core.flow.If
    description: Evaluates whether regional concurrency utilization or throttles breached safe operational thresholds.
    condition: "{{ outputs.audit_lambda_concurrency_and_throttles.vars.alert_required == 'true' }}"
    then:
      - id: alert_serverless_slack
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches high-priority alert to Slack with concurrency metrics and remediation guidance.
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "attachments": [
              {
                "color": "danger",
                "title": "AWS Lambda Regional Concurrency Throttling and Saturation Alert",
                "text": "AWS Lambda concurrency in region `{{ inputs.aws_region }}` is experiencing saturation or active invocation throttling:\n\n• *Regional Concurrency Limit:* `{{ outputs.audit_lambda_concurrency_and_throttles.vars.total_concurrency }}` executions\n• *Unreserved Pool Capacity:* `{{ outputs.audit_lambda_concurrency_and_throttles.vars.unreserved_concurrency }}` executions\n• *Peak Concurrent Executions:* `{{ outputs.audit_lambda_concurrency_and_throttles.vars.peak_concurrent }}`\n• *Concurrency Utilization:* `{{ outputs.audit_lambda_concurrency_and_throttles.vars.utilization_percent }}%` (Threshold: `{{ inputs.concurrency_utilization_threshold_percent }}%`)\n• *Remaining Headroom:* `{{ outputs.audit_lambda_concurrency_and_throttles.vars.headroom_remaining }}` executions\n• *Total Invocations Throttled:* `{{ outputs.audit_lambda_concurrency_and_throttles.vars.total_throttles }}` (Threshold: `{{ inputs.max_acceptable_throttles }}`)\n\n*Recommended Mitigation:*\n1. Check Service Quotas to request a regional Lambda concurrent execution limit increase.\n2. Review functions without reserved concurrency to prevent noisy neighbors from exhausting the unreserved pool.\n3. Configure SQS Dead Letter Queues (DLQ) or provisioned concurrency for critical synchronous functions.",
                "footer": "Kestra Lambda Concurrency Sentinel"
              }
            ]
          }
    else:
      - id: log_fleet_healthy
        type: io.kestra.plugin.core.log.Log
        description: Logs healthy concurrency status when within acceptable operational thresholds.
        message: "AWS Lambda concurrency in region {{ inputs.aws_region }} is healthy. Peak concurrency: {{ outputs.audit_lambda_concurrency_and_throttles.vars.peak_concurrent }}/{{ outputs.audit_lambda_concurrency_and_throttles.vars.total_concurrency }} ({{ outputs.audit_lambda_concurrency_and_throttles.vars.utilization_percent }}%), Throttles: {{ outputs.audit_lambda_concurrency_and_throttles.vars.total_throttles }}."

  - id: log_audit_summary
    type: io.kestra.plugin.core.log.Log
    description: Summarizes completed regional Lambda concurrency inspection.
    message: "Completed AWS Lambda concurrency audit for {{ inputs.aws_region }} across the last {{ inputs.lookback_minutes }} minutes. Alert required: {{ outputs.audit_lambda_concurrency_and_throttles.vars.alert_required }}."

extend:
  metaDescription: "Audit AWS Lambda regional concurrency headroom and invocation throttling, alerting serverless SRE teams on Slack to prevent 429 outage cascades."
  metaTitle: AWS Lambda Regional Concurrency Throttling and Saturation Sentinel with Kestra
  title: AWS Lambda Regional Concurrency Throttling and Saturation Sentinel
  shortDescription: Audit AWS Lambda regional concurrency headroom and invocation throttling, alerting SREs on Slack.
  description: |
    ## How it works

    AWS Lambda enforces account-level regional limits on concurrent function executions (default 1,000 concurrent executions per region). When traffic spikes or runaway recursive functions exhaust unreserved concurrency, all non-isolated functions in the region begin returning HTTP 429 `TooManyRequestsException` errors and silently drop asynchronous events.

    Standard CloudWatch alarms track individual function throttles, but they fail to correlate account-level concurrency limits with total unreserved pool headroom. This blueprint proactively cross-references AWS Lambda account settings (`get-account-settings`) with aggregate CloudWatch `ConcurrentExecutions` and `Throttles` metrics over a configurable lookback window. When concurrency utilization exceeds safe operational limits (default 80%) or throttled invocations are recorded, an urgent Slack alert is dispatched with exact capacity metrics and remediation steps.

    ## What you get

    - Account-wide visibility into regional Lambda concurrent execution saturation.
    - Early warning alerting before services experience widespread invocation drops and cascading failures.
    - Automated detection of noisy neighbor functions draining the unreserved concurrency pool.
    - Clear remediation runbooks directly in the incident notification.

    ## Who it's for

    - Serverless Architects and Cloud Platform Engineers operating event-driven architectures on AWS.
    - SRE and DevOps teams managing mission-critical APIs backed by Lambda and API Gateway.
    - FinOps and Infrastructure Leads tracking cloud capacity limits and AWS Service Quotas.

    ## Why orchestrate this with Kestra

    - **Native AWS CLI Integration**: Executes authenticated AWS CLI commands securely using `io.kestra.plugin.aws.cli.AwsCLI` without external agents.
    - **Continuous Headroom Auditing**: Runs on a scheduled cadence (e.g. hourly) to catch utilization creep during peak business traffic hours.
    - **Dynamic Flow Branching**: Employs `io.kestra.plugin.core.flow.If` to isolate incident notifications, keeping Slack alert channels quiet when operations are healthy.

    ## Prerequisites

    - AWS credentials with `lambda:GetAccountSettings` and `cloudwatch:GetMetricData` IAM permissions.
    - Kestra namespace secrets: `AWS_ACCESS_KEY_ID`, `AWS_SECRET_ACCESS_KEY`, and `SLACK_WEBHOOK`.

    ## Quick start

    1. Import this blueprint into your Kestra instance.
    2. Configure the required namespace secrets for AWS access and Slack webhook.
    3. Adjust `concurrency_utilization_threshold_percent` and `lookback_minutes` to match your service SLA.
    4. Enable the schedule trigger to establish automated serverless capacity monitoring.

    ## Key architecture & operational pitfalls

    - **Unreserved vs Reserved Concurrency**: Setting reserved concurrency on a Lambda function carves out dedicated capacity from the account pool. If multiple functions reserve large pools, the remaining `UnreservedConcurrentExecutions` available to all other functions can drop to near zero. The sentinel measures both total capacity and unreserved pool allocations.
    - **Metric Latency & Aggregation Windows**: CloudWatch `ConcurrentExecutions` is reported as high-resolution metric data. Using `Period: 300` (5-minute slices) with `Stat: Maximum` captures transient burst spikes that 1-hour average metrics smooth over.
    - **Burst Concurrency Limits**: In addition to total concurrency, AWS enforces initial burst limits per region (500 to 3,000 depending on region). Sustained traffic growth scales at 500 instances per minute. If immediate demand exceeds burst limits, throttling occurs even if total regional concurrency is below 1,000.

    ## How to extend

    - Add automated creation of PagerDuty incidents or Jira escalation tickets for critical saturation events.
    - Integrate AWS Service Quotas API (`aws service-quotas request-service-quota-increase`) to automate quota increase requests when sustained growth is detected.

    ## Links

    - Kestra AWS Plugin: https://kestra.io/plugins/plugin-aws
    - Kestra Slack Plugin: https://kestra.io/plugins/plugin-notifications
    - AWS Lambda Concurrency Management: https://docs.aws.amazon.com/lambda/latest/dg/lambda-concurrency.html
  tags:
    - Cloud
    - Infrastructure
    - Serverless
  subTags:
    - AWS Services
    - Monitoring
  ee: false
  demo: false
