id: vespa-cluster-convergence-and-node-health-sentinel
namespace: company.ai

description: |
  Continuously audits Vespa big data serving and vector search cluster node readiness, detects application config generation desynchronization, inspects JVM heap headroom, and dispatches actionable Slack incident alerts.

inputs:
  - id: vespa_host
    type: STRING
    displayName: Vespa Container Endpoint Host
    defaults: "http://vespa.internal:8080"
    description: "Base HTTP URL of the target Vespa stateless container node or query endpoint."

  - id: expected_application_generation
    type: INT
    displayName: Expected Config Generation
    defaults: -1
    description: "Expected application config generation number. Set to -1 to automatically track and accept current active generation."

  - id: min_free_heap_bytes
    type: INT
    displayName: Minimum Free Heap Threshold (Bytes)
    defaults: 268435456
    description: "Minimum tolerated free JVM heap memory in bytes (default 256 MB: 268435456) before raising saturation warnings."

  - id: slack_channel
    type: STRING
    displayName: Operational Slack Channel
    defaults: "#ai-ops"
    description: "Target Slack channel or webhook destination for cluster health and convergence incident alerts."

triggers:
  - id: scheduled_sentinel_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 */3 * * *"
    disabled: true
    inputs:
      vespa_host: "http://vespa.internal:8080"
      expected_application_generation: -1
      min_free_heap_bytes: 268435456
      slack_channel: "#ai-ops"

tasks:
  - id: probe_node_health
    type: io.kestra.plugin.core.http.Request
    uri: "{{ inputs.vespa_host }}/state/v1/health"
    method: GET
    headers:
      Accept: application/json
    timeout: PT15S
    description: "Queries the Vespa container state/health endpoint to evaluate service readiness and HTTP process status."

  - id: probe_application_status
    type: io.kestra.plugin.core.http.Request
    uri: "{{ inputs.vespa_host }}/ApplicationStatus"
    method: GET
    headers:
      Accept: application/json
    timeout: PT15S
    description: "Retrieves active deployment metadata, generation numbers, and application model details from the local container cluster."

  - id: probe_cluster_metrics
    type: io.kestra.plugin.core.http.Request
    uri: "{{ inputs.vespa_host }}/state/v1/metrics"
    method: GET
    headers:
      Accept: application/json
    timeout: PT30S
    description: "Collects real-time container metrics including JVM free memory, active document counters, and indexing throughput."

  - id: evaluate_cluster_health
    type: io.kestra.plugin.core.flow.Switch
    value: >-
      {% set health = outputs.probe_node_health.body %}
      {% set status_code = health.status.code | default('down') %}
      {% set app_status = outputs.probe_application_status.body %}
      {% set current_gen = app_status.generation | default(-1) %}
      {% set metrics = outputs.probe_cluster_metrics.body %}
      {% set free_heap = 1073741824 %}
      {% if metrics.metrics is defined and metrics.metrics.values is iterable %}
        {% for metric in metrics.metrics.values %}
          {% if metric.name == 'mem.heap.free' %}
            {% set free_heap = metric.values.average | default(metric.values.last | default(free_heap)) %}
          {% endif %}
        {% endfor %}
      {% endif %}
      {% if status_code != 'up' %}
        NODE_DOWN
      {% elseif inputs.expected_application_generation > 0 and current_gen != inputs.expected_application_generation %}
        GENERATION_DESYNC
      {% elseif free_heap < inputs.min_free_heap_bytes %}
        DEGRADED_HEAP
      {% else %}
        COMPLIANT
      {% endif %}
    cases:
      COMPLIANT:
        - id: log_compliant_status
          type: io.kestra.plugin.core.log.Log
          message: "Vespa cluster node '{{ inputs.vespa_host }}' is healthy and converged. Active generation: {{ outputs.probe_application_status.body.generation | default('unknown') }}."

      DEGRADED_HEAP:
        - id: alert_heap_saturation_slack
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          channel: "{{ inputs.slack_channel }}"
          username: "Kestra Vespa Sentinel"
          iconEmoji: ":warning:"
          payload: |
            {
              "attachments": [
                {
                  "color": "#FFA726",
                  "title": "⚠️ Vespa JVM Heap Saturation Warning",
                  "text": "Vespa container node `{{ inputs.vespa_host }}` reported low free JVM heap headroom below threshold `{{ inputs.min_free_heap_bytes }} bytes`.\n*Active Generation:* `{{ outputs.probe_application_status.body.generation | default('unknown') }}`\n*Status Code:* `{{ outputs.probe_node_health.body.status.code | default('unknown') }}`",
                  "footer": "Kestra Sentinel | Vector Search Resource Guard"
                }
              ]
            }

        - id: log_heap_warning
          type: io.kestra.plugin.core.log.Log
          message: "Vespa container node '{{ inputs.vespa_host }}' has insufficient heap headroom. Review garbage collection and cache allocation."

      GENERATION_DESYNC:
        - id: alert_generation_desync_slack
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          channel: "{{ inputs.slack_channel }}"
          username: "Kestra Vespa Sentinel"
          iconEmoji: ":arrows_counterclockwise:"
          payload: |
            {
              "attachments": [
                {
                  "color": "#E53935",
                  "title": "❌ Vespa Config Generation Desynchronization",
                  "text": "Vespa container node `{{ inputs.vespa_host }}` is serving config generation `{{ outputs.probe_application_status.body.generation | default(-1) }}`, which differs from expected generation `{{ inputs.expected_application_generation }}`.\nApplication convergence has stalled or an unapplied schema revision exists.",
                  "footer": "Kestra Sentinel | Schema Convergence Gate"
                }
              ]
            }

        - id: log_desync_warning
          type: io.kestra.plugin.core.log.Log
          message: "Application generation mismatch on '{{ inputs.vespa_host }}'. Investigation required to verify config model convergence."

      NODE_DOWN:
        - id: alert_node_down_slack
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          channel: "{{ inputs.slack_channel }}"
          username: "Kestra Vespa Sentinel"
          iconEmoji: ":skull:"
          payload: |
            {
              "attachments": [
                {
                  "color": "#D32F2F",
                  "title": "🚨 Vespa Node Outage Detected",
                  "text": "Vespa health probe returned status `{{ outputs.probe_node_health.body.status.code | default('down') }}` on `{{ inputs.vespa_host }}`.\n*Description:* `{{ outputs.probe_node_health.body.status.description | default('Node unreachable or unhealthy') }}`",
                  "footer": "Kestra Sentinel | Infrastructure Availability Alert"
                }
              ]
            }

  - id: log_audit_summary
    type: io.kestra.plugin.core.log.Log
    message: "Completed Vespa cluster health audit on {{ inputs.vespa_host }} at {{ now() }}. Node status: {{ outputs.probe_node_health.body.status.code | default('down') }}, Generation: {{ outputs.probe_application_status.body.generation | default('unknown') }}."

errors:
  - id: alert_probe_failure_slack
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    channel: "{{ inputs.slack_channel }}"
    username: "Kestra Vespa Sentinel"
    iconEmoji: ":rotating_light:"
    payload: |
      {
        "attachments": [
          {
            "color": "#D32F2F",
            "title": "🚨 Vespa Sentinel Probe Failure",
            "text": "The Vespa compliance probe encountered an unhandled network error or connection timeout connecting to `{{ inputs.vespa_host }}`.\n*Execution ID:* `{{ flow.executionId }}`\n*Error Message:* `{{ flow.errorMessage | default('Unknown execution error') }}`",
            "footer": "Kestra Orchestrator | Automated Incident Management"
          }
        ]
      }

extend:
  title: Vespa Cluster Convergence and Node Health Sentinel
  metaTitle: Vespa Cluster Convergence & Node Health Sentinel | Kestra
  shortDescription: Audits Vespa vector search cluster health, detects config generation convergence drift, inspects JVM heap headroom, and dispatches Slack incident alerts.
  metaDescription: Audit Vespa vector search cluster health, detect config generation convergence drift, and alert Slack on node degradation or heap exhaustion.
  description: |
    Automated health gate and convergence sentinel that monitors Vespa online big data serving and vector search clusters for container node readiness, config generation synchronization, and JVM heap memory saturation. Dispatches structured Slack incident notifications to prevent search latency spikes and schema drift in real-time recommendation and retrieval pipelines.

    ## How it works

    1. A recurrent scheduled trigger initiates the cluster audit every 3 hours, or executes on-demand via webhook or manual dispatch before deploying schema updates.
    2. The `probe_node_health` task queries `GET /state/v1/health` on the target Vespa container node to confirm HTTP service status and process readiness.
    3. The `probe_application_status` task queries `GET /ApplicationStatus` to inspect active application package metadata, deployed generation numbers, and cluster model definitions.
    4. The `probe_cluster_metrics` task queries `GET /state/v1/metrics` to capture container JVM memory allocation, free heap counters, and indexing throughput telemetry.
    5. Pebble expressions inspect the composite response payloads, evaluating health status code, comparing active generation against `expected_application_generation`, and verifying free heap memory against `min_free_heap_bytes`.
    6. The `evaluate_cluster_health` flow-control Switch evaluates the classified operational posture:
       - `COMPLIANT`: Logs clean operational metrics when the container is responsive, generation matches expectation, and heap headroom is adequate.
       - `DEGRADED_HEAP`: Formats and dispatches a rich Slack warning notifying engineers that JVM heap headroom has fallen below safety margins.
       - `GENERATION_DESYNC`: Dispatches a high-priority Slack alert detailing a configuration generation mismatch, identifying unapplied schemas or stalled cluster convergence.
       - `NODE_DOWN`: Posts an immediate critical incident alert notifying on-call engineers of service failure or unhealthy node states.
    7. A final `log_audit_summary` task records execution audit telemetry, and an `errors` block intercepts connection timeouts or network unreachability with automated Slack escalations.

    ## What you get

    - Early detection of stalled application package deployments and schema desynchronizations across container nodes.
    - Continuous JVM heap saturation surveillance preventing container out-of-memory (OOM) crashes and query latency spikes.
    - Automated Slack incident routing with actionable diagnostic payload attachments including generation IDs and status descriptions.
    - Safe operational gate validating node convergence before routing production traffic or commencing batch embedding feeds.
    - Centralized audit trail of search engine health records preserved within Kestra's execution history.

    ## Who it's for

    - Platform Engineers and SREs maintaining production Vespa vector search and recommendation clusters.
    - AI Engineers and Search Architects deploying neural ranking models and hybrid vector/lexical retrieval pipelines.
    - Data Infrastructure Teams managing real-time document feeds and high-throughput analytical serving systems.

    ## Why orchestrate this with Kestra

    - **Declarative YAML Operations**: Codify cluster health thresholds, generation expectations, and alert escalation pathways in version-controlled workflows.
    - **Native Secret Isolation**: Securely store Slack Incoming Webhook URLs and internal endpoint credentials in namespace secret stores via `{{ secret(...) }}`.
    - **Resilient Multi-Probe Architecture**: Chain sequential HTTP probes and evaluate multi-dimensional status indicators using native Pebble expressions and `Switch` branches.
    - **Proactive Deployment Safeguards**: Integrate this flow as an automated post-deployment validation step to confirm cluster convergence after rolling application updates.

    ## Prerequisites

    - A running Vespa container or cluster endpoint (accessible over HTTP/HTTPS) with standard state and metrics APIs exposed.
    - Network connectivity from the Kestra worker or runner environment to the Vespa server.
    - A Slack Incoming Webhook URL configured with permissions to post into your target operations channel.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook endpoint URL used for operational alerts.

    ## Quick start

    1. Configure the `SLACK_WEBHOOK_URL` secret in your Kestra namespace settings.
    2. Import this blueprint into your Kestra instance under your desired namespace (e.g., `company.ai`).
    3. Click **Execute** with default inputs or provide your custom `vespa_host` to validate connectivity against your instance.
    4. Review execution logs under the **Executions** tab to confirm that health codes, generation numbers, and heap metrics are extracted accurately.
    5. Enable the `scheduled_sentinel_audit` trigger to establish recurrent 3-hour automated cluster health evaluations.

    ## How to extend

    - **Automated Config Activation**: Extend the desync branch with an HTTP request to the Vespa config server (`POST /application/v2/tenant/.../prepareandactivate`) to re-trigger convergence.
    - **Proton Document Storage Probe**: Add an additional probe task querying content node `/state/v1/metrics` to monitor disk resource limits and attribute memory usage.
    - **PagerDuty Escalation**: Route critical `NODE_DOWN` states directly to PagerDuty or Opsgenie on-call schedules.
    - **Multi-Node Cluster Sweep**: Combine with a Kestra `ForEach` loop task to iterate across an array of distributed container node URLs.

    ## Links

    - [Vespa Documentation](https://docs.vespa.ai/)
    - [Vespa GitHub Repository](https://github.com/vespa-engine/vespa)
    - [Kestra HTTP Request Plugin Documentation](https://kestra.io/plugins/plugin-core/tasks/http/io.kestra.plugin.core.http.request)
    - [Kestra Slack Notification Plugin Documentation](https://kestra.io/plugins/plugin-slack/io.kestra.plugin.slack.notifications.slackincomingwebhook)
  tags:
    - AI
  subTags:
    - Monitoring & Alerting
    - Vector Stores & RAG
  ee: false
  demo: false
