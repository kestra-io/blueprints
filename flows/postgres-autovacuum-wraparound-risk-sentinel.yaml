id: postgres-autovacuum-wraparound-risk-sentinel
namespace: company.team

inputs:
  - id: postgres_url
    type: STRING
    defaults: "jdbc:postgresql://postgres.internal:5432/production"
    description: "JDBC connection URL for the target PostgreSQL database cluster."

  - id: postgres_username
    type: STRING
    defaults: "db_monitor"
    description: "Database user with permissions to query pg_database system catalogs."

  - id: freeze_max_age_warning_threshold
    type: INT
    defaults: 1500000000
    description: "Maximum allowable age(datfrozenxid) transactions before alerting (wraparound limit is 2.14 billion)."

  - id: slack_webhook_url
    type: STRING
    defaults: "{{ secret('SLACK_WEBHOOK_URL') }}"
    description: "Slack Incoming Webhook URL for DBA team notifications."

tasks:
  - id: query_database_freeze_horizon
    type: io.kestra.plugin.jdbc.postgres.Query
    url: "{{ inputs.postgres_url }}"
    username: "{{ inputs.postgres_username }}"
    password: "{{ secret('POSTGRES_PASSWORD') }}"
    fetchType: FETCH
    sql: |
      SELECT
        datname,
        age(datfrozenxid) AS current_freeze_age,
        (2147483647 - age(datfrozenxid)) AS remaining_transactions,
        ROUND((age(datfrozenxid)::numeric / 2147483647.0) * 100, 2) AS capacity_percentage
      FROM pg_database
      WHERE datallowconn = true
      ORDER BY age(datfrozenxid) DESC;

  - id: analyze_wraparound_risk
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    inputFiles:
      rows.json: "{{ outputs.query_database_freeze_horizon.rows | default('[]') | json }}"
    outputFiles:
      - wraparound_report.json
    script: |
      import json
      from kestra import Kestra

      with open("rows.json", "r", encoding="utf-8") as f:
          databases = json.load(f)

      threshold = int("{{ inputs.freeze_max_age_warning_threshold }}")
      at_risk_dbs = []

      for db in databases:
          name = db.get("datname", "unknown")
          age_val = int(db.get("current_freeze_age", 0))
          remaining = int(db.get("remaining_transactions", 0))
          pct = float(db.get("capacity_percentage", 0.0))

          if age_val > threshold:
              at_risk_dbs.append({
                  "database": name,
                  "current_age": age_val,
                  "remaining_tx": remaining,
                  "capacity_pct": pct
              })

      has_risk = len(at_risk_dbs) > 0

      report = {
          "total_databases_scanned": len(databases),
          "warning_threshold": threshold,
          "at_risk_count": len(at_risk_dbs),
          "at_risk_databases": at_risk_dbs,
          "has_risk": has_risk
      }

      with open("wraparound_report.json", "w", encoding="utf-8") as f:
          json.dump(report, f, indent=2)

      Kestra.outputs({
          "wraparound_risk_detected": has_risk,
          "at_risk_count": len(at_risk_dbs),
          "highest_age_database": at_risk_dbs[0]["database"] if at_risk_dbs else "None",
          "highest_age_value": at_risk_dbs[0]["current_age"] if at_risk_dbs else 0
      })

  - id: evaluate_risk_condition
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.analyze_wraparound_risk.vars.wraparound_risk_detected }}"
    then:
      - id: alert_dba_team_on_wraparound_risk
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ inputs.slack_webhook_url }}"
        payload: |
          {
            "text": "CRITICAL: PostgreSQL Autovacuum Wraparound Risk Alert: Found {{ outputs.analyze_wraparound_risk.vars.at_risk_count }} database(s) exceeding freeze horizon threshold (Age: {{ outputs.analyze_wraparound_risk.vars.highest_age_value }} transactions). Highest risk database: `{{ outputs.analyze_wraparound_risk.vars.highest_age_database }}`. Immediate VACUUM FREEZE is required to prevent emergency read-only shutdown."
          }

  - id: log_wraparound_audit_summary
    type: io.kestra.plugin.core.log.Log
    message: "PostgreSQL autovacuum wraparound audit completed. At risk databases: {{ outputs.analyze_wraparound_risk.vars.at_risk_count }}. Highest age: {{ outputs.analyze_wraparound_risk.vars.highest_age_value }}."

triggers:
  - id: daily_wraparound_check
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 3 * * *"

extend:
  title: "PostgreSQL Autovacuum Wraparound Risk Sentinel"
  shortDescription: "Monitors transaction freeze horizon in pg_database to prevent emergency read-only lockups."
  metaTitle: "PostgreSQL Autovacuum Wraparound Risk Sentinel | Kestra Blueprint"
  metaDescription: "Monitors PostgreSQL datfrozenxid transaction age to detect autovacuum wraparound risk before database enters emergency read-only mode."
  tags:
    - Data
    - Infrastructure
    - System
  ee: false
  demo: false
  description: |
    ### What It Does
    This blueprint monitors PostgreSQL clusters for transaction ID wraparound risk by querying `age(datfrozenxid)` across all active databases. If any database exceeds the configured warning threshold (default: 1.5 billion transactions out of the 2.14 billion horizon), it triggers high-priority DBA alerts to schedule an aggressive `VACUUM FREEZE` before PostgreSQL enters fail-safe read-only mode.

    ### Prerequisites
    - Network access to the PostgreSQL instance via JDBC port (default 5432).
    - Database user credentials stored in secret `POSTGRES_PASSWORD`.
    - Slack Incoming Webhook configured in secret `SLACK_WEBHOOK_URL`.

    ### Quick Start
    1. Set your PostgreSQL JDBC endpoint in `postgres_url`.
    2. Specify the monitoring user in `postgres_username`.
    3. Keep or adjust `freeze_max_age_warning_threshold` (1.5 billion transactions is the standard enterprise warning threshold).
    4. Run on schedule to continuously guard against wraparound outages.

    ### Inputs
    | Name | Type | Default | Description |
    | :--- | :--- | :--- | :--- |
    | `postgres_url` | STRING | `jdbc:postgresql://...` | JDBC URL of PostgreSQL database |
    | `postgres_username` | STRING | `db_monitor` | Monitoring database user |
    | `freeze_max_age_warning_threshold` | INT | `1500000000` | Transaction age threshold for alert |
    | `slack_webhook_url` | STRING | `{{ secret('SLACK_WEBHOOK_URL') }}` | Slack notification destination |

    ### Expected Outputs
    - `outputs.analyze_wraparound_risk.vars.wraparound_risk_detected`: Boolean indicating if any database breached the threshold.
    - `outputs.analyze_wraparound_risk.vars.highest_age_value`: Highest transaction age found across databases.
    - `outputs.analyze_wraparound_risk.outputFiles['wraparound_report.json']`: Detailed JSON report with transaction ages.

    ### Common Pitfalls
    - Failing to freeze old transactions before reaching 2.0 billion transactions will force PostgreSQL to shut down and refuse new write transactions until vacuumed in single-user maintenance mode.
    - Large tables with multixacts or abandoned prepared transactions can also stall vacuum progress.
