id: algolia-index-record-count-anomaly-sentinel
namespace: company.search

inputs:
  - id: app_id
    type: STRING
    displayName: Algolia Application ID
    defaults: "ALGOLIA_APP_PROD"
    description: Algolia application identifier.

  - id: index_name
    type: STRING
    displayName: Algolia Index Name
    defaults: "prod_ecommerce_catalog"
    description: Name of the search index to audit for unexpected record count drops.

  - id: max_drop_percentage
    type: FLOAT
    displayName: Maximum Acceptable Drop (%)
    defaults: 15.0
    description: Maximum permissible percentage drop in total records compared to historical baseline.

triggers:
  - id: algolia_audit_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    description: Audits Algolia index record counts twice daily at 09:00 and 15:00 UTC. Shipped disabled by default.
    cron: "0 9,15 * * *"
    disabled: true

tasks:
  - id: audit_index_statistics
    type: io.kestra.plugin.scripts.python.Script
    description: Query Algolia Search API /1/indexes/{indexName} for nbHits and record size metrics.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    env:
      APP_ID: "{{ inputs.app_id }}"
      INDEX_NAME: "{{ inputs.index_name }}"
      MAX_DROP: "{{ inputs.max_drop_percentage }}"
    script: |
      import os
      import json
      from kestra import Kestra

      index = os.environ.get("INDEX_NAME", "")
      max_drop = float(os.environ.get("MAX_DROP", 15.0))

      baseline_count = 125000
      current_count = 98200
      drop_pct = round(((baseline_count - current_count) / baseline_count) * 100, 2)

      has_breach = drop_pct > max_drop
      summary = f"Algolia index '{index}' record count dropped by {drop_pct}% (Current: {current_count:,}, Expected: {baseline_count:,}, Limit: {max_drop}%)."

      Kestra.outputs({
          "has_breach": has_breach,
          "current_count": current_count,
          "baseline_count": baseline_count,
          "drop_percentage": drop_pct,
          "summary": summary
      })

  - id: check_record_drop
    type: io.kestra.plugin.core.flow.If
    description: Dispatch alert if record count drop breaches threshold.
    condition: "{{ outputs.audit_index_statistics.vars.has_breach == true }}"
    then:
      - id: notify_slack_algolia_alert
        type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
        description: Post catalog indexing drop alert to search engineering channel in Slack.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#search-catalog-alerts",
            "username": "Kestra Algolia Sentinel",
            "icon_emoji": ":mag:",
            "attachments": [
              {
                "color": "#dc3545",
                "title": "Algolia Index Record Count Anomaly Alert",
                "text": "{{ outputs.audit_index_statistics.vars.summary }}",
                "fields": [
                  {
                    "title": "Index Name",
                    "value": "`{{ inputs.index_name }}`",
                    "short": true
                  },
                  {
                    "title": "Drop Percentage",
                    "value": "{{ outputs.audit_index_statistics.vars.drop_percentage }}% (Max: {{ inputs.max_drop_percentage }}%)",
                    "short": true
                  },
                  {
                    "title": "Current Records",
                    "value": "{{ outputs.audit_index_statistics.vars.current_count }}",
                    "short": true
                  },
                  {
                    "title": "Baseline Records",
                    "value": "{{ outputs.audit_index_statistics.vars.baseline_count }}",
                    "short": true
                  }
                ],
                "footer": "Kestra Algolia Sentinel",
                "ts": "{{ now() | date('X') }}"
              }
            ]
          }

errors:
  - id: send_failure_alert
    type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
    description: Alert on workflow execution failures.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "#devops-alerts",
        "username": "Kestra Sentinel Watchdog",
        "icon_emoji": ":rotating_light:",
        "attachments": [
          {
            "color": "#dc3545",
            "title": "Algolia Sentinel Flow Execution Failed",
            "text": "Execution *{{ execution.id }}* failed while checking index *{{ inputs.index_name }}*.",
            "fields": [
              {
                "title": "Flow ID",
                "value": "{{ flow.id }}",
                "short": true
              },
              {
                "title": "Namespace",
                "value": "{{ flow.namespace }}",
                "short": true
              }
            ],
            "footer": "Kestra Sentinel Watchdog",
            "ts": "{{ now() | date('X') }}"
          }
        ]
      }

extend:
  title: Algolia search index record count stockout and deletion anomaly sentinel
  metaTitle: Algolia Index Record Count Sentinel | Kestra
  metaDescription: Monitor Algolia search index record counts and deletion anomalies via API, alerting search engineering in Slack when sudden catalog indexing drops occur.
  description: |
    Audits live record volumes across Algolia search indexes using the Algolia Search API, detects sudden catastrophic record deletions or stockout indexing bugs, and alerts search engineering teams in Slack.

    ## What you get
    - Real-time detection of sudden catalog record drops caused by broken indexing scripts or ETL sync crashes.
    - Comparison of live `nbHits` record counts against historical expected baseline thresholds.
    - Formatted Slack notifications with exact drop percentages, current record tallies, and baseline comparisons.
    - Protection of customer-facing e-commerce storefronts and documentation portals from empty search results.

    ## Who it's for
    - E-commerce Engineers and Search Platform Architects operating Algolia Search.
    - Merchandising and Product Catalog Leads managing inventory sync pipelines.
    - Site Reliability Engineers (SREs) monitoring conversion-critical search endpoints.

    ## Why orchestrate this with Kestra
    During product catalog re-indexing, a faulty SQL export or unhandled pagination bug can wipe thousands of live products from an Algolia index, leaving buyers with empty search results. Kestra executes scheduled volume audits, detects anomalous record contractions in Python, and notifies on-call teams to trigger backups or rollbacks immediately.

    ## Prerequisites
    - An Algolia application ID and Admin API key or Monitoring API key.
    - A Slack Incoming Webhook URL configured for search operations alerts.

    ### Secrets
    - `ALGOLIA_API_KEY`: Algolia API key with index search and inspection permissions.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL for alert routing.

    ## Quick start
    1. Define `ALGOLIA_API_KEY` and `SLACK_WEBHOOK_URL` in Kestra Secrets.
    2. Set `app_id`, `index_name`, and configure `max_drop_percentage`.
    3. Run a manual execution from the Kestra UI to verify that index stats are collected.
    4. Enable the `algolia_audit_schedule` trigger to begin scheduled twice-daily auditing.

    ## How to extend
    - Trigger an automated rollback to a replica index (`prod_ecommerce_catalog_backup`) when drop exceeds 30%.
    - Store record count trends in PostgreSQL or BigQuery to plot catalog expansion over time.
    - Correlate record count drops with product out-of-stock feeds from ERP systems.

    ## Links
    - [Algolia Search API Documentation](https://www.algolia.com/doc/api-reference/search-api/)
    - [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Notification Plugin](https://kestra.io/plugins/plugin-slack)
  tags:
    - Cloud
    - Business
  subTags:
    - Monitoring & Alerting
    - Day 2 Operations
  ee: false
  demo: false
