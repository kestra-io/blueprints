id: kubernetes-coredns-nxdomain-rate-surge-sentinel
namespace: company.platform

description: |
  Audits CoreDNS Prometheus metrics for anomalous surges in NXDOMAIN responses, identifying broken service discovery lookups and alerting SRE teams on Slack.

concurrency:
  limit: 1

inputs:
  - id: prometheus_endpoint
    type: STRING
    displayName: "Prometheus Endpoint URL"
    defaults: "http://prometheus-k8s.monitoring:9090"
    description: "Base HTTP URL of the Prometheus server scraping CoreDNS cluster metrics."

  - id: cluster_identifier
    type: STRING
    displayName: "Cluster Identifier"
    defaults: "k8s-production-us-east-1"
    description: "Cluster identifier label utilized within Prometheus metrics queries."

  - id: max_nxdomain_per_sec
    type: FLOAT
    displayName: "Max NXDOMAIN Rate (/sec)"
    defaults: 150.0
    description: "Maximum tolerated NXDOMAIN response rate per second across CoreDNS instances before alerting."

  - id: lookback_window_minutes
    type: INT
    displayName: "Lookback Window (Minutes)"
    defaults: 10
    description: "Duration in minutes across which rate metrics are evaluated."

  - id: alert_on_surge
    type: BOOL
    displayName: "Alert On Surge"
    defaults: true
    description: "Toggle whether Slack webhook alerts are dispatched upon detecting elevated NXDOMAIN response rates."

tasks:
  - id: scan_coredns_nxdomain_metrics
    type: io.kestra.plugin.scripts.python.Script
    description: Queries Prometheus for CoreDNS NXDOMAIN rate and overall request volume.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests kestra
    env:
      PROMETHEUS_URL: "{{ inputs.prometheus_endpoint }}"
      CLUSTER_NAME: "{{ inputs.cluster_identifier }}"
      MAX_RATE: "{{ inputs.max_nxdomain_per_sec }}"
      LOOKBACK_MIN: "{{ inputs.lookback_window_minutes }}"
    script: |
      import os
      import sys
      import requests
      from datetime import datetime, timezone
      from kestra import Kestra

      prom_url = os.environ.get("PROMETHEUS_URL", "http://prometheus-k8s.monitoring:9090").rstrip("/")
      cluster = os.environ.get("CLUSTER_NAME", "k8s-production-us-east-1")
      max_rate = float(os.environ.get("MAX_RATE", "150.0"))
      lookback = os.environ.get("LOOKBACK_MIN", "10")

      query_nx = f'sum(rate(coredns_dns_responses_total{{rcode="NXDOMAIN",cluster="{cluster}"}}[{lookback}m]))'
      query_total = f'sum(rate(coredns_dns_responses_total{{cluster="{cluster}"}}[{lookback}m]))'

      print(f"Querying Prometheus at {prom_url} for CoreDNS metrics...")
      try:
          r_nx_resp = requests.get(f"{prom_url}/api/v1/query", params={"query": query_nx}, timeout=15)
          r_nx_resp.raise_for_status()
          r_nx = r_nx_resp.json()

          r_tot_resp = requests.get(f"{prom_url}/api/v1/query", params={"query": query_total}, timeout=15)
          r_tot_resp.raise_for_status()
          r_tot = r_tot_resp.json()
      except Exception as e:
          print(f"ERROR: Failed to query CoreDNS metrics from Prometheus at {prom_url}: {e}", file=sys.stderr)
          sys.exit(1)

      nxdomain_rate = 0.0
      total_lookups = 0
      nxdomain_pct = 0.0

      if r_nx.get("data", {}).get("result"):
          nxdomain_rate = round(float(r_nx["data"]["result"][0]["value"][1]), 2)
      if r_tot.get("data", {}).get("result"):
          total_rate = float(r_tot["data"]["result"][0]["value"][1])
          total_lookups = int(total_rate * int(lookback) * 60)
          if total_rate > 0:
              nxdomain_pct = round((nxdomain_rate / total_rate) * 100.0, 2)

      is_alerting = nxdomain_rate > max_rate
      print(f"CoreDNS: nxdomain_rate={nxdomain_rate}/s (threshold {max_rate}), total_lookups={total_lookups}, nxdomain_pct={nxdomain_pct}%, is_alerting={is_alerting}")

      Kestra.outputs({
          "nxdomain_rate_per_sec": nxdomain_rate,
          "total_dns_lookups": total_lookups,
          "nxdomain_percentage": nxdomain_pct,
          "is_alerting": is_alerting,
          "audit_timestamp": datetime.now(timezone.utc).isoformat()
      })

  - id: evaluate_nxdomain_rate_threshold
    type: io.kestra.plugin.core.flow.If
    description: Evaluates whether observed CoreDNS NXDOMAIN rate breaches defined threshold.
    condition: "{{ outputs.scan_coredns_nxdomain_metrics.vars.is_alerting and inputs.alert_on_surge }}"
    then:
      - id: notify_slack_sre_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches high-urgency incident notification to SRE Slack channel.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#platform-alerts",
            "text": "CRITICAL: Elevated CoreDNS NXDOMAIN Rate in Cluster `{{ inputs.cluster_identifier }}`. Current Rate: `{{ outputs.scan_coredns_nxdomain_metrics.vars.nxdomain_rate_per_sec }}`/sec (threshold: `{{ inputs.max_nxdomain_per_sec }}`/sec). NXDOMAIN Ratio: `{{ outputs.scan_coredns_nxdomain_metrics.vars.nxdomain_percentage }}`%. Total Lookups: `{{ outputs.scan_coredns_nxdomain_metrics.vars.total_dns_lookups }}`."
          }
    else:
      - id: log_nominal_dns_state
        type: io.kestra.plugin.core.log.Log
        description: Records nominal telemetry when CoreDNS resolution operates smoothly.
        message: "CoreDNS resolution nominal for {{ inputs.cluster_identifier }}: {{ outputs.scan_coredns_nxdomain_metrics.vars.nxdomain_rate_per_sec }}/sec NXDOMAIN rate."

triggers:
  - id: periodic_coredns_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

outputs:
  - id: nxdomain_rate_per_sec
    type: FLOAT
    description: Measured NXDOMAIN responses per second.
    value: "{{ outputs.scan_coredns_nxdomain_metrics.vars.nxdomain_rate_per_sec }}"
  - id: total_dns_lookups
    type: INT
    description: Total DNS queries evaluated in window.
    value: "{{ outputs.scan_coredns_nxdomain_metrics.vars.total_dns_lookups }}"
  - id: nxdomain_percentage
    type: FLOAT
    description: Percentage of total queries returning NXDOMAIN.
    value: "{{ outputs.scan_coredns_nxdomain_metrics.vars.nxdomain_percentage }}"
  - id: is_alerting
    type: BOOLEAN
    description: True if rate exceeded threshold, false otherwise.
    value: "{{ outputs.scan_coredns_nxdomain_metrics.vars.is_alerting }}"

extend:
  title: "Kubernetes CoreDNS NXDOMAIN Rate Surge Sentinel"
  metaTitle: "Kubernetes CoreDNS NXDOMAIN Sentinel Blueprint"
  shortDescription: "Audits CoreDNS Prometheus metrics for anomalous surges in NXDOMAIN responses, identifying broken service discovery lookups and alerting SRE teams on Slack."
  metaDescription: "Audits CoreDNS Prometheus metrics for anomalous surges in NXDOMAIN responses, identifying broken service discovery lookups and alerting SRE teams on Slack."
  description: |
    Automates continuous health and resolution surveillance for CoreDNS in Kubernetes clusters using Prometheus metrics.

    ## How it works
    1. Scrapes Prometheus metrics for CoreDNS query responses (`coredns_dns_responses_total`).
    2. Calculates the NXDOMAIN rate per second and percentage across cluster nodes.
    3. Alerts SRE and platform teams on Slack when the rate exceeds acceptable limits.

    ## Prerequisites
    - Prometheus instance scraping CoreDNS metrics.
    - Secret `SLACK_WEBHOOK_URL` configured in Kestra.

    ## Quick start
    1. Import this blueprint into your Kestra workspace.
    2. Configure `prometheus_endpoint` and `cluster_identifier`.
    3. Enable the schedule trigger for continuous resolution monitoring.

    ## Links
    - [CoreDNS Monitoring Documentation](https://coredns.io/plugins/metrics/)
    - [Kestra Python Plugin](https://kestra.io/plugins/plugin-scripts-python)
  tags:
    - Cloud
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - Infrastructure Automation
  ee: false
  demo: false
