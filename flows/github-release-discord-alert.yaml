id: github-release-discord-alert
namespace: company.team

inputs:
  - id: github_owner
    type: STRING
    displayName: Repository Owner
    description: GitHub user or organization that owns the repository.
    defaults: kestra-io

  - id: github_repo
    type: STRING
    displayName: Repository Name
    description: Name of the GitHub repository to watch for releases.
    defaults: kestra

  - id: discord_username
    type: STRING
    displayName: Discord Bot Username
    description: Display name shown on the Discord message.
    defaults: Release Watcher

triggers:
  - id: release_check_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 */6 * * *"
    description: Poll for new releases every six hours.

tasks:
  - id: fetch_latest_release
    type: io.kestra.plugin.core.http.Request
    description: Query the GitHub Releases API for the latest published release.
    uri: "https://api.github.com/repos/{{ inputs.github_owner }}/{{ inputs.github_repo }}/releases/latest"
    method: GET
    headers:
      Accept: application/vnd.github+json
      User-Agent: kestra-release-watcher
      Authorization: "Bearer {{ secret('GITHUB_TOKEN') }}"
    options:
      allowFailed: true

  - id: parse_release
    type: io.kestra.plugin.scripts.python.Script
    description: Parse the GitHub release response, extract metadata and changelog summary, and filter out drafts.
    inputFiles:
      release_response.json: "{{ outputs.fetch_latest_release.body }}"
    script: |
      import json
      from kestra import Kestra

      with open("release_response.json") as f:
          data = json.load(f)

      tag_name = data.get("tag_name", "")
      release_name = data.get("name") or tag_name
      html_url = data.get("html_url", "")
      published_at = data.get("published_at", "unknown")
      is_draft = data.get("draft", False)
      is_prerelease = data.get("prerelease", False)
      author = (data.get("author") or {}).get("login", "unknown")

      body_raw = data.get("body", "") or ""
      body_summary = body_raw[:300].replace("\n", " ").strip()
      if len(body_raw) > 300:
          body_summary += "..."

      should_alert = bool(tag_name and not is_draft)

      Kestra.outputs({
          "tag_name": tag_name,
          "release_name": release_name,
          "html_url": html_url,
          "published_at": published_at,
          "is_draft": is_draft,
          "is_prerelease": is_prerelease,
          "author": author,
          "body_summary": body_summary,
          "should_alert": should_alert
      })

  - id: check_new_release
    type: io.kestra.plugin.core.flow.If
    description: Only send a Discord alert when the release is valid and not a draft.
    condition: "{{ outputs.parse_release.vars.should_alert == true }}"
    then:
      - id: get_last_known_tag
        type: io.kestra.plugin.core.kv.Get
        key: github_release_last_tag
        namespace: "{{ flow.namespace }}"
        errorOnMissing: false

      - id: evaluate_tag_change
        type: io.kestra.plugin.core.flow.If
        description: Compare fetched tag against the last stored tag to avoid duplicate alerts.
        condition: "{{ (outputs.get_last_known_tag.value ?? '') != outputs.parse_release.vars.tag_name }}"
        then:
          - id: send_discord_alert
            type: io.kestra.plugin.discord.DiscordExecution
            description: Post a rich embed to Discord with release details.
            url: "{{ secret('DISCORD_WEBHOOK') }}"
            username: "{{ inputs.discord_username }}"
            embedList:
              - title: "🚀 New Release: {{ outputs.parse_release.vars.release_name }}"
                description: |
                  **Repository:** {{ inputs.github_owner }}/{{ inputs.github_repo }}
                  **Tag:** `{{ outputs.parse_release.vars.tag_name }}`
                  **Author:** {{ outputs.parse_release.vars.author }}
                  **Published:** {{ outputs.parse_release.vars.published_at }}
                  **Pre-release:** {{ outputs.parse_release.vars.is_prerelease }}

                  {{ outputs.parse_release.vars.body_summary }}

                  [View Release]({{ outputs.parse_release.vars.html_url }})
                color:
                  - 88
                  - 166
                  - 255
            executionId: "{{ execution.id }}"

          - id: store_last_tag
            type: io.kestra.plugin.core.kv.Set
            key: github_release_last_tag
            namespace: "{{ flow.namespace }}"
            value: "{{ outputs.parse_release.vars.tag_name }}"
            overwrite: true

        else:
          - id: tag_unchanged
            type: io.kestra.plugin.core.log.Log
            message: "No new release. Current tag {{ outputs.parse_release.vars.tag_name }} matches last known tag."

    else:
      - id: skip_draft
        type: io.kestra.plugin.core.log.Log
        message: "Skipped: release is a draft or tag was empty."

errors:
  - id: alert_fetch_failure
    type: io.kestra.plugin.discord.DiscordExecution
    description: Notify Discord if the release check flow itself fails unexpectedly.
    url: "{{ secret('DISCORD_WEBHOOK') }}"
    username: "{{ inputs.discord_username }}"
    embedList:
      - title: "⚠️ Release Check Failed"
        description: |
          The GitHub release monitoring flow for **{{ inputs.github_owner }}/{{ inputs.github_repo }}** encountered an error.
          Check execution {{ execution.id }} for details.
        color:
          - 255
          - 85
          - 85
    executionId: "{{ execution.id }}"

extend:
  title: GitHub Release to Discord Alert with Duplicate Detection
  metaTitle: GitHub Release Discord Notification with Kestra Orchestration
  shortDescription: Poll a GitHub repository for new releases on a schedule, parse the response with Python, and send a rich Discord embed only when a genuinely new version is published.
  metaDescription: Schedule-driven Kestra flow that queries GitHub Releases API, filters drafts with Python, and posts Discord alerts for new tags using KV-backed deduplication.
  description: |
    Stop finding out about upstream releases from a colleague or a broken build. This blueprint watches any GitHub repository on a six-hour schedule, compares the latest release tag against a KV-backed last-known value, and posts a rich Discord embed the moment a genuinely new version lands, complete with tag, author, publish date, and a truncated changelog summary. Draft releases are filtered out, duplicate alerts are suppressed, and the error handler sends its own Discord message if the monitoring flow itself breaks, so you never silently miss a release.

    ## How it works

    1. A `Schedule` trigger (`io.kestra.plugin.core.trigger.Schedule`) fires every six hours via the cron `0 */6 * * *`.
    2. The `fetch_latest_release` task (`io.kestra.plugin.core.http.Request`) calls the GitHub Releases API at `/repos/{owner}/{repo}/releases/latest` with a bearer token and `allowFailed: true` so a 404 for repos with no releases does not crash the flow.
    3. The `parse_release` task (`io.kestra.plugin.scripts.python.Script`) deserializes the JSON, extracts the tag name, release name, author, published date, pre-release flag, and a 300-character body summary, then sets `should_alert` to `false` for drafts or empty tags.
    4. An outer `If` flowable (`io.kestra.plugin.core.flow.If`) gates all downstream work on `should_alert == true`.
    5. Inside the gate, a `kv.Get` task retrieves the last-known tag from the Kestra KV store. A nested `If` compares it to the fetched tag; only a mismatch triggers the alert path.
    6. The `send_discord_alert` task (`io.kestra.plugin.discord.DiscordExecution`) posts a color-coded embed with the release name, tag, author, date, pre-release status, changelog snippet, and a direct link.
    7. A `kv.Set` task persists the new tag so the next run skips it.
    8. The `errors` block sends a separate Discord embed if any task fails, ensuring the monitoring itself is monitored.

    ## What you get

    - Timely Discord alerts the moment a new release is published, without RSS polling lag.
    - KV-backed deduplication so repeated schedule runs never spam the channel.
    - Draft filtering that keeps noise out of the alert channel.
    - A truncated changelog summary in every embed for at-a-glance context.
    - A dedicated error notification ensuring silent monitoring failures are impossible.
    - Full execution history in Kestra for auditing when each release was detected.

    ## Who it's for

    - Platform and DevOps engineers tracking upstream dependencies for upgrade planning.
    - Open-source maintainers who want instant team visibility on new releases of tools they depend on.
    - Release managers who coordinate downstream deployments when an upstream library ships.

    ## Why orchestrate this with Kestra

    A GitHub webhook could push release events, but it requires a publicly reachable endpoint, webhook secret management, and custom server code. A cron script works until the machine reboots or the state file gets lost. Kestra replaces both with declarative YAML: the schedule is version-controlled, the KV store persists deduplication state across runs without an external database, retries protect against transient GitHub or Discord outages, and the execution timeline shows exactly when each release was detected and whether the alert was sent or skipped.

    ## Prerequisites

    - A Kestra instance (v2.0+) with the **Discord** and **Script (Python)** plugins installed.
    - A GitHub personal access token with `repo` (or `public_repo` for public repositories) scope.
    - A Discord server with an incoming webhook configured on the target channel.

    ### Secrets

    - `GITHUB_TOKEN`: GitHub personal access token used to authenticate API requests and avoid rate limits.
    - `DISCORD_WEBHOOK`: Discord incoming webhook URL where release alerts are posted.

    ## Quick start

    1. Store `GITHUB_TOKEN` and `DISCORD_WEBHOOK` as secrets in your Kestra namespace.
    2. Adjust the `github_owner` and `github_repo` input defaults to the repository you want to watch, or leave them as `kestra-io/kestra` for an immediate test.
    3. Execute the flow manually once. Check the `parse_release` outputs and verify the Discord embed arrives.
    4. Enable the `release_check_schedule` trigger. The KV store will initialize on the first run and suppress duplicates from the second run onward.

    ## How to extend

    - Watch multiple repositories by wrapping the flow in a `Loop` over an `ARRAY` input of `owner/repo` pairs.
    - Add Slack or PagerDuty tasks alongside Discord for multi-channel alerting.
    - Filter pre-releases by adding `and not is_prerelease` to the `should_alert` condition in the Python script.
    - Trigger a downstream CI/CD pipeline (e.g., dependency update PR) by adding a `kestra.plugin.core.flow.Subflow` task after the alert.
    - Shorten or lengthen the schedule cron for critical vs. low-priority dependencies.

    ## Links

    - [Discord plugin docs](https://kestra.io/plugins/plugin-discord)
    - [HTTP Request task](https://kestra.io/plugins/core/http/io.kestra.plugin.core.http.request)
    - [Python Script task](https://kestra.io/plugins/plugin-script-python)
    - [KV Store tasks](https://kestra.io/plugins/core/kv)
    - [GitHub Releases API](https://docs.github.com/en/rest/releases/releases#get-the-latest-release)
  tags:
    - Infrastructure
  subTags:
    - Monitoring & Alerting
  ee: false
  demo: false
