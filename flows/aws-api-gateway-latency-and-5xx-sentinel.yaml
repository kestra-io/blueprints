id: aws-api-gateway-latency-and-5xx-sentinel
namespace: company.cloud

inputs:
  - id: aws_region
    type: STRING
    defaults: "us-east-1"
    description: Target AWS region.
  - id: api_name
    type: STRING
    description: Amazon API Gateway name or ID.
  - id: max_5xx_errors
    type: INT
    defaults: 10
    description: Maximum acceptable count of HTTP 5XX server errors over the last 15 minutes.

tasks:
  - id: query_api_gateway_telemetry
    type: io.kestra.plugin.aws.cli.AwsCLI
    region: "{{ inputs.aws_region }}"
    accessKeyId: "{{ secret('AWS_ACCESS_KEY_ID') }}"
    secretKeyId: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
    commands:
      - |
        START_TIME=$(date -u -v-15M +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || date -u -d "15 minutes ago" +%Y-%m-%dT%H:%M:%SZ)
        END_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
        
        aws cloudwatch get-metric-data           --metric-data-queries '[{"Id":"e5xx","MetricStat":{"Metric":{"Namespace":"AWS/ApiGateway","MetricName":"5XXError","Dimensions":[{"Name":"ApiName","Value":"{{ inputs.api_name }}"}]},"Period":900,"Stat":"Sum"}},{"Id":"lat","MetricStat":{"Metric":{"Namespace":"AWS/ApiGateway","MetricName":"Latency","Dimensions":[{"Name":"ApiName","Value":"{{ inputs.api_name }}"}]},"Period":900,"Stat":"Average"}}]'           --start-time "$START_TIME"           --end-time "$END_TIME"           --output json > /tmp/apigw_telemetry.json
        
        ERRORS_5XX=$(jq '.MetricDataResults[] | select(.Id == "e5xx") | .Values | add // 0' /tmp/apigw_telemetry.json)
        AVG_LATENCY=$(jq '.MetricDataResults[] | select(.Id == "lat") | .Values[0] // 0' /tmp/apigw_telemetry.json)
        
        echo "::set-output name=errors_5xx::$ERRORS_5XX::"
        echo "::set-output name=avg_latency::$AVG_LATENCY::"

  - id: evaluate_api_health
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.query_api_gateway_telemetry.vars.errors_5xx | int > inputs.max_5xx_errors }}"
    then:
      - id: notify_api_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#api-incident-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 AWS API Gateway 5XX Error Spike Alert",
                "text": "API Gateway `{{ inputs.api_name }}` recorded *{{ outputs.query_api_gateway_telemetry.vars.errors_5xx }}* 5XX errors in the last 15 minutes (avg latency: {{ outputs.query_api_gateway_telemetry.vars.avg_latency }}ms). Impact: Client applications are receiving gateway errors and dropped requests.",
                "footer": "Kestra Cloud Sentinel • AWS API Gateway"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#api-incident-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ API Gateway Sentinel Execution Failed",
            "text": "The API Gateway CloudWatch query workflow failed. Please verify AWS credentials and API name.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true
    inputs:
      api_name: replace-with-your-api-name

extend:
  metaDescription: "Audits Amazon API Gateway CloudWatch metrics to detect 5XX server errors and integration latency spikes impacting REST/HTTP APIs."
  metaTitle: AWS API Gateway 5XX Error Rate and Latency Degradation Sentinel with Kestra
  title: AWS API Gateway 5XX Error Rate and Latency Degradation Sentinel
  shortDescription: Audits Amazon API Gateway CloudWatch metrics to detect 5XX server errors and integration latency spikes impacting REST/HTTP APIs.
  description: |
    ## How it works
    This workflow connects to Amazon CloudWatch via the AWS CLI plugin to sample `5XXError` and `Latency` metrics for designated API Gateway instances. When backend Lambda functions crash, HTTP integration endpoints time out, or authorization microservices fail, API Gateway returns HTTP 500/502/504 status codes. When 5XX error counts breach the configured threshold, an automated Slack incident alert is immediately dispatched.

    ## What you get
    - Real-time detection of backend integration failures and gateway crashes.
    - Correlated latency telemetry to diagnose downstream database and service degradation.
    - Automated incident notification for mobile and web API platform teams.

    ## Who it's for
    - API Platform Engineers and Backend Developers managing public REST and HTTP APIs.
    - SREs maintaining production serverless applications on AWS.

    ## Why orchestrate this with Kestra
    - **Unified Telemetry Polling**: Automate CloudWatch sampling across multiple APIs without third-party monitoring costs.
    - **Flexible Thresholds**: Configure custom error thresholds per API tier (e.g. payment APIs vs telemetry ingestion).
    - **Incident Escalation**: Seamlessly connect to Slack, PagerDuty, or automated rollback flows.

    ## Prerequisites
    - AWS IAM credentials with `cloudwatch:GetMetricData` permissions.
    - Secrets `AWS_ACCESS_KEY_ID`, `AWS_SECRET_ACCESS_KEY`, and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import this blueprint into Kestra.
    2. Enter your API Gateway name and set credentials.
    3. Trigger the workflow to check API Gateway health.

    ## How to extend
    - Query integration-specific error metrics (e.g., `IntegrationLatency`).
    - Dispatch PagerDuty incidents for critical public APIs.

    ## Links
    - [Amazon API Gateway CloudWatch Metrics](https://docs.aws.amazon.com/apigateway/latest/developerguide/api-gateway-metrics-and-dimensions.html)
    - [Kestra AWS CLI Plugin](https://kestra.io/plugins/plugin-aws/cli/io.kestra.plugin.aws.cli.awscli)
  tags:
    - Cloud
    - Infrastructure
  subTags:
    - AWS Services
    - Infrastructure Automation
  ee: false
  demo: false
