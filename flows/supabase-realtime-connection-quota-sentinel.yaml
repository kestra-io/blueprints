id: supabase-realtime-connection-quota-sentinel
namespace: company.cloud

inputs:
  - id: supabase_api_url
    type: STRING
    defaults: "https://api.supabase.com/v1"
    description: Base URL of the Supabase Management API.
  - id: project_ref
    type: STRING
    description: Target Supabase Project Reference ID to audit.
  - id: max_connections_percentage
    type: INT
    defaults: 80
    description: "Maximum allowable active connection pool utilization percentage (default 80%)."

tasks:
  - id: inspect_supabase_telemetry
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install requests kestra
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    env:
      API_URL: "{{ inputs.supabase_api_url }}"
      PROJECT_REF: "{{ inputs.project_ref }}"
      TOKEN: "{{ secret('SUPABASE_ACCESS_TOKEN') }}"
      MAX_PCT: "{{ inputs.max_connections_percentage }}"
    script: |
      import os
      import sys
      import requests
      from kestra import Kestra

      api_url = os.environ.get("API_URL", "").rstrip("/")
      project_ref = os.environ.get("PROJECT_REF", "")
      token = os.environ.get("TOKEN", "")
      max_pct = float(os.environ.get("MAX_PCT", 80))

      if not project_ref:
          print("Error: PROJECT_REF is required", file=sys.stderr)
          sys.exit(1)

      headers = {"Accept": "application/json"}
      if token:
          headers["Authorization"] = f"Bearer {token}"

      url = f"{api_url}/projects/{project_ref}/usage"
      try:
          resp = requests.get(url, headers=headers, timeout=15)
          resp.raise_for_status()
          data = resp.json()
      except Exception as exc:
          print(f"Failed to query Supabase usage: {exc}", file=sys.stderr)
          sys.exit(1)

      pg_conn = data.get("postgres_connections", {})
      used_conn = pg_conn.get("current", 0)
      limit_conn = pg_conn.get("limit", 100)
      usage_pct = round((used_conn / limit_conn) * 100.0, 1) if limit_conn > 0 else 0.0
      is_breach = 1 if usage_pct >= max_pct else 0

      print(f"Supabase Connections: {usage_pct}% ({used_conn}/{limit_conn}), is_breach={is_breach}")

      Kestra.outputs({
          "is_breach": is_breach,
          "usage_pct": usage_pct,
          "used_conn": used_conn,
          "limit_conn": limit_conn
      })

  - id: evaluate_connection_headroom
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.inspect_supabase_telemetry.vars.is_breach | int == 1 }}"
    then:
      - id: notify_platform_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#supabase-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 Supabase Connection Pool Saturation Warning",
                "text": "Project {{ inputs.project_ref }} has reached {{ outputs.inspect_supabase_telemetry.vars.usage_pct }}% connection pool capacity ({{ outputs.inspect_supabase_telemetry.vars.used_conn }} of {{ outputs.inspect_supabase_telemetry.vars.limit_conn }} connections). Risk of Supavisor connection timeouts.",
                "footer": "Kestra Cloud Sentinel • Supabase"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#supabase-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ Supabase Sentinel Failure",
            "text": "Failed to communicate with Supabase Management API for project {{ inputs.project_ref }}.",
            "footer": "Kestra Failure Sentinel"
          }
        ]
      }

outputs:
  - id: is_breach
    type: INT
    value: "{{ outputs.inspect_supabase_telemetry.vars.is_breach }}"
  - id: usage_pct
    type: FLOAT
    value: "{{ outputs.inspect_supabase_telemetry.vars.usage_pct }}"
  - id: used_conn
    type: INT
    value: "{{ outputs.inspect_supabase_telemetry.vars.used_conn }}"
  - id: limit_conn
    type: INT
    value: "{{ outputs.inspect_supabase_telemetry.vars.limit_conn }}"

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  metaDescription: "Audits Supabase project usage metrics to prevent connection pooling exhaustion and client timeouts."
  metaTitle: Supabase Database Connection Pool and Quota Saturation Sentinel with Kestra
  ee: false
  demo: false
  title: Supabase Database Connection Pool and Quota Saturation Sentinel
  shortDescription: Audits Supabase project usage metrics to prevent connection pooling exhaustion and client timeouts.
  description: |
    ## How it works
    This workflow connects to the Supabase Management API (`/v1/projects/{ref}/usage`) with an administrative bearer token to audit Postgres connection pool metrics and resource quotas. In modern serverless and edge architectures, microservices and serverless functions spawn dozens of concurrent connections. When active database connections approach Supavisor connection limits, incoming REST and GraphQL requests fail with connection timeout errors. This sentinel tracks connection pool utilization and alerts the platform engineering team before client applications experience database rejection.

    ## What you get
    - Real-time tracking of Supabase Postgres connection pool utilization.
    - Early warning before connection pool exhaustion and API downtime occur.
    - Automated Slack incident notifications detailing connection limits and current consumption.

    ## Who it's for
    - Full-Stack Engineers deploying serverless web apps with Supabase backends.
    - Backend Architects managing Supavisor connection pool allocations.
    - SREs safeguarding high-traffic production application uptime.

    ## Why orchestrate this with Kestra
    - **Scheduled Telemetry Surveillance**: Regularly polls project usage endpoints without writing standalone scripts.
    - **Encrypted Credential Protection**: Secures Supabase Management access tokens via Kestra encrypted secrets.
    - **Proactive Incident Escalation**: Dispatches formatted alerts directly to engineering incident channels.

    ## Prerequisites
    - Active Supabase account with generated Management API token.
    - Target Supabase Project Reference string.
    - Secrets `SUPABASE_ACCESS_TOKEN` and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import this blueprint into your Kestra workspace.
    2. Add `SUPABASE_ACCESS_TOKEN` and `SLACK_WEBHOOK` secrets.
    3. Specify `project_ref` and `max_connections_percentage`.
    4. Enable the schedule trigger for continuous quota surveillance.

    ## How to extend
    - Inspect database disk size metrics via `/projects/{ref}/usage` to audit storage headroom.
    - Trigger automated compute add-on scaling via Supabase Management API.
    - Route alerts to PagerDuty or Opsgenie.

    ## Links
    - [Supabase Management API Documentation](https://supabase.com/docs/reference/api/introduction)
    - [Kestra Shell Plugin](https://kestra.io/plugins/plugin-scripts-shell)
    - [Kestra Slack Notifications](https://kestra.io/plugins/plugin-slack)
  tags:
    - Cloud
    - Data
  subTags:
    - Infrastructure Automation
    - ELT & Data Landing
