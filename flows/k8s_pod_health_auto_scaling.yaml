id: k8s_pod_health_auto_scaling
namespace: company.infrastructure

triggers:
  - id: hourly_k8s_cluster_check
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 * * * *"

tasks:
  - id: list_namespace_pods
    type: io.kestra.plugin.kubernetes.pod.List
    namespace: "production"
    kubeconfig: "{{ secret('KUBECONFIG_DATA') }}"

  - id: evaluate_pod_health
    type: io.kestra.plugin.scripts.python.Script
    inputFiles:
      pods.json: "{{ outputs.list_namespace_pods.uri }}"
    script: |
      import json, sys
      with open('pods.json') as f:
          pods = json.load(f)
      
      crashing_pods = []
      for p in pods:
          statuses = p.get('status', {}).get('containerStatuses', [])
          for c in statuses:
              state = c.get('state', {})
              if 'waiting' in state and state['waiting'].get('reason') in ['CrashLoopBackOff', 'OOMKilled', 'Error']:
                  crashing_pods.append(p.get('metadata', {}).get('name'))

      has_incidents = len(crashing_pods) > 0
      
      import io.kestra.Kestra as Kestra
      Kestra.outputs({
          "has_incidents": has_incidents,
          "crashing_pod_count": len(crashing_pods),
          "crashing_pods": crashing_pods
      })

  - id: check_incident_status
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.evaluate_pod_health.vars.has_incidents == true }}"
    then:
      - id: alert_sre_team
        type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "🚨 *Kubernetes Pod Degradation Alert!*\n*Namespace:* production\n*Failing Pods:* {{ outputs.evaluate_pod_health.vars.crashing_pod_count }}\n👉 Review cluster health and approve automated recovery in Kestra UI"
          }

      - id: pause_for_sre_approval
        type: io.kestra.plugin.core.flow.Pause
        description: "Pause workflow execution to require SRE sign-off before restarting or scaling deployments."
        onResume:
          - id: approve_recovery
            type: BOOLEAN
            description: "Approve deployment scale / pod recovery action?"
            defaults: true
          - id: target_deployment
            type: STRING
            description: "Target deployment name to restart or scale"
            defaults: "api-gateway"

      - id: execute_recovery_decision
        type: io.kestra.plugin.core.flow.If
        condition: "{{ outputs.pause_for_sre_approval.onResume.approve_recovery == true }}"
        then:
          - id: log_recovery_execution
            type: io.kestra.plugin.core.log.Log
            message: "Recovery approved by operator. Executing rolling restart on deployment: {{ outputs.pause_for_sre_approval.onResume.target_deployment }}"
        else:
          - id: log_recovery_aborted
            type: io.kestra.plugin.core.log.Log
            message: "Automated cluster recovery aborted by SRE operator."
    else:
      - id: log_healthy_cluster
        type: io.kestra.plugin.core.log.Log
        message: "All Kubernetes pods in 'production' namespace are healthy."

extend:
  title: Kubernetes Pod Health Audit & Human-in-the-Loop Recovery
  metaTitle: Kubernetes Pod Health Monitoring & Auto-Recovery | Kestra
  shortDescription: Audits Kubernetes namespace pods for CrashLoopBackOff or OOMKilled states, routes Slack alerts, and gates recovery on SRE approval.
  metaDescription: Automated Kubernetes pod health inspection with Python crash analysis and Pause task approval gates for deployment recovery.
  description: |
    Automated Kubernetes pod health inspection and remediation workflow for platform and SRE teams.
    
    ## How it works
    1. Scheduled hourly execution queries all pods in the `production` namespace via the Kubernetes API.
    2. Python task inspects container state metrics for `CrashLoopBackOff`, `OOMKilled`, or error states.
    3. Conditional `If` task routes critical alerts to Slack and pauses workflow execution.
    4. SRE operator reviews the pod crash count and approves or aborts deployment recovery in the Kestra UI.
    
    ## What you get
    - Real-time Kubernetes workload health monitoring.
    - Automated Slack incident routing with cluster telemetry context.
    - Zero-risk recovery backed by human approval gates.
    
    ## Who it's for
    - Site Reliability Engineers (SREs)
    - DevOps Teams
    - Platform Infrastructure Engineers
    
    ## Why orchestrate this with Kestra
    - Native Kubernetes plugin integration.
    - Human-in-the-loop operational safety using `Pause` tasks.
    - Centralized audit trail across deployment recovery actions.
    
    ## Prerequisites
    - Active Kubernetes cluster with namespace read/write permissions.
    - Base64 encoded `kubeconfig` string.
    - Slack incoming webhook endpoint.
    
    ### Secrets
    `KUBECONFIG_DATA`: Base64 encoded kubeconfig content.
    `SLACK_WEBHOOK_URL`: Slack webhook endpoint for alerting.
    
    ## Quick start
    1. Configure `KUBECONFIG_DATA` and `SLACK_WEBHOOK_URL` in your Kestra namespace secrets.
    2. Import this blueprint and click **Execute**.
    
    ## Links
    - [Kestra Kubernetes Plugin Docs](https://kestra.io/plugins/plugin-kubernetes)
    - [Kestra Pause Task Docs](https://kestra.io/plugins/core/tasks/flows/io.kestra.plugin.core.flow.pause)
  tags:
    - Infrastructure
  subTags:
    - Kubernetes Operations
  ee: false
  demo: false