id: s3-public-access-audit
namespace: company.team
description: |
  Audit S3 buckets for missing public access blocks or public policies, and
  alert Slack with the exact buckets that are exposed.

triggers:
  - id: weekly_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: Weekly sweep catches buckets opened during the week by anyone, for any reason.
    cron: "0 4 * * 1"
    disabled: true

inputs:
  - id: region
    type: STRING
    defaults: "us-east-1"
    description: Region to scope any regional checks.

tasks:
  - id: audit_buckets
    type: io.kestra.plugin.scripts.shell.Commands
    description: Run the AWS CLI checks per bucket - public access block status and public policies - then emit counts and the offender list via the stdout outputs protocol. AWS errors report worst case so a bad credential never reads as a clean audit.
    containerImage: python:3.12-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    commands:
      - |
        pip install --quiet awscli 2>/dev/null
        cat > audit.py <<'PYEOF'
        import json, subprocess
        offenders = []
        checked = 0
        try:
            buckets = json.loads(subprocess.run(["aws", "s3api", "list-buckets", "--query", "Buckets[].Name", "--output", "json"], capture_output=True, text=True, timeout=60).stdout or "[]")
        except Exception:
            buckets = []
        for b in buckets:
            checked += 1
            try:
                pab = subprocess.run(["aws", "s3api", "get-public-access-block", "--bucket", b], capture_output=True, text=True, timeout=30)
                pab_ok = pab.returncode == 0 and all(json.loads(pab.stdout)["PublicAccessBlockConfiguration"].values()) if pab.returncode == 0 else False
            except Exception:
                pab_ok = False
            try:
                pol = subprocess.run(["aws", "s3api", "get-bucket-policy-status", "--bucket", b], capture_output=True, text=True, timeout=30)
                public = pol.returncode == 0 and json.loads(pol.stdout).get("PolicyStatus", {}).get("IsPublic") is True
            except Exception:
                public = False
            if (not pab_ok) or public:
                offenders.append(b)
        print(f"checked {checked} bucket(s), {len(offenders)} exposed or unprotected")
        print("::" + json.dumps({"outputs": {"checked": checked, "exposed": len(offenders), "buckets": ",".join(offenders)}}) + "::")
        PYEOF
        python3 audit.py
    env:
      AWS_REGION: "{{ inputs.region }}"

  - id: exposed_found
    type: io.kestra.plugin.core.flow.If
    description: One branch for exposure - any offending bucket goes to Slack by name.
    condition: "{{ outputs.audit_buckets.vars.exposed > 0 }}"
    then:
      - id: alert_exposed
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Name the buckets so the fix starts with the exact offenders.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": ":warning: S3 public access audit: {{ outputs.audit_buckets.vars.exposed }} of {{ outputs.audit_buckets.vars.checked }} bucket(s) lack a full public access block or carry a public policy. Buckets: {{ outputs.audit_buckets.vars.buckets }}"
          }
    else:
      - id: log_clean
        type: io.kestra.plugin.core.log.Log
        description: Record the passing audit for the compliance trail.
        message: "S3 audit clean: {{ outputs.audit_buckets.vars.checked }} bucket(s) verified."

errors:
  - id: alert_audit_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alert when the audit itself fails - no result must ever read as a clean bill of health.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "S3 public access audit FAILED in flow {{ flow.id }} (execution {{ execution.id }}). Check AWS credentials and the task logs."
      }

outputs:
  - id: audit_summary
    type: JSON
    description: 'Audit result counts, e.g. {"checked": 12, "exposed": 1}'
    value: '{{ {"checked": outputs.audit_buckets.vars.checked, "exposed": outputs.audit_buckets.vars.exposed} | toJson }}'

extend:
  title: Audit S3 Buckets for Public Exposure
  shortDescription: Weekly check that every bucket has a public access block on and no public policy, alerting Slack with the offenders.
  metaTitle: S3 Public Access Audit
  metaDescription: Detect S3 buckets that are public or missing public access block configuration and alert Slack.
  description: |
    One forgotten bucket policy is a data breach headline. This blueprint lists every bucket, checks its public access block and policy status, and alerts Slack with the exact offenders. The schedule ships disabled so you can verify credentials first.

    ## How it works

    1. `audit_buckets` (`io.kestra.plugin.scripts.shell.Commands` on the AWS CLI image) lists buckets and runs `get-public-access-block` + `get-bucket-policy-status` per bucket, emitting counts and the offender list via the `::{"outputs": ...}::` protocol.
    2. `exposed_found` (`io.kestra.plugin.core.flow.If`) branches: any exposure -> `alert_exposed`; clean -> `log_clean`.
    3. The `errors` block alerts when the audit itself fails.
    4. Triggers: a disabled weekly `Schedule`.

    ## What you get

    - Named list of exposed or unprotected buckets.
    - A weekly compliance sweep with history in every execution.
    - Failure alerts so a dead credential never reads as "no exposure".

    ## Who it's for

    - Platform teams that want a standing S3 guardrail.
    - Security champions hunting drive-by public buckets.
    - Anyone prepping for a SOC 2 evidence pull.

    ## Why orchestrate this with Kestra

    The AWS CLI answers questions; the flow turns them into a verdict on a schedule, with an alert that names names. The next step (remediate via `put-public-access-block`, open a ticket, tag the owner) is one task away.

    ## Prerequisites

    - Docker available on the Kestra Worker.
    - Network access to PyPI on first run (awscli pip install) and to the S3 API.
    - AWS credentials with `s3:ListAllMyBuckets`, `s3:GetBucketPublicAccessBlock`, `s3:GetBucketPolicyStatus` in the environment or an instance profile.
    - A Slack webhook.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: webhook for exposure and failure alerts.

    ## Quick start

    1. Add the Slack webhook secret and AWS credentials.
    2. Run once to see `audit_summary`.
    3. Enable the weekly schedule.

    ## How to extend

    - Auto-remediate by applying a full public access block.
    - Diff the offender list week-over-week in KV.
    - Add `GetObjectAcl` checks for the riskiest buckets.

    ## Links

    - [Block public access to S3](https://docs.aws.amazon.com/AmazonS3/latest/userguide/access-control-block-public-access.html)
  tags:
    - Cloud
    - Infrastructure
  subTags:
    - AWS
    - Security
  ee: false
  demo: false
