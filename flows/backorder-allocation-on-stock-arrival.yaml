id: backorder-allocation-on-stock-arrival
namespace: company.fulfillment

description: |
  When new stock of a product arrives, hand it out to the customers waiting on backorder in priority order,
  tell each of them what happens to their order, and send the warehouse its pick list. The backorder queue
  is a CSV namespace file, so the flow runs with no database and keeps its state between deliveries.

inputs:
  - id: sku
    type: STRING
    defaults: KB-104
    description: Product received, used for manual runs. A webhook call sends it as `sku` in the body.
  - id: quantity
    type: INT
    defaults: 12
    description: Units received, used for manual runs. A webhook call sends it as `quantity` in the body.

variables:
  store_name: Northwind Gear
  from_email: orders@northwind.example
  warehouse_email: fulfillment@northwind.example
  long_wait_days: 21
  queue_columns: >-
    {'order_id': 'VARCHAR', 'customer_name': 'VARCHAR', 'customer_email': 'VARCHAR', 'customer_tier': 'VARCHAR',
    'sku': 'VARCHAR', 'product_name': 'VARCHAR', 'qty_ordered': 'INTEGER', 'qty_allocated': 'INTEGER',
    'ordered_at': 'DATE', 'allow_partial': 'BOOLEAN', 'cancel_offered_on': 'DATE'}
  sample_queue: |
    order_id,customer_name,customer_email,customer_tier,sku,product_name,qty_ordered,qty_allocated,ordered_at,allow_partial,cancel_offered_on
    SO-1001,Aiko Tanaka,aiko@example.com,STANDARD,KB-104,Mechanical keyboard,6,1,{{ now() | dateAdd(-34, 'DAYS') | date('yyyy-MM-dd') }},true,
    SO-1002,Ben Carter,ben@example.com,STANDARD,KB-104,Mechanical keyboard,5,0,{{ now() | dateAdd(-27, 'DAYS') | date('yyyy-MM-dd') }},false,
    SO-1003,Chloe Martin,chloe@example.com,STANDARD,KB-104,Mechanical keyboard,2,0,{{ now() | dateAdd(-12, 'DAYS') | date('yyyy-MM-dd') }},false,
    SO-1004,Priya Nair,priya@example.com,VIP,KB-104,Mechanical keyboard,4,0,{{ now() | dateAdd(-9, 'DAYS') | date('yyyy-MM-dd') }},false,
    SO-1005,Dev Patel,dev@example.com,STANDARD,KB-104,Mechanical keyboard,3,0,{{ now() | dateAdd(-6, 'DAYS') | date('yyyy-MM-dd') }},true,
    SO-1006,Emma Wilson,emma@example.com,STANDARD,KB-104,Mechanical keyboard,1,0,{{ now() | dateAdd(-2, 'DAYS') | date('yyyy-MM-dd') }},true,
    SO-1007,Farah Khan,farah@example.com,STANDARD,MS-220,Wireless mouse,2,0,{{ now() | dateAdd(-15, 'DAYS') | date('yyyy-MM-dd') }},true,

concurrency:
  limit: 1
  behavior: QUEUE

tasks:
  - id: read_receipt
    type: io.kestra.plugin.core.output.OutputValues
    values:
      sku: "{{ trigger is defined ? trigger.body.sku : inputs.sku }}"
      quantity: "{{ trigger is defined ? trigger.body.quantity : inputs.quantity }}"

  - id: validate_receipt
    type: io.kestra.plugin.core.execution.Fail
    condition: "{{ outputs.read_receipt.values.sku is empty or not (outputs.read_receipt.values.quantity | regexMatch('^[1-9][0-9]*$')) }}"
    errorMessage: "The stock receipt must carry a SKU and a positive whole quantity, received sku '{{ outputs.read_receipt.values.sku }}' and quantity '{{ outputs.read_receipt.values.quantity }}'."

  - id: label_execution
    type: io.kestra.plugin.core.execution.Labels
    labels:
      sku: "{{ outputs.read_receipt.values.sku }}"

  - id: allocate
    type: io.kestra.plugin.jdbc.duckdb.Query
    description: Walks the queue in priority order with a recursive CTE, carrying the stock that is left from one order to the next.
    inputFiles:
      backorders.csv: "{{ fileExists('backorders.csv') ? read('backorders.csv') : render(vars.sample_queue) }}"
    parameters:
      sku: "{{ outputs.read_receipt.values.sku }}"
      quantity: "{{ outputs.read_receipt.values.quantity }}"
      long_wait_days: "{{ vars.long_wait_days }}"
    fetchType: FETCH
    sql: |
      WITH RECURSIVE
      waiting AS (
          SELECT *,
                 qty_ordered - qty_allocated AS remaining_before,
                 date_diff('day', ordered_at, current_date) AS waited_days,
                 row_number() OVER (
                     ORDER BY CASE customer_tier WHEN 'VIP' THEN 0 ELSE 1 END, ordered_at, order_id
                 ) AS queue_position
          FROM read_csv('backorders.csv', header = true, columns = {{ vars.queue_columns }})
          WHERE sku = :sku AND qty_ordered > qty_allocated
      ),
      walk AS (
          SELECT CAST(0 AS BIGINT) AS queue_position, CAST(:quantity AS INTEGER) AS stock_left, 0 AS ships_now
          UNION ALL
          SELECT w.queue_position, s.stock_left - s.take, s.take
          FROM (
              SELECT q.queue_position, p.stock_left,
                     CASE
                         WHEN q.remaining_before <= p.stock_left THEN q.remaining_before
                         WHEN q.allow_partial THEN p.stock_left
                         ELSE 0
                     END AS take
              FROM walk p
              JOIN waiting q ON q.queue_position = p.queue_position + 1
          ) s
          JOIN waiting w ON w.queue_position = s.queue_position
      )
      SELECT w.queue_position, w.order_id, w.customer_name, w.customer_email, w.customer_tier,
             w.sku, w.product_name, w.qty_ordered, w.qty_allocated, w.remaining_before, w.waited_days,
             k.ships_now,
             w.remaining_before - k.ships_now AS remaining_after,
             k.stock_left AS stock_left_after,
             CASE
                 WHEN k.ships_now = w.remaining_before THEN 'FULL'
                 WHEN k.ships_now > 0 THEN 'PARTIAL'
                 WHEN w.waited_days >= CAST(:long_wait_days AS INTEGER) AND w.cancel_offered_on IS NULL THEN 'OFFER_CANCEL'
                 ELSE 'WAITING'
             END AS outcome
      FROM waiting w
      JOIN walk k ON k.queue_position = w.queue_position
      ORDER BY w.queue_position

  - id: stop_if_nobody_waiting
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.allocate.size == 0 }}"
    then:
      - id: log_all_to_stock
        type: io.kestra.plugin.core.log.Log
        message: "No open backorders for {{ outputs.read_receipt.values.sku }}, so all {{ outputs.read_receipt.values.quantity }} units go to available stock."
      - id: end_run
        type: io.kestra.plugin.core.execution.Exit
        state: SUCCESS

  - id: update_queue
    type: io.kestra.plugin.jdbc.duckdb.Query
    description: Adds the units just allocated, records cancellation offers, and drops the orders that are now complete.
    inputFiles:
      backorders.csv: "{{ fileExists('backorders.csv') ? read('backorders.csv') : render(vars.sample_queue) }}"
      allocation.json: "{{ outputs.allocate.rows | toJson }}"
    outputFiles:
      - queue
    sql: |
      COPY (
          SELECT q.order_id, q.customer_name, q.customer_email, q.customer_tier, q.sku, q.product_name,
                 q.qty_ordered,
                 q.qty_allocated + coalesce(a.ships_now, 0) AS qty_allocated,
                 q.ordered_at, q.allow_partial,
                 CASE WHEN a.outcome = 'OFFER_CANCEL' THEN current_date ELSE q.cancel_offered_on END AS cancel_offered_on
          FROM read_csv('backorders.csv', header = true, columns = {{ vars.queue_columns }}) q
          LEFT JOIN read_json('allocation.json') a ON a.order_id = q.order_id
          WHERE q.qty_ordered > q.qty_allocated + coalesce(a.ships_now, 0)
          ORDER BY q.ordered_at, q.order_id
      ) TO '{{ outputFiles.queue }}' (HEADER)

  - id: save_queue
    type: io.kestra.plugin.core.namespace.UploadFiles
    description: Saved before anyone is emailed, so a failed email can never cause the same units to be allocated twice.
    namespace: "{{ flow.namespace }}"
    filesMap:
      backorders.csv: "{{ outputs.update_queue.outputFiles.queue }}"
    conflict: OVERWRITE

  - id: notify_customers
    type: io.kestra.plugin.core.flow.Loop
    values: "{{ outputs.allocate.rows }}"
    concurrencyLimit: 5
    tasks:
      - id: route_by_outcome
        type: io.kestra.plugin.core.flow.Switch
        value: "{{ fromJson(item.value).outcome }}"
        cases:
          FULL:
            - id: email_ships_in_full
              type: io.kestra.plugin.email.MailSend
              host: "{{ secret('SMTP_HOST') }}"
              port: "{{ secret('SMTP_PORT') }}"
              username: "{{ secret('SMTP_USERNAME') }}"
              password: "{{ secret('SMTP_PASSWORD') }}"
              transportStrategy: SMTP
              from: "{{ vars.from_email }}"
              to: "{{ fromJson(item.value).customer_email }}"
              subject: "Your {{ fromJson(item.value).product_name }} is on its way (order {{ fromJson(item.value).order_id }})"
              plainTextContent: |
                {%- set order = fromJson(item.value) -%}
                Hi {{ order.customer_name }},

                Good news: {{ order.product_name }} is back in stock, and we are shipping {{ order.ships_now }} × {{ order.product_name }} for your order {{ order.order_id }} today{{ order.qty_allocated > 0 ? ', which completes it' : '' }}.
                You will receive tracking details as soon as the parcel leaves our warehouse.

                Thank you for your patience,
                {{ vars.store_name }}
          PARTIAL:
            - id: email_ships_partially
              type: io.kestra.plugin.email.MailSend
              host: "{{ secret('SMTP_HOST') }}"
              port: "{{ secret('SMTP_PORT') }}"
              username: "{{ secret('SMTP_USERNAME') }}"
              password: "{{ secret('SMTP_PASSWORD') }}"
              transportStrategy: SMTP
              from: "{{ vars.from_email }}"
              to: "{{ fromJson(item.value).customer_email }}"
              subject: "Part of your order {{ fromJson(item.value).order_id }} is on its way"
              plainTextContent: |
                {%- set order = fromJson(item.value) -%}
                Hi {{ order.customer_name }},

                New stock of {{ order.product_name }} arrived, and we are shipping {{ order.ships_now }} of the {{ order.remaining_before }} units you are waiting for today.
                The other {{ order.remaining_after }} stay reserved for you and will ship as soon as the next delivery arrives.

                Thank you for your patience,
                {{ vars.store_name }}
          OFFER_CANCEL:
            - id: email_offer_cancellation
              type: io.kestra.plugin.email.MailSend
              host: "{{ secret('SMTP_HOST') }}"
              port: "{{ secret('SMTP_PORT') }}"
              username: "{{ secret('SMTP_USERNAME') }}"
              password: "{{ secret('SMTP_PASSWORD') }}"
              transportStrategy: SMTP
              from: "{{ vars.from_email }}"
              to: "{{ fromJson(item.value).customer_email }}"
              subject: "Still waiting on order {{ fromJson(item.value).order_id }}? You can cancel for a full refund"
              plainTextContent: |
                {%- set order = fromJson(item.value) -%}
                Hi {{ order.customer_name }},

                You have been waiting {{ order.waited_days }} days for {{ order.remaining_before }} × {{ order.product_name }}, and today's delivery was not enough to cover your order in full.
                Your order is set to ship complete, so it stays at position {{ order.queue_position }} in line until enough units arrive.

                If you would rather not wait, reply to this email and we will cancel the order with a full refund.
                If you do nothing, you keep your place in line.

                Sorry for the delay,
                {{ vars.store_name }}
        defaults:
          - id: log_still_waiting
            type: io.kestra.plugin.core.log.Log
            message: "{{ fromJson(item.value).order_id }} stays at position {{ fromJson(item.value).queue_position }} for {{ fromJson(item.value).sku }}, no email sent."

  - id: email_warehouse_pick_list
    type: io.kestra.plugin.email.MailSend
    host: "{{ secret('SMTP_HOST') }}"
    port: "{{ secret('SMTP_PORT') }}"
    username: "{{ secret('SMTP_USERNAME') }}"
    password: "{{ secret('SMTP_PASSWORD') }}"
    transportStrategy: SMTP
    from: "{{ vars.from_email }}"
    to: "{{ vars.warehouse_email }}"
    subject: "Pick list for {{ outputs.read_receipt.values.sku }}: {{ (outputs.read_receipt.values.quantity | number) - (outputs.allocate.rows | last).stock_left_after }} of {{ outputs.read_receipt.values.quantity }} units allocated"
    htmlTextContent: |
      <p>{{ outputs.read_receipt.values.quantity }} units of {{ outputs.read_receipt.values.sku }} were received.
      {{ (outputs.allocate.rows | last).stock_left_after }} units are left over for available stock.</p>
      <table border="1" cellpadding="6" cellspacing="0">
        <tr><th>#</th><th>Order</th><th>Customer</th><th>Tier</th><th>Waited (days)</th><th>Waiting for</th><th>Pick now</th><th>Outcome</th></tr>
        {% for row in outputs.allocate.rows -%}
        <tr><td>{{ row.queue_position }}</td><td>{{ row.order_id }}</td><td>{{ row.customer_name }}</td><td>{{ row.customer_tier }}</td><td>{{ row.waited_days }}</td><td>{{ row.remaining_before }}</td><td><b>{{ row.ships_now }}</b></td><td>{{ row.outcome }}</td></tr>
        {% endfor -%}
      </table>

errors:
  - id: email_failure
    type: io.kestra.plugin.email.MailSend
    host: "{{ secret('SMTP_HOST') }}"
    port: "{{ secret('SMTP_PORT') }}"
    username: "{{ secret('SMTP_USERNAME') }}"
    password: "{{ secret('SMTP_PASSWORD') }}"
    transportStrategy: SMTP
    from: "{{ vars.from_email }}"
    to: "{{ vars.warehouse_email }}"
    subject: "Backorder allocation failed (execution {{ execution.id }})"
    plainTextContent: |
      The stock receipt could not be allocated, so no customer was told about it.
      {{ (errorLogs() | first).message | abbreviate(500) ?? 'See the execution logs in Kestra.' }}

triggers:
  - id: stock_received
    type: io.kestra.plugin.core.trigger.Webhook
    key: "{{ secret('BACKORDER_WEBHOOK_KEY') }}"

extend:
  title: Allocate Backorders in Priority Order When Stock Arrives
  shortDescription: Hand incoming stock to backordered customers by tier and wait time, email each of them the outcome, and send the warehouse a pick list.
  metaTitle: Backorder Allocation on Stock Arrival with Kestra and DuckDB
  metaDescription: Allocate new stock to backorders by customer tier and wait time with DuckDB, email every customer the outcome and send the warehouse a pick list.
  description: |
    When a sold-out product comes back in stock, someone has to decide which waiting customers get it.
    Doing it by hand is slow and inconsistent: loyal customers get skipped, a customer who refused partial
    shipments ends up blocking everyone behind them, and nobody tells the people who are still waiting.

    This blueprint makes that decision the moment a delivery is received, with the same rules every time.

    ## How it works

    1. `stock_received` (`io.kestra.plugin.core.trigger.Webhook`) receives `{"sku": "KB-104", "quantity": 12}`
       from your warehouse or inventory system. A manual run uses the `sku` and `quantity` inputs instead.
    2. `validate_receipt` (`io.kestra.plugin.core.execution.Fail`) rejects a receipt without a SKU or a positive whole quantity.
    3. `allocate` (`io.kestra.plugin.jdbc.duckdb.Query`) reads the backorder queue and ranks the open orders for that
       SKU: VIP customers first, then oldest order first. A recursive query walks down the line carrying the stock
       that is left, and gives each order one outcome:
       - `FULL`: the rest of the order ships now.
       - `PARTIAL`: the customer accepts partial shipments, so they get what is left and keep their place for the rest.
       - `OFFER_CANCEL`: the order cannot be filled and has waited longer than `long_wait_days`, so the customer is offered a refund, once.
       - `WAITING`: nothing for now.

       An order that refuses partial shipments is skipped when the stock left cannot cover it, so the units go to the
       next customer in line instead of sitting in the warehouse.
    4. `stop_if_nobody_waiting` (`io.kestra.plugin.core.flow.If`) ends the run when no one is waiting for that SKU.
    5. `update_queue` and `save_queue` (`io.kestra.plugin.core.namespace.UploadFiles`) write the new queue back as
       the `backorders.csv` namespace file before any email is sent, so a failed email can never allocate the same units twice.
    6. `notify_customers` (`io.kestra.plugin.core.flow.Loop`) and `route_by_outcome` (`io.kestra.plugin.core.flow.Switch`)
       send each customer the email for their outcome. Customers who are still waiting are not emailed.
    7. `email_warehouse_pick_list` sends the warehouse the queue in priority order, with the units to pick for each order
       and the units left over for available stock.
    8. `email_failure` (`errors`) tells the warehouse when a receipt could not be processed.

    The flow runs with `concurrency.limit: 1`, so two deliveries arriving together are processed one after the other
    and never edit the queue at the same time.

    ## Try it with the sample data

    The first run seeds the queue with seven sample orders, with order dates relative to today. Run the flow with the
    default inputs (12 units of `KB-104`) and you get every outcome:

    | Position | Order | Tier | Waiting for | Ships now | Outcome |
    |---|---|---|---|---|---|
    | 1 | SO-1004 Priya | VIP | 4 | 4 | `FULL` |
    | 2 | SO-1001 Aiko | Standard | 5 | 5 | `FULL` |
    | 3 | SO-1002 Ben, no partial shipments | Standard | 5 | 0 | `OFFER_CANCEL` |
    | 4 | SO-1003 Chloe | Standard | 2 | 2 | `FULL` |
    | 5 | SO-1005 Dev | Standard | 3 | 1 | `PARTIAL` |
    | 6 | SO-1006 Emma | Standard | 1 | 0 | `WAITING` |

    Run it a second time and Ben, Dev and Emma are served from the saved queue, with 4 units left over.
    Delete the `backorders.csv` namespace file to start over.

    ## Use it with your own orders

    Upload your open backorders as `backorders.csv` in the flow's namespace, with these columns:
    `order_id, customer_name, customer_email, customer_tier (VIP or STANDARD), sku, product_name, qty_ordered,
    qty_allocated, ordered_at (YYYY-MM-DD), allow_partial (true or false), cancel_offered_on (empty or YYYY-MM-DD)`.
    Then point your inventory system at the webhook:

    ```
    POST /api/v1/main/executions/webhook/company.fulfillment/backorder-allocation-on-stock-arrival/<BACKORDER_WEBHOOK_KEY>
    {"sku": "KB-104", "quantity": 12}
    ```

    To read the queue from your order database instead, replace the `backorders.csv` input file with a query to it.

    ## Prerequisites

    - An SMTP server. [Mailpit](https://mailpit.axllent.org/) works locally and shows every email in a web inbox.

    ### Secrets

    - `SMTP_HOST`, `SMTP_PORT`, `SMTP_USERNAME`, `SMTP_PASSWORD`: the mail server used to email customers and the warehouse.
    - `BACKORDER_WEBHOOK_KEY`: a long random string that becomes the last segment of the webhook URL. Not needed for manual runs.

    ### Inputs and variables

    - `sku` (STRING, default `KB-104`) and `quantity` (INT, default `12`): the receipt for manual runs.
    - `store_name`, `from_email`, `warehouse_email`: used in the emails.
    - `long_wait_days` (default `21`): how long an order waits before its customer is offered a refund.

    ## Outputs

    - `outputs.allocate.rows`: one row per waiting order with `queue_position`, `ships_now`, `remaining_after` and `outcome`.
    - The `backorders.csv` namespace file: the queue after this delivery.
    - The execution label `sku`, to filter runs per product.

    ## Links

    - [DuckDB plugin](https://kestra.io/plugins/plugin-jdbc-duckdb)
    - [DuckDB recursive queries](https://duckdb.org/docs/stable/sql/query_syntax/with#recursive-ctes)
    - [Namespace files](https://kestra.io/docs/concepts/namespace-files)
    - [Email plugin](https://kestra.io/plugins/plugin-email)

    Created by [Keshav Agarwal](https://github.com/agkeshav).
  tags:
    - Business
    - Data
  subTags:
    - File & Data Processing Basics
    - Customer Success
  ee: false
  demo: false
