id: clickhouse-dictionary-memory-overflow-sentinel
namespace: company.olap

description: Audits ClickHouse external dictionaries for excessive RAM consumption, alerting OLAP teams before MEMORY_LIMIT_EXCEEDED errors degrade analytical queries.

concurrency:
  limit: 1

inputs:
  - id: clickhouse_endpoint
    type: STRING
    defaults: "http://clickhouse.internal:8123"
    description: HTTP endpoint URL for the ClickHouse cluster coordinator or node.

  - id: max_dict_memory_mb_warning
    type: FLOAT
    defaults: 1024.0
    description: Maximum permissible RAM footprint in megabytes for any single external dictionary.

  - id: slack_channel
    type: STRING
    defaults: "#clickhouse-alerts"
    description: Slack channel destination for OLAP memory governance alerts.

tasks:
  - id: audit_dictionary_memory
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install requests
    env:
      CLICKHOUSE_URL: "{{ inputs.clickhouse_endpoint }}"
      CLICKHOUSE_USER: "{{ secret('CLICKHOUSE_USER') }}"
      CLICKHOUSE_PASSWORD: "{{ secret('CLICKHOUSE_PASSWORD') }}"
      MEMORY_LIMIT_MB: "{{ inputs.max_dict_memory_mb_warning }}"
    script: |
      import os
      import json
      import requests
      from kestra import Kestra

      endpoint = os.getenv('CLICKHOUSE_URL').rstrip('/')
      user = os.getenv('CLICKHOUSE_USER')
      password = os.getenv('CLICKHOUSE_PASSWORD')
      limit_mb = float(os.getenv('MEMORY_LIMIT_MB', 1024.0))

      headers = {}
      if user:
          headers['X-ClickHouse-User'] = user
      if password:
          headers['X-ClickHouse-Key'] = password

      query = """
      SELECT 
          name,
          type,
          status,
          bytes_allocated,
          element_count,
          round(bytes_allocated / (1024 * 1024), 2) as memory_mb
      FROM system.dictionaries
      FORMAT JSON;
      """

      response = requests.post(
          f"{endpoint}/",
          params={'query': query},
          headers=headers,
          timeout=15
      )
      data = response.json()
      rows = data.get('data', [])

      flagged_dictionaries = []

      for r in rows:
          mem_mb = float(r.get('memory_mb', 0.0))
          status = r.get('status', 'LOADED')

          if mem_mb >= limit_mb or status == 'FAILED':
              flagged_dictionaries.append({
                  'name': r.get('name'),
                  'type': r.get('type'),
                  'status': status,
                  'memory_mb': mem_mb,
                  'element_count': r.get('element_count', 0)
              })

      total_dicts = len(rows)
      flagged_count = len(flagged_dictionaries)
      has_overflow = flagged_count > 0
      max_memory_mb = max([d['memory_mb'] for d in flagged_dictionaries], default=0.0)

      Kestra.outputs({
          'total_dictionaries_audited': total_dicts,
          'flagged_dictionaries_count': flagged_count,
          'has_memory_overflow': has_overflow,
          'max_dictionary_memory_mb': max_memory_mb,
          'flagged_dictionary_names': [d['name'] for d in flagged_dictionaries]
      })

      report = {
          'endpoint': endpoint,
          'total_dictionaries': total_dicts,
          'flagged_count': flagged_count,
          'flagged_dictionaries': flagged_dictionaries
      }

      with open('clickhouse_dictionary_report.json', 'w') as f:
          json.dump(report, f, indent=2)

    outputFiles:
      - clickhouse_dictionary_report.json

  - id: check_memory_threshold
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.audit_dictionary_memory.vars.has_memory_overflow }}"
    then:
      - id: notify_slack_olap
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "{{ inputs.slack_channel }}",
            "text": "ClickHouse Dictionary Memory Alert: {{ outputs.audit_dictionary_memory.vars.flagged_dictionaries_count }} dictionary(ies) exceeded {{ inputs.max_dict_memory_mb_warning }} MB RAM or failed to load.\n• Flagged Dictionaries: {{ outputs.audit_dictionary_memory.vars.flagged_dictionary_names | join(', ') }}\n• Peak Memory Allocation: {{ outputs.audit_dictionary_memory.vars.max_dictionary_memory_mb }} MB\n• Remediation: Switch memory-heavy dictionaries from `LAYOUT(FLAT())` to `LAYOUT(HASHED_ARRAY())` or `CACHE` layout to mitigate OOM risks."
          }
    else:
      - id: log_dictionaries_healthy
        type: io.kestra.plugin.core.log.Log
        message: "All {{ outputs.audit_dictionary_memory.vars.total_dictionaries_audited }} ClickHouse external dictionaries are operating within safe memory bounds."

  - id: export_dict_manifest
    type: io.kestra.plugin.core.execution.Labels
    labels:
      total_dictionaries: "{{ outputs.audit_dictionary_memory.vars.total_dictionaries_audited | string }}"
      overflow_count: "{{ outputs.audit_dictionary_memory.vars.flagged_dictionaries_count | string }}"
      olap_health: "{{ outputs.audit_dictionary_memory.vars.has_memory_overflow ? 'MEMORY_OVERFLOW' : 'HEALTHY' }}"

triggers:
  - id: hourly_dict_memory_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 * * * *"

extend:
  title: ClickHouse Dictionary Memory Overflow Sentinel
  metaTitle: ClickHouse Dictionary Memory Overflow Sentinel
  shortDescription: Audits ClickHouse external dictionaries for excessive RAM consumption to prevent MEMORY_LIMIT_EXCEEDED errors.
  metaDescription: Audits ClickHouse external dictionaries for excessive RAM consumption, alerting OLAP teams on Slack before MEMORY_LIMIT_EXCEEDED errors occur.
  description: |
    This blueprint acts as an automated memory governor for ClickHouse analytical databases. Scheduled hourly, it queries `system.dictionaries` across cluster nodes, evaluates `bytes_allocated` for loaded external dictionaries, flags failed or oversized in-memory structures, and delivers actionable tuning alerts to Slack before memory pressure triggers query failures or kernel out-of-memory kills.

    ## How it works

    1. **Hourly Scheduled Audit**: The `hourly_dict_memory_audit` trigger (`io.kestra.plugin.core.trigger.Schedule`) fires at the top of every hour.
    2. **ClickHouse System Dictionary Query**: The `audit_dictionary_memory` task (`io.kestra.plugin.scripts.python.Script`) queries `system.dictionaries` via HTTP interface to measure memory allocation and load status per dictionary.
    3. **Condition Gate**: The `check_memory_threshold` flowable task (`io.kestra.plugin.core.flow.If`) branches based on whether any dictionary exceeded the configured warning threshold.
    4. **Slack Alert Dispatch**: When memory bloat or load failure occurs, `notify_slack_olap` (`io.kestra.plugin.slack.notifications.SlackIncomingWebhook`) dispatches an urgent incident card with layout tuning recommendations.
    5. **Healthy Confirmation**: When all dictionaries remain within safe thresholds, `log_dictionaries_healthy` records confirmed status.
    6. **Manifest Export**: The `export_dict_manifest` task tags the execution with searchable status labels.

    ## Architecture diagram

    ```mermaid
    flowchart TD
        A[Schedule: Hourly] --> B[audit_dictionary_memory: ClickHouse system.dictionaries]
        B --> C{Dictionary Exceeds Limit or Failed?}
        C -- Yes --> D[notify_slack_olap: Slack Webhook]
        C -- No --> E[log_dictionaries_healthy: Log]
        D --> F[export_dict_manifest: Execution Labels]
        E --> F
    ```

    ## Use cases

    - **Prevent ClickHouse Server OOM Crashes**: Catch oversized flat dictionaries that consume tens of gigabytes of node memory before server processes get terminated.
    - **Dictionary Layout Tuning**: Identify flat dictionaries that should be migrated to `HASHED_ARRAY` or cached layouts (`CACHE`) with eviction policies.
    - **Failed Dictionary Reload Detection**: Detect when source database credentials or network partitions cause dictionary periodic refreshes to fail silently.

    ## Inputs

    | Name | Type | Default | Description |
    | :--- | :--- | :--- | :--- |
    | `clickhouse_endpoint` | STRING | `http://clickhouse.internal:8123` | HTTP endpoint URL for the ClickHouse cluster coordinator or node. |
    | `max_dict_memory_mb_warning` | FLOAT | `1024.0` | Maximum permissible RAM footprint in megabytes for any single external dictionary. |
    | `slack_channel` | STRING | `#clickhouse-alerts` | Slack channel destination for OLAP memory governance alerts. |

    ## Expected outputs

    - `{{ outputs.audit_dictionary_memory.vars.total_dictionaries_audited }}`: Total dictionaries inspected in system catalog.
    - `{{ outputs.audit_dictionary_memory.vars.flagged_dictionaries_count }}`: Number of dictionaries exceeding memory limit or failed.
    - `{{ outputs.audit_dictionary_memory.vars.has_memory_overflow }}`: Boolean flag indicating memory overflow risk.
    - `{{ outputs.audit_dictionary_memory.vars.max_dictionary_memory_mb }}`: Peak memory observed for a single dictionary in megabytes.
    - `{{ outputs.audit_dictionary_memory.outputFiles['clickhouse_dictionary_report.json'] }}`: Full JSON dictionary memory diagnostics report.

    ## Prerequisites

    - ClickHouse user credentials with `SELECT` privileges on the `system.dictionaries` table.
    - Incoming Webhook URL configured for your OLAP operations Slack channel.

    ### Secrets

    - `CLICKHOUSE_USER`: ClickHouse authentication username.
    - `CLICKHOUSE_PASSWORD`: ClickHouse authentication password.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook endpoint URL.

    ## Quick start

    1. Configure `CLICKHOUSE_USER`, `CLICKHOUSE_PASSWORD`, and `SLACK_WEBHOOK_URL` in your Kestra namespace secrets.
    2. Import this flow YAML into your Kestra workspace.
    3. Specify your ClickHouse HTTP endpoint in `clickhouse_endpoint`.
    4. Click **Execute** in the UI to perform an immediate dictionary memory audit.

    ## Common pitfalls and troubleshooting

    - **Cluster-Wide Aggregation**: In distributed clusters, `system.dictionaries` reflects the local node state; query `clusterAllReplicas('my_cluster', system.dictionaries)` if auditing multi-node topologies.
    - **Lazy vs Eager Loading**: Dictionaries with `LIFETIME(0)` or lazy loading only allocate memory upon the first `dictGet` invocation; maintain periodic background health probes.

    ## How to extend

    - Add automated dictionary reloading via `SYSTEM RELOAD DICTIONARY <name>` if transient network timeouts caused load failure.
    - Correlate dictionary memory consumption with server `max_server_memory_usage` settings.
    - Escalate critical memory saturation alerts to PagerDuty or Opsgenie.

    ## Links

    - Kestra Python Script Documentation: https://kestra.io/plugins/plugin-scripts-python/io.kestra.plugin.scripts.python.Script
    - Kestra Slack Plugin Documentation: https://kestra.io/plugins/plugin-notifications
    - ClickHouse External Dictionaries: https://clickhouse.com/docs/en/sql-reference/dictionaries/external-dictionaries
  tags:
    - Data
    - Infrastructure
  subTags:
    - Databases
    - Monitoring & Alerting
    - Day 2 Operations
  ee: false
  demo: false
