id: gravitino-metalake-catalog-contract-and-storage-drift-gate
namespace: company.data

description: |
  Audits Apache Gravitino metalake catalogs to validate storage warehouse URI boundaries,
  enforce schema capacity quotas, verify backend provider compliance, and alert data platform
  teams via Slack to prevent lakehouse storage isolation leaks and metadata drift.

inputs:
  - id: gravitino_url
    type: STRING
    displayName: Gravitino API Base URL
    description: Host URL of the Apache Gravitino REST API endpoint.
    defaults: "http://localhost:8090"

  - id: metalake
    type: STRING
    displayName: Target Metalake Name
    description: Name of the Gravitino metalake containing catalogs to audit.
    defaults: "production_lakehouse"

  - id: catalog_name
    type: STRING
    displayName: Catalog Name
    description: Name of the catalog registered within the target metalake.
    defaults: "analytics_iceberg"

  - id: expected_provider
    type: STRING
    displayName: Expected Backend Provider
    description: Approved catalog backend provider (e.g. lakehouse-iceberg, hive, jdbc-mysql).
    defaults: "lakehouse-iceberg"

  - id: allowed_warehouse_prefix
    type: STRING
    displayName: Approved Warehouse Storage Prefix
    description: Approved object storage URI prefix for compliant catalog data files (e.g. s3a://prod-lakehouse/).
    defaults: "s3a://prod-lakehouse/"

  - id: max_schemas_allowed
    type: INT
    displayName: Maximum Schemas Allowed
    description: Upper quota limit for schemas registered under this catalog before flagging namespace sprawl.
    defaults: 20

  - id: dry_run
    type: BOOL
    displayName: Dry Run Mode
    description: When true, audits catalog compliance and dispatches Slack notifications without applying quarantine tags.
    defaults: true

  - id: apply_quarantine_tag
    type: BOOL
    displayName: Apply Quarantine Tag on Drift
    description: If true and dry_run is false, updates catalog comments in Gravitino to warn operators of compliance drift.
    defaults: false

tasks:
  - id: probe_catalog_metadata
    type: io.kestra.plugin.core.http.Request
    description: Queries Apache Gravitino REST API to fetch catalog configuration, warehouse URI, provider, and audit logs.
    uri: "{{ inputs.gravitino_url }}/api/metalakes/{{ inputs.metalake }}/catalogs/{{ inputs.catalog_name }}"
    method: GET
    headers:
      Authorization: "Bearer {{ secret('GRAVITINO_API_TOKEN') }}"
      Accept: application/vnd.gravitino.v1+json
    contentType: application/json
    timeout: PT30S

  - id: probe_catalog_schemas
    type: io.kestra.plugin.core.http.Request
    description: Queries Apache Gravitino REST API to list all registered schemas under the target catalog.
    uri: "{{ inputs.gravitino_url }}/api/metalakes/{{ inputs.metalake }}/catalogs/{{ inputs.catalog_name }}/schemas"
    method: GET
    headers:
      Authorization: "Bearer {{ secret('GRAVITINO_API_TOKEN') }}"
      Accept: application/vnd.gravitino.v1+json
    contentType: application/json
    timeout: PT30S

  - id: evaluate_contract_compliance
    type: io.kestra.plugin.core.output.OutputValues
    description: Evaluates catalog provider, storage warehouse URI prefix, and schema inventory against governance policies.
    values:
      actual_provider: >-
        {{ ({'data': outputs.probe_catalog_metadata.body} | jq('.data.catalog.provider // "unknown"')) | first }}
      warehouse_location: >-
        {{ ({'data': outputs.probe_catalog_metadata.body} | jq('.data.catalog.properties.warehouse // "undefined"')) | first }}
      registered_schemas_count: >-
        {{ ({'data': outputs.probe_catalog_schemas.body} | jq('[(.data.names // [])[]] | length')) | first | number }}
      creator: >-
        {{ ({'data': outputs.probe_catalog_metadata.body} | jq('.data.catalog.audit.creator // "unknown"')) | first }}
      status: >-
        {{
          ((({'data': outputs.probe_catalog_metadata.body} | jq('.data.catalog.provider // "unknown"')) | first) != inputs.expected_provider) ? 'UNAPPROVED_PROVIDER' :
          (not ((({'data': outputs.probe_catalog_metadata.body} | jq('.data.catalog.properties.warehouse // "undefined"')) | first) startsWith inputs.allowed_warehouse_prefix)) ? 'STORAGE_DRIFT' :
          (((({'data': outputs.probe_catalog_schemas.body} | jq('[(.data.names // [])[]] | length')) | first | number) > inputs.max_schemas_allowed)) ? 'SCHEMA_QUOTA_BREACH' :
          'COMPLIANT'
        }}

  - id: route_governance_action
    type: io.kestra.plugin.core.flow.Switch
    description: Routes compliance alerts and safe remediation depending on evaluated catalog governance status.
    value: "{{ outputs.evaluate_contract_compliance.values.status }}"
    cases:
      "COMPLIANT":
        - id: log_compliant_catalog
          type: io.kestra.plugin.core.log.Log
          message: "Catalog {{ inputs.metalake }}.{{ inputs.catalog_name }} complies with metadata governance: provider is {{ outputs.evaluate_contract_compliance.values.actual_provider }}, warehouse is {{ outputs.evaluate_contract_compliance.values.warehouse_location }}, registered schemas {{ outputs.evaluate_contract_compliance.values.registered_schemas_count }}/{{ inputs.max_schemas_allowed }}."

      "STORAGE_DRIFT":
        - id: alert_storage_drift
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {{ {'text': 'STORAGE_DRIFT: Gravitino catalog `' ~ inputs.metalake ~ '.' ~ inputs.catalog_name ~ '` has warehouse location `' ~ outputs.evaluate_contract_compliance.values.warehouse_location ~ '` which violates approved prefix `' ~ inputs.allowed_warehouse_prefix ~ '`. Created by `' ~ outputs.evaluate_contract_compliance.values.creator ~ '`. Potential data boundary leak.'} | toJson }}
        - id: apply_storage_quarantine
          type: io.kestra.plugin.core.http.Request
          description: Safe remediation updating catalog comments to quarantine drifted catalog in Gravitino when authorized.
          disabled: "{{ inputs.dry_run or not inputs.apply_quarantine_tag }}"
          uri: "{{ inputs.gravitino_url }}/api/metalakes/{{ inputs.metalake }}/catalogs/{{ inputs.catalog_name }}"
          method: PUT
          headers:
            Authorization: "Bearer {{ secret('GRAVITINO_API_TOKEN') }}"
            Content-Type: application/vnd.gravitino.v1+json
          body: |
            {"comment": "[QUARANTINE - STORAGE DRIFT] Warehouse location violates storage boundary policy."}

      "SCHEMA_QUOTA_BREACH":
        - id: alert_quota_breach
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {{ {'text': 'SCHEMA_QUOTA_BREACH: Gravitino catalog `' ~ inputs.metalake ~ '.' ~ inputs.catalog_name ~ '` contains ' ~ outputs.evaluate_contract_compliance.values.registered_schemas_count ~ ' schemas, exceeding quota limit of ' ~ inputs.max_schemas_allowed ~ '. Review tenant schema allocation.'} | toJson }}

      "UNAPPROVED_PROVIDER":
        - id: alert_unapproved_provider
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {{ {'text': 'UNAPPROVED_PROVIDER: Gravitino catalog `' ~ inputs.metalake ~ '.' ~ inputs.catalog_name ~ '` registered with provider `' ~ outputs.evaluate_contract_compliance.values.actual_provider ~ '`, expected `' ~ inputs.expected_provider ~ '`. Disallowed catalog engine detected.'} | toJson }}

  - id: log_governance_audit
    type: io.kestra.plugin.core.log.Log
    description: Records an immutable audit trace entry containing evaluated metrics and final governance status.
    message: "Gravitino catalog metadata audit complete for {{ inputs.metalake }}.{{ inputs.catalog_name }}: status {{ outputs.evaluate_contract_compliance.values.status }}, provider {{ outputs.evaluate_contract_compliance.values.actual_provider }}, schemas {{ outputs.evaluate_contract_compliance.values.registered_schemas_count }}, warehouse {{ outputs.evaluate_contract_compliance.values.warehouse_location }}."

errors:
  - id: alert_gravitino_unreachable
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Dispatches an urgent alert to Slack if Apache Gravitino REST API is unreachable or returns an error response.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {{ {'text': 'Gravitino catalog metadata probe failed for `' ~ inputs.metalake ~ '.' ~ inputs.catalog_name ~ '` (execution ' ~ execution.id ~ ') on `' ~ inputs.gravitino_url ~ '`. Verify Gravitino container status and GRAVITINO_API_TOKEN secret.'} | toJson }}

triggers:
  - id: daily_catalog_governance_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: Runs scheduled catalog metadata contract and storage drift audit daily at 02:00 UTC. Shipped disabled by default.
    cron: "0 2 * * *"
    disabled: true
    inputs:
      gravitino_url: "http://localhost:8090"
      metalake: "production_lakehouse"
      catalog_name: "analytics_iceberg"
      expected_provider: "lakehouse-iceberg"
      allowed_warehouse_prefix: "s3a://prod-lakehouse/"
      max_schemas_allowed: 20
      dry_run: true
      apply_quarantine_tag: false

extend:
  title: Apache Gravitino Metalake Catalog Metadata Contract & Storage Drift Gate
  metaTitle: Apache Gravitino Catalog Contract & Storage Drift Gate | Kestra
  shortDescription: Audit Apache Gravitino metalakes for catalog contract compliance, validate storage warehouse URI boundaries, and alert Slack.
  metaDescription: Audit Apache Gravitino metalake catalogs for storage URI drift, enforce schema capacity quotas, alert via Slack, and prevent lakehouse isolation leaks.
  description: |
    Audits multi-cloud lakehouse catalogs managed by Apache Gravitino to enforce metadata contracts,
    validate warehouse storage URI boundaries, prevent unapproved storage tier drift, monitor schema
    capacity quotas, and dispatch actionable operational alerts via Slack to prevent lakehouse storage
    isolation leaks.

    This blueprint was created by [Mohit Jeswani](https://github.com/mohitjeswani01).

    ## How it works

    1. `daily_catalog_governance_audit` (`io.kestra.plugin.core.trigger.Schedule`) initiates the
       governance audit daily at 02:00 UTC. It is shipped disabled by default so engineers can verify
       catalog parameters in dry-run mode prior to automated scheduling.
    2. `probe_catalog_metadata` (`io.kestra.plugin.core.http.Request`) invokes the Apache Gravitino
       REST API endpoint `GET /api/metalakes/{metalake}/catalogs/{catalog}` with bearer token authentication
       to extract catalog provider, warehouse storage URI properties, and creation audit info.
    3. `probe_catalog_schemas` (`io.kestra.plugin.core.http.Request`) queries `GET /api/metalakes/{metalake}/catalogs/{catalog}/schemas`
       to retrieve the full inventory of active schemas registered under the target catalog.
    4. `evaluate_contract_compliance` (`io.kestra.plugin.core.output.OutputValues`) parses both API
       responses and classifies the operational governance status:
       - **COMPLIANT:** Backend provider matches specification, warehouse storage URI adheres to the
         approved object storage prefix, and schema count remains strictly within quota.
       - **STORAGE_DRIFT:** The warehouse property points to an unapproved bucket, local directory, or
         unauthorized storage tier.
       - **SCHEMA_QUOTA_BREACH:** The number of registered schemas exceeds `max_schemas_allowed`, flagging
         unmanaged tenant catalog sprawl.
       - **UNAPPROVED_PROVIDER:** The catalog is registered with an unexpected engine backend.
    5. `route_governance_action` (`io.kestra.plugin.core.flow.Switch`) handles downstream dispatch:
       - **COMPLIANT:** Emits nominal telemetry to execution logs via `io.kestra.plugin.core.log.Log`.
       - **STORAGE_DRIFT:** Sends a high-severity alert to Slack containing the invalid warehouse location,
         creator identity, and metalake path. If `apply_quarantine_tag` is enabled and `dry_run` is false,
         invokes a safe `PUT` request to annotate the catalog comment with quarantine warnings.
       - **SCHEMA_QUOTA_BREACH:** Dispatches a warning alert to Slack detailing tenant schema overage.
       - **UNAPPROVED_PROVIDER:** Dispatches a priority alert to Slack flagging disallowed catalog backends.
    6. `log_governance_audit` logs an immutable audit entry recording metalake, catalog, provider,
       schema inventory, and warehouse storage locations for SOC2 compliance history.
    7. Global `errors` block dispatches an out-of-band notification to Slack if the Apache Gravitino
       service is unreachable or returns an HTTP error code.

    ## What you get

    - Automated metadata contract governance ensuring all lakehouse catalogs registered in Gravitino
      comply with organizational storage tier policies.
    - Continuous validation of object storage bucket paths (`s3a://`, `abfss://`, `gcs://`) preventing
      accidental writes to staging, testing, or unencrypted storage buckets.
    - Tenant schema quota enforcement to prevent runaway catalog pollution and maintain snappy metadata
      sync performance for query engines like Trino and Apache Spark.
    - Safe operational remediation: catalog comments can be updated in Gravitino with quarantine warnings
      only when explicitly authorized (`apply_quarantine_tag: true` and `dry_run: false`).

    ## Who it's for

    - Data Platform Engineers and Lakehouse Architects managing multi-catalog deployments via Apache Gravitino.
    - Governance, Risk, and Compliance (GRC) teams requiring continuous validation of cloud storage
      isolation boundaries.
    - Analytics Engineering leads responsible for multi-tenant schema provisioning and quota management.

    ## Why orchestrate this with Kestra

    Apache Gravitino serves as a unified metadata catalog across lakehouses, messaging brokers, and relational
    databases, but it does not natively enforce automated external compliance audits or trigger Slack alerts
    when storage path drift occurs. Handcrafted cron scripts lack declarative visibility, secret masking,
    retry policies, and conditional execution flow. Kestra provides clean YAML-based orchestration,
    built-in HTTP task resilience, visual workflow inspection, and standardized audit trails.

    ## Prerequisites

    - An accessible Apache Gravitino instance. Gravitino provides an official open-source Docker image
      (`datastrato/gravitino:latest` or `apache/gravitino:latest`) requiring no paid license or enterprise tier.
    - A metalake and catalog provisioned in Gravitino (e.g. an Iceberg or Hive catalog).
    - An API authentication token configured if Gravitino is running in authenticated mode.
    - A Slack incoming webhook URL for operational notifications.

    ### Secrets

    - `GRAVITINO_API_TOKEN`: Bearer token for authenticating with the Apache Gravitino REST API.
      In Kestra OSS, configure as `SECRET_GRAVITINO_API_TOKEN`.
    - `SLACK_WEBHOOK_URL`: Slack incoming webhook URL used by notification tasks and the global `errors` block.
      In Kestra OSS, configure as `SECRET_SLACK_WEBHOOK_URL`.

    ## Quick start

    1. Start a local Apache Gravitino container:
       ```bash
       docker run -d --name gravitino-test -p 8090:8090 datastrato/gravitino:latest
       ```
    2. Configure `GRAVITINO_API_TOKEN` and `SLACK_WEBHOOK_URL` secrets in your Kestra namespace.
    3. Import this blueprint into Kestra and trigger an execution with default inputs in dry-run mode.
    4. Review execution logs to observe catalog metadata inspection and compliance evaluation.
    5. Test alerting by setting `allowed_warehouse_prefix` to an intentionally mismatched string
       (e.g. `s3a://other-bucket/`) to observe `alert_storage_drift` dispatching to Slack.
    6. Enable `daily_catalog_governance_audit` once operational parameters are aligned.

    ## How to extend

    - Add downstream tasks to sync verified Gravitino catalog schemas to an enterprise data catalog
      such as Apache Atlas or OpenMetadata.
    - Integrate with cloud IAM policy validators to verify that the evaluated `warehouse_location`
      bucket has server-side KMS encryption enabled.
    - Trigger downstream automated dbt or Trino test suites only when the catalog passes compliance.

    ## Links

    - [Apache Gravitino Official Website](https://gravitino.apache.org/)
    - [Apache Gravitino REST API Documentation](https://gravitino.apache.org/docs/latest/api/rest/)
    - [Apache Gravitino Docker Hub Image](https://hub.docker.com/r/datastrato/gravitino)
    - [Kestra HTTP Request Plugin Documentation](https://kestra.io/plugins/plugin-core/tasks/http/io.kestra.plugin.core.http.request)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack/notifications/io.kestra.plugin.slack.notifications.slackincomingwebhook)
