id: pubchem-chemical-compounds-lakehouse-loader
namespace: company.analytics
description: Ingests chemical compound molecular formulas, weights, canonical InChIKeys, and SMILES from NCBI PubChem into Parquet lakehouse storage via DuckDB, tracking molecular compounds in Kestra KV store.

inputs:
  - id: compound_names
    type: ARRAY
    itemType: STRING
    description: List of chemical or pharmaceutical compound names to extract.
    defaults:
      - aspirin
      - caffeine
      - ibuprofen
      - paracetamol
      - penicillin
      - metformin

  - id: heavy_molecular_weight_threshold
    type: FLOAT
    description: Molecular weight threshold in g/mol to classify compounds as heavy macromolecules.
    defaults: 300.0

  - id: state_key
    type: STRING
    description: Kestra KV store key maintaining the latest known chemical compound CIDs.
    defaults: pubchem_monitored_compounds_state

variables:
  default_state: "{}"

triggers:
  - id: monthly_chemistry_sync
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 3 1 * *"

tasks:
  - id: get_current_state
    type: io.kestra.plugin.core.kv.Get
    key: "{{ inputs.state_key }}"
    errorOnMissing: false

  - id: ingest_and_transform_compounds
    type: io.kestra.plugin.scripts.python.Commands
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install requests duckdb
    commands:
      - |
        python3 - << 'EOF'
        import os
        import json
        import requests
        import duckdb
        from datetime import datetime

        raw_state = """{{ outputs.get_current_state.value ?? vars.default_state }}"""
        try:
            state = json.loads(raw_state) if raw_state else {}
        except Exception:
            state = {}

        compounds = json.loads("""{{ inputs.compound_names | toJson }}""")
        weight_threshold = float("{{ inputs.heavy_molecular_weight_threshold }}")

        headers = {"User-Agent": "KestraCheminformaticsLakehouse/1.0 (biochem-analytics@kestra.io)"}

        records = []
        heavy_compounds = []
        new_state = dict(state)

        for name in compounds:
            try:
                url = f"https://pubchem.ncbi.nlm.nih.gov/rest/pug/compound/name/{name}/property/MolecularFormula,MolecularWeight,InChIKey,CanonicalSMILES/JSON"
                resp = requests.get(url, headers=headers, timeout=20)
                if resp.status_code == 200:
                    data = resp.json()
                    props = data.get("PropertyTable", {}).get("Properties", [])
                    if props:
                        p = props[0]
                        cid = int(p.get("CID", 0))
                        formula = p.get("MolecularFormula", "")
                        weight = float(p.get("MolecularWeight", 0.0) or 0.0)
                        inchikey = p.get("InChIKey", "")
                        smiles = p.get("CanonicalSMILES", "")

                        is_heavy = weight >= weight_threshold
                        is_new = name not in state

                        records.append({
                            "compound_name": name,
                            "pubchem_cid": cid,
                            "molecular_formula": formula,
                            "molecular_weight_gmol": weight,
                            "inchikey": inchikey,
                            "canonical_smiles": smiles,
                            "is_heavy_macromolecule": is_heavy,
                            "is_new_compound": is_new,
                            "harvest_time": datetime.utcnow().isoformat()
                        })

                        if is_heavy:
                            heavy_compounds.append({"name": name, "cid": cid, "weight": weight})

                        new_state[name] = cid
            except Exception as e:
                print(f"Error fetching PubChem compound '{name}': {e}")

        with open("pubchem_compounds.json", "w", encoding="utf-8") as f:
            json.dump(records, f)

        con = duckdb.connect()
        if records:
            con.execute("CREATE TABLE pubchem_compounds AS SELECT * FROM read_json_auto('pubchem_compounds.json')")
            con.execute("COPY pubchem_compounds TO 'pubchem_compounds_archive.parquet' (FORMAT PARQUET)")
            con.execute("COPY pubchem_compounds TO 'pubchem_compounds_archive.csv' (HEADER, DELIMITER ',')")
        else:
            con.execute("""
                CREATE TABLE pubchem_compounds (
                    compound_name VARCHAR,
                    pubchem_cid BIGINT,
                    molecular_formula VARCHAR,
                    molecular_weight_gmol DOUBLE,
                    inchikey VARCHAR,
                    canonical_smiles VARCHAR,
                    is_heavy_macromolecule BOOLEAN,
                    is_new_compound BOOLEAN,
                    harvest_time VARCHAR
                )
            """)
            con.execute("COPY pubchem_compounds TO 'pubchem_compounds_archive.parquet' (FORMAT PARQUET)")
            con.execute("COPY pubchem_compounds TO 'pubchem_compounds_archive.csv' (HEADER, DELIMITER ',')")

        summary = {
            "total_compounds_count": len(records),
            "heavy_compounds_count": len(heavy_compounds),
            "heavy_compounds": heavy_compounds[:5],
            "updated_state": new_state
        }

        print(f"::{{'outputs': {json.dumps(summary)}}}::")
        EOF
    outputFiles:
      - pubchem_compounds_archive.parquet
      - pubchem_compounds_archive.csv

  - id: persist_state
    type: io.kestra.plugin.core.kv.Set
    key: "{{ inputs.state_key }}"
    value: "{{ outputs.ingest_and_transform_compounds.vars.updated_state | toJson }}"

  - id: check_heavy_compounds
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.ingest_and_transform_compounds.vars.heavy_compounds_count > 0 }}"
    then:
      - id: notify_heavy_compounds
        type: io.kestra.plugin.core.log.Log
        level: INFO
        message: "🧪 PubChem Cheminformatics Sync: Identified {{ outputs.ingest_and_transform_compounds.vars.heavy_compounds_count }} compound(s) exceeding {{ inputs.heavy_molecular_weight_threshold }} g/mol molecular weight."

outputs:
  - id: total_compounds
    type: INT
    value: "{{ outputs.ingest_and_transform_compounds.vars.total_compounds_count }}"
  - id: heavy_compounds_count
    type: INT
    value: "{{ outputs.ingest_and_transform_compounds.vars.heavy_compounds_count }}"
  - id: dataset_parquet
    type: FILE
    value: "{{ outputs.ingest_and_transform_compounds.outputFiles['pubchem_compounds_archive.parquet'] }}"

extend:
  title: NCBI PubChem Chemical Compound Structures Lakehouse Loader with DuckDB
  metaTitle: NCBI PubChem Compounds Lakehouse Loader | Kestra
  shortDescription: Ingests chemical compound molecular formulas, weights, canonical InChIKeys, and SMILES from NCBI PubChem into Parquet lakehouse storage via DuckDB.
  metaDescription: Poll NCBI PubChem PUG REST API for chemical structures and molecular weights, convert cheminformatics records into Parquet via DuckDB, and track state in KV store.
  tags:
    - Data
  subTags:
    - ELT & Warehouse Loading
    - File & Data Processing Basics
  ee: false
  demo: false
  description: |
    Automate the collection, cheminformatics harmonization, and analytical lakehouse persistence of chemical
    compounds, molecular formulas, canonical SMILES strings, and molecular weights from NCBI PubChem into Parquet using DuckDB.

    ## How it works

    1. **State Recovery**: Queries the Kestra KV store (`pubchem_monitored_compounds_state`) for previous PubChem Compound Identifiers (CIDs).
    2. **PubChem PUG REST Ingestion**: Queries the official NCBI PubChem REST API (`pubchem.ncbi.nlm.nih.gov/rest/pug/compound/`) across target compound names.
    3. **DuckDB Cheminformatics Normalization**: Unpacks PubChem CIDs, InChIKeys, molecular weights, and formulas into a relational schema inside Docker.
    4. **Analytical Lake Export**: Exports normalized chemical records into columnar Parquet and CSV files for drug discovery modeling and quantitative structure-activity relationship (QSAR) pipelines.
    5. **Weight Evaluation & State Commitment**: Classifies macromolecules exceeding defined weight thresholds and commits state to Kestra KV store.

    ## What you get

    - Automated, scheduled collection of institutional-grade chemical structure registries.
    - Columnar Parquet datasets queryable with DuckDB, ClickHouse, Snowflake, or Athena.
    - Built-in KV state management providing idempotent execution and zero database requirements.

    ## Who it's for

    - Cheminformaticians and Computational Chemists screening chemical libraries.
    - Bioinformatics and Drug Discovery Data Scientists training molecular property predictors.
    - Analytics Engineers building reproducible multi-cloud lakehouse pipelines.

    ## Why orchestrate this with Kestra

    - Built-in KV store maintains historical chemical registry states across runs without database infrastructure.
    - Ephemeral Docker execution guarantees reproducible, clean Python and DuckDB runtimes.
    - Declarative scheduled execution with automated error recovery and conditional logging.

    ## Prerequisites

    - Docker runner configured on the Kestra worker.
    - Outbound internet access to `pubchem.ncbi.nlm.nih.gov`.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: (Optional) Webhook URL for alerting teams on chemical compound screening updates.

    ## Quick start

    1. Import this blueprint into your Kestra instance.
    2. Configure the `compound_names` input list.
    3. Click **Execute** to run an immediate harvest and generate the Parquet archive.
    4. Enable the `monthly_chemistry_sync` schedule for automated monthly updates.

    ## How to extend

    - Add an S3 or Google Cloud Storage step to partition monthly chemical catalog archives.
    - Connect an RDKit or deepchem featurization step downstream in Python.

    ## Links

    - [NCBI PubChem PUG REST Documentation](https://pubchem.ncbi.nlm.nih.gov/docs/pug-rest)
    - [DuckDB Documentation](https://duckdb.org/)
    - [Kestra Task Runners](https://kestra.io/docs/task-runners)
