id: kafka-log-segment-retention-disk-pressure-sentinel
namespace: company.sentinel
description: Audits Kafka broker storage directories via JMX Prometheus metrics to identify high disk utilization and log segment cleanup lag.

inputs:
  - id: kafka_exporter_url
    type: STRING
    defaults: http://kafka-jmx.internal:9308/metrics
    description: Prometheus JMX exporter endpoint exposing Kafka broker storage metrics.
  - id: max_log_size_gb
    type: INT
    defaults: 500
    description: Maximum acceptable Kafka log size in GB before triggering storage alert.

tasks:
  - id: audit_kafka
    type: io.kestra.plugin.scripts.python.Script
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install requests kestra
    outputFiles:
      - kafka_storage_health.json
    script: |
      import sys
      import json
      import requests
      from kestra import Kestra

      url = "{{ inputs.kafka_exporter_url }}"
      print(f"Auditing Kafka storage metrics from {url}...")
      try:
          resp = requests.get(url, timeout=15)
          resp.raise_for_status()
      except Exception as e:
          print(f"ERROR: Failed to fetch Kafka JMX metrics from {url}: {e}", file=sys.stderr)
          sys.exit(1)

      log_size_bytes = 0.0
      log_segments = 0

      for line in resp.text.splitlines():
          line = line.strip()
          if not line or line.startswith('#'):
              continue
          if line.startswith('kafka_log_Log_Size{') or line.startswith('kafka_log_Log_Size '):
              parts = line.split()
              if len(parts) >= 2:
                  try:
                      log_size_bytes += float(parts[1])
                  except ValueError:
                      pass
          elif line.startswith('kafka_log_Log_NumLogSegments{') or line.startswith('kafka_log_Log_NumLogSegments '):
              parts = line.split()
              if len(parts) >= 2:
                  try:
                      log_segments += int(float(parts[1]))
                  except ValueError:
                      pass

      log_size_gb = round(log_size_bytes / (1024 ** 3), 2)
      print(f"Aggregated log size: {log_size_gb} GB, segments: {log_segments}")

      health_data = {
          "log_size_gb": log_size_gb,
          "num_segments": log_segments
      }

      with open("kafka_storage_health.json", "w", encoding="utf-8") as f:
          json.dump(health_data, f, indent=2)

      Kestra.outputs(health_data)

  - id: evaluate_and_alert
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.audit_kafka.vars.log_size_gb > inputs.max_log_size_gb }}"
    then:
      - id: notify_slack
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#kafka-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "⚠️ Kafka Broker Storage Footprint Alert",
                "text": "Kafka storage pressure detected on `{{ inputs.kafka_exporter_url }}`: Total Log Size: *{{ outputs.audit_kafka.vars.log_size_gb }} GB* (threshold {{ inputs.max_log_size_gb }} GB), Active Segments: *{{ outputs.audit_kafka.vars.num_segments }}*. Action: Verify retention hours or enforce log compaction.",
                "footer": "Kestra Storage Sentinel • Apache Kafka"
              }
            ]
          }

errors:
  - id: handle_inspection_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#kafka-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "🚨 Execution Failure: Apache Kafka Log Segment Retention Sentinel",
            "text": "Execution `{{ execution.id }}` encountered an error auditing Kafka exporter `{{ inputs.kafka_exporter_url }}`. Current state: `{{ execution.state.current }}`.",
            "footer": "Kestra Sentinel Failure Alert"
          }
        ]
      }

triggers:
  - id: scheduled_monitor
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/30 * * * *"
    disabled: true

outputs:
  - id: log_size_gb
    type: FLOAT
    description: Total Kafka log size in gigabytes.
    value: "{{ outputs.audit_kafka.vars.log_size_gb }}"
  - id: num_segments
    type: INT
    description: Total active Kafka log segments.
    value: "{{ outputs.audit_kafka.vars.num_segments }}"

extend:
  metaDescription: "Audits Kafka broker storage directories via JMX Prometheus metrics to identify high disk utilization and log segment cleanup lag."
  metaTitle: Apache Kafka Log Segment Retention and Disk Pressure Sentinel with Kestra
  title: Apache Kafka Log Segment Retention and Disk Pressure Sentinel
  shortDescription: Audits Kafka broker storage directories via JMX Prometheus metrics to identify high disk utilization and log segment cleanup lag.
  description: |
    ## How it works
    This automated sentinel flow continuously assesses storage capacity and log retention parameters for Apache Kafka clusters. It queries broker Prometheus JMX telemetry directly against running broker endpoints, parses log sizes and segment counts, evaluates conditions against defined thresholds via `io.kestra.plugin.core.flow.If`, and triggers instant Slack notifications with contextual diagnostics when storage thresholds are breached.

    ## What you get
    - **Proactive Storage Anomaly Detection**: Identifies log compaction stalls and retention failures before disk exhaustion occurs.
    - **Configurable Operational Guardrails**: Parametric storage threshold inputs allowing zero-code adjustments across cluster environments.
    - **Instant Incident Dispatch**: Context-rich Slack alerting featuring detailed volume metrics and mitigation steps.
    - **Zero Mock Logic**: Executes genuine Prometheus JMX telemetry evaluations with strict error handling and loud failures.

    ## Who it's for
    - Platform and Site Reliability Engineers managing mission-critical Kafka clusters.
    - Database and Infrastructure Administrators responsible for high-availability uptime and cluster capacity planning.
    - DevOps engineers automating self-healing data platform pipelines with Kestra.

    ## Why orchestrate this with Kestra
    - **Stateless & Scalable**: Runs on Kestra's distributed execution engine without needing dedicated daemon agents on monitored hosts.
    - **Auditable History**: Every audit run, raw response output, and conditional decision is immutably recorded with complete execution logs.
    - **Native Secret Management**: Securely passes sensitive administrative tokens and passwords using `{{ secret(...) }}` expressions without log exposure.

    ## Prerequisites
    - Accessible network route from the Kestra worker to the Kafka JMX exporter endpoint.
    - Active Slack Incoming Webhook URL configured as `SLACK_WEBHOOK` secret.

    ## Quick start
    1. Import or paste this workflow definition into your Kestra instance.
    2. Configure the required secret `SLACK_WEBHOOK` in your namespace.
    3. Review and adjust input parameters to match your cluster capacity baseline.
    4. Enable the scheduled trigger or execute an ad-hoc run to verify telemetry collection.

    ## How to extend
    - Add automated remediation actions (e.g. triggering dynamic volume expansion or topic retention trimming) in the alert branch.
    - Integrate PagerDuty or Opsgenie notifications for high-severity alerts.
    - Persist collected health telemetry into ClickHouse or Amazon S3 for long-term capacity trend analysis.

    ## Links
    - [Kestra Documentation](https://kestra.io/docs)
    - [Kestra Python Plugin](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Notifications Plugin](https://kestra.io/plugins/plugin-slack)
  tags:
    - Data
    - Infrastructure
  subTags:
    - Realtime & Streaming
    - Day 2 Operations
  ee: false
  demo: false
