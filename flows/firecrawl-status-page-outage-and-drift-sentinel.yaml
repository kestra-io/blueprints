id: firecrawl-status-page-outage-and-drift-sentinel
namespace: company.sre

description: |
  Call the Firecrawl REST API directly to scrape a third-party vendor status page, classify the
  result against outage and degradation keywords found in the real returned Markdown, alert
  Slack with the exact page title and status code, and log a governance audit trail either way.

inputs:
  - id: status_page_url
    type: STRING
    displayName: Target status page URL
    description: URL of the third-party SaaS or cloud provider status page to scrape.
    defaults: "https://status.openai.com"

  - id: firecrawl_base_url
    type: STRING
    displayName: Firecrawl base URL
    description: Base API URL of the Firecrawl service. Supports a self-hosted instance or the managed cloud endpoint.
    defaults: "http://localhost:3002"

  - id: outage_indicator
    type: STRING
    displayName: Major outage keyword
    description: Text pattern in the scraped Markdown indicating a complete or critical service disruption.
    defaults: "Major Outage"

  - id: degradation_indicator
    type: STRING
    displayName: Degraded performance keyword
    description: Text pattern in the scraped Markdown indicating partial service degradation or elevated error rates.
    defaults: "Degraded Performance"

triggers:
  - id: hourly
    type: io.kestra.plugin.core.trigger.Schedule
    description: Shipped disabled. Enable once FIRECRAWL_API_KEY and SLACK_WEBHOOK_URL are set and status_page_url points at a real vendor status page.
    cron: "0 * * * *"
    disabled: true
    inputs:
      status_page_url: "https://status.openai.com"
      firecrawl_base_url: "http://localhost:3002"
      outage_indicator: "Major Outage"
      degradation_indicator: "Degraded Performance"

tasks:
  - id: scrape_status_page
    type: io.kestra.plugin.core.http.Request
    description: Kestra has no Firecrawl plugin, so this calls the Firecrawl REST API directly (POST /v2/scrape) to extract clean Markdown from the status page, along with its real HTTP status code and title.
    allowFailure: true
    method: POST
    uri: "{{ inputs.firecrawl_base_url }}/v2/scrape"
    contentType: application/json
    headers:
      Authorization: "Bearer {{ secret('FIRECRAWL_API_KEY') }}"
    body: |
      {
        "url": "{{ inputs.status_page_url }}",
        "formats": ["markdown"],
        "onlyMainContent": true
      }

  - id: evaluate_service_health
    type: io.kestra.plugin.core.flow.Switch
    description: Classifies the scrape against the real returned status code and Markdown content, never a simulated or hard-coded result, into COMPLIANT, MAJOR_OUTAGE_DETECTED, DEGRADED_PERFORMANCE_DETECTED, CONTENT_EXTRACTION_FAILED, or STATUS_PAGE_UNAVAILABLE.
    value: |
      {% if outputs.scrape_status_page is not defined %}
      STATUS_PAGE_UNAVAILABLE
      {% elseif (outputs.scrape_status_page.body | jq('.data.metadata.statusCode') | first | default(0)) != 200 %}
      STATUS_PAGE_UNAVAILABLE
      {% elseif (outputs.scrape_status_page.body | jq('.data.markdown') | first | default('')) == '' %}
      CONTENT_EXTRACTION_FAILED
      {% elseif (outputs.scrape_status_page.body | jq('.data.markdown') | first | default('')) contains inputs.outage_indicator %}
      MAJOR_OUTAGE_DETECTED
      {% elseif (outputs.scrape_status_page.body | jq('.data.markdown') | first | default('')) contains inputs.degradation_indicator %}
      DEGRADED_PERFORMANCE_DETECTED
      {% else %}
      COMPLIANT
      {% endif %}
    cases:
      COMPLIANT:
        - id: log_compliant
          type: io.kestra.plugin.core.log.Log
          message: "Status page {{ inputs.status_page_url }} ('{{ outputs.scrape_status_page.body | jq('.data.metadata.title') | first }}') is operational, no outage or degradation keywords found."
      MAJOR_OUTAGE_DETECTED:
        - id: alert_major_outage
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {{ {'text': 'MAJOR_OUTAGE_DETECTED: status page ' ~ inputs.status_page_url ~ ' (' ~ '"' ~ (outputs.scrape_status_page.body | jq('.data.metadata.title') | first) ~ '"' ~ ') contains the outage keyword ' ~ '"' ~ inputs.outage_indicator ~ '"' ~ '.'} | toJson }}
      DEGRADED_PERFORMANCE_DETECTED:
        - id: alert_degraded
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {{ {'text': 'DEGRADED_PERFORMANCE_DETECTED: status page ' ~ inputs.status_page_url ~ ' (' ~ '"' ~ (outputs.scrape_status_page.body | jq('.data.metadata.title') | first) ~ '"' ~ ') contains the degradation keyword ' ~ '"' ~ inputs.degradation_indicator ~ '"' ~ '.'} | toJson }}
      CONTENT_EXTRACTION_FAILED:
        - id: alert_extraction_failed
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {{ {'text': 'CONTENT_EXTRACTION_FAILED: Firecrawl returned a 200 for ' ~ inputs.status_page_url ~ ' but no Markdown content. The page may need JavaScript rendering or a different wait strategy.'} | toJson }}
      STATUS_PAGE_UNAVAILABLE:
        - id: alert_unavailable
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {{ {'text': 'STATUS_PAGE_UNAVAILABLE: scraping ' ~ inputs.status_page_url ~ ' via Firecrawl did not return a healthy result. Check firecrawl_base_url, FIRECRAWL_API_KEY, and that the target page is reachable.'} | toJson }}

  - id: summary
    type: io.kestra.plugin.core.log.Log
    message: "Firecrawl status page sentinel complete for {{ inputs.status_page_url }}: severity {{ outputs.evaluate_service_health.value }}."

errors:
  - id: alert_flow_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {{ {'text': 'Firecrawl status page sentinel failed (execution ' ~ execution.id ~ '). Check the logs.'} | toJson }}

extend:
  title: Firecrawl Status Page Outage and Drift Sentinel
  metaTitle: Firecrawl Status Page Outage Sentinel with Kestra
  shortDescription: Scrape a vendor status page with the Firecrawl REST API, classify outage or degradation keywords in the real returned Markdown, and alert Slack.
  metaDescription: Scrape vendor status pages with Firecrawl, detect real outage or degradation keywords, and alert Slack on third-party incidents via Kestra.
  description: |
    A vendor's status page is the fastest signal that a dependency is failing, but nobody is
    refreshing it by hand every hour. Firecrawl can turn that page into clean Markdown in one
    call; Kestra turns that Markdown into a decision. This blueprint calls the Firecrawl REST API
    directly (there is no dedicated Firecrawl plugin in Kestra), reads the real HTTP status and
    page content Firecrawl returns, and classifies the result against outage and degradation
    keywords you set, rather than ever assuming the page is healthy.

    This blueprint was created by [Mohit Jeswani](https://github.com/mohitjeswani01).

    ## How it works

    1. `scrape_status_page` (`io.kestra.plugin.core.http.Request`) calls `POST /v2/scrape` on
       the Firecrawl API, since Kestra has no dedicated Firecrawl plugin. The response carries
       the page's Markdown and metadata under `data.markdown` and `data.metadata`.
       `allowFailure: true` covers a network or auth error without failing the flow outright.
    2. `evaluate_service_health` (`io.kestra.plugin.core.flow.Switch`) reads the real returned
       status code and Markdown with `jq`, and classifies the result as `COMPLIANT`,
       `MAJOR_OUTAGE_DETECTED`, `DEGRADED_PERFORMANCE_DETECTED`, `CONTENT_EXTRACTION_FAILED`, or
       `STATUS_PAGE_UNAVAILABLE`. Every branch is driven by what Firecrawl actually returned,
       never a hard-coded or simulated value.
    3. Each non-`COMPLIANT` case posts a Slack alert naming the real page title and the exact
       keyword that matched; `COMPLIANT` only logs.
    4. `summary` logs the severity, closing the governance cycle.
    5. `errors` alerts Slack if the flow itself fails, for example an expired Firecrawl key.

    ## What you get

    - A classification built entirely from Firecrawl's real response, including a distinct
      `STATUS_PAGE_UNAVAILABLE` state when the scrape itself fails, so a dead probe is never
      mistaken for a healthy vendor.
    - The exact page title and matched keyword in every Slack alert, not a generic "something
      changed" notice.
    - A read-only check: nothing is written back to the vendor's status page or to Firecrawl.

    ## Who it's for

    - SRE and platform teams who depend on third-party SaaS or cloud APIs and want outage
      detection the moment a status page changes, not when a customer reports it first.
    - Teams evaluating how to call Firecrawl from Kestra who want a worked example using the
      core `http.Request` task against Firecrawl's real REST API, distinct from assuming a
      dedicated plugin class exists.

    ## Why orchestrate this with Kestra

    Firecrawl turns a status page into clean Markdown on request, but it has no scheduler, no
    keyword policy, and no Slack integration of its own. Kestra keeps `outage_indicator` and
    `degradation_indicator` as flow inputs, turns a scrape into a severity decision, and keeps a
    full execution history of every check and what it found.

    ## Prerequisites

    - A Firecrawl instance, self-hosted or managed cloud, reachable from the Kestra worker.
    - A Firecrawl API key with scrape permission.
    - A Slack incoming webhook URL.

    A local Firecrawl instance can be run via the official self-hosted Docker Compose setup
    (`docs.firecrawl.dev/contributing/self-host`) for a fully local end-to-end test; the default
    quickstart configuration has authentication off, so any placeholder API key works against it.

    ### Secrets

    - `FIRECRAWL_API_KEY`: sent as `Authorization: Bearer {{ secret('FIRECRAWL_API_KEY') }}` by
      `scrape_status_page`. In Kestra OSS, provide it as the base64-encoded environment variable
      `SECRET_FIRECRAWL_API_KEY`.
    - `SLACK_WEBHOOK_URL`: used by all four Slack alert cases and the `errors` block. In Kestra
      OSS, provide it as the base64-encoded environment variable `SECRET_SLACK_WEBHOOK_URL`.

    ### Inputs

    | Input | Default | Purpose |
    |---|---|---|
    | `status_page_url` | `https://status.openai.com` | Vendor status page to scrape |
    | `firecrawl_base_url` | `http://localhost:3002` | Firecrawl API base URL |
    | `outage_indicator` | `Major Outage` | Keyword that classifies a major outage |
    | `degradation_indicator` | `Degraded Performance` | Keyword that classifies degraded performance |

    ### Outputs

    - `{{ outputs.scrape_status_page.body }}`: the raw Firecrawl JSON response as text; parse
      with `jq` or `fromJson(...)`.
    - `{{ outputs.evaluate_service_health.value }}`: `COMPLIANT`, `MAJOR_OUTAGE_DETECTED`,
      `DEGRADED_PERFORMANCE_DETECTED`, `CONTENT_EXTRACTION_FAILED`, or
      `STATUS_PAGE_UNAVAILABLE`.

    ### Pitfalls

    - Firecrawl's scrape endpoint is `/v2/scrape`, not `/v1/scrape`; verified directly against
      Firecrawl's current API reference rather than assumed, since the version in the path is
      easy to get stale.
    - `io.kestra.plugin.slack.notifications.SlackIncomingWebhook` has no `channel` property; a
      standard Slack incoming webhook posts to the single channel it was created for and cannot
      be redirected per message. Verified directly against the task's source (`url`, `payload`,
      `messageText`, and connection `options` only); route to a different channel by creating a
      separate webhook for that channel instead.
    - A scrape that succeeds (HTTP 200 from Firecrawl itself) but returns an empty
      `data.markdown` is classified `CONTENT_EXTRACTION_FAILED`, not `COMPLIANT` or
      `STATUS_PAGE_UNAVAILABLE`, since Firecrawl did respond, it just extracted nothing readable.

    ## Quick start

    1. Add the `FIRECRAWL_API_KEY` and `SLACK_WEBHOOK_URL` secrets.
    2. Run a local Firecrawl instance (or point `firecrawl_base_url` at the managed cloud
       endpoint) and confirm it can reach `status_page_url`.
    3. Run the flow manually and confirm `summary` logs `COMPLIANT` for a healthy status page.
    4. Point `status_page_url` at a page you control containing the text in `outage_indicator`
       (or temporarily lower the keyword to something present on the real page) to confirm
       `alert_major_outage` fires.
    5. Enable the `hourly` trigger once the inputs reflect a real vendor you depend on.

    ## How to extend

    - Loop over a list of vendor status page URLs with `io.kestra.plugin.core.flow.ForEach` to
      watch an entire dependency list in one scheduled run.
    - Chain an AI classification task over the scraped Markdown instead of fixed keywords, for
      vendors whose status pages don't use consistent "Major Outage" / "Degraded Performance"
      wording.
    - Route `MAJOR_OUTAGE_DETECTED` to PagerDuty or Opsgenie in addition to Slack for out-of-hours
      on-call escalation.

    ## Links

    - Firecrawl scrape API reference: https://docs.firecrawl.dev/api-reference/endpoint/scrape
    - Firecrawl self-hosting guide: https://docs.firecrawl.dev/contributing/self-host
    - Slack incoming webhooks: https://api.slack.com/messaging/webhooks
  tags:
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - Incident Response
  ee: false
  demo: false
