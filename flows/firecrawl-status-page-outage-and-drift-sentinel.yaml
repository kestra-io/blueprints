id: firecrawl-status-page-outage-and-drift-sentinel
namespace: company.sre

description: |
  Continuously monitors third-party vendor status pages using the native Firecrawl plugin, extracts clean Markdown to inspect active incident and outage keywords, and dispatches actionable Slack alerts upon external service degradation.

inputs:
  - id: status_page_url
    type: STRING
    displayName: Target Status Page URL
    defaults: "https://status.openai.com"
    description: "URL of the third-party SaaS or cloud provider status page to scrape."

  - id: firecrawl_base_url
    type: STRING
    displayName: Firecrawl Base URL
    defaults: "http://localhost:3002"
    description: "Base API URL of the Firecrawl service. Supports self-hosted instances or the managed cloud endpoint."

  - id: outage_indicator
    type: STRING
    displayName: Major Outage Keyword
    defaults: "Major Outage"
    description: "Text pattern indicating complete or critical service disruption."

  - id: degradation_indicator
    type: STRING
    displayName: Degraded Performance Keyword
    defaults: "Degraded Performance"
    description: "Text pattern indicating partial service degradation or elevated error rates."

  - id: slack_channel
    type: STRING
    displayName: SRE Alert Channel
    defaults: "#sre-alerts"
    description: "Slack channel for routing vendor incident and outage alerts."

triggers:
  - id: scheduled_sentinel_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 */1 * * *"
    disabled: true
    inputs:
      status_page_url: "https://status.openai.com"
      outage_indicator: "Major Outage"
      degradation_indicator: "Degraded Performance"

tasks:
  - id: scrape_status_page
    type: io.kestra.plugin.firecrawl.Scrape
    description: "Scrapes the vendor status page and converts DOM elements into clean Markdown."
    apiKey: "{{ secret('FIRECRAWL_API_KEY') }}"
    baseUrl: "{{ inputs.firecrawl_base_url }}"
    url: "{{ inputs.status_page_url }}"
    formats:
      - "markdown"
    onlyMainContent: true

  - id: evaluate_service_health
    type: io.kestra.plugin.core.flow.Switch
    description: "Analyzes scraped Markdown content against incident keywords and branches accordingly."
    value: |
      {% if outputs.scrape_status_page.statusCode != 200 %}
      STATUS_PAGE_UNAVAILABLE
      {% elseif outputs.scrape_status_page.markdown is empty %}
      CONTENT_EXTRACTION_FAILED
      {% elseif outputs.scrape_status_page.markdown contains inputs.outage_indicator %}
      MAJOR_OUTAGE_DETECTED
      {% elseif outputs.scrape_status_page.markdown contains inputs.degradation_indicator %}
      DEGRADED_PERFORMANCE_DETECTED
      {% else %}
      COMPLIANT
      {% endif %}
    cases:
      COMPLIANT:
        - id: log_compliant_status
          type: io.kestra.plugin.core.log.Log
          level: INFO
          message: "Vendor status page at {{ inputs.status_page_url }} ('{{ outputs.scrape_status_page.title }}') is operational with no active outages or performance degradations detected."

      MAJOR_OUTAGE_DETECTED:
        - id: alert_major_outage
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          channel: "{{ inputs.slack_channel }}"
          payload: |
            {
              "attachments": [
                {
                  "color": "#D32F2F",
                  "title": "Vendor Service Outage Alert",
                  "text": "CRITICAL: Major outage detected on vendor status page `{{ inputs.status_page_url }}`.\nPage Title: `{{ outputs.scrape_status_page.title }}`\nIndicator: `{{ inputs.outage_indicator }}`\nDependent application pipelines and integrations may encounter failures.",
                  "footer": "Kestra Sentinel | External Vendor Reliability"
                }
              ]
            }
        - id: log_major_outage
          type: io.kestra.plugin.core.log.Log
          level: WARN
          message: "CRITICAL: Major outage keywords found on vendor status page {{ inputs.status_page_url }}."

      DEGRADED_PERFORMANCE_DETECTED:
        - id: alert_degraded_performance
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          channel: "{{ inputs.slack_channel }}"
          payload: |
            {
              "attachments": [
                {
                  "color": "#F57C00",
                  "title": "Vendor Degraded Performance Alert",
                  "text": "WARNING: Performance degradation reported on vendor status page `{{ inputs.status_page_url }}`.\nPage Title: `{{ outputs.scrape_status_page.title }}`\nIndicator: `{{ inputs.degradation_indicator }}`\nLatency-sensitive microservices should engage fallback circuits or throttles.",
                  "footer": "Kestra Sentinel | External Vendor Reliability"
                }
              ]
            }
        - id: log_degradation_warning
          type: io.kestra.plugin.core.log.Log
          level: WARN
          message: "WARNING: Degraded performance keywords detected on {{ inputs.status_page_url }}."

      STATUS_PAGE_UNAVAILABLE:
        - id: alert_page_offline
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          channel: "{{ inputs.slack_channel }}"
          payload: |
            {
              "attachments": [
                {
                  "color": "#E65100",
                  "title": "Vendor Status Page Unreachable",
                  "text": "WARNING: Firecrawl scrape of `{{ inputs.status_page_url }}` returned non-200 HTTP code `{{ outputs.scrape_status_page.statusCode }}`.\nVerify status page domain reachability and DNS resolution.",
                  "footer": "Kestra Sentinel | External Vendor Reliability"
                }
              ]
            }

      CONTENT_EXTRACTION_FAILED:
        - id: alert_empty_content
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          channel: "{{ inputs.slack_channel }}"
          payload: |
            {
              "attachments": [
                {
                  "color": "#757575",
                  "title": "Firecrawl Scrape Content Empty",
                  "text": "NOTICE: Firecrawl completed scrape of `{{ inputs.status_page_url }}` but extracted no Markdown content.\nCheck if page requires custom wait times or dynamic JavaScript rendering options.",
                  "footer": "Kestra Sentinel | External Vendor Reliability"
                }
              ]
            }

  - id: record_audit_log
    type: io.kestra.plugin.core.log.Log
    description: "Emits a permanent execution audit log recording status page evaluation metrics."
    level: INFO
    message: "Completed Firecrawl status page audit for {{ inputs.status_page_url }}. HTTP status code={{ outputs.scrape_status_page.statusCode }}, title='{{ outputs.scrape_status_page.title }}', document URI={{ outputs.scrape_status_page.uri }}."

extend:
  title: Firecrawl Status Page Outage and Service Disruption Sentinel
  metaTitle: Firecrawl Status Page Outage Sentinel | Kestra
  shortDescription: Scrapes third-party vendor status pages with Firecrawl, parses Markdown for active incident keywords, and dispatches Slack alerts.
  metaDescription: Scrape third-party vendor status pages with Firecrawl, detect active outages or degraded performance, and trigger automated Slack incident alerts with Kestra.
  description: |
    Continuously monitors third-party vendor status pages using the native Firecrawl plugin, extracts clean Markdown to inspect active incident and outage keywords, and dispatches actionable Slack alerts upon external service degradation.

    ## How it works

    1. A recurrent `Schedule` trigger initiates the status page surveillance workflow hourly (disabled initially for on-demand configuration).
    2. The `scrape_status_page` task uses `io.kestra.plugin.firecrawl.Scrape` to fetch the designated status page URL, strip boilerplate elements, and convert DOM content into clean Markdown.
    3. The `evaluate_service_health` task parses the returned Markdown and HTTP status code using Pebble conditionals inside a `Switch` task to classify health into `COMPLIANT`, `MAJOR_OUTAGE_DETECTED`, `DEGRADED_PERFORMANCE_DETECTED`, `STATUS_PAGE_UNAVAILABLE`, or `CONTENT_EXTRACTION_FAILED`.
    4. When outages or performance degradations are identified, contextual Slack incident alerts are dispatched via `io.kestra.plugin.slack.notifications.SlackIncomingWebhook` with matched indicators and page titles.
    5. A final `record_audit_log` task records the HTTP response code, page title, and internal document storage URI in Kestra's execution history.

    ## What you get

    - Automated surveillance over critical SaaS, API, and cloud provider availability pages.
    - Early warning when upstream dependencies experience outages before internal customer alerts spike.
    - Extraction of clean, readable Markdown from status pages without running heavy headless browser scripts.
    - Actionable Slack notifications directing engineers straight to affected service names.
    - Searchable historical audit records of third-party availability evaluations.

    ## Who it's for

    - Site Reliability Engineers (SREs) managing reliability across third-party dependencies.
    - DevOps Teams operating data pipelines dependent on external API availability.
    - Platform Engineers responsible for incident response and upstream vendor monitoring.

    ## Why orchestrate this with Kestra

    - **Declarative Vendor Monitoring**: Define target status pages, keyword rules, and notification channels in revision-controlled YAML blueprints.
    - **Native Plugin Architecture**: Leverage the official `plugin-firecrawl` task to handle web scraping, rate-limiting, and Markdown normalization out of the box.
    - **Zero Plaintext Secrets**: Protect Firecrawl API keys and Slack webhook URLs using Kestra namespace secrets via `{{ secret(...) }}`.
    - **Automated Gating**: Chain this workflow as an execution gate before running data extraction or batch processing workflows dependent on external APIs.

    ## Prerequisites

    - Access to a Firecrawl instance (either managed cloud or self-hosted open-source container).
    - A Firecrawl API key with scrape permissions.
    - A Slack Incoming Webhook URL configured with permission to post into your target operations channel.

    ### Secrets

    - `FIRECRAWL_API_KEY`: API key used to authenticate requests against the Firecrawl service.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL used for routing incident and outage notifications.

    ## Quick start

    1. Configure the `FIRECRAWL_API_KEY` and `SLACK_WEBHOOK_URL` secrets in your Kestra namespace settings.
    2. Import this blueprint into your Kestra instance under your desired namespace (e.g., `company.sre`).
    3. Click **Execute** with default parameters or provide your custom `status_page_url` and `outage_indicator`.
    4. Confirm in the **Executions** tab that Firecrawl successfully scrapes the page and emits the document URI.
    5. Enable the `scheduled_sentinel_audit` trigger to establish recurrent automated vendor status surveillance.

    ## How to extend

    - **Multi-Vendor Sweep**: Wrap the scrape task in a `ForEach` loop to evaluate an array of critical vendor status pages (e.g., payment, auth, cloud storage) in a single run.
    - **Circuit Breaker Automation**: Integrate with feature flag or routing tasks to trip internal circuit breakers automatically upon vendor outage detection.
    - **PagerDuty Escalation**: Route `MAJOR_OUTAGE_DETECTED` events directly to on-call incident response schedules in PagerDuty or Opsgenie.
    - **LLM Summary Analysis**: Add a Kestra AI task to summarize specific affected microservices and incident timelines directly from the scraped Markdown.

    ## Links

    - [Firecrawl Documentation](https://docs.firecrawl.dev/)
    - [Kestra Firecrawl Plugin Source](https://github.com/kestra-io/plugin-firecrawl)
    - [Kestra Slack Notification Plugin Documentation](https://kestra.io/plugins/plugin-slack/io.kestra.plugin.slack.notifications.slackincomingwebhook)
    - [Kestra Flow Control Switch Documentation](https://kestra.io/plugins/plugin-core/tasks/flow/io.kestra.plugin.core.flow.switch)
  tags:
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - Incident Response
  ee: false
  demo: false
