id: vault-approle-secret-id-expiration-sentinel
namespace: company.security

description: |
  Audits HashiCorp Vault AppRole secret-id expiration TTL countdowns via HTTP API,
  identifies approaching credential lockouts across automated microservice identities,
  logs an automated GitHub security remediation ticket, and alerts SecOps on Slack.

inputs:
  - id: vault_address
    type: STRING
    displayName: HashiCorp Vault Address
    defaults: "https://vault.internal.company.com:8200"

  - id: role_name
    type: STRING
    displayName: AppRole Name
    defaults: backend-api-production

  - id: secret_id_accessor
    type: STRING
    displayName: Secret ID Accessor
    defaults: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"

  - id: ttl_hours_threshold
    type: INT
    displayName: Expiration Warning Threshold (Hours)
    defaults: 72

  - id: github_repository
    type: STRING
    displayName: Target Security Remediation Repository
    defaults: my-org/security-operations

triggers:
  - id: daily_approle_hygiene_check
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 8 * * *"
    disabled: true

tasks:
  - id: probe_approle_secret_id
    type: io.kestra.plugin.scripts.python.Script
    description: Interrogates Vault AppRole API for secret-id accessor metadata and expiration TTL
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install requests kestra
    script: |
      import os
      import requests
      from kestra import Kestra

      addr = "{{ inputs.vault_address }}"
      role = "{{ inputs.role_name }}"
      accessor = "{{ inputs.secret_id_accessor }}"
      token = os.environ.get("VAULT_TOKEN")
      threshold_hours = int("{{ inputs.ttl_hours_threshold }}")

      headers = {
          "X-Vault-Token": token,
          "Content-Type": "application/json"
      }

      url = f"{addr}/v1/auth/approle/role/{role}/secret-id-accessor/lookup"
      payload = {"secret_id_accessor": accessor}

      response = requests.post(url, headers=headers, json=payload, timeout=30)
      if response.status_code != 200:
          print(f"Vault API error {response.status_code}: {response.text}")
          response.raise_for_status()

      data = response.json().get("data", {})
      secret_id_ttl = data.get("secret_id_ttl", 0)
      hours_remaining = round(secret_id_ttl / 3600.0, 1)

      is_expiring = hours_remaining <= threshold_hours
      print(f"AppRole {role} accessor {accessor}: {hours_remaining} hours remaining (Threshold: {threshold_hours}h)")

      Kestra.outputs({
          "role_name": role,
          "accessor": accessor,
          "hours_remaining": hours_remaining,
          "threshold_hours": threshold_hours,
          "is_expiring": is_expiring
      })

  - id: branch_on_expiring_secret_id
    type: io.kestra.plugin.core.flow.If
    description: Branches based on whether secret-id TTL is approaching expiration
    condition: "{{ outputs.probe_approle_secret_id.vars.is_expiring == true }}"
    then:
      - id: create_security_rotation_issue
        type: io.kestra.plugin.github.issues.Create
        description: Logs a prioritized GitHub issue tracking approaching AppRole secret-id expiration
        oauthToken: "{{ secret('GITHUB_TOKEN') }}"
        repository: "{{ inputs.github_repository }}"
        title: "[Security Alert] HashiCorp Vault AppRole Secret-ID Expiring for {{ inputs.role_name }}"
        body: |
          ## 🚨 Vault AppRole Secret-ID Expiration Warning

          Automated credential hygiene scanner detected that an AppRole secret-id is approaching its TTL limit:
          - **Vault Address:** `{{ inputs.vault_address }}`
          - **AppRole Name:** `{{ inputs.role_name }}`
          - **Secret-ID Accessor:** `{{ inputs.secret_id_accessor }}`
          - **Hours Remaining:** **{{ outputs.probe_approle_secret_id.vars.hours_remaining }}h**
          - **Warning Threshold:** `{{ inputs.ttl_hours_threshold }}h`

          Please generate and deploy a rotated secret-id before workloads lose authentication access.
          *Generated automatically by Kestra Vault AppRole Sentinel.*

      - id: alert_secops_slack
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Alerts SecOps Slack channel with hours remaining and GitHub issue hyperlink
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {{ {
            "text": "🔐 *HashiCorp Vault AppRole Expiration Warning*\n*Role:* `" ~ inputs.role_name ~ "`\n*Time Left:* *" ~ outputs.probe_approle_secret_id.vars.hours_remaining ~ " hours* (Threshold: `" ~ inputs.ttl_hours_threshold ~ "h`)\n*Rotation Ticket:* <" ~ (outputs.create_security_rotation_issue.issueUrl ?? "#") ~ "|View GitHub Issue>"
          } | toJson }}

    else:
      - id: log_secret_id_healthy
        type: io.kestra.plugin.core.log.Log
        message: "Vault AppRole {{ inputs.role_name }} secret-id has ample TTL remaining ({{ outputs.probe_approle_secret_id.vars.hours_remaining }}h > {{ inputs.ttl_hours_threshold }}h)."

  - id: log_audit_complete
    type: io.kestra.plugin.core.log.Log
    description: Final status log recording AppRole secret-id hygiene audit
    message: "Vault AppRole audit completed for {{ inputs.role_name }}. Hours remaining: {{ outputs.probe_approle_secret_id.vars.hours_remaining }}."

errors:
  - id: alert_flow_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alerts Slack when Vault API queries or issue creation encounters an error
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {{ {
        "text": "⚠️ *Vault AppRole Sentinel Failed* in execution `" ~ execution.id ~ "`. Unable to query secret-id accessor for `" ~ inputs.role_name ~ "`."
      } | toJson }}

extend:
  title: "HashiCorp Vault AppRole Secret-ID Expiration Sentinel"
  shortDescription: "Audit Vault AppRole secret-id TTL countdowns, detect approaching credential expirations, open GitHub issues, and alert Slack."
  metaTitle: "HashiCorp Vault AppRole Secret-ID Expiration Sentinel with Kestra"
  metaDescription: "Monitor HashiCorp Vault AppRole secret-id expiration with Kestra. Query accessor metadata, track GitHub rotation issues, and alert SecOps on Slack."
  description: |
    Modern cloud architectures use HashiCorp Vault's AppRole authentication engine to authenticate automated machine workloads, Kubernetes pods, and CI/CD runners. While role-id identifiers are static, secret-id tokens carry a finite time-to-live (TTL). When secret-ids expire unnoticed, automated services fail authentication, causing critical application downtime and broken deployment pipelines. This blueprint queries HashiCorp Vault's AppRole accessor metadata API daily, identifies secret-ids approaching expiration thresholds, logs a prioritized GitHub rotation ticket, and alerts SecOps teams via Slack.

    ## How it works

    1. `daily_approle_hygiene_check` (`io.kestra.plugin.core.trigger.Schedule`) initiates the audit daily at 08:00 UTC (shipped disabled for safe verification).
    2. `probe_approle_secret_id` (`io.kestra.plugin.scripts.python.Script`) interrogates the Vault REST API (`POST /v1/auth/approle/role/{role}/secret-id-accessor/lookup`) and inspects the remaining `secret_id_ttl` in seconds.
    3. `branch_on_expiring_secret_id` (`io.kestra.plugin.core.flow.If`) evaluates whether remaining hours are below the alert threshold (`is_expiring == true`):
       - `then`: Automatically files a GitHub tracking issue via `create_security_rotation_issue` (`io.kestra.plugin.github.issues.Create`) and alerts the Slack channel via `alert_secops_slack` (`io.kestra.plugin.slack.notifications.SlackIncomingWebhook`).
       - `else`: Emits an informational log entry (`log_secret_id_healthy`) confirming ample TTL remaining.
    4. `log_audit_complete` (`io.kestra.plugin.core.log.Log`) records the audit outcome.
    5. The `errors` block alerts Slack if Vault tokens expire or the cluster endpoint is unreachable.

    ## What you get

    - Automated, scheduled auditing of machine authentication credentials.
    - Zero sudden production outages caused by expired AppRole tokens.
    - Consolidated GitHub incident tickets with accessor IDs, role names, and remaining hours.
    - Real-time Slack notifications with direct ticket hyperlinks.

    ## Who it's for

    - DevSecOps and Platform Security Engineers managing enterprise Vault clusters.
    - Backend platform teams managing machine-to-machine authentication.
    - Site Reliability Engineers safeguarding credential renewal cycles.

    ## Why orchestrate this with Kestra

    Kestra coordinates external security API inspection, mathematical TTL conversion, conditional escalation, and chat alerting inside a unified, declarative pipeline. It injects Vault tokens securely, handles transient network retries, and maintains full execution audit logs without requiring custom scripts or cron daemons.

    ## Prerequisites

    - A HashiCorp Vault cluster with the `approle` auth method enabled.
    - A Vault token with `read` / `update` permissions on `auth/approle/role/+/secret-id-accessor/lookup`.
    - A GitHub Personal Access Token with repository issue creation permissions.
    - A Slack incoming webhook URL for notifications.

    ### Secrets

    - `VAULT_TOKEN`: Authentication token for querying HashiCorp Vault.
    - `GITHUB_TOKEN`: GitHub token used to open rotation issues.
    - `SLACK_WEBHOOK`: Incoming Webhook URL for security alerts.

    ## Inputs

    - `vault_address` (STRING, default `https://vault.internal.company.com:8200`): HashiCorp Vault cluster URL.
    - `role_name` (STRING, default `backend-api-production`): Name of the audited Vault AppRole.
    - `secret_id_accessor` (STRING, default `a1b2c3d4-e5f6-7890-abcd-ef1234567890`): Non-sensitive accessor ID corresponding to the target secret-id.
    - `ttl_hours_threshold` (INT, default `72`): Hours remaining threshold below which alerts are triggered.
    - `github_repository` (STRING, default `my-org/security-operations`): Target GitHub repository for logging incident issues.

    ## Outputs

    - `outputs.probe_approle_secret_id.vars.role_name`: AppRole name audited.
    - `outputs.probe_approle_secret_id.vars.hours_remaining`: Calculated hours before secret-id expiration.
    - `outputs.probe_approle_secret_id.vars.is_expiring`: Boolean indicating whether TTL breached threshold.

    ## Quick start

    1. Configure `VAULT_TOKEN`, `GITHUB_TOKEN`, and `SLACK_WEBHOOK` in your Kestra namespace.
    2. Import this flow and set `vault_address`, `role_name`, and `secret_id_accessor` to match a real AppRole credential.
    3. Run the flow manually to verify accessor lookup and Slack notification delivery.
    4. Enable the `daily_approle_hygiene_check` trigger for continuous credential hygiene monitoring.

    ## How to extend

    - Add an automated secret-id rotation task (`POST /v1/auth/approle/role/{role}/secret-id`) gated behind operator approval.
    - Loop over multiple AppRole accessor IDs across several microservices using `io.kestra.plugin.core.flow.ForEach`.
    - Route urgent alerts to PagerDuty or Opsgenie if remaining TTL drops below 24 hours.

    ## Links

    - [HashiCorp Vault AppRole API Documentation](https://developer.hashicorp.com/vault/api-docs/auth/approle)
    - [Kestra Python Script Plugin](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra GitHub Plugin](https://kestra.io/plugins/plugin-github)
    - [Kestra Slack Plugin](https://kestra.io/plugins/plugin-slack)

  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Monitoring & Alerting
  ee: false
  demo: false
