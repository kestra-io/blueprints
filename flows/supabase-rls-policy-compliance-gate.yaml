    - [plugin-supabase source (Query.java)](https://github.com/kestra-io/plugin-supabase/blob/main/src/main/java/io/kestra/plugin/supabase/Query.java)
    - [PostgreSQL pg_class catalog documentation](https://www.postgresql.org/docs/current/catalog-pg-class.html)
    - [Supabase self-hosting with Docker](https://supabase.com/docs/guides/self-hosting/docker)
    - [Supabase production readiness - RLS checklist](https://supabase.com/docs/guides/deployment/going-into-prod)
    - [Kestra secrets (OSS vs Enterprise)](https://kestra.io/docs/concepts/secret)
