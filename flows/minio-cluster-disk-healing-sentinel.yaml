id: minio-cluster-disk-healing-sentinel
namespace: company.storage

description: |
  Audits MinIO distributed object storage cluster health and drive status via metrics endpoint.
  Alerts infrastructure teams on Slack when offline drives or background healing backlogs threaten quorum.

concurrency:
  limit: 1

inputs:
  - id: minio_metrics_endpoint
    type: STRING
    displayName: MinIO Metrics Endpoint
    defaults: "http://minio.internal:9000/minio/v2/metrics/cluster"
    description: Internal cluster metrics endpoint URL for MinIO distributed storage.

  - id: max_offline_drives_threshold
    type: INT
    displayName: Max Offline Drives Threshold
    defaults: 1
    description: Maximum tolerable count of offline storage drives before triggering critical alert.

  - id: slack_channel
    type: STRING
    displayName: Slack Channel
    defaults: "#storage-sre-alerts"
    description: Slack channel destination for MinIO storage cluster health alerts.

triggers:
  - id: periodic_storage_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: Executes automated MinIO distributed cluster drive audits every 10 minutes.
    cron: "*/10 * * * *"

tasks:
  - id: audit_minio_cluster_health
    type: io.kestra.plugin.scripts.python.Script
    description: Interrogates MinIO cluster metrics endpoint to audit online drives, healing queues, and storage nodes.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests kestra
    env:
      METRICS_URL: "{{ inputs.minio_metrics_endpoint }}"
      MINIO_USER: "{{ secret('MINIO_ROOT_USER') }}"
      MINIO_PASSWORD: "{{ secret('MINIO_ROOT_PASSWORD') }}"
      MAX_OFFLINE: "{{ inputs.max_offline_drives_threshold }}"
    script: |
      import os
      import sys
      import json
      import requests
      from kestra import Kestra

      endpoint = os.getenv('METRICS_URL', 'http://minio.internal:9000/minio/v2/metrics/cluster').strip()
      user = os.getenv('MINIO_USER')
      password = os.getenv('MINIO_PASSWORD')
      max_offline = int(os.getenv('MAX_OFFLINE', 1))

      print(f"Scraping MinIO cluster metrics from {endpoint}...")
      auth = (user, password) if user and password else None

      try:
          resp = requests.get(endpoint, auth=auth, timeout=15)
          resp.raise_for_status()
          raw_text = resp.text
      except Exception as e:
          print(f"ERROR: Failed to fetch MinIO metrics from {endpoint}: {e}", file=sys.stderr)
          sys.exit(1)

      total_drives = 0
      offline_drives = 0
      healing_drives = 0

      for line in raw_text.splitlines():
          line = line.strip()
          if line.startswith("#") or not line:
              continue
          if line.startswith('minio_cluster_drive_offline_total'):
              offline_drives = int(float(line.split()[-1]))
          elif line.startswith('minio_cluster_drive_total'):
              total_drives = int(float(line.split()[-1]))
          elif line.startswith('minio_heal_objects_total'):
              healing_drives = int(float(line.split()[-1]))

      has_drive_incident = offline_drives >= max_offline
      print(f"MinIO Cluster: Total Drives={total_drives}, Offline={offline_drives}, Healing={healing_drives}, Incident={has_drive_incident}")

      Kestra.outputs({
          'total_drives': total_drives,
          'offline_drives': offline_drives,
          'healing_objects': healing_drives,
          'offline_threshold': max_offline,
          'has_drive_incident': has_drive_incident
      })

      report = {
          'endpoint': endpoint,
          'total_drives': total_drives,
          'offline_drives': offline_drives,
          'healing_objects': healing_drives,
          'threshold': max_offline,
          'has_incident': has_drive_incident
      }

      with open('minio_health_report.json', 'w') as f:
          json.dump(report, f, indent=2)

    outputFiles:
      - minio_health_report.json

  - id: evaluate_storage_quorum
    type: io.kestra.plugin.core.flow.If
    description: Evaluates whether offline drive counts exceed safe parity thresholds.
    condition: "{{ outputs.audit_minio_cluster_health.vars.has_drive_incident }}"
    then:
      - id: notify_slack_storage_incident
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches high-urgency storage cluster degradation alert to infrastructure team on Slack.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "{{ inputs.slack_channel }}",
            "text": "CRITICAL: MinIO Distributed Storage Drive Incident!\nEndpoint: {{ inputs.minio_metrics_endpoint }}\nOffline Drives: {{ outputs.audit_minio_cluster_health.vars.offline_drives }} (Threshold: {{ inputs.max_offline_drives_threshold }})\nTotal Drives: {{ outputs.audit_minio_cluster_health.vars.total_drives }}\nActive Healing Objects: {{ outputs.audit_minio_cluster_health.vars.healing_objects }}\nQuorum parity at risk. Review storage hardware immediately."
          }
    else:
      - id: log_storage_healthy
        type: io.kestra.plugin.core.log.Log
        description: Records informational operational telemetry confirming storage drives operate within safe thresholds.
        message: "MinIO distributed storage cluster is healthy: {{ outputs.audit_minio_cluster_health.vars.offline_drives }} offline drives of {{ outputs.audit_minio_cluster_health.vars.total_drives }} total drives."

  - id: export_storage_manifest
    type: io.kestra.plugin.core.execution.Labels
    labels:
      cluster_endpoint: "{{ inputs.minio_metrics_endpoint }}"
      offline_drives: "{{ outputs.audit_minio_cluster_health.vars.offline_drives | string }}"
      health_status: "{{ outputs.audit_minio_cluster_health.vars.has_drive_incident ? 'DEGRADED' : 'HEALTHY' }}"

outputs:
  - id: total_drives
    type: INT
    value: "{{ outputs.audit_minio_cluster_health.vars.total_drives }}"
  - id: offline_drives
    type: INT
    value: "{{ outputs.audit_minio_cluster_health.vars.offline_drives }}"
  - id: healing_objects
    type: INT
    value: "{{ outputs.audit_minio_cluster_health.vars.healing_objects }}"
  - id: has_drive_incident
    type: BOOLEAN
    value: "{{ outputs.audit_minio_cluster_health.vars.has_drive_incident }}"

extend:
  title: MinIO Cluster Disk Healing and Storage Quorum Sentinel
  metaTitle: MinIO Cluster Disk Healing Sentinel Blueprint
  shortDescription: Audits MinIO distributed storage cluster health to alert on offline drives and parity loss.
  metaDescription: Audits MinIO distributed object storage cluster health and drive status via metrics endpoint. Alerts infrastructure teams on Slack when offline drives or healing backlogs threaten quorum.
  description: |
    Audits MinIO distributed object storage cluster health and drive status via metrics endpoint. Alerts infrastructure teams on Slack when offline drives or healing backlogs threaten quorum.
  tags:
    - Data
    - Infrastructure
