id: aegisloop-evidence-gated-recovery
namespace: company.infrastructure
description: >-
  Evidence-first service incident triage with optional local-model advisory and a
  explicit human approval gate before a tightly allowlisted loopback recovery gateway call, with a dry-run-only approval test mode.
labels:
  project: aegisloop
  safety: human-approved
inputs:
  - id: service_url
    type: STRING
    defaults: http://127.0.0.1:8765/health
    description: Trusted HTTP(S) health endpoint to probe. Use a service you own or are authorized to test.
  - id: ai_endpoint
    type: STRING
    defaults: disabled
    description: Optional local OpenAI-compatible base URL, for example http://127.0.0.1:8081. Leave as disabled to turn off AI.
  - id: ai_model
    type: STRING
    defaults: local-model
    description: Model name served by the local OpenAI-compatible endpoint.
  - id: recovery_url
    type: STRING
    defaults: http://127.0.0.1:8765/recover
    description: Recovery gateway URL; executor enforces loopback HTTP only.
  - id: dry_run
    type: BOOL
    defaults: true
    description: Safe default. When true, no recovery request is sent.
  - id: approval_test_mode
    type: BOOL
    defaults: false
    description: Test the human approval gate while dry_run remains true. Never enables recovery by itself.
  - id: timeout_seconds
    type: INT
    defaults: 3
    description: HTTP probe timeout in seconds (1–10).
  - id: runbook_repository
    type: STRING
    defaults: https://github.com/kestra-io/blueprints
    description: Public Git repository to search for operational guidance during an incident. Replace with your organization's runbook repository when available.
triggers:
  - id: periodic_health_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: Periodic read-only health audit. Disable or adjust the schedule before production use.
    cron: "*/30 * * * *"
tasks:
  - id: probe_service
    type: io.kestra.plugin.scripts.python.Script
    description: Perform a real bounded HTTP GET and publish observed status and latency. No recovery action occurs here.
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    outputFiles:
      - probe.json
    script: |
      import json, time, urllib.error, urllib.parse, urllib.request
      from pathlib import Path
      url = r"""{{ inputs.service_url }}"""
      timeout = int({{ inputs.timeout_seconds }})
      parsed = urllib.parse.urlparse(url)
      if parsed.scheme not in ("http", "https") or not parsed.hostname or parsed.username or parsed.password:
          raise ValueError("service_url must be a credential-free absolute HTTP(S) URL")
      if not 1 <= timeout <= 10:
          raise ValueError("timeout_seconds must be between 1 and 10")
      start = time.monotonic()
      request = urllib.request.Request(url, headers={"User-Agent": "AegisLoop/0.1", "Accept": "application/json,text/plain,*/*"}, method="GET")
      try:
          with urllib.request.urlopen(request, timeout=timeout) as response:
              body = response.read(65536)
              code = int(response.status)
              reachable = 200 <= code < 300
              detail = "HTTP response received" if reachable else "HTTP status %s" % code
      except urllib.error.HTTPError as exc:
          code, reachable, body, detail = int(exc.code), False, b"", "HTTP status %s" % exc.code
      except (urllib.error.URLError, TimeoutError, OSError) as exc:
          code, reachable, body, detail = None, False, b"", "Connection failure: %s" % type(exc).__name__
      result = {"url": url, "reachable": reachable, "status_code": code, "latency_ms": int((time.monotonic()-start)*1000), "detail": detail, "body_excerpt": body[:512].decode("utf-8", "replace")}
      Path("probe.json").write_text(json.dumps(result, indent=2), encoding="utf-8")
      print("::" + json.dumps({"outputs": result}, separators=(",", ":")) + "::")
  - id: diagnose_and_plan
    type: io.kestra.plugin.scripts.python.Script
    description: Deterministic rules own severity and action selection; an optional local AI model may add explanation only.
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    inputFiles:
      probe.json: "{{ outputs.probe_service.outputFiles['probe.json'] }}"
    outputFiles:
      - incident-report.json
    script: |
      import json, time, urllib.parse, urllib.request
      from pathlib import Path
      probe = json.loads(Path("probe.json").read_text(encoding="utf-8"))
      ai_endpoint = r"""{{ inputs.ai_endpoint }}""".strip()
      ai_model = r"""{{ inputs.ai_model }}""".strip() or "local-model"
      if not probe["reachable"]:
          severity, cause, action = "critical", "health_endpoint_unavailable", "restart_demo_service"
      elif int(probe["latency_ms"]) >= 1500:
          severity, cause, action = "warning", "health_endpoint_slow", "clear_demo_cache"
      else:
          severity, cause, action = "healthy", "no_action_required", None
      allowed = ["clear_demo_cache", "restart_demo_service"]
      diagnosis = {"severity": severity, "probable_cause": cause, "proposed_action": action,
                   "evidence": {k: probe.get(k) for k in ("reachable", "status_code", "latency_ms", "detail")},
                   "policy": {"version": "1.0.0", "decision_source": "deterministic", "action_allowlisted": action in allowed if action else True},
                   "execution_allowed": False, "recovery_verified": False}
      ai = {"enabled": False, "status": "disabled", "advisory": None}
      if ai_endpoint and ai_endpoint.lower() not in ("disabled", "none"):
          parsed = urllib.parse.urlparse(ai_endpoint)
          if parsed.scheme != "http" or parsed.hostname not in ("127.0.0.1", "localhost", "::1") or parsed.username or parsed.password:
              ai = {"enabled": True, "status": "rejected_non_loopback_endpoint", "advisory": None}
          else:
              try:
                  payload = {"model": ai_model, "temperature": 0, "messages": [
                    {"role": "system", "content": "Explain the evidence briefly. Advisory only: do not recommend commands, change policy, or claim recovery."},
                    {"role": "user", "content": json.dumps(diagnosis, sort_keys=True)}]}
                  req = urllib.request.Request(ai_endpoint.rstrip("/") + "/v1/chat/completions", data=json.dumps(payload).encode(), headers={"Content-Type": "application/json"}, method="POST")
                  with urllib.request.urlopen(req, timeout=4) as resp: data = json.loads(resp.read(65536).decode())
                  advisory = data.get("choices", [{}])[0].get("message", {}).get("content", "")
                  ai = {"enabled": True, "status": "ok", "advisory": advisory[:2000] if isinstance(advisory, str) else None}
              except Exception as exc:
                  ai = {"enabled": True, "status": "unavailable:%s" % type(exc).__name__, "advisory": None}
      report = {"schema_version": "1.0", "incident": diagnosis, "ai_advisory": ai,
                "approval": {"required": action is not None, "approved": False, "note": "Kestra execution must be manually resumed before the executor task can run."},
                "safety": {"dry_run_default": True, "action_execution_enabled": False, "allowed_actions": allowed, "max_attempts": 1}}
      Path("incident-report.json").write_text(json.dumps(report, indent=2, sort_keys=True), encoding="utf-8")
      print("::" + json.dumps({"outputs": {"severity": severity, "probable_cause": cause, "proposed_action": action, "report": report, "ai_status": ai["status"]}}, separators=(",", ":")) + "::")
  - id: route_by_policy
    type: io.kestra.plugin.core.flow.If
    description: Allowlist-selected incidents reach approval only when recovery is explicitly enabled, or when approval_test_mode is enabled for a dry-run-only test.
    condition: "{{ outputs.diagnose_and_plan.vars.proposed_action != null and (inputs.dry_run == false or inputs.approval_test_mode == true) }}"
    then:
      - id: enrich_with_runbook_context
        type: io.kestra.plugin.core.flow.WorkingDirectory
        description: Clone a version-controlled guidance repository and extract relevant incident context before asking for approval.
        tasks:
          - id: clone_incident_runbooks
            type: io.kestra.plugin.git.Clone
            url: "{{ inputs.runbook_repository }}"
            branch: main
            directory: runbooks
          - id: search_runbook_guidance
            type: io.kestra.plugin.scripts.python.Script
            description: Search cloned Markdown guidance for incident-related terms; this is advisory context and never changes policy.
            taskRunner:
              type: io.kestra.plugin.core.runner.Process
            outputFiles:
              - runbook-context.json
            script: |
              import json
              from pathlib import Path
              root = Path("runbooks")
              cause = r"""{{ outputs.diagnose_and_plan.vars.probable_cause }}""".strip().lower()
              terms = {"incident", "health", "recovery", "runbook"} | {part for part in cause.replace("_", " ").split() if len(part) > 3}
              matches = []
              files_scanned = 0
              for path in root.rglob("*.md"):
                  if ".git" in path.parts:
                      continue
                  files_scanned += 1
                  try:
                      lines = path.read_text(encoding="utf-8", errors="replace").splitlines()
                  except OSError:
                      continue
                  for number, line in enumerate(lines, 1):
                      if any(term in line.lower() for term in terms):
                          matches.append({"file": str(path.relative_to(root)), "line": number, "text": line[:400]})
                          if len(matches) >= 20:
                              break
                  if len(matches) >= 20:
                      break
              result = {"probable_cause": cause, "repository": r"""{{ inputs.runbook_repository }}""", "files_scanned": files_scanned, "matches": matches, "advisory_only": True}
              Path("runbook-context.json").write_text(json.dumps(result, indent=2), encoding="utf-8")
              print("::" + json.dumps({"outputs": {"files_scanned": files_scanned, "matches_found": len(matches), "advisory_only": True}}, separators=(",", ":")) + "::")
      - id: human_approval
        type: io.kestra.plugin.core.flow.Pause
        description: Review the incident-report.json artifact and explicitly approve or deny before continuing.
        onResume:
          - id: approved
            type: BOOL
            defaults: false
      - id: approval_gate
        type: io.kestra.plugin.core.flow.If
        description: Continue only when the human explicitly submitted approved=true in the Pause onResume form.
        condition: "{{ outputs.human_approval.onResume.approved == true }}"
        then:
          - id: execute_bounded_recovery
            type: io.kestra.plugin.scripts.python.Script
            description: Post only an allowlisted action to a loopback HTTP recovery gateway after manual resume. No shell commands or remote hosts are permitted.
            taskRunner:
              type: io.kestra.plugin.core.runner.Process
            outputFiles:
              - recovery-result.json
            script: |
              import json, urllib.parse, urllib.request
              from pathlib import Path
              action = r"""{{ outputs.diagnose_and_plan.vars.proposed_action }}"""
              url = r"""{{ inputs.recovery_url }}"""
              dry_run = r"""{{ inputs.dry_run }}""".strip().lower() == "true"
              approved = r"""{{ outputs.human_approval.onResume.approved }}""".strip().lower() == "true"
              allowed = {"restart_demo_service", "clear_demo_cache"}
              parsed = urllib.parse.urlparse(url)
              if action not in allowed:
                  raise ValueError("Action is not allowlisted")
              if not approved:
                  raise ValueError("Explicit human approval is required")
              if parsed.scheme != "http" or parsed.hostname not in {"127.0.0.1", "localhost", "::1"} or parsed.username or parsed.password:
                  raise ValueError("Recovery gateway must be credential-free loopback HTTP")
              if dry_run:
                  result = {"status": "dry_run", "executed": False, "action": action}
              else:
                  request = urllib.request.Request(url, data=json.dumps({"action": action, "approval": "explicit-human-approved", "execution_id": r"""{{ execution.id }}"""}).encode(), headers={"Content-Type": "application/json", "User-Agent": "AegisLoop/0.1"}, method="POST")
                  try:
                      with urllib.request.urlopen(request, timeout=3) as response:
                          body = response.read(65536)
                          result = {"status": "submitted", "executed": True, "action": action, "http_status": int(response.status), "gateway_response": json.loads(body.decode()) if body else {}}
                  except Exception as exc:
                      result = {"status": "failed", "executed": False, "action": action, "error_type": type(exc).__name__}
              Path("recovery-result.json").write_text(json.dumps(result, indent=2), encoding="utf-8")
              print("::" + json.dumps({"outputs": result}, separators=(",", ":")) + "::")
          - id: verify_recovery_submission
            type: io.kestra.plugin.core.flow.If
            description: Only probe again when the gateway reports that an action was actually submitted.
            condition: "{{ outputs.execute_bounded_recovery.vars.executed == true }}"
            then:
              - id: verify_recovery
                type: io.kestra.plugin.scripts.python.Script
                description: Independently re-probe the same health endpoint after the action; this is the only evidence allowed to mark recovery healthy.
                taskRunner:
                  type: io.kestra.plugin.core.runner.Process
                outputFiles:
                  - verification.json
                script: |
                  import json, time, urllib.error, urllib.parse, urllib.request
                  from pathlib import Path
                  url = r"""{{ inputs.service_url }}"""
                  parsed = urllib.parse.urlparse(url)
                  if parsed.scheme not in ("http", "https") or not parsed.hostname or parsed.username or parsed.password:
                      raise ValueError("service_url must be a credential-free absolute HTTP(S) URL")
                  started = time.monotonic()
                  req = urllib.request.Request(url, headers={"User-Agent": "AegisLoop/0.1", "Accept": "application/json,text/plain,*/*"}, method="GET")
                  try:
                      with urllib.request.urlopen(req, timeout=3) as response:
                          code, body = int(response.status), response.read(65536)
                          reachable = 200 <= code < 300
                          detail = "independent post-action HTTP response received" if reachable else "post-action HTTP status %s" % code
                  except urllib.error.HTTPError as exc:
                      code, body, reachable, detail = int(exc.code), b"", False, "post-action HTTP status %s" % exc.code
                  except (urllib.error.URLError, TimeoutError, OSError) as exc:
                      code, body, reachable, detail = None, b"", False, "post-action connection failure: %s" % type(exc).__name__
                  result = {"reachable": reachable, "status_code": code, "latency_ms": int((time.monotonic()-started)*1000), "detail": detail, "recovery_verified": bool(reachable)}
                  Path("verification.json").write_text(json.dumps(result, indent=2), encoding="utf-8")
                  print("::" + json.dumps({"outputs": result}, separators=(",", ":")) + "::")
              - id: verification_gate
                type: io.kestra.plugin.core.flow.If
                description: Report success only when the independent post-action probe returns a 2xx response.
                condition: "{{ outputs.verify_recovery.vars.reachable == true }}"
                then:
                  - id: recovery_verified_log
                    type: io.kestra.plugin.core.log.Log
                    message: "RECOVERY_VERIFIED: independent health probe returned HTTP {{ outputs.verify_recovery.vars.status_code }}. Inspect verification.json for evidence."
                else:
                  - id: recovery_unverified_log
                    type: io.kestra.plugin.core.log.Log
                    message: "RECOVERY_UNVERIFIED: the recovery request was submitted but the independent health probe did not confirm health. Escalate; do not retry automatically."
            else:
              - id: recovery_not_submitted_log
                type: io.kestra.plugin.core.log.Log
                message: "Recovery was not submitted; no recovery verification is claimed. Inspect recovery-result.json."
        else:
          - id: approval_denied
            type: io.kestra.plugin.core.log.Log
            message: "APPROVAL_DENIED: recovery was not authorized; no recovery request was sent."
    else:
      - id: no_action_or_dry_run
        type: io.kestra.plugin.core.log.Log
        message: "No recovery request sent. Severity={{ outputs.diagnose_and_plan.vars.severity }}, proposed_action={{ outputs.diagnose_and_plan.vars.proposed_action }}, dry_run={{ inputs.dry_run }}. Inspect incident-report.json in the preceding task artifacts."
  - id: final_evidence
    type: io.kestra.plugin.core.log.Log
    description: Summarize the final policy decision without claiming recovery unless the recovery gateway explicitly confirms it.
    message: "AegisLoop decision recorded. severity={{ outputs.diagnose_and_plan.vars.severity }}, AI={{ outputs.diagnose_and_plan.vars.ai_status }}. See task artifacts for evidence."
extend:
  title: AegisLoop Evidence-Gated Infrastructure Recovery
  metaTitle: AegisLoop | Evidence-Gated Recovery with Kestra
  shortDescription: Assess service health, retrieve Git-based runbook guidance, and gate recovery behind explicit human approval.
  metaDescription: Use Kestra to assess incidents, retrieve Git runbooks, require human approval, and safely test recovery in dry-run mode.
  description: |
    AegisLoop orchestrates evidence-driven incident assessment and controlled
    infrastructure recovery. It combines service health probes, deterministic
    policy, Git-based runbook context, explicit human approval, bounded recovery
    actions, and evidence artifacts. Dry-run is enabled by default.

    ## How it works
    1. A schedule triggers a read-only HTTP health probe.
    2. A Python task evaluates status and latency and selects a deterministic action.
    3. Git clones the configured runbook repository and searches Markdown for advisory context.
    4. A human explicitly approves or rejects the proposed action.
    5. The bounded executor checks approval and the allowlisted action. Dry-run sends no recovery request.
    6. If an action is submitted, an independent health probe checks the result.

    ## What you get
    - Health and incident decision evidence.
    - Git-based runbook context.
    - Explicit human approval.
    - Dry-run evidence with executed=false.
    - Independent verification before recovery success is claimed.

    ## Who it's for
    - Platform and SRE teams.
    - Infrastructure automation engineers.
    - Teams building auditable incident response.

    ## Why orchestrate this with Kestra
    Kestra makes the workflow sequence, branches, pause/resume approval, outputs, and execution history visible.

    ## Prerequisites
    - Kestra with Python Script and Git plugins available.
    - Network access to the configured Git repository.
    - An authorized service health endpoint.
    - A controlled recovery gateway only if real recovery is separately configured and validated.

    ### Secrets
    The default local dry-run requires no secrets. For authenticated services, use Kestra secrets and never hardcode credentials.

    ## Quick start
    1. Import this YAML into a test namespace.
    2. Keep dry_run=true and ai_endpoint=disabled.
    3. Configure an authorized test health endpoint.
    4. Test rejection and confirm no recovery request is sent.
    5. Test approved dry-run and confirm status=dry_run and executed=false.
    6. Review logs and artifacts.

    ## How to extend
    Add approved notifications, a least-privilege recovery gateway, integration tests, and an organization-owned runbook repository.

    ## Links
    - https://github.com/kestra-io/blueprints
    - https://kestra.io/plugins/plugin-git
    - https://kestra.io/plugins/plugin-script-python
    - https://kestra.io/docs/workflow-components/flow
  tags:
    - Infrastructure
  subTags:
    - Incident Response
    - Approval Gates
    - Infrastructure Automation
  ee: false
  demo: false
