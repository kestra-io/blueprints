id: terraform-module-registry-release-lakehouse-loader
namespace: company.analytics
description: Ingests infrastructure-as-code modules, download telemetry, verification badges, and provider namespaces from Terraform Registry API into DuckDB, exports Parquet and analytics datasets, and manages sync state with Kestra KV store.

inputs:
  - id: limit
    type: INT
    description: Number of Terraform modules to fetch per sync run.
    defaults: 50

  - id: state_key
    type: STRING
    description: Kestra KV store key tracking processed Terraform module identifiers.
    defaults: terraform_registry_modules_state

variables:
  default_state: "[]"

triggers:
  - id: weekly_terraform_sync
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 9 * * 4"

tasks:
  - id: get_current_state
    type: io.kestra.plugin.core.kv.Get
    key: "{{ inputs.state_key }}"
    errorOnMissing: false

  - id: ingest_and_transform_modules
    type: io.kestra.plugin.scripts.python.Commands
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install requests duckdb
    commands:
      - |
        python3 - << 'PYEOF'
        import os
        import json
        import requests
        import duckdb
        from datetime import datetime, timezone

        raw_state = """{{ outputs.get_current_state.value ?? vars.default_state }}"""
        try:
            seen_ids = set(json.loads(raw_state))
        except Exception:
            seen_ids = set()

        url = "https://registry.terraform.io/v1/modules"
        headers = {"User-Agent": "KestraLakehouseLoader/1.0 (kestra-data-pipeline; contact@company.internal)"}
        params = {"limit": {{ inputs.limit }}}

        resp = requests.get(url, headers=headers, params=params, timeout=30)
        resp.raise_for_status()
        data = resp.json()
        modules = data.get("modules", [])

        records = []
        now_iso = datetime.now(timezone.utc).isoformat()
        current_module_ids = []

        for m in modules:
            module_id = m.get("id", "UNKNOWN")
            current_module_ids.append(module_id)
            namespace = m.get("namespace", "UNKNOWN")
            name = m.get("name", "UNKNOWN")
            provider = m.get("provider", "UNKNOWN")
            version = m.get("version", "UNKNOWN")
            description = m.get("description", "No description provided")
            downloads = m.get("downloads", 0)
            verified = bool(m.get("verified", False))
            published_at = m.get("published_at", "UNKNOWN")

            records.append({
                "module_id": str(module_id),
                "namespace": str(namespace),
                "name": str(name),
                "provider": str(provider),
                "version": str(version),
                "description": str(description),
                "downloads": int(downloads if str(downloads).isdigit() else 0),
                "verified": verified,
                "published_at": str(published_at),
                "is_new": bool(module_id not in seen_ids),
                "ingestion_timestamp": now_iso
            })

        con = duckdb.connect(database=":memory:")
        con.execute("""
            CREATE TABLE terraform_modules (
                module_id VARCHAR,
                namespace VARCHAR,
                name VARCHAR,
                provider VARCHAR,
                version VARCHAR,
                description VARCHAR,
                downloads BIGINT,
                verified BOOLEAN,
                published_at VARCHAR,
                is_new BOOLEAN,
                ingestion_timestamp VARCHAR
            );
        """)

        if records:
            con.execute("INSERT INTO terraform_modules SELECT * FROM read_json_auto(?)", [json.dumps(records)])

        con.execute("COPY terraform_modules TO 'terraform_modules.parquet' (FORMAT PARQUET, COMPRESSION ZSTD);")
        con.execute("""
            COPY (
                SELECT
                    provider,
                    COUNT(*) AS module_count,
                    SUM(downloads) AS total_downloads,
                    AVG(downloads) AS avg_downloads
                FROM terraform_modules
                GROUP BY 1
                ORDER BY total_downloads DESC
            ) TO 'modules_summary_by_provider.csv' (HEADER, DELIMITER ',');
        """)

        new_count = con.execute("SELECT count(*) FROM terraform_modules WHERE is_new = true").fetchone()[0]
        total_count = con.execute("SELECT count(*) FROM terraform_modules").fetchone()[0]

        updated_ids = list(seen_ids.union(current_module_ids))
        with open("updated_state.json", "w") as f:
            json.dump(updated_ids, f)

        metrics = {
            "total_extracted": total_count,
            "new_modules": new_count,
            "synced_at": now_iso
        }
        with open("metrics.json", "w") as f:
            json.dump(metrics, f)

        print(f"Lakehouse sync complete. Processed {total_count} Terraform modules ({new_count} newly observed).")
        PYEOF
    outputFiles:
      - terraform_modules.parquet
      - modules_summary_by_provider.csv
      - updated_state.json
      - metrics.json

  - id: update_state
    type: io.kestra.plugin.core.kv.Set
    key: "{{ inputs.state_key }}"
    value: "{{ read(outputs.ingest_and_transform_modules.outputFiles['updated_state.json']) }}"

  - id: analyze_and_notify
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.ingest_and_transform_modules.outputFiles['terraform_modules.parquet'] != null }}"
    then:
      - id: log_metrics
        type: io.kestra.plugin.core.log.Log
        message: "Terraform Module Registry sync succeeded. Metrics: {{ read(outputs.ingest_and_transform_modules.outputFiles['metrics.json']) }}"
