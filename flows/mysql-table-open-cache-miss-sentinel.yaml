id: mysql-table-open-cache-miss-sentinel
namespace: company.dataops

inputs:
  - id: mysql_host
    type: STRING
    defaults: mysql.internal
    description: Hostname of the MySQL database instance.
  - id: mysql_port
    type: INT
    defaults: 3306
    description: TCP port of the MySQL database instance.
  - id: mysql_database
    type: STRING
    defaults: mysql
    description: Database name to connect to.
  - id: mysql_username
    type: STRING
    defaults: kestra_monitor
    description: MySQL monitoring username.
  - id: max_opened_tables_threshold
    type: INT
    defaults: 5000
    description: Maximum permissible opened tables count before warning of table cache undersizing.

tasks:
  - id: query_table_cache_metrics
    type: io.kestra.plugin.jdbc.mysql.Query
    url: "jdbc:mysql://{{ inputs.mysql_host }}:{{ inputs.mysql_port }}/{{ inputs.mysql_database }}"
    username: "{{ inputs.mysql_username }}"
    password: "{{ secret('MYSQL_PASSWORD') }}"
    sql: |
      SELECT 
        VARIABLE_NAME, 
        CAST(VARIABLE_VALUE AS UNSIGNED) AS METRIC_VALUE 
      FROM performance_schema.global_status 
      WHERE VARIABLE_NAME IN ('Opened_tables', 'Open_tables');
    fetchType: FETCH

  - id: evaluate_table_cache_efficiency
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.query_table_cache_metrics.rows[1].METRIC_VALUE > inputs.max_opened_tables_threshold }}"
    then:
      - id: alert_dba_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "text": ":warning: *MySQL Table Cache Miss Alert*: Database {{ inputs.mysql_host }} reported {{ outputs.query_table_cache_metrics.rows[1].METRIC_VALUE }} opened tables. Frequent table opens indicate `table_open_cache` is undersized, increasing OS file descriptor open/close overhead."
          }

errors:
  - id: notify_sentinel_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "text": ":warning: *MySQL Sentinel Execution Failure*: Failed to query table cache status on {{ inputs.mysql_host }}."
      }

triggers:
  - id: daily_table_cache_check
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 5 * * *"
    disabled: true

extend:
  title: MySQL Table Open Cache Miss Ratio and File Descriptor Sentinel
  shortDescription: Audits MySQL table open cache metrics to prevent excessive table reopenings and file descriptor overhead.
  description: |
    ## How it works
    This sentinel connects to MySQL using the JDBC plugin to query `Opened_tables` and `Open_tables` against `performance_schema.global_status`. It flags abnormal table reopening rates caused by an undersized `table_open_cache`, which forces MySQL to repeatedly open and close file descriptors.

    ## What you get
    - Continuous validation of table cache sizing across schema migrations.
    - Early warning against operating system file descriptor exhaustion.
    - Actionable recommendations to resize `table_open_cache` and `table_open_cache_instances`.

    ## Who it's for
    - Database administrators managing multi-table and multi-tenant MySQL schemas.
    - SREs optimizing operating system file handle utilization.

    ## Why orchestrate this with Kestra
    Kestra runs automated scheduled database health checks with fine-grained error management and notification routing.

    ## Prerequisites
    - MySQL database instance with `performance_schema` accessible.
    - Secrets `MYSQL_PASSWORD` and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import this blueprint into Kestra.
    2. Configure database host, port, and credentials.
    3. Run manually to evaluate current opened table counts.

    ## How to extend
    - Inspect `open_files_limit` alongside table open cache to prevent OS file limit errors.
    - Query `table_open_cache_instances` to verify cache partitioning across CPU cores.
    - Forward metrics to Prometheus or Grafana.

    ## Links
    - [Kestra MySQL Plugin](https://kestra.io/plugins/plugin-jdbc-mysql)
    - [MySQL Table Cache Documentation](https://dev.mysql.com/doc/refman/8.0/en/table-cache.html)
  tags:
    - Data
    - Infrastructure
  subTags:
    - Monitoring & Alerting
  ee: false
  demo: false
