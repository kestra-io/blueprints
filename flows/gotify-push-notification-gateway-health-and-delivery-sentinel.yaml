id: gotify-push-notification-gateway-health-and-delivery-sentinel
namespace: company.platform

description: "Continuously audits Gotify push notification gateway health and API availability, monitors registered client application tokens, alerts via Slack, and prevents mobile incident delivery disruption."

inputs:
  - id: gotify_host
    type: STRING
    defaults: "localhost"
    description: "Hostname or IP address of the Gotify notification server."

  - id: gotify_port
    type: INT
    defaults: 8080
    description: "HTTP port for Gotify REST API service (default: 8080)."

  - id: dry_run
    type: BOOLEAN
    defaults: true
    description: "Safety gate: when true, audits gateway status and logs diagnostic metrics without mutating message queues or application credentials."

  - id: slack_channel
    type: STRING
    defaults: "#devops-alerts"
    description: "Target Slack channel for Gotify gateway outages and application delivery warnings."

triggers:
  - id: periodic_gotify_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

tasks:
  - id: probe_gateway_health
    type: io.kestra.plugin.core.http.Request
    description: "Polls Gotify /health endpoint to verify daemon runtime health and internal SQLite database accessibility."
    uri: "http://{{ inputs.gotify_host }}:{{ inputs.gotify_port }}/health"
    method: GET
    options:
      timeout: PT15S

  - id: probe_gateway_version
    type: io.kestra.plugin.core.http.Request
    description: "Queries /version endpoint to retrieve running build metadata and confirm HTTP REST service responsiveness."
    uri: "http://{{ inputs.gotify_host }}:{{ inputs.gotify_port }}/version"
    method: GET
    options:
      timeout: PT15S

  - id: probe_application_catalog
    type: io.kestra.plugin.core.http.Request
    description: "Queries /application endpoint using administrator client token to inspect registered push notification applications."
    uri: "http://{{ inputs.gotify_host }}:{{ inputs.gotify_port }}/application"
    method: GET
    options:
      timeout: PT15S
    headers:
      X-Gotify-Key: "{{ secret('GOTIFY_CLIENT_TOKEN') }}"

  - id: classify_gateway_status
    type: io.kestra.plugin.core.flow.Switch
    description: "Categorizes Gotify gateway health into GATEWAY_UNHEALTHY, EMPTY_APPLICATION_CATALOG, or HEALTHY."
    value: >-
      {% if outputs.probe_gateway_health.code != 200 or not ('"health":"green"' in outputs.probe_gateway_health.body) %}
      GATEWAY_UNHEALTHY
      {% elif outputs.probe_application_catalog.code == 200 and (fromJson(outputs.probe_application_catalog.body) | length) == 0 %}
      EMPTY_APPLICATION_CATALOG
      {% else %}
      HEALTHY
      {% endif %}
    cases:
      GATEWAY_UNHEALTHY:
        - id: alert_gateway_unhealthy_slack
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: "Dispatches critical Slack alert when Gotify health check reports database failure or service degradation."
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "channel": "{{ inputs.slack_channel }}",
              "text": "[CRITICAL] Gotify Push Notification Gateway Outage",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*[CRITICAL] Gotify Push Gateway Outage*\n*Host:* `http://{{ inputs.gotify_host }}:{{ inputs.gotify_port }}`\n*HTTP Code:* `{{ outputs.probe_gateway_health.code }}`\n*Health Response:* `{{ outputs.probe_gateway_health.body | trim }}`\n*Impact:* Mobile push notifications and incident dispatches cannot be routed to on-call responders."
                  }
                }
              ]
            }

      EMPTY_APPLICATION_CATALOG:
        - id: alert_empty_catalog_slack
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: "Dispatches operational warning when no registered notification client applications are found on the server."
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "channel": "{{ inputs.slack_channel }}",
              "text": "[WARNING] Gotify Registered Application Inventory Empty",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*[WARNING] Gotify Notification Applications Missing*\n*Host:* `http://{{ inputs.gotify_host }}:{{ inputs.gotify_port }}`\n*Active Applications:* 0\n*Action:* Verify whether recent migrations purged client application credentials or tokens."
                  }
                }
              ]
            }

        - id: check_dry_run_remediation
          type: io.kestra.plugin.core.flow.If
          description: "Safeguard check ensuring diagnostic logging only triggers according to dry-run configuration."
          condition: "{{ inputs.dry_run == true }}"
          then:
            - id: log_dry_run_notice
              type: io.kestra.plugin.core.log.Log
              message: "Dry-run active: empty application catalog detected without creating synthetic test applications."
          else:
            - id: log_live_remediation_intent
              type: io.kestra.plugin.core.log.Log
              message: "Live mode: empty application catalog recorded on {{ inputs.gotify_host }}. Operational alert dispatched."

      HEALTHY:
        - id: log_healthy_state
          type: io.kestra.plugin.core.log.Log
          description: "Logs nominal status when health probe succeeds and applications are actively registered."
          message: "Gotify Push Notification Gateway is healthy on {{ inputs.gotify_host }}:{{ inputs.gotify_port }}. Version: {{ (fromJson(outputs.probe_gateway_version.body).version) ?? 'unknown' }} | Registered Apps: {{ (fromJson(outputs.probe_application_catalog.body) | length) ?? 0 }}."

  - id: log_sentinel_audit_summary
    type: io.kestra.plugin.core.log.Log
    description: "Emits immutable audit record documenting Gotify gateway health status and execution lineage."
    message: "Gotify sentinel evaluation complete for http://{{ inputs.gotify_host }}:{{ inputs.gotify_port }}. Status: {{ outputs.classify_gateway_status.value | trim }} | Health Code: {{ outputs.probe_gateway_health.code }} | Execution: {{ execution.id }}"

errors:
  - id: alert_gotify_network_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: "Dispatches emergency Slack alert if the Gotify server is offline, network-partitioned, or unreachable."
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "{{ inputs.slack_channel }}",
        "text": "[CRITICAL] Gotify Server Network Connection Refused",
        "blocks": [
          {
            "type": "section",
            "text": {
              "type": "mrkdwn",
              "text": "*[CRITICAL] Gotify Server Unreachable*\nFailed to connect to Gotify server at `http://{{ inputs.gotify_host }}:{{ inputs.gotify_port }}`. The daemon process may have crashed, storage volume detached, or container terminated."
            }
          }
        ]
      }

extend:
  title: Gotify Push Notification Gateway Health and Delivery Sentinel
  metaTitle: Gotify Notification Gateway Health Sentinel | Kestra
  shortDescription: Continuously audit Gotify notification gateway health, monitor registered application token validity, and alert via Slack.
  metaDescription: Audit Gotify push notification gateway health, monitor registered application token validity, and alert via Slack to prevent mobile alert delivery failures.
  description: |
    Gotify is an open-source, self-hosted push notification and message routing server written in Go with embedded SQLite storage, WebSocket real-time feeds, and a lightweight REST API. Widely adopted across DevOps teams, on-call engineering rotations, and private cloud infrastructure, Gotify provides an independent push notification backbone that eliminates reliance on commercial cloud push services. However, in production telemetry and alert aggregation pipelines, unhandled SQLite database locks, expired client application tokens, or container network partitions can cause push alerts to drop silently, leaving on-call engineers unaware of upstream incidents. This blueprint deploys an automated operational sentinel that polls Gotify core health endpoints, audits registered client applications, routes structured alerts to Slack, and maintains execution audit lineage.

    ## How it works

    1. `periodic_gotify_audit` (`io.kestra.plugin.core.trigger.Schedule`) initiates scheduled monitoring every 15 minutes. Shipped disabled so initial connectivity can be verified manually.
    2. `probe_gateway_health` (`io.kestra.plugin.core.http.Request`) invokes `GET /health` to confirm Go runtime health and internal SQLite database read/write responsiveness.
    3. `probe_gateway_version` (`io.kestra.plugin.core.http.Request`) invokes `GET /version` to inspect daemon version metadata and verify REST engine stability.
    4. `probe_application_catalog` (`io.kestra.plugin.core.http.Request`) invokes `GET /application` using an administrative token to audit registered push notification clients.
    5. `classify_gateway_status` (`io.kestra.plugin.core.flow.Switch`) evaluates probe results:
       - `GATEWAY_UNHEALTHY`: Fires if `/health` returns non-200 or health status is not green, dispatching a high-priority incident alert via `io.kestra.plugin.slack.notifications.SlackIncomingWebhook`.
       - `EMPTY_APPLICATION_CATALOG`: Fires when registered client applications drop to zero, warning administrators of potential credential or migration loss.
       - `HEALTHY`: Confirms that both daemon runtime and message queues operate nominally.
    6. `log_sentinel_audit_summary` (`io.kestra.plugin.core.log.Log`) records an immutable execution record documenting evaluated status codes and execution lineage.
    7. Global `errors` handler catches network connection drops, timeouts, or container crashes, firing an emergency alert to Slack.

    ## What you get

    - Automated continuous surveillance of Gotify push notification gateway daemon availability and database health.
    - Proactive alerts on Slack before notification delivery failures prevent on-call incident notifications from reaching mobile clients.
    - Safe dry-run guarding: default `dry_run: true` prevents automated mutations during cluster audits.
    - Centralized audit lineage within Kestra tracking notification gateway health history over time.

    ## Who it's for

    - Platform Engineers and SREs hosting internal Gotify alert routing infrastructure on Kubernetes or Docker.
    - DevOps Teams operating self-hosted push notification gateways for alert forwarding and CI/CD pipelines.
    - Incident Response Teams seeking automated health verification for on-call notification channels.

    ## Why orchestrate this with Kestra

    Gotify provides high-performance push routing but lacks built-in alerting, cron scheduling, and multi-channel incident escalation. Relying on custom shell scripts or ad-hoc cron jobs introduces maintenance overhead, hard-coded credentials, and zero execution visibility. Kestra provides a declarative YAML blueprint featuring scheduled triggers, masked secret management, conditional branching, and comprehensive execution observability.

    ## Prerequisites

    - A running Gotify server instance (version 2.0+) accessible over HTTP. Gotify provides an official open-source Docker image (`gotify/server:latest`) requiring zero commercial licensing.
    - An incoming Slack webhook URL for operational notifications.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack incoming webhook URL for operational notifications and incident routing.
    - `GOTIFY_CLIENT_TOKEN`: Administrative client token with permissions to query Gotify registered applications.

    ## Quick start

    1. Start a local Gotify test container:
       ```bash
       docker run -d --name gotify-test -p 8080:80 -e GOTIFY_DEFAULTUSER_PASS=admin gotify/server:latest
       ```
    2. Log in at `http://localhost:8080` (admin/admin), navigate to **Clients**, and generate an administrative client token.
    3. Configure `SLACK_WEBHOOK_URL` and `GOTIFY_CLIENT_TOKEN` in your Kestra namespace secrets.
    4. Import this blueprint and execute with default inputs (`dry_run: true`).
    5. Confirm that `log_healthy_state` records a successful health check response (`health: green`).
    6. Test alerting by stopping the container (`docker stop gotify-test`) and re-running the flow to verify `alert_gotify_network_failure`.
    7. Enable `periodic_gotify_audit` to activate recurring 15-minute surveillance.

    ## How to extend

    - Add synthetic message delivery probes using `POST /message` to test end-to-end client push latency.
    - Integrate with PagerDuty via `io.kestra.plugin.pagerduty.notifications.PagerDutyAlert` for high-severity push infrastructure outages.
    - Add automated SQLite database backup sync to AWS S3 using `io.kestra.plugin.aws.s3.Upload`.

    ## Links

    - [Gotify Official Documentation](https://gotify.net/docs/)
    - [Gotify GitHub Repository](https://github.com/gotify/server)
    - [Kestra HTTP Request Plugin Documentation](https://kestra.io/plugins/plugin-core/tasks/http/io.kestra.plugin.core.http.request)
    - [Kestra Slack Notification Plugin](https://kestra.io/plugins/plugin-slack/notifications/io.kestra.plugin.slack.notifications.slackincomingwebhook)
