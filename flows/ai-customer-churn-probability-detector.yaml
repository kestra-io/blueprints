id: ai-customer-churn-probability-detector
namespace: company.team
description: |
  Automated AI-powered customer churn detection workflow. Queries inactive accounts from PostgreSQL CRM,
  prompts Anthropic Claude to determine risk scores and retention tactics, and dispatches high-urgency Slack alerts.

concurrency:
  limit: 1

inputs:
  - id: postgres_url
    type: STRING
    displayName: CRM Database JDBC URL
    defaults: "jdbc:postgresql://postgres.internal:5432/crm_db"
    description: "JDBC URL of the application CRM database."

  - id: postgres_username
    type: STRING
    displayName: Database Username
    defaults: "crm_reader"
    description: "Database user with read permissions on customer_accounts."

  - id: inactive_days_threshold
    type: INT
    displayName: Inactivity Days Threshold
    defaults: 30
    description: "Minimum days of customer inactivity before evaluating account for churn risk."

  - id: churn_risk_score_alert_threshold
    type: INT
    displayName: Churn Score Alert Threshold
    defaults: 75
    description: "Minimum AI churn risk score (0-100) to trigger immediate Customer Success alert."

  - id: slack_channel
    type: STRING
    displayName: Slack Channel
    defaults: "#customer-success"
    description: "Slack channel destination for high-risk churn escalation alerts."

triggers:
  - id: weekly_churn_scan
    type: io.kestra.plugin.core.trigger.Schedule
    description: "Scans for customer churn risks weekly on Monday at 09:00 UTC."
    cron: "0 9 * * 1"

tasks:
  - id: query_inactive_accounts
    type: io.kestra.plugin.jdbc.postgresql.Query
    description: "Queries customer_accounts table for high-MRR accounts with no recent user activity."
    url: "{{ inputs.postgres_url }}"
    username: "{{ inputs.postgres_username }}"
    password: "{{ secret('POSTGRES_PASSWORD') }}"
    fetchType: FETCH
    sql: |
      SELECT
        account_id,
        company_name,
        mrr_amount,
        plan_tier,
        last_active_date,
        CURRENT_DATE - last_active_date AS inactive_days,
        open_tickets_count
      FROM customer_accounts
      WHERE status = 'active'
        AND last_active_date < CURRENT_DATE - (INTERVAL '1 day' * {{ inputs.inactive_days_threshold }})
      ORDER BY mrr_amount DESC
      LIMIT 10;

  - id: analyze_churn_risk_with_claude
    type: io.kestra.plugin.anthropic.ChatCompletion
    description: "Sends inactive customer telemetry to Anthropic Claude to score churn risk and draft retention plans."
    apiKey: "{{ secret('ANTHROPIC_API_KEY') }}"
    model: "claude-3-5-sonnet-20241022"
    messages:
      - role: user
        content: |
          You are an enterprise Customer Success AI analyst. Evaluate these inactive customer accounts and compute a churn risk probability score from 0 to 100 for each.
          Return ONLY valid JSON matching this structure:
          {"accounts": [{"account_id": "...", "company_name": "...", "churn_score": 85, "churn_driver": "high MRR with zero logins in 45 days", "recommended_action": "..."}]}

          Account data:
          {{ outputs.query_inactive_accounts.rows | default('[]') | json }}

  - id: parse_churn_scores
    type: io.kestra.plugin.scripts.python.Script
    description: "Parses Claude output JSON and filters high-risk accounts breaching the threshold."
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    inputFiles:
      claude_output.txt: "{{ outputs.analyze_churn_risk_with_claude.choices[0].message.content }}"
    outputFiles:
      - churn_analysis_report.json
    script: |
      import json
      import re
      from kestra import Kestra

      with open("claude_output.txt", "r", encoding="utf-8") as f:
          raw_text = f.read().strip()

      clean_json = re.sub(r"^```(?:json)?\s*", "", raw_text, flags=re.MULTILINE)
      clean_json = re.sub(r"\s*```$", "", clean_json, flags=re.MULTILINE).strip()

      parsed = json.loads(clean_json)
      accounts = parsed.get("accounts", [])

      alert_threshold = int("{{ inputs.churn_risk_score_alert_threshold }}")
      high_risk = []

      for a in accounts:
          score = int(a.get("churn_score", 0))
          if score >= alert_threshold:
              high_risk.append(a)

      has_high_risk = len(high_risk) > 0

      with open("churn_analysis_report.json", "w", encoding="utf-8") as f:
          json.dump({
              "total_analyzed": len(accounts),
              "high_risk_count": len(high_risk),
              "high_risk_accounts": high_risk
          }, f, indent=2)

      top_account = high_risk[0] if high_risk else {}
      Kestra.outputs({
          "high_risk_detected": has_high_risk,
          "high_risk_count": len(high_risk),
          "top_risk_company": top_account.get("company_name", "None"),
          "top_risk_score": top_account.get("churn_score", 0),
          "top_action": top_account.get("recommended_action", "None")
      })

  - id: evaluate_high_risk_condition
    type: io.kestra.plugin.core.flow.If
    description: "Branches execution based on whether high-risk churn accounts were identified."
    condition: "{{ outputs.parse_churn_scores.vars.high_risk_detected }}"
    then:
      - id: alert_customer_success_high_churn
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: "Dispatches actionable churn prevention card to Customer Success team via Slack."
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "{{ inputs.slack_channel }}",
            "text": "*Customer Churn Risk Alert*\n• *Evaluated Accounts*: {{ outputs.parse_churn_scores.vars.high_risk_count }} critical risk accounts identified\n• *Top Risk Account*: `{{ outputs.parse_churn_scores.vars.top_risk_company }}` (Score: {{ outputs.parse_churn_scores.vars.top_risk_score }}/100)\n• *Identified Churn Driver*: Inactive telemetry exceeding {{ inputs.inactive_days_threshold }} days with open support escalations\n• *Recommended Retention Action*: {{ outputs.parse_churn_scores.vars.top_action }}\n• *Operational Impact*: Immediate executive check-in required to protect monthly recurring revenue (MRR) before renewal window closes."
          }

    else:
      - id: log_churn_status_healthy
        type: io.kestra.plugin.core.log.Log
        description: "Logs confirmation of healthy customer retention metrics."
        message: "Customer retention audit compliant. Zero accounts exceeded the {{ inputs.churn_risk_score_alert_threshold }} churn risk score threshold."

  - id: export_churn_manifest
    type: io.kestra.plugin.core.debug.Return
    description: "Outputs structured JSON customer retention manifest for executive reporting."
    format: |
      {
        "pipeline": "ai-customer-churn-probability-detector",
        "audited_at": "{{ execution.startDate }}",
        "high_risk_count": {{ outputs.parse_churn_scores.vars.high_risk_count }},
        "status": "{{ outputs.parse_churn_scores.vars.high_risk_detected ? 'CHURN_RISK_DETECTED' : 'HEALTHY' }}"
      }

extend:
  shortDescription: "Identifies inactive accounts, scores churn probability with Claude, and alerts Customer Success."
  title: "AI Customer Churn Probability Detector"
  metaTitle: "AI Customer Churn Probability Detector | Kestra Blueprint"
  metaDescription: "Queries inactive CRM accounts, evaluates churn probability using Anthropic Claude, and dispatches high-urgency retention alerts to Slack."
  description: |
    Customer churn is one of the most critical threats to recurring-revenue software companies. When customer telemetry signals decline, such as daily active logins dropping off, support ticket backlogs lingering, or core feature usage stalling, traditional heuristics often flag accounts only after cancellation notices are submitted.

    By orchestrating database telemetry queries alongside Anthropic Claude, revenue teams can synthesize multidimensional product signals into nuanced churn risk assessments with tailored retention playbooks.

    This blueprint automates weekly customer retention audits: it pulls inactive accounts from PostgreSQL, prompts Claude to compute an objective churn risk score (0-100) and draft account-specific outreach recommendations, and routes high-priority churn alerts to Customer Success teams via Slack.

    ## How it works

    1. **Weekly Scheduled Scan**: The `weekly_churn_scan` trigger (`io.kestra.plugin.core.trigger.Schedule`) executes every Monday at 09:00 UTC.
    2. **CRM Database Query**: The `query_inactive_accounts` task (`io.kestra.plugin.jdbc.postgresql.Query`) pulls top-MRR customer accounts with inactivity exceeding `inactive_days_threshold`.
    3. **Claude Churn Scoring**: The `analyze_churn_risk_with_claude` task (`io.kestra.plugin.anthropic.ChatCompletion`) sends account telemetry to Claude to score churn drivers and formulate retention actions.
    4. **Python Score Parsing**: The `parse_churn_scores` task (`io.kestra.plugin.scripts.python.Script`) extracts accounts exceeding `churn_risk_score_alert_threshold` and compiles `churn_analysis_report.json`.
    5. **Condition Branching**: The `evaluate_high_risk_condition` flowable task (`io.kestra.plugin.core.flow.If`) branches based on whether any high-risk accounts were discovered.
    6. **Slack Alert Dispatch**: When risk is flagged, `alert_customer_success_high_churn` (`io.kestra.plugin.slack.notifications.SlackIncomingWebhook`) delivers an actionable retention card.
    7. **Audit Manifest**: The `export_churn_manifest` task records execution state for revenue operations dashboards.

    ## Architecture diagram

    ```mermaid
    flowchart TD
        A[Schedule: Weekly Monday 09:00 UTC] --> B[query_inactive_accounts: PostgreSQL]
        B --> C[analyze_churn_risk_with_claude: Anthropic Claude]
        C --> D[parse_churn_scores: Python Score Parser]
        D --> E{High Churn Risk Detected?}
        E -- Yes --> F[alert_customer_success_high_churn: Slack]
        E -- No --> G[log_churn_status_healthy: Log]
        F --> H[export_churn_manifest: Return JSON]
        G --> H
    ```

    ## Use cases

    - **Proactive Churn Prevention**: Identify enterprise accounts with declining product usage weeks before renewal discussions.
    - **Automated RevOps Telemetry Analysis**: Combine database usage metrics with generative AI reasoning to score account health.
    - **Customer Success Workflow Automation**: Instantly equip customer success managers with tailored outreach playbooks on Slack.

    ## What you get

    - Automated discovery of dormant high-MRR customer accounts before contract expiration.
    - AI-generated churn risk scores (0-100) and root-cause driver explanations.
    - Tailored account executive outreach recommendations generated by Claude.
    - Structured Slack notifications formatted for immediate Customer Success follow-up.

    ## Who it is for

    - Customer Success Managers responsible for account retention and Net Revenue Retention (NRR).
    - Revenue Operations (RevOps) teams automating proactive churn intervention.
    - Product Managers tracking feature abandonment across customer cohorts.

    ## Why orchestrate this with Kestra

    Building custom retention models requires setting up ETL jobs, embedding inference APIs, and maintaining notification channels. Kestra combines database querying, Anthropic LLM inference, Python parsing, and Slack alerting into a clean, maintainable workflow.

    ## Inputs

    | Name | Type | Default | Description |
    | :--- | :--- | :--- | :--- |
    | `postgres_url` | STRING | `jdbc:postgresql://...` | JDBC URL of CRM database. |
    | `postgres_username` | STRING | `crm_reader` | Read-only database user. |
    | `inactive_days_threshold` | INT | `30` | Inactivity window before evaluation. |
    | `churn_risk_score_alert_threshold` | INT | `75` | Minimum risk score to trigger alert. |
    | `slack_channel` | STRING | `#customer-success` | Slack channel destination for alerts. |

    ## Expected outputs

    - `{{ outputs.parse_churn_scores.vars.high_risk_detected }}`: Boolean flag indicating if high-risk accounts exist.
    - `{{ outputs.parse_churn_scores.vars.top_risk_company }}`: Company name of top at-risk account.
    - `{{ outputs.parse_churn_scores.vars.top_risk_score }}`: Numerical churn score of top offender.
    - `{{ outputs.parse_churn_scores.outputFiles['churn_analysis_report.json'] }}`: Complete JSON diagnostic report.

    ## Prerequisites

    - PostgreSQL CRM database containing a customer accounts table.
    - Anthropic API key stored in Kestra secrets.
    - Slack Incoming Webhook configured for Customer Success alerts.

    ### Secrets

    - `POSTGRES_PASSWORD`: Password for the PostgreSQL database user.
    - `ANTHROPIC_API_KEY`: API key for Anthropic Claude inference.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook endpoint URL.

    ## Quick start

    1. Configure `POSTGRES_PASSWORD`, `ANTHROPIC_API_KEY`, and `SLACK_WEBHOOK_URL` in your Kestra namespace secrets.
    2. Import this flow YAML into your Kestra instance.
    3. Click **Execute** in the UI to perform an initial retention scan.
    4. Review execution outputs to inspect generated risk scores and outreach tactics.

    ## Common pitfalls and troubleshooting

    - **Token Limits**: When evaluating dozens of accounts, restrict batch size (e.g. `LIMIT 10`) to keep token usage within API rate limits.
    - **Date Intervals**: In PostgreSQL, ensure `last_active_date` is indexed to prevent full-table scans during the query step.
    - **JSON Parsing**: Claude is instructed to return strict JSON; the script safely handles and strips any surrounding markdown code fences.

    ## How to extend

    - Add `io.kestra.plugin.hubspot.DealUpdate` to automatically create high-urgency renewal risk tasks in your CRM.
    - Ingest Zendesk ticket sentiment via `io.kestra.plugin.core.http.Request` to enrich telemetry prior to LLM scoring.
    - Trigger personalized executive email drafts using `io.kestra.plugin.notifications.mail.MailSend`.

    ## Links

    - Kestra Anthropic Plugin Documentation: https://kestra.io/plugins/plugin-anthropic/io.kestra.plugin.anthropic.ChatCompletion
    - Kestra PostgreSQL Plugin Documentation: https://kestra.io/plugins/plugin-jdbc-postgres
    - Kestra Slack Plugin Documentation: https://kestra.io/plugins/plugin-notifications
  tags:
    - AI
    - Business
  subTags:
    - Agents & Structured Output
    - CRM & Marketing Ops
  ee: false
  demo: false
