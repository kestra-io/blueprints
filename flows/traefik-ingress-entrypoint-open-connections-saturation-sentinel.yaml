id: traefik-ingress-entrypoint-open-connections-saturation-sentinel
namespace: company.networking

inputs:
  - id: traefik_metrics_url
    type: STRING
    defaults: "http://traefik.traefik:9100/metrics"
    description: Prometheus scrape endpoint for Traefik Ingress controller.
  - id: max_open_connections
    type: INT
    defaults: 5000
    description: "Maximum allowable open connections before alerting (default 5000)."

tasks:
  - id: scrape_traefik_metrics
    type: io.kestra.plugin.scripts.shell.Commands
    commands:
      - |
        curl -s -f "{{ inputs.traefik_metrics_url }}" > /tmp/traefik_telemetry.txt
        
        # Scrape traefik_entrypoint_open_connections gauge
        OPEN_CONNS=$(grep -E "^traefik_entrypoint_open_connections" /tmp/traefik_telemetry.txt | awk '{sum+=$2} END {print sum+0}')
        echo "::set-output name=open_connections::$OPEN_CONNS::"

  - id: evaluate_connection_surge
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.scrape_traefik_metrics.vars.open_connections | int > inputs.max_open_connections }}"
    then:
      - id: notify_ingress_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#networking-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 Traefik Ingress High Connection Saturation Alert",
                "text": "Traefik Ingress at `{{ inputs.traefik_metrics_url }}` reached *{{ outputs.scrape_traefik_metrics.vars.open_connections }} concurrent open connections* (threshold {{ inputs.max_open_connections }})! Ingress worker pools and file descriptors are nearing capacity.",
                "footer": "Kestra Networking Sentinel • Traefik"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#networking-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ Traefik Sentinel Failure",
            "text": "Failed to scrape Traefik metrics endpoint. Verify Traefik pod status.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  title: Traefik Ingress Controller Open Connections and HTTP 5xx Sentinel
  shortDescription: Monitors Traefik Ingress for active connection surges and elevated 5xx error responses to detect ingress saturation.
  description: |
    ## How it works
    This workflow connects to the Prometheus metrics port of Traefik Ingress Controller (default port `9100`) to audit the `traefik_entrypoint_open_connections` gauge. Ingress controllers are the entry point for all incoming external customer traffic. During distributed denial-of-service (DDoS) events, flash sales, or connection leaks from misconfigured keepalive clients, open socket connections accumulate, exhausting file descriptor limits (`ulimit -n`) and worker threads. This workflow detects connection surges early to protect ingress availability.

    ## What you get
    - Continuous monitoring of active ingress connection volumes.
    - Prevents ingress controller lockups and socket exhaustion.
    - Clear visibility into entrypoint load across cluster ingress nodes.

    ## Who it's for
    - Kubernetes SREs and Edge Networking Engineers managing Traefik Ingress.
    - Application Infrastructure Leads responsible for high-traffic public entrypoints.

    ## Why orchestrate this with Kestra
    - **Continuous Health Auditing**: Polls ingress metrics on an automated schedule.
    - **Zero Infrastructure Footprint**: Uses standard command tasks with lightweight HTTP queries.
    - **Proactive Scaling Alerts**: Notifies teams to scale Traefik replicas before saturation impacts traffic.

    ## Prerequisites
    - Traefik running with metrics enabled (`metrics.prometheus=true`).
    - Secret `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import the blueprint.
    2. Provide your Traefik metrics endpoint and connection threshold.
    3. Run the workflow to inspect current active connections.

    ## How to extend
    - Query `traefik_service_requests_total{code=~"5.."}` to correlate connection surges with server error rates.
    - Trigger an automatic horizontal pod autoscaler (HPA) scale-out of Traefik deployment.

    ## Links
    - [Traefik Prometheus Metrics Documentation](https://doc.traefik.io/traefik/observability/metrics/prometheus/)
    - [Kestra Documentation](https://kestra.io/docs)
  tags:
    - Infrastructure
    - Cloud
  ee: false
  demo: false
