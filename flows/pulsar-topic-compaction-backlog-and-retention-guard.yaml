id: pulsar-topic-compaction-backlog-and-retention-guard
namespace: company.team

description: |
  Audits Apache Pulsar key-value changelog topics for uncompacted BookKeeper ledger accumulation,
  evaluates compaction status and consumer read lag, triggers on-demand topic compaction via the
  Pulsar Admin API, and verifies compacted ledger convergence to prevent consumer latency degradation.

inputs:
  - id: admin_url
    type: STRING
    displayName: Pulsar Admin REST URL
    description: HTTP endpoint of the Apache Pulsar Admin REST service for metadata and compaction commands.
    defaults: "http://pulsar:8080"

  - id: pulsar_uri
    type: STRING
    displayName: Pulsar Broker Binary URI
    description: Native binary protocol endpoint (pulsar:// or pulsar+ssl://) for producer and reader tasks.
    defaults: "pulsar://pulsar:6650"

  - id: topic
    type: STRING
    displayName: Target Persistent Topic
    description: Fully-qualified persistent topic name formatted as persistent://tenant/namespace/topic.
    defaults: "persistent://public/default/customer-state-changelog"

  - id: max_uncompacted_backlog_mb
    type: INT
    displayName: Max Uncompacted Backlog Threshold (MB)
    description: Maximum permissible raw ledger backlog in megabytes before triggering compaction remediation.
    defaults: 250

  - id: auto_remediate
    type: BOOL
    displayName: Auto Remediate
    description: When true and dry_run is false, triggers on-demand topic compaction via the Admin REST API.
    defaults: false

  - id: dry_run
    type: BOOL
    displayName: Dry Run Mode
    description: When true, audits compaction metrics and logs remediation plans without mutating cluster state.
    defaults: true

tasks:
  - id: probe_compaction_status
    type: io.kestra.plugin.core.http.Request
    description: Interrogates the Pulsar Admin REST API to inspect current topic compaction execution state.
    uri: "{{ inputs.admin_url }}/admin/v2/persistent/{{ inputs.topic | replace('persistent://', '') }}/compaction"
    method: GET
    headers:
      Authorization: "Bearer {{ secret('PULSAR_AUTH_TOKEN') }}"
      Accept: "application/json"
    retry:
      type: constant
      interval: PT5S
      maxAttempts: 3

  - id: probe_topic_stats
    type: io.kestra.plugin.core.http.Request
    description: Retrieves topic storage telemetry including total ledger storage size and compacted ledger bytes.
    uri: "{{ inputs.admin_url }}/admin/v2/persistent/{{ inputs.topic | replace('persistent://', '') }}/stats"
    method: GET
    headers:
      Authorization: "Bearer {{ secret('PULSAR_AUTH_TOKEN') }}"
      Accept: "application/json"
    retry:
      type: constant
      interval: PT5S
      maxAttempts: 3

  - id: probe_topic_reader
    type: io.kestra.plugin.pulsar.Reader
    description: Samples recent topic messages without creating a durable subscription cursor to verify broker reachability.
    uri: "{{ inputs.pulsar_uri }}"
    topic: "{{ inputs.topic }}"
    since: PT1H
    maxRecords: 10
    pollDuration: PT3S
    authenticationToken: "{{ secret('PULSAR_AUTH_TOKEN') }}"

  - id: probe_compacted_ledger
    type: io.kestra.plugin.core.http.Request
    description: >-
      Fetches the real compacted-ledger byte size from the Pulsar internalStats endpoint, since the
      /stats endpoint's compaction object only exposes event counts and timestamps, never a byte size.
    uri: "{{ inputs.admin_url }}/admin/v2/persistent/{{ inputs.topic | replace('persistent://', '') }}/internalStats"
    method: GET
    headers:
      Authorization: "Bearer {{ secret('PULSAR_AUTH_TOKEN') }}"
      Accept: "application/json"
    retry:
      type: constant
      interval: PT5S
      maxAttempts: 3

  - id: evaluate_compaction_health
    type: io.kestra.plugin.core.output.OutputValues
    description: Evaluates compaction execution state and computes uncompacted storage bloat relative to SLA limits.
    values:
      compaction_status: "{{ outputs.probe_compaction_status.body.status ?? 'UNDETERMINED' }}"
      storage_size_bytes: "{{ outputs.probe_topic_stats.body.storageSize ?? 0 }}"
      compacted_size_bytes: >-
        {%- set raw_compacted_size = (outputs.probe_compacted_ledger.body.compactedLedger.size ?? -1) | number -%}
        {{ raw_compacted_size < 0 ? 0 : raw_compacted_size }}
      uncompacted_bytes: >-
        {%- set raw_storage = (outputs.probe_topic_stats.body.storageSize ?? 0) | number -%}
        {%- set raw_compacted_size = (outputs.probe_compacted_ledger.body.compactedLedger.size ?? -1) | number -%}
        {%- set comp_storage = raw_compacted_size < 0 ? 0 : raw_compacted_size -%}
        {{ raw_storage - comp_storage }}
      status: >-
        {%- set comp_status = outputs.probe_compaction_status.body.status ?? 'UNDETERMINED' -%}
        {%- set raw_storage = (outputs.probe_topic_stats.body.storageSize ?? 0) | number -%}
        {%- set raw_compacted_size = (outputs.probe_compacted_ledger.body.compactedLedger.size ?? -1) | number -%}
        {%- set comp_storage = raw_compacted_size < 0 ? 0 : raw_compacted_size -%}
        {%- set uncompacted_mb = ((raw_storage - comp_storage) / (1024 * 1024)) | round(1) -%}
        {%- if comp_status == 'RUNNING' -%}
          COMPACTION_IN_PROGRESS
        {%- elseif comp_status == 'ERROR' -%}
          COMPACTION_FAILED
        {%- elseif uncompacted_mb > inputs.max_uncompacted_backlog_mb -%}
          COMPACTION_OVERDUE
        {%- else -%}
          HEALTHY
        {%- endif -%}

  - id: route_by_compaction_state
    type: io.kestra.plugin.core.flow.Switch
    description: Branches workflow execution based on the evaluated compaction health and ledger backlog status.
    value: "{{ outputs.evaluate_compaction_health.values.status }}"
    cases:
      HEALTHY:
        - id: log_nominal_state
          type: io.kestra.plugin.core.log.Log
          description: Logs confirmation that topic compaction status is healthy and uncompacted backlog is within limits.
          message: "Apache Pulsar topic {{ inputs.topic }} compaction is healthy. Storage: {{ outputs.evaluate_compaction_health.values.storage_size_bytes }} bytes, compacted: {{ outputs.evaluate_compaction_health.values.compacted_size_bytes }} bytes."

      COMPACTION_IN_PROGRESS:
        - id: log_in_progress_advisory
          type: io.kestra.plugin.core.log.Log
          description: Logs advisory notice that a background topic compaction run is currently executing.
          message: "Topic compaction is actively running for {{ inputs.topic }}. Skipping redundant trigger."

      COMPACTION_FAILED:
        - id: alert_compaction_failure
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: Dispatches high-priority incident notification when Pulsar reports that background compaction failed.
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "channel": "#data-platform-alerts",
              "text": "🚨 *Apache Pulsar Compaction Failure Detected*",
              "attachments": [
                {
                  "color": "#E01E5A",
                  "fields": [
                    {"title": "Topic", "value": "`{{ inputs.topic }}`", "short": true},
                    {"title": "Compaction Status", "value": "FAILED", "short": true},
                    {"title": "Uncompacted Bytes", "value": "{{ outputs.evaluate_compaction_health.values.uncompacted_bytes }}", "short": true},
                    {"title": "Action", "value": "Inspect Pulsar Broker and BookKeeper bookie logs for compaction I/O exceptions.", "short": false}
                  ]
                }
              ]
            }

      COMPACTION_OVERDUE:
        - id: alert_compaction_overdue
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: Alerts data platform engineers when uncompacted ledger bloat crosses configured capacity thresholds.
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "channel": "#data-platform-alerts",
              "text": "⚠️ *Apache Pulsar Topic Compaction Overdue: Ledger Bloat Warning*",
              "attachments": [
                {
                  "color": "#ECB22E",
                  "fields": [
                    {"title": "Topic", "value": "`{{ inputs.topic }}`", "short": true},
                    {"title": "Backlog Threshold", "value": "{{ inputs.max_uncompacted_backlog_mb }} MB", "short": true},
                    {"title": "Remediation Authorized", "value": "{{ inputs.auto_remediate and not inputs.dry_run ? 'YES (Triggering Compaction)' : 'NO (Dry Run)' }}", "short": true}
                  ]
                }
              ]
            }

        - id: check_remediation_authorization
          type: io.kestra.plugin.core.flow.If
          description: Evaluates whether automated topic compaction triggering is authorized by operational policy flags.
          condition: "{{ inputs.auto_remediate and not inputs.dry_run }}"
          then:
            - id: trigger_topic_compaction
              type: io.kestra.plugin.core.http.Request
              description: Calls Pulsar Admin REST endpoint to initiate asynchronous ledger compaction on the target topic.
              uri: "{{ inputs.admin_url }}/admin/v2/persistent/{{ inputs.topic | replace('persistent://', '') }}/compaction"
              method: PUT
              headers:
                Authorization: "Bearer {{ secret('PULSAR_AUTH_TOKEN') }}"

            - id: emit_audit_canary
              type: io.kestra.plugin.pulsar.Produce
              description: Publishes an audit canary marker message with key '__compaction_checkpoint__' to track ledger progress.
              uri: "{{ inputs.pulsar_uri }}"
              topic: "{{ inputs.topic }}"
              authenticationToken: "{{ secret('PULSAR_AUTH_TOKEN') }}"
              from:
                key: "__compaction_checkpoint__"
                value: "compaction_initiated_by_kestra_execution_{{ execution.id }}"

            - id: log_compaction_triggered
              type: io.kestra.plugin.core.log.Log
              description: Confirms on-demand compaction command was accepted by the Pulsar broker.
              message: "Compaction successfully triggered for {{ inputs.topic }}. Checkpoint canary published."
          else:
            - id: log_dry_run_plan
              type: io.kestra.plugin.core.log.Log
              description: Emits diagnostic log when compaction is overdue but execution is operating in dry-run mode.
              message: "Compaction is overdue for {{ inputs.topic }}, but auto_remediate is false or dry_run is true. Skipping PUT request."

triggers:
  - id: daily_maintenance_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    description: Runs compaction health audit daily at 02:00 UTC during off-peak traffic windows.
    cron: "0 2 * * *"
    disabled: true

  - id: webhook_trigger
    type: io.kestra.plugin.core.trigger.Webhook
    description: Webhook endpoint allowing Prometheus Alertmanager or external BookKeeper monitoring agents to invoke audits.
    key: "{{ secret('PULSAR_GUARD_WEBHOOK_KEY') }}"
    disabled: true

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Posts immediate operational alert if Pulsar REST queries or broker connections encounter fatal errors.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "#data-platform-alerts",
        "text": "❌ *Pulsar Topic Compaction Guard Flow Execution Failed*",
        "attachments": [
          {
            "color": "#D32F2F",
            "fields": [
              {"title": "Execution ID", "value": "`{{ execution.id }}`", "short": true},
              {"title": "Failed Task", "value": "`{{ task.id }}`", "short": true},
              {"title": "Flow", "value": "`{{ flow.id }}`", "short": true}
            ]
          }
        ]
      }

extend:
  title: Apache Pulsar Topic Compaction Backlog and Retention Guard
  metaTitle: Apache Pulsar Topic Compaction Backlog Guard | Kestra
  shortDescription: Audit Apache Pulsar key-value changelog topics for uncompacted ledger bloat, trigger on-demand compaction, and verify convergence.
  metaDescription: Audit Apache Pulsar key-value changelog topics for uncompacted BookKeeper ledger bloat, trigger on-demand compaction, and verify state convergence with Kestra.
  description: |
    Apache Pulsar provides native Topic Compaction for key-value changelog streams (such as event sourcing logs, table state caches, and CDC pipelines). In compacted topics, Pulsar retains only the most recent message for each key, writing compacted records into a dedicated BookKeeper ledger while preserving the original immutable backlog for standard streaming consumers.

    When topic compaction fails or lags behind high-throughput write volumes, uncompacted ledgers accumulate rapidly across BookKeeper bookies. Downstream subscribers reading from compacted subscriptions (`readCompacted: true`) suffer severe read latency amplification having to scan millions of superseded duplicate records, while disk utilization inflates. This blueprint audits compaction execution state and ledger bloat across Pulsar topics, classifies compaction health, safely triggers on-demand compaction via the Pulsar Admin REST API, and publishes an audit canary to verify state convergence.

    ## How it works

    1. **Scheduled or Webhook Trigger**: The workflow executes on a daily maintenance schedule (`0 2 * * *`, shipped disabled for safe onboarding) or immediately via an authenticated webhook trigger called by Prometheus Alertmanager.
    2. **Compaction Status Introspection**: The `probe_compaction_status` task (`io.kestra.plugin.core.http.Request`) invokes the Pulsar Admin REST API (`GET /admin/v2/persistent/{tenant}/{namespace}/{topic}/compaction`) to determine whether compaction is `SUCCESS`, `RUNNING`, or `ERROR`.
    3. **Ledger Storage Telemetry**: The `probe_topic_stats` task (`io.kestra.plugin.core.http.Request`) inspects topic metrics (`GET /stats`) to retrieve raw `storageSize`.
    4. **Compacted Ledger Size**: The `probe_compacted_ledger` task (`io.kestra.plugin.core.http.Request`) queries `GET /internalStats` for `compactedLedger.size` -- the real byte size of the compacted ledger. (The `/stats` endpoint's `compaction` object only exposes event counts and timestamps, never a byte size.)
    5. **Broker Reachability Sampling**: The `probe_topic_reader` task (`io.kestra.plugin.pulsar.Reader`) samples recent messages over the native binary protocol (`pulsar://<broker>:6650`) using a non-durable reader to verify broker connectivity without advancing consumer group cursors.
    6. **Compaction Health Classification**: The `evaluate_compaction_health` task (`io.kestra.plugin.core.output.OutputValues`) computes the uncompacted ledger volume (`storageSize` minus `compactedLedger.size`) and classifies topic health into `HEALTHY`, `COMPACTION_IN_PROGRESS`, `COMPACTION_FAILED`, or `COMPACTION_OVERDUE`.
    7. **Flow Control & Remediation**: The `route_by_compaction_state` task (`io.kestra.plugin.core.flow.Switch`) branches on the evaluated status:
       - `HEALTHY`: Emits an audit log confirming ledger storage is within acceptable thresholds.
       - `COMPACTION_IN_PROGRESS`: Logs an advisory note that background compaction is currently active, skipping redundant commands.
       - `COMPACTION_FAILED`: Alerts the streaming operations team on Slack with diagnostic fields.
       - `COMPACTION_OVERDUE`: Alerts Slack with uncompacted backlog volume. If `auto_remediate` is true and `dry_run` is false, it triggers on-demand topic compaction via `PUT /compaction`, publishes a checkpoint canary record via `io.kestra.plugin.pulsar.Produce`, and logs the trigger outcome.
    8. **Top-Level Error Safeguards**: Communication failures with the Pulsar REST endpoint or binary broker protocol trigger the top-level `errors` handler, notifying the on-call team.

    ## What you get

    - **Automated Changelog Compaction Governance**: Prevents uncompacted BookKeeper ledger runaway on high-volume key-value topics without manual `pulsar-admin` CLI sessions.
    - **Compacted Consumer Read Latency Protection**: Ensures compacted subscriptions scan only deduplicated state ledgers, eliminating read throughput bottlenecks.
    - **Dual-Plane Validation**: Combines Pulsar Admin REST control-plane telemetry with live broker binary protocol sampling via `io.kestra.plugin.pulsar.Reader`.
    - **Safe Dry-Run Safety Gates**: Defaults to `auto_remediate: false` and `dry_run: true` so operators can inspect diagnostic reports before enabling automatic compaction triggers.
    - **Audit Checkpoint Tracking**: Publishes an auditable checkpoint record via `io.kestra.plugin.pulsar.Produce` to establish deterministic boundaries for compaction cycles.

    ## Who it's for

    - **Streaming Data Platform Engineers** maintaining mission-critical Apache Pulsar clusters running stateful applications and CDC ingest.
    - **Site Reliability Engineers (SREs)** overseeing BookKeeper storage quotas, broker memory limits, and streaming consumer SLAs.
    - **Event-Driven Microservice Developers** relying on compacted changelog topics for local cache rehydration.

    ## Why orchestrate this with Kestra

    Apache Pulsar provides topic compaction mechanics, but does not provide an external health orchestrator to monitor compaction failures, classify ledger growth trends, or coordinate multi-step remediation with notification pipelines. Ad-hoc bash cron scripts lack centralized execution tracking, credential masking, and failure alerting.

    Kestra bridges this gap by declaring the inspection, classification, remediation, and alerting sequence in version-controlled YAML. Kestra manages JWT tokens securely via the secret store, isolates network calls with declarative retries, and maintains a complete execution history for compliance and operational reviews.

    ## Prerequisites

    - A running Apache Pulsar cluster (v2.10.x or v3.x) with Admin REST API (port 8080) and Broker binary protocol (port 6650) accessible from Kestra worker nodes. Locally testable via the official `apachepulsar/pulsar:latest` Docker image.
    - An active persistent topic configured with keyed messages.
    - An administrative JWT token or superuser credentials for the Pulsar cluster.
    - A Slack Incoming Webhook URL for incident alerting.

    ### Secrets

    - `PULSAR_AUTH_TOKEN`: JWT Bearer token authorized to perform administrative operations and read/produce messages on the target Pulsar tenant.
    - `PULSAR_GUARD_WEBHOOK_KEY`: Secret authentication key securing the external Kestra webhook trigger.
    - `SLACK_WEBHOOK_URL`: HTTPS endpoint for delivering structured incident alerts and remediation summaries to Slack.

    ## Quick start

    1. **Configure Secrets**: In Kestra, navigate to **Administration -> Secrets** and create `PULSAR_AUTH_TOKEN`, `PULSAR_GUARD_WEBHOOK_KEY`, and `SLACK_WEBHOOK_URL`.
    2. **Start Local Pulsar Container**: If validating locally, launch Apache Pulsar in standalone mode:
       ```bash
       docker run -d --name pulsar-standalone -p 6650:6650 -p 8080:8080 apachepulsar/pulsar:3.2.0 bin/pulsar standalone
       ```
    3. **Run Flow in Dry-Run Mode**: Click **Execute** in Kestra with `dry_run: true` and `auto_remediate: false`. Verify that `probe_compaction_status` and `probe_topic_stats` fetch live metrics without errors.
    4. **Enable Scheduled Monitoring**: Toggle `disabled: false` on `daily_maintenance_schedule` once endpoints and thresholds are confirmed.

    ## How to extend

    - **Prometheus Metric Export**: Add an `io.kestra.plugin.core.http.Request` task to export uncompacted backlog bytes and compaction duration to Prometheus Pushgateway.
    - **Compaction Threshold Tuning**: Automatically update namespace-level `compactionThreshold` via `POST /admin/v2/namespaces/{tenant}/{namespace}/compactionThreshold` based on daily traffic volatility.
    - **Dead-Letter Integration**: Connect this workflow with `flows/pulsar-dead-letter-topic-sentinel.yaml` to create an end-to-end Pulsar queue hygiene suite.
    - **PagerDuty Escalation**: Route `COMPACTION_FAILED` alerts to PagerDuty via `io.kestra.plugin.pagerduty.notifications.PagerDutyAlert` for 24/7 on-call paging.

    ## Links

    - [Kestra Apache Pulsar Plugin Documentation](https://kestra.io/plugins/plugin-pulsar)
    - [Apache Pulsar Topic Compaction Architecture](https://pulsar.apache.org/docs/en/concepts-compaction/)
    - [Apache Pulsar Admin REST API Reference](https://pulsar.apache.org/docs/en/admin-api-overview/)
    - [Apache Pulsar Reader Interface Documentation](https://pulsar.apache.org/docs/en/concepts-clients/#reader-interface)

