id: aws-stepfunctions-failed-execution-sentinel
namespace: company.cloudops

inputs:
  - id: aws_region
    type: STRING
    defaults: us-east-1
    description: AWS region where the Step Functions state machine is deployed.
  - id: state_machine_arn
    type: STRING
    defaults: arn:aws:states:us-east-1:123456789012:stateMachine:order-fulfillment-pipeline
    description: ARN of the Step Functions state machine to monitor.
  - id: max_failed_executions_threshold
    type: INT
    defaults: 0
    description: Maximum permissible failed executions in a 15-minute window before alerting.

tasks:
  - id: query_failed_executions
    type: io.kestra.plugin.aws.cli.AwsCLI
    runner: PROCESS
    region: "{{ inputs.aws_region }}"
    accessKeyId: "{{ secret('AWS_ACCESS_KEY_ID') }}"
    secretKeyId: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
    commands:
      - |
        aws cloudwatch get-metric-statistics           --namespace AWS/States           --metric-name ExecutionsFailed           --dimensions Name=StateMachineArn,Value="{{ inputs.state_machine_arn }}"           --start-time $(date -u -v-15m +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || date -u -d "15 minutes ago" +%Y-%m-%dT%H:%M:%SZ)           --end-time $(date -u +%Y-%m-%dT%H:%M:%SZ)           --period 900           --statistics Sum           --output json > sfn_failed.json
        python3 -c "
        import json
        with open('sfn_failed.json') as f:
            dps = json.load(f).get('Datapoints', [])
        total_failed = int(sum(dp.get('Sum', 0) for dp in dps))
        result = {
            'state_machine_arn': '{{ inputs.state_machine_arn }}',
            'failed_executions': total_failed,
            'alert_triggered': total_failed > {{ inputs.max_failed_executions_threshold }}
        }
        with open('sfn_summary.json', 'w') as out:
            json.dump(result, out)
        print('Step Functions audit:', result)
        "
    outputFiles:
      - sfn_summary.json

  - id: evaluate_execution_failures
    type: io.kestra.plugin.core.flow.If
    condition: "{{ json(read(outputs.query_failed_executions.outputFiles['sfn_summary.json'])).alert_triggered }}"
    then:
      - id: alert_workflow_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "text": ":warning: *AWS Step Functions Failure Alert*: State machine `{{ inputs.state_machine_arn }}` experienced {{ json(read(outputs.query_failed_executions.outputFiles['sfn_summary.json'])).failed_executions }} failed executions in the last 15 minutes. Check execution history for unhandled step errors."
          }

errors:
  - id: notify_sentinel_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "text": ":warning: *Step Functions Sentinel Failure*: Failed to query CloudWatch metrics for `{{ inputs.state_machine_arn }}`."
      }

triggers:
  - id: scheduled_sfn_check
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  title: AWS Step Functions State Machine Execution Failure Sentinel
  shortDescription: Audits AWS Step Functions CloudWatch metrics to detect failed state machine executions and workflow aborts.
  description: |
    ## How it works
    This sentinel leverages `AwsCLI` to query CloudWatch for the `ExecutionsFailed` metric on the specified Step Functions state machine over rolling 15-minute periods. It detects workflow crashes, task timeouts, and caught exceptions, notifying pipeline maintainers before business processes stall.

    ## What you get
    - Continuous validation of asynchronous business workflow executions.
    - Rapid alerting on unhandled task exceptions or external dependency failures.
    - Automated Slack delivery detailing state machine ARN and failed execution count.

    ## Who it's for
    - Cloud engineers and backend developers coordinating distributed microservice workflows.
    - SREs maintaining mission-critical order processing and data ingest pipelines.

    ## Why orchestrate this with Kestra
    Kestra runs automated scheduled operational health checks with native error handling, secret injection, and multi-channel alerting.

    ## Prerequisites
    - AWS IAM credentials with `cloudwatch:GetMetricStatistics` permissions.
    - Secrets `AWS_ACCESS_KEY_ID`, `AWS_SECRET_ACCESS_KEY`, and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import this blueprint into Kestra.
    2. Configure `state_machine_arn`, `aws_region`, and credentials.
    3. Run manually to check current failure rates.

    ## How to extend
    - Query `aws stepfunctions list-executions --status-filter FAILED` to include the exact failure cause and input payload.
    - Trigger an automated retry subflow for transient dependency errors.
    - Forward failure metrics to Datadog or Prometheus.

    ## Links
    - [Kestra AWS Plugin](https://kestra.io/plugins/plugin-aws)
    - [Step Functions CloudWatch Metrics](https://docs.aws.amazon.com/step-functions/latest/dg/procedure-cw-metrics.html)
  tags:
    - Cloud
    - Infrastructure
  subTags:
    - Monitoring & Alerting
  ee: false
  demo: false
