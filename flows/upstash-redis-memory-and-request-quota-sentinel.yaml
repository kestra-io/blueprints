id: upstash-redis-memory-and-request-quota-sentinel
namespace: company.cache

description: |
  Audit Upstash Serverless Redis memory utilization against maxmemory thresholds on a schedule,
  detecting capacity saturation and quota pressure before applications experience OOM key
  evictions or rate limit exceptions.

inputs:
  - id: upstash_endpoint
    type: STRING
    defaults: "https://clean-elephant-12345.upstash.io"
    displayName: "Upstash REST Endpoint"
    description: "Base REST URL of the Upstash Redis database (found in the Upstash Console under Database Details)."

  - id: memory_warning_threshold_pct
    type: INT
    defaults: 80
    displayName: "Memory Warning Threshold (%)"
    description: "Saturation percentage threshold (0-100) above which the sentinel raises an operational incident alert."

  - id: notification_channel
    type: STRING
    defaults: "#platform-alerts"
    displayName: "Slack Alert Channel"
    description: "Target Slack channel for memory saturation warnings and remediation guidance."

  - id: remediation_mode
    type: SELECT
    values:
      - "ALERT_ONLY"
      - "LOG_GUIDANCE"
    defaults: "ALERT_ONLY"
    displayName: "Remediation Strategy"
    description: "Action taken when saturation is detected: dispatch a Slack notification or log key-level triage guidance."

triggers:
  - id: periodic_memory_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 */4 * * *"
    disabled: true
    inputs:
      upstash_endpoint: "https://clean-elephant-12345.upstash.io"
      memory_warning_threshold_pct: 80
      notification_channel: "#platform-alerts"
      remediation_mode: "ALERT_ONLY"

tasks:
  - id: query_upstash_info
    type: io.kestra.plugin.core.http.Request
    description: "Query Upstash Redis REST API to fetch real-time memory telemetry metrics."
    uri: "{{ inputs.upstash_endpoint }}/info/memory"
    method: GET
    headers:
      Authorization: "Bearer {{ secret('UPSTASH_REDIS_REST_TOKEN') }}"
      Content-Type: "application/json"
    contentType: "application/json"

  - id: parse_memory_metrics
    type: io.kestra.plugin.scripts.python.Script
    description: "Parse Redis INFO memory section, calculate utilization percentage, and classify saturation tier."
    containerImage: python:3.11-slim
    env:
      RAW_PAYLOAD: "{{ outputs.query_upstash_info.body }}"
      THRESHOLD_PCT: "{{ inputs.memory_warning_threshold_pct }}"
    script: |
      import os
      import json
      import sys

      raw_payload = os.environ.get("RAW_PAYLOAD", "")
      threshold = float(os.environ.get("THRESHOLD_PCT", "80"))

      try:
          data = json.loads(raw_payload) if isinstance(raw_payload, str) and raw_payload.startswith("{") else {}
          info_str = data.get("result", raw_payload)
      except Exception:
          info_str = raw_payload

      metrics = {}
      if isinstance(info_str, str):
          for line in info_str.splitlines():
              line = line.strip()
              if line and not line.startswith("#") and ":" in line:
                  k, v = line.split(":", 1)
                  metrics[k.strip()] = v.strip()

      used_bytes = int(metrics.get("used_memory", 0))
      max_bytes = int(metrics.get("maxmemory", 0))
      used_human = metrics.get("used_memory_human", "0B")
      max_human = metrics.get("maxmemory_human", "Unlimited" if max_bytes == 0 else f"{max_bytes}B")

      if max_bytes > 0:
          utilization_pct = round((used_bytes / max_bytes) * 100.0, 2)
      else:
          utilization_pct = 0.0

      status = "CRITICAL" if (max_bytes > 0 and utilization_pct >= threshold) else "HEALTHY"

      outputs = {
          "status": status,
          "utilization_pct": utilization_pct,
          "used_memory_bytes": used_bytes,
          "maxmemory_bytes": max_bytes,
          "used_memory_human": used_human,
          "maxmemory_human": max_human
      }

      print(f"Upstash Memory Audit: {used_human} / {max_human} ({utilization_pct}%) - Status: {status}")
      print("::" + json.dumps({"outputs": outputs}) + "::")

  - id: evaluate_memory_saturation
    type: io.kestra.plugin.core.flow.Switch
    description: "Route workflow execution based on whether Upstash memory utilization exceeds threshold."
    value: "{{ outputs.parse_memory_metrics.vars.status }}"
    cases:
      "HEALTHY":
        - id: log_memory_healthy
          type: io.kestra.plugin.core.log.Log
          description: "Record healthy audit result when memory consumption remains safely beneath threshold."
          message: "Upstash Redis memory utilization is healthy: {{ outputs.parse_memory_metrics.vars.utilization_pct }}% ({{ outputs.parse_memory_metrics.vars.used_memory_human }} / {{ outputs.parse_memory_metrics.vars.maxmemory_human }}). Operating beneath warning threshold ({{ inputs.memory_warning_threshold_pct }}%)."
      "CRITICAL":
        - id: alert_memory_saturation
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: "Dispatch urgent operational alert to Slack detailing Upstash memory saturation."
          url: "{{ secret('SLACK_WEBHOOK') }}"
          payload: |
            {
              "channel": "{{ inputs.notification_channel }}",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "🚨 Upstash Redis Memory Saturation Alert"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Database Endpoint:*\n`{{ inputs.upstash_endpoint }}`"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Current Utilization:*\n🔥 *{{ outputs.parse_memory_metrics.vars.utilization_pct }}%*"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Memory Allocated:*\n`{{ outputs.parse_memory_metrics.vars.used_memory_human }} / {{ outputs.parse_memory_metrics.vars.maxmemory_human }}`"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Warning Ceiling:*\n`{{ inputs.memory_warning_threshold_pct }}%`"
                    }
                  ]
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "⚠️ *Action Required:* The database has crossed the configured memory ceiling. Review unexpiring keys, run `SCAN` + `TTL` audits, or upgrade the Upstash memory limit to prevent key eviction."
                  }
                }
              ]
            }
        - id: log_remediation_guidance
          type: io.kestra.plugin.core.log.Log
          description: "Record diagnostic commands for platform and SRE teams to mitigate Redis memory exhaustion."
          message: "Upstash Saturation Remediation: Memory utilization is at {{ outputs.parse_memory_metrics.vars.utilization_pct }}%. Check keys without TTL using SCAN/TTL, review large hash or set keys, or increase maxmemory on console.upstash.com. Remediation mode: {{ inputs.remediation_mode }}."
    defaults:
      - id: log_unknown_state
        type: io.kestra.plugin.core.log.Log
        description: "Fallback logger for unclassified memory audit metrics."
        message: "Upstash Redis memory sentinel completed with unclassified metrics."

  - id: log_audit_completion
    type: io.kestra.plugin.core.log.Log
    description: "Record completion of the Upstash Redis memory sentinel inspection run."
    message: "Upstash Redis sentinel audit pass completed for '{{ inputs.upstash_endpoint }}'. Final status: {{ outputs.parse_memory_metrics.vars.status }} ({{ outputs.parse_memory_metrics.vars.utilization_pct }}% utilized)."

errors:
  - id: alert_on_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: "Dispatch urgent notification to Slack if sentinel execution encounters an unhandled exception."
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {"text": "Flow execution failed: upstash-redis-memory-and-request-quota-sentinel encountered an unhandled error during execution {{ execution.id }}."}

extend:
  title: Upstash Serverless Redis Memory & Quota Sentinel
  metaTitle: Upstash Redis Memory & Quota Sentinel Blueprint | Kestra
  shortDescription: Audit Upstash Serverless Redis memory usage and quota consumption on a schedule with proactive Slack alerting.
  metaDescription: Audit Upstash Serverless Redis memory utilization against maxmemory thresholds on a schedule and alert via Slack before out-of-memory errors occur.
  description: |
    Upstash Serverless Redis is widely adopted across modern web applications, Next.js serverless functions, and microservices for low-latency session caching, rate limiting, and ephemeral key-value storage. Unlike self-hosted Redis clusters where memory ceilings are managed on dedicated virtual machines, serverless databases operate within strict plan-based memory tiers and daily request ceilings. When caches experience runaway key creation or unexpiring session accumulations, databases cross the `maxmemory` threshold, leading to sudden key evictions, performance degradation, or application-level OOM exceptions.

    This blueprint implements an automated Day 2 operations sentinel for Upstash Serverless Redis. Operating on a periodic schedule, it directly inspects the Upstash REST API `INFO memory` telemetry, parses allocated bytes against plan ceilings, calculates real-time utilization percentages, and dispatches rich Slack alert cards with actionable remediation directives before production outages occur.

    ## How it works

    1. **Scheduled Invocation**: The workflow runs on a periodic schedule (`0 */4 * * *`, shipped disabled for safe initial configuration) or on demand.
    2. **Upstash REST Query**: `query_upstash_info` executes an HTTP GET request to `{{ inputs.upstash_endpoint }}/info/memory` using `io.kestra.plugin.core.http.Request`, authenticating securely using the bearer token secret `UPSTASH_REDIS_REST_TOKEN`.
    3. **Metric Extraction & Parsing**: `parse_memory_metrics` runs inside an isolated `python:3.11-slim` container, parsing `used_memory`, `maxmemory`, `used_memory_human`, and `maxmemory_human`. It calculates the saturation ratio `(used_memory / maxmemory) * 100` and determines operational status (`CRITICAL` vs `HEALTHY`).
    4. **Operational Branching**: `evaluate_memory_saturation` utilizes `io.kestra.plugin.core.flow.Switch` to evaluate the classified status:
       - **When Healthy**: Emits an audit log confirming normal memory headroom.
       - **When Saturated**: Invokes `io.kestra.plugin.slack.notifications.SlackIncomingWebhook` to dispatch a formatted alert card to `#platform-alerts` detailing current utilization, allocated memory, and suggested triage commands (`SCAN` + `TTL`).
    5. **Telemetry Logging**: `log_audit_completion` records the overall audit summary and key utilization metrics.
    6. **Error Resilience**: A dedicated `errors` handler catches HTTP connection timeouts or authentication failures, ensuring on-call teams are alerted if the health check itself cannot reach the database.

    ## What you get

    - **Automated OOM Prevention**: Continuous inspection of Upstash memory allocation identifies runaway cache growth hours before eviction policies impact users.
    - **Zero Infrastructure Footprint**: Runs completely serverless using Kestra native tasks and containerized Python parsing, requiring no persistent monitoring agents.
    - **Actionable Slack Alerts**: Context-rich Slack messages direct SRE and platform engineers immediately to the offending database endpoint with concrete remediation directives.
    - **Flexible Thresholds**: Configurable percentage thresholds allow tailoring alerts to match development vs production reliability tiers.

    ## Who it's for

    - **Platform Engineers & Site Reliability Engineers (SREs)** maintaining serverless data layers and serverless Redis infrastructure.
    - **Backend & Full-Stack Developers** operating Next.js or cloud-native applications backed by Upstash Redis.
    - **Database Administrators (DBAs)** tasked with monitoring cache memory health and capacity planning.

    ## Why orchestrate this with Kestra

    Building custom cron jobs or Lambda functions to poll Redis metrics introduces unmonitored scripts, scattered secrets, and brittle alert plumbing. Kestra provides:
    - **Declarative YAML Orchestration**: The entire monitoring and alert topology is codified in version-controlled YAML with transparent execution history.
    - **Encrypted Secret Management**: Upstash REST credentials and Slack incoming webhook URLs remain securely encrypted and masked in all execution logs.
    - **Built-in Flow Logic**: Native `Switch` branching and containerized Python scripts provide robust error recovery without external microservice dependencies.

    ## Prerequisites

    - An active Upstash Redis database from [console.upstash.com](https://console.upstash.com).
    - An incoming Slack webhook URL for operational alerting.

    ### Secrets

    Configure the following secrets in your Kestra namespace or instance settings:

    | Secret Name | Description | Example |
    |---|---|---|
    | `UPSTASH_REDIS_REST_TOKEN` | Upstash Redis REST API authentication bearer token | `AX7rASQg...` |
    | `SLACK_WEBHOOK` | Incoming webhook URL for destination Slack channel | `https://hooks.slack.com/services/T00/B00/X00` |

    ## Quick start

    1. In Kestra, navigate to **Flows** and import this blueprint into your designated namespace (e.g., `company.cache`).
    2. Add your `UPSTASH_REDIS_REST_TOKEN` and `SLACK_WEBHOOK` into **Settings > Secrets**.
    3. Click **Execute** and provide your database's `upstash_endpoint` to test the audit pass.
    4. Review execution logs to verify memory parsing and ensure the Slack alert card renders properly.
    5. In the flow definition, toggle `disabled: false` on `periodic_memory_audit` to activate the automated 4-hour monitoring schedule.

    ## How to extend

    - **Automated Key Eviction Sweep**: Chain a downstream task using `io.kestra.plugin.scripts.python.Script` to run `SCAN` and automatically delete expired or untagged temporary keys when memory exceeds 95%.
    - **PagerDuty Integration**: Add an `io.kestra.plugin.pagerduty.Incident` task within the `CRITICAL` branch to escalate persistent memory exhaustion to on-call engineers.
    - **Multi-Database Fanout**: Replace the single endpoint input with a `io.kestra.plugin.core.flow.ForEach` loop iterating over an array of Upstash database endpoints across regions.

    ## Links

    - [Upstash Redis REST API Documentation](https://upstash.com/docs/redis/features/restapi)
    - [Kestra HTTP Request Plugin Documentation](https://kestra.io/plugins/core/http/io.kestra.plugin.core.http.request)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Monitoring & Alerting
    - Day 2 Operations
  ee: false
  demo: false
