id: openfda-pharmaceutical-drug-safety-lakehouse-loader
namespace: company.analytics
description: Ingests pharmaceutical adverse drug events, patient reaction profiles, and medicinal classifications from openFDA API into DuckDB, exports Parquet and analytics datasets, and manages sync state with Kestra KV store.

inputs:
  - id: limit
    type: INT
    description: Number of drug adverse event safety reports to ingest per sync run.
    defaults: 50

  - id: state_key
    type: STRING
    description: Kestra KV store key tracking processed openFDA safety report IDs.
    defaults: openfda_drug_adverse_events_state

variables:
  default_state: "[]"

triggers:
  - id: weekly_fda_drug_sync
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 8 * * 3"

tasks:
  - id: get_current_state
    type: io.kestra.plugin.core.kv.Get
    key: "{{ inputs.state_key }}"
    errorOnMissing: false

  - id: ingest_and_transform_drug_events
    type: io.kestra.plugin.scripts.python.Commands
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install requests duckdb
    commands:
      - |
        python3 - << 'PYEOF'
        import os
        import json
        import requests
        import duckdb
        from datetime import datetime, timezone

        raw_state = """{{ outputs.get_current_state.value ?? vars.default_state }}"""
        try:
            seen_ids = set(json.loads(raw_state))
        except Exception:
            seen_ids = set()

        url = "https://api.fda.gov/drug/event.json"
        headers = {"User-Agent": "KestraLakehouseLoader/1.0 (kestra-data-pipeline; contact@company.internal)"}
        params = {"limit": {{ inputs.limit }}}

        resp = requests.get(url, headers=headers, params=params, timeout=30)
        resp.raise_for_status()
        data = resp.json()
        results = data.get("results", [])

        records = []
        now_iso = datetime.now(timezone.utc).isoformat()
        current_report_ids = []

        for item in results:
            safety_report_id = item.get("safetyreportid", "UNKNOWN")
            current_report_ids.append(safety_report_id)
            receivedate = item.get("receivedate", "UNKNOWN")
            serious = item.get("serious", 1)
            seriousness_death = item.get("seriousnessdeath", 0)

            patient = item.get("patient", {})
            patient_onset_age = patient.get("patientonsetage", "UNKNOWN")
            patient_sex = patient.get("patientsex", "UNKNOWN")

            drugs = patient.get("drug", [])
            primary_drug = "UNKNOWN"
            indication = "UNKNOWN"
            if drugs and isinstance(drugs, list):
                d0 = drugs[0]
                primary_drug = d0.get("medicinalproduct", primary_drug)
                indication = d0.get("drugindication", indication)

            reactions = patient.get("reaction", [])
            primary_reaction = "UNKNOWN"
            if reactions and isinstance(reactions, list):
                primary_reaction = reactions[0].get("reactionmeddrapt", primary_reaction)

            records.append({
                "safety_report_id": str(safety_report_id),
                "receivedate": str(receivedate),
                "serious": int(serious if str(serious).isdigit() else 0),
                "seriousness_death": int(seriousness_death if str(seriousness_death).isdigit() else 0),
                "patient_onset_age": str(patient_onset_age),
                "patient_sex": str(patient_sex),
                "primary_drug": str(primary_drug),
                "drug_indication": str(indication),
                "primary_reaction": str(primary_reaction),
                "is_new": bool(safety_report_id not in seen_ids),
                "ingestion_timestamp": now_iso
            })

        con = duckdb.connect(database=":memory:")
        con.execute("""
            CREATE TABLE fda_drug_events (
                safety_report_id VARCHAR,
                receivedate VARCHAR,
                serious INTEGER,
                seriousness_death INTEGER,
                patient_onset_age VARCHAR,
                patient_sex VARCHAR,
                primary_drug VARCHAR,
                drug_indication VARCHAR,
                primary_reaction VARCHAR,
                is_new BOOLEAN,
                ingestion_timestamp VARCHAR
            );
        """)

        if records:
            con.execute("INSERT INTO fda_drug_events SELECT * FROM read_json_auto(?)", [json.dumps(records)])

        con.execute("COPY fda_drug_events TO 'fda_drug_adverse_events.parquet' (FORMAT PARQUET, COMPRESSION ZSTD);")
        con.execute("""
            COPY (
                SELECT
                    primary_reaction,
                    COUNT(*) AS event_count
                FROM fda_drug_events
                GROUP BY 1
                ORDER BY event_count DESC
            ) TO 'drug_events_summary_by_reaction.csv' (HEADER, DELIMITER ',');
        """)

        new_count = con.execute("SELECT count(*) FROM fda_drug_events WHERE is_new = true").fetchone()[0]
        total_count = con.execute("SELECT count(*) FROM fda_drug_events").fetchone()[0]

        updated_ids = list(seen_ids.union(current_report_ids))
        with open("updated_state.json", "w") as f:
            json.dump(updated_ids, f)

        metrics = {
            "total_extracted": total_count,
            "new_drug_events": new_count,
            "synced_at": now_iso
        }
        with open("metrics.json", "w") as f:
            json.dump(metrics, f)

        print(f"Lakehouse sync complete. Processed {total_count} drug safety events ({new_count} newly observed).")
        PYEOF
    outputFiles:
      - fda_drug_adverse_events.parquet
      - drug_events_summary_by_reaction.csv
      - updated_state.json
      - metrics.json

  - id: update_state
    type: io.kestra.plugin.core.kv.Set
    key: "{{ inputs.state_key }}"
    value: "{{ read(outputs.ingest_and_transform_drug_events.outputFiles['updated_state.json']) }}"

  - id: analyze_and_notify
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.ingest_and_transform_drug_events.outputFiles['fda_drug_adverse_events.parquet'] != null }}"
    then:
      - id: log_metrics
        type: io.kestra.plugin.core.log.Log
        message: "openFDA Pharmaceutical Drug Safety sync succeeded. Metrics: {{ read(outputs.ingest_and_transform_drug_events.outputFiles['metrics.json']) }}"
