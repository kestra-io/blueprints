id: pgvector-unindexed-vector-column-index-guard
namespace: company.team

inputs:
  - id: postgres_url
    type: STRING
    defaults: jdbc:postgresql://localhost:5432/postgres
    description: >-
      PostgreSQL JDBC URL for the database that holds the pgvector columns. Example jdbc:postgresql://postgres:5432/app.

  - id: use_secret_auth
    type: BOOL
    defaults: true
    description: >-
      Leave true in production so the connection reads POSTGRES_USERNAME and POSTGRES_PASSWORD from secrets. Set false only to pass credentials inline in a disposable test environment.

  - id: postgres_username
    type: STRING
    defaults: postgres
    description: Username used only when use_secret_auth is false. Ignored in production.

  - id: postgres_password
    type: STRING
    defaults: ""
    description: Password used only when use_secret_auth is false. Ignored in production.

  - id: only_schema
    type: STRING
    defaults: ""
    description: >-
      Optional single schema to restrict the scan to. Leave empty to scan every user schema in the database.

  - id: distance_metric
    type: SELECT
    values:
      - cosine
      - l2
      - inner_product
    defaults: cosine
    description: >-
      The distance your similarity queries actually use. cosine for the <=> operator, l2 for <->, inner_product for <#>. The operator class of the index is derived from this and from the column type, because an HNSW index built for one distance is never used by a query that asks for another.

  - id: min_table_rows
    type: INT
    defaults: 1000
    description: >-
      Smallest estimated row count that earns an index. A sequential scan over a few hundred rows is cheaper than building and maintaining a graph, so smaller tables are skipped entirely.

  - id: flag_opclass_mismatch
    type: BOOL
    defaults: false
    description: >-
      When true, also report a column that has a valid ANN index built for a different distance than distance_metric. Such an index exists, consumes memory and is never used by the query. Remediation adds a second index with the matching operator class and never drops the one that is there.

  - id: dry_run
    type: BOOL
    defaults: true
    description: When true, report the missing indexes without creating anything.

  - id: auto_remediate
    type: BOOL
    defaults: false
    description: >-
      When true and dry_run is false, create each missing HNSW index behind an approval gate, then re-read pg_index.

variables:
  detect_sql: |
    WITH cfg AS (
      SELECT '{{ inputs.distance_metric }}'::text AS metric,
             {{ inputs.flag_opclass_mismatch }}::boolean AS flag_mismatch,
             {{ inputs.min_table_rows }}::bigint AS min_rows,
             '{{ inputs.only_schema }}'::text AS only_schema
    ), vcols AS (
      SELECT c.oid AS relid, n.nspname AS table_schema, c.relname AS table_name,
             a.attnum, a.attname AS column_name, t.typname AS col_type,
             greatest(c.reltuples, 0)::bigint AS est_rows
        FROM pg_attribute a
        JOIN pg_class c ON c.oid = a.attrelid
        JOIN pg_namespace n ON n.oid = c.relnamespace
        JOIN pg_type t ON t.oid = a.atttypid
       WHERE a.attnum > 0 AND NOT a.attisdropped
         AND c.relkind IN ('r', 'm', 'p')
         AND n.nspname NOT IN ('pg_catalog', 'information_schema')
         AND t.typname IN ('vector', 'halfvec')
    ), ann AS (
      SELECT i.indrelid AS relid, ic.relname AS index_name, am.amname AS index_method, i.indisvalid,
             (SELECT k FROM unnest(i.indkey::int2[]) WITH ORDINALITY u(k, o) WHERE o = 1) AS key_attnum,
             (SELECT op.opcname FROM unnest(i.indclass::oid[]) WITH ORDINALITY u(cls, o)
                JOIN pg_opclass op ON op.oid = u.cls WHERE o = 1) AS opclass
        FROM pg_index i
        JOIN pg_class ic ON ic.oid = i.indexrelid
        JOIN pg_am am ON am.oid = ic.relam
       WHERE am.amname IN ('hnsw', 'ivfflat')
    ), want AS (
      SELECT v.*, cfg.metric, cfg.flag_mismatch, cfg.min_rows,
             v.col_type || '_' || (CASE cfg.metric WHEN 'cosine' THEN 'cosine' WHEN 'l2' THEN 'l2' ELSE 'ip' END) || '_ops' AS wanted_opclass,
             CASE cfg.metric WHEN 'cosine' THEN '<=>' WHEN 'l2' THEN '<->' ELSE '<#>' END AS distance_operator,
             left(v.table_name || '_' || v.column_name || '_hnsw_' || (CASE cfg.metric WHEN 'cosine' THEN 'cosine' WHEN 'l2' THEN 'l2' ELSE 'ip' END) || '_idx', 63) AS index_name
        FROM vcols v CROSS JOIN cfg
       WHERE (cfg.only_schema = '' OR v.table_schema = cfg.only_schema)
    ), state AS (
      SELECT w.*,
        (SELECT count(*) FROM ann WHERE ann.relid = w.relid AND ann.key_attnum = w.attnum AND ann.indisvalid) AS valid_ann,
        (SELECT count(*) FROM ann WHERE ann.relid = w.relid AND ann.key_attnum = w.attnum AND ann.indisvalid AND ann.opclass = w.wanted_opclass) AS matching_ann,
        (SELECT string_agg(ann.index_name || ' (' || ann.index_method || ' ' || coalesce(ann.opclass, 'unknown') || ')', ', ' ORDER BY ann.index_name)
           FROM ann WHERE ann.relid = w.relid AND ann.key_attnum = w.attnum AND ann.indisvalid) AS existing_indexes,
        (SELECT string_agg(ann.index_name, ', ' ORDER BY ann.index_name)
           FROM ann WHERE ann.relid = w.relid AND ann.key_attnum = w.attnum AND NOT ann.indisvalid) AS invalid_indexes
      FROM want w
    )
    SELECT table_schema, table_name, column_name, col_type, est_rows, metric,
           distance_operator, wanted_opclass, index_name,
           CASE WHEN valid_ann = 0 THEN 'no_ann_index' ELSE 'opclass_mismatch' END AS finding,
           coalesce(existing_indexes, '') AS existing_indexes,
           coalesce(invalid_indexes, '') AS invalid_indexes,
           (table_schema || '.' || table_name || '.' || column_name) AS target,
           format('CREATE INDEX IF NOT EXISTS %I ON %I.%I USING hnsw (%I %s)',
                  index_name, table_schema, table_name, column_name, wanted_opclass) AS fix_sql
      FROM state
     WHERE matching_ann = 0
       AND (valid_ann = 0 OR flag_mismatch)
       AND est_rows >= min_rows
     ORDER BY est_rows DESC, table_schema, table_name, column_name

tasks:
  - id: detect
    type: io.kestra.plugin.jdbc.postgresql.Query
    description: >-
      Read-only. Join pg_attribute to pg_type to find every vector and halfvec column, then look for a valid hnsw or ivfflat index whose first key column is that column. A column with no such index is a finding. So is one built for a different distance when flag_opclass_mismatch is on. Each row carries the operator class the metric needs and the exact CREATE INDEX statement, built inside PostgreSQL with format('%I').
    url: "{{ inputs.postgres_url }}"
    username: "{{ inputs.use_secret_auth ? secret('POSTGRES_USERNAME') : inputs.postgres_username }}"
    password: "{{ inputs.use_secret_auth ? secret('POSTGRES_PASSWORD') : inputs.postgres_password }}"
    fetchType: FETCH
    sql: "{{ render(vars.detect_sql) }}"

  - id: summarize
    type: io.kestra.plugin.core.output.OutputValues
    description: >-
      Build the readable target list and the JSON the remediation loop iterates, once, so the log, the alert and the loop all read the same set.
    values:
      names: >-
        {{ outputs.detect.rows | jq('map(.target + " [" + .col_type + " " + (.est_rows | tostring) + " rows, needs " + .wanted_opclass + " for " + .distance_operator + ", " + .finding + "]") | join(" | ")') | first }}
      targets_json: "{{ outputs.detect.rows | toJson }}"

  - id: log_detect
    type: io.kestra.plugin.core.log.Log
    message: |
      pgvector columns without a usable ANN index for {{ inputs.distance_metric }}: {{ outputs.detect.size }} found.
      Targets: {{ outputs.summarize.values.names }}
      Mode: dry_run={{ inputs.dry_run }} auto_remediate={{ inputs.auto_remediate }} metric={{ inputs.distance_metric }} min_table_rows={{ inputs.min_table_rows }} flag_opclass_mismatch={{ inputs.flag_opclass_mismatch }}

  - id: guard
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.detect.size > 0 }}"
    then:
      - id: findings_alert
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: >-
          Alert on every detection, in dry run as well as in remediate mode, so a human sees the columns that scan even when nothing is built.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {"text": "pgvector index guard: {{ outputs.detect.size }} vector column(s) have no usable {{ inputs.distance_metric }} ANN index, so every similarity query scans the table and computes a distance per row. Targets {{ outputs.summarize.values.names }}. dry_run={{ inputs.dry_run }} auto_remediate={{ inputs.auto_remediate }}."}

      - id: mode
        type: io.kestra.plugin.core.flow.If
        condition: "{{ inputs.auto_remediate and not inputs.dry_run and outputs.detect.size > 0 }}"
        then:
          - id: approval_gate
            type: io.kestra.plugin.core.flow.Pause
            description: >-
              Hold the run until a human approves the index builds. An HNSW build reads every row, holds a lock that blocks writes on the table for the whole build and is bounded by maintenance_work_mem, so the window is a human decision.
            pauseDuration: PT2H
            behavior: FAIL
            onResume:
              - id: approved
                type: BOOL
                defaults: false
                description: >-
                  Set true to build the listed HNSW indexes. Anything else leaves them unbuilt.

          - id: apply
            type: io.kestra.plugin.core.flow.If
            condition: "{{ outputs.approval_gate.onResume.approved ?? false }}"
            then:
              - id: remediate_indexes
                type: io.kestra.plugin.core.flow.Loop
                description: >-
                  Remediation loop. One CREATE INDEX USING hnsw per target, concurrencyLimit 1 so two builds never compete for maintenance_work_mem or for the same table lock. allowFailure so one rejected build does not stop the pass. The re-read of pg_index stays the real gate.
                concurrencyLimit: 1
                values: "{{ outputs.summarize.values.targets_json }}"
                tasks:
                  - id: create_index
                    type: io.kestra.plugin.jdbc.postgresql.Query
                    description: Build one HNSW index with the operator class the metric needs.
                    allowFailure: true
                    url: "{{ inputs.postgres_url }}"
                    username: "{{ inputs.use_secret_auth ? secret('POSTGRES_USERNAME') : inputs.postgres_username }}"
                    password: "{{ inputs.use_secret_auth ? secret('POSTGRES_PASSWORD') : inputs.postgres_password }}"
                    fetchType: NONE
                    sql: "{{ fromJson(item.value).fix_sql }}"

                  - id: create_log
                    type: io.kestra.plugin.core.log.Log
                    message: "Ran {{ fromJson(item.value).fix_sql }}"

              - id: reverify
                type: io.kestra.plugin.jdbc.postgresql.Query
                description: >-
                  Re-run the same detection. It only counts an index that pg_index reports as valid, so a build that failed part way and left an invalid index still reads as uncovered.
                url: "{{ inputs.postgres_url }}"
                username: "{{ inputs.use_secret_auth ? secret('POSTGRES_USERNAME') : inputs.postgres_username }}"
                password: "{{ inputs.use_secret_auth ? secret('POSTGRES_PASSWORD') : inputs.postgres_password }}"
                fetchType: FETCH
                sql: "{{ render(vars.detect_sql) }}"

              - id: verify_plan
                type: io.kestra.plugin.core.output.OutputValues
                description: >-
                  Keep only the columns that were targets and are still uncovered. A column that gained rows and crossed min_table_rows during the run was not a target, so it does not fail the run.
                values:
                  still_json: >-
                    {{ {'t': outputs.detect.rows, 'r': outputs.reverify.rows} | toJson | jq('(.r | map(.target)) as $rem | .t | map(select(([.target] - $rem) | length == 0))') | first | toJson }}
                  still_names: >-
                    {{ {'t': outputs.detect.rows, 'r': outputs.reverify.rows} | toJson | jq('(.r | map(.target)) as $rem | .t | map(select(([.target] - $rem) | length == 0) | .target) | join(" | ")') | first }}
                  still_invalid: >-
                    {{ outputs.reverify.rows | jq('map(select(.invalid_indexes != "") | .target + " invalid index " + .invalid_indexes) | join(" | ")') | first }}

              - id: verify_result
                type: io.kestra.plugin.core.flow.If
                condition: "{{ (outputs.verify_plan.values.still_json | jq('length') | first) > 0 }}"
                then:
                  - id: remediation_failed
                    type: io.kestra.plugin.core.execution.Fail
                    errorMessage: >-
                      {{ outputs.verify_plan.values.still_json | jq('length') | first }} targeted column(s) still have no valid HNSW index for {{ inputs.distance_metric }}: {{ outputs.verify_plan.values.still_names }}. Invalid indexes left behind: {{ outputs.verify_plan.values.still_invalid }}. The build may have run out of maintenance_work_mem or the connecting role may not own the table.
                else:
                  - id: remediated
                    type: io.kestra.plugin.core.log.Log
                    message: "Built and verified. {{ outputs.detect.size }} column(s) had no usable {{ inputs.distance_metric }} index before, 0 of them after. Every new index is valid in pg_index."
            else:
              - id: not_approved
                type: io.kestra.plugin.core.log.Log
                message: "Approval not granted, so nothing was built. {{ outputs.detect.size }} column(s) still scan on every similarity query."
        else:
          - id: report_only
            type: io.kestra.plugin.core.log.Log
            message: "Report only (dry_run={{ inputs.dry_run }}, auto_remediate={{ inputs.auto_remediate }}). {{ outputs.detect.size }} index(es) would be built: {{ outputs.summarize.values.names }}. No change made."
    else:
      - id: clean
        type: io.kestra.plugin.core.log.Log
        message: "Every vector and halfvec column in scope above min_table_rows has a valid ANN index for {{ inputs.distance_metric }}. Nothing to build."

errors:
  - id: alert_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: >-
      Post to Slack on any failure, including a connection error, a rejected build or targeted columns still uncovered after the pass.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {"text": "pgvector unindexed vector column index guard FAILED (execution {{ execution.id }}). A connection error, a rejected CREATE INDEX or targeted columns still without a valid HNSW index. Check the run."}

triggers:
  - id: weekly_vector_index_check
    type: io.kestra.plugin.core.trigger.Schedule
    disabled: true
    cron: "0 4 * * 1"
    description: >-
      Weekly sweep for vector columns that grew past min_table_rows without an index. Disabled by default and pinned to safe mode so it reports without building anything until an operator enables it.
    inputs:
      dry_run: true
      auto_remediate: false

extend:
  title: pgvector Unindexed Vector Column Index Guard
  shortDescription: Find pgvector vector and halfvec columns with no ANN index, build an HNSW index whose operator class matches the distance operator the queries use, then re-read pg_index and fail if the index is missing or invalid.
  metaTitle: pgvector Unindexed Vector Column Index Guard with Kestra
  metaDescription: Find pgvector columns with no HNSW or IVFFlat index, build an HNSW index with the operator class matching your distance operator, then verify pg_index.
  description: |
    A `vector` or `halfvec` column with no approximate nearest neighbour index makes every similarity query a sequential scan with an exact distance computed for each row. On a few thousand development rows that is milliseconds. At a few million it is seconds per query. Nothing in PostgreSQL warns you. There is no `pg_stat` counter for it and no log line. The query keeps returning the right answer, slower every week.

    The part that catches people twice is the operator class. An HNSW index is built for one distance function. `vector_cosine_ops` serves `<=>`, `vector_l2_ops` serves `<->`, `vector_ip_ops` serves `<#>`, with `halfvec_cosine_ops`, `halfvec_l2_ops` and `halfvec_ip_ops` for half precision columns. Build the index for the wrong one and the planner simply never uses it, so you pay for the build, pay the memory and still get the sequential scan. This guard takes the distance your queries use as an input and derives the operator class from it and from the column type.

    This blueprint was created by [zkasuran](https://github.com/zkasuran).

    ## Safety

    - Read-only by default. `dry_run` is true and `auto_remediate` is false, so a plain run reports and never builds an index.
    - A build happens only when `auto_remediate` is true and `dry_run` is false. It then waits for a human to resume the `Pause` with `approved` set true. An unanswered gate reads as not approved.
    - The gate matters here more than in most guards. `CREATE INDEX USING hnsw` reads every row, builds a graph bounded by `maintenance_work_mem` and holds a lock that blocks writes on the table until it finishes. On a large table that is minutes to hours, so the window is a human decision, not a schedule's.
    - Building an index is additive. It changes no row and no query result, only the plan. `IF NOT EXISTS` makes a repeat run a no-op.
    - A column that already has a valid ANN index is left alone. With `flag_opclass_mismatch` on, a column whose index is built for a different distance is reported and gains a second index for the right one. The existing index is never dropped.
    - `min_table_rows` keeps small tables out. A sequential scan over a few hundred rows beats a graph that has to be maintained.
    - The re-read of `pg_index` is the real gate. It counts only `indisvalid` indexes, so a build that failed part way and left an invalid index fails the run instead of reporting success.

    ## How it works

    1. `detect` (`io.kestra.plugin.jdbc.postgresql.Query`, read-only) joins `pg_attribute` to `pg_type` to find every `vector` and `halfvec` column on a table, materialized view or partitioned table outside the system schemas, then looks in `pg_index` for a valid `hnsw` or `ivfflat` index whose first key column is that column. It derives the wanted operator class from `distance_metric` and the column type, then returns one row per column with no matching index, with the estimated row count, the distance operator, the indexes that do exist and the exact `CREATE INDEX ... USING hnsw` statement built with `format('%I')`.
    2. `summarize` (`io.kestra.plugin.core.output.OutputValues`) builds the readable target list and the JSON the loop iterates, so the log, the alert and the loop read the same set.
    3. `log_detect` (`io.kestra.plugin.core.log.Log`) logs the count, the targets and the mode.
    4. `guard` (`io.kestra.plugin.core.flow.If`) branches on the count. With none found, `clean` logs and the run ends. Otherwise `findings_alert` posts the finding on every detection.
    5. `mode` (`io.kestra.plugin.core.flow.If`) enters the remediation branch only when `auto_remediate` is true and `dry_run` is false. Otherwise `report_only` lists what would be built and stops.
    6. `approval_gate` (`io.kestra.plugin.core.flow.Pause`) holds the run for a human. `remediate_indexes` (`io.kestra.plugin.core.flow.Loop`, `concurrencyLimit: 1`) then runs one `CREATE INDEX USING hnsw` per target, in turn, so two builds never compete for `maintenance_work_mem`.
    7. `reverify` re-runs the detection and `verify_result` fails the run through `io.kestra.plugin.core.execution.Fail` if any targeted column still has no valid HNSW index. The message names any invalid index left behind.

    ## What you get

    - Every `vector` and `halfvec` column that turns a similarity query into a sequential scan, largest table first, with the indexes it does have.
    - The operator class matched to the distance operator, which is the difference between an index the planner uses and one it ignores.
    - Half precision columns handled as their own type, with `halfvec_*_ops` rather than the `vector_*_ops` that would be rejected.
    - Optional detection of a column whose index is built for the wrong distance, which looks indexed in `\d` and is never used.
    - A real verification step. The run passes only when the second read of `pg_index` shows a valid index on every target.
    - Slack alerts on the findings and on any failure.

    ## Who it's for

    - Teams running retrieval augmented generation or semantic search on PostgreSQL with pgvector, where the embedding table grows every day.
    - Platform engineers who inherited a pgvector schema from an ORM migration or a notebook and have no idea which columns are indexed.
    - Anyone whose vector search got slow after a backfill and who needs to know whether the index is missing, invalid or built for the wrong distance.

    ## Why orchestrate this with Kestra

    The catalog query answers it once. Kestra runs it every week and after every backfill, so a column that crossed the threshold overnight is caught before the latency shows up in a dashboard. The build sits behind `auto_remediate`, `dry_run` and a `Pause`, which is what a write locking index build needs. One task per build keeps a failure isolated, the re-read of `pg_index` decides whether the run passed. The execution history records which index was built on which column and when.

    ## Tested end to end

    On Kestra 2.0.5 OSS against `pgvector/pgvector:pg16` (pgvector 0.8.2), with a local HTTP sink standing in for Slack. Seeded in one database:

    - `docs.embedding` `vector(3)`, 20,000 rows, no index;
    - `docs.title_embedding` `vector(3)`, an existing `hnsw` index with `vector_cosine_ops`;
    - `docs.body_embedding` `vector(3)`, an existing `ivfflat` index with `vector_l2_ops`;
    - `notes.summary` `halfvec(3)`, 5,000 rows, no index;
    - `plain_items`, no vector column.

    | Run | Inputs | Result |
    |---|---|---|
    | 1 | defaults, healthy state | 0 findings, `clean` logged |
    | 2 | defaults, degraded state | 2 findings, `docs.embedding` needing `vector_cosine_ops` and `notes.summary` needing `halfvec_cosine_ops`. The two indexed columns and `plain_items` are absent. Alert sent |
    | 3 | `auto_remediate: true`, `dry_run: true` | Same 2 findings, nothing built, `report_only` |
    | 4 | `auto_remediate: true`, `dry_run: false`, approved | 2 HNSW indexes built and verified, both `indisvalid` in `pg_index`, re-read reports 0 |
    | 5 | `auto_remediate: true`, `dry_run: false`, resumed without approval | nothing built, `not_approved` |
    | 6 | `flag_opclass_mismatch: true` | `docs.body_embedding` reported, its `ivfflat` `vector_l2_ops` index cannot serve `<=>`. `docs.title_embedding` stays clean |
    | 7 | unreachable database | run failed and the `errors` block posted to Slack |

    The plan is the evidence. `EXPLAIN SELECT id FROM docs ORDER BY embedding <=> '[0.1,0.2,0.3]' LIMIT 5` was a `Seq Scan on docs` under a sort before the run. It became an `Index Scan using docs_embedding_hnsw_cosine_idx on docs` after it.

    ## Prerequisites

    - pgvector installed in the database (`CREATE EXTENSION vector`). The detection reads `pg_attribute`, `pg_type`, `pg_index`, `pg_opclass` and `pg_am`, which any role can read.
    - Remediation needs a role that owns the tables, since `CREATE INDEX` does.
    - Raise `maintenance_work_mem` for the session or the database before a large build. pgvector builds the graph in memory and falls back to a much slower on disk build when it does not fit.
    - Local testing:
      - `docker run -d --name pgvec -p 5432:5432 -e POSTGRES_PASSWORD=pg pgvector/pgvector:pg16`;
      - `CREATE EXTENSION vector`, then a table with a `vector` column, some rows and no index.

    ### Secrets

    - `POSTGRES_USERNAME` and `POSTGRES_PASSWORD`: credentials used by every query.
    - `SLACK_WEBHOOK_URL`: used by `findings_alert` and the `errors` block.
    - In Kestra OSS, provide each one as a base64 encoded environment variable prefixed `SECRET_`.

    ### Inputs

    | Input | Default | Purpose |
    |---|---|---|
    | `postgres_url` | `jdbc:postgresql://localhost:5432/postgres` | Database to check |
    | `use_secret_auth` | `true` | Read credentials from secrets. Set false only in a disposable test |
    | `postgres_username` | `postgres` | Inline username when `use_secret_auth` is false |
    | `postgres_password` | empty | Inline password when `use_secret_auth` is false |
    | `only_schema` | empty | Restrict to one schema |
    | `distance_metric` | `cosine` | The distance the queries use, which fixes the operator class |
    | `min_table_rows` | `1000` | Smallest table that earns an index |
    | `flag_opclass_mismatch` | `false` | Also report an index built for another distance |
    | `dry_run` | `true` | Must be `false` for an index to be built |
    | `auto_remediate` | `false` | Must be `true` for an index to be built |

    ## Quick start

    1. Add the `POSTGRES_USERNAME`, `POSTGRES_PASSWORD` and `SLACK_WEBHOOK_URL` secrets.
    2. Import the flow and set `postgres_url`.
    3. Set `distance_metric` to the operator your searches use. Grep the application for `<=>`, `<->` or `<#>` if you are not sure.
    4. Run it once and read the findings, largest table first.
    5. Run it again with `flag_opclass_mismatch: true` to see whether an index you already have can serve that operator at all.
    6. Run it with `auto_remediate: true` and `dry_run: false` in a maintenance window, raise `maintenance_work_mem` first, then resume the `Pause` with `approved` set true.
    7. Enable the `weekly_vector_index_check` trigger, which always runs in safe mode.

    ## How to extend

    - Swap the statement for `CREATE INDEX CONCURRENTLY` when you cannot take a write lock. It is slower and leaves an invalid index behind on failure, which the `reverify` step already catches.
    - Tune the graph with `WITH (m = 16, ef_construction = 64)` in `fix_sql` for recall against build time.
    - Set `maintenance_work_mem` per database with `ALTER DATABASE ... SET maintenance_work_mem` so every build gets the memory it needs.
    - Choose `ivfflat` instead for a table that is loaded once and rarely updated, where a smaller index matters more than recall on inserts.
    - Loop over several JDBC URLs to sweep every database of a cluster.
    - Add a second run with a different `distance_metric` if parts of the application use different operators on the same column.

    ## Links

    - pgvector indexing: https://github.com/pgvector/pgvector#indexing
    - HNSW index options: https://github.com/pgvector/pgvector#hnsw
    - PostgreSQL plugin: https://kestra.io/plugins/plugin-jdbc-postgres
  tags:
    - Data
    - Infrastructure
  subTags:
    - Day 2 Operations
    - Vector Stores & RAG
  ee: false
  demo: false
