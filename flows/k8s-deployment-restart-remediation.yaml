id: k8s-deployment-restart-remediation
namespace: company.team
description: |
  Approval-gated Kubernetes remediation. An alert supplies a target Deployment, guardrails validate the namespace, a human must resume the flow within one hour, then Kestra restarts the Deployment and verifies status with retries.

triggers:
  - id: alert_webhook
    type: io.kestra.plugin.core.trigger.Webhook
    key: "{{ secret('K8S_REMEDIATION_WEBHOOK_KEY') }}"

variables:
  namespace: default
  deployment_name: null
  allowed_namespaces: ["default", "staging", "production", "production-canary"]
  protected_namespaces: ["production", "production-canary"]

tasks:
  - id: parse_webhook_payload
    type: io.kestra.plugin.core.execution.SetVariables
    description: Take the target from webhook parameters, falling back to defaults.
    variables:
      namespace: "{{ (trigger.parameters.namespace | first) ?? vars.namespace }}"
      deployment_name: "{{ (trigger.parameters.deployment_name | first) ?? vars.deployment_name }}"

  - id: log_params
    type: io.kestra.plugin.core.log.Log
    message: "namespace: {{ vars.namespace }}, deployment: {{ vars.deployment_name }}"
    logLevel: DEBUG

  - id: validate_namespace
    type: io.kestra.plugin.core.flow.If
    condition: "{{ (vars.deployment_name is null) or (not (vars.namespace isIn vars.allowed_namespaces)) }}"
    then:
      - id: fail_invalid_namespace
        type: io.kestra.plugin.core.execution.Fail
        errorMessage: |
          Provide a deployment name. Deployment name: {{ vars.deployment_name }}
          Invalid namespace '{{ vars.namespace }}'. Allowed namespaces are: {{ vars.allowed_namespaces }}

  - id: production_approval_gate
    type: io.kestra.plugin.core.flow.If
    description: Require human approval only for protected production namespaces. Staging remediation proceeds automatically.
    condition: "{{ vars.namespace isIn vars.protected_namespaces }}"
    then:
      - id: human_approval
        type: io.kestra.plugin.core.flow.Pause
        description: Hold production remediation for explicit human approval. Timeout fails closed.
        pauseDuration: PT1H
        behavior: FAIL

  - id: restart_service
    type: io.kestra.plugin.kubernetes.kubectl.Restart
    description: Rolling restart of the target deployment.
    connection:
      masterUrl: "{{ secret('K8S_MASTER_URL') }}"
      caCertData: "{{ secret('K8S_CA_CERT_DATA') }}"
      oauthToken: "{{ secret('K8S_OAUTH_TOKEN') }}"
    namespace: "{{ vars.namespace }}"
    resourceType: Deployment
    resourcesNames:
      - "{{ vars.deployment_name }}"

  - id: get_deployment_status
    type: io.kestra.plugin.kubernetes.kubectl.Get
    description: Fetch the deployment status, retrying until the rollout is healthy.
    connection:
      masterUrl: "{{ secret('K8S_MASTER_URL') }}"
      caCertData: "{{ secret('K8S_CA_CERT_DATA') }}"
      oauthToken: "{{ secret('K8S_OAUTH_TOKEN') }}"
    namespace: "{{ vars.namespace }}"
    resourceType: deployments
    resourcesNames:
      - "{{ vars.deployment_name }}"
    fetchType: FETCH_ONE
    retry:
      type: exponential
      maxAttempts: 5
      interval: PT15S
      maxInterval: PT5M

  - id: log_status
    type: io.kestra.plugin.core.log.Log
    message: |
      Deployment status: {{ outputs.get_deployment_status.statusItem | str }}

  - id: notify_slack_success
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "K8s remediation success. Target: {{ vars.namespace }}/{{ vars.deployment_name }}. Status: {{ outputs.get_deployment_status.statusItem | str }}"
      }

errors:
  - id: notify_slack_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "K8s remediation FAILED. Target: {{ vars.namespace }}/{{ vars.deployment_name }}. The rollout did not complete or the service is still unhealthy."
      }

extend:
  shortDescription: Human-approved Kubernetes Deployment restart with namespace allowlist guardrails, a one-hour approval timeout, rollout status retries, and Slack notifications.
  title: Human-Approved Kubernetes Deployment Restart Remediation
  metaTitle: Human-Approved Kubernetes Restart with Kestra
  metaDescription: Automatically remediate allowed non-production Kubernetes Deployments and require human approval before restarting protected production Deployments, with rollout verification and Slack notifications.
  description: |
    Turn incident response into a governed workflow. A monitoring alert supplies a target namespace and Deployment through a secured webhook. The flow validates the namespace against an allowlist. Allowed non-production namespaces proceed automatically, while protected production namespaces require explicit human approval for up to one hour. Approval timeout fails closed. Kestra then performs a real rolling restart and retries deployment-status checks. Slack receives success or failure notifications.

    ## How it works

    1. The `alert_webhook` trigger accepts POST requests secured by `K8S_REMEDIATION_WEBHOOK_KEY`, with `namespace` and `deployment_name` parameters.
    2. `parse_webhook_payload` resolves the requested target. `validate_namespace` rejects missing deployment names and namespaces outside the configured allowlist.
    3. `production_approval_gate` checks whether the namespace is in `protected_namespaces`. Staging and other unprotected allowed namespaces skip approval and continue automatically.
    4. For protected production namespaces, `human_approval` pauses execution for up to one hour. An explicit resume is required; `behavior: FAIL` ensures timeout cannot reach the restart.
    5. `restart_service` performs a real rolling restart of the named Kubernetes Deployment using secret-backed cluster credentials.
    6. `get_deployment_status` fetches the target Deployment and retries with exponential backoff. Slack receives the success result, while the flow-level error handler reports failures.

    ## What you get

    - Automatic remediation for allowed non-production namespaces such as staging.
    - Human approval for protected production namespaces before any restart.
    - A one-hour approval timeout that fails closed.
    - Namespace allowlist guardrails and secret-backed Kubernetes authentication.
    - Deployment status verification with retries and Slack success/failure notifications.

        ## Who it's for
    - SRE teams automating runbook step one for crashlooping or degraded deployments.
    - Platform teams offering guarded self-service restarts to application teams.
    - On-call engineers who want alerts to arrive already remediated.

    ## Why orchestrate this with Kestra
    A webhook receiver script with kubectl access is a security incident waiting to happen. Kestra adds the guardrails: a keyed webhook, explicit allowlist validation before any cluster call, secrets management for the cluster token, exponential-backoff verification as a declarative retry policy rather than a sleep loop, and an execution log that shows exactly which alert restarted what and whether it recovered.

    ## Prerequisites
    - A Kubernetes cluster reachable from the Kestra worker.
    - A service account token with permission to restart and get deployments in the allowed namespaces.
    - A monitoring system able to POST to the webhook with the target parameters.

    ### Secrets
    - `K8S_REMEDIATION_WEBHOOK_KEY`: shared key guarding the webhook trigger.
    - `K8S_MASTER_URL`, `K8S_CA_CERT_DATA`, `K8S_OAUTH_TOKEN`: cluster connection settings used by all Kubernetes tasks.
    - `SLACK_WEBHOOK_URL`: Slack incoming webhook for remediation reports.

    ## Quick start
    1. Add the secrets above to your Kestra namespace.
    2. Adjust `allowed_namespaces` to the namespaces you are willing to auto-remediate.
    3. Test with a manual POST to the webhook: `?namespace=staging&deployment_name=my-app`.
    4. Point your alerting rule at the webhook URL.

    ## How to extend

    - Add namespaces to `protected_namespaces` when they require human approval before remediation.
    - Add approved non-production namespaces to `allowed_namespaces` when automatic remediation is appropriate.
    - Adjust `pauseDuration` to match your production incident-response policy.
    - Capture pod logs before restarting for post-incident analysis.
    - Track remediation counts per deployment and introduce rate limits to prevent repeated restarts.

        ## Links
    - Kubernetes plugin docs: https://kestra.io/plugins/plugin-kubernetes
    - Webhook trigger docs: https://kestra.io/plugins/core/trigger/io.kestra.plugin.core.trigger.webhook
    - Kubernetes orchestration with Kestra: https://kestra.io/orchestration/kubernetes
  tags:
    - Infrastructure
  subTags:
    - Kubernetes Operations
    - Incident Response
    - Customer Success
  ee: false
  demo: false
