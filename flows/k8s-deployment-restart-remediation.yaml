id: k8s-deployment-restart-remediation
namespace: company.team
description: |
  Approval-gated Kubernetes remediation. An alert supplies a target Deployment, guardrails validate the namespace, a human must resume the flow within one hour, then Kestra restarts the Deployment and verifies status with retries.

triggers:
  - id: alert_webhook
    type: io.kestra.plugin.core.trigger.Webhook
    key: "{{ secret('K8S_REMEDIATION_WEBHOOK_KEY') }}"

variables:
  namespace: default
  deployment_name: null
  allowed_namespaces: ["default", "staging", "production-canary"]

tasks:
  - id: parse_webhook_payload
    type: io.kestra.plugin.core.execution.SetVariables
    description: Take the target from webhook parameters, falling back to defaults.
    variables:
      namespace: "{{ (trigger.parameters.namespace | first) ?? vars.namespace }}"
      deployment_name: "{{ (trigger.parameters.deployment_name | first) ?? vars.deployment_name }}"

  - id: log_params
    type: io.kestra.plugin.core.log.Log
    message: "namespace: {{ vars.namespace }}, deployment: {{ vars.deployment_name }}"
    logLevel: DEBUG

  - id: validate_namespace
    type: io.kestra.plugin.core.flow.If
    condition: "{{ (vars.deployment_name is null) or (not (vars.namespace isIn vars.allowed_namespaces)) }}"
    then:
      - id: fail_invalid_namespace
        type: io.kestra.plugin.core.execution.Fail
        errorMessage: |
          Provide a deployment name. Deployment name: {{ vars.deployment_name }}
          Invalid namespace '{{ vars.namespace }}'. Allowed namespaces are: {{ vars.allowed_namespaces }}

  - id: human_approval
    type: io.kestra.plugin.core.flow.Pause
    description: Require an explicit human resume before restarting the target Deployment. Timeout fails closed.
    pauseDuration: PT1H
    behavior: FAIL

  - id: restart_service
    type: io.kestra.plugin.kubernetes.kubectl.Restart
    description: Rolling restart of the target deployment.
    connection:
      masterUrl: "{{ secret('K8S_MASTER_URL') }}"
      caCertData: "{{ secret('K8S_CA_CERT_DATA') }}"
      oauthToken: "{{ secret('K8S_OAUTH_TOKEN') }}"
    namespace: "{{ vars.namespace }}"
    resourceType: Deployment
    resourcesNames:
      - "{{ vars.deployment_name }}"

  - id: get_deployment_status
    type: io.kestra.plugin.kubernetes.kubectl.Get
    description: Fetch the deployment status, retrying until the rollout is healthy.
    connection:
      masterUrl: "{{ secret('K8S_MASTER_URL') }}"
      caCertData: "{{ secret('K8S_CA_CERT_DATA') }}"
      oauthToken: "{{ secret('K8S_OAUTH_TOKEN') }}"
    namespace: "{{ vars.namespace }}"
    resourceType: deployments
    resourcesNames:
      - "{{ vars.deployment_name }}"
    fetchType: FETCH_ONE
    retry:
      type: exponential
      maxAttempts: 5
      interval: PT15S
      maxInterval: PT5M

  - id: log_status
    type: io.kestra.plugin.core.log.Log
    message: |
      Deployment status: {{ outputs.get_deployment_status.statusItem | str }}

  - id: notify_slack_success
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "K8s remediation success. Target: {{ vars.namespace }}/{{ vars.deployment_name }}. Status: {{ outputs.get_deployment_status.statusItem | str }}"
      }

errors:
  - id: notify_slack_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "K8s remediation FAILED. Target: {{ vars.namespace }}/{{ vars.deployment_name }}. The rollout did not complete or the service is still unhealthy."
      }

extend:
  shortDescription: Human-approved Kubernetes Deployment restart with namespace allowlist guardrails, a one-hour approval timeout, rollout status retries, and Slack notifications.
  title: Human-Approved Kubernetes Deployment Restart Remediation
  metaTitle: Human-Approved Kubernetes Restart with Kestra
  metaDescription: Use Kestra for human-approved Kubernetes Deployment restarts. A webhook alert triggers namespace validation, a one-hour approval gate, rollout verification with retries, and Slack notifications.
  description: |
    Turn incident response into a governed workflow. A monitoring alert supplies a target namespace and Deployment through a secured webhook. The flow validates the namespace against an allowlist, pauses for explicit human approval for up to one hour, and fails closed if approval is not provided. After approval, Kestra performs a real rolling restart and retries deployment-status checks. Slack receives success or failure notifications.

    ## How it works
    1. The `alert_webhook` trigger (`io.kestra.plugin.core.trigger.Webhook`) accepts POSTs secured by `K8S_REMEDIATION_WEBHOOK_KEY`; Alertmanager, Datadog, or any monitor can call it with `namespace` and `deployment_name` query parameters.
    2. The `parse_webhook_payload` task (`io.kestra.plugin.core.execution.SetVariables`) resolves the target from `trigger.parameters` with `?? ` fallbacks to flow variables.
    3. The `validate_namespace` task (`io.kestra.plugin.core.flow.If`) fails fast when the deployment name is missing or the namespace is not in `allowed_namespaces`, preventing alerts from restarting arbitrary workloads.
    4. The `restart_service` task (`io.kestra.plugin.kubernetes.kubectl.Restart`) performs the rolling restart of the `Deployment`.
    5. The `get_deployment_status` task (`io.kestra.plugin.kubernetes.kubectl.Get` with `fetchType: FETCH_ONE`) fetches the deployment and retries with an `exponential` policy (5 attempts, PT15S initial interval, PT5M cap) until the status reflects a healthy rollout.
    6. `notify_slack_success` posts the verified status; a flow-level `errors` handler posts a failure message if validation, restart, or verification fail. Cluster credentials are set via `connection` on both `io.kestra.plugin.kubernetes` tasks.

    ## What you get
    - Self-healing for the most common K8s incident class, with humans informed rather than involved.
    - A namespace allowlist that bounds the blast radius of automated restarts.
    - Verified remediation: the flow only succeeds when the rollout is actually healthy.
    - Cluster credentials from secrets, applied via `connection` on each Kubernetes task.

    ## Who it's for
    - SRE teams automating runbook step one for crashlooping or degraded deployments.
    - Platform teams offering guarded self-service restarts to application teams.
    - On-call engineers who want alerts to arrive already remediated.

    ## Why orchestrate this with Kestra
    A webhook receiver script with kubectl access is a security incident waiting to happen. Kestra adds the guardrails: a keyed webhook, explicit allowlist validation before any cluster call, secrets management for the cluster token, exponential-backoff verification as a declarative retry policy rather than a sleep loop, and an execution log that shows exactly which alert restarted what and whether it recovered.

    ## Prerequisites
    - A Kubernetes cluster reachable from the Kestra worker.
    - A service account token with permission to restart and get deployments in the allowed namespaces.
    - A monitoring system able to POST to the webhook with the target parameters.

    ### Secrets
    - `K8S_REMEDIATION_WEBHOOK_KEY`: shared key guarding the webhook trigger.
    - `K8S_MASTER_URL`, `K8S_CA_CERT_DATA`, `K8S_OAUTH_TOKEN`: cluster connection settings used by all Kubernetes tasks.
    - `SLACK_WEBHOOK_URL`: Slack incoming webhook for remediation reports.

    ## Quick start
    1. Add the secrets above to your Kestra namespace.
    2. Adjust `allowed_namespaces` to the namespaces you are willing to auto-remediate.
    3. Test with a manual POST to the webhook: `?namespace=staging&deployment_name=my-app`.
    4. Point your alerting rule at the webhook URL.

    ## How to extend
    - Add a `io.kestra.plugin.core.flow.Pause` approval for production namespaces while auto-remediating staging.
    - Capture pod logs before restarting with `io.kestra.plugin.kubernetes.kubectl.Get` on pods for post-incident analysis.
    - Track remediation counts per deployment in the KV store and open a ticket after N restarts in 24 hours.
    - Fan out to multiple clusters by parameterizing the connection via inputs.

    ## Links
    - Kubernetes plugin docs: https://kestra.io/plugins/plugin-kubernetes
    - Webhook trigger docs: https://kestra.io/plugins/core/trigger/io.kestra.plugin.core.trigger.webhook
    - Kubernetes orchestration with Kestra: https://kestra.io/orchestration/kubernetes
  tags:
    - Infrastructure
  subTags:
    - Kubernetes Operations
    - Incident Response
    - Customer Success
  ee: false
  demo: false
