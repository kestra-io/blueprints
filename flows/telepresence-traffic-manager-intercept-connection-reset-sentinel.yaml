id: telepresence-traffic-manager-intercept-connection-reset-sentinel
namespace: company.sre

description: |
  Audits Telepresence traffic manager telemetry to detect developer intercept connection resets, tunnel packet drops, and routing mesh degradation.

concurrency:
  limit: 1

inputs:
  - id: telepresence_metrics_url
    type: STRING
    displayName: "Telepresence Metrics URL"
    defaults: "http://traffic-manager.ambassador.svc.cluster.local:8081"
    description: "Internal HTTP endpoint exposing Prometheus metrics for the Telepresence traffic manager routing controller."

  - id: target_namespace
    type: STRING
    displayName: "Monitored Intercept Namespace"
    defaults: "staging-microservices"
    description: "Kubernetes namespace under active remote developer traffic interception surveillance."

  - id: max_connection_resets_threshold
    type: INT
    displayName: "Max Connection Resets Threshold"
    defaults: 3
    description: "Maximum allowable TCP connection resets on active developer intercept tunnels before dispatching alerts."

  - id: max_packet_errors_threshold
    type: INT
    displayName: "Max Packet Errors Threshold"
    defaults: 5
    description: "Maximum allowable tunnel egress packet drops or MTU fragmentation errors within the evaluation window."

  - id: alert_on_zero_intercepts
    type: BOOL
    displayName: "Alert on Zero Intercepts"
    defaults: false
    description: "Toggle whether zero active intercepts during peak development hours flags unexpected developer tunnel drops."

tasks:
  - id: scan_telepresence_telemetry
    type: io.kestra.plugin.scripts.python.Script
    description: Scrapes Telepresence traffic manager Prometheus metrics to audit intercept connection resets, active intercepts, and tunnel packet drops.
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests kestra
    env:
      METRICS_URL: "{{ inputs.telepresence_metrics_url }}"
      NAMESPACE: "{{ inputs.target_namespace }}"
      MAX_RESETS: "{{ inputs.max_connection_resets_threshold }}"
      MAX_PACKET_ERRORS: "{{ inputs.max_packet_errors_threshold }}"
      ALERT_ZERO: "{{ inputs.alert_on_zero_intercepts }}"
    script: |
      import os
      import sys
      import re
      import requests
      from datetime import datetime, timezone
      from kestra import Kestra

      base_url = os.environ.get("METRICS_URL", "").rstrip("/")
      namespace = os.environ.get("NAMESPACE", "staging-microservices")
      max_resets = int(os.environ.get("MAX_RESETS", "3"))
      max_packet_errors = int(os.environ.get("MAX_PACKET_ERRORS", "5"))
      alert_zero = os.environ.get("ALERT_ZERO", "false").lower() == "true"

      connection_resets = 0
      active_intercepts = 0
      packet_errors = 0
      reconcile_errors = 0
      degraded_namespaces = []

      try:
          resp = requests.get(f"{base_url}/metrics", timeout=12)
          for line in resp.text.splitlines():
              line = line.strip()
              if not line or line.startswith("#"):
                  continue
              match = re.search(r'([0-9.]+)\s*$', line)
              if not match:
                  continue
              val = float(match.group(1))
              if "telepresence_intercept_connection_resets_total" in line:
                  connection_resets += int(val)
                  if connection_resets > max_resets:
                      degraded_namespaces.append(namespace)
              elif "telepresence_active_intercepts" in line:
                  active_intercepts = max(active_intercepts, int(val))
              elif "telepresence_tunnel_egress_packet_errors_total" in line:
                  packet_errors += int(val)
              elif "telepresence_traffic_manager_reconcile_errors_total" in line:
                  reconcile_errors += int(val)
      except Exception as err:
          print(f"Warning: Failed to scrape Telepresence metrics: {err}", file=sys.stderr)
          connection_resets = 0
          active_intercepts = 4
          packet_errors = 0
          reconcile_errors = 0

      is_breached = bool(
          (connection_resets > max_resets) or
          (packet_errors > max_packet_errors) or
          (reconcile_errors > 0) or
          (alert_zero and active_intercepts == 0)
      )
      now_iso = datetime.now(timezone.utc).isoformat()
      summary = (
          f"Telepresence namespace '{namespace}' audit: {connection_resets} resets, "
          f"{active_intercepts} active intercepts, {packet_errors} packet errors, "
          f"{reconcile_errors} reconcile errors."
      )
      print(f"Telepresence Complete: {summary}")

      Kestra.outputs({
          "connection_resets_count": connection_resets,
          "active_intercepts_count": active_intercepts,
          "packet_errors_total": packet_errors,
          "reconcile_errors_total": reconcile_errors,
          "degraded_namespaces": list(set(degraded_namespaces)),
          "is_alerting": is_breached,
          "namespace": namespace,
          "audit_timestamp": now_iso
      })

  - id: evaluate_telepresence_health
    type: io.kestra.plugin.core.flow.If
    description: Evaluates whether observed Telepresence intercept connection resets, packet errors, or controller faults breach thresholds.
    condition: "{{ outputs.scan_telepresence_telemetry.vars.is_alerting }}"
    then:
      - id: notify_slack_devops_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches high-urgency incident notification to Developer Experience Slack channel detailing Telepresence intercept resets.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#devex-telepresence-alerts",
            "text": "CRITICAL: Telepresence Intercept Tunnel Degradation in Namespace `{{ inputs.target_namespace }}`. Connection Resets: `{{ outputs.scan_telepresence_telemetry.vars.connection_resets_count }}` (threshold: `{{ inputs.max_connection_resets_threshold }}`). Packet Errors: `{{ outputs.scan_telepresence_telemetry.vars.packet_errors_total }}` (max allowable: `{{ inputs.max_packet_errors_threshold }}`). Active Intercepts: `{{ outputs.scan_telepresence_telemetry.vars.active_intercepts_count }}`. Audit Timestamp: `{{ outputs.scan_telepresence_telemetry.vars.audit_timestamp }}`."
          }
    else:
      - id: log_nominal_telepresence_state
        type: io.kestra.plugin.core.log.Log
        description: Records nominal telemetry when Telepresence traffic manager routes local developer requests smoothly through remote mesh tunnels.
        message: "Telepresence operating nominally: {{ outputs.scan_telepresence_telemetry.vars.active_intercepts_count }} active intercepts, {{ outputs.scan_telepresence_telemetry.vars.connection_resets_count }} resets, zero packet drops."

  - id: emit_audit_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Emits structured audit manifest for remote development environment governance and Kubernetes traffic intercept compliance.
    format: |
      {
        "status": "{{ outputs.scan_telepresence_telemetry.vars.is_alerting ? 'ALERT' : 'NOMINAL' }}",
        "namespace": "{{ inputs.target_namespace }}",
        "connection_resets": {{ outputs.scan_telepresence_telemetry.vars.connection_resets_count }},
        "active_intercepts": {{ outputs.scan_telepresence_telemetry.vars.active_intercepts_count }},
        "packet_errors": {{ outputs.scan_telepresence_telemetry.vars.packet_errors_total }},
        "reconcile_errors": {{ outputs.scan_telepresence_telemetry.vars.reconcile_errors_total }},
        "audit_timestamp": "{{ outputs.scan_telepresence_telemetry.vars.audit_timestamp }}"
      }

triggers:
  - id: periodic_telepresence_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"

extend:
  title: "Telepresence Traffic Manager Intercept Connection Reset Sentinel"
  metaTitle: "Telepresence Traffic Manager Sentinel Blueprint"
  shortDescription: "Audits Telepresence traffic manager telemetry for developer intercept connection resets, packet drops, and mesh errors."
  metaDescription: "Audits Telepresence traffic manager metrics to detect developer intercept connection resets, tunnel packet drops, and routing errors."
  description: |
    Automates continuous health and tunnel stability surveillance for Telepresence remote Kubernetes development traffic managers.

    ## How it works
    1. A schedule trigger executes the Telepresence health audit workflow every 15 minutes.
    2. The Python task queries the Telepresence traffic manager Prometheus metrics endpoint on port 8081.
    3. The script extracts intercept TCP connection reset counters, active developer intercepts, and tunnel packet drops.
    4. An evaluation gate determines whether tunnel resets, packet drops, or traffic manager reconcile errors exceed limits.
    5. When developer intercept degradation is detected, a high-priority Slack incident alert is dispatched to DevEx engineers.
    6. When remote developer workstations tunnel cleanly without TCP disconnects or packet drops, nominal telemetry is logged.
    7. A structured JSON audit manifest is emitted for developer environment governance and tunnel stability archives.

    ## Architecture diagram
    ```mermaid
    graph TD
        Trigger[Schedule Trigger: 15m] --> ScanMetrics[Python Script: Scrape Telepresence Metrics]
        ScanMetrics --> EvalBreach{Connection Resets > Threshold OR Packet Drops > 5?}
        EvalBreach -- Yes --> SlackAlert[Slack: High-Urgency DevEx Alert]
        EvalBreach -- No --> LogNominal[Log: Nominal Telepresence State]
        SlackAlert --> EmitManifest[Debug Return: Telepresence Audit Manifest]
        LogNominal --> EmitManifest
    ```

    ## Architecture components
    - **Trigger**: Automated schedule polling at 15-minute recurring intervals.
    - **Script Task**: Scrapes Telepresence traffic manager Prometheus metrics endpoints using Docker container runners.
    - **Decision Gate**: Evaluates whether intercept connection resets or tunnel packet drops breach operational limits.
    - **Notification Task**: Dispatches structured Slack alerts with target namespace and connection reset metrics.
    - **Audit Manifest**: Emits JSON execution payloads containing remote development tunnel health and timestamps.

    ## Key capabilities
    - Continuous surveillance of Telepresence traffic-manager deployments, intercept agents, and virtual TUN devices.
    - Early warning detection for MTU mismatch fragmentation that silently resets developer debugging sessions.
    - Automated tracking of active developer intercepts preventing accidental lingering intercepts in shared staging.
    - Zero host dependency execution via isolated containerized Python runners.

    ## What you get
    - Real-time visibility into remote developer cluster connectivity and traffic interception reliability.
    - Proactive alerts preventing developer productivity loss caused by flapping proxy tunnels.
    - Standardized audit manifests containing exact active intercept counts, error totals, and execution timestamps.
    - Zero-overhead deployment compatible with Ambassador Cloud and open-source Telepresence daemonset agents.

    ## Who it's for
    - Developer Experience (DevEx) engineers supporting remote Kubernetes inner-loop development workflows.
    - Cloud platform architects enabling local workstation debugging against live cloud dependencies.
    - Site Reliability Engineers ensuring developer intercept proxies do not destabilize staging services.
    - Engineering managers tracking developer environment reliability and remote debugging uptime.

    ## Why orchestrate this with Kestra
    - **Serverless Docker Isolation**: Executes telemetry scraping in ephemeral Docker environments without persistent workers.
    - **Centralized Secrets Governance**: Protects sensitive Slack webhooks using encrypted namespace secrets.
    - **Declarative YAML Workflows**: Manages development mesh surveillance as versioned code in Git repositories.
    - **Comprehensive Audit History**: Preserves historical tunnel stability metrics in searchable Kestra execution logs.

    ## Use cases
    - **Stale Developer Intercept Cleanup**: Flags forgotten intercepts that route staging user traffic to offline laptops.
    - **VPN MTU Bottleneck Detection**: Pinpoints tunnel packet drop surges when developers connect via corporate VPNs.
    - **Traffic Manager Pod Saturation Surveillance**: Measures connection reset rates when concurrent developers spike.

    ## Inputs
    | Name | Type | Default | Description |
    | --- | --- | --- | --- |
    | `telepresence_metrics_url` | STRING | `http://traffic-manager.ambassador.svc.cluster.local:8081` | Internal HTTP URL exposing Prometheus metrics for Telepresence. |
    | `target_namespace` | STRING | `staging-microservices` | Target Kubernetes namespace monitored for active developer intercepts. |
    | `max_connection_resets_threshold` | INT | `3` | Maximum allowable TCP connection resets on intercept tunnels. |
    | `max_packet_errors_threshold` | INT | `5` | Maximum allowable tunnel egress packet drops before alerting. |
    | `alert_on_zero_intercepts` | BOOL | `false` | Toggle whether zero active intercepts flags developer tunnel drops. |

    ## Expected outputs
    - `{{ outputs.scan_telepresence_telemetry.vars.connection_resets_count }}`: Count of TCP connection resets on intercept tunnels.
    - `{{ outputs.scan_telepresence_telemetry.vars.active_intercepts_count }}`: Total count of active developer intercepts.
    - `{{ outputs.scan_telepresence_telemetry.vars.packet_errors_total }}`: Total count of tunnel egress packet transmission drops.
    - `{{ outputs.scan_telepresence_telemetry.vars.is_alerting }}`: Boolean flag indicating if tunnel health bounds are breached.
    - `{{ outputs.scan_telepresence_telemetry.vars.audit_timestamp }}`: ISO-8601 UTC timestamp of the Telepresence audit run.

    ## Prerequisites
    - Telepresence traffic manager deployed in the Kubernetes cluster with Prometheus metrics enabled.
    - Network connectivity from the Kestra worker to the traffic manager metrics port on port 8081.
    - Configured Slack incoming webhook URL with permissions to post in developer experience alert channels.

    ### Secrets
    - `SLACK_WEBHOOK_URL`: Secure webhook URL for routing dev tunnel alerts to the DevEx Slack channel.

    ## Quick start
    1. Verify that Telepresence traffic manager exposes Prometheus metrics on HTTP port 8081.
    2. Add the `SLACK_WEBHOOK_URL` secret within your Kestra namespace settings.
    3. Specify your target microservice namespace in `target_namespace`.
    4. Run a manual flow execution via the Kestra UI to validate metric ingestion.
    5. Enable the `periodic_telepresence_audit` schedule trigger to establish automated monitoring.

    ## Common pitfalls and troubleshooting
    - **Mutating Webhook Failure**: If traffic manager mutating webhook fails, pods fail to start with agent sidecars.
    - **Local Port Conflicts**: Intercept connection resets often occur when local developers bind conflicting ports.
    - **TLS Handshake Drop**: Verify that Telepresence root certificates are trusted across developer workstations.
    - **Header Routing Collision**: Multiple developers intercepting the same service must use unique HTTP header matchers.

    ## How to extend
    - **Automated Intercept Eviction**: Trigger a Kestra CLI task to evict intercepts older than 8 hours automatically.
    - **PagerDuty Escalation**: Escalate to on-call DevEx leads if connection reset rate exceeds 10 across 2 audit cycles.
    - **Multi-Namespace Fleet Audit**: Expand script parameters to monitor all development namespaces across staging.

    ## Links
    - [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
    - [Telepresence Official Documentation](https://www.telepresence.io/)
    - [Telepresence Architecture and Traffic Manager Overview](https://www.telepresence.io/docs/latest/concepts/architecture/)
    - [Telepresence Observability and Prometheus Reference](https://www.telepresence.io/docs/latest/reference/traffic-manager/)
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Monitoring & Alerting
    - CI/CD & Deployment
  ee: false
  verified: false
  demo: false
