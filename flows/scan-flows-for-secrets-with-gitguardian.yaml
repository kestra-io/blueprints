id: scan-flows-for-secrets-with-gitguardian
namespace: company.security
description: |
  Export every flow in the tenant, scan the YAML with GitGuardian ggshield, alert Slack
  and flag the execution as WARNING. Set create_incidents to true (GitGuardian Business or
  Enterprise) to also create a GitGuardian incident for each secret found.

inputs:
  - id: create_incidents
    type: BOOL
    defaults: false
    description: |
      Create a GitGuardian incident for each secret found. Requires a GitGuardian Business or Enterprise plan,
      a custom source (gitguardian_source_uuid below) and an API key with the scan:create-incidents scope.
      Leave false on the free plan: findings still go to Slack and the execution report.

variables:
  # Credentials, read from Kestra secrets
  kestra_username: "{{ secret('KESTRA_USERNAME') }}"
  kestra_password: "{{ secret('KESTRA_PASSWORD') }}"
  # kestra_api_token: "{{ secret('KESTRA_API_TOKEN') }}"  # Enterprise Edition
  gitguardian_api_key: "{{ secret('GITGUARDIAN_API_KEY') }}"
  slack_webhook_url: "{{ secret('SLACK_WEBHOOK_URL') }}"

  # Settings
  # Only used when create_incidents is true.
  # Custom source created in GitGuardian under Settings > Sources > Custom sources.
  gitguardian_source_uuid: REPLACE_WITH_YOUR_CUSTOM_SOURCE_UUID
  # Only used when create_incidents is true. Target of the "GitGuardian incidents" button. For a direct link, filter the incidents page by your custom source and paste that URL.
  gitguardian_dashboard_url: https://dashboard.gitguardian.com
  # Public URL of your Kestra UI, used in the Slack buttons. {{ kestra.url }} only exists when kestra.url is set in the server config.
  kestra_url: http://localhost:8080
  # Tenant used in the Kestra API and UI links of the Slack buttons. The open-source edition uses main.
  kestra_tenant: main

tasks:
  - id: export_flows
    type: io.kestra.plugin.kestra.flows.Export
    # No namespace property: every flow in the tenant is exported. Add namespace: company.team to narrow it to a prefix.
    # Credentials the task uses to call the Kestra API.
    # Open-source edition: the basic-auth username and password you log into the UI with.
    # Enterprise Edition: replace username/password with apiToken: "{{ render(vars.kestra_api_token) }}"
    auth:
      username: "{{ render(vars.kestra_username) }}"
      password: "{{ render(vars.kestra_password) }}"

  - id: scan_with_ggshield
    type: io.kestra.plugin.scripts.shell.Commands
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: gitguardian/ggshield:latest
    env:
      # Scopes: scan (free plan), plus scan:create-incidents when create_incidents is true
      GITGUARDIAN_API_KEY: "{{ render(vars.gitguardian_api_key) }}"
    inputFiles:
      flows.zip: "{{ outputs.export_flows.flowsZip }}"
    outputFiles:
      - report.json
    commands:
      - python -m zipfile -e flows.zip flows/
      # --source-uuid is added only when create_incidents is true: every finding then also becomes an incident in the GitGuardian dashboard.
      # --exit-zero: findings are handled by the If task below, not by a non-zero exit code.
      # --show-secrets stays OFF so the stored report never contains a full credential.
      - "ggshield secret scan path --recursive --yes --json --exit-zero {{ inputs.create_incidents ? '--source-uuid ' ~ vars.gitguardian_source_uuid : '' }} flows/ > report.json"
      - |
        python - <<'EOF'
        import json, os
        try:
            import yaml
        except ImportError:
            yaml = None

        MAX_LINES = 10  # flows listed in the Slack message

        def owner_of(path):
            # Flows have no author field: use the owner (or team) label
            if not yaml:
                return None
            try:
                labels = yaml.safe_load(open(path)).get("labels") or {}
            except Exception:
                return None
            if isinstance(labels, list):
                labels = {l.get("key"): l.get("value") for l in labels if isinstance(l, dict)}
            return labels.get("owner") or labels.get("team")

        report = json.load(open("report.json"))
        # ggshield JSON: one entity per scanned file, each with its own incidents list.
        flows, total = [], 0
        for entity in report.get("entities_with_incidents", []):
            count = entity.get("total_incidents", 0)
            if not count:
                continue
            total += count
            name = os.path.basename(entity["filename"]).rsplit(".", 1)[0]
            detectors = sorted({inc.get("type", "unknown") for inc in entity.get("incidents", [])})
            owner = owner_of(entity["filename"]) or "no owner label"
            flows.append(f"• `{name}` · {count} secret(s) · {', '.join(detectors)} · 👤 {owner}")

        summary = "\n".join(flows[:MAX_LINES])
        if len(flows) > MAX_LINES:
            summary += f"\n_… and {len(flows) - MAX_LINES} more flow(s). See the report{{ inputs.create_incidents ? ' or the GitGuardian dashboard' : '' }}._"
        print("::" + json.dumps({"outputs": {
            "incidents": total,
            "flow_count": len(flows),
            "summary": summary,
        }}) + "::")
        EOF

  - id: on_findings
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.scan_with_ggshield.vars.incidents > 0 }}"
    then:
      - id: slack_alert
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ render(vars.slack_webhook_url) }}"
        payload: |
          {
            "text": "GitGuardian found {{ outputs.scan_with_ggshield.vars.incidents }} hardcoded secret(s) in {{ outputs.scan_with_ggshield.vars.flow_count }} Kestra flow(s)",
            "blocks": [
              { "type": "header",
                "text": { "type": "plain_text", "emoji": true, "text": "🚨 {{ outputs.scan_with_ggshield.vars.incidents }} hardcoded secret(s) in {{ outputs.scan_with_ggshield.vars.flow_count }} Kestra flow(s)" } },
              { "type": "section",
                "fields": [
                  { "type": "mrkdwn", "text": "*Scope*\nAll namespaces" },
                  { "type": "mrkdwn", "text": "*Scanned at*\n{{ execution.startDate | date('yyyy-MM-dd HH:mm') }} UTC" }
                ] },
              { "type": "section",
                "text": { "type": "mrkdwn", "text": {{ outputs.scan_with_ggshield.vars.summary | toJson }} } },
              { "type": "actions",
                "elements": [
                  {% if inputs.create_incidents %}
                  { "type": "button", "style": "primary",
                    "text": { "type": "plain_text", "text": "GitGuardian incidents" },
                    "url": "{{ vars.gitguardian_dashboard_url }}" },
                  {% endif %}
                  { "type": "button", "style": "danger",
                    "text": { "type": "plain_text", "text": "Download report" },
                    "url": "{{ vars.kestra_url }}/api/v1/{{ vars.kestra_tenant }}/executions/{{ execution.id }}/file?path={{ outputs.scan_with_ggshield.outputFiles['report.json'] }}" },
                  { "type": "button",
                    "text": { "type": "plain_text", "text": "Open execution" },
                    "url": "{{ vars.kestra_url }}/ui/{{ vars.kestra_tenant }}/executions/{{ flow.namespace }}/{{ flow.id }}/{{ execution.id }}" }
                ] },
              { "type": "context",
                "elements": [ { "type": "mrkdwn", "text": "{{ inputs.create_incidents ? 'One GitGuardian incident per secret. ' : '' }}Replace each value with a secret() call, then resolve the incident. 📖 <https://kestra.io/docs/concepts/secret|How to manage secrets in Kestra>" } ] }
            ]
          }

      - id: flag_as_warning
        type: io.kestra.plugin.core.execution.Fail
        allowFailure: true
        errorMessage: "{{ outputs.scan_with_ggshield.vars.incidents }} hardcoded secret(s) found in {{ outputs.scan_with_ggshield.vars.flow_count }} flow(s). {{ inputs.create_incidents ? 'Incidents created in GitGuardian; r' : 'R' }}eport.json is in the scan_with_ggshield outputs."

triggers:
  - id: daily_scan
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 7 * * *"

extend:
  title: Scan Kestra flows for hardcoded secrets with GitGuardian
  metaTitle: Scan Kestra flows for secrets with GitGuardian ggshield | Kestra
  shortDescription: Export every flow, scan the YAML with GitGuardian ggshield, alert Slack, end the execution in WARNING and optionally open one GitGuardian incident per secret.
  metaDescription: Scan Kestra flow definitions for hardcoded credentials with GitGuardian ggshield, alert Slack per flow and optionally open GitGuardian incidents.
  description: |
    Kestra stores flows in its own database, so a flow written in the UI never reaches a git repository and a secrets scanner wired to GitHub or GitLab never sees it. This flow closes that gap: it exports every flow in the tenant, scans the YAML with GitGuardian's open-source `ggshield` and tells Slack which flows to fix. It works on the GitGuardian free plan. On the Business and Enterprise plans, set the `create_incidents` input to `true` and each secret also becomes an incident in the GitGuardian dashboard.

    | | Free plan (`create_incidents: false`, default) | Business and Enterprise (`create_incidents: true`) |
    |---|---|---|
    | Scan and Slack alert | Yes | Yes |
    | Incident per secret in GitGuardian | No | Yes, under a custom source |
    | "GitGuardian incidents" Slack button | No | Yes |
    | API key scopes | `scan` | `scan` and `scan:create-incidents` |
    | Custom source UUID | Not needed | Required |

    ## How it works

    1. `daily_scan` (`io.kestra.plugin.core.trigger.Schedule`) runs the audit every morning at 07:00.
    2. `export_flows` (`io.kestra.plugin.kestra.flows.Export`) exports every flow in the tenant into a ZIP in internal storage. Add a `namespace` prefix on the task to narrow the scope.
    3. `scan_with_ggshield` (`io.kestra.plugin.scripts.shell.Commands`) runs in the `gitguardian/ggshield` image, unzips the export and runs `ggshield secret scan path` with JSON output. When `create_incidents` is true it adds the custom source UUID, so each secret becomes a GitGuardian incident. It publishes `incidents`, `flow_count` and a Slack-ready per-flow `summary` as task outputs.
    4. `on_findings` (`io.kestra.plugin.core.flow.If`) runs when `incidents > 0`: it posts a Slack Block Kit message and ends the execution in WARNING with a `Fail` task set to `allowFailure`.

    ## What you get

    - A dated, auditable check that no flow definition in the tenant contains a credential that should have been a `secret()` call.
    - With `create_incidents: true`, one incident per secret in the GitGuardian dashboard, under a custom source.
    - A Slack alert with the secret and flow counts, one line per flow naming the detectors and the owner label (first 10 flows, the rest counted), and buttons to the report download, the execution and, with `create_incidents`, the GitGuardian incidents.
    - The ggshield JSON report stored as a task output file. Matched secrets are truncated in the report by default.

    ## Who it's for

    - Platform and security engineers who run Kestra and already use GitGuardian, on any plan.
    - Teams that let people edit flows in the UI and want those flows covered by secrets scanning.

    ## Why orchestrate this with Kestra

    - The flow reads its own credentials with `secret()`, so it practices what it checks, and Kestra masks them in logs.
    - Scheduling, the Docker runner, retries and a run history come with the platform: every execution is a dated record of the audit.
    - The same YAML can run on a schedule or, with a Webhook trigger, as a gate in your deploy pipeline.

    ## Prerequisites

    - A GitGuardian workspace and a service account token with the `scan` scope. The free plan is enough.
    - To create incidents (`create_incidents: true`): the Business or Enterprise plan, a custom source (Settings > Sources > Custom sources) and the `scan:create-incidents` scope on the token.
    - A Docker-capable worker, because the scan runs in the `gitguardian/ggshield` image.
    - Credentials for the `Export` task: on the open-source edition, the basic-auth username and password of the instance. On the Enterprise Edition, a service account API token.
    - A Slack incoming webhook for the alert channel.

    ### Secrets

    - `GITGUARDIAN_API_KEY`: GitGuardian service account token used by ggshield (scope `scan`, plus `scan:create-incidents` when creating incidents).
    - `SLACK_WEBHOOK_URL`: Slack incoming webhook URL for the alert.
    - `KESTRA_USERNAME` and `KESTRA_PASSWORD`: basic-auth credentials the `Export` task uses to call the Kestra API. Enterprise Edition: a service account token as `KESTRA_API_TOKEN` instead.

    ## Quick start

    1. Add the `GITGUARDIAN_API_KEY`, `SLACK_WEBHOOK_URL`, `KESTRA_USERNAME` and `KESTRA_PASSWORD` secrets to your Kestra namespace. On the Enterprise Edition, store a service account token as `KESTRA_API_TOKEN` and set `auth.apiToken` in the `export_flows` task instead.
    2. Import the blueprint and fill the variables at the top: the public URL of your Kestra UI and, if you create incidents, the custom source UUID. The dashboard button defaults to dashboard.gitguardian.com.
    3. Click **Execute** to scan every namespace once. Tick `create_incidents` only on the Business and Enterprise plans.
    4. Check the Slack alert (and the incidents in GitGuardian if enabled), then leave the `daily_scan` trigger enabled.

    ## How to extend

    - Scan namespace files too: add an `io.kestra.plugin.core.http.Download` task on `/api/v1/{tenant}/namespaces/{namespace}/files/export` and pass the archive to ggshield as a second input file.
    - Gate deploys: replace the Schedule trigger with `io.kestra.plugin.core.trigger.Webhook` and call it from the CI job that deploys flows, so a finding fails the pipeline before the flow lands.
    - Point ggshield at a self-hosted GitGuardian instance by adding `GITGUARDIAN_API_URL` to the task `env`.
    - Route findings to Microsoft Teams, PagerDuty or Jira with the matching Kestra notification plugin.

    ## Links

    - [Kestra Export flows task](https://kestra.io/plugins/plugin-kestra)
    - [Kestra Slack plugin](https://kestra.io/plugins/plugin-notifications)
    - [Kestra secrets](https://kestra.io/docs/concepts/secret)
    - [ggshield on GitHub](https://github.com/GitGuardian/ggshield)
    - [GitGuardian documentation](https://docs.gitguardian.com)
  tags:
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - Day 2 Operations
  ee: false
  demo: false
