id: cloudwatch-metric-breach-auto-triage
namespace: company.team
description: |
  Turn a raw CloudWatch metric breach into an actionable incident alert.
  When the metric trigger fires, the flow pulls the surrounding metric
  datapoints, runs a set of opt-in AWS diagnostic commands (log tail,
  instance state, recent deployments), and posts everything to Slack with a
  link to your runbook. No more "CPU > 80%" alerts with zero context , 
  the on-call engineer gets the triage bundle in one message.

triggers:
  - id: metric_breach
    type: io.kestra.plugin.aws.cloudwatch.Trigger
    description: Fires when the watched metric breaches the threshold.
    region: "{{ inputs.aws_region }}"
    accessKeyId: "{{ secret('AWS_ACCESS_KEY_ID') }}"
    secretKeyId: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
    namespace: "{{ inputs.metric_namespace }}"
    metricName: "{{ inputs.metric_name }}"
    statistic: Average
    periodSeconds: 300
    window: PT15M

inputs:
  - id: aws_region
    type: STRING
    defaults: us-east-1
    description: AWS region of the watched resources.
  - id: metric_namespace
    type: STRING
    defaults: AWS/EC2
    description: CloudWatch namespace of the watched metric.
  - id: metric_name
    type: STRING
    defaults: CPUUtilization
    description: CloudWatch metric name that triggers the triage.
  - id: diagnostic_commands
    type: ARRAY
    itemType: STRING
    defaults:
      - aws ec2 describe-instances --filters "Name=instance-state-name,Values=running" --query "Reservations[].Instances[].[InstanceId,InstanceType,LaunchTime]" --output table
      - aws logs tail /aws/lambda/app-errors --since 15m --format short 2>&1 | head -n 50
    description: Read-only AWS CLI diagnostic commands to run on every breach. Keep them read-only, this flow never mutates infrastructure.
  - id: runbook_url
    type: STRING
    defaults: https://wiki.company.team/runbooks/metric-breach
    description: Link to the team runbook, included in the Slack alert.

tasks:
  - id: capture_breach_context
    type: io.kestra.plugin.aws.cli.AwsCLI
    description: Pull the metric datapoints surrounding the breach window.
    region: "{{ inputs.aws_region }}"
    accessKeyId: "{{ secret('AWS_ACCESS_KEY_ID') }}"
    secretKeyId: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
    commands:
      - |
        END=$(date -u +%Y-%m-%dT%H:%M:%SZ)
        START=$(date -u -d "30 minutes ago" +%Y-%m-%dT%H:%M:%SZ)
        echo "Breach context for {{ inputs.metric_namespace }}/{{ inputs.metric_name }} ($START -> $END)"
        aws cloudwatch get-metric-statistics --namespace "{{ inputs.metric_namespace }}" \
          --metric-name "{{ inputs.metric_name }}" --start-time "$START" --end-time "$END" \
          --period 300 --statistics Average Maximum --region "{{ inputs.aws_region }}"

  - id: run_diagnostics
    type: io.kestra.plugin.core.flow.Loop
    description: Run each configured read-only diagnostic command.
    values: "{{ inputs.diagnostic_commands }}"
    tasks:
      - id: diagnostic
        type: io.kestra.plugin.aws.cli.AwsCLI
        description: Execute one diagnostic command.
        region: "{{ inputs.aws_region }}"
        accessKeyId: "{{ secret('AWS_ACCESS_KEY_ID') }}"
        secretKeyId: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
        commands:
          - "{{ item.value }}"

  - id: notify_slack
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Post the triage bundle to Slack with the runbook link.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": ":rotating_light: *CloudWatch breach triage*, `{{ inputs.metric_namespace }}/{{ inputs.metric_name }}` in `{{ inputs.aws_region }}`\n*Metric context:*\n```{{ outputs.capture_breach_context.stdout }}```\n*Runbook:* {{ inputs.runbook_url }}"
      }

extend:
  title: CloudWatch Metric Breach Auto-Triage
  metaTitle: Auto-Triage CloudWatch Alarms with Diagnostics | Kestra
  shortDescription: Turn a raw CloudWatch metric breach into an actionable incident alert, metric context, automated diagnostics, and a Slack triage bundle with your runbook link.
  metaDescription: When a CloudWatch metric breaches, auto-collect metric context and run diagnostics, then post a triage bundle to Slack. Built for on-call engineers.
  description: |
    A "CPU > 80%" alert with zero context is where incidents go to waste time. The on-call engineer opens the alert, then spends twenty minutes clicking through CloudWatch, logs, and the console to figure out what's actually wrong. This blueprint does that triage automatically the moment the metric fires.

    ## How it works

    1. A CloudWatch metric trigger watches your namespace/metric and fires on breach.
    2. The flow pulls the metric datapoints surrounding the breach window for immediate context.
    3. A ForEach loop runs your configured read-only diagnostic commands (instance state, log tails, recent deployments) via the AWS CLI.
    4. A Slack webhook posts the whole triage bundle, metric context, diagnostics output, and your runbook link, in one message.

    ## What you get

    - Incident alerts that arrive with evidence, not just a threshold name.
    - Consistent triage: every breach runs the same diagnostics, no matter who is on call.
    - Read-only by design, the flow never mutates infrastructure, only observes.
    - One-click jump from Slack straight to the relevant runbook.

    ## Who it's for

    On-call engineers, SREs, and platform teams who want CloudWatch alarms to be the start of the investigation, not a treasure hunt.

    ## Why orchestrate this with Kestra

    Wiring this with EventBridge + Lambda means scattered code and no visibility. As a Kestra flow the triage logic is declarative YAML the whole team can read, every run is logged and replayable, and adding a new diagnostic is one line in the `diagnostic_commands` input.

    ## Prerequisites

    - AWS credentials with `cloudwatch:GetMetricStatistics` plus read permissions for whatever your diagnostic commands touch (e.g. `ec2:DescribeInstances`, `logs:FilterLogEvents`).
    - A Slack incoming webhook URL.

    ### Secrets

    - `AWS_ACCESS_KEY_ID`: AWS access key for the CloudWatch and diagnostic API calls.
    - `AWS_SECRET_ACCESS_KEY`: AWS secret key for the CloudWatch and diagnostic API calls.
    - `SLACK_WEBHOOK_URL`: Incoming webhook URL for the triage alert.

    ## Quick start

    1. Add the three secrets above to your Kestra namespace.
    2. Set `metric_namespace`, `metric_name`, and your read-only `diagnostic_commands`.
    3. Put your runbook URL in `runbook_url`.
    4. Trigger a test breach (or run manually) and check Slack.

    ## How to extend

    - Add an `If` branch that pages via PagerDuty when diagnostics show a hard failure.
    - Feed the diagnostics into an LLM task for an auto-generated incident summary.
    - Store every triage bundle in S3 for post-incident review.

    ## Links

    - [Kestra AWS plugins](https://kestra.io/plugins)
    - [Kestra Slack plugins](https://kestra.io/plugins)
    - [CloudWatch get-metric-statistics API](https://docs.aws.amazon.com/cli/latest/reference/cloudwatch/get-metric-statistics.html)
  tags:
    - Infrastructure
  subTags:
    - Incident Response
    - Monitoring & Alerting
  ee: false
  demo: false
