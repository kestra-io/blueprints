id: ai-rag-hallucination-guardrail
namespace: company.team
description: |
  Automate hallucination detection and faithfulness evaluation for Retrieval-Augmented
  Generation (RAG) pipelines using an LLM-as-a-judge, generating a downloadable compliance
  report and alerting Slack when answer groundedness falls below acceptable thresholds.

triggers:
  - id: nightly_rag_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: Run the RAG evaluation test suite nightly to catch quiet hallucination regressions. Shipped disabled.
    cron: "0 3 * * *"
    disabled: true
  - id: audit_webhook
    type: io.kestra.plugin.core.trigger.Webhook
    description: Event-based trigger called from CI/CD pipelines whenever retrieval indexes or models change.
    key: rag-hallucination-audit

inputs:
  - id: model
    type: STRING
    displayName: LLM Judge Model
    defaults: gpt-4o-mini
    description: Model identifier for the evaluation judge. Any OpenAI-compatible model identifier.
  - id: base_url
    type: STRING
    displayName: LLM API Base URL
    defaults: https://api.openai.com/v1
    description: OpenAI-compatible endpoint. Can point to OpenAI, Ollama, vLLM, or LocalAI.
  - id: min_faithfulness_score
    type: FLOAT
    displayName: Minimum Faithfulness Threshold
    defaults: 0.85
    description: Minimum required average groundedness score (0.0 to 1.0). An alert fires if the score falls below this threshold.
  - id: max_hallucination_rate
    type: FLOAT
    displayName: Maximum Tolerable Hallucination Rate
    defaults: 0.15
    description: Maximum allowable fraction of test cases exhibiting unsupported or fabricated claims.
  - id: rag_eval_suite
    type: STRING
    displayName: RAG Evaluation Test Suite
    defaults: |
      [
        {
          "id": "pricing-tier-limits",
          "query": "What is the monthly active user limit on the Free tier?",
          "retrieved_context": "The Free tier supports up to 1,000 monthly active users and 10 workflow executions per day. The Pro tier supports unlimited users.",
          "generated_answer": "The Free tier supports up to 1,000 monthly active users and allows 10 workflow executions each day."
        },
        {
          "id": "hallucination-feature-bait",
          "query": "Does the platform support QuantumSync multi-region replication?",
          "retrieved_context": "Supported replication protocols include Postgres WAL streaming, S3 cross-region replication, and Kafka mirror maker. QuantumSync is not a supported protocol.",
          "generated_answer": "Yes, QuantumSync is fully supported across all multi-region deployments with sub-millisecond sync latency."
        },
        {
          "id": "refund-window-policy",
          "query": "What is the return and refund policy window for annual subscriptions?",
          "retrieved_context": "Customers may request a full refund within 14 calendar days of purchasing or renewing an annual subscription. After 14 days, prorated credits are issued upon review.",
          "generated_answer": "You can request a full refund within 14 calendar days of your annual subscription purchase or renewal."
        },
        {
          "id": "database-connector-support",
          "query": "Can we directly ingest data from CockroachDB and Snowflake?",
          "retrieved_context": "Kestra provides native production plugins for PostgreSQL, MySQL, Snowflake, BigQuery, and DuckDB. CockroachDB compatibility is maintained through the standard PostgreSQL wire protocol.",
          "generated_answer": "Yes, Snowflake has a native plugin and CockroachDB is supported via standard PostgreSQL wire protocol compatibility."
        },
        {
          "id": "gdpr-retention-timeline",
          "query": "How long are execution audit logs retained before automated deletion?",
          "retrieved_context": "Execution audit logs and task run histories are retained for exactly 90 calendar days in compliance with enterprise data retention standards before automated purge.",
          "generated_answer": "Execution audit logs are permanently stored for 7 years to meet international financial compliance mandates."
        }
      ]
    description: JSON array of RAG test cases — each specifies an id, user query, retrieved document context chunks, and the generated answer to evaluate.

tasks:
  - id: evaluate_rag_faithfulness
    type: io.kestra.plugin.scripts.python.Script
    description: Execute LLM-as-a-judge evaluation across RAG test cases, grade groundedness against retrieved context, and emit audit metrics.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests kestra
    env:
      RAG_SUITE: "{{ inputs.rag_eval_suite }}"
      MODEL: "{{ inputs.model }}"
      BASE_URL: "{{ inputs.base_url }}"
      OPENAI_API_KEY: "{{ secret('OPENAI_API_KEY') }}"
      MIN_SCORE: "{{ inputs.min_faithfulness_score }}"
      MAX_RATE: "{{ inputs.max_hallucination_rate }}"
    script: |
      import json
      import os
      import sys
      import time
      import requests
      from kestra import Kestra

      suite = json.loads(os.environ["RAG_SUITE"])
      if not suite:
          print("CRITICAL: rag_eval_suite is empty — nothing to evaluate", file=sys.stderr)
          sys.exit(1)

      base = os.environ["BASE_URL"].rstrip("/")
      model = os.environ["MODEL"]
      key = os.environ.get("OPENAI_API_KEY", "")

      judge_system_prompt = (
          "You are an impartial, highly rigorous evaluation judge assessing whether a RAG generated answer is faithfully grounded in the retrieved context.\n\n"
          "Evaluation criteria:\n"
          "1. A claim in the answer is FAITHFUL only if it can be directly inferred from the retrieved context.\n"
          "2. If the answer introduces facts, statistics, or features NOT supported in context, classify it as a HALLUCINATION.\n"
          "3. Output strictly valid JSON with schema: {\"faithfulness_score\": <float 0.0-1.0>, \"has_hallucination\": <bool>, \"hallucinated_claims\": [<str>], \"reasoning\": \"<str>\"}"
      )

      def query_judge(case):
          prompt = (
              f"User Query:\n{case['query']}\n\n"
              f"Retrieved Document Context:\n{case['retrieved_context']}\n\n"
              f"Generated Answer To Evaluate:\n{case['generated_answer']}\n\n"
              "Grade the answer faithfulness and identify any hallucinations. Output strict JSON only."
          )
          payload = {
              "model": model,
              "messages": [
                  {"role": "system", "content": judge_system_prompt},
                  {"role": "user", "content": prompt}
              ],
              "temperature": 0,
              "response_format": {"type": "json_object"}
          }
          headers = {
              "Content-Type": "application/json",
              "Authorization": f"Bearer {key}"
          }
          try:
              resp = requests.post(f"{base}/chat/completions", json=payload, headers=headers, timeout=30)
              resp.raise_for_status()
              res = resp.json()
              content = res["choices"][0]["message"]["content"]
              return json.loads(content)
          except Exception as exc:
              print(f"CRITICAL: Failed to query LLM judge at {base}: {exc}", file=sys.stderr)
              sys.exit(1)

      results = []
      hallucinated_cases = 0
      total_faithfulness = 0.0
      failing_case_ids = []

      for case in suite:
          eval_res = query_judge(case)
          score = float(eval_res.get("faithfulness_score", 0.0))
          has_hallucination = bool(eval_res.get("has_hallucination", False))
          claims = eval_res.get("hallucinated_claims", [])

          if has_hallucination or score < float(os.environ["MIN_SCORE"]):
              failing_case_ids.append(case["id"])

          if has_hallucination:
              hallucinated_cases += 1

          total_faithfulness += score
          results.append({
              "id": case["id"],
              "query": case["query"],
              "faithfulness_score": score,
              "has_hallucination": has_hallucination,
              "hallucinated_claims": claims,
              "reasoning": eval_res.get("reasoning", "")
          })
          time.sleep(0.1)

      total = len(suite)
      avg_faithfulness = round(total_faithfulness / total, 4)
      hallucination_rate = round(hallucinated_cases / total, 4)
      faithful_count = total - hallucinated_cases
      failing_ids_str = ",".join(failing_case_ids)

      with open("rag_eval_results.json", "w") as f:
          json.dump({
              "total_cases": total,
              "faithful_cases": faithful_count,
              "hallucinated_cases": hallucinated_cases,
              "avg_faithfulness": avg_faithfulness,
              "hallucination_rate": hallucination_rate,
              "failing_case_ids": failing_ids_str,
              "results": results
          }, f, indent=2)

      print(f"RAG Evaluation Complete: {faithful_count}/{total} faithful cases, {hallucinated_cases} hallucinations detected.")

      Kestra.outputs({
          "total_cases": total,
          "faithful_cases": faithful_count,
          "hallucinated_cases": hallucinated_cases,
          "avg_faithfulness": avg_faithfulness,
          "hallucination_rate": hallucination_rate,
          "failing_case_ids": failing_ids_str
      })
    outputFiles:
      - rag_eval_results.json

  - id: generate_audit_report
    type: io.kestra.plugin.scripts.python.Script
    description: Generate a structured Markdown RAG compliance audit report artifact.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    env:
      MODEL: "{{ inputs.model }}"
      TOTAL: "{{ outputs.evaluate_rag_faithfulness.vars.total_cases }}"
      FAITHFUL: "{{ outputs.evaluate_rag_faithfulness.vars.faithful_cases }}"
      HALLUCINATED: "{{ outputs.evaluate_rag_faithfulness.vars.hallucinated_cases }}"
      AVG_SCORE: "{{ outputs.evaluate_rag_faithfulness.vars.avg_faithfulness }}"
      RATE: "{{ outputs.evaluate_rag_faithfulness.vars.hallucination_rate }}"
      FAILING_IDS: "{{ outputs.evaluate_rag_faithfulness.vars.failing_case_ids }}"
      MIN_SCORE: "{{ inputs.min_faithfulness_score }}"
      MAX_RATE: "{{ inputs.max_hallucination_rate }}"
    outputFiles:
      - "rag-hallucination-audit-report.md"
    script: |
      import os
      from datetime import datetime, timezone

      model = os.environ["MODEL"]
      total = os.environ["TOTAL"]
      faithful = os.environ["FAITHFUL"]
      hallucinated = os.environ["HALLUCINATED"]
      avg_score = os.environ["AVG_SCORE"]
      rate = os.environ["RATE"]
      failing_ids = os.environ["FAILING_IDS"]
      min_score = os.environ["MIN_SCORE"]
      max_rate = os.environ["MAX_RATE"]

      passed = float(avg_score) >= float(min_score) and float(rate) <= float(max_rate)
      verdict = "PASSED" if passed else "FAILED"
      badge = "PASS" if passed else "FAIL"
      now_str = datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M:%S UTC")

      lines = [
          "# RAG Hallucination & Faithfulness Audit Report",
          "",
          "| Metric | Target | Observed | Status |",
          "|---|---|---|---|",
          f"| **Overall Verdict** | Compliance SLA | **{verdict}** | `{badge}` |",
          f"| **Judge Model** | — | `{model}` | — |",
          f"| **Total Test Cases** | — | {total} | — |",
          f"| **Faithful Answers** | — | {faithful} | — |",
          f"| **Hallucinated Answers** | 0 | {hallucinated} | {'OK' if int(hallucinated) == 0 else 'BREACH'} |",
          f"| **Average Faithfulness** | >= {min_score} | **{avg_score}** | {'PASS' if float(avg_score) >= float(min_score) else 'FAIL'} |",
          f"| **Hallucination Rate** | <= {max_rate} | **{rate}** | {'PASS' if float(rate) <= float(max_rate) else 'FAIL'} |",
          f"| **Failing Cases** | None | `{failing_ids or 'None'}` | — |",
          f"| **Audit Timestamp** | — | {now_str} | — |"
      ]

      with open("rag-hallucination-audit-report.md", "w") as f:
          f.write("\n".join(lines) + "\n")
      print("Generated compliance audit report successfully.")

  - id: evaluate_alert_threshold
    type: io.kestra.plugin.core.flow.If
    description: Evaluate whether observed hallucination rate or average faithfulness score breaches SLA.
    condition: "{{ outputs.evaluate_rag_faithfulness.vars.hallucination_rate | float > inputs.max_hallucination_rate | float or outputs.evaluate_rag_faithfulness.vars.avg_faithfulness | float < inputs.min_faithfulness_score | float }}"
    then:
      - id: notify_slack_guardrail_breach
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#ai-safety-alerts",
            "username": "RAG-Hallucination-Guardrail",
            "text": "CRITICAL: RAG Hallucination Guardrail breached! Hallucination rate: `{{ outputs.evaluate_rag_faithfulness.vars.hallucination_rate }}` (threshold: `{{ inputs.max_hallucination_rate }}`), Avg faithfulness: `{{ outputs.evaluate_rag_faithfulness.vars.avg_faithfulness }}` (threshold: `{{ inputs.min_faithfulness_score }}`). Failing cases: `{{ outputs.evaluate_rag_faithfulness.vars.failing_case_ids }}`."
          }

errors:
  - id: alert_on_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "#ai-safety-alerts",
        "username": "RAG-Hallucination-Guardrail",
        "text": "CRITICAL: RAG Hallucination Guardrail pipeline failed. Execution ID: `{{ execution.id }}`."
      }

extend:
  title: AI RAG Hallucination Guardrail
  metaTitle: AI RAG Hallucination Guardrail Blueprint
  shortDescription: Automated LLM-as-a-judge faithfulness and hallucination evaluation for RAG pipelines.
  metaDescription: Automate hallucination detection and faithfulness evaluation for RAG pipelines using LLM-as-a-judge and Slack alerting.
  description: |
    ## How it works
    This workflow executes an automated LLM-as-a-judge evaluation across retrieval-augmented generation test suites. It grades groundedness against retrieved context chunks, detects unsupported claims or hallucinations, compiles a compliance report artifact, and triggers Slack incident alerts if hallucination rates exceed defined thresholds.

    ## Architecture diagram
    ```mermaid
    flowchart TD
      A[nightly_rag_audit Schedule Trigger] --> B[evaluate_rag_faithfulness Python Script]
      B --> C[generate_audit_report Markdown Artifact]
      B --> D{Hallucination Rate Breached?}
      D -- Yes --> E[notify_slack_guardrail_breach Webhook]
      D -- No --> F[Guardrail Passed]
    ```

    ## Prerequisites
    - OpenAI-compatible LLM endpoint and API key.
    - Secret `OPENAI_API_KEY` and `SLACK_WEBHOOK_URL` configured in Kestra.

    ## Quick start
    1. Import the blueprint under the `company.team` namespace.
    2. Configure `model`, `base_url`, and test suite cases.
    3. Run manually to evaluate RAG quality.

    ## Links
    - [OpenAI API Reference](https://platform.openai.com/docs/api-reference)
    - [Kestra Python Script Documentation](https://kestra.io/plugins/plugin-scripts-python)
  tags:
    - AI
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - Quality Assurance
    - AI & ML
  ee: false
  demo: false
