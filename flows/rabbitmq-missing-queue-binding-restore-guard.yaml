    ## Prerequisites

    - Kestra 2.0.6 or later with the AMQP, HTTP and Slack plugins.
    - RabbitMQ 3.13-management (the tested service) with the management API enabled.
    - A durable direct exchange and durable non-exclusive queue or permission to declare them during approved remediation.

    ### Secrets

    - `RABBITMQ_HOST`, `RABBITMQ_PORT`, `RABBITMQ_MANAGEMENT_PORT`, `RABBITMQ_USERNAME`, `RABBITMQ_PASSWORD` and `RABBITMQ_VHOST` for the AMQP and management API connections.
    - `SLACK_WEBHOOK_URL` for the native Slack notification and failure alert.

    ### Inputs

    - `exchange`, `queue` and `routing_key` identify one direct route.
    - `auto_remediate` must be `true` and `dry_run` must be `false` before the approval path can write.

    ## Quick start

    1. Add the RabbitMQ and Slack secrets to Kestra.
    2. Import the flow and run it with `auto_remediate=false` and `dry_run=true`.
    3. Review the management API finding and the exact exchange, queue, routing key, declaration shape and empty binding arguments shown in the approval pause.
    4. Resume with `approved=true` only when the direct exchange and queue are owned by this runbook.

    ## How to extend

    - Run the flow once for each routing key.
    - Add a reviewed TOPIC variant with its own binding arguments and cases instead of widening this direct-only guard.
    - Add a change-management link to the approval description and Slack payload.

