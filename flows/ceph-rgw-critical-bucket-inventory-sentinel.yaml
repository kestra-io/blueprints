id: ceph-rgw-critical-bucket-inventory-sentinel
namespace: company.team
description: |
  List every bucket in a Ceph RADOS Gateway (RGW) object store on a
  schedule, classify the result CRITICAL_BUCKET_MISSING if a named
  must-always-exist bucket is gone, BUCKET_COUNT_EXCEEDED if the total
  bucket count has grown past a governance threshold, or HEALTHY, log
  clean passes, and alert Slack before either condition goes unnoticed.

triggers:
  - id: periodic_inventory_check
    type: io.kestra.plugin.core.trigger.Schedule
    description: "Checks every 30 minutes - RGW buckets change slowly in normal operation, so this does not need minute-level resolution, but a deleted critical bucket or a wave of unauthorized bucket creation is worth catching well before the next manual audit. Shipped disabled; enable it once ceph_host, critical_bucket_name, and max_expected_bucket_count point at a real RGW gateway and a manual run has been verified."
    cron: "*/30 * * * *"
    disabled: true
    inputs:
      ceph_host: "ceph-mgr.internal"
      critical_bucket_name: "REPLACE-WITH-YOUR-CRITICAL-BUCKET"
      max_expected_bucket_count: 50

inputs:
  - id: ceph_host
    type: STRING
    displayName: "Ceph Dashboard Host"
    defaults: "ceph-mgr.internal"
    description: "Ceph Dashboard host passed to ListBuckets's own host property, matching the plugin's own documented example."

  - id: critical_bucket_name
    type: STRING
    displayName: "Critical Bucket Name"
    defaults: "REPLACE-WITH-YOUR-CRITICAL-BUCKET"
    description: "Name of a bucket that must always exist in this RGW gateway (for example a backup or audit-log bucket). Must be replaced with a real bucket name - there is no safe universal default."

  - id: max_expected_bucket_count
    type: INT
    displayName: "Max Expected Bucket Count"
    defaults: 50
    description: "Governance threshold on the total bucket count (verified output field total from ListBuckets). Crossing this is a sign of unmanaged, unauthorized, or runaway bucket creation, not necessarily a hard failure."

tasks:
  - id: probe_list_buckets
    type: io.kestra.plugin.ceph.rgw.ListBuckets
    description: "Calls the Ceph Dashboard's own GET /api/rgw/bucket endpoint (verified from the task's own Javadoc) and returns only bucket names and a total count - a read-only call, it cannot create, delete, or modify any bucket. fetchType is left at its FETCH default so both total and the buckets list are available for classification."
    host: "{{ inputs.ceph_host }}"
    username: "{{ secret('CEPH_USERNAME') }}"
    password: "{{ secret('CEPH_PASSWORD') }}"

  - id: evaluate_bucket_inventory
    type: io.kestra.plugin.core.flow.If
    description: "CRITICAL_BUCKET_MISSING whenever critical_bucket_name is absent from the returned buckets list (verified output field from ListBuckets) - checked first and treated as the most severe state, since a missing must-always-exist bucket usually means lost data or a broken backup pipeline, worse than simple bucket sprawl."
    condition: "{{ inputs.critical_bucket_name in outputs.probe_list_buckets.buckets }}"
    then:
      - id: evaluate_bucket_count
        type: io.kestra.plugin.core.flow.If
        description: "BUCKET_COUNT_EXCEEDED whenever total (verified output field from ListBuckets) exceeds max_expected_bucket_count - a governance signal that bucket creation has grown past what is tracked/managed, not a hard failure like the missing-bucket case above."
        condition: "{{ outputs.probe_list_buckets.total > inputs.max_expected_bucket_count }}"
        then:
          - id: alert_bucket_count_exceeded
            type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
            description: "Alert on BUCKET_COUNT_EXCEEDED so the team notices unmanaged bucket growth before it becomes a cost or governance problem."
            url: "{{ secret('SLACK_WEBHOOK_URL') }}"
            payload: |
              {{ {
                "text": "Ceph RGW inventory sentinel: BUCKET_COUNT_EXCEEDED on " ~ inputs.ceph_host ~ ". " ~ outputs.probe_list_buckets.total ~ " buckets present, above the governance threshold of " ~ inputs.max_expected_bucket_count ~ ". The critical bucket '" ~ inputs.critical_bucket_name ~ "' is present. Execution " ~ execution.id ~ "."
              } | toJson }}
        else:
          - id: log_inventory_healthy
            type: io.kestra.plugin.core.log.Log
            message: "HEALTHY: critical bucket {{ inputs.critical_bucket_name }} present on {{ inputs.ceph_host }}; total buckets {{ outputs.probe_list_buckets.total }}, at or below the {{ inputs.max_expected_bucket_count }} governance threshold."
    else:
      - id: alert_critical_bucket_missing
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: "Always alert on CRITICAL_BUCKET_MISSING - checked and reported regardless of the current bucket count, since a missing must-always-exist bucket is the most urgent signal this sentinel produces."
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {{ {
            "text": "Ceph RGW inventory sentinel: CRITICAL_BUCKET_MISSING on " ~ inputs.ceph_host ~ ". Expected bucket '" ~ inputs.critical_bucket_name ~ "' was not found among " ~ outputs.probe_list_buckets.total ~ " buckets returned by the gateway. Execution " ~ execution.id ~ "."
          } | toJson }}

  - id: log_audit_complete
    type: io.kestra.plugin.core.log.Log
    description: "Final status line for every run, independent of which branch fired."
    message: "RGW inventory audit complete for {{ inputs.ceph_host }}. total_buckets={{ outputs.probe_list_buckets.total }}."

errors:
  - id: alert_execution_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: "Alert when the flow itself fails outside the handled CRITICAL_BUCKET_MISSING/BUCKET_COUNT_EXCEEDED/HEALTHY branches, for example an unreachable Ceph Dashboard, or invalid credentials."
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {{ {
        "text": "Ceph RGW inventory sentinel FAILED in execution " ~ execution.id ~ " for " ~ inputs.ceph_host ~ ". ListBuckets did not complete; investigate before trusting the last known inventory status."
      } | toJson }}

extend:
  title: "Ceph RGW Critical Bucket Inventory Sentinel"
  metaTitle: "Ceph RADOS Gateway Bucket Inventory Sentinel with Kestra"
  shortDescription: "List every Ceph RGW bucket on a schedule and alert Slack if a must-always-exist bucket disappears or total bucket count crosses a governance threshold."
  metaDescription: "Audit Ceph RGW buckets for a missing critical bucket or unmanaged bucket sprawl and alert Slack before it is missed."
  description: |
    A Ceph RADOS Gateway (RGW) deployment's bucket inventory drifts
    silently - a backup bucket deleted by a misconfigured lifecycle policy,
    or a wave of ad hoc bucket creation nobody tracked - and nothing in
    Ceph itself proactively flags either case. This blueprint lists every
    bucket in the gateway on a schedule and alerts Slack the moment a named
    must-always-exist bucket is missing, or the total bucket count crosses
    a governance threshold.

    ## How it works

    1. `periodic_inventory_check` (`io.kestra.plugin.core.trigger.Schedule`) runs every 30 minutes, explicitly passing `ceph_host`, `critical_bucket_name`, and `max_expected_bucket_count` through its own `inputs:` block so the flow is self-contained when the trigger fires. Shipped disabled so a manual run can be verified first.
    2. `probe_list_buckets` (`io.kestra.plugin.ceph.rgw.ListBuckets`) calls the Ceph Dashboard's own `GET /api/rgw/bucket` endpoint, capturing the bucket `total` count and the `buckets` name list.
    3. `evaluate_bucket_inventory` (`io.kestra.plugin.core.flow.If`) checks, in order of severity:
       - CRITICAL_BUCKET_MISSING: `critical_bucket_name` is absent from `buckets` - `alert_critical_bucket_missing` fires immediately.
       - BUCKET_COUNT_EXCEEDED: the critical bucket is present, but `total` exceeds `max_expected_bucket_count` - `alert_bucket_count_exceeded` fires.
       - HEALTHY: the critical bucket is present and `total` is within threshold - `log_inventory_healthy` records the pass.
    4. `log_audit_complete` always runs last, printing the final `total` regardless of which branch fired.
    5. The `errors` block alerts Slack separately if the flow itself fails outright - an unreachable Ceph Dashboard or invalid credentials.

    ## What you get

    - A Drift Auditor / Resource Quota Enforcement sentinel built on Ceph's own bucket inventory, not on a separately-maintained spreadsheet of what buckets should exist.
    - Two distinctly different severities kept apart: a missing must-always-exist bucket (likely lost data or a broken backup pipeline) versus unmanaged bucket count growth (a governance/cost signal) - each pointing toward a different response.
    - A worked example of `io.kestra.plugin.ceph.rgw.ListBuckets`, with no prior blueprint coverage of this plugin's RGW (object gateway) surface in this repository - the existing Ceph blueprints here cover OSD peering, pool replication, RBD snapshots, and overall cluster health, a different subsystem entirely from the S3-compatible object gateway.

    ## Who it's for

    - Storage and platform teams operating Ceph RGW who need to know immediately if a critical bucket disappears, rather than discovering it during a restore.
    - Teams enforcing bucket-provisioning governance who want a heads-up the moment bucket count grows past what is tracked, instead of finding out during a storage capacity review.
    - Anyone evaluating the Ceph plugin who wants a worked example of its RGW task family used for monitoring rather than for provisioning buckets or users.

    ## Why orchestrate this with Kestra

    The Ceph Dashboard shows the current bucket list reactively, but has no built-in "alert me if a specific bucket disappears or the count grows too high" primitive. Kestra supplies the schedule, the CRITICAL_BUCKET_MISSING/BUCKET_COUNT_EXCEEDED/HEALTHY classification as a first-class three-way branch, and an execution history showing exactly when a bucket went missing or the count first crossed the threshold.

    ## Prerequisites

    - A Ceph cluster with the RGW (Object Gateway) service enabled and the Ceph Dashboard reachable.
    - Ceph Dashboard credentials with read access to the RGW bucket list (update `ceph_host`, and the `CEPH_USERNAME`/`CEPH_PASSWORD` secrets).
    - At least one bucket designated as the must-always-exist `critical_bucket_name` for your environment.
    - A Slack incoming webhook for alerts.

    ### Secrets

    - `CEPH_USERNAME` / `CEPH_PASSWORD`: Ceph Dashboard credentials for `io.kestra.plugin.ceph.rgw.ListBuckets`, matching the secret naming already used by this repository's other Ceph blueprints.
    - `SLACK_WEBHOOK_URL`: Slack incoming webhook used by both alert branches and the `errors` block.
    - In Kestra OSS (no Enterprise secrets backend), secrets are supplied as environment variables prefixed `SECRET_`, base64-encoded - for example `SECRET_CEPH_PASSWORD=$(echo -n '<your-local-password>' | base64)` - and read back in flows with `{{ secret('NAME') }}`.

    ### Inputs

    - `ceph_host` (STRING, default `ceph-mgr.internal`): Ceph Dashboard host.
    - `critical_bucket_name` (STRING, must be replaced): the bucket that must always exist.
    - `max_expected_bucket_count` (INT, default `50`): governance threshold on total bucket count.

    ### Outputs

    - `outputs.probe_list_buckets.total` (Integer): number of buckets returned (verified field from `ListBuckets`'s own `Output` class).
    - `outputs.probe_list_buckets.buckets` (List of String): bucket names in the gateway, only populated with the default `FETCH` fetch type used here.

    ## Quick start

    1. Identify a real Ceph RGW gateway and a bucket that must always exist in it.
    2. Add the `CEPH_USERNAME`, `CEPH_PASSWORD`, and `SLACK_WEBHOOK_URL` secrets.
    3. Run the flow manually and confirm `log_inventory_healthy` fires if the critical bucket exists and total count is within threshold.
    4. Temporarily point `critical_bucket_name` at a bucket name that does not exist, and re-run to confirm `alert_critical_bucket_missing` fires.
    5. Temporarily lower `max_expected_bucket_count` below the gateway's real bucket count, and re-run to confirm `alert_bucket_count_exceeded` fires.
    6. Enable `periodic_inventory_check` once you trust the check against your real gateway.

    ## How to extend

    - Loop over several `ceph_host` values with `io.kestra.plugin.core.flow.Loop` to audit multiple RGW gateways in one run.
    - Track multiple must-always-exist buckets by looping `critical_bucket_name` over a list input instead of a single value.
    - Add a companion check using `io.kestra.plugin.ceph.rgw.ListUsers` (the same plugin's user-listing equivalent) to audit RGW user inventory for orphaned or unauthorized access-key holders alongside bucket drift.

    ## Pitfalls

    - **`ListBuckets` returns bucket names only, not owner, size, or quota** - verified directly from its own `Output` class (`total` and `buckets`, nothing else). This sentinel can prove a bucket exists or vanished, but cannot by itself detect a bucket that still exists but has silently exceeded its quota or changed owner.
    - **A large gateway should use `fetchType: STORE`** (per the task's own documented guidance for "gateways with a large number of buckets") instead of the default `FETCH` used here, to avoid holding every bucket name in task output; this blueprint intentionally uses `FETCH` since both `critical_bucket_name` presence and `total` need to be evaluated inline.
    - **This blueprint cannot distinguish a deliberately deleted bucket from one impacted by an outage** - `CRITICAL_BUCKET_MISSING` fires identically in both cases; the Slack alert is the start of an investigation, not a diagnosis.

    ## Links

    - [Kestra Ceph plugin documentation](https://kestra.io/plugins/plugin-ceph)
    - [Ceph Object Gateway (RGW) documentation](https://docs.ceph.com/en/latest/radosgw/)
    - [Kestra secrets (OSS vs Enterprise)](https://kestra.io/docs/concepts/secret)
  tags:
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - Day 2 Operations
  ee: false
  demo: false
