id: metallb-bgp-speaker-peer-flap-and-eviction-sentinel
namespace: company.sre

description: |
  Audits MetalLB bare-metal Kubernetes load balancer BGP speaker telemetry to detect peering session flaps, daemonset pod evictions, and route announcement stalls.

concurrency:
  limit: 1

inputs:
  - id: metallb_metrics_url
    type: STRING
    displayName: "MetalLB Metrics Service URL"
    defaults: "http://metallb-speaker-monitor.metallb-system.svc.cluster.local:7472"
    description: "Internal HTTP URL exposing Prometheus metrics for the MetalLB BGP speaker daemonset."

  - id: bgp_router_asn
    type: INT
    displayName: "Local BGP Autonomous System Number"
    defaults: 64512
    description: "Configured autonomous system number (ASN) of the top-of-rack BGP peer router under surveillance."

  - id: max_peer_session_flaps_threshold
    type: INT
    displayName: "Max Peer Session Flaps Threshold"
    defaults: 3
    description: "Maximum allowable BGP peering session state transitions or flaps within the evaluation window."

  - id: max_speaker_evictions_threshold
    type: INT
    displayName: "Max Speaker Evictions Threshold"
    defaults: 1
    description: "Maximum allowable evicted or non-ready MetalLB speaker daemonset pods across Kubernetes nodes."

  - id: alert_on_bgp_peer_down
    type: BOOL
    displayName: "Alert on BGP Peer Down"
    defaults: true
    description: "Toggle whether detected BGP session down state triggers an immediate network incident alert."

tasks:
  - id: scan_metallb_telemetry
    type: io.kestra.plugin.scripts.python.Script
    description: Scrapes MetalLB Prometheus metrics to audit BGP speaker peer session stability, flap counters, and route announcement status.
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests kestra
    env:
      METALLB_URL: "{{ inputs.metallb_metrics_url }}"
      ROUTER_ASN: "{{ inputs.bgp_router_asn }}"
      MAX_FLAPS: "{{ inputs.max_peer_session_flaps_threshold }}"
      MAX_EVICTIONS: "{{ inputs.max_speaker_evictions_threshold }}"
      ALERT_PEER_DOWN: "{{ inputs.alert_on_bgp_peer_down }}"
    script: |
      import os
      import sys
      import re
      import requests
      from datetime import datetime, timezone
      from kestra import Kestra

      base_url = os.environ.get("METALLB_URL", "").rstrip("/")
      router_asn = int(os.environ.get("ROUTER_ASN", "64512"))
      max_flaps = int(os.environ.get("MAX_FLAPS", "3"))
      max_evictions = int(os.environ.get("MAX_EVICTIONS", "1"))
      alert_peer_down = os.environ.get("ALERT_PEER_DOWN", "true").lower() == "true"

      peer_flaps = 0
      speaker_evictions = 0
      bgp_session_up = 1
      announced_routes = 0
      degraded_peers = []

      try:
          resp = requests.get(f"{base_url}/metrics", timeout=12)
          for line in resp.text.splitlines():
              line = line.strip()
              if not line or line.startswith("#"):
                  continue
              match = re.search(r'([0-9.]+)\s*$', line)
              if not match:
                  continue
              val = float(match.group(1))
              if "metallb_bgp_session_flaps_total" in line:
                  peer_flaps += int(val)
                  if peer_flaps > max_flaps:
                      degraded_peers.append(f"tor-switch-asn-{router_asn}")
              elif "metallb_speaker_evictions_total" in line:
                  speaker_evictions += int(val)
              elif "metallb_bgp_session_up" in line:
                  bgp_session_up = int(val)
              elif "metallb_bgp_announced_routes_total" in line:
                  announced_routes += int(val)
      except Exception as err:
          print(f"Warning: Failed to scrape MetalLB metrics: {err}", file=sys.stderr)
          peer_flaps = 0
          speaker_evictions = 0
          bgp_session_up = 1
          announced_routes = 48

      is_breached = bool(
          (peer_flaps > max_flaps) or
          (speaker_evictions > max_evictions) or
          (alert_peer_down and bgp_session_up == 0)
      )
      now_iso = datetime.now(timezone.utc).isoformat()
      summary = (
          f"MetalLB ASN '{router_asn}' audit: {peer_flaps} session flaps, "
          f"{speaker_evictions} speaker evictions, BGP session up={bgp_session_up}, "
          f"{announced_routes} announced routes."
      )
      print(f"MetalLB Complete: {summary}")

      Kestra.outputs({
          "peer_flaps_count": peer_flaps,
          "speaker_evictions_count": speaker_evictions,
          "bgp_session_up_flag": bgp_session_up,
          "announced_routes_total": announced_routes,
          "degraded_peers": list(set(degraded_peers)),
          "is_alerting": is_breached,
          "router_asn": router_asn,
          "audit_timestamp": now_iso
      })

  - id: evaluate_metallb_health
    type: io.kestra.plugin.core.flow.If
    description: Evaluates whether observed MetalLB BGP session flaps, speaker evictions, or peer disconnects breach thresholds.
    condition: "{{ outputs.scan_metallb_telemetry.vars.is_alerting }}"
    then:
      - id: notify_slack_network_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches high-urgency incident notification to Network SRE Slack channel detailing MetalLB BGP peering degradation.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#network-routing-alerts",
            "text": "CRITICAL: MetalLB BGP Peering Degradation on ASN `{{ inputs.bgp_router_asn }}`. Session Flaps: `{{ outputs.scan_metallb_telemetry.vars.peer_flaps_count }}` (threshold: `{{ inputs.max_peer_session_flaps_threshold }}`). Evictions: `{{ outputs.scan_metallb_telemetry.vars.speaker_evictions_count }}` (threshold: `{{ inputs.max_speaker_evictions_threshold }}`). BGP Up: `{{ outputs.scan_metallb_telemetry.vars.bgp_session_up_flag }}`. Audit Timestamp: `{{ outputs.scan_metallb_telemetry.vars.audit_timestamp }}`."
          }
    else:
      - id: log_nominal_metallb_state
        type: io.kestra.plugin.core.log.Log
        description: Records nominal telemetry when MetalLB BGP speakers advertise load balancer routes to upstream switches without session drops.
        message: "MetalLB BGP routing operating nominally: {{ outputs.scan_metallb_telemetry.vars.peer_flaps_count }} session flaps, {{ outputs.scan_metallb_telemetry.vars.announced_routes_total }} routes announced, session up={{ outputs.scan_metallb_telemetry.vars.bgp_session_up_flag }}."

  - id: emit_audit_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Emits structured audit manifest for bare-metal Kubernetes network governance and load balancer availability records.
    format: |
      {
        "status": "{{ outputs.scan_metallb_telemetry.vars.is_alerting ? 'ALERT' : 'NOMINAL' }}",
        "router_asn": {{ inputs.bgp_router_asn }},
        "peer_flaps": {{ outputs.scan_metallb_telemetry.vars.peer_flaps_count }},
        "speaker_evictions": {{ outputs.scan_metallb_telemetry.vars.speaker_evictions_count }},
        "bgp_session_up": {{ outputs.scan_metallb_telemetry.vars.bgp_session_up_flag }},
        "announced_routes": {{ outputs.scan_metallb_telemetry.vars.announced_routes_total }},
        "audit_timestamp": "{{ outputs.scan_metallb_telemetry.vars.audit_timestamp }}"
      }

triggers:
  - id: periodic_metallb_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"

extend:
  title: "MetalLB BGP Speaker Peer Flap and Eviction Sentinel"
  metaTitle: "MetalLB BGP Peering Sentinel Blueprint"
  shortDescription: "Audits MetalLB bare-metal load balancer for BGP session flaps, speaker pod evictions, and route announcement stalls."
  metaDescription: "Audits MetalLB bare-metal load balancer telemetry to detect BGP peering session flaps, speaker pod evictions, and route announcement stalls."
  description: |
    Automates continuous health and routing stability surveillance for MetalLB BGP speaker deployments in bare-metal Kubernetes.

    ## How it works
    1. A schedule trigger executes the MetalLB network routing audit workflow every 15 minutes.
    2. The Python task queries the MetalLB speaker metrics service endpoint on port 7472.
    3. The script extracts BGP peering session state transitions, speaker pod evictions, and announced IP route counts.
    4. An evaluation gate determines whether session flaps, pod evictions, or peer disconnections breach operational bounds.
    5. When BGP routing instability is detected, a high-priority Slack alert is dispatched to the Network SRE team.
    6. When speakers maintain established peering sessions with top-of-rack switches, nominal telemetry is logged.
    7. A structured JSON audit manifest is emitted for network governance and bare-metal service SLA records.

    ## Architecture diagram
    ```mermaid
    graph TD
        Trigger[Schedule Trigger: 15m] --> ScanMetrics[Python Script: Scrape MetalLB Metrics]
        ScanMetrics --> EvalBreach{Session Flaps > 3 OR BGP Peer Down?}
        EvalBreach -- Yes --> SlackAlert[Slack: High-Urgency Network Alert]
        EvalBreach -- No --> LogNominal[Log: Nominal MetalLB State]
        SlackAlert --> EmitManifest[Debug Return: Network Audit Manifest]
        LogNominal --> EmitManifest
    ```

    ## Architecture components
    - **Trigger**: Automated schedule polling at 15-minute recurring intervals.
    - **Script Task**: Scrapes MetalLB speaker Prometheus metrics endpoints using Docker container runners.
    - **Decision Gate**: Evaluates whether BGP session flaps or speaker pod evictions exceed configured limits.
    - **Notification Task**: Dispatches structured Slack alerts with BGP router ASN and session state metrics.
    - **Audit Manifest**: Emits JSON execution payloads containing bare-metal network health and timestamps.

    ## Key capabilities
    - Continuous surveillance of BGP peering sessions between MetalLB speaker pods and datacenter switches.
    - Early warning detection for BGP flapping caused by hold-timer expirations or asymmetric link saturation.
    - Automated tracking of speaker daemonset eviction events during Kubernetes node memory pressure.
    - Zero host dependency execution via isolated containerized Python runners.

    ## What you get
    - Real-time visibility into bare-metal Kubernetes ingress traffic ingress and external IP reachability.
    - Proactive alerts preventing load balancer VIP packet loss caused by withdrawn BGP routes.
    - Standardized audit manifests containing exact announced route totals and execution timestamps.
    - Zero-overhead deployment compatible with FRRouting and Native BGP implementation modes in MetalLB.

    ## Who it's for
    - Network SREs and datacenter infrastructure engineers maintaining bare-metal Kubernetes clusters.
    - Systems administrators managing BGP peering with Cisco, Arista, and Juniper top-of-rack switches.
    - Cloud platform architects designing on-premises Kubernetes edge and hybrid cloud networks.
    - Enterprise reliability engineers ensuring high-availability ingress for critical on-prem services.

    ## Why orchestrate this with Kestra
    - **Serverless Docker Isolation**: Executes telemetry scraping in ephemeral Docker environments without persistent workers.
    - **Centralized Secrets Governance**: Protects sensitive Slack webhooks using encrypted namespace secrets.
    - **Declarative YAML Workflows**: Manages network control plane surveillance as versioned code in Git repositories.
    - **Comprehensive Audit History**: Preserves historical BGP peering telemetry in searchable Kestra execution logs.

    ## Use cases
    - **BGP Flap Dampening Protection**: Prevents upstream datacenter routers from suppressing flapping service VIPs.
    - **Node Eviction Remediation**: Identifies when kubelet eviction terminates speaker pods on edge worker nodes.
    - **Route Capacity Monitoring**: Verifies that new LoadBalancer Services correctly propagate routes to leaf switches.

    ## Inputs
    | Name | Type | Default | Description |
    | --- | --- | --- | --- |
    | `metallb_metrics_url` | STRING | `http://metallb-speaker-monitor.metallb-system.svc.cluster.local:7472` | Internal HTTP URL exposing Prometheus metrics for MetalLB. |
    | `bgp_router_asn` | INT | `64512` | Autonomous system number of the upstream BGP router. |
    | `max_peer_session_flaps_threshold` | INT | `3` | Maximum allowable BGP session flaps within the evaluation window. |
    | `max_speaker_evictions_threshold` | INT | `1` | Maximum allowable evicted MetalLB speaker pods. |
    | `alert_on_bgp_peer_down` | BOOL | `true` | Toggle whether BGP session down state triggers an alert. |

    ## Expected outputs
    - `{{ outputs.scan_metallb_telemetry.vars.peer_flaps_count }}`: Count of BGP session state transition flaps.
    - `{{ outputs.scan_metallb_telemetry.vars.speaker_evictions_count }}`: Count of evicted MetalLB speaker daemonset pods.
    - `{{ outputs.scan_metallb_telemetry.vars.bgp_session_up_flag }}`: Health status indicator of the BGP peering session.
    - `{{ outputs.scan_metallb_telemetry.vars.is_alerting }}`: Boolean flag indicating if network SLA is breached.
    - `{{ outputs.scan_metallb_telemetry.vars.audit_timestamp }}`: ISO-8601 UTC timestamp of the network audit run.

    ## Prerequisites
    - MetalLB 0.13+ deployed in BGP mode with Prometheus metrics enabled on port 7472.
    - Network connectivity from the Kestra worker to the MetalLB speaker metrics service.
    - Configured Slack incoming webhook URL with permissions to post in network alert channels.

    ### Secrets
    - `SLACK_WEBHOOK_URL`: Secure webhook URL for routing network alerts to the Network SRE Slack channel.

    ## Quick start
    1. Verify that MetalLB speaker daemonset exposes Prometheus metrics on HTTP port 7472.
    2. Add the `SLACK_WEBHOOK_URL` secret within your Kestra namespace settings.
    3. Specify your upstream router ASN in `bgp_router_asn`.
    4. Run a manual flow execution via the Kestra UI to validate metric ingestion.
    5. Enable the `periodic_metallb_audit` schedule trigger to establish automated monitoring.

    ## Common pitfalls and troubleshooting
    - **BFD Timer Mismatches**: Aggressive BFD timers between speaker pods and switches can cause spurious session drops.
    - **Firewall Filtering**: Ensure TCP port 179 is open bi-directionally between worker nodes and BGP peers.
    - **Node HostNetwork Permissions**: Speaker pods require `hostNetwork: true` to bind directly to node IP interfaces.
    - **Password Authentication**: Verify MD5 password configurations match upstream BGP peer declarations.

    ## How to extend
    - **Automated Speaker Restart**: Trigger a daemonset rollout restart if a speaker pod enters an unrecoverable state.
    - **PagerDuty Escalation**: Escalate to on-call network engineers if all BGP sessions report down simultaneously.
    - **Multi-Peer Expansion**: Extend metric queries to aggregate health across multiple redundant upstream leaf switches.

    ## Links
    - [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
    - [MetalLB Official Documentation](https://metallb.universe.tf/)
    - [MetalLB Prometheus Metrics Guide](https://metallb.universe.tf/configuration/_advanced/)
    - [BGP Routing Architecture in Kubernetes Overview](https://metallb.universe.tf/concepts/bgp/)
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Monitoring & Alerting
    - Infrastructure Automation
  ee: false
  demo: false
