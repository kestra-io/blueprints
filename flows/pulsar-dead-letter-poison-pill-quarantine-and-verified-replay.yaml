id: pulsar-dead-letter-poison-pill-quarantine-and-verified-replay
namespace: company.streaming

description: |
  Inspect Apache Pulsar dead-letter topics, distinguish permanent poison pills from transient
  consumer processing failures, isolate unrecoverable messages to a quarantine topic, safely replay
  recoverable records back to the primary topic behind a human approval gate, and verify readback
  delivery via a non-durable Pulsar Reader while persisting audit state in Kestra KV.

inputs:
  - id: pulsar_service_url
    type: STRING
    displayName: Pulsar Service URL
    description: Pulsar binary protocol broker endpoint reachable from the Kestra worker.
    defaults: "pulsar://localhost:6650"

  - id: primary_topic
    type: STRING
    displayName: Primary Stream Topic
    description: Target primary topic where recoverable transient messages are replayed.
    defaults: "persistent://public/default/orders-v1"

  - id: dead_letter_topic
    type: STRING
    displayName: Dead-Letter Topic (DLQ)
    description: Dead-letter topic accumulating rejected or unroutable consumer records.
    defaults: "persistent://public/default/orders-dlq"

  - id: quarantine_topic
    type: STRING
    displayName: Quarantine Archive Topic
    description: Dedicated isolation topic for permanent poison pills and corrupted payloads.
    defaults: "persistent://public/default/orders-quarantine"

  - id: subscription_name
    type: STRING
    displayName: DLQ Consumer Subscription Name
    description: Shared subscription name used to drain or sample dead-letter messages.
    defaults: "kestra-dlq-remediation-sub"

  - id: max_batch_records
    type: INT
    displayName: Max DLQ Batch Records
    description: Maximum number of dead-letter records to consume in a single audit pass.
    defaults: 50

  - id: poll_timeout
    type: DURATION
    displayName: Polling Timeout
    description: Maximum duration to poll the dead-letter topic during the batch receive cycle.
    defaults: "PT5S"

  - id: max_delivery_attempts
    type: INT
    displayName: Max Delivery Attempt Threshold
    description: Delivery count ceiling above which records are classified as exhausted poison pills.
    defaults: 3

  - id: dry_run
    type: BOOL
    displayName: Dry Run Mode
    description: When true, plans and classifies records without routing to quarantine or primary topics.
    defaults: true

triggers:
  - id: periodic_dlq_audit_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    description: Run automated Pulsar dead-letter topic triage every 10 minutes.
    cron: "*/10 * * * *"
    disabled: true

  - id: on_demand_dlq_triage_webhook
    type: io.kestra.plugin.core.trigger.Webhook
    description: Authenticated HTTP endpoint invoked by Pulsar Alertmanager or incident runbooks.
    key: "{{ secret('PULSAR_DLQ_WEBHOOK_KEY') }}"

tasks:
  - id: validate_inputs
    type: io.kestra.plugin.core.execution.Assert
    description: Assert configuration inputs satisfy operational constraints.
    conditions:
      - "{{ inputs.pulsar_service_url | length > 0 }}"
      - "{{ inputs.primary_topic | length > 0 }}"
      - "{{ inputs.dead_letter_topic | length > 0 }}"
      - "{{ inputs.quarantine_topic | length > 0 }}"
      - "{{ inputs.max_batch_records > 0 }}"
      - "{{ inputs.max_delivery_attempts > 0 }}"
    errorMessage: "Invalid inputs. Pulsar service URL and all topic names must be non-empty, and thresholds must be positive."

  - id: consume_dead_letter_records
    type: io.kestra.plugin.pulsar.Consume
    description: Consume a batch of rejected messages from the Pulsar dead-letter topic.
    uri: "{{ inputs.pulsar_service_url }}"
    topic: "{{ inputs.dead_letter_topic }}"
    subscriptionName: "{{ inputs.subscription_name }}"
    subscriptionType: Shared
    deserializer: JSON
    maxRecords: "{{ inputs.max_batch_records }}"
    pollDuration: "{{ inputs.poll_timeout }}"
    maxDuration: PT30S
    allowFailure: true

  - id: convert_dlq_ion_to_jsonl
    type: io.kestra.plugin.serdes.json.IonToJson
    description: Convert consumed Ion message batch from internal storage into JSONL format for Python triage.
    from: "{{ outputs.consume_dead_letter_records.uri }}"

  - id: triage_and_classify_records
    type: io.kestra.plugin.scripts.python.Script
    description: Classify dead-letter records into poison pills and recoverable messages, evaluate historical trends, and construct remediation plans.
    containerImage: python:3.11-slim
    env:
      DLQ_TOPIC: "{{ inputs.dead_letter_topic }}"
      PRIMARY_TOPIC: "{{ inputs.primary_topic }}"
      QUARANTINE_TOPIC: "{{ inputs.quarantine_topic }}"
      MAX_DELIVERY_ATTEMPTS: "{{ inputs.max_delivery_attempts }}"
      DRY_RUN: "{{ inputs.dry_run }}"
      PREVIOUS_STATE_JSON: "{{ kv('pulsar_dlq_tracker_' ~ (inputs.dead_letter_topic | slugify), errorOnMissing=false) ?? '{}' }}"
      JSONL_FILE_PATH: "{{ outputs.convert_dlq_ion_to_jsonl.uri }}"
      EXECUTION_ID: "{{ execution.id }}"
    script: |
      import os
      import sys
      import json
      from datetime import datetime, timezone

      now_utc = datetime.now(timezone.utc)
      now_iso = now_utc.isoformat()

      dlq_topic = os.environ.get("DLQ_TOPIC", "persistent://public/default/orders-dlq")
      primary_topic = os.environ.get("PRIMARY_TOPIC", "persistent://public/default/orders-v1")
      quarantine_topic = os.environ.get("QUARANTINE_TOPIC", "persistent://public/default/orders-quarantine")
      max_delivery_attempts = int(os.environ.get("MAX_DELIVERY_ATTEMPTS", "3"))
      dry_run = os.environ.get("DRY_RUN", "true").lower() == "true"
      execution_id = os.environ.get("EXECUTION_ID", "manual")
      jsonl_file_path = os.environ.get("JSONL_FILE_PATH", "")

      prev_state_raw = os.environ.get("PREVIOUS_STATE_JSON", "{}")
      try:
          prev_state = json.loads(prev_state_raw) if prev_state_raw.strip() else {}
      except Exception:
          prev_state = {}

      total_dlq_records = 0
      poison_pills = []
      recoverable_records = []
      error_signature_counts = {}

      if jsonl_file_path and os.path.exists(jsonl_file_path):
          with open(jsonl_file_path, "r", encoding="utf-8") as f:
              for line in f:
                  line_str = line.strip()
                  if not line_str:
                      continue
                  total_dlq_records += 1
                  try:
                      record = json.loads(line_str)
                  except Exception as e:
                      # Raw unparseable container line
                      poison_pills.append({
                          "key": f"corrupt-line-{total_dlq_records}",
                          "value": {"raw_line": line_str, "parse_error": str(e)},
                          "properties": {
                              "x-kestra-quarantined": "true",
                              "x-kestra-quarantine-reason": f"UNPARSEABLE_CONTAINER_LINE: {str(e)}",
                              "x-kestra-source-dlq": dlq_topic,
                              "x-kestra-timestamp": now_iso
                          }
                      })
                      continue

                  raw_key = record.get("key") or f"msg-{total_dlq_records}"
                  raw_val = record.get("value")
                  props = record.get("properties") or {}
                  msg_id = str(record.get("messageId") or f"id-{total_dlq_records}")

                  # Extract delivery count from Pulsar properties
                  raw_delivery = props.get("RECONSUME_TIMES") or props.get("x-delivery-count") or props.get("delivery_count") or 1
                  try:
                      delivery_count = int(raw_delivery)
                  except Exception:
                      delivery_count = 1

                  error_type = props.get("error_type") or props.get("error") or props.get("exception") or "UNKNOWN_ERROR"
                  error_signature_counts[error_type] = error_signature_counts.get(error_type, 0) + 1

                  is_poison = False
                  quarantine_reason = ""

                  # Classification Rule 1: Null or empty body
                  parsed_payload = None
                  if raw_val is None:
                      is_poison = True
                      quarantine_reason = "NULL_PAYLOAD: Message body is null or empty"
                  elif isinstance(raw_val, dict):
                      parsed_payload = raw_val
                  elif isinstance(raw_val, str):
                      try:
                          parsed_payload = json.loads(raw_val)
                      except Exception as parse_err:
                          is_poison = True
                          quarantine_reason = f"CORRUPTED_JSON: Payload deserialization failed ({str(parse_err)})"

                  # Classification Rule 2: Business invariant validation
                  if not is_poison and isinstance(parsed_payload, dict):
                      if "amount" in parsed_payload:
                          try:
                              amount_val = float(parsed_payload["amount"])
                              if amount_val < 0:
                                  is_poison = True
                                  quarantine_reason = f"INVALID_BUSINESS_INVARIANT: Negative financial amount ({amount_val})"
                          except Exception:
                              pass
                      if "order_id" in parsed_payload and not str(parsed_payload["order_id"]).strip():
                          is_poison = True
                          quarantine_reason = "MISSING_MANDATORY_FIELD: Field 'order_id' is empty or blank"

                  # Classification Rule 3: Redelivery exhaustion without transient indication
                  is_transient_error = any(term in error_type.upper() for term in ["TIMEOUT", "503", "LOCK", "CONNECT", "TEMPORARY", "BUSY"])
                  if not is_poison and delivery_count >= max_delivery_attempts and not is_transient_error:
                      is_poison = True
                      quarantine_reason = f"RETRY_EXHAUSTED: Delivery attempt {delivery_count} reached threshold {max_delivery_attempts}"

                  if is_poison:
                      quarantined_record = {
                          "key": str(raw_key),
                          "value": parsed_payload if parsed_payload is not None else {"raw_payload": str(raw_val)},
                          "properties": {
                              **{str(k): str(v) for k, v in props.items()},
                              "x-kestra-quarantined": "true",
                              "x-kestra-quarantine-reason": quarantine_reason,
                              "x-kestra-source-dlq": dlq_topic,
                              "x-kestra-original-message-id": msg_id,
                              "x-kestra-quarantined-at": now_iso,
                              "x-kestra-execution-id": execution_id
                          }
                      }
                      poison_pills.append(quarantined_record)
                  else:
                      current_replay_count = int(props.get("x-kestra-replay-count", "0"))
                      replayed_record = {
                          "key": str(raw_key),
                          "value": parsed_payload if parsed_payload is not None else str(raw_val),
                          "properties": {
                              **{str(k): str(v) for k, v in props.items()},
                              "x-kestra-replayed": "true",
                              "x-kestra-replay-count": str(current_replay_count + 1),
                              "x-kestra-source-dlq": dlq_topic,
                              "x-kestra-replayed-at": now_iso,
                              "x-kestra-execution-id": execution_id
                          }
                      }
                      recoverable_records.append(replayed_record)

      # Cross-run trend comparison against historical KV state
      prev_batch_size = prev_state.get("last_batch_size", 0)
      prev_poison_count = prev_state.get("last_poison_count", 0)
      cumulative_dlq_seen = prev_state.get("cumulative_dlq_seen", 0) + total_dlq_records
      cumulative_poison_quarantined = prev_state.get("cumulative_poison_quarantined", 0) + len(poison_pills)
      cumulative_replayed = prev_state.get("cumulative_replayed", 0) + (0 if dry_run else len(recoverable_records))

      is_accelerating = (total_dlq_records > prev_batch_size * 2) and (total_dlq_records > 10)

      overall_status = "HEALTHY"
      if len(poison_pills) > 0:
          overall_status = "CRITICAL"
      elif len(recoverable_records) > 0 or is_accelerating:
          overall_status = "WARNING"

      summary_text = (
          f"Pulsar DLQ Triage: {overall_status} | Topic '{dlq_topic}'. "
          f"Batch: {total_dlq_records} record(s). Poison pills: {len(poison_pills)}. "
          f"Recoverable: {len(recoverable_records)}. Acceleration: {is_accelerating}. Dry run: {dry_run}."
      )
      print(summary_text)

      new_state_snapshot = {
          "last_evaluated_at": now_iso,
          "last_batch_size": total_dlq_records,
          "last_poison_count": len(poison_pills),
          "last_recoverable_count": len(recoverable_records),
          "cumulative_dlq_seen": cumulative_dlq_seen,
          "cumulative_poison_quarantined": cumulative_poison_quarantined,
          "cumulative_replayed": cumulative_replayed,
          "error_signatures": error_signature_counts,
          "is_accelerating": is_accelerating,
          "last_execution_id": execution_id
      }

      audit_manifest = {
          "overall_status": overall_status,
          "dead_letter_topic": dlq_topic,
          "primary_topic": primary_topic,
          "quarantine_topic": quarantine_topic,
          "total_dlq_records": total_dlq_records,
          "poison_count": len(poison_pills),
          "recoverable_count": len(recoverable_records),
          "error_signatures": error_signature_counts,
          "is_accelerating": is_accelerating,
          "dry_run": dry_run,
          "evaluated_at": now_iso,
          "execution_id": execution_id,
          "summary": summary_text
      }

      print("::" + json.dumps({
          "outputs": {
              "overall_status": overall_status,
              "has_dlq_records": total_dlq_records > 0,
              "total_dlq_records": total_dlq_records,
              "poison_count": len(poison_pills),
              "recoverable_count": len(recoverable_records),
              "poison_pills": poison_pills,
              "recoverable_records": recoverable_records,
              "new_state_snapshot": new_state_snapshot,
              "audit_manifest": audit_manifest,
              "summary": summary_text
          }
      }) + "::")

  - id: save_dlq_tracker_kv
    type: io.kestra.plugin.core.kv.Set
    description: Persist cumulative DLQ accumulation counters and trend telemetry into Kestra KV store.
    key: "pulsar_dlq_tracker_{{ inputs.dead_letter_topic | slugify }}"
    value: "{{ outputs.triage_and_classify_records.vars.new_state_snapshot | toJson }}"
    kvType: JSON

  - id: evaluate_dlq_findings
    type: io.kestra.plugin.core.flow.If
    description: Branch execution when dead-letter records were detected in the audit poll.
    condition: "{{ outputs.triage_and_classify_records.vars.has_dlq_records == true }}"
    then:
      - id: if_poison_pills_detected
        type: io.kestra.plugin.core.flow.If
        description: Isolate unrecoverable poison pills to dedicated quarantine topic when present and dry_run is disabled.
        condition: "{{ (not inputs.dry_run) and (outputs.triage_and_classify_records.vars.poison_count > 0) and (inputs.quarantine_topic | length > 0) }}"
        then:
          - id: publish_poison_pills_to_quarantine
            type: io.kestra.plugin.core.flow.Loop
            description: Route each quarantined poison pill to the quarantine archive topic.
            values: "{{ outputs.triage_and_classify_records.vars.poison_pills }}"
            tasks:
              - id: produce_to_quarantine_topic
                type: io.kestra.plugin.pulsar.Produce
                description: Publish enriched poison pill record with forensic metadata to quarantine topic.
                uri: "{{ inputs.pulsar_service_url }}"
                topic: "{{ inputs.quarantine_topic }}"
                serializer: JSON
                from:
                  key: "{{ fromJson(item.value).key }}"
                  value: "{{ fromJson(item.value).value }}"
                  properties: "{{ fromJson(item.value).properties }}"

      - id: replay_gate_to_primary_topic
        type: io.kestra.plugin.core.flow.If
        description: Replay recoverable transient failure messages to primary topic when dry_run is disabled.
        condition: "{{ not inputs.dry_run and (outputs.triage_and_classify_records.vars.recoverable_count > 0) }}"
        then:
          - id: pause_for_replay_approval
            type: io.kestra.plugin.core.flow.Pause
            description: Pause execution for operator verification before replaying recoverable records to primary topic. Resume to apply or kill to abort.

          - id: publish_replays_to_primary
            type: io.kestra.plugin.core.flow.Loop
            description: Publish approved recoverable messages back to the primary streaming topic.
            values: "{{ outputs.triage_and_classify_records.vars.recoverable_records }}"
            tasks:
              - id: produce_to_primary_topic
                type: io.kestra.plugin.pulsar.Produce
                description: Publish replayed message to the primary topic with incremented replay headers.
                uri: "{{ inputs.pulsar_service_url }}"
                topic: "{{ inputs.primary_topic }}"
                serializer: JSON
                from:
                  key: "{{ fromJson(item.value).key }}"
                  value: "{{ fromJson(item.value).value }}"
                  properties: "{{ fromJson(item.value).properties }}"

          - id: verify_primary_topic_readback
            type: io.kestra.plugin.pulsar.Reader
            description: Post-remediation verification sampling recent messages from primary topic using non-durable reader.
            uri: "{{ inputs.pulsar_service_url }}"
            topic: "{{ inputs.primary_topic }}"
            deserializer: JSON
            maxRecords: 10
            pollDuration: PT3S
            since: PT5M

          - id: log_verified_remediation
            type: io.kestra.plugin.core.log.Log
            description: Log verified message replay count and readback confirmation.
            message: "Successfully verified replay to {{ inputs.primary_topic }}. Sampled {{ outputs.verify_primary_topic_readback.messagesCount ?? 0 }} message(s) via non-durable Reader."

        else:
          - id: log_dry_run_or_no_recoverable
            type: io.kestra.plugin.core.log.Log
            description: Log planned replays in dry-run mode without mutating primary topic state.
            message: "Dry run mode active or no recoverable records found. Primary replay bypassed. Recoverable count: {{ outputs.triage_and_classify_records.vars.recoverable_count }}."

      - id: save_recovery_audit_kv
        type: io.kestra.plugin.core.kv.Set
        description: Persist audit manifest and triage certificate into Kestra KV store.
        key: "pulsar_dlq_audit_{{ inputs.dead_letter_topic | slugify }}"
        value: "{{ outputs.triage_and_classify_records.vars.audit_manifest | toJson }}"
        kvType: JSON

      - id: notify_dlq_triage_slack
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatch structured dead-letter triage and recovery notification to Slack.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: >-
          {{ {
            "text": ":warning: *Pulsar DLQ Triage Notification* | " ~ inputs.dead_letter_topic ~ "\n*Overall Status*: " ~ outputs.triage_and_classify_records.vars.overall_status ~ "\n*Total Records Audited*: " ~ outputs.triage_and_classify_records.vars.total_dlq_records ~ "\n*Poison Pills Quarantined*: " ~ outputs.triage_and_classify_records.vars.poison_count ~ "\n*Recoverable Replayed*: " ~ outputs.triage_and_classify_records.vars.recoverable_count ~ "\n*Dry Run*: " ~ inputs.dry_run ~ "\n*Execution*: " ~ execution.id ~ ""
          } | toJson }}

    else:
      - id: log_dlq_healthy
        type: io.kestra.plugin.core.log.Log
        description: Log healthy state when no dead-letter records are pending in the audit poll.
        message: "Pulsar dead-letter topic {{ inputs.dead_letter_topic }} is healthy. 0 records pending."

errors:
  - id: alert_on_flow_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Dispatch emergency incident alert to Slack on unhandled flow execution failure.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: >-
      {{ {
        "text": ":rotating_light: *Flow Execution Failed*: pulsar-dead-letter-poison-pill-quarantine-and-verified-replay (Execution: " ~ execution.id ~ "). Failed while auditing DLQ topic " ~ inputs.dead_letter_topic ~ ". Check Pulsar broker connectivity, network policies, or worker logs."
      } | toJson }}

extend:
  title: Isolate Apache Pulsar Dead-Letter Poison Pills to Quarantine and Verify Consumer Replay
  metaTitle: Pulsar Dead-Letter Poison Pill Quarantine & Replay Guard | Kestra
  shortDescription: Triage Apache Pulsar dead-letter topics, isolate malformed poison pills to a quarantine archive, and safely replay transient failures with readback verification.
  metaDescription: Triage Pulsar dead-letter topics, isolate poison pills to quarantine, and replay transient failures with operator approval and readback verification in Kestra.
  description: |
    Production Apache Pulsar event-streaming pipelines configure Dead-Letter Policies on consumer
    subscriptions to redirect messages that exceed maxRedeliverCount to a designated Dead-Letter
    Topic (DLQ). While this isolation mechanism protects consumer worker threads from persistent
    head-of-line blocking, dead-letter topics frequently become unmonitored data graveyards where
    messages accumulate until BookKeeper disk space thresholds or topic retention quotas trigger
    cluster-wide write alarms.

    A major operational challenge in managing dead-letter queues is that accumulated messages are
    heterogeneous:
    - **Permanent Poison Pills**: Malformed JSON payloads, schema deserialization regressions, or
      corrupted byte streams that will permanently crash consumers if replayed blindly back to the
      primary topic.
    - **Transient Failures**: Valid business events that failed due to temporary downstream HTTP 503
      timeouts, transient database connection lockups, or brief network partitions, which must be
      re-injected once downstream dependencies recover to prevent permanent data loss.

    This blueprint provides an automated dead-letter triage and verified remediation guard. It consumes
    batches from the Pulsar DLQ topic, triages records using Python into poison pills versus recoverable
    events, tracks cumulative arrival trends in Kestra KV, isolates poison records into a dedicated
    quarantine archive topic, gates primary topic replay behind an operator approval Pause, executes
    replay with incremented attempt headers, and performs post-remediation readback verification
    using a non-durable Pulsar Reader.

    ## How it works

    1. **Pre-flight Assertion**: The validate_inputs task (io.kestra.plugin.core.execution.Assert) validates that the Pulsar service endpoint, topic names, and processing batch sizes meet operational constraints.
    2. **DLQ Batch Ingestion**: The consume_dead_letter_records task (io.kestra.plugin.pulsar.Consume) connects to the Pulsar broker over native binary protocol (pulsar://), binding to the dead-letter topic under a Shared remediation subscription to ingest up to max_batch_records.
    3. **Serialization Normalization**: The convert_dlq_ion_to_jsonl task (io.kestra.plugin.serdes.json.IonToJson) translates the ingested batch from Kestra internal Ion format into JSON Lines for deterministic script parsing.
    4. **Differential Triage and Classification**: The triage_and_classify_records task (io.kestra.plugin.scripts.python.Script) analyzes each record's payload validity, business invariants, and delivery attempt counters:
       - Records with corrupted JSON, empty bodies, negative amounts, or unrecoverable error properties are flagged as POISON_PILL and formatted with forensic quarantine headers.
       - Records with valid syntax and transient failure signatures are flagged as RECOVERABLE and enriched with incremented x-kestra-replay-count properties.
       - Historical state from Kestra KV under pulsar_dlq_tracker_{topic} is compared against the current batch to identify accelerating failure spikes.
    5. **Cross-Run State Persistence**: The save_dlq_tracker_kv task (io.kestra.plugin.core.kv.Set) writes the updated accumulation counters, trend metadata, and error signatures into the Kestra namespace KV store.
    6. **Branching Evaluation**: The evaluate_dlq_findings task (io.kestra.plugin.core.flow.If) branches based on whether dead-letter records were present:
       - **Quarantine Isolation**: If poison pills exist, publish_poison_pills_to_quarantine (io.kestra.plugin.core.flow.Loop) routes each poisoned record to the dedicated quarantine topic (io.kestra.plugin.pulsar.Produce) to prevent accidental consumer re-consumption.
       - **Approval-Gated Replay**: When dry_run is disabled and recoverable records are present, pause_for_replay_approval (io.kestra.plugin.core.flow.Pause) halts execution for operator review. Upon approval, publish_replays_to_primary re-injects the events to the primary topic (io.kestra.plugin.pulsar.Produce).
       - **Post-Action Verification**: The verify_primary_topic_readback task (io.kestra.plugin.pulsar.Reader) opens a non-durable reader on the destination primary topic to confirm that replayed messages landed and are readable.
       - **Audit Telemetry & Escalation**: The complete triage manifest is stored in Kestra KV under pulsar_dlq_audit_{topic}, and actionable notifications are dispatched to Slack.
    7. **Error Safeguards**: The flow-level errors handler posts an immediate emergency alert to Slack if broker connectivity, schema translation, or authentication fails.

    ## What you get

    - Automated separation of fatal poison pills from recoverable transient consumer failures.
    - Dedicated quarantine isolation preventing poison pill crash loops on primary consumer groups.
    - Human-in-the-loop approval gate (Pause) protecting live stream integrity before replaying records.
    - Post-remediation verification via io.kestra.plugin.pulsar.Reader confirming successful delivery.
    - Historical accumulation tracking and acceleration detection stored across runs in Kestra KV.
    - Comprehensive Slack triage alerts with record counts, quarantine tallies, and replay status.

    ## Who it's for

    - Streaming Platform Engineers and Site Reliability Engineers operating Apache Pulsar clusters.
    - Event-Driven Architecture Teams maintaining mission-critical microservice consumer groups.
    - Data Platform Engineers preventing silent data loss in dead-letter and retry topics.

    ## Why orchestrate this with Kestra

    Apache Pulsar provides built-in dead-letter routing at the client level, but offers no native
    control-plane mechanisms to triage, inspect, or selectively replay accumulated dead-letter messages.
    Writing standalone CLI scripts or cron jobs creates unmonitored failure points lacking audit lineage,
    state persistence, human approval gates, and error escalation.

    Orchestrating this workflow with Kestra delivers a declarative solution with native binary Pulsar
    connectivity, automatic format conversion via plugin-serdes, cross-run state tracking in Kestra KV,
    dry-run execution modes, human-in-the-loop review, and verified readback validation.

    ## Prerequisites

    - An accessible Apache Pulsar cluster (version 2.10 or higher) reachable from the Kestra worker.
    - Pre-configured Pulsar topics for primary stream (orders-v1), DLQ (orders-dlq), and quarantine (orders-quarantine).
    - A Slack Incoming Webhook URL to receive triage and emergency alerts.

    ### Secrets

    - SLACK_WEBHOOK_URL: Slack Incoming Webhook URL used for triage notifications and execution failure alerts.
    - PULSAR_DLQ_WEBHOOK_KEY: Secret authentication key protecting the on-demand webhook trigger.

    ## Quick start

    1. Configure SLACK_WEBHOOK_URL and PULSAR_DLQ_WEBHOOK_KEY in your Kestra namespace secrets.
    2. Import this blueprint and set pulsar_service_url, primary_topic, dead_letter_topic, and quarantine_topic to match your environment.
    3. Run a manual test execution with dry_run: true to inspect pending DLQ records and review the generated triage classification.
    4. Review the execution logs, Slack alert recap, and Kestra KV store entry under pulsar_dlq_tracker_{topic}.
    5. Run with dry_run: false to approve and execute poison pill isolation and verified message replay.
    6. Enable the periodic_dlq_audit_schedule trigger to maintain automated dead-letter supervision.

    ## How to extend

    - **Schema Registry Validation**: Add io.kestra.plugin.pulsar.Reader with schemaType: AVRO or JSON to enforce schema compatibility checks before approving replay.
    - **Elasticsearch DLQ Indexing**: Chain an io.kestra.plugin.elasticsearch.Index task in the quarantine branch to index poisoned payloads into an Elasticsearch triage cluster for business analyst investigation.
    - **PagerDuty Incident Escalation**: Integrate io.kestra.plugin.pagerduty.notifications.PagerDutyAlert when is_accelerating evaluates to true, signaling a widespread downstream outage.

