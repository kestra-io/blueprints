id: chromadb-collection-count-memory-guard-sentinel
namespace: company.team

inputs:
  - id: chroma_host
    type: STRING
    defaults: "chromadb.internal"
    description: Hostname or IP of the ChromaDB server.
  - id: chroma_port
    type: INT
    defaults: 8000
    description: ChromaDB HTTP API port.
  - id: max_collections
    type: INT
    defaults: 50
    description: "Maximum expected active collections before raising capacity warning (default 50)."

tasks:
  - id: inspect_chroma_health
    type: io.kestra.plugin.scripts.shell.Commands
    commands:
      - |
        set -euo pipefail
        # Check ChromaDB heartbeat
        HEARTBEAT=$(curl -fsSL "http://{{ inputs.chroma_host }}:{{ inputs.chroma_port }}/api/v1/heartbeat" | jq '.["nanosecond heartbeat"] // 1')
        
        # Query ChromaDB collections
        COLLECTIONS_COUNT=$(curl -fsSL "http://{{ inputs.chroma_host }}:{{ inputs.chroma_port }}/api/v1/collections" | jq 'length')
        
        echo "::{\"outputs\": {\"collections_count\": $COLLECTIONS_COUNT, \"is_alive\": 1}}::"
  - id: evaluate_collection_sprawl
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.inspect_chroma_health.vars.collections_count | int > inputs.max_collections }}"
    then:
      - id: notify_ai_engineering
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#ai-platform",
            "attachments": [
              {
                "color": "warning",
                "title": "🚨 ChromaDB Collection Sprawl Capacity Warning",
                "text": "ChromaDB at `{{ inputs.chroma_host }}` has *{{ outputs.inspect_chroma_health.vars.collections_count }} active collections* (threshold {{ inputs.max_collections }})! High collection counts in standalone Chroma instances cause heavy in-memory HNSW index overhead and risk memory exhaustion.",
                "footer": "Kestra AI Sentinel • ChromaDB"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#ai-platform",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ ChromaDB Sentinel Failure",
            "text": "Failed to connect to ChromaDB heartbeat API. Verify server address and network connectivity.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 * * * *"
    disabled: true

extend:
  metaDescription: "Audits ChromaDB vector database heartbeat and collection growth to prevent in-memory embedding memory exhaustion."
  metaTitle: ChromaDB Embedded Vector Store Collection Growth and Health Sentinel with Kestra
  title: ChromaDB Embedded Vector Store Collection Growth and Health Sentinel
  shortDescription: Audits ChromaDB vector database heartbeat and collection growth to prevent in-memory embedding memory exhaustion.
  description: |
    ## How it works
    This workflow checks the operational heartbeat (`/api/v1/heartbeat`) and audits active vector collections (`/api/v1/collections`) on a standalone ChromaDB instance. In multi-tenant generative AI applications or agent workflows, developers frequently spawn ephemeral collections for individual user sessions or document uploads. Because Chroma maintains HNSW index structures in memory per collection, uncontrolled collection sprawl leads to severe memory bloat and eventual out-of-memory container crashes. This workflow tracks collection volume and triggers warnings when thresholds are exceeded.

    ## What you get
    - Automated heartbeat and uptime verification for ChromaDB vector services.
    - Prevents runaway memory consumption caused by abandoned session collections.
    - Clear visibility into active collection counts across development and staging environments.

    ## Who it's for
    - AI Application Developers and MLOps Engineers hosting ChromaDB instances.
    - Platform teams supporting internal generative AI prototypes and agent frameworks.

    ## Why orchestrate this with Kestra
    - **Continuous AI Infrastructure Monitoring**: Audit lightweight vector stores without requiring dedicated monitoring daemons.
    - **Scheduled Hygiene Verification**: Run hourly audits to catch memory leaks early.
    - **Direct Slack Alerts**: Notify AI teams with immediate resource counts.

    ## Prerequisites
    - ChromaDB running in server mode with HTTP API reachable.
    - Secret `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import the blueprint.
    2. Input Chroma host and port.
    3. Run the workflow to inspect current collection count.

    ## How to extend
    - Add an automated garbage-collection task to delete empty or stale collections older than 7 days.
    - Export collection metadata into a central inventory catalog.

    ## Links
    - [ChromaDB API Reference](https://docs.trychroma.com/reference/api)
    - [Kestra Documentation](https://kestra.io/docs)
  tags:
    - AI
    - Infrastructure
  subTags:
    - Agents & Structured Output
    - Day 2 Operations
  ee: false
  demo: false