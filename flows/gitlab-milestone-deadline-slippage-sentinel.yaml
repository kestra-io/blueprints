id: gitlab-milestone-deadline-slippage-sentinel
namespace: company.devops

inputs:
  - id: gitlab_host
    type: STRING
    displayName: GitLab Host Base URL
    defaults: "https://gitlab.com"
    description: Base URL for your GitLab instance (e.g. 'https://gitlab.com' or self-hosted 'https://gitlab.mycompany.com').

  - id: gitlab_project_path
    type: STRING
    displayName: GitLab Project Full Path
    defaults: "gitlab-org/gitlab"
    description: Full path of the target GitLab project (e.g. 'group/subgroup/project' or 'owner/repo').

  - id: days_ahead_horizon
    type: INT
    displayName: Milestone Lookahead Horizon (Days)
    defaults: 14
    description: Number of days ahead to inspect milestone target due dates for slippage risk.

  - id: min_completion_percent
    type: INT
    displayName: Minimum Expected Completion Percentage
    defaults: 50
    description: Expected percentage of closed issues for approaching milestones before flagging as at-risk.

  - id: milestone_batch_limit
    type: INT
    displayName: Milestone Batch Limit
    defaults: 20
    description: Maximum number of active milestones to retrieve and evaluate per execution.

triggers:
  - id: weekly_milestone_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: Weekly Monday morning audit at 08:00 UTC to identify approaching GitLab milestones at risk of deadline slippage. Shipped disabled by default.
    cron: "0 8 * * 1"
    disabled: true

tasks:
  - id: fetch_active_milestones
    type: io.kestra.plugin.graphql.Request
    description: Query GitLab GraphQL API for active milestones with due dates and issue completion metrics.
    uri: "{{ inputs.gitlab_host }}/api/graphql"
    headers:
      Authorization: "Bearer {{ secret('GITLAB_API_TOKEN') }}"
      Content-Type: "application/json"
      User-Agent: "Kestra-GitLab-Milestone-Sentinel/1.0"
    failOnGraphQLErrors: false
    allowFailed: true
    query: |
      query {
        project(fullPath: "{{ inputs.gitlab_project_path }}") {
          milestones(state: active, first: {{ inputs.milestone_batch_limit }}) {
            nodes {
              id
              title
              dueDate
              webPath
              stats {
                totalIssuesCount
                closedIssuesCount
              }
            }
          }
        }
      }

  - id: evaluate_milestone_health
    type: io.kestra.plugin.scripts.python.Script
    description: Parse milestone due dates and isolate active milestones lagging behind completion targets.
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    env:
      MILESTONES_DATA: "{{ outputs.fetch_active_milestones.body | toJson }}"
      GITLAB_HOST: "{{ inputs.gitlab_host }}"
      DAYS_AHEAD: "{{ inputs.days_ahead_horizon }}"
      MIN_COMPLETION: "{{ inputs.min_completion_percent }}"
    script: |
      import os
      import json
      from datetime import datetime, timezone, timedelta

      raw_data = json.loads(os.environ.get("MILESTONES_DATA", "{}"))
      host = os.environ.get("GITLAB_HOST", "https://gitlab.com").rstrip("/")
      days_ahead = int(os.environ.get("DAYS_AHEAD", 14))
      min_completion = int(os.environ.get("MIN_COMPLETION", 50))

      milestones = ((raw_data.get("project") or {}).get("milestones") or {}).get("nodes") or []
      now = datetime.now(timezone.utc)
      horizon = now + timedelta(days=days_ahead)

      at_risk = []
      for m in milestones:
          due_str = m.get("dueDate")
          if not due_str:
              continue

          try:
              due_dt = datetime.fromisoformat(due_str).replace(tzinfo=timezone.utc)
          except Exception:
              continue

          stats = m.get("stats") or {}
          total = int(stats.get("totalIssuesCount") or 0)
          closed = int(stats.get("closedIssuesCount") or 0)

          if total == 0:
              continue

          pct = int(round((closed / total) * 100))
          web_url = f"{host}{m.get('webPath', '')}" if m.get("webPath") else host

          if now <= due_dt <= horizon and pct < min_completion:
              days_remaining = (due_dt - now).days
              at_risk.append({
                  "title": m.get("title"),
                  "due_date": due_str,
                  "days_remaining": days_remaining,
                  "completion_pct": pct,
                  "total_issues": total,
                  "closed_issues": closed,
                  "url": web_url
              })

      summary_lines = [
          f"• *{m['title']}* ({m['completion_pct']}% complete: {m['closed_issues']}/{m['total_issues']} issues closed, due in {m['days_remaining']} days on {m['due_date']}) - <{m['url']}|View Milestone>"
          for m in at_risk
      ]
      summary_text = "\\n".join(summary_lines) if summary_lines else "All approaching milestones meet completion targets."

      output_payload = {
          "at_risk_count": len(at_risk),
          "at_risk_milestones": at_risk,
          "summary_text": summary_text
      }

      print(f'::{"outputs": {json.dumps(output_payload)}}::')

  - id: evaluate_at_risk_milestones
    type: io.kestra.plugin.core.flow.If
    description: Evaluate whether any active milestones are at risk of missing target deadlines.
    condition: "{{ outputs.evaluate_milestone_health.vars.at_risk_count > 0 }}"
    then:
      - id: alert_milestone_risks
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatch high-priority Slack notification itemizing at-risk milestones to Engineering Leads.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "⚠️ *GITLAB ROADMAP RISK: Approaching Milestones at Risk of Slipping* ⚠️\n\n*Project:* `{{ inputs.gitlab_project_path }}`\n*At-Risk Milestones Count:* {{ outputs.evaluate_milestone_health.vars.at_risk_count }}\n*Evaluation Window:* Due in next {{ inputs.days_ahead_horizon }} days (Threshold: < {{ inputs.min_completion_percent }}% complete)\n\n*Milestones Requiring Attention:*\n{{ outputs.evaluate_milestone_health.vars.summary_text }}\n\n*Execution ID:* {{ execution.id }}\n*Action Required:* Engineering leads please review issue blockers, reprioritize scope, or adjust target delivery dates."
          }
    else:
      - id: log_milestones_on_track
        type: io.kestra.plugin.core.log.Log
        description: Log clean status when all approaching milestones are tracking on schedule.
        message: "HEALTHY: All approaching milestones in {{ inputs.gitlab_project_path }} meet the {{ inputs.min_completion_percent }}% completion threshold."

  - id: log_audit_summary
    type: io.kestra.plugin.core.log.Log
    description: Record final audit metrics for sprint velocity governance.
    message: "GitLab milestone slippage audit completed for {{ inputs.gitlab_project_path }}. At-risk milestones count: {{ outputs.evaluate_milestone_health.vars.at_risk_count }}."

errors:
  - id: alert_on_gitlab_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alert Engineering Operations if GitLab GraphQL API request encounters failure.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "⚠️ *GitLab Milestone Sentinel Error*: Execution `{{ execution.id }}` failed to query project `{{ inputs.gitlab_project_path }}`. Check GITLAB_API_TOKEN permissions."
      }

outputs:
  - id: status
    type: STRING
    value: "{{ outputs.evaluate_milestone_health.vars.at_risk_count > 0 ? 'MILESTONES_AT_RISK' : 'HEALTHY' }}"
  - id: at_risk_count
    type: INT
    value: "{{ outputs.evaluate_milestone_health.vars.at_risk_count }}"

extend:
  title: GitLab milestone deadline slippage and delivery risk sentinel
  metaTitle: GitLab Milestone Slippage Sentinel | Kestra
  shortDescription: Weekly governance sentinel that queries GitLab GraphQL API for active milestones at risk of slipping past target due dates, alerting engineering leads.
  metaDescription: Audit GitLab milestones via GraphQL API for approaching due dates with low completion rates and alert engineering leads to prevent missed sprint deadlines.
  description: |
    Maintain predictable release schedules and prevent sprint deliverables from quietly slipping past commitments. In agile software teams managing releases in GitLab, project milestones and sprint iterations frequently approach their target `dueDate` with substantial open work remaining because blockers, scope creep, or resource constraints were not identified early enough to take corrective action. This blueprint executes a weekly audit every Monday morning via the GitLab GraphQL API (`io.kestra.plugin.graphql.Request`), calculates real-time completion percentages against remaining days to ship using an isolated Python evaluation task, and delivers an actionable Slack alert to engineering managers highlighting at-risk iterations.

    ## How it works
    1. A `Schedule` trigger initiates a milestone health audit every Monday morning at 08:00 UTC (shipped disabled by default).
    2. Task `fetch_active_milestones` queries the GitLab GraphQL API endpoint (`{{ inputs.gitlab_host }}/api/graphql`) authenticated via `GITLAB_API_TOKEN`. It fetches active milestones along with titles, due dates, web paths, and issue counts (`totalIssuesCount` and `closedIssuesCount`).
    3. Task `evaluate_milestone_health` (`io.kestra.plugin.scripts.python.Script`) calculates completion percentages:
       - Milestones due within `inputs.days_ahead_horizon` (e.g. 14 days) whose closed-issue ratio is below `inputs.min_completion_percent` (e.g. 50%) are flagged as at-risk.
       - The task formats an itemized summary string and exports structured metrics via Kestra's stdout output protocol.
    4. Task `evaluate_at_risk_milestones` (`io.kestra.plugin.core.flow.If`) delivers an urgent Slack notification if any milestones are at risk, or logs a healthy message if all milestones are on track.
    5. Top-level `errors` handler dispatches a notification if the GitLab API returns authentication or network errors.

    ## What you get
    - Continuous weekly visibility into sprint and release predictability in GitLab.
    - Proactive early warning of milestones that will miss their target delivery dates.
    - Clickable Slack digests linking engineering leads directly to affected GitLab milestones.
    - Objectively computed progress metrics based directly on closed issue counts.

    ## Who it's for
    - Engineering Managers and Technical Leads running sprints or releases on GitLab.
    - Release Managers and Program Managers tracking cross-team deliverables.
    - DevOps and Delivery Leads optimizing cycle time and sprint completion ratios.

    ## Why orchestrate this with Kestra
    Checking milestone burn-down charts manually across multiple GitLab projects and groups is time-consuming. Kestra provides automated, scheduled orchestration that queries GitLab's native GraphQL schema, evaluates deadlines mathematically in Python, and routes formatted briefings into Slack without maintaining custom webhooks or cron bots.

    ## Prerequisites
    - A GitLab project (on gitlab.com or self-hosted GitLab).
    - A GitLab Personal Access Token or Project Access Token with `read_api` scope.
    - A Slack Incoming Webhook URL.

    ### Secrets
    - `GITLAB_API_TOKEN`: GitLab access token passed in the `Authorization: Bearer` header.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL used to post milestone briefings.

    ## Quick start
    1. Generate a GitLab Project Access Token under **Project Settings > Access Tokens** with `read_api` scope.
    2. Store `GITLAB_API_TOKEN` and `SLACK_WEBHOOK_URL` in Kestra Secrets.
    3. Configure `gitlab_project_path` with your project's full path (e.g. `gitlab-org/gitlab`).
    4. Execute the flow manually in Kestra to confirm successful GraphQL connection.
    5. Enable the `weekly_milestone_audit` schedule to activate weekly Monday morning milestone sweeps.

    ## How to extend
    - Extend the GraphQL query to inspect merge requests linked to milestones for deeper code completion tracking.
    - Add an auto-escalation step to reassign unassigned milestone issues to active team leads.
    - Export milestone velocity metrics to ClickHouse or Prometheus to benchmark team delivery accuracy over quarters.

    ## Links
    - [GitLab GraphQL API: Milestone](https://docs.gitlab.com/ee/api/graphql/reference/#milestone)
    - [Kestra GraphQL Plugin](https://kestra.io/plugins/plugin-graphql)
    - [Kestra Python Script Task](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Notification Plugin](https://kestra.io/plugins/plugin-slack)
  tags:
    - Infrastructure
    - Business
  subTags:
    - CI/CD & Deployment
    - Reporting & Digests
  ee: false
  demo: false
