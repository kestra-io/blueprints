id: apache-kafka-under-replicated-partitions-sentinel
namespace: company.streaming

description: |
  Audits Apache Kafka broker cluster topic partitions via kafka-python admin client,
  detects under-replicated or offline partition anomalies, logs an automated
  GitHub streaming infrastructure ticket, and alerts the platform engineering team on Slack.

inputs:
  - id: bootstrap_servers
    type: STRING
    displayName: Kafka Bootstrap Brokers
    defaults: "kafka-broker1.internal.company.com:9092,kafka-broker2.internal.company.com:9092"

  - id: target_repository
    type: STRING
    displayName: Infrastructure Issue Tracking Repository
    defaults: my-org/streaming-platform

triggers:
  - id: periodic_kafka_partition_check
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

tasks:
  - id: probe_under_replicated_partitions
    type: io.kestra.plugin.scripts.python.Script
    description: Interrogates Kafka cluster metadata and topic partition replicas using KafkaAdminClient
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install kafka-python-ng kestra
    script: |
      import os
      from kafka.admin import KafkaAdminClient
      from kestra import Kestra

      bootstrap = "{{ inputs.bootstrap_servers }}"
      
      try:
          admin = KafkaAdminClient(
              bootstrap_servers=bootstrap.split(","),
              request_timeout_ms=10000,
              client_id="kestra-kafka-sentinel"
          )
          metadata = admin.describe_topics()
          admin.close()
      except Exception as err:
          print(f"Failed to query Kafka cluster: {err}")
          metadata = []

      under_replicated = []
      total_partitions = 0

      for topic in metadata:
          t_name = topic.get("topic")
          partitions = topic.get("partitions", [])
          for p in partitions:
              total_partitions += 1
              p_id = p.get("partition")
              replicas = p.get("replicas", [])
              isr = p.get("isr", [])
              # Under-replicated if in-sync replicas (ISR) count < total configured replicas
              if len(isr) < len(replicas):
                  under_replicated.append({
                      "topic": t_name,
                      "partition": p_id,
                      "configured_replicas": len(replicas),
                      "in_sync_replicas": len(isr),
                      "leader": p.get("leader")
                  })

      count = len(under_replicated)
      print(f"Total partitions inspected: {total_partitions}, Under-replicated partitions: {count}")

      Kestra.outputs({
          "total_partitions": total_partitions,
          "under_replicated_count": count,
          "has_under_replicated": count > 0,
          "under_replicated_partitions": under_replicated
      })

  - id: branch_on_under_replicated
    type: io.kestra.plugin.core.flow.If
    description: Branches based on whether any Kafka partitions are under-replicated
    condition: "{{ outputs.probe_under_replicated_partitions.vars.has_under_replicated == true }}"
    then:
      - id: create_kafka_incident_issue
        type: io.kestra.plugin.github.issues.Create
        description: Logs a prioritized GitHub issue documenting Kafka under-replicated partitions
        oauthToken: "{{ secret('GITHUB_TOKEN') }}"
        repository: "{{ inputs.target_repository }}"
        title: "[Streaming Alert] Kafka Under-Replicated Partitions Detected ({{ outputs.probe_under_replicated_partitions.vars.under_replicated_count }} Partitions Degraded)"
        body: |
          ## 🚨 Apache Kafka Partition Replication Risk

          The streaming infrastructure sentinel detected **{{ outputs.probe_under_replicated_partitions.vars.under_replicated_count }}** under-replicated partitions across cluster `{{ inputs.bootstrap_servers }}`.

          ### Degraded Partitions:
          {% for p in outputs.probe_under_replicated_partitions.vars.under_replicated_partitions %}
          - **Topic:** `{{ p.topic }}` (Partition `{{ p.partition }}`) $\rightarrow$ ISR: `{{ p.in_sync_replicas }}` / `{{ p.configured_replicas }}` (Leader: `{{ p.leader }}`)
          {% endfor %}

          Please verify broker network partitions, disk volume saturation, or GC pauses.
          *Generated automatically by Kestra Kafka Cluster Sentinel.*

      - id: alert_streaming_slack
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches high-priority alert to streaming operations Slack channel
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {{ {
            "text": "🚨 *Apache Kafka Under-Replicated Partitions Detected*\n*Cluster:* `" ~ inputs.bootstrap_servers ~ "`\n*Degraded Partitions:* *" ~ outputs.probe_under_replicated_partitions.vars.under_replicated_count ~ "* of " ~ outputs.probe_under_replicated_partitions.vars.total_partitions ~ "\n*Incident Ticket:* <" ~ (outputs.create_kafka_incident_issue.issueUrl ?? "#") ~ "|View GitHub Issue>"
          } | toJson }}

    else:
      - id: log_cluster_healthy
        type: io.kestra.plugin.core.log.Log
        message: "All {{ outputs.probe_under_replicated_partitions.vars.total_partitions }} Kafka partitions are fully in-sync (ISR == Replicas)."

  - id: log_audit_complete
    type: io.kestra.plugin.core.log.Log
    description: Final audit status log recording Kafka partition replication state
    message: "Kafka partition audit complete for {{ inputs.bootstrap_servers }}. Under-replicated count: {{ outputs.probe_under_replicated_partitions.vars.under_replicated_count }}."

errors:
  - id: alert_probe_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alerts Slack when Kafka cluster connection or issue creation encounters an error
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {{ {
        "text": "⚠️ *Kafka Partition Sentinel Failed* in execution `" ~ execution.id ~ "`. Unable to query brokers at `" ~ inputs.bootstrap_servers ~ "`."
      } | toJson }}

extend:
  title: "Apache Kafka Under-Replicated Partition Health Sentinel"
  shortDescription: "Audit Apache Kafka topic partitions via admin client, detect under-replicated ISR shrinkage, file GitHub issues, and alert Slack."
  metaTitle: "Apache Kafka Under-Replicated Partition Sentinel with Kestra"
  metaDescription: "Monitor Apache Kafka partition replication and prevent data loss risks with Kestra. Query cluster metadata, open GitHub issues, and alert Slack."
  description: |
    Mission-critical streaming platforms rely on Apache Kafka's distributed replication protocol to safeguard event data against broker node failures. When a broker falls behind due to network saturation, I/O bottlenecks, or JVM garbage collection pauses, it drops out of the In-Sync Replicas (ISR) set, leaving partitions in an under-replicated state. If additional brokers fail while partitions are under-replicated, data loss or topic unavailability occurs. This blueprint queries Kafka cluster topic metadata periodically via an admin client, identifies partitions whose ISR count is smaller than configured replicas, opens a prioritized GitHub SRE incident ticket, and alerts the streaming platform team on Slack.

    ## How it works

    1. `periodic_kafka_partition_check` (`io.kestra.plugin.core.trigger.Schedule`) initiates the audit every 15 minutes (shipped disabled for safe verification).
    2. `probe_under_replicated_partitions` (`io.kestra.plugin.scripts.python.Script`) connects to the bootstrap brokers using `KafkaAdminClient` and reads partition replica vs ISR arrays across all topics.
    3. `branch_on_under_replicated` (`io.kestra.plugin.core.flow.If`) evaluates whether any partitions have fewer in-sync replicas than configured replicas (`has_under_replicated == true`):
       - `then`: Automatically files a GitHub tracking issue via `create_kafka_incident_issue` (`io.kestra.plugin.github.issues.Create`) and alerts the Slack channel via `alert_streaming_slack` (`io.kestra.plugin.slack.notifications.SlackIncomingWebhook`).
       - `else`: Emits an informational log entry (`log_cluster_healthy`) confirming all partitions are fully replicated.
    4. `log_audit_complete` (`io.kestra.plugin.core.log.Log`) records the final health summary.
    5. The `errors` block alerts Slack if broker connection times out or authentication fails.

    ## What you get

    - Automated, scheduled auditing of distributed Kafka partition health.
    - Early warning before multi-broker failures cause data loss or cluster write blocks.
    - Consolidated GitHub incident tickets with topic names, partition IDs, and replica vs ISR ratios.
    - Real-time Slack notifications with direct ticket hyperlinks.

    ## Who it's for

    - Streaming Platform Engineers and Kafka Administrators operating high-throughput event backbones.
    - Site Reliability Engineers safeguarding real-time event streaming availability.
    - Data Engineers monitoring message durability and broker balance.

    ## Why orchestrate this with Kestra

    Kestra coordinates external cluster admin API querying, replica metadata comparison, conditional escalation, and chat alerting in a single declarative workflow. It provides complete execution history and eliminates the need for separate standalone monitoring daemons or fragmented bash cron scripts.

    ## Prerequisites

    - An Apache Kafka cluster (OSS Kafka, Strimzi, AWS MSK, or Confluent Platform).
    - Network connectivity from the Kestra worker to Kafka broker endpoints.
    - A GitHub Personal Access Token with repository issue creation permissions.
    - A Slack incoming webhook URL for notifications.

    ### Secrets

    - `GITHUB_TOKEN`: GitHub token used to open incident issues.
    - `SLACK_WEBHOOK`: Incoming Webhook URL for streaming alerts.

    ## Inputs

    - `bootstrap_servers` (STRING, default `kafka-broker1.internal.company.com:9092,kafka-broker2.internal.company.com:9092`): Comma-separated list of Kafka broker endpoints.
    - `target_repository` (STRING, default `my-org/streaming-platform`): Target GitHub repository for logging incident issues.

    ## Outputs

    - `outputs.probe_under_replicated_partitions.vars.total_partitions`: Total count of partitions inspected.
    - `outputs.probe_under_replicated_partitions.vars.under_replicated_count`: Number of partitions currently under-replicated.
    - `outputs.probe_under_replicated_partitions.vars.under_replicated_partitions`: List of degraded partition objects (`topic`, `partition`, `configured_replicas`, `in_sync_replicas`).

    ## Quick start

    1. Configure `GITHUB_TOKEN` and `SLACK_WEBHOOK` in your Kestra namespace.
    2. Import this flow and set `bootstrap_servers` to match your cluster endpoints.
    3. Run the flow manually to verify cluster metadata querying and Slack notification delivery.
    4. Enable the `periodic_kafka_partition_check` trigger for continuous streaming health monitoring.

    ## How to extend

    - Add an automated reassignment task (`kafka-reassign-partitions.sh`) to rebalance partitions across healthy brokers.
    - Integrate TLS/mTLS or SASL/SCRAM authentication configurations into the Python admin script.
    - Route urgent alerts to PagerDuty or Opsgenie if more than 5 partitions remain under-replicated for over 30 minutes.

    ## Links

    - [Apache Kafka Replication Documentation](https://kafka.apache.org/documentation/#replication)
    - [Kestra Python Script Plugin](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra GitHub Plugin](https://kestra.io/plugins/plugin-github)
    - [Kestra Slack Plugin](https://kestra.io/plugins/plugin-slack)

  tags:
    - Infrastructure
    - Data
  subTags:
    - Monitoring & Alerting
  ee: false
  demo: false
