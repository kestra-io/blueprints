id: kafka-connect-paused-connector-resume-guard
namespace: company.team

description: |
  Find Kafka Connect connectors that are paused or stopped instead of failed, hold them until
  they have been silent for a whole grace window, then resume only those behind an approval gate
  and re-read the Connect REST API to prove each one is running again. A paused connector is not
  a failed connector. It raises no error, fills no error log, trips no FAILED check. It just
  stops moving records. Connectors on an expected-paused allowlist are never resumed, connectors
  silent for less than the grace window are only reported. Task states are read as well as
  the connector state because a connector can read RUNNING while every task under it is paused.

inputs:
  - id: connect_url
    type: STRING
    displayName: Kafka Connect REST endpoint
    description: Base URL of the Connect worker REST API, for example http://connect:8083. Held as a secret because it is an internal admin endpoint.
    defaults: "{{ secret('KAFKA_CONNECT_URL') }}"

  - id: expected_paused
    type: ARRAY
    itemType: STRING
    displayName: Connectors that are allowed to stay paused
    description: Connector names paused on purpose, for example one held during a migration or a backfill that is being released by hand. These are reported on every run but never resumed.
    defaults: []

  - id: min_paused_minutes
    type: INT
    displayName: Minutes a connector must stay silent before it can be resumed
    description: Measured from the first run that saw the connector silent in its current state. Anything newer is reported, never resumed, so a maintenance window that is still running is left alone.
    defaults: 30

  - id: verify_delay
    type: DURATION
    displayName: Wait before the re-read
    description: A resumed connector needs a moment for the worker to hand its tasks back out, so the re-read waits this long before deciding whether the resume landed.
    defaults: PT10S

  - id: auto_remediate
    type: BOOL
    displayName: Auto remediate
    defaults: false

  - id: dry_run
    type: BOOL
    displayName: Dry run
    description: Must be false, together with auto_remediate, for ConnectorResume to run.
    defaults: true

variables:
  kv_key: "kafka_connect_paused_{{ inputs.connect_url | slugify }}"

tasks:
  - id: freeze
    type: io.kestra.plugin.core.output.OutputValues
    description: One timestamp for the whole run, so the detect, the cursor and the age check agree.
    values:
      now_iso: >-
        {{ execution.startDate | date("yyyy-MM-dd'T'HH:mm:ss.SSS'Z'", timeZone="UTC") }}
      cutoff_iso: >-
        {{ execution.startDate | dateAdd(-1 * inputs.min_paused_minutes, 'MINUTES') | date("yyyy-MM-dd'T'HH:mm:ss.SSS'Z'", timeZone="UTC") }}

  - id: list_connectors
    type: io.kestra.plugin.kafka.ConnectorList
    description: >-
      Read-only. Every connector on the worker with its connector state and the state of each of
      its tasks, which is the only call that shows a paused connector at all.
    connectUrl: "{{ inputs.connect_url }}"
    expandStatus: true
    retry:
      type: constant
      interval: PT10S
      maxAttempts: 3

  - id: analyze
    type: io.kestra.plugin.core.output.OutputValues
    description: >-
      A connector counts as silent when its own state is PAUSED or STOPPED, as well as when it reads
      otherwise while one of its tasks is PAUSED. Allowlisted names are split out here so they
      can never reach the resume step.
    values:
      result: >-
        {{ {'c': (outputs.list_connectors.connectors ?? []), 'allow': inputs.expected_paused} | jq('.c as $c | .allow as $allow | [$c[] | {name: .connectorName, state: (.connectorState // "UNKNOWN"), tasks: ((.tasks // []) | length), paused_tasks: ((.tasks // []) | map(select(.state == "PAUSED")) | length), failed_tasks: ((.tasks // []) | map(select(.state == "FAILED")) | length)} | . + {sig: (.state + "/" + (.paused_tasks | tostring) + "/" + (.tasks | tostring)), reason: (if .state == "PAUSED" then "connector PAUSED" elif .state == "STOPPED" then "connector STOPPED" else "connector " + .state + " with " + (.paused_tasks | tostring) + " of " + (.tasks | tostring) + " tasks PAUSED" end)}] as $all | [$all[] | select(.state == "PAUSED" or .state == "STOPPED" or (.tasks > 0 and .paused_tasks > 0))] as $silent | {total: ($all | length), healthy: ([$all[] | select(.state == "RUNNING" and .paused_tasks == 0 and .failed_tasks == 0)] | length), failed: ([$all[] | select(.state == "FAILED" or .failed_tasks > 0)] | length), allowlisted: ([$silent[] | select(((([.name] - $allow)) | length) == 0)] | map(.name) | sort), candidates: ([$silent[] | select(((([.name] - $allow)) | length) > 0)] | sort_by(.name)), candidate_names: ([$silent[] | select(((([.name] - $allow)) | length) > 0)] | map(.name) | sort), inventory: ([$all[] | .name + " state=" + .state + " tasks=" + ((.tasks - .paused_tasks) | tostring) + "/" + (.tasks | tostring) + " running"] | sort | join(" | "))}') | first | toJson }}

  - id: route
    type: io.kestra.plugin.core.flow.If
    condition: "{{ fromJson(outputs.analyze.values.result).candidates | length > 0 }}"
    then:
      - id: cursor_merge
        type: io.kestra.plugin.core.output.OutputValues
        description: >-
          Keep the first time each candidate was seen in its current silent state. A candidate
          that is new gets now. So does one whose state moved, so a connector that was stopped
          then paused starts its clock again rather than inheriting an old date.
        values:
          merged: >-
            {{ {'cur': (kv(render(vars.kv_key), errorOnMissing=false) ?? ''), 'cand': fromJson(outputs.analyze.values.result).candidates, 'now': outputs.freeze.values.now_iso} | jq('(.cur | if type=="string" then (if . == "" then {} else fromjson end) else . end) as $c | .now as $n | reduce .cand[] as $x ({}; . + {($x.name): (if ($c[$x.name] != null and $c[$x.name].sig == $x.sig) then ($x + {first_seen: $c[$x.name].first_seen}) else ($x + {first_seen: $n}) end)})') | first | toJson }}

      - id: save_cursor
        type: io.kestra.plugin.core.kv.Set
        description: No ttl. This is a first-seen record that must not expire out from under the age check.
        key: "{{ render(vars.kv_key) }}"
        kvType: JSON
        value: "{{ outputs.cursor_merge.values.merged }}"

      - id: split
        type: io.kestra.plugin.core.output.OutputValues
        description: Candidates past the grace window become targets. The rest are held and reported.
        values:
          target_names: >-
            {{ {'cur': fromJson(outputs.cursor_merge.values.merged), 'cutoff': outputs.freeze.values.cutoff_iso} | jq('.cutoff as $cut | [.cur | to_entries[] | select(.value.first_seen <= $cut) | .key] | sort') | first | toJson }}
          held_names: >-
            {{ {'cur': fromJson(outputs.cursor_merge.values.merged), 'cutoff': outputs.freeze.values.cutoff_iso} | jq('.cutoff as $cut | [.cur | to_entries[] | select(.value.first_seen > $cut) | .key] | sort') | first | toJson }}
          detail: >-
            {{ {'cur': fromJson(outputs.cursor_merge.values.merged)} | jq('[.cur | to_entries[] | .value.name + " (" + .value.reason + ", silent since " + .value.first_seen + ")"] | sort | join(" | ")') | first }}

      - id: log_findings
        type: io.kestra.plugin.core.log.Log
        message: >-
          Paused connector scan on the Connect worker: {{ fromJson(outputs.analyze.values.result).total }} connectors, {{ fromJson(outputs.analyze.values.result).healthy }} running with every task running, {{ fromJson(outputs.analyze.values.result).failed }} failed (left to a restart monitor). {{ fromJson(outputs.analyze.values.result).candidates | length }} silent without being on the allowlist: {{ outputs.split.values.detail }}. {{ fromJson(outputs.split.values.target_names) | length }} past the {{ inputs.min_paused_minutes }} minute grace window ({{ outputs.split.values.target_names | jq('join(", ")') | first }}). {{ fromJson(outputs.split.values.held_names) | length }} held as too recent ({{ outputs.split.values.held_names | jq('join(", ")') | first }}). {{ fromJson(outputs.analyze.values.result).allowlisted | length }} expected paused, never resumed ({{ outputs.analyze.values.result | jq('.allowlisted | join(", ")') | first }}). Inventory: {{ fromJson(outputs.analyze.values.result).inventory }}. auto_remediate={{ inputs.auto_remediate }} dry_run={{ inputs.dry_run }}.

      - id: alert
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: >-
          {{ {'text': 'Kafka Connect: ' ~ (fromJson(outputs.analyze.values.result).candidates | length) ~ ' connector(s) paused or stopped while nothing is failing, so no FAILED check will see them. ' ~ (fromJson(outputs.split.values.target_names) | length) ~ ' past the ' ~ inputs.min_paused_minutes ~ ' minute grace window (' ~ (outputs.split.values.target_names | jq('join(", ")') | first) ~ '). Detail: ' ~ outputs.split.values.detail ~ '. auto_remediate=' ~ inputs.auto_remediate ~ ' dry_run=' ~ inputs.dry_run ~ '.'} | toJson }}

      - id: remediate_gate
        type: io.kestra.plugin.core.flow.If
        condition: "{{ inputs.auto_remediate and not inputs.dry_run and (fromJson(outputs.split.values.target_names) | length > 0) }}"
        then:
          - id: approve
            type: io.kestra.plugin.core.flow.Pause
            description: >-
              Resuming a connector restarts data movement. If somebody paused it on purpose for
              a migration, a backfill or a decommission, resuming it writes records they stopped
              on purpose. Read the target list in log_findings, check that none of those names
              belongs on the expected_paused list, then resume with approved=true. Resume with
              no answer or kill the execution to cancel.
            onResume:
              - id: approved
                type: BOOL
                displayName: Approve resuming the listed connectors
                required: false

          - id: do_resume
            type: io.kestra.plugin.core.flow.If
            condition: "{{ outputs.approve.onResume.approved ?? false }}"
            then:
              - id: remediate_resume
                type: io.kestra.plugin.core.flow.Loop
                description: >-
                  One connector per iteration and one iteration at a time. The worker rebalances
                  task assignments on every resume, so parallel resumes queue behind each other
                  anyway and a refusal stays attributable to a single connector.
                values: "{{ outputs.split.values.target_names }}"
                concurrencyLimit: 1
                tasks:
                  - id: resume_one
                    type: io.kestra.plugin.kafka.ConnectorResume
                    description: allowFailure keeps the re-read as the authority on what actually resumed.
                    allowFailure: true
                    connectUrl: "{{ inputs.connect_url }}"
                    connectorName: "{{ item.value }}"

              - id: settle
                type: io.kestra.plugin.core.flow.Sleep
                description: The worker accepts a resume, then reassigns tasks. Give it that long before reading back.
                duration: "{{ inputs.verify_delay }}"

              - id: reverify
                type: io.kestra.plugin.kafka.ConnectorList
                description: Read-only re-read of the Connect REST API after the resume. This is the gate.
                connectUrl: "{{ inputs.connect_url }}"
                expandStatus: true

              - id: verify_eval
                type: io.kestra.plugin.core.output.OutputValues
                description: >-
                  A resume counts only when the connector reads RUNNING and every one of its
                  tasks reads RUNNING. A connector that came back with no tasks, with a paused
                  task left behind or that is missing from the list is a failure.
                values:
                  result: >-
                    {{ {'now': (outputs.reverify.connectors ?? []), 'targets': fromJson(outputs.split.values.target_names)} | jq('.targets as $t | [.now[] | select(((([.connectorName] - $t)) | length) == 0) | {name: .connectorName, state: (.connectorState // "UNKNOWN"), tasks: ((.tasks // []) | length), running_tasks: ((.tasks // []) | map(select(.state == "RUNNING")) | length)}] as $after | ([$after[] | .name + " state=" + .state + " running_tasks=" + (.running_tasks | tostring) + "/" + (.tasks | tostring)] | sort) as $report | ([$after[] | select(.state != "RUNNING" or .tasks == 0 or .running_tasks != .tasks) | .name + " state=" + .state + " running_tasks=" + (.running_tasks | tostring) + "/" + (.tasks | tostring)] | sort) as $bad | ([$after[] | .name]) as $seen | ([$t[] | select(((([.]) - $seen) | length) > 0) | . + " is no longer on the worker"] | sort) as $gone | {after: ($report | join("; ")), failures: (($bad + $gone) | join("; ")), failure_count: (($bad | length) + ($gone | length))}') | first | toJson }}

              - id: verify_result
                type: io.kestra.plugin.core.flow.If
                condition: "{{ fromJson(outputs.verify_eval.values.result).failure_count > 0 }}"
                then:
                  - id: resume_failed
                    type: io.kestra.plugin.core.execution.Fail
                    errorMessage: >-
                      ConnectorResume ran, but a re-read of the Connect REST API shows a target that is not running. Still wrong: {{ fromJson(outputs.verify_eval.values.result).failures }}. Full read back: {{ fromJson(outputs.verify_eval.values.result).after }}. Either the worker refused the resume, the connector resumed into a failure (a bad config, a source that is gone, credentials that expired while it sat paused). Another possibility is that somebody deleted it while the execution was waiting for approval.
                else:
                  - id: prune_cursor
                    type: io.kestra.plugin.core.kv.Set
                    description: >-
                      Drop the resumed connectors from the first-seen record, so one paused again
                      later starts a fresh grace window instead of inheriting the old date.
                    key: "{{ render(vars.kv_key) }}"
                    kvType: JSON
                    value: >-
                      {{ {'cur': fromJson(outputs.cursor_merge.values.merged), 'done': fromJson(outputs.split.values.target_names)} | jq('.done as $d | (.cur | with_entries(select(((([.key] - $d)) | length) > 0)))') | first | toJson }}

                  - id: resumed_ok
                    type: io.kestra.plugin.core.log.Log
                    message: >-
                      Resumed {{ fromJson(outputs.split.values.target_names) | length }} connector(s) ({{ outputs.split.values.target_names | jq('join(", ")') | first }}). A re-read of the Connect REST API confirms each one is RUNNING with every task RUNNING: {{ fromJson(outputs.verify_eval.values.result).after }}.
            else:
              - id: not_approved
                type: io.kestra.plugin.core.log.Log
                message: "Pause resumed without approval or killed. No connector was resumed."
        else:
          - id: report_only
            type: io.kestra.plugin.core.log.Log
            message: >-
              Report only, nothing resumed. {{ fromJson(outputs.split.values.target_names) | length }} connector(s) would be resumed with auto_remediate=true and dry_run=false: {{ outputs.split.values.target_names | jq('join(", ")') | first }}. Current inputs are auto_remediate={{ inputs.auto_remediate }} dry_run={{ inputs.dry_run }}.
    else:
      - id: clear_cursor
        type: io.kestra.plugin.core.kv.Set
        description: Nothing silent off the allowlist, so reset the first-seen record.
        key: "{{ render(vars.kv_key) }}"
        kvType: JSON
        value: "{}"

      - id: all_moving
        type: io.kestra.plugin.core.log.Log
        message: >-
          No unexpected pause on the Connect worker. {{ fromJson(outputs.analyze.values.result).total }} connectors checked, {{ fromJson(outputs.analyze.values.result).healthy }} running with every task running, {{ fromJson(outputs.analyze.values.result).failed }} failed (left to a restart monitor), {{ fromJson(outputs.analyze.values.result).allowlisted | length }} paused on purpose and on the allowlist ({{ outputs.analyze.values.result | jq('.allowlisted | join(", ")') | first }}). Inventory: {{ fromJson(outputs.analyze.values.result).inventory }}.

errors:
  - id: alert_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: >-
      {{ {'text': 'Kafka Connect paused connector resume guard failed (execution ' ~ execution.id ~ '). No connector was resumed unless a log line says resumed. Check the logs.'} | toJson }}

triggers:
  - id: hourly_scan
    type: io.kestra.plugin.core.trigger.Schedule
    description: Shipped disabled and always in safe mode.
    cron: "17 * * * *"
    disabled: true
    inputs:
      auto_remediate: false
      dry_run: true

extend:
  title: Kafka Connect Paused Connector Resume Guard
  shortDescription: Find Kafka Connect connectors paused or stopped into silence, resume them behind an approval gate, then re-read the Connect REST API and fail if any target is not running.
  metaTitle: Kafka Connect Paused Connector Resume Guard with Kestra
  metaDescription: Detect Kafka Connect connectors stuck PAUSED or STOPPED, resume them with ConnectorResume behind an approval gate, then re-read and fail if one is not RUNNING.
  ee: false
  demo: false
  tags:
    - Infrastructure
    - Data
  subTags:
    - Realtime & Streaming
    - Day 2 Operations
    - Monitoring & Alerting
  description: |
    A paused Kafka Connect connector is not a failed one, which is exactly what makes it dangerous. Every self-healing monitor people write looks for FAILED connectors or FAILED tasks and restarts them. A PAUSED connector sails straight past all of them while moving zero records. The sink stops writing. The source stops reading. Nothing errors, so nothing alerts, so the pipeline looks healthy right up to the point somebody asks why yesterday is missing from the warehouse.

    They get left behind for ordinary reasons. A release runbook pauses the sinks before a schema change and the step that resumes them is the step that gets skipped when the release runs late. A `STOPPED` connector from a planned cutover never gets started again. An operator pauses one connector to debug it on a Friday. A worker rolling restart leaves a connector reading `RUNNING` while its tasks are still `PAUSED`, which no connector-level check catches at all.

    This blueprint finds them and puts them back, with the brake that the problem demands. Some connectors are paused on purpose, so resuming one of those restarts data movement a human deliberately stopped. That is why the allowlist is the safety model here rather than a convenience: a name on `expected_paused` is reported on every run but can never reach the resume step. On top of that, a connector has to have been silent for a whole grace window, measured from the first run that saw it, so a connector paused thirty seconds ago by a maintenance job that is still running is left alone. Resuming still needs `auto_remediate` true, `dry_run` false and a human resuming a paused execution. Afterwards it re-reads the Connect REST API and fails the run if a target is not RUNNING with every task RUNNING.

    This blueprint was created by [zkasuran](https://github.com/zkasuran).

    ## Safety

    - Read-only by default. With the shipped inputs it lists, reports and alerts. It changes nothing.
    - A resume needs three things at once: `auto_remediate` true, `dry_run` false and a human resuming the `Pause` with `approved=true`. An unanswered resume reads as not approved.
    - A connector named in `expected_paused` is never a target. It is split out before the age check, so no combination of inputs can route it into the resume loop.
    - A connector has to hold its silent state for the whole `min_paused_minutes` window before it is eligible. The window is measured from the first run that saw that exact state, so a connector that moved from PAUSED to STOPPED starts again.
    - The KV first-seen record carries no ttl, so the window cannot quietly expire and hand a freshly paused connector an old date. After a confirmed resume the names are pruned, so one paused again later gets its own window.
    - FAILED connectors are counted in the report but never touched. Restarting a failed connector is a different operation with different risks, so it belongs to a different flow.
    - The re-read after the resume is the real gate. A connector that stayed paused, came back with no tasks, came back with a paused task or vanished from the worker fails the run and alerts instead of reporting success.
    - The resume loop runs one connector at a time, so a worker that refuses one resume does not take the rest of the batch with it.

    ## How it works

    1. `freeze` captures one timestamp for the run, so the detect, the cursor and the age check all agree on now.
    2. `list_connectors` (`io.kestra.plugin.kafka.ConnectorList` with `expandStatus: true`, read-only) returns every connector on the worker with its connector state and the state of each of its tasks.
    3. `analyze` marks a connector silent when its own state is `PAUSED` or `STOPPED`, as well as when it reads something else while one of its tasks is `PAUSED`. It records a reason per connector and splits the allowlisted names out immediately.
    4. `route` (`io.kestra.plugin.core.flow.If`) branches. With nothing silent off the allowlist it clears the cursor and logs the inventory it checked.
    5. `cursor_merge` keeps the first time each candidate was seen in its current state, carrying the old date forward only when the state signature matches. `save_cursor` (`io.kestra.plugin.core.kv.Set`) stores it with no ttl.
    6. `split` divides candidates into targets past `min_paused_minutes` and held ones that are still too recent.
    7. `log_findings` writes the whole picture to the execution log. `alert` posts the same thing to Slack, because a connector that is silent without being failed is worth knowing about whether or not this run is allowed to fix it.
    8. `remediate_gate` runs only when `auto_remediate` is true, `dry_run` is false and there is at least one target. Otherwise `report_only` logs what would have been resumed.
    9. `approve` (`io.kestra.plugin.core.flow.Pause`) holds the execution for a human. `do_resume` reads `onResume.approved ?? false`, so an unanswered resume does not count as approval.
    10. `remediate_resume` (`io.kestra.plugin.core.flow.Loop`, `concurrencyLimit: 1`) calls `io.kestra.plugin.kafka.ConnectorResume` once per target.
    11. `settle` waits `verify_delay`, then `reverify` re-reads the Connect REST API and `verify_eval` checks every target for `RUNNING` with every task `RUNNING`.
    12. `verify_result` fails the run through `io.kestra.plugin.core.execution.Fail` when any target is still wrong, listing exactly which. On a clean read back it prunes those names from the cursor and logs the result.

    ## What you get

    - A detector for the one broken state that FAILED-based monitoring cannot see.
    - Task-level reading, so a connector that reads RUNNING over paused tasks is caught too.
    - An allowlist that a deliberately paused connector can sit on safely.
    - An age window held in Kestra KV, so a pause that is part of a running maintenance job is never yanked back.
    - A resume that is read-only by default, gated on two inputs and a human approval.
    - A re-read of the Connect REST API that fails the run if the resume did not land, with the state and task counts of every target in the failure message.
    - A Slack alert on detection plus an `errors:` alert on failure.

    ## Who it's for

    Platform teams running Kafka Connect in production. If your release runbook has a step that pauses connectors before a schema change, somebody has already shipped a day where the resume step got skipped. Data engineers who have debugged a silent pipeline where every health check was green will recognise the state this looks for.

    ## Why orchestrate this with Kestra

    The detect, decide, fix, re-verify loop needs state that outlives one run, a human in the middle of it and a hard stop when the fix does not work. Kestra KV holds the first-seen dates so the age window survives restarts. `Pause` puts a person in front of the one irreversible-feeling action without anybody watching a terminal. `If` keeps the write behind two inputs. `Fail` turns a failed re-verify into a failed execution with an alert rather than a log line nobody reads. A shell script doing the same thing would need its own state store, its own approval channel and its own alerting.

    ## Tested end to end

    Run on Kestra 2.0.5 against Kafka 3.9.1 in KRaft mode with a Kafka Connect 7.9.0 worker, using the bundled `FileStreamSource` connector so the rig needs no external system.

    - Healthy worker, every connector running: the detector reported zero candidates and took the clean branch.
    - One connector paused through `PUT /connectors/{name}/pause`: detected with reason `connector PAUSED`, with the running connector beside it untouched.
    - `dry_run=true`: the target was listed with the resume it would have made. A `GET /connectors/{name}/status` straight after still read `PAUSED`.
    - `auto_remediate=true, dry_run=false`, approved: `ConnectorResume` ran, the re-read returned `RUNNING` with every task `RUNNING`. The source file offset started advancing again after sitting frozen through the pause.
    - Pause resumed without approval: nothing was resumed and the connector was still `PAUSED` afterwards.
    - A paused connector on `expected_paused`: reported as expected paused, never a target, still `PAUSED` at the end of the run.
    - A connector paused inside the age window: held as too recent, never a target.
    - A connector whose config points at a source that no longer exists: resumed, came back not running, so the run FAILED on the re-read rather than reporting success.
    - Connect REST endpoint unreachable: the task failed and the `errors:` block posted to Slack.

    ## Prerequisites

    A Kafka Connect worker whose REST API this Kestra instance can reach, plus a Slack incoming webhook.

    ### Secrets

    - `KAFKA_CONNECT_URL`: base URL of the Connect worker REST API, for example `http://connect:8083`.
    - `SLACK_WEBHOOK_URL`: Slack incoming webhook for the findings alert plus the failure alert.

    If your Connect worker sits behind basic auth, add `username` and `password` to each Kafka task from secrets of your own.

    ### Inputs

    - `connect_url`: Connect REST endpoint. Defaults to the secret above.
    - `expected_paused`: connector names allowed to stay paused. Never resumed.
    - `min_paused_minutes`: minutes a connector must stay silent before it is eligible. Defaults to 30.
    - `verify_delay`: wait before the re-read. Defaults to `PT10S`.
    - `auto_remediate`: defaults to `false`.
    - `dry_run`: defaults to `true`.

    ## Quick start

    1. Add the two secrets.
    2. Run it as shipped. It reports what is silent on the worker without changing anything.
    3. Put any connector that is paused on purpose on `expected_paused` and run it again. Those names move to the expected-paused line of the report.
    4. Check the target list in the log. When it holds only connectors that should be running, run with `auto_remediate=true` and `dry_run=false`, read the pause description, then resume the execution with `approved=true`.
    5. Enable the `hourly_scan` trigger once you are happy with the report. It runs in safe mode, so it reports without changing anything until you give it different inputs.

    ## How to extend

    - Lower `min_paused_minutes` to minutes for a cluster where no legitimate pause lasts long. Raise it to days where migrations run slow.
    - Replace the allowlist with a config lookup if you already track planned maintenance somewhere, by pointing `expected_paused` at a task that reads it.
    - Add `io.kestra.plugin.kafka.ConnectorGetOffsets` before the resume to record where each connector stood, which makes it easy to show how far behind it fell.
    - Route the Slack alert to a different channel per connector prefix with a `Switch` on the target names.
    - Pair it with a FAILED-connector restart monitor. This one deliberately leaves failed connectors alone, so the two cover the whole space without overlapping.

    ## Links

    - [Kafka Connect REST API, including pause, stop and resume](https://kafka.apache.org/44/kafka-connect/user-guide/#rest-api)
