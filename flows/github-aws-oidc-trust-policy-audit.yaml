id: github-aws-oidc-trust-policy-audit
namespace: company.security
description: Inspect AWS IAM role trust policies for GitHub Actions OIDC subjects that match a selected GitHub repository.

inputs:
  - id: github_owner
    type: STRING
    defaults: kestra-io
    description: GitHub account or organization that owns the repository to audit.
  - id: github_repo
    type: STRING
    defaults: blueprints
    description: GitHub repository name to match against AWS OIDC subject conditions.
  - id: aws_region
    type: STRING
    defaults: us-east-1
    description: AWS region used to sign the IAM ListRoles request. IAM is a global service.

triggers:
  - id: weekly_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: Recheck the selected repository's trust scope weekly; run manually to audit another repository.
    cron: "0 9 * * 1"
    timezone: Etc/UTC

tasks:
  - id: validate_inputs
    type: io.kestra.plugin.scripts.python.Script
    description: Reject malformed repository path components before sending the GitHub token to the API.
    containerImage: python:3.12-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    script: |
      import re

      owner = {{ inputs.github_owner | toJson }}
      repo = {{ inputs.github_repo | toJson }}
      region = {{ inputs.aws_region | toJson }}
      if not isinstance(owner, str) or not re.fullmatch(r"[A-Za-z0-9](?:[A-Za-z0-9-]{0,37}[A-Za-z0-9])?", owner):
          raise ValueError("github_owner must be a valid GitHub account name")
      if not isinstance(repo, str) or not re.fullmatch(r"[A-Za-z0-9._-]{1,100}", repo) or repo in {".", ".."}:
          raise ValueError("github_repo must be a valid GitHub repository name")
      if not isinstance(region, str) or not re.fullmatch(r"[a-z0-9-]{3,32}", region):
          raise ValueError("aws_region must contain only lowercase letters, digits, or hyphens")
      print("Input validation passed for " + owner + "/" + repo + " in " + region)

  - id: github_repository
    type: io.kestra.plugin.core.http.Request
    description: Confirm the live GitHub repository and obtain its current owner and repository IDs for name-based and immutable subject matching.
    uri: "https://api.github.com/repos/{{ inputs.github_owner }}/{{ inputs.github_repo }}"
    method: GET
    headers:
      Authorization: "Bearer {{ secret('GITHUB_TOKEN') }}"
      Accept: application/vnd.github+json
      X-GitHub-Api-Version: "2022-11-28"
      User-Agent: kestra-github-aws-oidc-trust-audit
    retry:
      type: exponential
      interval: PT2S
      maxInterval: PT30S
      maxAttempts: 3

  - id: aws_roles
    type: io.kestra.plugin.aws.cli.AwsCLI
    description: Read IAM role trust policies. This command only lists roles and does not assume roles or change AWS resources.
    region: "{{ inputs.aws_region }}"
    outputFiles:
      - roles.json
    commands:
      - aws iam list-roles --output json > roles.json
    retry:
      type: exponential
      interval: PT2S
      maxInterval: PT30S
      maxAttempts: 3

  - id: assess_trust
    type: io.kestra.plugin.scripts.python.Script
    description: Match GitHub OIDC trust subjects against the live repository identity, classify broad or incomplete conditions, and save reviewable evidence.
    containerImage: python:3.12-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    inputFiles:
      github_repository.json: "{{ outputs.github_repository.body | toJson }}"
      aws_roles.json: "{{ outputs.aws_roles.outputFiles['roles.json'] }}"
    outputFiles:
      - oidc-trust-audit.json
      - oidc-trust-audit.md
    script: |
      import fnmatch
      import json
      from pathlib import Path
      from urllib.parse import unquote

      def read_json(path):
          with Path(path).open(encoding="utf-8") as handle:
              return json.load(handle)

      repository = read_json("github_repository.json")
      roles_document = read_json("aws_roles.json")
      if not isinstance(repository, dict) or not isinstance(roles_document, dict):
          raise ValueError("GitHub repository and AWS role responses must be JSON objects")
      if not isinstance(repository.get("full_name"), str) or not isinstance(repository.get("owner"), dict) or not isinstance(repository.get("name"), str):
          raise ValueError("GitHub response is missing repository identity fields")
      if not isinstance(repository["owner"].get("login"), str):
          raise ValueError("GitHub response is missing the owner login")
      if not isinstance(repository.get("id"), int) or not isinstance(repository["owner"].get("id"), int):
          raise ValueError("GitHub response is missing numeric repository or owner IDs")
      if not isinstance(roles_document.get("Roles"), list):
          raise ValueError("AWS ListRoles response is missing its Roles array")

      full_name = repository["full_name"]
      owner_name = repository["owner"]["login"]
      repo_name = repository["name"]
      subject_identities = [
          owner_name + "/" + repo_name,
          owner_name + "@" + str(repository["owner"]["id"]) + "/" + repo_name + "@" + str(repository["id"]),
      ]
      provider_suffix = "oidc-provider/token.actions.githubusercontent.com"

      def as_list(value):
          if value is None:
              return []
          return value if isinstance(value, list) else [value]

      def parse_trust(value):
          if isinstance(value, str):
              value = json.loads(unquote(value))
          if not isinstance(value, dict):
              raise ValueError("IAM role trust policy is not a JSON object")
          return value

      def find_conditions(statement, suffix):
          found = []
          conditions = statement.get("Condition", {})
          if not isinstance(conditions, dict):
              return found
          for operator, entries in conditions.items():
              if not isinstance(entries, dict):
                  continue
              for key, value in entries.items():
                  if isinstance(key, str) and key.lower().endswith(":" + suffix):
                      found.extend(as_list(value))
          return found

      def subject_matches_target(subject):
          if not isinstance(subject, str):
              return False, "unrecognized"
          parts = subject.split(":", 2)
          if len(parts) < 2 or parts[0] != "repo":
              return False, "unrecognized"
          identity = parts[1]
          for expected in subject_identities:
              if fnmatch.fnmatchcase(expected, identity):
                  return True, identity
          return False, identity

      findings = []
      role_summaries = []
      oidc_role_count = 0

      for role in roles_document["Roles"]:
          if not isinstance(role, dict):
              continue
          policy_value = role.get("AssumeRolePolicyDocument")
          if policy_value is None:
              continue
          policy = parse_trust(policy_value)
          statements = as_list(policy.get("Statement"))
          role_findings = []
          role_subjects = []
          for statement in statements:
              if not isinstance(statement, dict) or statement.get("Effect") != "Allow":
                  continue
              actions = [str(action).lower() for action in as_list(statement.get("Action"))]
              if not any(fnmatch.fnmatchcase("sts:assumerolewithwebidentity", action) for action in actions):
                  continue
              principal = statement.get("Principal", {})
              federated = as_list(principal.get("Federated") if isinstance(principal, dict) else None)
              subjects = find_conditions(statement, "sub")
              audiences = find_conditions(statement, "aud")
              github_provider = any(isinstance(value, str) and value.lower().endswith(provider_suffix) for value in federated)
              wildcard_provider = any(value == "*" for value in federated)
              github_subject_format = any(isinstance(value, str) and value.startswith("repo:") for value in subjects)
              if not github_provider and not (wildcard_provider and github_subject_format):
                  continue

              oidc_role_count += 1
              statement_findings = []
              target_subjects = []
              for subject in subjects:
                  matches, identity = subject_matches_target(subject)
                  if matches:
                      target_subjects.append(str(subject))
                      if str(subject) not in role_subjects:
                          role_subjects.append(str(subject))
                      if "*" in identity or "?" in identity:
                          statement_findings.append({"code": "wildcard_repository_scope", "subject": str(subject), "severity": "high", "detail": "The repository segment of the subject uses a wildcard and can match repositories beyond the selected repository."})
                      elif subject.count("*") or subject.count("?"):
                          statement_findings.append({"code": "wildcard_workflow_context", "subject": str(subject), "severity": "review", "detail": "The subject matches this repository but uses a wildcard in its branch, environment, or other context."})
                      elif len(subject.split(":")) < 4:
                          statement_findings.append({"code": "incomplete_subject_context", "subject": str(subject), "severity": "review", "detail": "The subject does not visibly constrain a ref, environment, or other context."})
                  elif identity == "unrecognized":
                      statement_findings.append({"code": "unrecognized_subject_format", "subject": str(subject), "severity": "review", "detail": "The subject format could not be matched safely; inspect it manually."})

              if not subjects:
                  statement_findings.append({"code": "missing_subject_condition", "severity": "high", "detail": "The GitHub OIDC statement has no token.actions.githubusercontent.com:sub condition."})
              if not any(audience == "sts.amazonaws.com" for audience in audiences) or any(isinstance(audience, str) and ("*" in audience or "?" in audience) for audience in audiences):
                  statement_findings.append({"code": "audience_not_scoped_to_sts", "severity": "review", "detail": "The statement does not require the exact sts.amazonaws.com audience."})
              if wildcard_provider:
                  statement_findings.append({"code": "wildcard_federated_principal", "severity": "high", "detail": "The OIDC statement uses a wildcard federated principal instead of the GitHub Actions OIDC provider ARN."})
              if target_subjects or statement_findings:
                  role_findings.extend(statement_findings)
                  role_summaries.append({
                      "role_name": role.get("RoleName", "unknown"),
                      "role_arn": role.get("Arn", "unknown"),
                      "subjects_matching_repository": target_subjects,
                      "findings": statement_findings,
                  })
                  for finding in statement_findings:
                      findings.append({
                          "role_name": role.get("RoleName", "unknown"),
                          "role_arn": role.get("Arn", "unknown"),
                          **finding,
                      })

      report = {
          "repository": {"full_name": full_name, "owner_id": repository["owner"]["id"], "repository_id": repository["id"]},
          "aws_roles_scanned": len(roles_document["Roles"]),
          "github_oidc_statements_scanned": oidc_role_count,
          "matching_or_review_roles": role_summaries,
          "findings": findings,
          "limitations": [
              "This report checks trust-policy subject and audience scope only; it does not inspect permissions attached to roles.",
              "A finding is a review signal, not proof that a role is exploitable or unintended.",
              "GitHub repository metadata does not reveal whether an organization has opted into immutable subject claims.",
              "Trust statements that do not match the selected repository and do not use a recognized format may require separate review.",
          ],
      }
      Path("oidc-trust-audit.json").write_text(json.dumps(report, indent=2) + "\n", encoding="utf-8")

      lines = [
          "# GitHub Actions to AWS OIDC trust audit",
          "",
          f"Repository: `{full_name}` (owner ID `{repository['owner']['id']}`, repository ID `{repository['id']}`)",
          f"IAM roles scanned: {len(roles_document['Roles'])}",
          f"GitHub OIDC statements scanned: {oidc_role_count}",
          f"Review findings: {len(findings)}",
          "",
          "## Findings",
          "",
      ]
      if findings:
          for item in findings:
              subject = item.get("subject", "(not present)").replace("`", "'").replace("\n", " ")
              lines.append(f"- **{item['severity'].upper()} — {item['code']}** — role `{item['role_name']}` (`{item['role_arn']}`): {item['detail']} Subject: `{subject}`")
      elif oidc_role_count == 0:
          lines.append("No GitHub OIDC trust statements were found. This is not evidence that the account has no GitHub Actions access through another identity provider.")
      else:
          lines.append("No broad subject pattern was detected for this repository in the scanned GitHub OIDC trust statements. Review any unrecognized policies manually.")
      lines.extend([
          "",
          "## Scope and limitations",
          "",
          *[f"- {item}" for item in report["limitations"]],
          "",
          "The flow is read-only. It does not call STS AssumeRoleWithWebIdentity, alter IAM policies, or dispatch GitHub workflows.",
          "",
      ])
      Path("oidc-trust-audit.md").write_text("\n".join(lines), encoding="utf-8")
      print("::" + json.dumps({"outputs": {
          "finding_count": len(findings),
          "oidc_statement_count": oidc_role_count,
          "matching_role_count": len(role_summaries),
      }}) + "::")

  - id: findings_gate
    type: io.kestra.plugin.core.flow.If
    description: Surface review findings clearly while keeping the report available in execution outputs.
    condition: "{{ outputs.assess_trust.vars.finding_count > 0 }}"
    then:
      - id: log_review_findings
        type: io.kestra.plugin.core.log.Log
        message: "Review required: {{ outputs.assess_trust.vars.finding_count }} trust-scope finding(s) for {{ inputs.github_owner }}/{{ inputs.github_repo }}. Download oidc-trust-audit.md and oidc-trust-audit.json from execution outputs."
    else:
      - id: log_no_broad_findings
        type: io.kestra.plugin.core.log.Log
        message: "No broad trust-scope findings were detected for {{ inputs.github_owner }}/{{ inputs.github_repo }}. This is not a complete IAM permission audit; review the report and any unclassified statements."

errors:
  - id: log_audit_failure
    type: io.kestra.plugin.core.log.Log
    message: "GitHub-to-AWS OIDC trust audit failed in task {{ (errorLogs() | length) > 0 ? errorLogs()[0].taskId : 'unknown' }} for execution {{ execution.id }}. {{ (errorLogs() | length) > 0 ? errorLogs()[0].message : 'Inspect execution logs.' }} Execution: {{ kestra.url ?? 'http://localhost:8080' }}/ui/main/executions/{{ flow.namespace }}/{{ flow.id }}/{{ execution.id }}"

extend:
  title: Audit AWS IAM Trust Policies for GitHub Actions OIDC
  metaTitle: GitHub Actions OIDC Trust Policy Audit for AWS IAM
  shortDescription: Review AWS IAM trust policies that accept GitHub Actions OIDC tokens for a selected repository.
  metaDescription: Audit AWS IAM trust-policy subjects and audiences for GitHub Actions OIDC access to a selected repository, with downloadable evidence.
  description: |
    Review AWS IAM trust policies that allow GitHub Actions OIDC to obtain role sessions. The flow reads live GitHub repository metadata and IAM role trust policies, then saves evidence. It never assumes roles, changes policies, or dispatches workflows.

    ## How it works
    Run manually for one repository or enable the weekly schedule. The flow fetches its GitHub identity, lists IAM roles, then checks GitHub OIDC `sub` and `aud` conditions. It recognizes legacy name-based and immutable ID-based subjects. A conditional task highlights review findings.

    ## What you get
    `assess_trust` creates downloadable `oidc-trust-audit.json` and `oidc-trust-audit.md` reports with repository IDs, role names and ARNs, matched subjects, finding codes, and limitations. Findings cover wildcard repository or workflow context, missing subject restrictions, and audiences that are not exactly scoped to `sts.amazonaws.com`. A clean scan is not a complete safety certification.

    ## Who it's for
    Platform security engineers, AWS IAM administrators, and teams deploying from GitHub Actions.

    ## Why orchestrate this with Kestra
    Kestra makes the live API reads, analysis, retries, schedule, and evidence visible in one execution. Review the same report on demand or on a recurring schedule.

    ## Prerequisites
    Install the HTTP, AWS CLI, and Python plugins. Provide GitHub metadata access and AWS credentials with only `iam:ListRoles`, through the AWS credential provider chain supported by the task.

    ### Secrets
    - `GITHUB_TOKEN`: GitHub repository metadata read access.
    - AWS credentials: provide through the AWS default credential provider chain. Keep keys out of flow inputs and YAML.

    ## Quick start
    Store `GITHUB_TOKEN` as a Kestra secret and configure AWS credentials. Run with `github_owner: kestra-io`, `github_repo: blueprints`, and `aws_region: us-east-1`, or select another repository. Review both execution outputs. The weekly trigger is enabled by default; disable it if credentials are not configured.

    ## How to extend
    Run once per repository or adapt for an approved repository list. Treat wildcard and unrecognized subjects as review signals. This audit does not inspect attached role permissions, workflow files, organization claim settings, or actual token issuance.

    ## Links
    - [GitHub REST API: Get a repository](https://docs.github.com/en/rest/repos/repos#get-a-repository)
    - [GitHub Actions OIDC reference](https://docs.github.com/en/actions/reference/security/oidc)
    - [AWS IAM ListRoles API](https://docs.aws.amazon.com/IAM/latest/APIReference/API_ListRoles.html)
    - [Kestra HTTP Request task](https://kestra.io/plugins/core/http/io.kestra.plugin.core.http.request)
    - [Kestra AWS CLI task](https://kestra.io/plugins/plugin-aws/aws-cli/io.kestra.plugin.aws.cli.awscli)
    - [Kestra Python Script task](https://kestra.io/plugins/plugin-script-python/io.kestra.plugin.scripts.python.script)
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Policy & Compliance
  ee: false
  demo: false
