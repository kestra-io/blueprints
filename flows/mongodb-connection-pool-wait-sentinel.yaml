id: mongodb-connection-pool-wait-sentinel
namespace: company.dataops

inputs:
  - id: mongo_uri
    type: STRING
    defaults: mongodb://localhost:27017/?replicaSet=rs0
    description: MongoDB connection URI with authentication credentials.
  - id: max_current_connections_threshold
    type: INT
    defaults: 500
    description: Maximum permissible active client connections before alerting.

tasks:
  - id: inspect_connection_stats
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    dependencies:
      - pymongo==4.15.3
      - kestra==2.0.0
    script: |
      from pymongo import MongoClient
      import sys
      from kestra import Kestra

      mongo_uri = "{{ inputs.mongo_uri }}"
      threshold = int("{{ inputs.max_current_connections_threshold }}")
      try:
          client = MongoClient(mongo_uri, serverSelectionTimeoutMS=5000)
          status = client.admin.command("serverStatus")
          conn = status.get("connections", {})

          current = int(conn.get("current", 0))
          available = int(conn.get("available", 0))
          total_created = int(conn.get("totalCreated", 0))
          is_saturated = current > threshold

          print(f"Connections current: {current}, available: {available}, totalCreated: {total_created}, is_saturated: {is_saturated}")

          Kestra.outputs({
              "current": current,
              "available": available,
              "total_created": total_created,
              "is_saturated": is_saturated
          })
      except Exception as e:
          print(f"Error querying MongoDB connections: {e}", file=sys.stderr)
          sys.exit(1)

  - id: evaluate_connection_pool
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.inspect_connection_stats.vars.is_saturated }}"
    then:
      - id: alert_dba_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "text": ":warning: *MongoDB Connection Pool Saturation Alert*: Current active connections reached {{ outputs.inspect_connection_stats.vars.current }} (threshold: {{ inputs.max_current_connections_threshold }}). Available connections: {{ outputs.inspect_connection_stats.vars.available }}."
          }

errors:
  - id: notify_sentinel_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "text": ":warning: *MongoDB Sentinel Execution Failure*: Failed to query serverStatus connections."
      }

triggers:
  - id: scheduled_conn_check
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/5 * * * *"
    disabled: true

outputs:
  - id: current
    type: INT
    value: "{{ outputs.inspect_connection_stats.vars.current }}"
  - id: available
    type: INT
    value: "{{ outputs.inspect_connection_stats.vars.available }}"
  - id: total_created
    type: INT
    value: "{{ outputs.inspect_connection_stats.vars.total_created }}"
  - id: is_saturated
    type: BOOLEAN
    value: "{{ outputs.inspect_connection_stats.vars.is_saturated }}"

extend:
  metaDescription: "Audits MongoDB connection pool utilization to detect connection leaks, microservice pool exhaustion, and thread saturation."
  metaTitle: MongoDB Connection Pool Wait Time and Thread Saturation Sentinel with Kestra
  title: MongoDB Connection Pool Wait Time and Thread Saturation Sentinel
  shortDescription: Audits MongoDB connection pool utilization to detect connection leaks, microservice pool exhaustion, and thread saturation.
  description: |
    ## How it works
    This sentinel runs a Python script in Docker against the MongoDB database cluster to query `db.serverStatus().connections`. It compares active client connections against available capacity, warning DBAs before connection exhaustion triggers driver timeouts.

    ## What you get
    - Proactive visibility into client connection pool leaks across microservice fleets.
    - Prevention of connection starvation and rejected database queries.
    - Automated Slack incident delivery indicating current active connections and remaining headroom.

    ## Who it's for
    - Database administrators and platform engineers managing high-concurrency MongoDB instances.
    - SREs troubleshooting connection spikes during traffic surges.

    ## Why orchestrate this with Kestra
    Kestra automates database maintenance and health verifications, running scheduled diagnostic scripts with built-in credential management and alerting.

    ## Prerequisites
    - MongoDB instance or replica set reachability with monitoring credentials.
    - Secret `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import this blueprint into Kestra.
    2. Configure `mongo_uri` with your connection string.
    3. Trigger a manual execution to check connection pool metrics.

    ## How to extend
    - Query `currentOp` to identify the client IP addresses consuming the highest connection count.
    - Monitor `network.numRequests` concurrently to correlate throughput with connections.
    - Export connection metrics to Datadog or Prometheus.

    ## Links
    - [MongoDB Server Status Connections](https://www.mongodb.com/docs/manual/reference/command/serverStatus/#mongodb-serverstatus-connections)
    - [Kestra Python Plugin](https://kestra.io/plugins/plugin-script-python)
  tags:
    - Data
    - Infrastructure
  subTags:
    - Monitoring & Alerting
  ee: false
  demo: false
