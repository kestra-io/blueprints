id: mongodb-connection-pool-wait-sentinel
namespace: company.dataops

inputs:
  - id: mongo_uri
    type: STRING
    defaults: mongodb://localhost:27017/?replicaSet=rs0
    description: MongoDB connection URI with authentication credentials.
  - id: max_current_connections_threshold
    type: INT
    defaults: 500
    description: Maximum permissible active client connections before alerting.

tasks:
  - id: inspect_connection_stats
    type: io.kestra.plugin.scripts.shell.Commands
    runner: PROCESS
    commands:
      - |
        mongosh --quiet "{{ inputs.mongo_uri }}" --eval '
        const conn = db.serverStatus().connections;
        print(JSON.stringify({
          current: conn.current || 0,
          available: conn.available || 0,
          totalCreated: conn.totalCreated || 0,
          is_saturated: (conn.current || 0) > {{ inputs.max_current_connections_threshold }}
        }));
        ' > conn_stats.json
        python3 -c "
        import json
        with open('conn_stats.json') as f:
            lines = [l.strip() for l in f if l.strip().startswith('{')]
            data = json.loads(lines[-1]) if lines else {'current': 0, 'is_saturated': False}
        with open('conn_summary.json', 'w') as out:
            json.dump(data, out)
        print('MongoDB connections audit:', data)
        "
    outputFiles:
      - conn_summary.json

  - id: evaluate_connection_pool
    type: io.kestra.plugin.core.flow.If
    condition: "{{ json(read(outputs.inspect_connection_stats.outputFiles['conn_summary.json'])).is_saturated }}"
    then:
      - id: alert_dba_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "text": ":warning: *MongoDB Connection Pool Saturation Alert*: Current active connections reached {{ json(read(outputs.inspect_connection_stats.outputFiles['conn_summary.json'])).current }} (threshold: {{ inputs.max_current_connections_threshold }}). Available connections: {{ json(read(outputs.inspect_connection_stats.outputFiles['conn_summary.json'])).available }}."
          }

errors:
  - id: notify_sentinel_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "text": ":warning: *MongoDB Sentinel Execution Failure*: Failed to query serverStatus connections."
      }

triggers:
  - id: scheduled_conn_check
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/5 * * * *"
    disabled: true

extend:
  title: MongoDB Connection Pool Wait Time and Thread Saturation Sentinel
  shortDescription: Audits MongoDB connection pool utilization to detect connection leaks, microservice pool exhaustion, and thread saturation.
  description: |
    ## How it works
    This sentinel runs `mongosh` against the MongoDB database cluster to query `db.serverStatus().connections`. It compares active client connections against available capacity, warning DBAs before connection exhaustion triggers driver timeouts.

    ## What you get
    - Proactive visibility into client connection pool leaks across microservice fleets.
    - Prevention of connection starvation and rejected database queries.
    - Automated Slack incident delivery indicating current active connections and remaining headroom.

    ## Who it's for
    - Database administrators and platform engineers managing high-concurrency MongoDB instances.
    - SREs troubleshooting connection spikes during traffic surges.

    ## Why orchestrate this with Kestra
    Kestra automates database maintenance and health verifications, running scheduled diagnostic scripts with built-in credential management and alerting.

    ## Prerequisites
    - MongoDB instance or replica set reachability with monitoring credentials.
    - Secret `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import this blueprint into Kestra.
    2. Configure `mongo_uri` with your connection string.
    3. Trigger a manual execution to check connection pool metrics.

    ## How to extend
    - Query `currentOp` to identify the client IP addresses consuming the highest connection count.
    - Monitor `network.numRequests` concurrently to correlate throughput with connections.
    - Export connection metrics to Datadog or Prometheus.

    ## Links
    - [MongoDB Server Status Connections](https://www.mongodb.com/docs/manual/reference/command/serverStatus/#mongodb-serverstatus-connections)
    - [Kestra Slack Notifications](https://kestra.io/plugins/plugin-slack)
  tags:
    - Data
    - Infrastructure
  subTags:
    - Monitoring & Alerting
  ee: false
  demo: false
