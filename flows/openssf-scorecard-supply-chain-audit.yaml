id: openssf-scorecard-supply-chain-audit
namespace: company.team
description: |
  Perform automated supply chain security audits using OpenSSF Scorecard.
  Clones a repository, runs the OpenSSF Scorecard container scanner, parses security
  risk scores across supply chain checks, evaluates threshold breaches, and uses AI
  to generate remediation guidance posted to GitHub issues and Slack.

triggers:
  - id: on_security_audit_webhook
    type: io.kestra.plugin.core.trigger.Webhook
    description: Webhook trigger fired on push or scheduled CI/CD security audit runs.
    key: "{{ secret('OPENSSF_AUDIT_WEBHOOK_KEY') }}"

inputs:
  - id: repository
    type: STRING
    defaults: your-org/your-repo
    displayName: Repository
    description: GitHub repository to audit in owner/repo format.
  - id: branch
    type: STRING
    defaults: main
    displayName: Branch
    description: Git branch to audit.
  - id: min_score_threshold
    type: FLOAT
    defaults: 7.0
    displayName: Minimum Score Threshold
    description: Minimum required OpenSSF Scorecard score (out of 10.0) before triggering security alert workflows.

tasks:
  - id: workspace
    type: io.kestra.plugin.core.flow.WorkingDirectory
    description: Shared workspace for cloning the repository and generating OpenSSF scan reports.
    tasks:
      - id: clone_repository
        type: io.kestra.plugin.git.Clone
        description: Check out the target repository for scanning.
        url: "https://github.com/{{ inputs.repository }}.git"
        username: x-access-token
        password: "{{ secret('GITHUB_TOKEN') }}"
        branch: "{{ inputs.branch }}"

      - id: run_openssf_scorecard
        type: io.kestra.plugin.scripts.shell.Commands
        description: Run official OpenSSF Scorecard CLI container to evaluate supply chain security risks.
        taskRunner:
          type: io.kestra.plugin.scripts.runner.docker.Docker
        containerImage: gcr.io/openssf/scorecard:v4.13.0
        env:
          GITHUB_AUTH_TOKEN: "{{ secret('GITHUB_TOKEN') }}"
        commands:
          - scorecard --repo=github.com/{{ inputs.repository }} --format=json --output=scorecard-report.json || true

      - id: parse_scorecard_results
        type: io.kestra.plugin.scripts.python.Script
        description: Parse OpenSSF Scorecard JSON results, compute overall risk score, and list failing security checks.
        taskRunner:
          type: io.kestra.plugin.core.runner.Process
        script: |
          import json
          import os

          report_path = "scorecard-report.json"
          overall_score = 0.0
          failing_checks = []

          if os.path.exists(report_path) and os.path.getsize(report_path) > 0:
              with open(report_path) as f:
                  data = json.load(f)
                  overall_score = data.get("score", 0.0)
                  checks = data.get("checks", [])
                  for check in checks:
                      score = check.get("score", 0)
                      if score < 7 and score != -1:
                          failing_checks.append({
                              "name": check.get("name"),
                              "score": score,
                              "reason": check.get("reason", "No reason provided")
                          })

          print(f"Overall OpenSSF Scorecard Rating: {overall_score}/10.0")
          print(f"Failing Checks Count: {len(failing_checks)}")

          print("::" + json.dumps({"outputs": {
              "overall_score": overall_score,
              "failing_checks_count": len(failing_checks),
              "failing_checks_json": json.dumps(failing_checks),
              "threshold_breached": overall_score < {{ inputs.min_score_threshold }} or len(failing_checks) > 0
          }}) + "::")

  - id: check_security_threshold
    type: io.kestra.plugin.core.flow.If
    description: Flow control check to branch based on OpenSSF Scorecard threshold breach.
    condition: "{{ outputs.parse_scorecard_results.vars.threshold_breached }}"
    then:
      - id: generate_ai_remediation
        type: io.kestra.plugin.ai.agent.AIAgent
        description: Generate automated security remediation guidance using LLM grounded in OpenSSF best practices.
        provider:
          type: io.kestra.plugin.ai.provider.GoogleGemini
          apiKey: "{{ secret('GEMINI_API_KEY') }}"
          modelName: gemini-2.5-flash
        systemMessage: |
          You are an OpenSSF Supply Chain Security expert. Given the failing OpenSSF Scorecard checks,
          provide concise, actionable step-by-step remediation advice to improve repository security posture.
        prompt: |
          Repository: {{ inputs.repository }}
          Overall OpenSSF Score: {{ outputs.parse_scorecard_results.vars.overall_score }}/10.0
          Failing Checks:
          {{ outputs.parse_scorecard_results.vars.failing_checks_json }}

      - id: create_github_security_issue
        type: io.kestra.plugin.github.issues.Create
        description: Open a security issue on GitHub detailing OpenSSF Scorecard findings and AI remediation steps.
        jwtToken: "{{ secret('GITHUB_TOKEN') }}"
        repository: "{{ inputs.repository }}"
        title: "🛡️ OpenSSF Security Scorecard Audit Alert (Score: {{ outputs.parse_scorecard_results.vars.overall_score }}/10)"
        body: |
          ## OpenSSF Supply Chain Security Audit Report

          **Overall Security Rating:** `{{ outputs.parse_scorecard_results.vars.overall_score }}/10.0`
          **Target Branch:** `{{ inputs.branch }}`

          ### Failing OpenSSF Security Checks
          `{{ outputs.parse_scorecard_results.vars.failing_checks_json }}`

          ### AI Remediation Plan
          {{ outputs.generate_ai_remediation.textOutput }}

          ---
          *Automated by Kestra execution `{{ execution.id }}`*
        labels:
          - security
          - openssf
          - supply-chain

      - id: notify_slack_security_channel
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Alert security team channel on Slack regarding OpenSSF threshold breach.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "⚠️ *OpenSSF Security Scorecard Alert*\nRepository: `{{ inputs.repository }}`\nScore: *{{ outputs.parse_scorecard_results.vars.overall_score }}/10.0* (Threshold: {{ inputs.min_score_threshold }})\nFailing Checks: {{ outputs.parse_scorecard_results.vars.failing_checks_count }}\nGitHub Issue opened with AI remediation plan."
          }

    else:
      - id: log_clean_audit
        type: io.kestra.plugin.core.log.Log
        message: "OpenSSF Security Audit PASSED for {{ inputs.repository }}. Score: {{ outputs.parse_scorecard_results.vars.overall_score }}/10.0."

extend:
  title: OpenSSF Security Scorecard Audit and AI Remediation
  shortDescription: Run OpenSSF Scorecard supply chain security checks on a repository, evaluate risk score thresholds, and generate AI remediation plans for Slack and GitHub.
  metaTitle: OpenSSF Security Scorecard Audit with AI Remediation in Kestra
  metaDescription: Automate supply chain security audits with OpenSSF Scorecard, evaluate risk scores, generate AI remediation advice with Gemini, and alert via GitHub & Slack.
  description: |
    Secure open-source software supply chains by automatically auditing code repositories against OpenSSF (Open Source Security Foundation) Scorecard standards. This blueprint clones a target repository, runs the official OpenSSF Scorecard CLI container to evaluate supply chain security practices (such as branch protection, dependency updates, binary artifacts, and SAST checks), parses the score report, and uses AI to generate step-by-step remediation plans when security thresholds are breached.

    ## How it works

    1. **`on_security_audit_webhook`** (`io.kestra.plugin.core.trigger.Webhook`): Accepts inbound webhook calls from CI/CD systems or GitHub webhooks to trigger an audit on demand or on push.
    2. **`workspace`** (`io.kestra.plugin.core.flow.WorkingDirectory`): Prepares a shared execution environment for cloning and container execution.
    3. **`clone_repository`** (`io.kestra.plugin.git.Clone`): Clones the specified repository and branch using `GITHUB_TOKEN`.
    4. **`run_openssf_scorecard`** (`io.kestra.plugin.scripts.shell.Commands` via `io.kestra.plugin.scripts.runner.docker.Docker`): Executes the `gcr.io/openssf/scorecard:v4.13.0` scanner container against the repository, writing detailed findings to `scorecard-report.json`.
    5. **`parse_scorecard_results`** (`io.kestra.plugin.scripts.python.Script`): Analyzes the JSON output, extracts overall risk ratings and failing checks, and outputs summary metadata.
    6. **`check_security_threshold`** (`io.kestra.plugin.core.flow.If`): Evaluates whether the overall score fell below `min_score_threshold` (e.g. 7.0) or if critical checks failed.
    7. **`generate_ai_remediation`** (`io.kestra.plugin.ai.agent.AIAgent`): Grounded in OpenSSF best practices, Google Gemini generates step-by-step instructions to fix the failing checks.
    8. **`create_github_security_issue`** (`io.kestra.plugin.github.issues.Create`) & **`notify_slack_security_channel`** (`io.kestra.plugin.slack.notifications.SlackIncomingWebhook`): File an issue with the remediation plan and notify the security team.

    ## What you get

    - Automated supply chain security auditing adhering to Linux Foundation / OpenSSF standards.
    - Containerized, hermetic scan execution with zero local tooling setup required.
    - AI-generated remediation guidance specifically tailored to your failing OpenSSF checks.
    - Multi-channel notification pipeline (GitHub Issues & Slack webhooks).

    ## Who it's for

    - DevSecOps and Platform Engineering teams standardizing repository security standards.
    - Open source maintainers ensuring compliance with OpenSSF security scorecards.
    - Security operations teams needing automated triage and remediation advice for code risk.

    ## Why orchestrate this with Kestra

    Bare scanner CLI tools generate complex JSON outputs but lack workflow orchestration, state management, and multi-channel alerting logic. Kestra bridges this gap by containerizing the OpenSSF scanner, orchestrating threshold checks with conditional logic (`If`), generating AI-driven remediation guidance (`AIAgent`), and posting findings directly into operational channels like GitHub and Slack.

    ## Prerequisites

    - A Docker-enabled Kestra worker node to execute the OpenSSF Scorecard container.
    - A GitHub Personal Access Token (`GITHUB_TOKEN`) with `repo` read/write access.
    - A Google Gemini API key (`GEMINI_API_KEY`) for AI remediation generation.
    - A Slack Incoming Webhook URL (`SLACK_WEBHOOK_URL`).

    ### Secrets

    - `GITHUB_TOKEN`: GitHub access token for repository access and issue creation.
    - `GEMINI_API_KEY`: API key for Google Gemini AI agent.
    - `SLACK_WEBHOOK_URL`: Slack channel incoming webhook.
    - `OPENSSF_AUDIT_WEBHOOK_KEY`: Secret key guarding the flow execution webhook.

    ## Quick start

    1. Add required secrets to your Kestra namespace settings.
    2. Import this blueprint into your Kestra instance.
    3. Execute the flow manually with your `repository` input or configure your GitHub repository webhook.

    ## Links

    - [OpenSSF Scorecard Documentation](https://github.com/ossf/scorecard)
    - [Kestra AI Plugin](https://kestra.io/plugins/plugin-ai)
    - [Kestra GitHub Plugin](https://kestra.io/plugins/plugin-github)
  tags:
    - Infrastructure
  subTags:
    - Policy & Compliance
    - CI/CD & Deployment
  ee: false
  demo: false
