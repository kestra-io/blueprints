id: ai-arxiv-daily-digest
namespace: company.team
description: Daily Slack digest of the most relevant new AI papers on arXiv

inputs:
  - id: categories
    type: ARRAY
    itemType: STRING
    displayName: arXiv categories
    description: arXiv categories to scan each morning (e.g. cs.AI, cs.LG, cs.CL)
    defaults:
      - cs.AI
      - cs.LG
      - cs.CL

  - id: keywords
    type: ARRAY
    itemType: STRING
    displayName: Ranking keywords
    description: Keywords used to score each paper's relevance; title matches count triple
    defaults:
      - llm
      - agent
      - rag
      - transformer
      - reasoning
      - diffusion
      - alignment
      - benchmark
      - multimodal
      - fine-tune

  - id: max_results
    type: INT
    displayName: Papers to scan
    description: How many of the newest submissions to pull from the arXiv API per run
    defaults: 50

  - id: top_n
    type: INT
    displayName: Digest size
    description: How many top-ranked papers appear in the Slack digest
    defaults: 10

triggers:
  - id: daily_morning
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 8 * * *"
    description: Run every morning at 08:00 UTC

tasks:
  - id: fetch_papers
    type: io.kestra.plugin.scripts.python.Script
    description: Pull the newest submissions from the arXiv API (Atom XML, no key needed)
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    env:
      MAX_RESULTS: "{{ inputs.max_results }}"
    inputFiles:
      categories.json: "{{ inputs.categories | toJson }}"
    outputFiles:
      - papers.json
    script: |
      import json, os, urllib.request, urllib.parse, xml.etree.ElementTree as ET

      categories = json.load(open('categories.json'))
      max_results = int(os.environ['MAX_RESULTS'])

      query = ' OR '.join(f'cat:{c}' for c in categories)
      params = urllib.parse.urlencode({
          'search_query': query,
          'start': 0,
          'max_results': max_results,
          'sortBy': 'submittedDate',
          'sortOrder': 'descending',
      })
      req = urllib.request.Request(
          'https://export.arxiv.org/api/query?' + params,
          headers={'User-Agent': 'kestra-arxiv-digest/1.0'},
      )
      with urllib.request.urlopen(req, timeout=60) as resp:
          data = resp.read()

      ns = {'a': 'http://www.w3.org/2005/Atom'}
      papers = []
      for entry in ET.fromstring(data).findall('a:entry', ns):
          papers.append({
              'id': entry.find('a:id', ns).text.strip(),
              'title': ' '.join(entry.find('a:title', ns).text.split()),
              'authors': [a.find('a:name', ns).text for a in entry.findall('a:author', ns)],
              'abstract': ' '.join(entry.find('a:summary', ns).text.split()),
              'categories': [c.get('term') for c in entry.findall('a:category', ns)],
              'published': entry.find('a:published', ns).text,
          })

      with open('papers.json', 'w') as f:
          json.dump(papers, f)
      print(f'Fetched {len(papers)} papers from arXiv')

  - id: process
    type: io.kestra.plugin.core.flow.Parallel
    description: Score papers and compute stats concurrently
    tasks:
      - id: rank_relevance
        type: io.kestra.plugin.scripts.python.Script
        description: Score each paper by keyword hits and keep the top N
        taskRunner:
          type: io.kestra.plugin.scripts.runner.docker.Docker
        env:
          TOP_N: "{{ inputs.top_n }}"
        inputFiles:
          papers.json: "{{ outputs.fetch_papers.outputFiles['papers.json'] }}"
          keywords.json: "{{ inputs.keywords | toJson }}"
        outputFiles:
          - ranked.json
        script: |
          import json, os, re

          papers = json.load(open('papers.json'))
          keywords = [k.lower() for k in json.load(open('keywords.json'))]
          top_n = int(os.environ['TOP_N'])

          def score(p):
              title, abstract = p['title'].lower(), p['abstract'].lower()
              s = 0
              for kw in keywords:
                  pattern = r'\b' + re.escape(kw) + r's?\b'
                  s += 3 * len(re.findall(pattern, title))
                  s += 1 * len(re.findall(pattern, abstract))
              return s

          ranked = sorted(papers, key=score, reverse=True)[:top_n]
          for p in ranked:
              p['score'] = score(p)
          with open('ranked.json', 'w') as f:
              json.dump(ranked, f, indent=2)
          print(f'Ranked top {len(ranked)} papers')

      - id: compute_stats
        type: io.kestra.plugin.scripts.python.Script
        description: Aggregate per-category counts for the digest header
        taskRunner:
          type: io.kestra.plugin.scripts.runner.docker.Docker
        dependencies:
          - kestra
        inputFiles:
          papers.json: "{{ outputs.fetch_papers.outputFiles['papers.json'] }}"
        script: |
          import json
          from collections import Counter
          from kestra import Kestra

          papers = json.load(open('papers.json'))
          cats = Counter(c for p in papers for c in p['categories'])
          Kestra.outputs({
              'total': len(papers),
              'top_categories': dict(cats.most_common(5)),
          })

  - id: format_digest
    type: io.kestra.plugin.scripts.python.Script
    description: Render the ranked papers as a Slack mrkdwn digest
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    dependencies:
      - kestra
    inputFiles:
      ranked.json: "{{ outputs.rank_relevance.outputFiles['ranked.json'] }}"
    script: |
      import json
      from kestra import Kestra

      ranked = json.load(open('ranked.json'))
      lines = []
      for i, p in enumerate(ranked, 1):
          authors = ', '.join(p['authors'][:3])
          if len(p['authors']) > 3:
              authors += ' et al.'
          lines.append(f'*{i}. {p["title"]}*')
          lines.append(f'_{authors}_ · {", ".join(p["categories"])} · relevance {p["score"]}')
          lines.append(f'<{p["id"]}|Read on arXiv>')
          lines.append(f'>{p["abstract"][:280]}…')
          lines.append('')
      Kestra.outputs({'digest': '\n'.join(lines).strip()})

  - id: send_slack
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Post the morning digest to Slack
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    messageText: |
      :newspaper: *Daily arXiv AI Digest* — top {{ inputs.top_n }} of {{ outputs.compute_stats.values.total }} new papers
      {{ outputs.format_digest.values.digest }}

extend:
  title: Daily arXiv AI digest with keyword ranking
  shortDescription: Scan new arXiv AI papers every morning, rank them by your keywords in parallel, and post a digest to Slack.
  metaTitle: Daily arXiv AI Paper Digest with Kestra
  metaDescription: Schedule a Kestra flow that fetches new arXiv papers, ranks them by keyword relevance with Python, and posts a morning digest to Slack.
  description: |
    Wake up to the papers that matter. This blueprint queries the arXiv API for the newest submissions in your categories every morning, scores each paper against your keyword list with a containerized Python script, computes category stats in parallel, and posts a ranked digest to Slack — no LLM API key required.

    ## How it works

    1. `fetch_papers` (`io.kestra.plugin.scripts.python.Script`) calls the public arXiv API (Atom XML, no key) for the newest submissions in your categories and stores them as `papers.json` in Kestra internal storage.
    2. `process` (`io.kestra.plugin.core.flow.Parallel`) runs two branches concurrently:
       - `rank_relevance` scores every paper — keyword hits in the title count triple versus the abstract — and keeps the top N in `ranked.json`.
       - `compute_stats` aggregates per-category counts and exposes them as tracked outputs.
    3. `format_digest` renders the ranked papers as Slack mrkdwn with title, authors, categories, relevance score, and an arXiv link per paper.
    4. `send_slack` (`io.kestra.plugin.slack.notifications.SlackIncomingWebhook`) posts the digest to your channel.

    ## What you get

    - A hands-free morning briefing on new AI papers, tuned by your own keywords
    - Deterministic, explainable ranking — no LLM API key or per-run inference cost
    - Tracked outputs (`total`, `top_categories`) you can chart over time
    - Full execution lineage: logs, metrics, and artifacts for every run

    ## Who it's for

    - Researchers and engineers who track arXiv but drown in volume
    - ML teams that want a shared daily briefing in Slack
    - Anyone learning Kestra: triggers, parallel flows, Python scripts, and notifications in one blueprint

    ## Why orchestrate this with Kestra

    A cron job plus a script can fetch papers, but it cannot fan out scoring and stats in parallel, retry transient arXiv API hiccups, keep every artifact with lineage, or let you retune keywords from the UI without redeploying. Kestra gives you all of that declaratively, and the schedule trigger means it just runs.

    ## Prerequisites

    - Docker available to the Kestra worker for the Python task runners
    - A Slack incoming webhook URL

    ### Secrets

    - `SLACK_WEBHOOK_URL`: your Slack incoming webhook URL used to post the digest

    ## Quick start

    1. Add the `SLACK_WEBHOOK_URL` secret to your Kestra instance.
    2. Tune `categories`, `keywords`, and `top_n` inputs to your interests.
    3. Save the flow under your namespace — the daily 08:00 UTC trigger is already attached.
    4. Run it once manually and check your Slack channel.

    ## How to extend

    - Add a `KV` get/set pair to skip papers you have already seen on previous runs.
    - Swap keyword scoring for an LLM judge (`io.kestra.plugin.ai`) when you want semantic relevance.
    - Fan out per-category with `io.kestra.plugin.core.flow.ForEach` instead of one query.
    - Post to Discord or email with the matching notification plugin instead of Slack.
    - Persist `ranked.json` to S3/GCS for a searchable archive of every digest.

    ## Links

    - [arXiv API user manual](https://info.arxiv.org/help/api/user-manual.html)
    - [Python script tasks in Kestra](https://kestra.io/plugins/plugin-scripts-python)
    - [Slack plugin documentation](https://kestra.io/plugins/plugin-slack)
  tags:
    - AI
  subTags:
    - Reporting & Digests
    - Scheduling
  ee: false
  demo: false
