id: proxmox-sandbox-cleanup
namespace: company.team
description: |
  Delete Proxmox VE sandboxes whose run was killed or failed, and sweep every
  sandbox past its expiry, so no container outlives the run that created it.

tasks:
  - id: find_sandboxes
    type: io.kestra.plugin.scripts.python.Script
    env:
      PVE_URL: "https://{{ secret('PROXMOX_HOST') }}:8006/api2/json/nodes/{{ secret('PROXMOX_NODE') }}/lxc"
      PVE_TOKEN: "{{ secret('PROXMOX_TOKEN_ID') }}={{ secret('PROXMOX_TOKEN_SECRET') }}"
    script: |
      import json, os, re, ssl, time, urllib.request

      ctx = ssl._create_unverified_context()
      ended_run = "{{ trigger.executionId ?? '' }}"

      def get(path):
          req = urllib.request.Request(os.environ["PVE_URL"] + path, headers={"Authorization": "PVEAPIToken=" + os.environ["PVE_TOKEN"]})
          return json.load(urllib.request.urlopen(req, context=ctx))["data"]

      targets = []
      for ct in get(""):
          if "sandbox" not in (ct.get("tags") or "").split(";"):
              continue
          description = get(f"/{ct['vmid']}/config").get("description", "")
          run = re.search(r"execution (\w+)", description)
          expires = re.search(r"expires (\d+)", description)
          if ended_run and run and run.group(1) == ended_run:
              reason = "run ended early"
          elif expires and int(expires.group(1)) < time.time():
              reason = "expired"
          else:
              continue
          targets.append({"vmid": str(ct["vmid"]), "name": ct.get("name"), "reason": reason})

      print(json.dumps(targets, indent=2))
      print("::" + json.dumps({"outputs": {"targets": targets}}) + "::")

  - id: delete_sandboxes
    type: io.kestra.plugin.core.flow.Loop
    runIf: "{{ outputs.find_sandboxes.vars.targets | length > 0 }}"
    values: "{{ outputs.find_sandboxes.vars.targets | jq('[.[].vmid]') | first }}"
    tasks:
      - id: stop_sandbox
        type: io.kestra.plugin.proxmox.container.Stop
        allowFailure: true
        host: "{{ secret('PROXMOX_HOST') }}"
        node: "{{ secret('PROXMOX_NODE') }}"
        tokenId: "{{ secret('PROXMOX_TOKEN_ID') }}"
        tokenSecret: "{{ secret('PROXMOX_TOKEN_SECRET') }}"
        verifySsl: false
        vmName: "{{ item.value }}"

      - id: destroy_sandbox
        type: io.kestra.plugin.proxmox.container.Delete
        host: "{{ secret('PROXMOX_HOST') }}"
        node: "{{ secret('PROXMOX_NODE') }}"
        tokenId: "{{ secret('PROXMOX_TOKEN_ID') }}"
        tokenSecret: "{{ secret('PROXMOX_TOKEN_SECRET') }}"
        verifySsl: false
        vmName: "{{ item.value }}"

  - id: notify
    type: io.kestra.plugin.slack.SlackIncomingWebhook
    runIf: "{{ outputs.find_sandboxes.vars.targets | length > 0 }}"
    allowFailure: true
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "text": "Sandbox cleanup",
        "blocks": [
          {"type": "section", "text": {"type": "mrkdwn", "text": "*Sandbox cleanup*\n{% for t in outputs.find_sandboxes.vars.targets %}{{ t.name }} deleted ({{ t.reason }}){% if not loop.last %}\n{% endif %}{% endfor %}"}}
        ]
      }

triggers:
  - id: run_ended_early
    type: io.kestra.plugin.core.trigger.Flow
    dependsOn:
      - namespace: company.team
        flowId: proxmox-app-sandbox-with-approval
        states: [KILLED, FAILED]

  - id: sweep
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"

extend:
  title: Clean Up Proxmox VE Sandboxes When a Run Is Killed or Expires
  shortDescription: Delete Proxmox VE sandboxes as soon as the run that created them is killed or fails, and sweep any sandbox past its expiry every 15 minutes.
  metaTitle: Clean Up Proxmox VE Sandboxes Automatically with Kestra
  metaDescription: Delete Proxmox VE sandboxes when the run that created them is killed or fails, and sweep expired sandboxes every 15 minutes with Kestra.
  description: |
    Make sure short-lived sandboxes stay short-lived. This flow is the companion of the [Approved Proxmox VE Sandbox for AI Agents](https://kestra.io/blueprints/proxmox-app-sandbox-with-approval) blueprint. That flow deletes its sandbox in a `finally` block when the run ends normally. This one covers every other ending: a person kills the execution, a task fails, or an agent calls a different tool than the one it was asked to use. Kill stops an execution on the spot, so the teardown lives in its own flow with its own triggers.

    ## How it works
    1. `run_ended_early` (`io.kestra.plugin.core.trigger.Flow`) starts the flow when `proxmox-app-sandbox-with-approval` ends in `KILLED` or `FAILED`.
    2. `sweep` (`io.kestra.plugin.core.trigger.Schedule`) starts it every 15 minutes.
    3. `find_sandboxes` reads every container tagged `sandbox` through the Proxmox API. Each sandbox carries its execution ID and an expiry timestamp in its notes. A container is selected when its execution is the run that just ended, or when its expiry has passed.
    4. `delete_sandboxes` (`io.kestra.plugin.core.flow.Loop`) stops and deletes each selected container.
    5. `notify` posts the deleted sandboxes and the reason to Slack.

    ## What you get
    - No sandbox left running after a killed or failed run.
    - A scheduled sweep that catches anything else past its expiry.
    - A Slack message for every sandbox deleted, with the reason.

    ## Who it's for
    - Platform teams offering self-service sandboxes to developers and AI agents.
    - Infrastructure teams running Proxmox VE who want every short-lived environment to end on time.

    ## Why orchestrate this with Kestra
    The cleanup reacts to the state of another flow and to a schedule, without any change to the flow it protects. It does not depend on how the sandbox run ended or on an agent following its instructions, and every deletion is an execution you can inspect.

    ## Prerequisites
    Sandboxes created by the `proxmox-app-sandbox-with-approval` blueprint, which tags them `sandbox` and writes `execution <id>, expires <epoch>` in their notes. The Proxmox, Python, and Slack plugins installed.

    ### Secrets
    - `PROXMOX_HOST`: Proxmox VE host or IP (no scheme, no port).
    - `PROXMOX_NODE`: Node name, for example `pve`.
    - `PROXMOX_TOKEN_ID`: API token ID, for example `kestra@pve!automation`.
    - `PROXMOX_TOKEN_SECRET`: API token secret.
    - `SLACK_WEBHOOK`: Incoming webhook for the approvers' channel.

    ## Quick start
    1. Import this flow in the same namespace as `proxmox-app-sandbox-with-approval`.
    2. Create the secrets above, the same ones the sandbox flow uses.
    3. Kill a running sandbox execution and watch this flow delete its container.

    ## How to extend
    - Point the Flow trigger at other flows that create sandboxes, as long as they write the same tag and notes.
    - Use the same pattern with the VMware vSphere or Nutanix AHV tasks in the Enterprise Edition.
    - Change the `sweep` schedule to match your shortest sandbox lifetime.

    ## Links
    - [Flow trigger](https://kestra.io/plugins/core/triggers/io.kestra.plugin.core.trigger.Flow)
    - [Proxmox plugin](https://kestra.io/plugins/plugin-proxmox)
    - [Approved Proxmox VE Sandbox for AI Agents](https://kestra.io/blueprints/proxmox-app-sandbox-with-approval)
  tags:
    - Infrastructure
    - AI
  subTags:
    - VM Provisioning
    - FinOps & Cost Management
  ee: false
  demo: false
