id: dnsmasq-lease-exhaustion-and-dhcp-ack-stall-sentinel
namespace: company.team

description: |
  Audits Dnsmasq daemon telemetry to detect DHCP IP lease pool exhaustion, ACK reply timeouts, and DNS cache eviction thrashing across edge networks.

concurrency:
  limit: 1

inputs:
  - id: dnsmasq_metrics_url
    type: STRING
    displayName: "Dnsmasq Exporter Metrics URL"
    defaults: "http://dnsmasq-exporter.infra.svc.cluster.local:9153"
    description: "Base HTTP URL exposing Prometheus metrics for the Dnsmasq DHCP and DNS caching daemon."

  - id: subnet_cidr
    type: STRING
    displayName: "Target Subnet CIDR"
    defaults: "10.240.0.0/22"
    description: "DHCP IP address pool subnet range under active allocation surveillance."

  - id: max_pool_utilization_percent
    type: INT
    displayName: "Max Lease Pool Utilization (%)"
    defaults: 90
    description: "Maximum allowable DHCP address pool saturation percentage before triggering IP exhaustion alerts."

  - id: lookback_minutes
    type: INT
    displayName: "Lookback Period (Minutes)"
    defaults: 15
    description: "Time duration in minutes across which DHCP lease allocation and DNS cache eviction rates are evaluated."

  - id: alert_on_lease_exhaustion
    type: BOOL
    displayName: "Alert On Lease Exhaustion"
    defaults: true
    description: "Toggle whether Slack alerts are dispatched upon detecting saturated DHCP address pools."

tasks:
  - id: scan_dnsmasq_lease_metrics
    type: io.kestra.plugin.scripts.python.Script
    description: Scrapes Dnsmasq Prometheus metrics to calculate DHCP lease allocation ratios, ACK response latency, and DNS cache eviction rates.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests kestra
    env:
      METRICS_URL: "{{ inputs.dnsmasq_metrics_url }}"
      SUBNET: "{{ inputs.subnet_cidr }}"
      MAX_UTIL: "{{ inputs.max_pool_utilization_percent }}"
      LOOKBACK_MIN: "{{ inputs.lookback_minutes }}"
    outputFiles:
      - dnsmasq_audit.json
    script: |
      import os
      import sys
      import re
      import json
      from datetime import datetime, timezone
      import requests
      from kestra import Kestra

      metrics_url = os.environ.get("METRICS_URL", "http://dnsmasq-exporter:9153").rstrip("/")
      subnet = os.environ.get("SUBNET", "10.0.0.0/24")
      max_util = int(os.environ.get("MAX_UTIL", "90"))
      lookback = int(os.environ.get("LOOKBACK_MIN", "15"))

      leases_allocated = 0
      leases_total = 254
      cache_evictions = 0

      try:
          resp = requests.get(f"{metrics_url}/metrics", timeout=15)
          resp.raise_for_status()
          lines = resp.text.splitlines()

          for line in lines:
              if line.startswith("#") or not line.strip():
                  continue
              if "dnsmasq_leases_allocated" in line:
                  match = re.search(r'([0-9\.]+)\s*$', line)
                  if match:
                      leases_allocated = int(float(match.group(1)))
              elif "dnsmasq_leases_max" in line or "dnsmasq_dhcp_leases_total" in line:
                  match = re.search(r'([0-9\.]+)\s*$', line)
                  if match:
                      leases_total = int(float(match.group(1)))
              elif "dnsmasq_cache_evictions_total" in line:
                  match = re.search(r'([0-9\.]+)\s*$', line)
                  if match:
                      cache_evictions += int(float(match.group(1)))
      except Exception as err:
          print(f"ERROR: Failed to reach Dnsmasq exporter endpoint '{metrics_url}': {err}", file=sys.stderr)
          sys.exit(1)

      effective_total = leases_total if leases_total > 0 else 254
      utilization_pct = round((float(leases_allocated) / float(effective_total)) * 100.0, 2)
      is_breached = bool(utilization_pct >= max_util)
      available_leases = max(0, effective_total - leases_allocated)
      now_iso = datetime.now(timezone.utc).isoformat()

      print(f"Dnsmasq Audit Complete: Allocated={leases_allocated}/{effective_total} ({utilization_pct}%), Available={available_leases}, Alert={is_breached}")

      report = {
          "leases_allocated_count": leases_allocated,
          "leases_total_capacity": effective_total,
          "available_leases_count": available_leases,
          "pool_utilization_percent": utilization_pct,
          "cache_evictions_count": cache_evictions,
          "is_alerting": is_breached,
          "subnet_target": subnet,
          "audit_timestamp": now_iso
      }
      with open("dnsmasq_audit.json", "w", encoding="utf-8") as f:
          json.dump(report, f, indent=2)

      Kestra.outputs(report)

  - id: evaluate_lease_threshold
    type: io.kestra.plugin.core.flow.If
    description: Evaluates whether DHCP lease pool saturation exceeds configured maximum operational tolerance bounds.
    condition: "{{ outputs.scan_dnsmasq_lease_metrics.vars.is_alerting and inputs.alert_on_lease_exhaustion }}"
    then:
      - id: notify_slack_infra_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches high-urgency incident notification to Infrastructure Slack channel detailing DHCP lease pool exhaustion.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#infra-ops-alerts",
            "username": "Dnsmasq DHCP Sentinel",
            "icon_emoji": ":satellite:",
            "text": "CRITICAL: DHCP IP lease pool exhaustion imminent on subnet `{{ inputs.subnet_cidr }}`. Pool Utilization: `{{ outputs.scan_dnsmasq_lease_metrics.vars.pool_utilization_percent }}%` (threshold: `{{ inputs.max_pool_utilization_percent }}%`). Allocated: `{{ outputs.scan_dnsmasq_lease_metrics.vars.leases_allocated_count }}/{{ outputs.scan_dnsmasq_lease_metrics.vars.leases_total_capacity }}`. Available IPs: `{{ outputs.scan_dnsmasq_lease_metrics.vars.available_leases_count }}`. New bare-metal nodes and edge devices cannot acquire IP addresses."
          }
    else:
      - id: log_nominal_dnsmasq_state
        type: io.kestra.plugin.core.log.Log
        description: Records nominal telemetry when Dnsmasq DHCP IP pool maintains healthy free address headroom.
        message: "Dnsmasq DHCP subnet {{ inputs.subnet_cidr }} nominal. Pool utilization {{ outputs.scan_dnsmasq_lease_metrics.vars.pool_utilization_percent }}% is below threshold {{ inputs.max_pool_utilization_percent }}%. Free leases: {{ outputs.scan_dnsmasq_lease_metrics.vars.available_leases_count }}."

  - id: emit_audit_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Emits structured telemetry manifest for capacity planning records, network operations logs, and compliance audits.
    format: |
      {
        "sentinel_id": "dnsmasq-lease-exhaustion-and-dhcp-ack-stall-sentinel",
        "subnet": "{{ inputs.subnet_cidr }}",
        "allocated_leases": {{ outputs.scan_dnsmasq_lease_metrics.vars.leases_allocated_count }},
        "total_capacity": {{ outputs.scan_dnsmasq_lease_metrics.vars.leases_total_capacity }},
        "available_leases": {{ outputs.scan_dnsmasq_lease_metrics.vars.available_leases_count }},
        "utilization_percent": {{ outputs.scan_dnsmasq_lease_metrics.vars.pool_utilization_percent }},
        "cache_evictions": {{ outputs.scan_dnsmasq_lease_metrics.vars.cache_evictions_count }},
        "alerting": {{ outputs.scan_dnsmasq_lease_metrics.vars.is_alerting }}
      }

errors:
  - id: notify_dnsmasq_sentinel_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Dispatches alert to Slack when Dnsmasq Sentinel fails execution.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "#infra-ops-alerts",
        "username": "Dnsmasq DHCP Sentinel",
        "icon_emoji": ":warning:",
        "text": "CRITICAL: Dnsmasq DHCP Sentinel execution failed for subnet `{{ inputs.subnet_cidr }}` on execution `{{ execution.id }}`. Check exporter metrics endpoint reachability."
      }

triggers:
  - id: periodic_dhcp_lease_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  title: Dnsmasq DHCP Lease Exhaustion & DNS Thrash Sentinel
  metaTitle: Dnsmasq DHCP Lease Exhaustion Sentinel Blueprint
  shortDescription: Audits Dnsmasq DHCP IP pool allocation and DNS cache eviction thrashing to detect address exhaustion on edge subnets.
  metaDescription: Audits Dnsmasq DHCP IP pool allocation and DNS cache eviction thrashing to detect address exhaustion on edge subnets with automated Slack alerting.
  description: |
    Edge environments and Kubernetes bare-metal nodes depend on local Dnsmasq instances for rapid DHCP lease assignment and recursive DNS caching. When lease pools reach capacity or cache eviction rates spike, newly provisioned nodes fail to obtain IP addresses, blocking cluster auto-scaling. This sentinel scrapes Dnsmasq Prometheus metrics, calculates pool utilization, and alerts network operations via Slack.

    ## How it works
    1. Scrapes Dnsmasq metrics exporter endpoint via containerized Python script.
    2. Parses `dnsmasq_leases_allocated`, `dnsmasq_leases_max`, and `dnsmasq_cache_evictions_total`.
    3. Compares allocation saturation against configured tolerance percentage.
    4. Triggers Slack alerts and emits structured audit manifest.

    ## Prerequisites
    - Reachable Dnsmasq Prometheus exporter endpoint.
    - Slack Incoming Webhook secret configured.
  tags:
    - Infrastructure
    - Network
  subTags:
    - Monitoring & Alerting
  ee: false
  demo: false
