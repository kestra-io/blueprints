id: open-library-subject-catalog-lakehouse-loader
namespace: company.analytics
description: Ingests bibliographic metadata, editions, and publication telemetry from Open Library into Parquet lakehouse storage via DuckDB, tracking edition milestones in Kestra KV store.

inputs:
  - id: search_query
    type: STRING
    description: Bibliographic topic or subject to query across Open Library.
    defaults: "data engineering"

  - id: limit
    type: INT
    description: Maximum number of bibliographic work records to harvest.
    defaults: 25

  - id: edition_alert_threshold
    type: INT
    description: Minimum number of published editions to flag a work as a seminal reference.
    defaults: 10

  - id: state_key
    type: STRING
    description: Kestra KV store key tracking processed bibliographic work keys.
    defaults: open_library_monitored_works_state

variables:
  default_state: "[]"

triggers:
  - id: weekly_catalog_sync
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 6 * * 1"

tasks:
  - id: get_current_state
    type: io.kestra.plugin.core.kv.Get
    key: "{{ inputs.state_key }}"
    errorOnMissing: false

  - id: ingest_and_transform_books
    type: io.kestra.plugin.scripts.python.Commands
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install requests duckdb
    commands:
      - |
        python3 - << 'EOF'
        import os
        import json
        import urllib.parse
        import requests
        import duckdb
        from datetime import datetime

        raw_state = """{{ outputs.get_current_state.value ?? vars.default_state }}"""
        try:
            seen_works = set(json.loads(raw_state)) if raw_state else set()
        except Exception:
            seen_works = set()

        query = "{{ inputs.search_query }}"
        limit = int("{{ inputs.limit }}")
        edition_threshold = int("{{ inputs.edition_alert_threshold }}")

        encoded_q = urllib.parse.quote(query)
        url = f"https://openlibrary.org/search.json?q={encoded_q}&limit={limit}&fields=key,title,author_name,first_publish_year,edition_count,publisher,isbn"

        headers = {"User-Agent": "KestraOpenLibraryLakehouse/1.0 (catalog-analytics@kestra.io)"}
        records = []
        new_works = []
        seminal_works = []
        harvested_keys = []

        try:
            resp = requests.get(url, headers=headers, timeout=20)
            if resp.status_code == 200:
                data = resp.json()
                docs = data.get("docs", [])
                for item in docs:
                    work_key = item.get("key", "")
                    title = item.get("title", "")
                    authors = ", ".join(item.get("author_name", []))[:150]
                    first_year = item.get("first_publish_year", 0)
                    editions = item.get("edition_count", 0)
                    publishers = ", ".join(item.get("publisher", []))[:150]
                    isbns = item.get("isbn", [])
                    primary_isbn = isbns[0] if isbns else ""

                    is_new = work_key not in seen_works
                    is_seminal = editions >= edition_threshold

                    harvested_keys.append(work_key)

                    records.append({
                        "work_key": work_key,
                        "title": title,
                        "authors": authors,
                        "first_publish_year": int(first_year) if first_year else 0,
                        "edition_count": int(editions),
                        "publishers": publishers,
                        "primary_isbn": primary_isbn,
                        "is_seminal_reference": is_seminal,
                        "is_new_work": is_new,
                        "harvest_time": datetime.utcnow().isoformat()
                    })

                    if is_new:
                        new_works.append({"key": work_key, "title": title, "editions": editions})
                    if is_seminal:
                        seminal_works.append({"key": work_key, "title": title, "editions": editions})
        except Exception as e:
            print(f"Error fetching Open Library catalog: {e}")

        with open("open_library_works.json", "w", encoding="utf-8") as f:
            json.dump(records, f)

        con = duckdb.connect()
        if records:
            con.execute("CREATE TABLE open_library AS SELECT * FROM read_json_auto('open_library_works.json')")
            con.execute("COPY open_library TO 'open_library_catalog.parquet' (FORMAT PARQUET)")
            con.execute("COPY open_library TO 'open_library_catalog.csv' (HEADER, DELIMITER ',')")
        else:
            con.execute("""
                CREATE TABLE open_library (
                    work_key VARCHAR,
                    title VARCHAR,
                    authors VARCHAR,
                    first_publish_year INTEGER,
                    edition_count INTEGER,
                    publishers VARCHAR,
                    primary_isbn VARCHAR,
                    is_seminal_reference BOOLEAN,
                    is_new_work BOOLEAN,
                    harvest_time VARCHAR
                )
            """)
            con.execute("COPY open_library TO 'open_library_catalog.parquet' (FORMAT PARQUET)")
            con.execute("COPY open_library TO 'open_library_catalog.csv' (HEADER, DELIMITER ',')")

        summary = {
            "total_harvested_works": len(records),
            "new_works_count": len(new_works),
            "seminal_works_count": len(seminal_works),
            "seminal_works": seminal_works[:5],
            "updated_state": list(set(list(seen_works) + harvested_keys))[:500]
        }

        print(f"::{{'outputs': {json.dumps(summary)}}}::")
        EOF
    outputFiles:
      - open_library_catalog.parquet
      - open_library_catalog.csv

  - id: persist_state
    type: io.kestra.plugin.core.kv.Set
    key: "{{ inputs.state_key }}"
    value: "{{ outputs.ingest_and_transform_books.vars.updated_state | toJson }}"

  - id: check_seminal_works
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.ingest_and_transform_books.vars.seminal_works_count > 0 }}"
    then:
      - id: notify_seminal_works
        type: io.kestra.plugin.core.log.Log
        level: INFO
        message: "📚 Open Library Catalog Harvest: Found {{ outputs.ingest_and_transform_books.vars.seminal_works_count }} seminal work(s) with over {{ inputs.edition_alert_threshold }} published editions."

outputs:
  - id: total_works
    type: INT
    value: "{{ outputs.ingest_and_transform_books.vars.total_harvested_works }}"
  - id: seminal_works_count
    type: INT
    value: "{{ outputs.ingest_and_transform_books.vars.seminal_works_count }}"
  - id: dataset_parquet
    type: FILE
    value: "{{ outputs.ingest_and_transform_books.outputFiles['open_library_catalog.parquet'] }}"

extend:
  title: Open Library Bibliographic Catalog Lakehouse Loader with DuckDB
  metaTitle: Open Library Catalog Lakehouse Loader | Kestra
  shortDescription: Ingests bibliographic metadata, editions, and publication telemetry from Open Library into Parquet lakehouse storage via DuckDB.
  metaDescription: Poll Open Library Search API for bibliographic records, convert publication history and edition counts into Parquet via DuckDB, and track state in KV store.
  tags:
    - Data
  subTags:
    - ELT & Warehouse Loading
    - File & Data Processing Basics
  ee: false
  demo: false
  description: |
    Automate the scheduled harvesting, transformation, and analytical persistence of bibliographic records,
    edition histories, authors, and publication telemetry from Open Library into Parquet using DuckDB.

    ## How it works

    1. **State Recovery**: Queries Kestra KV store (`open_library_monitored_works_state`) for previously processed work identifiers.
    2. **Open Library Ingestion**: Queries the official Open Library Search REST API (`openlibrary.org/search.json`) with customizable topic queries.
    3. **DuckDB Bibliographic Normalization**: Unpacks publication years, edition counts, ISBN numbers, and authors into a relational schema inside Docker.
    4. **Analytical Lake Export**: Exports normalized catalog data into columnar Parquet and CSV files for research indexing and citation modeling.
    5. **Milestone Detection & State Commitment**: Identifies works with high edition velocity and commits processed work keys to Kestra KV store.

    ## What you get

    - Automated, scheduled collection of open public domain and modern bibliographic catalog data.
    - Columnar Parquet datasets queryable with DuckDB, Trino, Snowflake, or ClickHouse.
    - Built-in KV state management tracking catalog state without external database requirements.

    ## Who it's for

    - Data Scientists and NLP Researchers building literature corpus datasets.
    - Academic Librarians and Information Architects maintaining digital catalogs.
    - Analytics Engineers building reproducible multi-cloud lakehouse pipelines.

    ## Why orchestrate this with Kestra

    - Built-in KV store maintains catalog state across runs without external database infrastructure.
    - Ephemeral Docker execution guarantees reproducible, clean Python and DuckDB runtimes.
    - Declarative scheduled execution with automated error recovery and conditional logging.

    ## Prerequisites

    - Docker runtime configured on the Kestra worker.
    - Outbound internet access to `openlibrary.org`.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: (Optional) Webhook URL for alerting teams on newly cataloged reference works.

    ## Quick start

    1. Import this blueprint into your Kestra instance.
    2. Customize the `search_query` and `limit` input parameters.
    3. Click **Execute** to run an immediate catalog sync and generate the Parquet table.
    4. Enable the `weekly_catalog_sync` schedule for automated weekly updates.

    ## How to extend

    - Add an S3 or GCS upload step to archive weekly catalog snapshots to an enterprise lakehouse.
    - Connect a vector embedding step to generate semantic search embeddings over book summaries.

    ## Links

    - [Open Library API Documentation](https://openlibrary.org/dev/docs/api/search)
    - [DuckDB Documentation](https://duckdb.org/)
    - [Kestra Task Runners](https://kestra.io/docs/task-runners)
