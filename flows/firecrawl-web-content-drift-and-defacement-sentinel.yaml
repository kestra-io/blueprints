id: firecrawl-web-content-drift-and-defacement-sentinel
namespace: company.team

description: |
  Continuously scrape and audit mission-critical web applications, landing pages, or public documentation endpoints using Firecrawl. Extracts LLM-ready markdown content, validates HTTP status codes, audits page title and required content signatures, classifies integrity posture, routes Slack security notifications, and logs compliance audit telemetry.

inputs:
  - id: target_url
    type: STRING
    displayName: Target URL to Audit
    description: Absolute HTTP/HTTPS URL of the web page or public endpoint to inspect.
    defaults: "https://example.com"

  - id: firecrawl_base_url
    type: STRING
    displayName: Firecrawl Base URL
    description: Base URL for self-hosted Firecrawl API instance (e.g., http://localhost:3002). For Firecrawl Cloud, set https://api.firecrawl.dev.
    defaults: "http://localhost:3002"

  - id: expected_title_contains
    type: STRING
    displayName: Expected Title Keyword
    description: Substring that must appear in the HTML page title to verify page identity and detect title hijacking.
    defaults: "Example"

  - id: min_content_length
    type: INT
    displayName: Minimum Content Length
    description: Minimum acceptable character count of scraped markdown content to detect blank responses or truncation.
    defaults: 50

  - id: expected_keyword
    type: STRING
    displayName: Required Body Keyword
    description: Signature keyword or phrase that must be present in the scraped markdown body.
    defaults: "Domain"

tasks:
  - id: scrape_target
    type: io.kestra.plugin.firecrawl.Scrape
    description: Scrapes the target web page using Firecrawl API to extract clean markdown, page title, and HTTP status code.
    allowFailure: true
    apiKey: "{{ secret('FIRECRAWL_API_KEY') }}"
    baseUrl: "{{ inputs.firecrawl_base_url }}"
    url: "{{ inputs.target_url }}"
    formats:
      - markdown
    onlyMainContent: true
    waitFor: "PT1S"
    requestTimeout: "PT20S"

  - id: classify_content_integrity
    type: io.kestra.plugin.core.debug.Return
    description: Evaluates scrape results against expected content integrity criteria to classify operational state into COMPLIANT, CONTENT_DRIFT_WARNING, CRITICAL_DEFACEMENT_OR_OUTAGE, or PROBE_FAILED.
    format: |
      {{ outputs.scrape_target is not defined or outputs.scrape_target.statusCode is not defined ? 'PROBE_FAILED' : (outputs.scrape_target.statusCode != 200 ? 'CRITICAL_DEFACEMENT_OR_OUTAGE' : (not ((outputs.scrape_target.title ?? '') contains inputs.expected_title_contains) ? 'CRITICAL_DEFACEMENT_OR_OUTAGE' : (((outputs.scrape_target.markdown ?? '') | length) < inputs.min_content_length or not ((outputs.scrape_target.markdown ?? '') contains inputs.expected_keyword) ? 'CONTENT_DRIFT_WARNING' : 'COMPLIANT'))) }}

  - id: route_by_integrity
    type: io.kestra.plugin.core.flow.Switch
    description: Dispatches notifications and logs based on classified content integrity state.
    value: "{{ outputs.classify_content_integrity.value }}"
    cases:
      "COMPLIANT":
        - id: log_compliant_state
          type: io.kestra.plugin.core.log.Log
          message: "Web content audit COMPLIANT for {{ inputs.target_url }}. Status: {{ outputs.scrape_target.statusCode }}. Title: '{{ outputs.scrape_target.title }}'. Content length: {{ (outputs.scrape_target.markdown ?? '') | length }} chars."

      "CONTENT_DRIFT_WARNING":
        - id: alert_drift_slack
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {{ {"text": "Firecrawl Sentinel WARNING: Content drift detected on " ~ inputs.target_url ~ ". Content length: " ~ ((outputs.scrape_target.markdown ?? '') | length) ~ " chars (min expected: " ~ inputs.min_content_length ~ "). Required keyword '" ~ inputs.expected_keyword ~ "' match: " ~ (((outputs.scrape_target.markdown ?? '') contains inputs.expected_keyword) ? "found" : "MISSING") ~ ". Page title: '" ~ outputs.scrape_target.title ~ "'. Execution ID: " ~ execution.id ~ "."} | toJson }}

        - id: log_drift_warning
          type: io.kestra.plugin.core.log.Log
          message: "Content drift warning on {{ inputs.target_url }}. Required keyword or length threshold not met."

      "CRITICAL_DEFACEMENT_OR_OUTAGE":
        - id: alert_critical_slack
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {{ {"text": "Firecrawl Sentinel CRITICAL ALERT: Potential defacement or outage detected on " ~ inputs.target_url ~ "! HTTP Status: " ~ (outputs.scrape_target.statusCode ?? 'NONE') ~ ". Page Title: '" ~ (outputs.scrape_target.title ?? 'MISSING') ~ "' (expected keyword: '" ~ inputs.expected_title_contains ~ "'). Immediate inspection required. Execution ID: " ~ execution.id ~ "."} | toJson }}

        - id: log_critical_error
          type: io.kestra.plugin.core.log.Log
          message: "CRITICAL: Potential defacement or HTTP outage on {{ inputs.target_url }}."

      "PROBE_FAILED":
        - id: alert_probe_failed_slack
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {{ {"text": "Firecrawl Sentinel PROBE_FAILED: Failed to scrape " ~ inputs.target_url ~ " via Firecrawl at " ~ inputs.firecrawl_base_url ~ ". Service unreachable or invalid API key. Execution ID: " ~ execution.id ~ "."} | toJson }}

        - id: log_probe_failed
          type: io.kestra.plugin.core.log.Log
          message: "Probe failed against {{ inputs.target_url }} via Firecrawl API."

  - id: audit_summary
    type: io.kestra.plugin.core.output.OutputValues
    description: Exports structured audit metrics and verification timestamps for compliance logging.
    values:
      target_url: "{{ inputs.target_url }}"
      status_code: "{{ outputs.scrape_target.statusCode ?? 0 }}"
      page_title: "{{ outputs.scrape_target.title ?? 'N/A' }}"
      content_length: "{{ (outputs.scrape_target.markdown ?? '') | length }}"
      integrity_status: "{{ outputs.classify_content_integrity.value }}"
      scraped_document_uri: "{{ outputs.scrape_target.uri ?? 'NONE' }}"

errors:
  - id: alert_flow_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alerts on unexpected workflow runtime execution failure.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {{ {"text": "Firecrawl Sentinel workflow failed unexpectedly during execution " ~ execution.id ~ " in namespace " ~ flow.namespace ~ "."} | toJson }}

triggers:
  - id: hourly_canary
    type: io.kestra.plugin.core.trigger.Schedule
    description: Executes automated web integrity check at the top of every hour. Shipped disabled.
    cron: "0 * * * *"
    disabled: true
    inputs:
      target_url: "https://example.com"
      firecrawl_base_url: "http://localhost:3002"
      expected_title_contains: "Example"
      min_content_length: 50
      expected_keyword: "Domain"

extend:
  title: Firecrawl Web Content Drift and Defacement Sentinel
  metaTitle: Firecrawl Web Content Drift and Defacement Sentinel | Kestra
  shortDescription: Continuous web page scraping with Firecrawl, content drift auditing, defacement canary detection, and Slack escalation.
  metaDescription: Audit web content integrity and detect defacement using Firecrawl page scraping, Pebble classification, and automated Slack incident escalation via Kestra.
  description: |
    Continuously audits public web pages, corporate landing portals, and critical documentation endpoints by scraping live pages via Firecrawl, validating HTTP status codes and page titles, detecting unauthorized content modifications or defacements, and dispatching incident escalation alerts to Slack.

    This blueprint was created by [Mohit Jeswani](https://github.com/mohitjeswani01).

    ## How it works

    1. `scrape_target` (`io.kestra.plugin.firecrawl.Scrape`) scrapes the target URL using Firecrawl API, rendering the page and producing clean LLM-ready markdown alongside metadata such as HTTP status code and page title. `allowFailure: true` ensures network timeouts or scraping failures are captured gracefully.
    2. `classify_content_integrity` (`io.kestra.plugin.core.debug.Return`) evaluates scrape response attributes against baseline integrity requirements:
       - Classifies as `PROBE_FAILED` if the Firecrawl service is unreachable or fails to return output.
       - Classifies as `CRITICAL_DEFACEMENT_OR_OUTAGE` if the HTTP status code is not 200 or the page title does not contain `expected_title_contains`.
       - Classifies as `CONTENT_DRIFT_WARNING` if body length falls below `min_content_length` or the required `expected_keyword` is absent.
       - Classifies as `COMPLIANT` when all status, title, and body integrity criteria pass.
    3. `route_by_integrity` (`io.kestra.plugin.core.flow.Switch`) routes execution based on the classification:
       - `COMPLIANT`: Logs successful audit confirmation with page title and content character count.
       - `CONTENT_DRIFT_WARNING`: Dispatches a Slack notification warning that expected body content has drifted or truncated.
       - `CRITICAL_DEFACEMENT_OR_OUTAGE`: Sends an urgent incident alert to Slack flagging title alteration or HTTP errors.
       - `PROBE_FAILED`: Notifies on-call teams of Firecrawl API connectivity issues.
    4. `audit_summary` (`io.kestra.plugin.core.output.OutputValues`) exports structured audit telemetry including status code, title, content length, and internal storage URI.
    5. `errors` sends a priority failure notification to Slack if unhandled workflow execution errors occur.

    ## What you get

    - Automated, scheduled verification of mission-critical web portals without manual browsing checks.
    - Rapid detection of unauthorized website alterations, SEO spam injections, and DNS/reverse-proxy outages.
    - LLM-ready markdown extraction with full page snapshots archived to Kestra internal storage.
    - Contextual Slack alerts containing exact URLs, titles, and failed keyword signatures.
    - Centralized governance and compliance audit records tracking site uptime and content health.

    ## Who it's for

    - Platform Engineers and SecOps teams guarding public-facing web applications against defacement.
    - Site Reliability Engineers (SREs) monitoring high-value web portals and status pages.
    - Content Operations and Marketing teams ensuring critical landing pages remain intact and compliant.

    ## Why orchestrate this with Kestra

    Standard HTTP ping monitors only verify TCP or HTTP 200 responses; they cannot inspect DOM content, verify page titles, or detect subtle defacements where an attacker injects malicious content while returning HTTP 200. Kestra pairs Firecrawl's headless scraping engine with declarative Pebble rule evaluations, multi-channel notification routing, and auditable execution histories.

    ## Prerequisites

    - A running Firecrawl instance (either local open-source Docker container or Firecrawl Cloud).
    - An incoming Slack webhook URL for incident notifications.

    ### Secrets

    - `FIRECRAWL_API_KEY`: API key for Firecrawl. When self-hosting Firecrawl with Docker, any placeholder string (such as `fc-local`) is accepted.
    - `SLACK_WEBHOOK_URL`: Incoming Slack webhook URL used by `alert_drift_slack`, `alert_critical_slack`, `alert_probe_failed_slack`, and `alert_flow_failure`.

    ## Quick start

    1. Configure `FIRECRAWL_API_KEY` and `SLACK_WEBHOOK_URL` in your Kestra namespace secrets.
    2. Start a local Firecrawl instance using Docker:
       ```bash
       docker run -d --name firecrawl -p 3002:3002 mendableai/firecrawl:latest
       ```
    3. Import this blueprint and execute manually with `target_url: "https://example.com"`.
    4. Verify that `classify_content_integrity` yields `COMPLIANT` and inspect the structured output in `audit_summary`.
    5. Enable the `hourly_canary` schedule to automate continuous web integrity audits.

    ## How to extend

    - Add multiple target URLs in a loop using `io.kestra.plugin.core.flow.ForEach` to audit an entire domain catalog.
    - Route critical alerts to PagerDuty or Opsgenie in addition to Slack for out-of-hours on-call escalation.
    - Pipe scraped markdown into an LLM analysis task (such as `io.kestra.plugin.openai.ChatCompletion`) to perform automated semantic brand safety and compliance grading.

    ## Links

    - [Kestra Firecrawl Plugin](https://kestra.io/plugins/plugin-firecrawl)
    - [Firecrawl Documentation](https://docs.firecrawl.dev)
    - [Firecrawl GitHub Repository](https://github.com/mendableai/firecrawl)
    - [Kestra Slack Plugin](https://kestra.io/plugins/plugin-slack)
  tags:
    - AI
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - Incident Response
  ee: false
  demo: false
