id: loyalty-points-expiry-sweep
namespace: company.team

description: |
  Loyalty balances that lapse without a warning cost a member their reward and
  cost the brand the repeat purchase that reward was meant to buy, so this flow
  sweeps the ledger before each expiry date passes. A keyed webhook accepts a
  refreshed points export and a disabled weekly schedule stands ready as the
  fallback net; a shell step writes loyalty.csv and a python step measures every
  expiry_date against today inside the horizon_days window with an optional
  grace_days tail, flagging each member whose balance falls inside it. When
  members sit inside the window each one gets a reminder email and the channel
  gets one Slack summary carrying the member count and the total points at
  stake, while a clean ledger is logged as clear. Each run exposes the verdict,
  the expiring member count, the expiring member objects and the total points
  expiring as typed outputs.

triggers:
  - id: points_loaded
    type: io.kestra.plugin.core.trigger.Webhook
    description: The loyalty platform POSTs here after a points export or a redemption run so the ledger is re-swept immediately.
    key: "{{ secret('LOYALTY_SWEEP_WEBHOOK_KEY') }}"
  - id: weekly_expiry_sweep
    type: io.kestra.plugin.core.trigger.Schedule
    description: Disabled Monday morning net that re-checks the whole ledger each week until an operator switches it on.
    cron: "0 6 * * 1"
    disabled: true

inputs:
  - id: horizon_days
    type: INT
    defaults: 30
    description: How many days ahead a balance may expire and still count as expiring, measured from the day the sweep runs.
  - id: grace_days
    type: INT
    defaults: 0
    description: How many days past expiry an unredeemed balance is still worth chasing, so a zero grace keeps only future expiries.

tasks:
  # --- 1. loyalty ledger and expiry window ---
  - id: loyalty_workspace
    type: io.kestra.plugin.core.flow.WorkingDirectory
    description: One shared directory so the fixture written by the shell step is the exact file the expiry calculation reads.
    tasks:
      - id: write_loyalty
        type: io.kestra.plugin.scripts.shell.Commands
        description: Writes loyalty.csv from a heredoc of eight member rows whose expiry dates are dated forward from today, three of them inside the thirty day window and the other five well beyond it.
        commands:
          - |
            set -eu
            cat > loyalty.csv <<LOYALTY_EOF
            customer,points,expiry_date,tier,email
            Nora Fields,4200,$(date -d "+9 days" +%F),gold,nora.fields@example.com
            Owen Hartley,1850,$(date -d "+21 days" +%F),silver,owen.hartley@example.com
            Priya Nair,760,$(date -d "+30 days" +%F),bronze,priya.nair@example.com
            Quentin Roe,3100,$(date -d "+62 days" +%F),gold,quentin.roe@example.com
            Lena Kowalski,2260,$(date -d "+47 days" +%F),gold,lena.kowalski@example.com
            Marta Silva,940,$(date -d "+120 days" +%F),silver,marta.silva@example.com
            Dev Anand,510,$(date -d "+185 days" +%F),bronze,dev.anand@example.com
            Tomas Berg,1330,$(date -d "+240 days" +%F),silver,tomas.berg@example.com
            LOYALTY_EOF
            echo "loyalty rows $(($(wc -l < loyalty.csv) - 1))"

      - id: assess_expiry
        type: io.kestra.plugin.scripts.python.Script
        description: Reads loyalty.csv with the csv module, computes days_to_expiry per row, keeps the rows between minus grace_days and horizon_days, and emits verdict, expiring_count, customers and points_expiring through the outputs protocol.
        taskRunner:
          type: io.kestra.plugin.core.runner.Process
        env:
          HORIZON_DAYS: "{{ inputs.horizon_days }}"
          GRACE_DAYS: "{{ inputs.grace_days }}"
        script: |
          import csv
          import json
          import os
          from datetime import date, datetime

          CSV_FILE = "loyalty.csv"
          REQUIRED = ("customer", "points", "expiry_date", "tier", "email")


          def env_int(name, fallback):
              try:
                  value = int(str(os.environ.get(name, "")).strip())
              except ValueError:
                  return fallback
              return value if value >= 0 else fallback


          def build():
              horizon = env_int("HORIZON_DAYS", 30)
              grace = env_int("GRACE_DAYS", 0)
              today = date.today()

              header = []
              rows = []
              if os.path.exists(CSV_FILE):
                  with open(CSV_FILE, newline="", encoding="utf-8") as handle:
                      reader = csv.DictReader(handle)
                      header = list(reader.fieldnames or [])
                      rows = [row for row in reader]

              if not all(name in header for name in REQUIRED) or not rows:
                  return ("NO_DATA", 0, [], 0,
                          "loyalty.csv is missing required columns or carries no rows")

              records = []
              skipped = 0
              for row in rows:
                  customer = (row.get("customer") or "").strip()
                  email = (row.get("email") or "").strip()
                  try:
                      expiry = datetime.strptime(
                          (row.get("expiry_date") or "").strip(), "%Y-%m-%d").date()
                  except ValueError:
                      skipped += 1
                      continue
                  if not customer or not email:
                      skipped += 1
                      continue
                  try:
                      points = int(float((row.get("points") or "0").strip()))
                  except ValueError:
                      points = 0
                  if points < 0:
                      points = 0
                  tier = (row.get("tier") or "").strip() or "unknown"
                  days_to_expiry = (expiry - today).days
                  if days_to_expiry < -grace or days_to_expiry > horizon:
                      continue
                  records.append({
                      "customer": customer,
                      "points": points,
                      "expiry_date": expiry.isoformat(),
                      "days_to_expiry": days_to_expiry,
                      "tier": tier,
                      "email": email,
                  })

              if not records and skipped == len(rows):
                  return ("NO_DATA", 0, [], 0,
                          "no row carried a readable expiry_date")

              records.sort(key=lambda r: (r["days_to_expiry"], r["customer"]))
              expiring_count = len(records)
              points_expiring = sum(r["points"] for r in records)
              verdict = "ACTION_REQUIRED" if expiring_count else "ALL_CLEAR"
              summary = ("checked %d member row(s), %d expiring within %d day(s), "
                         "%d skipped") % (len(rows), expiring_count, horizon, skipped)
              return (verdict, expiring_count, records, points_expiring, summary)


          verdict, expiring_count, customers, points_expiring, summary = build()
          print(summary)
          print("::" + json.dumps({"outputs": {
              "verdict": verdict,
              "expiring_count": expiring_count,
              "customers": customers,
              "points_expiring": points_expiring,
          }}) + "::")

  # --- 2. expiry gate and escalation ---
  - id: expiry_gate
    type: io.kestra.plugin.core.flow.If
    description: Branches on the expiring member count so balances inside the window escalate to member emails and one Slack summary, while a ledger with nothing expiring is recorded without waking anyone.
    condition: "{{ outputs.assess_expiry.vars.expiring_count > 0 }}"
    then:
      - id: notify_each_member
        type: io.kestra.plugin.core.flow.Loop
        description: Walks the expiring members one at a time so every member is reminded about their own balance instead of receiving one crowded digest.
        values: "{{ outputs.assess_expiry.vars.customers }}"
        concurrencyLimit: 1
        tasks:
          - id: send_expiry_email
            type: io.kestra.plugin.email.MailSend
            description: Tells a single member that their balance is inside the expiry window, with the points, the tier, the expiry date and the days left to redeem.
            from: "{{ secret('SMTP_FROM') }}"
            to: "{{ item.value.email }}"
            host: "{{ secret('SMTP_HOST') }}"
            username: "{{ secret('SMTP_USERNAME') }}"
            password: "{{ secret('SMTP_PASSWORD') }}"
            port: 465
            subject: "Your {{ item.value.points }} loyalty points expire on {{ item.value.expiry_date }}"
            htmlTextContent: |
              <p>{{ item.value.customer }},</p>
              <p>Your <strong>{{ item.value.points }}</strong> loyalty points in the
              <strong>{{ item.value.tier }}</strong> tier expire on
              <strong>{{ item.value.expiry_date }}</strong>, which is
              <strong>{{ item.value.days_to_expiry }}</strong> day(s) from today.</p>
              <p>Redeem them before the balance is removed, or reply to this note
              if the expiry date looks wrong so it can be corrected.</p>
              <p>Execution {{ execution.id }}</p>
      - id: post_expiry_summary
        type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
        description: Posts one summary to the channel with the member count, the total points at stake and every expiring member listed by days left.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {"text": "Loyalty points expiry sweep - {{ outputs.assess_expiry.vars.expiring_count }} member(s), {{ outputs.assess_expiry.vars.points_expiring }} points expiring within {{ inputs.horizon_days }} days. {% for c in outputs.assess_expiry.vars.customers %}{{ c.customer }} {{ c.points }} pts {{ c.tier }} in {{ c.days_to_expiry }}d ({{ c.expiry_date }}). {% endfor %}Execution {{ execution.id }}."}
    else:
      - id: log_nothing_expiring
        type: io.kestra.plugin.core.log.Log
        description: Records the quiet ledger in execution history so a run with nothing expiring still leaves evidence that the sweep was checked.
        message: "No loyalty balance expires within {{ inputs.horizon_days }} day(s) - verdict {{ outputs.assess_expiry.vars.verdict }}, expiring_count {{ outputs.assess_expiry.vars.expiring_count }}, points_expiring {{ outputs.assess_expiry.vars.points_expiring }}."

errors:
  - id: notify_failure
    type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
    description: Escalate any failure to the ops channel with the execution url.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {"text": "FAILED: {{ flow.id }} {{ execution.id }}"}

outputs:
  - id: verdict
    type: STRING
    description: One of ACTION_REQUIRED, ALL_CLEAR or NO_DATA depending on whether any balance sits inside the expiry window.
    value: "{{ outputs.assess_expiry.vars.verdict }}"
  - id: expiring_count
    type: INT
    description: Number of members whose points expire between minus grace_days and horizon_days ahead, zero on a clean ledger.
    value: "{{ outputs.assess_expiry.vars.expiring_count }}"
  - id: customers
    type: ARRAY
    description: 'Expiring members as objects, for example [{"customer": "Nora Fields", "points": 4200, "expiry_date": "2026-10-22", "days_to_expiry": 9, "tier": "gold", "email": "nora.fields@example.com"}].'
    value: "{{ outputs.assess_expiry.vars.customers | toJson }}"
  - id: points_expiring
    type: INT
    description: Total loyalty points held by the expiring members, so the liability leaving the ledger is visible at a glance.
    value: "{{ outputs.assess_expiry.vars.points_expiring }}"

extend:
  title: Warn Members Before Their Loyalty Points Expire
  metaTitle: Loyalty Points Expiry Sweep With Member Alerts
  shortDescription: Sweep the loyalty ledger for balances expiring inside a configurable horizon, email each member, post one Slack summary and log a clean ledger.
  metaDescription: Sweep the loyalty ledger for balances expiring inside a configurable horizon, email each member, post one Slack summary and log a clean ledger.
  description: |
    Points that expire while nobody is watching turn an earned reward into a written-off liability and a member who feels cheated. This flow keeps a rolling sweep over the loyalty ledger, so lifecycle and CRM owners see the window while the balance is still redeemable instead of after it is gone.

    ## How it works

    1. `points_loaded` (`io.kestra.plugin.core.trigger.Webhook`, keyed) accepts a refreshed points export from the loyalty platform and starts a sweep on the spot. `weekly_expiry_sweep` (`io.kestra.plugin.core.trigger.Schedule`, cron `0 6 * * 1`) is the Monday morning net that re-checks the whole ledger once someone switches it on.
    2. `loyalty_workspace` (`io.kestra.plugin.core.flow.WorkingDirectory`) gives the run one directory, so the file written by the shell task is the file the calculation reads.
    3. `write_loyalty` (`io.kestra.plugin.scripts.shell.Commands`) drops `loyalty.csv` through a heredoc of eight member rows dated forward from today with `date -d`. Three rows expire inside the thirty day window, at nine, twenty-one and thirty days, and the remaining five expire at forty-seven days or later, so the shipped fixture always exercises both branches of the gate.
    4. `assess_expiry` (`io.kestra.plugin.scripts.python.Script`) parses the file with the `csv` module, computes `days_to_expiry` for each row, keeps the rows from `-grace_days` through `horizon_days`, sorts them by the days remaining, and prints the repo-standard `::` plus json outputs plus `::` payload carrying `verdict`, `expiring_count`, `customers` and `points_expiring`. It reports `NO_DATA` when the file has no usable header or rows.
    5. `expiry_gate` (`io.kestra.plugin.core.flow.If`) branches on `expiring_count` being above zero.
    6. In the alert branch `notify_each_member` (`io.kestra.plugin.core.flow.Loop`) walks the expiring members one at a time and `send_expiry_email` (`io.kestra.plugin.email.MailSend`) emails that member their own balance, tier, expiry date and days left. `post_expiry_summary` (`io.kestra.plugin.notifications.slack.SlackIncomingWebhook`) posts one summary carrying the member count, the total points at stake and every expiring member with their days remaining. The quiet branch records `log_nothing_expiring` (`io.kestra.plugin.core.log.Log`) with the verdict.
    7. The `errors` block posts to Slack whenever the fixture, the calculation or a notifier breaks, because a crashed sweep must never look like a clean ledger.

    ## What you get

    - `verdict` (STRING): `ACTION_REQUIRED` when at least one balance expires inside the window, `ALL_CLEAR` when none does, `NO_DATA` when the file carries no usable rows.
    - `expiring_count` (INT): members whose points expire inside the window, zero on a clean ledger.
    - `customers` (ARRAY): one object per expiring member with `customer`, `points`, `expiry_date`, `days_to_expiry`, `tier` and `email`, sorted by the days remaining.
    - `points_expiring` (INT): the total balance leaving the ledger across every expiring member.
    - One email per expiring member and one Slack summary when action is required, plus a log line when the ledger is clean.

    ## Who it's for

    - Loyalty and lifecycle managers who own the points liability and cannot afford balances lapsing without a warning.
    - CRM teams who want one targeted email per member rather than a single digest nobody reads.
    - Finance partners who track expiring points as a liability release and need the total at stake after every sweep.

    ## Why orchestrate this with Kestra

    A spreadsheet of expiry dates runs only when somebody remembers to open it, and a calendar reminder works only until somebody clears it. Kestra gives the sweep a keyed webhook and a disabled weekly schedule, a branch that separates a busy ledger from a quiet one, and a loop that turns one parse into one email per member, with SMTP and Slack routing from a single versioned file. The verdict, the count, the member list and the points at stake are typed outputs, so a dashboard or a downstream accrual job can read the state without scraping logs, and the `errors` handler keeps a broken run visible.

    ## Prerequisites

    - Python 3 and a shell on the Kestra worker with GNU `date`, the calculation uses only `csv`, `json`, `os` and `datetime`.
    - An SMTP relay reachable from the worker, with a sender address allowed to use it.
    - A Slack incoming webhook for the sweep summary and for failure alerts.
    - Your own loyalty export in place of the heredoc fixture, keeping the same five columns.

    ### Secrets

    - `LOYALTY_SWEEP_WEBHOOK_KEY`: key segment guarding the webhook URL, anyone holding it can start a sweep.
    - `SMTP_FROM`, `SMTP_HOST`, `SMTP_USERNAME`, `SMTP_PASSWORD`: relay and credentials used by `send_expiry_email`.
    - `SLACK_WEBHOOK_URL`: Slack incoming webhook for the sweep summary and for failure alerts.

    ## Quick start

    1. Add the four secret groups to your namespace and import the flow.
    2. Run once with the default inputs. The bundled fixture puts Nora Fields nine days out, Owen Hartley twenty-one days out and Priya Nair exactly thirty days out, so the run reports `verdict: ACTION_REQUIRED`, `expiring_count: 3` and `points_expiring: 6810`, emails three members and posts one Slack summary.
    3. Raise `horizon_days` to 60 and run again to watch Lena Kowalski at forty-seven days and Quentin Roe at sixty-two days join the window, lifting the count to five.
    4. Empty the heredoc rows inside `write_loyalty` and run again to see `NO_DATA` recorded by the gate.
    5. Trigger `points_loaded` at `/api/v1/{tenant}/executions/webhook/{namespace}/loyalty-points-expiry-sweep/{LOYALTY_SWEEP_WEBHOOK_KEY}`, then enable `weekly_expiry_sweep` once the export matches your ledger.

    ## How to extend

    - Replace the heredoc with `io.kestra.plugin.jdbc.postgresql.Queries` against the points ledger, or with `io.kestra.plugin.git.Clone` pulling the export, and keep the same python verdict.
    - Add a third input for a tier allowlist so only gold and silver members are chased when bronze balances are not worth the postage.
    - Group the loop by tier when one lifecycle campaign wants a single message per tier instead of one mail per member.
    - Persist `customers` for trend reporting with `io.kestra.plugin.jdbc.postgresql.Queries` or ship the snapshot to `io.kestra.plugin.aws.s3.Upload`.
    - Swap the email branch for `io.kestra.plugin.github.issues.Create` when the expiry backlog is worked as tickets instead of member mail.

    ## Links

    - [Kestra workflow triggers](https://kestra.io/docs/workflow-triggers)
    - [Kestra email plugin](https://kestra.io/plugins/plugin-email)
    - [Kestra Slack plugin](https://kestra.io/plugins/plugin-slack)
  tags:
    - Business
  subTags:
    - loyalty
    - crm
    - notifications
    - rewards
  ee: false
  demo: false
