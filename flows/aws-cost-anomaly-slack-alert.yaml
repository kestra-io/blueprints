id: aws-cost-anomaly-slack-alert
namespace: company.team
description: |
  Pull yesterday's AWS spend from Cost Explorer, compare it with your
  daily budget, and alert Slack with the delta the moment spend runs hot.

triggers:
  - id: daily_spend_check
    type: io.kestra.plugin.core.trigger.Schedule
    description: Run every morning so last night's spend spike is caught before the workday starts.
    cron: "0 8 * * *"
    disabled: true
  - id: webhook_spend_check
    type: io.kestra.plugin.core.trigger.Webhook
    description: Call from a deploy or incident pipeline when you want an on-demand spend read.
    key: aws-spend-check

inputs:
  - id: daily_budget_usd
    type: FLOAT
    defaults: 100.0
    description: Yesterday's blended spend above this amount is treated as an anomaly.
  - id: region
    type: STRING
    defaults: us-east-1
    description: Region used for the Cost Explorer API call (Cost Explorer is global but requires a region).

tasks:
  - id: fetch_yesterday_cost
    type: io.kestra.plugin.aws.cli.AwsCLI
    description: Query Cost Explorer for yesterday's blended cost and land the raw JSON next to the execution working directory.
    accessKeyId: "{{ secret('AWS_ACCESS_KEY_ID') }}"
    secretKeyId: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
    region: "{{ inputs.region }}"
    commands:
      - aws ce get-cost-and-usage --time-period Start={{ now() | dateAdd(-1, 'DAYS') | date('yyyy-MM-dd') }},End={{ now() | date('yyyy-MM-dd') }} --granularity DAILY --metrics BlendedCost --output json > cost.json

  - id: parse_cost
    type: io.kestra.plugin.scripts.python.Script
    description: Parse the Cost Explorer JSON, extract yesterday's blended cost as a float, and emit it through the stdout outputs protocol so downstream tasks get a typed value.
    containerImage: python:3.11-slim
    warningOnStdErr: false
    script: |
      import json

      with open('cost.json') as f:
          data = json.load(f)

      amount = float(data['ResultsByTime'][0]['Total']['BlendedCost']['Amount'])
      currency = data['ResultsByTime'][0]['Total']['BlendedCost'].get('Unit', 'USD')
      print('yesterday blended cost: ' + str(amount) + ' ' + currency)
      print('::' + json.dumps({'outputs': {'cost': amount, 'currency': currency}}) + '::')

  - id: check_budget
    type: io.kestra.plugin.core.flow.If
    description: Branch on the parsed cost — over budget pages you, under budget just gets logged for the trend.
    condition: "{{ outputs.parse_cost.vars.cost > inputs.daily_budget_usd }}"
    then:
      - id: alert_overspend
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Post the measured spend next to the budget so the alert says how big the anomaly is, not just that one exists.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": ":warning: AWS spend anomaly — yesterday cost {{ outputs.parse_cost.vars.cost }} {{ outputs.parse_cost.vars.currency }}, over your {{ inputs.daily_budget_usd }} budget. Execution {{ execution.id }}. Check Cost Explorer for the spike driver."
          }
    else:
      - id: log_within_budget
        type: io.kestra.plugin.core.log.Log
        description: Record in-budget spend on every run so execution history is your daily spend trend.
        message: "AWS spend within budget: {{ outputs.parse_cost.vars.cost }} {{ outputs.parse_cost.vars.currency }} (budget {{ inputs.daily_budget_usd }})."

errors:
  - id: alert_fetch_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alert when the cost pull itself fails — no data read must ever look like a normal day.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "AWS cost fetch FAILED in flow {{ flow.id }} (execution {{ execution.id }}). Verify the AWS credentials secret and Cost Explorer permissions."
      }

outputs:
  - id: cost_summary
    type: JSON
    description: 'Yesterday''s cost and currency, e.g. {"cost": 42.13, "currency": "USD"}.'
    value: "{{ outputs.parse_cost.vars | toJson }}"

extend:
  title: Catch AWS Spend Spikes Before Standup
  shortDescription: Daily AWS Cost Explorer pull that compares yesterday's spend to your budget and alerts Slack on anomalies.
  metaTitle: AWS Cost Anomaly Alerts with Kestra
  metaDescription: Check yesterday's AWS spend against a daily budget every morning and alert Slack when costs run hot.
  description: |
    Cloud bills rarely spike because someone wanted them to — a runaway job, a forgotten dev fleet, a mis-sized instance. By the time the invoice lands it is a month old. This blueprint turns Cost Explorer into a morning signal: yesterday's blended cost is pulled, compared to your daily budget, and any breach lands in Slack with the actual spend next to the budget it broke. In-budget days log their number too, so your execution history doubles as the spend trend.

    ## How it works

    1. `fetch_yesterday_cost` (`io.kestra.plugin.aws.cli.AwsCLI`) calls Cost Explorer for yesterday at DAILY granularity with BlendedCost metrics, pinning credentials through secrets.
    2. `parse_cost` (`io.kestra.plugin.scripts.python.Script`) extracts the amount and currency from the JSON and emits them through the `::{"outputs": ...}::` protocol for typed downstream use.
    3. `check_budget` (`io.kestra.plugin.core.flow.If`) compares the cost with `daily_budget_usd`. Over: `alert_overspend` posts cost, currency, budget, and execution id. Under: `log_within_budget` records the trend point.
    4. The `errors` block alerts Slack when the fetch itself fails — a missing number must never read as a normal day.
    5. Triggers: a disabled daily `Schedule` plus a `Webhook` (`aws-spend-check`) for on-demand reads.

    ## What you get

    - A daily anomaly signal with the size of the spike, not just a binary alert.
    - A spend trend in your execution history without a dedicated dashboard.
    - A `cost_summary` JSON output for a downstream ticket, email, or approval step.

    ## Who it's for

    - Teams on shared AWS accounts who only hear about overspend from the invoice.
    - FinOps practitioners wiring lightweight guardrails before buying a full tool.
    - Platform teams that want cost checks alongside deploy pipelines.

    ## Why orchestrate this with Kestra

    Cost Explorer alone is a console nobody checks. The flow adds the schedule, the threshold branch, the Slack alert, the self-reporting failure channel, and history — and because it is a flow, the next step (open a Jira ticket, freeze non-prod, page FinOps) is one task away.

    ## Prerequisites

    - AWS credentials with `ce:GetCostAndUsage` permission.
    - A Slack incoming webhook.

    ### Secrets

    - `AWS_ACCESS_KEY_ID` / `AWS_SECRET_ACCESS_KEY`: credentials for the Cost Explorer call.
    - `SLACK_WEBHOOK_URL`: webhook for overspend and fetch-failure alerts.

    ## Quick start

    1. Add the two AWS secrets and the Slack webhook secret to your namespace.
    2. Set `daily_budget_usd` to your real daily floor (default 100 is deliberately round).
    3. Run once — read `cost_summary` and compare with the Cost Explorer console.
    4. Enable the `daily_spend_check` schedule.

    ## How to extend

    - Group by service (`--group-by Type=DIMENSION,Key=SERVICE`) to alert on which service spiked.
    - Store `cost_summary` in KV and alert only on day-over-day jumps.
    - Add a `Fail` task on breach for a hard release gate.

    ## Links

    - [AWS Cost Explorer GetCostAndUsage](https://docs.aws.amazon.com/aws-cost-management/latest/APIReference/API_GetCostAndUsage.html)
    - [Kestra Slack incoming webhook](https://kestra.io/plugins/notifications/slack)
    - This blueprint has been created by [yashspidey](https://github.com/yashspidey)
  tags:
    - Data
    - Business
  subTags:
    - FinOps & Cost Management
    - Monitoring & Alerting
  ee: false
  demo: false
