id: vector-pipeline-disk-buffer-backpressure-sentinel
namespace: company.observability

inputs:
  - id: vector_metrics_url
    type: STRING
    defaults: "http://vector.observability:8686/metrics"
    description: Prometheus scrape endpoint for Vector pipeline instance.
  - id: buffer_byte_threshold
    type: INT
    defaults: 10737418240
    description: "Maximum allowable disk buffer byte size before alerting (default 10GB)."

tasks:
  - id: query_vector_buffers
    type: io.kestra.plugin.scripts.shell.Commands
    commands:
      - |
        curl -s -f "{{ inputs.vector_metrics_url }}" > /tmp/vector_metrics.txt
        
        # Scrape buffer_byte_size metric across all sinks
        MAX_BUFFER=$(grep -E "^buffer_byte_size" /tmp/vector_metrics.txt | awk '{if ($2>max) max=$2} END {print max+0}')
        echo "::set-output name=max_buffer_bytes::$MAX_BUFFER::"

  - id: evaluate_buffer_saturation
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.query_vector_buffers.vars.max_buffer_bytes | int > inputs.buffer_byte_threshold }}"
    then:
      - id: notify_platform_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#observability-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 Vector Pipeline Disk Buffer Saturation Alert",
                "text": "Vector pipeline at `{{ inputs.vector_metrics_url }}` has reached peak buffer usage of *{{ outputs.query_vector_buffers.vars.max_buffer_bytes }} bytes*! Downstream sinks are backpressured or unresponsive, risking disk full conditions.",
                "footer": "Kestra Observability Sentinel • Vector"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#observability-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ Vector Buffer Sentinel Failure",
            "text": "Failed to query Vector metrics endpoint. Verify Vector agent address and network connectivity.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  title: Vector Observability Data Pipeline On-Disk Buffer Saturation Sentinel
  shortDescription: Audits Vector log and metrics pipelines for on-disk buffer saturation and backpressure stalls.
  description: |
    ## How it works
    This workflow connects to the Vector Prometheus `/metrics` endpoint (port `8686`) to monitor the `buffer_byte_size` metric across all configured data sinks (Kafka, Elasticsearch, S3, Loki). Vector uses on-disk buffers to survive downstream sink outages without losing log or metric events. However, when a downstream destination suffers prolonged downtime or throttling, disk buffers grow until node storage is exhausted, causing Vector to stall or drop events. This workflow tracks maximum buffer utilization and raises alerts before disk exhaustion occurs.

    ## What you get
    - Real-time detection of backpressured data pipelines and sink outages.
    - Prevents log forwarder pod crashes caused by filled disk volumes.
    - Clear quantitative metrics on buffer saturation.

    ## Who it's for
    - SREs and Data Engineers running Vector for high-throughput log and metric routing.
    - Platform teams ensuring reliable data transport across distributed topologies.

    ## Why orchestrate this with Kestra
    - **Continuous Health Auditing**: Scheduled checks proactively detect accumulating pipeline backpressure.
    - **Lightweight Execution**: Scrapes and analyzes telemetry directly with shell and jq.
    - **Targeted Notification**: Routes warnings to platform channels before data transport stalls.

    ## Prerequisites
    - Vector daemonset or cluster running with internal metrics enabled (`api.enabled = true`).
    - Secret `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import the blueprint.
    2. Provide your Vector metrics URL and buffer threshold.
    3. Run the workflow to inspect buffer utilization.

    ## How to extend
    - Identify the specific blocked sink by inspecting the `component_id` label in the metric output.
    - Automatically scale up persistent disk volume size using cloud volume resize APIs.

    ## Links
    - [Vector Monitoring and Metrics](https://vector.dev/docs/administration/monitoring/)
    - [Kestra Documentation](https://kestra.io/docs)
  tags:
    - Infrastructure
    - Data
  ee: false
  demo: false
