    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
    - [Dex Identity Provider Telemetry Reference](https://dexidp.io/docs/telemetry/)
    - [Dex SAML 2.0 Connector Configuration Guide](https://dexidp.io/docs/connectors/saml/)
    - [SAML 2.0 Security Assertions Specification](https://docs.oasis-open.org/security/saml/v2.0/)
