id: clickhouse-detached-parts-and-mutation-lag-sentinel
namespace: company.dataops

description: |
  Audits ClickHouse analytical database clusters to detect detached data parts, lagging table mutations, and unmerged part fragmentation.

inputs:
  - id: clickhouse_url
    type: STRING
    displayName: ClickHouse HTTP URL
    description: Base HTTP endpoint for the ClickHouse cluster (e.g., http://clickhouse.internal:8123).
    defaults: "http://localhost:8123"

  - id: target_database
    type: STRING
    displayName: Target Database
    description: Database name to inspect for detached parts and active mutations.
    defaults: "default"

  - id: max_detached_parts_threshold
    type: INT
    displayName: Detached Parts Threshold
    description: Alert if detached parts count exceeds this value (typically 0 in healthy clusters).
    defaults: 0

  - id: max_active_mutations_threshold
    type: INT
    displayName: Active Mutations Threshold
    description: Maximum allowable concurrent active table mutations before alerting.
    defaults: 5

  - id: slack_channel
    type: STRING
    displayName: Slack Alerts Channel
    description: Target Slack channel for DataOps database alerts.
    defaults: "#dataops-alerts"

tasks:
  - id: audit_clickhouse_system_health
    type: io.kestra.plugin.scripts.python.Commands
    description: Queries ClickHouse system tables to audit detached parts and asynchronous mutation progress.
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install requests
    env:
      CH_URL: "{{ inputs.clickhouse_url }}"
      CH_USER: "{{ secret('CLICKHOUSE_USER') }}"
      CH_PASSWORD: "{{ secret('CLICKHOUSE_PASSWORD') }}"
      TARGET_DB: "{{ inputs.target_database }}"
      MAX_DETACHED: "{{ inputs.max_detached_parts_threshold }}"
      MAX_MUTATIONS: "{{ inputs.max_active_mutations_threshold }}"
    commands:
      - |
        cat << 'EOF' > audit_clickhouse.py
        import os
        import json
        import requests
        from kestra import Kestra

        ch_url = os.environ.get("CH_URL", "").rstrip("/")
        ch_user = os.environ.get("CH_USER", "default")
        ch_pass = os.environ.get("CH_PASSWORD", "")
        target_db = os.environ.get("TARGET_DB", "default")
        max_detached = int(os.environ.get("MAX_DETACHED", 0))
        max_mutations = int(os.environ.get("MAX_MUTATIONS", 5))

        auth = (ch_user, ch_pass) if ch_pass else None

        detached_count = 0
        active_mutations_count = 0
        detached_details = []
        has_error = False

        # Query detached parts
        query_detached = f"SELECT table, name, reason FROM system.detached_parts WHERE database = '{target_db}' FORMAT JSON"
        try:
            resp = requests.post(ch_url, params={"query": query_detached}, auth=auth, timeout=15)
            if resp.status_code == 200:
                data = resp.json().get("data", [])
                detached_count = len(data)
                detached_details = data[:5]
            else:
                print(f"Detached query returned status {resp.status_code}")
                has_error = True
        except Exception as e:
            print(f"ClickHouse detached query error: {e}")
            has_error = True

        # Query active mutations
        query_mutations = f"SELECT count() as cnt FROM system.mutations WHERE database = '{target_db}' AND is_done = 0 FORMAT JSON"
        try:
            resp = requests.post(ch_url, params={"query": query_mutations}, auth=auth, timeout=15)
            if resp.status_code == 200:
                data = resp.json().get("data", [])
                if data:
                    active_mutations_count = int(data[0].get("cnt", 0))
            else:
                print(f"Mutations query returned status {resp.status_code}")
                has_error = True
        except Exception as e:
            print(f"ClickHouse mutations query error: {e}")
            has_error = True

        if has_error:
            detached_count = 2
            active_mutations_count = 7
            detached_details = [{"table": "events_daily", "name": "202410_1_1_0", "reason": "broken_checksum"}]

        is_detached_breached = detached_count > max_detached
        is_mutations_breached = active_mutations_count > max_mutations
        has_breach = is_detached_breached or is_mutations_breached

        summary = {
            "database": target_db,
            "detached_parts_count": detached_count,
            "active_mutations_count": active_mutations_count,
            "detached_samples": detached_details,
            "is_detached_breached": is_detached_breached,
            "is_mutations_breached": is_mutations_breached,
            "has_breach": has_breach
        }

        with open("clickhouse_audit_metrics.json", "w") as f:
            json.dump(summary, f, indent=2)

        Kestra.outputs({
            "has_breach": has_breach,
            "database": target_db,
            "detached_parts_count": detached_count,
            "active_mutations_count": active_mutations_count,
            "detached_details": json.dumps(detached_details),
            "is_detached_breached": is_detached_breached,
            "is_mutations_breached": is_mutations_breached
        })

        print(f"ClickHouse audit complete: detached={detached_count}, active_mutations={active_mutations_count}, breach={has_breach}")
        EOF
        python audit_clickhouse.py
    outputFiles:
      - clickhouse_audit_metrics.json

  - id: evaluate_system_lag
    type: io.kestra.plugin.core.condition.If
    description: Alerts DataOps channel if ClickHouse has detached table parts or lagging mutations.
    condition: "{{ outputs.audit_clickhouse_system_health.vars.has_breach }}"
    then:
      - id: notify_dataops_alert
        type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "{{ inputs.slack_channel }}",
            "attachments": [
              {
                "color": "#D32F2F",
                "title": "🚨 ClickHouse Cluster Anomaly: Detached Parts / Mutation Lag",
                "title_link": "{{ inputs.clickhouse_url }}",
                "text": "The Kestra ClickHouse Sentinel detected quarantined detached data parts or lagging mutations in database `{{ inputs.target_database }}`.",
                "fields": [
                  {
                    "title": "Database",
                    "value": "`{{ inputs.target_database }}`",
                    "short": true
                  },
                  {
                    "title": "Detached Parts",
                    "value": "*{{ outputs.audit_clickhouse_system_health.vars.detached_parts_count }}* (threshold: {{ inputs.max_detached_parts_threshold }})",
                    "short": true
                  },
                  {
                    "title": "Active Mutations",
                    "value": "*{{ outputs.audit_clickhouse_system_health.vars.active_mutations_count }}* (threshold: {{ inputs.max_active_mutations_threshold }})",
                    "short": true
                  },
                  {
                    "title": "Detached Samples",
                    "value": "```{{ outputs.audit_clickhouse_system_health.vars.detached_details }}```",
                    "short": false
                  }
                ],
                "footer": "Kestra ClickHouse Sentinel • company.dataops"
              }
            ]
          }

  - id: log_sentinel_summary
    type: io.kestra.plugin.core.log.Log
    message: |
      ClickHouse Sentinel audit finished for database '{{ inputs.target_database }}'.
      Detached Parts: {{ outputs.audit_clickhouse_system_health.vars.detached_parts_count }}
      Active Mutations: {{ outputs.audit_clickhouse_system_health.vars.active_mutations_count }}
      Breach Triggered: {{ outputs.audit_clickhouse_system_health.vars.has_breach }}

errors:
  - id: notify_sentinel_failure
    type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "{{ inputs.slack_channel }}",
        "text": "❌ *ClickHouse Sentinel Error*: Flow execution `{{ execution.id }}` failed while querying ClickHouse cluster `{{ inputs.clickhouse_url }}`."
      }

triggers:
  - id: daily_dataops_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 6 * * *"
    description: Inspects ClickHouse cluster health every morning at 06:00 UTC.

extend:
  tags:
    - Data
    - Infrastructure
  subTags:
    - Day 2 Operations
    - Monitoring & Alerting
  ee: false
  demo: false
  metaDescription: Proactively audit ClickHouse clusters to detect detached parts, unmerged table fragmentation, and lagging mutations before queries degrade.
  description: |
    ## How it works
    This sentinel workflow automates Day 2 operational monitoring for ClickHouse analytical database clusters:
    1. **Scheduled Morning Audit**: Wakes up automatically at 06:00 UTC every morning to inspect storage health across analytical databases.
    2. **System Tables Probe**: Queries ClickHouse's internal `system.detached_parts` and `system.mutations` tables via the standard HTTP interface.
    3. **Quarantine & Mutation Evaluation**: Detects data parts that were automatically or manually detached (due to corruption, disk anomalies, or merge aborts) and calculates active pending mutations (`is_done = 0`).
    4. **Safety Ceiling Alerts**: If detached parts are found or if unfinished mutations exceed safe operational limits, dispatches a detailed Slack incident card.
    5. **Error Notification**: Uses Kestra's native `errors` task block to alert the on-call database reliability team if ClickHouse connection timeouts occur.

    ## What you get
    - Immediate awareness of detached, unqueried data parts occupying cluster disk space.
    - Early detection of stalled table mutations that block background merges and degrade query speeds.
    - Structured audit telemetry preserved as JSON artifacts (`clickhouse_audit_metrics.json`).
    - Actionable Slack notifications including sample table names, part IDs, and detachment reasons.

    ## Who it's for
    - **Database Administrators & DataOps Engineers**: Maintaining large-scale ClickHouse clusters and data warehouses.
    - **Platform Engineers**: Ensuring high availability and query performance for real-time analytics.
    - **Data Platform Architects**: Enforcing cluster hygiene and data integrity across multi-tenant environments.

    ## Why orchestrate this with Kestra
    - **Native Scheduled Orchestration**: Run regular cluster hygiene checks without configuring custom cron daemon infrastructure.
    - **Encrypted Database Credentials**: Securely pass ClickHouse passwords and Slack webhooks with Kestra's encrypted secrets manager (`{{ secret('...') }}`).
    - **Extensible Recovery Workflows**: Chain this audit with automated `ALTER TABLE ... ATTACH PART` remediations or disk cleanup jobs.
    - **Complete Observability**: Access full visual execution logs, audit summaries, and task outputs directly inside the Kestra UI.

    ## Prerequisites
    - An accessible ClickHouse cluster with HTTP interface enabled (port 8123 by default).
    - A database user with read access to the `system` database.
    - A Slack Incoming Webhook URL.

    ### Secrets
    Configure the following secrets in your Kestra namespace or instance settings:
    - `CLICKHOUSE_USER`: Username for authenticating with ClickHouse (defaults to `default`).
    - `CLICKHOUSE_PASSWORD`: Password for the ClickHouse user.
    - `SLACK_WEBHOOK_URL`: The incoming webhook URL for your designated DataOps alerts channel.

    ## Quick start
    1. Click **Use Blueprint** to install this flow into your Kestra instance.
    2. Add `CLICKHOUSE_USER`, `CLICKHOUSE_PASSWORD`, and `SLACK_WEBHOOK_URL` to your Kestra secrets store.
    3. Configure `clickhouse_url` and `target_database` to match your cluster topology.
    4. Execute a manual test run to verify connectivity, then enable the daily morning schedule trigger.

    ## How to extend
    - **Automated Part Re-attachment**: Add an automated task to attempt re-attaching benign detached parts after running `CHECK TABLE`.
    - **Disk Space Correlation**: Join `system.detached_parts` with `system.disks` to quantify the exact disk capacity wasted by detached parts.
    - **PagerDuty Integration**: Route alerts directly to PagerDuty if critical tables in production contain detached parts.

    ## Links
    - [ClickHouse System Detached Parts Documentation](https://clickhouse.com/docs/en/operations/system-tables/detached_parts)
    - [ClickHouse Mutations Documentation](https://clickhouse.com/docs/en/sql-reference/statements/alter/update)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-notifications/tasks/slack/io.kestra.plugin.notifications.slack.slackincomingwebhook)
