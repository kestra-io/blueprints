id: graphql-introspection-exposure-sentinel
namespace: company.security

inputs:
  - id: graphql_endpoint_url
    type: STRING
    displayName: GraphQL Endpoint URL
    defaults: "https://api.example.com/graphql"
    description: Full HTTP or HTTPS URL of the target GraphQL production endpoint to audit for schema introspection exposure.

  - id: fail_on_exposure
    type: BOOL
    displayName: Fail on Introspection Exposure
    defaults: true
    description: Whether to fail the workflow execution when introspection is exposed, blocking deployment pipelines and triggering incident response.

triggers:
  - id: scheduled_security_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: Run periodic automated introspection checks every 6 hours to detect accidental exposure after deployments. Shipped disabled by default.
    cron: "0 */6 * * *"
    disabled: true
    inputs:
      graphql_endpoint_url: "https://api.example.com/graphql"

tasks:
  - id: probe_introspection
    type: io.kestra.plugin.graphql.Request
    description: Send a GraphQL introspection query probing for __schema and type definitions. failOnGraphQLErrors is disabled so error responses can be evaluated.
    uri: "{{ inputs.graphql_endpoint_url }}"
    headers:
      User-Agent: "Kestra-GraphQL-Security-Sentinel/1.0"
      Authorization: "Bearer {{ secret('GRAPHQL_AUTH_TOKEN') }}"
    failOnGraphQLErrors: false
    allowFailed: true
    query: |
      query IntrospectionSecurityAudit {
        __schema {
          queryType {
            name
          }
          types {
            name
            kind
          }
        }
      }

  - id: evaluate_exposure
    type: io.kestra.plugin.core.flow.If
    description: Evaluate whether the GraphQL server returned an active schema with exposed types (EXPOSURE_DETECTED) or blocked introspection (SECURE).
    condition: "{{ outputs.probe_introspection.body is defined and outputs.probe_introspection.body.__schema is defined and (outputs.probe_introspection.body.__schema.types | length) > 0 }}"
    then:
      - id: alert_introspection_exposure
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Post high-severity security notification to Slack with the leaked endpoint and discovered type count.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "🚨 *CRITICAL SECURITY ALERT: GraphQL Schema Introspection Exposed* 🚨\n\n*Target Endpoint:* `{{ inputs.graphql_endpoint_url }}`\n*Leaked Types Count:* {{ outputs.probe_introspection.body.__schema.types | length }}\n*Sample Exposed Types:* {{ outputs.probe_introspection.body.__schema.types | jq('[.[].name] | map(select(startswith(\"__\") | not)) | .[0:5] | join(\", \")') | first }}\n*Execution ID:* {{ execution.id }}\n\n*Action Required:* Disable introspection in production configuration (e.g. set `introspection: false` in Apollo Server, Mercurius, or Yoga)."
          }

      - id: check_fail_policy
        type: io.kestra.plugin.core.flow.If
        description: Enforce deployment or compliance gate by failing execution if fail_on_exposure is true.
        condition: "{{ inputs.fail_on_exposure }}"
        then:
          - id: fail_security_gate
            type: io.kestra.plugin.core.execution.Fail
            description: Halt workflow with fatal status to fail CI/CD deployments and alert incident monitors.
    else:
      - id: log_introspection_locked
        type: io.kestra.plugin.core.log.Log
        description: Log secure status confirming that production schema introspection is properly disabled.
        message: "SECURE: GraphQL endpoint {{ inputs.graphql_endpoint_url }} rejected or disabled schema introspection as required."

  - id: log_audit_summary
    type: io.kestra.plugin.core.log.Log
    description: Record final audit metrics for compliance and audit trail logging.
    message: "GraphQL introspection audit complete for {{ inputs.graphql_endpoint_url }}. Status: {{ outputs.probe_introspection.body is defined and outputs.probe_introspection.body.__schema is defined and (outputs.probe_introspection.body.__schema.types | length) > 0 ? 'EXPOSURE_DETECTED' : 'SECURE' }}."

errors:
  - id: alert_on_probe_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alert SecOps channel if network timeout, DNS resolution, or TLS handshake fails during the audit.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "⚠️ *GraphQL Sentinel Probe Error*: Execution `{{ execution.id }}` failed to probe `{{ inputs.graphql_endpoint_url }}`. Verify endpoint availability and network connectivity."
      }

outputs:
  - id: status
    type: STRING
    value: "{{ outputs.probe_introspection.body is defined and outputs.probe_introspection.body.__schema is defined and (outputs.probe_introspection.body.__schema.types | length) > 0 ? 'EXPOSURE_DETECTED' : 'SECURE' }}"
  - id: leaked_types_count
    type: INT
    value: "{{ outputs.probe_introspection.body is defined and outputs.probe_introspection.body.__schema is defined ? (outputs.probe_introspection.body.__schema.types | length) : 0 }}"

extend:
  title: GraphQL production introspection exposure and schema leakage sentinel
  metaTitle: GraphQL Introspection Exposure Sentinel | Kestra
  shortDescription: Probe GraphQL production endpoints for unauthorized schema introspection, detect internal type leakage, and alert security teams on exposure.
  metaDescription: Audit production GraphQL endpoints for unauthorized schema introspection, detect type exposure, and alert security teams on schema leakage.
  description: |
    Protect production GraphQL APIs against unauthorized schema discovery and reconnaissance by automatically auditing GraphQL introspection queries. While GraphQL schema introspection (`__schema` and `__type`) is essential during development, leaving it enabled in production exposes internal data structures, backend entity relationships, deprecated fields, and administrative queries to potential attackers. This sentinel workflow periodically probes your production GraphQL endpoints with native introspection queries, evaluates whether the server leaks type definitions, alerts security teams via Slack with discovered type counts, and halts execution when exposure policies are violated.

    ## How it works
    1. A `Schedule` trigger periodically invokes the security sentinel on a 6-hour interval (shipped disabled by default).
    2. Task `probe_introspection` uses `io.kestra.plugin.graphql.Request` to dispatch an introspection query (`query IntrospectionSecurityAudit { __schema { queryType { name } types { name kind } } }`) to `inputs.graphql_endpoint_url`. With `failOnGraphQLErrors: false` and `allowFailed: true`, the task succeeds even when secure servers return HTTP 400 or GraphQL error objects (such as `"GraphQL introspection is not allowed"`).
    3. Task `evaluate_exposure` (`io.kestra.plugin.core.flow.If`) inspects the response body:
       - If `outputs.probe_introspection.body.__schema.types` is populated, the endpoint is actively leaking its schema (`EXPOSURE_DETECTED`). The workflow posts a critical alert to Slack detailing the exposed endpoint and leaked type names, and conditionally triggers `fail_security_gate` (`io.kestra.plugin.core.execution.Fail`).
       - If introspection is blocked or disabled, task `log_introspection_locked` records a clean `SECURE` status.
    4. Task `log_audit_summary` records compliance metrics for audit logs.
    5. Top-level `errors` handler catches network unreachable or TLS handshake failures.

    ## What you get
    - Continuous verification that production GraphQL gateways enforce introspection lockdown policies.
    - Immediate detection of accidental introspection re-enabling caused by misconfigured environment variables or staging promotions.
    - Actionable Slack notifications containing discovered type counts and sample entity names.
    - Automated deployment gate integration to block CI/CD pipelines before insecure API configurations reach customers.

    ## Who it's for
    - Application Security (AppSec) and SecOps engineers enforcing API hardening standards.
    - Platform and Backend Engineers maintaining public-facing GraphQL APIs across Apollo, Hasura, Yoga, or Mercurius.
    - DevOps teams needing automated pre-release security verification gates.

    ## Why orchestrate this with Kestra
    Manual penetration testing or periodic scripts often fail to catch temporary misconfigurations introduced during fast release cycles. Kestra provides declarative, observable orchestration with native GraphQL request handling, built-in retry and timeout management, secret handling, and instant Slack notifications. Rather than maintaining custom security scanners, your API security audits live as version-controlled code directly alongside your existing infrastructure pipelines.

    ## Prerequisites
    - Network access from the Kestra worker to the target GraphQL endpoint.
    - A valid authentication token or API key if the GraphQL endpoint requires credentials before evaluating queries.

    ### Secrets
    - `GRAPHQL_AUTH_TOKEN`: Bearer token or API key used in the `Authorization` header to authenticate against the GraphQL endpoint.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL used to receive security alerts and probe failure notifications.

    ## Quick start
    1. Store your Slack webhook and GraphQL credentials under Kestra Secrets (`SLACK_WEBHOOK_URL` and `GRAPHQL_AUTH_TOKEN`).
    2. Set `graphql_endpoint_url` to your production GraphQL URL (e.g., `https://api.yourdomain.com/graphql`).
    3. Trigger a manual execution from the Kestra UI to verify that your endpoint correctly blocks introspection and reports `SECURE`.
    4. Enable the `scheduled_security_audit` trigger to enforce recurring automated protection.

    ## How to extend
    - Extend the introspection query to check for specific sensitive types (e.g. `User`, `Admin`, `Payment`) and escalate severity accordingly.
    - Integrate with PagerDuty or Opsgenie plugins (`io.kestra.plugin.notifications.pagerduty.PagerDutyAlert`) for P1 security incident paging.
    - Attach this flow as a post-deployment verification hook in your CD pipeline to block releases if introspection is detected.

    ## Links
    - [OWASP GraphQL Cheat Sheet](https://cheatsheetseries.owasp.org/cheatsheets/GraphQL_Cheat_Sheet.html)
    - [Kestra GraphQL Plugin Documentation](https://kestra.io/plugins/plugin-graphql)
    - [Apollo Server Introspection Guide](https://www.apollographql.com/docs/apollo-server/testing/mocking/#disabling-introspection)
  tags:
    - Infrastructure
  subTags:
    - Policy & Compliance
    - Monitoring & Alerting
  ee: false
  demo: false
