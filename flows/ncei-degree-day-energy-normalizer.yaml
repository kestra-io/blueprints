id: ncei-degree-day-energy-normalizer
namespace: company.team

description: |
  Weather-normalise monthly building energy with NOAA NCEI GHCN-Daily temperatures: one keyless request for
  all stations, heating and cooling degree days per billing period in DuckDB with missing-day handling, a
  per-site regression on HDD and CDD, and a Slack alert for periods that deviate from the weather-expected use.
  History is kept in Parquet behind a KV pointer, so monthly runs only fetch new or pending weather.

inputs:
  - id: sites
    type: STRING
    displayName: Sites (CSV)
    description: >-
      Header `site_id,name,station_id,latitude,longitude`. Give an 11-character GHCN-Daily `station_id`,
      or latitude and longitude to use the nearest active station (SEA-LAB, whose station has real gaps).
    defaults: |
      site_id,name,station_id,latitude,longitude
      CHI-HQ,Chicago head office,USW00014819,,
      SEA-LAB,Renton R&D lab,,47.4970,-122.2040
      MSP-WH,Minneapolis warehouse,USW00014922,,

  - id: readings
    type: STRING
    displayName: Monthly energy readings (CSV)
    description: >-
      Header `site_id,period_start,period_end,energy_kwh,read_type`. Periods include both dates and need not be
      calendar months; `read_type` E is an estimated read (not fitted, not flagged). The defaults are sample meter
      data, 15 periods per site, with a chiller fault at CHI-HQ in July 2026 and an under-reading meter at MSP-WH.
    defaults: |
      site_id,period_start,period_end,energy_kwh,read_type
      CHI-HQ,2025-07-01,2025-07-31,108355,A
      CHI-HQ,2025-08-01,2025-08-31,92759,A
      CHI-HQ,2025-09-01,2025-09-30,82770,A
      CHI-HQ,2025-10-01,2025-10-31,78283,A
      CHI-HQ,2025-11-01,2025-11-30,83909,A
      CHI-HQ,2025-12-01,2025-12-31,88470,E
      CHI-HQ,2026-01-01,2026-01-31,103868,A
      CHI-HQ,2026-02-01,2026-02-28,80679,A
      CHI-HQ,2026-03-01,2026-03-31,83480,A
      CHI-HQ,2026-04-01,2026-04-30,73071,A
      CHI-HQ,2026-05-01,2026-05-31,76648,A
      CHI-HQ,2026-06-01,2026-06-30,82881,A
      CHI-HQ,2026-07-01,2026-07-31,128218,A
      CHI-HQ,2026-08-01,2026-08-31,92094,A
      CHI-HQ,2026-09-01,2026-09-30,85467,A
      SEA-LAB,2025-07-01,2025-07-31,64746,A
      SEA-LAB,2025-08-01,2025-08-31,66414,A
      SEA-LAB,2025-09-01,2025-09-30,58442,A
      SEA-LAB,2025-10-01,2025-10-31,72093,A
      SEA-LAB,2025-11-01,2025-11-30,71450,A
      SEA-LAB,2025-12-01,2025-12-31,79197,A
      SEA-LAB,2026-01-01,2026-01-31,83612,A
      SEA-LAB,2026-02-01,2026-02-28,72724,A
      SEA-LAB,2026-03-01,2026-03-31,80016,A
      SEA-LAB,2026-04-01,2026-04-30,68312,A
      SEA-LAB,2026-05-01,2026-05-31,64270,A
      SEA-LAB,2026-06-01,2026-06-30,58135,A
      SEA-LAB,2026-07-01,2026-07-31,60817,A
      SEA-LAB,2026-08-01,2026-08-31,61105,A
      SEA-LAB,2026-09-01,2026-09-30,57042,A
      MSP-WH,2025-07-20,2025-08-19,34559,A
      MSP-WH,2025-08-20,2025-09-19,32026,A
      MSP-WH,2025-09-20,2025-10-19,32383,A
      MSP-WH,2025-10-20,2025-11-19,48638,A
      MSP-WH,2025-11-20,2025-12-19,65747,A
      MSP-WH,2025-12-20,2026-01-19,67493,A
      MSP-WH,2026-01-20,2026-02-19,50232,A
      MSP-WH,2026-02-20,2026-03-19,54219,A
      MSP-WH,2026-03-20,2026-04-19,47385,A
      MSP-WH,2026-04-20,2026-05-19,37294,A
      MSP-WH,2026-05-20,2026-06-19,33680,A
      MSP-WH,2026-06-20,2026-07-19,33795,A
      MSP-WH,2026-07-20,2026-08-19,35992,A
      MSP-WH,2026-08-20,2026-09-19,32720,A
      MSP-WH,2026-09-20,2026-10-19,31976,A

  - id: readings_file
    type: FILE
    displayName: Readings file (optional)
    required: false
    description: Upload a CSV with the same header to use instead of the `readings` text. It may hold only the latest month; earlier months come from the Parquet history.

  - id: heating_base_c
    type: FLOAT
    defaults: 18.3
    description: Heating degree day base in Celsius (18.3 is the US 65 F convention; 15.5 is common in the UK and EU).

  - id: cooling_base_c
    type: FLOAT
    defaults: 18.3
    description: Cooling degree day base in Celsius.

  - id: temperature_method
    type: SELECT
    values:
      - MIDRANGE
      - TAVG
    defaults: MIDRANGE
    description: MIDRANGE uses (TMAX+TMIN)/2, the NOAA degree day convention, with TAVG when one of them is missing. TAVG uses the station's 24-hour average first (only some stations report it) and falls back to the midrange.

  - id: fill_missing
    type: BOOL
    defaults: true
    description: Scale the degree days of a period with missing days up to the full period when at most `max_missing_pct` of its days are missing. When false, any missing day makes the period GAPPY.

  - id: max_missing_pct
    type: INT
    defaults: 10
    description: Periods with more missing days than this share are GAPPY, kept out of the fit and never flagged.

  - id: deviation_pct
    type: INT
    defaults: 15
    description: Flag a period when actual use is more than this many percent above (HIGH) or below (LOW) the weather-expected use.

  - id: min_months
    type: INT
    defaults: 12
    description: Minimum usable billing periods before a site's model is trusted for flagging.

  - id: max_cv_rmse_pct
    type: INT
    defaults: 15
    description: Maximum CV(RMSE) of the model; ASHRAE Guideline 14 uses 15 percent for monthly models. Sites above it are NO_MODEL.

  - id: search_radius_km
    type: INT
    defaults: 40
    description: How far from a latitude/longitude site to look for a station.

  - id: state_key
    type: STRING
    defaults: ncei_degree_day_history
    description: KV key holding the URI of the Parquet history.

triggers:
  - id: monthly
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 7 6 * *"
    description: The 6th of each month, after the previous month's bills are in and NCEI has published the last days (GHCN-Daily lags three to five days).

tasks:
  - id: history_pointer
    type: io.kestra.plugin.core.kv.Get
    key: "{{ inputs.state_key }}"
    errorOnMissing: false
    description: URI of the Parquet history from the last run. Missing on the first run, which is then a BASELINE.

  - id: bootstrap
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.history_pointer.value is not defined or outputs.history_pointer.value is empty }}"
    then:
      - id: empty_history
        type: io.kestra.plugin.jdbc.duckdb.Queries
        description: First run only. Writes an empty history with the final schema so every later task has one code path.
        url: "jdbc:duckdb:"
        fetchType: NONE
        outputFiles:
          - history_parquet
        sql: |
          CREATE TABLE h (
            site_id VARCHAR, site_name VARCHAR, period_start DATE, period_end DATE, days INTEGER, energy_kwh DOUBLE,
            estimated BOOLEAN, station_id VARCHAR, station_name VARCHAR, station_source VARCHAR, distance_km DOUBLE,
            latitude DOUBLE, longitude DOUBLE, weather_key VARCHAR, weather_status VARCHAR, valid_days INTEGER,
            missing_days INTEGER, hdd DOUBLE, cdd DOUBLE, model VARCHAR, expected_kwh DOUBLE, deviation_pct DOUBLE,
            flag VARCHAR, alerted BOOLEAN, evaluated_at TIMESTAMP);
          COPY h TO '{{ outputFiles.history_parquet }}' (FORMAT PARQUET);

  - id: prepare
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: |
      Validates sites and readings (bad rows are reported with a reason and skipped), merges the readings with the
      history (an uploaded period replaces the stored one), reuses the station found for a latitude/longitude site
      on an earlier run if its coordinates did not change, and lists the sites that still need a station search.
    url: "jdbc:duckdb:"
    fetchType: FETCH_ONE
    inputFiles:
      sites.csv: "{{ inputs.sites }}"
      readings.csv: "{{ inputs.readings_file ?? inputs.readings }}"
      history.parquet: "{{ outputs.history_pointer.value ?? outputs.empty_history.outputFiles.history_parquet }}"
    outputFiles:
      - sites_parquet
      - periods_parquet
    parameters:
      radius: "{{ inputs.search_radius_km }}"
      today: "{{ (trigger.date ?? execution.startDate) | date('yyyy-MM-dd', timeZone='UTC') }}"
    sql: |
      SET TimeZone = 'UTC';
      CREATE TABLE history AS SELECT * FROM read_parquet('history.parquet');

      CREATE TABLE sites_v AS
      SELECT *, CASE
          WHEN site_id IS NULL THEN 'has no site_id'
          WHEN dup > 1 THEN 'is listed more than once'
          WHEN station_in IS NOT NULL AND NOT regexp_full_match(station_in, '[A-Z]{2}[A-Z0-9]{9}') THEN 'has a station_id that is not an 11-character GHCN-Daily id'
          WHEN station_in IS NULL AND (lat IS NULL OR lon IS NULL) THEN 'needs a station_id or latitude and longitude'
          WHEN station_in IS NULL AND (abs(lat) > 90 OR abs(lon) > 180) THEN 'has latitude or longitude out of range' END AS reason
      FROM (SELECT nullif(trim(site_id), '') AS site_id, nullif(trim(name), '') AS name, nullif(upper(trim(station_id)), '') AS station_in,
                   TRY_CAST(nullif(trim(latitude), '') AS DOUBLE) AS lat, TRY_CAST(nullif(trim(longitude), '') AS DOUBLE) AS lon,
                   count(*) OVER (PARTITION BY trim(site_id)) AS dup
            FROM read_csv('sites.csv', header = true, all_varchar = true));

      CREATE TABLE cached AS
      SELECT site_id, station_id, station_name, distance_km, latitude, longitude FROM history
      WHERE station_source = 'NEAREST' AND station_id IS NOT NULL
      QUALIFY row_number() OVER (PARTITION BY site_id ORDER BY evaluated_at DESC) = 1;

      CREATE TABLE sites AS
      SELECT v.site_id, coalesce(v.name, v.site_id) AS site_name, v.lat AS latitude, v.lon AS longitude,
             coalesce(v.station_in, c.station_id) AS station_id, c.station_name,
             CASE WHEN v.station_in IS NOT NULL THEN 'INPUT' ELSE 'NEAREST' END AS station_source, c.distance_km
      FROM sites_v v
      LEFT JOIN cached c ON v.station_in IS NULL AND c.site_id = v.site_id AND round(c.latitude, 4) = round(v.lat, 4) AND round(c.longitude, 4) = round(v.lon, 4)
      WHERE v.reason IS NULL;

      CREATE TABLE readings_v AS
      SELECT *, CASE
          WHEN site_id IS NULL OR site_id NOT IN (SELECT site_id FROM sites) THEN 'belongs to an unknown or invalid site'
          WHEN ps IS NULL OR pe IS NULL THEN 'has an unreadable period_start or period_end'
          WHEN pe < ps THEN 'ends before it starts'
          WHEN pe - ps > 62 THEN 'is longer than 62 days'
          WHEN kwh IS NULL OR kwh < 0 THEN 'has a missing or negative energy_kwh'
          WHEN seq > 1 THEN 'repeats a billing period listed above' END AS reason
      FROM (SELECT *, row_number() OVER (PARTITION BY site_id, ps ORDER BY line) AS seq
            FROM (SELECT row_number() OVER () AS line, trim(site_id) AS site_id, TRY_CAST(trim(period_start) AS DATE) AS ps,
                         TRY_CAST(trim(period_end) AS DATE) AS pe, TRY_CAST(trim(energy_kwh) AS DOUBLE) AS kwh,
                         coalesce(upper(trim(read_type)), 'A') = 'E' AS estimated
                  FROM read_csv('readings.csv', header = true, all_varchar = true)));

      CREATE TABLE periods AS
      WITH merged AS (
        SELECT site_id, ps AS period_start, pe AS period_end, kwh AS energy_kwh, estimated, 'INPUT' AS reading_source
        FROM readings_v WHERE reason IS NULL
        UNION ALL
        SELECT h.site_id, h.period_start, h.period_end, h.energy_kwh, h.estimated, 'HISTORY'
        FROM history h JOIN sites s USING (site_id)
        WHERE NOT EXISTS (SELECT 1 FROM readings_v r WHERE r.reason IS NULL AND r.site_id = h.site_id AND r.ps = h.period_start))
      SELECT m.*, CAST(m.period_end - m.period_start + 1 AS INTEGER) AS days,
             h.weather_key AS prev_weather_key, h.weather_status AS prev_weather_status, h.valid_days AS prev_valid_days,
             h.hdd AS prev_hdd, h.cdd AS prev_cdd, h.station_name AS prev_station_name, coalesce(h.alerted, false) AS prev_alerted
      FROM merged m LEFT JOIN history h ON h.site_id = m.site_id AND h.period_start = m.period_start;

      COPY sites TO '{{ outputFiles.sites_parquet }}' (FORMAT PARQUET);
      COPY periods TO '{{ outputFiles.periods_parquet }}' (FORMAT PARQUET);

      SELECT
        (SELECT count(*) FROM history) = 0 AS is_baseline,
        (SELECT count(*) FROM sites) AS sites,
        (SELECT count(*) FROM readings_v WHERE reason IS NULL) AS readings_loaded,
        (SELECT count(*) FROM periods WHERE reading_source = 'HISTORY') AS periods_from_history,
        (SELECT count(*) FROM sites_v WHERE reason IS NOT NULL) + (SELECT count(*) FROM readings_v WHERE reason IS NOT NULL) AS invalid_rows,
        (SELECT coalesce(string_agg(msg, '; '), '') FROM (
           SELECT 'site ' || coalesce(site_id, '(blank)') || ' ' || reason AS msg FROM sites_v WHERE reason IS NOT NULL
           UNION ALL
           SELECT 'reading ' || coalesce(site_id, '(blank)') || ' line ' || CAST(line + 1 AS VARCHAR) || ' ' || reason FROM readings_v WHERE reason IS NOT NULL)) AS invalid_list,
        (SELECT count(*) FROM sites WHERE station_id IS NULL) AS lookups,
        (SELECT CAST(coalesce(json_group_array(json_object(
           'site_id', s.site_id,
           'bbox', concat_ws(',', round(s.latitude + CAST(:radius AS DOUBLE) / 111.0, 4), round(s.longitude - CAST(:radius AS DOUBLE) / (111.0 * cos(radians(s.latitude))), 4),
                                  round(s.latitude - CAST(:radius AS DOUBLE) / 111.0, 4), round(s.longitude + CAST(:radius AS DOUBLE) / (111.0 * cos(radians(s.latitude))), 4)),
           'start', strftime(w.ws, '%Y-%m-%d'), 'end', strftime(least(w.we, CAST(:today AS DATE)), '%Y-%m-%d'))), '[]') AS VARCHAR)
         FROM sites s JOIN (SELECT site_id, min(period_start) AS ws, max(period_end) AS we FROM periods GROUP BY site_id) w USING (site_id)
         WHERE s.station_id IS NULL) AS lookup_items;

  - id: station_lookup
    type: io.kestra.plugin.core.flow.If
    description: Only when a latitude/longitude site has no station yet.
    condition: "{{ outputs.prepare.outputs[0].row.lookups > 0 }}"
    then:
      - id: search_stations
        type: io.kestra.plugin.core.flow.Loop
        description: One NCEI Search Service call per site, for stations in a box around it that have TMAX and TMIN data in the readings window.
        values: "{{ outputs.prepare.outputs[0].row.lookup_items }}"
        concurrencyLimit: 1
        tasks:
          - id: search
            type: io.kestra.plugin.core.http.Download
            uri: https://www.ncei.noaa.gov/access/services/search/v1/data
            params:
              dataset: daily-summaries
              bbox: "{{ fromJson(item.value).bbox }}"
              dataTypes: TMAX,TMIN
              startDate: "{{ fromJson(item.value).start }}T00:00:00"
              endDate: "{{ fromJson(item.value).end }}T23:59:59"
              limit: "100"
            headers:
              User-Agent: "kestra-ncei-degree-day-energy-normalizer/1.0 (https://kestra.io)"
            retry:
              type: exponential
              interval: PT10S
              maxInterval: PT2M
              maxAttempts: 4
        outputs:
          - id: uri
            type: STRING
            value: "{{ outputs.search.uri }}"

      - id: collect_search
        type: io.kestra.plugin.core.storage.Concat
        files: "{{ outputs.search_stations.outputs | jq('[.[].outputs.uri]') | first }}"
        separator: "\n"
        extension: .json

  - id: plan
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: |
      Picks the nearest station within `search_radius_km` that has both TMAX and TMIN from the start of the window to
      within ten days of its end (the search also returns stations that closed mid-window), then decides which periods
      need weather: new periods, periods still WEATHER_PENDING, and periods computed with another station, base,
      method or fill rule.
    url: "jdbc:duckdb:"
    fetchType: FETCH_ONE
    inputFiles:
      sites.parquet: "{{ outputs.prepare.outputFiles.sites_parquet }}"
      periods.parquet: "{{ outputs.prepare.outputFiles.periods_parquet }}"
      search.json: "{{ outputs.collect_search.uri ?? '{}' }}"
    outputFiles:
      - plan_parquet
    parameters:
      radius: "{{ inputs.search_radius_km }}"
      today: "{{ (trigger.date ?? execution.startDate) | date('yyyy-MM-dd', timeZone='UTC') }}"
      weather_rule: "{{ inputs.heating_base_c }}|{{ inputs.cooling_base_c }}|{{ inputs.temperature_method }}|{{ inputs.fill_missing }}|{{ inputs.max_missing_pct }}"
    sql: |
      SET TimeZone = 'UTC';
      CREATE TABLE sites AS SELECT * FROM read_parquet('sites.parquet');
      CREATE TABLE periods AS SELECT * FROM read_parquet('periods.parquet');
      CREATE TABLE win AS SELECT site_id, min(period_start) AS ws, least(max(period_end), CAST(:today AS DATE)) AS we FROM periods GROUP BY site_id;

      CREATE TABLE cand AS
      SELECT s->>'id' AS station_id, s->>'name' AS station_name,
             CAST(r->>'$.location.coordinates[1]' AS DOUBLE) AS lat, CAST(r->>'$.location.coordinates[0]' AS DOUBLE) AS lon,
             (SELECT count(*) FROM unnest(from_json(s->'dataTypes', '["JSON"]')) AS t(dt) WHERE dt->>'id' IN ('TMAX', 'TMIN')) AS temp_types,
             (SELECT max(CAST(left(dt->>'startDate', 10) AS DATE)) FROM unnest(from_json(s->'dataTypes', '["JSON"]')) AS t(dt) WHERE dt->>'id' IN ('TMAX', 'TMIN')) AS temp_start,
             (SELECT min(CAST(left(dt->>'endDate', 10) AS DATE)) FROM unnest(from_json(s->'dataTypes', '["JSON"]')) AS t(dt) WHERE dt->>'id' IN ('TMAX', 'TMIN')) AS temp_end
      FROM (SELECT unnest(from_json(coalesce(json->'results', CAST('[]' AS JSON)), '["JSON"]')) AS r FROM read_json_objects('search.json', format = 'auto')) AS res,
           unnest(from_json(r->'stations', '["JSON"]')) AS st(s);

      CREATE TABLE nearest AS
      SELECT site_id, station_id, station_name, round(dist, 1) AS distance_km FROM (
        SELECT s.site_id, c.station_id, c.station_name,
               2 * 6371 * asin(sqrt(pow(sin(radians(c.lat - s.latitude) / 2), 2) + cos(radians(s.latitude)) * cos(radians(c.lat)) * pow(sin(radians(c.lon - s.longitude) / 2), 2))) AS dist
        FROM sites s JOIN win w USING (site_id) CROSS JOIN cand c
        WHERE s.station_id IS NULL AND c.temp_types = 2 AND c.temp_start <= w.ws AND c.temp_end >= w.we - 10)
      WHERE dist <= CAST(:radius AS DOUBLE)
      QUALIFY row_number() OVER (PARTITION BY site_id ORDER BY dist) = 1;

      CREATE TABLE plan AS
      SELECT p.*, s.site_name, s.latitude, s.longitude, s.station_source,
             coalesce(s.station_id, n.station_id) AS station_id, coalesce(s.station_name, n.station_name) AS station_name,
             coalesce(s.distance_km, n.distance_km) AS distance_km,
             coalesce(s.station_id, n.station_id) || '|' || :weather_rule AS weather_key,
             weather_key IS NULL OR p.prev_weather_key IS DISTINCT FROM weather_key OR p.prev_weather_status IN ('WEATHER_PENDING', 'NO_WEATHER', 'NO_STATION') AS needs_weather
      FROM periods p JOIN sites s USING (site_id) LEFT JOIN nearest n USING (site_id);

      COPY plan TO '{{ outputFiles.plan_parquet }}' (FORMAT PARQUET);

      SELECT
        (SELECT count(*) FROM cand) AS candidate_stations,
        (SELECT coalesce(string_agg(site_id || ' -> ' || station_id || ' ' || station_name || ' (' || distance_km || ' km)', '; '), '') FROM nearest) AS resolved,
        (SELECT coalesce(string_agg(DISTINCT site_id, ', '), '') FROM plan WHERE station_id IS NULL) AS no_station_sites,
        (SELECT count(*) FROM plan WHERE needs_weather) AS periods_needing_weather,
        (SELECT coalesce(string_agg(DISTINCT station_id, ','), '') FROM plan WHERE needs_weather AND station_id IS NOT NULL) AS stations,
        (SELECT strftime(min(period_start), '%Y-%m-%d') FROM plan WHERE needs_weather AND station_id IS NOT NULL) AS window_start,
        (SELECT strftime(least(max(period_end), CAST(:today AS DATE)), '%Y-%m-%d') FROM plan WHERE needs_weather AND station_id IS NOT NULL) AS window_end;

  - id: fetch_weather
    type: io.kestra.plugin.core.http.Download
    description: |
      One Access Data Service request for every station and the whole window that needs weather. Missing days are
      simply absent from the response and unknown station ids return no rows, so one bad id cannot fail the batch.
    runIf: "{{ outputs.plan.outputs[0].row.stations is not empty }}"
    uri: https://www.ncei.noaa.gov/access/services/data/v1
    params:
      dataset: daily-summaries
      stations: "{{ outputs.plan.outputs[0].row.stations }}"
      dataTypes: TMAX,TMIN,TAVG
      startDate: "{{ outputs.plan.outputs[0].row.window_start }}"
      endDate: "{{ outputs.plan.outputs[0].row.window_end }}"
      units: metric
      format: json
      includeStationName: "true"
    headers:
      User-Agent: "kestra-ncei-degree-day-energy-normalizer/1.0 (https://kestra.io)"
    retry:
      type: exponential
      interval: PT10S
      maxInterval: PT2M
      maxAttempts: 4

  - id: evaluate
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: |
      Daily mean temperature, HDD and CDD per billing period with missing-day accounting, then a per-site model of
      kWh/day on HDD/day and CDD/day. Four candidate models (mean only, HDD, CDD, HDD+CDD) are fitted with
      `regr_slope`/`regr_intercept` and, for two variables, the same least-squares solution from `covar_pop`; models
      with a negative slope are rejected and the best adjusted R2 wins. The fit runs twice: periods off by more than
      `deviation_pct` in the first pass are left out of the second, so one fault does not bend its own baseline.
    url: "jdbc:duckdb:"
    fetchType: FETCH_ONE
    inputFiles:
      plan.parquet: "{{ outputs.plan.outputFiles.plan_parquet }}"
      history.parquet: "{{ outputs.history_pointer.value ?? outputs.empty_history.outputFiles.history_parquet }}"
      weather.json: "{{ outputs.fetch_weather.uri ?? '[]' }}"
    outputFiles:
      - history_parquet
      - periods_csv
      - models_csv
    parameters:
      hb: "{{ inputs.heating_base_c }}"
      cb: "{{ inputs.cooling_base_c }}"
      method: "{{ inputs.temperature_method }}"
      fill: "{{ inputs.fill_missing }}"
      max_missing: "{{ inputs.max_missing_pct }}"
      dev: "{{ inputs.deviation_pct }}"
      min_months: "{{ inputs.min_months }}"
      max_cv: "{{ inputs.max_cv_rmse_pct }}"
      run_at: "{{ execution.startDate }}"
    sql: |
      SET TimeZone = 'UTC';
      CREATE TABLE plan AS SELECT * FROM read_parquet('plan.parquet');
      CREATE TABLE history AS SELECT * FROM read_parquet('history.parquet');

      CREATE TABLE daily AS
      SELECT station_id, d, name, CASE WHEN :method = 'TAVG' THEN coalesce(tavg, mid) ELSE coalesce(mid, tavg) END AS tmean
      FROM (SELECT r->>'STATION' AS station_id, CAST(r->>'DATE' AS DATE) AS d, r->>'NAME' AS name,
                   TRY_CAST(r->>'TMAX' AS DOUBLE) AS tmax, TRY_CAST(r->>'TMIN' AS DOUBLE) AS tmin, TRY_CAST(r->>'TAVG' AS DOUBLE) AS tavg,
                   CASE WHEN tmax >= tmin THEN (tmax + tmin) / 2 END AS mid
            FROM (SELECT unnest(from_json(content, '["JSON"]')) AS r FROM read_text('weather.json')));

      CREATE TABLE station_last AS SELECT station_id, max(d) FILTER (WHERE tmean IS NOT NULL) AS last_day, any_value(name) AS name FROM daily GROUP BY station_id;

      CREATE TABLE fresh AS
      SELECT p.site_id, p.period_start, count(dl.tmean) AS valid_days,
             sum(greatest(CAST(:hb AS DOUBLE) - dl.tmean, 0)) FILTER (WHERE dl.tmean IS NOT NULL) AS hdd_raw,
             sum(greatest(dl.tmean - CAST(:cb AS DOUBLE), 0)) FILTER (WHERE dl.tmean IS NOT NULL) AS cdd_raw
      FROM plan p LEFT JOIN daily dl ON dl.station_id = p.station_id AND dl.d BETWEEN p.period_start AND p.period_end
      WHERE p.needs_weather GROUP BY p.site_id, p.period_start;

      CREATE TABLE wx AS
      SELECT p.*, coalesce(p.station_name, sl.name, p.prev_station_name) AS station_label,
             CASE WHEN NOT p.needs_weather THEN p.prev_weather_status
                  WHEN p.station_id IS NULL THEN 'NO_STATION'
                  WHEN sl.last_day IS NULL THEN 'NO_WEATHER'
                  WHEN p.period_end > sl.last_day THEN 'WEATHER_PENDING'
                  WHEN f.valid_days = p.days THEN 'COMPLETE'
                  WHEN CAST(:fill AS BOOLEAN) AND f.valid_days > 0 AND (p.days - f.valid_days) * 100.0 / p.days <= CAST(:max_missing AS DOUBLE) THEN 'FILLED'
                  ELSE 'GAPPY' END AS weather_status,
             CASE WHEN p.needs_weather THEN coalesce(f.valid_days, 0) ELSE p.prev_valid_days END AS valid_days,
             CASE WHEN NOT p.needs_weather THEN p.prev_hdd WHEN weather_status IN ('COMPLETE', 'FILLED') THEN f.hdd_raw * p.days / f.valid_days END AS hdd,
             CASE WHEN NOT p.needs_weather THEN p.prev_cdd WHEN weather_status IN ('COMPLETE', 'FILLED') THEN f.cdd_raw * p.days / f.valid_days END AS cdd
      FROM plan p LEFT JOIN fresh f USING (site_id, period_start) LEFT JOIN station_last sl ON sl.station_id = p.station_id;

      CREATE TABLE excluded (site_id VARCHAR, period_start DATE);
      CREATE VIEW train AS
      SELECT site_id, period_start, energy_kwh / days AS y, hdd / days AS x1, cdd / days AS x2 FROM wx
      WHERE weather_status IN ('COMPLETE', 'FILLED') AND NOT estimated AND NOT EXISTS (SELECT 1 FROM excluded e WHERE e.site_id = wx.site_id AND e.period_start = wx.period_start);
      CREATE VIEW fits AS
      WITH s AS (
        SELECT site_id, count(*) AS n, avg(y) AS my, avg(x1) AS m1, avg(x2) AS m2, var_pop(x1) AS s11, var_pop(x2) AS s22,
               covar_pop(x1, x2) AS s12, covar_pop(x1, y) AS s1y, covar_pop(x2, y) AS s2y, var_pop(y) AS syy,
               regr_slope(y, x1) AS h_b, regr_intercept(y, x1) AS h_a, coalesce(regr_r2(y, x1), 0) AS h_r2,
               regr_slope(y, x2) AS c_b, regr_intercept(y, x2) AS c_a, coalesce(regr_r2(y, x2), 0) AS c_r2
        FROM train GROUP BY site_id),
      j AS (SELECT *, s11 * s22 - s12 * s12 AS det, (s22 * s1y - s12 * s2y) / nullif(det, 0) AS bh, (s11 * s2y - s12 * s1y) / nullif(det, 0) AS bc FROM s),
      c AS (
        SELECT site_id, n, 'BASELOAD' AS model, my AS a, 0.0 AS bh, 0.0 AS bc, 0.0 AS r2, 0 AS p FROM s
        UNION ALL SELECT site_id, n, 'HDD', h_a, h_b, 0.0, h_r2, 1 FROM s WHERE h_b > 0
        UNION ALL SELECT site_id, n, 'CDD', c_a, 0.0, c_b, c_r2, 1 FROM s WHERE c_b > 0
        UNION ALL SELECT site_id, n, 'HDD+CDD', my - bh * m1 - bc * m2, bh, bc, (bh * s1y + bc * s2y) / nullif(syy, 0), 2 FROM j WHERE det > 1e-9 AND bh > 0 AND bc > 0)
      SELECT *, 1 - (1 - coalesce(r2, 0)) * (n - 1) / greatest(n - p - 1, 1) AS adj_r2 FROM c
      QUALIFY row_number() OVER (PARTITION BY site_id ORDER BY adj_r2 DESC, p) = 1;

      CREATE TABLE fit1 AS SELECT * FROM fits;
      INSERT INTO excluded
      SELECT t.site_id, t.period_start FROM train t JOIN fit1 f USING (site_id)
      WHERE abs(t.y / nullif(f.a + f.bh * t.x1 + f.bc * t.x2, 0) - 1) * 100 > CAST(:dev AS DOUBLE);

      CREATE TABLE models AS
      SELECT f.site_id, f.model, f.n AS months_used, (SELECT count(*) FROM excluded e WHERE e.site_id = f.site_id) AS months_excluded,
             round(f.a, 1) AS baseload_kwh_per_day, round(f.bh, 2) AS kwh_per_hdd, round(f.bc, 2) AS kwh_per_cdd, round(f.r2, 3) AS r2,
             round(sqrt(sum(pow(t.y - (f.a + f.bh * t.x1 + f.bc * t.x2), 2)) / greatest(f.n - f.p - 1, 1)) / avg(t.y) * 100, 1) AS cv_rmse_pct,
             f.n >= CAST(:min_months AS INTEGER) AND cv_rmse_pct <= CAST(:max_cv AS DOUBLE) AS model_ok,
             f.a AS a, f.bh AS bh, f.bc AS bc
      FROM fits f JOIN train t USING (site_id)
      GROUP BY f.site_id, f.model, f.n, f.p, f.a, f.bh, f.bc, f.r2;

      CREATE TABLE scored AS
      SELECT w.*, m.model, CASE WHEN w.weather_status IN ('COMPLETE', 'FILLED') THEN round(m.a * w.days + m.bh * w.hdd + m.bc * w.cdd) END AS expected_kwh,
             round((w.energy_kwh - expected_kwh) / nullif(expected_kwh, 0) * 100, 1) AS deviation_pct,
             CASE WHEN w.weather_status NOT IN ('COMPLETE', 'FILLED') THEN w.weather_status
                  WHEN m.site_id IS NULL OR NOT m.model_ok THEN 'NO_MODEL'
                  WHEN w.estimated THEN 'ESTIMATED_READ'
                  WHEN deviation_pct > CAST(:dev AS DOUBLE) THEN 'HIGH'
                  WHEN deviation_pct < -CAST(:dev AS DOUBLE) THEN 'LOW'
                  ELSE 'NORMAL' END AS flag,
             flag IN ('HIGH', 'LOW') AND NOT w.prev_alerted AS new_anomaly
      FROM wx w LEFT JOIN models m USING (site_id);

      COPY (
        SELECT site_id, site_name, period_start, period_end, CAST(days AS INTEGER) AS days, energy_kwh, estimated, station_id, station_label AS station_name,
               station_source, distance_km, latitude, longitude, weather_key, weather_status, CAST(valid_days AS INTEGER) AS valid_days,
               CASE WHEN weather_status IN ('COMPLETE', 'FILLED', 'GAPPY') THEN CAST(days - valid_days AS INTEGER) END AS missing_days, hdd, cdd, model, expected_kwh, deviation_pct, flag,
               prev_alerted OR flag IN ('HIGH', 'LOW') AS alerted, CAST(:run_at AS TIMESTAMP) AS evaluated_at
        FROM scored
        UNION ALL BY NAME
        SELECT * FROM history WHERE site_id NOT IN (SELECT site_id FROM plan)
      ) TO '{{ outputFiles.history_parquet }}' (FORMAT PARQUET);

      COPY (SELECT site_id, site_name, period_start, period_end, days, energy_kwh, estimated, station_id, station_label AS station_name, distance_km,
                   weather_status, CASE WHEN weather_status IN ('COMPLETE', 'FILLED', 'GAPPY') THEN days - valid_days END AS missing_days, round(hdd, 1) AS hdd, round(cdd, 1) AS cdd, model, expected_kwh, deviation_pct, flag, new_anomaly
            FROM scored ORDER BY site_id, period_start) TO '{{ outputFiles.periods_csv }}' (HEADER, DELIMITER ',');
      COPY (SELECT * EXCLUDE (a, bh, bc) FROM models ORDER BY site_id) TO '{{ outputFiles.models_csv }}' (HEADER, DELIMITER ',');

      CREATE TABLE alerts AS SELECT * FROM scored WHERE new_anomaly ORDER BY abs(deviation_pct) DESC;

      SELECT
        (SELECT count(*) FROM scored) AS periods,
        (SELECT count(*) FROM plan WHERE needs_weather AND station_id IS NOT NULL) AS periods_weather_fetched,
        (SELECT count(*) FROM daily) AS weather_rows,
        (SELECT string_agg(weather_status || ' ' || n, ', ' ORDER BY weather_status) FROM (SELECT weather_status, count(*) AS n FROM scored GROUP BY ALL)) AS weather_statuses,
        (SELECT coalesce(sum(days - valid_days) FILTER (WHERE weather_status IN ('FILLED', 'GAPPY')), 0) FROM scored) AS missing_days,
        (SELECT string_agg(site_id || ' ' || model || ' R2 ' || r2 || ' CV ' || cv_rmse_pct || '%' || CASE WHEN model_ok THEN '' ELSE ' (NO_MODEL)' END, '; ' ORDER BY site_id) FROM models) AS models,
        (SELECT count(*) FROM scored WHERE flag IN ('HIGH', 'LOW')) AS anomalies,
        (SELECT count(*) FROM alerts) AS new_anomalies,
        (SELECT coalesce(string_agg(chr(10) || '- ' || site_name || ' (' || site_id || ') ' || strftime(period_start, '%Y-%m-%d') || ' to ' || strftime(period_end, '%Y-%m-%d')
                  || ' ' || flag || ' ' || deviation_pct || '%, ' || CAST(energy_kwh AS BIGINT) || ' kWh vs ' || CAST(expected_kwh AS BIGINT) || ' expected (HDD '
                  || round(hdd) || ', CDD ' || round(cdd) || ', ' || model || ', ' || station_label || ')', ''), '') FROM alerts) AS alert_list;

  - id: save_history
    type: io.kestra.plugin.core.kv.Set
    key: "{{ inputs.state_key }}"
    value: "{{ outputs.evaluate.outputFiles.history_parquet }}"
    description: Points the KV key at the new Parquet history. The file stays in this execution's storage, so keep executions (or copy the file to object storage) for as long as you need the baseline.

  - id: report
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.evaluate.outputs[0].row.new_anomalies > 0 }}"
    then:
      - id: log_anomalies
        type: io.kestra.plugin.core.log.Log
        level: WARN
        message: "{{ outputs.evaluate.outputs[0].row.new_anomalies }} new weather-normalised anomalies:{{ outputs.evaluate.outputs[0].row.alert_list }}"

      - id: notify
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        allowFailure: true
        description: allowFailure keeps the run green when the webhook secret is not set; the anomalies are still in the WARN log and the CSV.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {"text": {{ ('*' ~ outputs.evaluate.outputs[0].row.new_anomalies ~ ' new weather-normalised energy anomalies* (threshold ' ~ inputs.deviation_pct ~ '%, <' ~ (kestra.url ?? '') ~ '/ui/executions/' ~ flow.namespace ~ '/' ~ flow.id ~ '/' ~ execution.id ~ '|execution>)' ~ outputs.evaluate.outputs[0].row.alert_list) | toJson }}}
    else:
      - id: nothing_new
        type: io.kestra.plugin.core.log.Log
        message: "No new anomalies ({{ outputs.evaluate.outputs[0].row.anomalies }} flagged periods were already reported)."

  - id: warn_inputs
    type: io.kestra.plugin.core.log.Log
    runIf: "{{ outputs.prepare.outputs[0].row.invalid_rows > 0 or outputs.plan.outputs[0].row.no_station_sites is not empty }}"
    level: WARN
    message: "Skipped input rows: {{ outputs.prepare.outputs[0].row.invalid_list }}. Sites without a station: {{ outputs.plan.outputs[0].row.no_station_sites }}"

  - id: summary
    type: io.kestra.plugin.core.log.Log
    message: |
      {{ outputs.prepare.outputs[0].row.is_baseline ? 'BASELINE run. ' : '' }}{{ outputs.prepare.outputs[0].row.sites }} sites, {{ outputs.evaluate.outputs[0].row.periods }} billing periods ({{ outputs.prepare.outputs[0].row.readings_loaded }} from readings, {{ outputs.prepare.outputs[0].row.periods_from_history }} from history).
      Stations found by search: {{ outputs.plan.outputs[0].row.resolved ?? '' }}
      Weather fetched for {{ outputs.evaluate.outputs[0].row.periods_weather_fetched }} periods ({{ outputs.evaluate.outputs[0].row.weather_rows }} station-days from NCEI). Weather status: {{ outputs.evaluate.outputs[0].row.weather_statuses }}; {{ outputs.evaluate.outputs[0].row.missing_days }} missing days in filled or gappy periods.
      Models: {{ outputs.evaluate.outputs[0].row.models }}
      Flagged periods: {{ outputs.evaluate.outputs[0].row.anomalies }}, new: {{ outputs.evaluate.outputs[0].row.new_anomalies }}.

outputs:
  - id: summary
    type: JSON
    value: "{{ outputs.evaluate.outputs[0].row }}"
  - id: periods_csv
    type: FILE
    value: "{{ outputs.evaluate.outputFiles.periods_csv }}"
  - id: models_csv
    type: FILE
    value: "{{ outputs.evaluate.outputFiles.models_csv }}"

extend:
  title: Weather-Normalise Building Energy Use with NOAA NCEI Degree Days and Flag Anomalies
  metaTitle: NCEI Degree Day Energy Normalisation with DuckDB and Slack | Kestra
  shortDescription: Match each building to a GHCN-Daily station, pull daily temperatures from the keyless NOAA NCEI Access Data Service in one request, compute heating and cooling degree days per billing period in DuckDB with gap handling, fit a per-site regression and alert in Slack when a month's energy use deviates from the weather-expected value.
  metaDescription: Monthly NOAA NCEI degree day normalisation of building energy with DuckDB regression, gap handling, Parquet history, CSV outputs and Slack anomaly alerts.
  description: |
    A building that used 20 percent more electricity than last July may just have had a hotter July. Energy and ESG teams separate weather from performance by regressing energy on heating and cooling degree days (HDD, CDD), as in ASHRAE Guideline 14. This flow does it monthly for a portfolio with keyless NOAA NCEI data and flags the billing periods the weather does not explain.

    ## How it works

    1. A monthly `Schedule` (6th, 07:00 UTC, after GHCN-Daily's three-to-five-day lag) starts the run. `history_pointer` (KV Get) reads the URI of the Parquet history; `bootstrap` (If) writes an empty one on the first run.
    2. `prepare` (DuckDB) validates the `sites` CSV (11-character GHCN-Daily id, or latitude and longitude) and the readings (`readings` text or an uploaded `readings_file`), skipping bad rows with a reason. Uploaded periods replace stored ones, so a monthly file can hold only the latest bills.
    3. Sites with only coordinates get a station once: `search_stations` (Loop) queries the NCEI Search Service around each, and `plan` picks the nearest station with TMAX and TMIN over the whole window (the search also returns closed stations). The choice is kept in the history.
    4. `plan` lists the periods that need weather (new, `WEATHER_PENDING`, or computed with another station or rule) and `fetch_weather` gets them in one Access Data Service request for all stations. Unknown ids return no rows, so one typo cannot fail the batch.
    5. `evaluate` (DuckDB) takes the daily mean as `(TMAX+TMIN)/2` (or `TAVG` first), sums HDD and CDD per billing period and counts missing days: `COMPLETE`, `FILLED` (scaled up when `fill_missing` is on and at most `max_missing_pct` is missing), `GAPPY`, `WEATHER_PENDING`, `NO_WEATHER` or `NO_STATION`.
    6. Per site it fits kWh/day on HDD/day and CDD/day: baseload, HDD or CDD (`regr_slope`/`regr_intercept`) and HDD+CDD (least squares from `covar_pop`), rejects negative slopes and keeps the best adjusted R2. A second pass leaves out periods off by more than `deviation_pct`, so a fault does not bend its own baseline. Fewer than `min_months` periods or CV(RMSE) above `max_cv_rmse_pct` means `NO_MODEL`.
    7. Periods are flagged `HIGH`, `LOW`, `NORMAL` or `ESTIMATED_READ` (never fitted or flagged); each anomaly is reported once. `save_history` (KV Set) stores the new Parquet URI, and `report` (If) logs new anomalies at WARN and posts them to Slack with `allowFailure`.

    ## What you get

    - `periods_csv`: per site and billing period, the station, weather status, missing days, HDD, CDD, expected kWh, deviation and flag.
    - `models_csv`: per site, the model, months used and left out, baseload kWh/day, kWh per HDD and CDD, R2 and CV(RMSE).
    - One Slack message with only the new anomalies; re-runs fetch only pending weather.

    ## Who it's for

    - Facilities and energy managers reviewing monthly utility bills.
    - ESG teams preparing weather-normalised energy figures.
    - Engineers doing measurement and verification of retrofits.

    ## Why orchestrate this with Kestra

    - Degree days, gap rules and the regression are readable SQL that the people who sign off the numbers can audit.
    - KV plus Parquet hold history and station choices without a database.
    - `Loop`, `If` and `runIf` skip the station search and weather request when not needed; retries cover NCEI's occasional 5xx.
    - A FILE input lets an analyst upload bills from the UI while the schedule keeps the monthly rhythm.

    ## Prerequisites

    - Kestra 2.0 with the JDBC DuckDB and Slack plugins, and HTTPS to `www.ncei.noaa.gov` (no token needed).
    - Monthly readings. The defaults are sample meter data for three sites with a chiller fault at CHI-HQ in July 2026, an under-reading meter at MSP-WH and one estimated read.
    - The Parquet history lives in the storage of the execution that wrote it; keep executions long enough or copy it to object storage.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack incoming webhook for anomalies (optional; without it `notify` warns and the run still succeeds).

    ## Quick start

    1. Execute with the defaults. The BASELINE matches SEA-LAB to Renton Municipal Airport (0.8 km), whose mid-2025 gaps give two `GAPPY` and two `FILLED` periods, leaves the last MSP-WH period `WEATHER_PENDING`, and reports CHI-HQ July 2026 `HIGH` and MSP-WH January 2026 `LOW`.
    2. Execute again: only the pending period is fetched and nothing new is reported.
    3. Delete the KV key `ncei_degree_day_history`, set `fill_missing` to false and run: filled periods turn `GAPPY` and SEA-LAB drops to `NO_MODEL`.
    4. Put in your sites and readings, add `SLACK_WEBHOOK_URL` and keep the schedule.

    ## How to extend

    - Pull readings from your energy management system or a utility API instead of a CSV.
    - Copy the Parquet history to S3, GCS or Azure Blob so the baseline outlives execution purging.
    - Freeze the model on a pre-retrofit year and report avoided energy for M&V.

    ## Links

    - [NCEI Access Data Service](https://www.ncei.noaa.gov/support/access-data-service-api-user-documentation) and [Search Service](https://www.ncei.noaa.gov/support/access-search-service-api-user-documentation)
    - [GHCN-Daily](https://www.ncei.noaa.gov/products/land-based-station/global-historical-climatology-network-daily)
    - [DuckDB Queries](https://kestra.io/plugins/plugin-jdbc-duckdb/io.kestra.plugin.jdbc.duckdb.queries) and [DuckDB aggregates](https://duckdb.org/docs/stable/sql/functions/aggregates)
    - [HTTP Download](https://kestra.io/plugins/core/http/io.kestra.plugin.core.http.download), [Loop](https://kestra.io/plugins/core/flow/io.kestra.plugin.core.flow.loop), [If](https://kestra.io/plugins/core/flow/io.kestra.plugin.core.flow.if), [KV Store](https://kestra.io/docs/concepts/kv-store)
    - [Slack Incoming Webhook](https://kestra.io/plugins/plugin-notifications/slack/io.kestra.plugin.slack.notifications.slackincomingwebhook)
  tags:
    - Data
  subTags:
    - Monitoring & Alerting
    - Testing & Quality
    - Day 2 Operations
  ee: false
  demo: false
