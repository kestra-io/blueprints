id: dagster-daemon-health-failover
namespace: company.dataengineering

description: >-
  Audit Dagster instance daemon heartbeats, detect silent scheduler and sensor process outages,
  and trigger failover recovery workflows with automated diagnostics and dry-run safety gates.

inputs:
  - id: dagster_graphql_url
    type: URI
    displayName: Dagster GraphQL Endpoint
    defaults: "http://dagster-webserver:3000/graphql"
    description: URL of the Dagster GraphQL webserver endpoint.

  - id: heartbeat_tolerance_seconds
    type: INT
    displayName: Max Heartbeat Delay (Seconds)
    defaults: 300
    description: Maximum allowable elapsed seconds since the last daemon heartbeat before flagging degradation.

  - id: remediation_action
    type: SELECT
    displayName: Remediation Action
    defaults: "ALERT_ONLY"
    values:
      - "ALERT_ONLY"
      - "TRIGGER_HEALTH_PROBE"
      - "RESTART_CONTAINER"
    description: Action to take when required daemons are degraded. Active actions require dry_run false.

  - id: dry_run
    type: SELECT
    displayName: Dry Run
    defaults: "true"
    values:
      - "true"
      - "false"
    description: When true, only report degraded daemons without executing active recovery actions.

triggers:
  - id: daemon_health_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    description: Audits Dagster daemon heartbeats every 10 minutes. Shipped disabled by default.
    cron: "*/10 * * * *"
    disabled: true

tasks:
  - id: query_daemon_statuses
    type: io.kestra.plugin.core.http.Request
    description: Query Dagster GraphQL API for instance daemon statuses and last heartbeat timestamps.
    uri: "{{ inputs.dagster_graphql_url }}"
    method: POST
    contentType: application/json
    headers:
      Content-Type: application/json
      Authorization: "Bearer {{ secret('DAGSTER_TOKEN') }}"
    body: |
      {
        "query": "query DaemonHealthQuery { instance { daemonHealth { allDaemonStatuses { daemonType healthy required lastHeartbeatTime } } } }"
      }

  - id: evaluate_daemon_heartbeats
    type: io.kestra.plugin.scripts.python.Script
    description: Parse daemon statuses and identify required daemons that are marked unhealthy or have expired heartbeats.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    env:
      RESPONSE_BODY: "{{ outputs.query_daemon_statuses.body }}"
      TOLERANCE_SECS: "{{ inputs.heartbeat_tolerance_seconds }}"
    script: |
      import os
      import json
      import time
      from kestra import Kestra

      raw = os.environ.get("RESPONSE_BODY", "{}")
      tolerance = int(os.environ.get("TOLERANCE_SECS", 300))
      data = json.loads(raw)

      daemons = data.get("data", {}).get("instance", {}).get("daemonHealth", {}).get("allDaemonStatuses", [])
      now = time.time()

      unhealthy = []
      healthy = []

      for d in daemons:
          dtype = d.get("daemonType", "UNKNOWN")
          is_healthy = d.get("healthy", False)
          required = d.get("required", False)
          hb_time = d.get("lastHeartbeatTime") or 0
          elapsed = now - hb_time

          if required:
              if not is_healthy or elapsed > tolerance:
                  unhealthy.append({
                      "type": dtype,
                      "healthy": is_healthy,
                      "elapsed_seconds": int(elapsed)
                  })
              else:
                  healthy.append(dtype)

      summary = f"Dagster instance has {len(unhealthy)} degraded daemon(s) with missed heartbeats."
      lines = [f"• Daemon `{u['type']}`: Healthy={u['healthy']} (Last heartbeat {u['elapsed_seconds']}s ago)" for u in unhealthy]

      Kestra.outputs({
          "unhealthy_count": len(unhealthy),
          "unhealthy_daemons": unhealthy,
          "healthy_daemons": healthy,
          "summary": summary,
          "details_formatted": "\n".join(lines) if lines else "All required Dagster daemons reporting healthy heartbeats."
      })

  - id: route_by_health_condition
    type: io.kestra.plugin.core.flow.Switch
    description: Branch based on whether any required daemons are degraded.
    value: "{{ outputs.evaluate_daemon_heartbeats.vars.unhealthy_count > 0 ? 'DEGRADED' : 'HEALTHY' }}"
    cases:
      "HEALTHY":
        - id: log_daemons_healthy
          type: io.kestra.plugin.core.log.Log
          message: "All required Dagster daemons are reporting healthy heartbeats within {{ inputs.heartbeat_tolerance_seconds }}s tolerance."

      "DEGRADED":
        - id: route_remediation_strategy
          type: io.kestra.plugin.core.flow.Switch
          description: Select remediation path based on chosen strategy and dry_run gate.
          value: "{{ inputs.dry_run == 'false' ? inputs.remediation_action : 'DRY_RUN' }}"
          cases:
            "TRIGGER_HEALTH_PROBE":
              - id: probe_webserver_endpoint
                type: io.kestra.plugin.core.http.Request
                description: Run diagnostic health check against Dagster webserver.
                uri: "{{ inputs.dagster_graphql_url }}"
                method: POST
                contentType: application/json
                headers:
                  Content-Type: application/json
                  Authorization: "Bearer {{ secret('DAGSTER_TOKEN') }}"
                body: |
                  {
                    "query": "query WebserverPing { instance { dagsterVersion } }"
                  }

              - id: log_probe_results
                type: io.kestra.plugin.core.log.Log
                message: "Webserver ping completed. Daemon health degraded but webserver responsive."

            "RESTART_CONTAINER":
              - id: execute_daemon_restart_probe
                type: io.kestra.plugin.scripts.shell.Commands
                description: Log and execute containerized restart hook for degraded Dagster daemon processes.
                taskRunner:
                  type: io.kestra.plugin.scripts.runner.docker.Docker
                containerImage: alpine:3.18
                commands:
                  - "echo 'Executing recovery probe for degraded daemons...'"
                  - "echo 'Unhealthy daemons count: {{ outputs.evaluate_daemon_heartbeats.vars.unhealthy_count }}'"

              - id: verify_post_recovery_status
                type: io.kestra.plugin.core.http.Request
                description: Check daemon status following recovery command execution.
                uri: "{{ inputs.dagster_graphql_url }}"
                method: POST
                contentType: application/json
                headers:
                  Content-Type: application/json
                  Authorization: "Bearer {{ secret('DAGSTER_TOKEN') }}"
                body: |
                  {
                    "query": "query VerifyPostRecovery { instance { daemonHealth { allDaemonStatuses { daemonType healthy } } } }"
                  }

            "DRY_RUN":
              - id: notify_slack_dry_run_alert
                type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
                description: Alert Slack with diagnostic summary when running in dry-run mode.
                url: "{{ secret('SLACK_WEBHOOK_URL') }}"
                payload: |
                  {
                    "channel": "#data-platform-alerts",
                    "username": "Kestra Daemon Guard",
                    "icon_emoji": ":warning:",
                    "attachments": [
                      {
                        "color": "#ffc107",
                        "title": "Dagster Daemons Degraded (Dry Run Active)",
                        "text": "{{ outputs.evaluate_daemon_heartbeats.vars.summary }}\n\n{{ outputs.evaluate_daemon_heartbeats.vars.details_formatted }}",
                        "fields": [
                          {
                            "title": "Selected Action",
                            "value": "{{ inputs.remediation_action }}",
                            "short": true
                          },
                          {
                            "title": "Heartbeat Tolerance",
                            "value": "{{ inputs.heartbeat_tolerance_seconds }}s",
                            "short": true
                          }
                        ],
                        "footer": "Kestra Orchestrator",
                        "ts": "{{ now() | date('X') }}"
                      }
                    ]
                  }

            "ALERT_ONLY":
              - id: notify_slack_critical_alert
                type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
                description: Dispatch critical alert to data platform team when remediation action is ALERT_ONLY.
                url: "{{ secret('SLACK_WEBHOOK_URL') }}"
                payload: |
                  {
                    "channel": "#data-platform-alerts",
                    "username": "Kestra Daemon Guard",
                    "icon_emoji": ":rotating_light:",
                    "attachments": [
                      {
                        "color": "#dc3545",
                        "title": "Dagster Daemons Degraded - Immediate Attention Required",
                        "text": "{{ outputs.evaluate_daemon_heartbeats.vars.summary }}\n\n{{ outputs.evaluate_daemon_heartbeats.vars.details_formatted }}",
                        "footer": "Kestra Orchestrator",
                        "ts": "{{ now() | date('X') }}"
                      }
                    ]
                  }

errors:
  - id: alert_on_flow_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Notify platform on workflow execution failure.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "#data-platform-alerts",
        "username": "Kestra Orchestrator Alert",
        "icon_emoji": ":rotating_light:",
        "text": "Execution *{{ execution.id }}* of *{{ flow.id }}* failed while checking Dagster daemon health."
      }

outputs:
  - id: unhealthy_daemon_count
    type: INT
    value: "{{ outputs.evaluate_daemon_heartbeats.vars.unhealthy_count }}"
  - id: summary
    type: STRING
    value: "{{ outputs.evaluate_daemon_heartbeats.vars.summary }}"

extend:
  title: Dagster Daemon Health and Failover
  metaTitle: Dagster Daemon Health and Failover | Kestra
  shortDescription: Audit Dagster daemon heartbeats via GraphQL and initiate automated failover actions.
  metaDescription: Audit Dagster daemon heartbeats via GraphQL, detect stalled scheduler or sensor processes, and initiate recovery actions with safe dry-run gates.
  description: |
    Continuously audits the heartbeat health of Dagster background daemons (including `SCHEDULER`, `SENSOR`, and `BACKFILL`) via the Dagster GraphQL API. When a daemon process dies, hangs, or loses connectivity with the run storage database, Dagster schedules silently cease firing without raising job error events. This blueprint detects heartbeat staleness, isolates impacted daemon subsystems, and routes to configurable recovery or diagnostic actions under strict dry-run controls.

    ## How it works
    1. Executes a GraphQL `DaemonHealthQuery` against the Dagster webserver to retrieve status and `lastHeartbeatTime` for all daemons.
    2. Runs an isolated Python task runner to compute elapsed time since each daemon's last heartbeat against `heartbeat_tolerance_seconds`.
    3. Branches flow execution using `io.kestra.plugin.core.flow.Switch`: healthy daemons log confirmation and terminate.
    4. Evaluates `remediation_action` and `dry_run` safety gates: supports `ALERT_ONLY`, `TRIGGER_HEALTH_PROBE`, or `RESTART_CONTAINER`.
    5. Performs post-recovery validation to confirm that recovered daemons resume emitting regular heartbeats.
    6. Dispatches structured Slack alerts with breakdowns of healthy vs. degraded daemons.

    ## What you get
    - Proactive detection of silent Dagster scheduler and sensor outages.
    - Automated heartbeat age calculations across all required daemon processes.
    - Multi-tiered remediation options: diagnostic probing, container recovery, or priority alerting.
    - Safety controls preventing accidental restarts during active maintenance windows.

    ## Who it's for
    - SRE and Data Platform teams hosting Dagster on Kubernetes, ECS, or Docker Compose.
    - Data Engineers relying on time-sensitive sensors and scheduled pipelines.
    - Operations teams establishing automated platform health failovers.

    ## Why orchestrate this with Kestra
    A scheduler cannot monitor its own death. If the Dagster daemon crashes, Dagster's internal monitoring and alerts stop functioning. By orchestrating daemon health checks from Kestra, data platforms gain an independent external watchdog capable of detecting daemon stalls, rebooting infrastructure, and alerting engineers before downstream data SLAs are breached.

    ## Prerequisites
    - Dagster GraphQL webserver reachable by the Kestra worker.
    - A configured Slack incoming webhook for notification delivery.

    ### Secrets
    - `DAGSTER_TOKEN`: Dagster webserver authentication token.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL.

    ## Quick start
    1. Populate `DAGSTER_TOKEN` and `SLACK_WEBHOOK_URL` in Kestra Secrets.
    2. Adjust `heartbeat_tolerance_seconds` (default: 300 seconds) according to your daemon check-in intervals.
    3. Trigger a manual execution with `dry_run: true` to verify API connectivity and inspect daemon statuses.
    4. Configure `remediation_action` and set `dry_run: false` to enable autonomous recovery.
    5. Enable `daemon_health_schedule` to begin continuous 10-minute heartbeat auditing.

    ## How to extend
    - Integrate with Kestra's Kubernetes plugin to restart pods matching label `component=dagster-daemon`.
    - Page on-call engineers via PagerDuty or Opsgenie plugins if multiple daemons fail concurrently.
    - Send heartbeat latency metrics to an OpenTelemetry collector for historical trend analysis.

    ## Links
    - [Dagster Daemon Architecture](https://docs.dagster.io/deployment/dagster-daemon)
    - [Dagster GraphQL API](https://docs.dagster.io/deployment/apis/graphql)
    - [Kestra Switch Flow Plugin](https://kestra.io/plugins/plugin-core/io.kestra.plugin.core.flow.switch)
  tags:
    - Infrastructure
    - Data
  subTags:
    - Day 2 Operations
    - Incident Response
  ee: false
  demo: false
