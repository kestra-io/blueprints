id: http-security-headers-baseline-audit
namespace: company.team

concurrency:
  limit: 1
  behavior: QUEUE

inputs:
  - id: urls
    type: STRING
    displayName: URLs to Audit
    defaults: "https://github.com,https://example.com"
    description: Comma-separated list of http or https URLs without spaces. The defaults give one site that normally passes the baseline and one that normally fails it.
    validator: '^https?://[^,\s]+(,https?://[^,\s]+)*$'

  - id: min_hsts_max_age_days
    type: INT
    displayName: Minimum HSTS Max-Age (days)
    defaults: 180
    min: 1
    description: Smallest accepted max-age of the Strict-Transport-Security header, in days.

  - id: fail_on_advisory
    type: BOOL
    displayName: Fail on Advisory Findings
    defaults: false
    description: When true, advisory findings (Referrer-Policy, cookie flags, version disclosure) also fail the audit. Critical findings always do.

  - id: max_urls
    type: INT
    displayName: Max URLs per Run
    defaults: 25
    min: 1
    max: 100
    description: Maximum number of URLs audited in one run. Extra URLs are skipped and a warning is logged.

  - id: slack_channel
    type: STRING
    displayName: Slack Alert Channel
    defaults: "#devops-alerts"
    description: Destination channel for the optional Slack notification.
    validator: "^#[a-z0-9_-]+$"

triggers:
  - id: daily_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: Audit the URL list every day at 07:00 UTC. Shipped disabled; enable it once a manual run looks right for your sites.
    cron: "0 7 * * *"
    disabled: true

tasks:
  - id: warn_if_truncated
    type: io.kestra.plugin.core.flow.If
    description: Log a warning when the URL list is longer than max_urls, because the extra URLs are not audited.
    condition: "{{ (inputs.urls | split(',') | length) > inputs.max_urls }}"
    then:
      - id: log_truncated
        type: io.kestra.plugin.core.log.Log
        level: WARN
        message: "{{ inputs.urls | split(',') | length }} URLs were given but only the first {{ inputs.max_urls }} are audited."

  - id: audit_urls
    type: io.kestra.plugin.core.flow.Loop
    description: Audit each URL on its own. An iteration ends FAILED when its URL breaks the baseline, which fails the loop and with it the execution.
    values: "{{ {'urls': inputs.urls, 'max': inputs.max_urls} | jq('.max as $m | (.urls | split(\",\")) | .[:$m]') | first }}"
    concurrencyLimit: 3
    tasks:
      - id: fetch_headers
        type: io.kestra.plugin.core.http.Request
        description: Request the URL and keep the response headers. A 4xx or 5xx answer does not abort the loop, and a network failure is reported as a finding below.
        allowFailure: true
        method: GET
        uri: "{{ item.value }}"
        options:
          allowFailed: true
        headers:
          User-Agent: "Kestra-Security-Headers-Audit"
          Accept: "text/html,*/*"
        retry:
          type: constant
          interval: PT2S
          maxAttempts: 2

      - id: evaluate_headers
        type: io.kestra.plugin.core.output.OutputValues
        description: Compare the response headers with the baseline. Header names are lowercased first because HTTP/1.1 and HTTP/2 differ in case. Returns the critical and advisory findings as JSON.
        values:
          result: >-
            {{ ({'code': (outputs.fetch_headers.code ?? 0), 'headers': (outputs.fetch_headers.headers ?? {}), 'min_age': (inputs.min_hsts_max_age_days * 86400)} | jq('. as $in | ($in.headers | with_entries(.key |= ascii_downcase)) as $h | def one($k): (($h[$k] // [])[0] // ""); (one("strict-transport-security") | ascii_downcase) as $hsts | (one("content-security-policy") | ascii_downcase) as $csp | ($hsts | ([capture("max-age=(?<n>[0-9]+)").n] | first // "0") | tonumber) as $age | {critical: [(if ($in.code < 200 or $in.code >= 400) then "no usable response (HTTP \($in.code))" else empty end), (if $hsts == "" then "missing Strict-Transport-Security" elif $age < $in.min_age then "HSTS max-age \($age)s is below \($in.min_age)s" else empty end), (if $csp == "" then "missing Content-Security-Policy" else empty end), (if (one("x-content-type-options") | ascii_downcase | contains("nosniff")) then empty else "X-Content-Type-Options is not nosniff" end), (if (one("x-frame-options") != "" or ($csp | contains("frame-ancestors"))) then empty else "no clickjacking protection (X-Frame-Options or CSP frame-ancestors)" end)], advisory: ([(if one("referrer-policy") == "" then "missing Referrer-Policy" else empty end), (if (one("server") | test("[0-9]+[.][0-9]+")) then "Server header discloses a version" else empty end), (if one("x-powered-by") != "" then "X-Powered-By header is present" else empty end)] + [($h["set-cookie"] // [])[] | select(((ascii_downcase | contains("secure")) | not) or ((ascii_downcase | contains("httponly")) | not) or ((ascii_downcase | contains("samesite")) | not)) | "cookie \(split("=")[0] | gsub("[^A-Za-z0-9_.-]"; "") | .[:40]) lacks Secure, HttpOnly or SameSite"])}') | first | toJson) }}

      - id: summarize_url
        type: io.kestra.plugin.core.output.OutputValues
        description: Count the findings and build the text for this URL.
        values:
          critical_count: "{{ fromJson(outputs.evaluate_headers.values.result).critical | length }}"
          advisory_count: "{{ fromJson(outputs.evaluate_headers.values.result).advisory | length }}"
          report: |-
            *Security header audit: {{ item.value }}*
            {% for c in fromJson(outputs.evaluate_headers.values.result).critical %}• CRITICAL: {{ c }}
            {% endfor %}{% for a in fromJson(outputs.evaluate_headers.values.result).advisory %}• advisory: {{ a }}
            {% endfor %}

      - id: evaluate_url
        type: io.kestra.plugin.core.flow.If
        description: Fail this iteration when the URL has a critical finding, or an advisory one while fail_on_advisory is true.
        condition: "{{ (outputs.summarize_url.values.critical_count | number) > 0 or (inputs.fail_on_advisory and (outputs.summarize_url.values.advisory_count | number) > 0) }}"
        then:
          - id: send_slack_notification
            type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
            description: Optional Slack message with the findings for this URL. A Slack failure never hides the audit result.
            allowFailure: true
            url: "{{ secret('SLACK_WEBHOOK_URL') }}"
            payload: "{{ {'channel': inputs.slack_channel, 'text': ':warning: ' ~ outputs.summarize_url.values.report} | toJson }}"

          - id: log_findings
            type: io.kestra.plugin.core.log.Log
            level: WARN
            description: Log the findings for this URL.
            message: "{{ outputs.summarize_url.values.report }}"

          - id: fail_url
            type: io.kestra.plugin.core.execution.Fail
            description: End this iteration as FAILED so the baseline violation is visible in monitoring and downstream automation.
            errorMessage: "{{ item.value }} breaks the security header baseline: {{ outputs.summarize_url.values.critical_count }} critical and {{ outputs.summarize_url.values.advisory_count }} advisory finding(s)."
        else:
          - id: log_clean_url
            type: io.kestra.plugin.core.log.Log
            description: Record that the URL meets the baseline.
            message: "{{ item.value }} meets the baseline ({{ outputs.summarize_url.values.advisory_count }} advisory finding(s) ignored)."

extend:
  title: Audit HTTP Security Headers Against a Baseline
  metaTitle: Audit HTTP Security Headers Against a Baseline | Kestra
  shortDescription: Request a list of URLs, check HSTS, CSP, nosniff, framing, cookie flags and version disclosure, then alert on Slack and fail the run when a site breaks the baseline.
  metaDescription: Audit HSTS, CSP, X-Content-Type-Options, clickjacking and cookie flags on a list of URLs. Kestra alerts on Slack and fails the run on violations.
  tags:
    - Infrastructure
  subTags:
    - Policy & Compliance
    - Monitoring & Alerting
  ee: false
  demo: false
  description: |
    Missing security headers are among the cheapest weaknesses to find and the easiest to reintroduce. A proxy change, a CDN migration or a new framework version can drop Strict-Transport-Security or Content-Security-Policy without any test failing. This blueprint checks a list of URLs against a security header baseline on a schedule and fails when a site drifts below it.

    ## How it works

    1. `daily_audit` (`io.kestra.plugin.core.trigger.Schedule`) runs every day at 07:00 UTC. It is shipped disabled, and manual runs use the default inputs.
    2. `warn_if_truncated` logs a warning when more URLs are given than `max_urls`.
    3. `audit_urls` (`io.kestra.plugin.core.flow.Loop`) audits each URL with up to three running at once.
    4. `fetch_headers` (`io.kestra.plugin.core.http.Request`) requests the URL. A bad status or a network error does not abort the loop, it becomes a finding.
    5. `evaluate_headers` lowercases the header names and checks the baseline with jq. Critical checks are Strict-Transport-Security with a minimum max-age, Content-Security-Policy, `X-Content-Type-Options: nosniff` and clickjacking protection. Advisory checks are Referrer-Policy, cookie flags and version disclosure in `Server` or `X-Powered-By`.
    6. `evaluate_url` (`io.kestra.plugin.core.flow.If`) sends a Slack message, logs the findings and ends the iteration with `Fail` when a critical finding exists. With `fail_on_advisory` on, advisory findings count too. Because a failed iteration fails the loop, the execution is `FAILED`.

    ## What you get

    - A per-URL report that names exactly which header is missing or too weak.
    - A `FAILED` execution that monitoring and downstream automation can react to.
    - Unreachable sites reported as failures, not as passes.
    - A baseline you can tighten through inputs and extend by adding checks to the jq expression.

    ## Who it's for

    - Platform and security engineers who own several public sites.
    - Teams that want a header regression check without maintaining a scanner.

    ## Why orchestrate this with Kestra

    A one-off `curl` check tells you today's state. Kestra runs it on a schedule, retries flaky requests, audits sites in parallel, keeps the Slack webhook in a secret and records every result as an execution you can search.

    ## Prerequisites

    - Network access from the Kestra worker to the URLs you audit.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack incoming webhook URL for the optional notifications.

    ## Quick start

    1. Add `SLACK_WEBHOOK_URL` to the namespace secrets, or leave it unset because the Slack task is optional.
    2. Import the blueprint and run it with the default inputs. `example.com` has no security headers, so that iteration and the execution should fail.
    3. Replace `urls` with your own sites and run it again.
    4. Remove `disabled: true` from `daily_audit` to start the daily schedule.

    ## How to extend

    - Add a check for `Permissions-Policy` or `Cross-Origin-Opener-Policy` in the jq expression.
    - Open a ticket for each failing URL with a GitHub, Jira or ServiceNow task after `log_findings`.
    - Read the URL list from a Kestra KV entry or a file in storage instead of an input.

    ## Links

    - [Kestra HTTP Plugin](https://kestra.io/plugins/core/http/io.kestra.plugin.core.http.request)
    - [Kestra Loop Task](https://kestra.io/plugins/core/flow/io.kestra.plugin.core.flow.loop)
    - [Kestra Slack Plugin](https://kestra.io/plugins/plugin-slack)
    - [OWASP Secure Headers Project](https://owasp.org/www-project-secure-headers/)
    - [MDN: Strict-Transport-Security](https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Headers/Strict-Transport-Security)
