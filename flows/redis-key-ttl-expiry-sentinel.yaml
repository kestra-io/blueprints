id: redis-key-ttl-expiry-sentinel
namespace: company.team
description: |
  Read a critical Redis key's TTL and alert when it has no expiry, is
  missing entirely, or is about to expire sooner than a safety threshold.
  auto_remediate, gated independently by dry_run, re-applies a safe TTL with
  EXPIRE - the key's value is never touched.

triggers:
  - id: periodic_ttl_check
    type: io.kestra.plugin.core.trigger.Schedule
    description: Check every 15 minutes, frequent enough to catch a missing-TTL leak before it accumulates. Shipped disabled; enable it once redis_host/redis_key point at a real instance and a manual run has been verified. Always fires in safe mode (auto_remediate false, dry_run true) regardless of this flow's own defaults.
    cron: "*/15 * * * *"
    disabled: true
    inputs:
      auto_remediate: "false"
      dry_run: "true"

inputs:
  - id: redis_host
    type: STRING
    displayName: "Redis Host"
    defaults: "localhost"
    description: Redis server hostname.

  - id: redis_port
    type: INT
    displayName: "Redis Port"
    defaults: 6379
    description: Redis server port.

  - id: redis_key
    type: STRING
    displayName: "Redis Key"
    defaults: "session:example"
    description: The single key to audit. io.kestra.plugin.redis.string.Ttl checks one key per call; see How to extend for auditing several.

  - id: min_ttl_seconds
    type: INT
    displayName: "Minimum Safe TTL (seconds)"
    defaults: 300
    description: A TTL below this value, or a key with no TTL (-1) or missing entirely (-2), counts as at risk.

  - id: remediation_ttl_seconds
    type: INT
    displayName: "Remediation TTL (seconds)"
    defaults: 3600
    description: The TTL applied by EXPIRE when auto_remediate runs. Only used when the key still exists but has no TTL or an unsafe one.

  - id: auto_remediate
    type: SELECT
    displayName: "Auto Remediate"
    defaults: "false"
    values:
      - "false"
      - "true"
    description: If "true" and the key is at risk but still exists, apply remediation_ttl_seconds with EXPIRE (still gated by dry_run below). If "false", the risk is only reported.

  - id: dry_run
    type: SELECT
    displayName: "Dry Run"
    defaults: "true"
    values:
      - "true"
      - "false"
    description: If "true", remediation is only logged, EXPIRE never runs. Must be explicitly "false", together with auto_remediate "true", for EXPIRE to actually execute.

tasks:
  - id: check_key_ttl
    type: io.kestra.plugin.redis.string.Ttl
    description: Runs TTL on redis_key. Output ttl is -1 for no expiry, -2 if the key is missing, otherwise remaining seconds - verified directly from the plugin source, there is no separate "exists" or "status" output field.
    url: "redis://{{ inputs.redis_host }}:{{ inputs.redis_port }}/0"
    key: "{{ inputs.redis_key }}"

  - id: evaluate_ttl_risk
    type: io.kestra.plugin.core.flow.If
    description: A TTL below min_ttl_seconds is at risk - this naturally also catches both sentinel values (-1 no expiry, -2 missing) since both are less than any positive threshold, without needing a compound OR condition.
    condition: "{{ outputs.check_key_ttl.ttl < inputs.min_ttl_seconds }}"
    then:
      - id: check_key_exists
        type: io.kestra.plugin.core.flow.If
        description: Distinguish a key that exists but has an unsafe TTL (remediable with EXPIRE) from a key that is missing entirely (EXPIRE on a missing key is a no-op; there is nothing to remediate).
        condition: "{{ outputs.check_key_ttl.ttl != -2 }}"
        then:
          - id: route_remediation
            type: io.kestra.plugin.core.flow.Switch
            description: auto_remediate only decides whether remediation is considered at all; dry_run, checked separately below, decides whether EXPIRE actually runs.
            value: "{{ inputs.auto_remediate }}"
            cases:
              "true":
                - id: check_dry_run
                  type: io.kestra.plugin.core.flow.If
                  condition: "{{ inputs.dry_run == \"false\" }}"
                  then:
                    - id: remediate_key_ttl
                      type: io.kestra.plugin.redis.cli.RedisCLI
                      description: "There is no structured Expire/PExpire task in this plugin - EXPIRE is only reachable through the CLI wrapper. redis-cli's own reply for this command is captured in vars.command_1 through the task's own auto-generated stdout marker."
                      host: "{{ inputs.redis_host }}"
                      port: "{{ inputs.redis_port }}"
                      commands:
                        - EXPIRE {{ inputs.redis_key }} {{ inputs.remediation_ttl_seconds }}
                    - id: log_remediation_applied
                      type: io.kestra.plugin.core.log.Log
                      message: "Applied EXPIRE {{ inputs.redis_key }} {{ inputs.remediation_ttl_seconds }}. redis-cli reply: {{ outputs.remediate_key_ttl.vars.command_1 }}."
                  else:
                    - id: log_dry_run_remediation
                      type: io.kestra.plugin.core.log.Log
                      message: "DRY RUN: would run EXPIRE {{ inputs.redis_key }} {{ inputs.remediation_ttl_seconds }} (dry_run is true). No change made."
              "false":
                - id: log_remediation_disabled
                  type: io.kestra.plugin.core.log.Log
                  message: "auto_remediate is false: {{ inputs.redis_key }} is at risk (ttl={{ outputs.check_key_ttl.ttl }}) but no EXPIRE was attempted."
        else:
          - id: log_key_missing
            type: io.kestra.plugin.core.log.Log
            message: "{{ inputs.redis_key }} does not exist (TTL returned -2). EXPIRE cannot remediate a missing key; investigate why it was never set or already expired."
      - id: alert_ttl_risk
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Always alert on any risk, independent of whether it was remediable, so a missing key is never silently equated with a healthy one.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "Redis TTL sentinel: {{ inputs.redis_key }} on {{ inputs.redis_host }}:{{ inputs.redis_port }} is at risk, ttl={{ outputs.check_key_ttl.ttl }} (threshold {{ inputs.min_ttl_seconds }}s; -1 means no expiry, -2 means missing). auto_remediate: {{ inputs.auto_remediate }}. dry_run: {{ inputs.dry_run }}. Remediated: {{ outputs.remediate_key_ttl is defined }}. Execution {{ execution.id }}."
          }
    else:
      - id: log_ttl_healthy
        type: io.kestra.plugin.core.log.Log
        message: "{{ inputs.redis_key }} is healthy: ttl={{ outputs.check_key_ttl.ttl }}s, above the {{ inputs.min_ttl_seconds }}s threshold."

  - id: log_audit_complete
    type: io.kestra.plugin.core.log.Log
    description: Final status line for every run, independent of which branch fired, so the execution history always shows the headline numbers.
    message: "TTL audit complete for {{ inputs.redis_key }}. ttl={{ outputs.check_key_ttl.ttl }}. threshold={{ inputs.min_ttl_seconds }}. auto_remediate={{ inputs.auto_remediate }}. dry_run={{ inputs.dry_run }}."

errors:
  - id: alert_execution_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alert when the flow itself fails outside the handled branches, for example an unreachable Redis instance.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "Redis TTL sentinel FAILED in execution {{ execution.id }} for {{ inputs.redis_key }} on {{ inputs.redis_host }}:{{ inputs.redis_port }}. The TTL check did not complete; investigate before trusting the last known status."
      }

extend:
  title: "Redis Key TTL Expiry Risk Sentinel"
  shortDescription: Check a critical Redis key's TTL, alert Slack when it has no expiry or is close to expiring, and optionally re-apply a safe TTL with EXPIRE.
  metaTitle: Redis Key TTL Expiry Sentinel with Kestra
  metaDescription: "Check a Redis key's TTL, alert on no-expiry or near-expiry risk, and optionally remediate with EXPIRE."
  description: |
    A Redis key with no TTL at all persists forever - exactly the leak that fills an
    instance's memory one forgotten session token at a time. A key with a TTL that is
    about to run out is a different but related risk: whatever depends on it is about to
    lose it. This blueprint reads one key's TTL, alerts on either risk (or on the key being
    missing entirely), and can re-apply a safe TTL with `EXPIRE` - never touching the key's
    actual value - behind two independent, explicit gates.

    ## How it works

    1. `periodic_ttl_check` (`io.kestra.plugin.core.trigger.Schedule`) runs every 15 minutes, always forcing `auto_remediate: "false"` and `dry_run: "true"` through its own `inputs:` override regardless of this flow's defaults. Shipped disabled so you can validate a manual run first.
    2. `check_key_ttl` (`io.kestra.plugin.redis.string.Ttl`) runs `TTL` on `redis_key`, returning `-1` (no expiry), `-2` (missing), or the remaining seconds.
    3. `evaluate_ttl_risk` (`io.kestra.plugin.core.flow.If`) flags risk whenever `ttl < min_ttl_seconds` - a single comparison that also catches both sentinel values, since `-1` and `-2` are always less than any positive threshold.
       - `then` (at risk): `check_key_exists` (`io.kestra.plugin.core.flow.If` on `ttl != -2`) separates a remediable key (exists, unsafe TTL) from a missing one. For a remediable key, `route_remediation` (`io.kestra.plugin.core.flow.Switch` on `auto_remediate`) either considers remediation (`"true"`, gated again by `dry_run` through `check_dry_run`) or only logs that remediation is disabled (`"false"`). A missing key logs that `EXPIRE` cannot help. `alert_ttl_risk` always fires to Slack regardless of which of those ran.
       - `else` (healthy): `log_ttl_healthy` records a clean check.
    4. `log_audit_complete` always runs last, printing the headline numbers regardless of which branch fired.
    5. The `errors` block alerts Slack separately if the flow itself fails - an unreachable Redis instance must not read as "no risk".

    ## What you get

    - A specific, actionable distinction between "no TTL set", "about to expire", and "missing entirely" - not one generic alert.
    - Remediation (`EXPIRE`) that only ever changes the key's TTL, never its value - no risk of clobbering session or cache data.
    - Two independent gates (`auto_remediate`, `dry_run`) between "risk detected" and "TTL actually changed".
    - A final status log every run, risk or not, so the execution history doubles as a TTL history for that key.

    ## Who it's for

    - Platform teams running Redis as a session store or token registry who need to catch a missing-TTL leak before memory pressure forces an eviction storm.
    - SREs who want a specific key (a feature flag, a leader-election lock, a rate-limit counter) watched for unsafe expiry behavior.
    - Anyone evaluating the Redis plugin who wants a worked example of `Ttl` paired with `RedisCLI` for an operation the structured tasks cannot do alone.

    ## Why orchestrate this with Kestra

    `TTL` and `EXPIRE` are one-shot Redis commands with no memory of the last check, no threshold logic, and no notification path. Kestra supplies the schedule, the risk classification as a first-class branch, two independent authorization gates before anything is changed, and an execution history that shows exactly when a key went unsafe and whether it was fixed.

    ## Prerequisites

    - Docker available to the Kestra Worker (`io.kestra.plugin.redis.cli.RedisCLI` defaults to the Docker task runner with the `redis:7-alpine` image; `io.kestra.plugin.redis.string.Ttl` connects directly over the Redis protocol, no container needed on the Worker itself for that task).
    - Network access from the Kestra Worker to `redis_host:redis_port`.
    - A Slack incoming webhook for alerts.

    Local testing:
    `docker run -d --name redis-sentinel -p 6380:6379 redis:7-alpine`
    `docker network connect YOUR_KESTRA_NETWORK redis-sentinel` (only needed if the Kestra Worker runs in a separate Docker network than this container; if you map the host port, set `redis_port` to `6380` or whatever host port you chose, since `6379` is avoided here only as a documentation convention, not a hard requirement).

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack incoming webhook used by `alert_ttl_risk` and the `errors` block.
    - This blueprint's `check_key_ttl.url` and `remediate_key_ttl`'s `host`/`port` assume an unauthenticated local instance, matching the plugin's own documentation examples. For a password-protected instance, set `url: "redis://:{{ secret('REDIS_PASSWORD') }}@{{ inputs.redis_host }}:{{ inputs.redis_port }}/0"` on `check_key_ttl`, and add `password: "{{ secret('REDIS_PASSWORD') }}"` to `remediate_key_ttl` - never place the password in `redis_host`/`redis_port` or any other input.
    - In Kestra OSS (no Enterprise secrets backend), secrets are supplied as environment variables prefixed `SECRET_`, base64-encoded, and read back in flows with `{{ secret('NAME') }}` - for example `SECRET_SLACK_WEBHOOK_URL=$(echo -n 'https://hooks.slack.com/...' | base64)`. This keeps credentials out of the flow YAML but, per Kestra's own documentation, offers no encryption at rest or access control beyond the host environment; use the Enterprise secrets backend for stronger guarantees.

    ### Inputs

    - `redis_host` (STRING, default `localhost`): Redis server hostname.
    - `redis_port` (INT, default `6379`): Redis server port.
    - `redis_key` (STRING, default `session:example`): the single key audited.
    - `min_ttl_seconds` (INT, default `300`): a TTL below this, or `-1`/`-2`, counts as at risk.
    - `remediation_ttl_seconds` (INT, default `3600`): TTL applied by `EXPIRE` when remediation runs.
    - `auto_remediate` (SELECT: `"false"`, `"true"`; default `"false"`): must be `"true"` for remediation to even be considered.
    - `dry_run` (SELECT: `"true"`, `"false"`; default `"true"`): must be explicitly `"false"`, together with `auto_remediate: "true"`, for `EXPIRE` to actually run.

    ### Outputs

    - `outputs.check_key_ttl.ttl` / `.key`: the raw TTL result for every run.
    - `outputs.remediate_key_ttl.vars.command_1`: redis-cli's own reply to the `EXPIRE` command, present only when remediation actually ran.

    ## Quick start

    1. Start Redis locally with the command above (or point at an existing instance) and set a key with no TTL: `redis-cli -p 6380 SET session:example "test"`.
    2. Add the `SLACK_WEBHOOK_URL` secret.
    3. Run the flow manually with the defaults and confirm `alert_ttl_risk` fires (a key with no TTL has `ttl: -1`, always below `min_ttl_seconds`) and, with `auto_remediate: "false"`, `log_remediation_disabled` logs without changing anything.
    4. Run once with `auto_remediate: "true"` and `dry_run: "true"` and confirm `log_dry_run_remediation` describes the `EXPIRE` without running it.
    5. Run once with `auto_remediate: "true"` and `dry_run: "false"` and confirm `remediate_key_ttl` runs, then verify with `redis-cli -p 6380 TTL session:example` that the TTL is now set.
    6. Enable `periodic_ttl_check` once you trust the check; it always runs in the safe `auto_remediate: "false"` / `dry_run: "true"` mode regardless of what you leave the flow's own defaults set to.

    ## How to extend

    - Loop over several keys with `io.kestra.plugin.core.flow.Loop`, declaring the loop's own `outputs:` property so each iteration's `Ttl` result is available after the loop closes - the current single-key design intentionally avoids that added complexity.
    - Use `io.kestra.plugin.redis.cli.RedisCLI` with a `KEYS` or `SCAN` command to discover candidate keys by pattern instead of auditing one known key.
    - Route the missing-key branch (`log_key_missing`) to a different Slack channel or severity than the unsafe-TTL branch, since a missing key often means something upstream never ran at all.
    - Add `io.kestra.plugin.redis.string.Get` before remediation to log the key's current value alongside its TTL for a fuller audit trail (read-only, never fed into `EXPIRE`).

    ## Pitfalls

    - **`-1` and `-2` are TTL values, not error codes.** Redis's own `TTL` command overloads a single integer field with these sentinels; a `null`/missing-field check would miss both. This blueprint relies on `ttl < min_ttl_seconds` catching all three cases (unsafe-but-positive, no-expiry, missing) in one comparison.
    - **There is no structured `Expire` task in this plugin.** Verified from source: only `Ttl`, `Get`, `Set`, `Delete`, `Increment` exist under `redis.string`. Setting a TTL without rewriting the value requires `io.kestra.plugin.redis.cli.RedisCLI` running a raw `EXPIRE` command - using `Set` instead would silently overwrite the key's actual content.
    - **`EXPIRE` on a missing key is a silent no-op, not a remediation.** The `check_key_exists` gate exists specifically so a missing key is reported as missing, never papered over by an `EXPIRE` call that would appear to succeed while doing nothing.
    - **`auto_remediate` and `dry_run` are independent gates, not a single boolean.** Both must be `"true"`/`"false"` respectively for `EXPIRE` to run; setting only one leaves the other still blocking.
    - **`Switch` case keys `"true"`/`"false"` are quoted strings.** `auto_remediate` renders as the literal string `"true"` or `"false"`; unquoted `true:`/`false:` YAML map keys would parse as booleans instead and would not match.

    ## Links

    - [plugin-redis documentation](https://kestra.io/plugins/plugin-redis)
    - [Redis TTL command](https://redis.io/docs/latest/commands/ttl/)
    - [Redis EXPIRE command](https://redis.io/docs/latest/commands/expire/)
    - [Kestra secrets (OSS vs Enterprise)](https://kestra.io/docs/concepts/secret)
  tags:
    - Infrastructure
    - Data
  subTags:
    - Monitoring & Alerting
    - Caching
  ee: false
  demo: false
