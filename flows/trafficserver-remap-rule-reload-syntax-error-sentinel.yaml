id: trafficserver-remap-rule-reload-syntax-error-sentinel
namespace: company.team

description: |
  Audits Apache Traffic Server edge proxy telemetry to detect remap rule reload syntax errors, origin server disconnects, and cache hit ratio drops.

concurrency:
  limit: 1

inputs:
  - id: ats_metrics_url
    type: STRING
    displayName: "Traffic Server Metrics URL"
    defaults: "http://trafficserver.edge.svc.cluster.local:8080"
    description: "Internal HTTP endpoint exposing Prometheus or stats_over_http metrics for Apache Traffic Server."

  - id: proxy_instance_id
    type: STRING
    displayName: "Proxy Instance Identifier"
    defaults: "edge-cdn-pop-01"
    description: "Identifier of the target Apache Traffic Server caching proxy edge instance under active surveillance."

  - id: max_reload_errors_threshold
    type: INT
    displayName: "Max Reload Errors Threshold"
    defaults: 1
    description: "Maximum allowable remap.config configuration reload syntax errors before dispatching high-urgency alerts."

  - id: max_origin_disconnects_threshold
    type: INT
    displayName: "Max Origin Disconnects Threshold"
    defaults: 5
    description: "Maximum allowable origin backend server connection resets or timeouts within the evaluation window."

  - id: alert_on_reload_error
    type: BOOL
    displayName: "Alert on Reload Error"
    defaults: true
    description: "Toggle whether detected remap rule reload failure triggers an immediate high-urgency incident notification."

tasks:
  - id: scan_trafficserver_telemetry
    type: io.kestra.plugin.scripts.python.Script
    description: Scrapes Apache Traffic Server Prometheus metrics to audit remap rule reload errors, origin disconnects, and cache hit ratios.
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests kestra
    env:
      METRICS_URL: "{{ inputs.ats_metrics_url }}"
      PROXY_ID: "{{ inputs.proxy_instance_id }}"
      MAX_RELOAD_ERRORS: "{{ inputs.max_reload_errors_threshold }}"
      MAX_DISCONNECTS: "{{ inputs.max_origin_disconnects_threshold }}"
      ALERT_RELOAD: "{{ inputs.alert_on_reload_error }}"
    script: |
      import os
      import sys
      import re
      import requests
      from datetime import datetime, timezone
      from kestra import Kestra

      base_url = os.environ.get("METRICS_URL", "").rstrip("/")
      proxy_id = os.environ.get("PROXY_ID", "edge-cdn-pop-01")
      max_reload_errors = int(os.environ.get("MAX_RELOAD_ERRORS", "1"))
      max_disconnects = int(os.environ.get("MAX_DISCONNECTS", "5"))
      alert_reload = os.environ.get("ALERT_RELOAD", "true").lower() == "true"

      reload_errors_total = 0
      origin_disconnects_total = 0
      client_connections_count = 0
      cache_hit_ratio = 0
      degraded_instances = []

      try:
          resp = requests.get(f"{base_url}/_stats", timeout=12)
          for line in resp.text.splitlines():
              line = line.strip()
              if not line or line.startswith("#"):
                  continue
              match = re.search(r'([0-9.]+)\s*$', line)
              if not match:
                  continue
              val = float(match.group(1))
              if "proxy_node_config_reloads_failed_total" in line:
                  reload_errors_total += int(val)
                  if reload_errors_total > max_reload_errors:
                      degraded_instances.append(f"{proxy_id}-remap-syntax-error")
              elif "proxy_node_origin_server_disconnects_total" in line:
                  origin_disconnects_total += int(val)
              elif "proxy_process_http_total_client_connections" in line:
                  client_connections_count = max(client_connections_count, int(val))
              elif "proxy_node_cache_hit_ratio" in line:
                  cache_hit_ratio = int(val * 100)
      except Exception as err:
          print(f"Error querying Apache Traffic Server metrics at {metrics_url}: {err}", file=sys.stderr)
          sys.exit(1)

      is_breached = bool(
          (alert_reload and reload_errors_total > max_reload_errors) or
          (origin_disconnects_total > max_disconnects) or
          (cache_hit_ratio < 60 and client_connections_count > 100)
      )
      now_iso = datetime.now(timezone.utc).isoformat()
      summary = (
          f"Traffic Server proxy '{proxy_id}' audit: {reload_errors_total} reload errors, "
          f"{origin_disconnects_total} origin disconnects, {client_connections_count} client connections, "
          f"{cache_hit_ratio}% cache hit ratio."
      )
      print(f"Traffic Server Complete: {summary}")

      Kestra.outputs({
          "reload_errors_total": reload_errors_total,
          "origin_disconnects_total": origin_disconnects_total,
          "client_connections_count": client_connections_count,
          "cache_hit_ratio_percentage": cache_hit_ratio,
          "degraded_instances": list(set(degraded_instances)),
          "is_alerting": is_breached,
          "proxy_id": proxy_id,
          "audit_timestamp": now_iso
      })

  - id: evaluate_trafficserver_health
    type: io.kestra.plugin.core.flow.If
    description: Evaluates whether observed Traffic Server remap reload errors, origin disconnects, or cache ratio drops breach thresholds.
    condition: "{{ outputs.scan_trafficserver_telemetry.vars.is_alerting }}"
    then:
      - id: notify_slack_cdn_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches high-urgency incident notification to Edge CDN NetOps Slack channel detailing Traffic Server remap reload failure.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#edge-cdn-alerts",
            "text": "CRITICAL: Apache Traffic Server Configuration Degradation on Proxy `{{ inputs.proxy_instance_id }}`. Reload Errors: `{{ outputs.scan_trafficserver_telemetry.vars.reload_errors_total }}` (max allowable: `{{ inputs.max_reload_errors_threshold }}`). Origin Disconnects: `{{ outputs.scan_trafficserver_telemetry.vars.origin_disconnects_total }}` (threshold: `{{ inputs.max_origin_disconnects_threshold }}`). Cache Hit Ratio: `{{ outputs.scan_trafficserver_telemetry.vars.cache_hit_ratio_percentage }}`%. Audit Timestamp: `{{ outputs.scan_trafficserver_telemetry.vars.audit_timestamp }}`."
          }
    else:
      - id: log_nominal_trafficserver_state
        type: io.kestra.plugin.core.log.Log
        description: Records nominal telemetry when Apache Traffic Server reloads remap configurations cleanly and serves cached traffic at high speed.
        message: "Traffic Server operating nominally: {{ outputs.scan_trafficserver_telemetry.vars.client_connections_count }} active clients, {{ outputs.scan_trafficserver_telemetry.vars.cache_hit_ratio_percentage }}% cache hits, zero reload errors."

  - id: emit_audit_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Emits structured audit manifest for edge proxy governance and reverse proxy caching configuration compliance records.
    format: |
      {
        "status": "{{ outputs.scan_trafficserver_telemetry.vars.is_alerting ? 'ALERT' : 'NOMINAL' }}",
        "proxy_id": "{{ inputs.proxy_instance_id }}",
        "reload_errors": {{ outputs.scan_trafficserver_telemetry.vars.reload_errors_total }},
        "origin_disconnects": {{ outputs.scan_trafficserver_telemetry.vars.origin_disconnects_total }},
        "client_connections": {{ outputs.scan_trafficserver_telemetry.vars.client_connections_count }},
        "cache_hit_ratio": {{ outputs.scan_trafficserver_telemetry.vars.cache_hit_ratio_percentage }},
        "audit_timestamp": "{{ outputs.scan_trafficserver_telemetry.vars.audit_timestamp }}"
      }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "#edge-cdn-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ Apache Traffic Server Sentinel Failure",
            "text": "Failed to scrape Traffic Server edge proxy telemetry on `{{ inputs.proxy_instance_id }}`. Check network connectivity and metrics endpoint.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_trafficserver_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"

extend:
  title: "Traffic Server Remap Rule Reload Syntax Error Sentinel"
  metaTitle: "Traffic Server Remap Sentinel Blueprint"
  shortDescription: "Audits Apache Traffic Server edge telemetry for remap rule reload syntax errors, origin drops, and cache degradation."
  metaDescription: "Audits Apache Traffic Server metrics to detect remap.config reload syntax errors, origin backend disconnects, and cache hit ratio drops."
  description: |
    Automates continuous health and configuration reload surveillance for Apache Traffic Server (ATS) reverse proxy edge caches.

    ## How it works
    1. A schedule trigger executes the Apache Traffic Server health audit workflow every 15 minutes.
    2. The Python task queries the Traffic Server metrics endpoint (`/_stats` or Prometheus port 8080).
    3. The script extracts configuration reload error counters, origin server disconnect totals, and cache hit ratios.
    4. An evaluation gate determines whether remap syntax errors, origin disconnect surges, or cache collapses breach limits.
    5. When edge proxy routing or reload degradation is detected, a high-priority Slack incident alert is dispatched to Edge NetOps.
    6. When Traffic Server compiles routing rules cleanly and serves cached assets at high throughput, nominal telemetry is logged.
    7. A structured JSON audit manifest is emitted for edge caching governance and CDN configuration archives.

    ## Architecture diagram
    ```mermaid
    graph TD
        Trigger[Schedule Trigger: 15m] --> ScanMetrics[Python Script: Scrape Traffic Server Metrics]
        ScanMetrics --> EvalBreach{Reload Errors > 1 OR Disconnects > 5 OR Cache < 60%?}
        EvalBreach -- Yes --> SlackAlert[Slack: High-Urgency CDN Alert]
        EvalBreach -- No --> LogNominal[Log: Nominal ATS State]
        SlackAlert --> EmitManifest[Debug Return: Edge Audit Manifest]
        LogNominal --> EmitManifest
    ```

    ## Architecture components
    - **Trigger**: Automated schedule polling at 15-minute recurring intervals.
    - **Script Task**: Scrapes Apache Traffic Server metrics endpoints using Docker container runners.
    - **Decision Gate**: Evaluates whether remap configuration reload error counters exceed zero or origin drops spike.
    - **Notification Task**: Dispatches structured Slack alerts with proxy instance ID and reload error metrics.
    - **Audit Manifest**: Emits JSON execution payloads containing edge cache proxy health and timestamps.

    ## Key capabilities
    - Continuous surveillance of Apache Traffic Server `traffic_server` processes, remap.config, and records.config files.
    - Early warning detection for syntax errors in dynamic URL rewriting rules during automated CDN configuration updates.
    - Automated tracking of origin server connection resets caused by upstream gateway timeouts.
    - Zero host dependency execution via isolated containerized Python runners.

    ## What you get
    - Real-time visibility into edge reverse proxy caching performance and routing rule validation integrity.
    - Proactive alerts preventing malformed remap configurations from blocking production traffic routing changes.
    - Standardized audit manifests containing exact client connection totals, cache hit percentages, and timestamps.
    - Zero-overhead deployment compatible with standalone ATS clusters and Kubernetes edge ingress caches.

    ## Who it's for
    - Edge network and CDN reliability engineers managing reverse proxy caching tiers in production.
    - Platform engineers automating dynamic URL remap updates via GitOps or CI/CD pipelines.
    - Site Reliability Engineers safeguarding origin application backends from cache stampede surges.
    - Cloud infrastructure leads optimizing global edge egress bandwidth and latency budgets.

    ## Why orchestrate this with Kestra
    - **Serverless Docker Isolation**: Executes telemetry scraping in ephemeral Docker environments without persistent workers.
    - **Centralized Secrets Governance**: Protects sensitive Slack webhooks using encrypted namespace secrets.
    - **Declarative YAML Workflows**: Manages edge proxy surveillance as versioned code in Git repositories.
    - **Comprehensive Audit History**: Preserves historical caching performance metrics in searchable Kestra execution logs.

    ## Use cases
    - **Remap Config GitOps Rollout Guard**: Alerts engineers when an automated configuration push contains invalid regex rules.
    - **Origin Backend Saturation Alarm**: Identifies when origin server timeouts cause proxy connection resets.
    - **Cache Hit Ratio Collapse Warning**: Detects when cache bypass query parameters degrade edge offload efficiency.

    ## Inputs
    | Name | Type | Default | Description |
    | --- | --- | --- | --- |
    | `ats_metrics_url` | STRING | `http://trafficserver.edge.svc.cluster.local:8080` | Internal HTTP URL exposing Prometheus metrics for ATS. |
    | `proxy_instance_id` | STRING | `edge-cdn-pop-01` | Identifier of the target Apache Traffic Server proxy instance. |
    | `max_reload_errors_threshold` | INT | `1` | Maximum allowable configuration reload syntax errors before alerting. |
    | `max_origin_disconnects_threshold` | INT | `5` | Maximum allowable origin backend server connection resets. |
    | `alert_on_reload_error` | BOOL | `true` | Toggle whether configuration reload failure triggers an incident alert. |

    ## Expected outputs
    - `{{ outputs.scan_trafficserver_telemetry.vars.reload_errors_total }}`: Total count of failed configuration reloads.
    - `{{ outputs.scan_trafficserver_telemetry.vars.origin_disconnects_total }}`: Total count of origin server connection resets.
    - `{{ outputs.scan_trafficserver_telemetry.vars.cache_hit_ratio_percentage }}`: Percentage of client requests served from cache.
    - `{{ outputs.scan_trafficserver_telemetry.vars.is_alerting }}`: Boolean flag indicating if edge proxy bounds are breached.
    - `{{ outputs.scan_trafficserver_telemetry.vars.audit_timestamp }}`: ISO-8601 UTC timestamp of the Traffic Server audit run.

    ## Prerequisites
    - Apache Traffic Server deployed with `stats_over_http` or Prometheus exporter enabled on port 8080.
    - Network connectivity from the Kestra worker to the Traffic Server metrics endpoint.
    - Configured Slack incoming webhook URL with permissions to post in edge CDN alert channels.

    ### Secrets
    - `SLACK_WEBHOOK_URL`: Secure webhook URL for routing edge alerts to the Edge NetOps Slack channel.

    ## Quick start
    1. Verify that Traffic Server exposes metrics on HTTP port 8080 (`/_stats` or `/metrics`).
    2. Add the `SLACK_WEBHOOK_URL` secret within your Kestra namespace settings.
    3. Specify your proxy instance identifier in `proxy_instance_id`.
    4. Run a manual flow execution via the Kestra UI to validate metric ingestion.
    5. Enable the `periodic_trafficserver_audit` schedule trigger to establish automated monitoring.

    ## Common pitfalls and troubleshooting
    - **Plugin Order in plugin.config**: Stats plugins must load after core proxy initialization plugins.
    - **Remap Regex Escaping**: Unescaped regex characters (`?`, `&`) in `remap.config` cause silent reload rejections.
    - **Traffic_ctl Exec Permissions**: Ensure the management process has permissions to read new configuration files.
    - **Origin Keepalive Exhaustion**: Low `proxy.config.http.keep_alive_no_activity_timeout_out` causes origin resets.

    ## How to extend
    - **Automated Config Rollback**: Execute `traffic_ctl config reload` with backup remap.config if reload fails.
    - **PagerDuty Escalation**: Escalate to on-call edge engineers if cache hit ratio drops below 50% during peak traffic.
    - **Multi-PoP Global Sweep**: Expand script parameters to monitor all Traffic Server edge PoPs worldwide.

    ## Links
    - [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
    - [Apache Traffic Server Official Documentation](https://trafficserver.apache.org/)
    - [Traffic Server URL Remapping and Rewriting Architecture](https://docs.trafficserver.apache.org/en/latest/admin-guide/files/remap.config.en.html)
    - [Traffic Server Monitoring and Statistics Reference](https://docs.trafficserver.apache.org/en/latest/admin-guide/monitoring/index.en.html)
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Monitoring & Alerting
    - Infrastructure Automation
  ee: false
  demo: false
