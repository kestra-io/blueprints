id: hashicorp-vault-audit-device-sentinel
namespace: company.team
description: Audits HashiCorp Vault cluster configuration to ensure active audit devices are enabled for compliance and secret governance.

inputs:
  - id: vault_addr
    type: STRING
    defaults: "http://vault.internal:8200"
    description: Base URL of the HashiCorp Vault server.

tasks:
  - id: inspect_audit_devices
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    description: Query HashiCorp Vault sys/audit endpoint to verify active audit sinks
    env:
      VAULT_ADDR: "{{ inputs.vault_addr }}"
      VAULT_TOKEN: "{{ secret('VAULT_TOKEN') }}"
    script: |
      import os
      import sys
      import json
      import urllib.request
      import urllib.error
      from kestra import Kestra

      vault_addr = os.environ.get("VAULT_ADDR", "http://vault.internal:8200").rstrip("/")
      token = os.environ.get("VAULT_TOKEN")

      if not token:
          print("ERROR: VAULT_TOKEN secret must be configured", file=sys.stderr)
          sys.exit(1)

      url = f"{vault_addr}/v1/sys/audit"
      headers = {
          "X-Vault-Token": token,
          "User-Agent": "Kestra-Vault-Sentinel"
      }

      req = urllib.request.Request(url, headers=headers)
      try:
          with urllib.request.urlopen(req, timeout=30) as resp:
              data = json.loads(resp.read().decode("utf-8"))
      except urllib.error.HTTPError as e:
          print(f"CRITICAL: HTTP error querying Vault audit devices: {e.code} {e.reason}", file=sys.stderr)
          sys.exit(1)
      except Exception as e:
          print(f"CRITICAL: Failed to query Vault audit devices at {url}: {e}", file=sys.stderr)
          sys.exit(1)

      devices = [k for k in data.keys() if k] if isinstance(data, dict) else []
      has_devices = len(devices) > 0
      alert_triggered = not has_devices

      result = {
          "vault_addr": vault_addr,
          "active_devices_count": len(devices),
          "active_devices": devices,
          "alert_triggered": alert_triggered
      }
      print("Vault audit devices:", result)
      Kestra.outputs(result)

  - id: evaluate_audit_posture
    type: io.kestra.plugin.core.flow.If
    description: Alert security team if no audit devices are active
    condition: "{{ outputs.inspect_audit_devices.vars.alert_triggered == true }}"
    then:
      - id: alert_security_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "🚨 *HashiCorp Vault Audit Device Alert*: No active audit devices configured on {{ inputs.vault_addr }}. Critical compliance violation: all secret access requests must be logged to an audit device."
          }

outputs:
  - id: active_devices_count
    type: INT
    value: "{{ outputs.inspect_audit_devices.vars.active_devices_count }}"
  - id: active_devices
    type: JSON
    value: "{{ outputs.inspect_audit_devices.vars.active_devices }}"
  - id: alert_triggered
    type: BOOLEAN
    value: "{{ outputs.inspect_audit_devices.vars.alert_triggered }}"

errors:
  - id: notify_sentinel_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "⚠️ *Vault Sentinel Failure*: Failed to query audit devices on {{ inputs.vault_addr }} on execution `{{ execution.id }}`."
      }

triggers:
  - id: daily_audit_device_check
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 8 * * *"
    disabled: true

extend:
  metaDescription: Audits HashiCorp Vault cluster configuration to ensure active audit devices are enabled for compliance and secret governance.
  metaTitle: HashiCorp Vault Audit Device Enabled and Blocking Sentinel with Kestra
  title: HashiCorp Vault Audit Device Enabled and Blocking Sentinel
  shortDescription: Audits HashiCorp Vault cluster configuration to ensure active audit devices are enabled for compliance and secret governance.
  description: |
    ## How it works
    This sentinel calls the HashiCorp Vault `/v1/sys/audit` API endpoint to verify that at least one audit device (file, syslog, or socket) is registered and active. It alerts SecOps teams if audit logging is accidentally disabled or dropped during configuration drift.

    ## What you get
    - Continuous validation of enterprise compliance logging mandates.
    - Early prevention of audit non-conformities under SOC 2, ISO 27001, and HIPAA.
    - Automated Slack incident delivery indicating configured audit device types.

    ## Who it's for
    - Security operations (SecOps) teams and compliance auditors.
    - Platform engineers maintaining HashiCorp Vault infrastructure.

    ## Prerequisites
    - HashiCorp Vault server access.
    - A Vault token with `sudo` or `read` permissions on `sys/audit`.
    - Secrets `VAULT_TOKEN` and `SLACK_WEBHOOK_URL` configured in Kestra.
  tags:
    - Security
    - Infrastructure
  subTags:
    - Monitoring & Alerting
  ee: false
  demo: false
