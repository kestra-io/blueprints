# SPDX-License-Identifier: Apache-2.0
id: surrealdb-schemafull-stray-field-cleanup-guard
namespace: company.team
concurrency:
  limit: 1
  behavior: QUEUE
inputs:
  - id: host
    type: STRING
    defaults: localhost
  - id: username
    type: STRING
    defaults: maintenance_editor
  - id: password
    type: SECRET
    defaults: "{{ secret('SURREALDB_PASSWORD') }}"
  - id: use_tls
    type: BOOL
    defaults: true
  - id: db_namespace
    type: STRING
    defaults: production
  - id: database
    type: STRING
    defaults: application
  - id: table
    type: STRING
    defaults: person
    validator: '^[A-Za-z_][A-Za-z0-9_]{0,62}$'
  - id: retired_field
    type: STRING
    defaults: legacy_payload
    validator: '^[A-Za-z_][A-Za-z0-9_]{0,62}$'
  - id: archive_table
    type: STRING
    defaults: field_cleanup_archive
    validator: '^[A-Za-z_][A-Za-z0-9_]{0,62}$'
  - id: control_table
    type: STRING
    defaults: maintenance
    validator: '^[A-Za-z_][A-Za-z0-9_]{0,62}$'
  - id: max_bytes
    type: INT
    defaults: 2000000
  - id: dry_run
    type: BOOL
    defaults: true
  - id: auto_remediate
    type: BOOL
    defaults: false
variables:
  inventory: |
    LET $table = '{{ inputs.table }}';
    LET $field = '{{ inputs.retired_field }}';
    LET $archive = '{{ inputs.archive_table }}';
    LET $control = '{{ inputs.control_table }}';
    IF $field IN ['id','in','out'] OR array::len(array::distinct([$table,$archive,$control])) != 3 {
      THROW 'Protected field or overlapping tables';
    };
    IF {{ inputs.max_bytes }} < 1 OR {{ inputs.max_bytes }} > 2000000 { THROW 'Invalid byte ceiling'; };
    LET $db = INFO FOR DB;
    LET $meta = INFO FOR TABLE {{ inputs.table }};
    LET $archive_meta = INFO FOR TABLE {{ inputs.archive_table }};
    LET $control_meta = INFO FOR TABLE {{ inputs.control_table }};
    LET $table_def = $db.tables[$table];
    IF $table_def != 'DEFINE TABLE ' + $table + ' TYPE NORMAL SCHEMAFULL PERMISSIONS NONE' {
      THROW 'Expected a plain normal SCHEMAFULL table';
    };
    IF $db.tables[$archive] != 'DEFINE TABLE ' + $archive + ' TYPE ANY SCHEMALESS PERMISSIONS NONE'
      OR $db.tables[$control] != 'DEFINE TABLE ' + $control + ' TYPE ANY SCHEMALESS PERMISSIONS NONE'
      OR object::len($archive_meta.fields) + object::len($archive_meta.events) + object::len($archive_meta.tables)
       + object::len($archive_meta.indexes) + object::len($control_meta.fields) + object::len($control_meta.events)
       + object::len($control_meta.tables) + object::len($control_meta.indexes) != 0 {
      THROW 'Archive or maintenance schema is not supported';
    };
    LET $fields = object::keys($meta.fields);
    IF $field IN $fields OR object::len($meta.events) + object::len($meta.tables) != 0 {
      THROW 'Retired field is declared or table has write side effects';
    };
    FOR $entry IN object::entries($meta.fields) {
      LET $key = $entry[0];
      LET $definition = $entry[1];
      IF !string::matches($key, '^[A-Za-z_][A-Za-z0-9_]{0,62}$')
        OR !($definition IN [
          'DEFINE FIELD ' + $key + ' ON ' + $table + ' TYPE string PERMISSIONS FULL',
          'DEFINE FIELD ' + $key + ' ON ' + $table + ' TYPE int PERMISSIONS FULL',
          'DEFINE FIELD ' + $key + ' ON ' + $table + ' TYPE bool PERMISSIONS FULL',
          'DEFINE FIELD ' + $key + ' ON ' + $table + ' TYPE object FLEXIBLE PERMISSIONS FULL'
        ]) { THROW 'Only simple declared fields and flexible objects are supported'; };
    };
    LET $records = SELECT * FROM {{ inputs.table }} ORDER BY id LIMIT 201 TIMEOUT 5s;
    IF array::len($records) > 200 OR string::len(<string>$records) * 4 > {{ inputs.max_bytes }} {
      THROW 'Inventory exceeds a hard ceiling';
    };
    FOR $r IN $records {
      IF array::len(array::complement(object::keys($r), $fields + ['id', $field])) != 0 {
        THROW 'Unapproved undeclared field found';
      };
    };
    LET $candidates = array::filter($records, |$r| $field IN object::keys($r));
    LET $remaining = array::map($records, |$r| object::remove($r, $field));
    LET $fence = SELECT * FROM ONLY {{ inputs.control_table }}:field_cleanup;
    IF $fence = NONE OR !type::is_int($fence.revision) OR !type::is_bool($fence.paused) {
      THROW 'Missing or invalid maintenance control';
    };
    LET $schema_hash = crypto::sha256(<string>[$table_def, $meta.fields, $meta.indexes,
      $db.tables[$archive], $archive_meta, $db.tables[$control], $control_meta]);
    LET $data_hash = crypto::sha256(<string>$records);
    LET $remaining_hash = crypto::sha256(<string>$remaining);
    LET $prior_archives = SELECT * FROM {{ inputs.archive_table }} WHERE retired_field = $field
      AND record::tb(source_id) = $table ORDER BY source_id LIMIT 201 TIMEOUT 5s;
    IF array::len($prior_archives) + array::len($candidates) > 200
      OR string::len(<string>$prior_archives) * 4 > 2000000 { THROW 'Recovery inventory exceeds ceiling'; };
    FOR $a IN $prior_archives {
      IF $a.id != type::record($archive, [<string>$a.source_id, $field])
        OR $a.original.id != $a.source_id OR !($field IN object::keys($a.original))
        { THROW 'Prior recovery copy is incompatible'; };
    };
    LET $prior_archive_ids = array::map($prior_archives, |$a| <string>$a.id);
    LET $archive_hash = crypto::sha256(<string>$prior_archives);
tasks:
  - id: inspect
    type: io.kestra.plugin.surrealdb.Query
    host: "{{ inputs.host }}"
    port: 8000
    username: "{{ inputs.username }}"
    password: "{{ inputs.password }}"
    useTls: "{{ inputs.use_tls }}"
    namespace: "{{ inputs.db_namespace }}"
    database: "{{ inputs.database }}"
    connectionTimeout: 5
    timeout: PT20S
    fetchType: FETCH_ONE
    query: |
      {{ render(vars.inventory) }}
      RETURN [{affected: array::len($candidates), record_count: array::len($records),
        data_hash: $data_hash, remaining_hash: $remaining_hash, schema_hash: $schema_hash,
        revision: $fence.revision, archive_count: array::len($prior_archives), archive_hash: $archive_hash,
        prior_archive_ids: $prior_archive_ids}];
  - id: decide
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.inspect.row.affected > 0 and inputs.auto_remediate and not inputs.dry_run }}"
    then:
      - id: approve
        type: io.kestra.plugin.core.flow.Pause
        pauseDuration: PT30M
        onResume:
          - id: approved
            type: BOOL
            defaults: false
            description: Approve archival and removal of the selected retired field while participating writers remain paused.
      - id: consent
        type: io.kestra.plugin.core.flow.If
        condition: "{{ outputs.approve.onResume.approved ?? false }}"
        then:
          - id: archive_and_unset
            type: io.kestra.plugin.surrealdb.Query
            host: "{{ inputs.host }}"
            port: 8000
            username: "{{ inputs.username }}"
            password: "{{ inputs.password }}"
            useTls: "{{ inputs.use_tls }}"
            namespace: "{{ inputs.db_namespace }}"
            database: "{{ inputs.database }}"
            connectionTimeout: 5
            timeout: PT20S
            fetchType: FETCH_ONE
            query: |
              BEGIN TRANSACTION;
              {{ render(vars.inventory) }}
              IF $fence.paused != true OR $fence.revision != {{ outputs.inspect.row.revision }}
                OR $data_hash != '{{ outputs.inspect.row.data_hash }}'
                OR $archive_hash != '{{ outputs.inspect.row.archive_hash }}'
                OR $schema_hash != '{{ outputs.inspect.row.schema_hash }}' { THROW 'Approval is stale or writers are not paused'; };
              UPDATE {{ inputs.control_table }}:field_cleanup SET revision += 1 RETURN NONE;
              FOR $r IN $candidates {
                LET $aid = type::record($archive, [<string>$r.id, $field]);
                LET $existing = SELECT * FROM ONLY $aid;
                IF $existing != NONE { THROW 'Recovery archive collision'; };
                CREATE ONLY $aid SET source_id = $r.id, retired_field = $field, original = $r RETURN NONE;
                LET $changed = UPDATE ONLY $r.id UNSET {{ inputs.retired_field }} RETURN AFTER;
                IF $changed != object::remove($r, $field) { THROW 'Write did not preserve remaining values'; };
              };
              LET $recovery = SELECT * FROM {{ inputs.archive_table }} WHERE retired_field = $field
                AND record::tb(source_id) = $table ORDER BY source_id LIMIT 201 TIMEOUT 5s;
              IF string::len(<string>$recovery) * 4 > 2000000 { THROW 'Recovery archive exceeds byte ceiling'; };
              RETURN [{archived: array::len($candidates)}];
              COMMIT TRANSACTION;
          - id: verify
            type: io.kestra.plugin.surrealdb.Query
            host: "{{ inputs.host }}"
            port: 8000
            username: "{{ inputs.username }}"
            password: "{{ inputs.password }}"
            useTls: "{{ inputs.use_tls }}"
            namespace: "{{ inputs.db_namespace }}"
            database: "{{ inputs.database }}"
            connectionTimeout: 5
            timeout: PT20S
            fetchType: FETCH_ONE
            query: |
              {{ render(vars.inventory) }}
              LET $saved = SELECT * FROM {{ inputs.archive_table }} WHERE retired_field = $field
                AND record::tb(source_id) = $table ORDER BY source_id LIMIT 201 TIMEOUT 5s;
              FOR $a IN $saved {
                IF !(<string>$a.id IN {{ outputs.inspect.row.prior_archive_ids | toJson }}) {
                  LET $live = SELECT * FROM ONLY $a.source_id;
                  IF $live != object::remove($a.original, $field) { THROW 'Recovery coverage no longer matches'; };
                };
              };
              RETURN [{ok: array::len($candidates) = 0
                AND array::len($records) = {{ outputs.inspect.row.record_count }}
                AND $remaining_hash = '{{ outputs.inspect.row.remaining_hash }}'
                AND $schema_hash = '{{ outputs.inspect.row.schema_hash }}'
                AND array::len($saved) = {{ outputs.inspect.row.affected }} + {{ outputs.inspect.row.archive_count }}
                AND crypto::sha256(<string>array::filter($saved, |$a| <string>$a.id IN {{ outputs.inspect.row.prior_archive_ids | toJson }})) = '{{ outputs.inspect.row.archive_hash }}'
                AND $fence.paused = true
                AND $fence.revision = {{ outputs.inspect.row.revision }} + 1}];
          - id: recovery_gate
            type: io.kestra.plugin.core.flow.If
            condition: "{{ not (outputs.verify.row.ok ?? false) }}"
            then:
              - id: recovery_failed
                type: io.kestra.plugin.core.execution.Fail
                errorMessage: Retired fields or protected values did not verify. Keep maintenance paused and inspect the archive.
        else:
          - id: declined
            type: io.kestra.plugin.core.log.Log
            message: Cleanup declined. No archive or field mutation ran.
    else:
      - id: read_only
        type: io.kestra.plugin.core.log.Log
        message: "Stored retired field appears in {{ outputs.inspect.row.affected }} records. No cleanup armed."
  - id: summary
    type: io.kestra.plugin.core.log.Log
    message: "Retired-field check complete for {{ outputs.inspect.row.record_count }} records. Inspect archived values before reopening writers."
errors:
  - id: failure_alert
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {{ {'text': 'SurrealDB retired-field cleanup failed. Keep maintenance paused and inspect execution ' ~ execution.id ~ '.'} | toJson }}
triggers:
  - id: scheduled_audit
    type: io.kestra.plugin.core.trigger.Schedule
    disabled: true
    cron: '0 3 * * 1'
    inputs:
      dry_run: true
      auto_remediate: false

extend:
  title: Remove SurrealDB retired fields that block schemafull updates
  metaTitle: SurrealDB retired field cleanup with checked recovery
  shortDescription: Archive an explicitly retired field then remove it from existing SCHEMAFULL records under approval and a cooperative maintenance fence.
  metaDescription: Archive retired SurrealDB fields that block SCHEMAFULL updates, revalidate approval and verify retained values before reopening writers.
  description: |
    ## How it works

    A SCHEMALESS import can leave keys behind after SCHEMAFULL is defined. On SurrealDB
    3.3.3 they remain readable but block ordinary updates. `inspect` compares top-level keys
    with INFO definitions and one explicit retired field. It returns counts and digests.
    Native Query performs all reads and writes.

    With cleanup armed, explicit Pause approval permits one transaction. It re-reads the
    schema, records and maintenance revision, archives each original record then UNSETs
    the retired field. Equality checks reject changes to any remaining value. Verification
    re-reads live records and recovery copies, failing if cleanup or conservation is incomplete.

    ## What you get

    Original values in a private archive. Healthy, dry-run and declined runs
    do not write. Cleanup never deletes records, changes schema or unpauses writers.
    Errors alert Slack.

    ## Who it's for

    SurrealDB teams finishing a SCHEMALESS-to-SCHEMAFULL migration when a retired
    imported key obstructs declared-field updates.

    ## Why orchestrate this with Kestra

    SurrealQL supplies the transaction and validation. Kestra adds reviewed approval,
    scheduled audits, receipts and a post-commit failure gate.
    Its queue serializes this flow ID only.

    ## Tested end to end

    On SurrealDB 3.3.3, 31 cases on Kestra 2.0.6, seven on 2.0.5 and nine on a
    second instance passed, with 376 independent assertions.
    API checks showed two retired keys removed, three records retained,
    both original records archived and all 342 canonical bytes of remaining values
    conserved. An ordinary declared-field update failed before cleanup and succeeded
    afterward. Schema/data races, refused writes, partial retry, 200/201-record and
    exact byte boundaries passed. Fresh reproduction repeated all required paths.

    ## Prerequisites

    SurrealDB 3.3.3, Kestra 2.0.6 or 2.0.5 and a root-level system EDITOR account.
    Enforce server query/transaction timeouts at most 10 seconds. Task timeout is
    20 seconds; approval expires after 30 minutes.

    Use a normal SCHEMAFULL PERMISSIONS NONE target. Declared fields may be simple
    string, int, bool or FLEXIBLE object definitions. Computed fields, assertions, defaults,
    events and dependent views are refused. Every other stored key must be declared.

    Pre-create plain SCHEMALESS PERMISSIONS NONE archive and maintenance tables without
    fields, indexes, events or views. The maintenance `field_cleanup` record needs BOOL
    `paused` and INT `revision`. Every application writer and schema administrator must
    check paused=false and update this same record within its own transaction. Before
    approval set paused=true. This cooperative contract does not fence bypassing accounts.

    ### Secrets

    `SURREALDB_PASSWORD` supplies the SECRET password input; `SLACK_WEBHOOK_URL` receives
    failure alerts. Restrict archive access because it contains original field values.

    ### Inputs

    Connection: `host`, `username`, `password`, `use_tls` (true), `db_namespace`, `database`.
    Selection: `table`, `retired_field`, `archive_table`, `control_table`. SQL names are ASCII,
    at most 63 characters. id, in and out are protected. Limits: 200 source records and
    `max_bytes` at most 2000000, conservatively estimated as four bytes per character.
    `dry_run` defaults true and `auto_remediate` false. No truncated inventory is cleaned.

    ## Quick start

    1. Configure secrets, tables, timeouts and the writer contract.
    2. Run read-only. Confirm the retired key is unwanted and review the affected count.
    3. Pause writers, arm cleanup with dry_run=false and auto_remediate=true then approve.
    4. Check recovery copies and application updates before reopening writers.
       On failure inspect live values and rerun with maintenance paused.

    ## How to extend

    Link the archive to your migration ticket. Review archived values
    manually; restoring an undeclared key recreates the update failure. Archive collisions
    fail without replacing copies. Limits: one top-level retired field, no
    nested pruning or automatic schema changes. Recovery inventory is bounded to 200
    copies and a 2 MB estimate. Copies remain historical after
    later legitimate writes. A successful readback is not an application write canary;
    test your update before reopening traffic.

    ## Links

    - [Query](https://kestra.io/plugins/plugin-surrealdb/query)
    - [UPDATE](https://surrealdb.com/docs/surrealql/statements/update)
    - [Transactions](https://surrealdb.com/docs/surrealql/statements/begin)

    This blueprint was created by [zkasuran](https://github.com/zkasuran).
  tags:
    - Data
    - Infrastructure
  subTags:
    - Day 2 Operations
    - Monitoring & Alerting
  ee: false
  demo: false
