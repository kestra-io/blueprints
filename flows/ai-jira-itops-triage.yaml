id: ai-jira-itops-triage
namespace: company.team
description: |
  Triage Jira issues with an LLM grounded in your ops playbook via RAG,
  then post the proposed resolution back to the issue as a comment.

variables:
  jira_base_url: https://your-domain.atlassian.net

tasks:
  - id: log_issue
    type: io.kestra.plugin.core.debug.Return
    description: Extract the fields we care about from the Jira webhook payload.
    format: |
      {{ trigger.body | jq('{
        id: .issue.id,
        key: .issue.key,
        summary: .issue.fields.summary,
        description: .issue.fields.description,
        user_name: .user.displayName,
        user_email: .user.emailAddress,
        priority_name: .issue.fields.priority.name
      }') }}

  - id: ingest_kb
    type: io.kestra.plugin.ai.rag.IngestDocument
    description: Embed the ops playbook into the Kestra KV store.
    embeddings:
      type: io.kestra.plugin.ai.embeddings.KestraKVStore
    provider:
      type: io.kestra.plugin.ai.provider.GoogleGemini
      modelName: gemini-embedding-001
    documentSplitter:
      splitter: "PARAGRAPH"
      maxOverlapSizeInChars: 512
      maxSegmentSizeInChars: 1024
    drop: true
    fromDocuments:
      - content: |
          # Ops and Access Playbooks (replace with your real knowledge base)

          ## Web Service Outage (Nginx 502)
          Symptoms: portals intermittently return 502 Bad Gateway, nginx -t OK,
          backend unreachable. Triage: check systemctl status nginx, validate
          config, tail journalctl -u nginx -n 100, restart nginx as low-risk
          remediation, verify with curl expecting HTTP 200.
          Guardrails: restart only if scoped to one host, skip during deploy
          windows, always log the action in Jira before and after execution.

          ## New User Provisioning (Internal Tools)
          Symptoms: unauthorized or access denied on GitLab, VPN, or Grafana.
          Steps: validate identity via HR system or LDAP, check the account
          with ldapsearch, run the provisioning workflow, add the user to the
          requested system, confirm login or send a password reset link.
          Guardrails: only auto-provision corporate email domains, audit new
          accounts weekly.

          ## API Token Rotation Request
          Symptoms: expired token alerts or 401 Unauthorized on API calls.
          Steps: validate the requester's team and scope, revoke the previous
          token, issue a new one from the vault with a 90 day TTL, update
          dependent workflows, confirm with a sample API call.
          Guardrails: one active token per service per user, rotate every
          90 days, log the token ID but never the value.

          ## Disk Usage High (Linux)
          Steps: run df -h for partitions above 85 percent, find large files
          with du, rotate logs with logrotate and journalctl vacuum, archive
          app logs to S3, verify free space.
          Guardrails: never delete /var/lib or /etc manually, escalate if
          usage stays above 90 percent after cleanup.

  - id: invoke_ai
    type: io.kestra.plugin.ai.rag.ChatCompletion
    description: Ask the model for triage steps grounded in the playbook.
    chatProvider:
      type: io.kestra.plugin.ai.provider.GoogleGemini
      modelName: gemini-2.5-flash
    embeddingProvider:
      type: io.kestra.plugin.ai.provider.GoogleGemini
      modelName: gemini-embedding-001
    embeddings:
      type: io.kestra.plugin.ai.embeddings.KestraKVStore
    systemMessage: |
      You are an SRE assistant. Use the provided knowledge base and issue
      to propose concise triage steps.
      - Always include "Risk", "Steps", and "Verification".
      - Structure your response in readable markdown sections with newlines.
    prompt: |
      Issue JSON:
      {{ outputs.log_issue.value }}

      Produce:
      - concise_summary
      - work_notes (bullet list)
      - proposed_resolution (one paragraph)

  - id: log_ai_resp
    type: io.kestra.plugin.core.log.Log
    description: Keep the AI proposal in the execution logs.
    message: "{{ outputs.invoke_ai.textOutput ?? 'n/a' }}"

  - id: update_comment
    type: io.kestra.plugin.core.http.Request
    description: Post the triage proposal back to the Jira issue as a comment.
    method: POST
    uri: "{{ vars.jira_base_url }}/rest/api/3/issue/{{ outputs.log_issue.value | jq('.key') | first }}/comment"
    headers:
      Accept: "application/json"
      Authorization: "Basic {{ (secret('JIRA_EMAIL') ~ ':' ~ secret('JIRA_API_TOKEN')) | base64encode }}"
    body: |
      {
        "body": {
          "type": "doc",
          "version": 1,
          "content": [{
            "type": "paragraph",
            "content": [{
              "type": "text",
              "text": {{ (outputs.invoke_ai.textOutput ?? 'n/a') | json }}
            }]
          }]
        }
      }

triggers:
  - id: jira_issue
    type: io.kestra.plugin.core.trigger.Webhook
    description: A Jira automation rule or webhook posts new issues here.
    key: "{{ secret('JIRA_WEBHOOK_KEY') }}"

pluginDefaults:
  - type: io.kestra.plugin.ai.provider.GoogleGemini
    values:
      apiKey: "{{ secret('GEMINI_API_KEY') }}"

extend:
  shortDescription: Triage new Jira issues with RAG-grounded Gemini answers and write the proposed resolution back to the ticket as a comment.
  title: AI ITOps Triage for Jira Issues with RAG
  metaTitle: Jira Issue Triage with RAG and Gemini in Kestra
  metaDescription: Webhook-driven Jira triage that embeds your ops playbook, retrieves relevant guidance with RAG, asks Gemini for triage steps, and comments on the issue.
  description: |
    Close the loop between a new Jira ticket and a first actionable response. This Kestra blueprint listens for Jira issue webhooks, extracts the relevant fields with `jq`, grounds Google Gemini in your operations playbook through RAG, and posts the AI-proposed triage steps straight back onto the issue as a comment. Engineers open the ticket and find risk assessment, work notes, and a proposed resolution already waiting, written from your own runbooks rather than generic model knowledge.

    ## How it works
    1. The `jira_issue` trigger (`io.kestra.plugin.core.trigger.Webhook`) receives the issue-created payload from a Jira automation rule, secured by `JIRA_WEBHOOK_KEY`.
    2. The `log_issue` task (`io.kestra.plugin.core.debug.Return`) uses a `jq` expression to project the payload down to id, key, summary, description, reporter, and priority.
    3. The `ingest_kb` task (`io.kestra.plugin.ai.rag.IngestDocument`) splits the inline playbook stub by paragraph (1024 char segments, 512 overlap) and embeds it with `gemini-embedding-001` into `io.kestra.plugin.ai.embeddings.KestraKVStore`.
    4. The `invoke_ai` task (`io.kestra.plugin.ai.rag.ChatCompletion`) retrieves matching playbook segments and asks `gemini-2.5-flash` for a concise summary, work notes, and a proposed resolution with mandatory Risk, Steps, and Verification sections.
    5. The `update_comment` task (`io.kestra.plugin.core.http.Request`) POSTs the answer to the Jira REST API v3 comment endpoint as an Atlassian Document Format body, authenticated with basic auth built from `JIRA_EMAIL` and `JIRA_API_TOKEN`.

    ## What you get
    - Every new issue gets a structured first response inside the ticket itself, no context switching.
    - Answers grounded in your provisioning, token rotation, outage, and disk playbooks.
    - Deterministic field extraction from noisy webhook payloads via `jq`.
    - A full audit trail in Kestra of what the model saw and what it recommended.

    ## Who it's for
    - IT operations teams drowning in repetitive access, token, and outage tickets.
    - SRE teams that want runbook-consistent first responses on every incident ticket.
    - Platform teams piloting AI assistance inside their existing Jira workflow.

    ## Why orchestrate this with Kestra
    Jira automation rules can call a webhook, but they cannot run a RAG pipeline, manage embeddings, or keep an auditable record of model inputs and outputs. Kestra turns the whole loop into declarative YAML: the `io.kestra.plugin.ai` plugin makes document ingestion and retrieval-augmented chat first-class tasks, `pluginDefaults` keeps the Gemini API key in one place, secrets stay out of the flow definition, and every execution links the incoming payload, retrieved context, and posted comment. Swap the model, the vector store, or the ticketing system without rewriting glue code.

    ## Prerequisites
    - A Jira Cloud site with an automation rule or webhook that fires on issue creation.
    - A Jira API token for a service account allowed to comment on issues.
    - A Google AI Studio API key with access to Gemini chat and embedding models.
    - Update the `jira_base_url` variable to your Atlassian domain.

    ### Secrets
    - `GEMINI_API_KEY`: Google Gemini API key for embeddings and chat.
    - `JIRA_EMAIL`: email of the Jira service account used for basic auth.
    - `JIRA_API_TOKEN`: Jira API token paired with the email.
    - `JIRA_WEBHOOK_KEY`: shared secret guarding the `Webhook` trigger.

    ## Quick start
    1. Add the secrets above to your Kestra namespace and set `jira_base_url`.
    2. Replace the inline playbook stub in `ingest_kb` with your real knowledge base.
    3. Create a Jira automation rule: on issue created, send the webhook to the flow URL with the configured key.
    4. Create a test issue such as "cannot log in to Grafana" and watch the triage comment appear.

    ## How to extend
    - Move KB ingestion to a scheduled flow so ticket triage skips re-embedding.
    - Route by priority with `io.kestra.plugin.core.flow.If`: page on-call for P1, comment only for P3.
    - Use the Jira plugin task `io.kestra.plugin.jira.issues.CreateComment` in place of the raw HTTP call.
    - Add label or component updates alongside the comment to auto-categorize tickets.
    - Swap `KestraKVStore` for pgvector or Elasticsearch for larger playbooks.

    ## Links
    - Kestra AI plugin docs: https://kestra.io/plugins/plugin-ai
    - Jira plugin docs: https://kestra.io/plugins/plugin-jira
  tags:
    - AI
  ee: false
  demo: false
