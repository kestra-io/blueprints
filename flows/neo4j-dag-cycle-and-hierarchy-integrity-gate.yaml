id: neo4j-dag-cycle-and-hierarchy-integrity-gate
namespace: company.data

description: |
  Detects directed cycle breaches in Neo4j hierarchy graphs via variable-length Cypher traversal,
  persists a JSON audit certificate of every detected cycle, and conditionally severs the culprit
  closing back-edges to restore the Directed Acyclic Graph invariant.

inputs:
  - id: neo4j_url
    type: STRING
    displayName: Neo4j Bolt URL
    defaults: "bolt://localhost:7687"
    description: Bolt protocol endpoint for the target Neo4j instance.

  - id: target_label
    type: SELECT
    displayName: Target Hierarchy Node Label
    defaults: "OrgUnit"
    values:
      - "OrgUnit"
      - "Role"
      - "Component"
      - "Entity"
      - "Group"
      - "Task"
    description: Node label representing entities within the strict hierarchy or dependency graph.

  - id: relationship_type
    type: SELECT
    displayName: Hierarchy Relationship Type
    defaults: "INHERITS"
    values:
      - "INHERITS"
      - "PARENT_OF"
      - "DEPENDS_ON"
      - "PART_OF"
      - "REPORTS_TO"
    description: Directed relationship type that must satisfy the Directed Acyclic Graph (DAG) invariant.

  - id: max_search_depth
    type: INT
    displayName: Maximum Cycle Search Depth
    defaults: 8
    description: Upper bound of hops evaluated for cyclic traversals. Prevents runaway path expansion on deep trees.

  - id: max_cycles_to_report
    type: INT
    displayName: Maximum Cycles to Report
    defaults: 25
    description: Caps the number of distinct cyclic loops captured in the audit certificate per execution.

  - id: auto_sever_cycle
    type: SELECT
    displayName: Auto Sever Culprit Closing Edges
    defaults: "false"
    values:
      - "false"
      - "true"
    description: When true and dry_run is false, automatically deletes the closing back-edge relationship to break detected cycles.

  - id: dry_run
    type: SELECT
    displayName: Dry Run Execution Mode
    defaults: "true"
    values:
      - "true"
      - "false"
    description: Must be explicitly set to false along with auto_sever_cycle true for any relationship deletion to execute.

triggers:
  - id: daily_hierarchy_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 4 * * *"
    disabled: true

tasks:
  - id: detect_cycles
    type: io.kestra.plugin.neo4j.Query
    description: >-
      Executes variable-length Cypher traversal to detect closed directed cycles.
      Uses elementId filtering on internal path nodes to ensure each distinct cycle
      is captured exactly once anchored at its minimum node identifier.
    url: "{{ inputs.neo4j_url }}"
    username: "{{ secret('NEO4J_USERNAME') }}"
    password: "{{ secret('NEO4J_PASSWORD') }}"
    storeType: FETCH
    query: |
      MATCH path = (n:{{ inputs.target_label }})-[r:{{ inputs.relationship_type }}*1..{{ inputs.max_search_depth }}]->(n)
      WHERE all(m IN nodes(path)[1..-1] WHERE elementId(m) > elementId(n))
      WITH n, path, length(path) AS cycle_length,
           [node IN nodes(path) | coalesce(node.name, node.id, elementId(node))] AS path_nodes,
           [rel IN relationships(path) | elementId(rel)] AS path_rel_ids
      RETURN elementId(n) AS anchor_node_id,
             cycle_length,
             path_nodes,
             path_rel_ids,
             last(path_rel_ids) AS culprit_closing_edge_id
      ORDER BY cycle_length ASC, anchor_node_id ASC
      LIMIT {{ inputs.max_cycles_to_report }}

  - id: evaluate_integrity
    type: io.kestra.plugin.core.output.OutputValues
    description: Computes hierarchy integrity status, cycle metrics, and extracts closing back-edge identifiers for targeted remediation.
    values:
      cycles_found: "{{ outputs.detect_cycles.size ?? 0 }}"
      status: "{{ (outputs.detect_cycles.size ?? 0) > 0 ? 'CYCLE_BREACH' : 'DAG_VALID' }}"
      culprit_edge_ids: "{{ (outputs.detect_cycles.size ?? 0) > 0 ? (outputs.detect_cycles.rows | jq('[.[].culprit_closing_edge_id]') | first) : [] }}"
      worst_cycle_length: "{{ (outputs.detect_cycles.size ?? 0) > 0 ? (outputs.detect_cycles.rows | jq('min_by(.cycle_length) | .cycle_length') | first) : 0 }}"

  - id: route_integrity_verdict
    type: io.kestra.plugin.core.flow.Switch
    description: Routes execution based on whether directed cycles breach the DAG invariant.
    value: "{{ outputs.evaluate_integrity.values.status }}"
    cases:
      CYCLE_BREACH:
        - id: generate_audit_certificate
          type: io.kestra.plugin.core.storage.Write
          description: Writes a machine-readable JSON hierarchy audit certificate containing the detected cycle traces to Kestra internal storage.
          extension: .json
          content: |
            {
              "audit_timestamp": "{{ execution.startDate }}",
              "target_label": "{{ inputs.target_label }}",
              "relationship_type": "{{ inputs.relationship_type }}",
              "cycles_detected": {{ outputs.evaluate_integrity.values.cycles_found }},
              "shortest_cycle_length": {{ outputs.evaluate_integrity.values.worst_cycle_length }},
              "culprit_closing_edge_ids": {{ outputs.evaluate_integrity.values.culprit_edge_ids | toJson }},
              "cycle_traces": {{ outputs.detect_cycles.rows | toJson }}
            }

        - id: check_remediation_gate
          type: io.kestra.plugin.core.flow.If
          description: Safely severs culprit closing back-edges when auto_sever_cycle is enabled and dry_run is disabled.
          condition: "{{ inputs.auto_sever_cycle == 'true' and inputs.dry_run == 'false' }}"
          then:
            - id: sever_culprit_closing_edges
              type: io.kestra.plugin.neo4j.Query
              description: >-
                Deletes only the culprit closing relationships identified in the audit certificate,
                breaking every detected directed cycle while strictly preserving all node entities
                and non-cyclical hierarchy branches.
              url: "{{ inputs.neo4j_url }}"
              username: "{{ secret('NEO4J_USERNAME') }}"
              password: "{{ secret('NEO4J_PASSWORD') }}"
              storeType: FETCHONE
              query: |
                UNWIND {{ outputs.evaluate_integrity.values.culprit_edge_ids | toJson }} AS closing_rel_id
                MATCH ()-[r:{{ inputs.relationship_type }}]->()
                WHERE elementId(r) = closing_rel_id
                DELETE r
                RETURN count(closing_rel_id) AS severed_count

            - id: verify_dag_restored
              type: io.kestra.plugin.neo4j.Query
              description: Re-runs the cycle detection check to verify that directed cycles have been eliminated.
              url: "{{ inputs.neo4j_url }}"
              username: "{{ secret('NEO4J_USERNAME') }}"
              password: "{{ secret('NEO4J_PASSWORD') }}"
              storeType: FETCHONE
              query: |
                MATCH path = (n:{{ inputs.target_label }})-[r:{{ inputs.relationship_type }}*1..{{ inputs.max_search_depth }}]->(n)
                RETURN count(path) AS remaining_cycles

            - id: log_remediation_audit
              type: io.kestra.plugin.core.log.Log
              message: >-
                Remediation applied to Neo4j {{ inputs.target_label }}: severed {{ outputs.sever_culprit_closing_edges.row.severed_count }} closing edge(s).
                Remaining cycles: {{ outputs.verify_dag_restored.row.remaining_cycles }}.
                Audit certificate: {{ outputs.generate_audit_certificate.uri }}.

        - id: alert_cycle_breach_slack
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: Dispatches an incident alert to Slack with cycle path lengths, affected node IDs, and audit certificate URI.
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {{ {
              "text": "🚨 *Neo4j Hierarchy DAG Cycle Breach Detected*\n\n" ~
                      "• *Target Label*: `" ~ inputs.target_label ~ "`\n" ~
                      "• *Relationship*: `[:" ~ inputs.relationship_type ~ "]`\n" ~
                      "• *Cycles Detected*: " ~ outputs.evaluate_integrity.values.cycles_found ~ "\n" ~
                      "• *Shortest Cycle Length*: " ~ outputs.evaluate_integrity.values.worst_cycle_length ~ " hops\n" ~
                      "• *Remediation Mode*: " ~ (inputs.auto_sever_cycle == 'true' and inputs.dry_run == 'false' ? 'AUTOMATICALLY SEVERED' : 'DRY RUN / MANUAL INTERVENTION REQUIRED') ~ "\n" ~
                      "• *Audit Certificate*: `" ~ outputs.generate_audit_certificate.uri ~ "`\n\n" ~
                      "Recursive hierarchy queries may freeze or exhaust memory until resolved."
            } | toJson }}

      DAG_VALID:
        - id: log_dag_healthy
          type: io.kestra.plugin.core.log.Log
          message: >-
            Neo4j hierarchy integrity verified: 0 directed cycles detected for label {{ inputs.target_label }}
            along [:{{ inputs.relationship_type }}] up to depth {{ inputs.max_search_depth }}. Directed Acyclic Graph invariant intact.

    defaults:
      - id: log_unexpected_state
        type: io.kestra.plugin.core.log.Log
        message: "Unexpected hierarchy evaluation status: {{ outputs.evaluate_integrity.values.status }}"

errors:
  - id: alert_execution_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alerts the data engineering team if the Neo4j query or credentials fail during execution.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {{ {
        "text": "❌ *Neo4j Hierarchy Integrity Gate Failed*\n\n" ~
                "Execution `" ~ execution.id ~ "` failed while auditing `" ~ inputs.target_label ~ "` hierarchies on `" ~ inputs.neo4j_url ~ "`. Check Kestra execution logs for driver connection or query errors."
      } | toJson }}

extend:
  title: Neo4j DAG Cycle Breach and Hierarchy Integrity Gate
  metaTitle: Neo4j DAG Cycle Detection and Hierarchy Integrity Gate | Kestra
  shortDescription: Detect directed cycle breaches in Neo4j hierarchy graphs, persist JSON audit certificates, and conditionally sever culprit back-edges.
  metaDescription: Audit Neo4j graphs for hierarchy DAG cycle breaches, generate audit certificates, sever culprit closing edges, and alert engineering on circular references.
  description: |
    Hierarchical graphs modeled in Neo4j, such as role-based access control (RBAC) inheritance structures, organizational reporting lines, task dependency networks, and manufacturing bills of materials (BOM), strictly depend on the Directed Acyclic Graph (DAG) mathematical invariant. Upstream batch data syncs, asynchronous event streams, or manual admin edits frequently introduce accidental circular dependencies (e.g., node A -> node B -> node C -> node A). When downstream services or analytical pipelines execute recursive Cypher traversals (such as `MATCH (r)-[:INHERITS*]->(p)`), these circular references trigger unbounded iterations, transaction timeouts, thread pool starvation, and catastrophic Java Virtual Machine Out-Of-Memory (OOM) cluster crashes.

    This blueprint provides an automated, production-grade integrity gate for Neo4j hierarchies. It executes variable-length Cypher cycle detection queries using path isomorphism constraints, produces an immutable audit certificate in Kestra internal storage, alerts platform teams via Slack with exact cyclic traces, and conditionally severs the culprit closing back-edge while preserving legitimate hierarchy nodes and parent branches.

    ## How it works

    1. **Trigger and Scheduled Evaluation**: Runs on an automated daily schedule at 04:00 UTC via `io.kestra.plugin.core.trigger.Schedule`, or on demand after batch ETL syncs via manual invocation or webhook.
    2. **Variable-Length Cycle Discovery**: Task `detect_cycles` (`io.kestra.plugin.neo4j.Query`) evaluates paths of depth `1..max_search_depth` where start node equals end node. An interior node constraint (`WHERE all(m IN nodes(path)[1..-1] WHERE elementId(m) > elementId(n))`) guarantees that each distinct directed cycle is returned exactly once anchored at its minimal node ID, preventing duplicate counting.
    3. **Integrity Metric Classification**: Task `evaluate_integrity` (`io.kestra.plugin.core.output.OutputValues`) computes the total count of cycles detected, identifies the shortest cycle length, extracts closing relationship element IDs, and sets the routing status to either `CYCLE_BREACH` or `DAG_VALID`.
    4. **Conditional Routing**: Task `route_integrity_verdict` (`io.kestra.plugin.core.flow.Switch`) inspects the integrity verdict:
       - **CYCLE_BREACH**:
         - `generate_audit_certificate` (`io.kestra.plugin.core.storage.Write`) persists an immutable JSON audit certificate into Kestra internal storage recording the timestamp, audited labels, cycle count, and complete path traces.
         - `check_remediation_gate` (`io.kestra.plugin.core.flow.If`) validates whether `auto_sever_cycle` is set to `"true"` and `dry_run` is set to `"false"`. If enabled, task `sever_culprit_closing_edges` (`io.kestra.plugin.neo4j.Query`) safely deletes only the closing back-edges identified in the audit certificate, leaving all entities intact. Next, `verify_dag_restored` re-audits the graph to confirm DAG restoration.
         - `alert_cycle_breach_slack` (`io.kestra.plugin.slack.notifications.SlackIncomingWebhook`) dispatches a high-priority incident notification to Slack with cycle metrics and storage URI.
       - **DAG_VALID**:
         - `log_dag_healthy` (`io.kestra.plugin.core.log.Log`) logs confirmation that zero cycles were detected across the hierarchy.
    5. **Failure Safeguard**: The `errors` handler captures driver connection timeouts or authentication failures and posts an urgent Slack notification to on-call data engineers.

    ## What you get

    - **Automated DAG Invariant Enforcement**: Proactively detects circular hierarchy references before recursive analytical queries fail or trigger JVM heap exhaustion.
    - **Safe Back-Edge Remediation**: Eliminates cycles by deleting only the specific closing edge that formed the loop, preserving all existing node properties and valid ancestor paths.
    - **Immutable JSON Audit Certificates**: Retains structured forensic records of all cycle incidents in Kestra internal storage for compliance and root-cause analysis.
    - **Dry-Run Protection**: Defaults to dry-run mode (`dry_run: "true"`, `auto_sever_cycle: "false"`), guaranteeing no destructive relationship mutations occur without explicit administrative authorization.
    - **Dual-Mode Alerting**: Sends Slack incident alerts on cycle detection and pipeline failures.

    ## Who it's for

    - **Graph Database Administrators & Platform Engineers**: Responsible for Neo4j cluster stability, heap health, and preventing runaway recursive query saturation.
    - **Data Platform & Analytics Engineers**: Maintaining master data management (MDM) hierarchies, RBAC role assignment graphs, and dependency models.
    - **Data Governance & Compliance Teams**: Enforcing organizational hierarchy integrity and auditing structural relationship anomalies.

    ## Why orchestrate this with Kestra

    Detecting and remediating graph cycles through one-off shell scripts or isolated cron jobs creates visibility blind spots: scripts fail silently on network blips, lack audit trails of severed relationships, and expose database credentials.

    Orchestrating this process with Kestra delivers:
    - **Declarative Hierarchy Governance**: Model the complete audit, certificate generation, conditional remediation, and notification flow as version-controlled YAML.
    - **Granular Execution Lineage**: Inspect the Gantt chart to review exact Cypher query timings, row counts, and decision branches.
    - **Internal Storage Integration**: Store forensic JSON certificates directly in Kestra internal storage without requiring external S3 or Blob storage buckets.
    - **Secure Credential Masking**: Protect Neo4j basic-auth credentials and Slack webhooks using native Kestra secret management (`{{ secret('NAME') }}`).

    ## Prerequisites

    - A running Neo4j 5.x instance (Community or Enterprise edition, self-hosted or Dockerized).
    - Network connectivity from the Kestra worker to the Neo4j Bolt port (`bolt://localhost:7687`).
    - Read and write permissions on the target Neo4j database if automatic remediation is enabled.
    - An incoming Slack webhook URL for operational alerting.

    ### Secrets

    - `NEO4J_USERNAME`: Neo4j database user with query and relationship delete privileges (e.g., `neo4j`).
    - `NEO4J_PASSWORD`: Password for the Neo4j database user.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL for posting integrity incident alerts.

    ## Quick start

    1. Deploy a local Neo4j instance for testing:
       ```bash
       docker run -d --name neo4j-test \
         -p 7474:7474 -p 7687:7687 \
         -e NEO4J_AUTH=neo4j/testpassword123 \
         neo4j:5-community
       ```
    2. Populate a sample hierarchy with an intentional cycle:
       ```cypher
       CREATE (a:OrgUnit {id: 'eng', name: 'Engineering'}),
              (b:OrgUnit {id: 'dev', name: 'Development'}),
              (c:OrgUnit {id: 'qa', name: 'QA'})
       CREATE (a)-[:INHERITS]->(b),
              (b)-[:INHERITS]->(c),
              (c)-[:INHERITS]->(a);
       ```
    3. Configure the required secrets in your Kestra namespace:
       - `NEO4J_USERNAME`: `neo4j`
       - `NEO4J_PASSWORD`: `testpassword123`
       - `SLACK_WEBHOOK_URL`: `https://hooks.slack.com/services/...`
    4. Execute the flow in `dry_run: "true"` mode to verify cycle detection without mutating edges.
    5. Review the execution outputs and inspect the generated JSON audit certificate in Kestra internal storage.
    6. Run with `dry_run: "false"` and `auto_sever_cycle: "true"` to confirm that the closing edge is severed and the hierarchy is restored to a valid DAG.

    ## How to extend

    - **Quarantine Edge Relabeling**: Instead of directly deleting the closing edge, alter the Cypher remediation step to delete `[:INHERITS]` and recreate it as a `[:QUARANTINED_CYCLE_EDGE]` with an `incident_id` property for manual human triage.
    - **Webhook Event Trigger**: Add a `io.kestra.plugin.core.trigger.Webhook` trigger to automatically invoke this integrity gate immediately after upstream dbt or Kafka batch sync jobs finish.
    - **Jira Incident Escalation**: Integrate `io.kestra.plugin.jira.issues.Create` to automatically open a bug ticket assigned to the data steward owning the affected entity.
    - **Multi-Tenant Hierarchy Iteration**: Wrap the cycle query inside a `io.kestra.plugin.core.flow.Loop` loop across all distinct business units or tenant graph partitions.

    ## Links

    - [Kestra Neo4j Plugin Documentation](https://kestra.io/plugins/plugin-neo4j)
    - [Neo4j Cypher Path Patterns & Traversals](https://neo4j.com/docs/cypher-manual/current/patterns/)
    - [Kestra Flowable Switch Task Documentation](https://kestra.io/plugins/core/tasks/flow/io.kestra.plugin.core.flow.switch)
    - [Kestra Storage Write Task Documentation](https://kestra.io/plugins/core/tasks/storage/io.kestra.plugin.core.storage.write)
