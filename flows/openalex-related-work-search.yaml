id: openalex-related-work-search
namespace: company.team
description: |
  Search OpenAlex for related scholarly works, inspect the response with DuckDB,
  and export a compact CSV artifact. Run it from the UI with a search query or
  call the keyed webhook with a JSON query.

triggers:
  - id: search_webhook
    type: io.kestra.plugin.core.trigger.Webhook
    description: Start a search from another workflow or application. The caller supplies a JSON body with a `query` field.
    key: "{{ secret('OPENALEX_WEBHOOK_KEY') }}"

inputs:
  - id: search_query
    type: STRING
    defaults: workflow orchestration
    description: Free-text OpenAlex search used by UI executions. A `query` field in the webhook request body overrides this value when supplied.

tasks:
  - id: download_works
    type: io.kestra.plugin.core.http.Download
    description: Fetch up to 25 matching works from the public OpenAlex Works API. OpenAlex encodes the search query as a request parameter; no API key is required for this request.
    uri: https://api.openalex.org/works
    params:
      search: "{{ ((trigger.body.query ?? '') | trim) | default(inputs.search_query) }}"
      per_page: "25"
      select: "id,doi,display_name,publication_date,cited_by_count"

  - id: count_matches
    type: io.kestra.plugin.jdbc.duckdb.Query
    description: Read OpenAlex's total match count from the downloaded JSON response so the flow can report an empty search cleanly.
    inputFiles:
      openalex-response.json: "{{ outputs.download_works.uri }}"
    sql: |
      SELECT CAST(json_extract_string(response.json, '$.meta.count') AS BIGINT) AS total_matches
      FROM read_json_objects('openalex-response.json', format = 'unstructured') AS response;
    fetchType: FETCH_ONE

  - id: check_for_results
    type: io.kestra.plugin.core.flow.If
    description: Log whether OpenAlex found any matches. DuckDB writes the CSV afterward in either case.
    condition: "{{ outputs.count_matches.row.total_matches > 0 }}"
    then:
      - id: log_matches_found
        type: io.kestra.plugin.core.log.Log
        description: Report the total number of OpenAlex matches. The CSV contains at most the first 25 works returned by the API.
        message: "OpenAlex found {{ outputs.count_matches.row.total_matches }} works for '{{ ((trigger.body.query ?? '') | trim) | default(inputs.search_query) }}'. Exporting up to 25."
    else:
      - id: log_no_matches
        type: io.kestra.plugin.core.log.Log
        description: Make a zero-match search visible in the execution logs.
        message: "OpenAlex found no works for '{{ ((trigger.body.query ?? '') | trim) | default(inputs.search_query) }}'. The CSV export will contain no data rows."

  - id: shape_results
    type: io.kestra.plugin.jdbc.duckdb.Query
    description: Flatten the Works response and write the selected fields to a CSV artifact, including a header when there are no matches.
    inputFiles:
      openalex-response.json: "{{ outputs.download_works.uri }}"
    outputFiles:
      - openalex-results.csv
    sql: |
      COPY (
        SELECT
          json_extract_string(work.value, '$.id') AS openalex_id,
          json_extract_string(work.value, '$.display_name') AS title,
          json_extract_string(work.value, '$.doi') AS doi,
          json_extract_string(work.value, '$.publication_date') AS publication_date,
          CAST(json_extract_string(work.value, '$.cited_by_count') AS BIGINT) AS cited_by_count
        FROM read_json_objects('openalex-response.json', format = 'unstructured') AS response,
             json_each(response.json, '$.results') AS work
        ORDER BY cited_by_count DESC NULLS LAST,
                 publication_date DESC NULLS LAST
      ) TO '{{ outputFiles["openalex-results.csv"] }}'
      (HEADER, DELIMITER ',');

outputs:
  - id: csv_uri
    type: URI
    displayName: OpenAlex results CSV
    description: URI of the CSV artifact with up to 25 works and their OpenAlex ID, title, DOI, publication date, and citation count.
    value: "{{ outputs.shape_results.outputFiles['openalex-results.csv'] }}"

extend:
  shortDescription: Search OpenAlex for related scholarly works, shape the response with DuckDB, and export a CSV.
  title: Search OpenAlex for Related Scholarly Works
  metaTitle: Search OpenAlex Works with Kestra and DuckDB
  metaDescription: Search OpenAlex from a Kestra webhook or manual input, inspect matches with DuckDB, and export up to 25 scholarly works to CSV.
  description: |
    Find related papers with the public OpenAlex Works API and turn the results into a small, reusable research dataset. Run the flow manually with a search query, or POST a query to its keyed webhook. Kestra downloads the API response, DuckDB checks the total match count, flattens the returned works, and writes a spreadsheet-ready CSV artifact.

    ## How it works

    1. `search_webhook` (`io.kestra.plugin.core.trigger.Webhook`) accepts a JSON request body with a `query` string. The key comes from the `OPENALEX_WEBHOOK_KEY` Kestra secret.
    2. `download_works` (`io.kestra.plugin.core.http.Download`) calls `https://api.openalex.org/works` with OpenAlex's `search`, `per_page`, and `select` parameters. The response is limited to 25 works and five useful fields; this basic API request does not need an OpenAlex API key.
    3. `count_matches` (`io.kestra.plugin.jdbc.duckdb.Query`) reads `meta.count` from the downloaded JSON. `check_for_results` (`io.kestra.plugin.core.flow.If`) logs either the total match count or that the search was empty.
    4. `shape_results` uses DuckDB's JSON table function to flatten the first page into one row per work, ordered by citation count and publication date, and writes the results directly to the `openalex-results.csv` artifact. DuckDB includes the column header even when a search returns no rows.

    ## Prerequisites

    - A running Kestra instance with the HTTP and DuckDB JDBC plugins available.
    - Outbound HTTPS access from the Kestra worker to `api.openalex.org`.

    ### Secrets

    - `OPENALEX_WEBHOOK_KEY`: a caller-chosen secret value used in the webhook URL. It is required for webhook calls; manual UI executions only need the `search_query` input.
    - No OpenAlex API key or other API credential is required.

    ### Inputs

    - `search_query` (STRING, default `workflow orchestration`): free-text search used for a manual UI execution. A webhook request's non-empty `query` field takes precedence.

    ### Webhook request

    Send a POST request to the trigger URL shown by Kestra, including the configured webhook key, with a JSON body such as:

    ```json
    {"query": "workflow orchestration"}
    ```

    ### Outputs

    - `{{ outputs.csv_uri }}` and `{{ outputs.shape_results.outputFiles['openalex-results.csv'] }}`: CSV artifact in Kestra internal storage, with up to 25 rows and the columns `openalex_id`, `title`, `doi`, `publication_date`, and `cited_by_count`.
    - The `check_for_results` task logs OpenAlex's total match count. A search with zero matches still produces a CSV containing the column header and no data rows.

    ## Quick start

    1. Add `OPENALEX_WEBHOOK_KEY` to your Kestra secrets if you plan to call the webhook.
    2. Import this flow and run it manually with a search query, or copy the webhook URL from the trigger and POST the JSON body above.
    3. Open the `shape_results` task output or the flow output `csv_uri` to download the results.

    ## Links

    - [OpenAlex API documentation](https://docs.openalex.org/api-entities/works)
    - [Kestra HTTP Download task documentation](https://kestra.io/plugins/core/http/io.kestra.plugin.core.http.download)
    - [Kestra DuckDB plugin documentation](https://kestra.io/plugins/plugin-jdbc-duckdb)
  tags:
    - Data
  subTags:
    - File & Data Processing Basics
  ee: false
  demo: true
