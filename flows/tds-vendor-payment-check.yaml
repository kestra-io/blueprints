id: tds-vendor-payment-check
namespace: company.team
description: |
  Check vendor payments for missed or short TDS under section 393 of the Income-tax
  Act, 2025 (the old sections 194C and 194J): contractor and professional or technical
  fee thresholds per vendor for the tax year, the right rate from the PAN, the 20%
  no-PAN rate, interest on shortfalls, and the deposit and Form 140 due dates.

inputs:
  - id: payments
    type: FILE
    required: false
    description: CSV of vendor payments with the columns payment_id, vendor_id, payment_date, amount, nature (contractor, professional, technical or director) and tds_deducted. Leave empty to use the built-in sample.
  - id: vendor_master
    type: FILE
    required: false
    description: CSV of vendors with the columns vendor_id, vendor_name, pan and transporter_declaration (yes when a transporter has declared it owns 10 or fewer goods carriages). Leave empty to use the built-in sample.
  - id: as_of
    type: STRING
    required: false
    description: Date to compute interest up to, as YYYY-MM-DD. Leave empty to use today.
  - id: notify_slack
    type: BOOL
    defaults: false
    description: Post the findings to Slack when TDS was missed or short. Requires the SLACK_WEBHOOK_URL secret.

triggers:
  - id: monthly_before_deposit
    type: io.kestra.plugin.core.trigger.Schedule
    description: Check on the 3rd of every month at 10:00 IST, four days before TDS for the previous month must be deposited. Shipped disabled; enable it once the flow reads your real payments and vendor master.
    cron: "0 10 3 * *"
    timezone: Asia/Kolkata
    disabled: true

tasks:
  - id: sample_payments
    type: io.kestra.plugin.core.storage.Write
    description: Sixteen payments in tax year 2026-27 with one example of every case the check handles. Only used when payments is empty.
    extension: .csv
    content: |
      payment_id,vendor_id,payment_date,amount,nature,tds_deducted
      P01,V01,2026-04-12,25000,contractor,0
      P02,V01,2026-05-18,28000,contractor,0
      P03,V01,2026-07-02,29000,contractor,0
      P04,V01,2026-08-21,26000,contractor,0
      P05,V02,2026-06-05,45000,contractor,450
      P06,V03,2026-05-09,40000,contractor,400
      P07,V04,2026-04-30,30000,professional,0
      P08,V04,2026-07-15,30000,professional,3000
      P09,V05,2026-06-01,60000,technical,6000
      P10,V06,2026-08-10,48000,professional,0
      P11,V07,2026-09-03,35000,contractor,0
      P12,V08,2026-09-14,52000,contractor,0
      P13,V09,2026-07-25,15000,director,0
      P14,V10,2026-08-28,64000,technical,1280
      P15,V11,2026-09-19,12000,contractor,0
      P16,V12,2026-09-25,90000,professional,9000

  - id: sample_vendor_master
    type: io.kestra.plugin.core.storage.Write
    description: The vendors the sample payments belong to. PANs are synthetic but well formed; the fourth letter is the holder type (P individual, H HUF, C company, F firm). Only used when vendor_master is empty.
    extension: .csv
    content: |
      vendor_id,vendor_name,pan,transporter_declaration
      V01,Sahyadri Housekeeping Services,AKTPS1234Q,
      V02,Kaveri Facility Management Pvt Ltd,AABCK5678M,
      V03,Ravi Electrical Works,BXRPR4321L,
      V04,Anitha Rao and Co Chartered Accountants,AAFFA9876C,
      V05,Deccan Cloud Systems Pvt Ltd,AADCD2468P,
      V06,Dr Meera Nair,BMNPN1357K,
      V07,Konkan Event Caterers,,
      V08,Thar Roadways,ATHPT8642R,yes
      V09,Suresh Iyer (independent director),AJIPI7531D,
      V10,Malabar Web Studio LLP,AAIFM1928J,
      V11,Shree Ganesh Tent House,AGSPG2468X,
      V12,Nilgiri Legal Associates,ABQFN7777Z9,

  - id: check_tds
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: Apply the thresholds per vendor, nature and tax year, pick the rate from the PAN, and compute the shortfall, interest and due dates in DuckDB without calling any external service. The per-payment report is exported to CSV and the last query returns the summary.
    inputFiles:
      payments.csv: "{{ inputs.payments ?? outputs.sample_payments.uri }}"
      vendors.csv: "{{ inputs.vendor_master ?? outputs.sample_vendor_master.uri }}"
    outputFiles:
      - tds_report.csv
    fetchType: FETCH_ONE
    sql: |
      CREATE TABLE params AS
      SELECT coalesce(TRY_CAST(NULLIF(trim('{{ inputs.as_of ?? '' }}'), '') AS DATE), current_date) AS as_of;

      CREATE TABLE vendors AS
      SELECT
        trim(vendor_id) AS vendor_id,
        trim(vendor_name) AS vendor_name,
        upper(trim(coalesce(pan, ''))) AS pan,
        lower(trim(coalesce(transporter_declaration, ''))) IN ('yes', 'y', 'true') AS small_transporter
      FROM read_csv('{{ workingDir }}/vendors.csv', header = true, all_varchar = true);

      CREATE TABLE payments AS
      SELECT
        trim(payment_id) AS payment_id,
        trim(vendor_id) AS vendor_id,
        TRY_CAST(payment_date AS DATE) AS payment_date,
        TRY_CAST(amount AS DECIMAL(15, 2)) AS amount,
        lower(trim(nature)) AS nature,
        coalesce(TRY_CAST(NULLIF(trim(tds_deducted), '') AS DECIMAL(15, 2)), 0) AS tds_deducted
      FROM read_csv('{{ workingDir }}/payments.csv', header = true, all_varchar = true);

      CREATE TABLE base AS
      SELECT
        p.*,
        v.vendor_name,
        v.pan,
        coalesce(v.small_transporter, false) AS small_transporter,
        regexp_full_match(coalesce(v.pan, ''), '[A-Z]{3}[ABCFGHJLPT][A-Z][0-9]{4}[A-Z]') AS pan_valid,
        CASE WHEN month(p.payment_date) >= 4 THEN year(p.payment_date) ELSE year(p.payment_date) - 1 END AS ty_start
      FROM payments AS p
      LEFT JOIN vendors AS v USING (vendor_id);

      CREATE TABLE totals AS
      SELECT vendor_id, nature, ty_start, sum(amount) AS year_total, max(amount) AS largest
      FROM base
      GROUP BY ALL;

      CREATE TABLE rated AS
      SELECT
        b.*,
        t.year_total,
        CASE
          WHEN b.nature = 'director' THEN true
          WHEN b.nature IN ('professional', 'technical') THEN t.year_total > 50000
          WHEN b.nature = 'contractor' THEN t.year_total > 100000 OR b.amount > 30000
          ELSE false
        END AS liable,
        CASE
          WHEN b.nature = 'contractor' AND b.small_transporter AND b.pan_valid THEN 0
          WHEN NOT b.pan_valid THEN 20
          WHEN b.nature = 'contractor' AND substr(b.pan, 4, 1) IN ('P', 'H') THEN 1
          WHEN b.nature = 'contractor' THEN 2
          WHEN b.nature = 'technical' THEN 2
          WHEN b.nature IN ('professional', 'director') THEN 10
          ELSE 0
        END AS rate_pct
      FROM base AS b
      JOIN totals AS t USING (vendor_id, nature, ty_start);

      CREATE TABLE report AS
      SELECT
        r.payment_id,
        r.vendor_id,
        coalesce(r.vendor_name, 'UNKNOWN VENDOR') AS vendor_name,
        r.pan,
        r.nature,
        r.payment_date,
        r.amount,
        r.year_total,
        r.rate_pct,
        CASE WHEN r.liable THEN round(r.amount * r.rate_pct / 100, 0) ELSE 0 END AS tds_expected,
        r.tds_deducted,
        greatest(CASE WHEN r.liable THEN round(r.amount * r.rate_pct / 100, 0) ELSE 0 END - r.tds_deducted, 0) AS shortfall,
        greatest(r.tds_deducted - CASE WHEN r.liable THEN round(r.amount * r.rate_pct / 100, 0) ELSE 0 END, 0) AS excess,
        CASE
          WHEN r.vendor_name IS NULL THEN 'CHECK_VENDOR'
          WHEN r.liable AND r.tds_deducted = 0 AND r.rate_pct > 0 THEN 'MISSED'
          WHEN r.liable AND r.tds_deducted < round(r.amount * r.rate_pct / 100, 0) THEN 'SHORT'
          WHEN r.tds_deducted > CASE WHEN r.liable THEN round(r.amount * r.rate_pct / 100, 0) ELSE 0 END THEN 'OVER'
          WHEN r.liable OR r.tds_deducted > 0 THEN 'OK'
          ELSE 'BELOW_THRESHOLD'
        END AS status,
        CASE WHEN month(r.payment_date) = 3 THEN make_date(year(r.payment_date), 4, 30)
             ELSE (date_trunc('month', r.payment_date) + INTERVAL 1 MONTH + INTERVAL 6 DAY)::DATE END AS deposit_due,
        CASE
          WHEN month(r.payment_date) BETWEEN 4 AND 6 THEN make_date(r.ty_start, 7, 31)
          WHEN month(r.payment_date) BETWEEN 7 AND 9 THEN make_date(r.ty_start, 10, 31)
          WHEN month(r.payment_date) BETWEEN 10 AND 12 THEN make_date(r.ty_start + 1, 1, 31)
          ELSE make_date(r.ty_start + 1, 5, 31)
        END AS form_140_due,
        concat_ws(' | ',
          CASE WHEN r.vendor_name IS NULL THEN 'vendor not in the master' END,
          CASE WHEN r.vendor_name IS NOT NULL AND NOT r.pan_valid THEN 'PAN missing or malformed: 20% rate applies' END,
          CASE WHEN r.nature = 'contractor' AND r.liable AND r.amount <= 30000 THEN 'year total for this vendor passed Rs 1 lakh, so every contract payment is covered' END,
          CASE WHEN r.nature IN ('professional', 'technical') AND r.liable THEN 'year total passed Rs 50,000' END,
          CASE WHEN r.nature = 'contractor' AND r.small_transporter AND r.pan_valid THEN 'transporter with 10 or fewer goods carriages and PAN: no TDS' END,
          CASE WHEN r.nature = 'director' THEN 'director fees: no threshold' END
        ) AS notes
      FROM rated AS r;

      CREATE TABLE report2 AS
      SELECT
        r.*,
        CASE WHEN r.shortfall > 0 THEN round(r.shortfall * 0.01 * ceil(greatest(date_diff('day', r.payment_date, p.as_of), 1) / 30.0), 0) ELSE 0 END AS interest_estimate
      FROM report AS r
      CROSS JOIN params AS p;

      COPY (
        SELECT *
        FROM report2
        ORDER BY CASE status WHEN 'MISSED' THEN 1 WHEN 'SHORT' THEN 2 WHEN 'OVER' THEN 3 WHEN 'CHECK_VENDOR' THEN 4 WHEN 'OK' THEN 5 ELSE 6 END, payment_date
      ) TO '{{ outputFiles["tds_report.csv"] }}' (HEADER, DELIMITER ',');

      SELECT
        (SELECT as_of FROM params)::VARCHAR AS as_of,
        count(*) AS total_payments,
        count(*) FILTER (WHERE status = 'MISSED') AS missed_count,
        count(*) FILTER (WHERE status = 'SHORT') AS short_count,
        coalesce(sum(shortfall), 0) AS shortfall_total,
        coalesce(sum(interest_estimate), 0) AS interest_estimate_total,
        count(DISTINCT vendor_id) FILTER (WHERE shortfall > 0) AS vendors_affected,
        count(*) FILTER (WHERE status = 'OVER') AS over_count,
        coalesce(sum(excess), 0) AS excess_total,
        coalesce(string_agg(payment_id || ' ' || vendor_name || ': Rs ' || excess || ' more than needed at ' || rate_pct || '%', ' | ') FILTER (WHERE status = 'OVER'), '') AS over_details,
        coalesce(string_agg(payment_id || ' ' || vendor_name || ' ' || nature || ': Rs ' || shortfall || ' (' || status || ')', ' | ' ORDER BY shortfall DESC) FILTER (WHERE shortfall > 0), '') AS shortfall_details,
        coalesce(string_agg(DISTINCT vendor_name, ', ') FILTER (WHERE pan IS NULL OR NOT regexp_full_match(coalesce(pan, ''), '[A-Z]{3}[ABCFGHJLPT][A-Z][0-9]{4}[A-Z]')), '') AS vendors_without_valid_pan,
        coalesce(min(form_140_due) FILTER (WHERE form_140_due >= (SELECT as_of FROM params))::VARCHAR, '') AS next_form_140_due
      FROM report2;

  - id: route_findings
    type: io.kestra.plugin.core.flow.If
    description: Branch on the result. Missed and short deductions are logged with the amounts to deposit, and optionally sent to Slack; a clean run is logged so the execution history shows every monthly check.
    condition: "{{ outputs.check_tds.outputs[0].row.shortfall_total > 0 }}"
    then:
      - id: log_findings
        type: io.kestra.plugin.core.log.Log
        level: WARN
        message: |
          TDS to fix (as of {{ outputs.check_tds.outputs[0].row.as_of }}): {{ outputs.check_tds.outputs[0].row.missed_count }} payments missed, {{ outputs.check_tds.outputs[0].row.short_count }} short, Rs {{ outputs.check_tds.outputs[0].row.shortfall_total }} in total across {{ outputs.check_tds.outputs[0].row.vendors_affected }} vendors.
          Interest estimate (1% a month or part of a month): Rs {{ outputs.check_tds.outputs[0].row.interest_estimate_total }}
          {{ outputs.check_tds.outputs[0].row.shortfall_details }}
          Deducted more than needed (correct and refund the vendor): {{ outputs.check_tds.outputs[0].row.over_details }}
          Vendors without a valid PAN (20% rate): {{ outputs.check_tds.outputs[0].row.vendors_without_valid_pan }}
          Next Form 140 return due: {{ outputs.check_tds.outputs[0].row.next_form_140_due }}
      - id: slack_enabled
        type: io.kestra.plugin.core.flow.If
        condition: "{{ inputs.notify_slack }}"
        then:
          - id: notify_slack
            type: io.kestra.plugin.slack.SlackIncomingWebhook
            url: "{{ secret('SLACK_WEBHOOK_URL') }}"
            messageText: "TDS check: Rs {{ outputs.check_tds.outputs[0].row.shortfall_total }} missed or short across {{ outputs.check_tds.outputs[0].row.vendors_affected }} vendors. {{ outputs.check_tds.outputs[0].row.shortfall_details }}. Next Form 140 due {{ outputs.check_tds.outputs[0].row.next_form_140_due }}."
    else:
      - id: log_clean
        type: io.kestra.plugin.core.log.Log
        message: "No missed or short TDS in {{ outputs.check_tds.outputs[0].row.total_payments }} payments."

errors:
  - id: log_check_failure
    type: io.kestra.plugin.core.log.Log
    level: ERROR
    description: Make a failed check loud, so a run that checked nothing is never mistaken for a clean one.
    message: "TDS check FAILED in {{ flow.namespace }}.{{ flow.id }} (execution {{ execution.id }}). No payment was checked. Check the columns of payments and vendor_master."

outputs:
  - id: tds_report
    type: FILE
    description: Per-payment CSV with the vendor's year total, rate, expected TDS, TDS deducted, shortfall, excess, status (MISSED, SHORT, OVER, CHECK_VENDOR, OK or BELOW_THRESHOLD), interest estimate, deposit and Form 140 due dates and notes, most urgent first.
    value: "{{ outputs.check_tds.outputFiles['tds_report.csv'] }}"
  - id: check_summary
    type: JSON
    description: 'Counts, amounts and details, e.g. {"missed_count": 6, "shortfall_total": 20540, "next_form_140_due": "2026-10-31", ...}.'
    value: "{{ outputs.check_tds.outputs[0].row | toJson }}"

extend:
  title: Catch Missed TDS on Vendor Payments Before the Deposit Date (Section 393)
  shortDescription: Monthly check of contractor, professional, technical and director fee payments for missed or short TDS under section 393 (old 194C and 194J), with interest and Form 140 due dates.
  metaTitle: TDS Vendor Payment Check (Section 393, old 194C and 194J) with Kestra
  metaDescription: Find vendor payments with missed or short TDS under section 393: Rs 30,000, Rs 1 lakh and Rs 50,000 thresholds, PAN-based rates, interest and due dates.
  description: |
    TDS on vendor payments goes wrong in quiet ways: a housekeeping contractor paid Rs 25,000 at a time crosses Rs 1 lakh for the year and nobody notices, a consultant without a PAN is deducted at 10% instead of 20%, a software vendor is charged the professional rate instead of the technical one. Each miss costs interest of 1% a month, can make the expense non-deductible, and surfaces only when the auditor asks. From 1 April 2026 the rules sit in section 393 of the Income-tax Act, 2025 (the old sections 194C and 194J) and the quarterly return is Form 140 (old Form 26Q). This blueprint checks every vendor payment before the monthly deposit date: it tracks each vendor's year total, picks the right rate from the PAN, applies the no-PAN rate, and reports what to deduct, deposit and file. Everything runs locally in DuckDB: no TRACES login, no paid API and no vendor data leaving your Kestra instance.

    ## How it works

    1. `sample_payments` and `sample_vendor_master` (`io.kestra.plugin.core.storage.Write`) write sixteen payments in tax year 2026-27 and twelve vendors with one example of every case. They are used only when the matching input is empty.
    2. `check_tds` (`io.kestra.plugin.jdbc.duckdb.Queries`) groups payments by vendor, nature and tax year (April to March) and applies the thresholds:
       - Contractors: a single payment over Rs 30,000, or a year total over Rs 1,00,000, after which every payment to that vendor is covered. Rate 1% when the PAN's fourth letter is P (individual) or H (HUF), 2% otherwise. A transporter that has declared 10 or fewer goods carriages and has a PAN is exempt.
       - Professional fees 10% and technical fees 2%, once the year total passes Rs 50,000. Director fees 10% with no threshold.
       - No PAN, or a malformed one: 20%.
       It then compares the expected TDS with what was deducted, flags deductions above the right amount (`OVER`, usually the professional 10% applied to a technical vendor), estimates interest at 1% for each month or part of a month, and adds the deposit due date (the 7th of the next month, 30 April for March) and the Form 140 due date for the quarter.
    3. `route_findings` (`io.kestra.plugin.core.flow.If`) logs the missed and short deductions with amounts, the vendors without a valid PAN and the next return date, and a nested `If` posts a summary to Slack when `notify_slack` is `true`. A clean run is logged as well.
    4. The `errors` block logs a failed check loudly, so a run that checked nothing is never mistaken for a clean one.
    5. The `monthly_before_deposit` `Schedule` trigger (the 3rd of every month at 10:00 IST, shipped disabled) runs it four days before the deposit date.

    ## What you get

    - `outputs.tds_report`: CSV with `payment_id`, `vendor_name`, `pan`, `nature`, `payment_date`, `amount`, `year_total`, `rate_pct`, `tds_expected`, `tds_deducted`, `shortfall`, `excess`, `status`, `interest_estimate`, `deposit_due`, `form_140_due` and `notes`, most urgent first.
    - `outputs.check_summary`: JSON with `missed_count`, `short_count`, `shortfall_total`, `interest_estimate_total`, `vendors_affected`, `over_count`, `excess_total`, `over_details`, `shortfall_details`, `vendors_without_valid_pan` and `next_form_140_due`.
    - With the sample data: a contractor paid Rs 25,000 to 29,000 at a time whose year total passed Rs 1 lakh, a company deducted at 1% instead of 2%, a consultant firm whose first bill was left undeducted once its year total passed Rs 50,000, a software vendor deducted at the professional 10% instead of the technical 2%, a caterer without a PAN, a small transporter correctly exempt, a director fee with no threshold, a doctor's fee just under Rs 50,000 correctly left alone, and a malformed PAN that triggers the 20% rate.

    ## Who it's for

    - Accounts payable and tax teams in India that pay contractors, consultants and technical vendors.
    - CA firms preparing quarterly TDS returns for clients.
    - Startups and SMEs that want the TDS position checked before the deposit date, not at the audit.

    ## Why orchestrate this with Kestra

    A spreadsheet catches a missed TDS once, if someone remembers to look. Kestra runs the same check every month on the latest payments, keeps each month's report in the execution history as an audit trail, branches on the result, and alerts the people who deposit the tax. The inputs are plain files, so the same flow can read the payment register from your ERP, accounting database, S3 or Google Drive.

    ## Prerequisites

    - Nothing for the demo: the sample payments and vendors are built in.
    - For your own data: the payment register for the tax year and a vendor master with PANs, with the columns below.

    ### Inputs

    - `payments` (FILE, optional): `payment_id`, `vendor_id`, `payment_date`, `amount`, `nature` (`contractor`, `professional`, `technical` or `director`) and `tds_deducted`.
    - `vendor_master` (FILE, optional): `vendor_id`, `vendor_name`, `pan` and `transporter_declaration` (`yes` for a transporter with 10 or fewer goods carriages that has given the declaration).
    - `as_of` (STRING, optional): date to compute interest up to, `YYYY-MM-DD`; defaults to today.
    - `notify_slack` (BOOL, default `false`): post a summary to Slack when something needs fixing.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack incoming webhook URL. Only needed when `notify_slack` is `true`.

    ## Quick start

    1. Save the flow and run it with the default inputs.
    2. Open the logs of `log_findings` and download `tds_report` from the Outputs tab.
    3. Run it again with your own payment register and vendor master.
    4. Optional: add the `SLACK_WEBHOOK_URL` secret and set `notify_slack` to `true`.
    5. Point the inputs at your real sources and set `disabled: false` on `monthly_before_deposit`.

    ## Common pitfalls

    - Pass the full tax year's payments, not just the current month, otherwise the Rs 1 lakh and Rs 50,000 year totals cannot be tracked.
    - Classify the nature carefully: most software and IT support is technical (2%), not professional (10%). Ask your tax adviser when unsure.
    - The PAN check proves the format and reads the holder type from the fourth letter. It does not prove the PAN is active or linked; verify new vendors on the income tax portal.
    - Interest is an estimate (1% for each month or part of a month from the payment date). Payments deducted but deposited late carry 1.5% a month instead, which this check does not track.
    - Rates and thresholds can change in a budget. Review them each year against the Income-tax Act, 2025 and the Finance Act.

    ## How to extend

    - Read the payment register straight from your ERP or accounting database instead of files.
    - Add a `Pause` approval before the deposit and generate the challan details for the shortfall.
    - Add more payment types from section 393, such as rent or commission, with their own thresholds.
    - Send each vendor without a valid PAN a request for it with a `ForEach`.

    ## Links

    - [Income-tax Act, 2025 (Income Tax Department)](https://incometaxindia.gov.in/)
    - [TDS returns and certificates (TRACES)](https://www.tdscpc.gov.in/)
    - [Kestra DuckDB plugin](https://kestra.io/plugins/plugin-jdbc/duckdb)
    - [Kestra Slack plugin](https://kestra.io/plugins/plugin-slack)
    - This blueprint has been created by [Ankith-m1006](https://github.com/Ankith-m1006)
  tags:
    - Business
    - Data
  subTags:
    - Policy & Compliance
    - Data Quality
  ee: false
  demo: false
