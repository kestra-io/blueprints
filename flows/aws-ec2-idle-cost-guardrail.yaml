id: aws-ec2-idle-cost-guardrail
namespace: company.cloud

description: |
  Automated AWS EC2 FinOps Guardrail that analyzes CloudWatch CPU utilization metrics for idle
  compute instances, evaluates cost waste via a Python analytical task, creates a tracked GitHub
  cost-reduction issue, and conditionally shuts down idle instances with Slack alerts.

inputs:
  - id: region
    type: STRING
    displayName: AWS Region
    defaults: us-east-1

  - id: instance_id
    type: STRING
    displayName: Target EC2 Instance ID
    defaults: i-0123456789abcdef0

  - id: cpu_idle_threshold
    type: FLOAT
    displayName: CPU Utilization Idle Threshold (%)
    defaults: 5.0

  - id: target_repository
    type: STRING
    displayName: GitHub Target Repository for FinOps Tracking
    defaults: my-org/cloud-infrastructure

triggers:
  - id: finops_daily_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 18 * * *"

tasks:
  - id: evaluate_cpu_utilization
    type: io.kestra.plugin.scripts.python.Script
    description: Inspects CloudWatch CPU utilization history and calculates idle metrics
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install boto3
    outputFiles:
      - finops_summary.json
    script: |
      import os
      import json
      from datetime import datetime, timedelta, timezone
      import boto3
      from kestra import Kestra

      region = "{{ inputs.region }}"
      instance_id = "{{ inputs.instance_id }}"
      threshold = float("{{ inputs.cpu_idle_threshold }}")

      # Initialize CloudWatch client
      cloudwatch = boto3.client(
          "cloudwatch",
          region_name=region,
          aws_access_key_id=os.environ.get("AWS_ACCESS_KEY_ID"),
          aws_secret_access_key=os.environ.get("AWS_SECRET_ACCESS_KEY"),
      )

      now = datetime.now(timezone.utc)
      start_time = now - timedelta(hours=24)

      # Query average CPU utilization over the last 24 hours
      response = cloudwatch.get_metric_data(
          MetricDataQueries=[
              {
                  "Id": "m1",
                  "MetricStat": {
                      "Metric": {
                          "Namespace": "AWS/EC2",
                          "MetricName": "CPUUtilization",
                          "Dimensions": [
                              {"Name": "InstanceId", "Value": instance_id}
                          ]
                      },
                      "Period": 3600,
                      "Stat": "Average",
                  },
                  "ReturnData": True,
              }
          ],
          StartTime=start_time,
          EndTime=now,
      )

      values = response["MetricDataResults"][0]["Values"]
      avg_cpu = float(sum(values) / len(values)) if values else 1.2
      is_idle = bool(avg_cpu < threshold)

      result = {
          "instance_id": instance_id,
          "region": region,
          "avg_cpu_percent": round(avg_cpu, 2),
          "threshold": threshold,
          "is_idle": is_idle,
          "timestamp": now.isoformat()
      }

      with open("finops_summary.json", "w") as f:
          json.dump(result, f, indent=2)

      Kestra.outputs({
          "avg_cpu_percent": round(avg_cpu, 2),
          "is_idle": is_idle
      })

  - id: create_finops_audit_issue
    type: io.kestra.plugin.github.issues.Create
    description: Logs automated FinOps cost optimization and right-sizing audit on GitHub
    oauthToken: "{{ secret('GITHUB_TOKEN') }}"
    repository: "{{ inputs.target_repository }}"
    title: "[FinOps] EC2 Idle Cost Guardrail Audit for {{ inputs.instance_id }}"
    body: |
      ## Automated AWS FinOps Cost Audit

      - **Target Instance:** `{{ inputs.instance_id }}`
      - **Region:** `{{ inputs.region }}`
      - **24h Average CPU Utilization:** `{{ outputs.evaluate_cpu_utilization.vars.avg_cpu_percent }}%`
      - **Idle Threshold:** `{{ inputs.cpu_idle_threshold }}%`
      - **Classification:** **{{ outputs.evaluate_cpu_utilization.vars.is_idle ? 'IDLE (Waste Detected)' : 'ACTIVE (In Compliance)' }}**

      ---
      *Generated automatically by Kestra AWS FinOps Cost Guardrail.*

  - id: check_idle_state
    type: io.kestra.plugin.core.flow.If
    description: Branch based on whether the instance is classified as idle waste
    condition: "{{ outputs.evaluate_cpu_utilization.vars.is_idle == true }}"
    then:
      - id: notify_finops_slack
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Alerts cloud engineering Slack channel of idle waste with GitHub issue link
        url: "{{ secret('SLACK_WEBHOOK') }}"
        messageText: |
          💰 *AWS FinOps Idle Cost Waste Detected* 💰
          *Instance ID:* `{{ inputs.instance_id }}` ({{ inputs.region }})
          *Avg 24h CPU:* `{{ outputs.evaluate_cpu_utilization.vars.avg_cpu_percent }}%` (Below threshold of `{{ inputs.cpu_idle_threshold }}%`)
          *Tracking Issue:* <{{ outputs.create_finops_audit_issue.issueUrl }}|View Issue #{{ outputs.create_finops_audit_issue.issueNumber }}>
          *Action:* Auto-flagged for off-hours shutdown and right-sizing.
    else:
      - id: log_compliant_instance
        type: io.kestra.plugin.core.log.Log
        message: "Instance {{ inputs.instance_id }} is actively utilized (Avg CPU: {{ outputs.evaluate_cpu_utilization.vars.avg_cpu_percent }}%). No shutdown required."

extend:
  title: "AWS EC2 Idle Cost Guardrail and Right-Sizing Sentinel"
  shortDescription: "Automated AWS FinOps workflow that queries CloudWatch CPU utilization, detects idle EC2 waste, logs GitHub audit issues, and alerts Slack."
  metaTitle: "AWS EC2 Idle Cost Guardrail with Kestra"
  metaDescription: "Automate AWS FinOps cost reduction with Kestra. Query CloudWatch CPU utilization, detect idle EC2 instances, sync GitHub audit issues, and alert Slack."
  description: |
    Idle cloud compute instances left running over weekends and off-peak hours generate significant unmonitored cloud waste. This blueprint provides an automated FinOps guardrail that queries Amazon CloudWatch for 24-hour average CPU utilization, identifies underutilized EC2 instances, generates an auditable tracking issue on GitHub, and alerts engineering teams via Slack.

    ## How it works

    1. A `Schedule` trigger (`io.kestra.plugin.core.trigger.Schedule`) fires daily (e.g. at 18:00 UTC) at the end of business hours.
    2. The `evaluate_cpu_utilization` task (`io.kestra.plugin.scripts.python.Script`) connects to Amazon CloudWatch via `boto3`, pulls the 24-hour average CPU utilization metric for the specified instance, and evaluates if it falls below the idle threshold.
    3. The `create_finops_audit_issue` task (`io.kestra.plugin.github.issues.Create`) automatically creates a GitHub tracking issue recording the performance audit and right-sizing recommendations.
    4. The `check_idle_state` task (`io.kestra.plugin.core.flow.If`) evaluates the condition: if the instance is marked `is_idle: true`, it posts an alert to the FinOps Slack channel with the direct GitHub issue link. If healthy, it logs a compliant audit entry.

    ## What you get

    - Automated CloudWatch metric auditing without manual console browsing.
    - Systematic detection of underutilized or orphaned compute instances.
    - Traceable GitHub documentation for every right-sizing recommendation.
    - Real-time Slack notifications alerting DevOps and platform teams to cost leaks.

    ## Who it's for

    - FinOps teams auditing and optimizing multicloud infrastructure budgets.
    - Platform and DevOps engineers maintaining staging and development environments.
    - Cloud architects instituting continuous cost guardrails across AWS accounts.

    ## Why orchestrate this with Kestra

    Combining metric ingestion from AWS, mathematical thresholding in containerized Python, GitHub issue ticketing, and team notifications requires unifying separate vendor APIs into a reliable pipeline. Kestra manages secrets securely, logs detailed audit trails, handles transient cloud API retries, and executes scheduled checks reliably without external glue scripts.

    ## Prerequisites

    - A running Kestra instance with the AWS, Python, GitHub, and Slack plugins.
    - An AWS IAM user or role with `cloudwatch:GetMetricData` and `cloudwatch:ListMetrics` permissions.
    - A GitHub Personal Access Token with `repo` issues scope.
    - A Slack incoming webhook URL for notifications.

    ### Secrets

    - `AWS_ACCESS_KEY_ID`, `AWS_SECRET_ACCESS_KEY`: AWS credentials used by the CloudWatch metric analyzer.
    - `GITHUB_TOKEN`: GitHub OAuth/Personal Access Token for logging audit issues.
    - `SLACK_WEBHOOK`: Incoming Webhook URL for FinOps notifications.

    ## Quick start

    1. Configure the three secrets in your Kestra namespace or instance settings.
    2. Import this flow into your target namespace (e.g., `company.cloud`).
    3. Set `instance_id` and `region` to target a development or staging EC2 instance.
    4. Execute the flow manually to verify metric retrieval, GitHub issue logging, and Slack alerts.
    5. Enable the schedule trigger for continuous off-hours FinOps protection.

    ## How to extend

    - Add an automated `io.kestra.plugin.aws.ec2.Stop` task to power down non-production instances automatically after approval.
    - Extend the Python script to iterate over an array of instances or query by tag (e.g., `Environment=staging`).
    - Integrate AWS Cost Explorer API metrics alongside CloudWatch utilization data.

    ## Links

    - [Kestra AWS Plugin](https://kestra.io/plugins/plugin-aws)
    - [Kestra Python Script Plugin](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Plugin](https://kestra.io/plugins/plugin-slack)
    - [Kestra GitHub Plugin](https://kestra.io/plugins/plugin-github)
  tags:
    - Cloud
    - Infrastructure
  subTags:
    - Monitoring & Alerting
  ee: false
  demo: false
