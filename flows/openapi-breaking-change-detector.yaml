id: openapi-breaking-change-detector
namespace: company.team
description: |
  Compare baseline and candidate OpenAPI specifications using oasdiff,
  detect backward-incompatible breaking changes, format structured diff metrics,
  dispatch Slack alerts, and optionally halt CI/CD deployment gates.

triggers:
  - id: git_pr_webhook
    type: io.kestra.plugin.core.trigger.Webhook
    description: Webhook trigger for CI/CD pipelines to validate OpenAPI contracts on pull requests or pre-deployment stages.
    key: contract-gate

  - id: hourly_drift_check
    type: io.kestra.plugin.core.trigger.Schedule
    description: Optional scheduled drift monitor to periodically verify that active staging or production specs adhere to the baseline contract.
    cron: "0 * * * *"
    disabled: true

inputs:
  - id: api_name
    type: STRING
    displayName: API name
    description: Human-readable identifier for the service or API contract under evaluation.
    defaults: Demo Security Service API
    required: true

  - id: baseline_spec_url
    type: URI
    displayName: Baseline OpenAPI specification URL
    description: |
      Reference OpenAPI specification URL representing the currently deployed production contract
      or the target release baseline. Accepts OpenAPI 3.0 or 3.1 in JSON or YAML format.
    defaults: https://raw.githubusercontent.com/oasdiff/oasdiff/main/data/openapi-test1.yaml
    required: true

  - id: candidate_spec_url
    type: URI
    displayName: Candidate OpenAPI specification URL
    description: |
      Candidate OpenAPI specification URL representing the proposed API changes (e.g., from a pull request build artifact
      or preview staging environment). Accepts OpenAPI 3.0 or 3.1 in JSON or YAML format.
    defaults: https://raw.githubusercontent.com/oasdiff/oasdiff/main/data/openapi-test3.yaml
    required: true

  - id: fail_on_breaking
    type: BOOL
    displayName: Fail on breaking changes
    description: |
      When true, aborts the flow execution with a FAILED status if any backward-incompatible breaking change is detected.
      Defaults to false so demo runs complete successfully while exposing the full diff report.
    defaults: false
    required: true

  - id: notify_slack
    type: BOOL
    displayName: Send Slack alert
    description: |
      Post a structured breaking-change alert to Slack when contract drift is identified.
      Requires the SLACK_WEBHOOK_URL secret to be configured in Kestra.
    defaults: false
    required: true

tasks:
  - id: fetch_baseline
    type: io.kestra.plugin.core.http.Download
    description: Download the baseline OpenAPI contract into internal storage.
    uri: "{{ inputs.baseline_spec_url }}"

  - id: fetch_candidate
    type: io.kestra.plugin.core.http.Download
    description: Download the candidate OpenAPI contract into internal storage.
    uri: "{{ inputs.candidate_spec_url }}"

  - id: analyze_contract
    type: io.kestra.plugin.core.flow.WorkingDirectory
    description: Isolated workspace where specifications are compared using oasdiff and parsed into structured metrics.
    inputFiles:
      base.yaml: "{{ outputs.fetch_baseline.uri }}"
      candidate.yaml: "{{ outputs.fetch_candidate.uri }}"
    tasks:
      - id: run_oasdiff
        type: io.kestra.plugin.scripts.shell.Commands
        description: Run pinned oasdiff container to detect breaking changes between baseline and candidate specs.
        containerImage: tufin/oasdiff:v1.33.0
        taskRunner:
          type: io.kestra.plugin.scripts.runner.docker.Docker
        outputFiles:
          - breaking.json
        commands:
          - oasdiff breaking base.yaml candidate.yaml -f json > breaking.json

      - id: parse_diff_report
        type: io.kestra.plugin.scripts.python.Script
        description: Parse oasdiff JSON report into structured variables, counts, and compatibility verdicts.
        taskRunner:
          type: io.kestra.plugin.core.runner.Process
        script: |
          import json
          import os
          from kestra import Kestra

          breaking_file = "breaking.json"
          if not os.path.exists(breaking_file):
              raise FileNotFoundError(f"Missing oasdiff breaking changes report: {breaking_file}")

          with open(breaking_file, "r", encoding="utf-8") as f:
              raw_text = f.read().strip()
              breaking_data = json.loads(raw_text) if raw_text else []

          if not isinstance(breaking_data, list):
              raise ValueError(f"Expected list from oasdiff breaking report, got {type(breaking_data)}")

          # Categorize findings by oasdiff severity level:
          # Level >= 3: ERR severity (known backward-incompatible breaking changes)
          # Level < 3: WARN/INFO severity (findings below breaking threshold)
          breaking_changes = [
              item for item in breaking_data
              if item.get("level", 3) >= 3
          ]
          warning_changes = [
              item for item in breaking_data
              if item.get("level", 3) < 3
          ]

          breaking_count = len(breaking_changes)
          warning_count = len(warning_changes)
          verdict = "BREAKING_CHANGES_DETECTED" if breaking_count > 0 else "COMPATIBLE"

          if breaking_count == 0:
              summary = "Specification is backward-compatible with 0 breaking changes."
              if warning_count > 0:
                  summary += f" ({warning_count} warning finding(s) below breaking threshold)."
          else:
              top_items = []
              for item in breaking_changes[:3]:
                  op = item.get("operation", "").strip()
                  path = item.get("path", "").strip()
                  change_id = item.get("id", "").strip()
                  top_items.append(f"{op} {path}: {change_id}".strip())
              summary = f"{breaking_count} breaking change(s) detected: " + "; ".join(top_items)
              if breaking_count > 3:
                  summary += f" (and {breaking_count - 3} more)"
              if warning_count > 0:
                  summary += f" [{warning_count} warning finding(s)]"

          Kestra.outputs({
              "breaking_count": breaking_count,
              "warning_count": warning_count,
              "verdict": verdict,
              "breaking_summary": summary
          })

  - id: evaluate_contract
    type: io.kestra.plugin.core.flow.If
    description: Branch based on whether backward-incompatible breaking changes were detected.
    condition: "{{ outputs.parse_diff_report.vars.breaking_count > 0 }}"
    then:
      - id: notify_slack_alert
        type: io.kestra.plugin.core.flow.If
        description: Dispatch Slack alert when notify_slack is enabled.
        condition: "{{ inputs.notify_slack }}"
        then:
          - id: send_slack_alert
            type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
            description: Send structured breaking change alert to Slack.
            url: "{{ secret('SLACK_WEBHOOK_URL') }}"
            payload: |
              {
                "text": ":warning: *API Contract Drift Detected:* `{{ inputs.api_name }}`\n• *Verdict:* `{{ outputs.parse_diff_report.vars.verdict }}`\n• *Breaking Changes:* `{{ outputs.parse_diff_report.vars.breaking_count }}`\n• *Warnings:* `{{ outputs.parse_diff_report.vars.warning_count }}`\n• *Summary:* {{ outputs.parse_diff_report.vars.breaking_summary }}\n• *Kestra Execution:* `{{ execution.id }}`"
              }

      - id: check_fail_gate
        type: io.kestra.plugin.core.flow.If
        description: Halt pipeline execution if fail_on_breaking gate is enabled.
        condition: "{{ inputs.fail_on_breaking }}"
        then:
          - id: fail_gate
            type: io.kestra.plugin.core.execution.Fail
            description: Abort the execution to block downstream CI/CD deployment.
            errorMessage: >-
              API Contract Check FAILED for '{{ inputs.api_name }}':
              {{ outputs.parse_diff_report.vars.breaking_count }} breaking change(s) detected.
              {{ outputs.parse_diff_report.vars.breaking_summary }}
        else:
          - id: log_warning
            type: io.kestra.plugin.core.log.Log
            description: Log non-blocking contract drift warning.
            message: >-
              [WARN] {{ inputs.api_name }}: {{ outputs.parse_diff_report.vars.breaking_count }} breaking changes detected,
              but fail_on_breaking is disabled. Continuing execution.

    else:
      - id: log_compatible
        type: io.kestra.plugin.core.log.Log
        description: Log successful contract compatibility verification.
        message: >-
          [SUCCESS] {{ inputs.api_name }}: API contract is backward-compatible.
          Breaking changes: 0. Warnings: {{ outputs.parse_diff_report.vars.warning_count }}.

outputs:
  - id: breaking_count
    type: INT
    description: Total number of backward-incompatible breaking changes detected.
    value: "{{ outputs.parse_diff_report.vars.breaking_count }}"
  - id: warning_count
    type: INT
    description: Count of oasdiff findings below the configured breaking severity threshold.
    value: "{{ outputs.parse_diff_report.vars.warning_count }}"
  - id: verdict
    type: STRING
    description: Compatibility verdict (COMPATIBLE or BREAKING_CHANGES_DETECTED).
    value: "{{ outputs.parse_diff_report.vars.verdict }}"
  - id: breaking_summary
    type: STRING
    description: Concise summary of breaking changes detected.
    value: "{{ outputs.parse_diff_report.vars.breaking_summary }}"

extend:
  title: Detect Breaking Changes in OpenAPI Specifications with oasdiff and Slack
  metaTitle: OpenAPI Contract Drift and Breaking Change Detector with oasdiff
  shortDescription: Detect backward-incompatible changes between baseline and candidate OpenAPI contracts using oasdiff, notify Slack, and enforce CI/CD deployment gates.
  metaDescription: Detect backward-incompatible OpenAPI contract drift with oasdiff, dispatch Slack alerts, and enforce CI/CD deployment gates in Kestra.
  tags:
    - Infrastructure
    - Core
  ee: false
  demo: true
  description: |
    API contract drift occurs when code modifications alter existing endpoints, data types, query parameters,
    or response payloads in a way that breaks existing consumers, mobile applications, or third-party integrations.

    While blackbox smoke tests check if an endpoint responds with HTTP 200 at runtime, they cannot detect whether
    a newly required parameter or removed response field will break downstream client libraries. This blueprint
    orchestrates the specialized open-source [oasdiff](https://github.com/oasdiff/oasdiff) engine to detect
    known backward-incompatible changes according to oasdiff compatibility rules between a **baseline** OpenAPI specification
    (e.g., currently deployed in production) and a **candidate** specification (e.g., generated during a pull request build).

    ## How It Works

    1. **Specification Acquisition**: Downloads both the baseline and candidate OpenAPI specifications into Kestra internal storage via `io.kestra.plugin.core.http.Download`.
    2. **Containerized Contract Differencing**: Executes a pinned `tufin/oasdiff:v1.33.0` Docker container inside an isolated `WorkingDirectory` to evaluate breaking changes without swallowing execution errors.
    3. **Metric Extraction & Summarization**: A lightweight Python script parses the generated JSON report, counts backward-incompatible changes (ERR severity level), tallies minor warnings, and determines a compatibility verdict (`COMPATIBLE` or `BREAKING_CHANGES_DETECTED`).
    4. **Slack Notification**: If breaking changes are found and `notify_slack` is enabled, delivers an actionable Slack alert detailing the impacted endpoints and error summaries.
    5. **CI/CD Deployment Gate**: When `fail_on_breaking` is enabled (`true`), invokes `io.kestra.plugin.core.execution.Fail` to fail the execution, halting automated deployments before backward-incompatible changes reach production.

    ## OpenAPI Compatibility Rules

    The underlying `oasdiff` engine evaluates backward-compatibility rules across OpenAPI 3.0.x and 3.1.x specifications, detecting changes such as:
    - **Paths & Operations**: Removed endpoints, removed HTTP methods, or altered path parameters.
    - **Request Parameters**: Newly required query/header/path parameters, removed parameters, or modified data types.
    - **Request Bodies**: Newly required JSON properties or incompatible schema alterations.
    - **Responses**: Removed HTTP status codes (e.g., 200 removed), removed response properties, or altered payload types.
    - **Security & Enums**: Removed authentication schemes, added security scopes, or removed enum values.

    Findings below the breaking severity threshold (such as parameter deprecations or optional property removals) are tracked as warnings rather than hard breaking errors.

    ## Demo & CI/CD Gate Behavior

    - **Demo Execution**: By default, `fail_on_breaking` is set to `false`. Running the blueprint out-of-the-box against the sample specifications detects contract drift, outputs structured metrics, and completes successfully so you can inspect the full report.
    - **Deployment Gate**: In production CI/CD pipelines, set `fail_on_breaking: true`. If breaking changes are discovered, the flow execution fails immediately, blocking the deployment.

    ## CI/CD Integration

    This workflow includes a webhook trigger (`git_pr_webhook`). You can invoke it directly from GitHub Actions, GitLab CI, or any deployment runner on pull requests:

    ```bash
    curl -X POST "https://<your-kestra-host>/api/v1/executions/webhook/company.team/openapi-breaking-change-detector/contract-gate" \
      -H "Content-Type: application/json" \
      -d '{
        "inputs": {
          "api_name": "Orders Service",
          "baseline_spec_url": "https://api.example.com/openapi.json",
          "candidate_spec_url": "https://storage.example.com/builds/pr-142/openapi.json",
          "fail_on_breaking": true,
          "notify_slack": true
        }
      }'
    ```

    ## Prerequisites & Secrets

    - **Docker Task Runner**: The diffing step executes the pinned `tufin/oasdiff:v1.33.0` container, requiring a Docker daemon or container runtime accessible to Kestra.
    - **SLACK_WEBHOOK_URL** *(optional)*: Required only if `notify_slack` is set to `true`.
