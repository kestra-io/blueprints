id: thanos-compact-halted-overlap-sentinel
namespace: company.sentinel
description: Monitors Thanos Compactor metrics to detect compactor halt conditions
  triggered by overlapping TSDB blocks or block compaction backlogs in object storage.
inputs:
- id: thanos_compact_url
  type: STRING
  defaults: http://thanos-compact.internal:10902/metrics
- id: max_todo_blocks_threshold
  type: INT
  defaults: 50
tasks:
  - id: audit_thanos
    type: io.kestra.plugin.scripts.python.Script
    description: Inspects Thanos Compactor metrics for halted state and pending compaction blocks.
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install requests kestra
    env:
      METRICS_URL: "{{ inputs.thanos_compact_url }}"
      MAX_TODO_THRESHOLD: "{{ inputs.max_todo_blocks_threshold }}"
    script: |
      import os
      import sys
      import re
      import requests
      from kestra import Kestra

      metrics_url = os.environ.get("METRICS_URL", "").rstrip("/")
      max_todo = int(os.environ.get("MAX_TODO_THRESHOLD", "50"))

      print(f"Scraping Thanos Compactor metrics from: {metrics_url}")
      try:
          resp = requests.get(metrics_url, timeout=15)
          resp.raise_for_status()
      except Exception as err:
          print(f"ERROR: Failed to connect to Thanos metrics endpoint {metrics_url}: {err}", file=sys.stderr)
          sys.exit(1)

      halted = 0
      todo_blocks = 0

      for line in resp.text.splitlines():
          line = line.strip()
          if not line or line.startswith("#"):
              continue
          if "thanos_compact_halted" in line:
              m = re.search(r'([0-9.]+)\s*$', line)
              if m:
                  halted = int(float(m.group(1)))
          elif "thanos_compact_todo_compaction_blocks" in line:
              m = re.search(r'([0-9.]+)\s*$', line)
              if m:
                  todo_blocks = int(float(m.group(1)))

      is_breach = (halted == 1) or (todo_blocks > max_todo)
      print(f"Thanos Compactor Audit: Halted = {halted}, Todo Blocks = {todo_blocks}, Breach = {is_breach}")

      Kestra.outputs({
          "halted": halted,
          "todo_blocks": todo_blocks,
          "is_breach": is_breach
      })

  - id: evaluate_and_alert
    type: io.kestra.plugin.core.flow.If
    description: Evaluates whether Thanos compactor is halted or pending compaction blocks exceed threshold.
    condition: "{{ outputs.audit_thanos.vars.is_breach }}"
    then:
      - id: notify_slack
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          :rotating_light: *Thanos Compactor Halted or Backlog Spike*
          *Metrics URL:* {{ inputs.thanos_compact_url }}
          *Halted State:* {{ outputs.audit_thanos.vars.halted }}
          *Pending Compaction Blocks:* {{ outputs.audit_thanos.vars.todo_blocks }}
          *Threshold:* {{ inputs.max_todo_blocks_threshold }}
          *Action:* Check compactor logs for overlapping TSDB blocks or corrupted meta.json files.
errors:
- id: handle_inspection_failure
  type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
  url: '{{ secret(''SLACK_WEBHOOK'') }}'
  payload: ':rotating_light: *Execution Failure: Thanos Compactor Overlap Halted and
    Block Backlog Sentinel*\n*Execution ID:* `{ execution.id }`\n*State:* `{ execution.state.current
    }`\n*Error:* Sentinel inspection encountered an unhandled execution error.'
triggers:
- id: scheduled_monitor
  type: io.kestra.plugin.core.trigger.Schedule
  cron: '*/15 * * * *'
  disabled: true
outputs:
  - id: halted
    type: INT
    value: "{{ outputs.audit_thanos.vars.halted }}"
  - id: todo_blocks
    type: INT
    value: "{{ outputs.audit_thanos.vars.todo_blocks }}"
  - id: is_breach
    type: BOOLEAN
    value: "{{ outputs.audit_thanos.vars.is_breach }}"

extend:
  metaDescription: "Monitors Thanos Compactor metrics to detect compactor halt conditions triggered by overlapping TSDB blocks or block compaction backlogs in object storage."
  metaTitle: Thanos Compactor Overlap Halted and Block Backlog Sentinel with Kestra
  title: Thanos Compactor Overlap Halted and Block Backlog Sentinel
  shortDescription: Monitors Thanos Compactor metrics to detect compactor halt conditions
    triggered by overlapping TSDB blocks or block compaction backlogs in object storage.
  description: '## How it works

    This automated sentinel flow continuously assesses operational health, metrics,
    and capacity parameters for **Thanos Compactor Overlap Halted and Block Backlog
    Sentinel**. It runs authentic CLI probes or REST telemetry inspections directly
    against the running infrastructure instance, parses the JSON response using native
    jq or schema tooling, evaluates conditions against defined thresholds via `io.kestra.plugin.core.flow.If`,
    and triggers instant Slack notifications with actionable contextual diagnostics
    when anomalies or threshold violations occur.


