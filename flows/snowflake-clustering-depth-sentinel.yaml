id: snowflake-clustering-depth-sentinel
namespace: company.dataops

inputs:
  - id: snowflake_account
    type: STRING
    defaults: xy12345.us-east-1
    description: Snowflake account identifier.
  - id: snowflake_username
    type: STRING
    defaults: kestra_monitor
    description: Snowflake service user.
  - id: database_name
    type: STRING
    defaults: ANALYTICS
    description: Database name containing the target clustered table.
  - id: schema_name
    type: STRING
    defaults: PUBLIC
    description: Schema name containing the target clustered table.
  - id: table_name
    type: STRING
    defaults: FACT_ORDERS
    description: Target table name to evaluate for clustering depth.
  - id: max_clustering_depth_threshold
    type: FLOAT
    defaults: 5.0
    description: Maximum acceptable clustering depth before recommending table reclustering.

tasks:
  - id: query_clustering_depth
    type: io.kestra.plugin.jdbc.snowflake.Query
    url: "jdbc:snowflake://{{ inputs.snowflake_account }}.snowflakecomputing.com"
    username: "{{ inputs.snowflake_username }}"
    password: "{{ secret('SNOWFLAKE_PASSWORD') }}"
    sql: |
      SELECT SYSTEM$CLUSTERING_DEPTH('{{ inputs.database_name }}.{{ inputs.schema_name }}.{{ inputs.table_name }}') AS CLUSTERING_DEPTH;
    fetchType: FETCH_ONE

  - id: evaluate_clustering_efficiency
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.query_clustering_depth.row.CLUSTERING_DEPTH > inputs.max_clustering_depth_threshold }}"
    then:
      - id: alert_data_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "text": ":chart_with_downwards_trend: *Snowflake Clustering Degradation Alert*: Table `{{ inputs.database_name }}.{{ inputs.schema_name }}.{{ inputs.table_name }}` has reached clustering depth of {{ outputs.query_clustering_depth.row.CLUSTERING_DEPTH }} (threshold: {{ inputs.max_clustering_depth_threshold }}). Query micro-partition pruning efficiency is degraded. Reclustering recommended."
          }

errors:
  - id: notify_sentinel_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "text": ":warning: *Snowflake Sentinel Execution Failure*: Failed to query clustering depth on table `{{ inputs.table_name }}`."
      }

outputs:
  - id: clustering_depth
    type: FLOAT
    value: "{{ outputs.query_clustering_depth.row.CLUSTERING_DEPTH }}"

triggers:
  - id: weekly_clustering_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 6 * * 1"
    disabled: true

extend:
  title: Snowflake Table Clustering Depth and Partition Pruning Efficiency Sentinel
  shortDescription: Audits Snowflake table clustering depth to detect partition overlap and preserve micro-partition pruning efficiency.
  description: |
    ## How it works
    This sentinel leverages the JDBC Snowflake plugin to evaluate the `SYSTEM$CLUSTERING_DEPTH` system function on key analytical fact tables. It measures the degree of micro-partition overlap for clustered columns, alerting data engineers when frequent updates or inserts fragment table micro-partitions and degrade query pruning.

    ## What you get
    - Proactive visibility into analytical table partition fragmentation.
    - Early warning before complex reporting and dashboard queries experience slow scans.
    - Automated Slack delivery tracking table name and exact clustering depth.

    ## Who it's for
    - Data platform engineers, analytics engineers, and Snowflake architects.
    - FinOps leads optimizing warehouse compute credits consumed by scanning large tables.

    ## Why orchestrate this with Kestra
    Kestra runs automated scheduled analytical health checks natively using the Snowflake JDBC plugin suite, combining SQL telemetry with declarative conditional logic and notification dispatching.

    ## Prerequisites
    - Snowflake account access with permissions to call `SYSTEM$CLUSTERING_DEPTH`.
    - Secrets `SNOWFLAKE_PASSWORD` and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import this blueprint into Kestra.
    2. Configure Snowflake account, database, schema, and table name.
    3. Run manually to check current clustering depth.

    ## How to extend
    - Trigger an automated table reclustering task via `ALTER TABLE ... RECLUSTER` when depth exceeds threshold.
    - Query `AUTOMATIC_CLUSTERING_HISTORY` to monitor reclustering credit consumption.
    - Export clustering telemetry to an administrative dashboard.

    ## Links
    - [Kestra Snowflake Plugin](https://kestra.io/plugins/plugin-jdbc-snowflake)
    - [Snowflake Clustering Depth Function](https://docs.snowflake.com/en/sql-reference/functions/clustering_depth)
  tags:
    - Data
    - Cloud
  subTags:
    - Monitoring & Alerting
    - FinOps & Cost Management
  ee: false
  demo: false
