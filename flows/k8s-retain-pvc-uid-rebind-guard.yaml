                except urllib.error.HTTPError as error:
                    raise RuntimeError("Kubernetes request refused, HTTP " + str(error.code)) from None


            def digest(obj):
                return hashlib.sha256(json.dumps(obj, sort_keys=True, separators=(",", ":")).encode()).hexdigest()


            def quantity(value):
                from decimal import Decimal
                match = re.fullmatch(r"([0-9]+(?:\.[0-9]+)?)([KMGTPE]i|[kKMGTPE]|m|[eE][+-]?[0-9]+)?", str(value))
                if not match or len(str(value)) > 64:
                    raise ValueError("Unsupported storage quantity")
                number, suffix = match.groups()
                suffix = suffix or ""
                binary = {s + "i": 1024 ** i for i, s in enumerate("KMGTPE", 1)}
                decimal = {s: 1000 ** i for i, s in enumerate("KMGTPE", 1)}
                decimal.update({"k": 1000, "m": Decimal("0.001"), "": 1})
                if suffix.startswith(("e", "E")) and suffix not in decimal:
                    exponent = int(suffix[1:])
                    if not -18 <= exponent <= 18:
                        raise ValueError("Storage exponent outside supported ceiling")
                    multiplier = Decimal(10) ** exponent
                else:
                    multiplier = binary.get(suffix, decimal.get(suffix))
                return Decimal(number) * multiplier


            def inspect():
                pv = api(PVP)
                pvc = api(PVCP)
                pm, cm = pv["metadata"], pvc["metadata"]
                ps, cs = pv["spec"], pvc["spec"]
                ref = ps.get("claimRef", {})
                same = ref.get("namespace") == NS and ref.get("name") == PVC
                healthy = same and ref.get("uid") == cm["uid"] and pv.get("status", {}).get("phase") == "Bound" and pvc.get("status", {}).get("phase") == "Bound" and cs.get("volumeName") == PV
                reasons = []
                if pm.get("deletionTimestamp") or cm.get("deletionTimestamp"):
                    reasons.append("deleting")
                if not same or not ref.get("uid"):
                    reasons.append("different_claim_identity")
                if cs.get("volumeName") != PV:
                    reasons.append("not_explicitly_requested")
                if ps.get("persistentVolumeReclaimPolicy") != "Retain":
                    reasons.append("not_retain")
                if KEEP in pm.get("labels", {}):
                    reasons.append("keep_label")
                if not healthy:
                    if pv.get("status", {}).get("phase") != "Released" or pvc.get("status", {}).get("phase") != "Pending":
                        reasons.append("wrong_phase")
                    if ref.get("uid") == cm["uid"]:
                        reasons.append("not_replacement")
                    stamp = pv.get("status", {}).get("lastPhaseTransitionTime", "")
                    try:
                        released = datetime.fromisoformat(stamp.replace("Z", "+00:00"))
                        if released.tzinfo is None:
                            raise ValueError()
                        age = (datetime.now(timezone.utc) - released).total_seconds()
                        if age < MINUTES * 60:
                            reasons.append("within_grace")
                    except (ValueError, TypeError):
                        reasons.append("missing_transition")
                if not healthy and (ps.get("storageClassName", "") != cs.get("storageClassName", "") or
                                    ps.get("volumeMode", "Filesystem") != cs.get("volumeMode", "Filesystem") or
                                    ps.get("volumeAttributesClassName", "") != cs.get("volumeAttributesClassName", "") or
                                    cs.get("selector") or
                                    not set(cs.get("accessModes", [])).issubset(ps.get("accessModes", []))):
                    reasons.append("incompatible_spec")
                if not healthy and quantity(ps.get("capacity", {}).get("storage", "")) < quantity(cs.get("resources", {}).get("requests", {}).get("storage", "")):
                    reasons.append("insufficient_capacity")
                plan = {"pv_uid": pm["uid"], "pvc_uid": cm["uid"], "pv_spec": digest(ps), "pvc_spec": digest(cs),
                        "ref": ref, "eligible": not reasons and not healthy, "healthy": healthy, "reasons": reasons,
                        "pv_phase": pv.get("status", {}).get("phase"), "pvc_phase": pvc.get("status", {}).get("phase"),
                        "pv_resource_version": pm["resourceVersion"], "released_at": pv.get("status", {}).get("lastPhaseTransitionTime"),
                        "storage": ps, "pvc_metadata": {"name": PVC, "namespace": NS, "uid": cm["uid"]}}
                return pv, pvc, plan


            pv, pvc, plan = inspect()
            if MODE == "audit":
                print('::{"outputs":' + json.dumps({"plan": plan}) + '}::')
            elif MODE == "recover":
                approved = json.loads(os.environ["PLAN"])
                for key in ("pv_uid", "pvc_uid", "pv_spec", "pvc_spec", "released_at"):
                    if plan[key] != approved[key]:
                        raise RuntimeError("Approved identity or specification changed: " + key)
                if not plan["eligible"]:
                    raise RuntimeError("Target is no longer eligible")
                new_ref = {"apiVersion": "v1", "kind": "PersistentVolumeClaim", "namespace": NS, "name": PVC, "uid": plan["pvc_uid"]}
                api(PVP, [
                    {"op": "test", "path": "/metadata/uid", "value": plan["pv_uid"]},
                    {"op": "test", "path": "/metadata/resourceVersion", "value": plan["pv_resource_version"]},
                    {"op": "test", "path": "/spec/claimRef", "value": plan["ref"]},
                    {"op": "replace", "path": "/spec/claimRef", "value": new_ref},
                ])
                print('::{"outputs":{"reserved_uid":' + json.dumps(plan["pvc_uid"]) + '}}::')
            elif MODE == "verify":
                approved = json.loads(os.environ["PLAN"])
                deadline = time.monotonic() + 30
                while True:
                    pv, pvc, plan = inspect()
                    if plan["pv_uid"] != approved["pv_uid"] or plan["pvc_uid"] != approved["pvc_uid"]:
                        raise RuntimeError("Recovery identity changed")
                    retained_spec = dict(pv["spec"])
                    retained_spec["claimRef"] = approved["storage"]["claimRef"]
                    if digest(retained_spec) != approved["pv_spec"] or plan["pvc_spec"] != approved["pvc_spec"]:
                        raise RuntimeError("Protected storage or claim spec changed")
                    if plan["healthy"]:
                        print('::{"outputs":{"recovered":true,"pv_uid":' + json.dumps(plan["pv_uid"]) + ',"pvc_uid":' + json.dumps(plan["pvc_uid"]) + '}}::')
                        break
                    if time.monotonic() >= deadline:
                        raise RuntimeError("Intended PV/PVC pair did not reach Bound within 30 seconds")
                    time.sleep(1)
            else:
                raise ValueError("Unknown mode")
          env:
          - name: PV
            value: '{{ inputs.pv_name }}'
          - name: NS
            value: '{{ inputs.claim_namespace }}'
          - name: PVC
            value: '{{ inputs.claim_name }}'
          - name: MINUTES
            value: '{{ inputs.min_released_age_minutes }}'
          - name: MODE
            value: verify
          - name: PLAN
            value: '{{ outputs.audit.vars.plan | toJson }}'
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
              ephemeral-storage: 1Mi
            limits:
              cpu: 500m
              memory: 128Mi
              ephemeral-storage: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
    - id: read_recovered_claim
      type: io.kestra.plugin.kubernetes.kubectl.Get
      timeout: PT30S
      connection:
        masterUrl: '{{ inputs.k8s_master_url }}'
        oauthToken: '{{ inputs.k8s_token }}'
        trustCerts: '{{ inputs.trust_certs }}'
      namespace: '{{ inputs.claim_namespace }}'
      resourceType: persistentvolumeclaims
      resourcesNames:
      - '{{ inputs.claim_name }}'
      fetchType: FETCH_ONE
    - id: require_bound
      type: io.kestra.plugin.core.execution.Fail
      condition: '{{ (outputs.read_recovered_claim.statusItem.status.phase ?? '''')
        != ''Bound'' or not (outputs.verify_pair.vars.recovered ?? false) }}'
      errorMessage: The intended claim is not Bound after recovery.
    else:
    - id: declined
      type: io.kestra.plugin.core.log.Log
      message: Approval declined. Claim reference unchanged.
  else:
  - id: read_only
    type: io.kestra.plugin.core.log.Log
    message: Read-only result. No claim reference was changed.
errors:
- id: alert_failure
  type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
  url: "{{ secret('SLACK_WEBHOOK_URL') }}"
  payload: '{"text":"Retain PVC identity recovery failed. Execution {{ execution.id
    }}. Inspect the retained PV and intended claim before retrying."}'
triggers:
- id: daily_audit
  type: io.kestra.plugin.core.trigger.Schedule
  cron: 0 6 * * *
  disabled: true
  inputs:
    dry_run: true
    auto_remediate: false
extend:
  # SPDX-License-Identifier: Apache-2.0
  title: Recover a Retain volume blocked by a replacement claim UID
  shortDescription: Reserve one retained PV for its same-name replacement PVC after
    approval and verify the intended binding.
  metaTitle: Recover Retain PVC identity with Kestra
  metaDescription: Recover a retained PV for an explicit replacement claim UID with
    approval, conditional writes and a verified Bound pair.
  tags:
  - Infrastructure
  subTags:
  - Kubernetes Operations
  - Day 2 Operations
  demo: false
  ee: false
  description: |
    ## Safety

    This exposes retained data to a replacement claim. Confirm that the replacement belongs to the same tenant. The flow changes one PV claimRef, never deletes storage and never clears the reference to null. Read-only defaults and explicit approval protect the write.

    ## How it works

    An application recreates its deleted PVC with the same name but a new UID. The Retain PV still references the old UID, so the PVC stays Pending. Supply that exact PV and replacement PVC, with spec.volumeName already set.

    1. read_claim uses native kubectl.Get for the namespaced claim. audit runs a native PodCreate to read full PV/PVC specs and classify the pair. Missing resources fail. Only Retain, Released PVs with the same claim namespace/name and a different UID qualify. The grace uses status.lastPhaseTransitionTime. Keep-labelled, incompatible and oversized claims are spared.
    2. change_allowed requires auto_remediate=true and dry_run=false. approval is a Pause; approved defaults to false. On resume, recover rechecks both identities and spec fingerprints. JSON Patch tests the live PV UID, resourceVersion and claimRef before reserving it for the approved PVC UID.
    3. verify_pair waits up to 30 seconds for that exact pair to become Bound and checks protected specs. read_recovered_claim independently reads the PVC through kubectl.Get; require_bound fails on incomplete recovery. Failures notify Slack.

    The bundled named-resource Get/Patch tasks cannot address cluster-scoped PVs. PodCreate carries the bounded API operation and obtains its own service-account token. HTTP calls have a 10-second timeout and 1 MiB response ceiling. No mutation retries are configured.

    ## What you get

    An intended consumer binding and saved storage plan. Bound pairs make repeat runs read-only.

    ## Who it's for

    Platform teams recovering a same-name PVC after accidental deletion while preserving its retained volume.

    ## Why orchestrate this with Kestra

    Approval, target plan, reconciliation and failed-recovery alert share one execution. The disabled audit preserves safe inputs.

    ## Tested end to end

    Kestra 2.0.6/2.0.5 with Kubernetes plugin 1.11.5/1.11.4 against two k3s v1.31.5 clusters. PVC deletion/recreation reproduced Released/Pending. Recovery reached Bound/Bound; a read-only consumer read the original 2816-byte canary. All 128 unrelated PV identities/specs were conserved. Dry-run, refusal, repeat, replacement races, partial recovery and grace boundaries were exercised.

    ## Prerequisites

    Kubernetes 1.31 or later with phase-transition timestamps, a compatible retained PV and an explicit replacement PVC. The executor token needs create/get/list/watch/delete on pods, get on pods/log, list on events and get on the named PVC. The pod service account needs get/patch on the named PV and get on the named PVC. Scope resourceNames where possible; it needs no delete permission on storage.

    ### Secrets

    K8S_MASTER_URL, K8S_TOKEN and SLACK_WEBHOOK_URL. k8s_token is a SECRET input. Leave trust_certs=false with trusted TLS; true is for an isolated test cluster.

    ### Inputs

    pv_name, claim_namespace and claim_name select one pair. recovery_service_account names the account. min_released_age_minutes defaults 1440, range 0 to 525600. dry_run defaults true; auto_remediate defaults false. pod_name_prefix defaults pv-recovery-.

    ## Quick start

    1. Configure secrets and least-privilege service accounts. Create the replacement PVC with the old volumeName.
    2. Set the exact names and run the defaults. Review identities, storage spec and eligibility.
    3. Set both write flags, approve the Pause and check the Bound result. Validate retained data with your application before resuming traffic.

    ## How to extend

    Add a read-only application canary after binding. Route failed recovery to your incident system.

    Limits: concurrency queues this flow only. PV CAS protects that object; there is no cross-object transaction. A PVC deleted after the final read makes verification fail and leaves retained data reserved by UID. Reconcile live state before retry. This proves binding, not data cleansing, cloud savings or a cloud-disk deletion.

    ## Links

    [Kubernetes retained volumes](https://kubernetes.io/docs/concepts/storage/persistent-volumes/#retain)
    [Kubernetes plugin](https://kestra.io/plugins/plugin-kubernetes)
    [Apache-2.0 license](https://www.apache.org/licenses/LICENSE-2.0)

    This blueprint was created by [zkasuran](https://github.com/zkasuran).
