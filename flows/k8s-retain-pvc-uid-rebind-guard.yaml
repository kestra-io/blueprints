id: k8s-retain-pvc-uid-rebind-guard
namespace: company.team
description: Reserve a Retain PV for its same-name replacement PVC UID after approval,
  then require the exact pair to be Bound.
concurrency:
  limit: 1
  behavior: QUEUE
inputs:
- id: dry_run
  type: BOOL
  defaults: true
- id: auto_remediate
  type: BOOL
  defaults: false
- id: pv_name
  type: STRING
  defaults: retained-data
- id: claim_namespace
  type: STRING
  defaults: default
- id: claim_name
  type: STRING
  defaults: application-data
- id: min_released_age_minutes
  type: INT
  defaults: 1440
- id: recovery_service_account
  type: STRING
  defaults: pv-recovery
- id: pod_name_prefix
  type: STRING
  defaults: pv-recovery-
- id: k8s_master_url
  type: STRING
  defaults: '{{ secret(''K8S_MASTER_URL'') }}'
- id: k8s_token
  type: SECRET
  defaults: '{{ secret(''K8S_TOKEN'') }}'
- id: trust_certs
  type: BOOL
  defaults: false
tasks:
- id: read_claim
  type: io.kestra.plugin.kubernetes.kubectl.Get
  timeout: PT30S
  connection:
    masterUrl: '{{ inputs.k8s_master_url }}'
    oauthToken: '{{ inputs.k8s_token }}'
    trustCerts: '{{ inputs.trust_certs }}'
  namespace: '{{ inputs.claim_namespace }}'
  resourceType: persistentvolumeclaims
  resourcesNames:
  - '{{ inputs.claim_name }}'
  fetchType: FETCH_ONE
- id: audit
  type: io.kestra.plugin.kubernetes.core.PodCreate
  description: The named cluster-scoped PV and full spec are unsupported by kubectl
    Get/Patch; use a bounded API call in a native pod.
  connection:
    masterUrl: '{{ inputs.k8s_master_url }}'
    oauthToken: '{{ inputs.k8s_token }}'
    trustCerts: '{{ inputs.trust_certs }}'
  namespace: '{{ inputs.claim_namespace }}'
  timeout: PT2M
  metadata:
    name: '{{ inputs.pod_name_prefix }}audit-{{ execution.id | lower }}'
  waitUntilRunning: PT45S
  waitRunning: PT60S
  waitForLogInterval: PT0S
  spec:
    serviceAccountName: '{{ inputs.recovery_service_account }}'
    restartPolicy: Never
    activeDeadlineSeconds: 90
    containers:
    - name: recovery
      image: python:3.12-slim@sha256:a6e34c598f2467ed0e9a8d349809fcd8b5c603269512df273a0bb1784edc11b1
      command:
      - python
      - -c
      - |
        # SPDX-License-Identifier: Apache-2.0
        """Recover one same-name replacement claim using exact UID reservation."""
        import hashlib
        import json
        import os
        import re
        import ssl
        import time
        import urllib.error
        import urllib.request
        from datetime import datetime, timezone
        from pathlib import Path

        BASE = "https://kubernetes.default.svc"
        SA = Path("/var/run/secrets/kubernetes.io/serviceaccount")
        CTX = ssl.create_default_context(cafile=str(SA / "ca.crt"))
        TOKEN = (SA / "token").read_text().strip()
        PV = os.environ["PV"]
        NS = os.environ["NS"]
        PVC = os.environ["PVC"]
        MODE = os.environ["MODE"]
        MINUTES = int(os.environ["MINUTES"])
        KEEP = "kestra.io/pv-reaper-keep"
        for value in (PV, NS, PVC):
            if len(value) > 253 or not re.fullmatch(r"[a-z0-9](?:[a-z0-9.-]*[a-z0-9])?", value):
                raise ValueError("Invalid Kubernetes name")
        if not 0 <= MINUTES <= 525600:
            raise ValueError("Grace must be 0 to 525600 minutes")
        PVP = "/api/v1/persistentvolumes/" + PV
        PVCP = "/api/v1/namespaces/" + NS + "/persistentvolumeclaims/" + PVC


        def api(path, body=None):
            data = json.dumps(body).encode() if body is not None else None
            req = urllib.request.Request(BASE + path, data=data, method="PATCH" if body is not None else "GET",
                headers={"Authorization": "Bearer " + TOKEN, "Content-Type": "application/json-patch+json"})
            try:
                with urllib.request.urlopen(req, context=CTX, timeout=10) as response:
                    raw = response.read(1048577)
                    if len(raw) > 1048576:
                        raise ValueError("Resource exceeds 1 MiB ceiling")
                    return json.loads(raw)
            except urllib.error.HTTPError as error:
                raise RuntimeError("Kubernetes request refused, HTTP " + str(error.code)) from None


        def digest(obj):
            return hashlib.sha256(json.dumps(obj, sort_keys=True, separators=(",", ":")).encode()).hexdigest()


        def quantity(value):
            from decimal import Decimal
            match = re.fullmatch(r"([0-9]+(?:\.[0-9]+)?)([KMGTPE]i|[kKMGTPE]|m|[eE][+-]?[0-9]+)?", str(value))
            if not match or len(str(value)) > 64:
                raise ValueError("Unsupported storage quantity")
            number, suffix = match.groups()
            suffix = suffix or ""
            binary = {s + "i": 1024 ** i for i, s in enumerate("KMGTPE", 1)}
            decimal = {s: 1000 ** i for i, s in enumerate("KMGTPE", 1)}
            decimal.update({"k": 1000, "m": Decimal("0.001"), "": 1})
            if suffix.startswith(("e", "E")) and suffix not in decimal:
                exponent = int(suffix[1:])
                if not -18 <= exponent <= 18:
                    raise ValueError("Storage exponent outside supported ceiling")
                multiplier = Decimal(10) ** exponent
            else:
                multiplier = binary.get(suffix, decimal.get(suffix))
            return Decimal(number) * multiplier


        def inspect():
            pv = api(PVP)
            pvc = api(PVCP)
            pm, cm = pv["metadata"], pvc["metadata"]
            ps, cs = pv["spec"], pvc["spec"]
            ref = ps.get("claimRef", {})
            same = ref.get("namespace") == NS and ref.get("name") == PVC
            healthy = same and ref.get("uid") == cm["uid"] and pv.get("status", {}).get("phase") == "Bound" and pvc.get("status", {}).get("phase") == "Bound" and cs.get("volumeName") == PV
            reasons = []
            if pm.get("deletionTimestamp") or cm.get("deletionTimestamp"):
                reasons.append("deleting")
            if not same or not ref.get("uid"):
                reasons.append("different_claim_identity")
            if cs.get("volumeName") != PV:
                reasons.append("not_explicitly_requested")
            if ps.get("persistentVolumeReclaimPolicy") != "Retain":
                reasons.append("not_retain")
            if KEEP in pm.get("labels", {}):
                reasons.append("keep_label")
            if not healthy:
                if pv.get("status", {}).get("phase") != "Released" or pvc.get("status", {}).get("phase") != "Pending":
                    reasons.append("wrong_phase")
                if ref.get("uid") == cm["uid"]:
                    reasons.append("not_replacement")
                stamp = pv.get("status", {}).get("lastPhaseTransitionTime", "")
                try:
                    released = datetime.fromisoformat(stamp.replace("Z", "+00:00"))
                    if released.tzinfo is None:
                        raise ValueError()
                    age = (datetime.now(timezone.utc) - released).total_seconds()
                    if age < MINUTES * 60:
                        reasons.append("within_grace")
                except (ValueError, TypeError):
                    reasons.append("missing_transition")
            if not healthy and (ps.get("storageClassName", "") != cs.get("storageClassName", "") or
                                ps.get("volumeMode", "Filesystem") != cs.get("volumeMode", "Filesystem") or
                                ps.get("volumeAttributesClassName", "") != cs.get("volumeAttributesClassName", "") or
                                cs.get("selector") or
                                not set(cs.get("accessModes", [])).issubset(ps.get("accessModes", []))):
                reasons.append("incompatible_spec")
            if not healthy and quantity(ps.get("capacity", {}).get("storage", "")) < quantity(cs.get("resources", {}).get("requests", {}).get("storage", "")):
                reasons.append("insufficient_capacity")
            plan = {"pv_uid": pm["uid"], "pvc_uid": cm["uid"], "pv_spec": digest(ps), "pvc_spec": digest(cs),
                    "ref": ref, "eligible": not reasons and not healthy, "healthy": healthy, "reasons": reasons,
                    "pv_phase": pv.get("status", {}).get("phase"), "pvc_phase": pvc.get("status", {}).get("phase"),
                    "pv_resource_version": pm["resourceVersion"], "released_at": pv.get("status", {}).get("lastPhaseTransitionTime"),
                    "storage": ps, "pvc_metadata": {"name": PVC, "namespace": NS, "uid": cm["uid"]}}
            return pv, pvc, plan


        pv, pvc, plan = inspect()
        if MODE == "audit":
            print('::{"outputs":' + json.dumps({"plan": plan}) + '}::')
        elif MODE == "recover":
            approved = json.loads(os.environ["PLAN"])
            for key in ("pv_uid", "pvc_uid", "pv_spec", "pvc_spec", "released_at"):
                if plan[key] != approved[key]:
                    raise RuntimeError("Approved identity or specification changed: " + key)
            if not plan["eligible"]:
                raise RuntimeError("Target is no longer eligible")
            new_ref = {"apiVersion": "v1", "kind": "PersistentVolumeClaim", "namespace": NS, "name": PVC, "uid": plan["pvc_uid"]}
            api(PVP, [
                {"op": "test", "path": "/metadata/uid", "value": plan["pv_uid"]},
                {"op": "test", "path": "/metadata/resourceVersion", "value": plan["pv_resource_version"]},
                {"op": "test", "path": "/spec/claimRef", "value": plan["ref"]},
                {"op": "replace", "path": "/spec/claimRef", "value": new_ref},
            ])
            print('::{"outputs":{"reserved_uid":' + json.dumps(plan["pvc_uid"]) + '}}::')
        elif MODE == "verify":
            approved = json.loads(os.environ["PLAN"])
            deadline = time.monotonic() + 30
            while True:
                pv, pvc, plan = inspect()
                if plan["pv_uid"] != approved["pv_uid"] or plan["pvc_uid"] != approved["pvc_uid"]:
                    raise RuntimeError("Recovery identity changed")
                retained_spec = dict(pv["spec"])
                retained_spec["claimRef"] = approved["storage"]["claimRef"]
                if digest(retained_spec) != approved["pv_spec"] or plan["pvc_spec"] != approved["pvc_spec"]:
                    raise RuntimeError("Protected storage or claim spec changed")
                if plan["healthy"]:
                    print('::{"outputs":{"recovered":true,"pv_uid":' + json.dumps(plan["pv_uid"]) + ',"pvc_uid":' + json.dumps(plan["pvc_uid"]) + '}}::')
                    break
                if time.monotonic() >= deadline:
                    raise RuntimeError("Intended PV/PVC pair did not reach Bound within 30 seconds")
                time.sleep(1)
        else:
            raise ValueError("Unknown mode")
      env:
      - name: PV
        value: '{{ inputs.pv_name }}'
      - name: NS
        value: '{{ inputs.claim_namespace }}'
      - name: PVC
        value: '{{ inputs.claim_name }}'
      - name: MINUTES
        value: '{{ inputs.min_released_age_minutes }}'
      - name: MODE
        value: audit
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
          ephemeral-storage: 1Mi
        limits:
          cpu: 500m
          memory: 128Mi
          ephemeral-storage: 32Mi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
          - ALL
        readOnlyRootFilesystem: true
- id: report
  type: io.kestra.plugin.core.log.Log
  message: PV recovery healthy={{ outputs.audit.vars.plan.healthy }} eligible={{ outputs.audit.vars.plan.eligible
    }} reasons={{ outputs.audit.vars.plan.reasons }} intended_claim_uid={{ outputs.audit.vars.plan.pvc_uid
    }}
- id: change_allowed
  type: io.kestra.plugin.core.flow.If
  condition: '{{ outputs.audit.vars.plan.eligible and inputs.auto_remediate and not
    inputs.dry_run }}'
  then:
  - id: approval
    type: io.kestra.plugin.core.flow.Pause
    timeout: PT1H
    onResume:
    - id: approved
      type: BOOL
      defaults: false
  - id: approved
    type: io.kestra.plugin.core.flow.If
    condition: '{{ outputs.approval.onResume.approved ?? false }}'
    then:
    - id: recover
      type: io.kestra.plugin.kubernetes.core.PodCreate
