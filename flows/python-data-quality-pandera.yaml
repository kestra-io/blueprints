id: python-data-quality-pandera
namespace: company.team

triggers:
  - id: daily
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 9 * * *"

tasks:
  - id: validate_data
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.11-slim
    dependencies:
      - pandas
      - pandera
    script: |
      import pandas as pd
      import pandera as pa
      import sys

      # 1. Create dummy data (or fetch from your source)
      data = pd.DataFrame({
          "product": ["Apple", "Banana", "Orange"],
          "price": [1.5, 2.0, 0.5],  # Change to -0.5 to see the validation fail!
          "inventory": [100, 50, 20]
      })

      # 2. Define the Schema (The Data Contract)
      schema = pa.DataFrameSchema({
          "product": pa.Column(str),
          "price": pa.Column(float, pa.Check.greater_than(0)),
          "inventory": pa.Column(int, pa.Check.greater_than_or_equal_to(0))
      })

      # 3. Validation Logic
      try:
          schema.validate(data, lazy=True)
          print("Data Quality Check Passed!")
      except pa.errors.SchemaErrors as err:
          print("Data Quality Check Failed!")
          print(err.failure_cases)
          sys.exit(1) # This tells Kestra the task failed

  - id: parallel_post_processing
    type: io.kestra.plugin.core.flow.Parallel
    tasks:
      - id: success_notification
        type: io.kestra.plugin.core.log.Log
        message: "Data is clean! Proceeding to the next stage..."
      - id: trigger_downstream_etl
        type: io.kestra.plugin.core.log.Log
        message: "Imagine triggering downstream dbt/ETL here."

extend:
  shortDescription: Validate data quality and enforce data contracts using the Pandera library inside a Python Script task.
  title: Validate Data Quality with Pandera in Python
  description: |
    This blueprint demonstrates how to implement data quality checks using the `pandera` library within a Python script task. 
    This is a common pattern for Data Engineers to ensure data reliability and integrity before proceeding with downstream processing.
    
    ## How it works
    1. A Python script task runs in an isolated `python:3.11-slim` container.
    2. It installs `pandas` and `pandera`.
    3. The script defines a schema contract and validates a DataFrame against it.
    4. If validation fails (e.g., due to a negative price), the script exits with an error code, safely halting the pipeline.
    5. If successful, downstream tasks are executed in parallel.

    ## Prerequisites
    - Docker must be available in the execution environment to run the Python container.
    
    ## Expected outputs
    - In this demo, the workflow executes successfully because all prices are positive. If you change a price to a negative value, the task will intentionally fail, demonstrating how Pandera prevents bad data from moving downstream.
  metaTitle: Data Quality Checks in Python using Pandera
  metaDescription: Validate data quality and enforce data contracts using the Pandera library inside a Python Script task.
  tags:
    - Data
  subTags:
    - Data Quality
    - Python
  ee: false
  demo: true
