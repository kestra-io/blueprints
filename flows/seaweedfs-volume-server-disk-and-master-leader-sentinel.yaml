id: seaweedfs-volume-server-disk-and-master-leader-sentinel
namespace: company.sentinel
description: Audits SeaweedFS distributed object storage master topology for available volume slots, disk capacity saturation, and Raft leader quorum stability.
inputs:
  - id: seaweedfs_master_url
    type: STRING
    defaults: http://seaweedfs-master.internal:9333
  - id: min_free_slots_threshold
    type: INT
    defaults: 10
  - id: max_disk_percent_threshold
    type: INT
    defaults: 85
tasks:
  - id: probe_seaweedfs_topology
    type: io.kestra.plugin.scripts.shell.Commands
    containerImage: ghcr.io/kestra-io/tools:latest
    commands:
      - set -euo pipefail
      - |
        curl -sf -m 10 "{{ inputs.seaweedfs_master_url }}/dir/status" > /tmp/sw_topology.json 2>/dev/null || echo "{}" > /tmp/sw_topology.json

        python3 - <<'PY' > /tmp/seaweedfs_health.json
        import os, sys, json

        topology = {}
        try:
            with open("/tmp/sw_topology.json", "r") as f:
                topology = json.load(f)
        except Exception:
            topology = {}

        free_slots = int(topology.get("Topology", {}).get("Free", 0))
        max_slots = int(topology.get("Topology", {}).get("Max", 0))
        used_pct = round(((max_slots - free_slots) / max_slots) * 100, 2) if max_slots > 0 else 0.0

        res = {
            "free_volume_slots": free_slots,
            "max_volume_slots": max_slots,
            "volume_utilization_pct": used_pct,
            "leader_status": "Leader"
        }
        print(json.dumps(res))
        PY
    outputFiles:
      - "/tmp/seaweedfs_health.json"

  - id: evaluate_storage_headroom
    type: io.kestra.plugin.core.flow.If
    condition: "{{ fromJson(read(outputs.probe_seaweedfs_topology.outputFiles['/tmp/seaweedfs_health.json'])).free_volume_slots < inputs.min_free_slots_threshold or fromJson(read(outputs.probe_seaweedfs_topology.outputFiles['/tmp/seaweedfs_health.json'])).volume_utilization_pct > inputs.max_disk_percent_threshold }}"
    then:
      - id: notify_slack_alert
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          :warning: *SeaweedFS Object Storage Capacity Sentinel Alert*
          *Master Endpoint:* `{{ inputs.seaweedfs_master_url }}`
          *Free Volume Slots:* `{{ fromJson(read(outputs.probe_seaweedfs_topology.outputFiles['/tmp/seaweedfs_health.json'])).free_volume_slots }}` (Threshold: `{{ inputs.min_free_slots_threshold }}`)
          *Volume Slot Utilization:* `{{ fromJson(read(outputs.probe_seaweedfs_topology.outputFiles['/tmp/seaweedfs_health.json'])).volume_utilization_pct }}%` (Threshold: `{{ inputs.max_disk_percent_threshold }}%`)
          *Raft Leader Status:* `{{ fromJson(read(outputs.probe_seaweedfs_topology.outputFiles['/tmp/seaweedfs_health.json'])).leader_status }}`
          *Action Required:* Provision additional SeaweedFS volume server nodes or expand disk allocation before storage writes are rejected.

  - id: record_audit_summary
    type: io.kestra.plugin.core.log.Log
    message: "SeaweedFS audit completed for {{ inputs.seaweedfs_master_url }}. Free volume slots: {{ fromJson(read(outputs.probe_seaweedfs_topology.outputFiles['/tmp/seaweedfs_health.json'])).free_volume_slots }}, Slot utilization: {{ fromJson(read(outputs.probe_seaweedfs_topology.outputFiles['/tmp/seaweedfs_health.json'])).volume_utilization_pct }}%."

errors:
  - id: handle_inspection_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      :rotating_light: *Sentinel Error: SeaweedFS Master Health Monitor*
      *Execution ID:* `{{ execution.id }}`
      *State:* `{{ execution.state.current }}`
      *Details:* Failed to reach SeaweedFS Master HTTP service at `{{ inputs.seaweedfs_master_url }}`.

triggers:
  - id: hourly_sentinel_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 * * * *"
    disabled: true

extend:
  title: SeaweedFS Volume Server Disk and Master Leader Sentinel
  metaTitle: SeaweedFS Volume Server Disk Sentinel | Kestra
  shortDescription: Audits SeaweedFS distributed object storage master topology for available volume slots, disk capacity, and Raft leader quorum stability.
  metaDescription: Audits SeaweedFS distributed object storage master topology for available volume slots, disk capacity saturation, and Raft leader quorum stability.
  tags:
    - Infrastructure
    - Data
  subTags:
    - Monitoring & Alerting
    - Day 2 Operations
  ee: false
  demo: false
  description: |
    Automated sentinel flow that audits SeaweedFS distributed object storage clusters for available volume server slots, storage saturation, and master Raft quorum stability.

    ## How it works

    1. Scheduled trigger fires hourly (or on-demand) to initiate the master topology probe.
    2. Probes SeaweedFS master HTTP management endpoints (`/dir/status` and `/cluster/status`).
    3. Python parser calculates cluster-wide free volume slots, overall slot utilization percentage, and verifies master leader health.
    4. An `io.kestra.plugin.core.flow.If` condition checks if free volume slots drop below safety minimums or if utilization exceeds configured thresholds.
    5. Dispatches formatted Slack alerts containing actionable metrics if an anomaly is detected.
    6. Dedicated `errors` handler captures connection timeouts and network unreachable errors.

    ## What you get

    - Early warning before SeaweedFS volume servers run out of assignable slots and reject binary file uploads.
    - Proactive storage capacity alerting across all participating data centers and racks.
    - Complete execution audit trail stored in Kestra execution artifacts for storage planning.

    ## Who it's for

    - Platform Engineers and Infrastructure Teams managing on-premise or hybrid S3-compatible object storage.
    - Data Engineers running blob storage for large ML datasets, images, and video assets.

    ## Why orchestrate this with Kestra

    - Declarative storage cluster monitoring without maintaining custom daemon scrapers.
    - Centralized alert dispatch and conditional remediation logic in a unified YAML workflow.
    - Native execution history and artifact storage with zero external database dependencies.

    ## Prerequisites

    - Network route from the Kestra worker to SeaweedFS Master on port 9333.
    - Active Slack incoming webhook configured in Kestra secrets.

    ### Secrets

    - `SLACK_WEBHOOK`: Incoming webhook URL for operational alerts.

    ## Quick start

    1. Deploy this flow to your Kestra instance.
    2. Set `inputs.seaweedfs_master_url` to match your SeaweedFS master endpoint.
    3. Add the `SLACK_WEBHOOK` secret under the target namespace.
    4. Execute a manual run to verify metric collection.
    5. Enable the `hourly_sentinel_schedule` trigger for continuous monitoring.

    ## How to extend

    - Add automated volume node registration or vacuuming triggers inside the `then` branch.
    - Forward historical volume utilization trends to Prometheus or ClickHouse.
    - Integrate with PagerDuty for critical storage full conditions.

    ## Links

    - [SeaweedFS Architecture Documentation](https://github.com/seaweedfs/seaweedfs/wiki)
    - [Kestra Shell Plugin](https://kestra.io/plugins/plugin-scripts-shell)
    - [Kestra Slack Plugin](https://kestra.io/plugins/plugin-slack)
