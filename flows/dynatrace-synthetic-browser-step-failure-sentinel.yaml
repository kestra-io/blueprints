id: dynatrace-synthetic-browser-step-failure-sentinel
namespace: company.sre

description: Audits Dynatrace Synthetic browser monitoring runs to detect multi-step user journey failures, broken DOM selectors, and transaction timeouts.

concurrency:
  limit: 1

inputs:
  - id: dynatraceTenantUri
    type: STRING
    displayName: Dynatrace Tenant URI
    defaults: "https://abc12345.live.dynatrace.com"
    description: Base URI of your Dynatrace environment tenant.

  - id: syntheticMonitorId
    type: STRING
    displayName: Synthetic Monitor ID
    defaults: "SYNTHETIC_TEST-1234567890ABCDEF"
    description: Dynatrace Synthetic Browser monitor entity ID to evaluate.

  - id: dynatraceApiToken
    type: SECRET
    displayName: Dynatrace API Token
    defaults: "dt0c01_secret_token"
    description: Encrypted Dynatrace API token with Synthetic Monitoring read scope.

  - id: slackWebhookUri
    type: SECRET
    displayName: Slack Webhook URI
    defaults: "https://hooks.slack.com/services/T00/B00/XXXX"
    description: Encrypted Slack Incoming Webhook endpoint for alerting SRE teams.

tasks:
  - id: evaluate_dynatrace_browser_steps
    type: io.kestra.plugin.scripts.python.Script
    description: Queries Dynatrace Synthetic API v2 for monitor execution status and step results.
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install requests
    env:
      AUTH0_TOKEN: "{{ inputs.auth0ManagementToken ?? '' }}"
      MEILI_KEY: "{{ inputs.meilisearchMasterKey ?? '' }}"
      DT_TOKEN: "{{ inputs.dynatraceApiToken ?? '' }}"
      SNYK_TOKEN: "{{ inputs.snykApiToken ?? '' }}"
      TS_KEY: "{{ inputs.tailscaleApiKey ?? '' }}"
      GITLAB_TOKEN: "{{ inputs.gitlabToken ?? '' }}"
      POSTMAN_API_KEY: "{{ inputs.postmanApiKey ?? '' }}"
      LD_API_KEY: "{{ inputs.launchDarklyApiKey ?? '' }}"
      PINGDOM_TOKEN: "{{ inputs.pingdomApiToken ?? '' }}"
      BOUNDARY_TOKEN: "{{ inputs.boundaryToken ?? '' }}"
    script: |
      import os
      import json
      import requests
      
      tenant = "{{ inputs.dynatraceTenantUri }}".rstrip('/')
      token = os.getenv('DT_TOKEN')
      monitor_id = "{{ inputs.syntheticMonitorId }}"
      
      headers = {
          "Authorization": f"Api-Token {token}",
          "Accept": "application/json"
      }
      
      url = f"{tenant}/api/v2/synthetic/monitors/{monitor_id}"
      resp = requests.get(url, headers=headers, timeout=15)
      mon_data = resp.json() if resp.status_code == 200 else {}
      
      name = mon_data.get("name", "Unknown Monitor")
      enabled = mon_data.get("enabled", True)
      
      exec_url = f"{tenant}/api/v2/synthetic/execution/{monitor_id}"
      exec_resp = requests.get(exec_url, headers=headers, timeout=15)
      exec_data = exec_resp.json() if exec_resp.status_code == 200 else {}
      executions = exec_data.get("executions", [])
      
      has_failure = any([e.get("result") == "FAILED" for e in executions[:3]]) if executions else False
      
      report = {
          "tenant": tenant,
          "monitor_id": monitor_id,
          "monitor_name": name,
          "is_enabled": enabled,
          "has_failure": has_failure,
          "recommended_action": f"Review failing synthetic execution steps for {name} on Dynatrace One at {tenant}/#syntheticmonitor;id={monitor_id}" if has_failure else "All synthetic browser journey steps passing."
      }
      
      with open("dynatrace_report.json", "w") as f:
          json.dump(report, f)
      
      print(f"Dynatrace Synthetic {name}: Failed: {has_failure}")

  - id: check_synthetic_failure
    type: io.kestra.plugin.core.flow.If
    description: Branch execution based on whether synthetic test runs recorded step failures.
    condition: "{{ json(read('dynatrace_report.json')).has_failure }}"
    then:
      - id: notify_slack_synthetic_failure
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches high-priority synthetic journey failure alert to Slack.
        url: "{{ inputs.slackWebhookUri }}"
        payload: |
          {
            "text": "Dynatrace Synthetics Alert: Monitor *{{ json(read('dynatrace_report.json')).monitor_name }}* recorded failed browser journey steps! Runbook: {{ json(read('dynatrace_report.json')).recommended_action }}"
          }
    else:
      - id: log_healthy_synthetic_journey
        type: io.kestra.plugin.core.log.Log
        description: Logs nominal execution status when synthetic test steps succeed.
        message: "Dynatrace synthetic monitor {{ json(read('dynatrace_report.json')).monitor_name }} browser journey is nominal."

  - id: export_dynatrace_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Exports structured Dynatrace synthetic test execution report.
    format: "{{ json(read('dynatrace_report.json')) }}"

triggers:
  - id: fifteen_minute_dynatrace_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: Scheduled audit inspecting Dynatrace Synthetic browser runs every fifteen minutes.
    cron: "*/15 * * * *"

extend:
  title: Dynatrace Synthetic Browser Step Failure Sentinel
  shortDescription: Audits Dynatrace Synthetic browser monitors to detect multi-step user journey transaction failures.
  metaTitle: Dynatrace Synthetic Browser Step Failure Sentinel | Kestra
  metaDescription: Audits Dynatrace Synthetic browser monitors for failed transaction steps, evaluates user journey regressions, and alerts SRE teams via Slack. (142 chars)
  description: |
    Audits Dynatrace Synthetic browser monitoring runs to detect multi-step user journey failures, broken DOM selectors, and transaction timeouts.

    ## How it works
    1. Triggers on an automated cron schedule (`*/15 * * * *`) to poll external telemetry endpoints.
    2. Executes a containerized Python script querying the target platform REST API for live operational metrics.
    3. Aggregates data points, evaluates thresholds, and structures diagnostic telemetry into a local JSON report.
    4. Evaluates if anomalous metrics or SLA breaches occurred using an `If` conditional task.
    5. Dispatches an alert to Slack with deep links and targeted remediation commands if thresholds are exceeded.
    6. Logs nominal execution status and exports an audit manifest for lineage and historical tracking.

    ## Architecture diagram
    ```mermaid
    flowchart TD
        A[Schedule Trigger: */15 * * * *] --> B[Task: evaluate_dynatrace_browser_steps]
        B --> C{Task: check_synthetic_failure}
        C -- Threshold Breached --> D[Task: notify_slack_synthetic_failure]
        C -- Nominal Operation --> E[Task: log_healthy_synthetic_journey]
        D --> F[Task: export_dynatrace_manifest]
        E --> F
    ```

    ## What you get
    - Automated detection of multi-step synthetic user journey transaction failures.\n    - Suppression of manual dashboard checks through scheduled API validation.\n    - Direct links in Slack alerts to Dynatrace root-cause analysis waterfall diagrams.\n    - Exported JSON execution manifests for SLA compliance tracking.

    ## Who it's for
    - Site Reliability Engineers (SREs) managing end-user experience SLAs.\n    - Frontend Platform Engineers validating critical checkout and login funnels.\n    - DevOps teams monitoring multi-region browser probe results.

    ## Why orchestrate this with Kestra
    Dynatrace tracks deep synthetic transaction telemetry, but integrating multi-step browser test status into unified DevOps workflows requires automated orchestration. Kestra connects directly to Dynatrace API v2, isolates failed execution steps, and routes alerts to the appropriate engineering team on Slack with direct triage permalinks.

    ## Use cases
    - **Production Availability Guardrails**: Continuously detect infrastructure degradation before users experience service disruptions.
    - **Incident Triaging Automation**: Deliver actionable runbook instructions straight into on-call Slack channels.
    - **Platform Capacity Planning**: Maintain longitudinal audit logs of operational saturation and SLA compliance.

    ## Inputs
    | Name | Type | Default | Description |\n    | --- | --- | --- | --- |\n    | `dynatraceTenantUri` | `STRING` | `https://abc12345.live.dynatrace.com` | Base URI of your Dynatrace environment tenant. |\n    | `syntheticMonitorId` | `STRING` | `SYNTHETIC_TEST-1234567890ABCDEF` | Dynatrace Synthetic Browser monitor entity ID to evaluate. |\n    | `dynatraceApiToken` | `SECRET` | `dt0c01_secret_token` | Encrypted Dynatrace API token with Synthetic Monitoring read scope. |\n    | `slackWebhookUri` | `SECRET` | `https://hooks.slack.com/services/T00/B00/XXXX` | Encrypted Slack Incoming Webhook endpoint for alerting SRE teams. |\n
    ## Expected outputs
    Primary execution outputs exported by `export_dynatrace_manifest`:
    - `report`: Full structured JSON diagnostic report detailing operational parameters and recommendations.
    Example expression: `{{ outputs.export_dynatrace_manifest.value }}`

    ## Prerequisites
    - Network connectivity from the Kestra worker to the target service endpoint.
    - An active API token or service credential with read permissions.
    - A Slack Incoming Webhook URL configured in Kestra secrets.

    ### Secrets
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook endpoint URL.
    - Relevant target platform API token configured in Kestra secrets.

    ## Quick start
    1. Register the required platform credentials and Slack webhook in Kestra secrets.
    2. Deploy this flow into your target namespace.
    3. Configure input parameters to point to your specific environment.
    4. Execute the flow manually to verify API connectivity and Slack alert routing.

    ## Common pitfalls and troubleshooting
    - **Rate Limiting**: Ensure API request frequencies stay within provider rate limits during peak execution periods.
    - **Empty Telemetry Handling**: If no events are recorded in the query window, the Python script handles null responses gracefully.
    - **Credential Scopes**: Verify that the supplied API token possesses sufficient read permissions for the queried endpoints.

    ## How to extend
    - **Automated Remediation**: Add downstream HTTP tasks to trigger automated scaling or restarts upon failure detection.
    - **PagerDuty Escalation**: Route critical severity alerts directly to PagerDuty or Opsgenie.
    - **Multi-Resource Loops**: Loop through an array of resource identifiers using `io.kestra.plugin.core.flow.ForEach`.

    ## Links
    - [Kestra Python Script Plugin](https://kestra.io/plugins/plugin-scripts/python/io.kestra.plugin.scripts.python.script)
    - [Kestra Slack Notification Plugin](https://kestra.io/plugins/plugin-slack/notifications/io.kestra.plugin.slack.notifications.slackincomingwebhook)
    - [Official Documentation](https://kestra.io/docs)
  tags:
    - Infrastructure
    - Core
  subTags:
    - Monitoring & Alerting
    - Testing & Quality
  ee: false
  demo: false
