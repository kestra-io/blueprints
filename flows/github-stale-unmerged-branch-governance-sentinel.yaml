id: github-stale-unmerged-branch-governance-sentinel
namespace: company.devops

description: |
  Audits repository Git branches via GitHub API, identifies stale unmerged branches
  abandoned for over 90 days, creates an automated GitHub cleanup audit ticket,
  and notifies the engineering team on Slack.

inputs:
  - id: repository
    type: STRING
    displayName: Target GitHub Repository
    defaults: my-org/primary-backend

  - id: stale_days_threshold
    type: INT
    displayName: Stale Inactivity Threshold (Days)
    defaults: 90

  - id: target_issue_repository
    type: STRING
    displayName: Repository for Governance Tracking Issue
    defaults: my-org/primary-backend

triggers:
  - id: weekly_branch_hygiene_check
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 9 * * 1"
    disabled: true

tasks:
  - id: probe_stale_branches
    type: io.kestra.plugin.scripts.python.Script
    description: Queries GitHub REST API for repository branches and inspects commit dates
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install requests kestra
    script: |
      import os
      import requests
      from datetime import datetime, timezone, timedelta
      from kestra import Kestra

      repo = "{{ inputs.repository }}"
      token = os.environ.get("GITHUB_TOKEN")
      days_threshold = int("{{ inputs.stale_days_threshold }}")

      headers = {
          "Authorization": f"Bearer {token}",
          "Accept": "application/vnd.github+json",
          "X-GitHub-Api-Version": "2022-11-28"
      }

      now = datetime.now(timezone.utc)
      cutoff_date = now - timedelta(days=days_threshold)

      url = f"https://api.github.com/repos/{repo}/branches"
      try:
          resp = requests.get(url, headers=headers, params={"protected": "false", "per_page": 50}, timeout=30)
          branches = resp.json() if resp.status_code == 200 else []
      except Exception as err:
          print(f"Failed to fetch branches: {err}")
          branches = []

      stale_branches = []
      total_branches = len(branches)

      for b in branches:
          name = b.get("name")
          commit_url = b.get("commit", {}).get("url")
          if commit_url:
              try:
                  c_resp = requests.get(commit_url, headers=headers, timeout=15)
                  c_data = c_resp.json()
                  commit_date_str = c_data.get("commit", {}).get("committer", {}).get("date")
                  if commit_date_str:
                      c_date = datetime.fromisoformat(commit_date_str.replace("Z", "+00:00"))
                      if c_date < cutoff_date:
                          stale_branches.append({
                              "name": name,
                              "last_commit": commit_date_str,
                              "author": c_data.get("commit", {}).get("author", {}).get("name", "Unknown")
                          })
              except Exception:
                  pass

      stale_count = len(stale_branches)
      print(f"Total branches: {total_branches}, Stale branches (> {days_threshold}d): {stale_count}")

      Kestra.outputs({
          "total_branches": total_branches,
          "stale_count": stale_count,
          "has_stale": stale_count > 0,
          "stale_branches": stale_branches
      })

  - id: branch_on_stale_branches
    type: io.kestra.plugin.core.flow.If
    description: Branches based on whether stale unmerged branches were discovered
    condition: "{{ outputs.probe_stale_branches.vars.has_stale == true }}"
    then:
      - id: create_branch_hygiene_issue
        type: io.kestra.plugin.github.issues.Create
        description: Logs a prioritized GitHub issue documenting abandoned unmerged branches
        oauthToken: "{{ secret('GITHUB_TOKEN') }}"
        repository: "{{ inputs.target_issue_repository }}"
        title: "[Git Hygiene Alert] {{ outputs.probe_stale_branches.vars.stale_count }} Stale Unmerged Branches Discovered"
        body: |
          ## 🚨 GitHub Repository Branch Hygiene Audit

          Automated Git governance sentinel identified **{{ outputs.probe_stale_branches.vars.stale_count }}** unprotected branches with no commits in over {{ inputs.stale_days_threshold }} days in `{{ inputs.repository }}`:

          ### Stale Branches:
          {% for b in outputs.probe_stale_branches.vars.stale_branches %}
          - **Branch:** `{{ b.name }}` (Last Commit: `{{ b.last_commit }}`, Author: `{{ b.author }}`)
          {% endfor %}

          Please review and delete merged or abandoned branches to maintain repository cleanliness and reduce CI build clutter.
          *Generated automatically by Kestra Git Governance Sentinel.*

      - id: alert_devops_slack
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Alerts engineering team on Slack with stale branch count and issue hyperlink
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {{ {
            "text": "🧹 *GitHub Stale Branch Hygiene Alert*\n*Repository:* `" ~ inputs.repository ~ "`\n*Stale Branches (> " ~ inputs.stale_days_threshold ~ "d):* *" ~ outputs.probe_stale_branches.vars.stale_count ~ "*\n*Audit Ticket:* <" ~ (outputs.create_branch_hygiene_issue.issueUrl ?? "#") ~ "|View GitHub Issue>"
          } | toJson }}

    else:
      - id: log_branches_clean
        type: io.kestra.plugin.core.log.Log
        message: "Repository {{ inputs.repository }} branch hygiene is optimal. Zero stale branches discovered."

  - id: log_audit_complete
    type: io.kestra.plugin.core.log.Log
    description: Final status audit log recording branch hygiene outcome
    message: "Branch audit completed for {{ inputs.repository }}. Stale count: {{ outputs.probe_stale_branches.vars.stale_count }}."

errors:
  - id: alert_flow_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alerts Slack when GitHub API queries fail
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {{ {
        "text": "⚠️ *GitHub Branch Sentinel Failed* in execution `" ~ execution.id ~ "`. Unable to query `" ~ inputs.repository ~ "`."
      } | toJson }}

extend:
  title: "GitHub Stale Unmerged Branch Hygiene and Governance Sentinel"
  shortDescription: "Audit GitHub branches for inactivity over 90 days, identify abandoned unmerged branches, log GitHub issues, and alert Slack."
  metaTitle: "GitHub Stale Branch Governance Sentinel with Kestra"
  metaDescription: "Monitor GitHub repository branch sprawl and stale Git branches with Kestra. Query GitHub API, open cleanup issues, and alert teams on Slack."
  description: |
    Large engineering teams create hundreds of feature, bugfix, and experimental branches across primary repositories. Over time, abandoned branches that were never merged or deleted accumulate, creating clutter in developer Git clones, triggering unintended CI workflow runs, and complicating commit history searches. This blueprint queries the GitHub REST API weekly for unprotected branches, compares commit dates against a configurable inactivity threshold (e.g. 90 days), logs an automated GitHub cleanup audit ticket, and notifies engineering teams on Slack.

    ## How it works

    1. `weekly_branch_hygiene_check` (`io.kestra.plugin.core.trigger.Schedule`) initiates the audit every Monday at 09:00 UTC (shipped disabled for safe verification).
    2. `probe_stale_branches` (`io.kestra.plugin.scripts.python.Script`) interrogates the GitHub REST API (`GET /repos/{owner}/{repo}/branches`), checks commit timestamps on unprotected branches, and filters for branches inactive beyond `stale_days_threshold`.
    3. `branch_on_stale_branches` (`io.kestra.plugin.core.flow.If`) evaluates whether any stale branches were discovered (`has_stale == true`):
       - `then`: Automatically files a GitHub tracking issue via `create_branch_hygiene_issue` (`io.kestra.plugin.github.issues.Create`) and alerts the Slack channel via `alert_devops_slack` (`io.kestra.plugin.slack.notifications.SlackIncomingWebhook`).
       - `else`: Emits an informational log entry (`log_branches_clean`) confirming clean branch hygiene.
    4. `log_audit_complete` (`io.kestra.plugin.core.log.Log`) records the audit outcome.
    5. The `errors` block alerts Slack if GitHub API limits are reached or tokens expire.

    ## What you get

    - Automated, scheduled auditing of repository branch hygiene.
    - Zero manual terminal scripts required to locate abandoned feature branches.
    - Consolidated GitHub tracking issues listing branch names, last commit dates, and author names.
    - Real-time Slack notifications with direct ticket hyperlinks.

    ## Who it's for

    - Platform Engineers and DevOps leads maintaining corporate GitHub repositories.
    - Engineering Managers enforcing repository cleanliness and developer productivity.
    - Open source maintainers keeping active contributor repositories tidy.

    ## Why orchestrate this with Kestra

    Kestra coordinates external API polling, date arithmetic, conditional issue creation, and chat alerting inside a single declarative workflow. It manages personal access tokens securely, provides complete execution history, and eliminates the need for separate standalone monitoring daemons.

    ## Prerequisites

    - A GitHub repository with active development branches.
    - A GitHub Personal Access Token or GitHub App token with `repo` permissions.
    - A Slack incoming webhook URL for notifications.

    ### Secrets

    - `GITHUB_TOKEN`: GitHub token used to query repository branches and open tracking issues.
    - `SLACK_WEBHOOK`: Incoming Webhook URL for alerts.

    ## Inputs

    - `repository` (STRING, default `my-org/primary-backend`): Target GitHub repository (`owner/repo`) to audit.
    - `stale_days_threshold` (INT, default `90`): Number of inactive days before a branch is classified stale.
    - `target_issue_repository` (STRING, default `my-org/primary-backend`): Repository where the governance issue will be created.

    ## Outputs

    - `outputs.probe_stale_branches.vars.total_branches`: Total number of unprotected branches audited.
    - `outputs.probe_stale_branches.vars.stale_count`: Count of branches exceeding inactivity threshold.
    - `outputs.probe_stale_branches.vars.stale_branches`: List of stale branch objects (`name`, `last_commit`, `author`).

    ## Quick start

    1. Configure `GITHUB_TOKEN` and `SLACK_WEBHOOK` in your Kestra namespace.
    2. Import this flow and set `repository` to match an active development codebase.
    3. Run the flow manually to verify branch inspection and Slack notification delivery.
    4. Enable the `weekly_branch_hygiene_check` trigger for continuous Git hygiene monitoring.

    ## How to extend

    - Add an automated branch deletion step (`DELETE /repos/{owner}/{repo}/git/refs/heads/{branch}`) gated behind an interactive approval task.
    - Filter branches by author email or department to send direct Slack DMs to branch owners.
    - Loop over all repositories in an organization using `io.kestra.plugin.core.flow.ForEach`.

    ## Links

    - [GitHub Branches REST API Documentation](https://docs.github.com/en/rest/branches/branches)
    - [Kestra Python Script Plugin](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra GitHub Plugin](https://kestra.io/plugins/plugin-github)
    - [Kestra Slack Plugin](https://kestra.io/plugins/plugin-slack)

  tags:
    - Infrastructure
    - Core
  subTags:
    - CI/CD & Deployment
    - Monitoring & Alerting
  ee: false
  demo: false
