id: rxnorm-medication-list-normalizer
namespace: company.team

description: |
  Normalise a medication list (free-text drug names and/or existing RxNorm codes) to current RxNorm concepts with the
  NLM RxNav API: approximate matching for text, a status check for every code (Active, Remapped, Quantified, Obsolete,
  NotCurrent, UNKNOWN), the replacement concept for retired codes and the generic equivalent of branded drugs. Answers
  are cached so re-runs only call RxNav for new terms and for codes not re-checked in `recheck_days`.

inputs:
  - id: medications_csv
    type: STRING
    description: Inline CSV with a header row `med_id,medication,rxcui`. Fill `rxcui` to verify an existing code, or leave it empty to match the text. Ignored when `medications_file` is uploaded. The default rows are sample data.
    defaults: |
      med_id,medication,rxcui
      A01,Lipitor 10 mg tablet,
      A02,  lipitor 10 mg TABLET ,
      A03,metformin 500mg,
      A04,amoxicilin 500,
      A05,zocor 20,
      A06,Eliquis 5,
      A07,blood pressure pill,
      A08,qzxv 40 mg,
      A09,penicillin G 375 mg/ml injection,105078
      A10,methenamine / phenazopyridine tab,1000029
      A11,dexmethylphenidate 40 mg ER capsule,1006611
      A12,amlodipine 5 mg tablet,197361
      A13,legacy code from old formulary,99999999
      A14,typo in code column,19736I

  - id: medications_file
    type: FILE
    required: false
    description: Optional CSV upload with the same header, for real medication lists.

  - id: min_score
    type: FLOAT
    defaults: 9.0
    description: Approximate matches scoring below this are flagged `LOW_SCORE` for review instead of accepted.

  - id: recheck_days
    type: INT
    defaults: 30
    description: Re-check the status of a cached RXCUI after this many days (RxNorm publishes monthly). `0` re-checks every code.

  - id: cache_key
    type: STRING
    defaults: rxnorm_normalizer
    description: Prefix of the two KV keys holding the term cache and the concept cache.

tasks:
  - id: inline_list
    type: io.kestra.plugin.core.storage.Write
    content: "{{ inputs.medications_csv }}"
    extension: .csv

  - id: term_cache
    type: io.kestra.plugin.core.kv.Get
    key: "{{ inputs.cache_key }}_terms"
    errorOnMissing: false

  - id: concept_cache
    type: io.kestra.plugin.core.kv.Get
    key: "{{ inputs.cache_key }}_concepts"
    errorOnMissing: false

  - id: plan_terms
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: Reads the list, builds a term key (lower case, single spaces) for rows without a code and lists the terms not yet in the term cache.
    url: "jdbc:duckdb:"
    fetchType: FETCH_ONE
    inputFiles:
      meds.csv: "{{ inputs.medications_file ?? outputs.inline_list.uri }}"
      terms.json: "{{ outputs.term_cache.value ?? '[]' }}"
    sql: |
      CREATE TABLE meds AS
      SELECT lower(regexp_replace(trim(coalesce(medication, '')), '\s+', ' ', 'g')) AS term_key
      FROM read_csv('meds.csv', header = true, all_varchar = true)
      WHERE nullif(trim(rxcui), '') IS NULL AND trim(coalesce(medication, '')) <> '';
      CREATE TABLE cached AS
      SELECT json_extract_string(t, '$.term_key') AS term_key FROM (SELECT unnest(from_json(content, '["JSON"]')) AS t FROM read_text('terms.json'));
      CREATE TABLE pending AS SELECT DISTINCT term_key FROM meds WHERE term_key NOT IN (SELECT term_key FROM cached) ORDER BY term_key;
      SELECT (SELECT count(*) FROM pending) AS new_terms,
             (SELECT count(DISTINCT term_key) FROM meds) - (SELECT count(*) FROM pending) AS cached_terms,
             (SELECT CAST(coalesce(json_group_array(term_key), '[]') AS VARCHAR) FROM pending) AS terms;

  - id: match_terms
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.plan_terms.outputs[0].row.new_terms > 0 }}"
    then:
      - id: approximate
        type: io.kestra.plugin.core.flow.Loop
        description: One approximateTerm request per new term (`option=1`, current RxNorm concepts only), four at a time.
        values: "{{ outputs.plan_terms.outputs[0].row.terms }}"
        concurrencyLimit: 4
        tasks:
          - id: approx
            type: io.kestra.plugin.core.http.Download
            uri: https://rxnav.nlm.nih.gov/REST/approximateTerm.json
            params:
              term: "{{ item.value }}"
              maxEntries: "8"
              option: "1"
            options:
              retryOnStatusCodes: [429, 500, 502, 503, 504]
              retry:
                type: exponential
                interval: PT2S
                maxInterval: PT30S
                maxAttempts: 4
        outputs:
          - id: uri
            type: STRING
            value: "{{ outputs.approx.uri }}"
          - id: term
            type: STRING
            value: "{{ item.value }}"

      - id: term_files
        type: io.kestra.plugin.core.storage.Concat
        description: The responses do not echo the input term, so they are concatenated in the same order as the Loop outputs and matched by line number.
        files: "{{ outputs.approximate.outputs | jq('[.[].outputs.uri]') | first }}"
        separator: "\n"
        extension: .json

  - id: plan_concepts
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: |
      Keeps the rank-1 candidates of each new term, merges them into the term cache and lists every RXCUI to check:
      codes from the list, rank-1 candidates, skipping cached concepts checked less than `recheck_days` ago.
      Non-numeric codes are left out (RxNav answers 404) and reported as `INVALID_CODE`.
    url: "jdbc:duckdb:"
    fetchType: FETCH_ONE
    inputFiles:
      meds.csv: "{{ inputs.medications_file ?? outputs.inline_list.uri }}"
      terms.json: "{{ outputs.term_cache.value ?? '[]' }}"
      concepts.json: "{{ outputs.concept_cache.value ?? '[]' }}"
      approx.json: "{{ outputs.term_files.uri ?? '' }}"
    outputFiles:
      - terms_json
    parameters:
      order: "{{ (outputs.approximate.outputs ?? []) | jq('[.[].outputs.term]') | first | toJson }}"
      recheck_days: "{{ inputs.recheck_days }}"
      run_started: "{{ execution.startDate }}"
    sql: |
      SET TimeZone = 'UTC';
      CREATE TABLE lines AS
      SELECT i, from_json(:order, '["VARCHAR"]')[i] AS term_key, json(list_extract(l, i)) AS j
      FROM (SELECT string_split(content, chr(10)) AS l FROM read_text('approx.json')), range(1, len(l) + 1) r(i)
      WHERE trim(list_extract(l, i)) <> '';
      CREATE TABLE cands AS
      SELECT term_key, json_extract_string(c, '$.rxcui') AS rxcui, CAST(json_extract_string(c, '$.rank') AS INTEGER) AS rnk,
             CAST(json_extract_string(c, '$.score') AS DOUBLE) AS score
      FROM lines, unnest(from_json(coalesce(json_extract(j, '$.approximateGroup.candidate'), '[]'), '["JSON"]')) AS t(c);
      CREATE TABLE fresh_terms AS
      SELECT l.term_key, coalesce(list(DISTINCT c.rxcui) FILTER (WHERE c.rnk = 1), []) AS candidates, max(c.score) AS score,
             CAST(:run_started AS TIMESTAMP) AS matched_at
      FROM lines l LEFT JOIN cands c USING (term_key) GROUP BY l.term_key;
      CREATE TABLE terms AS
      SELECT json_extract_string(t, '$.term_key') AS term_key, from_json(json_extract(t, '$.candidates'), '["VARCHAR"]') AS candidates,
             CAST(json_extract_string(t, '$.score') AS DOUBLE) AS score, CAST(json_extract_string(t, '$.matched_at') AS TIMESTAMP) AS matched_at
      FROM (SELECT unnest(from_json(content, '["JSON"]')) AS t FROM read_text('terms.json'))
      WHERE json_extract_string(t, '$.term_key') NOT IN (SELECT term_key FROM fresh_terms)
      UNION ALL SELECT * FROM fresh_terms;
      COPY (SELECT * FROM terms) TO '{{ outputFiles.terms_json }}' (FORMAT JSON, ARRAY true);

      CREATE TABLE meds AS
      SELECT nullif(trim(rxcui), '') AS code, lower(regexp_replace(trim(coalesce(medication, '')), '\s+', ' ', 'g')) AS term_key
      FROM read_csv('meds.csv', header = true, all_varchar = true);
      CREATE TABLE needed AS
      SELECT DISTINCT code AS rxcui FROM meds WHERE regexp_full_match(coalesce(code, ''), '[0-9]+')
      UNION SELECT DISTINCT unnest(t.candidates) FROM terms t JOIN meds m ON m.term_key = t.term_key AND m.code IS NULL;
      CREATE TABLE fresh_enough AS
      SELECT json_extract_string(c, '$.rxcui') AS rxcui
      FROM (SELECT unnest(from_json(content, '["JSON"]')) AS c FROM read_text('concepts.json'))
      WHERE CAST(json_extract_string(c, '$.checked_at') AS TIMESTAMP) > CAST(:run_started AS TIMESTAMP) - to_days(CAST(:recheck_days AS INTEGER));
      CREATE TABLE to_check AS SELECT rxcui FROM needed WHERE rxcui NOT IN (SELECT rxcui FROM fresh_enough) ORDER BY CAST(rxcui AS BIGINT);
      SELECT (SELECT count(*) FROM fresh_terms) AS matched_terms,
             (SELECT count(*) FROM fresh_terms WHERE len(candidates) = 0) AS terms_without_candidates,
             (SELECT count(*) FROM needed) AS concepts_needed,
             (SELECT count(*) FROM to_check) AS concepts_to_check,
             (SELECT CAST(coalesce(json_group_array(rxcui), '[]') AS VARCHAR) FROM to_check) AS rxcuis;

  - id: check_concepts
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.plan_concepts.outputs[0].row.concepts_to_check > 0 }}"
    then:
      - id: history
        type: io.kestra.plugin.core.flow.Loop
        description: One historystatus request per RXCUI. The reply carries status, TTY, ingredients and strength, dose form, the generic SCD of a branded drug and the remapped or quantified successor.
        values: "{{ outputs.plan_concepts.outputs[0].row.rxcuis }}"
        concurrencyLimit: 4
        tasks:
          - id: status
            type: io.kestra.plugin.core.http.Download
            uri: "https://rxnav.nlm.nih.gov/REST/rxcui/{{ item.value }}/historystatus.json"
            options:
              retryOnStatusCodes: [429, 500, 502, 503, 504]
              retry:
                type: exponential
                interval: PT2S
                maxInterval: PT30S
                maxAttempts: 4
        outputs:
          - id: uri
            type: STRING
            value: "{{ outputs.status.uri }}"

      - id: concept_files
        type: io.kestra.plugin.core.storage.Concat
        files: "{{ outputs.history.outputs | jq('[.[].outputs.uri]') | first }}"
        separator: "\n"
        extension: .json

  - id: normalize
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: |
      Parses the status replies, merges them into the concept cache (keeping the previous status to detect changes),
      picks one concept per term (Active first, then SBD, SCD, packs, then less specific types; ties with different
      ingredients are `AMBIGUOUS`) and writes one output row per input row with an `action` column.
    url: "jdbc:duckdb:"
    fetchType: FETCH_ONE
    inputFiles:
      meds.csv: "{{ inputs.medications_file ?? outputs.inline_list.uri }}"
      terms.json: "{{ outputs.plan_concepts.outputFiles.terms_json }}"
      concepts.json: "{{ outputs.concept_cache.value ?? '[]' }}"
      status.json: "{{ outputs.concept_files.uri ?? '' }}"
    outputFiles:
      - normalized_csv
      - concepts_json
    parameters:
      min_score: "{{ inputs.min_score }}"
      run_started: "{{ execution.startDate }}"
    sql: |
      SET TimeZone = 'UTC';
      CREATE TABLE replies AS
      SELECT json_extract(json(line), '$.rxcuiStatusHistory') AS h
      FROM (SELECT unnest(string_split(content, chr(10))) AS line FROM read_text('status.json')) WHERE trim(line) <> '';
      CREATE TABLE fresh AS
      SELECT json_extract_string(h, '$.attributes.rxcui') AS rxcui, json_extract_string(h, '$.metaData.status') AS status,
             nullif(json_extract_string(h, '$.attributes.name'), '') AS name, nullif(json_extract_string(h, '$.attributes.tty'), '') AS tty,
             nullif(json_extract_string(h, '$.metaData.activeEndDate'), '') AS active_end,
             array_to_string(list_sort(list_distinct(CAST(json_extract_string(h, '$.derivedConcepts.ingredientConcept[*].ingredientName') AS VARCHAR[]))), ' / ') AS ingredients,
             array_to_string(list_transform(CAST(json_extract(h, '$.definitionalFeatures.ingredientAndStrength') AS JSON[]),
               s -> coalesce(json_extract_string(s, '$.bossName') || ' ', '') || json_extract_string(s, '$.numeratorValue') || ' ' || json_extract_string(s, '$.numeratorUnit')
                    || CASE WHEN json_extract_string(s, '$.denominatorUnit') NOT IN ('EACH', '') THEN '/' || json_extract_string(s, '$.denominatorUnit') ELSE '' END), ' / ') AS strength,
             json_extract_string(h, '$.definitionalFeatures.doseFormConcept[0].doseFormName') AS dose_form,
             json_extract_string(h, '$.derivedConcepts.scdConcept.scdConceptRxcui') AS generic_rxcui,
             json_extract_string(h, '$.derivedConcepts.scdConcept.scdConceptName') AS generic_name,
             coalesce(json_extract_string(h, '$.derivedConcepts.remappedConcept[0].remappedRxCui'), json_extract_string(h, '$.derivedConcepts.quantifiedConcept[0].quantifiedRxcui')) AS replacement_rxcui,
             coalesce(json_extract_string(h, '$.derivedConcepts.remappedConcept[0].remappedName'), json_extract_string(h, '$.derivedConcepts.quantifiedConcept[0].quantifiedName')) AS replacement_name,
             coalesce(json_extract_string(h, '$.derivedConcepts.remappedConcept[0].remappedActive'), json_extract_string(h, '$.derivedConcepts.quantifiedConcept[0].quantifiedActive')) = 'YES' AS replacement_active,
             CAST(:run_started AS TIMESTAMP) AS checked_at
      FROM replies;
      CREATE TABLE prev AS
      SELECT json_extract_string(c, '$.rxcui') AS rxcui, json_extract_string(c, '$.status') AS status, c
      FROM (SELECT unnest(from_json(content, '["JSON"]')) AS c FROM read_text('concepts.json'));
      CREATE TABLE concepts AS
      SELECT f.*, p.status AS prev_status, p.rxcui IS NULL AS first_seen, coalesce(p.status <> f.status, false) AS status_changed
      FROM fresh f LEFT JOIN prev p USING (rxcui)
      UNION ALL BY NAME
      SELECT rxcui, status, json_extract_string(c, '$.name') AS name, json_extract_string(c, '$.tty') AS tty,
             json_extract_string(c, '$.active_end') AS active_end, json_extract_string(c, '$.ingredients') AS ingredients,
             json_extract_string(c, '$.strength') AS strength, json_extract_string(c, '$.dose_form') AS dose_form,
             json_extract_string(c, '$.generic_rxcui') AS generic_rxcui, json_extract_string(c, '$.generic_name') AS generic_name,
             json_extract_string(c, '$.replacement_rxcui') AS replacement_rxcui, json_extract_string(c, '$.replacement_name') AS replacement_name,
             CAST(json_extract(c, '$.replacement_active') AS BOOLEAN) AS replacement_active,
             CAST(json_extract_string(c, '$.checked_at') AS TIMESTAMP) AS checked_at,
             json_extract_string(c, '$.prev_status') AS prev_status, false AS first_seen, false AS status_changed
      FROM prev WHERE rxcui NOT IN (SELECT rxcui FROM fresh);
      COPY (SELECT * EXCLUDE (first_seen, status_changed) FROM concepts) TO '{{ outputFiles.concepts_json }}' (FORMAT JSON, ARRAY true);

      CREATE TABLE terms AS
      SELECT json_extract_string(t, '$.term_key') AS term_key, from_json(json_extract(t, '$.candidates'), '["VARCHAR"]') AS candidates,
             CAST(json_extract_string(t, '$.score') AS DOUBLE) AS score,
             CAST(json_extract_string(t, '$.matched_at') AS TIMESTAMP) = CAST(:run_started AS TIMESTAMP) AS matched_now
      FROM (SELECT unnest(from_json(content, '["JSON"]')) AS t FROM read_text('terms.json'));
      CREATE TABLE picks AS
      SELECT t.term_key, t.score, count(DISTINCT coalesce(nullif(c.ingredients, ''), c.rxcui)) OVER (PARTITION BY t.term_key) > 1 AS ambiguous,
             count(*) OVER (PARTITION BY t.term_key) AS tied, c.rxcui,
             row_number() OVER (PARTITION BY t.term_key ORDER BY c.status = 'Active' DESC,
               coalesce(list_position(['SBD', 'SCD', 'BPCK', 'GPCK', 'SBDF', 'SCDF', 'SBDC', 'SCDC', 'SBDG', 'SCDG', 'BN', 'MIN', 'PIN', 'IN'], c.tty), 99),
               CAST(c.rxcui AS BIGINT)) AS pos
      FROM (SELECT term_key, score, unnest(candidates) AS rxcui FROM terms) t JOIN concepts c ON c.rxcui = t.rxcui;

      CREATE TABLE meds AS
      SELECT row_number() OVER () AS line, med_id, medication, nullif(trim(rxcui), '') AS code,
             lower(regexp_replace(trim(coalesce(medication, '')), '\s+', ' ', 'g')) AS term_key
      FROM read_csv('meds.csv', header = true, all_varchar = true);
      CREATE TABLE result AS
      SELECT m.line, m.med_id, m.medication, m.code AS input_rxcui,
             CASE WHEN m.code IS NULL THEN 'text' ELSE 'code' END AS matched_by, p.score AS match_score, p.tied AS tied_candidates,
             c.rxcui, c.name, c.tty, c.status, c.ingredients, c.strength, c.dose_form, c.generic_rxcui, c.generic_name,
             c.replacement_rxcui, c.replacement_name, c.replacement_active, c.active_end, c.prev_status, c.checked_at,
             CASE WHEN m.code IS NOT NULL AND NOT regexp_full_match(m.code, '[0-9]+') THEN 'INVALID_CODE'
                  WHEN m.code IS NULL AND m.term_key = '' THEN 'EMPTY_ROW'
                  WHEN c.rxcui IS NULL OR c.status = 'UNKNOWN' THEN CASE WHEN m.code IS NULL THEN 'NO_MATCH' ELSE 'UNKNOWN_CODE' END
                  WHEN c.status IN ('Remapped', 'Quantified') THEN 'REPLACE_CODE'
                  WHEN c.status <> 'Active' THEN 'RETIRED'
                  WHEN m.code IS NULL AND p.ambiguous THEN 'AMBIGUOUS'
                  WHEN m.code IS NULL AND p.score < CAST(:min_score AS DOUBLE) THEN 'LOW_SCORE'
                  WHEN c.tty NOT IN ('SCD', 'SBD', 'GPCK', 'BPCK') THEN 'GENERAL_CONCEPT'
                  ELSE 'OK' END AS action,
             coalesce(c.first_seen OR c.status_changed, false)
               OR (m.code IS NULL AND m.term_key IN (SELECT term_key FROM terms WHERE matched_now)) AS new_this_run,
             coalesce(c.status_changed, false) AS status_changed
      FROM meds m
      LEFT JOIN picks p ON m.code IS NULL AND p.term_key = m.term_key AND p.pos = 1
      LEFT JOIN concepts c ON c.rxcui = coalesce(CASE WHEN regexp_full_match(coalesce(m.code, ''), '[0-9]+') THEN m.code END, p.rxcui);
      COPY (SELECT * EXCLUDE (line) FROM result ORDER BY line) TO '{{ outputFiles.normalized_csv }}' (HEADER, DELIMITER ',');

      CREATE TABLE alerts AS
      SELECT *, row_number() OVER (ORDER BY line) AS rn,
             '- `' || coalesce(med_id, '?') || '` ' || coalesce(medication, '') || ' -> *' || action || '*'
               || coalesce(' ' || rxcui || ' ' || coalesce(name, '') || ' (' || status || coalesce(', was ' || prev_status, '') || ')', '')
               || coalesce(' => ' || replacement_rxcui || ' ' || replacement_name || CASE WHEN NOT replacement_active THEN ' (also inactive)' ELSE '' END, '') AS msg
      FROM result WHERE action NOT IN ('OK', 'EMPTY_ROW') AND new_this_run;
      SELECT count(*) AS rows,
             count(*) FILTER (WHERE action = 'OK') AS ok,
             count(*) FILTER (WHERE action = 'REPLACE_CODE') AS replace_code,
             count(*) FILTER (WHERE action = 'RETIRED') AS retired,
             count(*) FILTER (WHERE action IN ('NO_MATCH', 'UNKNOWN_CODE', 'INVALID_CODE')) AS unresolved,
             count(*) FILTER (WHERE action IN ('AMBIGUOUS', 'LOW_SCORE', 'GENERAL_CONCEPT')) AS review,
             count(*) FILTER (WHERE status_changed) AS status_changed,
             count(*) FILTER (WHERE generic_rxcui IS NOT NULL) AS with_generic,
             (SELECT count(*) FROM alerts) AS new_alerts,
             (SELECT count(*) FROM concepts) AS cached_concepts,
             (SELECT string_agg(action || '=' || n, ', ' ORDER BY action) FROM (SELECT action, count(*) AS n FROM result GROUP BY action)) AS by_action,
             (SELECT CAST(json_object('text', '*RxNorm medication list check* - ' || count(*) || ' new row(s) need attention' || chr(10)
                 || string_agg(msg, chr(10) ORDER BY rn) FILTER (WHERE rn <= 25)
                 || CASE WHEN count(*) > 25 THEN chr(10) || '...and ' || (count(*) - 25) || ' more in the normalized CSV.' ELSE '' END) AS VARCHAR)
                FROM alerts) AS slack_payload
      FROM result;

  - id: save_terms
    type: io.kestra.plugin.core.kv.Set
    key: "{{ inputs.cache_key }}_terms"
    value: "{{ outputs.plan_concepts.outputFiles.terms_json }}"

  - id: save_concepts
    type: io.kestra.plugin.core.kv.Set
    key: "{{ inputs.cache_key }}_concepts"
    value: "{{ outputs.normalize.outputFiles.concepts_json }}"

  - id: notify
    type: io.kestra.plugin.core.flow.If
    description: Posts only rows that need action and are new this run (new term, first-seen code or changed status).
    condition: "{{ outputs.normalize.outputs[0].row.new_alerts > 0 }}"
    then:
      - id: slack
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        allowFailure: true
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: "{{ outputs.normalize.outputs[0].row.slack_payload }}"

  - id: summary
    type: io.kestra.plugin.core.log.Log
    message: |
      RxNav calls - {{ outputs.plan_terms.outputs[0].row.new_terms }} approximateTerm ({{ outputs.plan_terms.outputs[0].row.cached_terms }} terms from cache), {{ outputs.plan_concepts.outputs[0].row.concepts_to_check }} historystatus ({{ outputs.plan_concepts.outputs[0].row.concepts_needed }} concepts needed).
      {{ outputs.normalize.outputs[0].row.rows }} rows - {{ outputs.normalize.outputs[0].row.by_action }}. {{ outputs.normalize.outputs[0].row.status_changed }} status change(s), {{ outputs.normalize.outputs[0].row.with_generic }} branded row(s) with a generic SCD, {{ outputs.normalize.outputs[0].row.new_alerts }} new row(s) needing action.

outputs:
  - id: normalized_csv
    type: FILE
    value: "{{ outputs.normalize.outputFiles.normalized_csv }}"
  - id: summary
    type: JSON
    value: "{{ outputs.normalize.outputs[0].row | toJson | jq('del(.slack_payload)') | first }}"

triggers:
  - id: monthly
    type: io.kestra.plugin.core.trigger.Schedule
    description: RxNorm full monthly releases come out on the first Monday of the month; this runs on the 10th.
    cron: "0 7 10 * *"

extend:
  title: Normalize a Medication List to RxNorm and Flag Retired Codes with NLM RxNav
  metaTitle: RxNorm Medication List Normalizer with RxNav and DuckDB | Kestra
  shortDescription: Match free-text drug names to RxNorm concepts, check every RXCUI for Remapped, Quantified or Obsolete status with the free NLM RxNav API, and alert only on rows that are new or changed since the last run.
  metaDescription: Normalize drug names and RxNorm codes with the free NLM RxNav API, flag remapped and obsolete RXCUIs, cache answers in KV and alert Slack on changes.
  description: |
    EHR exports, formularies and claims feeds mix free-text names ("Lipitor 10 mg tablet", "amoxicilin 500") with RxNorm codes that have since been retired. This flow normalises such a list with the free NLM RxNav API and caches every answer in KV, so re-runs only call RxNav for new terms and codes due for a re-check, and Slack only hears about new or changed rows. The default rows are sample data; every match and status comes from the live API.

    ## How it works

    1. Rows come from `medications_csv` (header `med_id,medication,rxcui`) or an uploaded `medications_file`. A row with `rxcui` is verified as a code, a row without it is matched by text.
    2. `plan_terms` (DuckDB) normalises the text (case, spaces) and lists terms missing from the term cache. `match_terms` (If + Loop) calls `approximateTerm.json` with `option=1`, four at a time; replies do not echo the term, so they are matched back by Loop order.
    3. `plan_concepts` keeps the rank-1 candidates, updates the term cache and lists the RXCUIs to check (list codes plus candidates, minus concepts checked within `recheck_days`). Non-numeric codes are never sent.
    4. `check_concepts` (If + Loop) calls `rxcui/{rxcui}/historystatus.json` for status, TTY, ingredients, strength, generic SCD and the remapped or quantified successor.
    5. `normalize` merges the replies into the concept cache with the previous status, picks one concept per term (Active, then SBD, SCD, packs, then broader types) and sets an `action`: `OK`, `REPLACE_CODE`, `RETIRED`, `AMBIGUOUS` (tied candidates with different ingredients), `LOW_SCORE`, `GENERAL_CONCEPT` (ingredient or brand only), `NO_MATCH`, `UNKNOWN_CODE`, `INVALID_CODE` or `EMPTY_ROW`.
    6. The caches are saved, `notify` posts new rows needing action to Slack and `summary` logs the counts.

    ## What you get

    - A normalized CSV in input order with RXCUI, name, TTY, status, ingredients, strength, generic SCD, successor and whether that successor is still active.
    - Change detection through `prev_status`, for example a code Active last month and Obsolete now.
    - No API key and no database.

    ## Who it's for

    - Health data engineers, pharmacy informatics and formulary teams.

    ## Why orchestrate this with Kestra

    - Loop with `concurrencyLimit` and HTTP retries keeps the load polite without a script; DuckDB parses the JSON and joins it back declaratively.
    - KV caches make the monthly run cheap and `If` skips RxNav when nothing is due.

    ## Prerequisites

    - Kestra 2.0 with the DuckDB and Slack plugins and outbound HTTPS to `rxnav.nlm.nih.gov` (keyless, at most 20 requests per second per IP).
    - Approximate matching is a search, not a verdict: review `LOW_SCORE`, `AMBIGUOUS` and `GENERAL_CONCEPT` rows before clinical use.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack incoming webhook for the alert (optional, the step is `allowFailure`).

    ## Quick start

    1. Optionally add `SLACK_WEBHOOK_URL`, then execute with the defaults: 7 text lookups and 14 status checks, covering retired, remapped, unknown and malformed codes.
    2. Execute again: no RxNav call and no alert.
    3. Upload your own list as `medications_file` under its own `cache_key` and keep the monthly schedule.

    ## How to extend

    - Follow a successor that is itself inactive with another historystatus call.
    - Add drug classes from RxClass or NDCs from `rxcui/{rxcui}/ndcs.json`, or load the CSV into a warehouse.

