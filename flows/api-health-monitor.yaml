id: api-health-monitor
namespace: company.team

inputs:
  - id: site_1
    type: URI
    defaults: https://kestra.io
    description: First endpoint to probe.

  - id: site_2
    type: URI
    defaults: https://api.github.com
    description: Second endpoint to probe.

  - id: site_3
    type: URI
    defaults: https://httpbin.org/status/200
    description: Third endpoint to probe.

tasks:
  - id: check_all_sites
    type: io.kestra.plugin.core.flow.Parallel
    description: Probe every endpoint at once so a slow site does not delay the others.
    tasks:
      - id: check_site_1
        type: io.kestra.plugin.core.http.Request
        uri: "{{ inputs.site_1 }}"
        method: GET
        timeout: PT30S
        options:
          allowFailed: true

      - id: check_site_2
        type: io.kestra.plugin.core.http.Request
        uri: "{{ inputs.site_2 }}"
        method: GET
        timeout: PT30S
        options:
          allowFailed: true

      - id: check_site_3
        type: io.kestra.plugin.core.http.Request
        uri: "{{ inputs.site_3 }}"
        method: GET
        timeout: PT30S
        options:
          allowFailed: true

  - id: evaluate_results
    type: io.kestra.plugin.core.flow.If
    description: Any status other than 200 counts as unhealthy. allowFailed on the probes is what makes the code readable here instead of failing the task.
    condition: "{{ outputs.check_site_1.code != 200 or outputs.check_site_2.code != 200 or outputs.check_site_3.code != 200 }}"
    then:
      - id: send_slack_alert
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "text": ":red_circle: Health check failed. {{ inputs.site_1 }} returned {{ outputs.check_site_1.code }}, {{ inputs.site_2 }} returned {{ outputs.check_site_2.code }}, {{ inputs.site_3 }} returned {{ outputs.check_site_3.code }}. Execution {{ execution.id }}."
          }
    else:
      - id: all_healthy
        type: io.kestra.plugin.core.log.Log
        message: "All three endpoints returned HTTP 200."

triggers:
  - id: every_30_minutes
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/30 * * * *"

errors:
  - id: alert_on_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Fires when a probe itself could not run, for example a DNS failure or a timeout, as opposed to a site answering with a bad status.
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "text": ":warning: Health check flow failed before it could evaluate all sites. One probe timed out or could not connect. Execution {{ execution.id }}."
      }

extend:
  shortDescription: Probe three endpoints in parallel every 30 minutes and post one Slack alert naming each site that did not answer HTTP 200.
  title: Monitor API Uptime in Parallel and Alert Slack with the Exact Status of Each Endpoint
  metaTitle: API Health Monitor with Slack Alerts in Kestra
  metaDescription: Check several endpoints in parallel on a schedule with Kestra, treat any non-200 as unhealthy, and alert Slack with the status code of every site.
  description: |
    The simplest monitor most teams never get around to building: hit a handful of endpoints on a schedule and shout if any of them answer with something other than HTTP 200. This blueprint probes three sites in parallel every thirty minutes and sends one Slack message that names every endpoint together with the status it actually returned, so the person reading the alert knows which site to look at before they open anything.

    The one detail that makes it work is `options.allowFailed: true` on each probe. Without it the HTTP task fails outright on any non-2xx response, the flow jumps straight to the `errors` block, and you lose the status code you wanted to report. With it, a 503 is a result to evaluate rather than a crash.

    ## How it works
    1. The `every_30_minutes` trigger (`io.kestra.plugin.core.trigger.Schedule`) starts a run on the half hour.
    2. The `check_all_sites` task (`io.kestra.plugin.core.flow.Parallel`) fires three `io.kestra.plugin.core.http.Request` probes at once, each with a thirty second `timeout` and `options.allowFailed: true`, so one slow endpoint neither delays nor masks the others.
    3. The `evaluate_results` task (`io.kestra.plugin.core.flow.If`) reads `outputs.<probe>.code` for each site and treats anything other than 200 as unhealthy.
    4. The `then` branch posts a Slack message listing every site and its status code. The `else` branch logs a one line all clear so the execution history reads cleanly.
    5. The `errors` block sends a different message for the case where a probe could not run at all, such as a DNS failure or a hard timeout, which is a different kind of problem from a site returning a bad status.

    ## What you get
    - One alert per failed run that names each endpoint and the status it returned, instead of a generic "something is down".
    - Parallel probing, so the schedule interval is bounded by your slowest site rather than the sum of all of them.
    - A clear split between "a site answered badly" and "we could not reach a site", routed to two different messages.
    - A run history with the status code of every probe on every run, which is a free uptime log.

    ## Who it's for
    - Teams that want basic uptime visibility without buying a monitoring product for three URLs.
    - Developers who own a few public endpoints and want to know before their users do.
    - Anyone who already runs Kestra and would rather add a flow than another service.

    ## Why orchestrate this with Kestra
    A cron script that curls three URLs and pipes to a webhook is thirty lines, and it loses the thing that matters: history. Kestra keeps every probe's status code on every run, shows the three checks side by side in the Gantt view, retries the Slack send if the webhook hiccups, and gives you a second alert path for the case where the probe itself breaks. When a site has been flapping for a week, the execution list already contains the evidence.

    ## Prerequisites
    - A Slack incoming webhook for the alert channel.
    - Outbound HTTPS access from the Kestra worker to the sites you want to probe.

    ### Secrets
    - `SLACK_WEBHOOK`: incoming webhook URL used for both the unhealthy alert and the probe failure alert.

    ## Quick start
    1. Add the `SLACK_WEBHOOK` secret to your Kestra namespace.
    2. Replace the three `site_*` input defaults with your own endpoints, or leave them to see the flow run against public sites first.
    3. Execute once manually and check the `evaluate_results` output to confirm you see a status code per site.
    4. Enable the trigger. Adjust the cron if thirty minutes is too coarse or too chatty for you.

    ## How to extend
    - Monitor more endpoints by adding further `check_site_*` tasks under the `Parallel` block, or switch to `io.kestra.plugin.core.flow.Loop` over an `ARRAY` input when the list grows.
    - Add a latency budget by comparing each probe's duration in the condition, so a site that answers 200 in nine seconds still counts as unhealthy.
    - Replace the Slack message with `io.kestra.plugin.pagerduty.alerts.Create` for endpoints that should page someone.
    - Require two consecutive failures before alerting by reading the previous execution's state with the Kestra KV store, which filters out single blips.
    - Post the status codes to a dashboard or a metrics endpoint with another `http.Request` to chart uptime over time.

    ## Links
    - HTTP Request task: https://kestra.io/plugins/core/http/io.kestra.plugin.core.http.request
    - Slack plugin: https://kestra.io/plugins/plugin-slack
    - Parallel task: https://kestra.io/docs/workflow-components/tasks/flowable-tasks
  tags:
    - Infrastructure
    - Core
  subTags:
    - Monitoring & Alerting
    - Scheduling
  ee: false
  demo: false
