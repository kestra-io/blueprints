id: api-health-monitor
namespace: company.team
description: Checks a list of websites every 30 minutes and sends a Slack alert when any of them stops responding with HTTP 200

triggers:
  -  id: routine
     type: io.kestra.plugin.core.trigger.Schedule
     cron: "*/30 * * * *"

tasks:
  - id: check_all_apis
    type: io.kestra.plugin.core.flow.Parallel
    tasks:
      - id: check_greet_site
        type: io.kestra.plugin.core.http.Request
        uri: https://greetteachertrainingcollege.in/
        method: GET
        timeout: PT30S

      - id: check_portfolio
        type: io.kestra.plugin.core.http.Request
        uri: https://faizanxbuilds.github.io/
        method: GET
        timeout: PT30S

      - id: check_pulsedeck
        type: io.kestra.plugin.core.http.Request
        uri: https://faizanxbuilds-status.vercel.app/
        method: GET
        timeout: PT30S

  - id: evaluate_results
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.check_greet_site.code != 200 or outputs.check_portfolio.code != 200 or outputs.check_pulsedeck.code != 200 }}"
    then:
      - id: send_slack_alert
        type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {"text": "API health check failed: one or more sites did not return HTTP 200."}

errors:
  - id: alert_on_failure
    type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {"text": "API health check failed: one or more sites did not return HTTP 200."}

extend:
  title: API health monitor with Slack alerts
  metaDescription: A routine schedule that checks API health every 30 mins.
  tags: [monitoring, slack, http]
  description: |
    API Health Monitor runs on a schedule and checks the health of your sites every 30 minutes. If any site responds with anything other than HTTP 200, it sends an alert to Slack.

    Prerequisites:
      - A Slack incoming webhook URL, stored in Kestra as the SLACK_WEBHOOK secret.

    How it works:
      1. The routine schedule triggers every 30 minutes.
      2. All listed sites are checked in parallel.
      3. If any site does not respond with HTTP 200, it is treated as down or unhealthy.
      4. A Slack alert is sent automatically.


