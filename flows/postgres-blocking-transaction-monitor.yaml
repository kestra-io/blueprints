id: postgres-blocking-transaction-monitor
namespace: company.team
description: |
  Inspect PostgreSQL active locks and session states via pg_locks and pg_stat_activity,
  detect root blocking transactions and cascading lock wait trees, export diagnostic
  metrics into execution outputs, and alert DBAs on Slack before connection pools exhaust.

triggers:
  - id: scheduled_monitor
    type: io.kestra.plugin.core.trigger.Schedule
    description: Periodic lock contention check. Shipped disabled by default.
    cron: "*/10 * * * *"
    disabled: true

  - id: manual_webhook
    type: io.kestra.plugin.core.trigger.Webhook
    description: Authenticated webhook trigger for on-demand invocation from incident triage tools or ChatOps.
    key: "{{ secret('WEBHOOK_KEY') }}"

inputs:
  - id: postgres_host
    type: STRING
    displayName: PostgreSQL Host
    description: Hostname or network address of the PostgreSQL database instance.
    defaults: postgres

  - id: postgres_port
    type: INT
    displayName: PostgreSQL Port
    description: Port number for the PostgreSQL connection.
    defaults: 5432

  - id: database_name
    type: STRING
    displayName: Database Name
    description: Name of the PostgreSQL database to inspect.
    defaults: postgres

  - id: min_wait_seconds
    type: INT
    displayName: Minimum Lock Wait (Seconds)
    description: Minimum wait duration in seconds before a blocked transaction triggers an operational alert.
    defaults: 30

tasks:
  - id: query_blocking_locks
    type: io.kestra.plugin.jdbc.postgresql.Query
    description: Inspect pg_locks and pg_stat_activity to detect granted locks that are blocking other sessions.
    url: "jdbc:postgresql://{{ inputs.postgres_host }}:{{ inputs.postgres_port }}/{{ inputs.database_name }}"
    username: "{{ secret('POSTGRES_USER') }}"
    password: "{{ secret('POSTGRES_PASSWORD') }}"
    fetchType: FETCH
    sql: |
      SELECT
        blocked_locks.pid AS blocked_pid,
        blocked_activity.usename AS blocked_user,
        blocking_locks.pid AS blocker_pid,
        blocking_activity.usename AS blocker_user,
        blocking_activity.client_addr::text AS blocker_client_ip,
        COALESCE(blocking_activity.application_name, 'unknown') AS blocker_app,
        blocking_activity.state AS blocker_state,
        ROUND(EXTRACT(EPOCH FROM (CLOCK_TIMESTAMP() - blocked_activity.query_start))::numeric, 1) AS wait_duration_seconds,
        SUBSTRING(REGEXP_REPLACE(blocking_activity.query, '\s+', ' ', 'g') FROM 1 FOR 150) AS blocker_query,
        SUBSTRING(REGEXP_REPLACE(blocked_activity.query, '\s+', ' ', 'g') FROM 1 FOR 150) AS blocked_query
      FROM pg_catalog.pg_locks blocked_locks
      JOIN pg_catalog.pg_stat_activity blocked_activity ON blocked_activity.pid = blocked_locks.pid
      JOIN pg_catalog.pg_locks blocking_locks
        ON blocking_locks.locktype = blocked_locks.locktype
        AND blocking_locks.database IS NOT DISTINCT FROM blocked_locks.database
        AND blocking_locks.relation IS NOT DISTINCT FROM blocked_locks.relation
        AND blocking_locks.page IS NOT DISTINCT FROM blocked_locks.page
        AND blocking_locks.tuple IS NOT DISTINCT FROM blocked_locks.tuple
        AND blocking_locks.virtualxid IS NOT DISTINCT FROM blocked_locks.virtualxid
        AND blocking_locks.transactionid IS NOT DISTINCT FROM blocked_locks.transactionid
        AND blocking_locks.classid IS NOT DISTINCT FROM blocked_locks.classid
        AND blocking_locks.objid IS NOT DISTINCT FROM blocked_locks.objid
        AND blocking_locks.objsubid IS NOT DISTINCT FROM blocked_locks.objsubid
        AND blocking_locks.pid != blocked_locks.pid
      JOIN pg_catalog.pg_stat_activity blocking_activity ON blocking_activity.pid = blocking_locks.pid
      WHERE NOT blocked_locks.granted
        AND blocking_locks.granted
        AND EXTRACT(EPOCH FROM (CLOCK_TIMESTAMP() - blocked_activity.query_start)) >= {{ inputs.min_wait_seconds }}
      ORDER BY wait_duration_seconds DESC;

  - id: emit_lock_metrics
    type: io.kestra.plugin.core.output.OutputValues
    description: Export lock contention metrics into execution outputs for auditability.
    values:
      blocked_transactions_count: "{{ outputs.query_blocking_locks.size }}"
      database_scanned: "{{ inputs.database_name }}"
      host_scanned: "{{ inputs.postgres_host }}"
      audited_at: "{{ now() }}"

  - id: evaluate_lock_contention
    type: io.kestra.plugin.core.flow.If
    description: Branch based on whether any blocked sessions were detected.
    condition: "{{ outputs.query_blocking_locks.size > 0 }}"
    then:
      - id: notify_dba_slack
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Alerts DBA and engineering team on Slack with blocker details and termination commands.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        messageText: |
          :rotating_light: *PostgreSQL Lock Contention Alert* — `{{ inputs.database_name }}` on `{{ inputs.postgres_host }}`
          *Execution:* `{{ execution.id }}`
          *Blocked Sessions:* `{{ outputs.query_blocking_locks.size }}` query(ies) blocked for more than {{ inputs.min_wait_seconds }}s.

          *Active Lock Blockers:*
          {% for row in outputs.query_blocking_locks.rows %}- *Blocker PID `{{ row.blocker_pid }}`* (User: `{{ row.blocker_user }}`, App: `{{ row.blocker_app }}`, State: `{{ row.blocker_state }}`)
            • Blocking PID `{{ row.blocked_pid }}` (waiting {{ row.wait_duration_seconds }}s)
            • Blocker Query: `{{ row.blocker_query }}`
            • Remediation: `SELECT pg_cancel_backend({{ row.blocker_pid }});` or `SELECT pg_terminate_backend({{ row.blocker_pid }});`
          {% endfor %}
    else:
      - id: log_healthy_locks
        type: io.kestra.plugin.core.log.Log
        description: Record healthy status when no blocked transactions are detected.
        message: "PostgreSQL lock verification passed: 0 blocked transactions detected on '{{ inputs.database_name }}'."

errors:
  - id: alert_on_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alerts on-call engineers if the database query or monitor execution fails.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    messageText: |
      :warning: *PostgreSQL Lock Monitor FAILED*
      *Workflow:* `{{ flow.id }}` in namespace `{{ flow.namespace }}`
      *Execution:* `{{ execution.id }}`
      *Database:* `{{ inputs.database_name }}` on `{{ inputs.postgres_host }}`
      Please check the Kestra execution logs for connection timeout or permission issues.

extend:
  title: PostgreSQL Blocking Transaction and Lock Contention Monitor
  shortDescription: Detect PostgreSQL lock conflicts and cascading uncommitted blockers via pg_locks, alerting DBAs on Slack before connections exhaust.
  metaTitle: PostgreSQL Blocking Transaction Monitor with Kestra
  metaDescription: Monitor PostgreSQL lock contention and blocking transactions with Kestra. Inspect pg_locks, detect cascading wait trees, and alert DBAs via Slack.
  description: |
    In production PostgreSQL environments, slow queries rarely take down an application on their own, but cascading lock conflicts do. When an uncommitted transaction, slow migration, or unindexed update acquires an exclusive lock on a hot table, dozens of incoming requests queue up behind it. Within minutes, connection pools saturate, application threads starve, and the web tier throws 504 Gateway Timeouts.

    This blueprint introspects PostgreSQL's native `pg_locks` and `pg_stat_activity` system catalogs to identify root blocking sessions, the queries they are running, their application origins, and how long downstream queries have been waiting. If lock wait times exceed your threshold, it sends an actionable Slack alert with the exact PID and copy-paste remediation commands.

    ## How it works

    1. `query_blocking_locks` (`io.kestra.plugin.jdbc.postgresql.Query`) connects to the target database and runs a self-join query against `pg_locks` and `pg_stat_activity` with `fetchType: FETCH`. It isolates granted locks that are blocking ungranted lock requests where wait duration exceeds `inputs.min_wait_seconds`.
    2. `emit_lock_metrics` (`io.kestra.plugin.core.output.OutputValues`) exports diagnostic variables (`blocked_transactions_count`, `database_scanned`, `host_scanned`, `audited_at`) into execution outputs.
    3. `evaluate_lock_contention` (`io.kestra.plugin.core.flow.If`) evaluates whether any blocking conflicts were found:
       - If true, `notify_dba_slack` (`io.kestra.plugin.slack.notifications.SlackIncomingWebhook`) dispatches a formatted Slack notification detailing blocker PIDs, application names, client IPs, wait durations, and SQL snippets.
       - If false, `log_healthy_locks` (`io.kestra.plugin.core.log.Log`) logs an all-clear confirmation.
    4. `alert_on_failure` in the `errors` block dispatches a Slack alert if database connectivity fails.

    ## What you get

    - Early detection of cascading lock bottlenecks before connection pools max out.
    - Identification of the root blocker PID, including its current transaction state (such as `idle in transaction`).
    - Copy-paste remediation SQL (`SELECT pg_cancel_backend(...)`) delivered directly to Slack.
    - Complete execution history and audit logs of all lock contention events.

    ## Who it's for

    - Database Administrators (DBAs) safeguarding mission-critical PostgreSQL clusters.
    - Site Reliability Engineers (SREs) maintaining web service availability and connection pool health.
    - Backend engineers diagnosing intermittent database timeouts and query stalls.

    ## Why orchestrate this with Kestra

    Ad-hoc manual inspections in `psql` only happen after an incident is already underway, and shell scripts on cron lack execution lineage, centralized secrets, and reliable error alerts. Kestra provides native JDBC connectivity, secure credential handling, dual schedule and webhook triggers, and automated notification routing without external agents or daemons.

    ## Prerequisites

    - Reachable PostgreSQL database (version 12+) with permissions to read `pg_stat_activity` and `pg_locks`.
    - Slack incoming webhook URL for alerting.

    ### Secrets

    - `POSTGRES_USER`: Database username with read access to system catalogs.
    - `POSTGRES_PASSWORD`: Database password for authentication.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook destination URL.
    - `WEBHOOK_KEY`: Secret authentication key for the manual webhook trigger.

    ## Quick start

    1. Configure `POSTGRES_USER`, `POSTGRES_PASSWORD`, `SLACK_WEBHOOK_URL`, and `WEBHOOK_KEY` in your Kestra namespace secrets.
    2. Set `postgres_host`, `postgres_port`, and `database_name` inputs to match your database environment.
    3. Trigger a manual execution in the Kestra UI to verify database connectivity.
    4. Enable the `scheduled_monitor` trigger to run automated checks every 10 minutes.

    ## How to extend

    - Add an automated cancellation task for low-criticality batch workloads exceeding max lock limits.
    - Route critical alerts to PagerDuty or Opsgenie in addition to Slack.
    - Log recurring blocker queries to an internal audit table for schema and index optimization.

    ## Links

    - [PostgreSQL Documentation on Lock Monitoring](https://www.postgresql.org/docs/current/explicit-locking.html)
    - [Kestra PostgreSQL Plugin Documentation](https://kestra.io/plugins/plugin-jdbc-postgresql)
    - [Kestra Slack Notifications Plugin](https://kestra.io/plugins/plugin-slack)
    - This blueprint has been created by [sheikhlimon](https://github.com/sheikhlimon)
  tags:
    - Data
    - Infrastructure
  subTags:
    - Day 2 Operations
    - Monitoring & Alerting
  ee: false
  demo: false
