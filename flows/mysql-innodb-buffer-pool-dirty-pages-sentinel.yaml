id: mysql-innodb-buffer-pool-dirty-pages-sentinel
namespace: company.database

inputs:
  - id: db_host
    type: STRING
    defaults: "mysql.internal"
    description: Hostname of MySQL database.
  - id: db_port
    type: INT
    defaults: 3306
    description: MySQL port.
  - id: db_name
    type: STRING
    defaults: "information_schema"
    description: Database name.
  - id: db_user
    type: STRING
    defaults: "root"
    description: MySQL user.

tasks:
  - id: query_dirty_pages
    type: io.kestra.plugin.jdbc.mysql.Query
    url: "jdbc:mysql://{{ inputs.db_host }}:{{ inputs.db_port }}/{{ inputs.db_name }}"
    username: "{{ inputs.db_user }}"
    password: "{{ secret('MYSQL_PASSWORD') }}"
    sql: |
      SELECT 
        (SELECT VARIABLE_VALUE FROM performance_schema.global_status WHERE VARIABLE_NAME = 'Innodb_buffer_pool_pages_dirty') AS dirty_pages,
        (SELECT VARIABLE_VALUE FROM performance_schema.global_status WHERE VARIABLE_NAME = 'Innodb_buffer_pool_pages_total') AS total_pages;
    fetchOne: true

  - id: evaluate_dirty_ratio
    type: io.kestra.plugin.core.flow.If
    condition: "{{ (outputs.query_dirty_pages.row.dirty_pages | float / outputs.query_dirty_pages.row.total_pages | float) > 0.75 }}"
    then:
      - id: notify_dba_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#dba-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 MySQL InnoDB Buffer Pool Dirty Pages Saturation Alert",
                "text": "MySQL database at `{{ inputs.db_host }}` has *{{ outputs.query_dirty_pages.row.dirty_pages }} dirty pages* (> 75% of total {{ outputs.query_dirty_pages.row.total_pages }})! Background page flushing is lagging behind write throughput, risking severe query stalls during furious checkpointing.",
                "footer": "Kestra Database Sentinel • MySQL"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#dba-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ MySQL Dirty Pages Sentinel Failure",
            "text": "Failed to query MySQL performance_schema. Verify credentials and permissions.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  title: MySQL InnoDB Buffer Pool Dirty Pages Ratio and Flush Lag Sentinel
  shortDescription: Monitors MySQL InnoDB buffer pool for high dirty page ratios to prevent checkpoint stalls and query freezes.
  description: |
    ## How it works
    This workflow connects directly to MySQL via the JDBC MySQL plugin to audit `Innodb_buffer_pool_pages_dirty` versus `Innodb_buffer_pool_pages_total` in `performance_schema.global_status`. When modified pages in the InnoDB buffer pool accumulate faster than page flushing threads can write them to disk tablespaces, dirty page ratios exceed safe bounds (> 75%). When the buffer pool runs out of clean pages for new read queries, MySQL enters synchronous "furious flushing" checkpoints, completely freezing incoming user transactions. This blueprint flags high dirty ratios before checkpoint stalls impact latency.

    ## What you get
    - Real-time visibility into MySQL InnoDB memory buffer flushing health.
    - Prevents catastrophic transaction freezes during aggressive checkpoint flushes.
    - Quantitative metrics on dirty and total buffer pool page allocations.

    ## Who it's for
    - MySQL DBAs and Backend Reliability Engineers.
    - SREs maintaining high-write transactional MySQL clusters.

    ## Why orchestrate this with Kestra
    - **Native MySQL Driver Automation**: Direct SQL querying without wrapper scripts.
    - **Continuous Health Auditing**: Scheduled execution catches flush backlogs early.
    - **Targeted Notification**: Escalates alerts directly to database reliability channels.

    ## Prerequisites
    - MySQL database with `performance_schema` enabled.
    - Secret `MYSQL_PASSWORD` and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import the blueprint.
    2. Input MySQL host, port, database, and user.
    3. Run the workflow to inspect buffer pool page ratios.

    ## How to extend
    - Inspect `Innodb_buffer_pool_wait_free` to confirm if read queries are currently blocked waiting for clean pages.
    - Dynamically tune `innodb_io_capacity_max` to increase background I/O flush bandwidth.

    ## Links
    - [MySQL InnoDB Buffer Pool Flushing Documentation](https://dev.mysql.com/doc/refman/8.0/en/innodb-buffer-pool-flushing.html)
    - [Kestra Documentation](https://kestra.io/docs)
  tags:
    - Data
    - Infrastructure
  ee: false
  demo: false
