id: binance-crypto-market-delta-lakehouse-loader
namespace: company.analytics
description: Ingests 24-hour cryptocurrency market metrics from Binance REST API into Parquet lakehouse storage via DuckDB, tracking price volatility thresholds and persisting state in Kestra KV store.

inputs:
  - id: symbols
    type: ARRAY
    itemType: STRING
    description: List of cryptocurrency trading pairs to monitor.
    defaults:
      - BTCUSDT
      - ETHUSDT
      - SOLUSDT
      - BNBUSDT
      - ADAUSDT
      - DOGEUSDT

  - id: state_key
    type: STRING
    description: Kestra KV store key maintaining the latest valuation prices.
    defaults: binance_crypto_monitored_price_state

  - id: volatility_threshold_pct
    type: FLOAT
    description: Percentage price change threshold to trigger volatility alerts.
    defaults: 5.0

variables:
  default_state: "{}"

triggers:
  - id: hourly_crypto_sync
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 * * * *"

tasks:
  - id: get_current_state
    type: io.kestra.plugin.core.kv.Get
    key: "{{ inputs.state_key }}"
    errorOnMissing: false

  - id: ingest_and_transform_markets
    type: io.kestra.plugin.scripts.python.Commands
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install requests duckdb
    commands:
      - |
        python3 - << 'EOF'
        import os
        import json
        import urllib.parse
        import requests
        import duckdb
        from datetime import datetime

        raw_state = """{{ outputs.get_current_state.value ?? vars.default_state }}"""
        try:
            state = json.loads(raw_state) if raw_state else {}
        except Exception:
            state = {}

        symbols = json.loads("""{{ inputs.symbols | toJson }}""")
        threshold = float("{{ inputs.volatility_threshold_pct }}")

        symbols_param = json.dumps(symbols)
        encoded_symbols = urllib.parse.quote(symbols_param)
        url = f"https://api.binance.com/api/v3/ticker/24hr?symbols={encoded_symbols}"

        records = []
        volatile_assets = []
        new_state = dict(state)

        try:
            headers = {"User-Agent": "KestraMarketLakehouse/1.0"}
            resp = requests.get(url, headers=headers, timeout=15)
            if resp.status_code == 200:
                data = resp.json()
                for item in data:
                    sym = item.get("symbol")
                    last_price = float(item.get("lastPrice", 0.0))
                    prev_close = float(item.get("prevClosePrice", 0.0))
                    price_change = float(item.get("priceChange", 0.0))
                    change_pct = float(item.get("priceChangePercent", 0.0))
                    high_price = float(item.get("highPrice", 0.0))
                    low_price = float(item.get("lowPrice", 0.0))
                    volume = float(item.get("volume", 0.0))
                    quote_volume = float(item.get("quoteVolume", 0.0))
                    trades_count = int(item.get("count", 0))

                    prior_logged_price = float(state.get(sym, last_price))
                    step_pct = ((last_price - prior_logged_price) / prior_logged_price * 100.0) if prior_logged_price else 0.0

                    is_volatile = abs(change_pct) >= threshold

                    records.append({
                        "symbol": sym,
                        "last_price": last_price,
                        "previous_close_price": prev_close,
                        "price_change_24h": price_change,
                        "price_change_percent_24h": change_pct,
                        "high_price_24h": high_price,
                        "low_price_24h": low_price,
                        "base_volume": volume,
                        "quote_volume_usd": quote_volume,
                        "trades_count": trades_count,
                        "step_change_pct": round(step_pct, 4),
                        "is_volatile": is_volatile,
                        "snapshot_time": datetime.utcnow().isoformat()
                    })

                    if is_volatile:
                        volatile_assets.append({
                            "symbol": sym,
                            "last_price": last_price,
                            "change_percent": change_pct
                        })

                    new_state[sym] = last_price
        except Exception as e:
            print(f"Error fetching Binance market tickers: {e}")

        with open("crypto_tickers.json", "w", encoding="utf-8") as f:
            json.dump(records, f)

        con = duckdb.connect()
        if records:
            con.execute("CREATE TABLE crypto_market AS SELECT * FROM read_json_auto('crypto_tickers.json')")
            con.execute("COPY crypto_market TO 'crypto_market_audit.parquet' (FORMAT PARQUET)")
            con.execute("COPY crypto_market TO 'crypto_market_audit.csv' (HEADER, DELIMITER ',')")
        else:
            con.execute("""
                CREATE TABLE crypto_market (
                    symbol VARCHAR,
                    last_price DOUBLE,
                    previous_close_price DOUBLE,
                    price_change_24h DOUBLE,
                    price_change_percent_24h DOUBLE,
                    high_price_24h DOUBLE,
                    low_price_24h DOUBLE,
                    base_volume DOUBLE,
                    quote_volume_usd DOUBLE,
                    trades_count BIGINT,
                    step_change_pct DOUBLE,
                    is_volatile BOOLEAN,
                    snapshot_time VARCHAR
                )
            """)
            con.execute("COPY crypto_market TO 'crypto_market_audit.parquet' (FORMAT PARQUET)")
            con.execute("COPY crypto_market TO 'crypto_market_audit.csv' (HEADER, DELIMITER ',')")

        summary = {
            "monitored_symbols": len(records),
            "volatile_assets_count": len(volatile_assets),
            "volatile_assets": volatile_assets,
            "updated_state": new_state
        }

        print(f"::{{'outputs': {json.dumps(summary)}}}::")
        EOF
    outputFiles:
      - crypto_market_audit.parquet
      - crypto_market_audit.csv

  - id: persist_state
    type: io.kestra.plugin.core.kv.Set
    key: "{{ inputs.state_key }}"
    value: "{{ outputs.ingest_and_transform_markets.vars.updated_state | toJson }}"

  - id: check_volatility
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.ingest_and_transform_markets.vars.volatile_assets_count > 0 }}"
    then:
      - id: notify_high_volatility
        type: io.kestra.plugin.core.log.Log
        level: WARN
        message: "📈 Market Volatility Alert: {{ outputs.ingest_and_transform_markets.vars.volatile_assets_count }} asset(s) exceeded the {{ inputs.volatility_threshold_pct }}% 24h price swing threshold."

outputs:
  - id: monitored_count
    type: INT
    value: "{{ outputs.ingest_and_transform_markets.vars.monitored_symbols }}"
  - id: volatile_count
    type: INT
    value: "{{ outputs.ingest_and_transform_markets.vars.volatile_assets_count }}"
  - id: dataset_parquet
    type: FILE
    value: "{{ outputs.ingest_and_transform_markets.outputFiles['crypto_market_audit.parquet'] }}"

extend:
  title: Binance Cryptocurrency Market Delta Lakehouse Loader with DuckDB
  metaTitle: Binance Crypto Market Delta Lakehouse Loader | Kestra
  shortDescription: Ingests 24h cryptocurrency market metrics from Binance REST API into Parquet lakehouse storage via DuckDB with volatility tracking.
  metaDescription: Poll Binance REST API for 24h market metrics, convert trading telemetry into Parquet via DuckDB, track step changes in KV store, and alert on volatility.
  tags:
    - Data
  subTags:
    - ELT & Warehouse Loading
    - File & Data Processing Basics
  ee: false
  demo: false
  description: |
    Orchestrate automated, reliable extraction, transformation, and analytical persistence of 24-hour cryptocurrency
    market data and trade velocity metrics from the Binance REST API into high-performance columnar Parquet using DuckDB.

    ## How it works

    1. **State Retrieval**: Fetches the previous cycle's asset prices from Kestra KV store (`binance_crypto_monitored_price_state`).
    2. **Multi-Symbol Ticker Extraction**: Queries Binance 24h ticker endpoint (`/api/v3/ticker/24hr`) for liquid trading pairs.
    3. **DuckDB Telemetry Normalization**: Unpacks trade counts, price changes, quote volumes, and intra-run step changes inside an ephemeral container.
    4. **Analytical Lake Export**: Exports normalized market snapshots into columnar Parquet and CSV files for time-series modeling and risk analytics.
    5. **Volatility Detection & State Commitment**: Detects market pairs exceeding volatility thresholds and commits latest prices to Kestra KV store.

    ## What you get

    - Automated, scheduled collection of institutional-grade market metrics without API key requirements.
    - Columnar Parquet datasets ready for high-speed SQL analytics with DuckDB, ClickHouse, Snowflake, or Athena.
    - Built-in KV state management tracking price momentum and volatility between pipeline runs.

    ## Who it's for

    - Quantitative Data Engineers building crypto market feature stores.
    - FinTech teams monitoring liquidity, volume spikes, and risk exposures.
    - Analytics Engineers centralizing real-time market data into lakehouse architectures.

    ## Why orchestrate this with Kestra

    - Built-in KV store maintains historical market states without requiring Redis or PostgreSQL infrastructure.
    - Ephemeral Docker execution guarantees consistent, isolated Python and DuckDB dependencies.
    - Declarative scheduled execution with automated error recovery and conditional logging.

    ## Prerequisites

    - Docker runner configured on the Kestra worker.
    - Outbound internet access to `api.binance.com`.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: (Optional) Webhook URL for forwarding volatility warnings.

    ## Quick start

    1. Import this blueprint into your Kestra instance.
    2. Adjust the `symbols` input list to track your target trading pairs.
    3. Click **Execute** to run an immediate market data harvest.
    4. Enable the `hourly_crypto_sync` schedule for automated hourly updates.

    ## How to extend

    - Add an S3 or Google Cloud Storage task to partition hourly Parquet files by date.
    - Connect a dbt task downstream to update market valuation rollups and moving averages.

    ## Links

    - [Binance API Documentation](https://binance-docs.github.io/apidocs/spot/en/#24hr-ticker-price-change-statistics)
    - [DuckDB Documentation](https://duckdb.org/)
    - [Kestra Task Runners](https://kestra.io/docs/task-runners)
