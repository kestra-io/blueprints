id: efs-unused-finder
namespace: company.team

description: |
  Finds EFS file systems billing for storage nobody touches. EFS Standard
  costs ~$0.30/GB-month, and abandoned file systems from deleted environments
  keep charging as long as they exist. This flow flags file systems with zero
  mount targets or zero read/write throughput over your idle window, estimates
  the monthly waste per file system, and reports it to Slack.

inputs:
  - id: aws_regions
    type : ARRAY
    itemType: STRING
    defaults: ["us-east-1"]
    description: AWS regions to audit for unused EFS file systems.
  - id: idle_days
    type : INT
    defaults: 14
    description: File systems with no mount targets or zero throughput over this many days count as unused.

tasks:
  - id: check_filesystems
    type: io.kestra.plugin.core.flow.ForEach
    description: Audit EFS file systems region by region.
    values: "{{ inputs.aws_regions }}"
    tasks:
      - id: audit_region
        type: io.kestra.plugin.aws.cli.AwsCLI
        description: List file systems, check mount targets and throughput per file system.
        region: "{{ taskrun.value }}"
        accessKeyId: "{{ secret('AWS_ACCESS_KEY_ID') }}"
        secretKeyId: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
        commands:
          - |
            REGION="{{ taskrun.value }}"
            DAYS={{ inputs.idle_days }}
            END=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            START=$(date -u -d "$DAYS days ago" +%Y-%m-%dT%H:%M:%SZ)
            PERIOD=$((DAYS * 86400))
            echo "Auditing EFS file systems in $REGION (traffic window: last $DAYS days)"
            IDLE_COUNT=0
            IDLE_LIST=""
            TOTAL_CENTS=0
            for FS in $(aws efs describe-file-systems --region "$REGION" \
              --query 'FileSystems[].FileSystemId' --output text | tr '\t' '\n'); do
              SIZE=$(aws efs describe-file-systems --region "$REGION" --file-system-id "$FS" \
                --query 'FileSystems[0].SizeInBytes.Value' --output text 2>/dev/null)
              case "$SIZE" in ''|'None') SIZE=0;; esac
              MT=$(aws efs describe-mount-targets --region "$REGION" --file-system-id "$FS" \
                --query 'length(MountTargets)' --output text 2>/dev/null)
              case "$MT" in ''|'None') MT=0;; esac
              READ=$(aws cloudwatch get-metric-statistics --region "$REGION" \
                --namespace AWS/EFS --metric-name DataReadIOBytes \
                --dimensions Name=FileSystemId,Value="$FS" \
                --start-time "$START" --end-time "$END" \
                --period "$PERIOD" --statistics Sum \
                --query 'Datapoints[0].Sum' --output text 2>/dev/null)
              WRITE=$(aws cloudwatch get-metric-statistics --region "$REGION" \
                --namespace AWS/EFS --metric-name DataWriteIOBytes \
                --dimensions Name=FileSystemId,Value="$FS" \
                --start-time "$START" --end-time "$END" \
                --period "$PERIOD" --statistics Sum \
                --query 'Datapoints[0].Sum' --output text 2>/dev/null)
              case "$READ" in ''|'None') READ=0;; esac
              case "$WRITE" in ''|'None') WRITE=0;; esac
              RINT=${READ%.*}
              WINT=${WRITE%.*}
              MONTHLY=$(python3 -c "print('{:.2f}'.format($SIZE/1073741824*0.30))")
              echo "fs $FS: ${MT} mount target(s), ${RINT}B read + ${WINT}B written in ${DAYS}d, ~\$${MONTHLY}/mo"
              if [ "$MT" -eq 0 ] || { [ "$RINT" -eq 0 ] && [ "$WINT" -eq 0 ]; }; then
                IDLE_LIST="${IDLE_LIST}${FS} (\$${MONTHLY}/mo), "
                IDLE_COUNT=$((IDLE_COUNT + 1))
                CENTS=$(python3 -c "print(int($SIZE/1073741824*30))")
                TOTAL_CENTS=$((TOTAL_CENTS + CENTS))
              fi
            done
            SAVINGS=$(python3 -c "print('{:.2f}'.format($TOTAL_CENTS/100))")
            echo "IDLE_COUNT=$IDLE_COUNT"
            echo "IDLE_FILESYSTEMS=$IDLE_LIST"
            echo "EST_MONTHLY_SAVINGS=$SAVINGS"
            echo "REGION_DONE=$REGION"
            if [ "$IDLE_COUNT" -gt 0 ]; then
              echo "WASTE_FOUND"
            fi
      - id: notify_region
        type: io.kestra.plugin.core.flow.If
        description: Alert on unused file systems, stay quiet when everything serves traffic.
        condition: "{{ outputs.audit_region.stdout contains 'WASTE_FOUND' }}"
        then:
          - id: slack_unused
            type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
            url: "{{ secret('SLACK_WEBHOOK_URL') }}"
            payload: |
              {
                "text": ":money_with_wings: EFS unused check `{{ outputs.audit_region.vars.REGION_DONE }}` — *{{ outputs.audit_region.vars.IDLE_COUNT }}* unused file system(s), ~${{ outputs.audit_region.vars.EST_MONTHLY_SAVINGS }}/mo waste.\n`{{ outputs.audit_region.vars.IDLE_FILESYSTEMS }}`\nBack up anything you need, then delete them in the EFS console."
              }
        else:
          - id: log_busy
            type: io.kestra.plugin.core.log.Log
            message: "No unused EFS file systems in {{ outputs.audit_region.vars.REGION_DONE }} — every file system has mount targets and throughput."

triggers:
  - id: weekly
    type: io.kestra.plugin.core.trigger.Schedule
    description: Weekly on Monday at 09:00 UTC. Shipped disabled; enable after your first manual run.
    cron: "0 9 * * 1"
    disabled: true

extend:
  title: EFS Unused Finder
  metaTitle: Find Unused EFS File Systems Wasting Storage Spend | Kestra
  shortDescription: Audit EFS file systems across regions for missing mount targets or zero throughput, and estimate the monthly storage waste.
  metaDescription: EFS costs ~$0.30/GB-month. This flow finds file systems with no mount targets or zero throughput and reports the monthly waste.
  description: |
    EFS bills ~$0.30/GB-month for Standard storage, and a file system keeps billing as long as it exists — mounted or not. Every deleted environment that forgot its file system, every experiment that ended but was never cleaned up, is a line item nobody questions because there is no alarm for "storage nobody mounts."

    ## How it works

    1. A Schedule trigger fires weekly on Monday at 09:00 UTC (shipped disabled).
    2. A ForEach loop audits each region in `aws_regions`.
    3. Per region, the flow lists every file system, then checks `describe-mount-targets` (zero mount targets = definitely unused) and sums `DataReadIOBytes` + `DataWriteIOBytes` from CloudWatch over the `idle_days` window.
    4. File systems with no mount targets OR zero throughput are flagged, and monthly waste is estimated at the EFS Standard list price from `SizeInBytes`.
    5. An `If` task posts a Slack alert with the file system IDs and savings only when something is unused — no spam on clean weeks.

    ## What you get

    - A weekly list of unused EFS file systems, with mount-target counts, byte counts, and per-file-system dollar estimates as evidence.
    - A total monthly savings figure, so the cleanup gets prioritized.
    - Multi-region coverage in one run, with the idle window tunable via `idle_days`.
    - Silence when everything serves traffic — alerts only on real findings.

    ## Who it's for

    Platform engineers and FinOps-minded teams whose EFS bill includes file systems nobody has mounted in months.

    ## Why orchestrate this with Kestra

    A one-off CLI session finds today's waste and is forgotten by next month. As a scheduled Kestra flow the audit runs itself, the idle window is an input anyone can tune, every run is logged for audit, and adding a region is one list entry — not a new script.

    ## Prerequisites

    - AWS credentials with `elasticfilesystem:DescribeFileSystems`, `elasticfilesystem:DescribeMountTargets` and `cloudwatch:GetMetricStatistics` permissions.
    - A Slack incoming webhook URL.

    ### Secrets

    - `AWS_ACCESS_KEY_ID`: AWS access key for the EFS and CloudWatch API calls.
    - `AWS_SECRET_ACCESS_KEY`: AWS secret key for the EFS and CloudWatch API calls.
    - `SLACK_WEBHOOK_URL`: Incoming webhook URL for the unused-filesystem alert.

    ## Quick start

    1. Add the three secrets above to your Kestra namespace.
    2. Set `aws_regions` to the regions you run EFS in.
    3. Run manually once and review the Slack report (or the clean log line).
    4. Enable the weekly schedule trigger.

    ## How to extend

    - Also check lifecycle policies and Infrequent Access bytes to split the waste estimate by storage class.
    - Tag confirmed-unused file systems with `CandidateForDeletion=true` before deleting, for a review-first flow.
    - Write the findings to a table for month-over-month waste trends.

    ## Links

    - [Kestra AWS plugins](https://kestra.io/plugins)
    - [Kestra Slack plugins](https://kestra.io/plugins)
    - [EFS pricing](https://aws.amazon.com/efs/pricing/)
    - [EFS CloudWatch metrics](https://docs.aws.amazon.com/efs/latest/ug/efs-metrics.html)
  tags:
    - Infrastructure
  subTags:
    - FinOps & Cost Management
    - Monitoring & Alerting
  ee: false
  demo: false
