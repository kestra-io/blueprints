id: rabbitmq-file-descriptor-exhaustion-and-socket-leak-sentinel
namespace: company.sre

description: |
  Audits RabbitMQ broker node file descriptor and socket limits to prevent EMFILE crashes and connection drops.

concurrency:
  limit: 1

inputs:
  - id: rabbitmq_host
    type: STRING
    displayName: "RabbitMQ Host"
    defaults: "rabbitmq.internal"
    description: "Host for RabbitMQ management API."
  - id: rabbitmq_user
    type: STRING
    displayName: "RabbitMQ User"
    defaults: "guest"
    description: "RabbitMQ management username."

triggers:
  - id: scheduled_check
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

tasks:
  - id: probe_metrics
    type: io.kestra.plugin.scripts.shell.Commands
    containerImage: curlimages/curl:latest
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    env:
      RABBIT_HOST: "{{ inputs.rabbitmq_host }}"
      RABBIT_USER: "{{ inputs.rabbitmq_user }}"
      RABBIT_PASS: "{{ secret('RABBITMQ_PASSWORD') }}"
    commands:
      - |
        NODES_JSON=$(curl -s -u "$RABBIT_USER:$RABBIT_PASS" "http://$RABBIT_HOST:15672/api/nodes" 2>/dev/null)
        if [ -z "$NODES_JSON" ]; then echo "RabbitMQ API query failed" >&2; exit 1; fi
        echo "$NODES_JSON" | jq '
        [ .[] | {name: .name, fd_used: .fd_used, fd_total: .fd_total, fd_pct: ((.fd_used / .fd_total) * 100)} ]
        | {top_fd: (sort_by(-.fd_pct)[0]), is_alert: (any(.[]; .fd_pct > 80))}
        ' > output.json
    outputFiles:
      - output.json

  - id: evaluate_threshold
    type: io.kestra.plugin.core.flow.If
    condition: "{{ json(read(outputs.probe_metrics.outputFiles['output.json'])).is_alert }}"
    then:
      - id: notify_slack
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#infrastructure-alerts",
            "text": "🚨 *RabbitMQ File Descriptors Alert: `{{ inputs.rabbitmq_host }}`*\n- *Node*: `{{ json(read(outputs.probe_metrics.outputFiles['output.json'])).top_fd.name }}`\n- *FD Utilization*: `{{ json(read(outputs.probe_metrics.outputFiles['output.json'])).top_fd.fd_pct }}%`"
          }

errors:
  - id: notify_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#infrastructure-alerts",
        "text": "❌ *Sentinel probe execution failed for rabbitmq-file-descriptor-exhaustion-and-socket-leak-sentinel*"
      }

extend:
  title: Rabbitmq file descriptor exhaustion and socket leak sentinel
  shortDescription: Audits RabbitMQ broker node file descriptor and socket limits to prevent EMFILE crashes and connection drops.
  description: |
