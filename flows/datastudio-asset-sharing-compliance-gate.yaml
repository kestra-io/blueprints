id: datastudio-asset-sharing-compliance-gate
namespace: company.team
description: |
  List who has access to a Data Studio report or data source on a
  schedule, classify the result as AT_RISK, HEALTHY, or UNREACHABLE
  based on whether any member holds a link-sharing role, log clean
  audits, and alert Slack the moment an asset is shared with anyone
  holding the link or the API cannot be reached.

inputs:
  - id: asset_id
    type: STRING
    defaults: "your-data-studio-asset-id"
    displayName: "Data Studio Asset ID"
    description: "The Data Studio report or data source asset ID to audit."
  - id: flag_link_sharing
    type: SELECT
    defaults: "true"
    values:
      - "true"
      - "false"
    displayName: "Flag Link Sharing"
    description: "When true, any member with role LINK_EDITOR or LINK_VIEWER (anyone with the link) is classified AT_RISK."

triggers:
  - id: datastudio_sharing_gate_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    description: "Audit asset sharing permissions every 6 hours."
    cron: "0 */6 * * *"
    disabled: true
    inputs:
      asset_id: "your-data-studio-asset-id"
      flag_link_sharing: "true"

tasks:
  - id: list_asset_permissions
    type: io.kestra.plugin.datastudio.permissions.Get
    description: "List every member with access to the asset, grouped by role (OWNER, EDITOR, VIEWER, LINK_EDITOR, LINK_VIEWER)."
    serviceAccount: "{{ secret('GCP_SERVICE_ACCOUNT_JSON') }}"
    assetName: "{{ inputs.asset_id }}"
    fetchType: FETCH
    allowFailure: true

  - id: classify_sharing_risk
    type: io.kestra.plugin.core.debug.Return
    description: "Classify UNREACHABLE when no members were returned, AT_RISK when flag_link_sharing is true and at least one member holds LINK_EDITOR or LINK_VIEWER, otherwise HEALTHY."
    format: "{{ outputs.list_asset_permissions.members is defined ? ((inputs.flag_link_sharing == 'true' and (outputs.list_asset_permissions.members | jq('[.[] | select(.role == \"LINK_EDITOR\" or .role == \"LINK_VIEWER\")] | length') | first | default(0)) > 0) ? 'AT_RISK' : 'HEALTHY') : 'UNREACHABLE' }}"

  - id: route_by_sharing_risk
    type: io.kestra.plugin.core.flow.Switch
    description: "Log a quiet confirmation when sharing is scoped to named members, page Slack when the asset is shared with anyone holding the link, or page Slack when the API could not be reached."
    value: "{{ outputs.classify_sharing_risk.value }}"
    cases:
      "HEALTHY":
        - id: log_healthy
          type: io.kestra.plugin.core.log.Log
          message: "Asset {{ inputs.asset_id }} has {{ outputs.list_asset_permissions.size }} member(s), none with link-sharing roles."
      "AT_RISK":
        - id: alert_at_risk
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "text": "Data Studio sentinel AT_RISK: asset {{ inputs.asset_id }} has at least one member with LINK_EDITOR or LINK_VIEWER access out of {{ outputs.list_asset_permissions.size }} total member(s) (anyone with the link can access it). Execution {{ execution.id }}."
            }
      "UNREACHABLE":
        - id: alert_unreachable
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "text": "Data Studio sentinel UNREACHABLE: no permissions were returned for asset {{ inputs.asset_id }} (invalid credentials, missing domain-wide delegation scope, or the asset does not exist). Execution {{ execution.id }}."
            }
    defaults:
      - id: log_unclassified
        type: io.kestra.plugin.core.log.Log
        message: "Completed Data Studio sharing audit with status: {{ outputs.classify_sharing_risk.value }}"

  - id: log_audit_status
    type: io.kestra.plugin.core.log.Log
    description: "Post-audit status line recorded on every run regardless of branch, for a continuous sharing-compliance trend in the execution history."
    message: "Data Studio sharing audit: asset={{ inputs.asset_id }}, flag_link_sharing={{ inputs.flag_link_sharing }}, status={{ outputs.classify_sharing_risk.value }}, execution={{ execution.id }}."

errors:
  - id: alert_flow_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: "Alert Slack when the compliance gate flow itself fails, so a broken audit never silently stops monitoring asset sharing."
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "Data Studio sharing compliance gate flow {{ flow.id }} FAILED (execution {{ execution.id }}). Sharing status for asset {{ inputs.asset_id }} is now unknown; check the task logs and the Data Studio API manually."
      }

outputs:
  - id: status
    type: STRING
    value: "{{ outputs.classify_sharing_risk.value }}"

extend:
  title: "Data Studio Asset Sharing Compliance Gate"
  metaTitle: Data Studio Asset Sharing Compliance Gate for Kestra
  shortDescription: List who has access to a Data Studio report or data source on a schedule, flag link-sharing roles, and alert Slack when an asset is shared with anyone holding the link.
  metaDescription: Audit Data Studio asset sharing permissions and alert Slack when a report or data source is shared with anyone holding the link.
  description: |
    A Data Studio report shared with "anyone with the link" looks identical to one scoped to three named analysts until someone actually lists its permissions. This blueprint lists every member with access to a tracked asset on a schedule, flags any link-sharing role, and pages Slack the moment one appears or the API itself cannot be reached, instead of relying on someone noticing during a security review.

    ## How it works

    1. `list_asset_permissions` (`io.kestra.plugin.datastudio.permissions.Get`) lists every member with access to `asset_id`, grouped by role (`OWNER`, `EDITOR`, `VIEWER`, `LINK_EDITOR`, `LINK_VIEWER`). `allowFailure: true` means a connection or authentication failure still lets the flow continue instead of aborting.
    2. `classify_sharing_risk` (`io.kestra.plugin.core.debug.Return`) checks whether `outputs.list_asset_permissions.members` is defined; if not, `UNREACHABLE`. Otherwise, when `flag_link_sharing` is `true`, it runs a `jq` filter counting members whose role is `LINK_EDITOR` or `LINK_VIEWER`, returning `AT_RISK` when that count is above zero, `HEALTHY` otherwise.
    3. `route_by_sharing_risk` (`io.kestra.plugin.core.flow.Switch`) branches on that string: `HEALTHY` logs a quiet confirmation, `AT_RISK` pages Slack with the member count, `UNREACHABLE` pages Slack separately, and `defaults` logs the raw outcome.
    4. `log_audit_status` records a status line on every run regardless of branch, so the execution history is a continuous sharing-compliance trend.
    5. The `errors` block pages Slack separately if the flow itself fails outright.
    6. The `datastudio_sharing_gate_schedule` trigger polls every 6 hours with explicit input overrides, shipped `disabled: true` until you point it at a real asset.

    ## What you get

    - A scheduled, permissions-API-native sharing audit with zero custom client code.
    - A three-way `status` output (`HEALTHY` / `AT_RISK` / `UNREACHABLE`) you can chart or gate other flows on.
    - A Slack page naming the asset and the number of members behind a link-sharing finding.
    - A separate failure channel for the audit flow itself, plus a standing audit log line per run.

    ## Who it's for

    - Data platform and security teams who want a recurring check that sensitive Data Studio reports were not accidentally switched to link sharing.
    - Workspace admins auditing a portfolio of dashboards for sharing drift without opening each one by hand.

    ## Why orchestrate this with Kestra

    Checking sharing settings by hand does not scale past a handful of dashboards, and a manual review only catches drift at the moment someone looks. This flow keeps every audit in the execution history, turns the result into a typed output other flows can depend on, and gives you a Switch branch to grow into real remediation (revoking link access automatically, opening a ticket) without rewriting the audit itself.

    ## Prerequisites

    - A Google Cloud service account with domain-wide delegation configured in a Google Workspace or Cloud Identity organization, granted the `https://www.googleapis.com/auth/datastudio.readonly` scope. Data Studio (Looker Studio) itself is free to use with any Google account; no paid Google Cloud tier is required for this read-only scope, but domain-wide delegation does require a Workspace or Cloud Identity admin to configure. There is no self-hostable Docker image for this API, so test it against a real asset you control.
    - The tracked `asset_id` must already exist and be reachable by the configured service account.
    - A Slack incoming webhook for the at-risk and unreachable alerts.

    ### Secrets

    - `GCP_SERVICE_ACCOUNT_JSON`: Google service account key JSON used to authenticate against the Data Studio API.
    - `SLACK_WEBHOOK_URL`: Slack incoming webhook used for the at-risk alert, the unreachable alert, and the flow-failure alert.
    - OSS note: if your Kestra instance reads secrets from environment variables instead of a secrets backend, set `SECRET_GCP_SERVICE_ACCOUNT_JSON` and `SECRET_SLACK_WEBHOOK_URL` as base64, for example `echo -n "<your-service-account-json>" | base64` and `echo -n "<your-webhook-url>" | base64`.

    ## Quick start

    1. Add the `GCP_SERVICE_ACCOUNT_JSON` and `SLACK_WEBHOOK_URL` secrets.
    2. Set `asset_id` to a Data Studio report or data source you control.
    3. Run the flow once and confirm `status` reads `HEALTHY` for an asset scoped to named members.
    4. Switch that asset's sharing to "anyone with the link" and re-run to confirm `status` reads `AT_RISK`.
    5. Enable `datastudio_sharing_gate_schedule`.

    ## How to extend

    - Loop over a list of asset ids with a `Loop` task to audit an entire portfolio of dashboards from one flow.
    - Also flag any `member` outside your organization's domain, not just link-sharing roles.
    - Add a remediation task using the plugin's `permissions.Revoke` task to automatically strip a link-sharing role once it is detected, instead of only alerting.

    ## Links

    - [Data Studio (Looker Studio) API](https://developers.google.com/looker-studio)
    - [Kestra Switch task](https://kestra.io/plugins/core/tasks/flow/io.kestra.plugin.core.flow.switch)
  tags:
    - Data
    - Business
  subTags:
    - Monitoring & Alerting
    - Policy & Compliance
  ee: false
  demo: false
