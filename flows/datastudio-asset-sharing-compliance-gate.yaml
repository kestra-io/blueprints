id: datastudio-asset-sharing-compliance-gate
namespace: company.team
description: |
  List who has access to a Data Studio report on a schedule by calling
  the Google Drive permissions API directly (Data Studio reports are
  Drive-backed files), classify the result as AT_RISK, HEALTHY, or
  UNREACHABLE based on whether any permission grants access to
  "anyone with the link", log clean audits, and alert Slack the
  moment link sharing is detected or the API cannot be reached.

inputs:
  - id: asset_id
    type: STRING
    defaults: "your-data-studio-asset-id"
    displayName: "Data Studio Asset ID"
    description: "The Data Studio report's asset ID, which is also its underlying Google Drive file ID."
  - id: flag_link_sharing
    type: SELECT
    defaults: "true"
    values:
      - "true"
      - "false"
    displayName: "Flag Link Sharing"
    description: "When true, any Drive permission with type anyone (anyone with the link) is classified AT_RISK."

triggers:
  - id: datastudio_sharing_gate_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    description: "Audit asset sharing permissions every 6 hours."
    cron: "0 */6 * * *"
    disabled: true
    inputs:
      asset_id: "your-data-studio-asset-id"
      flag_link_sharing: "true"

tasks:
  - id: list_asset_permissions
    type: io.kestra.plugin.core.http.Request
    description: "List every permission on the report via the Google Drive v3 permissions.list REST API. There is no dedicated Kestra plugin for the Data Studio API; Data Studio reports are Drive-backed files, so their sharing is read through Drive's own permissions endpoint."
    uri: "https://www.googleapis.com/drive/v3/files/{{ inputs.asset_id }}/permissions?fields=permissions(id,type,role,emailAddress,domain,displayName)"
    method: GET
    headers:
      Authorization: "Bearer {{ secret('GOOGLE_DRIVE_ACCESS_TOKEN') }}"
    allowFailure: true

  - id: classify_sharing_risk
    type: io.kestra.plugin.core.debug.Return
    description: "Classify UNREACHABLE when no response body was returned, AT_RISK when flag_link_sharing is true and at least one Drive permission has type anyone, otherwise HEALTHY."
    format: "{{ outputs.list_asset_permissions.body is defined ? ((inputs.flag_link_sharing == 'true' and (outputs.list_asset_permissions.body | jq('[.permissions[] | select(.type == \"anyone\")] | length') | first | default(0)) > 0) ? 'AT_RISK' : 'HEALTHY') : 'UNREACHABLE' }}"

  - id: route_by_sharing_risk
    type: io.kestra.plugin.core.flow.Switch
    description: "Log a quiet confirmation when sharing is scoped to named users or domains, page Slack when the asset is shared with anyone holding the link, or page Slack when the API could not be reached."
    value: "{{ outputs.classify_sharing_risk.value }}"
    cases:
      "HEALTHY":
        - id: log_healthy
          type: io.kestra.plugin.core.log.Log
          message: "Asset {{ inputs.asset_id }} has {{ outputs.list_asset_permissions.body | jq('.permissions | length') | first }} permission(s), none granted to anyone with the link."
      "AT_RISK":
        - id: alert_at_risk
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "text": "Data Studio sentinel AT_RISK: asset {{ inputs.asset_id }} has at least one Drive permission with type anyone out of {{ outputs.list_asset_permissions.body | jq('.permissions | length') | first }} total permission(s) (anyone with the link can access it). Execution {{ execution.id }}."
            }
      "UNREACHABLE":
        - id: alert_unreachable
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "text": "Data Studio sentinel UNREACHABLE: no permissions were returned for asset {{ inputs.asset_id }} (invalid or expired access token, missing drive.readonly scope, or the file does not exist). Execution {{ execution.id }}."
            }
    defaults:
      - id: log_unclassified
        type: io.kestra.plugin.core.log.Log
        message: "Completed Data Studio sharing audit with status: {{ outputs.classify_sharing_risk.value }}"

  - id: log_audit_status
    type: io.kestra.plugin.core.log.Log
    description: "Post-audit status line recorded on every run regardless of branch, for a continuous sharing-compliance trend in the execution history."
    message: "Data Studio sharing audit: asset={{ inputs.asset_id }}, flag_link_sharing={{ inputs.flag_link_sharing }}, status={{ outputs.classify_sharing_risk.value }}, execution={{ execution.id }}."

errors:
  - id: alert_flow_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: "Alert Slack when the compliance gate flow itself fails, so a broken audit never silently stops monitoring asset sharing."
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "Data Studio sharing compliance gate flow {{ flow.id }} FAILED (execution {{ execution.id }}). Sharing status for asset {{ inputs.asset_id }} is now unknown; check the task logs and the Drive API manually."
      }

outputs:
  - id: status
    type: STRING
    value: "{{ outputs.classify_sharing_risk.value }}"

extend:
  title: "Data Studio Asset Sharing Compliance Gate"
  metaTitle: Data Studio Asset Sharing Compliance Gate for Kestra
  shortDescription: List who has access to a Data Studio report via the Google Drive permissions API on a schedule, flag link sharing, and alert Slack when an asset is shared with anyone holding the link.
  metaDescription: Audit Data Studio report sharing via the Google Drive permissions API and alert Slack when a report is shared with anyone holding the link.
  description: |
    A Data Studio report shared with "anyone with the link" looks identical to one scoped to three named analysts until someone actually lists its permissions. Data Studio has no dedicated Kestra plugin, but every Data Studio report is a Google Drive-backed file, so this blueprint reads its sharing through Drive's own permissions API on a schedule, flags any permission granted to "anyone", and pages Slack the moment one appears or the API itself cannot be reached.

    ## How it works

    1. `list_asset_permissions` (`io.kestra.plugin.core.http.Request`) calls `GET https://www.googleapis.com/drive/v3/files/{fileId}/permissions` for `asset_id` with a Bearer-token `Authorization` header, requesting the `id`, `type`, `role`, `emailAddress`, `domain`, and `displayName` fields. `allowFailure: true` means a connection or authentication failure still lets the flow continue instead of aborting.
    2. `classify_sharing_risk` (`io.kestra.plugin.core.debug.Return`) checks whether `outputs.list_asset_permissions.body` is defined; if not, `UNREACHABLE`. Otherwise, when `flag_link_sharing` is `true`, it runs a `jq` filter over the JSON body counting permissions whose `type` is `anyone`, returning `AT_RISK` when that count is above zero, `HEALTHY` otherwise.
    3. `route_by_sharing_risk` (`io.kestra.plugin.core.flow.Switch`) branches on that string: `HEALTHY` logs a quiet confirmation, `AT_RISK` pages Slack with the permission count, `UNREACHABLE` pages Slack separately, and `defaults` logs the raw outcome.
    4. `log_audit_status` records a status line on every run regardless of branch, so the execution history is a continuous sharing-compliance trend.
    5. The `errors` block pages Slack separately if the flow itself fails outright.
    6. The `datastudio_sharing_gate_schedule` trigger polls every 6 hours with explicit input overrides, shipped `disabled: true` until you point it at a real asset.

    ## What you get

    - A scheduled sharing audit built on the core HTTP task and the real Google Drive permissions API, with zero custom client code.
    - A three-way `status` output (`HEALTHY` / `AT_RISK` / `UNREACHABLE`) you can chart or gate other flows on.
    - A Slack page naming the asset and the total permission count behind a link-sharing finding.
    - A separate failure channel for the audit flow itself, plus a standing audit log line per run.

    ## Who it's for

    - Data platform and security teams who want a recurring check that sensitive Data Studio reports were not accidentally switched to link sharing.
    - Workspace admins auditing a portfolio of dashboards for sharing drift without opening each one by hand.

    ## Why orchestrate this with Kestra

    Checking sharing settings by hand does not scale past a handful of dashboards, and a manual review only catches drift at the moment someone looks. This flow keeps every audit in the execution history, turns the result into a typed output other flows can depend on, and gives you a Switch branch to grow into real remediation (revoking the anyone permission automatically, opening a ticket) without rewriting the audit itself.

    ## Prerequisites

    - A Google OAuth2 access token with at least the `https://www.googleapis.com/auth/drive.readonly` scope (or `drive.metadata.readonly`, which also covers permissions) for the account or service account that can see the tracked report. Data Studio (Looker Studio) itself is free to use with any Google account; no paid Google Cloud tier is required for this read-only scope. There is no self-hostable Docker image for this API, so test it against a real asset you control.
    - The tracked `asset_id` must already exist and be reachable by the account behind the access token.
    - A Slack incoming webhook for the at-risk and unreachable alerts.

    ### Secrets

    - `GOOGLE_DRIVE_ACCESS_TOKEN`: a valid OAuth2 access token with `drive.readonly` scope, sent as the `Authorization: Bearer` header on the permissions.list call.
    - `SLACK_WEBHOOK_URL`: Slack incoming webhook used for the at-risk alert, the unreachable alert, and the flow-failure alert.
    - OSS note: if your Kestra instance reads secrets from environment variables instead of a secrets backend, set `SECRET_GOOGLE_DRIVE_ACCESS_TOKEN` and `SECRET_SLACK_WEBHOOK_URL` as base64, for example `echo -n "<your-access-token>" | base64` and `echo -n "<your-webhook-url>" | base64`.

    ## Quick start

    1. Add the `GOOGLE_DRIVE_ACCESS_TOKEN` and `SLACK_WEBHOOK_URL` secrets.
    2. Set `asset_id` to a Data Studio report or Drive file you control.
    3. Run the flow once and confirm `status` reads `HEALTHY` for an asset scoped to named users.
    4. Switch that asset's sharing to "anyone with the link" and re-run to confirm `status` reads `AT_RISK`.
    5. Enable `datastudio_sharing_gate_schedule`.

    ## How to extend

    - Loop over a list of asset ids with a `Loop` task to audit an entire portfolio of dashboards from one flow.
    - Also flag any `emailAddress` or `domain` outside your organization, not just `type: anyone`.
    - Add a follow-up `io.kestra.plugin.core.http.Request` task calling Drive's `permissions.delete` endpoint to automatically revoke the anyone permission once detected, instead of only alerting.

    ## Links

    - [Google Drive API v3 permissions.list reference](https://developers.google.com/drive/api/reference/rest/v3/permissions/list)
    - [Kestra HTTP Request task](https://kestra.io/plugins/core/tasks/http/io.kestra.plugin.core.http.request)
    - [Kestra Switch task](https://kestra.io/plugins/core/tasks/flow/io.kestra.plugin.core.flow.switch)
  tags:
    - Data
    - Business
  subTags:
    - Monitoring & Alerting
    - Policy & Compliance
  ee: false
  demo: false
