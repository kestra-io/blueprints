id: cassandra-keyspace-durable-writes-guard
namespace: company.team
concurrency:
  limit: 1
  behavior: QUEUE
inputs:
  - id: cassandra_host
    type: STRING
    defaults: localhost
  - id: cassandra_port
    type: INT
    defaults: 9042
  - id: local_datacenter
    type: STRING
    defaults: datacenter1
  - id: cassandra_username
    type: SECRET
    defaults: "{{ secret('CASSANDRA_USERNAME') }}"
  - id: cassandra_password
    type: SECRET
    defaults: "{{ secret('CASSANDRA_PASSWORD') }}"
  - id: keyspace
    type: STRING
    required: true
    description: Exact application keyspace whose policy requires commitlog use.
  - id: anchor_table
    type: STRING
    required: true
  - id: anchor_table_id
    type: STRING
    required: true
    description: Expected UUID from system_schema.tables, checked before and after approval.
  - id: protected_keyspaces
    type: ARRAY
    itemType: STRING
    defaults: [scratch, staging]
  - id: exclusive_schema_writer
    type: BOOL
    defaults: false
    description: Confirm schema changes are excluded for this keyspace through final verification. This flow alone is not a cluster lock.
  - id: dry_run
    type: BOOL
    defaults: true
  - id: auto_remediate
    type: BOOL
    defaults: false
  - id: slack_webhook_url
    type: SECRET
    defaults: "{{ secret('SLACK_WEBHOOK_URL') }}"
tasks:
  - id: valid_scope
    type: io.kestra.plugin.core.execution.Assert
    conditions:
      - "{{ inputs.keyspace | length > 0 and inputs.keyspace | length <= 48 }}"
      - "{{ inputs.keyspace | replace({'[A-Za-z0-9_]': ''}, regexp=true) | length == 0 }}"
      - "{{ inputs.anchor_table | length > 0 and inputs.anchor_table | length <= 222 }}"
      - "{{ inputs.anchor_table | replace({'[A-Za-z0-9_]': ''}, regexp=true) | length == 0 }}"
      - "{{ (inputs.keyspace | lower | replace({'^system': ''}, regexp=true)) == (inputs.keyspace | lower) }}"
      - "{{ inputs.protected_keyspaces | length <= 200 }}"
      - "{{ not (inputs.protected_keyspaces contains inputs.keyspace) }}"
    errorMessage: Invalid, protected or system keyspace. No Cassandra query was issued.
  - id: read_keyspace
    type: io.kestra.plugin.cassandra.standard.Query
    timeout: PT1M
    session:
      endpoints:
        - hostname: "{{ inputs.cassandra_host }}"
          port: "{{ inputs.cassandra_port }}"
      localDatacenter: "{{ inputs.local_datacenter }}"
      username: "{{ inputs.cassandra_username }}"
      password: "{{ inputs.cassandra_password }}"
    cql: "SELECT keyspace_name, durable_writes, replication FROM system_schema.keyspaces WHERE keyspace_name='{{ inputs.keyspace }}'"
    fetchType: FETCH
  - id: read_anchor
    type: io.kestra.plugin.cassandra.standard.Query
    timeout: PT1M
    session:
      endpoints:
        - hostname: "{{ inputs.cassandra_host }}"
          port: "{{ inputs.cassandra_port }}"
      localDatacenter: "{{ inputs.local_datacenter }}"
      username: "{{ inputs.cassandra_username }}"
      password: "{{ inputs.cassandra_password }}"
    cql: "SELECT id FROM system_schema.tables WHERE keyspace_name='{{ inputs.keyspace }}' AND table_name='{{ inputs.anchor_table }}'"
    fetchType: FETCH
  - id: identity
    type: io.kestra.plugin.core.execution.Assert
    conditions:
      - "{{ outputs.read_keyspace.size == 1 and outputs.read_anchor.size == 1 }}"
      - "{{ (outputs.read_anchor.rows[0].id ?? '') == inputs.anchor_table_id }}"
    errorMessage: Keyspace or anchor missing or anchor UUID differs. Inspect the application identity.
  - id: finding
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.read_keyspace.rows[0].durable_writes == false }}"
    then:
      - id: alert
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ inputs.slack_webhook_url }}"
        payload: "{{ {'text': 'Cassandra keyspace ' ~ inputs.keyspace ~ ' has durable_writes=false. Unflushed writes can be lost after a crash. Earlier writes need a separate flush or recovery plan. Execution ' ~ execution.id} | toJson }}"
      - id: mode
        type: io.kestra.plugin.core.flow.If
        condition: "{{ inputs.auto_remediate and not inputs.dry_run }}"
        then:
          - id: exclusive_contract
            type: io.kestra.plugin.core.execution.Assert
            conditions:
              - "{{ inputs.exclusive_schema_writer }}"
            errorMessage: Exclude other schema writers through verification before enabling remediation.
          - id: approval
            type: io.kestra.plugin.core.flow.Pause
            pauseDuration: PT5M
            behavior: FAIL
            description: Approve enabling commitlog for this exact keyspace. Confirm write I/O headroom and the exclusive schema contract. Earlier unlogged mutations are not retroactively protected.
            onResume:
              - id: approved
                type: BOOL
                required: false
          - id: approved_only
            type: io.kestra.plugin.core.flow.If
            condition: "{{ outputs.approval.onResume.approved ?? false }}"
            then:
              - id: fresh_keyspace
                type: io.kestra.plugin.cassandra.standard.Query
                timeout: PT1M
                session:
                  endpoints:
                    - hostname: "{{ inputs.cassandra_host }}"
                      port: "{{ inputs.cassandra_port }}"
                  localDatacenter: "{{ inputs.local_datacenter }}"
                  username: "{{ inputs.cassandra_username }}"
                  password: "{{ inputs.cassandra_password }}"
                cql: "SELECT keyspace_name, durable_writes, replication FROM system_schema.keyspaces WHERE keyspace_name='{{ inputs.keyspace }}'"
                fetchType: FETCH
              - id: fresh_anchor
                type: io.kestra.plugin.cassandra.standard.Query
                timeout: PT1M
                session:
                  endpoints:
                    - hostname: "{{ inputs.cassandra_host }}"
                      port: "{{ inputs.cassandra_port }}"
                  localDatacenter: "{{ inputs.local_datacenter }}"
                  username: "{{ inputs.cassandra_username }}"
                  password: "{{ inputs.cassandra_password }}"
                cql: "SELECT id FROM system_schema.tables WHERE keyspace_name='{{ inputs.keyspace }}' AND table_name='{{ inputs.anchor_table }}'"
                fetchType: FETCH
              - id: fresh_identity
                type: io.kestra.plugin.core.execution.Assert
                conditions:
                  - "{{ outputs.fresh_keyspace.size == 1 and outputs.fresh_anchor.size == 1 }}"
                  - "{{ (outputs.fresh_anchor.rows[0].id ?? '') == inputs.anchor_table_id }}"
                  - "{{ outputs.fresh_keyspace.rows[0].replication == outputs.read_keyspace.rows[0].replication }}"
                errorMessage: Approval is stale. Identity or replication changed. No ALTER was issued.
              - id: still_disabled
                type: io.kestra.plugin.core.flow.If
                condition: "{{ outputs.fresh_keyspace.rows[0].durable_writes == false }}"
                then:
                  - id: enable_commitlog
                    type: io.kestra.plugin.cassandra.standard.Query
                    timeout: PT1M
                    allowFailure: true
                    session:
                      endpoints:
                        - hostname: "{{ inputs.cassandra_host }}"
                          port: "{{ inputs.cassandra_port }}"
                      localDatacenter: "{{ inputs.local_datacenter }}"
                      username: "{{ inputs.cassandra_username }}"
                      password: "{{ inputs.cassandra_password }}"
                    cql: 'ALTER KEYSPACE "{{ inputs.keyspace }}" WITH durable_writes=true'
                    fetchType: NONE
              - id: verify_keyspace
                type: io.kestra.plugin.cassandra.standard.Query
                timeout: PT1M
                session:
                  endpoints:
                    - hostname: "{{ inputs.cassandra_host }}"
                      port: "{{ inputs.cassandra_port }}"
                  localDatacenter: "{{ inputs.local_datacenter }}"
                  username: "{{ inputs.cassandra_username }}"
                  password: "{{ inputs.cassandra_password }}"
                cql: "SELECT keyspace_name, durable_writes, replication FROM system_schema.keyspaces WHERE keyspace_name='{{ inputs.keyspace }}'"
                fetchType: FETCH
              - id: verify_anchor
                type: io.kestra.plugin.cassandra.standard.Query
                timeout: PT1M
                session:
                  endpoints:
                    - hostname: "{{ inputs.cassandra_host }}"
                      port: "{{ inputs.cassandra_port }}"
                  localDatacenter: "{{ inputs.local_datacenter }}"
                  username: "{{ inputs.cassandra_username }}"
                  password: "{{ inputs.cassandra_password }}"
                cql: "SELECT id FROM system_schema.tables WHERE keyspace_name='{{ inputs.keyspace }}' AND table_name='{{ inputs.anchor_table }}'"
                fetchType: FETCH
              - id: recovery_verified
                type: io.kestra.plugin.core.execution.Assert
                conditions:
                  - "{{ outputs.verify_keyspace.size == 1 and outputs.verify_anchor.size == 1 }}"
                  - "{{ outputs.verify_keyspace.rows[0].durable_writes == true }}"
                  - "{{ outputs.verify_keyspace.rows[0].replication == outputs.read_keyspace.rows[0].replication }}"
                  - "{{ (outputs.verify_anchor.rows[0].id ?? '') == inputs.anchor_table_id }}"
                errorMessage: Commitlog setting or protected identity/replication not verified. Read actual state before a new run.
              - id: restored
                type: io.kestra.plugin.core.log.Log
                message: Future writes use the configured commitlog policy. Earlier writes are not retroactively logged. Periodic sync still has a crash window.
            else:
              - id: declined
                type: io.kestra.plugin.core.log.Log
                message: Approval false or omitted. No Cassandra change.
        else:
          - id: dry_report
            type: io.kestra.plugin.core.log.Log
            message: Commitlog disabled on the exact target. Safe mode made no change.
    else:
      - id: healthy
        type: io.kestra.plugin.core.log.Log
        message: Exact application keyspace already uses commitlog. No change or approval needed.
errors:
  - id: failure_alert
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ inputs.slack_webhook_url }}"
    payload: "{{ {'text': 'Cassandra durable writes guard failed, execution ' ~ execution.id ~ '. Inspect identity, permissions and actual keyspace state before retrying.'} | toJson }}"
triggers:
  - id: audit_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    disabled: true
    cron: '0 */6 * * *'
    inputs:
      keyspace: application
      anchor_table: anchor
      anchor_table_id: 00000000-0000-0000-0000-000000000000
      dry_run: true
      auto_remediate: false
      exclusive_schema_writer: false
extend:
  title: Restore Cassandra keyspace commitlog protection
  metaTitle: Cassandra keyspace durable writes guard
  shortDescription: Restore required commitlog use on one application keyspace with UUID-bound approval and unchanged replication.
  metaDescription: Detect disabled Cassandra keyspace commitlog use, approve a narrow repair and verify durable writes without changing replication.
  tags: [Data, Infrastructure]
  subTags: [Day 2 Operations, Monitoring & Alerting]
  ee: false
  demo: false
  description: |
    ## Safety

    A keyspace left with `durable_writes=false` accepts updates without commitlog protection. Unflushed data can disappear after a crash. Enabling it affects future mutations, not earlier unlogged writes. Keep a separate flush or recovery plan for that window.

    | Guard | What it stops |
    | --- | --- |
    | Exact keyspace, protected list and system-name refusal | Changing a disposable or internal namespace |
    | Anchor table UUID | Reusing approval after the application table is recreated |
    | Fresh replication check | Acting on a schema policy that changed during approval |
    | Read-only defaults and explicit approval | Accidental changes |
    | True-only property ALTER | Disabling logging or overwriting replication |

    ## How it works

    1. `valid_scope` checks identifiers and exclusions: keyspace length 1-48, table length 1-222 and at most 200 protected names.
    2. Native `cassandra.standard.Query` reads one keyspace and anchor UUID. Missing objects or an unexpected UUID fail. True takes the healthy path.
    3. False alerts Slack. Remediation requires `auto_remediate=true`, `dry_run=false` and `exclusive_schema_writer=true`. The five-minute Pause requires `approved=true`; false or omitted approval changes nothing.
    4. Fresh reads reject changed replication or anchor identity. Already enabled skips the write. Otherwise one `ALTER KEYSPACE ... WITH durable_writes=true` runs without a replication clause.
    5. Readback requires true plus original replication and UUID. Refused writes still reach verification, which fails if recovery is absent. Queries have one-minute timeouts and no blanket retries.

    ## What you get

    Repair with alerts. Application rows are untouched. A disabled six-hour schedule pins safe mode.

    ## Who it's for

    Cassandra operators whose bulk ingest left an application keyspace outside the commitlog path.

    ## Why orchestrate this with Kestra

    A finding, named approval and readback share one execution. A new run reconciles interruptions. QUEUE1 serializes this flow only, not other schema writers.

    ## Tested end to end

    Cassandra 5.0.9 with batch commitlog sync, Kestra 2.0.6 and 2.0.5. Before repair, SIGKILL reduced 100 acknowledged target rows to 0 while a logged control retained all 100. After native repair, 100 new target rows and their 1,000 payload bytes survived another SIGKILL. Replication and anchor UUID were conserved. These are process-crash results, not power-loss guarantees.

    Real cases cover safe modes, repair, refused writes, repeats, stale replication, recreated anchors, queued executions and interrupted-pass retry. Legal name ceilings and hostile names were checked. Second-fixture reproduction is saved locally.

    ## Prerequisites

    Native CQL login and ALTER on the exact keyspace; schema reads use Cassandra's system-schema access. Exclude other schema writers through verification. Configure session TLS when required.

    ### Secrets

    `CASSANDRA_USERNAME`, `CASSANDRA_PASSWORD` and `SLACK_WEBHOOK_URL`. Connection credentials and webhook overrides are SECRET inputs.

    ### Inputs

    Set contact point, port and datacenter. Supply `keyspace`, `anchor_table` and `anchor_table_id` from `system_schema.tables`. Review protected names. Writer confirmation defaults false, dry run true and remediation false.

    ## Quick start

    1. Add secrets and name the exact application identity. Run the default audit.
    2. Review the unlogged window and write I/O headroom. Exclude schema writers, enable remediation and explicitly approve.
    3. Confirm readback, then release the schema exclusion. Configure the schedule's identity before enabling it.

    ## How to extend

    Add schema-agreement monitoring. Coordinate a separate flush or restore for earlier unlogged mutations.

    Limits: no conditional ALTER or keyspace generation UUID. A non-cooperating drop/recreate after the last read bypasses anchor protection. The property-only write preserves replication at application time; other writers can change it afterward. Periodic sync retains a crash window. The flow verifies configuration; isolated crash tests prove only the stated batch-sync outcome.

    ## Links

    - [Cassandra DDL](https://cassandra.apache.org/doc/5.0/cassandra/developing/cql/ddl.html)
    - [Cassandra storage engine](https://cassandra.apache.org/doc/5.0/cassandra/architecture/storage-engine.html)
    - [Cassandra Query](https://kestra.io/plugins/plugin-cassandra/tasks/standard/io.kestra.plugin.cassandra.standard.query)

