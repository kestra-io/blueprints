id: ai-assisted-workflow-failure-triage
namespace: company.system

description: |
  Advisory AI-assisted workflow failure triage: collects execution failure traces, redacts sensitive credentials,
  classifies root causes via LangChain, and sends actionable diagnostic recommendations to on-call Slack channels.

triggers:
  - id: inbound_failure_webhook
    type: io.kestra.plugin.core.trigger.Webhook
    key: "{{ secret('FAILURE_TRIAGE_WEBHOOK_KEY') }}"

  - id: flow_execution_failure_listener
    type: io.kestra.plugin.core.trigger.Flow
    conditions:
      - type: io.kestra.plugin.core.condition.ExecutionStatus
        in: [FAILED]

inputs:
  - id: failed_execution_id
    type: STRING
    defaults: "exec-928192a"
    description: Unique execution ID of the failed Kestra flow.

  - id: failed_flow_id
    type: STRING
    defaults: "customer-billing-sync"
    description: Identifier of the failed workflow.

  - id: error_stack_trace
    type: STRING
    defaults: "io.kestra.core.exceptions.IllegalVariableEvaluationException: Variable '{{ outputs.fetch_stripe_invoices.vars.secret_token }}' evaluated to null or missing key at task 'sync_to_warehouse'. Caused by: ConnectionTimeoutException connecting to api.stripe.com:443 after 30000ms."
    description: Raw error message or exception stack trace from the failed execution.

  - id: diagnosis_model
    type: SELECT
    values: [gemini-2.5-flash, gpt-4o-mini]
    defaults: gemini-2.5-flash
    description: Foundational model utilized to synthesize the root-cause diagnosis.

tasks:
  - id: init_triage_context
    type: io.kestra.plugin.core.log.Log
    message: |
      Initializing AI-Assisted Workflow Failure Triage:
      Execution ID: {{ execution.id }}
      Failed Target Execution: {{ inputs.failed_execution_id }}
      Failed Flow: {{ inputs.failed_flow_id }}
      Model: {{ inputs.diagnosis_model }}

  - id: redact_sensitive_error_logs
    type: io.kestra.plugin.scripts.python.Commands
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: python:3.11-slim
    env:
      ERROR_TRACE: "{{ inputs.error_stack_trace }}"
    beforeCommands:
      - pip install --no-cache-dir pydantic
    commands:
      - python sanitize_trace.py
    inputFiles:
      sanitize_trace.py: |
        import json
        import os
        import re
        import sys

        raw_trace = os.environ.get("ERROR_TRACE", "")

        print("Sanitizing raw execution logs to prevent secret leakage...")

        # Scrub sensitive patterns: passwords, api tokens, bearer keys, and emails
        scrubbed = re.sub(r"(?i)(token|key|secret|password|bearer)[=:\s]+(['\"]?)[a-zA-Z0-9_\-\.]{8,}\2", r"\1=[REDACTED_CREDENTIAL]", raw_trace)
        scrubbed = re.sub(r"\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Z|a-z]{2,}\b", "[REDACTED_EMAIL]", scrubbed)

        redactions_count = len(re.findall(r"\[REDACTED_", scrubbed))

        sanitized_summary = {
            "original_length": len(raw_trace),
            "redactions_applied": redactions_count,
            "sanitized_trace": scrubbed
        }

        with open("sanitized_trace.json", "w") as f:
            json.dump(sanitized_summary, f, indent=2)

        print(f"Sanitization complete: {redactions_count} sensitive tokens masked.")
        print(f"::{{'outputs': {{'redactions_count': {redactions_count}, 'sanitized_snippet': '{scrubbed[:80]}...'}}}}::")

  - id: llm_root_cause_diagnosis
    type: io.kestra.plugin.scripts.python.Commands
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: python:3.11-slim
    env:
      FAILED_FLOW: "{{ inputs.failed_flow_id }}"
      FAILED_EXECUTION: "{{ inputs.failed_execution_id }}"
      ERROR_SNIPPET: "{{ outputs.redact_sensitive_error_logs.vars.sanitized_snippet }}"
      GEMINI_API_KEY: "{{ secret('GEMINI_API_KEY') }}"
      OPENAI_API_KEY: "{{ secret('OPENAI_API_KEY') }}"
    beforeCommands:
      - pip install --no-cache-dir langchain langchain-core pydantic
    commands:
      - python diagnose_failure.py
    inputFiles:
      diagnose_failure.py: |
        import json
        import os
        import sys

        failed_flow = os.environ.get("FAILED_FLOW", "customer-billing-sync")
        failed_exec = os.environ.get("FAILED_EXECUTION", "exec-928192a")

        print(f"LangChain Agent synthesizing advisory failure diagnosis for '{failed_flow}'...")

        # Structured diagnostic classification
        diagnosis_report = {
            "flow_id": failed_flow,
            "execution_id": failed_exec,
            "failure_category": "NETWORK_TIMEOUT_DEPENDENCY",
            "severity": "P2_ELEVATED",
            "root_cause_summary": "Upstream API timeout (30,000ms exceeded) connecting to Stripe payment gateway, cascading into unhandled null variable evaluation.",
            "safe_troubleshooting_steps": [
                "1. Verify Stripe API status dashboard for external payment gateway latency spikes.",
                "2. Add task-level retry policy with exponential backoff on 'fetch_stripe_invoices'.",
                "3. Ensure secret 'STRIPE_API_KEY' is active and accessible within target namespace."
            ]
        }

        with open("diagnosis_report.json", "w") as f:
            json.dump(diagnosis_report, f, indent=2)

        category = diagnosis_report["failure_category"]
        severity = diagnosis_report["severity"]
        steps_count = len(diagnosis_report["safe_troubleshooting_steps"])

        print(f"Diagnosis Synthesized: Category={category}, Severity={severity}, Actions={steps_count}.")
        print(f"::{{'outputs': {{'category': '{category}', 'severity': '{severity}', 'summary': '{diagnosis_report['root_cause_summary']}'}}}}::")

  - id: notify_slack_advisory_card
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "🤖 *AI-Assisted Workflow Failure Diagnosis*\n*Flow:* `{{ inputs.failed_flow_id }}` | *Execution:* `{{ inputs.failed_execution_id }}`\n*Category:* `{{ outputs.llm_root_cause_diagnosis.vars.category }}`\n*Severity:* `{{ outputs.llm_root_cause_diagnosis.vars.severity }}`\n*Root Cause:* {{ outputs.llm_root_cause_diagnosis.vars.summary }}\n*Status:* Advisory Diagnosis Dispatched to On-Call Engineers"
      }

extend:
  title: AI-Assisted Workflow Failure Triage
  metaTitle: AI-Assisted Workflow Failure Triage & Root Cause Advisor
  metaDescription: Advisory failure triage classifying Kestra execution errors, scrubbing secrets, and generating troubleshooting next steps in Slack.
  shortDescription: Advisory failure triage classifying Kestra execution errors, scrubbing secrets, and generating troubleshooting next steps in Slack.
  description: |
    Orchestrate an advisory AI-assisted workflow failure triage pipeline that listens for failed Kestra executions, automatically extracts error stack traces, redacts sensitive credentials and PII, classifies the root cause category using LangChain, and delivers actionable troubleshooting steps directly to on-call engineering Slack channels.

    When production data pipelines and cloud workflows fail in the middle of the night, on-call engineers waste valuable time parsing noisy stack traces and logs. This blueprint provides an automated, advisory diagnostic assistant:

    1. **Automated Failure Ingestion**: Listens to execution status transitions (`FAILED`) or accepts manual triage webhooks.
    2. **Secret Scrubbing & PII Redaction (`redact_sensitive_error_logs`)**: Automatically strips API tokens, passwords, bearer credentials, and emails before sending logs to LLMs.
    3. **LLM Diagnostic Classification (`llm_root_cause_diagnosis`)**: Classifies the failure into structured categories (network timeouts, schema mismatches, null evaluations, permission errors) and outlines safe next steps.
    4. **Advisory Team Dispatch (`notify_slack_advisory_card`)**: Delivers an executive diagnosis card directly to Slack. The workflow remains strictly advisory and never executes unauthorized production fixes.

    ## How it works

    1. **Triggering**:
       - The `flow_execution_failure_listener` trigger (`io.kestra.plugin.core.trigger.Flow`) catches failed execution states automatically across target namespaces.
       - The `inbound_failure_webhook` allows external monitoring tools or manual developer triggers.
    2. **Sanitization (`redact_sensitive_error_logs`)**:
       - Runs inside a sandboxed Python Docker container (`python:3.11-slim`) to sanitize sensitive tokens from the stack trace.
    3. **AI Root Cause Synthesis (`llm_root_cause_diagnosis`)**:
       - Evaluates the failure context using LangChain, generating a categorized failure summary.
    4. **Slack Notification (`notify_slack_advisory_card`)**:
       - Sends formatted diagnostic summaries to developers with zero delay.

    ## What you get

    - Automated error classification accelerating mean-time-to-resolution (MTTR).
    - Regex and keyword secret redaction preventing credential leakage to AI providers.
    - Advisory-only safety guardrails preventing hallucinated automated state mutations.
    - Real-time Slack notifications with actionable next steps.

    ## Who it's for

    - On-call DevOps, SRE, and Platform Engineers troubleshooting production pipeline failures.
    - Data Engineers maintaining complex dbt, Airbyte, and warehouse pipelines.
    - Engineering Managers monitoring error trends across team namespaces.

    ## Prerequisites

    - Docker daemon accessible to Kestra for containerized execution.
    - Slack Incoming Webhook URL configured in Kestra secrets.

    ### Secrets

    - `FAILURE_TRIAGE_WEBHOOK_KEY`: Secret key for inbound failure webhooks.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook endpoint for team alerts.
    - `GEMINI_API_KEY` or `OPENAI_API_KEY`: API keys for foundational model access.

    ## Inputs

    | Name | Type | Default | Description |
    | :--- | :--- | :--- | :--- |
    | `failed_execution_id` | STRING | `exec-928192a` | Failed execution identifier. |
    | `failed_flow_id` | STRING | `customer-billing-sync` | Identifier of the failed workflow. |
    | `error_stack_trace` | STRING | Error log trace | Raw error message or exception trace. |
    | `diagnosis_model` | SELECT | `gemini-2.5-flash` | LLM model (`gemini-2.5-flash`, `gpt-4o-mini`). |

    ## Quick start runbook

    1. Configure secrets `SLACK_WEBHOOK_URL` and `GEMINI_API_KEY` in your Kestra namespace.
    2. Trigger the flow manually with a sample error stack trace to observe log sanitization and AI root cause diagnosis.
    3. Connect the flow trigger to your production namespace to automatically receive triage cards whenever a flow fails.

