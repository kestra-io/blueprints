id: internet-archive-save-page
namespace: company.team
description: |
  Trigger an Internet Archive Wayback Machine snapshot of a URL right after a
  deploy, and verify the snapshot landed — a durable receipt for what you shipped.

triggers:
  - id: deploy_webhook
    type: io.kestra.plugin.core.trigger.Webhook
    description: Call from the deploy pipeline so every release gets archived automatically.
    key: archive-page
  - id: weekly_snapshot
    type: io.kestra.plugin.core.trigger.Schedule
    description: Optional weekly snapshot to track drift over time; shipped disabled.
    cron: "0 5 * * 0"
    disabled: true

inputs:
  - id: url
    type: STRING
    defaults: https://example.com
    description: Page to archive.
  - id: wait
    type: STRING
    defaults: 30
    description: Seconds to wait before verifying the snapshot exists.

tasks:
  - id: save_page
    type: io.kestra.plugin.scripts.python.Script
    description: POST to the Wayback Machine's save endpoint, then poll until the snapshot URL appears.
    containerImage: python:3.11-slim
    warningOnStdErr: false
    env:
      URL: "{{ inputs.url }}"
      WAIT: "{{ inputs.wait }}"
    script: |
      import json, os, time, urllib.request, urllib.parse

      target = os.environ["URL"]
      save_url = "https://web.archive.org/save/" + target
      snapshot_url = ""
      try:
          req = urllib.request.Request(save_url, method="GET", headers={"User-Agent": "kestra-archive-blueprint"})
          with urllib.request.urlopen(req, timeout=60) as r:
              snapshot_url = r.geturl()
      except Exception as e:
          print(f"save request note: {e}")
      time.sleep(int(os.environ["WAIT"]))
      check = "https://archive.org/wayback/available?url=" + urllib.parse.quote(target, safe="")
      try:
          with urllib.request.urlopen(check, timeout=30) as r:
              data = json.loads(r.read())
          closest = data.get("archived_snapshots", {}).get("closest", {})
          snapshot_url = closest.get("url", snapshot_url)
          available = bool(closest.get("available"))
      except Exception:
          available = False
      print(f"snapshot available: {available} -> {snapshot_url}")
      print("::" + json.dumps({"outputs": {"available": available, "snapshot_url": snapshot_url}}) + "::")

  - id: verify_snapshot
    type: io.kestra.plugin.core.flow.If
    description: Branch on whether the archive confirmed the snapshot — a silent archiving failure must not look like "archived".
    condition: "{{ outputs.save_page.vars.available }}"
    then:
      - id: log_snapshot
        type: io.kestra.plugin.core.log.Log
        description: Record the snapshot URL in the execution log as the permanent receipt.
        message: "Archived {{ inputs.url }} at {{ outputs.save_page.vars.snapshot_url }}"
    else:
      - id: alert_no_snapshot
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Alert when archiving did not confirm, so the gap is visible instead of assumed.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": ":warning: Wayback Machine snapshot of {{ inputs.url }} did NOT confirm within {{ inputs.wait }}s. The archive may be delayed — re-check later. Execution {{ execution.id }}."
          }

errors:
  - id: alert_archive_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alert when the archive request itself errors — no receipt must never look like a archived page.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "Archive-page FAILED in flow {{ flow.id }} (execution {{ execution.id }}) for {{ inputs.url }}. Check outbound access to web.archive.org."
      }

outputs:
  - id: archive_result
    type: JSON
    description: 'Whether the snapshot confirmed and its URL, e.g. {"available": true, "snapshot_url": "https://web.archive.org/..."}.'
    value: "{{ outputs.save_page.vars | toJson }}"

extend:
  title: Snapshot Pages to the Wayback Machine After Deploy
  shortDescription: Triggers a Wayback Machine save of a URL, verifies the snapshot landed, and alerts on failure.
  metaTitle: Wayback Machine Page Archiver
  metaDescription: Auto-archive pages to the Internet Archive after deploys and alert Slack when the snapshot does not confirm.
  description: |
    Marketing ships a page, the legal team asks "what exactly did the terms page say in March?", and nobody knows. This blueprint saves a Wayback Machine snapshot of your URL on deploy, waits, verifies the archive confirmed it, and alerts only when it did not.

    ## How it works

    1. `save_page` (`io.kestra.plugin.scripts.python.Script`) hits the Wayback Machine's save endpoint, waits `wait` seconds, then polls the availability API; it emits `available` and `snapshot_url` via the `::{"outputs": ...}::` protocol.
    2. `verify_snapshot` (`io.kestra.plugin.core.flow.If`) branches: confirmed → `log_snapshot` records the receipt URL; not confirmed → `alert_no_snapshot` says so in Slack.
    3. The `errors` block alerts Slack when the request itself fails.
    4. Triggers: a `Webhook` (`archive-page`) for the deploy pipeline plus a disabled weekly `Schedule` for drift history.

    ## What you get

    - A durable, dated public archive of what you shipped.
    - Visible failure when archiving does not confirm — no silent gaps.
    - An `archive_result` JSON output for audit logs or compliance trails.

    ## Who it's for

    - Teams with compliance or "what did the page say" obligations.
    - Docs and marketing teams who want automatic publication history.
    - Anyone tired of screenshotting pages by hand.

    ## Why orchestrate this with Kestra

    The Wayback save endpoint is one URL, but the verification poll, the branch, the alert, and the receipt logging are exactly the glue Kestra is for — and it is one <flow> away from your deploy pipeline.

    ## Prerequisites

    - Outbound HTTPS to web.archive.org and archive.org from the Worker.
    - A Slack webhook.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: webhook for the no-snapshot and failure alerts.

    ## Quick start

    1. Add the Slack webhook secret.
    2. Set `url` and give `wait` 30 seconds on first try.
    3. Run once and check `archive_result`.
    4. Wire the `archive-page` webhook into your deploy.

    ## How to extend

    - Archive a sitemap's URLs with a `ForEach`.
    - Store `snapshot_url` in KV keyed by version.
    - Add a change-detection step before archiving to skip identical pages.

    ## Links

    - [Wayback Machine save page](https://help.archive.org/help/wayback-machine/wayback-machine-save-page)
    - [Availability API](https://archive.org/wayback/available)
  tags:
    - Infrastructure
    - Archiving
  subTags:
    - Deployment
    - Compliance
  ee: false
  demo: false
