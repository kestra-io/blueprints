id: duckdb-outage-interval-union
namespace: company.data
inputs:
- id: incidents
  type: FILE
  description: CSV with incident_id, service_id, started_at, ended_at. An empty ended_at means the incident remains open.
- id: services
  type: JSON
  defaults:
  - api
  description: Explicit array of 1-100 service IDs, including services with no incidents.
- id: window_start
  type: STRING
  description: 'Inclusive window start: ISO 8601 with seconds, UTC Z or explicit offset, at most six fractional digits.'
- id: window_end
  type: STRING
  description: Exclusive window end in the same format. Window length must be positive and at most 366 days.
tasks:
- id: source_size
  type: io.kestra.plugin.core.storage.Size
  uri: '{{ inputs.incidents }}'
- id: bound_source
  type: io.kestra.plugin.core.execution.Assert
  conditions:
  - '{{ outputs.source_size.size > 0 and outputs.source_size.size <= 10485760 }}'
- id: configure
  type: io.kestra.plugin.jdbc.duckdb.Queries
  timeZoneId: UTC
  parameters:
    services: '{{ inputs.services | toJson }}'
    window_start: '{{ inputs.window_start }}'
    window_end: '{{ inputs.window_end }}'
  outputFiles:
  - settings.parquet
  - services.parquet
  sql: |
    CREATE TABLE checks (ok BOOLEAN NOT NULL CHECK (ok));
    INSERT INTO checks VALUES (json_type(CAST(:services AS JSON)) = 'ARRAY');
    INSERT INTO checks VALUES
      (regexp_full_match(:window_start, '[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,6})?(Z|[+-]([01][0-9]|2[0-3]):[0-5][0-9])')),
      (regexp_full_match(:window_end, '[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,6})?(Z|[+-]([01][0-9]|2[0-3]):[0-5][0-9])'));
    CREATE TABLE settings (
      window_start TIMESTAMPTZ NOT NULL,
      window_end TIMESTAMPTZ NOT NULL,
      CHECK (window_end > window_start),
      CHECK (epoch_us(window_end) - epoch_us(window_start) <= 31622400000000)
    );
    INSERT INTO settings VALUES (CAST(:window_start AS TIMESTAMPTZ), CAST(:window_end AS TIMESTAMPTZ));
    CREATE TABLE services (
      service_id VARCHAR PRIMARY KEY CHECK (length(trim(service_id)) BETWEEN 1 AND 128),
      kind VARCHAR NOT NULL CHECK (kind = 'VARCHAR')
    );
    INSERT INTO services SELECT json_extract_string(value, '$'), type FROM json_each(CAST(:services AS JSON));
    INSERT INTO checks SELECT count(*) BETWEEN 1 AND 100 FROM services;
    COPY settings TO '{{ outputFiles['settings.parquet'] }}' (FORMAT PARQUET);
    COPY services TO '{{ outputFiles['services.parquet'] }}' (FORMAT PARQUET);
- id: validate_incidents
  type: io.kestra.plugin.jdbc.duckdb.Queries
  timeZoneId: UTC
  inputFiles:
    incidents.csv: '{{ inputs.incidents }}'
    settings.parquet: '{{ outputs.configure.outputFiles[''settings.parquet''] }}'
    services.parquet: '{{ outputs.configure.outputFiles[''services.parquet''] }}'
  outputFiles:
  - incidents.parquet
  sql: |
    CREATE TABLE checks (ok BOOLEAN NOT NULL CHECK (ok));
    CREATE TABLE settings AS SELECT * FROM read_parquet('{{ workingDir }}/settings.parquet');
    CREATE TABLE services AS SELECT * FROM read_parquet('{{ workingDir }}/services.parquet');
    CREATE TABLE raw AS SELECT incident_id, service_id, started_at, ended_at
      FROM read_csv('{{ workingDir }}/incidents.csv', header = true, all_varchar = true, strict_mode = true);
    INSERT INTO checks SELECT count(*) <= 100000 FROM raw;
    INSERT INTO checks SELECT regexp_full_match(started_at, '[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,6})?(Z|[+-]([01][0-9]|2[0-3]):[0-5][0-9])')
      AND (ended_at IS NULL OR regexp_full_match(ended_at, '[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,6})?(Z|[+-]([01][0-9]|2[0-3]):[0-5][0-9])')) FROM raw;
    CREATE TABLE incidents (
      incident_id VARCHAR PRIMARY KEY CHECK (length(trim(incident_id)) BETWEEN 1 AND 128),
      service_id VARCHAR NOT NULL,
      started_at TIMESTAMPTZ NOT NULL,
      ended_at TIMESTAMPTZ,
      CHECK (ended_at IS NULL OR ended_at > started_at)
    );
    INSERT INTO incidents SELECT incident_id, service_id,
      CAST(started_at AS TIMESTAMPTZ), CAST(ended_at AS TIMESTAMPTZ) FROM raw;
    INSERT INTO checks SELECT count(*) = 0 FROM incidents WHERE service_id NOT IN (SELECT service_id FROM services);
    COPY (
      SELECT i.*, greatest(started_at, window_start) AS clipped_start,
        least(COALESCE(ended_at, window_end), window_end) AS clipped_end,
        greatest(started_at, window_start) < least(COALESCE(ended_at, window_end), window_end) AS overlaps_window,
        ended_at IS NULL AS was_open
      FROM incidents i CROSS JOIN settings
    ) TO '{{ outputFiles['incidents.parquet'] }}' (FORMAT PARQUET);
- id: merge_outages
  type: io.kestra.plugin.jdbc.duckdb.Queries
  timeZoneId: UTC
  description: Compare each start with the maximum of all preceding ends, so nested and touching incidents stay in the same
    union interval.
  inputFiles:
    incidents.parquet: '{{ outputs.validate_incidents.outputFiles[''incidents.parquet''] }}'
  outputFiles:
  - downtime-windows.parquet
  sql: |
    CREATE TABLE ordered AS
    SELECT *, max(clipped_end) OVER (
      PARTITION BY service_id ORDER BY clipped_start, clipped_end, incident_id
      ROWS BETWEEN UNBOUNDED PRECEDING AND 1 PRECEDING
    ) AS previous_max_end
    FROM read_parquet('{{ workingDir }}/incidents.parquet') WHERE overlaps_window;
    CREATE TABLE grouped AS
    SELECT *, sum(CASE WHEN previous_max_end IS NULL OR clipped_start > previous_max_end THEN 1 ELSE 0 END)
      OVER (PARTITION BY service_id ORDER BY clipped_start, clipped_end, incident_id ROWS UNBOUNDED PRECEDING) AS island
    FROM ordered;
    COPY (
      SELECT service_id, min(clipped_start) AS started_at, max(clipped_end) AS ended_at,
        epoch_us(max(clipped_end)) - epoch_us(min(clipped_start)) AS downtime_us,
        count(*) AS contributing_incidents
      FROM grouped GROUP BY service_id, island ORDER BY service_id, started_at
    ) TO '{{ outputFiles['downtime-windows.parquet'] }}' (FORMAT PARQUET);
- id: export_reports
  type: io.kestra.plugin.core.flow.Parallel
  tasks:
  - id: availability_report
    type: io.kestra.plugin.jdbc.duckdb.Queries
    timeZoneId: UTC
    inputFiles:
      windows.parquet: '{{ outputs.merge_outages.outputFiles[''downtime-windows.parquet''] }}'
      settings.parquet: '{{ outputs.configure.outputFiles[''settings.parquet''] }}'
      services.parquet: '{{ outputs.configure.outputFiles[''services.parquet''] }}'
    outputFiles:
    - availability.csv
    sql: |
      CREATE TABLE totals AS SELECT service_id, sum(downtime_us) AS downtime_us,
        count(*) AS merged_windows, sum(contributing_incidents) AS incident_count
        FROM read_parquet('{{ workingDir }}/windows.parquet') GROUP BY service_id;
      COPY (
        SELECT s.service_id, cfg.window_start, cfg.window_end,
          epoch_us(cfg.window_end) - epoch_us(cfg.window_start) AS window_us,
          CAST(COALESCE(t.downtime_us, 0) AS BIGINT) AS downtime_us,
          window_us - CAST(COALESCE(t.downtime_us, 0) AS BIGINT) AS available_us,
          CAST(round(100.0 * available_us / window_us, 6) AS DECIMAL(9,6)) AS recorded_availability_percent,
          COALESCE(t.merged_windows, 0) AS merged_windows,
          COALESCE(t.incident_count, 0) AS incident_count
        FROM read_parquet('{{ workingDir }}/services.parquet') s
        CROSS JOIN read_parquet('{{ workingDir }}/settings.parquet') cfg
        LEFT JOIN totals t ON t.service_id = s.service_id ORDER BY s.service_id
      ) TO '{{ outputFiles['availability.csv'] }}' (FORMAT CSV, HEADER true);
  - id: incident_audit
    type: io.kestra.plugin.jdbc.duckdb.Queries
    timeZoneId: UTC
    inputFiles:
      incidents.parquet: '{{ outputs.validate_incidents.outputFiles[''incidents.parquet''] }}'
    outputFiles:
    - incident-audit.csv
    sql: |
      COPY (
        SELECT incident_id, service_id, started_at, ended_at, was_open,
          CASE WHEN overlaps_window THEN clipped_start END AS counted_start,
          CASE WHEN overlaps_window THEN clipped_end END AS counted_end,
          CASE WHEN NOT overlaps_window THEN 'OUTSIDE_WINDOW'
            WHEN was_open THEN 'OPEN_UNTIL_WINDOW_END'
            WHEN started_at <> clipped_start OR ended_at <> clipped_end THEN 'CLIPPED'
            ELSE 'IN_WINDOW' END AS treatment
        FROM read_parquet('{{ workingDir }}/incidents.parquet') ORDER BY service_id, incident_id
      ) TO '{{ outputFiles['incident-audit.csv'] }}' (FORMAT CSV, HEADER true);
- id: verify_artifacts
  type: io.kestra.plugin.jdbc.duckdb.Query
  timeZoneId: UTC
  fetchType: FETCH_ONE
  inputFiles:
    windows.parquet: '{{ outputs.merge_outages.outputFiles[''downtime-windows.parquet''] }}'
    availability.csv: '{{ outputs.availability_report.outputFiles[''availability.csv''] }}'
    audit.csv: '{{ outputs.incident_audit.outputFiles[''incident-audit.csv''] }}'
    incidents.parquet: '{{ outputs.validate_incidents.outputFiles[''incidents.parquet''] }}'
    services.parquet: '{{ outputs.configure.outputFiles[''services.parquet''] }}'
    settings.parquet: '{{ outputs.configure.outputFiles[''settings.parquet''] }}'
  sql: |
    WITH windows AS (SELECT * FROM read_parquet('{{ workingDir }}/windows.parquet')),
    availability AS (SELECT * FROM read_csv('{{ workingDir }}/availability.csv', header = true)),
    services AS (SELECT * FROM read_parquet('{{ workingDir }}/services.parquet')),
    settings AS (SELECT * FROM read_parquet('{{ workingDir }}/settings.parquet')),
    totals AS (SELECT service_id, sum(downtime_us) AS downtime_us, count(*) AS merged_windows,
      sum(contributing_incidents) AS incident_count FROM windows GROUP BY service_id),
    neighbors AS (SELECT *, lag(ended_at) OVER (PARTITION BY service_id ORDER BY started_at) AS previous_end FROM windows)
    SELECT
      (SELECT count(*) FROM availability) = (SELECT count(*) FROM services)
      AND (SELECT count(DISTINCT service_id) FROM availability) = (SELECT count(*) FROM services)
      AND NOT EXISTS (SELECT 1 FROM availability WHERE service_id NOT IN (SELECT service_id FROM services))
      AND NOT EXISTS (SELECT 1 FROM neighbors CROSS JOIN settings
        WHERE started_at < window_start OR ended_at > window_end OR ended_at <= started_at
          OR started_at <= previous_end OR downtime_us <> epoch_us(ended_at) - epoch_us(started_at))
      AND NOT EXISTS (SELECT 1 FROM availability a CROSS JOIN settings c LEFT JOIN totals t ON a.service_id = t.service_id
        WHERE a.window_us <> epoch_us(c.window_end) - epoch_us(c.window_start)
          OR a.downtime_us <> COALESCE(t.downtime_us, 0) OR a.available_us + a.downtime_us <> a.window_us
          OR a.downtime_us < 0 OR a.available_us < 0
          OR a.merged_windows <> COALESCE(t.merged_windows, 0) OR a.incident_count <> COALESCE(t.incident_count, 0))
      AND NOT EXISTS (SELECT 1 FROM availability a LEFT JOIN (
        SELECT service_id, count(*) AS n FROM read_parquet('{{ workingDir }}/incidents.parquet')
        WHERE overlaps_window GROUP BY service_id
      ) i ON a.service_id = i.service_id WHERE a.incident_count <> COALESCE(i.n, 0))
      AND (SELECT count(*) FROM read_csv('{{ workingDir }}/audit.csv', header = true, all_varchar = true))
        = (SELECT count(*) FROM read_parquet('{{ workingDir }}/incidents.parquet')) AS valid;
- id: verification
  type: io.kestra.plugin.core.execution.Assert
  conditions:
  - '{{ outputs.verify_artifacts.row.valid }}'
outputs:
- id: availability
  type: FILE
  required: false
  value: '{{ (outputs.verify_artifacts.row.valid ?? false) ? outputs.availability_report.outputFiles[''availability.csv'']
    : null }}'
- id: downtime_windows
  type: FILE
  required: false
  value: '{{ (outputs.verify_artifacts.row.valid ?? false) ? outputs.merge_outages.outputFiles[''downtime-windows.parquet'']
    : null }}'
- id: incident_audit
  type: FILE
  required: false
  value: '{{ (outputs.verify_artifacts.row.valid ?? false) ? outputs.incident_audit.outputFiles[''incident-audit.csv''] :
    null }}'
triggers:
- id: incident_export_ready
  type: io.kestra.plugin.core.trigger.Webhook
  key: '{{ secret(''OUTAGE_WEBHOOK_KEY'') }}'
  inputs:
    incidents: '{{ trigger.body.incidents }}'
    services: '{{ trigger.body.services }}'
    window_start: '{{ trigger.body.window_start }}'
    window_end: '{{ trigger.body.window_end }}'
extend:
  title: Calculate recorded downtime without double-counting overlapping incidents
  metaTitle: DuckDB Outage Interval Union and Availability | Kestra
  shortDescription: Clip incident windows, merge overlapping outages per service and export recorded availability with an
    incident audit using native DuckDB tasks.
  metaDescription: Merge nested and overlapping service outages with DuckDB, clip reporting windows and export availability,
    downtime Parquet and incident audit CSV.
  description: |
    Adding incident durations can count the same outage twice. This flow computes the union of recorded outage intervals for each service and reporting window, including nested incidents and open outages.

    ## How it works

    1. Upload an incident CSV or submit its Kestra storage URI to the keyed webhook. Provide an explicit service list and half-open reporting window `[window_start, window_end)`.
    2. Native DuckDB tasks validate IDs and timestamps, bound the source to 10 MiB/100,000 incidents, and save normalized Parquet. Windows may span at most 366 days across 1-100 services.
    3. Clip intervals to the window. An empty `ended_at` extends an open incident to the window end; nonoverlapping incidents remain in the audit.
    4. Merge overlaps and touching intervals per service using the running maximum of all earlier ends, rather than just the previous row. Export reports in parallel, reopen the artifacts and assert count, boundary, disjointness and duration invariants.

    ## What you get

    - Availability CSV with exact integer microsecond durations, rounded availability percentages and incident/merged-window counts.
    - Disjoint downtime Parquet and one audit row per source incident, showing clipping, exclusion and open-incident treatment.
    - Explicit services with no incidents remain in the report. A header-only CSV is supported.

    ## Who it's for

    SRE and platform teams reconciling incident exports or preparing availability reports.

    ## Why orchestrate this with Kestra

    Validation, interval merging, parallel exports and verification are separate native tasks. Storage checkpoints make the calculation inspectable and reusable without Python scripts or a Docker task runner.

    ## Prerequisites

    Install the DuckDB JDBC plugin. CSV columns are `incident_id,service_id,started_at,ended_at`. IDs must be unique and services must be listed. Timestamps need `T`, seconds, `Z` or an explicit offset, and at most six fractional digits. Closed incidents must end after they start. Fractions beyond microseconds and timezone-naive timestamps are rejected.

    ### Secrets

    - `OUTAGE_WEBHOOK_KEY`: protects export submissions.

    ## Quick start

    1. Configure the secret and import the flow.
    2. Upload two `api` incidents from `2026-10-01T00:00:00Z` to `00:10:00Z` and from `00:05:00Z` to `00:15:00Z`, using full timestamps in every cell.
    3. Set services to `["api"]` and a one-hour window starting at midnight. Verify 900,000,000 downtime microseconds and 75% recorded availability.

    ## How to extend

    Load exports from your incident platform before this flow. Missing incidents are not detected: zero recorded downtime is not evidence of complete monitoring. The calculation does not infer degraded-service impact, maintenance exclusions or request-based SLOs.

    ## Links

    - [DuckDB tasks](https://kestra.io/plugins/plugin-jdbc-duckdb)
    - [Window functions](https://duckdb.org/docs/stable/sql/functions/window_functions)
  tags:
  - Data
  subTags:
  - Monitoring & Alerting
  ee: false
  demo: false
