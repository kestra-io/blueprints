id: duckdb-outage-interval-union
namespace: company.data
inputs:
  - id: statuspage_url
    type: STRING
    defaults: https://www.githubstatus.com
    description: Public Atlassian Statuspage base URL, without a trailing slash.
  - id: services
    type: JSON
    defaults:
      - __page__
    description: 1-100 component IDs from /api/v2/components.json, or __page__ for the union of all impacting incidents on
      the page.
  - id: window_start
    type: STRING
    defaults: ''
    description: Inclusive ISO 8601 start with Z or an explicit offset; empty means 24 hours before window_end.
  - id: window_end
    type: STRING
    defaults: ''
    description: Exclusive ISO 8601 end with Z or an explicit offset; empty means the database snapshot time.
tasks:
  - id: fetch_statuspage
    type: io.kestra.plugin.core.flow.Parallel
    tasks:
      - id: fetch_incidents
        type: io.kestra.plugin.core.http.Download
        uri: '{{ inputs.statuspage_url }}/api/v2/incidents.json'
        options:
          timeout:
            connectTimeout: PT10S
            readIdleTimeout: PT30S
        retry:
          type: constant
          interval: PT5S
          maxAttempts: 3
      - id: fetch_components
        type: io.kestra.plugin.core.http.Download
        uri: '{{ inputs.statuspage_url }}/api/v2/components.json'
        options:
          timeout:
            connectTimeout: PT10S
            readIdleTimeout: PT30S
        retry:
          type: constant
          interval: PT5S
          maxAttempts: 3
  - id: source_sizes
    type: io.kestra.plugin.core.flow.Parallel
    tasks:
      - id: incidents_size
        type: io.kestra.plugin.core.storage.Size
        uri: '{{ outputs.fetch_incidents.uri }}'
      - id: components_size
        type: io.kestra.plugin.core.storage.Size
        uri: '{{ outputs.fetch_components.uri }}'
  - id: bound_sources
    type: io.kestra.plugin.core.execution.Assert
    conditions:
      - '{{ outputs.incidents_size.size > 0 and outputs.incidents_size.size <= 2097152 }}'
      - '{{ outputs.components_size.size > 0 and outputs.components_size.size <= 2097152 }}'
  - id: configure
    type: io.kestra.plugin.jdbc.duckdb.Queries
    timeZoneId: UTC
    parameters:
      services: '{{ inputs.services | toJson }}'
      window_start: '{{ inputs.window_start }}'
      window_end: '{{ inputs.window_end }}'
    outputFiles:
      - settings.parquet
      - services.parquet
      - incidents.csv
      - source-coverage.csv
    sql: |
      CREATE TABLE checks (ok BOOLEAN NOT NULL CHECK (ok));
      INSERT INTO checks VALUES (json_type(CAST(:services AS JSON)) = 'ARRAY');
      INSERT INTO checks VALUES
        ((:window_start = '' OR regexp_full_match(:window_start, '[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,6})?(Z|[+-]([01][0-9]|2[0-3]):[0-5][0-9])'))),
        ((:window_end = '' OR regexp_full_match(:window_end, '[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,6})?(Z|[+-]([01][0-9]|2[0-3]):[0-5][0-9])')));
      CREATE TABLE settings (
        window_start TIMESTAMPTZ NOT NULL,
        window_end TIMESTAMPTZ NOT NULL,
        CHECK (window_end > window_start),
        CHECK (epoch_us(window_end) - epoch_us(window_start) <= 31622400000000)
      );
      INSERT INTO settings
      SELECT COALESCE(CAST(NULLIF(:window_start, '') AS TIMESTAMPTZ), upper_bound - INTERVAL '24 hours'), upper_bound
      FROM (SELECT COALESCE(CAST(NULLIF(:window_end, '') AS TIMESTAMPTZ), current_timestamp) AS upper_bound);
      INSERT INTO checks SELECT window_end <= current_timestamp FROM settings;
      CREATE TABLE services (
        service_id VARCHAR PRIMARY KEY CHECK (length(trim(service_id)) BETWEEN 1 AND 128),
        kind VARCHAR NOT NULL CHECK (kind = 'VARCHAR')
      );
      INSERT INTO services SELECT json_extract_string(value, '$'), type FROM json_each(CAST(:services AS JSON));
      INSERT INTO checks SELECT count(*) BETWEEN 1 AND 100 FROM services;
      COPY settings TO '{{ outputFiles['settings.parquet'] }}' (FORMAT PARQUET);
      COPY services TO '{{ outputFiles['services.parquet'] }}' (FORMAT PARQUET);
      CREATE TABLE source AS SELECT CAST(content AS JSON) AS doc FROM read_text('{{ workingDir }}/source.json');
      CREATE TABLE component_source AS SELECT CAST(content AS JSON) AS doc FROM read_text('{{ workingDir }}/components.json');
      INSERT INTO checks SELECT json_type(doc, '$.incidents') = 'ARRAY' FROM source;
      INSERT INTO checks SELECT json_type(doc, '$.components') = 'ARRAY' FROM component_source;
      INSERT INTO checks SELECT (SELECT json_extract_string(doc, '$.page.id') FROM source)
        = (SELECT json_extract_string(doc, '$.page.id') FROM component_source);
      CREATE TABLE known_components AS
        SELECT json_extract_string(value, '$.id') AS service_id FROM component_source, json_each(doc, '$.components');
      INSERT INTO checks SELECT count(*) = 0 FROM services WHERE service_id <> '__page__'
        AND service_id NOT IN (SELECT service_id FROM known_components);
      CREATE TABLE raw_incidents AS
        SELECT json_extract_string(value, '$.id') AS incident_id,
          json_extract_string(value, '$.created_at') AS started_at,
          json_extract_string(value, '$.resolved_at') AS ended_at,
          json_extract_string(value, '$.impact') AS impact,
          json_extract_string(value, '$.status') AS status,
          COALESCE(json_extract(value, '$.components'), CAST('[]' AS JSON)) AS components
        FROM source, json_each(doc, '$.incidents');
      INSERT INTO checks SELECT count(*) <= 10000 AND count(*) = count(DISTINCT incident_id) FROM raw_incidents;
      INSERT INTO checks SELECT impact IN ('none', 'minor', 'major', 'critical')
        AND status IN ('investigating', 'identified', 'monitoring', 'resolved', 'postmortem')
        AND (status NOT IN ('resolved', 'postmortem') OR ended_at IS NOT NULL)
        AND json_type(components) = 'ARRAY' FROM raw_incidents;
      CREATE TABLE expanded AS
        SELECT r.incident_id, s.service_id, r.started_at, r.ended_at
        FROM raw_incidents r CROSS JOIN services s
        WHERE r.impact <> 'none' AND (s.service_id = '__page__' OR EXISTS (
          SELECT 1 FROM json_each(r.components) c WHERE json_extract_string(c.value, '$.id') = s.service_id));
      COPY expanded TO '{{ outputFiles['incidents.csv'] }}' (FORMAT CSV, HEADER true);
      COPY (
        SELECT current_timestamp AS fetched_at,
          (SELECT json_extract_string(doc, '$.page.id') FROM source) AS page_id,
          count(*) AS returned_incidents, count(*) >= 50 AS recent_feed_limit_reached,
          min(TRY_CAST(started_at AS TIMESTAMPTZ)) AS oldest_returned_start,
          count(*) FILTER (WHERE impact <> 'none' AND json_array_length(components) = 0) AS impacting_incidents_without_components,
          (SELECT count(*) FROM expanded) AS selected_incident_service_pairs,
          'RECENT_PUBLIC_FEED_ONLY_NOT_AN_SLO' AS coverage,
          'FULL_INCIDENT_LIFECYCLE_NOT_COMPONENT_STATUS_HISTORY' AS interval_policy
        FROM raw_incidents
      ) TO '{{ outputFiles['source-coverage.csv'] }}' (FORMAT CSV, HEADER true);
    inputFiles:
      source.json: '{{ outputs.fetch_incidents.uri }}'
      components.json: '{{ outputs.fetch_components.uri }}'
  - id: validate_incidents
    type: io.kestra.plugin.jdbc.duckdb.Queries
    timeZoneId: UTC
    inputFiles:
      incidents.csv: '{{ outputs.configure.outputFiles[''incidents.csv''] }}'
      settings.parquet: '{{ outputs.configure.outputFiles[''settings.parquet''] }}'
      services.parquet: '{{ outputs.configure.outputFiles[''services.parquet''] }}'
    outputFiles:
      - incidents.parquet
    sql: |
      CREATE TABLE checks (ok BOOLEAN NOT NULL CHECK (ok));
      CREATE TABLE settings AS SELECT * FROM read_parquet('{{ workingDir }}/settings.parquet');
      CREATE TABLE services AS SELECT * FROM read_parquet('{{ workingDir }}/services.parquet');
      CREATE TABLE raw AS SELECT incident_id, service_id, started_at, ended_at
        FROM read_csv('{{ workingDir }}/incidents.csv', header = true, all_varchar = true, strict_mode = true);
      INSERT INTO checks SELECT count(*) <= 100000 FROM raw;
      INSERT INTO checks SELECT regexp_full_match(started_at, '[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,6})?(Z|[+-]([01][0-9]|2[0-3]):[0-5][0-9])')
        AND (ended_at IS NULL OR regexp_full_match(ended_at, '[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,6})?(Z|[+-]([01][0-9]|2[0-3]):[0-5][0-9])')) FROM raw;
      CREATE TABLE incidents (
        incident_id VARCHAR NOT NULL CHECK (length(trim(incident_id)) BETWEEN 1 AND 128),
        service_id VARCHAR NOT NULL,
        started_at TIMESTAMPTZ NOT NULL,
        ended_at TIMESTAMPTZ,
        PRIMARY KEY (incident_id, service_id),
        CHECK (ended_at IS NULL OR ended_at >= started_at)
      );
      INSERT INTO incidents SELECT incident_id, service_id,
        CAST(started_at AS TIMESTAMPTZ), CAST(ended_at AS TIMESTAMPTZ) FROM raw;
      INSERT INTO checks SELECT count(*) = 0 FROM incidents WHERE service_id NOT IN (SELECT service_id FROM services);
      COPY (
        SELECT i.*, greatest(started_at, window_start) AS clipped_start,
          least(COALESCE(ended_at, window_end), window_end) AS clipped_end,
          greatest(started_at, window_start) < least(COALESCE(ended_at, window_end), window_end) AS overlaps_window,
          ended_at IS NULL AS was_open
        FROM incidents i CROSS JOIN settings
      ) TO '{{ outputFiles['incidents.parquet'] }}' (FORMAT PARQUET);
  - id: merge_outages
    type: io.kestra.plugin.jdbc.duckdb.Queries
    timeZoneId: UTC
    description: Compare each start with the maximum of all preceding ends, so nested and touching incidents stay in the same
      union interval.
    inputFiles:
      incidents.parquet: '{{ outputs.validate_incidents.outputFiles[''incidents.parquet''] }}'
    outputFiles:
      - downtime-windows.parquet
    sql: |
      CREATE TABLE ordered AS
      SELECT *, max(clipped_end) OVER (
        PARTITION BY service_id ORDER BY clipped_start, clipped_end, incident_id
        ROWS BETWEEN UNBOUNDED PRECEDING AND 1 PRECEDING
      ) AS previous_max_end
      FROM read_parquet('{{ workingDir }}/incidents.parquet') WHERE overlaps_window;
      CREATE TABLE grouped AS
      SELECT *, sum(CASE WHEN previous_max_end IS NULL OR clipped_start > previous_max_end THEN 1 ELSE 0 END)
        OVER (PARTITION BY service_id ORDER BY clipped_start, clipped_end, incident_id ROWS UNBOUNDED PRECEDING) AS island
      FROM ordered;
      COPY (
        SELECT service_id, min(clipped_start) AS started_at, max(clipped_end) AS ended_at,
          epoch_us(max(clipped_end)) - epoch_us(min(clipped_start)) AS downtime_us,
          count(*) AS contributing_incidents
        FROM grouped GROUP BY service_id, island ORDER BY service_id, started_at
      ) TO '{{ outputFiles['downtime-windows.parquet'] }}' (FORMAT PARQUET);
  - id: export_reports
    type: io.kestra.plugin.core.flow.Parallel
    tasks:
      - id: availability_report
        type: io.kestra.plugin.jdbc.duckdb.Queries
        timeZoneId: UTC
        inputFiles:
          windows.parquet: '{{ outputs.merge_outages.outputFiles[''downtime-windows.parquet''] }}'
          settings.parquet: '{{ outputs.configure.outputFiles[''settings.parquet''] }}'
          services.parquet: '{{ outputs.configure.outputFiles[''services.parquet''] }}'
        outputFiles:
          - availability.csv
        sql: |
          CREATE TABLE totals AS SELECT service_id, sum(downtime_us) AS downtime_us,
            count(*) AS merged_windows, sum(contributing_incidents) AS incident_count
            FROM read_parquet('{{ workingDir }}/windows.parquet') GROUP BY service_id;
          COPY (
            SELECT s.service_id, cfg.window_start, cfg.window_end,
              epoch_us(cfg.window_end) - epoch_us(cfg.window_start) AS window_us,
              CAST(COALESCE(t.downtime_us, 0) AS BIGINT) AS downtime_us,
              window_us - CAST(COALESCE(t.downtime_us, 0) AS BIGINT) AS available_us,
              CAST(round(100.0 * available_us / window_us, 6) AS DECIMAL(9,6)) AS recorded_availability_percent,
              COALESCE(t.merged_windows, 0) AS merged_windows,
              COALESCE(t.incident_count, 0) AS incident_count
            FROM read_parquet('{{ workingDir }}/services.parquet') s
            CROSS JOIN read_parquet('{{ workingDir }}/settings.parquet') cfg
            LEFT JOIN totals t ON t.service_id = s.service_id ORDER BY s.service_id
          ) TO '{{ outputFiles['availability.csv'] }}' (FORMAT CSV, HEADER true);
      - id: incident_audit
        type: io.kestra.plugin.jdbc.duckdb.Queries
        timeZoneId: UTC
        inputFiles:
          incidents.parquet: '{{ outputs.validate_incidents.outputFiles[''incidents.parquet''] }}'
        outputFiles:
          - incident-audit.csv
        sql: |
          COPY (
            SELECT incident_id, service_id, started_at, ended_at, was_open,
              CASE WHEN overlaps_window THEN clipped_start END AS counted_start,
              CASE WHEN overlaps_window THEN clipped_end END AS counted_end,
            CASE WHEN ended_at = started_at THEN 'ZERO_DURATION'
              WHEN NOT overlaps_window THEN 'OUTSIDE_WINDOW'
                WHEN was_open THEN 'OPEN_UNTIL_WINDOW_END'
                WHEN started_at <> clipped_start OR ended_at <> clipped_end THEN 'CLIPPED'
                ELSE 'IN_WINDOW' END AS treatment
            FROM read_parquet('{{ workingDir }}/incidents.parquet') ORDER BY service_id, incident_id
          ) TO '{{ outputFiles['incident-audit.csv'] }}' (FORMAT CSV, HEADER true);
  - id: verify_artifacts
    type: io.kestra.plugin.jdbc.duckdb.Query
    timeZoneId: UTC
    fetchType: FETCH_ONE
    inputFiles:
      windows.parquet: '{{ outputs.merge_outages.outputFiles[''downtime-windows.parquet''] }}'
      availability.csv: '{{ outputs.availability_report.outputFiles[''availability.csv''] }}'
      audit.csv: '{{ outputs.incident_audit.outputFiles[''incident-audit.csv''] }}'
      incidents.parquet: '{{ outputs.validate_incidents.outputFiles[''incidents.parquet''] }}'
      services.parquet: '{{ outputs.configure.outputFiles[''services.parquet''] }}'
      settings.parquet: '{{ outputs.configure.outputFiles[''settings.parquet''] }}'
    sql: |
      WITH windows AS (SELECT * FROM read_parquet('{{ workingDir }}/windows.parquet')),
      availability AS (SELECT * FROM read_csv('{{ workingDir }}/availability.csv', header = true)),
      services AS (SELECT * FROM read_parquet('{{ workingDir }}/services.parquet')),
      settings AS (SELECT * FROM read_parquet('{{ workingDir }}/settings.parquet')),
      totals AS (SELECT service_id, sum(downtime_us) AS downtime_us, count(*) AS merged_windows,
        sum(contributing_incidents) AS incident_count FROM windows GROUP BY service_id),
      neighbors AS (SELECT *, lag(ended_at) OVER (PARTITION BY service_id ORDER BY started_at) AS previous_end FROM windows)
      SELECT
        (SELECT count(*) FROM availability) = (SELECT count(*) FROM services)
        AND (SELECT count(DISTINCT service_id) FROM availability) = (SELECT count(*) FROM services)
        AND NOT EXISTS (SELECT 1 FROM availability WHERE service_id NOT IN (SELECT service_id FROM services))
        AND NOT EXISTS (SELECT 1 FROM neighbors CROSS JOIN settings
          WHERE started_at < window_start OR ended_at > window_end OR ended_at <= started_at
            OR started_at <= previous_end OR downtime_us <> epoch_us(ended_at) - epoch_us(started_at))
        AND NOT EXISTS (SELECT 1 FROM availability a CROSS JOIN settings c LEFT JOIN totals t ON a.service_id = t.service_id
          WHERE a.window_us <> epoch_us(c.window_end) - epoch_us(c.window_start)
            OR a.downtime_us <> COALESCE(t.downtime_us, 0) OR a.available_us + a.downtime_us <> a.window_us
            OR a.downtime_us < 0 OR a.available_us < 0
            OR a.merged_windows <> COALESCE(t.merged_windows, 0) OR a.incident_count <> COALESCE(t.incident_count, 0))
        AND NOT EXISTS (SELECT 1 FROM availability a LEFT JOIN (
          SELECT service_id, count(*) AS n FROM read_parquet('{{ workingDir }}/incidents.parquet')
          WHERE overlaps_window GROUP BY service_id
        ) i ON a.service_id = i.service_id WHERE a.incident_count <> COALESCE(i.n, 0))
        AND (SELECT count(*) FROM read_csv('{{ workingDir }}/audit.csv', header = true, all_varchar = true))
          = (SELECT count(*) FROM read_parquet('{{ workingDir }}/incidents.parquet')) AS valid;
  - id: verification
    type: io.kestra.plugin.core.execution.Assert
    conditions:
      - '{{ outputs.verify_artifacts.row.valid }}'
outputs:
  - id: availability
    type: FILE
    required: false
    value: '{{ (outputs.verify_artifacts.row.valid ?? false) ? outputs.availability_report.outputFiles[''availability.csv'']
      : null }}'
  - id: downtime_windows
    type: FILE
    required: false
    value: '{{ (outputs.verify_artifacts.row.valid ?? false) ? outputs.merge_outages.outputFiles[''downtime-windows.parquet'']
      : null }}'
  - id: incident_audit
    type: FILE
    required: false
    value: '{{ (outputs.verify_artifacts.row.valid ?? false) ? outputs.incident_audit.outputFiles[''incident-audit.csv'']
      : null }}'
  - id: source_incidents
    type: FILE
    required: false
    value: '{{ (outputs.verify_artifacts.row.valid ?? false) ? outputs.fetch_incidents.uri : null }}'
  - id: source_coverage
    type: FILE
    required: false
    value: '{{ (outputs.verify_artifacts.row.valid ?? false) ? outputs.configure.outputFiles[''source-coverage.csv''] : null
      }}'
triggers:
  - id: daily_statuspage_report
    type: io.kestra.plugin.core.trigger.Schedule
    cron: 0 6 * * *
    disabled: true
    description: Enable after a manual run; reports the trailing 24 hours at 06:00 UTC.
extend:
  title: Calculate recorded Statuspage incident exposure without counting overlaps twice
  metaTitle: Scheduled Statuspage Incident Union with DuckDB | Kestra
  shortDescription: Fetch public Statuspage incidents daily, merge overlapping incident lifecycles with DuckDB and export
    verified exposure reports with source coverage.
  metaDescription: Fetch Statuspage incidents on a schedule, union overlapping intervals with native DuckDB and export exposure,
    audit and source-coverage reports.
  description: |
    Measure recorded incident exposure from a real Statuspage feed without adding overlapping durations twice. Native HTTP tasks fetch the source; DuckDB performs the calculation and verifies the saved artifacts.

    ## How it works

    1. A daily schedule fetches `/api/v2/incidents.json` and `/api/v2/components.json` in parallel, with retries and a 2 MiB processing limit after download. Manual runs use the same path.
    2. Validate the page IDs, selected components and incident schema. Use `__page__` for page-wide exposure or supply component IDs. Ignore impact `none`; use `created_at` through `resolved_at`; retain zero-duration records in the audit.
    3. Clip intervals to `[window_start, window_end)`. Unresolved incidents extend to the end. Empty window inputs select the trailing 24 hours; explicit windows allow up to 366 days.
    4. Merge nested, overlapping and touching intervals using the running maximum of preceding ends. Export reports in parallel, reopen them and assert boundaries, durations and incident-count conservation.

    ## What you get

    - CSV with recorded availability, exact microsecond durations and merged-window counts.
    - Downtime Parquet, an incident/component audit and the original incident JSON.
    - Coverage CSV with returned count, oldest start, feed-limit flag and unmapped incident count. Failed verification withholds flow outputs.

    ## Who it's for

    SRE teams reviewing third-party dependency incidents and preparing evidence for incident reviews.

    ## Why orchestrate this with Kestra

    Scheduled HTTP ingestion, native SQL checkpoints, parallel reports and a final Assert share one execution. No scripts or Docker task runner are needed.

    ## Prerequisites

    Install the DuckDB JDBC plugin and allow HTTPS to the public Statuspage host. The public endpoint documents only 50 recent incidents; this is not a complete historical ledger or an SLO. Missing records cannot be recovered by widening the window. Component reports apply the full incident lifecycle to each listed component, not its individual degradation timeline. Incidents without components count only under `__page__`; maintenance and impact weighting are excluded.

    ### Secrets

    None for public pages. Private pages need authenticated HTTP tasks.

    ## Quick start

    1. Import the flow and run the GitHub Statuspage defaults with `services: ["__page__"]`.
    2. Inspect coverage before interpreting availability. Use IDs from the components endpoint for component reports.
    3. Enable the 06:00 UTC schedule. Explicit timestamps require seconds, an offset or `Z`, and at most six fractional digits.

    ## How to extend

    Persist snapshots to build your own ledger, or use a paginated authenticated incident API for complete backfills.

    ## Links

    - [Statuspage public API](https://www.githubstatus.com/api)
    - [DuckDB tasks](https://kestra.io/plugins/plugin-jdbc-duckdb)
  tags:
    - Data
  subTags:
    - Monitoring & Alerting
  ee: false
  demo: false
