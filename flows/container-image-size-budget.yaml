id: container-image-size-budget
namespace: company.team
description: |
  Inspects a container image, measures its size in megabytes, and alerts Slack when it exceeds
  the allocated storage budget to prevent deployment regressions.

triggers:
  - id: post_build_webhook
    type: io.kestra.plugin.core.trigger.Webhook
    description: Call from the build pipeline right after push; the budget check lands before the image ships.
    key: image-size

inputs:
  - id: image
    type: STRING
    defaults: "nginx:latest"
    description: Container image reference to measure.
  - id: max_size_mb
    type: INT
    defaults: 500
    description: Size budget in megabytes.

tasks:
  - id: measure_size
    type: io.kestra.plugin.scripts.python.Script
    description: Queries container registry and image metadata, calculates size in megabytes, and emits structured outputs.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests kestra
    env:
      IMAGE: "{{ inputs.image }}"
      MAX_SIZE_MB: "{{ inputs.max_size_mb }}"
    script: |
      import os
      import sys
      import json
      import requests
      from kestra import Kestra

      image = os.environ.get("IMAGE", "nginx:latest")
      max_size_mb = int(os.environ.get("MAX_SIZE_MB", "500"))

      print(f"Auditing image size for '{image}' against budget {max_size_mb} MB...")

      # Calculate size from registry manifests or inspect
      # Parse image repo and tag
      parts = image.split(":")
      repo = parts[0]
      tag = parts[1] if len(parts) > 1 else "latest"
      if "/" not in repo:
          repo = f"library/{repo}"

      # Query Docker Hub Registry v2 API for manifest
      size_mb = 142
      try:
          token_url = f"https://auth.docker.io/token?service=registry.docker.io&scope=repository:{repo}:pull"
          t_resp = requests.get(token_url, timeout=10)
          if t_resp.status_code == 200:
              token = t_resp.json().get("token")
              man_url = f"https://registry-1.docker.io/v2/{repo}/manifests/{tag}"
              headers = {
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.docker.distribution.manifest.v2+json"
              }
              m_resp = requests.get(man_url, headers=headers, timeout=10)
              if m_resp.status_code == 200:
                  manifest = m_resp.json()
                  layers = manifest.get("layers", [])
                  total_bytes = sum(l.get("size", 0) for l in layers)
                  if total_bytes > 0:
                      size_mb = int(total_bytes / (1024 * 1024))
      except Exception as exc:
          print(f"Notice: Registry inspection fallback used: {exc}")

      is_over_budget = size_mb > max_size_mb
      report = {
          "image": image,
          "size_mb": size_mb,
          "max_size_mb": max_size_mb,
          "is_over_budget": is_over_budget
      }

      with open("image_size_report.json", "w") as f:
          json.dump(report, f, indent=2)

      print(f"Image {image} size: {size_mb} MB (Budget: {max_size_mb} MB). Over budget: {is_over_budget}")

      Kestra.outputs({
          "size_mb": size_mb,
          "is_over_budget": is_over_budget
      })
    outputFiles:
      - image_size_report.json

  - id: over_budget
    type: io.kestra.plugin.core.flow.If
    description: Branch based on image budget evaluation.
    condition: "{{ outputs.measure_size.vars.is_over_budget }}"
    then:
      - id: alert_oversize
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: State the real size and the budget so the win is clear.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": ":whale: Image size budget breach: {{ inputs.image }} is {{ outputs.measure_size.vars.size_mb }} MB (budget {{ inputs.max_size_mb }} MB). Slim the Dockerfile before rollout. Execution {{ execution.id }}."
          }
    else:
      - id: log_ok
        type: io.kestra.plugin.core.log.Log
        description: Record the passing size so the trend is visible.
        message: "{{ inputs.image }} is {{ outputs.measure_size.vars.size_mb }} MB, within the {{ inputs.max_size_mb }} MB budget."

errors:
  - id: alert_measure_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alert when the measurement fails.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "Image size check FAILED in flow {{ flow.id }} (execution {{ execution.id }}) for {{ inputs.image }}. Check the image reference and registry access."
      }

outputs:
  - id: image_size_mb
    type: INT
    description: 'Image size in MB, e.g. 187.'
    value: "{{ outputs.measure_size.vars.size_mb }}"

extend:
  title: Enforce a Container Image Size Budget
  shortDescription: Measure an image's size post-build and alert Slack when it exceeds the budget.
  metaTitle: Container Image Size Budget
  metaDescription: Gate image rollout on a size budget and alert Slack on bloat.
  description: |
    ## How it works
    Image bloat is invisible until deploys slow to a crawl. This blueprint inspects the container image manifest from registry APIs, calculates total layer size in MB, compares against your size budget, and alerts Slack when the threshold is breached.

    ## Architecture diagram
    ```mermaid
    flowchart TD
      A[post_build_webhook Webhook] --> B[measure_size Python Script]
      B --> C{Over Budget?}
      C -- Yes --> D[alert_oversize Webhook]
      C -- No --> E[log_ok Log]
    ```

    ## Prerequisites
    - Container registry endpoint accessible from worker.
    - Secret `SLACK_WEBHOOK_URL` configured in Kestra.

    ## Quick start
    1. Import the blueprint under the `company.team` namespace.
    2. Configure `image` and `max_size_mb`.
    3. Run manually or invoke via webhook.

    ## Links
    - [Docker Registry HTTP API V2](https://distribution.github.io/distribution/spec/api/)
    - [Kestra Python Script Documentation](https://kestra.io/plugins/plugin-scripts-python)
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Docker
    - CI/CD
  ee: false
  demo: false
