id: istio-service-mesh-pilot-sync-failure-sentinel
namespace: company.mesh

inputs:
  - id: istiod_metrics_url
    type: STRING
    defaults: "http://istiod.istio-system:15014/metrics"
    description: Prometheus scrape endpoint for Istio Pilot control plane.
  - id: max_xds_errors
    type: INT
    defaults: 0
    description: "Maximum allowable xDS push errors before alerting (default 0)."

tasks:
  - id: scrape_istiod_metrics
    type: io.kestra.plugin.scripts.shell.Commands
    commands:
      - |
        curl -s -f "{{ inputs.istiod_metrics_url }}" > /tmp/istio_telemetry.txt
        
        # Scrape pilot_xds_push_errors counter
        XDS_ERRORS=$(grep -E "^pilot_xds_push_errors" /tmp/istio_telemetry.txt | awk '{sum+=$2} END {print sum+0}')
        echo "::set-output name=xds_errors::$XDS_ERRORS::"

  - id: evaluate_xds_errors
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.scrape_istiod_metrics.vars.xds_errors | int > inputs.max_xds_errors }}"
    then:
      - id: notify_mesh_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#service-mesh-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 Istio Control Plane xDS Push Error Alert",
                "text": "Istio Pilot at `{{ inputs.istiod_metrics_url }}` recorded *{{ outputs.scrape_istiod_metrics.vars.xds_errors }} xDS configuration push errors*! Sidecar Envoy proxies are failing to receive dynamic routing, mTLS certificates, or cluster endpoints.",
                "footer": "Kestra Service Mesh Sentinel • Istio"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#service-mesh-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ Istio Sentinel Failure",
            "text": "Failed to scrape Istio Pilot metrics endpoint. Verify istiod service reachability.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  metaDescription: "Monitors Istio control plane (istiod) for xDS configuration distribution errors and rejected sidecar proxies."
  metaTitle: Istio Service Mesh Control Plane xDS Push Error Sentinel with Kestra
  title: Istio Service Mesh Control Plane xDS Push Error Sentinel
  shortDescription: Monitors Istio control plane (istiod) for xDS configuration distribution errors and rejected sidecar proxies.
  description: |
    ## How it works
    This workflow scrapes the monitoring endpoint of the Istio control plane (`istiod:15014/metrics`) to audit `pilot_xds_push_errors`. In service mesh architectures, Istio Pilot dynamically translates Kubernetes Services, VirtualServices, and DestinationRules into Envoy discovery configurations (CDS, LDS, RDS, EDS). When invalid configurations, schema drifts, or network timeouts prevent sidecars from receiving updates, proxies run on outdated routes or drop mTLS encryption. This workflow detects push errors and triggers alerts before traffic routing breaks.

    ## What you get
    - Real-time detection of control plane distribution errors in Istio Service Mesh.
    - Prevents traffic blackholing and stale routing tables in Envoy sidecars.
    - Actionable visibility into xDS push error counters.

    ## Who it's for
    - Kubernetes Platform Engineers and Service Mesh Architects.
    - SREs maintaining high-reliability microservice communication.

    ## Why orchestrate this with Kestra
    - **Continuous Mesh Assurance**: Scrapes control plane telemetry on an automated cadence.
    - **Centralized Alerting**: Delivers immediate Slack notifications when push errors occur.
    - **Zero Footprint**: Uses standard HTTP scraping with no cluster agent requirements.

    ## Prerequisites
    - Istio control plane installed with port 15014 accessible.
    - Secret `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import the blueprint.
    2. Input the istiod metrics URL.
    3. Run the workflow to inspect current xDS push status.

    ## How to extend
    - Inspect `pilot_xds_pushes` versus `pilot_xds_push_timeouts` for push latency profiling.
    - Execute `istioctl proxy-status` automatically to locate misconfigured proxy workloads.

    ## Links
    - [Istio Control Plane Metrics Documentation](https://istio.io/latest/docs/reference/commands/pilot-discovery/#metrics)
    - [Kestra Documentation](https://kestra.io/docs)
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Day 2 Operations
    - Infrastructure Automation
  ee: false
  verified: false
  demo: false
