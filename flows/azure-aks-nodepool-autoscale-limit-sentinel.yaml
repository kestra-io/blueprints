id: azure-aks-nodepool-autoscale-limit-sentinel
namespace: company.cloud

inputs:
  - id: subscription_id
    type: STRING
    description: Azure Subscription ID.
  - id: resource_group
    type: STRING
    description: Azure Resource Group name.
  - id: cluster_name
    type: STRING
    description: Azure Kubernetes Service (AKS) cluster name.

tasks:
  - id: check_nodepool_limits
    type: io.kestra.plugin.scripts.shell.Commands
    containerImage: mcr.microsoft.com/azure-cli:latest
    commands:
      - |
        az login --service-principal -u "{{ secret('AZURE_CLIENT_ID') }}" -p "{{ secret('AZURE_CLIENT_SECRET') }}" --tenant "{{ secret('AZURE_TENANT_ID') }}" --output none
        az account set --subscription "{{ inputs.subscription_id }}"
        
        # Query node pools where current count meets or exceeds maxCount
        az aks nodepool list           --cluster-name "{{ inputs.cluster_name }}"           --resource-group "{{ inputs.resource_group }}"           --query "[?enableAutoScaling && count >= maxCount].{pool:name, current:count, max:maxCount}"           --output json > /tmp/nodepool_telemetry.json
        
        SATURATED_POOLS=$(jq 'length' /tmp/nodepool_telemetry.json)
        echo "::set-output name=saturated_pool_count::$SATURATED_POOLS::"

  - id: evaluate_nodepool_saturation
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.check_nodepool_limits.vars.saturated_pool_count | int > 0 }}"
    then:
      - id: notify_platform_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#k8s-platform",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 AKS Node Pool Autoscale Capacity Saturated Alert",
                "text": "AKS Cluster `{{ inputs.cluster_name }}` has *{{ outputs.check_nodepool_limits.vars.saturated_pool_count }} node pool(s)* operating at their absolute maximum autoscale limit (`maxCount`)! New workloads and deployments are at severe risk of Pending scheduling starvation.",
                "footer": "Kestra Cloud Sentinel • Microsoft Azure AKS"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#k8s-platform",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ Azure AKS Node Pool Sentinel Failure",
            "text": "Failed to query AKS cluster node pools. Verify cluster name, resource group, and permissions.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true
    inputs:
      subscription_id: replace-with-your-subscription-id
      resource_group: replace-with-your-resource-group
      cluster_name: replace-with-your-cluster-name

extend:
  metaDescription: "Detects Azure Kubernetes Service (AKS) node pools reaching maximum autoscale capacity ceiling to prevent pod scheduling starvation."
  metaTitle: Microsoft Azure Kubernetes Service (AKS) Node Pool Autoscale Capacity Ceiling Sentinel with Kestra
  title: Microsoft Azure Kubernetes Service (AKS) Node Pool Autoscale Capacity Ceiling Sentinel
  shortDescription: Detects Azure Kubernetes Service (AKS) node pools reaching maximum autoscale capacity ceiling to prevent pod scheduling starvation.
  description: |
    ## How it works
    This workflow audits Azure Kubernetes Service (AKS) clusters by querying node pool configurations through the Azure CLI container (`az aks nodepool list`). When Kubernetes deployments experience organic traffic growth or bursty batch jobs, the cluster autoscaler expands node count up to the configured `maxCount` ceiling. Once this limit is reached, the autoscaler cannot provision further VM instances, leading to `Pending` pods, container scheduling starvation, and degraded service SLAs. The workflow identifies saturated pools and immediately dispatches alerts.

    ## What you get
    - Real-time detection of saturated AKS compute node pools.
    - Prevents Kubernetes pod scheduling deadlocks and pending queue buildups.
    - Actionable capacity alerts identifying specific saturated node pool names.

    ## Who it's for
    - Kubernetes Platform Engineers and Site Reliability Engineers managing AKS clusters.
    - Infrastructure Architects sizing cloud compute capacity for microservice fleets.

    ## Why orchestrate this with Kestra
    - **Unified Kubernetes Governance**: Audit AKS cluster scaling limits alongside Amazon EKS and Google GKE.
    - **Zero Local Footprint**: Runs inside standard containers using service principal authentication.
    - **Proactive Scaling Alerts**: Notifies platform teams to expand `maxCount` before business workloads suffer.

    ## Prerequisites
    - Azure Service Principal with `Azure Kubernetes Service Cluster User Role` and `Reader` permissions.
    - Secrets `AZURE_CLIENT_ID`, `AZURE_CLIENT_SECRET`, `AZURE_TENANT_ID`, and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import the blueprint.
    2. Provide your Azure Subscription ID, Resource Group, and AKS Cluster name.
    3. Execute the workflow to verify cluster node pool headroom.

    ## How to extend
    - Automatically scale the node pool `maxCount` via `az aks nodepool update` upon platform team Slack approval.
    - Integrate with Prometheus alerts for cluster unschedulable pod counts.

    ## Links
    - [Automatically Scale a Cluster in Azure Kubernetes Service (AKS)](https://learn.microsoft.com/en-us/azure/aks/cluster-autoscaler)
    - [Kestra Documentation](https://kestra.io/docs)
  tags:
    - Cloud
    - Infrastructure
  subTags:
    - Azure Services
    - Infrastructure Automation
  ee: false
  verified: false
  demo: false
