id: cleveland-museum-art-collection-lakehouse-loader
namespace: company.analytics
description: Ingests historical artwork metadata, artist attributions, cultural origins, and visual media links from Cleveland Museum of Art Open Access API into DuckDB, exports Parquet and analytics datasets, and manages sync state with Kestra KV store.

inputs:
  - id: state_key
    type: STRING
    description: Kestra KV store key tracking processed unique entity identifiers.
    defaults: cleveland-museum-art-collection-lakehouse-loader_state

variables:
  default_state: "[]"

triggers:
  - id: periodic_sync
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 4 * * 1"

tasks:
  - id: get_current_state
    type: io.kestra.plugin.core.kv.Get
    key: "{{ inputs.state_key }}"
    errorOnMissing: false

  - id: ingest_and_transform
    type: io.kestra.plugin.scripts.python.Commands
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install requests duckdb
    commands:
      - |
        python3 - << 'PYEOF'
        import os
        import json
        import requests
        import duckdb
        from datetime import datetime, timezone

        raw_state = """{{ outputs.get_current_state.value ?? vars.default_state }}"""
        try:
            seen_ids = set(json.loads(raw_state))
        except Exception:
            seen_ids = set()

        url = "https://openaccess-api.clevelandart.org/api/artworks/?has_image=1&limit=50"
        headers = {"User-Agent": "KestraLakehouseLoader/1.0 (kestra-data-pipeline; contact@company.internal)"}

        resp = requests.get(url, headers=headers, timeout=30)
        resp.raise_for_status()
        data = resp.json()
        root_key = "data"
        items = data.get(root_key, data) if root_key else data

        records = []
        now_iso = datetime.now(timezone.utc).isoformat()
        current_ids = []

        
        for item in items:
            aid = str(item.get('id', 'UNKNOWN'))
            current_ids.append(aid)
            title = item.get('title', 'Untitled')
            culture = item.get('culture', ['Unknown'])
            cult_str = culture[0] if isinstance(culture, list) and culture else str(culture)
            cdate = item.get('creation_date', 'Unknown')
            dept = item.get('department', 'General')

            records.append({
                'artwork_id': aid,
                'title': str(title),
                'culture': str(cult_str),
                'creation_date': str(cdate),
                'department': str(dept),
                'is_new': bool(aid not in seen_ids),
                'ingestion_timestamp': now_iso
            })
        

        con = duckdb.connect(database=":memory:")
        con.execute("""
            CREATE TABLE art_collection (
                artwork_id VARCHAR,
                title VARCHAR,
                culture VARCHAR,
                creation_date VARCHAR,
                department VARCHAR,
                is_new BOOLEAN,
                ingestion_timestamp VARCHAR
            );
        """)

        if records:
            con.execute("INSERT INTO art_collection SELECT * FROM read_json_auto(?)", [json.dumps(records)])

        con.execute("COPY art_collection TO 'cleveland_artworks.parquet' (FORMAT PARQUET, COMPRESSION ZSTD);")
        con.execute("""
            COPY (
                SELECT
                    department,
                    COUNT(*) AS artwork_count
                FROM art_collection
                GROUP BY 1
                ORDER BY artwork_count DESC
            ) TO 'artworks_by_department.csv' (HEADER, DELIMITER ',');
        """)

        new_count = con.execute("SELECT count(*) FROM art_collection WHERE is_new = true").fetchone()[0]
        total_count = con.execute("SELECT count(*) FROM art_collection").fetchone()[0]

        updated_ids = list(seen_ids.union(current_ids))
        with open("updated_state.json", "w") as f:
            json.dump(updated_ids, f)

        metrics = {
            "total_extracted": total_count,
            "new_entities": new_count,
            "synced_at": now_iso
        }
        with open("metrics.json", "w") as f:
            json.dump(metrics, f)

        print(f"Lakehouse sync complete. Processed {total_count} records ({new_count} newly observed).")
        PYEOF
    outputFiles:
      - cleveland_artworks.parquet
      - artworks_by_department.csv
      - updated_state.json
      - metrics.json

  - id: update_state
    type: io.kestra.plugin.core.kv.Set
    key: "{{ inputs.state_key }}"
    value: "{{ read(outputs.ingest_and_transform.outputFiles['updated_state.json']) }}"

  - id: analyze_and_notify
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.ingest_and_transform.outputFiles['cleveland_artworks.parquet'] != null }}"
    then:
      - id: log_metrics
        type: io.kestra.plugin.core.log.Log
        message: "Cleveland Museum of Art Open Access sync succeeded. Metrics: {{ read(outputs.ingest_and_transform.outputFiles['metrics.json']) }}"
