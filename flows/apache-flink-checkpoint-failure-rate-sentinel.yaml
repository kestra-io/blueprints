id: apache-flink-checkpoint-failure-rate-sentinel
namespace: company.streaming

inputs:
  - id: flink_jobmanager_url
    type: STRING
    defaults: "http://flink-jobmanager.internal:8081"
    description: Base URL of Flink JobManager REST API.
  - id: job_id
    type: STRING
    description: Flink streaming job unique identifier.

tasks:
  - id: query_checkpoint_stats
    type: io.kestra.plugin.scripts.shell.Commands
    commands:
      - |
        # Query Flink JobManager checkpoints endpoint
        curl -s -f "{{ inputs.flink_jobmanager_url }}/jobs/{{ inputs.job_id }}/checkpoints" > /tmp/flink_cp_telemetry.json
        
        FAILED_COUNT=$(jq '.counts.failed // 0' /tmp/flink_cp_telemetry.json)
        COMPLETED_COUNT=$(jq '.counts.completed // 0' /tmp/flink_cp_telemetry.json)
        
        echo "::set-output name=failed_count::$FAILED_COUNT::"
        echo "::set-output name=completed_count::$COMPLETED_COUNT::"

  - id: evaluate_checkpoint_health
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.query_checkpoint_stats.vars.failed_count | int > 0 }}"
    then:
      - id: notify_streaming_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#streaming-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 Apache Flink Checkpointing FAILED Alert",
                "text": "Flink Job `{{ inputs.job_id }}` recorded *{{ outputs.query_checkpoint_stats.vars.failed_count }} failed checkpoints* (Completed: {{ outputs.query_checkpoint_stats.vars.completed_count }})! State storage backend timeouts, GC pauses, or unaligned checkpoint barrier alignment stalls threaten streaming recovery.",
                "footer": "Kestra Streaming Sentinel • Apache Flink"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#streaming-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ Apache Flink Sentinel Failure",
            "text": "Failed to query Flink JobManager checkpoints API. Verify JobManager URL and job ID.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  title: Apache Flink Checkpoint Failure and State Snapshot Lag Sentinel
  shortDescription: Audits Apache Flink JobManager for checkpoint failures and duration degradation to prevent streaming state corruption.
  description: |
    ## How it works
    This workflow connects to the Apache Flink JobManager REST API (`/jobs/{job_id}/checkpoints`) to audit the status and failure counters of streaming state snapshots. Flink relies on periodic asynchronous checkpoints (RocksDB or FileSystem state backends) to provide exactly-once processing guarantees. When storage I/O stalls (S3, GCS, HDFS), network buffer saturation delays checkpoint barriers, or heavy GC pauses cause task managers to drop heartbeats, checkpoints fail and exceed configured failure tolerances. This workflow monitors checkpoint status and raises immediate alerts before job failure cascades.

    ## What you get
    - Real-time visibility into Apache Flink state persistence reliability.
    - Prevents loss of exactly-once stream processing guarantees.
    - Quantitative tracking of completed versus failed checkpoint attempts.

    ## Who it's for
    - Stream Processing Engineers and Real-Time Analytics Developers.
    - SREs maintaining high-throughput Apache Flink clusters.

    ## Why orchestrate this with Kestra
    - **Continuous State Verification**: Regularly checks Flink state health without manual dashboard inspection.
    - **Decoupled Monitoring**: Communicates with standard JobManager REST endpoints.
    - **Actionable Alerts**: Delivers notifications with job and checkpoint counts directly to Slack.

    ## Prerequisites
    - Apache Flink cluster with JobManager REST API enabled.
    - Secret `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import the blueprint.
    2. Input Flink JobManager URL and target Job ID.
    3. Run the workflow to inspect checkpoint statistics.

    ## How to extend
    - Inspect end-to-end checkpoint duration (`latest.completed.end_to_end_duration`) to catch snapshot latency creep.
    - Trigger a manual savepoint via Flink API prior to cluster maintenance.

    ## Links
    - [Apache Flink Monitoring REST API - Checkpoints](https://nightlies.apache.org/flink/flink-docs-master/docs/ops/rest_api/#jobs-jobid-checkpoints)
    - [Kestra Documentation](https://kestra.io/docs)
  tags:
    - Data
    - Infrastructure
  ee: false
  demo: false
