id: elasticsearch-node-breaker-memory-sentinel
namespace: company.team

inputs:
  - id: es_host
    type: STRING
    defaults: "elasticsearch.internal"
    description: Hostname of the Elasticsearch cluster node.
  - id: es_port
    type: INT
    defaults: 9200
    description: Port of the Elasticsearch cluster node.
  - id: es_user
    type: STRING
    defaults: "elastic"
    description: Elasticsearch username.

tasks:
  - id: inspect_circuit_breakers
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests
    env:
      ES_HOST: "{{ inputs.es_host }}"
      ES_PORT: "{{ inputs.es_port }}"
      ES_USER: "{{ inputs.es_user }}"
      ES_PASSWORD: "{{ secret('ES_PASSWORD') }}"
    script: |
      import os
      import sys
      import json
      import requests
      from kestra import Kestra

      host = os.environ.get("ES_HOST", "elasticsearch.internal")
      port = os.environ.get("ES_PORT", "9200")
      user = os.environ.get("ES_USER", "elastic")
      password = os.environ.get("ES_PASSWORD", "")

      auth = (user, password) if user and password else None
      url = f"http://{host}:{port}/_nodes/stats/breaker"

      try:
          resp = requests.get(url, auth=auth, timeout=15)
          resp.raise_for_status()
          data = resp.json()
      except Exception as e:
          print(f"CRITICAL: Failed to query circuit breaker stats at {url}: {e}", file=sys.stderr)
          sys.exit(1)

      nodes = data.get("nodes", {})
      total_tripped = 0
      node_tripped_details = []

      for nid, ninfo in nodes.items():
          node_name = ninfo.get("name", nid)
          breakers = ninfo.get("breakers", {})
          node_trips = 0
          for bname, bstats in breakers.items():
              node_trips += int(bstats.get("tripped", 0))
          if node_trips > 0:
              node_tripped_details.append({"node": node_name, "trips": node_trips})
          total_tripped += node_trips

      is_breach = 1 if total_tripped > 0 else 0

      report = {
          "total_tripped": total_tripped,
          "is_breach": is_breach,
          "nodes_count": len(nodes),
          "details": node_tripped_details
      }

      with open("breaker_summary.json", "w") as f:
          json.dump(report, f, indent=2)

      Kestra.outputs({
          "total_tripped": total_tripped,
          "is_breach": is_breach
      })
      print(f"Circuit breaker audit: tripped={total_tripped}, breach={is_breach}")
    outputFiles:
      - breaker_summary.json

  - id: evaluate_breaker_health
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.inspect_circuit_breakers.vars.is_breach | int == 1 }}"
    then:
      - id: notify_search_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#search-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 Elasticsearch Circuit Breaker Tripped Alert",
                "text": "Elasticsearch node {{ inputs.es_host }} has recorded {{ outputs.inspect_circuit_breakers.vars.total_tripped }} tripped circuit breaker events. Search or aggregation queries are hitting memory limits and aborting with CircuitBreakingException.",
                "footer": "Kestra Search Sentinel • Elasticsearch"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "#search-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ Elasticsearch Circuit Breaker Sentinel Failure",
            "text": "Failed to scrape Elasticsearch node circuit breaker stats. Verify cluster network connectivity. Execution ID: {{ execution.id }}",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  metaDescription: "Audits Elasticsearch cluster nodes for circuit breaker trip events to detect memory saturation before JVM crashes."
  metaTitle: Elasticsearch Node Breaker Memory Sentinel with Kestra
  title: Elasticsearch Node Breaker Memory Sentinel
  shortDescription: Audits Elasticsearch cluster nodes for circuit breaker trip events to detect memory saturation before JVM crashes.
  description: |
    ## How it works
    This workflow queries `_nodes/stats/breaker` to inspect circuit breaker statistics across Elasticsearch nodes. When parent, fielddata, request, or in-flight breakers trip, queries are aborted to prevent JVM OutOfMemory errors. The sentinel monitors tripped counters and notifies search platform teams immediately.

    ## Architecture diagram
    ```mermaid
    flowchart TD
      A[periodic_schedule Schedule Trigger] --> B[inspect_circuit_breakers Python Script]
      B --> C{Breakers Tripped?}
      C -- Yes --> D[notify_search_team Slack Webhook]
      C -- No --> E[Nodes Nominal]
    ```

    ## Prerequisites
    - Elasticsearch cluster (7.x / 8.x) accessible via REST.
    - Secrets `ES_PASSWORD` and `SLACK_WEBHOOK_URL` configured in Kestra.

    ## Quick start
    1. Import the blueprint under the `company.team` namespace.
    2. Configure cluster host and credentials.
    3. Run manually to check circuit breaker health.

    ## Links
    - [Elasticsearch Circuit Breaker Documentation](https://www.elastic.co/guide/en/elasticsearch/reference/current/circuit-breaker.html)
    - [Kestra Python Script Documentation](https://kestra.io/plugins/plugin-scripts-python)
  tags:
    - Data
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - Day 2 Operations
  ee: false
  demo: false
