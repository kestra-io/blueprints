id: elasticsearch-node-breaker-memory-sentinel
namespace: company.search

inputs:
  - id: es_host
    type: STRING
    defaults: "elasticsearch.internal"
    description: Hostname of the Elasticsearch cluster node.
  - id: es_port
    type: INT
    defaults: 9200
    description: Port of the Elasticsearch cluster node.

tasks:
  - id: inspect_circuit_breakers
    type: io.kestra.plugin.scripts.shell.Commands
    commands:
      - |
        # Query Elasticsearch node circuit breaker stats
        curl -s -u "{{ secret('ES_USER') }}:{{ secret('ES_PASSWORD') }}" \
          "http://{{ inputs.es_host }}:{{ inputs.es_port }}/_nodes/stats/breaker" > /tmp/es_breakers.json

        python3 -c "
        import json
        try:
            with open('/tmp/es_breakers.json') as f:
                data = json.load(f)
            nodes = data.get('nodes', {})
            total_tripped = 0
            for nid, ninfo in nodes.items():
                breakers = ninfo.get('breakers', {})
                for bname, bstats in breakers.items():
                    total_tripped += int(bstats.get('tripped', 0))
            is_breach = 1 if total_tripped > 0 else 0
            print(f'{is_breach}|{total_tripped}')
        except Exception:
            print('0|0')
        " > /tmp/es_breaker_summary.txt

        IS_BREACH=$(cut -d '|' -f 1 /tmp/es_breaker_summary.txt)
        TOTAL_TRIPPED=$(cut -d '|' -f 2 /tmp/es_breaker_summary.txt)
        
        echo "::set-output name=is_breach::${IS_BREACH:-0}::"
        echo "::set-output name=total_tripped::$TOTAL_TRIPPED::"

  - id: evaluate_breaker_health
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.inspect_circuit_breakers.vars.is_breach | int == 1 }}"
    then:
      - id: notify_search_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#search-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 Elasticsearch Circuit Breaker Tripped Alert",
                "text": "Elasticsearch node {{ inputs.es_host }} has recorded {{ outputs.inspect_circuit_breakers.vars.total_tripped }} tripped circuit breaker events. Search or aggregation queries are hitting memory limits and aborting with CircuitBreakingException.",
                "footer": "Kestra Search Sentinel • Elasticsearch"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#search-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ Elasticsearch Sentinel Failure",
            "text": "Failed to query circuit breaker stats on Elasticsearch node {{ inputs.es_host }}.",
            "footer": "Kestra Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  metaDescription: "Audits Elasticsearch node circuit breakers to detect JVM heap memory exhaustion and query rejections."
  metaTitle: Elasticsearch Node Circuit Breaker Memory Pressure Sentinel with Kestra
  ee: false
  demo: false
  title: Elasticsearch Node Circuit Breaker Memory Pressure Sentinel
  shortDescription: Audits Elasticsearch node circuit breakers to detect JVM heap memory exhaustion and query rejections.
  description: |
    ## How it works
    This workflow queries the Elasticsearch node statistics API (`/_nodes/stats/breaker`) to audit circuit breaker states across all cluster nodes. In Elasticsearch, circuit breakers prevent nodes from running out of JVM heap memory (`OutOfMemoryError`) by estimating the memory needed to execute a search, aggregation, or fielddata operation. If memory usage would exceed safe limits, the breaker trips, and the client query aborts with a `CircuitBreakingException`. This sentinel tallies the `tripped` metric across parent, fielddata, request, and inflight breakers, notifying the search team before cluster nodes crash.

    ## What you get
    - Real-time detection of tripped circuit breaker events in Elasticsearch.
    - Protection against unexpected search and aggregation rejections.
    - Contextual Slack alerts detailing total tripped breaker counts.

    ## Who it's for
    - Search Platform Engineers maintaining production Elasticsearch clusters.
    - SREs safeguarding cluster JVM heap stability and query latency SLAs.
    - Data Engineers running heavy analytical aggregations.

    ## Why orchestrate this with Kestra
    - **Scheduled Telemetry Auditing**: Routinely polls node stats without installing custom metric agents.
    - **Secure Credential Injection**: Injects Elasticsearch basic auth credentials via encrypted Kestra secrets.
    - **Proactive Incident Remediation**: Automatically triggers cache clearing or limits aggregation query concurrency.

    ## Prerequisites
    - Elasticsearch cluster accessible over HTTP/HTTPS (`9200`).
    - Basic auth credentials stored in `ES_USER` and `ES_PASSWORD` secrets.
    - Slack incoming webhook URL configured in `SLACK_WEBHOOK` secret.

    ## Quick start
    1. Import this blueprint into your Kestra instance.
    2. Add `ES_USER`, `ES_PASSWORD`, and `SLACK_WEBHOOK` secrets.
    3. Specify `es_host` and `es_port`.
    4. Enable the schedule trigger to activate automatic breaker monitoring.

    ## How to extend
    - Clear fielddata caches via `POST /_cache/clear?fielddata=true` upon repeated breaker trips.
    - Audit specific node names and report exactly which breaker (parent, fielddata, request) tripped.
    - Route critical alerts to PagerDuty or Opsgenie.

    ## Links
    - [Elasticsearch Circuit Breaker Documentation](https://www.elastic.co/guide/en/elasticsearch/reference/current/circuit-breaker.html)
    - [Kestra Shell Plugin](https://kestra.io/plugins/plugin-scripts-shell)
    - [Kestra Slack Notifications](https://kestra.io/plugins/plugin-slack)
  tags:
    - Data
    - Infrastructure
  subTags:
    - ELT & Data Landing
    - Day 2 Operations
