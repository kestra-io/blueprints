id: batch-budget-kill-switch-with-execution-assertion-sla
namespace: company.team

description: |
  Paged load of a public REST API whose running counters (rows rejected, HTTP error ratio, request spend) are checked
  by `EXECUTION_ASSERTION` SLAs after every task: the run is stopped the moment a budget is exceeded. A flow-level
  `retry` re-runs outages as a new execution, the Schedule disables itself after a kill (`stopAfter`).

labels:
  owner: data-platform
  source: public-api

inputs:
  - id: page_url_template
    type: STRING
    defaults: "https://api.openbrewerydb.org/v1/breweries?per_page={size}&page={page}"
    description: |
      URL of one page. `{page}` is replaced by the 1-based page number and `{size}` by `page_size`. The default is the
      Open Brewery DB, a free public API that needs no key. Any JSON API that returns an array per page works.

  - id: page_size
    type: INT
    defaults: 50
    description: Rows requested per page (1 to 200; the default API caps at 200). The last page is detected when a page comes back shorter than this.

  - id: max_pages
    type: INT
    defaults: 10
    description: Upper bound on pages per run. A run that reaches it before the last page gets the label batch_complete=false.

  - id: reject_when
    type: STRING
    defaults: ".postal_code == null or .latitude == null or .longitude == null"
    description: |
      jq boolean expression evaluated per row; rows for which it is true are rejected (counted, not written). Change it to
      the fields your API must deliver. The expression is wrapped in `select(...)`, so it must be a single jq boolean.

  - id: max_rejected_rows
    type: INT
    defaults: 150
    description: Kill switch 1. The run fails as soon as the running count of rejected rows exceeds this number.

  - id: max_error_ratio
    type: FLOAT
    defaults: 0.2
    description: Kill switch 2. Fraction of pages (0 to 1) that may come back with an HTTP status of 400 or more before the run fails.

  - id: min_pages_for_ratio
    type: INT
    defaults: 3
    description: The error ratio is only judged once this many pages were fetched, so one early 503 cannot kill a run on its own.

  - id: cost_per_request
    type: FLOAT
    defaults: 0.001
    description: Price you pay per API request (metered APIs, geocoders, LLM endpoints). The default API is free; the value is only used for the spend counter.

  - id: max_cost
    type: FLOAT
    defaults: 0.05
    description: Kill switch 3. The run is cancelled when `requests * cost_per_request` would exceed this. Requests made by earlier retry attempts of the same run count too.

  - id: state_key
    type: STRING
    defaults: api_batch_budget
    description: Prefix of the KV entries written by this flow (`<state_key>_last_run`, `_last_kill`, `_last_failure`).

variables:
  dead_letter_ttl: P14D

# Each rule blocks the run with its own message (HTTP 422 on the API) before an execution exists.
checks:
  - when: "{{ inputs.page_url_template contains '{page}' }}"
    message: page_url_template must contain the {page} placeholder, otherwise every iteration would fetch the same page.
    style: ERROR
    behavior: BLOCK_EXECUTION
  - when: "{{ inputs.page_url_template | toJson | jq('test(\"^https?://\")') | first }}"
    message: page_url_template must start with http:// or https://.
    style: ERROR
    behavior: BLOCK_EXECUTION
  - when: "{{ inputs.page_size >= 1 and inputs.page_size <= 200 }}"
    message: page_size must be between 1 and 200.
    style: ERROR
    behavior: BLOCK_EXECUTION
  - when: "{{ inputs.max_pages >= 1 and inputs.min_pages_for_ratio >= 1 }}"
    message: max_pages and min_pages_for_ratio must be at least 1.
    style: ERROR
    behavior: BLOCK_EXECUTION
  - when: "{{ inputs.max_error_ratio >= 0 and inputs.max_error_ratio <= 1 }}"
    message: max_error_ratio is a fraction of pages and must be between 0 and 1 (0.2 means one failed page in five).
    style: ERROR
    behavior: BLOCK_EXECUTION
  - when: "{{ inputs.max_rejected_rows >= 0 and inputs.cost_per_request >= 0 and inputs.max_cost > 0 }}"
    message: max_rejected_rows and cost_per_request cannot be negative, and max_cost must be above zero.
    style: ERROR
    behavior: BLOCK_EXECUTION
  - when: "{{ inputs.cost_per_request <= inputs.max_cost }}"
    message: max_cost is below the price of a single request; the run would be cancelled right after its first page.
    style: ERROR
    behavior: BLOCK_EXECUTION

# One batch at a time; a manual run during the scheduled one waits instead of doubling the spend.
concurrency:
  limit: 1
  behavior: QUEUE

# Flow-level retry. Only a task failure reported by a worker (refused connection, failed Assert) creates the next
# execution; an SLA breach does not. The new execution inherits the execution variables (see init_counters).
retry:
  type: exponential
  behavior: CREATE_NEW_EXECUTION
  interval: PT2M
  maxInterval: PT15M
  maxAttempts: 3
  warningOnRetry: true

# Kill switches. The executor evaluates every EXECUTION_ASSERTION after each task run state change, against the execution
# variables as they are at that moment: `vars.*` are strings, hence `| number`, and `?? '0'` covers the tasks that run
# before init_counters. FAIL ends the run at once (errors starts, finally is killed); CANCEL marks the run and lets the
# remaining tasks finish. Each label names the budget that was hit.
sla:
  - id: rejected_rows_budget
    type: EXECUTION_ASSERTION
    assert: "{{ ((vars.rows_rejected ?? '0') | number) <= inputs.max_rejected_rows }}"
    behavior: FAIL
    labels:
      batch_kill: rejected_rows
  - id: http_error_ratio
    type: EXECUTION_ASSERTION
    assert: "{{ ((vars.pages ?? '0') | number) < inputs.min_pages_for_ratio or ((vars.http_errors ?? '0') | number) <= inputs.max_error_ratio * ((vars.pages ?? '0') | number) }}"
    behavior: FAIL
    labels:
      batch_kill: error_ratio
  - id: request_cost_budget
    type: EXECUTION_ASSERTION
    assert: "{{ ((vars.requests ?? '0') | number) * inputs.cost_per_request <= inputs.max_cost }}"
    behavior: CANCEL
    labels:
      batch_kill: cost
  - id: max_runtime
    type: MAX_DURATION
    duration: PT2H
    behavior: FAIL
    labels:
      batch_kill: max_duration

# Observed: stopAfter watched the whole retry chain and disabled the trigger two seconds after the last attempt ended FAILED.
triggers:
  - id: daily
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 2 * * *"
    recoverMissedSchedules: LAST
    stopAfter:
      - FAILED
      - CANCELLED
    description: |
      Daily at 02:00. `stopAfter` disables this trigger after a kill, a cancelled cost run or exhausted retries, so the
      batch stays off until someone has looked and re-enabled it (Flow page, Triggers tab).

tasks:
  - id: init_counters
    type: io.kestra.plugin.core.execution.SetVariables
    description: |
      Every counter the SLAs read. Execution variables are inherited by the executions that the flow-level `retry` creates,
      so `requests` (money already spent on this run) is carried over on purpose while the row counters start again.
    variables:
      pages: "0"
      next_page: "1"
      rows_seen: "0"
      rows_rejected: "0"
      http_errors: "0"
      requests: "{{ vars.requests ?? '0' }}"
      files: "[]"
      last_page: "false"

  - id: log_start
    type: io.kestra.plugin.core.log.Log
    message: "Starting {{ execution.id == execution.originalId ? 'a new run' : 'retry of run ' ~ execution.originalId }}: up to {{ inputs.max_pages }} pages of {{ inputs.page_size }}, requests already paid for by earlier attempts: {{ vars.requests }}"

  - id: pages
    type: io.kestra.plugin.core.flow.LoopUntil
    description: |
      One iteration per page. The SLAs are evaluated by the executor after every task run of this loop, so a budget breach is
      caught right after the counter task that crosses it and no further page is requested.
    condition: "{{ vars.last_page == 'true' or (vars.pages | number) >= inputs.max_pages }}"
    checkFrequency:
      interval: PT0.5S
      maxIterations: "{{ inputs.max_pages + 1 }}"
    tasks:
      - id: fetch_page
        type: io.kestra.plugin.core.http.Request
        description: |
          `allowFailed: true` turns a 4xx or 5xx into a code the counters can judge instead of a failed task; a connection
          error fails the task and the flow-level `retry` re-runs the batch later as a new execution. No task-level `retry`
          here on purpose: on 2.0.5 a task with its own retry exhausts it and the execution ends FAILED, the flow-level
          retry never takes over (tested with a refused port).
        uri: "{{ inputs.page_url_template | replace({'{page}': vars.next_page, '{size}': inputs.page_size ~ ''}) }}"
        method: GET
        options:
          allowFailed: true
          timeout:
            connectTimeout: PT10S
            readIdleTimeout: PT30S

      - id: count_request
        type: io.kestra.plugin.core.execution.SetVariables
        description: |
          A request is paid for as soon as it returns a status, so it is counted before the body is parsed. The cost SLA is
          evaluated right after this task; a retry attempt that would overspend is cancelled before it parses anything.
        variables:
          requests: "{{ (vars.requests | number) + 1 }}"
          page_ok: "{{ outputs.fetch_page.code == 200 }}"

      - id: measure_page
        type: io.kestra.plugin.core.execution.SetVariables
        description: Fails on a body that is not a JSON array (HTML error page, wrong endpoint); the flow-level retry takes over.
        variables:
          page_rows: "{{ outputs.fetch_page.code == 200 ? (outputs.fetch_page.body | jq('length') | first) : 0 }}"
          page_rejected: "{{ outputs.fetch_page.code == 200 ? (outputs.fetch_page.body | jq('[.[] | select(' ~ inputs.reject_when ~ ')] | length') | first) : 0 }}"

      - id: save_page
        type: io.kestra.plugin.core.storage.Write
        description: Accepted rows of this page as JSON lines in internal storage; `finally` concatenates the pages.
        runIf: "{{ vars.page_ok == 'true' and (vars.page_rows | number) > (vars.page_rejected | number) }}"
        extension: .jsonl
        content: "{{ outputs.fetch_page.body | jq('[.[] | select(' ~ inputs.reject_when ~ ' | not) | tojson] | join(\"\\n\")') | first }}"

      - id: add_to_counters
        type: io.kestra.plugin.core.execution.SetVariables
        description: The rejected-rows and error-ratio SLAs are evaluated right after this task.
        variables:
          pages: "{{ (vars.pages | number) + 1 }}"
          next_page: "{{ (vars.next_page | number) + 1 }}"
          http_errors: "{{ (vars.http_errors | number) + (vars.page_ok == 'true' ? 0 : 1) }}"
          rows_seen: "{{ (vars.rows_seen | number) + (vars.page_rows | number) }}"
          rows_rejected: "{{ (vars.rows_rejected | number) + (vars.page_rejected | number) }}"
          last_page: "{{ vars.page_ok == 'true' and (vars.page_rows | number) < inputs.page_size }}"
          files: "{{ vars.page_ok == 'true' and (vars.page_rows | number) > (vars.page_rejected | number) ? (fromJson(vars.files) | merge([outputs.save_page.uri]) | toJson) : vars.files }}"

      - id: log_page
        type: io.kestra.plugin.core.log.Log
        level: "{{ vars.page_ok == 'true' ? 'INFO' : 'WARN' }}"
        message: "page {{ vars.pages }}: HTTP {{ outputs.fetch_page.code }}, {{ vars.page_rows }} rows, {{ vars.page_rejected }} rejected. Totals: {{ vars.rows_rejected }} rejected, {{ vars.http_errors }} HTTP errors, spend {{ ((vars.requests | number) * inputs.cost_per_request) | numberFormat('0.####') }} of {{ inputs.max_cost }}"

  - id: require_rows
    type: io.kestra.plugin.core.execution.Assert
    description: |
      An API that answers 200 with empty arrays (wrong path, expired filter) is an upstream failure, not a success.
      Skipped after a CANCEL kill: Kestra 2.0.5 marks the execution CANCELLED but still runs the tasks that follow the loop.
    runIf: "{{ (labels.batch_kill ?? '') == '' }}"
    conditions:
      - "{{ (vars.rows_seen | number) - (vars.rows_rejected | number) > 0 }}"
    errorMessage: "No row was accepted: {{ vars.pages }} pages fetched, {{ vars.rows_seen }} rows seen, {{ vars.rows_rejected }} rejected, {{ vars.http_errors }} HTTP errors."

  - id: log_summary
    type: io.kestra.plugin.core.log.Log
    message: "{{ (labels.batch_kill ?? '') != '' ? 'Stopped by the ' ~ labels.batch_kill ~ ' kill switch' : 'Finished' }}: {{ vars.pages }} pages, {{ vars.rows_seen }} rows, {{ (vars.rows_seen | number) - (vars.rows_rejected | number) }} accepted, {{ vars.rows_rejected }} rejected, {{ vars.http_errors }} HTTP errors, {{ vars.requests }} requests ({{ ((vars.requests | number) * inputs.cost_per_request) | numberFormat('0.####') }}), last page reached: {{ vars.last_page }}"

errors:
  - id: capture_error
    type: io.kestra.plugin.core.output.OutputValues
    description: Read `errorLogs()` once, before this branch adds lines of its own. It needs a worker task; SetVariables cannot call it.
    values:
      error_summary: "{{ errorLogs() | jq('[.[] | select(.level == \"ERROR\") | ((.taskId // \"flow\") + \": \" + (.message | split(\"\\n\")[0]))] | unique | join(\" | \")') | first }}"

  - id: log_failure
    type: io.kestra.plugin.core.log.Log
    level: ERROR
    message: "Batch failed on attempt {{ execution.id }} of run {{ execution.originalId }} after {{ vars.pages ?? 0 }} pages: {{ outputs.capture_error.values.error_summary ?? 'no ERROR log line' }}"

  - id: remember_failure
    type: io.kestra.plugin.core.kv.Set
    description: Dead letter for task failures (connection errors, no accepted rows). The retry chain shares one `original` id.
    key: "{{ inputs.state_key }}_last_failure"
    kvType: JSON
    ttl: "{{ vars.dead_letter_ttl }}"
    value: |
      {"execution": "{{ execution.id }}", "original": "{{ execution.originalId }}", "flow": "{{ flow.id }}",
       "failed_at": "{{ now() }}", "pages": {{ vars.pages ?? 0 }}, "rows_seen": {{ vars.rows_seen ?? 0 }},
       "rows_rejected": {{ vars.rows_rejected ?? 0 }}, "http_errors": {{ vars.http_errors ?? 0 }},
       "requests": {{ vars.requests ?? 0 }}, "page_files": {{ vars.files ?? '[]' }},
       "error": {{ (outputs.capture_error.values.error_summary ?? '') | toJson }}}

  - id: alert_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: |
      Task failures only. After an SLA with `behavior: FAIL` the executor kills worker tasks that are still running in this
      branch about a second later (observed on 2.0.5), so kills are reported from `afterExecution` instead.
    runIf: "{{ (labels.batch_kill ?? '') == '' }}"
    allowFailure: true
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    messageText: "Batch {{ flow.id }} failed after {{ vars.pages ?? 0 }} pages ({{ vars.requests ?? 0 }} requests so far on run {{ execution.originalId }}). {{ outputs.capture_error.values.error_summary ?? '' }} {{ kestra.url ?? '' }}/ui/main/executions/{{ flow.namespace }}/{{ flow.id }}/{{ execution.id }}"

# Runs after SUCCESS, a task failure and a CANCEL kill; after a FAIL kill its tasks are submitted and then killed.
finally:
  - id: assemble
    type: io.kestra.plugin.core.storage.Concat
    description: |
      Runs after a success, after a task failure and after a CANCEL kill. After a FAIL kill Kestra 2.0.5 submits this block
      and then kills its tasks, so a killed run keeps its per-page files unassembled; their URIs are in the `_last_kill` entry.
    runIf: "{{ fromJson(vars.files ?? '[]') | length > 0 }}"
    files: "{{ vars.files }}"
    separator: "\n"
    extension: .jsonl

  - id: dataset_size
    type: io.kestra.plugin.core.storage.Size
    runIf: "{{ fromJson(vars.files ?? '[]') | length > 0 }}"
    uri: "{{ outputs.assemble.uri }}"

# The only block that ran to completion after every end state in the test runs: SUCCESS, FAILED, CANCELLED and RETRIED.
afterExecution:
  - id: label_outcome
    type: io.kestra.plugin.core.execution.Labels
    description: Runs for every final state, SLA kills included; this is the only hook that does on 2.0.5.
    labels:
      batch_outcome: "{{ (labels.batch_kill ?? '') != '' ? 'killed' : ((execution.state == 'SUCCESS' or execution.state == 'WARNING') ? 'completed' : (execution.state == 'RETRIED' ? 'retrying' : 'failed')) }}"
      batch_complete: "{{ vars.last_page ?? 'false' }}"
      batch_pages: "{{ vars.pages ?? '0' }}"
      batch_rows_rejected: "{{ vars.rows_rejected ?? '0' }}"
      batch_requests: "{{ vars.requests ?? '0' }}"

  - id: publish_counters
    type: io.kestra.plugin.core.metric.Publish
    metrics:
      - name: batch_pages
        type: counter
        value: "{{ (vars.pages ?? '0') | number }}"
      - name: batch_rows_rejected
        type: counter
        value: "{{ (vars.rows_rejected ?? '0') | number }}"
      - name: batch_http_errors
        type: counter
        value: "{{ (vars.http_errors ?? '0') | number }}"
      - name: batch_request_cost
        type: gauge
        value: "{{ ((vars.requests ?? '0') | number) * inputs.cost_per_request }}"

  - id: checkpoint
    type: io.kestra.plugin.core.kv.Set
    description: Last known counters of every run, whatever its end, for dashboards and for the next operator.
    key: "{{ inputs.state_key }}_last_run"
    kvType: JSON
    value: |
      {"execution": "{{ execution.id }}", "original": "{{ execution.originalId }}", "state": "{{ execution.state }}",
       "kill": "{{ labels.batch_kill ?? '' }}", "ended_at": "{{ now() }}", "pages": {{ vars.pages ?? 0 }},
       "rows_seen": {{ vars.rows_seen ?? 0 }}, "rows_rejected": {{ vars.rows_rejected ?? 0 }},
       "http_errors": {{ vars.http_errors ?? 0 }}, "requests": {{ vars.requests ?? 0 }},
       "cost": {{ ((vars.requests ?? '0') | number) * inputs.cost_per_request }}, "last_page": {{ vars.last_page ?? false }}}

  - id: record_kill
    type: io.kestra.plugin.core.kv.Set
    description: Dead letter for SLA kills. The `errors` branch never runs for CANCEL and is cut short for FAIL, so it is written here.
    runIf: "{{ (labels.batch_kill ?? '') != '' }}"
    key: "{{ inputs.state_key }}_last_kill"
    kvType: JSON
    ttl: "{{ vars.dead_letter_ttl }}"
    value: |
      {"execution": "{{ execution.id }}", "killed_by": "{{ labels.batch_kill }}", "state": "{{ execution.state }}",
       "killed_at": "{{ now() }}", "pages": {{ vars.pages ?? 0 }}, "rows_rejected": {{ vars.rows_rejected ?? 0 }},
       "http_errors": {{ vars.http_errors ?? 0 }}, "requests": {{ vars.requests ?? 0 }},
       "limits": {"max_rejected_rows": {{ inputs.max_rejected_rows }}, "max_error_ratio": {{ inputs.max_error_ratio }}, "max_cost": {{ inputs.max_cost }}},
       "page_files": {{ vars.files ?? '[]' }}}

  - id: notify_outcome
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Completed runs and kills are reported here; task failures were already reported by the `errors` branch.
    runIf: "{{ (execution.state == 'SUCCESS' or execution.state == 'WARNING') or (labels.batch_kill ?? '') != '' }}"
    allowFailure: true
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    messageText: "Batch {{ flow.id }} {{ (labels.batch_kill ?? '') != '' ? 'was stopped by the ' ~ labels.batch_kill ~ ' kill switch (' ~ execution.state ~ ')' : 'completed (' ~ execution.state ~ ')' }} after {{ vars.pages ?? 0 }} pages: {{ vars.rows_seen ?? 0 }} rows, {{ vars.rows_rejected ?? 0 }} rejected, {{ vars.http_errors ?? 0 }} HTTP errors, {{ vars.requests ?? 0 }} requests. {{ kestra.url ?? '' }}/ui/main/executions/{{ flow.namespace }}/{{ flow.id }}/{{ execution.id }}"

outputs:
  - id: accepted_rows
    type: FILE
    value: "{{ outputs.assemble.uri ?? null }}"
  - id: counters
    type: JSON
    value: |
      {"pages": {{ vars.pages ?? 0 }}, "rows_seen": {{ vars.rows_seen ?? 0 }}, "rows_rejected": {{ vars.rows_rejected ?? 0 }},
       "http_errors": {{ vars.http_errors ?? 0 }}, "requests": {{ vars.requests ?? 0 }},
       "accepted_bytes": {{ outputs.dataset_size.size ?? 0 }}, "last_page": {{ vars.last_page ?? false }}}

extend:
  title: Batch budget kill switch with EXECUTION_ASSERTION SLAs, flow-level retry and stopAfter
  metaTitle: Stop a Paged API Batch When Rejected Rows, Error Ratio or Spend Exceed a Budget | Kestra
  shortDescription: Paged load of a REST API whose running counters are checked by EXECUTION_ASSERTION SLAs after every task. A breach fails or cancels the run at once, afterExecution reports it, a flow-level retry re-runs outages and the Schedule disables itself after a kill.
  metaDescription: Kestra EXECUTION_ASSERTION SLAs on execution variables, behavior FAIL and CANCEL with labels, MAX_DURATION, flow-level retry with CREATE_NEW_EXECUTION and warningOnRetry, Schedule stopAfter, KV dead letters.
  description: |
    A paged API load that cannot run away. Each page is fetched with `http.Request`, judged with jq, written to internal storage, and added to execution variables: pages, rows seen, rows rejected, HTTP errors, requests. Three `EXECUTION_ASSERTION` SLAs read those variables and stop the run the moment a budget is exceeded: too many rejected rows (`behavior: FAIL`), too many failed pages (`FAIL`), too much spend (`CANCEL`). A `MAX_DURATION` SLA caps the wall clock. `afterExecution` labels the outcome, publishes metrics, checkpoints the counters in the KV store and sends the result, whatever the final state. A flow-level `retry` with `CREATE_NEW_EXECUTION` re-runs connection failures as fresh executions that still remember the money spent, and the Schedule trigger uses `stopAfter` to disable itself after a kill until a person has looked. The default source is the Open Brewery DB, a free API that needs no key; any JSON API that returns an array per page works.

    ## How it works

    1. `checks` block a run before it exists when the URL template has no `{page}` placeholder, the page size is out of range, the error ratio is not a fraction, or `max_cost` is below the price of one request. Each rule has its own message, returned with HTTP 422.
    2. `init_counters` sets every counter as a string (`SetVariables` stores strings). `requests` is seeded from `vars.requests`, which is empty on a first run and carries the spend of earlier attempts on a retry.
    3. `pages` (`LoopUntil`) runs one iteration per page until a page comes back shorter than `page_size` or `max_pages` is reached. Inside: `fetch_page` with `allowFailed: true`, so a 4xx or 5xx becomes a status code the counters can judge instead of a failed task; `count_request` adds the paid request; `measure_page` counts rows and rows matching `reject_when`; `save_page` writes the accepted rows as JSON lines; `add_to_counters` updates the totals and the list of page files.
    4. The SLAs are evaluated after every task of that loop (see below). A breach applies the `batch_kill` label and ends the run.
    5. `require_rows` fails a run that fetched only empty pages, since a wrong path or an expired filter answers 200 with `[]`.
    6. `finally` concatenates the page files into one `.jsonl` and measures it. `afterExecution` runs `label_outcome`, `publish_counters`, `checkpoint` (`<state_key>_last_run`), `record_kill` (`<state_key>_last_kill`, only after a kill) and `notify_outcome`.
    7. `errors` handles task failures: `capture_error` reads `errorLogs()` once, `log_failure` and `alert_failure` report it, `remember_failure` writes `<state_key>_last_failure` with a TTL.

    ## When an EXECUTION_ASSERTION is evaluated (Kestra 2.0.5, observed)

    - The executor evaluates every `EXECUTION_ASSERTION` each time a task run of the execution changes state, not on a timer. In the test runs the WARN line `SLA 'rejected_rows_budget' violated` was logged 3 ms after the `SetVariables` task that crossed the limit. A limit crossed by page 4 stops the run before page 5 is requested.
    - The assertion sees execution variables as they are at that moment. `vars.*` are strings, so compare with `| number`, and use `?? '0'` for the tasks before `init_counters`.
    - `behavior: CANCEL` sets the execution to CANCELLED, applies the label and stops the loop, but the tasks after the loop still run to the end, and so do `finally` and `afterExecution`. `errors` does not run. This flow puts `runIf: "{{ (labels.batch_kill ?? '') == '' }}"` on `require_rows` for that reason.
    - `behavior: FAIL` sets the execution to FAILED at once and logs `Execution failed due to SLA ... violated`. `errors` starts, `finally` is submitted, and worker tasks of both that are still running about one second later are KILLED (a Slack post in `errors` was killed in three of the test runs; `kv.Set` and `OutputValues` finished in time). `afterExecution` usually runs completely (its `kv.Set`, `Labels` and `metric.Publish` tasks did in every test run), but its Slack post was KILLED in one run out of four, so the KV kill record and the labels are the signals to rely on; the Slack message is best effort.
    - `MAX_DURATION` is checked by a timer, about once a second: a `PT3S` copy was failed at `PT4.003S`. The running task is KILLED.
    - An SLA breach does not start the flow-level `retry`, so a kill is final. The `_last_kill` entry and the `batch_kill` label say which budget was hit, and `stopAfter` disabled the Schedule two seconds after the last attempt of a chain ended FAILED.

    ## Flow-level retry, observed

    - `CREATE_NEW_EXECUTION` creates a new execution per attempt. All attempts share `execution.originalId` and the `system.correlationId` label, and inherit the execution variables of the previous attempt. The test chain started with 2 requests paid, then 4, then 6, and with `max_cost: 0.005` the third attempt was cancelled by the cost SLA after its first page.
    - The retry only follows a task failure reported by a worker (refused connection, failed `Assert`). A Pebble error in `SetVariables`, for example a body that is not a JSON array, fails the execution without a retry. A task that has its own `retry` is not covered either: it exhausts its attempts and the execution ends FAILED, which is why `fetch_page` has none.
    - Attempts that end RETRIED run `afterExecution` (label `batch_outcome: retrying`) but their `errors` branch is cut short; the last attempt, which ends FAILED, runs it completely, so one failure alert is sent per chain.

    ## What you get

    - `accepted_rows` output: one `.jsonl` file of every accepted row of a completed run.
    - `counters` output and labels `batch_outcome` (completed, killed, retrying, failed), `batch_kill`, `batch_complete`, `batch_pages`, `batch_requests`.
    - Metrics `batch_pages`, `batch_rows_rejected`, `batch_http_errors` and the gauge `batch_request_cost`.
    - KV entries `<state_key>_last_run` (every run), `_last_kill` and `_last_failure` (14-day TTL) with the counters, the limits and the URIs of the page files, which a killed run leaves unassembled in internal storage.

    ## Quick start

    1. Add the `SLACK_WEBHOOK_URL` secret, or remove the two Slack tasks.
    2. Run with the defaults: 10 pages of 50 breweries, about 100 rows rejected for missing coordinates.
    3. Run with `max_rejected_rows: 15` and `page_size: 20` to watch the rejected-rows kill, or `max_cost: 0.003` for the cost cancel.
    4. Point `page_url_template` (placeholders `{page}` and `{size}`) at your API, set `reject_when` to its mandatory fields, and set the budgets from a few normal runs.

    ## How to adapt

    - Add a fourth budget as one more `sla` entry: anything the counters can express, for example consecutive failed pages.
    - Replace `save_page` and `assemble` with a database load per page; keep the counters.
    - Use `behavior: CANCEL` for budgets where the pages already fetched are worth keeping, `FAIL` where the result cannot be trusted.
    - Set `maxAttempts`, the retry intervals and `MAX_DURATION` from the outage pattern and the batch window of your API.

