id: redis-rdb-save-last-bgsave-status-sentinel
namespace: company.database

inputs:
  - id: redis_host
    type: STRING
    defaults: "redis.internal"
    description: Redis server hostname or IP address.
  - id: redis_port
    type: INT
    defaults: 6379
    description: Redis server port.

tasks:
  - id: query_rdb_bgsave_status
    type: io.kestra.plugin.scripts.shell.Commands
    containerImage: redis:latest
    commands:
      - |
        AUTH_ARG=""
        if [ -n "{{ secret('REDIS_PASSWORD') }}" ]; then
          AUTH_ARG="-a {{ secret('REDIS_PASSWORD') }}"
        fi
        
        BGSAVE_STATUS=$(redis-cli -h "{{ inputs.redis_host }}" -p {{ inputs.redis_port }} $AUTH_ARG info persistence 2>/dev/null | grep "rdb_last_bgsave_status:" | cut -d':' -f2 | awk '{print }')
        BGSAVE_STATUS=${BGSAVE_STATUS:-unknown}
        
        echo "::set-output name=bgsave_status::$BGSAVE_STATUS::"

  - id: evaluate_bgsave_health
    type: io.kestra.plugin.core.flow.If
    condition: '{{ outputs.query_rdb_bgsave_status.vars.bgsave_status != "ok" }}'
    then:
      - id: notify_infrastructure_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#infrastructure-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 Redis RDB Background Snapshot (bgsave) Failure Alert",
                "text": "Redis instance `{{ inputs.redis_host }}:{{ inputs.redis_port }}` reported failing RDB snapshot status: `{{ outputs.query_rdb_bgsave_status.vars.bgsave_status }}` (expected: `ok`). Impact: Under `stop-writes-on-bgsave-error yes` (default), Redis will refuse all incoming WRITE commands with `MISCONF Errors writing to the AOF/RDB file`, causing total application write outages.",
                "footer": "Kestra In-Memory Sentinel • Redis RDB Persistence"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#infrastructure-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ Redis RDB Save Sentinel Execution Failed",
            "text": "The Redis bgsave status query workflow encountered an execution error. Please verify Redis connectivity and credentials.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  metaDescription: "Audits Redis persistence telemetry to detect failing RDB background snapshots causing MISCONF write rejection outages."
  metaTitle: Redis RDB Background Snapshot bgsave Failure and Write Outage Sentinel with Kestra
  title: Redis RDB Background Snapshot bgsave Failure and Write Outage Sentinel
  shortDescription: Audits Redis persistence telemetry to detect failing RDB background snapshots causing MISCONF write rejection outages.
  description: |
    ## How it works
    This workflow connects to the target Redis instance using official `redis-cli` inside a containerized runner to sample `info persistence`. It evaluates `rdb_last_bgsave_status`. When fork failures occur (due to memory allocation limits or disk write permission errors), `rdb_last_bgsave_status` transitions to `err`. Under standard Redis configurations (`stop-writes-on-bgsave-error yes`), Redis rejects all incoming write queries, precipitating catastrophic application outages. A critical Slack alert is immediately triggered.

    ## What you get
    - Instant alerting upon failed disk snapshots before writes are disabled.
    - Prevents hard application write rejections (`MISCONF Redis is configured to save RDB snapshots`).
    - Pinpoints fork memory issues or underlying storage volume exhaustion.

    ## Who it's for
    - Database Administrators (DBAs) and SREs maintaining production Redis persistence.
    - Platform Engineers operating persistent cache and session stores.

    ## Why orchestrate this with Kestra
    - **Continuous Reliability**: Automate health polling every 15 minutes without maintaining custom scripts.
    - **Zero Dependencies**: Executes inside official Redis Docker images.
    - **Emergency Incident Escalation**: Route critical persistence failures directly to on-call SRE channels.

    ## Prerequisites
    - Network reachability to target Redis instance.
    - Secrets `REDIS_PASSWORD` and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import this blueprint into Kestra.
    2. Configure Redis host, port, and password secret.
    3. Run the flow to audit RDB snapshot health.

    ## How to extend
    - Query `rdb_last_cow_size` and `rdb_last_bgsave_time_sec` to assess copy-on-write memory overhead.
    - Inspect host disk space via SSH or node exporter.

    ## Links
    - [Redis Persistence Documentation](https://redis.io/docs/latest/operate/oss_and_stack/management/persistence/)
    - [Kestra Shell Plugin](https://kestra.io/plugins/plugin-scripts/commands/io.kestra.plugin.scripts.shell.commands)
  tags:
    - Data
    - Infrastructure
  subTags:
    - ELT & Data Landing
    - Day 2 Operations
  ee: false
  demo: false
