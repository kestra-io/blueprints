id: python-wheel-record-integrity-gate
namespace: company.packaging
description: Audit every wheel member against its RECORD hashes before a separate package-promotion step. Never
  installs, imports or extracts candidate code.
inputs:
- id: wheel
  type: FILE
  description: A trusted-source candidate .whl file, at most 25 MiB. Internal integrity is not publisher authenticity.
tasks:
- id: archive_size
  type: io.kestra.plugin.core.storage.Size
  uri: '{{ inputs.wheel }}'
- id: bound_archive
  type: io.kestra.plugin.core.execution.Assert
  conditions:
  - '{{ outputs.archive_size.size > 0 and outputs.archive_size.size <= 26214400 }}'
- id: audit_record
  type: io.kestra.plugin.scripts.python.Script
  description: Read the ZIP and validate member paths, bounded expansion, RECORD coverage, sizes and SHA256/384/512
    hashes without extraction.
  taskRunner:
    type: io.kestra.plugin.core.runner.Process
  inputFiles:
    candidate.whl: '{{ inputs.wheel }}'
  outputFiles:
  - wheel-audit.json
  script: |
    """Bounded wheel archive RECORD audit. Does not import, install or extract code."""
    import base64,csv,hashlib,io,json,os,posixpath,re,stat,zipfile
    from pathlib import Path
    MAX_ARCHIVE=25*1024*1024
    MAX_EXPANDED=100*1024*1024
    MAX_FILES=10000
    MAX_RECORD=4*1024*1024
    class InvalidWheel(ValueError):pass
    def require(ok,msg):
     if not ok:raise InvalidWheel(msg)
    def safe_name(name):
     require(name and '\\' not in name and not name.startswith('/') and '\x00' not in name,'unsafe archive path')
     require(not re.match(r'^[A-Za-z]:',name),'drive-qualified path')
     require(all(p not in ['.','..',''] for p in name.rstrip('/').split('/')),'non-canonical archive path')
     return name

    def audit(path):
     p=Path(path);require(0<p.stat().st_size<=MAX_ARCHIVE,'archive size out of bounds')
     findings=[]
     with zipfile.ZipFile(p) as z:
      infos=z.infolist();require(0<len(infos)<=MAX_FILES,'entry count out of bounds');names=[safe_name(i.filename) for i in infos];require(len(set(names))==len(names),'duplicate archive path')
      require(sum(i.file_size for i in infos)<=MAX_EXPANDED,'expanded size exceeds bound')
      for i in infos:
       require(not i.flag_bits&1,'encrypted member');require(not stat.S_ISLNK(i.external_attr>>16),'symlink member')
       require(i.compress_type in [zipfile.ZIP_STORED,zipfile.ZIP_DEFLATED],'unsupported compression')
      files={i.filename:i for i in infos if not i.is_dir()};roots={n.split('/')[0] for n in files if n.split('/')[0].endswith('.dist-info')};require(len(roots)==1,'expected one top-level dist-info directory');root=next(iter(roots));record=root+'/RECORD'
      for n in ['METADATA','WHEEL','RECORD']:require(root+'/'+n in files,'missing required '+n)
      require(files[record].file_size<=MAX_RECORD,'RECORD exceeds bound')
      text=z.read(record).decode('utf-8');rows=list(csv.reader(io.StringIO(text,newline='')));require(len(rows)<=MAX_FILES,'RECORD row count exceeds bound');entries={}
      for row in rows:
       require(len(row)==3,'RECORD row must have three columns');name=safe_name(row[0]);require(name not in entries,'duplicate RECORD path');entries[name]=row[1:]
      signatures={root+'/RECORD.jws',root+'/RECORD.p7s'}
      for name in entries:
       if name not in files:findings.append({'path':name,'reason':'recorded file missing from archive'})
       if name in signatures:findings.append({'path':name,'reason':'signature must not appear in RECORD'})
      checked=0
      for name,info in files.items():
       if name in signatures:continue
       if name not in entries:findings.append({'path':name,'reason':'archive file missing from RECORD'});continue
       digest,size=entries[name]
       if name==record:
        if digest or size:findings.append({'path':name,'reason':'RECORD self hash/size must be empty'})
        continue
       if not re.fullmatch(r'0|[1-9][0-9]*',size) or int(size)!=info.file_size:findings.append({'path':name,'reason':'size mismatch or invalid size'})
       try:
        algorithm,encoded=digest.split('=',1);require(algorithm in ['sha256','sha384','sha512'],'unsupported or weak hash algorithm');require(bool(re.fullmatch(r'[A-Za-z0-9_-]+',encoded)),'invalid unpadded base64url digest');expected=base64.urlsafe_b64decode(encoded+'='*((-len(encoded))%4));h=hashlib.new(algorithm);require(len(expected)==h.digest_size,'incorrect digest length');require(base64.urlsafe_b64encode(expected).rstrip(b'=').decode()==encoded,'non-canonical digest')
        with z.open(info) as f:
         observed=0
         while True:
          chunk=f.read(65536)
          if not chunk:break
          observed+=len(chunk);require(observed<=info.file_size,'member larger than declaration');h.update(chunk)
        if h.digest()!=expected:findings.append({'path':name,'reason':'hash mismatch'})
        checked+=1
       except (ValueError,InvalidWheel) as e:findings.append({'path':name,'reason':str(e)})
      # Even excluded signature files must have readable ZIP CRCs; they are not verified signatures.
      for name in signatures & files.keys():
       with z.open(name) as f:
        while f.read(65536):pass
      return {'valid':not findings,'files_checked':checked,'archive_files':len(files),'expanded_bytes':sum(i.file_size for i in infos),'findings':findings,'signature_files':sorted(signatures & files.keys()),'scope':'internal RECORD integrity only; not publisher authenticity, malware or vulnerability clearance'}
    def main():
     try:report=audit('candidate.whl')
     except (InvalidWheel,ValueError,UnicodeError,csv.Error,zipfile.BadZipFile,NotImplementedError,RuntimeError,OSError) as e:report={'valid':False,'findings':[{'reason':str(e)}],'scope':'internal RECORD integrity only; not publisher authenticity, malware or vulnerability clearance'}
     Path('wheel-audit.json').write_text(json.dumps(report,indent=2));print('::'+json.dumps({'outputs':{'valid':report['valid']}})+'::')
    if __name__=='__main__':main()
- id: publish_audit
  type: io.kestra.plugin.core.output.OutputValues
  values:
    audit_uri: '{{ outputs.audit_record.outputFiles[''wheel-audit.json''] }}'
    record_valid: '{{ outputs.audit_record.vars.valid }}'
- id: integrity_gate
  type: io.kestra.plugin.core.flow.If
  condition: '{{ outputs.audit_record.vars.valid }}'
  then:
  - id: integrity_verified
    type: io.kestra.plugin.core.log.Log
    message: RECORD checks passed. Retain wheel-audit.json; publisher trust, malware and vulnerability checks are
      still required.
  else:
  - id: reject_wheel
    type: io.kestra.plugin.core.execution.Fail
    errorMessage: Wheel RECORD or archive checks failed. Inspect wheel-audit.json before promotion.
triggers:
- id: scheduled_candidate
  type: io.kestra.plugin.core.trigger.Schedule
  cron: 0 7 * * *
  disabled: true
  inputs:
    wheel: '{{ kv(''wheel_candidate_uri'') }}'
extend:
  title: Audit Python Wheel RECORD Integrity Before Package Promotion
  metaTitle: Python Wheel RECORD Integrity Gate | Kestra
  shortDescription: Verify wheel member hashes, sizes and archive safety bounds without installing candidate code,
    then preserve a JSON audit before the promotion gate.
  metaDescription: Audit Python wheel RECORD hashes, member sizes and ZIP safety bounds without installing code,
    saving JSON evidence before a package promotion gate.
  description: |
    ## How it works
    1. A manual FILE input supplies a wheel already obtained through your trusted build or download process. A disabled schedule can reuse a staged Kestra storage URI.
    2. Storage Size and Assert reject empty or over-25-MiB archives before Python starts. The Process runner uses the worker's Python standard library, with no pip install.
    3. Python checks ZIP paths, duplicate names, encrypted entries, symlinks and expansion bounds. It locates one top-level dist-info directory and reads its RECORD CSV.
    4. Every ordinary file must have a matching RECORD row, byte size and SHA256/384/512 digest. RECORD must omit its own hash and size. Legacy signature files are reported but not authenticated.
    5. OutputValues publishes the JSON artifact before If allows the success branch or explicitly fails the execution.

    ## What you get
    - A durable wheel-audit.json with per-file findings and checked-file counts.
    - Fail-closed archive limits: 25 MiB compressed, 100 MiB declared expansion, 10,000 entries and a 4 MiB RECORD.
    - No candidate extraction, import, installation or execution. This is an integrity gate, not a complete wheel conformance validator or proof of publisher trust.

    ## Who it's for
    Platform and Python packaging teams reviewing a wheel before copying it into an internal package repository.

    ## Why orchestrate this with Kestra
    The input-size guard, artifact publication and promotion decision have separate task states. Failed integrity checks retain evidence for review instead of hiding a failed command inside a larger deployment script.

    ## Prerequisites
    Use a worker with Python 3 and the Python Script plugin. The Process runner needs no network access for the audit itself. Choose candidate files through an authenticated build or registry process; an attacker can rewrite a file and its RECORD together.

    ### Secrets
    None. The blueprint does not contact a registry or install packages.

    ## Quick start
    1. Import the flow and upload a small known-good .whl as the wheel input.
    2. Execute manually and inspect the published JSON artifact.
    3. Change a member without changing RECORD and confirm the gate fails with evidence.
    4. For scheduled use, stage the candidate in Kestra storage and set wheel_candidate_uri in the namespace KV store before enabling the trigger.

    ## How to extend
    Add publisher attestation and vulnerability checks as independent gates, then call an explicitly approved promotion subflow. Do not treat matching self-declared hashes as a security approval. This policy intentionally accepts SHA256, SHA384 and SHA512 only.

    ## Links
    - [Python Script task](https://kestra.io/plugins/plugin-script-python/io.kestra.plugin.scripts.python.script)
    - [Wheel format and RECORD rules](https://packaging.python.org/en/latest/specifications/binary-distribution-format/)
  tags:
  - Infrastructure
  subTags:
  - CI/CD & Deployment
  ee: false
  demo: false
