id: gtfs-service-calendar-expansion
namespace: company.transport

description: |
  Expand a live GTFS Schedule feed into service dates and daily scheduled trip
  counts per route. Apply calendar_dates additions and removals before joining
  trips, including feeds that omit calendar.txt. No realtime data is used.

inputs:
  - id: feed_url
    type: STRING
    defaults: https://developer.trimet.org/schedule/gtfs.zip
    description: Public GTFS Schedule ZIP URL. The default downloads TriMet's published schedule.
  - id: start_date
    type: DATE
    required: false
    description: First service date, inclusive. Omit to use the execution's UTC date; this is a date label, not a departure timestamp.
  - id: horizon_days
    type: INT
    defaults: 14
    description: Number of service dates to expand (1 to 90).
  - id: fail_on_empty
    type: BOOL
    defaults: true
    description: Fail when the requested window has no scheduled trip-days, for example after the feed expires.

triggers:
  - id: daily_refresh
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 5 * * *"
    disabled: true

tasks:
  - id: download_feed
    type: io.kestra.plugin.core.http.Download
    uri: "{{ inputs.feed_url }}"
    timeout: PT5M

  - id: prepare_tables
    type: io.kestra.plugin.scripts.python.Script
    description: Read only the three needed ZIP members, validate their keys and calendar fields, and normalize optional tables to header-only CSVs.
    containerImage: python:3.13-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    env:
      START_DATE: "{{ inputs.start_date ?? (execution.startDate | date('yyyy-MM-dd')) }}"
      HORIZON_DAYS: "{{ inputs.horizon_days }}"
    inputFiles:
      feed.zip: "{{ outputs.download_feed.uri }}"
    outputFiles:
      - calendar.csv
      - calendar_dates.csv
      - trips.csv
    script: |
      import csv
      import datetime as dt
      import io
      import json
      import os
      import zipfile

      start = dt.date.fromisoformat(os.environ["START_DATE"])
      horizon = int(os.environ["HORIZON_DAYS"])
      if not 1 <= horizon <= 90:
          raise ValueError("horizon_days must be between 1 and 90")
      end = start + dt.timedelta(days=horizon - 1)
      weekdays = ["monday", "tuesday", "wednesday", "thursday", "friday", "saturday", "sunday"]
      columns = {
          "calendar": ["service_id", *weekdays, "start_date", "end_date"],
          "calendar_dates": ["service_id", "date", "exception_type"],
          "trips": ["route_id", "service_id", "trip_id"],
      }
      keys = {"calendar": ["service_id"], "calendar_dates": ["service_id", "date"], "trips": ["trip_id"]}
      services, referenced = set(), set()
      with zipfile.ZipFile("feed.zip") as archive:
          names = archive.namelist()
          if "trips.txt" not in names or not {"calendar.txt", "calendar_dates.txt"}.intersection(names):
              raise ValueError("Expected trips.txt and at least one GTFS calendar table at the ZIP root")
          selected = [n + ".txt" for n in columns if n + ".txt" in names]
          if any(names.count(n) != 1 for n in selected):
              raise ValueError("Duplicate GTFS ZIP members")
          if sum(archive.getinfo(n).file_size for n in selected) > 256 * 1024 * 1024:
              raise ValueError("Selected GTFS tables exceed the 256 MiB uncompressed limit")
          for table, fields in columns.items():
              seen = set()
              with open(table + ".csv", "w", newline="", encoding="utf-8") as target:
                  writer = csv.DictWriter(target, fieldnames=fields)
                  writer.writeheader()
                  if table + ".txt" not in names:
                      continue
                  with archive.open(table + ".txt") as member:
                      reader = csv.DictReader(io.TextIOWrapper(member, encoding="utf-8-sig", newline=""))
                      if not set(fields).issubset(reader.fieldnames or []):
                          raise ValueError(f"Missing required columns in {table}.txt")
                      for number, row in enumerate(reader, 2):
                          values = {field: (row.get(field) or "").strip() for field in fields}
                          key = tuple(values[field] for field in keys[table])
                          if any(not v for v in values.values()) or key in seen:
                              raise ValueError(f"Blank required value or duplicate key in {table}.txt row {number}")
                          seen.add(key)
                          if table == "calendar":
                              first = dt.datetime.strptime(values["start_date"], "%Y%m%d").date()
                              last = dt.datetime.strptime(values["end_date"], "%Y%m%d").date()
                              if first > last or any(values[d] not in {"0", "1"} for d in weekdays):
                                  raise ValueError(f"Invalid calendar range or weekday flag at row {number}")
                          elif table == "calendar_dates":
                              dt.datetime.strptime(values["date"], "%Y%m%d")
                              if values["exception_type"] not in {"1", "2"}:
                                  raise ValueError(f"Invalid exception_type at row {number}")
                          if table == "trips":
                              referenced.add(values["service_id"])
                          else:
                              services.add(values["service_id"])
                          writer.writerow(values)
      if referenced - services:
          raise ValueError("trips.txt references service IDs absent from both calendar tables")
      print("::" + json.dumps({"outputs": {"start_date": start.isoformat(), "end_date": end.isoformat()}}) + "::")

  - id: expand_service_dates
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: Expand weekday service, union added dates, subtract removed dates, then join scheduled trips and export the results.
    inputFiles:
      calendar.csv: "{{ outputs.prepare_tables.outputFiles['calendar.csv'] }}"
      calendar_dates.csv: "{{ outputs.prepare_tables.outputFiles['calendar_dates.csv'] }}"
      trips.csv: "{{ outputs.prepare_tables.outputFiles['trips.csv'] }}"
    outputFiles:
      - service_days.parquet
      - route_daily_trips.csv
    fetchType: NONE
    sql: |
      CREATE TABLE calendar AS SELECT * FROM read_csv('{{ workingDir }}/calendar.csv', header=true, all_varchar=true);
      CREATE TABLE exceptions AS SELECT * FROM read_csv('{{ workingDir }}/calendar_dates.csv', header=true, all_varchar=true);
      CREATE TABLE trips AS SELECT * FROM read_csv('{{ workingDir }}/trips.csv', header=true, all_varchar=true);

      CREATE TABLE service_days AS
      WITH dates AS (
        SELECT day::DATE AS service_date
        FROM generate_series(DATE '{{ outputs.prepare_tables.vars.start_date }}',
                             DATE '{{ outputs.prepare_tables.vars.end_date }}', INTERVAL 1 DAY) d(day)
      ), weekly AS (
        SELECT c.service_id, d.service_date
        FROM calendar c CROSS JOIN dates d
        WHERE d.service_date BETWEEN strptime(c.start_date, '%Y%m%d')::DATE
                                 AND strptime(c.end_date, '%Y%m%d')::DATE
          AND CASE isodow(d.service_date)
                WHEN 1 THEN c.monday WHEN 2 THEN c.tuesday WHEN 3 THEN c.wednesday
                WHEN 4 THEN c.thursday WHEN 5 THEN c.friday WHEN 6 THEN c.saturday
                WHEN 7 THEN c.sunday END = '1'
      ), additions AS (
        SELECT e.service_id, d.service_date
        FROM exceptions e JOIN dates d ON strptime(e.date, '%Y%m%d')::DATE = d.service_date
        WHERE e.exception_type = '1'
      ), candidates AS (
        SELECT * FROM weekly UNION SELECT * FROM additions
      )
      SELECT c.service_id, c.service_date FROM candidates c
      WHERE NOT EXISTS (
        SELECT 1 FROM exceptions e
        WHERE e.service_id = c.service_id AND e.exception_type = '2'
          AND strptime(e.date, '%Y%m%d')::DATE = c.service_date
      );

      COPY (SELECT * FROM service_days ORDER BY service_date, service_id)
        TO '{{ outputFiles["service_days.parquet"] }}' (FORMAT PARQUET);
      COPY (
        SELECT d.service_date, t.route_id, count(*) AS scheduled_trips
        FROM service_days d JOIN trips t USING (service_id)
        GROUP BY d.service_date, t.route_id ORDER BY d.service_date, t.route_id
      ) TO '{{ outputFiles["route_daily_trips.csv"] }}' (HEADER, DELIMITER ',');

  - id: summarize_window
    type: io.kestra.plugin.jdbc.duckdb.Query
    description: Profile the exported Parquet against the normalized trip table before deciding whether the window is empty.
    inputFiles:
      service_days.parquet: "{{ outputs.expand_service_dates.outputFiles['service_days.parquet'] }}"
      trips.csv: "{{ outputs.prepare_tables.outputFiles['trips.csv'] }}"
    fetchType: FETCH_ONE
    sql: |
      SELECT (SELECT count(*) FROM read_parquet('{{ workingDir }}/service_days.parquet')) AS service_days,
             count(*) AS trip_days, count(DISTINCT t.route_id) AS routes
      FROM read_parquet('{{ workingDir }}/service_days.parquet') d
      JOIN read_csv('{{ workingDir }}/trips.csv', header=true, all_varchar=true) t USING (service_id);

  - id: check_window
    type: io.kestra.plugin.core.flow.If
    condition: "{{ inputs.fail_on_empty and outputs.summarize_window.row.trip_days == 0 }}"
    then:
      - id: no_service
        type: io.kestra.plugin.core.execution.Fail
        errorMessage: No scheduled trip-days in the requested window. Check feed validity dates or choose another start_date.
    else:
      - id: summary
        type: io.kestra.plugin.core.log.Log
        message: "Exported {{ outputs.summarize_window.row.service_days }} service-days and {{ outputs.summarize_window.row.trip_days }} trip-days across {{ outputs.summarize_window.row.routes }} routes."

extend:
  title: Expand GTFS calendars into dated service and route trip counts
  metaTitle: GTFS Calendar Expansion with DuckDB | Kestra
  shortDescription: Download a GTFS feed, apply weekday schedules and holiday exceptions, and export service dates plus daily scheduled trip counts per route.
  metaDescription: Expand GTFS weekly calendars and exception dates with DuckDB. Export service-day Parquet and route-level daily scheduled trip counts with Kestra.
  description: |
    GTFS service IDs describe weekly patterns rather than individual operating dates.
    This flow materializes a bounded date window for analytics and applies holiday
    exceptions before counting scheduled trips. It consumes an actual agency feed;
    the default is TriMet's public GTFS Schedule ZIP.

    ## How it works
    1. Download the published ZIP into internal storage.
    2. Read only trips.txt, calendar.txt and calendar_dates.txt. Python normalizes
       selected columns and checks keys, weekday flags and service references.
       Either calendar table may be absent; its normalized CSV retains a header.
    3. DuckDB expands inclusive weekly date ranges, unions exception type 1
       additions and subtracts type 2 removals. UNION prevents double counting.
       A trip join produces counts by service date and route.
    4. Fail on an empty trip window unless fail_on_empty is false.

    ## What you get
    - service_days.parquet: one row per active service_id and service_date.
    - route_daily_trips.csv: scheduled trip counts grouped by date and route_id.
    - Execution metrics for service-days, trip-days and routes in the query row.
    Counts represent trips.txt records, not frequency-expanded departures or
    actual operated journeys. Service dates are not converted to UTC timestamps.

    ## Who it's for
    Transit analysts and data engineers preparing schedule coverage datasets.

    ## Why orchestrate this with Kestra
    Separate download, normalization and SQL tasks preserve intermediate artifacts
    for debugging. A schedule refreshes the window and an explicit failure branch
    prevents an expired feed from silently producing a successful empty extract.

    ## Prerequisites
    Kestra with Python Script, Docker runner and DuckDB JDBC plugins; Docker on
    the worker; network access to the agency feed and Python container registry.
    The three selected ZIP members must total at most 256 MiB uncompressed.

    ### Secrets
    None for the public default feed.

    ## Quick start
    1. Import the flow and execute with defaults for the next 14 UTC-date labels.
    2. For a historical feed, set start_date inside its published coverage.
    3. Download both files from expand_service_dates task outputs.
    4. Set your agency URL and enable daily_refresh after checking its license.

    ## How to extend
    Upload the Parquet to object storage, join routes.txt for display names, or
    expand frequencies.txt separately when departure counts are needed.

    ## Links
    - [GTFS Schedule reference](https://gtfs.org/documentation/schedule/reference/)
    - [TriMet GTFS source](https://developer.trimet.org/GTFS.shtml)
    - [DuckDB plugin](https://kestra.io/plugins/plugin-jdbc-duckdb)
    - [Python Script plugin](https://kestra.io/plugins/plugin-script-python)
  tags:
    - Data
  subTags:
    - File & Data Processing Basics
  ee: false
  demo: false
