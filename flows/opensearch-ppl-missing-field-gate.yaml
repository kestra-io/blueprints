id: opensearch-ppl-missing-field-gate
namespace: company.team
description: |
  Count documents missing a required field with a PPL query against
  OpenSearch, alert Slack on breach, and conditionally flag the matching
  documents via _update_by_query. auto_remediate and dry_run are two
  independent gates: the field tag is only ever added, never used to
  delete or overwrite existing data.

triggers:
  - id: hourly_compliance_check
    type: io.kestra.plugin.core.trigger.Schedule
    description: Hourly compliance sweep. Shipped disabled; enable it once opensearch_host/index_name/required_field point at a real index and a manual run has been verified. Always fires in safe mode (auto_remediate false, dry_run true) regardless of this flow's own defaults.
    cron: "0 * * * *"
    disabled: true
    inputs:
      auto_remediate: "false"
      dry_run: "true"

inputs:
  - id: opensearch_host
    type: STRING
    displayName: "OpenSearch Host"
    defaults: "http://localhost:9200"
    description: OpenSearch connection.hosts entry, scheme and port included.

  - id: index_name
    type: STRING
    displayName: "Index Name"
    defaults: "orders"
    description: Index audited by the PPL query and, if remediation runs, by _update_by_query.

  - id: required_field
    type: STRING
    displayName: "Required Field"
    defaults: "tracking_id"
    description: Field that every document in the index is expected to have. Documents where this field is null or absent are counted as non-compliant.

  - id: max_missing_count
    type: INT
    displayName: "Max Allowed Missing Count"
    defaults: 0
    description: Breach when the count of documents missing required_field exceeds this number. Default 0 means any missing field at all is a breach.

  - id: auto_remediate
    type: SELECT
    displayName: "Auto Remediate"
    defaults: "false"
    values:
      - "false"
      - "true"
    description: If "true" and a breach is found, flag the non-compliant documents via _update_by_query (still gated by dry_run below). If "false", the breach is only reported.

  - id: dry_run
    type: SELECT
    displayName: "Dry Run"
    defaults: "true"
    values:
      - "true"
      - "false"
    description: If "true", remediation is only logged, _update_by_query never runs. Must be explicitly "false", together with auto_remediate "true", for the flag to actually be written.

tasks:
  - id: audit_missing_field
    type: io.kestra.plugin.opensearch.Ppl
    description: Runs a PPL (Piped Processing Language) query, OpenSearch's SQL-like counterpart to Elasticsearch ES|QL, not interchangeable with it. isnull() and stats count() as <alias> are both documented PPL functions. fetchType FETCH_ONE (JDBC format only, which is the default) populates the row output with the single aggregate row.
    connection:
      hosts:
        - "{{ inputs.opensearch_host }}"
    query: "source={{ inputs.index_name }} | where isnull({{ inputs.required_field }}) | stats count() as missing_count"
    fetchType: FETCH_ONE

  - id: evaluate_missing_field_gate
    type: io.kestra.plugin.core.flow.If
    description: Breach when the missing-field count exceeds max_missing_count.
    condition: "{{ outputs.audit_missing_field.row.missing_count > inputs.max_missing_count }}"
    then:
      - id: route_remediation
        type: io.kestra.plugin.core.flow.Switch
        description: auto_remediate only decides whether remediation is considered at all; dry_run, checked separately below, decides whether _update_by_query actually runs.
        value: "{{ inputs.auto_remediate }}"
        cases:
          "true":
            - id: check_dry_run
              type: io.kestra.plugin.core.flow.If
              condition: "{{ inputs.dry_run == \"false\" }}"
              then:
                - id: remediate_missing_field
                  type: io.kestra.plugin.opensearch.Request
                  description: There is no structured "flag matching documents" task in this plugin - this calls OpenSearch's own _update_by_query REST endpoint directly through the generic Request task, using a standard exists-query and a Painless script. Only adds flagged_for_review; never deletes or overwrites required_field or any other existing field.
                  connection:
                    hosts:
                      - "{{ inputs.opensearch_host }}"
                  method: "POST"
                  endpoint: "{{ inputs.index_name }}/_update_by_query"
                  body:
                    query:
                      bool:
                        must_not:
                          exists:
                            field: "{{ inputs.required_field }}"
                    script:
                      source: "ctx._source.flagged_for_review = true"
                      lang: "painless"
                - id: log_remediation_applied
                  type: io.kestra.plugin.core.log.Log
                  message: "Flagged documents missing {{ inputs.required_field }} in {{ inputs.index_name }}. _update_by_query HTTP status: {{ outputs.remediate_missing_field.status }}."
              else:
                - id: log_dry_run_remediation
                  type: io.kestra.plugin.core.log.Log
                  message: "DRY RUN: would flag {{ outputs.audit_missing_field.row.missing_count }} document(s) missing {{ inputs.required_field }} in {{ inputs.index_name }} (dry_run is true). No change made."
          "false":
            - id: log_remediation_disabled
              type: io.kestra.plugin.core.log.Log
              message: "auto_remediate is false: {{ outputs.audit_missing_field.row.missing_count }} document(s) in {{ inputs.index_name }} are missing {{ inputs.required_field }}, but no remediation was attempted."
      - id: alert_missing_field_breach
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Always alert on breach, independent of whether remediation ran.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "OpenSearch PPL compliance gate: {{ outputs.audit_missing_field.row.missing_count }} document(s) in {{ inputs.index_name }} on {{ inputs.opensearch_host }} are missing {{ inputs.required_field }} (threshold {{ inputs.max_missing_count }}). auto_remediate: {{ inputs.auto_remediate }}. dry_run: {{ inputs.dry_run }}. Remediated: {{ outputs.remediate_missing_field is defined }}. Execution {{ execution.id }}."
          }
    else:
      - id: log_compliance_healthy
        type: io.kestra.plugin.core.log.Log
        message: "{{ inputs.index_name }} is healthy: {{ outputs.audit_missing_field.row.missing_count }} document(s) missing {{ inputs.required_field }}, at or below the {{ inputs.max_missing_count }} threshold."

  - id: log_audit_complete
    type: io.kestra.plugin.core.log.Log
    description: Final status line for every run, independent of which branch fired, so the execution history always shows the headline numbers.
    message: "Compliance audit complete for {{ inputs.index_name }}. missing_count={{ outputs.audit_missing_field.row.missing_count }}. threshold={{ inputs.max_missing_count }}. auto_remediate={{ inputs.auto_remediate }}. dry_run={{ inputs.dry_run }}."

errors:
  - id: alert_execution_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alert when the flow itself fails outside the handled branches, for example an unreachable cluster or a missing opensearch-sql plugin (Ppl fails if that optional plugin is not installed on the cluster).
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "OpenSearch PPL compliance gate FAILED in execution {{ execution.id }} for index {{ inputs.index_name }} on {{ inputs.opensearch_host }}. The PPL audit did not complete; investigate before trusting the last known compliance status."
      }

extend:
  title: "OpenSearch PPL Missing Field Compliance Gate"
  shortDescription: Count documents missing a required field with a PPL query against OpenSearch, alert Slack on breach, and optionally flag the matching documents via _update_by_query.
  metaTitle: OpenSearch PPL Missing Field Compliance Gate with Kestra
  metaDescription: "Count documents missing a required field with OpenSearch PPL, alert on breach, and optionally flag them via _update_by_query."
  description: |
    A required field that silently stops being written - a broken ingest pipeline, a
    client library update that dropped a field, a migration that missed a column - does
    not throw an error. It just accumulates as documents with a hole where that field
    should be. This blueprint uses PPL (Piped Processing Language), OpenSearch's SQL-like
    query language, to count exactly how many documents in an index are missing a required
    field, alerts on breach, and can flag the offending documents through OpenSearch's own
    `_update_by_query` API - adding one marker field, never deleting or overwriting
    anything.

    ## How it works

    1. `hourly_compliance_check` (`io.kestra.plugin.core.trigger.Schedule`) runs hourly, always forcing `auto_remediate: "false"` and `dry_run: "true"` through its own `inputs:` override regardless of this flow's defaults. Shipped disabled so you can validate a manual run first.
    2. `audit_missing_field` (`io.kestra.plugin.opensearch.Ppl`) runs `source={{ index_name }} | where isnull({{ required_field }}) | stats count() as missing_count` with `fetchType: FETCH_ONE`, populating `row.missing_count`.
    3. `evaluate_missing_field_gate` (`io.kestra.plugin.core.flow.If`) flags a breach whenever `missing_count > max_missing_count`.
       - `then` (breach): `route_remediation` (`io.kestra.plugin.core.flow.Switch` on `auto_remediate`) either considers remediation (`"true"`, gated again by `dry_run` through `check_dry_run`) or only logs that remediation is disabled (`"false"`). When both gates allow it, `remediate_missing_field` (`io.kestra.plugin.opensearch.Request`) calls OpenSearch's own `_update_by_query` endpoint with an `exists`-based query and a Painless script that sets `flagged_for_review`. `alert_missing_field_breach` always fires to Slack regardless of which path ran.
       - `else` (compliant): `log_compliance_healthy` records a clean check.
    4. `log_audit_complete` always runs last, printing the headline numbers regardless of which branch fired.
    5. The `errors` block alerts Slack separately if the flow itself fails - an unreachable cluster, or a cluster missing the optional `opensearch-sql` plugin that PPL requires, must not read as "no breach".

    ## What you get

    - A precise count of documents missing a required field, computed by OpenSearch itself through PPL, not estimated or sampled.
    - Remediation that only ever adds a `flagged_for_review` marker - it cannot delete documents or overwrite `required_field` or any other existing field.
    - Two independent gates (`auto_remediate`, `dry_run`) between "breach detected" and "documents actually flagged".
    - A final status log every run, breach or not, so the execution history doubles as a data-quality trend for that field.

    ## Who it's for

    - Platform and data engineering teams running OpenSearch who need an early signal when an ingest pipeline silently stops populating a field.
    - Teams evaluating PPL as an alternative to the native Query DSL for simple aggregate checks.
    - Anyone who has found out about a broken field weeks later, from a downstream report instead of from the cluster itself.

    ## Why orchestrate this with Kestra

    A PPL query run by hand answers one moment in time; it does not decide a cadence, branch on a threshold, flag the affected documents, or notify anyone. Kestra supplies the schedule, the threshold comparison as a first-class branch, two independent authorization gates before anything is written back to the cluster, and an execution history that shows exactly when the field started going missing and whether it was flagged.

    ## Prerequisites

    - A reachable OpenSearch cluster with the optional `opensearch-sql` plugin installed - `Ppl` fails if it is missing.
    - An index (`index_name`) with documents that may or may not carry `required_field`.
    - A Slack incoming webhook for alerts.

    Local testing:
    `docker run -d --name opensearch-gate -p 9201:9200 -p 9601:9600 -e "discovery.type=single-node" -e "DISABLE_SECURITY_PLUGIN=true" opensearchproject/opensearch:2.11.0`
    `docker network connect YOUR_KESTRA_NETWORK opensearch-gate` (only needed if the Kestra Worker runs in a separate Docker network than this container; set `opensearch_host` to `http://opensearch-gate:9200` from inside that network, or `http://localhost:9201` from the host).

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack incoming webhook used by `alert_missing_field_breach` and the `errors` block.
    - This blueprint's `connection.hosts` assumes an unauthenticated local cluster (`DISABLE_SECURITY_PLUGIN=true`), matching the plugin's own documentation examples. A secured cluster needs connection-level auth headers or credentials on `OpensearchConnection`, which were not exercised here - add them from `{{ secret(...) }}` values rather than hardcoding them if you enable security.
    - In Kestra OSS (no Enterprise secrets backend), secrets are supplied as environment variables prefixed `SECRET_`, base64-encoded, and read back in flows with `{{ secret('NAME') }}` - for example `SECRET_SLACK_WEBHOOK_URL=$(echo -n 'https://hooks.slack.com/...' | base64)`. This keeps credentials out of the flow YAML but, per Kestra's own documentation, offers no encryption at rest or access control beyond the host environment; use the Enterprise secrets backend for stronger guarantees.

    ### Inputs

    - `opensearch_host` (STRING, default `http://localhost:9200`): connection.hosts entry.
    - `index_name` (STRING, default `orders`): index audited and, if remediated, updated.
    - `required_field` (STRING, default `tracking_id`): field whose absence is counted.
    - `max_missing_count` (INT, default `0`): breach threshold; `0` means any missing field at all breaches.
    - `auto_remediate` (SELECT: `"false"`, `"true"`; default `"false"`): must be `"true"` for remediation to even be considered.
    - `dry_run` (SELECT: `"true"`, `"false"`; default `"true"`): must be explicitly `"false"`, together with `auto_remediate: "true"`, for `_update_by_query` to actually run.

    ### Outputs

    - `outputs.audit_missing_field.row.missing_count`: the PPL-computed count for every run.
    - `outputs.remediate_missing_field.status` / `.response`: the `_update_by_query` HTTP status and response body, present only when remediation actually ran.

    ## Quick start

    1. Start OpenSearch locally with the command above and index a few documents into `orders`, some with `tracking_id` and some without.
    2. Add the `SLACK_WEBHOOK_URL` secret.
    3. Run the flow manually with the defaults and confirm `audit_missing_field.row.missing_count` matches how many documents you left without `tracking_id`, and that `alert_missing_field_breach` fires when it is above `0`.
    4. Run once with `auto_remediate: "true"` and `dry_run: "true"` and confirm `log_dry_run_remediation` describes the update without running it.
    5. Run once with `auto_remediate: "true"` and `dry_run: "false"` and confirm the matching documents now carry `flagged_for_review: true`.
    6. Enable `hourly_compliance_check` once you trust the check; it always runs in the safe `auto_remediate: "false"` / `dry_run: "true"` mode regardless of what you leave the flow's own defaults set to.

    ## How to extend

    - Swap `isnull({{ required_field }})` for a different PPL condition (an invalid value, a stale timestamp) to audit a different kind of data-quality gap with the same gate structure.
    - Loop over several `index_name`/`required_field` pairs with `io.kestra.plugin.core.flow.Loop` to run the same audit across multiple indices in one flow.
    - Replace the Painless `flagged_for_review` marker with a richer audit trail - a timestamp and the execution id - by extending the script source.
    - Use `format: CSV` or `format: RAW` on `Ppl` to export the raw breach list instead of only a count, for a fuller incident report.

    ## Pitfalls

    - **PPL requires the optional `opensearch-sql` plugin.** Verified from the plugin's own description: "Requires the optional opensearch-sql plugin on the cluster. The task fails if the plugin is missing." A cluster without it will fail `audit_missing_field`, which is caught by the `errors` block, not silently read as "zero missing".
    - **There is no structured "flag documents" task in this plugin.** Remediation goes through `io.kestra.plugin.opensearch.Request` calling OpenSearch's native `_update_by_query` REST endpoint directly - the Kestra plugin only transports the HTTP call, it does not know what `_update_by_query` does.
    - **The remediation script only ever adds a field.** `ctx._source.flagged_for_review = true` is additive; it does not touch `required_field` or any other existing field, so remediation cannot corrupt the data it is auditing.
    - **`auto_remediate` and `dry_run` are independent gates, not a single boolean.** Both must be `"true"`/`"false"` respectively for `_update_by_query` to run; setting only one leaves the other still blocking.
    - **`Switch` case keys `"true"`/`"false"` are quoted strings.** `auto_remediate` renders as the literal string `"true"` or `"false"`; unquoted `true:`/`false:` YAML map keys would parse as booleans instead and would not match.

    ## Links

    - [plugin-opensearch documentation](https://kestra.io/plugins/plugin-opensearch)
    - [OpenSearch PPL language reference](https://docs.opensearch.org/latest/sql-and-ppl/ppl/)
    - [OpenSearch stats command](https://docs.opensearch.org/latest/sql-and-ppl/ppl/commands/stats/)
    - [OpenSearch Update By Query API](https://opensearch.org/docs/latest/api-reference/document-apis/update-by-query/)
    - [Kestra secrets (OSS vs Enterprise)](https://kestra.io/docs/concepts/secret)
  tags:
    - Data
    - Infrastructure
  subTags:
    - Data Quality
    - Monitoring & Alerting
  ee: false
  demo: false
