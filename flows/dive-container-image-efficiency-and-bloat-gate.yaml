id: dive-container-image-efficiency-and-bloat-gate
namespace: company.team
description: |
  Inspect container image layers using Dive to measure filesystem efficiency and detect
  wasted space across layers. Enforce configurable efficiency score and wasted bloat
  thresholds in advisory or blocking mode, post Slack alerts, and export structured
  JSON and Markdown optimization reports.

inputs:
  - id: image_reference
    type: STRING
    defaults: "python:3.11-slim"
    displayName: "Container Image Reference"
    description: "Container image reference to analyze (e.g., repository/image:tag or local image name)."

  - id: dive_report_file
    type: FILE
    required: false
    displayName: "Pre-generated Dive Report"
    description: "Optional pre-generated Dive JSON report file. If provided, the workflow evaluates this report directly, allowing offline analysis or execution in environments without container-in-container privileges."

  - id: min_efficiency_score
    type: FLOAT
    defaults: 90.0
    displayName: "Minimum Efficiency Score (%)"
    description: "Minimum acceptable image efficiency score percentage (0-100). Default baseline policy is 90.0% (organization-configurable policy default, not a universal standard)."

  - id: max_wasted_mb
    type: FLOAT
    defaults: 25.0
    displayName: "Maximum Wasted Space (MB)"
    description: "Maximum permitted wasted layer space in megabytes. Default baseline policy is 25.0 MB (organization-configurable policy default, not a universal standard)."

  - id: fail_on_inefficient
    type: BOOL
    defaults: false
    displayName: "Fail on Inefficient Image"
    description: "Whether to fail pipeline execution if the image violates efficiency or wasted space thresholds (enforcement mode). When false (default), runs in advisory audit mode."

  - id: notify_slack
    type: BOOL
    defaults: false
    displayName: "Notify Slack"
    description: "Whether to dispatch an alert notification to Slack when an inefficient image or layer bloat is detected."

  - id: slack_webhook_url
    type: STRING
    required: false
    displayName: "Slack Webhook URL"
    description: "Slack incoming webhook URL for notifications. If omitted, falls back to the SLACK_WEBHOOK_URL secret."

tasks:
  - id: analyze_image_with_dive
    type: io.kestra.plugin.scripts.shell.Commands
    description: Execute Dive CLI against the container image or preserve uploaded report.
    containerImage: wagoodman/dive:v0.13.1
    inputFiles:
      uploaded_report.json: "{{ inputs.dive_report_file ?? '' }}"
    commands:
      - >-
        if [ -s uploaded_report.json ]; then
          echo "Using provided pre-generated Dive JSON report..."
          cp uploaded_report.json dive_results.json
        else
          echo "Analyzing container image: {{ inputs.image_reference }} with Dive..."
          rc=0
          dive "{{ inputs.image_reference }}" --json dive_results.json || rc=$?
          echo "Dive exited with status: $rc"
          if [ ! -f dive_results.json ] || [ ! -s dive_results.json ]; then
            echo "::error::Failed to produce Dive JSON report. Ensure the image exists and Docker daemon is accessible."
            exit 1
          fi
        fi
    outputFiles:
      - dive_results.json

  - id: analyze_image_efficiency
    type: io.kestra.plugin.scripts.python.Script
    description: Parse Dive JSON report, calculate efficiency score and wasted space, generate reports, and classify policy compliance.
    containerImage: python:3.12-slim
    inputFiles:
      dive_results.json: "{{ outputs.analyze_image_with_dive.outputFiles['dive_results.json'] }}"
    outputFiles:
      - image_efficiency_report.json
      - image_efficiency_report.md
    env:
      IMAGE_REFERENCE: "{{ inputs.image_reference }}"
      MIN_EFFICIENCY_SCORE: "{{ inputs.min_efficiency_score }}"
      MAX_WASTED_MB: "{{ inputs.max_wasted_mb }}"
    script: |
      import json
      import os
      import sys
      from datetime import datetime, timezone

      def analyze_dive_efficiency():
          report_file = "dive_results.json"
          image_ref = os.environ.get("IMAGE_REFERENCE", "unknown:latest")
          min_eff_str = os.environ.get("MIN_EFFICIENCY_SCORE", "90.0")
          max_wasted_str = os.environ.get("MAX_WASTED_MB", "25.0")

          if not os.path.exists(report_file):
              print(f"[ERROR] Dive results report '{report_file}' not found.", file=sys.stderr)
              sys.exit(1)

          if os.path.getsize(report_file) == 0:
              print(f"[ERROR] Dive results report '{report_file}' is empty (0 bytes).", file=sys.stderr)
              sys.exit(1)

          # Validate policy thresholds
          try:
              min_efficiency = float(min_eff_str)
              max_wasted_mb = float(max_wasted_str)
          except (ValueError, TypeError) as exc:
              print(f"[ERROR] Invalid threshold values (min_efficiency={min_eff_str}, max_wasted={max_wasted_str}): {exc}", file=sys.stderr)
              sys.exit(1)

          if not (0.0 <= min_efficiency <= 100.0):
              print(f"[ERROR] min_efficiency_score must be between 0.0 and 100.0, got {min_efficiency}.", file=sys.stderr)
              sys.exit(1)

          if max_wasted_mb < 0.0:
              print(f"[ERROR] max_wasted_mb must be non-negative, got {max_wasted_mb}.", file=sys.stderr)
              sys.exit(1)

          try:
              with open(report_file, "r", encoding="utf-8") as f:
                  data = json.load(f)
          except Exception as exc:
              print(f"[ERROR] Failed to parse '{report_file}' as valid JSON: {exc}", file=sys.stderr)
              sys.exit(1)

          if not isinstance(data, dict):
              print(f"[ERROR] Invalid Dive report format: root JSON must be a dict/object, got {type(data).__name__}.", file=sys.stderr)
              sys.exit(1)

          if "image" not in data or not isinstance(data["image"], dict):
              print("[ERROR] Invalid Dive report format: missing required 'image' object.", file=sys.stderr)
              sys.exit(1)

          image_data = data["image"]
          required_fields = ["efficiencyScore", "inefficientBytes", "sizeBytes"]
          for field in required_fields:
              if field not in image_data:
                  print(f"[ERROR] Invalid Dive report format: 'image' object missing required '{field}' property.", file=sys.stderr)
                  sys.exit(1)

          try:
              raw_score = float(image_data["efficiencyScore"])
          except (ValueError, TypeError):
              print(f"[ERROR] 'efficiencyScore' must be numeric, got {image_data['efficiencyScore']!r}.", file=sys.stderr)
              sys.exit(1)

          if not (0.0 <= raw_score <= 1.0):
              print(f"[ERROR] 'efficiencyScore' ratio must be between 0.0 and 1.0, got {raw_score}.", file=sys.stderr)
              sys.exit(1)

          try:
              inefficient_bytes = int(image_data["inefficientBytes"])
              size_bytes = int(image_data["sizeBytes"])
          except (ValueError, TypeError):
              print("[ERROR] 'inefficientBytes' and 'sizeBytes' must be integers.", file=sys.stderr)
              sys.exit(1)

          if inefficient_bytes < 0 or size_bytes < 0:
              print("[ERROR] Byte size metrics must be non-negative.", file=sys.stderr)
              sys.exit(1)

          efficiency_percentage = round(raw_score * 100.0, 2)
          total_size_mb = round(size_bytes / (1024 * 1024), 2)
          wasted_size_mb = round(inefficient_bytes / (1024 * 1024), 2)

          layers = data.get("layer") or []
          layer_count = len(layers) if isinstance(layers, list) else 0

          file_references = image_data.get("fileReference") or []
          wasted_files = []
          if isinstance(file_references, list):
              for ref in file_references:
                  if isinstance(ref, dict):
                      wasted_files.append({
                          "path": str(ref.get("path", "unknown")),
                          "size_bytes": int(ref.get("sizeBytes", 0)),
                          "size_kb": round(int(ref.get("sizeBytes", 0)) / 1024, 2)
                      })

          wasted_files.sort(key=lambda x: x["size_bytes"], reverse=True)
          top_wasted_files = wasted_files[:10]

          policy_violations = []
          if efficiency_percentage < min_efficiency:
              policy_violations.append(
                  f"Image efficiency ({efficiency_percentage}%) is below policy threshold ({min_efficiency}%)."
              )
          if wasted_size_mb > max_wasted_mb:
              policy_violations.append(
                  f"Wasted layer space ({wasted_size_mb} MB) exceeds policy threshold ({max_wasted_mb} MB)."
              )

          if efficiency_percentage < 70.0 or wasted_size_mb > 100.0:
              efficiency_rating = "CRITICAL_BLOAT"
          elif len(policy_violations) > 0:
              efficiency_rating = "INEFFICIENT"
          elif efficiency_percentage >= 95.0 and wasted_size_mb <= 10.0:
              efficiency_rating = "OPTIMAL"
          else:
              efficiency_rating = "ACCEPTABLE"

          if policy_violations:
              verdict = "REJECTED"
              status_category = "FAIL"
              summary = f"REJECTED: Container image '{image_ref}' violates efficiency policy. {'; '.join(policy_violations)}"
          elif efficiency_rating == "ACCEPTABLE":
              verdict = "WARNING"
              status_category = "ADVISORY"
              summary = f"WARNING: Container image '{image_ref}' passed with advisory bloat (Efficiency: {efficiency_percentage}%, Wasted: {wasted_size_mb} MB)."
          else:
              verdict = "APPROVED"
              status_category = "PASS"
              summary = f"APPROVED: Container image '{image_ref}' meets optimal efficiency standards (Efficiency: {efficiency_percentage}%, Wasted: {wasted_size_mb} MB)."

          # Actionable optimization recommendations based strictly on tool findings
          recommendations = []
          if efficiency_rating in ("CRITICAL_BLOAT", "INEFFICIENT"):
              recommendations.append(
                  "Consolidate `RUN` commands into single chained instructions (e.g., `apt-get update && apt-get install -y ... && rm -rf /var/lib/apt/lists/*`) to avoid committing cache files into intermediate layers."
              )
              recommendations.append(
                  "Implement multi-stage Docker builds (`FROM ... AS builder`) so that compilers, build headers, and intermediate tooling are omitted from the final runtime image."
              )
              recommendations.append(
                  "Review `.dockerignore` to ensure local temporary files, test artifacts, `.git` metadata, and cache directories are not copied into the build context."
              )
              if top_wasted_files:
                  recommendations.append(
                      f"Investigate top duplicated or modified files identified by Dive ({len(wasted_files)} total wasted files recorded)."
                  )
          elif efficiency_rating == "ACCEPTABLE":
              recommendations.append(
                  "Image meets current minimum thresholds. Consider pruning unused package caches and verifying multi-stage build efficiency to achieve optimal rating (>= 95%)."
              )
          else:
              recommendations.append(
                  "Image layer efficiency is optimal (>= 95%). Continue adhering to minimal base images and multi-stage build patterns."
              )

          recommendations.append(
              "Note: Image layer efficiency metrics analyze filesystem waste and duplicate bytes; they do not replace container vulnerability scanning (CVE detection) or SBOM license compliance auditing."
          )

          report_payload = {
              "timestamp": datetime.now(timezone.utc).isoformat(),
              "image_reference": image_ref,
              "verdict": verdict,
              "status_category": status_category,
              "efficiency_score": efficiency_percentage,
              "efficiency_rating": efficiency_rating,
              "total_size_mb": total_size_mb,
              "wasted_size_mb": wasted_size_mb,
              "wasted_bytes": inefficient_bytes,
              "layer_count": layer_count,
              "wasted_files_count": len(wasted_files),
              "thresholds": {
                  "min_efficiency_score": min_efficiency,
                  "max_wasted_mb": max_wasted_mb
              },
              "policy_violations": policy_violations,
              "top_wasted_files": top_wasted_files,
              "recommendations": recommendations,
              "summary": summary
          }

          with open("image_efficiency_report.json", "w", encoding="utf-8") as f:
              json.dump(report_payload, f, indent=2)

          # Markdown Report Generation
          md_lines = [
              "# Container Image Efficiency & Layer Bloat Report",
              "",
              f"**Target Image:** `{image_ref}`  ",
              f"**Analysis Timestamp:** `{report_payload['timestamp']}`  ",
              f"**Verdict:** `{verdict}` (`{status_category}`)  ",
              f"**Efficiency Rating:** `{efficiency_rating}`  ",
              "",
              "## Efficiency & Bloat Summary",
              "",
              "| Metric | Value | Policy Threshold | Status |",
              "|:---|:---|:---|:---|",
              f"| **Efficiency Score** | **{efficiency_percentage}%** | >= {min_efficiency}% | {'PASS' if efficiency_percentage >= min_efficiency else 'FAIL'} |",
              f"| **Wasted Layer Bloat** | **{wasted_size_mb} MB** | <= {max_wasted_mb} MB | {'PASS' if wasted_size_mb <= max_wasted_mb else 'FAIL'} |",
              f"| **Total Image Size** | {total_size_mb} MB | - | - |",
              f"| **Layer Count** | {layer_count} | - | - |",
              f"| **Inefficient Files** | {len(wasted_files)} | - | - |",
              ""
          ]

          if policy_violations:
              md_lines.append("## Policy Violations")
              md_lines.append("")
              for pv in policy_violations:
                  md_lines.append(f"- :x: {pv}")
              md_lines.append("")
          else:
              md_lines.append("## Policy Compliance")
              md_lines.append("")
              md_lines.append("- :white_check_mark: All image efficiency and layer bloat metrics satisfy defined policies.")
              md_lines.append("")

          if top_wasted_files:
              md_lines.append("## Top Inefficient / Duplicated Files")
              md_lines.append("")
              md_lines.append("> Files modified or duplicated across multiple layers detected by Dive analysis:")
              md_lines.append("")
              md_lines.append("| File Path | Size (KB) | Size (Bytes) |")
              md_lines.append("|:---|:---|:---|")
              for wf in top_wasted_files:
                  md_lines.append(f"| `{wf['path']}` | {wf['size_kb']} KB | {wf['size_bytes']} |")
              md_lines.append("")

          md_lines.append("## Actionable Optimization Recommendations")
          md_lines.append("")
          for rec in recommendations:
              md_lines.append(f"- {rec}")
          md_lines.append("")

          with open("image_efficiency_report.md", "w", encoding="utf-8") as f:
              f.write("\n".join(md_lines) + "\n")

          # Kestra output vars
          kestra_outputs = {
              "verdict": verdict,
              "status_category": status_category,
              "efficiency_score": efficiency_percentage,
              "efficiency_rating": efficiency_rating,
              "total_size_mb": total_size_mb,
              "wasted_size_mb": wasted_size_mb,
              "wasted_bytes": inefficient_bytes,
              "layer_count": layer_count,
              "wasted_files_count": len(wasted_files),
              "policy_violations_count": len(policy_violations),
              "summary": summary
          }
          print("::" + json.dumps({"outputs": kestra_outputs}) + "::")

      if __name__ == "__main__":
          analyze_dive_efficiency()

  - id: check_slack_alert
    type: io.kestra.plugin.core.flow.If
    description: Dispatch Slack alert when notify_slack is enabled and the image is inefficient or bloat-heavy.
    condition: "{{ inputs.notify_slack and outputs.analyze_image_efficiency.vars.verdict in ['WARNING', 'REJECTED'] }}"
    then:
      - id: send_slack_alert
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Send structured efficiency and layer bloat report to Slack.
        url: "{{ inputs.slack_webhook_url ?? secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": ":package: *Dive Container Image Efficiency Gate Alert - {{ inputs.image_reference }}*\n• *Verdict:* `{{ outputs.analyze_image_efficiency.vars.verdict }}` (`{{ outputs.analyze_image_efficiency.vars.status_category }}`)\n• *Efficiency Score:* `{{ outputs.analyze_image_efficiency.vars.efficiency_score }}%` (Min Policy: {{ inputs.min_efficiency_score }}%)\n• *Wasted Layer Space:* `{{ outputs.analyze_image_efficiency.vars.wasted_size_mb }} MB` (Max Policy: {{ inputs.max_wasted_mb }} MB)\n• *Total Image Size:* `{{ outputs.analyze_image_efficiency.vars.total_size_mb }} MB`\n• *Layer Count:* `{{ outputs.analyze_image_efficiency.vars.layer_count }}`\n• *Inefficient Files:* `{{ outputs.analyze_image_efficiency.vars.wasted_files_count }}`\n• *Summary:* {{ outputs.analyze_image_efficiency.vars.summary }}\n• *Execution ID:* `{{ execution.id }}`"
          }

  - id: enforce_policy_gate
    type: io.kestra.plugin.core.flow.If
    description: Enforce policy gate if fail_on_inefficient is enabled and verdict is REJECTED.
    condition: "{{ inputs.fail_on_inefficient and outputs.analyze_image_efficiency.vars.verdict == 'REJECTED' }}"
    then:
      - id: fail_gate
        type: io.kestra.plugin.core.execution.Fail
        description: Halt workflow execution to prevent deployment of inefficient container image.
        errorMessage: >-
          Container Image Efficiency Gate FAILED for '{{ inputs.image_reference }}':
          Image efficiency ({{ outputs.analyze_image_efficiency.vars.efficiency_score }}%) or wasted layer space ({{ outputs.analyze_image_efficiency.vars.wasted_size_mb }} MB) violates policy thresholds.
          {{ outputs.analyze_image_efficiency.vars.summary }}
    else:
      - id: log_efficiency_status
        type: io.kestra.plugin.core.log.Log
        description: Log efficiency gate status and analysis results.
        message: >-
          Container image efficiency gate finished for '{{ inputs.image_reference }}'.
          Verdict: {{ outputs.analyze_image_efficiency.vars.verdict }} ({{ outputs.analyze_image_efficiency.vars.status_category }}),
          Score: {{ outputs.analyze_image_efficiency.vars.efficiency_score }}%, Wasted: {{ outputs.analyze_image_efficiency.vars.wasted_size_mb }} MB.
          {{ outputs.analyze_image_efficiency.vars.summary }}

outputs:
  - id: verdict
    type: STRING
    description: Policy evaluation verdict (APPROVED, WARNING, REJECTED).
    value: "{{ outputs.analyze_image_efficiency.vars.verdict }}"

  - id: status_category
    type: STRING
    description: Status classification (PASS, ADVISORY, FAIL).
    value: "{{ outputs.analyze_image_efficiency.vars.status_category }}"

  - id: efficiency_score
    type: FLOAT
    description: Container image layer efficiency score percentage (0-100).
    value: "{{ outputs.analyze_image_efficiency.vars.efficiency_score }}"

  - id: efficiency_rating
    type: STRING
    description: Image efficiency classification (OPTIMAL, ACCEPTABLE, INEFFICIENT, CRITICAL_BLOAT).
    value: "{{ outputs.analyze_image_efficiency.vars.efficiency_rating }}"

  - id: wasted_size_mb
    type: FLOAT
    description: Inefficient layer bloat in megabytes.
    value: "{{ outputs.analyze_image_efficiency.vars.wasted_size_mb }}"

  - id: wasted_bytes
    type: INT
    description: Inefficient layer bloat in raw bytes.
    value: "{{ outputs.analyze_image_efficiency.vars.wasted_bytes }}"

  - id: total_size_mb
    type: FLOAT
    description: Total container image uncompressed size in megabytes.
    value: "{{ outputs.analyze_image_efficiency.vars.total_size_mb }}"

  - id: layer_count
    type: INT
    description: Total number of filesystem layers in the container image.
    value: "{{ outputs.analyze_image_efficiency.vars.layer_count }}"

  - id: report_json
    type: FILE
    description: Comprehensive JSON analysis report.
    value: "{{ outputs.analyze_image_efficiency.outputFiles['image_efficiency_report.json'] }}"

  - id: report_markdown
    type: FILE
    description: Human-readable Markdown summary report.
    value: "{{ outputs.analyze_image_efficiency.outputFiles['image_efficiency_report.md'] }}"

extend:
  title: "Dive Container Image Efficiency and Layer Bloat Gate"
  shortDescription: Analyze container image layer efficiency and wasted bytes with Dive, enforce size thresholds, and export detailed JSON and Markdown reports.
  metaTitle: Dive Container Image Efficiency Gate | Kestra
  metaDescription: "Analyze container image layer efficiency and wasted bytes with Dive, enforce bloat policies, and export JSON and Markdown reports."
  description: |
    Large, bloated container images degrade CI/CD build speeds, increase registry storage costs,
    and slow down deployment start times across Kubernetes clusters. More importantly, unintentional
    file duplication across layers (such as package manager caches, intermediate build tools, and
    unstripped binaries) wastes bandwidth and increases attack surface.

    This blueprint automates container image layer efficiency analysis using [Dive](https://github.com/wagoodman/dive).
    It inspects image layers, calculates the efficiency score ratio and wasted space, evaluates findings
    against configurable policy thresholds, posts real-time Slack alerts, and generates structured JSON
    and human-readable Markdown reports.

    ## How it works

    1. **Layer Inspection**: Runs the pinned `wagoodman/dive:v0.13.1` container using `dive <image> --json dive_results.json`, or accepts a pre-generated Dive JSON report via `dive_report_file` for offline evaluation or environments where container-in-container execution is restricted.
    2. **Metric Extraction & Validation**: A Python analysis script reads the authoritative Dive JSON output schema, validating the `image` object, `efficiencyScore`, `inefficientBytes`, and `fileReference` properties.
    3. **Policy Evaluation**: The image efficiency percentage and wasted megabytes are evaluated against `min_efficiency_score` (default: 90%) and `max_wasted_mb` (default: 25 MB).
    4. **Artifact Generation**: Outputs both `image_efficiency_report.json` (for programmatic CI/CD consumption) and `image_efficiency_report.md` (for release notes and pull request summaries).
    5. **Slack Alerting**: When `notify_slack` is enabled and the image contains bloat or policy violations, sends a structured alert with metrics and top inefficient files.
    6. **Policy Enforcement**: In advisory mode (`fail_on_inefficient: false`), logs warnings without interrupting releases. In enforcement mode (`fail_on_inefficient: true`), halts execution via `io.kestra.plugin.core.execution.Fail` when policy thresholds are violated.

    ## What you get

    - Automated, repeatable container layer efficiency auditing before deployment.
    - Identification of top modified and duplicated files across layers.
    - Flexible execution: runs Dive directly or consumes pre-computed reports.
    - Advisory mode for baseline auditing and enforcement mode for hard CI/CD gates.
    - Downloadable JSON and Markdown efficiency audit reports.

    ## Who it's for

    - Platform and DevOps engineers maintaining container build standards.
    - SRE teams seeking to minimize container startup latency and cluster pull times.
    - CI/CD release managers establishing automated software delivery gates.

    ## Why orchestrate this with Kestra

    Container optimization is often an afterthought or limited to local ad-hoc developer checks. Orchestrating Dive checks in Kestra provides:
    - **Centralized Governance**: Enforce consistent image efficiency standards across all microservices and teams.
    - **Auditable Execution History**: Retain machine-readable reports and layer metrics for every image build.
    - **Decoupled Architecture**: Easily chain the gate with build pipelines, vulnerability scanners, and Kubernetes rollout workflows.

    ## Policy Defaults & Security Scope

    - **Policy Defaults**: `min_efficiency_score: 90.0%` and `max_wasted_mb: 25.0 MB` are organizational baseline defaults, not universal industry standards. Adjust them according to base OS requirements and application characteristics.
    - **Security Scope**: Container image efficiency checks evaluate filesystem bloat and layer waste. They do **not** substitute for CVE vulnerability scanning (e.g., Trivy or Grype) or Software Bill of Materials (SBOM) license compliance auditing.

    ## Prerequisites & Registry Authentication

    - **Task Runner**: A Kestra worker capable of running Docker or Kubernetes containers to execute `wagoodman/dive:v0.13.1` and `python:3.12-slim`.
    - **Registry Authentication**: For private registries, configure Docker credentials in the task runner or provide credentials via Kestra secrets. Never expose tokens in plain text.
    - **Slack Webhook**: Required only if `notify_slack` is enabled. Can be provided via the `slack_webhook_url` input or stored as a `SLACK_WEBHOOK_URL` secret.

    ## Quick start

    1. Set `image_reference` to your target container image (e.g., `python:3.11-slim` or your application repository).
    2. Leave `fail_on_inefficient: false` for an initial advisory run.
    3. Execute the flow and download the generated `image_efficiency_report.md` from the outputs tab.
    4. Once satisfied with baseline results, enable `fail_on_inefficient: true` in your deployment pipeline.

    ## How to extend

    - **Chain with Vulnerability Scanners**: Run Trivy or Grype alongside Dive in a unified container security and efficiency gate.
    - **Automate Git PR Comments**: Post the generated `image_efficiency_report.md` directly into GitHub or GitLab pull requests using webhook triggers.
    - **Custom Base Image Baselines**: Maintain separate efficiency score baselines for minimal distroless images vs. legacy enterprise stacks.

    ## Links

    - [Dive Repository](https://github.com/wagoodman/dive)
    - [Kestra Shell Plugin](https://kestra.io/plugins/plugin-scripts-shell)
    - [Kestra Python Plugin](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Plugin](https://kestra.io/plugins/plugin-slack)
  tags:
    - Infrastructure
    - Cloud
  ee: false
  demo: false
