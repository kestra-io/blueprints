id: postman-monitors-failing-assertion-runbook-sentinel
namespace: company.sre

description: Audits Postman API collection monitors for failed assertions, contract regressions, and HTTP status anomalies.

concurrency:
  limit: 1

inputs:
  - id: postmanMonitorId
    type: STRING
    displayName: Postman Monitor UID
    defaults: "12345678-abcd-1234-ef01-123456789abc"
    description: Unique identifier of the Postman collection monitor.

  - id: postmanApiKey
    type: SECRET
    displayName: Postman API Key
    defaults: "PMAK-secret_key"
    description: Encrypted Postman API access key.

  - id: slackWebhookUri
    type: SECRET
    displayName: Slack Webhook URI
    defaults: "https://hooks.slack.com/services/T00/B00/XXXX"
    description: Encrypted Slack Incoming Webhook endpoint for alerting API Engineering teams.

tasks:
  - id: evaluate_postman_monitor_run
    type: io.kestra.plugin.scripts.python.Script
    description: Queries Postman REST API for collection monitor run statistics and assertion results.
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install requests
    env:
      AUTH0_TOKEN: "{{ inputs.auth0ManagementToken ?? '' }}"
      MEILI_KEY: "{{ inputs.meilisearchMasterKey ?? '' }}"
      DT_TOKEN: "{{ inputs.dynatraceApiToken ?? '' }}"
      SNYK_TOKEN: "{{ inputs.snykApiToken ?? '' }}"
      TS_KEY: "{{ inputs.tailscaleApiKey ?? '' }}"
      GITLAB_TOKEN: "{{ inputs.gitlabToken ?? '' }}"
      POSTMAN_API_KEY: "{{ inputs.postmanApiKey ?? '' }}"
      LD_API_KEY: "{{ inputs.launchDarklyApiKey ?? '' }}"
      PINGDOM_TOKEN: "{{ inputs.pingdomApiToken ?? '' }}"
      BOUNDARY_TOKEN: "{{ inputs.boundaryToken ?? '' }}"
    script: |
      import os
      import json
      import requests
      
      monitor_id = "{{ inputs.postmanMonitorId }}"
      api_key = os.getenv('POSTMAN_API_KEY')
      
      headers = {
          "X-Api-Key": api_key,
          "Accept": "application/json"
      }
      
      url = f"https://api.getpostman.com/monitors/{monitor_id}"
      resp = requests.get(url, headers=headers, timeout=15)
      data = resp.json() if resp.status_code == 200 else {}
      monitor = data.get("monitor", {})
      name = monitor.get("name", "Unknown Monitor")
      stats = monitor.get("lastRun", {}).get("stats", {})
      
      failed_assertions = stats.get("assertions", {}).get("failed", 0)
      failed_requests = stats.get("requests", {}).get("failed", 0)
      has_failures = failed_assertions > 0 or failed_requests > 0
      
      report = {
          "monitor_id": monitor_id,
          "monitor_name": name,
          "failed_assertions": failed_assertions,
          "failed_requests": failed_requests,
          "has_failures": has_failures,
          "recommended_action": f"Inspect Postman monitor results for {name} at https://go.postman.co/monitors/{monitor_id}" if has_failures else "All collection assertions passing."
      }
      
      with open("postman_report.json", "w") as f:
          json.dump(report, f)
      
      print(f"Postman Monitor {name}: {failed_assertions} failed assertions. Has failures: {has_failures}")

  - id: check_assertion_failures
    type: io.kestra.plugin.core.flow.If
    description: Branch execution based on whether collection monitor recorded failing assertions.
    condition: "{{ json(read('postman_report.json')).has_failures }}"
    then:
      - id: notify_slack_postman_failure
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches API test assertion failure warning to engineering channel on Slack.
        url: "{{ inputs.slackWebhookUri }}"
        payload: |
          {
            "text": "Postman Monitor Alert: Collection *{{ json(read('postman_report.json')).monitor_name }}* failed {{ json(read('postman_report.json')).failed_assertions }} assertions! Runbook: {{ json(read('postman_report.json')).recommended_action }}"
          }
    else:
      - id: log_healthy_postman_assertions
        type: io.kestra.plugin.core.log.Log
        description: Logs nominal execution status when all Postman collection tests pass.
        message: "Postman monitor {{ json(read('postman_report.json')).monitor_name }} collection tests are passing nominally."

  - id: export_postman_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Exports structured Postman monitor test results manifest.
    format: "{{ json(read('postman_report.json')) }}"

triggers:
  - id: fifteen_minute_postman_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: Scheduled audit inspecting Postman collection monitors every fifteen minutes.
    cron: "*/15 * * * *"

extend:
  title: Postman Monitors Failing Assertion Runbook Sentinel
  shortDescription: Audits Postman API collection monitors for failed assertions and regression triage runbooks.
  metaTitle: Postman Monitors Failing Assertion Runbook Sentinel | Kestra
  metaDescription: Audits Postman collection monitor test runs, detects failed response assertions, and delivers triaging runbooks to engineering on Slack. (138 chars)
  description: |
    Audits Postman API collection monitors for failed assertions, contract regressions, and HTTP status anomalies.

    ## How it works
    1. Triggers on an automated cron schedule (`*/15 * * * *`) to poll external telemetry endpoints.
    2. Executes a containerized Python script querying the target platform REST API for live operational metrics.
    3. Aggregates data points, evaluates thresholds, and structures diagnostic telemetry into a local JSON report.
    4. Evaluates if anomalous metrics or SLA breaches occurred using an `If` conditional task.
    5. Dispatches an alert to Slack with deep links and targeted remediation commands if thresholds are exceeded.
    6. Logs nominal execution status and exports an audit manifest for lineage and historical tracking.

    ## Architecture diagram
    ```mermaid
    flowchart TD
        A[Schedule Trigger: */15 * * * *] --> B[Task: evaluate_postman_monitor_run]
        B --> C{Task: check_assertion_failures}
        C -- Threshold Breached --> D[Task: notify_slack_postman_failure]
        C -- Nominal Operation --> E[Task: log_healthy_postman_assertions]
        D --> F[Task: export_postman_manifest]
        E --> F
    ```

    ## What you get
    - Continuous verification of public and internal API contracts through automated Postman monitor checks.\n    - Immediate alert dispatch to Slack with failed assertion counts and direct Postman web console links.\n    - Decoupling of test execution alerting from Postman default email digests.\n    - Exported JSON diagnostic manifests for API contract health scorecards.

    ## Who it's for
    - API Engineers and Integration Developers maintaining public REST APIs.\n    - QA Engineers maintaining automated Postman contract test collections.\n    - SREs monitoring business transaction health across distributed microservices.

    ## Why orchestrate this with Kestra
    Postman monitors provide scheduled API collection runs, but team email notifications frequently go unread and lack integration into broader operational workflows. Kestra fetches recent monitor statistics via the Postman API, evaluates assertion failure rates, and routes immediate incident notifications to Slack with direct runbook links.

    ## Use cases
    - **Production Availability Guardrails**: Continuously detect infrastructure degradation before users experience service disruptions.
    - **Incident Triaging Automation**: Deliver actionable runbook instructions straight into on-call Slack channels.
    - **Platform Capacity Planning**: Maintain longitudinal audit logs of operational saturation and SLA compliance.

    ## Inputs
    | Name | Type | Default | Description |\n    | --- | --- | --- | --- |\n    | `postmanMonitorId` | `STRING` | `12345678-abcd-1234-ef01-123456789abc` | Unique identifier of the Postman collection monitor. |\n    | `postmanApiKey` | `SECRET` | `PMAK-secret_key` | Encrypted Postman API access key. |\n    | `slackWebhookUri` | `SECRET` | `https://hooks.slack.com/services/T00/B00/XXXX` | Encrypted Slack Incoming Webhook endpoint for alerting API Engineering teams. |\n
    ## Expected outputs
    Primary execution outputs exported by `export_postman_manifest`:
    - `report`: Full structured JSON diagnostic report detailing operational parameters and recommendations.
    Example expression: `{{ outputs.export_postman_manifest.value }}`

    ## Prerequisites
    - Network connectivity from the Kestra worker to the target service endpoint.
    - An active API token or service credential with read permissions.
    - A Slack Incoming Webhook URL configured in Kestra secrets.

    ### Secrets
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook endpoint URL.
    - Relevant target platform API token configured in Kestra secrets.

    ## Quick start
    1. Register the required platform credentials and Slack webhook in Kestra secrets.
    2. Deploy this flow into your target namespace.
    3. Configure input parameters to point to your specific environment.
    4. Execute the flow manually to verify API connectivity and Slack alert routing.

    ## Common pitfalls and troubleshooting
    - **Rate Limiting**: Ensure API request frequencies stay within provider rate limits during peak execution periods.
    - **Empty Telemetry Handling**: If no events are recorded in the query window, the Python script handles null responses gracefully.
    - **Credential Scopes**: Verify that the supplied API token possesses sufficient read permissions for the queried endpoints.

    ## How to extend
    - **Automated Remediation**: Add downstream HTTP tasks to trigger automated scaling or restarts upon failure detection.
    - **PagerDuty Escalation**: Route critical severity alerts directly to PagerDuty or Opsgenie.
    - **Multi-Resource Loops**: Loop through an array of resource identifiers using `io.kestra.plugin.core.flow.ForEach`.

    ## Links
    - [Kestra Python Script Plugin](https://kestra.io/plugins/plugin-scripts/python/io.kestra.plugin.scripts.python.script)
    - [Kestra Slack Notification Plugin](https://kestra.io/plugins/plugin-slack/notifications/io.kestra.plugin.slack.notifications.slackincomingwebhook)
    - [Official Documentation](https://kestra.io/docs)
  tags:
    - Infrastructure
    - Core
  subTags:
    - Monitoring & Alerting
    - Testing & Quality
  ee: false
  demo: false
