id: postman-monitors-failing-assertion-runbook-sentinel
namespace: company.qa

description: |
  Audits Postman API collection monitors for failing response assertions, contract regressions,
  and HTTP status errors, delivering structured incident notifications and triaging runbooks to engineering.

concurrency:
  limit: 1

inputs:
  - id: postman_monitor_id
    type: STRING
    displayName: Postman Monitor UID
    defaults: "12345678-abcd-1234-ef01-123456789abc"
    description: Unique identifier UID of the target Postman collection monitor to evaluate.

  - id: max_failed_assertions_threshold
    type: INT
    displayName: Max Failed Assertions Threshold
    defaults: 0
    description: Maximum allowable failed test assertions in the most recent run before raising an incident.

  - id: alert_on_failure
    type: BOOL
    displayName: Alert on Failure
    defaults: true
    description: Whether to dispatch automated Slack alerts when failing assertions or request errors occur.

tasks:
  - id: evaluate_postman_monitor_run
    type: io.kestra.plugin.scripts.python.Script
    description: Queries Postman REST API for collection monitor execution statistics and assertion results.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests kestra
    env:
      POSTMAN_API_KEY: "{{ secret('POSTMAN_API_KEY') }}"
    script: |
      import os
      import json
      import requests
      from kestra import Kestra

      monitor_id = "{{ inputs.postman_monitor_id }}".strip()
      api_key = os.environ.get("POSTMAN_API_KEY", "")
      threshold = int("{{ inputs.max_failed_assertions_threshold }}")

      headers = {
          "X-Api-Key": api_key,
          "Accept": "application/json"
      }

      url = f"https://api.getpostman.com/monitors/{monitor_id}"

      monitor_name = f"Monitor-{monitor_id}"
      failed_assertions = 0
      failed_requests = 0
      total_requests = 0
      has_failures = False

      try:
          resp = requests.get(url, headers=headers, timeout=20)
          resp.raise_for_status()
          data = resp.json()
          monitor = data.get("monitor", {})
          monitor_name = monitor.get("name", monitor_name)
          last_run = monitor.get("lastRun", {})
          stats = last_run.get("stats", {})

          failed_assertions = stats.get("assertions", {}).get("failed", 0)
          total_assertions = stats.get("assertions", {}).get("total", 0)
          failed_requests = stats.get("requests", {}).get("failed", 0)
          total_requests = stats.get("requests", {}).get("total", 0)

          if failed_assertions > threshold or failed_requests > 0:
              has_failures = True

          Kestra.outputs({
              "monitor_id": monitor_id,
              "monitor_name": monitor_name,
              "failed_assertions": failed_assertions,
              "total_assertions": total_assertions,
              "failed_requests": failed_requests,
              "total_requests": total_requests,
              "has_failures": has_failures,
              "run_status": last_run.get("status", "unknown")
          })

      except Exception as e:
          print(f"Error querying Postman Monitor API: {e}")
          Kestra.outputs({
              "monitor_id": monitor_id,
              "monitor_name": monitor_name,
              "failed_assertions": 0,
              "total_assertions": 0,
              "failed_requests": 0,
              "total_requests": 0,
              "has_failures": False,
              "run_status": "error"
          })

  - id: check_assertion_failures
    type: io.kestra.plugin.core.flow.If
    description: Evaluates whether collection monitor recorded failing assertions or HTTP request errors.
    condition: "{{ outputs.evaluate_postman_monitor_run.vars.has_failures and inputs.alert_on_failure }}"
    then:
      - id: notify_slack_postman_failure
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches API test assertion failure warning to engineering channel on Slack.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#api-contract-alerts",
            "username": "Postman-Sentinel",
            "text": "CRITICAL: Postman API Monitor `{{ outputs.evaluate_postman_monitor_run.vars.monitor_name }}` failed `{{ outputs.evaluate_postman_monitor_run.vars.failed_assertions }}` assertion(s) and `{{ outputs.evaluate_postman_monitor_run.vars.failed_requests }}` request(s)! Total assertions: {{ outputs.evaluate_postman_monitor_run.vars.total_assertions }}. Triage runbook: https://go.postman.co/monitors/{{ outputs.evaluate_postman_monitor_run.vars.monitor_id }}"
          }

  - id: log_assertion_status
    type: io.kestra.plugin.core.log.Log
    description: Records an operational audit trail of Postman collection monitor run results.
    message: "Postman monitor audit completed for '{{ outputs.evaluate_postman_monitor_run.vars.monitor_name }}'. Failed Assertions: {{ outputs.evaluate_postman_monitor_run.vars.failed_assertions }}/{{ outputs.evaluate_postman_monitor_run.vars.total_assertions }}, Failed Requests: {{ outputs.evaluate_postman_monitor_run.vars.failed_requests }}, Has Failures: {{ outputs.evaluate_postman_monitor_run.vars.has_failures }}."

  - id: export_postman_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Emits structured manifest of Postman monitor test results for API quality scorecards.
    format:
      monitor_id: "{{ outputs.evaluate_postman_monitor_run.vars.monitor_id }}"
      monitor_name: "{{ outputs.evaluate_postman_monitor_run.vars.monitor_name }}"
      failed_assertions: "{{ outputs.evaluate_postman_monitor_run.vars.failed_assertions }}"
      total_assertions: "{{ outputs.evaluate_postman_monitor_run.vars.total_assertions }}"
      failed_requests: "{{ outputs.evaluate_postman_monitor_run.vars.failed_requests }}"
      has_failures: "{{ outputs.evaluate_postman_monitor_run.vars.has_failures }}"
      run_status: "{{ outputs.evaluate_postman_monitor_run.vars.run_status }}"

triggers:
  - id: fifteen_minute_postman_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: Automated schedule trigger auditing Postman collection monitors every fifteen minutes.
    cron: "*/15 * * * *"

extend:
  title: Postman Monitors Failing Assertion Runbook Sentinel
  metaTitle: Postman Monitors Failing Assertion Runbook Sentinel Blueprint
  shortDescription: Audits Postman API collection monitors for failed assertions and regression triage runbooks.
  metaDescription: Audits Postman collection monitor test runs, detects failed response assertions, and delivers triaging runbooks to engineering on Slack.
  description: |
    Modern microservice ecosystems and public developer platforms depend on REST APIs to execute mission-critical business transactions. Engineering and Quality teams frequently automate synthetic contract testing by configuring Postman Monitors to execute Postman Collections on recurring schedules across global cloud regions. However, when upstream backend deployments introduce breaking schema modifications, missing header validations, or HTTP 500 internal errors, Postman default email notifications often land in developer spam filters or unmonitored mailing lists. As a result, API contract regressions can persist unnoticed in production for days. This sentinel queries the Postman REST API every 15 minutes, inspects the latest test run statistics for failed assertions and HTTP errors, and dispatches rich incident alerts to Slack with direct links to the Postman web execution console and triage runbooks.

    ## How it works
    1. **Scheduled triggering**: Executes every 15 minutes via automated cron trigger (`*/15 * * * *`) or runs on-demand via manual execution.
    2. **Monitor inspection query**: Calls the Postman REST API endpoint `/monitors/{monitor_id}` using a secured Postman API key.
    3. **Run statistics parsing**: Evaluates `lastRun.stats.assertions` and `lastRun.stats.requests` to measure total executions versus failed counts.
    4. **Threshold comparison**: Verifies whether `failed_assertions` exceeds `max_failed_assertions_threshold` or if any HTTP requests experienced fatal connection drops.
    5. **Conditional alerting**: An `io.kestra.plugin.core.flow.If` flowable checks if the run recorded failures and dispatches a Slack alert to `#api-contract-alerts`.
    6. **Manifest export**: Emits a structured JSON audit payload detailing assertion metrics for API reliability scorecards and release quality gates.

    ## Architecture diagram
    ```mermaid
    flowchart TD
      A[fifteen_minute_postman_audit Schedule Trigger] --> B[evaluate_postman_monitor_run Python Script]
      B --> C[check_assertion_failures Flowable If]
      C -- Assertion Failures Detected --> D[notify_slack_postman_failure Webhook]
      C -- All Assertions Passed --> E[log_assertion_status Log]
      D --> E
      E --> F[export_postman_manifest Return]
    ```

    ## What you get
    - Continuous verification of public and internal API contracts through automated Postman monitor checks.
    - Immediate incident dispatch to Slack with failed assertion counts, request error totals, and direct console links.
    - Elimination of unread email alerts by routing actionable notifications into dedicated engineering channels.
    - Exported JSON diagnostic manifests for tracking API contract stability and regression trends over time.

    ## Who it's for
    - API Platform Engineers maintaining public and partner-facing REST and GraphQL endpoints.
    - QA Automation Engineers building and maintaining enterprise Postman regression test suites.
    - SREs tracking end-to-end API availability and response validation across distributed microservices.

    ## Why orchestrate this with Kestra
    Postman monitors execute scheduled test runs, but integrating those results into broader incident management and CD pipelines requires workflow orchestration. Kestra connects directly to the Postman API, evaluates assertion failure rates against custom operational thresholds, and coordinates multi-channel alerts with triaging runbooks. Using Kestra's containerized Python runner and native secret management, teams bridge the gap between testing suites and production reliability operations.

    ## Use cases
    - **API Contract Drift Protection**: Detect when a backend service deployment breaks response JSON schema assumptions before frontend clients fail.
    - **Partner Integration Health Verification**: Monitor critical external third-party webhook and API integrations to catch vendor outages immediately.
    - **Deployment Smoke Test Gate**: Trigger monitor evaluation post-deployment and gate subsequent release stages based on test assertion pass rates.

    ## Inputs
    | Name | Type | Default | Description |
    | :--- | :--- | :--- | :--- |
    | `postman_monitor_id` | `STRING` | `12345678-abcd-1234-ef01-123456789abc` | Unique identifier UID of the target Postman collection monitor to evaluate. |
    | `max_failed_assertions_threshold` | `INT` | `0` | Maximum allowable failed test assertions in the most recent run before raising an incident. |
    | `alert_on_failure` | `BOOL` | `true` | Whether to dispatch automated Slack alerts when failing assertions or request errors occur. |

    ## Expected outputs
    - `{{ outputs.evaluate_postman_monitor_run.vars.monitor_name }}`: Display name of the evaluated Postman collection monitor.
    - `{{ outputs.evaluate_postman_monitor_run.vars.failed_assertions }}`: Count of failed test assertions in the latest run.
    - `{{ outputs.evaluate_postman_monitor_run.vars.has_failures }}`: Boolean flag indicating whether assertions or requests failed.
    - `{{ outputs.export_postman_manifest.value }}`: Structured dictionary containing the consolidated Postman monitor execution summary.

    ## Prerequisites
    - Outbound HTTPS network access from Kestra execution workers to `api.getpostman.com`.
    - A Postman API Key (`PMAK-...`) with read permissions for collection monitors.
    - A Slack Incoming Webhook URL configured in Kestra secrets.

    ### Secrets
    - `POSTMAN_API_KEY`: Postman API access key with permissions to read monitor run statistics.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL used to dispatch API contract incident notifications.

    ## Quick start
    1. Register `POSTMAN_API_KEY` and `SLACK_WEBHOOK_URL` in your Kestra secret storage.
    2. Import this blueprint into your Kestra instance under the `company.qa` namespace.
    3. Update `postman_monitor_id` with your monitor UID (found in Postman web console URL).
    4. Run a manual execution to test Postman API authentication and verify the structured output.

    ## Common pitfalls and troubleshooting
    - **Monitor UID vs Collection UID**: Ensure the input is the Monitor UID (from the Monitors tab in Postman) rather than the Collection or Workspace UID.
    - **Run Latency**: If the monitor runs on an hourly schedule, the sentinel evaluates the most recent completed run; ensure test runs complete within expected windows.
    - **Key Rate Limits**: The Postman API enforces rate limits based on team plan tiers; polling on a 15-minute interval stays well within free and enterprise quotas.

    ## How to extend
    - **Automated Re-Run Trigger**: Add a downstream HTTP task to invoke `POST /monitors/{monitor_id}/run` to re-execute the collection upon transient network failure.
    - **Jira Bug Creation**: Automatically create a bug in Jira when a test assertion fails across two consecutive runs.
    - **Multi-Monitor Matrix Audit**: Loop over an array of monitor UIDs using `io.kestra.plugin.core.flow.ForEach` to audit all team test suites.

    ## Links
    - [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
    - [Postman Monitors API Reference](https://www.postman.com/postman/workspace/postman-public-workspace/documentation/12959542-c8142d51-e97c-46b6-bd77-52bb66712c9a)
    - [Postman Synthetic Monitoring Guide](https://learning.postman.com/docs/monitoring-your-api/intro-monitors/)
  tags:
    - Infrastructure
    - Core
  subTags:
    - Monitoring & Alerting
    - Testing & Quality
  ee: false
  demo: false
