id: victoriametrics-high-cardinality-churn-and-purge-gate
namespace: company.monitoring

description: |
  Inspect VictoriaMetrics TSDB status endpoints to detect time-series cardinality explosions and churn,
  track growth trends against historical KV snapshots, pause for operator approval, safely purge
  runaway high-cardinality metrics via the admin delete API, and verify series count reduction post-remediation.

inputs:
  - id: victoriametrics_url
    type: STRING
    displayName: VictoriaMetrics Base URL
    description: HTTP endpoint of the VictoriaMetrics single-node instance or vmselect/vmstorage balancer.
    defaults: "http://localhost:8428"

  - id: instance_id
    type: STRING
    displayName: Instance Identifier
    description: Unique identifier for tracking this VictoriaMetrics cluster instance in KV storage.
    defaults: "prod-metrics"

  - id: max_series_threshold
    type: INT
    displayName: Maximum Total Series Warning Threshold
    description: Total active time series count threshold triggering immediate cardinality review.
    defaults: 1000000

  - id: max_churn_rate_percent
    type: INT
    displayName: Maximum Series Churn Rate Threshold (%)
    description: Percentage growth in active time series between audit cycles triggering escalation.
    defaults: 20

  - id: runaway_label_threshold
    type: INT
    displayName: Runaway Label Series Count Threshold
    description: Minimum series count attributed to a single label name before flagging it as a runaway cardinality leak.
    defaults: 100000

  - id: dry_run
    type: BOOL
    displayName: Dry Run Mode
    description: When true, identifies cardinality leaks and plans deletion without calling the admin delete_series API.
    defaults: true

triggers:
  - id: periodic_cardinality_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: Run automated VictoriaMetrics series churn audit and cardinality inspection every 2 hours.
    cron: "0 */2 * * *"
    disabled: true

  - id: on_demand_churn_webhook
    type: io.kestra.plugin.core.trigger.Webhook
    description: Authenticated HTTP endpoint invoked by VictoriaMetrics memory alerts, Alertmanager, or SRE runbooks.
    key: "{{ secret('VM_CARDINALITY_WEBHOOK_KEY') }}"

tasks:
  - id: validate_inputs
    type: io.kestra.plugin.core.execution.Assert
    description: Assert configuration parameters satisfy operational bounds.
    conditions:
      - "{{ inputs.victoriametrics_url | length > 0 }}"
      - "{{ inputs.instance_id | length > 0 }}"
      - "{{ inputs.max_series_threshold >= 1000 }}"
      - "{{ inputs.max_churn_rate_percent >= 5 and inputs.max_churn_rate_percent <= 500 }}"
      - "{{ inputs.runaway_label_threshold >= 1000 }}"
    errorMessage: "Invalid inputs. Provide valid VictoriaMetrics endpoints, instance IDs, and positive thresholds."

  - id: get_tsdb_status
    type: io.kestra.plugin.core.http.Request
    description: Query VictoriaMetrics TSDB status endpoint for top metric and label cardinality breakdowns.
    uri: "{{ inputs.victoriametrics_url }}/api/v1/status/tsdb?topN=20"
    method: GET
    headers:
      Accept: application/json
    options:
      timeout: PT15S

  - id: get_total_series_count
    type: io.kestra.plugin.core.http.Request
    description: Query total active time series count across the entire TSDB storage engine.
    uri: "{{ inputs.victoriametrics_url }}/api/v1/series/count"
    method: GET
    headers:
      Accept: application/json
    options:
      timeout: PT15S

  - id: inspect_and_classify_churn
    type: io.kestra.plugin.scripts.python.Script
    description: Classify cardinality leaks, calculate series churn rates, and formulate purge targets against historical KV state.
    containerImage: python:3.11-slim
    env:
      INSTANCE_ID: "{{ inputs.instance_id }}"
      MAX_SERIES_THRESHOLD: "{{ inputs.max_series_threshold }}"
      MAX_CHURN_RATE_PERCENT: "{{ inputs.max_churn_rate_percent }}"
      RUNAWAY_LABEL_THRESHOLD: "{{ inputs.runaway_label_threshold }}"
      DRY_RUN: "{{ inputs.dry_run }}"
      TSDB_STATUS_JSON: "{{ outputs.get_tsdb_status.body }}"
      SERIES_COUNT_JSON: "{{ outputs.get_total_series_count.body }}"
      PREVIOUS_STATE_JSON: "{{ kv('vm_cardinality_tracker_' ~ (inputs.instance_id | slugify), errorOnMissing=false) ?? '{}' }}"
      EXECUTION_ID: "{{ execution.id }}"
    script: |
      import os
      import sys
      import json
      from datetime import datetime, timezone

      now_utc = datetime.now(timezone.utc)
      now_iso = now_utc.isoformat()

      instance_id = os.environ.get("INSTANCE_ID", "prod-metrics").strip()
      max_series_thresh = int(os.environ.get("MAX_SERIES_THRESHOLD", "1000000"))
      max_churn_thresh = float(os.environ.get("MAX_CHURN_RATE_PERCENT", "20"))
      runaway_label_thresh = int(os.environ.get("RUNAWAY_LABEL_THRESHOLD", "100000"))
      dry_run = os.environ.get("DRY_RUN", "true").lower() == "true"
      execution_id = os.environ.get("EXECUTION_ID", "local-test")

      # Parse current total series count
      count_raw = os.environ.get("SERIES_COUNT_JSON", "{}")
      try:
          count_data = json.loads(count_raw) if count_raw.strip() else {}
          arr = count_data.get("data", [0])
          total_series = int(arr[0]) if arr else 0
      except Exception:
          total_series = 0

      # Parse TSDB status breakdown
      status_raw = os.environ.get("TSDB_STATUS_JSON", "{}")
      try:
          status_data = json.loads(status_raw) if status_raw.strip() else {}
          data = status_data.get("data", {})
          top_metrics = data.get("seriesCountByMetricName", [])
          top_labels = data.get("seriesCountByLabelName", [])
      except Exception:
          top_metrics = []
          top_labels = []

      # Parse historical KV tracker
      prev_state_raw = os.environ.get("PREVIOUS_STATE_JSON", "{}")
      try:
          prev_state = json.loads(prev_state_raw) if prev_state_raw.strip() else {}
      except Exception:
          prev_state = {}

      prev_total = int(prev_state.get("total_series", 0))
      churn_delta = total_series - prev_total
      churn_rate_pct = round((churn_delta / prev_total) * 100, 2) if prev_total > 0 else 0.0

      # Identify runaway high-cardinality labels
      runaway_labels = [l for l in top_labels if int(l.get("value", 0)) >= runaway_label_thresh]

      purge_targets = []
      if runaway_labels:
          top_offender = runaway_labels[0]
          label_name = top_offender.get("name")
          offender_count = int(top_offender.get("value", 0))
          top_metric = top_metrics[0].get("name") if top_metrics else None

          if top_metric:
              match_expr = f'{top_metric}{{{label_name}=~".+"}}'
          else:
              match_expr = f'{{{label_name}=~".+"}}'

          purge_targets.append({
              "label_name": label_name,
              "metric_name": top_metric or "all",
              "series_count": offender_count,
              "match_expr": match_expr,
              "reason": f"Runaway cardinality leak on label '{label_name}' ({offender_count} series >= {runaway_label_thresh})"
          })

      threshold_exceeded = total_series >= max_series_thresh
      churn_exceeded = churn_rate_pct >= max_churn_thresh and churn_delta > 0
      runaway_detected = len(purge_targets) > 0 or (threshold_exceeded and churn_exceeded)

      status = "CRITICAL" if (len(purge_targets) > 0 and threshold_exceeded) else ("WARNING" if runaway_detected else "HEALTHY")

      summary = (
          f"VictoriaMetrics Cardinality Audit: {status} | Instance '{instance_id}' has {total_series} series "
          f"(delta: {churn_delta:+d}, churn rate: {churn_rate_pct}%). "
          f"Runaway labels: {len(runaway_labels)} | Purge targets: {len(purge_targets)} | Dry run: {dry_run}."
      )
      print(summary)

      new_state_snapshot = {
          "instance_id": instance_id,
          "total_series": total_series,
          "churn_delta": churn_delta,
          "churn_rate_pct": churn_rate_pct,
          "runaway_labels_count": len(runaway_labels),
          "last_evaluated_at": now_iso,
          "execution_id": execution_id
      }

      print("::" + json.dumps({
          "outputs": {
              "status": status,
              "total_series": total_series,
              "churn_delta": churn_delta,
              "churn_rate_pct": churn_rate_pct,
              "threshold_exceeded": threshold_exceeded,
              "churn_exceeded": churn_exceeded,
              "runaway_detected": runaway_detected,
              "runaway_labels": runaway_labels,
              "purge_targets": purge_targets,
              "new_state_snapshot": new_state_snapshot,
              "summary": summary
          }
      }) + "::")

  - id: save_cardinality_tracker_kv
    type: io.kestra.plugin.core.kv.Set
    description: Persist total series count and churn metrics in Kestra KV for historical growth and trend tracking.
    key: "vm_cardinality_tracker_{{ inputs.instance_id | slugify }}"
    value: "{{ outputs.inspect_and_classify_churn.vars.new_state_snapshot | toJson }}"
    kvType: JSON

  - id: evaluate_cardinality_findings
    type: io.kestra.plugin.core.flow.If
    description: Branch execution when runaway cardinality leaks or rapid series churn are detected.
    condition: "{{ outputs.inspect_and_classify_churn.vars.runaway_detected == true }}"
    then:
      - id: notify_platform_sre
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatch incident notification detailing time-series churn, runaway labels, and planned purge.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#monitoring-ops",
            "attachments": [
              {
                "color": "{{ outputs.inspect_and_classify_churn.vars.status == 'CRITICAL' ? 'danger' : 'warning' }}",
                "title": ":warning: VictoriaMetrics Cardinality Churn Alert Triggered",
                "text": "*Instance:* `{{ inputs.instance_id }}`\n*Total Series:* `{{ outputs.inspect_and_classify_churn.vars.total_series }}` (Delta: `{{ outputs.inspect_and_classify_churn.vars.churn_delta }}`)\n*Churn Rate:* `{{ outputs.inspect_and_classify_churn.vars.churn_rate_pct }}%`\n*Purge Targets:* `{{ outputs.inspect_and_classify_churn.vars.purge_targets | length }}`\n*Dry Run:* `{{ inputs.dry_run }}`",
                "footer": "Kestra VictoriaMetrics Gate • Execution {{ execution.id }}"
              }
            ]
          }

      - id: execute_purge_gate
        type: io.kestra.plugin.core.flow.If
        description: Execute series purge via VictoriaMetrics admin API when dry_run is disabled.
        condition: "{{ not inputs.dry_run and (outputs.inspect_and_classify_churn.vars.purge_targets | length > 0) }}"
        then:
          - id: pause_for_purge_approval
            type: io.kestra.plugin.core.flow.Pause
            description: Pause workflow execution for SRE operator review before purging time-series from VictoriaMetrics storage. Resume to apply or kill to abort.

          - id: purge_runaway_series
            type: io.kestra.plugin.core.flow.Loop
            description: Invoke VictoriaMetrics delete_series API for each classified runaway cardinality match expression.
            values: "{{ outputs.inspect_and_classify_churn.vars.purge_targets }}"
            tasks:
              - id: delete_matching_series
                type: io.kestra.plugin.core.http.Request
                description: Execute administrative time-series drop query.
                uri: "{{ inputs.victoriametrics_url }}/api/v1/admin/tsdb/delete_series?match[]={{ fromJson(item.value).match_expr | urlencode }}"
                method: POST
                headers:
                  Accept: application/json
                options:
                  timeout: PT30S

          - id: verify_post_purge_series_count
            type: io.kestra.plugin.core.http.Request
            description: Post-remediation verification re-querying series count to confirm time-series elimination.
            uri: "{{ inputs.victoriametrics_url }}/api/v1/series/count"
            method: GET
            headers:
              Accept: application/json
            options:
              timeout: PT15S

          - id: assert_series_count_reduced
            type: io.kestra.plugin.core.execution.Assert
            description: Assert post-remediation series count is strictly lower than initial inspection count.
            conditions:
              - "{{ fromJson(outputs.verify_post_purge_series_count.body).data[0] < outputs.inspect_and_classify_churn.vars.total_series }}"
            errorMessage: "Post-remediation verification failed: Active series count did not decrease after purging runaway series."

          - id: log_purge_success
            type: io.kestra.plugin.core.log.Log
            description: Log verified purge results and new active series count.
            message: "Successfully purged {{ outputs.inspect_and_classify_churn.vars.purge_targets | length }} runaway time-series match expression(s) from VictoriaMetrics instance '{{ inputs.instance_id }}'. Initial series: {{ outputs.inspect_and_classify_churn.vars.total_series }}, Post-remediation series: {{ fromJson(outputs.verify_post_purge_series_count.body).data[0] }}."

        else:
          - id: log_dry_run_summary
            type: io.kestra.plugin.core.log.Log
            description: Log planned series purge actions in dry-run mode.
            message: "Dry run mode active. No time-series deleted from '{{ inputs.instance_id }}'. Planned: {{ outputs.inspect_and_classify_churn.vars.purge_targets | length }} target(s)."

errors:
  - id: alert_flow_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Dispatch failure notification if VictoriaMetrics cardinality audit flow fails.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "#monitoring-ops",
        "attachments": [
          {
            "color": "danger",
            "title": ":rotating_light: VictoriaMetrics Cardinality Flow Failed",
            "text": "Execution `{{ execution.id }}` failed while inspecting instance `{{ inputs.instance_id }}` on `{{ inputs.victoriametrics_url }}`. Check endpoint connectivity and admin API access."
          }
        ]
      }

extend:
  title: VictoriaMetrics High-Cardinality Churn and Emergency Series Purge Gate
  metaTitle: VictoriaMetrics High-Cardinality Churn & Series Purge Gate | Kestra
  shortDescription: Audit VictoriaMetrics time-series cardinality churn, safely purge runaway metric labels with approval gates, and verify recovery.
  metaDescription: Audit VictoriaMetrics time-series cardinality churn, safely purge runaway metric labels with approval gates, and verify recovery in Kestra.
  description: |
    Production monitoring infrastructure built on Prometheus and VictoriaMetrics often suffers
    from time-series cardinality explosions. When application microservices inadvertently inject
    high-cardinality values (such as raw user IDs, transaction UUIDs, or dynamic request paths) into
    metric labels, millions of ephemeral time-series proliferate across the TSDB storage engine.

    This runaway cardinality spike severely degrades cluster performance: index database files
    (`indexdb`) swell exponentially, memory consumption spikes, disk cache hit ratios collapse,
    and Prometheus query latency skyrockets. In severe incidents, out-of-memory (OOM) crashes can
    compromise overall observability across the entire platform.

    Remediating cardinality explosions manually is error-prone: administrators must identify the exact
    culprit label, craft dangerous regex delete queries, and risk dropping legitimate telemetry.
    Furthermore, without historical tracking, it is difficult to distinguish steady metric growth
    from an acute runaway churn anomaly.

    This blueprint provides an automated VictoriaMetrics cardinality guard. It queries the TSDB status
    endpoint (`/api/v1/status/tsdb`), computes series churn rates against historical KV snapshots,
    flags runaway cardinality labels, alerts SRE teams, halts for human operator approval, executes
    targeted series drops via the administrative delete API (`/api/v1/admin/tsdb/delete_series`),
    and verifies active series reduction post-remediation.

    ## How it works

    1. **Pre-flight Assertion**: The workflow asserts that VictoriaMetrics connection endpoints, instance identifiers, and cardinality warning thresholds meet operational bounds.
    2. **TSDB Cardinality Query**: `io.kestra.plugin.core.http.Request` queries `/api/v1/status/tsdb?topN=20` to fetch top series counts by metric name and label name.
    3. **Total Series Telemetry**: A secondary HTTP request calls `/api/v1/series/count` to retrieve the current total active time-series count across the cluster.
    4. **Differential Churn Classification**: An isolated Python script compares current metrics against historical snapshots stored in Kestra KV under `vm_cardinality_tracker_{instance_id}`. It computes the net series growth delta, churn percentage rate, and isolates runaway labels exceeding `runaway_label_threshold`.
    5. **State Tracking**: `io.kestra.plugin.core.kv.Set` persists updated series counts and churn rates in Kestra KV for longitudinal growth analysis.
    6. **SRE Team Escalation**: `io.kestra.plugin.slack.notifications.SlackIncomingWebhook` delivers a structured alert summarizing active series counts, churn deltas, and proposed purge targets.
    7. **Safe Remediation with Approval Gate**: When `dry_run` is disabled:
       - Workflow execution pauses (`io.kestra.plugin.core.flow.Pause`) for SRE review of the exact match expressions.
       - `io.kestra.plugin.core.flow.Loop` iterates over identified purge targets and executes HTTP POST calls to `/api/v1/admin/tsdb/delete_series?match[]={match_expr}`.
    8. **Post-Remediation Verification**: The workflow re-queries `/api/v1/series/count` and executes `io.kestra.plugin.core.execution.Assert` to verify that active series count has strictly decreased.

    ## What you get

    - Automated detection of high-cardinality metric leaks and sudden series churn spikes.
    - Elimination of cluster memory saturation and index bloat caused by runaway labels.
    - Targeted deletion of culprit time-series without impacting unaffected application metrics.
    - Operator approval gates and dry-run preview to prevent accidental telemetry loss.
    - Longitudinal growth tracking stored across runs in Kestra KV.
    - Post-remediation assertions confirming that active series counts were reduced.

    ## Who it's for

    - Platform Engineers and Site Reliability Engineers (SREs) operating VictoriaMetrics and Prometheus stacks.
    - Observability and Infrastructure Teams managing enterprise monitoring budgets and disk capacity.
    - DevOps Teams maintaining high-throughput Kubernetes cluster metrics.

    ## Why orchestrate this with Kestra

    VictoriaMetrics provides an administrative delete API, but lacks native mechanisms to compute differential churn across runs, detect persistent cardinality anomalies, enforce operator approval gates, or dispatch multi-channel alerts.
    Writing ad-hoc shell scripts creates unmonitored failure points without execution audit trails, retry policies, or credential masking.

    Orchestrating this maintenance gate with Kestra provides a declarative workflow with integrated KV state tracking, native HTTP execution, pause-and-resume approval gates, structured Slack notifications, and post-action verification.

    ## Prerequisites

    - An accessible VictoriaMetrics single-node instance or cluster endpoint (version 1.70 or higher) with the admin API enabled (`-search.disableCache` / `-enableTCP6`).
    - Administrative access to call `/api/v1/admin/tsdb/delete_series`.
    - A Slack Incoming Webhook URL to receive triage alerts.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook endpoint URL used for SRE monitoring alerts.
    - `VM_CARDINALITY_WEBHOOK_KEY`: Secret authentication key protecting the on-demand webhook trigger.

    ## Quick start

    1. Configure `SLACK_WEBHOOK_URL` and `VM_CARDINALITY_WEBHOOK_KEY` in your Kestra namespace secrets.
    2. Import this blueprint and configure `victoriametrics_url` and `instance_id` to match your environment.
    3. Run a manual execution with `dry_run: true` to record an initial baseline and review identified runaway labels.
    4. When ready to purge runaway series, run with `dry_run: false` and approve the paused execution.
    5. Enable the `periodic_cardinality_audit` schedule trigger to run cardinality audits automatically every 2 hours.

    ## How to extend

    - **Prometheus Rule Reload**: Add an `io.kestra.plugin.core.http.Request` task to reload Prometheus or vmagent scrape configurations to drop the offending label at ingestion.
    - **PagerDuty Emergency Escalation**: Add `io.kestra.plugin.pagerduty.notifications.PagerDutyAlert` if total series count crosses critical cluster capacity limits ($> 5,000,000$ series).
    - **Grafana Dashboard Annotation**: Add an HTTP task to annotate Grafana latency dashboards marking the exact timestamp when runaway series were dropped.

    ## Links

    - [VictoriaMetrics TSDB Status Documentation](https://docs.victoriametrics.com/#tsdb-stats)
    - [VictoriaMetrics Delete Series API Reference](https://docs.victoriametrics.com/#how-to-delete-time-series)
    - [Kestra HTTP Plugin Documentation](https://kestra.io/plugins/core/tasks/http/io.kestra.plugin.core.http.request)
    - [Kestra KV Store Documentation](https://kestra.io/plugins/core/tasks/kv/io.kestra.plugin.core.kv.set)
    - [Kestra Slack Notifications Plugin](https://kestra.io/plugins/plugin-slack)

  tags:
    - Infrastructure
    - Data
  subTags:
    - Monitoring & Alerting
    - Approval Gates
  ee: false
  demo: false
