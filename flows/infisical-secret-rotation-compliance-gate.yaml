id: infisical-secret-rotation-compliance-gate
namespace: company.team

description: |
  Authenticate against Infisical with a machine identity on a schedule,
  list every secret in a project/environment, classify rotation
  compliance as COMPLIANT, NON_COMPLIANT, or UNREACHABLE based on how
  long ago each secret's value was last updated, log clean audits, and
  alert Slack the moment a secret has gone longer than policy allows
  without being rotated.

inputs:
  - id: infisical_url
    type: STRING
    defaults: "http://localhost:8080"
    displayName: "Infisical Base URL"
    description: "Base URL of the Infisical instance, no trailing slash."
  - id: project_id
    type: STRING
    displayName: "Infisical Project ID"
    description: "ID of the Infisical project to audit, found under Project Settings."
  - id: environment
    type: STRING
    defaults: "prod"
    displayName: "Environment Slug"
    description: "Environment slug to audit, e.g. prod, staging, dev."
  - id: rotation_threshold_days
    type: INT
    defaults: 90
    displayName: "Rotation Threshold (Days)"
    description: "A secret whose value has not been updated in longer than this many days is classified NON_COMPLIANT."

triggers:
  - id: secret_rotation_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    description: "Audit secret rotation compliance once a day."
    cron: "0 7 * * *"
    disabled: true
    inputs:
      infisical_url: "http://localhost:8080"
      environment: "prod"
      rotation_threshold_days: 90
      project_id: replace-with-your-project-id

tasks:
  - id: login_to_infisical
    type: io.kestra.plugin.core.http.Request
    description: "Authenticate a machine identity against Infisical's Universal Auth to obtain the access token used by every subsequent call."
    uri: "{{ inputs.infisical_url }}/api/v1/auth/universal-auth/login"
    method: POST
    contentType: application/json
    body: |
      {
        "clientId": "{{ secret('INFISICAL_CLIENT_ID') }}",
        "clientSecret": "{{ secret('INFISICAL_CLIENT_SECRET') }}"
      }
    allowFailure: true

  - id: list_secrets
    type: io.kestra.plugin.core.http.Request
    description: "List every secret in the target project and environment, including each secret's last-updated timestamp."
    uri: "{{ inputs.infisical_url }}/api/v4/secrets?projectId={{ inputs.project_id }}&environment={{ inputs.environment }}"
    method: GET
    headers:
      Authorization: "{{ outputs.login_to_infisical.body is defined ? ('Bearer ' ~ (outputs.login_to_infisical.body | jq('.accessToken') | first | default(''))) : '' }}"
    allowFailure: true

  - id: classify_rotation_compliance
    type: io.kestra.plugin.core.debug.Return
    description: "Classify UNREACHABLE when the secret list could not be fetched, NON_COMPLIANT when at least one secret has not been updated in longer than rotation_threshold_days, otherwise COMPLIANT."
    format: "{{ outputs.list_secrets.body is defined ? (((outputs.list_secrets.body | jq('[.secrets[] | select((now - (.updatedAt | sub(\"\\\\.[0-9]+Z$\"; \"Z\") | fromdateiso8601)) > (' ~ inputs.rotation_threshold_days ~ ' * 86400))] | length') | first | default(0)) > 0) ? 'NON_COMPLIANT' : 'COMPLIANT') : 'UNREACHABLE' }}"

  - id: route_by_rotation_compliance
    type: io.kestra.plugin.core.flow.Switch
    description: "Log a quiet confirmation when every secret is within policy, page Slack when a secret is overdue for rotation, or page Slack when Infisical could not be reached."
    value: "{{ outputs.classify_rotation_compliance.value }}"
    cases:
      "COMPLIANT":
        - id: log_compliant
          type: io.kestra.plugin.core.log.Log
          message: "All secrets in project {{ inputs.project_id }}/{{ inputs.environment }} have been rotated within {{ inputs.rotation_threshold_days }} day(s)."
      "NON_COMPLIANT":
        - id: alert_non_compliant
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "text": "Infisical sentinel NON_COMPLIANT in project {{ inputs.project_id }}/{{ inputs.environment }}: secret(s) overdue for rotation past {{ inputs.rotation_threshold_days }} day(s): {{ outputs.list_secrets.body | jq('[.secrets[] | select((now - (.updatedAt | sub("\\.[0-9]+Z$"; "Z") | fromdateiso8601)) > (' ~ inputs.rotation_threshold_days ~ ' * 86400)) | .secretKey] | join(", ")') | first }}. Execution {{ execution.id }}."
            }
      "UNREACHABLE":
        - id: alert_unreachable
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "text": "Infisical sentinel UNREACHABLE for project {{ inputs.project_id }}/{{ inputs.environment }}: the secret list could not be fetched (login failure, invalid machine identity credentials, or Infisical is down). Execution {{ execution.id }}."
            }
    defaults:
      - id: log_unclassified
        type: io.kestra.plugin.core.log.Log
        message: "Completed Infisical secret rotation compliance check with status: {{ outputs.classify_rotation_compliance.value }}"

  - id: log_audit_status
    type: io.kestra.plugin.core.log.Log
    description: "Post-audit status line recorded on every run regardless of branch, for a continuous rotation-compliance trend in the execution history."
    message: "Infisical audit: project={{ inputs.project_id }}, environment={{ inputs.environment }}, threshold={{ inputs.rotation_threshold_days }}d, status={{ outputs.classify_rotation_compliance.value }}, execution={{ execution.id }}."

errors:
  - id: alert_flow_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: "Alert Slack when the compliance gate flow itself fails, so a broken check never silently stops monitoring secret rotation."
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "Infisical secret rotation compliance gate flow {{ flow.id }} FAILED (execution {{ execution.id }}). Rotation compliance for project {{ inputs.project_id }}/{{ inputs.environment }} is now unknown; check the task logs and the Infisical dashboard manually."
      }

outputs:
  - id: status
    type: STRING
    value: "{{ outputs.classify_rotation_compliance.value }}"

extend:
  title: "Infisical Secret Rotation Compliance Gate"
  metaTitle: Infisical Secret Rotation Compliance Gate for Kestra
  shortDescription: Audit Infisical projects on a schedule for secrets that have gone too long without being rotated, and alert Slack the moment one falls out of policy.
  metaDescription: Audit Infisical secret rotation age and alert Slack when a secret is overdue for rotation.
  description: |
    A secret that is never rotated is a liability that stays invisible until an audit or an incident surfaces it. This blueprint authenticates against Infisical with a machine identity on a schedule, lists every secret in a project and environment, and pages Slack the moment one has gone longer than policy allows without its value being updated, or Infisical itself cannot be reached.

    ## How it works

    1. `login_to_infisical` (`io.kestra.plugin.core.http.Request`) authenticates a machine identity against `POST /api/v1/auth/universal-auth/login` with a client ID and client secret, returning an `accessToken`. `allowFailure: true` lets the flow continue into classification instead of aborting on a bad login.
    2. `list_secrets` (`io.kestra.plugin.core.http.Request`) calls `GET /api/v4/secrets` scoped to `project_id` and `environment`, with the `accessToken` as a Bearer token, returning every secret's `secretKey` and `updatedAt` timestamp.
    3. `classify_rotation_compliance` (`io.kestra.plugin.core.debug.Return`) checks whether `list_secrets.body` is defined; if not, `UNREACHABLE`. Otherwise it uses `jq` to parse each secret's `updatedAt` (stripping sub-second precision so `fromdateiso8601` can read it) and counts secrets older than `rotation_threshold_days`, returning `NON_COMPLIANT` when that count is above zero, `COMPLIANT` otherwise.
    4. `route_by_rotation_compliance` (`io.kestra.plugin.core.flow.Switch`) branches on that string: `COMPLIANT` logs a quiet confirmation, `NON_COMPLIANT` pages Slack with the exact overdue secret keys, `UNREACHABLE` pages Slack separately, and `defaults` logs the raw outcome.
    5. `log_audit_status` records a status line on every run regardless of branch, so the execution history is a continuous rotation-compliance trend.
    6. The `errors` block pages Slack separately if the flow itself fails outright.
    7. The `secret_rotation_schedule` trigger polls once a day with explicit input overrides, shipped `disabled: true` until you point it at a real Infisical project.

    ## What you get

    - A scheduled, project-wide secret rotation audit with zero custom Infisical SDK code.
    - A three-way `status` output (`COMPLIANT` / `NON_COMPLIANT` / `UNREACHABLE`) you can chart or gate other flows on.
    - A Slack page naming the exact secret key(s) overdue for rotation, not just a generic warning.
    - A separate failure channel for the gate flow itself, plus a standing audit log line per run.

    ## Who it's for

    - Security and platform teams running self-hosted Infisical who need to enforce a rotation policy (SOC 2, PCI, or internal) without manually reviewing every secret.
    - Engineering teams migrating off HashiCorp Vault to Infisical who still want the same operational guardrails.

    ## Why orchestrate this with Kestra

    A rotation policy that lives only in a wiki page gets ignored. This flow keeps every login, every secret snapshot, and every compliance classification in the execution history, turns the audit into a typed output other flows can depend on, and gives you a Switch branch to grow into real remediation (opening a ticket per overdue secret, triggering a rotation workflow) without rewriting the check itself.

    ## Prerequisites

    - A self-hosted Infisical instance reachable at `infisical_url`. The free, official Docker image (`infisical/infisical`) with its bundled `docker-compose.yml` is enough to fully test this blueprint locally.
    - A machine identity configured with Universal Auth and at least read access to the target project and environment.
    - The target project's ID (from Project Settings) and the environment slug to audit.
    - A Slack incoming webhook for the non-compliant and unreachable alerts.

    ### Secrets

    - `INFISICAL_CLIENT_ID`: Universal Auth client ID for the machine identity used to authenticate.
    - `INFISICAL_CLIENT_SECRET`: Universal Auth client secret for that machine identity.
    - `SLACK_WEBHOOK_URL`: Slack incoming webhook used for the non-compliant alert, the unreachable alert, and the flow-failure alert.
    - OSS note: if your Kestra instance reads secrets from environment variables instead of a secrets backend, set `SECRET_INFISICAL_CLIENT_ID`, `SECRET_INFISICAL_CLIENT_SECRET`, and `SECRET_SLACK_WEBHOOK_URL` as base64, for example `echo -n "<your-value>" | base64`.

    ## Quick start

    1. Add the `INFISICAL_CLIENT_ID`, `INFISICAL_CLIENT_SECRET`, and `SLACK_WEBHOOK_URL` secrets.
    2. Set `infisical_url`, `project_id`, and `environment` to your Infisical project, and tune `rotation_threshold_days` to your policy.
    3. Run the flow once and confirm `status` reads `COMPLIANT` or `NON_COMPLIANT` as expected for your current secrets.
    4. Enable `secret_rotation_schedule`.

    ## How to extend

    - Cross-reference `secretReminderRepeatDays` (Infisical's own per-secret reminder setting) instead of a single global threshold, for per-secret rotation policies.
    - Add a `Loop` task over the non-compliant secrets to open one ticket per overdue secret instead of a single combined Slack message.
    - Store each run's non-compliant count in a KV store to build a longer rotation-compliance trend than the execution history alone provides.

    ## Links

    - [Infisical API reference: List secrets](https://infisical.com/docs/api-reference/endpoints/secrets/list)
    - [Infisical Universal Auth](https://infisical.com/docs/documentation/platform/identities/universal-auth)
    - [Kestra Switch task](https://kestra.io/plugins/core/tasks/flow/io.kestra.plugin.core.flow.switch)
  tags:
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - Day 2 Operations
  ee: false
  demo: false
