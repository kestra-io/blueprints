  shortDescription: "Stop Agents From Acting On Injected Tool Results"
  title: Stop Agents From Acting On Injected Tool Results
  metaTitle: 'AI Agent Tool Result Injection Gate: Injected Instructions In Tool Output | Kestra'
  description: |
    What it does
    An agent run can be compromised without any forbidden tool call, any
    leaked secret, any drift from its plan, or any faked tool result.
    This gate checks each tool result before the agent reasons over
    it: an instruction override, a fake system or developer message, a
    forged action lure, a credential lure, or a phishing URL. A
    violating set of results is stopped by a Fail task before the
    agent acts on it. Nothing is escalated anywhere: no issue is
    opened, no alert is sent, no judge is consulted.

    Prerequisites
    A list of tool results as JSON, each result carrying a step number,
    a tool name, and content text. The bundled stub triples run with no
    inputs at all. In production, point tool_results_url or
    tool_results_json at your agent platform export, and run this gate
    at a checkpoint the agent cannot skip, between the tool returning
    and the agent's next reasoning step.

    How it works
    Load and validate the tool results, classify them against the
    instruction rule, the fake system message rule, the forged action
    rule, the credential lure rule, and the phishing URL rule, failing
    closed on unknowns, score the result, and branch on the gate
    outside the WorkingDirectory: a clean set of results is recorded,
    a violating set is stopped by a Fail task.

    How to adapt it
    Keep the gate between the tool return and the next reasoning step,
    tune the patterns to your tools and your own login domains, route
    noisy but genuine sources through vetting first, and treat any
    instruction override, fake system message, or credential lure as a
