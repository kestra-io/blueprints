id: github-reusable-workflow-interface-contract-gate
namespace: company.infrastructure
description: |
  Audit the declared interface of a reusable GitHub Actions workflow before other repositories
  consume it. The flow reads the public workflow YAML at a pinned repository, path and ref,
  validates the workflow_call inputs and secrets, checks input types and typed defaults, and
  inspects declared outputs. It creates a JSON contract report, can alert Slack, and can fail a
  strict compatibility gate without running the workflow itself.

inputs:
  - id: repository
    type: STRING
    displayName: GitHub repository
    defaults: actions/reusable-workflows
    description: Public GitHub repository in owner/name format.
  - id: workflow_path
    type: STRING
    displayName: Reusable workflow path
    defaults: .github/workflows/basic-validation.yml
    description: Path to the reusable workflow file within the repository.
  - id: ref
    type: STRING
    displayName: Git reference
    defaults: main
    description: Branch, tag or commit ref containing the workflow YAML.
  - id: maximum_file_bytes
    type: INT
    displayName: Maximum workflow file bytes
    defaults: 1000000
    description: Maximum decoded YAML size accepted for inspection, from 1024 to 5000000 bytes.
  - id: require_inputs
    type: BOOL
    displayName: Require at least one declared input
    defaults: false
    description: Block a reusable workflow with no workflow_call inputs when enabled.
  - id: strict_mode
    type: BOOL
    displayName: Fail on contract violations
    defaults: true
    description: When enabled, fail if the reusable workflow definition contains blocking contract violations.
  - id: notify_slack
    type: BOOL
    displayName: Send Slack alert
    defaults: false
    description: Enable only after configuring SLACK_WEBHOOK_URL in the Kestra namespace.

triggers:
  - id: weekly_workflow_contract_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: Optional weekly interface audit; disabled until a concrete workflow source and policy are approved.
    cron: "0 9 * * 1"
    disabled: true

tasks:
  - id: validate_request
    type: io.kestra.plugin.scripts.python.Script
    description: Validate the public repository selector, workflow file path, ref and byte limit before contacting GitHub.
    containerImage: python:3.12-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    env:
      REPOSITORY: "{{ inputs.repository }}"
      WORKFLOW_PATH: "{{ inputs.workflow_path }}"
      REF: "{{ inputs.ref }}"
      MAXIMUM_FILE_BYTES: "{{ inputs.maximum_file_bytes }}"
    script: |
      import os
      import re
      from pathlib import PurePosixPath

      repository = os.environ.get("REPOSITORY", "").strip()
      workflow_path = os.environ.get("WORKFLOW_PATH", "").strip()
      ref = os.environ.get("REF", "").strip()
      if not re.fullmatch(r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+", repository):
          raise ValueError("repository must be a public GitHub owner/name pair")
      path = PurePosixPath(workflow_path)
      if not workflow_path or path.is_absolute() or ".." in path.parts or not workflow_path.endswith((".yml", ".yaml")):
          raise ValueError("workflow_path must be a relative .yml or .yaml path without parent traversal")
      if not ref or any(char in ref for char in "\r\n"):
          raise ValueError("ref must be a non-empty branch, tag or commit reference")
      maximum_file_bytes = int(os.environ["MAXIMUM_FILE_BYTES"])
      if not 1024 <= maximum_file_bytes <= 5_000_000:
          raise ValueError("maximum_file_bytes must be between 1024 and 5000000")
      print(f"Validated public source {repository}/{workflow_path} at ref {ref}.")

  - id: audit_workflow_contract
    type: io.kestra.plugin.scripts.python.Script
    description: Retrieve the YAML through the fixed GitHub API host and validate the workflow_call interface without executing any workflow steps.
    containerImage: python:3.12-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    dependencies:
      - pyyaml
      - kestra
    env:
      REPOSITORY: "{{ inputs.repository }}"
      WORKFLOW_PATH: "{{ inputs.workflow_path }}"
      REF: "{{ inputs.ref }}"
      MAXIMUM_FILE_BYTES: "{{ inputs.maximum_file_bytes }}"
      REQUIRE_INPUTS: "{{ inputs.require_inputs }}"
    outputFiles:
      - workflow-contract-report.json
    script: |
      import base64
      import json
      import math
      import os
      import re
      import urllib.error
      import urllib.parse
      import urllib.request
      from datetime import datetime, timezone

      import yaml
      from kestra import Kestra

      repository = os.environ["REPOSITORY"].strip()
      workflow_path = os.environ["WORKFLOW_PATH"].strip()
      ref = os.environ["REF"].strip()
      maximum_file_bytes = int(os.environ["MAXIMUM_FILE_BYTES"])
      require_inputs = os.environ.get("REQUIRE_INPUTS", "false").lower() == "true"

      findings = []
      def add(code, severity, message):
          findings.append({"code": code, "severity": severity, "message": message})

      content_sha = None
      workflow_html_url = None
      workflow_name = None
      input_summary = []
      secret_summary = []
      output_summary = []
      workflow_call_present = False
      source_bytes = 0

      encoded_path = urllib.parse.quote(workflow_path, safe="/")
      query_ref = urllib.parse.urlencode({"ref": ref})
      api_url = f"https://api.github.com/repos/{repository}/contents/{encoded_path}?{query_ref}"
      request = urllib.request.Request(
          api_url,
          headers={
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "Kestra-Reusable-Workflow-Contract-Gate/1.0",
          },
      )

      try:
          with urllib.request.urlopen(request, timeout=20) as response:
              raw_api = response.read(2_000_000 + 1)
          if len(raw_api) > 2_000_000:
              raise ValueError("GitHub Contents API response exceeded the response-size limit")
          api_document = json.loads(raw_api.decode("utf-8"))
          if not isinstance(api_document, dict):
              raise ValueError("GitHub Contents API response must be a single file object")
          if api_document.get("type") != "file":
              raise ValueError("workflow_path must identify a file, not a directory or submodule")
          content_b64 = api_document.get("content")
          if not isinstance(content_b64, str) or not content_b64.strip():
              raise ValueError("GitHub Contents API did not return file content")
          workflow_bytes = base64.b64decode(content_b64, validate=False)
          source_bytes = len(workflow_bytes)
          if source_bytes > maximum_file_bytes:
              raise ValueError(f"workflow YAML exceeds maximum_file_bytes ({maximum_file_bytes})")
          content_sha = api_document.get("sha")
          workflow_html_url = api_document.get("html_url")
          source_text = workflow_bytes.decode("utf-8-sig")
          document = yaml.load(source_text, Loader=yaml.BaseLoader)
          if not isinstance(document, dict):
              raise ValueError("workflow YAML root must be a mapping")
          workflow_name = document.get("name")

          on_section = document.get("on")
          if on_section is None and True in document:
              # YAML 1.1 treats the GitHub Actions key 'on' as boolean true.
              on_section = document.get(True)
          if not isinstance(on_section, dict):
              add("WORKFLOW_ON_SECTION_MISSING", "BLOCK", "Workflow is missing the expected on mapping.")
              on_section = {}
          workflow_call = on_section.get("workflow_call")
          if not isinstance(workflow_call, dict):
              add("WORKFLOW_CALL_MISSING", "BLOCK", "The file does not declare an on.workflow_call reusable-workflow interface.")
              workflow_call = {}
          else:
              workflow_call_present = True

          inputs = workflow_call.get("inputs") or {}
          secrets = workflow_call.get("secrets") or {}
          outputs = workflow_call.get("outputs") or {}
          if not isinstance(inputs, dict):
              add("INPUTS_MAPPING_INVALID", "BLOCK", "workflow_call.inputs must be a mapping.")
              inputs = {}
          if not isinstance(secrets, dict):
              add("SECRETS_MAPPING_INVALID", "BLOCK", "workflow_call.secrets must be a mapping.")
              secrets = {}
          if not isinstance(outputs, dict):
              add("OUTPUTS_MAPPING_INVALID", "BLOCK", "workflow_call.outputs must be a mapping.")
              outputs = {}
          if require_inputs and not inputs:
              add("INPUTS_REQUIRED_BY_POLICY", "BLOCK", "Policy requires at least one declared workflow_call input.")

          valid_types = {"string", "boolean", "number"}
          valid_name = re.compile(r"^[A-Za-z0-9][A-Za-z0-9_-]*$")
          for name, spec in inputs.items():
              if not isinstance(name, str) or not valid_name.fullmatch(name):
                  add("INPUT_NAME_INVALID", "BLOCK", f"Input name {str(name)[:120]!r} contains unsupported characters.")
              if not isinstance(spec, dict):
                  add("INPUT_SPEC_INVALID", "BLOCK", f"Input {str(name)[:120]!r} must be a mapping.")
                  continue
              input_type = str(spec.get("type", "")).lower()
              if input_type not in valid_types:
                  add("INPUT_TYPE_INVALID", "BLOCK", f"Input {name!r} must declare type string, boolean, or number.")
              required = str(spec.get("required", "false")).lower()
              if required not in {"true", "false"}:
                  add("INPUT_REQUIRED_INVALID", "BLOCK", f"Input {name!r} has a required value other than true or false.")
              default_present = "default" in spec
              default = spec.get("default")
              if default_present and input_type == "boolean" and str(default).lower() not in {"true", "false"}:
                  add("INPUT_DEFAULT_TYPE_MISMATCH", "BLOCK", f"Boolean input {name!r} has a default that is not true or false.")
              if default_present and input_type == "number":
                  try:
                      number_default = float(str(default))
                      if not math.isfinite(number_default):
                          raise ValueError("non-finite number")
                  except (TypeError, ValueError):
                      add("INPUT_DEFAULT_TYPE_MISMATCH", "BLOCK", f"Number input {name!r} has a non-numeric default.")
              description = str(spec.get("description", "")).strip()
              if not description:
                  add("INPUT_DESCRIPTION_MISSING", "WARN", f"Input {name!r} has no description.")
              input_summary.append({
                  "name": str(name),
                  "type": input_type or None,
                  "required": required == "true",
                  "hasDefault": default_present,
                  "descriptionPresent": bool(description),
              })

          for name, spec in secrets.items():
              if not isinstance(name, str) or not valid_name.fullmatch(name):
                  add("SECRET_NAME_INVALID", "BLOCK", f"Secret name {str(name)[:120]!r} contains unsupported characters.")
              if not isinstance(spec, dict):
                  add("SECRET_SPEC_INVALID", "BLOCK", f"Secret {str(name)[:120]!r} must be a mapping.")
                  continue
              required = str(spec.get("required", "false")).lower()
              if required not in {"true", "false"}:
                  add("SECRET_REQUIRED_INVALID", "BLOCK", f"Secret {name!r} has a required value other than true or false.")
              secret_summary.append({"name": str(name), "required": required == "true"})

          for name, spec in outputs.items():
              if not isinstance(spec, dict):
                  add("OUTPUT_SPEC_INVALID", "BLOCK", f"Output {str(name)[:120]!r} must be a mapping.")
                  continue
              if not str(spec.get("value", "")).strip():
                  add("OUTPUT_VALUE_MISSING", "BLOCK", f"Output {name!r} does not declare a value expression.")
              description = str(spec.get("description", "")).strip()
              if not description:
                  add("OUTPUT_DESCRIPTION_MISSING", "WARN", f"Output {name!r} has no description.")
              output_summary.append({"name": str(name), "descriptionPresent": bool(description), "valuePresent": bool(str(spec.get("value", "")).strip())})

          if workflow_call_present and not inputs and not secrets and not outputs:
              add("EMPTY_WORKFLOW_CALL_INTERFACE", "WARN", "workflow_call is declared but has no inputs, secrets, or outputs.")
      except urllib.error.HTTPError as exc:
          detail = ""
          try:
              detail = exc.read(1000).decode("utf-8", "replace")
          except Exception:
              pass
          add("WORKFLOW_FETCH_FAILED", "BLOCK", f"GitHub API returned HTTP {exc.code}: {detail[:500]}")
      except Exception as exc:
          add("WORKFLOW_CONTRACT_INSPECTION_FAILED", "BLOCK", str(exc)[:1000])

      blocking = [item for item in findings if item["severity"] == "BLOCK"]
      warnings = [item for item in findings if item["severity"] == "WARN"]
      verdict = "FAIL" if blocking else ("PASS_WITH_WARNINGS" if warnings else "PASS")
      report = {
          "schemaVersion": 1,
          "checkedAt": datetime.now(timezone.utc).isoformat(),
          "repository": repository,
          "workflowPath": workflow_path,
          "ref": ref,
          "workflowName": workflow_name,
          "workflowHtmlUrl": workflow_html_url,
          "contentBlobSha": content_sha,
          "sourceBytes": source_bytes,
          "workflowCallPresent": workflow_call_present,
          "inputs": input_summary,
          "secrets": secret_summary,
          "outputs": output_summary,
          "findings": findings,
          "blockingFindingCount": len(blocking),
          "warningCount": len(warnings),
          "verdict": verdict,
          "scopeNote": "This gate validates the declared workflow_call interface and typed defaults. It does not execute the workflow, prove that its jobs succeed, or compare the interface across two revisions.",
      }
      with open("workflow-contract-report.json", "w", encoding="utf-8") as target:
          json.dump(report, target, indent=2, ensure_ascii=False)
      print(f"Reusable workflow contract audit: {repository}/{workflow_path}@{ref}; workflowCall={workflow_call_present}, inputs={len(input_summary)}, secrets={len(secret_summary)}, outputs={len(output_summary)}, verdict={verdict}, blocking={len(blocking)}")
      Kestra.outputs({
          "repository": repository,
          "workflow_path": workflow_path,
          "ref": ref,
          "workflow_name": workflow_name or "",
          "workflow_html_url": workflow_html_url or "",
          "content_blob_sha": content_sha or "",
          "workflow_call_present": workflow_call_present,
          "input_count": len(input_summary),
          "secret_count": len(secret_summary),
          "output_count": len(output_summary),
          "blocking_finding_count": len(blocking),
          "warning_count": len(warnings),
          "verdict": verdict,
          "findings": findings,
      })

  - id: notify_on_contract_failure
    type: io.kestra.plugin.core.flow.If
    description: Optionally alert Slack when the reusable workflow's declared interface violates policy.
    condition: "{{ inputs.notify_slack and outputs.audit_workflow_contract.vars.blocking_finding_count > 0 }}"
    then:
      - id: send_contract_alert
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Send the workflow reference and findings without exposing source secrets.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |-
          {{
            {
              "text": ":warning: Reusable workflow contract gate failed\nRepository: " ~ outputs.audit_workflow_contract.vars.repository ~
                "\nWorkflow: " ~ outputs.audit_workflow_contract.vars.workflow_path ~
                "\nRef: " ~ outputs.audit_workflow_contract.vars.ref ~
                "\nFindings: " ~ (outputs.audit_workflow_contract.vars.findings | toJson) ~
                "\nExecution: " ~ execution.id ~
                "\nSee workflow-contract-report.json for the interface report."
            } | toJson
          }}

  - id: enforce_contract
    type: io.kestra.plugin.core.flow.If
    description: Fail closed in strict mode when the workflow_call contract has blocking findings.
    condition: "{{ inputs.strict_mode and outputs.audit_workflow_contract.vars.blocking_finding_count > 0 }}"
    then:
      - id: fail_contract_gate
        type: io.kestra.plugin.core.execution.Fail
        description: Stop downstream callers or release checks when the reusable interface is invalid.
        errorMessage: "Reusable workflow interface policy failed. Review workflow-contract-report.json."
    else:
      - id: log_contract_verdict
        type: io.kestra.plugin.core.log.Log
        level: INFO
        message: "Reusable workflow contract verdict={{ outputs.audit_workflow_contract.vars.verdict }}; inputs={{ outputs.audit_workflow_contract.vars.input_count }}; secrets={{ outputs.audit_workflow_contract.vars.secret_count }}; outputs={{ outputs.audit_workflow_contract.vars.output_count }}."

outputs:
  - id: workflow_contract_report
    type: JSON
    description: Machine-readable workflow_call inputs, secrets, outputs, and contract findings.
    value: "{{ outputs.audit_workflow_contract.vars | toJson }}"

extend:
  title: GitHub Reusable Workflow Interface Contract Gate
  metaTitle: GitHub Reusable Workflow Interface Contract Gate | Kestra
  shortDescription: Validate a reusable GitHub Actions workflow's declared inputs, secrets, outputs and typed defaults before consumers depend on it.
  metaDescription: Gate reusable GitHub Actions workflows on valid workflow_call inputs, secret contracts, typed defaults and declared output expressions.
  description: |
    Audit the declared interface of a reusable GitHub Actions workflow before other repositories consume it. The flow reads the public workflow YAML at a chosen repository, path and ref, validates its workflow_call inputs and secrets, checks input types and typed defaults, and inspects declared outputs. It generates a JSON contract report, can alert Slack, and can fail a strict policy gate without running the workflow itself.

    ## How it works

    1. The validation task checks the public repository selector, relative workflow path, ref and maximum file size.
    2. The audit task fetches the selected workflow file through the GitHub Contents API and parses the YAML without executing it.
    3. It validates input names, required flags, the string/boolean/number type set, defaults, secret declarations and output value expressions.
    4. The audit report records the file's Git blob SHA and a machine-readable interface summary.
    5. An optional Slack branch sends a summary when blocking findings exist, and strict mode fails the flow when contract errors are present.

    ## What you get

    - A JSON inventory of the reusable workflow's inputs, secrets and outputs.
    - Detection of missing workflow_call declarations, unsupported input types, malformed required flags and incompatible typed defaults.
    - Warnings for missing descriptions and empty workflow_call interfaces.
    - An optional alert and strict gate that can run before publishing or bumping a reusable-workflow dependency.

    ## Who it's for

    - Platform engineering teams publishing shared GitHub Actions workflows.
    - CI maintainers responsible for stable contracts consumed by multiple repositories.
    - Release engineers checking workflow interfaces before updating pinned refs.

    ## Why orchestrate this with Kestra

    The input contract, validation findings and fail-closed decision are visible in one execution with a saved report. That keeps reusable-workflow governance repeatable and avoids relying on review comments alone to detect schema breakage.

    ## Prerequisites

    - A Kestra 2.x worker with Docker enabled for the Python Script task runner.
    - Network access to api.github.com.
    - The source repository and workflow file must be public; the workflow is fetched read-only and never executed.

    ### Secrets

    - SLACK_WEBHOOK_URL: Slack incoming webhook; required only when notify_slack is enabled.

    ## Quick start

    1. Import the flow and run it with the default actions/reusable-workflows source.
    2. Inspect workflow-contract-report.json and the workflow_contract_report output.
    3. Pin repository, workflow_path and ref to the reusable workflow that downstream callers consume.
    4. Fix blocking input, secret or output-contract findings before updating caller workflows.
    5. Configure SLACK_WEBHOOK_URL before enabling alerts. Keep the schedule disabled until the audit target and policy are approved.

    ## How to extend

    - Compare reports from two refs in a separate promotion flow to detect removed or changed inputs.
    - Add organization-specific required input and secret naming conventions.
    - Validate the caller workflow's with: keys against this reported interface.
    - Record reports for approved reusable workflow versions during a release.

    ## Links

    - [GitHub reusable workflows](https://docs.github.com/en/actions/sharing-automations/reusing-workflows)
    - [GitHub Contents API](https://docs.github.com/en/rest/repos/contents#get-repository-content)
    - [Python PyYAML documentation](https://pyyaml.org/wiki/PyYAMLDocumentation)
    - [Kestra Python Script plugin](https://kestra.io/plugins/plugin-scripts/python)
    - [Kestra Slack plugin](https://kestra.io/plugins/plugin-slack/slackincomingwebhook)
  tags:
    - Infrastructure
  subTags:
    - CI/CD & Deployment
    - Testing & Quality
  ee: false
  demo: false
