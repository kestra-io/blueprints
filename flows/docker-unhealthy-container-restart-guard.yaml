id: docker-unhealthy-container-restart-guard
namespace: company.team

description: |
  Restart the containers that are up but failing their healthcheck. A container with a
  HEALTHCHECK can report unhealthy after a run of failed checks while its process never exits,
  so the daemon still shows it running and the restart policy never fires. This flow reads the
  health status of every container carrying a label you set yourself, keeps a protect-list, then
  restarts each unhealthy one with docker restart behind a dry run and an approval. It waits one
  settle window for the healthcheck to run again, inspects every target once more, then fails the
  run if any target is still unhealthy.

inputs:
  - id: docker_host
    type: STRING
    displayName: Docker host
    description: TCP endpoint of the daemon to watch, for example tcp://build-01:2375. TCP is required because the container list comes from the Engine API, which a mounted unix socket does not expose to the worker.
    defaults: "tcp://docker-host:2375"

  - id: docker_cli_network
    type: STRING
    displayName: Docker CLI network
    description: Network the one-off docker CLI container joins so it can reach docker_host. Leave it as bridge when the daemon resolves by DNS. Set it to the user-defined network when the daemon is itself a container, such as a Docker-in-Docker endpoint.
    defaults: "bridge"

  - id: label_selector
    type: STRING
    displayName: Label selector
    description: Only containers carrying this label are read, in key=value form. Nothing outside the selector is inspected or restarted, so a container the flow does not own cannot be a target.
    defaults: "kestra.health=managed"

  - id: protected_name_pattern
    type: STRING
    displayName: Protected name pattern
    description: A container whose name matches this regular expression is never restarted, even when it is unhealthy. Put stateful services here that must not be bounced in the middle of recovery or a migration.
    defaults: "^(db|database|state|broker|queue|cache)([-_.].*)?$"

  - id: restart_stop_timeout_seconds
    type: INT
    displayName: Restart stop timeout
    description: Seconds docker restart waits for a graceful stop before it kills the process. Maps to docker restart --time.
    defaults: 10

  - id: settle_seconds
    type: INT
    displayName: Settle seconds
    description: How long to wait after a restart before judging health. It must be longer than one healthcheck interval. For the unhealthy verdict to re-form it must also cover the retries. A container reads as starting in the first interval after a restart, so judging it earlier would be meaningless.
    defaults: 45

  - id: max_restarts
    type: INT
    displayName: Restart ceiling
    description: At most this many containers are restarted in one run. The rest are reported and left for the next run, so a wrong selector cannot bounce a whole host in one go.
    defaults: 25

  - id: auto_remediate
    type: BOOL
    displayName: Auto remediate
    description: When false the flow only reports. Must be true, together with dry_run false and the approval, for anything to be restarted.
    defaults: false

  - id: dry_run
    type: BOOL
    displayName: Dry run
    description: When true the plan is only logged. Must be false, together with auto_remediate, for anything to be restarted.
    defaults: true

variables:
  api: "{{ inputs.docker_host | replace({'tcp://': 'http://'}) }}"

tasks:
  - id: list_labelled
    type: io.kestra.plugin.core.http.Request
    description: Read-only. Asks the Engine API for running containers carrying the label selector. A container outside the selector is never returned, so it cannot be seen or restarted.
    uri: "{{ render(vars.api) }}/containers/json"
    method: GET
    params:
      all: "false"
      filters: "{{ {'label': [inputs.label_selector], 'status': ['running']} | toJson }}"

  - id: candidates
    type: io.kestra.plugin.core.output.OutputValues
    description: The candidate ids and names. The list endpoint carries no structured health status, which is why each one is inspected next.
    values:
      ids: >-
        {{ ({'c': fromJson(outputs.list_labelled.body)} | toJson) | jq('
           [.c[] | {id: .Id, name: (.Names[0] | ltrimstr("/"))}] | sort_by(.name)') | first | toJson }}

  - id: inspect_each
    type: io.kestra.plugin.core.flow.Loop
    description: One read-only inspect per candidate. The structured health status, the failing streak and the last healthcheck output exist only here, not in the list.
    values: "{{ outputs.candidates.values.ids }}"
    concurrencyLimit: 4
    outputs:
      - id: state
        type: STRING
        value: >-
          {{ outputs.inspect.body | jq('{id: .Id, name: (.Name | ltrimstr("/")), image: .Config.Image,
             running: .State.Running, status: .State.Status,
             has_health: (.State.Health != null),
             health: (.State.Health.Status // "none"),
             failing_streak: (.State.Health.FailingStreak // 0),
             started_at: (.State.StartedAt // ""),
             health_output: ((((.State.Health.Log // []) | map(.Output // "") | last) // "") | gsub("[\n\r\t]"; " ") | .[0:200])}') | first | toJson }}
    tasks:
      - id: inspect
        type: io.kestra.plugin.core.http.Request
        uri: "{{ render(vars.api) }}/containers/{{ fromJson(item.value).id }}/json"
        method: GET

  - id: assess
    type: io.kestra.plugin.core.output.OutputValues
    description: >-
      One row per candidate with its verdict. Only a running container that has a healthcheck and
      reports unhealthy becomes a target. A container without a healthcheck has no health to act on.
      The protect-list and the restart ceiling both win over RESTART.
    values:
      rows: >-
        {{ ({'rows': ((outputs.inspect_each.outputs ?? []) | jq('map(.outputs.state | fromjson)') | first),
            're': inputs.protected_name_pattern, 'cap': inputs.max_restarts} | toJson) | jq('
           .re as $re | .cap as $cap
           | [.rows[] | . + {decision: (
               if (.running | not) then "KEEP_NOT_RUNNING"
               elif (.has_health | not) then "KEEP_NO_HEALTHCHECK"
               elif (.name | test($re)) then "KEEP_PROTECTED"
               elif (.health == "healthy") then "KEEP_HEALTHY"
               elif (.health == "starting") then "KEEP_STARTING"
               elif (.health == "unhealthy") then "RESTART"
               else "KEEP_OTHER" end)}]
           | sort_by(.name)
           | ([.[] | select(.decision == "RESTART")] | to_entries
              | map(.value + {decision: (if .key < $cap then "RESTART" else "KEEP_OVER_CAP" end)})) as $r
           | ([.[] | select(.decision != "RESTART")] + $r) | sort_by(.decision, .name)') | first | toJson }}
      targets: >-
        {{ ({'rows': ((outputs.inspect_each.outputs ?? []) | jq('map(.outputs.state | fromjson)') | first),
            're': inputs.protected_name_pattern, 'cap': inputs.max_restarts} | toJson) | jq('
           .re as $re | .cap as $cap
           | [.rows[] | select(.running and .has_health and (.health == "unhealthy") and ((.name | test($re)) | not))]
           | sort_by(.name) | .[0:$cap]
           | map({id: .id, name: .name, health: .health, failing_streak: .failing_streak, started_at: .started_at, health_output: .health_output})') | first | toJson }}

  - id: summary
    type: io.kestra.plugin.core.log.Log
    message: >-
      Unhealthy container restart guard on {{ inputs.docker_host }}, label {{ inputs.label_selector }}:
      {{ fromJson(outputs.assess.values.rows) | length }} labelled running containers read,
      {{ fromJson(outputs.assess.values.targets) | length }} to restart.
      {{ fromJson(outputs.assess.values.rows) | jq('group_by(.decision) | map("\(.[0].decision) \(length)") | join(", ")') | first }}.
      Targets: {{ fromJson(outputs.assess.values.targets) | jq('if length == 0 then "none" else map("\(.name) health=\(.health) streak=\(.failing_streak)") | join("; ") end') | first }}.

  - id: route
    type: io.kestra.plugin.core.flow.If
    condition: "{{ fromJson(outputs.assess.values.targets) | length > 0 }}"
    then:
      - id: findings_alert
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {{ {'text': 'Docker unhealthy container restart guard on ' ~ inputs.docker_host ~ ': ' ~ (fromJson(outputs.assess.values.targets) | length) ~ ' of ' ~ (fromJson(outputs.assess.values.rows) | length) ~ ' labelled running containers report unhealthy (' ~ (fromJson(outputs.assess.values.targets) | jq('map("\(.name) streak \(.failing_streak)") | join(", ")') | first) ~ '). ' ~ (inputs.auto_remediate and not inputs.dry_run ? 'A restart of each waits for approval on this execution.' : 'Nothing restarted (auto_remediate=' ~ inputs.auto_remediate ~ ', dry_run=' ~ inputs.dry_run ~ ').')} | toJson }}

      - id: remediate_gate
        type: io.kestra.plugin.core.flow.If
        description: A container is restarted only when auto_remediate is true, dry_run is false and the pause below is approved.
        condition: "{{ inputs.auto_remediate and not inputs.dry_run }}"
        then:
          - id: hold
            type: io.kestra.plugin.core.flow.Pause
            description: A restart interrupts whatever that container is serving right now. Read the plan in the summary above, then resume with approved true.
            onResume:
              - id: approved
                type: BOOL
                required: false
                description: Set true to restart the listed containers. Anything else leaves the host untouched.

          - id: approval_gate
            type: io.kestra.plugin.core.flow.If
            condition: "{{ outputs.hold.onResume.approved ?? false }}"
            then:
              - id: remediate_restart
                type: io.kestra.plugin.core.flow.Loop
                description: One docker restart per target, sequential so a failure is attributable to one container. The docker plugin has no restart task, so the CLI runs in a container that talks to docker_host and to nothing else.
                values: "{{ outputs.assess.values.targets }}"
                concurrencyLimit: 1
                tasks:
                  - id: restart_one
                    type: io.kestra.plugin.scripts.shell.Commands
                    description: docker restart stops then starts the container in place, so it keeps its id and its configuration. allowFailure is on so a container that vanished between detection and here does not abort the loop, the re-check catches it instead.
                    allowFailure: true
                    taskRunner:
                      type: io.kestra.plugin.scripts.runner.docker.Docker
                      networkMode: "{{ inputs.docker_cli_network }}"
                    containerImage: docker:27-cli
                    env:
                      DOCKER_HOST: "{{ inputs.docker_host }}"
                    commands:
                      - docker restart --time {{ inputs.restart_stop_timeout_seconds }} {{ fromJson(item.value).id }}

              - id: settle
                type: io.kestra.plugin.core.flow.Sleep
                description: Wait one settle window so the restarted containers run their healthcheck again. A container reads as starting right after a restart, then becomes healthy or unhealthy once the checks run, so this wait is what makes the re-check meaningful.
                duration: "PT{{ inputs.settle_seconds }}S"

              - id: reverify_each
                type: io.kestra.plugin.core.flow.Loop
                description: Inspect every target again, by name, straight from the daemon rather than trusting the task that restarted it.
                values: "{{ outputs.assess.values.targets }}"
                concurrencyLimit: 4
                outputs:
                  - id: after
                    type: STRING
                    value: >-
                      {{ ({'name': fromJson(item.value).name, 'b': (outputs.reinspect.body ?? '')} | toJson) | jq('
                         if .b == "" then {name: .name, present: false}
                         else (.b | fromjson) as $c
                         | {name: .name, present: true, id: $c.Id,
                            running: $c.State.Running, status: $c.State.Status,
                            has_health: ($c.State.Health != null),
                            health: ($c.State.Health.Status // "none"),
                            failing_streak: ($c.State.Health.FailingStreak // 0),
                            started_at: ($c.State.StartedAt // "")} end') | first | toJson }}
                tasks:
                  - id: reinspect
                    type: io.kestra.plugin.core.http.Request
                    allowFailure: true
                    uri: "{{ render(vars.api) }}/containers/{{ fromJson(item.value).name }}/json"
                    method: GET

              - id: result
                type: io.kestra.plugin.core.output.OutputValues
                description: Join the plan with the host as it is now. A target counts as recovered only when it is running and reports healthy. Still unhealthy, still starting after the settle or no longer running all count as not recovered.
                values:
                  r: >-
                    {{ ({'before': fromJson(outputs.assess.values.targets),
                        'after': ((outputs.reverify_each.outputs ?? []) | jq('map(.outputs.after | fromjson)') | first)} | toJson) | jq('
                       (.after | map({key: .name, value: .}) | from_entries) as $a
                       | [.before[] | . + {now: ($a[.name] // {present: false})}]
                       | {recovered: [.[] | select(.now.present and .now.running and (.now.health == "healthy"))
                            | {name: .name, before: .health, after: .now.health, started_before: .started_at, started_after: .now.started_at}],
                          still_unhealthy: [.[] | select(.now.present and (.now.health == "unhealthy"))
                            | {name: .name, health: .now.health, failing_streak: .now.failing_streak, started_before: .started_at, started_after: .now.started_at}],
                          still_starting: [.[] | select(.now.present and (.now.health == "starting"))
                            | {name: .name, started_after: .now.started_at}],
                          gone: [.[] | select((.now.present | not) or ((.now.present) and (.now.running | not)))
                            | {name: .name, present: .now.present, running: (.now.running // false)}]}
                       | . + {survivors: (.still_unhealthy + .still_starting + .gone)}') | first | toJson }}

              - id: verify
                type: io.kestra.plugin.core.flow.If
                description: The run fails when a target did not come back to healthy. Reporting success without reading the host again is what this gate exists to prevent.
                condition: "{{ fromJson(outputs.result.values.r).survivors | length > 0 }}"
                then:
                  - id: restart_incomplete
                    type: io.kestra.plugin.core.execution.Fail
                    errorMessage: >-
                      Restart did not bring every target back to healthy on {{ inputs.docker_host }}. Still unhealthy after the settle:
                      {{ fromJson(outputs.result.values.r).still_unhealthy | jq('if length == 0 then "none" else map("\(.name) streak \(.failing_streak)") | join(", ") end') | first }}.
                      Still starting (raise settle_seconds above the healthcheck interval):
                      {{ fromJson(outputs.result.values.r).still_starting | jq('if length == 0 then "none" else map(.name) | join(", ") end') | first }}.
                      Not running after the restart:
                      {{ fromJson(outputs.result.values.r).gone | jq('if length == 0 then "none" else map(.name) | join(", ") end') | first }}.
                else:
                  - id: recovered
                    type: io.kestra.plugin.core.log.Log
                    message: >-
                      Restarted {{ fromJson(outputs.result.values.r).recovered | length }} containers on {{ inputs.docker_host }} back to healthy
                      ({{ fromJson(outputs.result.values.r).recovered | jq('if length == 0 then "none" else map("\(.name) \(.before) to \(.after)") | join(", ") end') | first }}).
                      Each one restarted, the start time moved:
                      {{ fromJson(outputs.result.values.r).recovered | jq('if length == 0 then "none" else map("\(.name) \(.started_before) to \(.started_after)") | join("; ") end') | first }}.
            else:
              - id: approval_declined
                type: io.kestra.plugin.core.log.Log
                message: "Approval not granted on execution {{ execution.id }}. Nothing was restarted on {{ inputs.docker_host }}."
        else:
          - id: report_only
            type: io.kestra.plugin.core.log.Log
            message: >-
              Report only, nothing restarted (auto_remediate={{ inputs.auto_remediate }}, dry_run={{ inputs.dry_run }}).
              Run with auto_remediate true and dry_run false, then approve the pause, to restart
              {{ fromJson(outputs.assess.values.targets) | jq('map(.name) | join(", ")') | first }}.
    else:
      - id: nothing_unhealthy
        type: io.kestra.plugin.core.log.Log
        message: >-
          No labelled running container on {{ inputs.docker_host }} reports unhealthy.
          {{ fromJson(outputs.assess.values.rows) | length }} read.
          {{ fromJson(outputs.assess.values.rows) | jq('group_by(.decision) | map("\(.[0].decision) \(length)") | join(", ")') | first }}.

errors:
  - id: alert_flow_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {{ {'text': 'Docker unhealthy container restart guard failed on ' ~ inputs.docker_host ~ ' (execution ' ~ execution.id ~ '). Either the daemon is unreachable or a restarted container is still unhealthy after the settle. Check the execution logs.'} | toJson }}

triggers:
  - id: nightly
    type: io.kestra.plugin.core.trigger.Schedule
    description: Shipped disabled and in safe mode. Enabling it only reports until you change these inputs.
    cron: "10 3 * * *"
    disabled: true
    inputs:
      dry_run: true
      auto_remediate: false

extend:
  title: Restart Docker Containers That Are Up but Failing Their Healthcheck
  shortDescription: Find running containers whose healthcheck reports unhealthy, scoped to a label and a protect-list, restart each one behind an approval, then wait a settle window and fail the run if any is still unhealthy.
  metaTitle: Restart Unhealthy Docker Containers with Kestra
  metaDescription: Find running Docker containers whose healthcheck reports unhealthy, restart them behind an approval, then re-check health and fail if any stays unhealthy.
  description: |
    A container with a HEALTHCHECK can be up and failing at the same time. After the configured
    number of consecutive failed checks the daemon marks it `unhealthy`, but the process never
    exited, so a restart policy never fires. Restart policies act on exit, not on health. The
    daemon keeps reporting the container as running. A load balancer may keep routing to it. It sits
    there serving errors. Nothing restarts it.

    This blueprint restarts it, inside a boundary you set. It reads the health status of every
    container carrying a label you apply yourself, keeps a protect-list, caps how many go in one
    run, then runs `docker restart` on each unhealthy one behind a dry run and an approval. It waits
    one settle window for the healthcheck to run again, inspects every target once more, then fails
    the run if any target is still unhealthy.

    This blueprint was created by [zkasuran](https://github.com/zkasuran).

    ## Safety

    Restarting a container interrupts what it is serving, so the flow is built so it cannot reach anything but its own target:

    - **Label scoping.** The Engine API query filters on `label_selector`, so a container without that label is never returned, let alone restarted. The label is one you apply to the containers you want this flow to manage.
    - **Has a healthcheck.** A container with no `HEALTHCHECK` has no health to act on, so it is read and kept, never a target.
    - **A protect-list.** `protected_name_pattern` wins over every other rule. A stateful service you do not want bounced mid-recovery stays untouched even when it is unhealthy.
    - **A ceiling.** `max_restarts` bounds one run, so a selector that matches more than you expected cannot bounce a whole host in one execution.
    - **One target, named by you.** Every read goes to `docker_host` over the Engine API and the restart goes to the same endpoint through `DOCKER_HOST`. The flow holds no socket path and no hostname of its own, so the daemon that runs Kestra is never a target.
    - **Three gates before any write.** `auto_remediate` true, `dry_run` false, then an approved `Pause`. The shipped defaults and the disabled schedule are read-only.
    - **A settle before judging.** A container reads as `starting` right after a restart, so the re-check waits `settle_seconds` for the healthcheck to run again before it decides pass or fail.

    ## How it works

    1. `list_labelled` (`io.kestra.plugin.core.http.Request`, read-only) asks the Docker Engine API for running containers matching `label_selector`. The Docker plugin has no container list task, so the inventory comes from the API. `candidates` keeps the ids and names.
    2. `inspect_each` (`io.kestra.plugin.core.flow.Loop`, read-only) inspects each candidate. `State.Health.Status`, `State.Health.FailingStreak` and the last healthcheck output are in the inspect payload only, not in the list.
    3. `assess` gives every candidate a verdict:
       - `KEEP_NO_HEALTHCHECK`: no `HEALTHCHECK`, so there is no health to act on;
       - `KEEP_PROTECTED`: its name matches `protected_name_pattern`;
       - `KEEP_HEALTHY`: the healthcheck reports healthy;
       - `KEEP_STARTING`: the healthcheck has not settled yet;
       - `KEEP_OVER_CAP`: unhealthy, but beyond `max_restarts` for this run;
       - `RESTART`: running, has a healthcheck, reports unhealthy, unprotected, inside the cap.

       `summary` logs the counts and every target with its failing streak.
    4. `route` stops with a log line when nothing is unhealthy. Otherwise `findings_alert` posts the plan to Slack and `remediate_gate` checks `auto_remediate` and `dry_run`.
    5. `hold` (`io.kestra.plugin.core.flow.Pause`) waits for approval. `remediate_restart` (`Loop`, `concurrencyLimit: 1`) then runs one `docker restart` per target through `io.kestra.plugin.scripts.shell.Commands` on the `docker:27-cli` image, pointed at `docker_host` by `DOCKER_HOST`.
    6. `settle` (`io.kestra.plugin.core.flow.Sleep`) waits `settle_seconds` so the healthcheck runs again. `reverify_each` inspects every target again by name. `result` sorts them into recovered, still unhealthy, still starting and gone. `verify` fails the run if any target did not come back to healthy.
    7. `errors` alerts Slack when the flow fails, including when the verification gate fails.

    ## What you get

    - A failing-but-up container caught from its health status, which a restart policy and a plain `docker ps` both miss.
    - A recovery that a human approves, with the before and after health status in the execution log as the evidence.
    - A run that fails when the restart did not fix the health, so a container still serving errors cannot read as recovered.

    ## Who it's for

    - Teams running services on plain Docker hosts or Docker Compose, where a healthcheck turns red but nothing acts on it.
    - Platform teams operating build hosts, edge nodes or self-hosted runners whose containers wedge without exiting.
    - Anyone who has found a container marked unhealthy for hours while traffic kept hitting it.

    ## Why orchestrate this with Kestra

    A cron job can run `docker restart` across a host, but it cannot read the health status first, cannot keep a protect-list, cannot stop at a ceiling, cannot wait for an approval and cannot check that the restart actually fixed the health. That last part is the point. The run is green only when the target is running again and reports healthy. Kestra reads the host, computes the plan, waits for a human, restarts one container at a time so a failure is attributable, waits out one healthcheck window, then reads the host again and fails the execution when a target is still unhealthy. The execution history is the record of which container was restarted on which host, who approved it and whether it recovered.

    ## Tested end to end

    On Kestra 2.0.5 OSS against an isolated Docker 27.5.1 daemon (Docker-in-Docker on its own network), with a local HTTP sink standing in for Slack. The daemon held five containers inside it: `recover` (labelled, healthcheck wired to a file the entrypoint recreates, made unhealthy by deleting the file so a restart fixes it), `wedged` (labelled, healthcheck `exit 1`, so it stays unhealthy after any restart), `healthy` (labelled, healthy, untouched), `nohealth` (labelled, no healthcheck) and `unlabelled` (unhealthy, no label). Every health status below was cross-checked with `docker inspect` against that daemon.

    | Run | Inputs | Result |
    |---|---|---|
    | 1 | only `healthy` and `nohealth` present, defaults | 2 read, 0 targets, `nothing_unhealthy`. Nothing restarted |
    | 2 | all five present, defaults | 4 labelled read, 2 targets (`recover`, `wedged`). `healthy` kept as `KEEP_HEALTHY`, `nohealth` as `KEEP_NO_HEALTHCHECK`, `unlabelled` never returned by the query. Nothing restarted |
    | 3 | run 2 plus `auto_remediate: true` | Same plan, nothing restarted. The dry run blocks the write even with auto_remediate on |
    | 4 | `auto_remediate: true`, `dry_run: false`, pause resumed `approved: false` | 2 targets, nothing restarted. `docker inspect` after: both still unhealthy, start time unchanged |
    | 5 | `auto_remediate: true`, `dry_run: false`, `protected_name_pattern` set to `wedged`, pause approved | 1 target (`recover`), restarted, healthy after the settle. `docker inspect`: `recover` unhealthy to healthy, start time moved. `wedged` kept by the protect-list, untouched |
    | 6 | `auto_remediate: true`, `dry_run: false`, target `wedged`, pause approved | `wedged` restarted, still unhealthy after the settle, so `verify` failed the run and `errors` posted to Slack. `docker inspect`: start time moved, health still unhealthy |
    | 7 | unreachable daemon | `errors` alert sent |

    ## Prerequisites

    - A Docker daemon reachable over TCP from the Kestra worker. The container list comes from the Engine API, which the worker cannot read through a mounted unix socket.
    - A `HEALTHCHECK` on the containers you want managed, so the daemon has a health status to report. A container with no healthcheck is read and kept, never restarted.
    - A label on those containers. Add `--label kestra.health=managed` to your `docker run` or to the service in your Compose file, then point `label_selector` at it.
    - The one-off `docker:27-cli` container must be able to reach `docker_host`. Leave `docker_cli_network` as `bridge` for a daemon that resolves by DNS. Point it at the user-defined network when the daemon is itself a container.
    - Local testing: `docker run -d --privileged --name dind -e DOCKER_TLS_CERTDIR= docker:27-dind --host=tcp://0.0.0.0:2375`, start a labelled container inside it with a healthcheck wired to fail, then set `docker_host` to `tcp://dind:2375`.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: used by `findings_alert` and the `errors` block. In Kestra OSS, provide it as the base64-encoded environment variable `SECRET_SLACK_WEBHOOK_URL`.

    ### Inputs

    | Input | Default | Purpose |
    |---|---|---|
    | `docker_host` | `tcp://docker-host:2375` | Daemon to watch |
    | `docker_cli_network` | `bridge` | Network the docker CLI container joins |
    | `label_selector` | `kestra.health=managed` | The only containers read |
    | `protected_name_pattern` | `^(db\|database\|state\|broker\|queue\|cache)([-_.].*)?$` | Names never restarted |
    | `restart_stop_timeout_seconds` | `10` | Grace before kill on restart |
    | `settle_seconds` | `45` | Wait before judging health again |
    | `max_restarts` | `25` | Ceiling for one run |
    | `auto_remediate` | `false` | Must be true to restart anything |
    | `dry_run` | `true` | Must be false to restart anything |

    ## Quick start

    1. Add the `SLACK_WEBHOOK_URL` secret.
    2. Label the containers you want managed, for example `docker run --health-cmd ... --label kestra.health=managed ...`.
    3. Import the flow, set `docker_host` and `label_selector`, run it with the defaults and read the plan.
    4. Set `settle_seconds` above your healthcheck interval, so the re-check does not judge a container that is still starting.
    5. Run it with `auto_remediate: true` and `dry_run: false`, read the plan in the paused execution, then resume it with `approved: true`.
    6. Enable the `nightly` trigger once the plans look right. Change its inputs when you want it to act.

    ## How to extend

    - Trigger the flow from a webhook your monitoring fires on an unhealthy event, so the restart happens in seconds rather than on a schedule.
    - Keep a restart count per container in a KV store, so a container restarted every run is escalated to a human instead of bounced forever.
    - Replace the restart with a stop plus an alert for containers that have been restarted too many times, since a repeat offender is a bug no restart fixes.
    - Loop over a list of hosts to watch a whole fleet in one execution.
    - Read the last healthcheck output into the Slack alert, so the message carries why the container is unhealthy.

