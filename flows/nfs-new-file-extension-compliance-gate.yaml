id: nfs-new-file-extension-compliance-gate
namespace: company.team

description: |
  Fire in real time whenever new files land on a watched NFS directory, classify how many don't
  match an approved extension pattern, quarantine the non-compliant ones only when explicitly
  authorized, alert Slack otherwise, and log a governance audit trail either way.

inputs:
  - id: allowed_extensions_regex
    type: STRING
    displayName: Allowed extensions pattern
    description: Regular expression a filename must fully match to be considered compliant.
    defaults: ".*\\.(csv|json|parquet)$"

  - id: quarantine_directory
    type: STRING
    displayName: Quarantine directory
    description: NFS directory non-compliant files are moved into when confirm_quarantine is true.
    defaults: "/mnt/nfs/quarantine"

  - id: confirm_quarantine
    type: BOOL
    displayName: Confirm automatic quarantine
    description: When true, this flow is authorized to move every non-compliant file into quarantine_directory itself. When false, a non-compliant arrival only alerts Slack so a human reviews it.
    defaults: false

tasks:
  - id: evaluate
    type: io.kestra.plugin.core.output.OutputValues
    description: The trigger already delivers each new file's name and metadata, so this classifies the batch directly from trigger.files rather than re-probing NFS, counting and listing the files whose name does not match allowed_extensions_regex.
    values:
      noncompliant_count: >-
        {{ ({'files': trigger.files, 'pattern': inputs.allowed_extensions_regex} | jq('.pattern as $p | [.files[] | select((.name | test($p)) | not)] | length')) | first | number }}
      noncompliant_names: >-
        {{ ({'files': trigger.files, 'pattern': inputs.allowed_extensions_regex} | jq('.pattern as $p | [.files[] | select((.name | test($p)) | not) | .name] | join("; ")')) | first }}
      severity: >-
        {{ ((({'files': trigger.files, 'pattern': inputs.allowed_extensions_regex} | jq('.pattern as $p | [.files[] | select((.name | test($p)) | not)] | length')) | first | number) == 0) ? 'ALL_COMPLIANT' : (inputs.confirm_quarantine ? 'NONCOMPLIANT_AUTO_QUARANTINE' : 'NONCOMPLIANT_NEEDS_HUMAN') }}

  - id: route
    type: io.kestra.plugin.core.flow.Switch
    description: ALL_COMPLIANT just logs. NONCOMPLIANT_AUTO_QUARANTINE performs the safe remediation (moving a file within the same NFS mount, nothing is deleted) only when confirm_quarantine authorizes it. NONCOMPLIANT_NEEDS_HUMAN alerts Slack instead.
    value: "{{ outputs.evaluate.values.severity }}"
    cases:
      "ALL_COMPLIANT":
        - id: log_all_compliant
          type: io.kestra.plugin.core.log.Log
          message: "{{ trigger.files | length }} new file(s) arrived, all matching {{ inputs.allowed_extensions_regex }}."
      "NONCOMPLIANT_AUTO_QUARANTINE":
        - id: quarantine_noncompliant_files
          type: io.kestra.plugin.core.flow.Loop
          description: Iterates every file this fire delivered and quarantines only the ones that do not match allowed_extensions_regex, now that confirm_quarantine explicitly authorizes this flow to act.
          values: "{{ trigger.files }}"
          tasks:
            - id: quarantine_if_noncompliant
              type: io.kestra.plugin.core.flow.If
              condition: >-
                {{ ((({'name': fromJson(item.value).name, 'pattern': inputs.allowed_extensions_regex} | jq('.pattern as $p | ([.name] | map(select(test($p)))) | length')) | first | number)) == 0 }}
              then:
                - id: move_to_quarantine
                  type: io.kestra.plugin.fs.nfs.Move
                  from: "{{ fromJson(item.value).uri }}"
                  to: "{{ inputs.quarantine_directory }}/{{ fromJson(item.value).name }}"
        - id: alert_auto_quarantined
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {{ {'text': 'NONCOMPLIANT_AUTO_QUARANTINE: ' ~ outputs.evaluate.values.noncompliant_count ~ ' of ' ~ (trigger.files | length) ~ ' new file(s) did not match ' ~ inputs.allowed_extensions_regex ~ ': ' ~ outputs.evaluate.values.noncompliant_names ~ '. Moved them into ' ~ inputs.quarantine_directory ~ ' automatically.'} | toJson }}
      "NONCOMPLIANT_NEEDS_HUMAN":
        - id: alert_noncompliant
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {{ {'text': 'NONCOMPLIANT_NEEDS_HUMAN: ' ~ outputs.evaluate.values.noncompliant_count ~ ' of ' ~ (trigger.files | length) ~ ' new file(s) did not match ' ~ inputs.allowed_extensions_regex ~ ': ' ~ outputs.evaluate.values.noncompliant_names ~ '. Set confirm_quarantine to true to let this flow quarantine them automatically, or review them manually now.'} | toJson }}

  - id: summary
    type: io.kestra.plugin.core.log.Log
    message: "NFS new file extension compliance gate complete: {{ outputs.evaluate.values.noncompliant_count }} of {{ trigger.files | length }} new file(s) non-compliant, severity {{ outputs.evaluate.values.severity }}."

errors:
  - id: alert_flow_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {{ {'text': 'NFS new file extension compliance gate failed (execution ' ~ execution.id ~ '). Check the logs.'} | toJson }}

triggers:
  - id: watch_directory
    type: io.kestra.plugin.fs.nfs.Trigger
    description: Polls the watched directory and fires once per polling cycle that finds new or updated files, deduplicated via trigger state. Shipped disabled with a placeholder path; point from at a real NFS-mounted directory before enabling.
    disabled: true
    from: "/mnt/nfs/shared/incoming"
    interval: PT30S
    on: CREATE
    recursive: false
    maxFiles: 25

extend:
  title: NFS New File Extension Compliance Gate
  metaTitle: NFS New File Extension Compliance Gate with Kestra
  shortDescription: Fire on new NFS file arrivals, alert Slack or auto-quarantine files that don't match an approved extension pattern, and log a governance audit trail.
  metaDescription: Fire on new NFS file arrivals, alert Slack or auto-quarantine non-compliant files, and log the result for data platform teams.
  description: |
    A shared NFS drop directory that many systems can write to eventually gets something that
    does not belong: an executable where only CSVs were expected, a stray temp file, a wrong
    export format from a misconfigured upstream job. Nothing about NFS itself enforces what kind
    of file a directory is supposed to receive; by the time a downstream job trips over it, the
    file could have been sitting there for hours. This blueprint watches a directory in real
    time, checks every new arrival against an approved extension pattern, and can quarantine the
    ones that fail once you have explicitly said this flow is allowed to.

    This blueprint was created by [Mohit Jeswani](https://github.com/mohitjeswani01).

    ## How it works

    1. `watch_directory` (`io.kestra.plugin.fs.nfs.Trigger`) polls the watched directory and
       fires with every newly created file's name, URI, and metadata in `trigger.files`.
    2. `evaluate` (`io.kestra.plugin.core.output.OutputValues`) counts and lists the files whose
       name does not match `allowed_extensions_regex` with a `jq` filter, and classifies the
       fire as `ALL_COMPLIANT`, `NONCOMPLIANT_AUTO_QUARANTINE`, or
       `NONCOMPLIANT_NEEDS_HUMAN`, folding `confirm_quarantine` into the non-compliant
       classification itself.
    3. `route` (`io.kestra.plugin.core.flow.Switch`):
       - **ALL_COMPLIANT:** logs that every new file matched the pattern.
       - **NONCOMPLIANT_AUTO_QUARANTINE:** `ForEach`s every file this fire delivered, moves only
         the non-compliant ones into `quarantine_directory` with
         `io.kestra.plugin.fs.nfs.Move` (the safe remediation, since moving a file within the
         same NFS mount deletes nothing), then posts a Slack notice.
       - **NONCOMPLIANT_NEEDS_HUMAN:** posts a Slack alert instead of quarantining.
    4. `summary` logs the non-compliant count and severity, closing the governance cycle.
    5. `errors` alerts Slack if the flow itself fails, for example an unmounted NFS path.

    ## What you get

    - A file-type policy enforced the moment a file lands, not discovered when a downstream job
      chokes on it hours later.
    - A quarantine move that only ever relocates a file within the same NFS mount, deletes
      nothing, and only runs once you have explicitly set `confirm_quarantine` to allow it.
    - A Slack alert naming the exact non-compliant filenames, so whoever owns the directory can
      trace them back to the source system that wrote them.

    ## Who it's for

    - Data platform and integration teams who run a shared NFS drop directory fed by multiple
      upstream systems and need a file-type policy enforced automatically.
    - Teams evaluating the fs plugin's NFS support who want a worked example of `nfs.Trigger`
      and `nfs.Move` used together as an event-driven compliance gate, distinct from this repo's
      existing NFS blueprint, which runs a nightly scheduled sweep deleting stale scratch files
      by age rather than reacting to a new arrival's file type in real time.

    ## Why orchestrate this with Kestra

    NFS has no concept of an allowed file-type policy and no way to react the moment a
    non-compliant file lands. Kestra keeps `allowed_extensions_regex`, `quarantine_directory`,
    and `confirm_quarantine` as flow inputs, turns a trigger's file batch into a policy
    decision, and keeps a full execution history of every arrival this flow has seen and what it
    did about it.

    ## Prerequisites

    - An NFS share mounted on the Kestra worker, with a directory new files can be written into
      to test both the compliant and non-compliant paths.
    - A Slack incoming webhook URL.

    A local NFS server can be run via an open-source Docker image such as `itsthenetwork/nfs-server-alpine`,
    mounted into the Kestra worker container, for a fully local end-to-end test, no managed
    service required.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: used by both Slack alert cases and the `errors` block. In Kestra OSS,
      provide it as the base64-encoded environment variable `SECRET_SLACK_WEBHOOK_URL`.

    ### Inputs

    | Input | Default | Purpose |
    |---|---|---|
    | `allowed_extensions_regex` | `.*\\.(csv\|json\|parquet)$` | Pattern a filename must fully match to be compliant |
    | `quarantine_directory` | `/mnt/nfs/quarantine` | Where non-compliant files are moved when authorized |
    | `confirm_quarantine` | `false` | Authorizes this flow to quarantine non-compliant files itself |

    The watched directory is set directly on the `watch_directory` trigger's `from`, not as a
    flow input; see Pitfalls.

    ### Outputs

    - `{{ trigger.files }}`: every new or updated file this fire detected (`name`, `uri`, `size`,
      `isDirectory`, `isHidden`, `creationTime`, `lastModifiedTime`, `changeType`), as
      `nfs.Trigger` reports them.
    - `{{ outputs.evaluate.values.noncompliant_count }}` / `.noncompliant_names`: how many files
      failed the pattern and their names, semicolon-joined.
    - `{{ outputs.evaluate.values.severity }}`: `ALL_COMPLIANT`, `NONCOMPLIANT_AUTO_QUARANTINE`,
      or `NONCOMPLIANT_NEEDS_HUMAN`.

    ### Pitfalls

    - `from`, `interval`, `on`, `recursive`, and `maxFiles` are trigger-level configuration, not
      flow inputs; a polling trigger has no per-execution input overrides the way a `Schedule`
      trigger does, so watching a different directory means editing the trigger block directly.
    - `nfs.Trigger` caps a single fire at `maxFiles` (default 25); a directory that receives a
      larger burst than that in one poll interval has the excess files picked up on the next
      poll instead, not dropped.
    - `nfs.Move`'s destination directory is created automatically if it does not exist, and an
      existing file at the destination path is overwritten; two different source files sharing a
      filename quarantined in the same run will collide, with the second overwriting the first.

    ## Quick start

    1. Add the `SLACK_WEBHOOK_URL` secret.
    2. Run a local NFS server via Docker, mount it into the worker, and point
       `watch_directory`'s `from` at a real incoming directory.
    3. Enable the trigger, write a compliant file (e.g. `report.csv`), and confirm
       `log_all_compliant` fires.
    4. Write a non-compliant file (e.g. `malware.exe`) with `confirm_quarantine: false`; confirm
       `alert_noncompliant` fires.
    5. Set `confirm_quarantine: true`, write another non-compliant file, and confirm
       `move_to_quarantine` relocates it and `alert_auto_quarantined` fires.

    ## How to extend

    - Add a file-size ceiling alongside the extension check, quarantining oversized files even
      when their extension is otherwise approved.
    - Chain a checksum or antivirus scan on each non-compliant file before quarantining it, to
      distinguish a wrong-format mistake from something actively malicious.
    - Watch several directories by deploying one copy of this flow per `watch_directory` trigger
      configuration, one per drop zone your team owns.

    ## Links

    - fs plugin (NFS tasks): https://kestra.io/plugins/plugin-fs
    - NFS server Docker image: https://hub.docker.com/r/itsthenetwork/nfs-server-alpine
    - Slack incoming webhooks: https://api.slack.com/messaging/webhooks
  tags:
    - Data
  subTags:
    - File & Data Processing Basics
    - Monitoring & Alerting
  ee: false
  demo: false
