id: render-deploy-failure-sentinel
namespace: company.team
description: |
  Every hour, read the recent deploys of one Render service (read-only:
  nothing is deployed, rolled back, suspended or restarted) and classify
  deploy health as HEALTHY, WARNING, CRITICAL, LOW_VOLUME or UNREACHABLE.
  Log quiet runs and alert Slack when the latest deploy failed to go live,
  when deploys keep failing, or when one has been in progress for too long.

inputs:
  - id: service_id
    type: STRING
    defaults: "srv-your-service-id"
    displayName: "Render Service ID"
    description: "The service ID (srv-...) shown in the service URL and its Settings page."
  - id: lookback_hours
    type: INT
    defaults: 24
    displayName: "Lookback Window (hours)"
    description: "Judge deploys created in the last this many hours (sent to Render as createdAfter)."
  - id: warning_failure_rate
    type: FLOAT
    defaults: 20.0
    displayName: "Warning Failure Rate (%)"
    description: "At or above this share of failed deploys among finished ones in the window, the check is WARNING."
  - id: stuck_minutes
    type: INT
    defaults: 30
    displayName: "Stuck Deploy Threshold (minutes)"
    description: "A deploy still queued, building, running its pre-deploy command or updating after this many minutes counts as stuck and makes the check WARNING."

triggers:
  - id: hourly_check
    type: io.kestra.plugin.core.trigger.Schedule
    description: Check deploys every hour. Shipped disabled; enable it once the Render API key secret and the service ID are set and a manual run has been verified.
    cron: "45 * * * *"
    disabled: true

tasks:
  - id: list_deploys
    type: io.kestra.plugin.core.http.Request
    description: Read up to 100 deploys of the service created since the start of the lookback window from the Render API. This is a GET; nothing is deployed, rolled back, suspended or restarted.
    uri: "https://api.render.com/v1/services/{{ inputs.service_id }}/deploys?limit=100&createdAfter={{ now() | dateAdd(-inputs.lookback_hours, 'HOURS') | date(\"yyyy-MM-dd'T'HH:mm:ss'Z'\", timeZone='UTC') }}"
    method: GET
    headers:
      Accept: application/json
      Authorization: "Bearer {{ secret('RENDER_API_KEY') }}"
    options:
      allowFailed: true
      timeout:
        connectTimeout: PT10S
        readIdleTimeout: PT30S
    retry:
      type: constant
      interval: PT10S
      maxAttempts: 3
    allowFailure: true

  - id: summarize_deploys
    type: io.kestra.plugin.core.debug.Return
    description: Compute the share of failed deploys among finished ones, find the latest finished deploy and the trigger and commit behind it, count deploys in progress past the threshold, and classify in one jq query. A missing or non-200 response becomes UNREACHABLE.
    format: >-
      {{ (outputs.list_deploys.code is not defined or outputs.list_deploys.code != 200)
      ? '{"status":"UNREACHABLE","finished":0,"live":0,"failed":0,"rate":0,"in_flight":0,"stuck":0,"latest":"none","latest_commit":"none","top_failure":"none"}'
      : (fromJson(outputs.list_deploys.body) | jq('
      "' ~ (now() | dateAdd(-inputs.stuck_minutes, 'MINUTES') | date("yyyy-MM-dd'T'HH:mm:ss", timeZone="UTC")) ~ '" as $stuck_before
      | [.[] | .deploy // empty] as $d
      | [$d[] | select((.status == "build_failed" or .status == "update_failed" or .status == "pre_deploy_failed") or (.status == "live" or .status == "deactivated"))] as $f
      | [$f[] | select(.status == "build_failed" or .status == "update_failed" or .status == "pre_deploy_failed")] as $bad
      | [$d[] | select(.status == "created" or .status == "queued" or .status == "build_in_progress" or .status == "update_in_progress" or .status == "pre_deploy_in_progress")] as $open
      | [$open[] | select((.createdAt // "") < $stuck_before)] as $stuck
      | ($f | sort_by(.createdAt) | last) as $latest
      | ($f | length) as $n
      | (if $n == 0 then 0 else ((($bad | length) * 1000 / $n) | floor) / 10 end) as $r
      | {finished: $n, live: ($n - ($bad | length)), failed: ($bad | length), rate: $r,
      in_flight: ($open | length), stuck: ($stuck | length),
      latest: (if $latest == null then "none" else ($latest.status + " via " + (($latest.trigger // "unknown") | tostring) + " at " + (($latest.finishedAt // $latest.createdAt // "?") | tostring)) end),
      latest_commit: (if $latest == null or $latest.commit == null then "none" else ((($latest.commit.id // "") | tostring | .[0:7]) + " " + (($latest.commit.message // "") | tostring | split("\"") | join("") | split("\n") | (.[0] // "") | .[0:80])) end),
      top_failure: (if ($bad | length) == 0 then "none" else ([$bad[] | .status] | group_by(.) | map({s: .[0], c: length}) | max_by(.c) | (.s + " (x" + (.c | tostring) + ")")) end),
      status: (if $latest != null and ($latest | (.status == "build_failed" or .status == "update_failed" or .status == "pre_deploy_failed")) then "CRITICAL"
      elif ($n > 0 and $r >= ' ~ inputs.warning_failure_rate ~ ') or ($stuck | length) > 0 then "WARNING"
      elif $n == 0 then "LOW_VOLUME"
      else "HEALTHY" end)}
      ') | first | toJson) }}

  - id: route_by_deploys
    type: io.kestra.plugin.core.flow.Switch
    description: Route to a quiet log when deploys are healthy or there were none in the window, a Slack message when failures cross the warning line or a deploy is stuck, or a Slack page when the latest deploy failed or Render could not be read.
    value: "{{ fromJson(outputs.summarize_deploys.value).status }}"
    cases:
      "HEALTHY":
        - id: log_healthy
          type: io.kestra.plugin.core.log.Log
          description: Log a quiet line when the check is healthy; no Slack message is sent.
          message: "Render deploys healthy for {{ inputs.service_id }}: {{ fromJson(outputs.summarize_deploys.value).failed }} of {{ fromJson(outputs.summarize_deploys.value).finished }} finished deploys failed in the last {{ inputs.lookback_hours }} hour(s); latest is {{ fromJson(outputs.summarize_deploys.value).latest }}."
      "LOW_VOLUME":
        - id: log_low_volume
          type: io.kestra.plugin.core.log.Log
          description: Log a quiet line when no deploy finished in the window; no Slack message is sent.
          message: "Render deploys for {{ inputs.service_id }}: no deploy finished in the last {{ inputs.lookback_hours }} hour(s)."
      "WARNING":
        - id: alert_warning_deploys
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: Post a Slack message when the deploy failure rate is at or above the warning line or a deploy is stuck.
          url: "{{ secret('SLACK_WEBHOOK') }}"
          payload: |
            {
              "text": "Render deploys WARNING for {{ inputs.service_id }}: {{ fromJson(outputs.summarize_deploys.value).failed }} of {{ fromJson(outputs.summarize_deploys.value).finished }} finished deploys failed ({{ fromJson(outputs.summarize_deploys.value).rate }}%) in the last {{ inputs.lookback_hours }} hour(s), most often {{ fromJson(outputs.summarize_deploys.value).top_failure }}; {{ fromJson(outputs.summarize_deploys.value).stuck }} deploy(s) in progress for more than {{ inputs.stuck_minutes }} minutes. Execution {{ execution.id }}."
            }
      "CRITICAL":
        - id: alert_critical_latest
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: Page Slack when the latest finished deploy failed, because the service is still running the previous version and the change never went live.
          url: "{{ secret('SLACK_WEBHOOK') }}"
          payload: |
            {
              "text": "Render deploy FAILED for {{ inputs.service_id }}: latest deploy is {{ fromJson(outputs.summarize_deploys.value).latest }} (commit {{ fromJson(outputs.summarize_deploys.value).latest_commit }}). The service is still on the previous deploy; open the deploy logs in Render. Execution {{ execution.id }}."
            }
      "UNREACHABLE":
        - id: alert_unreachable_api
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: Page Slack when the deploy list could not be read, indicating an outage, a wrong service ID or an invalid API key.
          url: "{{ secret('SLACK_WEBHOOK') }}"
          payload: |
            {
              "text": "Render deploy sentinel UNREACHABLE for {{ inputs.service_id }}: the deploy list did not return a usable response (HTTP {{ outputs.list_deploys.code ?? 'no response' }}). Check the service ID and the API key. Execution {{ execution.id }}."
            }
    defaults:
      - id: log_unclassified
        type: io.kestra.plugin.core.log.Log
        description: Fallback for any classification the cases above do not cover, so an unexpected value is visible in the logs.
        message: "Render deploy sentinel completed with an unexpected classification: {{ outputs.summarize_deploys.value }}."

  - id: log_audit_result
    type: io.kestra.plugin.core.log.Log
    description: Record one audit line for every run, whichever branch fired, so the deploy history stays queryable even if Slack delivery fails.
    message: "Render deploy sentinel audit: service={{ inputs.service_id }} lookback_hours={{ inputs.lookback_hours }} http={{ outputs.list_deploys.code ?? 'n/a' }} summary={{ outputs.summarize_deploys.value }} execution={{ execution.id }}."

errors:
  - id: alert_flow_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alert Slack when the sentinel flow itself fails, so a broken check is never mistaken for healthy deploys.
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "text": "Render deploy sentinel flow {{ flow.id }} FAILED (execution {{ execution.id }}). Deploy health is now unknown; check the task logs and the service's Events page in Render."
      }

outputs:
  - id: status
    type: STRING
    value: "{{ fromJson(outputs.summarize_deploys.value).status }}"

extend:
  title: "Render Deploy Failure Sentinel"
  shortDescription: Read a Render service's recent deploys every hour and alert Slack when the latest deploy failed to go live, deploys keep failing or one is stuck.
  metaTitle: Render Deploy Failure Sentinel for Kestra
  metaDescription: "Read a Render service's deploys every hour, change nothing, and alert Slack when the latest deploy failed, failures pile up or a deploy is stuck."
  description: |
    On Render, a failed deploy does not take the service down: the previous version keeps serving traffic, the push to `main` looks done, and the failure only shows up as `build_failed`, `pre_deploy_failed` or `update_failed` on the service's Events page. The migration, the hotfix or the new endpoint the team is waiting for is simply not live. Auto-deploys that fail on every push, or a deploy that hangs on its pre-deploy command, are just as easy to miss. This blueprint turns a scheduled, read-only call to the Render API into a deploy health gate: `io.kestra.plugin.core.http.Request` reads the service's recent deploys, one jq query finds the latest result, the failure rate and deploys that are stuck, and the result routes to a quiet log or a Slack alert.

    ## How it works

    1. `list_deploys` (`io.kestra.plugin.core.http.Request`) calls `GET /v1/services/{serviceId}/deploys?limit=100&createdAfter=...` with a bearer API key, which returns deploys created in the lookback window, each wrapped as `{deploy, cursor}`. It is a read: nothing is deployed, rolled back, suspended or restarted. Retries cover short network blips, and `allowFailed` plus `allowFailure` keep an API error from aborting the flow so it can be reported instead.
    2. `summarize_deploys` (`io.kestra.plugin.core.debug.Return`) first guards for a missing or non-200 response (`UNREACHABLE`). Otherwise one jq query treats `live` and `deactivated` (a deploy that went live and was later replaced) as successful, `build_failed`, `update_failed` and `pre_deploy_failed` as failed, and `created`, `queued`, `build_in_progress`, `pre_deploy_in_progress` and `update_in_progress` as in flight, flagging the ones older than `stuck_minutes`. `canceled` deploys are ignored. If the latest finished deploy failed, the check is `CRITICAL`; a failure rate at or above `warning_failure_rate`, or any stuck deploy, is `WARNING`; no finished deploy in the window is `LOW_VOLUME`; otherwise `HEALTHY`.
    3. `route_by_deploys` (`io.kestra.plugin.core.flow.Switch`) branches on that classification: `HEALTHY` and `LOW_VOLUME` log quietly, `WARNING` posts a Slack note, `CRITICAL` and `UNREACHABLE` page Slack. A `defaults` fallback logs anything unexpected.
    4. `log_audit_result` (`io.kestra.plugin.core.log.Log`) writes one audit line per run with the HTTP status and the full summary.
    5. The flow-level `errors` block pages Slack if the flow itself fails, and the `hourly_check` trigger runs at 45 minutes past every hour, shipped `disabled: true`.

    ## What you get

    - An hourly, read-only check of a Render service's deploys with no custom scripting and no extra plugin to install.
    - A `status` output (`HEALTHY` / `WARNING` / `CRITICAL` / `LOW_VOLUME` / `UNREACHABLE`) other flows can gate on, for example to hold a dependent release until the API really deployed.
    - Slack messages with the failed status, the trigger (`new_commit`, `manual`, `deploy_hook`, ...), the commit and the number of stuck deploys.
    - An audit line on every run, separate from Slack.

    ## Who it's for

    - Teams running web services, workers and cron jobs on Render with auto-deploy from Git.
    - Platform engineers who own several Render services, one execution per service ID.
    - Teams that already run their release and alerting workflows in Kestra.

    ## Why orchestrate this with Kestra

    Render can notify on deploy events, but it does not tell you that the latest deploy is still failed an hour later, that half of today's pushes failed, or that a deploy has been running its pre-deploy command for 30 minutes. Kestra turns a plain, read-only API call into a scheduled, typed classification with retries, a failure path and an execution history, and the same flow runs against any number of services by changing `service_id`.

    ## Prerequisites

    - A Render service and an API key from Account Settings > API Keys (the key acts with the permissions of its user).
    - The service ID (`srv-...`) from the service URL or its Settings page.
    - A Slack incoming webhook for the WARNING, CRITICAL, UNREACHABLE and flow-failure alerts.

    ### Secrets

    - `RENDER_API_KEY`: a Render API key for a user with access to the service.
    - `SLACK_WEBHOOK`: Slack incoming webhook used for every alert branch and the flow-failure alert.

    In Kestra OSS, secrets are supplied as environment variables prefixed `SECRET_` and base64-encoded, for example `SECRET_RENDER_API_KEY=$(echo -n 'your-render-api-key' | base64)`, and read back with `{{ secret('RENDER_API_KEY') }}`. Use the Enterprise secrets backend for encryption at rest and access control.

    ## Quick start

    1. Add `RENDER_API_KEY` and `SLACK_WEBHOOK` as secrets.
    2. Set `service_id` and run the flow manually; compare the counts and the latest deploy in the logs with the service's Events page.
    3. Push a commit that fails the build to a branch the service auto-deploys from (or a staging service) to see a failure counted, then revert it.
    4. Enable `hourly_check`.

    ## How to extend

    - Loop over several services with `io.kestra.plugin.core.flow.ForEach` and one `service_id` per item.
    - Add the `status` query parameter to read only failed deploys over a longer window.
    - Store the ID of the last failed deploy in a KV store and alert only on new failures.
    - Trigger a redeploy or a rollback through the Render API from a separate, approved flow when the latest deploy failed.

    ## Inputs

    - `service_id`: type STRING, default `srv-your-service-id`.
    - `lookback_hours`: type INT, default `24`.
    - `warning_failure_rate`: type FLOAT, default `20.0` (percent).
    - `stuck_minutes`: type INT, default `30`.

    ## Outputs

    - `status`: one of `HEALTHY`, `WARNING`, `CRITICAL`, `LOW_VOLUME`, `UNREACHABLE`.
    - Example path: `{{ fromJson(outputs.summarize_deploys.value).latest }}` for the latest finished deploy.

    ## Links

    - [Render API: list deploys](https://api-docs.render.com/reference/list-deploys)
    - [Render deploys](https://render.com/docs/deploys)
    - [Kestra HTTP Request task](https://kestra.io/plugins/core/tasks/http/io.kestra.plugin.core.http.request)
    - [Kestra Slack plugin](https://kestra.io/plugins/plugin-slack)

    ## Pitfalls

    - The latest result is judged inside the lookback window only; a service with no finished deploy in the window reports `LOW_VOLUME` even if an older deploy failed.
    - At most 100 deploys are read; follow `cursor` for more.
    - A service whose deploys are all canceled (for example because a newer push superseded them) is `LOW_VOLUME`, since canceled deploys are not judged.
    - This flow only reads; it never triggers a deploy, rolls back, suspends or restarts the service.
  tags:
    - Infrastructure
  subTags:
    - Monitoring & Alerting
  ee: false
  demo: false
