    - [plugin-kestra source (executions/Count.java)](https://github.com/kestra-io/plugin-kestra/blob/main/src/main/java/io/kestra/plugin/kestra/executions/Count.java)
    - [Kestra secrets (OSS vs Enterprise)](https://kestra.io/docs/concepts/secret)
  tags:
    - Infrastructure
    - Core
  subTags:
    - Monitoring & Alerting
    - Policy & Compliance
  ee: false
  demo: false
