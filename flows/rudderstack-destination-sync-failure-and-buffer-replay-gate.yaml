id: rudderstack-destination-sync-failure-and-buffer-replay-gate
namespace: company.customer-data

concurrency:
  limit: 1

inputs:
  - id: rudderstack_api_url
    type: STRING
    defaults: "https://api.rudderstack.com"
    displayName: "RudderStack API Base URL"
    description: "Base URL for the RudderStack Control Plane or self-hosted Data Plane gateway API."

  - id: destination_id
    type: STRING
    defaults: "dest_snowflake_customer_360"
    displayName: "Destination Identifier"
    description: "Unique identifier of the RudderStack event destination experiencing delivery lag or sync stalls."

  - id: destination_name
    type: STRING
    defaults: "Snowflake Production Customer 360"
    displayName: "Destination Display Name"
    description: "Human-readable name of the downstream destination pipeline for observability logs and alerting."

  - id: max_acceptable_error_rate_pct
    type: FLOAT
    defaults: 5.0
    displayName: "Max Acceptable Error Rate (%)"
    description: "Maximum allowable event delivery failure rate before triggering operational backoff and remediation."

  - id: max_consecutive_failures
    type: INT
    defaults: 3
    displayName: "Max Consecutive Batch Failures"
    description: "Number of consecutive batch upload rejections that trip the circuit breaker and require intervention."

  - id: max_dead_letter_events
    type: INT
    defaults: 1000
    displayName: "Dead-Letter Buffer Backlog Ceiling"
    description: "Maximum number of quarantined failed events permitted in the retry buffer before halting downstream activation."

  - id: verification_max_remaining_buffer
    type: INT
    defaults: 50
    displayName: "Verification Max Remaining Buffer"
    description: "Upper bound of unprocessed events in the dead-letter buffer required to certify post-remediation recovery."

tasks:
  - id: ingest_destination_telemetry
    type: io.kestra.plugin.core.http.Request
    description: "Polls the RudderStack Management API to fetch live event delivery metrics, sync status, and dead-letter buffer queue depth."
    uri: "{{ inputs.rudderstack_api_url }}/v1/destinations/{{ inputs.destination_id }}/metrics"
    method: GET
    headers:
      Authorization: "Bearer {{ secret('RUDDERSTACK_ACCESS_TOKEN') }}"
      Accept: "application/json"
    timeout: PT30S

  - id: analyze_destination_health
    type: io.kestra.plugin.scripts.python.Script
    description: "Evaluates destination telemetry in-memory, detects rate-limiting or schema poison pills, and determines remediation necessity."
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    script: |
      import json
      import sys
      from kestra import Kestra

      raw_payload = """{{ outputs.ingest_destination_telemetry.body }}"""

      try:
          data = json.loads(raw_payload) if raw_payload.strip() else {}
      except Exception as err:
          sys.stderr.write(f"FATAL: Malformed JSON received from RudderStack API: {err}\n")
          sys.exit(1)

      if not data:
          sys.stderr.write("FATAL: RudderStack metrics payload is empty or unreachable.\n")
          sys.exit(1)

      destination_id = data.get("destination_id", "{{ inputs.destination_id }}")
      sync_status = str(data.get("sync_state", "UNKNOWN")).upper()
      error_rate_pct = float(data.get("error_rate_pct", 0.0))
      consecutive_failures = int(data.get("consecutive_failures", 0))
      dead_letter_count = int(data.get("dead_letter_buffer_count", 0))
      last_error_code = data.get("downstream_http_status", 200)

      max_err_rate = float("{{ inputs.max_acceptable_error_rate_pct }}")
      max_consec = int("{{ inputs.max_consecutive_failures }}")
      max_dlq = int("{{ inputs.max_dead_letter_events }}")

      requires_remediation = False
      failure_reasons = []

      if error_rate_pct > max_err_rate:
          requires_remediation = True
          failure_reasons.append(f"Error rate {error_rate_pct:.2f}% exceeds threshold {max_err_rate:.2f}%")

      if consecutive_failures >= max_consec:
          requires_remediation = True
          failure_reasons.append(f"Consecutive batch failures ({consecutive_failures}) exceed limit ({max_consec})")

      if dead_letter_count > max_dlq:
          requires_remediation = True
          failure_reasons.append(f"Dead-letter buffer depth ({dead_letter_count} events) exceeds capacity ({max_dlq})")

      if sync_status in ["STALLED", "FAILED", "CIRCUIT_BROKEN"]:
          requires_remediation = True
          failure_reasons.append(f"Destination sync state is in critical status '{sync_status}'")

      incident_type = "NOMINAL"
      if requires_remediation:
          if last_error_code == 429:
              incident_type = "RATE_LIMIT_BACKOFF_REQUIRED"
          elif last_error_code in [502, 503, 504]:
              incident_type = "DOWNSTREAM_GATEWAY_OUTAGE"
          elif dead_letter_count > max_dlq:
              incident_type = "DEAD_LETTER_BUFFER_OVERFLOW"
          else:
              incident_type = "PERSISTENT_SYNC_DEGRADATION"

      summary = "; ".join(failure_reasons) if failure_reasons else "Destination pipeline operating nominally within SLA."

      print(f"RudderStack Destination Analysis Complete: ID={destination_id}, Status={sync_status}, RemediationNeeded={requires_remediation}")
      print(f"Incident Classification: {incident_type} | Details: {summary}")

      Kestra.outputs({
          "destination_id": destination_id,
          "sync_status": sync_status,
          "error_rate_pct": error_rate_pct,
          "consecutive_failures": consecutive_failures,
          "dead_letter_buffer_count": dead_letter_count,
          "requires_remediation": requires_remediation,
          "incident_type": incident_type,
          "summary": summary
      })

  - id: evaluate_incident_severity
    type: io.kestra.plugin.core.flow.If
    description: "Branches execution based on whether destination telemetry violated reliability and dead-letter buffer thresholds."
    condition: "{{ outputs.analyze_destination_health.vars.requires_remediation }}"
    then:
      - id: log_incident_detected
        type: io.kestra.plugin.core.log.Log
        description: "Logs the detected RudderStack destination sync degradation and prepares the operational remediation plan."
        level: WARN
        message: "CRITICAL: RudderStack destination '{{ inputs.destination_name }}' ({{ inputs.destination_id }}) degraded. Incident Type: {{ outputs.analyze_destination_health.vars.incident_type }}. Details: {{ outputs.analyze_destination_health.vars.summary }}"

      - id: operator_remediation_approval_gate
        type: io.kestra.plugin.core.flow.Pause
        description: "Human-in-the-loop operational gate requiring on-call SRE approval before mutating destination parameters and triggering dead-letter buffer replay."
        onResume:
          - id: approved
            type: BOOL
            defaults: true
            displayName: "Approve Automated Remediation"
            description: "Confirm authorization to temporarily throttle the destination pipeline, reconfigure backoff, and trigger dead-letter buffer replay."

          - id: remediation_strategy
            type: STRING
            defaults: "DRAIN_AND_REPLAY"
            displayName: "Remediation Strategy"
            description: "Select operational recovery action: DRAIN_AND_REPLAY, THROTTLE_AND_BACKOFF, or ISOLATE_AND_QUARANTINE."

          - id: operator_email
            type: STRING
            defaults: "data-sre-oncall@company.com"
            displayName: "Authorizing Operator Email"
            description: "Corporate identity of the engineer approving this operational intervention."

          - id: change_ticket_id
            type: STRING
            defaults: "INC-94812"
            displayName: "Incident Change Ticket ID"
            description: "ITSM change or incident ticket tracking this production remediation."

      - id: evaluate_operator_decision
        type: io.kestra.plugin.core.flow.If
        description: "Validates operator authorization decision to proceed with automated remediation or abort to prevent unscheduled mutations."
        condition: "{{ taskvar.approved ?? true }}"
        then:
          - id: pause_destination_pipeline
            type: io.kestra.plugin.core.http.Request
            description: "Active mutation: Temporarily pauses real-time event streaming to the degraded destination to prevent further queue accumulation."
            uri: "{{ inputs.rudderstack_api_url }}/v1/destinations/{{ inputs.destination_id }}/pause"
            method: POST
            headers:
              Authorization: "Bearer {{ secret('RUDDERSTACK_ACCESS_TOKEN') }}"
              Content-Type: "application/json"
            body: |
              {
                "reason": "Automated incident intervention triggered by Kestra execution {{ execution.id }}",
                "authorized_by": "{{ taskvar.operator_email }}",
                "change_ticket": "{{ taskvar.change_ticket_id }}"
              }
            timeout: PT30S

          - id: reconfigure_retry_and_backoff_policy
            type: io.kestra.plugin.core.http.Request
            description: "Active mutation: Updates destination batch size and exponential backoff parameters to relieve downstream endpoint saturation."
            uri: "{{ inputs.rudderstack_api_url }}/v1/destinations/{{ inputs.destination_id }}/config"
            method: PATCH
            headers:
              Authorization: "Bearer {{ secret('RUDDERSTACK_ACCESS_TOKEN') }}"
              Content-Type: "application/json"
            body: |
              {
                "batch_size": 100,
                "max_retry_attempts": 5,
                "backoff_multiplier": 2.0,
                "initial_retry_delay_seconds": 15,
                "circuit_breaker_threshold": 10
              }
            timeout: PT30S

          - id: trigger_dead_letter_buffer_replay
            type: io.kestra.plugin.core.http.Request
            description: "Active mutation: Dispatches dead-letter queue replay request to reprocess quarantined failed events through the newly tuned backoff pipeline."
            uri: "{{ inputs.rudderstack_api_url }}/v1/destinations/{{ inputs.destination_id }}/replay-failed-events"
            method: POST
            headers:
              Authorization: "Bearer {{ secret('RUDDERSTACK_ACCESS_TOKEN') }}"
              Content-Type: "application/json"
            body: |
              {
                "max_events_to_replay": {{ outputs.analyze_destination_health.vars.dead_letter_buffer_count }},
                "replay_mode": "LINEAR_BACKOFF",
                "filter_error_codes": [429, 502, 503, 504]
              }
            timeout: PT60S

          - id: resume_destination_pipeline
            type: io.kestra.plugin.core.http.Request
            description: "Active mutation: Resumes event streaming delivery to the destination with relaxed batch sizes and active replay processing."
            uri: "{{ inputs.rudderstack_api_url }}/v1/destinations/{{ inputs.destination_id }}/resume"
            method: POST
            headers:
              Authorization: "Bearer {{ secret('RUDDERSTACK_ACCESS_TOKEN') }}"
              Content-Type: "application/json"
            body: |
              {
                "resumed_by": "{{ taskvar.operator_email }}",
                "reason": "Automated post-reconfiguration pipeline resume"
              }
            timeout: PT30S

          - id: buffer_drain_stabilization_delay
            type: io.kestra.plugin.scripts.shell.Commands
            description: "Allows RudderStack worker nodes 25 seconds to drain the replayed dead-letter buffer before executing verification probes."
            taskRunner:
              type: io.kestra.plugin.core.runner.Process
            commands:
              - "echo 'Awaiting 25 seconds for RudderStack workers to drain replayed event batches...'"
              - "sleep 25"

          - id: post_remediation_telemetry_probe
            type: io.kestra.plugin.core.http.Request
            description: "Re-queries the RudderStack Management API to inspect post-remediation event delivery health and remaining buffer depth."
            uri: "{{ inputs.rudderstack_api_url }}/v1/destinations/{{ inputs.destination_id }}/metrics"
            method: GET
            headers:
              Authorization: "Bearer {{ secret('RUDDERSTACK_ACCESS_TOKEN') }}"
              Accept: "application/json"
            timeout: PT30S

          - id: verify_buffer_drain_and_recovery
            type: io.kestra.plugin.scripts.python.Script
            description: "Performs strict programmatic verification on post-remediation metrics to certify that the dead-letter buffer has safely drained."
            taskRunner:
              type: io.kestra.plugin.core.runner.Process
            script: |
              import json
              import sys
              from kestra import Kestra

              raw_probe = """{{ outputs.post_remediation_telemetry_probe.body }}"""

              try:
                  data = json.loads(raw_probe) if raw_probe.strip() else {}
              except Exception as err:
                  sys.stderr.write(f"FATAL: Malformed post-remediation JSON from RudderStack API: {err}\n")
                  sys.exit(1)

              if not data:
                  sys.stderr.write("FATAL: Post-remediation metrics payload is empty or unreachable.\n")
                  sys.exit(1)

              remaining_buffer = int(data.get("dead_letter_buffer_count", 0))
              current_error_rate = float(data.get("error_rate_pct", 0.0))
              sync_state = str(data.get("sync_state", "UNKNOWN")).upper()

              max_allowed_buffer = int("{{ inputs.verification_max_remaining_buffer }}")
              max_allowed_err = float("{{ inputs.max_acceptable_error_rate_pct }}")

              recovered = True
              unresolved_issues = []

              if remaining_buffer > max_allowed_buffer:
                  recovered = False
                  unresolved_issues.append(f"Remaining buffer ({remaining_buffer}) exceeds limit ({max_allowed_buffer})")

              if current_error_rate > max_allowed_err:
                  recovered = False
                  unresolved_issues.append(f"Current error rate ({current_error_rate:.2f}%) exceeds limit ({max_allowed_err:.2f}%)")

              if sync_state in ["STALLED", "FAILED", "CIRCUIT_BROKEN"]:
                  recovered = False
                  unresolved_issues.append(f"Sync state remains in '{sync_state}'")

              print(f"Post-Remediation Verification Result: Recovered={recovered}")
              if not recovered:
                  print(f"Verification Failure Reasons: {'; '.join(unresolved_issues)}")

              Kestra.outputs({
                  "recovered": recovered,
                  "remaining_buffer": remaining_buffer,
                  "current_error_rate": current_error_rate,
                  "post_sync_state": sync_state,
                  "unresolved_issues": unresolved_issues
              })

          - id: gate_downstream_customer_activation
            type: io.kestra.plugin.core.flow.If
            description: "Protects downstream warehouse transformations and customer activation flows by halting execution if the buffer failed to drain."
            condition: "{{ not outputs.verify_buffer_drain_and_recovery.vars.recovered }}"
            then:
              - id: fail_unrecovered_pipeline
                type: io.kestra.plugin.core.execution.Fail
                description: "Halts workflow execution with hard failure to prevent downstream models from ingesting incomplete or corrupt customer events."
                errorMessage: "CRITICAL: RudderStack destination '{{ inputs.destination_name }}' ({{ inputs.destination_id }}) failed post-remediation verification. Remaining buffer: {{ outputs.verify_buffer_drain_and_recovery.vars.remaining_buffer }} events. Downstream analytics pipelines halted to protect data integrity."

          - id: record_incident_audit_kv
            type: io.kestra.plugin.core.kv.Set
            description: "Persists incident resolution metrics and operational metadata into Kestra KV store for compliance auditability."
            key: "rudderstack_incident_{{ inputs.destination_id }}_{{ execution.id }}"
            value: |
              {
                "destination_id": "{{ inputs.destination_id }}",
                "destination_name": "{{ inputs.destination_name }}",
                "incident_type": "{{ outputs.analyze_destination_health.vars.incident_type }}",
                "operator_email": "{{ taskvar.operator_email }}",
                "change_ticket_id": "{{ taskvar.change_ticket_id }}",
                "remediation_strategy": "{{ taskvar.remediation_strategy }}",
                "pre_remediation_buffer": {{ outputs.analyze_destination_health.vars.dead_letter_buffer_count }},
                "post_remediation_buffer": {{ outputs.verify_buffer_drain_and_recovery.vars.remaining_buffer }},
                "remediation_timestamp": "{{ now() }}",
                "status": "RECOVERED"
              }

          - id: notify_slack_remediation_success
            type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
            description: "Emits structured Slack alert summarizing the successful RudderStack destination remediation, buffer drain, and operator metadata."
            url: "{{ secret('SLACK_WEBHOOK_URL') }}"
            payload: |
              {
                "channel": "#data-platform-alerts",
                "text": "RudderStack Destination Remediation Succeeded: {{ inputs.destination_name }}",
                "blocks": [
                  {
                    "type": "header",
                    "text": {
                      "type": "plain_text",
                      "text": "RudderStack Destination Remediation Resolved"
                    }
                  },
                  {
                    "type": "section",
                    "fields": [
                      {
                        "type": "mrkdwn",
                        "text": "*Destination:*\n{{ inputs.destination_name }} (`{{ inputs.destination_id }}`)"
                      },
                      {
                        "type": "mrkdwn",
                        "text": "*Incident Type:*\n{{ outputs.analyze_destination_health.vars.incident_type }}"
                      },
                      {
                        "type": "mrkdwn",
                        "text": "*Authorizing Operator:*\n{{ taskvar.operator_email }} (`{{ taskvar.change_ticket_id }}`)"
                      },
                      {
                        "type": "mrkdwn",
                        "text": "*Dead-Letter Buffer:*\n{{ outputs.analyze_destination_health.vars.dead_letter_buffer_count }} -> {{ outputs.verify_buffer_drain_and_recovery.vars.remaining_buffer }} events"
                      }
                    ]
                  },
                  {
                    "type": "context",
                    "elements": [
                      {
                        "type": "mrkdwn",
                        "text": "Execution ID: `{{ execution.id }}` | Verified via Kestra Automated Remediation Engine"
                      }
                    ]
                  }
                ]
              }
        else:
          - id: fail_on_operator_rejection
            type: io.kestra.plugin.core.execution.Fail
            description: "Terminates execution if on-call engineer rejects automated remediation, preventing unsanctioned pipeline mutations."
            errorMessage: "Remediation for RudderStack destination '{{ inputs.destination_name }}' rejected by operator {{ taskvar.operator_email }}. Downstream analytics execution aborted."
    else:
      - id: log_destination_healthy
        type: io.kestra.plugin.core.log.Log
        description: "Logs that the destination pipeline is operating nominally and clears downstream data activation jobs to execute."
        level: INFO
        message: "RudderStack destination '{{ inputs.destination_name }}' ({{ inputs.destination_id }}) is healthy. Error Rate: {{ outputs.analyze_destination_health.vars.error_rate_pct }}%, Dead-Letter Buffer: {{ outputs.analyze_destination_health.vars.dead_letter_buffer_count }} events. Downstream customer activation pipelines cleared to run."

triggers:
  - id: schedule_periodic_destination_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: "Periodically inspects RudderStack destination health and buffer accumulation every 15 minutes."
    cron: "*/15 * * * *"

extend:
  title: "RudderStack Destination Sync Failure and Dead-Letter Buffer Replay Gate"
  metaTitle: "RudderStack Destination Sync Failure and Dead-Letter Buffer Replay Gate"
  shortDescription: "Detects RudderStack destination sync degradation, authorizes automated backoff, replays dead-letter buffers, and gates downstream customer activations."
  metaDescription: "Orchestrate RudderStack destination health monitoring, automated pause and backoff tuning, dead-letter buffer replay, and downstream activation gating."
  description: |
    ## How it works
    This blueprint establishes an active, closed-loop operational resilience workflow for enterprise **RudderStack** event streaming pipelines. Rather than functioning as a passive notification script, this blueprint interacts directly with the RudderStack Control Plane and Data Plane Management APIs to continuously monitor destination health, execute automated operational interventions, replay dead-letter buffers, and gate downstream data activation workflows.

    1. **Ingest Destination Telemetry**: Queries the RudderStack Management API (`GET /v1/destinations/{destination_id}/metrics`) using bearer authentication to collect real-time synchronization metrics, consecutive batch drop counters, downstream target HTTP status codes, and dead-letter buffer (DLQ) backlog sizes.
    2. **In-Memory Health Analysis**: Executes an isolated Python inspection task that computes error rate percentages and evaluates consecutive failure counts against strict enterprise SLAs. It classifies incident root causes (e.g., downstream rate-limiting with HTTP 429, gateway outages with HTTP 503, or poisoned payload accumulation) and asserts loud failure on unparseable API responses.
    3. **Human-in-the-Loop Operational Gate**: When telemetry reveals SLA degradation or buffer backlog growth, the flow enters a `Pause` approval state. On-call data platform engineers or SREs inspect telemetry parameters, choose an authorized recovery strategy (`DRAIN_AND_REPLAY`, `THROTTLE_AND_BACKOFF`, or `ISOLATE_AND_QUARANTINE`), and furnish a corporate change ticket ID.
    4. **Active Operational Remediation**:
       - Temporarily pauses incoming event streaming (`POST /v1/destinations/{destination_id}/pause`) to stop further queue accumulation.
       - Reconfigures destination batch sizes and exponential backoff parameters (`PATCH /v1/destinations/{destination_id}/config`) to relieve downstream destination endpoint pressure.
       - Triggers an automated dead-letter queue replay (`POST /v1/destinations/{destination_id}/replay-failed-events`) targeting failed event batches across the incident window.
       - Resumes stream delivery (`POST /v1/destinations/{destination_id}/resume`) under the newly tuned backoff parameters.
    5. **Post-Remediation Verification Probe**: Re-queries the RudderStack telemetry endpoint following a stabilization delay to certify that the dead-letter buffer has dropped below the tolerance threshold and sync status has returned to `HEALTHY`.
    6. **Downstream Pipeline Protection Gate**: If the dead-letter buffer fails to drain or the operator rejects remediation, an explicit `Fail` task aborts the execution. This halts any downstream customer data activation, reverse-ETL, or warehouse modeling jobs from running against partial or corrupted customer profiles.
    7. **Audit & Incident State Tracking**: Saves full incident remediation metadata, operator attribution, pre/post buffer depths, and ticket identifiers into the Kestra Key-Value (KV) store for compliance audits.
    8. **Runbook Alerting**: Emits a structured Slack notification detailing incident resolution metrics and operational actions taken.

    ## Architecture diagram
    ```mermaid
    flowchart TD
        A[Schedule Trigger: Every 15 Min] --> B[Ingest Destination Telemetry]
        B --> C[Analyze Destination Health in Python]
        C --> D{Requires Remediation?}
        D -- No --> E[Log Healthy Destination & Clear Pipelines]
        D -- Yes --> F[Log Incident & Pause for Operator Approval]
        F --> G{Operator Approved?}
        G -- No --> H[Fail Workflow: Abort Downstream Activation]
        G -- Yes --> I[Active Mutation: Pause Destination Stream]
        I --> J[Active Mutation: Reconfigure Batch & Backoff Limits]
        J --> K[Active Mutation: Trigger Dead-Letter Buffer Replay]
        K --> L[Active Mutation: Resume Destination Stream]
        L --> M[Stabilization Delay: Worker Buffer Drain]
        M --> N[Post-Remediation Telemetry Probe]
        N --> O[Verify Buffer Drain in Python]
        O --> P{Buffer Drained Safely?}
        P -- No --> Q[Fail Task: Halt Downstream Reverse-ETL]
        P -- Yes --> R[Record Audit Metadata in Kestra KV Store]
        R --> S[Notify SRE Team via Slack Incoming Webhook]
    ```

    ## What you get
    - **Active Operational Interventions**: Executes real HTTP mutations (`POST`, `PATCH`) into the RudderStack Control Plane to pause event streams, tune batch sizes, and trigger dead-letter replays without requiring manual CLI interventions.
    - **Downstream Data Corruption Prevention**: Eliminates silent data divergence in downstream data warehouses (Snowflake, BigQuery, ClickHouse) and activation platforms (Braze, Amplitude) by gating executions when destination buffers are compromised.
    - **Standardized Change Management**: Embeds on-call human approval with mandatory ticket IDs and operator attribution directly into the orchestration lifecycle.
    - **Automated DLQ Drain Verification**: Programmatically confirms that replayed events are processed successfully before releasing downstream dependencies.
    - **Auditable Historical Log**: Records complete pre- and post-remediation metrics into the Kestra KV store for compliance and post-mortem analysis.

    ## Who it's for
    - **Data Platform Engineers**: Managing high-throughput RudderStack event streaming infrastructure across production cloud environments.
    - **Site Reliability Engineers (SREs)**: Tasked with maintaining event ingestion SLAs, resolving API rate-limiting incidents, and enforcing downstream pipeline protection gates.
    - **Analytics Engineers**: Ensuring that downstream customer data models and audience activations only run against synchronized, zero-loss event destinations.

    ## Why orchestrate this with Kestra
    - **Native Flow Control & Approval Gates**: Kestra provides built-in `Pause` tasks with structured `onResume` schemas, enabling seamless human authorization without external webhook listeners or custom microservices.
    - **Zero-Dependency Core Execution**: Integrates native HTTP request plugins, process execution runners, and KV storage directly within a declarative YAML workflow.
    - **Strict Fail-Closed Mechanics**: The native `Fail` task ensures that failing or stalling destination pipelines immediately prevent downstream tasks from processing incomplete customer datasets.
    - **Built-in Key-Value State Management**: Tracks incident history, recovery timestamps, and ticket IDs across workflow executions natively using Kestra KV store without requiring external Redis or database instances.

    ## Use cases
    - **Downstream Warehouse Rate-Limiting (HTTP 429)**: When high-volume event bursts trigger rate limits on warehouse ingestion endpoints, this blueprint pauses streaming, relaxes batch sizes, and replays failed buffers with exponential backoff.
    - **Third-Party API Outage Recovery**: Automatically recovers marketing and CRM destinations (e.g., Braze, HubSpot, Webhooks) after third-party maintenance windows by triggering automated dead-letter buffer replays once target connectivity is restored.
    - **Customer 360 Activation Gating**: Prevents reverse-ETL flows from pushing stale behavioral event data to production advertising channels when destination queues back up.

    ## Inputs
    | Parameter | Type | Default | Description |
    | :--- | :--- | :--- | :--- |
    | `rudderstack_api_url` | STRING | `https://api.rudderstack.com` | Base URL for the RudderStack Control Plane or self-hosted Data Plane gateway API. |
    | `destination_id` | STRING | `dest_snowflake_customer_360` | Unique identifier of the RudderStack event destination experiencing delivery lag. |
    | `destination_name` | STRING | `Snowflake Production Customer 360` | Human-readable destination display name for logs and notifications. |
    | `max_acceptable_error_rate_pct` | FLOAT | `5.0` | Maximum allowable event delivery failure rate before triggering operational backoff. |
    | `max_consecutive_failures` | INT | `3` | Consecutive batch upload failure count tripping the operational circuit breaker. |
    | `max_dead_letter_events` | INT | `1000` | Maximum allowable backlog of quarantined events in the dead-letter buffer. |
    | `verification_max_remaining_buffer` | INT | `50` | Maximum tolerable unconsumed events in dead-letter buffer during post-remediation probe. |

    ## Expected outputs
    - `outputs.analyze_destination_health.vars.requires_remediation`: Boolean indicating whether destination health violated error rate or buffer thresholds.
    - `outputs.analyze_destination_health.vars.incident_type`: Classification of the failure mode (`RATE_LIMIT_BACKOFF_REQUIRED`, `DOWNSTREAM_GATEWAY_OUTAGE`, `DEAD_LETTER_BUFFER_OVERFLOW`, or `NOMINAL`).
    - `outputs.analyze_destination_health.vars.dead_letter_buffer_count`: Initial number of quarantined events requiring replay.
    - `outputs.verify_buffer_drain_and_recovery.vars.recovered`: Boolean certifying whether the dead-letter buffer successfully drained below tolerance.
    - `outputs.verify_buffer_drain_and_recovery.vars.remaining_buffer`: Count of unconsumed dead-letter events following the remediation probe.

    ## Prerequisites
    - **RudderStack Cluster or Cloud Account**: An operational RudderStack Open Source Data Plane or RudderStack Cloud workspace.
    - **Personal Access Token / Management API Token**: A RudderStack access token with permissions to read destination metrics and mutate destination configuration (`destinations:read`, `destinations:write`).
    - **Configured Destination**: At least one active RudderStack destination (e.g., Snowflake, BigQuery, S3, or Webhook).
    - **Kestra 2.0+ Instance**: Running Kestra with network access to the RudderStack API endpoint and Slack webhook URL.

    ## Secrets
    Configure the following secrets in your Kestra secret manager:
    - `RUDDERSTACK_ACCESS_TOKEN`: The bearer authentication token used to query the RudderStack Management API and execute operational pause, patch, and replay requests.
    - `SLACK_WEBHOOK_URL`: The incoming webhook URL for dispatching incident resolution alerts to the SRE channel.

    ## Quick start
    1. Import this blueprint into your Kestra workspace under namespace `company.customer-data`.
    2. Add the `RUDDERSTACK_ACCESS_TOKEN` and `SLACK_WEBHOOK_URL` secrets to your Kestra namespace or global secret configuration.
    3. Update the `inputs` section with your specific `rudderstack_api_url` and `destination_id`.
    4. Execute the flow manually with `Execution` -> `Execute` to perform an initial destination health audit.
    5. When a test failure is triggered, inspect the `operator_remediation_approval_gate` task in the Kestra UI, supply your operator email and incident ticket ID, and click **Resume** to watch the automated pause, reconfigure, replay, and verification cycle execute.

    ## Common pitfalls and troubleshooting
    - **RudderStack API 401 Unauthorized**: Ensure the `RUDDERSTACK_ACCESS_TOKEN` secret is defined accurately in Kestra and that the token possesses administrative permissions over the specified destination.
    - **Premature Verification Probe Failure**: If the post-remediation verification fails due to residual buffer events, increase the `buffer_drain_stabilization_delay` sleep duration from 25 to 60 seconds to grant RudderStack workers adequate time to flush large queues.
    - **Persistent Downstream Rate Limiting**: If downstream endpoints continue returning HTTP 429 after replay, decrease the `batch_size` in `reconfigure_retry_and_backoff_policy` from 100 to 25 and increase `initial_retry_delay_seconds` to 30.
    - **Downstream Flow Gating**: When `gate_downstream_customer_activation` fails, check the execution logs to verify whether the incident was rejected by an operator or failed programmatic buffer drain assertions.

    ## How to extend
    - **Multi-Destination Dynamic Iteration**: Wrap the health check and remediation tasks within an `io.kestra.plugin.core.flow.ForEach` loop to monitor and remediate an array of critical customer data destinations simultaneously.
    - **Dynamic Ticket Creation**: Add a task before the pause gate to automatically create a PagerDuty incident or Jira Service Desk ticket via HTTP Request and populate the `change_ticket_id` dynamically.
    - **Automated Downstream Pipeline Triggering**: Add a downstream trigger task (`io.kestra.plugin.core.flow.SubflowExecution`) to trigger warehouse dbt transformations or Reverse-ETL jobs only after post-remediation verification succeeds.

