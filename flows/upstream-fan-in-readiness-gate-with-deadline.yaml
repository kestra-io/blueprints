id: upstream-fan-in-readiness-gate-with-deadline
namespace: company.team

description: |
  Starts the daily consolidation once at least N of M upstream feed flows have succeeded before a deadline.
  The Flow trigger does the waiting (`dependsOn` + `mode: AT_LEAST` + `window.deadline`); the flow reads which feeds
  made it from `trigger.outputs`, labels and measures the fan-in, asks for approval when feeds are missing, and
  concatenates the files of the feeds that arrived.

labels:
  pattern: fan-in-gate

inputs:
  - id: partial_policy
    type: SELECT
    values: [approve, proceed, fail]
    defaults: approve
    description: |
      What to do when the gate fires with feeds missing. approve (default) pauses for a human decision,
      proceed consolidates the feeds that arrived without asking, fail stops the run and writes a dead letter.

  - id: approval_wait
    type: DURATION
    defaults: PT2H
    description: How long the approval Pause waits for a decision. Keep it below the 6-hour run SLA.

  - id: approval_timeout_behavior
    type: SELECT
    values: [RESUME, WARN, FAIL]
    defaults: RESUME
    description: |
      What the Pause does when approval_wait runs out without a decision. RESUME (default) consolidates the partial set,
      because N of M before the deadline is the agreed contract. WARN does the same but ends the run in WARNING,
      FAIL stops it and writes a dead letter. The Pause also offers CANCEL, deliberately left out: on 2.0.5 the execution
      is marked CANCELLED but the tasks after the Pause still run, so the consolidation would happen under a cancelled run.

  - id: feed_outputs
    type: JSON
    defaults: {}
    description: |
      Only for manual runs and replays. A map of upstream flow id to its outputs, exactly as the Flow trigger would
      deliver them, for example {"orders-feed-eu": {"file": "kestra:///...csv", "row_count": 120}}. Leave empty when
      the Flow trigger starts the gate; a dead letter stores this payload so a failed run can be replayed.

  - id: kestra_api_url
    type: STRING
    defaults: http://localhost:8080
    description: Base URL of this Kestra instance's API, as seen from the worker. Used to check whether late feeds landed during the approval wait.

variables:
  tenant: main
  upstream_namespace: company.team
  feeds: ["orders-feed-eu", "orders-feed-us", "orders-feed-apac"]
  deadline: "06:30:00"
  timezone: Europe/Paris
  manifest_prefix: fan_in_gate_manifest_
  dlq_prefix: fan_in_gate_dlq_
  window_date: "{{ now() | date('yyyy-MM-dd', timeZone=vars.timezone) }}"
  arrived: "{{ (trigger.outputs[vars.upstream_namespace] ?? inputs.feed_outputs) | toJson }}"
  execution_link: "{{ kestra.url ?? inputs.kestra_api_url }}/ui/main/executions/{{ flow.namespace }}/{{ flow.id }}/{{ execution.id }}"
  failed_task: >-
    {{ errorLogs() | jq('[.[] | select(.taskId != null and (.taskId | test("^(slack_|log_failure|dead_letter)") | not))] | (last // {}) | .taskId // "unknown"') | first }}
  failure_message: >-
    {{ errorLogs() | jq('[.[] | select(.taskId != null and (.taskId | test("^(slack_|log_failure|dead_letter)") | not))] as $e | ($e | last | .taskId) as $t | [$e[] | select(.taskId == $t) | .message][0] // "no task error was logged (expired approval with FAIL, or the run SLA)"') | first | abbreviate(300) }}

checks:
  - when: "{{ inputs.feed_outputs | jq('type == \"object\"') | first }}"
    message: feed_outputs must be a JSON object keyed by upstream flow id, or {} when the Flow trigger starts the gate.
    style: ERROR
    behavior: BLOCK_EXECUTION
  - when: "{{ inputs.feed_outputs | jq('keys - ' ~ (vars.feeds | toJson) ~ ' | length == 0') | first }}"
    message: "feed_outputs names a flow that is not one of the configured feeds (variables.feeds). Check the ids, they must match the trigger's dependsOn list."
    style: ERROR
    behavior: BLOCK_EXECUTION
  - when: "{{ inputs.feed_outputs | jq('[.[] | select(type != \"object\")] | length == 0') | first }}"
    message: Every entry of feed_outputs must be an object with the upstream flow's outputs (at least file and row_count).
    style: ERROR
    behavior: BLOCK_EXECUTION

concurrency:
  limit: 1
  behavior: QUEUE

sla:
  - id: run_deadline
    type: MAX_DURATION
    duration: PT6H
    behavior: FAIL
    labels:
      fan_in_sla: breached

triggers:
  - id: fan_in
    type: io.kestra.plugin.core.trigger.Flow
    description: |
      Fires as soon as 2 of the 3 feeds have succeeded today, as long as that happens before 06:30 Paris time. Every
      feed success is recorded in a window that starts at midnight (timezone) and closes at the deadline; the window
      resets when the trigger fires. `when` keeps the gate to one consolidation per window: it reads the manifest key
      written by write_manifest, so re-runs of a feed after a successful consolidation do not fire the gate again.
      The deadline, timezone, feed list and namespace are repeated in `variables`: trigger properties are static, keep both in sync.
    when: "{{ kv('fan_in_gate_manifest_' ~ (now() | date('yyyy-MM-dd', timeZone='Europe/Paris')), namespace='company.team', errorOnMissing=false) is null }}"
    mode: AT_LEAST
    minSatisfied: 2
    window:
      deadline: "06:30:00"
      timezone: Europe/Paris
    dependsOn:
      - namespace: company.team
        flowId: orders-feed-eu
        states: [SUCCESS]
      - namespace: company.team
        flowId: orders-feed-us
        states: [SUCCESS]
      - namespace: company.team
        flowId: orders-feed-apac
        states: [SUCCESS]

tasks:
  - id: fan_in_context
    type: io.kestra.plugin.core.output.OutputValues
    description: |
      Reads the fan-in from the trigger. `trigger.outputs` holds one entry per upstream that satisfied the window,
      keyed by namespace then flow id, so the feeds that arrived are its keys and the late ones are the rest of the list.
      A manual run takes the same payload from `feed_outputs`.
    values:
      source: "{{ (trigger.executionId ?? null) is not null ? 'flow_trigger' : 'manual' }}"
      window_date: "{{ render(vars.window_date) }}"
      deadline_at: "{{ render(vars.window_date) }}T{{ vars.deadline }} {{ vars.timezone }}"
      arrived: "{{ render(vars.arrived, recursive=false) }}"
      satisfied: "{{ fromJson(render(vars.arrived, recursive=false)) | jq('keys | sort') | first | toJson }}"
      late: "{{ vars.feeds | jq('. - (' ~ (fromJson(render(vars.arrived, recursive=false)) | jq('keys') | first | toJson) ~ ') | sort') | first | toJson }}"
      satisfied_count: "{{ fromJson(render(vars.arrived, recursive=false)) | length }}"
      expected_count: "{{ vars.feeds | length }}"
      rows_total: "{{ fromJson(render(vars.arrived, recursive=false)) | jq('[.[] | .row_count // 0] | add // 0') | first }}"
      trigger_lag_seconds: "{{ (trigger.endDate ?? null) is null ? 0 : (execution.startDate | timestamp) - (trigger.endDate | timestamp) }}"
      last_upstream: "{{ trigger.flowId ?? 'none' }} {{ trigger.executionId ?? '' }}"

  - id: validate_payload
    type: io.kestra.plugin.core.execution.Assert
    description: |
      The gate depends on an output contract with the feeds: `file` (internal storage URI) and `row_count`. A feed that
      renames an output would otherwise fail later inside Concat with a storage error. Also catches a manual run without feed_outputs.
    conditions:
      - "{{ (outputs.fan_in_context.values.satisfied_count | number) > 0 }}"
      - "{{ fromJson(outputs.fan_in_context.values.arrived) | jq('[.[] | select((.file // \"\" | tostring | startswith(\"kestra://\") | not) or (.row_count | type) != \"number\")] | length == 0') | first }}"
    errorMessage: "No usable feed outputs. Every feed must expose flow outputs `file` (a kestra:// URI) and `row_count` (number); a manual run needs them in feed_outputs. Got: {{ outputs.fan_in_context.values.arrived | abbreviate(400) }}"

  - id: label_fan_in
    type: io.kestra.plugin.core.execution.Labels
    description: Labels make the fan-in searchable in the Executions list (filter on fan_in_late to find every partial day). Label values cannot be empty, hence `none`.
    labels:
      fan_in_satisfied: "{{ outputs.fan_in_context.values.satisfied_count }}/{{ outputs.fan_in_context.values.expected_count }}"
      fan_in_late: "{{ (fromJson(outputs.fan_in_context.values.late) | length) > 0 ? fromJson(outputs.fan_in_context.values.late) | join(',') : 'none' }}"
      fan_in_window: "{{ outputs.fan_in_context.values.window_date }}"
      fan_in_source: "{{ outputs.fan_in_context.values.source }}"

  - id: publish_metrics
    type: io.kestra.plugin.core.metric.Publish
    description: Counters per window plus a timer for the delay between the last feed's end and this execution's start, visible on the flow's Metrics tab.
    metrics:
      - type: counter
        name: feeds_arrived
        value: "{{ outputs.fan_in_context.values.satisfied_count }}"
        tags:
          window: "{{ outputs.fan_in_context.values.window_date }}"
          source: "{{ outputs.fan_in_context.values.source }}"
      - type: counter
        name: feeds_late
        value: "{{ fromJson(outputs.fan_in_context.values.late) | length }}"
        tags:
          window: "{{ outputs.fan_in_context.values.window_date }}"
          source: "{{ outputs.fan_in_context.values.source }}"
      - type: counter
        name: rows_consolidated
        value: "{{ outputs.fan_in_context.values.rows_total }}"
        tags:
          window: "{{ outputs.fan_in_context.values.window_date }}"
      - type: timer
        name: trigger_lag
        value: "PT{{ outputs.fan_in_context.values.trigger_lag_seconds }}S"
        tags:
          window: "{{ outputs.fan_in_context.values.window_date }}"

  - id: partial_fan_in
    type: io.kestra.plugin.core.flow.If
    description: Only runs when at least one feed is missing. A full fan-in goes straight to the consolidation.
    condition: "{{ (fromJson(outputs.fan_in_context.values.late) | length) > 0 }}"
    then:
      - id: apply_partial_policy
        type: io.kestra.plugin.core.flow.Switch
        value: "{{ inputs.partial_policy }}"
        cases:
          fail:
            - id: refuse_partial
              type: io.kestra.plugin.core.execution.Fail
              errorMessage: "partial_policy is fail and {{ fromJson(outputs.fan_in_context.values.late) | join(', ') }} did not succeed before {{ outputs.fan_in_context.values.deadline_at }}. Nothing was consolidated."
          approve:
            - id: slack_ask_approval
              type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
              allowFailure: true
              url: "{{ secret('SLACK_WEBHOOK_URL') }}"
              description: Tells the channel which feeds are missing and where to decide. allowFailure, so a broken webhook never blocks the approval itself.
              messageText: ":hourglass_flowing_sand: Fan-in gate {{ flow.id }} fired with {{ outputs.fan_in_context.values.satisfied_count }} of {{ outputs.fan_in_context.values.expected_count }} feeds for {{ outputs.fan_in_context.values.window_date }}. Late: {{ fromJson(outputs.fan_in_context.values.late) | join(', ') }}. Approve or reject before the pause times out (then: {{ inputs.approval_timeout_behavior }}): {{ render(vars.execution_link) }}"
            - id: wait_for_approval
              type: io.kestra.plugin.core.flow.Pause
              description: |
                Human decision with a reason. Resumed from the UI or `POST /api/v1/{tenant}/executions/{id}/actions/resume`
                with the onResume inputs as form fields. When nobody answers within approval_wait, `behavior` decides: RESUME
                continues with the partial set, FAIL ends in the errors branch, WARN continues but marks the run WARNING
                (CANCEL is excluded, see the input description). Known 2.0.5 behavior, verified: the executor renders
                pauseDuration and behavior once per flow revision and keeps the result, so a per-run override of these two
                inputs only applies to the first run after a deploy. To change them for good, edit the defaults and save the flow.
              pauseDuration: "{{ inputs.approval_wait }}"
              behavior: "{{ inputs.approval_timeout_behavior }}"
              onResume:
                - id: proceed
                  type: BOOL
                  displayName: Consolidate with the feeds that arrived? false rejects and writes a dead letter.
                  defaults: true
                - id: note
                  type: STRING
                  displayName: Reason (kept in the manifest or the dead letter)
                  defaults: ""
            - id: check_decision
              type: io.kestra.plugin.core.flow.If
              condition: "{{ not (outputs.wait_for_approval.onResume.proceed ?? true) }}"
              then:
                - id: rejected
                  type: io.kestra.plugin.core.execution.Fail
                  errorMessage: "Partial consolidation rejected by {{ outputs.wait_for_approval.resumed.by ?? 'the approver' }}{{ (outputs.wait_for_approval.onResume.note ?? '') != '' ? ': ' ~ outputs.wait_for_approval.onResume.note : '' }}. Late feeds: {{ fromJson(outputs.fan_in_context.values.late) | join(', ') }}."
        defaults:
          - id: proceed_without_asking
            type: io.kestra.plugin.core.log.Log
            level: WARN
            message: "partial_policy is proceed: consolidating {{ outputs.fan_in_context.values.satisfied_count }} of {{ outputs.fan_in_context.values.expected_count }} feeds without {{ fromJson(outputs.fan_in_context.values.late) | join(', ') }}."

      - id: recheck_late_feeds
        type: io.kestra.plugin.core.http.Request
        description: |
          After the wait, asks the Kestra API whether any late feed has a successful run today. The gate's window reset when
          it fired, so a feed landing during the pause never re-fires it; this is how the operator learns about it. allowFailure:
          this is information for the manifest and the labels, an unreachable API must not stop the consolidation; the run ends WARNING instead.
        allowFailure: true
        uri: "{{ inputs.kestra_api_url }}/api/v1/{{ vars.tenant }}/executions/search"
        params:
          "filters[namespace][EQUALS]": "{{ vars.upstream_namespace }}"
          "filters[flowId][IN]": "{{ fromJson(outputs.fan_in_context.values.late) | join(',') }}"
          "filters[state][IN]": SUCCESS
          "filters[startDate][GREATER_THAN_OR_EQUAL_TO]": "{{ outputs.fan_in_context.values.window_date }}T00:00:00{{ now() | date('XXX', timeZone=vars.timezone) }}"
          size: "100"
        options:
          auth: {type: BASIC, username: "{{ secret('KESTRA_API_USERNAME') }}", password: "{{ secret('KESTRA_API_PASSWORD') }}"}
        timeout: PT30S
        retry:
          type: exponential
          interval: PT5S
          maxInterval: PT30S
          maxAttempts: 3

      - id: label_landed_late
        type: io.kestra.plugin.core.execution.Labels
        description: Late feeds that nevertheless have a successful run today (before the window opened, or during the pause). Their files are not in this consolidation; the manifest keeps the list for a backfill.
        labels:
          fan_in_landed_late: "{{ (outputs.recheck_late_feeds.body ?? null) is null ? 'unknown' : ((fromJson(outputs.recheck_late_feeds.body).results | jq('[.[].flowId] | unique | join(\",\")') | first) is empty ? 'none' : (fromJson(outputs.recheck_late_feeds.body).results | jq('[.[].flowId] | unique | join(\",\")') | first)) }}"

  - id: consolidate
    type: io.kestra.plugin.core.storage.Concat
    description: |
      The consolidation step: one CSV from the files of the feeds that arrived, in feed-id order. Files are read straight
      from internal storage (`kestra://` URIs taken from the upstream outputs), which is why the gate lives in the feeds' namespace.
      Replace this task with your own rollup (a query, a Subflow, an upload) and keep the rest of the gate.
    files: "{{ fromJson(outputs.fan_in_context.values.arrived) | jq('[to_entries | sort_by(.key)[] | .value.file]') | first | toJson }}"
    separator: "\n"
    extension: .csv

  - id: manifest
    type: io.kestra.plugin.core.output.OutputValues
    description: |
      One record of what this window consolidated and under which decision. Stored in KV by write_manifest and exposed as a
      flow output. A manual resume is told apart from a timeout by `outputs.wait_for_approval.onResume`: the Pause only
      fills it when somebody answered; `resumed.by` carries the user name when the instance records one (not on basic auth OSS).
    values:
      manifest: |
        {{ {
          'window': outputs.fan_in_context.values.window_date,
          'deadline': outputs.fan_in_context.values.deadline_at,
          'source': outputs.fan_in_context.values.source,
          'satisfied': fromJson(outputs.fan_in_context.values.satisfied),
          'late': fromJson(outputs.fan_in_context.values.late),
          'landed_late': labels.fan_in_landed_late ?? 'none',
          'rows_total': outputs.fan_in_context.values.rows_total | number,
          'file': outputs.consolidate.uri,
          'decision': (fromJson(outputs.fan_in_context.values.late) | length) == 0 ? 'full fan-in' : (outputs.wait_for_approval.onResume ?? null) is not null ? 'approved by ' ~ (outputs.wait_for_approval.resumed.by ?? 'an operator (name not recorded)') : (outputs.wait_for_approval.resumed ?? null) is not null ? 'no answer before the pause timed out, ' ~ inputs.approval_timeout_behavior : 'policy ' ~ inputs.partial_policy,
          'note': outputs.wait_for_approval.onResume.note ?? '',
          'execution': execution.id
        } | toJson }}

  - id: write_manifest
    type: io.kestra.plugin.core.kv.Set
    description: |
      The manifest key doubles as the trigger's once-per-window guard (`when` in the fan_in trigger). Delete the key to let the
      gate fire again today, for example after a feed was re-run with corrected data. The 30-day ttl keeps the KV store clean.
    key: "{{ vars.manifest_prefix }}{{ outputs.fan_in_context.values.window_date }}"
    kvType: JSON
    value: "{{ outputs.manifest.values.manifest }}"
    ttl: P30D

errors:
  - id: log_failure
    type: io.kestra.plugin.core.log.Log
    level: ERROR
    message: "Fan-in gate {{ (labels.fan_in_sla ?? '') == 'breached' ? 'was stopped by the 6-hour run SLA' : 'failed in task ' ~ render(vars.failed_task, recursive=false) ~ ': ' ~ render(vars.failure_message, recursive=false) }} {{ render(vars.execution_link) }}"

  - id: dead_letter
    type: io.kestra.plugin.core.kv.Set
    description: |
      Keeps the trigger payload for 7 days so the window can be replayed by hand: copy `arrived` into the `feed_outputs`
      input of a manual run (with partial_policy proceed or fail as you see fit). Nothing in internal storage is deleted by a failure.
    key: "{{ vars.dlq_prefix }}{{ render(vars.window_date) }}"
    kvType: JSON
    ttl: P7D
    value: |
      {{ {
        'window': render(vars.window_date),
        'failed_task': render(vars.failed_task, recursive=false),
        'error': render(vars.failure_message, recursive=false),
        'arrived': fromJson(outputs.fan_in_context.values.arrived ?? render(vars.arrived, recursive=false)),
        'late': fromJson(outputs.fan_in_context.values.late ?? '[]'),
        'execution': execution.id
      } | toJson }}

  - id: slack_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    allowFailure: true
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    messageText: ":rotating_light: Fan-in gate {{ flow.id }} failed for {{ render(vars.window_date) }} in `{{ render(vars.failed_task, recursive=false) }}`: {{ render(vars.failure_message, recursive=false) }}. Dead letter: {{ vars.dlq_prefix }}{{ render(vars.window_date) }}. {{ render(vars.execution_link) }}"

finally:
  - id: run_summary
    type: io.kestra.plugin.core.log.Log
    description: Runs after success, rejection, failure and the errors branch.
    message: "Fan-in {{ outputs.fan_in_context.values.satisfied_count ?? '?' }}/{{ outputs.fan_in_context.values.expected_count ?? '?' }} for {{ render(vars.window_date) }} ({{ outputs.fan_in_context.values.source ?? 'unknown source' }}); late: {{ outputs.fan_in_context.values.late ?? '[]' }}; consolidated file: {{ outputs.consolidate.uri ?? 'none' }}"

afterExecution:
  - id: slack_outcome
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    allowFailure: true
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    description: |
      Runs once the final state is known, for every end the errors branch does not report: SUCCESS, WARNING (recheck API
      down, or WARN timeout behavior) and the SLA breach, which skips finally on 2.0.5.
    runIf: "{{ execution.state != 'FAILED' or (labels.fan_in_sla ?? '') == 'breached' }}"
    messageText: "Fan-in gate {{ flow.id }} ended {{ execution.state }} for {{ render(vars.window_date) }}: {{ outputs.fan_in_context.values.satisfied_count ?? '?' }}/{{ outputs.fan_in_context.values.expected_count ?? '?' }} feeds, late {{ (outputs.fan_in_context.values.late ?? '[]') }}, landed late {{ labels.fan_in_landed_late ?? 'n/a' }}, {{ outputs.fan_in_context.values.rows_total ?? 0 }} rows. {{ render(vars.execution_link) }}"

outputs:
  - id: consolidated_file
    type: FILE
    description: The concatenated CSV of every feed that arrived.
    value: "{{ outputs.consolidate.uri }}"
  - id: manifest
    type: JSON
    description: Window, satisfied and late feeds, decision and row count, the same record written to KV.
    value: "{{ outputs.manifest.values.manifest }}"


extend:
  title: Fan-in readiness gate with AT_LEAST N of M upstream flows before a daily deadline
  metaTitle: Fan-In Gate with Flow Trigger dependsOn, AT_LEAST, minSatisfied and Deadline Window | Kestra
  shortDescription: Start a consolidation once at least N of M upstream feed flows succeeded before a daily deadline. The Flow trigger waits; the flow labels the fan-in, publishes metrics, asks for approval when feeds are missing and concatenates the feeds that arrived.
  metaDescription: Kestra Flow trigger with dependsOn, mode AT_LEAST, minSatisfied and a deadline window. Reads trigger.outputs to see which upstreams arrived, labels and measures the fan-in, pauses for approval on a partial set, consolidates and keeps a manifest.
  description: |
    Most daily pipelines wait for several upstream jobs before a rollup can start. Waiting for all of them lets one slow feed hold everyone back; a fixed schedule works with stale data. The usual compromise is a quorum: start once at least N of the M feeds are in, before a deadline, and know exactly which feeds were included. This flow is that gate, built on the core `Flow` trigger: `dependsOn` lists the feeds, `mode: AT_LEAST` with `minSatisfied` sets the quorum, `window.deadline` with `timezone` bounds it to the day. The flow reads which feeds made it from `trigger.outputs`, labels the execution, publishes metrics, applies a policy for the missing feeds (ask, proceed or fail) and concatenates the files that arrived. The feed ids (`orders-feed-eu`, `orders-feed-us`, `orders-feed-apac`) are placeholders.

    ## How the trigger behaves

    Each success of a `dependsOn` feed is recorded in a window from midnight (`timezone`) to `deadline`. The trigger fires when the count reaches `minSatisfied`, then the window resets. Three consequences, verified on 2.0.5:

    - With `AT_LEAST 2` the gate fires with exactly 2 of 3 feeds: the third is by definition not in yet. 3 of 3 needs `mode: ALL`.
    - A feed that succeeds after the fire counts towards a new window; if another feed re-runs, the gate fires a second time the same day. The `when` guard stops that by reading the KV manifest key written by a successful run. Delete the key to allow another run.
    - After the deadline nothing fires until the next day. An already open window keeps the boundaries it was created with: a changed `deadline` applies once that window fires or expires.

    ## How it works, task by task

    1. `fan_in_context` reads `trigger.outputs`, which holds the outputs of every upstream that satisfied the window under `trigger.outputs.<namespace>.<flowId>`: the feeds that arrived are the keys, the late ones are the rest of `variables.feeds`. It also computes the window date, the sum of `row_count` and the trigger lag. A manual run takes the same payload from `feed_outputs`.
    2. `validate_payload` (`Assert`) checks the output contract: `file` is a `kestra://` URI, `row_count` a number. A renamed upstream output fails here with a readable message, not inside the consolidation.
    3. `label_fan_in` (`execution.Labels`) sets `fan_in_satisfied` (2/3), `fan_in_late`, `fan_in_window` and `fan_in_source`, so the Executions list can be filtered by partial day.
    4. `publish_metrics` (`metric.Publish`) emits the counters `feeds_arrived`, `feeds_late`, `rows_consolidated` and the timer `trigger_lag`, tagged by window.
    5. `partial_fan_in` runs only when a feed is missing. `apply_partial_policy` (`Switch` on `partial_policy`): `fail` stops the run; `approve` posts to Slack and pauses in `wait_for_approval` with `proceed` and `note` as `onResume` inputs for `approval_wait`, then `approval_timeout_behavior` decides (RESUME continues, WARN continues in WARNING, FAIL stops with a dead letter); `proceed: false` fails the run with the note. `proceed` logs a warning and continues. Two 2.0.5 findings are documented on the input and the Pause task: CANCEL is not offered (tasks after a cancelled Pause still run) and per-run overrides of the two Pause inputs only apply to the first run after a deploy.
    6. `recheck_late_feeds` (`http.Request` on the Kestra API) looks for successful runs of the late feeds today, since a feed landing during the pause never re-fires the gate (the window reset). `allowFailure`: an unreachable API turns the run WARNING without blocking the consolidation. `label_landed_late` records the result.
    7. `consolidate` (`storage.Concat`) builds one CSV from the files that arrived. Replace this step with your own rollup.
    8. `manifest` and `write_manifest` keep one JSON record per window in KV (`fan_in_gate_manifest_<date>`, 30-day ttl): satisfied and late feeds, decision, row count, file URI. The same key is the trigger's once-per-window guard.

    ## Error handling

    - Flow `checks` block a manual run before it exists when `feed_outputs` is not an object, names an unknown feed, or holds entries that are not objects.
    - `errors` logs the failed task and message from `errorLogs()`, writes a dead letter to KV (`fan_in_gate_dlq_<date>`, 7-day ttl) with the trigger payload, and alerts Slack with `allowFailure`. To replay, copy the dead letter's `arrived` map into `feed_outputs` of a manual run.
    - `finally` logs a one-line summary. `afterExecution` reports the ends the errors branch does not: SUCCESS, WARNING and the 6-hour `sla` breach, which skips `finally` on 2.0.5.
    - `concurrency` queues a second fire behind a paused one instead of consolidating twice.

    ## How to run

    1. Create the secrets `KESTRA_API_USERNAME`, `KESTRA_API_PASSWORD` (for the recheck) and optionally `SLACK_WEBHOOK_URL`.
    2. Give each feed the two outputs the gate expects, `file` (internal-storage URI) and `row_count`. A minimal feed, replace `write` with the real extract:

       ```yaml
       id: orders-feed-eu
       namespace: company.team
       inputs:
         - id: rows
           type: INT
           defaults: 3
       tasks:
         - id: write
           type: io.kestra.plugin.core.storage.Write
           content: |
             {% for i in range(1, inputs.rows) %}eu,{{ i }},{{ now() }}{% if not loop.last %}
             {% endif %}{% endfor %}
           extension: .csv
       outputs:
         - id: file
           type: FILE
           value: "{{ outputs.write.uri }}"
         - id: row_count
           type: INT
           value: "{{ inputs.rows }}"
       ```

    3. Replace the feed ids in `dependsOn` and `variables.feeds`, set `deadline` and `timezone` in both places (trigger properties are static, tasks read the variables), set `minSatisfied`.
    4. Run the feeds. The gate starts on its own once the quorum is reached, with its labels in the Executions list.
    5. To rehearse without the trigger, run the gate manually with `feed_outputs` copied from the Outputs tab of finished feeds.

    ## How to adapt

    - Require every feed: `mode: ALL` without `minSatisfied`. Any feed: `mode: ANY`.
    - Filter feeds by label (`labels: {env: prod}` on a `dependsOn` entry) or add `WARNING` to `states`.
    - Replace `storage.Concat` with a DuckDB query, a `Subflow` call or an upload, and keep the manifest.
    - Set `partial_policy: proceed` in the trigger's `inputs` to change the default for triggered runs.
    - Feeds in another namespace: the gate must be able to read their files, so move it next to them or have the feeds copy their result to a shared location.

    ## Troubleshooting

    - The gate never fires: each `dependsOn` entry must name an existing flow, and the feeds must end in a listed `states` value (WARNING only if listed) before the deadline.
    - It fired yesterday but not today although the feeds ran: today's manifest key exists (a manual run wrote it). Delete `fan_in_gate_manifest_<date>` in the KV store.
    - `fan_in_landed_late` is `unknown`: the recheck could not reach the API (`kestra_api_url` as seen from the worker, secrets). The run ends WARNING, the consolidation is done.
    - No approver name in the manifest: `resumed.by` is only filled when Kestra knows the user; a basic-auth resume on OSS leaves it empty.

