id: snowflake-spilled-local-and-remote-storage-sentinel
namespace: company.ops

inputs:
  - id: account
    type: STRING
    description: Snowflake account identifier.
  - id: username
    type: STRING
    description: Snowflake user name.
  - id: warehouse
    type: STRING
    defaults: "COMPUTE_WH"
    description: Snowflake warehouse for executing the audit query.

tasks:
  - id: query_spilled_storage
    type: io.kestra.plugin.jdbc.snowflake.Query
    url: "jdbc:snowflake://{{ inputs.account }}.snowflakecomputing.com/?warehouse={{ inputs.warehouse }}&db=SNOWFLAKE&schema=ACCOUNT_USAGE"
    username: "{{ inputs.username }}"
    password: "{{ secret('SNOWFLAKE_PASSWORD') }}"
    sql: |
      SELECT QUERY_ID, USER_NAME, WAREHOUSE_NAME,
             ROUND(BYTES_SPILLED_TO_LOCAL_STORAGE / 1024 / 1024, 2) AS spilled_local_mb,
             ROUND(BYTES_SPILLED_TO_REMOTE_STORAGE / 1024 / 1024, 2) AS spilled_remote_mb
      FROM SNOWFLAKE.ACCOUNT_USAGE.QUERY_HISTORY
      WHERE START_TIME >= DATEADD('hour', -1, CURRENT_TIMESTAMP())
        AND (BYTES_SPILLED_TO_LOCAL_STORAGE > 0 OR BYTES_SPILLED_TO_REMOTE_STORAGE > 0)
      ORDER BY BYTES_SPILLED_TO_REMOTE_STORAGE DESC, BYTES_SPILLED_TO_LOCAL_STORAGE DESC
      LIMIT 1;
    fetchOne: true

  - id: evaluate_spill_health
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.query_spilled_storage.row.QUERY_ID is defined and outputs.query_spilled_storage.row.QUERY_ID != null }}"
    then:
      - id: notify_data_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#snowflake-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 Snowflake Query Memory Spilling Alert",
                "text": "Snowflake warehouse `{{ outputs.query_spilled_storage.row.WAREHOUSE_NAME }}` recorded severe memory spilling for query `{{ outputs.query_spilled_storage.row.QUERY_ID }}` (Local Spill: *{{ outputs.query_spilled_storage.row.SPILLED_LOCAL_MB }} MB*, Remote S3/Blob Spill: *{{ outputs.query_spilled_storage.row.SPILLED_REMOTE_MB }} MB*)! Impact: Warehouse RAM was completely exhausted during join/aggregation processing, causing queries to write intermediate partitions to cloud object storage and increasing compute credits 10x.",
                "footer": "Kestra FinOps Sentinel • Snowflake"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#snowflake-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ Snowflake Query Memory Spilling to Local and Remote Storage Sentinel Pipeline Failure",
            "text": "Failed to query Snowflake ACCOUNT_USAGE.QUERY_HISTORY. Check connection parameters.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

outputs:
  - id: query_id
    type: STRING
    value: "{{ outputs.query_spilled_storage.row.QUERY_ID }}"
  - id: warehouse_name
    type: STRING
    value: "{{ outputs.query_spilled_storage.row.WAREHOUSE_NAME }}"
  - id: spilled_local_mb
    type: FLOAT
    value: "{{ outputs.query_spilled_storage.row.SPILLED_LOCAL_MB }}"
  - id: spilled_remote_mb
    type: FLOAT
    value: "{{ outputs.query_spilled_storage.row.SPILLED_REMOTE_MB }}"

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  metaDescription: "Queries Snowflake query history to detect memory spilling to local disk and remote storage degrading query SLA."
  metaTitle: Snowflake Query Memory Spilling to Local and Remote Storage Sentinel with Kestra
  title: Snowflake Query Memory Spilling to Local and Remote Storage Sentinel
  shortDescription: Queries Snowflake query history to detect memory spilling to local disk and remote storage degrading query SLA.
  description: |
    ## How it works
    This workflow executes a JDBC query against `SNOWFLAKE.ACCOUNT_USAGE.QUERY_HISTORY`, auditing queries executed within the last hour where `BYTES_SPILLED_TO_LOCAL_STORAGE` or `BYTES_SPILLED_TO_REMOTE_STORAGE` is greater than zero. When analytical queries execute joins, group-bys, or window functions that exceed warehouse memory, Snowflake first spills intermediate results to local SSD, and then to remote cloud storage (S3/GCS/Azure Blob). Remote spilling creates severe I/O penalties and balloons warehouse credit consumption. Slack is notified when spilling occurs.

    ## What you get
    - Immediate detection of memory-spilling queries draining Snowflake credits.
    - Prevents runaway ETL query execution durations and SLA breaches.
    - Actionable recommendations to resize warehouses or optimize SQL join keys.

    ## Who it's for
    - Data Architects and FinOps Engineers optimizing Snowflake cloud data warehouse spend.
    - Analytics Engineers debugging slow dashboard transformations and DBT models.

    ## Why orchestrate this with Kestra
    - **Native Snowflake JDBC Task**: Direct SQL execution without CLI wrappers or Python scripts.
    - **Continuous Cost Guardrails**: Identify inefficient queries before monthly billing surprises occur.
    - **Automated Incident Escalation**: Dispatches rich query diagnostics directly to Slack.

    ## Prerequisites
    - Snowflake account with access to `SNOWFLAKE.ACCOUNT_USAGE` schema.
    - Secrets `SNOWFLAKE_PASSWORD` and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import the blueprint.
    2. Configure Snowflake account, username, and warehouse.
    3. Run the workflow to inspect recent query memory spilling.

    ## How to extend
    - Automatically suggest warehouse upscaling (e.g. Medium to Large) for recurring spilling queries.
    - Export chronic spilling query shapes to dbt documentation.

    ## Links
    - [Snowflake Query Spilling Documentation](https://docs.snowflake.com/en/user-guide/performance-query-warehouse-spilling)
    - [Kestra Snowflake Plugin](https://kestra.io/plugins/plugin-jdbc-snowflake/io.kestra.plugin.jdbc.snowflake.query)
  tags:
    - Data
    - Cloud
  subTags:
    - ELT & Data Landing
    - Infrastructure Automation
  ee: false
  demo: false
