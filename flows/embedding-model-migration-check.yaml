id: embedding-model-migration-check
namespace: company.team
description: |
  Before switching embedding models, measure how much your retrieval changes.
  The same documents are indexed with the current and the candidate model,
  a fixed set of probe queries runs against both, and the migration is blocked
  when the top-k results overlap less than your threshold.

triggers:
  - id: model_change_webhook
    type: io.kestra.plugin.core.trigger.Webhook
    description: Call this from CI on a pull request that changes your embedding model, so the check runs before the change merges.
    key: embedding-migration-check
  - id: weekly_check
    type: io.kestra.plugin.core.trigger.Schedule
    description: Re-run weekly when the candidate is a moving tag (for example a "latest" model). Shipped disabled.
    disabled: true
    cron: "0 6 * * 1"

inputs:
  - id: document_urls
    type: ARRAY
    itemType: STRING
    defaults:
      - https://raw.githubusercontent.com/kestra-io/kestra/develop/README.md
    description: Markdown or text documents that make up the corpus. Use a representative sample of what your application actually retrieves.
  - id: probe_queries
    type: ARRAY
    itemType: STRING
    defaults:
      - How do I start Kestra locally with Docker?
      - Can tasks run Python or other programming languages?
      - How do triggers react to events from external systems?
      - Which AI and LLM providers are supported?
      - What changed in Kestra 2.0 for loops?
      - How do I version flows in Git and deploy them with CI/CD?
      - What is the No-Code editor?
      - How can I write my own plugin?
      - Where do I report a bug or ask for help?
      - Which license is Kestra released under?
    description: Questions your users really ask. Every query is run against both indexes.
  - id: current_model
    type: STRING
    defaults: all-minilm
    description: The embedding model in production today.
  - id: candidate_model
    type: STRING
    defaults: nomic-embed-text
    description: The embedding model you want to switch to.
  - id: ollama_endpoint
    type: STRING
    defaults: http://localhost:11434
    description: Ollama server that serves both models. Swap the provider blocks for OpenAI, Gemini, or another AI plugin provider to compare hosted models.
  - id: top_k
    type: INT
    defaults: 5
    description: Number of chunks retrieved per query and compared between models.
  - id: min_overlap
    type: FLOAT
    defaults: 0.6
    description: Minimum average top-k overlap (0.0-1.0). Below it, the migration is blocked.
  - id: chunk_chars
    type: INT
    defaults: 600
    description: Approximate chunk size. Paragraphs are packed into chunks up to this many characters.

tasks:
  - id: build_indexes
    type: io.kestra.plugin.core.flow.WorkingDirectory
    description: Chunk the corpus once, then embed the identical chunks with both models so the comparison only reflects the model.
    tasks:
      - id: chunk_documents
        type: io.kestra.plugin.scripts.python.Script
        description: Download the documents and write one file per chunk. Each chunk starts with its id, so search results can be matched across models.
        taskRunner:
          type: io.kestra.plugin.core.runner.Process
        env:
          DOCUMENT_URLS: "{{ inputs.document_urls | toJson }}"
          CHUNK_CHARS: "{{ inputs.chunk_chars }}"
        script: |
          import json
          import os
          import re
          import urllib.request

          limit = int(os.environ["CHUNK_CHARS"])
          os.makedirs("chunks", exist_ok=True)
          count = 0
          for url in json.loads(os.environ["DOCUMENT_URLS"]):
              text = urllib.request.urlopen(url, timeout=60).read().decode("utf-8", "replace")
              text = re.sub(r"<[^>]+>|!\[[^\]]*\]\([^)]*\)", " ", text)
              chunk = ""
              for para in re.split(r"\n\s*\n", text):
                  para = " ".join(para.split())
                  if len(para) < 40:
                      continue
                  if chunk and len(chunk) + len(para) > limit:
                      count += 1
                      with open("chunks/c%04d.txt" % count, "w") as f:
                          f.write("[c%04d] %s" % (count, chunk))
                      chunk = ""
                  chunk = (chunk + " " + para).strip()
              if chunk:
                  count += 1
                  with open("chunks/c%04d.txt" % count, "w") as f:
                      f.write("[c%04d] %s" % (count, chunk))
          if count == 0:
              raise SystemExit("no text found in document_urls")
          print("wrote %d chunks" % count)
          print('::{"outputs":{"chunks":%d}}::' % count)

      - id: index_current
        type: io.kestra.plugin.ai.rag.IngestDocument
        provider:
          type: io.kestra.plugin.ai.provider.Ollama
          endpoint: "{{ inputs.ollama_endpoint }}"
          modelName: "{{ inputs.current_model }}"
        embeddings:
          type: io.kestra.plugin.ai.embeddings.KestraKVStore
          kvName: "{{ flow.id }}-current"
        drop: true
        fromPath: chunks

      - id: index_candidate
        type: io.kestra.plugin.ai.rag.IngestDocument
        provider:
          type: io.kestra.plugin.ai.provider.Ollama
          endpoint: "{{ inputs.ollama_endpoint }}"
          modelName: "{{ inputs.candidate_model }}"
        embeddings:
          type: io.kestra.plugin.ai.embeddings.KestraKVStore
          kvName: "{{ flow.id }}-candidate"
        drop: true
        fromPath: chunks

  - id: probe
    type: io.kestra.plugin.core.flow.Loop
    description: Run every probe query against both indexes in parallel.
    values: "{{ inputs.probe_queries | toJson }}"
    concurrencyLimit: 4
    outputs:
      - id: query
        type: STRING
        value: "{{ item.value }}"
      - id: current
        type: JSON
        value: "{{ outputs.search_current.results | toJson }}"
      - id: candidate
        type: JSON
        value: "{{ outputs.search_candidate.results | toJson }}"
    tasks:
      - id: search_both
        type: io.kestra.plugin.core.flow.Parallel
        tasks:
          - id: search_current
            type: io.kestra.plugin.ai.rag.Search
            provider:
              type: io.kestra.plugin.ai.provider.Ollama
              endpoint: "{{ inputs.ollama_endpoint }}"
              modelName: "{{ inputs.current_model }}"
            embeddings:
              type: io.kestra.plugin.ai.embeddings.KestraKVStore
              kvName: "{{ flow.id }}-current"
            query: "{{ item.value }}"
            maxResults: "{{ inputs.top_k }}"
            minScore: 0
            fetchType: FETCH
          - id: search_candidate
            type: io.kestra.plugin.ai.rag.Search
            provider:
              type: io.kestra.plugin.ai.provider.Ollama
              endpoint: "{{ inputs.ollama_endpoint }}"
              modelName: "{{ inputs.candidate_model }}"
            embeddings:
              type: io.kestra.plugin.ai.embeddings.KestraKVStore
              kvName: "{{ flow.id }}-candidate"
            query: "{{ item.value }}"
            maxResults: "{{ inputs.top_k }}"
            minScore: 0
            fetchType: FETCH

  - id: compare
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: Match chunk ids between the two result lists and score each query. overlap is the share of the top-k both models return; top1_same says whether the best chunk is unchanged.
    inputFiles:
      probes.json: "{{ outputs.probe.outputs | toJson }}"
    fetchType: FETCH
    sql: |
      CREATE TABLE hits AS
        SELECT p.outputs.query AS query, 'current' AS model, r.pos AS rank, regexp_extract(r.hit, '^\[(c\d+)\]', 1) AS chunk
        FROM read_json_auto('{{ workingDir }}/probes.json') p, unnest(p.outputs.current) WITH ORDINALITY AS r(hit, pos)
        UNION ALL
        SELECT p.outputs.query, 'candidate', r.pos, regexp_extract(r.hit, '^\[(c\d+)\]', 1)
        FROM read_json_auto('{{ workingDir }}/probes.json') p, unnest(p.outputs.candidate) WITH ORDINALITY AS r(hit, pos);

      CREATE TABLE per_query AS
        SELECT query,
               round(len(list_intersect(list(chunk) FILTER (WHERE model = 'current'),
                                        list(chunk) FILTER (WHERE model = 'candidate'))) / {{ inputs.top_k }}, 2) AS overlap,
               max(chunk) FILTER (WHERE model = 'current' AND rank = 1)
                 = max(chunk) FILTER (WHERE model = 'candidate' AND rank = 1) AS top1_same,
               string_agg(chunk, ' ' ORDER BY rank) FILTER (WHERE model = 'current') AS current_top,
               string_agg(chunk, ' ' ORDER BY rank) FILTER (WHERE model = 'candidate') AS candidate_top
        FROM hits
        GROUP BY query;

      SELECT round(avg(overlap), 3) AS avg_overlap,
             round(avg(CASE WHEN top1_same THEN 1 ELSE 0 END), 3) AS top1_agreement,
             count(*) AS queries,
             count(*) FILTER (WHERE overlap < {{ inputs.min_overlap }}) AS queries_below_threshold
      FROM per_query;

      SELECT query, overlap, top1_same, current_top, candidate_top
      FROM per_query ORDER BY overlap, query;

  - id: gate
    type: io.kestra.plugin.core.flow.If
    description: Block the migration when the models disagree too much on what to retrieve.
    condition: "{{ outputs.compare.outputs[0].rows[0].avg_overlap < inputs.min_overlap }}"
    then:
      - id: alert_blocked
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "Embedding migration {{ inputs.current_model }} -> {{ inputs.candidate_model }} BLOCKED: average top-{{ inputs.top_k }} overlap {{ outputs.compare.outputs[0].rows[0].avg_overlap }} is below {{ inputs.min_overlap }} (top-1 agreement {{ outputs.compare.outputs[0].rows[0].top1_agreement }}). Queries that change most:\n{% for r in outputs.compare.outputs[1].rows | slice(0, 3) %}- \"{{ r.query }}\": overlap {{ r.overlap }}\n{% endfor %}Re-test these queries with real users before switching. Execution {{ execution.id }}."
          }
      - id: blocked
        type: io.kestra.plugin.core.execution.Exit
        state: FAILED
    else:
      - id: log_passed
        type: io.kestra.plugin.core.log.Log
        message: |
          Embedding migration {{ inputs.current_model }} -> {{ inputs.candidate_model }} passed: average top-{{ inputs.top_k }} overlap {{ outputs.compare.outputs[0].rows[0].avg_overlap }}, top-1 agreement {{ outputs.compare.outputs[0].rows[0].top1_agreement }} over {{ outputs.compare.outputs[0].rows[0].queries }} queries.

errors:
  - id: alert_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "Embedding migration check could not run in execution {{ execution.id }}. Check that both models are available at {{ inputs.ollama_endpoint }} and that the documents can be downloaded."
      }

outputs:
  - id: summary
    type: JSON
    description: Average overlap, top-1 agreement, and the number of queries below the threshold.
    value: "{{ outputs.compare.outputs[0].rows[0] ?? {} }}"
  - id: per_query
    type: JSON
    description: Overlap and the top-k chunk ids from each model for every probe query, most changed first.
    value: "{{ outputs.compare.outputs[1].rows ?? [] }}"

extend:
  title: Check What Changes Before You Switch Embedding Models
  shortDescription: Index the same documents with your current and candidate embedding models, run probe queries against both, and block the migration when top-k results diverge.
  metaTitle: Embedding Model Migration Check with Kestra and Ollama
  metaDescription: Compare current and candidate embedding models on your own documents and probe queries, score top-k overlap, and block risky migrations.
  description: |
    Switching embedding models is one of the riskiest changes in a RAG system: every stored vector is re-computed, and the documents your users get back change in ways no unit test sees. This blueprint measures that change before you ship it. It indexes the same documents with the current and the candidate model through the Kestra AI plugin, runs a fixed set of probe queries against both indexes, and compares the top-k results. When the average overlap falls below your threshold, the migration is blocked and Slack lists the queries that changed the most.

    It runs fully locally with Ollama by default, so you can try it without API keys or cost, and the provider blocks can be swapped for OpenAI, Gemini, Mistral, or any other AI plugin provider.

    ## How it works

    1. `build_indexes` (`WorkingDirectory`) runs three tasks on the same files:
       - `chunk_documents` downloads `document_urls` and writes one file per chunk, each prefixed with its id (`[c0001] ...`)
       - `index_current` and `index_candidate` (`io.kestra.plugin.ai.rag.IngestDocument`) embed the identical chunks with each model into separate `KestraKVStore` indexes
    2. `probe` (`Loop`) runs each probe query against both indexes in parallel with `io.kestra.plugin.ai.rag.Search`.
    3. `compare` (`io.kestra.plugin.jdbc.duckdb.Queries`) matches chunk ids between the two result lists and scores each query:
       - `overlap`: share of the top-k returned by both models
       - `top1_same`: whether the best chunk is unchanged
    4. `gate` (`If`) blocks the migration when the average overlap is below `min_overlap`: Slack gets the score and the three most-changed queries, and the execution ends `FAILED` so a CI job polling it fails too. Otherwise the result is logged.
    5. The `errors` block alerts when the check itself cannot run, for example when a model is not installed.

    ## What you get

    - `summary`: average top-k overlap, top-1 agreement, and the number of queries below the threshold.
    - `per_query`: for every probe query, the overlap and the ranked chunk ids from each model, most changed first, so you know exactly which questions to re-test.
    - A go/no-go gate you can call from CI through the webhook on any pull request that changes the embedding model.

    ## Prerequisites

    - An Ollama server reachable from the worker, with both models pulled (`ollama pull all-minilm`, `ollama pull nomic-embed-text`), or credentials for another AI plugin provider.
    - Python 3 on the worker for `chunk_documents` (standard library only, `Process` task runner).
    - A Slack incoming webhook.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack incoming webhook URL for blocked migrations and failures.

    ### Inputs

    - `document_urls` (ARRAY): documents that make up the test corpus. Defaults to the Kestra README.
    - `probe_queries` (ARRAY): questions your users ask; defaults to ten questions about Kestra.
    - `current_model`, `candidate_model` (STRING): defaults `all-minilm` and `nomic-embed-text`.
    - `ollama_endpoint` (STRING, default `http://localhost:11434`).
    - `top_k` (INT, default 5), `min_overlap` (FLOAT, default 0.6), `chunk_chars` (INT, default 600).

    ### Outputs

    - `summary` (JSON) and `per_query` (JSON), as described above. They are set on passing runs; on a blocked run the same numbers are in the Slack alert and the `compare` task outputs.

    ## Quick start

    1. Start Ollama and pull both models.
    2. Add the `SLACK_WEBHOOK_URL` secret.
    3. Run the flow with the defaults. With the Kestra README, `all-minilm` and `nomic-embed-text` share 54% of their top-5 results and agree on the best chunk for half of the queries, so the default 0.6 threshold blocks the switch.
    4. Replace `document_urls` and `probe_queries` with your own corpus and questions, and call the `embedding-migration-check` webhook from CI.

    ## How to read the result

    Low overlap does not mean the candidate is worse; it means retrieval changes. Use `per_query` to review the changed queries: if the candidate's chunks answer them better, lower the threshold or update your expectations, then migrate. Comparing a model with itself returns an overlap of 1.0, which is a quick way to confirm the setup.

    ## How to extend

    - Compare hosted models: replace the `Ollama` provider with `OpenAI` or `GoogleGemini` in the four AI tasks and add the API key secret.
    - Score answer quality, not only retrieval: add a `ChatCompletion` task per query that answers from each model's chunks and a judge that picks the better answer.
    - Use a real vector store: swap `KestraKVStore` for `PGVector`, `Qdrant`, or `Weaviate` so large corpora fit.

    ## Links

    - [Kestra AI plugin](https://kestra.io/plugins/plugin-ai)
    - [Ollama embedding models](https://ollama.com/search?c=embedding)
    - [DuckDB plugin](https://kestra.io/plugins/plugin-jdbc-duckdb)
    - [Slack plugin](https://kestra.io/plugins/plugin-slack)
    - This blueprint has been created by [ram0verflow](https://github.com/ram0verflow)
  tags:
    - AI
    - Data
  subTags:
    - Testing & Quality
    - CI/CD & Deployment
  ee: false
  demo: false
