id: ray-serve-deployment-health-and-replica-drift-sentinel
namespace: company.ai

description: |
  Audit Ray Serve distributed model deployments, detect crashed worker replicas,
  identify replica scaling drift, and dispatch incident alerts before inference degrades.

inputs:
  - id: ray_dashboard_url
    type: STRING
    defaults: "http://localhost:8265"
    displayName: "Ray Dashboard Base URL"
    description: "HTTP REST API base endpoint of the Ray Dashboard or Serve Agent (default http://localhost:8265)."

  - id: target_application
    type: STRING
    defaults: "*"
    displayName: "Target Application Name"
    description: "Specific Ray Serve application name to monitor, or '*' to audit all deployed applications in the cluster."

  - id: allow_replica_lag
    type: BOOL
    defaults: true
    displayName: "Allow Autoscaling Replica Lag"
    description: "When true, does not treat temporary scaling deficits (active < target) as critical breaches unless replicas are explicitly marked unhealthy."

  - id: fail_on_critical_breach
    type: BOOL
    defaults: false
    displayName: "Fail Flow on Critical Breach"
    description: "When true, terminates workflow execution with a failure state if deployment failure or replica crashes are detected."

  - id: open_github_issue
    type: BOOL
    defaults: false
    displayName: "Open GitHub Issue on Breach"
    description: "When true, automatically opens a GitHub tracking issue for detected model serving degradations."

  - id: github_repository
    type: STRING
    defaults: "company/ai-platform-ops"
    displayName: "GitHub Incident Repository"
    description: "Target repository (owner/repo) where incident issues should be opened."

triggers:
  - id: periodic_serve_audit_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true
    description: "Scheduled health audit of Ray Serve deployments executed every 15 minutes."
    inputs:
      ray_dashboard_url: "http://localhost:8265"
      target_application: "*"
      allow_replica_lag: true
      fail_on_critical_breach: false
      open_github_issue: false
      github_repository: "company/ai-platform-ops"

  - id: post_deployment_webhook
    type: io.kestra.plugin.core.trigger.Webhook
    key: "ray-serve-audit"
    description: "On-demand webhook trigger for post-deployment verification in MLOps and CI/CD pipelines."

tasks:
  - id: check_dashboard_liveness
    type: io.kestra.plugin.core.http.Request
    description: "Verify Ray Dashboard API responsiveness and retrieve Ray version metadata."
    uri: "{{ inputs.ray_dashboard_url }}/api/version"
    method: GET
    headers:
      Content-Type: "application/json"

  - id: get_cluster_status
    type: io.kestra.plugin.core.http.Request
    description: "Retrieve Ray cluster node statuses, active nodes, and failed node counts."
    uri: "{{ inputs.ray_dashboard_url }}/api/cluster_status"
    method: GET
    headers:
      Content-Type: "application/json"

  - id: get_serve_applications
    type: io.kestra.plugin.core.http.Request
    description: "Query Ray Serve applications endpoint for deployment states, replica topologies, and error messages."
    uri: "{{ inputs.ray_dashboard_url }}/api/serve/applications/"
    method: GET
    headers:
      Content-Type: "application/json"

  - id: analyze_serve_deployments
    type: io.kestra.plugin.scripts.python.Script
    description: "Inspect deployment health, compute replica deficits, detect crashed actors, and classify cluster status."
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: python:3.12-slim
    env:
      CLUSTER_JSON: "{{ outputs.get_cluster_status.body }}"
      SERVE_JSON: "{{ outputs.get_serve_applications.body }}"
      TARGET_APP: "{{ inputs.target_application }}"
      ALLOW_LAG: "{{ inputs.allow_replica_lag }}"
    script: |
      import os
      import json
      from kestra import Kestra

      cluster_raw = os.environ.get("CLUSTER_JSON", "{}")
      serve_raw = os.environ.get("SERVE_JSON", "{}")
      target_app = os.environ.get("TARGET_APP", "*").strip()
      allow_lag = os.environ.get("ALLOW_LAG", "true").lower() in ("true", "1", "yes")

      try:
          cluster_data = json.loads(cluster_raw)
      except Exception:
          cluster_data = {}

      try:
          serve_data = json.loads(serve_raw)
      except Exception:
          serve_data = {}

      # Parse cluster health
      cluster_info = cluster_data.get("data", {}).get("cluster_status", {})
      active_nodes = cluster_info.get("active_nodes", 0)
      failed_nodes = cluster_info.get("failed_nodes", 0)

      applications = serve_data.get("applications", {})
      total_apps = len(applications)
      total_deployments = 0
      total_active_replicas = 0
      total_target_replicas = 0
      total_unhealthy_replicas = 0

      crashed_deployments = []
      failed_deployments = []
      deficit_deployments = []

      for app_name, app_info in applications.items():
          if target_app != "*" and app_name != target_app:
              continue

          app_status = app_info.get("status", "UNKNOWN").upper()
          app_message = app_info.get("message", "")
          deployments = app_info.get("deployments", {})

          if app_status == "DEPLOY_FAILED":
              failed_deployments.append({
                  "application": app_name,
                  "deployment": "APP_LEVEL",
                  "status": app_status,
                  "message": app_message or "Application failed to deploy"
              })

          for dep_name, dep_info in deployments.items():
              total_deployments += 1
              dep_status = dep_info.get("status", "UNKNOWN").upper()
              dep_msg = dep_info.get("message", "")
              target_rep = dep_info.get("target_replicas", 0) or 0
              active_rep = dep_info.get("active_replicas", 0) or 0
              unhealthy_rep = dep_info.get("unhealthy_replicas", 0) or 0

              total_target_replicas += target_rep
              total_active_replicas += active_rep
              total_unhealthy_replicas += unhealthy_rep

              if unhealthy_rep > 0 or dep_status == "UNHEALTHY":
                  crashed_deployments.append({
                      "application": app_name,
                      "deployment": dep_name,
                      "status": dep_status,
                      "unhealthy_replicas": unhealthy_rep,
                      "active_replicas": active_rep,
                      "target_replicas": target_rep,
                      "message": dep_msg or "Replicas crashed or unhealthy"
                  })
              elif dep_status in ("DEPLOY_FAILED", "FAILING"):
                  failed_deployments.append({
                      "application": app_name,
                      "deployment": dep_name,
                      "status": dep_status,
                      "message": dep_msg or "Deployment reached terminal failure"
                  })
              elif active_rep < target_rep and not allow_lag:
                  deficit_deployments.append({
                      "application": app_name,
                      "deployment": dep_name,
                      "status": dep_status,
                      "active_replicas": active_rep,
                      "target_replicas": target_rep,
                      "deficit": target_rep - active_rep
                  })

      # Determine verdict
      if failed_nodes > 0:
          verdict = "BREACH_CLUSTER_NODE_DEAD"
      elif crashed_deployments:
          verdict = "BREACH_REPLICA_CRASH"
      elif failed_deployments:
          verdict = "BREACH_DEPLOYMENT_FAILED"
      elif deficit_deployments:
          verdict = "BREACH_REPLICA_DEFICIT"
      else:
          verdict = "HEALTHY"

      all_degraded = crashed_deployments + failed_deployments + deficit_deployments
      degraded_count = len(all_degraded)

      print(f"Audit Summary: apps={total_apps}, deployments={total_deployments}")
      print(f"Replicas: active={total_active_replicas}, target={total_target_replicas}, unhealthy={total_unhealthy_replicas}")
      print(f"Cluster: active_nodes={active_nodes}, failed_nodes={failed_nodes}")
      print(f"Verdict: {verdict} (degraded={degraded_count})")

      Kestra.outputs({
          "verdict": verdict,
          "total_applications": total_apps,
          "total_deployments": total_deployments,
          "total_active_replicas": total_active_replicas,
          "total_target_replicas": total_target_replicas,
          "total_unhealthy_replicas": total_unhealthy_replicas,
          "active_nodes": active_nodes,
          "failed_nodes": failed_nodes,
          "degraded_count": degraded_count,
          "crashed_deployments": crashed_deployments,
          "failed_deployments": failed_deployments,
          "deficit_deployments": deficit_deployments
      })

  - id: route_by_audit_verdict
    type: io.kestra.plugin.core.flow.Switch
    description: "Route alerting and ticket creation workflows based on the Ray Serve health verdict."
    value: "{{ outputs.analyze_serve_deployments.vars.verdict }}"
    cases:
      HEALTHY:
        - id: log_healthy_audit
          type: io.kestra.plugin.core.log.Log
          description: "Record healthy status when all applications, deployments, and worker replicas are running."
          message: >-
            Ray Serve cluster is HEALTHY.
            Applications: {{ outputs.analyze_serve_deployments.vars.total_applications }} |
            Deployments: {{ outputs.analyze_serve_deployments.vars.total_deployments }} |
            Active Replicas: {{ outputs.analyze_serve_deployments.vars.total_active_replicas }}/{{ outputs.analyze_serve_deployments.vars.total_target_replicas }} |
            Active Nodes: {{ outputs.analyze_serve_deployments.vars.active_nodes }}.

      BREACH_REPLICA_CRASH:
        - id: notify_replica_crash_slack
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: "Post high-priority incident alert to Slack when worker replicas have crashed."
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "channel": "#ai-platform-alerts",
              "attachments": [
                {
                  "color": "danger",
                  "title": "🚨 Ray Serve Worker Replica Crash Detected",
                  "text": "Detected *{{ outputs.analyze_serve_deployments.vars.total_unhealthy_replicas }} unhealthy replica(s)* across Ray Serve model deployments on `{{ inputs.ray_dashboard_url }}`.",
                  "fields": [
                    {
                      "title": "Crashed Deployments",
                      "value": "{{ outputs.analyze_serve_deployments.vars.crashed_deployments | json }}",
                      "short": false
                    },
                    {
                      "title": "Active Replicas",
                      "value": "{{ outputs.analyze_serve_deployments.vars.total_active_replicas }} / {{ outputs.analyze_serve_deployments.vars.total_target_replicas }}",
                      "short": true
                    },
                    {
                      "title": "Active Nodes",
                      "value": "{{ outputs.analyze_serve_deployments.vars.active_nodes }}",
                      "short": true
                    }
                  ],
                  "footer": "Kestra MLOps Sentinel • Ray Serve"
                }
              ]
            }

        - id: conditional_github_replica_issue
          type: io.kestra.plugin.core.flow.If
          description: "File a GitHub issue for the replica crash incident when enabled."
          condition: "{{ inputs.open_github_issue == true }}"
          then:
            - id: create_replica_crash_github_issue
              type: io.kestra.plugin.github.issues.Create
              description: "Open incident ticket on GitHub tracking the Ray Serve worker replica crash."
              oauthToken: "{{ secret('GITHUB_TOKEN') }}"
              repository: "{{ inputs.github_repository }}"
              title: "Incident: Ray Serve Worker Replica Crash ({{ outputs.analyze_serve_deployments.vars.total_unhealthy_replicas }} unhealthy replicas)"
              body: |
                ## Incident: Ray Serve Worker Replica Crash

                The automated Kestra surveillance flow detected crashed or unhealthy worker replicas in the Ray Serve cluster.

                - **Ray Dashboard**: `{{ inputs.ray_dashboard_url }}`
                - **Target Application**: `{{ inputs.target_application }}`
                - **Total Unhealthy Replicas**: `{{ outputs.analyze_serve_deployments.vars.total_unhealthy_replicas }}`
                - **Active / Target Replicas**: `{{ outputs.analyze_serve_deployments.vars.total_active_replicas }} / {{ outputs.analyze_serve_deployments.vars.total_target_replicas }}`

                ### Degraded Deployments
                ```json
                {{ outputs.analyze_serve_deployments.vars.crashed_deployments | json }}
                ```

                ### Diagnostic Checklist
                1. Inspect Ray worker logs for GPU CUDA Out of Memory (OOM) or actor death tracebacks:
                   ```bash
                   ray logs --actor-name <ActorName>
                   ```
                2. Check node memory headroom and CPU/GPU utilization in Ray Dashboard.
                3. Verify model checkpoint accessibility and storage mounts.
              labels:
                - incident
                - ray-serve
                - mlops
                - gpu

        - id: conditional_fail_on_replica_crash
          type: io.kestra.plugin.core.flow.If
          description: "Fail execution if the operator configured strict termination."
          condition: "{{ inputs.fail_on_critical_breach == true }}"
          then:
            - id: fail_replica_crash
              type: io.kestra.plugin.core.execution.Fail
              description: "Terminate workflow run with failure due to crashed model replicas."

      BREACH_DEPLOYMENT_FAILED:
        - id: notify_deployment_failed_slack
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: "Dispatch Slack alert when a Ray Serve application deployment has failed."
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "channel": "#ai-platform-alerts",
              "attachments": [
                {
                  "color": "danger",
                  "title": "💥 Ray Serve Application Deployment Failed",
                  "text": "One or more Ray Serve applications reached a terminal failure state on `{{ inputs.ray_dashboard_url }}`.",
                  "fields": [
                    {
                      "title": "Failed Deployments",
                      "value": "{{ outputs.analyze_serve_deployments.vars.failed_deployments | json }}",
                      "short": false
                    }
                  ],
                  "footer": "Kestra MLOps Sentinel • Ray Serve"
                }
              ]
            }

        - id: conditional_fail_on_deployment_failure
          type: io.kestra.plugin.core.flow.If
          condition: "{{ inputs.fail_on_critical_breach == true }}"
          then:
            - id: fail_deployment_failure
              type: io.kestra.plugin.core.execution.Fail
              description: "Terminate workflow run with failure due to application deployment failure."

      BREACH_REPLICA_DEFICIT:
        - id: notify_replica_deficit_slack
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: "Dispatch warning alert to Slack when active replicas are below target capacity."
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "channel": "#ai-platform-alerts",
              "attachments": [
                {
                  "color": "warning",
                  "title": "⚠️ Ray Serve Replica Scaling Deficit",
                  "text": "Ray Serve deployments have active replica counts lower than target allocations on `{{ inputs.ray_dashboard_url }}`.",
                  "fields": [
                    {
                      "title": "Deficit Deployments",
                      "value": "{{ outputs.analyze_serve_deployments.vars.deficit_deployments | json }}",
                      "short": false
                    },
                    {
                      "title": "Active / Target Replicas",
                      "value": "{{ outputs.analyze_serve_deployments.vars.total_active_replicas }} / {{ outputs.analyze_serve_deployments.vars.total_target_replicas }}",
                      "short": true
                    }
                  ],
                  "footer": "Kestra MLOps Sentinel • Ray Serve"
                }
              ]
            }

      BREACH_CLUSTER_NODE_DEAD:
        - id: notify_dead_node_slack
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: "Alert Slack when dead or failed Ray cluster nodes are detected."
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "channel": "#ai-platform-alerts",
              "attachments": [
                {
                  "color": "danger",
                  "title": "🚨 Ray Cluster Node Failure",
                  "text": "Ray cluster at `{{ inputs.ray_dashboard_url }}` has *{{ outputs.analyze_serve_deployments.vars.failed_nodes }} failed node(s)*! Worker replicas on these nodes may be evicted or rescheduling.",
                  "footer": "Kestra MLOps Sentinel • Ray Cluster"
                }
              ]
            }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: "Notify Slack if Ray Dashboard API is unreachable or returns a server error."
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "#ai-platform-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "💥 Ray Serve Sentinel Execution Failed",
            "text": "Failed to query Ray Dashboard API at `{{ inputs.ray_dashboard_url }}`. Check network connectivity, dashboard service, and credentials.",
            "footer": "Kestra Execution Failure Guard"
          }
        ]
      }

outputs:
  - id: verdict
    type: STRING
    description: "Audit classification verdict (HEALTHY, BREACH_REPLICA_CRASH, BREACH_DEPLOYMENT_FAILED, BREACH_REPLICA_DEFICIT, BREACH_CLUSTER_NODE_DEAD)."
    value: "{{ outputs.analyze_serve_deployments.vars.verdict }}"

  - id: total_applications
    type: INT
    description: "Total Ray Serve applications inspected."
    value: "{{ outputs.analyze_serve_deployments.vars.total_applications }}"

  - id: total_deployments
    type: INT
    description: "Total model deployments inspected across audited applications."
    value: "{{ outputs.analyze_serve_deployments.vars.total_deployments }}"

  - id: total_active_replicas
    type: INT
    description: "Total healthy active model serving replicas."
    value: "{{ outputs.analyze_serve_deployments.vars.total_active_replicas }}"

  - id: total_unhealthy_replicas
    type: INT
    description: "Total crashed or unhealthy worker replicas detected."
    value: "{{ outputs.analyze_serve_deployments.vars.total_unhealthy_replicas }}"

  - id: degraded_count
    type: INT
    description: "Total count of degraded deployments across all failure categories."
    value: "{{ outputs.analyze_serve_deployments.vars.degraded_count }}"

extend:
  title: Ray Serve Model Deployment Health & Replica Drift Sentinel
  metaTitle: Ray Serve Model Deployment Health & Replica Drift Sentinel | Kestra
  shortDescription: Audit Ray Serve distributed model deployments, detect crashed worker replicas, identify replica scaling lag, and alert on deployment failures.
  metaDescription: Audit Ray Serve distributed model deployments, detect crashed worker replicas, identify replica capacity drift, and dispatch incident alerts via Kestra.
  description: |
    Ensure high availability and fault isolation for distributed AI inference clusters powered by Ray Serve.
    This workflow regularly queries the Ray Dashboard and Serve REST APIs to audit application health,
    detect crashed worker replicas (e.g. CUDA Out of Memory or unhandled actor exceptions), identify
    autoscaling replica deficits, and dispatch structured incident alerts to Slack and GitHub.

    ## How it works

    1. **Dashboard Liveness Probe**: Issues an HTTP `GET /api/version` call to verify that the Ray Dashboard and Serve Agent are responsive.
    2. **Cluster Topology Audit**: Issues `GET /api/cluster_status` to evaluate active vs failed Ray cluster worker nodes.
    3. **Application & Deployment Inspection**: Calls `GET /api/serve/applications/` to retrieve the real-time status of all deployed applications, target replica counts, active replica counts, unhealthy replica counts, and deployment messages.
    4. **Dockerized Diagnostic Analysis**: Runs a Python analytics container that filters deployments by target application, correlates active versus target replica allocations, extracts actor crash tracebacks, and classifies cluster state.
    5. **Multi-Verdict Incident Routing**: Evaluates the analysis verdict (`HEALTHY`, `BREACH_REPLICA_CRASH`, `BREACH_DEPLOYMENT_FAILED`, `BREACH_REPLICA_DEFICIT`, or `BREACH_CLUSTER_NODE_DEAD`).
    6. **Automated Notification & Escalation**: Dispatches rich diagnostic cards to Slack with exact deployment names and replica deficit counts, optionally files a GitHub tracking issue, and terminates with execution failure if strict mode is enabled.

    ## What you get

    - Early detection of silent GPU CUDA OOM crashes and actor deadlocks before end users experience latency spikes.
    - Continuous validation of replica target capacity across multi-application Ray clusters.
    - Automated GitHub incident ticket generation with complete deployment diagnostics and runbook steps.
    - Clean separation of temporary autoscaling delays from true replica crash events.

    ## Who it's for

    - MLOps Engineers and AI Platform Teams running production model inference on Ray Serve.
    - Site Reliability Engineers (SREs) managing distributed GPU clusters and LLM serving infrastructure.
    - Data Scientists needing post-deployment verification for new model rollouts.

    ## Why orchestrate this with Kestra

    - **Declarative Observability**: Replaces fragile custom bash health checks with structured, auditable YAML orchestration.
    - **Flexible Event & Cron Triggers**: Run recurring background surveillance every 15 minutes or trigger instantly from CI/CD deployment pipelines via Webhook.
    - **Native Secret Management**: Injects webhook tokens and GitHub credentials securely without hard-coding tokens in scripts.
    - **Full Execution Auditability**: Stores complete JSON payloads and replica topologies for historical trend analysis.

    ## Prerequisites

    - A running Ray Serve cluster with HTTP REST API access to the Ray Dashboard on port 8265.
    - Docker container runtime enabled on the Kestra worker to run the Python analytics step.
    - Slack incoming webhook URL for alerting.
    - Optional: GitHub Personal Access Token with `issues:write` permissions if issue filing is enabled.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL for posting diagnostic incident cards (required).
    - `GITHUB_TOKEN`: GitHub Personal Access Token for creating tracking issues (required only if `open_github_issue: true`).

    ## Quick start

    1. Configure `SLACK_WEBHOOK_URL` in your Kestra namespace secrets.
    2. Import this blueprint into your Kestra instance.
    3. Run a test execution pointing to your Ray Dashboard endpoint (`http://<ray-host>:8265`).
    4. Verify execution outputs in the Kestra UI, then activate `periodic_serve_audit_schedule` to enable 15-minute surveillance.

    ## How to extend

    - **Automated Rollback Subflow**: Integrate `io.kestra.plugin.core.flow.Subflow` to automatically redeploy the previous stable model checkpoint when `BREACH_DEPLOYMENT_FAILED` is detected.
    - **PagerDuty Escalation**: Add an `io.kestra.plugin.pagerduty.Trigger` in the `BREACH_REPLICA_CRASH` branch for high-priority on-call paging during production outages.
    - **Kubernetes Pod Inspection**: Chain `io.kestra.plugin.kubernetes.pod.List` to inspect underlying Ray worker pods and describe Kubernetes termination reasons.

    ## Links

    - [Kestra HTTP Plugin Documentation](https://kestra.io/plugins/plugin-core/io.kestra.plugin.core.http.request)
    - [Kestra Python Script Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Docker Task Runner](https://kestra.io/plugins/plugin-scripts-docker)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
    - [Ray Serve Architecture & REST API](https://docs.ray.io/en/latest/serve/index.html)
    - [Ray Dashboard & Monitoring Documentation](https://docs.ray.io/en/latest/ray-observability/getting-started.html)
  tags:
    - AI
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - Day 2 Operations
    - Incident Response
  ee: false
  demo: false
