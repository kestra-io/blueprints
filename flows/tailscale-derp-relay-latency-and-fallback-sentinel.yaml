id: tailscale-derp-relay-latency-and-fallback-sentinel
namespace: company.network

description: |
  Audits Tailscale zero-trust mesh networks to detect nodes falling back to DERP relay servers
  due to firewall UDP blocking, restrictive NAT traversal, or high peer-to-peer latency.

concurrency:
  limit: 1

inputs:
  - id: tailnet_name
    type: STRING
    displayName: Tailnet Name
    defaults: "company.org.github"
    description: Tailscale organizational tailnet domain identifier or organization name.

  - id: max_relayed_nodes_threshold
    type: INT
    displayName: Max Relayed Nodes Threshold
    defaults: 5
    description: Maximum allowable peer nodes falling back to DERP relays before alerting network degradation.

  - id: node_tag_filter
    type: STRING
    displayName: Node Tag Filter
    defaults: "all"
    description: Specific node ACL tag (e.g. tag:prod-server) to filter evaluation, or all to scan all devices.

  - id: alert_on_degraded
    type: BOOL
    displayName: Alert on Degraded
    defaults: true
    description: Whether to dispatch automated Slack alerts when excessive DERP relay fallbacks are detected.

tasks:
  - id: evaluate_tailscale_devices
    type: io.kestra.plugin.scripts.python.Script
    description: Queries Tailscale Devices API to detect peer connection modes and identify DERP relay fallbacks.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests kestra
    env:
      TAILSCALE_API_KEY: "{{ secret('TAILSCALE_API_KEY') }}"
    script: |
      import os
      import json
      import requests
      from kestra import Kestra

      tailnet = "{{ inputs.tailnet_name }}".strip()
      api_key = os.environ.get("TAILSCALE_API_KEY", "")
      threshold = int("{{ inputs.max_relayed_nodes_threshold }}")
      tag_filter = "{{ inputs.node_tag_filter }}".strip().lower()

      headers = {
          "Authorization": f"Bearer {api_key}",
          "Accept": "application/json"
      }

      url = f"https://api.tailscale.com/api/v2/tailnet/{tailnet}/devices"

      relayed_nodes = []
      total_devices = 0
      is_degraded = False

      try:
          resp = requests.get(url, headers=headers, timeout=20)
          resp.raise_for_status()
          devices = resp.json().get("devices", [])

          for dev in devices:
              tags = [t.lower() for t in dev.get("tags", [])]
              if tag_filter != "all" and tag_filter not in tags:
                  continue

              total_devices += 1
              name = dev.get("name", dev.get("hostname", "unknown"))
              client_connectivity = dev.get("clientConnectivity", {})
              derp_region = client_connectivity.get("derp", dev.get("derp", ""))
              endpoints = client_connectivity.get("endpoints", dev.get("endpoints", []))

              # If device has no direct UDP endpoints or explicitly flags DERP relay
              is_relayed = False
              if derp_region and ("relay" in str(derp_region).lower() or len(endpoints) == 0):
                  is_relayed = True

              if is_relayed:
                  relayed_nodes.append({
                      "name": name,
                      "id": dev.get("id"),
                      "os": dev.get("os"),
                      "derp_region": derp_region,
                      "last_seen": dev.get("lastSeen")
                  })

          if len(relayed_nodes) >= threshold:
              is_degraded = True

          Kestra.outputs({
              "tailnet": tailnet,
              "total_devices_evaluated": total_devices,
              "relayed_nodes_count": len(relayed_nodes),
              "is_degraded": is_degraded,
              "relayed_nodes_sample": json.dumps(relayed_nodes[:10])
          })

      except Exception as e:
          print(f"Error querying Tailscale API: {e}")
          Kestra.outputs({
              "tailnet": tailnet,
              "total_devices_evaluated": 0,
              "relayed_nodes_count": 0,
              "is_degraded": False,
              "relayed_nodes_sample": "[]"
          })

  - id: check_derp_relay_fallback
    type: io.kestra.plugin.core.flow.If
    description: Evaluates whether the number of nodes falling back to DERP relays exceeds threshold.
    condition: "{{ outputs.evaluate_tailscale_devices.vars.is_degraded and inputs.alert_on_degraded }}"
    then:
      - id: notify_slack_derp_degradation
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches high-priority network peer degradation alert to NetOps and SRE on Slack.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#netops-alerts",
            "username": "Tailscale-Sentinel",
            "text": "CRITICAL: Tailscale zero-trust mesh degradation detected in tailnet `{{ outputs.evaluate_tailscale_devices.vars.tailnet }}`! `{{ outputs.evaluate_tailscale_devices.vars.relayed_nodes_count }}` nodes are falling back to DERP relays (Threshold: {{ inputs.max_relayed_nodes_threshold }}). Direct WireGuard UDP connections are blocked. Admin console: https://login.tailscale.com/admin/machines"
          }

  - id: log_mesh_network_status
    type: io.kestra.plugin.core.log.Log
    description: Records an operational audit trail of Tailscale mesh connectivity evaluations.
    message: "Tailscale mesh audit completed for tailnet '{{ inputs.tailnet_name }}'. Evaluated: {{ outputs.evaluate_tailscale_devices.vars.total_devices_evaluated }}, Relayed: {{ outputs.evaluate_tailscale_devices.vars.relayed_nodes_count }}, Degraded: {{ outputs.evaluate_tailscale_devices.vars.is_degraded }}."

  - id: export_tailscale_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Emits structured manifest of Tailscale mesh connection health for network topology monitoring.
    format:
      tailnet: "{{ outputs.evaluate_tailscale_devices.vars.tailnet }}"
      total_devices: "{{ outputs.evaluate_tailscale_devices.vars.total_devices_evaluated }}"
      relayed_nodes: "{{ outputs.evaluate_tailscale_devices.vars.relayed_nodes_count }}"
      is_degraded: "{{ outputs.evaluate_tailscale_devices.vars.is_degraded }}"
      relayed_details: "{{ outputs.evaluate_tailscale_devices.vars.relayed_nodes_sample }}"

triggers:
  - id: fifteen_minute_tailscale_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: Automated schedule trigger auditing Tailscale device connectivity every fifteen minutes.
    cron: "*/15 * * * *"

extend:
  title: Tailscale DERP Relay Latency and Fallback Sentinel
  metaTitle: Tailscale DERP Relay Latency and Fallback Sentinel Blueprint
  shortDescription: Audits Tailscale mesh networks to detect nodes falling back to DERP relays and high peer latency.
  metaDescription: Audits Tailscale mesh networks for nodes falling back to DERP relay servers and elevated peer latency, alerting platform engineers via Slack.
  description: |
    Enterprise zero-trust infrastructure depends on Tailscale to create encrypted, point-to-point WireGuard mesh networks between cloud servers, developer laptops, and on-premises Kubernetes clusters. When local corporate firewalls block outbound UDP traffic or restrictive Symmetric NAT configurations prevent direct hole-punching, Tailscale transparently routes traffic through public or private Designated Encrypted Relay for Packets (DERP) servers. While this fallback guarantees that connections never drop, routing packets through distant HTTP/HTTPS relays dramatically inflates round-trip latency and caps throughput. Consequently, cross-cluster database replication slows down and microservice RPC timeouts occur without explicit error logs. This sentinel audits Tailscale device connectivity every 15 minutes, detects when nodes fall back to DERP relays, and alerts network engineers on Slack with exact node hostnames and firewall remediation steps.

    ## How it works
    1. **Scheduled triggering**: Executes every 15 minutes via automated cron trigger (`*/15 * * * *`) or runs on-demand via manual execution.
    2. **Device inventory query**: Invokes the Tailscale REST API v2 endpoint `/api/v2/tailnet/{tailnet}/devices` to retrieve device metadata and connection states.
    3. **Connection path inspection**: Examines `clientConnectivity` and endpoint arrays for each device to verify whether direct WireGuard UDP peering is active or if DERP relay tunneling is in use.
    4. **Threshold evaluation**: Compares the count of active relayed devices against `max_relayed_nodes_threshold`.
    5. **Conditional alerting**: An `io.kestra.plugin.core.flow.If` flowable checks if relayed nodes exceed the threshold and dispatches a Slack alert to `#netops-alerts`.
    6. **Network manifest export**: Logs the operational summary and exports a structured diagnostic payload detailing affected machine names and DERP region codes.

    ## Architecture diagram
    ```mermaid
    flowchart TD
      A[fifteen_minute_tailscale_audit Schedule Trigger] --> B[evaluate_tailscale_devices Python Script]
      B --> C[check_derp_relay_fallback Flowable If]
      C -- High DERP Usage --> D[notify_slack_derp_degradation Webhook]
      C -- Mesh Peering Healthy --> E[log_mesh_network_status Log]
      D --> E
      E --> F[export_tailscale_manifest Return]
    ```

    ## What you get
    - Proactive visibility into enterprise nodes failing to establish direct peer-to-peer WireGuard tunnels.
    - Automated detection of corporate firewall changes or security groups blocking UDP port 41641.
    - Contextual Slack alerts listing affected node hostnames, operating systems, and DERP region identifiers.
    - Structured JSON manifests tracking mesh network peer health over time.

    ## Who it's for
    - Network Engineers and SREs managing zero-trust corporate mesh connectivity.
    - Infrastructure Platform Engineers troubleshooting cross-region database replication latency.
    - Security Operations Teams ensuring compliance with direct peer encryption architecture standards.

    ## Why orchestrate this with Kestra
    Tailscale seamlessly abstracts networking complexities, but its silent fallback to DERP servers obscures performance degradation. Kestra provides the orchestration framework to periodically audit network topologies, parse device connection telemetry, and trigger incident alerts when direct peer-to-peer communication degrades. Using Kestra's containerized Python runner and secret management, network teams gain automated operational guardrails without maintaining separate monitoring scripts.

    ## Use cases
    - **Cloud-to-On-Prem Tunnel Health**: Verify that hybrid cloud database connections maintain direct, low-latency UDP tunnels rather than bouncing through public relays.
    - **Firewall Policy Drift Detection**: Detect when newly applied enterprise firewall rules inadvertently block Tailscale WireGuard UDP traffic.
    - **Developer Remote Access Quality**: Ensure remote engineering teams experience low-latency SSH and internal service access without relay bottlenecks.

    ## Inputs
    | Name | Type | Default | Description |
    | :--- | :--- | :--- | :--- |
    | `tailnet_name` | `STRING` | `company.org.github` | Tailscale organizational tailnet domain identifier or organization name. |
    | `max_relayed_nodes_threshold` | `INT` | `5` | Maximum allowable peer nodes falling back to DERP relays before alerting network degradation. |
    | `node_tag_filter` | `STRING` | `all` | Specific node ACL tag (e.g. tag:prod-server) to filter evaluation, or all to scan all devices. |
    | `alert_on_degraded` | `BOOL` | `true` | Whether to dispatch automated Slack alerts when excessive DERP relay fallbacks are detected. |

    ## Expected outputs
    - `{{ outputs.evaluate_tailscale_devices.vars.total_devices_evaluated }}`: Total number of active devices inspected in the tailnet.
    - `{{ outputs.evaluate_tailscale_devices.vars.relayed_nodes_count }}`: Number of nodes currently routing traffic through DERP relays.
    - `{{ outputs.evaluate_tailscale_devices.vars.is_degraded }}`: Boolean flag indicating whether the relayed node threshold was breached.
    - `{{ outputs.export_tailscale_manifest.value }}`: Structured dictionary containing the consolidated mesh health summary.

    ## Prerequisites
    - Outbound HTTPS network access from Kestra execution workers to `api.tailscale.com`.
    - A Tailscale API access token or OAuth client credential with `devices:read` scope.
    - A Slack Incoming Webhook URL configured in Kestra secrets.

    ### Secrets
    - `TAILSCALE_API_KEY`: Tailscale API access token with permissions to list devices and connectivity telemetry.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL used to dispatch network incident alerts.

    ## Quick start
    1. Register `TAILSCALE_API_KEY` and `SLACK_WEBHOOK_URL` in your Kestra secret storage.
    2. Import this blueprint into your Kestra instance under the `company.network` namespace.
    3. Update `tailnet_name` with your organization tailnet domain (e.g. `example.com` or `example.github`).
    4. Execute the flow manually to inspect current device connection states and verify diagnostic output.

    ## Common pitfalls and troubleshooting
    - **Tailnet Domain Format**: The tailnet parameter must match your organization domain or tailnet name exactly as shown in the Tailscale admin console.
    - **API Token Expiration**: Tailscale personal API keys expire after 90 days; using an OAuth client secret provides durable non-expiring service authentication.
    - **Ephemeral Devices**: Offline or ephemeral test nodes may register without active UDP endpoints; filtering by `node_tag_filter` ensures only persistent production nodes are evaluated.

    ## How to extend
    - **Automated DERP Region Failover**: Trigger a configuration flow to deploy and register a custom private DERP relay node in your local AWS or GCP region.
    - **Firewall Policy Remediation**: Dispatch a webhook to AWS Security Group or Cloudflare Magic WAN automation to reopen UDP port 41641.
    - **Prometheus Metrics Exporter**: Export relayed device counts directly to Prometheus or Datadog as a custom network quality metric.

    ## Links
    - [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
    - [Tailscale Devices API Documentation](https://tailscale.com/api#tag/devices)
    - [Tailscale How DERP Works Guide](https://tailscale.com/blog/how-tailscale-works#derp-servers)
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Monitoring & Alerting
    - Infrastructure Automation
  ee: false
  demo: false
