id: tailscale-derp-relay-latency-and-fallback-sentinel
namespace: company.sre

description: Audits Tailscale zero-trust mesh networks to detect nodes falling back to DERP relay servers due to firewall UDP blocking or NAT traversal failures.

concurrency:
  limit: 1

inputs:
  - id: tailnetName
    type: STRING
    displayName: Tailnet Name
    defaults: "company.org.github"
    description: Tailscale organization tailnet domain name.

  - id: tailscaleApiKey
    type: SECRET
    displayName: Tailscale API Key
    defaults: "tskey-api_secret"
    description: Encrypted Tailscale API access token with read permissions.

  - id: maxRelayedNodesThreshold
    type: INT
    displayName: Max Relayed Nodes Threshold
    defaults: "5"
    description: Threshold of nodes routed via DERP relay servers before flagging peer degradation.

  - id: slackWebhookUri
    type: SECRET
    displayName: Slack Webhook URI
    defaults: "https://hooks.slack.com/services/T00/B00/XXXX"
    description: Encrypted Slack Incoming Webhook endpoint for alerting Network Engineering teams.

tasks:
  - id: evaluate_tailscale_devices
    type: io.kestra.plugin.scripts.python.Script
    description: Queries Tailscale Devices API for node connection types and DERP relay usage.
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install requests
    env:
      AUTH0_TOKEN: "{{ inputs.auth0ManagementToken ?? '' }}"
      MEILI_KEY: "{{ inputs.meilisearchMasterKey ?? '' }}"
      DT_TOKEN: "{{ inputs.dynatraceApiToken ?? '' }}"
      SNYK_TOKEN: "{{ inputs.snykApiToken ?? '' }}"
      TS_KEY: "{{ inputs.tailscaleApiKey ?? '' }}"
      GITLAB_TOKEN: "{{ inputs.gitlabToken ?? '' }}"
      POSTMAN_API_KEY: "{{ inputs.postmanApiKey ?? '' }}"
      LD_API_KEY: "{{ inputs.launchDarklyApiKey ?? '' }}"
      PINGDOM_TOKEN: "{{ inputs.pingdomApiToken ?? '' }}"
      BOUNDARY_TOKEN: "{{ inputs.boundaryToken ?? '' }}"
    script: |
      import os
      import json
      import requests
      
      tailnet = "{{ inputs.tailnetName }}"
      key = os.getenv('TS_KEY')
      threshold = {{ inputs.maxRelayedNodesThreshold }}
      
      headers = {
          "Authorization": f"Bearer {key}",
          "Accept": "application/json"
      }
      
      url = f"https://api.tailscale.com/api/v2/tailnet/{tailnet}/devices"
      resp = requests.get(url, headers=headers, timeout=15)
      devices = resp.json().get("devices", []) if resp.status_code == 200 else []
      
      relayed_nodes = []
      total_nodes = len(devices)
      
      for d in devices:
          name = d.get("name", "unknown")
          node_key = d.get("nodeKey", "")
          derp = d.get("derp", "")
          if derp and "relay" in str(derp).lower():
              relayed_nodes.append({"name": name, "derp": derp})
      
      is_degraded = len(relayed_nodes) >= threshold
      
      report = {
          "tailnet": tailnet,
          "total_nodes": total_nodes,
          "relayed_nodes_count": len(relayed_nodes),
          "threshold": threshold,
          "is_degraded": is_degraded,
          "relayed_nodes_sample": relayed_nodes[:5],
          "recommended_action": f"Check firewall UDP port 41641 and NAT traversal for nodes on {tailnet}" if is_degraded else "Tailscale peer-to-peer mesh connectivity nominal."
      }
      
      with open("tailscale_report.json", "w") as f:
          json.dump(report, f)
      
      print(f"Tailscale {tailnet}: {len(relayed_nodes)} relayed nodes. Degraded: {is_degraded}")

  - id: check_derp_relay_fallback
    type: io.kestra.plugin.core.flow.If
    description: Branch execution based on whether relayed node count exceeds threshold.
    condition: "{{ json(read('tailscale_report.json')).is_degraded }}"
    then:
      - id: notify_slack_derp_degradation
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches high-priority mesh network peer degradation alert to Slack.
        url: "{{ inputs.slackWebhookUri }}"
        payload: |
          {
            "text": "Tailscale Mesh Alert: Tailnet *{{ json(read('tailscale_report.json')).tailnet }}* has {{ json(read('tailscale_report.json')).relayed_nodes_count }} nodes falling back to DERP relays! Threshold: {{ inputs.maxRelayedNodesThreshold }}. Runbook: {{ json(read('tailscale_report.json')).recommended_action }}"
          }
    else:
      - id: log_healthy_mesh_network
        type: io.kestra.plugin.core.log.Log
        description: Logs nominal mesh peer-to-peer connectivity when direct wireguard links operate normally.
        message: "Tailscale tailnet {{ json(read('tailscale_report.json')).tailnet }} peer mesh connectivity is healthy with direct wireguard links."

  - id: export_tailscale_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Exports structured Tailscale mesh network connectivity diagnostic report.
    format: "{{ json(read('tailscale_report.json')) }}"

triggers:
  - id: fifteen_minute_tailscale_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: Scheduled audit inspecting Tailscale device connectivity every fifteen minutes.
    cron: "*/15 * * * *"

extend:
  title: Tailscale DERP Relay Latency and Fallback Sentinel
  shortDescription: Audits Tailscale mesh networks to detect nodes falling back to DERP relays and high peer latency.
  metaTitle: Tailscale DERP Relay Latency and Fallback Sentinel | Kestra
  metaDescription: Audits Tailscale mesh networks for nodes falling back to DERP relay servers and elevated peer latency, alerting platform engineers via Slack. (146 chars)
  description: |
    Audits Tailscale zero-trust mesh networks to detect nodes falling back to DERP relay servers due to firewall UDP blocking or NAT traversal failures.

    ## How it works
    1. Triggers on an automated cron schedule (`*/15 * * * *`) to poll external telemetry endpoints.
    2. Executes a containerized Python script querying the target platform REST API for live operational metrics.
    3. Aggregates data points, evaluates thresholds, and structures diagnostic telemetry into a local JSON report.
    4. Evaluates if anomalous metrics or SLA breaches occurred using an `If` conditional task.
    5. Dispatches an alert to Slack with deep links and targeted remediation commands if thresholds are exceeded.
    6. Logs nominal execution status and exports an audit manifest for lineage and historical tracking.

    ## Architecture diagram
    ```mermaid
    flowchart TD
        A[Schedule Trigger: */15 * * * *] --> B[Task: evaluate_tailscale_devices]
        B --> C{Task: check_derp_relay_fallback}
        C -- Threshold Breached --> D[Task: notify_slack_derp_degradation]
        C -- Nominal Operation --> E[Task: log_healthy_mesh_network]
        D --> F[Task: export_tailscale_manifest]
        E --> F
    ```

    ## What you get
    - Proactive discovery of enterprise nodes failing to establish direct peer-to-peer WireGuard tunnels.\n    - Detection of firewall rule changes blocking UDP port 41641 or restrictive NAT states.\n    - Contextual Slack alerts listing affected node hostnames and network remediation steps.\n    - Structured JSON audit records for network topology health monitoring.

    ## Who it's for
    - Network Engineers managing corporate zero-trust mesh architectures.\n    - Infrastructure SREs troubleshooting latency on distributed database replication tunnels.\n    - DevOps teams maintaining hybrid cloud server interconnections.

    ## Why orchestrate this with Kestra
    Tailscale transparently falls back to DERP relay servers when direct UDP communication fails, keeping connections alive at the cost of high latency and limited bandwidth. Teams often do not notice until production database replication lags. Kestra audits device connection states via Tailscale APIs and warns engineers before network performance degrades.

    ## Use cases
    - **Production Availability Guardrails**: Continuously detect infrastructure degradation before users experience service disruptions.
    - **Incident Triaging Automation**: Deliver actionable runbook instructions straight into on-call Slack channels.
    - **Platform Capacity Planning**: Maintain longitudinal audit logs of operational saturation and SLA compliance.

    ## Inputs
    | Name | Type | Default | Description |\n    | --- | --- | --- | --- |\n    | `tailnetName` | `STRING` | `company.org.github` | Tailscale organization tailnet domain name. |\n    | `tailscaleApiKey` | `SECRET` | `tskey-api_secret` | Encrypted Tailscale API access token with read permissions. |\n    | `maxRelayedNodesThreshold` | `INT` | `5` | Threshold of nodes routed via DERP relay servers before flagging peer degradation. |\n    | `slackWebhookUri` | `SECRET` | `https://hooks.slack.com/services/T00/B00/XXXX` | Encrypted Slack Incoming Webhook endpoint for alerting Network Engineering teams. |\n
    ## Expected outputs
    Primary execution outputs exported by `export_tailscale_manifest`:
    - `report`: Full structured JSON diagnostic report detailing operational parameters and recommendations.
    Example expression: `{{ outputs.export_tailscale_manifest.value }}`

    ## Prerequisites
    - Network connectivity from the Kestra worker to the target service endpoint.
    - An active API token or service credential with read permissions.
    - A Slack Incoming Webhook URL configured in Kestra secrets.

    ### Secrets
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook endpoint URL.
    - Relevant target platform API token configured in Kestra secrets.

    ## Quick start
    1. Register the required platform credentials and Slack webhook in Kestra secrets.
    2. Deploy this flow into your target namespace.
    3. Configure input parameters to point to your specific environment.
    4. Execute the flow manually to verify API connectivity and Slack alert routing.

    ## Common pitfalls and troubleshooting
    - **Rate Limiting**: Ensure API request frequencies stay within provider rate limits during peak execution periods.
    - **Empty Telemetry Handling**: If no events are recorded in the query window, the Python script handles null responses gracefully.
    - **Credential Scopes**: Verify that the supplied API token possesses sufficient read permissions for the queried endpoints.

    ## How to extend
    - **Automated Remediation**: Add downstream HTTP tasks to trigger automated scaling or restarts upon failure detection.
    - **PagerDuty Escalation**: Route critical severity alerts directly to PagerDuty or Opsgenie.
    - **Multi-Resource Loops**: Loop through an array of resource identifiers using `io.kestra.plugin.core.flow.ForEach`.

    ## Links
    - [Kestra Python Script Plugin](https://kestra.io/plugins/plugin-scripts/python/io.kestra.plugin.scripts.python.script)
    - [Kestra Slack Notification Plugin](https://kestra.io/plugins/plugin-slack/notifications/io.kestra.plugin.slack.notifications.slackincomingwebhook)
    - [Official Documentation](https://kestra.io/docs)
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Monitoring & Alerting
    - Infrastructure Automation
  ee: false
  demo: false
