id: vector-vrl-transform-unit-test-and-topology-gate
namespace: company.observability

inputs:
  - id: git_repository_url
    type: STRING
    displayName: Git Repository URL
    required: false
    description: HTTPS URL of the Git repository that holds the Vector configuration and its unit tests. Webhook runs take it from the push payload (repository.clone_url), so set it for manual runs.

  - id: git_branch
    type: STRING
    displayName: Git Branch
    defaults: main
    description: Branch to check out for manual runs. Webhook runs take it from the push payload (ref).

  - id: config_path
    type: STRING
    displayName: Vector Config Path
    defaults: vector.yaml
    description: Path of the root Vector configuration file, relative to the repository root.

  - id: tests_dir
    type: STRING
    displayName: Vector Tests Directory
    defaults: tests
    description: Directory with Vector unit test files (*.yaml), relative to the repository root. Tests defined inside the config file are run too.

  - id: slack_channel
    type: STRING
    displayName: Slack Channel
    defaults: "#observability-alerts"
    description: Slack channel for gate rejection alerts.

triggers:
  - id: webhook_ci
    type: io.kestra.plugin.core.trigger.Webhook
    description: Receives a GitHub push webhook and checks out the pushed repository and ref before running the gate.
    key: "{{ secret('VECTOR_GATE_WEBHOOK_KEY') }}"

tasks:
  - id: workspace
    type: io.kestra.plugin.core.flow.WorkingDirectory
    description: Shared working directory that holds the cloned repository, the Vector reports and the parsed metrics.
    tasks:
      - id: clone_repo
        type: io.kestra.plugin.git.Clone
        description: Checks out the repository that contains the Vector configuration.
        url: "{{ trigger.body.repository.clone_url is defined ? trigger.body.repository.clone_url : inputs.git_repository_url }}"
        branch: "{{ trigger.body.ref is defined ? trigger.body.ref : inputs.git_branch }}"

      - id: test_and_validate_vector
        type: io.kestra.plugin.scripts.shell.Commands
        description: Runs vector validate and vector test inside the official Vector container and saves both reports.
        taskRunner:
          type: io.kestra.plugin.scripts.runner.docker.Docker
          entryPoint: []
        containerImage: timberio/vector:0.43.0-alpine
        env:
          CONFIG_PATH: "{{ inputs.config_path }}"
          TESTS_DIR: "{{ inputs.tests_dir }}"
          NO_COLOR: "1"
        outputFiles:
          - validation_report.txt
          - test_report.txt
          - summary.properties
        commands:
          - |
            set +e
            echo "=== Step 1: Validating Vector configuration ==="
            vector validate --no-environment "$CONFIG_PATH" > validation_report.txt 2>&1
            VAL_CODE=$?
            echo "Validation exit code: $VAL_CODE"

            echo "=== Step 2: Running VRL unit tests ==="
            if [ $VAL_CODE -eq 0 ]; then
              if ls "$TESTS_DIR"/*.yaml > /dev/null 2>&1; then
                vector test "$CONFIG_PATH" "$TESTS_DIR"/*.yaml > test_report.txt 2>&1
              else
                vector test "$CONFIG_PATH" > test_report.txt 2>&1
              fi
              TEST_CODE=$?
            else
              echo "Vector validation failed; unit tests were skipped." > test_report.txt
              TEST_CODE=1
            fi
            echo "Test exit code: $TEST_CODE"

            echo "VALIDATE_EXIT_CODE=$VAL_CODE" > summary.properties
            echo "TEST_EXIT_CODE=$TEST_CODE" >> summary.properties

            echo "--- Validation report ---"
            cat validation_report.txt
            echo "--- Unit test report ---"
            cat test_report.txt
            exit 0

      - id: parse_test_metrics
        type: io.kestra.plugin.scripts.python.Script
        description: Reads both Vector reports and classifies the run as PASSED, VALIDATION_FAILED, TESTS_FAILED or NO_TESTS_FOUND.
        taskRunner:
          type: io.kestra.plugin.scripts.runner.docker.Docker
          entryPoint: []
        containerImage: python:3.12-slim
        beforeCommands:
          - pip install --quiet kestra
        script: |
          import os
          import re
          from kestra import Kestra

          ANSI = re.compile(r"\x1b\[[0-9;]*m")

          def read(path):
              if not os.path.exists(path):
                  return ""
              with open(path, "r", encoding="utf-8", errors="replace") as f:
                  return ANSI.sub("", f.read()).strip()

          codes = {}
          for line in read("summary.properties").splitlines():
              key, _, value = line.partition("=")
              codes[key.strip()] = int(value.strip())
          val_code = codes.get("VALIDATE_EXIT_CODE", 1)
          test_code = codes.get("TEST_EXIT_CODE", 1)

          val_report = read("validation_report.txt")
          test_report = read("test_report.txt")

          # vector test prints one "test <name> ... passed|failed" line per test
          passed_count = len(re.findall(r"^test .+ \.\.\. passed\s*$", test_report, re.MULTILINE))
          failed_count = len(re.findall(r"^test .+ \.\.\. failed\s*$", test_report, re.MULTILINE))
          total_count = passed_count + failed_count

          if val_code != 0:
              gate_status = "VALIDATION_FAILED"
              failure_details = val_report[:500] if val_report else "Vector validation failed."
          elif test_code != 0 or failed_count > 0:
              gate_status = "TESTS_FAILED"
              lines = [l.strip() for l in test_report.splitlines() if "failed" in l.lower() or "error" in l.lower()]
              failure_details = " | ".join(lines[:5]) if lines else test_report[:500]
          elif total_count == 0:
              gate_status = "NO_TESTS_FOUND"
              failure_details = "vector test ran no unit tests, so the VRL transforms are untested."
          else:
              gate_status = "PASSED"
              failure_details = "Vector validation and all unit tests passed."

          Kestra.outputs({
              "gate_status": gate_status,
              "tests_passed": passed_count,
              "tests_failed": failed_count,
              "total_tests": total_count,
              "failure_details": failure_details
          })

  - id: evaluate_gate
    type: io.kestra.plugin.core.flow.Switch
    description: Logs a pass, or alerts Slack and fails the execution when validation or tests failed or no tests exist.
    value: "{{ outputs.parse_test_metrics.vars.gate_status }}"
    cases:
      PASSED:
        - id: log_gate_passed
          type: io.kestra.plugin.core.log.Log
          message: "Vector gate PASSED: {{ outputs.parse_test_metrics.vars.tests_passed }} of {{ outputs.parse_test_metrics.vars.total_tests }} unit test(s) passed and the configuration validated."

      TESTS_FAILED:
        - id: alert_test_failure_slack
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: Tells the observability team that VRL unit tests failed.
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "channel": {{ inputs.slack_channel | toJson }},
              "text": {{ ("Vector VRL unit test gate REJECTED: " ~ (outputs.parse_test_metrics.vars.tests_failed | string) ~ " of " ~ (outputs.parse_test_metrics.vars.total_tests | string) ~ " test(s) failed. Details: " ~ outputs.parse_test_metrics.vars.failure_details ~ " Execution: " ~ execution.id) | toJson }}
            }

        - id: fail_on_test_regression
          type: io.kestra.plugin.core.execution.Fail
          errorMessage: "Vector VRL unit tests failed ({{ outputs.parse_test_metrics.vars.tests_failed }} of {{ outputs.parse_test_metrics.vars.total_tests }}). Gate rejected."

      VALIDATION_FAILED:
        - id: alert_validation_failure_slack
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: Tells the observability team that the Vector configuration is invalid.
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "channel": {{ inputs.slack_channel | toJson }},
              "text": {{ ("Vector configuration validation FAILED. Details: " ~ outputs.parse_test_metrics.vars.failure_details ~ " Execution: " ~ execution.id) | toJson }}
            }

        - id: fail_on_invalid_config
          type: io.kestra.plugin.core.execution.Fail
          errorMessage: "Vector configuration validation failed. Gate rejected."

      NO_TESTS_FOUND:
        - id: alert_no_tests_slack
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: Tells the observability team that no unit tests were found.
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "channel": {{ inputs.slack_channel | toJson }},
              "text": {{ ("Vector gate REJECTED: no unit tests were found, so the VRL transforms are untested. Execution: " ~ execution.id) | toJson }}
            }

        - id: fail_on_no_tests
          type: io.kestra.plugin.core.execution.Fail
          errorMessage: "No Vector unit tests were found in '{{ inputs.tests_dir }}' or in the config, so the gate cannot pass."

    defaults:
      - id: log_unexpected_status
        type: io.kestra.plugin.core.log.Log
        message: "Unexpected gate status: {{ outputs.parse_test_metrics.vars.gate_status }}"

errors:
  - id: alert_pipeline_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alerts the team when the flow stops with an error, whether the gate rejected the config or a task failed.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": {{ inputs.slack_channel | toJson }},
        "text": {{ ("Vector gate flow " ~ flow.id ~ " stopped with an error in execution " ~ execution.id ~ ".") | toJson }}
      }

extend:
  title: Validate Vector configs and run VRL unit tests before deployment
  metaTitle: Vector VRL Unit Test and Topology Validation Gate | Kestra
  shortDescription: Check out a Vector repository, validate its configuration and run its VRL unit tests in the official container, then alert Slack and fail the run when anything breaks.
  metaDescription: Validate Vector configs and run VRL transform unit tests in Docker, then fail the run and alert Slack when validation or tests fail or no tests exist.
  description: |
    Pre-deployment gate for Vector observability pipelines. The flow checks out your repository, runs `vector validate` on the configuration and `vector test` on its VRL unit tests inside the official Vector container, and rejects the change when the configuration is invalid, a test fails, or no tests exist at all.

    A gate that only counts failures passes an empty test suite, so a repository with no unit tests is rejected rather than approved. The flow tests whatever repository you point it at and does not ship any sample configuration or tests of its own.

    ## How it works

    1. `webhook_ci` receives a GitHub push webhook. `clone_repo` (`io.kestra.plugin.git.Clone`) checks out `repository.clone_url` at the pushed `ref`. For manual runs it uses the `git_repository_url` and `git_branch` inputs. The payload is used only as the clone URL and branch, never inside a shell command.
    2. `test_and_validate_vector` (`io.kestra.plugin.scripts.shell.Commands`, container `timberio/vector:0.43.0-alpine`) runs `vector validate --no-environment` on `config_path`, which loads the config, checks component wiring and compiles the VRL. If validation passes it runs `vector test` with the files in `tests_dir`, or with the config alone when there are none. Paths reach the shell through environment variables. Reports and exit codes are saved as output files.
    3. `parse_test_metrics` (`io.kestra.plugin.scripts.python.Script`) counts the `test <name> ... passed` and `... failed` lines and sets the status: `VALIDATION_FAILED`, `TESTS_FAILED`, `NO_TESTS_FOUND` or `PASSED`.
    4. `evaluate_gate` (`io.kestra.plugin.core.flow.Switch`) logs a pass. For every other status it posts to Slack through `io.kestra.plugin.slack.notifications.SlackIncomingWebhook` and then fails the execution with `io.kestra.plugin.core.execution.Fail`.

    ## What you get

    - A merge gate that stops broken VRL, invalid wiring and untested transforms from reaching collectors.
    - Failure details in the Slack message and the execution logs, with the full reports saved as output files.
    - Slack messages that stay valid JSON even when Vector's output contains quotes or newlines.

    ## Who it's for

    - Observability Engineers and SREs who maintain Vector configurations.
    - Platform Teams that manage telemetry routing through GitOps.
    - SecOps and Compliance Teams that verify PII redaction rules before logs are forwarded.

    ## Why orchestrate this with Kestra

    A broken VRL transform can silently drop or corrupt logs across a whole fleet. In Kestra the check runs in the same container image everywhere, keeps the reports as execution outputs, and turns every bad outcome into a failed execution with a Slack alert.

    ## Prerequisites

    - A Docker daemon that the Kestra worker can use, to run `timberio/vector:0.43.0-alpine` and `python:3.12-slim`.
    - A Git repository with a Vector configuration and unit tests, readable without credentials (see How to extend for private repositories).
    - A Slack Incoming Webhook URL.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack incoming webhook URL for gate alerts (required).
    - `VECTOR_GATE_WEBHOOK_KEY`: key that protects the `webhook_ci` endpoint (required).

    ## Quick start

    1. Add `SLACK_WEBHOOK_URL` and `VECTOR_GATE_WEBHOOK_KEY` to your Kestra namespace secrets.
    2. Import this blueprint into your Kestra instance.
    3. Run it manually with `git_repository_url` set to a repository that has a `vector.yaml` and unit tests, adjusting `config_path` and `tests_dir` if needed.
    4. Add a GitHub push webhook that points at the `webhook_ci` URL to run the gate on every push.

    ## How to extend

    - **Private repositories**: Add `username` and `password` (a token from `secret()`) to the `Clone` task.
    - **Deploy on success**: Add a Helm or Ansible task after the `PASSED` branch.
    - **Pull request events**: Map `pull_request.head.repo.clone_url` and `pull_request.head.ref` to the clone URL and branch to gate pull requests instead of pushes.

    ## Links

    - [Vector Documentation](https://vector.dev/docs/)
    - [Vector Remap Language (VRL) Reference](https://vector.dev/docs/reference/vrl/)
    - [Vector Unit Testing Guide](https://vector.dev/docs/reference/configuration/unit-tests/)
    - [Kestra Git Plugin](https://kestra.io/plugins/plugin-git)
    - [Kestra Slack Plugin](https://kestra.io/plugins/plugin-slack)
  tags:
    - Infrastructure
  subTags:
    - CI/CD & Deployment
    - Day 2 Operations
  ee: false
  verified: false
  demo: false
