id: elasticsearch-indices-segments-count-growth-sentinel
namespace: company.team

inputs:
  - id: es_host
    type: STRING
    defaults: "elasticsearch.internal"
    description: Elasticsearch cluster hostname or IP address.
  - id: es_port
    type: INT
    defaults: 9200
    description: Elasticsearch HTTP port.
  - id: es_user
    type: STRING
    defaults: "elastic"
    description: Elasticsearch username.
  - id: max_segments_threshold
    type: INT
    defaults: 150
    description: Maximum acceptable Lucene segment count per index before flagging segment sprawl.

tasks:
  - id: query_segment_counts
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests
    env:
      ES_HOST: "{{ inputs.es_host }}"
      ES_PORT: "{{ inputs.es_port }}"
      ES_USER: "{{ inputs.es_user }}"
      ES_PASSWORD: "{{ secret('ES_PASSWORD') }}"
    script: |
      import os
      import sys
      import json
      import requests
      from kestra import Kestra

      host = os.environ.get("ES_HOST", "elasticsearch.internal")
      port = os.environ.get("ES_PORT", "9200")
      user = os.environ.get("ES_USER", "elastic")
      password = os.environ.get("ES_PASSWORD", "")

      auth = (user, password) if user and password else None
      url = f"http://{host}:{port}/_cat/indices?format=json&h=index,segments.count,segments.memory&s=segments.count:desc"

      try:
          resp = requests.get(url, auth=auth, timeout=15)
          resp.raise_for_status()
          indices_data = resp.json()
      except Exception as e:
          print(f"CRITICAL: Failed to query Elasticsearch segments at {url}: {e}", file=sys.stderr)
          sys.exit(1)

      threshold = int("{{ inputs.max_segments_threshold }}")
      sprawl_indices = []
      peak_segments = 0

      for item in indices_data:
          try:
              seg_count = int(item.get("segments.count", 0))
          except (ValueError, TypeError):
              seg_count = 0
          if seg_count > peak_segments:
              peak_segments = seg_count
          if seg_count >= threshold:
              sprawl_indices.append({
                  "index": item.get("index"),
                  "segments": seg_count,
                  "memory": item.get("segments.memory")
              })

      sprawl_count = len(sprawl_indices)

      report = {
          "sprawl_count": sprawl_count,
          "peak_segments": peak_segments,
          "sprawl_indices": sprawl_indices
      }

      with open("segments_report.json", "w") as f:
          json.dump(report, f, indent=2)

      Kestra.outputs({
          "sprawl_count": sprawl_count,
          "peak_segments": peak_segments
      })
      print(f"Segment audit: sprawl_count={sprawl_count}, peak_segments={peak_segments}")
    outputFiles:
      - segments_report.json

  - id: evaluate_segment_health
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.query_segment_counts.vars.sprawl_count | int > 0 }}"
    then:
      - id: notify_search_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#elasticsearch-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 Elasticsearch Lucene Segment Sprawl Alert",
                "text": "Elasticsearch cluster at `{{ inputs.es_host }}` recorded *{{ outputs.query_segment_counts.vars.sprawl_count }}* indices exceeding {{ inputs.max_segments_threshold }} Lucene segments (Peak: *{{ outputs.query_segment_counts.vars.peak_segments }}* segments). Impact: Search latency degrades significantly due to multi-segment disk seeking, and segment metadata consumes excessive JVM heap memory.",
                "footer": "Kestra Search Sentinel • Elasticsearch"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "#elasticsearch-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ Elasticsearch Lucene Segment Growth Sentinel Failure",
            "text": "Failed to scrape Elasticsearch index segment counts. Verify cluster network connectivity. Execution ID: {{ execution.id }}",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 */6 * * *"
    disabled: true

extend:
  metaDescription: "Audits Elasticsearch indices for excessive Lucene segment counts to isolate segment sprawl and trigger merge optimizations."
  metaTitle: Elasticsearch Lucene Segment Sprawl Sentinel with Kestra
  title: Elasticsearch Lucene Segment Sprawl Sentinel
  shortDescription: Audits Elasticsearch indices for excessive Lucene segment counts to isolate segment sprawl and trigger merge optimizations.
  description: |
    ## How it works
    This workflow queries `_cat/indices` to inspect Lucene segment counts and segment heap memory per index. Continuous small writes produce numerous small segments that degrade search speed and consume JVM memory until merged. When indices exceed the configured segment threshold, search platform teams are notified to execute force merges or review merge policies.

    ## Architecture diagram
    ```mermaid
    flowchart TD
      A[periodic_schedule Schedule Trigger] --> B[query_segment_counts Python Script]
      B --> C{Segment Count Exceeds Threshold?}
      C -- Yes --> D[notify_search_team Slack Webhook]
      C -- No --> E[Segments Healthy]
    ```

    ## Prerequisites
    - Elasticsearch cluster (7.x / 8.x) accessible via REST.
    - Secrets `ES_PASSWORD` and `SLACK_WEBHOOK_URL` configured in Kestra.

    ## Quick start
    1. Import the blueprint under the `company.team` namespace.
    2. Configure cluster host, port, and segment threshold.
    3. Run manually to audit Lucene segment health.

    ## Links
    - [Elasticsearch Indices Segments API](https://www.elastic.co/guide/en/elasticsearch/reference/current/indices-segments.html)
    - [Kestra Python Script Documentation](https://kestra.io/plugins/plugin-scripts-python)
  tags:
    - Data
    - Infrastructure
  subTags:
    - ELT & Data Landing
    - Day 2 Operations
  ee: false
  demo: false
