id: sqlite-wal-checkpoint-and-integrity-sentinel
namespace: company.data

description: Performs automated integrity validation and WAL log checkpointing across production SQLite databases, alerting on corrupt pages and uncheckpointed WAL bloat.

concurrency:
  limit: 1

inputs:
  - id: database_file_path
    type: STRING
    defaults: /data/application.db
    description: Absolute file path to the target SQLite database file.

  - id: max_wal_size_mb_warning
    type: FLOAT
    defaults: 64.0
    description: Threshold size in megabytes for the write-ahead log file before triggering a warning.

  - id: execute_truncate_checkpoint
    type: BOOL
    defaults: true
    description: Whether to execute PRAGMA wal_checkpoint(TRUNCATE) to reclaim disk space after clean verification.

  - id: slack_channel
    type: STRING
    defaults: "#embedded-db-alerts"
    description: Slack channel destination for database integrity alerts.

tasks:
  - id: verify_integrity_and_checkpoint
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.11-slim
    env:
      DB_PATH: "{{ inputs.database_file_path }}"
      MAX_WAL_MB: "{{ inputs.max_wal_size_mb_warning }}"
      DO_CHECKPOINT: "{{ inputs.execute_truncate_checkpoint }}"
    script: |
      import os
      import sqlite3
      import json
      from kestra import Kestra

      db_path = os.getenv('DB_PATH')
      max_wal_mb = float(os.getenv('MAX_WAL_MB', 64.0))
      do_checkpoint = os.getenv('DO_CHECKPOINT', 'true').lower() == 'true'

      wal_path = f"{db_path}-wal"
      wal_size_mb = 0.0
      if os.path.exists(wal_path):
          wal_size_mb = os.path.getsize(wal_path) / (1024 * 1024)

      conn = sqlite3.connect(db_path)
      cursor = conn.cursor()

      # 1. Check database integrity
      cursor.execute("PRAGMA quick_check;")
      check_results = cursor.fetchall()
      is_healthy = len(check_results) == 1 and check_results[0][0] == 'ok'
      integrity_message = "ok" if is_healthy else str(check_results)

      # 2. Check journal mode
      cursor.execute("PRAGMA journal_mode;")
      journal_mode = cursor.fetchone()[0]

      checkpoint_status = "SKIPPED"
      if is_healthy and do_checkpoint and journal_mode.lower() == 'wal':
          cursor.execute("PRAGMA wal_checkpoint(TRUNCATE);")
          ckpt_res = cursor.fetchone()
          checkpoint_status = f"CHECKPOINTED (busy={ckpt_res[0]}, log={ckpt_res[1]}, checkpointed={ckpt_res[2]})"

      conn.close()

      has_wal_bloat = wal_size_mb > max_wal_mb
      requires_alert = (not is_healthy) or has_wal_bloat

      Kestra.outputs({
          'is_healthy': is_healthy,
          'integrity_status': integrity_message,
          'journal_mode': journal_mode,
          'wal_size_mb': round(wal_size_mb, 2),
          'checkpoint_status': checkpoint_status,
          'requires_alert': requires_alert
      })

      report = {
          'database': db_path,
          'is_healthy': is_healthy,
          'integrity_status': integrity_message,
          'journal_mode': journal_mode,
          'wal_size_mb': wal_size_mb,
          'checkpoint_status': checkpoint_status,
          'requires_alert': requires_alert
      }

      with open('sqlite_integrity_report.json', 'w') as f:
          json.dump(report, f, indent=2)

    outputFiles:
      - sqlite_integrity_report.json

  - id: check_health_and_alert
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.verify_integrity_and_checkpoint.vars.requires_alert }}"
    then:
      - id: notify_slack_dba
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "{{ inputs.slack_channel }}",
            "text": "SQLite Integrity Sentinel Alert: Database `{{ inputs.database_file_path }}` flagged an anomaly.\n• Integrity: {{ outputs.verify_integrity_and_checkpoint.vars.integrity_status }}\n• WAL Size: {{ outputs.verify_integrity_and_checkpoint.vars.wal_size_mb }} MB (Threshold: {{ inputs.max_wal_size_mb_warning }} MB)\n• Checkpoint State: {{ outputs.verify_integrity_and_checkpoint.vars.checkpoint_status }}"
          }
    else:
      - id: log_database_nominal
        type: io.kestra.plugin.core.log.Log
        message: "SQLite database {{ inputs.database_file_path }} is healthy. Integrity check passed and WAL size is {{ outputs.verify_integrity_and_checkpoint.vars.wal_size_mb }} MB."

  - id: export_db_manifest
    type: io.kestra.plugin.core.execution.Labels
    labels:
      database_target: "{{ inputs.database_file_path }}"
      integrity_status: "{{ outputs.verify_integrity_and_checkpoint.vars.is_healthy ? 'HEALTHY' : 'CORRUPTED' }}"
      wal_checkpoint_executed: "{{ inputs.execute_truncate_checkpoint ? 'YES' : 'NO' }}"

triggers:
  - id: nightly_sqlite_maintenance
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 2 * * *"

extend:
  title: SQLite WAL Checkpoint and Integrity Sentinel
  metaTitle: SQLite WAL Checkpoint and Integrity Sentinel
  shortDescription: Validates SQLite database page integrity and truncates WAL logs to prevent disk exhaustion.
  metaDescription: Validates SQLite database page integrity, measures write-ahead log size, executes safe checkpoints, and alerts on database corruption via Slack.
  description: |
    This blueprint acts as an automated reliability sentinel for embedded SQLite databases in production and edge deployments. Scheduled nightly, it runs SQLite integrity checks via `PRAGMA quick_check`, audits write-ahead log (WAL) file sizes, and executes safe `PRAGMA wal_checkpoint(TRUNCATE)` operations to prevent uncontrolled disk bloat and early corruption risks.

    ## How it works

    1. **Nightly Maintenance Trigger**: The `nightly_sqlite_maintenance` trigger (`io.kestra.plugin.core.trigger.Schedule`) fires daily at 02:00 UTC.
    2. **Integrity Probe & WAL Inspection**: The `verify_integrity_and_checkpoint` task (`io.kestra.plugin.scripts.python.Script`) connects to the database, executes `PRAGMA quick_check`, measures the `-wal` file size, and conditionally checkpoints WAL logs to disk.
    3. **Threshold Gate**: The `check_health_and_alert` flowable task (`io.kestra.plugin.core.flow.If`) branches based on whether any corruption was detected or WAL limits were exceeded.
    4. **Slack Alert Dispatch**: When corruption or excessive log growth occurs, `notify_slack_dba` (`io.kestra.plugin.slack.notifications.SlackIncomingWebhook`) dispatches an actionable triage alert.
    5. **Nominal Confirmation**: When the database is healthy, `log_database_nominal` records confirmed operational status.
    6. **Manifest Export**: The `export_db_manifest` task annotates the execution with searchable status labels.

    ## Architecture diagram

    ```mermaid
    flowchart TD
        A[Schedule: Nightly 02:00 UTC] --> B[verify_integrity_and_checkpoint: Python sqlite3]
        B --> C{Integrity Error or WAL Bloat?}
        C -- Yes --> D[notify_slack_dba: Slack Webhook]
        C -- No --> E[log_database_nominal: Log]
        D --> F[export_db_manifest: Execution Labels]
        E --> F
    ```

    ## Use cases

    - **Embedded Microservice Maintenance**: Regularly verify SQLite datastores backing edge applications, internal services, and local cache layers.
    - **Write-Ahead Log Bloat Prevention**: Automate WAL truncation to prevent single large transactions from bloating the `-wal` companion file indefinitely.
    - **Early Data Corruption Detection**: Detect B-tree page and index corruptions caused by disk faults or abrupt power interruptions before catastrophic data loss occurs.

    ## Inputs

    | Name | Type | Default | Description |
    | :--- | :--- | :--- | :--- |
    | `database_file_path` | STRING | `/data/application.db` | Absolute file path to the target SQLite database file. |
    | `max_wal_size_mb_warning` | FLOAT | `64.0` | Threshold size in megabytes for the write-ahead log file before triggering a warning. |
    | `execute_truncate_checkpoint` | BOOL | `true` | Whether to execute PRAGMA wal_checkpoint(TRUNCATE) to reclaim disk space after clean verification. |
    | `slack_channel` | STRING | `#embedded-db-alerts` | Slack channel destination for database integrity alerts. |

    ## Expected outputs

    - `{{ outputs.verify_integrity_and_checkpoint.vars.is_healthy }}`: Boolean flag indicating clean page integrity.
    - `{{ outputs.verify_integrity_and_checkpoint.vars.integrity_status }}`: Text status returned by SQLite PRAGMA quick_check.
    - `{{ outputs.verify_integrity_and_checkpoint.vars.journal_mode }}`: Active SQLite journal mode (wal, delete, memory).
    - `{{ outputs.verify_integrity_and_checkpoint.vars.wal_size_mb }}`: Computed size of the companion WAL file in megabytes.
    - `{{ outputs.verify_integrity_and_checkpoint.outputFiles['sqlite_integrity_report.json'] }}`: Complete JSON diagnostic report.

    ## Prerequisites

    - Read and write file permissions on the target SQLite database file and its parent directory.
    - Incoming Webhook URL configured for your database administrator Slack channel.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook endpoint URL.

    ## Quick start

    1. Configure `SLACK_WEBHOOK_URL` in your Kestra namespace secrets.
    2. Import this flow YAML into your Kestra workspace.
    3. Specify the absolute path to your database in `database_file_path`.
    4. Click **Execute** in the UI to run an immediate integrity probe and WAL checkpoint.

    ## Common pitfalls and troubleshooting

    - **Concurrent Long Transactions**: If an active read transaction is open during the checkpoint, `wal_checkpoint(TRUNCATE)` will report `busy=1` and cannot truncate the log until the reader finishes.
    - **Mount Permissions**: When running inside containerized runners, ensure the database directory is mounted with matching user permissions so checkpoint lock files (`-shm`) can be written.

    ## How to extend

    - Add automated database backup copies via SQLite Online Backup API (`sqlite3.backup()`) before applying checkpoints.
    - Trigger `PRAGMA optimize` on Sunday schedules to update table query planner statistics.
    - Escalate critical page corruption events directly to incident response tools like PagerDuty.

    ## Links

    - Kestra Python Script Documentation: https://kestra.io/plugins/plugin-scripts-python/io.kestra.plugin.scripts.python.Script
    - Kestra Slack Plugin Documentation: https://kestra.io/plugins/plugin-notifications
    - SQLite Write-Ahead Logging: https://www.sqlite.org/wal.html
  tags:
    - Data
    - Infrastructure
  subTags:
    - Databases
    - Day 2 Operations
    - Monitoring & Alerting
  ee: false
  demo: false
