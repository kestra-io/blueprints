id: imagewatch
namespace: company.team
description: Watches pods stuck in ImagePullBackOff or ErrImagePull and alerts on Slack with cause hints.

labels:
  project: imagewatch
  team: platform

inputs:
  - id: namespace
    type: STRING
    displayName: "Namespace"
    description: the namespace whose pods to watch
    defaults: default
  - id: slack_webhook
    type: STRING
    displayName: "Slack Webhook URL"
    description: Incoming webhook URL of the Slack channel for alerts

triggers:
  - id: schedule
    type: io.kestra.plugin.core.trigger.Schedule
    description: checks for stuck image pulls every five minutes
    cron: "*/5 * * * *"
    timezone: UTC
    inputs:
      namespace: default
      slack_webhook: "{{ secret('SLACK_WEBHOOK') }}"

tasks:
  - id: list_pods
    type: io.kestra.plugin.scripts.shell.Commands
    description: lists all pods in the namespace as JSON
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      user: "0"
    containerImage: bitnami/kubectl
    inputFiles:
      client.crt: "{{ secret('CLIENT_CRT') }}"
      client.key: "{{ secret('CLIENT_KEY') }}"
    commands:
      - kubectl get pods -n {{ inputs.namespace }} -o json --client-certificate=client.crt --client-key=client.key --server={{ secret('MASTERURL') }} --insecure-skip-tls-verify=true > pods.json
    outputFiles:
      - pods.json

  - id: find_stuck
    type: io.kestra.plugin.scripts.python.Script
    description: finds pods stuck pulling images and guesses why
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      user: "0"
    containerImage: python:3.11
    dependencies:
      - kestra
    script: |
      import json
      from datetime import datetime, timezone
      from kestra import Kestra

      namespace = """{{ inputs.namespace }}"""

      with open("""{{ outputs.list_pods.outputFiles['pods.json'] }}""") as f:
          pods = json.load(f)['items']

      # names we already alerted on, from the KV store (null on first run -> empty)
      raw_state = """{{ kv('imagewatch-state-' ~ inputs.namespace, errorOnMissing=false) }}"""
      already = set(json.loads(raw_state) if raw_state.strip() else [])

      def hint(image, message, pull_secrets):
          msg = (message or '').lower()
          hints = []
          if 'toomanyrequests' in msg or 'rate limit' in msg:
              hints.append('registry rate limit - wait or use an authenticated pull')
          if 'unauthorized' in msg or 'denied' in msg or '401' in msg or '403' in msg:
              hints.append('registry auth failed - check imagePullSecrets')
          first = image.split('/')[0] if '/' in image else ''
          if '.' in first and not pull_secrets:
              hints.append('private registry with no imagePullSecrets on the pod')
          if not hints:
              hints.append('image has never been seen - check for typos in the name or tag')
          return '; '.join(hints)

      stuck = []
      now = datetime.now(timezone.utc)
      for pod in pods:
          meta = pod.get('metadata', {})
          spec = pod.get('spec', {})
          status = pod.get('status', {})
          name = meta['name']
          pull_secrets = spec.get('imagePullSecrets', [])
          created = datetime.fromisoformat(
              meta['creationTimestamp'].replace('Z', '+00:00')
          )
          age_min = int((now - created).total_seconds() // 60)
          for cs in (status.get('containerStatuses', []) or []) + (status.get('initContainerStatuses', []) or []):
              waiting = (cs.get('state', {}) or {}).get('waiting')
              if not waiting:
                  continue
              reason = waiting.get('reason', '')
              if reason not in ('ImagePullBackOff', 'ErrImagePull'):
                  continue
              image = cs.get('image', '')
              stuck.append({
                  'pod': name,
                  'image': image,
                  'reason': reason,
                  'age_min': age_min,
                  'hint': hint(image, waiting.get('message'), pull_secrets),
              })
              break  # one alert per pod is enough

      stuck_names = sorted(s['pod'] for s in stuck)
      new = [s for s in stuck if s['pod'] not in already]

      lines = [f"*ImageWatch - image pull stuck in '{namespace}'*", ""]
      for s in new:
          lines.append(f"- *{s['pod']}*: `{s['image']}` stuck in {s['reason']} for ~{s['age_min']}m")
          lines.append(f"  likely cause: {s['hint']}")
      lines.append("")
      lines.append(f"inspect with: kubectl describe pod {new[0]['pod']} -n {namespace}" if new else "")
      alert_text = "\n".join(lines)

      Kestra.outputs({
          'new_stuck': new,
          'count': len(new),
          'alert_text': alert_text,
          'new_state_json': json.dumps(stuck_names),
      })

  - id: maybe_alert
    type: io.kestra.plugin.core.flow.If
    description: alerts only about newly stuck pods
    condition: "{{ outputs.find_stuck.vars.count > 0 }}"
    then:
      - id: send_alert
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: posts the stuck image pull alert to Slack
        url: "{{ inputs.slack_webhook }}"
        messageText: "{{ outputs.find_stuck.vars.alert_text }}"

  - id: save_state
    type: io.kestra.plugin.core.kv.Set
    description: remembers who is stuck now, so recovered pods alert again next time
    key: "imagewatch-state-{{ inputs.namespace }}"
    value: "{{ outputs.find_stuck.vars.new_state_json }}"
    overwrite: true

extend:
  title: "ImageWatch - Kubernetes ImagePullBackOff watcher"
  shortDescription: "Alerts on Slack when pods get stuck pulling container images, with hints about the likely cause."
  metaTitle: "ImageWatch: Kubernetes ImagePullBackOff watcher blueprint for Kestra"
  metaDescription: "A Kestra blueprint that watches Kubernetes pods stuck in ImagePullBackOff or ErrImagePull and alerts on Slack with the likely cause, without spamming."
  tags:
    - Infrastructure
  subTags:
    - Kubernetes Operations
    - Infrastructure Automation
  ee: false
  demo: false
  description: |
    ## How it works

    1. `list_pods` (`io.kestra.plugin.scripts.shell.Commands`) dumps the namespace's pods as JSON with kubectl.
    2. `find_stuck` (`io.kestra.plugin.scripts.python.Script`) looks at every container state and collects pods stuck in `ImagePullBackOff` or `ErrImagePull`. For each one it guesses the cause from the waiting message, the image name, and the pod's pull secrets: registry rate limiting, auth failures, a private registry with no `imagePullSecrets`, or a probable typo when the image has never been seen. It compares against the KV state so only newly stuck pods alert.
    3. `maybe_alert` (`io.kestra.plugin.core.flow.If`) posts the Slack alert only when there is something new, naming the pod, the exact image, how long it has been stuck, and the likely cause.
    4. `save_state` (`io.kestra.plugin.core.kv.Set`) writes back the current stuck list. Recovered pods drop out on their own, so getting stuck again alerts again, and steady-state reruns stay quiet.

    ## What you get

    - A five-minute check for the most common "why won't my pod start" failure, no agent to install inside the cluster.
    - Slack alerts that do the first minute of debugging for you: the image, the wait reason, and a likely cause with what to check.
    - No alert spam: the KV-backed memory remembers who was already reported, and forgets pods that recovered.
    - Quiet runs when every pod pulls fine.

    ## Who it's for

    Anyone running workloads on Kubernetes who has stared at `ImagePullBackOff` wondering whether it is a typo, a secret, or the registry. Works on any cluster you can reach with a client certificate: minikube, kind, managed clusters.

    ## Why orchestrate this with Kestra

    `kubectl get pods` shows you the symptom; this flow adds the diagnosis, the memory, and the notification in one scheduled place. Kestra holds the cluster credentials as secrets, keeps every run's findings where you can audit them, and the KV state means the second run does not page you about the same pod again.

    ## Prerequisites

    - A Kubernetes cluster with pods you can list.
    - A kubeconfig client certificate and key with permission to list pods in the target namespace.
    - Kestra with the Docker task runner available (used for the kubectl and Python steps).
    - A Slack Incoming Webhook URL.

    ### Secrets

    | Secret | What it is |
    | --- | --- |
    | `CLIENT_CRT` | base64-encoded client certificate from your kubeconfig |
    | `CLIENT_KEY` | base64-encoded client key from your kubeconfig |
    | `MASTERURL` | base64-encoded Kubernetes API server URL, reachable from inside the Kestra container |
    | `SLACK_WEBHOOK` | base64-encoded Slack Incoming Webhook URL |

    In Kestra OSS, secrets come from environment variables prefixed with `SECRET_` and must be base64-encoded. If the API URL uses `127.0.0.1` or `localhost`, replace it with `host.docker.internal` so the Kestra container can reach it.

    ## Quick start

    1. Start Kestra with the four secrets above as `SECRET_` environment variables.
    2. Import this flow and run it with your `namespace`: if a pod is stuck pulling, the Slack alert names it, the image, and the likely cause.
    3. Fix the image or secret and run again: quiet, the pod dropped out of the stuck list.
    4. Break it again: the alert fires once more, because the state only remembers the currently stuck.

    ## How to extend

    - Add more cause hints, like matching the image against a known-good list from your registry.
    - Include the last few lines of `kubectl describe` output by shelling out per stuck pod.
    - Run across all namespaces by looping the namespace input with a ForEach task.
    - Route alerts to PagerDuty or Opsgenie by swapping the Slack task for another notification task.

    ## Inputs

    | Input | Type | Default | What it does |
    | --- | --- | --- | --- |
    | `namespace` | STRING | `default` | the namespace whose pods to watch |
    | `slack_webhook` | STRING | (required) | Incoming webhook URL of the Slack channel for alerts |

    ## Links

    - [Kestra blueprint catalog](https://kestra.io/blueprints)
    - [Kubernetes container states documentation](https://kubernetes.io/docs/concepts/workloads/pods/pod-lifecycle/#container-states)
    - [Kestra secrets documentation](https://kestra.io/docs/concepts/secrets)

    ## Pitfalls

    - The cause hint is a heuristic, not a diagnosis. "Check for typos" when the registry is actually down will mislead; always confirm with `kubectl describe pod`.
    - Pod age is used as the stuck duration, which is only accurate if the pod has been stuck since creation. A pod that ran fine for days and then got stuck on a redeploy will show its full age.
    - One alert per pod: if two containers in the same pod are stuck on different images, only the first is reported. The describe command in the alert covers the rest.
    - The flow is strictly read-only. It never deletes pods, pulls images, or touches secrets.
