id: aws-lambda-concurrency-throttles-sentinel
namespace: company.cloudops

inputs:
  - id: aws_region
    type: STRING
    defaults: us-east-1
    description: AWS region where the Lambda function is hosted.
  - id: function_name
    type: STRING
    defaults: order-processing-service
    description: Name of the AWS Lambda function to monitor.
  - id: max_throttles_threshold
    type: INT
    defaults: 0
    description: Maximum permissible throttled invocations in a 15-minute window before alerting.

tasks:
  - id: query_lambda_throttles
    type: io.kestra.plugin.aws.cli.AwsCLI
    runner: PROCESS
    region: "{{ inputs.aws_region }}"
    accessKeyId: "{{ secret('AWS_ACCESS_KEY_ID') }}"
    secretKeyId: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
    commands:
      - |
        aws cloudwatch get-metric-statistics           --namespace AWS/Lambda           --metric-name Throttles           --dimensions Name=FunctionName,Value="{{ inputs.function_name }}"           --start-time $(date -u -v-15m +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || date -u -d "15 minutes ago" +%Y-%m-%dT%H:%M:%SZ)           --end-time $(date -u +%Y-%m-%dT%H:%M:%SZ)           --period 900           --statistics Sum           --output json > lambda_throttles.json
        python3 -c "
        import json
        with open('lambda_throttles.json') as f:
            dps = json.load(f).get('Datapoints', [])
        total_throttles = int(sum(dp.get('Sum', 0) for dp in dps))
        result = {
            'function_name': '{{ inputs.function_name }}',
            'throttled_invocations': total_throttles,
            'alert_triggered': total_throttles > {{ inputs.max_throttles_threshold }}
        }
        with open('lambda_summary.json', 'w') as out:
            json.dump(result, out)
        print('Lambda throttles audit:', result)
        "
    outputFiles:
      - lambda_summary.json

  - id: evaluate_throttles
    type: io.kestra.plugin.core.flow.If
    condition: "{{ json(read(outputs.query_lambda_throttles.outputFiles['lambda_summary.json'])).alert_triggered }}"
    then:
      - id: alert_serverless_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "text": ":warning: *AWS Lambda Throttling Alert*: Function `{{ inputs.function_name }}` experienced {{ json(read(outputs.query_lambda_throttles.outputFiles['lambda_summary.json'])).throttled_invocations }} throttled invocations in the last 15 minutes. Check reserved concurrency limits or account-level quotas."
          }

errors:
  - id: notify_sentinel_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "text": ":warning: *Lambda Sentinel Execution Failure*: Failed to query CloudWatch metrics for `{{ inputs.function_name }}`."
      }

triggers:
  - id: scheduled_throttles_check
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  title: AWS Lambda Execution Throttles and Concurrency Exhaustion Sentinel
  shortDescription: Audits Amazon Lambda metrics to detect execution throttling caused by concurrency exhaustion or account quota limits.
  description: |
    ## How it works
    This sentinel leverages `AwsCLI` to query CloudWatch for the `Throttles` metric on target Lambda functions over rolling 15-minute periods. It detects when incoming invocation requests are rejected or queued due to reserved concurrency limits, alerting serverless teams before client timeouts cascade.

    ## What you get
    - Real-time detection of Lambda invocation drops and concurrency bottlenecks.
    - Early warning before serverless API endpoints return HTTP 429 errors.
    - Automated Slack delivery tracking total throttled invocations.

    ## Who it's for
    - Serverless developers and DevOps engineers maintaining AWS Lambda microservices.
    - Platform architects managing regional concurrency quotas across AWS accounts.

    ## Why orchestrate this with Kestra
    Kestra runs automated scheduled operational health checks with native error handling, secret injection, and multi-channel alerting.

    ## Prerequisites
    - AWS IAM credentials with `cloudwatch:GetMetricStatistics` permissions.
    - Secrets `AWS_ACCESS_KEY_ID`, `AWS_SECRET_ACCESS_KEY`, and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import this blueprint into Kestra.
    2. Configure `function_name`, `aws_region`, and credentials.
    3. Run manually to check current throttle counts.

    ## How to extend
    - Compare `ConcurrentExecutions` alongside `Throttles` to measure actual concurrency saturation.
    - Dynamically increase function reserved concurrency via `lambda:PutFunctionConcurrency`.
    - Forward throttling metrics to Datadog or Prometheus.

    ## Links
    - [Kestra AWS Plugin](https://kestra.io/plugins/plugin-aws)
    - [AWS Lambda Metrics](https://docs.aws.amazon.com/lambda/latest/dg/monitoring-metrics.html)
  tags:
    - Cloud
    - Infrastructure
  subTags:
    - Monitoring & Alerting
  ee: false
  demo: false
