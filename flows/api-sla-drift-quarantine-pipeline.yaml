id: api-sla-drift-quarantine-pipeline
namespace: company.platform

extend:
  title: Automated API SLA and Data Drift Quarantine Pipeline
  metaTitle: API SLA Monitoring and Data Drift Quarantine with DuckDB | Kestra
  shortDescription: Runs parallel endpoint probes, aggregates batch metrics in DuckDB, scores drift in Python, and quarantines bad partitions.
  metaDescription: Orchestrate parallel API health checks, DuckDB telemetry queries, Python SLA evaluation, and partition quarantine with Kestra.
  description: |
    Prevents silent data corruption and upstream API regressions from polluting downstream analytics tables by combining parallel pre-flight checks, embedded DuckDB aggregations, Python threshold scoring, and sequential consumer watermark synchronization.

    ## How it works
    1. A Schedule trigger (every 15 minutes) or an upstream deployment Webhook initiates the audit run.
    2. A Parallel block simultaneously probes primary and replica gateway endpoints while logging heartbeat telemetry.
    3. A DuckDB task queries active ingestion micro-batches in memory to verify batch counts and schema state.
    4. A Python script compares observed p95 latency against configurable SLA thresholds and exports a structured health manifest.
    5. A Sequential block updates watermarks in order across billing, fraud scoring, and warehouse consumer services.
    6. An If branch either promotes clean partitions to production or isolates anomalous batches into quarantine before closing the audit ledger.

    ## What you get
    - Multi-layered protection combining network reachability, SQL batch extraction, and programmatic SLA scoring.
    - Ordered watermark coordination across dependent microservices via `Sequential`.
    - Immediate quarantine isolation when p95 latencies breach defined guardrails.

    ## Who it's for
    - Data and Analytics Engineers protecting warehouse tables from broken upstream producer deployments.
    - Platform and SRE teams automating post-deploy verification gates.

    ## Why orchestrate this with Kestra
    - Combines `Parallel`, `Sequential`, and `If` flowable constructs in a single declarative pipeline.
    - Full execution topology and task-level duration tracking across all 12 workflow stages.

    ## Prerequisites
    - Standard Kestra v2.0 instance with DuckDB and Python script plugins enabled.

    ### Secrets
    - No secrets required.

    ## Quick start
    1. Import this blueprint into your Kestra instance.
    2. Click Execute with the default inputs to see the healthy promotion path, or lower `max_latency_ms` to `200` to test the quarantine branch.
    3. Enable the 15-minute schedule or connect your CI/CD deployment webhook.

    ## How to extend
    - Point the DuckDB query at real S3/Parquet staging files or attach PostgreSQL/BigQuery tables.
    - Replace the quarantine log task with a PagerDuty, Slack, or Opsgenie incident trigger.

    ## Links
    - [DuckDB Plugin](https://kestra.io/plugins/plugin-jdbc-duckdb)
    - [Sequential Flowable Task](https://kestra.io/docs/workflow-components/flowable-tasks/sequential)
  tags:
    - Data
  subTags:
    - Testing & Quality
  ee: false
  demo: false

inputs:
  - id: target_service
    type: STRING
    defaults: "orders-ingestion-v2"
  - id: observed_p95_ms
    type: INT
    defaults: 340
  - id: max_latency_ms
    type: INT
    defaults: 450

triggers:
  - id: fifteen_min_sla_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"

  - id: upstream_deploy_webhook
    type: io.kestra.plugin.core.trigger.Webhook
    key: "deploy-drift-audit-hook"

tasks:
  - id: init_audit_context
    type: io.kestra.plugin.core.log.Log
    level: INFO
    message: "1/12 Starting SLA & schema drift audit for {{ inputs.target_service }}"

  - id: parallel_preflight_probes
    type: io.kestra.plugin.core.flow.Parallel
    description: "Flowable 1: Run concurrent endpoint and regional health checks"
    tasks:
      - id: probe_primary_gateway
        type: io.kestra.plugin.core.http.Request
        uri: "https://jsonplaceholder.typicode.com/todos/1"
        method: GET

      - id: probe_replica_gateway
        type: io.kestra.plugin.core.http.Request
        uri: "https://jsonplaceholder.typicode.com/todos/2"
        method: GET

      - id: log_probe_heartbeat
        type: io.kestra.plugin.core.log.Log
        level: INFO
        message: "Pre-flight network probes dispatched for {{ inputs.target_service }}"

  - id: query_staging_partitions
    type: io.kestra.plugin.jdbc.duckdb.Query
    description: "Extract active ingestion micro-batches using embedded DuckDB SQL"
    sql: |
      SELECT 'batch_101' AS batch_id, 1250 AS rows_ingested, 'VALID' AS schema_state
      UNION ALL
      SELECT 'batch_102' AS batch_id, 1420 AS rows_ingested, 'VALID' AS schema_state
      UNION ALL
      SELECT 'batch_103' AS batch_id, 980  AS rows_ingested, 'VALID' AS schema_state;
    fetchType: FETCH

  - id: evaluate_drift_and_sla
    type: io.kestra.plugin.scripts.python.Script
    description: "Compare batch telemetry against SLA thresholds and build remediation manifest"
    beforeCommands:
      - pip install kestra
    script: |
      from kestra import Kestra

      batch_count = {{ outputs.query_staging_partitions.size }}
      peak_latency = {{ inputs.observed_p95_ms }}
      max_latency = {{ inputs.max_latency_ms }}

      is_healthy = peak_latency <= max_latency
      status_label = "HEALTHY_COMMIT" if is_healthy else "QUARANTINE_REQUIRED"
      summary = f"Verified {batch_count} batches (p95: {peak_latency}ms / max: {max_latency}ms)"

      print(f"[{status_label}] {summary}")

      Kestra.outputs({
          'is_healthy': is_healthy,
          'status_label': status_label,
          'summary': summary,
          'batch_count': batch_count
      })

  - id: sync_downstream_consumers
    type: io.kestra.plugin.core.flow.Sequential
    description: "Flowable 2: Sequentially update watermarks across dependent consumer services"
    tasks:
      - id: sync_billing_ledger
        type: io.kestra.plugin.core.log.Log
        level: INFO
        message: "Synced watermark for [billing-ledger-worker] -> {{ outputs.evaluate_drift_and_sla.vars.status_label }}"

      - id: sync_fraud_engine
        type: io.kestra.plugin.core.log.Log
        level: INFO
        message: "Synced watermark for [fraud-scoring-engine] -> {{ outputs.evaluate_drift_and_sla.vars.status_label }}"

      - id: sync_warehouse_loader
        type: io.kestra.plugin.core.log.Log
        level: INFO
        message: "Synced watermark for [warehouse-hourly-sync] -> {{ outputs.evaluate_drift_and_sla.vars.status_label }}"

  - id: route_batch_disposition
    type: io.kestra.plugin.core.flow.If
    description: "Flowable 3: Conditional promotion vs quarantine"
    condition: "{{ outputs.evaluate_drift_and_sla.vars.is_healthy == true }}"
    then:
      - id: promote_staging_partition
        type: io.kestra.plugin.core.log.Log
        level: INFO
        message: "Promoting {{ outputs.evaluate_drift_and_sla.vars.batch_count }} validated micro-batches for {{ inputs.target_service }} to production."

      - id: record_sla_compliance
        type: io.kestra.plugin.core.log.Log
        level: INFO
        message: "[SLA VERIFIED] {{ outputs.evaluate_drift_and_sla.vars.summary }}"
    else:
      - id: isolate_corrupt_partition
        type: io.kestra.plugin.core.log.Log
        level: WARN
        message: "[QUARANTINE TRIGGERED] Holding back staging partition for {{ inputs.target_service }}."

  - id: finalize_audit_ledger
    type: io.kestra.plugin.core.log.Log
    level: INFO
    message: "Completed 12-stage audit run {{ execution.id }} with status: {{ outputs.evaluate_drift_and_sla.vars.status_label }}"
