id: nasa-eonet-natural-hazard-geospatial-router
namespace: company.data

description: |
  Ingest real-time Earth Observatory Natural Event Tracker (EONET) events from NASA,
  execute geospatial distance evaluations against corporate site coordinates using DuckDB
  spatial math, generate Parquet archives and incident summaries, maintain alert state via KV store,
  and dispatch proximity hazard alerts.

inputs:
  - id: facilities
    type: JSON
    description: List of facility locations to monitor for nearby severe natural hazards.
    defaults: |
      [
        {"name": "Phoenix Regional Hub", "lat": 33.4484, "lon": -112.0740},
        {"name": "Tokyo Data Center", "lat": 35.6762, "lon": 139.6503},
        {"name": "Sydney Logistics Center", "lat": -33.8688, "lon": 151.2093},
        {"name": "London Headquarters", "lat": 51.5074, "lon": -0.1278}
      ]

  - id: hazard_radius_km
    type: INT
    defaults: 500
    description: Distance threshold in kilometers triggering a natural hazard proximity alert.

  - id: state_key
    type: STRING
    defaults: nasa_eonet_processed_events_state
    description: Kestra KV store key tracking previously notified natural hazard event IDs.

concurrency:
  limit: 1
  behavior: CANCEL

triggers:
  - id: hourly_poll
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 * * * *"
    description: Check for updated NASA natural hazard events hourly.

tasks:
  - id: fetch_state
    type: io.kestra.plugin.core.kv.Get
    key: "{{ inputs.state_key }}"
    errorOnMissing: false

  - id: ingest_and_evaluate_proximity
    type: io.kestra.plugin.scripts.shell.Commands
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install duckdb requests
    env:
      FACILITIES: "{{ inputs.facilities }}"
      RADIUS_KM: "{{ inputs.hazard_radius_km }}"
      KNOWN_EVENTS: "{{ outputs.fetch_state.value ?? '[]' }}"
    commands:
      - |
        python3 - << 'EOF'
        import os
        import json
        import math
        import requests
        import duckdb

        facilities = json.loads(os.environ.get("FACILITIES", "[]"))
        radius_km = float(os.environ.get("RADIUS_KM", 500))
        known_events = set(json.loads(os.environ.get("KNOWN_EVENTS", "[]")))

        url = "https://eonet.gsfc.nasa.gov/api/v3/events?status=open&limit=50"
        headers = {"User-Agent": "Kestra-EONET-Ingest/2.0"}
        
        response = requests.get(url, headers=headers, timeout=30)
        response.raise_for_status()
        data = response.json()
        raw_events = data.get("events", [])

        # Flatten records with coordinate geometry
        flattened = []
        for ev in raw_events:
            ev_id = ev.get("id")
            title = ev.get("title")
            category = ev.get("categories", [{}])[0].get("title", "Unknown")
            geometries = ev.get("geometry", [])
            if not geometries:
                continue
            latest_geo = geometries[-1]
            coords = latest_geo.get("coordinates", [])
            if len(coords) < 2 or not isinstance(coords[0], (int, float)):
                continue
            lon, lat = coords[0], coords[1]
            geo_date = latest_geo.get("date")

            flattened.append({
                "event_id": ev_id,
                "title": title,
                "category": category,
                "event_date": geo_date,
                "event_lat": float(lat),
                "event_lon": float(lon)
            })

        with open("raw_events.json", "w", encoding="utf-8") as f:
            json.dump(flattened, f)

        with open("facilities.json", "w", encoding="utf-8") as f:
            json.dump(facilities, f)

        con = duckdb.connect()
        con.execute("""
            CREATE TABLE events AS SELECT * FROM read_json_auto('raw_events.json');
            CREATE TABLE facilities AS SELECT * FROM read_json_auto('facilities.json');
        """)

        # Cross join and calculate Haversine distance
        proximity_df = con.execute("""
            SELECT 
                f.name AS facility_name,
                f.lat AS facility_lat,
                f.lon AS facility_lon,
                e.event_id,
                e.title AS hazard_title,
                e.category AS hazard_category,
                e.event_date,
                e.event_lat,
                e.event_lon,
                ROUND(6371 * 2 * ASIN(SQRT(
                    POWER(SIN(RADIANS(e.event_lat - f.lat) / 2), 2) +
                    COS(RADIANS(f.lat)) * COS(RADIANS(e.event_lat)) *
                    POWER(SIN(RADIANS(e.event_lon - f.lon) / 2), 2)
                )), 1) AS distance_km
            FROM facilities f
            CROSS JOIN events e
        """).df()

        # Save complete datasets
        con.execute("CREATE TABLE all_proximities AS SELECT * FROM proximity_df")
        con.execute("COPY all_proximities TO 'natural_hazards_proximity.parquet' (FORMAT PARQUET)")
        con.execute("COPY all_proximities TO 'natural_hazards_proximity.csv' (HEADER, DELIMITER ',')")

        # Filter actionable alerts within radius not yet notified
        active_threats = proximity_df[proximity_df["distance_km"] <= radius_km]
        new_alerts = []
        for _, row in active_threats.iterrows():
            composite_key = f"{row['facility_name']}::{row['event_id']}"
            if composite_key not in known_events:
                new_alerts.append({
                    "facility": row["facility_name"],
                    "event_id": row["event_id"],
                    "title": row["hazard_title"],
                    "category": row["hazard_category"],
                    "distance_km": float(row["distance_km"])
                })
                known_events.add(composite_key)

        summary = {
            "total_open_events": len(raw_events),
            "threats_detected": len(active_threats),
            "new_notifications": len(new_alerts),
            "new_alerts": new_alerts,
            "updated_state": list(known_events)
        }

        print(f"::{{'outputs': {json.dumps(summary)}}}::")
        EOF
    outputFiles:
      - natural_hazards_proximity.parquet
      - natural_hazards_proximity.csv

  - id: handle_alerts
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.ingest_and_evaluate_proximity.vars.new_notifications > 0 }}"
    then:
      - id: log_threats
        type: io.kestra.plugin.core.log.Log
        level: WARN
        message: "🚨 Natural Hazard Proximity Alert: Detected {{ outputs.ingest_and_evaluate_proximity.vars.new_notifications }} facility threat(s) within {{ inputs.hazard_radius_km }}km."

      - id: update_state
        type: io.kestra.plugin.core.kv.Set
        key: "{{ inputs.state_key }}"
        value: "{{ outputs.ingest_and_evaluate_proximity.vars.updated_state | toJson }}"

outputs:
  - id: total_events
    type: INT
    value: "{{ outputs.ingest_and_evaluate_proximity.vars.total_open_events }}"
  - id: new_alerts_count
    type: INT
    value: "{{ outputs.ingest_and_evaluate_proximity.vars.new_notifications }}"
  - id: dataset_parquet
    type: FILE
    value: "{{ outputs.ingest_and_evaluate_proximity.outputFiles['natural_hazards_proximity.parquet'] }}"

extend:
  title: NASA EONET Natural Hazard Geospatial Distance Router with DuckDB
  metaTitle: NASA EONET Natural Hazard Geospatial Router | Kestra
  shortDescription: Evaluates real-time NASA EONET natural hazards against corporate facilities using DuckDB Haversine geospatial math.
  metaDescription: Ingest NASA EONET hazard events, compute facility distances via DuckDB spatial math in Parquet, and alert on active threats.
  tags:
    - Data
  subTags:
    - ELT & Warehouse Loading
    - File & Data Processing Basics
  ee: false
  demo: false
  description: |
    Orchestrate automated, reliable synchronization of live global natural hazards tracked by
    the NASA Earth Observatory Natural Event Tracker (EONET) API and evaluate spatial proximity
    against critical operational infrastructure using DuckDB.

    ## How it works

    1. **State Recovery**: Reads previous facility-hazard notifications from Kestra KV store (`nasa_eonet_processed_events_state`) to prevent notification spam.
    2. **NASA EONET Ingestion**: Connects to the public NASA EONET v3 REST endpoint to retrieve active wildfires, severe storms, volcanoes, and sea ice events.
    3. **Geospatial Distance Modeling**: Executes Haversine distance computations in DuckDB across all facility-event pairs inside an isolated Docker container.
    4. **Analytical Lake Export**: Exports normalized proximity records to columnar Parquet and CSV for historical incident reporting.
    5. **Threshold Routing & Alerting**: Flags hazards within the configured kilometer radius, emits operational alerts, and persists state in Kestra KV store.

    ## What you get

    - Automated hourly monitoring of real-world global natural hazards directly from NASA's Earth Science division.
    - Mathematical Haversine proximity calculations with zero external GIS service dependencies.
    - Lakehouse-ready Parquet datasets capturing event categories, coordinates, and calculated distances.

    ## Who it's for

    - Disaster recovery, business continuity, and site reliability teams managing distributed physical facilities.
    - Supply chain operations monitoring regional weather and wildfire disruptions.
    - Geospatial data engineers building environmental data lakes.

    ## Why orchestrate this with Kestra

    - Built-in KV store maintains event alert history across recurring executions without external databases.
    - Ephemeral Docker execution guarantees isolated Python and DuckDB dependencies.
    - Rich declarative flow control handles branching, logging, and state updates transparently.

    ## Prerequisites

    - Docker runtime configured on the Kestra worker.
    - Outbound internet access to `eonet.gsfc.nasa.gov`.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: (Optional) Webhook URL for forwarding high-priority hazard alerts.

    ## Quick start

    1. Import this blueprint into your Kestra instance.
    2. Provide your facility name and latitude/longitude coordinates in the `facilities` input JSON.
    3. Click **Execute** to run an on-demand proximity evaluation.
    4. Enable the `hourly_poll` trigger for continuous background monitoring.

    ## How to extend

    - Connect a downstream S3 or GCS upload task to store weekly snapshots of global hazard history.
    - Integrate SMS or PagerDuty notification plugins for hazards under 50 km.

    ## Links

    - [NASA EONET API v3 Documentation](https://eonet.gsfc.nasa.gov/docs/v3)
    - [DuckDB SQL Math Functions](https://duckdb.org/docs/sql/functions/numeric)
    - [Kestra Task Runners](https://kestra.io/docs/task-runners)
