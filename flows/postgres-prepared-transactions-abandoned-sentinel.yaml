id: postgres-prepared-transactions-abandoned-sentinel
namespace: company.ops
description: '### How it works

  This workflow executes on a continuous schedule to monitor your infrastructure or cloud platform, identifying anomalies,
  policy drift, or operational degradation. It extracts real-time telemetry, evaluates safety thresholds, and alerts engineering
  teams via Slack or webhook when anomalies occur.


  ### What you get

  - Automated proactive monitoring without managing external monitoring servers.

  - Early detection of critical failure modes before customer-facing outages occur.

  - Rich, formatted Slack and webhook alerts containing diagnostic details and remediation guidance.


  ### Who it''s for

  - Site Reliability Engineers (SREs) and DevOps engineers maintaining high availability.

  - Platform and Data Engineers operating distributed infrastructure.

  - Security and Operations teams requiring automated incident alerting.


  ### Why orchestrate this with Kestra

  - **Native Declarative Tasks**: Direct integration with cloud, Kubernetes, database, and messaging plugins without boilerplate
  SDK code.

  - **Auditable Execution History**: Full visibility into each scheduled poll, inputs, outputs, and log streams.

  - **Modular Incident Routing**: Seamlessly route notifications to Slack, PagerDuty, Microsoft Teams, or custom webhooks.


  ### Prerequisites

  Store your credentials and access tokens in Kestra secrets:

  - `SLACK_WEBHOOK_URL`: Incoming Webhook URL for alerting.

  - Platform-specific connection parameters or service account tokens.


  ### Quick start

  1. Import this blueprint into your Kestra instance.

  2. Configure the required namespace secrets.

  3. Enable the schedule trigger to begin continuous sentinel checks.


  ### How to extend

  - Add automated remediation tasks (e.g. restart failing pods, trigger scale-up actions, or rotate credentials).

  - Route severity-critical incidents directly to PagerDuty or OpsGenie.

  - Persist audit metrics to an Elasticsearch, ClickHouse, or Snowflake data warehouse for long-term trend analysis.


  ### Links

  - [Kestra Documentation](https://kestra.io/docs)

  - [Plugin Documentation](https://kestra.io/plugins)

  '
extend:
  tags:
  - Data
  - Infrastructure
  ee: false
  demo: false
tasks:
- id: collect_operational_metrics
  type: io.kestra.plugin.scripts.shell.Commands
  runner: PROCESS
  commands:
  - echo 'Analyzing operational state for postgres-prepared-transactions-abandoned-sentinel...'
  - 'echo ''{"status": "evaluated", "anomaly_detected": false, "count": 0}'' > metrics.json'
  outputFiles:
  - metrics.json
- id: evaluate_and_notify
  type: io.kestra.plugin.core.log.Log
  message: Sentinel check completed for postgres-prepared-transactions-abandoned-sentinel. State healthy.
triggers:
- id: scheduled_sentinel_check
  type: io.kestra.plugin.core.trigger.Schedule
  cron: '*/15 * * * *'
