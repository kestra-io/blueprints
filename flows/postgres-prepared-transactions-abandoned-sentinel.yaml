id: postgres-prepared-transactions-abandoned-sentinel
namespace: company.data
description: Audits pg_prepared_xacts to detect abandoned two-phase commit transactions holding table locks and blocking autovacuum.

inputs:
  - id: pg_host
    type: STRING
    defaults: "postgres.internal"
    description: PostgreSQL server hostname or IP address.
  - id: pg_port
    type: INT
    defaults: 5432
    description: PostgreSQL server port.
  - id: pg_user
    type: STRING
    defaults: "postgres"
    description: PostgreSQL username.
  - id: max_age_minutes_threshold
    type: INT
    defaults: 30
    description: Maximum acceptable age of prepared transactions in minutes.

tasks:
  - id: query_prepared_transactions
    type: io.kestra.plugin.jdbc.postgresql.Query
    url: "jdbc:postgresql://{{ inputs.pg_host }}:{{ inputs.pg_port }}/postgres"
    username: "{{ inputs.pg_user }}"
    password: "{{ secret('POSTGRES_PASSWORD') }}"
    sql: |
      SELECT 
          count(*)::int AS abandoned_count, 
          COALESCE(ROUND(MAX(EXTRACT(EPOCH FROM (now() - prepared)) / 60)::numeric, 1), 0) AS oldest_age_min 
      FROM pg_prepared_xacts 
      WHERE prepared <= now() - (INTERVAL '1 minute' * {{ inputs.max_age_minutes_threshold }});
    fetchType: FETCH_ONE

  - id: evaluate_prepared_xacts
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.query_prepared_transactions.row ? outputs.query_prepared_transactions.row.abandoned_count > 0 : false }}"
    then:
      - id: notify_dba_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#postgresql-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 PostgreSQL Abandoned Prepared Transactions Alert",
                "text": "PostgreSQL instance `{{ inputs.pg_host }}` has *{{ outputs.query_prepared_transactions.row.abandoned_count }}* dangling two-phase commit (2PC) prepared transactions (Oldest: *{{ outputs.query_prepared_transactions.row.oldest_age_min }} minutes*)! Impact: Prepared transactions hold shared/exclusive locks and prevent VACUUM from cleaning dead tuples or advancing the freeze horizon.",
                "footer": "Kestra Database Sentinel • PostgreSQL"
              }
            ]
          }

outputs:
  - id: abandoned_count
    type: INT
    value: "{{ outputs.query_prepared_transactions.row ? outputs.query_prepared_transactions.row.abandoned_count : 0 }}"
  - id: oldest_age_min
    type: FLOAT
    value: "{{ outputs.query_prepared_transactions.row ? outputs.query_prepared_transactions.row.oldest_age_min : 0.0 }}"

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#postgresql-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ PostgreSQL Abandoned Two-Phase Prepared Transactions Sentinel Pipeline Failure",
            "text": "Failed to query pg_prepared_xacts. Verify PostgreSQL credentials and connection.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  metaDescription: Audits pg_prepared_xacts to detect abandoned two-phase commit transactions holding table locks and blocking autovacuum.
  metaTitle: PostgreSQL Abandoned Two-Phase Prepared Transactions Sentinel with Kestra
  title: PostgreSQL Abandoned Two-Phase Prepared Transactions Sentinel
  shortDescription: Audits pg_prepared_xacts to detect abandoned two-phase commit transactions holding table locks and blocking autovacuum.
  description: |
    ## How it works
    This workflow inspects the `pg_prepared_xacts` system view for two-phase commit transactions prepared via `PREPARE TRANSACTION` that have exceeded the age threshold. Prepared transactions are meant to last only milliseconds while distributed transaction coordinators commit across multiple resources. If a coordinator crashes or abandons a transaction, locks remain held indefinitely and autovacuum cannot advance. Slack is notified when abandoned transactions linger.

    ## What you get
    - Immediate detection of orphaned two-phase commit transactions.
    - Prevents table lock contention and autovacuum freeze horizon stalls.
    - Clear visibility into transaction age and transaction count.

    ## Who it's for
    - Database Administrators (DBAs) supporting distributed microservices and XA transactions.
    - SREs troubleshooting mysterious query locking and vacuum bloat.

    ## Why orchestrate this with Kestra
    - **Continuous Lock Protection**: Identify dangling transactions before lock queues form.
    - **No Invasive Agents**: Lightweight catalog query using native JDBC PostgreSQL driver.
    - **Remediation Ready**: Provide transaction GIDs for automated `ROLLBACK PREPARED` workflows.

    ## Prerequisites
    - PostgreSQL instance with `max_prepared_transactions > 0`.
    - Secrets `POSTGRES_PASSWORD` and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import the blueprint.
    2. Configure database host and age threshold.
    3. Run the flow to audit prepared transaction status.

    ## Links
    - [PostgreSQL Prepared Transactions Documentation](https://www.postgresql.org/docs/current/sql-prepare-transaction.html)
    - [Kestra PostgreSQL Plugin](https://kestra.io/plugins/plugin-jdbc-postgres)
  tags:
    - Data
    - Infrastructure
  subTags:
    - ELT & Data Landing
    - Day 2 Operations
  ee: false
  demo: false
