id: protobuf-binary-contract-and-schema-compliance-gate
namespace: company.data

labels:
  env: production
  domain: data-engineering
  compliance: schema-governance

inputs:
  - id: schema_type_name
    type: STRING
    defaults: company.telemetry.SensorMetricBatch
    description: Fully-qualified Protobuf message type to decode and validate against the descriptor.

  - id: min_expected_records
    type: INT
    defaults: 1
    description: Minimum number of valid Protobuf records required to pass the ingestion compliance gate.

tasks:
  - id: stage_schema_and_payload
    type: io.kestra.plugin.scripts.shell.Commands
    description: Synthesize the canonical Protobuf contract and compile a binary descriptor set using protoc.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    outputFiles:
      - schema.desc
      - payload.pb
    commands:
      - pip install --quiet protobuf grpcio-tools
      - |
        cat << 'EOF' > schema.proto
        syntax = "proto3";

        package company.telemetry;

        message SensorReading {
          string device_id = 1;
          string location = 2;
          double temperature_celsius = 3;
          double humidity_percent = 4;
          int64 recorded_at_epoch_ms = 5;
        }

        message SensorMetricBatch {
          string batch_id = 1;
          int64 generated_at_epoch_ms = 2;
          repeated SensorReading readings = 3;
        }
        EOF
      - python -m grpc_tools.protoc --proto_path=. --descriptor_set_out=schema.desc schema.proto
      - |
        python3 -c "
        import schema_pb2, time

        batch = schema_pb2.SensorMetricBatch()
        batch.batch_id = 'batch-2026-prod-001'
        batch.generated_at_epoch_ms = int(time.time() * 1000)

        for i in range(1, 4):
            reading = batch.readings.add()
            reading.device_id = f'sensor-edge-{i:03d}'
            reading.location = 'datacenter-iad-rack-04'
            reading.temperature_celsius = 21.4 + (i * 0.3)
            reading.humidity_percent = 44.5 + (i * 0.2)
            reading.recorded_at_epoch_ms = int(time.time() * 1000)

        with open('payload.pb', 'wb') as f:
            f.write(batch.SerializeToString())
        "

  - id: decode_protobuf_stream
    type: io.kestra.plugin.serdes.protobuf.ProtobufToIon
    description: Deserialize binary Protobuf payload using the compiled descriptor with strict schema enforcement.
    from: "{{ outputs.stage_schema_and_payload.outputFiles['payload.pb'] }}"
    descriptorFile: "{{ outputs.stage_schema_and_payload.outputFiles['schema.desc'] }}"
    typeName: "{{ inputs.schema_type_name }}"
    delimited: false
    errorOnUnknownFields: true

  - id: evaluate_contract_compliance
    type: io.kestra.plugin.core.flow.If
    description: Verify decoded record count against minimum threshold and route to alert or warehouse landing.
    condition: "{{ outputs.decode_protobuf_stream.size < inputs.min_expected_records }}"
    then:
      - id: alert_contract_breach
        type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
        description: Dispatch incident notification to Slack channel when payload is empty or violates contract.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "CRITICAL: Protobuf schema compliance breach in flow {{ flow.id }} (execution {{ execution.id }}). Expected at least {{ inputs.min_expected_records }} records, but decoded {{ outputs.decode_protobuf_stream.size }} records for message type {{ inputs.schema_type_name }}."
          }

      - id: fail_compliance_gate
        type: io.kestra.plugin.core.execution.Fail
        description: Terminate execution with failure status to prevent downstream consumption of invalid binary data.
        errorMessage: "Protobuf ingestion breached contract: expected at least {{ inputs.min_expected_records }} records, but received {{ outputs.decode_protobuf_stream.size }}."
    else:
      - id: convert_ion_to_json
        type: io.kestra.plugin.serdes.json.IonToJson
        description: Convert validated internal Amazon Ion records to newline-delimited JSON for analytical landing.
        from: "{{ outputs.decode_protobuf_stream.uri }}"

  - id: audit_compliance_certification
    type: io.kestra.plugin.core.log.Log
    description: Record compliance audit trail with message count, schema definition, and storage destination.
    message: "Protobuf contract certified: message_type={{ inputs.schema_type_name }}, records_decoded={{ outputs.decode_protobuf_stream.size }}, ion_storage_uri={{ outputs.decode_protobuf_stream.uri }}, status=COMPLIANT"

triggers:
  - id: schedule_sentinel
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"

extend:
  title: Protobuf Binary Contract and Schema Compliance Gate
  metaTitle: Protobuf Binary Contract & Schema Compliance Gate | Kestra
  shortDescription: Validate binary Protocol Buffers against compiled descriptors, reject contract violations, and alert Slack on schema drift.
  metaDescription: Automated Kestra gate validating binary Protobuf payloads against compiled descriptors with unknown-field enforcement and Slack failure alerts.
  description: |
    Validates binary Protocol Buffers (Protobuf) payloads against compiled FileDescriptorSet schemas before ingestion into data lakes or stream processors. By enforcing contract adherence with unknown-field rejection, this workflow prevents silent serialization failures and data corruption across downstream analytics pipelines.

    ## How it works

    1. **Scheduled Trigger**: An automated schedule triggers every 15 minutes to inspect incoming Protobuf binary batches from ingest partitions or edge collectors.
    2. **Contract Staging and Compilation**: The `stage_schema_and_payload` task defines the canonical Protocol Buffers schema, compiles a binary `FileDescriptorSet` (`.desc`) using the Google `protoc` compiler, and prepares the binary event stream.
    3. **Protobuf Deserialization and Gate**: The `decode_protobuf_stream` task (`io.kestra.plugin.serdes.protobuf.ProtobufToIon`) deserializes the binary payload using the compiled schema descriptor and verifies message structure. With `errorOnUnknownFields: true`, any unauthorized schema mutations immediately trigger a task exception.
    4. **Contract Threshold Evaluation**: The `evaluate_contract_compliance` flow control task evaluates whether the decoded record volume meets the minimum threshold (`inputs.min_expected_records`).
    5. **Incident Dispatch or Quarantine**: If decoded records fall below the contract threshold or schema deserialization fails, `alert_contract_breach` dispatches an urgent alert to Slack with execution diagnostics, followed by `fail_compliance_gate` to block downstream processing.
    6. **Format Normalization and Staging**: For compliant batches, `convert_ion_to_json` transforms the internal Amazon Ion representation into newline-delimited JSON ready for warehouse loading.
    7. **Audit Trail Logging**: The `audit_compliance_certification` task emits a structured compliance event recording the validated type, record count, and artifact URI.

    ## What you get

    - Automated binary schema contract verification for high-throughput Protobuf streams.
    - Zero-tolerance unknown-field rejection preventing undocumented schema drift.
    - Real-time Slack notifications alerting data engineering teams to broken serialization contracts.
    - Automated format conversion from raw Protobuf binary to newline-delimited JSON for data warehouse staging.
    - Comprehensive audit logging documenting message volumes and compliance status.

    ## Who it's for

    - Data Platform Engineers managing Kafka, Pub/Sub, or IoT event ingress pipelines.
    - Analytics Engineers building reliable Lakehouse ingestion from gRPC and microservice events.
    - Site Reliability Engineers guarding data contract integrity between microservices.

    ## Why orchestrate this with Kestra

    - Declarative YAML orchestration replaces fragile custom validation microservices.
    - Native `ProtobufToIon` plugin handles high-speed streaming binary decoding without writing boilerplates.
    - Built-in conditional branching (`If`) isolates invalid payloads before they pollute production warehouses.
    - Centralized secret management protects Slack webhook credentials without hardcoding URLs.
    - End-to-end execution history and metrics track Protobuf record throughput over time.

    ## Prerequisites

    - A container runtime or process runner capable of running `python:3.11-slim` with network access to fetch `protobuf` compiler tools.
    - Slack incoming webhook URL with permissions to post incident alerts into an operations channel.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL used to dispatch contract breach notifications (required).

    ## Quick start

    1. Store your Slack webhook URL in Kestra namespace secrets under the key `SLACK_WEBHOOK_URL`.
    2. Import this blueprint into your Kestra workspace under namespace `company.data`.
    3. Click **Execute** to run an initial verification with the default telemetry schema.
    4. Verify task execution logs in the Kestra UI to confirm `decode_protobuf_stream` output size.
    5. Enable the `schedule_sentinel` trigger for continuous contract verification.

    ## How to extend

    - Connect downstream storage tasks (`io.kestra.plugin.aws.s3.Upload` or `io.kestra.plugin.gcp.gcs.Upload`) to archive validated JSON or Parquet batches directly to cloud object storage.
    - Replace the synthetic contract stage with dynamic schema fetching from a Confluent Schema Registry or GitHub repository.
    - Add automated dead-letter queue routing (`io.kestra.plugin.kafka.Produce` or `io.kestra.plugin.amqp.Produce`) to isolate non-compliant messages for debugging.

    ## Links

    - [Kestra Serdes Protobuf Plugin Documentation](https://kestra.io/plugins/plugin-serdes/protobuf/io.kestra.plugin.serdes.protobuf.protobuftoion)
    - [Kestra Slack Notification Plugin Documentation](https://kestra.io/plugins/plugin-notifications/slack/io.kestra.plugin.notifications.slack.slackincomingwebhook)
    - [Protocol Buffers Language Guide](https://protobuf.dev/programming-guides/proto3/)
  tags:
    - Data
  subTags:
    - Testing & Quality
    - Realtime & Streaming
  ee: false
  demo: false
