id: mongodb-cdc-change-stream-and-oplog-lag-sentinel
namespace: company.data

inputs:
  - id: hostname
    type: STRING
    defaults: "localhost"
    description: Hostname or IP address of the target MongoDB replica set primary host.

  - id: port
    type: STRING
    defaults: "27017"
    description: Port number on which the MongoDB instance is listening.

  - id: connection_string
    type: STRING
    defaults: "mongodb://localhost:27017/?replicaSet=rs0"
    description: Connection string to the target MongoDB replica set or sharded cluster (must include replicaSet parameter).

  - id: included_collections
    type: STRING
    defaults: "production[.]*"
    description: Regular expression matching database and collection namespaces to monitor (e.g. production[.]*).

  - id: max_records
    type: INT
    defaults: 200
    description: Maximum number of change events to drain from the MongoDB oplog per audit cycle.

  - id: backlog_critical_threshold
    type: INT
    defaults: 50
    description: Number of accumulated change events in the polling window that indicates severe CDC ingestion lag.

  - id: max_wait_seconds
    type: INT
    defaults: 10
    description: Maximum duration in seconds to wait for incoming change events before closing the batch.

  - id: state_name
    type: STRING
    defaults: "mongodb-cdc-checkpoint"
    description: Kestra KV store key used to durably persist the Debezium oplog resume token and offset state.

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 */2 * * *"
    disabled: true
    inputs:
      hostname: "localhost"
      port: "27017"
      connection_string: "mongodb://localhost:27017/?replicaSet=rs0"
      included_collections: "production[.]*"
      max_records: 200
      backlog_critical_threshold: 50
      max_wait_seconds: 10
      state_name: "mongodb-cdc-checkpoint"

tasks:
  - id: probe_cdc_backlog
    type: io.kestra.plugin.debezium.mongodb.Capture
    hostname: "{{ inputs.hostname }}"
    port: "{{ inputs.port }}"
    connectionString: "{{ inputs.connection_string }}"
    snapshotMode: NO_DATA
    includedCollections: "{{ inputs.included_collections }}"
    maxRecords: "{{ inputs.max_records }}"
    maxWait: "PT{{ inputs.max_wait_seconds }}S"
    stateName: "{{ inputs.state_name }}"
    format: INLINE
    allowFailure: true
    description: Drains pending change data capture records from MongoDB change streams into internal storage and commits the resume token.

  - id: classify_cdc_posture
    type: io.kestra.plugin.core.debug.Return
    format: >-
      {{
        (outputs.probe_cdc_backlog is not defined or outputs.probe_cdc_backlog.size is not defined) ? 'CDC_PROBE_FAILED' :
        (outputs.probe_cdc_backlog.size >= inputs.backlog_critical_threshold) ? 'CRITICAL_OPLOG_LAG' :
        (outputs.probe_cdc_backlog.size > 0) ? 'ACTIVE_STREAMING' :
        'QUIET_HEALTHY'
      }}
    description: Evaluates change event volume against critical lag thresholds to classify replication health.

  - id: route_posture_action
    type: io.kestra.plugin.core.flow.Switch
    value: "{{ outputs.classify_cdc_posture.value }}"
    cases:
      CRITICAL_OPLOG_LAG:
        - id: alert_critical_oplog_lag
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: "{{ {'text': '*[CRITICAL]: MongoDB CDC Oplog Lag Breach*\n• *Endpoint:* `' ~ inputs.connection_string ~ '`\n• *Captured Events:* ' ~ outputs.probe_cdc_backlog.size ~ ' (Threshold: ' ~ inputs.backlog_critical_threshold ~ ')\n• *State Checkpoint:* `' ~ (outputs.probe_cdc_backlog.stateOffsetKey ?? 'None') ~ '`\n• *Execution ID:* `' ~ execution.id ~ '`\n*Action Required:* Downstream consumers are falling behind oplog velocity; investigate consumer stalls before ChangeStreamHistoryLost occurs.'} | toJson }}"

      CDC_PROBE_FAILED:
        - id: alert_cdc_probe_failed
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: "{{ {'text': '*[ALERT]: MongoDB CDC Connection Failure*\n• *Endpoint:* `' ~ inputs.connection_string ~ '`\n• *Error:* Unable to establish Debezium Change Stream connection with MongoDB replica set.\n• *Execution ID:* `' ~ execution.id ~ '`'} | toJson }}"

      ACTIVE_STREAMING:
        - id: log_active_streaming
          type: io.kestra.plugin.core.log.Log
          message: "MongoDB CDC change stream active for {{ inputs.connection_string }}. Captured {{ outputs.probe_cdc_backlog.size }} change event(s) across monitored collections."

      QUIET_HEALTHY:
        - id: log_quiet_healthy
          type: io.kestra.plugin.core.log.Log
          message: "MongoDB CDC change stream healthy for {{ inputs.connection_string }}. Zero pending changes in oplog polling window."
    description: Dispatches high-priority Slack notifications or logs routine metrics based on classified status.

  - id: audit_sentinel_run
    type: io.kestra.plugin.core.log.Log
    message: "MongoDB CDC sentinel cycle finished for execution {{ execution.id }}. Verdict: {{ outputs.classify_cdc_posture.value }}, Captured records: {{ outputs.probe_cdc_backlog.size ?? 0 }}, Checkpoint key: {{ outputs.probe_cdc_backlog.stateOffsetKey ?? 'N/A' }}."
    description: Writes an immutable audit log entry documenting replication status and checkpoint keys.

errors:
  - id: alert_flow_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: "{{ {'text': '*[ERROR] MongoDB CDC Sentinel Execution Error*\nFlow failed during execution `' ~ execution.id ~ '` against `' ~ inputs.connection_string ~ '`. Inspect Kestra logs for details.'} | toJson }}"

extend:
  title: MongoDB CDC Change Stream and Oplog Replication Lag Sentinel
  metaTitle: MongoDB CDC Change Stream & Oplog Lag Sentinel | Kestra
  shortDescription: Monitor MongoDB replica sets for Change Data Capture (CDC) lag, drain oplog backlog, track resume tokens, and alert Slack.
  metaDescription: Audit MongoDB change streams with Debezium, track oplog backlog accumulation, commit KV resume checkpoints, and alert Slack before replication drops.
  description: |
    Enterprise data architectures streaming real-time mutations from MongoDB into search indexes, analytical lakehouses, or event brokers depend heavily on Change Streams and MongoDB's internal operation log (oplog). Under heavy transactional bursts or consumer stalls, replication lag accumulates rapidly. If the consumer falls behind the oplog retention window, unread events are permanently truncated, triggering fatal `ChangeStreamHistoryLost` exceptions that necessitate expensive, slow cluster-wide full table re-snapshots.

    This blueprint provides an autonomous Day 2 operations sentinel for MongoDB Change Data Capture. Scheduled on a 2-hour cadence, it utilizes embedded Debezium to probe real-time Change Streams, drains accumulated oplog mutations into durable Kestra internal storage, tracks resume tokens atomically within Kestra KV store, evaluates lag thresholds, and posts urgent Slack alerts before oplog rollover causes data loss.

    ## How it works

    1. The `periodic_schedule` trigger initiates the workflow every 2 hours with explicit default parameters, configured in a disabled state for initial verification.
    2. `probe_cdc_backlog` (`io.kestra.plugin.debezium.mongodb.Capture`) opens a Change Stream cursor against the configured MongoDB replica set with `snapshotMode: NO_DATA`. It samples up to `max_records` pending mutations within a bounded `maxWait` polling window, stores captured records in Kestra internal storage, and atomically commits the Debezium resume token into Kestra KV store under `state_name`.
    3. `classify_cdc_posture` (`io.kestra.plugin.core.debug.Return`) calculates the batch size and verifies task completion to produce a discrete operational verdict: `CRITICAL_OPLOG_LAG`, `CDC_PROBE_FAILED`, `ACTIVE_STREAMING`, or `QUIET_HEALTHY`.
    4. `route_posture_action` (`io.kestra.plugin.core.flow.Switch`) directs subsequent tasks: critical lag thresholds and connection dropouts trigger rich Slack webhook notifications with storage URIs and checkpoint keys, while nominal runs output diagnostic metrics.
    5. `audit_sentinel_run` (`io.kestra.plugin.core.log.Log`) writes an immutable summary entry capturing the execution ID, evaluated verdict, and checkpoint key for compliance auditing.
    6. A flow-level `errors` handler catches uncaught network timeouts or MongoDB authentication errors and alerts Slack immediately.

    ## What you get

    - Autonomous, non-intrusive surveillance of MongoDB replica set Change Streams without deploying external Kafka Connect clusters.
    - Early warning detection of oplog backlog surges before oplog window truncation forces catastrophic full re-snapshots.
    - Durable internal storage capture of sampled change event batches for inspection and downstream playback.
    - Atomic checkpoint persistence within Kestra KV store ensuring consistent resume token tracking.
    - Real-time Slack notifications detailing endpoint strings, record counts, and execution metadata.

    ## Who it's for

    - Data Platform Engineers and Analytics Engineers operating real-time CDC pipelines from MongoDB to Snowflake, BigQuery, or ClickHouse.
    - Site Reliability Engineers (SREs) and Database Administrators (DBAs) monitoring MongoDB replica set health and replication lag.
    - Backend Architects managing microservice event sourcing patterns driven by MongoDB Change Streams.

    ## Why orchestrate this with Kestra

    Operating standard Debezium connectors requires running Apache Kafka, Kafka Connect workers, schema registries, and external storage daemons, creating massive operational overhead and unmonitored failure points. Kestra embeds the Debezium MongoDB connector directly as a native task. It pairs change stream ingestion with declarative scheduling, native KV store state management, conditional flow-control routing, secret masking, and instant multi-channel alerting without external runtime infrastructure.

    ## Prerequisites

    - A running MongoDB replica set (version 4.4+) accessible over network with change streams enabled (`--replSet rs0`).
    - A MongoDB user account with `read` privileges on the target databases and the `local` database (for oplog access).
    - An incoming Slack Webhook URL configured in Kestra secrets.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: The destination Slack webhook URL for operational incident dispatching.
    - `MONGO_USER`: (Optional) MongoDB authentication username if credentials are not embedded directly in the connection string.
    - `MONGO_PASSWORD`: (Optional) MongoDB authentication password if credentials are not embedded directly in the connection string.

    ## Quick start

    1. Configure `SLACK_WEBHOOK_URL` in your Kestra namespace secrets.
    2. Start a local single-node MongoDB replica set container:
       ```bash
       docker run -d --name mongodb-sentinel          -p 27017:27017          mongo:6.0 --replSet rs0
       ```
    3. Initialize the replica set in MongoDB:
       ```bash
       docker exec -it mongodb-sentinel mongosh --eval "rs.initiate()"
       ```
    4. Connect the MongoDB container to your Kestra Docker network:
       ```bash
       docker network connect YOUR_KESTRA_NETWORK mongodb-sentinel
       ```
    5. Execute a manual test run in the Kestra UI and confirm that `QUIET_HEALTHY` is logged.
    6. Enable the `periodic_schedule` trigger to activate autonomous background monitoring.

    ## How to extend

    - Connect downstream storage tasks (`io.kestra.plugin.serdes.parquet.IonToParquet` and `io.kestra.plugin.aws.s3.Upload`) to archive captured change event streams to S3 or GCS data lakes.
    - Add automated consumer scaling triggers by integrating with Kubernetes or Docker tasks to scale downstream processor replicas when `CRITICAL_OPLOG_LAG` breaches occur.
    - Integrate with PagerDuty via `io.kestra.plugin.pagerduty` for critical on-call incident escalation when replication lag approaches oplog window limits.

    ## Links

    - [Kestra Debezium MongoDB Plugin Documentation](https://kestra.io/plugins/plugin-debezium-mongodb)
    - [Debezium MongoDB Connector Documentation](https://debezium.io/documentation/reference/stable/connectors/mongodb.html)
    - [MongoDB Change Streams Reference](https://www.mongodb.com/docs/manual/changeStreams/)
