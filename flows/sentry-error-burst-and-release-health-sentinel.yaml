id: sentry-error-burst-and-release-health-sentinel
namespace: company.monitoring

tasks:
  - id: fetch_project_issues
    type: io.kestra.plugin.fs.http.Request
    uri: "https://sentry.io/api/0/projects/{{ secret('SENTRY_ORG_SLUG') }}/{{ secret('SENTRY_PROJECT_SLUG') }}/issues/?query=is:unresolved&limit=25&sort=date"
    method: GET
    headers:
      Authorization: "Bearer {{ secret('SENTRY_AUTH_TOKEN') }}"
      Content-Type: "application/json"

  - id: analyze_error_burst
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.12-slim
    script: |
      import json
      import sys
      from datetime import datetime, timezone, timedelta
      from kestra import Kestra

      raw = {{ outputs.fetch_project_issues.body }}
      if not isinstance(raw, list):
          raise ValueError(f"Sentry API did not return a list of issues. Got: {type(raw)}. Check SENTRY_ORG_SLUG, SENTRY_PROJECT_SLUG, and SENTRY_AUTH_TOKEN.")

      if len(raw) == 0:
          raise ValueError("Sentry API returned an empty list. Verify the project slug and token permissions.")

      cutoff = datetime.now(timezone.utc) - timedelta(hours=1)
      burst_threshold = 10
      critical_events_threshold = 500

      recent_issues = []
      total_recent_events = 0

      for issue in raw:
          last_seen_str = issue.get("lastSeen")
          if not last_seen_str:
              raise ValueError(f"Sentry issue {issue.get('id')} is missing 'lastSeen' field. API response may be malformed.")

          last_seen = datetime.fromisoformat(last_seen_str.replace("Z", "+00:00"))
          count = int(issue.get("count", 0))

          if last_seen >= cutoff:
              recent_issues.append({
                  "id": issue.get("id"),
                  "title": issue.get("title"),
                  "count": count,
                  "lastSeen": last_seen_str,
                  "permalink": issue.get("permalink", "")
              })
              total_recent_events += count

      burst_detected = len(recent_issues) >= burst_threshold or total_recent_events >= critical_events_threshold

      print(f"Sentry Error Burst Analysis:")
      print(f"  Recent issues (last 1h): {len(recent_issues)}")
      print(f"  Total recent events: {total_recent_events}")
      print(f"  Burst threshold: {burst_threshold} issues / {critical_events_threshold} events")
      print(f"  Alert required: {burst_detected}")

      top_issues = sorted(recent_issues, key=lambda x: x["count"], reverse=True)[:5]

      Kestra.outputs({
          "recent_issue_count": len(recent_issues),
          "total_recent_events": total_recent_events,
          "burst_detected": burst_detected,
          "top_issues": top_issues
      })

  - id: burst_alert_gate
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.analyze_error_burst.vars.burst_detected }}"
    then:
      - id: notify_slack_on_burst
        type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": ":rotating_light: *Sentry Error Burst Detected*\nProject: `{{ secret('SENTRY_PROJECT_SLUG') }}`\nRecent Issues (1h): `{{ outputs.analyze_error_burst.vars.recent_issue_count }}`\nTotal Events: `{{ outputs.analyze_error_burst.vars.total_recent_events }}`\nImmediate investigation required."
          }

  - id: log_sentinel_summary
    type: io.kestra.plugin.core.log.Log
    message: "Sentry sentinel completed. Project: {{ secret('SENTRY_PROJECT_SLUG') }}, Recent issues: {{ outputs.analyze_error_burst.vars.recent_issue_count }}, Burst detected: {{ outputs.analyze_error_burst.vars.burst_detected }}"

triggers:
  - id: every_fifteen_minutes
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"

extend:
  title: Sentry Error Burst and Release Health Sentinel
  metaTitle: Sentry Error Burst Sentinel | Kestra
  shortDescription: Automated Sentry error burst detection and release health monitoring with Slack alerting.
  metaDescription: Monitor Sentry projects for error bursts, detect event spikes in real time, and trigger Slack incident alerts automatically with Kestra.
  description: |
    Automated error burst detection and release health sentinel for Sentry projects using the Sentry Issues API and real-time threshold evaluation.

    ## How it works

    1. A schedule trigger fires every 15 minutes to audit recent Sentry error activity.
    2. The HTTP request task queries the Sentry Issues API for the 25 most recently updated unresolved issues in the target project.
    3. An inline Python task parses the issue list, filters for events seen within the last hour, and evaluates both issue count and total event volume against burst thresholds.
    4. The task raises an explicit exception if the Sentry API returns malformed data or invalid credentials, ensuring the flow fails loudly rather than silently masking incidents.
    5. A conditional flow gate checks whether a burst or volume threshold has been breached.
    6. When a burst is detected, a Slack alert is dispatched with issue counts, event volume, and project context.
    7. A log task records the full audit summary for observability and incident retrospectives.

    ## What you get

    - Real-time error burst detection with configurable issue count and event volume thresholds.
    - Proactive Slack alerts reaching on-call engineers before user-visible degradation escalates.
    - Structured execution history for SLA tracking and post-incident review.

    ## Who it's for

    - Site Reliability Engineers operating production services monitored by Sentry.
    - Backend Engineering teams wanting automated error rate alerting without manual Sentry alert rule management.
    - Platform teams centralizing incident observability pipelines across multiple projects.

    ## Why orchestrate this with Kestra

    - Declarative YAML definition version-controlled alongside application deployment pipelines.
    - Credential masking keeps Sentry auth tokens out of execution logs.
    - Multi-step conditional logic enables richer alerting policies than native Sentry alert rules.

    ## Prerequisites

    - A Sentry account with an existing project and API access.
    - A Sentry Internal Integration auth token with `project:read` and `event:read` scopes.
    - A Slack Incoming Webhook URL for alerting.

    ### Secrets

    - `SENTRY_AUTH_TOKEN`: Sentry Internal Integration token with `project:read` and `event:read` scopes.
    - `SENTRY_ORG_SLUG`: The URL-safe slug of your Sentry organization (found in Sentry organization settings).
    - `SENTRY_PROJECT_SLUG`: The URL-safe slug of the Sentry project to monitor.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL for burst alert notifications.

    ## Quick start

    1. Create a Sentry Internal Integration token with `project:read` and `event:read` scopes.
    2. Store all four secrets in your Kestra namespace secrets store.
    3. Run a manual test execution to validate API connectivity and confirm issue data is returned correctly.
    4. Adjust the `burst_threshold` and `critical_events_threshold` variables in the Python task to match your project's normal error volume.
    5. Enable the 15-minute schedule trigger for continuous automated monitoring.

    ## How to extend

    - Add parallel monitoring of multiple Sentry projects using `io.kestra.plugin.core.flow.ForEach` over a list of project slugs.
    - Integrate PagerDuty or Opsgenie alerts for critical severity bursts alongside the Slack notification.
    - Add a release health check by querying the Sentry Releases API to correlate error bursts with recent deployments.

    ## Links

    - [Sentry Issues API Reference](https://docs.sentry.io/api/events/list-a-projects-issues/)
    - [Sentry Internal Integration Token Setup](https://docs.sentry.io/product/integrations/integration-platform/#internal-integrations)
    - [Kestra HTTP Request Plugin](https://kestra.io/plugins/plugin-fs/tasks/http/io.kestra.plugin.fs.http.request)
    - [Kestra Slack Notifications Plugin](https://kestra.io/plugins/plugin-notifications/tasks/slack/io.kestra.plugin.notifications.slack.slackincomingwebhook)
  tags:
    - Cloud
    - Infrastructure
  subTags:
    - "Monitoring & Alerting"
    - "Incident Response"
    - "Day 2 Operations"
  ee: false
  demo: false
