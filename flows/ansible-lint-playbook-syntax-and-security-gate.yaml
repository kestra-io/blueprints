id: ansible-lint-playbook-syntax-and-security-gate
namespace: company.ansible
description: |
  Statically analyze Ansible playbooks for syntax defects, idempotency issues, deprecated
  modules, and security vulnerabilities using ansible-lint. Automatically compute quality
  scores, alert Slack, generate audit scorecards, and enforce automated CI/CD deployment gates.

triggers:
  - id: on_playbook_pull_request
    type: io.kestra.plugin.core.trigger.Webhook
    description: Webhook endpoint triggered by CI/CD pipelines (e.g., GitHub Actions, GitLab CI) upon pull request creation or playbook commits.
    key: "{{ secret('ANSIBLE_LINT_WEBHOOK_KEY') }}"

  - id: nightly_playbook_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: Scheduled nightly sweep auditing fleet playbooks against updated security rules. Shipped disabled by default.
    cron: "0 2 * * *"
    disabled: true

inputs:
  - id: playbook_file
    type: FILE
    required: false
    description: Optional uploaded Ansible playbook YAML artifact. If provided, this file is evaluated directly.

  - id: playbook_content
    type: STRING
    required: false
    defaults: |
      ---
      - name: Provision and configure hardened web application server
        hosts: webservers
        become: true
        tasks:
          - name: Ensure Nginx web server is installed
            ansible.builtin.package:
              name: nginx
              state: present

          - name: Deploy application configuration manifest
            ansible.builtin.copy:
              dest: /etc/nginx/conf.d/app.conf
              content: |
                server {
                    listen 80;
                    server_name app.company.internal;
                    location / {
                        proxy_pass http://127.0.0.1:8080;
                    }
                }
              owner: root
              group: root
              mode: '0644'

          - name: Ensure Nginx service is running and enabled
            ansible.builtin.service:
              name: nginx
              state: started
              enabled: true
    description: Inline Ansible playbook YAML configuration to evaluate if `playbook_file` is omitted.

  - id: max_critical_issues
    type: INT
    defaults: 0
    description: Maximum permissible critical security or blocker syntax violations before policy gate rejection.

  - id: max_high_issues
    type: INT
    defaults: 0
    description: Maximum permissible high-severity defects (e.g., idempotency or deprecated features) before policy rejection.

  - id: min_quality_score
    type: INT
    defaults: 75
    description: Minimum required playbook quality score (0 to 100) to pass the evaluation gate.

  - id: fail_on_rejection
    type: BOOL
    defaults: false
    description: Whether to fail pipeline execution when policy verdict is REJECTED (automated deployment blocking gate). When false (default for safe out-of-the-box demo and audit runs), rejected playbooks log a warning without failing execution. Set to true in production CI/CD pipelines to enforce automated deployment blocking.

  - id: notify_slack
    type: BOOL
    defaults: false
    description: Whether to send a structured quality scorecard alert to Slack when defects are detected.

tasks:
  - id: playbook_workspace
    type: io.kestra.plugin.core.flow.WorkingDirectory
    description: Isolated workspace containing playbook artifacts, linter execution, and generated reports.
    inputFiles:
      uploaded_playbook.yml: "{{ inputs.playbook_file }}"
      inline_playbook.yml: "{{ inputs.playbook_content ?? '' }}"
    tasks:
      - id: stage_playbook
        type: io.kestra.plugin.scripts.shell.Commands
        description: Stage uploaded file or inline playbook content into standard playbook.yml location.
        commands:
          - |
            if [ -f "uploaded_playbook.yml" ] && [ -s "uploaded_playbook.yml" ]; then
              echo "[INFO] Staging user-uploaded playbook artifact."
              cp uploaded_playbook.yml playbook.yml
            elif [ -f "inline_playbook.yml" ] && [ -s "inline_playbook.yml" ]; then
              echo "[INFO] Staging inline playbook content."
              cp inline_playbook.yml playbook.yml
            else
              echo "[ERROR] No playbook content provided. Please upload a file or pass inline playbook YAML." >&2
              exit 1
            fi
        outputFiles:
          - playbook.yml

      - id: run_ansible_lint
        type: io.kestra.plugin.scripts.shell.Commands
        description: Execute ansible-lint in containerized environment and export structured JSON findings.
        taskRunner:
          type: io.kestra.plugin.scripts.runner.docker.Docker
        containerImage: cytopia/ansible-lint:latest
        commands:
          - |
            echo "[INFO] Executing ansible-lint against playbook.yml..."
            ansible-lint -f json --nocolor playbook.yml > lint_results.json 2>&1 || true
            if [ ! -s "lint_results.json" ]; then
              echo "[]" > lint_results.json
            fi
            echo "[INFO] ansible-lint completed. Exporting results."
        outputFiles:
          - lint_results.json

      - id: analyze_lint_results
        type: io.kestra.plugin.scripts.python.Script
        description: Parse lint_results.json, calculate playbook quality score, and evaluate safety policy.
        taskRunner:
          type: io.kestra.plugin.core.runner.Process
        env:
          RESULTS_FILE: lint_results.json
          PLAYBOOK_TARGET: playbook.yml
          MAX_CRITICAL: "{{ inputs.max_critical_issues }}"
          MAX_HIGH: "{{ inputs.max_high_issues }}"
          MIN_SCORE: "{{ inputs.min_quality_score }}"
        script: |
          import json
          import os
          import sys
          from datetime import datetime, timezone

          results_file = os.environ.get("RESULTS_FILE", "lint_results.json")
          playbook_target = os.environ.get("PLAYBOOK_TARGET", "playbook.yml")
          max_critical = int(os.environ.get("MAX_CRITICAL", 0))
          max_high = int(os.environ.get("MAX_HIGH", 0))
          min_quality_score = int(os.environ.get("MIN_SCORE", 75))

          if not os.path.exists(results_file):
              print(f"[ERROR] Lint results file '{results_file}' not found.", file=sys.stderr)
              sys.exit(1)

          if os.path.getsize(results_file) == 0:
              print(f"[ERROR] Lint results file '{results_file}' is empty.", file=sys.stderr)
              sys.exit(1)

          try:
              with open(results_file, "r", encoding="utf-8") as f:
                  data = json.load(f)
          except Exception as exc:
              print(f"[ERROR] Failed to parse '{results_file}' as valid JSON: {exc}", file=sys.stderr)
              sys.exit(1)

          if not isinstance(data, list):
              print(f"[ERROR] Invalid ansible-lint format: root JSON must be a list of issues, got {type(data).__name__}.", file=sys.stderr)
              sys.exit(1)

          critical_issues = []
          high_issues = []
          medium_issues = []
          low_issues = []

          SECURITY_RULES = {
              "no-log-needed", "no-free-form", "command-instead-of-shell",
              "risky-shell-pipe", "risky-file-permissions", "package-latest"
          }

          for idx, item in enumerate(data):
              if not isinstance(item, dict):
                  print(f"[ERROR] Issue entry at index {idx} must be a dict, got {type(item).__name__}.", file=sys.stderr)
                  sys.exit(1)

              rule_id = str(item.get("check_name") or item.get("rule", {}).get("id") or item.get("id") or "unknown_rule")
              message = str(item.get("description") or item.get("message") or "No description provided.")
              filename = str(item.get("filename") or item.get("path") or playbook_target)
              line = item.get("linenumber") or (item.get("position", {}).get("begin", {}).get("line") if isinstance(item.get("position"), dict) else None) or 1
              raw_severity = str(item.get("severity") or item.get("level") or "medium").lower()
              tag = item.get("tag") or (item.get("tags") if isinstance(item.get("tags"), list) else [item.get("tag") or "general"])

              issue_entry = {
                  "rule": rule_id,
                  "description": message,
                  "filename": filename,
                  "line": line,
                  "tag": tag,
                  "raw_severity": raw_severity
              }

              if raw_severity in ("blocker", "critical", "very_high") or rule_id in SECURITY_RULES:
                  critical_issues.append(issue_entry)
              elif raw_severity in ("major", "high"):
                  high_issues.append(issue_entry)
              elif raw_severity in ("minor", "medium"):
                  medium_issues.append(issue_entry)
              elif raw_severity in ("low", "info"):
                  low_issues.append(issue_entry)
              else:
                  medium_issues.append(issue_entry)

          total_issues = len(critical_issues) + len(high_issues) + len(medium_issues) + len(low_issues)

          deductions = (len(critical_issues) * 25) + (len(high_issues) * 15) + (len(medium_issues) * 5) + (len(low_issues) * 2)
          quality_score = max(0, 100 - deductions)

          policy_violations = []
          if len(critical_issues) > max_critical:
              policy_violations.append(f"Critical security/syntax violations ({len(critical_issues)}) exceed limit ({max_critical}).")
          if len(high_issues) > max_high:
              policy_violations.append(f"High-severity issues ({len(high_issues)}) exceed limit ({max_high}).")
          if quality_score < min_quality_score:
              policy_violations.append(f"Playbook quality score ({quality_score}/100) is below minimum threshold ({min_quality_score}/100).")

          if policy_violations:
              verdict = "REJECTED"
              status_category = "FAIL"
              summary = f"REJECTED: Playbook violates quality policy. {'; '.join(policy_violations)}"
          elif total_issues > 0:
              verdict = "WARNING"
              status_category = "ADVISORY"
              summary = f"WARNING: Playbook passed gate with {total_issues} advisory issues (Score: {quality_score}/100)."
          else:
              verdict = "APPROVED"
              status_category = "PASS"
              summary = f"APPROVED: Playbook passed all linting and security checks with zero defects (Score: 100/100)."

          report_payload = {
              "timestamp": datetime.now(timezone.utc).isoformat(),
              "playbook_target": playbook_target,
              "verdict": verdict,
              "status_category": status_category,
              "quality_score": quality_score,
              "thresholds": {
                  "max_critical": max_critical,
                  "max_high": max_high,
                  "min_quality_score": min_quality_score
              },
              "counts": {
                  "total_issues": total_issues,
                  "critical_issues": len(critical_issues),
                  "high_issues": len(high_issues),
                  "medium_issues": len(medium_issues),
                  "low_issues": len(low_issues)
              },
              "policy_violations": policy_violations,
              "issues": {
                  "critical": critical_issues,
                  "high": high_issues,
                  "medium": medium_issues,
                  "low": low_issues
              },
              "summary": summary
          }

          with open("ansible_lint_report.json", "w", encoding="utf-8") as f_json:
              json.dump(report_payload, f_json, indent=2)

          icon = "🔴" if verdict == "REJECTED" else ("🟡" if verdict == "WARNING" else "🟢")
          md = []
          md.append(f"# {icon} Ansible Playbook Syntax, Security & Quality Gate Report")
          md.append("")
          md.append(f"**Target Playbook:** `{playbook_target}` | **Audit Timestamp:** `{report_payload['timestamp']}`")
          md.append("")
          md.append("## Executive Scorecard")
          md.append("")
          md.append("| Metric | Evaluated Value | Assessment / Threshold |")
          md.append("| :--- | :--- | :--- |")
          md.append(f"| **Policy Gate Verdict** | `{verdict}` | {'⛔ Deployment BLOCKED' if verdict == 'REJECTED' else ('⚠️ Advisory Issues' if verdict == 'WARNING' else '✅ Passed Safety Gate')} |")
          md.append(f"| **Quality Score** | **`{quality_score} / 100`** | Minimum Required: `{min_quality_score}/100` |")
          md.append(f"| **Critical / Security Issues** | `{len(critical_issues)}` | Max Allowed: `{max_critical}` |")
          md.append(f"| **High-Severity Issues** | `{len(high_issues)}` | Max Allowed: `{max_high}` |")
          md.append(f"| **Medium / Best Practice** | `{len(medium_issues)}` | Advisory |")
          md.append(f"| **Low / Formatting** | `{len(low_issues)}` | Advisory |")
          md.append(f"| **Total Issues Found** | `{total_issues}` | Combined Defect Count |")
          md.append("")

          if policy_violations:
              md.append("## ⚠️ Policy Violations Detected")
              md.append("")
              for v in policy_violations:
                  md.append(f"- ❌ **{v}**")
              md.append("")

          all_reported_issues = critical_issues + high_issues + medium_issues + low_issues
          if all_reported_issues:
              md.append("## Defect Inventory & Findings")
              md.append("")
              md.append("| Rule ID | Severity | Location | Description |")
              md.append("| :--- | :--- | :--- | :--- |")
              for iss in all_reported_issues:
                  md.append(f"| `{iss['rule']}` | `{iss['raw_severity'].upper()}` | `{iss['filename']}:{iss['line']}` | {iss['description']} |")
              md.append("")

          md.append("## Operational & Remediation Guidance")
          md.append("")
          if verdict == "REJECTED":
              md.append("1. **Do not execute playbook in production.** Critical security or syntax defects were detected that may cause deployment failure or credential exposure.")
              md.append("2. **Address security rules immediately.** Ensure sensitive tasks have `no_log: true` enabled and replace raw shell pipes with dedicated Ansible modules.")
              md.append("3. **Fix syntax and idempotency defects.** Consult the line references in the findings table above.")
          elif verdict == "WARNING":
              md.append("1. **Playbook approved for deployment with warnings.** Address medium and low issues in the next revision to improve code quality.")
              md.append("2. **Review deprecated module usage.** Update older module aliases to standard FQCN (Fully Qualified Collection Names).")
          else:
              md.append("1. **Playbook approved.** All syntax, security, and quality gates passed with zero defects.")
          md.append("")

          with open("ansible_lint_report.md", "w", encoding="utf-8") as f_md:
              f_md.write("\n".join(md))

          print(f"[INFO] Ansible Playbook Audit Complete for '{playbook_target}':")
          print(f"  Verdict: {verdict} | Quality Score: {quality_score}/100")
          print(f"  Critical Issues: {len(critical_issues)} | High Issues: {len(high_issues)} | Medium: {len(medium_issues)} | Low: {len(low_issues)}")

          output_payload = {
              "verdict": verdict,
              "quality_score": quality_score,
              "status_category": status_category,
              "total_issues": total_issues,
              "critical_issues": len(critical_issues),
              "high_issues": len(high_issues),
              "medium_issues": len(medium_issues),
              "low_issues": len(low_issues),
              "violations_count": len(policy_violations),
              "summary": summary
          }

          print("::" + json.dumps({"outputs": output_payload}) + "::")
        outputFiles:
          - ansible_lint_report.json
          - ansible_lint_report.md

  - id: check_slack_alert
    type: io.kestra.plugin.core.flow.If
    description: Dispatch structured quality scorecard to Slack when notify_slack is enabled and defects exist.
    condition: "{{ inputs.notify_slack and outputs.analyze_lint_results.vars.verdict in ['REJECTED', 'WARNING'] }}"
    then:
      - id: send_slack_alert
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Send structured playbook quality scorecard to Slack.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": ":warning: *Ansible Playbook Quality Gate Alert*\n• *Verdict:* `{{ outputs.analyze_lint_results.vars.verdict }}`\n• *Quality Score:* `{{ outputs.analyze_lint_results.vars.quality_score }}/100`\n• *Critical Security Issues:* `{{ outputs.analyze_lint_results.vars.critical_issues }}`\n• *High-Severity Issues:* `{{ outputs.analyze_lint_results.vars.high_issues }}`\n• *Total Defects:* `{{ outputs.analyze_lint_results.vars.total_issues }}`\n• *Summary:* {{ outputs.analyze_lint_results.vars.summary }}\n• *Execution ID:* `{{ execution.id }}`"
          }

  - id: enforce_policy_gate
    type: io.kestra.plugin.core.flow.If
    description: Evaluate audit results against policy thresholds and halt deployment if rejected.
    condition: "{{ outputs.analyze_lint_results.vars.verdict == 'REJECTED' }}"
    then:
      - id: check_fail_gate
        type: io.kestra.plugin.core.flow.If
        description: Terminate pipeline execution with error when fail_on_rejection is enabled.
        condition: "{{ inputs.fail_on_rejection }}"
        then:
          - id: fail_gate
            type: io.kestra.plugin.core.execution.Fail
            description: Halt pipeline execution to block deployment of flawed or insecure Ansible playbook.
            errorMessage: >-
              Ansible Playbook Quality Gate FAILED:
              Verdict {{ outputs.analyze_lint_results.vars.verdict }} (Score: {{ outputs.analyze_lint_results.vars.quality_score }}/100) violates safety thresholds.
              {{ outputs.analyze_lint_results.vars.summary }}
        else:
          - id: log_rejection_advisory
            type: io.kestra.plugin.core.log.Log
            description: Log high-risk advisory warning when fail_on_rejection is disabled.
            message: >-
              [WARN] Playbook rejected by quality policy (Score: {{ outputs.analyze_lint_results.vars.quality_score }}/100, Critical: {{ outputs.analyze_lint_results.vars.critical_issues }}, High: {{ outputs.analyze_lint_results.vars.high_issues }}),
              but fail_on_rejection is disabled. Continuing pipeline execution in advisory mode.

    else:
      - id: log_playbook_approved
        type: io.kestra.plugin.core.log.Log
        description: Log playbook approval when audit results satisfy quality thresholds.
        message: >-
          [SUCCESS] Ansible playbook passed quality policy gate.
          Verdict: {{ outputs.analyze_lint_results.vars.verdict }}, Quality Score: {{ outputs.analyze_lint_results.vars.quality_score }}/100.
          Total Defects: {{ outputs.analyze_lint_results.vars.total_issues }} (Critical: {{ outputs.analyze_lint_results.vars.critical_issues }}, High: {{ outputs.analyze_lint_results.vars.high_issues }}).

outputs:
  - id: verdict
    type: STRING
    description: Policy gate decision verdict (APPROVED, WARNING, REJECTED).
    value: "{{ outputs.analyze_lint_results.vars.verdict }}"

  - id: quality_score
    type: INT
    description: Computed playbook quality score (0 to 100).
    value: "{{ outputs.analyze_lint_results.vars.quality_score }}"

  - id: status_category
    type: STRING
    description: High-level status category (PASS, ADVISORY, FAIL).
    value: "{{ outputs.analyze_lint_results.vars.status_category }}"

  - id: total_issues
    type: INT
    description: Total count of detected linter issues and rule violations.
    value: "{{ outputs.analyze_lint_results.vars.total_issues }}"

  - id: critical_issues
    type: INT
    description: Count of critical security or blocker syntax defects.
    value: "{{ outputs.analyze_lint_results.vars.critical_issues }}"

  - id: high_issues
    type: INT
    description: Count of high-severity defects (e.g. idempotency failures or deprecated modules).
    value: "{{ outputs.analyze_lint_results.vars.high_issues }}"

  - id: medium_issues
    type: INT
    description: Count of medium-severity best-practice recommendations.
    value: "{{ outputs.analyze_lint_results.vars.medium_issues }}"

  - id: low_issues
    type: INT
    description: Count of low-severity formatting or style advisories.
    value: "{{ outputs.analyze_lint_results.vars.low_issues }}"

  - id: violations_count
    type: INT
    description: Total count of policy threshold violations.
    value: "{{ outputs.analyze_lint_results.vars.violations_count }}"

  - id: summary
    type: STRING
    description: Sanitized audit summary of the playbook quality assessment.
    value: "{{ outputs.analyze_lint_results.vars.summary }}"

  - id: ansible_lint_report_json
    type: FILE
    description: Machine-readable comprehensive linter report artifact in JSON format.
    value: "{{ outputs.analyze_lint_results.outputFiles['ansible_lint_report.json'] }}"

  - id: ansible_lint_report_md
    type: FILE
    description: Human-readable executive summary scorecard and findings inventory in Markdown format.
    value: "{{ outputs.analyze_lint_results.outputFiles['ansible_lint_report.md'] }}"

extend:
  title: Ansible Playbook Syntax, Security & Quality Gate with ansible-lint
  metaTitle: Ansible Playbook Lint & Security Policy Gate on Kestra
  shortDescription: Validate Ansible playbooks for syntax errors, idempotency bugs, and security risks with ansible-lint, alert Slack, and enforce deployment gates.
  metaDescription: Statically analyze Ansible playbooks for syntax, idempotency, and security vulnerabilities with ansible-lint, alert Slack, and gate deployments with Kestra.
  tags:
    - Infrastructure
    - Core
  subTags:
    - Configuration Management
    - Policy & Compliance
  ee: false
  demo: false
  description: |
    Ansible playbooks automate mission-critical server provisioning, cloud infrastructure, and network device configuration.
    However, flawed playbooks frequently introduce catastrophic deployment failures: unencrypted passwords or API tokens printed
    into execution logs, non-idempotent raw shell commands (`command` instead of declarative modules), insecure file permissions,
    and deprecated module calls that suddenly break fleet automation during core upgrades.

    This blueprint implements an automated pre-deployment quality and security gate for Ansible playbooks using `ansible-lint`.
    It statically inspects playbook YAML, extracts rule violations into structured JSON, calculates an objective Playbook Quality
    Score (0–100), dispatches actionable Slack scorecards, produces auditable Markdown and JSON reports, and enforces automated
    policy gates before changes are deployed across server fleets.

    ## Architecture

    ```
    Webhook Trigger / Direct Run
           ↓
    WorkingDirectory (Playbook Workspace)
           ↓
    Shell Task (stage_playbook: Ingest uploaded file OR inline YAML)
           ↓
    Docker Commands (run_ansible_lint: cytopia/ansible-lint -f json)
           ↓
    Python Analyzer (Score Calculation, Security Rules & Policy Gate)
           ↓
    If [notify_slack && elevated defects]: Slack Scorecard Notification
           ↓
    If [verdict == 'REJECTED']
        ├── If [fail_on_rejection: true]: Fail Task (Halt Deployment)
        └── If [fail_on_rejection: false]: Log Warning (Advisory Mode)
           ↓
    Outputs & Artifacts (Quality Score, Verdict, JSON Report, Markdown Scorecard)
    ```

    ## Quality Scoring & Severity Classification

    The analyzer computes an objective Playbook Quality Score starting from 100 points:
    - **Critical / Security (`-25 points`)**: High-risk security vulnerabilities such as sensitive data exposed without `no_log`, dangerous shell pipes, command injection, or blocker syntax errors.
    - **High Severity (`-15 points`)**: Deprecated module features, non-idempotent task configurations, or missing package version pins.
    - **Medium Severity (`-5 points`)**: Ansible best-practice deviations, risky file mode specifications, or command module used instead of standard dedicated modules.
    - **Low / Info (`-2 points`)**: YAML formatting inconsistencies, missing task descriptions, or naming conventions.

    $$\text{Quality Score} = \max\left(0, 100 - (25 \times N_{\text{crit}} + 15 \times N_{\text{high}} + 5 \times N_{\text{med}} + 2 \times N_{\text{low}})\right)$$

    ## Policy Gate Verdicts

    - **`REJECTED`**: Triggered when critical security issues exceed `max_critical_issues` (default: 0), high-severity issues exceed `max_high_issues` (default: 0), or the overall quality score drops below `min_quality_score` (default: 75).
    - **`WARNING`**: Triggered when non-critical advisory issues are identified while quality score remains above acceptable thresholds.
    - **`APPROVED`**: Playbook achieves clean verification with zero detected defects.

    ## Deployment Gate & Advisory Modes

    The flow supports two operational modes controlled by `fail_on_rejection`:
    - **Advisory & Audit Mode (`fail_on_rejection: false`, default)**: When policy violations are detected, the flow logs a high-severity warning and dispatches Slack notifications without halting execution. This safe default allows non-blocking ad-hoc evaluation, demos, and visibility without prematurely failing unconfigured pipelines.
    - **Enforcing Policy Gate Mode (`fail_on_rejection: true`)**: Any playbook evaluated as `REJECTED` triggers the `fail_gate` task (`io.kestra.plugin.core.execution.Fail`), immediately terminating execution with a non-zero exit code to halt automated CI/CD deployment pipelines.

    ## CI/CD Pipeline Integration

    Trigger this blueprint from GitHub Actions, GitLab CI, or Jenkins upon pull request creation:

    ```bash
    curl -X POST "https://<your-kestra-host>/api/v1/executions/webhook/company.ansible/ansible-lint-playbook-syntax-and-security-gate/<ANSIBLE_LINT_WEBHOOK_KEY>" \
      -H "Content-Type: application/json" \
      -d '{
        "inputs": {
          "max_critical_issues": 0,
          "max_high_issues": 0,
          "min_quality_score": 80,
          "fail_on_rejection": true,
          "notify_slack": true
        }
      }'
    ```

    ## Prerequisites & Secrets

    - **Container Engine**: Docker or container runner accessible to Kestra to execute `cytopia/ansible-lint:latest`.
    - **ANSIBLE_LINT_WEBHOOK_KEY** *(required for Webhook trigger)*: Secret key securing the `on_playbook_pull_request` Webhook trigger.
    - **SLACK_WEBHOOK_URL** *(optional)*: Required only when `notify_slack: true` is enabled.
