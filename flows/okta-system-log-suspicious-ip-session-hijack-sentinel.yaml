id: okta-system-log-suspicious-ip-session-hijack-sentinel
namespace: company.security
description: 'Audits Okta System Log event streams for concurrent active user sessions
  originating from disparate IP addresses, alerting SecOps via Slack.

  '
concurrency:
  limit: 1
inputs:
- id: okta_domain
  type: STRING
  displayName: Okta Domain
  defaults: company-prod.okta.com
  description: Target Okta organization tenant domain hosting workforce identity sessions.
- id: lookback_minutes
  type: INT
  displayName: Lookback Window (Minutes)
  defaults: 15
  description: Time range in minutes across which Okta System Log events are queried
    and correlated.
- id: hijack_incident_threshold
  type: INT
  displayName: Incident Alert Threshold
  defaults: 1
  description: Count of distinct users exhibiting concurrent multi-IP session anomalies
    that triggers SecOps alerts.
- id: alert_on_hijack
  type: BOOL
  displayName: Alert On Hijack Anomaly
  defaults: true
  description: Toggle whether Slack webhook alerts are dispatched upon detecting concurrent
    IP session anomalies.
tasks:
- id: scan_okta_system_logs
  type: io.kestra.plugin.scripts.python.Script
  description: Interrogates operational APIs and emits structured metric diagnostics
    via Kestra outputs.
  containerImage: python:3.11-slim
  taskRunner:
    type: io.kestra.plugin.scripts.runner.docker.Docker
  beforeCommands:
  - pip install requests kestra
  env:
    OKTA_DOMAIN: '{{ inputs.okta_domain }}'
    OKTA_API_TOKEN: '{{ secret(''OKTA_API_TOKEN'') }}'
    LOOKBACK_MINUTES: '{{ inputs.lookback_minutes }}'
    HIJACK_THRESHOLD: '{{ inputs.hijack_incident_threshold }}'
  script: "import os\nimport sys\nfrom datetime import datetime, timezone, timedelta\n\
    import requests\nfrom kestra import Kestra\n\ndomain = os.environ.get(\"OKTA_DOMAIN\"\
    , \"company-prod.okta.com\")\napi_token = os.environ.get(\"OKTA_API_TOKEN\", \"\
    \")\nlookback_min = int(os.environ.get(\"LOOKBACK_MINUTES\", \"15\"))\nthreshold\
    \ = int(os.environ.get(\"HIJACK_THRESHOLD\", \"1\"))\n\nflagged_users = []\nip_mappings\
    \ = []\ntotal_events = 0\n\nsince_ts = (datetime.now(timezone.utc) - timedelta(minutes=lookback_min)).strftime(\"\
    %Y-%m-%dT%H:%M:%SZ\")\nfilter_expr = 'eventType eq \"user.session.start\" or eventType\
    \ eq \"user.session.access_admin_app\"'\nurl = f\"https://{domain}/api/v1/logs?since={since_ts}&filter={filter_expr}&limit=100\"\
    \nheaders = {\n    \"Authorization\": f\"SSWS {api_token}\",\n    \"Accept\":\
    \ \"application/json\"\n}\n\ntry:\n    resp = requests.get(url, headers=headers,\
    \ timeout=15)\n    resp.raise_for_status()\n    events = resp.json()\n    total_events\
    \ = len(events)\n    user_ips = {}\n    for ev in events:\n        actor = ev.get(\"\
    actor\", {}).get(\"alternateId\", \"unknown\")\n        ip = ev.get(\"client\"\
    , {}).get(\"ipAddress\")\n        if actor and ip and actor != \"unknown\":\n\
    \            user_ips.setdefault(actor, set()).add(ip)\n            \n    for\
    \ user, ips in user_ips.items():\n        if len(ips) > 1:\n            flagged_users.append(user)\n\
    \            ip_mappings.append(f\"{user}: {list(ips)}\")\nexcept Exception as\
    \ e:\n    sys.stderr.write(f\"Error querying Okta System Log from {url}: {e}\\\
    n\")\n    sys.exit(1)\n\nsuspicious_count = len(flagged_users)\nis_alerting =\
    \ suspicious_count >= threshold\n\nKestra.outputs({\n    \"total_events_audited\"\
    : total_events,\n    \"suspicious_user_count\": suspicious_count,\n    \"flagged_users\"\
    : \", \".join(flagged_users) if flagged_users else \"None\",\n    \"ip_mappings\"\
    : \"; \".join(ip_mappings) if ip_mappings else \"None\",\n    \"is_alerting\"\
    : is_alerting,\n    \"audit_timestamp\": datetime.now(timezone.utc).isoformat()\n\
    })\n"
- id: check_suspicious_sessions
  type: io.kestra.plugin.core.flow.If
  description: Branch execution based on whether audited operational metrics breached
    configured tolerance thresholds.
  condition: '{{ outputs.scan_okta_system_logs.vars.is_alerting and inputs.alert_on_hijack
    }}'
  then:
  - id: notify_slack_secops_alert
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Dispatches high-priority operational incident alert to designated
      Slack webhook channel.
    url: '{{ secret(''SLACK_WEBHOOK_URL'') }}'
    payload: "{\n  \"channel\": \"#secops-alerts\",\n  \"username\": \"Okta-SecOps-Sentinel\"\
      ,\n  \"text\": \"SECURITY ALERT: Okta tenant `{{ inputs.okta_domain }}` detected\
      \ `{{ outputs.scan_okta_system_logs.vars.suspicious_user_count }}` user(s) with\
      \ concurrent sessions from disparate IP addresses within lookback of `{{ inputs.lookback_minutes\
      \ }}m`! Targeted Accounts: `{{ outputs.scan_okta_system_logs.vars.flagged_users\
      \ }}`. Suspicious IP Mapping: `{{ outputs.scan_okta_system_logs.vars.ip_mappings\
      \ }}`. Review immediate session revocation.\"\n}\n"
  else:
  - id: log_nominal_okta_state
    type: io.kestra.plugin.core.log.Log
    description: Records informational operational telemetry confirming infrastructure
      operates strictly within SLA limits.
    message: 'Okta System Log audit nominal: {{ outputs.scan_okta_system_logs.vars.total_events_audited
      }} events audited across lookback window of {{ inputs.lookback_minutes }}m.
      Zero multi-IP session hijack anomalies detected.'
- id: export_okta_manifest
  type: io.kestra.plugin.core.debug.Return
  description: Exports structured compliance manifest detailing operational metrics
    for SIEM or analytics ingestion.
  format:
    total_events_audited: '{{ outputs.scan_okta_system_logs.vars.total_events_audited
      }}'
    suspicious_user_count: '{{ outputs.scan_okta_system_logs.vars.suspicious_user_count
      }}'
    flagged_users: '{{ outputs.scan_okta_system_logs.vars.flagged_users }}'
    ip_mappings: '{{ outputs.scan_okta_system_logs.vars.ip_mappings }}'
    is_alerting: '{{ outputs.scan_okta_system_logs.vars.is_alerting }}'
    audit_timestamp: '{{ outputs.scan_okta_system_logs.vars.audit_timestamp }}'
triggers:
- id: periodic_okta_audit
  type: io.kestra.plugin.core.trigger.Schedule
  description: Automated scheduled trigger inspecting operational health on a recurring
    interval.
  cron: '*/15 * * * *'
  disabled: true
extend:
  title: Okta System Log Suspicious IP Session Hijack Sentinel
  metaTitle: Okta System Log Suspicious IP Session Hijack Sentinel Blueprint
  shortDescription: Audits Okta System Log events for concurrent user sessions spanning
    multiple disparate geographical IP addresses.
  metaDescription: Audits Okta System Log event streams for concurrent active user
    sessions originating from disparate IP addresses, alerting SecOps via Slack.
  description: "Audits Okta System Log security streams for concurrent active user\
    \ authentication sessions spanning geographically disparate IP addresses within\
    \ narrow time windows, identifying potential token theft, session hijacking, or\
    \ adversary adversary-in-the-middle attacks.\n\n## How it works\n1. **System Log\
    \ Event Streaming**: Queries the Okta System Log API with filter parameters targeting\
    \ user session initiation and administrative application access events within\
    \ the configured lookback window.\n2. **Identity and IP Correlation**: Extracts\
    \ user principal identifiers and source IP addresses, constructing identity-to-network\
    \ session mappings across concurrent sessions.\n3. **Session Anomaly Detection**:\
    \ Identifies users associated with multiple distinct IP addresses within the lookback\
    \ window, flagging accounts exhibiting impossible travel or concurrent credential\
    \ usage.\n4. **SecOps Notification and Audit Record**: Emits structured security\
    \ incident notifications to dedicated SecOps Slack channels with affected user\
    \ principals and originating IP addresses.\n\n## Architecture diagram\n```mermaid\n\
    flowchart TD\n    A[periodic_okta_audit Schedule Trigger] --> B[scan_okta_system_logs\
    \ Python Script]\n    B --> C[check_suspicious_sessions Flowable If]\n    C --\
    \ Threshold Breached --> D[notify_slack_secops_alert Webhook]\n    C -- Metrics\
    \ Nominal --> E[log_nominal_okta_state Log]\n    D --> E\n    E --> F[export_okta_manifest\
    \ Return]\n```\n\n## Architecture components\n- **Trigger (`periodic_okta_audit`)**:\
    \ Drives scheduled recurring surveillance cycles without human intervention.\n\
    - **Inspection Task (`scan_okta_system_logs`)**: Queries target APIs and structures\
    \ diagnostic indicators via Kestra outputs.\n- **Evaluation Gate (`check_suspicious_sessions`)**:\
    \ Evaluates operational safety boundaries using deterministic boolean branching.\n\
    - **Notification Action (`notify_slack_secops_alert`)**: Dispatches rich, actionable\
    \ incident messages directly to team channels.\n- **Manifest Return (`export_okta_manifest`)**:\
    \ Emits structured compliance payloads for SIEM and analytics records.\n\n## Key\
    \ capabilities\n- **Automated Health Polling**: Continuous scheduled surveillance\
    \ executed on customizable recurring intervals without dedicated agent daemons.\n\
    - **Deterministic Threshold Evaluation**: Pure boolean and numeric tolerance checks\
    \ eliminating false positives and alert noise.\n- **Contextual Incident Notification**:\
    \ Rich Slack messages populated with explicit resource identifiers, error reasons,\
    \ and metrics.\n- **Machine-Readable Audit Manifest**: Structured execution telemetry\
    \ exported for compliance archives, SIEM ingestion, or analytics dashboards.\n\
    \n## What you get\n- Proactive discovery of Okta session token hijacking and adversary-in-the-middle\
    \ proxy attacks\n- Near real-time correlation of concurrent authentication events\
    \ without expensive SIEM licensing overhead\n- Immediate visibility into compromised\
    \ workforce accounts for automated or manual session revocation\n- Standardized\
    \ audit manifest facilitating rapid escalation into incident response playbooks\n\
    \n## Who it's for\n- Security Operations Center (SOC) Analysts investigating unauthorized\
    \ workforce account access\n- Identity and Access Management (IAM) Engineers maintaining\
    \ enterprise single sign-on security\n- Corporate IT Security Administrators guarding\
    \ administrative access into cloud infrastructure\n\n## Why orchestrate this with\
    \ Kestra\n- Lightweight scheduled serverless execution avoiding heavy agent installations\
    \ on corporate identity controllers\n- Native secret vault integration protecting\
    \ high-privilege Okta SSWS API tokens and notification credentials\n- Automated\
    \ flow orchestration capable of bridging detection directly into automated remediation\
    \ flows\n- Clean structured outputs enabling frictionless ingestion into compliance\
    \ archiving systems\n\n## Use cases\n- **Token Replay Detection**: Detect compromised\
    \ corporate VPN tokens being utilized concurrently from personal residential networks.\n\
    - **Phishing Credential Exploitation**: Identify session cookie replay attacks\
    \ following workforce credential phishing incidents.\n- **Privileged Console Auditing**:\
    \ Audit privileged administrative accounts accessing sensitive production cloud\
    \ consoles from unapproved geographies.\n\n## Inputs\n| Name | Type | Default\
    \ | Description |\n| :--- | :--- | :--- | :--- |\n| `okta_domain` | `STRING` |\
    \ `company-prod.okta.com` | Target Okta organization tenant domain hosting workforce\
    \ identity sessions. |\n| `lookback_minutes` | `INT` | `15` | Time range in minutes\
    \ across which Okta System Log events are queried and correlated. |\n| `hijack_incident_threshold`\
    \ | `INT` | `1` | Count of distinct users exhibiting concurrent multi-IP session\
    \ anomalies that triggers SecOps alerts. |\n| `alert_on_hijack` | `BOOL` | `True`\
    \ | Toggle whether Slack webhook alerts are dispatched upon detecting concurrent\
    \ IP session anomalies. |\n\n## Expected outputs\n- `{{ outputs.scan_okta_system_logs.vars.total_events_audited\
    \ }}`: Total number of Okta System Log session events processed during the audit\
    \ execution.\n- `{{ outputs.scan_okta_system_logs.vars.suspicious_user_count }}`:\
    \ Total count of distinct user accounts exhibiting concurrent multi-IP session\
    \ anomalies.\n- `{{ outputs.scan_okta_system_logs.vars.flagged_users }}`: Comma-separated\
    \ list of user account emails or usernames flagged for investigation.\n- `{{ outputs.scan_okta_system_logs.vars.ip_mappings\
    \ }}`: Detailed breakdown of flagged users and their associated concurrent IP\
    \ addresses.\n- `{{ outputs.scan_okta_system_logs.vars.is_alerting }}`: Boolean\
    \ flag indicating whether flagged user volume breached configured alert thresholds.\n\
    \n## Prerequisites\n- Okta Identity Cloud tenant organization with System Log\
    \ API access enabled.\n- Okta Read-Only Administrator API Token (SSWS) generated\
    \ for automated security auditing.\n- Valid OKTA_API_TOKEN secret configured within\
    \ Kestra namespace secret storage.\n- Configured Slack incoming webhook URL with\
    \ permissions to post messages into the designated SecOps channel.\n\n### Secrets\n\
    - `OKTA_API_TOKEN`: Vault secret required for authenticated API execution and\
    \ notifications.\n- `SLACK_WEBHOOK_URL`: Vault secret required for authenticated\
    \ API execution and notifications.\n\n## Quick start\n1. Register the required\
    \ secrets in your Kestra namespace settings.\n2. Import this blueprint into your\
    \ Kestra instance under the `company.security` namespace.\n3. Review input parameters\
    \ such as threshold levels and target resource identifiers.\n4. Execute the flow\
    \ manually to verify connectivity, then enable the automated schedule.\n\n## Common\
    \ pitfalls and troubleshooting\n- **Legitimate Mobile Network Hand-offs**: Mobile\
    \ cellular devices frequently rotate IP addresses rapidly; tune lookback duration\
    \ and combine with user feedback mechanisms.\n- **Okta Rate Limiting Headers**:\
    \ Okta System Log API enforces strict rate limits (typically 100 requests per\
    \ minute); use since parameter filtering to minimize request volume.\n- **API\
    \ Token Expiration Lifecycles**: Okta SSWS tokens expire if unused for 30 days;\
    \ ensure periodic audit flows run regularly to maintain token freshness.\n- **Corporate\
    \ Proxy and ZTNA IP Consolidation**: Organizations utilizing Zscaler or Cloudflare\
    \ Access may route all traffic through identical egress IPs, causing false negative\
    \ clusterings.\n\n## How to extend\n- **Automated Okta Session Clear**: Trigger\
    \ Okta API POST /api/v1/users/${userId}/lifecycle/clear_sessions to instantly\
    \ revoke compromised tokens.\n- **Jira Security Ticket Generation**: Automatically\
    \ create high-priority SecOps incident investigation tickets populated with forensic\
    \ IP telemetry.\n- **MFA Step-up Enforcement**: Enforce immediate push notification\
    \ challenge via Okta Verify API when impossible travel velocity is confirmed.\n\
    \n## Links\n- [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)\n\
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)\n\
    - [Okta System Log API Official Documentation](https://developer.okta.com/docs/reference/api/system-log/)\n\
    - [Okta Security Best Practices Guide](https://help.okta.com/oie/en-us/content/topics/security/security-best-practices.htm)\n\
    - [Mitigating Session Hijacking in Cloud Identity Providers](https://www.cisa.gov/news-events/cybersecurity-advisories)\n"
  tags:
  - Cloud
  - Infrastructure
  subTags:
  - Policy & Compliance
  - Monitoring & Alerting
  ee: false
  demo: false
outputs:
- id: total_events_audited
  type: INT
  value: '{{ outputs.scan_okta_system_logs.vars.total_events_audited }}'
- id: suspicious_user_count
  type: INT
  value: '{{ outputs.scan_okta_system_logs.vars.suspicious_user_count }}'
- id: is_alerting
  type: BOOLEAN
  value: '{{ outputs.scan_okta_system_logs.vars.is_alerting }}'
