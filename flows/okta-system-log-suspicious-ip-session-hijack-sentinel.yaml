    - [Okta Security Best Practices Guide](https://help.okta.com/oie/en-us/content/topics/security/security-best-practices.htm)
    - [Mitigating Session Hijacking in Cloud Identity Providers](https://www.cisa.gov/news-events/cybersecurity-advisories)
