id: github-repo-release-matrix-lakehouse-loader
namespace: company.analytics
description: Ingests upstream GitHub repository release tags and asset distributions into Parquet lakehouse storage via DuckDB, tracking release changes in Kestra KV store.

inputs:
  - id: repositories
    type: ARRAY
    itemType: STRING
    description: List of upstream GitHub repositories (owner/repo) to monitor for new version releases.
    defaults:
      - kestra-io/kestra
      - duckdb/duckdb
      - apache/arrow
      - pydantic/pydantic
      - tiangolo/fastapi
      - astral-sh/uv

  - id: state_key
    type: STRING
    description: Kestra KV store key maintaining the latest known repository release versions.
    defaults: github_monitored_repositories_release_state

variables:
  default_state: "{}"

triggers:
  - id: daily_github_sync
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 3 * * *"

tasks:
  - id: get_current_state
    type: io.kestra.plugin.core.kv.Get
    key: "{{ inputs.state_key }}"
    errorOnMissing: false

  - id: ingest_and_transform_releases
    type: io.kestra.plugin.scripts.python.Commands
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install requests duckdb
    commands:
      - |
        python3 - << 'EOF'
        import os
        import json
        import requests
        import duckdb
        from datetime import datetime

        raw_state = """{{ outputs.get_current_state.value ?? vars.default_state }}"""
        try:
            state = json.loads(raw_state) if raw_state else {}
        except Exception:
            state = {}

        repositories = json.loads("""{{ inputs.repositories | toJson }}""")

        headers = {
            "Accept": "application/vnd.github.v3+json",
            "User-Agent": "KestraReleaseMatrixLakehouse/1.0 (devops-audit@kestra.io)"
        }

        records = []
        new_releases = []
        new_state = dict(state)

        for repo in repositories:
            try:
                url = f"https://api.github.com/repos/{repo}/releases/latest"
                resp = requests.get(url, headers=headers, timeout=15)
                if resp.status_code == 200:
                    data = resp.json()

                    tag_name = data.get("tag_name", "")
                    release_name = data.get("name") or tag_name
                    published_at = data.get("published_at", "")
                    html_url = data.get("html_url", "")
                    assets = data.get("assets", [])
                    assets_count = len(assets)
                    total_download_count = sum(a.get("download_count", 0) for a in assets)

                    previous_ver = state.get(repo)
                    is_new_release = bool(previous_ver and previous_ver != tag_name)

                    records.append({
                        "repository": repo,
                        "latest_tag": tag_name,
                        "release_name": release_name,
                        "previous_tag": previous_ver if previous_ver else tag_name,
                        "is_new_release": is_new_release,
                        "published_at": published_at,
                        "assets_count": int(assets_count),
                        "total_asset_downloads": int(total_download_count),
                        "html_url": html_url,
                        "harvest_time": datetime.utcnow().isoformat()
                    })

                    if is_new_release:
                        new_releases.append({
                            "repository": repo,
                            "from_version": previous_ver,
                            "to_version": tag_name,
                            "url": html_url
                        })

                    new_state[repo] = tag_name
            except Exception as e:
                print(f"Warning: Failed to fetch release metadata for '{repo}': {e}")

        with open("github_releases.json", "w", encoding="utf-8") as f:
            json.dump(records, f)

        con = duckdb.connect()
        if records:
            con.execute("CREATE TABLE github_releases AS SELECT * FROM read_json_auto('github_releases.json')")
            con.execute("COPY github_releases TO 'github_release_matrix.parquet' (FORMAT PARQUET)")
            con.execute("COPY github_releases TO 'github_release_matrix.csv' (HEADER, DELIMITER ',')")
        else:
            con.execute("""
                CREATE TABLE github_releases (
                    repository VARCHAR,
                    latest_tag VARCHAR,
                    release_name VARCHAR,
                    previous_tag VARCHAR,
                    is_new_release BOOLEAN,
                    published_at VARCHAR,
                    assets_count BIGINT,
                    total_asset_downloads BIGINT,
                    html_url VARCHAR,
                    harvest_time VARCHAR
                )
            """)
            con.execute("COPY github_releases TO 'github_release_matrix.parquet' (FORMAT PARQUET)")
            con.execute("COPY github_releases TO 'github_release_matrix.csv' (HEADER, DELIMITER ',')")

        summary = {
            "monitored_repositories": len(records),
            "new_releases_count": len(new_releases),
            "new_releases": new_releases,
            "updated_state": new_state
        }

        print(f"::{{'outputs': {json.dumps(summary)}}}::")
        EOF
    outputFiles:
      - github_release_matrix.parquet
      - github_release_matrix.csv

  - id: persist_state
    type: io.kestra.plugin.core.kv.Set
    key: "{{ inputs.state_key }}"
    value: "{{ outputs.ingest_and_transform_releases.vars.updated_state | toJson }}"

  - id: check_new_releases
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.ingest_and_transform_releases.vars.new_releases_count > 0 }}"
    then:
      - id: notify_new_releases
        type: io.kestra.plugin.core.log.Log
        level: WARN
        message: "🚀 GitHub Upstream Release Detected: {{ outputs.ingest_and_transform_releases.vars.new_releases_count }} repository(ies) published new releases."

outputs:
  - id: monitored_count
    type: INT
    value: "{{ outputs.ingest_and_transform_releases.vars.monitored_repositories }}"
  - id: new_releases_count
    type: INT
    value: "{{ outputs.ingest_and_transform_releases.vars.new_releases_count }}"
  - id: dataset_parquet
    type: FILE
    value: "{{ outputs.ingest_and_transform_releases.outputFiles['github_release_matrix.parquet'] }}"

extend:
  title: GitHub Repository Release Matrix Lakehouse Loader with DuckDB
  metaTitle: GitHub Release Matrix Lakehouse Loader | Kestra
  shortDescription: Ingests upstream GitHub repository release tags and asset distributions into Parquet lakehouse storage via DuckDB.
  metaDescription: Poll GitHub REST API for repository releases, convert tags and download assets into Parquet via DuckDB, and track state in KV store.
  tags:
    - Data
  subTags:
    - ELT & Warehouse Loading
    - File & Data Processing Basics
  ee: false
  demo: false
  description: |
    Automate the collection, transformation, and analytical persistence of upstream GitHub release tags,
    asset download telemetry, and changelog metadata across open-source dependencies directly into Parquet using DuckDB.

    ## How it works

    1. **State Retrieval**: Retrieves previously observed release tag mappings from Kestra KV store (`github_monitored_repositories_release_state`).
    2. **GitHub Releases Ingestion**: Queries the official GitHub REST API endpoint (`/repos/{owner}/{repo}/releases/latest`) across critical project dependencies.
    3. **DuckDB Telemetry Normalization**: Parses tag names, asset download counts, release timestamps, and tarball URLs into a relational schema inside Docker.
    4. **Analytical Lake Export**: Generates columnar Parquet and CSV files for dependency supply chain auditing and automated changelog tracking.
    5. **Version Change Detection & State Commitment**: Detects newly published releases, logs targeted notifications, and commits updated version maps to Kestra KV store.

    ## What you get

    - Automated, scheduled tracking of core open-source repositories and infrastructure components.
    - Columnar Parquet audit datasets queryable by DuckDB, Trino, Snowflake, or Athena.
    - Built-in KV state management providing idempotent execution and zero external database dependencies.

    ## Who it's for

    - Platform Engineers and SecOps teams governing software supply chain security and dependency upgrades.
    - Data Engineers building reproducible multi-cloud lakehouse pipelines.
    - DevOps teams automating downstream build and test pipelines upon new core software releases.

    ## Why orchestrate this with Kestra

    - Built-in KV store maintains release version history across runs without database infrastructure.
    - Ephemeral Docker execution guarantees reproducible, clean Python and DuckDB runtimes.
    - Declarative scheduled execution with automated error recovery and conditional logging.

    ## Prerequisites

    - Docker runner configured on the Kestra worker.
    - Outbound internet access to `api.github.com`.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: (Optional) Webhook URL for alerting engineering teams on dependency upgrades.

    ## Quick start

    1. Import this blueprint into your Kestra instance.
    2. Adjust the `repositories` input list to track your team's upstream components.
    3. Click **Execute** to trigger an initial sync and generate the Parquet audit table.
    4. Enable the `daily_github_sync` schedule for automated daily audit updates.

    ## How to extend

    - Add an S3 or GCS upload step to archive daily release telemetry to a central data lake.
    - Attach an automated GitHub Actions dispatch step to run integration tests against new upstream releases.

    ## Links

    - [GitHub Releases API Documentation](https://docs.github.com/en/rest/releases/releases)
    - [DuckDB Documentation](https://duckdb.org/)
    - [Kestra Task Runners](https://kestra.io/docs/task-runners)
