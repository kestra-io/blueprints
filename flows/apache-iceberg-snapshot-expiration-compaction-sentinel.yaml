id: apache-iceberg-snapshot-expiration-compaction-sentinel
namespace: company.datalake

inputs:
  - id: trino_host
    type: STRING
    defaults: "trino.internal"
    description: Hostname of Trino / Starburst cluster connecting to Iceberg.
  - id: trino_port
    type: INT
    defaults: 8080
    description: Trino HTTP port.
  - id: trino_user
    type: STRING
    defaults: "kestra"
    description: Trino user.
  - id: catalog
    type: STRING
    defaults: "iceberg"
    description: Iceberg catalog name in Trino.
  - id: schema_name
    type: STRING
    description: Database / schema name.
  - id: table_name
    type: STRING
    description: Iceberg table name to audit.

tasks:
  - id: query_snapshots
    type: io.kestra.plugin.jdbc.trino.Query
    url: "jdbc:trino://{{ inputs.trino_host }}:{{ inputs.trino_port }}/{{ inputs.catalog }}/{{ inputs.schema_name }}"
    username: "{{ inputs.trino_user }}"
    sql: |
      SELECT 
        COUNT(*) AS total_snapshots
      FROM "{{ inputs.catalog }}"."{{ inputs.schema_name }}"."{{ inputs.table_name }}$snapshots";
    fetchOne: true

  - id: evaluate_snapshot_sprawl
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.query_snapshots.row.total_snapshots | int > 100 }}"
    then:
      - id: notify_datalake_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#datalake-alerts",
            "attachments": [
              {
                "color": "warning",
                "title": "❄️ Apache Iceberg Snapshot Sprawl Alert",
                "text": "Iceberg Table `{{ inputs.schema_name }}.{{ inputs.table_name }}` has accumulated *{{ outputs.query_snapshots.row.total_snapshots }} snapshots*! Neglected snapshot expiration increases metadata manifest read times, drastically slowing down query planning for Spark, Trino, and Flink engines.",
                "footer": "Kestra Data Lake Sentinel • Apache Iceberg"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#datalake-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ Apache Iceberg Sentinel Failure",
            "text": "Failed to query Iceberg table snapshots via Trino. Verify Trino connectivity and table existence.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 8 * * 1"
    disabled: true
    inputs:
      schema_name: replace-with-your-schema-name
      table_name: replace-with-your-table-name

extend:
  metaDescription: "Audits Apache Iceberg table snapshots and metadata file sprawl to prevent query planning latency regression."
  metaTitle: Apache Iceberg Table Snapshot Sprawl and Small File Compaction Sentinel with Kestra
  title: Apache Iceberg Table Snapshot Sprawl and Small File Compaction Sentinel
  shortDescription: Audits Apache Iceberg table snapshots and metadata file sprawl to prevent query planning latency regression.
  description: |
    ## How it works
    This workflow connects to Apache Iceberg metadata catalogs via the JDBC Trino plugin to query the `$snapshots` metadata system table for critical production tables. Every append, overwrite, or delete transaction in Apache Iceberg creates an immutable snapshot. If table maintenance procedures (such as `expire_snapshots` and `remove_orphan_files`) are not run periodically, tables accumulate hundreds of old snapshots and thousands of manifest list files. This metadata sprawl causes query planning times in Trino, Spark, and Presto to balloon from milliseconds to minutes. This workflow tracks snapshot counts and alerts data lake teams.

    ## What you get
    - Real-time visibility into Apache Iceberg table metadata bloat.
    - Prevents query planning latency degradation in lakehouse query engines.
    - Quantitative tracking of total active snapshots.

    ## Who it's for
    - Data Lakehouse Architects and Lakehouse Platform Engineers.
    - Analytics Engineers operating Apache Iceberg on S3, GCS, or Azure ADLS.

    ## Why orchestrate this with Kestra
    - **Native Trino Driver Integration**: Direct SQL queries against Iceberg metadata tables.
    - **Continuous Lakehouse Hygiene**: Automates periodic maintenance audits weekly.
    - **Direct Team Alerts**: Escalates metadata sprawl directly to data engineering channels.

    ## Prerequisites
    - Trino or Starburst cluster with Iceberg catalog configured.
    - Secret `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import the blueprint.
    2. Input Trino host, port, catalog, schema, and table name.
    3. Run the workflow to inspect snapshot counts.

    ## How to extend
    - Automatically trigger `ALTER TABLE ... EXECUTE expire_snapshots(retention_threshold => '7d')`.
    - Check the `$files` metadata table to identify small file fragmentation requiring compaction.

    ## Links
    - [Apache Iceberg Table Maintenance Documentation](https://iceberg.apache.org/docs/latest/maintenance/)
    - [Kestra Documentation](https://kestra.io/docs)
  tags:
    - Data
    - Cloud
  subTags:
    - ELT & Data Landing
    - Infrastructure Automation
  ee: false
  verified: false
  demo: false
