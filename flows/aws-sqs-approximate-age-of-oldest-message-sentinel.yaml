id: aws-sqs-approximate-age-of-oldest-message-sentinel
namespace: company.messaging
description: Audits Amazon SQS queues for ApproximateAgeOfOldestMessage metrics via
  CloudWatch, detects consumer lag backlogs exceeding SLA thresholds, logs an automated
  GitHub incident ticket, and alerts Slack.
inputs:
- id: aws_region
  type: STRING
  displayName: AWS Region
  defaults: us-east-1
- id: queue_name
  type: STRING
  displayName: SQS Queue Name
  defaults: order-processing-queue
- id: max_age_seconds_threshold
  type: INT
  displayName: Max Age Threshold (Seconds)
  defaults: 1800
- id: target_repository
  type: STRING
  displayName: Incident Tracking Repository
  defaults: my-org/messaging-platform
triggers:
- id: periodic_sqs_age_check
  type: io.kestra.plugin.core.trigger.Schedule
  cron: '*/15 * * * *'
  disabled: true
tasks:
- id: probe_sqs_age_metric
  type: io.kestra.plugin.aws.cli.AwsCLI
  description: Queries CloudWatch for SQS ApproximateAgeOfOldestMessage metric over
    the last 15 minutes
  accessKeyId: '{{ secret(''AWS_ACCESS_KEY_ID'') }}'
  secretKeyId: '{{ secret(''AWS_SECRET_ACCESS_KEY'') }}'
  region: '{{ inputs.aws_region }}'
  commands:
  - aws cloudwatch get-metric-data --metric-data-queries '[{"Id":"m1","MetricStat":{"Metric":{"Namespace":"AWS/SQS","MetricName":"ApproximateAgeOfOldestMessage","Dimensions":[{"Name":"QueueName","Value":"{{
    inputs.queue_name }}"}]},"Period":900,"Stat":"Maximum"},"ReturnData":true}]' --start-time
    $(date -u -v-15M +%Y-%m-%dT%H:%M:%SZ) --end-time $(date -u +%Y-%m-%dT%H:%M:%SZ)
    --output json | tr -d '\n' | xargs -0 -I {} echo '::{"outputs":{}}::'
- id: evaluate_message_age
  type: io.kestra.plugin.core.debug.Return
  description: Evaluates maximum message age against SLA threshold
  format:
    queue: '{{ inputs.queue_name }}'
    oldest_age_seconds: '{{ outputs.probe_sqs_age_metric.vars.MetricDataResults[0].Values[0]
      ?? 0 }}'
    threshold_seconds: '{{ inputs.max_age_seconds_threshold }}'
    is_sla_breached: '{{ (outputs.probe_sqs_age_metric.vars.MetricDataResults[0].Values[0]
      ?? 0) >= inputs.max_age_seconds_threshold }}'
- id: branch_on_age_breach
  type: io.kestra.plugin.core.flow.If
  description: Branches based on whether message age breached SLA threshold
  condition: '{{ outputs.evaluate_message_age.value.is_sla_breached == true }}'
  then:
  - id: create_sqs_incident_issue
    type: io.kestra.plugin.github.issues.Create
    description: Logs a prioritized GitHub issue tracking consumer processing latency
    oauthToken: '{{ secret(''GITHUB_TOKEN'') }}'
    repository: '{{ inputs.target_repository }}'
    title: '[SQS Alert] Message Processing Latency SLA Breached on {{ inputs.queue_name
      }}'
    body: "## \U0001F6A8 Amazon SQS Message Age SLA Breach\n\nThe messaging sentinel\
      \ detected messages languishing unprocessed in queue:\n- **Queue Name:** `{{\
      \ inputs.queue_name }}`\n- **Oldest Message Age:** **{{ outputs.evaluate_message_age.value.oldest_age_seconds\
      \ }} seconds**\n- **SLA Threshold:** `{{ inputs.max_age_seconds_threshold }}\
      \ seconds`\n\nPlease verify consumer worker container health and database write\
      \ contention.\n*Generated automatically by Kestra SQS Sentinel.*"
  - id: alert_messaging_slack
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Dispatches high-priority alert to messaging Slack channel
    url: '{{ secret(''SLACK_WEBHOOK'') }}'
    payload: "{{ {'text': '\U0001F6A8 *Amazon SQS Consumer Lag SLA Breach*\\n*Queue:*\
      \ `' ~ inputs.queue_name ~ '`\\n*Oldest Message:* *' ~ outputs.evaluate_message_age.value.oldest_age_seconds\
      \ ~ 's* (Threshold: `' ~ inputs.max_age_seconds_threshold ~ 's`)\\n*Incident\
      \ Ticket:* <' ~ (outputs.create_sqs_incident_issue.issueUrl ?? '#') ~ '|View\
      \ GitHub Issue>'} | toJson }}"
  else:
  - id: log_queue_healthy
    type: io.kestra.plugin.core.log.Log
    message: SQS queue {{ inputs.queue_name }} message latency is within SLA ({{ outputs.evaluate_message_age.value.oldest_age_seconds
      }}s < {{ inputs.max_age_seconds_threshold }}s).
- id: log_audit_complete
  type: io.kestra.plugin.core.log.Log
  description: Final audit status log
  message: 'SQS age audit complete for {{ inputs.queue_name }}. Age: {{ outputs.evaluate_message_age.value.oldest_age_seconds
    }}s.'
errors:
- id: alert_flow_failure
  type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
  description: Alerts Slack on execution failure
  url: '{{ secret(''SLACK_WEBHOOK'') }}'
  payload: "{{ {'text': '\u26A0\uFE0F *Amazon SQS Sentinel Failed* in execution `'\
    \ ~ execution.id ~ '`.'} | toJson }}"
extend:
  title: Amazon SQS Message Age and Consumer Processing Lag Sentinel
  shortDescription: Audit Amazon SQS ApproximateAgeOfOldestMessage via CloudWatch,
    detect consumer processing delays, log GitHub issues, and alert Slack.
  metaTitle: Amazon SQS Message Age Sentinel with Kestra
  metaDescription: Monitor Amazon SQS message age and consumer lag with Kestra. Query
    CloudWatch metrics, open GitHub issues, and alert Slack.
  description: 'Asynchronous event-driven architectures rely on Amazon SQS queues
    to decouple producers from background processing consumers. When consumer pods
    crash, encounter database deadlock stalls, or scale insufficiently during traffic
    spikes, messages accumulate and age in the queue. This blueprint monitors CloudWatch
    ApproximateAgeOfOldestMessage metrics, detects SLA breaches, opens an automated
    GitHub tracking ticket, and alerts the messaging team on Slack.


    ## How it works


    1. `periodic_sqs_age_check` runs every 15 minutes.

    2. `probe_sqs_age_metric` queries CloudWatch for Maximum ApproximateAgeOfOldestMessage.

    3. `evaluate_message_age` evaluates if age exceeds SLA threshold.

    4. `branch_on_age_breach` logs a GitHub issue and alerts Slack if breached.

    5. `log_audit_complete` logs final outcome.

    6. `errors` block alerts Slack on execution failure.


    ## What you get


    - Continuous auditing of message processing latency.

    - Early warning before customer-facing SLA breaches.

    - Automated GitHub tracking tickets with queue metrics.

    - Real-time Slack notifications.


    ## Who it''s for


    - Platform Engineers and SREs maintaining AWS messaging queues.

    - Backend developers operating asynchronous task consumers.

    - Operations teams tracking processing SLAs.


    ## Why orchestrate this with Kestra


    Kestra unifies AWS CloudWatch querying, conditional escalation, and chat notifications
    in a single auditable workflow.


    ## Prerequisites


    - An AWS account with an active SQS queue.

    - AWS IAM credentials with CloudWatch read permissions.

    - A GitHub Personal Access Token.

    - A Slack incoming webhook URL.


    ### Secrets


    - `AWS_ACCESS_KEY_ID`, `AWS_SECRET_ACCESS_KEY`: AWS credentials.

    - `GITHUB_TOKEN`: GitHub token.

    - `SLACK_WEBHOOK`: Slack webhook URL.


    ## Inputs


    - `aws_region`: Target region.

    - `queue_name`: SQS queue name.

    - `max_age_seconds_threshold`: Max age before alerting.

    - `target_repository`: GitHub repository.


    ## Outputs


    - `outputs.evaluate_message_age.value.oldest_age_seconds`: Age of oldest message.

    - `outputs.evaluate_message_age.value.is_sla_breached`: Boolean breach flag.


    ## Quick start


    1. Configure secrets.

    2. Set inputs to match target SQS queue.

    3. Execute manually to verify metrics.

    4. Enable schedule trigger.


    ## How to extend


    - Add AWS Auto Scaling tasks to spin up additional consumer worker instances.

    - Route urgent alerts to PagerDuty.


    ## Links


    - [Amazon SQS CloudWatch Metrics](https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-monitoring-using-cloudwatch.html)

    - [Kestra AWS Plugin](https://kestra.io/plugins/plugin-aws)'
  tags:
    - Cloud
    - Infrastructure
  subTags:
    - Monitoring & Alerting
  ee: false
  demo: false
