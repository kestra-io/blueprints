id: npm-package-registry-release-audit-loader
namespace: company.analytics
description: Ingests upstream npm package release versions and bundle asset metadata into Parquet lakehouse storage via DuckDB, tracking semver state in Kestra KV store.

inputs:
  - id: packages
    type: ARRAY
    itemType: STRING
    description: List of critical npm packages to audit and ingest.
    defaults:
      - vue
      - react
      - vite
      - lodash
      - axios
      - pinia

  - id: state_key
    type: STRING
    description: Kestra KV store key maintaining the latest known package versions.
    defaults: npm_monitored_packages_version_state

variables:
  default_state: "{}"

triggers:
  - id: daily_npm_sync
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 6 * * *"

tasks:
  - id: get_current_state
    type: io.kestra.plugin.core.kv.Get
    key: "{{ inputs.state_key }}"
    errorOnMissing: false

  - id: ingest_and_transform_packages
    type: io.kestra.plugin.scripts.python.Commands
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install requests duckdb
    commands:
      - |
        python3 - << 'EOF'
        import os
        import json
        import requests
        import duckdb
        from datetime import datetime

        raw_state = """{{ outputs.get_current_state.value ?? vars.default_state }}"""
        try:
            state = json.loads(raw_state) if raw_state else {}
        except Exception:
            state = {}

        packages = json.loads("""{{ inputs.packages | toJson }}""")

        headers = {
            "User-Agent": "KestraNpmAuditLakehouse/1.0 (devops-supply-chain@kestra.io)"
        }

        records = []
        new_releases = []
        new_state = dict(state)

        for pkg in packages:
            try:
                url = f"https://registry.npmjs.org/{pkg}/latest"
                resp = requests.get(url, headers=headers, timeout=15)
                if resp.status_code == 200:
                    data = resp.json()

                    pkg_name = data.get("name", pkg)
                    latest_ver = data.get("version", "")
                    license_name = data.get("license", "Unknown")
                    description = (data.get("description") or "")[:250]
                    dist = data.get("dist", {})
                    unpacked_size = dist.get("unpackedSize", 0)
                    file_count = dist.get("fileCount", 0)
                    tarball_url = dist.get("tarball", "")

                    previous_ver = state.get(pkg_name)
                    is_new_release = bool(previous_ver and previous_ver != latest_ver)

                    records.append({
                        "package_name": pkg_name,
                        "latest_version": latest_ver,
                        "previous_version": previous_ver if previous_ver else latest_ver,
                        "is_new_release": is_new_release,
                        "license": license_name,
                        "unpacked_size_bytes": int(unpacked_size),
                        "file_count": int(file_count),
                        "tarball_url": tarball_url,
                        "description": description,
                        "audit_timestamp": datetime.utcnow().isoformat()
                    })

                    if is_new_release:
                        new_releases.append({
                            "package": pkg_name,
                            "from_version": previous_ver,
                            "to_version": latest_ver
                        })

                    new_state[pkg_name] = latest_ver
            except Exception as e:
                print(f"Warning: Failed to fetch npm metadata for '{pkg}': {e}")

        with open("npm_releases.json", "w", encoding="utf-8") as f:
            json.dump(records, f)

        con = duckdb.connect()
        if records:
            con.execute("CREATE TABLE npm_audit AS SELECT * FROM read_json_auto('npm_releases.json')")
            con.execute("COPY npm_audit TO 'npm_package_audit.parquet' (FORMAT PARQUET)")
            con.execute("COPY npm_audit TO 'npm_package_audit.csv' (HEADER, DELIMITER ',')")
        else:
            con.execute("""
                CREATE TABLE npm_audit (
                    package_name VARCHAR,
                    latest_version VARCHAR,
                    previous_version VARCHAR,
                    is_new_release BOOLEAN,
                    license VARCHAR,
                    unpacked_size_bytes BIGINT,
                    file_count BIGINT,
                    tarball_url VARCHAR,
                    description VARCHAR,
                    audit_timestamp VARCHAR
                )
            """)
            con.execute("COPY npm_audit TO 'npm_package_audit.parquet' (FORMAT PARQUET)")
            con.execute("COPY npm_audit TO 'npm_package_audit.csv' (HEADER, DELIMITER ',')")

        summary = {
            "monitored_packages": len(records),
            "new_releases_count": len(new_releases),
            "new_releases": new_releases,
            "updated_state": new_state
        }

        print(f"::{{'outputs': {json.dumps(summary)}}}::")
        EOF
    outputFiles:
      - npm_package_audit.parquet
      - npm_package_audit.csv

  - id: persist_state
    type: io.kestra.plugin.core.kv.Set
    key: "{{ inputs.state_key }}"
    value: "{{ outputs.ingest_and_transform_packages.vars.updated_state | toJson }}"

  - id: check_new_releases
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.ingest_and_transform_packages.vars.new_releases_count > 0 }}"
    then:
      - id: notify_package_update
        type: io.kestra.plugin.core.log.Log
        level: WARN
        message: "📦 npm Package Release Detected: {{ outputs.ingest_and_transform_packages.vars.new_releases_count }} production package(s) published new upstream releases."

outputs:
  - id: monitored_count
    type: INT
    value: "{{ outputs.ingest_and_transform_packages.vars.monitored_packages }}"
  - id: new_releases_count
    type: INT
    value: "{{ outputs.ingest_and_transform_packages.vars.new_releases_count }}"
  - id: dataset_parquet
    type: FILE
    value: "{{ outputs.ingest_and_transform_packages.outputFiles['npm_package_audit.parquet'] }}"

extend:
  title: npm Package Registry Release Audit Loader with DuckDB
  metaTitle: npm Package Registry Release Audit Loader | Kestra
  shortDescription: Ingests upstream npm package release versions and bundle asset metadata into Parquet lakehouse storage via DuckDB.
  metaDescription: Poll npm registry REST API for package releases, extract bundle sizes and semver into Parquet via DuckDB, and track state in KV store.
  tags:
    - Data
  subTags:
    - ELT & Warehouse Loading
    - File & Data Processing Basics
  ee: false
  demo: false
  description: |
    Automate the scheduled harvesting, transformation, and analytical lakehouse persistence of upstream npm
    package releases, bundle sizes, licenses, and tarball distributions directly from the npm registry API into Parquet using DuckDB.

    ## How it works

    1. **State Recovery**: Reads previous package version mappings from Kestra KV store (`npm_monitored_packages_version_state`) to detect newly uploaded semver releases.
    2. **npm Registry Ingestion**: Queries the official npm registry endpoint (`registry.npmjs.org/{package}/latest`) for mission-critical frontend and backend dependencies.
    3. **DuckDB Semver & Size Normalization**: Extracts bundle unpacked file sizes, file counts, licensing metadata, and distribution URLs into a relational schema inside Docker.
    4. **Analytical Lake Export**: Exports normalized audit records into columnar Parquet and CSV files for dependency supply-chain auditing and internal package tracking.
    5. **Version Change Detection & State Commitment**: Flags packages that published new upstream releases and commits the updated version mapping to Kestra KV store.

    ## What you get

    - Automated recurring dependency release tracking protecting enterprise pipelines from unannounced upstream library breaking changes.
    - Columnar Parquet datasets capturing release history, artifact bundle sizes, and licensing metadata.
    - Built-in KV state management providing idempotent execution and automated semver drift detection.

    ## Who it's for

    - Frontend and Fullstack Engineers tracking third-party JavaScript package updates.
    - Platform Engineers and SecOps teams governing npm software supply chain dependencies.
    - Data Engineers building reproducible multi-cloud lakehouse pipelines.

    ## Why orchestrate this with Kestra

    - Built-in KV store maintains package version state across runs without external database infrastructure.
    - Ephemeral Docker execution guarantees isolated Python and DuckDB dependencies cleanly.
    - Declarative flow control provides transparent logging, automated error handling, and scheduled execution.

    ## Prerequisites

    - Docker runtime configured on the Kestra worker.
    - Outbound internet access to `registry.npmjs.org`.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: (Optional) Webhook URL for forwarding dependency upgrade alerts.

    ## Quick start

    1. Import this blueprint into your Kestra instance.
    2. Adjust the `packages` input array with your team's critical JavaScript and TypeScript libraries.
    3. Click **Execute** to run an initial release metadata harvest.
    4. Enable the `daily_npm_sync` trigger for automated daily synchronization.

    ## How to extend

    - Add an S3 or Google Cloud Storage upload task to archive quarterly dependency audit snapshots.
    - Connect an automated PR creation task or GitHub Actions webhook to trigger dependency test suites.

    ## Links

    - [npm Registry API Documentation](https://github.com/npm/registry/blob/master/docs/REGISTRY-API.md)
    - [DuckDB Documentation](https://duckdb.org/)
    - [Kestra Task Runners](https://kestra.io/docs/task-runners)
