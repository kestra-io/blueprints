id: pubmed-pharmacovigilance-literature-screening
namespace: company.team

description: |
  Weekly local literature screening for pharmacovigilance. For each product, PubMed is searched
  for records added in the last few days that match a safety filter (adverse effects, toxicity,
  case reports, overdose, medication errors, pregnancy exposure). PMIDs already screened in an
  earlier run are skipped. Only the new records are fetched, in one batch, and each one is
  triaged for the safety reviewers: case reports are possible ICSRs, retractions and errata are
  notices, and missing abstracts or non-English records are flagged. A per-product search log
  records the exact query and hit count, including searches with zero hits and product terms
  that PubMed does not recognise.

inputs:
  - id: products
    type: ARRAY
    itemType: STRING
    defaults:
      - semaglutide OR Ozempic OR Wegovy
      - clopidogrel OR Plavix
      - inclisiran OR Leqvio
      - valproic acid OR valproate OR Depakote
    description: One PubMed query fragment per product (active substance and brand names joined with OR). Each fragment is searched on its own, so every hit is attributed to its product.

  - id: safety_filter
    type: STRING
    defaults: adverse effects[sh] OR drug-related side effects and adverse reactions[mh] OR toxicity[sh] OR poisoning[sh] OR adverse event*[tiab] OR side effect*[tiab] OR case reports[pt] OR overdose[tiab] OR medication errors[mh] OR pregnancy[mh] OR off-label use[mh]
    description: Safety terms combined with each product using AND. The default covers adverse reactions plus the GVP special situations (overdose, medication error, pregnancy, off-label use).

  - id: include_notices
    type: BOOL
    defaults: true
    description: Also return errata, retractions and expressions of concern about the product even when they do not match the safety filter. Notices are rarely indexed with safety terms, but one can retract a case you already reported.

  - id: lookback_days
    type: INT
    defaults: 8
    description: Window on the PubMed entry date (`reldate` with `datetype=edat`). Eight days on a weekly schedule leaves a one-day overlap, and records seen in that overlap are skipped by the KV state.

  - id: contact_email
    type: STRING
    defaults: pv-literature@example.com
    description: Sent as the E-utilities `email` parameter, as NCBI asks for. NCBI uses it to contact you before blocking a misbehaving tool.

  - id: retention_days
    type: INT
    defaults: 90
    description: Screened PMIDs stay in the KV state this long. This needs to be longer than `lookback_days`.

triggers:
  - id: weekly_screening
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 5 * * 1"
    description: Monday 05:00 UTC, so the reviewers have the week's screening list at the start of the week.

tasks:
  - id: previous_screened
    type: io.kestra.plugin.core.kv.Get
    key: pv_literature_screened_pmids
    errorOnMissing: false
    description: JSON object mapping each PMID to the date it was first screened. It is missing on the first run, so that run is a baseline and every record in the window is new.

  - id: screen
    type: io.kestra.plugin.scripts.python.Script
    description: |
      Runs one ESearch per product, paced at 0.4 s to stay under the 3 requests per second that NCBI
      allows without an API key, and removes PMIDs that are already screened. It then fetches only
      the new records, with one EFetch POST per 200 PMIDs, parses the PubMed XML and triages each
      record. It writes the screening list, the search log and the updated KV state.
    containerImage: python:3.13-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    inputFiles:
      seen.json: "{{ outputs.previous_screened.value ?? '{}' }}"
    outputFiles:
      - screening.csv
      - search_log.csv
      - seen_now.json
    env:
      PRODUCTS: "{{ inputs.products | toJson }}"
      SAFETY_FILTER: "{{ inputs.safety_filter }}"
      INCLUDE_NOTICES: "{{ inputs.include_notices }}"
      LOOKBACK_DAYS: "{{ inputs.lookback_days }}"
      RETENTION_DAYS: "{{ inputs.retention_days }}"
      CONTACT_EMAIL: "{{ inputs.contact_email }}"
      EXECUTION_URL: "{{ kestra.url ?? '' }}/ui/executions/{{ flow.namespace }}/{{ flow.id }}/{{ execution.id }}"
    script: |
      import csv, json, os, re, time, datetime, urllib.parse, urllib.request
      import xml.etree.ElementTree as ET

      EUTILS = "https://eutils.ncbi.nlm.nih.gov/entrez/eutils/"
      EMAIL = os.environ["CONTACT_EMAIL"]
      today = datetime.date.today()
      products = json.loads(os.environ["PRODUCTS"])
      seen = json.loads(open("seen.json").read() or "{}")
      is_baseline = not seen

      def eutils(endpoint, params):
          data = urllib.parse.urlencode({**params, "db": "pubmed", "tool": "kestra-pv-literature", "email": EMAIL}).encode()
          req = urllib.request.Request(EUTILS + endpoint, data=data, headers={"User-Agent": f"kestra-pv-literature/1.0 ({EMAIL})"})
          for attempt in range(4):
              try:
                  time.sleep(0.4)
                  return urllib.request.urlopen(req, timeout=60).read()
              except Exception as exc:
                  if attempt == 3:
                      raise
                  print(f"{endpoint} retry after {exc}")
                  time.sleep(2 ** attempt)

      NOTICE_TYPES = ["Published Erratum", "Retraction of Publication", "Retracted Publication", "Expression of Concern"]
      NOTICE_PT = " OR ".join(f'"{t}"[pt]' for t in NOTICE_TYPES)
      log_rows, hits = [], {}
      for product in products:
          scope = f"({os.environ['SAFETY_FILTER']})"
          if os.environ["INCLUDE_NOTICES"] == "true":
              scope = f"({scope} OR {NOTICE_PT})"
          term = f"({product}) AND {scope}"
          try:
              er = json.loads(eutils("esearch.fcgi", {"term": term, "retmode": "json", "retmax": 500,
                                                       "datetype": "edat", "reldate": os.environ["LOOKBACK_DAYS"]}))["esearchresult"]
          except Exception as exc:
              er = {"ERROR": str(exc)}
          missing = (er.get("errorlist") or {}).get("phrasesnotfound", [])
          count, ids = int(er.get("count", 0)), er.get("idlist", [])
          status = ("ERROR" if "count" not in er else "TERM_NOT_FOUND" if missing
                    else "TRUNCATED" if count > len(ids) else "OK" if count else "NO_HITS")
          log_rows.append({"product": product, "status": status, "hits": count, "retrieved": len(ids),
                           "phrases_not_found": "; ".join(missing) or er.get("ERROR", ""),
                           "query": er.get("querytranslation", term), "run_date": today.isoformat()})
          for pmid in ids:
              hits.setdefault(pmid, []).append(product)

      new_pmids = sorted(p for p in hits if p not in seen)
      articles = {}
      for i in range(0, len(new_pmids), 200):
          root = ET.fromstring(eutils("efetch.fcgi", {"retmode": "xml", "id": ",".join(new_pmids[i:i + 200])}))
          for art in root.iter("PubmedArticle"):
              articles[art.findtext("MedlineCitation/PMID")] = art

      def text(el):
          return " ".join("".join(el.itertext()).split()) if el is not None else ""

      rows = []
      for pmid in new_pmids:
          art = articles.get(pmid)
          if art is None:
              rows.append({"pmid": pmid, "priority": "NOT_RETURNED", "products": " | ".join(hits[pmid]),
                           "flags": "EFetch returned no PubmedArticle (book chapter or deleted record)"})
              continue
          a = art.find("MedlineCitation/Article")
          title = text(a.find("ArticleTitle"))
          abstract = " ".join(((p.get("Label") + ": ") if p.get("Label") else "") + text(p)
                              for p in a.findall("Abstract/AbstractText"))
          pubtypes = [text(p) for p in a.findall("PublicationTypeList/PublicationType")]
          langs = [l.text for l in a.findall("Language")]
          doi = next((e.text for e in a.findall("ELocationID") if e.get("EIdType") == "doi"), "")
          blob = (title + " " + abstract).lower()
          names = [nm.strip().lower() for p in hits[pmid] for nm in re.split(r"\s+OR\s+", p)]
          flags = []
          if not abstract:
              flags.append("NO_ABSTRACT")
          if langs and "eng" not in langs:
              flags.append("NON_ENGLISH:" + ",".join(langs))
          if not any(nm in blob for nm in names):
              flags.append("PRODUCT_NOT_IN_TEXT")
          priority = ("NOTICE" if set(NOTICE_TYPES) & set(pubtypes) else
                      "ICSR_CANDIDATE" if "Case Reports" in pubtypes else "REVIEW")
          rows.append({"pmid": pmid, "priority": priority, "products": " | ".join(hits[pmid]),
                       "flags": "; ".join(flags), "title": title, "journal": a.findtext("Journal/ISOAbbreviation", ""),
                       "pub_types": "; ".join(pubtypes), "doi": doi,
                       "url": f"https://pubmed.ncbi.nlm.nih.gov/{pmid}/", "abstract": abstract})

      order = {"ICSR_CANDIDATE": 0, "NOTICE": 1, "REVIEW": 2, "NOT_RETURNED": 3}
      rows.sort(key=lambda r: (order[r["priority"]], r["pmid"]))
      cols = ["pmid", "priority", "products", "flags", "title", "journal", "pub_types", "doi", "url", "abstract"]
      with open("screening.csv", "w", newline="", encoding="utf-8") as f:
          w = csv.DictWriter(f, fieldnames=cols, restval="")
          w.writeheader(); w.writerows(rows)
      with open("search_log.csv", "w", newline="", encoding="utf-8") as f:
          w = csv.DictWriter(f, fieldnames=list(log_rows[0]) if log_rows else ["product"])
          w.writeheader(); w.writerows(log_rows)

      cutoff = (today - datetime.timedelta(days=int(os.environ["RETENTION_DAYS"]))).isoformat()
      seen_now = {p: d for p, d in seen.items() if d >= cutoff}
      seen_now.update({p: today.isoformat() for p in new_pmids})
      json.dump(seen_now, open("seen_now.json", "w"))

      def n(prio): return sum(r["priority"] == prio for r in rows)
      top = [r for r in rows if r["priority"] in ("ICSR_CANDIDATE", "NOTICE")][:10]
      digest = "\n".join(f"- {r['priority']}: <{r['url']}|{r['pmid']}> {r['title'][:140]} ({r['products']})" for r in top)
      bad = [r["product"] for r in log_rows if r["status"] in ("TERM_NOT_FOUND", "ERROR", "TRUNCATED")]
      url = os.environ["EXECUTION_URL"]
      slack_text = (f":pill: *PV literature screening*{' (BASELINE run)' if is_baseline else ''}: {len(rows)} new PubMed records, "
                    f"{n('ICSR_CANDIDATE')} possible ICSRs, {n('NOTICE')} errata or retraction notices, {n('REVIEW')} to review\n{digest}"
                    + (f"\n:warning: Check these searches: {'; '.join(bad)}" if bad else "")
                    + (f"\nScreening list: {url}" if url.startswith("http") else ""))
      print("::" + json.dumps({"outputs": {
          "products": len(products), "hits": sum(r["hits"] for r in log_rows), "unique_pmids": len(hits),
          "already_screened": len(hits) - len(new_pmids), "new_records": len(rows),
          "icsr_candidates": n("ICSR_CANDIDATE"), "notices": n("NOTICE"), "review": n("REVIEW"),
          "not_returned": n("NOT_RETURNED"),
          "no_abstract": sum("NO_ABSTRACT" in r["flags"] for r in rows),
          "non_english": sum("NON_ENGLISH" in r["flags"] for r in rows),
          "product_not_in_text": sum("PRODUCT_NOT_IN_TEXT" in r["flags"] for r in rows),
          "is_baseline": is_baseline, "problem_searches": "; ".join(bad), "digest": digest, "slack_text": slack_text}}) + "::")

  - id: save_screened
    type: io.kestra.plugin.core.kv.Set
    key: pv_literature_screened_pmids
    value: "{{ read(outputs.screen.outputFiles['seen_now.json']) }}"
    description: Stores the screened PMIDs, minus any older than `retention_days`, so a record is screened only once.

  - id: route
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.screen.vars.new_records > 0 }}"
    then:
      - id: notify_reviewers
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        allowFailure: true
        description: allowFailure keeps the run green if the webhook is not configured. The screening CSV is the record either way.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: "{{ {'text': outputs.screen.vars.slack_text} | toJson }}"
    else:
      - id: nothing_new
        type: io.kestra.plugin.core.log.Log
        message: "No new PubMed records for {{ outputs.screen.vars.products }} products ({{ outputs.screen.vars.hits }} hits, all already screened). search_log.csv still documents each search and its hit count."

  - id: warn_problem_searches
    type: io.kestra.plugin.core.log.Log
    runIf: "{{ outputs.screen.vars.problem_searches is not empty }}"
    level: WARN
    message: "These product searches need attention (term not recognised by PubMed, an E-utilities error, or more than 500 hits). See search_log.csv: {{ outputs.screen.vars.problem_searches }}"

  - id: summary
    type: io.kestra.plugin.core.log.Log
    message: |
      Screened {{ outputs.screen.vars.products }} products over the last {{ inputs.lookback_days }} days{{ outputs.screen.vars.is_baseline ? ' (BASELINE run)' : '' }}: {{ outputs.screen.vars.hits }} hits, {{ outputs.screen.vars.unique_pmids }} unique PMIDs, {{ outputs.screen.vars.already_screened }} already screened.
      New records {{ outputs.screen.vars.new_records }}: ICSR candidates {{ outputs.screen.vars.icsr_candidates }}, notices {{ outputs.screen.vars.notices }}, review {{ outputs.screen.vars.review }}, not returned {{ outputs.screen.vars.not_returned }}. Flags: no abstract {{ outputs.screen.vars.no_abstract }}, non-English {{ outputs.screen.vars.non_english }}, product only in the indexing {{ outputs.screen.vars.product_not_in_text }}.
      {{ outputs.screen.vars.digest }}

outputs:
  - id: summary
    type: JSON
    value: "{{ outputs.screen.vars }}"
  - id: screening_csv
    type: FILE
    value: "{{ outputs.screen.outputFiles['screening.csv'] }}"
  - id: search_log_csv
    type: FILE
    value: "{{ outputs.screen.outputFiles['search_log.csv'] }}"

extend:
  title: Weekly PubMed Literature Screening for Pharmacovigilance with ICSR Triage
  metaTitle: PubMed Pharmacovigilance Literature Screening with NCBI E-utilities | Kestra
  shortDescription: Search PubMed every week for new safety literature on each of your products, skip records already screened, fetch only the new abstracts and triage them into possible ICSRs, errata/retraction notices and records to review, with a per-product search log for the audit trail.
  metaDescription: Weekly PubMed safety literature screen per product via NCBI E-utilities, KV dedupe, ICSR-candidate triage, screening CSV, search log and Slack digest.
  description: |
    Marketing authorisation holders must screen the literature for their products at least weekly (EU GVP Module VI) and assess each case report as a possible individual case safety report (ICSR). This flow runs that PubMed search per product, fetches only records not screened before and hands reviewers a sorted screening list, plus a search log so a zero-hit week is documented as screened.

    ## How it works

    1. A Monday 05:00 UTC `Schedule`. `products` holds one PubMed query fragment per product (substance and brand names joined with `OR`).
    2. `previous_screened` (KV Get) reads the PMIDs already screened; it is missing on the first run, which is a BASELINE.
    3. `screen` (Python, stdlib only) runs one ESearch per product, `(product) AND (safety_filter)` on the entry date (`datetype=edat`, `reldate=lookback_days`), plus errata, retractions and expressions of concern when `include_notices` is on. Requests are paced at 0.4 s and retried. Only unscreened PMIDs are fetched, one EFetch POST per 200 IDs.
    4. Each new record gets a priority, `ICSR_CANDIDATE` (Case Reports), `NOTICE`, `REVIEW` or `NOT_RETURNED`, and flags: `NO_ABSTRACT`, `NON_ENGLISH`, `PRODUCT_NOT_IN_TEXT` (matched only via MeSH). A PMID found by several products is listed once.
    5. `save_screened` (KV Set) stores the state, dropping PMIDs older than `retention_days`.
    6. `route` (If) posts a Slack digest of possible ICSRs and notices, or logs that nothing is new. `warn_problem_searches` warns on unrecognised product terms, E-utilities errors or more than 500 hits.

    ## What you get

    - `screening_csv`: one row per new record with priority, flags, title, journal, publication types, DOI, link and abstract.
    - `search_log_csv`: per-product status (`OK`, `NO_HITS`, `TERM_NOT_FOUND`, `TRUNCATED`, `ERROR`), hit count and PubMed's query translation.
    - Each record is screened once, and a misspelt product shows as `TERM_NOT_FOUND`, not a silent zero.

    ## Who it's for

    - Drug safety teams, QPPV offices and PV vendors running the weekly literature review.

    ## Why orchestrate this with Kestra

    - Schedule, KV state and outputs live in one versioned flow; each run keeps its CSVs as an inspection record.
    - Retries and a Slack step with `allowFailure` keep the screen running without a webhook.

    ## Prerequisites

    - Kestra 2.0 with the Python and Slack plugins and a Docker runner (`python:3.13-slim`, no packages).
    - HTTPS to `eutils.ncbi.nlm.nih.gov`; no API key is needed at 3 requests per second. Set `contact_email` as NCBI asks.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack incoming webhook for the reviewer digest (optional; without it the run ends in WARNING and the CSVs are still produced).

    ## Quick start

    1. Set `contact_email` and **Execute** with the defaults (semaglutide, clopidogrel, inclisiran, valproate); the BASELINE lists every match in the window.
    2. Execute again: everything is already screened and `nothing_new` runs.
    3. Add `clopidogrl OR Plavx`: it shows as `TERM_NOT_FOUND` in the search log and a WARN line.
    4. Use your own portfolio, add the Slack secret and keep the schedule on.

    ## How to extend

    - Pass an NCBI API key secret (`api_key`) for 10 requests per second.
    - Open a case-intake ticket per `ICSR_CANDIDATE`, or load the CSV into your safety database.

    ## Links

    - [Python Script task](https://kestra.io/plugins/plugin-script-python/io.kestra.plugin.scripts.python.script)
    - [KV Store](https://kestra.io/docs/concepts/kv-store) and [If](https://kestra.io/plugins/core/flow/io.kestra.plugin.core.flow.if)
    - [Slack Incoming Webhook](https://kestra.io/plugins/plugin-notifications/slack/io.kestra.plugin.slack.notifications.slackincomingwebhook)
    - [NCBI E-utilities: ESearch and EFetch](https://www.ncbi.nlm.nih.gov/books/NBK25499/)
    - [EMA GVP Module VI (management and reporting of adverse reactions)](https://www.ema.europa.eu/en/human-regulatory-overview/post-authorisation/pharmacovigilance-post-authorisation/good-pharmacovigilance-practices-gvp)
  tags:
    - Data
  subTags:
    - Monitoring & Alerting
    - Testing & Quality
  ee: false
  demo: false
