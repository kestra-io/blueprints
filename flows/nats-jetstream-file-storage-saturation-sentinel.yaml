id: nats-jetstream-file-storage-saturation-sentinel
namespace: company.sre

description: |
  Audits NATS JetStream account and stream storage quotas to detect disk saturation, file storage limits, and unconsumed message accumulations.

concurrency:
  limit: 1

inputs:
  - id: nats_server_url
    type: STRING
    displayName: "NATS Server URL"
    defaults: "nats://nats.internal:4222"
    description: "Connection URL for the NATS messaging cluster."

  - id: target_stream
    type: STRING
    displayName: "JetStream Stream Name"
    defaults: "ORDERS_STREAM"
    description: "JetStream stream under active storage monitoring."

  - id: storage_usage_threshold_pct
    type: INT
    displayName: "Storage Saturation Threshold (%)"
    defaults: 85
    description: "Maximum allowable disk storage utilization percentage before triggering critical alerts."

triggers:
  - id: scheduled_check
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

tasks:
  - id: probe_jetstream_storage
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install nats-py kestra asyncio
    env:
      NATS_URL: "{{ inputs.nats_server_url }}"
      STREAM_NAME: "{{ inputs.target_stream }}"
      MAX_USAGE_PCT: "{{ inputs.storage_usage_threshold_pct }}"
    script: |
      import os
      import sys
      import asyncio
      import nats
      from kestra import Kestra

      async def main():
          nats_url = os.environ.get("NATS_URL")
          stream_name = os.environ.get("STREAM_NAME")
          threshold_pct = int(os.environ.get("MAX_USAGE_PCT", 85))

          try:
              nc = await nats.connect(nats_url)
              js = nc.jetstream()

              account_info = await js.account_info()
              stream_info = await js.stream_info(stream_name)

              # Evaluate account storage bytes and limits
              total_storage = account_info.storage
              memory_storage = account_info.memory
              stream_bytes = stream_info.state.bytes
              stream_messages = stream_info.state.messages

              # If max_bytes is defined on stream, calculate percentage
              max_bytes = stream_info.config.max_bytes
              storage_pct = 0.0
              if max_bytes > 0:
                  storage_pct = (stream_bytes / max_bytes) * 100.0

              is_alert = storage_pct >= threshold_pct if max_bytes > 0 else False

              await nc.close()

              Kestra.outputs({
                  "stream": stream_name,
                  "stream_bytes": stream_bytes,
                  "stream_messages": stream_messages,
                  "storage_used_pct": round(storage_pct, 2),
                  "is_alert": is_alert
              })
          except Exception as e:
              print(f"Error inspecting NATS JetStream storage: {e}", file=sys.stderr)
              sys.exit(1)

      asyncio.run(main())

  - id: evaluate_storage_threshold
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.probe_jetstream_storage.vars.is_alert }}"
    then:
      - id: notify_slack_storage_saturated
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#infrastructure-alerts",
            "text": "🚨 *NATS JetStream Storage Saturation Alert: Stream `{{ inputs.target_stream }}`*\n- *Storage Used*: `{{ outputs.probe_jetstream_storage.vars.storage_used_pct }}%` (Threshold: {{ inputs.storage_usage_threshold_pct }}%)\n- *Stream Bytes*: `{{ outputs.probe_jetstream_storage.vars.stream_bytes }} bytes`\n- *Message Count*: `{{ outputs.probe_jetstream_storage.vars.stream_messages }}`\n- *Action*: Scale JetStream file store volume or adjust stream retention policy."
          }

errors:
  - id: notify_nats_probe_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#infrastructure-alerts",
        "text": "❌ *NATS JetStream Storage Probe Failed on stream `{{ inputs.target_stream }}`*"
      }

extend:
  title: NATS JetStream Storage Saturation and Message Sprawl Sentinel
  shortDescription: Audits NATS JetStream stream byte consumption and account storage quotas to prevent disk fill-ups and publisher rejection.
  description: |
    Audits NATS JetStream account and stream storage quotas to detect disk saturation, file storage limits, and unconsumed message accumulations.

    ## How it works
    1. A schedule trigger or manual execution connects to the designated NATS messaging cluster over the native NATS protocol.
    2. Queries JetStream account and stream metadata through an isolated Python container runner.
    3. Analyzes stream message volume, byte size, and configured `max_bytes` capacity ceilings.
    4. Evaluates whether the stream storage utilization breaches defined saturation thresholds (default: 85%).
    5. Dispatches immediate notifications to Slack with stream metrics and actionable scaling guidance upon detection.

    ## What you get
    - Real-time protection against NATS JetStream publisher rejections (`ErrStorageFull`).
    - Granular message count and byte volume tracking for business-critical event streams.
    - Automated, noise-free alerts targeted at infrastructure SRE teams.

    ## Who it's for
    - Site Reliability Engineers maintaining event-driven messaging infrastructures.
    - Cloud Architects designing resilient distributed asynchronous message queues.
    - Backend Developers utilizing NATS JetStream for persistent pub/sub and stateful workers.

    ## Why orchestrate this with Kestra
    - Eliminates fragile standalone cron jobs and unmonitored scripts.
    - Stores cluster credentials and Slack webhooks safely inside encrypted Kestra namespace secrets.
    - Easily extendable to trigger automated message purging or retention policy reconfiguration.

    ## Prerequisites
    - NATS Server with JetStream enabled (`jetstream: enabled`).
    - Target stream created with persistent file or memory storage.
    - `SLACK_WEBHOOK` secret configured in the Kestra namespace.

    ## Quick start
    1. Import this blueprint into your Kestra instance.
    2. Set `nats_server_url` to your internal NATS cluster DNS or IP.
    3. Specify the `target_stream` name you wish to monitor.
    4. Run a manual test execution to confirm metrics capture.
    5. Enable the schedule trigger for continuous background monitoring.

    ## How to extend
    - Add an automated subflow to purge expired message batches or increase stream `max_bytes` dynamically.
    - Forward stream storage metrics to Prometheus or Grafana.
    - Monitor multiple streams simultaneously using Kestra `ForEach` tasks.

    ## Links
    - [NATS JetStream Documentation](https://docs.nats.io/nats-concepts/jetstream)
    - [NATS Python Client (nats-py)](https://github.com/nats-io/nats.py)
    - [Kestra Slack Notification Plugin](https://kestra.io/plugins/plugin-slack)
  tags:
    - Infrastructure
    - Data
  subTags:
    - Monitoring & Alerting
    - Message Queues
  ee: false
  demo: false
