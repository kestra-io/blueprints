id: vault-transit-key-rotation-age-sentinel
namespace: company.sentinel
description: Audits HashiCorp Vault Transit cryptographic engine encryption keys to
  verify compliance with mandatory 90-day key rotation governance.
inputs:
- id: vault_addr
  type: STRING
  defaults: http://vault.internal:8200
- id: transit_key_name
  type: STRING
  defaults: payment-cipher
- id: max_key_age_days_threshold
  type: INT
  defaults: 90
outputs:
  - id: key_name
    type: STRING
    value: "{{ outputs.audit_vault.vars.key_name }}"
  - id: version
    type: INT
    value: "{{ outputs.audit_vault.vars.version }}"
  - id: age_days
    type: INT
    value: "{{ outputs.audit_vault.vars.age_days }}"
  - id: creation_time
    type: STRING
    value: "{{ outputs.audit_vault.vars.creation_time }}"


tasks:
- id: audit_vault
  type: io.kestra.plugin.scripts.python.Script
  description: Audits HashiCorp Vault transit key creation time and computes rotation age.
  containerImage: python:3.11-slim
  taskRunner:
    type: io.kestra.plugin.scripts.runner.docker.Docker
  beforeCommands:
    - pip install requests kestra python-dateutil
  env:
    VAULT_ADDR: "{{ inputs.vault_addr }}"
    VAULT_TOKEN: "{{ secret('VAULT_TOKEN') }}"
    KEY_NAME: "{{ inputs.transit_key_name }}"
  script: |
    import os
    import sys
    import json
    from datetime import datetime, timezone
    from dateutil import parser
    import requests
    from kestra import Kestra

    vault_addr = os.environ.get("VAULT_ADDR", "").rstrip("/")
    vault_token = os.environ.get("VAULT_TOKEN", "")
    key_name = os.environ.get("KEY_NAME", "")

    url = f"{vault_addr}/v1/transit/keys/{key_name}"
    headers = {"X-Vault-Token": vault_token}

    try:
        resp = requests.get(url, headers=headers, timeout=15)
        resp.raise_for_status()
        data = resp.json().get("data", {})
    except Exception as e:
        print(f"Error inspecting Vault transit key: {e}", file=sys.stderr)
        sys.exit(1)

    latest_ver = str(data.get("latest_version", 1))
    keys_map = data.get("keys", {})
    key_info = keys_map.get(latest_ver, {})
    creation_time_str = key_info.get("creation_time")

    if not creation_time_str:
        print(f"Error: Missing creation_time for transit key {key_name} version {latest_ver}", file=sys.stderr)
        sys.exit(1)

    creation_dt = parser.isoparse(creation_time_str)
    now = datetime.now(timezone.utc)
    age_days = (now - creation_dt).days

    audit_payload = {
        "key_name": key_name,
        "version": int(latest_ver),
        "age_days": age_days,
        "creation_time": creation_time_str
    }

    with open("transit_audit.json", "w") as f:
        json.dump(audit_payload, f)

    Kestra.outputs({
        "key_name": key_name,
        "version": int(latest_ver),
        "age_days": age_days,
        "creation_time": creation_time_str
    })
  outputFiles:
    - transit_audit.json
- id: evaluate_and_alert
  type: io.kestra.plugin.core.flow.If
  condition: '{{ fromJson(outputs.audit_vault.outputFiles[''transit_audit.json'']).age_days
    > inputs.max_key_age_days_threshold }}'
  then:
  - id: notify_slack
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: '{{ secret(''SLACK_WEBHOOK'') }}'
    payload: ':warning: *HashiCorp Vault Transit Key Rotation Overdue*\n*Vault Address:*
      {{ inputs.vault_addr }}\n*Key Name:* {{ inputs.transit_key_name }}\n*Latest
      Version:* {{ fromJson(outputs.audit_vault.outputFiles[''transit_audit.json'']).version
      }}\n*Key Age:* {{ fromJson(outputs.audit_vault.outputFiles[''transit_audit.json'']).age_days
      }} days\n*Max Rotation Age:* {{ inputs.max_key_age_days_threshold }} days\n*Requirement:*
      Rotate transit key to comply with data security standards.'
errors:
- id: handle_inspection_failure
  type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
  url: '{{ secret(''SLACK_WEBHOOK'') }}'
  payload: ':rotating_light: *Execution Failure: HashiCorp Vault Transit Engine Encryption
    Key Rotation Sentinel*\n*Execution ID:* `{ execution.id }`\n*State:* `{ execution.state.current
    }`\n*Error:* Sentinel inspection encountered an unhandled execution error.'
triggers:
- id: scheduled_monitor
  type: io.kestra.plugin.core.trigger.Schedule
  cron: 0 6 * * *
  disabled: true
extend:
  metaDescription: "Audits HashiCorp Vault Transit cryptographic engine encryption keys to verify compliance with mandatory 90-day key rotation governance."
  metaTitle: HashiCorp Vault Transit Engine Encryption Key Rotation Sentinel with Kestra
  title: HashiCorp Vault Transit Engine Encryption Key Rotation Sentinel
  shortDescription: Audits HashiCorp Vault Transit cryptographic engine encryption
    keys to verify compliance with mandatory 90-day key rotation governance.
  description: '## How it works

    This automated sentinel flow continuously assesses operational health, metrics,
    and capacity parameters for **HashiCorp Vault Transit Engine Encryption Key Rotation
    Sentinel**. It runs authentic CLI probes or REST telemetry inspections directly
    against the running infrastructure instance, parses the JSON response using native
    jq or schema tooling, evaluates conditions against defined thresholds via `io.kestra.plugin.core.flow.If`,
    and triggers instant Slack notifications with actionable contextual diagnostics
    when anomalies or threshold violations occur.


