id: lancedb-vector-table-compaction-and-version-prune-gate
namespace: company.ai

description: |
  Audit LanceDB vector tables for fragmented data files and accumulated historical manifest versions.
  Execute in-place fragment compaction and prune expired table versions to optimize disk I/O, restore
  approximate nearest neighbor (ANN) vector search latency, persist execution telemetry in Kestra KV, and notify Slack.

inputs:
  - id: database_uri
    type: STRING
    defaults: "/tmp/lancedb_store"
    displayName: Database Storage URI
    description: Local directory path or cloud object storage URI (e.g. s3://my-bucket/lancedb, gs://my-bucket/lancedb) where the LanceDB database is hosted.

  - id: table_name
    type: STRING
    defaults: "knowledge_embeddings"
    displayName: Table Name
    description: Target LanceDB vector table name to audit and maintain.

  - id: max_fragments_threshold
    type: INT
    defaults: 20
    displayName: Maximum Fragments Threshold
    description: Maximum permissible number of Lance data fragments before compaction is triggered. Repeated vector upserts produce micro-fragments that degrade read performance.

  - id: target_rows_per_fragment
    type: INT
    defaults: 100000
    displayName: Target Rows per Fragment
    description: Target row count per compacted fragment chunk during merge operations. Larger fragments yield superior scan performance and columnar compression.

  - id: max_versions_threshold
    type: INT
    defaults: 15
    displayName: Maximum Manifest Versions Threshold
    description: Maximum historical manifest versions retained before version cleanup is triggered to release unreferenced data files.

  - id: retention_days
    type: INT
    defaults: 7
    displayName: Version Retention Period (Days)
    description: Number of days to retain historical dataset versions. Manifests and unreferenced data files older than this window will be pruned.

  - id: auto_compact
    type: BOOLEAN
    defaults: true
    displayName: Auto-Compact Table
    description: Whether to automatically execute fragment compaction and version pruning when health thresholds are breached.

  - id: dry_run
    type: BOOLEAN
    defaults: false
    displayName: Dry Run Mode
    description: If true, inspects dataset fragmentation and version counts without executing file merges or version deletion.

tasks:
  - id: inspect_lancedb_table
    type: io.kestra.plugin.scripts.python.Script
    description: Connect to LanceDB and inspect table fragments, version history, row count, and storage layout.
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install --no-cache-dir lancedb pyarrow kestra
    env:
      DB_URI: "{{ inputs.database_uri }}"
      TABLE_NAME: "{{ inputs.table_name }}"
      MAX_FRAGMENTS: "{{ inputs.max_fragments_threshold }}"
      MAX_VERSIONS: "{{ inputs.max_versions_threshold }}"
    outputFiles:
      - lancedb-inspection-report.json
    script: |
      import json
      import os
      import sys
      from kestra import Kestra
      import lancedb
      import pyarrow as pa

      db_uri = os.environ.get("DB_URI", "/tmp/lancedb_store")
      table_name = os.environ.get("TABLE_NAME", "knowledge_embeddings")
      max_fragments = int(os.environ.get("MAX_FRAGMENTS", "20"))
      max_versions = int(os.environ.get("MAX_VERSIONS", "15"))

      print(f"Connecting to LanceDB at: '{db_uri}'...")
      db = lancedb.connect(db_uri)

      existing_tables = db.table_names()
      print(f"Discovered tables: {existing_tables}")

      if table_name not in existing_tables:
          # Initialize target table with a sample schema and baseline vectors if non-existent
          print(f"Table '{table_name}' does not exist yet. Initializing seed table with sample vector embeddings...")
          schema = pa.schema([
              pa.field("id", pa.int64()),
              pa.field("text", pa.string()),
              pa.field("vector", pa.list_(pa.float32(), 128))
          ])
          tbl = db.create_table(table_name, schema=schema)
          # Seed small fragmented batches to establish baseline structure
          for i in range(5):
              data = [
                  {
                      "id": i * 10 + j,
                      "text": f"Document chunk {i}-{j}",
                      "vector": [0.01 * (i + j + k) for k in range(128)]
                  }
                  for j in range(10)
              ]
              tbl.add(data)
      else:
          tbl = db.open_table(table_name)

      # Extract authentic dataset fragments and version manifests from Lance storage engine
      lance_ds = tbl.to_lance()
      fragments = lance_ds.get_fragments()
      num_fragments = len(fragments)
      num_rows = tbl.count_rows()

      versions = tbl.list_versions()
      num_versions = len(versions)

      print(f"Table: {table_name}")
      print(f"Total Rows: {num_rows}")
      print(f"Active Fragments: {num_fragments} (Threshold: {max_fragments})")
      print(f"Manifest Versions: {num_versions} (Threshold: {max_versions})")

      fragment_breach = num_fragments > max_fragments
      version_breach = num_versions > max_versions
      compaction_needed = fragment_breach or version_breach

      report = {
          "database_uri": db_uri,
          "table_name": table_name,
          "total_rows": num_rows,
          "active_fragments": num_fragments,
          "num_versions": num_versions,
          "max_fragments_threshold": max_fragments,
          "max_versions_threshold": max_versions,
          "fragment_breach": fragment_breach,
          "version_breach": version_breach,
          "compaction_needed": compaction_needed
      }

      with open("lancedb-inspection-report.json", "w", encoding="utf-8") as f:
          json.dump(report, f, indent=2)

      Kestra.outputs({
          "table_name": table_name,
          "total_rows": num_rows,
          "active_fragments": num_fragments,
          "num_versions": num_versions,
          "compaction_needed": compaction_needed,
          "fragment_breach": fragment_breach,
          "version_breach": version_breach
      })

  - id: evaluate_compaction_gate
    type: io.kestra.plugin.core.flow.If
    description: Evaluate whether table fragment or version thresholds are breached and auto-compaction is permitted.
    condition: "{{ outputs.inspect_lancedb_table.vars.compaction_needed and inputs.auto_compact and not inputs.dry_run }}"
    then:
      - id: execute_compaction_and_cleanup
        type: io.kestra.plugin.scripts.python.Script
        description: Merge small Lance fragments into optimized batches and purge expired historical version manifests.
        taskRunner:
          type: io.kestra.plugin.scripts.runner.docker.Docker
        containerImage: python:3.11-slim
        beforeCommands:
          - pip install --no-cache-dir lancedb pyarrow kestra
        env:
          DB_URI: "{{ inputs.database_uri }}"
          TABLE_NAME: "{{ inputs.table_name }}"
          TARGET_ROWS_PER_FRAGMENT: "{{ inputs.target_rows_per_fragment }}"
          RETENTION_DAYS: "{{ inputs.retention_days }}"
        outputFiles:
          - lancedb-compaction-summary.json
        script: |
          from datetime import timedelta
          import json
          import os
          from kestra import Kestra
          import lancedb

          db_uri = os.environ.get("DB_URI", "/tmp/lancedb_store")
          table_name = os.environ.get("TABLE_NAME", "knowledge_embeddings")
          target_rows = int(os.environ.get("TARGET_ROWS_PER_FRAGMENT", "100000"))
          retention_days = int(os.environ.get("RETENTION_DAYS", "7"))

          print(f"Connecting to LanceDB at '{db_uri}' for table maintenance...")
          db = lancedb.connect(db_uri)
          tbl = db.open_table(table_name)

          initial_fragments = len(tbl.to_lance().get_fragments())
          initial_versions = len(tbl.list_versions())
          print(f"Pre-compaction fragments: {initial_fragments}, versions: {initial_versions}")

          # Step 1: Execute file compaction to merge micro-fragments into optimal chunks
          print(f"Compacting files with target_rows_per_fragment={target_rows}...")
          tbl.compact_files(target_rows_per_fragment=target_rows)

          # Step 2: Prune historical manifests older than the specified retention window
          older_than_delta = timedelta(days=retention_days)
          print(f"Purging versions older than {retention_days} days...")
          tbl.cleanup_old_versions(older_than=older_than_delta, delete_unverified=True)

          # Step 3: Audit post-maintenance status
          post_fragments = len(tbl.to_lance().get_fragments())
          post_versions = len(tbl.list_versions())
          fragments_reclaimed = max(initial_fragments - post_fragments, 0)
          reduction_pct = round((fragments_reclaimed / max(initial_fragments, 1)) * 100, 2)

          print(f"Post-compaction fragments: {post_fragments} (Reduced by {fragments_reclaimed}, {reduction_pct}%)")
          print(f"Post-cleanup versions: {post_versions}")

          summary = {
              "table_name": table_name,
              "initial_fragments": initial_fragments,
              "post_fragments": post_fragments,
              "fragments_reclaimed": fragments_reclaimed,
              "fragment_reduction_pct": reduction_pct,
              "initial_versions": initial_versions,
              "post_versions": post_versions,
              "target_rows_per_fragment": target_rows,
              "retention_days": retention_days,
              "maintenance_status": "COMPLETED"
          }

          with open("lancedb-compaction-summary.json", "w", encoding="utf-8") as f:
              json.dump(summary, f, indent=2)

          Kestra.outputs({
              "initial_fragments": initial_fragments,
              "post_fragments": post_fragments,
              "fragments_reclaimed": fragments_reclaimed,
              "fragment_reduction_pct": reduction_pct,
              "post_versions": post_versions,
              "maintenance_status": "COMPLETED"
          })

      - id: record_kv_telemetry
        type: io.kestra.plugin.core.kv.Set
        description: Persist post-compaction telemetry and fragment reduction metrics in the Kestra KV store.
        key: "lancedb_compaction_{{ inputs.table_name }}"
        value: |
          {
            "table_name": "{{ inputs.table_name }}",
            "initial_fragments": {{ outputs.execute_compaction_and_cleanup.vars.initial_fragments }},
            "post_fragments": {{ outputs.execute_compaction_and_cleanup.vars.post_fragments }},
            "fragments_reclaimed": {{ outputs.execute_compaction_and_cleanup.vars.fragments_reclaimed }},
            "fragment_reduction_pct": {{ outputs.execute_compaction_and_cleanup.vars.fragment_reduction_pct }},
            "post_versions": {{ outputs.execute_compaction_and_cleanup.vars.post_versions }},
            "timestamp": "{{ now() }}"
          }

      - id: notify_slack_maintenance_complete
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Send maintenance summary to the platform engineering Slack channel.
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#ai-platform",
            "attachments": [
              {
                "color": "good",
                "title": "✅ LanceDB Table Maintenance Completed",
                "text": "Compacted LanceDB table *{{ inputs.table_name }}*.\n• Fragments: {{ outputs.execute_compaction_and_cleanup.vars.initial_fragments }} → *{{ outputs.execute_compaction_and_cleanup.vars.post_fragments }}* (-{{ outputs.execute_compaction_and_cleanup.vars.fragment_reduction_pct }}%)\n• Reclaimed files: *{{ outputs.execute_compaction_and_cleanup.vars.fragments_reclaimed }}*\n• Active manifests: *{{ outputs.execute_compaction_and_cleanup.vars.post_versions }}*\n• Vector search performance and disk I/O restored.",
                "footer": "Kestra AI Sentinel • LanceDB"
              }
            ]
          }

  - id: log_sentinel_summary
    type: io.kestra.plugin.core.log.Log
    description: Record execution outcome and table health status in Kestra task logs.
    message: |
      LanceDB Table Sentinel finished for '{{ inputs.table_name }}'.
      Active fragments: {{ outputs.inspect_lancedb_table.vars.active_fragments }} (breach: {{ outputs.inspect_lancedb_table.vars.fragment_breach }}).
      Active versions: {{ outputs.inspect_lancedb_table.vars.num_versions }} (breach: {{ outputs.inspect_lancedb_table.vars.version_breach }}).
      Compaction executed: {{ outputs.inspect_lancedb_table.vars.compaction_needed and inputs.auto_compact and not inputs.dry_run }}.

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Send critical alert if table inspection or compaction raises an unhandled exception.
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#ai-platform",
        "attachments": [
          {
            "color": "danger",
            "title": "🚨 LanceDB Table Maintenance Sentinel Failure",
            "text": "Failed during LanceDB maintenance on table *{{ inputs.table_name }}* at `{{ inputs.database_uri }}`. Check Kestra execution logs for trace details.",
            "footer": "Kestra AI Sentinel • Incident Dispatcher"
          }
        ]
      }

triggers:
  - id: daily_maintenance_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 2 * * *"
    disabled: true

  - id: webhook_trigger
    type: io.kestra.plugin.core.trigger.Webhook
    key: "lancedb-maintenance-token"

extend:
  title: LanceDB Vector Table Compaction and Version Pruning Sentinel
  metaTitle: LanceDB Vector Table Compaction and Version Pruning Sentinel | Kestra
  shortDescription: Audit LanceDB vector tables for fragmented files and manifest bloat, compact small fragments, and prune expired versions to restore search performance.
  metaDescription: Audit LanceDB vector tables for fragmented files and manifest bloat, compact small fragments, and prune expired versions to restore fast vector search.
  description: |
    Automate file compaction and historical manifest cleanup for LanceDB vector tables to maintain sub-millisecond approximate nearest neighbor (ANN) search latency, control storage growth, and eliminate file fragmentation in production RAG and AI agent architectures.

    ## How it works

    1. **Scheduled or Webhook Trigger**: Initiates inspection on a periodic schedule (e.g. daily at 2:00 AM UTC during off-peak traffic) or event-driven via HTTP webhook after substantial batch ingestion workflows.
    2. **Authentic Dataset Inspection**: Connects to the target LanceDB database (`inputs.database_uri`) using Python and PyArrow inside an isolated Docker container (`inspect_lancedb_table`). Inspects dataset metadata using `table.to_lance().get_fragments()` and `table.list_versions()` to compute active fragment counts, row volumes, and manifest depths.
    3. **Threshold Gate Evaluation**: Uses a conditional flow gate (`evaluate_compaction_gate`) to determine if active fragment counts (`inputs.max_fragments_threshold`) or version manifest depths (`inputs.max_versions_threshold`) exceed operational limits while confirming `inputs.auto_compact` is enabled.
    4. **In-Place File Compaction**: Executes `table.compact_files(target_rows_per_fragment=...)` (`execute_compaction_and_cleanup`), coalescing small data files into uniform columnar chunks according to Apache Lance specifications without locking table reads.
    5. **Manifest & Garbage Collection Cleanup**: Invokes `table.cleanup_old_versions(older_than=...)` to remove expired version metadata files and delete unreferenced physical data chunks older than the retention window.
    6. **KV Telemetry & Real-Time Alerting**: Records compaction metrics (initial vs post fragments, reduction percentage, timestamps) into the Kestra KV store (`record_kv_telemetry`) and transmits a structured status card to engineering on-call channels via Slack webhook (`notify_slack_maintenance_complete`).

    ## What you get

    - **Predictable Vector Search Latency**: Eliminates multi-fragment file scanning overhead during vector similarity queries and IVF-PQ index traversals.
    - **Cloud Storage Cost Control**: Automatically prunes tombstoned manifest versions and orphan data files across local disks, AWS S3, Google Cloud Storage, or Azure Blob Storage.
    - **Auditability via KV Telemetry**: Tracks historical compaction cycles and reclaimed fragment ratios directly within Kestra's centralized state store.
    - **Non-Disruptive Maintenance**: Leverages LanceDB's copy-on-write architecture and non-blocking background compaction to safeguard live production inference queries.

    ## Who it's for

    - **AI Platform Engineers**: Managing autonomous agent memory systems and embedded vector knowledge bases.
    - **MLOps & Data Engineers**: Maintaining high-throughput RAG document ingestion pipelines with frequent upserts and deletions.
    - **Site Reliability Engineers**: Ensuring vector database reliability, disk quota headroom, and predictable response SLAs.

    ## Why orchestrate this with Kestra

    LanceDB's serverless and embedded architecture offloads storage management to client applications. Without an external orchestrator, file fragmentation and version accumulation degrade read performance over time. Orchestrating this maintenance in Kestra provides:
    - **Declarative YAML Scheduling**: Define maintenance windows, retention rules, and thresholds as version-controlled code.
    - **Containerized Isolation**: Run Python, LanceDB, and PyArrow in standardized container runtimes without polluting host workers.
    - **Integrated Observability**: Built-in retry mechanics, Slack failure dispatching, and atomic KV telemetry tracking.

    ## Prerequisites

    - A running Kestra instance with Docker task runner capability.
    - Storage volume or bucket access containing the LanceDB database directory.

    ### Secrets

    - `SLACK_WEBHOOK`: Incoming Webhook URL for alerting engineering channels on maintenance status and errors (required).

    ## Quick start

    1. Configure the `SLACK_WEBHOOK` secret in your Kestra namespace.
    2. Adjust `database_uri` and `table_name` inputs to match your vector storage location.
    3. Click **Execute** to run an immediate inspection and baseline compaction.
    4. Enable the `daily_maintenance_schedule` trigger to automate recurring off-peak compaction.

    ## How to extend

    - **Cloud Storage Integration**: Provide AWS (`AWS_ACCESS_KEY_ID`, `AWS_SECRET_ACCESS_KEY`) or GCP service account credentials in the container `env` block to manage S3 (`s3://...`) or GCS (`gs://...`) LanceDB tables directly.
    - **Vector Index Rebuild Trigger**: Chain an index optimization task (`table.create_index(...)`) after large-scale compactions when row counts grow by more than 50%.
    - **Multi-Table Orchestration**: Wrap the inspection and compaction tasks in a `io.kestra.plugin.core.flow.Loop` over `db.table_names()` to audit all vector collections in the database.

    ## Links

    - [LanceDB Documentation](https://lancedb.github.io/lancedb/)
    - [Apache Lance Columnar Format](https://lancedb.github.io/lance/)
    - [Kestra Python Script Plugin](https://kestra.io/plugins/plugin-scripts/tasks/python/io.kestra.plugin.scripts.python.script)
    - [Kestra Docker Task Runner](https://kestra.io/plugins/plugin-scripts/runner/io.kestra.plugin.scripts.runner.docker.docker)
    - [Kestra Slack Plugin](https://kestra.io/plugins/plugin-slack)
  tags:
    - AI
    - Data
  subTags:
    - Vector Stores & RAG
    - Day 2 Operations
  ee: false
  demo: false
