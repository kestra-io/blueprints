id: gtfs-realtime-feed-health-check
namespace: company.team

inputs:
  - id: feed_url
    type: STRING
    displayName: GTFS-Realtime vehicle positions URL
    description: Public URL of a GTFS-Realtime VehiclePositions feed. The default is the MBTA feed, which needs no API key.
    defaults: https://cdn.mbta.com/realtime/VehiclePositions.pb

  - id: max_age_seconds
    type: INT
    displayName: Maximum feed age in seconds
    description: The feed counts as stale when its header timestamp is older than this.
    defaults: 120

  - id: min_vehicles
    type: INT
    displayName: Minimum vehicles with a position
    description: The feed counts as unhealthy when fewer vehicles than this report a position.
    defaults: 1

  - id: alert_after
    type: INT
    displayName: Unhealthy checks before alerting
    description: Alert only after this many unhealthy checks in a row, so one slow fetch does not page anyone.
    defaults: 2

  - id: notify_slack
    type: BOOL
    displayName: Notify Slack
    description: Post to Slack when the alert threshold is reached. Needs the SLACK_WEBHOOK_URL secret.
    defaults: false

  - id: fail_on_alert
    type: BOOL
    displayName: Fail on alert
    description: End the run as FAILED when the alert threshold is reached.
    defaults: false

triggers:
  - id: every_five_minutes
    type: io.kestra.plugin.core.trigger.Schedule
    description: Check the feed every five minutes. Riders notice a frozen feed within minutes, so check often.
    cron: "*/5 * * * *"

tasks:
  - id: download
    type: io.kestra.plugin.core.http.Download
    description: Fetch the current feed snapshot.
    uri: "{{ inputs.feed_url }}"

  - id: inspect
    type: io.kestra.plugin.scripts.python.Script
    description: Decode the protobuf and check how old the feed is and how many vehicles report a position.
    dependencies:
      - kestra
      - gtfs-realtime-bindings
    inputFiles:
      feed.pb: "{{ outputs.download.uri }}"
    script: |
      import time
      from google.transit import gtfs_realtime_pb2
      from kestra import Kestra

      max_age = {{ inputs.max_age_seconds }}
      min_vehicles = {{ inputs.min_vehicles }}

      feed = gtfs_realtime_pb2.FeedMessage()
      with open("feed.pb", "rb") as f:
          feed.ParseFromString(f.read())

      now = int(time.time())
      age = now - feed.header.timestamp if feed.header.timestamp else -1
      vehicles = [e.vehicle for e in feed.entity if e.HasField("vehicle")]
      positioned = sum(1 for v in vehicles if v.HasField("position"))
      stale_vehicles = sum(1 for v in vehicles if v.timestamp and now - v.timestamp > max_age)

      problems = []
      if age < 0:
          problems.append("the feed header has no timestamp")
      elif age > max_age:
          problems.append(f"the feed is {age}s old")
      if positioned < min_vehicles:
          problems.append(f"only {positioned} vehicles report a position")

      Kestra.outputs({
          "healthy": not problems,
          "problems": "; ".join(problems) or "none",
          "feed_age_seconds": age,
          "vehicles": len(vehicles),
          "vehicles_with_position": positioned,
          "stale_vehicles": stale_vehicles,
      })

  - id: previous_streak
    type: io.kestra.plugin.core.kv.Get
    description: Read how many unhealthy checks happened in a row before this one.
    key: "{{ flow.id }}_unhealthy_streak"
    errorOnMissing: false

  - id: health_gate
    type: io.kestra.plugin.core.flow.If
    description: Count unhealthy checks in a row and alert once the streak reaches alert_after.
    condition: "{{ outputs.inspect.vars.healthy }}"
    then:
      - id: reset_streak
        type: io.kestra.plugin.core.kv.Set
        description: A healthy check resets the streak.
        key: "{{ flow.id }}_unhealthy_streak"
        kvType: NUMBER
        value: 0

      - id: log_healthy
        type: io.kestra.plugin.core.log.Log
        message: "Feed healthy: {{ outputs.inspect.vars.feed_age_seconds }}s old, {{ outputs.inspect.vars.vehicles_with_position }} vehicles with a position, {{ outputs.inspect.vars.stale_vehicles }} stale vehicle reports."
    else:
      - id: bump_streak
        type: io.kestra.plugin.core.kv.Set
        description: Add this check to the unhealthy streak.
        key: "{{ flow.id }}_unhealthy_streak"
        kvType: NUMBER
        value: "{{ (outputs.previous_streak.value ?? 0) + 1 }}"

      - id: alert_gate
        type: io.kestra.plugin.core.flow.If
        description: Alert only when the streak reaches alert_after.
        condition: "{{ (outputs.previous_streak.value ?? 0) + 1 >= inputs.alert_after }}"
        then:
          - id: notify_alert
            type: io.kestra.plugin.core.flow.If
            condition: "{{ inputs.notify_slack }}"
            then:
              - id: slack_alert
                type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
                url: "{{ secret('SLACK_WEBHOOK_URL') }}"
                payload: |
                  {
                    "text": "GTFS-Realtime feed {{ inputs.feed_url }} has been unhealthy for {{ (outputs.previous_streak.value ?? 0) + 1 }} checks in a row: {{ outputs.inspect.vars.problems }}. Execution {{ execution.id }}."
                  }

          - id: fail_gate
            type: io.kestra.plugin.core.flow.If
            condition: "{{ inputs.fail_on_alert }}"
            then:
              - id: fail_run
                type: io.kestra.plugin.core.execution.Fail
                errorMessage: "GTFS-Realtime feed unhealthy for {{ (outputs.previous_streak.value ?? 0) + 1 }} checks in a row: {{ outputs.inspect.vars.problems }}"
        else:
          - id: log_unhealthy
            type: io.kestra.plugin.core.log.Log
            level: WARN
            message: "Feed unhealthy ({{ outputs.inspect.vars.problems }}), check {{ (outputs.previous_streak.value ?? 0) + 1 }} of {{ inputs.alert_after }} before alerting."

extend:
  title: Check that a GTFS-Realtime vehicle feed is fresh and alert when it goes stale
  metaTitle: GTFS-Realtime feed health check with Kestra
  shortDescription: Fetch a GTFS-Realtime vehicle positions feed every five minutes, check its age and vehicle count, and alert after repeated failures.
  metaDescription: Check a GTFS-Realtime vehicle positions feed every five minutes for staleness and missing vehicles, and alert after repeated failures. Runs with no setup.
  description: |
    Transit apps show live arrival times from GTFS-Realtime feeds. When an agency's feed freezes or stops reporting vehicles, apps quietly fall back to the timetable and riders get times that look live but are not. This flow fetches a VehiclePositions feed every five minutes, checks how old it is and how many vehicles report a position, and alerts only after several unhealthy checks in a row, so one slow fetch does not page anyone.

    It runs with no setup. The default feed is the MBTA's public vehicle positions feed, Slack is off and alerts do not fail the run.

    ## How it works

    1. `download` (`io.kestra.plugin.core.http.Download`) fetches the protobuf snapshot from `feed_url`.
    2. `inspect` (`io.kestra.plugin.scripts.python.Script`) decodes it with `gtfs-realtime-bindings` and outputs `healthy`, `problems`, `feed_age_seconds`, `vehicles`, `vehicles_with_position` and `stale_vehicles`. A feed is unhealthy when its header timestamp is older than `max_age_seconds`, has no timestamp, or fewer than `min_vehicles` vehicles report a position.
    3. `previous_streak` (`io.kestra.plugin.core.kv.Get`) reads the number of unhealthy checks in a row from the KV store.
    4. `health_gate` (`io.kestra.plugin.core.flow.If`) resets the streak to 0 on a healthy check and logs the numbers. On an unhealthy check it adds one to the streak.
    5. `alert_gate` alerts once the streak reaches `alert_after`: it posts to Slack when `notify_slack` is `true` and ends the run as `FAILED` when `fail_on_alert` is `true`. Below the threshold it logs a warning with the count so far.

    ## Inputs

    - `feed_url` (STRING, default the MBTA vehicle positions feed): the GTFS-Realtime VehiclePositions URL.
    - `max_age_seconds` (INT, default `120`): the oldest acceptable feed header timestamp.
    - `min_vehicles` (INT, default `1`): the fewest vehicles that must report a position.
    - `alert_after` (INT, default `2`): unhealthy checks in a row before alerting.
    - `notify_slack` (BOOL, default `false`): post alerts to Slack.
    - `fail_on_alert` (BOOL, default `false`): end the run as `FAILED` on an alert.

    ## Prerequisites

    - A Kestra worker that can run Docker containers, for the Python script.
    - Network access to the feed URL. Some agencies require an API key in the URL or a header; add it to `feed_url` or the `download` task.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack incoming webhook. Only needed when `notify_slack` is `true`.

    ## Quick start

    1. Save the flow and run it with the defaults. The log shows the feed age and the number of vehicles with a position.
    2. Run it with `max_age_seconds` set to `1` to see an unhealthy check. The first run logs a warning with the streak count, and a second run within the threshold reaches `alert_after` and alerts.
    3. Point `feed_url` at your agency's feed and adjust `max_age_seconds` to how often it publishes.
    4. Leave the `every_five_minutes` schedule on to keep checking.

    ## Expected outputs

    - `outputs.inspect.vars.healthy`: `true` or `false`.
    - `outputs.inspect.vars.problems`: what made the check unhealthy, or `none`.
    - `outputs.inspect.vars.feed_age_seconds`, `vehicles`, `vehicles_with_position`, `stale_vehicles`: the numbers behind the check.

    ## Links

    - [GTFS Realtime reference](https://gtfs.org/documentation/realtime/reference/)
    - [gtfs-realtime-bindings for Python](https://pypi.org/project/gtfs-realtime-bindings/)
    - [Kestra Python Script task](https://kestra.io/plugins/plugin-script-python)
    - [Kestra Slack incoming webhook task](https://kestra.io/plugins/plugin-slack)
    - This blueprint has been created by [omlahore](https://github.com/omlahore)
  tags:
    - Data
  subTags:
    - Monitoring & Alerting
    - Realtime Events
  ee: false
  demo: true
