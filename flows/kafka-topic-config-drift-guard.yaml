id: kafka-topic-config-drift-guard
namespace: company.team

description: |
  Compare the live configuration of Kafka topics with the policy you declare for them
  (retention, cleanup policy, min.insync.replicas, max message size...), report every
  drifted key and every topic missing from the cluster, alert Slack, and optionally put the
  drifted keys back with TopicUpdate, then describe the topics again to prove the fix landed.
  Remediation is off by default and runs only when auto_remediate is true and dry_run is false.

inputs:
  - id: bootstrap_servers
    type: STRING
    displayName: Kafka bootstrap servers
    defaults: "localhost:9092"

  - id: policy
    type: JSON
    displayName: Topic policy
    description: >-
      Desired configs per topic, as Kafka config keys and string values. Only the keys listed
      are checked, every other config is left alone.
    defaults: >-
      {"orders": {"retention.ms": "604800000", "cleanup.policy": "delete", "min.insync.replicas": "1"},
       "payments": {"retention.ms": "2592000000", "cleanup.policy": "delete"},
       "audit-log": {"retention.ms": "31536000000"},
       "customers-compacted": {"cleanup.policy": "compact"},
       "invoices": {"retention.ms": "2592000000"}}

  - id: auto_remediate
    type: BOOL
    displayName: Auto remediate
    description: Set the drifted keys back to the policy value with TopicUpdate. Missing topics are never created.
    defaults: false

  - id: dry_run
    type: BOOL
    displayName: Dry run
    description: When true, the changes are only logged. Must be false, together with auto_remediate, for TopicUpdate to run.
    defaults: true

tasks:
  - id: list_topics
    type: io.kestra.plugin.kafka.TopicList
    description: Read-only AdminClient call listing the topics on the cluster, so topics in the policy that do not exist are reported instead of failing the describe.
    properties:
      bootstrap.servers: "{{ inputs.bootstrap_servers }}"

  - id: present
    type: io.kestra.plugin.core.output.OutputValues
    values:
      topics: "{{ inputs.policy | keys | jq('[.[] | select(. as $t | ' ~ (outputs.list_topics.topics | toJson) ~ ' | index($t))]') | first | toJson }}"
      missing: "{{ inputs.policy | keys | jq('[.[] | select(. as $t | ' ~ (outputs.list_topics.topics | toJson) ~ ' | index($t) | not)]') | first | toJson }}"

  - id: describe_topics
    type: io.kestra.plugin.core.flow.Loop
    description: Describe every policy topic present on the cluster, read-only.
    values: "{{ outputs.present.values.topics }}"
    concurrencyLimit: 4
    outputs:
      - id: live
        type: STRING
        value: "{{ {'topic': item.value, 'configs': outputs.describe.configs} | toJson }}"
    tasks:
      - id: describe
        type: io.kestra.plugin.kafka.TopicDescribe
        topic: "{{ item.value }}"
        properties:
          bootstrap.servers: "{{ inputs.bootstrap_servers }}"

  - id: drift
    type: io.kestra.plugin.core.output.OutputValues
    description: One entry per drifted key, with the live and the desired value.
    values:
      items: >-
        {{ {'policy': inputs.policy, 'actual': ((outputs.describe_topics.outputs ?? []) | jq('map(.outputs.live | fromjson | {(.topic): .configs}) | add // {}') | first)} | jq('. as $r | [$r.policy | to_entries[] as $p | ($p.value | to_entries[]) as $k
           | select($r.actual[$p.key] != null) | {topic: $p.key, key: $k.key, desired: $k.value, actual: ($r.actual[$p.key][$k.key] // "unset")}
           | select(.desired != .actual)]') | first | toJson }}

  - id: summary
    type: io.kestra.plugin.core.log.Log
    message: >-
      Kafka topic policy on {{ inputs.bootstrap_servers }}: {{ inputs.policy | keys | length }} topics in the policy,
      {{ fromJson(outputs.drift.values.items) | length }} drifted keys{{ fromJson(outputs.drift.values.items) | jq('if length == 0 then "" else ": " + (map("\(.topic) \(.key)=\(.actual) (want \(.desired))") | join(", ")) end') | first }}.
      Missing from the cluster: {{ fromJson(outputs.present.values.missing) | length == 0 ? 'none' : fromJson(outputs.present.values.missing) | join(', ') }}.

  - id: route
    type: io.kestra.plugin.core.flow.If
    condition: "{{ fromJson(outputs.drift.values.items) | length > 0 or fromJson(outputs.present.values.missing) | length > 0 }}"
    then:
      - id: alert
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {{ {'text': 'Kafka topic config drift on ' ~ inputs.bootstrap_servers ~ ': ' ~ (fromJson(outputs.drift.values.items) | length) ~ ' drifted keys, ' ~ (fromJson(outputs.present.values.missing) | length) ~ ' missing topics. ' ~ (fromJson(outputs.drift.values.items) | jq('map("\(.topic) \(.key)=\(.actual), policy \(.desired)") | join("; ")') | first) ~ '.' ~ (inputs.auto_remediate and not inputs.dry_run ? ' Remediating now.' : ' No change applied (auto_remediate=' ~ inputs.auto_remediate ~ ', dry_run=' ~ inputs.dry_run ~ ').')} | toJson }}

      - id: remediate_gate
        type: io.kestra.plugin.core.flow.If
        condition: "{{ inputs.auto_remediate and not inputs.dry_run and fromJson(outputs.drift.values.items) | length > 0 }}"
        then:
          - id: remediate
            type: io.kestra.plugin.core.flow.Loop
            description: One TopicUpdate per drifted topic, with only its drifted keys.
            values: "{{ fromJson(outputs.drift.values.items) | jq('[group_by(.topic)[] | {topic: .[0].topic, configs: (map({(.key): .desired}) | add)}]') | first | toJson }}"
            tasks:
              - id: update
                type: io.kestra.plugin.kafka.TopicUpdate
                topic: "{{ fromJson(item.value).topic }}"
                configs: "{{ fromJson(item.value).configs }}"
                properties:
                  bootstrap.servers: "{{ inputs.bootstrap_servers }}"

          - id: verify
            type: io.kestra.plugin.core.flow.Loop
            description: Describe the remediated topics again, to check the broker applied the change.
            values: "{{ fromJson(outputs.drift.values.items) | jq('[.[].topic] | unique') | first | toJson }}"
            outputs:
              - id: live
                type: STRING
                value: "{{ {'topic': item.value, 'configs': outputs.recheck.configs} | toJson }}"
            tasks:
              - id: recheck
                type: io.kestra.plugin.kafka.TopicDescribe
                topic: "{{ item.value }}"
                properties:
                  bootstrap.servers: "{{ inputs.bootstrap_servers }}"

          - id: verify_result
            type: io.kestra.plugin.core.flow.If
            condition: >-
              {{ {'d': fromJson(outputs.drift.values.items), 'a': outputs.verify.outputs} | jq('(.a | map(.outputs.live | fromjson | {(.topic): .configs}) | add) as $live | [.d[] as $x | select($live[$x.topic][$x.key] != $x.desired)] | length') | first > 0 }}
            then:
              - id: remediation_failed
                type: io.kestra.plugin.core.execution.Fail
                errorMessage: "TopicUpdate ran, but some keys still differ from the policy after the re-describe."
            else:
              - id: remediated
                type: io.kestra.plugin.core.log.Log
                message: "Remediated and verified: {{ fromJson(outputs.drift.values.items) | length }} keys now match the policy."

      - id: missing_gate
        type: io.kestra.plugin.core.flow.If
        condition: "{{ fromJson(outputs.present.values.missing) | length > 0 }}"
        then:
          - id: missing_topics
            type: io.kestra.plugin.core.log.Log
            level: WARN
            message: "Topics in the policy but not on the cluster: {{ fromJson(outputs.present.values.missing) | join(', ') }}. Create them through your usual process, this flow never creates topics."
    else:
      - id: compliant
        type: io.kestra.plugin.core.log.Log
        message: "All {{ inputs.policy | keys | length }} policy topics match their declared configs."

errors:
  - id: alert_flow_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: A broker that cannot be reached or a failed remediation must not read as a compliant cluster.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {{ {'text': 'Kafka topic config drift guard failed on ' ~ inputs.bootstrap_servers ~ ' (execution ' ~ execution.id ~ '). Check the execution logs: the cluster state is unknown or a change did not apply.'} | toJson }}

triggers:
  - id: hourly
    type: io.kestra.plugin.core.trigger.Schedule
    description: Shipped disabled, and always in safe mode. Enable it once the policy and bootstrap servers point at your cluster.
    cron: "0 * * * *"
    disabled: true
    inputs:
      auto_remediate: false
      dry_run: true

extend:
  title: Kafka Topic Config Drift Guard
  shortDescription: Compare live Kafka topic configs with a declared policy, alert Slack on every drifted key or missing topic, and optionally put the drifted keys back with TopicUpdate and verify the fix.
  metaTitle: Kafka Topic Config Drift Guard with Kestra
  metaDescription: Detect Kafka topic config drift against a policy, alert Slack, remediate with TopicUpdate behind dry-run gates, and re-describe to verify.
  description: |
    Kafka topic configs drift. Someone sets `retention.ms=-1` on a topic to debug an incident and never puts it back, so the disk fills months later. A compacted topic is recreated with the default `cleanup.policy=delete` and silently starts losing keys. A topic the platform team expects is never created. None of this throws an error. It shows up as an outage or as lost data.

    This blueprint describes every topic in a declared policy with the Kafka AdminClient and compares only the keys you care about. It alerts Slack on any drifted key or missing topic, and can set the drifted keys back with `TopicUpdate`, behind two gates. After a change it describes the topics again, so the run only reports success when the broker really holds the policy value.

    This blueprint was created by [zkasuran](https://github.com/zkasuran).

    ## How it works

    1. `list_topics` (`io.kestra.plugin.kafka.TopicList`) lists the topics on the cluster. `present` splits the policy into topics that exist and topics that are missing, so a missing topic is reported instead of failing the describe.
    2. `describe_topics` (`io.kestra.plugin.core.flow.Loop` over `io.kestra.plugin.kafka.TopicDescribe`) reads the live configs of every policy topic, read-only.
    3. `drift` lists every policy key whose live value differs, with the live and the desired value. Keys not in the policy are never looked at.
    4. `summary` logs the result every run.
    5. `route` (`io.kestra.plugin.core.flow.If`):
       - **compliant:** logs it.
       - **drift or missing topics:** `alert` posts to Slack, saying whether a change will be applied.
         - `remediate_gate` runs only when `auto_remediate` is true and `dry_run` is false.
         - `remediate` sends one `TopicUpdate` per drifted topic with only its drifted keys.
         - `verify` describes those topics again, and `verify_result` fails the run if any key still differs.
         - Missing topics are logged as a warning and never created.
    6. `errors` alerts Slack when the flow itself fails, for example on an unreachable broker. A failed check must not read as a compliant cluster.

    ## Safety

    - Read-only by default: `auto_remediate: false`, `dry_run: true`. The `hourly` trigger is shipped disabled and always runs in safe mode.
    - Only keys listed in the policy are ever changed, and only to the policy value.
    - Topics are never created, deleted or repartitioned.
    - No message is consumed or produced.

    ## What you get

    - A check of only the topic configs you declare, on every topic in the policy, with the live and the desired value of every drifted key.
    - Missing topics reported, never created.
    - Fixes limited to the drifted keys, behind two gates, verified by a second describe.

    ## Who it's for

    - Platform teams running Kafka clusters shared by many services.
    - Data engineering teams whose retention and compaction settings are part of their data contracts.
    - Teams evaluating the Kafka plugin who want an example of `TopicDescribe` and `TopicUpdate` with gates around them.

    ## Why orchestrate this with Kestra

    `kafka-configs.sh --describe` shows a config at one moment. Kestra runs the comparison on a schedule, keeps the policy next to the flow, turns drift into a Slack alert, applies `TopicUpdate` only behind `auto_remediate` and `dry_run`, and keeps an execution history showing when each key drifted and when it was put back.


    ## Tested end to end

    On Kestra 2.0.5 OSS against Apache Kafka 3.9.1 (KRaft, one broker), with a local HTTP sink standing in for Slack.

    | Run | Inputs | Result |
    |---|---|---|
    | 1 | defaults | 2 drifted keys found: `payments retention.ms=-1` (policy 30 days) and `customers-compacted cleanup.policy=delete` (policy compact). `invoices` reported missing. Slack alert sent, nothing changed |
    | 2 | `auto_remediate: true`, `dry_run: true` | Same report, the alert says no change was applied. `kafka-configs.sh` still shows `retention.ms=-1` |
    | 3 | `auto_remediate: true`, `dry_run: false` | 2 `TopicUpdate` calls, re-describe confirms both keys. `kafka-configs.sh` shows `retention.ms=2592000000` and `cleanup.policy=compact` |
    | 4 | policy without `invoices` | Compliant, no alert |
    | 5 | unreachable broker | AdminClient timeout, the `errors` alert is sent |

    ## Prerequisites

    - A Kafka cluster reachable from the Kestra worker, and a principal allowed to describe topics, plus `AlterConfigs` if remediation will be used.
    - Local testing: `docker run -d --name kafka -p 9092:9092 apache/kafka:3.9.1`. Then create a few topics with `kafka-topics.sh` and change a config with `kafka-configs.sh --alter` to see the drift.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack incoming webhook used by `alert` and the `errors` block. In Kestra OSS, provide it as the base64-encoded environment variable `SECRET_SLACK_WEBHOOK_URL`.

    ### Inputs

    | Input | Default | Purpose |
    |---|---|---|
    | `bootstrap_servers` | `localhost:9092` | Brokers |
    | `policy` | 5 example topics | Desired configs per topic |
    | `auto_remediate` | `false` | Allow `TopicUpdate` |
    | `dry_run` | `true` | Must be `false` for a change to apply |

    For a secured cluster, add `security.protocol`, `sasl.mechanism` and `sasl.jaas.config` to each task's `properties`, read from secrets.

    ## Quick start

    1. Add the `SLACK_WEBHOOK_URL` secret.
    2. Import the flow, set `bootstrap_servers`, and replace `policy` with your topics and keys.
    3. Run it once and read the drifted keys and missing topics.
    4. Run it with `auto_remediate: true` and `dry_run: false` to put the keys back.
    5. Enable the `hourly` trigger, which always runs in safe mode.

    ## How to extend

    - Load the policy from a Git repository or a namespace file, so topic configs are reviewed like code.
    - Create the missing topics from the policy, with partition count and replication factor, behind an approval `Pause`.
    - Check several clusters by looping over a list of bootstrap servers.
    - Also compare partition counts and replication factor with `TopicDescribe`'s other outputs.


    ## Links

    - Kafka plugin: https://kestra.io/plugins/plugin-kafka
    - Kafka topic configs: https://kafka.apache.org/documentation/#topicconfigs
  tags:
    - Data
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - Day 2 Operations
  ee: false
  demo: false
