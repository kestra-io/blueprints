id: nyc-taxi-monthly-load-sla-circuit-breaker
namespace: company.team

inputs:
  - id: month
    type: STRING
    displayName: Month to load
    description: A month of NYC TLC green taxi trips, as `yyyy-MM`. Leave it empty for the month two months back, the latest TLC has usually published.
    required: false
    validator: ^20[0-9]{2}-(0[1-9]|1[0-2])$

  - id: min_trips
    type: INT
    displayName: Minimum trips
    description: Fewer trips than this means a truncated or empty file.
    defaults: 10000

  - id: max_change_pct
    type: FLOAT
    displayName: Maximum change from the previous month (%)
    description: Checked only when the previous month was loaded by this flow.
    defaults: 50

  - id: max_null_passenger_pct
    type: FLOAT
    displayName: Maximum share of trips without a passenger count (%)
    defaults: 25

  - id: max_out_of_month_pct
    type: FLOAT
    displayName: Maximum share of trips picked up outside the month (%)
    defaults: 1

variables:
  month: "{{ inputs.month ?? ((trigger.date ?? now()) | dateAdd(-2, 'MONTHS') | date('yyyy-MM')) }}"
  previous_month: "{{ (render(vars.month) ~ '-01') | dateAdd(-1, 'MONTHS') | date('yyyy-MM') }}"
  published_path: "nyc_taxi/green/{{ render(vars.month) }}.parquet"

# Each rule is checked every time the execution changes, from the first task on. Until `profile` has run its
# output doesn't exist, so `??` gives a value that passes; without it the rule can't be evaluated and Kestra
# treats it as violated, failing every run before the download.
sla:
  - id: enough_trips
    type: EXECUTION_ASSERTION
    behavior: FAIL
    assert: "{{ (outputs.profile.row.trips ?? inputs.min_trips) >= inputs.min_trips }}"
    labels:
      sla_breach: enough_trips

  - id: stable_volume
    type: EXECUTION_ASSERTION
    behavior: FAIL
    assert: "{{ ((outputs.profile.row.change_pct ?? 0) | abs) <= inputs.max_change_pct }}"
    labels:
      sla_breach: stable_volume

  - id: passenger_count_filled
    type: EXECUTION_ASSERTION
    behavior: FAIL
    assert: "{{ (outputs.profile.row.null_passenger_pct ?? 0) <= inputs.max_null_passenger_pct }}"
    labels:
      sla_breach: passenger_count_filled

  - id: trips_in_month
    type: EXECUTION_ASSERTION
    behavior: FAIL
    assert: "{{ (outputs.profile.row.out_of_month_pct ?? 0) <= inputs.max_out_of_month_pct }}"
    labels:
      sla_breach: trips_in_month

  - id: load_duration
    type: MAX_DURATION
    behavior: FAIL
    duration: PT15M
    labels:
      sla_breach: load_duration

tasks:
  - id: fetch
    type: io.kestra.plugin.core.flow.Parallel
    description: Reads last month's baseline and downloads this month side by side.
    tasks:
      - id: previous
        type: io.kestra.plugin.core.kv.Get
        description: Trip count of the previous month, saved by the run that published it.
        key: "nyc_taxi_green_stats_{{ render(vars.previous_month) }}"
        errorOnMissing: false

      - id: download
        type: io.kestra.plugin.core.http.Download
        uri: "https://d37ci6vzurychx.cloudfront.net/trip-data/green_tripdata_{{ render(vars.month) }}.parquet"

  - id: profile
    type: io.kestra.plugin.jdbc.duckdb.Query
    description: The numbers the SLA rules read. Nothing is published yet.
    inputFiles:
      trips.parquet: "{{ outputs.download.uri }}"
    fetchType: FETCH_ONE
    sql: |
      SELECT count(*) AS trips,
             {{ outputs.previous.value.trips ?? 'NULL' }} AS previous_trips,
             round(100.0 * (count(*) - {{ outputs.previous.value.trips ?? 'NULL' }}) / {{ outputs.previous.value.trips ?? 'NULL' }}, 1) AS change_pct,
             round(100.0 * count(*) FILTER (WHERE passenger_count IS NULL) / count(*), 2) AS null_passenger_pct,
             round(100.0 * count(*) FILTER (WHERE strftime(lpep_pickup_datetime, '%Y-%m') <> '{{ render(vars.month) }}') / count(*), 3) AS out_of_month_pct
      FROM '{{ workingDir }}/trips.parquet'

  - id: curate
    type: io.kestra.plugin.jdbc.duckdb.Query
    description: Keeps the trips picked up in the month, with a distance and a non-negative fare.
    inputFiles:
      trips.parquet: "{{ outputs.download.uri }}"
    outputFiles:
      - curated.parquet
    sql: |
      COPY (
        SELECT * FROM '{{ workingDir }}/trips.parquet'
        WHERE strftime(lpep_pickup_datetime, '%Y-%m') = '{{ render(vars.month) }}'
          AND trip_distance > 0
          AND fare_amount >= 0
        ORDER BY lpep_pickup_datetime
      ) TO '{{ outputFiles["curated.parquet"] }}' (FORMAT parquet)

  - id: publish
    type: io.kestra.plugin.core.namespace.UploadFiles
    description: The published file other flows read, in this namespace's files.
    namespace: "{{ flow.namespace }}"
    filesMap:
      "{{ render(vars.published_path) }}": "{{ outputs.curate.outputFiles['curated.parquet'] }}"

  - id: remember
    type: io.kestra.plugin.core.kv.Set
    description: The baseline the next month is compared with.
    key: "nyc_taxi_green_stats_{{ render(vars.month) }}"
    kvType: JSON
    value: "{{ outputs.profile.row | toJson }}"

  - id: summary
    type: io.kestra.plugin.core.log.Log
    message: >-
      Published {{ render(vars.month) }} to {{ render(vars.published_path) }}:
      {{ outputs.profile.row.trips }} trips{{ outputs.profile.row.change_pct is not null ? ' (' ~ outputs.profile.row.change_pct ~ '% from ' ~ render(vars.previous_month) ~ ')' : '' }},
      {{ outputs.profile.row.null_passenger_pct }}% without a passenger count,
      {{ outputs.profile.row.out_of_month_pct }}% picked up outside the month.

outputs:
  - id: published_path
    type: STRING
    required: false
    value: "{{ render(vars.published_path) }}"

triggers:
  - id: monthly
    type: io.kestra.plugin.core.trigger.Schedule
    description: On the 25th, load the month two months back, which TLC has published by then.
    cron: "0 6 25 * *"

extend:
  title: Stop a Bad Monthly Load with SLA Assertions on NYC Taxi Data in DuckDB
  metaTitle: SLA Circuit Breaker for a Monthly DuckDB Load | Kestra
  shortDescription: Load a month of NYC taxi trips into DuckDB and publish it only if flow-level SLA assertions on volume, nulls and dates hold; a bad month fails the run before anything is published.
  metaDescription: Profile a month of NYC taxi data in DuckDB and stop the load with Kestra SLA assertions before a bad month is published.
  description: |
    A monthly load guarded by flow-level `sla:` rules instead of `If` and `Fail` tasks: a month of NYC TLC green
    taxi trips (about 1 MB) is profiled in DuckDB, and a bad month fails the run before anything is published.

    ## How it works

    1. `monthly` runs on the 25th for the month two months back; a manual run takes `month` or that default.
    2. `fetch` (`Parallel`) reads the previous month's trip count from the KV store and downloads the month.
    3. `profile` (DuckDB) computes the numbers the rules read: trips, change from the previous month, share of
       trips without a passenger count, share picked up outside the month.
    4. The `sla` rules are checked every time the execution changes. As soon as `profile` ends, a false rule fails
       the run and labels it `sla_breach: <rule>`: `curate`, `publish` and `remember` never start.
    5. Otherwise `curate` writes the cleaned month to Parquet, `publish` uploads it to the namespace files and
       `remember` keeps its numbers as the next baseline. `load_duration` caps the run at 15 minutes.

    Rules are evaluated before `profile` has run, so each one reads its output through `??`:

    ```yaml
    # Wrong: fails every run at the first task ("could not be evaluated and is treated as violated")
    assert: "{{ outputs.profile.row.trips >= inputs.min_trips }}"
    # Right: passes until profile has run, then checks the real value
    assert: "{{ (outputs.profile.row.trips ?? inputs.min_trips) >= inputs.min_trips }}"
    ```

    Don't add `afterExecution` tasks to this flow: on Kestra 2.0.6, a flow that has them still starts the next task
    after an SLA failure, so a bad month would be published
    ([kestra-io/kestra#22036](https://github.com/kestra-io/kestra/issues/22036)).

    ## What you get

    - A Parquet file per month in `nyc_taxi/green/`, only for months that pass every rule.
    - Otherwise a failed execution labelled with the broken rule, the rule in the logs, and nothing published.

    ## Who it's for

    Data engineers and analytics engineers who load third-party files on a schedule.

    ## Why orchestrate this with Kestra

    Declared once for the flow, a rule also guards tasks added later, needs no extra task in the Gantt, and labels
    the execution so failures can be filtered or alerted on. Switch a rule's `behavior` to `NONE` to try a new
    threshold without stopping loads.

    ## Prerequisites

    Kestra 2.0 with the DuckDB plugin. The TLC files are public.

    ### Secrets

    None.

    ## Quick start

    1. Execute with the defaults: the latest month is published.
    2. Execute with `month` 2020-03, then 2020-04: April 2020 (35,644 trips, down 84%) fails on `stable_volume`.
    3. Keep the `monthly` trigger.

    ## How to extend

    - Alert from a second flow with a `Flow` trigger on `FAILED` executions where `labels.sla_breach is defined`.
    - Load to a warehouse instead, or add rules on fares and distances.

    ## Links

    - [SLA](https://kestra.io/docs/workflow-components/sla),
      [DuckDB Query](https://kestra.io/plugins/plugin-jdbc-duckdb/io.kestra.plugin.jdbc.duckdb.query),
      [UploadFiles](https://kestra.io/plugins/core/namespace/io.kestra.plugin.core.namespace.uploadfiles),
      [NYC TLC trip record data](https://www.nyc.gov/site/tlc/about/tlc-trip-record-data.page)
  tags:
    - Data
  subTags:
    - Testing & Quality
    - ELT & Data Landing
  ee: false
  demo: false
