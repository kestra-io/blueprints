id: pendingwatch
namespace: company.team
description: Watches for pods stuck in Pending and reports why they cannot be scheduled, on Slack.

labels:
  project: pendingwatch
  team: platform

inputs:
  - id: namespace
    type: STRING
    displayName: "Namespace"
    description: the namespace whose pods to watch
    defaults: default
  - id: pending_minutes
    type: INT
    displayName: "Pending threshold (minutes)"
    description: pods pending longer than this count as stuck
    defaults: 10
  - id: slack_webhook
    type: STRING
    displayName: "Slack Webhook URL"
    description: Incoming webhook URL of the Slack channel for alerts

triggers:
  - id: schedule
    type: io.kestra.plugin.core.trigger.Schedule
    description: checks for pending pods every fifteen minutes
    cron: "*/15 * * * *"
    timezone: UTC
    inputs:
      namespace: default
      pending_minutes: 10
      slack_webhook: "{{ secret('SLACK_WEBHOOK') }}"

tasks:
  - id: list_pods
    type: io.kestra.plugin.scripts.shell.Commands
    description: lists all pods in the namespace as JSON
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      user: "0"
    containerImage: bitnami/kubectl
    inputFiles:
      client.crt: "{{ secret('CLIENT_CRT') }}"
      client.key: "{{ secret('CLIENT_KEY') }}"
    commands:
      - kubectl get pods -n {{ inputs.namespace }} -o json --client-certificate=client.crt --client-key=client.key --server={{ secret('MASTERURL') }} --insecure-skip-tls-verify=true > pods.json
    outputFiles:
      - pods.json

  - id: find_pending
    type: io.kestra.plugin.scripts.python.Script
    description: finds pods stuck Pending and diagnoses why from the scheduler's message
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      user: "0"
    containerImage: python:3.11
    dependencies:
      - kestra
    script: |
      import json
      from datetime import datetime, timezone
      from kestra import Kestra

      namespace = """{{ inputs.namespace }}"""
      threshold = int("""{{ inputs.pending_minutes }}""")

      with open("""{{ outputs.list_pods.outputFiles['pods.json'] }}""") as f:
          pods = json.load(f)['items']

      # names we already alerted on, from the KV store (null on first run -> empty)
      raw_state = """{{ kv('pendingwatch-state-' ~ inputs.namespace, errorOnMissing=false) }}"""
      already = set(json.loads(raw_state) if raw_state.strip() else [])

      def diagnose(message):
          msg = (message or '').lower()
          if 'node affinity' in msg or "didn't match" in msg or 'node selector' in msg:
              return "no node matches the pod's nodeSelector or affinity"
          if 'insufficient cpu' in msg:
              return "no node has enough free CPU"
          if 'insufficient memory' in msg:
              return "no node has enough free memory"
          if 'unbound' in msg and 'persistentvolumeclaim' in msg:
              return "waiting on an unbound PersistentVolumeClaim"
          if 'untolerated taint' in msg:
              return "every node has a taint this pod does not tolerate"
          if message:
              return message[:140]
          return "the scheduler gave no reason"

      stuck = []
      now = datetime.now(timezone.utc)
      for pod in pods:
          meta = pod.get('metadata', {})
          status = pod.get('status', {})
          if status.get('phase') != 'Pending':
              continue
          name = meta['name']
          created = datetime.fromisoformat(
              meta['creationTimestamp'].replace('Z', '+00:00')
          )
          age_min = int((now - created).total_seconds() // 60)
          if age_min < threshold:
              continue
          reason = ''
          for cond in status.get('conditions', []) or []:
              if cond.get('type') == 'PodScheduled' and cond.get('status') == 'False':
                  reason = cond.get('message', '')
                  break
          stuck.append({
              'pod': name,
              'age_min': age_min,
              'why': diagnose(reason),
          })

      stuck_names = sorted(s['pod'] for s in stuck)
      new = [s for s in stuck if s['pod'] not in already]

      lines = [f"*PendingWatch - pods stuck Pending in '{namespace}'*", ""]
      for s in new:
          lines.append(f"- *{s['pod']}*: pending for ~{s['age_min']}m")
          lines.append(f"  why: {s['why']}")
      lines.append("")
      lines.append(f"inspect with: kubectl describe pod {new[0]['pod']} -n {namespace}" if new else "")
      alert_text = "\n".join(lines)

      Kestra.outputs({
          'new_pending': new,
          'count': len(new),
          'alert_text': alert_text,
          'new_state_json': json.dumps(stuck_names),
      })

  - id: maybe_alert
    type: io.kestra.plugin.core.flow.If
    description: alerts only about newly stuck pods
    condition: "{{ outputs.find_pending.vars.count > 0 }}"
    then:
      - id: send_alert
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: posts the stuck Pending alert to Slack
        url: "{{ inputs.slack_webhook }}"
        messageText: "{{ outputs.find_pending.vars.alert_text }}"

  - id: save_state
    type: io.kestra.plugin.core.kv.Set
    description: remembers who is stuck now, so scheduled pods alert again next time
    key: "pendingwatch-state-{{ inputs.namespace }}"
    value: "{{ outputs.find_pending.vars.new_state_json }}"
    overwrite: true

extend:
  title: "PendingWatch - Kubernetes pods stuck Pending watcher"
  shortDescription: "Alerts on Slack when pods get stuck in Pending, with the scheduler's reason why."
  metaTitle: "PendingWatch: Kubernetes pods stuck Pending watcher blueprint for Kestra"
  metaDescription: "A Kestra blueprint that watches Kubernetes pods stuck in Pending past a threshold and alerts on Slack with the diagnosed scheduling reason, without spamming."
  tags:
    - Infrastructure
  subTags:
    - Kubernetes Operations
    - Infrastructure Automation
  ee: false
  demo: false
  description: |
    ## How it works

    1. `list_pods` (`io.kestra.plugin.scripts.shell.Commands`) dumps the namespace's pods as JSON with kubectl.
    2. `find_pending` (`io.kestra.plugin.scripts.python.Script`) keeps pods whose phase is Pending longer than `pending_minutes`, then reads the `PodScheduled=False` condition message and translates scheduler jargon into plain causes: no node matching nodeSelector/affinity, insufficient CPU or memory, an unbound PersistentVolumeClaim, or untolerated taints. It compares against the KV state so only newly stuck pods alert.
    3. `maybe_alert` (`io.kestra.plugin.core.flow.If`) posts the Slack alert only when there is something new, naming the pod, how long it has been pending, and the diagnosed why.
    4. `save_state` (`io.kestra.plugin.core.kv.Set`) writes back the current stuck list. Scheduled pods drop out on their own, so getting stuck again alerts again, and steady-state reruns stay quiet.

    ## What you get

    - A fifteen-minute check for the "pod created but never runs" failure, no agent to install inside the cluster.
    - Slack alerts that do the first minute of debugging for you: the pod, the wait time, and the scheduling reason in plain words.
    - No alert spam: the KV-backed memory remembers who was already reported, and forgets pods that got scheduled.
    - Quiet runs when every pod schedules fine.

    ## Who it's for

    Anyone running workloads on Kubernetes who has watched a pod sit in Pending wondering whether it is the node selector, the resources, or the storage. Works on any cluster you can reach with a client certificate: minikube, kind, managed clusters.

    ## Why orchestrate this with Kestra

    `kubectl get pods` shows you the symptom; this flow adds the diagnosis, the memory, and the notification in one scheduled place. Kestra holds the cluster credentials as secrets, keeps every run's findings where you can audit them, and the KV state means the second run does not page you about the same pod again. It completes the pod trilogy with PodPulse (crashed pods) and ImageWatch (pods that cannot pull): this one catches pods that cannot even be placed.

    ## Prerequisites

    - A Kubernetes cluster with pods you can list.
    - A kubeconfig client certificate and key with permission to list pods in the target namespace.
    - Kestra with the Docker task runner available (used for the kubectl and Python steps).
    - A Slack Incoming Webhook URL.

    ### Secrets

    | Secret | What it is |
    | --- | --- |
    | `CLIENT_CRT` | base64-encoded client certificate from your kubeconfig |
    | `CLIENT_KEY` | base64-encoded client key from your kubeconfig |
    | `MASTERURL` | base64-encoded Kubernetes API server URL, reachable from inside the Kestra container |
    | `SLACK_WEBHOOK` | base64-encoded Slack Incoming Webhook URL |

    In Kestra OSS, secrets come from environment variables prefixed with `SECRET_` and must be base64-encoded. If the API URL uses `127.0.0.1` or `localhost`, replace it with `host.docker.internal` so the Kestra container can reach it.

    ## Quick start

    1. Start Kestra with the secrets above as `SECRET_` environment variables. If minikube restarted since your last run, regenerate `SECRET_MASTERURL` first: the API port changes on every `minikube start`.
    2. Import this flow and run it with `pending_minutes: 1` for testing: create a stuck pod with `kubectl run pending-demo --image=nginx --overrides='{"spec":{"nodeSelector":{"gpu":"true"}}}'` and the Slack alert names it with the affinity reason.
    3. Run again: quiet, the pod is already reported.
    4. Delete the pod and run again: quiet, it dropped out of state.

    ## How to extend

    - Watch all namespaces by looping over `kubectl get namespaces` output in the shell step.
    - Page instead of Slack-alert by swapping the notification task for PagerDuty or Opsgenie.
    - Add event context by also dumping `kubectl get events` for the stuck pod.
    - Lower `pending_minutes` for dev namespaces where fast feedback matters.

    ## Inputs

    | Input | Type | Default | What it does |
    | --- | --- | --- | --- |
    | `namespace` | STRING | `default` | the namespace whose pods to watch |
    | `pending_minutes` | INT | `10` | pods pending longer than this count as stuck |
    | `slack_webhook` | STRING | (required) | Incoming webhook URL of the Slack channel for alerts |

    ## Links

    - [Kestra blueprint catalog](https://kestra.io/blueprints)
    - [Kubernetes pod lifecycle documentation](https://kubernetes.io/docs/concepts/workloads/pods/pod-lifecycle/)
    - [Kestra secrets documentation](https://kestra.io/docs/concepts/secrets)

    ## Pitfalls

    - `pending_minutes` exists because every pod is Pending for a few seconds while scheduling. Set it to 1 only for testing; 10 is sane for real use.
    - The diagnosis reads the scheduler's condition message. If the scheduler gave no reason, the alert says so honestly instead of guessing.
    - The flow is strictly read-only. It never deletes, evicts, or reschedules anything.
    - Minikube's API server port changes on every `minikube start`. Regenerate `SECRET_MASTERURL` and restart the Kestra container, or the kubectl step fails to connect.
