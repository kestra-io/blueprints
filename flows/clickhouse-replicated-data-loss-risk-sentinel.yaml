id: clickhouse-replicated-data-loss-risk-sentinel
namespace: company.team

inputs:
  - id: clickhouse_host
    type: STRING
    defaults: "clickhouse.internal"
    description: ClickHouse server hostname or IP address.
  - id: clickhouse_http_port
    type: INT
    defaults: 8123
    description: ClickHouse HTTP interface port.
  - id: clickhouse_user
    type: STRING
    defaults: "default"
    description: ClickHouse user name.
  - id: max_queue_size_threshold
    type: INT
    defaults: 100
    description: Maximum acceptable replication queue size before flagging data loss risk.
  - id: max_delay_seconds_threshold
    type: INT
    defaults: 300
    description: Maximum acceptable replication lag in seconds.

tasks:
  - id: query_replication_status
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests
    env:
      CH_HOST: "{{ inputs.clickhouse_host }}"
      CH_PORT: "{{ inputs.clickhouse_http_port }}"
      CH_USER: "{{ inputs.clickhouse_user }}"
      CH_PASSWORD: "{{ secret('CLICKHOUSE_PASSWORD') }}"
      MAX_QUEUE: "{{ inputs.max_queue_size_threshold }}"
      MAX_DELAY: "{{ inputs.max_delay_seconds_threshold }}"
    outputFiles:
      - ch_rep_risk.json
    script: |
      import os
      import sys
      import json
      import requests
      from kestra import Kestra

      host = os.environ.get("CH_HOST", "clickhouse.internal")
      port = os.environ.get("CH_PORT", "8123")
      user = os.environ.get("CH_USER", "default")
      password = os.environ.get("CH_PASSWORD", "")
      max_queue = int(os.environ.get("MAX_QUEUE", 50))
      max_delay = int(os.environ.get("MAX_DELAY", 300))

      query = f"SELECT database, table, queue_size, absolute_delay FROM system.replicas WHERE queue_size > {max_queue} OR absolute_delay > {max_delay} ORDER BY absolute_delay DESC LIMIT 10 FORMAT JSON"
      url = f"http://{host}:{port}/"
      auth = (user, password) if user or password else None

      try:
          resp = requests.post(url, auth=auth, data=query, timeout=12)
          resp.raise_for_status()
          data = resp.json().get("data", [])
      except Exception as e:
          print(f"ERROR: Failed to query ClickHouse system.replicas: {e}", file=sys.stderr)
          sys.exit(1)

      risk_tables_count = len(data)
      max_delay_observed = max([int(r.get("absolute_delay", 0)) for r in data], default=0)
      max_queue_observed = max([int(r.get("queue_size", 0)) for r in data], default=0)

      result = {
          "risk_tables_count": risk_tables_count,
          "max_delay": max_delay_observed,
          "max_queue": max_queue_observed,
          "risk_tables": data
      }

      with open("ch_rep_risk.json", "w", encoding="utf-8") as out:
          json.dump(result, out, indent=2)

      print(f"Replication risk audit completed: {risk_tables_count} tables exceeding thresholds.")

      Kestra.outputs({
          "risk_tables_count": risk_tables_count,
          "max_delay": max_delay_observed,
          "max_queue": max_queue_observed
      })

  - id: evaluate_replication_health
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.query_replication_status.vars.risk_tables_count > 0 }}"
    then:
      - id: notify_slack
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#alerts-critical",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 ClickHouse Replication Lag & Data Loss Risk Alert",
                "text": "ClickHouse instance `{{ inputs.clickhouse_host }}` recorded *{{ outputs.query_replication_status.vars.risk_tables_count }}* replicated tables exceeding safe lag ceilings! Max Delay: *{{ outputs.query_replication_status.vars.max_delay }}s* (Threshold: {{ inputs.max_delay_seconds_threshold }}s), Max Queue: *{{ outputs.query_replication_status.vars.max_queue }}* (Threshold: {{ inputs.max_queue_size_threshold }}). Immediate replica synchronization check required to prevent data divergence.",
                "footer": "Kestra Cloud Sentinel • ClickHouse Replication"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#alerts-critical",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ ClickHouse Replication Sentinel Pipeline Failure",
            "text": "Failed to inspect ClickHouse system.replicas. Verify host connectivity and authentication.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  metaDescription: "Audits ClickHouse system.replicas to detect replication queue accumulation and absolute replica delay."
  metaTitle: ClickHouse Replicated Data Loss Risk Sentinel with Kestra
  title: ClickHouse Replicated Data Loss Risk Sentinel
  shortDescription: Audits ClickHouse system.replicas to detect replication queue accumulation and absolute replica delay.
  description: |
    ## How it works
    This workflow inspects `system.replicas` for tables where `queue_size` exceeds the maximum queue threshold or `absolute_delay` exceeds the replication lag threshold. When network bottlenecks, heavy disk writes, or mutation deadlocks delay replication tasks, replicas become stale. If lagging tables are detected, details are sent to Slack.

    ## What you get
    - Early warning of severe replica divergence before failover data loss occurs.
    - Identification of high-lag tables and overloaded replication queues.
    - Actionable metrics on maximum queue depth and delay seconds.

    ## Who it's for
    - SREs and Data Engineers maintaining mission-critical ClickHouse replication topologies.
    - Analytics teams relying on replica read-consistency for real-time dashboards.

    ## Why orchestrate this with Kestra
    - **Targeted Thresholds**: Configure independent thresholds for queue depth and delay seconds.
    - **Declarative Operations**: Manage monitoring policies as code alongside your data pipelines.
    - **Fast Remediation**: Trigger cluster sync or throttle ingest automatically on breach.

    ## Prerequisites
    - Replicated ClickHouse deployment (ReplicatedMergeTree tables).
    - Secrets `CLICKHOUSE_PASSWORD` and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import the blueprint.
    2. Configure host and threshold inputs.
    3. Run the workflow to inspect replica consistency.

    ## How to extend
    - Query `system.replication_queue` to identify specific failing task types (GET_PART, MERGE_PARTS).
    - Automate table replica detach and re-sync for isolated stuck replicas.

    ## Links
    - [ClickHouse system.replicas Documentation](https://clickhouse.com/docs/en/operations/system-tables/replicas)
    - [Kestra Shell Plugin](https://kestra.io/plugins/plugin-scripts/commands/io.kestra.plugin.scripts.shell.commands)
  tags:
    - Data
    - Infrastructure
  subTags:
    - ELT & Data Landing
    - Day 2 Operations
  ee: false
  demo: false
