id: clickhouse-replicated-data-loss-risk-sentinel
namespace: company.data

inputs:
  - id: clickhouse_host
    type: STRING
    defaults: "clickhouse.internal"
    description: ClickHouse server hostname or IP address.
  - id: clickhouse_http_port
    type: INT
    defaults: 8123
    description: ClickHouse HTTP interface port.
  - id: clickhouse_user
    type: STRING
    defaults: "default"
    description: ClickHouse user name.
  - id: max_queue_size_threshold
    type: INT
    defaults: 100
    description: Maximum acceptable replication queue size before flagging data loss risk.
  - id: max_delay_seconds_threshold
    type: INT
    defaults: 300
    description: Maximum acceptable replication lag in seconds.

tasks:
  - id: query_replication_status
    type: io.kestra.plugin.scripts.shell.Commands
    containerImage: ghcr.io/kestra-io/tools:latest
    commands:
      - |
        SQL_QUERY="SELECT database, table, queue_size, absolute_delay FROM system.replicas WHERE queue_size > {{ inputs.max_queue_size_threshold }} OR absolute_delay > {{ inputs.max_delay_seconds_threshold }} ORDER BY absolute_delay DESC LIMIT 10 FORMAT JSON"
        
        curl -s -u "{{ inputs.clickhouse_user }}:{{ secret('CLICKHOUSE_PASSWORD') }}" \
          "http://{{ inputs.clickhouse_host }}:{{ inputs.clickhouse_http_port }}/?query=$(python3 -c 'import urllib.parse, sys; print(urllib.parse.quote(sys.argv[1]))' "$SQL_QUERY")" > /tmp/ch_rep_risk.json
        
        RISK_TABLES_COUNT=$(jq '.data | length' /tmp/ch_rep_risk.json)
        MAX_DELAY=$(jq '[.data[].absolute_delay] | max // 0' /tmp/ch_rep_risk.json)
        MAX_QUEUE=$(jq '[.data[].queue_size] | max // 0' /tmp/ch_rep_risk.json)
        
        echo "::set-output name=risk_tables_count::$RISK_TABLES_COUNT::"
        echo "::set-output name=max_delay::$MAX_DELAY::"
        echo "::set-output name=max_queue::$MAX_QUEUE::"

  - id: evaluate_replication_health
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.query_replication_status.vars.risk_tables_count | int > 0 }}"
    then:
      - id: notify_dba_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#clickhouse-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 ClickHouse Replication Lag & Data Loss Risk Alert",
                "text": "ClickHouse node `{{ inputs.clickhouse_host }}` detected *{{ outputs.query_replication_status.vars.risk_tables_count }}* tables exceeding replication risk limits! Max replication delay is *{{ outputs.query_replication_status.vars.max_delay }}s* and max queue size is *{{ outputs.query_replication_status.vars.max_queue }}* tasks. Impact: Replicas are drifting out of sync, risking data loss in failovers.",
                "footer": "Kestra Database Sentinel • ClickHouse"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#clickhouse-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ ClickHouse Replicated Data Loss Risk Sentinel Pipeline Failure",
            "text": "ClickHouse replication risk inspection query failed. Please check host availability and credentials.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  title: ClickHouse Replicated Data Loss Risk Sentinel
  shortDescription: Audits ClickHouse system.replicas to detect replication queue accumulation and absolute replica delay.
  description: |
    ## How it works
    This workflow inspects `system.replicas` for tables where `queue_size` exceeds the maximum queue threshold or `absolute_delay` exceeds the replication lag threshold. When network bottlenecks, heavy disk writes, or mutation deadlocks delay replication tasks, replicas become stale. If lagging tables are detected, details are sent to Slack.

    ## What you get
    - Early warning of severe replica divergence before failover data loss occurs.
    - Identification of high-lag tables and overloaded replication queues.
    - Actionable metrics on maximum queue depth and delay seconds.

    ## Who it's for
    - SREs and Data Engineers maintaining mission-critical ClickHouse replication topologies.
    - Analytics teams relying on replica read-consistency for real-time dashboards.

    ## Why orchestrate this with Kestra
    - **Targeted Thresholds**: Configure independent thresholds for queue depth and delay seconds.
    - **Declarative Operations**: Manage monitoring policies as code alongside your data pipelines.
    - **Fast Remediation**: Trigger cluster sync or throttle ingest automatically on breach.

    ## Prerequisites
    - Replicated ClickHouse deployment (ReplicatedMergeTree tables).
    - Secrets `CLICKHOUSE_PASSWORD` and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import the blueprint.
    2. Configure host and threshold inputs.
    3. Run the workflow to inspect replica consistency.

    ## How to extend
    - Query `system.replication_queue` to identify specific failing task types (GET_PART, MERGE_PARTS).
    - Automate table replica detach and re-sync for isolated stuck replicas.

    ## Links
    - [ClickHouse system.replicas Documentation](https://clickhouse.com/docs/en/operations/system-tables/replicas)
    - [Kestra Shell Plugin](https://kestra.io/plugins/plugin-scripts/commands/io.kestra.plugin.scripts.shell.commands)
  tags:
    - Data
    - Infrastructure
  ee: false
  demo: false
