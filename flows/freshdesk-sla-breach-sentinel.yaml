id: freshdesk-sla-breach-sentinel
namespace: company.team
description: |
  On a schedule, read recent tickets from the Freshdesk API (read-only:
  no ticket is replied to, updated or closed) and classify SLA health as
  HEALTHY, WARNING, CRITICAL or UNREACHABLE. Log quiet runs and alert
  Slack when open tickets are past their resolution or first-response
  due time, and page when a high or urgent ticket has breached.

inputs:
  - id: lookback_days
    type: INT
    defaults: 30
    displayName: "Lookback Window (days)"
    description: "Read tickets updated in this many days. Without a window Freshdesk only returns tickets created in the last 30 days."

triggers:
  - id: sla_check
    type: io.kestra.plugin.core.trigger.Schedule
    description: Check SLA health every 30 minutes during working hours (Monday to Saturday, 09:00 to 19:00 IST). Shipped disabled; enable it once the Freshdesk secrets are set and a manual run has been verified.
    cron: "*/30 9-19 * * 1-6"
    timezone: Asia/Kolkata
    disabled: true

tasks:
  - id: list_tickets
    type: io.kestra.plugin.core.http.Request
    description: Read up to 100 tickets updated in the lookback window, earliest due first. This is a GET; no ticket is changed.
    uri: "https://{{ secret('FRESHDESK_DOMAIN') }}.freshdesk.com/api/v2/tickets?per_page=100&order_by=due_by&order_type=asc&updated_since={{ now() | dateAdd(-inputs.lookback_days, 'DAYS') | date(\"yyyy-MM-dd'T'HH:mm:ss'Z'\", timeZone=\"UTC\") }}"
    method: GET
    options:
      auth:
        type: BASIC
        username: "{{ secret('FRESHDESK_API_KEY') }}"
        password: "X"
      allowFailed: true
      timeout:
        connectTimeout: PT10S
        readIdleTimeout: PT30S
    retry:
      type: constant
      interval: PT10S
      maxAttempts: 3
    allowFailure: true

  - id: summarize_sla
    type: io.kestra.plugin.core.debug.Return
    description: Keep tickets that are still Open (2) or Pending (3), count those past their resolution due time and those whose first response was escalated, count how many of the breached ones are High or Urgent, and classify in one jq query. A missing or non-200 response becomes UNREACHABLE instead of looking healthy.
    format: >-
      {{ (outputs.list_tickets.code is not defined or outputs.list_tickets.code != 200)
      ? '{"status":"UNREACHABLE","open":0,"resolution_breached":0,"first_response_breached":0,"high_urgent_breached":0,"oldest_breach":"none"}'
      : (fromJson(outputs.list_tickets.body) | jq('
      "' ~ (now() | date("yyyy-MM-dd'T'HH:mm:ss'Z'", timeZone="UTC")) ~ '" as $now
      | [.[] | select(.status == 2 or .status == 3)] as $o
      | [$o[] | select(.due_by != null and .due_by < $now)] as $r
      | [$o[] | select(.fr_escalated == true)] as $fr
      | ([$r[], $fr[]] | unique_by(.id)) as $b
      | ([$b[] | select(.priority >= 3)] | length) as $hu
      | {open: ($o | length), resolution_breached: ($r | length), first_response_breached: ($fr | length), high_urgent_breached: $hu,
      oldest_breach: (if ($r | length) == 0 then "none" else ($r | sort_by(.due_by) | first | ("#" + (.id | tostring) + " due " + .due_by)) end),
      status: (if $hu > 0 then "CRITICAL" elif ($b | length) > 0 then "WARNING" else "HEALTHY" end)}
      ') | first | toJson) }}

  - id: route_by_sla_state
    type: io.kestra.plugin.core.flow.Switch
    description: Route to a quiet log when no open ticket is past its due time, a Slack message when low or medium tickets have breached, or a Slack page when a high or urgent ticket has breached or Freshdesk could not be read.
    value: "{{ fromJson(outputs.summarize_sla.value).status }}"
    cases:
      "HEALTHY":
        - id: log_healthy
          type: io.kestra.plugin.core.log.Log
          message: "Freshdesk SLA healthy: {{ fromJson(outputs.summarize_sla.value).open }} open or pending ticket(s), none past due."
      "WARNING":
        - id: alert_warning_breach
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: Post a Slack message when low or medium priority tickets are past their resolution due time or had their first response escalated.
          url: "{{ secret('SLACK_WEBHOOK') }}"
          payload: |
            {
              "text": "Freshdesk SLA WARNING: {{ fromJson(outputs.summarize_sla.value).resolution_breached }} open ticket(s) past resolution due time and {{ fromJson(outputs.summarize_sla.value).first_response_breached }} with first response breached. Oldest: {{ fromJson(outputs.summarize_sla.value).oldest_breach }}. Execution {{ execution.id }}."
            }
      "CRITICAL":
        - id: alert_critical_breach
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: Page Slack when at least one High or Urgent ticket has breached its SLA.
          url: "{{ secret('SLACK_WEBHOOK') }}"
          payload: |
            {
              "text": "Freshdesk SLA CRITICAL: {{ fromJson(outputs.summarize_sla.value).high_urgent_breached }} High or Urgent ticket(s) have breached SLA ({{ fromJson(outputs.summarize_sla.value).resolution_breached }} past resolution due, {{ fromJson(outputs.summarize_sla.value).first_response_breached }} first response breached). Oldest: {{ fromJson(outputs.summarize_sla.value).oldest_breach }}. Execution {{ execution.id }}."
            }
      "UNREACHABLE":
        - id: alert_unreachable_api
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: Page Slack when the Tickets API could not be read, indicating an outage, a wrong domain or an invalid API key.
          url: "{{ secret('SLACK_WEBHOOK') }}"
          payload: |
            {
              "text": "Freshdesk SLA sentinel UNREACHABLE: the Tickets API did not return a usable response (HTTP {{ outputs.list_tickets.code ?? 'no response' }}). Check the domain and API key. Execution {{ execution.id }}."
            }
    defaults:
      - id: log_unclassified
        type: io.kestra.plugin.core.log.Log
        message: "Freshdesk SLA sentinel completed with an unexpected classification: {{ outputs.summarize_sla.value }}."

  - id: log_audit_result
    type: io.kestra.plugin.core.log.Log
    description: Record one audit line for every run, whichever branch fired, so SLA history stays queryable even if Slack delivery fails.
    message: "Freshdesk SLA sentinel audit: lookback_days={{ inputs.lookback_days }} http={{ outputs.list_tickets.code ?? 'n/a' }} summary={{ outputs.summarize_sla.value }} execution={{ execution.id }}."

errors:
  - id: alert_flow_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alert Slack when the sentinel flow itself fails, so a broken check is never mistaken for a healthy queue.
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "text": "Freshdesk SLA sentinel flow {{ flow.id }} FAILED (execution {{ execution.id }}). SLA status is now unknown; check the task logs and the Freshdesk ticket views."
      }

outputs:
  - id: status
    type: STRING
    value: "{{ fromJson(outputs.summarize_sla.value).status }}"

extend:
  title: "Freshdesk SLA Breach Sentinel"
  shortDescription: Read Freshdesk tickets on a schedule and alert Slack when open tickets breach their resolution or first-response SLA.
  metaTitle: Freshdesk SLA Breach Sentinel for Kestra
  metaDescription: "Read Freshdesk tickets on a schedule, change nothing, and alert Slack when open tickets pass their due time, paging for High and Urgent ones."
  description: |
    Freshdesk sets a resolution due time and a first-response due time on every ticket from its SLA policies, but a breach only shows up in a view someone has to open. By the time a manager notices, an urgent customer has already waited too long. This blueprint turns a scheduled, read-only call to the Freshdesk Tickets API into an SLA gate: `io.kestra.plugin.core.http.Request` reads recent tickets, one jq query counts open tickets past their due time and first responses that were escalated, and the result routes to a quiet log, a Slack note, or a Slack page for High and Urgent tickets.

    ## How it works

    1. `list_tickets` (`io.kestra.plugin.core.http.Request`) calls `GET /api/v2/tickets` with `updated_since` set to the lookback window, `per_page=100` and `order_by=due_by` ascending, using HTTP basic auth with the API key as the username and `X` as the password, as Freshdesk documents. It is a read: no ticket is changed. Retries cover short network blips, and `allowFailed` plus `allowFailure` keep an API error from aborting the flow so it can be reported instead.
    2. `summarize_sla` (`io.kestra.plugin.core.debug.Return`) first guards for a missing or non-200 response (`UNREACHABLE`). Otherwise one jq query keeps tickets in status 2 (Open) or 3 (Pending), counts those whose `due_by` is earlier than now (UTC) and those with `fr_escalated` set, counts how many breached tickets have priority 3 (High) or 4 (Urgent), and names the oldest breach. Any High or Urgent breach is `CRITICAL`, any other breach is `WARNING`, otherwise `HEALTHY`.
    3. `route_by_sla_state` (`io.kestra.plugin.core.flow.Switch`) branches on that classification: `HEALTHY` logs quietly, `WARNING` posts a Slack note, `CRITICAL` and `UNREACHABLE` page Slack. A `defaults` fallback logs anything unexpected.
    4. `log_audit_result` (`io.kestra.plugin.core.log.Log`) writes one audit line per run with the HTTP status and the full summary.
    5. The flow-level `errors` block pages Slack if the flow itself fails, so a broken sentinel is never mistaken for a healthy queue.
    6. The `sla_check` trigger runs every 30 minutes from 09:00 to 19:00 IST, Monday to Saturday, and ships `disabled: true`.

    ## What you get

    - A read-only SLA check across open and pending tickets with no custom scripting and no extra plugin to install.
    - A `status` output (`HEALTHY` / `WARNING` / `CRITICAL` / `UNREACHABLE`) other flows can gate on.
    - Slack messages with the number of resolution and first-response breaches and the oldest breached ticket, so the team knows where to start.
    - An audit line on every run, separate from Slack.

    ## Who it's for

    - Support teams on Freshdesk who want to hear about an SLA breach while there is still time to fix it.
    - Support managers who report SLA compliance and want the history in one place.
    - Teams that already run alerting in Kestra and want customer support health next to their data and infrastructure checks.

    ## Why orchestrate this with Kestra

    Freshdesk's SLA reminders are per ticket and per agent. Kestra turns a plain, read-only API call into a scheduled, typed classification across the whole queue, with retries, a failure path and an execution history, and the Switch branch is ready to grow into real actions (reassigning a group, opening an incident) without rewriting the check.

    ## Prerequisites

    - A Freshdesk account (the free plan includes API access) and an agent API key from Profile settings > View API key.
    - SLA policies configured in Freshdesk so tickets carry `due_by` and `fr_due_by`.
    - A Slack incoming webhook for the WARNING, CRITICAL, UNREACHABLE and flow-failure alerts.

    ### Secrets

    - `FRESHDESK_DOMAIN`: the subdomain only, for example `acme` for `acme.freshdesk.com`.
    - `FRESHDESK_API_KEY`: the agent API key.
    - `SLACK_WEBHOOK`: Slack incoming webhook used for every alert branch and the flow-failure alert.

    In Kestra OSS, secrets are supplied as environment variables prefixed `SECRET_` and base64-encoded, for example `SECRET_FRESHDESK_DOMAIN=$(echo -n 'acme' | base64)`, and read back with `{{ secret('FRESHDESK_DOMAIN') }}`. Use the Enterprise secrets backend for encryption at rest and access control.

    ## Quick start

    1. Create a free Freshdesk account and copy your API key.
    2. Add `FRESHDESK_DOMAIN`, `FRESHDESK_API_KEY` and `SLACK_WEBHOOK` as secrets.
    3. Create a test ticket with priority Urgent and a due time a few minutes away (or edit the due time on an existing ticket), wait until it passes, and run the flow manually: `status` should be `CRITICAL`.
    4. Enable `sla_check`.

    ## How to extend

    - Page through more than 100 tickets with the `page` parameter.
    - Filter by `group_id` with the Filter Tickets API to run one sentinel per support team.
    - Store the breached ticket IDs in a KV store and alert only on new breaches.
    - Add a Request that sets a tag or reassigns breached tickets, behind an approval step.

    ## Inputs

    - `lookback_days`: type INT, default `30`.

    ## Outputs

    - `status`: one of `HEALTHY`, `WARNING`, `CRITICAL`, `UNREACHABLE`.
    - Example path: `{{ fromJson(outputs.summarize_sla.value).oldest_breach }}` for the oldest breached ticket.

    ## Links

    - [Freshdesk API v2: List All Tickets](https://developers.freshdesk.com/api/#list_all_tickets)
    - [Freshdesk API authentication](https://developers.freshdesk.com/api/#authentication)
    - [Kestra HTTP Request task](https://kestra.io/plugins/core/tasks/http/io.kestra.plugin.core.http.request)
    - [Kestra Slack plugin](https://kestra.io/plugins/plugin-slack)

    ## Pitfalls

    - `per_page` is capped at 100. Tickets are sorted by `due_by` ascending, so the most overdue ones come first, but a queue with more than 100 recently updated tickets needs paging to see all of them.
    - An open ticket that has not been updated within `lookback_days` is not returned; keep the window at least as long as your longest SLA.
    - `due_by` is compared with the current time in UTC; Freshdesk returns timestamps in UTC, so time zones do not shift the result.
    - This flow only reads; it never replies to, updates or closes a ticket.
  tags:
    - Business
  subTags:
    - Monitoring & Alerting
  ee: false
  demo: false
