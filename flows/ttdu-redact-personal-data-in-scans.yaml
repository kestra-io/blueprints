id: ttdu-redact-personal-data-in-scans
namespace: company.team

variables:
  ttdu_url: http://host.docker.internal:8790

tasks:
  - id: fetch_inbox
    type: io.kestra.plugin.core.namespace.DownloadFiles
    description: Collect every scan or PDF dropped into the namespace folder inbox/.
    namespace: "{{ flow.namespace }}"
    files:
      - "inbox/**"

  - id: has_files
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.fetch_inbox.files | length > 0 }}"
    then:
      - id: each_file
        type: io.kestra.plugin.core.flow.Loop
        values: "{{ outputs.fetch_inbox.files | keys }}"
        concurrencyLimit: 1
        tasks:
          - id: redact
            type: io.kestra.plugin.scripts.python.Script
            description: Send one file to the TTDU office runner (flow C) and keep the redacted copy.
            taskRunner:
              type: io.kestra.plugin.core.runner.Process
            inputFiles:
              source.bin: "{{ outputs.fetch_inbox.files[item.value] }}"
            env:
              TTDU_URL: "{{ vars.ttdu_url }}"
              TTDU_API_KEY: "{{ secret('TTDU_API_KEY') }}"
              FILE_NAME: "{{ item.value | split('/') | last }}"
            outputFiles:
              - "outbox/*"
            script: |
              import base64, hashlib, json, os, urllib.request, uuid

              # Flow C of TTDU: find resident registration, phone and account numbers (text layer and OCR),
              # truly remove them from PDFs, cover them in images, strip metadata.
              FLOW = {"schema": "ttdu.flow/v1", "steps": [
                  {"tool": "redact.pdf", "scope": "each", "onlyKind": "pdf", "op": "redact", "options": {"terms": "@pii:rrn,phone,account", "term_box": "chars"}},
                  {"tool": "redact.image", "scope": "each", "onlyKind": "image", "op": "redact", "options": {"regions": "@pii:rrn,phone,account"}},
                  {"tool": "meta.strip", "scope": "each", "op": "strip_meta", "options": {}}]}

              name = os.environ["FILE_NAME"]
              data = open("source.bin", "rb").read()
              b = "----ttdu" + uuid.uuid4().hex
              body = b"".join([
                  ("--%s\r\nContent-Disposition: form-data; name=\"flow\"\r\n\r\n" % b).encode() + json.dumps(FLOW).encode() + b"\r\n",
                  ("--%s\r\nContent-Disposition: form-data; name=\"files\"; filename=\"%s\"\r\n"
                   "Content-Type: application/octet-stream\r\n\r\n" % (b, name)).encode("utf-8") + data + b"\r\n",
                  ("--%s--\r\n" % b).encode()])
              req = urllib.request.Request(os.environ["TTDU_URL"].rstrip("/") + "/v1/flows/run", data=body, method="POST",
                                           headers={"Content-Type": "multipart/form-data; boundary=" + b, "X-API-Key": os.environ["TTDU_API_KEY"]})
              with urllib.request.urlopen(req, timeout=600) as r:
                  result = json.loads(r.read().decode("utf-8"))
              if not result.get("ok"):
                  raise SystemExit("TTDU run failed: %s" % json.dumps(result)[:500])
              os.makedirs("outbox", exist_ok=True)
              for o in result["outputs"]:
                  blob = base64.b64decode(o["base64"])
                  assert hashlib.sha256(blob).hexdigest() == o["sha256"].lower(), "checksum mismatch"
                  open(os.path.join("outbox", o["name"]), "wb").write(blob)
                  print("redacted", name, "->", o["name"], o["size"], "bytes")

          - id: keep_result
            type: io.kestra.plugin.core.namespace.UploadFiles
            description: Store the redacted copy in the namespace folder outbox/ (the original stays in inbox/).
            namespace: "{{ flow.namespace }}"
            filesMap: "{{ outputs.redact.outputFiles }}"
            destination: "/"
    else:
      - id: nothing_to_do
        type: io.kestra.plugin.core.log.Log
        message: inbox/ is empty, nothing to redact.

triggers:
  - id: every_hour
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 * * * *"

extend:
  title: Redact Korean Personal Data in Scans and PDFs on Your Own Machine
  metaTitle: Redact Personal Data in Scans and PDFs Locally with TTDU | Kestra
  shortDescription: Every hour, send new scans and PDFs from a namespace folder to the TTDU office runner on the same network, which removes resident registration, phone and account numbers, and keep the redacted copies.
  metaDescription: Hourly Kestra flow that redacts Korean ID, phone and account numbers in scans and PDFs with a TTDU runner on your own network, then stores the copies.
  description: |
    Redact personal data in documents without a cloud service: files in the namespace folder `inbox/` go one by one to
    a TTDU office runner (`ttdu serve`) on your own network, which finds Korean resident registration, phone and bank
    account numbers (text layer and OCR), removes them, strips metadata and re-reads the result before it lands in `outbox/`.

    ## How it works

    1. The **Schedule** trigger starts the flow every hour.
    2. `fetch_inbox` collects the files under `inbox/` in the flow's namespace.
    3. `has_files` (**If**) skips the run when the folder is empty.
    4. `each_file` (**Loop**, one file at a time) runs `redact`, a Python script that posts the file to the runner's
       `/v1/flows/run` endpoint with TTDU flow C and verifies the SHA-256 of every returned file.
    5. `keep_result` uploads the redacted copy to `outbox/` with **UploadFiles**; the original stays in `inbox/`.

    ## What you get

    - Redacted PDFs (text removed, not just painted over) and images, with metadata stripped.
    - A checksum check on every returned file and a failed task when the runner reports an error.
    - Files only travel between Kestra and the runner you point it at; no third-party service is called.

    ## Who it's for

    - Operations and records teams in offices that handle Korean ID numbers, phone numbers and bank details.
    - Platform teams who already run Kestra on premises and need document redaction in the same network.

    ## Why orchestrate this with Kestra

    - Declarative schedule, retries and per-file task runs instead of a cron script on a desktop.
    - The API key stays in Kestra secrets and is masked in logs; every file has its own task run and logs.

    ## Prerequisites

    - Kestra 2.x with the Python script plugin and a Python 3 interpreter for the Process task runner.
    - A TTDU office runner reachable from Kestra. When Kestra runs in Docker Desktop on the same PC, start the runner
      with `--allow-docker` and keep `ttdu_url` as `http://host.docker.internal:8790`.

    ### Secrets

    - `TTDU_API_KEY`: the runner's API key (contents of `local-api-key.txt`), required.

    ## Quick start

    1. Add the `TTDU_API_KEY` secret and adjust the `ttdu_url` variable.
    2. Upload one test scan or PDF to the namespace folder `inbox/`.
    3. Click **Execute**, check the logs of `redact`, and open the file in `outbox/`.
    4. Keep the hourly Schedule trigger enabled.

    ## How to extend

    - Use other TTDU flows (receipt photos to one PDF, HWP/HWPX to PDF) by changing `FLOW` in the script.
    - Move processed originals to an archive folder with DeleteFiles after the loop.

    ## Links

    - [Loop task](https://kestra.io/plugins/core/flow/io.kestra.plugin.core.flow.loop)
    - [Python Script task](https://kestra.io/plugins/plugin-script-python/io.kestra.plugin.scripts.python.script)
    - [Namespace UploadFiles task](https://kestra.io/plugins/core/namespace/io.kestra.plugin.core.namespace.uploadfiles)
    - [TTDU integrations (runner API, MIT client code)](https://github.com/etacbae6768-a11y/ttdu-integrations)
  tags:
    - Business
  subTags:
    - Policy & Compliance
  ee: false
  demo: false
