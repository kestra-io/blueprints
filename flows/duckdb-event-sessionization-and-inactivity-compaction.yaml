id: duckdb-event-sessionization-and-inactivity-compaction
namespace: company.lakehouse

description: |
  Ingests high-throughput event and clickstream telemetry streams, computes dynamic sessionization
  using DuckDB window functions, stitches cross-run active sessions, isolates inactivity timeouts,
  and gates publication on row-conservation and temporal-integrity checks.

inputs:
  - id: events_stream_uri
    type: URI
    displayName: Incoming Events Parquet URI
    description: Storage URI to incoming raw event stream Parquet file (kestra://... or s3://...). Leave empty to execute the self-contained demo stream.
    required: false

  - id: active_sessions_uri
    type: URI
    displayName: Active Session State Parquet URI
    description: Storage URI to active unsealed session state from previous runs. Leave empty to use the demo active session state.
    required: false

  - id: inactivity_timeout_minutes
    type: INT
    displayName: Inactivity Timeout (Minutes)
    description: Idle duration threshold between consecutive events defining a new session boundary.
    defaults: 30

  - id: inject_temporal_anomaly
    type: BOOL
    displayName: Inject Invariant Anomaly
    description: When true and input URIs are empty, deliberately injects an event with a corrupted user ID and temporal paradox to verify that the Sessionization Gate trips the circuit breaker and prevents unverified promotion.
    defaults: false

tasks:
  - id: stage_demo_events
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: Generates self-contained demo Parquet files (active sessions state and raw incoming events) when custom input URIs are not provided.
    runIf: "{{ inputs.events_stream_uri is empty or inputs.active_sessions_uri is empty }}"
    outputFiles:
      - "*.parquet"
    sql: |
      -- 1. Pre-existing active session state from previous execution run (Run 1)
      CREATE OR REPLACE TEMP TABLE active_sessions AS
      SELECT * FROM (
        VALUES 
          -- Alice: Session started at 10:00, last seen at 10:10 (10 mins idle, active candidate)
          ('sess-alice-1', 'usr_alice', TIMESTAMP '2026-10-02 10:00:00', TIMESTAMP '2026-10-02 10:10:00', 1, true, '/home', '/home', false, TIMESTAMP '2026-10-02 10:10:00'),
          -- Bob: Session started at 09:55, last seen at 10:05 (20 mins idle)
          ('sess-bob-1', 'usr_bob', TIMESTAMP '2026-10-02 09:55:00', TIMESTAMP '2026-10-02 10:05:00', 2, false, '/landing', '/pricing', false, TIMESTAMP '2026-10-02 10:05:00'),
          -- Charlie: Historical session last seen at 09:15 (>30 mins idle relative to 10:25 watermark)
          ('sess-charlie-1', 'usr_charlie', TIMESTAMP '2026-10-02 09:00:00', TIMESTAMP '2026-10-02 09:15:00', 3, false, '/blog/1', '/blog/2', false, TIMESTAMP '2026-10-02 09:15:00'),
          -- Eva: Historical session last seen at 09:00 (no new events in this batch, candidate for sealing)
          ('sess-eva-1', 'usr_eva', TIMESTAMP '2026-10-02 08:45:00', TIMESTAMP '2026-10-02 09:00:00', 1, true, '/docs', '/docs', false, TIMESTAMP '2026-10-02 09:00:00')
      ) AS s(session_id, user_id, session_start, session_end, event_count, is_bounce, entry_page, exit_page, has_conversion, last_event_timestamp);

      COPY active_sessions TO '{{ workingDir }}/active_sessions.parquet' (FORMAT PARQUET);

      -- 2. Incoming raw clickstream event batch (Run 2)
      CREATE OR REPLACE TEMP TABLE incoming_events AS
      SELECT * FROM (
        VALUES 
          -- Alice: Extension event at 10:18 (8 min gap <= 30m) -> stitches sess-alice-1, flips is_bounce to false
          ('evt-a-1', 'usr_alice', TIMESTAMP '2026-10-02 10:18:00', 'PAGEVIEW', '/products'),
          -- Alice: Second event at 10:24 -> purchase conversion
          ('evt-a-2', 'usr_alice', TIMESTAMP '2026-10-02 10:24:00', 'PURCHASE', '/checkout/success'),

          -- Bob: Late out-of-order event at 10:02 (between 09:55 and 10:05) -> infills into active session
          ('evt-b-late', 'usr_bob', TIMESTAMP '2026-10-02 10:02:00', 'PURCHASE', '/checkout/success'),

          -- Charlie: Event at 10:20 (65 min gap > 30m) -> seals sess-charlie-1, spawns new session
          ('evt-c-1', 'usr_charlie', TIMESTAMP '2026-10-02 10:20:00', 'PAGEVIEW', '/pricing'),

          -- David: Brand-new user with 2 events
          ('evt-d-1', 'usr_david', TIMESTAMP '2026-10-02 10:12:00', 'PAGEVIEW', '/home'),
          ('evt-d-2', 'usr_david', TIMESTAMP '2026-10-02 10:25:00', 'PAGEVIEW', '/features'),

          -- Network duplicate replay of evt-a-1 (identical event ID)
          ('evt-a-1', 'usr_alice', TIMESTAMP '2026-10-02 10:18:00', 'PAGEVIEW', '/products')

          {% if inputs.inject_temporal_anomaly == true or inputs.inject_temporal_anomaly == 'true' %}
          -- Deliberately inject unmapped null user ID to trip the circuit breaker
          ,('evt-corrupt-anon', NULL, TIMESTAMP '2026-10-02 10:20:00', 'PAGEVIEW', '/error')
          {% endif %}
      ) AS e(event_id, user_id, event_timestamp, event_type, page_path);

      COPY incoming_events TO '{{ workingDir }}/incoming_events.parquet' (FORMAT PARQUET);

  - id: sessionize_and_compact_stream
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: Executes transport deduplication, in-batch gap detection, cross-run session stitching, inactivity sealing, and multi-invariant reconciliation scoring.
    fetchType: FETCH
    inputFiles:
      incoming_events.parquet: "{{ inputs.events_stream_uri ? inputs.events_stream_uri : outputs.stage_demo_events.outputFiles['incoming_events.parquet'] }}"
      active_sessions.parquet: "{{ inputs.active_sessions_uri ? inputs.active_sessions_uri : outputs.stage_demo_events.outputFiles['active_sessions.parquet'] }}"
    outputFiles:
      - "*.parquet"
    sql: |
      -- 1. Mount incoming event stream and prior active session state
      CREATE OR REPLACE TEMP TABLE raw_incoming AS
      SELECT * FROM read_parquet('{{ workingDir }}/incoming_events.parquet');

      CREATE OR REPLACE TEMP TABLE active_sessions AS
      SELECT * FROM read_parquet('{{ workingDir }}/active_sessions.parquet');

      -- 2. Tier 1 Deduplication (Transport Layer): Drop duplicate network replays by event_id
      CREATE OR REPLACE TEMP TABLE deduped_incoming AS
      SELECT * EXCLUDE (rn)
      FROM (
        SELECT *,
          ROW_NUMBER() OVER (PARTITION BY event_id ORDER BY event_timestamp ASC) AS rn
        FROM raw_incoming
      )
      WHERE rn = 1;

      -- 3. Tier 2: Inactivity Gap Detection within the incoming batch
      CREATE OR REPLACE TEMP TABLE batch_sessions AS
      WITH event_gaps AS (
        SELECT 
          event_id,
          user_id,
          event_timestamp,
          event_type,
          page_path,
          LAG(event_timestamp) OVER (PARTITION BY user_id ORDER BY event_timestamp ASC) AS prev_ts,
          CASE 
            WHEN prev_ts IS NULL THEN 1
            WHEN date_diff('second', prev_ts, event_timestamp) > ({{ inputs.inactivity_timeout_minutes }} * 60) THEN 1
            ELSE 0 
          END AS is_new_session_in_batch
        FROM deduped_incoming
      )
      SELECT 
        event_id,
        user_id,
        event_timestamp,
        event_type,
        page_path,
        SUM(is_new_session_in_batch) OVER (PARTITION BY user_id ORDER BY event_timestamp ASC ROWS UNBOUNDED PRECEDING) AS batch_session_idx
      FROM event_gaps;

      -- Rollup metrics per in-batch user session
      CREATE OR REPLACE TEMP TABLE batch_session_summary AS
      SELECT 
        user_id,
        batch_session_idx,
        MIN(event_timestamp) AS b_start,
        MAX(event_timestamp) AS b_end,
        COUNT(*) AS b_events,
        FIRST(page_path ORDER BY event_timestamp ASC) AS b_entry_page,
        LAST(page_path ORDER BY event_timestamp ASC) AS b_exit_page,
        BOOL_OR(event_type = 'PURCHASE') AS b_conversion
      FROM batch_sessions
      GROUP BY user_id, batch_session_idx;

      -- 4. Tier 3 & 4: Active Session Stitching & Extension across workflow runs
      CREATE OR REPLACE TEMP TABLE session_reconciliation AS
      WITH stitched_candidates AS (
        SELECT 
          b.user_id,
          b.batch_session_idx,
          b.b_start,
          b.b_end,
          b.b_events,
          b.b_entry_page,
          b.b_exit_page,
          b.b_conversion,
          a.session_id AS matched_active_session_id,
          a.session_start AS a_start,
          a.session_end AS a_end,
          a.event_count AS a_events,
          a.entry_page AS a_entry_page,
          a.exit_page AS a_exit_page,
          a.has_conversion AS a_conversion,
          a.last_event_timestamp AS a_last_ts,
          CASE 
            WHEN a.session_id IS NOT NULL 
                 AND b.batch_session_idx = 1
                 AND b.b_start <= a.session_end + INTERVAL '{{ inputs.inactivity_timeout_minutes }} MINUTES'
                 AND b.b_end >= a.session_start - INTERVAL '{{ inputs.inactivity_timeout_minutes }} MINUTES'
            THEN 1 
            ELSE 0 
          END AS is_stitched
        FROM batch_session_summary b
        LEFT JOIN active_sessions a ON b.user_id = a.user_id
      )
      SELECT * FROM stitched_candidates;

      -- Unify Stitched Active Sessions, Untouched Active Sessions, and Newly Spawned Sessions
      CREATE OR REPLACE TEMP TABLE all_reconciled_sessions AS
      -- Part A: Stitched active sessions extended with batch events
      SELECT 
        matched_active_session_id AS session_id,
        user_id,
        LEAST(a_start, b_start) AS session_start,
        GREATEST(a_end, b_end) AS session_end,
        a_events + b_events AS event_count,
        CASE WHEN b_start < a_start THEN b_entry_page ELSE a_entry_page END AS entry_page,
        CASE WHEN b_end >= a_end THEN b_exit_page ELSE a_exit_page END AS exit_page,
        (a_conversion OR b_conversion) AS has_conversion,
        GREATEST(a_last_ts, b_end) AS last_event_timestamp,
        'STITCHED' AS lifecycle_status
      FROM session_reconciliation
      WHERE is_stitched = 1

      UNION ALL

      -- Part B: Prior active sessions untouched by incoming events in this batch
      SELECT 
        a.session_id,
        a.user_id,
        a.session_start,
        a.session_end,
        a.event_count,
        a.entry_page,
        a.exit_page,
        a.has_conversion,
        a.last_event_timestamp,
        'UNTOUCHED_ACTIVE' AS lifecycle_status
      FROM active_sessions a
      WHERE a.session_id NOT IN (
        SELECT matched_active_session_id 
        FROM session_reconciliation 
        WHERE is_stitched = 1
      )

      UNION ALL

      -- Part C: Newly spawned sessions in this batch
      SELECT 
        'sess-' || SUBSTRING(MD5(COALESCE(user_id, 'null') || '_' || strftime(b_start, '%Y%m%d%H%M%S')), 1, 12) AS session_id,
        user_id,
        b_start AS session_start,
        b_end AS session_end,
        b_events AS event_count,
        b_entry_page AS entry_page,
        b_exit_page AS exit_page,
        b_conversion AS has_conversion,
        b_end AS last_event_timestamp,
        'NEW_SPAWN' AS lifecycle_status
      FROM session_reconciliation
      WHERE is_stitched = 0;

      -- 5. Tier 5: Compaction & Sealing Partitioning
      CREATE OR REPLACE TEMP TABLE watermark_ref AS
      SELECT COALESCE(MAX(event_timestamp), CURRENT_TIMESTAMP) AS watermark_ts
      FROM deduped_incoming;

      CREATE OR REPLACE TEMP TABLE finalized_sessions AS
      SELECT 
        s.session_id,
        s.user_id,
        s.session_start,
        s.session_end,
        date_diff('second', s.session_start, s.session_end) AS duration_seconds,
        s.event_count,
        CASE WHEN s.event_count = 1 THEN true ELSE false END AS is_bounce,
        s.entry_page,
        s.exit_page,
        s.has_conversion,
        s.last_event_timestamp,
        s.lifecycle_status,
        CASE 
          WHEN date_diff('second', s.last_event_timestamp, w.watermark_ts) > ({{ inputs.inactivity_timeout_minutes }} * 60)
          THEN 'SEALED'
          ELSE 'ACTIVE'
        END AS partition_state
      FROM all_reconciled_sessions s
      CROSS JOIN watermark_ref w;

      -- Persist staging artifacts in task working directory
      COPY finalized_sessions TO '{{ workingDir }}/staging_sessions_mart.parquet' (FORMAT PARQUET);
      COPY (SELECT * FROM finalized_sessions WHERE partition_state = 'ACTIVE') TO '{{ workingDir }}/staging_active_buffer.parquet' (FORMAT PARQUET);

      -- 6. Tier 6: Multi-Invariant Reconciliation Scorecard (Single-Row Projection)
      SELECT 
        (SELECT COUNT(*) FROM raw_incoming) AS raw_incoming_events,
        (SELECT COUNT(*) FROM raw_incoming) - (SELECT COUNT(*) FROM deduped_incoming) AS duplicate_replays_dropped,
        (SELECT COUNT(*) FROM deduped_incoming) AS clean_incoming_events,
        (SELECT COALESCE(SUM(event_count), 0) FROM active_sessions) AS initial_active_events,
        (SELECT COUNT(*) FROM finalized_sessions) AS total_reconciled_sessions,
        (SELECT COUNT(*) FROM finalized_sessions WHERE lifecycle_status = 'STITCHED') AS stitched_sessions_count,
        (SELECT COUNT(*) FROM finalized_sessions WHERE lifecycle_status = 'NEW_SPAWN') AS new_sessions_spawned,
        (SELECT COUNT(*) FROM finalized_sessions WHERE partition_state = 'SEALED') AS sealed_sessions_count,
        (SELECT COUNT(*) FROM finalized_sessions WHERE partition_state = 'ACTIVE') AS active_sessions_retained,
        (SELECT COALESCE(SUM(event_count), 0) FROM finalized_sessions) AS final_total_events,
        -- Conservation & Integrity Invariants
        (SELECT COALESCE(SUM(event_count), 0) FROM finalized_sessions) - 
          ((SELECT COALESCE(SUM(event_count), 0) FROM active_sessions) + (SELECT COUNT(*) FROM deduped_incoming)) AS row_conservation_delta,
        (SELECT COUNT(*) FROM finalized_sessions WHERE session_end < session_start OR duration_seconds < 0) AS temporal_violations,
        (SELECT COUNT(*) FROM finalized_sessions WHERE (event_count = 1 AND is_bounce = false) OR (event_count > 1 AND is_bounce = true)) AS bounce_violations,
        (SELECT COUNT(*) FROM finalized_sessions WHERE user_id IS NULL) AS unmapped_users,
        -- Derived Analytical Scorecard KPIs
        (SELECT ROUND(AVG(duration_seconds), 1) FROM finalized_sessions) AS avg_duration_seconds,
        (SELECT ROUND(100.0 * COUNT(CASE WHEN is_bounce = true THEN 1 END) / COUNT(*), 2) FROM finalized_sessions) AS bounce_rate_pct,
        (SELECT ROUND(100.0 * COUNT(CASE WHEN has_conversion = true THEN 1 END) / COUNT(*), 2) FROM finalized_sessions) AS conversion_rate_pct,
        -- Circuit Breaker Invariant Gate Verdict
        CASE 
          WHEN ((SELECT COALESCE(SUM(event_count), 0) FROM finalized_sessions) - 
               ((SELECT COALESCE(SUM(event_count), 0) FROM active_sessions) + (SELECT COUNT(*) FROM deduped_incoming))) = 0
           AND (SELECT COUNT(*) FROM finalized_sessions WHERE session_end < session_start OR duration_seconds < 0) = 0
           AND (SELECT COUNT(*) FROM finalized_sessions WHERE (event_count = 1 AND is_bounce = false) OR (event_count > 1 AND is_bounce = true)) = 0
           AND (SELECT COUNT(*) FROM finalized_sessions WHERE user_id IS NULL) = 0
          THEN true
          ELSE false
        END AS invariant_passed;

  - id: extract_session_metrics
    type: io.kestra.plugin.core.output.OutputValues
    description: Extracts the reconciliation scorecard metrics as strongly-typed flow outputs.
    values: "{{ outputs.sessionize_and_compact_stream.outputs[0].rows[0] }}"

  - id: log_session_scorecard
    type: io.kestra.plugin.core.log.Log
    description: Outputs the itemized event sessionization and compaction scorecard to execution logs.
    message: |
      ==============================================================
      EVENT SESSIONIZATION & INACTIVITY COMPACTION SCORECARD
      ==============================================================
      Raw Incoming Events:         {{ outputs.extract_session_metrics.values.raw_incoming_events }}
      Duplicate Replays Dropped:   {{ outputs.extract_session_metrics.values.duplicate_replays_dropped }}
      Clean Incoming Events:       {{ outputs.extract_session_metrics.values.clean_incoming_events }}
      Initial Active Events:       {{ outputs.extract_session_metrics.values.initial_active_events }}
      Final Total Events:          {{ outputs.extract_session_metrics.values.final_total_events }}
      Row Conservation Delta:      {{ outputs.extract_session_metrics.values.row_conservation_delta }}
      Total Reconciled Sessions:   {{ outputs.extract_session_metrics.values.total_reconciled_sessions }}
      Stitched Active Sessions:    {{ outputs.extract_session_metrics.values.stitched_sessions_count }}
      New Sessions Spawned:        {{ outputs.extract_session_metrics.values.new_sessions_spawned }}
      Sealed Sessions (Compacted): {{ outputs.extract_session_metrics.values.sealed_sessions_count }}
      Active Sessions Retained:    {{ outputs.extract_session_metrics.values.active_sessions_retained }}
      Average Session Duration:    {{ outputs.extract_session_metrics.values.avg_duration_seconds }}s
      Bounce Rate:                 {{ outputs.extract_session_metrics.values.bounce_rate_pct }}%
      Conversion Rate:             {{ outputs.extract_session_metrics.values.conversion_rate_pct }}%
      Temporal Violations:         {{ outputs.extract_session_metrics.values.temporal_violations }}
      Bounce Logic Violations:     {{ outputs.extract_session_metrics.values.bounce_violations }}
      Unmapped Users Detected:     {{ outputs.extract_session_metrics.values.unmapped_users }}
      Sessionization Invariant:    {{ outputs.extract_session_metrics.values.invariant_passed ? '[PASS]' : '[FAIL]' }}
      ==============================================================

  - id: sessionization_gate
    type: io.kestra.plugin.core.flow.If
    description: Circuit breaker that publishes verified session marts on pass, or halts execution on invariant violation.
    condition: "{{ outputs.extract_session_metrics.values.invariant_passed }}"
    then:
      - id: publish_sessions_mart
        type: io.kestra.plugin.core.namespace.UploadFiles
        description: Publishes the unified sessionized Parquet mart to Namespace Files for downstream BI and analytical consumption.
        filesMap:
          lakehouse/sessions_mart.parquet: "{{ outputs.sessionize_and_compact_stream.outputFiles['staging_sessions_mart.parquet'] }}"
        namespace: "{{ flow.namespace }}"

      - id: persist_active_buffer
        type: io.kestra.plugin.core.namespace.UploadFiles
        description: Persists the active session buffer in Namespace Files for cross-run state hydration in subsequent runs.
        filesMap:
          lakehouse/state/active_sessions.parquet: "{{ outputs.sessionize_and_compact_stream.outputFiles['staging_active_buffer.parquet'] }}"
        namespace: "{{ flow.namespace }}"

      - id: record_session_manifest
        type: io.kestra.plugin.core.kv.Set
        description: Records production table metadata, session counts, and audit summary in the Kestra KV store.
        key: session_compaction_manifest
        value: |
          {
            "table": "sessions_mart",
            "execution_id": "{{ execution.id }}",
            "timestamp": "{{ execution.startDate }}",
            "total_sessions": {{ outputs.extract_session_metrics.values.total_reconciled_sessions }},
            "sealed_sessions": {{ outputs.extract_session_metrics.values.sealed_sessions_count }},
            "active_sessions": {{ outputs.extract_session_metrics.values.active_sessions_retained }},
            "bounce_rate_pct": {{ outputs.extract_session_metrics.values.bounce_rate_pct }},
            "conversion_rate_pct": {{ outputs.extract_session_metrics.values.conversion_rate_pct }},
            "storage_path": "lakehouse/sessions_mart.parquet"
          }
        kvType: JSON
    else:
      - id: halt_corrupt_sessionization
        type: io.kestra.plugin.core.execution.Fail
        errorMessage: "Event Sessionization Invariant Violated! Delta: {{ outputs.extract_session_metrics.values.row_conservation_delta }}, Temporal Violations: {{ outputs.extract_session_metrics.values.temporal_violations }}, Bounce Violations: {{ outputs.extract_session_metrics.values.bounce_violations }}, Unmapped Users: {{ outputs.extract_session_metrics.values.unmapped_users }}."

triggers:
  - id: hourly_compaction_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 * * * *"
    disabled: true

extend:
  title: Dynamic Event Sessionization and Inactivity Compaction with DuckDB
  metaTitle: Event Sessionization & Inactivity Compaction | Kestra Blueprint
  shortDescription: Ingest event streams, stitch active sessions across runs, derive bounce attribution, and compact lakehouse marts in DuckDB with quality gates.
  metaDescription: Ingest event streams, stitch active sessions across runs, derive bounce attribution, and compact lakehouse marts in DuckDB with quality invariant gates.
  description: |
    Clickstream and event streams arrive with out-of-order timestamps, duplicate retries, and variable browsing durations. Fixed tumbling windows arbitrarily split user visits across batch boundaries, distorting session durations, bounce rates, and conversion funnels. Traditional SQL approaches rely on expensive quadratic self-joins, while distributed streaming frameworks require dedicated multi-node clusters.

    This blueprint implements an in-engine event sessionization and stateful compaction pipeline using embedded DuckDB. It ingests micro-batch event streams, hydrates active session state across runs, resolves inactivity timeouts, stitches continuous visits, attributes bounces and conversions, and gates publication on row-conservation and temporal-integrity checks before writing to Namespace Files and the KV store.

    ## How it works

    1. **Demo Staging**: Generates demo Parquet files with active session state and incoming events featuring session extensions, late mobile arrivals, duplicate replays, and idle timeouts when input URIs are empty.
    2. **Multi-Tier Sessionization**: Executes window functions in DuckDB:
       - *Transport Dedup*: Drops duplicate replays by event ID, keeping the earliest arrival.
       - *Inactivity Gaps*: Uses LAG(event_timestamp) partitioned by user to detect idle gaps exceeding the timeout.
       - *Session Stitching*: Matches events against active sessions. If within the timeout, the session ID is preserved, session_end extends, and is_bounce flips to false.
       - *Late Infill*: Integrates out-of-order packets arriving within an existing session without altering boundaries.
       - *Inactivity Sealing*: Seals sessions idle longer than the timeout for permanent compaction, retaining active sessions for the next run.
    3. **Reconciliation Invariants**: Verifies row conservation (initial active + clean incoming == final total events), temporal monotonicity (session_end >= session_start), and bounce attribution consistency.
    4. **Audit Reporting**: extract_session_metrics exposes scorecard metrics to flow outputs, and log_session_scorecard outputs the audit table.
    5. **Gating & Publishing**: sessionization_gate publishes the mart to Namespace Files, updates the active state buffer, and records metadata in the KV store on pass. On failure, halt_corrupt_sessionization aborts execution; staging files remain in task outputs for inspection.

    ## What you get

    - Stateful event sessionization without 24/7 Spark or Flink cluster costs.
    - Cross-run session stitching preventing artificial boundary fragmentation.
    - Out-of-order event infill and transport-level network replay deduplication.
    - Automated bounce rate classification and purchase conversion tracking.
    - Row-conservation and temporal-monotonicity reconciliation gates.
    - Mart publishing to Namespace Files paired with KV store metadata discovery.

    ## Who it's for

    - Analytics engineers transforming raw clickstream into sessionized data marts.
    - Growth and marketing teams tracking conversion attribution and user journeys.
    - Data engineers replacing heavy streaming infrastructure with micro-batch compaction.

    ## Why orchestrate this with Kestra

    - **Embedded Compute**: Runs DuckDB directly in the Kestra worker with zero external database dependencies.
    - **Stateful Hydration**: Seamlessly hydrates active session state between runs using Kestra Namespace Files.
    - **Circuit Breaker Gates**: Flow controls (If and Fail) isolate anomalies and halt execution before bad metrics reach dashboards.
    - **Catalog White Space**: Introduces event-time sessionization to the blueprint catalog as an efficient lakehouse pattern.

    ## Prerequisites

    - Kestra instance with the DuckDB JDBC plugin (plugin-jdbc-duckdb).

    ### Secrets

    - None required.

    ## Quick start

    1. **Run Clean Sessionization**: Execute with default inputs to generate demo data, stitch sessions across run boundaries, upload lakehouse/sessions_mart.parquet to Namespace Files, and record the KV manifest.
    2. **Verify Gate Failure**: Execute with inject_temporal_anomaly: true. The pipeline catches unmapped user records and aborts execution via Fail. The staging Parquet remains in task storage for inspection.
    3. **Custom Event Streams**: Supply storage URIs in events_stream_uri and active_sessions_uri to process custom clickstream files.
    4. **Activate the Trigger**: Enable the hourly Schedule trigger in the Triggers tab to compact incoming event batches continuously.

    ## How to extend

    - **Automated Scheduling**: Enable the hourly Schedule trigger or attach S3/GCS triggers for event-driven compaction.
    - **Warehouse Sync**: Add downstream Snowflake, BigQuery, or MotherDuck tasks to mirror the compacted mart.
    - **Alerts**: Wire Slack or PagerDuty notification tasks to sessionization_gate when invariants fail.

    ## Links

    - [Kestra DuckDB Plugin Documentation](https://kestra.io/plugins/plugin-jdbc-duckdb)
    - [DuckDB Window Functions](https://duckdb.org/docs/sql/window_functions)

  tags:
    - Data
  subTags:
    - Realtime & Streaming
    - Testing & Quality
  ee: false
  demo: false
