id: duckdb-event-sessionization-and-inactivity-compaction
namespace: company.lakehouse

description: |
  Ingests demo-scale event and clickstream telemetry streams, computes dynamic sessionization
  using DuckDB window functions, stitches cross-run active sessions, isolates inactivity timeouts,
  and gates publication on row-conservation and temporal-integrity checks.

concurrency:
  limit: 1

inputs:
  - id: events_stream_uri
    type: URI
    displayName: Incoming Events Parquet URI
    description: Storage URI to incoming raw event stream Parquet file (kestra://... or s3://...). Leave empty to execute the self-contained demo stream.
    required: false

  - id: active_sessions_uri
    type: URI
    displayName: Active Session State Parquet URI
    description: Optional override URI to active unsealed session state. If empty, the pipeline automatically hydrates prior state from Namespace Files (/lakehouse/state/active_sessions.parquet).
    required: false

  - id: historical_mart_uri
    type: URI
    displayName: Historical Sessions Mart Parquet URI
    description: Optional override URI to cumulative historical sessions mart. If empty, the pipeline automatically hydrates prior mart from Namespace Files (/lakehouse/sessions_mart.parquet).
    required: false

  - id: inactivity_timeout_minutes
    type: INT
    displayName: Inactivity Timeout (Minutes)
    description: Idle duration threshold between consecutive events defining a new session boundary.
    defaults: 30
    min: 1

  - id: allowed_lateness_hours
    type: INT
    displayName: Allowed Lateness (Hours)
    description: Maximum historical window for late-arriving events. Events older than this threshold or colliding with sealed sessions are safely discarded.
    defaults: 2
    min: 1

  - id: max_discard_ratio_pct
    type: INT
    displayName: Max Discard Ratio (%)
    description: Maximum allowable percentage of incoming events discarded for lateness before tripping the quality gate (1-100%).
    defaults: 50
    min: 1
    max: 100

  - id: simulate_empty_batch
    type: BOOL
    displayName: Simulate Empty Event Batch
    description: When true, generates an empty incoming event stream in demo mode to verify that the active session buffer does not prematurely seal during idle windows.
    defaults: false

  - id: inject_corrupt_event
    type: BOOL
    displayName: Inject Corrupt Event Anomaly
    description: When true, deliberately injects unmapped null user IDs and event ID collisions to trip the quality gate and halt execution.
    defaults: false

tasks:
  - id: hydrate_historical_mart
    type: io.kestra.plugin.core.namespace.DownloadFiles
    description: Hydrates cumulative historical session mart from Namespace Files persisted by prior workflow runs.
    namespace: "{{ flow.namespace }}"
    files:
      - "lakehouse/sessions_mart.parquet"

  - id: hydrate_active_buffer
    type: io.kestra.plugin.core.namespace.DownloadFiles
    description: Hydrates active unsealed session state from Namespace Files persisted by prior workflow runs.
    namespace: "{{ flow.namespace }}"
    files:
      - "lakehouse/state/active_sessions.parquet"

  - id: stage_demo_events
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: Generates self-contained demo Parquet files when custom input URIs are not provided, dynamically adapting between bootstrap and incremental cross-run streams.
    runIf: "{{ inputs.events_stream_uri is empty and inputs.active_sessions_uri is empty and inputs.historical_mart_uri is empty }}"
    outputFiles:
      - "*.parquet"
    sql: |
      {% if outputs.hydrate_historical_mart.files is empty %}
      -- Empty prior historical mart for bootstrap
      CREATE OR REPLACE TEMP TABLE existing_mart (
        session_id VARCHAR,
        user_id VARCHAR,
        session_start TIMESTAMP,
        session_end TIMESTAMP,
        duration_seconds BIGINT,
        event_count BIGINT,
        is_bounce BOOLEAN,
        entry_page VARCHAR,
        exit_page VARCHAR,
        has_conversion BOOLEAN,
        last_event_timestamp TIMESTAMP,
        lifecycle_status VARCHAR,
        partition_state VARCHAR,
        processed_event_ids VARCHAR[]
      );
      COPY (SELECT * FROM existing_mart WHERE 1=0) TO '{{ workingDir }}/existing_sessions_mart.parquet' (FORMAT PARQUET);
      {% endif %}

      {% if outputs.hydrate_active_buffer.files is empty %}
      -- 1. Bootstrap seed active session state (Run 1: First-time initialization)
      CREATE OR REPLACE TEMP TABLE active_sessions AS
      SELECT * FROM (
        VALUES 
          ('sess-alice-1', 'usr_alice', TIMESTAMP '2026-10-02 10:00:00', TIMESTAMP '2026-10-02 10:10:00', 600, 1, true, '/home', '/home', false, TIMESTAMP '2026-10-02 10:10:00', ['evt-seed-a-1']),
          ('sess-bob-1', 'usr_bob', TIMESTAMP '2026-10-02 09:55:00', TIMESTAMP '2026-10-02 10:05:00', 600, 2, false, '/landing', '/pricing', false, TIMESTAMP '2026-10-02 10:05:00', ['evt-seed-b-1', 'evt-seed-b-2']),
          ('sess-charlie-1', 'usr_charlie', TIMESTAMP '2026-10-02 09:00:00', TIMESTAMP '2026-10-02 09:15:00', 900, 3, false, '/blog/1', '/blog/2', false, TIMESTAMP '2026-10-02 09:15:00', ['evt-seed-c-1', 'evt-seed-c-2', 'evt-seed-c-3']),
          ('sess-eva-1', 'usr_eva', TIMESTAMP '2026-10-02 08:45:00', TIMESTAMP '2026-10-02 09:00:00', 900, 1, true, '/docs', '/docs', false, TIMESTAMP '2026-10-02 09:00:00', ['evt-seed-e-1'])
      ) AS s(session_id, user_id, session_start, session_end, duration_seconds, event_count, is_bounce, entry_page, exit_page, has_conversion, last_event_timestamp, processed_event_ids);

      COPY active_sessions TO '{{ workingDir }}/active_sessions.parquet' (FORMAT PARQUET);

      -- 2. Bootstrap incoming raw event batch (Batch 1)
      CREATE OR REPLACE TEMP TABLE incoming_events AS
      SELECT * FROM (
        VALUES 
          ('evt-a-1', 'usr_alice', TIMESTAMP '2026-10-02 10:18:00', 'PAGEVIEW', '/products'),
          ('evt-a-2', 'usr_alice', TIMESTAMP '2026-10-02 10:24:00', 'PURCHASE', '/checkout/success'),
          ('evt-b-late', 'usr_bob', TIMESTAMP '2026-10-02 10:02:00', 'PURCHASE', '/checkout/success'),
          ('evt-c-1', 'usr_charlie', TIMESTAMP '2026-10-02 10:20:00', 'PAGEVIEW', '/pricing'),
          ('evt-d-1', 'usr_david', TIMESTAMP '2026-10-02 10:12:00', 'PAGEVIEW', '/home'),
          ('evt-d-2', 'usr_david', TIMESTAMP '2026-10-02 10:25:00', 'PAGEVIEW', '/features'),
          ('evt-a-1', 'usr_alice', TIMESTAMP '2026-10-02 10:18:00', 'PAGEVIEW', '/products')
          {% if inputs.inject_corrupt_event == true or inputs.inject_corrupt_event == 'true' %}
          ,('evt-corrupt-anon', NULL, TIMESTAMP '2026-10-02 10:20:00', 'PAGEVIEW', '/error'),
          ('evt-conflict-shared', 'usr_alice', TIMESTAMP '2026-10-02 10:20:00', 'PAGEVIEW', '/conflict'),
          ('evt-conflict-shared', 'usr_bob', TIMESTAMP '2026-10-02 10:20:00', 'PAGEVIEW', '/conflict'),
          (NULL, 'usr_alice', TIMESTAMP '2026-10-02 10:22:00', 'PAGEVIEW', '/null-id'),
          ('evt-null-ts', 'usr_bob', NULL, 'PAGEVIEW', '/null-ts')
          {% endif %}
      ) AS e(event_id, user_id, event_timestamp, event_type, page_path);

      COPY incoming_events TO '{{ workingDir }}/incoming_events.parquet' (FORMAT PARQUET);

      {% else %}
      {% if inputs.simulate_empty_batch == true or inputs.simulate_empty_batch == 'true' %}
      -- Empty incoming event stream for simulating idle micro-batch windows
      CREATE OR REPLACE TEMP TABLE incoming_events (
        event_id VARCHAR,
        user_id VARCHAR,
        event_timestamp TIMESTAMP,
        event_type VARCHAR,
        page_path VARCHAR
      );
      COPY (SELECT * FROM incoming_events WHERE 1=0) TO '{{ workingDir }}/incoming_events.parquet' (FORMAT PARQUET);
      {% else %}
      -- Incremental micro-batch event stream (Batch 2: stitching hydrated state from Run N)
      CREATE OR REPLACE TEMP TABLE incoming_events AS
      SELECT * FROM (
        VALUES 
          ('evt-a-3', 'usr_alice', TIMESTAMP '2026-10-02 10:35:00', 'PAGEVIEW', '/account'),
          ('evt-d-3', 'usr_david', TIMESTAMP '2026-10-02 10:48:00', 'PURCHASE', '/checkout'),
          ('evt-f-1', 'usr_frank', TIMESTAMP '2026-10-02 10:45:00', 'PAGEVIEW', '/landing'),
          ('evt-a-3', 'usr_alice', TIMESTAMP '2026-10-02 10:35:00', 'PAGEVIEW', '/account'),
          ('evt-a-1', 'usr_alice', TIMESTAMP '2026-10-02 10:18:00', 'PAGEVIEW', '/products'),
          ('evt-c-late', 'usr_charlie', TIMESTAMP '2026-10-02 09:10:00', 'PAGEVIEW', '/blog')
          {% if inputs.inject_corrupt_event == true or inputs.inject_corrupt_event == 'true' %}
          ,('evt-corrupt-anon', NULL, TIMESTAMP '2026-10-02 10:40:00', 'PAGEVIEW', '/error'),
          ('evt-conflict-shared', 'usr_alice', TIMESTAMP '2026-10-02 10:40:00', 'PAGEVIEW', '/conflict'),
          ('evt-conflict-shared', 'usr_bob', TIMESTAMP '2026-10-02 10:40:00', 'PAGEVIEW', '/conflict'),
          (NULL, 'usr_alice', TIMESTAMP '2026-10-02 10:42:00', 'PAGEVIEW', '/null-id'),
          ('evt-null-ts', 'usr_bob', NULL, 'PAGEVIEW', '/null-ts')
          {% endif %}
      ) AS e(event_id, user_id, event_timestamp, event_type, page_path);

      COPY incoming_events TO '{{ workingDir }}/incoming_events.parquet' (FORMAT PARQUET);
      {% endif %}
      {% endif %}

  - id: sessionize_and_compact_stream
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: Executes transport deduplication, in-batch gap detection, cross-run session stitching, inactivity sealing, and multi-invariant reconciliation scoring.
    fetchType: FETCH
    inputFiles:
      incoming_events.parquet: "{{ inputs.events_stream_uri ? inputs.events_stream_uri : ((outputs.stage_demo_events is defined and outputs.stage_demo_events.outputFiles is defined) ? outputs.stage_demo_events.outputFiles['incoming_events.parquet'] : null) }}"
      active_sessions.parquet: "{{ inputs.active_sessions_uri ? inputs.active_sessions_uri : ((outputs.hydrate_active_buffer is defined and outputs.hydrate_active_buffer.files is not empty) ? outputs.hydrate_active_buffer.files.values().iterator().next() : ((outputs.stage_demo_events is defined and outputs.stage_demo_events.outputFiles is defined) ? outputs.stage_demo_events.outputFiles['active_sessions.parquet'] : null)) }}"
      existing_sessions_mart.parquet: "{{ inputs.historical_mart_uri ? inputs.historical_mart_uri : ((outputs.hydrate_historical_mart is defined and outputs.hydrate_historical_mart.files is not empty) ? outputs.hydrate_historical_mart.files.values().iterator().next() : ((outputs.stage_demo_events is defined and outputs.stage_demo_events.outputFiles is defined) ? outputs.stage_demo_events.outputFiles['existing_sessions_mart.parquet'] : null)) }}"
    outputFiles:
      - "*.parquet"
    sql: |
      -- 1. Mount incoming event stream, prior active session state, and cumulative historical mart
      CREATE OR REPLACE TEMP TABLE raw_incoming AS
      SELECT * FROM read_parquet('{{ workingDir }}/incoming_events.parquet');

      CREATE OR REPLACE TEMP TABLE active_sessions (
        session_id VARCHAR,
        user_id VARCHAR,
        session_start TIMESTAMP,
        session_end TIMESTAMP,
        duration_seconds BIGINT,
        event_count BIGINT,
        is_bounce BOOLEAN,
        entry_page VARCHAR,
        exit_page VARCHAR,
        has_conversion BOOLEAN,
        last_event_timestamp TIMESTAMP,
        processed_event_ids VARCHAR[]
      );

      {% if inputs.active_sessions_uri is not empty or (outputs.hydrate_active_buffer is defined and outputs.hydrate_active_buffer.files is not empty) or (outputs.stage_demo_events is defined and outputs.stage_demo_events.outputFiles is defined) %}
      INSERT INTO active_sessions
      SELECT * FROM read_parquet('{{ workingDir }}/active_sessions.parquet');
      {% endif %}

      CREATE OR REPLACE TEMP TABLE prior_mart (
        session_id VARCHAR,
        user_id VARCHAR,
        session_start TIMESTAMP,
        session_end TIMESTAMP,
        duration_seconds BIGINT,
        event_count BIGINT,
        is_bounce BOOLEAN,
        entry_page VARCHAR,
        exit_page VARCHAR,
        has_conversion BOOLEAN,
        last_event_timestamp TIMESTAMP,
        lifecycle_status VARCHAR,
        partition_state VARCHAR,
        processed_event_ids VARCHAR[]
      );

      {% if inputs.historical_mart_uri is not empty or (outputs.hydrate_historical_mart is defined and outputs.hydrate_historical_mart.files is not empty) or (outputs.stage_demo_events is defined and outputs.stage_demo_events.outputFiles is defined) %}
      INSERT INTO prior_mart
      SELECT * FROM read_parquet('{{ workingDir }}/existing_sessions_mart.parquet');
      {% endif %}

      -- 2. Tier 1 Deduplication & Cross-Run Anti-Join
      CREATE OR REPLACE TEMP TABLE ranked_raw_incoming AS
      SELECT *,
        ROW_NUMBER() OVER (
          PARTITION BY COALESCE(event_id, CAST(uuid() AS VARCHAR)), user_id 
          ORDER BY event_timestamp ASC NULLS LAST
        ) AS rn
      FROM raw_incoming;

      -- A. In-batch duplicates: records within the same batch sharing (event_id, user_id)
      CREATE OR REPLACE TEMP TABLE in_batch_duplicates AS
      SELECT * EXCLUDE (rn) FROM ranked_raw_incoming WHERE rn > 1;

      CREATE OR REPLACE TEMP TABLE unique_raw_incoming AS
      SELECT * EXCLUDE (rn) FROM ranked_raw_incoming WHERE rn = 1;

      -- B. Cross-run replays: unique in-batch events whose non-null event_id was already processed in prior state
      CREATE OR REPLACE TEMP TABLE cross_run_replays AS
      SELECT u.*
      FROM unique_raw_incoming u
      WHERE u.event_id IS NOT NULL
        AND (
          EXISTS (
            SELECT 1 FROM (
              SELECT UNNEST(processed_event_ids) AS pid FROM active_sessions WHERE processed_event_ids IS NOT NULL
            ) a WHERE a.pid = u.event_id
          )
          OR EXISTS (
            SELECT 1 FROM (
              SELECT UNNEST(processed_event_ids) AS pid FROM prior_mart WHERE processed_event_ids IS NOT NULL
            ) m WHERE m.pid = u.event_id
          )
        );

      -- C. Deduped incoming events: surviving unique events
      CREATE OR REPLACE TEMP TABLE deduped_incoming AS
      SELECT u.*
      FROM unique_raw_incoming u
      WHERE NOT EXISTS (
        SELECT 1 FROM cross_run_replays r 
        WHERE r.event_id = u.event_id AND r.user_id = u.user_id
      );

      -- Prior processed watermark: maximum event timestamp from existing state before this batch
      CREATE OR REPLACE TEMP TABLE prior_watermark_ref AS
      SELECT MAX(last_ts) AS prior_watermark_ts
      FROM (
        SELECT MAX(last_event_timestamp) AS last_ts FROM active_sessions
        UNION ALL
        SELECT MAX(last_event_timestamp) AS last_ts FROM prior_mart
      );

      -- D. Mutually exclusive evaluation of late arrivals and sealed session conflicts
      CREATE OR REPLACE TEMP TABLE evaluated_incoming AS
      SELECT 
        i.*,
        CASE 
          WHEN EXISTS (
            SELECT 1 FROM prior_mart m
            WHERE m.user_id = i.user_id
              AND i.event_timestamp BETWEEN m.session_start - INTERVAL '{{ inputs.inactivity_timeout_minutes }} MINUTES'
                                        AND m.session_end + INTERVAL '{{ inputs.inactivity_timeout_minutes }} MINUTES'
          ) THEN 'SEALED_SESSION_CONFLICT'
          WHEN (p.prior_watermark_ts IS NOT NULL AND i.event_timestamp < p.prior_watermark_ts - INTERVAL '{{ inputs.allowed_lateness_hours }} HOURS')
          THEN 'EXPIRED_WATERMARK_LATENESS'
          ELSE NULL
        END AS drop_reason
      FROM deduped_incoming i
      CROSS JOIN prior_watermark_ref p;

      -- E. Discarded late events
      CREATE OR REPLACE TEMP TABLE late_events_discarded AS
      SELECT * EXCLUDE (drop_reason), drop_reason
      FROM evaluated_incoming
      WHERE drop_reason IS NOT NULL;

      -- F. Clean surviving incoming events
      CREATE OR REPLACE TEMP TABLE clean_incoming AS
      SELECT * EXCLUDE (drop_reason)
      FROM evaluated_incoming
      WHERE drop_reason IS NULL;

      -- Current processing watermark for session sealing
      CREATE OR REPLACE TEMP TABLE current_watermark_ref AS
      SELECT COALESCE(
        (SELECT MAX(event_timestamp) FROM clean_incoming),
        (SELECT MAX(last_event_timestamp) FROM active_sessions),
        CURRENT_TIMESTAMP
      ) AS watermark_ts;

      -- 3. Tier 2: Boundary Union & Interval Gaps-and-Islands Sessionization
      CREATE OR REPLACE TEMP TABLE unified_session_intervals AS
      -- Active sessions as intervals
      SELECT 
        session_id AS active_session_id,
        user_id,
        session_start AS start_time,
        session_end AS end_time,
        event_count,
        entry_page,
        exit_page,
        has_conversion,
        last_event_timestamp,
        processed_event_ids,
        0 AS is_incoming
      FROM active_sessions

      UNION ALL

      -- Incoming events as point intervals
      SELECT 
        NULL AS active_session_id,
        user_id,
        event_timestamp AS start_time,
        event_timestamp AS end_time,
        1 AS event_count,
        page_path AS entry_page,
        page_path AS exit_page,
        (event_type = 'PURCHASE') AS has_conversion,
        event_timestamp AS last_event_timestamp,
        [event_id] AS processed_event_ids,
        1 AS is_incoming
      FROM clean_incoming;

      -- Gaps-and-islands over unified intervals
      CREATE OR REPLACE TEMP TABLE all_reconciled_sessions AS
      WITH ordered_intervals AS (
        SELECT 
          *,
          MAX(end_time) OVER (
            PARTITION BY user_id 
            ORDER BY start_time ASC NULLS LAST, end_time DESC NULLS LAST 
            ROWS BETWEEN UNBOUNDED PRECEDING AND 1 PRECEDING
          ) AS prev_max_end
        FROM unified_session_intervals
      ),
      island_boundaries AS (
        SELECT 
          *,
          CASE 
            WHEN prev_max_end IS NULL THEN 1
            WHEN start_time > prev_max_end + INTERVAL '{{ inputs.inactivity_timeout_minutes }} MINUTES' THEN 1
            ELSE 0 
          END AS is_new_island
        FROM ordered_intervals
      ),
      session_islands AS (
        SELECT 
          *,
          SUM(is_new_island) OVER (
            PARTITION BY user_id 
            ORDER BY start_time ASC NULLS LAST, end_time DESC NULLS LAST 
            ROWS UNBOUNDED PRECEDING
          ) AS island_id
        FROM island_boundaries
      )
      SELECT 
        COALESCE(
          FIRST(active_session_id ORDER BY start_time ASC NULLS LAST) FILTER (WHERE active_session_id IS NOT NULL),
          'sess-' || SUBSTRING(MD5(COALESCE(user_id, 'null') || '_' || strftime(COALESCE(MIN(start_time), CURRENT_TIMESTAMP), '%Y%m%d%H%M%S')), 1, 12)
        ) AS session_id,
        user_id,
        MIN(start_time) AS session_start,
        MAX(end_time) AS session_end,
        date_diff('second', MIN(start_time), MAX(end_time)) AS duration_seconds,
        SUM(event_count) AS event_count,
        CASE 
          WHEN SUM(event_count) = 1 AND date_diff('second', MIN(start_time), MAX(end_time)) = 0 
               AND FIRST(entry_page ORDER BY start_time ASC, is_incoming ASC) = LAST(exit_page ORDER BY end_time ASC, is_incoming DESC) 
          THEN true 
          ELSE false 
        END AS is_bounce,
        FIRST(entry_page ORDER BY start_time ASC, is_incoming ASC) AS entry_page,
        LAST(exit_page ORDER BY end_time ASC, is_incoming DESC) AS exit_page,
        BOOL_OR(has_conversion) AS has_conversion,
        MAX(last_event_timestamp) AS last_event_timestamp,
        CASE 
          WHEN COUNT(active_session_id) = 0 THEN 'NEW_SPAWN'
          WHEN SUM(is_incoming) > 0 THEN 'STITCHED'
          ELSE 'UNTOUCHED_ACTIVE'
        END AS lifecycle_status,
        list_distinct(flatten(list(processed_event_ids))) AS processed_event_ids
      FROM session_islands
      GROUP BY user_id, island_id;

      -- 4. Tier 3: Compaction & Sealing Partitioning
      CREATE OR REPLACE TEMP TABLE finalized_sessions AS
      SELECT 
        s.session_id,
        s.user_id,
        s.session_start,
        s.session_end,
        s.duration_seconds,
        s.event_count,
        s.is_bounce,
        s.entry_page,
        s.exit_page,
        s.has_conversion,
        s.last_event_timestamp,
        s.lifecycle_status,
        CASE 
          WHEN date_diff('second', s.last_event_timestamp, w.watermark_ts) > ({{ inputs.inactivity_timeout_minutes }} * 60)
          THEN 'SEALED'
          ELSE 'ACTIVE'
        END AS partition_state,
        s.processed_event_ids
      FROM all_reconciled_sessions s
      CROSS JOIN current_watermark_ref w;

      -- Partition into newly sealed sessions and active in-flight buffer
      CREATE OR REPLACE TEMP TABLE newly_sealed_sessions AS
      SELECT * FROM finalized_sessions WHERE partition_state = 'SEALED';

      CREATE OR REPLACE TEMP TABLE active_buffer_staging AS
      SELECT session_id, user_id, session_start, session_end, duration_seconds, event_count, is_bounce, entry_page, exit_page, has_conversion, last_event_timestamp, processed_event_ids
      FROM finalized_sessions
      WHERE partition_state = 'ACTIVE';

      -- Build cumulative immutable historical mart (strictly SEALED sessions, monotonic accumulation)
      CREATE OR REPLACE TEMP TABLE cumulative_sessions_mart AS
      SELECT * FROM (
        SELECT * FROM prior_mart
        UNION ALL
        SELECT * FROM newly_sealed_sessions
      )
      QUALIFY ROW_NUMBER() OVER (PARTITION BY session_id ORDER BY last_event_timestamp DESC) = 1;

      -- Persist staging artifacts in task working directory
      COPY cumulative_sessions_mart TO '{{ workingDir }}/staging_sessions_mart.parquet' (FORMAT PARQUET);
      COPY active_buffer_staging TO '{{ workingDir }}/staging_active_buffer.parquet' (FORMAT PARQUET);

      -- 5. Tier 4: Multi-Invariant Reconciliation Scorecard (Single-Row Projection)
      WITH session_adjacency AS (
        SELECT 
          user_id,
          session_id,
          session_start,
          session_end,
          LAG(session_end) OVER (PARTITION BY user_id ORDER BY session_start ASC, session_end ASC) AS prev_end
        FROM finalized_sessions
        WHERE user_id IS NOT NULL
      )
      SELECT 
        COALESCE((SELECT COUNT(*) FROM raw_incoming), 0) AS raw_incoming_events,
        COALESCE((SELECT COUNT(*) FROM in_batch_duplicates), 0) AS in_batch_duplicates_dropped,
        COALESCE((SELECT COUNT(*) FROM cross_run_replays), 0) AS cross_run_replays_dropped,
        COALESCE((SELECT COUNT(*) FROM late_events_discarded), 0) AS late_events_discarded,
        COALESCE((SELECT COUNT(*) FROM clean_incoming), 0) AS clean_incoming_events,
        COALESCE((SELECT COALESCE(SUM(event_count), 0) FROM active_sessions), 0) AS initial_active_events,
        COALESCE((SELECT COUNT(*) FROM prior_mart), 0) AS prior_mart_sealed_sessions,
        COALESCE((SELECT COUNT(*) FROM newly_sealed_sessions), 0) AS newly_sealed_sessions_count,
        COALESCE((SELECT COUNT(*) FROM active_buffer_staging), 0) AS active_sessions_retained,
        COALESCE((SELECT COUNT(*) FROM cumulative_sessions_mart), 0) AS cumulative_mart_sessions,

        -- Invariants
        ((SELECT COUNT(*) FROM raw_incoming) - (
          (SELECT COUNT(*) FROM in_batch_duplicates) +
          (SELECT COUNT(*) FROM cross_run_replays) +
          (SELECT COUNT(*) FROM late_events_discarded) +
          (SELECT COUNT(*) FROM clean_incoming)
        )) AS raw_event_accounting_delta,
        ((SELECT COALESCE(SUM(event_count), 0) FROM finalized_sessions)) -
          ((SELECT COALESCE(SUM(event_count), 0) FROM active_sessions) + (SELECT COUNT(*) FROM clean_incoming)) AS in_batch_conservation_delta,
        ((SELECT COUNT(*) FROM finalized_sessions) - (SELECT COUNT(DISTINCT session_id) FROM finalized_sessions)) +
          ((SELECT COUNT(*) FROM cumulative_sessions_mart) - (SELECT COUNT(DISTINCT session_id) FROM cumulative_sessions_mart)) AS duplicate_session_ids,
        (SELECT COUNT(*) FROM session_adjacency WHERE prev_end >= session_start) AS overlapping_session_violations,
        (SELECT COUNT(*) FROM session_adjacency WHERE prev_end IS NOT NULL AND date_diff('second', prev_end, session_start) <= ({{ inputs.inactivity_timeout_minutes }} * 60)) AS inactivity_gap_violations,
        (SELECT COUNT(*) FROM cumulative_sessions_mart WHERE partition_state != 'SEALED') AS mart_active_leaks,
        (SELECT COUNT(*) FROM finalized_sessions WHERE user_id IS NULL OR TRIM(user_id) = '') AS unmapped_users,
        (SELECT COUNT(*) FROM (
           SELECT event_id FROM raw_incoming WHERE event_id IS NOT NULL GROUP BY event_id HAVING COUNT(DISTINCT user_id) > 1
         )) AS event_id_conflicts,
        (SELECT COUNT(*) FROM raw_incoming WHERE event_id IS NULL OR TRIM(event_id) = '') AS null_event_ids,
        (SELECT COUNT(*) FROM raw_incoming WHERE event_timestamp IS NULL) AS null_event_timestamps,
        (SELECT COUNT(*) FROM finalized_sessions 
         WHERE (is_bounce = true AND (event_count != 1 OR duration_seconds != 0 OR entry_page != exit_page))
            OR (is_bounce = false AND event_count = 1 AND duration_seconds = 0 AND entry_page = exit_page)) AS bounce_violations,
        (SELECT CASE 
           WHEN (SELECT COUNT(*) FROM unique_raw_incoming) > 0 
            AND (SELECT COUNT(*) FROM late_events_discarded) * 100.0 / (SELECT COUNT(*) FROM unique_raw_incoming) > {{ inputs.max_discard_ratio_pct }} 
           THEN 1 
           ELSE 0 
         END) AS excessive_discard_violations,

        -- Derived Analytical Scorecard KPIs (over cumulative mart, COALESCE protected)
        COALESCE((SELECT ROUND(AVG(duration_seconds), 1) FROM cumulative_sessions_mart), 0.0) AS avg_duration_seconds,
        COALESCE((SELECT ROUND(100.0 * COUNT(CASE WHEN is_bounce = true THEN 1 END) / GREATEST(COUNT(*), 1), 2) FROM cumulative_sessions_mart), 0.0) AS bounce_rate_pct,
        COALESCE((SELECT ROUND(100.0 * COUNT(CASE WHEN has_conversion = true THEN 1 END) / GREATEST(COUNT(*), 1), 2) FROM cumulative_sessions_mart), 0.0) AS conversion_rate_pct,

        -- Circuit Breaker Invariant Gate Verdict
        CASE 
          WHEN ((SELECT COUNT(*) FROM raw_incoming) - (
                 (SELECT COUNT(*) FROM in_batch_duplicates) +
                 (SELECT COUNT(*) FROM cross_run_replays) +
                 (SELECT COUNT(*) FROM late_events_discarded) +
                 (SELECT COUNT(*) FROM clean_incoming)
               )) = 0
           AND (((SELECT COALESCE(SUM(event_count), 0) FROM finalized_sessions)) -
                ((SELECT COALESCE(SUM(event_count), 0) FROM active_sessions) + (SELECT COUNT(*) FROM clean_incoming))) = 0
           AND ((SELECT COUNT(*) FROM finalized_sessions) - (SELECT COUNT(DISTINCT session_id) FROM finalized_sessions)) = 0
           AND ((SELECT COUNT(*) FROM cumulative_sessions_mart) - (SELECT COUNT(DISTINCT session_id) FROM cumulative_sessions_mart)) = 0
           AND (SELECT COUNT(*) FROM session_adjacency WHERE prev_end >= session_start) = 0
           AND (SELECT COUNT(*) FROM session_adjacency WHERE prev_end IS NOT NULL AND date_diff('second', prev_end, session_start) <= ({{ inputs.inactivity_timeout_minutes }} * 60)) = 0
           AND (SELECT COUNT(*) FROM cumulative_sessions_mart WHERE partition_state != 'SEALED') = 0
           AND (SELECT COUNT(*) FROM finalized_sessions WHERE user_id IS NULL OR TRIM(user_id) = '') = 0
           AND (SELECT COUNT(*) FROM (
                  SELECT event_id FROM raw_incoming WHERE event_id IS NOT NULL GROUP BY event_id HAVING COUNT(DISTINCT user_id) > 1
                )) = 0
           AND (SELECT COUNT(*) FROM raw_incoming WHERE event_id IS NULL OR TRIM(event_id) = '') = 0
           AND (SELECT COUNT(*) FROM raw_incoming WHERE event_timestamp IS NULL) = 0
           AND (SELECT COUNT(*) FROM finalized_sessions 
                WHERE (is_bounce = true AND (event_count != 1 OR duration_seconds != 0 OR entry_page != exit_page))
                   OR (is_bounce = false AND event_count = 1 AND duration_seconds = 0 AND entry_page = exit_page)) = 0
           AND (SELECT CASE 
                  WHEN (SELECT COUNT(*) FROM unique_raw_incoming) > 0 
                   AND (SELECT COUNT(*) FROM late_events_discarded) * 100.0 / (SELECT COUNT(*) FROM unique_raw_incoming) > {{ inputs.max_discard_ratio_pct }} 
                  THEN 1 
                  ELSE 0 
                END) = 0
          THEN true
          ELSE false
        END AS invariant_passed;

  - id: log_session_scorecard
    type: io.kestra.plugin.core.log.Log
    description: Outputs the itemized event sessionization and compaction scorecard to execution logs.
    message: |
      ==============================================================
      EVENT SESSIONIZATION & INACTIVITY COMPACTION SCORECARD
      ==============================================================
      Raw Incoming Events:            {{ outputs.sessionize_and_compact_stream.outputs[0].rows[0].raw_incoming_events }}
      In-Batch Duplicates Dropped:    {{ outputs.sessionize_and_compact_stream.outputs[0].rows[0].in_batch_duplicates_dropped }}
      Cross-Run Replays Dropped:      {{ outputs.sessionize_and_compact_stream.outputs[0].rows[0].cross_run_replays_dropped }}
      Late Events Discarded:          {{ outputs.sessionize_and_compact_stream.outputs[0].rows[0].late_events_discarded }}
      Clean Incoming Events:          {{ outputs.sessionize_and_compact_stream.outputs[0].rows[0].clean_incoming_events }}
      Initial Active Events:          {{ outputs.sessionize_and_compact_stream.outputs[0].rows[0].initial_active_events }}
      Prior Mart Sealed Sessions:     {{ outputs.sessionize_and_compact_stream.outputs[0].rows[0].prior_mart_sealed_sessions }}
      Newly Sealed Sessions:          {{ outputs.sessionize_and_compact_stream.outputs[0].rows[0].newly_sealed_sessions_count }}
      Cumulative Mart Sessions:       {{ outputs.sessionize_and_compact_stream.outputs[0].rows[0].cumulative_mart_sessions }}
      Active Sessions Retained:       {{ outputs.sessionize_and_compact_stream.outputs[0].rows[0].active_sessions_retained }}
      Raw Event Accounting Delta:     {{ outputs.sessionize_and_compact_stream.outputs[0].rows[0].raw_event_accounting_delta }}
      In-Batch Conservation Delta:    {{ outputs.sessionize_and_compact_stream.outputs[0].rows[0].in_batch_conservation_delta }}
      Duplicate Session IDs:          {{ outputs.sessionize_and_compact_stream.outputs[0].rows[0].duplicate_session_ids }}
      Overlapping Session Violations: {{ outputs.sessionize_and_compact_stream.outputs[0].rows[0].overlapping_session_violations }}
      Inactivity Gap Violations:      {{ outputs.sessionize_and_compact_stream.outputs[0].rows[0].inactivity_gap_violations }}
      Mart Active Leaks:              {{ outputs.sessionize_and_compact_stream.outputs[0].rows[0].mart_active_leaks }}
      Unmapped Users Detected:        {{ outputs.sessionize_and_compact_stream.outputs[0].rows[0].unmapped_users }}
      Event ID Conflicts Detected:    {{ outputs.sessionize_and_compact_stream.outputs[0].rows[0].event_id_conflicts }}
      Null Event IDs Detected:        {{ outputs.sessionize_and_compact_stream.outputs[0].rows[0].null_event_ids }}
      Null Timestamps Detected:       {{ outputs.sessionize_and_compact_stream.outputs[0].rows[0].null_event_timestamps }}
      Bounce Logic Violations:        {{ outputs.sessionize_and_compact_stream.outputs[0].rows[0].bounce_violations }}
      Excessive Discard Violations:   {{ outputs.sessionize_and_compact_stream.outputs[0].rows[0].excessive_discard_violations }}
      Average Session Duration:       {{ outputs.sessionize_and_compact_stream.outputs[0].rows[0].avg_duration_seconds }}s
      Bounce Rate:                    {{ outputs.sessionize_and_compact_stream.outputs[0].rows[0].bounce_rate_pct }}%
      Conversion Rate:                {{ outputs.sessionize_and_compact_stream.outputs[0].rows[0].conversion_rate_pct }}%
      Sessionization Invariant:       {{ outputs.sessionize_and_compact_stream.outputs[0].rows[0].invariant_passed ? '[PASS]' : '[FAIL]' }}
      ==============================================================

  - id: sessionization_gate
    type: io.kestra.plugin.core.flow.If
    description: Circuit breaker that publishes verified session marts on pass, or halts execution on invariant violation.
    condition: "{{ outputs.sessionize_and_compact_stream.outputs[0].rows[0].invariant_passed }}"
    then:
      - id: publish_sessions_mart
        type: io.kestra.plugin.core.namespace.UploadFiles
        description: Publishes the cumulative sealed sessionized Parquet mart to Namespace Files for downstream BI and analytical consumption.
        filesMap:
          lakehouse/sessions_mart.parquet: "{{ outputs.sessionize_and_compact_stream.outputFiles['staging_sessions_mart.parquet'] }}"
        namespace: "{{ flow.namespace }}"

      - id: persist_active_buffer
        type: io.kestra.plugin.core.namespace.UploadFiles
        description: Persists the active session buffer in Namespace Files for cross-run state hydration in subsequent runs.
        filesMap:
          lakehouse/state/active_sessions.parquet: "{{ outputs.sessionize_and_compact_stream.outputFiles['staging_active_buffer.parquet'] }}"
        namespace: "{{ flow.namespace }}"

      - id: record_session_manifest
        type: io.kestra.plugin.core.kv.Set
        description: Records production table metadata, session counts, and audit summary in the Kestra KV store.
        key: session_compaction_manifest
        value: |
          {
            "table": "sessions_mart",
            "execution_id": "{{ execution.id }}",
            "timestamp": "{{ execution.startDate }}",
            "cumulative_mart_sessions": {{ outputs.sessionize_and_compact_stream.outputs[0].rows[0].cumulative_mart_sessions ?? 0 }},
            "newly_sealed_sessions": {{ outputs.sessionize_and_compact_stream.outputs[0].rows[0].newly_sealed_sessions_count ?? 0 }},
            "active_sessions_retained": {{ outputs.sessionize_and_compact_stream.outputs[0].rows[0].active_sessions_retained ?? 0 }},
            "prior_mart_sessions": {{ outputs.sessionize_and_compact_stream.outputs[0].rows[0].prior_mart_sealed_sessions ?? 0 }},
            "bounce_rate_pct": {{ outputs.sessionize_and_compact_stream.outputs[0].rows[0].bounce_rate_pct ?? 0.0 }},
            "conversion_rate_pct": {{ outputs.sessionize_and_compact_stream.outputs[0].rows[0].conversion_rate_pct ?? 0.0 }},
            "storage_path": "lakehouse/sessions_mart.parquet"
          }
        kvType: JSON
    else:
      - id: halt_corrupt_sessionization
        type: io.kestra.plugin.core.execution.Fail
        errorMessage: "Event Sessionization Invariant Violated! Accounting Delta: {{ outputs.sessionize_and_compact_stream.outputs[0].rows[0].raw_event_accounting_delta }}, In-Batch Delta: {{ outputs.sessionize_and_compact_stream.outputs[0].rows[0].in_batch_conservation_delta }}, Duplicate IDs: {{ outputs.sessionize_and_compact_stream.outputs[0].rows[0].duplicate_session_ids }}, Overlaps: {{ outputs.sessionize_and_compact_stream.outputs[0].rows[0].overlapping_session_violations }}, Inactivity Violations: {{ outputs.sessionize_and_compact_stream.outputs[0].rows[0].inactivity_gap_violations }}, Mart Leaks: {{ outputs.sessionize_and_compact_stream.outputs[0].rows[0].mart_active_leaks }}, Unmapped Users: {{ outputs.sessionize_and_compact_stream.outputs[0].rows[0].unmapped_users }}, Conflicts: {{ outputs.sessionize_and_compact_stream.outputs[0].rows[0].event_id_conflicts }}, Null IDs: {{ outputs.sessionize_and_compact_stream.outputs[0].rows[0].null_event_ids }}, Null Timestamps: {{ outputs.sessionize_and_compact_stream.outputs[0].rows[0].null_event_timestamps }}, Discards: {{ outputs.sessionize_and_compact_stream.outputs[0].rows[0].excessive_discard_violations }}, Bounce Violations: {{ outputs.sessionize_and_compact_stream.outputs[0].rows[0].bounce_violations }}."

triggers:
  - id: hourly_compaction_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 * * * *"
    disabled: true
    description: Hourly compaction schedule. Shipped disabled for demonstration. In production, configure events_stream_uri to point to landing object storage.
    # inputs:
    #   events_stream_uri: "kestra:///lakehouse/landing/hourly_events.parquet"

extend:
  title: Dynamic Event Sessionization and Inactivity Compaction with DuckDB
  metaTitle: Event Sessionization & Inactivity Compaction | Kestra Blueprint
  shortDescription: Ingest event streams, stitch active sessions across runs, derive bounce attribution, and compact lakehouse marts in DuckDB with quality gates.
  metaDescription: Ingest event streams, stitch active sessions across runs, derive bounce attribution, and compact lakehouse marts in DuckDB with quality invariant gates.
  description: |
    Clickstream telemetry arrives with variable intervals between pageviews, out-of-order timestamps, and duplicate network retries. Fixed tumbling windows arbitrarily split visits across batch boundaries, distorting duration and bounce metrics.

    This blueprint implements a demo-scale in-engine event sessionization and stateful compaction pipeline using embedded DuckDB. It ingests micro-batch event streams, hydrates cumulative historical marts and active session buffers across runs via Namespace Files, resolves inactivity timeouts, stitches continuous visits, and gates publication on quality invariants before writing to storage and the KV store.

    ## How it works

    1. **Dual State Hydration**: `DownloadFiles` loads cumulative sessions (`/lakehouse/sessions_mart.parquet`) and active session buffers (`/lakehouse/state/active_sessions.parquet`) from Namespace Files.
    2. **Demo Staging**: When input URIs are empty, `stage_demo_events` generates demo Parquet streams adapting between bootstrap and incremental arrivals.
    3. **Sessionization & Compaction**: `sessionize_and_compact_stream` executes DuckDB window functions to drop duplicate retries, derive watermarks, filter late arrivals, detect session boundaries via gaps-and-islands, and partition visits into sealed and active states.
    4. **Reconciliation Invariants**: Validates raw accounting, row conservation, PK uniqueness, temporal disjointness, inactivity gaps, active isolation, user integrity, null checks, conflict prevention, discard tolerance, and bounce attribution.
    5. **Scorecard & Gating**: `log_session_scorecard` outputs the scorecard, and `sessionization_gate` (`If`) publishes Parquet to Namespace Files (`UploadFiles`) and writes metadata to the KV store (`kv.Set`) on pass, or halts via `Fail` on violation.

    ## What you get

    - In-engine sessionization in DuckDB without external streaming clusters.
    - Dual-dataset hydration via Namespace Files preventing boundary fragmentation.
    - Cross-run replay deduplication and conflicting event ID detection.
    - Dynamic watermark tracking preventing premature sealing during empty batches.
    - Monotonic sealed session accumulation in the mart with zero active-state leakage.
    - Row-conservation, active-isolation, temporal-disjointness, and bounce reconciliation gates.
    - Mart publishing to Namespace Files paired with KV store metadata discovery.

    ## Who it's for

    - Analytics engineers transforming raw clickstream into sessionized data marts.
    - Growth teams tracking conversion attribution and user journeys.
    - Data engineers building micro-batch lakehouse compaction pipelines.

    ## Why orchestrate this with Kestra

    - **Embedded Compute**: Runs DuckDB in the Kestra worker with zero external database dependencies.
    - **Stateful Hydration**: Hydrates active session buffers and cumulative historical marts across runs using Namespace Files.
    - **Circuit Breaker Gates**: Flow controls (`If` and `Fail`) isolate anomalies before bad metrics reach dashboards.
    - **Auditable Metadata**: Emits key session metrics and operational summaries directly into Kestra KV store.

    ## Prerequisites

    - Kestra instance with the DuckDB JDBC plugin (`plugin-jdbc-duckdb`).

    ### Secrets

    - None required.

    ## Quick start

    1. **Run Clean Sessionization**: Execute with defaults. The demo is a two-run walkthrough: Run 1 bootstraps initial state (2 sealed sessions, 4 active visits); Run 2 hydrates both files and expands the mart to 3 sealed sessions. To re-run from scratch, delete the two files in Namespace Files.
    2. **Verify Gate Failure**: Execute with `inject_corrupt_event: true`. The pipeline catches unmapped records and aborts via `Fail`.
    3. **Custom Event Streams**: Supply storage URIs in inputs. Pass `events_stream_uri` alone for initial raw ingestion, or supply all three URIs for incremental runs.
    4. **Activate the Trigger**: Enable the hourly Schedule trigger in the Triggers tab. Shipped disabled; in production, configure `inputs: events_stream_uri` to ingest landing storage.

    ## How to extend

    - **Automated Scheduling**: Enable the hourly Schedule trigger or attach S3/GCS triggers for event-driven compaction.
    - **Warehouse Sync**: Add Snowflake or BigQuery tasks to sync the compacted mart.
    - **Alerts**: Wire Slack or PagerDuty notification tasks to `sessionization_gate` when invariants fail.

    ## Links

    - [Kestra DuckDB Plugin Documentation](https://kestra.io/plugins/plugin-jdbc-duckdb)
    - [DuckDB Window Functions](https://duckdb.org/docs/sql/window_functions)

  tags:
    - Data
  subTags:
    - Realtime & Streaming
    - Testing & Quality
  ee: false
  demo: false
