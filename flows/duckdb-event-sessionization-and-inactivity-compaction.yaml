id: duckdb-event-sessionization-and-inactivity-compaction
namespace: company.lakehouse

description: |
  Ingests high-throughput event and clickstream telemetry streams, computes dynamic sessionization
  using DuckDB window functions, stitches cross-run active sessions, isolates inactivity timeouts,
  and gates publication on row-conservation and temporal-integrity checks.

inputs:
  - id: events_stream_uri
    type: URI
    displayName: Incoming Events Parquet URI
    description: Storage URI to incoming raw event stream Parquet file (kestra://... or s3://...). Leave empty to execute the self-contained demo stream.
    required: false

  - id: active_sessions_uri
    type: URI
    displayName: Active Session State Parquet URI
    description: Optional override URI to active unsealed session state. If empty, the pipeline automatically hydrates prior state from Namespace Files (/lakehouse/state/active_sessions.parquet).
    required: false

  - id: historical_mart_uri
    type: URI
    displayName: Historical Sessions Mart Parquet URI
    description: Optional override URI to cumulative historical sessions mart. If empty, the pipeline automatically hydrates prior mart from Namespace Files (/lakehouse/sessions_mart.parquet).
    required: false

  - id: inactivity_timeout_minutes
    type: INT
    displayName: Inactivity Timeout (Minutes)
    description: Idle duration threshold between consecutive events defining a new session boundary.
    defaults: 30

  - id: force_bootstrap_seed
    type: BOOL
    displayName: Force Bootstrap Seed
    description: When true, forces generation of initial bootstrap demo sessions even if prior state exists in Namespace Files.
    defaults: false

  - id: inject_temporal_anomaly
    type: BOOL
    displayName: Inject Invariant Anomaly
    description: When true, deliberately injects an unmapped null user ID to trip the circuit breaker and halt execution.
    defaults: false

tasks:
  - id: hydrate_historical_mart
    type: io.kestra.plugin.core.namespace.DownloadFiles
    description: Hydrates cumulative historical session mart from Namespace Files persisted by prior workflow runs.
    namespace: "{{ flow.namespace }}"
    files:
      - "lakehouse/sessions_mart.parquet"

  - id: hydrate_active_buffer
    type: io.kestra.plugin.core.namespace.DownloadFiles
    description: Hydrates active unsealed session state from Namespace Files persisted by prior workflow runs.
    namespace: "{{ flow.namespace }}"
    files:
      - "lakehouse/state/active_sessions.parquet"

  - id: stage_demo_events
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: Generates self-contained demo Parquet files when custom input URIs are not provided, dynamically adapting between bootstrap and incremental cross-run streams.
    runIf: "{{ inputs.events_stream_uri is empty or (inputs.active_sessions_uri is empty and (inputs.force_bootstrap_seed or outputs.hydrate_active_buffer.files is empty)) or (inputs.historical_mart_uri is empty and (inputs.force_bootstrap_seed or outputs.hydrate_historical_mart.files is empty)) }}"
    outputFiles:
      - "*.parquet"
    sql: |
      {% if inputs.force_bootstrap_seed or outputs.hydrate_historical_mart.files is empty %}
      -- Empty prior historical mart for bootstrap
      CREATE OR REPLACE TEMP TABLE existing_mart (
        session_id VARCHAR,
        user_id VARCHAR,
        session_start TIMESTAMP,
        session_end TIMESTAMP,
        duration_seconds BIGINT,
        event_count BIGINT,
        is_bounce BOOLEAN,
        entry_page VARCHAR,
        exit_page VARCHAR,
        has_conversion BOOLEAN,
        last_event_timestamp TIMESTAMP,
        lifecycle_status VARCHAR,
        partition_state VARCHAR
      );
      COPY (SELECT * FROM existing_mart WHERE 1=0) TO '{{ workingDir }}/existing_sessions_mart.parquet' (FORMAT PARQUET);
      {% endif %}

      {% if inputs.force_bootstrap_seed or outputs.hydrate_active_buffer.files is empty %}
      -- 1. Bootstrap seed active session state (Run 1: First-time initialization)
      CREATE OR REPLACE TEMP TABLE active_sessions AS
      SELECT * FROM (
        VALUES 
          ('sess-alice-1', 'usr_alice', TIMESTAMP '2026-10-02 10:00:00', TIMESTAMP '2026-10-02 10:10:00', 1, true, '/home', '/home', false, TIMESTAMP '2026-10-02 10:10:00'),
          ('sess-bob-1', 'usr_bob', TIMESTAMP '2026-10-02 09:55:00', TIMESTAMP '2026-10-02 10:05:00', 2, false, '/landing', '/pricing', false, TIMESTAMP '2026-10-02 10:05:00'),
          ('sess-charlie-1', 'usr_charlie', TIMESTAMP '2026-10-02 09:00:00', TIMESTAMP '2026-10-02 09:15:00', 3, false, '/blog/1', '/blog/2', false, TIMESTAMP '2026-10-02 09:15:00'),
          ('sess-eva-1', 'usr_eva', TIMESTAMP '2026-10-02 08:45:00', TIMESTAMP '2026-10-02 09:00:00', 1, true, '/docs', '/docs', false, TIMESTAMP '2026-10-02 09:00:00')
      ) AS s(session_id, user_id, session_start, session_end, event_count, is_bounce, entry_page, exit_page, has_conversion, last_event_timestamp);

      COPY active_sessions TO '{{ workingDir }}/active_sessions.parquet' (FORMAT PARQUET);

      -- 2. Bootstrap incoming raw event batch (Batch 1)
      CREATE OR REPLACE TEMP TABLE incoming_events AS
      SELECT * FROM (
        VALUES 
          ('evt-a-1', 'usr_alice', TIMESTAMP '2026-10-02 10:18:00', 'PAGEVIEW', '/products'),
          ('evt-a-2', 'usr_alice', TIMESTAMP '2026-10-02 10:24:00', 'PURCHASE', '/checkout/success'),
          ('evt-b-late', 'usr_bob', TIMESTAMP '2026-10-02 10:02:00', 'PURCHASE', '/checkout/success'),
          ('evt-c-1', 'usr_charlie', TIMESTAMP '2026-10-02 10:20:00', 'PAGEVIEW', '/pricing'),
          ('evt-d-1', 'usr_david', TIMESTAMP '2026-10-02 10:12:00', 'PAGEVIEW', '/home'),
          ('evt-d-2', 'usr_david', TIMESTAMP '2026-10-02 10:25:00', 'PAGEVIEW', '/features'),
          ('evt-a-1', 'usr_alice', TIMESTAMP '2026-10-02 10:18:00', 'PAGEVIEW', '/products')
          {% if inputs.inject_temporal_anomaly == true or inputs.inject_temporal_anomaly == 'true' %}
          ,('evt-corrupt-anon', NULL, TIMESTAMP '2026-10-02 10:20:00', 'PAGEVIEW', '/error')
          {% endif %}
      ) AS e(event_id, user_id, event_timestamp, event_type, page_path);

      COPY incoming_events TO '{{ workingDir }}/incoming_events.parquet' (FORMAT PARQUET);

      {% else %}
      -- Incremental micro-batch event stream (Batch 2: stitching hydrated state from Run N)
      CREATE OR REPLACE TEMP TABLE incoming_events AS
      SELECT * FROM (
        VALUES 
          ('evt-a-3', 'usr_alice', TIMESTAMP '2026-10-02 10:35:00', 'PAGEVIEW', '/account'),
          ('evt-d-3', 'usr_david', TIMESTAMP '2026-10-02 10:48:00', 'PURCHASE', '/checkout'),
          ('evt-f-1', 'usr_frank', TIMESTAMP '2026-10-02 10:45:00', 'PAGEVIEW', '/landing'),
          ('evt-a-3', 'usr_alice', TIMESTAMP '2026-10-02 10:35:00', 'PAGEVIEW', '/account')
          {% if inputs.inject_temporal_anomaly == true or inputs.inject_temporal_anomaly == 'true' %}
          ,('evt-corrupt-anon', NULL, TIMESTAMP '2026-10-02 10:40:00', 'PAGEVIEW', '/error')
          {% endif %}
      ) AS e(event_id, user_id, event_timestamp, event_type, page_path);

      COPY incoming_events TO '{{ workingDir }}/incoming_events.parquet' (FORMAT PARQUET);
      {% endif %}

  - id: sessionize_and_compact_stream
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: Executes transport deduplication, in-batch gap detection, cross-run session stitching, inactivity sealing, and multi-invariant reconciliation scoring.
    fetchType: FETCH
    inputFiles:
      incoming_events.parquet: "{{ inputs.events_stream_uri ? inputs.events_stream_uri : outputs.stage_demo_events.outputFiles['incoming_events.parquet'] }}"
      active_sessions.parquet: "{{ inputs.active_sessions_uri ? inputs.active_sessions_uri : ((outputs.hydrate_active_buffer.files is not empty and not inputs.force_bootstrap_seed) ? outputs.hydrate_active_buffer.files.values().iterator().next() : outputs.stage_demo_events.outputFiles['active_sessions.parquet']) }}"
      existing_sessions_mart.parquet: "{{ inputs.historical_mart_uri ? inputs.historical_mart_uri : ((outputs.hydrate_historical_mart.files is not empty and not inputs.force_bootstrap_seed) ? outputs.hydrate_historical_mart.files.values().iterator().next() : outputs.stage_demo_events.outputFiles['existing_sessions_mart.parquet']) }}"
    outputFiles:
      - "*.parquet"
    sql: |
      -- 1. Mount incoming event stream, prior active session state, and cumulative historical mart
      CREATE OR REPLACE TEMP TABLE raw_incoming AS
      SELECT * FROM read_parquet('{{ workingDir }}/incoming_events.parquet');

      CREATE OR REPLACE TEMP TABLE active_sessions AS
      SELECT * FROM read_parquet('{{ workingDir }}/active_sessions.parquet');

      CREATE OR REPLACE TEMP TABLE prior_mart AS
      SELECT * FROM read_parquet('{{ workingDir }}/existing_sessions_mart.parquet');

      -- 2. Tier 1 Deduplication (Transport Layer): Drop duplicate network replays by event_id
      CREATE OR REPLACE TEMP TABLE deduped_incoming AS
      SELECT * EXCLUDE (rn)
      FROM (
        SELECT *,
          ROW_NUMBER() OVER (PARTITION BY event_id ORDER BY event_timestamp ASC) AS rn
        FROM raw_incoming
      )
      WHERE rn = 1;

      -- 3. Tier 2: Boundary Union & Interval Gaps-and-Islands Sessionization
      CREATE OR REPLACE TEMP TABLE unified_session_intervals AS
      -- Active sessions as intervals
      SELECT 
        session_id AS active_session_id,
        user_id,
        session_start AS start_time,
        session_end AS end_time,
        event_count,
        entry_page,
        exit_page,
        has_conversion,
        last_event_timestamp,
        0 AS is_incoming
      FROM active_sessions

      UNION ALL

      -- Incoming events as point intervals
      SELECT 
        NULL AS active_session_id,
        user_id,
        event_timestamp AS start_time,
        event_timestamp AS end_time,
        1 AS event_count,
        page_path AS entry_page,
        page_path AS exit_page,
        (event_type = 'PURCHASE') AS has_conversion,
        event_timestamp AS last_event_timestamp,
        1 AS is_incoming
      FROM deduped_incoming;

      -- Gaps-and-islands over unified intervals
      CREATE OR REPLACE TEMP TABLE all_reconciled_sessions AS
      WITH ordered_intervals AS (
        SELECT 
          *,
          MAX(end_time) OVER (
            PARTITION BY user_id 
            ORDER BY start_time ASC, end_time DESC 
            ROWS BETWEEN UNBOUNDED PRECEDING AND 1 PRECEDING
          ) AS prev_max_end
        FROM unified_session_intervals
      ),
      island_boundaries AS (
        SELECT 
          *,
          CASE 
            WHEN prev_max_end IS NULL THEN 1
            WHEN start_time > prev_max_end + INTERVAL '{{ inputs.inactivity_timeout_minutes }} MINUTES' THEN 1
            ELSE 0 
          END AS is_new_island
        FROM ordered_intervals
      ),
      session_islands AS (
        SELECT 
          *,
          SUM(is_new_island) OVER (
            PARTITION BY user_id 
            ORDER BY start_time ASC, end_time DESC 
            ROWS UNBOUNDED PRECEDING
          ) AS island_id
        FROM island_boundaries
      )
      SELECT 
        COALESCE(
          FIRST(active_session_id ORDER BY start_time ASC) FILTER (WHERE active_session_id IS NOT NULL),
          'sess-' || SUBSTRING(MD5(COALESCE(user_id, 'null') || '_' || strftime(MIN(start_time), '%Y%m%d%H%M%S')), 1, 12)
        ) AS session_id,
        user_id,
        MIN(start_time) AS session_start,
        MAX(end_time) AS session_end,
        date_diff('second', MIN(start_time), MAX(end_time)) AS duration_seconds,
        SUM(event_count) AS event_count,
        CASE WHEN SUM(event_count) = 1 THEN true ELSE false END AS is_bounce,
        FIRST(entry_page ORDER BY start_time ASC, is_incoming ASC) AS entry_page,
        LAST(exit_page ORDER BY end_time ASC, is_incoming DESC) AS exit_page,
        BOOL_OR(has_conversion) AS has_conversion,
        MAX(last_event_timestamp) AS last_event_timestamp,
        CASE 
          WHEN COUNT(active_session_id) = 0 THEN 'NEW_SPAWN'
          WHEN SUM(is_incoming) > 0 THEN 'STITCHED'
          ELSE 'UNTOUCHED_ACTIVE'
        END AS lifecycle_status
      FROM session_islands
      GROUP BY user_id, island_id;


      -- 4. Tier 3: Compaction & Sealing Partitioning
      CREATE OR REPLACE TEMP TABLE watermark_ref AS
      SELECT COALESCE(MAX(event_timestamp), CURRENT_TIMESTAMP) AS watermark_ts
      FROM deduped_incoming;

      CREATE OR REPLACE TEMP TABLE finalized_sessions AS
      SELECT 
        s.session_id,
        s.user_id,
        s.session_start,
        s.session_end,
        date_diff('second', s.session_start, s.session_end) AS duration_seconds,
        s.event_count,
        CASE WHEN s.event_count = 1 THEN true ELSE false END AS is_bounce,
        s.entry_page,
        s.exit_page,
        s.has_conversion,
        s.last_event_timestamp,
        s.lifecycle_status,
        CASE 
          WHEN date_diff('second', s.last_event_timestamp, w.watermark_ts) > ({{ inputs.inactivity_timeout_minutes }} * 60)
          THEN 'SEALED'
          ELSE 'ACTIVE'
        END AS partition_state
      FROM all_reconciled_sessions s
      CROSS JOIN watermark_ref w;

      -- Partition into newly sealed sessions and active in-flight buffer
      CREATE OR REPLACE TEMP TABLE newly_sealed_sessions AS
      SELECT * FROM finalized_sessions WHERE partition_state = 'SEALED';

      CREATE OR REPLACE TEMP TABLE active_buffer_staging AS
      SELECT session_id, user_id, session_start, session_end, event_count, is_bounce, entry_page, exit_page, has_conversion, last_event_timestamp
      FROM finalized_sessions
      WHERE partition_state = 'ACTIVE';

      -- Build cumulative immutable historical mart (strictly SEALED sessions, monotonic accumulation)
      CREATE OR REPLACE TEMP TABLE cumulative_sessions_mart AS
      SELECT * FROM (
        SELECT * FROM prior_mart
        UNION ALL
        SELECT * FROM newly_sealed_sessions
      )
      QUALIFY ROW_NUMBER() OVER (PARTITION BY session_id ORDER BY last_event_timestamp DESC) = 1;

      -- Persist staging artifacts in task working directory
      COPY cumulative_sessions_mart TO '{{ workingDir }}/staging_sessions_mart.parquet' (FORMAT PARQUET);
      COPY active_buffer_staging TO '{{ workingDir }}/staging_active_buffer.parquet' (FORMAT PARQUET);

      -- 4. Tier 4: Multi-Invariant Reconciliation Scorecard (Single-Row Projection)
      SELECT 
        (SELECT COUNT(*) FROM raw_incoming) AS raw_incoming_events,
        (SELECT COUNT(*) FROM raw_incoming) - (SELECT COUNT(*) FROM deduped_incoming) AS duplicate_replays_dropped,
        (SELECT COUNT(*) FROM deduped_incoming) AS clean_incoming_events,
        (SELECT COALESCE(SUM(event_count), 0) FROM active_sessions) AS initial_active_events,
        (SELECT COUNT(*) FROM prior_mart) AS prior_mart_sealed_sessions,
        (SELECT COUNT(*) FROM newly_sealed_sessions) AS newly_sealed_sessions_count,
        (SELECT COALESCE(SUM(event_count), 0) FROM newly_sealed_sessions) AS newly_sealed_events,
        (SELECT COUNT(*) FROM active_buffer_staging) AS active_sessions_retained,
        (SELECT COALESCE(SUM(event_count), 0) FROM active_buffer_staging) AS active_events_retained,
        (SELECT COUNT(*) FROM cumulative_sessions_mart) AS cumulative_mart_sessions,
        (SELECT COALESCE(SUM(event_count), 0) FROM cumulative_sessions_mart) AS cumulative_mart_events,
        -- Invariants
        ((SELECT COALESCE(SUM(event_count), 0) FROM active_buffer_staging) + (SELECT COALESCE(SUM(event_count), 0) FROM newly_sealed_sessions)) -
          ((SELECT COALESCE(SUM(event_count), 0) FROM active_sessions) + (SELECT COUNT(*) FROM deduped_incoming)) AS in_batch_conservation_delta,
        (SELECT COUNT(*) FROM cumulative_sessions_mart WHERE partition_state != 'SEALED') AS mart_active_leaks,
        (SELECT COUNT(*) FROM finalized_sessions WHERE session_end < session_start OR duration_seconds < 0) AS temporal_violations,
        (SELECT COUNT(*) FROM finalized_sessions WHERE (event_count = 1 AND is_bounce = false) OR (event_count > 1 AND is_bounce = true)) AS bounce_violations,
        (SELECT COUNT(*) FROM finalized_sessions WHERE user_id IS NULL) AS unmapped_users,
        -- Derived Analytical Scorecard KPIs (over cumulative mart)
        (SELECT ROUND(COALESCE(AVG(duration_seconds), 0.0), 1) FROM cumulative_sessions_mart) AS avg_duration_seconds,
        (SELECT ROUND(100.0 * COUNT(CASE WHEN is_bounce = true THEN 1 END) / GREATEST(COUNT(*), 1), 2) FROM cumulative_sessions_mart) AS bounce_rate_pct,
        (SELECT ROUND(100.0 * COUNT(CASE WHEN has_conversion = true THEN 1 END) / GREATEST(COUNT(*), 1), 2) FROM cumulative_sessions_mart) AS conversion_rate_pct,
        -- Circuit Breaker Invariant Gate Verdict
        CASE 
          WHEN (((SELECT COALESCE(SUM(event_count), 0) FROM active_buffer_staging) + (SELECT COALESCE(SUM(event_count), 0) FROM newly_sealed_sessions)) -
                ((SELECT COALESCE(SUM(event_count), 0) FROM active_sessions) + (SELECT COUNT(*) FROM deduped_incoming))) = 0
           AND (SELECT COUNT(*) FROM cumulative_sessions_mart WHERE partition_state != 'SEALED') = 0
           AND (SELECT COUNT(*) FROM finalized_sessions WHERE session_end < session_start OR duration_seconds < 0) = 0
           AND (SELECT COUNT(*) FROM finalized_sessions WHERE (event_count = 1 AND is_bounce = false) OR (event_count > 1 AND is_bounce = true)) = 0
           AND (SELECT COUNT(*) FROM finalized_sessions WHERE user_id IS NULL) = 0
          THEN true
          ELSE false
        END AS invariant_passed;

  - id: extract_session_metrics
    type: io.kestra.plugin.core.output.OutputValues
    description: Extracts the reconciliation scorecard metrics as strongly-typed flow outputs.
    values:
      raw_incoming_events: "{{ outputs.sessionize_and_compact_stream.outputs[0].rows[0].raw_incoming_events }}"
      duplicate_replays_dropped: "{{ outputs.sessionize_and_compact_stream.outputs[0].rows[0].duplicate_replays_dropped }}"
      clean_incoming_events: "{{ outputs.sessionize_and_compact_stream.outputs[0].rows[0].clean_incoming_events }}"
      initial_active_events: "{{ outputs.sessionize_and_compact_stream.outputs[0].rows[0].initial_active_events }}"
      prior_mart_sealed_sessions: "{{ outputs.sessionize_and_compact_stream.outputs[0].rows[0].prior_mart_sealed_sessions }}"
      newly_sealed_sessions_count: "{{ outputs.sessionize_and_compact_stream.outputs[0].rows[0].newly_sealed_sessions_count }}"
      active_sessions_retained: "{{ outputs.sessionize_and_compact_stream.outputs[0].rows[0].active_sessions_retained }}"
      cumulative_mart_sessions: "{{ outputs.sessionize_and_compact_stream.outputs[0].rows[0].cumulative_mart_sessions }}"
      in_batch_conservation_delta: "{{ outputs.sessionize_and_compact_stream.outputs[0].rows[0].in_batch_conservation_delta }}"
      mart_active_leaks: "{{ outputs.sessionize_and_compact_stream.outputs[0].rows[0].mart_active_leaks }}"
      temporal_violations: "{{ outputs.sessionize_and_compact_stream.outputs[0].rows[0].temporal_violations }}"
      bounce_violations: "{{ outputs.sessionize_and_compact_stream.outputs[0].rows[0].bounce_violations }}"
      unmapped_users: "{{ outputs.sessionize_and_compact_stream.outputs[0].rows[0].unmapped_users }}"
      avg_duration_seconds: "{{ outputs.sessionize_and_compact_stream.outputs[0].rows[0].avg_duration_seconds }}"
      bounce_rate_pct: "{{ outputs.sessionize_and_compact_stream.outputs[0].rows[0].bounce_rate_pct }}"
      conversion_rate_pct: "{{ outputs.sessionize_and_compact_stream.outputs[0].rows[0].conversion_rate_pct }}"
      invariant_passed: "{{ outputs.sessionize_and_compact_stream.outputs[0].rows[0].invariant_passed }}"

  - id: log_session_scorecard
    type: io.kestra.plugin.core.log.Log
    description: Outputs the itemized event sessionization and compaction scorecard to execution logs.
    message: |
      ==============================================================
      EVENT SESSIONIZATION & INACTIVITY COMPACTION SCORECARD
      ==============================================================
      Raw Incoming Events:         {{ outputs.sessionize_and_compact_stream.outputs[0].rows[0].raw_incoming_events }}
      Duplicate Replays Dropped:   {{ outputs.sessionize_and_compact_stream.outputs[0].rows[0].duplicate_replays_dropped }}
      Clean Incoming Events:       {{ outputs.sessionize_and_compact_stream.outputs[0].rows[0].clean_incoming_events }}
      Initial Active Events:       {{ outputs.sessionize_and_compact_stream.outputs[0].rows[0].initial_active_events }}
      Prior Mart Sealed Sessions:  {{ outputs.sessionize_and_compact_stream.outputs[0].rows[0].prior_mart_sealed_sessions }}
      Newly Sealed Sessions:       {{ outputs.sessionize_and_compact_stream.outputs[0].rows[0].newly_sealed_sessions_count }}
      Cumulative Mart Sessions:    {{ outputs.sessionize_and_compact_stream.outputs[0].rows[0].cumulative_mart_sessions }}
      Active Sessions Retained:    {{ outputs.sessionize_and_compact_stream.outputs[0].rows[0].active_sessions_retained }}
      In-Batch Conservation Delta: {{ outputs.sessionize_and_compact_stream.outputs[0].rows[0].in_batch_conservation_delta }}
      Mart Active Leaks:           {{ outputs.sessionize_and_compact_stream.outputs[0].rows[0].mart_active_leaks }}
      Average Session Duration:    {{ outputs.sessionize_and_compact_stream.outputs[0].rows[0].avg_duration_seconds }}s
      Bounce Rate:                 {{ outputs.sessionize_and_compact_stream.outputs[0].rows[0].bounce_rate_pct }}%
      Conversion Rate:             {{ outputs.sessionize_and_compact_stream.outputs[0].rows[0].conversion_rate_pct }}%
      Temporal Violations:         {{ outputs.sessionize_and_compact_stream.outputs[0].rows[0].temporal_violations }}
      Bounce Logic Violations:     {{ outputs.sessionize_and_compact_stream.outputs[0].rows[0].bounce_violations }}
      Unmapped Users Detected:     {{ outputs.sessionize_and_compact_stream.outputs[0].rows[0].unmapped_users }}
      Sessionization Invariant:    {{ outputs.sessionize_and_compact_stream.outputs[0].rows[0].invariant_passed ? '[PASS]' : '[FAIL]' }}
      ==============================================================

  - id: sessionization_gate
    type: io.kestra.plugin.core.flow.If
    description: Circuit breaker that publishes verified session marts on pass, or halts execution on invariant violation.
    condition: "{{ outputs.sessionize_and_compact_stream.outputs[0].rows[0].invariant_passed }}"
    then:
      - id: publish_sessions_mart
        type: io.kestra.plugin.core.namespace.UploadFiles
        description: Publishes the cumulative sealed sessionized Parquet mart to Namespace Files for downstream BI and analytical consumption.
        filesMap:
          lakehouse/sessions_mart.parquet: "{{ outputs.sessionize_and_compact_stream.outputFiles['staging_sessions_mart.parquet'] }}"
        namespace: "{{ flow.namespace }}"

      - id: persist_active_buffer
        type: io.kestra.plugin.core.namespace.UploadFiles
        description: Persists the active session buffer in Namespace Files for cross-run state hydration in subsequent runs.
        filesMap:
          lakehouse/state/active_sessions.parquet: "{{ outputs.sessionize_and_compact_stream.outputFiles['staging_active_buffer.parquet'] }}"
        namespace: "{{ flow.namespace }}"

      - id: record_session_manifest
        type: io.kestra.plugin.core.kv.Set
        description: Records production table metadata, session counts, and audit summary in the Kestra KV store.
        key: session_compaction_manifest
        value: |
          {
            "table": "sessions_mart",
            "execution_id": "{{ execution.id }}",
            "timestamp": "{{ execution.startDate }}",
            "cumulative_mart_sessions": {{ outputs.sessionize_and_compact_stream.outputs[0].rows[0].cumulative_mart_sessions }},
            "newly_sealed_sessions": {{ outputs.sessionize_and_compact_stream.outputs[0].rows[0].newly_sealed_sessions_count }},
            "active_sessions_retained": {{ outputs.sessionize_and_compact_stream.outputs[0].rows[0].active_sessions_retained }},
            "prior_mart_sessions": {{ outputs.sessionize_and_compact_stream.outputs[0].rows[0].prior_mart_sealed_sessions }},
            "bounce_rate_pct": {{ outputs.sessionize_and_compact_stream.outputs[0].rows[0].bounce_rate_pct }},
            "conversion_rate_pct": {{ outputs.sessionize_and_compact_stream.outputs[0].rows[0].conversion_rate_pct }},
            "storage_path": "lakehouse/sessions_mart.parquet"
          }
        kvType: JSON
    else:
      - id: halt_corrupt_sessionization
        type: io.kestra.plugin.core.execution.Fail
        errorMessage: "Event Sessionization Invariant Violated! Delta: {{ outputs.sessionize_and_compact_stream.outputs[0].rows[0].in_batch_conservation_delta }}, Mart Leaks: {{ outputs.sessionize_and_compact_stream.outputs[0].rows[0].mart_active_leaks }}, Temporal Violations: {{ outputs.sessionize_and_compact_stream.outputs[0].rows[0].temporal_violations }}, Bounce Violations: {{ outputs.sessionize_and_compact_stream.outputs[0].rows[0].bounce_violations }}, Unmapped Users: {{ outputs.sessionize_and_compact_stream.outputs[0].rows[0].unmapped_users }}."

triggers:
  - id: hourly_compaction_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 * * * *"
    disabled: true

extend:
  title: Dynamic Event Sessionization and Inactivity Compaction with DuckDB
  metaTitle: Event Sessionization & Inactivity Compaction | Kestra Blueprint
  shortDescription: Ingest event streams, stitch active sessions across runs, derive bounce attribution, and compact lakehouse marts in DuckDB with quality gates.
  metaDescription: Ingest event streams, stitch active sessions across runs, derive bounce attribution, and compact lakehouse marts in DuckDB with quality invariant gates.
  description: |
    Clickstream telemetry arrives with out-of-order timestamps, duplicate retries, and variable browsing durations. Fixed tumbling windows arbitrarily split visits across batch boundaries, distorting session durations, bounce rates, and conversion funnels. Traditional SQL approaches rely on quadratic self-joins, while distributed streaming frameworks require dedicated multi-node clusters.

    This blueprint implements an in-engine event sessionization and stateful compaction pipeline using embedded DuckDB. It ingests micro-batch event streams, hydrates both cumulative historical marts and active session buffers across runs via Namespace Files, resolves inactivity timeouts, stitches continuous visits, attributes bounces and conversions, and gates publication on quality invariants before writing to storage and the KV store.

    ## How it works

    1. **Dual State Hydration**: Downloads the cumulative historical session mart (`/lakehouse/sessions_mart.parquet`) and ephemeral active session buffer (`/lakehouse/state/active_sessions.parquet`) from Namespace Files using `DownloadFiles`. On bootstrap, initializes an empty historical schema and seed active visits.
    2. **Demo Staging**: Generates demo Parquet streams when input URIs are empty. Adapts between bootstrap seed data (Batch 1) and incremental cross-run arrivals (Batch 2) featuring session extensions, late purchases, duplicate network retries, and idle timeouts.
    3. **Multi-Tier Sessionization**: Executes window functions in embedded DuckDB:
       - *Transport Dedup*: Drops duplicate replays by event ID, keeping earliest arrival.
       - *Boundary Intervals & Gaps-and-Islands*: Unions active session intervals with incoming events and computes running max end times to identify session boundaries in a single vector pass, eliminating multi-stage join heuristics and supporting multi-session stitching.
       - *Late Infill & Multi-Stitch*: Accurately absorbs late packets arriving inside existing session intervals without spawning overlapping phantom sessions.
       - *Inactivity Sealing*: Partitions sessions into sealed (idle > 30m) and active (in-flight) states.
       - *Cumulative Mart Deduplication*: Merges prior historical mart sessions with newly sealed sessions via `UNION ALL` deduplicated on session ID, strictly isolating active sessions from the mart.
    4. **Reconciliation Invariants**: Verifies row conservation (initial active + clean incoming == active retained + newly sealed events), mart active isolation (0 active leaks in historical mart), temporal monotonicity (session_end >= session_start), and bounce logic consistency.
    5. **Audit Reporting**: Exposes scorecard metrics to flow outputs and logs the complete audit scorecard.
    6. **Gating & Publishing**: `sessionization_gate` publishes the cumulative sealed mart to `/lakehouse/sessions_mart.parquet`, updates the active buffer at `/lakehouse/state/active_sessions.parquet`, and records metadata in the KV store on pass. On failure, `halt_corrupt_sessionization` aborts execution; staging files remain in task outputs for inspection.

    ## What you get

    - Stateful event sessionization without 24/7 Spark or Flink cluster costs.
    - Dual-dataset hydration via Namespace Files preventing boundary fragmentation while accumulating historical records.
    - Monotonic sealed session accumulation in the immutable lakehouse mart with zero active-state leakage.
    - Out-of-order event infill and transport-level network replay deduplication.
    - Automated bounce rate classification and purchase conversion tracking.
    - Row-conservation, active-isolation, and temporal-monotonicity reconciliation gates.
    - Mart publishing to Namespace Files paired with KV store metadata discovery.

    ## Who it's for

    - Analytics engineers transforming raw clickstream into sessionized data marts.
    - Growth and marketing teams tracking conversion attribution and user journeys.
    - Data engineers replacing heavy streaming infrastructure with micro-batch compaction.

    ## Why orchestrate this with Kestra

    - **Embedded Compute**: Runs DuckDB in the Kestra worker with zero external database dependencies.
    - **Stateful Hydration**: Seamlessly hydrates active session buffers and cumulative historical marts between runs using Namespace Files.
    - **Circuit Breaker Gates**: Flow controls (`If` and `Fail`) isolate anomalies before bad metrics reach dashboards.
    - **Catalog White Space**: Introduces event-time sessionization and cumulative micro-batch compaction to the blueprint catalog.

    ## Prerequisites

    - Kestra instance with the DuckDB JDBC plugin (`plugin-jdbc-duckdb`).

    ### Secrets

    - None required.

    ## Quick start

    1. **Run Clean Sessionization**: Execute with default inputs. Run 1 bootstraps initial state, seals 2 inactive visits into `/lakehouse/sessions_mart.parquet`, and retains 4 active sessions in `/lakehouse/state/active_sessions.parquet`. Run 2 hydrates both files, stitches active sessions across runs, seals idle sessions, and monotonically grows the mart to 3 sealed sessions.
    2. **Verify Gate Failure**: Execute with `inject_temporal_anomaly: true`. The pipeline catches unmapped user records and aborts execution via `Fail`. Staging Parquet remains in task storage for inspection.
    3. **Custom Event Streams**: Supply storage URIs in `events_stream_uri`, `active_sessions_uri`, and `historical_mart_uri` to process custom clickstream files.
    4. **Activate the Trigger**: Enable the hourly `Schedule` trigger in the Triggers tab to compact incoming event batches continuously.

    ## How to extend

    - **Automated Scheduling**: Enable the hourly Schedule trigger or attach S3/GCS triggers for event-driven compaction.
    - **Warehouse Sync**: Add downstream Snowflake, BigQuery, or MotherDuck tasks to mirror the compacted mart.
    - **Alerts**: Wire Slack or PagerDuty notification tasks to `sessionization_gate` when invariants fail.

    ## Links

    - [Kestra DuckDB Plugin Documentation](https://kestra.io/plugins/plugin-jdbc-duckdb)
    - [DuckDB Window Functions](https://duckdb.org/docs/sql/window_functions)

