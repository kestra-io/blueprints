id: dangling-cname-takeover-audit
namespace: company.team

description: >
  Resolve every subdomain you list over DNS, follow its CNAME chain, and flag records that point to
  a name that no longer exists or to a cloud service that answers with its "unclaimed" page. These
  are the records an attacker can register and take over. Alert Slack when any are found.

inputs:
  - id: hostnames
    type: ARRAY
    itemType: STRING
    displayName: Hostnames to audit
    description: Fully qualified subdomains to check, for example from your DNS zone export.
    defaults:
      - www.github.com
      - docs.github.com
      - kestra.io

  - id: resolver_url
    type: STRING
    displayName: DNS-over-HTTPS resolver URL
    description: A resolver that returns the JSON format (Cloudflare, Google dns.google/resolve, or your own).
    defaults: https://cloudflare-dns.com/dns-query

tasks:
  - id: resolve_and_probe
    type: io.kestra.plugin.scripts.python.Script
    description: >
      Ask a public DNS-over-HTTPS resolver for each hostname, follow the CNAME chain, and for names
      that end on a takeover-prone provider request the page and look for the provider's unclaimed
      page. A lookup that fails is reported as ERROR, never as safe. Python standard library only.
    containerImage: python:3.12-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    outputFiles:
      - cname-report.md
      - cname-report.json
    script: |
      import http.client
      import json
      import urllib.parse
      import urllib.request

      hostnames = json.loads(r'''{{ inputs.hostnames | toJson }}''')
      resolver_url = "{{ inputs.resolver_url }}"

      # provider domain suffix -> text its unclaimed page shows
      FINGERPRINTS = {
          "github.io": "There isn't a GitHub Pages site here",
          "herokuapp.com": "No such app",
          "herokudns.com": "No such app",
          "amazonaws.com": "NoSuchBucket",
          "surge.sh": "project not found",
          "ghost.io": "The thing you were looking for is no longer here",
          "readme.io": "Project doesnt exist",
          "helpjuice.com": "We could not find what you're looking for",
      }

      def doh(name):
          url = resolver_url + "?" + urllib.parse.urlencode({"name": name, "type": "A"})
          req = urllib.request.Request(url, headers={"accept": "application/dns-json", "User-Agent": "kestra-cname-audit"})
          with urllib.request.urlopen(req, timeout=15) as resp:
              return json.load(resp)

      def page(host):
          conn = http.client.HTTPConnection(host, timeout=15)
          try:
              conn.request("GET", "/", headers={"User-Agent": "kestra-cname-audit"})
              resp = conn.getresponse()
              return resp.status, resp.read(65536).decode("utf-8", "replace")
          finally:
              conn.close()

      results = []
      for host in hostnames:
          host = host.strip().rstrip(".").lower()
          row = {"hostname": host, "chain": [], "status": "OK", "detail": ""}
          try:
              answer = doh(host)
          except Exception as exc:
              row.update(status="ERROR", detail=f"DNS lookup failed: {type(exc).__name__}: {exc}")
              results.append(row)
              continue
          cnames = [a["data"].rstrip(".").lower() for a in answer.get("Answer", []) if a.get("type") == 5]
          row["chain"] = cnames
          final = cnames[-1] if cnames else host
          has_address = any(a.get("type") == 1 for a in answer.get("Answer", []))
          if answer.get("Status") == 3 and cnames:
              row.update(status="DANGLING", detail=f"CNAME points to {final}, which does not exist")
          elif answer.get("Status") == 3:
              row.update(status="NO RECORD", detail="hostname does not exist")
          elif answer.get("Status") not in (0, 3):
              row.update(status="ERROR", detail=f"resolver returned status {answer.get('Status')}")
          else:
              suffix = next((s for s in FINGERPRINTS if final == s or final.endswith("." + s)), None)
              if suffix and has_address:
                  try:
                      code, body = page(host)
                      if FINGERPRINTS[suffix].lower() in body.lower():
                          row.update(status="TAKEOVER RISK", detail=f"{suffix} shows its unclaimed page (HTTP {code})")
                  except Exception as exc:
                      row.update(status="ERROR", detail=f"could not fetch {host}: {type(exc).__name__}: {exc}")
          results.append(row)

      findings = [r for r in results if r["status"] in ("DANGLING", "TAKEOVER RISK", "ERROR")]
      lines = ["| Hostname | Status | CNAME chain | Detail |", "|---|---|---|---|"]
      for r in results:
          lines.append(f"| {r['hostname']} | {r['status']} | {' -> '.join(r['chain']) or '-'} | {r['detail'] or '-'} |")
      with open("cname-report.md", "w") as fh:
          fh.write("\n".join(lines) + "\n")
      with open("cname-report.json", "w") as fh:
          json.dump(results, fh, indent=2)

      summary = "; ".join(f"{r['hostname']}: {r['status']} ({r['detail']})" for r in findings)
      print("::" + json.dumps({"outputs": {
          "findings": len(findings),
          "attention": bool(findings),
          "summary": summary if findings else f"All {len(results)} hostnames resolve cleanly with no takeover risk.",
      }}) + "::")

  - id: needs_attention
    type: io.kestra.plugin.core.flow.If
    description: Alert only when a record is dangling, shows an unclaimed provider page, or could not be checked.
    condition: "{{ outputs.resolve_and_probe.vars.attention }}"
    then:
      - id: alert_slack
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": ":rotating_light: Subdomain takeover audit - {{ outputs.resolve_and_probe.vars.summary }} (execution {{ execution.id }})"
          }
    else:
      - id: log_all_clean
        type: io.kestra.plugin.core.log.Log
        message: "{{ outputs.resolve_and_probe.vars.summary }}"

errors:
  - id: alert_audit_failed
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "Subdomain takeover audit FAILED in flow {{ flow.id }} (execution {{ execution.id }}). Check the task logs."
      }

outputs:
  - id: report
    type: FILE
    value: "{{ outputs.resolve_and_probe.outputFiles['cname-report.md'] }}"

triggers:
  - id: weekly_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 7 * * 1"
    disabled: true

extend:
  title: Find Dangling DNS Records and Subdomain Takeover Risks
  shortDescription: Follows the CNAME chain of every subdomain you list, flags records that point to a name that no longer exists or to an unclaimed cloud service page, and alerts Slack.
  metaTitle: Subdomain Takeover and Dangling CNAME Audit with Kestra
  metaDescription: Resolve your subdomains over DNS, follow CNAME chains and detect dangling records or unclaimed GitHub Pages, Heroku and S3 targets before an attacker does.
  description: |
    A subdomain that still points to a deleted GitHub Pages site, Heroku app or S3 bucket can be claimed by anyone, who then serves content on your domain. This blueprint resolves each hostname you list, follows its CNAME chain, and tells Slack about records that are dangling or that land on a cloud service showing its "unclaimed" page.

    It looks at the live DNS answer and the live page, so it finds forgotten records that no inventory lists.

    ## How it works

    1. `resolve_and_probe` (`io.kestra.plugin.scripts.python.Script`) runs in a Python container and asks a public DNS-over-HTTPS resolver for each hostname.
    2. It follows the CNAME chain. If the chain ends on a name that does not exist, the record is DANGLING.
    3. If the chain ends on a takeover-prone provider (GitHub Pages, Heroku, S3 website, Surge, Ghost, Readme, Helpjuice), it requests the page and looks for that provider's unclaimed-page text. A match is a TAKEOVER RISK.
    4. A lookup that fails is reported as ERROR, never as clean.
    5. `needs_attention` (`io.kestra.plugin.core.flow.If`) alerts Slack only when something needs action. A disabled weekly schedule and a Markdown and JSON report are included.

    ## What you get

    - A table of every hostname with its CNAME chain and status.
    - A Slack alert only for dangling records, takeover risks and lookup errors.
    - A failure alert if the audit itself breaks.

    ## Who it's for

    Security and platform teams that manage many subdomains across teams and cloud accounts.

    ## Why orchestrate this with Kestra

    Subdomain hygiene is a recurring job that needs a schedule, a record of each run and routing to the right channel. Kestra gives you that and lets you feed the hostname list from your DNS provider with one extra task.

    ## Prerequisites

    - A worker that can run Docker task runners.
    - Outbound HTTPS access to the DNS-over-HTTPS resolver (`cloudflare-dns.com` by default) and outbound HTTP access to the hostnames you list.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack incoming webhook that receives the alerts.

    ## Quick start

    1. Add the `SLACK_WEBHOOK_URL` secret.
    2. Replace the `hostnames` input with your own subdomains. Change `resolver_url` if you use another DNS-over-HTTPS resolver.
    3. Run the flow once and read the `report` output.
    4. Remove `disabled: true` from the `weekly_audit` trigger to run it every Monday.

    ## How to extend

    - Export the hostnames from Cloudflare, Route 53 or another DNS API in a first task.
    - Open a ticket per finding instead of a Slack message.
    - Add providers to the fingerprint table in the script.

    ## Links

    - [Kestra Python script plugin](https://kestra.io/plugins/plugin-script-python)
    - [Kestra Slack plugin](https://kestra.io/plugins/plugin-notifications)
    - [can-i-take-over-xyz](https://github.com/EdOverflow/can-i-take-over-xyz)
    - [Cloudflare DNS over HTTPS JSON API](https://developers.cloudflare.com/1.1.1.1/encryption/dns-over-https/make-api-requests/dns-json/)
  tags:
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - Day 2 Operations
  ee: false
  demo: false
