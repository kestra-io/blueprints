id: mysql-missing-primary-key-guard
namespace: company.team

description: |
  Find MySQL tables without a primary key, and non-InnoDB tables. Without a primary key,
  row-based replication scans the whole table on the replica for every changed row, and Group
  Replication and most managed MySQL services refuse writes. Alert Slack, and optionally promote
  a unique index on NOT NULL columns to the primary key online, or add an invisible
  auto-increment id on tables up to a size limit, then audit again to verify. MyISAM tables are
  reported, never converted.

inputs:
  - id: jdbc_url
    type: STRING
    displayName: JDBC URL
    defaults: "jdbc:mysql://localhost:3306/mysql"

  - id: schemas
    type: ARRAY
    itemType: STRING
    displayName: Schemas to check
    defaults:
      - shop

  - id: add_invisible_id
    type: BOOL
    displayName: Add an invisible id when no unique key fits
    description: Adds the invisible `my_row_id` column that sql_generate_invisible_primary_key creates. It is not returned by SELECT *.
    defaults: true

  - id: max_rows_for_id
    type: INT
    displayName: Largest table for the invisible id (rows)
    description: Adding an auto-increment column needs LOCK=SHARED, which blocks writes for the length of the rebuild. Larger tables are reported, to be handled with an online schema change tool.
    defaults: 1000000

  - id: auto_remediate
    type: BOOL
    displayName: Auto remediate
    defaults: false

  - id: dry_run
    type: BOOL
    displayName: Dry run
    description: Must be false, together with auto_remediate, for ALTER TABLE to run.
    defaults: true

variables:
  audit_sql: |
    SELECT CONVERT(t.table_schema USING utf8mb4) AS schema_name, CONVERT(t.table_name USING utf8mb4) AS table_name,
           CONVERT(t.engine USING utf8mb4) AS engine, t.table_rows AS approx_rows,
           CONVERT(CASE WHEN t.engine <> 'InnoDB' THEN 'NON_INNODB_TABLE' ELSE 'NO_PRIMARY_KEY' END USING utf8mb4) AS finding,
           CONVERT(CASE WHEN t.engine <> 'InnoDB' THEN 'MEDIUM' ELSE 'HIGH' END USING utf8mb4) AS severity,
           CONVERT(u.index_name USING utf8mb4) AS candidate_key, CONVERT(u.cols USING utf8mb4) AS candidate_columns,
           CONVERT(CASE
             WHEN t.engine <> 'InnoDB' THEN NULL
             WHEN u.index_name IS NOT NULL THEN CONCAT('ALTER TABLE ', QUOTE_ID_SCHEMA, '.', QUOTE_ID_TABLE, ' ADD PRIMARY KEY (', u.quoted_cols, '), DROP INDEX ', CONCAT('`', REPLACE(u.index_name, '`', '``'), '`'), ', ALGORITHM=INPLACE, LOCK=NONE')
             WHEN {{ inputs.add_invisible_id }} AND t.table_rows <= {{ inputs.max_rows_for_id }} THEN CONCAT('ALTER TABLE ', QUOTE_ID_SCHEMA, '.', QUOTE_ID_TABLE, ' ADD COLUMN my_row_id BIGINT UNSIGNED NOT NULL AUTO_INCREMENT INVISIBLE PRIMARY KEY FIRST, ALGORITHM=INPLACE, LOCK=SHARED')
           END USING utf8mb4) AS fix_sql
      FROM (SELECT tt.*, CONCAT('`', REPLACE(tt.table_schema, '`', '``'), '`') AS QUOTE_ID_SCHEMA, CONCAT('`', REPLACE(tt.table_name, '`', '``'), '`') AS QUOTE_ID_TABLE
              FROM information_schema.tables tt
             WHERE tt.table_type = 'BASE TABLE'
               AND tt.table_schema IN ({{ inputs.schemas | jq('map("\u0027" + gsub("\u0027"; "\u0027\u0027") + "\u0027") | join(",")') | first }})) t
      LEFT JOIN (
        SELECT s.table_schema, s.table_name, s.index_name,
               GROUP_CONCAT(s.column_name ORDER BY s.seq_in_index) AS cols,
               GROUP_CONCAT(CONCAT('`', REPLACE(s.column_name, '`', '``'), '`') ORDER BY s.seq_in_index) AS quoted_cols,
               ROW_NUMBER() OVER (PARTITION BY s.table_schema, s.table_name ORDER BY COUNT(*), s.index_name) AS rk
          FROM information_schema.statistics s
          JOIN information_schema.columns c ON c.table_schema = s.table_schema AND c.table_name = s.table_name AND c.column_name = s.column_name
         WHERE s.non_unique = 0 AND s.index_name <> 'PRIMARY' AND s.sub_part IS NULL
         GROUP BY s.table_schema, s.table_name, s.index_name
        HAVING SUM(c.is_nullable = 'YES') = 0 AND SUM(s.expression IS NOT NULL) = 0
      ) u ON u.table_schema = t.table_schema AND u.table_name = t.table_name AND u.rk = 1
     WHERE t.engine <> 'InnoDB'
        OR NOT EXISTS (SELECT 1 FROM information_schema.table_constraints k
                        WHERE k.table_schema = t.table_schema AND k.table_name = t.table_name AND k.constraint_type = 'PRIMARY KEY')
     ORDER BY severity, schema_name, table_name

tasks:
  - id: audit
    type: io.kestra.plugin.jdbc.mysql.Query
    description: Read-only query on information_schema. Identifiers are quoted with backticks, embedded backticks doubled.
    url: "{{ inputs.jdbc_url }}"
    username: "{{ secret('MYSQL_USERNAME') }}"
    password: "{{ secret('MYSQL_PASSWORD') }}"
    fetchType: FETCH
    sql: "{{ render(vars.audit_sql) }}"

  - id: summary
    type: io.kestra.plugin.core.log.Log
    message: >-
      MySQL primary key audit on {{ inputs.schemas | join(', ') }}: {{ outputs.audit.size }} findings.
      {% for r in outputs.audit.rows %}{{ r.severity }} {{ r.finding }} {{ r.schema_name }}.{{ r.table_name }} ({{ r.engine }}, ~{{ r.approx_rows }} rows): {{ (r.candidate_key ?? '') != '' ? 'promote unique key ' ~ r.candidate_key ~ ' (' ~ r.candidate_columns ~ '), online' : ((r.fix_sql ?? '') != '' ? 'add invisible my_row_id, blocks writes during the rebuild' : 'report only') }}. {% endfor %}

  - id: route
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.audit.size > 0 }}"
    then:
      - id: alert
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {{ {'text': 'MySQL ' ~ inputs.jdbc_url ~ ': ' ~ (outputs.audit.rows | jq('map("\(.severity) \(.finding) \(.schema_name).\(.table_name)") | join(", ")') | first) ~ '. Tables without a primary key slow row-based replication and are rejected by Group Replication.' ~ (inputs.auto_remediate and not inputs.dry_run ? ' Adding primary keys now.' : ' No change applied (auto_remediate=' ~ inputs.auto_remediate ~ ', dry_run=' ~ inputs.dry_run ~ ').')} | toJson }}

      - id: remediate_gate
        type: io.kestra.plugin.core.flow.If
        condition: "{{ inputs.auto_remediate and not inputs.dry_run and outputs.audit.rows | jq('map(select(.fix_sql != null)) | length') | first > 0 }}"
        then:
          - id: remediate
            type: io.kestra.plugin.core.flow.Loop
            description: One online ALTER TABLE at a time.
            concurrencyLimit: 1
            values: "{{ outputs.audit.rows | jq('map(select(.fix_sql != null) | .fix_sql)') | first | toJson }}"
            tasks:
              - id: fix
                type: io.kestra.plugin.jdbc.mysql.Query
                allowFailure: true
                url: "{{ inputs.jdbc_url }}"
                username: "{{ secret('MYSQL_USERNAME') }}"
                password: "{{ secret('MYSQL_PASSWORD') }}"
                fetchType: NONE
                sql: "{{ item.value }}"

          - id: reaudit
            type: io.kestra.plugin.jdbc.mysql.Query
            url: "{{ inputs.jdbc_url }}"
            username: "{{ secret('MYSQL_USERNAME') }}"
            password: "{{ secret('MYSQL_PASSWORD') }}"
            fetchType: FETCH
            sql: "{{ render(vars.audit_sql) }}"

          - id: verify_result
            type: io.kestra.plugin.core.flow.If
            condition: >-
              {{ {'b': outputs.audit.rows, 'a': outputs.reaudit.rows ?? []} | jq('([.a[] | .schema_name + "." + .table_name]) as $a
                 | [.b[] | select(.fix_sql != null) | .schema_name + "." + .table_name | select(. as $x | $a | index($x))] | length') | first > 0 }}
            then:
              - id: remediation_failed
                type: io.kestra.plugin.core.execution.Fail
                errorMessage: "Some tables still have no primary key: {{ outputs.reaudit.rows | jq('map(select(.fix_sql != null) | \"\\(.schema_name).\\(.table_name)\") | join(\", \")') | first }}. Check the remediate logs (duplicates, NULLs or missing ALTER privilege)."
            else:
              - id: remediated
                type: io.kestra.plugin.core.log.Log
                message: >-
                  Primary keys added and verified: {{ outputs.audit.rows | jq('map(select(.fix_sql != null) | "\(.schema_name).\(.table_name)") | join(", ")') | first }}.
                  Left for review: {{ outputs.reaudit.rows | jq('if length == 0 then "none" else map("\(.finding) \(.schema_name).\(.table_name)") | join(", ") end') | first }}.
    else:
      - id: clean
        type: io.kestra.plugin.core.log.Log
        message: "Every table in {{ inputs.schemas | join(', ') }} is InnoDB with a primary key."

errors:
  - id: alert_flow_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {{ {'text': 'MySQL missing primary key guard failed on ' ~ inputs.jdbc_url ~ ' (execution ' ~ execution.id ~ '). Check the logs.'} | toJson }}

triggers:
  - id: weekly
    type: io.kestra.plugin.core.trigger.Schedule
    description: Shipped disabled, and always in safe mode.
    cron: "0 4 * * 2"
    disabled: true
    inputs:
      auto_remediate: false
      dry_run: true

extend:
  title: MySQL Missing Primary Key Guard
  shortDescription: Find MySQL tables without a primary key and non-InnoDB tables, alert Slack, and optionally promote a unique NOT NULL key or add an invisible id column, then verify.
  metaTitle: MySQL Missing Primary Key Guard with Kestra
  metaDescription: Find MySQL tables with no primary key, alert Slack, promote a unique NOT NULL key online or add an invisible id, and verify with a second audit.
  description: |
    A MySQL table without a primary key works until it meets replication:
    - With row-based binary logging, each `UPDATE` or `DELETE` on the source becomes a full table scan on the replica, row by row, and replica lag grows with the table.
    - Group Replication, and managed services that run it (Azure, some HA setups), reject writes to such tables outright.
    - InnoDB still needs a clustered index, so it uses a hidden row id you cannot see or use.

    Legacy schemas, ETL staging tables and "temporary" tables that stayed are the usual cases.

    This blueprint finds those tables, and MyISAM or other non-InnoDB tables, in the schemas you choose. It alerts Slack, and can give each InnoDB table a primary key, then audit again to verify. It uses the least disruptive fix available:
    - **unique key on NOT NULL columns:** promote it to the primary key with online DDL;
    - **otherwise:** add the invisible `my_row_id` column that MySQL 8.0.30's `sql_generate_invisible_primary_key` would have created.

    This blueprint was created by [zkasuran](https://github.com/zkasuran).

    ## Findings

    | Finding | Severity | Fix |
    |---|---|---|
    | `NO_PRIMARY_KEY` with a unique key on `NOT NULL` columns | High | `ADD PRIMARY KEY (cols), DROP INDEX uq`, `ALGORITHM=INPLACE, LOCK=NONE` |
    | `NO_PRIMARY_KEY` with no such key, up to `max_rows_for_id` rows | High | `ADD COLUMN my_row_id BIGINT UNSIGNED NOT NULL AUTO_INCREMENT INVISIBLE PRIMARY KEY FIRST`, `LOCK=SHARED` |
    | `NO_PRIMARY_KEY` above `max_rows_for_id` | High | Report only, use an online schema change tool |
    | `NON_INNODB_TABLE` | Medium | Report only, converting the engine is a migration |

    A unique key qualifies only if it has no nullable column, no prefix and no expression. The smallest one wins. MySQL refuses `LOCK=NONE` when adding an auto-increment column, so that change blocks writes for the length of the rebuild. The flow says so, and `max_rows_for_id` keeps it to tables where that is acceptable.

    ## How it works

    1. `audit` (`io.kestra.plugin.jdbc.mysql.Query`, read-only) reads `information_schema.tables`, `table_constraints`, `statistics` and `columns` for the chosen schemas. It returns each finding with its candidate key and fix. Names are quoted with backticks, with embedded backticks doubled.
    2. `summary` logs every finding and the fix it will get.
    3. `route` (`io.kestra.plugin.core.flow.If`):
       - **clean:** logs it.
       - **findings:** `alert` posts to Slack.
         - `remediate_gate` runs only when `auto_remediate` is true and `dry_run` is false.
         - `remediate` (`io.kestra.plugin.core.flow.Loop`, `concurrencyLimit: 1`) runs one `ALTER TABLE` at a time.
         - `reaudit` and `verify_result` fail if a fixed table still has no primary key.
    4. `errors` alerts Slack when the audit cannot run.

    ## What you get

    - Every table that slows replication or blocks a move to Group Replication, with its size.
    - The least disruptive primary key for each table, chosen from its existing indexes first.
    - Invisible ids that `SELECT *` does not return, so applications keep working, and a second audit as proof.

    ## Who it's for

    - Teams preparing a move to MySQL Group Replication, InnoDB Cluster or a managed MySQL service.
    - DBAs chasing replica lag caused by row-based replication on keyless tables.
    - Teams evaluating the MySQL plugin who want an example of an `information_schema` query driving DDL.

    ## Why orchestrate this with Kestra

    The query finds the tables once. Kestra runs it every week as new tables appear, sends findings to Slack, and applies the DDL behind `auto_remediate` and `dry_run`, one table at a time. It verifies the result and keeps a history of which table got which key.

    ## Tested end to end

    On Kestra 2.0.5 OSS against MySQL 8.4, with a local HTTP sink standing in for Slack. Schema `shop`:
    - `inventory`: 8,000 rows, unique key on two `NOT NULL` columns;
    - `order_log`: 5,000 rows, unique key with a nullable column;
    - `page_views`: 30,000 rows, no key;
    - `` weird`name ``: no key;
    - `sessions`: MyISAM;
    - `products`: has a primary key.

    | Run | Inputs | Result |
    |---|---|---|
    | 1 | dry run | 5 findings. `inventory` gets the promotion of `uq_sku_wh`. `order_log`'s key is rejected because `event` is nullable. `products` not flagged |
    | 2 | remediate, first version | `verify_result` failed on 3 tables: MySQL answered `LOCK=NONE is not supported ... Adding an auto-increment column requires a lock`. The invisible id now uses `LOCK=SHARED` and a row limit |
    | 3 | remediate, `max_rows_for_id: 20000` | `order_log` and `` weird`name `` get `my_row_id`, `page_views` (30,000 rows) is held back. Verified. `SELECT *` on `order_log` still returns only its 3 original columns |
    | 4 | remediate, default limit | `page_views` gets `my_row_id`, verified |
    | 5 | dry run | Only the MyISAM table left, report only |
    | 6 | unreachable server | `errors` alert sent |

    ## Prerequisites

    - MySQL 8.0.23 or later, for invisible columns, reachable from the Kestra worker.
    - For the audit, `SELECT` on `information_schema`. For remediation, `ALTER` on the tables.
    - Replicas apply the same DDL, so expect the rebuild time on each of them too.
    - Local testing: `docker run -d --name mysql -p 3306:3306 -e MYSQL_ROOT_PASSWORD=pw mysql:8.4`, then create tables without a `PRIMARY KEY`.

    ### Secrets

    - `MYSQL_USERNAME` / `MYSQL_PASSWORD`: credentials used by every query.
    - `SLACK_WEBHOOK_URL`: used by `alert` and the `errors` block.
    - In Kestra OSS, provide each one as a base64-encoded environment variable prefixed `SECRET_`.

    ### Inputs

    | Input | Default | Purpose |
    |---|---|---|
    | `jdbc_url` | `jdbc:mysql://localhost:3306/mysql` | Server |
    | `schemas` | `[shop]` | Schemas to check |
    | `add_invisible_id` | `true` | Add `my_row_id` when no unique key fits |
    | `max_rows_for_id` | `1000000` | Largest table that gets `my_row_id` |
    | `auto_remediate` | `false` | Allow `ALTER TABLE` |
    | `dry_run` | `true` | Must be `false` for a statement to run |

    ## Quick start

    1. Add the `MYSQL_USERNAME`, `MYSQL_PASSWORD` and `SLACK_WEBHOOK_URL` secrets.
    2. Import the flow and set `jdbc_url` and `schemas`.
    3. Run it once and read the fix planned for each table.
    4. Run it with `auto_remediate: true` and `dry_run: false` in a maintenance window, with `max_rows_for_id` set to what a write block of a few seconds allows.
    5. Enable the `weekly` trigger, which always runs in safe mode.

    ## How to extend

    - Hand the tables above `max_rows_for_id` to `gh-ost` or `pt-online-schema-change` from a task in the same flow.
    - Turn on `sql_generate_invisible_primary_key` so new tables get a key automatically.
    - Check the replicas' lag before and after each `ALTER` and pause when it grows.
    - Loop over a list of JDBC URLs to check every server.

    ## Links

    - Generated invisible primary keys: https://dev.mysql.com/doc/refman/8.4/en/create-table-gipks.html
    - MySQL plugin: https://kestra.io/plugins/plugin-jdbc-mysql
  tags:
    - Data
    - Infrastructure
  subTags:
