id: openobserve-log-stream-and-error-surge-sentinel
namespace: company.sre

inputs:
  - id: openobserve_url
    type: STRING
    defaults: http://localhost:5080
    description: Base URL of the OpenObserve instance.

  - id: organization_id
    type: STRING
    defaults: default
    description: Target OpenObserve organization identifier.

  - id: stream_name
    type: STRING
    defaults: default
    description: Target log stream to inspect for error surges.

  - id: error_threshold
    type: INT
    defaults: 25
    description: Maximum allowable error log entries in the 15-minute evaluation window before triggering an alert.

  - id: slack_channel
    type: STRING
    defaults: "#ops-alerts"
    description: Destination Slack channel for operational warnings and critical outages.

tasks:
  - id: probe_openobserve_health
    type: io.kestra.plugin.core.http.Request
    method: GET
    uri: "{{ inputs.openobserve_url }}/healthz"
    description: Validates OpenObserve cluster node availability and liveness status.

  - id: query_error_stream
    type: io.kestra.plugin.core.http.Request
    method: POST
    uri: "{{ inputs.openobserve_url }}/api/{{ inputs.organization_id }}/{{ inputs.stream_name }}/_search"
    headers:
      Authorization: "Basic {{ secret('OPENOBSERVE_AUTH_TOKEN') }}"
      Content-Type: application/json
    contentType: application/json
    body: |
      {
        "query": {
          "sql": "SELECT COUNT(*) as error_count FROM {{ inputs.stream_name }} WHERE log_level = 'error' AND _timestamp > NOW() - INTERVAL 15 MINUTE"
        }
      }
    description: Executes a SQL query against OpenObserve to measure recent error log frequency.

  - id: evaluate_ingestion_health
    type: io.kestra.plugin.core.flow.Switch
    value: "{{ (outputs.probe_openobserve_health.code != 200) ? 'CRITICAL' : ((outputs.query_error_stream.body.total ?? 0) > inputs.error_threshold ? 'SURGE' : 'HEALTHY') }}"
    description: Evaluates HTTP probe status and error counts against operational thresholds.
    cases:
      CRITICAL:
        - id: alert_slack_critical
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "channel": "{{ inputs.slack_channel }}",
              "text": "[CRITICAL] OpenObserve cluster node health probe failed on endpoint {{ inputs.openobserve_url }}. HTTP status code: {{ outputs.probe_openobserve_health.code }}."
            }
          description: Dispatches high-severity outage notification to Slack when node probe fails.

      SURGE:
        - id: alert_slack_surge
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "channel": "{{ inputs.slack_channel }}",
              "text": "[WARNING] OpenObserve error surge detected on stream '{{ inputs.stream_name }}'. Observed errors in last 15 minutes: {{ outputs.query_error_stream.body.total ?? 0 }} (Threshold: {{ inputs.error_threshold }})."
            }
          description: Sends warning notification to Slack when error volume exceeds threshold.

      HEALTHY:
        - id: log_healthy_state
          type: io.kestra.plugin.core.log.Log
          message: "OpenObserve instance is operational. Stream '{{ inputs.stream_name }}' error volume is within nominal limits."
          description: Emits normal status confirmation when checks pass.

  - id: audit_sentinel_run
    type: io.kestra.plugin.core.log.Log
    message: "OpenObserve Sentinel complete. Probe Status: {{ outputs.probe_openobserve_health.code }}, Stream: {{ inputs.stream_name }}, Errors: {{ outputs.query_error_stream.body.total ?? 0 }}, Assessment: {{ (outputs.probe_openobserve_health.code != 200) ? 'CRITICAL' : ((outputs.query_error_stream.body.total ?? 0) > inputs.error_threshold ? 'SURGE' : 'HEALTHY') }}."
    description: Emits an immutable structured audit log entry for historical telemetry and compliance.

triggers:
  - id: hourly_sentinel_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 * * * *"
    description: Executes periodic continuous monitoring probe on an hourly cadence.

extend:
  title: OpenObserve Log Stream and Error Surge Sentinel
  metaTitle: OpenObserve Log Stream and Error Surge Sentinel | Kestra
  shortDescription: Continuously probe OpenObserve cluster health, analyze log stream error rates, and route incident notifications to Slack.
  metaDescription: Monitor OpenObserve cluster node health and stream error surges, evaluate thresholds with Pebble, and dispatch incident alerts to Slack with Kestra.
  description: |
    Automated health gate and error surge sentinel for OpenObserve observability clusters. This workflow continuously probes cluster node availability, queries recent error ingestion counts via Log SQL, classifies cluster state using declarative Pebble logic, and dispatches incident notifications to Slack.

    ## How it works

    1. Scheduled trigger initiates the sentinel routine every hour (or manually on demand with custom parameters).
    2. Probes the OpenObserve `/healthz` HTTP endpoint to verify node availability and HTTP response status.
    3. Executes a Log SQL search query via the OpenObserve REST search API to count error logs ingested over the preceding 15-minute window.
    4. Evaluates cluster responsiveness and error thresholds using a declarative Pebble expression inside a Switch task.
    5. Branches conditionally to notify Slack on critical node downtime or elevated error surges, or logs an operational status confirmation when healthy.
    6. Emits an immutable audit log entry capturing response codes, stream identifiers, error counts, and overall health status.

    ## What you get

    - Early detection of OpenObserve node unresponsiveness or infrastructure degradation.
    - Automated detection of application error bursts across microservices and log streams.
    - Immediate incident notifications sent to designated Slack operational channels.
    - Centralized audit trail with structured execution history for compliance and SLA tracking.

    ## Who it's for

    - Site Reliability Engineers (SREs) monitoring distributed log management systems.
    - DevOps Teams operating self-hosted OpenObserve or Kubernetes logging pipelines.
    - Platform Engineers seeking automated health gates and anomaly alerting.

    ## Why orchestrate this with Kestra

    - Declarative YAML definition eliminates fragile custom shell scripts and opaque cron configurations.
    - Native Pebble expression language handles robust state classification without external dependencies.
    - Secure credential management injects API tokens and webhooks via encrypted secret stores.
    - Rich UI provides full observability, task-level execution timings, and retry capabilities.

    ## Prerequisites

    - Accessible OpenObserve instance (local Docker container, VM, or Kubernetes cluster).
    - Valid OpenObserve user account or service token with read access to target streams.
    - Slack Incoming Webhook URL configured for incident channel notifications.

    ### Secrets

    - `OPENOBSERVE_AUTH_TOKEN`: Base64-encoded credentials (username:password) or API token for authenticating OpenObserve REST requests.
    - `SLACK_WEBHOOK_URL`: HTTPS endpoint for posting notifications to the operations Slack channel.

    ## Quick start

    1. Set the required secrets in your Kestra namespace (`OPENOBSERVE_AUTH_TOKEN` and `SLACK_WEBHOOK_URL`).
    2. Import this flow into Kestra and click **Execute** with default parameters to test cluster connectivity.
    3. Inspect task outputs to ensure the `/healthz` probe returns HTTP 200 and the query completes.
    4. Enable the `hourly_sentinel_schedule` trigger to run automated checks continuously.

    ## How to extend

    - Add an automated PagerDuty or Opsgenie webhook branch for high-priority off-hours escalation.
    - Integrate container restart remediation tasks using Kestra Docker or Kubernetes plugins when node health fails.
    - Expand SQL queries to calculate error-to-info ratios across multiple application streams in parallel.

    ## Links

    - [Kestra HTTP Plugin](https://kestra.io/plugins/plugin-core/tasks/http/io.kestra.plugin.core.http.request)
    - [Kestra Slack Plugin](https://kestra.io/plugins/plugin-slack/tasks/notifications/io.kestra.plugin.slack.notifications.slackincomingwebhook)
    - [OpenObserve Documentation](https://openobserve.ai/docs/)
  tags:
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - Incident Response
  ee: false
  demo: false
