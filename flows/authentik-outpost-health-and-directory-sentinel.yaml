id: authentik-outpost-health-and-directory-sentinel
namespace: company.team

description: |
  Audits Authentik identity provider core availability, monitors outpost connectivity and heartbeat status over REST APIs, classifies service health, and alerts engineering teams via Slack.

triggers:
  - id: every_15_minutes
    type: io.kestra.plugin.core.trigger.Schedule
    description: Executes automated Authentik core and outpost health audits every 15 minutes.
    cron: "*/15 * * * *"
    disabled: true
    inputs:
      authentik_host: "authentik-server"
      authentik_port: 9000
      min_expected_outposts: 1

inputs:
  - id: authentik_host
    type: STRING
    displayName: Authentik Hostname
    description: Hostname or IP address of the Authentik core server reachable by the Kestra worker.
    defaults: "authentik-server"

  - id: authentik_port
    type: INT
    displayName: Authentik HTTP Port
    description: HTTP port of the Authentik API service (defaults to 9000).
    defaults: 9000

  - id: min_expected_outposts
    type: INT
    displayName: Minimum Expected Outposts
    description: Threshold of active registered outpost instances below which a WARNING alert is dispatched. Set to 0 to disable minimum outpost checks.
    defaults: 1

tasks:
  - id: probe_authentik_version
    type: io.kestra.plugin.core.http.Request
    description: Probes the Authentik administrative version endpoint to verify core process health and API responsiveness.
    uri: "http://{{ inputs.authentik_host }}:{{ inputs.authentik_port }}/api/v3/admin/version/"
    method: GET
    headers:
      Authorization: "Bearer {{ secret('AUTHENTIK_API_TOKEN') }}"
      Accept: "application/json"
    options:
      allowFailed: true
    allowFailure: true

  - id: probe_authentik_outposts
    type: io.kestra.plugin.core.http.Request
    description: Retrieves registered outpost instances (proxy, LDAP, RADIUS) to inspect active connections and inventory.
    uri: "http://{{ inputs.authentik_host }}:{{ inputs.authentik_port }}/api/v3/outposts/instances/"
    method: GET
    headers:
      Authorization: "Bearer {{ secret('AUTHENTIK_API_TOKEN') }}"
      Accept: "application/json"
    options:
      allowFailed: true
    allowFailure: true

  - id: probe_authentik_system
    type: io.kestra.plugin.core.http.Request
    description: Queries Authentik system diagnostics including database connectivity, cache health, and background worker queues.
    uri: "http://{{ inputs.authentik_host }}:{{ inputs.authentik_port }}/api/v3/admin/system/"
    method: GET
    headers:
      Authorization: "Bearer {{ secret('AUTHENTIK_API_TOKEN') }}"
      Accept: "application/json"
    options:
      allowFailed: true
    allowFailure: true

  - id: classify_outpost_status
    type: io.kestra.plugin.core.debug.Return
    description: Classifies Authentik infrastructure state into HEALTHY, WARNING, PROBE_FAILED, or CORE_UNREACHABLE based on HTTP codes and outpost inventory.
    format: "{{ (outputs.probe_authentik_version.code is not defined or outputs.probe_authentik_version.code != 200) ? 'CORE_UNREACHABLE' : ( (outputs.probe_authentik_outposts.code is not defined or outputs.probe_authentik_outposts.code != 200) ? 'PROBE_FAILED' : ( ((outputs.probe_authentik_outposts.body | json | jq('.results | length') | first) < inputs.min_expected_outposts) ? 'WARNING' : 'HEALTHY' ) ) }}"

  - id: route_by_outpost_status
    type: io.kestra.plugin.core.flow.Switch
    description: Routes execution based on the classified Authentik health state.
    value: "{{ outputs.classify_outpost_status.value }}"
    cases:
      "HEALTHY":
        - id: log_healthy_state
          type: io.kestra.plugin.core.log.Log
          message: "Authentik core on {{ inputs.authentik_host }}:{{ inputs.authentik_port }} is HEALTHY. Discovered {{ outputs.probe_authentik_outposts.body | json | jq('.results | length') | first }} active outpost instance(s). Current version: {{ outputs.probe_authentik_version.body | json | jq('.version_current') | first }}."

      "WARNING":
        - id: alert_warning_slack
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK') }}"
          payload: |
            {{ {"text": "Authentik Sentinel WARNING on " ~ inputs.authentik_host ~ ":" ~ inputs.authentik_port ~ ". Found " ~ (outputs.probe_authentik_outposts.body | json | jq('.results | length') | first) ~ " outpost(s), below minimum expected threshold of " ~ inputs.min_expected_outposts ~ ". Execution: " ~ execution.id ~ "."} | toJson }}

        - id: log_warning_diagnostic
          type: io.kestra.plugin.core.log.Log
          message: "Authentik outpost count warning: Expected at least {{ inputs.min_expected_outposts }}, found {{ outputs.probe_authentik_outposts.body | json | jq('.results | length') | first }}."

      "PROBE_FAILED":
        - id: alert_probe_failed_slack
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK') }}"
          payload: |
            {{ {"text": "Authentik Sentinel PROBE_FAILED on " ~ inputs.authentik_host ~ ":" ~ inputs.authentik_port ~ ". Version endpoint succeeded but outposts query failed with HTTP " ~ outputs.probe_authentik_outposts.code ~ ". Check AUTHENTIK_API_TOKEN permissions. Execution: " ~ execution.id ~ "."} | toJson }}

      "CORE_UNREACHABLE":
        - id: alert_unreachable_slack
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK') }}"
          payload: |
            {{ {"text": "Authentik Sentinel CORE_UNREACHABLE. Cannot reach http://" ~ inputs.authentik_host ~ ":" ~ inputs.authentik_port ~ "/api/v3/admin/version/. Authentik server is offline or network partitioned. Execution: " ~ execution.id ~ "."} | toJson }}

  - id: log_audit_summary
    type: io.kestra.plugin.core.output.OutputValues
    description: Exports structured telemetry and audit metrics for compliance dashboards and reporting.
    values:
      health_status: "{{ outputs.classify_outpost_status.value }}"
      authentik_host: "{{ inputs.authentik_host }}"
      outpost_count: "{{ outputs.probe_authentik_outposts.body | json | jq('.results | length') | first ?? 0 }}"
      authentik_version: "{{ outputs.probe_authentik_version.body | json | jq('.version_current') | first ?? 'UNKNOWN' }}"
      min_expected_outposts: "{{ inputs.min_expected_outposts }}"

errors:
  - id: alert_flow_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Dispatches a high-priority Slack notification if an unhandled error halts sentinel execution.
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {{ {"text": "Authentik Sentinel workflow error during execution " ~ execution.id ~ " in namespace " ~ flow.namespace ~ "."} | toJson }}

extend:
  title: Authentik Outpost Health and Directory Sentinel
  metaTitle: Authentik Outpost Health and Directory Sentinel | Kestra
  shortDescription: Continuous REST API health auditing, outpost instance monitoring, and Slack alerting for Authentik SSO identity platforms.
  metaDescription: Audit Authentik SSO identity provider health, monitor outpost connectivity, classify authentication cluster availability, and alert Slack via Kestra.
  description: |
    Continuously audits Authentik identity and access management (IAM) platforms by probing core REST endpoints, validating outpost instances (Proxy, LDAP, RADIUS), classifying authentication cluster health, and routing incident alerts to Slack.

    ## How it works

    1. `probe_authentik_version` queries the `/api/v3/admin/version/` endpoint using an API bearer token to verify Authentik core responsiveness and software release status.
    2. `probe_authentik_outposts` queries `/api/v3/outposts/instances/` to discover all deployed outpost integrations, extracting active instance counts and protocol types.
    3. `probe_authentik_system` queries `/api/v3/admin/system/` to retrieve backend diagnostics including PostgreSQL latency and Redis task queue responsiveness.
    4. `classify_outpost_status` evaluates response codes and registered instance totals through a Pebble conditional expression, classifying status into `HEALTHY`, `WARNING`, `PROBE_FAILED`, or `CORE_UNREACHABLE`.
    5. `route_by_outpost_status` branches workflow execution based on the classification:
       - `HEALTHY`: Logs current Authentik version, active outpost counts, and system status.
       - `WARNING`: Dispatches a Slack notification warning operations teams that deployed outposts have fallen below the expected threshold.
       - `PROBE_FAILED`: Alerts engineers that the API token lacks required read permissions for outpost objects.
       - `CORE_UNREACHABLE`: Dispatches an incident alert notifying on-call engineers that the Authentik core server is completely unreachable.
    6. `log_audit_summary` records structured outputs capturing cluster health and outpost counts for audit compliance.
    7. `errors` captures unexpected task exceptions and posts a high-priority incident notice to Slack.

    ## What you get

    - Automated, continuous validation of Authentik IAM infrastructure without external proprietary agents.
    - Early detection of disconnected proxy, LDAP, or RADIUS outposts before end users experience single sign-on (SSO) authentication failures.
    - Instant Slack alerts providing execution IDs, unreachable endpoints, and diagnostic context.
    - Centralized audit tracking of identity provider versioning and infrastructure state.
    - Fully automated scheduling coupled with on-demand manual trigger capabilities.

    ## Who it's for

    - Platform Engineers and Site Reliability Engineers operating Authentik as their primary SSO / IdP provider.
    - Security and Identity Engineers managing zero-trust reverse proxies, LDAP outposts, and directory sync.
    - DevSecOps teams responsible for maintaining high availability for corporate authentication services.

    ## Why orchestrate this with Kestra

    Identity providers like Authentik are mission-critical: an outage in core services or disconnected outposts immediately halts employee logins and automated API access across an organization. Relying on manual checks or isolated shell cron jobs creates blind spots and lacks durable execution tracking. Kestra provides declarative, auditable orchestration with centralized secret management, robust HTTP probing, dynamic status classification, and immediate failure alerting.

    ## Prerequisites

    - A running Authentik server instance with HTTP access from the Kestra worker.
    - An Authentik API service account token with read permissions for the `/api/v3/` endpoints.
    - An incoming Slack webhook URL for alert delivery.

    ### Secrets

    - `AUTHENTIK_API_TOKEN`: Authentik bearer token used to authenticate REST API requests against administrative endpoints.
    - `SLACK_WEBHOOK`: Incoming Slack webhook URL used by `alert_warning_slack`, `alert_probe_failed_slack`, `alert_unreachable_slack`, and the `errors` handler.

    ## Quick start

    1. Generate an API token in the Authentik Admin interface under System > Tokens & Credentials.
    2. Add `AUTHENTIK_API_TOKEN` and `SLACK_WEBHOOK` as secrets within your Kestra namespace.
    3. Start a local Authentik instance using Docker:
       ```bash
       docker run -d --name authentik -p 9000:9000 ghcr.io/goauthentik/server:latest server
       ```
    4. Run this flow manually in Kestra with `authentik_host: "localhost"` or `"authentik"` to verify connectivity and outpost discovery.
    5. Enable the `every_15_minutes` trigger to automate continuous background monitoring.

    ## How to extend

    - Add nested HTTP calls to `/api/v3/outposts/instances/{pk}/health/` to inspect individual outpost heartbeat timestamps (`last_seen`) and flag stale instances.
    - Integrate with PagerDuty or Opsgenie using dedicated Kestra notification plugins for automated on-call incident escalation.
    - Add a remediation task to trigger outpost container restarts via the Docker or Kubernetes plugin when an outpost reports an unhealthy state.
    - Track failed user logins and account lockout events by querying `/api/v3/events/events/`.

    ## Links

    - [Authentik Documentation](https://goauthentik.io/docs/)
    - [Authentik REST API Reference](https://goauthentik.io/api/)
    - [Authentik Outpost Architecture](https://goauthentik.io/docs/outposts/)
    - [Kestra HTTP Plugin Documentation](https://kestra.io/plugins/plugin-core/tasks/http/io.kestra.plugin.core.http.request)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
