id: couchbase-primary-index-production-antipattern-guard
namespace: company.team
concurrency:
  limit: 1
  behavior: QUEUE

inputs:
  - id: connection_string
    type: STRING
    defaults: couchbase://localhost
    description: One Query node connection, keep the prepared cache and verification on the same node.
  - id: username
    type: SECRET
    defaults: "{{ secret('COUCHBASE_USERNAME') }}"
  - id: password
    type: SECRET
    defaults: "{{ secret('COUCHBASE_PASSWORD') }}"
  - id: bucket
    type: STRING
    defaults: application
  - id: scope
    type: STRING
    defaults: _default
  - id: collection
    type: STRING
    defaults: _default
  - id: prepared_name
    type: STRING
    defaults: application_lookup
    description: Existing named PREPARE for this exact fixed query shape, never an arbitrary cached query.
  - id: approved_index
    type: STRING
    defaults: lookup_cover
    description: Existing online covering GSI whose use was approved for this lookup.
  - id: equality_field
    type: STRING
    defaults: kind
  - id: projection_field
    type: STRING
    defaults: label
  - id: lookup_value
    type: STRING
    defaults: active
    description: String equality value, encoded as JSON rather than SQL text.
  - id: row_limit
    type: INT
    defaults: 20
  - id: dry_run
    type: BOOL
    defaults: true
  - id: auto_remediate
    type: BOOL
    defaults: false
  - id: slack_webhook
    type: SECRET
    defaults: "{{ secret('SLACK_WEBHOOK_URL') }}"

variables:
  keyspace: >-
    `{{ inputs.bucket | replace({'`': '``'}) }}`.`{{ inputs.scope | replace({'`': '``'}) }}`.`{{ inputs.collection | replace({'`': '``'}) }}`
  lookup: >-
    SELECT META(d).id AS id, d.`{{ inputs.projection_field }}` AS projected FROM {{ render(vars.keyspace) }} AS d WHERE d.`{{ inputs.equality_field }}`={{ inputs.lookup_value | toJson }} ORDER BY id LIMIT {{ inputs.row_limit }}
  prepare: >-
    PREPARE {{ inputs.prepared_name }} AS {{ render(vars.lookup) }}
  policy_jq: >-
    def covered: [.[] | .. | objects] as $n | any($n[]; .using == "gsi" and .index == $index and (.covers // [] | length) > 0) and all($n[]; .["#operator"] != "Fetch" and ((.["#operator"] // "") | startswith("PrimaryScan") | not)); covered

tasks:
  - id: validate_inputs
    type: io.kestra.plugin.core.flow.If
    condition: >-
      {{ inputs.row_limit < 1 or inputs.row_limit > 100 or inputs.lookup_value | length > 256 or inputs.bucket | length < 1 or inputs.bucket | length > 100 or inputs.scope | length < 1 or inputs.scope | length > 100 or inputs.collection | length < 1 or inputs.collection | length > 100 or inputs.prepared_name | length < 1 or inputs.prepared_name | length > 100 or inputs.approved_index | length < 1 or inputs.approved_index | length > 100 or inputs.equality_field | length < 1 or inputs.equality_field | length > 64 or inputs.projection_field | length < 1 or inputs.projection_field | length > 64 or (inputs.prepared_name | replace({'^[A-Za-z][A-Za-z0-9_]*$': ''}, regexp=true)) | length > 0 or (inputs.approved_index | replace({'^[A-Za-z][A-Za-z0-9_#-]*$': ''}, regexp=true)) | length > 0 or (inputs.equality_field | replace({'^[A-Za-z_][A-Za-z0-9_]*$': ''}, regexp=true)) | length > 0 or (inputs.projection_field | replace({'^[A-Za-z_][A-Za-z0-9_]*$': ''}, regexp=true)) | length > 0 }}
    then:
      - id: invalid_input
        type: io.kestra.plugin.core.execution.Fail
        errorMessage: Invalid identifier, length or row limit. No database operation ran.
  - id: reject_template_tokens
    type: io.kestra.plugin.core.flow.If
    condition: >-
      {{ inputs.lookup_value contains '{{' or inputs.lookup_value contains '{%' or inputs.bucket contains '{{' or inputs.bucket contains '{%' or inputs.scope contains '{{' or inputs.scope contains '{%' or inputs.collection contains '{{' or inputs.collection contains '{%' }}
    then:
      - id: unsafe_template_value
        type: io.kestra.plugin.core.execution.Fail
        errorMessage: Template delimiters are not valid lookup or keyspace inputs. No database operation ran.
  - id: read_prepared
    type: io.kestra.plugin.couchbase.Query
    timeout: PT30S
    connectionString: "{{ inputs.connection_string }}"
    username: "{{ inputs.username }}"
    password: "{{ inputs.password }}"
    fetchType: FETCH
    query: >-
      SELECT p.name,p.statement FROM system:prepareds AS p WHERE p.name={{ inputs.prepared_name | toJson }} LIMIT 2
  - id: require_existing_exact_query
    type: io.kestra.plugin.core.flow.If
    condition: >-
      {{ (outputs.read_prepared.rows | length) != 1 or (outputs.read_prepared.rows[0].statement ?? '') != render(vars.prepare) }}
    then:
      - id: refuse_unknown_query
        type: io.kestra.plugin.core.execution.Fail
        errorMessage: Prepared name is missing, ambiguous or belongs to a different statement. No cache entry was created.
  - id: read_index
    type: io.kestra.plugin.couchbase.Query
    timeout: PT30S
    connectionString: "{{ inputs.connection_string }}"
    username: "{{ inputs.username }}"
    password: "{{ inputs.password }}"
    fetchType: FETCH
    query: >-
      SELECT i.id,i.name,i.state,i.`using`,IFMISSING(i.is_primary,false) AS is_primary FROM system:indexes AS i WHERE i.name={{ inputs.approved_index | toJson }} AND IFMISSING(i.bucket_id,i.keyspace_id)={{ inputs.bucket | toJson }} AND IFMISSING(i.scope_id,"_default")={{ inputs.scope | toJson }} AND (CASE WHEN i.bucket_id IS MISSING THEN "_default" ELSE i.keyspace_id END)={{ inputs.collection | toJson }} LIMIT 2
  - id: require_online_secondary
    type: io.kestra.plugin.core.flow.If
    condition: >-
      {{ (outputs.read_index.rows | length) != 1 or (outputs.read_index.rows[0].state ?? '') != 'online' or (outputs.read_index.rows[0]['using'] ?? '') != 'gsi' or (outputs.read_index.rows[0].is_primary ?? true) }}
    then:
      - id: refuse_index
        type: io.kestra.plugin.core.execution.Fail
        errorMessage: Approved online secondary index is unavailable. Existing query access paths remain intact.
  - id: cached_plan
    type: io.kestra.plugin.couchbase.Query
    timeout: PT30S
    connectionString: "{{ inputs.connection_string }}"
    username: "{{ inputs.username }}"
    password: "{{ inputs.password }}"
    fetchType: FETCH
    query: "{{ render(vars.prepare) }}"
  - id: fresh_plan
    type: io.kestra.plugin.couchbase.Query
    timeout: PT30S
    connectionString: "{{ inputs.connection_string }}"
    username: "{{ inputs.username }}"
    password: "{{ inputs.password }}"
    fetchType: FETCH
    query: "EXPLAIN {{ render(vars.lookup) }}"
  - id: classify
    type: io.kestra.plugin.core.output.OutputValues
    values:
      cached_covered: >-
        {{ outputs.cached_plan.rows | toJson | jq((inputs.approved_index | toJson) ~ ' as $index | ' ~ render(vars.policy_jq)) | first }}
      fresh_covered: >-
        {{ outputs.fresh_plan.rows | toJson | jq((inputs.approved_index | toJson) ~ ' as $index | ' ~ render(vars.policy_jq)) | first }}
  - id: bound_plans
    type: io.kestra.plugin.core.flow.If
    condition: >-
      {{ (outputs.cached_plan.rows | length) != 1 or (outputs.fresh_plan.rows | length) != 1 or (outputs.cached_plan.rows | toJson | length) > 65536 or (outputs.fresh_plan.rows | toJson | length) > 65536 or (outputs.cached_plan.rows[0].name ?? '') != inputs.prepared_name or (outputs.classify.values.cached_covered != 'true' and outputs.classify.values.cached_covered != 'false') or (outputs.classify.values.fresh_covered != 'true' and outputs.classify.values.fresh_covered != 'false') }}
    then:
      - id: invalid_plan_response
        type: io.kestra.plugin.core.execution.Fail
        errorMessage: Plan response is missing, oversized or has a different prepared identity. No refresh ran.
  - id: require_useful_refresh
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.classify.values.fresh_covered != 'true' }}"
    then:
      - id: no_safe_new_plan
        type: io.kestra.plugin.core.execution.Fail
        errorMessage: Fresh plan does not use the approved covering secondary. Refresh cannot meet this policy.
  - id: report
    type: io.kestra.plugin.core.log.Log
    message: >-
      Prepared lookup {{ inputs.prepared_name }}: cached_covered={{ outputs.classify.values.cached_covered }}, fresh_covered={{ outputs.classify.values.fresh_covered }}, dry_run={{ inputs.dry_run }}.
  - id: repair_needed
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.classify.values.cached_covered != 'true' }}"
    then:
      - id: findings
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ inputs.slack_webhook }}"
        payload: >-
          {{ {'text': 'Couchbase cached lookup ' ~ inputs.prepared_name ~ ' still uses a scan or Fetch. A fresh plan uses approved covering index ' ~ inputs.approved_index ~ '. dry_run=' ~ inputs.dry_run} | toJson }}
      - id: enabled
        type: io.kestra.plugin.core.flow.If
        condition: "{{ inputs.auto_remediate and not inputs.dry_run }}"
        then:
          - id: approval
            type: io.kestra.plugin.core.flow.Pause
            onResume:
              - id: approved
                type: BOOL
                required: false
                description: Refresh this exact prepared lookup under the reserved-name contract.
          - id: approved_change
            type: io.kestra.plugin.core.flow.If
            condition: "{{ outputs.approval.onResume.approved ?? false }}"
            then:
              - id: reread_prepared
                type: io.kestra.plugin.couchbase.Query
                timeout: PT30S
                connectionString: "{{ inputs.connection_string }}"
                username: "{{ inputs.username }}"
                password: "{{ inputs.password }}"
                fetchType: FETCH
                query: >-
                  SELECT p.name,p.statement FROM system:prepareds AS p WHERE p.name={{ inputs.prepared_name | toJson }} LIMIT 2
              - id: reread_index
                type: io.kestra.plugin.couchbase.Query
                timeout: PT30S
                connectionString: "{{ inputs.connection_string }}"
                username: "{{ inputs.username }}"
                password: "{{ inputs.password }}"
                fetchType: FETCH
                query: >-
                  SELECT i.id,i.state FROM system:indexes AS i WHERE i.id={{ outputs.read_index.rows[0].id | toJson }} LIMIT 2
              - id: stale_snapshot
                type: io.kestra.plugin.core.flow.If
                condition: >-
                  {{ (outputs.reread_prepared.rows | length) != 1 or (outputs.reread_prepared.rows[0].statement ?? '') != render(vars.prepare) or (outputs.reread_index.rows | length) != 1 or (outputs.reread_index.rows[0].state ?? '') != 'online' }}
                then:
                  - id: reject_changed_state
                    type: io.kestra.plugin.core.execution.Fail
                    errorMessage: Prepared query or approved index changed during approval. No refresh ran.
              - id: current_cached
                type: io.kestra.plugin.couchbase.Query
                timeout: PT30S
                connectionString: "{{ inputs.connection_string }}"
                username: "{{ inputs.username }}"
                password: "{{ inputs.password }}"
                fetchType: FETCH
                query: "{{ render(vars.prepare) }}"
              - id: current_fresh
                type: io.kestra.plugin.couchbase.Query
                timeout: PT30S
                connectionString: "{{ inputs.connection_string }}"
                username: "{{ inputs.username }}"
                password: "{{ inputs.password }}"
                fetchType: FETCH
                query: "EXPLAIN {{ render(vars.lookup) }}"
              - id: current_policy
                type: io.kestra.plugin.core.output.OutputValues
                values:
                  cached: >-
                    {{ outputs.current_cached.rows | toJson | jq((inputs.approved_index | toJson) ~ ' as $index | ' ~ render(vars.policy_jq)) | first }}
                  fresh: >-
                    {{ outputs.current_fresh.rows | toJson | jq((inputs.approved_index | toJson) ~ ' as $index | ' ~ render(vars.policy_jq)) | first }}
              - id: bound_current_plans
                type: io.kestra.plugin.core.flow.If
                condition: >-
                  {{ (outputs.current_cached.rows | length) != 1 or (outputs.current_fresh.rows | length) != 1 or (outputs.current_cached.rows | toJson | length) > 65536 or (outputs.current_fresh.rows | toJson | length) > 65536 or (outputs.current_cached.rows[0].name ?? '') != inputs.prepared_name or (outputs.current_policy.values.cached != 'true' and outputs.current_policy.values.cached != 'false') or (outputs.current_policy.values.fresh != 'true' and outputs.current_policy.values.fresh != 'false') }}
                then:
                  - id: reject_current_plans
                    type: io.kestra.plugin.core.execution.Fail
                    errorMessage: Current plans are missing, oversized or have a different identity. No refresh ran.
              - id: refuse_lost_coverage
                type: io.kestra.plugin.core.flow.If
                condition: "{{ outputs.current_policy.values.fresh != 'true' }}"
                then:
                  - id: coverage_changed
                    type: io.kestra.plugin.core.execution.Fail
                    errorMessage: Fresh plan lost approved coverage during approval. No refresh ran.
              - id: refresh_if_still_needed
                type: io.kestra.plugin.core.flow.If
                condition: "{{ outputs.current_policy.values.cached != 'true' }}"
                then:
                  - id: refresh_prepared
                    type: io.kestra.plugin.couchbase.Query
                    timeout: PT30S
                    connectionString: "{{ inputs.connection_string }}"
                    username: "{{ inputs.username }}"
                    password: "{{ inputs.password }}"
                    fetchType: FETCH
                    query: "PREPARE FORCE {{ inputs.prepared_name }} AS {{ render(vars.lookup) }}"
              - id: verify_cached
                type: io.kestra.plugin.couchbase.Query
                timeout: PT30S
                connectionString: "{{ inputs.connection_string }}"
                username: "{{ inputs.username }}"
                password: "{{ inputs.password }}"
                fetchType: FETCH
                query: "{{ render(vars.prepare) }}"
              - id: verify_policy
                type: io.kestra.plugin.core.flow.If
                condition: >-
                  {{ (outputs.verify_cached.rows | length) != 1 or (outputs.verify_cached.rows | toJson | length) > 65536 or (outputs.verify_cached.rows[0].name ?? '') != inputs.prepared_name or (outputs.verify_cached.rows | toJson | jq((inputs.approved_index | toJson) ~ ' as $index | ' ~ render(vars.policy_jq)) | first) != true }}
                then:
                  - id: refresh_ineffective
                    type: io.kestra.plugin.core.execution.Fail
                    errorMessage: Cached plan still fails the approved covering-index policy after refresh.
            else:
              - id: declined
                type: io.kestra.plugin.core.log.Log
                message: Approval declined. Existing prepared plan, indexes and data remain intact.

triggers:
  - id: daily_safe_check
    type: io.kestra.plugin.core.trigger.Schedule
    disabled: true
    cron: "0 6 * * *"
    inputs:
      dry_run: true
      auto_remediate: false
errors:
  - id: alert_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ inputs.slack_webhook }}"
    payload: >-
      {{ {'text': 'Couchbase prepared-plan policy failed for execution ' ~ execution.id ~ '. Inspect the cached plan and approved index.'} | toJson }}

extend:
  # Original YAML, licensed by its author under Apache-2.0.
  title: Refresh Couchbase cached scans after a covering index arrives
  shortDescription: Refresh one existing named prepared lookup when its cached scan is stale and a fresh plan already uses an approved covering secondary.
  metaTitle: Refresh Couchbase Stale Prepared Scan Plans
  metaDescription: Detect a stale Couchbase prepared scan, validate the approved covering secondary and refresh the exact cached lookup behind approval.
  tags: [Data, Infrastructure]
  subTags: [Day 2 Operations, Monitoring & Alerting]
  ee: false
  demo: false
  description: |
    ## Safety
    An index rollout does not necessarily improve a still-valid prepared plan. This flow refreshes one existing name and never drops an index or changes documents. Reserve that name for this exact statement and coordinate index DDL through the approval interval.
    
    ## How it works
    Read `system:prepareds` for one existing name whose statement exactly matches the generated equality lookup. `PREPARE` retrieves the cached operator. Fresh `EXPLAIN` must already use the approved online non-primary GSI with `covers`, no `Fetch` and no `PrimaryScan`. Only a stale cached operator is a finding.
    
    Repair requires `dry_run=false`, `auto_remediate=true` and `approved ?? false`. After the Pause, recheck the statement, original index ID and both plans. Skip if another writer already refreshed the cache. Otherwise native `couchbase.Query` runs `PREPARE FORCE` for the same name and statement. Read the cached operator again and fail unless it meets the coverage policy. No application SELECT is executed by this flow.
    
    ## What you get
    One named lookup moved from its old scan or document-fetching plan to an existing covering secondary. The cached-plan check catches an ineffective refresh even when fresh EXPLAIN was good earlier. Findings and failures reach Slack.
    
    ## Who it's for
    Couchbase teams deploying indexes for named prepared application lookups on one Query node.
    
    ## Why orchestrate this with Kestra
    Kestra records the old and fresh plans, holds the decision for approval, rechecks changed state and keeps the failed recovery visible. Couchbase's same-name statement check prevents replacing the name with different SQL.
    
    ## Tested end to end
    Couchbase CE 7.6.2, Kestra 2.0.6 with plugin 1.3.9 and Kestra 2.0.5 with plugin 1.3.8. Independent EXECUTE confirmed the same two rows after cached PrimaryScan or Fetch became a covering IndexScan without Fetch. Completed-request counters measured 101 document fetches before refresh and zero after. The large collection kept all 5101 documents and their canonical JSON hash. Core paths were repeated on a second fresh data volume.
    | Case | Execution | Result |
    |---|---|---|
    | Healthy | `5MpPoTpFZfhxdVvF7UsTXr` | SUCCESS, no refresh |
    | Dry | `5NE2JzVLKdAZdvDQYPboiM` | SUCCESS, stale plan retained |
    | Declined | `bnfwaMq72LuOU0RyeoP6S` | SUCCESS, no refresh |
    | Refresh | `3fFnKMGO5zeWuO4xG7LbPw` | SUCCESS, cached coverage restored |
    | Ineffective | `5NikKSduEqDt6ZA37037OR` | FAILED, lost index caught |
    | Repeat | `5VJNoVeBGtrJbsnSH0dLIG` | SUCCESS, no refresh |
    | Concurrent refresh | `7H5hH1h5tpzAj0NXEa0lmA` | SUCCESS, duplicate work skipped |
    
    ## Prerequisites
    One Query node and an enforced finite Query Service timeout. Tests use 10 seconds with task deadlines of 30 seconds. CE tests used `ro_admin` plus bucket-scoped `bucket_full_access`; each alone was insufficient. Finer Enterprise roles were not tested. Freeze name replacement and index DDL during approved repair.
    ### Secrets
    `COUCHBASE_USERNAME`, `COUCHBASE_PASSWORD` and `SLACK_WEBHOOK_URL` default SECRET inputs. Credentials remain absent from saved plaintext executions and logs.
    ### Inputs
    Set bucket/scope/collection, existing prepared name, approved index, two plain top-level fields and a string equality value. The generated SELECT returns `id` and `projected`, orders by ID and uses LIMIT 1 to 100. Value length is at most 256; plans are capped at 64 KiB. Template delimiters are refused. No arbitrary SQL input exists.
    
    ## Quick start
    Create the named application PREPARE using this flow's generated SELECT shape. Let the normal index rollout provide the covering GSI. Run dry first, review both plans then enable manual repair and approve it. The disabled daily trigger always supplies safe inputs.
    
    ## How to extend
    Add another fixed query shape only with its own coverage and exact-statement tests. Limits: one cache on one Query node. It does not ban full scans elsewhere, create missing indexes or improve every prepared query. Flow QUEUE serializes this flow only. A noncooperative cache eviction or index change between the recheck and refresh remains a race; final cached verification detects lost coverage when observable.
    
    ## Links
    [PREPARE](https://docs.couchbase.com/server/7.6/n1ql/n1ql-language-reference/prepare.html), [covering indexes](https://docs.couchbase.com/server/7.6/n1ql/n1ql-language-reference/covering-indexes.html).
    
    This blueprint was created by [zkasuran](https://github.com/zkasuran).
