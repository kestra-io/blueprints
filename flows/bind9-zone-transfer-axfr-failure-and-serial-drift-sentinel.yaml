    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
    - [Internet Systems Consortium BIND 9 Administrator Reference Manual](https://bind9.readthedocs.io/en/latest/)
    - [BIND 9 Statistics Channel Architecture and XML Reference](https://bind9.readthedocs.io/en/latest/reference.html#statistics-channel)
    - [Troubleshooting DNS Zone Transfers and TSIG Authentication](https://kb.isc.org/docs/aa-00726)
