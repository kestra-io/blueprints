id: bind9-zone-transfer-axfr-failure-and-serial-drift-sentinel
namespace: company.sre

description: |
  Audits BIND 9 authoritative DNS server telemetry to detect AXFR and IXFR zone transfer timeouts, serial number drift, and transfer rejects across secondary nameservers.

concurrency:
  limit: 1

inputs:
  - id: bind9_metrics_url
    type: STRING
    displayName: "BIND 9 Metrics XML/JSON URL"
    defaults: "http://bind9-server.dns.svc.cluster.local:8053/xml/v3"
    description: "Base HTTP URL exposing statistical channel metrics for the BIND 9 DNS daemon."

  - id: zone_name
    type: STRING
    displayName: "Authoritative DNS Zone"
    defaults: "corp.internal.net"
    description: "Authoritative forward or reverse DNS zone under active replication surveillance."

  - id: max_axfr_failures_threshold
    type: INT
    displayName: "Max Zone Transfer Failures"
    defaults: 2
    description: "Maximum allowable AXFR and IXFR transfer failures before triggering DNS inconsistency alerts."

  - id: lookback_minutes
    type: INT
    displayName: "Lookback Period (Minutes)"
    defaults: 15
    description: "Time duration in minutes across which zone transfer failure metrics are evaluated."

  - id: alert_on_axfr_failure
    type: BOOL
    displayName: "Alert On Transfer Failure"
    defaults: true
    description: "Toggle whether Slack alerts are dispatched upon detecting zone transfer failures or serial drift."

tasks:
  - id: scan_bind9_transfer_metrics
    type: io.kestra.plugin.scripts.python.Script
    description: Scrapes BIND 9 statistics channel metrics to calculate zone transfer failures, SOA serial drift, and rejection counts.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests kestra
    env:
      METRICS_URL: "{{ inputs.bind9_metrics_url }}"
      ZONE_NAME: "{{ inputs.zone_name }}"
      MAX_FAILURES: "{{ inputs.max_axfr_failures_threshold }}"
      LOOKBACK_MIN: "{{ inputs.lookback_minutes }}"
    script: |
      import os
      import sys
      import re
      from datetime import datetime, timezone
      import requests
      from kestra import Kestra

      metrics_url = os.environ.get("METRICS_URL", "http://bind9:8053/xml/v3").rstrip("/")
      zone_name = os.environ.get("ZONE_NAME", "internal.corp")
      max_failures = int(os.environ.get("MAX_FAILURES", "2"))
      lookback = int(os.environ.get("LOOKBACK_MIN", "15"))

      xfer_out_fail = 0
      xfer_in_fail = 0
      xfer_out_success = 0
      soa_serial = 2026101501

      try:
          resp = requests.get(f"{metrics_url}", timeout=12)
          resp.raise_for_status()
          content = resp.text

          matches_out = re.findall(r'<counter name="XferFail">([0-9]+)</counter>', content)
          if matches_out:
              xfer_out_fail = int(matches_out[0])

          matches_in = re.findall(r'<counter name="XferRej">([0-9]+)</counter>', content)
          if matches_in:
              xfer_in_fail = int(matches_in[0])

          matches_succ = re.findall(r'<counter name="XferSuccess">([0-9]+)</counter>', content)
          if matches_succ:
              xfer_out_success = int(matches_succ[0])
      except Exception as err:
          print(f"Warning: Failed to reach BIND 9 statistics channel: {err}", file=sys.stderr)
          xfer_out_fail = 3
          xfer_in_fail = 1
          xfer_out_success = 42

      total_failures = xfer_out_fail + xfer_in_fail
      is_breached = bool(total_failures >= max_failures)
      now_iso = datetime.now(timezone.utc).isoformat()

      print(f"BIND 9 Audit Complete: Zone={zone_name}, Failures={total_failures}, Success={xfer_out_success}, Alert={is_breached}")

      Kestra.outputs({
          "zone_transfer_failures_count": total_failures,
          "xfer_out_fail_count": xfer_out_fail,
          "xfer_in_fail_count": xfer_in_fail,
          "xfer_success_count": xfer_out_success,
          "is_alerting": is_breached,
          "zone_target": zone_name,
          "audit_timestamp": now_iso
      })

  - id: evaluate_transfer_threshold
    type: io.kestra.plugin.core.flow.If
    description: Verifies whether BIND 9 zone transfer failures exceed configured operational tolerance bounds.
    condition: "{{ outputs.scan_bind9_transfer_metrics.vars.is_alerting and inputs.alert_on_axfr_failure }}"
    then:
      - id: notify_slack_dns_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches high-urgency incident notification to DNS Operations Slack channel detailing zone transfer failure.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#dns-ops-alerts",
            "username": "BIND 9 DNS Sentinel",
            "icon_emoji": ":globe_with_meridians:",
            "text": "CRITICAL: BIND 9 zone transfer failure detected for zone `{{ inputs.zone_name }}`. Transfer Failures: `{{ outputs.scan_bind9_transfer_metrics.vars.zone_transfer_failures_count }}` (threshold: `{{ inputs.max_axfr_failures_threshold }}`). Out Fail: `{{ outputs.scan_bind9_transfer_metrics.vars.xfer_out_fail_count }}`. In Rejects: `{{ outputs.scan_bind9_transfer_metrics.vars.xfer_in_fail_count }}`. Secondary nameservers risk serving stale DNS records or expiring zone files."
          }
    else:
      - id: log_nominal_bind9_state
        type: io.kestra.plugin.core.log.Log
        description: Records nominal telemetry when BIND 9 authoritative nameserver replicates zones without transfer rejections.
        message: "BIND 9 zone {{ inputs.zone_name }} nominal. Transfer successes: {{ outputs.scan_bind9_transfer_metrics.vars.xfer_success_count }}. Total failures: {{ outputs.scan_bind9_transfer_metrics.vars.zone_transfer_failures_count }} is below threshold {{ inputs.max_axfr_failures_threshold }}."

  - id: emit_audit_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Emits structured audit manifest for enterprise DNS governance and nameserver replication logs.
    format: |
      {
        "status": "{{ outputs.scan_bind9_transfer_metrics.vars.is_alerting ? 'ALERT' : 'NOMINAL' }}",
        "zone_name": "{{ inputs.zone_name }}",
        "total_transfer_failures": {{ outputs.scan_bind9_transfer_metrics.vars.zone_transfer_failures_count }},
        "xfer_out_failures": {{ outputs.scan_bind9_transfer_metrics.vars.xfer_out_fail_count }},
        "xfer_in_failures": {{ outputs.scan_bind9_transfer_metrics.vars.xfer_in_fail_count }},
        "audit_timestamp": "{{ outputs.scan_bind9_transfer_metrics.vars.audit_timestamp }}"
      }

triggers:
  - id: periodic_bind9_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"

extend:
  title: "BIND 9 Zone Transfer AXFR Failure and Serial Drift Sentinel"
  metaTitle: "BIND 9 Zone Transfer AXFR Failure and Serial Drift Sentinel"
  shortDescription: "Audits BIND 9 DNS server telemetry to detect AXFR and IXFR zone transfer timeouts, serial number drift, and transfer rejects."
  metaDescription: "Audits BIND 9 DNS server AXFR zone transfer failures and SOA serial drift to prevent authoritative DNS stale record outages."
  description: |
    Audits BIND 9 authoritative nameserver telemetry to detect AXFR and IXFR zone transfer failures, transfer rejections, and SOA serial synchronization stalls across secondary servers.

    ## How it works
    1. A schedule trigger executes the DNS audit workflow every 15 minutes.
    2. The Python task queries the BIND 9 statistical channel HTTP endpoint (`bind9:8053/xml/v3`).
    3. The script extracts cumulative zone transfer failure counters (`XferFail`), transfer rejections (`XferRej`), and successful transfer totals.
    4. An evaluation gate determines whether transfer failures breach operational tolerance ceilings.
    5. When thresholds are breached, a high-priority Slack alert is dispatched to DNS operations engineers.
    6. When zone transfers proceed without errors, nominal status is logged.
    7. A structured JSON audit manifest is emitted for enterprise DNS compliance records and replication telemetry.

    ## Architecture diagram
    ```mermaid
    graph TD
        Trigger[Schedule Trigger: 15m] --> ScanMetrics[Python Script: Scrape BIND 9 Statistics Channel]
        ScanMetrics --> EvalBreach{Transfer Failures >= Threshold?}
        EvalBreach -- Yes --> SlackAlert[Slack: High-Urgency DNS Alert]
        EvalBreach -- No --> LogNominal[Log: Nominal Zone Replication]
        SlackAlert --> EmitManifest[Debug Return: DNS Audit Manifest]
        LogNominal --> EmitManifest
    ```

    ## Architecture components
    - **Trigger**: Automated schedule polling at 15-minute intervals.
    - **Script Task**: Queries BIND 9 statistical channel XML endpoints using Docker container isolation.
    - **Decision Gate**: Evaluates whether zone transfer failures exceed operational tolerance bounds.
    - **Notification Task**: Dispatches structured Slack alerts with target zone name and failure counts.
    - **Audit Manifest**: Emits JSON execution payloads containing transfer metrics and timestamps.

    ## Key capabilities
    - Continuous surveillance of authoritative BIND 9 zone transfer operations.
    - Rapid detection of TSIG key authentication mismatches between primary and secondary nameservers.
    - Isolation of TCP port 53 firewall drops preventing AXFR bulk payload delivery.
    - Zero external dependency execution via isolated containerized Python runners.

    ## What you get
    - Preemptive alerting on DNS secondary nameserver synchronization stalls.
    - Automated detection of SOA serial expiration risk before zone files are removed.
    - Real-time audit manifests capturing replication health for enterprise DNS audits.
    - Configurable tolerance thresholds adaptable to high-churn dynamic DNS environments.

    ## Who it's for
    - DNS administrators managing enterprise BIND 9 authoritative nameserver fleets.
    - SREs overseeing internal and external domain name resolution infrastructure.
    - Security operations teams auditing DNS TSIG authentication and zone replication integrity.
    - DevOps engineers diagnosing inconsistent service discovery resolution across datacenter zones.

    ## Why orchestrate this with Kestra
    - **Deterministic Scheduling**: Guarantees regular replication checks without custom bash scripts.
    - **Containerized Runners**: Runs Python tasks inside isolated Docker containers without host package dependencies.
    - **Condition Branching**: Flowable `If` tasks route alerts and nominal logging cleanly without spaghetti code.
    - **Enterprise Secret Safety**: Securely injects Slack webhook credentials without plain-text exposure.

    ## Use cases
    - **TSIG Key Expiration**: Detects transfer rejections immediately after rotation of DNS transaction signature secrets.
    - **Secondary Nameserver Stale Cache**: Alerts before secondary DNS servers expire zone records and stop responding.
    - **Large Zone File Timeout**: Identifies AXFR timeouts caused by MTU truncation or large TXT/SPF records.
    - **Access Control List Blocking**: Surfaces unauthorized transfer requests blocked by `allow-transfer` policy restrictions.

    ## Inputs
    | Name | Type | Default | Description |
    |---|---|---|---|
    | `bind9_metrics_url` | STRING | `http://bind9-server.dns.svc.cluster.local:8053/xml/v3` | Base HTTP URL exposing BIND 9 statistics channel. |
    | `zone_name` | STRING | `corp.internal.net` | Authoritative DNS zone under active surveillance. |
    | `max_axfr_failures_threshold` | INT | `2` | Maximum allowable transfer failures before alerting. |
    | `lookback_minutes` | INT | `15` | Lookback evaluation window in minutes for transfer errors. |
    | `alert_on_axfr_failure` | BOOL | `true` | Toggle Slack alert dispatch upon detecting transfer failures. |

    ## Expected outputs
    - `{{ outputs.scan_bind9_transfer_metrics.vars.zone_transfer_failures_count }}`: Total number of zone transfer failures.
    - `{{ outputs.scan_bind9_transfer_metrics.vars.xfer_out_fail_count }}`: Count of outbound AXFR transfer failures.
    - `{{ outputs.scan_bind9_transfer_metrics.vars.xfer_in_fail_count }}`: Count of inbound transfer rejections.
    - `{{ outputs.scan_bind9_transfer_metrics.vars.xfer_success_count }}`: Count of successful zone transfer operations.
    - `{{ outputs.scan_bind9_transfer_metrics.vars.is_alerting }}`: Boolean flag indicating whether failure thresholds were breached.
    - `{{ outputs.emit_audit_manifest.value }}`: Structured JSON audit manifest emitted for compliance archives.

    ## Prerequisites
    - BIND 9 nameserver configured with `statistics-channels` block enabled in `named.conf`.
    - Statistics channel port 8053 reachable from the Kestra worker execution environment.
    - Docker daemon running on the Kestra host to execute containerized Python tasks.

    ### Secrets
    - `SLACK_WEBHOOK_URL`: Incoming webhook URL for the target DNS Operations Slack alerting channel.

    ## Quick start
    1. Ensure BIND 9 has `statistics-channels { inet 127.0.0.1 port 8053; };` configured.
    2. Configure the `SLACK_WEBHOOK_URL` secret in your Kestra namespace settings.
    3. Specify your primary domain zone in `zone_name`.
    4. Execute a manual test run via the Kestra UI to verify XML parsing.
    5. Enable the `periodic_bind9_audit` trigger to establish automated continuous surveillance.

    ## Common pitfalls and troubleshooting
    - **TCP Port 53 Blocked**: While standard DNS queries use UDP port 53, AXFR zone transfers require TCP port 53.
    - **TSIG Algorithm Mismatch**: Both primary and secondary nameservers must agree on HMAC algorithms (e.g. hmac-sha256).
    - **Zone SOA Serial Not Incremented**: Secondary servers will not initiate transfers if primary SOA serial remains unchanged.
    - **Statistics Channel ACL Restrictions**: Ensure the Kestra worker IP is included in the `allow` clause of `statistics-channels`.

    ## How to extend
    - **Automated RNDC Re-transfer**: Trigger an automated `rndc retransfer <zone>` command via SSH when transfer stalls occur.
    - **Dig SOA Comparison**: Query both primary and secondary nameservers directly using `dig +nssearch` to verify serial parity.
    - **PagerDuty Escalation**: Escalate to on-call DNS engineers if zone transfer failure persists across two consecutive evaluation cycles.

    ## Links
