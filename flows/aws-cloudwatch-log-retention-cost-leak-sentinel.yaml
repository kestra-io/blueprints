id: aws-cloudwatch-log-retention-cost-leak-sentinel
namespace: company.cloud

inputs:
  - id: aws_region
    type: STRING
    defaults: "us-east-1"
    description: Target AWS region.
  - id: unexpiring_log_threshold
    type: INT
    defaults: 0
    description: Maximum acceptable count of CloudWatch log groups with Never Expire retention.

tasks:
  - id: audit_log_retention
    type: io.kestra.plugin.aws.cli.AwsCLI
    region: "{{ inputs.aws_region }}"
    accessKeyId: "{{ secret('AWS_ACCESS_KEY_ID') }}"
    secretKeyId: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
    commands:
      - |
        aws logs describe-log-groups --query "logGroups[?!not_null(retentionInDays)].{Name:logGroupName,StoredBytes:storedBytes}" --output json > /tmp/unexpiring_logs.json
        
        UNEXPIRING_COUNT=$(jq 'length' /tmp/unexpiring_logs.json)
        TOTAL_BYTES=$(jq '[.[].StoredBytes] | add // 0' /tmp/unexpiring_logs.json)
        UNEXPIRING_LOGS=$(jq -c '.[0:10]' /tmp/unexpiring_logs.json)
        
        echo "::set-output name=unexpiring_count::$UNEXPIRING_COUNT::"
        echo "::set-output name=total_bytes::$TOTAL_BYTES::"
        echo "::set-output name=log_samples::$UNEXPIRING_LOGS::"

  - id: evaluate_retention_compliance
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.audit_log_retention.vars.unexpiring_count | int > inputs.unexpiring_log_threshold }}"
    then:
      - id: notify_finops_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#finops-cost-alerts",
            "attachments": [
              {
                "color": "warning",
                "title": "⚠️ AWS CloudWatch Log Group Indefinite Retention Cost Leak",
                "text": "Detected *{{ outputs.audit_log_retention.vars.unexpiring_count }}* log group(s) with retention set to *Never Expire* (total stored bytes: {{ outputs.audit_log_retention.vars.total_bytes }}). Sample log groups: {{ outputs.audit_log_retention.vars.log_samples }}. Impact: Unbounded storage growth incurs compounding monthly CloudWatch Logs storage costs.",
                "footer": "Kestra FinOps Orchestrator • CloudWatch Retention Sentinel"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#finops-cost-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ CloudWatch Retention Sentinel Execution Failed",
            "text": "The AWS CloudWatch log group retention audit failed. Please verify IAM permissions for logs:DescribeLogGroups.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 8 * * 1"
    disabled: true

extend:
  metaDescription: "Audits AWS CloudWatch log groups to detect indefinite retention policies causing uncontrolled storage cost accumulation."
  metaTitle: AWS CloudWatch Log Group Indefinite Retention and Cost Leak Sentinel with Kestra
  title: AWS CloudWatch Log Group Indefinite Retention and Cost Leak Sentinel
  shortDescription: Audits AWS CloudWatch log groups to detect indefinite retention policies causing uncontrolled storage cost accumulation.
  description: |
    ## How it works
    This workflow uses the official AWS CLI plugin to query AWS CloudWatch Logs across the specified region. It searches for all log groups lacking an explicit `retentionInDays` setting (which default to `Never Expire`). It calculates total stored bytes across unmanaged log groups and alerts the FinOps team via Slack when unexpiring log groups exceed the policy threshold.

    ## What you get
    - Proactive discovery of abandoned and unbudgeted log groups.
    - Prevents runaway AWS CloudWatch storage billing overhead.
    - Exact breakdown of total stored bytes and top offending log groups.

    ## Who it's for
    - Cloud Financial Operations (FinOps) and Platform Engineers controlling AWS infrastructure spend.
    - DevOps engineers enforcing organization-wide log lifecycle policies.

    ## Why orchestrate this with Kestra
    - **Native AWS Integration**: Uses official `io.kestra.plugin.aws.cli.AwsCLI` with secure credentials injection.
    - **Scheduled Governance**: Run weekly or monthly cost hygiene audits automatically.
    - **Automated Enforcement**: Easily extend the workflow with `aws logs put-retention-policy` to remediate automatically.

    ## Prerequisites
    - AWS IAM credentials with `logs:DescribeLogGroups` permissions.
    - Secrets `AWS_ACCESS_KEY_ID`, `AWS_SECRET_ACCESS_KEY`, and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import this blueprint into Kestra.
    2. Configure AWS credentials and Slack webhook secret.
    3. Execute the workflow to audit CloudWatch log retention in your AWS account.

    ## How to extend
    - Add an automated remediation branch to apply a default 30-day retention to non-compliant log groups.
    - Iterate across all AWS regions dynamically using a loop task.

    ## Links
    - [AWS CloudWatch Logs Retention Documentation](https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/Working-with-log-groups-and-streams.html)
    - [Kestra AWS CLI Plugin](https://kestra.io/plugins/plugin-aws/cli/io.kestra.plugin.aws.cli.awscli)
  tags:
    - Cloud
    - Business
  subTags:
    - FinOps & Cost Management
    - AWS Services
  ee: false
  demo: false
