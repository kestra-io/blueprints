# SPDX-License-Identifier: Apache-2.0
id: surrealdb-duplicate-field-value-dedup-guard
namespace: company.team
description: Quarantine conflicting optional keys without deleting SurrealDB records, then install the blocked UNIQUE
  index under a cooperative maintenance fence.
concurrency:
  limit: 1
  behavior: QUEUE
inputs:
  - id: host
    type: STRING
    defaults: localhost
  - id: username
    type: STRING
    defaults: migration_editor
  - id: db_namespace
    type: STRING
    defaults: production
  - id: database
    type: STRING
    defaults: app_data
  - id: table
    type: STRING
    defaults: person
  - id: key_field
    type: STRING
    defaults: email
  - id: created_field
    type: STRING
    defaults: created_at
  - id: index_name
    type: STRING
    defaults: person_email_unique
  - id: password
    type: SECRET
    defaults: "{{ secret('SURREALDB_PASSWORD') }}"
  - id: use_tls
    type: BOOL
    defaults: true
  - id: dry_run
    type: BOOL
    defaults: true
  - id: auto_remediate
    type: BOOL
    defaults: false
  - id: max_records
    type: INT
    defaults: 2000
  - id: max_bytes
    type: INT
    defaults: 2000000
  - id: max_surplus
    type: INT
    defaults: 200
tasks:
  - id: input_guard
    type: io.kestra.plugin.core.flow.If
    condition: "{{ (inputs.table == '' or inputs.table | length > 63 or (inputs.table | replace({'[A-Za-z0-9_]':\
      \ ''}, regexp=true) | length) > 0) or (inputs.key_field == '' or inputs.key_field | length > 63 or (inputs.key_field\
      \ | replace({'[A-Za-z0-9_]': ''}, regexp=true) | length) > 0) or (inputs.created_field == '' or inputs.created_field\
      \ | length > 63 or (inputs.created_field | replace({'[A-Za-z0-9_]': ''}, regexp=true) | length) > 0) or (inputs.index_name\
      \ == '' or inputs.index_name | length > 63 or (inputs.index_name | replace({'[A-Za-z0-9_]': ''}, regexp=true)\
      \ | length) > 0) or inputs.table == 'maintenance' or inputs.key_field == 'dedup_recovery' or inputs.key_field\
      \ == 'id' or inputs.created_field == inputs.key_field or inputs.max_records < 1 or inputs.max_records > 2000\
      \ or inputs.max_bytes < 1 or inputs.max_bytes > 2000000 or inputs.max_surplus < 1 or inputs.max_surplus >\
      \ 200 }}"
    then:
      - id: invalid_inputs
        type: io.kestra.plugin.core.execution.Fail
        errorMessage: Unsafe identifier or ceiling. No database query attempted.
  - id: inspect
    type: io.kestra.plugin.surrealdb.Query
    host: "{{ inputs.host }}"
    port: 8000
    useTls: "{{ inputs.use_tls }}"
    username: "{{ inputs.username }}"
    password: "{{ inputs.password }}"
    namespace: "{{ inputs.db_namespace }}"
    database: "{{ inputs.database }}"
    fetchType: FETCH_ONE
    query: |-
      LET $meta = INFO FOR TABLE {{ inputs.table }};
      LET $definition = (INFO FOR DB).tables.{{ inputs.table }};
      LET $rows = SELECT * FROM {{ inputs.table }} ORDER BY id LIMIT {{ inputs.max_records + 1 }} TIMEOUT 5s;
      LET $ordered = SELECT * FROM $rows ORDER BY {{ inputs.created_field }}, id;
      LET $keys = SELECT id, {{ inputs.key_field }} AS key_value,
        (SELECT VALUE id FROM $ordered WHERE {{ inputs.key_field }}=$parent.{{ inputs.key_field }} LIMIT 1)[0] AS keeper
        FROM $ordered WHERE type::is_string({{ inputs.key_field }});
      LET $plan = SELECT type::string(id) AS record_id, key_value, type::string(keeper) AS keeper_id
        FROM $keys WHERE id != keeper;
      LET $invalid = SELECT VALUE id FROM $rows WHERE
        ({{ inputs.key_field }} != NONE AND {{ inputs.key_field }} != NULL AND !type::is_string({{ inputs.key_field }})) OR
        (type::is_string({{ inputs.key_field }}) AND (!type::is_datetime({{ inputs.created_field }}) OR string::len({{ inputs.key_field }}) > 512)) OR
        (dedup_recovery != NONE AND (dedup_recovery.key_field != '{{ inputs.key_field }}' OR
          !type::is_string(dedup_recovery.original_value) OR !type::is_record(dedup_recovery.keeper) OR
          !type::is_string(dedup_recovery.execution_id) OR !type::is_datetime(dedup_recovery.at) OR
          (SELECT VALUE {{ inputs.key_field }} FROM dedup_recovery.keeper)[0] != dedup_recovery.original_value OR
          {{ inputs.key_field }} != NONE));
      LET $recovery = SELECT id, dedup_recovery FROM $rows WHERE dedup_recovery != NONE;
      RETURN [{snapshot:crypto::sha256(type::string([$definition,$meta,$rows])),
        protected_hash:crypto::sha256(type::string(SELECT * OMIT {{ inputs.key_field }},dedup_recovery FROM $rows ORDER BY id)),
        schema:crypto::sha256(type::string([$definition,$meta])), records:array::len($rows),
        bytes:4*string::len(type::string($rows)), surplus:array::len($plan), plan:$plan,
        recovery_count:array::len($recovery), invalid:array::len($invalid),
        schema_ok: $definition = 'DEFINE TABLE {{ inputs.table }} TYPE ANY SCHEMALESS PERMISSIONS NONE' AND
          object::len($meta.fields)=0 AND object::len($meta.events)=0 AND object::len($meta.tables)=0,
        index_definition: $meta.indexes.{{ inputs.index_name }} ?? '',
        expected_index:'DEFINE INDEX {{ inputs.index_name }} ON {{ inputs.table }} FIELDS {{ inputs.key_field }} UNIQUE'}];
    timeout: PT20S
  - id: report
    type: io.kestra.plugin.core.log.Log
    message: "Records {{ outputs.inspect.row.records }}, surplus {{ outputs.inspect.row.surplus }}, prior quarantine\
      \ {{ outputs.inspect.row.recovery_count }}. Plan {{ outputs.inspect.row.plan | toJson }}."
  - id: eligibility
    type: io.kestra.plugin.core.flow.If
    condition: "{{ not outputs.inspect.row.schema_ok or outputs.inspect.row.invalid > 0 or outputs.inspect.row.records\
      \ > inputs.max_records or outputs.inspect.row.bytes > inputs.max_bytes or outputs.inspect.row.surplus > inputs.max_surplus\
      \ or (outputs.inspect.row.index_definition != '' and outputs.inspect.row.index_definition != outputs.inspect.row.expected_index)\
      \ }}"
    then:
      - id: unsupported_state
        type: io.kestra.plugin.core.execution.Fail
        errorMessage: Schema, key type, recovery field, existing index or scan ceiling is unsupported. Nothing changed.
  - id: needs_installation
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.inspect.row.index_definition == '' }}"
    then:
      - id: armed
        type: io.kestra.plugin.core.flow.If
        condition: "{{ inputs.auto_remediate and not inputs.dry_run }}"
        then:
          - id: approve
            type: io.kestra.plugin.core.flow.Pause
            pauseDuration: PT30M
            description: "Approve moving {{ outputs.inspect.row.surplus }} conflicting keys into dedup_recovery\
              \ and installing UNIQUE. Every record and reference stays. Maintenance must already be paused under\
              \ the documented writer contract."
            onResume:
              - id: approved
                type: BOOL
                defaults: false
          - id: approved
            type: io.kestra.plugin.core.flow.If
            condition: "{{ outputs.approve.onResume.approved ?? false }}"
            then:
              - id: quarantine
                type: io.kestra.plugin.surrealdb.Query
                host: "{{ inputs.host }}"
                port: 8000
                useTls: "{{ inputs.use_tls }}"
                username: "{{ inputs.username }}"
                password: "{{ inputs.password }}"
                namespace: "{{ inputs.db_namespace }}"
                database: "{{ inputs.database }}"
                fetchType: FETCH_ONE
                query: |-
                  BEGIN;
                  LET $meta = INFO FOR TABLE {{ inputs.table }};
                  LET $definition = (INFO FOR DB).tables.{{ inputs.table }};
                  LET $rows = SELECT * FROM {{ inputs.table }} ORDER BY id LIMIT {{ inputs.max_records + 1 }} TIMEOUT 5s;
                  IF crypto::sha256(type::string([$definition,$meta,$rows])) != $snapshot { THROW 'Approval snapshot changed; no quarantine applied'; };
                  LET $lock = type::record('maintenance:{{ inputs.table }}_{{ inputs.key_field }}');
                  LET $fence = SELECT * FROM ONLY $lock;
                  IF $fence.paused != true OR !type::is_int($fence.revision) OR ($fence.owner != NONE AND $fence.owner != $owner AND
                    (!type::is_datetime($fence.expires) OR $fence.expires > time::now())) {
                    THROW 'Maintenance fence absent, writable or held by another owner';
                  };
                  UPDATE $lock SET owner=$owner, expires=time::now()+120s, revision=revision+1 RETURN NONE;
                  LET $plan = {{ outputs.inspect.row.plan | toJson }};
                  FOR $p IN $plan {
                    LET $rid = type::record($p.record_id);
                    LET $keeper = type::record($p.keeper_id);
                    LET $changed = UPDATE $rid SET dedup_recovery={key_field:'{{ inputs.key_field }}',
                      original_value:{{ inputs.key_field }}, keeper:$keeper, execution_id:$owner, at:time::now()},
                      {{ inputs.key_field }}=NONE
                      WHERE {{ inputs.key_field }}=$p.key_value AND dedup_recovery=NONE RETURN VALUE id TIMEOUT 5s;
                    IF array::len($changed) != 1 { THROW 'Conditional key quarantine did not update one record'; };
                  };
                  RETURN [{quarantined:array::len($plan), owner:$owner}];
                  COMMIT;
                timeout: PT20S
                parameters:
                  snapshot: "{{ outputs.inspect.row.snapshot }}"
                  owner: "{{ execution.id }}"
              - id: install_unique
                type: io.kestra.plugin.surrealdb.Query
                host: "{{ inputs.host }}"
                port: 8000
                useTls: "{{ inputs.use_tls }}"
                username: "{{ inputs.username }}"
                password: "{{ inputs.password }}"
                namespace: "{{ inputs.db_namespace }}"
                database: "{{ inputs.database }}"
                fetchType: FETCH_ONE
                query: |-
                  BEGIN;
                  LET $lock = type::record('maintenance:{{ inputs.table }}_{{ inputs.key_field }}');
                  LET $fence = SELECT * FROM ONLY $lock;
                  IF $fence.paused != true OR $fence.owner != $owner OR $fence.expires <= time::now() {
                    THROW 'Maintenance fence lost before unique-index installation';
                  };
                  UPDATE $lock SET expires=time::now()+120s, revision=revision+1 RETURN NONE;
                  LET $meta = INFO FOR TABLE {{ inputs.table }};
                  LET $definition = (INFO FOR DB).tables.{{ inputs.table }};
                  IF crypto::sha256(type::string([$definition,$meta])) != $schema { THROW 'Schema changed before index installation'; };
                  LET $dups = SELECT * FROM (SELECT {{ inputs.key_field }},count() AS copies FROM {{ inputs.table }}
                    WHERE type::is_string({{ inputs.key_field }}) GROUP BY {{ inputs.key_field }}) WHERE copies>1;
                  IF array::len($dups)>0 { THROW 'Duplicate keys remain; unique index not installed'; };
                  DEFINE INDEX {{ inputs.index_name }} ON {{ inputs.table }} FIELDS {{ inputs.key_field }} UNIQUE;
                  RETURN [{installed:true}];
                  COMMIT;
                timeout: PT20S
                parameters:
                  schema: "{{ outputs.inspect.row.schema }}"
                  owner: "{{ execution.id }}"
              - id: verify
                type: io.kestra.plugin.surrealdb.Query
                host: "{{ inputs.host }}"
                port: 8000
                useTls: "{{ inputs.use_tls }}"
                username: "{{ inputs.username }}"
                password: "{{ inputs.password }}"
                namespace: "{{ inputs.db_namespace }}"
                database: "{{ inputs.database }}"
                fetchType: FETCH_ONE
                query: |-
                  LET $meta = INFO FOR TABLE {{ inputs.table }};
                  LET $rows = SELECT * FROM {{ inputs.table }} ORDER BY id LIMIT {{ inputs.max_records + 1 }} TIMEOUT 5s;
                  LET $dups = SELECT * FROM (SELECT {{ inputs.key_field }},count() AS copies FROM {{ inputs.table }}
                    WHERE type::is_string({{ inputs.key_field }}) GROUP BY {{ inputs.key_field }}) WHERE copies>1;
                  LET $unresolved = SELECT VALUE id FROM $rows WHERE dedup_recovery != NONE AND
                    (dedup_recovery.key_field != '{{ inputs.key_field }}' OR {{ inputs.key_field }} != NONE OR
                     (SELECT VALUE {{ inputs.key_field }} FROM dedup_recovery.keeper)[0] != dedup_recovery.original_value);
                  RETURN [{records:array::len($rows), duplicates:array::len($dups), unresolved:array::len($unresolved),
                    protected_hash:crypto::sha256(type::string(SELECT * OMIT {{ inputs.key_field }},dedup_recovery FROM $rows ORDER BY id)),
                    recovery_count:array::len(SELECT VALUE id FROM $rows WHERE dedup_recovery != NONE),
                    index_definition:$meta.indexes.{{ inputs.index_name }} ?? ''}];
                timeout: PT20S
              - id: verify_outcome
                type: io.kestra.plugin.core.flow.If
                condition: "{{ outputs.verify.row.protected_hash != outputs.inspect.row.protected_hash or outputs.verify.row.records\
                  \ != outputs.inspect.row.records or outputs.verify.row.duplicates != 0 or outputs.verify.row.unresolved\
                  \ != 0 or outputs.verify.row.recovery_count != outputs.inspect.row.recovery_count + outputs.inspect.row.surplus\
                  \ or outputs.verify.row.index_definition != outputs.inspect.row.expected_index }}"
                then:
                  - id: recovery_failed
                    type: io.kestra.plugin.core.execution.Fail
                    errorMessage: Unique installation or recovery conservation failed. Leave maintenance paused
                      and inspect dedup_recovery before retrying.
                else:
                  - id: recovered
                    type: io.kestra.plugin.core.log.Log
                    message: "UNIQUE installed. Records {{ outputs.verify.row.records }}, quarantined keys {{ outputs.verify.row.recovery_count\
                      \ }}, duplicated keys {{ outputs.verify.row.duplicates }}. Maintenance remains paused."
            else:
              - id: declined
                type: io.kestra.plugin.core.log.Log
                message: Approval declined. No key or schema changed.
        else:
          - id: read_only
            type: io.kestra.plugin.core.log.Log
            message: "Read-only plan: {{ outputs.inspect.row.surplus }} conflicting keys; no mutation."
    else:
      - id: healthy_verify
        type: io.kestra.plugin.surrealdb.Query
        host: "{{ inputs.host }}"
        port: 8000
        useTls: "{{ inputs.use_tls }}"
        username: "{{ inputs.username }}"
        password: "{{ inputs.password }}"
        namespace: "{{ inputs.db_namespace }}"
        database: "{{ inputs.database }}"
        fetchType: FETCH_ONE
        query: |-
          LET $meta = INFO FOR TABLE {{ inputs.table }};
          LET $rows = SELECT * FROM {{ inputs.table }} ORDER BY id LIMIT {{ inputs.max_records + 1 }} TIMEOUT 5s;
          LET $dups = SELECT * FROM (SELECT {{ inputs.key_field }},count() AS copies FROM {{ inputs.table }}
            WHERE type::is_string({{ inputs.key_field }}) GROUP BY {{ inputs.key_field }}) WHERE copies>1;
          LET $unresolved = SELECT VALUE id FROM $rows WHERE dedup_recovery != NONE AND
            (dedup_recovery.key_field != '{{ inputs.key_field }}' OR {{ inputs.key_field }} != NONE OR
             (SELECT VALUE {{ inputs.key_field }} FROM dedup_recovery.keeper)[0] != dedup_recovery.original_value);
          RETURN [{records:array::len($rows), duplicates:array::len($dups), unresolved:array::len($unresolved),
            protected_hash:crypto::sha256(type::string(SELECT * OMIT {{ inputs.key_field }},dedup_recovery FROM $rows ORDER BY id)),
            recovery_count:array::len(SELECT VALUE id FROM $rows WHERE dedup_recovery != NONE),
            index_definition:$meta.indexes.{{ inputs.index_name }} ?? ''}];
        timeout: PT20S
      - id: healthy_gate
        type: io.kestra.plugin.core.flow.If
        condition: "{{ outputs.healthy_verify.row.duplicates > 0 or outputs.healthy_verify.row.unresolved > 0 }}"
        then:
          - id: invalid_existing_recovery
            type: io.kestra.plugin.core.execution.Fail
            errorMessage: Existing index or recovery objects are inconsistent.
        else:
          - id: healthy
            type: io.kestra.plugin.core.log.Log
            message: UNIQUE already installed; recovery references consistent. No mutation.
errors:
  - id: alert_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: "{{ {'text': 'SurrealDB unique-key recovery failed for ' ~ inputs.table ~ '.' ~ inputs.key_field ~\
      \ ', execution ' ~ execution.id ~ '. Keep maintenance paused and inspect recovery state.'} | toJson }}"
triggers:
  - id: daily
    type: io.kestra.plugin.core.trigger.Schedule
    cron: 0 3 * * *
    disabled: true
    inputs:
      dry_run: true
      auto_remediate: false

extend:
  title: Install SurrealDB UNIQUE without deleting referenced records
  shortDescription: Quarantine duplicate optional keys in place, preserve record links and graph endpoints, then install a UNIQUE index after approval.
  metaTitle: SurrealDB reference-preserving unique-key recovery
  metaDescription: Preserve SurrealDB records and references while quarantining duplicate optional keys and installing their UNIQUE index after approval.
  description: |
    A replayed import can leave two records with one email. Adding UNIQUE then fails.
    Deleting a duplicate would remove a graph endpoint and leave record links dangling.
    This flow keeps every record. It moves only the surplus active key into `dedup_recovery`,
    with its original value and keeper link, then installs the blocked index.

    ## How it works

    `inspect` reads schema, bounded records and a plan through Query. The
    earliest datetime wins; ties use record ID ordering. NULL and NONE keys are
    skipped. Case-distinct strings stay distinct. After armed mode and an explicit Pause
    approval, `quarantine` compares the full approval snapshot inside its transaction and
    claims the maintenance lease. It moves surplus keys without overwriting
    recovery data. `install_unique` checks the fence and schema in a separate
    transaction. `verify` fails unless UNIQUE exists, duplicate keys are gone, keeper links
    resolve and record counts plus non-key fields match. No automatic write retries.

    ## What you get

    Recoverable values and an enforced unique index.
    IDs, payloads and references stay. A failed second phase leaves a durable
    quarantine that the next approved run reconciles. Maintenance remains paused on every path.

    ## Who it's for

    Teams repairing optional string keys before UNIQUE, where referenced records must survive
    and conflicting keys can be withheld pending review.

    ## Why orchestrate this with Kestra

    Native transactions do the data work. Kestra retains approval and failure notification.
    Index creation follows the committed quarantine: on the tested
    server, combining both in one transaction still saw the old duplicate values and failed.

    ## Tested end to end

    Kestra 2.0.6 and 2.0.5, bundled Query 1.3.9 and 1.3.8, SurrealDB 3.3.3. Independent API
    reads confirmed seven records stayed seven, one conflicting key was archived and zero
    duplicate keys remained. The graph edge, document owner and unrelated values were unchanged.
    A real duplicate insert then failed. Dry run, declined approval, refused writes, repeat,
    changed or deleted targets, partial-index retry and a second fresh instance were exercised.
    Unicode IDs, NULL, empty strings and size ceilings were checked.

    ## Prerequisites

    SurrealDB 3.3.3 with server query and transaction timeouts at most 10 seconds. Query signs
    in as a root-level system user; EDITOR is the minimum tested role, VIEWER cannot write.
    Support is deliberately narrow: an exact TYPE ANY SCHEMALESS PERMISSIONS NONE table with
    no defined fields, events or derived tables. Do not relax a mandatory key definition here.
    Provision `maintenance:<table>_<key_field>` with `paused: true` and integer `revision`.
    Writers and schema administrators must check `paused: false` and update that same
    control record in its transaction. The flow claims a 120-second owner lease. Bypassing
    writers are not fenced; flow concurrency only serializes this flow ID.

    ### Secrets

    `SURREALDB_PASSWORD` supplies the SECRET password input. `SLACK_WEBHOOK_URL` receives errors.

    ### Inputs

    Connection: `host`, `username`, `password`, `db_namespace`, `database`, `use_tls` (true).
    Selection: `table`, `key_field`, `created_field`, `index_name`, ASCII names up to 63 characters.
    Limits: `max_records` 2000, `max_surplus` 200 and `max_bytes` 2000000, a conservative
    four-byte-per-character estimate. Keys are at most 512 characters. No cap truncates a write.
    `dry_run` defaults true; `auto_remediate` defaults false. `dedup_recovery` is reserved.

    ## Quick start

    1. Configure secrets and the maintenance contract.
    2. Run read-only and review the keeper and surplus plan. Pause writers before arming.
    3. Set `dry_run: false`, `auto_remediate: true` and approve. Check the index and recovery values.
    4. On failure keep maintenance paused, inspect the receipt, let its lease expire and rerun.
       Resolve a quarantined key by assigning a verified distinct value before reopening writers.

    ## How to extend

    Add a ticket for each quarantine. A manual restore can reassign the saved value only after
    resolving its conflict under the same fence; blindly restoring it will violate UNIQUE.
    Limits: optional top-level strings only, no normalization, record merges or reference rewrites.

    ## Links

    - [Query](https://kestra.io/plugins/plugin-surrealdb/query)
    - [UNIQUE indexes](https://surrealdb.com/docs/surrealql/statements/define/indexes)
    - [Transactions](https://surrealdb.com/docs/surrealql/statements/begin)

    This blueprint was created by [zkasuran](https://github.com/zkasuran).
  tags:
    - Data
    - Infrastructure
  subTags:
    - Day 2 Operations
    - Monitoring & Alerting
  ee: false
  demo: false
