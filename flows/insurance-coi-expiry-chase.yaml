id: insurance-coi-expiry-chase
namespace: company.team

description: |
  Expired certificates of insurance turn a covered loss into an uncovered
  claim, so this flow chases the broker while the policy is still
  recoverable. A keyed webhook starts the check whenever a vendor uploads a
  new COI and a disabled monthly schedule stands ready as the fallback net; a
  shell step writes cois.csv and a python step parses it with the csv module,
  splitting the rows into certificates already expired and certificates
  expiring inside the horizon window. When anything is flagged, each broker
  gets a chase email, one GitHub rollup issue opens for tracking and the
  compliance channel receives a Slack summary, while a clean register is
  logged as clear. Each run exposes the verdict, the expired count, the
  expiring count and the flagged vendors as typed outputs.

triggers:
  - id: coi_uploaded
    type: io.kestra.plugin.core.trigger.Webhook
    description: The vendor portal POSTs here each time a certificate of insurance is uploaded, so the new document is checked before onboarding continues.
    key: "{{ secret('COI_UPLOAD_WEBHOOK_KEY') }}"
  - id: monthly_expiry_sweep
    type: io.kestra.plugin.core.trigger.Schedule
    description: Disabled monthly net that would sweep every certificate on the first morning of each month until an operator switches it on.
    cron: "0 6 1 * *"
    disabled: true

inputs:
  - id: expiry_horizon_days
    type: INT
    defaults: 45
    description: Horizon in days inside which a future expiry date counts as expiring soon rather than clear.
  - id: github_repository
    type: STRING
    defaults: acme-corp/compliance-register
    description: Repository that receives the rollup tracking issue when expired or expiring certificates are found.

tasks:
  # --- 1. the certificate register and its verdict ---
  - id: coi_workspace
    type: io.kestra.plugin.core.flow.WorkingDirectory
    description: One shared directory so the CSV written by the shell step is the exact file the python step reads.
    tasks:
      - id: write_cois
        type: io.kestra.plugin.scripts.shell.Commands
        description: Writes cois.csv from a heredoc of eight rows carrying vendor, policy_type, expiry and broker_email, dated forward from today so three rows are already expired, two land inside the horizon window and three stay clear.
        commands:
          - |
            set -eu
            cat > cois.csv <<COIS_EOF
            vendor,policy_type,expiry,broker_email
            Harborline Freight,general liability,$(date -d "-45 days" +%F),dana.roy@brightline-broker.example.com
            Vantage Steel Works,workers compensation,$(date -d "-18 days" +%F),marcus.hale@northgate-broker.example.com
            Cobalt Robotics,professional indemnity,$(date -d "-4 days" +%F),priya.nair@meridian-broker.example.com
            Nimbus Cloud Services,cyber liability,$(date -d "+10 days" +%F),elena.voss@orbit-broker.example.com
            Ridgeway Facilities,environmental liability,$(date -d "+45 days" +%F),jonah.reed@quill-broker.example.com
            Pinewood Catering,general liability,$(date -d "+70 days" +%F),tomas.berg@harbor-broker.example.com
            Quill Media Group,errors and omissions,$(date -d "+120 days" +%F),sara.lindqvist@meridian-broker.example.com
            Sunridge Utilities,environmental liability,$(date -d "+210 days" +%F),tomas.berg@harbor-broker.example.com
            COIS_EOF
            echo "coi rows $(($(wc -l < cois.csv) - 1))"

      - id: assess_coi
        type: io.kestra.plugin.scripts.python.Script
        description: Reads cois.csv with the csv module, separates certificates already expired from those expiring inside the horizon, and emits verdict, expired_count, expiring_count and vendors through the outputs protocol.
        taskRunner:
          type: io.kestra.plugin.core.runner.Process
        env:
          EXPIRY_HORIZON: "{{ inputs.expiry_horizon_days }}"
        script: |
          import csv
          import json
          import os
          from datetime import date

          CSV_FILE = "cois.csv"
          REQUIRED = ("vendor", "policy_type", "expiry", "broker_email")


          def env_int(name, fallback):
              try:
                  value = int(str(os.environ.get(name, "")).strip())
              except ValueError:
                  return fallback
              return value if value >= 0 else fallback


          def build():
              horizon = env_int("EXPIRY_HORIZON", 45)
              today = date.today()

              header = []
              rows = []
              if os.path.exists(CSV_FILE):
                  with open(CSV_FILE, newline="", encoding="utf-8") as handle:
                      reader = csv.DictReader(handle)
                      header = list(reader.fieldnames or [])
                      rows = [row for row in reader]

              if not all(name in header for name in REQUIRED) or not rows:
                  return ("NO_DATA", 0, 0, [],
                          "cois.csv is missing required columns or carries no rows")

              expired = []
              expiring = []
              readable = 0
              skipped = 0
              for row in rows:
                  vendor = (row.get("vendor") or "").strip()
                  policy_type = (row.get("policy_type") or "").strip()
                  broker = (row.get("broker_email") or "").strip()
                  try:
                      expiry = date.fromisoformat((row.get("expiry") or "").strip())
                  except ValueError:
                      skipped += 1
                      continue
                  if not vendor or "@" not in broker:
                      skipped += 1
                      continue
                  readable += 1
                  days_to_expiry = (expiry - today).days
                  entry = {
                      "vendor": vendor,
                      "policy_type": policy_type or "unspecified",
                      "expiry": expiry.isoformat(),
                      "broker_email": broker,
                      "days_to_expiry": days_to_expiry,
                  }
                  if expiry < today:
                      entry["status"] = "expired"
                      expired.append(entry)
                  elif days_to_expiry <= horizon:
                      entry["status"] = "expiring_soon"
                      expiring.append(entry)

              if readable == 0:
                  return ("NO_DATA", 0, 0, [],
                          "no row carried a readable expiry date and a broker address")

              expired.sort(key=lambda item: item["days_to_expiry"])
              expiring.sort(key=lambda item: item["days_to_expiry"])
              vendors = expired + expiring
              expired_count = len(expired)
              expiring_count = len(expiring)
              verdict = "CHASE_REQUIRED" if vendors else "ALL_CLEAR"
              summary = ("checked %d COI row(s), %d expired, %d expiring within "
                         "%d day(s), %d unreadable") % (
                  len(rows), expired_count, expiring_count, horizon, skipped)
              return (verdict, expired_count, expiring_count, vendors, summary)


          verdict, expired_count, expiring_count, vendors, summary = build()
          print(summary)
          print("::" + json.dumps({"outputs": {"verdict": verdict, "expired_count": expired_count, "expiring_count": expiring_count, "vendors": vendors}}) + "::")

  # --- 2. the expiry gate ---
  - id: expiry_gate
    type: io.kestra.plugin.core.flow.If
    description: Escalates only when at least one certificate is expired or expiring inside the horizon; a register with nothing flagged is logged without waking anyone.
    condition: "{{ outputs.assess_coi.vars.expired_count > 0 or outputs.assess_coi.vars.expiring_count > 0 }}"
    then:
      - id: chase_brokers
        type: io.kestra.plugin.core.flow.Loop
        description: Walks the flagged certificates one at a time so each broker is chased about their own policy instead of receiving one crowded digest.
        values: "{{ outputs.assess_coi.vars.vendors }}"
        concurrencyLimit: 1
        tasks:
          - id: send_broker_chase
            type: io.kestra.plugin.email.MailSend
            description: Reminds a single broker that a named policy is expired or expiring, with the carrier date, the days remaining and the policy type in the subject.
            from: "{{ secret('SMTP_FROM') }}"
            to: "{{ item.value.broker_email }}"
            host: "{{ secret('SMTP_HOST') }}"
            username: "{{ secret('SMTP_USERNAME') }}"
            password: "{{ secret('SMTP_PASSWORD') }}"
            port: 465
            subject: "Certificate of insurance {{ item.value.status }} for {{ item.value.vendor }} - {{ item.value.expiry }}"
            htmlTextContent: |
              <p>{{ item.value.broker_email }},</p>
              <p>The <strong>{{ item.value.policy_type }}</strong> certificate of
              insurance for <strong>{{ item.value.vendor }}</strong> expires on
              <strong>{{ item.value.expiry }}</strong>, which is
              <strong>{{ item.value.days_to_expiry }}</strong> days away. The register
              currently reads <strong>{{ item.value.status }}</strong>.</p>
              <p>Send the renewed certificate, or the carrier confirmation that the
              policy has been extended, so this line drops off the chase list.</p>
              <p>Execution {{ execution.id }}</p>

      - id: open_rollup_issue
        type: io.kestra.plugin.github.issues.Create
        description: Opens one labeled tracking issue listing every flagged certificate with vendor, policy type, expiry, days remaining, status and broker, so the chase leaves a backlog record.
        jwtToken: "{{ secret('GITHUB_TOKEN') }}"
        repository: "{{ inputs.github_repository }}"
        title: "Certificate of insurance chase - {{ outputs.assess_coi.vars.expired_count }} expired, {{ outputs.assess_coi.vars.expiring_count }} expiring"
        body: |
          ## Vendor certificate of insurance chase

          **{{ outputs.assess_coi.vars.expired_count }}** certificate(s) have already expired and **{{ outputs.assess_coi.vars.expiring_count }}** expire within {{ inputs.expiry_horizon_days }} days.

          | Vendor | Policy type | Expiry | Days to expiry | Status | Broker |
          | --- | --- | --- | --- | --- | --- |
          {% for v in outputs.assess_coi.vars.vendors %}| {{ v.vendor }} | {{ v.policy_type }} | {{ v.expiry }} | {{ v.days_to_expiry }} | {{ v.status }} | {{ v.broker_email }} |
          {% endfor %}

          Execution: {{ execution.id }}

          Chase every line above with the broker named, then close this issue once the register reads ALL_CLEAR.
        labels:
          - insurance
          - coi

      - id: alert_slack
        type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
        description: Summarizes the expired and expiring tallies and lists each flagged certificate with its broker so the compliance channel sees the exposure at once.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {"text": "COI expiry chase - {{ outputs.assess_coi.vars.expired_count }} expired and {{ outputs.assess_coi.vars.expiring_count }} expiring within {{ inputs.expiry_horizon_days }} days. {% for v in outputs.assess_coi.vars.vendors %}{{ v.vendor }} {{ v.status }} on {{ v.expiry }} with {{ v.broker_email }}. {% endfor %}Rollup issue opened in {{ inputs.github_repository }}. Execution {{ execution.id }}."}
    else:
      - id: log_all_clear
        type: io.kestra.plugin.core.log.Log
        description: Records the quiet outcome in execution history, where every certificate runs past the horizon and no broker needs chasing.
        message: "No certificate needs a chase - verdict {{ outputs.assess_coi.vars.verdict }}, expired {{ outputs.assess_coi.vars.expired_count }}, expiring {{ outputs.assess_coi.vars.expiring_count }}."

errors:
  - id: notify_failure
    type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
    description: Escalate any failure to the ops channel with the execution url.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {"text": "FAILED: {{ flow.id }} {{ execution.id }}"}

outputs:
  - id: verdict
    type: STRING
    value: "{{ outputs.assess_coi.vars.verdict }}"
  - id: expired_count
    type: INT
    value: "{{ outputs.assess_coi.vars.expired_count }}"
  - id: expiring_count
    type: INT
    value: "{{ outputs.assess_coi.vars.expiring_count }}"
  - id: vendors
    type: ARRAY
    value: "{{ outputs.assess_coi.vars.vendors | toJson }}"

extend:
  title: Chase Brokers Before Vendor Certificates of Insurance Expire
  metaTitle: Chase Broker Renewals Before Vendor COIs Expire
  shortDescription: Parse the COI register, chase every broker holding an expired or soon-expiring certificate, open one rollup issue and alert Slack.
  metaDescription: Read the COI register, email the broker behind every expired or soon-expiring certificate, open a GitHub rollup issue and alert Slack.
  description: |
    Certificates of insurance lapse quietly. A carrier stops renewing a policy, the broker forgets to send the updated certificate, and the first anyone hears about it is a claim denied for coverage that ended weeks ago. This flow runs whenever the vendor portal uploads a new COI, or on the first morning of each month once the disabled schedule is switched on, reads the register CSV and splits every row into certificates already expired and certificates expiring inside the horizon window. When anything is flagged, each broker receives a chase email naming their own policy, one GitHub rollup issue is opened for tracking and the compliance channel gets a Slack summary; a clean register is logged as clear instead.

    ## How it works

    1. `coi_uploaded` (`io.kestra.plugin.core.trigger.Webhook`) accepts a certificate upload from the vendor portal and starts the check on the spot. `monthly_expiry_sweep` (`io.kestra.plugin.core.trigger.Schedule`, cron `0 6 1 * *`) sits disabled as the net to switch on for a first-of-month sweep.
    2. `coi_workspace` (`io.kestra.plugin.core.flow.WorkingDirectory`) opens one shared directory for the fixture and for the parser that consumes it.
    3. `write_cois` (`io.kestra.plugin.scripts.shell.Commands`) drops `cois.csv` with a heredoc of eight rows, each carrying vendor, policy type, expiry date and broker email, dated forward from today with `date -d` so the fixture always holds three expired certificates, two expiring inside the horizon and three still clear.
    4. `assess_coi` (`io.kestra.plugin.scripts.python.Script`) reads the file with the `csv` module, marks every expiry date before today as expired, marks every expiry landing within `expiry_horizon_days` as expiring soon, and prints one `::{"outputs": ...}::` line carrying `verdict`, `expired_count`, `expiring_count` and `vendors`. Unreadable rows are counted and skipped instead of crashing the run.
    5. `expiry_gate` (`io.kestra.plugin.core.flow.If`) escalates only when `expired_count` or `expiring_count` is above zero.
    6. In the escalation branch `chase_brokers` (`io.kestra.plugin.core.flow.Loop`) runs `send_broker_chase` (`io.kestra.plugin.email.MailSend`) once per flagged certificate against that policy's broker address, `open_rollup_issue` (`io.kestra.plugin.github.issues.Create`) files one labeled issue with the full table, and `alert_slack` (`io.kestra.plugin.notifications.slack.SlackIncomingWebhook`) posts the exposure summary. The other branch records the quiet outcome with `log_all_clear` (`io.kestra.plugin.core.log.Log`).
    7. The `errors` handler pings Slack when the run itself breaks, because a failed check looks exactly like a clean register.

    ## What you get

    - `verdict` (STRING): `CHASE_REQUIRED` when at least one certificate is expired or expiring inside the horizon, `ALL_CLEAR` when every policy runs past the window, `NO_DATA` when the file carries no usable rows.
    - `expired_count` (INT): certificates whose expiry date has already passed, zero on a healthy register.
    - `expiring_count` (INT): certificates expiring on or before the horizon, counted separately from the already expired ones.
    - `vendors` (ARRAY): one object per flagged certificate with `vendor`, `policy_type`, `expiry`, `broker_email`, `days_to_expiry` and `status`, expired rows first so the worst lapses lead the chase.
    - One chase email per flagged broker, one GitHub rollup issue and one Slack summary when anything is flagged, and a log line when nothing is.

    ## Who it's for

    - Compliance and risk teams who own the vendor certificate register and cannot let a lapsed policy reach a claim unanswered.
    - Procurement and vendor managers who receive COI uploads and want an immediate answer on what has already expired.
    - Operations leads who want the chase to leave a paper trail through email, a GitHub issue and Slack instead of a spreadsheet reminder.

    ## Why orchestrate this with Kestra

    A calendar reminder on a spreadsheet only works when somebody opens the spreadsheet. Kestra supplies the upload webhook and the disabled monthly schedule, the branch that separates a clean register from a lapsed one, the loop that turns one parse into one email per broker, and email, GitHub and Slack routing from a single versioned file. The verdict, both counts and the flagged vendor list are typed outputs, so a vendor onboarding gate can read the state without scraping logs, and the `errors` handler keeps a broken run visible.

    ## Prerequisites

    - A Kestra instance with the email, GitHub and Slack plugins available to the worker.
    - An SMTP relay reachable from the worker, with a sender address allowed to use it.
    - A GitHub personal access token able to open issues in the compliance repository.
    - A Slack incoming webhook for the chase summary and for failure alerts.
    - A certificate register export shaped as `vendor, policy_type, expiry, broker_email`, supplied through the heredoc fixture or replaced with your own export task.

    ### Secrets

    - `COI_UPLOAD_WEBHOOK_KEY`: key segment guarding the webhook URL, so only your vendor portal can start a check.
    - `SMTP_FROM`: sender address shown on every broker chase email.
    - `SMTP_HOST`, `SMTP_USERNAME`, `SMTP_PASSWORD`: SMTP relay and credentials used by `send_broker_chase`.
    - `GITHUB_TOKEN`: token used by `open_rollup_issue` to file the tracking issue.
    - `SLACK_WEBHOOK_URL`: Slack incoming webhook used for the chase summary and for failure alerts.

    ## Quick start

    1. Add the seven secrets to your namespace and import the flow.
    2. Point `github_repository` at the repo that should receive the rollup issues, and raise or lower `expiry_horizon_days` if forty-five days is not your warning window.
    3. Execute the flow once against the fixture and read `verdict`, `expired_count`, `expiring_count` and `vendors` in the outputs. The fixture reports three expired certificates and two expiring inside forty-five days, so five brokers are emailed.
    4. Point your vendor portal at `/api/v1/{tenant}/executions/webhook/{namespace}/insurance-coi-expiry-chase/COI_UPLOAD_WEBHOOK_KEY`, then confirm one email per flagged broker, the GitHub rollup issue and the Slack summary.
    5. Switch on `monthly_expiry_sweep` when you want the whole register swept on the first morning of each month.

    ## How to extend

    - Replace the heredoc with an export from your procurement system, or a `jdbc` query against the contract database, and keep the same python verdict.
    - Group the flagged certificates by broker before the loop when one broker should receive a single digest covering all of their policies.
    - Add a second gate on `expired_count` alone to page the compliance lead directly as soon as something has already lapsed.
    - Feed `verdict` into a vendor onboarding gate flow so a new contract cannot proceed while a certificate reads expired.
    - Persist `vendors` for audit evidence with `io.kestra.plugin.jdbc.postgresql.Queries` or ship the snapshot to `io.kestra.plugin.aws.s3.Upload`.

    ## Links

    - [Email MailSend task](https://kestra.io/plugins/plugin-email/io.kestra.plugin.email.mailsend)
    - [GitHub issues Create task](https://kestra.io/plugins/plugin-github/io.kestra.plugin.github.issues.create)
    - [Loop task documentation](https://kestra.io/docs/workflow-components/tasks/flow-control/loop)
    - [Kestra flow triggers](https://kestra.io/docs/concepts/triggers)
  tags:
    - Business
  subTags:
    - insurance
    - compliance
    - vendor-risk
    - notifications
  ee: false
  demo: false
