id: scheduled-markdown-link-audit
namespace: company.team
description: Audit external HTTP(S) links in Markdown from a public GitHub repository.
  Save HTTP absence and uncertain-result reports separately, without running repository
  code.
inputs:
- id: repository
  type: STRING
  defaults: https://github.com/kestra-io/blueprints.git
- id: branch
  type: STRING
  defaults: main
- id: markdown_glob
  type: STRING
  defaults: README.md
triggers:
- id: weekly
  type: io.kestra.plugin.core.trigger.Schedule
  cron: 17 7 * * 1
  disabled: true
tasks:
- id: validate_repository
  type: io.kestra.plugin.scripts.shell.Commands
  taskRunner:
    type: io.kestra.plugin.core.runner.Process
  env:
    REPOSITORY: '{{ inputs.repository }}'
  inputFiles:
    validate.py: "import os,re\nurl=os.environ['REPOSITORY']\nif not re.fullmatch(r'https://github\\\
      .com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+(?:\\.git)?',url):\n    raise ValueError('This\
      \ example only audits public github.com repositories over HTTPS')\n"
  commands:
  - python3 validate.py
- id: audit
  type: io.kestra.plugin.core.flow.WorkingDirectory
  tasks:
  - id: clone
    type: io.kestra.plugin.git.Clone
    url: '{{ inputs.repository }}'
    branch: '{{ inputs.branch }}'
    directory: repository
    cloneSubmodules: false
  - id: scan
    type: io.kestra.plugin.scripts.shell.Commands
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    env:
      MARKDOWN_GLOB: '{{ inputs.markdown_glob }}'
    commands:
    - lychee --version | grep -Fx "lychee 0.24.2"
    - python3 select_files.py
    - cd repository; set +e; lychee --config /dev/null --no-progress --exclude-all-private
      --include-mail=false --exclude "^file:" --max-concurrency 2 --max-retries 0
      --timeout 15 --format json --files-from markdown-files.txt > ../lychee.json;
      result=$?; set -e; test "$result" -eq 0 -o "$result" -eq 2; test -s ../lychee.json
    outputFiles:
    - lychee.json
    inputFiles:
      select_files.py: "import glob,json,os\nfrom pathlib import Path\nroot=Path('repository').resolve()\n\
        pattern=os.environ['MARKDOWN_GLOB']\nif pattern.startswith(('/', '-')) or\
        \ '..' in Path(pattern).parts or '\\n' in pattern:\n    raise ValueError('Use\
        \ a relative Markdown glob without parent traversal')\nselected=[]\nfor name\
        \ in sorted(glob.glob(str(root/pattern),recursive=True)):\n    path=Path(name)\n\
        \    if not path.is_file() or path.suffix.lower() not in ('.md','.markdown'):continue\n\
        \    if path.is_symlink() or not path.resolve().is_relative_to(root):\n  \
        \      raise ValueError('Markdown files must stay inside the checkout, without\
        \ symlinks')\n    if path.stat().st_size>1_000_000:raise ValueError('Markdown\
        \ file exceeds 1 MB; narrow the scope')\n    selected.append(str(path.relative_to(root)))\n\
        if not selected:raise ValueError('No Markdown files matched; an empty scan\
        \ is not success')\nif len(selected)>50:raise ValueError('More than 50 files\
        \ matched; narrow the scope')\nPath('repository/markdown-files.txt').write_text('\\\
        n'.join(selected)+'\\n')\nprint('Selected',len(selected),'Markdown files')\n"
  - id: report
    type: io.kestra.plugin.scripts.shell.Commands
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    inputFiles:
      summarize.py: "import json\nfrom pathlib import Path\n\nraw = json.loads(Path('lychee.json').read_text())\n\
        confirmed, uncertain = [], []\nfor source, entries in raw.get('error_map',\
        \ {}).items():\n    for entry in entries:\n        status = entry.get('status',\
        \ {})\n        code = status.get('code')\n        text = status.get('text',\
        \ '')\n        item = {'source': source, 'url': entry['url'], 'status': text,\
        \ 'line': entry.get('span', {}).get('line')}\n        # Only explicit absence\
        \ is actionable. Auth, throttling and server/network\n        # errors need\
        \ a later check, not a declaration that the link is dead.\n        if code\
        \ in (404, 410) or (entry['url'].startswith('file:') and 'File not found'\
        \ in text):\n            confirmed.append(item)\n        else:\n         \
        \   uncertain.append(item)\nfor source, entries in raw.get('timeout_map',\
        \ {}).items():\n    for entry in entries:\n        uncertain.append({'source':\
        \ source, 'url': entry['url'], 'status': 'timeout', 'line': entry.get('span',\
        \ {}).get('line')})\nreport = {'checked': raw.get('total', 0), 'successful':\
        \ raw.get('successful', 0), 'excluded': raw.get('excludes', 0), 'needs_fix':\
        \ confirmed, 'needs_recheck': uncertain}\nconfirmed.sort(key=lambda x:(x['source'],x['line']\
        \ or 0,x['url']))\nuncertain.sort(key=lambda x:(x['source'],x['line'] or 0,x['url']))\n\
        Path('link-audit.json').write_text(json.dumps(report, indent=2))\nlines =\
        \ ['# Markdown link audit', '', f\"Checked: {report['checked']}; successful:\
        \ {report['successful']}; excluded: {report['excluded']}\", '', '## Links\
        \ to inspect (HTTP 404/410 or missing local files)' ]\nfor title, items in\
        \ [('Links to inspect', confirmed), ('Needs a recheck (not labelled broken)',\
        \ uncertain)]:\n    if title != 'Links to inspect': lines += ['', '## ' +\
        \ title]\n    lines.extend(f\"- {x['source']}:{x['line']}: {x['url']} ({x['status']})\"\
        \ for x in items)\n    if not items: lines.append('- None')\nPath('link-audit.md').write_text('\\\
        n'.join(lines) + '\\n')\nprint('::' + json.dumps({'outputs': {'missing_count':\
        \ len(confirmed), 'recheck_count': len(uncertain), 'checked_count': report['checked']}})\
        \ + '::')\n"
      lychee.json: '{{ outputs.scan.outputFiles[''lychee.json''] }}'
    commands:
    - python3 summarize.py
    outputFiles:
    - link-audit.json
    - link-audit.md
- id: missing_links
  type: io.kestra.plugin.core.flow.If
  condition: '{{ outputs.report.vars.missing_count > 0 }}'
  then:
  - id: review_missing
    type: io.kestra.plugin.core.log.Log
    message: 'HTTP 404/410 responses: {{ outputs.report.vars.missing_count }}. Inspect
      the report before changing links; servers can mask access errors as 404. No
      issues or notifications were posted.'
  else:
  - id: review_uncertain
    type: io.kestra.plugin.core.log.Log
    message: 'No confirmed missing links. Results needing a recheck: {{ outputs.report.vars.recheck_count
      }}. Excluded links are not proof of success.'
outputs:
- id: report_json
  type: FILE
  required: false
  value: '{{ outputs.report.outputFiles[''link-audit.json''] ?? null }}'
- id: report_markdown
  type: FILE
  required: false
  value: '{{ outputs.report.outputFiles[''link-audit.md''] ?? null }}'
- id: missing_count
  type: INT
  required: false
  value: '{{ outputs.report.vars.missing_count ?? 0 }}'
- id: recheck_count
  type: INT
  required: false
  value: '{{ outputs.report.vars.recheck_count ?? 0 }}'
extend:
  shortDescription: Audit external links in Markdown files of a public GitHub repository and save separate reports for HTTP 404/410 results and results that need a recheck.
  title: Scheduled Markdown external-link audit with lychee
  metaTitle: Markdown Link Audit for GitHub Repositories in Kestra
  metaDescription: Check external links in a public GitHub repo's Markdown files with lychee and get reports that separate HTTP 404/410 from results to recheck.
  description: |
    Audit the external HTTP(S) links in Markdown files of a public GitHub repository and get two reports: links that returned HTTP 404 or 410, and results that need another check (access errors, rate limits, server errors, timeouts). The flow never changes the repository, never posts issues and never sends notifications.

    ## How it works
    1. `validate_repository` accepts only public `https://github.com/<owner>/<repo>` URLs and fails before any clone otherwise.
    2. `clone` makes a checkout without submodules. `scan` selects Markdown files with the `markdown_glob` input (relative glob, at most 50 files, 1 MB each, no symlinks or parent traversal) and runs a pinned lychee with `--config /dev/null`, so the repository's own configuration and code are never executed.
    3. `report` writes `link-audit.json` and `link-audit.md`. Only 404/410 responses (and missing local files) are listed as links to inspect; 403, 429, 5xx and timeouts go to the recheck list.
    4. A final `Log` task summarizes the counts.

    ## Prerequisites
    - Python 3.10+ and lychee 0.24.2 on the worker PATH. The tasks use the `Process` task runner.
    - Outbound access to the links being checked. No secrets are needed.
    - The weekly `Schedule` trigger is disabled by default; enable it when you are ready.

    ## Inputs
    - `repository` (STRING, default `https://github.com/kestra-io/blueprints.git`): public GitHub repository over HTTPS.
    - `branch` (STRING, default `main`).
    - `markdown_glob` (STRING, default `README.md`): relative glob of Markdown files to scan.

    ## Outputs
    - `report_json` and `report_markdown` (FILE, for example `{{ outputs.report.outputFiles['link-audit.md'] }}`), plus `missing_count` and `recheck_count`. On a failed validation or scan the outputs are skipped.

    ## Notes
    A successful execution means the audit produced its reports, not that every link is valid. Excluded links (local files, email, private IP ranges) are not checked and fragment correctness is not verified. A 404 can also come from a server that hides access restrictions, so inspect before editing links. See the [lychee documentation](https://lychee.cli.rs) and the [Git plugin documentation](https://kestra.io/plugins/plugin-git).
  tags:
    - Core
    - Infrastructure
  subTags:
    - Testing & Quality
    - Scheduling
  ee: false
  demo: false
