id: website-content-change-monitor
namespace: company.team

description: |
  Website content change monitor. The flow fetches a list of pages on a
  schedule, hashes each page's content, compares against the previous run
  stored in the KV Store, and alerts you on Slack only when a page's
  content actually changed. Useful for tracking competitor pricing pages,
  documentation, terms of service, job boards, and changelogs.

triggers:
  - id: daily
    type: io.kestra.plugin.core.trigger.Schedule
    description: Run every morning so content changes are caught within a day.
    cron: "0 9 * * *"

inputs:
  - id: pages
    type: ARRAY
    itemType: STRING
    displayName: Pages to monitor
    description: Full URLs whose content will be watched for changes.
    defaults:
      - https://kestra.io/docs
      - https://example.com
  - id: slack_webhook
    type: STRING
    displayName: Slack webhook URL (optional)
    description: Incoming webhook for content-change alerts. Leave empty to skip Slack alerts.
    defaults: ""

tasks:
  - id: fetch_pages
    type: io.kestra.plugin.core.flow.Loop
    description: Fetch every monitored page with its own HTTP request. A failed fetch never stops the loop.
    values: "{{ inputs.pages }}"
    concurrencyLimit: 5
    tasks:
      - id: fetch_one
        type: io.kestra.plugin.core.http.Request
        description: Download one page and capture its body for hashing.
        uri: "{{ item.value }}"
        method: GET
        allowFailed: true
    outputs:
      - id: url
        type: STRING
        description: The page that was fetched.
        value: "{{ item.value }}"
      - id: body
        type: STRING
        description: The page body, or empty when the fetch failed.
        value: "{{ outputs.fetch_one.body | default('') }}"

  - id: hash_pages
    type: io.kestra.plugin.scripts.python.Script
    description: Hash each fetched page body so content changes are detectable without storing full pages.
    outputFiles:
      - hashes.json
    script: |
      import hashlib
      import json

      pages = {{ outputs.fetch_pages | toJson }}
      hashes = {}
      for page in pages:
          body = page.get("body") or ""
          digest = hashlib.sha256(body.encode("utf-8", errors="ignore")).hexdigest() if body else None
          hashes[page["url"]] = digest

      with open("hashes.json", "w") as f:
          json.dump(hashes, f, indent=2)
      print(f"Hashed {len(hashes)} pages")

  - id: previous_hashes
    type: io.kestra.plugin.core.kv.Get
    description: Load the previous run's page hashes from the KV Store. Missing on the first run, which is fine.
    key: content-monitor-last-hashes
    errorOnMissing: false

  - id: detect_changes
    type: io.kestra.plugin.scripts.python.Script
    description: Compare current hashes against the previous run. Only genuinely changed pages produce alerts.
    outputFiles:
      - changed.json
    script: |
      import json

      current = json.load(open("{{ outputs.hash_pages.files['hashes.json'] }}"))
      previous_raw = """{{ outputs.previous_hashes.value | default('{}') }}"""
      try:
          previous = json.loads(previous_raw) if previous_raw.strip() else {}
      except json.JSONDecodeError:
          previous = {}
      if not isinstance(previous, dict):
          previous = {}

      changed = []
      for url, digest in current.items():
          if digest is None:
              continue
          if url not in previous or previous[url] != digest:
              changed.append(url)

      with open("changed.json", "w") as f:
          json.dump({"changed": changed, "total": len(current)}, f, indent=2)
      print(f"Changed pages: {len(changed)} of {len(current)}")

  - id: save_hashes
    type: io.kestra.plugin.core.kv.Set
    description: Persist the current hashes as the baseline for the next run.
    key: content-monitor-last-hashes
    value: "{{ read(outputs.hash_pages.files['hashes.json']) }}"
    kvType: JSON

  - id: report
    type: io.kestra.plugin.core.log.Log
    description: Print the content-change report in the execution logs.
    message: |
      ## Content change report

      {% set d = outputs.detect_changes.files['changed.json'] | fromJson %}
      Checked {{ d.total }} pages, {{ d.changed | length }} changed.

      {% if d.changed | length > 0 %}
      ### Changed pages
      {% for url in d.changed %}
      - {{ url }}
      {% endfor %}
      {% endif %}

  - id: needs_alert
    type: io.kestra.plugin.core.flow.If
    description: Alert only when at least one page actually changed.
    condition: "{{ (outputs.detect_changes.files['changed.json'] | fromJson).changed | length > 0 }}"
    tasks:
      - id: slack_alert
        type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
        description: Send changed pages to Slack.
        url: "{{ inputs.slack_webhook }}"
        payload: |
          {
            "text": ":newspaper: Content changed on monitored pages (execution {{ execution.id }})",
            "blocks": [
              {"type": "section", "text": {"type": "mrkdwn", "text": "*Pages with content changes:*\n{% for url in (outputs.detect_changes.files['changed.json'] | fromJson).changed %}• {{ url }}\n{% endfor %}"}}
            ]
          }

extend:
  title: Website Content Change Monitor
  metaTitle: Content Change Monitor with Kestra
  shortDescription: Watch a list of pages for content changes on a daily schedule, track page hashes in the KV Store, and get a Slack alert only when a page actually changed.
  description: |
    Pricing pages, documentation, terms of service, job boards, and competitor sites change without warning, and nobody notices until it is too late. This blueprint watches a list of pages, detects content changes by hashing, and alerts you on Slack only when something actually changed.

    ## How it works

    1. The `daily` trigger (`io.kestra.plugin.core.trigger.Schedule`) runs the flow every morning at 09:00.
    2. The `fetch_pages` task (`io.kestra.plugin.core.flow.Loop`, concurrency 5) issues one HTTP request per page. A failed fetch never stops the loop.
    3. The `hash_pages` task hashes each page body with SHA-256, so changes are detectable without storing full page contents. This is the only script in the flow, and it only hashes; all fetching is done by native Kestra HTTP tasks.
    4. The `previous_hashes` task (`io.kestra.plugin.core.kv.Get`) loads the last run's hashes from the KV Store.
    5. The `detect_changes` task compares current hashes against the previous run. A page that changed once does not alert again until it changes again.
    6. The `save_hashes` task (`io.kestra.plugin.core.kv.Set`) persists the current hashes as the next baseline.
    7. The `report` task logs the full summary, and the `needs_alert` task (`io.kestra.plugin.core.flow.If`) fires the Slack alert only when at least one page changed.

    ## Criteria checklist

    - Runnable tasks: 7 (loop fetch, hash, KV get, detect, KV set, report, alert)
    - Flowable tasks: Loop and If
    - Trigger: daily Schedule trigger
    - Non-core plugin: Slack notifications

    ## Who it's for

    - Founders and marketers tracking competitor pricing and landing pages.
    - Teams watching documentation, terms, or policy pages for silent updates.
    - Job seekers monitoring job boards for new postings on a specific page.
    - Anyone who has ever missed an important change because nobody was watching the page.

    ## Prerequisites

    - A running Kestra instance with the Python script and Slack notification plugins available.
    - Outbound network access from the worker to the pages you monitor.
    - A Slack incoming webhook URL if you want alerts (optional; leave it empty to skip).

    ## Quick start

    1. Create the flow from this blueprint.
    2. Set `pages` to the URLs you want to watch.
    3. Optionally paste a Slack webhook URL.
    4. The daily 09:00 schedule runs automatically. The first run establishes the baseline; from the second run on, alerts fire only on genuine content changes.

    ## How to extend

    - Diff the changed sections instead of just reporting the page, by storing a text snapshot alongside the hash.
    - Exclude volatile page regions (timestamps, ads, counters) before hashing to cut noise.
    - Add a second alert channel (email, PagerDuty, Discord) alongside Slack.

    ## Links

    - [HTTP plugin docs](https://kestra.io/plugins/core/http)
    - [Slack notifications plugin docs](https://kestra.io/plugins/plugin-notifications)
    - [KV Store docs](https://kestra.io/docs/concepts/kv-store)
  tags:
    - Monitoring
  subTags:
    - Content & Change Detection
  ee: false
  demo: false
  metaDescription: Monitor pages for content changes with Kestra. SHA-256 hashes compared via KV Store, Slack alerts only on genuine changes, daily schedule.
