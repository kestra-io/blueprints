id: lancedb-vector-table-compaction-verify-and-version-prune
namespace: company.ai

description: |
  Audit LanceDB vector tables for fragmented data files, accumulated historical manifest versions, and ANN search latency.
  Conditionally compact micro-fragments, verify table integrity and vector query performance, request human approval
  via a Pause gate before pruning expired table manifests, persist telemetry in Kestra KV, and notify Slack.

inputs:
  - id: database_uri
    type: STRING
    defaults: "/tmp/lancedb_store"
    displayName: Database Storage URI
    description: Local directory path or cloud object storage URI (e.g. s3://my-bucket/lancedb, gs://my-bucket/lancedb) where the LanceDB database is hosted.

  - id: table_name
    type: STRING
    defaults: "knowledge_embeddings"
    displayName: Table Name
    description: Target LanceDB vector table name to audit, compact, verify, and maintain.

  - id: max_fragments_threshold
    type: INT
    defaults: 20
    displayName: Maximum Fragments Threshold
    description: Maximum permissible number of Lance data fragments before compaction is triggered. Repeated vector upserts produce micro-fragments that degrade read performance.

  - id: target_rows_per_fragment
    type: INT
    defaults: 100000
    displayName: Target Rows per Fragment
    description: Target row count per compacted fragment chunk during merge operations. Larger fragments yield superior scan performance and columnar compression.

  - id: max_versions_threshold
    type: INT
    defaults: 15
    displayName: Maximum Manifest Versions Threshold
    description: Maximum historical manifest versions retained before version cleanup is triggered to release unreferenced data files.

  - id: default_retention_days
    type: INT
    defaults: 7
    displayName: Default Retention Period (Days)
    description: Default days to retain historical dataset versions. Manifests and unreferenced data files older than this window will be pruned upon approval.

  - id: auto_compact
    type: BOOLEAN
    defaults: true
    displayName: Auto-Compact Table
    description: Whether to automatically execute fragment compaction and post-compaction integrity verification when health thresholds are breached.

  - id: dry_run
    type: BOOLEAN
    defaults: false
    displayName: Dry Run Mode
    description: If true, inspects dataset fragmentation and version counts without executing file merges, approvals, or version deletions.

tasks:
  - id: detect_table_health
    type: io.kestra.plugin.scripts.python.Script
    description: Connect to LanceDB, quantify data fragments and version manifests, and record baseline vector query latency.
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install --no-cache-dir lancedb pyarrow kestra
    env:
      DB_URI: "{{ inputs.database_uri }}"
      TABLE_NAME: "{{ inputs.table_name }}"
      MAX_FRAGMENTS: "{{ inputs.max_fragments_threshold }}"
      MAX_VERSIONS: "{{ inputs.max_versions_threshold }}"
    outputFiles:
      - lancedb-health-report.json
    script: |
      import json
      import os
      import sys
      import time
      from kestra import Kestra
      import lancedb
      import pyarrow as pa

      db_uri = os.environ.get("DB_URI", "/tmp/lancedb_store")
      table_name = os.environ.get("TABLE_NAME", "knowledge_embeddings")
      max_fragments = int(os.environ.get("MAX_FRAGMENTS", "20"))
      max_versions = int(os.environ.get("MAX_VERSIONS", "15"))

      print(f"Connecting to LanceDB at: '{db_uri}'...")
      db = lancedb.connect(db_uri)

      existing_tables = db.table_names()
      print(f"Discovered tables: {existing_tables}")

      if table_name not in existing_tables:
          print(f"Table '{table_name}' does not exist yet. Initializing seed table with sample vector embeddings...")
          schema = pa.schema([
              pa.field("id", pa.int64()),
              pa.field("text", pa.string()),
              pa.field("vector", pa.list_(pa.float32(), 128))
          ])
          tbl = db.create_table(table_name, schema=schema)
          for i in range(5):
              data = [
                  {
                      "id": i * 10 + j,
                      "text": f"Document chunk {i}-{j}",
                      "vector": [0.01 * (i + j + k) for k in range(128)]
                  }
                  for j in range(10)
              ]
              tbl.add(data)
      else:
          tbl = db.open_table(table_name)

      lance_ds = tbl.to_lance()
      fragments = lance_ds.get_fragments()
      num_fragments = len(fragments)
      num_rows = tbl.count_rows()

      versions = tbl.list_versions()
      num_versions = len(versions)

      # Measure baseline ANN vector similarity query latency
      sample_query_vector = [0.01 * k for k in range(128)]
      start_time = time.perf_counter()
      query_results = tbl.search(sample_query_vector).limit(5).to_arrow()
      baseline_latency_ms = round((time.perf_counter() - start_time) * 1000.0, 3)

      print(f"Table: {table_name}")
      print(f"Total Rows: {num_rows}")
      print(f"Active Fragments: {num_fragments} (Threshold: {max_fragments})")
      print(f"Manifest Versions: {num_versions} (Threshold: {max_versions})")
      print(f"Baseline Query Latency: {baseline_latency_ms} ms (Rows returned: {len(query_results)})")

      fragment_breach = num_fragments > max_fragments
      version_breach = num_versions > max_versions
      needs_compaction = fragment_breach
      needs_pruning = version_breach

      report = {
          "database_uri": db_uri,
          "table_name": table_name,
          "total_rows": num_rows,
          "active_fragments": num_fragments,
          "num_versions": num_versions,
          "max_fragments_threshold": max_fragments,
          "max_versions_threshold": max_versions,
          "baseline_latency_ms": baseline_latency_ms,
          "fragment_breach": fragment_breach,
          "version_breach": version_breach,
          "needs_compaction": needs_compaction,
          "needs_pruning": needs_pruning
      }

      with open("lancedb-health-report.json", "w", encoding="utf-8") as f:
          json.dump(report, f, indent=2)

      Kestra.outputs({
          "table_name": table_name,
          "total_rows": num_rows,
          "active_fragments": num_fragments,
          "num_versions": num_versions,
          "baseline_latency_ms": baseline_latency_ms,
          "needs_compaction": needs_compaction,
          "needs_pruning": needs_pruning,
          "fragment_breach": fragment_breach,
          "version_breach": version_breach
      })

  - id: compaction_and_verification_gate
    type: io.kestra.plugin.core.flow.If
    description: Evaluate whether table fragment thresholds are breached and execute in-place compaction with integrity verification.
    condition: "{{ outputs.detect_table_health.vars.needs_compaction and inputs.auto_compact and not inputs.dry_run }}"
    then:
      - id: compact_fragments
        type: io.kestra.plugin.scripts.python.Script
        description: Merge small fragmented Lance files into columnar chunks according to target row sizes.
        taskRunner:
          type: io.kestra.plugin.scripts.runner.docker.Docker
        containerImage: python:3.11-slim
        beforeCommands:
          - pip install --no-cache-dir lancedb pyarrow kestra
        env:
          DB_URI: "{{ inputs.database_uri }}"
          TABLE_NAME: "{{ inputs.table_name }}"
          TARGET_ROWS_PER_FRAGMENT: "{{ inputs.target_rows_per_fragment }}"
        script: |
          import os
          from kestra import Kestra
          import lancedb

          db_uri = os.environ.get("DB_URI", "/tmp/lancedb_store")
          table_name = os.environ.get("TABLE_NAME", "knowledge_embeddings")
          target_rows = int(os.environ.get("TARGET_ROWS_PER_FRAGMENT", "100000"))

          print(f"Connecting to LanceDB at '{db_uri}' for file compaction...")
          db = lancedb.connect(db_uri)
          tbl = db.open_table(table_name)

          initial_fragments = len(tbl.to_lance().get_fragments())
          print(f"Starting compaction on '{table_name}' with {initial_fragments} fragments (target_rows={target_rows})...")

          tbl.compact_files(target_rows_per_fragment=target_rows)
          print("Compaction execution completed successfully.")

          Kestra.outputs({
              "compaction_executed": True,
              "initial_fragments": initial_fragments
          })

      - id: verify_compaction_integrity
        type: io.kestra.plugin.scripts.python.Script
        description: Verify post-compaction table integrity, assert zero row loss, and benchmark new vector search latency.
        taskRunner:
          type: io.kestra.plugin.scripts.runner.docker.Docker
        containerImage: python:3.11-slim
        beforeCommands:
          - pip install --no-cache-dir lancedb pyarrow kestra
        env:
          DB_URI: "{{ inputs.database_uri }}"
          TABLE_NAME: "{{ inputs.table_name }}"
          BASELINE_ROWS: "{{ outputs.detect_table_health.vars.total_rows }}"
          INITIAL_FRAGMENTS: "{{ outputs.detect_table_health.vars.active_fragments }}"
          BASELINE_LATENCY_MS: "{{ outputs.detect_table_health.vars.baseline_latency_ms }}"
        outputFiles:
          - lancedb-verification-report.json
        script: |
          import json
          import os
          import time
          from kestra import Kestra
          import lancedb

          db_uri = os.environ.get("DB_URI", "/tmp/lancedb_store")
          table_name = os.environ.get("TABLE_NAME", "knowledge_embeddings")
          baseline_rows = int(os.environ.get("BASELINE_ROWS", "0"))
          initial_fragments = int(os.environ.get("INITIAL_FRAGMENTS", "1"))
          baseline_latency = float(os.environ.get("BASELINE_LATENCY_MS", "0.0"))

          print(f"Verifying table integrity post-compaction for '{table_name}'...")
          db = lancedb.connect(db_uri)
          tbl = db.open_table(table_name)

          # Verify row counts match baseline exactly
          post_rows = tbl.count_rows()
          print(f"Row Count Verification: Baseline={baseline_rows}, Post-Compaction={post_rows}")
          if post_rows != baseline_rows:
              raise ValueError(f"Integrity check failed! Row mismatch: baseline {baseline_rows} vs post {post_rows}")

          # Audit post-compaction fragment count
          post_fragments = len(tbl.to_lance().get_fragments())
          fragments_reclaimed = max(initial_fragments - post_fragments, 0)
          reduction_pct = round((fragments_reclaimed / max(initial_fragments, 1)) * 100, 2)
          print(f"Fragment Reduction: {initial_fragments} -> {post_fragments} ({reduction_pct}% reclaimed)")

          # Benchmark vector similarity search latency post-compaction
          sample_query_vector = [0.01 * k for k in range(128)]
          start_time = time.perf_counter()
          results = tbl.search(sample_query_vector).limit(5).to_arrow()
          post_latency_ms = round((time.perf_counter() - start_time) * 1000.0, 3)

          latency_delta_ms = round(baseline_latency - post_latency_ms, 3)
          print(f"Query Latency: Baseline={baseline_latency} ms, Post={post_latency_ms} ms (Delta: {latency_delta_ms} ms)")

          verification = {
              "table_name": table_name,
              "baseline_rows": baseline_rows,
              "post_rows": post_rows,
              "initial_fragments": initial_fragments,
              "post_fragments": post_fragments,
              "fragments_reclaimed": fragments_reclaimed,
              "reduction_pct": reduction_pct,
              "baseline_latency_ms": baseline_latency,
              "post_latency_ms": post_latency_ms,
              "latency_delta_ms": latency_delta_ms,
              "integrity_verified": True
          }

          with open("lancedb-verification-report.json", "w", encoding="utf-8") as f:
              json.dump(verification, f, indent=2)

          Kestra.outputs({
              "post_fragments": post_fragments,
              "fragments_reclaimed": fragments_reclaimed,
              "reduction_pct": reduction_pct,
              "post_latency_ms": post_latency_ms,
              "integrity_verified": True
          })

  - id: version_pruning_approval_gate
    type: io.kestra.plugin.core.flow.If
    description: Evaluate whether historical version depth exceeds retention thresholds and gate deletion behind human approval.
    condition: "{{ outputs.detect_table_health.vars.needs_pruning and not inputs.dry_run }}"
    then:
      - id: approve_manifest_pruning
        type: io.kestra.plugin.core.flow.Pause
        description: Review table compaction metrics and historical manifest count before irreversibly pruning expired versions.
        timeout: PT24H
        onResume:
          - id: approved
            type: BOOL
            displayName: Approve Version Cleanup
            description: Set to true to authorize permanent removal of historical version manifests and orphaned data chunks.
          - id: retention_days
            type: INT
            displayName: Override Retention Window (Days)
            description: Optional retention period in days to override the default flow retention period.

      - id: evaluate_pruning_approval
        type: io.kestra.plugin.core.flow.If
        description: Execute pruning if approval was granted on resume; otherwise log refusal and preserve manifests.
        condition: "{{ outputs.approve_manifest_pruning.onResume.approved ?? false }}"
        then:
          - id: prune_expired_versions
            type: io.kestra.plugin.scripts.python.Script
            description: Purge historical dataset versions older than the retention window and garbage-collect unreferenced files.
            taskRunner:
              type: io.kestra.plugin.scripts.runner.docker.Docker
            containerImage: python:3.11-slim
            beforeCommands:
              - pip install --no-cache-dir lancedb pyarrow kestra
            env:
              DB_URI: "{{ inputs.database_uri }}"
              TABLE_NAME: "{{ inputs.table_name }}"
              RETENTION_DAYS: "{{ outputs.approve_manifest_pruning.onResume.retention_days ?? inputs.default_retention_days }}"
            outputFiles:
              - lancedb-prune-summary.json
            script: |
              from datetime import timedelta
              import json
              import os
              from kestra import Kestra
              import lancedb

              db_uri = os.environ.get("DB_URI", "/tmp/lancedb_store")
              table_name = os.environ.get("TABLE_NAME", "knowledge_embeddings")
              retention_days = int(os.environ.get("RETENTION_DAYS", "7"))

              print(f"Connecting to LanceDB at '{db_uri}' for version pruning...")
              db = lancedb.connect(db_uri)
              tbl = db.open_table(table_name)

              initial_versions = len(tbl.list_versions())
              older_than_delta = timedelta(days=retention_days)
              print(f"Purging manifests older than {retention_days} days (Current versions: {initial_versions})...")

              tbl.cleanup_old_versions(older_than=older_than_delta, delete_unverified=True)

              post_versions = len(tbl.list_versions())
              versions_purged = max(initial_versions - post_versions, 0)
              print(f"Pruning completed. Versions: {initial_versions} -> {post_versions} ({versions_purged} purged)")

              summary = {
                  "table_name": table_name,
                  "initial_versions": initial_versions,
                  "post_versions": post_versions,
                  "versions_purged": versions_purged,
                  "retention_days": retention_days,
                  "prune_status": "COMPLETED"
              }

              with open("lancedb-prune-summary.json", "w", encoding="utf-8") as f:
                  json.dump(summary, f, indent=2)

              Kestra.outputs({
                  "initial_versions": initial_versions,
                  "post_versions": post_versions,
                  "versions_purged": versions_purged,
                  "prune_status": "COMPLETED"
              })

          - id: log_prune_success
            type: io.kestra.plugin.core.log.Log
            message: "Successfully pruned {{ outputs.prune_expired_versions.vars.versions_purged }} expired LanceDB manifest versions. Remaining active versions: {{ outputs.prune_expired_versions.vars.post_versions }}."
        else:
          - id: log_prune_declined
            type: io.kestra.plugin.core.log.Log
            message: "Version pruning declined or timed out. Historical manifests and data parts were preserved without modification."

  - id: record_kv_telemetry
    type: io.kestra.plugin.core.kv.Set
    description: Persist post-compaction telemetry, fragment reduction, and verification metrics in the Kestra KV store.
    key: "lancedb_compaction_{{ inputs.table_name }}"
    value: |
      {
        "table_name": "{{ inputs.table_name }}",
        "initial_fragments": {{ outputs.detect_table_health.vars.active_fragments }},
        "post_fragments": {{ outputs.verify_compaction_integrity.vars.post_fragments ?? outputs.detect_table_health.vars.active_fragments }},
        "fragments_reclaimed": {{ outputs.verify_compaction_integrity.vars.fragments_reclaimed ?? 0 }},
        "reduction_pct": {{ outputs.verify_compaction_integrity.vars.reduction_pct ?? 0.0 }},
        "baseline_latency_ms": {{ outputs.detect_table_health.vars.baseline_latency_ms }},
        "post_latency_ms": {{ outputs.verify_compaction_integrity.vars.post_latency_ms ?? outputs.detect_table_health.vars.baseline_latency_ms }},
        "initial_versions": {{ outputs.detect_table_health.vars.num_versions }},
        "post_versions": {{ outputs.prune_expired_versions.vars.post_versions ?? outputs.detect_table_health.vars.num_versions }},
        "pruning_approved": {{ outputs.approve_manifest_pruning.onResume.approved ?? false }},
        "dry_run": {{ inputs.dry_run }},
        "execution_id": "{{ execution.id }}"
      }

  - id: send_slack_summary
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Dispatch structured compaction and health summary to engineering on-call channels.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "#ai-ops-alerts",
        "username": "LanceDB Table Sentinel",
        "icon_emoji": ":books:",
        "attachments": [
          {
            "color": "{{ (outputs.detect_table_health.vars.needs_compaction or outputs.detect_table_health.vars.needs_pruning) ? '#FF9900' : '#36A64F' }}",
            "title": "LanceDB Table Maintenance Report: `{{ inputs.table_name }}`",
            "text": "Automated table health sentinel finished execution `{{ execution.id }}` in namespace `{{ flow.namespace }}`.\n\n*Health & Compaction Metrics:*\n• *Rows:* {{ outputs.detect_table_health.vars.total_rows }}\n• *Fragments:* {{ outputs.detect_table_health.vars.active_fragments }} initial -> {{ outputs.verify_compaction_integrity.vars.post_fragments ?? outputs.detect_table_health.vars.active_fragments }} post ({{ outputs.verify_compaction_integrity.vars.fragments_reclaimed ?? 0 }} merged, {{ outputs.verify_compaction_integrity.vars.reduction_pct ?? 0.0 }}% reduction)\n• *ANN Query Latency:* {{ outputs.detect_table_health.vars.baseline_latency_ms }} ms baseline -> {{ outputs.verify_compaction_integrity.vars.post_latency_ms ?? outputs.detect_table_health.vars.baseline_latency_ms }} ms post\n• *Manifest Versions:* {{ outputs.detect_table_health.vars.num_versions }} initial -> {{ outputs.prune_expired_versions.vars.post_versions ?? outputs.detect_table_health.vars.num_versions }} remaining (Approved: {{ outputs.approve_manifest_pruning.onResume.approved ?? false }})\n• *Dry Run:* `{{ inputs.dry_run }}`",
            "footer": "Kestra Vector DB Sentinel | LanceDB Apache Lance Engine"
          }
        ]
      }

triggers:
  - id: weekly_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 3 * * 0"
    disabled: true

  - id: webhook_trigger
    type: io.kestra.plugin.core.trigger.Webhook
    key: "lancedb-sentinel-key"

extend:
  title: LanceDB Vector Table Compaction, Verification, and Version Pruning Sentinel
  metaTitle: LanceDB Vector Table Compaction and Version Prune Sentinel | Kestra
  shortDescription: Audit LanceDB vector tables, compact fragments, verify query latency, and prune old versions.
  metaDescription: Audit LanceDB vector tables, compact data fragments, verify ANN latency, and request human approval to prune expired manifests in Kestra.
  description: |
    Audit LanceDB vector tables for fragmented data files, accumulated historical manifest versions, and ANN search latency.
    Conditionally compact micro-fragments, verify table integrity and vector query performance, request human approval
    via a Pause gate before pruning expired table manifests, persist telemetry in Kestra KV, and notify Slack.

    In production RAG (Retrieval-Augmented Generation) architectures, autonomous AI agents, and multimodal retrieval systems, LanceDB leverages the Apache Lance columnar format to deliver lightning-fast vector similarity search directly on local NVMe or cloud object storage (AWS S3, Google Cloud Storage, Azure Blob Storage). As documents and embeddings are incrementally upserted or deleted:
    - Frequent batch writes produce small fragmented data chunks (`.lance` fragment files). Multi-fragment scanning severely degrades vector search latency and inflates storage I/O operations.
    - Historical version manifests accumulate over time, locking disk and bucket storage with orphaned data parts.

    This blueprint establishes an end-to-end multi-stage maintenance and compaction sentinel that:
    - **Detects Dataset Health**: Inspects the target LanceDB table using PyArrow and Lance storage metadata (`table.to_lance().get_fragments()`, `table.list_versions()`, `table.count_rows()`) inside an isolated container (`io.kestra.plugin.scripts.python.Script`), recording active fragments, row counts, version manifest depths, and baseline ANN query latency.
    - **Executes In-Place Compaction**: Runs `table.compact_files(target_rows_per_fragment=...)` to merge micro-fragments into optimized columnar chunks without interrupting live vector query reads.
    - **Verifies Compaction Integrity**: Asserts zero row loss post-compaction (`count_rows() == baseline_rows`), quantifies fragment reduction percentages, and benchmarks new ANN search latency to ensure search performance is restored.
    - **Gates Manifest Pruning with Human Approval**: Employs a human-in-the-loop approval step (`io.kestra.plugin.core.flow.Pause`) before invoking `table.cleanup_old_versions(older_than=...)`, allowing data engineers to review compaction metrics and override retention windows before unreferenced manifests are permanently deleted.
    - **Persists KV Telemetry & Validates Results**: Writes complete JSON telemetry to Kestra KV under `lancedb_compaction_<table_name>` (`io.kestra.plugin.core.kv.Set`) and sends structured summaries to Slack channels via incoming webhook (`io.kestra.plugin.slack.notifications.SlackIncomingWebhook`).

    ## How it works

    1. **Detect Table Health**: Connects to the database URI, checks if the table exists, and extracts current physical fragments and version manifests. Executes a sample vector similarity query to record baseline ANN latency in milliseconds.
    2. **Compaction Gate**: Evaluates whether active fragment counts exceed `max_fragments_threshold`. If compaction is needed and permitted, launches `compact_fragments` to merge small Lance files into larger columnar segments.
    3. **Integrity Verification**: Immediately following compaction, `verify_compaction_integrity` verifies that row counts match pre-compaction counts exactly, calculates fragment reduction percentages, and verifies query execution speed.
    4. **Approval Gate for Manifest Pruning**: If historical versions exceed `max_versions_threshold`, the flow enters `approve_manifest_pruning` using `io.kestra.plugin.core.flow.Pause`. An on-call engineer reviews the execution and resumes the flow with `approved: true` or `false`.
    5. **Execute Approved Pruning**: If approved, `prune_expired_versions` calls `table.cleanup_old_versions` with the configured retention window and purges orphaned data files. If declined or timed out, manifests remain untouched.
    6. **KV Telemetry & Slack Alerts**: Execution metrics are persisted into Kestra KV and a status payload is delivered to `#ai-ops-alerts` via Slack webhook.

    ## What you get

    - In-place columnar compaction merging fragmented Lance files into optimized row groups.
    - Post-compaction data integrity verification ensuring 0 lost records and validated vector query execution.
    - Human approval gate (`Pause`) preventing accidental premature deletion of historical versions.
    - Automated latency benchmarking tracking pre- vs post-compaction ANN query response times.
    - Durable audit trail in Kestra KV store and Slack notifications.

    ## Who it's for

    - Machine Learning Engineers operating LanceDB or Lance vector databases in production.
    - Data Platform Engineers managing RAG pipelines and vector search indexing.
    - Platform and DevOps teams maintaining high-throughput ingestion pipelines.

    ## Why orchestrate this with Kestra

    - **Human-in-the-Loop Governance**: LanceDB performs file-level operations, but lacks built-in orchestration to pause for engineer approval before permanent version deletions. Kestra's `Pause` task provides this governance out of the box.
    - **Multi-Stage Verification**: Decouples detection, compaction, and verification into discrete observable tasks with automated fail-safes.
    - **Containerized Isolation**: Python scripts run inside isolated Docker containers with pinned dependencies, avoiding host environment conflicts.
    - **Unified Audit Trail**: Stores execution state in Kestra KV for compliance and delivers instant visibility to Slack.

    ## Prerequisites

    - LanceDB database directory accessible via local filesystem mount or cloud bucket (AWS S3, Google Cloud Storage, Azure Blob Storage).
    - Docker container runner enabled in your Kestra worker environment.
    - Incoming Webhook URL configured in Slack for notifications.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Incoming Webhook URL for Slack alerts (e.g., `https://hooks.slack.com/services/T00/B00/XXXX`).

    ## Quick start

    1. Configure the `SLACK_WEBHOOK_URL` secret in your Kestra namespace settings.
    2. Specify your `database_uri` (e.g. `/data/lancedb_store` or `s3://ai-models/lancedb`) and `table_name`.
    3. Run the flow with `dry_run: true` to inspect current table fragmentation and version counts.
    4. Execute with `dry_run: false` to compact fragments, verify integrity, and review the version pruning approval gate.

    ## How to extend

    - **Cloud Object Storage**: Add AWS (`AWS_ACCESS_KEY_ID`, `AWS_SECRET_ACCESS_KEY`) or GCP credentials to the script tasks to operate directly on S3 or GCS buckets.
    - **Index Rebuilding**: Add a task to rebuild IVF-PQ vector indexes (`table.create_index()`) following large batch compactions.
    - **Multi-Table Sentinel**: Wrap the inspection and compaction logic in an `io.kestra.plugin.core.flow.ForEach` loop to maintain all tables in a database namespace.

    ## Links

    - [LanceDB Python Documentation](https://lancedb.github.io/lancedb/)
    - [Apache Lance Columnar Format](https://lance.dev/)
    - [Kestra Python Script Plugin](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Pause Task](https://kestra.io/plugins/core/flow/io.kestra.plugin.core.flow.pause)
    - [Kestra KV Store](https://kestra.io/docs/concepts/kv-store)
  tags:
    - AI
    - Data
  subTags:
    - Vector Stores & RAG
    - Day 2 Operations
  ee: false
  demo: false
