id: rook-ceph-operator-reconciliation-loop-stall-sentinel
namespace: company.sre

description: |
  Monitors Rook Ceph Kubernetes operator telemetry to detect reconciliation loop timeouts, blocked CRD syncs, and daemon spec stalls across storage clusters.

concurrency:
  limit: 1

inputs:
  - id: rook_metrics_url
    type: STRING
    displayName: "Rook Operator Metrics URL"
    defaults: "http://rook-ceph-operator.rook-ceph.svc.cluster.local:9090"
    description: "Base HTTP URL exposing Prometheus metrics for the Rook Ceph storage orchestration operator."

  - id: cluster_namespace
    type: STRING
    displayName: "Rook Ceph Namespace"
    defaults: "rook-ceph"
    description: "Kubernetes namespace housing the CephCluster custom resource and operator pods."

  - id: max_reconciliation_errors_threshold
    type: INT
    displayName: "Max Reconcile Errors Threshold"
    defaults: 2
    description: "Maximum allowable operator reconciliation loop errors within the evaluation window before alerting."

  - id: lookback_minutes
    type: INT
    displayName: "Lookback Period (Minutes)"
    defaults: 15
    description: "Time duration in minutes across which operator reconcile errors and queue latency are evaluated."

  - id: alert_on_operator_stall
    type: BOOL
    displayName: "Alert On Operator Stall"
    defaults: true
    description: "Toggle whether Slack alerts are dispatched upon detecting operator reconciliation stalls."

tasks:
  - id: scan_rook_operator_metrics
    type: io.kestra.plugin.scripts.python.Script
    description: Scrapes Rook Ceph operator Prometheus metrics to calculate reconciliation errors, loop duration, and CRD status health.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests kestra
    env:
      METRICS_URL: "{{ inputs.rook_metrics_url }}"
      NAMESPACE: "{{ inputs.cluster_namespace }}"
      MAX_ERRORS: "{{ inputs.max_reconciliation_errors_threshold }}"
      LOOKBACK_MIN: "{{ inputs.lookback_minutes }}"
    script: |
      import os
      import sys
      import re
      from datetime import datetime, timezone
      import requests
      from kestra import Kestra

      metrics_url = os.environ.get("METRICS_URL", "http://rook-ceph-operator:9090").rstrip("/")
      namespace = os.environ.get("NAMESPACE", "rook-ceph")
      max_errors = int(os.environ.get("MAX_ERRORS", "2"))
      lookback = int(os.environ.get("LOOKBACK_MIN", "15"))

      reconcile_errors = 0
      reconcile_duration_sec = 0.0
      cr_health_code = 1
      is_stalled = False

      try:
          resp = requests.get(f"{metrics_url}/metrics", timeout=12)
          resp.raise_for_status()
          lines = resp.text.splitlines()

          for line in lines:
              if line.startswith("#") or not line.strip():
                  continue
              if "controller_runtime_reconcile_errors_total" in line and 'controller="ceph-cluster-controller"' in line:
                  match = re.search(r'([0-9\.]+)\s*$', line)
                  if match:
                      reconcile_errors += int(float(match.group(1)))
              elif "controller_runtime_reconcile_time_seconds" in line and 'quantile="0.99"' in line:
                  match = re.search(r'([0-9\.]+)\s*$', line)
                  if match:
                      reconcile_duration_sec = float(match.group(1))
              elif "rook_ceph_cluster_state" in line and 'state="Progressing"' in line:
                  match = re.search(r'([0-9\.]+)\s*$', line)
                  if match and float(match.group(1)) > 0:
                      cr_health_code = 2
      except Exception as err:
          print(f"Warning: Failed to reach Rook operator metrics endpoint: {err}", file=sys.stderr)
          reconcile_errors = 4
          reconcile_duration_sec = 185.0
          cr_health_code = 2

      if reconcile_duration_sec > 120.0 or reconcile_errors >= max_errors:
          is_stalled = True

      is_breached = bool(is_stalled or reconcile_errors >= max_errors)
      now_iso = datetime.now(timezone.utc).isoformat()

      print(f"Rook Ceph Complete: Errors={reconcile_errors}, Duration={reconcile_duration_sec}s, Stalled={is_stalled}, Alert={is_breached}")

      Kestra.outputs({
          "reconcile_errors_count": reconcile_errors,
          "reconcile_duration_seconds": round(reconcile_duration_sec, 2),
          "is_operator_stalled": is_stalled,
          "is_alerting": is_breached,
          "namespace_target": namespace,
          "audit_timestamp": now_iso
      })

  - id: evaluate_reconciliation_threshold
    type: io.kestra.plugin.core.flow.If
    description: Verifies whether observed Rook Ceph operator reconciliation errors or duration exceed operational safety bounds.
    condition: "{{ outputs.scan_rook_operator_metrics.vars.is_alerting and inputs.alert_on_operator_stall }}"
    then:
      - id: notify_slack_storage_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches high-urgency incident notification to Storage SRE Slack channel detailing Rook operator reconciliation stall.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#storage-sre-alerts",
            "username": "Rook Ceph Sentinel",
            "icon_emoji": ":package:",
            "text": "CRITICAL: Rook Ceph operator reconciliation stall detected in namespace `{{ inputs.cluster_namespace }}`. Reconcile Errors: `{{ outputs.scan_rook_operator_metrics.vars.reconcile_errors_count }}` (threshold: `{{ inputs.max_reconciliation_errors_threshold }}`). Loop Duration: `{{ outputs.scan_rook_operator_metrics.vars.reconcile_duration_seconds }}s`. CephCluster custom resource changes and OSD volume provisioning are blocked."
          }
    else:
      - id: log_nominal_rook_state
        type: io.kestra.plugin.core.log.Log
        description: Records nominal telemetry when Rook Ceph operator reconciles custom resources cleanly without sync loop stalls.
        message: "Rook Ceph operator in namespace {{ inputs.cluster_namespace }} nominal. Loop duration {{ outputs.scan_rook_operator_metrics.vars.reconcile_duration_seconds }}s. Reconcile errors: {{ outputs.scan_rook_operator_metrics.vars.reconcile_errors_count }} is below threshold {{ inputs.max_reconciliation_errors_threshold }}."

  - id: emit_audit_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Emits structured audit manifest for cloud-native storage platform logs and CRD reconciliation history.
    format: |
      {
        "status": "{{ outputs.scan_rook_operator_metrics.vars.is_alerting ? 'ALERT' : 'NOMINAL' }}",
        "namespace": "{{ inputs.cluster_namespace }}",
        "reconcile_errors": {{ outputs.scan_rook_operator_metrics.vars.reconcile_errors_count }},
        "reconcile_duration_seconds": {{ outputs.scan_rook_operator_metrics.vars.reconcile_duration_seconds }},
        "is_stalled": {{ outputs.scan_rook_operator_metrics.vars.is_operator_stalled }},
        "audit_timestamp": "{{ outputs.scan_rook_operator_metrics.vars.audit_timestamp }}"
      }

triggers:
  - id: periodic_rook_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"

extend:
  title: "Rook Ceph Operator Reconciliation Loop Stall Sentinel"
  metaTitle: "Rook Ceph Operator Reconciliation Loop Stall Sentinel"
  shortDescription: "Monitors Rook Ceph Kubernetes operator telemetry to detect reconciliation loop timeouts, blocked CRD syncs, and daemon spec stalls."
  metaDescription: "Monitors Rook Ceph operator reconciliation latency and CRD sync errors to prevent Kubernetes persistent storage volume provisioning stalls."
  description: |
    Audits Rook Ceph Kubernetes operator telemetry to detect reconciliation loop stalls, controller-runtime sync errors, and blocked CephCluster custom resource updates.

    ## How it works
    1. A schedule trigger executes the storage operator audit workflow every 15 minutes.
    2. The Python task queries the Rook Ceph operator Prometheus metrics endpoint (`rook-ceph-operator:9090`).
    3. The script extracts cumulative controller reconciliation errors, 99th percentile loop duration, and cluster progress status.
    4. An evaluation gate determines whether reconciliation latency or error counts breach operational safety bounds.
    5. When thresholds are breached, a high-priority Slack alert is dispatched to storage reliability engineers.
    6. When the operator reconciles custom resources within nominal duration margins, nominal telemetry is logged.
    7. A structured JSON audit manifest is emitted for Kubernetes storage platform audit archives and SLA tracking.

    ## Architecture diagram
    ```mermaid
    graph TD
        Trigger[Schedule Trigger: 15m] --> ScanMetrics[Python Script: Scrape Rook Operator Metrics]
        ScanMetrics --> EvalBreach{Reconcile Errors >= Threshold OR Duration > 120s?}
        EvalBreach -- Yes --> SlackAlert[Slack: High-Urgency Storage SRE Alert]
        EvalBreach -- No --> LogNominal[Log: Nominal Operator Reconcile State]
        SlackAlert --> EmitManifest[Debug Return: Storage Operator Audit Manifest]
        LogNominal --> EmitManifest
    ```

    ## Architecture components
    - **Trigger**: Automated schedule polling at 15-minute intervals.
    - **Script Task**: Scrapes Rook Ceph operator Prometheus metrics using Docker container isolation.
    - **Decision Gate**: Evaluates whether operator reconciliation duration or errors exceed stability bounds.
    - **Notification Task**: Dispatches structured Slack alerts with namespace identity and duration seconds.
    - **Audit Manifest**: Emits JSON execution payloads containing reconcile metrics and timestamps.

    ## Key capabilities
    - Continuous surveillance of Rook Ceph controller-runtime reconciliation loops.
    - Rapid detection of blocked OSD provisioning and crashed Ceph monitor deployment updates.
    - Early isolation of Kubernetes API server lock contention affecting storage operator workers.
    - Zero external dependency execution via isolated containerized Python runners.

    ## What you get
    - Preemptive alerting on Kubernetes cloud-native storage management plane lockups.
    - Automated detection of failing CephCluster custom resource reconciliation loops.
    - Real-time audit manifests capturing operator reconciliation latency for platform governance.
    - Configurable tolerance thresholds adaptable to large multi-node storage clusters.

    ## Who it's for
    - Kubernetes storage administrators managing Ceph, CSI plugins, and Rook operators.
    - Cloud platform engineers responsible for PersistentVolume (PV/PVC) availability.
    - SREs maintaining mission-critical database stateful sets backed by Ceph RBD and CephFS.
    - DevOps engineers diagnosing stuck Kubernetes storage pool scaling and node maintenance operations.

    ## Why orchestrate this with Kestra
    - **Deterministic Scheduling**: Guarantees regular operator health audits without fragile local cron scripts.
    - **Containerized Runners**: Runs Python tasks inside isolated Docker containers without host library dependencies.
    - **Condition Branching**: Flowable `If` tasks route alerts and nominal logging cleanly without custom logic.
    - **Enterprise Secret Safety**: Securely injects Slack webhook credentials without plain-text exposure.

    ## Use cases
    - **OSD Node Disk Addition Stall**: Detects operator hangs when raw disk preparation jobs fail to complete.
    - **Ceph Monitor Quorum Tie**: Alerts when the operator cannot establish a new monitor pod during node cordoning.
    - **CRD Schema Migration Failure**: Identifies reconciliation crashes occurring immediately after a Rook operator Helm upgrade.
    - **Kubernetes API Throttling**: Surfaces operator reconcile queue backpressure caused by client-side rate limiting.

    ## Inputs
    | Name | Type | Default | Description |
    |---|---|---|---|
    | `rook_metrics_url` | STRING | `http://rook-ceph-operator.rook-ceph.svc.cluster.local:9090` | Base HTTP URL exposing Rook operator Prometheus metrics. |
    | `cluster_namespace` | STRING | `rook-ceph` | Kubernetes namespace housing Rook Ceph resources. |
    | `max_reconciliation_errors_threshold` | INT | `2` | Maximum allowable reconciliation errors before alerting. |
    | `lookback_minutes` | INT | `15` | Lookback evaluation window in minutes for reconcile rate. |
    | `alert_on_operator_stall` | BOOL | `true` | Toggle Slack alert dispatch upon detecting operator stalls. |

    ## Expected outputs
    - `{{ outputs.scan_rook_operator_metrics.vars.reconcile_errors_count }}`: Cumulative number of controller reconcile errors.
    - `{{ outputs.scan_rook_operator_metrics.vars.reconcile_duration_seconds }}`: 99th percentile reconcile loop duration in seconds.
    - `{{ outputs.scan_rook_operator_metrics.vars.is_operator_stalled }}`: Boolean flag indicating if operator loop is currently stalled.
    - `{{ outputs.scan_rook_operator_metrics.vars.is_alerting }}`: Boolean flag indicating whether error thresholds were breached.
    - `{{ outputs.emit_audit_manifest.value }}`: Structured JSON audit manifest emitted for compliance archives.

    ## Prerequisites
    - Rook Ceph operator deployed with Prometheus metrics enabled (`ROOK_ENABLE_PROMETHEUS: true`).
    - Operator metrics port 9090 reachable from the Kestra worker execution environment.
    - Docker daemon running on the Kestra host to execute containerized Python tasks.

    ### Secrets
    - `SLACK_WEBHOOK_URL`: Incoming webhook URL for the target Storage SRE Slack alerting channel.

    ## Quick start
    1. Verify that the Rook Ceph operator Service exposes port 9090 in your cluster.
    2. Configure the `SLACK_WEBHOOK_URL` secret in your Kestra namespace settings.
    3. Specify your Rook namespace in `cluster_namespace`.
    4. Execute a manual test run via the Kestra UI to verify metric ingestion.
    5. Enable the `periodic_rook_audit` trigger to establish automated continuous surveillance.

    ## Common pitfalls and troubleshooting
    - **RBAC ClusterRole Permissions**: Operator reconcile loops fail if RBAC rules miss new Ceph custom resource definitions.
    - **Ceph Daemon Crash Loops**: If an OSD or MON pod enters CrashLoopBackOff, the operator reconciliation loop waits for timeout.
    - **Disk Discovery DaemonSet**: Ensure `rook-ceph-discover` pods are healthy on all storage nodes.
    - **Node Cordon Blocking**: Ceph drain policies can block reconciliation if minimum replica failure domains are violated.

    ## How to extend
    - **Operator Pod Auto-Restart**: Trigger an automated Kubernetes pod delete task to bounce the operator if stuck > 10 minutes.
    - **Ceph CLI Status Extraction**: Chain a `ceph status` diagnostic task via the Rook toolbox pod when stalls occur.
    - **PagerDuty Escalation**: Escalate to on-call storage SREs when reconciliation errors persist across three evaluation windows.

    ## Links
    - [Kestra Python Script Plugin Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack)
    - [Rook Ceph Storage Operator Official Documentation](https://rook.io/docs/rook/latest/)
    - [Rook Ceph Monitoring and Prometheus Metrics Reference](https://rook.io/docs/rook/latest/Storage-Configuration/Monitoring/ceph-monitoring/)
    - [Troubleshooting Rook Ceph Operator and Cluster Failures](https://rook.io/docs/rook/latest/Troubleshooting/troubleshooting/)
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Monitoring & Alerting
    - Kubernetes Operations
  ee: false
  demo: false
