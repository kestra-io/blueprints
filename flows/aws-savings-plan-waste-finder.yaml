id: aws-savings-plan-waste-finder
namespace: company.team
description: |
  Find AWS Savings Plans that are paid for but barely used, so finance can
  reassign or exchange coverage before the commitment renews. A disabled
  weekly schedule and a keyed on-demand webhook both start the same run: the
  Cost Explorer coverage query executes inside the official AWS CLI
  container with a bundled two-plan fixture behind it, Python turns
  utilization and monthly commitment into a wasted dollar figure per plan,
  and anything above the floor opens a GitHub issue, alerts Slack, and
  records a recommended move for every underutilized plan. The verdict, the waste total,
  the offending plans, and the report URI are published as outputs, and any
  failure escalates to Slack.

triggers:
  - id: weekly_waste_scan
    type: io.kestra.plugin.core.trigger.Schedule
    description: Weekly coverage review every Monday at 06:00 UTC, shipped disabled so nothing reaches finance until an operator switches it on.
    cron: "0 6 * * 1"
    disabled: true
  - id: on_demand_audit
    type: io.kestra.plugin.core.trigger.Webhook
    description: POST here to run a waste audit on demand, for example after a commitment purchase or before a renewal decision.
    key: "{{ secret('SAVINGSPLAN_WEBHOOK_KEY') }}"

inputs:
  - id: utilization_threshold
    type: FLOAT
    defaults: 80.0
    description: Savings plan utilization below this percentage counts as underutilized, so 80.0 flags every plan burning less than 80 percent of its committed spend.
  - id: min_waste_usd
    type: FLOAT
    defaults: 100.0
    description: Total monthly wasted commitment above this dollar figure escalates to a GitHub issue and to Slack instead of a quiet all-clear log.

tasks:
  # --- 1. coverage workspace ---
  - id: coverage_workspace
    type: io.kestra.plugin.core.flow.WorkingDirectory
    description: One shared directory so the coverage query, the waste analysis, and the report all read and write the same files.
    tasks:
      # --- 2. coverage query ---
      - id: fetch_coverage
        type: io.kestra.plugin.scripts.shell.Commands
        description: Write a deterministic two-plan fixture with a heredoc, run the Cost Explorer savings plans coverage query in the official AWS CLI container, and fall back to the fixture whenever the API cannot be reached so the audit stays reproducible offline.
        taskRunner:
          type: io.kestra.plugin.scripts.runner.docker.Docker
          entryPoint: []
        containerImage: amazon/aws-cli:latest
        env:
          AWS_ACCESS_KEY_ID: "{{ secret('AWS_ACCESS_KEY_ID') }}"
          AWS_SECRET_ACCESS_KEY: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
          AWS_DEFAULT_REGION: us-east-1
        outputFiles:
          - coverage.json
        commands:
          - |
            set -u
            cat > savings-plans-fixture.json <<'JSON'
            {
              "SavingsPlansCoverages": [
                {"SavingsPlanId": "sp-3f2a1c9b7d5e4a60", "SavingsPlanType": "Compute", "Region": "us-east-1", "UtilizationPercent": 95.0, "MonthlyCommitment": 2400.0},
                {"SavingsPlanId": "sp-8c7d6e5f4a3b2c10", "SavingsPlanType": "EC2Instance", "Region": "us-east-1", "UtilizationPercent": 52.0, "MonthlyCommitment": 4000.0}
              ],
              "Total": {"UtilizationPercent": 70.3, "MonthlyCommitment": 6400.0}
            }
            JSON

            echo "Querying savings plans coverage from the Cost Explorer API"
            aws ce get-savings-plans-coverage --output json > coverage.json || true

            if [ ! -s coverage.json ]; then
              cp savings-plans-fixture.json coverage.json
              echo "coverage API unreachable from this worker, emitting the bundled fixture"
            fi

            echo "coverage bytes $(wc -c < coverage.json)"

      # --- 3. waste analysis ---
      - id: analyze_coverage
        type: io.kestra.plugin.scripts.python.Script
        description: Read the coverage payload, skip plans with no commitment left, compute waste_usd for every plan under the utilization threshold, write the report file, and emit the verdict through the outputs protocol.
        taskRunner:
          type: io.kestra.plugin.scripts.runner.docker.Docker
        containerImage: python:3.12-slim
        env:
          UTILIZATION_THRESHOLD: "{{ inputs.utilization_threshold }}"
          MIN_WASTE_USD: "{{ inputs.min_waste_usd }}"
        outputFiles:
          - report.txt
        script: |
          import json
          import os
          from datetime import datetime, timezone

          def as_float(value, fallback=0.0):
              try:
                  return float(value)
              except (TypeError, ValueError):
                  return fallback

          coverage_path = "coverage.json"
          threshold = as_float(os.environ.get("UTILIZATION_THRESHOLD"), 80.0)
          floor = as_float(os.environ.get("MIN_WASTE_USD"), 100.0)

          document = {}
          if os.path.exists(coverage_path) and os.path.getsize(coverage_path) > 0:
              try:
                  with open(coverage_path, "r") as handle:
                      document = json.load(handle)
              except ValueError:
                  document = {}

          rows = []
          if isinstance(document, dict):
              candidate = document.get("SavingsPlansCoverages")
              if isinstance(candidate, list):
                  rows = candidate
          elif isinstance(document, list):
              rows = document

          low_util_plans = []
          reviewed_plans = 0
          reviewed_commitment = 0.0

          for row in rows:
              if not isinstance(row, dict):
                  continue
              plan_id = str(row.get("SavingsPlanId") or row.get("savingsPlanId") or row.get("id") or "unknown-plan")
              raw_util = row.get("UtilizationPercent", row.get("utilization"))
              raw_commit = row.get("MonthlyCommitment", row.get("commitment"))
              utilization = as_float(raw_util, 0.0)
              commitment = as_float(raw_commit, 0.0)
              if commitment <= 0.0:
                  continue
              reviewed_plans += 1
              reviewed_commitment += commitment
              if utilization < threshold:
                  waste = round(commitment * (1.0 - utilization / 100.0), 2)
                  low_util_plans.append({
                      "id": plan_id,
                      "utilization": round(utilization, 1),
                      "waste_usd": waste,
                  })

          low_util_plans.sort(key=lambda plan: (-plan["waste_usd"], plan["id"]))
          waste_usd = round(float(sum(plan["waste_usd"] for plan in low_util_plans)), 2)
          report_time = datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          verdict = "WASTE_FOUND" if waste_usd > floor else "ALL_CLEAR"

          with open("report.txt", "w") as handle:
              handle.write("AWS Savings Plans waste report\n")
              handle.write("report time " + report_time + "\n")
              handle.write("utilization threshold " + str(threshold) + " percent\n")
              handle.write("escalation floor " + str(floor) + " USD per month\n")
              handle.write("plans reviewed " + str(reviewed_plans) + "\n")
              handle.write("commitment reviewed " + str(round(reviewed_commitment, 2)) + " USD per month\n")
              handle.write("wasted commitment " + str(waste_usd) + " USD per month\n")
              handle.write("verdict " + verdict + "\n\n")
              if low_util_plans:
                  handle.write("Underutilized plans\n")
                  for plan in low_util_plans:
                      handle.write(
                          "- " + plan["id"] + " at " + str(plan["utilization"])
                          + " percent wastes " + str(plan["waste_usd"]) + " USD per month\n"
                      )
              else:
                  handle.write("No savings plan sits below the utilization threshold, nothing to reassign.\n")

              if low_util_plans:
                  handle.write("\nRecommended moves\n")
                  for plan in low_util_plans:
                      if plan["utilization"] < 50.0:
                          move = "exchange the plan or let it lapse at renewal"
                      else:
                          move = "exchange into a smaller commitment at the next window"
                      handle.write("- " + plan["id"] + ": " + move + "\n")

          print("reviewed=%d low_util=%d waste_usd=%.2f verdict=%s" % (
              reviewed_plans, len(low_util_plans), waste_usd, verdict))
          print("::" + json.dumps({"outputs": {
              "verdict": verdict,
              "waste_usd": waste_usd,
              "low_util_plans": low_util_plans,
              "report_time": report_time,
          }}) + "::")

  # --- 4. verdict gate ---
  - id: check_waste
    type: io.kestra.plugin.core.flow.If
    description: Escalate only when the wasted monthly commitment sits above the dollar floor, a healthy book of coverage is recorded as an all-clear.
    condition: "{{ (outputs.analyze_coverage.vars.waste_usd | number) > (inputs.min_waste_usd | number) }}"
    then:
      - id: append_advice
        type: io.kestra.plugin.core.flow.Loop
        description: Walk the underutilized plans one at a time and record a recommended exchange or reassignment move for each plan.
        values: "{{ outputs.analyze_coverage.vars.low_util_plans }}"
        concurrencyLimit: 1
        tasks:
          - id: append_plan_advice
            type: io.kestra.plugin.scripts.python.Script
            description: Build the advice line for the current plan from its utilization and wasted dollars, and emit it through the outputs protocol.
            taskRunner:
              type: io.kestra.plugin.scripts.runner.docker.Docker
            containerImage: python:3.12-slim
            env:
              PLAN_ID: "{{ item.id }}"
              PLAN_UTILIZATION: "{{ item.utilization }}"
              PLAN_WASTE_USD: "{{ item.waste_usd }}"
            script: |
              import json
              import os
              from datetime import datetime, timezone

              plan_id = os.environ.get("PLAN_ID", "unknown-plan")
              utilization = 0.0
              waste = 0.0
              try:
                  utilization = float(os.environ.get("PLAN_UTILIZATION", "0"))
              except (TypeError, ValueError):
                  pass
              try:
                  waste = float(os.environ.get("PLAN_WASTE_USD", "0"))
              except (TypeError, ValueError):
                  pass

              if utilization < 50.0:
                  advice = "commitment is barely used, exchange the plan or let it lapse at renewal"
              else:
                  advice = "coverage is underused, exchange into a smaller commitment at the next window"

              stamp = datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
              line = stamp + " " + plan_id + " at " + ("%.1f" % utilization)
              line += " percent wastes " + ("%.2f" % waste) + " USD per month, " + advice

              print(line)
              print("::" + json.dumps({"outputs": {"appended": plan_id, "advice_line": line, "waste_usd": round(waste, 2)}}) + "::")

      - id: open_exchange_issue
        type: io.kestra.plugin.github.issues.Create
        description: Open a labeled GitHub issue carrying the waste total and the plan list so the exchange work is tracked where finance already works.
        oauthToken: "{{ secret('GITHUB_TOKEN') }}"
        repository: your-org/cloud-commitments
        title: "Savings Plans wasting ${{ outputs.analyze_coverage.vars.waste_usd }} per month"
        body: |
          ## Savings Plan waste audit

          Wasted commitment **${{ outputs.analyze_coverage.vars.waste_usd }}** per month sits above the ${{ inputs.min_waste_usd }} floor, with a utilization threshold of {{ inputs.utilization_threshold }} percent.

          Report time `{{ outputs.analyze_coverage.vars.report_time }}`, execution `{{ execution.id }}`.

          ### Underutilized plans

          ```json
          {{ outputs.analyze_coverage.vars.low_util_plans | toJson }}
          ```

          ### Next steps

          - Exchange the lowest utilized plans into smaller commitments before the renewal window closes.
          - Reassign coverage to the workloads that actually run, then re-run this flow to confirm the waste dropped.
        labels:
          - finops
          - savings-plans
      - id: notify_waste
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Tell the finops channel the wasted commitment, the threshold that tripped, and that a GitHub issue is waiting.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "AWS Savings Plan waste found - ${{ outputs.analyze_coverage.vars.waste_usd }} per month of committed coverage is underutilized, above the ${{ inputs.min_waste_usd }} floor (utilization threshold {{ inputs.utilization_threshold }}%). Issue opened in your-org/cloud-commitments. Execution {{ execution.id }}."
          }
    else:
      - id: log_all_clear
        type: io.kestra.plugin.core.log.Log
        description: Record the all-clear so the execution history shows which weeks were reviewed.
        message: "Savings plan waste ${{ outputs.analyze_coverage.vars.waste_usd }} per month is under the ${{ inputs.min_waste_usd }} floor, no coverage to reassign."

errors:
  - id: notify_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Escalate any failure to the ops channel with the execution url.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {"text": "FAILED: {{ flow.id }} {{ execution.id }}"}

outputs:
  - id: verdict
    type: STRING
    description: WASTE_FOUND when the wasted commitment beats the dollar floor, otherwise ALL_CLEAR.
    value: "{{ outputs.analyze_coverage.vars.verdict }}"
  - id: waste_usd
    type: FLOAT
    description: Total monthly commitment wasted across every plan below the utilization threshold, for example 1920.0.
    value: "{{ outputs.analyze_coverage.vars.waste_usd }}"
  - id: low_util_plans
    type: ARRAY
    description: 'Underutilized plans as objects with id, utilization, and waste_usd, for example [{"id": "sp-8c7d6e5f4a3b2c10", "utilization": 52.0, "waste_usd": 1920.0}].'
    value: "{{ outputs.analyze_coverage.vars.low_util_plans | toJson }}"
  - id: report_uri
    type: STRING
    description: Internal storage URI of the report.txt waste report written by the analysis step.
    value: "{{ outputs.analyze_coverage.outputFiles['report.txt'] }}"

extend:
  title: Find Wasted Coverage in Underutilized AWS Savings Plans
  metaTitle: AWS Savings Plan Waste Finder with Kestra
  shortDescription: Weekly or webhook run that prices underutilized AWS Savings Plans and turns wasted commitment into a GitHub issue, a Slack alert, and a report.
  metaDescription: Scan AWS Savings Plans for low utilization, price the wasted commitment, and escalate with a GitHub issue, Slack alert, and a waste report.
  description: |
    ## How it works

    1. `weekly_waste_scan` (`io.kestra.plugin.core.trigger.Schedule`, cron `0 6 * * 1`) is the weekly safety net and ships `disabled: true`, so nothing runs until an operator switches it on. `on_demand_audit` (`io.kestra.plugin.core.trigger.Webhook`, keyed) accepts an on-demand audit, for example when finance wants a number before a renewal decision.
    2. `coverage_workspace` (`io.kestra.plugin.core.flow.WorkingDirectory`) opens one shared filesystem so the coverage query, the waste analysis, and the report all see the same files, and only runnable script tasks live inside it.
    3. `fetch_coverage` (`io.kestra.plugin.scripts.shell.Commands` on the `io.kestra.plugin.scripts.runner.docker.Docker` runner, image `amazon/aws-cli:latest`) writes a two-plan fixture with a heredoc, then runs `aws ce get-savings-plans-coverage --output json > coverage.json || true`. When the API cannot be reached the redirect comes up empty and the fixture is copied in, so the analysis always has data. `entryPoint: []` clears the image entrypoint so the shell script runs instead of the bundled `aws` command, and `AWS_DEFAULT_REGION` stays on `us-east-1` because the Cost Explorer endpoint is only served from `us-east-1` and `us-west-2`.
    4. `analyze_coverage` (`io.kestra.plugin.scripts.python.Script` on `python:3.12-slim`) reads the coverage payload, skips plans with no remaining commitment, computes `waste_usd = commitment * (1 - utilization / 100)` for every plan under `utilization_threshold`, writes `report.txt`, and emits the verdict through the outputs protocol.
    5. `check_waste` (`io.kestra.plugin.core.flow.If`) runs right after the workspace closes and compares the waste total with `min_waste_usd`. Above it, `append_advice` (`io.kestra.plugin.core.flow.Loop`, `concurrencyLimit: 1`) walks the underutilized plans, `append_plan_advice` records one recommended move per plan through the outputs protocol, `open_exchange_issue` (`io.kestra.plugin.github.issues.Create`) files a labeled issue with the plan list, and `notify_waste` posts the total to Slack. At or below it, `log_all_clear` records the all-clear.
    6. The `errors` block alerts Slack whenever the query or the analysis breaks, because a dead audit looks exactly like a cheap bill.

    ## What you get

    - Gateable results: `verdict`, `waste_usd`, `low_util_plans`, and `report_uri` are flow outputs any downstream flow or dashboard can branch on.
    - A per-plan waste figure that finance can argue with: commitment times one minus utilization, summed only across plans under the threshold.
    - Escalation where the work happens, a labeled GitHub issue carrying the plan list plus a Slack ping with the monthly total.
    - A report that lists every underutilized plan with its wasted dollars plus a recommended move, ready to attach to the issue or a renewal review.

    ## Who it's for

    - FinOps engineers who own the AWS bill and must justify every dollar of committed spend.
    - Finance partners deciding whether to exchange, reassign, or let a Savings Plan lapse at renewal.
    - Platform leads who suspect coverage was bought for a migration that never landed.

    ## Why orchestrate this with Kestra

    Cost Explorer will happily hand you a coverage number once a quarter and nobody looks at it again. Kestra wraps the query in a cadence that finance can rely on: a disabled weekly schedule as the safety net, a keyed webhook for on-demand audits, a hermetic container so the CLI version lives in the flow file, a threshold branch that separates escalation from the all-clear, a loop that records a recommended move for each plan at a time, and routing into GitHub and Slack from a single definition. The same file doubles as the audit evidence for anyone asking what was reviewed and when.

    ## Prerequisites

    - A worker with Docker access, the query runs in `amazon/aws-cli:latest` and both Python steps in `python:3.12-slim`.
    - An IAM principal with `ce:GetSavingsPlansCoverage` and cost explorer read access. Without reachable credentials the flow still completes on the bundled fixture, which is what makes it safe to run in CI or on a laptop.
    - A GitHub token that can open issues in the repository named on `open_exchange_issue` (classic PAT scope `repo`, or fine-grained **Issues: write**).
    - A Slack incoming webhook for the waste alert and for failure alerts.

    ### Secrets

    - `SAVINGSPLAN_WEBHOOK_KEY`: key segment guarding the on-demand webhook URL, anyone holding it can trigger an audit.
    - `AWS_ACCESS_KEY_ID`: AWS access key with Cost Explorer read permission, optional when the bundled fixture is enough.
    - `AWS_SECRET_ACCESS_KEY`: secret key matching the access key.
    - `GITHUB_TOKEN`: token used to open the exchange issue.
    - `SLACK_WEBHOOK_URL`: Slack incoming webhook URL for waste and failure alerts.

    ## Quick start

    1. Add the five secrets to your Kestra namespace.
    2. Run the flow once with the default inputs and confirm `verdict` reads `WASTE_FOUND`, `waste_usd` reads 1920.0, and `report_uri` points at the report.
    3. Point `open_exchange_issue.repository` at a repository where issues are welcome, then re-run with `min_waste_usd` at 50 to watch the escalation branch open the issue and fire the Slack alert.
    4. Trigger `on_demand_audit` at `/api/v1/{tenant}/executions/webhook/{namespace}/aws-savings-plan-waste-finder/{SAVINGSPLAN_WEBHOOK_KEY}`, or set `disabled: false` on `weekly_waste_scan` once the credentials are in place.

    ## How to extend

    - Split the waste by account or region by adding `--group-by` to the coverage query once a multi-account estate needs per-owner numbers.
    - Add a second `If` on a single-plan floor so one badly utilized plan escalates even when the total stays under the dollar floor.
    - Ship `report.txt` to S3 or attach it to the issue as renewal evidence with `io.kestra.plugin.aws.s3.Upload`.
    - Turn a breach into a red run by adding `io.kestra.plugin.core.execution.Fail` under `check_waste`.

    ## Links

    - [AWS Savings Plans user guide](https://docs.aws.amazon.com/savingsplans/latest/userguide/what-is-savings-plans.html)
    - [`GetSavingsPlansCoverage` API reference](https://docs.aws.amazon.com/cost-management/latest/APIReference/API_GetSavingsPlansCoverage.html)
    - [Kestra Docker task runner](https://kestra.io/plugins/plugin-scripts-docker)
    - [Kestra GitHub plugin](https://kestra.io/plugins/plugin-github)
    - [Kestra Slack plugin](https://kestra.io/plugins/plugin-slack)
  tags:
    - Cloud
    - Business
  subTags:
    - FinOps & Cost Management
    - AWS Services
  ee: false
  demo: false
