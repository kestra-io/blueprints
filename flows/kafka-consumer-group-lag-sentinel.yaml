id: kafka-consumer-group-lag-sentinel
namespace: company.dataops

inputs:
  - id: kafka_bootstrap_servers
    type: STRING
    defaults: kafka:9092
    description: Host and port of the Kafka bootstrap servers.
  - id: consumer_group_name
    type: STRING
    defaults: production-orders-consumer
    description: The consumer group identifier to audit for message lag.
  - id: max_tolerated_lag_records
    type: INT
    defaults: 1000
    description: Maximum permissible message lag across partitions before alerting.

tasks:
  - id: query_consumer_lag
    type: io.kestra.plugin.scripts.shell.Commands
    runner: PROCESS
    commands:
      - |
        kafka-consumer-groups.sh --bootstrap-server {{ inputs.kafka_bootstrap_servers }}           --describe --group {{ inputs.consumer_group_name }} > group_lag.txt 2>/dev/null || true
        python3 -c "
        import json
        with open('group_lag.txt') as f:
            lines = [l.strip() for l in f if l.strip()]
        total_lag = 0
        partition_details = []
        for line in lines[1:]:
            parts = line.split()
            if len(parts) >= 6:
                try:
                    lag = int(parts[5])
                    total_lag += lag
                    if lag > 0:
                        partition_details.append({'topic': parts[1], 'partition': parts[2], 'lag': lag})
                except ValueError:
                    pass
        result = {
            'group': '{{ inputs.consumer_group_name }}',
            'total_lag': total_lag,
            'partition_details': partition_details[:10],
            'alert_triggered': total_lag > {{ inputs.max_tolerated_lag_records }}
        }
        with open('lag_summary.json', 'w') as out:
            json.dump(result, out)
        print('Kafka lag audit:', result)
        "
    outputFiles:
      - lag_summary.json

  - id: evaluate_stream_lag
    type: io.kestra.plugin.core.flow.If
    condition: "{{ json(read(outputs.query_consumer_lag.outputFiles['lag_summary.json'])).alert_triggered }}"
    then:
      - id: alert_streaming_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "text": ":chart_with_upwards_trend: *Kafka Consumer Lag Alert*: Consumer group `{{ inputs.consumer_group_name }}` has accumulated {{ json(read(outputs.query_consumer_lag.outputFiles['lag_summary.json'])).total_lag }} unconsumed messages on {{ inputs.kafka_bootstrap_servers }}."
          }

errors:
  - id: notify_sentinel_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "text": ":warning: *Kafka Sentinel Execution Failure*: Unable to describe consumer group `{{ inputs.consumer_group_name }}`."
      }

triggers:
  - id: scheduled_lag_check
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/10 * * * *"
    disabled: true

extend:
  title: Apache Kafka Consumer Group Lag and Stream Stalling Sentinel
  shortDescription: Audits Apache Kafka consumer group offset lag to detect processing backpressure and stalled stream pipelines.
  description: |
    ## How it works
    This sentinel runs `kafka-consumer-groups.sh` against the target Kafka cluster to inspect consumer group partition offsets. It aggregates total unconsumed message lag across all topic partitions and fires alerts when consumer microservices stall or cannot keep pace with producer throughput.

    ## What you get
    - Real-time detection of stalled or crashed event streaming consumer microservices.
    - Early warning against data pipeline SLA breaches.
    - Actionable Slack notifications detailing total lag and impacted partition numbers.

    ## Who it's for
    - Event streaming engineers, backend developers, and SREs supervising Kafka pipelines.
    - Data platform teams managing real-time pub/sub infrastructure.

    ## Why orchestrate this with Kestra
    Kestra coordinates streaming pipeline health and batch processing side-by-side, executing scheduled lag audits with declarative error handling and notification logic.

    ## Prerequisites
    - Network reachability to Kafka bootstrap brokers.
    - Kafka CLI tools available in the execution environment.
    - Secret `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import this blueprint into Kestra.
    2. Set `kafka_bootstrap_servers` and `consumer_group_name`.
    3. Trigger a manual execution to test lag evaluation.

    ## How to extend
    - Query broker JMX metrics or Kafka Prometheus exporter concurrently.
    - Trigger automated horizontal autoscaling for lagging consumer deployments on Kubernetes.
    - Reset consumer group offsets to latest or earliest in a controlled emergency workflow.

    ## Links
    - [Apache Kafka Consumer Groups Documentation](https://kafka.apache.org/documentation/#basic_ops_consumer_group)
    - [Kestra Kafka Plugin Documentation](https://kestra.io/plugins/plugin-kafka)
  tags:
    - Data
    - Infrastructure
  subTags:
    - Monitoring & Alerting
  ee: false
  demo: false
