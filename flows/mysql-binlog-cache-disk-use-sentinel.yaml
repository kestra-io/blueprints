id: mysql-binlog-cache-disk-use-sentinel
namespace: company.dataops

inputs:
  - id: mysql_host
    type: STRING
    defaults: mysql.internal
    description: Hostname of the MySQL database instance.
  - id: mysql_port
    type: INT
    defaults: 3306
    description: TCP port of the MySQL database instance.
  - id: mysql_database
    type: STRING
    defaults: mysql
    description: Database name to connect to.
  - id: mysql_username
    type: STRING
    defaults: kestra_monitor
    description: MySQL monitoring username.
  - id: max_disk_spill_ratio_threshold
    type: FLOAT
    defaults: 5.0
    description: Maximum acceptable percentage of binlog transactions spilling to disk before alerting.

tasks:
  - id: query_binlog_cache_metrics
    type: io.kestra.plugin.jdbc.mysql.Query
    url: "jdbc:mysql://{{ inputs.mysql_host }}:{{ inputs.mysql_port }}/{{ inputs.mysql_database }}"
    username: "{{ inputs.mysql_username }}"
    password: "{{ secret('MYSQL_PASSWORD') }}"
    sql: |
      SELECT 
        VARIABLE_NAME, 
        CAST(VARIABLE_VALUE AS UNSIGNED) AS METRIC_VALUE 
      FROM performance_schema.global_status 
      WHERE VARIABLE_NAME IN ('Binlog_cache_disk_use', 'Binlog_cache_use');
    fetchType: FETCH

  - id: evaluate_binlog_disk_spills
    type: io.kestra.plugin.core.flow.If
    condition: "{{ (outputs.query_binlog_cache_metrics.rows[0].METRIC_VALUE / (outputs.query_binlog_cache_metrics.rows[0].METRIC_VALUE + outputs.query_binlog_cache_metrics.rows[1].METRIC_VALUE)) * 100.0 > inputs.max_disk_spill_ratio_threshold }}"
    then:
      - id: alert_dba_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "text": ":warning: *MySQL Binlog Disk Spill Alert*: Database {{ inputs.mysql_host }} is spilling binary log transactions to temporary disk files. Increasing `binlog_cache_size` is recommended to reduce disk I/O contention."
          }

errors:
  - id: notify_sentinel_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "text": ":warning: *MySQL Sentinel Execution Failure*: Failed to query binlog cache metrics on {{ inputs.mysql_host }}."
      }

triggers:
  - id: hourly_binlog_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 * * * *"
    disabled: true

extend:
  title: MySQL Binary Log Cache Disk Spillover Sentinel
  shortDescription: Audits MySQL binary log cache metrics to detect transactions spilling into temporary disk files, degrading commit throughput.
  description: |
    ## How it works
    This sentinel queries MySQL `performance_schema.global_status` for `Binlog_cache_disk_use` and `Binlog_cache_use`. It calculates the percentage of transactions whose size exceeded the in-memory buffer, triggering alerts when large batches or transactions incur heavy disk write penalties.

    ## What you get
    - Continuous validation of transaction log memory allocations.
    - Early warning against disk I/O bottlenecks during batch update workloads.
    - Proactive recommendations to resize `binlog_cache_size`.

    ## Who it's for
    - Database administrators tuning OLTP write throughput.
    - SREs troubleshooting commit latency and replication backlog.

    ## Why orchestrate this with Kestra
    Kestra runs automated database observability checks natively using JDBC connectivity, executing scheduled audits without intermediate monitoring agents.

    ## Prerequisites
    - MySQL database instance with binary logging enabled.
    - Secrets `MYSQL_PASSWORD` and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import this blueprint into Kestra.
    2. Configure database host, port, and credentials.
    3. Run manually to check current disk spill ratios.

    ## How to extend
    - Compare `Binlog_stmt_cache_disk_use` for non-transactional statement buffers.
    - Correlate disk spills with slow query log entries.
    - Export metrics to Prometheus for long-term trending.

    ## Links
    - [Kestra MySQL Plugin](https://kestra.io/plugins/plugin-jdbc-mysql)
    - [MySQL Binary Log Cache Documentation](https://dev.mysql.com/doc/refman/8.0/en/replication-options-binary-log.html#sysvar_binlog_cache_size)
  tags:
    - Data
    - Infrastructure
  subTags:
    - Monitoring & Alerting
  ee: false
  demo: false
