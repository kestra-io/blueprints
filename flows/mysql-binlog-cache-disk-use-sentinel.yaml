id: mysql-binlog-cache-disk-use-sentinel
namespace: company.ops

inputs:
  - id: mysql_host
    type: STRING
    defaults: "mysql.internal"
    description: MySQL database hostname or IP address.
  - id: mysql_port
    type: INT
    defaults: 3306
    description: MySQL port.
  - id: mysql_user
    type: STRING
    defaults: "root"
    description: MySQL username.
  - id: max_disk_spills_threshold
    type: INT
    defaults: 10
    description: Maximum acceptable count of binlog transactions written to temporary disk files.

tasks:
  - id: query_binlog_cache_metrics
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    dependencies:
      - pymysql==1.1.1
      - kestra==2.0.0
    env:
      MYSQL_HOST: "{{ inputs.mysql_host }}"
      MYSQL_PORT: "{{ inputs.mysql_port }}"
      MYSQL_USER: "{{ inputs.mysql_user }}"
      MYSQL_PASSWORD: "{{ secret('MYSQL_PASSWORD') }}"
    script: |
      import os
      import sys
      import pymysql
      from kestra import Kestra

      host = os.environ.get("MYSQL_HOST")
      port = int(os.environ.get("MYSQL_PORT", 3306))
      user = os.environ.get("MYSQL_USER")
      password = os.environ.get("MYSQL_PASSWORD")

      try:
          conn = pymysql.connect(
              host=host,
              port=port,
              user=user,
              password=password,
              connect_timeout=10
          )
          with conn.cursor() as cursor:
              cursor.execute("SHOW GLOBAL STATUS LIKE 'Binlog_cache_disk_use';")
              row = cursor.fetchone()
              disk_spills = int(row[1]) if row else 0

          conn.close()
          print(f"Binlog cache disk spills: {disk_spills}")

          Kestra.outputs({
              "disk_spills": disk_spills
          })
      except Exception as e:
          print(f"Error querying MySQL binlog cache metrics: {e}", file=sys.stderr)
          sys.exit(1)

  - id: evaluate_binlog_spills
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.query_binlog_cache_metrics.vars.disk_spills | int >= inputs.max_disk_spills_threshold }}"
    then:
      - id: notify_dba_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#mysql-alerts",
            "attachments": [
              {
                "color": "warning",
                "title": "⚠️ MySQL Binlog Cache Disk Spill Alert",
                "text": "MySQL server `{{ inputs.mysql_host }}` recorded *{{ outputs.query_binlog_cache_metrics.vars.disk_spills }}* transactions spilling from memory buffer to disk (`Binlog_cache_disk_use`)! Impact: Large multi-row transactions exceed `binlog_cache_size`, creating temporary disk files that degrade commit latency and increase storage wear.",
                "footer": "Kestra Database Sentinel • MySQL"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#mysql-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ MySQL Binary Log Cache Disk Spill Sentinel Pipeline Failure",
            "text": "Failed to query MySQL global status. Check host connection and credentials.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

outputs:
  - id: disk_spills
    type: INT
    value: "{{ outputs.query_binlog_cache_metrics.vars.disk_spills }}"

extend:
  metaDescription: "Monitors MySQL binlog_cache_disk_use status to detect transaction memory buffer spills to disk."
  metaTitle: MySQL Binary Log Cache Disk Spill Sentinel with Kestra
  title: MySQL Binary Log Cache Disk Spill Sentinel
  shortDescription: Monitors MySQL binlog_cache_disk_use status to detect transaction memory buffer spills to disk.
  description: |
    ## How it works
    This workflow executes `SHOW GLOBAL STATUS LIKE 'Binlog_cache_disk_use'` against the MySQL database using a containerized Python script. While transactions are in progress, changes are buffered in memory (`binlog_cache_size`). If a large bulk INSERT, UPDATE, or DELETE exceeds this buffer, MySQL must write transaction statements to a temporary disk file. Frequent disk spills degrade commit throughput and increase I/O wait times. Slack is alerted when disk spills exceed the threshold.

    ## What you get
    - Real-time detection of transactions spilling binlog memory buffers to disk.
    - Prevents commit latency spikes and disk I/O bottlenecks on transaction-heavy workloads.
    - Identifies when `binlog_cache_size` tuning is required.

    ## Who it's for
    - Database Administrators (DBAs) tuning MySQL memory and transactional performance.
    - SREs maintaining high-throughput OLTP databases.

    ## Why orchestrate this with Kestra
    - **Native Containerized Querying**: Uses PyMySQL cleanly inside a Docker runner.
    - **Continuous Parameter Auditing**: Provides quantitative evidence for memory buffer optimization.
    - **Direct Alerting**: Immediate Slack notifications keep on-call DBAs informed.

    ## Prerequisites
    - MySQL 5.7 / 8.0 server with binary logging enabled.
    - Secrets `MYSQL_PASSWORD` and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import the blueprint.
    2. Configure MySQL host and credentials.
    3. Run the workflow to inspect binary log cache disk usage.

    ## How to extend
    - Compare with `Binlog_cache_use` to calculate exact disk-spill percentage.
    - Automatically generate recommendations to increase `binlog_cache_size`.

    ## Links
    - [MySQL Binary Log Cache Documentation](https://dev.mysql.com/doc/refman/8.0/en/replication-options-binary-log.html#sysvar_binlog_cache_size)
    - [Kestra Python Plugin](https://kestra.io/plugins/plugin-script-python)
  tags:
    - Data
    - Infrastructure
  subTags:
    - ELT & Data Landing
    - Day 2 Operations
  ee: false
  demo: false
