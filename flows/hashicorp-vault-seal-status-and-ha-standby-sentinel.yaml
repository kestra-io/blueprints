id: hashicorp-vault-seal-status-and-ha-standby-sentinel
namespace: company.security

description: |
  Audits HashiCorp Vault cluster nodes for sealed state and high-availability (HA)
  leader failover status via Vault sys/health API, opens a critical GitHub SecOps
  outage ticket, and alerts on-call infrastructure security engineers on Slack.

inputs:
  - id: vault_address
    type: STRING
    displayName: HashiCorp Vault Cluster Address
    defaults: "https://vault.internal.company.com:8200"

  - id: target_repository
    type: STRING
    displayName: SecOps Infrastructure Tracking Repository
    defaults: my-org/security-infrastructure

triggers:
  - id: check_vault_health_frequent
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/5 * * * *"
    disabled: true

tasks:
  - id: probe_vault_sys_health
    type: io.kestra.plugin.scripts.python.Script
    description: Interrogates Vault sys/health endpoint to evaluate seal status, initialization, and HA active leadership
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install requests kestra
    script: |
      import requests
      from kestra import Kestra

      addr = "{{ inputs.vault_address }}"
      # sys/health returns HTTP 200 (active), 429 (unsealed standby), 501 (not initialized), 503 (sealed)
      url = f"{addr}/v1/sys/health"

      try:
          response = requests.get(url, timeout=15)
          status_code = response.status_code
          data = response.json() if response.content else {}
      except Exception as err:
          print(f"Failed to connect to Vault cluster: {err}")
          data = {"sealed": True, "initialized": False, "error": str(err)}
          status_code = 503

      is_sealed = data.get("sealed", True)
      is_initialized = data.get("initialized", True)
      cluster_name = data.get("cluster_name", "unknown")
      version = data.get("version", "unknown")
      is_standby = data.get("standby", False)

      is_critical = is_sealed or not is_initialized
      print(f"Vault {addr} (Cluster: {cluster_name}): sealed={is_sealed}, initialized={is_initialized}, status={status_code}")

      Kestra.outputs({
          "status_code": status_code,
          "is_sealed": is_sealed,
          "is_initialized": is_initialized,
          "is_critical": is_critical,
          "cluster_name": cluster_name,
          "version": version
      })

  - id: branch_on_vault_status
    type: io.kestra.plugin.core.flow.If
    description: Branches based on whether Vault is sealed, uninitialized, or degraded
    condition: "{{ outputs.probe_vault_sys_health.vars.is_critical == true }}"
    then:
      - id: create_vault_outage_issue
        type: io.kestra.plugin.github.issues.Create
        description: Logs a critical P1 GitHub issue documenting Vault cluster sealed status
        oauthToken: "{{ secret('GITHUB_TOKEN') }}"
        repository: "{{ inputs.target_repository }}"
        title: "[P1 Security Alert] HashiCorp Vault Cluster is SEALED / Uninitialized: {{ outputs.probe_vault_sys_health.vars.cluster_name }}"
        body: |
          ## 🚨 CRITICAL: HashiCorp Vault Cluster Sealed Outage

          Automated cluster health sentinel detected that HashiCorp Vault is in a sealed or uninitialized state:
          - **Vault Address:** `{{ inputs.vault_address }}`
          - **Cluster Name:** `{{ outputs.probe_vault_sys_health.vars.cluster_name }}`
          - **Sealed Status:** **{{ outputs.probe_vault_sys_health.vars.is_sealed }}**
          - **Initialized:** `{{ outputs.probe_vault_sys_health.vars.is_initialized }}``
          - **Vault Version:** `{{ outputs.probe_vault_sys_health.vars.version }}`

          Immediate unseal ceremony (auto-unseal KMS verification or Shamir key shards) is required to restore secrets access.
          *Generated automatically by Kestra Vault Health Sentinel.*

      - id: alert_secops_slack
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Alerts on-call security response channels on Slack with immediate unseal escalation
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {{ {
            "text": "🚨 *CRITICAL: HashiCorp Vault Cluster SEALED*\n*Address:* `" ~ inputs.vault_address ~ "` (Cluster: `" ~ outputs.probe_vault_sys_health.vars.cluster_name ~ "`)\n*Status:* Sealed: *" ~ outputs.probe_vault_sys_health.vars.is_sealed ~ "*\n*Outage Ticket:* <" ~ (outputs.create_vault_outage_issue.issueUrl ?? "#") ~ "|View GitHub P1 Incident>"
          } | toJson }}

    else:
      - id: log_vault_healthy
        type: io.kestra.plugin.core.log.Log
        message: "Vault cluster {{ outputs.probe_vault_sys_health.vars.cluster_name }} is unsealed and operational (Version: {{ outputs.probe_vault_sys_health.vars.version }})."

  - id: log_audit_complete
    type: io.kestra.plugin.core.log.Log
    description: Audit trail summarizing the Vault seal check execution
    message: "Vault health probe completed. sealed={{ outputs.probe_vault_sys_health.vars.is_sealed }}, initialized={{ outputs.probe_vault_sys_health.vars.is_initialized }}."

errors:
  - id: alert_probe_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alerts Slack when the health check execution encounters an unhandled error
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {{ {
        "text": "⚠️ *Vault Health Sentinel Failed* in execution `" ~ execution.id ~ "`. Unable to query `" ~ inputs.vault_address ~ "`."
      } | toJson }}

extend:
  title: "HashiCorp Vault Seal Status and HA Cluster Sentinel"
  shortDescription: "Audit HashiCorp Vault cluster seal status via sys/health, detect unexpected lockouts, open GitHub P1 issues, and alert Slack."
  metaTitle: "HashiCorp Vault Seal Status and Cluster Sentinel with Kestra"
  metaDescription: "Monitor HashiCorp Vault cluster seal status and HA readiness with Kestra. Query sys/health endpoints, log GitHub incident issues, and alert SecOps on Slack."
  description: |
    Enterprise secrets management relies entirely on HashiCorp Vault to supply database credentials, API tokens, and encryption keys to production microservices. When a Vault node restarts, unseal keys must be provided via Shamir secret sharing or cloud KMS unseal (AWS KMS, Azure Key Vault, GCP Cloud KMS). If an unexpected seal occurs, all downstream applications immediately fail secrets retrieval. This blueprint probes HashiCorp Vault's `/v1/sys/health` endpoint on an aggressive schedule, detects sealed or uninitialized cluster states, files an automated P1 GitHub tracking issue, and alerts on-call SecOps engineers via Slack.

    ## How it works

    1. `check_vault_health_frequent` (`io.kestra.plugin.core.trigger.Schedule`) initiates the audit every 5 minutes (shipped disabled for safe verification).
    2. `probe_vault_sys_health` (`io.kestra.plugin.scripts.python.Script`) interrogates the unauthenticated Vault `/v1/sys/health` API endpoint, reading `sealed`, `initialized`, `cluster_name`, and `version` fields.
    3. `branch_on_vault_status` (`io.kestra.plugin.core.flow.If`) evaluates whether Vault is sealed or uninitialized (`is_critical == true`):
       - `then`: Automatically files a P1 GitHub tracking issue via `create_vault_outage_issue` (`io.kestra.plugin.github.issues.Create`) and alerts the SecOps Slack channel via `alert_secops_slack` (`io.kestra.plugin.slack.notifications.SlackIncomingWebhook`).
       - `else`: Emits an informational log entry (`log_vault_healthy`) confirming normal cluster operations.
    4. `log_audit_complete` (`io.kestra.plugin.core.log.Log`) records the final health summary.
    5. The `errors` block alerts Slack if network connectivity or DNS resolution fails.

    ## What you get

    - Automated, continuous visibility into Vault cluster availability and seal status.
    - Zero delayed response when unexpected node reboots leave Vault locked.
    - Consolidated GitHub incident tickets with cluster names, versions, and initialization details.
    - Real-time Slack notifications with direct ticket hyperlinks.

    ## Who it's for

    - DevSecOps and Platform Security Engineers operating Vault clusters.
    - Site Reliability Engineers ensuring continuous secrets availability.
    - Cloud Infrastructure leads establishing automated incident runbooks.

    ## Why orchestrate this with Kestra

    Kestra bridges unauthenticated cluster health probing, conditional escalation, issue ticketing, and team alerting in a single declarative workflow. It provides complete execution history, and eliminates the need for standalone monitoring daemons or fragmented bash cron scripts.

    ## Prerequisites

    - A HashiCorp Vault cluster accessible over HTTPS.
    - A GitHub Personal Access Token with repository issue creation permissions.
    - A Slack incoming webhook URL for notifications.

    ### Secrets

    - `GITHUB_TOKEN`: GitHub token used to open incident issues.
    - `SLACK_WEBHOOK`: Incoming Webhook URL for security alerts.

    ## Inputs

    - `vault_address` (STRING, default `https://vault.internal.company.com:8200`): HashiCorp Vault cluster URL.
    - `target_repository` (STRING, default `my-org/security-infrastructure`): Target GitHub repository for logging incident issues.

    ## Outputs

    - `outputs.probe_vault_sys_health.vars.is_sealed`: Boolean indicating if Vault is currently sealed.
    - `outputs.probe_vault_sys_health.vars.is_initialized`: Boolean indicating if Vault is initialized.
    - `outputs.probe_vault_sys_health.vars.cluster_name`: Registered cluster name identifier.

    ## Quick start

    1. Configure `GITHUB_TOKEN` and `SLACK_WEBHOOK` in your Kestra namespace.
    2. Import this flow and set `vault_address` to match your cluster endpoint.
    3. Run the flow manually to verify health extraction and Slack notification delivery.
    4. Enable the `check_vault_health_frequent` trigger for continuous cluster monitoring.

    ## How to extend

    - Add an automated unseal task utilizing cloud KMS or transit auto-unseal mechanisms.
    - Route critical alerts to PagerDuty or Opsgenie for high-priority on-call paging.
    - Probe individual node IP addresses behind the load balancer to catch standby node seal drift.

    ## Links

    - [HashiCorp Vault sys/health API Documentation](https://developer.hashicorp.com/vault/api-docs/system/health)
    - [Kestra Python Script Plugin](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra GitHub Plugin](https://kestra.io/plugins/plugin-github)
    - [Kestra Slack Plugin](https://kestra.io/plugins/plugin-slack)

  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Monitoring & Alerting
  ee: false
  demo: false
