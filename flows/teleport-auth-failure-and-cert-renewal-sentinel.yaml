id: teleport-auth-failure-and-cert-renewal-sentinel
namespace: company.infrastructure

inputs:
  - id: teleport_diag_endpoint
    type: STRING
    displayName: Teleport Diagnostics Endpoint
    description: Base URL of the Teleport Auth service diagnostics and Prometheus metrics endpoint.
    defaults: "http://localhost:3024"

  - id: max_allowed_failed_logins
    type: INT
    displayName: Maximum Allowed Failed Logins
    description: Threshold of failed login attempts within the evaluation window before triggering a security alert.
    defaults: 5

  - id: send_slack_alert
    type: BOOLEAN
    displayName: Dispatch Slack Security Alert
    description: Whether to transmit real-time Slack notifications upon authentication failure spikes or certificate renewal errors.
    defaults: true

triggers:
  - id: teleport_audit_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    description: Recurring audit polling Teleport access plane security metrics every 15 minutes.
    cron: "*/15 * * * *"
    disabled: true

tasks:
  - id: probe_teleport_metrics
    type: io.kestra.plugin.core.http.Request
    description: Query Teleport Auth diagnostics endpoint for authentication failure and certificate renewal metrics.
    uri: "{{ inputs.teleport_diag_endpoint }}/metrics"
    method: GET
    headers:
      Accept: "text/plain"
    options:
      allowFailed: true
      timeout:
        connectTimeout: PT10S
        readIdleTimeout: PT30S
    retry:
      type: constant
      interval: PT5S
      maxAttempts: 3
    allowFailure: true

  - id: evaluate_security_metrics
    type: io.kestra.plugin.scripts.python.Script
    description: Interrogate Teleport Prometheus metrics text, extract authentication anomalies, and classify incident severity.
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    inputFiles:
      metrics.txt: "{{ outputs.probe_teleport_metrics.body }}"
    script: |
      import re
      import json

      max_allowed_failures = int({{ inputs.max_allowed_failed_logins }})

      try:
          with open("metrics.txt", "r") as f:
              raw = f.read()
      except Exception:
          raw = ""

      def extract_metric(pattern):
          matches = re.findall(pattern, raw)
          total = 0.0
          for m in matches:
              try:
                  total += float(m)
              except ValueError:
                  pass
          return total

      failed_logins = extract_metric(r'teleport_failed_login_attempts_total(?:\{[^}]*\})?\s+([0-9\.]+)')
      cert_renewal_errors = extract_metric(r'teleport_certificate_renewal_errors_total(?:\{[^}]*\})?\s+([0-9\.]+)')
      total_auth_requests = extract_metric(r'teleport_auth_requests_total(?:\{[^}]*\})?\s+([0-9\.]+)')

      if failed_logins == 0 and cert_renewal_errors == 0:
          classification = "ACCESS_HEALTHY"
      elif failed_logins <= max_allowed_failures and cert_renewal_errors == 0:
          classification = "AUTHENTICATION_WARNING"
      else:
          classification = "CRITICAL_SECURITY_INCIDENT"

      output_payload = {
          "outputs": {
              "failed_logins_count": int(failed_logins),
              "cert_renewal_errors": int(cert_renewal_errors),
              "total_auth_requests": int(total_auth_requests),
              "classification": classification
          }
      }
      print(f"::{json.dumps(output_payload)}::")

  - id: classify_access_status
    type: io.kestra.plugin.core.log.Log
    description: Log evaluated Teleport access plane security metrics and status classification.
    message: |
      Teleport Endpoint: {{ inputs.teleport_diag_endpoint }}
      Failed Logins: {{ outputs.evaluate_security_metrics.vars.failed_logins_count }}
      Cert Renewal Errors: {{ outputs.evaluate_security_metrics.vars.cert_renewal_errors }}
      Total Auth Requests: {{ outputs.evaluate_security_metrics.vars.total_auth_requests }}
      Classification: {{ outputs.evaluate_security_metrics.vars.classification }}

  - id: route_security_gate
    type: io.kestra.plugin.core.flow.Switch
    description: Route flow execution based on Teleport access plane security classification.
    value: "{{ outputs.evaluate_security_metrics.vars.classification }}"
    cases:
      ACCESS_HEALTHY:
        - id: log_healthy_access
          type: io.kestra.plugin.core.log.Log
          description: Log nominal verification confirming access plane authentications and certificate renewals are healthy.
          message: "HEALTHY: Teleport access plane reports zero failed login spikes and zero certificate renewal errors."

      AUTHENTICATION_WARNING:
        - id: log_auth_advisory
          type: io.kestra.plugin.core.log.Log
          description: Log advisory warning for non-critical failed authentication attempts within tolerance bounds.
          message: "WARNING: Elevated failed login attempts ({{ outputs.evaluate_security_metrics.vars.failed_logins_count }}) detected on Teleport access plane."

      CRITICAL_SECURITY_INCIDENT:
        - id: alert_slack_security_incident
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: Dispatch urgent security incident alert to SecOps and platform engineering channel.
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "text": ":rotating_light: *CRITICAL Teleport Access Plane Security Alert*\n*Endpoint:* `{{ inputs.teleport_diag_endpoint }}`\n*Failed Logins:* `{{ outputs.evaluate_security_metrics.vars.failed_logins_count }}`\n*Cert Renewal Errors:* `{{ outputs.evaluate_security_metrics.vars.cert_renewal_errors }}`\n*Total Auth Requests:* `{{ outputs.evaluate_security_metrics.vars.total_auth_requests }}`\n*Execution:* <{{ flow.url }}|{{ execution.id }}>"
            }

        - id: remediation_security_gate
          type: io.kestra.plugin.core.execution.Fail
          description: Fail execution to trigger security incident response and isolate compromised access pipelines.

  - id: final_audit_log
    type: io.kestra.plugin.core.log.Log
    description: Record immutable audit log entry documenting Teleport access plane security verification.
    message: |
      [AUDIT] Teleport Access Plane Authentication Failure and Certificate Renewal Sentinel completed.
      Endpoint: {{ inputs.teleport_diag_endpoint }}
      Failed Logins: {{ outputs.evaluate_security_metrics.vars.failed_logins_count }}
      Cert Renewal Errors: {{ outputs.evaluate_security_metrics.vars.cert_renewal_errors }}
      Verdict: {{ outputs.evaluate_security_metrics.vars.classification }}

extend:
  title: Teleport Access Plane Authentication Failure and Certificate Renewal Sentinel
  metaTitle: Teleport Access Plane Security Sentinel | Kestra
  shortDescription: Audit Teleport failed login surges and certificate renewal errors, triggering Slack alerts on access threats.
  metaDescription: Audit Teleport access plane failed logins and CA cert renewal errors, classify security incident severity, and dispatch Slack alerts to protect infrastructure.
  description: |
    Automated zero-trust infrastructure sentinel that interrogates Teleport Access Plane diagnostics and Prometheus metrics on a recurring schedule to audit authentication health, detect brute-force login attempts, identify CA certificate renewal failures, and dispatch Slack security alerts before engineer access to Kubernetes and SSH clusters expires.

    ## How it works

    1. A schedule trigger activates every fifteen minutes to audit the Teleport Auth service.
    2. An HTTP request task queries Teleport's diagnostic `/metrics` endpoint to harvest real-time authentication counters and certificate health telemetry.
    3. An embedded Python script parses metric lines, extracting `teleport_failed_login_attempts_total`, `teleport_certificate_renewal_errors_total`, and total authentication volume.
    4. An informational log task records evaluated access telemetry and current threat classification.
    5. A `Switch` flow control task branches execution according to the evaluated status:
       - `ACCESS_HEALTHY`: Confirms zero certificate errors or login spikes and logs nominal security telemetry.
       - `AUTHENTICATION_WARNING`: Emits a non-blocking advisory notification when minor login failures fall within allowable thresholds.
       - `CRITICAL_SECURITY_INCIDENT`: Dispatches a detailed Slack incident webhook with failed login tallies, certificate renewal error counts, execution deep links, and halts execution via a security gate.
    6. An immutable final audit log records the comprehensive health verdict and security metrics in Kestra execution history.

    ## What you get

    - Automated threat detection catching credential stuffing attacks and brute-force login attempts on administrative gateways.
    - Early warning safeguards identifying CA certificate renewal errors before engineer SSH and Kubernetes access credentials expire.
    - Immediate Slack notifications alerting SecOps and platform teams with actionable incident telemetry.
    - Automated execution failure gates that halt dependent deployment pipelines when access plane security degrades.
    - Complete, immutable audit records tracking zero-trust infrastructure access stability.

    ## Who it's for

    - Security Operations (SecOps) and Platform Engineers maintaining Teleport infrastructure access gateways.
    - Site Reliability Engineers (SREs) managing zero-trust access to production Kubernetes clusters and SSH nodes.
    - Compliance Officers ensuring continuous auditing of infrastructure authentication failures.

    ## Why orchestrate this with Kestra

    - Declarative YAML orchestrates diagnostic harvesting, text parsing, and incident dispatching without dedicated external monitoring agents.
    - Native secret masking ensures Slack webhook URLs and administrative tokens remain secured throughout automated runs.
    - Built-in conditional branching enables granular escalation policies tailored to security threat thresholds.
    - Centralized execution timelines provide instant forensic visibility into historical authentication anomaly patterns.

    ## Prerequisites

    - Running Teleport cluster (Auth service or Proxy) with the diagnostic metrics endpoint enabled (default port `3024`).
    - Network reachability between Kestra and the Teleport diagnostics endpoint.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL used to transmit critical access plane security alerts.

    ## Quick start

    1. Configure the `SLACK_WEBHOOK_URL` secret in your Kestra namespace or environment variables.
    2. Import this blueprint into your Kestra instance under `company.infrastructure`.
    3. Run a manual test execution pointing to your Teleport diagnostics endpoint to verify metric connectivity and parsing.
    4. Enable the `teleport_audit_schedule` trigger to maintain continuous 15-minute access plane monitoring.

    ## How to extend

    - Add an automated IP-blocking task in the remediation branch via Cloudflare or AWS Security Groups when brute-force logins spike.
    - Correlate failed logins with Okta or GitHub identity provider webhook logs for multi-source security forensics.
    - Route separate alerts to PagerDuty or Opsgenie when CA certificate renewal failures threaten cluster-wide access lockouts.

    ## Links

    - [Kestra HTTP Plugin Documentation](https://kestra.io/plugins/core/http/request)
    - [Teleport Metrics Reference](https://goteleport.com/docs/admin-guides/management/operations/monitoring/)
    - [Teleport Architecture Documentation](https://goteleport.com/docs/architecture/overview/)
  tags:
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - Incident Response
  ee: false
  demo: false
