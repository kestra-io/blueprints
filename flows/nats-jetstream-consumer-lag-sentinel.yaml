id: nats-jetstream-consumer-lag-sentinel
namespace: company.messaging

inputs:
  - id: nats_monitoring_url
    type: STRING
    defaults: "http://localhost:8222"
    displayName: "NATS Monitoring URL"
    description: "Base HTTP URL of the NATS server monitoring endpoint exposing JetStream telemetry (/jsz)."

  - id: stream_filter
    type: STRING
    defaults: ""
    displayName: "Stream Name Filter"
    description: "Optional regex or substring to filter streams. Leave empty to audit all JetStream streams."

  - id: consumer_filter
    type: STRING
    defaults: ""
    displayName: "Consumer Name Filter"
    description: "Optional regex or substring to filter consumers. Leave empty to audit all active consumers."

  - id: lag_warning_threshold
    type: INT
    defaults: 1000
    displayName: "Lag Warning Threshold"
    description: "Unprocessed message count (num_pending) to flag a consumer with WARNING status."

  - id: lag_critical_threshold
    type: INT
    defaults: 5000
    displayName: "Lag Critical Threshold"
    description: "Unprocessed message count (num_pending) to flag a consumer with CRITICAL status."

  - id: ack_pending_critical_threshold
    type: INT
    defaults: 2000
    displayName: "In-Flight Ack Pending Critical Threshold"
    description: "Delivered but unacknowledged in-flight message count (num_ack_pending) triggering CRITICAL status."

  - id: storage_warning_percent
    type: FLOAT
    defaults: 80.0
    displayName: "Storage Warning Threshold (%)"
    description: "Stream storage utilization percentage of max_bytes to flag WARNING status."

  - id: storage_critical_percent
    type: FLOAT
    defaults: 95.0
    displayName: "Storage Critical Threshold (%)"
    description: "Stream storage utilization percentage of max_bytes to flag CRITICAL status."

  - id: fail_on_critical
    type: BOOL
    defaults: false
    displayName: "Fail Execution on Critical"
    description: "Whether to emit an execution failure when any consumer lag or stream storage exceeds critical thresholds."

  - id: scaling_webhook_url
    type: STRING
    defaults: ""
    displayName: "Horizontal Scaling Webhook URL"
    description: "Optional HTTP webhook endpoint to invoke for consumer worker autoscaling upon critical lag."

  - id: slack_channel
    type: STRING
    defaults: "#nats-alerts"
    displayName: "Slack Channel"
    description: "Slack channel destination for JetStream health and capacity notifications."

tasks:
  - id: fetch_jetstream_telemetry
    type: io.kestra.plugin.core.http.Request
    description: "Fetch live stream and consumer telemetry from NATS HTTP monitoring API (/jsz)."
    uri: "{{ inputs.nats_monitoring_url }}/jsz?streams=true&consumers=true&config=true"
    method: GET
    contentType: application/json
    retry:
      type: exponential
      interval: PT2S
      maxInterval: PT10S
      maxAttempts: 3

  - id: analyze_consumer_lag_and_retention
    type: io.kestra.plugin.scripts.python.Script
    description: "Parse NATS telemetry, evaluate lag and storage against thresholds, compare historical drift, and emit verdict."
    containerImage: python:3.11-slim
    inputFiles:
      nats_telemetry.json: "{{ outputs.fetch_jetstream_telemetry.body | toJson }}"
      previous_audit.json: "{{ (kv('nats_jetstream_audit_' ~ (inputs.stream_filter != '' ? inputs.stream_filter : 'all'), errorOnMissing=false) ?? {}) | toJson }}"
    env:
      STREAM_FILTER: "{{ inputs.stream_filter }}"
      CONSUMER_FILTER: "{{ inputs.consumer_filter }}"
      LAG_WARNING_THRESHOLD: "{{ inputs.lag_warning_threshold }}"
      LAG_CRITICAL_THRESHOLD: "{{ inputs.lag_critical_threshold }}"
      ACK_PENDING_CRITICAL_THRESHOLD: "{{ inputs.ack_pending_critical_threshold }}"
      STORAGE_WARNING_PERCENT: "{{ inputs.storage_warning_percent }}"
      STORAGE_CRITICAL_PERCENT: "{{ inputs.storage_critical_percent }}"
    script: |
      import json
      import os
      import re
      from datetime import datetime, timezone

      stream_filter = os.getenv("STREAM_FILTER", "").strip()
      consumer_filter = os.getenv("CONSUMER_FILTER", "").strip()
      lag_warning = int(os.getenv("LAG_WARNING_THRESHOLD", "1000"))
      lag_critical = int(os.getenv("LAG_CRITICAL_THRESHOLD", "5000"))
      ack_pending_critical = int(os.getenv("ACK_PENDING_CRITICAL_THRESHOLD", "2000"))
      storage_warning_pct = float(os.getenv("STORAGE_WARNING_PERCENT", "80.0"))
      storage_critical_pct = float(os.getenv("STORAGE_CRITICAL_PERCENT", "95.0"))

      try:
          with open("nats_telemetry.json", "r", encoding="utf-8") as f:
              data = json.load(f)
          if isinstance(data, str):
              data = json.loads(data)
      except Exception:
          data = {}

      previous_audit = {}
      if os.path.exists("previous_audit.json"):
          try:
              with open("previous_audit.json", "r", encoding="utf-8") as f:
                  previous_audit = json.load(f)
              if isinstance(previous_audit, str):
                  previous_audit = json.loads(previous_audit)
          except Exception:
              previous_audit = {}

      streams = []
      if isinstance(data.get("stream_detail"), list):
          streams.extend(data["stream_detail"])
      if isinstance(data.get("account_details"), list):
          for acc in data["account_details"]:
              if isinstance(acc.get("stream_detail"), list):
                  streams.extend(acc["stream_detail"])

      total_streams = 0
      total_consumers = 0
      breaches = []
      stream_summaries = []
      max_consumer_lag = 0
      highest_lag_consumer = ""
      highest_lag_stream = ""
      max_storage_pct = 0.0
      highest_storage_stream = ""

      for stream in streams:
          stream_name = stream.get("name", "unknown")
          if stream_filter and not re.search(stream_filter, stream_name, re.IGNORECASE):
              continue

          total_streams += 1
          cfg = stream.get("config", {}) or {}
          st = stream.get("state", {}) or {}

          storage_bytes = st.get("bytes", 0)
          messages = st.get("messages", 0)
          max_bytes = cfg.get("max_bytes", -1)

          if max_bytes > 0:
              storage_pct = round((storage_bytes / max_bytes) * 100.0, 2)
          else:
              storage_pct = 0.0

          if storage_pct > max_storage_pct:
              max_storage_pct = storage_pct
              highest_storage_stream = stream_name

          stream_status = "OK"
          if max_bytes > 0:
              if storage_pct >= storage_critical_pct:
                  stream_status = "CRITICAL"
                  breaches.append({
                      "severity": "CRITICAL",
                      "resource_type": "stream",
                      "stream": stream_name,
                      "metric": "storage_bytes",
                      "current_value": storage_bytes,
                      "max_limit": max_bytes,
                      "percentage": storage_pct,
                      "threshold": storage_critical_pct,
                      "reason": f"Stream '{stream_name}' storage at {storage_pct}% ({storage_bytes}/{max_bytes} bytes) exceeds critical threshold ({storage_critical_pct}%)"
                  })
              elif storage_pct >= storage_warning_pct:
                  stream_status = "WARNING"
                  breaches.append({
                      "severity": "WARNING",
                      "resource_type": "stream",
                      "stream": stream_name,
                      "metric": "storage_bytes",
                      "current_value": storage_bytes,
                      "max_limit": max_bytes,
                      "percentage": storage_pct,
                      "threshold": storage_warning_pct,
                      "reason": f"Stream '{stream_name}' storage at {storage_pct}% ({storage_bytes}/{max_bytes} bytes) exceeds warning threshold ({storage_warning_pct}%)"
                  })

          consumer_details = stream.get("consumer_detail", []) or []
          for consumer in consumer_details:
              consumer_name = consumer.get("name", "unknown")
              if consumer_filter and not re.search(consumer_filter, consumer_name, re.IGNORECASE):
                  continue

              total_consumers += 1
              num_pending = consumer.get("num_pending", 0)
              num_ack_pending = consumer.get("num_ack_pending", 0)
              num_redelivered = consumer.get("num_redelivered", 0)
              num_waiting = consumer.get("num_waiting", 0)

              if num_pending > max_consumer_lag:
                  max_consumer_lag = num_pending
                  highest_lag_consumer = consumer_name
                  highest_lag_stream = stream_name

              if num_pending >= lag_critical:
                  breaches.append({
                      "severity": "CRITICAL",
                      "resource_type": "consumer",
                      "stream": stream_name,
                      "consumer": consumer_name,
                      "metric": "num_pending",
                      "current_value": num_pending,
                      "threshold": lag_critical,
                      "reason": f"Consumer '{consumer_name}' on stream '{stream_name}' lag ({num_pending} pending) exceeds critical threshold ({lag_critical})"
                  })
              elif num_pending >= lag_warning:
                  breaches.append({
                      "severity": "WARNING",
                      "resource_type": "consumer",
                      "stream": stream_name,
                      "consumer": consumer_name,
                      "metric": "num_pending",
                      "current_value": num_pending,
                      "threshold": lag_warning,
                      "reason": f"Consumer '{consumer_name}' on stream '{stream_name}' lag ({num_pending} pending) exceeds warning threshold ({lag_warning})"
                  })

              if num_ack_pending >= ack_pending_critical:
                  breaches.append({
                      "severity": "CRITICAL",
                      "resource_type": "consumer",
                      "stream": stream_name,
                      "consumer": consumer_name,
                      "metric": "num_ack_pending",
                      "current_value": num_ack_pending,
                      "threshold": ack_pending_critical,
                      "reason": f"Consumer '{consumer_name}' on stream '{stream_name}' in-flight ({num_ack_pending} ack_pending) exceeds critical threshold ({ack_pending_critical})"
                  })

          stream_summaries.append({
              "name": stream_name,
              "status": stream_status,
              "messages": messages,
              "bytes": storage_bytes,
              "max_bytes": max_bytes,
              "storage_pct": storage_pct,
              "consumers": len(consumer_details)
          })

      drift_summary = {}
      if previous_audit and isinstance(previous_audit, dict):
          prev_lag = previous_audit.get("max_consumer_lag", 0)
          prev_storage_pct = previous_audit.get("max_storage_pct", 0.0)
          lag_delta = max_consumer_lag - prev_lag
          storage_delta = round(max_storage_pct - prev_storage_pct, 2)
          drift_summary = {
              "previous_max_lag": prev_lag,
              "lag_delta": lag_delta,
              "previous_max_storage_pct": prev_storage_pct,
              "storage_delta_pct": storage_delta
          }

      critical_breaches = [b for b in breaches if b["severity"] == "CRITICAL"]
      warning_breaches = [b for b in breaches if b["severity"] == "WARNING"]

      if critical_breaches:
          status = "CRITICAL"
      elif warning_breaches:
          status = "WARNING"
      else:
          status = "OK"

      is_critical = (status == "CRITICAL")
      is_warning = (status == "WARNING")

      summary_text = (
          f"Status: {status} | Checked {total_streams} streams, {total_consumers} consumers. "
          f"Max lag: {max_consumer_lag} msgs ({highest_lag_consumer or 'none'}), "
          f"Max storage: {max_storage_pct}%. "
          f"Breaches: {len(critical_breaches)} critical, {len(warning_breaches)} warning."
      )

      manifest = {
          "status": status,
          "is_critical": is_critical,
          "is_warning": is_warning,
          "total_streams_checked": total_streams,
          "total_consumers_checked": total_consumers,
          "max_consumer_lag": max_consumer_lag,
          "highest_lag_consumer": highest_lag_consumer,
          "highest_lag_stream": highest_lag_stream,
          "max_storage_pct": max_storage_pct,
          "highest_storage_stream": highest_storage_stream,
          "summary": summary_text,
          "critical_count": len(critical_breaches),
          "warning_count": len(warning_breaches),
          "breaches": breaches,
          "streams": stream_summaries,
          "drift": drift_summary,
          "evaluated_at": datetime.now(timezone.utc).isoformat()
      }

      print(summary_text)
      print("::" + json.dumps({
          "outputs": {
              "status": status,
              "is_critical": is_critical,
              "is_warning": is_warning,
              "total_streams_checked": total_streams,
              "total_consumers_checked": total_consumers,
              "max_consumer_lag": max_consumer_lag,
              "highest_lag_consumer": highest_lag_consumer,
              "highest_lag_stream": highest_lag_stream,
              "max_storage_pct": max_storage_pct,
              "highest_storage_stream": highest_storage_stream,
              "summary": summary_text,
              "critical_count": len(critical_breaches),
              "warning_count": len(warning_breaches),
              "metrics_manifest": manifest
          }
      }) + "::")

  - id: record_audit_to_kv
    type: io.kestra.plugin.core.kv.Set
    description: "Record current evaluation manifest to Kestra KV for historical drift tracking."
    key: "nats_jetstream_audit_{{ inputs.stream_filter != '' ? inputs.stream_filter : 'all' }}"
    kvType: JSON
    value: "{{ outputs.analyze_consumer_lag_and_retention.vars.metrics_manifest | toJson }}"

  - id: evaluate_sentinel_status
    type: io.kestra.plugin.core.flow.If
    description: "Branch execution based on sentinel evaluation verdict."
    condition: "{{ outputs.analyze_consumer_lag_and_retention.vars.status != 'OK' }}"
    then:
      - id: notify_slack_breach
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: "Post structured alert to Slack on consumer lag or storage threshold breaches."
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "{{ inputs.slack_channel }}",
            "attachments": [
              {
                "color": "{{ outputs.analyze_consumer_lag_and_retention.vars.is_critical ? 'danger' : 'warning' }}",
                "title": "🚨 NATS JetStream Sentinel: {{ outputs.analyze_consumer_lag_and_retention.vars.status }} Alert",
                "text": "*{{ outputs.analyze_consumer_lag_and_retention.vars.summary }}*\n\n*Highest Consumer Lag:* `{{ outputs.analyze_consumer_lag_and_retention.vars.highest_lag_consumer }}` on stream `{{ outputs.analyze_consumer_lag_and_retention.vars.highest_lag_stream }}` ({{ outputs.analyze_consumer_lag_and_retention.vars.max_consumer_lag }} msgs)\n*Highest Storage Utilization:* `{{ outputs.analyze_consumer_lag_and_retention.vars.highest_storage_stream }}` ({{ outputs.analyze_consumer_lag_and_retention.vars.max_storage_pct }}% of max_bytes)\n*Execution ID:* `{{ execution.id }}`",
                "footer": "Kestra NATS JetStream Sentinel • company.messaging"
              }
            ]
          }

      - id: check_scaling_action
        type: io.kestra.plugin.core.flow.If
        description: "Invoke autoscaling webhook if consumer lag is critical and scaling endpoint is configured."
        condition: "{{ outputs.analyze_consumer_lag_and_retention.vars.is_critical and inputs.scaling_webhook_url != '' }}"
        then:
          - id: trigger_worker_autoscaling
            type: io.kestra.plugin.core.http.Request
            description: "POST scaling trigger to autoscale consumer worker replicas."
            method: POST
            uri: "{{ inputs.scaling_webhook_url }}"
            contentType: application/json
            body: |
              {
                "action": "scale_up",
                "stream": "{{ outputs.analyze_consumer_lag_and_retention.vars.highest_lag_stream }}",
                "consumer": "{{ outputs.analyze_consumer_lag_and_retention.vars.highest_lag_consumer }}",
                "lag": {{ outputs.analyze_consumer_lag_and_retention.vars.max_consumer_lag }},
                "execution_id": "{{ execution.id }}",
                "source": "kestra-nats-sentinel"
              }

      - id: check_fail_action
        type: io.kestra.plugin.core.flow.If
        description: "Gate pipeline failure if critical threshold was breached and fail_on_critical is enabled."
        condition: "{{ outputs.analyze_consumer_lag_and_retention.vars.is_critical and inputs.fail_on_critical }}"
        then:
          - id: fail_on_critical_breach
            type: io.kestra.plugin.core.execution.Fail
            description: "Emit pipeline failure for downstream monitoring and incident management."
            errorMessage: "NATS JetStream Sentinel CRITICAL breach: {{ outputs.analyze_consumer_lag_and_retention.vars.summary }}"
    else:
      - id: log_healthy_state
        type: io.kestra.plugin.core.log.Log
        description: "Log nominal confirmation when lag and storage are within safe margins."
        message: "NATS JetStream health check PASSED: {{ outputs.analyze_consumer_lag_and_retention.vars.summary }}"

errors:
  - id: alert_sentinel_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: "Alert on flow failure, such as unreachable NATS monitoring endpoint."
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "{{ inputs.slack_channel }}",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ NATS JetStream Sentinel Execution Failure",
            "text": "Failed to query or evaluate NATS JetStream telemetry at `{{ inputs.nats_monitoring_url }}`. Verify NATS server reachability and monitoring endpoint configuration.",
            "footer": "Kestra Workflow Failure Sentinel • Execution {{ execution.id }}"
          }
        ]
      }

triggers:
  - id: periodic_audit_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    description: "Periodically audit NATS JetStream consumer lag and retention every 15 minutes."
    cron: "*/15 * * * *"
    disabled: true

  - id: webhook_audit_trigger
    type: io.kestra.plugin.core.trigger.Webhook
    description: "Run on-demand NATS audit triggered by CI/CD deployment or event bridge webhook."
    key: "{{ secret('NATS_SENTINEL_WEBHOOK_KEY') }}"

outputs:
  - id: status
    type: STRING
    value: "{{ outputs.analyze_consumer_lag_and_retention.vars.status }}"
  - id: is_critical
    type: BOOL
    value: "{{ outputs.analyze_consumer_lag_and_retention.vars.is_critical }}"
  - id: max_consumer_lag
    type: INT
    value: "{{ outputs.analyze_consumer_lag_and_retention.vars.max_consumer_lag }}"
  - id: max_storage_pct
    type: FLOAT
    value: "{{ outputs.analyze_consumer_lag_and_retention.vars.max_storage_pct }}"
  - id: total_streams_checked
    type: INT
    value: "{{ outputs.analyze_consumer_lag_and_retention.vars.total_streams_checked }}"
  - id: total_consumers_checked
    type: INT
    value: "{{ outputs.analyze_consumer_lag_and_retention.vars.total_consumers_checked }}"
  - id: summary
    type: STRING
    value: "{{ outputs.analyze_consumer_lag_and_retention.vars.summary }}"

extend:
  title: NATS JetStream Consumer Lag and Stream Retention Sentinel
  metaTitle: NATS JetStream Consumer Lag & Stream Retention Sentinel | Kestra
  shortDescription: Monitor NATS JetStream consumer lag and stream storage limits via HTTP monitoring, alerting Slack, scaling consumers, and tracking drift in KV.
  metaDescription: Audit NATS JetStream consumer lag and storage retention limits. Alert on backpressure, auto-scale workers, and track historical drift in Kestra KV.
  description: |
    Continuous audit and proactive guardrails for NATS JetStream streams and consumers
    using the native NATS HTTP monitoring API (`/jsz`).

    ## How it works
    1. **Query Telemetry**: `fetch_jetstream_telemetry` (`io.kestra.plugin.core.http.Request`)
       connects to the NATS server monitoring endpoint (`/jsz?streams=true&consumers=true&config=true`)
       with exponential retry to pull live stream storage and consumer delivery state.
    2. **Evaluate Lag & Headroom**: `analyze_consumer_lag_and_retention`
       (`io.kestra.plugin.scripts.python.Script`) traverses streams and consumer details,
       extracting unprocessed message backlog (`num_pending`), unacknowledged in-flight
       messages (`num_ack_pending`), and storage consumption against `max_bytes`.
       It compares metrics against warning and critical thresholds and tracks drift
       against previous audit runs.
    3. **Record Historical State**: `record_audit_to_kv` (`io.kestra.plugin.core.kv.Set`)
       persists the latest telemetry manifest in Kestra KV store, enabling trend
       analysis and drift tracking across executions without an external database.
    4. **Evaluate & Remediate**: `evaluate_sentinel_status` (`io.kestra.plugin.core.flow.If`)
       routes on severity:
       - **Clean Runs**: Logs nominal health metrics.
       - **Threshold Breaches**: Delivers structured Slack alerts (`io.kestra.plugin.slack.notifications.SlackIncomingWebhook`)
         detailing offending stream names, consumer names, and exact metric counts.
       - **Critical Lag Remediation**: Optionally triggers horizontal autoscaling hooks
         (`io.kestra.plugin.core.http.Request`) to scale worker pods, and gates pipeline
         failure (`io.kestra.plugin.core.execution.Fail`) if configured.

    ## What you get
    - Real-time consumer backpressure visibility (`num_pending` and `num_ack_pending`).
    - Stream retention headroom monitoring against configured `max_bytes` ceilings.
    - Historical drift detection between consecutive runs stored in Kestra KV.
    - Actionable incident notification delivered to Slack with root-cause attribution.
    - Automated horizontal worker autoscaling invocation hook.

    ## Who it's for
    - SREs, Platform Engineers, and Event-Driven Architects managing NATS JetStream clusters.
    - Data platform teams running microservice consumers that process streaming events.

    ## Why orchestrate this with Kestra
    - **Agentless Monitoring**: Queries the built-in NATS HTTP monitoring endpoint directly
      without requiring custom agent daemons or external scrape collectors.
    - **Native KV Statefulness**: Retains historical metrics directly in Kestra KV to detect
      lag drift and rapid backpressure growth across recurring audits.
    - **Closed-Loop Automation**: Combines metric inspection, alerting, autoscaling triggers,
      and pipeline failure gating in one declarative workflow.

    ## Prerequisites
    - NATS Server with JetStream enabled (`-js`) and HTTP monitoring enabled (`-m 8222` or `http_port: 8222`).
    - Network reachability from Kestra to the NATS monitoring port.
    - Slack Incoming Webhook configured for notifications.

    ### Secrets
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL for alerting on threshold breaches.
    - `NATS_SENTINEL_WEBHOOK_KEY`: Secret key securing the on-demand webhook trigger.

    ## Quick start
    1. Configure `SLACK_WEBHOOK_URL` in your Kestra namespace secrets.
    2. Set `nats_monitoring_url` to your NATS monitoring endpoint (e.g., `http://nats.internal:8222`).
    3. Configure `lag_warning_threshold` (default `1000`), `lag_critical_threshold` (default `5000`),
       and `storage_critical_percent` (default `95.0`) according to your processing SLAs.
    4. Run an initial manual execution to verify telemetry ingestion and KV persistence.
    5. Enable `periodic_audit_schedule` for continuous 15-minute background auditing.

    ## How to extend
    - Connect `scaling_webhook_url` to a Kubernetes HPA or cloud autoscaling group to automatically
      scale out worker replicas upon critical backpressure.
    - Add automated consumer recreation or purge tasks via NATS JetStream management subjects
      (`$JS.API.CONSUMER.INFO`, `$JS.API.CONSUMER.DURABLE.CREATE`) to unblock wedged workers.
    - Scope checks to specific multi-tenant accounts by appending `&acc=<account_name>` to the monitoring URI.

    ## Links
    - [NATS JetStream Monitoring](https://docs.nats.io/running-a-nats-service/nats-admin/monitoring)
    - [NATS JetStream Concepts](https://docs.nats.io/nats-concepts/jetstream)
    - [Kestra HTTP Request Plugin](https://kestra.io/plugins/plugin-core/io.kestra.plugin.core.http.request)
    - [Kestra Key-Value Store](https://kestra.io/docs/developer-guide/kv-store)
    - [Kestra Slack Notification Plugin](https://kestra.io/plugins/plugin-slack/io.kestra.plugin.slack.notifications.slackincomingwebhook)
  tags:
    - Infrastructure
    - Data
  subTags:
    - Monitoring & Alerting
    - Realtime & Streaming
  ee: false
  demo: false
