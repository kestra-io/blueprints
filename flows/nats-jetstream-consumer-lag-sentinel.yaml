id: nats-jetstream-consumer-lag-sentinel
namespace: company.team

inputs:
  - id: nats_url
    type: STRING
    displayName: NATS Server URL
    description: Connection URL for the NATS server cluster.
    defaults: "nats://localhost:4222"

  - id: subject
    type: STRING
    displayName: JetStream Subject
    description: Target JetStream subject pattern to sample unacknowledged consumer lag from.
    defaults: "orders.processed.>"

  - id: durable_id
    type: STRING
    displayName: Durable Consumer Name
    description: Durable consumer group identifier used to track stream position.
    defaults: "kestra-lag-probe"

  - id: poll_duration
    type: STRING
    displayName: Poll Duration (ISO-8601)
    description: Maximum poll duration before concluding sample window.
    defaults: "PT3S"

  - id: batch_size
    type: INT
    displayName: Batch Fetch Size
    description: Maximum number of messages to pull during sampling probe.
    defaults: 100

  - id: warning_lag_threshold
    type: INT
    displayName: Warning Lag Threshold
    description: Backlog threshold that triggers elevated advisory logging.
    defaults: 20

  - id: critical_lag_threshold
    type: INT
    displayName: Critical Lag Threshold
    description: Backlog threshold that triggers critical Slack alerting and optional remediation.
    defaults: 50

  - id: auto_remediate
    type: BOOLEAN
    displayName: Enable Dead-Letter Quarantine
    description: When true, publishes a remediation control message to a designated dead-letter subject upon critical lag.
    defaults: false

  - id: dead_letter_subject
    type: STRING
    displayName: Dead-Letter Subject
    description: Target subject for quarantine control signal dispatch.
    defaults: "orders.dlq"

triggers:
  - id: consumer_lag_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    description: Scheduled probe to detect JetStream consumer stalls every 6 hours.
    cron: "0 */6 * * *"
    disabled: true

tasks:
  - id: probe_consumer_lag
    type: io.kestra.plugin.nats.core.Consume
    description: Sample unacknowledged messages from NATS JetStream durable consumer.
    url: "{{ inputs.nats_url }}"
    subject: "{{ inputs.subject }}"
    durableId: "{{ inputs.durable_id }}"
    pollDuration: "{{ inputs.poll_duration }}"
    batchSize: "{{ inputs.batch_size }}"

  - id: classify_lag_severity
    type: io.kestra.plugin.core.log.Log
    description: Classify sampled consumer lag against configured warning and critical thresholds.
    message: |
      Sampled NATS JetStream messages: {{ outputs.probe_consumer_lag.messagesCount ?? 0 }}
      Classification: {{ (outputs.probe_consumer_lag.messagesCount ?? 0) >= inputs.critical_lag_threshold ? 'CRITICAL' : ((outputs.probe_consumer_lag.messagesCount ?? 0) >= inputs.warning_lag_threshold ? 'WARNING' : 'HEALTHY') }}

  - id: evaluate_lag_state
    type: io.kestra.plugin.core.flow.Switch
    description: Route execution path based on evaluated JetStream consumer lag severity.
    value: "{{ (outputs.probe_consumer_lag.messagesCount ?? 0) >= inputs.critical_lag_threshold ? 'CRITICAL' : ((outputs.probe_consumer_lag.messagesCount ?? 0) >= inputs.warning_lag_threshold ? 'WARNING' : 'HEALTHY') }}"
    cases:
      HEALTHY:
        - id: log_healthy
          type: io.kestra.plugin.core.log.Log
          description: Log confirmed healthy consumer lag within normal operational boundaries.
          message: "HEALTHY: NATS JetStream consumer '{{ inputs.durable_id }}' lag ({{ outputs.probe_consumer_lag.messagesCount ?? 0 }} messages) is below warning threshold ({{ inputs.warning_lag_threshold }})."

      WARNING:
        - id: log_warning
          type: io.kestra.plugin.core.log.Log
          description: Log elevated consumer lag advisory requiring engineering awareness.
          message: "WARNING: NATS JetStream consumer '{{ inputs.durable_id }}' elevated lag ({{ outputs.probe_consumer_lag.messagesCount ?? 0 }} messages) exceeded warning threshold ({{ inputs.warning_lag_threshold }})."

      CRITICAL:
        - id: alert_slack_critical
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: Dispatch high-priority alert to on-call channel with lag metrics and execution context.
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "text": ":rotating_light: *CRITICAL NATS JetStream Consumer Lag Alert*\n*Durable:* `{{ inputs.durable_id }}`\n*Subject:* `{{ inputs.subject }}`\n*Sampled Lag:* `{{ outputs.probe_consumer_lag.messagesCount ?? 0 }}` messages (Threshold: `{{ inputs.critical_lag_threshold }}`)\n*Execution:* <{{ flow.url }}|{{ execution.id }}>"
            }

        - id: remediation_branch
          type: io.kestra.plugin.core.flow.If
          description: Trigger safe automated dead-letter control message publication if auto-remediation is enabled.
          condition: "{{ inputs.auto_remediate }}"
          then:
            - id: publish_dlq_notification
              type: io.kestra.plugin.nats.core.Produce
              description: Publish a control signal to the dead-letter subject to initiate downstream consumer scaling or drain.
              url: "{{ inputs.nats_url }}"
              subject: "{{ inputs.dead_letter_subject }}"
              from:
                - data: "{\"action\": \"DRAIN_BACKLOG\", \"durableId\": \"{{ inputs.durable_id }}\", \"lag\": {{ outputs.probe_consumer_lag.messagesCount ?? 0 }}, \"timestamp\": \"{{ now() }}\"}"

  - id: final_audit_log
    type: io.kestra.plugin.core.log.Log
    description: Record immutable execution audit trail across all sentinel evaluations.
    message: |
      [AUDIT] NATS JetStream Sentinel completed.
      Subject: {{ inputs.subject }} | Durable: {{ inputs.durable_id }}
      Sampled Messages: {{ outputs.probe_consumer_lag.messagesCount ?? 0 }}
      Classification: {{ (outputs.probe_consumer_lag.messagesCount ?? 0) >= inputs.critical_lag_threshold ? 'CRITICAL' : ((outputs.probe_consumer_lag.messagesCount ?? 0) >= inputs.warning_lag_threshold ? 'WARNING' : 'HEALTHY') }}
      Auto-Remediate: {{ inputs.auto_remediate }}

extend:
  title: NATS JetStream Consumer Lag and Backlog Sentinel
  metaTitle: NATS JetStream Consumer Lag Sentinel | Kestra
  shortDescription: Monitor NATS JetStream consumer lag, classify backlog severity, and trigger Slack alerts or dead-letter remediation.
  metaDescription: Monitor NATS JetStream consumer lag with Kestra, classify backlog severity, trigger Slack alerts, and publish remediation signals to prevent message stalls.
  description: |
    Automated Day 2 Operations sentinel that probes NATS JetStream durable consumers on a regular schedule to sample unacknowledged backlog accumulation, classify severity, alert engineering channels on threshold breaches, and publish quarantine control signals.

    ## How it works

    1. A schedule trigger activates every six hours to initiate the consumer lag audit across configured subjects.
    2. The `io.kestra.plugin.nats.core.Consume` task binds to the designated durable consumer and samples available unacknowledged messages within the bounded poll duration.
    3. A Pebble classification expression evaluates the sampled message count against warning and critical thresholds to assign an operational status (`HEALTHY`, `WARNING`, or `CRITICAL`).
    4. A `Switch` flow control task branches based on the evaluated status:
       - `HEALTHY`: Emits an informational log confirming consumer group latency is within acceptable tolerance.
       - `WARNING`: Records an advisory warning log for engineering review before backlogs cascade.
       - `CRITICAL`: Dispatches a formatted Slack incident alert via webhook, and optionally publishes a dead-letter drain control payload via `io.kestra.plugin.nats.core.Produce` when auto-remediation is enabled.
    5. An unconditional final audit task logs the comprehensive execution verdict and sampled metrics to Kestra's execution history.

    ## What you get

    - Automated recurring detection of stalled or backlogged NATS JetStream consumers before downstream SLA breaches occur.
    - Zero-footprint sampling using native JetStream durable consumer subscriptions without needing external metric exporters.
    - Tiered severity classification separating normal bursts from critical processing stalls.
    - Direct Slack notifications routing engineers straight to the afflicted stream subject and durable consumer ID.
    - Safe optional dead-letter signal dispatch to trigger auto-scaling or backlog drain pipelines.
    - An immutable execution audit trail capturing historical consumer lag trends over time.

    ## Who it's for

    - Platform Engineers maintaining distributed messaging backbones and microservices clusters.
    - Site Reliability Engineers responsible for event streaming health and processing latency SLAs.
    - Data Engineers running real-time streaming pipelines that consume from NATS JetStream streams.

    ## Why orchestrate this with Kestra

    - Declarative YAML eliminates fragile custom Python cron scripts and unmaintained custom monitoring daemons.
    - Out-of-the-box secret masking ensures credentials and webhook tokens remain secure in compliance audits.
    - Native branching and condition evaluation allow combining health checks, incident alerting, and remediation in one cohesive workflow.
    - Unified execution timeline and logging provide instant root-cause diagnostics when investigating message processing delays.

    ## Prerequisites

    - A running NATS server (version 2.2 or higher) with JetStream enabled (`-js` flag).
    - An existing JetStream stream bound to the target subject pattern.
    - Network reachability between Kestra workers and the NATS server port (default 4222).

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL used to transmit critical consumer lag alerts (required when critical alerts fire).

    ## Quick start

    1. Configure the `SLACK_WEBHOOK_URL` secret within your Kestra namespace or environment variables.
    2. Import this blueprint into your Kestra instance under `company.team`.
    3. Run a manual execution with default inputs against your local or development NATS broker (`nats://localhost:4222`).
    4. Verify the probe output in the execution logs and activate the `consumer_lag_schedule` trigger for continuous monitoring.

    ## How to extend

    - Add PagerDuty or Opsgenie alert tasks within the `CRITICAL` branch for high-priority on-call paging during off-hours.
    - Introduce Kubernetes pod restart or HPA scale-up tasks in the remediation block to dynamically add consumer replicas when lag spikes.
    - Export sampled lag counts to Prometheus or OpenSearch for long-term capacity planning and streaming SLO dashboards.

    ## Links

    - [Kestra NATS Plugin Documentation](https://kestra.io/plugins/plugin-nats)
    - [NATS JetStream Documentation](https://docs.nats.io/nats-concepts/jetstream)
    - [NATS JetStream Consumers Guide](https://docs.nats.io/nats-concepts/jetstream/consumers)
  tags:
    - Infrastructure
  subTags:
    - Day 2 Operations
    - Monitoring & Alerting
  ee: false
  demo: false
