id: kubernetes-daemonset-scheduling-deficit-sentinel
namespace: company.sre

description: |
  Audits Kubernetes DaemonSets cluster-wide via Kubernetes API, identifies scheduling
  deficits where desired pods do not match current scheduled/ready nodes, creates an
  automated GitHub SRE incident ticket, and alerts Slack.

inputs:
  - id: namespace
    type: STRING
    displayName: Kubernetes Namespace Filter
    defaults: ""

  - id: target_repository
    type: STRING
    displayName: Target Infrastructure Repository
    defaults: my-org/kubernetes-cluster-operations

triggers:
  - id: periodic_daemonset_check
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

tasks:
  - id: probe_daemonset_status
    type: io.kestra.plugin.scripts.python.Script
    description: Interrogates Kubernetes AppsV1 API for DaemonSets with desiredNumberScheduled != numberReady
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install kubernetes kestra
    script: |
      import os
      from kubernetes import client, config
      from kestra import Kestra

      ns = "{{ inputs.namespace }}"

      try:
          config.load_incluster_config()
      except Exception:
          try:
              config.load_kube_config()
          except Exception as e:
              print(f"Kube config error: {e}")

      apps_api = client.AppsV1Api()

      try:
          if ns:
              ds_list = apps_api.list_namespaced_daemon_set(namespace=ns)
          else:
              ds_list = apps_api.list_daemon_set_for_all_namespaces()
      except Exception as err:
          print(f"Failed to list DaemonSets: {err}")
          ds_list = type("obj", (object,), {"items": []})

      degraded_daemonsets = []
      total_inspected = 0

      for ds in ds_list.items:
          total_inspected += 1
          name = ds.metadata.name
          ds_ns = ds.metadata.namespace
          status = ds.status

          desired = status.desired_number_scheduled or 0
          ready = status.number_ready or 0
          unavailable = status.number_unavailable or 0

          # Deficit occurs if desired > ready or unavailable > 0
          if desired > ready or unavailable > 0:
              degraded_daemonsets.append({
                  "namespace": ds_ns,
                  "name": name,
                  "desired": desired,
                  "ready": ready,
                  "unavailable": unavailable
              })

      deficit_count = len(degraded_daemonsets)
      print(f"Total DaemonSets: {total_inspected}, Degraded with deficit: {deficit_count}")

      Kestra.outputs({
          "total_inspected": total_inspected,
          "deficit_count": deficit_count,
          "has_deficit": deficit_count > 0,
          "degraded_daemonsets": degraded_daemonsets
      })

  - id: branch_on_deficit
    type: io.kestra.plugin.core.flow.If
    description: Branches based on whether any DaemonSets have scheduling deficits
    condition: "{{ outputs.probe_daemonset_status.vars.has_deficit == true }}"
    then:
      - id: create_daemonset_incident_issue
        type: io.kestra.plugin.github.issues.Create
        description: Logs a prioritized GitHub issue tracking DaemonSet scheduling deficits
        oauthToken: "{{ secret('GITHUB_TOKEN') }}"
        repository: "{{ inputs.target_repository }}"
        title: "[Kubernetes Alert] DaemonSet Scheduling Deficit Detected ({{ outputs.probe_daemonset_status.vars.deficit_count }} DaemonSets Impacted)"
        body: |
          ## 🚨 Kubernetes DaemonSet Scheduling Deficit

          The cluster monitoring sentinel detected **{{ outputs.probe_daemonset_status.vars.deficit_count }}** DaemonSets where desired pod count exceeds ready nodes.

          ### Impacted DaemonSets:
          {% for ds in outputs.probe_daemonset_status.vars.degraded_daemonsets %}
          - **Namespace:** `{{ ds.namespace }}` - **Name:** `{{ ds.name }}` $\rightarrow$ Desired: `{{ ds.desired }}`, Ready: `{{ ds.ready }}`, Unavailable: `{{ ds.unavailable }}`
          {% endfor %}

          Please verify node taints, tolerations, and daemon resource limits.
          *Generated automatically by Kestra Kubernetes DaemonSet Sentinel.*

      - id: alert_sre_slack
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Alerts SRE team on Slack with deficit details and GitHub ticket hyperlink
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {{ {
            "text": "🚨 *Kubernetes DaemonSet Scheduling Deficit Detected*\n*Impacted DaemonSets:* *" ~ outputs.probe_daemonset_status.vars.deficit_count ~ "*\n*Incident Ticket:* <" ~ (outputs.create_daemonset_incident_issue.issueUrl ?? "#") ~ "|View GitHub Issue>"
          } | toJson }}

    else:
      - id: log_fleet_healthy
        type: io.kestra.plugin.core.log.Log
        message: "All {{ outputs.probe_daemonset_status.vars.total_inspected }} Kubernetes DaemonSets are fully scheduled and ready across nodes."

  - id: log_audit_complete
    type: io.kestra.plugin.core.log.Log
    description: Final audit status log recording DaemonSet health
    message: "DaemonSet audit complete. Deficit count: {{ outputs.probe_daemonset_status.vars.deficit_count }}."

errors:
  - id: alert_flow_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alerts Slack when Kubernetes API queries fail
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {{ {
        "text": "⚠️ *Kubernetes DaemonSet Sentinel Failed* in execution `" ~ execution.id ~ "`."
      } | toJson }}

extend:
  title: "Kubernetes DaemonSet Node Scheduling Deficit Sentinel"
  shortDescription: "Audit Kubernetes DaemonSets cluster-wide, detect unready node coverage deficits, file GitHub issues, and alert Slack."
  metaTitle: "Kubernetes DaemonSet Scheduling Deficit Sentinel with Kestra"
  metaDescription: "Monitor Kubernetes DaemonSet scheduling and node coverage with Kestra. Query AppsV1 API, open GitHub incident issues, and alert SRE on Slack."
  description: |
    Kubernetes DaemonSets ensure that an essential system agent—such as a CNI networking plugin, log collector (FluentBit, Datadog), or security monitor (Falco)—runs on every worker node across the cluster. When worker nodes run out of schedulable CPU/memory, have untolerated taints, or fail image pull secrets, the DaemonSet enters a scheduling deficit where `desiredNumberScheduled` exceeds `numberReady`. Nodes without running security or logging daemons create blind spots and network partition risks. This blueprint inspects Kubernetes DaemonSets cluster-wide, flags unready node deficits, opens a prioritized GitHub SRE incident ticket, and alerts operations engineers on Slack.

    ## How it works

    1. `periodic_daemonset_check` (`io.kestra.plugin.core.trigger.Schedule`) initiates the audit every 15 minutes (shipped disabled for safe verification).
    2. `probe_daemonset_status` (`io.kestra.plugin.scripts.python.Script`) uses the official Kubernetes Python SDK to read DaemonSet status objects across all namespaces.
    3. `branch_on_deficit` (`io.kestra.plugin.core.flow.If`) evaluates whether any DaemonSets have `desired > ready` or `unavailable > 0`:
       - `then`: Automatically files a GitHub tracking issue via `create_daemonset_incident_issue` (`io.kestra.plugin.github.issues.Create`) and alerts the Slack channel via `alert_sre_slack` (`io.kestra.plugin.slack.notifications.SlackIncomingWebhook`).
       - `else`: Emits an informational log entry (`log_fleet_healthy`) confirming full node coverage.
    4. `log_audit_complete` (`io.kestra.plugin.core.log.Log`) records the audit outcome.
    5. The `errors` block alerts Slack if cluster authentication or network connectivity fails.

    ## What you get

    - Automated, scheduled auditing of Kubernetes infrastructure daemons.
    - Zero silent node coverage gaps for critical security and monitoring agents.
    - Consolidated GitHub incident tickets with namespace names, desired counts, and unavailable numbers.
    - Real-time Slack notifications with direct ticket hyperlinks.

    ## Who it's for

    - Platform Engineers and Kubernetes Administrators managing production clusters.
    - Site Reliability Engineers ensuring consistent agent coverage across worker fleets.
    - Security Engineers verifying runtime protection agent distribution.

    ## Why orchestrate this with Kestra

    Kestra coordinates cluster API communication, multi-daemon health comparison, conditional escalation, and chat alerting in a single declarative workflow. It manages kubeconfig credentials securely, provides complete execution history, and eliminates the need for separate standalone monitoring daemons.

    ## Prerequisites

    - A Kubernetes cluster (EKS, GKE, AKS, or bare-metal).
    - A ServiceAccount, kubeconfig, or IAM role with read permissions on `daemonsets`.
    - A GitHub Personal Access Token with repository issue creation permissions.
    - A Slack incoming webhook URL for notifications.

    ### Secrets

    - `KUBECONFIG` (or in-cluster ServiceAccount): Authentication credentials for Kubernetes API.
    - `GITHUB_TOKEN`: GitHub token used to open incident issues.
    - `SLACK_WEBHOOK`: Incoming Webhook URL for cluster alerts.

    ## Inputs

    - `namespace` (STRING, default `""`): Optional namespace filter (leave empty to scan cluster-wide).
    - `target_repository` (STRING, default `my-org/kubernetes-cluster-operations`): Target GitHub repository for logging incident issues.

    ## Outputs

    - `outputs.probe_daemonset_status.vars.total_inspected`: Total number of DaemonSets audited.
    - `outputs.probe_daemonset_status.vars.deficit_count`: Count of DaemonSets experiencing scheduling deficits.
    - `outputs.probe_daemonset_status.vars.degraded_daemonsets`: List of degraded DaemonSet objects (`namespace`, `name`, `desired`, `ready`, `unavailable`).

    ## Quick start

    1. Configure `GITHUB_TOKEN` and `SLACK_WEBHOOK` in your Kestra namespace.
    2. Import this flow and set `target_repository` to match your operations tracker.
    3. Run the flow manually to verify DaemonSet status extraction and Slack notification delivery.
    4. Enable the `periodic_daemonset_check` trigger for continuous scheduling health monitoring.

    ## How to extend

    - Add an automated node drain or uncordon task to clear blocked nodes.
    - Filter DaemonSets by critical labels (e.g., `k8s-app=kube-dns`) to prioritize networking components.
    - Route urgent alerts to PagerDuty or Opsgenie if system-critical DaemonSets drop below 80% node coverage.

    ## Links

    - [Kubernetes DaemonSet Documentation](https://kubernetes.io/docs/concepts/workloads/controllers/daemonset/)
    - [Kestra Python Script Plugin](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra GitHub Plugin](https://kestra.io/plugins/plugin-github)
    - [Kestra Slack Plugin](https://kestra.io/plugins/plugin-slack)

  tags:
    - Infrastructure
    - Cloud
  subTags:
    - Monitoring & Alerting
  ee: false
  demo: false
