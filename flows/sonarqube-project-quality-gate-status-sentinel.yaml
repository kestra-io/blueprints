id: sonarqube-project-quality-gate-status-sentinel
namespace: company.ci

inputs:
  - id: sonarqube_url
    type: STRING
    defaults: "http://sonarqube.internal:9000"
    description: Base URL of SonarQube instance.
  - id: project_key
    type: STRING
    description: SonarQube project unique key.

tasks:
  - id: query_quality_gate
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install requests kestra
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    env:
      SONAR_URL: "{{ inputs.sonarqube_url }}"
      PROJECT_KEY: "{{ inputs.project_key }}"
      SONAR_TOKEN: "{{ secret('SONAR_TOKEN') }}"
    script: |
      import os
      import sys
      import requests
      from kestra import Kestra

      sonar_url = os.environ.get("SONAR_URL", "").rstrip("/")
      project_key = os.environ.get("PROJECT_KEY", "")
      sonar_token = os.environ.get("SONAR_TOKEN", "")

      if not sonar_url or not project_key:
          print("Error: SONAR_URL and PROJECT_KEY are required", file=sys.stderr)
          sys.exit(1)

      url = f"{sonar_url}/api/qualitygates/project_status?projectKey={project_key}"
      auth = (sonar_token, "") if sonar_token else None

      try:
          resp = requests.get(url, auth=auth, timeout=15)
          resp.raise_for_status()
          data = resp.json()
          project_status = data.get("projectStatus", {})
          status = project_status.get("status", "UNKNOWN")
          conditions = project_status.get("conditions", [])
          failed_conditions = len([c for c in conditions if c.get("status") != "OK"])
      except Exception as exc:
          print(f"Failed to query SonarQube quality gate: {exc}", file=sys.stderr)
          sys.exit(1)

      print(f"SonarQube Project {project_key}: status={status}, failed_conditions={failed_conditions}")

      Kestra.outputs({
          "status": status,
          "failed_conditions": failed_conditions
      })

  - id: evaluate_quality_status
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.query_quality_gate.vars.status != 'OK' }}"
    then:
      - id: notify_dev_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#ci-builds",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 SonarQube Quality Gate FAILED Alert",
                "text": "Project `{{ inputs.project_key }}` failed its SonarQube Quality Gate with status *{{ outputs.query_quality_gate.vars.status }}* ({{ outputs.query_quality_gate.vars.failed_conditions }} failed condition(s))! Security hotspots, bugs, or code coverage dropped below release criteria.",
                "footer": "Kestra CI Sentinel • SonarQube"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#ci-builds",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ SonarQube Sentinel Failure",
            "text": "Failed to query SonarQube API. Verify SonarQube URL and authentication token.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

outputs:
  - id: status
    type: STRING
    value: "{{ outputs.query_quality_gate.vars.status }}"
  - id: failed_conditions
    type: INT
    value: "{{ outputs.query_quality_gate.vars.failed_conditions }}"

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 8 * * 1-5"
    disabled: true

extend:
  metaDescription: "Audits SonarQube project quality gate status to catch code smells, security vulnerabilities, and coverage regressions."
  metaTitle: SonarQube Code Quality Gate and Security Hotspot Sentinel with Kestra
  title: SonarQube Code Quality Gate and Security Hotspot Sentinel
  shortDescription: Audits SonarQube project quality gate status to catch code smells, security vulnerabilities, and coverage regressions.
  description: |
    ## How it works
    This workflow connects to the SonarQube Web API (`/api/qualitygates/project_status`) using an API token to audit whether code branches meet release readiness quality gates. SonarQube assesses test coverage percentages, duplicated code blocks, security hotspots, and blocker bugs. When code changes violate organizational standards (`status == "ERROR"`), merging or releasing the build threatens software reliability. This workflow evaluates status and notifies engineering teams immediately upon failure.

    ## What you get
    - Real-time audit of SonarQube quality gate compliance.
    - Prevents shipping security regressions and untested code to production.
    - Actionable visibility into failed quality conditions.

    ## Who it's for
    - Engineering Managers and Lead Software Architects enforcing code standards.
    - CI/CD Engineers managing automated release pipelines.

    ## Why orchestrate this with Kestra
    - **Native Quality Gate Integration**: Coordinate code scans as pre-conditions before deployment workflows.
    - **Scheduled Code Auditing**: Periodically inspect master/main branches to catch drift.
    - **Direct Slack Alerts**: Notify team channels immediately when gates fail.

    ## Prerequisites
    - SonarQube instance with user or project analysis token.
    - Secrets `SONAR_TOKEN` and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import the blueprint.
    2. Input SonarQube URL and project key.
    3. Run the workflow to inspect current quality status.

    ## How to extend
    - Print the specific failing metric (e.g. `coverage < 80%`) in the Slack message body.
    - Block downstream deployment executions automatically if quality gate fails.

    ## Links
    - [SonarQube Web API Reference](https://docs.sonarsource.com/sonarqube/latest/extension-guide/web-api/)
    - [Kestra Documentation](https://kestra.io/docs)
  tags:
    - Business
    - Infrastructure
  subTags:
    - Testing & Quality
    - HR & Ops Automation
  ee: false
  demo: false
