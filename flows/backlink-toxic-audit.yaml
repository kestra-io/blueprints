id: backlink-toxic-audit
namespace: company.team
description: |
  Score every newly discovered backlink against the toxicity signals that
  precede ranking damage - spam engine scores, sitewide links, anchors built
  only from commercial money terms, and IP C-classes shared by three or more
  referring rows - so SEO leads can disavow the damage before a refresh picks
  it up. The flow runs from a webhook the moment a backlink export lands, with
  a disabled weekly schedule as the fallback net, stages the export, scores it
  in Python, and when any domain reaches the point threshold it appends
  disavow lines, opens one GitHub issue per domain, and alerts Slack; a clean
  export is logged as a clean sweep. Verdict, toxic count, ranked domains, and
  rows checked are published as outputs.

triggers:
  - id: on_backlink_export
    type: io.kestra.plugin.core.trigger.Webhook
    description: The crawler or link index POSTs here the moment a fresh backlink export is written, so the audit runs while the links are still new enough to disavow.
    key: "{{ secret('BACKLINK_EXPORT_WEBHOOK_KEY') }}"
  - id: weekly_backlink_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: Weekly Monday 06:00 UTC sweep of the standing export as a fallback net, shipped disabled until the webhook path is trusted in your environment.
    cron: "0 6 * * 1"
    disabled: true

inputs:
  - id: toxicity_threshold
    type: INT
    defaults: 3
    description: Minimum points a backlink must accumulate before its domain counts as toxic and enters the disavow queue.
  - id: export_path
    type: STRING
    defaults: backlinks.csv
    description: Path of the backlink export inside the working directory, the file the webhook points at, with the bundled fixture staged there when no export has landed.

tasks:
  # --- 1. stage and score the export ---
  - id: audit_workspace
    type: io.kestra.plugin.core.flow.WorkingDirectory
    description: One shared directory so the staged export, the scoring pass, the disavow file, and the summary all read and write the same rows.
    tasks:
      - id: stage_backlink_export
        type: io.kestra.plugin.scripts.shell.Commands
        description: Write a ten row backlink export with a heredoc and copy it to the requested export path when no fresh export has landed, so the scorer always has a CSV to read.
        taskRunner:
          type: io.kestra.plugin.scripts.runner.docker.Docker
          entryPoint: []
        containerImage: alpine:3.20
        env:
          EXPORT_PATH: "{{ inputs.export_path }}"
        commands:
          - |
            set -u
            cat > backlinks.csv <<'CSV'
            domain,anchor,ip_c_class,sitewide,spam_score,followed
            seo-rank-engine.net,cheap seo services,203.0.113.7,true,9,true
            link-farm-x.com,buy cheap viagra,203.0.113.7,true,8,true
            blog-comment-spam.org,great post,198.51.100.22,false,9,false
            cheap-backlinks.ru,cheap seo services,203.0.113.7,true,6,true
            casino-bonus-daily.cc,casino bonus,192.0.2.44,true,7,true
            authority-marketing.io,marketing insights,198.51.100.90,false,2,true
            guest-post-hub.com,guest post guidelines,192.0.2.87,false,4,true
            payday-loans-now.biz,buy cheap viagra,203.0.113.7,false,5,false
            directory-listing.info,submit your site,198.51.100.22,false,3,false
            product-review-site.com,our favorite crm tools,192.0.2.87,false,1,true
            CSV
            if [ ! -f "${EXPORT_PATH}" ]; then
              mkdir -p "$(dirname "${EXPORT_PATH}")" 2>/dev/null || true
              cp backlinks.csv "${EXPORT_PATH}" 2>/dev/null || true
              echo "no export landed at ${EXPORT_PATH}, staged the bundled fixture"
            fi
            echo "rows available $(($(wc -l < backlinks.csv) - 1))"

      - id: score_backlinks
        type: io.kestra.plugin.scripts.python.Script
        description: Parse the export and award two points for a spam score of seven or more, one for a sitewide link, one for an anchor built only from money terms, and one for an IP C class shared by at least three rows, then rank every domain at or above the threshold.
        taskRunner:
          type: io.kestra.plugin.scripts.runner.docker.Docker
        containerImage: python:3.12-slim
        env:
          EXPORT_PATH: "{{ inputs.export_path }}"
          TOXICITY_THRESHOLD: "{{ inputs.toxicity_threshold }}"
        script: |
          import csv
          import json
          import os
          import re
          from collections import Counter

          MONEY_TOKENS = {
              "buy", "cheap", "deals", "discount", "seo", "services", "rank", "ranking",
              "viagra", "cialis", "pills", "pharmacy", "casino", "bonus", "slots",
              "payday", "loans", "debt", "credit", "insurance", "mortgage",
              "followers", "likes", "escorts", "dating", "replica", "counterfeit",
          }


          def normalize(anchor):
              text = re.sub(r"[^a-z0-9]+", " ", (anchor or "").lower())
              return " ".join(text.split())


          def commercial(anchor):
              tokens = normalize(anchor).split()
              return bool(tokens) and all(token in MONEY_TOKENS for token in tokens)


          def truthy(raw):
              return (raw or "").strip().lower() in ("true", "1", "yes")


          def number(raw):
              try:
                  return int(float((raw or "0").strip()))
              except (TypeError, ValueError):
                  return 0


          export_path = (os.environ.get("EXPORT_PATH") or "").strip() or "backlinks.csv"
          path = export_path if os.path.exists(export_path) else "backlinks.csv"
          threshold = max(1, number(os.environ.get("TOXICITY_THRESHOLD") or "3"))

          rows = []
          try:
              with open(path, newline="", encoding="utf-8") as handle:
                  for raw in csv.DictReader(handle):
                      record = raw or {}
                      domain = (record.get("domain") or "").strip()
                      if not domain:
                          continue
                      rows.append({
                          "domain": domain,
                          "anchor": (record.get("anchor") or "").strip(),
                          "ip_c_class": (record.get("ip_c_class") or "").strip(),
                          "sitewide": truthy(record.get("sitewide")),
                          "spam_score": number(record.get("spam_score")),
                      })
          except (OSError, csv.Error):
              rows = []

          shared = Counter(row["ip_c_class"] for row in rows if row["ip_c_class"])
          toxic = []
          for row in rows:
              points = 0
              reasons = []
              if row["spam_score"] >= 7:
                  points += 2
                  reasons.append("spam score " + str(row["spam_score"]))
              if row["sitewide"]:
                  points += 1
                  reasons.append("sitewide link")
              if commercial(row["anchor"]):
                  points += 1
                  reasons.append("exact match commercial anchor '" + row["anchor"] + "'")
              hosts = shared.get(row["ip_c_class"], 0)
              if hosts >= 3:
                  points += 1
                  reasons.append("duplicate ip c class " + row["ip_c_class"] + " on " + str(hosts) + " rows")
              if points >= threshold:
                  toxic.append({"domain": row["domain"], "points": points, "reasons": reasons})

          toxic.sort(key=lambda entry: (-entry["points"], entry["domain"]))
          payload = {
              "verdict": "toxic" if toxic else "clean",
              "toxic_count": len(toxic),
              "top_domains": toxic,
              "total_checked": len(rows),
          }
          print("checked %d rows, %d toxic at threshold %d" % (len(rows), len(toxic), threshold))
          print("::" + json.dumps({"outputs": payload}) + "::")

  # --- 2. escalate or clear the week ---
  - id: gate_toxicity
    type: io.kestra.plugin.core.flow.If
    description: Branch on the scored verdict, escalating to disavow lines, one issue per toxic domain, and a Slack alert when anything crossed the threshold, and logging a clean sweep otherwise.
    condition: "{{ outputs.score_backlinks.vars.toxic_count > 0 }}"
    then:
      - id: append_disavow_lines
        type: io.kestra.plugin.core.flow.Loop
        description: Walk the ranked toxic domains one at a time so the disavow file keeps the order the scorer published.
        concurrencyLimit: 1
        values: "{{ outputs.score_backlinks.vars.top_domains }}"
        tasks:
          - id: write_disavow_line
            type: io.kestra.plugin.scripts.python.Script
            description: Append a Google style domain entry carrying the points and the reasons that earned them to disavow.txt in the shared directory.
            taskRunner:
              type: io.kestra.plugin.scripts.runner.docker.Docker
            containerImage: python:3.12-slim
            env:
              DOMAIN: "{{ item.value.domain }}"
              POINTS: "{{ item.value.points }}"
              REASONS: "{{ item.value.reasons | join('; ') }}"
            script: |
              import json
              import os

              domain = (os.environ.get("DOMAIN") or "").strip()
              points = (os.environ.get("POINTS") or "0").strip()
              reasons = (os.environ.get("REASONS") or "").strip()

              line = "domain:" + domain + " # points " + points + " - " + reasons
              with open("disavow.txt", "a", encoding="utf-8") as handle:
                  handle.write(line + "\n")

              print("appended disavow entry for " + domain)
              print("::" + json.dumps({"outputs": {"domain": domain, "points": points, "line": line}}) + "::")

          - id: file_disavow_issue
            type: io.kestra.plugin.github.issues.Create
            description: Open one labeled issue per toxic domain so each disavow candidate is reviewable and assignable where the SEO team already works.
            oauthToken: "{{ secret('GITHUB_TOKEN') }}"
            repository: your-org/seo-ops
            title: "Disavow candidate {{ item.value.domain }} - {{ item.value.points }} points"
            labels:
              - seo
              - backlink-disavow
            body: |
              ## Toxic backlink candidate

              - Domain {{ item.value.domain }}
              - Points {{ item.value.points }} against threshold {{ inputs.toxicity_threshold }}
              - Reasons {{ item.value.reasons | join('; ') }}
              - Rows checked {{ outputs.score_backlinks.vars.total_checked }}
              - A matching line was appended to disavow.txt by execution {{ execution.id }}

              Confirm the link is not a partner or press mention, then add the entry to the
              disavow file the search console upload uses.

      - id: summarize_disavow
        type: io.kestra.plugin.scripts.python.Script
        description: Read disavow.txt back and publish the entry count plus the joined lines so the Slack alert carries the actual domains instead of a bare number.
        taskRunner:
          type: io.kestra.plugin.scripts.runner.docker.Docker
        containerImage: python:3.12-slim
        script: |
          import json
          import os

          lines = []
          if os.path.exists("disavow.txt"):
              with open("disavow.txt", encoding="utf-8") as handle:
                  lines = [line.strip() for line in handle if line.strip()]

          payload = {"disavow_lines": len(lines), "summary": "; ".join(lines)}
          print("disavow file holds %d line(s)" % len(lines))
          print("::" + json.dumps({"outputs": payload}) + "::")

      - id: notify_toxic_findings
        type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
        description: Post the verdict, the toxic share of the export, and the queued disavow entries to the SEO channel now that the file and the issues exist.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "Backlink toxicity audit verdict {{ outputs.score_backlinks.vars.verdict }} - {{ outputs.score_backlinks.vars.toxic_count }} of {{ outputs.score_backlinks.vars.total_checked }} new backlinks reached the {{ inputs.toxicity_threshold }} point threshold. Disavow entries queued with one GitHub issue each - {{ outputs.summarize_disavow.vars.summary }}. Execution {{ execution.id }}."
          }
    else:
      - id: log_clean_sweep
        type: io.kestra.plugin.core.log.Log
        description: Record the clean verdict and the row count so a week with nothing to disavow still leaves evidence in the execution history.
        message: "Backlink audit {{ outputs.score_backlinks.vars.verdict }} - {{ outputs.score_backlinks.vars.toxic_count }} of {{ outputs.score_backlinks.vars.total_checked }} rows reached the {{ inputs.toxicity_threshold }} point threshold, nothing to disavow this week."

errors:
  - id: notify_failure
    type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
    description: Escalate any failure to the ops channel with the execution url.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {"text": "FAILED: {{ flow.id }} {{ execution.id }}"}

outputs:
  - id: verdict
    type: STRING
    description: Toxicity verdict for the export, toxic when at least one domain crossed the threshold and clean when none did.
    value: "{{ outputs.score_backlinks.vars.verdict }}"
  - id: toxic_count
    type: INT
    description: Number of domains whose backlinks reached the threshold and entered the disavow queue.
    value: "{{ outputs.score_backlinks.vars.toxic_count }}"
  - id: top_domains
    type: ARRAY
    description: Toxic domains ranked by points, each entry carrying its domain, points, and the reasons that earned them.
    value: "{{ outputs.score_backlinks.vars.top_domains }}"
  - id: total_checked
    type: INT
    description: Number of backlink rows the scorer parsed from the export, toxic and clean alike.
    value: "{{ outputs.score_backlinks.vars.total_checked }}"

extend:
  title: Score New Backlinks for Toxicity and Queue the Worst for Disavow
  metaTitle: Weekly Backlink Toxicity Audit and Disavow Prep
  shortDescription: Score every new backlink for spam, sitewide, anchor, and IP cluster signals, then queue toxic domains for disavow with issues and a Slack alert.
  metaDescription: Score new backlinks for spam, sitewide, anchor, and duplicate IP signals, disavow toxic domains with GitHub issues, and alert Slack.
  description: |
    A backlink profile rots quietly - one bought link package or one scraped directory can sit in an export for weeks before anyone reads the anchor text. This blueprint scores every new backlink the moment a crawler export lands on the webhook, awards points for the four signals that actually precede ranking damage, and puts the toxic domains in front of a human before the next refresh. Domains at or above the threshold get a disavow line, one GitHub issue each, and a Slack alert; a quiet week is logged as a clean sweep with the row count. The verdict, the toxic count, the ranked domains, and the rows checked are published as outputs.

    ## How it works

    1. `on_backlink_export` (`io.kestra.plugin.core.trigger.Webhook`, keyed) receives the POST from the crawler or link index the moment a fresh export is written.
    2. `weekly_backlink_audit` (`io.kestra.plugin.core.trigger.Schedule`, cron `0 6 * * 1`) is a disabled Monday morning net that sweeps the standing export once the webhook path is trusted.
    3. `audit_workspace` (`io.kestra.plugin.core.flow.WorkingDirectory`) gives the staging step, the scorer, the loop, and the summary one directory, so the rows written by the shell are the rows every later task reads.
    4. `stage_backlink_export` (`io.kestra.plugin.scripts.shell.Commands` on `alpine:3.20`) writes a ten row `backlinks.csv` with a heredoc over the columns `domain`, `anchor`, `ip_c_class`, `sitewide`, `spam_score`, `followed`, and copies it to `export_path` when no export has landed there.
    5. `score_backlinks` (`io.kestra.plugin.scripts.python.Script` on `python:3.12-slim`) parses the CSV with the standard library and awards 2 points for a spam score of 7 or more, 1 for a sitewide link, 1 for an anchor built only from commercial money terms, and 1 for an `ip_c_class` shared by 3 or more rows; every domain reaching `toxicity_threshold` is collected, ranked by points then domain, and emitted with its reasons through the repo outputs protocol.
    6. `gate_toxicity` (`io.kestra.plugin.core.flow.If`) branches on `toxic_count > 0`, so the escalation only fires when the numbers justify it.
    7. `append_disavow_lines` (`io.kestra.plugin.core.flow.Loop`, `concurrencyLimit: 1`) walks the ranked domains; `write_disavow_line` appends a `domain:` entry with points and reasons to `disavow.txt`, and `file_disavow_issue` (`io.kestra.plugin.github.issues.Create`) opens one labeled issue per domain for human confirmation.
    8. `summarize_disavow` reads the file back and `notify_toxic_findings` (`io.kestra.plugin.notifications.slack.SlackIncomingWebhook`) posts the verdict and the queued entries to the SEO channel.
    9. On a clean week `log_clean_sweep` (`io.kestra.plugin.core.log.Log`) records the verdict and the row count, and the `errors` block escalates a broken audit to Slack with the execution url.

    ## What you get

    - A per-row toxicity score built from four signals, with the winning reasons attached to every flagged domain instead of a bare number.
    - A `disavow.txt` in Google's `domain:` format, ranked by points, ready to review and upload.
    - One labeled GitHub issue per toxic domain, so each candidate is confirmable rather than auto-applied.
    - A Slack alert carrying the verdict, the toxic share of the export, and the queued entries, plus a failure alert if the audit itself breaks.
    - `verdict`, `toxic_count`, `top_domains`, and `total_checked` as typed outputs for dashboards and weekly reporting.

    ## Who it's for

    - SEO leads who need a defensible weekly pass over new backlinks before a refresh punishes the profile.
    - Content and growth teams that inherit link packages and want the questionable domains surfaced with evidence.
    - Agencies running the same audit across several properties that want the logic in version control, not in a spreadsheet.

    ## Why orchestrate this with Kestra

    Toxicity scoring usually lives in a spreadsheet somebody forgets to open, so the disavow file lags the export by months. Kestra puts the trigger, the scoring rules, the gate, the file, the issues, and the alert in one versioned file: the threshold is an input, the branch is declarative, every run leaves its verdict and row count in execution history, and the disabled schedule adds a second net you can switch on. A one-off script gives you a file and no memory of why a domain was flagged.

    ## Prerequisites

    - Docker on the Kestra worker, since the shell and Python tasks run in `alpine:3.20` and `python:3.12-slim`.
    - A crawler or link index that POSTs to the webhook when an export is written.
    - A GitHub repository with issue write access for the disavow candidates.
    - A Slack incoming webhook for the weekly alert and for failures.

    ### Secrets

    - `BACKLINK_EXPORT_WEBHOOK_KEY`: key segment guarding the webhook URL, anyone holding it can start an audit.
    - `SLACK_WEBHOOK_URL`: Slack incoming webhook for the toxic findings alert and failure alerts.
    - `GITHUB_TOKEN`: GitHub token used to open one disavow issue per toxic domain.

    ## Quick start

    1. Add the three secrets to your namespace and point `export_path` at the file your crawler writes, for example `exports/backlinks-weekly.csv`.
    2. Point the crawler at `/api/v1/{tenant}/executions/webhook/{namespace}/backlink-toxic-audit/{BACKLINK_EXPORT_WEBHOOK_KEY}` and trigger an export.
    3. Confirm the run reports `verdict: toxic` with the expected `toxic_count`, that `disavow.txt` holds one `domain:` line per flagged domain, and that an issue and a Slack message exist for each.
    4. Set `toxicity_threshold` higher to tighten the queue, and enable `weekly_backlink_audit` once the webhook path is trusted.

    ## How to extend

    - Add a fifth signal, for example a new referring domain with no history, by extending the scoring loop in `score_backlinks`.
    - Gate the issue creation behind a second threshold with `io.kestra.plugin.core.flow.Switch` when only the worst domains should be filed.
    - Upload `disavow.txt` with `io.kestra.plugin.http.Request` or a search console client after human approval.
    - Store the weekly scores in a table with `io.kestra.plugin.jdbc.postgresql.Queries` to chart toxicity trend over time.
    - Fan the audit out per property with `io.kestra.plugin.core.flow.Subflow` when you manage several sites.

    ## Links

    - [Disavow links documentation (Google Search Central)](https://developers.google.com/search/docs/crawling-indexing/valid-urls-disavow)
    - [Webhook trigger documentation](https://kestra.io/docs/workflow-triggers)
    - [GitHub plugin documentation](https://kestra.io/plugins/plugin-github)
    - [Slack plugin documentation](https://kestra.io/plugins/plugin-slack)
    - [Python csv module](https://docs.python.org/3/library/csv.html)
  tags:
    - Data
    - Business
  subTags:
    - seo
    - backlinks
    - disavow
    - toxicity
  ee: false
  demo: false
