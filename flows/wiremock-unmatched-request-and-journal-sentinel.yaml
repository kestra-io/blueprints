id: wiremock-unmatched-request-and-journal-sentinel
namespace: company.team
description: |
  Polls standalone WireMock admin endpoints on a schedule to detect unmatched
  request contract drift from downstream services, monitors in-memory request
  journal growth against capacity thresholds, dispatches Slack alerts, and
  provides safe, non-destructive journal pruning to prevent JVM heap exhaustion.

triggers:
  - id: periodic_journal_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: "Periodically audits WireMock request journals to detect API contract drift and memory exhaustion risks. Shipped disabled by default; enable once wiremock_host and wiremock_port point to a running WireMock standalone instance."
    cron: "*/15 * * * *"
    disabled: true
    inputs:
      wiremock_host: "localhost"
      wiremock_port: 8080
      max_journal_capacity: 1000
      auto_reset_journal: "false"
      dry_run: "true"

inputs:
  - id: wiremock_host
    type: STRING
    displayName: "WireMock Host"
    defaults: "localhost"
    description: "Hostname or IP address of the WireMock standalone instance."

  - id: wiremock_port
    type: INT
    displayName: "WireMock Admin Port"
    defaults: 8080
    description: "HTTP port exposed by the WireMock standalone server for its admin API (default: 8080)."

  - id: max_journal_capacity
    type: INT
    displayName: "Max Journal Request Capacity"
    defaults: 1000
    description: "Maximum allowable recorded requests in the WireMock in-memory journal before flagging capacity saturation risk."

  - id: auto_reset_journal
    type: STRING
    displayName: "Auto Reset Journal"
    defaults: "false"
    description: "When set to 'true' and dry_run is 'false', automatically purges the request log journal via DELETE /__admin/requests to reclaim memory without removing stub mappings."

  - id: dry_run
    type: STRING
    displayName: "Dry Run Mode"
    defaults: "true"
    description: "When set to 'true', suppresses active journal reset mutations and logs dry-run audit messages instead."

tasks:
  - id: probe_unmatched_requests
    type: io.kestra.plugin.core.http.Request
    description: "Queries WireMock Admin API for requests that did not match any configured stub mapping, indicating contract drift or client misconfiguration."
    uri: "http://{{ inputs.wiremock_host }}:{{ inputs.wiremock_port }}/__admin/requests/unmatched"
    method: GET
    headers:
      Accept: "application/json"
    options:
      allowFailed: true

  - id: probe_request_count
    type: io.kestra.plugin.core.http.Request
    description: "Fetches total recorded request count from WireMock in-memory journal to assess memory consumption against capacity thresholds."
    uri: "http://{{ inputs.wiremock_host }}:{{ inputs.wiremock_port }}/__admin/requests/count"
    method: GET
    headers:
      Accept: "application/json"
    options:
      allowFailed: true

  - id: classify_journal_status
    type: io.kestra.plugin.core.flow.Switch
    description: "Evaluates probe results to classify state into CONTRACT_DRIFT_DETECTED, JOURNAL_QUOTA_EXCEEDED, or HEALTHY."
    value: >-
      {% if (fromJson(outputs.probe_unmatched_requests.body).requests ?? []) | length > 0 %}
      CONTRACT_DRIFT_DETECTED
      {% elif (fromJson(outputs.probe_request_count.body).count ?? 0) >= inputs.max_journal_capacity %}
      JOURNAL_QUOTA_EXCEEDED
      {% else %}
      HEALTHY
      {% endif %}
    cases:
      CONTRACT_DRIFT_DETECTED:
        - id: alert_contract_drift
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: "Dispatches critical Slack alert when client requests fail to match any registered WireMock stub."
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "channel": "#api-alerts",
              "text": ":warning: *WireMock API Contract Drift Detected*",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":warning: *WireMock API Contract Drift Detected*\n*Host:* `{{ inputs.wiremock_host }}:{{ inputs.wiremock_port }}`\n*Unmatched Requests:* `{{ (fromJson(outputs.probe_unmatched_requests.body).requests ?? []) | length }}`\n*Impact:* Downstream microservices or test suites are calling endpoints without valid stub mappings."
                  }
                }
              ]
            }

        - id: evaluate_remediation_on_drift
          type: io.kestra.plugin.core.flow.If
          description: "Evaluates safety gate before resetting request journal following contract drift alert."
          condition: "{{ inputs.auto_reset_journal == 'true' and inputs.dry_run == 'false' }}"
          then:
            - id: purge_journal_on_drift
              type: io.kestra.plugin.core.http.Request
              description: "Issues DELETE /__admin/requests to flush recorded request log while strictly preserving all active stub definitions."
              uri: "http://{{ inputs.wiremock_host }}:{{ inputs.wiremock_port }}/__admin/requests"
              method: DELETE
            - id: log_purge_drift
              type: io.kestra.plugin.core.log.Log
              message: "WireMock request journal purged successfully following contract drift alert."
          else:
            - id: log_dry_run_drift
              type: io.kestra.plugin.core.log.Log
              message: "Dry-run active or auto_reset_journal disabled: WireMock request journal preserved for root cause triage."

      JOURNAL_QUOTA_EXCEEDED:
        - id: alert_journal_quota
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          description: "Dispatches warning Slack alert when recorded request journal exceeds capacity threshold."
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "channel": "#api-alerts",
              "text": ":chart_with_upwards_trend: *WireMock Journal Capacity Quota Exceeded*",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":chart_with_upwards_trend: *WireMock Journal Capacity Quota Exceeded*\n*Host:* `{{ inputs.wiremock_host }}:{{ inputs.wiremock_port }}`\n*Current Depth:* `{{ fromJson(outputs.probe_request_count.body).count ?? 0 }}` requests (Threshold: `{{ inputs.max_journal_capacity }}`)\n*Impact:* Unbounded in-memory request journaling threatens JVM heap exhaustion."
                  }
                }
              ]
            }

        - id: evaluate_remediation_on_quota
          type: io.kestra.plugin.core.flow.If
          description: "Evaluates safety gate before resetting request journal following capacity breach."
          condition: "{{ inputs.auto_reset_journal == 'true' and inputs.dry_run == 'false' }}"
          then:
            - id: purge_journal_on_quota
              type: io.kestra.plugin.core.http.Request
              description: "Issues DELETE /__admin/requests to flush accumulated request logs and reclaim JVM heap memory."
              uri: "http://{{ inputs.wiremock_host }}:{{ inputs.wiremock_port }}/__admin/requests"
              method: DELETE
            - id: log_purge_quota
              type: io.kestra.plugin.core.log.Log
              message: "WireMock request journal purged successfully to enforce capacity quota."
          else:
            - id: log_dry_run_quota
              type: io.kestra.plugin.core.log.Log
              message: "Dry-run active or auto_reset_journal disabled: request journal preserved."

      HEALTHY:
        - id: log_healthy_state
          type: io.kestra.plugin.core.log.Log
          message: "WireMock journal healthy on {{ inputs.wiremock_host }}:{{ inputs.wiremock_port }}: 0 unmatched requests, {{ fromJson(outputs.probe_request_count.body).count ?? 0 }} total recorded requests."

  - id: log_audit_complete
    type: io.kestra.plugin.core.log.Log
    description: "Records audit completion timestamp, target instance, and final journal depth for compliance lineage."
    message: "WireMock sentinel audit completed for {{ inputs.wiremock_host }}:{{ inputs.wiremock_port }}."

errors:
  - id: alert_sentinel_probe_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: "Dispatches out-of-band alert if WireMock admin API is unreachable or returns an HTTP error."
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "#api-alerts",
        "text": ":rotating_light: *WireMock Sentinel Probe Failure*",
        "blocks": [
          {
            "type": "section",
            "text": {
              "type": "mrkdwn",
              "text": ":rotating_light: *WireMock Sentinel Probe Failure*\nFailed to probe WireMock Admin API at `http://{{ inputs.wiremock_host }}:{{ inputs.wiremock_port }}`. The standalone container may be down, network unreachable, or port misconfigured."
            }
          }
        ]
      }

extend:
  title: WireMock Unmatched Request & Journal Memory Sentinel
  metaTitle: WireMock Unmatched Request & Journal Sentinel | Kestra
  shortDescription: Audit WireMock request journals for unmapped contract drift, detect memory bloat, and trigger Slack alerts with safe remediation.
  metaDescription: Audit WireMock request journals for unmapped contract drift, detect memory bloat, alert via Slack, and prune request history safely.
  description: |
    Continuously monitors standalone WireMock instances in integration, staging, and CI/CD environments to detect unmapped API requests, alert on contract drift, track in-memory journal depth against capacity quotas, and optionally execute safe journal pruning to safeguard container stability.

    ## How it works

    1. `periodic_journal_audit` (`io.kestra.plugin.core.trigger.Schedule`) triggers every 15 minutes with explicit connection and threshold inputs. Shipped disabled so initial manual verification can be performed first.
    2. `probe_unmatched_requests` (`io.kestra.plugin.core.http.Request`) invokes the WireMock Admin endpoint `GET /__admin/requests/unmatched` to retrieve requests recorded by the server that failed to match any configured stub definition.
    3. `probe_request_count` (`io.kestra.plugin.core.http.Request`) invokes `GET /__admin/requests/count` to retrieve the total count of recorded requests held in WireMock's in-memory journal.
    4. `classify_journal_status` (`io.kestra.plugin.core.flow.Switch`) evaluates probe responses:
       - `CONTRACT_DRIFT_DETECTED`: Fires when `unmatched` requests count is greater than zero, notifying `#api-alerts` via `io.kestra.plugin.slack.notifications.SlackIncomingWebhook`. If `auto_reset_journal` is enabled and `dry_run` is disabled, `purge_journal_on_drift` clears the request journal while leaving mock definitions intact.
       - `JOURNAL_QUOTA_EXCEEDED`: Fires when total recorded requests meet or exceed `max_journal_capacity`, dispatching a Slack warning and optionally purging the journal.
       - `HEALTHY`: Logs zero unmatched requests and nominal journal depth via `io.kestra.plugin.core.log.Log`.
    5. `log_audit_complete` always executes at the end of the workflow to persist execution metadata and state for observability history.
    6. The global `errors` block intercepts connection drops or HTTP errors to dispatch an urgent out-of-band Slack notification when WireMock is unreachable.

    ## What you get

    - Early detection of integration contract drift when upstream microservices alter API request schemas, paths, or query parameters without corresponding mock updates.
    - JVM heap protection against unbounded in-memory request logging in high-throughput testing environments.
    - Non-destructive automated remediation: `DELETE /__admin/requests` clears request history logs without deleting or mutating stub mappings (`DELETE /__admin/mappings` is never invoked).
    - Dual safety gate control: `dry_run` defaults to `true` to ensure zero unexpected mutations during evaluation.

    ## Who it's for

    - Platform Engineers and QA Automation Teams managing shared WireMock standalone instances in Kubernetes or Docker environments.
    - Microservice backend developers relying on mock servers for integration and end-to-end testing pipelines.
    - Site Reliability Engineers safeguarding test cluster infrastructure from memory exhaustion and OOM crashes.

    ## Why orchestrate this with Kestra

    WireMock does not natively provide threshold-based alerting or integration with collaboration platforms like Slack. Standalone shell scripts or cron jobs lack retry policies, secret masking, execution history, and stateful conditional remediation. Kestra provides declarative scheduling, robust error handling, secure credential management, and interactive execution logging.

    ## Prerequisites

    - A running WireMock standalone instance (version 2.35.0+ or 3.x), reachable over HTTP. WireMock publishes an official open-source Docker image (`wiremock/wiremock:latest`) requiring no license or account.
    - A Slack incoming webhook URL configured for operational alerts.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack incoming webhook URL used by `alert_contract_drift`, `alert_journal_quota`, and the global `errors` handler.

    ## Quick start

    1. Start a local WireMock container:
       ```bash
       docker run -d --name wiremock-sentinel-test -p 8080:8080 wiremock/wiremock:latest
       ```
    2. Configure the `SLACK_WEBHOOK_URL` secret in your Kestra namespace.
    3. Import this blueprint into Kestra and trigger an execution with default inputs (`dry_run: true`).
    4. Verify that `log_healthy_state` logs 0 unmatched requests.
    5. Send an unmapped request to test alert routing:
       ```bash
       curl -X POST http://localhost:8080/api/v1/unmapped-endpoint -d '{"test": true}'
       ```
    6. Re-run the flow to observe `alert_contract_drift` dispatching to Slack.
    7. Enable `periodic_journal_audit` once verified.

    ## How to extend

    - Add a downstream task using `GET /__admin/requests/unmatched/near-misses` to automatically compute and include diffs between unmatched calls and closest matching stubs in the Slack notification.
    - Integrate with PagerDuty via `io.kestra.plugin.pagerduty.notifications.PagerDutyAlert` for tier-1 CI/CD staging environments where mock downtime blocks deployments.
    - Export request volume metrics to Prometheus using `io.kestra.plugin.prometheus.PushGateway` for long-term capacity forecasting.

    ## Links

    - [WireMock Official Documentation](https://wiremock.org/docs/)
    - [WireMock Admin API Reference](https://wiremock.org/docs/standalone/admin-api/)
    - [WireMock Official Docker Hub Image](https://hub.docker.com/r/wiremock/wiremock)
    - [Kestra HTTP Request Plugin Documentation](https://kestra.io/plugins/plugin-core/tasks/http/io.kestra.plugin.core.http.request)
    - [Kestra Slack Plugin Documentation](https://kestra.io/plugins/plugin-slack/notifications/io.kestra.plugin.slack.notifications.slackincomingwebhook)
  tags:
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - Day 2 Operations
  ee: false
  demo: false
