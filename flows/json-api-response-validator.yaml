id: json-api-response-validator
namespace: company.team

description: |
  Call a configurable HTTP API, validate its JSON response against a contract,
  and route valid and invalid responses independently.

triggers:
  - id: scheduled_validation
    type: io.kestra.plugin.core.trigger.Schedule
    description: Run the API validation on a schedule. Disabled until configured.
    cron: "0 * * * *"
    disabled: true

inputs:
  - id: api_url
    type: STRING
    displayName: API URL
    description: Fully-qualified HTTP or HTTPS URL that returns the JSON document to validate.
    defaults: https://dummyjson.com/products/1
    required: true

  - id: expected_status_code
    type: INT
    displayName: Expected HTTP status
    description: HTTP status code required for the response to be considered valid.
    defaults: 200
    required: true

  - id: required_fields
    type: JSON
    displayName: Required JSON fields
    description: JSON array of top-level field names that must be present in the response object.
    defaults: |
      ["id", "title", "price"]
    required: true

  - id: notify_slack
    type: BOOL
    displayName: Send invalid-response Slack notification
    description: When true, send invalid results to Slack using the SLACK_WEBHOOK_URL secret.
    defaults: false
    required: true

tasks:
  - id: call_api
    type: io.kestra.plugin.core.http.Request
    description: Call the configured API and retain unsuccessful HTTP responses for validation.
    uri: "{{ inputs.api_url }}"
    method: GET
    headers:
      Accept: application/json
    options:
      allowFailed: true

  - id: validate_response
    type: io.kestra.plugin.scripts.python.Script
    description: Validate the status code, JSON object shape, and required top-level fields.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    env:
      RESPONSE_BODY: "{{ outputs.call_api.body }}"
      RESPONSE_STATUS: "{{ outputs.call_api.statusCode }}"
      EXPECTED_STATUS: "{{ inputs.expected_status_code }}"
      REQUIRED_FIELDS: "{{ inputs.required_fields | toJson }}"
    outputFiles:
      - validation_report.json
    script: |
      import os
      import sys
      import json
      from kestra import Kestra

      expected_status = int(os.environ["EXPECTED_STATUS"])
      actual_status = int(os.environ["RESPONSE_STATUS"])
      required_fields = json.loads(os.environ["REQUIRED_FIELDS"])
      response_body = os.environ.get("RESPONSE_BODY", "")

      errors = []
      parsed_response = None
      if actual_status != expected_status:
          errors.append(f"expected HTTP {expected_status}, received HTTP {actual_status}")

      try:
          parsed_response = json.loads(response_body)
      except Exception:
          errors.append("response body is not valid JSON")

      if parsed_response is not None and not isinstance(parsed_response, dict):
          errors.append("response JSON must be an object")

      missing_fields = []
      if isinstance(parsed_response, dict):
          missing_fields = [field for field in required_fields if field not in parsed_response]
          if missing_fields:
              errors.append("missing required fields: " + ", ".join(missing_fields))

      result = {
          "valid": not errors,
          "http_status": actual_status,
          "expected_status": expected_status,
          "missing_fields": missing_fields,
          "errors": errors
      }

      with open("validation_report.json", "w", encoding="utf-8") as f:
          json.dump(result, f, indent=2)

      print(f"Validation completed: valid={not errors}, errors={errors}")
      Kestra.outputs({"result": result, "valid": not errors, "http_status": actual_status})

  - id: route_validation_result
    type: io.kestra.plugin.core.flow.If
    description: Route valid and invalid API responses to separate handling paths.
    condition: "{{ outputs.validate_response.vars.valid }}"
    then:
      - id: log_valid_response
        type: io.kestra.plugin.core.log.Log
        message: "API response is valid. URL: {{ inputs.api_url }}, HTTP: {{ outputs.validate_response.vars.http_status }}"
    else:
      - id: log_invalid_response
        type: io.kestra.plugin.core.log.Log
        message: "API response is invalid. URL: {{ inputs.api_url }}, Errors: {{ outputs.validate_response.vars.result.errors }}"

      - id: notify_invalid_response
        type: io.kestra.plugin.core.flow.If
        condition: "{{ inputs.notify_slack }}"
        then:
          - id: send_slack_notification
            type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
            url: "{{ secret('SLACK_WEBHOOK_URL') }}"
            payload: |
              {
                "text": "🚨 *JSON API validation failed* for `{{ inputs.api_url }}`.\nHTTP: {{ outputs.validate_response.vars.http_status }}\nErrors: {{ outputs.validate_response.vars.result.errors | toJson }}"
              }

errors:
  - id: alert_flow_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "⚠️ *JSON API Validator Pipeline Failure*: Execution {{ execution.id }} in flow {{ flow.id }} failed."
      }

outputs:
  - id: valid
    type: BOOLEAN
    value: "{{ outputs.validate_response.vars.valid }}"
  - id: http_status
    type: INT
    value: "{{ outputs.validate_response.vars.http_status }}"
  - id: report_uri
    type: URI
    value: "{{ outputs.validate_response.outputFiles['validation_report.json'] }}"

extend:
  title: JSON API Response Validator
  shortDescription: Call a configurable HTTP API, validate its JSON response against a contract, and route valid and invalid responses independently.
  metaTitle: Automated JSON API Response Validator
  metaDescription: Regularly probe and validate JSON API endpoints against schema contracts with Slack alerting.
  description: |
    Call a configurable HTTP API, validate its JSON response against a contract,
    and route valid and invalid responses independently.
  tags:
    - Data
    - Core
  subTags:
    - Testing & Quality
    - Monitoring & Alerting
  ee: false
  demo: false
