id: redis-memory-fragmentation-sentinel
namespace: company.dataops

inputs:
  - id: redis_host
    type: STRING
    defaults: redis.internal
    description: Hostname of the Redis instance.
  - id: redis_port
    type: INT
    defaults: 6379
    description: TCP port of the Redis instance.
  - id: max_fragmentation_ratio_threshold
    type: FLOAT
    defaults: 1.5
    description: Maximum permissible memory fragmentation ratio before alerting.

tasks:
  - id: inspect_memory_fragmentation
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.12-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install redis kestra
    env:
      REDIS_HOST: "{{ inputs.redis_host }}"
      REDIS_PORT: "{{ inputs.redis_port }}"
      REDIS_PASSWORD: "{{ secret('REDIS_PASSWORD') }}"
      MAX_FRAG_THRESHOLD: "{{ inputs.max_fragmentation_ratio_threshold }}"
    script: |
      import os
      import sys
      import redis
      from kestra import Kestra

      host = os.environ.get("REDIS_HOST", "redis.internal")
      port = int(os.environ.get("REDIS_PORT", "6379"))
      password = os.environ.get("REDIS_PASSWORD") or None
      threshold = float(os.environ.get("MAX_FRAG_THRESHOLD", "1.5"))

      try:
          r = redis.Redis(host=host, port=port, password=password, socket_connect_timeout=10, socket_timeout=10)
          info = r.info("memory")
      except Exception as e:
          print(f"Error querying Redis memory at {host}:{port}: {e}", file=sys.stderr)
          sys.exit(1)

      frag_ratio = float(info.get("mem_fragmentation_ratio", 1.0))
      used_mb = round(int(info.get("used_memory", 0)) / 1048576.0, 1)
      rss_mb = round(int(info.get("used_memory_rss", 0)) / 1048576.0, 1)
      alert_triggered = frag_ratio > threshold and rss_mb > 100.0

      print(f"Redis memory fragmentation: frag_ratio={frag_ratio}, used_mb={used_mb}, rss_mb={rss_mb}, alert={alert_triggered}")
      Kestra.outputs({
          "mem_fragmentation_ratio": frag_ratio,
          "used_memory_mb": used_mb,
          "used_memory_rss_mb": rss_mb,
          "alert_triggered": alert_triggered
      })

  - id: evaluate_fragmentation_ratio
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.inspect_memory_fragmentation.vars.alert_triggered }}"
    then:
      - id: alert_infrastructure_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "text": ":warning: *Redis Memory Fragmentation Alert*: Memory fragmentation ratio on {{ inputs.redis_host }} has reached {{ outputs.inspect_memory_fragmentation.vars.mem_fragmentation_ratio }} (Used: {{ outputs.inspect_memory_fragmentation.vars.used_memory_mb }} MB, RSS: {{ outputs.inspect_memory_fragmentation.vars.used_memory_rss_mb }} MB). Enable `activedefrag` or schedule memory defragmentation."
          }

errors:
  - id: notify_sentinel_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "text": ":warning: *Redis Sentinel Execution Failure*: Failed to query memory metrics on {{ inputs.redis_host }}."
      }

triggers:
  - id: daily_fragmentation_check
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 4 * * *"
    disabled: true

outputs:
  - id: mem_fragmentation_ratio
    type: FLOAT
    value: "{{ outputs.inspect_memory_fragmentation.vars.mem_fragmentation_ratio }}"
  - id: used_memory_mb
    type: FLOAT
    value: "{{ outputs.inspect_memory_fragmentation.vars.used_memory_mb }}"
  - id: used_memory_rss_mb
    type: FLOAT
    value: "{{ outputs.inspect_memory_fragmentation.vars.used_memory_rss_mb }}"
  - id: alert_triggered
    type: BOOLEAN
    value: "{{ outputs.inspect_memory_fragmentation.vars.alert_triggered }}"

extend:
  metaDescription: "Audits Redis memory allocation efficiency to detect high fragmentation ratios and operating system memory bloat."
  metaTitle: Redis Memory Fragmentation Ratio and Allocator Bloat Sentinel with Kestra
  title: Redis Memory Fragmentation Ratio and Allocator Bloat Sentinel
  shortDescription: Audits Redis memory allocation efficiency to detect high fragmentation ratios and operating system memory bloat.
  description: |
    ## How it works
    This sentinel connects to Redis using `redis-cli` and queries `INFO memory` to evaluate `mem_fragmentation_ratio`. High ratios indicate that the jemalloc memory allocator is retaining unused pages from the operating system, which wastes RAM and threatens OOM killer termination.

    ## What you get
    - Proactive visibility into memory allocator overhead and resident set size bloat.
    - Early warning before memory fragmentation causes host memory exhaustion.
    - Actionable recommendations to enable `activedefrag` or plan node restarts.

    ## Who it's for
    - Database administrators and SREs supervising in-memory caching fleets.
    - Platform teams optimizing cloud virtual machine memory density.

    ## Why orchestrate this with Kestra
    Kestra runs automated scheduled database health checks with fine-grained error management and notification routing.

    ## Prerequisites
    - Redis server access on configured port.
    - Secrets `REDIS_PASSWORD` and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import this blueprint into Kestra.
    2. Configure host, port, and credentials.
    3. Run manually to check current memory fragmentation.

    ## How to extend
    - Trigger `MEMORY PURGE` automatically in a remediation subflow to release unmapped memory pages.
    - Inspect key allocation patterns to recommend optimal data structure serialization.
    - Forward memory metrics to Prometheus or Datadog.

    ## Links
    - [Redis Memory Optimization](https://redis.io/docs/management/optimization/memory-optimization/)
    - [Kestra Slack Notifications](https://kestra.io/plugins/plugin-slack)
  tags:
    - Data
    - Infrastructure
  subTags:
    - Monitoring & Alerting
  ee: false
  demo: false
