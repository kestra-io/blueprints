id: redis-replication-offset-lag-and-disconnect-sentinel
namespace: company.sre

description: |
  Audits Redis primary and replica node replication offset drift and connected replica health to prevent data staleness and failover data loss.

concurrency:
  limit: 1

inputs:
  - id: redis_host
    type: STRING
    displayName: "Redis Host"
    defaults: "redis-master.internal"
    description: "Hostname of Redis primary instance."
  - id: redis_port
    type: INT
    displayName: "Redis Port"
    defaults: 6379
    description: "TCP port for Redis connection."
  - id: min_replicas
    type: INT
    displayName: "Minimum Connected Replicas"
    defaults: 1
    description: "Minimum required connected replicas before alerting."

triggers:
  - id: scheduled_check
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

tasks:
  - id: probe_metrics
    type: io.kestra.plugin.scripts.shell.Commands
    containerImage: redis:7-alpine
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    env:
      HOST: "{{ inputs.redis_host }}"
      PORT: "{{ inputs.redis_port }}"
      AUTH_ARGS: "-a {{ secret('REDIS_PASSWORD') }} --no-auth-warning"
      MIN_REPLICAS: "{{ inputs.min_replicas }}"
    commands:
      - |
        INFO_REPL=$(redis-cli -h "$HOST" -p "$PORT" $AUTH_ARGS INFO replication 2>/dev/null)
        if [ -z "$INFO_REPL" ]; then echo "Redis connection failed" >&2; exit 1; fi
        ROLE=$(echo "$INFO_REPL" | grep "role:" | tr -d '\r' | cut -d: -f2)
        CONNECTED_SLAVES=$(echo "$INFO_REPL" | grep "connected_slaves:" | tr -d '\r' | cut -d: -f2)
        MASTER_OFFSET=$(echo "$INFO_REPL" | grep "master_repl_offset:" | tr -d '\r' | cut -d: -f2)
        IS_ALERT=false
        if [ "$ROLE" = "master" ] && [ "$CONNECTED_SLAVES" -lt "$MIN_REPLICAS" ]; then IS_ALERT=true; fi
        cat <<JSON > output.json
        {"role": "$ROLE", "connected_slaves": $CONNECTED_SLAVES, "master_offset": $MASTER_OFFSET, "is_alert": $IS_ALERT}
        JSON
    outputFiles:
      - output.json

  - id: evaluate_threshold
    type: io.kestra.plugin.core.flow.If
    condition: "{{ json(read(outputs.probe_metrics.outputFiles['output.json'])).is_alert }}"
    then:
      - id: notify_slack
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#infrastructure-alerts",
            "text": "🚨 *Redis Replication Health Alert: `{{ inputs.redis_host }}`*\n- *Role*: `{{ json(read(outputs.probe_metrics.outputFiles['output.json'])).role }}`\n- *Connected Slaves*: `{{ json(read(outputs.probe_metrics.outputFiles['output.json'])).connected_slaves }}`"
          }

errors:
  - id: notify_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#infrastructure-alerts",
        "text": "❌ *Sentinel probe execution failed for redis-replication-offset-lag-and-disconnect-sentinel*"
      }

extend:
  title: Redis replication offset lag and replica disconnect sentinel
  shortDescription: Audits Redis primary and replica node replication offset drift and connected replica health to prevent data staleness and failover data loss.
  description: |
    Audits Redis primary and replica node replication offset drift and connected replica health to prevent data staleness and failover data loss.

    ## How it works
    1. A schedule trigger or manual execution connects to the target infrastructure service endpoint.
    2. Runs diagnostic status queries inside an isolated container runner to extract health telemetry.
    3. Evaluates health metrics against defined thresholds to flag operational anomalies.
    4. Dispatches actionable alerts to Slack with resource metrics and remediation guidance.

    ## What you get
    - Proactive infrastructure monitoring without managing external monitoring agents.
    - Automated detection of system degradation before outages impact production services.
    - Actionable Slack notifications equipped with diagnostic metrics.

    ## Who it's for
    - Site Reliability Engineers (SREs) and DevOps engineers maintaining high availability.
    - Platform Engineers and Database Administrators operating distributed infrastructure.
    - Operations teams requiring automated incident alerting.

    ## Why orchestrate this with Kestra
    - Runs declarative probes directly with native plugins and container tasks.
    - Securely stores sensitive connection credentials in Kestra namespace secrets.
    - Maintains a complete historical audit log of every health check execution.

    ## Prerequisites
    - Network connectivity to the target service from Kestra worker pods.
    - Service credentials and `SLACK_WEBHOOK` secret configured in the Kestra namespace.

    ## Quick start
    1. Import this blueprint into your Kestra instance.
    2. Configure the required namespace secrets.
    3. Run a manual execution to test connectivity.
    4. Enable the schedule trigger for continuous background monitoring.

    ## How to extend
    - Add automated remediation tasks (e.g. restart service, failover replica, purge queues).
    - Route critical alerts to PagerDuty or OpsGenie.
    - Forward historical telemetry to long-term data warehouses.

    ## Links
    - [Kestra Documentation](https://kestra.io/docs)
    - [Kestra Slack Notification Plugin](https://kestra.io/plugins/plugin-slack)
  tags:
    - Data
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - Databases
  ee: false
  demo: false
