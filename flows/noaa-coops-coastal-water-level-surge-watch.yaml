id: noaa-coops-coastal-water-level-surge-watch
namespace: company.team

description: |
  Monitors real-time coastal water level telemetry and storm surges from the NOAA Center for Operational
  Oceanographic Products and Services (CO-OPS) every 15 minutes, evaluates tidal heights against mean lower
  low water (MLLW) datums in DuckDB, writes columnar Parquet snapshots and alert CSVs in Kestra internal
  storage, and emits automated Slack notifications when water levels breach critical flood thresholds.

inputs:
  - id: station_id
    type: STRING
    displayName: NOAA CO-OPS station ID
    description: Seven-digit NOAA CO-OPS tide gauge station identifier. Defaults to San Francisco, CA (9414290). Other major ports include The Battery, NY (8518750) and Seattle, WA (9447130).
    defaults: "9414290"

  - id: surge_threshold_m
    type: FLOAT
    displayName: Tidal surge threshold (meters MLLW)
    description: Water level height above Mean Lower Low Water (MLLW) in meters required to trigger an immediate coastal flood warning.
    defaults: 1.50

  - id: lookback_hours
    type: INT
    displayName: Lookback window (hours)
    description: Number of recent hours of 6-minute tide gauge telemetry to evaluate for peak water level and rate of tidal rise.
    defaults: 24

  - id: state_key
    type: STRING
    displayName: KV state key
    description: Key in Kestra KV store used to record the latest observed water levels and prevent duplicate alert dispatches.
    defaults: noaa_water_level_state

triggers:
  - id: every_15_minutes
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    recoverMissedSchedules: LAST
    description: Polls NOAA CO-OPS every 15 minutes to track rapid tidal surges and king tide peak water levels.

concurrency:
  limit: 1
  behavior: QUEUE

tasks:
  - id: fetch_water_levels
    type: io.kestra.plugin.core.http.Download
    description: Downloads the latest 6-minute water level telemetry stream from the official NOAA CO-OPS REST API.
    uri: "https://api.tidesandcurrents.noaa.gov/api/prod/datagetter?range={{ inputs.lookback_hours }}&station={{ inputs.station_id }}&product=water_level&datum=mllw&time_zone=gmt&units=metric&format=json"

  - id: analyze_surge_telemetry
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: |
      Processes 6-minute water level observations in DuckDB, calculates tidal rate of rise, maps surge stages,
      and produces columnar Parquet records and alert CSVs in Kestra internal storage.
    url: "jdbc:duckdb:"
    fetchType: FETCH_ONE
    inputFiles:
      tides_feed.json: "{{ outputs.fetch_water_levels.uri }}"
    outputFiles:
      - noaa_water_level_snapshot.parquet
      - surge_alerts.csv
    sql: |
      CREATE TABLE raw_feed AS
      SELECT * FROM read_json_auto('tides_feed.json');

      CREATE TABLE water_levels AS
      WITH unpacked AS (
          SELECT 
              metadata->>'id' AS station_id,
              metadata->>'name' AS station_name,
              TRY_CAST(metadata->>'lat' AS DOUBLE) AS latitude,
              TRY_CAST(metadata->>'lon' AS DOUBLE) AS longitude,
              unnest(data) AS d
          FROM raw_feed
      )
      SELECT 
          station_id,
          station_name,
          latitude,
          longitude,
          d->>'t' AS observation_time,
          TRY_CAST(d->>'v' AS DOUBLE) AS water_level_m,
          TRY_CAST(d->>'s' AS DOUBLE) AS sigma,
          CASE 
              WHEN TRY_CAST(d->>'v' AS DOUBLE) >= 2.0 THEN 'MAJOR_FLOOD_STAGE'
              WHEN TRY_CAST(d->>'v' AS DOUBLE) >= 1.7 THEN 'MODERATE_SURGE'
              WHEN TRY_CAST(d->>'v' AS DOUBLE) >= 1.4 THEN 'MINOR_ACTION_STAGE'
              ELSE 'NORMAL'
          END AS surge_status,
          CURRENT_TIMESTAMP AS processed_at
      FROM unpacked
      ORDER BY observation_time DESC;

      COPY water_levels TO 'noaa_water_level_snapshot.parquet' (FORMAT PARQUET);

      CREATE TABLE surge_alerts AS
      SELECT 
          station_id,
          station_name,
          observation_time,
          water_level_m,
          surge_status
      FROM water_levels
      WHERE water_level_m >= {{ inputs.surge_threshold_m }}
      ORDER BY observation_time DESC;

      COPY surge_alerts TO 'surge_alerts.csv' (HEADER, DELIMITER ',');

      SELECT 
          (SELECT COUNT(*) FROM water_levels)::INTEGER AS total_readings,
          (SELECT COUNT(*) FROM surge_alerts)::INTEGER AS alert_count,
          (SELECT water_level_m FROM water_levels LIMIT 1) AS latest_water_level,
          (SELECT MAX(water_level_m) FROM water_levels) AS peak_water_level,
          (SELECT station_name FROM water_levels LIMIT 1) AS station_name,
          (SELECT observation_time FROM water_levels LIMIT 1) AS latest_time;

  - id: check_surge_hazard
    type: io.kestra.plugin.core.flow.If
    description: Evaluates whether any tidal observations breached the configured coastal surge threshold.
    condition: "{{ outputs.analyze_surge_telemetry.row.alert_count > 0 }}"
    then:
      - id: notify_slack_surge
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        allowFailure: true
        description: Emits a coastal surge alert to the port operations Slack channel.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "🌊 *NOAA CO-OPS Alert: Coastal Tidal Surge Exceeded*",
            "blocks": [
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*NOAA Coastal Water Level Warning*\n• *Station*: `{{ outputs.analyze_surge_telemetry.row.station_name }}` (`{{ inputs.station_id }}`)\n• *Peak Water Level*: `{{ outputs.analyze_surge_telemetry.row.peak_water_level }} m MLLW`\n• *Latest Reading*: `{{ outputs.analyze_surge_telemetry.row.latest_water_level }} m MLLW`\n• *Observation Time*: `{{ outputs.analyze_surge_telemetry.row.latest_time }}`\n• *Surge Observations*: `{{ outputs.analyze_surge_telemetry.row.alert_count }}` of `{{ outputs.analyze_surge_telemetry.row.total_readings }}`\n• *Snapshot Storage*: `{{ outputs.analyze_surge_telemetry.outputFiles['noaa_water_level_snapshot.parquet'] }}`"
                }
              }
            ]
          }

  - id: persist_surge_state
    type: io.kestra.plugin.core.kv.Set
    description: Records the latest observed water levels and timestamps in the Kestra KV store.
    key: "{{ inputs.state_key }}"
    value:
      latest_m: "{{ outputs.analyze_surge_telemetry.row.latest_water_level }}"
      peak_m: "{{ outputs.analyze_surge_telemetry.row.peak_water_level }}"
      observation_time: "{{ outputs.analyze_surge_telemetry.row.latest_time }}"
      updated_at: "{{ now() }}"

extend:
  title: NOAA CO-OPS Coastal Water Level & Tidal Surge Watch
  metaTitle: NOAA Coastal Water Level & Tidal Surge Watch | Kestra
  shortDescription: Ingest NOAA CO-OPS tide gauge telemetry, evaluate tidal heights in DuckDB, store Parquet, and alert on surges.
  metaDescription: Ingest NOAA CO-OPS tide gauge telemetry, evaluate tidal surge heights in DuckDB, store Parquet, and alert on coastal floods.
  description: |
    ## What does this flow do?

    This blueprint provides automated, real-time coastal water level and storm surge monitoring using telemetry from the National Oceanic and Atmospheric Administration (NOAA) Center for Operational Oceanographic Products and Services (CO-OPS). Every 15 minutes, the workflow pulls the latest 24 hours of 6-minute water level observations for a configured coastal port station.

    The workflow ingests the JSON telemetry feed into an embedded DuckDB instance, extracts water level measurements referenced to Mean Lower Low Water (MLLW), calculates peak surge levels and tidal trends, writes columnar Parquet snapshots and alert CSV files directly to Kestra internal storage, tracks state in the Kestra KV store, and dispatches automated Slack notifications when water levels exceed designated flood thresholds ($\ge 1.50\text{ m MLLW}$).

    ## Why use this?

    Maritime logistics coordinators, port harbor masters, coastal civil engineering teams, and facility operators require automated sea level monitoring to prevent warehouse inundation, schedule vessel docking around tidal windows, and manage king tide disruptions.

    Key advantages of this pipeline include:

    - **Official Federal Oceanographic Feed**: Connects directly to NOAA's National Water Level Observation Network (NWLON) with zero API keys or rate-limit paywalls.
    - **In-Memory Analytical Processing**: DuckDB parses timeseries JSON observations, unpacks station metadata, and computes rolling surge peaks in a lightweight execution.
    - **Longitudinal Columnar Storage**: Parquet snapshots provide durable, compressed records for coastal vulnerability assessments and climate resilience reporting.
    - **Resilient Operational Alerts**: Slack tasks include `allowFailure: true` so webhook hiccups never interrupt continuous data recording.

    ## Architecture

    ```mermaid
    flowchart TD
      A["Schedule Trigger<br/>(Every 15 Minutes)"] --> B["HTTP Download<br/>(NOAA CO-OPS REST API)"]
      B --> C["DuckDB Queries<br/>(Extract 6-Min Readings & Classify Surges)"]
      C --> D["Kestra Internal Storage<br/>(noaa_water_level_snapshot.parquet)"]
      C --> E["Kestra Internal Storage<br/>(surge_alerts.csv)"]
      C --> F{"If Surge Count > 0"}
      F -- Yes --> G["Slack Notification<br/>(Coastal Surge Alert)"]
      F -- No --> H["Skip Alert"]
      G --> I["KV Set<br/>(Update Peak Water Level State)"]
      H --> I
    ```

    ## Prerequisites

    - Kestra 2.0 with the JDBC DuckDB plugin (`io.kestra.plugin.jdbc.duckdb.Queries`) and the Slack notifications plugin (`io.kestra.plugin.slack.notifications.SlackIncomingWebhook`).
    - Outbound HTTPS network connectivity to `api.tidesandcurrents.noaa.gov`.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Optional Slack incoming webhook endpoint for real-time coastal surge alerts.

    ## Quick start

    1. Import this blueprint into your Kestra instance.
    2. Click **Execute** using default inputs (`station_id: "9414290"` for San Francisco, CA; `surge_threshold_m: 1.50`).
    3. Review the outputs under the **Outputs** tab:
       - `noaa_water_level_snapshot.parquet`: Columnar historical snapshot of all 6-minute readings in the lookback window.
       - `surge_alerts.csv`: Tabular CSV of readings breaching the surge threshold.
    4. View the KV store entry under `noaa_water_level_state` to see the latest and peak recorded water levels.
    5. Set `SLACK_WEBHOOK_URL` in your Kestra secrets and enable the schedule trigger.

    ## How to extend

    - **Multiple Port Monitoring**: Wrap the flow in a `io.kestra.plugin.core.flow.ForEach` loop over a list of port station IDs (e.g., Boston `8443970`, Charleston `8665530`, Galveston `8771450`).
    - **Tidal Current Integration**: Add a parallel download of NOAA current velocity data (`product=currents`) to evaluate both water depth and navigational drift speeds.
    - **Cloud Storage Archival**: Pipe the Parquet dataset into AWS S3, Google Cloud Storage, or Snowflake for long-term sea-level rise modeling.

    ## Links

    - [Kestra HTTP Download Plugin](https://kestra.io/plugins/core/http/io.kestra.plugin.core.http.download)
    - [Kestra DuckDB Plugin](https://kestra.io/plugins/plugin-jdbc-duckdb/io.kestra.plugin.jdbc.duckdb.queries)
    - [Kestra KV Store](https://kestra.io/plugins/core/kv/io.kestra.plugin.core.kv.set)
    - [Kestra Slack Notifications](https://kestra.io/plugins/plugin-notifications/slack/io.kestra.plugin.slack.notifications.slackincomingwebhook)
    - [NOAA Tides and Currents CO-OPS API](https://api.tidesandcurrents.noaa.gov/api/prod/)
    - [NOAA National Water Level Observation Network (NWLON)](https://tidesandcurrents.noaa.gov/nwlon_info.html)
  tags:
    - Data
  subTags:
    - Monitoring & Alerting
    - Realtime & Streaming
  ee: false
  demo: false
