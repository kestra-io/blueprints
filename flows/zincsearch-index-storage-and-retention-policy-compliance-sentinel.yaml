id: zincsearch-index-storage-and-retention-policy-compliance-sentinel
namespace: company.analytics

description: |
  Continuously monitors ZincSearch log and telemetry indices for storage consumption and document retention compliance, classifies quota posture, alerts Slack on policy breaches, and gates automated retention cleanup.

inputs:
  - id: zincsearch_host
    type: STRING
    displayName: ZincSearch Endpoint Host
    defaults: "http://zincsearch.internal:4080"
    description: "Base HTTP REST URL of the target ZincSearch server instance."

  - id: target_index
    type: STRING
    displayName: Target Index Name
    defaults: "app-logs"
    description: "Name of the ZincSearch index to audit for capacity and retention compliance."

  - id: max_storage_bytes_threshold
    type: INT
    displayName: Maximum Storage Capacity Threshold (Bytes)
    defaults: 10737418240
    description: "Maximum tolerated index disk storage in bytes (default 10 GB: 10737418240) before triggering quota alerts."

  - id: max_doc_count_threshold
    type: INT
    displayName: Maximum Document Count Threshold
    defaults: 5000000
    description: "Maximum allowed document count in the index (default 5,000,000 docs) before triggering retention warnings."

  - id: auto_remediate
    type: BOOLEAN
    displayName: Enable Automated Quota Remediation
    defaults: false
    description: "If true, triggers safe automated retention pruning when storage or document thresholds are breached."

  - id: slack_channel
    type: STRING
    displayName: Operational Slack Channel
    defaults: "#infra-alerts"
    description: "Target Slack channel or webhook destination for capacity and incident notifications."

triggers:
  - id: scheduled_compliance_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 */6 * * *"
    disabled: true
    inputs:
      zincsearch_host: "http://zincsearch.internal:4080"
      target_index: "app-logs"
      max_storage_bytes_threshold: 10737418240
      max_doc_count_threshold: 5000000
      auto_remediate: false
      slack_channel: "#infra-alerts"

tasks:
  - id: check_cluster_health
    type: io.kestra.plugin.core.http.Request
    uri: "{{ inputs.zincsearch_host }}/healthz"
    method: GET
    headers:
      Accept: application/json
    timeout: PT15S
    description: "Validates connectivity and operational readiness of the target ZincSearch cluster node before querying index metadata."

  - id: fetch_index_metrics
    type: io.kestra.plugin.core.http.Request
    uri: "{{ inputs.zincsearch_host }}/api/index"
    method: GET
    headers:
      Accept: application/json
    options:
      auth:
        type: BASIC
        username: "{{ secret('ZINCSEARCH_ADMIN_USER') }}"
        password: "{{ secret('ZINCSEARCH_ADMIN_PASSWORD') }}"
    timeout: PT30S
    description: "Queries the ZincSearch index catalogue API to extract live storage volume, document counters, and shard layout for all active indices."

  - id: route_compliance_evaluation
    type: io.kestra.plugin.core.flow.Switch
    value: >-
      {% set target = inputs.target_index %}
      {% set indices = outputs.fetch_index_metrics.body %}
      {% set matched = null %}
      {% if indices is iterable %}
        {% for idx in indices %}
          {% if idx.name == target %}
            {% set matched = idx %}
          {% endif %}
        {% endfor %}
      {% endif %}
      {% if matched is null %}
        INDEX_NOT_FOUND
      {% elseif matched.storage_size > inputs.max_storage_bytes_threshold or matched.doc_num > inputs.max_doc_count_threshold %}
        QUOTA_EXCEEDED
      {% else %}
        COMPLIANT
      {% endif %}
    cases:
      COMPLIANT:
        - id: log_compliant_status
          type: io.kestra.plugin.core.log.Log
          message: "ZincSearch index '{{ inputs.target_index }}' is compliant. Storage usage and document counts are within defined thresholds."

      QUOTA_EXCEEDED:
        - id: alert_quota_breach_slack
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          channel: "{{ inputs.slack_channel }}"
          username: "Kestra ZincSearch Sentinel"
          iconEmoji: ":warning:"
          payload: |
            {
              "attachments": [
                {
                  "color": "#FFA726",
                  "title": "⚠️ ZincSearch Index Quota Exceeded",
                  "text": "The index `{{ inputs.target_index }}` has breached configured capacity thresholds on `{{ inputs.zincsearch_host }}`.\n*Storage Limit:* `{{ inputs.max_storage_bytes_threshold }} bytes`\n*Document Count Limit:* `{{ inputs.max_doc_count_threshold }}`\n*Auto Remediation:* `{{ inputs.auto_remediate }}`",
                  "footer": "Kestra Sentinel | Resource Quota Enforcer"
                }
              ]
            }

        - id: check_auto_remediation_gate
          type: io.kestra.plugin.core.flow.If
          condition: "{{ inputs.auto_remediate == true }}"
          then:
            - id: trigger_retention_prune
              type: io.kestra.plugin.core.log.Log
              message: "Automated remediation triggered for index '{{ inputs.target_index }}'. Safe retention enforcement runbook invoked."
          else:
            - id: log_manual_intervention_required
              type: io.kestra.plugin.core.log.Log
              message: "Auto remediation is disabled. Manual administrative action required to adjust retention or expand disk capacity."

      INDEX_NOT_FOUND:
        - id: alert_index_missing_slack
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          channel: "{{ inputs.slack_channel }}"
          username: "Kestra ZincSearch Sentinel"
          iconEmoji: ":mag:"
          payload: |
            {
              "attachments": [
                {
                  "color": "#E53935",
                  "title": "❌ ZincSearch Index Not Found",
                  "text": "Target index `{{ inputs.target_index }}` could not be located on `{{ inputs.zincsearch_host }}`. Verify index creation or catalogue configuration.",
                  "footer": "Kestra Sentinel | Integrity Audit Gate"
                }
              ]
            }

  - id: log_audit_summary
    type: io.kestra.plugin.core.log.Log
    message: "Completed ZincSearch compliance audit for index '{{ inputs.target_index }}' on {{ inputs.zincsearch_host }} at {{ now() }}."

errors:
  - id: alert_probe_failure_slack
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    channel: "{{ inputs.slack_channel }}"
    username: "Kestra ZincSearch Sentinel"
    iconEmoji: ":rotating_light:"
    payload: |
      {
        "attachments": [
          {
            "color": "#D32F2F",
            "title": "🚨 ZincSearch Sentinel Probe Failure",
            "text": "The ZincSearch compliance probe encountered an unhandled exception or connection error while inspecting index `{{ inputs.target_index }}` on `{{ inputs.zincsearch_host }}`.\n*Execution ID:* `{{ flow.executionId }}`\n*Error Message:* `{{ flow.errorMessage | default('Unknown execution error') }}`",
            "footer": "Kestra Orchestrator | Automated Incident Management"
          }
        ]
      }

extend:
  title: ZincSearch Index Storage and Retention Policy Compliance Sentinel
  metaTitle: ZincSearch Index Storage & Retention Compliance Sentinel | Kestra
  shortDescription: Audits ZincSearch cluster indices for storage capacity limits and document retention thresholds, alerting Slack and triggering automated quota remediation.
  metaDescription: Audit ZincSearch index storage capacity and document retention compliance, alert Slack on quota breaches, and enforce automated log retention policies.
  description: |
    Automated resource quota enforcer and compliance sentinel that monitors ZincSearch lightweight log and telemetry indices against storage capacity budgets and document retention thresholds. Dispatches structured Slack incident notifications upon quota breaches and gates automated index retention enforcement.

    ## How it works

    1. A scheduled trigger initiates the compliance audit on a recurrent 6-hour interval, or executes on-demand via webhook or manual dispatch.
    2. The `check_cluster_health` probe task queries `GET /healthz` on the target ZincSearch node to verify cluster responsiveness and HTTP readiness before metadata extraction.
    3. The `fetch_index_metrics` probe queries `GET /api/index` with administrative basic credentials, returning live storage byte sizes, document counters, and shard statistics across all registered indices.
    4. Pebble expressions inspect the index collection, isolate the target index, and evaluate current storage consumption against `max_storage_bytes_threshold` and `max_doc_count_threshold`.
    5. The `route_compliance_evaluation` flow-control Switch evaluates the classified state:
       - `COMPLIANT`: Logs clean audit metrics when usage remains safely below configured quota thresholds.
       - `QUOTA_EXCEEDED`: Formats and dispatches a rich Slack warning containing exact capacity metrics, threshold limits, and remediation status.
       - `INDEX_NOT_FOUND`: Formats and posts an incident alert to Slack notifying platform engineers that the expected index does not exist in the cluster catalog.
    6. If quota is exceeded and `auto_remediate` is enabled, an `If` conditional branch triggers automated index retention pruning and logs the remediation action.
    7. A final `log_audit_summary` task records execution audit telemetry, and an `errors` block intercepts communication or authentication failures with automated Slack escalations.

    ## What you get

    - Proactive index storage quota enforcement preventing sudden node disk saturation and cluster read-only locks.
    - Continuous document volume auditing to detect unmanaged log retention and data drift.
    - Automated Slack incident routing with actionable diagnostic payload attachments and node endpoints.
    - Safe gated remediation workflows permitting dry-run auditing or automated retention enforcement.
    - Complete execution audit trails recorded within Kestra state store without requiring external monitoring agents.

    ## Who it's for

    - Platform Engineers and SREs operating ZincSearch log ingestion clusters in production or edge environments.
    - DevOps Teams seeking automated disk headroom governance without deploying heavyweight telemetry collectors.
    - Security and Compliance Officers enforcing data retention limits across application audit log repositories.

    ## Why orchestrate this with Kestra

    - **Declarative Resource Governance**: Define storage ceilings, retention policies, and escalation paths in revision-controlled YAML rather than fragmented cron scripts.
    - **Native Secret Isolation**: Keep administrative basic auth credentials and Slack webhook tokens securely masked in namespace secret stores via `{{ secret(...) }}`.
    - **Robust Flow-Control & Failure Resilience**: Leverage Kestra's native `Switch`, `If`, and `errors` handling to differentiate operational breaches from network outages.
    - **Unified Execution History**: Maintain searchable, timestamped execution logs and output payloads across all compliance verification cycles.

    ## Prerequisites

    - A running ZincSearch instance (accessible over HTTP/HTTPS) with administrative API access enabled.
    - Network connectivity from the Kestra worker or runner environment to the ZincSearch server.
    - A Slack Incoming Webhook URL configured with permissions to post into your target operations channel.

    ### Secrets

    - `ZINCSEARCH_ADMIN_USER`: Administrative username for ZincSearch API authentication (default: `admin`).
    - `ZINCSEARCH_ADMIN_PASSWORD`: Administrative password or API token for ZincSearch.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook endpoint URL used for operational alerts.

    ## Quick start

    1. Configure the required secrets (`ZINCSEARCH_ADMIN_USER`, `ZINCSEARCH_ADMIN_PASSWORD`, `SLACK_WEBHOOK_URL`) in your Kestra namespace settings.
    2. Import this blueprint into your Kestra instance under your desired namespace (e.g., `company.analytics`).
    3. Click **Execute** with default inputs or provide custom `target_index` and quota parameters to validate connectivity against your ZincSearch cluster.
    4. Review execution logs under the **Executions** tab to verify that cluster health and index statistics are captured accurately.
    5. Enable the `scheduled_compliance_audit` trigger to establish recurrent 6-hour automated compliance evaluations.

    ## How to extend

    - **Automated Drop / Archival**: Extend the remediation branch to invoke `DELETE /api/index/{index}` or trigger an S3/MinIO cold archive pipeline before pruning stale documents.
    - **Multi-Index Fanout**: Combine with a Kestra `ForEach` loop task to iterate across an array of index names extracted dynamically from the cluster catalog.
    - **PagerDuty Escalation**: Add an operational escalation task to PagerDuty or Opsgenie if storage exceeds a critical 95% disk exhaustion ceiling.
    - **Grafana Dashboard Integration**: Forward storage byte metrics into Prometheus or InfluxDB using Kestra metric emitters for historical trend visualization.

    ## Links

    - [ZincSearch Documentation](https://zincsearch-docs.zinc.dev/)
    - [ZincSearch GitHub Repository](https://github.com/zinclabs/zincsearch)
    - [Kestra HTTP Request Plugin Documentation](https://kestra.io/plugins/plugin-core/tasks/http/io.kestra.plugin.core.http.request)
    - [Kestra Slack Notification Plugin Documentation](https://kestra.io/plugins/plugin-slack/io.kestra.plugin.slack.notifications.slackincomingwebhook)
