id: noaa-gfs-forecast-publication-wait-and-extract
namespace: company.team

description: |
  Waits for each NOAA GFS cycle on AWS Open Data, then extracts temperature, wind and
  precipitation for a list of sites with .idx-guided HTTP Range requests. Failed hours are
  dead-lettered in KV and replayed with mode=replay.

labels:
  source: noaa-gfs

concurrency:  # a replay queues behind a scheduled run that is still waiting in its gate
  limit: 1
  behavior: QUEUE

sla:  # bounds the whole run; the gate has its own max_wait
  - id: cycle_deadline
    type: MAX_DURATION
    duration: PT3H
    behavior: FAIL
    labels:
      sla: breached

checks:
  - when: "{{ inputs.forecast_hour_end >= inputs.forecast_hour_start }}"
    message: "forecast_hour_end must be greater than or equal to forecast_hour_start."
    style: ERROR
  - when: "{{ ((inputs.forecast_hour_end - inputs.forecast_hour_start) / inputs.forecast_hour_step) <= 48 }}"
    message: "At most 49 forecast hours per run (for example f000 to f048 hourly, about 220 MB at 0p25). Raise forecast_hour_step or narrow the window."
    style: ERROR
  - when: "{{ (inputs.sites | length) > 0 and (inputs.sites | length) <= 200 }}"
    message: "sites must be a JSON array of 1 to 200 objects like {\"name\": \"Site\", \"lat\": 52.1, \"lon\": 4.3}."
    style: ERROR
  - when: "{{ inputs.resolution == '0p25' or inputs.forecast_hour_step % 3 == 0 }}"
    message: "The 0p50 and 1p00 grids are published every 3 hours only; use a forecast_hour_step of 3, 6, 12 or 24."
    style: ERROR
  - when: "{{ inputs.cycle is null or (inputs.cycle | number) <= (now() | dateAdd(6, 'HOURS') | date('yyyyMMddHH', timeZone='UTC') | number) }}"
    message: "That cycle starts more than 6 hours from now, so nothing can be published for it yet. Cycles are YYYYMMDD plus 00, 06, 12 or 18 (UTC)."
    style: ERROR

inputs:
  - id: mode
    type: SELECT
    displayName: Mode
    description: process = wait for the cycle and extract every requested hour (a cycle already processed is skipped); replay = fetch only the dead-lettered hours of a cycle and merge them into its stored table.
    values: [process, replay]
    defaults: process

  - id: cycle
    type: STRING
    displayName: Cycle (YYYYMMDDHH, UTC)
    description: Empty = the cycle the schedule is due for (process) or the oldest dead-lettered cycle (replay).
    required: false
    validator: '^20[0-9]{6}(00|06|12|18)$'

  - id: forecast_hour_start
    type: INT
    defaults: 0
    min: 0
    max: 384

  - id: forecast_hour_end
    type: INT
    defaults: 48
    min: 0
    max: 384

  - id: forecast_hour_step
    type: INT
    description: GFS 0p25 is hourly to f120 and 3-hourly after; 0p50 and 1p00 are 3-hourly.
    defaults: 3
    min: 1
    max: 24

  - id: resolution
    type: SELECT
    description: Grid spacing in degrees. 0p25 is about 28 km at the equator; 1p00 moves about 15 times fewer bytes.
    values: ["0p25", "0p50", "1p00"]
    defaults: "0p25"

  - id: sites
    type: JSON
    displayName: Sites (sample data)
    description: Sample sites for energy, agriculture and wind use cases. Replace them with your own; a bad entry is rejected and reported, the others are processed.
    defaults: |
      [
        {"name": "Houston load zone (ERCOT)", "lat": 29.76, "lon": -95.37},
        {"name": "Ames corn belt (Iowa)", "lat": 42.03, "lon": -93.62},
        {"name": "Hornsea offshore wind (North Sea)", "lat": 53.88, "lon": 1.79},
        {"name": "Jiuquan wind base (Gansu)", "lat": 39.73, "lon": 98.49},
        {"name": "Sorriso soy belt (Mato Grosso)", "lat": -12.55, "lon": -55.71},
        {"name": "Ouarzazate solar (Morocco)", "lat": 30.92, "lon": -6.89}
      ]

  - id: thresholds
    type: JSON
    description: Flags in the per-site summary. Wind is at 100 m (typical hub height); 3 and 25 m/s are common cut-in and cut-out speeds.
    defaults: '{"frost_c": 0, "heat_c": 35, "cut_in_ms": 3, "cut_out_ms": 25, "heavy_precip_mm": 25}'

  - id: max_wait
    type: DURATION
    description: How long the gate waits for every requested hour before the cycle is declared late.
    defaults: PT2H

  - id: poll_interval
    type: DURATION
    defaults: PT2M

  - id: force
    type: BOOL
    description: Re-process a cycle that is already stored (all hours, current inputs).
    defaults: false

  - id: base_url
    type: STRING
    description: NOAA GFS on the Registry of Open Data on AWS (keyless). Any mirror with the same gfs.YYYYMMDD/HH/atmos/ layout and S3 listing works.
    defaults: https://noaa-gfs-bdp-pds.s3.amazonaws.com

variables:
  user_agent: kestra-blueprint-noaa-gfs-forecast (https://kestra.io/blueprints)
  state_key: "gfs_cycle_{{ outputs.resolve_cycle.outputs.cycle }}"

triggers:
  - id: after_each_cycle
    type: io.kestra.plugin.core.trigger.Schedule
    description: GFS runs at 00, 06, 12 and 18 UTC; f000 usually appears about 3 h 30 min later and f048 about 15 minutes after that. The gate absorbs the variation.
    cron: "40 3,9,15,21 * * *"
    timezone: UTC

tasks:
  - id: resolve_cycle
    type: io.kestra.plugin.graalvm.js.Eval
    description: |
      The cycle this run is for. An explicit input wins. Otherwise process mode takes the cycle
      the schedule is due for (trigger time minus 3 h 30 min, rounded down to 00/06/12/18 UTC)
      and replay mode takes the oldest dead-lettered cycle that is not parked.
    outputs:
      - cycle
      - source
    script: |
      (function () {
        const explicit = {{ (inputs.cycle ?? '') | toJson }};
        if (explicit) return { cycle: explicit, source: 'input' };
        if ({{ inputs.mode | toJson }} === 'replay') {
          const next = ({{ (kv('gfs_dead_letter', errorOnMissing=false) ?? []) | toJson }}).find((d) => !d.parked);
          if (next) return { cycle: next.cycle, source: 'dead_letter' };
        }
        const t = new Date(Date.parse({{ (trigger.date ?? execution.startDate) | toJson }}) - 210 * 60000);
        const p = (n) => String(n).padStart(2, '0');
        return { cycle: t.getUTCFullYear() + p(t.getUTCMonth() + 1) + p(t.getUTCDate()) + p(Math.floor(t.getUTCHours() / 6) * 6), source: 'schedule' };
      })()

  - id: plan
    type: io.kestra.plugin.graalvm.js.Eval
    description: |
      Idempotency and replay planning from the cycle's KV state. process: skip a stored cycle
      (unless force). replay: only the failed hours, with the resolution and sites stored for
      that cycle so the merged table stays consistent.
    outputs:
      - action
      - hours_json
      - all_hours_json
      - resolution
      - sites_json
      - prev_state_json
      - summary
    script: |
      (function () {
        const cycle = {{ outputs.resolve_cycle.outputs.cycle | toJson }};
        const mode = {{ inputs.mode | toJson }};
        const state = {{ kv(render(vars.state_key), errorOnMissing=false) | toJson }};
        const attempt = {{ kv('gfs_attempt_' ~ outputs.resolve_cycle.outputs.cycle, errorOnMissing=false) | toJson }};
        const all = [];
        for (let h = {{ inputs.forecast_hour_start }}; h <= {{ inputs.forecast_hour_end }}; h += {{ inputs.forecast_hour_step }}) all.push(h);
        const f = (hs) => hs.map((h) => 'f' + String(h).padStart(3, '0')).join(', ');
        const out = (action, hours, summary, s) => {
          if (attempt && action !== 'NOTHING') summary += ' Last attempt: ' + attempt.execution_id + ' (' + (attempt.state ? attempt.state + ', ' : '') + attempt.outcome + ').';
          logger.info(summary);
          return { action: action, hours_json: JSON.stringify(hours), all_hours_json: JSON.stringify(s ? s.hours : all),
                   resolution: s ? s.resolution : {{ inputs.resolution | toJson }},
                   sites_json: JSON.stringify(s ? s.sites : {{ inputs.sites | toJson }}),
                   prev_state_json: JSON.stringify(s || {}), summary: summary };
        };
        if (mode === 'replay') {
          const parked = ({{ (kv('gfs_dead_letter', errorOnMissing=false) ?? []) | toJson }}).filter((d) => d.parked);
          if ({{ outputs.resolve_cycle.outputs.source | toJson }} === 'schedule')
            return out('NOTHING', [], 'Replay: no replayable cycle in the dead-letter list' + (parked.length ? ' (' + parked.length +
                       ' parked after 3 attempts: ' + parked.map((d) => d.cycle + ' ' + f(d.failed_hours)).join('; ') + ')' : '') + '.', null);
          if (!state || !state.failed || state.failed.length === 0)
            return out('NOTHING', [], 'Replay ' + cycle + ': nothing is dead-lettered for this cycle.', null);
          const hours = state.failed.map((f) => f.forecast_hour);
          return out('RUN', hours, 'Replay ' + cycle + ' (' + state.resolution + '): retrying ' + f(hours) +
                     ' (' + [...new Set(state.failed.map((f) => f.kind))].join(', ') + ').', state);
        }
        if (state && !{{ inputs.force }})
          return out('SKIP', [], 'Cycle ' + cycle + ' is already stored as ' + state.status + ' by execution ' + state.execution_id +
                     ' at ' + state.processed_at + (state.status === 'PARTIAL' ? '; run mode=replay for ' + f(state.failed.map((x) => x.forecast_hour)) : '') +
                     '. Nothing to do (force=true re-processes it).', null);
        return out('RUN', all, 'Cycle ' + cycle + ' (' + {{ inputs.resolution | toJson }} + '): ' + all.length + ' forecast hours ' +
                   f([all[0]]) + ' to ' + f([all[all.length - 1]]) + (state ? ', forced re-process' : '') + '.', null);
      })()

  - id: label_cycle
    type: io.kestra.plugin.core.execution.Labels
    description: Makes every execution searchable by cycle in the UI.
    labels:
      gfs_cycle: "{{ outputs.resolve_cycle.outputs.cycle }}"

  - id: route
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.plan.outputs.action == 'RUN' }}"
    then:
      - id: wait_for_cycle
        type: io.kestra.plugin.core.flow.LoopUntil
        description: |
          The publication gate. Each poll is one S3 ListObjectsV2 request for the whole cycle
          (about 420 keys, one page). The gate opens when every requested hour has its .idx, or
          when the cycle's last file (f384) is out, which means any hour still missing will
          never come. Otherwise it fails after max_wait (failOnMaxReached) and the errors
          handler reports the cycle as late.
        condition: "{{ outputs.readiness.outputs.ready }}"
        failOnMaxReached: true
        checkFrequency:
          interval: "{{ inputs.poll_interval }}"
          maxDuration: "{{ inputs.max_wait }}"
        tasks:
          - id: list_cycle
            type: io.kestra.plugin.core.http.Download
            description: Hard fail after retries. If the bucket itself is unreachable, waiting longer will not help.
            uri: "{{ inputs.base_url }}/?list-type=2&prefix=gfs.{{ outputs.resolve_cycle.outputs.cycle | slice(0, 8) }}/{{ outputs.resolve_cycle.outputs.cycle | slice(8, 10) }}/atmos/gfs.t{{ outputs.resolve_cycle.outputs.cycle | slice(8, 10) }}z.pgrb2.{{ outputs.plan.outputs.resolution }}.f"
            headers:
              User-Agent: "{{ vars.user_agent }}"
            timeout: PT30S
            retry:
              type: exponential
              interval: PT5S
              maxInterval: PT1M
              maxAttempts: 4

          - id: readiness
            type: io.kestra.plugin.graalvm.js.Eval
            description: Which requested hours have their .idx (the index is written after the GRIB file, so a listed .idx means the hour is usable).
            outputs:
              - ready
              - summary
            script: |
              (function () {
                const body = {{ read(outputs.list_cycle.uri) | toJson }};
                if (body.indexOf('<IsTruncated>true') >= 0) throw new Error('S3 listing was truncated; narrow the prefix');
                const have = new Set();
                for (const m of body.matchAll(/\.f(\d{3})\.idx<\/Key>/g)) have.add(Number(m[1]));
                const hours = {{ outputs.plan.outputs.hours_json }};
                const missing = hours.filter((h) => !have.has(h));
                const final = have.has(384);
                return { ready: missing.length === 0 || final,
                         summary: (hours.length - missing.length) + ' of ' + hours.length + ' requested hours listed (' + have.size + ' in the cycle so far)' +
                                  (missing.length ? ', missing ' + missing.map((h) => 'f' + String(h).padStart(3, '0')).join(', ') : '') + (final ? ', cycle complete (f384 is out)' : '') };
              })()

      - id: log_gate
        type: io.kestra.plugin.core.log.Log
        message: "Cycle {{ outputs.resolve_cycle.outputs.cycle }} gate open after {{ outputs.wait_for_cycle.iterationCount }} poll(s): {{ outputs.readiness.outputs.summary }}."

      - id: extract
        type: io.kestra.plugin.scripts.python.Script
        description: |
          Per hour: read the .idx, turn the byte offsets of the needed records into Range requests,
          check each download (HTTP 206, length, GRIB...7777 framing, decoded step) and decode the
          nearest grid point per site with ecCodes. Requests have a 30 s timeout and 4 attempts with
          backoff. A failed hour is recorded, never fatal; the task fails only on systemic errors
          (no valid site, broken container), and Kestra retries it once.
        containerImage: python:3.13-slim
        taskRunner:
          type: io.kestra.plugin.scripts.runner.docker.Docker
        beforeCommands:
          - pip install --quiet --no-cache-dir eccodes eccodeslib
        timeout: PT20M
        retry:
          type: constant
          interval: PT1M
          maxAttempts: 2
        env:
          PLAN: '{"cycle": "{{ outputs.resolve_cycle.outputs.cycle }}", "resolution": "{{ outputs.plan.outputs.resolution }}", "base_url": "{{ inputs.base_url }}", "hours": {{ outputs.plan.outputs.hours_json }}, "all_hours": {{ outputs.plan.outputs.all_hours_json }}}'
          USER_AGENT: "{{ vars.user_agent }}"
          EXECUTION_ID: "{{ execution.id }}"
        inputFiles:
          listing.xml: "{{ outputs.list_cycle.uri }}"
          sites.json: "{{ outputs.plan.outputs.sites_json }}"
          previous_state.json: "{{ outputs.plan.outputs.prev_state_json }}"
          dead_letter.json: "{{ (kv('gfs_dead_letter', errorOnMissing=false) ?? []) | toJson }}"
        outputFiles:
          - rows.json
          - state.json
          - dead_letter.json
        script: |
          import json, os, random, re, threading, time, urllib.error, urllib.request
          from concurrent.futures import ThreadPoolExecutor
          from datetime import datetime, timedelta, timezone
          import eccodes

          plan = json.loads(os.environ["PLAN"])
          cycle, res, hours = plan["cycle"], plan["resolution"], plan["hours"]
          cycle_dt = datetime.strptime(cycle, "%Y%m%d%H").replace(tzinfo=timezone.utc)
          prefix = f"{plan['base_url'].rstrip('/')}/gfs.{cycle[:8]}/{cycle[8:]}/atmos/gfs.t{cycle[8:]}z.pgrb2.{res}.f"
          warn = lambda msg: print("::" + json.dumps({"logs": [{"level": "WARN", "message": msg}]}) + "::")  # Kestra log protocol
          # Object sizes (end of the last message, savings figure) and LastModified (publication time) from the gate's listing.
          objects = {}
          for key, modified, size in re.findall(r"<Key>([^<]+)</Key><LastModified>([^<]+)</LastModified>.*?<Size>(\d+)</Size>", open("listing.xml").read()):
              if m := re.search(r"\.f(\d{3})(\.idx)?$", key):
                  objects[(int(m.group(1)), bool(m.group(2)))] = (int(size), modified)

          sites, rejected = [], []  # each site is validated on its own; a bad entry is rejected, not fatal
          for i, s in enumerate(json.load(open("sites.json"))):
              try:
                  site = {"site": str(s["name"]).strip(), "lat": float(s["lat"]), "lon": float(s["lon"])}
                  if not site["site"] or not -90 <= site["lat"] <= 90 or not -180 <= site["lon"] < 360:
                      raise ValueError("needs a name, lat -90..90 and lon -180..360")
                  sites.append(site)
              except (KeyError, TypeError, ValueError) as e:
                  rejected.append({"index": i, "entry": json.dumps(s)[:120], "reason": f"{type(e).__name__}: {e}"})
                  warn(f"Rejected site {i}: {json.dumps(s)[:120]} ({type(e).__name__}: {e})")
          if not sites:
              raise SystemExit("No valid site in the sites input")

          # Exact variable and level: a looser match on ':UGRD:100 m' would also hit ':UGRD:100 mb' (a pressure level).
          FIELDS = [("gust_ms", "GUST", "surface"), ("t2m_k", "TMP", "2 m above ground"),
                    ("u10_ms", "UGRD", "10 m above ground"), ("v10_ms", "VGRD", "10 m above ground"),
                    ("u100_ms", "UGRD", "100 m above ground"), ("v100_ms", "VGRD", "100 m above ground")]

          class HourError(Exception):
              """kind: MISSING_HOUR, MISSING_FIELD, STALE_INDEX, RANGE_IGNORED, HTTP_<code>, CORRUPT_DOWNLOAD or NETWORK."""
              def __init__(self, kind, message, retryable=False):
                  super().__init__(message)
                  self.kind, self.retryable = kind, retryable

          def split_grib(buf):
              """A GRIB2 message starts with 'GRIB' and edition 2, has its length in bytes 8-15 and ends with '7777'."""
              out, pos = [], 0
              while pos < len(buf):
                  if buf[pos:pos + 4] != b"GRIB" or buf[pos + 7] != 2:
                      raise HourError("CORRUPT_DOWNLOAD", f"no GRIB2 header at byte {pos}", True)
                  n = int.from_bytes(buf[pos + 8:pos + 16], "big")
                  if buf[pos + n - 4:pos + n] != b"7777":
                      raise HourError("CORRUPT_DOWNLOAD", f"message at byte {pos} ({n} bytes) has no 7777 end marker", True)
                  out.append(buf[pos:pos + n])
                  pos += n
              return out

          def fetch(url, first=None, last=None, attempts=4):
              """GET with a 30 s timeout; network errors, HTTP 429/5xx, short reads and bad framing are retried with backoff (2, 4, 8 s)."""
              with lock:
                  stats["requests"] += 1
              for attempt in range(1, attempts + 1):
                  try:
                      headers = {"User-Agent": os.environ["USER_AGENT"]}
                      if first is not None:
                          headers["Range"] = f"bytes={first}-{last}"
                      with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=30) as r:
                          if first is not None and r.status != 206:  # a 200 would be the whole 500 MB file: stop before reading it
                              raise HourError("RANGE_IGNORED", f"server answered HTTP {r.status} instead of 206")
                          body = r.read()
                      if first is not None:
                          if len(body) != last - first + 1:
                              raise HourError("CORRUPT_DOWNLOAD", f"short read, {len(body)} of {last - first + 1} bytes", True)
                          split_grib(body)
                      with lock:
                          stats["bytes"] += len(body)
                      return body, attempt
                  except urllib.error.HTTPError as e:
                      err = HourError(f"HTTP_{e.code}", f"HTTP {e.code} for {url.rsplit('/', 1)[-1]}", e.code == 429 or e.code >= 500)
                  except HourError as e:
                      err = e
                  except Exception as e:  # timeouts, refused or reset connections
                      err = HourError("NETWORK", f"{type(e).__name__}: {e}", True)
                  if not err.retryable or attempt == attempts:
                      raise HourError(err.kind, f"{err} (attempt {attempt} of {attempts})")
                  with lock:
                      stats["retries"] += 1
                  warn(f"{url.rsplit('/', 1)[-1]}: {err}, retry {attempt} of {attempts - 1}")
                  time.sleep(2 ** attempt + random.random())

          def process_hour(fh):
              if (fh, True) not in objects:
                  raise HourError("MISSING_HOUR", "no .idx listed for this forecast hour although the cycle is complete")
              lines = [l.split(":") for l in fetch(prefix + f"{fh:03d}.idx")[0].decode().splitlines() if l.strip()]
              if any(p[2] != f"d={cycle}" for p in lines):
                  raise HourError("STALE_INDEX", f"index is for {lines[0][2]}, not d={cycle}")
              want, picked = ("anl" if fh == 0 else f"{fh} hour fcst"), {}
              for i, (num, offset, _, var, level, fcst, *_) in enumerate(lines):
                  col = next((c for c, v, l in FIELDS if (v, l, fcst) == (var, level, want)), None)
                  # APCP comes twice: a 6-hour bucket (6-9, 6-12 ...) and the run total (0-9, 0-12, '0-2 day' at f048).
                  acc = re.fullmatch(r"0-(\d+) (hour|day) acc fcst", fcst)
                  if fh and (var, level) == ("APCP", "surface") and acc and int(acc.group(1)) * (24 if acc.group(2) == "day" else 1) == fh:
                      col = "apcp_total_mm"
                  if col and col not in picked:  # a message ends where the next one starts
                      picked[col] = (int(offset), int(lines[i + 1][1]) - 1 if i + 1 < len(lines) else objects[(fh, False)][0] - 1, var)
              missing = [c for c, *_ in FIELDS + ([("apcp_total_mm",)] if fh else []) if c not in picked]
              if missing:
                  raise HourError("MISSING_FIELD", ", ".join(missing) + " not in the index")
              ranges = []  # adjacent messages (UGRD then VGRD) become one request
              for col, (start, end, var) in sorted(picked.items(), key=lambda x: x[1][0]):
                  if ranges and ranges[-1][-1][2] + 1 == start:
                      ranges[-1].append((col, start, end, var))
                  else:
                      ranges.append([(col, start, end, var)])
              values, attempts = {s["site"]: {} for s in sites}, 1
              for group in ranges:
                  body, n = fetch(prefix + f"{fh:03d}", group[0][1], group[-1][2])
                  attempts = max(attempts, n)
                  msgs = split_grib(body)
                  if len(msgs) != len(group):
                      raise HourError("CORRUPT_DOWNLOAD", f"expected {len(group)} GRIB messages, got {len(msgs)}")
                  with decode_lock:  # ecCodes handles are not thread-safe: downloads are parallel, decoding is serialised
                      for (col, _, _, var), msg in zip(group, msgs):
                          gid = eccodes.codes_new_from_message(msg)
                          try:
                              step = str(eccodes.codes_get(gid, "stepRange"))
                              if eccodes.codes_get(gid, "dataDate") != int(cycle[:8]) or step.split("-")[-1] != str(fh):
                                  raise HourError("CORRUPT_DOWNLOAD", f"decoded {var} is step {step}, the index said f{fh:03d}")
                              for s in sites:
                                  values[s["site"]][col] = eccodes.codes_grib_find_nearest(gid, s["lat"], s["lon"] % 360)[0]
                          finally:
                              eccodes.codes_release(gid)
              latency = (datetime.fromisoformat(objects[(fh, True)][1].replace("Z", "+00:00")) - cycle_dt).total_seconds() / 60
              rows = []
              for s in sites:
                  v, g = values[s["site"]], values[s["site"]]["t2m_k"]
                  rows.append({**s, "grid_lat": g["lat"], "grid_lon": g["lon"] - 360 if g["lon"] > 180 else g["lon"], "grid_km": round(g["distance"], 1),
                               "forecast_hour": fh, "valid_time": (cycle_dt + timedelta(hours=fh)).strftime("%Y-%m-%d %H:%M:%S"),
                               "t2m_c": round(v["t2m_k"]["value"] - 273.15, 2), "apcp_total_mm": round(v["apcp_total_mm"]["value"], 2) if fh else 0.0,
                               **{c: round(v[c]["value"], 2) for c, *_ in FIELDS if c != "t2m_k"}, "published_min_after_cycle": round(latency)})
              print(f"f{fh:03d}: {len(ranges)} range requests" + (f", {attempts} attempts" if attempts > 1 else ""))
              return rows

          def run_hour(fh):
              try:
                  return fh, process_hour(fh), None
              except Exception as e:  # one bad hour never stops the others: it is dead-lettered
                  print(f"f{fh:03d}: FAILED {getattr(e, 'kind', 'DECODE_ERROR')}: {str(e)[:300]}")
                  return fh, [], {"forecast_hour": fh, "kind": getattr(e, "kind", "DECODE_ERROR"), "reason": str(e)[:300]}

          lock, decode_lock, stats = threading.Lock(), threading.Lock(), {"requests": 0, "retries": 0, "bytes": 0}
          prev = json.load(open("previous_state.json")) or {}
          rows, failures, ok = [r for r in prev.get("rows", []) if r["forecast_hour"] not in hours], [], []
          with ThreadPoolExecutor(max_workers=4) as pool:  # at most 4 hours in flight
              for fh, hour_rows, failure in pool.map(run_hour, hours):
                  rows.extend(hour_rows)
                  failures.append(failure) if failure else ok.append(fh)

          # Attempts count across replays; after 3 the cycle's entry is parked and replay stops picking it.
          before = {f["forecast_hour"]: f.get("attempts", 1) for f in prev.get("failed", [])}
          for f in failures:
              f["attempts"] = before.get(f["forecast_hour"], 0) + 1
          now = datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          rows.sort(key=lambda r: (r["site"], r["forecast_hour"]))
          state = {"cycle": cycle, "resolution": res, "status": "PARTIAL" if failures else "COMPLETE", "processed_at": now,
                   "execution_id": os.environ["EXECUTION_ID"], "hours": plan["all_hours"], "ok_hours": sorted({r["forecast_hour"] for r in rows}),
                   "failed": failures, "rejected_sites": rejected, "sites": [{"name": s["site"], "lat": s["lat"], "lon": s["lon"]} for s in sites], "rows": rows}
          dead = [d for d in json.load(open("dead_letter.json")) if d["cycle"] != cycle]
          if failures:
              dead.append({"cycle": cycle, "failed_hours": [f["forecast_hour"] for f in failures], "kinds": sorted({f["kind"] for f in failures}),
                           "attempts": min(f["attempts"] for f in failures), "parked": min(f["attempts"] for f in failures) >= 3, "updated_at": now})
          for name, obj in {"rows.json": rows, "state.json": state, "dead_letter.json": sorted(dead, key=lambda d: d["cycle"])}.items():
              json.dump(obj, open(name, "w"))

          full, published = sum(objects.get((fh, False), (0,))[0] for fh in ok), [objects[(fh, True)][1] for fh in ok]
          print("::" + json.dumps({"outputs": {
              "cycle": cycle, "status": state["status"], "hours_requested": len(hours), "hours_ok": len(ok), "hours_failed": len(failures),
              "failed_hours_label": ", ".join(f"f{f['forecast_hour']:03d}" for f in sorted(failures, key=lambda f: f["forecast_hour"])),
              "failure_kinds": ", ".join(sorted({f["kind"] for f in failures})), "table_hours": len(state["ok_hours"]), "sites": len(sites),
              "rejected_sites": len(rejected), "requests": stats["requests"], "retries": stats["retries"], "mb_downloaded": round(stats["bytes"] / 1e6, 2),
              "mb_full_files": round(full / 1e6, 1), "percent_of_full": round(100 * stats["bytes"] / full, 2) if full else 0,
              "first_hour_published": min(published, default=""), "last_hour_published": max(published, default="")}}) + "::")

      - id: save_cycle_state
        type: io.kestra.plugin.core.kv.Set
        description: Processed-cycle record (status, hours, failures, sites, rows). It makes re-runs idempotent and is what replay merges into. The ttl drops it after 10 days.
        key: "{{ render(vars.state_key) }}"
        kvType: JSON
        value: "{{ read(outputs.extract.outputFiles['state.json']) }}"
        ttl: P10D

      - id: save_dead_letter
        type: io.kestra.plugin.core.kv.Set
        description: Cycles with failed hours, oldest first. replay without a cycle input takes the first entry that is not parked (3 failed attempts).
        key: gfs_dead_letter
        kvType: JSON
        value: "{{ read(outputs.extract.outputFiles['dead_letter.json']) }}"
        ttl: P10D

      - id: build_table
        type: io.kestra.plugin.jdbc.duckdb.Queries
        description: |
          Wind speed and direction (where it blows from) come from U and V. Step precipitation is the
          difference of run totals, over the real window when an hour is missing.
        timeZoneId: UTC
        inputFiles:
          rows.json: "{{ outputs.extract.outputFiles['rows.json'] }}"
        outputFiles:
          - forecast.csv
          - forecast.parquet
        fetchType: FETCH
        sql: |
          SET TimeZone = 'UTC';
          CREATE TABLE f AS
          SELECT site, lat, lon, grid_lat, grid_lon, grid_km, forecast_hour,
                 CAST(valid_time AS TIMESTAMP) AS valid_time_utc,
                 t2m_c,
                 round(sqrt(u10_ms * u10_ms + v10_ms * v10_ms), 2) AS wind10_ms,
                 CAST(round((270 - degrees(atan2(v10_ms, u10_ms))) % 360) AS INTEGER) AS wind10_from_deg,
                 round(sqrt(u100_ms * u100_ms + v100_ms * v100_ms), 2) AS wind100_ms,
                 gust_ms,
                 forecast_hour - lag(forecast_hour, 1, 0) OVER w AS precip_window_h,
                 round(greatest(0, apcp_total_mm - lag(apcp_total_mm, 1, 0.0) OVER w), 2) AS precip_mm,
                 apcp_total_mm AS precip_since_cycle_mm,
                 published_min_after_cycle
          FROM read_json('{{ workingDir }}/rows.json', format = 'array')
          WINDOW w AS (PARTITION BY site ORDER BY forecast_hour);
          COPY (SELECT '{{ outputs.resolve_cycle.outputs.cycle }}' AS gfs_cycle, * FROM f ORDER BY site, forecast_hour) TO '{{ outputFiles['forecast.csv'] }}' (HEADER);
          COPY (SELECT '{{ outputs.resolve_cycle.outputs.cycle }}' AS gfs_cycle, * FROM f ORDER BY site, forecast_hour) TO '{{ outputFiles['forecast.parquet'] }}' (FORMAT PARQUET);
          SELECT site,
                 count(*) AS hours,
                 round(min(t2m_c), 1) AS t_min_c,
                 round(max(t2m_c), 1) AS t_max_c,
                 round(max(wind100_ms), 1) AS wind100_max_ms,
                 round(max(gust_ms), 1) AS gust_max_ms,
                 round(max(precip_since_cycle_mm) - min(precip_since_cycle_mm), 1) AS precip_window_mm,
                 concat_ws(', ',
                   CASE WHEN min(t2m_c) <= {{ inputs.thresholds.frost_c }} THEN 'frost in ' || count(*) FILTER (WHERE t2m_c <= {{ inputs.thresholds.frost_c }}) || ' of ' || count(*) || ' steps' END,
                   CASE WHEN max(t2m_c) >= {{ inputs.thresholds.heat_c }} THEN 'heat' END,
                   CASE WHEN count(*) FILTER (WHERE wind100_ms < {{ inputs.thresholds.cut_in_ms }}) > 0 THEN 'below cut-in in ' || count(*) FILTER (WHERE wind100_ms < {{ inputs.thresholds.cut_in_ms }}) || ' of ' || count(*) || ' steps' END,
                   CASE WHEN max(wind100_ms) >= {{ inputs.thresholds.cut_out_ms }} THEN 'cut-out risk' END,
                   CASE WHEN max(precip_since_cycle_mm) - min(precip_since_cycle_mm) >= {{ inputs.thresholds.heavy_precip_mm }} THEN 'heavy precipitation' END
                 ) AS flags
          FROM f
          GROUP BY site
          ORDER BY site;

      - id: log_forecast
        type: io.kestra.plugin.core.log.Log
        message: |
          GFS {{ outputs.resolve_cycle.outputs.cycle }} {{ outputs.plan.outputs.resolution }}: {{ outputs.extract.vars.hours_ok }} of {{ outputs.extract.vars.hours_requested }} hours extracted, {{ outputs.extract.vars.requests }} requests, {{ outputs.extract.vars.retries }} retries, {{ outputs.extract.vars.mb_downloaded }} MB instead of {{ outputs.extract.vars.mb_full_files }} MB of full files ({{ outputs.extract.vars.percent_of_full }} percent). Published {{ outputs.extract.vars.first_hour_published }} to {{ outputs.extract.vars.last_hour_published }}.
          {% for r in outputs.build_table.outputs[0].rows %}{{ r.site }}: {{ r.t_min_c }} to {{ r.t_max_c }} C, wind100 max {{ r.wind100_max_ms }} m/s, gust max {{ r.gust_max_ms }} m/s, precip {{ r.precip_window_mm }} mm{{ r.flags ? ' [' ~ r.flags ~ ']' : '' }}
          {% endfor %}

      - id: partial_verdict
        type: io.kestra.plugin.core.execution.Fail
        description: The table and state are already saved for the hours that worked. Failing here makes a partial cycle visible (errors alert, FAILED state) instead of a quiet SUCCESS.
        condition: "{{ outputs.extract.vars.hours_failed > 0 }}"
        errorMessage: "Cycle {{ outputs.resolve_cycle.outputs.cycle }}: {{ outputs.extract.vars.hours_failed }} hour(s) dead-lettered ({{ outputs.extract.vars.failed_hours_label }}; {{ outputs.extract.vars.failure_kinds }}). Run mode=replay after the cause is fixed."
    else:
      - id: log_skip
        type: io.kestra.plugin.core.log.Log
        message: "{{ outputs.plan.outputs.summary }}"

errors:
  - id: alert_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: allowFailure so a missing or broken webhook never hides the original failure.
    allowFailure: true
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    messageText: |
      {%- set first = (errorLogs() | length) > 0 ? errorLogs()[0] : null -%}
      {%- set failed = first.taskId ?? '' -%}
      {%- set late = first is null and outputs.readiness is defined and outputs.extract is not defined -%}
      :rotating_light: GFS cycle {{ outputs.resolve_cycle.outputs.cycle ?? 'unknown' }} failed in task `{{ late ? 'wait_for_cycle' : (failed != '' ? failed : 'none (flow-level SLA)') }}`.
      {% if late %}The cycle is late: after max_wait ({{ inputs.max_wait | numberFormat('#') }} s) only {{ outputs.readiness.outputs.summary }}. Run again with cycle={{ outputs.resolve_cycle.outputs.cycle }} once NOAA catches up.{% elseif failed == 'extract' %}The extraction failed as a whole (no valid site, package install or container problem); see the task logs.{% elseif first is not null %}{{ first.message }}{% else %}See the execution logs.{% endif %}
      Execution: {{ kestra.url ?? '' }}/ui/executions/{{ flow.namespace }}/{{ flow.id }}/{{ execution.id }}

finally:
  - id: log_outcome
    type: io.kestra.plugin.core.log.Log
    description: Always the last line of a run that ends on its own (success, partial, late cycle, extraction error), so the outcome is visible without opening each task. An SLA breach can end the run before finally (seen once in testing); afterExecution covers that case.
    runIf: "{{ (outputs.plan.outputs.action ?? '') == 'RUN' }}"
    level: "{{ (outputs.extract.vars.status ?? '') == 'COMPLETE' ? 'INFO' : 'WARN' }}"
    message: >-
      Cycle {{ outputs.resolve_cycle.outputs.cycle }} ({{ inputs.mode }}): gate {{ outputs.readiness.outputs.summary ?? 'not reached' }};
      {{ outputs.extract.vars is defined ? (outputs.extract.vars.hours_ok ~ ' of ' ~ outputs.extract.vars.hours_requested ~ ' hours extracted, state ' ~ outputs.extract.vars.status) : 'nothing extracted, state unchanged' }}.

afterExecution:
  - id: record_attempt
    type: io.kestra.plugin.core.kv.Set
    description: |
      What the last run for this cycle saw, with its final state. Here rather than in finally
      because afterExecution also runs after an SLA breach, which can end a run before finally.
      The next plan for this cycle logs it. Expires after 7 days.
    runIf: "{{ (outputs.plan.outputs.action ?? '') == 'RUN' }}"
    key: "gfs_attempt_{{ outputs.resolve_cycle.outputs.cycle }}"
    kvType: JSON
    ttl: P7D
    value: |
      {"execution_id": "{{ execution.id }}", "mode": "{{ inputs.mode }}", "state": "{{ execution.state }}", "sla_breached": {{ (labels.sla ?? '') == 'breached' }},
       "at": "{{ now() | date("yyyy-MM-dd'T'HH:mm:ss'Z'", timeZone='UTC') }}", "gate": {{ (outputs.readiness.outputs.summary ?? 'not reached') | toJson }},
       "outcome": {{ (outputs.extract.vars is defined ? (outputs.extract.vars.hours_ok ~ ' of ' ~ outputs.extract.vars.hours_requested ~ ' hours extracted') : (outputs.readiness is defined ? 'gate did not open' : 'no listing')) | toJson }}}

  - id: publish_digest
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Runs once the execution has its final state, so the digest says SUCCESS or FAILED (partial) truthfully. Silent when nothing was extracted.
    runIf: "{{ outputs.build_table is defined }}"
    allowFailure: true
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    messageText: |
      GFS {{ outputs.resolve_cycle.outputs.cycle }} ({{ outputs.plan.outputs.resolution }}) finished {{ execution.state }}: {{ outputs.extract.vars.hours_ok }} of {{ outputs.extract.vars.hours_requested }} hours fetched in this run ({{ outputs.extract.vars.mb_downloaded }} MB), the table now has {{ outputs.extract.vars.table_hours }} of {{ outputs.plan.outputs.all_hours_json | jq('length') | first }} hours.
      {% for r in outputs.build_table.outputs[0].rows %}- {{ r.site }}: {{ r.t_min_c }} to {{ r.t_max_c }} C, wind100 max {{ r.wind100_max_ms }} m/s, precip {{ r.precip_window_mm }} mm{{ r.flags ? ' (' ~ r.flags ~ ')' : '' }}
      {% endfor %}Execution: {{ kestra.url ?? '' }}/ui/executions/{{ flow.namespace }}/{{ flow.id }}/{{ execution.id }}

outputs:
  - id: forecast_csv
    type: STRING
    description: Internal-storage URI of the per-site forecast CSV (empty when the run skipped). STRING because a FILE output cannot be empty.
    value: "{{ outputs.build_table.outputFiles['forecast.csv'] ?? '' }}"
  - id: forecast_parquet
    type: STRING
    value: "{{ outputs.build_table.outputFiles['forecast.parquet'] ?? '' }}"
  - id: summary
    type: JSON
    value: "{{ (outputs.extract.vars ?? {'action': outputs.plan.outputs.action ?? 'NONE'}) | toJson }}"

extend:
  title: Wait for Each NOAA GFS Forecast Cycle, Then Extract Site Forecasts with Byte-Range GRIB2 Downloads
  metaTitle: NOAA GFS Publication Gate and Byte-Range GRIB2 Site Forecasts | Kestra
  shortDescription: Wait until every forecast hour of a new NOAA GFS cycle is on the AWS Open Data bucket, then pull only 2 m temperature, wind and precipitation for your sites with HTTP Range requests guided by the .idx files. Late cycles, missing hours and corrupt downloads are alerted, dead-lettered and replayable.
  metaDescription: Wait for each NOAA GFS cycle with LoopUntil, extract site forecasts via .idx-guided HTTP Range downloads, dead-letter bad hours in KV and replay them.
  description: |
    Energy traders, farmers and renewables teams want each NOAA Global Forecast System (GFS) run as soon as it lands, but publication time varies and the files arrive one forecast hour at a time, not always in order. This blueprint waits for the data to exist, then processes it: a gate polls the keyless NOAA GFS bucket on AWS Open Data until every forecast hour you need has its `.idx` index, then fetches only the GRIB2 messages you need with HTTP `Range` requests and decodes them for your sites. Forecast values are live NOAA data; the default sites are sample data, replace them with yours.

    ## How it works

    1. `after_each_cycle` fires 3 h 40 min after each 00/06/12/18 UTC run starts, about when f000 appears. `resolve_cycle` turns the trigger time into a cycle (`YYYYMMDDHH`) unless `cycle` is given.
    2. `plan` reads the cycle's KV record: a stored cycle is skipped (`force` re-processes it); `mode=replay` plans only the hours that failed, with the resolution and sites stored for that cycle.
    3. `wait_for_cycle` lists the whole cycle with one S3 request per `poll_interval` and opens when every requested hour is listed, or when f384 (the last file) is out, so an hour still missing will never come. After `max_wait` it fails and the alert says the cycle is late.
    4. `extract` (Python, ecCodes) reads each hour's `.idx`, turns the byte offsets of the needed records into `Range` requests (adjacent UGRD and VGRD become one), verifies each response and decodes the nearest grid point per site, four hours at a time.
    5. `save_cycle_state` and `save_dead_letter` write KV, `build_table` (DuckDB) writes CSV, Parquet and a per-site summary, and `partial_verdict` fails the run if any hour was dead-lettered.

    ## The byte-range technique

    A 0.25 degree GFS file is about 500 MB with roughly 700 GRIB2 messages. Its `.idx` lists each message as `number:byte offset:date:variable:level:forecast`, so a message spans from its offset to the next offset minus one. This flow needs seven messages per hour, fetched in five requests. With the defaults (17 hours, f000 to f048 every 3 h) a run made 101 requests and moved 76 MB instead of 8.9 GB, 0.85 percent of the files. The matching avoids real traps: `UGRD:100 m above ground` versus `UGRD:100 mb`, f000 being `anl` with no precipitation, and `APCP` written twice per hour (a 6-hour bucket and the run total, labelled `0-2 day acc` at f048). The run total is kept and differenced into per-step precipitation.

    ## What this blueprint teaches

    - **LoopUntil as a publication gate** (`wait_for_cycle`): `checkFrequency.interval` and `maxDuration` with `failOnMaxReached: true`. Between polls the task is PAUSED, so a long wait holds no worker slot. The condition covers every hour you need, not just the first file. `io.kestra.plugin.core.flow.WaitFor` is the older name of this task; Kestra 2.0 reports that it "is replaced by LoopUntil". Use LoopUntil when one execution must wait for one thing with a deadline, a trigger when the check should start a new execution, and `retry` for transient errors, not for data that does not exist yet.
    - **Flow `checks`**: five rules (window order, at most 49 hours, 3-hourly grids, a cycle at most 6 h ahead, 1 to 200 sites) reject a bad request with HTTP 422 before any execution exists.
    - **Flow `sla`** (`cycle_deadline`, MAX_DURATION 3 h): bounds the whole run and labels it `sla: breached`.
    - **Flow `afterExecution`** (`record_attempt`, `publish_digest`): sees the final `execution.state` and runs after an SLA breach too, which in testing could end a run before `finally`.
    - **Flow `finally`** (`log_outcome`): one summary line for each run that ends on its own.
    - **KV `ttl`**: cycle state and the dead-letter list expire after 10 days, attempt records after 7, so state stays small.
    - **`concurrency` limit 1, QUEUE**: a replay waits for a scheduled run still in its gate.

    ## Error handling

    | Case | Handling |
    |---|---|
    | Cycle late | Gate fails after `max_wait`; alert says how many hours were listed |
    | Hour missing although the cycle is complete | `MISSING_HOUR`, dead-lettered, other hours kept |
    | Short or corrupt download | Length, `GRIB`...`7777` framing, decoded date and step checked; 4 attempts with backoff, then `CORRUPT_DOWNLOAD` |
    | Server ignores `Range` (HTTP 200) | Stopped before the body is read |
    | Bucket unreachable | `list_cycle` 30 s timeout, 4 attempts with exponential backoff, then alert |
    | Invalid site entry | Rejected with a warning, other sites processed |

    `mode=replay` refetches only the failed hours and merges them into the stored rows; a cycle whose hours failed three times is parked. Slack tasks use `allowFailure`, so a missing webhook never hides the result.

    ## What you get

    - CSV and Parquet (`forecast_csv`, `forecast_parquet`): per site and hour, 2 m temperature, 10 m wind speed and direction, 100 m (hub height) wind, gust, step precipitation, the grid point used and the minutes from cycle start to publication.
    - A per-site summary flagging frost, heat, wind below cut-in or above cut-out and heavy precipitation (`thresholds`), logged and sent as a Slack digest.

    ## Who it's for

    - Energy, commodity and renewables analysts; agriculture and insurance teams watching frost, heat and rain.
    - Data engineers who need a "wait for the file, then process it" pattern.

    ## Why orchestrate this with Kestra

    Cron runs too early or adds latency. Here the wait is declarative with a deadline and an alert, every call has a timeout and retries, failures are isolated per hour, and idempotent, replayable state is a few KV keys with a ttl.

    ## Prerequisites

    - Kestra 2.0 with the Python, GraalVM, DuckDB and Slack plugins, and Docker on the worker. `extract` installs `eccodes` and `eccodeslib` (binary wheels) in `python:3.13-slim`.
    - Outbound HTTPS to `noaa-gfs-bdp-pds.s3.amazonaws.com`. No AWS account or key. NOMADS has the same files but is a shared operational server with usage limits; the AWS copy suits automated access.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: webhook for alerts and the digest (optional; without it those tasks end in WARNING).

    ## Quick start

    1. Execute with the defaults: the latest cycle is processed (the gate waits if it is still arriving).
    2. Execute again: the cycle is skipped. Set `force` to process it again.
    3. On a past cycle, request f117 to f123 with step 1: f121 and f122 do not exist (hourly output stops at f120), so they are dead-lettered and the run fails with an alert.
    4. Run `mode=replay` to retry dead-lettered hours, then enable the schedule.

    ## How to extend

    - Add instantaneous fields to `FIELDS` in `extract`, such as `RH:2 m above ground` or `PRMSL:mean sea level`.
    - Write the Parquet to S3 or a warehouse, or trigger a model flow on success.

    ## Links

    - [LoopUntil](https://kestra.io/plugins/core/flow/io.kestra.plugin.core.flow.loopuntil), [SLA](https://kestra.io/docs/workflow-components/sla), [Checks](https://kestra.io/docs/workflow-components/checks), [afterExecution](https://kestra.io/docs/workflow-components/afterexecution), [finally](https://kestra.io/docs/workflow-components/finally) and [KV Store](https://kestra.io/docs/concepts/kv-store)
    - [NOAA GFS on AWS Open Data](https://registry.opendata.aws/noaa-gfs-bdp-pds/) and [GFS products and inventories](https://www.nco.ncep.noaa.gov/pmb/products/gfs/)
    - [Fast downloading of GRIB files (NOAA CPC)](https://www.cpc.ncep.noaa.gov/products/wesley/fast_downloading_grib.html) and [ecCodes Python](https://github.com/ecmwf/eccodes-python)
  tags:
    - Data
  subTags:
    - ELT & Data Landing
    - Monitoring & Alerting
  ee: false
  demo: false
