id: elasticsearch-circuit-breaker-sentinel
namespace: company.team

inputs:
  - id: elasticsearch_host
    type: STRING
    defaults: elasticsearch.internal:9200
    description: Host and port of the Elasticsearch cluster endpoint.

  - id: elasticsearch_user
    type: STRING
    defaults: elastic
    description: Elasticsearch username.

tasks:
  - id: query_circuit_breakers
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests
    env:
      ES_HOST: "{{ inputs.elasticsearch_host }}"
      ES_USER: "{{ inputs.elasticsearch_user }}"
      ES_PASSWORD: "{{ secret('ELASTICSEARCH_PASSWORD') }}"
    script: |
      import os
      import sys
      import json
      import requests
      from kestra import Kestra

      host = os.environ.get("ES_HOST", "elasticsearch.internal:9200")
      user = os.environ.get("ES_USER", "elastic")
      password = os.environ.get("ES_PASSWORD", "")

      auth = (user, password) if user and password else None
      url = f"http://{host}/_nodes/stats/breaker"

      try:
          resp = requests.get(url, auth=auth, timeout=15)
          resp.raise_for_status()
          data = resp.json().get("nodes", {})
      except Exception as e:
          print(f"CRITICAL: Failed to query Elasticsearch breaker stats at {url}: {e}", file=sys.stderr)
          sys.exit(1)

      total_tripped = 0
      tripped_nodes = []
      for node_id, node_data in data.items():
          name = node_data.get("name", node_id)
          breakers = node_data.get("breakers", {})
          parent_trips = breakers.get("parent", {}).get("tripped", 0)
          fielddata_trips = breakers.get("fielddata", {}).get("tripped", 0)
          request_trips = breakers.get("request", {}).get("tripped", 0)
          node_trips = parent_trips + fielddata_trips + request_trips
          if node_trips > 0:
              total_tripped += node_trips
              tripped_nodes.append({"node": name, "trips": node_trips})

      result = {
          "total_nodes": len(data),
          "total_tripped_breakers": total_tripped,
          "tripped_nodes": tripped_nodes,
          "alert_triggered": total_tripped > 0
      }

      with open("breaker_summary.json", "w") as out:
          json.dump(result, out, indent=2)

      Kestra.outputs({
          "total_nodes": len(data),
          "total_tripped_breakers": total_tripped,
          "alert_triggered": total_tripped > 0
      })
      print("Elasticsearch breaker audit:", result)
    outputFiles:
      - breaker_summary.json

  - id: evaluate_circuit_breakers
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.query_circuit_breakers.vars.alert_triggered }}"
    then:
      - id: alert_es_administrators
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": ":fire: *Elasticsearch Circuit Breaker Alert*: Detected {{ outputs.query_circuit_breakers.vars.total_tripped_breakers }} circuit breaker trips on {{ inputs.elasticsearch_host }}. Memory limits reached preventing out-of-memory crashes."
          }

errors:
  - id: notify_sentinel_error
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": ":warning: *Elasticsearch Sentinel Execution Failure*: Failed to query circuit breaker stats on {{ inputs.elasticsearch_host }}. Execution ID: {{ execution.id }}."
      }

triggers:
  - id: scheduled_breaker_check
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  metaDescription: "Audits Elasticsearch cluster nodes to detect circuit breaker trip events and prevent out-of-memory node crashes."
  metaTitle: Elasticsearch Circuit Breaker Trips and Memory Limit Sentinel with Kestra
  title: Elasticsearch Circuit Breaker Trips and Memory Limit Sentinel
  shortDescription: Audits Elasticsearch cluster nodes to detect circuit breaker trip events and prevent out-of-memory node crashes.
  description: |
    ## How it works
    This flow contacts the Elasticsearch `_nodes/stats/breaker` REST API to evaluate JVM circuit breakers across all cluster data nodes. It tallies trips across parent, fielddata, and in-flight request breakers, alerting search administrators when excessive aggregations or unindexed fields risk node instability.

    ## What you get
    - Continuous validation of Elasticsearch cluster memory safety boundaries.
    - Early warning against oversized analytical queries and fielddata cache blowouts.
    - Automated Slack incident delivery indicating affected node names and trip counts.

    ## Who it's for
    - Search infrastructure engineers and SREs maintaining production Elasticsearch or OpenSearch clusters.
    - Data engineers executing heavy search aggregations.

    ## Why orchestrate this with Kestra
    Kestra automates distributed system observability and incident triage, scheduling lightweight health checks with native error handling and alerting.

    ## Architecture diagram
    ```mermaid
    flowchart TD
      A[scheduled_breaker_check Schedule Trigger] --> B[query_circuit_breakers Python Script]
      B --> C{Breakers Tripped?}
      C -- Yes --> D[alert_es_administrators Slack Webhook]
      C -- No --> E[Audit Complete]
    ```

    ## Prerequisites
    - Elasticsearch HTTP endpoint reachability (default 9200).
    - Secrets `ELASTICSEARCH_PASSWORD` and `SLACK_WEBHOOK_URL` configured in Kestra.

    ## Quick start
    1. Import this blueprint into Kestra under the `company.team` namespace.
    2. Set `elasticsearch_host` and credentials.
    3. Trigger a manual execution to audit circuit breaker states.

    ## How to extend
    - Query `/_cat/indices` to locate indices consuming high fielddata memory.
    - Automatically adjust index settings or clear fielddata caches via automated subflows.
    - Forward circuit breaker metrics to Prometheus or Grafana.

    ## Links
    - [Elasticsearch Circuit Breaker Settings](https://www.elastic.co/guide/en/elasticsearch/reference/current/circuit-breaker.html)
    - [Kestra Slack Notifications](https://kestra.io/plugins/plugin-slack)
  tags:
    - Data
    - Infrastructure
  subTags:
    - Monitoring & Alerting
  ee: false
  demo: false
