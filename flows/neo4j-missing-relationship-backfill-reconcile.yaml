    A second fixture on fresh containers repeated the three that matter most, with its own novelty scan plus review recorded beside the evidence. Slack was a local HTTP sink that recorded both the finding plus the failure alerts.

    ## Prerequisites

    - Neo4j 5 reachable over Bolt. Tested on 5.26.32 community only.
    - A relational system of record exposing one relation with columns `rel_type`, `src_label`, `src_key`, `dst_label`, `dst_key`, one row per edge that should exist. Tested on PostgreSQL 16.15.
    - Nodes already carry a `key` property that matches the source keys. This flow reconciles relationships, so the node loader has to have run.
    - Kestra 2.0.5 with the Neo4j, JDBC Postgres plus Slack plugins.
    - Minimum permissions. Neo4j: read on the graph plus `CREATE_RELATIONSHIP` on the types in `rel_types`. No node write right is needed, no `CREATE_NODE`, no delete right. Postgres: `SELECT` on that one relation.

    ### Secrets

    | Secret | What it is |
    | --- | --- |
    | `NEO4J_USERNAME` | Neo4j user with graph read plus relationship create on the types in scope |
    | `NEO4J_PASSWORD` | password for that user |
    | `SOURCE_USERNAME` | read only database user for the authoritative relation |
    | `SOURCE_PASSWORD` | password for that user |
    | `SLACK_WEBHOOK_URL` | Slack incoming webhook for the finding plus the failure alert |

    ### Inputs

    | Input | Type | Default | What it does |
    | --- | --- | --- | --- |
    | `neo4j_url` | STRING | `bolt://neo4j:7687` | Bolt URI of the graph |
    | `source_url` | STRING | `jdbc:postgresql://postgres:5432/app` | JDBC URL of the system of record. The flow appends its own timeouts |
    | `source_view` | STRING | `public.expected_edges` | the relation declaring which edges should exist |
    | `rel_types` | ARRAY | `[PLACED, CONTAINS, IN_CATEGORY, SHIPPED_TO]` | the only types this flow may ever create |
    | `max_expected` | INT | `5000` | refuse the run when the view returns more rows than this |
    | `max_edges` | INT | `50` | ceiling on relationships created per approved run |
    | `dry_run` | BOOL | `true` | report the gap plus the plan without writing |
    | `auto_remediate` | BOOL | `false` | allow remediation to be considered at all |

    ## Quick start

    1. Add the five secrets above. Grant the Neo4j user relationship create rights only on the types you intend to backfill.
    2. Build or point `source_view` at a relation with one row per edge that should exist. A view over your existing tables is enough, it does not have to be a table.
    3. Execute with the defaults. Nothing is written. Read the report: the gap per type, the bounded plan plus the edges blocked on a missing node.
    4. If edges are blocked, run your node loader first. This flow will not invent an endpoint.
    5. Narrow `rel_types` to the types you own plus set `max_edges` to a number you are willing to read in one go.
    6. Execute with `dry_run: false` plus `auto_remediate: true`. The execution pauses. Read the plan in the `report` task, then resume with `approved: true`.
    7. Read `write_outcome`: every approved edge has to come back `landed: true` with a census drift of exactly those edges. Re-run until the gap reaches zero.
    8. Enable the `hourly_graph_reconcile` trigger once you trust the report. It forces report only mode.

    ## How to extend

    - Point `source_view` at a view that only declares edges newer than the last successful load, which turns a full reconcile into an incremental one.
    - Run the flow once per relationship type with its own schedule plus its own approver, so the team that owns `SHIPPED_TO` approves only that.
    - Swap `io.kestra.plugin.jdbc.postgresql.Query` for the MySQL, Snowflake or BigQuery task when the system of record lives elsewhere. The contract is the five column result plus the character allowlist.
    - Feed `outputs.plan.values.blocked_json` into the ticket or flow that owns node loading, since those are the gaps a relationship backfill can never close.
    - Track `missing_total` per run as a loader health metric. A number that climbs between runs means the loader is still dropping edges rather than catching up.
    - Add a second `Pause` for the types you consider highest risk, keeping the current single approval for the rest.

    Limits: this flow only ever creates relationships. It never creates or deletes a node, never deletes a relationship plus never updates a property, so it cannot fix an edge that exists with wrong properties, a duplicate edge or a reversed edge. It leaves the reversed edge in place and adds the correct one. Relationship properties are not written, so a graph whose edges carry required properties needs the `merge_one` statement extended with an `ON CREATE SET`. The diff is one row per edge, so `max_expected` bounds how large a graph it can reconcile in one execution. `recheck` narrows the approval window but it is not a lock: Neo4j community has no way to reserve the pattern, so an edge created by another writer between `recheck` and `MERGE` is absorbed by the `MERGE` rather than duplicated, while a node deleted in that window makes the statement match nothing, which the read back then fails the run on. Neo4j Enterprise, multi database setups, clustering plus Neo4j 4.x were not tested.

