id: sns-unused-topics-finder
namespace: company.finops

description: |
  Finds SNS topics with zero published messages over 30 days via CloudWatch.
  Dead topics accumulate from deleted services and finished experiments — this
  flow lists them for cleanup so the topic inventory stays honest.

inputs:
  - id: aws_regions
    type: ARRAY
    itemType: STRING
    defaults: ["us-east-1"]
    description: AWS regions to audit for unused SNS topics.
  - id: window_days
    type: INT
    defaults: 30
    description: CloudWatch lookback window in days (default 30).

tasks:
  - id: check_topics
    type: io.kestra.plugin.core.flow.ForEach
    description: Audit SNS topics region by region.
    values: "{{ inputs.aws_regions }}"
    tasks:
      - id: audit_region
        type: io.kestra.plugin.aws.cli.AwsCLI
        description: Check NumberOfMessagesPublished per topic over the lookback window.
        commands:
          - |
            REGION="{{ taskrun.value }}"
            DAYS={{ inputs.window_days }}
            END=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            START=$(date -u -d "$DAYS days ago" +%Y-%m-%dT%H:%M:%SZ)
            echo "Checking SNS topics in $REGION (window: last $DAYS days)"
            aws sns list-topics --region "$REGION" \
              --query 'Topics[].TopicArn' --output text | tr '\t' '\n' | grep -v '^$' > /tmp/topics.txt || true
            UNUSED_COUNT=0
            UNUSED_LIST=""
            while read -r ARN; do
              [ -z "$ARN" ] && continue
              TNAME=$(basename "$ARN")
              PUB=$(aws cloudwatch get-metric-statistics --region "$REGION" \
                --namespace AWS/SNS --metric-name NumberOfMessagesPublished \
                --dimensions Name=TopicName,Value="$TNAME" \
                --start-time "$START" --end-time "$END" \
                --period 2592000 --statistics Sum \
                --query 'sum(Datapoints[].Sum)' --output text 2>/dev/null)
              case "$PUB" in ''|'None') PUB=0;; esac
              PUB_INT=${PUB%.*}
              SUBS=$(aws sns list-subscriptions-by-topic --region "$REGION" --topic-arn "$ARN" \
                --query 'length(Subscriptions)' --output text 2>/dev/null)
              case "$SUBS" in ''|'None') SUBS=0;; esac
              echo "topic $TNAME: ${PUB_INT} published, ${SUBS} subscriptions"
              if [ "$PUB_INT" -eq 0 ]; then
                UNUSED_LIST="${UNUSED_LIST}${TNAME} (${SUBS} subs), "
                UNUSED_COUNT=$((UNUSED_COUNT + 1))
              fi
            done < /tmp/topics.txt
            if [ "$UNUSED_COUNT" -gt 0 ]; then HAS_UNUSED=true; else HAS_UNUSED=false; fi
            echo "HAS_UNUSED=$HAS_UNUSED"
            echo "UNUSED_COUNT=$UNUSED_COUNT"
            echo "UNUSED_TOPICS=$UNUSED_LIST"
            echo "REGION_DONE=$REGION"
        env:
          AWS_ACCESS_KEY_ID: "{{ secret('AWS_ACCESS_KEY_ID') }}"
          AWS_SECRET_ACCESS_KEY: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
          AWS_DEFAULT_REGION: "{{ taskrun.value }}"
      - id: notify_region
        type: io.kestra.plugin.core.flow.If
        description: Report unused topics, stay quiet when every topic publishes.
        condition: "{{ outputs.audit_region.vars.HAS_UNUSED == 'true' }}"
        then:
          - id: slack_unused
            type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
            url: "{{ secret('SLACK_WEBHOOK_URL') }}"
            payload: |
              {
                "text": ":mega: SNS topic audit `{{ outputs.audit_region.vars.REGION_DONE }}` — *{{ outputs.audit_region.vars.UNUSED_COUNT }}* topic(s) with zero publishes over {{ inputs.window_days }}d.\n`{{ outputs.audit_region.vars.UNUSED_TOPICS }}`\nVerify no consumer depends on them, then delete to keep the inventory clean."
              }
        else:
          - id: log_clean
            type: io.kestra.plugin.core.log.Log
            message: "All SNS topics in {{ outputs.audit_region.vars.REGION_DONE }} published in the last {{ inputs.window_days }} days — nothing to clean."

triggers:
  - id: weekly
    type: io.kestra.plugin.core.trigger.Schedule
    description: Weekly on Sunday at 05:00 UTC. Shipped disabled; enable after your first manual run.
    cron: "0 5 * * 0"
    disabled: true

extend:
  title: SNS Unused Topics Finder
  metaTitle: Find Unused SNS Topics | Kestra
  shortDescription: Find SNS topics with zero published messages over 30 days via CloudWatch and get a Slack report for cleanup.
  metaDescription: Dead SNS topics pile up from deleted services. This flow finds zero-publish topics via CloudWatch weekly.
  description: |
    SNS topics are cheap, so nobody deletes them. Every decommissioned service, every finished experiment leaves topics behind — with subscriptions pointing at deleted endpoints. The inventory rots until nobody knows which topics are live. This blueprint finds the dead ones with real publish data.

    ## How it works

    1. A Schedule trigger fires weekly on Sunday at 05:00 UTC (shipped disabled).
    2. A ForEach loop audits each region in `aws_regions`.
    3. Per region, the flow lists SNS topics, then pulls `NumberOfMessagesPublished` (sum) per topic over `window_days` (default 30) from CloudWatch.
    4. Topics with zero publishes are flagged, with their subscription counts as extra context.
    5. An `If` task posts a Slack report listing the unused topics.

    ## What you get

    - A weekly list of SNS topics with zero publishes, including subscription counts.
    - Evidence-based cleanup candidates instead of guessing.
    - Multi-region coverage in one run.
    - Silence when every topic is active.

    ## Who it's for

    Platform teams doing cloud hygiene and anyone inheriting an AWS account with hundreds of mystery topics.

    ## Why orchestrate this with Kestra

    Topic hygiene is a recurring audit across regions — exactly what scheduled flows do well. The lookback window is an input, every run is logged, and the report lands in Slack where the cleanup gets scheduled instead of forgotten.

    ## Prerequisites

    - AWS credentials with `sns:ListTopics`, `sns:ListSubscriptionsByTopic`, and `cloudwatch:GetMetricStatistics` permissions.
    - A Slack incoming webhook URL.

    ### Secrets

    - `AWS_ACCESS_KEY_ID`: AWS access key for the SNS and CloudWatch API calls.
    - `AWS_SECRET_ACCESS_KEY`: AWS secret key for the SNS and CloudWatch API calls.
    - `SLACK_WEBHOOK_URL`: Incoming webhook URL for the unused-topic report.

    ## Quick start

    1. Add the three secrets above to your Kestra namespace.
    2. Set `aws_regions` to the regions where you publish SNS.
    3. Run manually once and review the unused topics.
    4. Enable the weekly schedule trigger.

    ## How to extend

    - Auto-delete topics with zero publishes AND zero subscriptions after N consecutive quiet weeks.
    - Also flag topics whose subscriptions are all in `PendingConfirmation` — a sign of broken setup.
    - Cross-check topic names against your service inventory to catch renamed services.

    ## Links

    - [Kestra AWS plugins](https://kestra.io/plugins)
    - [Kestra Slack plugins](https://kestra.io/plugins)
    - [SNS CloudWatch metrics](https://docs.aws.amazon.com/sns/latest/dg/sns-monitoring-using-cloudwatch.html)
    - [Deleting an SNS topic](https://docs.aws.amazon.com/cli/latest/reference/sns/delete-topic.html)
  tags:
    - Infrastructure
  subTags:
    - FinOps & Cost Management
    - Day 2 Operations
  ee: false
  demo: false
