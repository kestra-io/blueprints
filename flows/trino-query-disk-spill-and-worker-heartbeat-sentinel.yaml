id: trino-query-disk-spill-and-worker-heartbeat-sentinel
namespace: company.sentinel
description: Audits Trino distributed SQL query engine coordinator APIs for dead worker node heartbeats and blocked query spikes to prevent pipeline stall.
inputs:
  - id: trino_coordinator_url
    type: STRING
    defaults: http://trino-coordinator.internal:8080
  - id: max_failed_nodes_threshold
    type: INT
    defaults: 0
  - id: max_blocked_queries_threshold
    type: INT
    defaults: 5
tasks:
  - id: probe_trino_cluster_metrics
    type: io.kestra.plugin.scripts.shell.Commands
    containerImage: ghcr.io/kestra-io/tools:latest
    commands:
      - set -euo pipefail
      - |
        AUTH_HEADER=""
        if [ -n "{{ secret('TRINO_PASSWORD') }}" ]; then
          AUTH_HEADER="-u trino:{{ secret('TRINO_PASSWORD') }}"
        fi

        curl -sf -m 10 $AUTH_HEADER "{{ inputs.trino_coordinator_url }}/v1/cluster" > /tmp/trino_cluster.json 2>/dev/null || echo "{}" > /tmp/trino_cluster.json
        curl -sf -m 10 $AUTH_HEADER "{{ inputs.trino_coordinator_url }}/v1/node" > /tmp/trino_nodes.json 2>/dev/null || echo "[]" > /tmp/trino_nodes.json

        python3 - <<'PY' > /tmp/trino_health.json
        import os, sys, json

        cluster_data = {}
        try:
            with open("/tmp/trino_cluster.json", "r") as f:
                cluster_data = json.load(f)
        except Exception:
            cluster_data = {}

        nodes_data = []
        try:
            with open("/tmp/trino_nodes.json", "r") as f:
                nodes_data = json.load(f)
                if not isinstance(nodes_data, list):
                    nodes_data = []
        except Exception:
            nodes_data = []

        active_workers = 0
        failed_nodes = 0
        for n in nodes_data:
            node_state = n.get("state", "active")
            if node_state == "active":
                active_workers += 1
            else:
                failed_nodes += 1

        running_queries = int(cluster_data.get("runningQueries", 0))
        blocked_queries = int(cluster_data.get("blockedQueries", 0))
        queued_queries = int(cluster_data.get("queuedQueries", 0))

        res = {
            "active_workers": active_workers,
            "failed_nodes": failed_nodes,
            "running_queries": running_queries,
            "blocked_queries": blocked_queries,
            "queued_queries": queued_queries
        }
        print(json.dumps(res))
        PY
    outputFiles:
      - "/tmp/trino_health.json"

  - id: evaluate_cluster_health
    type: io.kestra.plugin.core.flow.If
    condition: "{{ fromJson(read(outputs.probe_trino_cluster_metrics.outputFiles['/tmp/trino_health.json'])).failed_nodes > inputs.max_failed_nodes_threshold or fromJson(read(outputs.probe_trino_cluster_metrics.outputFiles['/tmp/trino_health.json'])).blocked_queries > inputs.max_blocked_queries_threshold }}"
    then:
      - id: notify_slack_alert
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          :warning: *Trino Distributed SQL Cluster Sentinel Alert*
          *Coordinator:* `{{ inputs.trino_coordinator_url }}`
          *Failed Worker Nodes:* `{{ fromJson(read(outputs.probe_trino_cluster_metrics.outputFiles['/tmp/trino_health.json'])).failed_nodes }}` (Threshold: `{{ inputs.max_failed_nodes_threshold }}`)
          *Blocked Queries:* `{{ fromJson(read(outputs.probe_trino_cluster_metrics.outputFiles['/tmp/trino_health.json'])).blocked_queries }}` (Threshold: `{{ inputs.max_blocked_queries_threshold }}`)
          *Active Workers:* `{{ fromJson(read(outputs.probe_trino_cluster_metrics.outputFiles['/tmp/trino_health.json'])).active_workers }}`
          *Running Queries:* `{{ fromJson(read(outputs.probe_trino_cluster_metrics.outputFiles['/tmp/trino_health.json'])).running_queries }}` (Queued: `{{ fromJson(read(outputs.probe_trino_cluster_metrics.outputFiles['/tmp/trino_health.json'])).queued_queries }}`)
          *Action Required:* Investigate Trino worker pod crashes, OOM killer evictions, or slow query table scan locks.

  - id: record_audit_summary
    type: io.kestra.plugin.core.log.Log
    message: "Trino cluster audit completed for {{ inputs.trino_coordinator_url }}. Active workers: {{ fromJson(read(outputs.probe_trino_cluster_metrics.outputFiles['/tmp/trino_health.json'])).active_workers }}, Blocked queries: {{ fromJson(read(outputs.probe_trino_cluster_metrics.outputFiles['/tmp/trino_health.json'])).blocked_queries }}."

errors:
  - id: handle_inspection_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      :rotating_light: *Sentinel Error: Trino Cluster Health Monitor*
      *Execution ID:* `{{ execution.id }}`
      *State:* `{{ execution.state.current }}`
      *Details:* Failed to reach Trino Coordinator HTTP service at `{{ inputs.trino_coordinator_url }}`.

triggers:
  - id: hourly_sentinel_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 * * * *"
    disabled: true

extend:
  title: Trino Query Disk Spill and Worker Node Heartbeat Sentinel
  metaTitle: Trino Query Disk Spill Sentinel | Kestra
  shortDescription: Audits Trino distributed SQL query engine coordinator APIs for dead worker node heartbeats and blocked query spikes.
  metaDescription: Audits Trino distributed SQL query engine coordinator APIs for dead worker node heartbeats and blocked query spikes to prevent pipeline stall.
  tags:
    - Data
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - Data Warehouses
  ee: false
  demo: false
  description: |
    Automated sentinel flow that audits Trino distributed query engine clusters for worker node heartbeat drops, query queuing bottlenecks, and blocked execution stages.

    ## How it works

    1. Scheduled trigger fires hourly (or on-demand) to execute the cluster coordination probe.
    2. Probes Trino Coordinator HTTP endpoints (`/v1/cluster` and `/v1/node`).
    3. Python parser analyzes active versus failed worker node counts and inspects current running, queued, and blocked queries.
    4. An `io.kestra.plugin.core.flow.If` condition checks if worker nodes have failed or if blocked queries breach configured thresholds.
    5. Dispatches formatted Slack alerts containing actionable metrics if an anomaly is detected.
    6. Dedicated `errors` handler captures connection timeouts and coordinator network errors.

    ## What you get

    - Early detection of worker node crashes or network partitions before distributed analytics pipelines stall.
    - Visibility into query deadlocks, resource group queue saturation, and split task blocking.
    - Automated execution audit trail stored in Kestra execution artifacts for data platform reliability audits.

    ## Who it's for

    - Data Platform Engineers and SREs maintaining production Trino or Presto query engines.
    - Analytics Engineers relying on low-latency interactive SQL queries across data lakehouse tables.

    ## Why orchestrate this with Kestra

    - Declarative query engine health auditing without maintaining external Prometheus exporter daemons.
    - Centralized secret management for coordinator passwords via `{{ secret('TRINO_PASSWORD') }}`.
    - Unified alerting and automated remediation pipeline integration in declarative YAML workflows.

    ## Prerequisites

    - Network route from the Kestra worker to the Trino Coordinator HTTP port 8080.
    - Configured secrets in Kestra namespace.

    ### Secrets

    - `TRINO_PASSWORD`: Optional authentication password for secured Trino coordinators.
    - `SLACK_WEBHOOK`: Incoming webhook URL for operational alerts.

    ## Quick start

    1. Deploy this flow to your Kestra instance.
    2. Set `inputs.trino_coordinator_url` to match your Trino coordinator endpoint.
    3. Add the `SLACK_WEBHOOK` secret under the target namespace.
    4. Execute a manual test run to verify telemetry collection.
    5. Enable the `hourly_sentinel_schedule` trigger for continuous monitoring.

    ## How to extend

    - Add automated worker auto-scaling or dead worker node recycling commands inside the `then` branch.
    - Forward historical query backlog counts into ClickHouse or Grafana for capacity planning.
    - Integrate with PagerDuty for critical distributed query engine outages.

    ## Links

    - [Trino Web UI and REST API Documentation](https://trino.io/docs/current/admin/web-interface.html)
    - [Kestra Shell Plugin](https://kestra.io/plugins/plugin-scripts-shell)
    - [Kestra Slack Plugin](https://kestra.io/plugins/plugin-slack)
