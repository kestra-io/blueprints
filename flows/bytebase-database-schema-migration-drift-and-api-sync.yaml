id: bytebase-database-schema-migration-drift-and-api-sync
namespace: company.database

description: |
  Drives the Bytebase Database CI/CD REST API to detect failed schema migration tasks and out-of-band DDL drift. When schema drift or migration errors are identified, this workflow executes direct API calls into Bytebase to trigger an automated schema snapshot re-synchronization and register a compensation rollback issue for database administrators.

concurrency:
  limit: 1

inputs:
  - id: bytebase_api_url
    type: STRING
    displayName: Bytebase API Endpoint URL
    description: Base HTTP URL for the Bytebase database CI/CD server.
    defaults: http://bytebase.database.svc.cluster.local:8080

  - id: project_id
    type: STRING
    displayName: Bytebase Project ID
    description: Identifier for the Bytebase project containing target database migration pipelines.
    defaults: core-payments-db

  - id: database_name
    type: STRING
    displayName: Target Database Name
    description: Logical database name evaluated for migration health and schema consistency.
    defaults: payments_production

  - id: max_drift_violations
    type: INT
    displayName: Maximum Drift Violations Allowed
    description: Maximum allowable schema drift violations before triggering remediation.
    defaults: 0

tasks:
  - id: fetch_failed_migration_issues
    type: io.kestra.plugin.core.http.Request
    description: Queries the Bytebase REST API for failed migration issues in the target project.
    uri: "{{ inputs.bytebase_api_url }}/v1/projects/{{ inputs.project_id }}/issues"
    method: GET
    headers:
      Authorization: "Bearer {{ secret('BYTEBASE_SERVICE_KEY') }}"
      Accept: application/json
    timeout: PT30S
    options:
      followRedirects: true

  - id: fetch_live_database_schema
    type: io.kestra.plugin.core.http.Request
    description: Retrieves the current schema snapshot and drift state directly from Bytebase.
    uri: "{{ inputs.bytebase_api_url }}/v1/projects/{{ inputs.project_id }}/databases/{{ inputs.database_name }}/schema"
    method: GET
    headers:
      Authorization: "Bearer {{ secret('BYTEBASE_SERVICE_KEY') }}"
      Accept: application/json
    timeout: PT30S
    options:
      followRedirects: true

  - id: evaluate_migration_and_schema_health
    type: io.kestra.plugin.scripts.python.Script
    description: Analyzes Bytebase issue statuses and database schema drift with strict loud failure on invalid payloads.
    warningOnStdErr: false
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    env:
      ISSUES_STATUS: "{{ outputs.fetch_failed_migration_issues.statusCode }}"
      ISSUES_BODY: "{{ outputs.fetch_failed_migration_issues.body }}"
      SCHEMA_STATUS: "{{ outputs.fetch_live_database_schema.statusCode }}"
      SCHEMA_BODY: "{{ outputs.fetch_live_database_schema.body }}"
      PROJECT_ID: "{{ inputs.project_id }}"
      DATABASE_NAME: "{{ inputs.database_name }}"
      MAX_DRIFT: "{{ inputs.max_drift_violations }}"
    script: |
      import os
      import sys
      import json
      from kestra import Kestra

      issues_status = int(os.environ.get("ISSUES_STATUS", "0"))
      issues_body = os.environ.get("ISSUES_BODY", "")
      schema_status = int(os.environ.get("SCHEMA_STATUS", "0"))
      schema_body = os.environ.get("SCHEMA_BODY", "")
      project_id = os.environ.get("PROJECT_ID", "unknown")
      database_name = os.environ.get("DATABASE_NAME", "unknown")
      max_drift = int(os.environ.get("MAX_DRIFT", "0"))

      if issues_status != 200 or not issues_body.strip():
          print(f"FATAL: Bytebase issues API returned HTTP {issues_status} with invalid payload.", file=sys.stderr)
          sys.exit(1)

      if schema_status != 200 or not schema_body.strip():
          print(f"FATAL: Bytebase schema API returned HTTP {schema_status} with invalid payload.", file=sys.stderr)
          sys.exit(1)

      try:
          issues_data = json.loads(issues_body)
          schema_data = json.loads(schema_body)
      except Exception as err:
          print(f"FATAL: Failed to parse Bytebase API JSON payloads: {err}", file=sys.stderr)
          sys.exit(1)

      # Extract failed migration issues
      issue_list = issues_data if isinstance(issues_data, list) else issues_data.get("issues", [])
      failed_issues = [
          issue for issue in issue_list
          if issue.get("status") in ["FAILED", "REJECTED", "ERROR"]
          and issue.get("database", "") in [database_name, ""]
      ]

      # Extract schema drift details
      drift_count = int(schema_data.get("schema_drift_count", 0))
      drift_list = schema_data.get("drift_details", [])
      schema_synced = bool(schema_data.get("synced", True))

      requires_remediation = False
      remediation_reasons = []

      if len(failed_issues) > 0:
          requires_remediation = True
          latest_failed = failed_issues[0]
          failed_id = latest_failed.get("name", latest_failed.get("id", "issue-unknown"))
          failed_msg = latest_failed.get("description", "Migration execution failed")
          remediation_reasons.append(f"Failed migration issue detected: {failed_id}")
      else:
          failed_id = "none"
          failed_msg = "none"

      if drift_count > max_drift or not schema_synced:
          requires_remediation = True
          remediation_reasons.append(f"Schema drift detected: {drift_count} violation(s), in_sync={schema_synced}")

      print(f"Bytebase Audit: Project={project_id}, DB={database_name}, Failed Issues={len(failed_issues)}, Drift={drift_count}, Requires Remediation={requires_remediation}")

      Kestra.outputs({
          "requires_remediation": requires_remediation,
          "failed_issues_count": len(failed_issues),
          "failed_issue_id": failed_id,
          "failed_issue_message": failed_msg,
          "schema_drift_count": drift_count,
          "is_schema_synced": schema_synced,
          "remediation_summary": "; ".join(remediation_reasons) if remediation_reasons else "Schema and migrations nominal"
      })

  - id: remediate_bytebase_drift_and_failures
    type: io.kestra.plugin.core.flow.If
    description: Executes native Bytebase API mutation endpoints when migration failures or schema drift are detected.
    condition: "{{ outputs.evaluate_migration_and_schema_health.vars.requires_remediation }}"
    then:
      - id: trigger_bytebase_schema_sync
        type: io.kestra.plugin.core.http.Request
        description: Calls Bytebase API to trigger an immediate schema synchronization snapshot for the database.
        uri: "{{ inputs.bytebase_api_url }}/v1/projects/{{ inputs.project_id }}/databases/{{ inputs.database_name }}:syncSchema"
        method: POST
        headers:
          Authorization: "Bearer {{ secret('BYTEBASE_SERVICE_KEY') }}"
          Content-Type: application/json
        body: "{}"
        timeout: PT60S

      - id: register_compensation_rollback_issue
        type: io.kestra.plugin.core.http.Request
        description: Calls Bytebase API to create a compensation rollback issue for the failed migration task.
        uri: "{{ inputs.bytebase_api_url }}/v1/projects/{{ inputs.project_id }}/issues"
        method: POST
        headers:
          Authorization: "Bearer {{ secret('BYTEBASE_SERVICE_KEY') }}"
          Content-Type: application/json
        body: |
          {
            "title": "Automated Compensation Rollback for {{ outputs.evaluate_migration_and_schema_health.vars.failed_issue_id }}",
            "description": "Triggered by Kestra automated operational guardrail to reconcile schema drift and failed migration on database '{{ inputs.database_name }}'. Reason: {{ outputs.evaluate_migration_and_schema_health.vars.remediation_summary }}",
            "type": "ROLLBACK",
            "database": "{{ inputs.database_name }}"
          }
        timeout: PT30S

      - id: verify_post_remediation_schema
        type: io.kestra.plugin.core.http.Request
        description: Queries Bytebase API following remediation to verify that the schema synchronization completed.
        uri: "{{ inputs.bytebase_api_url }}/v1/projects/{{ inputs.project_id }}/databases/{{ inputs.database_name }}/schema"
        method: GET
        headers:
          Authorization: "Bearer {{ secret('BYTEBASE_SERVICE_KEY') }}"
          Accept: application/json
        timeout: PT30S

  - id: log_reconciliation_verdict
    type: io.kestra.plugin.core.log.Log
    description: Logs the final operational status of the Bytebase schema and migration evaluation.
    message: "Bytebase CI/CD reconciliation concluded for database '{{ inputs.database_name }}'. Remediation Triggered: {{ outputs.evaluate_migration_and_schema_health.vars.requires_remediation }}. Summary: {{ outputs.evaluate_migration_and_schema_health.vars.remediation_summary }}."

triggers:
  - id: periodic_bytebase_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 */2 * * *"

extend:
  title: Bytebase Database Schema Migration Drift and API Sync
  metaTitle: Bytebase Database Schema Migration Drift and API Sync Blueprint
  shortDescription: Drives the Bytebase REST API to detect failed migrations and schema drift, automating schema sync and rollback issues.
  metaDescription: Drives Bytebase REST API to detect failed migrations and schema drift, triggering automated schema re-sync and compensation rollback issues.
  description: |
    Enterprise database infrastructure governed by Bytebase requires active surveillance to ensure that database schema migrations execute smoothly and that live database instances do not diverge from version-controlled Git repositories. When concurrent transaction locks, query statement timeouts, or out-of-band manual DDL changes occur, Bytebase flags failed migration tasks and schema drift violations. This blueprint provides a native, API-driven orchestration workflow that interacts directly with Bytebase's REST endpoints: it queries active project issues and database schema snapshots, evaluates migration failures and drift metrics in Python, calls Bytebase's syncSchema API endpoint to re-align database metadata, registers an automated compensation rollback issue directly in Bytebase, and verifies the resulting database schema status.

    ## How it works
    1. A schedule trigger initiates the Bytebase operational audit every 2 hours.
    2. A native HTTP request task queries Bytebase's REST API endpoint `/v1/projects/{project}/issues` for failed migration issues.
    3. A secondary HTTP request task queries `/v1/projects/{project}/databases/{database}/schema` to retrieve the active schema snapshot and drift state.
    4. A Python script evaluates issue statuses and drift counts with strict loud failure on API errors or malformed payloads.
    5. When failures or drift are identified, an `If` conditional task executes remediation actions directly against Bytebase APIs.
    6. A native HTTP request task invokes Bytebase's `:syncSchema` API endpoint to trigger an immediate schema synchronization on the target database.
    7. A secondary HTTP request task calls Bytebase's `/issues` endpoint to register a structured compensation rollback issue for database administrators.
    8. A post-remediation HTTP request queries the database schema to verify that synchronization succeeded and updates the audit log.

    ## Architecture diagram
    ```mermaid
    graph TD
        Trigger[Schedule Trigger: 2h] --> FetchIssues[HTTP Request: Query Bytebase Issues]
        Trigger --> FetchSchema[HTTP Request: Query Database Schema]
        FetchIssues --> EvalHealth[Python Script: Parse Issues & Schema Drift]
        FetchSchema --> EvalHealth
        EvalHealth --> CheckRemediation{Remediation Required?}
        CheckRemediation -- Yes --> SyncSchema[HTTP Request: POST databases:syncSchema]
        SyncSchema --> CreateRollback[HTTP Request: POST projects/issues Rollback]
        CreateRollback --> VerifyPost[HTTP Request: Query Updated Schema]
        VerifyPost --> FinalLog[Log: Audit Concluded]
        CheckRemediation -- No --> NominalLog[Log: Schema In Sync]
        NominalLog --> FinalLog
    ```

    ## What you get
    - Native API orchestration driving Bytebase without intermediate shell scripts or CLI installation wrappers.
    - Automated detection of failed migration rollouts and out-of-band DDL drift.
    - Direct invocation of Bytebase's `:syncSchema` endpoint to synchronize database metadata with GitOps state.
    - Automated creation of formal compensation rollback issues inside Bytebase's issue tracking system.
    - End-to-end post-remediation verification confirming that live database instances are properly aligned.

    ## Who it's for
    - Database Administrators (DBAs) managing PostgreSQL, MySQL, ClickHouse, and Snowflake instances via Bytebase.
    - Platform Engineers integrating database schema change governance into automated CI/CD pipelines.
    - Site Reliability Engineers safeguarding production databases against migration lockouts and syntax failures.
    - DevOps Teams standardizing automated disaster recovery and compensation patterns for database deployments.

    ## Why orchestrate this with Kestra
    - **Native HTTP Request Integration**: Communicates directly with Bytebase REST API endpoints using standard authentication headers without external binary dependencies.
    - **Declarative Conditional Branching**: Isolates remediation API calls behind strictly evaluated threshold conditions.
    - **Automated Continuous Surveillance**: Executes periodic schema health audits on a customizable cron schedule.
    - **Centralized Secrets Governance**: Protects sensitive Bytebase service account tokens using encrypted namespace secrets.
    - **Transparent Audit Trail**: Captures all API responses, evaluated drift counts, and remediation issue IDs in Kestra execution history.

    ## Use cases
    - **Automated Schema Re-Synchronization**: Triggers Bytebase schema sync immediately when manual table alterations cause catalog drift.
    - **Compensation Rollback Automation**: Automatically registers compensation rollback tickets in Bytebase when scheduled migrations fail mid-execution.
    - **Continuous Database CI/CD Auditing**: Ensures that all managed database instances remain in sync with repository-defined schema configurations.

    ## Inputs
    | Name | Type | Default | Description |
    | --- | --- | --- | --- |
    | `bytebase_api_url` | STRING | `http://bytebase.database.svc.cluster.local:8080` | Base HTTP URL for the Bytebase database CI/CD server. |
    | `project_id` | STRING | `core-payments-db` | Identifier for the Bytebase project containing target database migration pipelines. |
    | `database_name` | STRING | `payments_production` | Logical database name evaluated for migration health and schema consistency. |
    | `max_drift_violations` | INT | `0` | Maximum allowable schema drift violations before triggering remediation. |

    ## Expected outputs
    - `{{ outputs.evaluate_migration_and_schema_health.vars.requires_remediation }}`: Boolean flag indicating if schema sync or rollback was required.
    - `{{ outputs.evaluate_migration_and_schema_health.vars.failed_issues_count }}`: Number of failed migration issues detected in Bytebase.
    - `{{ outputs.evaluate_migration_and_schema_health.vars.schema_drift_count }}`: Count of schema drift violations reported by Bytebase.
    - `{{ outputs.trigger_bytebase_schema_sync.statusCode }}`: HTTP response status code from Bytebase schema sync invocation.
    - `{{ outputs.register_compensation_rollback_issue.statusCode }}`: HTTP response status code from compensation issue creation.

    ## Prerequisites
    - Bytebase server accessible over HTTP or HTTPS on port 8080.
    - Bytebase service key with permissions to read project issues, trigger schema sync, and create issues.
    - Network connectivity from Kestra workers to the Bytebase API endpoint.
    - Secret configured in Kestra under `BYTEBASE_SERVICE_KEY`.

    ### Secrets
    - `BYTEBASE_SERVICE_KEY`: Service account token used to authenticate API calls against Bytebase.

    ## Quick start
    1. Confirm that your Bytebase server is running and accessible at `bytebase_api_url`.
    2. Add the `BYTEBASE_SERVICE_KEY` secret within your Kestra namespace settings.
    3. Specify your project identifier in `project_id` and database name in `database_name`.
    4. Run a manual execution via the Kestra UI to verify that issues and schema endpoints return valid JSON.
    5. Enable the `periodic_bytebase_audit` schedule trigger to establish automated surveillance.

    ## Common pitfalls and troubleshooting
    - **Bytebase Service Key Permissions**: Verify that the service token has read and write permissions on the specified project; insufficient permissions result in HTTP 403 Forbidden.
    - **Database Connectivity**: Bytebase must maintain active connectivity to the underlying database instance to perform schema synchronization.
    - **Network Firewalls**: Ensure Kestra worker nodes can reach the Bytebase API without being blocked by ingress firewalls or proxy filters.
    - **Project ID Accuracy**: Project IDs are case-sensitive in Bytebase API v1; double-check the project slug in the Bytebase UI.

    ## How to extend
    - **PagerDuty Incident Routing**: Add a PagerDuty alert task when compensation rollback issues are registered for critical production databases.
    - **Slack Team Notification**: Add a Slack notification task informing database operations channels when schema re-syncs are initiated.
    - **Multi-Database Loops**: Wrap the schema audit in a Kestra `ForEach` task to monitor entire database clusters across multiple projects simultaneously.

    ## Links
    - [Kestra HTTP Plugin Documentation](https://kestra.io/plugins/plugin-core/io.kestra.plugin.core.http.request)
    - [Kestra Flow Control Documentation](https://kestra.io/plugins/plugin-core/io.kestra.plugin.core.flow.if)
    - [Bytebase Official Documentation](https://www.bytebase.com/docs/)
    - [Bytebase API Reference](https://api.bytebase.com/)
  tags:
    - Infrastructure
    - Data
  subTags:
    - Day 2 Operations
    - CI/CD & Deployment
  ee: false
  demo: false
