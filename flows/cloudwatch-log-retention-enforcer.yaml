id: cloudwatch-log-retention-enforcer
namespace: company.team

description: |
  Enforce CloudWatch Logs retention policies across regions. Log groups with
  retention set to Never Expire — or longer than your max — accumulate logs
  forever and quietly inflate the CloudWatch bill. This flow audits every
  log group, flags the violators, and only applies your target retention
  when you flip `enforce` to true. Dry-run by default; nothing changes
  unless you say so.

triggers:
  - id: weekly
    type: io.kestra.plugin.core.trigger.Schedule
    description: Weekly on Monday at 09:00 UTC. Shipped disabled; enable after your first manual run.
    cron: "0 9 * * 1"
    disabled: true

inputs:
  - id: aws_regions
    "type": ARRAY
    itemType: STRING
    defaults: ["us-east-1"]
    description: AWS regions to audit for log group retention violations.
  - id: target_retention_days
    "type": INT
    defaults: 30
    description: Retention in days applied to violators when enforce is true. Must be a valid CloudWatch value (1, 3, 5, 7, 14, 30, 60, 90, 120, 150, 180, 365, 400, 545, 731, 1096, 1827, 2192, 2557, 2922, 3288, 3653).
  - id: max_allowed_days
    "type": INT
    defaults: 90
    description: Log groups with retention longer than this (or Never Expire) are flagged as violators.
  - id: enforce
    "type": BOOLEAN
    defaults: false
    description: "When true, applies target_retention_days to every violating log group. Default false (report only)."

tasks:
  - id: audit_regions
    type: io.kestra.plugin.core.flow.ForEach
    description: Audit log group retention region by region.
    values: "{{ inputs.aws_regions }}"
    tasks:
      - id: audit_region
        type: io.kestra.plugin.aws.cli.AwsCLI
        description: List log groups, flag NeverExpire/over-limit retention, optionally enforce the target.
        region: "{{ taskrun.value }}"
        accessKeyId: "{{ secret('AWS_ACCESS_KEY_ID') }}"
        secretKeyId: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
        commands:
          - |
            REGION="{{ taskrun.value }}"
            export TARGET="{{ inputs.target_retention_days }}"
            export MAXD="{{ inputs.max_allowed_days }}"
            echo "Auditing CloudWatch log retention in $REGION (target=$TARGET days, max allowed=$MAXD days, enforce={{ inputs.enforce }})"
            aws logs describe-log-groups --region "$REGION" \
              --query 'logGroups[].[logGroupName,retentionInDays]' --output json > /tmp/groups.json
            python3 << 'PYEOF' > /tmp/viol.txt
            import json, os
            target = int(os.environ["TARGET"]); maxd = int(os.environ["MAXD"])
            groups = json.load(open("/tmp/groups.json")) or []
            viol = []
            for name, ret in groups:
                if ret is None:
                    viol.append((name, "NeverExpire"))
                elif int(ret) > maxd:
                    viol.append((name, "%sd" % ret))
            clean = lambda s: s.replace('"', '').replace("\\", "")
            open("/tmp/viol_names.txt", "w").write("\n".join(n for n, _ in viol))
            print("VIOL_COUNT=%d" % len(viol))
            print("GROUP_COUNT=%d" % len(groups))
            sample = "; ".join("%s (%s)" % (clean(n), r) for n, r in viol[:10])
            print("VIOL_GROUPS=%s" % (sample if sample else "none"))
            if viol:
                print("VIOLATIONS_FOUND")
            PYEOF
            cat /tmp/viol.txt
            VIOL_COUNT=$(grep '^VIOL_COUNT=' /tmp/viol.txt | cut -d= -f2)
            ENFORCED=0
            if [ "{{ inputs.enforce }}" = "true" ] && [ "$VIOL_COUNT" -gt 0 ]; then
              while IFS= read -r LG; do
                [ -z "$LG" ] && continue
                if aws logs put-retention-policy --region "$REGION" \
                     --log-group-name "$LG" --retention-in-days "$TARGET" 2>/tmp/err.txt; then
                  echo "ENFORCED $LG -> $TARGET days"
                  ENFORCED=$((ENFORCED + 1))
                else
                  echo "FAILED $LG: $(head -c 200 /tmp/err.txt)"
                fi
              done < /tmp/viol_names.txt
            fi
            echo "ENFORCED_COUNT=$ENFORCED"
            echo "REGION_DONE=$REGION"
      - id: decide_notify
        type: io.kestra.plugin.core.flow.If
        description: Report retention violators, stay quiet on clean regions.
        condition: "{{ outputs.audit_region.stdout contains 'VIOLATIONS_FOUND' }}"
        then:
          - id: slack_violations
            type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
            description: Report log groups with bad retention and what was enforced.
            url: "{{ secret('SLACK_WEBHOOK_URL') }}"
            payload: |
              {
                "text": ":file_cabinet: *CloudWatch log retention* — `{{ outputs.audit_region.vars.REGION_DONE }}`: *{{ outputs.audit_region.vars.VIOL_COUNT }}* of {{ outputs.audit_region.vars.GROUP_COUNT }} log group(s) violate the policy (Never Expire or > {{ inputs.max_allowed_days }}d).\n`{{ outputs.audit_region.vars.VIOL_GROUPS }}`\nMode: enforce={{ inputs.enforce }} — retention policies applied: {{ outputs.audit_region.vars.ENFORCED_COUNT }} (target {{ inputs.target_retention_days }}d)."
              }
        else:
          - id: log_clean
            type: io.kestra.plugin.core.log.Log
            message: "CloudWatch log retention clean in {{ outputs.audit_region.vars.REGION_DONE }} — every log group is within the {{ inputs.max_allowed_days }}-day policy."

extend:
  title: CloudWatch Log Retention Enforcer
  metaTitle: Enforce CloudWatch Log Group Retention Policies | Kestra
  shortDescription: Audit CloudWatch log groups across regions for Never Expire or over-limit retention, and optionally enforce your target retention in days. Dry-run by default.
  metaDescription: Log groups with Never Expire retention pile up CloudWatch costs. This flow finds them and enforces your retention policy weekly.
  description: |
    Every log group you create without a retention setting keeps its logs forever — "Never Expire" is the CloudWatch default, and it bills you for every ingested byte until someone notices. Across dozens of Lambda functions, ECS services, and ad-hoc debugging sessions, that adds up to real money for logs nobody will ever read again. This blueprint turns retention hygiene into a scheduled habit.

    ## How it works

    1. A Schedule trigger fires weekly on Monday at 09:00 UTC (shipped disabled).
    2. A ForEach loop audits each region in `aws_regions`.
    3. Per region, the flow lists all log groups via `describe-log-groups` and flags any with no retention (Never Expire) or retention above `max_allowed_days` (default 90).
    4. When `enforce` is true, it applies `put-retention-policy` with `target_retention_days` (default 30) to every violator; otherwise it only reports.
    5. An `If` task posts a Slack report listing the violating groups and how many were fixed — and stays quiet on clean regions.

    ## What you get

    - A weekly list of log groups hoarding logs past your policy, with their current retention as evidence.
    - Optional one-click enforcement: flip `enforce` to true and the flow applies your target retention itself.
    - Multi-region coverage in one run, with per-group success/failure lines in the task log.
    - Silence when everything complies — alerts only on real findings.

    ## Who it's for

    Platform and FinOps engineers who suspect their CloudWatch bill is mostly logs from functions that were deleted months ago.

    ## Why orchestrate this with Kestra

    Retention settings drift the moment someone creates a log group by hand or ships a template without the property. As a scheduled Kestra flow the audit runs itself, the policy thresholds are inputs anyone can tune, every enforcement is logged for audit, and dry-run mode lets you review before anything changes.

    ## Prerequisites

    - AWS credentials with `logs:DescribeLogGroups` and `logs:PutRetentionPolicy` permissions.
    - A Slack incoming webhook URL.

    ### Secrets

    - `AWS_ACCESS_KEY_ID`: AWS access key for the CloudWatch Logs API calls.
    - `AWS_SECRET_ACCESS_KEY`: AWS secret key for the CloudWatch Logs API calls.
    - `SLACK_WEBHOOK_URL`: Incoming webhook URL for the retention-violation report.

    ## Quick start

    1. Add the three secrets above to your Kestra namespace.
    2. Set `aws_regions` to the regions you run workloads in.
    3. Run manually once with `enforce: false` and review the Slack report.
    4. Flip `enforce` to true when you're happy, then enable the weekly schedule trigger.

    ## How to extend

    - Exclude log groups tagged `Retention=keep` for compliance workloads that must keep logs longer.
    - Add a second tier: warn at 90 days, auto-enforce at 180.
    - Export the violator list to S3 for a longer-lived compliance trail.

    ## Links

    - [Kestra AWS plugins](https://kestra.io/plugins)
    - [Kestra Slack plugins](https://kestra.io/plugins)
    - [CloudWatch Logs retention values](https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/S3Export.html)
    - [put-retention-policy API](https://docs.aws.amazon.com/cli/latest/reference/logs/put-retention-policy.html)
  tags:
    - Infrastructure
  subTags:
    - FinOps & Cost Management
    - Monitoring & Alerting
  ee: false
  demo: false
