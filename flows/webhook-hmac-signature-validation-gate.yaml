id: webhook-hmac-signature-validation-gate
namespace: company.team
description: |
  Verify the HMAC-SHA256 signature on an inbound webhook before anything
  processes it: constant-time comparison against the signing secret, a KV
  record of every attempt, an alerted hard-fail for unauthorized calls,
  and the verified payload persisted to internal storage.

triggers:
  - id: inbound_webhook
    type: io.kestra.plugin.core.trigger.Webhook
    description: Receives the signed request. Anyone with the key can reach the URL, which is exactly why the signature check below is mandatory.
    key: "{{ secret('SIGNED_WEBHOOK_KEY') }}"

inputs:
  - id: signature_header
    type: STRING
    defaults: X-Hub-Signature-256
    description: Header carrying the hex HMAC-SHA256 digest — case-insensitive lookup, and an optional "sha256=" prefix is stripped automatically (GitHub style).

tasks:
  - id: verify_signature
    type: io.kestra.plugin.scripts.python.Script
    description: Recompute the HMAC-SHA256 of the raw body with the shared signing secret and compare in constant time — never with == — so forged or tampered payloads are rejected before any processing.
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    env:
      SIGNING_SECRET: "{{ secret('WEBHOOK_SIGNING_SECRET') }}"
      SIGNATURE_HEADER: "{{ inputs.signature_header }}"
      HEADERS_JSON: "{{ trigger.headers | toJson }}"
      BODY: "{{ trigger.body }}"
    script: |
      import hashlib
      import hmac
      import json
      import os

      body = os.environ.get("BODY", "")
      secret = os.environ["SIGNING_SECRET"]
      header_name = os.environ.get("SIGNATURE_HEADER", "X-Hub-Signature-256")
      headers = {k.lower(): v for k, v in json.loads(os.environ.get("HEADERS_JSON", "{}")).items()}

      provided = (headers.get(header_name.lower()) or "").strip()
      if not provided:
          valid, reason = False, "missing header " + header_name
      else:
          candidate = provided[7:] if provided.lower().startswith("sha256=") else provided
          expected = hmac.new(secret.encode("utf-8"), body.encode("utf-8"), hashlib.sha256).hexdigest()
          valid = hmac.compare_digest(candidate.lower(), expected)
          reason = "signature verified" if valid else "signature mismatch"

      print("webhook " + reason)
      print("::" + json.dumps({"outputs": {"valid": valid, "reason": reason}}) + "::")

  - id: record_attempt
    type: io.kestra.plugin.core.kv.Set
    description: Keep the latest verdict in the namespace KV store, so dashboards and other flows can read the outcome of the most recent attempt without digging through execution history.
    key: WEBHOOK_GATE_LAST_ATTEMPT
    value: '{"execution": "{{ execution.id }}", "received_at": "{{ execution.startDate }}", "valid": {{ outputs.verify_signature.vars.valid }}, "reason": "{{ outputs.verify_signature.vars.reason }}"}'

  - id: enforce_signature
    type: io.kestra.plugin.core.flow.If
    description: The security branch — unauthorized requests alert and fail, verified payloads are persisted for downstream processing.
    condition: "{{ not (outputs.verify_signature.vars.valid) }}"
    then:
      - id: alert_intrusion_attempt
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Tell the security channel which check failed — missing header or mismatch — plus the execution to inspect.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "Webhook gate: rejected unauthorized attempt on {{ flow.id }} ({{ outputs.verify_signature.vars.reason }}). Execution {{ execution.id }}."
          }
      - id: reject_request
        type: io.kestra.plugin.core.execution.Fail
        description: End the execution as failed so the rejection is visible in monitoring instead of looking like a quiet success.
        errorMessage: "Webhook rejected: {{ outputs.verify_signature.vars.reason }}"
    else:
      - id: persist_event
        type: io.kestra.plugin.core.storage.Write
        description: Land the verified payload in internal storage as JSON — the URI output is what a downstream flow, subflow, or queue consumer picks up.
        content: "{{ trigger.body }}"
        extension: ".json"

errors:
  - id: alert_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alert when the gate itself errors — broken secret, storage problem — so infrastructure failures are never confused with rejected requests.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "Webhook HMAC gate ERRORED in flow {{ flow.id }} (execution {{ execution.id }}). This is an infrastructure failure (signing secret or storage), not necessarily a rejected request — check the execution logs."
      }

outputs:
  - id: verified
    type: BOOL
    description: Whether the inbound payload passed the HMAC-SHA256 check, e.g. true.
    value: "{{ outputs.verify_signature.vars.valid }}"
  - id: reason
    type: STRING
    description: 'Verdict detail, e.g. "signature verified", "signature mismatch", or "missing header X-Hub-Signature-256".'
    value: "{{ outputs.verify_signature.vars.reason }}"
  - id: payload_uri
    type: STRING
    description: 'Storage URI of the persisted verified payload (empty when the request was rejected), e.g. io.kestra.storage:.../payload.json.'
    value: "{{ outputs.persist_event.uri ?? '' }}"

extend:
  title: Verify Webhook HMAC Signatures Before Processing
  shortDescription: Authenticate inbound webhooks with constant-time HMAC-SHA256 verification, audit every attempt in KV, reject forgeries with an alert, and persist verified payloads.
  metaTitle: HMAC Signature Verification for Webhooks with Kestra
  metaDescription: Authenticate inbound webhooks with constant-time HMAC-SHA256 checks, audit every attempt in KV, alert on forgeries, and persist verified payloads.
  description: |
    A webhook URL is an open door: anyone who learns the key can start executions, and an unverified payload is trusted data wearing a costume. This blueprint closes the door with the same mechanism GitHub, Stripe, and every serious sender use — an HMAC-SHA256 signature over the raw body, verified with `hmac.compare_digest` so even the comparison cannot leak through timing. Every attempt (valid or not) is recorded in the namespace KV store, forgeries trigger a Slack alert and a failed execution so they show up in monitoring, and verified payloads are persisted to internal storage with a URI output that downstream flows consume.

    ## How it works

    1. The `inbound_webhook` trigger (`io.kestra.plugin.core.trigger.Webhook`) exposes a keyed URL and hands the raw payload to `{{ trigger.body }}` and the request headers to `{{ trigger.headers }}`.
    2. `verify_signature` (`io.kestra.plugin.scripts.python.Script` on the `io.kestra.plugin.core.runner.Process` runner) receives the headers map (lowercased for a case-insensitive lookup), the configured header name, the body, and the signing secret through the environment. It strips an optional `sha256=` prefix, recomputes `HMAC-SHA256(secret, body)` as lowercase hex, and compares with `hmac.compare_digest` — constant-time, never `==`. It emits `valid` and a human-readable `reason` through Kestra's outputs protocol.
    3. `record_attempt` (`io.kestra.plugin.core.kv.Set`) writes the execution ID, timestamp, verdict, and reason to `WEBHOOK_GATE_LAST_ATTEMPT`, giving dashboards and other flows a single key to read.
    4. `enforce_signature` (`io.kestra.plugin.core.flow.If`) branches on the verdict. Rejected: `alert_intrusion_attempt` posts the reason to Slack and `reject_request` (`io.kestra.plugin.core.execution.Fail`) turns the execution red. Verified: `persist_event` (`io.kestra.plugin.core.storage.Write`) lands the payload as JSON in internal storage and exposes its URI.
    5. The `errors` block alerts Slack only on genuine infrastructure failures, worded explicitly so an errored gate is never mistaken for a rejected request.

    ## What you get

    - Cryptographic proof that an inbound payload really came from the sender who shares your signing secret.
    - A constant-time comparison — timing side channels closed by construction.
    - An audit trail of the latest attempt in KV, plus full attempt history in Kestra executions.
    - Unauthorized calls that are loud (Slack) and visible (failed execution), not silent drops.
    - Verified payloads landing in internal storage with a `payload_uri` output ready for a downstream flow or subflow.

    ## Who it's for

    - Teams exposing Kestra webhook endpoints to GitHub, Stripe, or any HMAC-signing sender.
    - Security engineers who need forged-request rejection with alerting, not just a keyed URL.
    - Builders replacing "trust the URL key alone" with real payload authentication.

    ## Why orchestrate this with Kestra

    The Kestra webhook trigger guards the URL; nothing in a bare receiver guards the payload. Kestra makes the check a versioned, testable flow step: the verification logic is plain Python in the execution logs, the accept/reject decision is a declarative `If`, rejections become failed executions your alerting already watches, and the KV audit plus storage hand-off wire the result into the rest of your orchestration. In a custom server this same logic hides in framework middleware with no history, no alerts, and no downstream lineage.

    ## Prerequisites

    - A sender that signs payloads with HMAC-SHA256 and a shared secret (GitHub: secret token; Stripe-style: signing secret). The secret must match exactly what the sender uses.
    - Text payloads (JSON or plain text) — Kestra exposes the body as a string, so binary bodies are out of scope.
    - Python 3 on the Kestra worker (Process runner), or switch `verify_signature` to a Docker task runner.
    - A Slack incoming webhook for rejection and infrastructure alerts.

    ### Secrets

    - `WEBHOOK_SIGNING_SECRET`: shared signing secret; must match the sender's configuration byte for byte.
    - `SIGNED_WEBHOOK_KEY`: key segment of the webhook URL — treat it as a secret, but do not rely on it alone.
    - `SLACK_WEBHOOK_URL`: Slack incoming webhook URL.

    ## Quick start

    1. Add the three secrets to your Kestra namespace and make `WEBHOOK_SIGNING_SECRET` identical to the sender's secret.
    2. Point the sender at `/api/v1/{tenant}/executions/webhook/{namespace}/webhook-hmac-signature-validation-gate/{SIGNED_WEBHOOK_KEY}`.
    3. Test locally before wiring the sender — sign a body with OpenSSL and curl the endpoint:

       ```bash
       BODY='{"event":"demo"}'
       SIG=$(printf '%s' "$BODY" | openssl dgst -sha256 -hmac "your-signing-secret" | awk '{print $NF}')
       curl -X POST "$WEBHOOK_URL" \
         -H "Content-Type: application/json" \
         -H "X-Hub-Signature-256: sha256=$SIG" \
         -d "$BODY"
       ```

       Expect a successful execution with `verified: true` and a `payload_uri`; send the same body with a wrong signature and expect the Slack rejection alert and a failed execution with `reason: signature mismatch`.
    4. Read the verdict any time with `{{ kv('WEBHOOK_GATE_LAST_ATTEMPT') }}`.

    ## How to extend

    - **Stripe-style headers:** sign `"<timestamp>.<body>"` instead of the raw body and parse `t=...,v1=...` — the script change is three lines, and the timestamp then enables a replay window.
    - **Replay protection:** compare the signature's embedded timestamp against `now()` and reject anything older than a tolerance input.
    - **Real processing:** replace `persist_event` with an `io.kestra.plugin.core.http.Request` forward, a `Subflow` call, or a queue publish — the verification half stays untouched.
    - **Multiple senders:** give each tenant its own secret and select it with a `Switch` task keyed on a path or header.
    - **Noise control:** downgrade repeated rejections from Slack to a daily digest while keeping every attempt in KV.

    ## Links

    - [Validating webhook deliveries (GitHub)](https://docs.github.com/en/webhooks/using-webhooks/validating-webhook-deliveries)
    - [Verify payload signatures (Stripe)](https://docs.stripe.com/webhooks#verify-payload)
    - [Webhook trigger documentation](https://kestra.io/docs/workflow-triggers)
    - [Slack plugin documentation](https://kestra.io/plugins/plugin-slack)
  tags:
    - Core
    - Infrastructure
  subTags:
    - Realtime Events
    - Flow Control & Conditions
  ee: false
  demo: false
