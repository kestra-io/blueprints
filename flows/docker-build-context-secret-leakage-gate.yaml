id: docker-build-context-secret-leakage-gate
namespace: company.infrastructure
description: |
  Audit a real Dockerfile and its .dockerignore file before a container image is built. The flow
  checks broad build-context copies, missing exclusions for common secret and private-key files,
  secret-like ARG/ENV values, floating base-image tags, remote ADD instructions, and missing
  non-root USER declarations. It produces a JSON report and can block a build when literal secrets
  are detected.

inputs:
  - id: dockerfile_url
    type: STRING
    displayName: Raw Dockerfile URL
    defaults: https://raw.githubusercontent.com/docker/awesome-compose/master/react-express-mongodb/backend/Dockerfile
    description: HTTPS URL to the Dockerfile hosted on raw.githubusercontent.com.
  - id: dockerignore_url
    type: STRING
    displayName: Raw .dockerignore URL
    defaults: https://raw.githubusercontent.com/docker/awesome-compose/master/react-express-mongodb/backend/.dockerignore
    description: HTTPS URL to the corresponding .dockerignore file in the same directory and repository branch.
  - id: require_non_root_user
    type: BOOL
    displayName: Require non-root USER instruction
    defaults: true
    description: Warn when the final build stage does not declare a USER instruction.
  - id: fail_on_literal_secrets
    type: BOOL
    displayName: Fail on literal secrets
    defaults: true
    description: Fail the execution when a sensitive ARG or ENV assignment appears to embed a literal credential.

triggers:
  - id: weekly_build_context_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: Re-audit the configured public Dockerfile and ignore rules weekly. Keep disabled until the source and policy are reviewed.
    cron: "0 8 * * 1"
    disabled: true

tasks:
  - id: validate_source_urls
    type: io.kestra.plugin.scripts.python.Script
    description: Ensure both files are public raw GitHub content in the same directory and reject non-public DNS destinations.
    containerImage: python:3.12-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    env:
      DOCKERFILE_URL: "{{ inputs.dockerfile_url }}"
      DOCKERIGNORE_URL: "{{ inputs.dockerignore_url }}"
    script: |
      import ipaddress
      import os
      import socket
      from urllib.parse import urlsplit
      from posixpath import dirname

      dockerfile = urlsplit(os.environ.get("DOCKERFILE_URL", "").strip())
      dockerignore = urlsplit(os.environ.get("DOCKERIGNORE_URL", "").strip())
      for label, url in (("dockerfile_url", dockerfile), ("dockerignore_url", dockerignore)):
          if url.scheme.lower() != "https" or url.hostname != "raw.githubusercontent.com":
              raise ValueError(f"{label} must use HTTPS on raw.githubusercontent.com")
          if url.username or url.password or url.port not in (None, 443) or url.query or url.fragment:
              raise ValueError(f"{label} must not contain credentials, query parameters, fragments, or non-standard ports")
      if not dockerfile.path.endswith("/Dockerfile"):
          raise ValueError("dockerfile_url must point to a file named Dockerfile")
      if not dockerignore.path.endswith("/.dockerignore"):
          raise ValueError("dockerignore_url must point to a file named .dockerignore")
      if dirname(dockerfile.path) != dirname(dockerignore.path):
          raise ValueError("Dockerfile and .dockerignore must be in the same directory")

      for host in {dockerfile.hostname, dockerignore.hostname}:
          addresses = sorted({
              result[4][0]
              for result in socket.getaddrinfo(host, 443, type=socket.SOCK_STREAM)
          })
          if not addresses or any(not ipaddress.ip_address(address).is_global for address in addresses):
              raise ValueError(f"{host} did not resolve exclusively to public IP addresses")

      print("Validated that Dockerfile and .dockerignore are public files in the same directory.")

  - id: fetch_dockerfile
    type: io.kestra.plugin.core.http.Request
    description: Download the actual Dockerfile for inspection.
    uri: "{{ inputs.dockerfile_url }}"
    method: GET
    headers:
      Accept: text/plain, */*
      User-Agent: Kestra-Docker-Build-Context-Audit/1.0
    timeout: PT30S

  - id: fetch_dockerignore
    type: io.kestra.plugin.core.http.Request
    description: Download the real .dockerignore rules used to filter the build context.
    uri: "{{ inputs.dockerignore_url }}"
    method: GET
    headers:
      Accept: text/plain, */*
      User-Agent: Kestra-Docker-Build-Context-Audit/1.0
    timeout: PT30S

  - id: audit_build_context
    type: io.kestra.plugin.scripts.python.Script
    description: Inspect Dockerfile instructions and compare build-context exclusions against common credential and private-key patterns.
    containerImage: python:3.12-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    dependencies:
      - kestra
    inputFiles:
      Dockerfile: "{{ outputs.fetch_dockerfile.body }}"
      dockerignore.txt: "{{ outputs.fetch_dockerignore.body }}"
    env:
      DOCKERFILE_URL: "{{ inputs.dockerfile_url }}"
      DOCKERIGNORE_URL: "{{ inputs.dockerignore_url }}"
      REQUIRE_NON_ROOT_USER: "{{ inputs.require_non_root_user }}"
    outputFiles:
      - docker-build-context-report.json
    script: |
      import json
      import os
      import re
      import shlex
      from datetime import datetime, timezone

      from kestra import Kestra

      dockerfile_url = os.environ["DOCKERFILE_URL"]
      dockerignore_url = os.environ["DOCKERIGNORE_URL"]
      require_non_root = os.environ.get("REQUIRE_NON_ROOT_USER", "true").lower() == "true"

      with open("Dockerfile", encoding="utf-8") as source:
          dockerfile = source.read()
      with open("dockerignore.txt", encoding="utf-8") as source:
          dockerignore_text = source.read()
      if not dockerfile.strip():
          raise ValueError("Dockerfile is empty")

      logical_lines = []
      pending = ""
      for raw_line in dockerfile.splitlines():
          line = raw_line.strip()
          if not line or line.startswith("#"):
              continue
          line = re.sub(r"\s+#.*$", "", line).strip()
          if not line:
              continue
          if pending:
              pending += " " + line.rstrip("\\").strip()
          else:
              pending = line.rstrip("\\").strip()
          if line.endswith("\\"):
              continue
          logical_lines.append(pending)
          pending = ""
      if pending:
          logical_lines.append(pending)

      ignore_patterns = set()
      for raw_line in dockerignore_text.splitlines():
          line = raw_line.strip().replace("\\", "/")
          if line and not line.startswith("#"):
              ignore_patterns.add(line)

      findings = []
      def add(severity, code, message):
          findings.append({"severity": severity, "code": code, "message": message})

      sensitive_key_pattern = re.compile(r"(?:PASSWORD|PASSWD|TOKEN|SECRET|API[_-]?KEY|PRIVATE[_-]?KEY|ACCESS[_-]?KEY|CREDENTIAL)", re.IGNORECASE)
      floating_tags = {"latest", "stable", "edge", "lts", "main", "master", "nightly", "dev"}

      from_lines = []
      for index, line in enumerate(logical_lines):
          instruction_match = re.match(r"^\s*([A-Z]+)\s+(.*)$", line, flags=re.IGNORECASE)
          if not instruction_match:
              continue
          instruction = instruction_match.group(1).upper()
          argument = instruction_match.group(2).strip()

          if instruction == "FROM":
              from_lines.append((index, argument))
              try:
                  tokens = shlex.split(argument)
              except ValueError:
                  tokens = argument.split()
              while tokens and tokens[0].startswith("--"):
                  tokens.pop(0)
              image = tokens[0] if tokens else ""
              if image and image.lower() != "scratch" and "$" not in image and "@sha256:" not in image:
                  final_component = image.rsplit("/", 1)[-1]
                  has_tag = ":" in final_component
                  tag = final_component.rsplit(":", 1)[1].lower() if has_tag else ""
                  if not has_tag or any(tag == floating or tag.startswith(floating + "-") for floating in floating_tags):
                      add("WARN", "FLOATING_BASE_IMAGE_TAG", f"FROM uses '{image}', which does not identify an immutable digest or a fixed-looking version tag.")

          elif instruction in {"ENV", "ARG"}:
              try:
                  tokens = shlex.split(argument)
              except ValueError:
                  tokens = argument.split()
              if not tokens:
                  continue
              assignments = []
              for token in tokens:
                  if "=" in token:
                      key, value = token.split("=", 1)
                      assignments.append((key, value))
                  elif instruction == "ARG":
                      assignments.append((token, ""))
                  else:
                      assignments.append((tokens[0], " ".join(tokens[1:])))
                      break
              for key, value in assignments:
                  if not sensitive_key_pattern.search(key):
                      continue
                  if instruction == "ARG":
                      add("WARN", "SECRET_LIKE_BUILD_ARGUMENT", f"ARG {key} may carry a credential through build metadata or logs; use a supported BuildKit secret mount.")
                  elif value and not value.startswith("$") and not value.startswith("$" + "{") and value.lower() not in {"changeme", "example", "placeholder"}:
                      add("BLOCK", "LITERAL_SECRET_IN_ENV", f"ENV {key} appears to embed a literal secret value; inject credentials at runtime instead.")

          elif instruction == "COPY":
              try:
                  tokens = shlex.split(argument)
              except ValueError:
                  tokens = argument.split()
              sources = [token for token in tokens if not token.startswith("--")]
              if len(sources) >= 2 and any(source in {".", "./"} for source in sources[:-1]):
                  add("WARN", "COPY_WHOLE_BUILD_CONTEXT", "COPY . sends the whole non-ignored build context into an image stage; ensure .dockerignore excludes local credentials, repositories and caches.")
              source_names = sources[:-1] if len(sources) >= 2 else []
              for source_name in source_names:
                  if source_name.lower() in {".npmrc", ".netrc", ".aws", ".ssh", "id_rsa", "id_ed25519"} or source_name.lower().endswith((".pem", ".key", ".p12", ".pfx")):
                      add("WARN", "SENSITIVE_FILE_COPIED", f"COPY explicitly includes '{source_name}'; verify it contains no credentials or private keys and is not needed in the final image.")

          elif instruction == "ADD":
              if re.search(r"\bADD\s+(?:--\S+\s+)*(?:https?|ftp)://", line, flags=re.IGNORECASE):
                  add("WARN", "REMOTE_ADD_SOURCE", "ADD downloads a remote URL during the build; prefer a verified checksum or an explicit download-and-verify step.")

      patterns_lower = {pattern.lower() for pattern in ignore_patterns}
      def excluded(candidates):
          return any(candidate.lower() in patterns_lower for candidate in candidates)

      required_ignores = [
          ("Git metadata", [".git", "**/.git"]),
          ("environment files", [".env", ".env.*", "**/.env", "**/.env.*"]),
          ("cloud credential directories", [".aws/", ".aws", "**/.aws/", "**/.aws", ".ssh/", ".ssh", "**/.ssh/", "**/.ssh"]),
          ("private-key files", ["*.pem", "**/*.pem"]),
          ("private-key files", ["*.key", "**/*.key"]),
          ("secret directories", ["secrets/", "secrets", "**/secrets/", "**/secrets"]),
      ]
      missing_exclusions = []
      for label, candidates in required_ignores:
          if not excluded(candidates):
              missing_exclusions.append(label)
      if missing_exclusions:
          unique_missing = sorted(set(missing_exclusions))
          add("WARN", "DOCKERIGNORE_SENSITIVE_EXCLUSIONS_MISSING", "Consider excluding these build-context categories unless required: " + ", ".join(unique_missing) + ".")
      if not ignore_patterns:
          add("WARN", "DOCKERIGNORE_EMPTY", ".dockerignore contains no effective patterns.")

      last_from_index = from_lines[-1][0] if from_lines else -1
      final_stage_lines = logical_lines[last_from_index + 1:] if last_from_index >= 0 else logical_lines
      if require_non_root and not any(re.match(r"^\s*USER\s+", line, flags=re.IGNORECASE) for line in final_stage_lines):
          add("WARN", "FINAL_STAGE_USER_NOT_SET", "The final build stage has no explicit USER instruction; confirm the runtime process does not run as root.")

      blocking = [finding for finding in findings if finding["severity"] == "BLOCK"]
      warnings = [finding for finding in findings if finding["severity"] == "WARN"]
      verdict = "BLOCK" if blocking else ("PASS_WITH_WARNINGS" if warnings else "PASS")
      report = {
          "schemaVersion": 1,
          "checkedAt": datetime.now(timezone.utc).isoformat(),
          "dockerfileUrl": dockerfile_url,
          "dockerignoreUrl": dockerignore_url,
          "dockerfileInstructionCount": len(logical_lines),
          "dockerignorePatternCount": len(ignore_patterns),
          "missingRecommendedExclusionGroups": sorted(set(missing_exclusions)),
          "blockingFindingCount": len(blocking),
          "warningCount": len(warnings),
          "verdict": verdict,
          "findings": findings,
          "scopeNote": "This gate reviews the Dockerfile text and .dockerignore patterns; it does not inspect the repository files or prove the resulting image contains no secret material.",
      }
      with open("docker-build-context-report.json", "w", encoding="utf-8") as target:
          json.dump(report, target, indent=2, ensure_ascii=False)

      print(f"Docker build-context audit: verdict={verdict}, instructions={len(logical_lines)}, ignorePatterns={len(ignore_patterns)}, blocking={len(blocking)}, warnings={len(warnings)}")
      Kestra.outputs({
          "dockerfile_url": dockerfile_url,
          "dockerfile_instruction_count": len(logical_lines),
          "dockerignore_pattern_count": len(ignore_patterns),
          "missing_recommended_exclusion_groups": sorted(set(missing_exclusions)),
          "blocking_finding_count": len(blocking),
          "warning_count": len(warnings),
          "verdict": verdict,
          "findings": findings,
      })

  - id: enforce_build_policy
    type: io.kestra.plugin.core.flow.If
    description: Optionally fail when sensitive credential values are embedded directly in Dockerfile ENV instructions.
    condition: "{{ inputs.fail_on_literal_secrets and outputs.audit_build_context.vars.verdict == 'BLOCK' }}"
    then:
      - id: fail_build_context_gate
        type: io.kestra.plugin.core.execution.Fail
        description: Block a build when literal secret values are detected in the Dockerfile.
        errorMessage: "Docker build-context gate blocked: {{ outputs.audit_build_context.vars.blocking_finding_count }} critical finding(s). Review docker-build-context-report.json."
    else:
      - id: log_build_context_verdict
        type: io.kestra.plugin.core.log.Log
        level: INFO
        message: "Docker build-context audit {{ outputs.audit_build_context.vars.verdict }}; instructions={{ outputs.audit_build_context.vars.dockerfile_instruction_count }}, ignorePatterns={{ outputs.audit_build_context.vars.dockerignore_pattern_count }}, warnings={{ outputs.audit_build_context.vars.warning_count }}."

extend:
  title: Docker Build Context Secret Leakage Gate
  metaTitle: Docker Build Context Secret Leakage Gate | Kestra
  shortDescription: Review Dockerfile and .dockerignore rules for broad build-context copies, credential files, literal secrets, floating base images, and missing runtime user controls.
  metaDescription: Audit Docker build contexts for missing .dockerignore protections, secret-like ENV/ARG values, floating base images, and credentials copied into image layers.
  description: |
    Audit the actual Dockerfile and matching .dockerignore file before building a container image. The workflow spots broad COPY operations, missing exclusions for Git metadata, environment files, cloud credentials and private-key files, secret-like ENV/ARG instructions, floating base-image tags, remote ADD downloads, and a missing USER instruction in the final build stage. It outputs JSON evidence and can fail when a literal secret appears in ENV.

    ## How it works

    1. The validation task checks both raw GitHub URLs, ensures they point to files in the same directory, and rejects non-public DNS destinations.
    2. HTTP Request tasks fetch the actual Dockerfile and .dockerignore content.
    3. The Python audit expands continued Dockerfile lines, checks FROM/ARG/ENV/COPY/ADD instructions, and compares ignore patterns against common credential and private-key categories.
    4. A JSON report records instruction counts, missing ignore groups, and findings with severity and remediation context.
    5. An optional If gate fails the flow when configured enforcement finds literal secrets in Dockerfile ENV instructions.

    ## What you get

    - A machine-readable docker-build-context-report.json report.
    - Detection of broad COPY . operations and explicit copies of sensitive-looking files.
    - Warnings for missing .dockerignore patterns for Git metadata, .env files, cloud credentials, SSH and private-key files.
    - Findings for literal secrets in ENV, risky ARG usage, floating base-image tags, and absent final-stage USER declarations.

    ## Who it's for

    - Container platform engineers maintaining shared base images.
    - DevOps teams auditing Dockerfiles before CI builds.
    - Security teams reducing the chance that developer credentials leak into build layers.

    ## Why orchestrate this with Kestra

    Kestra combines public-source retrieval, a repeatable policy evaluation and a recorded JSON report in an explicit flow. Teams can schedule reviews, pass the verdict into release workflows, and phase in enforcement after resolving warnings.

    ## Prerequisites

    - A Kestra 2.x worker with Docker enabled for Python Script tasks.
    - Network access to raw.githubusercontent.com.
    - The Dockerfile and .dockerignore should be from the same repository path and branch.
    - This policy scan complements, but does not replace, a real image build, secret scanner or Docker build validation.

    ### Secrets

    - No secrets are needed for the default public files. Do not embed credentials in the source URLs.

    ## Quick start

    1. Import the flow and leave both URLs pointed at the public Docker example.
    2. Execute it and inspect audit_build_context output plus docker-build-context-report.json.
    3. Review warnings for broad COPY operations and any missing sensitive-file exclusions in .dockerignore.
    4. Replace literal credential values with runtime secrets or BuildKit secret mounts.
    5. Enable fail_on_literal_secrets in release automation after testing the policy against your repositories.

    ## How to extend

    - Add separate policies for package-manager token files and language-specific cache directories.
    - Build the image in a follow-up task and run a dedicated secret scanner against the resulting layers.
    - Compare findings with a repository-specific allowlist for generated artifacts intentionally included in the build context.
    - Store the report in S3 or use a blocking finding as a deployment approval prerequisite.

    ## Links

    - [Docker build context documentation](https://docs.docker.com/build/concepts/context/)
    - [Dockerfile reference](https://docs.docker.com/reference/dockerfile/)
    - [Docker build secrets](https://docs.docker.com/build/building/secrets/)
    - [Kestra Python Script plugin](https://kestra.io/plugins/plugin-scripts/python)
    - [Kestra HTTP Request plugin](https://kestra.io/plugins/plugin-core/http/io.kestra.plugin.core.http.request)
  tags:
    - Infrastructure
  subTags:
    - CI/CD & Deployment
    - Infrastructure Automation
  ee: false
  demo: false
