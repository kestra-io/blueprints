id: nih-reporter-grant-award-incremental-loader
namespace: company.team

description: |
  Load NIH RePORTER projects matching your criteria into a DuckDB table keyed on appl_id, paced at one
  request per second and split by fiscal year at the 15,000-record cap. Logs award amount changes and
  end date moves, checks data quality, links publications and summarises per organization and year.

inputs:
  - id: org_names
    type: ARRAY
    itemType: STRING
    defaults:
      - BROAD INSTITUTE
      - FRED HUTCHINSON
      - DANA-FARBER
    description: Organization names as RePORTER spells them (for example `DANA-FARBER CANCER INST`). RePORTER matches the words of a partial name, so only organizations whose name contains the phrase are kept; `UNIVERSITY OF CALIFORNIA` still covers every campus, so pin it with `org_ueis` or `org_names_exact`.

  - id: org_names_exact
    type: BOOL
    defaults: false
    description: Send the names as `org_names_exact_match` instead of the partial `org_names` criterion.

  - id: org_ueis
    type: ARRAY
    itemType: STRING
    defaults: []
    description: Optional SAM.gov UEIs to keep. RePORTER has no UEI search criterion (unknown criteria are silently ignored and return all of NIH), so UEIs are applied as an exact filter on the rows returned for `org_names`, which are then required.

  - id: pi_names
    type: ARRAY
    itemType: STRING
    defaults: []
    description: Optional PI names, each sent as `{"any_name"}` (last name, or first and last name).

  - id: fiscal_years
    type: ARRAY
    itemType: INT
    defaults:
      - 2025
      - 2026
    description: NIH fiscal years to load (FY2026 runs from October 2025 to September 2026). Required, because the loader splits by fiscal year when a query exceeds 15,000 records.

  - id: agencies
    type: ARRAY
    itemType: STRING
    defaults: []
    description: Optional administering institutes. RePORTER expects abbreviations (`NCI`, `NIAID`); two-letter IC codes such as `CA` or `AI` are translated, because RePORTER silently returns nothing for them.

  - id: advanced_text
    type: STRING
    required: false
    description: Optional text search; all words must appear in the title, terms or abstract, for example `CRISPR base editing`.

  - id: include_subprojects
    type: BOOL
    defaults: false
    description: Multi-component awards (P01, U54, ...) also publish one row per project and core, each with its own appl_id and a share of the parent's award. Off by default so award totals are not double counted; when on, totals still sum parent rows only.

  - id: fetch_publications
    type: BOOL
    defaults: true
    description: Link PubMed IDs from /v2/publications/search for the core projects of new appl_ids (and core projects never checked before).

  - id: max_publication_lookups
    type: INT
    defaults: 1000
    description: Core projects checked for publications per run. A bigger backlog (a large baseline) is worked off over the next runs.

  - id: db_kv_key
    type: STRING
    defaults: nih_reporter_projects_duckdb
    description: KV key holding the internal-storage URI of the DuckDB file. Use another key for a separate database.

triggers:
  - id: weekly
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 6 * * 1"
    description: RePORTER republishes project data weekly; Monday morning picks up the previous week's awards and revisions.

  - id: on_demand
    type: io.kestra.plugin.core.trigger.Webhook
    key: change-me-nih-reporter-load
    description: POST a JSON body with any inputs to override, for example `{"org_names":["MODERNA"],"fiscal_years":[2026]}` when a prospect is added to the CRM. Missing fields fall back to the defaults. Change the key before enabling.
    inputs:
      org_names: "{{ trigger.body.org_names ?? null }}"
      org_ueis: "{{ trigger.body.org_ueis ?? null }}"
      pi_names: "{{ trigger.body.pi_names ?? null }}"
      fiscal_years: "{{ trigger.body.fiscal_years ?? null }}"
      agencies: "{{ trigger.body.agencies ?? null }}"
      advanced_text: "{{ trigger.body.advanced_text ?? null }}"

tasks:
  - id: fetch_projects
    type: io.kestra.plugin.scripts.python.Script
    description: |
      Builds the RePORTER criteria, then pages `POST /v2/projects/search` with `include_fields` (16 fields instead of
      about 50), `limit` 500 and a stable `appl_id` sort, waiting at least one second between requests and retrying
      429 and 5xx. RePORTER refuses offsets above 14,999, so a query with more than 15,000 matches is re-run once per
      fiscal year; a single year that still exceeds the cap is loaded up to the cap and reported as TRUNCATED.
      Rows are deduplicated on appl_id, filtered by UEI (or by the org name phrase), flattened and written as NDJSON. Problems with the request
      itself (unmatched or ambiguous names, unknown agencies, truncation, paging drift) are returned as `api_issues`.
    containerImage: python:3.13-slim
    outputFiles:
      - projects.ndjson
    env:
      ORG_NAMES: "{{ inputs.org_names | toJson }}"
      ORG_EXACT: "{{ inputs.org_names_exact }}"
      ORG_UEIS: "{{ inputs.org_ueis | toJson }}"
      PI_NAMES: "{{ inputs.pi_names | toJson }}"
      FISCAL_YEARS: "{{ inputs.fiscal_years | toJson }}"
      AGENCIES: "{{ inputs.agencies | toJson }}"
      TEXT: "{{ inputs.advanced_text ?? '' }}"
      INCLUDE_SUBPROJECTS: "{{ inputs.include_subprojects }}"
    script: |
      import json, os, time, urllib.error, urllib.request

      API = "https://api.reporter.nih.gov/v2/projects/search"
      UA = "kestra-blueprint nih-reporter-grant-award-incremental-loader (https://kestra.io/blueprints)"
      PAGE, CAP = 500, 15000
      FIELDS = ["ApplId", "SubprojectId", "FiscalYear", "ProjectNum", "CoreProjectNum", "ProjectTitle", "ActivityCode",
                "AgencyIcAdmin", "Organization", "PrincipalInvestigators", "AwardAmount", "ProjectStartDate",
                "ProjectEndDate", "AwardNoticeDate", "IsActive", "DateAdded"]
      IC = {"CA": "NCI", "AI": "NIAID", "HL": "NHLBI", "GM": "NIGMS", "DK": "NIDDK", "NS": "NINDS", "MH": "NIMH",
            "AG": "NIA", "HD": "NICHD", "EY": "NEI", "DA": "NIDA", "AA": "NIAAA", "ES": "NIEHS", "AR": "NIAMS",
            "DC": "NIDCD", "DE": "NIDCR", "NR": "NINR", "EB": "NIBIB", "HG": "NHGRI", "MD": "NIMHD", "AT": "NCCIH",
            "LM": "NLM", "TR": "NCATS", "TW": "FIC"}
      calls, last = 0, 0.0

      def post(body):
          global calls, last
          for attempt in range(6):
              time.sleep(max(0.0, 1.0 - (time.monotonic() - last)))
              last, calls = time.monotonic(), calls + 1
              try:
                  req = urllib.request.Request(API, data=json.dumps(body).encode(), method="POST",
                                               headers={"Content-Type": "application/json", "Accept": "application/json", "User-Agent": UA})
                  with urllib.request.urlopen(req, timeout=120) as r:
                      return json.load(r)
              except urllib.error.HTTPError as e:
                  if e.code in (429, 500, 502, 503, 504) and attempt < 5:
                      time.sleep(int(e.headers.get("Retry-After") or 0) or 2 ** (attempt + 1))
                      continue
                  raise SystemExit(f"RePORTER HTTP {e.code}: {e.read()[:300].decode(errors='replace')}")
              except (urllib.error.URLError, TimeoutError):
                  if attempt == 5:
                      raise
                  time.sleep(2 ** (attempt + 1))

      clean = lambda key: list(dict.fromkeys(str(v).strip() for v in json.loads(os.environ[key] or "[]") if str(v).strip()))
      orgs, ueis, pis = clean("ORG_NAMES"), [u.upper() for u in clean("ORG_UEIS")], clean("PI_NAMES")
      years = sorted({int(y) for y in clean("FISCAL_YEARS")})
      text = os.environ["TEXT"].strip()
      issues = []
      if not years:
          raise SystemExit("fiscal_years is required")
      if ueis and not orgs:
          raise SystemExit("org_ueis needs org_names: RePORTER has no UEI criterion, so UEIs only filter the rows returned for the names")
      if not (orgs or pis or clean("AGENCIES") or text):
          raise SystemExit("Give at least one of org_names, pi_names, agencies or advanced_text, otherwise this loads the whole NIH portfolio")

      agencies = []
      for a in clean("AGENCIES"):
          mapped = IC.get(a.upper(), a.upper())
          if mapped != a.upper():
              print(f"Agency {a} is an IC code, sent as {mapped}")
          agencies.append(mapped)

      crit = {"fiscal_years": years, "exclude_subprojects": os.environ["INCLUDE_SUBPROJECTS"].lower() != "true"}
      if orgs:
          crit["org_names_exact_match" if os.environ["ORG_EXACT"].lower() == "true" else "org_names"] = orgs
      if pis:
          crit["pi_names"] = [{"any_name": p} for p in pis]
      if agencies:
          crit["agencies"] = agencies
      if text:
          crit["advanced_text_search"] = {"operator": "and", "search_field": "projecttitle,terms,abstracttext", "search_text": text}

      for a in agencies:
          if a not in IC.values() and post({"criteria": {"fiscal_years": years, "agencies": [a]}, "include_fields": ["ApplId"], "limit": 1})["meta"]["total"] == 0:
              issues.append(f"agency {a} matches no project in FY {', '.join(map(str, years))}; RePORTER ignores unknown agencies silently")

      def fetch(c, first=None):
          rows, offset, d = [], 0, first
          while True:
              d = d or post({"criteria": c, "include_fields": FIELDS, "offset": offset, "limit": PAGE, "sort_field": "appl_id", "sort_order": "asc"})
              rows += d["results"]
              offset += PAGE
              if offset >= min(d["meta"]["total"], CAP) or not d["results"]:
                  return rows, d["meta"]["total"]
              d = None

      first = post({"criteria": crit, "include_fields": FIELDS, "offset": 0, "limit": PAGE, "sort_field": "appl_id", "sort_order": "asc"})
      search_url = (first["meta"].get("properties") or {}).get("URL", "").replace("https:/r", "https://r")
      slices = []
      if first["meta"]["total"] <= CAP:
          rows, total = fetch(crit, first)
          slices.append({"slice": "all years", "total": total, "fetched": len(rows), "status": "FULL", "rows": rows})
      else:
          print(f"{first['meta']['total']} matches exceed the {CAP} offset cap, splitting by fiscal year")
          for y in years:
              rows, total = fetch(dict(crit, fiscal_years=[y]))
              slices.append({"slice": f"FY{y}", "total": total, "fetched": len(rows), "status": "TRUNCATED" if total > CAP else "FULL", "rows": rows})
      for s in slices:
          print(f"{s['slice']}: {s['total']} matches, {s['fetched']} fetched, {s['status']}")
          if s["status"] == "TRUNCATED":
              issues.append(f"{s['slice']} has {s['total']} matches, only the first {CAP} were loaded; narrow it with agencies or advanced_text")
          elif s["fetched"] < s["total"]:
              issues.append(f"{s['slice']} returned {s['fetched']} of {s['total']} rows; RePORTER data moved while paging, the next run fills the gap")

      raw = [r for s in slices for r in s["rows"]]
      unique = {r["appl_id"]: r for r in raw}
      if len(unique) < len(raw):
          print(f"{len(raw) - len(unique)} duplicate appl_ids across pages removed")
      norm = lambda v: " ".join("".join(c if c.isalnum() else " " for c in (v or "").upper()).split())
      org_of = lambda r: (r.get("organization") or {}).get("org_name") or ""
      if ueis:
          kept = [r for r in unique.values() if set(ueis) & set((r.get("organization") or {}).get("org_ueis") or [])]
          seen = {u for r in kept for u in (r["organization"].get("org_ueis") or [])}
          print(f"UEI filter kept {len(kept)} of {len(unique)} rows")
          issues += [f"UEI {u} matched none of the rows returned for {', '.join(orgs)}" for u in ueis if u not in seen]
      elif orgs and os.environ["ORG_EXACT"].lower() != "true":
          # RePORTER matches the words of a partial name in any order, so UNIVERSITY OF CALIFORNIA also returns
          # UNIVERSITY OF SOUTHERN CALIFORNIA. Keep only organizations whose name contains one of the requested phrases.
          kept = [r for r in unique.values() if any(norm(n) in norm(org_of(r)) for n in orgs)]
          stray = sorted({org_of(r) for r in unique.values()} - {org_of(r) for r in kept})
          if stray:
              print(f"Dropped {len(unique) - len(kept)} rows of {len(stray)} organization(s) that match the words but not the phrase: {', '.join(stray[:10])}")
      else:
          kept = list(unique.values())

      for name in orgs:
          hits = [r for r in kept if norm(name) in norm(org_of(r))] if not ueis else kept
          names = sorted({org_of(r) for r in hits})
          org_ueis = {r["organization"].get("primary_uei") for r in hits}
          print(f"Org '{name}': {len(hits)} rows, matched {names[:10]}")
          if not hits:
              issues.append(f"org name '{name}' matched nothing; check the spelling RePORTER uses")
          elif len(org_ueis) > 1 and not ueis:
              issues.append(f"org name '{name}' matched {len(org_ueis)} organizations ({', '.join(names[:5])}{' ...' if len(names) > 5 else ''}); pin it with org_ueis or org_names_exact")

      day = lambda v: (v or "")[:10] or None
      with open("projects.ndjson", "w", encoding="utf-8") as out:
          for r in kept:
              org, pis_ = r.get("organization") or {}, r.get("principal_investigators") or []
              contact = next((p for p in pis_ if p.get("is_contact_pi")), pis_[0] if pis_ else {})
              out.write(json.dumps({
                  "appl_id": r["appl_id"], "subproject_id": r.get("subproject_id"), "fiscal_year": r.get("fiscal_year"),
                  "project_num": r.get("project_num"), "core_project_num": r.get("core_project_num"),
                  "project_title": r.get("project_title"), "activity_code": r.get("activity_code"),
                  "agency": (r.get("agency_ic_admin") or {}).get("abbreviation"),
                  "org_name": org.get("org_name"), "primary_uei": org.get("primary_uei"),
                  "org_ueis": ";".join(org.get("org_ueis") or []), "org_city": org.get("org_city"),
                  "org_state": org.get("org_state"), "org_country": org.get("org_country"),
                  "contact_pi": " ".join((contact.get("full_name") or "").split()) or None,
                  "pi_names": "; ".join(" ".join((p.get("full_name") or "").split()) for p in pis_),
                  "award_amount": r.get("award_amount"), "project_start_date": day(r.get("project_start_date")),
                  "project_end_date": day(r.get("project_end_date")), "award_notice_date": day(r.get("award_notice_date")),
                  "is_active": r.get("is_active"), "date_added": day(r.get("date_added")),
                  "reporter_url": f"https://reporter.nih.gov/project-details/{r['appl_id']}",
              }) + "\n")

      for i in issues:
          print("ISSUE " + i)
      print(f"{len(kept)} projects written from {sum(s['total'] for s in slices)} matches in {calls} API calls; RePORTER search {search_url}")
      print("::" + json.dumps({"outputs": {
          "criteria": crit, "slices": [{k: v for k, v in s.items() if k != "rows"} for s in slices],
          "expected": sum(min(s["total"], CAP) for s in slices), "fetched": len(kept), "duplicates": len(raw) - len(unique),
          "api_calls": calls, "api_issues": issues, "search_url": search_url,
      }}) + "::")

  - id: current_db
    type: io.kestra.plugin.core.kv.Get
    key: "{{ inputs.db_kv_key }}"
    errorOnMissing: false
    description: URI of the DuckDB file written by the last run; missing on the first run.

  - id: bootstrap
    type: io.kestra.plugin.core.flow.If
    description: First run only. Creates the DuckDB file with its five tables and points the KV key at it.
    condition: "{{ outputs.current_db.value is not defined or outputs.current_db.value is empty }}"
    then:
      - id: create_db
        type: io.kestra.plugin.jdbc.duckdb.Queries
        communityExtensions: []
        outputDbFile: true
        sql: |
          CREATE TABLE projects (
            appl_id BIGINT PRIMARY KEY, subproject_id VARCHAR, fiscal_year INTEGER, project_num VARCHAR, core_project_num VARCHAR,
            project_title VARCHAR, activity_code VARCHAR, agency VARCHAR, org_name VARCHAR, primary_uei VARCHAR, org_ueis VARCHAR,
            org_city VARCHAR, org_state VARCHAR, org_country VARCHAR, contact_pi VARCHAR, pi_names VARCHAR, award_amount BIGINT,
            project_start_date DATE, project_end_date DATE, award_notice_date DATE, is_active BOOLEAN, date_added DATE,
            reporter_url VARCHAR, first_loaded_at TIMESTAMPTZ, first_execution_id VARCHAR, last_changed_at TIMESTAMPTZ,
            last_changed_execution_id VARCHAR, last_seen_at TIMESTAMPTZ, last_seen_execution_id VARCHAR
          );
          CREATE TABLE project_changes (
            execution_id VARCHAR, detected_at TIMESTAMPTZ, appl_id BIGINT, project_num VARCHAR, org_name VARCHAR,
            fiscal_year INTEGER, field VARCHAR, old_value VARCHAR, new_value VARCHAR, delta BIGINT
          );
          CREATE TABLE load_log (
            execution_id VARCHAR, loaded_at TIMESTAMPTZ, criteria VARCHAR, fetched INTEGER, new_projects INTEGER,
            changed_projects INTEGER, table_rows INTEGER, data_issues VARCHAR
          );
          CREATE TABLE publications (
            pmid BIGINT, core_project_num VARCHAR, appl_id BIGINT, first_seen_at TIMESTAMPTZ, first_execution_id VARCHAR,
            PRIMARY KEY (pmid, core_project_num)
          );
          CREATE TABLE publication_checks (core_project_num VARCHAR PRIMARY KEY, checked_at TIMESTAMPTZ, publication_count INTEGER);

      - id: save_new_db
        type: io.kestra.plugin.core.kv.Set
        key: "{{ inputs.db_kv_key }}"
        value: "{{ outputs.create_db.databaseUri }}"

  - id: upsert
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: |
      Classifies every fetched project against the table as NEW, CHANGED (award_amount or project_end_date differs) or
      UNCHANGED, appends one project_changes row per changed field (delta in dollars or days), upserts on appl_id while
      keeping first_loaded_at, and runs the row-level quality checks. The result row also lists the core projects whose
      publications should be looked up.
    communityExtensions: []
    databaseUri: "{{ kv(inputs.db_kv_key) }}"
    outputDbFile: true
    fetchType: FETCH_ONE
    inputFiles:
      batch.ndjson: "{{ outputs.fetch_projects.outputFiles['projects.ndjson'] }}"
    parameters:
      execution_id: "{{ execution.id }}"
      criteria: "{{ outputs.fetch_projects.vars.criteria | toJson }}"
      max_pubs: "{{ inputs.max_publication_lookups }}"
    sql: |
      SET TimeZone = 'UTC';
      CREATE TEMP TABLE batch AS
      SELECT * FROM read_json('batch.ndjson', format = 'newline_delimited', columns = {
        'appl_id': 'BIGINT', 'subproject_id': 'VARCHAR', 'fiscal_year': 'INTEGER', 'project_num': 'VARCHAR',
        'core_project_num': 'VARCHAR', 'project_title': 'VARCHAR', 'activity_code': 'VARCHAR', 'agency': 'VARCHAR',
        'org_name': 'VARCHAR', 'primary_uei': 'VARCHAR', 'org_ueis': 'VARCHAR', 'org_city': 'VARCHAR', 'org_state': 'VARCHAR',
        'org_country': 'VARCHAR', 'contact_pi': 'VARCHAR', 'pi_names': 'VARCHAR', 'award_amount': 'BIGINT',
        'project_start_date': 'DATE', 'project_end_date': 'DATE', 'award_notice_date': 'DATE', 'is_active': 'BOOLEAN',
        'date_added': 'DATE', 'reporter_url': 'VARCHAR'});

      CREATE TEMP TABLE before_count AS SELECT count(*) AS n FROM projects;

      CREATE TEMP TABLE classified AS
      SELECT b.*, p.appl_id IS NULL AS is_new,
             p.appl_id IS NOT NULL AND p.award_amount IS DISTINCT FROM b.award_amount AS award_changed,
             p.appl_id IS NOT NULL AND p.project_end_date IS DISTINCT FROM b.project_end_date AS end_changed,
             p.award_amount AS old_award, p.project_end_date AS old_end, p.first_loaded_at AS old_first_loaded_at,
             p.first_execution_id AS old_first_execution_id, p.last_changed_at AS old_changed_at,
             p.last_changed_execution_id AS old_changed_execution_id
      FROM batch b LEFT JOIN projects p ON p.appl_id = b.appl_id;

      INSERT INTO project_changes
      SELECT :execution_id, now(), appl_id, project_num, org_name, fiscal_year, 'award_amount',
             CAST(old_award AS VARCHAR), CAST(award_amount AS VARCHAR), award_amount - old_award
      FROM classified WHERE award_changed
      UNION ALL
      SELECT :execution_id, now(), appl_id, project_num, org_name, fiscal_year, 'project_end_date',
             CAST(old_end AS VARCHAR), CAST(project_end_date AS VARCHAR), date_diff('day', old_end, project_end_date)
      FROM classified WHERE end_changed;

      INSERT OR REPLACE INTO projects BY NAME
      SELECT * EXCLUDE (is_new, award_changed, end_changed, old_award, old_end, old_first_loaded_at, old_first_execution_id, old_changed_at, old_changed_execution_id),
             coalesce(old_first_loaded_at, now()) AS first_loaded_at,
             coalesce(old_first_execution_id, :execution_id) AS first_execution_id,
             CASE WHEN is_new OR award_changed OR end_changed THEN now() ELSE old_changed_at END AS last_changed_at,
             CASE WHEN is_new OR award_changed OR end_changed THEN :execution_id ELSE old_changed_execution_id END AS last_changed_execution_id,
             now() AS last_seen_at, :execution_id AS last_seen_execution_id
      FROM classified;

      CREATE TEMP TABLE dq AS
      SELECT count(*) AS n, count(*) FILTER (WHERE award_amount IS NULL AND subproject_id IS NULL) AS null_award_rows,
             count(*) FILTER (WHERE project_end_date < project_start_date) AS end_before_start_rows,
             count(*) FILTER (WHERE project_end_date IS NULL) AS missing_end_date_rows,
             count(*) FILTER (WHERE coalesce(primary_uei, '') = '') AS missing_uei_rows,
             count(*) FILTER (WHERE award_changed AND award_amount < old_award) AS award_decreases
      FROM classified;

      CREATE TEMP TABLE result AS
      SELECT (SELECT n FROM before_count) = 0 AS is_baseline,
             count(*) AS fetched,
             count(*) FILTER (WHERE is_new) AS new_projects,
             count(*) FILTER (WHERE award_changed OR end_changed) AS changed_projects,
             count(*) FILTER (WHERE award_changed) AS award_changes,
             CAST(coalesce(sum(award_amount - old_award) FILTER (WHERE award_changed), 0) AS BIGINT) AS award_delta_usd,
             count(*) FILTER (WHERE end_changed) AS end_date_changes,
             count(*) FILTER (WHERE end_changed AND project_end_date > old_end) AS extensions,
             CAST(coalesce(sum(award_amount) FILTER (WHERE is_new AND subproject_id IS NULL), 0) AS BIGINT) AS new_award_usd,
             (SELECT count(*) FROM projects) AS table_rows,
             coalesce(string_agg(project_num || ' ' || org_name || CASE WHEN award_changed THEN ' award ' || coalesce(CAST(old_award AS VARCHAR), 'null') || ' -> ' || coalesce(CAST(award_amount AS VARCHAR), 'null') ELSE '' END
                                 || CASE WHEN end_changed THEN ' end ' || coalesce(CAST(old_end AS VARCHAR), 'null') || ' -> ' || coalesce(CAST(project_end_date AS VARCHAR), 'null') ELSE '' END,
                                 '; ' ORDER BY abs(coalesce(award_amount - old_award, 0)) DESC) FILTER (WHERE award_changed OR end_changed), '') AS top_changes,
             (SELECT concat_ws('; ',
                CASE WHEN null_award_rows > 0 THEN null_award_rows || ' project(s) without award_amount' END,
                CASE WHEN end_before_start_rows > 0 THEN end_before_start_rows || ' project(s) ending before they start' END,
                CASE WHEN missing_end_date_rows > 0 THEN missing_end_date_rows || ' project(s) without project_end_date' END,
                CASE WHEN missing_uei_rows > 0 THEN missing_uei_rows || ' project(s) without organization UEI' END,
                CASE WHEN award_decreases > 0 THEN award_decreases || ' award amount(s) went down (de-obligation or correction)' END,
                CASE WHEN n = 0 THEN 'the criteria matched no project' END) FROM dq) AS data_issues
      FROM classified;

      INSERT INTO load_log
      SELECT :execution_id, now(), :criteria, fetched, new_projects, changed_projects, table_rows, data_issues FROM result;

      SELECT r.*, (
        SELECT coalesce(string_agg(core_project_num, ','), '') FROM (
          SELECT p.core_project_num, max(p.fiscal_year) AS fy
          FROM projects p LEFT JOIN publication_checks c ON c.core_project_num = p.core_project_num
          WHERE p.core_project_num IS NOT NULL AND (c.core_project_num IS NULL OR p.first_execution_id = :execution_id)
          GROUP BY 1 ORDER BY fy DESC, 1 LIMIT CAST(:max_pubs AS INTEGER))) AS pub_candidates
      FROM result r;

  - id: save_db
    type: io.kestra.plugin.core.kv.Set
    key: "{{ inputs.db_kv_key }}"
    value: "{{ outputs.upsert.databaseUri }}"
    description: Points the KV key at the database version that now holds this run's projects.

  - id: quality_gate
    type: io.kestra.plugin.core.flow.If
    description: Warns (and posts to Slack) when the request or the data has a problem; a clean load only logs the counts.
    condition: "{{ (outputs.fetch_projects.vars.api_issues | length) > 0 or outputs.upsert.outputs[0].row.data_issues != '' }}"
    then:
      - id: warn_quality
        type: io.kestra.plugin.core.log.Log
        level: WARN
        message: "RePORTER load needs attention. Request: {{ outputs.fetch_projects.vars.api_issues | join('; ') | default('ok') }}. Data: {{ outputs.upsert.outputs[0].row.data_issues | default('ok') }}."
      - id: alert_quality
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        allowFailure: true
        description: allowFailure keeps the load green when the webhook secret is not configured.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {"text": {{ (':warning: NIH RePORTER load needs attention\nRequest: ' ~ (outputs.fetch_projects.vars.api_issues | join('; ') | default('ok')) ~ '\nData: ' ~ (outputs.upsert.outputs[0].row.data_issues | default('ok')) ~ '\nExecution: ' ~ (kestra.url ?? '') ~ '/ui/executions/' ~ flow.namespace ~ '/' ~ flow.id ~ '/' ~ execution.id) | toJson }}}
    else:
      - id: quality_ok
        type: io.kestra.plugin.core.log.Log
        message: "Quality checks passed for {{ outputs.upsert.outputs[0].row.fetched }} projects."

  - id: publications
    type: io.kestra.plugin.core.flow.If
    description: Looks up publications only when enabled and there are new or never-checked core projects.
    condition: "{{ inputs.fetch_publications and outputs.upsert.outputs[0].row.pub_candidates != '' }}"
    then:
      - id: fetch_publications
        type: io.kestra.plugin.scripts.python.Script
        description: |
          Sends the candidate core project numbers to `POST /v2/publications/search` in batches of 100, pages with
          limit 500 and keeps the same one-request-per-second pace. This endpoint caps offsets at 9,999, so a batch with
          more links is halved; a single core project above the cap (large center grants) keeps its first 10,000 links.
        containerImage: python:3.13-slim
        outputFiles:
          - publications.ndjson
          - checked.ndjson
        env:
          CORE_PROJECTS: "{{ outputs.upsert.outputs[0].row.pub_candidates }}"
        script: |
          import json, os, time, urllib.error, urllib.request

          API = "https://api.reporter.nih.gov/v2/publications/search"
          UA = "kestra-blueprint nih-reporter-grant-award-incremental-loader (https://kestra.io/blueprints)"
          calls, last = 0, 0.0

          def post(body):
              global calls, last
              for attempt in range(6):
                  time.sleep(max(0.0, 1.0 - (time.monotonic() - last)))
                  last, calls = time.monotonic(), calls + 1
                  try:
                      req = urllib.request.Request(API, data=json.dumps(body).encode(), method="POST", headers={"Content-Type": "application/json", "User-Agent": UA})
                      with urllib.request.urlopen(req, timeout=120) as r:
                          return json.load(r)
                  except (urllib.error.URLError, TimeoutError) as e:
                      if attempt == 5 or (isinstance(e, urllib.error.HTTPError) and e.code not in (429, 500, 502, 503, 504)):
                          raise SystemExit(f"RePORTER publications search failed: {e}")
                      time.sleep(2 ** (attempt + 1))

          CAP = 10000  # the publications endpoint refuses offsets above 9,999
          truncated = []

          def search(batch):
              rows, offset = [], 0
              while True:
                  d = post({"criteria": {"core_project_nums": batch}, "offset": offset, "limit": 500})
                  if offset == 0 and d["meta"]["total"] > CAP:
                      if len(batch) > 1:
                          half = len(batch) // 2
                          return search(batch[:half]) + search(batch[half:])
                      truncated.append(f"{batch[0]} ({d['meta']['total']})")
                  rows += d["results"]
                  offset += 500
                  if offset >= min(d["meta"]["total"], CAP) or not d["results"]:
                      return rows

          cores = [c for c in os.environ["CORE_PROJECTS"].split(",") if c]
          links = {}
          for i in range(0, len(cores), 100):
              for r in search(cores[i:i + 100]):
                  links[(r["pmid"], r["coreproject"])] = r.get("applid")
          counts = {c: 0 for c in cores}
          with open("publications.ndjson", "w") as out:
              for (pmid, core), appl in links.items():
                  counts[core] = counts.get(core, 0) + 1
                  out.write(json.dumps({"pmid": pmid, "core_project_num": core, "appl_id": appl}) + "\n")
          with open("checked.ndjson", "w") as out:
              for core in cores:
                  out.write(json.dumps({"core_project_num": core, "publication_count": counts[core]}) + "\n")
          print(f"{len(links)} publication links for {len(cores)} core projects ({sum(1 for c in cores if counts[c])} with publications) in {calls} API calls")
          if truncated:
              print("Capped at 10,000 links: " + ", ".join(truncated))

      - id: load_publications
        type: io.kestra.plugin.jdbc.duckdb.Queries
        communityExtensions: []
        databaseUri: "{{ kv(inputs.db_kv_key) }}"
        outputDbFile: true
        fetchType: FETCH_ONE
        inputFiles:
          publications.ndjson: "{{ outputs.fetch_publications.outputFiles['publications.ndjson'] }}"
          checked.ndjson: "{{ outputs.fetch_publications.outputFiles['checked.ndjson'] }}"
        parameters:
          execution_id: "{{ execution.id }}"
        sql: |
          SET TimeZone = 'UTC';
          CREATE TEMP TABLE pubs AS SELECT * FROM read_json('publications.ndjson', format = 'newline_delimited',
            columns = {'pmid': 'BIGINT', 'core_project_num': 'VARCHAR', 'appl_id': 'BIGINT'});
          CREATE TEMP TABLE new_pubs AS
          SELECT n.* FROM pubs n ANTI JOIN publications p ON p.pmid = n.pmid AND p.core_project_num = n.core_project_num;
          INSERT INTO publications SELECT pmid, core_project_num, appl_id, now(), :execution_id FROM new_pubs;
          INSERT OR REPLACE INTO publication_checks
          SELECT core_project_num, now(), publication_count FROM read_json('checked.ndjson', format = 'newline_delimited',
            columns = {'core_project_num': 'VARCHAR', 'publication_count': 'INTEGER'});
          SELECT (SELECT count(*) FROM pubs) AS links_fetched, (SELECT count(*) FROM new_pubs) AS new_links,
                 (SELECT count(*) FROM publications) AS publication_rows;

      - id: save_db_with_publications
        type: io.kestra.plugin.core.kv.Set
        key: "{{ inputs.db_kv_key }}"
        value: "{{ outputs.load_publications.databaseUri }}"

  - id: report
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: Summarises the projects seen in this run per organization and fiscal year (CSV with every row, log and Slack with the 25 largest by award), and exports this run's new and changed projects.
    communityExtensions: []
    databaseUri: "{{ kv(inputs.db_kv_key) }}"
    fetchType: FETCH_ONE
    outputFiles:
      - org_fy_summary_csv
      - changes_csv
    parameters:
      execution_id: "{{ execution.id }}"
    sql: |
      SET TimeZone = 'UTC';
      CREATE TEMP TABLE run_rows AS SELECT * FROM projects WHERE last_seen_execution_id = :execution_id;

      CREATE TEMP TABLE org_fy AS
      SELECT r.org_name, r.primary_uei, r.fiscal_year,
             count(*) AS projects,
             count(*) FILTER (WHERE r.first_execution_id = :execution_id) AS new_projects,
             count(*) FILTER (WHERE r.last_changed_execution_id = :execution_id AND r.first_execution_id <> :execution_id) AS changed_projects,
             CAST(coalesce(sum(r.award_amount) FILTER (WHERE r.subproject_id IS NULL), 0) AS BIGINT) AS total_award_usd,
             count(*) FILTER (WHERE r.is_active) AS active_projects,
             count(DISTINCT r.contact_pi) AS contact_pis,
             count(DISTINCT r.agency) AS institutes,
             (SELECT count(DISTINCT p.pmid) FROM publications p JOIN run_rows x ON x.core_project_num = p.core_project_num
              WHERE x.org_name = r.org_name AND x.fiscal_year = r.fiscal_year) AS linked_publications
      FROM run_rows r GROUP BY ALL;

      COPY (SELECT * FROM org_fy ORDER BY org_name, fiscal_year) TO '{{ outputFiles.org_fy_summary_csv }}' (HEADER, DELIMITER ',');

      COPY (
        SELECT 'NEW' AS change_type, appl_id, project_num, org_name, fiscal_year, agency, contact_pi, project_title,
               CAST(NULL AS VARCHAR) AS field, CAST(NULL AS VARCHAR) AS old_value,
               CAST(award_amount AS VARCHAR) AS new_value, award_amount AS delta, reporter_url
        FROM run_rows WHERE first_execution_id = :execution_id
        UNION ALL
        SELECT 'CHANGED', c.appl_id, c.project_num, c.org_name, c.fiscal_year, p.agency, p.contact_pi, p.project_title,
               c.field, c.old_value, c.new_value, c.delta, p.reporter_url
        FROM project_changes c JOIN projects p USING (appl_id) WHERE c.execution_id = :execution_id
        ORDER BY change_type, org_name, fiscal_year, project_num
      ) TO '{{ outputFiles.changes_csv }}' (HEADER, DELIMITER ',');

      SELECT count(*) AS org_fiscal_years, CAST(coalesce(sum(projects), 0) AS BIGINT) AS projects, CAST(coalesce(sum(new_projects), 0) AS BIGINT) AS new_projects,
             CAST(coalesce(sum(changed_projects), 0) AS BIGINT) AS changed_projects, CAST(coalesce(sum(total_award_usd), 0) AS BIGINT) AS total_award_usd,
             (SELECT count(*) FROM projects) AS table_rows, (SELECT count(*) FROM publications) AS publication_links,
             coalesce(string_agg(org_name || ' (' || coalesce(primary_uei, 'no UEI') || ') FY' || fiscal_year || ', ' || projects || ' projects, '
                      || new_projects || ' new, ' || changed_projects || ' changed, USD ' || format('{:,}', total_award_usd) || ', '
                      || active_projects || ' active, ' || linked_publications || ' publications', chr(10) ORDER BY org_name, fiscal_year)
                      FILTER (WHERE award_rank <= 25), '')
             || CASE WHEN count(*) > 25 THEN chr(10) || '... ' || (count(*) - 25) || ' smaller organization-years in org_fy_summary_csv' ELSE '' END AS per_org_fy
      FROM (SELECT *, row_number() OVER (ORDER BY total_award_usd DESC) AS award_rank FROM org_fy);

  - id: notify
    type: io.kestra.plugin.core.flow.If
    description: Posts a digest of new awards and award or end-date changes; the baseline run is not announced.
    condition: "{{ not outputs.upsert.outputs[0].row.is_baseline and (outputs.upsert.outputs[0].row.new_projects > 0 or outputs.upsert.outputs[0].row.changed_projects > 0) }}"
    then:
      - id: slack_digest
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        allowFailure: true
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {"text": {{ (':dna: NIH RePORTER: ' ~ outputs.upsert.outputs[0].row.new_projects ~ ' new project(s) worth USD ' ~ (outputs.upsert.outputs[0].row.new_award_usd | numberFormat("#,##0")) ~ ', ' ~ outputs.upsert.outputs[0].row.award_changes ~ ' award change(s) (net USD ' ~ (outputs.upsert.outputs[0].row.award_delta_usd | numberFormat("#,##0")) ~ '), ' ~ outputs.upsert.outputs[0].row.end_date_changes ~ ' end date change(s), ' ~ outputs.upsert.outputs[0].row.extensions ~ ' of them extensions\n' ~ outputs.report.outputs[0].row.per_org_fy ~ '\nChanges: ' ~ outputs.upsert.outputs[0].row.top_changes ~ '\nExecution: ' ~ (kestra.url ?? '') ~ '/ui/executions/' ~ flow.namespace ~ '/' ~ flow.id ~ '/' ~ execution.id) | toJson }}}

  - id: summary
    type: io.kestra.plugin.core.log.Log
    message: |
      RePORTER {{ outputs.fetch_projects.vars.criteria | toJson }}{{ outputs.upsert.outputs[0].row.is_baseline ? ', BASELINE run (new database)' : '' }}.
      {{ outputs.fetch_projects.vars.fetched }} projects in {{ outputs.fetch_projects.vars.api_calls }} API calls ({{ outputs.fetch_projects.vars.slices | length }} slice(s)): {{ outputs.upsert.outputs[0].row.new_projects }} new (USD {{ outputs.upsert.outputs[0].row.new_award_usd | numberFormat("#,##0") }}), {{ outputs.upsert.outputs[0].row.changed_projects }} changed ({{ outputs.upsert.outputs[0].row.award_changes }} award, net USD {{ outputs.upsert.outputs[0].row.award_delta_usd | numberFormat("#,##0") }}; {{ outputs.upsert.outputs[0].row.end_date_changes }} end date, {{ outputs.upsert.outputs[0].row.extensions }} extensions); {{ outputs.report.outputs[0].row.table_rows }} rows in the table, {{ outputs.report.outputs[0].row.publication_links }} publication links.
      {{ outputs.report.outputs[0].row.per_org_fy }}
      {{ outputs.upsert.outputs[0].row.top_changes is empty ? '' : 'Changes: ' ~ outputs.upsert.outputs[0].row.top_changes }}
      RePORTER search: {{ outputs.fetch_projects.vars.search_url }}
      Database: {{ kv(inputs.db_kv_key) }}

outputs:
  - id: summary
    type: JSON
    value: "{{ outputs.report.outputs[0].row }}"
  - id: org_fy_summary_csv
    type: FILE
    value: "{{ outputs.report.outputFiles.org_fy_summary_csv }}"
  - id: changes_csv
    type: FILE
    value: "{{ outputs.report.outputFiles.changes_csv }}"

extend:
  title: Load NIH RePORTER Grant Awards into DuckDB and Track New Projects, Award Changes and Extensions
  metaTitle: NIH RePORTER Grant Award Incremental Loader with DuckDB | Kestra
  shortDescription: Pull NIH-funded projects for your organizations, PIs, institutes and fiscal years from the keyless RePORTER API v2, upsert them into a DuckDB table keyed on appl_id, log award amount changes and no-cost extensions, link publications and summarise per organization and fiscal year.
  metaDescription: Load NIH RePORTER projects into DuckDB weekly, upsert on appl_id, track new awards, award changes and end-date extensions, and summarise per org and year.
  description: |
    Research offices, biotech business-development teams and foundations keep a list of the NIH grants that matter to them: a prospect's awards, a competitor lab's portfolio, every NCI-funded CRISPR project. A RePORTER export goes stale within a week, and a fresh download hides what moved: new awards, supplements, de-obligations, and no-cost extensions that push the end date out a year. This flow loads matching projects from the keyless NIH RePORTER API v2 into a DuckDB table keyed on `appl_id`, logs changes to `award_amount` and `project_end_date`, checks the request and the data, links publications and summarises per organization and fiscal year.

    ## How it works

    1. A weekly `Schedule` runs the load. The `on_demand` `Webhook` takes a JSON body that overrides any criteria input (for example a new prospect from the CRM); missing fields keep their defaults.
    2. `fetch_projects` (Python, standard library) pages `POST /v2/projects/search` with `include_fields` (16 of about 50 fields), `limit` 500 and an `appl_id` sort, at most one request per second as RePORTER asks, retrying 429 and 5xx.
    3. RePORTER refuses offsets above 14,999. When a query matches more than 15,000 projects it is re-run per fiscal year; a year still above the cap is loaded up to the cap and flagged `TRUNCATED`.
    4. RePORTER quirks are handled: partial org names match words in any order (`UNIVERSITY OF CALIFORNIA` also returns `UNIVERSITY OF SOUTHERN CALIFORNIA`), so only names containing the phrase are kept; there is no UEI criterion and unknown criteria are ignored, so `org_ueis` filters the returned rows; IC codes such as `CA` match nothing, so they become `NCI`, and unknown agencies are reported.
    5. `current_db` (KV Get) reads the DuckDB file URI; on the first run `bootstrap` (If) creates the tables and stores the pointer.
    6. `upsert` (DuckDB) classifies rows as NEW, CHANGED or UNCHANGED, writes one `project_changes` row per changed field with the delta in dollars or days, upserts on `appl_id` and checks rows for missing awards, end dates or UEIs, end before start and award decreases. `save_db` moves the KV pointer.
    7. `quality_gate` (If) logs a WARN and posts to Slack when the request or the data has an issue.
    8. `publications` (If) sends core projects of new appl_ids (and never-checked ones, up to `max_publication_lookups`) to `POST /v2/publications/search` in batches of 100, halving a batch above that endpoint's 9,999 offset cap, and stores the links.
    9. `report` (DuckDB) writes the organization and fiscal year summary and this run's changes as CSV; `notify` (If) posts a Slack digest, except on the baseline run.

    ## What you get

    - A DuckDB file in internal storage with one row per `appl_id`, its pointer in the KV store, and an append-only change log of award amounts and end dates.
    - `org_fy_summary_csv` (projects, new, changed, total award, active projects, contact PIs, institutes, linked publications) and `changes_csv` with RePORTER links.
    - Totals that are not double counted: multi-component awards (P01, U54) publish a row per component, so subprojects are excluded by default and only parent rows are summed when `include_subprojects` is on.
    - Warnings for misspelled or ambiguous organizations, unknown agencies, truncation, paging drift and incomplete rows (intramural projects have no UEI).

    ## Who it's for

    - Research development and sponsored programs offices tracking their own and peer portfolios.
    - Biotech business-development and competitive-intelligence teams following labs, PIs and topics.
    - Foundations and analysts who need incrementally updated NIH funding data.

    ## Why orchestrate this with Kestra

    - KV, internal storage and `outputDbFile` give a stateful DuckDB table without a database server.
    - `If` branches make quality gates, publication lookups and alerts declarative; `allowFailure` keeps loads green without Slack.
    - The weekly refresh and webhook loads share the same pacing, retries and logs.

    ## Prerequisites

    - Kestra 2.0 with the Python scripts plugin (Docker runs `python:3.13-slim`, no extra packages), JDBC DuckDB and Slack notifications.
    - Outbound HTTPS to `api.reporter.nih.gov`; no API key.
    - The database lives in this flow's execution storage; keep the latest successful execution when purging.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack incoming webhook for quality warnings and the change digest (optional).

    ## Quick start

    1. Import the flow and click **Execute**. The defaults load FY2025 and FY2026 for the Broad Institute, Fred Hutchinson and Dana-Farber (about 1,200 projects in 3 API calls) as the BASELINE.
    2. Execute again: 0 new and 0 changed projects, and no publication lookup.
    3. Try your own criteria: `org_ueis`, a PI, `agencies: [NCI]` or `advanced_text: CRISPR base editing`, with another `db_kv_key` for a separate database.
    4. Add `SLACK_WEBHOOK_URL`, change the webhook key and leave the weekly schedule on.

    ## How to extend

    - Push `changes_csv` to a CRM, or route new awards for a list of PIs to their liaison.
    - Copy the projects table to Postgres, BigQuery or Snowflake after each run.
    - Add `spending_categories`, `activity_codes` or `award_notice_date` criteria.
    - Enrich new publications with titles and journals from NCBI E-utilities or iCite.

    ## Links

    - [NIH RePORTER API](https://api.reporter.nih.gov/) and [project data elements](https://api.reporter.nih.gov/documents/Data%20Elements%20for%20RePORTER%20Project%20API_V2.pdf)
    - [NIH RePORTER](https://reporter.nih.gov/)
    - [Python Script task](https://kestra.io/plugins/plugin-script-python/io.kestra.plugin.scripts.python.script)
    - [DuckDB Queries](https://kestra.io/plugins/plugin-jdbc-duckdb/io.kestra.plugin.jdbc.duckdb.queries)
    - [KV Store](https://kestra.io/docs/concepts/kv-store)
    - [Webhook trigger](https://kestra.io/plugins/core/trigger/io.kestra.plugin.core.trigger.webhook)
    - [Slack Incoming Webhook](https://kestra.io/plugins/plugin-notifications/slack/io.kestra.plugin.slack.notifications.slackincomingwebhook)
  tags:
    - Data
  subTags:
    - ELT & Data Landing
    - Testing & Quality
    - Monitoring & Alerting
  ee: false
  demo: false
