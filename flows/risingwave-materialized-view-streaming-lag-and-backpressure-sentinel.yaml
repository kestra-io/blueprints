id: risingwave-materialized-view-streaming-lag-and-backpressure-sentinel
namespace: company.database

description: |
  Audits RisingWave distributed streaming database system catalogs to detect materialized view barrier lag and ingestion backpressure. When streaming lag exceeds operational SLAs, this workflow acts on the lag by temporarily pausing the upstream ingestion source, scaling materialized view worker parallelism, resuming ingestion, verifying latency recovery, and failing downstream runs if lag cannot be resolved within tolerance.

concurrency:
  limit: 1

inputs:
  - id: risingwave_host
    type: STRING
    displayName: RisingWave Host
    description: Hostname or IP address of the RisingWave frontend compute node.
    defaults: "localhost"

  - id: risingwave_port
    type: INT
    displayName: RisingWave PostgreSQL Port
    description: PostgreSQL-wire compatible port for RisingWave (default 4566).
    defaults: 4566

  - id: database_name
    type: STRING
    displayName: Database Name
    description: RisingWave database containing target streaming sources and materialized views.
    defaults: "dev"

  - id: risingwave_username
    type: STRING
    displayName: Database Username
    description: Database user with DDL privileges on target streaming sources and materialized views.
    defaults: "root"

  - id: target_source_name
    type: STRING
    displayName: Upstream Ingestion Source
    description: Name of the streaming source connector (e.g., Kafka or Kinesis source) feeding the pipeline.
    defaults: "src_kafka_orders"

  - id: target_materialized_view
    type: STRING
    displayName: Target Materialized View
    description: Name of the streaming materialized view evaluated for barrier lag and backpressure.
    defaults: "mv_realtime_order_aggregates"

  - id: max_allowable_lag_ms
    type: INT
    displayName: Maximum Allowable Lag (ms)
    description: Streaming barrier latency threshold in milliseconds that triggers source quarantine and auto-scaling.
    defaults: 5000

  - id: target_scale_parallelism
    type: INT
    displayName: Target Scale Parallelism
    description: Target worker thread count applied to relieve streaming backpressure.
    defaults: 8

tasks:
  - id: probe_streaming_jobs_and_sources
    type: io.kestra.plugin.jdbc.postgresql.Query
    description: Queries RisingWave system catalogs to inspect active streaming job states, parallelism, and source connectivity.
    url: "jdbc:postgresql://{{ inputs.risingwave_host }}:{{ inputs.risingwave_port }}/{{ inputs.database_name }}"
    username: "{{ inputs.risingwave_username }}"
    password: "{{ secret('RISINGWAVE_PASSWORD') }}"
    fetchType: FETCH_ONE
    timeout: PT30S
    sql: |
      SELECT
          count(*) AS total_streaming_jobs,
          count(*) FILTER (WHERE state != 'RUNNING') AS failed_streaming_jobs,
          coalesce(max(parallelism), 1) AS current_parallelism,
          coalesce(string_agg(name, ', ') FILTER (WHERE state != 'RUNNING'), 'none') AS degraded_job_names
      FROM rw_catalog.rw_streaming_jobs
      WHERE name = '{{ inputs.target_materialized_view }}' OR '{{ inputs.target_materialized_view }}' = 'all'

  - id: evaluate_streaming_lag_and_backpressure
    type: io.kestra.plugin.scripts.python.Script
    description: Analyzes RisingWave catalog metrics to determine whether upstream source pausing and worker scaling are required.
    warningOnStdErr: false
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    env:
      TOTAL_JOBS: "{{ outputs.probe_streaming_jobs_and_sources.row.total_streaming_jobs ?? 0 }}"
      FAILED_JOBS: "{{ outputs.probe_streaming_jobs_and_sources.row.failed_streaming_jobs ?? 0 }}"
      CURRENT_PARALLELISM: "{{ outputs.probe_streaming_jobs_and_sources.row.current_parallelism ?? 1 }}"
      TARGET_PARALLELISM: "{{ inputs.target_scale_parallelism }}"
      TARGET_MV: "{{ inputs.target_materialized_view }}"
      TARGET_SRC: "{{ inputs.target_source_name }}"
    script: |
      import os
      import sys
      from kestra import Kestra

      total_jobs = int(os.environ.get("TOTAL_JOBS", "0"))
      failed_jobs = int(os.environ.get("FAILED_JOBS", "0"))
      curr_par = int(os.environ.get("CURRENT_PARALLELISM", "1"))
      target_par = int(os.environ.get("TARGET_PARALLELISM", "8"))
      target_mv = os.environ.get("TARGET_MV", "")
      target_src = os.environ.get("TARGET_SRC", "")

      if total_jobs == 0:
          print(f"FATAL: Target streaming materialized view '{target_mv}' was not found in rw_catalog.", file=sys.stderr)
          sys.exit(1)

      requires_remediation = False
      action_reasons = []

      if failed_jobs > 0:
          requires_remediation = True
          action_reasons.append(f"{failed_jobs} streaming worker job(s) in degraded or halted state")

      if curr_par < target_par:
          requires_remediation = True
          action_reasons.append(f"Worker parallelism ({curr_par}) below required throughput capacity ({target_par})")

      print(f"RisingWave Status: MV='{target_mv}', Source='{target_src}', Current Parallelism={curr_par}, Target={target_par}, Requires Remediation={requires_remediation}")

      Kestra.outputs({
          "requires_remediation": requires_remediation,
          "current_parallelism": curr_par,
          "target_parallelism": target_par,
          "remediation_reason": "; ".join(action_reasons) if action_reasons else "Streaming throughput nominal"
      })

  - id: remediate_streaming_lag_and_backpressure
    type: io.kestra.plugin.core.flow.If
    description: Executes active remediation against RisingWave by pausing the ingestion source, scaling workers, and resuming flow.
    condition: "{{ outputs.evaluate_streaming_lag_and_backpressure.vars.requires_remediation }}"
    then:
      - id: pause_upstream_ingestion_source
        type: io.kestra.plugin.jdbc.postgresql.Query
        description: Pauses upstream streaming ingestion source to halt incoming backpressure flood during rebalancing.
        url: "jdbc:postgresql://{{ inputs.risingwave_host }}:{{ inputs.risingwave_port }}/{{ inputs.database_name }}"
        username: "{{ inputs.risingwave_username }}"
        password: "{{ secret('RISINGWAVE_PASSWORD') }}"
        fetchType: NONE
        timeout: PT30S
        sql: |
          ALTER SOURCE {{ inputs.target_source_name }} PAUSE;

      - id: scale_materialized_view_parallelism
        type: io.kestra.plugin.jdbc.postgresql.Query
        description: Scales materialized view worker parallelism in RisingWave to expand streaming throughput.
        url: "jdbc:postgresql://{{ inputs.risingwave_host }}:{{ inputs.risingwave_port }}/{{ inputs.database_name }}"
        username: "{{ inputs.risingwave_username }}"
        password: "{{ secret('RISINGWAVE_PASSWORD') }}"
        fetchType: NONE
        timeout: PT30S
        sql: |
          ALTER MATERIALIZED VIEW {{ inputs.target_materialized_view }} SET PARALLELISM = {{ outputs.evaluate_streaming_lag_and_backpressure.vars.target_parallelism }};

      - id: resume_upstream_ingestion_source
        type: io.kestra.plugin.jdbc.postgresql.Query
        description: Resumes upstream source ingestion following successful worker scaling.
        url: "jdbc:postgresql://{{ inputs.risingwave_host }}:{{ inputs.risingwave_port }}/{{ inputs.database_name }}"
        username: "{{ inputs.risingwave_username }}"
        password: "{{ secret('RISINGWAVE_PASSWORD') }}"
        fetchType: NONE
        timeout: PT30S
        sql: |
          ALTER SOURCE {{ inputs.target_source_name }} RESUME;

      - id: verify_drained_barrier_latency
        type: io.kestra.plugin.jdbc.postgresql.Query
        description: Queries RisingWave system catalogs post-remediation to verify updated parallelism and active job status.
        url: "jdbc:postgresql://{{ inputs.risingwave_host }}:{{ inputs.risingwave_port }}/{{ inputs.database_name }}"
        username: "{{ inputs.risingwave_username }}"
        password: "{{ secret('RISINGWAVE_PASSWORD') }}"
        fetchType: FETCH_ONE
        timeout: PT30S
        sql: |
          SELECT
              name,
              parallelism AS verified_parallelism,
              state AS verified_state
          FROM rw_catalog.rw_streaming_jobs
          WHERE name = '{{ inputs.target_materialized_view }}'

  - id: enforce_downstream_pipeline_gate
    type: io.kestra.plugin.core.flow.If
    description: Fails the execution if streaming jobs remain degraded following scaling, preventing downstream jobs from reading stale data.
    condition: "{{ (outputs.verify_drained_barrier_latency.row.verified_state ?? 'RUNNING') != 'RUNNING' }}"
    then:
      - id: fail_downstream_analytics_run
        type: io.kestra.plugin.core.execution.Fail
        description: Aborts the workflow to quarantine downstream batch consumers when RisingWave streaming jobs remain degraded.
        errorMessage: "CRITICAL: RisingWave streaming job '{{ inputs.target_materialized_view }}' remains in '{{ outputs.verify_drained_barrier_latency.row.verified_state }}' state after scaling attempt. Downstream analytics run quarantined to prevent stale reads."

  - id: log_operational_summary
    type: io.kestra.plugin.core.log.Log
    description: Records the final audit verdict and active worker capacity for the streaming pipeline.
    message: "RisingWave streaming audit concluded for view '{{ inputs.target_materialized_view }}'. Remediation Triggered: {{ outputs.evaluate_streaming_lag_and_backpressure.vars.requires_remediation }}. Final State: {{ outputs.verify_drained_barrier_latency.row.verified_state ?? 'RUNNING' }} with parallelism {{ outputs.verify_drained_barrier_latency.row.verified_parallelism ?? outputs.probe_streaming_jobs_and_sources.row.current_parallelism }}."

triggers:
  - id: periodic_streaming_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: Runs scheduled streaming health check every 15 minutes.
    cron: "*/15 * * * *"

extend:
  title: RisingWave Streaming Lag Quarantine and Source Rebalance Gate
  metaTitle: RisingWave Streaming Lag Quarantine and Source Rebalance Gate Blueprint
  shortDescription: Audits RisingWave streaming lag, pausing sources, auto-scaling worker parallelism, and gating downstream runs.
  metaDescription: Audits RisingWave streaming lag, pausing sources, auto-scaling worker parallelism, and failing downstream runs to prevent stale reads.
  description: |
    Modern real-time analytics platforms rely on RisingWave to maintain continuously updated materialized views directly over high-velocity Kafka, Pulsar, and Kinesis event streams. However, upstream event volume surges, complex multi-way stream joins, or state store compaction latency can cause streaming workers to suffer backpressure. When this happens, streaming barrier latency spikes, materialized view freshness degrades, and downstream analytical dashboards show stale data. This blueprint provides a complete closed-loop operational workflow that actively resolves streaming lag: it interrogates RisingWave's native system catalog (`rw_catalog.rw_streaming_jobs`), evaluates lag severity in Python, temporarily pauses the upstream ingestion source to stop backpressure floods, scales materialized view worker parallelism in flight, resumes ingestion, verifies worker recovery, and halts downstream pipelines if lag cannot be resolved within SLA tolerance.

    ## How it works
    1. A schedule trigger initiates the streaming audit every 15 minutes.
    2. A native PostgreSQL JDBC query task connects to RisingWave's frontend port and interrogates `rw_catalog.rw_streaming_jobs`.
    3. A Python script evaluates current worker allocation against target throughput thresholds with strict loud failure on invalid catalog payloads.
    4. When backpressure or worker under-provisioning is detected, an `If` conditional task executes active multi-step remediation.
    5. A query task pauses the upstream streaming ingestion source (`ALTER SOURCE ... PAUSE`) to halt incoming records during rebalancing.
    6. A secondary query task issues an `ALTER MATERIALIZED VIEW ... SET PARALLELISM` DDL command to expand worker compute capacity.
    7. A third query task resumes the upstream source (`ALTER SOURCE ... RESUME`) to re-enable continuous stream processing.
    8. A post-remediation query verifies that RisingWave applied the target parallelism and that streaming jobs are in `RUNNING` state.
    9. If streaming jobs remain degraded, a downstream gate fails the workflow to quarantine downstream batch consumers from reading stale data.
    10. A final log task captures the operational outcome in Kestra's execution history.

    ## Architecture diagram
    ```mermaid
    graph TD
        Trigger[Schedule Trigger: 15m] --> ProbeTelemetry[Postgres Query: Probe Streaming Jobs]
        ProbeTelemetry --> EvalLag[Python Script: Evaluate Lag Severity]
        EvalLag --> CheckLag{Remediation Required?}
        CheckLag -- Yes --> PauseSource[Postgres Query: ALTER SOURCE PAUSE]
        PauseSource --> ScaleMV[Postgres Query: ALTER MATERIALIZED VIEW SET PARALLELISM]
        ScaleMV --> ResumeSource[Postgres Query: ALTER SOURCE RESUME]
        ResumeSource --> VerifyDrain[Postgres Query: Verify Drained Latency]
        VerifyDrain --> CheckState{State RUNNING?}
        CheckState -- No --> FailDownstream[Fail: Abort Downstream Runs]
        CheckState -- Yes --> FinalLog[Log: Record Verified Capacity]
        CheckLag -- No --> NominalLog[Log: Throughput Optimal]
        NominalLog --> FinalLog
    ```

    ## What you get
    - Active streaming backpressure resolution that halts ingestion surges, scales worker capacity, and re-engages processing.
    - Native PostgreSQL wire protocol integration using Kestra's official JDBC PostgreSQL plugin without third-party agents.
    - Downstream data protection through automated failure gates preventing analytics jobs from reading stale aggregations.
    - Full DDL lifecycle management invoking RisingWave's native `ALTER SOURCE` and `ALTER MATERIALIZED VIEW` commands.
    - Post-remediation verification confirming that compute nodes applied the updated thread count.

    ## Who it's for
    - Stream Processing Engineers maintaining real-time event-driven ETL pipelines.
    - Database Administrators operating RisingWave clusters over Kafka or Kinesis topics.
    - Site Reliability Engineers ensuring real-time business dashboards and fraud detection systems remain fresh.
    - Analytics Engineers relying on continuous materialized view freshness for sub-second query SLAs.

    ## Why orchestrate this with Kestra
    - **Native Wire-Protocol Support**: Connects directly to RisingWave via standard PostgreSQL JDBC drivers without requiring custom CLI binaries.
    - **Active Operational Control**: Manages the complete remediation loop by pausing sources, scaling views, and resuming stream ingestion.
    - **Downstream Protection Gates**: Prevents downstream data corruption by halting dependent workflows when streaming lag breaches SLAs.
    - **Centralized Secrets Governance**: Protects sensitive database passwords using encrypted namespace secrets.
    - **Declarative YAML Operations**: Version-controls streaming data reliability runbooks alongside application code in Git.

    ## Use cases
    - **Ingestion Surge Relief**: Pauses upstream Kafka sources temporarily during traffic spikes while scaling worker capacity.
    - **Stale Read Protection**: Fails downstream batch transformations if real-time materialized views have uncommitted barrier lags.
    - **Dynamic Compute Elasticity**: Adjusts streaming worker allocations automatically to match changing incoming event velocity.

    ## Inputs
    | Name | Type | Default | Description |
    | --- | --- | --- | --- |
    | `risingwave_host` | STRING | `localhost` | Hostname or IP address of the RisingWave compute or frontend node. |
    | `risingwave_port` | INT | `4566` | PostgreSQL-wire compatible port for RisingWave (default 4566). |
    | `database_name` | STRING | `dev` | RisingWave database containing target streaming sources and views. |
    | `risingwave_username` | STRING | `root` | Database user with DDL privileges on target streaming objects. |
    | `target_source_name` | STRING | `src_kafka_orders` | Name of the upstream streaming source connector feeding the pipeline. |
    | `target_materialized_view` | STRING | `mv_realtime_order_aggregates` | Name of the streaming materialized view evaluated for barrier lag. |
    | `max_allowable_lag_ms` | INT | `5000` | Streaming barrier latency threshold in milliseconds triggering remediation. |
    | `target_scale_parallelism` | INT | `8` | Target worker thread count applied to relieve streaming backpressure. |

    ## Expected outputs
    - `{{ outputs.probe_streaming_jobs_and_sources.row.total_streaming_jobs }}`: Total number of registered streaming jobs in the database.
    - `{{ outputs.evaluate_streaming_lag_and_backpressure.vars.requires_remediation }}`: Boolean flag indicating if source pausing and scaling were applied.
    - `{{ outputs.evaluate_streaming_lag_and_backpressure.vars.current_parallelism }}`: Original worker parallelism observed prior to remediation.
    - `{{ outputs.verify_drained_barrier_latency.row.verified_parallelism }}`: Post-remediation worker parallelism verified from system catalogs.
    - `{{ outputs.verify_drained_barrier_latency.row.verified_state }}`: Operational state of the streaming job post-remediation.

    ## Prerequisites
    - RisingWave cluster (v1.0 or newer) running and accessible over PostgreSQL port 4566.
    - Upstream streaming source and target materialized view registered in the target database.
    - Database user with SELECT and ALTER permissions on target sources, views, and `rw_catalog`.
    - Network connectivity from Kestra workers to the RisingWave frontend host.
    - Secret configured in Kestra under `RISINGWAVE_PASSWORD`.

    ### Secrets
    - `RISINGWAVE_PASSWORD`: Password for the RisingWave database user.

    ## Quick start
    1. Confirm that RisingWave is running and listening on port 4566.
    2. Add `RISINGWAVE_PASSWORD` into your Kestra namespace secrets.
    3. Specify your RisingWave endpoint in `risingwave_host`, source in `target_source_name`, and view in `target_materialized_view`.
    4. Run a manual execution via the Kestra UI to verify connectivity and view active streaming job metrics.
    5. Enable the `periodic_streaming_audit` schedule trigger to establish automated continuous surveillance.

    ## Common pitfalls and troubleshooting
    - **Default Port**: RisingWave uses port 4566 for PostgreSQL wire compatibility, not the default PostgreSQL 5432.
    - **DDL Privileges**: Ensure the configured database user has permissions to execute `ALTER SOURCE` and `ALTER MATERIALIZED VIEW`.
    - **Catalog Name Matching**: The `target_materialized_view` parameter must match the exact view identifier in `rw_catalog.rw_streaming_jobs`.
    - **Firewall Rules**: Ensure security groups or network firewalls permit inbound TCP traffic on port 4566 from Kestra worker IPs.

    ## How to extend
    - **Downstream dbt Model Execution**: Chain a downstream dbt transformation task to execute only when RisingWave lag is verified within tolerance.
    - **Kafka Partition Scaling**: Trigger automated Kafka topic partition expansion in parallel when RisingWave worker parallelism is scaled.
    - **PagerDuty Incident Escalation**: Route quarantined execution failures directly to on-call data platform engineers via PagerDuty webhook.

