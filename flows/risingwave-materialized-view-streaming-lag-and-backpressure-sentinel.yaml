    - [Kestra Flow Control Documentation](https://kestra.io/plugins/plugin-core/io.kestra.plugin.core.flow.if)
    - [Kestra Execution Fail Documentation](https://kestra.io/plugins/plugin-core/io.kestra.plugin.core.execution.fail)
    - [RisingWave System Catalogs Reference](https://docs.risingwave.com/docs/current/system-catalogs/)
    - [RisingWave Alter Streaming Parallelism Reference](https://docs.risingwave.com/docs/current/alter-streaming/)
