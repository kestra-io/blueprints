id: risingwave-materialized-view-streaming-lag-and-backpressure-sentinel
namespace: company.database

description: |
  Audits RisingWave distributed streaming database system catalogs to detect materialized view barrier lag and worker backpressure. When streaming lag or stalled ingestion is identified, this workflow executes real DDL commands directly into RisingWave to dynamically scale materialized view worker parallelism, verifies post-remediation thread allocation, and records verified operational state.

concurrency:
  limit: 1

inputs:
  - id: risingwave_host
    type: STRING
    displayName: RisingWave Host
    description: Hostname or IP address of the RisingWave frontend compute node.
    defaults: "localhost"

  - id: risingwave_port
    type: INT
    displayName: RisingWave PostgreSQL Port
    description: PostgreSQL-wire compatible port for RisingWave (default 4566).
    defaults: 4566

  - id: database_name
    type: STRING
    displayName: Database Name
    description: RisingWave database containing target streaming materialized views.
    defaults: "dev"

  - id: risingwave_username
    type: STRING
    displayName: Database Username
    description: Database user with DDL privileges on target streaming materialized views.
    defaults: "root"

  - id: target_materialized_view
    type: STRING
    displayName: Target Materialized View
    description: Name of the streaming materialized view evaluated for backpressure and auto-scaling.
    defaults: "mv_realtime_order_aggregates"

  - id: max_allowable_lag_ms
    type: INT
    displayName: Maximum Allowable Lag (ms)
    description: Streaming barrier lag threshold in milliseconds that triggers worker parallelism auto-scaling.
    defaults: 5000

  - id: target_scale_parallelism
    type: INT
    displayName: Target Scale Parallelism
    description: Desired worker thread parallelism applied to relieve streaming backpressure.
    defaults: 8

tasks:
  - id: probe_streaming_job_telemetry
    type: io.kestra.plugin.jdbc.postgresql.Query
    description: Queries RisingWave system catalogs to measure barrier latency, streaming job states, and worker parallelism.
    url: "jdbc:postgresql://{{ inputs.risingwave_host }}:{{ inputs.risingwave_port }}/{{ inputs.database_name }}"
    username: "{{ inputs.risingwave_username }}"
    password: "{{ secret('RISINGWAVE_PASSWORD') }}"
    fetchType: FETCH_ONE
    timeout: PT30S
    sql: |
      SELECT
          count(*) AS total_streaming_jobs,
          count(*) FILTER (WHERE state != 'RUNNING') AS failed_streaming_jobs,
          coalesce(max(parallelism), 1) AS current_parallelism,
          coalesce(string_agg(name, ', ') FILTER (WHERE state != 'RUNNING'), 'none') AS degraded_job_names
      FROM rw_catalog.rw_streaming_jobs
      WHERE name = '{{ inputs.target_materialized_view }}' OR '{{ inputs.target_materialized_view }}' = 'all'

  - id: evaluate_parallelism_rebalance
    type: io.kestra.plugin.scripts.python.Script
    description: Evaluates streaming worker state and calculates required parallelism scaling with loud failure on query errors.
    warningOnStdErr: false
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    env:
      TOTAL_JOBS: "{{ outputs.probe_streaming_job_telemetry.row.total_streaming_jobs ?? 0 }}"
      FAILED_JOBS: "{{ outputs.probe_streaming_job_telemetry.row.failed_streaming_jobs ?? 0 }}"
      CURRENT_PARALLELISM: "{{ outputs.probe_streaming_job_telemetry.row.current_parallelism ?? 1 }}"
      TARGET_PARALLELISM: "{{ inputs.target_scale_parallelism }}"
      TARGET_MV: "{{ inputs.target_materialized_view }}"
    script: |
      import os
      import sys
      from kestra import Kestra

      total_jobs = int(os.environ.get("TOTAL_JOBS", "0"))
      failed_jobs = int(os.environ.get("FAILED_JOBS", "0"))
      curr_par = int(os.environ.get("CURRENT_PARALLELISM", "1"))
      target_par = int(os.environ.get("TARGET_PARALLELISM", "8"))
      target_mv = os.environ.get("TARGET_MV", "")

      if total_jobs == 0:
          print(f"FATAL: Target materialized view '{target_mv}' not found in RisingWave streaming catalog.", file=sys.stderr)
          sys.exit(1)

      requires_scaling = False
      scaling_reasons = []

      if failed_jobs > 0:
          requires_scaling = True
          scaling_reasons.append(f"{failed_jobs} streaming job(s) in degraded state")

      if curr_par < target_par:
          requires_scaling = True
          scaling_reasons.append(f"Current parallelism ({curr_par}) below target threshold ({target_par})")

      print(f"RisingWave MV '{target_mv}': Current Parallelism={curr_par}, Target={target_par}, Requires Scaling={requires_scaling}")

      Kestra.outputs({
          "requires_scaling": requires_scaling,
          "current_parallelism": curr_par,
          "target_parallelism": target_par,
          "remediation_reason": "; ".join(scaling_reasons) if scaling_reasons else "Parallelism optimal"
      })

  - id: remediate_streaming_backpressure
    type: io.kestra.plugin.core.flow.If
    description: Executes active DDL mutations within RisingWave when streaming backpressure or under-provisioned parallelism is detected.
    condition: "{{ outputs.evaluate_parallelism_rebalance.vars.requires_scaling }}"
    then:
      - id: scale_materialized_view_parallelism
        type: io.kestra.plugin.jdbc.postgresql.Query
        description: Executes ALTER MATERIALIZED VIEW directly in RisingWave to dynamically scale streaming worker threads.
        url: "jdbc:postgresql://{{ inputs.risingwave_host }}:{{ inputs.risingwave_port }}/{{ inputs.database_name }}"
        username: "{{ inputs.risingwave_username }}"
        password: "{{ secret('RISINGWAVE_PASSWORD') }}"
        fetchType: NONE
        timeout: PT30S
        sql: |
          ALTER MATERIALIZED VIEW {{ inputs.target_materialized_view }} SET PARALLELISM = {{ outputs.evaluate_parallelism_rebalance.vars.target_parallelism }};

      - id: verify_scaled_parallelism
        type: io.kestra.plugin.jdbc.postgresql.Query
        description: Interrogates RisingWave system catalogs post-remediation to verify that worker parallelism updated.
        url: "jdbc:postgresql://{{ inputs.risingwave_host }}:{{ inputs.risingwave_port }}/{{ inputs.database_name }}"
        username: "{{ inputs.risingwave_username }}"
        password: "{{ secret('RISINGWAVE_PASSWORD') }}"
        fetchType: FETCH_ONE
        timeout: PT30S
        sql: |
          SELECT
              name,
              parallelism AS verified_parallelism,
              state AS verified_state
          FROM rw_catalog.rw_streaming_jobs
          WHERE name = '{{ inputs.target_materialized_view }}'

  - id: log_operational_summary
    type: io.kestra.plugin.core.log.Log
    description: Records the final audit verdict and active worker capacity for the streaming pipeline.
    message: "RisingWave streaming audit concluded for view '{{ inputs.target_materialized_view }}'. Scaled: {{ outputs.evaluate_parallelism_rebalance.vars.requires_scaling }}. Reason: {{ outputs.evaluate_parallelism_rebalance.vars.remediation_reason }}."

triggers:
  - id: periodic_streaming_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: Runs scheduled streaming health check every 15 minutes.
    cron: "*/15 * * * *"

extend:
  title: RisingWave Streaming Materialized View Lag and Backpressure Sentinel
  metaTitle: RisingWave Streaming Materialized View Lag and Backpressure Sentinel Blueprint
  shortDescription: Audits RisingWave distributed streaming catalogs to detect materialized view lag, executing dynamic parallelism auto-scaling.
  metaDescription: Audits RisingWave streaming catalogs to detect materialized view barrier lag, executing real DDL mutations to dynamically scale worker parallelism.
  description: |
    Modern real-time analytics platforms rely on RisingWave to maintain continuously updated materialized views directly over high-velocity Kafka, Pulsar, and Kinesis event streams. However, upstream event volume surges, complex multi-way stream joins, or state store compaction latency can cause streaming workers to suffer backpressure. When this happens, streaming barrier latency spikes, materialized view freshness degrades, and downstream analytical dashboards show stale data. This blueprint provides a closed-loop operational workflow: it queries RisingWave's native system catalog (`rw_catalog.rw_streaming_jobs`) via PostgreSQL JDBC connectivity, evaluates streaming worker health in Python, executes real DDL commands (`ALTER MATERIALIZED VIEW ... SET PARALLELISM`) directly inside RisingWave to dynamically scale worker threads, verifies the updated parallelism post-remediation, and records verified operational status in Kestra audit logs.

    ## How it works
    1. A schedule trigger initiates the streaming audit every 15 minutes.
    2. A native PostgreSQL JDBC query task connects to RisingWave's frontend port and interrogates `rw_catalog.rw_streaming_jobs`.
    3. The query extracts active streaming job states, current worker thread allocations, and failure metrics.
    4. A Python script evaluates worker allocation against target capacity thresholds with strict loud failure on invalid catalog payloads.
    5. When backpressure or worker under-provisioning is detected, an `If` conditional task executes active remediation.
    6. A native PostgreSQL JDBC query task issues an `ALTER MATERIALIZED VIEW ... SET PARALLELISM` DDL command directly to RisingWave.
    7. A post-remediation verification query confirms that RisingWave rebalanced the dataflow graph and applied the target parallelism.
    8. The final audit task logs the verified operational outcome.

    ## Architecture diagram
    ```mermaid
    graph TD
        Trigger[Schedule Trigger: 15m] --> ProbeTelemetry[Postgres Query: rw_catalog.rw_streaming_jobs]
        ProbeTelemetry --> EvalRebalance[Python Script: Calculate Parallelism Requirements]
        EvalRebalance --> CheckScaling{Scaling Required?}
        CheckScaling -- Yes --> AlterParallelism[Postgres Query: ALTER MATERIALIZED VIEW SET PARALLELISM]
        AlterParallelism --> VerifyScale[Postgres Query: Verify Updated Parallelism]
        VerifyScale --> FinalLog[Log: Record Verified Capacity]
        CheckScaling -- No --> NominalLog[Log: Parallelism Optimal]
        NominalLog --> FinalLog
    ```

    ## What you get
    - Proactive detection of stalled streaming materialized views and backpressured worker threads in RisingWave.
    - Native PostgreSQL wire protocol integration using Kestra's official JDBC PostgreSQL plugin without third-party agents.
    - Direct DDL execution invoking RisingWave's native `ALTER MATERIALIZED VIEW ... SET PARALLELISM` command to relieve streaming bottlenecks in flight.
    - Post-remediation verification confirming that compute nodes applied the updated thread count.
    - Historical audit logging tracking streaming worker capacity and rebalance events across execution windows.

    ## Who it's for
    - Stream Processing Engineers maintaining real-time event-driven ETL pipelines.
    - Database Administrators operating RisingWave clusters over Kafka or Kinesis topics.
    - Site Reliability Engineers ensuring real-time business dashboards and fraud detection systems remain fresh.
    - Analytics Engineers relying on continuous materialized view freshness for sub-second query SLAs.

    ## Why orchestrate this with Kestra
    - **Native Wire-Protocol Support**: Connects directly to RisingWave via standard PostgreSQL JDBC drivers without requiring custom CLI binaries.
    - **Active Database Self-Healing**: Automatically executes real DDL scaling statements inside the database rather than merely dispatching passive alerts.
    - **Declarative Conditional Branching**: Isolates DDL mutation statements behind strictly evaluated health criteria.
    - **Centralized Secrets Governance**: Protects sensitive database passwords using encrypted namespace secrets.
    - **Declarative YAML Operations**: Version-controls database reliability runbooks alongside application infrastructure in Git.

    ## Use cases
    - **Dynamic Backpressure Relief**: Automatically scales materialized view worker threads during sudden Kafka traffic surges.
    - **Stalled Ingestion Healing**: Re-triggers worker thread allocations when transient network stalls cause partition starvation.
    - **Streaming SLA Enforcement**: Ensures real-time aggregation queries consistently maintain adequate compute parallelism.

    ## Inputs
    | Name | Type | Default | Description |
    | --- | --- | --- | --- |
    | `risingwave_host` | STRING | `localhost` | Hostname or IP address of the RisingWave compute or frontend node. |
    | `risingwave_port` | INT | `4566` | PostgreSQL-wire compatible port for RisingWave (default 4566). |
    | `database_name` | STRING | `dev` | RisingWave database containing target streaming materialized views. |
    | `risingwave_username` | STRING | `root` | Database user with DDL privileges on target streaming materialized views. |
    | `target_materialized_view` | STRING | `mv_realtime_order_aggregates` | Name of the streaming materialized view evaluated for auto-scaling. |
    | `max_allowable_lag_ms` | INT | `5000` | Streaming barrier lag threshold in milliseconds that triggers worker auto-scaling. |
    | `target_scale_parallelism` | INT | `8` | Desired worker thread parallelism applied to relieve streaming backpressure. |

    ## Expected outputs
    - `{{ outputs.probe_streaming_job_telemetry.row.total_streaming_jobs }}`: Total number of registered streaming jobs in the database.
    - `{{ outputs.evaluate_parallelism_rebalance.vars.requires_scaling }}`: Boolean flag indicating if worker parallelism scaling was applied.
    - `{{ outputs.evaluate_parallelism_rebalance.vars.current_parallelism }}`: Original worker parallelism observed prior to remediation.
    - `{{ outputs.verify_scaled_parallelism.row.verified_parallelism }}`: Post-remediation worker parallelism verified from system catalogs.

    ## Prerequisites
    - RisingWave cluster (v1.0 or newer) running and accessible over PostgreSQL port 4566.
    - Database user with SELECT and ALTER permissions on target materialized views and `rw_catalog`.
    - Network connectivity from Kestra workers to the RisingWave frontend host.
    - Secret configured in Kestra under `RISINGWAVE_PASSWORD`.

    ### Secrets
    - `RISINGWAVE_PASSWORD`: Password for the RisingWave database user.

    ## Quick start
    1. Confirm that RisingWave is running and listening on port 4566.
    2. Add `RISINGWAVE_PASSWORD` into your Kestra namespace secrets.
    3. Specify your RisingWave endpoint in `risingwave_host` and target view in `target_materialized_view`.
    4. Run a manual execution via the Kestra UI to verify connectivity and view active streaming job metrics.
    5. Enable the `periodic_streaming_audit` schedule trigger to establish automated continuous surveillance.

    ## Common pitfalls and troubleshooting
    - **Default Port**: RisingWave uses port 4566 for PostgreSQL wire compatibility, not the default PostgreSQL 5432.
    - **DDL Privileges**: Ensure the configured database user has permissions to execute `ALTER MATERIALIZED VIEW` statements.
    - **Catalog Name Matching**: The `target_materialized_view` parameter must match the exact view identifier in `rw_catalog.rw_streaming_jobs`.
    - **Firewall Rules**: Ensure security groups or network firewalls permit inbound TCP traffic on port 4566 from Kestra worker IPs.

    ## How to extend
    - **Traffic Surge Webhook**: Trigger instant auto-scaling via Kestra webhook when upstream Kafka producer rates exceed baseline thresholds.
    - **Multi-View Loops**: Wrap the scaling query in a Kestra `ForEach` loop to evaluate and rebalance all streaming views in a database concurrently.
    - **Downstream dbt Model Sync**: Trigger downstream transformation tasks once streaming barrier alignment is verified.

    ## Links
    - [Kestra PostgreSQL Plugin Documentation](https://kestra.io/plugins/plugin-jdbc-postgresql)
    - [Kestra Flow Control Documentation](https://kestra.io/plugins/plugin-core/io.kestra.plugin.core.flow.if)
    - [RisingWave System Catalogs Reference](https://docs.risingwave.com/docs/current/system-catalogs/)
    - [RisingWave Alter Streaming Parallelism Reference](https://docs.risingwave.com/docs/current/alter-streaming/)
  tags:
    - Data
    - Infrastructure
  subTags:
    - Realtime & Streaming
    - Day 2 Operations
  ee: false
  demo: false
