id: gcp-incident-war-room
namespace: company.team
description: |
  Turn every Google Cloud Monitoring incident into a ready-to-use Slack war
  room: a dedicated channel with on-call invited and the runbook posted, a
  GitHub tracking issue, and a Telegram page for critical alerts. When GCP
  reports the incident as resolved, the flow posts the time to resolve,
  closes the issue, and archives the channel after a grace period.

variables:
  slack_oncall_user_ids: ["U0123ABCDEF"]
  github_repository: your-org/your-repo
  escalate_severities: ["Critical", "Error"]
  archive_after: PT24H

triggers:
  - id: gcp_alert
    type: io.kestra.plugin.gcp.pubsub.RealtimeTrigger
    description: Receive Cloud Monitoring incident notifications the moment an alerting policy opens or closes an incident, through a Pub/Sub notification channel.
    projectId: "{{ secret('GCP_PROJECT_ID') }}"
    serviceAccount: "{{ secret('GCP_SERVICE_ACCOUNT') }}"
    topic: incident-alerts
    subscription: incident-alerts-kestra
    autoCreateSubscription: false
    serdeType: JSON

tasks:
  - id: route_by_state
    type: io.kestra.plugin.core.flow.Switch
    description: Cloud Monitoring sends one notification when an incident opens and another when it closes; each state gets its own branch.
    value: "{{ trigger.data.incident.state }}"
    cases:
      open:
        - id: lookup_open_incident
          type: io.kestra.plugin.core.kv.Get
          description: Check whether a war room already exists for this incident, so a re-delivered Pub/Sub message never opens a second channel.
          key: "incident_{{ trigger.data.incident.incident_id | slugify }}"
          errorOnMissing: false

        - id: open_once
          type: io.kestra.plugin.core.flow.If
          condition: "{{ (outputs.lookup_open_incident.value ?? '') == '' }}"
          then:
            - id: create_war_room
              type: io.kestra.plugin.slack.app.conversations.Create
              description: Create a dedicated channel named after the alerting policy and the incident ID, so concurrent incidents never share a room. The policy part is capped at 50 characters to stay within Slack's 80-character channel name limit.
              token: "{{ secret('SLACK_TOKEN') }}"
              name: "inc-{{ (trigger.data.incident.policy_name | slugify) | slice(0, min(50, (trigger.data.incident.policy_name | slugify | length))) }}-{{ trigger.data.incident.incident_id | substringAfterLast('.') | lower }}"

            - id: invite_oncall
              type: io.kestra.plugin.slack.app.conversations.Invite
              description: Pull the on-call engineers into the war room straight away.
              token: "{{ secret('SLACK_TOKEN') }}"
              channel: "{{ outputs.create_war_room.id }}"
              users: "{{ vars.slack_oncall_user_ids }}"

            - id: post_briefing
              type: io.kestra.plugin.slack.app.chats.Post
              description: Brief the room with what fired, the observed value against the threshold, the affected resource, the runbook from the alerting policy's documentation, and a link to the incident in the Cloud Console.
              token: "{{ secret('SLACK_TOKEN') }}"
              channel: "{{ outputs.create_war_room.id }}"
              messageText: |
                :rotating_light: *{{ trigger.data.incident.policy_name }}* — {{ trigger.data.incident.severity ?? 'No severity' }}
                {{ trigger.data.incident.summary }}

                *Condition:* {{ trigger.data.incident.condition_name }}
                *Resource:* {{ trigger.data.incident.resource_display_name ?? trigger.data.incident.resource_name ?? 'n/a' }}
                *Observed:* {{ trigger.data.incident.observed_value ?? 'n/a' }} (threshold {{ trigger.data.incident.threshold_value ?? 'n/a' }})
                *Started:* <!date^{{ trigger.data.incident.started_at }}^{date_short_pretty} {time}|{{ trigger.data.incident.started_at }}>

                *Runbook*
                {{ trigger.data.incident.documentation.content ?? 'No runbook attached to this alerting policy. Add one in the policy documentation field.' }}

                <{{ trigger.data.incident.url }}|Open the incident in Cloud Monitoring>

            - id: track_and_escalate
              type: io.kestra.plugin.core.flow.Parallel
              description: Open the tracking issue and page on-call at the same time; neither should wait for the other.
              tasks:
                - id: open_tracking_issue
                  type: io.kestra.plugin.github.issues.Create
                  description: Open a GitHub issue that becomes the incident record and the starting point for the postmortem.
                  oauthToken: "{{ secret('GITHUB_TOKEN') }}"
                  repository: "{{ vars.github_repository }}"
                  title: "[Incident] {{ trigger.data.incident.policy_name }}: {{ trigger.data.incident.condition_name }}"
                  body: |
                    **Severity:** {{ trigger.data.incident.severity ?? 'No severity' }}
                    **Summary:** {{ trigger.data.incident.summary }}
                    **Resource:** {{ trigger.data.incident.resource_display_name ?? trigger.data.incident.resource_name ?? 'n/a' }}
                    **Observed:** {{ trigger.data.incident.observed_value ?? 'n/a' }} (threshold {{ trigger.data.incident.threshold_value ?? 'n/a' }})
                    **Slack war room:** #{{ outputs.create_war_room.name }}
                    **Cloud Monitoring:** {{ trigger.data.incident.url }}

                    ## Timeline
                    - Opened: {{ (trigger.data.incident.started_at * 1000) | date("yyyy-MM-dd HH:mm 'UTC'", timeZone='UTC') }}

                    _Opened by Kestra execution `{{ execution.id }}`._

                - id: escalate_if_severe
                  type: io.kestra.plugin.core.flow.If
                  description: Only critical and error incidents page on-call over Telegram; warnings stay in Slack.
                  condition: "{{ vars.escalate_severities contains (trigger.data.incident.severity ?? 'No severity') }}"
                  then:
                    - id: page_oncall
                      type: io.kestra.plugin.telegram.TelegramSend
                      description: Page on-call on Telegram, which cuts through at night when Slack notifications are muted.
                      token: "{{ secret('TELEGRAM_TOKEN') }}"
                      channel: "{{ secret('TELEGRAM_CHAT_ID') }}"
                      payload: |
                        🚨 {{ trigger.data.incident.severity }} incident: {{ trigger.data.incident.policy_name }}
                        {{ trigger.data.incident.summary }}

                        War room: #{{ outputs.create_war_room.name }}
                        {{ trigger.data.incident.url }}

            - id: link_tracking_issue
              type: io.kestra.plugin.slack.app.chats.Post
              description: Post the tracking issue link in the room so notes and follow-ups land in one place.
              token: "{{ secret('SLACK_TOKEN') }}"
              channel: "{{ outputs.create_war_room.id }}"
              messageText: ":memo: Tracking issue: <{{ outputs.open_tracking_issue.issueUrl }}|#{{ outputs.open_tracking_issue.issueNumber }}>"

            - id: remember_incident
              type: io.kestra.plugin.core.kv.Set
              description: Store the channel and issue for this incident so the close notification can find them.
              key: "incident_{{ trigger.data.incident.incident_id | slugify }}"
              kvType: JSON
              value: |
                {
                  "channel_id": "{{ outputs.create_war_room.id }}",
                  "channel_name": "{{ outputs.create_war_room.name }}",
                  "issue_number": {{ outputs.open_tracking_issue.issueNumber }}
                }
          else:
            - id: skip_duplicate_open
              type: io.kestra.plugin.core.log.Log
              level: WARN
              message: "A war room already exists for incident {{ trigger.data.incident.incident_id }}; ignoring the repeated open notification."

      closed:
        - id: lookup_incident
          type: io.kestra.plugin.core.kv.Get
          description: Find the war room and tracking issue opened for this incident.
          key: "incident_{{ trigger.data.incident.incident_id | slugify }}"
          errorOnMissing: false

        - id: close_if_known
          type: io.kestra.plugin.core.flow.If
          condition: "{{ (outputs.lookup_incident.value ?? '') != '' }}"
          then:
            - id: post_resolution
              type: io.kestra.plugin.slack.app.chats.Post
              description: Tell the room the incident is resolved and how long it lasted.
              token: "{{ secret('SLACK_TOKEN') }}"
              channel: "{{ outputs.lookup_incident.value.channel_id }}"
              messageText: |
                :white_check_mark: *Resolved* after {{ (trigger.data.incident.ended_at - trigger.data.incident.started_at) / 60 }} min.
                Tracking issue #{{ outputs.lookup_incident.value.issue_number }} is closed. This channel stays open for follow-up and is archived after the grace period (`{{ vars.archive_after }}`); resume the paused execution in Kestra to archive it sooner.

            - id: resolve_tracking_issue
              type: io.kestra.plugin.core.flow.Parallel
              tasks:
                - id: comment_resolution
                  type: io.kestra.plugin.github.issues.Comment
                  description: Record when the incident ended and how long it lasted, so the postmortem starts from a timeline.
                  oauthToken: "{{ secret('GITHUB_TOKEN') }}"
                  repository: "{{ vars.github_repository }}"
                  issueNumber: "{{ outputs.lookup_incident.value.issue_number }}"
                  body: "Resolved by Cloud Monitoring at {{ (trigger.data.incident.ended_at * 1000) | date(\"yyyy-MM-dd HH:mm 'UTC'\", timeZone='UTC') }}, {{ (trigger.data.incident.ended_at - trigger.data.incident.started_at) / 60 }} min after it opened."

                - id: close_issue
                  type: io.kestra.plugin.core.http.Request
                  description: Close the tracking issue through the GitHub REST API.
                  method: PATCH
                  uri: "https://api.github.com/repos/{{ vars.github_repository }}/issues/{{ outputs.lookup_incident.value.issue_number }}"
                  headers:
                    Authorization: "Bearer {{ secret('GITHUB_TOKEN') }}"
                    Accept: application/vnd.github+json
                  contentType: application/json
                  body: '{"state": "closed", "state_reason": "completed"}'

            - id: forget_incident
              type: io.kestra.plugin.core.kv.Delete
              key: "incident_{{ trigger.data.incident.incident_id | slugify }}"

            - id: grace_period
              type: io.kestra.plugin.core.flow.Pause
              description: Keep the channel open for follow-up discussion before archiving it.
              pauseDuration: "{{ vars.archive_after }}"
              behavior: RESUME

            - id: archive_war_room
              type: io.kestra.plugin.slack.app.conversations.Archive
              token: "{{ secret('SLACK_TOKEN') }}"
              channel: "{{ outputs.lookup_incident.value.channel_id }}"
          else:
            - id: skip_unknown_incident
              type: io.kestra.plugin.core.log.Log
              level: WARN
              message: "No war room recorded for incident {{ trigger.data.incident.incident_id }}; it was probably opened before this flow was deployed."

errors:
  - id: alert_flow_failure
    type: io.kestra.plugin.telegram.TelegramSend
    description: If the war room itself fails to open or close, page on-call over Telegram, which doesn't depend on Slack being reachable.
    token: "{{ secret('TELEGRAM_TOKEN') }}"
    channel: "{{ secret('TELEGRAM_CHAT_ID') }}"
    payload: |
      ⚠️ The incident war room flow failed while handling a {{ trigger.data.incident.state ?? 'unknown' }} notification for "{{ trigger.data.incident.policy_name ?? 'unknown policy' }}".
      Handle the incident manually and check Kestra execution {{ execution.id }}.
      {{ trigger.data.incident.url ?? '' }}

extend:
  title: Open a Slack War Room for Every Google Cloud Monitoring Incident
  shortDescription: Event-driven flow that turns each Cloud Monitoring incident into a Slack war room, a GitHub tracking issue and a Telegram page, then closes them on resolution.
  metaTitle: GCP Incident War Room with Slack, GitHub and Telegram in Kestra
  metaDescription: Open a Slack war room, GitHub issue and Telegram page for every Google Cloud Monitoring incident, then resolve and archive it automatically.
  description: |
    When a Cloud Monitoring alert fires, the first ten minutes usually go to busywork: someone creates a channel, tries to remember who is on call, digs out the runbook and opens a ticket — while production is still down. This blueprint does all of that the moment the incident opens, and cleans up after itself when Google Cloud reports the incident as resolved.

    ## How it works

    1. An alerting policy sends its notifications to a **Pub/Sub notification channel**. The `gcp_alert` trigger (`io.kestra.plugin.gcp.pubsub.RealtimeTrigger`) starts an execution for every message, both when an incident **opens** and when it **closes**.
    2. `route_by_state` (`io.kestra.plugin.core.flow.Switch`) branches on `incident.state`.
    3. **On open**, after `lookup_open_incident` checks the KV store so a re-delivered message never opens a second room:
       - `create_war_room` creates a Slack channel named after the policy and the incident ID (for example `#inc-checkout-api-error-spike-nl7c8x2k5d0c`), and `invite_oncall` invites the on-call engineers.
       - `post_briefing` posts the policy, severity, summary, observed value against the threshold, the affected resource, the **runbook taken from the alerting policy's documentation field**, and a link to the incident in the Cloud Console.
       - `track_and_escalate` (`Parallel`) opens a GitHub tracking issue and, only for severities listed in `escalate_severities`, pages on-call on Telegram.
       - `link_tracking_issue` posts the issue link in the room, and `remember_incident` stores the channel and issue in the KV store under the incident ID.
    4. **On close**, `lookup_incident` finds the stored room. The flow posts the time to resolve, comments on and closes the GitHub issue, clears the KV entry, keeps the channel open for `archive_after` (a `Pause` you can resume early from the UI), then archives it.
    5. If any step fails, the `errors` block pages on-call over Telegram with the policy name and the execution ID, so a broken war room never goes unnoticed in the middle of an incident.

    ## What you get

    - A dedicated, consistently named channel per incident, with on-call already inside and the runbook already posted.
    - A GitHub issue per incident that records open and close times, ready to start the postmortem from.
    - Severity-aware escalation: critical incidents reach phones over Telegram, warnings stay in Slack.
    - Automatic clean-up: resolved incidents close their issue and archive their channel, so Slack doesn't fill up with stale war rooms.
    - Idempotency: duplicate open notifications and closes for unknown incidents are logged and ignored.

    ## Who it's for

    - SRE and platform teams running workloads on Google Cloud who already use Cloud Monitoring alerting policies.
    - Small teams without a paid incident-management tool who still want a repeatable incident routine.

    ## Prerequisites

    ### Google Cloud

    ```bash
    PROJECT_ID=your-project
    PROJECT_NUMBER=$(gcloud projects describe $PROJECT_ID --format='value(projectNumber)')

    # Topic the alerting policies publish to, and the subscription Kestra reads
    gcloud pubsub topics create incident-alerts --project $PROJECT_ID
    gcloud pubsub subscriptions create incident-alerts-kestra --topic incident-alerts --project $PROJECT_ID

    # Pub/Sub notification channel; add it to your alerting policies afterwards
    gcloud beta monitoring channels create --type pubsub --display-name "Kestra incident war room" \
      --channel-labels topic=projects/$PROJECT_ID/topics/incident-alerts --project $PROJECT_ID

    # Allow Cloud Monitoring to publish to the topic
    gcloud pubsub topics add-iam-policy-binding incident-alerts --project $PROJECT_ID \
      --member serviceAccount:service-$PROJECT_NUMBER@gcp-sa-monitoring-notification.iam.gserviceaccount.com \
      --role roles/pubsub.publisher

    # Service account for Kestra, limited to this one subscription
    gcloud iam service-accounts create kestra-incident --project $PROJECT_ID
    gcloud pubsub subscriptions add-iam-policy-binding incident-alerts-kestra --project $PROJECT_ID \
      --member serviceAccount:kestra-incident@$PROJECT_ID.iam.gserviceaccount.com --role roles/pubsub.subscriber

    # Key file whose content becomes the GCP_SERVICE_ACCOUNT secret
    gcloud iam service-accounts keys create kestra-incident.json --project $PROJECT_ID \
      --iam-account kestra-incident@$PROJECT_ID.iam.gserviceaccount.com
    ```

    The trigger sets `autoCreateSubscription: false` because the subscription already exists. With the default (`true`), the trigger lists every subscription in the project at startup, which needs project-wide Pub/Sub permissions this service account deliberately doesn't have.

    Write the runbook for each alerting policy in its **Documentation** field; the flow posts it in the war room.

    ### Slack

    A Slack app installed in your workspace with the bot scopes `channels:manage`, `channels:read` and `chat:write`. Copy its Bot User OAuth Token (`xoxb-…`).

    ### GitHub

    A fine-grained personal access token limited to the tracking repository, with **Issues: Read and write**.

    ### Telegram

    A bot created with [@BotFather](https://t.me/BotFather), and the chat ID of the on-call person or group. Send the bot a message first: bots cannot start conversations.

    ### Secrets

    - `GCP_PROJECT_ID`: project that hosts the topic and subscription.
    - `GCP_SERVICE_ACCOUNT`: JSON key of the `kestra-incident` service account.
    - `SLACK_TOKEN`: Slack bot token used to create, post to and archive channels.
    - `GITHUB_TOKEN`: GitHub token used to open, comment on and close tracking issues.
    - `TELEGRAM_TOKEN`: Telegram bot token used to page on-call.
    - `TELEGRAM_CHAT_ID`: Telegram chat that receives the page.

    ### Variables

    - `slack_oncall_user_ids`: Slack member IDs to invite into every war room (Profile → ⋮ → Copy member ID). List at least one ID.
    - `github_repository`: repository for tracking issues, as `owner/repo`.
    - `escalate_severities`: alerting policy severities that also page on Telegram. Defaults to `Critical` and `Error`.
    - `archive_after`: ISO 8601 duration to keep a resolved room open before archiving it. Defaults to `PT24H`.

    ## Quick start

    1. Complete the Google Cloud setup above and add the Pub/Sub channel to an alerting policy.
    2. Add the six secrets to your Kestra namespace and set the four variables.
    3. Save the flow; the realtime trigger starts listening immediately.
    4. To test without breaking anything, publish a sample incident:

       ```bash
       gcloud pubsub topics publish incident-alerts --project $PROJECT_ID --message '{"version":"1.2","incident":{"incident_id":"0.demo123","state":"open","started_at":1767225600,"policy_name":"Demo policy","condition_name":"Demo condition","summary":"Demo incident","severity":"Critical","url":"https://console.cloud.google.com/monitoring/alerting","documentation":{"content":"Demo runbook"}}}'
       ```

       Publish the same message with `"state":"closed"` and an `ended_at` timestamp to run the resolution branch.

    ## How to extend

    - Look up the current on-call from PagerDuty or Opsgenie instead of a fixed `slack_oncall_user_ids` list.
    - Add an `io.kestra.plugin.gcp.monitoring.Query` task to attach the last hour of the alerting metric to the briefing.
    - Post the incident to a status page when `severity` is `Critical`.

    ## Links

    - [Cloud Monitoring Pub/Sub notification channels](https://cloud.google.com/monitoring/support/notification-options#pubsub)
    - [GCP plugin](https://kestra.io/plugins/plugin-gcp), [Slack plugin](https://kestra.io/plugins/plugin-slack), [GitHub plugin](https://kestra.io/plugins/plugin-github), [Telegram plugin](https://kestra.io/plugins/plugin-telegram)
    - This blueprint has been created by [Vidhaankhare16](https://github.com/Vidhaankhare16)
