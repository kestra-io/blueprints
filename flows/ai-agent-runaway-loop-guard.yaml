id: ai-agent-runaway-loop-guard
namespace: company.team
description: Stop runaway AI agents before they burn the budget. The agent platform reports every step
  (run id, action signature, cumulative tokens) before executing it; a deterministic evaluator checks
  the report against a step cap, a token budget, a repeat limit, and cycle detection over the recent
  action window. Healthy runs continue untouched, near-limit runs return a warning the platform can
  surface to the operator, and a breached run pauses for a human decision, with kill or timeout
  meaning the run is stopped. Every verdict is written to an audit record and POSTed back to the
  platform, so the decision lives in the orchestrator, not inside the agent that is misbehaving.
triggers:
  - id: on_agent_step
    type: io.kestra.plugin.core.trigger.Webhook
    description: 'The agent platform POSTs each proposed step before executing it: run id, agent name,
      the step''s action signature (a hash or canonical form of the tool call), the run''s recent action
      signatures, and cumulative tokens so far. Shipped with a keyed URL; treat the key as a secret.'
    key: "{{ secret('LOOP_GUARD_WEBHOOK_KEY') }}"
inputs:
  - id: callback_url
    type: STRING
    defaults: ''
    description: URL the verdict is POSTed to after evaluation. Empty records the verdict in the audit
      output only (demo mode).
  - id: max_steps
    type: INT
    defaults: 50
    description: Hard cap on steps per run. A step that would exceed it pauses the run.
  - id: repeat_limit
    type: INT
    defaults: 4
    description: How many times one action signature may appear in the recent window before the run
      is treated as looping.
  - id: token_budget
    type: INT
    defaults: 200000
    description: Hard cap on cumulative tokens per run.
  - id: report_override
    type: STRING
    defaults: ''
    description: Leave empty in production. Reserved for demos and tests that drive the flow without a
      live agent platform; carries the step report as JSON.
tasks:
  - id: guard_workspace
    type: io.kestra.plugin.core.flow.WorkingDirectory
    description: One shared directory so the verdict written by the evaluator is exactly the record
      the callback task ships.
    tasks:
      - id: evaluate_step
        type: io.kestra.plugin.scripts.python.Script
        description: Score the step report. All checks are deterministic comparisons against the
          configured limits; the reasons list names every check that fired.
        taskRunner:
          type: io.kestra.plugin.core.runner.Process
        script: |
          import json
          from kestra import Kestra

          raw = """{{ trigger.body }}""".strip()
          override = """{{ inputs.report_override }}""".strip()
          report = json.loads(override) if override else (json.loads(raw) if raw else {})
          report.setdefault("run_id", "demo-run")
          report.setdefault("agent", "demo-agent")
          report.setdefault("action_signature", "run_tests")
          report.setdefault("recent_signatures", ["edit_file", "run_tests", "edit_file", "run_tests", "edit_file"])
          report.setdefault("cumulative_tokens", 18400)

          max_steps = int("{{ inputs.max_steps }}")
          repeat_limit = int("{{ inputs.repeat_limit }}")
          token_budget = int("{{ inputs.token_budget }}")

          recent = report.get("recent_signatures", [])
          current = report.get("action_signature", "")
          steps = len(recent) + 1
          tokens = int(report.get("cumulative_tokens", 0))
          window = (recent + [current])[-20:]
          repeats = window.count(current)
          reasons = []
          verdict = "CONTINUE"
          rank = {"CONTINUE": 0, "WARN": 1, "PAUSE": 2}

          def escalate(level, reason):
              global verdict
              reasons.append(reason)
              if rank[level] > rank[verdict]:
                  verdict = level

          if steps > max_steps:
              escalate("PAUSE", f"step count {steps} exceeds the run cap of {max_steps}")
          if tokens > token_budget:
              escalate("PAUSE", f"cumulative tokens {tokens} exceed the budget of {token_budget}")
          if repeats >= repeat_limit:
              escalate("PAUSE", f"action repeated {repeats} times in the recent window (limit {repeat_limit})")
          tail = recent + [current]
          if len(tail) >= 6:
              last6 = tail[-6:]
              if last6[0] == last6[2] == last6[4] and last6[1] == last6[3] == last6[5] and last6[0] != last6[1]:
                  escalate("PAUSE", "two-action cycle detected over the last 6 steps (A B A B A B)")
              elif last6[0] == last6[3] and last6[1] == last6[4] and last6[2] == last6[5]:
                  escalate("PAUSE", "three-action cycle detected over the last 6 steps (A B C A B C)")
          if verdict == "CONTINUE":
              if repeats == repeat_limit - 1:
                  escalate("WARN", f"action has repeated {repeats} times, one short of the limit")
              if steps > int(0.8 * max_steps):
                  escalate("WARN", f"step count {steps} is past 80% of the run cap")
              if tokens > int(0.8 * token_budget):
                  escalate("WARN", f"cumulative tokens {tokens} are past 80% of the budget")

          record = {
              "run_id": report["run_id"],
              "agent": report["agent"],
              "action_signature": current,
              "steps": steps,
              "repeats": repeats,
              "cumulative_tokens": tokens,
              "verdict": verdict,
              "reasons": reasons,
          }
          with open("verdict.json", "w") as fh:
              json.dump(record, fh, indent=2)
          Kestra.outputs(record)
          Kestra.vars({"verdict": verdict, "needs_human": verdict == "PAUSE"})
      - id: human_gate
        type: io.kestra.plugin.core.flow.If
        description: Only a breached run waits for a person. Continue and warn verdicts are returned
          to the platform immediately.
        condition: "{{ outputs.evaluate_step.vars.needs_human }}"
        then:
          - id: await_operator
            type: io.kestra.plugin.core.flow.Pause
            description: "The run breached a guard limit: {{ outputs.evaluate_step.vars.reasons }} Resume
              to let this step proceed anyway; kill the execution (or let it time out) to stop the run."
            onResume:
              - id: resumed_note
                type: io.kestra.plugin.core.log.Log
                message: "Operator resumed run {{ outputs.evaluate_step.vars.run_id }} after a loop-guard pause."
      - id: record_and_callback
        type: io.kestra.plugin.scripts.python.Script
        description: Append the verdict to the audit log and POST it to the platform callback.
          Reaching this task after a pause means an operator resumed, which the record states.
        taskRunner:
          type: io.kestra.plugin.core.runner.Process
        script: |
          import json, urllib.request
          from kestra import Kestra

          with open("verdict.json") as fh:
              record = json.load(fh)
          with open("loop_guard_audit.jsonl", "a") as fh:
              fh.write(json.dumps(record) + "\n")
          callback = """{{ inputs.callback_url }}""".strip()
          if callback:
              req = urllib.request.Request(
                  callback,
                  data=json.dumps(record).encode(),
                  headers={"Content-Type": "application/json"},
                  method="POST",
              )
              with urllib.request.urlopen(req, timeout=15) as resp:
                  record["callback_status"] = resp.status
          Kestra.outputs(record)
labels:
  system.template: 'true'
documentation:
  - "## Why this blueprint exists\n\n\nAgents fail expensively in a specific way: they loop. A tool
    returns an unexpected result, the agent retries the same call, the context grows, and the run
    burns tokens until a person notices the bill. Step caps inside the agent do not help when the
    agent itself is the thing misbehaving. This blueprint moves the guard into the orchestrator:
    the platform reports every step before executing it, and the run cannot proceed past a breach
    without a human decision.\n\n\n## How it works\n\n\n1. `on_agent_step`
    (`io.kestra.plugin.core.trigger.Webhook`) receives the step report: run id, agent name, the
    step's action signature, the run's recent action signatures, and cumulative tokens.\n\n2.
    `evaluate_step` (`io.kestra.plugin.scripts.python.Script`) applies four deterministic checks:
    a step cap, a token budget, a per-action repeat limit over the recent window, and cycle
    detection (A B A B A B and A B C A B C patterns over the last six steps). Near-limit runs get
    a WARN verdict at 80 percent of a cap or one repeat short of the limit.\n\n3. `human_gate`
    (`io.kestra.plugin.core.flow.If`) routes PAUSE verdicts to `await_operator`
    (`io.kestra.plugin.core.flow.Pause`). Resume means the step proceeds; kill or timeout means
    the run stops, deny by default.\n\n4. `record_and_callback`
    (`io.kestra.plugin.scripts.python.Script`) appends the verdict, with every reason that fired,
    to the audit log and POSTs it back to the platform.\n\n\n## Operating notes\n\n\n- Signatures
    are the caller's choice: a hash of the tool name plus canonical arguments works well. Coarse
    signatures catch loops earlier; fine signatures catch only exact repeats.\n\n- The evaluator
    is stateless by design: the platform sends the recent window with each step, so the guard
    survives agent restarts and scales horizontally.\n\n- Set the limits from observed healthy
    runs, not guesses: the WARN band at 80 percent exists so operators can tune before the first
    hard pause.\n\n- Companion guardrails in this set: the input injection firewall screens what
    reaches the agent, the output gate screens what leaves it, the action approval gate checks
    high-impact steps before they run, and the red-team probe harness tests all of them."
