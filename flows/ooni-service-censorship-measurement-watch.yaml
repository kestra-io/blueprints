id: ooni-service-censorship-measurement-watch
namespace: company.team

description: |
  Find out whether your domains are blocked or interfered with in the countries you serve, from
  OONI Probe measurements. Each day the flow pulls OONI's per-day, per-country aggregation for
  every domain (Web Connectivity test), compares the last week's anomaly rate with the two weeks
  before it in DuckDB, and flags NEW_BLOCKING (blockpage fingerprints matched), ANOMALY_SPIKE and
  INSUFFICIENT_DATA. A KV state alerts each domain and country once per escalation, a Switch routes
  blocking and anomaly alerts to Slack with links to example measurements on OONI Explorer, and the
  full per-domain, per-country table is written to CSV. The OONI API is open and needs no key.

inputs:
  - id: domains
    type: ARRAY
    itemType: STRING
    defaults:
      - www.bbc.com
      - signal.org
      - zoom.us
      - www.notion.so
    description: Hostnames to watch. OONI matches the exact hostname of the tested URL, so `www.bbc.com` and `bbc.com` are different series. A scheme, path or port is stripped. The defaults mix domains blocked in some countries (`www.bbc.com`, `signal.org`), a clean one (`zoom.us`) and one OONI does not test (`www.notion.so`).

  - id: countries
    type: ARRAY
    itemType: STRING
    defaults:
      - RU
      - IR
      - CN
      - MM
      - TZ
      - VN
      - TR
      - US
    description: ISO 3166-1 alpha-2 country codes to watch. Leave empty to watch every country OONI has data for (more rows and more INSUFFICIENT_DATA).

  - id: window_days
    type: INT
    defaults: 7
    description: Days in the current window, ending yesterday (UTC). Today is never included because its data is still arriving.

  - id: baseline_days
    type: INT
    defaults: 14
    description: Days in the baseline window immediately before the current window.

  - id: min_samples
    type: INT
    defaults: 20
    description: Minimum usable measurements (measurements minus probe failures) in a window. Below it the pair is INSUFFICIENT_DATA and its state is left unchanged.

  - id: min_anomaly_rate
    type: FLOAT
    defaults: 0.25
    description: Share of usable measurements that must be anomalous or confirmed before a pair counts as anomalous. OONI has a background of false-positive anomalies of a few percent on healthy networks.

  - id: spike_delta
    type: FLOAT
    defaults: 0.15
    description: How much the anomaly rate must rise over the baseline (0.15 = 15 percentage points) to be an ANOMALY_SPIKE rather than ELEVATED_ANOMALIES.

  - id: alert_on_persistent
    type: BOOL
    defaults: true
    description: Also alert (once) on ONGOING_BLOCKING and ELEVATED_ANOMALIES, i.e. interference already present in the baseline. Turn off to alert only on changes.

variables:
  user_agent: "kestra-ooni-service-censorship-measurement-watch/1.0 (https://kestra.io)"

triggers:
  - id: daily_check
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 7 * * *"
    description: OONI publishes measurements within hours of collection; 07:00 UTC sees yesterday almost complete.

tasks:
  - id: plan
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: |
      Normalises the inputs (lower-cases hostnames, strips scheme, path and port, upper-cases country codes, removes
      duplicates), rejects malformed values, and computes the windows from the trigger date so a backfill evaluates the
      right days. The run fails here if no valid domain is left.
    url: "jdbc:duckdb:"
    fetchType: FETCH_ONE
    parameters:
      domains: "{{ inputs.domains | join(',') }}"
      countries: "{{ inputs.countries | join(',') }}"
      run_day: "{{ (trigger.date ?? execution.startDate) | date('yyyy-MM-dd', timeZone='UTC') }}"
      window_days: "{{ inputs.window_days }}"
      baseline_days: "{{ inputs.baseline_days }}"
    sql: |
      CREATE TABLE d_in AS
      SELECT raw, regexp_replace(regexp_replace(lower(trim(raw)), '^[a-z][a-z0-9+.-]*[:]//', ''), '[/?#:].*$', '') AS host
      FROM unnest(string_split(:domains, ',')) AS t(raw) WHERE trim(raw) <> '';

      CREATE TABLE d_ok AS
      SELECT host, min(raw) AS raw FROM d_in
      WHERE regexp_full_match(host, '([a-z0-9]([a-z0-9-]*[a-z0-9])?[.])+[a-z][a-z0-9-]*[a-z0-9]')
      GROUP BY host;

      CREATE TABLE c_in AS
      SELECT raw, upper(trim(raw)) AS cc FROM unnest(string_split(:countries, ',')) AS t(raw) WHERE trim(raw) <> '';

      SELECT
        CASE WHEN (SELECT count(*) FROM d_ok) = 0 THEN error('No valid domain in the domains input') END AS guard,
        (SELECT CAST(to_json(list(host ORDER BY host)) AS VARCHAR) FROM d_ok) AS domains_json,
        (SELECT count(*) FROM d_ok) AS domain_count,
        (SELECT coalesce(string_agg(DISTINCT cc, ',' ORDER BY cc), '') FROM c_in WHERE regexp_full_match(cc, '[A-Z]{2}')) AS countries,
        (SELECT coalesce(string_agg(DISTINCT raw, '; '), '') FROM d_in WHERE host NOT IN (SELECT host FROM d_ok)) AS invalid_domains,
        (SELECT coalesce(string_agg(DISTINCT raw, '; '), '') FROM c_in WHERE NOT regexp_full_match(cc, '[A-Z]{2}')) AS invalid_countries,
        CAST(CAST(:run_day AS DATE) AS VARCHAR) AS until_day,
        CAST(CAST(:run_day AS DATE) - CAST(:window_days AS INTEGER) AS VARCHAR) AS window_start,
        CAST(CAST(:run_day AS DATE) - CAST(:window_days AS INTEGER) - CAST(:baseline_days AS INTEGER) AS VARCHAR) AS baseline_start;

  - id: fetch_aggregates
    type: io.kestra.plugin.core.flow.Loop
    description: |
      One aggregation request per domain covering baseline and current window, split by day (`axis_x`) and country
      (`axis_y`). `time_grain=day` is set explicitly because OONI switches to hourly buckets for short ranges. Requests run
      one at a time: the API has a per-IP query-time quota and answers 429 "quota exceeded" when it is spent. A domain
      that still fails after retries is reported as FETCH_FAILED and the others are scored.
    values: "{{ outputs.plan.outputs[0].row.domains_json }}"
    concurrencyLimit: 1
    tasks:
      - id: aggregation
        type: io.kestra.plugin.core.http.Download
        allowFailure: true
        timeout: PT3M
        retry:
          type: exponential
          interval: PT20S
          maxInterval: PT2M
          maxAttempts: 3
        uri: "https://api.ooni.io/api/v1/aggregation?test_name=web_connectivity&domain={{ item.value }}{{ outputs.plan.outputs[0].row.countries is empty ? '' : '&probe_cc=' ~ outputs.plan.outputs[0].row.countries }}&since={{ outputs.plan.outputs[0].row.baseline_start }}&until={{ outputs.plan.outputs[0].row.until_day }}&axis_x=measurement_start_day&axis_y=probe_cc&time_grain=day"
        headers:
          User-Agent: "{{ vars.user_agent }}"
          Accept: application/json
    outputs:
      - id: domain
        type: STRING
        value: "{{ item.value }}"
      - id: uri
        type: STRING
        value: "{{ outputs.aggregation.uri ?? '' }}"

  - id: previous_state
    type: io.kestra.plugin.core.kv.Get
    key: ooni_censorship_watch_state
    errorOnMissing: false
    description: JSON array of the last alerted severity per domain and country (0 OK, 1 anomalies, 2 blocking). Missing on the first run, which is the BASELINE.

  - id: score
    type: io.kestra.plugin.jdbc.duckdb.Queries
    description: |
      Reads one response per domain (the file name carries the domain), sums the disjoint OONI counters per window
      (`ok + anomaly + confirmed + failure = measurement`), drops probe failures from the denominator and classifies each
      domain and country. Confirmed means a known blockpage or blocking-DNS fingerprint matched; anomaly means the probe
      result differed from the control measurement, which is a signal and not proof. State is the highest severity
      already alerted, so an alert repeats only on escalation or after a recovery to OK.
    url: "jdbc:duckdb:"
    timeZoneId: UTC
    fetchType: FETCH_ONE
    inputFiles: "{{ outputs.fetch_aggregates.outputs | jq('[.[].outputs | select(.uri != \"\") | {key: (\"agg__\" + .domain + \".json\"), value: .uri}] | from_entries + {\"agg__.json\": \"{\\\"result\\\": []}\"}') | first | toJson }}"
    outputFiles:
      - pairs_csv
    parameters:
      domains_json: "{{ outputs.plan.outputs[0].row.domains_json }}"
      fetched_json: "{{ outputs.fetch_aggregates.outputs | jq('[.[].outputs | select(.uri != \"\") | .domain]') | first | toJson }}"
      countries: "{{ outputs.plan.outputs[0].row.countries }}"
      state_json: "{{ outputs.previous_state.value ?? '[]' }}"
      window_start: "{{ outputs.plan.outputs[0].row.window_start }}"
      baseline_start: "{{ outputs.plan.outputs[0].row.baseline_start }}"
      until_day: "{{ outputs.plan.outputs[0].row.until_day }}"
      min_samples: "{{ inputs.min_samples }}"
      min_rate: "{{ inputs.min_anomaly_rate }}"
      spike_delta: "{{ inputs.spike_delta }}"
      persistent: "{{ inputs.alert_on_persistent }}"
    sql: |
      CREATE TABLE fetched AS SELECT unnest(from_json(:fetched_json, '["VARCHAR"]')) AS domain;
      CREATE TABLE watched AS SELECT unnest(from_json(:domains_json, '["VARCHAR"]')) AS domain;

      CREATE TABLE daily AS
      SELECT regexp_extract(filename, 'agg__(.+)[.]json$', 1) AS domain,
             upper(r.probe_cc) AS cc,
             CAST(substr(r.measurement_start_day, 1, 10) AS DATE) AS day,
             r.measurement_count AS n, r.failure_count AS f, r.anomaly_count AS a, r.confirmed_count AS c
      FROM (SELECT filename, unnest(from_json(json_extract(content, '$.result'),
              '[{"probe_cc":"VARCHAR","measurement_start_day":"VARCHAR","measurement_count":"BIGINT","failure_count":"BIGINT","anomaly_count":"BIGINT","confirmed_count":"BIGINT"}]')) AS r
            FROM read_text('agg__*.json'));

      CREATE TABLE pairs AS
      SELECT w.domain, c.cc FROM watched w, (SELECT unnest(string_split(:countries, ',')) AS cc) c WHERE :countries <> ''
      UNION SELECT DISTINCT domain, cc FROM daily;

      CREATE TABLE prev AS
      SELECT s->>'$.domain' AS domain, s->>'$.cc' AS cc, CAST(s->>'$.sev' AS INTEGER) AS sev, s->>'$.status' AS status, s->>'$.since' AS since
      FROM (SELECT unnest(from_json(:state_json, '["JSON"]')) AS s);

      CREATE TABLE win AS
      SELECT p.domain, p.cc, p.domain IN (SELECT domain FROM fetched) AS fetched,
             coalesce(sum(d.n) FILTER (WHERE d.day >= CAST(:window_start AS DATE)), 0) AS cur_measurements,
             coalesce(sum(d.n - d.f) FILTER (WHERE d.day >= CAST(:window_start AS DATE)), 0) AS cur_usable,
             coalesce(sum(d.a) FILTER (WHERE d.day >= CAST(:window_start AS DATE)), 0) AS cur_anomaly,
             coalesce(sum(d.c) FILTER (WHERE d.day >= CAST(:window_start AS DATE)), 0) AS cur_confirmed,
             count(DISTINCT d.day) FILTER (WHERE d.day >= CAST(:window_start AS DATE) AND d.c > 0) AS cur_confirmed_days,
             coalesce(sum(d.n - d.f) FILTER (WHERE d.day < CAST(:window_start AS DATE)), 0) AS base_usable,
             coalesce(sum(d.a) FILTER (WHERE d.day < CAST(:window_start AS DATE)), 0) AS base_anomaly,
             coalesce(sum(d.c) FILTER (WHERE d.day < CAST(:window_start AS DATE)), 0) AS base_confirmed,
             max(d.day) AS last_day_with_data
      FROM pairs p LEFT JOIN daily d ON d.domain = p.domain AND d.cc = p.cc
      GROUP BY p.domain, p.cc;

      CREATE TABLE rated AS
      SELECT *,
             CASE WHEN cur_usable > 0 THEN round((cur_anomaly + cur_confirmed) / cur_usable, 3) END AS cur_rate,
             CASE WHEN base_usable > 0 THEN round((base_anomaly + base_confirmed) / base_usable, 3) END AS base_rate,
             base_usable >= CAST(:min_samples AS INTEGER) AS has_baseline
      FROM win;

      CREATE TABLE classified AS
      SELECT r.*,
             CASE WHEN NOT r.fetched THEN 'FETCH_FAILED'
                  WHEN r.cur_usable < CAST(:min_samples AS INTEGER) THEN 'INSUFFICIENT_DATA'
                  WHEN r.cur_confirmed > 0 AND r.has_baseline AND r.base_confirmed > 0 THEN 'ONGOING_BLOCKING'
                  WHEN r.cur_confirmed > 0 THEN 'NEW_BLOCKING'
                  WHEN r.cur_rate >= CAST(:min_rate AS DOUBLE) AND r.has_baseline
                       AND r.cur_rate - r.base_rate >= CAST(:spike_delta AS DOUBLE) THEN 'ANOMALY_SPIKE'
                  WHEN r.cur_rate >= CAST(:min_rate AS DOUBLE) THEN 'ELEVATED_ANOMALIES'
                  ELSE 'OK' END AS status,
             CASE WHEN NOT r.fetched THEN 'API request failed after retries; state kept'
                  WHEN r.domain NOT IN (SELECT domain FROM daily) THEN 'OONI has no measurements of this hostname in any watched country: probably not on the test lists (exact host match, try the www. variant)'
                  WHEN r.last_day_with_data IS NULL THEN 'No measurements from this country in either window'
                  WHEN r.cur_usable < CAST(:min_samples AS INTEGER) THEN 'Only ' || r.cur_usable || ' usable measurements (minimum ' || :min_samples || ')'
                  WHEN NOT r.has_baseline THEN 'Baseline has only ' || r.base_usable || ' usable measurements: no spike or new/ongoing comparison possible'
                  ELSE '' END AS note,
             coalesce(p.sev, 0) AS prev_sev, p.status AS prev_status, p.since AS prev_since
      FROM rated r LEFT JOIN prev p ON p.domain = r.domain AND p.cc = r.cc;

      CREATE TABLE decided AS
      SELECT *,
             CASE status WHEN 'NEW_BLOCKING' THEN 2 WHEN 'ONGOING_BLOCKING' THEN 2 WHEN 'ANOMALY_SPIKE' THEN 1 WHEN 'ELEVATED_ANOMALIES' THEN 1 ELSE 0 END AS sev,
             (status IN ('NEW_BLOCKING', 'ANOMALY_SPIKE') OR (CAST(:persistent AS BOOLEAN) AND status IN ('ONGOING_BLOCKING', 'ELEVATED_ANOMALIES')))
               AND (CASE status WHEN 'NEW_BLOCKING' THEN 2 WHEN 'ONGOING_BLOCKING' THEN 2 ELSE 1 END) > coalesce(prev_sev, 0) AS alert,
             prev_sev > 0 AND status = 'OK' AS recovered
      FROM classified;

      CREATE TABLE alerts AS
      SELECT *,
             row_number() OVER (ORDER BY sev DESC, cur_confirmed DESC, cur_rate DESC, domain, cc) AS rank,
             domain || ' in ' || cc || ': ' || status || ', ' || cur_confirmed || ' confirmed and ' || cur_anomaly || ' anomalous of ' || cur_usable
               || ' usable measurements (' || CAST(round(cur_rate * 100, 1) AS VARCHAR) || '% vs '
               || CASE WHEN has_baseline THEN CAST(round(base_rate * 100, 1) AS VARCHAR) || '% in the baseline'
                       ELSE 'a baseline of only ' || base_usable || ' usable' END || ')'
               || CASE WHEN cur_confirmed_days > 0 THEN ', blockpage on ' || cur_confirmed_days || ' day(s)' ELSE '' END AS line,
             'https://explorer.ooni.org/search?since=' || :window_start || '&until=' || :until_day || '&probe_cc=' || cc
               || '&test_name=web_connectivity&domain=' || domain || '&only=' || CASE WHEN cur_confirmed > 0 THEN 'confirmed' ELSE 'anomalies' END AS search_url,
             'https://api.ooni.io/api/v1/measurements?test_name=web_connectivity&domain=' || domain || '&probe_cc=' || cc
               || '&since=' || :window_start || '&until=' || :until_day
               || CASE WHEN cur_confirmed > 0 THEN '&confirmed=true' ELSE '&anomaly=true' END
               || '&order_by=measurement_start_time&order=desc&limit=3' AS samples_url
      FROM decided WHERE alert;

      COPY (
        SELECT domain, cc AS country, status, note, cur_measurements, cur_usable, cur_anomaly, cur_confirmed, cur_confirmed_days,
               cur_rate AS cur_anomaly_rate, base_usable, base_anomaly, base_confirmed, base_rate AS base_anomaly_rate,
               last_day_with_data, alert, recovered, prev_status
        FROM decided ORDER BY sev DESC, domain, cc
      ) TO '{{ outputFiles.pairs_csv }}' (HEADER, DELIMITER ',');

      SELECT
        CASE WHEN (SELECT count(*) FROM fetched) = 0 THEN error('Every OONI aggregation request failed (quota exceeded or API unavailable), state left unchanged') END AS guard,
        (SELECT count(*) FROM prev) = 0 AS is_baseline,
        (SELECT count(*) FROM watched) AS domains,
        (SELECT count(*) FROM watched) - (SELECT count(*) FROM fetched) AS fetch_failed_domains,
        (SELECT count(*) FROM decided) AS pairs,
        (SELECT count(*) FILTER (WHERE status = 'NEW_BLOCKING') FROM decided) AS new_blocking,
        (SELECT count(*) FILTER (WHERE status = 'ONGOING_BLOCKING') FROM decided) AS ongoing_blocking,
        (SELECT count(*) FILTER (WHERE status = 'ANOMALY_SPIKE') FROM decided) AS anomaly_spike,
        (SELECT count(*) FILTER (WHERE status = 'ELEVATED_ANOMALIES') FROM decided) AS elevated,
        (SELECT count(*) FILTER (WHERE status = 'OK') FROM decided) AS ok,
        (SELECT count(*) FILTER (WHERE status = 'INSUFFICIENT_DATA') FROM decided) AS insufficient,
        (SELECT count(*) FROM alerts) AS alerts,
        (SELECT count(*) FILTER (WHERE recovered) FROM decided) AS recovered,
        CASE WHEN (SELECT count(*) FROM alerts WHERE sev = 2) > 0 THEN 'BLOCKING'
             WHEN (SELECT count(*) FROM alerts) > 0 THEN 'ANOMALY' ELSE 'QUIET' END AS route,
        CASE WHEN (SELECT count(*) FROM alerts) > 10 THEN chr(10) || '...and ' || ((SELECT count(*) FROM alerts) - 10) || ' more alert(s) in the CSV' ELSE '' END
          || chr(10) || CASE WHEN (SELECT count(*) FROM alerts WHERE sev = 2) > 0
                             THEN 'Confirmed = a known blockpage or blocking-DNS fingerprint matched on at least one network. Anomalies alone are signals, not proof.'
                             ELSE 'Anomalies are signals, not proof: check the measurements and the networks (ASN) before acting.' END
          || chr(10) || 'Execution: ' AS slack_footer,
        (SELECT coalesce(string_agg(domain || ' ' || cc, ', ' ORDER BY domain, cc), '') FROM decided WHERE status = 'INSUFFICIENT_DATA' AND domain IN (SELECT domain FROM daily)) AS insufficient_list,
        (SELECT coalesce(string_agg(domain, ', ' ORDER BY domain), '') FROM fetched WHERE domain NOT IN (SELECT domain FROM daily)) AS not_measured_domains,
        (SELECT coalesce(string_agg(domain || ' ' || cc || ' (was ' || prev_status || ')', ', '), '') FROM decided WHERE recovered) AS recovered_list,
        (SELECT coalesce(CAST(to_json(list(json_object('line', line, 'search_url', search_url, 'samples_url', samples_url) ORDER BY rank)) AS VARCHAR), '[]')
           FROM alerts WHERE rank <= 10) AS top_alerts,
        (SELECT CAST(json_group_array(json_object('domain', domain, 'cc', cc, 'sev', sev, 'status', status, 'since', since)) AS VARCHAR) FROM (
           SELECT domain, cc,
                  CASE WHEN alert THEN sev WHEN status = 'OK' THEN 0 ELSE prev_sev END AS sev,
                  CASE WHEN alert THEN status WHEN status = 'OK' THEN 'OK' ELSE coalesce(prev_status, status) END AS status,
                  CASE WHEN alert THEN :until_day WHEN status = 'OK' THEN NULL ELSE prev_since END AS since
           FROM decided
           UNION ALL
           SELECT domain, cc, sev, status, since FROM prev p
           WHERE NOT EXISTS (SELECT 1 FROM decided d WHERE d.domain = p.domain AND d.cc = p.cc))) AS new_state;

  - id: save_state
    type: io.kestra.plugin.core.kv.Set
    description: Pairs that were not measured or not fetched keep their previous severity; pairs removed from the inputs keep their history.
    key: ooni_censorship_watch_state
    value: "{{ outputs.score.outputs[0].row.new_state }}"

  - id: has_alerts
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.score.outputs[0].row.alerts > 0 }}"
    then:
      - id: evidence
        type: io.kestra.plugin.core.flow.Loop
        description: For the ten most severe alerts, fetches the three latest confirmed (or anomalous) measurements so the alert links to concrete evidence on OONI Explorer with network (ASN), blocking type and fingerprint.
        values: "{{ outputs.score.outputs[0].row.top_alerts }}"
        concurrencyLimit: 1
        tasks:
          - id: samples
            type: io.kestra.plugin.core.http.Request
            allowFailure: true
            timeout: PT1M
            uri: "{{ fromJson(item.value).samples_url }}"
            headers:
              User-Agent: "{{ vars.user_agent }}"
              Accept: application/json
        outputs:
          - id: text
            type: STRING
            value: |-
              {{ fromJson(item.value).line }}
              {% for m in fromJson(outputs.samples.body ?? '{"results":[]}').results ?? [] %}  - https://explorer.ooni.org/m/{{ m.measurement_uid }} {{ m.probe_asn }} {{ m.measurement_start_time | slice(0, 10) }}, {{ m.scores.analysis.blocking_type ?? 'blocking type not classified' }}{% if (m.scores.fingerprints ?? []) | length > 0 %}, fingerprint {{ m.scores.fingerprints[0].name }}{% endif %}
              {% endfor %}  Explorer search: {{ fromJson(item.value).search_url }}

  - id: route
    type: io.kestra.plugin.core.flow.Switch
    description: BLOCKING when at least one alert is a blockpage confirmation, ANOMALY when the alerts are anomaly signals only, QUIET otherwise.
    value: "{{ outputs.score.outputs[0].row.route }}"
    cases:
      BLOCKING:
        - id: log_blocking
          type: io.kestra.plugin.core.log.Log
          level: ERROR
          message: "{{ outputs.score.outputs[0].row.alerts }} censorship alert(s){{ outputs.score.outputs[0].row.is_baseline ? ' (BASELINE run)' : '' }}:\n{{ outputs.evidence.outputs | jq('[.[].outputs.text] | join(\"\\n\")') | first }}"
        - id: slack_blocking
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          allowFailure: true
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {{ {'text': ':no_entry: *OONI: blocking confirmed for a watched domain*' ~ (outputs.score.outputs[0].row.is_baseline ? ' (first run, current state)' : '') ~ (outputs.evidence.outputs | jq('[.[].outputs.text] | "\n" + join("\n")') | first) ~ outputs.score.outputs[0].row.slack_footer ~ (kestra.url ?? '') ~ '/ui/executions/' ~ flow.namespace ~ '/' ~ flow.id ~ '/' ~ execution.id} | toJson }}
      ANOMALY:
        - id: log_anomaly
          type: io.kestra.plugin.core.log.Log
          level: WARN
          message: "{{ outputs.score.outputs[0].row.alerts }} anomaly alert(s){{ outputs.score.outputs[0].row.is_baseline ? ' (BASELINE run)' : '' }}:\n{{ outputs.evidence.outputs | jq('[.[].outputs.text] | join(\"\\n\")') | first }}"
        - id: slack_anomaly
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          allowFailure: true
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {{ {'text': ':warning: *OONI: anomalies for a watched domain*' ~ (outputs.score.outputs[0].row.is_baseline ? ' (first run, current state)' : '') ~ (outputs.evidence.outputs | jq('[.[].outputs.text] | "\n" + join("\n")') | first) ~ outputs.score.outputs[0].row.slack_footer ~ (kestra.url ?? '') ~ '/ui/executions/' ~ flow.namespace ~ '/' ~ flow.id ~ '/' ~ execution.id} | toJson }}
    defaults:
      - id: nothing_new
        type: io.kestra.plugin.core.log.Log
        message: "No new or escalated interference: {{ outputs.score.outputs[0].row.new_blocking + outputs.score.outputs[0].row.ongoing_blocking }} blocking and {{ outputs.score.outputs[0].row.anomaly_spike + outputs.score.outputs[0].row.elevated }} anomalous pair(s), all already alerted or not alertable."

  - id: warn_data_gaps
    type: io.kestra.plugin.core.log.Log
    runIf: "{{ outputs.score.outputs[0].row.insufficient > 0 or outputs.score.outputs[0].row.fetch_failed_domains > 0 or outputs.plan.outputs[0].row.invalid_domains != '' or outputs.plan.outputs[0].row.invalid_countries != '' }}"
    level: WARN
    message: |
      INSUFFICIENT_DATA pairs: {{ outputs.score.outputs[0].row.insufficient }}, of measured hostnames: {{ outputs.score.outputs[0].row.insufficient_list is empty ? 'none' : outputs.score.outputs[0].row.insufficient_list }}
      Not measured by OONI at all: {{ outputs.score.outputs[0].row.not_measured_domains is empty ? 'none' : outputs.score.outputs[0].row.not_measured_domains }}
      Domains whose API request failed: {{ outputs.score.outputs[0].row.fetch_failed_domains }}
      Invalid inputs skipped: {{ outputs.plan.outputs[0].row.invalid_domains is empty ? 'no domains' : outputs.plan.outputs[0].row.invalid_domains }} / {{ outputs.plan.outputs[0].row.invalid_countries is empty ? 'no countries' : outputs.plan.outputs[0].row.invalid_countries }}

  - id: summary
    type: io.kestra.plugin.core.log.Log
    message: |
      {{ outputs.score.outputs[0].row.domains }} domain(s) x {{ outputs.plan.outputs[0].row.countries is empty ? 'all countries' : outputs.plan.outputs[0].row.countries }}, window {{ outputs.plan.outputs[0].row.window_start }} to {{ outputs.plan.outputs[0].row.until_day }} (exclusive) vs baseline from {{ outputs.plan.outputs[0].row.baseline_start }}{{ outputs.score.outputs[0].row.is_baseline ? ', BASELINE run' : '' }}.
      {{ outputs.score.outputs[0].row.pairs }} pairs: {{ outputs.score.outputs[0].row.new_blocking }} NEW_BLOCKING, {{ outputs.score.outputs[0].row.ongoing_blocking }} ONGOING_BLOCKING, {{ outputs.score.outputs[0].row.anomaly_spike }} ANOMALY_SPIKE, {{ outputs.score.outputs[0].row.elevated }} ELEVATED_ANOMALIES, {{ outputs.score.outputs[0].row.ok }} OK, {{ outputs.score.outputs[0].row.insufficient }} INSUFFICIENT_DATA.
      Alerts this run: {{ outputs.score.outputs[0].row.alerts }} (route {{ outputs.score.outputs[0].row.route }}). Recovered to OK: {{ outputs.score.outputs[0].row.recovered_list is empty ? 'none' : outputs.score.outputs[0].row.recovered_list }}.
      CSV: {{ outputs.score.outputFiles.pairs_csv }}

outputs:
  - id: summary
    type: JSON
    value: "{{ outputs.score.outputs[0].row }}"
  - id: pairs_csv
    type: FILE
    value: "{{ outputs.score.outputFiles.pairs_csv }}"

extend:
  title: Watch Your Domains for Censorship by Country with OONI Measurements
  metaTitle: OONI Censorship Measurement Watch for Your Domains with DuckDB and Slack | Kestra
  shortDescription: Pull OONI Web Connectivity aggregates per day and country for your domains, compare the last week with a two-week baseline in DuckDB, flag new blocking, anomaly spikes and thin data, alert once per escalation with links to OONI Explorer, and write a CSV.
  metaDescription: Daily OONI check of your domains per country, last week vs two-week baseline in DuckDB, new blocking and anomaly spikes routed to Slack once, CSV.
  description: |
    OONI (Open Observatory of Network Interference) runs volunteer probes in more than 150 countries that test websites against a control and publishes every result. This flow turns that open data into a daily watch for the hostnames your product, newsroom or NGO depends on.

    Read the results the way OONI intends. An *anomaly* means the probe's result differed from the control (DNS answer, TCP connection, HTTP response). Anomalies are signals, not proof (flaky networks and CDNs cause them too), hence the minimum sample and the baseline. *Confirmed* means a known blockpage or blocking-DNS fingerprint matched, which is strong evidence of deliberate blocking on at least one network.

    ## How it works

    1. A daily `Schedule` (07:00 UTC) starts the run. `plan` (DuckDB) normalises the inputs (strips scheme, path and port, dedupes, rejects malformed values) and computes the windows from the trigger date: the last `window_days` complete days, and the `baseline_days` before them.
    2. `fetch_aggregates` (`Loop`, one request at a time) calls `/api/v1/aggregation` once per domain with `test_name=web_connectivity`, `probe_cc`, `axis_x=measurement_start_day`, `axis_y=probe_cc` and `time_grain=day` (otherwise short ranges come back hourly). A domain that still fails after retries is FETCH_FAILED; if all fail, the run fails and the state is untouched.
    3. `previous_state` (KV) holds the highest severity already alerted per domain and country. The first run is the BASELINE and reports the current situation once.
    4. `score` (DuckDB) sums the disjoint counters (`ok + anomaly + confirmed + failure = measurement`) per window, drops probe failures from the denominator and classifies each pair: `NEW_BLOCKING` (confirmed now, none in the baseline), `ONGOING_BLOCKING`, `ANOMALY_SPIKE` (rate at least `min_anomaly_rate` and `spike_delta` above the baseline), `ELEVATED_ANOMALIES` (high but not rising, or no baseline), `OK`, `INSUFFICIENT_DATA` (fewer than `min_samples` usable measurements) or `FETCH_FAILED`. A pair alerts only when its severity rises above the one already alerted; a recovery to OK re-arms it, missing data does not count as a recovery.
    5. `save_state` (KV Set) stores the severities. `has_alerts` (`If`) runs `evidence` (`Loop`) over the ten most severe alerts: `/api/v1/measurements` with `confirmed=true` or `anomaly=true` and `limit=3` gives OONI Explorer links with the network (ASN), blocking type and fingerprint.
    6. `route` (`Switch`) sends BLOCKING alerts as an error log and a Slack message, ANOMALY alerts as a warning with a "signal, not proof" note, and logs a quiet line otherwise. Slack uses `allowFailure`.
    7. `warn_data_gaps` lists thin samples, hostnames OONI does not test and invalid inputs; `summary` logs the counts. Outputs: summary row and per-pair CSV.

    ## What you get

    - A CSV with one row per domain and country: status, note, measurements, anomalies, confirmed blockpages, days with a blockpage, anomaly rate now and in the baseline, alert and recovery flags.
    - One alert per escalation, with sample measurements and a pre-filled OONI Explorer search.
    - INSUFFICIENT_DATA for thin samples and a hint when OONI never measured a hostname (exact match: `bbc.com` is not `www.bbc.com`).

    ## Who it's for

    - SaaS, platform and SRE teams who need to know when a market cannot reach their app or API.
    - Newsrooms, NGOs and human-rights organisations monitoring access to their sites.

    ## Why orchestrate this with Kestra

    - `Download` plus DuckDB `inputFiles` turns API responses into tables; the classification is readable SQL.
    - Task retries and `concurrencyLimit: 1` respect OONI's quota, and one failed domain does not break the run.
    - The KV store makes "alert once per escalation" work without a database; backfills reuse the trigger date.

    ## Prerequisites

    - Kestra 2.0 with the JDBC DuckDB and Slack plugins.
    - Outbound HTTPS to `api.ooni.io`. No key is needed, but the API meters query time per IP and answers 429 "quota exceeded" when it is spent (shared or carrier-NAT IPs hit it sooner): keep the lists focused and the schedule daily.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack incoming webhook (optional; without it the Slack task warns and alerts stay in the logs and CSV).

    ## Quick start

    1. Import the flow and click **Execute**. The defaults watch four hostnames in eight countries; the BASELINE run reports `signal.org` and `www.bbc.com` blocked in Iran and `www.bbc.com` in Russia, elevated anomalies such as `signal.org` in Myanmar, `zoom.us` as OK and `www.notion.so` as not measured.
    2. Execute again: no new alerts.
    3. Delete the KV key `ooni_censorship_watch_state` and run with `alert_on_persistent: false`: only changes against the baseline alert.
    4. Put in your hostnames and markets, add `SLACK_WEBHOOK_URL` and enable the schedule.

    ## How to extend

    - Re-query a flagged country with `axis_y=probe_asn` to see whether blocking is nationwide or on a few ISPs.
    - Submit untested hostnames to the Citizen Lab test lists.

    ## Links

    - [HTTP Download](https://kestra.io/plugins/core/http/io.kestra.plugin.core.http.download) and [HTTP Request](https://kestra.io/plugins/core/http/io.kestra.plugin.core.http.request)
    - [DuckDB Queries](https://kestra.io/plugins/plugin-jdbc-duckdb/io.kestra.plugin.jdbc.duckdb.queries)
    - [Loop](https://kestra.io/plugins/core/flow/io.kestra.plugin.core.flow.loop), [If](https://kestra.io/plugins/core/flow/io.kestra.plugin.core.flow.if) and [Switch](https://kestra.io/plugins/core/flow/io.kestra.plugin.core.flow.switch)
    - [KV Store](https://kestra.io/docs/concepts/kv-store) and [Slack Incoming Webhook](https://kestra.io/plugins/plugin-notifications/slack/io.kestra.plugin.slack.notifications.slackincomingwebhook)
    - [OONI API](https://api.ooni.io/), [OONI data docs](https://docs.ooni.org/data/) and [OONI Explorer](https://explorer.ooni.org/)
    - [Web Connectivity test](https://ooni.org/nettest/web-connectivity/) and [Citizen Lab test lists](https://github.com/citizenlab/test-lists)
  tags:
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - Incident Response
  ee: false
