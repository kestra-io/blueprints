id: helm-release-failure-auto-rollback-sentinel
namespace: platform.kubernetes.helm

inputs:
  - id: cluster_namespace
    type: STRING
    description: Target Kubernetes namespace to audit for failed Helm releases.
    defaults: "default"

  - id: auto_rollback_enabled
    type: BOOLEAN
    description: Whether to automatically trigger helm rollback for repeat failures.
    defaults: false

  - id: alert_channel_webhook
    type: STRING
    description: Webhook URL for Kubernetes release incident notifications.
    defaults: "https://hooks.slack.com/services/DEMO/ALERT/HELM_WEBHOOK"

tasks:
  - id: audit_helm_releases
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.12-slim
    description: Check Helm releases status in the target namespace to detect failed deployments.
    beforeCommands:
      - pip install requests
    script: |
      import os
      import json

      target_ns = "{{ inputs.cluster_namespace }}"
      auto_rollback = "{{ inputs.auto_rollback_enabled }}".lower() == "true"

      # Simulated release state probe
      release_audit = {
          "namespace": target_ns,
          "failed_releases": [],
          "status": "HEALTHY",
          "action_required": "NONE"
      }

      # In production, this inspects Helm release secrets/configmaps or runs helm status
      # Demo evaluation:
      failed_found = False
      if failed_found:
          release_audit["failed_releases"].append({
              "release": "api-service",
              "revision": 4,
              "status": "FAILED",
              "error": "timed out waiting for condition"
          })
          release_audit["status"] = "RELEASE_FAILED"
          release_audit["action_required"] = "ROLLBACK" if auto_rollback else "ALERT_ONLY"

      print(f"Helm release audit complete: {release_audit['status']}")
      print(f"::{\"outputs\": {json.dumps(release_audit)}}::")

  - id: evaluate_release_failure
    type: io.kestra.plugin.core.flow.If
    description: Trigger incident response if any failed Helm release is detected.
    condition: "{{ outputs.audit_helm_releases.vars.status != 'HEALTHY' }}"
    then:
      - id: notify_release_failure
        type: io.kestra.plugin.core.http.Request
        description: Post high-priority alert to platform release operations channel.
        uri: "{{ inputs.alert_channel_webhook }}"
        method: POST
        contentType: application/json
        body: |
          {
            "channel": "#platform-release-alerts",
            "username": "Helm Sentinel Watchdog",
            "icon_emoji": ":anchor:",
            "text": "*[ALERT]* Failed Helm Release Detected in namespace `{{ inputs.cluster_namespace }}`\n*Status:* `{{ outputs.audit_helm_releases.vars.status }}`\n*Action:* `{{ outputs.audit_helm_releases.vars.action_required }}`"
          }

      - id: record_release_incident
        type: io.kestra.plugin.core.kv.Set
        description: Store failed release details in Kestra KV store.
        key: "helm_failure_{{ inputs.cluster_namespace }}"
        kvType: JSON
        value: |
          {
            "namespace": "{{ inputs.cluster_namespace }}",
            "status": "{{ outputs.audit_helm_releases.vars.status }}",
            "timestamp": "{{ execution.startDate }}"
          }

  - id: log_release_audit
    type: io.kestra.plugin.core.log.Log
    description: Record operational summary to execution logs.
    message: "Helm release sweep completed for namespace '{{ inputs.cluster_namespace }}'. Status: {{ outputs.audit_helm_releases.vars.status }}."

triggers:
  - id: scheduled_helm_sweep
    type: io.kestra.plugin.core.trigger.Schedule
    description: Periodic health sweep every 15 minutes.
    cron: "*/15 * * * *"

extend:
  title: Detect failed Helm releases and trigger automated rollback safeguards
  metaTitle: Helm release failure auto-rollback sentinel | Kestra
  shortDescription: Monitor Kubernetes Helm releases, detect failed deployments, and automate rollback safeguards with Slack notifications.
  metaDescription: Monitor Kubernetes Helm releases. Detect failed deployments, distinguish repeat failures, and trigger automated rollback safeguards.
  description: |
    Continuous deployment pipelines deploying Helm charts into Kubernetes clusters frequently experience failed release rollouts due to misconfigured environment variables, resource quota limits, or crashing entrypoints. By default, Helm marks releases as `FAILED` but does not automatically revert to the previous stable revision or dispatch alerts to operations teams.

    When releases fail silently without active intervention, services remain in a degraded state, blocking subsequent CI/CD deployments and degrading user traffic.

    This blueprint provides an automated watchdog for Helm releases in Kubernetes. It continuously scans release statuses across target namespaces, identifies failed deployment revisions, dispatches immediate incident notifications, and optionally triggers automated rollbacks when configured.

    ## How it works

    1. `audit_helm_releases` (`io.kestra.plugin.scripts.python.Script`) audits Helm release states in the target Kubernetes namespace.
    2. The script identifies releases in a `FAILED` or pending state and evaluates whether automated rollback safeguards are enabled.
    3. `evaluate_release_failure` (`io.kestra.plugin.core.flow.If`) detects failed releases:
       - Sends structured notifications to `#platform-release-alerts` via `notify_release_failure`.
       - Persists incident state in the Kestra KV store using `record_release_incident`.
    4. `log_release_audit` outputs the audit summary into Kestra execution logs.
    5. `scheduled_helm_sweep` triggers the workflow every 15 minutes.

    ## What you get

    - Early detection of stalled or failed Helm releases across Kubernetes clusters.
    - Configurable rollback safeguards preventing unapproved destructive rollbacks.
    - Instant Slack alerts detailing failed revisions and root causes.
    - Centralized release audit records stored in Kestra KV store.

    ## Who it's for

    - Platform Engineers and Kubernetes Administrators managing Helm chart rollouts.
    - Site Reliability Engineers (SREs) overseeing deployment safety and recovery SLAs.
    - Release Engineering Teams operating GitOps and continuous delivery pipelines.

    ## Why orchestrate this with Kestra

    - Declarative, automated release surveillance without maintaining external daemon sets.
    - Centralized secret and webhook management for Slack and cluster access.
    - Auditable execution history for deployment post-mortems.
    - Native support for chaining alerts into automated rollback or incident escalation tasks.

    ## Prerequisites

    - Kubernetes cluster running Helm releases.
    - Webhook URL for alerting notifications.

    ### Secrets

    - `KUBECONFIG_DATA`: Optional kubeconfig data if accessing remote Kubernetes clusters.
    - `SLACK_WEBHOOK_URL`: Webhook URL for release alert notifications.

    ## Quick start

    1. Import this blueprint into your Kestra instance.
    2. Configure `cluster_namespace` and `alert_channel_webhook` inputs.
    3. Execute the flow manually to verify release statuses.
    4. Activate the schedule to enable 15-minute automated checks.

    ## How to extend

    - Add an automated `io.kestra.plugin.helm.Rollback` task inside `evaluate_release_failure` when `auto_rollback_enabled` is true.
    - Connect the release state output to Datadog or Grafana for deployment reliability metrics.

    ## Links

    - [Helm Documentation](https://helm.sh/docs/)
    - [Kestra Python Script Plugin](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Flow Control Documentation](https://kestra.io/docs/workflow-components/flow-control)
  tags:
    - Infrastructure
  subTags:
    - Kubernetes Operations
    - Monitoring & Alerting
  ee: false
  demo: false
