id: terraform-infracost-budget-gate
namespace: company.team
description: |
  Estimate the monthly cloud cost of a Terraform change before it is
  applied: clone the IaC repository, run Infracost against the HCL, and
  gate CI on a budget input — over budget means a Slack alert and a
  failed run, while the pull request is still open.

triggers:
  - id: on_iac_push
    type: io.kestra.plugin.core.trigger.Webhook
    description: CI posts here on every push or pull request against the IaC repository to re-run the cost gate.
    key: "{{ secret('COST_GATE_WEBHOOK_KEY') }}"

inputs:
  - id: repository_url
    type: STRING
    defaults: https://github.com/your-org/your-iac-repo.git
    description: Git URL of the infrastructure repository to estimate. Public repositories clone without credentials.
  - id: branch
    type: STRING
    defaults: main
    description: Branch to check out and estimate.
  - id: iac_path
    type: STRING
    defaults: "."
    description: Path to the Terraform root module inside the repository, monorepo-friendly (e.g. environments/prod).
  - id: budget_usd
    type: FLOAT
    defaults: 500.0
    description: Estimated monthly cost ceiling in USD — estimates above this input alert Slack and fail the run.

tasks:
  - id: workspace
    type: io.kestra.plugin.core.flow.WorkingDirectory
    description: One shared directory so the scanner container and the report parser both work against the same checkout.
    tasks:
      - id: clone_repository
        type: io.kestra.plugin.git.Clone
        description: Check out the IaC repository at the configured branch. For private repositories, add username and password (a token) to this task as shown in How to extend.
        url: "{{ inputs.repository_url }}"
        branch: "{{ inputs.branch }}"

      - id: run_cost_estimate
        type: io.kestra.plugin.scripts.shell.Commands
        description: Run Infracost in its official container against the HCL — it parses the plan definition directly, so no terraform init, no cloud credentials, and no apply are involved.
        taskRunner:
          type: io.kestra.plugin.scripts.runner.docker.Docker
        containerImage: infracost/infracost:latest
        env:
          INFRACOST_API_KEY: "{{ secret('INFRACOST_API_KEY') }}"
        commands:
          - infracost breakdown --path {{ inputs.iac_path }} --format json > infracost-report.json

      - id: parse_estimate
        type: io.kestra.plugin.scripts.python.Script
        description: Extract the total monthly estimate from the Infracost report (tolerant to schema nesting), compare it with the budget input, and fail loudly if the report cannot be read — a broken gate must never look like a cheap change.
        taskRunner:
          type: io.kestra.plugin.core.runner.Process
        env:
          BUDGET_USD: "{{ inputs.budget_usd }}"
        script: |
          import json
          import os

          path = "infracost-report.json"
          raw = {}
          if os.path.exists(path) and os.path.getsize(path) > 0:
              with open(path) as f:
                  raw = json.load(f)

          candidates = []
          if isinstance(raw.get("breakdown"), dict):
              candidates.append(raw["breakdown"].get("totalMonthlyCost"))
          if "totalMonthlyCost" in raw:
              candidates.append(raw.get("totalMonthlyCost"))
          if isinstance(raw.get("projects"), list):
              total, seen = 0.0, False
              for project in raw["projects"]:
                  value = project.get("breakdown", {}).get("totalMonthlyCost")
                  if value not in (None, "unknown"):
                      try:
                          total += float(value)
                          seen = True
                      except (TypeError, ValueError):
                          pass
              if seen:
                  candidates.append(total)

          monthly = None
          for value in candidates:
              try:
                  if value not in (None, "unknown"):
                      monthly = round(float(value), 2)
                      break
              except (TypeError, ValueError):
                  continue

          if monthly is None:
              raise SystemExit("could not read totalMonthlyCost from infracost-report.json — the cost gate cannot verify a budget against an unreadable estimate")

          budget = float(os.environ["BUDGET_USD"])
          pct_of_budget = round(monthly / budget * 100, 1) if budget > 0 else 0.0
          over_budget = monthly > budget

          print(f"Estimated ${monthly}/month vs ${budget} budget ({pct_of_budget}% used)")
          print("::" + json.dumps({"outputs": {
              "monthly_cost": monthly,
              "budget_usd": budget,
              "pct_of_budget": pct_of_budget,
              "over_budget": over_budget,
          }}) + "::")

  - id: check_budget
    type: io.kestra.plugin.core.flow.If
    description: The budget branch — over the ceiling alerts and fails while the pull request is still open, under it records a quiet pass.
    condition: "{{ outputs.parse_estimate.vars.over_budget }}"
    then:
      - id: alert_over_budget
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Post the estimate, the budget, and the percentage so the team sees exactly how far over the change lands.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "Terraform cost gate: estimated ${{ outputs.parse_estimate.vars.monthly_cost }}/month for {{ inputs.repository_url }}@{{ inputs.branch }} ({{ inputs.iac_path }}) — {{ outputs.parse_estimate.vars.pct_of_budget }}% of the ${{ inputs.budget_usd }} budget. Execution {{ execution.id }}."
          }
      - id: fail_the_build
        type: io.kestra.plugin.core.execution.Fail
        description: Fail the execution so the CI check on the pull request turns red instead of merging an over-budget change quietly.
        errorMessage: "Estimated monthly cost ${{ outputs.parse_estimate.vars.monthly_cost }} exceeds the ${{ inputs.budget_usd }} budget."
    else:
      - id: log_within_budget
        type: io.kestra.plugin.core.log.Log
        description: Record passing estimates so the execution history becomes a cost trend for the repository.
        message: "Terraform cost gate passed: ${{ outputs.parse_estimate.vars.monthly_cost }}/month is within the ${{ inputs.budget_usd }} budget ({{ outputs.parse_estimate.vars.pct_of_budget }}% used)."

errors:
  - id: alert_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Alert when the gate itself failed — clone error, Infracost error, unreadable report — because a broken cost gate is not a passing one.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": "Terraform cost gate ERRORED in flow {{ flow.id }} (execution {{ execution.id }}) — the change was NOT cost-checked. Verify the INFRACOST_API_KEY secret, the repository_url, and the iac_path input."
      }

outputs:
  - id: budget_check
    type: JSON
    description: 'Gate verdict, e.g. {"monthly_cost": 812.44, "budget_usd": 500.0, "pct_of_budget": 162.5, "over_budget": true}.'
    value: "{{ outputs.parse_estimate.vars | toJson }}"

extend:
  title: Terraform Cost Budget Gate with Infracost
  shortDescription: On every IaC push, estimate the Terraform change's monthly cloud cost with Infracost and gate CI on a budget — over means Slack alert plus failed run.
  metaTitle: Terraform Cost Estimation and Budget Gates with Kestra
  metaDescription: "Gate Terraform PRs on cloud cost — run Infracost for a monthly estimate, compare against your budget, and alert Slack and fail the build when over."
  description: |
    Cloud cost surprises are cheapest when they are still a pull request. This blueprint turns the monthly cost of a Terraform change into a CI signal: clone the IaC repository, run Infracost against the HCL — no `terraform init`, no cloud credentials, no apply — and compare the estimated monthly total with a budget input. Over the ceiling, Slack gets the estimate, the budget, and the percentage, and the execution fails so the CI check on the open pull request turns red. Under it, a quiet log keeps a cost trend in the execution history. It closes the gap between "the plan looks fine" and "the plan looks fine, and costs what we agreed".

    ## How it works

    1. The `on_iac_push` trigger (`io.kestra.plugin.core.trigger.Webhook`) exposes a keyed URL for your CI to POST to on push or pull-request events.
    2. `workspace` (`io.kestra.plugin.core.flow.WorkingDirectory`) opens one shared filesystem for the checkout, the estimate, and the report parser.
    3. `clone_repository` (`io.kestra.plugin.git.Clone`) checks out `repository_url` at `branch`; public repositories need no credentials, private ones take a username and token on the task.
    4. `run_cost_estimate` (`io.kestra.plugin.scripts.shell.Commands` on the `io.kestra.plugin.scripts.runner.docker.Docker` runner, image `infracost/infracost:latest`) runs `infracost breakdown --path <iac_path> --format json` into `infracost-report.json`, authenticated with the `INFRACOST_API_KEY` secret. Infracost parses the HCL directly, so the estimate never touches a cloud account.
    5. `parse_estimate` (`io.kestra.plugin.scripts.python.Script` on the Process runner) extracts the total monthly cost tolerantly (wrapped `breakdown`, top-level, or summed `projects`), computes `pct_of_budget`, and **raises** if the report is unreadable — a broken gate must never look like a cheap change.
    6. `check_budget` (`io.kestra.plugin.core.flow.If`) branches on `over_budget`. Over: `alert_over_budget` posts the numbers to Slack and `fail_the_build` (`io.kestra.plugin.core.execution.Fail`) turns the CI check red. Under: `log_within_budget` records the pass.
    7. The `errors` block alerts Slack when the gate itself fails, naming the three things that usually break: API key, repository URL, path input.

    ## What you get

    - Cost reviewed at PR time, when the change is still cheap to fix — not at invoice time.
    - A budget that lives in an input, adjustable per repository or environment without editing the flow.
    - No cloud credentials required for the estimate: Infracost reads HCL, not accounts.
    - A `budget_check` JSON output (estimate, budget, percentage, verdict) for dashboards and trend reporting.
    - A red CI check on over-budget pull requests, not just a message in a channel.

    ## Who it's for

    - Platform and infrastructure teams enforcing cloud budgets on infrastructure-as-code.
    - FinOps engineers who want cost review inside the pull-request workflow.
    - Engineering leads who have approved a "harmless" Terraform change that quietly doubled a bill.

    ## Why orchestrate this with Kestra

    Infracost estimates cost but does not watch repositories, remember budgets, or fail builds. Kestra provides the loop around it: a webhook trigger from CI, a hermetic container for the tool, a branch that separates the gate verdict from the evidence, alert routing to Slack, and an execution history that doubles as a cost trend. The same logic in a CI script is a YAML blob nobody reviews, with no alerting when the script itself breaks.

    ## Prerequisites

    - A free Infracost API key from [app.infracost.io](https://app.infracost.io) — the estimate runs on Infracost's cloud registry of prices.
    - A worker with Docker access (the estimate runs in the Infracost container) and Python 3 on the host for the parser, or switch `parse_estimate` to a Docker task runner.
    - A Slack incoming webhook for over-budget and failure alerts.
    - A CI system that can POST to the Kestra webhook and honor the execution's exit state as a check.

    ### Secrets

    - `INFRACOST_API_KEY`: Infracost API key used by the estimate container.
    - `COST_GATE_WEBHOOK_KEY`: key segment guarding the webhook URL — treat it as a secret.
    - `SLACK_WEBHOOK_URL`: Slack incoming webhook URL.

    ## Quick start

    1. Add the three secrets to your Kestra namespace.
    2. Set `repository_url`, `branch`, and — for monorepos — `iac_path` to the Terraform root module you want estimated.
    3. Run the flow once manually and read `budget_check` from the outputs to see your estimate, then set `budget_usd` to the real ceiling.
    4. Point your CI (GitHub Actions `on: pull_request`, GitLab pipeline, etc.) at `/api/v1/{tenant}/executions/webhook/{namespace}/terraform-infracost-budget-gate/{COST_GATE_WEBHOOK_KEY}` and treat a failed execution as a failed check.
    5. To test the gate end to end, point `iac_path` at a root module you know is over budget and confirm the Slack alert and the failed execution.

    ## How to extend

    - **Private repositories:** add `username` and `password: "{{ secret('GIT_TOKEN') }}"` to `clone_repository`.
    - **Advisory mode:** delete `fail_the_build` (or move it behind another `If` on a `hard_gate` input) to alert without failing.
    - **PR diff costs:** compare against the default branch with `infracost diff --path . --compare-to <base>` and gate on the *delta* instead of the absolute total.
    - **Multiple environments:** fan out with `Parallel` or `Loop` over a list of `iac_path` values and aggregate the totals.
    - **Scheduled trend:** add a `Schedule` trigger alongside the webhook to estimate nightly regardless of pushes.

    ## Links

    - [Infracost documentation](https://www.infracost.io/docs/)
    - [Infracost Docker image](https://hub.docker.com/r/infracost/infracost)
    - [Git plugin documentation](https://kestra.io/plugins/plugin-git)
    - [Slack plugin documentation](https://kestra.io/plugins/plugin-slack)
    - This blueprint has been created by [RudraMalvankar](https://github.com/RudraMalvankar)
  tags:
    - Infrastructure
    - Cloud
  subTags:
    - CI/CD & Deployment
    - Monitoring & Alerting
  ee: false
  demo: false
