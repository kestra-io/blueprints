id: duckdb-parquet-coordinate-inversion-and-geofence-gate
namespace: company.lakehouse

description: |
  Audits a Parquet telemetry file that carries latitude and longitude columns for missing coordinates,
  coordinate inversion (latitude/longitude transposition), Null Island (0.0, 0.0) sensor defaults and
  geofence breaches using embedded DuckDB. Splits clean rows from an enriched quarantine Parquet file
  and fails the execution when the anomaly rate shows systemic producer drift.

inputs:
  - id: telemetry_parquet_uri
    type: URI
    displayName: Telemetry Parquet URI
    description: Kestra internal storage URI (kestra://...) or namespace file URI of the Parquet file to audit. It must contain numeric latitude and longitude columns (WGS84).
    required: true

  - id: min_latitude
    type: FLOAT
    displayName: Minimum Bounding Box Latitude
    description: Southern latitude boundary of the operational service area (WGS84).
    defaults: 51.28

  - id: max_latitude
    type: FLOAT
    displayName: Maximum Bounding Box Latitude
    description: Northern latitude boundary of the operational service area (WGS84).
    defaults: 51.70

  - id: min_longitude
    type: FLOAT
    displayName: Minimum Bounding Box Longitude
    description: Western longitude boundary of the operational service area (WGS84).
    defaults: -0.55

  - id: max_longitude
    type: FLOAT
    displayName: Maximum Bounding Box Longitude
    description: Eastern longitude boundary of the operational service area (WGS84).
    defaults: 0.30

  - id: max_inversion_rate
    type: FLOAT
    displayName: Maximum Inversion Rate
    description: Maximum fraction of inverted coordinates before the circuit breaker trips (0.01 = 1%).
    defaults: 0.01

  - id: max_quarantine_rate
    type: FLOAT
    displayName: Maximum Quarantine Rate
    description: Maximum fraction of all anomalies (missing, inverted, Null Island and out-of-bounds) before the circuit breaker trips (0.05 = 5%).
    defaults: 0.05

tasks:
  - id: audit_and_profile_spatial_integrity
    type: io.kestra.plugin.jdbc.duckdb.Query
    description: Classifies every row, counts each anomaly type and computes the anomaly rates and the gate verdict.
    inputFiles:
      raw_telemetry.parquet: "{{ inputs.telemetry_parquet_uri }}"
    fetchType: FETCH_ONE
    sql: |
      WITH categorized AS (
        SELECT
          CASE
            WHEN latitude IS NULL OR longitude IS NULL
              OR NOT isfinite(latitude::DOUBLE) OR NOT isfinite(longitude::DOUBLE) THEN 'MISSING_OR_NONFINITE_COORDINATE'
            WHEN abs(latitude) > 90.0
              OR (longitude BETWEEN {{ inputs.min_latitude }} AND {{ inputs.max_latitude }}
                  AND latitude BETWEEN {{ inputs.min_longitude }} AND {{ inputs.max_longitude }}
                  AND NOT (latitude BETWEEN {{ inputs.min_latitude }} AND {{ inputs.max_latitude }}
                           AND longitude BETWEEN {{ inputs.min_longitude }} AND {{ inputs.max_longitude }})) THEN 'COORDINATE_INVERSION'
            WHEN abs(latitude) < 0.0001 AND abs(longitude) < 0.0001 THEN 'NULL_ISLAND'
            WHEN abs(longitude) > 180.0
              OR latitude < {{ inputs.min_latitude }} OR latitude > {{ inputs.max_latitude }}
              OR longitude < {{ inputs.min_longitude }} OR longitude > {{ inputs.max_longitude }} THEN 'OUT_OF_BOUNDS_COORDINATE'
            ELSE 'CLEAN'
          END AS spatial_status
        FROM read_parquet('{{ workingDir }}/raw_telemetry.parquet')
      ),
      metrics AS (
        SELECT
          COUNT(*) AS total_records,
          COUNT(*) FILTER (WHERE spatial_status = 'CLEAN') AS clean_records,
          COUNT(*) FILTER (WHERE spatial_status = 'MISSING_OR_NONFINITE_COORDINATE') AS missing_records,
          COUNT(*) FILTER (WHERE spatial_status = 'COORDINATE_INVERSION') AS inverted_records,
          COUNT(*) FILTER (WHERE spatial_status = 'NULL_ISLAND') AS null_island_records,
          COUNT(*) FILTER (WHERE spatial_status = 'OUT_OF_BOUNDS_COORDINATE') AS out_of_bounds_records
        FROM categorized
      )
      SELECT
        total_records,
        clean_records,
        missing_records,
        inverted_records,
        null_island_records,
        out_of_bounds_records,
        (total_records - clean_records) AS total_anomalies,
        ROUND((total_records - clean_records)::DOUBLE / GREATEST(total_records, 1), 4) AS anomaly_rate,
        ROUND(inverted_records::DOUBLE / GREATEST(total_records, 1), 4) AS inversion_rate,
        CASE
          WHEN total_records = 0 THEN 'EMPTY_BATCH'
          WHEN (total_records - clean_records) = 0 THEN 'SPATIAL_VALID'
          WHEN (inverted_records::DOUBLE / total_records) > {{ inputs.max_inversion_rate }}
            OR ((total_records - clean_records)::DOUBLE / total_records) > {{ inputs.max_quarantine_rate }}
            THEN 'CRITICAL_INVERSION_DRIFT'
          ELSE 'ANOMALOUS_QUARANTINE_QUALIFIED'
        END AS gate_verdict
      FROM metrics;

  - id: route_by_spatial_verdict
    type: io.kestra.plugin.core.flow.Switch
    description: Dispatches downstream actions based on the classified anomaly rate and inversion severity.
    value: "{{ outputs.audit_and_profile_spatial_integrity.row.gate_verdict }}"
    cases:
      SPATIAL_VALID:
        - id: curate_clean_dataset
          type: io.kestra.plugin.jdbc.duckdb.Queries
          description: Writes the fully compliant dataset to the curated output file.
          inputFiles:
            raw_telemetry.parquet: "{{ inputs.telemetry_parquet_uri }}"
          outputFiles:
            - curated_spatial_telemetry.parquet
          sql: |
            COPY (
              SELECT * FROM read_parquet('{{ workingDir }}/raw_telemetry.parquet')
            ) TO '{{ workingDir }}/curated_spatial_telemetry.parquet' (FORMAT PARQUET);

        - id: log_clean_promotion
          type: io.kestra.plugin.core.log.Log
          message: "Spatial gate passed: {{ outputs.audit_and_profile_spatial_integrity.row.clean_records }} of {{ outputs.audit_and_profile_spatial_integrity.row.total_records }} records are compliant. Written to curated_spatial_telemetry.parquet."

      ANOMALOUS_QUARANTINE_QUALIFIED:
        - id: partition_and_quarantine_records
          type: io.kestra.plugin.jdbc.duckdb.Queries
          description: Writes clean rows to the curated file and anomalous rows, with the reason and severity, to the quarantine file.
          inputFiles:
            raw_telemetry.parquet: "{{ inputs.telemetry_parquet_uri }}"
          outputFiles:
            - curated_spatial_telemetry.parquet
            - quarantined_spatial_telemetry.parquet
          sql: |
            CREATE OR REPLACE TEMP TABLE categorized_telemetry AS
            SELECT
              *,
              CASE
                WHEN latitude IS NULL OR longitude IS NULL
                  OR NOT isfinite(latitude::DOUBLE) OR NOT isfinite(longitude::DOUBLE) THEN 'MISSING_OR_NONFINITE_COORDINATE'
                WHEN abs(latitude) > 90.0
                  OR (longitude BETWEEN {{ inputs.min_latitude }} AND {{ inputs.max_latitude }}
                      AND latitude BETWEEN {{ inputs.min_longitude }} AND {{ inputs.max_longitude }}
                      AND NOT (latitude BETWEEN {{ inputs.min_latitude }} AND {{ inputs.max_latitude }}
                               AND longitude BETWEEN {{ inputs.min_longitude }} AND {{ inputs.max_longitude }})) THEN 'COORDINATE_INVERSION'
                WHEN abs(latitude) < 0.0001 AND abs(longitude) < 0.0001 THEN 'NULL_ISLAND'
                WHEN abs(longitude) > 180.0
                  OR latitude < {{ inputs.min_latitude }} OR latitude > {{ inputs.max_latitude }}
                  OR longitude < {{ inputs.min_longitude }} OR longitude > {{ inputs.max_longitude }} THEN 'OUT_OF_BOUNDS_COORDINATE'
                ELSE 'CLEAN'
              END AS spatial_status
            FROM read_parquet('{{ workingDir }}/raw_telemetry.parquet');

            COPY (
              SELECT * EXCLUDE (spatial_status)
              FROM categorized_telemetry
              WHERE spatial_status = 'CLEAN'
            ) TO '{{ workingDir }}/curated_spatial_telemetry.parquet' (FORMAT PARQUET);

            COPY (
              SELECT
                * EXCLUDE (spatial_status),
                spatial_status AS anomaly_reason,
                CASE
                  WHEN spatial_status IN ('COORDINATE_INVERSION', 'MISSING_OR_NONFINITE_COORDINATE') THEN 'CRITICAL'
                  ELSE 'WARNING'
                END AS anomaly_severity,
                CURRENT_TIMESTAMP AS quarantine_timestamp
              FROM categorized_telemetry
              WHERE spatial_status != 'CLEAN'
            ) TO '{{ workingDir }}/quarantined_spatial_telemetry.parquet' (FORMAT PARQUET);

        - id: log_quarantine_remediation
          type: io.kestra.plugin.core.log.Log
          message: |
            Spatial quarantine applied:
            - Clean records written to curated_spatial_telemetry.parquet: {{ outputs.audit_and_profile_spatial_integrity.row.clean_records }}
            - Records written to quarantined_spatial_telemetry.parquet: {{ outputs.audit_and_profile_spatial_integrity.row.total_anomalies }}
            - Missing or non-finite coordinates: {{ outputs.audit_and_profile_spatial_integrity.row.missing_records }}
            - Inverted coordinates: {{ outputs.audit_and_profile_spatial_integrity.row.inverted_records }}
            - Null Island records: {{ outputs.audit_and_profile_spatial_integrity.row.null_island_records }}
            - Out-of-bounds records: {{ outputs.audit_and_profile_spatial_integrity.row.out_of_bounds_records }}
            - Observed anomaly rate: {{ outputs.audit_and_profile_spatial_integrity.row.anomaly_rate }} (limit: {{ inputs.max_quarantine_rate }})

      CRITICAL_INVERSION_DRIFT:
        - id: isolate_emergency_dataset
          type: io.kestra.plugin.jdbc.duckdb.Queries
          description: Copies the entire raw batch to an emergency file for forensic inspection.
          inputFiles:
            raw_telemetry.parquet: "{{ inputs.telemetry_parquet_uri }}"
          outputFiles:
            - emergency_quarantine_telemetry.parquet
          sql: |
            COPY (
              SELECT
                *,
                'CRITICAL_CIRCUIT_BREAKER_TRIPPED' AS isolation_reason,
                CURRENT_TIMESTAMP AS isolation_timestamp
              FROM read_parquet('{{ workingDir }}/raw_telemetry.parquet')
            ) TO '{{ workingDir }}/emergency_quarantine_telemetry.parquet' (FORMAT PARQUET);

        - id: trip_circuit_breaker
          type: io.kestra.plugin.core.execution.Fail
          description: Fails the execution so that downstream promotion of this batch is blocked.
          errorMessage: "Critical spatial integrity breach: inversion rate {{ outputs.audit_and_profile_spatial_integrity.row.inversion_rate }} (limit {{ inputs.max_inversion_rate }}) or total anomaly rate {{ outputs.audit_and_profile_spatial_integrity.row.anomaly_rate }} (limit {{ inputs.max_quarantine_rate }}). The full batch was copied to emergency_quarantine_telemetry.parquet."

      EMPTY_BATCH:
        - id: fail_empty_batch
          type: io.kestra.plugin.core.execution.Fail
          description: An empty file cannot be called valid, so the gate fails instead of passing it.
          errorMessage: "The Parquet file {{ inputs.telemetry_parquet_uri }} contains no rows, so there is nothing to validate."

    defaults:
      - id: log_unexpected_verdict
        type: io.kestra.plugin.core.log.Log
        message: "Unexpected spatial gate verdict: {{ outputs.audit_and_profile_spatial_integrity.row.gate_verdict }}"

extend:
  title: DuckDB Parquet Coordinate Inversion and Geofence Integrity Gate
  metaTitle: DuckDB Parquet Coordinate Inversion and Geofence Gate | Kestra Blueprint
  shortDescription: Audit a Parquet file with latitude and longitude columns using DuckDB for missing, inverted and Null Island coordinates and geofence breaches, then split clean rows from a quarantine file.
  metaDescription: Audit Parquet telemetry with DuckDB for missing, inverted and Null Island coordinates and geofence breaches, splitting clean rows from a quarantine file.
  description: |
    Audits a Parquet dataset that carries `latitude` and `longitude` columns for coordinate defects before it reaches GIS platforms and analytical warehouses. Coordinate inversions (`abs(latitude) > 90`, or latitude and longitude swapped) crash spatial indexers such as PostGIS, H3 and S2. Uninitialized sensor defaults pile up as artificial "Null Island" `(0.0, 0.0)` points, and rows with missing coordinates or points far outside the service area distort maps and routing models.

    The flow reads the file you point it at with embedded DuckDB, classifies every row, compares the anomaly rates with your thresholds and acts on the result. A fully clean file is written to a curated output file. A file with contained noise is split into a curated file and a quarantine file that carries the reason and severity of each rejected row. When the inversion rate or the overall anomaly rate exceeds your limits, the whole batch is copied to an emergency file and the execution fails. The file itself is not changed, and the outputs are Kestra execution output files, so chain an upload task if you want them in a bucket.

    The input is a plain Parquet file with numeric `latitude` and `longitude` columns (WGS84). It is not a geometry check: a GeoParquet file that only has a WKB `geometry` column needs those two columns added first.

    ## How it works

    1. `audit_and_profile_spatial_integrity` (`io.kestra.plugin.jdbc.duckdb.Query`, `fetchType: FETCH_ONE`) mounts `telemetry_parquet_uri` with `inputFiles` and classifies each row, in this order:
       - `MISSING_OR_NONFINITE_COORDINATE`: latitude or longitude is NULL, NaN or infinite. Without this branch a NULL would fall through every comparison and be counted as clean.
       - `COORDINATE_INVERSION`: `abs(latitude) > 90`, or the point only falls inside the bounding box when latitude and longitude are swapped.
       - `NULL_ISLAND`: both coordinates are within 0.0001 of zero.
       - `OUT_OF_BOUNDS_COORDINATE`: `abs(longitude) > 180` or the point is outside the bounding box.
       - `CLEAN`: everything else.
    2. The same query counts each category, computes `anomaly_rate` and `inversion_rate`, and returns one verdict: `EMPTY_BATCH`, `SPATIAL_VALID`, `ANOMALOUS_QUARANTINE_QUALIFIED` or `CRITICAL_INVERSION_DRIFT`.
    3. `route_by_spatial_verdict` (`io.kestra.plugin.core.flow.Switch`) runs the matching branch:
       - **`SPATIAL_VALID`**: `curate_clean_dataset` writes `curated_spatial_telemetry.parquet`.
       - **`ANOMALOUS_QUARANTINE_QUALIFIED`**: `partition_and_quarantine_records` writes the clean rows to `curated_spatial_telemetry.parquet` and the rest to `quarantined_spatial_telemetry.parquet`, with `anomaly_reason`, `anomaly_severity` and `quarantine_timestamp` added.
       - **`CRITICAL_INVERSION_DRIFT`**: `isolate_emergency_dataset` copies the whole batch to `emergency_quarantine_telemetry.parquet`, then `trip_circuit_breaker` (`Fail`) fails the execution.
       - **`EMPTY_BATCH`**: `fail_empty_batch` (`Fail`) fails the execution, because a file with no rows is not proof of valid data.

    ## What you get

    - In-process validation of coordinate quality with DuckDB, with no GIS server, database or cluster to run.
    - Detection of swapped latitude/longitude pairs, impossible latitudes, missing coordinates, Null Island defaults and geofence breaches, with a count for each.
    - A quarantine file that keeps the original columns and says why each row was rejected.
    - A failed execution when producer drift pushes the anomaly rate over your limits.

    ## Who it's for

    - **Geospatial Engineers & GIS Architects**: Teams that maintain location pipelines, connected-vehicle fleets or mapping platforms.
    - **Data Platform Engineers**: Engineers who put quality gates between edge devices and the data lake.
    - **Analytics Engineers**: Teams that protect warehouse tables from corrupt coordinates.

    ## Why orchestrate this with Kestra

    A standalone script leaves no execution history, output files or failure signal. In Kestra the gate runs with a recorded verdict, the quarantine and emergency files are stored as execution outputs, a `Switch` makes the routing visible, and the failed execution can trigger alerts or stop downstream flows.

    ## Prerequisites

    - A Kestra instance with the DuckDB JDBC plugin (`io.kestra.plugin.jdbc.duckdb`).
    - A Parquet file with numeric `latitude` and `longitude` columns, available as a `kestra://` internal storage URI or a namespace file URI.

    ### Secrets

    - None required: DuckDB runs in-process against files in task storage.

    ## Quick start

    1. Import this blueprint into your Kestra instance.
    2. Execute it with `telemetry_parquet_uri` set to a Parquet file in internal storage, for example the output of an upstream ingestion flow.
    3. Set the bounding box (`min_latitude`, `max_latitude`, `min_longitude`, `max_longitude`) to your service area. The defaults describe Greater London.
    4. Open the execution logs for the verdict and the counts, and download the curated and quarantine files from the task outputs.
    5. Tune `max_inversion_rate` and `max_quarantine_rate` to the tolerance your downstream consumers need.

    ## How to extend

    - **Trigger on landing**: Add a `Schedule` trigger with an `inputs:` block, or call this flow as a subflow after your ingestion flow and pass it the new file URI.
    - **Upload the results**: Chain an `io.kestra.plugin.aws.s3.Upload` or `io.kestra.plugin.gcp.gcs.Upload` task to push `curated_spatial_telemetry.parquet` to your lake bucket.
    - **Alert on failure**: Add a Slack or PagerDuty notification in a flow-level `errors` block or in the `CRITICAL_INVERSION_DRIFT` branch.
    - **Polygon geofences**: Load the DuckDB `spatial` extension and replace the bounding box with `ST_Contains` against a polygon.

    ## Links

    - [Kestra DuckDB Plugin Documentation](https://kestra.io/plugins/plugin-jdbc-duckdb)
    - [DuckDB Spatial Extension Documentation](https://duckdb.org/docs/extensions/spatial)
    - [Apache Parquet Documentation](https://parquet.apache.org/docs/)
  tags:
    - Data
  subTags:
    - Testing & Quality
    - ELT & Data Landing
  ee: false
  demo: false
