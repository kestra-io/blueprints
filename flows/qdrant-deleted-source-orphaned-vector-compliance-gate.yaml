id: qdrant-deleted-source-orphaned-vector-compliance-gate
namespace: company.team

description: |
  Check whether vector points flagged as orphaned (their source record was already deleted from
  the system of record) still exist in a Qdrant collection, auto-purge them only when explicitly
  authorized, alert Slack otherwise, and log a governance audit trail either way.

inputs:
  - id: qdrant_host
    type: STRING
    displayName: Qdrant host
    description: Hostname or IP address of the Qdrant gRPC endpoint.
    defaults: "localhost"

  - id: qdrant_collection
    type: STRING
    displayName: Qdrant collection
    description: Collection to check for orphaned points.
    defaults: "docs"

  - id: orphaned_point_ids
    type: ARRAY
    itemType: STRING
    displayName: Orphaned point IDs
    description: Point IDs (numbers or UUID strings) whose source record has already been deleted elsewhere and that should no longer exist in this collection.
    defaults: []

  - id: confirm_purge
    type: BOOL
    displayName: Confirm automatic purge
    description: When true, this flow is authorized to delete any still-present orphaned point itself. When false, a still-present point only alerts Slack so a human deletes it.
    defaults: false

tasks:
  - id: check_points
    type: io.kestra.plugin.qdrant.Get
    description: Read-only probe. Qdrant's Get simply omits a point ID that no longer exists from rows, rather than erroring, so this never needs allowFailure to detect an already-purged point.
    host: "{{ inputs.qdrant_host }}"
    apiKey: "{{ secret('QDRANT_API_KEY') }}"
    collectionName: "{{ inputs.qdrant_collection }}"
    ids: "{{ inputs.orphaned_point_ids }}"
    withPayload: false
    withVectors: false
    fetchType: FETCH

  - id: evaluate
    type: io.kestra.plugin.core.output.OutputValues
    description: Counts and lists the flagged point IDs that Qdrant still returns, then folds confirm_purge into a single severity so the Switch branch needs no further nesting.
    values:
      still_present_count: >-
        {{ ({'rows': outputs.check_points.rows} | jq('[(.rows // [])[] | .id] | length')) | first | number }}
      still_present_ids: >-
        {{ ({'rows': outputs.check_points.rows} | jq('[(.rows // [])[] | (.id | tostring)] | join("; ")')) | first }}
      severity: >-
        {{ ((({'rows': outputs.check_points.rows} | jq('[(.rows // [])[] | .id] | length')) | first | number) == 0) ? 'ALL_PURGED' : (inputs.confirm_purge ? 'VIOLATION_AUTO_PURGE' : 'VIOLATION_NEEDS_HUMAN') }}

  - id: route
    type: io.kestra.plugin.core.flow.Switch
    description: ALL_PURGED just logs. VIOLATION_AUTO_PURGE performs the safe remediation (deleting a point whose source is already gone is the already-correct outcome) only when confirm_purge authorizes it; otherwise a lingering point only alerts.
    value: "{{ outputs.evaluate.values.severity }}"
    cases:
      "ALL_PURGED":
        - id: log_all_purged
          type: io.kestra.plugin.core.log.Log
          message: "None of the {{ inputs.orphaned_point_ids | length }} flagged point(s) still exist in collection {{ inputs.qdrant_collection }}."
      "VIOLATION_NEEDS_HUMAN":
        - id: alert_violation
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {{ {'text': 'VIOLATION_NEEDS_HUMAN: ' ~ outputs.evaluate.values.still_present_count ~ ' point(s) in collection ' ~ inputs.qdrant_collection ~ ' are flagged as orphaned but still exist: ' ~ outputs.evaluate.values.still_present_ids ~ '. Set confirm_purge to true to let this flow delete them, or delete them manually now.'} | toJson }}
      "VIOLATION_AUTO_PURGE":
        - id: purge_points
          type: io.kestra.plugin.qdrant.Delete
          description: Deletes the still-present orphaned points now that confirm_purge explicitly authorizes this flow to act.
          host: "{{ inputs.qdrant_host }}"
          apiKey: "{{ secret('QDRANT_API_KEY') }}"
          collectionName: "{{ inputs.qdrant_collection }}"
          ids: "{{ inputs.orphaned_point_ids }}"
        - id: alert_auto_purged
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {{ {'text': 'VIOLATION_AUTO_PURGE: ' ~ outputs.evaluate.values.still_present_count ~ ' point(s) in collection ' ~ inputs.qdrant_collection ~ ' were flagged as orphaned and purged automatically: ' ~ outputs.evaluate.values.still_present_ids ~ '.'} | toJson }}

  - id: summary
    type: io.kestra.plugin.core.log.Log
    message: "Qdrant deleted-source orphaned vector compliance gate complete for {{ inputs.qdrant_collection }}: severity {{ outputs.evaluate.values.severity }}."

errors:
  - id: alert_flow_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {{ {'text': 'Qdrant deleted-source orphaned vector compliance gate failed (execution ' ~ execution.id ~ '). Check the logs.'} | toJson }}

triggers:
  - id: daily
    type: io.kestra.plugin.core.trigger.Schedule
    description: Shipped disabled. Enable once QDRANT_API_KEY and SLACK_WEBHOOK_URL are set and orphaned_point_ids is fed with real IDs flagged by your source-of-truth deletion pipeline; confirm_purge stays false by default so a lingering point alerts a human rather than being auto-deleted until you deliberately opt in.
    cron: "0 3 * * *"
    disabled: true
    inputs:
      qdrant_host: "localhost"
      qdrant_collection: "docs"
      orphaned_point_ids: []
      confirm_purge: false

extend:
  title: Qdrant Deleted-Source Orphaned Vector Compliance Gate
  metaTitle: Qdrant Deleted-Source Orphaned Vector Compliance Gate with Kestra
  shortDescription: Check whether orphaned Qdrant points whose source record was deleted still exist, alert Slack or auto-purge them, and log a governance audit trail.
  metaDescription: Check for orphaned Qdrant vector points, alert Slack or auto-purge them, and log the result for RAG and data platform teams.
  description: |
    A RAG pipeline embeds a record once and rarely revisits it: when the source row is deleted
    from the primary database, nothing automatically tells Qdrant to forget its vector. The
    embedding lingers, fully searchable, long after the record it represents is gone, which is
    both stale context for retrieval and, when the source held personal data, a real compliance
    gap. This blueprint checks whether a batch of points flagged as orphaned by your deletion
    pipeline still exist in Qdrant, and only purges them once you have explicitly said this flow
    is allowed to.

    This blueprint was created by [Mohit Jeswani](https://github.com/mohitjeswani01).

    ## How it works

    1. `check_points` (`io.kestra.plugin.qdrant.Get`) looks up `orphaned_point_ids` by ID.
       Qdrant's own API simply omits a point that no longer exists from the result rather than
       erroring, so an already-purged point needs no special error handling to detect.
    2. `evaluate` (`io.kestra.plugin.core.output.OutputValues`) counts and lists the flagged IDs
       Qdrant still returns, then classifies the check as `ALL_PURGED`, `VIOLATION_AUTO_PURGE`, or
       `VIOLATION_NEEDS_HUMAN`, folding `confirm_purge` into the classification itself.
    3. `route` (`io.kestra.plugin.core.flow.Switch`):
       - **ALL_PURGED:** logs that nothing flagged is still present.
       - **VIOLATION_AUTO_PURGE:** runs `io.kestra.plugin.qdrant.Delete` (the safe remediation,
         since deleting a point whose source is already gone is the already-correct outcome) and
         posts a Slack notice that it happened automatically.
       - **VIOLATION_NEEDS_HUMAN:** posts a Slack alert instead of deleting, because this flow
         was not authorized to act on its own.
    4. `summary` logs the severity, closing the governance cycle.
    5. `errors` alerts Slack if the flow itself fails, for example an unreachable Qdrant host.

    ## What you get

    - A real existence check against Qdrant itself, not an assumption that a deletion pipeline's
      own "done" signal actually reached the vector store.
    - A purge that only ever removes a point your source system has already said should be gone,
      and only once you have explicitly set `confirm_purge` to allow it.
    - A Slack alert naming the exact still-present point IDs, so a human can act immediately
      without re-deriving which ones leaked.

    ## Who it's for

    - RAG and data platform teams who embed records into Qdrant and need deletions in the
      source system to actually reach the vector store, not just the primary database.
    - Teams evaluating the Qdrant plugin who want a worked example of `Get` and `Delete` used
      together as a compliance gate, distinct from this repo's existing Qdrant blueprints, which
      focus on collection indexing and HNSW health rather than per-point lifecycle compliance.

    ## Why orchestrate this with Kestra

    Qdrant can delete a point on request, but it has no concept of "this point's source record
    was deleted elsewhere," no escalation when a deletion never arrives, and no Slack integration
    of its own. Kestra keeps `orphaned_point_ids` and `confirm_purge` as flow inputs, turns a
    batch existence check into a purge decision, and keeps a full execution history proving
    exactly which points were checked and what happened to each one.

    ## Prerequisites

    - A Qdrant instance reachable over gRPC, with a collection containing at least one point you
      can flag as orphaned to confirm the check.
    - A Slack incoming webhook URL.

    A local Qdrant instance can be run via the official `qdrant/qdrant` Docker image for a fully
    local end-to-end test, no managed account required.

    ### Secrets

    - `QDRANT_API_KEY`: the Qdrant API key used by `check_points` and `purge_points`. In Kestra
      OSS, provide it as the base64-encoded environment variable `SECRET_QDRANT_API_KEY`; leave it
      unset for a local instance with no authentication configured.
    - `SLACK_WEBHOOK_URL`: used by both Slack alert branches and the `errors` block. In Kestra
      OSS, provide it as the base64-encoded environment variable `SECRET_SLACK_WEBHOOK_URL`.

    ### Inputs

    | Input | Default | Purpose |
    |---|---|---|
    | `qdrant_collection` | `docs` | Collection to check for orphaned points |
    | `orphaned_point_ids` | `[]` | Point IDs whose source record has already been deleted |
    | `confirm_purge` | `false` | Authorizes this flow to delete still-present points itself |

    ### Outputs

    - `{{ outputs.check_points.rows }}`: the flagged points that still exist, as Qdrant returns
      them.
    - `{{ outputs.evaluate.values.still_present_count }}` / `.still_present_ids`: how many flagged
      points are still present and their IDs, semicolon-joined.
    - `{{ outputs.evaluate.values.severity }}`: `ALL_PURGED`, `VIOLATION_AUTO_PURGE`, or
      `VIOLATION_NEEDS_HUMAN`.

    ### Pitfalls

    - `Get` silently drops a missing ID from `rows` instead of erroring; this blueprint relies on
      that behavior to detect an already-purged point, verified directly against the task's own
      source rather than assumed from its Javadoc, which does not call this out explicitly.
    - `confirm_purge` applies to the whole batch, not per point; a scheduled run with
      `confirm_purge: true` auto-deletes every still-present point in `orphaned_point_ids`, so
      scope one execution to one reviewed batch rather than an entire collection sweep.
    - `Delete` by `ids` has no dry-run mode; test against a disposable collection first, since a
      point deleted here cannot be recovered unless you kept the original vector and payload
      elsewhere.

    ## Quick start

    1. Add the `QDRANT_API_KEY` (if your instance requires one) and `SLACK_WEBHOOK_URL` secrets.
    2. Run a local `qdrant/qdrant` container, create a collection, and upsert a test point.
    3. Set `orphaned_point_ids` to that point's ID and run with `confirm_purge: false`; confirm
       `alert_violation` fires.
    4. Run again with `confirm_purge: true`; confirm `purge_points` deletes it and
       `alert_auto_purged` fires.
    5. Run a third time and confirm `log_all_purged` fires now that the point is gone.
    6. Enable the `daily` trigger once `orphaned_point_ids` is fed from a real deletion pipeline.

    ## How to extend

    - Feed `orphaned_point_ids` automatically from the same job that deletes the source record,
      instead of maintaining the list by hand.
    - Switch `check_points` and `purge_points` to Qdrant's `filter` property instead of `ids`, to
      sweep every point whose payload still references a deleted source ID rather than a
      pre-collected list.
    - Chain an export of each still-present point's payload before `purge_points` runs, to keep
      an audit record of exactly what was removed and why.

    ## Links

    - Qdrant plugin: https://kestra.io/plugins/plugin-qdrant
    - Qdrant points API reference: https://qdrant.tech/documentation/concepts/points/
    - Qdrant Docker image: https://hub.docker.com/r/qdrant/qdrant
    - Slack incoming webhooks: https://api.slack.com/messaging/webhooks
  tags:
    - AI
  subTags:
    - Vector Stores & RAG
    - Policy & Compliance
  ee: false
  demo: false
