id: elasticsearch-snapshot-repository-verification-sentinel
namespace: company.team

inputs:
  - id: es_host
    type: STRING
    defaults: "elasticsearch.internal"
    description: Elasticsearch cluster hostname or IP address.
  - id: es_port
    type: INT
    defaults: 9200
    description: Elasticsearch HTTP port.
  - id: es_user
    type: STRING
    defaults: "elastic"
    description: Elasticsearch username.
  - id: repository_name
    type: STRING
    defaults: "daily_backups"
    description: Elasticsearch snapshot repository name to verify.

tasks:
  - id: verify_snapshot_repository
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests
    env:
      ES_HOST: "{{ inputs.es_host }}"
      ES_PORT: "{{ inputs.es_port }}"
      ES_USER: "{{ inputs.es_user }}"
      ES_PASSWORD: "{{ secret('ES_PASSWORD') }}"
      REPO_NAME: "{{ inputs.repository_name }}"
    script: |
      import os
      import sys
      import json
      import requests
      from kestra import Kestra

      host = os.environ.get("ES_HOST", "elasticsearch.internal")
      port = os.environ.get("ES_PORT", "9200")
      user = os.environ.get("ES_USER", "elastic")
      password = os.environ.get("ES_PASSWORD", "")
      repo = os.environ.get("REPO_NAME", "daily_backups")

      auth = (user, password) if user and password else None
      url = f"http://{host}:{port}/_snapshot/{repo}/_verify"

      try:
          resp = requests.post(url, auth=auth, timeout=30)
          resp.raise_for_status()
          data = resp.json()
      except Exception as e:
          print(f"CRITICAL: Failed to verify snapshot repository {repo} at {url}: {e}", file=sys.stderr)
          sys.exit(1)

      nodes = data.get("nodes", {})
      verified_nodes = len(nodes)

      report = {
          "repository_name": repo,
          "verified_nodes": verified_nodes,
          "nodes": nodes
      }

      with open("snapshot_verify_report.json", "w") as f:
          json.dump(report, f, indent=2)

      Kestra.outputs({
          "verified_nodes": verified_nodes,
          "status": "OK" if verified_nodes > 0 else "NO_NODES"
      })
      print(f"Snapshot verify: repository={repo}, verified_nodes={verified_nodes}")
    outputFiles:
      - snapshot_verify_report.json

  - id: evaluate_repository_health
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.verify_snapshot_repository.vars.verified_nodes | int == 0 }}"
    then:
      - id: notify_backup_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#elasticsearch-alerts",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 Elasticsearch Snapshot Repository Verification Failed",
                "text": "Elasticsearch repository `{{ inputs.repository_name }}` verification failed on `{{ inputs.es_host }}` (Verified Nodes: *{{ outputs.verify_snapshot_repository.vars.verified_nodes }}*). Impact: S3/GCS blob storage authentication or write permissions have lapsed, rendering scheduled backups impossible.",
                "footer": "Kestra Disaster Recovery Sentinel • Elasticsearch"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "#elasticsearch-alerts",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ Elasticsearch Snapshot Repository Verification Sentinel Failure",
            "text": "Failed to execute Elasticsearch snapshot repository verification. Verify storage backend connectivity. Execution ID: {{ execution.id }}",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 4 * * *"
    disabled: true

extend:
  metaDescription: "Verifies Elasticsearch snapshot repositories across cluster nodes to ensure backup integrity and storage access."
  metaTitle: Elasticsearch Snapshot Repository Verification Sentinel with Kestra
  title: Elasticsearch Snapshot Repository Verification Sentinel
  shortDescription: Verifies Elasticsearch snapshot repositories across cluster nodes to ensure backup integrity and storage access.
  description: |
    ## How it works
    This workflow invokes `POST /_snapshot/<repository>/_verify` against the cluster. Elasticsearch instructs each node to verify read and write access to the underlying blob storage repository (S3, GCS, Azure Blob, or Shared FS). If credentials expire, bucket IAM policies change, or network partitions disconnect nodes, the verification returns an error and notifies backup teams.

    ## Architecture diagram
    ```mermaid
    flowchart TD
      A[periodic_schedule Schedule Trigger] --> B[verify_snapshot_repository Python Script]
      B --> C{Verified Nodes == 0?}
      C -- Yes --> D[notify_backup_team Slack Webhook]
      C -- No --> E[Repository Verified]
    ```

    ## Prerequisites
    - Elasticsearch cluster (7.x / 8.x) accessible via REST.
    - Snapshot repository registered in the cluster.
    - Secrets `ES_PASSWORD` and `SLACK_WEBHOOK_URL` configured in Kestra.

    ## Quick start
    1. Import the blueprint under the `company.team` namespace.
    2. Configure cluster host, credentials, and repository name.
    3. Run manually to verify backup repository health.

    ## Links
    - [Elasticsearch Verify Snapshot Repository API](https://www.elastic.co/guide/en/elasticsearch/reference/current/snapshots-register-repository.html#snapshots-repository-verification)
    - [Kestra Python Script Documentation](https://kestra.io/plugins/plugin-scripts-python)
  tags:
    - Data
    - Infrastructure
  subTags:
    - ELT & Data Landing
    - Day 2 Operations
  ee: false
  demo: false
