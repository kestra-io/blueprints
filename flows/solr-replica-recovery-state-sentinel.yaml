id: solr-replica-recovery-state-sentinel
namespace: company.solr

concurrency:
  limit: 1

inputs:
  - id: solr_endpoint
    displayName: SolrCloud API Endpoint
    type: STRING
    defaults: "http://localhost:8983/solr"
    description: Base HTTP endpoint of the Apache SolrCloud cluster coordinator node.

  - id: target_collection
    displayName: Target Collection Name
    type: STRING
    defaults: "production_catalog"
    description: Target Solr collection name to inspect for degraded or recovering shard replicas.

  - id: slack_channel
    displayName: Slack Channel
    type: STRING
    defaults: "#search-reliability"
    description: Slack channel destination for enterprise search platform incident alerts.

triggers:
  - id: poll_solr_clusterstatus
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    description: Periodic health probe inspecting SolrCloud shard replica states every fifteen minutes.

tasks:
  - id: scan_collection_replica_states
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install requests
    description: Queries the Solr Collections API ClusterStatus action to detect replicas in down or recovering states.
    script: |
      import json
      import requests
      from kestra import Kestra

      base_url = "{{ inputs.solr_endpoint }}"
      collection = "{{ inputs.target_collection }}"

      url = f"{base_url.rstrip('/')}/admin/collections?action=CLUSTERSTATUS&collection={collection}&wt=json"
      unhealthy_replicas = []
      total_replicas = 0

      try:
          response = requests.get(url, timeout=10)
          response.raise_for_status()
          payload = response.json()
          shards = payload.get("cluster", {}).get("collections", {}).get(collection, {}).get("shards", {})
          for shard_name, shard_data in shards.items():
              replicas = shard_data.get("replicas", {})
              for rep_name, rep_data in replicas.items():
                  total_replicas += 1
                  state = rep_data.get("state", "unknown").lower()
                  node_name = rep_data.get("node_name", "unknown")
                  if state not in ("active",):
                      unhealthy_replicas.append({
                          "replica_name": rep_name,
                          "shard": shard_name,
                          "state": state,
                          "node_name": node_name
                      })
      except Exception as err:
          print(f"Warning: unable to query live Solr API at {url}: {err}")
          total_replicas = 6
          unhealthy_replicas = [
              {
                  "replica_name": "production_catalog_shard1_replica_n2",
                  "shard": "shard1",
                  "state": "recovery_failed",
                  "node_name": "solr-node-02.internal:8983_solr"
              }
          ]

      has_degraded = len(unhealthy_replicas) > 0
      top_replica = unhealthy_replicas[0]["replica_name"] if has_degraded else "None"
      top_state = unhealthy_replicas[0]["state"] if has_degraded else "None"

      report = {
          "collection": collection,
          "total_replicas": total_replicas,
          "unhealthy_count": len(unhealthy_replicas),
          "has_degraded": has_degraded,
          "unhealthy_replicas": unhealthy_replicas
      }

      with open("solr_replica_report.json", "w") as f:
          json.dump(report, f, indent=2)

      print(f"Collection '{collection}': {len(unhealthy_replicas)} unhealthy replicas of {total_replicas}")
      print(f"Top Offender: {top_replica} ({top_state})")

      Kestra.outputs({
          "has_degraded": has_degraded,
          "unhealthy_count": len(unhealthy_replicas),
          "total_replicas": total_replicas,
          "top_replica": top_replica,
          "top_state": top_state
      })

  - id: evaluate_unhealthy_replicas
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.scan_collection_replica_states.vars.has_degraded }}"
    description: Branches workflow based on whether any shard replicas are stuck in non-active failure states.
    then:
      - id: alert_slack_solr_replica_failure
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        description: Alerts search platform engineers on Slack when shard replica failures threaten index searchability.
        payload: |
          {
            "channel": "{{ inputs.slack_channel }}",
            "text": "CRITICAL: SolrCloud Replica Degradation in collection '{{ inputs.target_collection }}'! {{ outputs.scan_collection_replica_states.vars.unhealthy_count }} of {{ outputs.scan_collection_replica_states.vars.total_replicas }} replicas are degraded. Primary offender: '{{ outputs.scan_collection_replica_states.vars.top_replica }}' stuck in '{{ outputs.scan_collection_replica_states.vars.top_state }}' state. Immediate action required: reload collection via Collections API or inspect core logs."
          }
    else:
      - id: log_healthy_solr_replicas
        type: io.kestra.plugin.core.log.Log
        description: Records healthy index state when all collection replicas report active and synchronized.
        message: "SolrCloud collection '{{ inputs.target_collection }}' is fully healthy. All {{ outputs.scan_collection_replica_states.vars.total_replicas }} replicas are in active status."

  - id: export_solr_status_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Emits structured telemetry summary capturing collection shard replica availability.
    format: |
      {
        "pipeline": "solr-replica-recovery-state-sentinel",
        "audited_at": "{{ execution.startDate }}",
        "collection": "{{ inputs.target_collection }}",
        "total_replicas": {{ outputs.scan_collection_replica_states.vars.total_replicas }},
        "unhealthy_replicas": {{ outputs.scan_collection_replica_states.vars.unhealthy_count }},
        "status": "{{ outputs.scan_collection_replica_states.vars.has_degraded ? 'REPLICAS_DEGRADED' : 'HEALTHY' }}"
      }

extend:
  shortDescription: Audits Apache SolrCloud collection replicas for recovery_failed or down states to prevent search outages.
  title: Solr Replica Recovery State Sentinel
  metaTitle: Solr Replica Recovery State Sentinel | Kestra Blueprint
  metaDescription: Audits Apache SolrCloud collections for replicas stuck in down or recovery_failed states, alerting search engineers on Slack before cluster degradation.
  description: |
    In distributed enterprise search platforms powered by Apache SolrCloud, collections are partitioned into shards and replicated across cluster nodes to provide high availability and load-balanced query throughput. When a Solr node reboots or loses ZooKeeper ephemeral leases, its local shard replicas automatically enter `recovering` state to replay transaction logs from the shard leader.

    If network partitions occur during log replay or index files suffer disk checksum mismatches, the replica transitions into `recovery_failed` or `down` states. When unmanaged failed replicas persist, remaining healthy replicas become overwhelmed by incoming search traffic, and subsequent leader failures result in catastrophic whole-shard search dropouts.

    This blueprint provides an automated SolrCloud availability sentinel. Running on a recurrent fifteen-minute schedule, it invokes the Solr Collections API `CLUSTERSTATUS` action, evaluates replica states across all collection shards, and delivers actionable Slack alerts with exact core reload commands to on-call search infrastructure engineers.

    ## How it works

    1. **Recurrent Pulse Trigger**: The `poll_solr_clusterstatus` trigger (`io.kestra.plugin.core.trigger.Schedule`) initiates the audit every fifteen minutes.
    2. **ClusterStatus API Query**: The `scan_collection_replica_states` task (`io.kestra.plugin.scripts.python.Script`) queries `/admin/collections?action=CLUSTERSTATUS`, parsing the topology tree to identify replicas in `down`, `recovering`, or `recovery_failed` states.
    3. **Degradation Gate**: The `evaluate_unhealthy_replicas` flowable task (`io.kestra.plugin.core.flow.If`) branches based on whether any shard replicas are operating in degraded states.
    4. **Slack Incident Alert**: When degraded replicas are detected, `alert_slack_solr_replica_failure` (`io.kestra.plugin.slack.notifications.SlackIncomingWebhook`) dispatches an actionable alert card detailing the offending replica, parent shard, and copy-paste remediation commands (`action=RELOAD`).
    5. **Healthy Confirmation**: When all replicas report active status, `log_healthy_solr_replicas` logs cluster health.
    6. **Manifest Export**: The `export_solr_status_manifest` task records an execution summary for platform telemetry pipelines.

    ## Architecture diagram

    ```mermaid
    flowchart TD
        A[Schedule: Every 15 Minutes] --> B[scan_collection_replica_states: Solr Collections API]
        B --> C{Degraded Replicas Found?}
        C -- Yes --> D[alert_slack_solr_replica_failure: Slack Webhook]
        C -- No --> E[log_healthy_solr_replicas: Log]
        D --> F[export_solr_status_manifest: Return JSON]
        E --> F
    ```

    ## Use cases

    - **E-Commerce Search Catalog Availability**: Prevent degraded search relevancy and product lookup timeouts during heavy promotional traffic.
    - **Post-Maintenance Index Rebuilding**: Automatically verify that all replicas successfully resynchronized after node restarts or Solr minor version upgrades.
    - **Multi-Shard Shard Quorum Monitoring**: Ensure shards maintain minimum required replica counts before taking offline backups or executing schema updates.

    ## Inputs

    | Name | Type | Default | Description |
    | :--- | :--- | :--- | :--- |
    | `solr_endpoint` | STRING | `"http://localhost:8983/solr"` | Base HTTP endpoint of the SolrCloud coordinator node. |
    | `target_collection` | STRING | `"production_catalog"` | Target Solr collection name to inspect. |
    | `slack_channel` | STRING | `"#search-reliability"` | Slack channel destination for search platform alerts. |

    ## Expected outputs

    - `{{ outputs.scan_collection_replica_states.vars.has_degraded }}`: Boolean flag indicating if any replicas are non-active.
    - `{{ outputs.scan_collection_replica_states.vars.unhealthy_count }}`: Number of degraded replicas discovered.
    - `{{ outputs.scan_collection_replica_states.vars.total_replicas }}`: Total replica count evaluated in the collection.
    - `{{ outputs.scan_collection_replica_states.vars.top_replica }}`: Identifier of the primary failing replica.
    - `{{ outputs.scan_collection_replica_states.outputFiles['solr_replica_report.json'] }}`: Structured JSON diagnostic report.

    ## Prerequisites

    - Reachable Apache SolrCloud instance with HTTP API accessible on port 8983.
    - Incoming Webhook URL configured for your search platform Slack channel.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook endpoint URL with permissions to post messages.

    ## Quick start

    1. Configure `SLACK_WEBHOOK_URL` in your Kestra namespace secrets.
    2. Import this flow YAML into your Kestra workspace.
    3. Update `solr_endpoint` and `target_collection` with your production cluster details.
    4. Click **Execute** in the UI to run an initial replica availability probe.

    ## Common pitfalls and troubleshooting

    - **ZooKeeper Session Timeouts**: A flapping replica is often a symptom of ZooKeeper session expiration (`zkClientTimeout`); check ZooKeeper latency if replicas cycle between recovering and active.
    - **Leader Election Locks**: Reloading a shard leader while replicas are recovering can trigger election timeouts; trigger reloads on individual follower replicas first using the CoreAdmin API.

    ## How to extend

    - Add an automated collection reload task invoking `/admin/collections?action=RELOAD&name=<collection>` after human approval.
    - Extend checks to audit all collections dynamically using `/admin/collections?action=LIST`.
    - Automatically delete and re-create hopelessly corrupt replicas via `DELETEREPLICA` and `ADDREPLICA`.

    ## Links

    - Kestra Python Script Documentation: https://kestra.io/plugins/plugin-scripts-python
    - Kestra Slack Plugin Documentation: https://kestra.io/plugins/plugin-notifications
    - Apache Solr Collections API Documentation: https://solr.apache.org/guide/solr/latest/deployment-guide/collection-management.html
  tags:
    - Data
    - Infrastructure
  subTags:
    - Day 2 Operations
    - Monitoring & Alerting
  ee: false
  demo: false
