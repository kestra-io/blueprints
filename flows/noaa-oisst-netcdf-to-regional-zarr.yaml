id: noaa-oisst-netcdf-to-regional-zarr
namespace: company.data
description: Convert a final NOAA OISST daily NetCDF into a verified regional Zarr v2 ZipStore.
inputs:
- id: day
  type: DATE
  defaults: '2024-07-01'
  description: Final-product UTC date, at least 17 days old. No preliminary fallback.
- id: bbox
  type: STRING
  defaults: '[65,5,80,20]'
  description: WGS84 [west,south,east,north], <=30 degrees per side, no antimeridian crossing.
triggers:
- id: daily
  type: io.kestra.plugin.core.trigger.Schedule
  cron: 0 8 * * *
  disabled: true
  inputs:
    day: '{{ now() | dateAdd(-17, ''DAYS'') | date(''yyyy-MM-dd'') }}'
tasks:
- id: validate_inputs
  type: io.kestra.plugin.scripts.python.Script
  taskRunner:
    type: io.kestra.plugin.core.runner.Process
  env:
    DAY: '{{ inputs.day | date(''yyyy-MM-dd'') }}'
    BBOX: '{{ inputs.bbox }}'
  script: "import os,json,math\nfrom datetime import date,timedelta,datetime,timezone\nd=date.fromisoformat(os.environ['DAY'])\n\
    if d<date(1981,9,1) or d>datetime.now(timezone.utc).date()-timedelta(days=17):\n    raise ValueError('Use a\
    \ final-product date at least 17 days old, on/after 1981-09-01')\nb=json.loads(os.environ['BBOX'])\nif not isinstance(b,list)\
    \ or len(b)!=4 or any(type(v) not in (int,float) or not math.isfinite(v) for v in b):\n    raise ValueError('bbox\
    \ must contain four finite numbers')\nw,s,e,n=b\nif not(-180<=w<e<=180 and -90<=s<n<=90) or e-w>30 or n-s>30:\n\
    \    raise ValueError('Use non-antimeridian bbox <=30 degrees per side')\nurl=f'https://www.ncei.noaa.gov/data/sea-surface-temperature-optimum-interpolation/v2.1/access/avhrr/{d:%Y%m}/oisst-avhrr-v02r01.{d:%Y%m%d}.nc'\n\
    print('::{\"outputs\":'+json.dumps({'url':url})+'}::')\n"
- id: download
  type: io.kestra.plugin.core.http.Download
  uri: '{{ outputs.validate_inputs.vars.url }}'
- id: create_zarr
  type: io.kestra.plugin.scripts.python.Script
  taskRunner:
    type: io.kestra.plugin.core.runner.Process
  env:
    DAY: '{{ inputs.day | date(''yyyy-MM-dd'') }}'
    BBOX: '{{ inputs.bbox }}'
    SOURCE_URL: '{{ outputs.validate_inputs.vars.url }}'
  inputFiles:
    source.nc: '{{ outputs.download.uri }}'
  outputFiles:
  - oisst.zarr.zip
  - manifest.json
  script: "import os,json,hashlib\nfrom pathlib import Path\nimport numpy as np,xarray as xr,zarr\nfrom numcodecs\
    \ import Blosc\nw,s,e,n=json.loads(os.environ['BBOX'])\nwith xr.open_dataset('source.nc',engine='netcdf4',mask_and_scale=True)\
    \ as src:\n    if set(('sst','anom','err','ice'))-set(src.data_vars): raise ValueError('Missing OISST variables')\n\
    \    if src.sizes.get('time')!=1 or src.sizes.get('zlev')!=1: raise ValueError('Expected one time and surface\
    \ level')\n    if str(src.time.values[0])[:10]!=os.environ['DAY']: raise ValueError('Source date mismatch')\n\
    \    if src.sst.attrs.get('units')!='Celsius': raise ValueError('Unexpected SST units')\n    if src.sst.dims!=('time','zlev','lat','lon'):\
    \ raise ValueError('Unexpected SST dimensions')\n    lon=np.asarray(src.lon.values);lat=np.asarray(src.lat.values)\n\
    \    if len(lon)!=1440 or len(lat)!=720 or not np.allclose(np.diff(lon),.25) or not np.allclose(np.diff(lat),.25):\n\
    \        raise ValueError('Expected regular quarter-degree global OISST grid')\n    data=src[['sst','anom','err','ice']].isel(zlev=0,drop=True)\n\
    \    data=data.assign_coords(lon=((data.lon+180)%360)-180).sortby('lon').sel(lon=slice(w,e),lat=slice(s,n)).load()\n\
    \    if data.sizes['lat']==0 or data.sizes['lon']==0: raise ValueError('AOI contains no grid centers')\n   \
    \ finite=np.isfinite(data.sst.values); count=int(finite.sum())\n    if count==0: raise ValueError('AOI has no\
    \ finite ocean SST cells')\n    values=data.sst.values[finite]\n    if values.min() < -3 or values.max()>45:\
    \ raise ValueError('SST outside NOAA valid range')\n    # Source packing is decoded above. Do not reuse NetCDF\
    \ integer encodings in Zarr.\n    for name in data.variables:data[name].encoding={}\n    enc={name:{'chunks':(1,min(64,data.sizes['lat']),min(64,data.sizes['lon'])),'compressor':Blosc(cname='zstd',clevel=3,shuffle=2),'dtype':'float32','_FillValue':np.nan}\
    \ for name in data.data_vars}\n    with zarr.ZipStore('oisst.zarr.zip',mode='w') as store:\n        data.to_zarr(store,mode='w',consolidated=True,encoding=enc)\n\
    \    with zarr.ZipStore('oisst.zarr.zip',mode='r') as store:\n        with xr.open_zarr(store,consolidated=True,chunks=None)\
    \ as check:\n            xr.testing.assert_allclose(data,check.load())\n    m={'source_url':os.environ['SOURCE_URL'],'source_sha256':hashlib.sha256(Path('source.nc').read_bytes()).hexdigest(),'date':os.environ['DAY'],'bbox':\
    \ [w,s,e,n], 'coordinate_convention':'longitude -180..180; grid centers within inclusive bbox','format':'Zarr\
    \ v2 consolidated ZipStore','sizes':dict(data.sizes),'variables':list(data.data_vars),'finite_sst_cells':count,'total_cells':int(data.sst.size),'sst_min_c':float(values.min()),'sst_max_c':float(values.max()),'sst_mean_c':float(values.mean()),'source_status':'final\
    \ filename; no preliminary fallback','not_for':'navigation, safety decisions, or real-time alerts'}\n    Path('manifest.json').write_text(json.dumps(m,indent=2,allow_nan=False))\n\
    print('::{\"outputs\":'+json.dumps({'valid':True,'finite_cells':count})+'}::')\n"
  dependencies:
  - xarray==2025.3.1
  - zarr==2.18.3
  - numcodecs==0.12.1
  - netCDF4==1.7.2
  - numpy==2.2.5
- id: publish_valid_data
  type: io.kestra.plugin.core.flow.If
  condition: '{{ outputs.create_zarr.vars.valid }}'
  then:
  - id: verify_zarr
    type: io.kestra.plugin.scripts.python.Script
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    inputFiles:
      oisst.zarr.zip: '{{ outputs.create_zarr.outputFiles[''oisst.zarr.zip''] }}'
      manifest.json: '{{ outputs.create_zarr.outputFiles[''manifest.json''] }}'
    outputFiles:
    - SHA256SUMS
    script: "import json,hashlib,zipfile\nfrom pathlib import Path\nimport numpy as np,xarray as xr,zarr\nm=json.loads(Path('manifest.json').read_text())\n\
      with zipfile.ZipFile('oisst.zarr.zip') as z:\n    if z.testzip() is not None or '.zmetadata' not in z.namelist():\
      \ raise ValueError('Invalid consolidated Zarr ZIP')\nwith zarr.ZipStore('oisst.zarr.zip',mode='r') as store:\n\
      \    with xr.open_zarr(store,consolidated=True,chunks=None) as d:\n        d.load()\n        if dict(d.sizes)!=m['sizes']\
      \ or sorted(d.data_vars)!=sorted(m['variables']):raise ValueError('Manifest shape or variable mismatch')\n\
      \        if str(d.time.values[0])[:10]!=m['date']:raise ValueError('Manifest date mismatch')\n        a=d.sst.values;f=np.isfinite(a);v=a[f]\n\
      \        if int(f.sum())!=m['finite_sst_cells'] or int(a.size)!=m['total_cells']:raise ValueError('Manifest\
      \ cell-count mismatch')\n        if not np.allclose([v.min(),v.max(),v.mean()],[m['sst_min_c'],m['sst_max_c'],m['sst_mean_c']],rtol=1e-6):raise\
      \ ValueError('Manifest statistics mismatch')\n        w,s,e,n=m['bbox']\n        if not (float(d.lon.min())>=w\
      \ and float(d.lon.max())<=e and float(d.lat.min())>=s and float(d.lat.max())<=n):raise ValueError('Coordinates\
      \ escape AOI')\nPath('SHA256SUMS').write_text(''.join(hashlib.sha256(Path(p).read_bytes()).hexdigest()+' \
      \ '+p+'\\n' for p in ['oisst.zarr.zip','manifest.json']))\n"
    dependencies:
    - xarray==2025.3.1
    - zarr==2.18.3
    - numcodecs==0.12.1
    - netCDF4==1.7.2
    - numpy==2.2.5
  - id: package_verified_store
    type: io.kestra.plugin.compress.ArchiveCompress
    algorithm: ZIP
    from:
      oisst.zarr.zip: '{{ outputs.create_zarr.outputFiles[''oisst.zarr.zip''] }}'
      manifest.json: '{{ outputs.create_zarr.outputFiles[''manifest.json''] }}'
      SHA256SUMS: '{{ outputs.verify_zarr.outputFiles[''SHA256SUMS''] }}'
extend:
  title: Convert NOAA OISST NetCDF to verified regional Zarr
  metaTitle: NOAA OISST NetCDF to regional Zarr | Kestra
  shortDescription: Crop real daily sea surface temperature fields and publish a verified consolidated Zarr store
    with provenance and checksums.
  metaDescription: Convert NOAA OISST NetCDF to regional Zarr with decoded temperatures, longitude normalization,
    read-back checks and a provenance manifest.
  description: 'Turn one daily final NOAA OISST v2.1 grid into a small regional Zarr v2 ZipStore. The flow preserves
    SST, anomaly, error and ice fields, including units and missing ocean/land cells. It does not calculate hazard
    scores or issue alerts.


    ## How it works


    1. A manual run or disabled daily schedule validates the date and bounded WGS84 box before network access.

    2. HTTP Download fetches the exact final NOAA NetCDF filename. Missing days fail; preliminary data is never
    substituted.

    3. Python decodes CF-packed values, validates the source grid/date/units, normalizes longitudes and crops by
    grid centers. It writes a chunked consolidated Zarr v2 ZIP and checks the full decoded read-back.

    4. An If branch independently verifies the stored arrays against the manifest before ArchiveCompress publishes
    the bundle. A failed check prevents publication.


    ## What you get


    - A bundle containing oisst.zarr.zip, manifest.json and SHA256SUMS.

    - All four NOAA variables with metadata, source URL/hash, finite SST count and Celsius statistics.

    - Rejection of invalid dates, oversized or antimeridian boxes, empty ocean selections and source/schema mismatches.


    ## Who it''s for


    - Ocean-data engineers preparing reproducible regional inputs for notebooks or data lakes.


    ## Why orchestrate this with Kestra


    - Download, conversion, independent verification and publication have separate task states. A failed conversion
    cannot publish a successful-looking data artifact.


    ## Prerequisites


    - Trusted Python 3.10+ worker with uv and HTTPS access to NOAA and the package index. Process tasks use isolated
    pinned virtual environments.

    - One day per run; box <=30 degrees on each side. Longitude convention is -180..180, and bounds select grid
    centers, not interpolated edges.

    - Use dates at least 17 days old. NOAA may still have gaps; HTTP failures are not treated as empty successful
    data. This is not a safety or navigation product.


    ### Secrets


    - None. All inputs are public NOAA data.


    ## Quick start


    1. Run the historical defaults for the Arabian Sea. Download the output bundle and verify SHA256SUMS after extraction.

    2. Open the inner ZIP with zarr.ZipStore(mode="r") and xarray.open_zarr(consolidated=True, chunks=None).

    3. Choose a final-product date and regional box. Enable the schedule only after testing; it selects the UTC
    day 17 days ago.


    ## How to extend


    - Upload verified bundles to object storage, or join independently verified daily stores into a time series.
    Do not append concurrently to the same Zarr store.


    ## Links


    - [NOAA OISST](https://www.ncei.noaa.gov/products/optimum-interpolation-sst)

    - [Xarray Zarr writing](https://docs.xarray.dev/en/stable/generated/xarray.Dataset.to_zarr.html)

    - [Python tasks](https://kestra.io/plugins/plugin-script-python)

    - [ArchiveCompress](https://kestra.io/plugins/plugin-compress/io.kestra.plugin.compress.archivecompress)

    '
  tags:
  - Data
  subTags:
  - File & Data Processing Basics
  ee: false
  demo: false
