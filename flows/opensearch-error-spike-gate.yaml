id: opensearch-error-spike-gate
namespace: company.team
description: |
  Count server errors in the last hour with one OpenSearch query and gate
  on the result. Above the threshold the flow alerts Discord and fails
  loudly; below it, it logs an all-clear and exits green.

inputs:
  - id: error_threshold
    type: INT
    defaults: 50
    description: Maximum number of 5xx documents tolerated in the last hour before the flow alerts and fails.

tasks:
  - id: count_recent_errors
    type: io.kestra.plugin.opensearch.Search
    description: Run a size-zero search counting documents with a 5xx status in the last hour, using date math so the window needs no templating.
    connection:
      hosts:
        - "{{ secret('OPENSEARCH_HOST') }}"
      basicAuth:
        username: "{{ secret('OPENSEARCH_USERNAME') }}"
        password: "{{ secret('OPENSEARCH_PASSWORD') }}"
    indexes:
      - app-logs
    fetchType: FETCH
    request:
      size: 0
      query:
        bool:
          filter:
            - range:
                status:
                  gte: 500
                  lt: 600
            - range:
                "@timestamp":
                  gte: now-1h

  - id: gate
    type: io.kestra.plugin.core.flow.If
    description: Compare the hourly 5xx count against the threshold input and branch into alerting or an all-clear log line.
    condition: "{{ outputs.count_recent_errors.total >= inputs.error_threshold }}"
    then:
      - id: alert_spike
        type: io.kestra.plugin.discord.DiscordIncomingWebhook
        description: Page the channel with the exact count and threshold before the flow fails, so responders see the numbers without opening Kestra.
        url: "{{ secret('DISCORD_WEBHOOK_URL') }}"
        payload: |
          {
            "content": "OpenSearch error spike: {{ outputs.count_recent_errors.total }} server errors in app-logs over the last hour, threshold is {{ inputs.error_threshold }}. Execution {{ execution.id }} is failing on purpose."
          }

      - id: fail_execution
        type: io.kestra.plugin.core.execution.Fail
        description: Fail the execution deliberately so the spike is visible as a red run in the UI and in any downstream flow triggers watching this flow's state.
        errorMessage: "Hourly 5xx count crossed the configured threshold, see the alert_spike message for the numbers."
    else:
      - id: all_clear
        type: io.kestra.plugin.core.log.Log
        description: Record the healthy count so quiet hours leave an auditable trail instead of an empty execution.
        message: "All clear, {{ outputs.count_recent_errors.total }} server errors in the last hour, below the threshold of {{ inputs.error_threshold }}."

errors:
  - id: alert_failure
    type: io.kestra.plugin.discord.DiscordIncomingWebhook
    description: Alert Discord whenever the execution fails, covering both a deliberate threshold breach and an unexpected search error.
    url: "{{ secret('DISCORD_WEBHOOK_URL') }}"
    payload: |
      {
        "content": "OpenSearch error spike gate finished RED in flow {{ flow.id }} (execution {{ execution.id }}). Either the 5xx threshold was crossed or the search itself failed, check the execution logs."
      }

triggers:
  - id: hourly
    type: io.kestra.plugin.core.trigger.Schedule
    description: Check the last hour of logs at the top of every hour.
    cron: "0 * * * *"
    disabled: true

extend:
  title: Hourly OpenSearch Error Spike Gate with Discord Alerting
  shortDescription: An hourly size-zero OpenSearch search counts 5xx documents, and an If gate alerts Discord and fails the execution when a threshold is crossed.
  metaTitle: OpenSearch Error Spike Gate with Kestra
  metaDescription: Gate on OpenSearch error counts with Kestra. Count 5xx logs hourly, alert Discord and fail the run above a threshold, log an all-clear below it.
  description: |
    A digest tells you what happened yesterday; a gate stops the line now. This blueprint runs an hourly `io.kestra.plugin.opensearch.Search` with `size: 0` counting documents with a 5xx status over the last hour, then branches with `io.kestra.plugin.core.flow.If`. Above the threshold, the flow posts the exact numbers to Discord and fails itself with `io.kestra.plugin.core.execution.Fail`, so the spike shows up as a red execution that downstream automation can react to. Below the threshold, it logs an all-clear and exits green.

    ## How it works

    1. `count_recent_errors` (`io.kestra.plugin.opensearch.Search`) filters the `app-logs` index to `status` between 500 and 599 with `@timestamp` newer than `now-1h`. With `size: 0`, only `{{ outputs.count_recent_errors.total }}` travels back.
    2. `gate` (`io.kestra.plugin.core.flow.If`) compares the total against the `error_threshold` input, which defaults to 50.
    3. On breach, `alert_spike` posts the count and threshold to Discord, then `fail_execution` (`io.kestra.plugin.core.execution.Fail`) turns the execution red on purpose.
    4. Below the threshold, `all_clear` (`io.kestra.plugin.core.log.Log`) records the healthy count.
    5. The `errors` block posts a Discord alert on any failure, covering both deliberate breaches and a broken search.
    6. A disabled-by-default `Schedule` trigger runs the gate at the top of every hour.

    ## What you get

    - An hourly health verdict computed inside OpenSearch, with zero documents transferred.
    - A deliberate red execution on breach, so flow-state triggers and dashboards see the incident.
    - The exact count and threshold in the Discord message, no login required to triage.
    - An auditable all-clear line for every quiet hour.

    ## Who it's for

    - SRE and platform teams who ship access or application logs to OpenSearch and want a cheap tripwire.
    - Teams whose incident automation keys off execution state rather than log dashboards.
    - Anyone tired of discovering error spikes from customer tickets instead of alerts.

    ## Why orchestrate this with Kestra

    Alerting rules inside a monitoring stack are opaque to the pipelines they protect. Declaring the gate as a flow makes the threshold an input you can override per run, the verdict an execution state other flows can subscribe to, and every check a logged, replayable execution. When the gate fires, the red run and the Discord message point at the same execution id.

    ## Prerequisites

    - An OpenSearch index of logs with a numeric `status` field and `@timestamp`, `app-logs` by default.
    - Credentials allowed to search that index.
    - A Discord incoming webhook for alerts.

    ### Secrets

    - `OPENSEARCH_HOST`: OpenSearch endpoint, for example https://opensearch.example.com:9200.
    - `OPENSEARCH_USERNAME`: OpenSearch username.
    - `OPENSEARCH_PASSWORD`: OpenSearch password.
    - `DISCORD_WEBHOOK_URL`: Discord incoming webhook URL.

    ## Quick start

    1. Add the four secrets to your Kestra namespace.
    2. Adjust the index name and the `status` field to your log schema, and pick a realistic `error_threshold` default.
    3. Execute the flow once manually with a low threshold to see the alert path, then once with a high one to see the all-clear.
    4. Set `disabled: false` on the `hourly` trigger.

    ## How to extend

    - Split the threshold into warn and page levels with a second `If` branch.
    - Scope the count to one service with an extra `term` filter and run one gate per critical service.
    - Trigger a remediation flow from this flow's FAILED state with a flow trigger.
    - Feed the count into the daily digest pattern from the OpenSearch log error digest blueprint.

    ## Links

    - [OpenSearch plugin documentation](https://kestra.io/plugins/plugin-opensearch)
    - [OpenSearch query DSL documentation](https://opensearch.org/docs/latest/query-dsl/)
  tags:
    - Data
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - Scheduling
  ee: false
  demo: false
