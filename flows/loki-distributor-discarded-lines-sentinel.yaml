id: loki-distributor-discarded-lines-sentinel
namespace: company.sentinel
description: Monitors Grafana Loki distributor metrics via Prometheus to catch rejected and discarded log lines caused by rate-limiting or timestamp boundaries.

inputs:
  - id: loki_metrics_url
    type: STRING
    defaults: http://loki.internal:3100/metrics
    description: Prometheus metrics endpoint for the Grafana Loki distributor service.
  - id: max_discarded_lines_threshold
    type: INT
    defaults: 100
    description: Maximum tolerated discarded ingress bytes before triggering an incident notification.

tasks:
  - id: audit_loki
    type: io.kestra.plugin.scripts.python.Script
    description: Scrapes Loki distributor metrics and evaluates discarded ingress byte counts.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests kestra
    env:
      LOKI_METRICS_URL: "{{ inputs.loki_metrics_url }}"
    script: |
      import os
      import sys
      import requests
      from kestra import Kestra

      url = os.environ.get("LOKI_METRICS_URL", "http://loki.internal:3100/metrics").strip()
      print(f"Scraping Loki distributor metrics from {url}...")

      try:
          resp = requests.get(url, timeout=15)
          resp.raise_for_status()
      except Exception as e:
          print(f"ERROR: Failed to fetch Loki distributor metrics from {url}: {e}", file=sys.stderr)
          sys.exit(1)

      discarded_bytes = 0
      bytes_received = 0

      for line in resp.text.splitlines():
          line = line.strip()
          if line.startswith("#") or not line:
              continue
          if "loki_discarded_bytes_total" in line:
              discarded_bytes = int(float(line.split()[-1]))
          elif "loki_distributor_bytes_received_total" in line:
              bytes_received = int(float(line.split()[-1]))

      print(f"Loki Distributor: Discarded Bytes={discarded_bytes}, Bytes Received={bytes_received}")

      Kestra.outputs({
          "discarded_bytes": discarded_bytes,
          "bytes_received": bytes_received
      })

  - id: evaluate_and_alert
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.audit_loki.vars.discarded_bytes > inputs.max_discarded_lines_threshold }}"
    then:
      - id: notify_slack
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          :warning: *Grafana Loki Discarded Ingress Bytes Spike*
          *Metrics URL:* {{ inputs.loki_metrics_url }}
          *Discarded Ingress Bytes:* {{ outputs.audit_loki.vars.discarded_bytes }}
          *Bytes Received:* {{ outputs.audit_loki.vars.bytes_received }}
          *Threshold:* {{ inputs.max_discarded_lines_threshold }}
          *Action:* Increase distributor ingestion burst limits or adjust tenant stream quotas.

outputs:
  - id: discarded_bytes
    type: INT
    value: "{{ outputs.audit_loki.vars.discarded_bytes }}"
  - id: bytes_received
    type: INT
    value: "{{ outputs.audit_loki.vars.bytes_received }}"

errors:
  - id: handle_inspection_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      :rotating_light: *Execution Failure: Grafana Loki Distributor Discarded Log Lines Sentinel*
      *Execution ID:* `{{ execution.id }}`
      *State:* `{{ execution.state.current }}`
      *Error:* Sentinel inspection encountered an unhandled execution error.

triggers:
  - id: scheduled_monitor
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"
    disabled: true

extend:
  metaDescription: "Monitors Grafana Loki distributor metrics via Prometheus to catch rejected and discarded log lines caused by rate-limiting."
  metaTitle: Grafana Loki Distributor Discarded Log Lines Sentinel with Kestra
  title: Grafana Loki Distributor Discarded Log Lines Sentinel
  shortDescription: Monitors Grafana Loki distributor metrics to detect rejected and discarded log lines.
  description: |
    Monitors Grafana Loki distributor Prometheus metrics to detect rate-limiting drop spikes and ingestion quota rejections before data loss occurs.
  tags:
    - Data
    - Infrastructure
