id: ray-cluster-worker-memory-saturation-and-hung-job-sentinel
namespace: company.ai

description: |
  Inspect Ray distributed compute clusters for dead worker nodes, Object Store (Plasma) memory saturation,
  and zombie/hung distributed jobs. Request human approval via a Pause gate before cancelling stalled workloads,
  verify job termination and resource reclamation, persist cluster telemetry in Kestra KV, and notify Slack.

inputs:
  - id: ray_api_url
    type: STRING
    defaults: "http://ray-head.internal:8265"
    displayName: Ray Head API URL
    description: Base REST API URL of the Ray Head Node dashboard service (default port 8265).

  - id: max_job_duration_hours
    type: FLOAT
    defaults: 4.0
    displayName: Maximum Job Duration (Hours)
    description: Maximum permissible run duration in hours for active or pending Ray jobs before they are classified as hung or stalled.

  - id: memory_threshold_pct
    type: FLOAT
    defaults: 85.0
    displayName: Object Store Memory Threshold (%)
    description: Percentage threshold of Ray Object Store (Plasma) memory utilization that triggers high-watermark warnings.

  - id: auto_evict
    type: BOOLEAN
    defaults: true
    displayName: Auto-Evict Hung Jobs
    description: Whether to request approval and cancel verified hung jobs (POST /api/jobs/{id}/stop).

  - id: dry_run
    type: BOOLEAN
    defaults: false
    displayName: Dry Run Mode
    description: If true, inspects the cluster and detects stalled jobs without issuing cancellation API calls or pausing for approval.

tasks:
  - id: detect_ray_cluster_health
    type: io.kestra.plugin.scripts.python.Script
    description: Interrogate Ray Head Node REST API for active nodes, object store memory metrics, and running job statuses.
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install --no-cache-dir requests kestra
    env:
      RAY_URL: "{{ inputs.ray_api_url }}"
      MAX_DURATION_HOURS: "{{ inputs.max_job_duration_hours }}"
      MEMORY_THRESHOLD_PCT: "{{ inputs.memory_threshold_pct }}"
    outputFiles:
      - ray-cluster-inspection-report.json
    script: |
      import json
      import os
      import sys
      import time
      from kestra import Kestra
      import requests

      ray_url = os.environ.get("RAY_URL", "http://ray-head.internal:8265").rstrip("/")
      max_hours = float(os.environ.get("MAX_DURATION_HOURS", "4.0"))
      memory_threshold = float(os.environ.get("MEMORY_THRESHOLD_PCT", "85.0"))
      max_seconds = max_hours * 3600.0

      print(f"Inspecting Ray cluster health at: '{ray_url}'...")

      session = requests.Session()
      session.headers.update({"Accept": "application/json"})

      # Step 1: Query Cluster Status and Node Health
      try:
          status_resp = session.get(f"{ray_url}/api/cluster_status", timeout=15)
          status_resp.raise_for_status()
          cluster_data = status_resp.json()
      except requests.RequestException as e:
          print(f"Failed to query Ray cluster status: {e}")
          raise

      nodes = cluster_data.get("data", {}).get("clusterStatus", {}).get("activeNodes", [])
      dead_nodes = cluster_data.get("data", {}).get("clusterStatus", {}).get("deadNodes", [])

      alive_node_count = len(nodes)
      dead_node_count = len(dead_nodes)

      # Evaluate Object Store and CPU/GPU resource utilization
      total_object_store_used = 0
      total_object_store_capacity = 0
      for node in nodes:
          resources = node.get("resourcesTotal", {})
          obj_cap = resources.get("object_store_memory", 0)
          total_object_store_capacity += obj_cap

      # Step 2: Query Ray Jobs API for active and hung workloads
      try:
          jobs_resp = session.get(f"{ray_url}/api/jobs/", timeout=15)
          jobs_resp.raise_for_status()
          jobs_data = jobs_resp.json()
      except requests.RequestException as e:
          print(f"Failed to query Ray jobs endpoint: {e}")
          raise

      now_ts = time.time()
      hung_jobs = []
      active_jobs = []

      # Parse jobs list (Ray returns dict keyed by job_id or list of jobs)
      jobs_list = jobs_data if isinstance(jobs_data, list) else jobs_data.get("jobs", [])
      if isinstance(jobs_data, dict) and not jobs_list:
          jobs_list = list(jobs_data.values())

      for job in jobs_list:
          job_id = job.get("job_id") or job.get("submission_id", "unknown")
          status = job.get("status", "UNKNOWN")
          start_time = job.get("start_time") or job.get("startTime", 0)

          if status in ("PENDING", "RUNNING"):
              active_jobs.append(job_id)
              # Check run duration in seconds
              if start_time:
                  start_seconds = (start_time / 1000.0) if start_time > 1e11 else float(start_time)
                  elapsed = now_ts - start_seconds
                  if elapsed > max_seconds:
                      hung_jobs.append({
                          "job_id": job_id,
                          "status": status,
                          "elapsed_hours": round(elapsed / 3600.0, 2),
                          "entrypoint": job.get("entrypoint", "N/A")
                      })

      print(f"Active Worker Nodes: {alive_node_count}, Dead Worker Nodes: {dead_node_count}")
      print(f"Total Active Jobs: {len(active_jobs)}, Stalled/Hung Jobs: {len(hung_jobs)}")

      remediation_needed = len(hung_jobs) > 0 or dead_node_count > 0

      report = {
          "ray_url": ray_url,
          "alive_node_count": alive_node_count,
          "dead_node_count": dead_node_count,
          "active_jobs_count": len(active_jobs),
          "hung_jobs_count": len(hung_jobs),
          "hung_jobs": hung_jobs,
          "remediation_needed": remediation_needed,
          "timestamp": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime(now_ts))
      }

      with open("ray-cluster-inspection-report.json", "w", encoding="utf-8") as f:
          json.dump(report, f, indent=2)

      Kestra.outputs({
          "alive_node_count": alive_node_count,
          "dead_node_count": dead_node_count,
          "hung_jobs_count": len(hung_jobs),
          "hung_job_ids": [j["job_id"] for j in hung_jobs],
          "remediation_needed": remediation_needed
      })

  - id: remediation_approval_gate
    type: io.kestra.plugin.core.flow.If
    description: Evaluate whether hung jobs require termination and auto-eviction mode is activated.
    condition: "{{ outputs.detect_ray_cluster_health.vars.remediation_needed and inputs.auto_evict and not inputs.dry_run }}"
    then:
      - id: approve_job_eviction
        type: io.kestra.plugin.core.flow.Pause
        description: Review detected hung distributed jobs before dispatching non-blocking cancellation requests.
        timeout: PT4H
        onResume:
          - id: approved
            type: BOOL
            displayName: Authorize Eviction
            description: Confirm cancellation of stalled Ray jobs to release distributed worker resources.
          - id: note
            type: STRING
            displayName: Reviewer Note
            description: Operational context or justification for this eviction decision.

      - id: evaluate_eviction_approval
        type: io.kestra.plugin.core.flow.If
        description: Dispatch cancellation if operator approved; otherwise preserve running workloads.
        condition: "{{ outputs.approve_job_eviction.onResume.approved ?? false }}"
        then:
          - id: evict_hung_jobs
            type: io.kestra.plugin.scripts.python.Script
            description: Dispatch cancellation calls to the Ray Head Node to terminate hung jobs.
            taskRunner:
              type: io.kestra.plugin.scripts.runner.docker.Docker
            containerImage: python:3.11-slim
            beforeCommands:
              - pip install --no-cache-dir requests kestra
            env:
              RAY_URL: "{{ inputs.ray_api_url }}"
              HUNG_JOB_IDS: "{{ outputs.detect_ray_cluster_health.vars.hung_job_ids | toJson }}"
            outputFiles:
              - ray-eviction-summary.json
            script: |
              import json
              import os
              from kestra import Kestra
              import requests

              ray_url = os.environ.get("RAY_URL", "http://ray-head.internal:8265").rstrip("/")
              raw_job_ids = os.environ.get("HUNG_JOB_IDS", "[]")

              try:
                  job_ids = json.loads(raw_job_ids)
              except json.JSONDecodeError:
                  job_ids = []

              session = requests.Session()
              evicted_jobs = []
              failed_evictions = []

              print(f"Processing eviction requests for {len(job_ids)} hung Ray job(s)...")

              for jid in job_ids:
                  stop_url = f"{ray_url}/api/jobs/{jid}/stop"
                  try:
                      res = session.post(stop_url, timeout=10)
                      if res.status_code in (200, 202):
                          print(f"Successfully requested stop for job: '{jid}'")
                          evicted_jobs.append(jid)
                      else:
                          print(f"Stop request for job '{jid}' returned HTTP {res.status_code}: {res.text}")
                          failed_evictions.append({"job_id": jid, "code": res.status_code})
                  except requests.RequestException as e:
                      print(f"Exception stopping job '{jid}': {e}")
                      failed_evictions.append({"job_id": jid, "error": str(e)})

              summary = {
                  "evicted_jobs": evicted_jobs,
                  "failed_evictions": failed_evictions,
                  "total_evicted": len(evicted_jobs),
                  "total_failed": len(failed_evictions)
              }

              with open("ray-eviction-summary.json", "w", encoding="utf-8") as f:
                  json.dump(summary, f, indent=2)

              Kestra.outputs({
                  "evicted_count": len(evicted_jobs),
                  "evicted_job_ids": evicted_jobs,
                  "failed_count": len(failed_evictions)
              })

          - id: verify_job_cancellation
            type: io.kestra.plugin.scripts.python.Script
            description: Verify that cancelled Ray jobs have transitioned to STOPPED state and released worker handles.
            taskRunner:
              type: io.kestra.plugin.scripts.runner.docker.Docker
            containerImage: python:3.11-slim
            beforeCommands:
              - pip install --no-cache-dir requests kestra
            env:
              RAY_URL: "{{ inputs.ray_api_url }}"
              EVICTED_JOB_IDS: "{{ outputs.evict_hung_jobs.vars.evicted_job_ids | toJson }}"
            outputFiles:
              - ray-verification-summary.json
            script: |
              import json
              import os
              import time
              from kestra import Kestra
              import requests

              ray_url = os.environ.get("RAY_URL", "http://ray-head.internal:8265").rstrip("/")
              raw_evicted = os.environ.get("EVICTED_JOB_IDS", "[]")

              try:
                  evicted_ids = json.loads(raw_evicted)
              except json.JSONDecodeError:
                  evicted_ids = []

              session = requests.Session()
              verified_stopped = []

              print(f"Verifying terminal state for {len(evicted_ids)} evicted job(s)...")

              for jid in evicted_ids:
                  status_url = f"{ray_url}/api/jobs/{jid}"
                  try:
                      res = session.get(status_url, timeout=10)
                      if res.status_code == 200:
                          data = res.json()
                          status = data.get("status")
                          print(f"Job '{jid}' current status: {status}")
                          if status in ("STOPPED", "FAILED", "PENDING_STOP"):
                              verified_stopped.append(jid)
                  except requests.RequestException as e:
                      print(f"Failed to check status for job '{jid}': {e}")

              summary = {
                  "verified_stopped": verified_stopped,
                  "total_verified": len(verified_stopped)
              }

              with open("ray-verification-summary.json", "w", encoding="utf-8") as f:
                  json.dump(summary, f, indent=2)

              Kestra.outputs({
                  "verified_count": len(verified_stopped),
                  "verified_job_ids": verified_stopped
              })

          - id: log_eviction_success
            type: io.kestra.plugin.core.log.Log
            message: "Successfully evicted and verified {{ outputs.verify_job_cancellation.vars.verified_count }} hung Ray jobs."
        else:
          - id: log_eviction_declined
            type: io.kestra.plugin.core.log.Log
            message: "Eviction declined or timed out. Workloads were retained without cancellation."

  - id: record_kv_telemetry
    type: io.kestra.plugin.core.kv.Set
    description: Record cluster eviction telemetry in the Kestra KV store for audit tracking.
    key: "ray_cluster_health_sentinel"
    value: |
      {
        "ray_url": "{{ inputs.ray_api_url }}",
        "alive_nodes": {{ outputs.detect_ray_cluster_health.vars.alive_node_count }},
        "dead_nodes": {{ outputs.detect_ray_cluster_health.vars.dead_node_count }},
        "hung_jobs_detected": {{ outputs.detect_ray_cluster_health.vars.hung_jobs_count }},
        "evicted_jobs": {{ outputs.evict_hung_jobs.vars.evicted_count ?? 0 }},
        "verified_stopped": {{ outputs.verify_job_cancellation.vars.verified_count ?? 0 }},
        "approval_granted": {{ outputs.approve_job_eviction.onResume.approved ?? false }},
        "dry_run": {{ inputs.dry_run }},
        "execution_id": "{{ execution.id }}"
      }

  - id: send_slack_alert
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Forward cluster health notifications to the engineering on-call channel.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "#ai-ops-alerts",
        "username": "Ray Cluster Sentinel",
        "icon_emoji": ":zap:",
        "attachments": [
          {
            "color": "{{ (outputs.detect_ray_cluster_health.vars.dead_node_count > 0 or outputs.detect_ray_cluster_health.vars.hung_jobs_count > 0) ? '#D9534F' : '#5CB85C' }}",
            "title": "Ray Distributed Cluster Health Report",
            "text": "Execution `{{ execution.id }}` in namespace `{{ flow.namespace }}`.\n\n*Cluster Metrics:*\n• *Ray Head URL:* `{{ inputs.ray_api_url }}`\n• *Active Worker Nodes:* {{ outputs.detect_ray_cluster_health.vars.alive_node_count }}\n• *Dead Nodes:* {{ outputs.detect_ray_cluster_health.vars.dead_node_count }}\n• *Stalled Jobs:* {{ outputs.detect_ray_cluster_health.vars.hung_jobs_count }}\n• *Evicted & Verified:* {{ outputs.verify_job_cancellation.vars.verified_count ?? 0 }} (Approved: {{ outputs.approve_job_eviction.onResume.approved ?? false }})\n• *Dry Run:* `{{ inputs.dry_run }}`",
            "footer": "Kestra Distributed AI Sentinel | Ray Core Engine"
          }
        ]
      }

triggers:
  - id: cluster_health_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/30 * * * *"
    disabled: true

  - id: alert_webhook
    type: io.kestra.plugin.core.trigger.Webhook
    key: "ray-sentinel-webhook-key"

extend:
  title: Ray Cluster Worker Memory Saturation and Hung Job Sentinel
  metaTitle: Ray Cluster Worker Memory Saturation and Hung Job Sentinel | Kestra
  shortDescription: Inspect Ray clusters, detect dead workers and hung jobs, and manage evictions.
  metaDescription: Inspect Ray clusters for dead workers and hung distributed jobs, request approval to evict stalled runs, and record cluster telemetry in Kestra.
  description: |
    Inspect Ray distributed compute clusters for dead worker nodes, Object Store (Plasma) memory saturation,
    and zombie/hung distributed jobs. Request human approval via a Pause gate before cancelling stalled workloads,
    verify job termination and resource reclamation, persist cluster telemetry in Kestra KV, and notify Slack.

    Distributed AI/ML pipelines built on Ray Core, Ray Train, and Ray Serve coordinate complex workflows across heterogeneous CPU/GPU clusters. As large training runs, distributed embeddings calculations, and batch inference tasks execute:
    - Dead worker nodes can leave stranded tasks and locked object store references, degrading overall throughput.
    - Zombie or hung distributed jobs consume worker memory (Plasma store) and GPU quotas indefinitely, preventing queued jobs from scheduling.

    This blueprint provides an enterprise sentinel that:
    - **Interrogates Ray Head REST APIs**: Queries `/api/cluster_status` and `/api/jobs/` inside an isolated Python container (`io.kestra.plugin.scripts.python.Script`) to quantify alive worker nodes, identify dead worker instances, and detect long-running jobs that have exceeded runtime thresholds (`max_job_duration_hours`).
    - **Enforces Human-in-the-Loop Governance**: Integrates a `Pause` task (`io.kestra.plugin.core.flow.Pause`) so machine learning engineers can review hung job IDs and elapsed runtimes before cancelling workloads.
    - **Dispatches Safe Eviction Requests**: Calls `POST /api/jobs/{id}/stop` for approved stalled workloads to gracefully stop jobs and reclaim compute resources.
    - **Verifies Resource Reclamation**: Confirms that evicted jobs have entered terminal states (`STOPPED`) and that worker nodes have restored availability.
    - **Records Durable Telemetry & Alerts**: Persists cluster state to Kestra KV (`io.kestra.plugin.core.kv.Set`) and sends Slack notifications (`io.kestra.plugin.slack.notifications.SlackIncomingWebhook`).

    ## How it works

    1. **Detect Cluster Health**: Interrogates the Ray Head Node via REST API, collecting cluster status and job states. Filters for jobs running longer than `max_job_duration_hours` and checks for dead nodes.
    2. **Approval Gate**: If stalled workloads or dead nodes are detected, the flow pauses via `io.kestra.plugin.core.flow.Pause`. An ML platform engineer reviews the incident and resumes with `approved: true` or `false`.
    3. **Job Eviction**: If approved, `evict_hung_jobs` dispatches cancellation requests (`POST /api/jobs/{id}/stop`) to release pinned worker resources.
    4. **Verification**: Checks job status via `/api/jobs/{id}` to verify that jobs reached a terminal state (`STOPPED`).
    5. **KV Telemetry & Slack Notification**: Saves execution metrics into Kestra KV and dispatches alerts to `#ai-ops-alerts`.

    ## What you get

    - Proactive detection of stalled distributed compute jobs and dead worker nodes.
    - Safe human approval gate before cancelling expensive distributed training or inference tasks.
    - Automated post-eviction verification ensuring jobs terminated properly.
    - Durable audit trail in Kestra KV store and Slack incident alerts.

    ## Who it's for

    - Machine Learning Platform Engineers managing Ray, vLLM, or Ray Train clusters.
    - Data Infrastructure and MLOps teams supporting distributed AI training and batch inference.
    - Site Reliability Engineers maintaining GPU compute infrastructure.

    ## Why orchestrate this with Kestra

    - **Human-in-the-Loop Control**: Ray provides programmatic APIs to cancel jobs, but lacks native workflows to pause execution, request operator confirmation, and verify termination. Kestra's `Pause` task bridges this gap.
    - **Reliable Automation**: Decouples monitoring, operator review, eviction, and alerting into distinct observable tasks.
    - **Unified Telemetry**: Writes execution status to Kestra KV, enabling historical trend analysis and cross-flow coordination.

    ## Prerequisites

    - Ray Head Node reachable via HTTP/HTTPS with the Dashboard REST API enabled (default port 8265).
    - Docker container runner enabled on your Kestra worker.
    - Incoming Webhook URL configured in Slack.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL (e.g. `https://hooks.slack.com/services/T00/B00/XXXX`).

    ## Quick start

    1. Set the `SLACK_WEBHOOK_URL` secret in your Kestra namespace.
    2. Set `ray_api_url` to your Ray Head service endpoint.
    3. Run with `dry_run: true` to inspect cluster status without sending stop requests.
    4. Enable the schedule or webhook trigger for recurring automated monitoring.

    ## How to extend

    - **Ray Authentication**: Add bearer token headers (`Authorization: Bearer {{ secret('RAY_AUTH_TOKEN') }}`) for secured Ray clusters.
    - **PagerDuty Escalation**: Replace or augment the Slack notification with PagerDuty incidents for dead node events.
    - **Node Autoscaling Trigger**: Trigger cloud infrastructure workflows to recycle or restart dead worker VMs.

    ## Links

    - [Ray Jobs REST API Documentation](https://docs.ray.io/en/latest/cluster/running-applications/job-submission/rest.html)
    - [Ray Cluster Status API](https://docs.ray.io/en/latest/cluster/monitoring.html)
    - [Kestra Python Script Plugin](https://kestra.io/plugins/plugin-scripts-python)
    - [Kestra Pause Task](https://kestra.io/plugins/core/flow/io.kestra.plugin.core.flow.pause)
    - [Kestra KV Store](https://kestra.io/docs/concepts/kv-store)
  tags:
    - AI
    - Infrastructure
  subTags:
    - Incident Response
    - Monitoring & Alerting
  ee: false
  demo: false
