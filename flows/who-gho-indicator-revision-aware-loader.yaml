id: who-gho-indicator-revision-aware-loader
namespace: company.health

inputs:
  - id: indicator_code
    type: STRING
    defaults: "WHOSIS_000001"
    description: "WHO Global Health Observatory indicator code (e.g., WHOSIS_000001 for Life expectancy at birth, WHS4_100 for Measles immunization coverage)."

  - id: revision_tolerance_pct
    type: FLOAT
    defaults: 0.05
    description: "Relative revision tolerance threshold (0.05 = 5% relative change) to trigger a Slack notification."

triggers:
  - id: weekly_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 8 * * 2"
    disabled: true

tasks:
  - id: fetch_indicator
    type: io.kestra.plugin.core.http.Download
    uri: "https://ghoapi.azureedge.net/api/{{ inputs.indicator_code }}"
    description: "Fetches official indicator observations for all member states from the WHO GHO Athena REST API."

  - id: previous_values
    type: io.kestra.plugin.core.kv.Get
    key: "who_values_{{ inputs.indicator_code }}"
    errorOnMissing: false
    description: "Retrieves the URI of the previously accepted Parquet file for this indicator from Kestra KV store."

  - id: bootstrap_history
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.previous_values.value is null }}"
    description: "Initializes an empty baseline Parquet file with the expected schema when executing for the first time."
    then:
      - id: create_empty_history
        type: io.kestra.plugin.jdbc.duckdb.Queries
        outputFiles:
          - empty_baseline.parquet
        sql: |
          CREATE TABLE empty_baseline (
            country_code VARCHAR,
            year INTEGER,
            dimension VARCHAR,
            numeric_value DOUBLE,
            low_bound DOUBLE,
            high_bound DOUBLE,
            last_updated VARCHAR
          );
          COPY empty_baseline TO 'empty_baseline.parquet' (FORMAT PARQUET);

  - id: diff_and_load
    type: io.kestra.plugin.jdbc.duckdb.Queries
    fetchType: FETCH_ONE
    description: "Parses API JSON observations, extracts country-level observations, joins against baseline, and writes Parquet and CSV outputs."
    inputFiles:
      indicator.json: "{{ outputs.fetch_indicator.uri }}"
      prev_values.parquet: "{{ outputs.previous_values.value ?? outputs.bootstrap_history.create_empty_history.outputFiles['empty_baseline.parquet'] }}"
    outputFiles:
      - latest_who_values.parquet
      - who_revision_log.parquet
      - who_delta_summary.csv
    sql: |
      -- 1. Ingest from raw JSON
      CREATE TABLE raw_who AS
      SELECT 
          item.SpatialDim AS country_code,
          CAST(item.TimeDim AS INTEGER) AS year,
          COALESCE(item.Dim1, 'TOTAL') AS dimension,
          CAST(item.NumericValue AS DOUBLE) AS numeric_value,
          CAST(item.Low AS DOUBLE) AS low_bound,
          CAST(item.High AS DOUBLE) AS high_bound,
          item.Date AS last_updated
      FROM (
          SELECT unnest(value) AS item
          FROM read_json('indicator.json')
      ) t
      WHERE item.SpatialDimType = 'COUNTRY' 
        AND item.NumericValue IS NOT NULL;

      -- 2. Extract latest record per country + year + dimension
      CREATE TABLE latest_curr AS
      WITH ranked AS (
          SELECT 
              country_code,
              year,
              dimension,
              numeric_value,
              low_bound,
              high_bound,
              last_updated,
              ROW_NUMBER() OVER (PARTITION BY country_code, year, dimension ORDER BY last_updated DESC) as rn
          FROM raw_who
      )
      SELECT 
          country_code,
          year,
          dimension,
          numeric_value,
          low_bound,
          high_bound,
          last_updated
      FROM ranked
      WHERE rn = 1;

      -- 3. Read previous baseline
      CREATE TABLE prev_state AS
      SELECT * FROM read_parquet('prev_values.parquet');

      -- 4. Diff calculation
      CREATE TABLE diff_results AS
      SELECT 
          c.country_code,
          c.year,
          c.dimension,
          c.numeric_value AS current_value,
          p.numeric_value AS previous_value,
          CASE 
              WHEN p.numeric_value IS NULL THEN 'NEW'
              WHEN c.numeric_value <> p.numeric_value THEN 'REVISED'
              ELSE 'UNCHANGED'
          END AS change_type,
          CASE 
              WHEN p.numeric_value IS NOT NULL AND p.numeric_value <> 0
              THEN ROUND(ABS(c.numeric_value - p.numeric_value) / p.numeric_value, 4)
              ELSE 0.0
          END AS rel_change,
          c.last_updated
      FROM latest_curr c
      LEFT JOIN prev_state p 
          ON c.country_code = p.country_code 
         AND c.year = p.year 
         AND c.dimension = p.dimension;

      -- 5. Export output files
      COPY (SELECT * FROM latest_curr ORDER BY country_code, year, dimension) 
      TO 'latest_who_values.parquet' (FORMAT PARQUET);

      COPY (SELECT * FROM raw_who ORDER BY country_code, year, dimension) 
      TO 'who_revision_log.parquet' (FORMAT PARQUET);

      COPY (SELECT * FROM diff_results ORDER BY rel_change DESC) 
      TO 'who_delta_summary.csv' (FORMAT CSV, HEADER);

      -- 6. Summary row
      SELECT 
          COUNT(*)::INTEGER AS total_observations,
          COUNT(CASE WHEN change_type = 'REVISED' AND rel_change >= {{ inputs.revision_tolerance_pct }} THEN 1 END)::INTEGER AS material_revisions_count,
          COALESCE(MAX(rel_change), 0.0) AS max_relative_change,
          COALESCE(MAX(country_code), 'None') AS top_country,
          COALESCE(MAX(year), 0)::INTEGER AS latest_year
      FROM diff_results;

  - id: save_values_kv
    type: io.kestra.plugin.core.kv.Set
    key: "who_values_{{ inputs.indicator_code }}"
    value: "{{ outputs.diff_and_load.outputFiles['latest_who_values.parquet'] }}"
    description: "Updates Kestra KV store with the URI of the newly accepted Parquet file for this indicator."

  - id: alert_on_material_revisions
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.diff_and_load.row.material_revisions_count > 0 }}"
    description: "Sends an alert to Slack when historical indicator observations are restated beyond configured tolerance."
    then:
      - id: slack_alert
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        allowFailure: true
        payload: |
          {
            "text": ":warning: *WHO Indicator Material Revision Alert* | Execution `{{ execution.id }}`\n*Indicator*: `{{ inputs.indicator_code }}`\n*Material Revisions*: `{{ outputs.diff_and_load.row.material_revisions_count }}` country observations shifted by >= {{ inputs.revision_tolerance_pct }}\n*Max Relative Change*: `{{ outputs.diff_and_load.row.max_relative_change }}`\n*Output Parquet*: `{{ outputs.diff_and_load.outputFiles['latest_who_values.parquet'] }}`"
          }
    else:
      - id: log_no_material_revision
        type: io.kestra.plugin.core.log.Log
        message: "WHO indicator {{ inputs.indicator_code }} sync complete: {{ outputs.diff_and_load.row.total_observations }} observations processed. 0 material revisions exceeded {{ inputs.revision_tolerance_pct }} tolerance."

  - id: summary_log
    type: io.kestra.plugin.core.log.Log
    message: "Execution summary: Total observations={{ outputs.diff_and_load.row.total_observations }}, Material revisions={{ outputs.diff_and_load.row.material_revisions_count }}, Max change={{ outputs.diff_and_load.row.max_relative_change }}."

outputs:
  - id: latest_values_parquet
    type: STRING
    value: "{{ outputs.diff_and_load.outputFiles['latest_who_values.parquet'] }}"
    description: "URI of the latest accepted country indicator values in internal storage."

  - id: revision_log_parquet
    type: STRING
    value: "{{ outputs.diff_and_load.outputFiles['who_revision_log.parquet'] }}"
    description: "URI of the historical indicator revision time-series Parquet dataset."

  - id: delta_summary_csv
    type: STRING
    value: "{{ outputs.diff_and_load.outputFiles['who_delta_summary.csv'] }}"
    description: "CSV summary of all country observations and relative differences for this run."

  - id: summary
    type: JSON
    value: "{{ outputs.diff_and_load.row }}"
    description: "Structured execution summary metrics."

extend:
  title: Load World Health Organization Indicators with DuckDB and Detect Epidemiological Revisions
  metaTitle: WHO Indicator Revision-Aware Loader with DuckDB and Parquet | Kestra
  shortDescription: Ingest official World Health Organization Global Health Observatory indicators for all member states, diff against previous vintages in DuckDB, log new and revised figures to Parquet in internal storage, and alert in Slack on significant revisions.
  metaDescription: Load WHO health indicators, diff against historical vintages in DuckDB, export partitioned Parquet to internal storage and alert on material revisions.
  description: |
    The World Health Organization (WHO) periodically revises published epidemiological time-series as member states audit historical death registries, calibrate demographic projections, and update immunization reporting. Downstream health surveillance pipelines, biostatistical models, and healthcare capacity dashboards that only append new periods or blindly overwrite historical data will miss material revisions or produce silent metric drift.

    This flow automates the ingestion of any WHO Global Health Observatory (GHO) indicator, diffs the entire historical series against the accepted baseline using embedded DuckDB, maintains clean columnar Parquet state in Kestra internal storage across runs via KV store, and triggers targeted Slack alerts when published figures experience significant restatements.

    ## How it works

    1. A weekly `Schedule` trigger is configured for Tuesday at 08:00 UTC, aligning with regular weekly update cycles published by international health agencies.
    2. `fetch_indicator` (`io.kestra.plugin.core.http.Download`) queries the WHO GHO Athena OData API (`ghoapi.azureedge.net/api/{indicator}`) for the complete observation payload, landing the raw JSON directly in Kestra internal storage.
    3. `previous_values` (`io.kestra.plugin.core.kv.Get`, with `errorOnMissing: false`) looks up the internal storage URI of the Parquet dataset accepted during the prior run.
    4. `bootstrap_history` (`io.kestra.plugin.core.flow.If`) executes only on the initial run when no prior state exists in KV store, generating an empty baseline Parquet file with identical column schemas so downstream diff queries share a single deterministic execution path.
    5. `diff_and_load` (`io.kestra.plugin.jdbc.duckdb.Queries`, with `fetchType: FETCH_ONE`) ingests the JSON payload via `read_json` and `unnest`, filters for member state records (`SpatialDimType = 'COUNTRY'`), selects the latest reported timestamp per country and demographic dimension, and executes a full join against the baseline Parquet dataset. It classifies observations (`NEW`, `REVISED`, `UNCHANGED`), computes relative differences (`ABS(current - previous) / previous`), and generates three persistent output files:
       - `latest_who_values.parquet`: The current verified snapshot across all countries and demographic groups.
       - `who_revision_log.parquet`: A multi-vintage historical dataset capturing retrospective restatements.
       - `who_delta_summary.csv`: Tabular difference report sorted by relative variance.
    6. `save_values_kv` (`io.kestra.plugin.core.kv.Set`) persists the URI of `latest_who_values.parquet` under the dynamic key `who_values_{{ inputs.indicator_code }}`.
    7. `alert_on_material_revisions` (`io.kestra.plugin.core.flow.If`) evaluates the count of revisions exceeding the configured relative tolerance (`inputs.revision_tolerance_pct`). If breaches are detected, it notifies engineering and public health teams via `io.kestra.plugin.slack.notifications.SlackIncomingWebhook`. With `allowFailure: true`, missing webhook secrets issue a non-fatal warning without failing the data load.
    8. `summary_log` records execution telemetry, and the root `outputs` expose the Parquet datasets and summary JSON for downstream consumers.

    ## What you get

    - A clean columnar Parquet file of the latest country-level health metrics ready for querying with DuckDB, ClickHouse, or Spark.
    - An append-only historical revision log tracking retrospective adjustments across global health indicators.
    - An execution CSV detailing country-level deltas and relative percentage movements.
    - Automated Slack alerting when sovereign health metrics experience unexpected restatements.
    - Zero external database requirements: state and storage live entirely inside Kestra internal storage and native KV store.

    ## Who it's for

    - Public health data engineers maintaining international disease surveillance and immunization pipelines.
    - Healthcare analytics teams tracking global life expectancy, maternal health, and mortality indicators.
    - Epidemiologists requiring explicit provenance and vintage tracking for published health statistics.

    ## Why orchestrate this with Kestra

    - `Download` and `inputFiles` transport JSON payloads directly into DuckDB without custom Docker containers or intermediate Python scripts.
    - Native `outputFiles` and KV Store maintain Parquet state across executions declaratively without managing an external state database.
    - Dynamic inputs (`indicator_code`, `revision_tolerance_pct`) allow a single flow definition to track hundreds of different WHO indicators under isolated KV keys.
    - Declarative alerting (`If` plus `allowFailure`) decouples data landing from notification delivery.

    ## Prerequisites

    - Kestra 2.0 or later with the DuckDB JDBC plugin (`io.kestra.plugin.jdbc.duckdb.Queries`) and notifications plugin (`io.kestra.plugin.slack.notifications.SlackIncomingWebhook`).
    - Outbound HTTPS network access to `ghoapi.azureedge.net`. The WHO GHO Athena API is public and requires no API key.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Optional Slack incoming webhook URI for receiving material revision alerts.

    ## Quick start

    1. Import this blueprint into your Kestra instance and trigger an ad-hoc execution with default parameters (`WHOSIS_000001` for Life expectancy at birth).
    2. Inspect execution outputs to view `latest_who_values.parquet` and the summary metrics. The first run acts as a baseline.
    3. Trigger a second execution: all records will be classified as `UNCHANGED`, and alerting will be skipped.
    4. Provide the `SLACK_WEBHOOK_URL` secret and enable the weekly `Schedule` trigger to receive automatic alerts when the WHO releases retrospective revisions.
    5. Pass any other valid GHO indicator code (e.g., `WHS4_100` for Measles immunization, `MDG_0000000001` for Under-five mortality rate); each maintains its own independent state.

    ## How to extend

    - Ingest several indicators in parallel by executing this flow as a `Subflow` inside a parent `ForEach` task.
    - Append accepted observations to a cloud data warehouse (BigQuery, Snowflake, Redshift) using Kestra warehouse plugins.
    - Export generated Parquet datasets directly to an S3 or GCS data lake bucket with `io.kestra.plugin.aws.s3.Upload`.

