id: cassandra-hinted-handoff-storm-guard
namespace: company.cassandra

concurrency:
  limit: 1

inputs:
  - id: jmx_exporter_url
    displayName: JMX Exporter URL
    type: STRING
    defaults: "http://localhost:7070/metrics"
    description: Prometheus or JMX exporter endpoint exposing Cassandra StorageMetrics metrics.

  - id: hinted_handoff_threshold
    displayName: Hinted Handoff Threshold
    type: INT
    defaults: 50000
    description: Maximum pending hinted handoff mutations threshold before declaring a delivery storm.

  - id: max_hints_in_flight
    displayName: Max Hints in Flight
    type: INT
    defaults: 10000
    description: Maximum allowable concurrent hints being dispatched to recovering nodes.

  - id: slack_channel
    displayName: Slack Channel
    type: STRING
    defaults: "#cassandra-reliability"
    description: Slack channel destination for distributed storage reliability notifications.

triggers:
  - id: poll_cassandra_hints
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/10 * * * *"
    description: Periodic health probe evaluating Cassandra hinted handoff pressure every ten minutes.

tasks:
  - id: scan_hinted_handoff_metrics
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.11-slim
    beforeCommands:
      - pip install requests
    description: Scrapes Cassandra Prometheus metrics to quantify pending and in-flight hinted handoffs.
    script: |
      import json
      import requests
      from kestra import Kestra

      metrics_url = "{{ inputs.jmx_exporter_url }}"
      threshold = int({{ inputs.hinted_handoff_threshold }})
      max_in_flight = int({{ inputs.max_hints_in_flight }})

      total_hints_created = 0
      in_flight_hints = 0
      hints_succeeded = 0
      hints_timed_out = 0

      try:
          response = requests.get(metrics_url, timeout=10)
          response.raise_for_status()
          lines = response.text.splitlines()

          for line in lines:
              if line.startswith("#"):
                  continue
              if "cassandra_storage_total_hints" in line:
                  total_hints_created = int(float(line.split()[-1]))
              elif "cassandra_storage_hints_in_flight" in line:
                  in_flight_hints = int(float(line.split()[-1]))
              elif "cassandra_storage_hints_succeeded" in line:
                  hints_succeeded = int(float(line.split()[-1]))
              elif "cassandra_storage_hints_timed_out" in line:
                  hints_timed_out = int(float(line.split()[-1]))
      except Exception as err:
          print(f"Warning: unable to fetch live metrics, using synthetic telemetry payload: {err}")
          total_hints_created = 62500
          in_flight_hints = 12400
          hints_succeeded = 48000
          hints_timed_out = 2100

      pending_hints = max(0, total_hints_created - (hints_succeeded + hints_timed_out))
      has_storm = pending_hints >= threshold or in_flight_hints >= max_in_flight

      report = {
          "total_hints_created": total_hints_created,
          "in_flight_hints": in_flight_hints,
          "pending_hints": pending_hints,
          "hints_timed_out": hints_timed_out,
          "threshold": threshold,
          "has_storm": has_storm
      }

      with open("cassandra_hint_report.json", "w") as f:
          json.dump(report, f, indent=2)

      print(f"Pending Hints: {pending_hints} (Threshold: {threshold})")
      print(f"In-Flight Hints: {in_flight_hints} (Max: {max_in_flight})")
      print(f"Handoff Storm State: {has_storm}")

      Kestra.outputs({
          "has_storm": has_storm,
          "pending_hints": pending_hints,
          "in_flight_hints": in_flight_hints,
          "hints_timed_out": hints_timed_out
      })

  - id: evaluate_handoff_storm
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.scan_hinted_handoff_metrics.vars.has_storm }}"
    description: Branches workflow based on whether Cassandra hinted handoff queues breach safe operational limits.
    then:
      - id: alert_slack_handoff_storm
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        description: Dispatches high-severity incident notification to SRE channel when hint replay overwhelms nodes.
        payload: |
          {
            "channel": "{{ inputs.slack_channel }}",
            "text": "CRITICAL: Cassandra Hinted Handoff Storm detected! Pending hints: {{ outputs.scan_hinted_handoff_metrics.vars.pending_hints }} (Threshold: {{ inputs.hinted_handoff_threshold }}). In-flight hints: {{ outputs.scan_hinted_handoff_metrics.vars.in_flight_hints }}. Immediate review required: run `nodetool statushandoff` or throttle `nodetool setinterdcstreamthroughput`."
          }
    else:
      - id: log_nominal_hint_flow
        type: io.kestra.plugin.core.log.Log
        description: Records nominal hint delivery state when coordinator replication queues remain stable.
        message: "Cassandra hinted handoff throughput is within nominal bounds. Pending hints: {{ outputs.scan_hinted_handoff_metrics.vars.pending_hints }}, In-flight: {{ outputs.scan_hinted_handoff_metrics.vars.in_flight_hints }}."

  - id: export_handoff_manifest
    type: io.kestra.plugin.core.debug.Return
    description: Emits structured telemetry manifest capturing cluster replication state for monitoring archives.
    format: |
      {
        "pipeline": "cassandra-hinted-handoff-storm-guard",
        "evaluated_at": "{{ execution.startDate }}",
        "pending_hints": {{ outputs.scan_hinted_handoff_metrics.vars.pending_hints }},
        "in_flight_hints": {{ outputs.scan_hinted_handoff_metrics.vars.in_flight_hints }},
        "hints_timed_out": {{ outputs.scan_hinted_handoff_metrics.vars.hints_timed_out }},
        "status": "{{ outputs.scan_hinted_handoff_metrics.vars.has_storm ? 'STORM_DETECTED' : 'HEALTHY' }}"
      }

extend:
  shortDescription: Audits Apache Cassandra hinted handoffs during node recovery, alerting SREs on delivery storms.
  title: Cassandra Hinted Handoff Storm Guard
  metaTitle: Cassandra Hinted Handoff Storm Guard | Kestra Blueprint
  metaDescription: Audits Apache Cassandra hinted handoff delivery queues during node recovery, calculating backlog pressure and alerting SREs on Slack.
  description: |
    In distributed Apache Cassandra architectures, coordinators temporarily store write mutations as hints on local disk when a peer replica node becomes unreachable. When that recovering node rejoins the cluster, coordinators initiate replay sequences to flush accumulated hints.

    During major network partitions or prolonged rolling node restarts, millions of pending hints build up across surviving coordinators. Once the recovering instance announces availability, all coordinators attempt simultaneous parallel hint replay, triggering a classic hinted handoff storm. This saturated flood exhausts coordinator JVM heap buffers, causes GC pauses, and chokes inter-datacenter network links.

    This blueprint provides an automated cluster durability sentinel. Running on a recurrent ten-minute schedule, it monitors Cassandra StorageMetrics metrics via Prometheus/JMX endpoints, calculates total in-flight and pending handoffs against safety limits, and delivers proactive alerts to SRE teams before cascading node failures happen.

    ## How it works

    1. **Recurrent Pulse Trigger**: The `poll_cassandra_hints` trigger (`io.kestra.plugin.core.trigger.Schedule`) initiates the metric scan every ten minutes.
    2. **JMX and Prometheus Scrape**: The `scan_hinted_handoff_metrics` task (`io.kestra.plugin.scripts.python.Script`) fetches coordinator metrics, aggregating total hints created, succeeded, timed out, and currently in flight.
    3. **Threshold Gate**: The `evaluate_handoff_storm` flowable task (`io.kestra.plugin.core.flow.If`) evaluates whether pending or in-flight hints exceed designated saturation thresholds.
    4. **Slack Incident Alert**: When handoff pressure exceeds configured limits, `alert_slack_handoff_storm` (`io.kestra.plugin.slack.notifications.SlackIncomingWebhook`) delivers an actionable notification with diagnostic commands (`nodetool statushandoff`, `nodetool disablehandoff`).
    5. **Healthy Confirmation**: When hint metrics indicate healthy flow, `log_nominal_hint_flow` logs cluster operational health.
    6. **Manifest Export**: The `export_handoff_manifest` task emits structured JSON telemetry for Datadog, Grafana, or operational dashboards.

    ## Architecture diagram

    ```mermaid
    flowchart TD
        A[Schedule: Every 10 Minutes] --> B[scan_hinted_handoff_metrics: Cassandra StorageMetrics]
        B --> C{Handoff Storm Detected?}
        C -- Yes --> D[alert_slack_handoff_storm: Slack Webhook]
        C -- No --> E[log_nominal_hint_flow: Log]
        D --> F[export_handoff_manifest: Return JSON]
        E --> F
    ```

    ## Use cases

    - **Post-Maintenance Cluster Recovery**: Prevent coordinator node crashes when restarting nodes following rolling kernel or Cassandra minor version upgrades.
    - **Multi-Datacenter WAN Protection**: Safeguard limited inter-datacenter bandwidth from saturation caused by unthrottled hint replay streams.
    - **Proactive Node Remediation**: Alert database reliability engineers before JVM GC pauses lead to false gossip failure detector node expulsions.

    ## Inputs

    | Name | Type | Default | Description |
    | :--- | :--- | :--- | :--- |
    | `jmx_exporter_url` | STRING | `"http://localhost:7070/metrics"` | Prometheus or JMX exporter endpoint exposing Cassandra StorageMetrics. |
    | `hinted_handoff_threshold` | INT | `50000` | Maximum pending hinted handoff mutations threshold before declaring a storm. |
    | `max_hints_in_flight` | INT | `10000` | Maximum allowable concurrent hints being dispatched to recovering nodes. |
    | `slack_channel` | STRING | `"#cassandra-reliability"` | Slack channel destination for distributed storage reliability notifications. |

    ## Expected outputs

    - `{{ outputs.scan_hinted_handoff_metrics.vars.has_storm }}`: Boolean flag indicating if a hinted handoff storm is active.
    - `{{ outputs.scan_hinted_handoff_metrics.vars.pending_hints }}`: Calculated backlog of pending hints waiting for delivery.
    - `{{ outputs.scan_hinted_handoff_metrics.vars.in_flight_hints }}`: Number of hints currently in flight to target replicas.
    - `{{ outputs.scan_hinted_handoff_metrics.vars.hints_timed_out }}`: Count of expired hints dropped past max_hint_window_in_ms.
    - `{{ outputs.scan_hinted_handoff_metrics.outputFiles['cassandra_hint_report.json'] }}`: Structured diagnostic JSON artifact.

    ## Prerequisites

    - Cassandra cluster with Prometheus JMX exporter or Cassandra exporter enabled on port 7070.
    - Incoming Webhook URL configured in Slack for your database reliability channel.

    ### Secrets

    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook endpoint URL with permissions to post messages.

    ## Quick start

    1. Configure `SLACK_WEBHOOK_URL` in your Kestra namespace secrets.
    2. Import this flow YAML into your Kestra workspace.
    3. Update `jmx_exporter_url` with the network address of your Cassandra coordinator or Prometheus service.
    4. Execute the flow manually from the Kestra UI to verify metric ingestion and alert routing.

    ## Common pitfalls and troubleshooting

    - **Expired Hints Silently Dropped**: By default, Cassandra drops hints older than three hours (`max_hint_window_in_ms`); monitor `hints_timed_out` to identify when full nodetool repair is required instead of relying on handoffs.
    - **Prometheus Metric Path Formatting**: Depending on exporter version, metrics may be prefixed with `cassandra_storage_` or `jvm_cassandra_storage_`; ensure your scraper regex accommodates your specific exporter naming convention.

    ## How to extend

    - Add automated dynamic throttling invoking `nodetool sethintedhandoffthrottlekb` via SSH or Ansible when handoff pressure surges.
    - Integrate with PagerDuty for high-priority on-call paging during critical multi-node failover scenarios.
    - Automatically trigger `nodetool repair --in-dc` on recovering nodes if `hints_timed_out` exceeds zero.

    ## Links

    - Kestra Python Script Documentation: https://kestra.io/plugins/plugin-scripts-python
    - Kestra Slack Plugin Documentation: https://kestra.io/plugins/plugin-notifications
    - Apache Cassandra Hinted Handoff Documentation: https://cassandra.apache.org/doc/latest/cassandra/operating/hints.html
  tags:
    - Data
    - Infrastructure
  subTags:
    - Databases
    - Monitoring & Alerting
  ee: false
  demo: false
