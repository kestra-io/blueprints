id: redis-vector-similarity-search-latency-sentinel
namespace: company.ai

inputs:
  - id: redis_host
    type: STRING
    defaults: "redis.internal"
    description: Hostname of Redis instance running RediSearch.
  - id: redis_port
    type: INT
    defaults: 6379
    description: Redis port.
  - id: index_name
    type: STRING
    description: RediSearch vector index name to audit.

tasks:
  - id: inspect_vector_index
    type: io.kestra.plugin.scripts.python.Script
    containerImage: python:3.12-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install redis kestra
    env:
      REDIS_HOST: "{{ inputs.redis_host }}"
      REDIS_PORT: "{{ inputs.redis_port }}"
      REDIS_PASSWORD: "{{ secret('REDIS_PASSWORD') }}"
      INDEX_NAME: "{{ inputs.index_name }}"
    script: |
      import os
      import sys
      import redis
      from kestra import Kestra

      host = os.environ.get("REDIS_HOST", "redis.internal")
      port = int(os.environ.get("REDIS_PORT", "6379"))
      password = os.environ.get("REDIS_PASSWORD") or None
      index_name = os.environ.get("INDEX_NAME", "")

      try:
          r = redis.Redis(host=host, port=port, password=password, socket_connect_timeout=10, socket_timeout=10)
          ft_info = r.ft(index_name).info()
      except Exception as e:
          print(f"Error querying RediSearch index {index_name} at {host}:{port}: {e}", file=sys.stderr)
          sys.exit(1)

      num_docs = int(ft_info.get("num_docs", 0))
      is_indexing = int(ft_info.get("indexing", 0))

      print(f"RediSearch index {index_name}: num_docs={num_docs}, is_indexing={is_indexing}")
      Kestra.outputs({
          "num_docs": num_docs,
          "is_indexing": is_indexing
      })

  - id: evaluate_index_state
    type: io.kestra.plugin.core.flow.If
    condition: "{{ outputs.inspect_vector_index.vars.num_docs | int == 0 }}"
    then:
      - id: notify_cache_team
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        url: "{{ secret('SLACK_WEBHOOK') }}"
        payload: |
          {
            "channel": "#ai-platform",
            "attachments": [
              {
                "color": "danger",
                "title": "🚨 RediSearch Vector Index Empty Alert",
                "text": "RediSearch index `{{ inputs.index_name }}` at `{{ inputs.redis_host }}` contains *0 documents*! Vector embeddings may have been purged or data synchronization failed.",
                "footer": "Kestra AI Sentinel • Redis"
              }
            ]
          }

errors:
  - id: alert_pipeline_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK') }}"
    payload: |
      {
        "channel": "#ai-platform",
        "attachments": [
          {
            "color": "danger",
            "title": "⚠️ Redis Vector Sentinel Failure",
            "text": "Failed to execute FT.INFO on Redis instance. Verify index name and Redis password authentication.",
            "footer": "Kestra Workflow Failure Sentinel"
          }
        ]
      }

triggers:
  - id: periodic_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/30 * * * *"
    disabled: true

outputs:
  - id: num_docs
    type: INT
    value: "{{ outputs.inspect_vector_index.vars.num_docs }}"
  - id: is_indexing
    type: INT
    value: "{{ outputs.inspect_vector_index.vars.is_indexing }}"

extend:
  metaDescription: "Audits RediSearch vector indexes for indexing state, record counts, and memory footprint to prevent search degradation."
  metaTitle: Redis Vector Search (RediSearch) Index Memory and Record Sentinel with Kestra
  title: Redis Vector Search (RediSearch) Index Memory and Record Sentinel
  shortDescription: Audits RediSearch vector indexes for indexing state, record counts, and memory footprint to prevent search degradation.
  description: |
    ## How it works
    This workflow connects to a Redis instance via `redis-cli` and executes `FT.INFO` on a designated RediSearch vector similarity index. Redis is widely used for ultra-low latency semantic caching and vector retrieval (HNSW and FLAT indexing algorithms). If an index becomes empty due to key eviction policies (`maxmemory` evictions), or if indexing background workers stall, semantic cache hits drop to 0% and force expensive full LLM re-computations. This workflow validates index integrity, document count, and indexing status, dispatching alerts upon anomalies.

    ## What you get
    - Continuous validation of RediSearch vector index document populations.
    - Prevents silent semantic cache evictions and cache cold starts.
    - Actionable visibility into vector index metadata.

    ## Who it's for
    - AI Engineers and Backend Architects using Redis for semantic caching.
    - Database Administrators operating Redis Enterprise or RediSearch clusters.

    ## Why orchestrate this with Kestra
    - **Automated Cache Integrity Verification**: Proactively verifies cache index presence.
    - **Zero Local Footprint**: Uses standard command tasks with secure secret password injection.
    - **Instant Team Alerting**: Delivers immediate notifications when vector document count drops.

    ## Prerequisites
    - Redis instance with RediSearch module loaded.
    - Secrets `REDIS_PASSWORD` and `SLACK_WEBHOOK` configured in Kestra.

    ## Quick start
    1. Import the blueprint.
    2. Input Redis host, port, and vector index name.
    3. Run the workflow to inspect index status.

    ## How to extend
    - Query `used_memory_human` to monitor exact memory consumption of vector indices.
    - Re-populate vector cache automatically from a primary database if document count drops to zero.

    ## Links
    - [Redis Vector Similarity Search Documentation](https://redis.io/docs/latest/develop/interact/search-and-query/advanced-concepts/vectors/)
    - [Kestra Documentation](https://kestra.io/docs)
  tags:
    - AI
    - Data
  subTags:
    - Agents & Structured Output
    - ELT & Data Landing
  ee: false
  demo: false
