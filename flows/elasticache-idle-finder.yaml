id: elasticache-idle-finder
namespace: company.finops

description: |
  Finds idle ElastiCache clusters burning $15–200/month each: clusters with
  near-zero engine CPU and almost no connections over 7 days. Reports node type
  and estimated waste so you can delete or downsize with confidence.

inputs:
  - id: aws_regions
    type: ARRAY
    itemType: STRING
    defaults: ["us-east-1"]
    description: AWS regions to audit for idle ElastiCache clusters.
  - id: cpu_threshold_pct
    type: STRING
    defaults: "5"
    description: Clusters under this average EngineCPUUtilization % (7d) count as idle.
  - id: conn_threshold
    type: INT
    defaults: 2
    description: Clusters averaging fewer connections than this (7d) count as idle.
  - id: hourly_cost_usd
    type: STRING
    defaults: "0.034"
    description: Estimated hourly cost per node in USD (tune for your node types; ~$25/mo per node default).

tasks:
  - id: check_clusters
    type: io.kestra.plugin.core.flow.ForEach
    description: Audit ElastiCache clusters region by region.
    values: "{{ inputs.aws_regions }}"
    tasks:
      - id: audit_region
        type: io.kestra.plugin.aws.cli.AwsCLI
        description: List cache clusters, check 7-day CPU and connection metrics per cluster.
        commands:
          - |
            REGION="{{ taskrun.value }}"
            CPU_T="{{ inputs.cpu_threshold_pct }}"
            CONN_T={{ inputs.conn_threshold }}
            PRICE="{{ inputs.hourly_cost_usd }}"
            END=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            START=$(date -u -d "7 days ago" +%Y-%m-%dT%H:%M:%SZ)
            echo "Checking ElastiCache clusters in $REGION"
            IDLE_LIST=""
            TOTAL=0
            for CID in $(aws elasticache describe-cache-clusters --region "$REGION" \
              --query 'CacheClusters[?CacheClusterStatus==`available`].CacheClusterId' --output text); do
              NTYPE=$(aws elasticache describe-cache-clusters --region "$REGION" \
                --cache-cluster-id "$CID" --query 'CacheClusters[0].CacheNodeType' --output text)
              NODES=$(aws elasticache describe-cache-clusters --region "$REGION" \
                --cache-cluster-id "$CID" --query 'CacheClusters[0].NumCacheNodes' --output text)
              CPU=$(aws cloudwatch get-metric-statistics --region "$REGION" \
                --namespace AWS/ElastiCache --metric-name EngineCPUUtilization \
                --dimensions Name=CacheClusterId,Value="$CID" \
                --start-time "$START" --end-time "$END" --period 604800 --statistics Average \
                --query 'Datapoints[0].Average' --output text 2>/dev/null)
              CONN=$(aws cloudwatch get-metric-statistics --region "$REGION" \
                --namespace AWS/ElastiCache --metric-name CurrConnections \
                --dimensions Name=CacheClusterId,Value="$CID" \
                --start-time "$START" --end-time "$END" --period 604800 --statistics Average \
                --query 'Datapoints[0].Average' --output text 2>/dev/null)
              case "$CPU" in ''|'None') CPU=0;; esac
              case "$CONN" in ''|'None') CONN=0;; esac
              IDLE=$(python3 -c "print('y' if float('$CPU') < float('$CPU_T') and float('$CONN') < $CONN_T else 'n')")
              if [ "$IDLE" = "y" ]; then
                COST=$(python3 -c "print('{:.2f}'.format(float('$PRICE') * int('$NODES') * 730))")
                IDLE_LIST="${IDLE_LIST}${CID} (${NTYPE} x${NODES}, cpu=${CPU}% conns=${CONN} ~\$${COST}/mo), "
                TOTAL=$(python3 -c "print('{:.2f}'.format(float('$TOTAL') + float('$COST')))")
              fi
            done
            if [ -n "$IDLE_LIST" ]; then HAS_IDLE=true; else HAS_IDLE=false; fi
            echo "HAS_IDLE=$HAS_IDLE"
            echo "IDLE_CLUSTERS=$IDLE_LIST"
            echo "EST_MONTHLY_WASTE=$TOTAL"
            echo "REGION_DONE=$REGION"
        env:
          AWS_ACCESS_KEY_ID: "{{ secret('AWS_ACCESS_KEY_ID') }}"
          AWS_SECRET_ACCESS_KEY: "{{ secret('AWS_SECRET_ACCESS_KEY') }}"
          AWS_DEFAULT_REGION: "{{ taskrun.value }}"
      - id: notify_region
        type: io.kestra.plugin.core.flow.If
        description: Report idle clusters, stay quiet when caches are serving traffic.
        condition: "{{ outputs.audit_region.vars.HAS_IDLE == 'true' }}"
        then:
          - id: slack_idle
            type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
            url: "{{ secret('SLACK_WEBHOOK_URL') }}"
            payload: |
              {
                "text": ":snowflake: ElastiCache audit `{{ outputs.audit_region.vars.REGION_DONE }}` — idle clusters wasting ~${{ outputs.audit_region.vars.EST_MONTHLY_WASTE }}/mo:\n`{{ outputs.audit_region.vars.IDLE_CLUSTERS }}`\nSnapshot, then delete or downsize the ones nobody connects to."
              }
        else:
          - id: log_clean
            type: io.kestra.plugin.core.log.Log
            message: "All ElastiCache clusters in {{ outputs.audit_region.vars.REGION_DONE }} show real CPU or connection activity."

triggers:
  - id: weekly
    type: io.kestra.plugin.core.trigger.Schedule
    description: Weekly on Sunday at 02:00 UTC. Shipped disabled; enable after your first manual run.
    cron: "0 2 * * 0"
    disabled: true

extend:
  title: ElastiCache Idle Finder
  metaTitle: Find Idle ElastiCache Clusters | Kestra
  shortDescription: Audit ElastiCache clusters across regions for near-zero CPU and connections over 7 days, and get a Slack report with estimated monthly waste.
  metaDescription: Idle ElastiCache clusters cost $15-200/mo each. This flow finds them via CloudWatch and reports the waste weekly.
  description: |
    Redis and Memcached clusters are set-and-forget: someone provisions one for a feature, the feature ships differently, and the cluster sits at 0.3% CPU for a year. At $15–200/month per cluster depending on node type, a handful of forgotten caches is real money. This blueprint finds them with engine-level metrics.

    ## How it works

    1. A Schedule trigger fires weekly on Sunday at 02:00 UTC (shipped disabled).
    2. A ForEach loop audits each region in `aws_regions`.
    3. Per region, the flow lists available cache clusters with node type and node count.
    4. 7-day average `EngineCPUUtilization` and `CurrConnections` come from CloudWatch; under both thresholds counts as idle.
    5. Monthly waste is estimated per node, and an `If` task posts a Slack report only on findings.

    ## What you get

    - A weekly list of idle clusters with node type, node count, CPU, connections, and dollar waste.
    - Evidence strong enough to approve deletion without a meeting.
    - Multi-region coverage, silence on busy weeks.

    ## Who it's for

    Teams running ElastiCache who have ever wondered "does anything still use that Redis?"

    ## Why orchestrate this with Kestra

    Cache usage changes with every deploy; a point-in-time check goes stale. As a scheduled flow the answer refreshes weekly, thresholds are inputs, and the report creates a natural cleanup cadence.

    ## Prerequisites

    - AWS credentials with `elasticache:DescribeCacheClusters` and `cloudwatch:GetMetricStatistics`.
    - A Slack incoming webhook URL.

    ### Secrets

    - `AWS_ACCESS_KEY_ID`: AWS access key for the ElastiCache and CloudWatch API calls.
    - `AWS_SECRET_ACCESS_KEY`: AWS secret key for the ElastiCache and CloudWatch API calls.
    - `SLACK_WEBHOOK_URL`: Incoming webhook URL for the idle-cache report.

    ## Quick start

    1. Add the three secrets above to your Kestra namespace.
    2. Set `aws_regions` and tune `hourly_cost_usd` to your dominant node type.
    3. Run manually once and confirm idle clusters with the owning teams.
    4. Enable the weekly schedule trigger.

    ## How to extend

    - Use a node-type price lookup table instead of a flat hourly estimate.
    - Auto-snapshot before deletion for a one-click restore path.
    - Also flag clusters with evictions at zero but memory pressure high (mis-sized, not idle).

    ## Links

    - [Kestra AWS plugins](https://kestra.io/plugins)
    - [Kestra Slack plugins](https://kestra.io/plugins)
    - [ElastiCache pricing](https://aws.amazon.com/elasticache/pricing/)
    - [ElastiCache CloudWatch metrics](https://docs.aws.amazon.com/AmazonElastiCache/latest/red-ug/CacheMetrics.html)
  tags:
    - Infrastructure
  subTags:
    - FinOps & Cost Management
    - Monitoring & Alerting
  ee: false
  demo: false
