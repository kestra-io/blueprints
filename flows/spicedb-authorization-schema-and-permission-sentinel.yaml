id: spicedb-authorization-schema-and-permission-sentinel
namespace: company.security

description: |
  Continuously monitors SpiceDB fine-grained authorization (ReBAC) cluster readiness, verifies schema integrity, evaluates critical subject permission checks against expected states, and dispatches actionable Slack incident notifications upon authorization drift or datastore outages.

inputs:
  - id: spicedb_endpoint
    type: STRING
    displayName: SpiceDB Gateway Endpoint
    defaults: "http://spicedb.internal:8443"
    description: "Base HTTP/REST gateway URL of the target SpiceDB instance."

  - id: target_resource_type
    type: STRING
    displayName: Resource Type
    defaults: "document"
    description: "Target object type defined in the SpiceDB schema."

  - id: target_resource_id
    type: STRING
    displayName: Resource ID
    defaults: "platform-security-policy"
    description: "Target object identifier to evaluate for authorization."

  - id: target_permission
    type: STRING
    displayName: Permission Name
    defaults: "read"
    description: "Target permission or relation to verify on the resource."

  - id: target_subject_type
    type: STRING
    displayName: Subject Type
    defaults: "user"
    description: "Subject object type to check permissions for."

  - id: target_subject_id
    type: STRING
    displayName: Subject ID
    defaults: "platform-admin"
    description: "Subject identifier whose permissions are audited."

  - id: expected_permissionship
    type: STRING
    displayName: Expected Permissionship
    defaults: "PERMISSIONSHIP_HAS_PERMISSION"
    description: "Expected SpiceDB permissionship result (e.g., PERMISSIONSHIP_HAS_PERMISSION or PERMISSIONSHIP_NO_PERMISSION)."

  - id: slack_channel
    type: STRING
    displayName: Alert Slack Channel
    defaults: "#security-alerts"
    description: "Slack destination channel for authorization drift alerts."

triggers:
  - id: scheduled_sentinel_audit
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 */4 * * *"
    disabled: true
    inputs:
      spicedb_endpoint: "http://spicedb.internal:8443"
      target_resource_type: "document"
      target_resource_id: "platform-security-policy"
      target_permission: "read"
      target_subject_type: "user"
      target_subject_id: "platform-admin"
      expected_permissionship: "PERMISSIONSHIP_HAS_PERMISSION"

tasks:
  - id: probe_engine_readiness
    type: io.kestra.plugin.core.http.Request
    description: "Verifies that the SpiceDB server and underlying datastore are healthy and ready to serve authorization traffic."
    uri: "{{ inputs.spicedb_endpoint }}/readyz"
    method: GET

  - id: probe_authorization_schema
    type: io.kestra.plugin.core.http.Request
    description: "Pulls the current authorization schema from SpiceDB to ensure schema availability and detect model corruption."
    uri: "{{ inputs.spicedb_endpoint }}/v1/schema/read"
    method: POST
    headers:
      Authorization: "Bearer {{ secret('SPICEDB_PRESHARED_KEY') }}"
      Content-Type: application/json
    body: "{}"

  - id: check_critical_permission
    type: io.kestra.plugin.core.http.Request
    description: "Executes a fine-grained permission check against SpiceDB for the specified resource, relation, and subject."
    uri: "{{ inputs.spicedb_endpoint }}/v1/permissions/check"
    method: POST
    headers:
      Authorization: "Bearer {{ secret('SPICEDB_PRESHARED_KEY') }}"
      Content-Type: application/json
    body: |
      {
        "resource": {
          "objectType": "{{ inputs.target_resource_type }}",
          "objectId": "{{ inputs.target_resource_id }}"
        },
        "permission": "{{ inputs.target_permission }}",
        "subject": {
          "object": {
            "objectType": "{{ inputs.target_subject_type }}",
            "objectId": "{{ inputs.target_subject_id }}"
          }
        }
      }

  - id: evaluate_authorization_status
    type: io.kestra.plugin.core.flow.Switch
    description: "Evaluates probe results using Pebble template logic and routes to appropriate remediation or alert notifications."
    value: |
      {% if outputs.probe_engine_readiness.code != 200 %}
      ENGINE_UNHEALTHY
      {% elseif outputs.probe_authorization_schema.code != 200 or outputs.probe_authorization_schema.body.schemaText is empty %}
      SCHEMA_UNAVAILABLE
      {% elseif outputs.check_critical_permission.code != 200 %}
      CHECK_API_FAILED
      {% elseif outputs.check_critical_permission.body.permissionship != inputs.expected_permissionship %}
      PERMISSION_STATE_DRIFT
      {% else %}
      COMPLIANT
      {% endif %}
    cases:
      COMPLIANT:
        - id: log_compliant_state
          type: io.kestra.plugin.core.log.Log
          level: INFO
          message: "SpiceDB fine-grained authorization cluster is healthy, schema is intact, and subject '{{ inputs.target_subject_id }}' holds expected permissionship '{{ inputs.expected_permissionship }}' on '{{ inputs.target_resource_type }}:{{ inputs.target_resource_id }}'."

      PERMISSION_STATE_DRIFT:
        - id: alert_permission_drift
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "attachments": [
                {
                  "color": "#D32F2F",
                  "title": "SpiceDB Authorization State Drift Detected",
                  "text": "CRITICAL: SpiceDB subject `{{ inputs.target_subject_id }}` evaluation drifted from expected state.\n• Expected: `{{ inputs.expected_permissionship }}`\n• Received: `{{ outputs.check_critical_permission.body.permissionship }}`\n• Target Resource: `{{ inputs.target_resource_type }}:{{ inputs.target_resource_id }}`\n• Permission: `{{ inputs.target_permission }}`\n• Checked At: `{{ outputs.check_critical_permission.body.checkedAt }}`"
                }
              ]
            }
        - id: log_drift_failure
          type: io.kestra.plugin.core.log.Log
          level: WARN
          message: "CRITICAL: Detected SpiceDB permission drift. Expected {{ inputs.expected_permissionship }} but received {{ outputs.check_critical_permission.body.permissionship }}"

      SCHEMA_UNAVAILABLE:
        - id: alert_schema_failure
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "attachments": [
                {
                  "color": "#E65100",
                  "title": "SpiceDB Authorization Schema Read Failure",
                  "text": "WARNING: Unable to retrieve or parse active SpiceDB authorization schema from `{{ inputs.spicedb_endpoint }}` (HTTP status `{{ outputs.probe_authorization_schema.code }}`). Verify SpiceDB preshared key credentials and datastore connectivity."
                }
              ]
            }

      ENGINE_UNHEALTHY:
        - id: alert_cluster_down
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "attachments": [
                {
                  "color": "#B71C1C",
                  "title": "SpiceDB Authorization Cluster Unhealthy",
                  "text": "EMERGENCY: SpiceDB readiness probe `/readyz` at `{{ inputs.spicedb_endpoint }}` responded with HTTP status `{{ outputs.probe_engine_readiness.code }}`. Fine-grained authorization checks across all dependent microservices may be failing."
                }
              ]
            }

      CHECK_API_FAILED:
        - id: alert_api_error
          type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
          url: "{{ secret('SLACK_WEBHOOK_URL') }}"
          payload: |
            {
              "attachments": [
                {
                  "color": "#F57C00",
                  "title": "SpiceDB Permission Check Request Failed",
                  "text": "SpiceDB `/v1/permissions/check` request failed with HTTP status `{{ outputs.check_critical_permission.code }}`. Verify request payload, preshared key credentials, and schema object definitions."
                }
              ]
            }

  - id: record_audit_log
    type: io.kestra.plugin.core.log.Log
    description: "Records a final compliance audit summary in Kestra execution history."
    level: INFO
    message: "SpiceDB authorization sentinel audit completed. Resource={{ inputs.target_resource_type }}:{{ inputs.target_resource_id }}, Permission={{ inputs.target_permission }}, Subject={{ inputs.target_subject_type }}:{{ inputs.target_subject_id }}, Ready={{ outputs.probe_engine_readiness.code == 200 }}."

extend:
  title: SpiceDB Authorization Schema and Permission Drift Sentinel
  metaTitle: SpiceDB Authorization Schema and Permission Sentinel | Kestra
  shortDescription: Audits SpiceDB Zanzibar cluster readiness, verifies schema integrity, evaluates critical access checks, and alerts via Slack on permission drift.
  metaDescription: Audit SpiceDB cluster readiness, detect schema drift, verify fine-grained Zanzibar permissions, and trigger automated Slack alerts with Kestra orchestration.
  description: |
    Monitors SpiceDB fine-grained authorization cluster readiness, audits active ReBAC schema definitions, evaluates critical subject access relationships, and triggers automated Slack alerts upon permission drift or cluster outages.

    ## How it works

    1. A recurrent `Schedule` trigger periodically executes the audit sentinel workflow (default every 4 hours, disabled by default for on-demand configuration).
    2. The `probe_engine_readiness` task performs a health check against SpiceDB's `/readyz` HTTP endpoint to ensure both the API service and backing datastore (e.g., PostgreSQL, CockroachDB, Spanner) are responsive.
    3. The `probe_authorization_schema` task calls `/v1/schema/read` with the configured `SPICEDB_PRESHARED_KEY` to pull and validate the active Zanzibar schema definition.
    4. The `check_critical_permission` task executes a real-time permission evaluation against `/v1/permissions/check` for a designated high-priority subject, permission, and target resource.
    5. The `evaluate_authorization_status` task uses native Pebble conditionals inside a `Switch` task to classify the cluster and permission state into `COMPLIANT`, `PERMISSION_STATE_DRIFT`, `SCHEMA_UNAVAILABLE`, `ENGINE_UNHEALTHY`, or `CHECK_API_FAILED`.
    6. Depending on the branch outcome, detailed Slack alerts are posted via `io.kestra.plugin.slack.notifications.SlackIncomingWebhook` with contextual diagnostics, and a comprehensive audit summary is recorded in Kestra's execution history.

    ## What you get

    - Continuous operational visibility into SpiceDB cluster availability and datastore connectivity.
    - Proactive detection of unauthorized or unintended permission state drift for critical platform subjects.
    - Early warning against broken or missing authorization schema definitions before application microservices fail.
    - Immediate incident dispatch to on-call security and platform engineering Slack channels with diagnostic metadata.
    - Centralized audit trail of fine-grained access compliance evaluations preserved in Kestra execution records.

    ## Who it's for

    - Security and DevSecOps engineers managing fine-grained relationship-based access control (ReBAC) policies.
    - Platform teams responsible for maintaining high-availability SpiceDB clusters across Kubernetes environments.
    - SREs requiring automated continuous verification and alerting for critical tier-0 authorization infrastructure.

    ## Why orchestrate this with Kestra

    - **Declarative Policy Governance**: Define authorization monitoring intervals, target subjects, and escalation webhooks as version-controlled YAML blueprints.
    - **Enterprise Secret Masking**: Inject SpiceDB preshared keys and Slack incoming webhooks securely via `{{ secret(...) }}` without plaintext credential exposure.
    - **Multi-Branch Incident Routing**: Dynamically isolate infrastructure outages from policy drift using built-in Pebble expressions and `Switch` tasks.
    - **Auditable Execution History**: Retain complete execution snapshots, response codes, and evaluation timestamps for regulatory compliance drills.

    ## Prerequisites

    - A running SpiceDB instance (local or remote) with the HTTP gateway enabled (e.g., via `--http-enabled=true`).
    - Network connectivity between the Kestra worker or runner and the SpiceDB HTTP endpoint.
    - A Slack Incoming Webhook URL configured with permission to publish into your operations channel.

    ### Secrets

    - `SPICEDB_PRESHARED_KEY`: Preshared key or Bearer token configured for authenticating API requests to SpiceDB.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook URL used for routing incident and drift notifications.

    ## Quick start

    1. Add `SPICEDB_PRESHARED_KEY` and `SLACK_WEBHOOK_URL` to your Kestra namespace secrets store.
    2. Import this blueprint into your Kestra instance (e.g., under namespace `company.security`).
    3. Click **Execute** with default parameters to test connectivity and review the probe output in the **Executions** tab.
    4. Activate the `scheduled_sentinel_audit` trigger to enforce recurrent automated authorization health monitoring.

    ## How to extend

    - **Automatic Relationship Repair**: Extend the `PERMISSION_STATE_DRIFT` branch with an authenticated `POST /v1/relationships/write` task to automatically reinstate missing tuple relationships.
    - **Batch Permission Matrix**: Wrap the permission check in a `ForEach` task to audit multiple critical roles and resources in a single execution.
    - **PagerDuty Escalation**: Add a PagerDuty or Opsgenie task to the `ENGINE_UNHEALTHY` branch for immediate page-outs during datastore disconnects.
    - **CI/CD Deployment Gate**: Chain this flow as a pre-flight deployment gate in CI/CD pipelines to guarantee authorization schema validity prior to deploying new services.

    ## Links

    - [SpiceDB Documentation](https://authzed.com/docs/spicedb)
    - [SpiceDB GitHub Repository](https://github.com/authzed/spicedb)
    - [Kestra HTTP Request Plugin Documentation](https://kestra.io/plugins/plugin-core/tasks/http/io.kestra.plugin.core.http.request)
    - [Kestra Slack Notification Plugin Documentation](https://kestra.io/plugins/plugin-slack/io.kestra.plugin.slack.notifications.slackincomingwebhook)
  tags:
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - Incident Response
  ee: false
  verified: false
  demo: false
