id: application-rescue-synthetic-requirement-change-impact
namespace: application.rescue

description: |
  Compares a saved synthetic programme baseline with a current configuration.
  Validates both configurations, assesses the same self-reported applicant,
  generates JSON and HTML reports, and branches on requirement changes.

  Prerequisites:
  - A JSON baseline saved in this namespace under the KV key:
    application_rescue_demo_masters_001_baseline
  - For scheduled runs, a namespace file named programme-demo-v2.json.
  - A working Docker task runner for the Python tasks.

  This flow does not update the baseline, monitor live websites,
  verify documents, or provide an official eligibility assessment.
  The daily schedule is disabled by default.

inputs:
  - id: current_programme_file
    type: FILE
    description: "Upload a synthetic programme configuration, such as programme-demo-v2.json."

  - id: transcript_available
    type: BOOL
    defaults: false

  - id: sop_ready
    type: BOOL
    defaults: false

  - id: reference_letters_available
    type: INT
    defaults: 0
    description: "Self-reported count. Negative values produce NEEDS_CLARIFICATION."

tasks:
  - id: load_baseline
    type: io.kestra.plugin.core.kv.Get
    key: application_rescue_demo_masters_001_baseline
    errorOnMissing: true

  - id: validate_configurations
    type: io.kestra.plugin.scripts.python.Script

    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker

    containerImage: python:3.12-slim

    inputFiles:
      previous.json: "{{ outputs.load_baseline.value | toJson }}"
      current.json: "{{ inputs.current_programme_file }}"

    outputFiles:
      - validated-previous.json
      - validated-current.json

    script: |
      import json
      from pathlib import Path

      EXPECTED_RULES = {
          "transcript_required",
          "sop_required",
          "minimum_reference_letters"
      }

      def validate(filename):
          data = json.loads(
              Path(filename).read_text(encoding="utf-8-sig")
          )

          if not isinstance(data, dict):
              raise ValueError(f"{filename}: expected a JSON object.")

          for field in (
              "programme_id",
              "programme_name",
              "requirements_version"
          ):
              value = data.get(field)
              if not isinstance(value, str) or not value.strip():
                  raise ValueError(
                      f"{filename}: {field} must be a non-empty string."
                  )

          for field, expected in (
              ("schema_version", "1.0"),
              ("mode", "synthetic_demo"),
              ("review_status", "approved_for_demo")
          ):
              if data.get(field) != expected:
                  raise ValueError(
                      f"{filename}: expected {field}={expected}."
                  )

          source = data.get("source")

          if not isinstance(source, dict):
              raise ValueError(
                  f"{filename}: source must be a JSON object."
              )

          if source.get("type") != "synthetic":
              raise ValueError(
                  f"{filename}: synthetic source required."
              )

          if source.get("url") is not None:
              raise ValueError(
                  f"{filename}: synthetic source URL must be null."
              )

          rules = data.get("requirements")

          if not isinstance(rules, dict):
              raise ValueError(
                  f"{filename}: requirements must be a JSON object."
              )

          if set(rules) != EXPECTED_RULES:
              raise ValueError(
                  f"{filename}: missing or unsupported requirement keys."
              )

          for field in ("transcript_required", "sop_required"):
              if type(rules[field]) is not bool:
                  raise ValueError(
                      f"{filename}: {field} must be true or false."
                  )

          minimum = rules["minimum_reference_letters"]

          if type(minimum) is not int or minimum < 0:
              raise ValueError(
                  f"{filename}: minimum_reference_letters must be "
                  "a non-negative integer."
              )

          return data

      previous = validate("previous.json")
      current = validate("current.json")

      if previous["programme_id"] != current["programme_id"]:
          raise ValueError(
              "Cannot compare different programme IDs. "
              "Upload a configuration for the saved baseline's programme."
          )

      for filename, data in (
          ("validated-previous.json", previous),
          ("validated-current.json", current)
      ):
          Path(filename).write_text(
              json.dumps(data, indent=2),
              encoding="utf-8"
          )

      print("Both synthetic configurations validated.")
      print(f"Programme ID: {current['programme_id']}")
      print(f"Previous version: {previous['requirements_version']}")
      print(f"Current version: {current['requirements_version']}")

  - id: compare_and_assess
    type: io.kestra.plugin.scripts.python.Script

    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker

    containerImage: python:3.12-slim

    env:
      TRANSCRIPT_AVAILABLE: "{{ inputs.transcript_available }}"
      SOP_READY: "{{ inputs.sop_ready }}"
      REFERENCES_AVAILABLE: "{{ inputs.reference_letters_available }}"
      BASELINE_NAMESPACE: "{{ flow.namespace }}"

    inputFiles:
      previous.json: "{{ outputs.validate_configurations.outputFiles['validated-previous.json'] }}"
      current.json: "{{ outputs.validate_configurations.outputFiles['validated-current.json'] }}"

    outputFiles:
      - change-impact.json

    script: |
      import json
      import os
      from datetime import datetime, timezone
      from pathlib import Path

      RULES = {
          "transcript_required": "Transcript required",
          "sop_required": "Statement of purpose required",
          "minimum_reference_letters": "Minimum reference letters"
      }

      def read_bool(name):
          value = os.environ[name].strip().lower()

          if value not in {"true", "false"}:
              raise ValueError(f"Invalid boolean input: {name}")

          return value == "true"

      applicant = {
          "transcript_available": read_bool("TRANSCRIPT_AVAILABLE"),
          "sop_ready": read_bool("SOP_READY"),
          "reference_letters_available": int(
              os.environ["REFERENCES_AVAILABLE"]
          )
      }

      def assess(rules):
          findings = {}

          for rule, field in (
              ("transcript_required", "transcript_available"),
              ("sop_required", "sop_ready")
          ):
              if not rules[rule]:
                  status = "NOT_APPLICABLE"
              elif applicant[field]:
                  status = "MET"
              else:
                  status = "ACTION_REQUIRED"

              findings[rule] = status

          available = applicant["reference_letters_available"]
          required = rules["minimum_reference_letters"]

          if available < 0:
              status = "NEEDS_CLARIFICATION"
          elif required == 0:
              status = "NOT_APPLICABLE"
          elif available < required:
              status = "ACTION_REQUIRED"
          else:
              status = "MET"

          findings["minimum_reference_letters"] = status
          statuses = set(findings.values())

          if "NEEDS_CLARIFICATION" in statuses:
              overall = "NEEDS_CLARIFICATION"
          elif "ACTION_REQUIRED" in statuses:
              overall = "ACTION_REQUIRED"
          else:
              overall = "CHECKLIST_COMPLETE"

          return {
              "status": overall,
              "findings": findings
          }

      previous = json.loads(
          Path("previous.json").read_text(encoding="utf-8")
      )
      current = json.loads(
          Path("current.json").read_text(encoding="utf-8")
      )

      before = assess(previous["requirements"])
      after = assess(current["requirements"])
      changes = []

      for key, label in RULES.items():
          old = previous["requirements"][key]
          new = current["requirements"][key]

          if old != new:
              changes.append({
                  "rule_id": key,
                  "label": label,
                  "previous_value": old,
                  "current_value": new,
                  "previous_finding": before["findings"][key],
                  "current_finding": after["findings"][key],
                  "finding_changed": (
                      before["findings"][key] != after["findings"][key]
                  )
              })

      version_warning = None

      if (
          changes
          and previous["requirements_version"]
          == current["requirements_version"]
      ):
          version_warning = (
              "Requirement values changed without a version-label change."
          )

      report = {
          "mode": "synthetic_demo",
          "generated_at": datetime.now(timezone.utc).isoformat(),
          "programme_id": current["programme_id"],
          "programme_name": current["programme_name"],
          "baseline_source": {
              "type": "kestra_kv",
              "namespace": os.environ["BASELINE_NAMESPACE"],
              "key": "application_rescue_demo_masters_001_baseline"
          },
          "current_source": "flow_file_input",
          "baseline_updated": False,
          "previous_version": previous["requirements_version"],
          "current_version": current["requirements_version"],
          "applicant": applicant,
          "requirements_changed": bool(changes),
          "change_count": len(changes),
          "overall_status_changed": (
              before["status"] != after["status"]
          ),
          "before": before,
          "after": after,
          "changes": changes,
          "warning": version_warning,
          "disclaimer": (
              "Synthetic rules and self-reported answers only. "
              "No official eligibility or document verification. "
              "Both assessments use the same applicant answers. "
              "The workflow compares a saved baseline with a supplied "
              "configuration; it does not verify chronological order. "
              "The saved baseline has not been updated."
          )
      }

      output = Path("change-impact.json")
      output.write_text(
          json.dumps(report, indent=2),
          encoding="utf-8"
      )

      if output.stat().st_size == 0:
          raise RuntimeError("Generated JSON report is empty.")

      print(f"Changed rules: {len(changes)}")
      print(f"Before: {before['status']}")
      print(f"After: {after['status']}")
      print("Created change-impact.json")
      print("Saved baseline updated: No")

  - id: render_report
    type: io.kestra.plugin.scripts.python.Script

    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker

    containerImage: python:3.12-slim

    inputFiles:
      change-impact.json: "{{ outputs.compare_and_assess.outputFiles['change-impact.json'] }}"

    outputFiles:
      - change-impact.html

    script: |
      import json
      from html import escape
      from pathlib import Path

      report = json.loads(
          Path("change-impact.json").read_text(encoding="utf-8")
      )

      def text(value):
          return escape(str(value))

      rows = "".join(
          "<tr>"
          f"<td>{text(change['label'])}</td>"
          f"<td>{text(change['previous_value'])}</td>"
          f"<td>{text(change['current_value'])}</td>"
          f"<td>{text(change['previous_finding'])}</td>"
          f"<td>{text(change['current_finding'])}</td>"
          "</tr>"
          for change in report["changes"]
      )

      if not report["changes"]:
          rows = (
              '<tr><td colspan="5">'
              'No supported requirement values changed.'
              '</td></tr>'
          )

      warning_html = (
          f'<p class="notice">{text(report["warning"])}</p>'
          if report["warning"] else ""
      )

      page = (
          '<!doctype html><html lang="en"><head>'
          '<meta charset="utf-8">'
          '<meta name="viewport" content="width=device-width, initial-scale=1">'
          '<title>Application Rescue — Saved Baseline Impact</title>'
          '<style>'
          'body{font-family:Arial,sans-serif;max-width:1100px;'
          'margin:40px auto;padding:0 20px;color:#172033;}'
          '.table-wrap{overflow-x:auto;}'
          'table{border-collapse:collapse;width:100%;}'
          'th,td{border:1px solid #ccd3df;padding:12px;text-align:left;}'
          'th{background:#eef2ff;}'
          '.notice{background:#fff4d6;padding:16px;line-height:1.6;}'
          '</style></head><body>'
          '<h1>Application Rescue — Requirement Change Impact</h1>'
          f'<h2>{text(report["programme_name"])}</h2>'
          f'<p>Programme ID: {text(report["programme_id"])}</p>'
          '<p>Previous configuration: saved Kestra KV baseline</p>'
          '<p>Current configuration: supplied flow file input</p>'
          f'<p>Generated: {text(report["generated_at"])}</p>'
          f'<p>Previous version: {text(report["previous_version"])}</p>'
          f'<p>Current version: {text(report["current_version"])}</p>'
          f'<p>Changed rules: {text(report["change_count"])}</p>'
          f'<p>Before: {text(report["before"]["status"])}</p>'
          f'<p>After: {text(report["after"]["status"])}</p>'
          '<h3>Self-reported applicant</h3>'
          f'<p>Transcript available: '
          f'{text(report["applicant"]["transcript_available"])}</p>'
          f'<p>SOP ready: {text(report["applicant"]["sop_ready"])}</p>'
          f'<p>Reference letters available: '
          f'{text(report["applicant"]["reference_letters_available"])}</p>'
          '<h3>Requirement changes</h3>'
          '<div class="table-wrap"><table><thead><tr>'
          '<th>Rule</th><th>Previous value</th><th>Current value</th>'
          '<th>Previous finding</th><th>Current finding</th>'
          '</tr></thead><tbody>'
          + rows
          + '</tbody></table></div>'
          + warning_html
          + '<p>Saved baseline updated: No</p>'
          + f'<p class="notice">{text(report["disclaimer"])}</p>'
          + '</body></html>'
      )

      output = Path("change-impact.html")
      output.write_text(page, encoding="utf-8")

      if output.stat().st_size == 0:
          raise RuntimeError("Generated HTML report is empty.")

      print(f"Created change-impact.html: {output.stat().st_size} bytes")

  - id: route_change_result
    type: io.kestra.plugin.core.flow.If
    condition: "{{ fromJson(read(outputs.compare_and_assess.outputFiles['change-impact.json'])).requirements_changed }}"
    then:
      - id: log_requirement_changes
        type: io.kestra.plugin.core.log.Log
        message: |
          Synthetic requirement changes detected.
          Changed rules: {{ fromJson(read(outputs.compare_and_assess.outputFiles['change-impact.json'])).change_count }}
          Before: {{ fromJson(read(outputs.compare_and_assess.outputFiles['change-impact.json'])).before.status }}
          After: {{ fromJson(read(outputs.compare_and_assess.outputFiles['change-impact.json'])).after.status }}
          Review the HTML report in the render_report task outputs.
          The saved baseline has not been updated.
    else:
      - id: log_no_requirement_changes
        type: io.kestra.plugin.core.log.Log
        message: |
          No supported synthetic requirement values changed.
          The applicant checklist may still require action.
          Review the HTML report in the render_report task outputs.
          The saved baseline has not been updated.

triggers:
  - id: daily_synthetic_comparison
    type: io.kestra.plugin.core.trigger.Schedule
    disabled: true
    cron: "0 9 * * *"
    timezone: Asia/Karachi
    inputs:
      current_programme_file: "nsfile:///programme-demo-v2.json"
      transcript_available: true
      sop_ready: true
      reference_letters_available: 2
extend:
  title: Compare Programme Requirement Snapshots with Kestra KV
  metaTitle: Programme Requirement Snapshot Comparison | Kestra
  shortDescription: >-
    Compare a saved Kestra KV baseline with an uploaded synthetic programme
    configuration and generate applicant-specific JSON and HTML reports.
  metaDescription: >-
    Compare synthetic programme snapshots with Kestra KV and Python,
    validate inputs, and generate applicant-specific JSON and HTML reports.
  description: |
    Compare a saved synthetic programme baseline with an uploaded JSON
    configuration. Both assessments use the same self-reported applicant
    answers. This is not official eligibility or document verification.

    ## How it works

    1. Start manually with a configuration file, or enable the daily
       schedule after preparing its namespace file and applicant inputs.
    2. Read the Kestra KV baseline. Validate both configurations,
       their programme IDs, source metadata, and supported rule types.
    3. Run Python comparison and assessment tasks, then generate JSON
       and escaped HTML reports.
    4. Route through an If task based on requirement changes.
       The baseline is never overwritten.

    ## What you get

    - JSON change details and an HTML report.
    - Before-and-after findings for the same applicant.
    - Validation failures for malformed configurations.
    - A warning for changed rules with an unchanged version label.

    ## Who it's for

    - Developers prototyping requirement-change analysis.
    - Teams testing structured configuration comparison.

    ## Why orchestrate this with Kestra

    Coordinate KV access, validation, Python tasks, artifacts, branching,
    and scheduling in one tracked flow. Separate tasks expose failures
    more clearly than one standalone script.

    ## Prerequisites

    - Kestra 2.0, the Python scripts plugin, and a Docker runner
      able to pull python:3.12-slim.
    - A baseline JSON object under the namespace KV key
      application_rescue_demo_masters_001_baseline.
    - A current JSON file for the same programme.
    - For scheduled runs, programme-demo-v2.json in Namespace Files.
    - Both snapshots must satisfy validate_configurations.

    ### Secrets

    No secrets are required. Do not include credentials or sensitive
    applicant information in sample configurations.

    ## Quick start

    1. Save the baseline as a JSON object in KV, not a quoted JSON string.
    2. Execute manually with the current file and applicant answers.
       Inspect both report artifacts.
    3. Test changed and unchanged snapshots.
    4. Upload the scheduled namespace file, review its fixed applicant
       inputs, then enable the 09:00 Asia/Karachi schedule if needed.

    ## How to extend

    Add source integrations or notifications. Update validation and
    assessment together for new rules. Verify snapshot ordering before
    adding baseline updates. Real-data support needs validation changes.

    ## Links

    - [Kestra plugins](https://kestra.io/plugins)
    - [Kestra documentation](https://kestra.io/docs)
    - [Python documentation](https://docs.python.org/3/)
  tags:
    - Data
  subTags:
    - Testing & Quality
    - File & Data Processing Basics
  ee: false
  demo: false
