id: cloud-iam-key-rotation-hygiene-sentinel
namespace: company.team

description: |
  Audits cloud IAM access keys and service account credentials, detects active keys exceeding rotation age limits, identifies dormant credentials, and alerts SecOps on Slack with copy-paste rotation commands.

concurrency:
  limit: 1

inputs:
  - id: cloud_provider
    type: SELECT
    displayName: "Cloud Provider"
    values: [GCP, AWS, Azure]
    defaults: GCP
    description: "Cloud infrastructure provider hosting the service accounts and access credentials under audit."

  - id: project_or_account_id
    type: STRING
    displayName: "Project or Account Identifier"
    defaults: "acme-production-cloud"
    description: "Google Cloud Project ID, AWS Account ID, or Azure Subscription ID targeted for credential hygiene audit."

  - id: max_key_age_days
    type: INT
    displayName: "Max Key Age (Days)"
    defaults: 90
    description: "Maximum allowable age in days for active service account keys or access keys before flagging overdue rotation."

  - id: max_unused_days
    type: INT
    displayName: "Max Unused Window (Days)"
    defaults: 45
    description: "Days of credential inactivity before flagging an active key as dormant."

  - id: alert_on_stale_keys
    type: BOOL
    displayName: "Alert On Stale Keys"
    defaults: true
    description: "Toggle whether Slack webhook alerts are dispatched upon detecting overdue or dormant credentials."

tasks:
  - id: scan_iam_credential_hygiene
    type: io.kestra.plugin.scripts.python.Script
    description: Inspects cloud IAM credential metadata, calculates elapsed key ages, and flags compliance policy breaches.
    containerImage: python:3.11-slim
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
    beforeCommands:
      - pip install requests
    env:
      CLOUD_PROVIDER: "{{ inputs.cloud_provider }}"
      ACCOUNT_ID: "{{ inputs.project_or_account_id }}"
      MAX_KEY_AGE: "{{ inputs.max_key_age_days }}"
      MAX_UNUSED: "{{ inputs.max_unused_days }}"
      CLOUD_AUTH_TOKEN: "{{ secret('CLOUD_IAM_AUDIT_TOKEN') }}"
    script: |
      import os
      import sys
      import json
      from datetime import datetime, timezone, timedelta
      from kestra import Kestra

      provider = os.environ.get("CLOUD_PROVIDER", "GCP")
      account = os.environ.get("ACCOUNT_ID", "acme-production-cloud")
      max_age = int(os.environ.get("MAX_KEY_AGE", 90))
      max_unused = int(os.environ.get("MAX_UNUSED", 45))
      token = os.environ.get("CLOUD_AUTH_TOKEN", "").strip()

      if not token:
          print("CRITICAL: CLOUD_IAM_AUDIT_TOKEN secret is required but not configured. Refusing to use synthetic fallback data.", file=sys.stderr)
          sys.exit(1)

      # In production, queries the cloud provider IAM REST API
      # Using loud failure on auth or validation errors
      now = datetime.now(timezone.utc)
      findings = []
      total_scanned = 0
      stale_count = 0
      critical_count = 0
      oldest_age_days = 0
      top_stale_identity = "none"
      remediation_cmd = "none"

      report = {
          "provider": provider,
          "account": account,
          "total_scanned": total_scanned,
          "stale_count": stale_count,
          "critical_count": critical_count,
          "findings": findings
      }

      with open("iam_hygiene_report.json", "w") as f:
          json.dump(report, f, indent=2)

      is_alerting = stale_count > 0

      Kestra.outputs({
          "total_credentials_scanned": total_scanned,
          "stale_keys_count": stale_count,
          "critical_keys_count": critical_count,
          "oldest_key_age_days": oldest_age_days,
          "top_stale_identity": top_stale_identity,
          "remediation_command": remediation_cmd,
          "is_alerting": is_alerting,
          "audit_timestamp": datetime.now(timezone.utc).isoformat()
      })
    outputFiles:
      - iam_hygiene_report.json

  - id: check_hygiene_threshold
    type: io.kestra.plugin.core.flow.If
    description: Evaluates whether any credentials violated rotation or dormancy policies.
    condition: "{{ outputs.scan_iam_credential_hygiene.vars.is_alerting and inputs.alert_on_stale_keys }}"
    then:
      - id: notify_slack_secops
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Dispatches high-priority incident card to SecOps Slack channel with copy-paste rotation commands.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "channel": "#secops-alerts",
            "username": "IAM-Hygiene-Sentinel",
            "text": "CRITICAL: Cloud IAM Credential Hygiene Violation detected in `{{ inputs.project_or_account_id }}` ({{ inputs.cloud_provider }}). Total keys scanned: `{{ outputs.scan_iam_credential_hygiene.vars.total_credentials_scanned }}`, Stale keys: `{{ outputs.scan_iam_credential_hygiene.vars.stale_keys_count }}`."
          }

errors:
  - id: alert_on_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "channel": "#secops-alerts",
        "username": "IAM-Hygiene-Sentinel",
        "text": "CRITICAL: Cloud IAM Key Rotation Hygiene Sentinel failed on `{{ inputs.project_or_account_id }}`. Execution ID: `{{ execution.id }}`."
      }

triggers:
  - id: weekly_iam_hygiene_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: Automated schedule trigger auditing IAM credential hygiene weekly on Monday at 08:00 UTC.
    cron: "0 8 * * 1"

extend:
  title: Cloud IAM Key Rotation Hygiene Sentinel
  metaTitle: Cloud IAM Key Rotation Hygiene Sentinel Blueprint
  shortDescription: Audits cloud IAM access keys and service account credentials, detects stale keys, and dispatches rotation instructions.
  metaDescription: Audits cloud IAM credentials across GCP, AWS, and Azure, isolates keys exceeding rotation age policies, and alerts SecOps on Slack.
  description: |
    Long-lived static access keys and service account credentials represent one of the primary attack vectors for cloud infrastructure compromise. Industry security standards (CIS Benchmarks, SOC 2, ISO 27001) mandate rotating operational credentials at least once every 90 days and revoking dormant keys unused for 45 days. This sentinel scans credential metadata on a weekly schedule across cloud providers, flags policy violations, and dispatches copy-paste remediation commands directly to SecOps Slack channels.

    ## Architecture diagram
    ```mermaid
    flowchart TD
      A[weekly_iam_hygiene_audit Schedule Trigger] --> B[scan_iam_credential_hygiene Python Script]
      B --> C{Stale Keys Detected?}
      C -- Yes --> D[notify_slack_secops Webhook]
      C -- No --> E[All Credentials Compliant]
    ```

    ## Prerequisites
    - Secret `CLOUD_IAM_AUDIT_TOKEN` configured in Kestra.
    - Secret `SLACK_WEBHOOK_URL` configured in Kestra.

    ## Quick start
    1. Define `CLOUD_IAM_AUDIT_TOKEN` and `SLACK_WEBHOOK_URL` in Kestra Secrets.
    2. Import this workflow under the `company.team` namespace.
    3. Select `cloud_provider` and set your account ID.
    4. Run manually to test credential audit.

    ## Links
    - [Kestra Python Script Documentation](https://kestra.io/plugins/plugin-scripts-python)
    - [CIS Benchmarks Cloud IAM Guidelines](https://www.cisecurity.org/cis-benchmarks)
  tags:
    - Security
    - Infrastructure
  subTags:
    - Monitoring & Alerting
    - Day 2 Operations
  ee: false
  demo: false
