id: tax-rate-sync-qa
namespace: company.team

description: |
  Catch tax rate drift between the provider feed and the store configuration before an invoice goes
  out with the wrong VAT. A webhook fired by the nightly tax sync job starts the check, and a
  disabled daily schedule stands ready as the backstop until an operator switches it on. The flow
  writes two fixtures, a six jurisdiction provider snapshot and a store export that omits Great
  Britain and prices France at 0.202 instead of 0.20, then pulls the live rate card from the
  provider API with that fixture as the fallback and diffs every jurisdiction against a
  configurable tolerance. Differences open a GitHub issue carrying the full diff table and post a
  Slack alert, a clean comparison is logged as in sync, and the verdict, the mismatch list, the
  jurisdictions checked and the largest delta are published as typed outputs.

triggers:
  - id: nightly_sync_complete
    type: io.kestra.plugin.core.trigger.Webhook
    description: The nightly tax sync job POSTs here when its rate import finishes, so the store export is verified against the provider before the first order of the day.
    key: "{{ secret('TAX_SYNC_WEBHOOK_KEY') }}"
  - id: daily_backstop
    type: io.kestra.plugin.core.trigger.Schedule
    description: Disabled 06:00 UTC net that would re-verify the rate card every morning, shipped off until someone enables it as the fallback for a missed webhook.
    cron: "0 6 * * *"
    disabled: true

inputs:
  - id: tolerance
    type: FLOAT
    defaults: 0.0001
    description: Largest absolute rate difference, for example 0.0001, that still counts as in sync before a jurisdiction is reported as a mismatch.
  - id: github_repository
    type: STRING
    defaults: acme-corp/finance-config
    description: Repository that receives the diff issue whenever the provider rate card and the store export disagree.

tasks:
  # --- 1. rate card workspace ---
  - id: rate_workspace
    type: io.kestra.plugin.core.flow.WorkingDirectory
    description: One shared directory so the rate fixtures, the live provider response and the python comparison all read the same files for the whole run.
    tasks:
      # --- 2. rate fixtures ---
      - id: write_rate_fixtures
        type: io.kestra.plugin.scripts.shell.Commands
        description: Write the six jurisdiction provider snapshot and the store export with heredocs, the store deliberately missing GB and pricing FR at 0.202 so the run has something real to catch.
        commands:
          - |
            set -u
            cat > provider-rates.json <<'PROVIDER_EOF'
            {
              "as_of": "2026-10-12T02:05:00Z",
              "source": "nightly provider pull",
              "rates": [
                {"jurisdiction": "FR", "rate": 0.20, "currency": "EUR"},
                {"jurisdiction": "GB", "rate": 0.20, "currency": "GBP"},
                {"jurisdiction": "DE", "rate": 0.19, "currency": "EUR"},
                {"jurisdiction": "US-CA", "rate": 0.0725, "currency": "USD"},
                {"jurisdiction": "JP", "rate": 0.10, "currency": "JPY"},
                {"jurisdiction": "AU", "rate": 0.10, "currency": "AUD"}
              ]
            }
            PROVIDER_EOF
            cat > store-rates.json <<'STORE_EOF'
            {
              "exported_at": "2026-10-12T02:15:00Z",
              "source": "store configuration export",
              "rates": [
                {"jurisdiction": "FR", "rate": 0.202, "currency": "EUR"},
                {"jurisdiction": "DE", "rate": 0.19, "currency": "EUR"},
                {"jurisdiction": "US-CA", "rate": 0.0725, "currency": "USD"},
                {"jurisdiction": "JP", "rate": 0.10, "currency": "JPY"},
                {"jurisdiction": "AU", "rate": 0.10, "currency": "AUD"}
              ]
            }
            STORE_EOF
            echo "provider jurisdictions listed: $(grep -c jurisdiction provider-rates.json)"
            echo "store jurisdictions listed: $(grep -c jurisdiction store-rates.json)"

      # --- 3. live rate card ---
      - id: fetch_provider_rates
        type: io.kestra.plugin.core.http.Request
        description: Pull the live rate card from the provider endpoint with a bearer token, with allowFailed and a retry so an outage degrades to the fixture instead of killing the verification.
        method: GET
        uri: https://api.taxrates.example.com/v1/rates
        headers:
          Authorization: "Bearer {{ secret('TAX_PROVIDER_TOKEN') }}"
          Accept: application/json
        timeout: PT30S
        options:
          allowFailed: true
        retry:
          type: exponential
          interval: PT2S
          maxInterval: PT10S
          maxAttempts: 3

      # --- 4. jurisdiction diff ---
      - id: compare_rates
        type: io.kestra.plugin.scripts.python.Script
        description: Diff the provider rate card against the store export jurisdiction by jurisdiction using the tolerance input, falling back to the provider fixture whenever the API returned nothing usable.
        taskRunner:
          type: io.kestra.plugin.core.runner.Process
        env:
          TAX_RATE_TOLERANCE: "{{ inputs.tolerance }}"
          PROVIDER_BODY: "{{ outputs.fetch_provider_rates.body | default('') }}"
        script: |
          import json
          import os

          PROVIDER_FILE = "provider-rates.json"
          STORE_FILE = "store-rates.json"
          DEFAULT_TOLERANCE = 0.0001


          def as_float(value):
              try:
                  return float(value)
              except (TypeError, ValueError):
                  return None


          def read_text(path):
              if not os.path.exists(path) or os.path.getsize(path) == 0:
                  return ""
              try:
                  with open(path, "r", encoding="utf-8") as handle:
                      return handle.read()
              except OSError:
                  return ""


          def parse_json(raw):
              text = (raw or "").strip()
              if not text:
                  return None
              try:
                  return json.loads(text)
              except ValueError:
                  return None


          def rates_from(document):
              if isinstance(document, dict):
                  rows = document.get("rates")
                  if not isinstance(rows, list):
                      rows = document.get("data")
                  if not isinstance(rows, list):
                      rows = [{"jurisdiction": key, "rate": value}
                              for key, value in document.items()
                              if isinstance(value, (int, float))]
              elif isinstance(document, list):
                  rows = document
              else:
                  return {}
              mapping = {}
              for row in rows:
                  if not isinstance(row, dict):
                      continue
                  code = str(row.get("jurisdiction") or row.get("code") or "").strip().upper()
                  rate = as_float(row.get("rate"))
                  if not code or rate is None:
                      continue
                  mapping[code] = rate
              return mapping


          raw_tolerance = os.environ.get("TAX_RATE_TOLERANCE", "")
          try:
              tolerance = abs(float(raw_tolerance))
          except (TypeError, ValueError):
              tolerance = DEFAULT_TOLERANCE

          provider = rates_from(parse_json(os.environ.get("PROVIDER_BODY", "")))
          source = "live"
          if not provider:
              provider = rates_from(parse_json(read_text(PROVIDER_FILE)))
              source = "fixture"
          store = rates_from(parse_json(read_text(STORE_FILE)))

          mismatches = []
          max_delta = 0.0
          jurisdictions_checked = 0

          if provider and store:
              jurisdictions_checked = len(set(provider) | set(store))
              for code in sorted(provider):
                  if code not in store:
                      mismatches.append({
                          "jurisdiction": code,
                          "provider_rate": provider[code],
                          "store_rate": None,
                          "delta": None,
                          "issue": "missing_in_store",
                      })
                      continue
                  delta = round(abs(provider[code] - store[code]), 6)
                  if delta > tolerance:
                      mismatches.append({
                          "jurisdiction": code,
                          "provider_rate": provider[code],
                          "store_rate": store[code],
                          "delta": delta,
                          "issue": "rate_delta",
                      })
                  if delta > max_delta:
                      max_delta = delta
              for code in sorted(store):
                  if code not in provider:
                      mismatches.append({
                          "jurisdiction": code,
                          "provider_rate": None,
                          "store_rate": store[code],
                          "delta": None,
                          "issue": "missing_in_provider",
                      })

          if not provider or not store:
              verdict = "NO_DATA"
          elif mismatches:
              verdict = "MISMATCH"
          else:
              verdict = "IN_SYNC"

          jurisdictions_checked = int(jurisdictions_checked)
          max_delta = float(round(max_delta, 6))

          print("rate source=%s tolerance=%s checked=%d mismatches=%d max_delta=%s verdict=%s" % (
              source, tolerance, jurisdictions_checked, len(mismatches), max_delta, verdict))
          print("::" + json.dumps({"outputs": {"verdict": verdict, "mismatches": mismatches, "jurisdictions_checked": jurisdictions_checked, "max_delta": max_delta}}) + "::")

  # --- 5. mismatch gate ---
  - id: mismatch_gate
    type: io.kestra.plugin.core.flow.If
    description: Escalate whenever the run cannot certify the sync, a difference above tolerance, a jurisdiction present on only one side, or rate files that could not be read at all.
    condition: "{{ (outputs.compare_rates.vars.mismatches | length) > 0 or outputs.compare_rates.vars.verdict == 'NO_DATA' }}"
    then:
      # --- 6. diff table ---
      - id: open_diff_issue
        type: io.kestra.plugin.github.issues.Create
        description: Open a labeled issue holding a markdown diff table of every drifted jurisdiction with its provider rate, store rate, delta and problem, so the fix leaves a backlog record.
        oauthToken: "{{ secret('GITHUB_TOKEN') }}"
        repository: "{{ inputs.github_repository }}"
        title: "Tax rate sync drift - {{ outputs.compare_rates.vars.mismatches | length }} difference(s), verdict {{ outputs.compare_rates.vars.verdict }}"
        body: |
          ## Tax rate sync differences

          | Jurisdiction | Provider rate | Store rate | Delta | Problem |
          | --- | --- | --- | --- | --- |
          {% for row in outputs.compare_rates.vars.mismatches %}| {{ row.jurisdiction }} | {{ row.provider_rate | default('-') }} | {{ row.store_rate | default('-') }} | {{ row.delta | default('-') }} | {{ row.issue }} |
          {% endfor %}

          Verdict `{{ outputs.compare_rates.vars.verdict }}`, {{ outputs.compare_rates.vars.jurisdictions_checked }} jurisdiction(s) checked, largest delta {{ outputs.compare_rates.vars.max_delta }} against a tolerance of {{ inputs.tolerance }}.

          Execution `{{ execution.id }}`.

          ### Next steps

          - Re-run the nightly tax sync so the store export picks up the provider rate card.
          - Confirm the jurisdiction is not intentionally configured with a local rate override.
          - Raise the `tolerance` input only when a rounding difference is expected.

        labels:
          - tax-rates
          - sync-qa

      # --- 7. channel alert ---
      - id: alert_sync_drift
        type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
        description: Tell the finance ops channel how many jurisdictions drifted, the largest delta and where the diff table was filed.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": "Tax rate sync drift: verdict {{ outputs.compare_rates.vars.verdict }}, {{ outputs.compare_rates.vars.mismatches | length }} difference(s) across {{ outputs.compare_rates.vars.jurisdictions_checked }} jurisdiction(s), largest delta {{ outputs.compare_rates.vars.max_delta }} against tolerance {{ inputs.tolerance }}. Diff table opened in {{ inputs.github_repository }}. Execution {{ execution.id }}."
          }
    else:
      # --- 8. all clear ---
      - id: log_in_sync
        type: io.kestra.plugin.core.log.Log
        description: Record the certified outcome so the execution history proves which rate card was checked and how far apart the two sides sat.
        message: "Tax rates in sync - verdict {{ outputs.compare_rates.vars.verdict }}, {{ outputs.compare_rates.vars.jurisdictions_checked }} jurisdiction(s) checked, largest delta {{ outputs.compare_rates.vars.max_delta }} under tolerance {{ inputs.tolerance }}, nothing to escalate."

errors:
  - id: notify_failure
    type: io.kestra.plugin.notifications.slack.SlackIncomingWebhook
    description: Escalate any failure to the ops channel with the execution url.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {"text": "FAILED: {{ flow.id }} {{ execution.id }}"}

outputs:
  - id: verdict
    type: STRING
    value: "{{ outputs.compare_rates.vars.verdict }}"
  - id: mismatches
    type: ARRAY
    value: "{{ outputs.compare_rates.vars.mismatches | toJson }}"
  - id: jurisdictions_checked
    type: INT
    value: "{{ outputs.compare_rates.vars.jurisdictions_checked }}"
  - id: max_delta
    type: FLOAT
    value: "{{ outputs.compare_rates.vars.max_delta }}"

extend:
  title: Certify the Nightly Tax Rate Sync Before an Invoice Uses a Stale Rate
  metaTitle: Nightly Tax Rate Sync QA with GitHub and Slack
  shortDescription: Diffs the provider rate card against the store export after the nightly tax sync, files a GitHub diff table and pings Slack when a jurisdiction drifts.
  metaDescription: Diff the nightly provider rate card against the store export, flag rate deltas and missing jurisdictions past tolerance, escalate through GitHub and Slack.
  description: |
    ## How it works

    1. `nightly_sync_complete` (`io.kestra.plugin.core.trigger.Webhook`, keyed with the `TAX_SYNC_WEBHOOK_KEY` secret) starts a check the moment the nightly tax sync finishes importing rates. `daily_backstop` (`io.kestra.plugin.core.trigger.Schedule`, cron `0 6 * * *`) is the morning net and ships `disabled: true` until an operator turns it on for the case where the webhook never fired.
    2. `rate_workspace` (`io.kestra.plugin.core.flow.WorkingDirectory`) opens one shared directory so the fixtures, the live response and the comparison all read the same files.
    3. `write_rate_fixtures` (`io.kestra.plugin.scripts.shell.Commands`) writes `provider-rates.json` with six jurisdictions (FR, GB, DE, US-CA, JP, AU) and `store-rates.json` with only five. Great Britain is missing from the store and France is priced at 0.202 instead of 0.20, the two defects this run exists to catch.
    4. `fetch_provider_rates` (`io.kestra.plugin.core.http.Request`) calls `GET https://api.taxrates.example.com/v1/rates` with a `Bearer` token from the `TAX_PROVIDER_TOKEN` secret. `options.allowFailed: true` with an exponential retry means a provider outage degrades to the fixture rather than failing the verification.
    5. `compare_rates` (`io.kestra.plugin.scripts.python.Script`) prefers the live response handed over in `PROVIDER_BODY`, falls back to `provider-rates.json` when the API gave nothing usable, then diffs both sides jurisdiction by jurisdiction. A rate outside `tolerance`, a jurisdiction present on only one side, or files that cannot be read decide the verdict, printed as one `::{"outputs": ...}::` line carrying `verdict`, `mismatches`, `jurisdictions_checked` and `max_delta`.
    6. `mismatch_gate` (`io.kestra.plugin.core.flow.If`) branches on `mismatches | length > 0` or a `NO_DATA` verdict, because a comparison that never ran must not read as a pass. The escalation branch opens `open_diff_issue` (`io.kestra.plugin.github.issues.Create`) with the markdown diff table and posts `alert_sync_drift` (`io.kestra.plugin.notifications.slack.SlackIncomingWebhook`) to the channel, while the other branch records `log_in_sync`.
    7. The flow level `errors` handler (`io.kestra.plugin.notifications.slack.SlackIncomingWebhook`) reports any failure with the execution id, since a broken check looks exactly like a clean rate card in the logs.

    ## What you get

    - `verdict` (STRING): `MISMATCH` when at least one jurisdiction drifted, `IN_SYNC` when every rate sits inside tolerance, `NO_DATA` when neither side could be read.
    - `mismatches` (ARRAY): one object per problem with `jurisdiction`, `provider_rate`, `store_rate`, `delta` and an `issue` of `rate_delta`, `missing_in_store` or `missing_in_provider`.
    - `jurisdictions_checked` (INT): how many jurisdictions were compared, the denominator behind the verdict.
    - `max_delta` (FLOAT): the largest absolute rate difference seen, worth charting even while it stays under tolerance.
    - A GitHub issue holding the diff table plus a Slack message with the counts whenever the store disagrees with the provider, and a single log line when it does not.

    ## Who it's for

    - Finance and tax owners who guard the rate card and cannot afford a checkout charging 20.2 percent VAT in France.
    - E-commerce platform engineers who wire the nightly tax sync into the store configuration and want proof the import landed correctly.
    - Ops leads who would rather read a ticket and a channel message than discover the drift in a month end reconciliation.

    ## Why orchestrate this with Kestra

    Comparing two rate tables by hand the morning after the sync only works when somebody remembers to do it, and it produces no record either way. Kestra supplies the webhook from the sync job and the disabled morning backstop, the shared workspace that keeps the fixtures beside the live response, the branch that separates a certified rate card from a drifted one, and GitHub plus Slack routing from one versioned file. The verdict, the mismatch list, the jurisdictions checked and the largest delta are typed outputs, so a checkout gate or a dashboard can read the state without scraping logs, and the `errors` handler keeps a broken run visible.

    ## Prerequisites

    - A Kestra worker with python available to the process runner and outbound HTTPS access to the provider endpoint.
    - A provider account exposing `GET /v1/rates` as a flat list of jurisdiction and rate objects, or a stub of that endpoint while you trial the flow.
    - A GitHub token able to open issues in the repository named by `github_repository` (classic PAT scope `repo`, or fine-grained **Issues: write**).
    - A Slack incoming webhook for the drift alert and for failure alerts.

    ### Secrets

    - `TAX_SYNC_WEBHOOK_KEY`: key segment guarding the webhook URL, so only the nightly sync job can start a check.
    - `TAX_PROVIDER_TOKEN`: bearer token sent to the provider rate endpoint by `fetch_provider_rates`.
    - `GITHUB_TOKEN`: token used by `open_diff_issue` to file the diff table.
    - `SLACK_WEBHOOK_URL`: Slack incoming webhook URL for the drift alert and for failure alerts.

    ## Quick start

    1. Add the four secrets to your namespace and import the flow.
    2. Run once with the default inputs and confirm `verdict` reads `MISMATCH`, `mismatches` carries the FR rate delta and the missing GB entry, `jurisdictions_checked` reads 6 and `max_delta` reads 0.002.
    3. Point `github_repository` at a repository where issues are welcome, then re-run with `tolerance` at 0.01 to watch France pass while Great Britain still fails on the missing entry.
    4. Trigger `nightly_sync_complete` at `/api/v1/{tenant}/executions/webhook/{namespace}/tax-rate-sync-qa/{TAX_SYNC_WEBHOOK_KEY}`, or set `disabled: false` on `daily_backstop` once the token and webhook are in place.

    ## How to extend

    - Replace the heredoc export with a `io.kestra.plugin.jdbc.duckdb.Query` or a `io.kestra.plugin.jdbc.postgresql.Queries` task that reads the store rates straight from the database, keeping the same python diff.
    - Loop the mismatch list with `io.kestra.plugin.core.flow.Loop` to open one issue per jurisdiction when the finance team wants per-country ownership.
    - Persist every run's `max_delta` to a time series table to chart drift long before it crosses the tolerance.

    ## Links

    - [Kestra HTTP request task](https://kestra.io/plugins/core/tasks/http/io.kestra.plugin.core.http.request)
    - [Kestra GitHub plugin](https://kestra.io/plugins/plugin-github)
    - [Kestra Slack plugin](https://kestra.io/plugins/plugin-slack)
    - [Kestra flow triggers](https://kestra.io/docs/concepts/triggers)
  tags:
    - Business
    - Data
  subTags:
    - tax-rates
    - data-quality
    - rate-management
    - notifications
  ee: false
  demo: false
