id: mysql-metadata-lock-blocking-session-terminator
namespace: company.database

description: |
  Inspect MySQL sys.schema_table_lock_waits for sessions holding table metadata locks (MDL)
  that block concurrent DDL and DML operations, track blocker persistence across runs in Kestra KV,
  gate remediation behind an interactive operator approval Pause, terminate blocking connections via
  KILL CONNECTION, and verify complete lock queue clearance.

inputs:
  - id: mysql_url
    type: STRING
    defaults: "jdbc:mysql://localhost:3306/"
    description: JDBC connection URL for the target MySQL server (e.g. jdbc:mysql://localhost:3306/). Connecting role requires PROCESS and CONNECTION_ADMIN (or SUPER) privileges.

  - id: use_secret_auth
    type: BOOL
    defaults: true
    description: When true, retrieves database credentials from Kestra namespace secrets MYSQL_USERNAME and MYSQL_PASSWORD. Set false only to pass credentials inline for test environments.

  - id: mysql_username
    type: STRING
    defaults: "root"
    description: Database username used only when use_secret_auth is false. Ignored in production.

  - id: mysql_password
    type: STRING
    defaults: ""
    description: Database user password used only when use_secret_auth is false. Ignored in production.

  - id: min_wait_seconds
    type: INT
    defaults: 30
    description: Minimum duration in seconds that downstream queries must be waiting for a metadata lock before the root blocking session is flagged.

  - id: exclude_users
    type: ARRAY
    itemType: STRING
    defaults:
      - "root"
      - "system user"
      - "event_scheduler"
    description: List of critical database usernames whose sessions must never be killed by automated remediation.

  - id: max_kills
    type: INT
    defaults: 5
    description: Safety ceiling on the maximum number of blocker connections permitted to be terminated in a single execution pass.

  - id: cursor_key
    type: STRING
    defaults: "mysql_mdl_blocker_history"
    description: Kestra KV key used to track blocker thread IDs and observation timestamps across consecutive runs.

  - id: dry_run
    type: BOOL
    defaults: true
    description: When true, evaluates metadata lock contention and logs proposed KILL CONNECTION actions without terminating any database connections.

  - id: auto_remediate
    type: BOOL
    defaults: false
    description: When true and dry_run is false, pauses for operator approval and executes KILL CONNECTION on verified blocker sessions.

triggers:
  - id: periodic_mdl_audit
    type: io.kestra.plugin.core.trigger.Schedule
    description: Poll for metadata lock wait bottlenecks every 5 minutes. Initialized disabled so the flow can be verified manually in safe mode first.
    cron: "*/5 * * * *"
    disabled: true
    inputs:
      dry_run: true
      auto_remediate: false

  - id: on_demand_mdl_webhook
    type: io.kestra.plugin.core.trigger.Webhook
    description: Authenticated HTTP endpoint invoked by database monitoring alarms, Prometheus Alertmanager, or incident response runbooks.
    key: "{{ secret('MYSQL_MDL_GUARD_WEBHOOK_KEY') }}"

tasks:
  - id: validate_inputs
    type: io.kestra.plugin.core.execution.Assert
    description: Assert operational thresholds satisfy sanity limits before issuing database queries.
    conditions:
      - "{{ inputs.min_wait_seconds >= 5 }}"
      - "{{ inputs.max_kills >= 1 }}"
    errorMessage: "Invalid configuration: min_wait_seconds must be at least 5 and max_kills must be at least 1."

  - id: detect_blockers
    type: io.kestra.plugin.jdbc.mysql.Query
    description: Query sys.schema_table_lock_waits joined with information_schema.processlist to identify the root blocking session holding table metadata locks.
    url: "{{ inputs.mysql_url }}"
    username: "{{ inputs.use_secret_auth ? secret('MYSQL_USERNAME') : inputs.mysql_username }}"
    password: "{{ inputs.use_secret_auth ? secret('MYSQL_PASSWORD') : inputs.mysql_password }}"
    fetchType: FETCH
    sql: |
      SELECT
          w.object_schema,
          w.object_name,
          w.blocking_pid,
          SUBSTRING_INDEX(w.blocking_account, '@', 1) AS blocker_user,
          SUBSTRING_INDEX(w.blocking_account, '@', -1) AS blocker_host,
          COALESCE(p.COMMAND, 'Sleep') AS blocker_command,
          COALESCE(p.STATE, '') AS blocker_state,
          COALESCE(p.TIME, 0) AS blocker_time_secs,
          COALESCE(p.INFO, '') AS blocker_query,
          w.blocking_lock_type,
          w.blocking_lock_duration,
          COUNT(DISTINCT w.waiting_pid) AS waiting_session_count,
          MAX(w.waiting_query_secs) AS max_waiting_secs,
          CONCAT('KILL CONNECTION ', w.blocking_pid) AS kill_sql
      FROM sys.schema_table_lock_waits w
      LEFT JOIN information_schema.processlist p ON p.ID = w.blocking_pid
      WHERE w.waiting_query_secs >= {{ inputs.min_wait_seconds }}
        AND w.object_schema NOT IN ('mysql', 'information_schema', 'performance_schema', 'sys')
      GROUP BY w.object_schema, w.object_name, w.blocking_pid, w.blocking_account, p.COMMAND, p.STATE, p.TIME, p.INFO, w.blocking_lock_type, w.blocking_lock_duration
      ORDER BY max_waiting_secs DESC

  - id: compute_targets
    type: io.kestra.plugin.core.output.OutputValues
    description: Filter out excluded administrative users, enforce the maximum kill ceiling, and correlate blocker persistence against the Kestra KV cursor.
    values:
      summary: >-
        {{ {
          'rows': (outputs.detect_blockers.rows ?? []),
          'exclude_users': inputs.exclude_users,
          'max_kills': inputs.max_kills,
          'cursor': (kv(inputs.cursor_key, errorOnMissing=false) ?? {})
        } | toJson | jq('
          . as $in |
          ($in.rows // []) as $rows |
          ($in.cursor | if type=="string" then (if .=="" then {} else fromjson end) else . end) as $prior |
          (now | floor) as $t |
          ($rows | map(select(.blocker_user as $u | ($in.exclude_users | index($u) | not)))) as $eligible |
          ($eligible[0:$in.max_kills]) as $targets |
          ($targets | map({((.blocking_pid | tostring)): ($prior[(.blocking_pid | tostring)] // $t)}) | add // {}) as $nc |
          {
            "detected_count": ($rows | length),
            "eligible_count": ($eligible | length),
            "target_count": ($targets | length),
            "new_cursor": $nc,
            "targets": $targets
          }
        ') | first | toJson }}

  - id: save_cursor
    type: io.kestra.plugin.core.kv.Set
    description: Persist the active blocker observation cursor in Kestra KV store to track multi-run lock contention trends.
    key: "{{ inputs.cursor_key }}"
    value: "{{ fromJson(outputs.compute_targets.values.summary).new_cursor | toJson }}"

  - id: log_detection_status
    type: io.kestra.plugin.core.log.Log
    description: Record operational summary of detected metadata lock contention and targeted blocker sessions.
    message: |
      MySQL Metadata Lock Guard on {{ inputs.mysql_url }}:
      Detected {{ fromJson(outputs.compute_targets.values.summary).detected_count }} blocker group(s), {{ fromJson(outputs.compute_targets.values.summary).target_count }} eligible for termination (ceiling: {{ inputs.max_kills }}).
      Operational Mode: dry_run={{ inputs.dry_run }}, auto_remediate={{ inputs.auto_remediate }}.
      Targeted Sessions: {{ fromJson(outputs.compute_targets.values.summary).targets | toJson }}

  - id: branch_on_blockers
    type: io.kestra.plugin.core.flow.If
    description: Evaluate whether active blocker sessions holding table metadata locks were identified.
    condition: "{{ fromJson(outputs.compute_targets.values.summary).target_count > 0 }}"
    then:
      - id: alert_blockers_slack
        type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
        description: Broadcast high-priority operational triage notification to Slack detailing blocked tables and offending blocker threads.
        url: "{{ secret('SLACK_WEBHOOK_URL') }}"
        payload: |
          {
            "text": ":warning: *MySQL Metadata Lock Blocker Detected*\n*Instance:* `{{ inputs.mysql_url }}`\n*Targeted Blockers:* `{{ fromJson(outputs.compute_targets.values.summary).target_count }}` session(s)\n*Mode:* `dry_run={{ inputs.dry_run }}`, `auto_remediate={{ inputs.auto_remediate }}`\n*Offenders:*\n```{{ fromJson(outputs.compute_targets.values.summary).targets | jq('map(\"PID: \" + (.blocking_pid|tostring) + \" | User: \" + .blocker_user + \"@\" + .blocker_host + \" | Table: \" + .object_schema + \".\" + .object_name + \" | Waiting: \" + (.waiting_session_count|tostring) + \" queries (max \" + (.max_waiting_secs|tostring) + \"s)\") | join(\"\n\")') | first }}```\n*Execution:* `{{ execution.id }}`"
          }

      - id: evaluate_remediation_mode
        type: io.kestra.plugin.core.flow.If
        description: Check whether automated remediation is armed and dry-run mode is disabled.
        condition: "{{ inputs.auto_remediate and not inputs.dry_run }}"
        then:
          - id: pause_for_operator_approval
            type: io.kestra.plugin.core.flow.Pause
            description: Hold workflow execution for human operator sign-off before terminating active database connections.
            pauseDuration: PT1H
            behavior: FAIL
            onResume:
              - id: approved
                type: BOOL
                required: false
                description: Set true to confirm execution of KILL CONNECTION against the targeted blocker sessions.

          - id: branch_on_approval
            type: io.kestra.plugin.core.flow.If
            description: Execute termination only if explicit human approval was provided during the pause gate.
            condition: "{{ outputs.pause_for_operator_approval.onResume.approved ?? false }}"
            then:
              - id: terminate_blocker_sessions
                type: io.kestra.plugin.core.flow.Loop
                description: Iterate sequentially over targeted blocker sessions and issue KILL CONNECTION statements.
                concurrencyLimit: 1
                values: "{{ fromJson(outputs.compute_targets.values.summary).targets | toJson }}"
                tasks:
                  - id: kill_single_connection
                    type: io.kestra.plugin.jdbc.mysql.Query
                    description: Execute KILL CONNECTION for one targeted blocker session. allowFailure ensures a session that naturally disconnected during the approval pause does not abort the entire pass.
                    allowFailure: true
                    url: "{{ inputs.mysql_url }}"
                    username: "{{ inputs.use_secret_auth ? secret('MYSQL_USERNAME') : inputs.mysql_username }}"
                    password: "{{ inputs.use_secret_auth ? secret('MYSQL_PASSWORD') : inputs.mysql_password }}"
                    fetchType: NONE
                    sql: "{{ fromJson(item.value).kill_sql }}"

              - id: settle_lock_release
                type: io.kestra.plugin.core.flow.Sleep
                description: Pause for 2 seconds to allow MySQL thread teardown and metadata lock release to propagate across waiting connections.
                duration: PT2S

              - id: reverify_lock_waits
                type: io.kestra.plugin.jdbc.mysql.Query
                description: Re-query sys.schema_table_lock_waits to prove the targeted blocker sessions have been terminated and waiting queries unblocked.
                url: "{{ inputs.mysql_url }}"
                username: "{{ inputs.use_secret_auth ? secret('MYSQL_USERNAME') : inputs.mysql_username }}"
                password: "{{ inputs.use_secret_auth ? secret('MYSQL_PASSWORD') : inputs.mysql_password }}"
                fetchType: FETCH
                sql: |
                  SELECT
                      blocking_pid,
                      object_schema,
                      object_name,
                      COUNT(DISTINCT waiting_pid) AS waiting_session_count
                  FROM sys.schema_table_lock_waits
                  WHERE object_schema NOT IN ('mysql', 'information_schema', 'performance_schema', 'sys')
                  GROUP BY blocking_pid, object_schema, object_name

              - id: compute_verification_results
                type: io.kestra.plugin.core.output.OutputValues
                description: Calculate whether any targeted blocker PID or table remains in an active lock wait state after remediation.
                values:
                  summary: >-
                    {{ {
                      'targets': fromJson(outputs.compute_targets.values.summary).targets,
                      'remaining': (outputs.reverify_lock_waits.rows ?? [])
                    } | toJson | jq('
                      . as $in |
                      ($in.targets | map(.blocking_pid)) as $target_pids |
                      ($in.remaining | map(.blocking_pid)) as $remaining_pids |
                      [ $target_pids[] | select(. as $p | $remaining_pids | index($p)) ] as $uncleared |
                      {
                        "remaining_total": ($in.remaining | length),
                        "uncleared_targeted_count": ($uncleared | length),
                        "uncleared_pids": $uncleared
                      }
                    ') | first | toJson }}

              - id: assert_blockers_cleared
                type: io.kestra.plugin.core.flow.If
                description: Fail execution loudly if any targeted blocker session resisted termination and continues to hold metadata locks.
                condition: "{{ fromJson(outputs.compute_verification_results.values.summary).uncleared_targeted_count > 0 }}"
                then:
                  - id: fail_uncleared_blocker
                    type: io.kestra.plugin.core.execution.Fail
                    description: Abort execution with explicit error details identifying unreleased blocker connections.
                    errorMessage: "Post-remediation verification failed: Targeted MySQL blocker PID(s) {{ fromJson(outputs.compute_verification_results.values.summary).uncleared_pids | toJson }} are still holding metadata locks in sys.schema_table_lock_waits."
                else:
                  - id: notify_resolution_slack
                    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
                    description: Dispatch confirmation notification to Slack verifying that blocker sessions were terminated and lock queues unblocked.
                    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
                    payload: |
                      {
                        "text": ":white_check_mark: *MySQL Metadata Lock Blocker Remediated*\n*Instance:* `{{ inputs.mysql_url }}`\n*Terminated Sessions:* `{{ fromJson(outputs.compute_targets.values.summary).target_count }}` connection(s)\n*Post-Check:* Lock queues verified clear. Zero targeted blockers lingering in `sys.schema_table_lock_waits`.\n*Execution:* `{{ execution.id }}`"
                      }
            else:
              - id: log_approval_declined
                type: io.kestra.plugin.core.log.Log
                description: Record that operator declined connection termination approval.
                message: "Operator declined approval for KILL CONNECTION. Targeted blocker sessions were preserved without modification."
        else:
          - id: log_dry_run_summary
            type: io.kestra.plugin.core.log.Log
            description: Output dry-run execution summary detailing what statements would be executed in remediation mode.
            message: |
              Dry-run mode active (dry_run={{ inputs.dry_run }}, auto_remediate={{ inputs.auto_remediate }}).
              Proposed remediation statements:
              {{ fromJson(outputs.compute_targets.values.summary).targets | jq('map(.kill_sql) | join("\n")') | first }}
    else:
      - id: log_healthy_state
        type: io.kestra.plugin.core.log.Log
        description: Confirm nominal database health when no metadata lock contention is detected.
        message: "MySQL metadata lock health nominal on {{ inputs.mysql_url }}. Zero blocking sessions holding table metadata locks exceeding {{ inputs.min_wait_seconds }}s."

errors:
  - id: alert_execution_failure
    type: io.kestra.plugin.slack.notifications.SlackIncomingWebhook
    description: Dispatch emergency alert to Slack if an unexpected database or plugin error occurs.
    url: "{{ secret('SLACK_WEBHOOK_URL') }}"
    payload: |
      {
        "text": ":rotating_light: *Flow Execution Failed*: `mysql-metadata-lock-blocking-session-terminator` (Execution: `{{ execution.id }}`).\nFailed to inspect metadata lock waits or execute remediation on `{{ inputs.mysql_url }}`. Check database connectivity, user privileges (PROCESS, CONNECTION_ADMIN), and worker logs."
      }

outputs:
  - id: detected_blockers_count
    type: INT
    value: "{{ fromJson(outputs.compute_targets.values.summary).detected_count ?? 0 }}"

  - id: targeted_blockers_count
    type: INT
    value: "{{ fromJson(outputs.compute_targets.values.summary).target_count ?? 0 }}"

  - id: targets
    type: JSON
    value: "{{ fromJson(outputs.compute_targets.values.summary).targets ?? [] }}"

  - id: status
    type: STRING
    value: "{{ (fromJson(outputs.compute_targets.values.summary).target_count ?? 0) > 0 ? ((inputs.auto_remediate and not inputs.dry_run and (outputs.pause_for_operator_approval.onResume.approved ?? false)) ? 'REMEDIATED' : 'BLOCKERS_DETECTED') : 'HEALTHY' }}"

extend:
  title: Terminate Idle MySQL Sessions Blocking Table Metadata Locks and Connection Pool
  metaTitle: Terminate MySQL Metadata Lock Blocker Sessions with Kestra
  shortDescription: Detect MySQL sessions holding table metadata locks and blocking concurrent DDL or queries, pause for operator approval, terminate the blocker, and verify queue clearance.
  metaDescription: Terminate idle MySQL sessions holding table metadata locks. Inspect sys.schema_table_lock_waits, pause for approval, kill blocker, and verify with Kestra.
  description: |
    In MySQL applications utilizing the InnoDB storage engine, uncommitted transactions holding table metadata locks (MDL) pose severe operational hazards. When an application initiates a transaction, executes a query, and leaves the session idle without issuing an explicit `COMMIT` or `ROLLBACK`, it holds a shared metadata lock on the referenced table.

    If an operator or automated migration tool concurrently issues a Data Definition Language (DDL) statement--such as `ALTER TABLE`, `CREATE INDEX`, `OPTIMIZE TABLE`, or `DROP TABLE`--the DDL operation is forced into a `Waiting for table metadata lock` state. Because MySQL prioritizes metadata lock requests in strict First-In, First-Out (FIFO) queue order, every subsequent query (including simple point reads, inserts, and updates) targeting that table queues behind the pending DDL.

    Within seconds, available connections saturate up to `max_connections`, the database stops accepting new application traffic, and microservices experience cascading `Too many connections` (Error 1040) failures. Standard `SHOW PROCESSLIST` queries reveal dozens of threads stuck in `Waiting for table metadata lock`, but do not clearly identify which sleeping connection is the root blocker.

    This blueprint provides an automated sentinel and remediation guard that queries MySQL's built-in `sys.schema_table_lock_waits` view, isolates the root blocking connection ID, tracks blocker persistence across runs in Kestra KV, pauses for operator sign-off via an interactive `Pause` approval gate, terminates the blocking connection with `KILL CONNECTION`, and verifies that waiting queries are immediately unblocked.

    ## How it works

    1. **Pre-flight Assertion**: The workflow asserts that input parameters meet sanity limits, ensuring `min_wait_seconds >= 5` and `max_kills >= 1` via `io.kestra.plugin.core.execution.Assert`.
    2. **Metadata Lock Contention Inspection**: `io.kestra.plugin.jdbc.mysql.Query` queries `sys.schema_table_lock_waits` joined with `information_schema.processlist` to extract the root blocking connection (`blocking_pid`), the blocker's user account, host, command state, idle duration, the target schema and table, and the count of starved downstream sessions.
    3. **Target Filtering and Trend Tracking**: `io.kestra.plugin.core.output.OutputValues` parses the detected rows, filters out protected administrative users specified in `exclude_users` (such as `root`, `event_scheduler`, and replication threads), caps the targets to `max_kills`, and cross-references observation timestamps against previous runs in Kestra KV.
    4. **KV Cursor Persistence**: `io.kestra.plugin.core.kv.Set` writes active blocker identifiers to Kestra KV under `inputs.cursor_key` to maintain operational history across consecutive polling passes.
    5. **Slack Triage Notification**: When blockers are detected, `io.kestra.plugin.slack.notifications.SlackIncomingWebhook` delivers an operational alert card detailing affected tables, blocker PIDs, idle hold durations, and waiting connection counts.
    6. **Interactive Operator Approval Gate**: When `auto_remediate` is enabled and `dry_run` is false, execution halts at `io.kestra.plugin.core.flow.Pause`. The workflow waits for an on-call engineer to review the diagnostic findings and resume with `approved: true`.
    7. **Guarded Connection Termination**: Upon approval, `io.kestra.plugin.core.flow.Loop` iterates over targeted blockers sequentially (`concurrencyLimit: 1`) and executes `KILL CONNECTION <blocking_pid>`. The task permits benign failures (`allowFailure: true`) in case a session disconnected naturally during the review window.
    8. **Lock Release Settle Period**: `io.kestra.plugin.core.flow.Sleep` pauses for 2 seconds to allow MySQL thread cleanup and lock queue drain to complete.
    9. **Post-Remediation Verification Readback**: `io.kestra.plugin.jdbc.mysql.Query` re-queries `sys.schema_table_lock_waits`. If any targeted blocker PID remains active or downstream queries continue to wait, `io.kestra.plugin.core.execution.Fail` fails the run loudly. Otherwise, a resolution card is dispatched to Slack confirming recovery.
    10. **Failure Handling**: A top-level `errors` block catches database connectivity timeouts, authentication errors, or missing privileges and immediately notifies Slack.

    ## What you get

    - Automated discovery of the root blocking connection holding table metadata locks, eliminating guesswork during connection saturation incidents.
    - Protection against cascading database outages caused by DDL operations blocked behind forgotten sleeping transactions.
    - Multi-layered safety controls: `dry_run: true` default, `exclude_users` protection list, `max_kills` blast-radius cap, and an interactive `Pause` approval gate.
    - Persistent state tracking in Kestra KV store under `mysql_mdl_blocker_history` to track repeat offender applications.
    - Verified resolution readback proving that the blocker connection was terminated and table lock queues were cleared.
    - Context-rich Slack triage and resolution cards with table names, thread IDs, and starved query counts.

    ## Who it's for

    - Database Administrators (DBAs) and Site Reliability Engineers (SREs) managing production MySQL and MariaDB clusters.
    - Platform and DevOps engineers running automated schema migrations (Flyway, Liquibase, Rails migrations) in high-concurrency environments.
    - Backend engineers troubleshooting unexplained `Lock wait timeout exceeded` or `Too many connections` errors.

    ## Why orchestrate this with Kestra

    MySQL does not automatically terminate sleeping transactions that block DDL, and naive cron scripts running shell scripts lack human approval gates, audit history, and verification. Orchestrating this guard with Kestra delivers a declarative workflow with built-in state tracking in Kestra KV, native JDBC integration, interactive pause-and-resume approval controls, secure credential management, and automated Slack escalation.

    ## Prerequisites

    - Reachable MySQL instance (version 5.7, 8.0, 8.4, or MariaDB 10.5+) with the `sys` schema and `performance_schema` enabled (default on MySQL 5.7+).
    - Database user account granted `PROCESS` privilege (to inspect processlist) and `CONNECTION_ADMIN` (or `SUPER` on MySQL 5.7) to execute `KILL CONNECTION`.
    - Network connectivity from the Kestra worker to the MySQL port (default 3306).
    - A Slack Incoming Webhook URL to receive incident triage and resolution alerts.

    ### Secrets

    - `MYSQL_USERNAME`: Database username with privileges to query `sys.schema_table_lock_waits` and issue `KILL CONNECTION`.
    - `MYSQL_PASSWORD`: Password for the MySQL user account.
    - `SLACK_WEBHOOK_URL`: Slack Incoming Webhook endpoint URL used for triage alerts and recovery notifications.
    - `MYSQL_MDL_GUARD_WEBHOOK_KEY`: Secret authentication token protecting the on-demand webhook trigger.

    ## Quick start

    1. Configure `MYSQL_USERNAME`, `MYSQL_PASSWORD`, `SLACK_WEBHOOK_URL`, and `MYSQL_MDL_GUARD_WEBHOOK_KEY` in your Kestra namespace secrets.
    2. Import this blueprint and set `mysql_url` to match your target MySQL instance (e.g. `jdbc:mysql://mysql-prod.internal:3306/`).
    3. Run an initial manual execution with default parameters (`dry_run: true`) to audit current metadata lock waits without terminating any sessions.
    4. Review execution logs and Slack triage messages to confirm that `sys.schema_table_lock_waits` queries execute cleanly.
    5. To enable active remediation, run with `auto_remediate: true` and `dry_run: false`. When a blocker is detected, inspect the Slack alert, resume the `pause_for_operator_approval` task with `approved: true`, and observe verified lock queue clearance.
    6. Enable the `periodic_mdl_audit` schedule trigger to maintain automated continuous protection every 5 minutes.

    ## How to extend

    - **Automated PagerDuty Escalation**: Add `io.kestra.plugin.pagerduty.notifications.PagerDutyAlert` when `waiting_session_count` exceeds 50 to escalate urgent P1 incidents.
    - **Multi-Instance Looping**: Wrap the detection and remediation sequence in an `io.kestra.plugin.core.flow.Loop` over an array of MySQL replica and primary endpoints.
    - **Application Pod Recycle**: Combine with `io.kestra.plugin.kubernetes.pod.Delete` to restart microservice pods whose connection pools leaked the uncommitted transaction.

    ## Links

    - [MySQL sys.schema_table_lock_waits Documentation](https://dev.mysql.com/doc/refman/8.0/en/sys-schema-table-lock-waits.html)
    - [MySQL Metadata Locking Overview](https://dev.mysql.com/doc/refman/8.0/en/metadata-locking.html)
    - [MySQL KILL Statement Reference](https://dev.mysql.com/doc/refman/8.0/en/kill.html)
    - [Kestra MySQL Plugin Documentation](https://kestra.io/plugins/plugin-jdbc-mysql)
    - [Kestra KV Store Documentation](https://kestra.io/docs/concepts/kv-store)
    - [Kestra Pause Task Documentation](https://kestra.io/plugins/core/flow/pause)

  tags:
    - Data
    - Infrastructure
  subTags:
    - Day 2 Operations
    - Incident Response
  ee: false
  demo: false
